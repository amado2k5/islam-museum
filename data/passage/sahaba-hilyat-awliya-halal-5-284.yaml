text: "… ترجمون لا يقدر منها أهلها على شيء حتى تفارقهم ويفارقونها أنزل بذلك كتابه، وأنزل بذلك رسله، وقدم فيه بالوعيد، وضرب فيه الأمثال، ووصل به القول، وشرع فيه دينه، وأحل الحلال وحرم الحرام وقص فأحسن القصص، وجعل دينه فى الأولين والآخرين …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 5، ص 284، يذكر الحلال، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 5, p. 284, that mentions the lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 5، ص 284 کا اقتباس جس میں حلال، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
