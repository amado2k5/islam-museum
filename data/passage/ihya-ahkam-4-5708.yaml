text: "… حتى لو لم يكن باعث الرياء لأدى الفرائض ولو لم يكن باعث الفرض لأنشأ صلاة تطوعا ً لأجل الرياء فهذا محل النظر وهو محتمل جد ا ً فيحتمل أن يقال إن الواجب صلاة خالصة لوجه االله ولم يؤد الواجب الخالص …"
summary:
