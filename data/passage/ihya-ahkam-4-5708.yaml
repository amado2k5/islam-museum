text: "… حتى لو لم يكن باعث الرياء لأدى الفرائض ولو لم يكن باعث الفرض لأنشأ صلاة تطوعا ً لأجل الرياء فهذا محل النظر وهو محتمل جد ا ً فيحتمل أن يقال إن الواجب صلاة خالصة لوجه االله ولم يؤد الواجب الخالص …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 5708، يرد فيه ذكر الفريضة والفرائض، والفرض، والواجب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 5708, whose wording mentions the obligation (farida), the obligatory (fard), the obligatory (wajib), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 5708 کا اقتباس جس میں فریضہ اور فرائض، فرض، واجب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din de al-Ghazali, volume numérisé 4, p. 5708, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligatoire (wajib), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen digitalizado 4, p. 5708, cuyo texto menciona la obligación (farida), lo obligatorio (fard), lo obligatorio (wajib), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 5708. sayfasından bir alıntı, farz olan amelleri, görevleri, yükümlülükleri ve gönüllü amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu alıntı, farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 4, halaman 5708, menyebutkan amalan wajib, kewajiban, dan amalan sunnah. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
