text: "… الواجب والمكروه، فكل محرم له حريم يحيط به، والحريم هو المحيط بالحرام كالفخذين: فإنهما حريم للعورة الكبرى: وحريم الواجب، ما لا يتم الواجب إلا به، وأما الإِباحة فلا حريم لها لسعتها، وعدم الحجر فيها. والأصل في ذلك قوله : الحلال …"
