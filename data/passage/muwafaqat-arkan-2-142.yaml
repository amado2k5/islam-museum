text: "… وكذلك الجهاد موضوع لإعلاء كلمة الله، وإن أدّى إلى مفسدة في المال أو النفس. ودفع المحارب مشروع لرفع القتل والقتال، وإن أدّى إلى القتل والقتال. والطلب بالزكاة مشروع لإقامة ذلك الركن من أركان الإسلام، وإن أدّى إلى القتال كما فعله …"
