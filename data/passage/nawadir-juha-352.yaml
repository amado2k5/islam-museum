text: "… الحمد للَّه إذ لم أكن لابساً حذائي الجديد بينما كان الشيخ يحرث، دخلت في رجله شوكةٌ عظيمةٌ آلمتَهُ كثيراً، فغسل رِجله بالماء الباردِ ولفَّها، وقال : الحمد للَّه إذ لم أكِّنْ لابساً حذائي الجديد الذي اشتريته أمس. لو كنت في …"
summary:
  ar: "أثناء الحراثة اخترقت شوكة قدم جحا، فغسلها وحمد الله لأنه لم يكن لابساً حذاءه الجديد. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  en: "While ploughing a thorn pierces Juha's foot; he washes it and thanks God he was not wearing his new shoes. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  ur: "ہل چلاتے ہوئے جحا کے پاؤں میں کانٹا چبھ گیا، اس نے اسے دھویا اور اللہ کا شکر ادا کیا کہ اس نے اپنے نئے جوتے نہیں پہنے تھے۔ {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  fr: "En labourant, une épine perce le pied de Juha ; il le lave et remercie Dieu de ne pas porter ses chaussures neuves. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  es: "Mientras ara, una espina le atraviesa el pie a Juha; se lo lava y da gracias a Dios de no llevar puestos sus zapatos nuevos. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
