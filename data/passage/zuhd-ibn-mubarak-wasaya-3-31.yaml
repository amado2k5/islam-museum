text: "… بن سيرين قال : كنا عند أبى هريرة وعليه ثوبان ممشقان من كتان فمخط فى أحدهما ثم قال : بخ بخ يتمخط أبو هريرة فى الكتان لقد رأيتنى وإنى لأخر فيما بين منبر رسول الله ه وحجرة عائشة من الجوع …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 31، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 31, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 31 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ibn al-Mubarak, volumen 3, pág. 31, que menciona una reliquia conservada tras su propietario, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Kitab al-Zuhd d'Ibn al-Mubarak (tome 3, p. 31) mentionnant une relique conservée après son propriétaire, une sépulture ou un lieu de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 31. sayfasında, korunmuş bir kutsal emanet, bir mezar yeri, bir türbe ve bir mabetten bahsedilmektedir; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve mabetler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Kemelekatan), Jilid 3, halaman 31, menyebutkan sebuah relik yang terpelihara, sebuah tempat pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, relik, dan makam."
