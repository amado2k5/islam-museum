text: "… : وفى هذا من الفقه التنبيه على الأَخذ بالحزم مع صِحَّة التوكل وأَن الإيمان بالقَدَر كما رُوِى عن وَهْب بن مُنَبِّه لا يمنع الحَزْم من تَوَقِّى المهالك، قال وهب : وَجَدْتُه فى سبعين كتاباً من كتب اللّٰه القديمة، وهذا نحو …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 2، ص 148، يذكر الإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 2, p. 148, that mentions belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
