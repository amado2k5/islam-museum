text: |-
  قيا)
  ١٩
  مورّثة مالاوفى الاصل رفعة * لماضاع فيهلعن قروءنسائكا
  وأقرأت المرأة حاضت فهى مقرئ و"قرأت طهرت وقال الاخفش أة رأت المرأة اذاصارت
  صاحبة حبض فاذاحاضت قلت قرأت بلا ألف يقال قرأت المرأة حيضة أو حيضتين والقره
  انقضاء الحيض قال وقال بعضهم مابين الحيضتين وأقرأت حاجتك دنت والقارئ الوقت
  تقول منه أقرأت الريح اذا دخلت فى وقتها قال الهذلى اذاهبت لقارما الرياح أى لوقتها
  واسترأ المل الناقة اذا تاركها لينظر ألقحت أم لا قال أبو عم روبن العلاء يقال دفع فلان
  جاريته الى فلانة تقرتها أى تسكها عندها حتى تحيض للاستبراء قال وانما القر الوقت
  فقد يكون للمحيض وقديكون للطهر قال الشاعر
  اذا ما السماء لم تغم ثم أخلفت * قرو الثريا أن يكون لها قطر
  يريدوقت نوتها الذى بمطرفيه الناس يقال أقرأت النجوم اذا تأخر مطرها وقرأت الشئقرآنا
  جعته وضمت بعضه الى بعض ومنه قولهم ما قرأت هذه الناقة سلى قط ماقبرأت جنينا
  أى لم تضم رحها على ولد وقرأت الكتاب قراءة وقرانا ومنه سمى القرآن وقال أبو عبيد
  سمى القبرآن لانه يجمع السور فيضمها وقوله تعالى انّ علينا جعه وقرآنه أى معه وقراءته
  فاذا قر أناه فاتبع قرآنه أى قراءته قال ابن عباس فاذا بيناه لك بالقراءة فاعمل بما بيناه لك
  وفلان قرأعليك السلام وأقرأن السلام بمعى وأقرأه القرآن فهومرئ وجمع القارئ
  قرأة مشال كافر وكفرة والقرّاء الرجل المننسك وقد تقرأ أى تنسك والجمع القراءون
  قال الفراء أنشدنى أبو صدقة الدبيرى
  يضاء تصطاد الغوى وتستى * بالحسن قلب المسلم القرّاء
  قديكون القراء حمالقارى والقرأة بالكسر مثال القرعة الوباء قال الاصعمى اداقدمت
  لادافكنت بها نخس عشرة فقد ذهمت عنك قرأة البلاد قال وأهل الجاز يقولون قرة
  بغير همز ومعناه انه اذا حرض بها بعد ذلك فليس من وبأ البلد ⁦(قضأ)⁩ الاموى "قضئت
  الشئ أفضأه قضأ أكلته وأقضأت الرجل أطعمته أبو زيديقال قضئت القربة تقضأقضأ
  بالتحريك عفنت وتها فتت وهى قربة قضئة والثوب يقضأ من طول الثدا والطىّ وما عليك
  فى هذا الامر قضأة بالضم مثال مضغة أى عار وتكح فلان فى قضأة وفى عينه قضأة أى قساد
  وفى حسبه قضأة أى عيب قال الشاعر
  تعيرتى سلمى وليس بقضأة * ولو كنت من سمى تفرعت دارما
  وسلمى حى من دارم ⁦(قأ )⁩ أبوز يدقأت الماشية تقمأقواوقوءة اذاسمنت وقؤالرجل
  بالضم قاء وقاءة صارة بشا وهو الصغير الذليل وأتمأته صغرته وذللته فه وقى على فعيل وأقاً
  القوم أى سمنت ايلهم وأقأنى الشئ أعجبي وتقمأت الشئ بجعته شيئا بعدشئ قال الشاعر
  لقدقضيت فلاتستهزئاسفها • عماتقماته من لذة وطرى
  وعمروبن قيئة الشاعر على فعيلة ( نأ قنأ الرج-ل لحيته بالحضاب تقنئة ولقد قنأت
  هى من الخضاب تَقَفاقنوا لشنّدّت حرتها وقال الاسود ين يعفر
  يسعى بهاذوتومتين مشمر • قفأت انامله من الفرصاد
  ١ مراداتهالم يطرقها فحل اه
