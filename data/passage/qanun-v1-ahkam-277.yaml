text: "… قريب العهد بالفصد فشرب الدواء أوفق له. وكثيراً ما أوقع شرب الدواء الواجب كان فيه الفصد في حمّى واضطراب، فإن لم يسكّن بالمسكّنات، فليعلم أنه كان يجب أن يقدم عليه الفصد وليس كل استفراغ يحتاج إليه لفرط الامتلاء، بل قد …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 277، يرد فيه ذكر الواجب، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 277, whose wording mentions the obligatory (wajib), what must be done; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج1، ص 277 کا اقتباس جس میں واجب، جو واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
