label: { ar: "جامع الترمذي 2319 — الأب والأبوة", en: "Jami' al-Tirmidhi 2319 — the father and fatherhood", ur: "جامع ترمذی 2319 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2319 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 2319 — le père et la paternité", tr: "Cami' el-Tirmizi 2319 — Baba ve Babalık", id: "Jami' al-Tirmidhi 2319 — Sang Ayah dan Peran Ayah" }
text: "… يَلْقَاهُ \". قَالَ وَفِي الْبَابِ عَنْ أُمِّ حَبِيبَةَ. قَالَ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَهَكَذَا رَوَاهُ غَيْرُ وَاحِدٍ عَنْ مُحَمَّدِ بْنِ عَمْرٍو نَحْوَ هَذَا قَالُوا عَنْ مُحَمَّدِ بْنِ عَمْرٍو عَنْ أَبِيهِ عَنْ جَدِّهِ عَنْ بِلاَلِ بْنِ الْحَارِثِ. وَرَوَى هَذَا الْحَدِيثَ مَالِكٌ عَنْ مُحَمَّدِ بْنِ عَمْرٍو عَنْ أَبِيهِ عَنْ بِلاَلِ بْنِ الْحَارِثِ وَلَمْ يَذْكُرْ فِيهِ عَنْ جَدِّهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2319، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2319 (Chapters On Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2319، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2319 (Capítulos sobre el Zuhd), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2319 (Chapitres sur le Zuhd), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de 2319 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2319, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang subjek tersebut."
