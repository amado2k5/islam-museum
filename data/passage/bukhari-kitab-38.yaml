label:
  ar: "صحيح البخاري، كتاب الحوالات"
  en: "Sahih al-Bukhari, Book 38: Transferance of a Debt from One Person to Another (Al-Hawaala)"
  ur: "صحیح بخاری، کتاب الحوالات"
  es: "Sahih al-Bukhari, Libro 38: Transferencia de una deuda de una persona a otra (Al-Hawaala)"
  fr: "Sahih al-Bukhari, Livre 38: Transfert d'une dette d'une personne à une autre (Al-Hawaala)"
summary:
  ar: "القسم 38 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحوالات»، ويضم فيها النصوص من 2287 إلى 2289 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 38 of Sahih al-Bukhari (Transferance of a Debt from One Person to Another (Al-Hawaala)) in the division of the open hadith dataset the museum took its reports from: reports 2287 to 2289 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 38، عنوان «کتاب الحوالات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2287 تا 2289۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 38 de Sahih al-Bukhari (Transferencia de una deuda entre personas (Al-Hawaala)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2287 a 2289 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 38 du Sahih al-Bukhari (Transfert d'une dette d'une personne à une autre (Al-Hawaala)), soit les hadiths 2287 à 2289 de la numérotation de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
