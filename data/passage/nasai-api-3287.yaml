label: { ar: "سنن النسائي 3287 — ما أُحل، ما لا يحل", en: "Sunan al-Nasa'i 3287 — what was made lawful; what is not lawful", ur: "سنن نسائی 3287 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan al-Nasa'i 3287 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sunan al-Nasa'i 3287 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "… ذَلِكَ أَحَبُّ إِلَيْكِ \". قَالَتْ نَعَمْ لَسْتُ لَكَ بِمُخْلِيَةٍ وَأَحَبُّ مَنْ يَشْرَكُنِي فِي خَيْرٍ أُخْتِي. قَالَ \" إِنَّهَا لاَ تَحِلُّ لِي \". قَالَتْ فَإِنَّهُ قَدْ بَلَغَنِي أَنَّكَ تَخْطُبُ دُرَّةَ بِنْتَ أُمِّ سَلَمَةَ. قَالَ \" بِنْتُ أَبِي سَلَمَةَ \". قَالَتْ نَعَمْ. قَالَ \" وَاللَّهِ لَوْ لَمْ تَكُنْ رَبِيبَتِي مَا حَلَّتْ لِي إِنَّهَا لاَبْنَةُ أَخِي مِنَ الرَّضَاعَةِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3287، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3287 (The Book of Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3287، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3287 (El Libro del Matrimonio), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3287 (Le Livre du Mariage), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
