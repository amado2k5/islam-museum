text: |-
  يقددن الاديم بعدما يحلقنه أى
  يقدّرته كمافى القاموس
  ٥٨٨
  ودماع الكرم ما يسيل منه ايام الربيع قال الاسر الدمع بضم الدال والميم سمة فى مجرى الدمع
  ( دزع الدفع ما يطرخه الجازر من البعير والدفع الذل ورجل دنع أى فسل لاخيرفيه
  ⁦( صل الذال )⁩ رع) ذراع اليديذ كرويؤنت والذراع ذراع الاسد م كوكان
  نهار ادراع ملذاع فرويقال الدر الاة ذاع له مل مأ احولال الأراع أى معة
  الى مشرب بين الذراعير بارد فهما هضيتان والذراع بالفتح المرأة الطفيقة اليدين بالغزل
  وقد ذ رعت الثوب وغيره ذرعا وذرعه القى. أى سبته وغلبه وتقول أبطرت فلانا ذرعه أى
  كافته أكثر من طوقه ويقال ضقت بالامر ذرعا اذ الم تطقه ولم تقوعليه وأصل الذرع انما
  هو بسط اليدفكانك تريد مددت يدى اليه فلم تتله ورء، قالواضقت به ذراعا قال ح.ا
  ابن توريف تيا
  وان بات وحشاليلة لم يضق بها * ذراعا ولم يصبح لها وهو خاشع
  وقولهم أقصد يذرعلا أى اربع على نفسك وقولهم النوب سبع فى عمانية انغما قالواسمع لات
  الاذرع. وتنة قال سيبويه الذراع موتثة وجمعها أذرع لاغير وانما قالواثمائية لان الاشبار
  مذكرة والذارع الزق الصغير يسلخ من قبل الذراع والجمع ذوارع وهى للشراب وذرّعه
  تذريعا أى خنقه والتذريع فى المتى تحريك الذراعين ويقال أيضا للبشيراذا أومى بي-ده
  قد ذرّع البشير وتور مذرع اذا كان فى أكارءه لع سود والذرع بالتحريك الطمع ومنه قول
  الراجز وقدية ود الذرع الوحشيا والذرع أيضاولد البقرة الوحسية تقول من
  أذرعت البقرة فهى مذرع والاذراع أيضا كثرة الكلام والافراط فيه وكذلك التذرع
  وأرى أصله من مد الذراع لانّ المكثر قد يفعل ذلك والتذرع أيضاتقدير الذى بذراع اليد
  وقال ١ ترى قصد المران تلق كأنها + تدرع خرصان بأيدى الشواطب
  والمذرع بكسر الراء مشددة المطر الذى يرسخ فى الارض قدرذراع والمذرّع الذى أمه
  أشرف من أبيه هذا يفتح الراءو يقال انماسمى مذرعا بالرقتين فى ذراع البغل لانه-ما أتياه
  من ناحية الحار والمذارع المزالف وهى البلادبين الريف والبر الواحد مذراع ويقال
  للنخمل التى تقرب من السوت مذارع ومذارع الدابة قوائمها قال الاخطل
  وبالهدايا اذا احرت مذارعها * فى يوم ذيح وتشريق وتحار
  والذريعة الوسيلة وقد تذرع فلان بذريعة أى توسل والمع الذرائع والذريعة مثل الدريثه
  وهى الفاقة التى يستترجها الرامى للصيد وفرس ذريع واسع الخطوبين الذراعة وقوائم ذرعات
  أى سريعات وقتل ذريع أى سريع يقال قتلوهم أذرع قتل وأذرعات بكسرالرا.
  موضع بااشام تنسب اليه الجر قال أبو ذؤيب
  فاان رحيق سبتها التجار • من أذرعات فؤادى جدر
  وهى معرفة مصروفة مثل عرقات قال سيبويه ومن العرب من لا ينون أذرعات بقول هذه
  أذرعات ورأيت أذرعات بكسر التاء بغيرتنوين والنسبة اليها أذرعى ⁦(ذعع)⁩) (ذعذعته
  فتسذع مذع أى قرّقته فترق وذعرعة السرّ إذاعته والذعاع الفرق الواحدة ذهاعة ور؟ا
  حالوا
