text: "… عَبد اللّه النَصْري، نا مُحمّد بن الحسَن بن قُتيبة، نا حَرمَلة بن يحيَى، أنا ابن وَهْب، أخبَرَني أُسَامة بن زَيد، عن أبي حازم، عن عَون، عن عَبد اللّه بن مَسعُود أن النبي وَلِفِيِ قال : المؤمن يَألفُ وَلا خَيرَ فيمن …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 432، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
