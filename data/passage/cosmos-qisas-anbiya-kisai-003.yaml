text: "فلما امتلأت الأرض من ذرية إبليس اللعين أسكن الله الجان في الهواء دون السماء وأسكن أولاد الجن سماء الدنيا"
summary:
  ar: "يروي الكسائي أن الله أسكن الجان في الهواء دون السماء وأولاد الجن في سماء الدنيا بعد أن امتلأت الأرض بذرية إبليس؛ وهو سرد قصصي."
  en: "Al-Kisai says God settled the Jann in the air below the sky and the children of the jinn in the lowest heaven once the earth was full of Iblis's offspring; this is storytelling, not a chained report."
  es: "Al-Kisai dice que Dios estableció a los jinn en el aire debajo del cielo y a los hijos de los jinn en el cielo más bajo una vez que la tierra estuvo llena de la descendencia de Iblis; esto es una narración, no un informe encadenado."
  fr: "Al-Kisai dit que Dieu a établi les Jann dans l'air sous le ciel et les enfants des djinns dans le ciel le plus bas une fois que la terre fut remplie de la progéniture d'Iblis; il s'agit d'un récit, et non d'un rapport enchaîné."
  ur: "الکسائی کہتے ہیں کہ جب زمین ابلیس کی اولاد سے بھر گئی تو اللہ تعالیٰ نے جنت کو آسمان کے نیچے ہوا میں اور جنات کے بچوں کو نچلے آسمان پر بسایا۔ یہ کہانی ہے، زنجیروں والی رپورٹ نہیں۔"
  tr: "El-Kisa'i rivayet eder ki, Allah, İblis'in soyundan gelenler yeryüzünü doldurduktan sonra cinleri gökyüzünün altındaki havaya, cinlerin çocuklarını ise en alt göğe yerleştirmiştir; bu bir rivayettir."
  id: "Al-Kisa’i meriwayatkan bahwa Allah menempatkan jin di udara di bawah langit dan anak-anak jin di langit terendah setelah bumi dipenuhi oleh keturunan Iblis; ini adalah riwayat naratif."
