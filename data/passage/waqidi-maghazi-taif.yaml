label: { ar: "شأن غزوة الطائف — نساء النبي مع الجيش", en: "The campaign of Ta'if — the Prophet's wives with the army", es: "La campaña de Ta'if: las esposas del Profeta con el ejército.", fr: "La campagne de Taïf — les épouses du Prophète avec l'armée", ur: "طائف کی مہم - نبی کی بیویاں فوج کے ساتھ" }
text: "ولما نزل رسول الله الأكمة ومعه امرأتان من نسائه أم سلمة، وزينب، وثار المسلمون إلى الحصن"
summary:
  ar: "في باب الطائف، يذكر الواقدي أن النبي نزل الأكمة ومعه امرأتان من نسائه: أم سلمة وزينب، وثار المسلمون إلى الحصن فقاتلهم أهلها بالنبل، وأصيب فيها أبو بكر بشظية فيها سم. ويسوق الواقدي روايات خبيب بن عبد الله بن الحرث الثقفي عن قتالهم، ثم رجع الجيش بعد ست عشرة ليلة بغير قتال."
  en: "At Ta'if Waqidi notes the Prophet camped at al-Akama accompanied by two of his wives, Umm Salama and Zaynab, while the Muslims stormed the fortress and its defenders rained arrows on them; Abu Bakr was wounded by a poisoned splinter. Khubayb ibn Abd Allah ibn al-Harith al-Thaqafi's reports carry the siege, and the army withdrew after sixteen nights."
  es: "En Ta'if Waqidi se menciona que el Profeta acampó en al-Akama acompañado de dos de sus esposas, Umm Salama y Zaynab, mientras los musulmanes asaltaban la fortaleza y sus defensores les lanzaban una lluvia de flechas; Abu Bakr resultó herido por una esquirla envenenada. Los relatos de Khubayb ibn Abd Allah ibn al-Harith al-Thaqafi narran el asedio, y el ejército se retiró después de dieciséis noches."
  fr: "À Taïf, Waqidi rapporte que le Prophète campa à al-Akama accompagné de deux de ses épouses, Umm Salama et Zaynab, tandis que les musulmans prenaient d'assaut la forteresse et que ses défenseurs les criblaient de flèches; Abou Bakr fut blessé par un éclat empoisonné. Les récits de Khubayb ibn Abd Allah ibn al-Harith al-Thaqafi font état du siège, et l'armée se retira après seize nuits."
  ur: "طائف واقدی نوٹ کرتے ہیں کہ نبی نے اپنی دو بیویوں ام سلمہ اور زینب کے ہمراہ العکمہ میں ڈیرہ ڈالا، جب کہ مسلمانوں نے قلعہ پر حملہ کیا اور اس کے محافظوں نے ان پر تیروں کی بارش کی۔ ابوبکر کو زہر آلود کرچ سے زخمی کر دیا گیا۔ خبیب بن عبد اللہ بن حارث ثقفی کی رپورٹوں کے مطابق محاصرہ ہوا اور سولہ راتوں کے بعد فوج پیچھے ہٹ گئی۔"
