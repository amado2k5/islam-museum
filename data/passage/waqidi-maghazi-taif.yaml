label: { ar: "شأن غزوة الطائف — نساء النبي مع الجيش", en: "The campaign of Ta'if — the Prophet's wives with the army" }
text: "ولما نزل رسول الله الأكمة ومعه امرأتان من نسائه أم سلمة، وزينب، وثار المسلمون إلى الحصن"
summary:
  ar: "في باب الطائف، يذكر الواقدي أن النبي نزل الأكمة ومعه امرأتان من نسائه: أم سلمة وزينب، وثار المسلمون إلى الحصن فقاتلهم أهلها بالنبل، وأصيب فيها أبو بكر بشظية فيها سم. ويسوق الواقدي روايات خبيب بن عبد الله بن الحرث الثقفي عن قتالهم، ثم رجع الجيش بعد ست عشرة ليلة بغير قتال."
  en: "At Ta'if Waqidi notes the Prophet camped at al-Akama accompanied by two of his wives, Umm Salama and Zaynab, while the Muslims stormed the fortress and its defenders rained arrows on them; Abu Bakr was wounded by a poisoned splinter. Khubayb ibn Abd Allah ibn al-Harith al-Thaqafi's reports carry the siege, and the army withdrew after sixteen nights."
