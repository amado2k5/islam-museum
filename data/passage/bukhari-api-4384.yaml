label: { ar: "صحيح البخاري 4384 — الأب والأبوة", en: "Sahih al-Bukhari 4384 — the father and fatherhood", ur: "صحیح بخاری 4384 — باپ اور والدیت", es: "Sahih al-Bukhari 4384 — El padre y la paternidad" }
text: "حَدَّثَنِي عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، وَإِسْحَاقُ بْنُ نَصْرٍ، قَالاَ حَدَّثَنَا يَحْيَى بْنُ آدَمَ، حَدَّثَنَا ابْنُ أَبِي زَائِدَةَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، عَنِ الأَسْوَدِ بْنِ يَزِيدَ، عَنْ أَبِي مُوسَى ـ قَالَ قَدِمْتُ أَنَا وَأَخِي، مِنَ الْيَمَنِ، فَمَكَثْنَا حِينًا مَا نُرَى ابْنَ مَسْعُودٍ وَأُمَّهُ إِلاَّ مِنْ أَهْلِ الْبَيْتِ، مِنْ كَثْرَةِ دُخُولِهِمْ وَلُزُومِهِمْ لَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4384، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4384 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4384، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4384 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
