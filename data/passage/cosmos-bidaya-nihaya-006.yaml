  ur: "ابن کثیر روایت کرتے ہیں کہ ابن حزم، ابن المنیر، ابن الجوزی اور دیگر نے اس بات پر اجماع نقل کیا ہے کہ آسمان ایک گردش کرنے والا کرہ ہے۔"
  tr: "İbn Kathir, İbn Hazm, İbn el-Munir, İbn el-Cevzi ve diğerlerinin göklerin yuvarlak bir küre olduğu konusunda görüş birliği olduğunu söylediklerini aktarır."
  id: "Ibn Kathir mengutip Ibn Hazm, Ibn Al-Munir, Ibn Al-Jawzi dan lainnya yang mengatakan bahwa ada konsensus bahwa langit berbentuk bola bundar."
