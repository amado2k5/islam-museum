label: { ar: "الموطأ 1082 — هشام بن عروة عن أبيه: من أفاض فقد قضى الله حجه، فإن لم يحبسه شيء فهو حقيق أن يكون آخر عهده الطواف بالبيت", en: "Muwatta 1082" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: من أفاض فقد قضى الله حجه، فإنه، إن لم يكن حبسه شيء، فهو حقيق أن يكون آخر عهده الطواف بالبيت، وإن حبسه شيء أو عرض له، فقد قضى الله حجه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1445). {cite:muwatta-maruf-1997 p.497}"
