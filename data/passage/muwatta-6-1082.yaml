label: { ar: "الموطأ 1082 — هشام بن عروة عن أبيه: من أفاض فقد قضى الله حجه، فإن لم يحبسه شيء فهو حقيق أن يكون آخر عهده الطواف بالبيت", en: "Muwatta 1082", es: "Muwatta 1082", fr: "Muwatta 1082", ur: "موطا 1082", tr: "El-Muvatta 1082 — Hişam ibn Urve, babasından rivayetle: Kim İfade Tavafını yaparsa Haccını tamamlamış olur ve eğer bir engel yoksa, son amelinin Kâbe'yi tavaf etmesi uygundur.", id: "Al-Muwatta 1082 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Barang siapa yang melaksanakan Tawaf al-Ifadah, maka ia telah menyempurnakan ibadah hajinya, dan jika tidak ada halangan baginya, maka pantaslah amalan terakhirnya adalah mengelilingi Ka'bah." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: من أفاض فقد قضى الله حجه، فإنه، إن لم يكن حبسه شيء، فهو حقيق أن يكون آخر عهده الطواف بالبيت، وإن حبسه شيء أو عرض له، فقد قضى الله حجه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1445). {cite:muwatta-maruf-1997 p.497}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek şöyle buyurmuştur: \"Kim İfade Tavafı'nı yaparsa, Hac'ını tamamlamış olur. Eğer bir engel yoksa, son amellerinin Kâbe'yi tavaf etmesi uygundur. Eğer bir engel varsa veya başına bir şey gelmişse, Allah onun Hac'ını tamamlamıştır.\" Araştırmacı, Ebu Musab'ın (1445) bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.497}"
  id: "Malik meriwayatkan hadits ini dari Hisham bin Urwah, yang meriwayatkan dari ayahnya, yang berkata: “Barangsiapa yang melaksanakan Tawaf al-Ifadah, maka ia telah menyempurnakan ibadah hajinya. Sebab jika tidak ada halangan baginya, maka sudah sepatutnya amalan terakhirnya adalah mengelilingi Ka'bah. Dan jika ada halangan atau sesuatu terjadi padanya, maka Allah telah menyempurnakan ibadah hajinya.” Peneliti menyebutkan bahwa Abu Mus’ab (1445) meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.497}"
