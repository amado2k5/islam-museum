text: "… مقاتل في تفسيره أنه اسم النجاشي وجوز غيره أن المقوقس رأسه، وقال: أنتم في اللعب، ثم سألهم عن نحو ما وقع لهم في قصة هرقل، وفي آخره، فما فعلت يكون اسم ابنه الذي هاجر. يهود يثرب؟ قلنا خالفوه فأوقع بهم، …"
