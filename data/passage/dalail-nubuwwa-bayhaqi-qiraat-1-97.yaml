text: "… الأدمي، وتلا على النقاش، وهبة اللّٰه بن جعفر، وابن أبي هاشم وغيرهم حدث عنه الخطيب، والبيهقي، وعبد الواحد بن فهد، وغيرهم، قال الخطيب : كان صدوقاً ديناً فاضلًا، تفرد بأسانيد القراءات وعلوّها في وقته. - الحافظ أبو حازم عمر بن …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 97، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 97, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 97 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
