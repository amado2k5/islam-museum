text: "د مسافته؛ لأنه قدم من أرض الشحر، نلما أراد الانصراف حمله، وكتب له كتابا، فهو عندهم . أخرجه أبو موسى. قال الأمير ابن ماكولا : قال الدارقطني: قرضم بالقاف. وهو بالفاء، وقال: قباث بفتح القاف والباء . وهو بكسر القاف،"
