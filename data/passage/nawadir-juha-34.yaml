text: "… القمر في بلادنا ذهب يوماً إلى مدينة سيوري حصار فرأى الناس تتجمَعُ في محلٍ عالٍ لرؤية الهلال في أول شهر الصوم، فأنشأ يهزأُ بهم، ويقول لهم : عَجَباً يا أهلَ هذا البلد، إن أهالي بلدتي يرون القمر كدولاب العربة ولا …"
summary:
  ar: "في سيوري حصار صعد الناس إلى مكان عالٍ لرؤية هلال رمضان، فسخر جحا منهم قائلًا إن القمر في بلدته يشبه عجلة العربة ولا يُلتمس. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  en: "At Siwri Hisar, people climb high to sight the Ramadan crescent; Juha mocks them, saying that in his own town the moon looks like a cart wheel and is not sought. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  ur: "سیوری حصار میں لوگ رمضان کا ہلال دیکھنے کے لیے اونچائی پر چڑھے، تو جحا نے ان کا مذاق اڑایا اور کہا کہ میرے اپنے شہر میں چاند گاڑی کے پہیے جیسا ہوتا ہے اور اسے تلاش نہیں کرنا پڑتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  fr: "À Siwri Hisar, les gens montent très haut pour apercevoir le croissant du Ramadan ; Juha se moque d'eux en disant que dans sa ville la lune ressemble à une roue de charrette et qu'on ne la cherche pas. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  es: "En Siwri Hisar, la gente sube muy alto para avistar la luna creciente de Ramadán; Juha se burla de ellos diciendo que en su ciudad la luna parece la rueda de una carreta y no hay que buscarla. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
  tr: "Siuri'de kuşatma sırasında insanlar Ramazan hilalini görmek için yüksek bir yere tırmanmışlardı, ancak Juha onlarla alay ederek, şehrindeki hilalin bir araba tekerleğine benzediğini ve bulunamayacağını söylemişti. {cite:juha-nawadir-kubra-djuwaydi s. 21}"
  id: "Di Siuri, selama pengepungan, orang-orang mendaki ke tempat tinggi untuk melihat bulan sabit Ramadan, tetapi Juha mengejek mereka, mengatakan bahwa bulan di kotanya menyerupai roda gerobak dan tidak dapat ditemukan. {cite:juha-nawadir-kubra-djuwaydi p. 21}"
