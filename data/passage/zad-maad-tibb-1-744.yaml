text: "… أو أكثرها، فهو الهلاك المعجَّل. فصل الحمية، و وصايا لجالينوس والحمية المفرطة في الصحة، كالتخليط في المرض، والحمية المعتدلة نافعة، وقال جالينوس لأصحابه: اجتنبوا ثلاثاً، وعليكم بأربع، ولا حاجة بكم إلى طبيب: اجتنبوا الغُبار، والدخان، والنَّتن، وعليك بالدَّسم، والطّيب، والحَلْوى، …"
