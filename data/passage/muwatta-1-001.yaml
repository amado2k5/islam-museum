ref: "1.1"
label: { ar: "الموطأ 1 — حديث جبريل في مواقيت الصلاة", en: "Muwatta 1" }
text: "أليس قد علمت أن جبريل نزل فصلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم قال: بهذا أمرت"
summary:
  ar: "أول حديث في الموطأ، ويفتتح به مالك كتاب الصلاة في باب وقوت الصلاة. يرويه يحيى بن يحيى عن مالك عن ابن شهاب الزهري، أن عمر بن عبد العزيز أخّر الصلاة يوماً فدخل عليه عروة بن الزبير وذكّره بأن المغيرة بن شعبة أخّر الصلاة يوماً وهو أمير على الكوفة، فدخل عليه أبو مسعود الأنصاري وأنكر عليه، واحتج بأن جبريل نزل فصلى بالنبي الصلوات الخمس صلاةً صلاةً والنبي يصلي خلفه، ثم قال له: بهذا أمرت. فسأل عمر بن عبد العزيز عروة أن يتثبت فيما يحدث به، فأجاب بأن بشير بن أبي مسعود كان يحدث به عن أبيه. ويذكر المحقق أن الحديث رواه عن مالك جماعة منهم القعنبي عند البخاري (521) ويحيى بن يحيى النيسابوري عند مسلم (2/103)، وينقل عن ابن عبد البر أن ظاهر سياقه بلفظ «أن» يوهم الانقطاع، ثم قوله إنه «متصل عند أهل العلم مسند صحيح» لثبوت مجالسة رواته بعضهم لبعض (التمهيد 8/11–15). {cite:muwatta-maruf-1997 p.33} {cite:muwatta-maruf-1997 p.34}"
  en: "The Gabriel hadith: he led the Prophet in prayer at the times of the five daily prayers to teach him their appointed times; Urwa transmits it from Bashir ibn Abi Mas'ud, together with Umar ibn Abd al-Aziz's disapproval of delaying the prayer."
