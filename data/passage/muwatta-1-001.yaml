summary:
  ar: "حديث جبريل: صلّى بالنبي ﷺ في أوقات الصلوات الخمس ليعلّمه مواقيتها، ويرويه عروة عن بشير بن أبي مسعود مع إنكار عمر بن عبد العزيز تأخير الصلاة."
  en: "The Gabriel hadith: he led the Prophet in prayer at the times of the five daily prayers to teach him their appointed times; Urwa transmits it from Bashir ibn Abi Mas'ud, together with Umar ibn Abd al-Aziz's disapproval of delaying the prayer."
