label: { ar: "الموطأ 1 — حديث جبريل في مواقيت الصلاة", en: "Muwatta 1", es: "Muwatta 1", fr: "Muwatta 1", ur: "موطا 1", tr: "El-Muvatta 1 — Cebrail'in Namaz Vakitleri Hakkındaki Hadisi", id: "Al-Muwatta 1 — Hadits Jibril tentang Waktu-Waktu Shalat" }
text: "أليس قد علمت أن جبريل نزل فصلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم صلى فصلى رسول الله، ثم قال: بهذا أمرت"
summary:
  ar: "أول حديث في الموطأ، ويفتتح به مالك كتاب الصلاة في باب وقوت الصلاة. يرويه يحيى بن يحيى عن مالك عن ابن شهاب الزهري، أن عمر بن عبد العزيز أخّر الصلاة يوماً فدخل عليه عروة بن الزبير وذكّره بأن المغيرة بن شعبة أخّر الصلاة يوماً وهو أمير على الكوفة، فدخل عليه أبو مسعود الأنصاري وأنكر عليه، واحتج بأن جبريل نزل فصلى بالنبي الصلوات الخمس صلاةً صلاةً والنبي يصلي خلفه، ثم قال له: بهذا أمرت. فسأل عمر بن عبد العزيز عروة أن يتثبت فيما يحدث به، فأجاب بأن بشير بن أبي مسعود كان يحدث به عن أبيه. ويذكر المحقق أن الحديث رواه عن مالك جماعة منهم القعنبي عند البخاري (521) ويحيى بن يحيى النيسابوري عند مسلم (2/103)، وينقل عن ابن عبد البر أن ظاهر سياقه بلفظ «أن» يوهم الانقطاع، ثم قوله إنه «متصل عند أهل العلم مسند صحيح» لثبوت مجالسة رواته بعضهم لبعض ⁦(التمهيد 8/11–15)⁩. {cite:muwatta-maruf-1997 p.33} {cite:muwatta-maruf-1997 p.34}"
  en: "The Gabriel hadith: he led the Prophet in prayer at the times of the five daily prayers to teach him their appointed times; Urwa transmits it from Bashir ibn Abi Mas'ud, together with Umar ibn Abd al-Aziz's disapproval of delaying the prayer."
  es: "El hadiz de Gabriel: él guió al Profeta en la oración en los momentos de las cinco oraciones diarias para enseñarle sus horarios establecidos; Urwa lo transmite de Bashir ibn Abi Mas'ud, junto con la desaprobación de Umar ibn Abd al-Aziz de retrasar la oración."
  fr: "Le hadith de Gabriel: il a dirigé la prière au Prophète aux heures des cinq prières quotidiennes pour lui enseigner leurs heures prescrites; Urwa le transmet de Bashir ibn Abi Mas'ud, ainsi que la désapprobation d'Umar ibn Abd al-Aziz quant au retard de la prière."
  ur: "جبرائیل کی حدیث: اس نے نبی کو پانچوں نمازوں کے اوقات میں نماز پڑھائی تاکہ آپ کو ان کے مقررہ اوقات سکھائیں۔ عروہ نے اسے بشیر بن ابی مسعود سے نقل کیا ہے اور عمر بن عبدالعزیز کی نماز میں تاخیر کی ناپسندیدگی کے ساتھ۔"
  tr: "Malik'in Namaz Kitabı'nın namaz vakitleri bölümüne başladığı Muwatta'daki ilk hadis, Yahya ibn Yahya'nın Malik'ten, o da İbn Şihab el-Zuhri'den rivayet ettiğine göre, Ömer ibn Abdülaziz bir gün namazı geciktirmiş. Bunun üzerine Urve ibn el-Zubayr yanına gelerek, el-Muğire ibn Şube'nin Kufa valisi olduğu dönemde namazı bir gün geciktirdiğini hatırlatmış. Bunun üzerine Ebu Mes'ud el-Ensari yanına gelerek onu azarlamış ve Cebrail'in indiğini, Peygamber'e beş vakit namazı birbiri ardına kıldırdığını, Peygamber'in de arkasından namaz kıldığını ve sonra ona, \"Bana emredilen buydu\" dediğini söylemiş. Bunun üzerine Ömer ibn Abdülaziz, Urve'den anlattıklarını doğrulamasını istemiş ve Urve de Beşir ibn Ebu Mes'ud'un bunu babasından rivayet ettiğini söylemiş. Araştırmacı, hadisin Malik'ten, aralarında el-Ka'nabi'nin Buhari'de (521) ve Yahya ibn Yahya el-Naysaburi'nin Müslim'de (2/103) de bulunduğu bir grup insan tarafından rivayet edildiğini belirtiyor. İbn Abd el-Barr'ın \"ki\" kelimesinin zahiri anlamının rivayet zincirinde bir kopukluğa işaret ettiğini söylediğini aktarıyor, ancak daha sonra, rivayetçilerinin birlikte oturdukları gerçeğinden dolayı \"âlimlere göre sağlam bir rivayet zinciri\" olduğunu belirtiyor (el-Tamhid 8/11-15). {cite:muwatta-maruf-1997 s.33} {cite:muwatta-maruf-1997 s.34}"
  id: "Hadits pertama dalam Muwatta, yang digunakan Malik untuk memulai Kitab Shalat dalam bab tentang waktu shalat. Diriwayatkan oleh Yahya ibn Yahya dari Malik dari Ibn Shihab al-Zuhri, bahwa Umar ibn Abd al-Aziz menunda shalat suatu hari, lalu Urwah ibn al-Zubayr mendatanginya dan mengingatkannya bahwa al-Mughirah ibn Shu'bah pernah menunda shalat suatu hari ketika ia menjadi gubernur Kufa. Abu Mas'ud al-Ansari mendatanginya dan menegurnya, dengan alasan bahwa Jibril telah turun dan memimpin Nabi dalam shalat lima waktu, satu demi satu, dengan Nabi shalat di belakangnya, lalu berkata kepadanya: \"Inilah yang diperintahkan kepadaku.\" Maka Umar ibn Abd al-Aziz meminta Urwah untuk memverifikasi apa yang diriwayatkannya, dan ia menjawab bahwa Bashir ibn Abi Mas'ud telah meriwayatkannya dari ayahnya. Peneliti menyebutkan bahwa hadits tersebut diriwayatkan dari Malik oleh sekelompok orang, termasuk al-Qa'nabi dalam al-Bukhari (521) dan Yahya ibn Yahya al-Naysaburi dalam Muslim (2/103). Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa makna kata \"bahwa\" yang tampak menunjukkan adanya putus rantai periwayatan, tetapi kemudian ia menyatakan bahwa hadits tersebut \"terhubung menurut para ulama, merupakan rantai periwayatan yang sahih,\" karena fakta yang telah ditetapkan bahwa para perawinya duduk bersama (al-Tamhid 8/11-15). {cite:muwatta-maruf-1997 p.33} {cite:muwatta-maruf-1997 p.34}"
