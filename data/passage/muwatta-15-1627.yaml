label: { ar: "الموطأ 1627 — مالك: إن مسها زوجها فزعمت أنها جهلت أن لها الخيار، فإنها تتهم ولا تصدق، ولا خيار لها بعد أن يمسها", en: "Muwatta 1627", es: "Muwatta 1627", fr: "Muwatta 1627", ur: "موطا 1627", tr: "El-Muvatta 1627 — Malik: Eğer kocası ona dokunursa ve kadın, böyle bir seçeneği olduğunu bilmediğini iddia ederse, şüphelenilmeli ve inanılmamalıdır; çünkü kocası ona dokunduktan sonra artık bir seçeneği kalmamıştır.", id: "Al-Muwatta 1627 — Malik: Jika suaminya menyentuhnya dan dia mengaku bahwa dia tidak menyadari bahwa dia memiliki pilihan, maka dia patut dicurigai dan tidak dipercaya, dan dia tidak memiliki pilihan setelah suaminya menyentuhnya." }
summary:
  ar: "يقول مالك وإن مسها زوجها فزعمت أنها جهلت أن لها الخيار، فإنها تتهم ولا تصدق بما ادعت من الجهالة، ولا خيار لها بعد أن يمسها. {cite:muwatta-maruf-1997 p.72}"
  tr: "Malik, eğer kocası ona dokunursa ve o da seçim hakkından habersiz olduğunu iddia ederse, suçlanacağını ve habersizlik iddiasına inanılmaması gerektiğini, kocası ona dokunduktan sonra hiçbir seçeneği kalmadığını söylüyor. {cite:muwatta-maruf-1997 s.72}"
  id: "Malik mengatakan bahwa jika suaminya menyentuhnya dan dia mengaku tidak mengetahui haknya untuk memilih, dia akan dituduh dan pengakuannya tentang ketidaktahuan itu tidak dapat dipercaya, dan dia tidak punya pilihan setelah suaminya menyentuhnya. {cite:muwatta-maruf-1997 p.72}"
