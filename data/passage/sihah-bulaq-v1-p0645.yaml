text: |-
  الصماح أنه كتاب حسن الترتيب سهل المطلب لمارادمنه وقد أتى بأشياء حسنة وتناسير
  شكلات من اللغة الا أنه مع ذلك فيه تصحيف لا يتك فى أنه من المصنف لا من الناسخ لان
  الكتاب مبنى على الحروف قال ولا تخلّو«ذهالكتب السكبار عن-) و يقع فيها أوغلط وقدرة
  لى أبى عبيد فى الغريب المصنف مواضع كثيرة منه غيران القليل من الغلط الذى يقع
  لى السكتب الى جنب الكثير الذى اجتهد وا فيه وأتعبوانفوسهم فى تصحيحه معفوعنه هذ
  كلام الخطيب أبى زكريا ⁦(وأما من كتب عليه حوانى)⁩ فأوله-م أبو القاسم فضل بن محمسد
  البصرى المتوفى سنة ٤٤٤ ثم على بن جعفر بن القطاع الصقلى المتوف سنة ٥١٥
  ويقال انه لم يكملها بل بنى عليها تليذه ابن برى حاشيته التى سماها التنبيه والايضاح عما
  وقع من الوهم فى كتاب الصحاح وهى أجودتا ليفه ذكرفيها الاغلاط البينة واستدرك فيها
  بعض ألفاظ واجبة الذكر وبعض شواهد لازمة ويقال انه وصل فيها الى وب ش ومات قبل
  اتمامها سنة ٥٧٦ فأتمها الشيخ عبد اللّٰه بن محمدبن عبد الرحن البسطى نسسبة الى بسطة
  بالفتح من كورة حسان بالاندام ثم أبو العباس أحسد من محمد المعروف إبن الحاج الاشدلى
  المتوفى سنة ٩٥١ ثم رضىّ الدين محد بن على الشاطى المتوفى سنة ٦٨٤ وأما الامام
  رضى الدين حسن بن محمد الصفانى صاحب العباب المتقدم ذكره فقد صنف السكملة على
  الصاح ذكر فبها ما فاته من اللغة وناقضه فى بعض مواضع وهى أكبر جما منه وممن ألف
  كتابا فى اصلاح ذلله أبوالحسن على بن يوسف القفطى وكذلت الصلاح الصفدى ألف
  فى اصلاح مافيه من اظال كتاباسماهنة وذ السهم فيما وقع للمجوهرى من الوهم أوله المدقه
  الذى تنزه عله عن الغلط وقال فى آخره تم تأليفه فى رمضان سنة ٧٥٧ قال محشى
  القاموس وقد فلمد فيه ابن برى فلايكاديذ كر مسئلة من عنده الابعض أدبيات والاستدلال
  يعض أبيات اه وكتب الصفدى أيضاء ليه مؤافاسماه حلى النواهد على مافى الصحاح
  من الشواهد وذكرفيه ترجحة الصحاح ايير محمد بن يوسف الانقروى الذى ذكرانه لمافرغ
  من كتابه المسمى بلتقط الصحاح ورأى ميل الطالبين الى التريحة فألفه وسماه التريمان وشاهد
  نسنة من الصصاح بخط ياقوت الموصلى الخ ماسبق وخرج الجلال السيوطى أحاديثه
  فى مختصر سماه فاق الصباح فى تخريح أحاديث الصداح و مامن اختصره ف هم شمس
  الدين محمد ين حسن بن سباع المعروف بابن الصائغ الدمشق المتوفى سنة ٧٢٠ اختصره
  مجر داعن الشواهد ومنهسم أيضا الجوابى اختصره فى مجلدين صغيرين بدون ح-ذف
  الشواهدوهو موجود بالازهر فى خزانة ابن البرماوى ومنهسم الشيخ ممددين أبى بكر بن
  عبد التادرالرازى اختصره فى مجلد لطيف مماه مختار الصحاح اقتصرفيه على مالابدمنه
  فى الاستعمال وحذف منسه بعض فصول بالكايسة وضم اليسه شيئا فليلا من تهذيب
  الازهرى وغيره ومدرزوائده بقلت وكل ما أهمله الموهرى من الاوزان ذكره بالنص على
  حركاته أوبرده الى واحدمن أوزاته العشرين التى ذكر ها فى كتابه وهو مشهور متداول
  بين الناس وقال فى آخره وافق فراغمعشية يوم الجعة سنة ٧٦٠ واختصره بعضهم
  فى كتاب سماه نحدة الفلاح وهو كالمختار يحذف الشواهد واختصره أيضامحمود بن أحد
  الزنجانى وكذلك المولى محد المعروف بالقيسى المتوفى سنة ١٠١٦ ومحتصره أنقع
  وافيه
