text: |-
  *⁦(باب الواد والياء)⁩*
  . .⁦(عفا)⁩.,
  ١٩•
  معالمىّ ومعاط قال الاخض هذامثل قولهم مفاتيح ومفاتح وأمانىّ وأمان والعطية
  الذى المعطى وابهع العطايا وقالوا ما أعطاه للمال كما قالوا ما أولاه للمعروف وما أكرمه لى
  وهذا شاذ لا يطردلان التعجب لا يدخل على أفعل وانما يجوز من ذلكْ ماسمسع من العرب ولا
  يقاس عليه ويقال أعطى البعيراذا انقاد ولم يستصعب وقوس عطوى على فعلى مؤاتية
  سهلة وعطوت الشى تناولته باليد والمعاطاة المناولة وفى المثل عاط بغير أنواط أى يتناول
  مالامطمع فيه ولا متناول ويقال هويعطينى بالتشديد ويعاطين اذا كان يخ_دمك وتعاطاء
  تناوله وفلان يتعاطى كذا أى يخوض فيه وتعاطينا فعطوته أى غلبته وقيل فى قوله تعالى
  فتعاطى فعق رأى قام على أطراف أصابع رجليه ثم رفع يديه فضرجا واذا أردت من زيد أن
  يعطيك شيأقلت هل أنت معطيه بياه منتوحة مشددة وكذلك تقول الجماعة هل أنتم
  معطيه لان الذون سقطت للاضافة وقلبت الواويا، وأدغمت وقتحت ياءك لان قبلها ساكن
  وللاثنين هل انتما معطيانه بفتح الياءفس على ذلك واذاصغرت عطاء حذفت اللام فقات
  عطىّ وكذلك كل اسم اجتمعت فيه ثلاث يا آت مثل علىّ وعدىّ حذفت منه اللام اذ الم يكن
  مينياعلى فعل فان كان مبنيا على فعل ببتت نحو محمي من حيايحي تحية ⁦(عظا )⁩ العظاء
  ممدود جع عظاءذ وهى دويية أكبر من الوزغة ويقال فى الواحدة عظاءة وعظابة أيضاواقى
  فلان م عجاه وماعظاء اذالقى شدة ولقاه اللّه ماعظاه أى ماساءه (عفا العفاء بالقتح
  والم-د النراب وقال صفوان بن مم رزاذادخلت بيتي فأكات رغيفاً وشريت عليه ماء فعلى
  الدنيا العفاء وقال أبو عبيد العفاء الدروس والهلاك وأنشدلزهيريذ كردارا
  تحمل أهلهاءنها فبانوا * على آثارماذهب العفاء
  قال وهذاكة واهم عليه الدباراذادعا عليه أن يدبرفلا يرجع والعفاء بالكسر والمدما كثر من
  ريش النعام ووبر البعيريقال ناقة ذات عفاء والعفو الارض الغفل التى لم توطأ وليست
  بها آثار قال الشاعر
  قبيلة كشراك الفعل دارجة * ان يهبطوا العة ولم يوجدلهم أثر
  العفو والعفر والعفو الجس وكذلن العفابالفتح والقصر والأتى عفوة قال ابن
  السكيت العفابا لكسر وأنشد المفضل لحتظلة من شرقىّ
  بضرب يزيل الهام ءن سكناته • وطعن كنسهاق العفاهم بالنهق
  وعفو المال ما يفضل عن النفقة بقال أعطيته عفو المال يعنى بغير مسئلة قال الساعر
  خذى العفومنى تستديى مودّتى * ولا تنطق فى سورتى حين أغضب
  وعفوة الشى بالكسر صفوته يقال ذهبت عفوة هذا النبت أى لينه وخيره وأكات عفوة
  الطعام والشراب أى خياره ويقال أعفى من الخروج معك أى دعنى منه واستعفاه من
  الحروح.عه اى سأله الاعفاءمنه وعافاه اللّه وأعفاه بمعنى والاسم العافية وهى دفاع اللّٰه عن
  العبدوتوضع موضع المصدريقال عافاه اللّه عافية والعافية كل طالب رزق من انسان أوبهيمة
  أوطا روعافيسة الماء واردته والعفاوة بالكسر مايرف-ع من المرق أولا يخص به من
  يكرم قال الكميت
