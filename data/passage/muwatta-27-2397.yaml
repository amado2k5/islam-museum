label: { ar: "الموطأ 2397 — مالك: العفو عن القذف الذي يخاف صاحبه أن تقوم عليه بينة", en: "Muwatta 2397", es: "Muwatta 2397", fr: "Muwatta 2397", ur: "موطا 2397", tr: "El-Muvatta 2397 — Malik: İftira edenin aleyhine delil sunulmasından korkması halinde iftira için bağışlama", id: "Al-Muwatta 2397 — Malik: Pengampunan atas fitnah apabila orang yang melakukan fitnah tersebut khawatir bukti akan diajukan terhadap dirinya" }
summary:
  ar: "قال يحيى: قال مالك: وذلك أن يكون المفترى عليه يخاف إن كُشف ذلك منه أن تقوم عليه بينة، فإذا كان على ما وصفت فعفا، جاز عفوه. {cite:muwatta-maruf-1997 p.392}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Bu, haksız yere suçlanan kişinin, suçlamanın ortaya çıkması halinde aleyhine delil sunulacağından korktuğu zamandır. Eğer senin tarif ettiğin gibi biriyse ve affederse, affı geçerlidir. {cite:muwatta-maruf-1997 s.392}"
  id: "Yahya berkata: Malik berkata: Inilah saat orang yang dituduh secara salah takut bahwa jika tuduhan itu terungkap, bukti akan diajukan terhadapnya. Jika dia seperti yang Anda gambarkan dan memaafkan, maka pengampunannya sah. {cite:muwatta-maruf-1997 p.392}"
