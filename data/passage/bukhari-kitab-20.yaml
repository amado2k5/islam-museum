summary:
  ar: "القسم 20 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضل الصلاة في مسجد مكة والمدينة»، ويضم فيها النصوص من 1188 إلى 1197 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 20 of Sahih al-Bukhari (Virtues of Prayer at Masjid Makkah and Madinah) in the division of the open hadith dataset the museum took its reports from: reports 1188 to 1197 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 20، عنوان «کتاب فضل الصلاۃ فی مسجد مکۃ والمدینۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1188 تا 1197۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
