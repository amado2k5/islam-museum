label:
  ar: "صحيح البخاري، كتاب فضل الصلاة في مسجد مكة والمدينة"
  en: "Sahih al-Bukhari, Book 20: Virtues of Prayer at Masjid Makkah and Madinah"
  ur: "صحیح بخاری، کتاب فضل الصلاۃ فی مسجد مکۃ والمدینۃ"
  es: "Sahih al-Bukhari, Libro 20: Virtudes de la oración en la Mezquita de La Meca y Medina."
  fr: "Sahih al-Bukhari, Livre 20: Les vertus de la prière à la mosquée de La Mecque et de Médine"
summary:
  ar: "القسم 20 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب فضل الصلاة في مسجد مكة والمدينة»، ويضم فيها النصوص من 1188 إلى 1197 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 20 of Sahih al-Bukhari (Virtues of Prayer at Masjid Makkah and Madinah) in the division of the open hadith dataset the museum took its reports from: reports 1188 to 1197 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 20، عنوان «کتاب فضل الصلاۃ فی مسجد مکۃ والمدینۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1188 تا 1197۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 20 de Sahih al-Bukhari (Virtudes de la oración en las mezquitas de La Meca y Medina) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1188 al 1197, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 20, « Vertus de la prière à la mosquée de La Mecque et de Médine »), dans la partie ouverte du recueil: les hadiths 1188 à 1197 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
