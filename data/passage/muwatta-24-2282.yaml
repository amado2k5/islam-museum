label: { ar: "الموطأ 2282 — مالك: ولاء العبد المعتق من الكافر إذا أسلم", en: "Muwatta 2282", es: "Muwatta 2282", fr: "Muwatta 2282", ur: "موطا 2282", tr: "El-Muvatta 2282 — Malik: Bir kâfirin elinden azat edilen kölenin, İslam'ı kabul etmesi halinde ona olan bağlılığı.", id: "Al-Muwatta 2282 — Malik: Kesetiaan seorang budak yang dibebaskan dari orang kafir jika ia masuk Islam" }
summary:
  ar: "قال مالك في يهودي أو نصراني يُسلم عبدُ أحدهما فيعتقه قبل أن يُباع عليه: إن ولاء العبد المعتَق للمسلمين، ولا يرجع إلى السيد الكافر بعد إسلامه. أما إن أعتق الكافر عبدا على دينه ثم أسلم المعتَق قبل أن يسلم معتِقه، ثم أسلم المعتِق، رجع إليه الولاء لأنه ثبت له يوم العتق. وإن كان للكافر ولد مسلم يرث موالي أبيه في الحال الأولى، أما إن كان المعتَق مسلما وقت العتق فلا يكون لولد الكافر من ولائه شيء. {cite:muwatta-maruf-1997 p.341}"
  tr: "Malik, bir Yahudi veya Hristiyanın kölesinin İslamiyet'e geçip daha sonra kendisine satılmadan önce azat edilmesi durumunda şunları söylemiştir: Azat edilen kölenin bağlılığı Müslümanlara aittir ve Müslüman olduktan sonra eski gayrimüslim efendisine geri dönmez. Ancak, gayrimüslim kişi henüz dininde iken bir köleyi azat ederse ve azat edilen köle efendisinden önce İslamiyet'e geçerse ve daha sonra efendi de İslamiyet'e geçerse, bağlılık ona geri döner çünkü bu bağlılık azat edildiği gün ona verilmiştir. Eğer gayrimüslim kişinin Müslüman bir çocuğu varsa, bu çocuk ilk senaryoda babasının bağlılığını miras alır. Ancak azat edilen köle azat edildiği sırada Müslüman ise, gayrimüslim kişinin çocuğunun onun bağlılığı üzerinde hiçbir hakkı yoktur. {cite:muwatta-maruf-1997 s.341}"
  id: "Malik berkata mengenai seorang Yahudi atau Kristen yang budaknya masuk Islam dan kemudian dibebaskan sebelum dijual kepadanya: kesetiaan budak yang dibebaskan itu adalah kepada kaum Muslim dan tidak kembali kepada mantan majikannya yang bukan Muslim setelah ia masuk Islam. Namun, jika seorang non-Muslim membebaskan seorang budak saat ia masih menganut agamanya, dan kemudian budak yang dibebaskan itu masuk Islam sebelum majikannya, dan kemudian majikannya masuk Islam, kesetiaan itu kembali kepadanya karena telah ditetapkan untuknya pada hari pembebasan. Jika seorang non-Muslim memiliki anak Muslim, anak itu mewarisi kesetiaan ayahnya dalam skenario pertama. Tetapi jika budak yang dibebaskan itu adalah seorang Muslim pada saat pembebasan, anak non-Muslim itu tidak berhak atas kesetiaannya. {cite:muwatta-maruf-1997 p.341}"
