label: { ar: "الموطأ 2282 — مالك: ولاء العبد المعتق من الكافر إذا أسلم", en: "Muwatta 2282" }
summary:
  ar: "قال مالك في يهودي أو نصراني يُسلم عبدُ أحدهما فيعتقه قبل أن يُباع عليه: إن ولاء العبد المعتَق للمسلمين، ولا يرجع إلى السيد الكافر بعد إسلامه. أما إن أعتق الكافر عبدا على دينه ثم أسلم المعتَق قبل أن يسلم معتِقه، ثم أسلم المعتِق، رجع إليه الولاء لأنه ثبت له يوم العتق. وإن كان للكافر ولد مسلم يرث موالي أبيه في الحال الأولى، أما إن كان المعتَق مسلما وقت العتق فلا يكون لولد الكافر من ولائه شيء. {cite:muwatta-maruf-1997 p.341}"
