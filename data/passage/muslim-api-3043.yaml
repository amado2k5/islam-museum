label: { ar: "صحيح مسلم 3043 — الأب والأبوة", en: "Sahih Muslim 3043 — the father and fatherhood", ur: "صحیح مسلم 3043 — باپ اور والدیت", es: "Sahih Muslim 3043 — El padre y la paternidad" }
text: "وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ دَخَلَ عَامَ الْفَتْحِ مِنْ كَدَاءٍ مِنْ أَعْلَى مَكَّةَ. قَالَ هِشَامٌ فَكَانَ أَبِي يَدْخُلُ مِنْهُمَا كِلَيْهِمَا وَكَانَ أَبِي أَكْثَرَ مَا يَدْخُلُ مِنْ كَدَاءٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3043، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3043 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 3043، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 3043 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
