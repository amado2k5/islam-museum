label: { ar: "جامع الترمذي 1935 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1935 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1935 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 1935 — lo que se ha hecho lícito; lo que no lo es", fr: "Jami' al-Tirmidhi 1935 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "… حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ تَقَاطَعُوا وَلاَ تَدَابَرُوا وَلاَ تَبَاغَضُوا وَلاَ تَحَاسَدُوا وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا وَلاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. قَالَ وَفِي الْبَابِ عَنْ أَبِي بَكْرٍ الصِّدِّيقِ وَالزُّبَيْرِ بْنِ الْعَوَّامِ وَابْنِ مَسْعُودٍ وَأَبِي هُرَيْرَةَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1935، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1935 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1935، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1935 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los parientes), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1935 (chapitres sur la piété et les bonnes relations familiales), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
