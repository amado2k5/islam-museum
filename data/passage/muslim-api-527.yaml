text: "… قُلْتُ أَنَا. ثُمَّ قُلْتُ أَمَا إِنِّي لَمْ أَكُنْ فِي صَلاَةٍ وَلَكِنِّي لُدِغْتُ. قَالَ فَمَاذَا صَنَعْتَ قُلْتُ اسْتَرْقَيْتُ. قَالَ فَمَا حَمَلَكَ عَلَى ذَلِكَ قُلْتُ حَدِيثٌ حَدَّثَنَاهُ الشَّعْبِيُّ. فَقَالَ وَمَا حَدَّثَكُمُ الشَّعْبِيُّ قُلْتُ حَدَّثَنَا عَنْ بُرَيْدَةَ بْنِ حُصَيْبٍ الأَسْلَمِيِّ أَنَّهُ قَالَ لاَ رُقْيَةَ إِلاَّ مِنْ عَيْنٍ أَوْ حُمَةٍ. فَقَالَ قَدْ أَحْسَنَ مَنِ انْتَهَى إِلَى مَا سَمِعَ وَلَكِنْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 527، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 527 (The Book of Faith), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 527، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
