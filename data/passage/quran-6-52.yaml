text: "وَلَا تَطْرُدِ ٱلَّذِينَ يَدْعُونَ رَبَّهُم بِٱلْغَدَوٰةِ وَٱلْعَشِىِّ يُرِيدُونَ وَجْهَهُۥ ۖ مَا عَلَيْكَ مِنْ حِسَابِهِم مِّن شَىْءٍ وَمَا مِنْ حِسَابِكَ عَلَيْهِم مِّن شَىْءٍ فَتَطْرُدَهُمْ فَتَكُونَ مِنَ ٱلظَّـٰلِمِينَ"
text_search: "ولا تطرد الذين يدعون ربهم بالغداة والعشي يريدون وجهه ۖ ما عليك من حسابهم من شيء وما من حسابك عليهم من شيء فتطردهم فتكون من الظالمين"
translations:
  en: { text: "Repel not those who call upon their Lord at morn and evening, seeking His Countenance. Thou art not accountable for them in aught, nor are they accountable for thee in aught, that thou shouldst repel them and be of the wrong-doers.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور جو لوگ صبح وشام اپنی پروردگار سے دعا کرتے ہیں (اور) اس کی ذات کے طالب ہیں ان کو (اپنے پاس سے) مت نکالو۔ ان کے حساب (اعمال) کی جوابدہی تم پر کچھ نہیں اور تمہارے حساب کی جوابدہی ان پر کچھ نہیں (پس ایسا نہ کرنا) اگر ان کو نکالوگے تو ظالموں میں ہوجاؤ گے", translator: "Fateh Muhammad Jalandhari", license: PD }
