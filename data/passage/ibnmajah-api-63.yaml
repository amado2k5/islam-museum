label: { ar: "سنن ابن ماجه 63 — تعريف الإسلام بأعماله، الصلاة والزكاة والصوم والحج مجتمعة", en: "Sunan Ibn Majah 63 — Islam defined by its acts; the prayer, the zakat, the fast and the pilgrimage named together", ur: "سنن ابن ماجہ 63 — اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Sunan Ibn Majah 63 — El Islam definido por sus actos; la oración, el zakat, el ayuno y la peregrinación se nombran juntos.", fr: "Sunan Ibn Majah 63 — L'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage sont cités ensemble." }
text: "… النَّبِيِّ ـ فَأَسْنَدَ رُكْبَتَهُ إِلَى رُكْبَتِهِ وَوَضَعَ يَدَيْهِ عَلَى فَخِذَيْهِ. ثُمَّ قَالَ يَا مُحَمَّدُ مَا الإِسْلاَمُ قَالَ \" شَهَادَةُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنِّي رَسُولُ اللَّهِ وَإِقَامُ الصَّلاَةِ وَإِيتَاءُ الزَّكَاةِ وَصَوْمُ رَمَضَانَ وَحَجُّ الْبَيْتِ \". قَالَ صَدَقْتَ. فَعَجِبْنَا مِنْهُ يَسْأَلُهُ وَيُصَدِّقُهُ. ثُمَّ قَالَ يَا مُحَمَّدُ مَا الإِيمَانُ قَالَ \" أَنْ تُؤْمِنَ بِاللَّهِ وَمَلاَئِكَتِهِ وَرُسُلِهِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 63، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 63 (The Book of the Sunnah), that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, belief in God, His angels, His books and His messengers, the question about faith and its answer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 63، جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 63 (El Libro de la Sunnah), que menciona el Islam definido por sus actos, la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat, la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, la cuestión de la fe y su respuesta. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 63 (Le Livre de la Sunna), aborde l'islam en le définissant par ses actes: la prière, la zakat, le jeûne et le pèlerinage (mentionnés ensemble), le témoignage, la prière et la zakat, la croyance en Dieu, Ses anges, Ses livres et Ses messagers, ainsi que la question de la foi et sa réponse. Le moteur de recherche « Piliers et branches de la foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
