text: |-
  التجر الفح والحمر كاف
  القاموس
  ٢ ى تسمتة بقية البيت
  لاسطوتى تتعالطى غيره وضعها
  ١٨٤
  بكى دوبل لايرقى اللّه دمعه * ⁦(دجل)⁩ الدجال والدجالة الرفقة العظيمة قال الساعر
  دجانة من أعظم الرفاق والدجال المسيح الكذاب ودجلة نهر بغداد قال ثعاب تقول عبرت
  دجلة بغير ألف ولام والبعير المدجل المهنو بالقطران قال أبو عبيد فاذا هنئ جسد البعير
  أجمع فذلات التدجيل قاذا جعلته على المشاء رفذلك الدمن حل ال الاصمعى الدحل
  هوة تكون فى الارض وفى أسافل الاودية فيهاضيق ثم تتسع والمع دحول ودحال وأدسال
  ودحلان وقددحات فيه أدحل أى دخات فى الدحل ويتردحول أى ذات تلجف اذا أ كل
  الماءجرابها ودحلت البترأدحلها اذاحفرت فى جوانبها ومنه قول أبى هريرة رضى اللّٰه عنه
  لرجل سأله فقال انى رجل مصراد أفأدخل المولة معى فى اليت قال نعم وأدحل فى الكسر
  قال أبو عبيده ومأخوذ من الدحل أى صرفى جانب الخباء كالذى يصير فى الدحل والداحول
  ما ينصبه صائد الظباء من الخشب والدحل الحبّ الخبيث عن أبى عمرو قال أبوز بدهو
  انخداع أيضاورجل دحل بين الدحل أى سمين فصير منداق البعان ( دخل دخل دخولا
  يقال دخلت البيت والصحيح فيه أن تريذد خلت الى البيت وحذفت حرف الجرّ فانتصب
  نتصاب المفعول به لانّ الامكمة على ضربين مبهم ومحدود فالبهم نحوجهات الجسم الست
  خلف وقدّام ويمين وشمال وفوق وتحت وماجرى مجرى ذلك من أسماءهذه الجهات نحو
  أمام ووراء وأعلى وأسفل وعند ولدن ووسط بمعنى بين وقبالة فهذا وما أشبهه من الامكنة
  يكون ظرفا لانه غير محدود ألا ترى أن خلفك قديكون قدا ما لغيرك فأما المحدود الذى له
  خلقسة وشخص وأقطاروزه غحو الجبل والوادى والسوق والدار والمسجد فلا يكون ظرفا
  لانك لا تقول قعدت الدار ولاصامت المسحد ولاغت الجبل ولاقت الوادى وماجاء-ن ذلائ
  فانماه و جهذف حرف الجر نحودخات البيت ونزات الوادى وصعدت الجل واتخل على
  افتعل مثل دخل وقدباء فى الشعراند خل وليس بالفصيح قال الكميت ( ٢
  ولايدى فى حيت السكر تندخل * ويقال تدخسل الشئ أى دخل قلي لا قليلا وقد تداخلنى
  منسه شى والدخل خلاف الخرج والدخل العيب والرببة ومن كلامهم ترى الفتيان كالنخل
  وما يدريك بالدخل وكذلك الدخل بالتحريك يقال هذا الامر فيهدخل ودغل بحنى وقوله
  عالى ولا تخذوا أيمانسكم دخلابينكم أى مكرا وخديعة وهم دخل فى بنى فلان اذا
  انتسبوا معهم وايسواءنهم والمدخل بالفتح الدخول وموضع الدخول أيضاتقول دخلت
  مدخلاحسنا ودخلت مدخل صدق . والدخل بضم الميم الادخال والمفعولمن
  أدخله تقول أدخلته مدخل صدق وداخلة الازاراً حدطرفيه الذى يلى الجسدوداخلة
  الرجل أيضا باطر أره وكذلن الدخلة بالضم يقال هو عالم بدخلته ودخيل الرجل
  ودخلله الذى يداخله فى أموره ويختص به والدخل طارصغير والجمع الدخاخي-ل
  والدخل من الكلاماد خل منه فى أصول الشعر قال الشاءر
  نباشيراً-وى دخل وجيم• والدخال فى الورد أن يشرب البعير ثم يردّ من العطن الى المرض
  ويدخل بين بعيرين عطشانين ايشرب منه ماعساه لم يكن شرب منه ومنه قول الشاعر
  وتوفى الدفوف بشرب دخال • ودخل فلان فهو مدخول أى فى عقله دخل ونخلة مدخولة
