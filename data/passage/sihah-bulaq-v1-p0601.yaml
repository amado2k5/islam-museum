text: |-
  ١ لت اتحبه عليه أى آثره
  علمه واختاره ومنه قوله تعالى
  فاسعبوا العمى على الهذى
  واستحبه أحبه ومنه المضب
  إ• مختار
  ٤٠
  ⁦(باب ال.٠١)⁩
  والمجوب حديدة يجاب بها أى يقطح وجاب يجوب جوبا اذاخرق وقطع قال اللّٰه تعالى وعود
  الذين جابوا الصخر بالواد قال أبو عبيد وسمى رجل من بن كلاب جوّا بالانه كان لا يحفر بئرا
  ولا صخرة الاأماهها وجبت البلاد أجو بها وأجيبها واجتبتها أذا قطعتها ويقال هل
  جاءكم جائبة خبر أى خبر يجوب الارض من بلدالى بلد وجيدت القميص تجيببا اذا جعلت له
  جيبا واجتبت القميص اذ البته قال لبيد
  فبتلك اذرقص اللوامع بالضحى * واجتاب أردية السراب اكامها
  والجوبة الفرجة فى السحاب وفى الجبال وانجابت السصابة انتشفت والجوية موضع
  ينجاب فى الحرّة والجمع جوب والجوب الترس والحوب كالبقيرة وتجوب قبيلة من حمير
  حلفاءاراد منهم ابن ملجم قال الكميت
  ألا ان خير الناس بعدثلاثة • قتيل التجوبي الذى جاءمن مصر
  وتجيب بطن من كندة وهو تجيب بن كندة بن تور
  صل الحا حبب الحبة واحدة حب الحفظة ونحوها من الحبوب وحبة
  القلب سويداؤهوبقال تمرته وهو ذاك والحبة السوداء والحبة الخضراء والحبة من الشئ
  القطعة منه و يقال للبردحب الغمام وحب المزن وحب قر ابن السكيت وهذاجابر بن حبة
  اسم للفبزوهو معرفة والجية بالكسر بزور الصحراء عماليسيقوت وفى الحديث فينيتون كما
  تنبت الحبة فى حيل السيل والجمع حبب والحبة بالضم الحب يقال نعم وحبة وكرامة والحب
  الخايسة فارسىّ معرّب والجمع حباب وحببة والحب المحبة وكذلك الحب بالكسر والحب
  أيضا الحبيب مثل خدن وخدين يقال أحبه فهو محب وحبه يحبه بالكسر فهو
  محبوب قال الشاعر
  أحب أبامروان من أجل تمره • وأعسلم أن الرفق بالمرأرفق
  وواللّٰه لولا تمره ماحبيته * ولا كان أدنى من عبيد ومشرق
  وهذاشاذلانه لا يأتى فى المضاعف يفعل بالمكسر الا و يشركد يفعل بالضم اذا كان متعديا
  ماخلاهذا الحرف وتقول ما كنت حيبا واقد حبيت بالكسر أى صرت حبيبا الاصمعى
  قواهم حب بفلان معناه ما أحبه الىّ وقال الفرّا«معناه حبب بضم الياءثم أسكنت وأدغمت
  فى الشانية قال ابن السكيت فى قول ساعدV
  *جرت غضوب وحب من يتجنب • وعدت عواددون وايك تشغب
  ،(أراد حيب فادغم ونقسل الضمة الى الحاءلانه مدح ومنه قولهم حبذازيد فب فعسل ماض
  لا يتصرف وأصله حبب على ما قال الفرّاء وذا فاعله وهواسم مبهم من أسماء الاشارة جعلا
  شيتا واحدافصار بمنزلة اسم يرفع ما بعده وموضعه رفع بالابتداء وزيد خبره فلا يجوز أن يكون
  بدلا من ذالانك تقول حبذا امرأة ولو كان بدلا لقلت حبذه المرأة قال الشاعر جرير
  وحبذا نفحات من يمانية • تأتيك من قبل الريان أحيانا
  وتحيب اليه تودد وتحبب الجماراذا امتلاً من الماء وشربت الابل حتى حبيت أى تملات
  ريا وامرأ: محية لزوجها ومح جها أيضاعن الفترّاء والاستعباب كالاستحسان (١
  وتعابوا
