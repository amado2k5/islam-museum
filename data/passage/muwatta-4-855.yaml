label: { ar: "الموطأ 855 — القاسم بن محمد: من كان عليه قضاء رمضان فلم يقضه وهو قوي حتى جاء رمضان آخر، أطعم عن كل يوم مسكيناً مداً من حنطة، وعليه مع ذلك القضاء", en: "Muwatta 855", es: "Muwatta 855", fr: "Muwatta 855", ur: "موطا 855", tr: "El-Muvatta 855 — El-Kâsım ibn Muhammed: Ramazan ayında kaçırdığı günleri, bir sonraki Ramazan gelene kadar telafi etmeyen kimse, kaçırdığı her gün için bir fakire bir çamur buğday yedirmeli ve kaçırdığı günleri de telafi etmelidir.", id: "Al-Muwatta 855 — Al-Qasim ibn Muhammad: Barang siapa yang melewatkan hari-hari puasa Ramadan dan tidak menggantinya selagi ia mampu hingga Ramadan berikutnya tiba, maka ia wajib memberi makan orang miskin semud gandum untuk setiap hari puasa yang terlewat, dan ia juga wajib mengganti hari-hari puasa yang terlewat tersebut." }
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن أبيه القاسم بن محمد، أنه كان يقول: من كان عليه قضاء رمضان فلم يقضه وهو قوي على صيامه حتى جاء رمضان آخر، فإنه يطعم عن كل يوم مسكيناً مداً من حنطة، وعليه مع ذلك القضاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (467). {cite:muwatta-maruf-1997 p.413} {cite:muwatta-maruf-1997 p.414}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, o da babası el-Kâsım ibn Muhammed'den rivayet ederek şöyle buyurmuştur: \"Kim Ramazan ayında oruç tutabilecek durumda iken bir sonraki Ramazan'a kadar oruç tutmadığı günleri kaza etmezse, kaçırdığı her gün için bir fakire bir mudd (belirli bir ölçü) buğday yedirmeli ve kaçırdığı günleri kaza etmelidir.\" Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten (467) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.413} {cite:muwatta-maruf-1997 s.414}"
  id: "Malik meriwayatkan hadits ini dari Abd al-Rahman ibn al-Qasim, yang meriwayatkan dari ayahnya, al-Qasim ibn Muhammad, yang berkata: Barang siapa yang melewatkan hari-hari puasa Ramadan dan tidak menggantinya, padahal ia mampu berpuasa, hingga Ramadan berikutnya tiba, maka ia wajib memberi makan orang miskin satu mudd (ukuran tertentu) gandum untuk setiap hari puasa yang terlewat, dan ia juga wajib mengganti hari-hari puasa yang terlewat tersebut. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini dari Malik (467). {cite:muwatta-maruf-1997 p.413} {cite:muwatta-maruf-1997 p.414}"
