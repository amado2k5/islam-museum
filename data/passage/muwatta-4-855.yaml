label: { ar: "الموطأ 855 — القاسم بن محمد: من كان عليه قضاء رمضان فلم يقضه وهو قوي حتى جاء رمضان آخر، أطعم عن كل يوم مسكيناً مداً من حنطة، وعليه مع ذلك القضاء", en: "Muwatta 855" }
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن أبيه القاسم بن محمد، أنه كان يقول: من كان عليه قضاء رمضان فلم يقضه وهو قوي على صيامه حتى جاء رمضان آخر، فإنه يطعم عن كل يوم مسكيناً مداً من حنطة، وعليه مع ذلك القضاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (467). {cite:muwatta-maruf-1997 p.413} {cite:muwatta-maruf-1997 p.414}"
