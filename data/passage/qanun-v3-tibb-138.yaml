text: "… يمكن للمحموم الحاد الحمّى أن يبول إلا قليلاً مع وجع من غير قرحة، أو ورم في آلات البول، ومع تواتر من النبض وضعف فهو علامة رديئة. إذا احتبس البول في حمّى دائمة وشدّة صداع، وكثرة عرق، دلّ على كزاز. البول …"
