label: { ar: "الموطأ 1125 — مالك: سمع أهل العلم يقولون: لا يأكل صاحب الهدي من الجزاء والنسك شيئاً", en: "Muwatta 1125", es: "Muwatta 1125", fr: "Muwatta 1125", ur: "موطا 1125", tr: "El-Muvatta 1125 — Malik: Alimlerin şöyle dediklerini işittim: Kurban kesen kişi kurbandan veya sunulan şeyden hiçbir şey yememelidir.", id: "Al-Muwatta 1125 — Malik: Aku mendengar para ulama berkata: Orang yang mempersembahkan hewan kurban tidak boleh memakan apa pun dari kurban atau persembahan itu." }
text: "لا يأكل صاحب الهدي من الجزاء والنسك شيئاً"
summary:
  ar: "قول يرويه يحيى عن مالك: سمع أهل العلم يقولون: لا يأكل صاحب الهدي من الجزاء والنسك شيئاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1228) وسويد (540). {cite:muwatta-maruf-1997 p.513}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir ifadeye göre: Alimler şöyle demişlerdir: Kurbanı sunan kişi, kurbandan veya sunulan şeyden hiçbir şey yememelidir. Editör, bunun Malik'ten rivayetle Ebu Mus'ab (1228) ve Suveyd (540) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.513}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Para ulama berkata: Orang yang mempersembahkan hewan kurban tidak boleh memakan apa pun dari kurban atau persembahan itu sendiri. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1228) dan Suwaid (540). {cite:muwatta-maruf-1997 p.513}"
