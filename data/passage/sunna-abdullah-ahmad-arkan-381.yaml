text: "… عَبَّاد، قال : الإبانة الكبرى من طريق المصنف. ورواه أحمد في الإيمان، والخلال من طريق المروذي. ورواه أحمد و، ويشهد له ما رواه مسلم من حديث أنس صيهِ : ثلاثٌ مَن كنّ فيه وجدَ بهنَّ حلاوةَ الإيمان:.. وأن يُحبَّ المرءَ …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 381، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 381, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 381 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
