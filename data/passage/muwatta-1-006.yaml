ref: "1.6"
label: { ar: "الموطأ 6 — كتاب عمر إلى عماله: إن أهم أمركم عندي الصلاة", en: "Muwatta 6", es: "Muwatta 6", fr: "Muwatta 6", ur: "موطا 6", tr: "El-Muvatta 6 — Ömer'in valilerine mektubu: Benim için en önemli şey namazdır.", id: "Al-Muwatta 6 — Surat Umar kepada para gubernurnya: Hal yang terpenting bagiku adalah salat." }
text: "إن أهم أمركم عندي الصلاة، من حفظها وحافظ عليها حفظ دينه، ومن ضيعها فهو لما سواها أضيع"
summary:
  ar: "أثر موقوف يرويه مالك عن نافع مولى ابن عمر، في باب وقوت الصلاة: كتب عمر بن الخطاب إلى عماله أن الصلاة أهم أمورهم عنده، فمن حفظها حفظ دينه ومن ضيعها فهو لغيرها أضيع، ثم بيّن لهم أوقاتها: الظهر من أن يصير الفيء ذراعاً إلى أن يصير ظل المرء مثله، والعصر والشمس مرتفعة بيضاء نقية بقدر ما يسير الراكب فرسخين أو ثلاثة قبل الغروب، والمغرب عند غروب الشمس، والعشاء من مغيب الشفق إلى ثلث الليل، مع تحذير المتهاون بالنوم عنها، والصبح والنجوم بادية مشتبكة. ويبين المحقق أن المراد بتضييعها تأخيرها لا تركها، وأن الإسناد منقطع لأن نافعاً لم يلق عمر، لكن عبد الرزاق وصله عن نافع عن ابن عمر «فصح الأثر بهذا». {cite:muwatta-maruf-1997 p.37}"
  en: "Umar ibn al-Khattab's letter to his officials on the times of the prayers, in which he says that keeping to the prayer is keeping to the religion."
  es: "Carta de Umar ibn al-Khattab a sus funcionarios sobre los horarios de las oraciones, en la que afirma que cumplir con la oración es cumplir con la religión."
  fr: "Lettre d'Umar ibn al-Khattab à ses fonctionnaires concernant les horaires des prières, dans laquelle il affirme que respecter la prière, c'est respecter la religion."
  ur: "عمر بن الخطاب کا نماز کے اوقات کے بارے میں اپنے حکام کو خط، جس میں انہوں نے کہا کہ نماز کی پابندی کرنا دین کی پابندی ہے۔"
  tr: "Malik'in İbn Ömer'in azatlı kölesi Nafi'den rivayet ettiği, bir Sahabe'ye atfedilen bir hadiste namaz vakitleri şöyledir: Ömer ibn el-Hattab valilerine namazın kendisi için en önemli mesele olduğunu yazmıştır. Kim namazı korursa dinini korur, kim onu ihmal ederse diğer konularda daha da ihmalkâr olur. Sonra namaz vakitlerini şöyle belirtmiştir: Öğle namazı (Zhuhr), gölge bir arşın uzunluğa ulaştığı andan itibaren insanın gölgesinin kendi boyuna eşit olduğu ana kadar; ikindi namazı (Asr), güneşin yüksek, parlak ve açık olduğu, bir binicinin iki veya üç fersah (yaklaşık 12 veya 12 kilometre) yol kat edebileceği mesafeden önce; akşam namazı (Maghrib), gün batımında; yatsı namazı (Isha), alacakaranlığın kaybolmasından gecenin üçte biri geçene kadar, namazı kaçırarak ihmalkâr olanlara uyarıda bulunularak; ve sabah namazı (Fajr), yıldızlar görünür ve iç içe geçmiş haldeyken. Araştırmacı, ihmal etmekten kastedilenin tamamen terk etmek değil, geciktirmek olduğunu ve rivayet zincirinin Nafi'nin Ömer ile görüşmemesi nedeniyle koptuğunu açıklıyor. Ancak Abdül-Razzak, bunu İbn Ömer'den rivayet edilen Nafi'nin nasihatiyle birleştirmiş ve böylece rivayeti sahih kılmıştır. {cite:muwatta-maruf-1997 s.37}"
  id: "Sebuah riwayat yang dinisbahkan kepada seorang Sahabat, yang dinarasikan oleh Malik atas otoritas Nafi', budak yang dibebaskan oleh Ibnu Umar, mengenai waktu shalat: Umar bin al-Khattab menulis kepada para gubernurnya bahwa shalat adalah perkara yang paling penting baginya. Siapa pun yang menjaganya, menjaga agamanya, dan siapa pun yang mengabaikannya akan lebih lalai lagi dalam perkara-perkara lainnya. Kemudian beliau menetapkan waktu-waktunya: Dzuhur (shalat tengah hari) dari saat bayangan menjadi satu hasta hingga bayangan seseorang sama panjangnya dengan tinggi badannya; Ashar (shalat sore) ketika matahari tinggi, terang, dan jelas, untuk jarak yang dapat ditempuh oleh seorang penunggang kuda sejauh dua atau tiga farsakh (kira-kira 12 atau 12 kilometer) sebelum matahari terbenam; Maghrib (shalat maghrib) saat matahari terbenam; Isya (shalat malam) dari saat senja menghilang hingga sepertiga malam telah berlalu, dengan peringatan bagi mereka yang lalai karena tertidur selama waktu tersebut; dan Subuh (shalat fajar) ketika bintang-bintang terlihat dan saling bertautan. Peneliti menjelaskan bahwa yang dimaksud dengan mengabaikannya adalah menundanya, bukan meninggalkannya sama sekali, dan bahwa rantai periwayatan terputus karena Nafi' tidak bertemu Umar. Namun, Abd al-Razzaq menghubungkannya atas otoritas Nafi' yang juga atas otoritas Ibn Umar, sehingga menjadikan riwayat tersebut sahih. {cite:muwatta-maruf-1997 p.37}"
