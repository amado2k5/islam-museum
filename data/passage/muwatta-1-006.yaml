label: { ar: "الموطأ 6 — كتاب عمر إلى عماله: إن أهم أمركم عندي الصلاة", en: "Muwatta 6" }
text: "إن أهم أمركم عندي الصلاة، من حفظها وحافظ عليها حفظ دينه، ومن ضيعها فهو لما سواها أضيع"
summary:
  ar: "أثر موقوف يرويه مالك عن نافع مولى ابن عمر، في باب وقوت الصلاة: كتب عمر بن الخطاب إلى عماله أن الصلاة أهم أمورهم عنده، فمن حفظها حفظ دينه ومن ضيعها فهو لغيرها أضيع، ثم بيّن لهم أوقاتها: الظهر من أن يصير الفيء ذراعاً إلى أن يصير ظل المرء مثله، والعصر والشمس مرتفعة بيضاء نقية بقدر ما يسير الراكب فرسخين أو ثلاثة قبل الغروب، والمغرب عند غروب الشمس، والعشاء من مغيب الشفق إلى ثلث الليل، مع تحذير المتهاون بالنوم عنها، والصبح والنجوم بادية مشتبكة. ويبين المحقق أن المراد بتضييعها تأخيرها لا تركها، وأن الإسناد منقطع لأن نافعاً لم يلق عمر، لكن عبد الرزاق وصله عن نافع عن ابن عمر «فصح الأثر بهذا». {cite:muwatta-maruf-1997 p.37}"
  en: "Umar ibn al-Khattab's letter to his officials on the times of the prayers, in which he says that keeping to the prayer is keeping to the religion."
