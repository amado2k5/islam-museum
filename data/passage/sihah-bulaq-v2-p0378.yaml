text: |-
  *⁦(باب اللام)⁩+
  ٢٠٩
  والناب الشارف من النوق واساف اسم رجل وخر طلة أى لذيذة قال حيد ين بُور
  ركود الحياطلة شاب ماءها • بهامن عقارا السكروم زبيب
  والطلل ماشخص من آثار الدار وابهع أطلال وطلول وطلل السفينة جلالها ويقسال حي
  اللّه طللك رطلالتك بمعنى أى شخصك قال يعقوب وحكى عن أبى عم روما بالناقة طل بالضم أى
  مابها لبن ويقال رماه اللّه بالطلاطلة وهو الداء العضال الذى لادواءله والداهية أبوزيد
  طلّ دمه فهو مطاول وقال
  دماؤهم ليس لها طالب * مطلولة مثل دم العذره
  وأطل"دمه وطله اللّه وأطله أهدره قال ولا يقال طنّ دمه بالفح وأبو عبيدة والكسائىّ
  يقولانه وقال أبو عبيدة فيه ثلاث لغات طلّ دمه وطلّ دمه وأطلّ دمه وأطل" عليه أى
  أشرف وقال جوير ١ أنا البازى المطل على غيره وتقول هذا أمر مطلّ أى ليس عسفر
  وتطال أى مدعنقه بنظرالى الشئ يعد عنه وقال
  كفى حزنا أنى تطاللت كى أرى * ذراقلتى دمح فازيات
  مل الطملة والطعلة بالتحريك المهأة والطين يبق فى أسفل الحوض يقال صار الماء
  طعلة واحسدة كما يقال دكلة واطمل ما فى الحوض فلم يترك فيه قطرة وهوافتعل منسه
  والطعل بالكسر اللص- قال لبيه
  وأسرع فى الفواحش كل طمل * يجرّ الخزيات ولاييالى
  والمطملة ما توسع به اللخبرة وطملت انخبزة وسعتها وطملت النساقة طملاسرتها سيرافسيها
  ( ول الطول خلاف العرض وطالو الشئ أى اءتدوطلت أصلد طوات بضم الواو
  لانك تقول طويل فنقلت الضمة الى الطاء وسقطت الواولاجتماع الساكنين ولا يجوز
  أن تقول منه طلته لانّ فعلت لا يتعدى فان أردت أن تعديه قلت طوّلته أوأطلته وأمّاقولك
  طاولى فلان فطلته فاغاتعنى يذلك كنت أطول منه من الطول والطول جيعا وطال طولك
  وطيلك أى عمرك ويقال غيبتك قال القطامى
  انا محيوك فاسلم أيها الطلل * وان بليت وان طالت بك الطول
  ديروى الطيل ويقال أيضاطال طيلك وطولك ساكنة الياء والواو وطال طوللت بضم الطاء
  وفتح الواووطال طوالك بالفتح وطيالك بالسكسر كل ذلك حكاه ابن السكيت قال فأما الحبل
  فلم نسمعه الابكسر الاول وفتح الشانى يقال أرخ للفرس من طوله وهوالحبل الذى يطوّل
  لداية فترعى فيه قال طرفة
  لغمركان الموت ما أخطأ الفق * لكالطول المرخى وثنياه باليد
  وهى الطويلة أيضا وقوله ما أخطأ الفتى اى فى اخطائه الفى وقد شدده الرأجز(٢ للضرورة
  نقال
  تعرّضت لى بمكان حلْ • تعرّض المهرة فى الطول
  وقد يفعلون.ثل ذلك فى الشعر كثيراويزيدون فى الحرف من بعض حروفه قال الراجز ٣
  قطنة من أجود القطنّ * ويقال أيضاطول فرسك أى أرخ طويته فى المرعى والطوال
  بالضم الطويل يقال طويل وطوال فاذا أفرط في الطول قيسل طوّال بالتشديد والطوال
  ٥٣
  (١ ف نسطة بقية اليت
  أتيح من السماءلها انصبايا
  ٢ ف نسخة زيادة منصوربن
  حى:د الاسدى اه
  ٢ ف نسخة أول البيت
  كانّ مجرى دمعها المستنّ
