text: "… أن النيّ وَلِّم نعى للَّاسِ النَّجاشيَّ اليومَ الدي ماتَ فيه، وخرجَ بهِمْ إلى المصلّى، فصفً بهِم، وكبَّرَ أربعَ تكبيرات. متفقُ عليه. - وعن عبدِ الرَّّحمنِ بن أبي ليْلى، قال : كانَ زبدُ بن أرقم يكبِرُ على جَنائزِنا أربعاً، وإِنَّه كبَّرَ …"
