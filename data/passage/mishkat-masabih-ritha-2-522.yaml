text: "… أن النيّ وَلِّم نعى للَّاسِ النَّجاشيَّ اليومَ الدي ماتَ فيه، وخرجَ بهِمْ إلى المصلّى، فصفً بهِم، وكبَّرَ أربعَ تكبيرات. متفقُ عليه. - وعن عبدِ الرَّّحمنِ بن أبي ليْلى، قال : كانَ زبدُ بن أرقم يكبِرُ على جَنائزِنا أربعاً، وإِنَّه كبَّرَ …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 522، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Mishkat al-Masabih, scan volume 2, p. 522, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "مشکوٰۃ المصابیح، اسکین جلد 2، ص 522 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
