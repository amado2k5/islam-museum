  es: "Un extracto de Mishkat al-Masabih, volumen escaneado 2, p. 522, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Mishkat al-Masabih, Resimli Cilt 2, sayfa 522'den bir alıntı; bir ağıt ve ölüm ilanı içeriyor; makine tarafından okunabilir taranmış baskıdan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Mishkat al-Masabih, Jilid Bergambar 2, hlm. 522, berisi eulogi dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
