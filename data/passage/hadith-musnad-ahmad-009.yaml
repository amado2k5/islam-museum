text: "وقع بأرض وأنتم بها فلا تخرجوا فرارا منه. قال: فرجع عمر بن الخطاب من الشام (١٩٤/١). ١٦٧٩ - حدثنا عبد الرزاق، أنبانا معمر، عن الزهري، عن عبد الحميد بن عبد الرحمن بن زيد بن الخطاب، عن عبد الله بن عبد"
