text: |-
  ٣٥٦
  ⁦(باب الرا٠ )⁩
  وقد ظفرت عينه بالكسر تظفرظفرا والظفر بالفتح الفوزوقد ظفر بعدوه وظرهأيضامئل
  مق به ولحقه فهو ظفر قال العجيم السلولى يمدح رجلا
  هوالظف رالميمون ان راح أوغدا * به الركب والتلعابة المتحبب .
  قال الاخفش وتقول العرب ظفرت عليه فى معنى ظفرت به وماظفرتك عيى منذزمان أى
  ما رأتك والنافرما اطمأت من الارض وأنيت وأظفره اللّٰه بعدوه وظفره به تظفيرا ورجل
  مظفر صاحب دولة فى الحرب والتفافير غمز الظفر فى التفاحة ونوها ويقال أيضاظفر
  النبت اذا طلع مقدار الظفر واظر الرجل أى أعلق ظفره وهو افتعل فأدعم وقال الحجاج
  يصف بازيا شاكى الكلراب اذا أهوى اظفر واظفرأ يضابعى ظفروظفارمثل
  قطام مدينة بالمن يقال من دخل ظفار حروجزع ظفارى منسوب اليها وصحكذلاعود
  ظفارى وهو العود الذى يتخربه هر ) الظهر خلاف البطن وقولهم لا تجعل حاجى
  بظهر أي لا تنسها والظهر الركاب وينوفلان مظهرون ادُاكان لهم ظهر ينقلون عليه
  كما يقال منجبون اذا كانوا أصماب نجائب والظهر الجانب القصير من الريسْ والجمع
  الظهران والظهر طريق البر وأقران الظه-رالذين يجيؤن من وراءظهرك فى الحرب ويقال
  هو نازل بين ظهر يهم وظهرانيهم يقتح النون ولا تقل ظهرانيهم يكسر النون قال الاحرقولهم
  اتيته بين الظهرانين معناه فى اليومين أوفى الايام قال وبين الظهرين مث-لدحكاه عنه أبو عبيد
  والظهر بالضم بعد الزوال ومنه صلاة الظهر والظهيرة الهاجرة يقال أتيته حدّ الظهيرة وحين
  قام قائم الظهيرة والظهير المعين ومنه قوله تعالى والملائكة بعد ذلك ظهير واتمالم يجمع
  لانَ فعيل وفعول قديستوى فيهما المذكر والمؤنت والجمع كما قال تعالى انارسول
  رب العالمين قال الشاعر
  ياعاذلانى لا تزدن. لامى • انّ العوادل لسن لى بأميّر
  يريد الامراء قال الاصعي يقال بعير ظهيريين الظهارة اذا كانة ويا وناقة ظهيرة قال والبعير
  الظهربالكسر العدّة للمحاجة ان احتيج البه وجعه ظهارة غير مصر وف لات ياء النسبة
  ثابتسة فى الواحد والظهرىّ أيضا الذى تجع-له يظهر أى تنساه ومنه قوله تعالى واتخذوه
  وراءكم ظه ريا وفلان ظهرتى على فلان وأناظ، رتك على هذا الامرأى عونك والظاهر خلاف
  الباطن والظاهرة من العيون الجاحظة ويقال هذا أمر ظاهر عنك عاره أى زائل قال
  الشاعر كثير وعيرها الواشون أنى أحبها * وتلكْ شكاة ظاهر عنك عاره!
  ومنه قوله-م ظه رفلان بجاجتى اذا استخف بم اوجعلها يظهر كأنه أزالها ولم يلتفت اليها
  وجعلهاظهرية أى خلف ظهر قال الاخطل
  : وجدنا بنى البرصاء من ولد الظهر
  أى من الذين يظه رون بهم ولا يلتفتون الى أرحامهم والظاهرة من الورد أن ترد الايل كل
  يوم نصف النهاروقال الاصعى هاجت ظواهر الارض أى يبس :قلها قال والفاواه راشراف
  الارض وقريس الظواهر الذين ينزلون ظاهرمسكة والظهرة بالتحريك متاع البيت ويقال
  أيضاجاء فلان فى ظهرته أى فى قومه وناهضته والظهر أيضا مصدرة ولك ظهر الرجل بالكسم
  اذا اشتكى ظهره فهوظهر وظهر الشئ بالفتح ظهوراتيين وظهرت على الرحل غليته وظهرت
  البيت
