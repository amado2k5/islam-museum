text: "… كما يكره أهل المريض مريضهم، وأهل الصبى صبيهم على الدواء، ويقولون : اشرب هذا فان لك فى عاقبته خيرا. حدثنا عبد اللّه ثنا أحمد أبو اسامة ثنا مسعر عن عون. قال : الصوم من الحلال أن تدخله، ومن الحرام أن …"
