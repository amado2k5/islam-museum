text: "… كتاب الهبة والعطية إذا أوصى له بسهم من ماله، أعطى السدس رجل قال : هذا ثلثى لفلان، ويعطى فلان منه مائة فى كل شهر إلى أن يموت،... ما أعطى فى مرضه الذى مات فيه، فهو من الثلث حكم العطايا فى …"
