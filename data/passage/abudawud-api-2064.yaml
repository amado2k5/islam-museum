label: { ar: "سنن أبي داود 2064 — الأب والأبوة", en: "Sunan Abi Dawud 2064 — the father and fatherhood", ur: "سنن ابی داؤد 2064 — باپ اور والدیت", es: "Sunan Abi Dawud 2064 — El padre y la paternidad" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ النُّفَيْلِيُّ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، ح وَحَدَّثَنَا ابْنُ الْعَلاَءِ، حَدَّثَنَا ابْنُ إِدْرِيسَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ حَجَّاجِ بْنِ حَجَّاجٍ، عَنْ أَبِيهِ، قَالَ قُلْتُ يَا رَسُولَ اللَّهِ مَا يُذْهِبُ عَنِّي مَذَمَّةَ الرَّضَاعَةِ قَالَ \" الْغُرَّةُ الْعَبْدُ أَوِ الأَمَةُ \". قَالَ النُّفَيْلِيُّ حَجَّاجُ بْنُ حَجَّاجٍ الأَسْلَمِيُّ وَهَذَا لَفْظُهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2064، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2064 (Marriage (Kitab Al-Nikah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2064، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2064 (Matrimonio (Kitab Al-Nikah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
