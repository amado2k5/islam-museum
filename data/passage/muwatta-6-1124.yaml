label: { ar: "الموطأ 1124 — ابن عمر: من أهدى بدنة ثم ضلت أو ماتت، فإنها إن كانت نذراً أبدلها، وإن كانت تطوعاً فإن شاء أبدلها وإن شاء تركها", en: "Muwatta 1124", es: "Muwatta 1124", fr: "Muwatta 1124", ur: "موطا 1124", tr: "İbn Ömer: Bir kimse kurbanlık hayvan sunar ve hayvan kaybolur veya ölürse, eğer bu bir adak ise, onu yenilemelidir. Eğer gönüllü bir kurban ise, dilerse yenisini sunabilir, dilerse de sunmayabilir.", id: "Al-Muwatta 1124 — Ibn Umar: Jika seseorang mempersembahkan hewan kurban dan hewan itu hilang atau mati, maka jika itu adalah nazar, dia wajib menggantinya. Jika itu adalah kurban sukarela, maka jika dia mau, dia boleh menggantinya, dan jika dia mau, dia boleh membiarkannya saja." }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه قال: من أهدى بدنة ثم ضلت أو ماتت، فإنها إن كانت نذراً أبدلها، وإن كانت تطوعاً فإن شاء أبدلها وإن شاء تركها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1218) وسويد ⁦(527م)⁩ ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.513}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ederek şöyle buyurmuştur: \"Bir kimse kurban keser ve kurban kaybolur veya ölürse, eğer adak olarak kesilmişse, yerine yenisini koymalıdır. Eğer gönüllü olarak kesilmişse, dilerse yerine yenisini koyabilir, dilerse de bırakmayabilir.\" Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab (ö. 1218 Hicri), Suveyd (ö. 527 Miladi) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.513}"
  id: "Malik meriwayatkan hadits ini dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar, yang berkata: “Jika seseorang mempersembahkan hewan kurban dan kemudian hewan itu hilang atau mati, maka jika itu adalah nazar, dia wajib menggantinya. Jika itu adalah kurban sukarela, maka jika dia mau, dia boleh menggantinya, dan jika dia mau, dia boleh membiarkannya.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (wafat 1218 H), Suwaid (wafat 527 M), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.513}"
