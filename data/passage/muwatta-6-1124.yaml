label: { ar: "الموطأ 1124 — ابن عمر: من أهدى بدنة ثم ضلت أو ماتت، فإنها إن كانت نذراً أبدلها، وإن كانت تطوعاً فإن شاء أبدلها وإن شاء تركها", en: "Muwatta 1124" }
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه قال: من أهدى بدنة ثم ضلت أو ماتت، فإنها إن كانت نذراً أبدلها، وإن كانت تطوعاً فإن شاء أبدلها وإن شاء تركها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1218) وسويد (527م) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.513}"
