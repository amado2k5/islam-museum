  ur: "سیرت ابن ہشام، ص 114 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
