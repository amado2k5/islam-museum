text: "… بن الزبير، عن عائشةا؛ قالت : افْتُرِضَتِ الصَّلاَةُ عَلَى رَسُولِ اللّٰه عَلِفِ أولَ ما افتُرضت عليه رَكْعَتَيْن ركعتين كُلُّ صَلاَةٍ، ثم إِنَّ اللَّهَ تعالى أتَمَّهَا في الْحَضَرِ أرْبَعاً، وأَقَرَّهَا في السَّفَرِ عَلَى فَرْضِهَا الأولِ ركعتين.. جبريل يعلّم رسول اللَّه وَلِيفم …"
summary:
