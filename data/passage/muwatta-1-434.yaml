label: { ar: "الموطأ 434 — عمر يأمر بتسوية الصفوف فإذا أخبروه أن قد استوت كبر", en: "Muwatta 434", es: "Muwatta 434", fr: "Muwatta 434", ur: "موطا 434", tr: "Al-Muwatta 434 — Ömer safların düzeltilmesini emreder ve düzeltildiği kendisine bildirildiğinde tekbir getirir.", id: "Al-Muwatta 434 — Umar memerintahkan barisan-barisan itu diluruskan, dan ketika ia diberitahu bahwa barisan-barisan itu telah diluruskan, ia mengucapkan takbir." }
summary:
  ar: "أول أثر في باب ما جاء في تسوية الصفوف. يرويه يحيى عن مالك عن نافع أن عمر بن الخطاب كان يأمر بتسوية الصفوف، فإذا جاؤوه فأخبروه أن قد استوت كبّر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق أخرجه من طريق نافع عن ابن عمر، وعلّقه الترمذي بعد حديث (227). {cite:muwatta-maruf-1997 p.224}"
  tr: "Safların düzeltilmesi bölümündeki ilk rivayet. Yahya'nın Malik'ten, o da Nafi'den rivayet ettiğine göre, Ömer ibn el-Hattab safların düzeltilmesini emrederdi ve saflar düzeltildiğini kendisine bildirdiklerinde tekbir getirirdi (Allahu Ekber). Editör, bunu Ebu Mus'ab ve Suveyd'in Malik'ten, Abd el-Razzaq'ın da Nafi'den, o da İbn Ömer'den rivayet ettiğini ve Tirmizi'nin hadisin (227) sonuna eklediğini belirtiyor. {cite:muwatta-maruf-1997 s.224}"
  id: "Riwayat pertama dalam bab tentang meluruskan barisan. Diriwayatkan oleh Yahya dari Malik dari Nafi’ bahwa Umar ibn al-Khattab biasa memerintahkan barisan untuk diluruskan, dan ketika mereka datang kepadanya dan memberitahunya bahwa barisan sudah lurus, beliau akan mengucapkan takbir (Allahu Akbar). Editor menyebutkan bahwa Abu Mus’ab dan Suwaid meriwayatkannya dari Malik, dan bahwa Abd al-Razzaq meriwayatkannya melalui Nafi’ dari Ibn Umar, dan al-Tirmidhi memasukkannya setelah hadits (227). {cite:muwatta-maruf-1997 p.224}"
