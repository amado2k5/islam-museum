summary:
  ar: "أول أثر في باب ما جاء في تسوية الصفوف. يرويه يحيى عن مالك عن نافع أن عمر بن الخطاب كان يأمر بتسوية الصفوف، فإذا جاؤوه فأخبروه أن قد استوت كبّر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق أخرجه من طريق نافع عن ابن عمر، وعلّقه الترمذي بعد حديث (227). {cite:muwatta-maruf-1997 p.224}"
