summary:
  ar: "القسم 17 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصيد»، ويضم فيها النصوص من 2844 إلى 2861 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 17 of Sunan Abi Dawud (Game (Kitab Al-Said)) in the division of the open hadith dataset the museum took its reports from: reports 2844 to 2861 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 17، عنوان «کتاب الصید»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2844 تا 2861۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 17 de Sunan Abi Dawud (Juego (Kitab Al-Said)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2844 al 2861, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Abi Dawud (Le Jeu, Kitab Al-Said), dans la section 2844 à 2861 de la base de données ouverte. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 17. bölümü \"Av Kitabı\" başlığını taşımakta olup, 2844 ile 2861 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 17 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Perburuan\" dan berisi teks 2844 hingga 2861, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
