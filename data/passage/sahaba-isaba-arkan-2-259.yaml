text: "… بن عاصم: فداء ابنتي؛ فقال: فَأَيْنَ البَعِيرَان اللذَانِ غَيّبْتَهُمَا ذكر النووي في الأذكار عند ذكر حديث أبي مالك بِالعَقِيقِ ؛ فقال الحارث: أشهد أن لا إله إلا اللّٰه وأنَك الأشعري: الطهور شطر الإيمان - أن اسمه الحارث رسول اللّٰه والله …"
summary:
