text: "- - موسى عن النبى قال : مثل المؤمن الذى يقرأ القرآن كمثل المرة طممها عليب ولا ريح لها ومثل الفاجر الذى لا يقرأ القرآن كمثل الحنظلة طعمها مر ولاريح لها. حدثنا أبو بكر بن مالك ثنا عبد اللّٰه بن …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 60، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
