text: "… على ظَهْرِ بَعِيرِهِ، فينطلق به، فخرجوا إلى خَيْبَرَ، ومنهم مَنْ سار إلى الشام، فكانَ أشرافهم مَنْ سار منهم إلى خَيْبَرَ، سَلاَّمُ بن أبي الحُقَيْقِ، وكِنَانَةُ بن الربيع بن أبي الحُقَيْقِ، وحُيَيُّ بن أَخْطَبَ، فلما نزلوها دَانَ لهم أهلها. قال ابن …"
summary:
