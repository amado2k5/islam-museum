label: { ar: "الموطأ 1220 — أبو البداح بن عاصم عن أبيه: أرخص رسول الله لرعاء الإبل في البيتوتة عن منى، فيرمون يوم النحر ثم الغد", en: "Muwatta 1220", es: "Muwatta 1220", fr: "Muwatta 1220", ur: "موطا 1220", tr: "El-Muvatta 1220 — Ebu el-Bede ibn Asim, babasının rivayetine göre: Allah'ın Resulü, deve çobanlarına Mina'dan uzakta geceleme izni verdi; böylece Kurban Bayramı günü ve ertesi gün taşlama ritüelini yerine getirebileceklerdi.", id: "Al-Muwatta 1220 — Abu al-Badah ibn Asim, berdasarkan riwayat ayahnya: Rasulullah mengizinkan para penggembala unta untuk bermalam di luar Mina, agar mereka dapat melaksanakan ritual pelemparan batu pada Hari Raya Kurban dan kemudian pada hari berikutnya." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن عمرو بن حزم عن أبيه أن أبا البداح بن عاصم بن عدي أخبره عن أبيه أن رسول الله أرخص لرعاء الإبل في البيتوتة عن منى، يرمون يوم النحر، ثم يرمون الغد، ومن بعد الغد ليومين، ثم يرمون يوم النفر. {cite:muwatta-maruf-1997 p.545}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Amr ibn Hazm'dan, onun babasından rivayetle, Ebu el-Bede ibn Asim ibn Adi'nin de ona, yine onun babasından rivayetle, Allah Resulü'nün deve çobanlarına Kurban Bayramı günü, ertesi gün ve sonraki iki gün boyunca ve nihayet Mısır'dan Çıkış Günü'nde taşlama ritüelini yerine getirmek için Mina'dan uzakta geceleme izni verdiğini bildirdiğini aktarır. {cite:muwatta-maruf-1997 s.545}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Amr ibn Hazm, yang juga diwariskan dari ayahnya, bahwa Abu al-Badah ibn Asim ibn Adi memberitahunya, juga dari ayahnya, bahwa Rasulullah SAW mengizinkan para penggembala unta untuk bermalam di luar Mina, untuk melaksanakan ritual pelemparan batu pada Hari Raya Kurban, kemudian lagi pada hari berikutnya, dan selama dua hari setelah itu, dan akhirnya pada Hari Raya Keberangkatan. {cite:muwatta-maruf-1997 p.545}"
