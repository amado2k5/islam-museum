summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن عمرو بن حزم عن أبيه أن أبا البداح بن عاصم بن عدي أخبره عن أبيه أن رسول الله أرخص لرعاء الإبل في البيتوتة عن منى، يرمون يوم النحر، ثم يرمون الغد، ومن بعد الغد ليومين، ثم يرمون يوم النفر. {cite:muwatta-maruf-1997 p.545}"
