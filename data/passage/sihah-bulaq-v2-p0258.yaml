  ونسوة كرائم ويقال رجل كرم أيضاوامأة كرم ونسوة كرم وقال ١
  فتنبو العين عن كرم مجاف* والكرام بالضم مشل الكريم فإذا أفرط في الكرم قبل كزام
  بالتشديد وكارمت الرجل اذا فاخرته فى الكرم فكر مته أكرمه بالضم اذا غليته فيه والكريم
  الصفوح وكرم السحاب اذا جاء بالغيت وأكرمت الرجل أكرمه وأصله أاكرمه مثل أدحرجه
  فاستثقلوا اجتماع الهمزتين فحذفوا الثانية ثم اتبعوا باقى حروف المضارعة الهمزة وكذلك
  فعلون ألاتراهم جذفوا الواومن يعد استنقالا لوقوعها بين ياء وكسرة ثم أسقطوامع الإلف
  والتاه والنون فأن اضطر الشاعر جازله أن يردّه الى أصله كأقال • فإنه أهل لأن يؤكرما
  فأخر جه على الاصل ويقال فى التعجب ما أسكرمه لى وهو شاذلا يطرد فى الرباعية قال
  الاخفش وقرأ بعضهم ومن يهن اللّٰه فاله من .كرم يقتح الراء أى اكرام وهو مصدر.شل
  مخرج ومدخل والكرم كرم العنب والكرم أيضا القلادة بقال رأيت في عنقها كرما
  حنا من أؤلو قال الشِاءر
