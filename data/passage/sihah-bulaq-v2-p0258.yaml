  والسكرمة رأس الفخذ المستدير كانه جوزة تدور فى قلب الورك وقال في صفة فرس
  أمرِتْ عزيزاه ويطت كرومه • الي كفل راب وصلب موثق
  والمكرمة واحدة المكادم وأرض مكرمة للنبات اذا كانت جيدة النبات قال الكسائى
  المكرم المكبرمة قال ولم يجبى على مفعل للمذكر الاحرفان بادران لايقاس عليهما. كرم
  ومعون وأنشد• ليوم دوع أوفعال مكرم* وقال جميل
  - بثين الزمى لا ان لا ان زمته • على كثرة الواشبن أى معون
  وقال الفراء هو جع مكرمة ومحونة وعنده أن-فعلاليس من أبنية الكلام والاكرومة من
  لكرم كالاعجموبة م العجب و بقال للإرجل يامكرمان بفتح الراءنقيض قولك ياملاً مانمن
  اللوم والكرم والتسكرم تكلف السكرم وقال
  تكرم لتعاد الجيل وان ترى * أخاكرم الابأن يتكرما
  وأكرم الرجل أتى بأولا دكرام واستكرم استجدث علقا كريما وفى المثل استكرمت قاريط
  والسكترام بالضِم والتتديد أ كرم من السكريم والجمع السكرامون والتكريم والاكرام؟هنى
  والاسم منْهِ الكرامة ولكرامة أيضاطبق يوضع على رأس الجبّ ويقال حل اليه الكرامة
  وعومر الولكبات لكارية لاروك ملنوينة أهذبا ارذالناهم ولأكرم
