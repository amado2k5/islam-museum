text: "… مُسْلِمِ وأراد بهذا المسلمَ حقاء المؤمن صدقا، الذى يسلم المسلمون من لسانه ويده، ويتحقق فَيه أخلاق المؤمنين، ولم يتدنس من المعاصى إلا باللمم والصغائر، فالموت يطهره منها ويكفرها بعد اجتنا به الكبائر وإقامته الفرائض. قال عطاء الحراسانى : مر رسول …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 2، ص 526، يرد فيه ذكر الفريضة والفرائض، وصغائر الذنوب، واللمم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 526, whose wording mentions the obligation (farida), the minor sins, the lamam (small faults); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 2، ص 526 کا اقتباس جس میں فریضہ اور فرائض، صغیرہ گناہ، لمم ⁦(چھوٹی لغزشیں)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din de al-Ghazali, volume numérisé 2, p. 526, dont le texte mentionne l'obligation (farida), les péchés mineurs, le lamam (fautes légères) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen digitalizado 2, p. 526, cuyo texto menciona la obligación (farida), los pecados menores, el lamam (faltas leves); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 2. cildinin 526. sayfasından, farz ameller, küçük günahlar ve küçük kusurlar hakkında bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Jilid 2, halaman 526, yang membahas tentang amalan wajib, dosa kecil, dan pelanggaran kecil. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa kecil."
