summary:
  ar: "قال مالك: حدث أنه سمع ابن شهاب يقول: مضت السنة أن الرجل إذا أصاب امرأته بجرح أن عليه عقل ذلك الجرح، ولا يُقاد منه. قال مالك: وإنما ذلك في الخطأ، أن يضرب الرجل امرأته فيصيبها من ضربه ما لم يتعمده، كأن يضربها بسوط فيفقأ عينها ونحو ذلك. {cite:muwatta-maruf-1997 p.422} {cite:muwatta-maruf-1997 p.423}"
