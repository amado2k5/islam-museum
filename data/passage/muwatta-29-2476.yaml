label: { ar: "الموطأ 2476 — ابن شهاب: مضت السنة أن الرجل إذا جرح امرأته فعليه عقل الجرح ولا يقاد منه", en: "Muwatta 2476", es: "Muwatta 2476", fr: "Muwatta 2476", ur: "موطا 2476", tr: "El-Muvatta 2476 — İbn Şihab: Bir erkek karısını yaralarsa, yaranın kan parasını ödemekle yükümlüdür ve misillemeye tabi değildir. Bu sünnettir.", id: "Al-Muwatta 2476 — Ibn Shihab: Sudah menjadi sunnah bahwa jika seorang pria melukai istrinya, dia wajib membayar uang darah atas luka tersebut, dan dia tidak dikenakan pembalasan." }
summary:
  ar: "قال مالك: حدث أنه سمع ابن شهاب يقول: مضت السنة أن الرجل إذا أصاب امرأته بجرح أن عليه عقل ذلك الجرح، ولا يُقاد منه. قال مالك: وإنما ذلك في الخطأ، أن يضرب الرجل امرأته فيصيبها من ضربه ما لم يتعمده، كأن يضربها بسوط فيفقأ عينها ونحو ذلك. {cite:muwatta-maruf-1997 p.422} {cite:muwatta-maruf-1997 p.423}"
  tr: "Malik şöyle dedi: İbn Şihab'ın şöyle dediğini işittiği rivayet edilmiştir: Yerleşik uygulama şudur ki, bir erkek karısını yaralarsa, bu yaralama için kan parası ödemekle yükümlüdür, ancak misillemeye tabi değildir. Malik şöyle dedi: Bu sadece kasıtsız yaralanmalar için geçerlidir; örneğin, bir erkek karısını dövdüğünde ve ona kasıtsız bir şekilde zarar verdiğinde, mesela onu kırbaçla vurup bir gözünü kör ettiğinde veya benzeri bir şey olduğunda. {cite:muwatta-maruf-1997 s.422} {cite:muwatta-maruf-1997 s.423}"
  id: "Malik berkata: Diriwayatkan bahwa ia mendengar Ibnu Shihab berkata: Praktik yang telah ditetapkan adalah jika seorang pria melukai istrinya, ia wajib membayar uang darah atas luka tersebut, tetapi ia tidak dikenakan pembalasan. Malik berkata: Ini hanya berlaku untuk luka yang tidak disengaja, seperti ketika seorang pria memukul istrinya dan menyebabkan kerugian yang tidak ia inginkan, seperti memukulnya dengan cambuk dan membutakan salah satu matanya, atau hal serupa. {cite:muwatta-maruf-1997 p.422} {cite:muwatta-maruf-1997 p.423}"
