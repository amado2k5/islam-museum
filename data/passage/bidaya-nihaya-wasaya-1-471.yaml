text: "… ولديه فضيلة ومعرفة وخبرة، وقد ناب عن السلطان بدار العدل مرة بمصر، وكان حاجب الميسرة، وتكلم في الأوقاف وفيما يتعلق بالقضاة والمدرسين، ثم نقل إلى دمشق فمات بها في سادس عشر شعبان، ودفن بميدان الحصى فوق خان النجيبي، وخلف تركة …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 1، ص 471، يذكر ما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 1, p. 471, that mentions what was left behind: estate and inheritance, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 1، ص 471 کا اقتباس جس میں ترکہ اور میراث، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 1, pág. 471, que menciona lo que se dejó atrás: bienes y herencia, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 1, p. 471), mentionnant les biens laissés: succession, sépulture ou lieu de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 1. cildinin 471. sayfasından, mal varlığı, miras, defin, mezar ve türbe hakkında bilgi veren bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Awal dan Akhir), Jilid 1, halaman 471, yang menyebutkan harta warisan, harta pusaka, pemakaman, kuburan, dan makamnya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh bagian \"Wasiat, Warisan, Barang Antik, dan Makam\"."
