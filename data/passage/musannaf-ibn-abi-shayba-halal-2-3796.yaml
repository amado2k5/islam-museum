text: "… عنها، فقال: لا يُحرم الحرام الحلال، جَسرتُ عليها، وهابَها إبراهيم والشعبي. - حدثنا عبدالأعلى عن هشام عن الحسن قال: حرمت عليه امرأته. - حدثنا أبو بكر قال: نا سعيد قال: قتادة: لا يحرمها ذلك عليه، غير أنه لا يغشى امرأته …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 3796، يذكر الحلال، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 3796, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 3796 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
