text: "… وأكثرُهم عرب، وأخذها مِن المجوس، ومن أهل الكتاب باليمن، وكانوا يهوداً. ولم يأخذها من مشركي العرب، فقال أحمد، والشافعي: لا تؤخذ إلا من هن تقبل الجزية من غير الطوائف الثلاث التي أخذها رسول اللّٰه ية منهم، وهم: اليهود، والنصارى، والمجوس …"
