label: { ar: "صحيح البخاري 3736 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 3736 — the orphan and the father lost", ur: "صحیح بخاری 3736 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 3736 — El huérfano y el padre perdido", fr: "Sahih al-Bukhari 3736 — L'orphelin et le père perdus" }
text: "وَقَالَ نُعَيْمٌ عَنِ ابْنِ الْمُبَارَكِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، أَخْبَرَنِي مَوْلًى، لأُسَامَةَ بْنِ زَيْدٍ. أَنَّ الْحَجَّاجَ بْنَ أَيْمَنَ ابْنِ أُمِّ أَيْمَنَ،، وَكَانَ، أَيْمَنُ ابْنُ أُمِّ أَيْمَنَ أَخَا أُسَامَةَ لأُمِّهِ، وَهْوَ رَجُلٌ مِنَ الأَنْصَارِ، فَرَآهُ ابْنُ عُمَرَ لَمْ يُتِمَّ رُكُوعَهُ وَلاَ سُجُودَهُ فَقَالَ أَعِدْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3736، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3736 (Companions of the Prophet), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3736، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3736 (Compañeros del Profeta), menciona al huérfano y al padre desaparecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sahih al-Bukhari, n° 3736 (Compagnons du Prophète), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
