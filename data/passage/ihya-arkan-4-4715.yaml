text: "… دون هذه الزيادة كما ذكره المصنف حديث لا يستكمل عبد حقيقة الإيمان حتى يذر المراء وإن كان محقا أخرجه ابن أبي الدنيا من حديث أبي هريرة بسند ضعيف وهو عند أحمد بلفظ لا يؤمن العبد حتى يترك الكذب في المزاحة …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 4715، يذكر حلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 4715, that mentions the sweetness and completeness of faith, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 4715 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 4715, que menciona la dulzura y la plenitud de la fe, aquello sin lo cual la fe no está completa; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 4, p. 4715), évoquant la douceur et la plénitude de la foi, et soulignant ce sans quoi elle ne saurait être complète. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Gazali'nin İhya Ulum el-Din (Dinî İlimlerin Yeniden Canlandırılması) adlı eserinin 4. cildinin 4715. sayfasından bir alıntı, imanın tatlılığı ve mükemmelliği ile tamamlanması için gerekli olan unsurları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Ghazali, Ihya Ulum al-Din (Kebangkitan Ilmu-ilmu Agama), Jilid 4, halaman 4715, membahas tentang kemanisan dan kesempurnaan iman, serta hal-hal penting untuk penyempurnaannya. Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
