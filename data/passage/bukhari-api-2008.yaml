ref: "2008"
label: { ar: "صحيح البخاري 2008 — مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 2008 — forgiveness of past sins", ur: "صحیح بخاری 2008 — پچھلے گناہوں کی مغفرت" }
text: "حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي أَبُو سَلَمَةَ، أَنَّ أَبَا هُرَيْرَةَ ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ لِرَمَضَانَ \" مَنْ قَامَهُ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2008، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 2008 (Praying at Night in Ramadaan (Taraweeh)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 2008، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
