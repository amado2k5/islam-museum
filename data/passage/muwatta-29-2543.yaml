label: { ar: "الموطأ 2543 — مالك: من حفر بئرا على الطريق أو ربط الدابة فيها ضمان", en: "Muwatta 2543", es: "Muwatta 2543", fr: "Muwatta 2543", ur: "موطا 2543", tr: "Al-Muwatta 2543 — Malik: Yol üzerinde kuyu kazan veya içine hayvan bağlayan kimse sorumludur.", id: "Al-Muwatta 2543 — Malik: Barangsiapa menggali sumur di jalan atau mengikat hewan di dalamnya, ia wajib" }
summary:
  ar: "قال مالك: الأمر عندنا في الذي يحفر البئر على الطريق، أو يربط الدابة، أو يصنع أشباه هذا على طريق المسلمين: أن ما صنع مما لا يجوز له أن يصنعه على طريق المسلمين فهو ضامن لما أُصيب في ذلك من جرح أو غيره؛ فما كان عقله دون ثلث الدية فهو في ماله خاصة، وما بلغ الثلث فصاعدا فهو على العاقلة. وما صنع مما يجوز له أن يصنعه فلا ضمان عليه فيه، كالبئر يحفرها الرجل للمطر، والدابة ينزل عنها الرجل للحاجة فيقفها على الطريق. {cite:muwatta-maruf-1997 p.441}"
  tr: "Malik şöyle dedi: Müslüman yolunda kuyu kazan, hayvan bağlayan veya benzeri şeyler yapan kimse hakkında hükmümüz şudur: Müslüman yolunda caiz olmayan fiillerinden dolayı meydana gelen her türlü yaralanma veya zarardan sorumludur. Tazminat, kan parasının üçte birinden az ise kendi sorumluluğundadır. Üçte bir veya daha fazla ise, aşiretinin sorumluluğundadır. Yağmur suyu için kuyu kazması veya ihtiyaç duyduğu için hayvanından inip yolda durması gibi caiz olan fiillerden sorumlu değildir. {cite:muwatta-maruf-1997 s.441}"
  id: "Malik berkata: Hukum kami mengenai seseorang yang menggali sumur di jalan, atau mengikat hewan, atau melakukan hal serupa di jalan Muslim adalah bahwa ia bertanggung jawab atas setiap cedera atau kerugian lain yang disebabkan oleh perbuatannya yang tidak diperbolehkan di jalan Muslim. Jika ganti rugi kurang dari sepertiga uang darah, itu menjadi tanggung jawabnya sendiri. Jika sepertiga atau lebih, itu menjadi tanggung jawab klannya. Ia tidak bertanggung jawab atas perbuatannya yang diperbolehkan, seperti sumur yang digalinya untuk air hujan, atau hewan yang diturunkannya karena kebutuhan dan berhenti di jalan. {cite:muwatta-maruf-1997 p.441}"
