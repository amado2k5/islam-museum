label: { ar: "الموطأ 2543 — مالك: من حفر بئرا على الطريق أو ربط الدابة فيها ضمان", en: "Muwatta 2543" }
summary:
  ar: "قال مالك: الأمر عندنا في الذي يحفر البئر على الطريق، أو يربط الدابة، أو يصنع أشباه هذا على طريق المسلمين: أن ما صنع مما لا يجوز له أن يصنعه على طريق المسلمين فهو ضامن لما أُصيب في ذلك من جرح أو غيره؛ فما كان عقله دون ثلث الدية فهو في ماله خاصة، وما بلغ الثلث فصاعدا فهو على العاقلة. وما صنع مما يجوز له أن يصنعه فلا ضمان عليه فيه، كالبئر يحفرها الرجل للمطر، والدابة ينزل عنها الرجل للحاجة فيقفها على الطريق. {cite:muwatta-maruf-1997 p.441}"
