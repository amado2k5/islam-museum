text: "… الأُمَمَ وما أشبه ذلك من الأخبار الواردة في ذلك على الوجوب أم على الندب أم على الإباحة. فأما من قال: إنه في حق بعض الناس واجب، وفي حق بعضهم مندوب إليه، وفي حق بعضهم مباح؛ فهو التفات إلى المصلحة، وهذا …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 528، يرد فيه ذكر الواجب، والوجوب، والمندوب، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 528, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 528 کا اقتباس جس میں واجب، وجوب، مندوب، مباح، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 528, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mandub), le permis (mubah), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 528, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mandub), lo permitido (mubah), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Rüşd'ün *Bidayat al-Mujtahid* adlı eserinin 4. cildinin 528. sayfasından, farz, tavsiye edilen, caiz ve müstehap olan amelleri ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Bidayat al-Mujtahid* karya Ibnu Rushd, Jilid 4, halaman 528, yang membahas amalan wajib, anjuran, halal, dan yang diinginkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
