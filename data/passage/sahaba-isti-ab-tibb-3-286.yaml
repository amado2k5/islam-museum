text: "… سَعْدٍ، لم يَرْوِ عنه أحد غير ابنه فيما علمت، حديثه عند ابن شهاب، عن أبي خِزَامة، عن الحارث بن سَعْد، عن أبيه، قال : قلتُ: يا رسول اللّٰه، أرأيت رُقىَّ نَسترقي بها، وأدوية نَتداوى بها، هل تردُّ - أو قال …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 286، يذكر الرقية، والدواء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 286, that mentions ruqya recited over the sick, the drug, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 286 کا اقتباس جس میں رقیہ، دوا، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 3, pág. 286, que menciona la ruqya recitada sobre los enfermos, el medicamento y la búsqueda de tratamiento; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isti'ab d'Ibn 'Abd al-Barr, volume 3, page 286, qui mentionne la ruqya récitée sur les malades, le médicament, la recherche de traitement; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 3. cildinin 286. sayfasında, büyü, ilaç ve tedavi yöntemlerinden bahsedilmektedir; bu alıntı, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 3, hlm. 286, menyebutkan mantra, obat-obatan, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
