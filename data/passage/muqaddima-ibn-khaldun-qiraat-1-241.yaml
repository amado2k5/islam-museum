text: "… عرضتْ في الشغل محمدةٌ فلا يصفها إلَّا إلى صاحبه، وإن عرضت مذمةٌ غليحملها هو من دونه. وليحذر السَّقْطة والزَّلَّة والمللَ عند تغّير الحال. فإنَّ العيب إليكم — معشر الكتَّاب— أسرعُ منه إلى القُرَّاء، وهو لكم أفسدُ منه لهم. فقد علمتم …"
summary:
