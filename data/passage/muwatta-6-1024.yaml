label: { ar: "الموطأ 1024 — مالك: أحسن ما سمع في الذي يقتل الصيد فيحكم عليه فيه، أن يقوم الصيد الذي أصاب، فينظر كم ثمنه من الطعام، فيطعم كل مسكين مداً، أو يصوم مكان كل مد يوماً، فإن كانوا عشرة صام عشرة أيام، وإن كانوا أكثر من ستين مسكيناً", en: "Muwatta 1024", es: "Muwatta 1024", fr: "Muwatta 1024", ur: "موطا 1024", tr: "El-Muvatta 1024 — Malik: Avlanan ve buna göre yargılanan kimse hakkında duyduğum en güzel şey şudur: Öldürdüğü avın değeri belirlenmeli ve yiyecek değeri hesaplanmalıdır. Sonra her fakire bir mudd (belirli bir ölçü yiyecek) yedirmeli veya her mudd yerine bir gün oruç tutmalıdır. On fakir varsa on gün oruç tutmalı, altmıştan fazla fakir varsa onları doyurmalıdır.", id: "Al-Muwatta 1024 — Malik: Hal terbaik yang pernah kudengar mengenai seseorang yang membunuh hewan buruan dan diadili sesuai dengan perbuatannya adalah bahwa hewan buruan yang dibunuhnya harus dinilai, dan nilai gizinya harus ditentukan. Kemudian ia harus memberi makan setiap orang miskin satu mudd (ukuran makanan tertentu), atau berpuasa satu hari sebagai pengganti setiap mudd. Jika ada sepuluh orang miskin, ia harus berpuasa sepuluh hari, dan jika ada lebih dari enam puluh orang, ia harus memberi makan mereka." }
summary:
  ar: "قول يرويه يحيى عن مالك: أحسن ما سمع في الذي يقتل الصيد فيُحكم عليه فيه أن يقوم الصيد الذي أصاب، فينظر كم ثمنه من الطعام، فيُطعم كل مسكين مداً، أو يصوم مكان كل مد يوماً، وينظر كم عدد المساكين، فإن كانوا عشرة صام عشرة أيام، وإن كانوا عشرين صام عشرين يوماً عدَدهم ما كانوا، وإن كانوا أكثر من ستين مسكيناً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1158). {cite:muwatta-maruf-1997 p.478}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Av hayvanı öldüren ve bunun için cezalandırılması gereken kimse hakkında duyduğum en iyi hüküm şudur: Öldürdüğü av hayvanının değeri hesaplanmalı, yiyecek olarak değeri belirlenmeli ve her fakire bir mudd (belirli bir ölçü) yiyecek verilmeli veya her mudd yerine bir gün oruç tutulmalıdır. Ayrıca fakirlerin sayısına da bakılmalıdır: On fakir varsa on gün oruç tutmalı; yirmi fakir varsa, sayılarına bakılmaksızın yirmi gün oruç tutmalı; altmıştan fazla fakir varsa... Araştırmacı, bu hadisin Ebu Musab (1158) tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.478}"
  id: "Sebuah hadis yang diriwayatkan oleh Yahya dari Malik: Hukum terbaik yang pernah kudengar mengenai orang yang membunuh hewan buruan dan divonis akan dihukum karenanya adalah bahwa hewan buruan yang dibunuhnya harus dinilai, nilainya dalam makanan dihitung, dan setiap orang miskin harus diberi makan satu mudd (ukuran makanan tertentu), atau ia harus berpuasa satu hari sebagai pengganti setiap mudd. Ia juga harus mempertimbangkan jumlah orang miskin: jika ada sepuluh orang, ia harus berpuasa selama sepuluh hari; jika ada dua puluh orang, ia harus berpuasa selama dua puluh hari, tanpa memandang jumlah mereka; dan jika ada lebih dari enam puluh orang miskin... Peneliti menyebutkan bahwa Abu Mus'ab (1158) meriwayatkan hadis ini dari Malik. {cite:muwatta-maruf-1997 p.478}"
