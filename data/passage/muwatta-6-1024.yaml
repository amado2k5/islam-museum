label: { ar: "الموطأ 1024 — مالك: أحسن ما سمع في الذي يقتل الصيد فيحكم عليه فيه، أن يقوم الصيد الذي أصاب، فينظر كم ثمنه من الطعام، فيطعم كل مسكين مداً، أو يصوم مكان كل مد يوماً، فإن كانوا عشرة صام عشرة أيام، وإن كانوا أكثر من ستين مسكيناً", en: "Muwatta 1024" }
summary:
  ar: "قول يرويه يحيى عن مالك: أحسن ما سمع في الذي يقتل الصيد فيُحكم عليه فيه أن يقوم الصيد الذي أصاب، فينظر كم ثمنه من الطعام، فيُطعم كل مسكين مداً، أو يصوم مكان كل مد يوماً، وينظر كم عدد المساكين، فإن كانوا عشرة صام عشرة أيام، وإن كانوا عشرين صام عشرين يوماً عدَدهم ما كانوا، وإن كانوا أكثر من ستين مسكيناً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1158). {cite:muwatta-maruf-1997 p.478}"
