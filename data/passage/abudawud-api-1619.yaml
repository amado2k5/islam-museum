label: { ar: "سنن أبي داود 1619 — الأب والأبوة", en: "Sunan Abi Dawud 1619 — the father and fatherhood", ur: "سنن ابی داؤد 1619 — باپ اور والدیت", es: "Sunan Abi Dawud 1619 — El padre y la paternidad", fr: "Sunan Abi Dawud 1619 — Le père et la paternité", tr: "Sunan Abi Davud 1619 — Baba ve Babalık", id: "Sunan Abi Dawud 1619 — Sang Ayah dan Peran Ayah" }
text: "… النُّعْمَانِ بْنِ رَاشِدٍ، عَنِ الزُّهْرِيِّ، - قَالَ مُسَدَّدٌ عَنْ ثَعْلَبَةَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي صُعَيْرٍ، - عَنْ أَبِيهِ، - وَقَالَ سُلَيْمَانُ بْنُ دَاوُدَ عَبْدُ اللَّهِ بْنُ ثَعْلَبَةَ أَوْ ثَعْلَبَةُ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي صُعَيْرٍ عَنْ أَبِيهِ، - قَالَ قَالَ رَسُولُ اللَّهِ \" صَاعٌ مِنْ بُرٍّ أَوْ قَمْحٍ عَلَى كُلِّ اثْنَيْنِ صَغِيرٍ أَوْ كَبِيرٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1619، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1619 (Zakat (Kitab Al-Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1619، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1619 (Zakat (Kitab Al-Zakat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1619 (Zakat), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1619 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1619, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
