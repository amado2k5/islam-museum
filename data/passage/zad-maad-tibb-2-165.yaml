text: "… بالجنونِ والبَرَصِ، والجُدامِ والقَرَن، والجَبِّ والعُنَّهِ خاصة، وزاد الإمام أحمد عليهما: أن تكونَ المرأة فتقاءَ منخرِقة ما بينَ السبيلين، ولأصحابه في نتَنِ الفرج والفم، وانخراقِ مخرجي البول والمني في الفرج، والقروح السيالة فيه، والبواسير، والنَّاصور، والاستحاضة، واستطلاقُ البول، والنجو، والخصي …"
