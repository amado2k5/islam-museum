label: { ar: "صحيح البخاري 7078 — الحرام", en: "Sahih al-Bukhari 7078 — the unlawful", ur: "صحیح بخاری 7078 — حرام", es: "Sahih al-Bukhari 7078 — el ilícito", fr: "Sahih al-Bukhari 7078 — l'illicite", tr: "Sahih el-Buhari 7078 — Haram", id: "Sahih al-Bukhari 7078 — Haram" }
text: "… بَلَدٍ، هَذَا أَلَيْسَتْ بِالْبَلْدَةِ \". قُلْنَا بَلَى يَا رَسُولَ اللَّهِ. قَالَ \" فَإِنَّ دِمَاءَكُمْ، وَأَمْوَالَكُمْ، وَأَعْرَاضَكُمْ، وَأَبْشَارَكُمْ عَلَيْكُمْ حَرَامٌ، كَحُرْمَةِ يَوْمِكُمْ هَذَا، فِي شَهْرِكُمْ هَذَا، فِي بَلَدِكُمْ هَذَا، أَلاَ هَلْ بَلَّغْتُ \". قُلْنَا نَعَمْ. قَالَ \" اللَّهُمَّ اشْهَدْ، فَلْيُبَلِّغِ الشَّاهِدُ الْغَائِبَ، فَإِنَّهُ رُبَّ مُبَلِّغٍ يُبَلِّغُهُ مَنْ هُوَ أَوْعَى لَهُ فَكَانَ كَذَلِكَ ـ قَالَ ـ لاَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7078، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 7078 (Afflictions and the End of the World), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 7078، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7078 (Aflicciones y el fin del mundo), menciona lo ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 7078 (Les Afflictions et la Fin du Monde), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 7078 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısı, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinler sunmaktadır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7078, menyebutkan apa yang dilarang. Peramban Halal dan Haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
