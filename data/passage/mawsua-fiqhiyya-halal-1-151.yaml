text: "… حُرِّمَتْ عَلَيْكُمُ الميْتَةُ. أما ما أبين من السمك والجراد فيحل أكله، وذلك لأن ميتة السمك والجراد يحل أكلها. فقد قال عية : أحلت لنا ميتتان ودمان أما الميتتان: فالجراد والحوت، وأما الدمان فالطحال والكبد. المغنى لابن قدامة،. البدائع -، وحاشية …"
