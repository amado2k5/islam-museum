summary:
  ar: "القسم 16 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرهون»، ويضم فيها النصوص من 2436 إلى 2491 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 16 of Sunan Ibn Majah (The Chapters on Pawning) in the division of the open hadith dataset the museum took its reports from: reports 2436 to 2491 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 16، عنوان «کتاب الرہون»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2436 تا 2491۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 16 de Sunan Ibn Majah (Los capítulos sobre el empeño) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2436 al 2491 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 16 du Sunan Ibn Majah (chapitres relatifs au prêt sur gages), à partir des hadiths publics: les hadiths 2436 à 2491 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanı bölümünde yer alan Sunan İbn Majah'ın 16. bölümü \"Yemin Kitabı\" başlığını taşımakta olup, 2436 ile 2491 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 16 dari Sunan Ibn Majah, dalam bagian tentang basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sumpah\" dan berisi teks 2436 hingga 2491, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
