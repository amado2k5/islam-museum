label: { ar: "الموطأ 1592 — نافع عن ابن عمر: إذا ملك الرجل امرأته أمرها، فالقضاء ما قضت به، إلا أن ينكر عليها فيقول لم أرد إلا واحدة فيحلف", en: "Muwatta 1592", es: "Muwatta 1592", fr: "Muwatta 1592", ur: "موطا 1592", tr: "El-Muvatta 1592 — Nafi'nin İbn Ömer'den rivayet ettiğine göre: Bir adam karısına kendi işlerinde yetki verirse, karısının verdiği karar geçerlidir; ancak adam bunu reddedip, \"Ben sadece birini istedim\" derse, yemin eder.", id: "Al-Muwatta 1592 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Jika seorang pria memberikan wewenang kepada istrinya atas urusannya, maka apa pun yang diputuskan istrinya adalah sah, kecuali jika dia mengingkarinya dan berkata, “Aku hanya menginginkan satu,” maka dia bersumpah." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يقول إذا ملك الرجل امرأته أمرها، فالقضاء ما قضت به، إلا أن ينكر عليها فيقول لم أرد إلا واحدة، فيحلف على ذلك، ويكون أملك بها، ما كانت في عدتها. {cite:muwatta-maruf-1997 p.62}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın şöyle dediğini aktarır: Bir erkek karısına kendisi üzerinde yetki verirse, karısının kararı bağlayıcıdır; ancak erkek bunu reddedip, \"Ben sadece birini istedim\" derse, buna yemin etmiş olur ve kadın bekleme döneminde olduğu sürece onun üzerinde yetki sahibi olur. {cite:muwatta-maruf-1997 s.62}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: Jika seorang pria memberikan kekuasaan kepada istrinya atas dirinya, maka apa pun yang diputuskan istrinya adalah mengikat, kecuali jika dia mengingkarinya dan berkata, “Aku hanya menginginkan satu,” maka dia bersumpah atas hal itu, dan dia memiliki kekuasaan atas istrinya selama istrinya dalam masa iddah. {cite:muwatta-maruf-1997 p.62}"
