label: { ar: "الموطأ 2607 — ابن شهاب: لا يجتمع دينان في جزيرة العرب، فأجلى عمر يهود خيبر", en: "Muwatta 2607", es: "Muwatta 2607", fr: "Muwatta 2607", ur: "موطا 2607", tr: "El-Muvatta 2607 — İbn Şihab: Arap Yarımadası'nda iki din bir arada var olamaz, bu yüzden Ömer Hayber Yahudilerini kovdu.", id: "Al-Muwatta 2607 — Ibn Shihab: Dua agama tidak dapat hidup berdampingan di Semenanjung Arab, maka Umar mengusir orang-orang Yahudi Khaybar." }
summary:
  ar: "حدثني مالك عن ابن شهاب أن رسول الله قال: لا يجتمع دينان في جزيرة العرب. قال مالك: قال ابن شهاب: ففحص عن ذلك عمر بن الخطاب حتى أتاه الثلج واليقين أن رسول الله قال ذلك، فأجلى يهود خيبر. {cite:muwatta-maruf-1997 p.471}"
  tr: "Malik, İbn Şihab'dan rivayetle bana, Allah Resulü'nün şöyle buyurduğunu aktardı: \"Arap Yarımadası'nda iki din bir arada bulunamaz.\" Malik dedi ki: İbn Şihab dedi ki: Ömer ibn el-Hattab bu konuyu araştırdı ve Allah Resulü'nün gerçekten böyle buyurduğuna dair teyit aldı. Bunun üzerine Hayber Yahudilerini sürgün etti. {cite:muwatta-maruf-1997 s.471}"
  id: "Malik meriwayatkan kepadaku dari Ibnu Shihab bahwa Rasulullah SAW bersabda: \"Dua agama tidak akan hidup berdampingan di Semenanjung Arab.\" Malik berkata: Ibnu Shihab berkata: Umar bin al-Khattab menyelidiki masalah ini hingga ia mendapat kepastian bahwa Rasulullah SAW memang telah mengatakannya, lalu ia mengusir orang-orang Yahudi Khaybar. {cite:muwatta-maruf-1997 p.471}"
