text: "… حَبَس عن مكة الفيل وسَلّط عليها رسوله والمؤمنين، ألا وإنها لم تُحَلَّ لأحد كان قبلي ولا تَحِلُّ لأحد كان بعدي الا وإنها أُحِلّت لي ساعة من النهار، ألا وإنها ساعتي هذه حرام، لا يُختلى شوكها ولا يُعضد شجرها، ولا يَلتقط …"
