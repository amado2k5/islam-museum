label: { ar: "موطأ مالك 1576 — الأب والأبوة", en: "Muwatta Malik 1576 — the father and fatherhood", ur: "موطأ مالک 1576 — باپ اور والدیت", es: "Muwatta Malik 1576 — el padre y la paternidad", fr: "Muwatta Malik 1576 — le père et la paternité", tr: "Muwatta Malik 1576 — Baba ve Babalık", id: "Muwatta Malik 1576 — Sang Ayah dan Peran Ayah" }
text: "وَحَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يُسَوِّي بَيْنَ الأَسْنَانِ فِي الْعَقْلِ وَلاَ يُفَضِّلُ بَعْضَهَا عَلَى بَعْضٍ. قَالَ مَالِكٌ وَالأَمْرُ عِنْدَنَا أَنَّ مُقَدَّمَ الْفَمِ وَالأَضْرَاسِ وَالأَنْيَابِ عَقْلُهَا سَوَاءٌ وَذَلِكَ أَنَّ رَسُولَ اللَّهِ قَالَ \" فِي السِّنِّ خَمْسٌ مِنَ الإِبِلِ \". وَالضِّرْسُ سِنٌّ مِنَ الأَسْنَانِ لاَ يَفْضُلُ بَعْضُهَا عَلَى بَعْضٍ."
summary:
  ar: "حديث في موطأ مالك، رقم 1576، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1576 (Blood-Money), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1576، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1576 (Dinero de sangre), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Muwatta Malik, n° 1576 (Le Prix du Sang), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Malik'in Muwatta'sında yer alan 1576 numaralı hadis, baba ve babalık kavramından bahsetmektedir. Araştırmacı, bu hadisi İslam'da babalık bölümünde, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1576, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits ini dalam bagian tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
