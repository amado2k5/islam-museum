text: "… النَّبِيُّ \" مَنْ شَاءَ فَلْيُصَلِّ فِي رَحْلِهِ \". قَالَ وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَسَمُرَةَ وَأَبِي الْمَلِيحِ عَنْ أَبِيهِ وَعَبْدِ الرَّحْمَنِ بْنِ سَمُرَةَ. قَالَ أَبُو عِيسَى حَدِيثُ جَابِرٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ رَخَّصَ أَهْلُ الْعِلْمِ فِي الْقُعُودِ عَنِ الْجَمَاعَةِ وَالْجُمُعَةِ فِي الْمَطَرِ وَالطِّينِ وَبِهِ يَقُولُ أَحْمَدُ وَإِسْحَاقُ. قَالَ أَبُو عِيسَى سَمِعْتُ أَبَا زُرْعَةَ يَقُولُ رَوَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 409، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 409 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 409، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
