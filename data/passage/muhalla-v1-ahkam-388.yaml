text: "… وأَيضًا فما في العَالَمِ مُسلمٌ يَستجيزُ أنْ يَقولَ: إنَّ اللهَ تَعالَىٰ أوجَبَ عَلَىٰ رَسولِهِ وَلَلِفِ طاعَةً رأي أصحابِهِ، وهذا القَولُ كُفرٌ مُجرَّدٌ ممَّنْ قالَ بهِ. وإنَّما قَولُ أهلِ الإسلامِ أنَّ طاعَةً رَسول اللهِ لف فَرَضٌ واجِبٌ عَلَى الصَّحابَةِ، وعَلَىٰ جَميعِ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 388، يرد فيه ذكر الفرض، وطاعة الله ورسوله، والواجب، وما يجب على المكلف، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 388, whose wording mentions the obligatory (fard), obedience to God and His Messenger, the obligatory (wajib), what is binding on the person addressed, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 388 کا اقتباس جس میں فرض، اللہ اور اس کے رسول کی اطاعت، واجب، جو مکلف پر واجب ہے، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 388, dont le texte mentionne l'obligatoire (fard), l'obéissance à Dieu et à Son Messager, l'obligatoire (wajib), ce qui s'impose à la personne responsable, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 388, cuyo texto menciona lo obligatorio (fard), la obediencia a Dios y a Su Mensajero, lo obligatorio (wajib), lo que obliga a la persona responsable, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
