text: "… الألف وتشديد الدال ابن طابخة بن إلياس بن مضر، وفيهم بطون كثيرة جدًا. قوله: وبني أسد أي ابن خزيمة بن مدركة بن إلياس بن مضر، وكانوا عددًا كثيرًا، وقد ظهر مصداق ذلك عقب وفاة رسول اللّٰه وَل في فارتد هؤلاء …"
