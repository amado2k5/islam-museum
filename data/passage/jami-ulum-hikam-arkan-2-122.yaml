text: "جامع العلوم والحكم وقد سبق في الحديث الذي قبله ذكرُ الإسلام. والمرادُ من هذا الحديث أنَّ الإسلام مبنيٌّ على هذه الخمس، فهي كالأركان والدعائم لبنيانه، وقد خرَّجه محمدُ بنُ نصر المروزي في كتاب الصلاة، ولفظه : بُني الإسلام على خمسِ …"
