label: { ar: "صحيح البخاري 7010 — الرقية", en: "Sahih al-Bukhari 7010 — ruqya recited over the sick", ur: "صحیح بخاری 7010 — رقیہ", es: "Sahih al-Bukhari 7010 – ruqya recitada sobre los enfermos", fr: "Sahih al-Bukhari 7010 – ruqya récitée sur les malades", tr: "Sahih el-Buhari 7010 — Ruqyah", id: "Sahih al-Bukhari 7010 — Ruqyah" }
text: "… سُبْحَانَ اللَّهِ مَا كَانَ يَنْبَغِي لَهُمْ أَنْ يَقُولُوا مَا لَيْسَ لَهُمْ بِهِ عِلْمٌ، إِنَّمَا رَأَيْتُ كَأَنَّمَا عَمُودٌ وُضِعَ فِي رَوْضَةٍ خَضْرَاءَ، فَنُصِبَ فِيهَا وَفِي رَأْسِهَا عُرْوَةٌ وَفِي أَسْفَلِهَا مِنْصَفٌ ـ وَالْمِنْصَفُ الْوَصِيفُ ـ فَقِيلَ ارْقَهْ. فَرَقِيتُ حَتَّى أَخَذْتُ بِالْعُرْوَةِ. فَقَصَصْتُهَا عَلَى رَسُولِ اللَّهِ فَقَالَ رَسُولُ اللَّهِ \" يَمُوتُ عَبْدُ اللَّهِ وَهْوَ آخِذٌ بِالْعُرْوَةِ الْوُثْقَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7010، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7010 (Interpretation of Dreams), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7010، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7010 (Interpretación de los sueños), menciona la ruqya recitada sobre los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 7010 (Interprétation des rêves), mentionne la récitation de la roqya sur les malades. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 7010 numaralı hadis, rukyeden (Kur'an ayetleri ve dualarla yapılan İslami şifa) bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7010, menyebutkan ruqyah (penyembuhan Islami melalui ayat-ayat Al-Quran dan doa). Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
