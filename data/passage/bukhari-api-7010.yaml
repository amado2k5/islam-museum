label: { ar: "صحيح البخاري 7010 — الرقية", en: "Sahih al-Bukhari 7010 — ruqya recited over the sick", ur: "صحیح بخاری 7010 — رقیہ" }
text: "… سُبْحَانَ اللَّهِ مَا كَانَ يَنْبَغِي لَهُمْ أَنْ يَقُولُوا مَا لَيْسَ لَهُمْ بِهِ عِلْمٌ، إِنَّمَا رَأَيْتُ كَأَنَّمَا عَمُودٌ وُضِعَ فِي رَوْضَةٍ خَضْرَاءَ، فَنُصِبَ فِيهَا وَفِي رَأْسِهَا عُرْوَةٌ وَفِي أَسْفَلِهَا مِنْصَفٌ ـ وَالْمِنْصَفُ الْوَصِيفُ ـ فَقِيلَ ارْقَهْ. فَرَقِيتُ حَتَّى أَخَذْتُ بِالْعُرْوَةِ. فَقَصَصْتُهَا عَلَى رَسُولِ اللَّهِ فَقَالَ رَسُولُ اللَّهِ \" يَمُوتُ عَبْدُ اللَّهِ وَهْوَ آخِذٌ بِالْعُرْوَةِ الْوُثْقَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7010، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7010 (Interpretation of Dreams), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7010، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
