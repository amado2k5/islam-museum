label: { ar: "الموطأ 1561 — عروة بن الزبير: دخلت خولة بنت حكيم على عمر فقالت إن ربيعة بن أمية استمتع بامرأة مولدة فحملت، فخرج عمر فزعا يجر رداءه، وقال هذه المتعة", en: "Muwatta 1561" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير أن خولة بنت حكيم دخلت على عمر بن الخطاب فقالت إن ربيعة بن أمية استمتع بامرأة مولدة فحملت منه، فخرج عمر بن الخطاب فزعا يجر رداءه، فقال هذه المتعة، ولو كنت تقدمت فيها لرجمت. {cite:muwatta-maruf-1997 p.50}"
