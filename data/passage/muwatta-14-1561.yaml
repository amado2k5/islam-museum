label: { ar: "الموطأ 1561 — عروة بن الزبير: دخلت خولة بنت حكيم على عمر فقالت إن ربيعة بن أمية استمتع بامرأة مولدة فحملت، فخرج عمر فزعا يجر رداءه، وقال هذه المتعة", en: "Muwatta 1561", es: "Muwatta 1561", fr: "Muwatta 1561", ur: "موطا 1561", tr: "El-Muvatta 1561 — Urve ibn el-Zübeyr: Hakim bint Havla Ömer'in yanına girdi ve Rabi'ah ibn Umeyye'nin çocuk doğurabilecek yaşta bir kadınla geçici bir nikah kıydığını ve kadının hamile kaldığını söyledi. Ömer panik içinde cübbesini sürükleyerek dışarı çıktı ve \"Bu geçici bir nikahtır\" dedi.", id: "Al-Muwatta 1561 — Urwah ibn al-Zubayr: Khawlah bint Hakim menemui Umar dan berkata bahwa Rabi’ah ibn Umayyah telah melakukan pernikahan sementara dengan seorang wanita yang subur dan ia hamil. Umar keluar dengan panik, menyeret jubahnya, dan berkata, “Ini adalah pernikahan sementara.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير أن خولة بنت حكيم دخلت على عمر بن الخطاب فقالت إن ربيعة بن أمية استمتع بامرأة مولدة فحملت منه، فخرج عمر بن الخطاب فزعا يجر رداءه، فقال هذه المتعة، ولو كنت تقدمت فيها لرجمت. {cite:muwatta-maruf-1997 p.50}"
  tr: "Malik, İbn Şihab'dan, Urve ibn el-Zübeyr'den rivayetle, Havla bint Hakim'in Ömer ibn el-Hattab'ın yanına girip, \"Rabi'ah ibn Umayyah melez bir kadınla geçici bir evlilik yapmış ve ondan hamile kalmış\" dediğini aktarır. Ömer ibn el-Hattab panik içinde, cübbesini sürükleyerek dışarı çıkmış ve \"Bu geçici bir evlilik! Bunu önceden bilseydim, onu taşlayarak öldürürdüm\" demiştir. {cite:muwatta-maruf-1997 s.50}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Urwah ibn al-Zubayr, bahwa Khawlah bint Hakim menemui Umar ibn al-Khattab dan berkata, “Rabi’ah ibn Umayyah telah melakukan pernikahan sementara dengan seorang wanita berdarah campuran, dan dia hamil karenanya.” Umar ibn al-Khattab keluar dengan panik, menyeret jubahnya, dan berkata, “Ini adalah pernikahan sementara! Seandainya aku tahu sebelumnya, aku akan melemparinya dengan batu.” {cite:muwatta-maruf-1997 p.50}"
