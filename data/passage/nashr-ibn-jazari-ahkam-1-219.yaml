text: "… كثرة القراءة اكثر عدداً. فالاول كمن تصدق بجوهرة عظيمة او اعتق عبداً قيمته نفيسة جداً، والثاني كمن تصدق بعدد كثير من الدراهم او اعتق عدداً من العبيد قيمتهم رخيصة. وقال الامام ابو حامد الغزالي : واعلم ان الترتيل مستحب لا …"
