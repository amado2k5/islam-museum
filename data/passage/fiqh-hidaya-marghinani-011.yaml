text: "لظلم والرشوة. (٥) من هنا إلى قوله: قال: ولا يقبل هدية: مثبت في نسخة ٧٣٨ه، وبين الناسخ أن هذه الزيادة مثبتة في نسخ، دون أخرى. (٦) أي بين بالتفصيل في كتابه أدب القاضي ٢٥٣/١ ، مع شرحه للصدر الشهيد."
