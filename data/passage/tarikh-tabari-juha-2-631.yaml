text: "… اللولوُ والمرجان والياقوت صديّةً للملك وجعل الامناء يسلون من راوا من اهل القرية عن خبر الملك وشأنه اذ لم يشتره منهم شيًا وقالوا ما شأن الملك لا يشترى منّا شيًا إن كان غنيًا فإن عندنا، من طرائف البصاعات فنُعطيه ما …"
