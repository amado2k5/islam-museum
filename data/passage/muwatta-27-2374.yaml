label: { ar: "الموطأ 2374 — نافع عن ابن عمر: اليهود وحكم الرجم في التوراة", en: "Muwatta 2374" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن اليهود جاءوا النبي يذكرون أن رجلا منهم وامرأة زنيا. فسألهم عما يجدونه في التوراة في شأن الرجم، فقالوا: يُفضحان ويُجلدان. فقال عبد الله بن سلام: كذبتم، إن فيها الرجم. فلما نشروا التوراة ووضع أحدهم يده على موضع الرجم فرفعها، ظهر فيها حكم الرجم، فأمر النبي بهما فرُجما. قال ابن عمر: فرأيت الرجل يجنأ على المرأة يقيها الحجارة. قال مالك: معنى يحني أي يكب عليها. {cite:muwatta-maruf-1997 p.379} {cite:muwatta-maruf-1997 p.380}"
