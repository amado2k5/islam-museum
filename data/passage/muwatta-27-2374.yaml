summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن اليهود جاءوا النبي يذكرون أن رجلا منهم وامرأة زنيا. فسألهم عما يجدونه في التوراة في شأن الرجم، فقالوا: يُفضحان ويُجلدان. فقال عبد الله بن سلام: كذبتم، إن فيها الرجم. فلما نشروا التوراة ووضع أحدهم يده على موضع الرجم فرفعها، ظهر فيها حكم الرجم، فأمر النبي بهما فرُجما. قال ابن عمر: فرأيت الرجل يجنأ على المرأة يقيها الحجارة. قال مالك: معنى يحني أي يكب عليها. {cite:muwatta-maruf-1997 p.379} {cite:muwatta-maruf-1997 p.380}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa orang-orang Yahudi datang kepada Nabi (shalawat dan salam kepadanya) menceritakan bahwa seorang laki-laki dan seorang perempuan dari kalangan mereka telah berzina. Beliau bertanya kepada mereka apa yang mereka temukan dalam Taurat tentang rajam, dan mereka menjawab: “Mereka harus dipermalukan di depan umum dan dicambuk.” Abdullah ibn Salam berkata: “Kalian berbohong; Taurat memang memuat hukum rajam.” Ketika mereka membuka Taurat dan salah seorang dari mereka meletakkan tangannya di tempat yang berisi hukum rajam lalu mengangkatnya, hukum rajam pun muncul. Maka Nabi memerintahkan agar mereka dirajam. Ibn Umar berkata: “Aku melihat laki-laki itu membungkuk di atas perempuan itu untuk melindunginya dari batu.” Malik berkata: “Arti ‘membungkuk’ adalah membungkuk di atasnya.”"
