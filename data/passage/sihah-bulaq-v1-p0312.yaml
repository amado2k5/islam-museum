text: |-
  ⁦(فصل السين)⁩
  ٢٢٩
  والجمع الستائر وأما السستار الذى فى شعرامرئ القيس
  علا قطنا بالشيم أين صوبه * وأيسره على الستارفيذبل
  فهماجبلان والستربالفتح مصدرسترت الشئ أستره اذا غ طيته فاستترهووأ- ترأى تغطى
  وجارية مسترة أى مخدرة وقوله تعالى حجابامستورا أى حجاباعلى حجاب والاوّل مستور
  بالثانى براد بذلك كفافة الحجاب لانه جعسل على قلبهم أكنة وفى آذانه-م وقرا ويقال هو
  مفعول جاء فى لفظ الفاعل كة وله تعالى انه كان وعده مأتياأآ تياورجل مستور.
  وستيرأى عفيف والجارية ستيرة قال السكميت ولقد أزور بها الستيرة فى المرعشة الستّائر
  والاستار يكسر الهمزة فى العدد أربعة قال جرير
  قرن الفرزدق والبعيث وأمّه * وأبو الفرزدق قبح الاستار
  وقال الاخطل اعمرك اننى وابى جعيل * وأمهمالاستاراميم
  وقال السكميت أبلغ يزيد واسمعيل مألكة * ومنذراوأبامشر إستار
  والاستار ا يضاوزن أربعة مثاقيل ونصف واجمع الاساتير سجر سجرت التنور
  أسجره سجرا اذاحيته وسهجوت النهرملاته رسجرت الثماراداملئت من المطسر وذلك الماء
  ميجرة والجمع سيرومنه البحر المسحور والسجور ما يسجر به التنور وسعير الرحل صفيه وخليله
  وابمع السجراء والمسهب وراللين الذى ماؤه أكثرمنه والساجر الموضع الذى ياتى
  عليه السيل فيملأه ومنه قول الشماخ
  وأَحى عليها ابنايز يدين مسهر * بيطن المراض كل حسى وساجو
  والساجور خشبة تجعل فى عنق الكاب بقال كاب مسوجر والساجور أيضا اسم موضع
  وسجرت الناقة تسهجرهرا وسجورا اذامدت حنينها قال الشاعر
  حنت الى برق فقلت لهاقرى • بعض الحنين فان سجرك شائق
  واللؤاؤ المسجور المنظوم المسترسل وأنشدأبو عبيد
  كاللؤاؤ المسجور أعقل فى * سلك النظام خفحانه النظم
  وعين سجراء بينة السجر اذاخالط بياضها حرة والاسجر الغدير الحرّالطين قال الشاعر متم بن
  نويرة بغريض سارية أدرّته الصبا * من ماء اسجر طيب المستنقع
  الاصعى شعر منسجر وهو المسترسل وقال اذا ما انثى شعرها المنسجر
  وانسمجرت
  الابل فى السير تتابعت وسنجار. وضع ( جهر المسجهز الابيض قال لبيد
  وناجية أعملتها وابنذلتها • اذا ما اسجهز الال فى كل سبسب
  ⁦(سصر )⁩ السحر الرئة وابجمع أسحار مشل بردو أبراد وكذلك السعر والسحر وابهع سحور
  مثل فلس وذلوس وقد يحرّك فيقال سحرمثل نهرونح ولمكان حروف الحلق ويقال للجبان
  قد انتفخ سحره ومنه قولهم للارنب المقطعة الاسحار والمقطعة السحور والمقطعة النياط
  وهو على التفاؤل أى سحره يقطع على هذا الاسم وفى المتأخر ين من بقول المقطعة بكسز
  الطاءأى من سرعتها وشدّة عدوها كانها تقطع "حرها ونيباطها والسحر قبيل الصبح تقول
  قسه"حر ياهذا اذا أردت به مجراملتك لم تصرفه لانه معدول عن الالف واللام وهو
  ٨٢
  صاح
