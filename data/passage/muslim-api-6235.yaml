label: { ar: "صحيح مسلم 6235 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih Muslim 6235 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح مسلم 6235 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih Muslim 6235 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos." }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ بْنِ قَعْنَبٍ، حَدَّثَنَا سُلَيْمَانُ، - يَعْنِي ابْنَ بِلاَلٍ - عَنْ يَحْيَى، - وَهُوَ ابْنُ سَعِيدٍ - عَنْ سَعِيدٍ، عَنْ سَعْدِ بْنِ أَبِي وَقَّاصٍ، قَالَ لَقَدْ جَمَعَ لِي رَسُولُ اللَّهِ أَبَوَيْهِ يَوْمَ أُحُدٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6235، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6235 (The Book of the Merits of the Companions), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6235، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 6235 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad, así como el cumplimiento o la desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
