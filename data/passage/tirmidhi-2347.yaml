label:
  ar: "الترمذي 2347 — إن أغبط أوليائي عندي لمؤمن خفيف الحاذ"
  en: "Tirmidhi 2347 — The most enviable of My friends is a believer of light means"
  ur: "ترمذی 2347 — میرے دوستوں میں سب سے قابلِ رشک ہلکے بوجھ والا مومن ہے"
text: "إن أغبط أوليائي عندي لمؤمن خفيف الحاذ ذو حظ من الصلاة أحسن عبادة ربه وأطاعه في السر وكان غامضا في الناس لا يشار إليه بالأصابع وكان رزقه كفافا فصبر على ذلك . ثم نفض بيده فقال عجلت منيته قلت بواكيه …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2347: إن أغبط أوليائي عندي لمؤمن خفيف الحاذ. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2347: The most enviable of My friends is a believer of light means. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2347: میرے دوستوں میں سب سے قابلِ رشک ہلکے بوجھ والا مومن ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
