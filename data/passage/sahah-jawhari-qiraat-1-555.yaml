text: "… الرِّجْلَ رَبُّها بسُلَّم غَرْزٍ في مُنَاخٍ تُعَاجِلُهْ وَقَفْنا فقلنا إيهِ سِلْمٌ فَسَلَّمَتْ فما كان إلَّ وَمْؤُها بالحَواجُبِ وقرأ أبو عمرو: اذخُلوا في السلْم كافَّةً يذهب بمعناها إلى الإسلام. والسَّلْمُ: الصلحُ، يفتح ويكسر، ويذكِّر ويؤنث. والسَّلْمُ : المُسالِمُ، تقول: أنا سِلّمْ …"
