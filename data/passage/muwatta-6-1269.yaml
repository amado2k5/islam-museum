label: { ar: "الموطأ 1269 — طلحة بن عبيد الله بن كريز: ما رؤي الشيطان يوما أصغر ولا أدحر منه في يوم عرفة", en: "Muwatta 1269", es: "Muwatta 1269", fr: "Muwatta 1269", ur: "موطا 1269", tr: "El-Muvatta 1269 — Talha bin Ubaidullah bin Kurayz: Şeytan, Arafat Günü'nde olduğundan daha küçük ve daha yenilmiş hiç görülmemiştir.", id: "Al-Muwatta 1269 — Talha bin Ubaidullah bin Kurayz: Setan tidak pernah terlihat lebih kecil atau lebih dikalahkan daripada pada Hari Arafah." }
text: "ما رُؤيَ الشَّيطانُ يَوْماً، هوَ فيهِ أصْغَرُ ولا أدْحَرُ ولا أحْقَرُ ولا أغْيَظُ، منهُ في يَوْمِ عَرَفَةَ"
summary:
  ar: "يروي مالك عن إبراهيم بن أبي عبلة عن طلحة بن عبيد الله بن كريز أن رسول الله قال ما رؤي الشيطان يوما هو فيه أصغر ولا أدحر ولا أحقر ولا أغيظ منه في يوم عرفة، وما ذاك إلا لما رأى من تنزل الرحمة وتجاوز الله عن الذنوب العظام، إلا ما أري يوم بدر، فقيل وما رأى يوم بدر؟ قال أما إنه رأى جبريل يزع الملائكة. ويذكر المحقق أنه مرسل. {cite:muwatta-maruf-1997 p.564}"
  tr: "Malik, İbrahim ibn Abi Ablah'tan, o da Talha ibn Ubeyd Allah ibn Kurayz'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: “Şeytan, Arafat Günü'nden daha fazla aşağılanmış, yenilmiş, hor görülmüş ve öfkelenmiş olarak hiçbir gün görülmemiştir. Bunun tek sebebi, rahmetin indiğini ve Allah'ın büyük günahları bağışladığını görmesidir; Bedir Günü'nde gördükleri hariç.” “Bedir Günü'nde ne gördü?” diye soruldu. “Cebrail'in melekleri yönettiğini gördü.” dedi. Araştırmacı, bunun mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.564}"
  id: "Malik meriwayatkan dari Ibrahim ibn Abi Ablah, dari Talhah ibn Ubayd Allah ibn Kurayz, bahwa Rasulullah SAW bersabda: “Setan tidak pernah terlihat lebih terhina, dikalahkan, dicemooh, atau dimurkai pada hari apa pun selain pada hari Arafah. Ini hanya karena apa yang dilihatnya tentang turunnya rahmat dan pengampunan Allah atas dosa-dosa besar, kecuali apa yang dilihatnya pada hari Badar.” Ditanyakan, “Dan apa yang dilihatnya pada hari Badar?” Beliau menjawab, “Dia melihat Jibril memimpin para malaikat.” Peneliti menyebutkan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang). {cite:muwatta-maruf-1997 p.564}"
