label: { ar: "الموطأ 1269 — طلحة بن عبيد الله بن كريز: ما رؤي الشيطان يوما أصغر ولا أدحر منه في يوم عرفة", en: "Muwatta 1269" }
text: "ما رُؤيَ الشَّيطانُ يَوْماً، هوَ فيهِ أصْغَرُ ولا أدْحَرُ ولا أحْقَرُ ولا أغْيَظُ، منهُ في يَوْمِ عَرَفَةَ"
summary:
  ar: "يروي مالك عن إبراهيم بن أبي عبلة عن طلحة بن عبيد الله بن كريز أن رسول الله قال ما رؤي الشيطان يوما هو فيه أصغر ولا أدحر ولا أحقر ولا أغيظ منه في يوم عرفة، وما ذاك إلا لما رأى من تنزل الرحمة وتجاوز الله عن الذنوب العظام، إلا ما أري يوم بدر، فقيل وما رأى يوم بدر؟ قال أما إنه رأى جبريل يزع الملائكة. ويذكر المحقق أنه مرسل. {cite:muwatta-maruf-1997 p.564}"
