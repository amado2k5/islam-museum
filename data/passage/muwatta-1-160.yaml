label: { ar: "الموطأ 160 — سعيد بن المسيب: المستحاضة تغتسل من طهر إلى طهر وتتوضأ لكل صلاة", en: "Muwatta 160", es: "160 copias", fr: "160 exemplaires", ur: "160 کاپیاں", tr: "El-Muvatta 160 — Sa’id ibn al-Musayyab: Uzun süreli kanaması olan bir kadın, her namazdan önce temizlik dönemleri arasında gusül (ritüel banyo) ve abdest almalıdır." }
summary:
  ar: "أثر يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن، في باب المستحاضة: أرسله القعقاع بن حكيم وزيد بن أسلم إلى سعيد بن المسيب يسأله كيف تغتسل المستحاضة، فقال: تغتسل من طهر إلى طهر، وتتوضأ لكل صلاة، فإن غلبها الدم استثفرت بثوب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن ابن أبي شيبة أخرج بعضه من طريق يحيى بن سعيد عن القعقاع سائلاً سعيداً. {cite:muwatta-maruf-1997 p.108}"
  tr: "Malik'in, Ebu Bekir ibn Abdülrahman'ın azatlı kölesi Sümey'den rivayet ettiği, uzun süren adet kanaması yaşayan kadınlar bölümündeki bir rivayete göre: El-Ka'ka' ibn Hakim ve Zeyd ibn Aslam, uzun süren adet kanaması yaşayan bir kadının gusül abdestini nasıl alması gerektiğini sormak için onu Said ibn el-Musayyab'a gönderdiler. O da şöyle cevap verdi: \"Her namaz için temizlik ve abdest dönemleri arasında gusül abdesti almalıdır. Kanama çok şiddetli olursa, emmesi için bir bez kullanmalıdır.\" Araştırmacı, bunun Malik'ten Ebu Musab, Süveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini ve İbn Abi Şeybe'nin bunun bir kısmını Yahya ibn Said aracılığıyla, El-Ka'ka'dan rivayet ederek, Said'e sorduğunu belirtiyor. {cite:muwatta-maruf-1997 s.108}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Sumayy, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, dalam bab tentang wanita yang mengalami pendarahan menstruasi berkepanjangan: Al-Qa'qa' ibn Hakim dan Zayd ibn Aslam mengutusnya kepada Sa'id ibn al-Musayyab untuk menanyakan bagaimana seorang wanita yang mengalami pendarahan menstruasi berkepanjangan harus melakukan ghusl (penyusuan ritual). Beliau menjawab: \"Ia harus melakukan ghusl di antara masa suci dan wudu' (bersuci) untuk setiap shalat. Jika pendarahannya semakin banyak, ia harus menggunakan kain untuk menyerapnya.\" Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan, dan bahwa Ibn Abi Shaybah memasukkan sebagian darinya melalui Yahya ibn Sa'id dari al-Qa'qa', yang bertanya kepada Sa'id. {cite:muwatta-maruf-1997 p.108}"
