label: { ar: "الموطأ 160 — سعيد بن المسيب: المستحاضة تغتسل من طهر إلى طهر وتتوضأ لكل صلاة", en: "Muwatta 160" }
summary:
  ar: "أثر يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن، في باب المستحاضة: أرسله القعقاع بن حكيم وزيد بن أسلم إلى سعيد بن المسيب يسأله كيف تغتسل المستحاضة، فقال: تغتسل من طهر إلى طهر، وتتوضأ لكل صلاة، فإن غلبها الدم استثفرت بثوب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن ابن أبي شيبة أخرج بعضه من طريق يحيى بن سعيد عن القعقاع سائلاً سعيداً. {cite:muwatta-maruf-1997 p.108}"
