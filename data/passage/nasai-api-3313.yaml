label: { ar: "سنن النسائي 3313 — ما حُرّم", en: "Sunan al-Nasa'i 3313 — what was made unlawful", ur: "سنن نسائی 3313 — جو حرام کیا گیا" }
text: "… وَأَنَّهَا سَمِعَتْ رَجُلاً يَسْتَأْذِنُ فِي بَيْتِ حَفْصَةَ قَالَتْ عَائِشَةُ فَقُلْتُ يَا رَسُولَ اللَّهِ هَذَا رَجُلٌ يَسْتَأْذِنُ فِي بَيْتِكَ. فَقَالَ رَسُولُ اللَّهِ \" أُرَاهُ فُلاَنًا \". لِعَمِّ حَفْصَةَ مِنَ الرَّضَاعَةِ. قَالَتْ عَائِشَةُ فَقُلْتُ لَوْ كَانَ فُلاَنٌ حَيًّا - لِعَمِّهَا مِنَ الرَّضَاعَةِ - دَخَلَ عَلَىَّ. فَقَالَ رَسُولُ اللَّهِ \" إِنَّ الرَّضَاعَةَ تُحَرِّمُ مَا يُحَرَّمُ مِنَ الْوِلاَدَةِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3313، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3313 (The Book of Marriage), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3313، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
