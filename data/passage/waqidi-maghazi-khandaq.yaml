label: { ar: "غزوة الخندق — تعاقب النبي بين نسائه", en: "Battle of the Trench — the Prophet's rotation among his wives", es: "La batalla de la trinchera: la rotación del profeta entre sus esposas.", fr: "Bataille du Fossé — la rotation du Prophète entre ses épouses" }
text: "كان النبي يعقب بين نسائه، فتكون عائشة أياما، ثم تكون أم سلمة، ثم تكون زينب بنت جحش، فكان هؤلاء الثلاث اللاتي يعقب بينهن في الخندق"
summary:
  ar: "خلال حصار الأحزاب في الخندق، يذكر الواقدي أن النبي كان يعقب بين نسائه فتكون عائشة أياما ثم أم سلمة ثم زينب بنت جحش، وكان هؤلاء الثلاث يعقب بينهن في الخندق وسائر نسائه في أطم بني حارثة. وتروي أم سلمة في هذا الباب مواقفها ليلة غارة المشركين على القبة، وخروج سعد بن معاذ مصابا والأسرى في أطم فارع."
  en: "During the siege of the Confederates at the Trench, Waqidi records that the Prophet rotated among his wives — Aisha some days, then Umm Salama, then Zaynab bint Jahsh — these three dwelling in the trench while the rest stayed in the fortresses of Banu Haritha. Umm Salama narrates her vigil at the Prophet's tent during the night raid."
  es: "Durante el asedio de los confederados en la trinchera, Waqidi relata que el Profeta se turnaba con sus esposas: Aisha algunos días, luego Umm Salama, y después Zaynab bint Jahsh. Estas tres permanecían en la trinchera, mientras que las demás se quedaban en las fortalezas de Banu Haritha. Umm Salama narra su vigilia junto a la tienda del Profeta durante el ataque nocturno."
  fr: "Durant le siège des Confédérés au Fossé, Waqidi rapporte que le Prophète alternait entre ses épouses: Aïcha certains jours, puis Oum Salama, puis Zaynab bint Jahsh. Ces trois dernières demeuraient dans le fossé tandis que les autres restaient dans les forteresses des Banu Haritha. Oum Salama relate sa veillée auprès du Prophète durant le raid nocturne."
