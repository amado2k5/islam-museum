label: { ar: "غزوة الخندق — تعاقب النبي بين نسائه", en: "Battle of the Trench — the Prophet's rotation among his wives" }
text: "كان النبي يعقب بين نسائه، فتكون عائشة أياما، ثم تكون أم سلمة، ثم تكون زينب بنت جحش، فكان هؤلاء الثلاث اللاتي يعقب بينهن في الخندق"
summary:
  ar: "خلال حصار الأحزاب في الخندق، يذكر الواقدي أن النبي كان يعقب بين نسائه فتكون عائشة أياما ثم أم سلمة ثم زينب بنت جحش، وكان هؤلاء الثلاث يعقب بينهن في الخندق وسائر نسائه في أطم بني حارثة. وتروي أم سلمة في هذا الباب مواقفها ليلة غارة المشركين على القبة، وخروج سعد بن معاذ مصابا والأسرى في أطم فارع."
  en: "During the siege of the Confederates at the Trench, Waqidi records that the Prophet rotated among his wives — Aisha some days, then Umm Salama, then Zaynab bint Jahsh — these three dwelling in the trench while the rest stayed in the fortresses of Banu Haritha. Umm Salama narrates her vigil at the Prophet's tent during the night raid."
