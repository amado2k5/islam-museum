text: "… الله! إِنَّ بأرضنا أعناباً نعتصرها، فنشرب منها؟ قال : لا، فقد رجوت أن أقتل شهيداً، وأما طلب ابني إياي فلا أراه إلاَّ سيغدو في طلب الشهادة، ولا أراه يلحق قلتُ: إنَّا نستشفي منها للمريض، قال : ليس بالشِّفاء، ولكنَّه دَاءٌ. …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 366، يذكر المرض والمريض، والداء، والتداوي، والشفاء، والتداوي بالمحرم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 366, that mentions illness and the sick, the disease and its remedy, seeking treatment, healing, treatment with what is forbidden; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 366 کا اقتباس جس میں بیماری اور بیمار، بیماری، علاج کرانا، شفا، حرام سے علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 2, pág. 366, que menciona la enfermedad y los enfermos, la enfermedad y su remedio, la búsqueda de tratamiento, la curación, el tratamiento con lo que está prohibido; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isti'ab d'Ibn 'Abd al-Barr, volume 2, page 366, qui mentionne la maladie et les malades, la maladie et son remède, la recherche de traitement, la guérison, le traitement avec ce qui est interdit; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdül-Barr'ın \"İsti'ab\" adlı eserinin resimli 2. cildinin 366. sayfasından bir alıntı; hastalık, hasta, rahatsızlık, tedavi, iyileşme ve haram olan şeylerle tedavi konularını ele almaktadır; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 2, hlm. 366, yang menyebutkan penyakit, orang sakit, penyakit, pengobatan, penyembuhan, dan pengobatan dengan apa yang dilarang; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
