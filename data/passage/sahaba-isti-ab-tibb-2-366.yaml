text: "… الله! إِنَّ بأرضنا أعناباً نعتصرها، فنشرب منها؟ قال : لا، فقد رجوت أن أقتل شهيداً، وأما طلب ابني إياي فلا أراه إلاَّ سيغدو في طلب الشهادة، ولا أراه يلحق قلتُ: إنَّا نستشفي منها للمريض، قال : ليس بالشِّفاء، ولكنَّه دَاءٌ. …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 366، يذكر المرض والمريض، والداء، والتداوي، والشفاء، والتداوي بالمحرم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 366, that mentions illness and the sick, the disease and its remedy, seeking treatment, healing, treatment with what is forbidden; from the machine-read scan, quoted within forty words per the sources policy."
