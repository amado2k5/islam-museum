text: "… الجزم بذلك نظر. عمرو، فغيّره النَّبي فيهِ والله أعلم. قال البُخاريّ: وعبد اللّٰه هو الذي بعثته قريش مع عمرو - عبد اللّٰه بن أبي رَهُم بن فراس اليماني: بن العاص إلى الحبشة وهو أخو أبي جهل لأمه. انتهى. مخضرم. ويقال: …"
