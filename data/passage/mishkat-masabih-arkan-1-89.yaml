text: "… قال: أتيتُ رسول اللّٰه - وعن عمرو بن عبسة يا رسول الله! من معك على هذا الأمر؟ قال: حُرٌّ وعبدٌ. قلت: ما الإسلامِ؟ قال: طيبُ الكلام، وإطعامُ الطعام. قلتُ: ما الإيمانُ؟ قال: الصَّبرُ والسَّماحة. قال: قلتُ: أيُّ الإسلام أفضلُ؟..... - …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 89، يذكر تعريف الإسلام بأعماله، والسؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 89, that mentions Islam defined by its acts, the question about faith and its answer, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 89 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 1, pág. 89, que menciona el Islam definido por sus actos, la cuestión de la fe y su respuesta, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 1, page 89, qui évoque l'islam défini par ses actes, la question de la foi et sa réponse, ainsi que la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Resimli Mişkat el-Masabih'in 1. cildinin 89. sayfasından bir alıntı, İslam'ın uygulamaları üzerinden tanımını, imanla ilgili soru ve cevabı, imanın tatlılığını ve mükemmelliğini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 89, membahas definisi Islam melalui praktik-praktiknya, pertanyaan dan jawaban mengenai iman, serta keindahan dan kesempurnaan iman. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
