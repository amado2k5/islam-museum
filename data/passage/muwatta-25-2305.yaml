label: { ar: "الموطأ 2305 — مالك: قطاعة النصف مع العجز ومثال الربع والثلاثة أرباع", en: "Muwatta 2305", es: "Muwatta 2305", fr: "Muwatta 2305", ur: "موطا 2305", tr: "Al-Muwatta 2305 — Malik: Açığı yarıya indirmek ve çeyrek ile üç çeyrek örneği", id: "Al-Muwatta 2305 — Malik: Membagi dua dengan defisit dan contoh seperempat dan tiga perempat" }
summary:
  ar: "قال مالك في مكاتب بين رجلين يقاطع أحدهما على نصف حقه بإذن شريكه، ثم يقبض الذي تمسك بالرق أقل مما قاطع عليه صاحبه ثم يعجز المكاتب: إن أحب المقاطِع أن يرد على شريكه نصف ما تفضل به كان العبد بينهما شطرين، وإن أبى فللذي تمسك بالرق حصة صاحبه. ويضرب مالك مثالا بعبد مشترك يكاتبانه ثم يقاطع أحدهما على نصف حقه فيكون ذلك ربع العبد، فإن عجز ولم يرد المقاطِع فللشريك ثلاثة أرباع العبد وللمقاطِع ربعه. {cite:muwatta-maruf-1997 p.350} {cite:muwatta-maruf-1997 p.351}"
  tr: "Malik, iki erkek arasında yapılan bir köle azat sözleşmesiyle ilgili olarak şöyle demiştir: Sözleşmeyi kabul edenlerden biri, ortağının izniyle kendi payının yarısını ödemeyi kabul eder, ancak köleyi elinde tutan kişi ortağının kabul ettiğinden daha azını alır ve köle de yükümlülüğünü yerine getiremezse: Eğer sözleşmeyi kabul eden kişi ortağına verdiği payın yarısını iade etmek isterse, köle aralarında eşit olarak paylaşılır. Eğer reddederse, köleyi elinde tutan kişi ortağının payını alır. Malik, ortak mülkiyete sahip bir köle azat sözleşmesi örneğini verir; burada taraflardan biri kendi payının yarısını, yani kölenin dörtte birini ödemeyi kabul eder. Eğer ödeme yapamazsa ve sözleşmeyi kabul eden kişi köleyi iade etmezse, ortak kölenin dörtte üçünü, sözleşmeyi kabul eden kişi ise dörtte birini alır. {cite:muwatta-maruf-1997 s.350} {cite:muwatta-maruf-1997 s.351}"
  id: "Malik mengatakan mengenai seorang budak yang terikat kontrak pembebasan antara dua orang, di mana salah satu dari mereka setuju untuk membayar setengah bagiannya dengan izin dari pasangannya, dan kemudian orang yang mempertahankan budak tersebut menerima kurang dari yang disepakati pasangannya, dan kemudian budak yang terikat kontrak tersebut tidak dapat memenuhi kewajibannya: Jika orang yang menyetujui kontrak tersebut ingin mengembalikan setengah dari apa yang diberikannya kepada pasangannya, maka budak tersebut dibagi rata di antara mereka. Jika ia menolak, maka orang yang mempertahankan budak tersebut menerima bagian pasangannya. Malik memberikan contoh seorang budak yang dimiliki bersama berdasarkan kontrak pembebasan, di mana salah satu dari mereka setuju untuk membayar setengah bagiannya, yaitu seperempat dari budak tersebut. Jika ia tidak mampu membayar dan orang yang menyetujui kontrak tersebut tidak mengembalikan budak tersebut, maka pasangannya menerima tiga perempat dari budak tersebut dan orang yang menyetujui kontrak tersebut menerima seperempatnya. {cite:muwatta-maruf-1997 p.350} {cite:muwatta-maruf-1997 p.351}"
