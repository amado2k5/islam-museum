label: { ar: "الموطأ 2305 — مالك: قطاعة النصف مع العجز ومثال الربع والثلاثة أرباع", en: "Muwatta 2305" }
summary:
  ar: "قال مالك في مكاتب بين رجلين يقاطع أحدهما على نصف حقه بإذن شريكه، ثم يقبض الذي تمسك بالرق أقل مما قاطع عليه صاحبه ثم يعجز المكاتب: إن أحب المقاطِع أن يرد على شريكه نصف ما تفضل به كان العبد بينهما شطرين، وإن أبى فللذي تمسك بالرق حصة صاحبه. ويضرب مالك مثالا بعبد مشترك يكاتبانه ثم يقاطع أحدهما على نصف حقه فيكون ذلك ربع العبد، فإن عجز ولم يرد المقاطِع فللشريك ثلاثة أرباع العبد وللمقاطِع ربعه. {cite:muwatta-maruf-1997 p.350} {cite:muwatta-maruf-1997 p.351}"
