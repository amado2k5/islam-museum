text: "… لَ في جعفراً وزيدَ بنَ حارثة وابنَ رواحة، نعاهم قبل أن يجيء خبرهم،، وعيناه تذرُفان. أخرجه البخاري، وزاد فيه : فَنَعَاهم، وقال : أخذ الراية زيد فأُصيب، ثم أخذها جعفر فأُصيب، ثم أخذها ابن رَوَاحة فأُصيب. ثم أخذ الراية بعدَهم …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 3، ص 485، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, scan volume 3, p. 485, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "تاریخ الاسلام و وفیات المشاہیر والاعلام، اسکین جلد 3، ص 485 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, volume numérisé 3, p. 485, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Tarikh al-Islam wa-Wafayat al-Mashahir wa-l-A'lam, volumen escaneado 3, p. 485, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"İslam Tarihi ve Ünlü Şahsiyetlerin Ölümleri\" adlı resimli cilt 3'ün 485. sayfasından bir alıntı; bir ölüm ilanı ve ölüm duyurusu içermektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve ölüm ilanlarından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 3, halaman 485, berisi obituari dan pengumuman kematian; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan elegi dan obituari paling terkenal."
