text: "… لَ في جعفراً وزيدَ بنَ حارثة وابنَ رواحة، نعاهم قبل أن يجيء خبرهم،، وعيناه تذرُفان. أخرجه البخاري، وزاد فيه : فَنَعَاهم، وقال : أخذ الراية زيد فأُصيب، ثم أخذها جعفر فأُصيب، ثم أخذها ابن رَوَاحة فأُصيب. ثم أخذ الراية بعدَهم …"
