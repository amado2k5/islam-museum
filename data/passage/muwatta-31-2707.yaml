label: { ar: "الموطأ 2707 — محمد بن أبي أمامة بن سهل: سهل بن حنيف يصاب بالعين فيُتوضأ له", en: "Muwatta 2707" }
summary:
  ar: "يروي مالك عن محمد بن أبي أمامة بن سهل بن حنيف أنه سمع أباه يقول: اغتسل أبي سهل بن حنيف بالخرار، فنزع جبة كانت عليه، وعامر بن ربيعة ينظر، وكان سهل رجلا أبيض حسن الجلد، فقال له عامر: ما رأيت كاليوم ولا جلد عذراء. فوعك سهل مكانه واشتد وعكه، فأُتي رسول الله فأُخبر أن سهلا وعك وأنه غير رائح معك، فأخبره سهل بما كان من شأن عامر، فقال رسول الله: علام يقتل أحدكم أخاه؟ ألا بركت؟ إن العين حق. توضأ له. فتوضأ له عامر، فراح سهل مع رسول الله ليس به بأس. {cite:muwatta-maruf-1997 p.526} {cite:muwatta-maruf-1997 p.527}"
