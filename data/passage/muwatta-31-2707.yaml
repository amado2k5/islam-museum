label: { ar: "الموطأ 2707 — محمد بن أبي أمامة بن سهل: سهل بن حنيف يصاب بالعين فيُتوضأ له", en: "Muwatta 2707", es: "Muwatta 2707", fr: "Muwatta 2707", ur: "موطا 2707", tr: "El-Muvatta 2707 — Muhammed ibn Abi Umame ibn Sahl: Sahl ibn Hanif'e nazar değmişti, bu yüzden ona abdest alındı.", id: "Al-Muwatta 2707 — Muhammad ibn Abi Umamah ibn Sahl: Sahl ibn Hanif terkena musibah mata jahat, maka wudhu dilakukan untuknya." }
summary:
  ar: "يروي مالك عن محمد بن أبي أمامة بن سهل بن حنيف أنه سمع أباه يقول: اغتسل أبي سهل بن حنيف بالخرار، فنزع جبة كانت عليه، وعامر بن ربيعة ينظر، وكان سهل رجلا أبيض حسن الجلد، فقال له عامر: ما رأيت كاليوم ولا جلد عذراء. فوعك سهل مكانه واشتد وعكه، فأُتي رسول الله فأُخبر أن سهلا وعك وأنه غير رائح معك، فأخبره سهل بما كان من شأن عامر، فقال رسول الله: علام يقتل أحدكم أخاه؟ ألا بركت؟ إن العين حق. توضأ له. فتوضأ له عامر، فراح سهل مع رسول الله ليس به بأس. {cite:muwatta-maruf-1997 p.526} {cite:muwatta-maruf-1997 p.527}"
  tr: "Malik, Muhammed ibn Abi Umame ibn Sahl ibn Huneyf'ten rivayetle, babasının şöyle dediğini işittiğini aktarır: \"Babam Sahl ibn Huneyf, Harrar'da yıkandı ve Amir ibn Rabi'ah'ın gözü önünde üzerindeki örtüyü çıkardı. Sahl, güzel tenli, açık tenli bir adamdı ve Amir ona, 'Böyle bir şey hiç görmedim, bakire teninde bile.' dedi. Sahl hemen hastalandı ve hastalığı kötüleşti. Allah'ın Resulü'ne Sahl'ın hasta olduğu ve onunla yolculuk edemeyeceği bildirildi. Sahl, Amir'le olanları anlattı ve Allah'ın Resulü, 'Neden biriniz kardeşini öldürür? Neden dua etmedin? Nazar gerçektir. Onun için abdest al.' dedi. Bunun üzerine Amir onun için abdest aldı ve Sahl, kendini tamamen iyi hissederek Allah'ın Resulü ile birlikte yola çıktı.\" {cite:muwatta-maruf-1997 s.526} {cite:muwatta-maruf-1997 s.527}"
  id: "Malik meriwayatkan dari Muhammad ibn Abi Umamah ibn Sahl ibn Hunayf bahwa ia mendengar ayahnya berkata: Ayahku, Sahl ibn Hunayf, mandi di al-Kharrar, dan ia melepas jubah yang dikenakannya, sementara 'Amir ibn Rabi'ah memperhatikan. Sahl adalah seorang pria berkulit putih dengan wajah yang indah, dan 'Amir berkata kepadanya, \"Aku belum pernah melihat yang seperti ini, bahkan kulit seorang perawan pun tidak.\" Sahl segera jatuh sakit, dan penyakitnya semakin parah. Rasulullah diberitahu bahwa Sahl sakit dan tidak akan bepergian bersamanya. Sahl menceritakan apa yang terjadi pada 'Amir, dan Rasulullah berkata, \"Mengapa salah seorang dari kalian membunuh saudaranya? Mengapa kalian tidak mengucapkan shalawat? Mata jahat itu nyata. Wudhukan shalawat untuknya.\" Maka 'Amir berwudhu untuknya, dan Sahl pergi bersama Rasulullah dengan perasaan sehat sepenuhnya. {kutip:muwatta-maruf-1997 hal.526} {kutip:muwatta-maruf-1997 hal.527}"
