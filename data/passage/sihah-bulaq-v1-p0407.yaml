text: |-
  ٢٢٤
  ⁦(باب الدال)⁩
  زيدوال-دة داء يأخذ بالانف يممع نسيم الرح وكذلك السدادمن-ل الصداع والعطاس
  والسدة باب الدارتقول رأيّه قاعدابددة بابد وفى الحديث الشعث الرؤس الذين لا تفتح لهم
  السدد قال أبو الدرداء من يغش --دد الساطان بقم ويقعد وسمى ا-ععيل السدى لانه كان
  ببع المقائع والارف سدّة مسجد الكوفة وهى ماببق من الطاق المسدود وال-دبائفتج واحد
  الاسدة وهى العيوب مثل العمى والصمم واليكم جع على غير قياس وكان قياسه سد وداومنه
  قوله-م لا تجعلن بجنبك الاسدة أى لا يضيقن صدرك فتسكت عن الجواب كن به سمم وبكم
  قال المكمت
  ت ومايجنى من صفح وعائدة • عند الاسدان العى كالعض
  يقول ليس بوعىً ولا بكم عن جواب الكاشح ولكنى أصفح عنه لان العىّ عن الجواب
  كالعضب وهوقطع يد أوذهاب عضو والعائدة العطف والسد أيضاشى يتخذمن قضبان
  له أطباق والمسدبستان ابن معمر وذلك البسنان مأسدة قال أبوذؤيب
  ألفت أغلب من أسد المتحديد • الناب أخذته عفر فتطريح
  قال الاصححى سألت ابن أبى طرفة عن المسد فقال هو بستان ابي معمر الذى يقول له الناس
  بستان ابن عامر⁦(سرد )⁩ السردانلحرز فى الاديم والتسريد مثله والمسردما يخرزبه وكذلك
  السرادوانخرز.سرود ومسرتدوكذلت الدرع مسرودة ومسردة وقد قيل سردها نسحبها
  وهو تداخل الحاق بعضها فى بعض ويقال السرد الثقب والمسرودة الدرع المثقوبة والسرد
  -م جامع للدروع وسارالحلق وفلان بسرد الحد ين سردا اداكان جد السافه
  ومردت الصوم أى تابعته وقيل لاع رابى أنعرف الاشهر الحرم فقال نعم ثلاتة سردوواحد
  فرد فالسردذ والقعدة وذوالجة والمحزم والفردرجب والسرندى الشديد والانى سرنداة
  والمسرندى الذى يعاوك ويغلبك قال الراجز
  واسرداء أى اعتلاة والاسعا والاتردا واحدوالياه اأما ن بانال ( سرحد
  السرمد الدائم (مرهد مرحت العيرهدة أى أحسن غاء وربما
  قبسل لشهم السنام مرهدوسنام مسرهد أى حمين سعد) السعدالمن تقول سعديومنا
  بالفتح يسعدسه ودا والسعودة خلاف النحوسة واستسعد الرجل برؤية فلان أى عدّه سعد
  والسعادة خلاف الشقارة تقول مفه سعد الرجل بالكسر⁦(ف)⁩ه وسعيد مثل سلم فهوسليم وسعد
  بالضم ((هومسعود وقرأ الكسائى وأما الذين سعد وا وأسعده اللّٰه فهو. سعود ولا يقال
  مسعد كانخسم استغنواعنه بمعود والاسعاد الاعانة والماعدة المعاونة وقواه-م لبيك
  وسعديك أى اسعاد الك بعداسعاد وسعود النجوم عشرة أربعة منها فى برج الجدى والدلو
  ينزلها القمر وهى سعد الذابح وسعد بلع وسعد الاخبية وسعد السعود وهو كوكب منف ود نبر
  وأما الستة التى ايست من المنازل فسعد ناشرة وسعد الملك وسعد البهام وسعد الهمام وسعد
  البارع و-عد معاروكل سعدمن هذه الستة كوكبان بين كل كوكبين فى رأى العين قدر
  ذراع وهى.ناسقة وأماسعد الاخبية فثلاثة أنجم كأنما أثافى ورابع تحت واحد منهن
  وفى العرب سهود قبائل شتى منهامعد تميم وسعدهذيل وسعدقيس وسعد بكر قال الشاعر
  رأيت سعودا من شعوب كثيرة • فلم أرسعدامثل سعد بن مالك
