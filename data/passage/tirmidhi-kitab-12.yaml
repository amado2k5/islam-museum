summary:
  ar: "القسم 12 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرضاع»، ويضم فيها النصوص من 1146 إلى 1174 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 12 of Jami' al-Tirmidhi (The Book on Suckling) in the division of the open hadith dataset the museum took its reports from: reports 1146 to 1174 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 12، عنوان «کتاب الرضاع»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1146 تا 1174۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 12 de Jami' al-Tirmidhi (El libro sobre la lactancia) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1146 al 1174 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 12 de Jami' al-Tirmidhi (Le Livre de l'allaitement), qui comprend les hadiths 1146 à 1174 selon la numérotation de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
