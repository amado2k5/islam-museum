text: "… وقال عمر بن محمد المكلبى كان يعنى المترجم شيخ العدلية يعنى المعتزلة وعالمهم وفقيههم ومتكلمهم ومحدثهم وكان اماما بلا مدافعة فى القراآت والحديث ومعرفة الرجال والانساب والفرائض والحساب والشروط والمقدورات وكان إماما ايضا فى فقه ابى حنيفة واصحابه وفى معرفة …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 39، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 1, p. 39, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 39 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 1, pág. 39, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh Dimashq d'Ibn 'Asakir, volume 1, page 39, mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 1, s. 39'dan Kur'an okunuşlarını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid Bergambar 1, hlm. 39, yang menyebutkan bacaan Al-Quran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
