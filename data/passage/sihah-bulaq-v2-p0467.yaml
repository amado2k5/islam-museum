text: |-
  ١٢٠
  . . ⁦(فصل الميم)⁩.
  •⁦(مئق)⁩.
  انه يمحق كل شئ ويجرقه قال الاصمعىّ بقال جاءنا فى ماحق الصيف أى فى شدة حرّه قال
  ساعدة بصف الحمر
  ظلت صوافن بالارزان صادية * فى ماحق من نهار الصيف محتدم
  ومحقه اللّه أى ذهب ببركته وأمحقه لغة فيه رديثة وقال أبو عمر والامحاق أن يهلاْ الشئ
  كحاق الهلال وانشد:.
  أبوك الذى يكوى أنوف عنوقه • بأظفاره حتى أنسّ رأعحقا
  ذق المذيق اللبن الممزوح بالماء وقد مذقت اللبن فهو عمذوق ومذيق ومنه قولهم
  فلان يذق الوداذالم يخلصه فهو مذاق ومماذق غير مخلص ⁦(مرق )⁩ الموق معروف
  والمرقة أخص منه والمرق أيضا آفة تصيب الزرع ومرقت الق-درمى فاوأمرقتها أيضا اذا
  أكبرت هرقها ومرق السهم من الرمية مر وقاأى خرج من الجانب الآثر ومنه سميت
  اظوارج مارقة لقوله علبه السلام يمرقون من الدين كمايمرق السهم من الرمية وقولهم فى المثل
  رويد الغزو ينمرق وأصله أت امر أة كانت تغزو فحبات فذكرلها الغزوفة الت رويد الغزو ينمرق
  أى أمهل الغزوحتى يخرج الولد وجع المارق مرّاق قال حيد الارقط
  مافتقت مرّاق أهل المصرين • سقط عمان ولصوص الجفين
  والمرق بالتسكين الاهاب المنتن والموق أيضامصدر مرقت الاهاب أى نتفت عن الجلد
  المعطون صوفه والمرق أيضاغنا" الاماء والسفلة وهواسم والممرّق المغنى وقد مرق تمريقا
  والمسراقة بالضم ما اتنتفته من الصوف وربعاقيل لماتنتفه من الكلا القليل لبعبيرك
  مراقة وأمرق الجلد أى مان له أن ينتف زق مزقت الثوب أمزقه عن قاخوقته
  ومنه قول العجاج • كانمايمزقن باللجم المور • ومزقت الشئ تمزية افتمزق والممزق لقب
  شاعر من عبد القيس بكسر الزاى وكان الفرّاء ينتحها واغالة ب بذلك لقوه
  فان كنت مأكولا فكن خيرآكل • والافأدركنى ولما أمزق.
  والممزق أيضا مصدر كالتمزيق ومنه قوله تعالى ومزقناهم كل ممزق والمزق القطع من الثوب
  المعزوف والقطعة منها مزقة ومزق الطاويمزق ويزف أى رمى بذرقه رناقة مزاق يكسر الميم
  ونزاق أيضاعن يمقوب أى سر يعة جدا ومزيقيا لقب عروبن عامر ملا من منول المين
  زعموا أنه كان يلبس كل يوم حلتين فيمزقهما بالعشىّ ويكره أن يعود فيهما ويأنف أن يلبسهما
  أحدغيره شسق المشق المرعة فى الطعن والضرب والاكل والكتابة وقد مشق
  يمشق قال ذوالرتة
  فكريمشق طعنا فى جواشنها • كأنه الاجر فى الاقبال يحتسب
  والمشسق المشع والمشاقة ماسقط عن المشق من الشعر والسكان ونحوهما والمشق جذب
  الشى ليمتدويطول والدير يمشق حى يلين ومشق الثوب مزقه وامتشقت الشئ من يده أى
  اختاسته وامتشقته اقتطعته قال أبوزيد مشق الرجل بالكسراذا أصابت احدى ربلتيه
  الاخرى والرجل أمشق والمرأة مشسقاء بينا المشق والمششق بالكسر المغرة وثوب ممشق أى
  مصبوع به والمشيق من النياب اللبيس، وفرس مشيق وممشوف أى ضامر وجادية منوقة
