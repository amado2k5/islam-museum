text: "… سعيد الحدرى قال سممت رسول الله يقول من رأى منكم منكرا فليغيره بيده فان لم يستطع فبلانه فان لم يستطع فبقليه وذلك أضعف الايمان دواه مسلم والترمذى وابن ماجه والنسائي ولفظه ان رسول اللّٰه قال من رأى منكم منكرا فغيره …"
