text: "حَدَّثَنِي يَحْيَى بْنُ مُوسَى، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنِ النَّبِيِّ قَالَ \" الْمَدِينَةُ يَأْتِيهَا الدَّجَّالُ، فَيَجِدُ الْمَلاَئِكَةَ يَحْرُسُونَهَا، فَلاَ يَقْرَبُهَا الدَّجَّالُ ـ قَالَ ـ وَلاَ الطَّاعُونُ، إِنْ شَاءَ اللَّهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7134، يذكر الطاعون والوباء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7134 (Afflictions and the End of the World), that mentions plague and epidemic. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7134، جس میں طاعون اور وبا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
