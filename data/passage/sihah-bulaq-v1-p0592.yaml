text: |-
  ⁦(فصل الخاء )⁩
  خنب)
  ٤٩
  وانخطب الرجل الذى يخطب المرأة ويقال أيضاهى خطبه وخطبته للتى يخطبها وخطب ا
  بالضم خطابة بالفتح صار خطيبا وكان يقال لامّ خارجة خطب فتول نسكم وخطب فتقول
  كم ١ وهى كلسة كانت العرب تتزوح بها واختطب القوم فسلانا اذادعوه الى تزويج
  صاحبتهم والاخطب الشقراق ويقال الصرد وينشد
  ولا أنثنى من طيرة عن مريرة *إذا الاخطب الداعى على الدوح صرصرا
  والاخطب الحمارتعلو.خضرة قال القرّاء اخطباء الانان التى لها خط أسودء-لى متنها
  والذكر أخطب وناقة خطباء بينة انخطب قال الرقيات ⁦(لعله عببد الله بن قيس الرقيات)⁩
  وصاحى ذات هباب دمشق * خطبا ورقاالسراة عوهق
  أبو زيد أخطبك الصيد أى أمكنك ودنامنت وأخطب الحنظل اذاصار خطبانا وهو أن يصفرّ
  وتصير فيه خطوط خضر والخطابية من الرافضة ينسبون الى أبى الخطاب وكان يأمر أصحابه
  أن يشهد واعلى من خالفهم بالزور ⁦(خلب )⁩ انخلابة الخديعة باللسان تقول منه خلبه
  بخلبه بالضم واختلبه مثله وفى المثل اذا لم تغلب فاخلب أى فاخدع والخلبة الحذاعة
  من النساء قال النمريز نواب
  أودى الشباب وحب الخالة الخلبه * وقد برتث فابالجسم من قلبه
  ويروى بفتح اللام على أنه جمع وهم الذين يخدعون النساء وامرأة خالة أى مختالة وقوم
  خالة أى مختالون مثل باعة من البيع ابن السكيت رجل خلاب وخلبوت أى خذاع كذاب
  قال الشاءر ٢ وشر الرجال الغادرالخلبوت والبرق انخلب الذى لاغيث فيه كأنه
  خادع ومنه قيل لمن يعدولا ينجز * انماأنت كبرق خلب ٣ الخلب أيضا السحاب الذى
  لا مطرفيه يقال برق خلب بالاضافة والمخلب المكثير الوشى من الثياب قال لبيد
  وغيث بدكداكيزين وهاده * نبات كوشى العبة رى المخلب
  والخلب بالكسر الحجاب الذى بين القاب وسواد البطن يقال للرجل الذى تحبه النساء انه
  لخلب نساء والحلب بالضم الحأة نقول منه ماء مخاب وقد أخلب والخاب أيضا الليف . وقال
  كانّ وريداه رشا آخلب ويروى وريديه على اعمال كانّ وتركْ الاضمار وكذلك الحاب
  بالتسكين واللينمة خلبة وخلية والمخلب للطائر والسباع بمنزلة الظفر للانسان والمخلب المنجل
  الذى لا أسنان له وخلبت النبات أخلبه خلبا واستخلبته اذا قطعته وفى الحديث نستخلب
  الخبيرأى نقطع النبات ونأكاه والخلين الهقاء والنون للالحاق قال ابن السكيت وليس من
  انخلابة قال الراجز يصف النوق
  وخلطت كل دلاث علجن * تخليط خرقاء اليدين خلين
  نب خنبت رجله بالكسر أى وهنت وأخنبتها أنا قال ابن أحر
  أبى الذى أخنب رجل ابن الصعق * اذ كانت الخسل كعلباء العنق
  والحناب الطويل من الرجال وه-ذامماجاء على أصله شاذا لأنّ كل ما كان على فعال من
  الاسماء أبدل من أحدحر فى تضعيفه ياء مثل دينا ر وقيراط كراهية أن يلتبس بالمصادر
  الا أن يكون بالهاء فيخرج عن أصلهمثل دنابة وصنارة ودنامة وخنابة لانه الان قد أمن
  مجاح
  ١ التكراراشارة الى أن
  الاولى بكسر انخاء والنون
  والثانية بضحهما وفه-م المنرجم
  انه كرّراشارة الى أن البادى تارة
  يكون الخاطب والمجيب المرة أى
  أووليها وتارة بالعكس ١ه ل-كنه
  ينافيه قول المصنف فى المرتين
  فتقول بالتا.قالدنه
  خليتمو
  ٣ بضم الخاء وقتح اللام
  مشددة
