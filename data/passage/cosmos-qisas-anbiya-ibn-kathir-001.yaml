text: "قيل علموا أن ذلك كائن بما رأوا ممن كان قبل آدم من الجن والبن قاله قتادة. وقال عبد الله بن عمر كانت الجن قبل آدم بألفي عام فسفكوا الدماء فبعث الله إليهم جنداً من الملائكة فطردوهم إلى جزائر البحور"
summary:
  ar: "يذكر ابن كثير في تفسير سؤال الملائكة عن خلق آدم قول قتادة بأنهم رأوا من كان قبل آدم من الجن والبن، وأثراً عن عبد الله بن عمر أن الجن سبقت آدم بألفي عام."
  en: "Explaining the angels' question about Adam, Ibn Kathir gives Qatada's view that they had seen those before Adam, the jinn and the Bin, and a report from Abd Allah ibn Umar that the jinn preceded Adam by two thousand years."
  es: "Para explicar la pregunta de los ángeles sobre Adán, Ibn Kathir presenta la opinión de Qatada de que habían visto a quienes precedieron a Adán, los genios y los Bin, y un informe de Abd Allah ibn Umar según el cual los genios precedieron a Adán por dos mil años."
  fr: "Pour expliquer la question des anges à propos d'Adam, Ibn Kathir rapporte l'avis de Qatada selon lequel ils avaient vu ceux qui avaient précédé Adam, les djinns et les Bin, ainsi qu'un récit d'Abd Allah ibn Umar selon lequel les djinns ont précédé Adam de deux mille ans."
  ur: "ابن کثیر نے آدم کے بارے میں فرشتوں کے سوال کی وضاحت کرتے ہوئے قتادہ کا قول دیا ہے کہ انہوں نے آدم سے پہلے جن اور بن کو دیکھا تھا اور عبداللہ بن عمر کی روایت ہے کہ جنات آدم سے دو ہزار سال پہلے تھے۔"
  tr: "İbn Kathir, meleklerin Âdem'in yaratılışı hakkındaki sorusuna ilişkin tefsirinde, Katade'nin Âdem'den önce gelen cinleri ve Benileri gördüklerine dair ifadesini ve Abdullah bin Ömer'den cinlerin Âdem'den iki bin yıl önce var olduğuna dair bir rivayeti zikreder."
  id: "Dalam tafsirnya mengenai pertanyaan para malaikat tentang penciptaan Adam, Ibnu Katsir menyebutkan pernyataan Qatadah bahwa mereka melihat orang-orang yang datang sebelum Adam dari kalangan jin dan Bani, serta sebuah riwayat dari Abdullah bin Omar bahwa jin telah ada sebelum Adam selama dua ribu tahun."
