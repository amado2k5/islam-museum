label: { ar: "الموطأ 531 — بلاغ عن بسر بن سعيد: إذا شهدت إحداكن صلاة العشاء فلا تمسن طيباً", en: "Muwatta 531" }
text: "إذا شهدت إحداكن صلاة العشاء، فلا تمسن طيباً"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه عن بسر بن سعيد أن النبي قال للنساء: من شهدت منكن صلاة العشاء فلا تمس طيباً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه موصول عند أحمد (6/363) ومسلم (2/33) والنسائي وابن خزيمة من طريق بسر بن سعيد عن زينب امرأة عبد الله بن مسعود، وأن مسلماً أخرج من حديث بسر عن أبي هريرة نهي من أصابت بخوراً أن تشهد العشاء. {cite:muwatta-maruf-1997 p.274}"
