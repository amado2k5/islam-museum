label: { ar: "الموطأ 531 — بلاغ عن بسر بن سعيد: إذا شهدت إحداكن صلاة العشاء فلا تمسن طيباً", en: "Muwatta 531", es: "Muwatta 531", fr: "Muwatta 531", ur: "موطا 531", tr: "El-Muvatta 531 — Busr ibn Sa’id’den rivayet edildiğine göre: Eğer sizden biri yatsı namazına katılırsa, parfüm sürmesin.", id: "Al-Muwatta 531 — Riwayat dari Busr ibn Sa’id: Jika salah seorang dari kalian menghadiri shalat Isya, maka janganlah memakai parfum." }
text: "إذا شهدت إحداكن صلاة العشاء، فلا تمسن طيباً"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه عن بسر بن سعيد أن النبي قال للنساء: من شهدت منكن صلاة العشاء فلا تمس طيباً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه موصول عند أحمد (6/363) ومسلم (2/33) والنسائي وابن خزيمة من طريق بسر بن سعيد عن زينب امرأة عبد الله بن مسعود، وأن مسلماً أخرج من حديث بسر عن أبي هريرة نهي من أصابت بخوراً أن تشهد العشاء. {cite:muwatta-maruf-1997 p.274}"
  tr: "Malik, Busr ibn Sa'id'den Peygamber'in kadınlara şöyle buyurduğunu işittiğini rivayet etmiştir: \"Sizden kim yatsı namazına katılırsa, parfüm sürmesin.\" Araştırmacı, bu hadisin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini ve Ahmed (6/363), Müslim (2/33), el-Nesai ve İbn Huzeyme'nin hadis derlemelerinde Busr ibn Sa'id aracılığıyla Abdullah ibn Mes'ud'un karısı Zeynep'ten rivayet edildiğini belirtmektedir. Müslim ayrıca, Busr'dan Ebu Hurayra'dan rivayet edilen ve tütsü kullanan bir kadının yatsı namazına katılmasının yasaklandığı bir hadisi de kaydetmiştir. {cite:muwatta-maruf-1997 s.274}"
  id: "Malik meriwayatkan bahwa ia mendengar dari Busr ibn Sa'id bahwa Nabi bersabda kepada wanita: \"Barangsiapa di antara kalian yang menghadiri shalat Isya, hendaknya tidak memakai parfum.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini dari Malik, dan hadits ini terhubung dalam kumpulan hadits Ahmad (6/363), Muslim (2/33), al-Nasa'i, dan Ibn Khuzaymah melalui Busr ibn Sa'id atas otoritas Zaynab, istri Abdullah ibn Mas'ud. Muslim juga memasukkan hadits dari Busr atas otoritas Abu Hurayrah yang melarang wanita yang telah menggunakan dupa untuk menghadiri shalat Isya. {cite:muwatta-maruf-1997 p.274}"
