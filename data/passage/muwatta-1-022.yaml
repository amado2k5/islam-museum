label: { ar: "الموطأ 22 — عمر لمن تخلف عن العصر: طففت", en: "Muwatta 22", es: "Muwatta 22", fr: "Muwatta 22", ur: "موطا 22", tr: "Al-Muwatta 22 — Ömer, ikindi namazını kaçıranlara: Hile yaptınız", id: "Al-Muwatta 22 — Umar kepada orang-orang yang ketinggalan shalat Ashar: Kalian telah berbuat curang" }
text: "ما حبسك عن صلاة العصر؟ فذكر له الرجل عذراً، فقال عمر: طففت"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد الأنصاري، في باب جامع الوقوت: انصرف عمر بن الخطاب من صلاة العصر فلقي رجلاً لم يشهدها فسأله عما حبسه، فاعتذر الرجل، فقال له عمر: طففت، أي نقصت. ويروي يحيى عن مالك قوله إن لكل شيء وفاءً وتطفيفاً. ويذكر المحقق أن الإسناد منقطع لأن يحيى بن سعيد لم يلق عمر، وأنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.43} {cite:muwatta-maruf-1997 p.44}"
  en: "Umar ibn al-Khattab reproaches a man who was late for the afternoon prayer and asks him the reason for the delay."
  es: "Umar ibn al-Khattab reprende a un hombre que llegó tarde a la oración de la tarde y le pregunta el motivo de la demora."
  fr: "Umar ibn al-Khattab réprimande un homme qui était en retard pour la prière de l'après-midi et lui demande la raison de ce retard."
  ur: "عمر بن الخطاب ایک ایسے شخص کو ملامت کرتے ہیں جو عصر کی نماز میں دیر کر رہا تھا اور اس سے تاخیر کی وجہ پوچھتا ہے۔"
  tr: "Malik'in Yahya ibn Sa'id el-Ensari'den rivayet ettiği, Kapsamlı Zaman bölümündeki bir rivayete göre: Ömer ibn el-Hattab ikindi namazından döndüğünde namaza katılmamış bir adamla karşılaştı. Ona neden geciktiğini sordu ve adam özür diledi. Ömer ona, \"İhmal ettin,\" yani eksik kaldın dedi. Yahya ayrıca Malik'ten, \"Her şeyin bir hakkı ve bir eksikliği vardır\" dediğini de rivayet eder. Editör, Yahya ibn Sa'id'in Ömer ile görüşmediği ve rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından nakledildiği için isnad zincirinin koptuğunu belirtmektedir. {cite:muwatta-maruf-1997 s.43} {cite:muwatta-maruf-1997 s.44}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id al-Ansari, dalam bab tentang Waktu yang Komprehensif: Umar ibn al-Khattab kembali dari salat Ashar dan bertemu dengan seorang pria yang tidak hadir. Ia bertanya kepadanya apa yang membuatnya terlambat, dan pria itu meminta maaf. Umar berkata kepadanya, \"Kamu telah lalai,\" yang berarti kamu telah kurang. Yahya juga meriwayatkan dari Malik bahwa ia berkata, \"Segala sesuatu ada haknya dan ada kekurangannya.\" Editor mencatat bahwa rantai periwayatan terputus karena Yahya ibn Sa'id tidak bertemu dengan Umar, dan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.43} {cite:muwatta-maruf-1997 p.44}"
