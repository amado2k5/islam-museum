label: { ar: "الموطأ 22 — عمر لمن تخلف عن العصر: طففت", en: "Muwatta 22" }
text: "ما حبسك عن صلاة العصر؟ فذكر له الرجل عذراً، فقال عمر: طففت"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد الأنصاري، في باب جامع الوقوت: انصرف عمر بن الخطاب من صلاة العصر فلقي رجلاً لم يشهدها فسأله عما حبسه، فاعتذر الرجل، فقال له عمر: طففت، أي نقصت. ويروي يحيى عن مالك قوله إن لكل شيء وفاءً وتطفيفاً. ويذكر المحقق أن الإسناد منقطع لأن يحيى بن سعيد لم يلق عمر، وأنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.43} {cite:muwatta-maruf-1997 p.44}"
  en: "Umar ibn al-Khattab reproaches a man who was late for the afternoon prayer and asks him the reason for the delay."
