text: "… وأمر أن يقول المضطجع : باسمك ربي وضعتُ جنبي، وبك أرفعُه، إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين. وقال لفاطمة : سبحي الله ثلاثًا وثلاثين، وأحمديه ثلاثًا وثلاثين، وكبريه أربعا وثلاثين. وأوصي بقراءة الدعاء المتقدم …"
