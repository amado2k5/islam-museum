label: { ar: "الموطأ 849 — مالك: من أكل أو شرب ساهياً أو ناسياً في صيام تطوع فلا قضاء عليه، ويتم يومه ولا يفطره؛ ولا قضاء على من قطع صيامه لعذر", en: "Muwatta 849", es: "Muwatta 849", fr: "Muwatta 849", ur: "موطا 849", tr: "El-Muvatta 849 — Malik: Kim nafile oruç tutarken kasıtsız veya unutkanlıkla bir şey yer veya içerse, orucunu kaza etmesi gerekmez ve günü orucu bozmadan tamamlamalıdır; geçerli bir mazeret nedeniyle orucunu bozan kimse için de orucu kaza etmesi gerekmez.", id: "Al-Muwatta 849 — Malik: Barangsiapa makan atau minum tanpa sengaja atau karena lupa saat berpuasa sunnah, maka ia tidak wajib menggubah puasanya, dan hendaknya ia menyelesaikan puasa seharian tanpa membatalkannya; dan tidak perlu menggubah puasa bagi orang yang membatalkannya karena alasan yang sah." }
summary:
  ar: "قول يرويه يحيى عن مالك: من أكل أو شرب ساهياً أو ناسياً في صيام تطوع فليس عليه قضاء، وليتم يومه الذي أكل فيه أو شرب وهو متطوع، ولا يفطره. وليس على من أصابه أمر يقطع صيامه وهو متطوع قضاء إذا كان إنما أفطر من عذر غير متعمد للفطر. ولا يرى عليه قضاء صلاة نافلة إذا قطعها من حدث لا يستطيع حبسه مما يحتاج فيه إلى الوضوء. ويذكر المحقق أنه رواه عن مالك أبو مصعب (828–830). {cite:muwatta-maruf-1997 p.411}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Gönüllü oruç tutarken kasıtsız veya unutkanlıkla yiyip içen kimsenin orucunu kaza etmesi gerekmez. Yiyip içtiği günü tamamlamalı ve orucunu bozmamalıdır. Benzer şekilde, gönüllü orucunu kesintiye uğratan bir olay yaşayan kimse, kasıtsız bir mazeret nedeniyle orucunu bozmuşsa, kaza etmesi gerekmez. Aynı şekilde, abdest gerektiren ve kontrol edemeyeceği bir kirlilik nedeniyle namazı yarıda kesen kimse de namazı kaza etmesi gerekmez. Araştırmacı, bunun Malik'ten Ebu Mus'ab (828-830 Hicri) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.411}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Barang siapa makan atau minum tanpa sengaja atau karena lupa saat berpuasa sunnah, tidak diwajibkan untuk mengqadha puasa tersebut. Mereka harus menyelesaikan puasa pada hari di mana mereka makan atau minum saat berpuasa sunnah, dan puasa mereka tidak boleh batal. Demikian pula, orang yang mengalami kejadian yang mengganggu puasa sunnahnya tidak diwajibkan untuk mengqadha puasa tersebut jika ia membatalkannya karena alasan yang tidak disengaja. Begitu pula, mereka tidak diwajibkan untuk mengqadha salat sunnah jika mereka mengganggunya karena najis yang tidak dapat mereka kendalikan dan yang membutuhkan wudhu. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (828–830 H). {cite:muwatta-maruf-1997 p.411}"
