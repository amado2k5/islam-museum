label: { ar: "الموطأ 849 — مالك: من أكل أو شرب ساهياً أو ناسياً في صيام تطوع فلا قضاء عليه، ويتم يومه ولا يفطره؛ ولا قضاء على من قطع صيامه لعذر", en: "Muwatta 849" }
summary:
  ar: "قول يرويه يحيى عن مالك: من أكل أو شرب ساهياً أو ناسياً في صيام تطوع فليس عليه قضاء، وليتم يومه الذي أكل فيه أو شرب وهو متطوع، ولا يفطره. وليس على من أصابه أمر يقطع صيامه وهو متطوع قضاء إذا كان إنما أفطر من عذر غير متعمد للفطر. ولا يرى عليه قضاء صلاة نافلة إذا قطعها من حدث لا يستطيع حبسه مما يحتاج فيه إلى الوضوء. ويذكر المحقق أنه رواه عن مالك أبو مصعب (828–830). {cite:muwatta-maruf-1997 p.411}"
