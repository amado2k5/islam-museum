text: "… المهاجرين. ثم اقبل رسول اللّه فى الأنصار فقال : يا عباس ! من هؤلام؟ قال: هؤلاء الموت الأحمر، هذا رسول اللّٰه فى الأنصار. فقال ابو سفيان : لقد رأيت ملك كسرى وقيصر فما رأيت مثل ملك ابن اخيك. فقال العباس: …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 173، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 2, p. 173, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 2، ص 173 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
