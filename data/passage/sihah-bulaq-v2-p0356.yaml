  وتحت ر-لى -رة ذمول • مائرة الضبعين قنذفيل • للمروفى أخفافها صليل
  وأنا أظ:ه معرّيا كانه شبه ناقته يفيل يقال له بالفارسية كنده بيل رزل ، رزل بالضم
  اسم فرس كان لطفيل بن مالك والرزل اللشيم قال هدية بن الخشرم
  ولا قرزلا وسط الرجال جنادفا • اذا مامشى أوقال قولا سلتعا
  رطل لقرطالة واحدة القرطال ق عبل لقرعيلانة دوبية عريضة محبنطئة
  عظيمة البطن وأصله قرعبل فزيدت فيه ثلاثة أحرف لان الاسم لا يكون على أكثر من خمسة
  أحرف وتصغيرم قريعبة( رقل لاموى" القراقل قص النساء واحدها قرقل وهو الذى
  تسميه العامة القرقر⁦( قرمل)⁩ القرمل شجر ضعيف لاشولكه وفى المثسل ذايل عاذ بقرملة |
  فال جرير
  كان الفرودق اذيعو ذبجاله مثل الذليل يعوذ تحت القرمل
  والرمل بالكسر ولد البختىّ والقرامل الابل ذوات السسنامين والقرامل ماتشها المرأة
  في شعرها زل لقزل بالتحر ين أسوا العرج وقد قزل بالكسرفه وأقزل والقزلان
  العرجان وقد قزل بالفتح قزلانا اذامشى مشية العرجان ،قطل القعال والقصطل
  بالسيز والصاد الفيار والقسطال لغة فيه كابّه ممدود منه مع قلهة فعلال فى غير المضِاعف
  وأنشدأبومالك لاوس بن حجريرتى رجلا
  ولنحم رفد القوم ينتظرونه * ولنحم -شو الدرع والسربال
  ولنعم مأوى المستضيف اذادعا * والخيل خارجة من القسطال
  وقال آخر• كأنه قسطال يوم ذى رهج * والقسطلانية قوس قزح وحرة الشفق أيضا قال
  مالك بن الريب ترى جد ثاقد جرّت الريح فوقه * ترابا كاون القسطلانى هاييا
  صل لقصل القطع وسيف مقصل وقصال أى قطاع ومنه سمى القصيل وقصلت الداية
  علفتها القصيل أبوعمر والقصل بالكسر الضعيف الفسل وأنشد .
  ليس بقصل حلس حلسمّ * عند البيوت راشن مقم
  والقصالة ما يعزل من البرّاذانقي ثم يداس الشانية والقصل فى الطعام مثل الزوان وقال ١
  قد غربلت وكريات من القصل • والقصلة من الابل غوالصرمة ( صمل قصمل أى قطعه
  والمتصمل الشديد العصامن الرعاء قال أبو اتجم ٢ وايس بالفيادة المقصمل• لان الراعى
  انما يوصف بلين العص قصعل القصعل مثل القرزل المئيم ( طل القطل القطع
  يقال قطله فهو مقطول وقطم-ل ونخلة قطيل اذاقطعت من أصلها فسقطت وكان أبوذؤيب
  الهذلى يلقب القطيل وجذع قطل بالضم أى مقطول قال المتنخل الهدلى يصف قتلا
  مجدّلا يتكسى جلدودمه • كماتقطل جذع الدومة القطل
  ويروى بتسقى والمقطلة حديدة يقطع بها والجمع مقاطل والقطيلة القطعة من الكساء والثوب
  بنشف بها الماء والقاطول موضع على دجلة ( طريل قطربل بالضم وتشديد الباء
  موضع بالغراققعل. القعال نور العنب يقال أقعل الكرم اذا انشق قعاله وتنبائر
  إوالقاعلة واحدة القواعل وهى الطوال من الجبال وقه ول الرجل أى مشى مشبة من يحى
  التراب باحدى قدميه على الاخرى لقبل فيه-ما وقال• فصرت أمشى القعولى والفنجله
