label:
  ar: "صحيح مسلم، كتاب العتق"
  en: "Sahih Muslim, Book 20: The Book of Emancipating Slaves"
  ur: "صحیح مسلم، کتاب العتق"
  es: "Sahih Muslim, Libro 20: El Libro de la Emancipación de los Esclavos"
  fr: "Sahih Muslim, Livre 20: Le Livre de l'émancipation des esclaves"
summary:
  ar: "القسم 20 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العتق»، ويضم فيها النصوص من 3770 إلى 3800 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 20 of Sahih Muslim (The Book of Emancipating Slaves) in the division of the open hadith dataset the museum took its reports from: reports 3770 to 3800 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 20، عنوان «کتاب العتق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3770 تا 3800۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 20 de Sahih Muslim (El Libro de la Emancipación de los Esclavos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3770 al 3800 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre de l'affranchissement des esclaves), volume 20, qui correspond aux hadiths 3770 à 3800 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
