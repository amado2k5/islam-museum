text: "… والراء وياء ساكنة وهى قراءة نافع وأَبى عمرو وابن عامر، وحَفْص عن عاصم وهى لغة الحجازيين. الثانية : جَبْريل كذلك إلا أَنه بفتح الجيم وهى قراءة ابن كثير. الثالثة : جَبْرَءل كذلك إلا أنه بزيادة همزة مكسورة بعد الراء وحذف …"
summary:
