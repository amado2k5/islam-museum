text: "… والراء وياء ساكنة وهى قراءة نافع وأَبى عمرو وابن عامر، وحَفْص عن عاصم وهى لغة الحجازيين. الثانية : جَبْريل كذلك إلا أَنه بفتح الجيم وهى قراءة ابن كثير. الثالثة : جَبْرَءل كذلك إلا أنه بزيادة همزة مكسورة بعد الراء وحذف …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 2، ص 137، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 2, p. 137, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 2، ص 137 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 2, pág. 137, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 2, page 137, mentionne les lectures du Coran et les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 2. cildinin 137. sayfasından bir alıntı, Kur'an okunuşlarını ve okuyucularını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Subul al-Huda wa al-Rashad\" karya Al-Salihi, Volume 2, halaman 137, menyebutkan bacaan Al-Quran dan para qarinya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
