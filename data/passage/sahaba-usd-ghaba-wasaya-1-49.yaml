text: "… توفي أسيد بن حضير في شعبان سنة عشرين، وحمل عمر بن الخطاب السرير حتى وضعه بالبقيع؛ وصلّى عليه، وأوصى إلى عمر، فنظر عمر في وصيته، فوجد عليه أربعة آلاف دينار، فباع ثمر نخلة أربع سنين بأربعة آلاف، وقضى دينه. أخرجه …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 49، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 49, that mentions a testament or parting counsel, what was left behind: estate and inheritance, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 49 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
