text: "… ويده، ولما سئل أي الاسلام خير قال • نتطعم العلعام ونفرأ السلام على من عرفت ومن لم تعرف وقال الاسلام أن تشهد أن لا إله إلا الله وأن حمداً رسول اللّٰه وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت إن …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 319، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 319, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 319 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 319, que menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 319) qui évoque l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage (mentionnés ensemble), le témoignage, la douceur et la plénitude de la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Taymiyye'nin \"İman\" (İman) adlı eserinin 1. cildinin 319. sayfasından bir alıntı, İslam'ı namaz, zekât, oruç ve Hac gibi çeşitli ibadetler, iman ikrarı, namaz ve zekâtın tatlılığı ve mükemmelliği üzerinden tanımlamaktadır. Bu alıntı, kaynak yönergelerine uygun olarak yaklaşık kırk kelime alıntılanarak, makine tarafından okunabilir baskıdan alınmıştır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 319, mendefinisikan Islam melalui berbagai amalan, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat, dan kemanisan serta kesempurnaan iman. Kutipan ini diambil dari edisi yang dapat dibaca mesin, dengan sekitar empat puluh kata yang dikutip sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
