label: { ar: "صحيح البخاري 5368 — ضحك وتبسم", en: "Sahih al-Bukhari 5368 — laughter and smiling", ur: "صحیح بخاری 5368 — ہنسی اور تبسم", fr: "Sahih al-Bukhari 5368 — rire et sourire", es: "Sahih al-Bujari 5368 — risa y sonrisa" }
text: "… . قَالَ لاَ أَسْتَطِيعُ. قَالَ فَأَطْعِمْ سِتِّينَ مِسْكِينًا . قَالَ لاَ أَجِدُ. فَأُتِيَ النَّبِيُّ بِعَرَقٍ فِيهِ تَمْرٌ فَقَالَ أَيْنَ السَّائِلُ . قَالَ هَا أَنَا ذَا. قَالَ تَصَدَّقْ بِهَذَا . قَالَ عَلَى أَحْوَجَ مِنَّا يَا رَسُولَ اللَّهِ فَوَالَّذِي بَعَثَكَ بِالْحَقِّ مَا بَيْنَ لاَبَتَيْهَا أَهْلُ بَيْتٍ أَحْوَجُ مِنَّا فَضَحِكَ النَّبِيُّ حَتَّى بَدَتْ أَنْيَابُهُ قَالَ فَأَنْتُمْ إِذًا ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5368، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 5368, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 5368، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 5368, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 5368, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
