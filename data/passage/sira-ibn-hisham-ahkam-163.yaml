text: "… أفتمنعه أَنْ يأتيها بطعامها؟ خَلِّ سَبِيلَ الرّجُلِ، قال: فأبى أبو جهل، حَتَّى نَالَ أَحَدُهُما من صاحبه، فأخذ أبو البختري لَحْيَ بعير فضربه به، فَشَجَهُ، ووطئه وطئاً شَدِيداً، وحمزة بن عبد المطلب قريب يرى ذلك، وهم يكرهون أن يبلغ ذلك رسول …"
