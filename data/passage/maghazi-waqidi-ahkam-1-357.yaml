text: "… الأَرض حَبَّة عِنَبِ تُؤْكَل، وإنَّ فى يده لَقِطْفَ عِنَبٍ مثل رأس الرجل يأكل منه، وما هو إلَّا رزقُ رزقه اللّه. وكان خُبَيب يتهجّد بالقرآن، الفريضة : البعير المأخوذ فى الزكاة، سمى فريضة لأنه فرض واجب على رب المال، ثم اتسع …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 357، يرد فيه ذكر الفريضة والفرائض، والفرض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 357, whose wording mentions the obligation (farida), the obligatory (fard), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 357 کا اقتباس جس میں فریضہ اور فرائض، فرض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Maghazi de al-Waqidi, volume numérisé 1, p. 357, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Maghazi de al-Waqidi, volumen digitalizado 1, p. 357, cuyo texto menciona la obligación (farida), lo obligatorio (fard), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Vakidi'nin Maghazi adlı eserinin 1. cildinin 357. sayfasından bir alıntı, farz olan amelleri, görevleri ve yükümlülükleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu alıntı, farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Maghazi karya al-Waqidi, Jilid 1, halaman 357, menyebutkan amalan wajib, kewajiban, dan tanggung jawab. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
