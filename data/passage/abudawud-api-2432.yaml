label: { ar: "سنن أبي داود 2432 — عمل يعدل عملا أعظم منه", en: "Sunan Abi Dawud 2432 — a deed that equals a greater one", ur: "سنن ابی داؤد 2432 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sunan Abi Dawud 2432 — una acción que equivale a una mayor", fr: "Sunan Abi Dawud 2432 — une action qui en vaut une plus grande", tr: "Sunan Abi Davud 2432 — Daha büyük bir eyleme denk olan bir eylem", id: "Sunan Abi Dawud 2432 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… عَنْ هَارُونَ بْنِ سَلْمَانَ، عَنْ عُبَيْدِ اللَّهِ بْنِ مُسْلِمٍ الْقُرَشِيِّ، عَنْ أَبِيهِ، قَالَ سَأَلْتُ - أَوْ سُئِلَ النَّبِيُّ - عَنْ صِيَامِ الدَّهْرِ فَقَالَ \" إِنَّ لأَهْلِكَ عَلَيْكَ حَقًّا صُمْ رَمَضَانَ وَالَّذِي يَلِيهِ وَكُلَّ أَرْبِعَاءَ وَخَمِيسٍ فَإِذَا أَنْتَ قَدْ صُمْتَ الدَّهْرَ \". قَالَ أَبُو دَاوُدَ وَافَقَهُ زَيْدٌ الْعُكْلِيُّ وَخَالَفَهُ أَبُو نُعَيْمٍ قَالَ مُسْلِمُ بْنُ عُبَيْدِ اللَّهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2432، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 2432 (Fasting (Kitab Al-Siyam)), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 2432، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2432 (El ayuno (Kitab Al-Siyam)), habla de una acción que equivale a otra mayor. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 2432 (Le Jeûne (Kitab Al-Siyam)), évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui dénombrent, inscrivent, effacent ou évaluent un acte."
  tr: "Sunan Ebu Davud'da yer alan 2432 numaralı hadiste, daha büyük bir ameli sayan bir amele değinilmektedir. Bu amel, iyi ve kötü ameller listeleriyle birlikte, amelin değerini sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2432, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
