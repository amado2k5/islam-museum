label: { ar: "الموطأ 958 — عمر بن الخطاب: يا أهل مكة، ما شأن الناس يأتون شعثاً وأنتم مدهنون؟ أهلوا إذا رأيتم الهلال", en: "Muwatta 958", es: "Muwatta 958", fr: "Muwatta 958", ur: "موطا 958", tr: "El-Muvatta 958 — Ömer ibn el-Hattab: Ey Mekke halkı! Siz bakımlıyken neden insanlar dağınık bir halde geliyorlar? Yeni ayı gördüğünüzde ihrama girin.", id: "Al-Muwatta 958 — Umar ibn al-Khattab: Wahai penduduk Mekah, mengapa orang-orang datang dengan penampilan berantakan sedangkan kalian berpenampilan rapi? Masuklah ke dalam keadaan ihram ketika kalian melihat bulan sabit." }
text: "يا أهل مكة، ما شأن الناس يأتون شعثاً وأنتم مدهنون؟ أهلوا إذا رأيتم الهلال"
summary:
  ar: "أول حديث في باب إهلال أهل مكة ومن بها من غيرهم. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه، أن عمر بن الخطاب قال: يا أهل مكة، ما شأن الناس يأتون شعثاً وأنتم مدهنون؟ أهلوا إذا رأيتم الهلال. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1083) وسويد (500). {cite:muwatta-maruf-1997 p.456}"
  tr: "Mekke halkının ve başka yerlerden gelenlerin ihrama girmesi konusundaki ilk hadis, Malik'in Abdülrahman ibn el-Kâsım'dan, onun babasından rivayet ettiğine göre Ömer ibn el-Hattab'ın şöyle dediği rivayet edilir: \"Ey Mekke halkı! Siz bakımlıyken neden insanlar dağınık geliyor? Yeni ayı gördüğünüzde ihrama girin.\" Editör, bu hadisin Malik'ten Ebu Musab (1083) ve Suveyd (500) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.456}"
  id: "Hadits pertama tentang penduduk Mekah dan mereka yang tinggal di sana dari tempat lain memasuki keadaan ihram. Diriwayatkan oleh Malik dari Abdullah ibn al-Qasim, dari ayahnya, bahwa Umar ibn al-Khattab berkata: “Wahai penduduk Mekah, mengapa orang-orang datang dengan penampilan berantakan sedangkan kalian rapi? Masuklah ke dalam keadaan ihram ketika kalian melihat bulan sabit.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1083) dan Suwaid (500). {cite:muwatta-maruf-1997 p.456}"
