text: "يا أهل مكة، ما شأن الناس يأتون شعثاً وأنتم مدهنون؟ أهلوا إذا رأيتم الهلال"
summary:
  ar: "أول حديث في باب إهلال أهل مكة ومن بها من غيرهم. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه، أن عمر بن الخطاب قال: يا أهل مكة، ما شأن الناس يأتون شعثاً وأنتم مدهنون؟ أهلوا إذا رأيتم الهلال. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1083) وسويد (500). {cite:muwatta-maruf-1997 p.456}"
