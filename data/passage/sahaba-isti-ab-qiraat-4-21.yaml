text: "… هذا الكتاب، وسيأتي الكلام عليه. - الإشراف على ما في أصول فرائض المواريث من الاجتماع والاختلاف. - الاكتفاء في قراءة نافع وأبي عمرو بن العلاء والحجة لكل منهما. - الأمثال السائرة والأبيات النادرة، قطعة من كتاب بهجة المجالس، له نسخة …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 4، ص 21، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 4, p. 21, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 4، ص 21 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 4, pág. 21, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
