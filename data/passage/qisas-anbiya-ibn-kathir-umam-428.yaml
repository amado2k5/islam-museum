text: "… آل فرعون وهم قومه من القبط بالسنين وهى أعوام الجدب التى.لا يستغل فيها زرع ولا ينتفع بضرعٍ. وقوله : و وَنَقص مَنَ الثَّمَرَاتِ وهى قلة الثمار من الأشجار لَعَلَهُمْ يَذْكَرُونَ أى فلم ينتفعوا ولم يرتدعوا، بل تمردوا واستمروا على كفرهم …"
