text: "… موافقته لؤم، وسوءَ الاستماع منه خِيانة. وقالوا. من كثر كلامه كثُر سَقَطُه، ومن ساء خُلُقه قلَّ صديقُه وقال عمر للأحنف : من كثر ضحِكُه قلَّت هَيْبتُه، ومن أكثر من شئ عُرِفَ به، ومن كَثُرَ مِزَاحُه كُثُر سَقَطُه، ومن كثر سَقَطُه …"
