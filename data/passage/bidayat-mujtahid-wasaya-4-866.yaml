label: { ar: "بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 866 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 866 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 866 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Bidayat al-Mujtahid de Ibn Rushd, volumen escaneado 4, pág. 866 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia", fr: "Bidayat al-Mujtahid d'Ibn Rushd, scan volume 4, p. 866 — testament ou dernières volontés; ce qui a été laissé: biens et héritage", tr: "İbn Rüşd'ün Müctehid'in Başlangıcı adlı eserinin resimli 4. cildinin 866. sayfası — Son vasiyetname, miras ve vasiyet olarak geride bıraktığı şeyler.", id: "Awal Mujtahid oleh Ibn Rushd, Jilid Bergambar 4, hlm. 866 — Wasiat terakhir, apa yang ditinggalkannya berupa warisan dan harta pusaka" }
text: "بداية المجتهد قوله لِفِه لَا وَصِيَّةَ لِوَارِثِ هل هو معقول المعنى أم ليس بمعقول؟ واختلفوا في الوصية للميت، فقال قوم: تبطل بموت الموصى له، وهم الجمهور، وقال قوم: لا تبطل. وفي الوصية للقاتل خطأ وعمداً وفي هذا الباب فرع مشهور، …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 866، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 866, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 866 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 4, pág. 866, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Bidayat al-Mujtahid d'Ibn Rushd (tome 4, p. 866) mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il est répertorié dans le Navigateur de Testaments."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 4. cildinin 866. sayfasından, vasiyetname veya kesin miras ile mal varlığı ve miras konularından bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 4, halaman 866, yang menyebutkan wasiat atau surat wasiat terakhir, serta harta dan warisannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
