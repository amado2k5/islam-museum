text: "… طَسْمٌ وأَميمٌ وعِمْليقٌ بنو لَوذِ بنِ سامِ بنِ نوحٍ،. وجديسُ وثمودُ ابنا جَاثِرِ بنِ إرَمَ بنِ سامِ بنِ نوحٍ من حديث سلمة بن الأكوع. البيتان في الجامع لابن وهب ص، والتيجان في ملوك حمير ص، والبدء والتاريخ، ونزهة الألباء ص. …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 5، ص 180، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 5, p. 180, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 5، ص 180 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
