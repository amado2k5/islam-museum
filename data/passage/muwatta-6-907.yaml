label: { ar: "الموطأ 907 — مالك: لم أسمع بقول النبي: ومن لم يجد إزاراً فليلبس سراويل، ولا أرى أن يلبس المحرم سراويل؛ لأن النبي نهى عن لبس السراويلات ولم يستثن فيها كما استثنى في الخفين", en: "Muwatta 907" }
summary:
  ar: "يقول يحيى: سئل مالك عما ذُكر عن النبي أنه قال: ومن لم يجد إزاراً فليلبس سراويل. فقال: لم أسمع بهذا، ولا أرى أن يلبس المحرم سراويل، لأن النبي نهى عن لبس السراويلات فيما نهى عنه من لبس الثياب، ولم يستثن فيها كما استثنى في الخفين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1093) وسويد (489). {cite:muwatta-maruf-1997 p.437}"
