label: { ar: "الموطأ 907 — مالك: لم أسمع بقول النبي: ومن لم يجد إزاراً فليلبس سراويل، ولا أرى أن يلبس المحرم سراويل؛ لأن النبي نهى عن لبس السراويلات ولم يستثن فيها كما استثنى في الخفين", en: "Muwatta 907", es: "Muwatta 907", fr: "Muwatta 907", ur: "موطا 907", tr: "El-Muvatta 907 — Malik: Peygamberimizin “Bel örtüsü bulamayan pantolon giysin” dediğini duymadım. İhramda olan bir hacının pantolon giymesi gerektiğini düşünmüyorum, çünkü Peygamberimiz pantolon giymeyi yasaklamış ve deri çoraplar için yaptığı gibi pantolon için de istisna yapmamıştır.", id: "Al-Muwatta 907 — Malik: Saya belum pernah mendengar Nabi bersabda: “Barangsiapa tidak dapat menemukan kain penutup pinggang, hendaklah ia memakai celana panjang.” Saya tidak berpikir bahwa seorang jamaah haji yang sedang ihram harus memakai celana panjang, karena Nabi melarang memakai celana panjang dan tidak membuat pengecualian untuknya seperti yang beliau lakukan untuk kaus kaki kulit." }
summary:
  ar: "يقول يحيى: سئل مالك عما ذُكر عن النبي أنه قال: ومن لم يجد إزاراً فليلبس سراويل. فقال: لم أسمع بهذا، ولا أرى أن يلبس المحرم سراويل، لأن النبي نهى عن لبس السراويلات فيما نهى عنه من لبس الثياب، ولم يستثن فيها كما استثنى في الخفين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1093) وسويد (489). {cite:muwatta-maruf-1997 p.437}"
  tr: "Yahya şöyle dedi: Malik'e, Peygamberimizden rivayet edilen şu hadis soruldu: \"Bel örtüsü bulamayan kimse pantolon giymelidir.\" Malik şöyle cevap verdi: \"Bunu duymadım ve ihramlı bir hacının pantolon giymesi gerektiğini düşünmüyorum, çünkü Peygamberimiz pantolonu diğer giysilerle birlikte giymeyi yasaklamıştır ve deri çoraplar için yaptığı gibi pantolon için de istisna yapmamıştır.\" Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab (1093) ve Suveyd (489) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.437}"
  id: "Yahya berkata: Malik ditanya tentang apa yang diriwayatkan dari Nabi, bahwa beliau bersabda: “Barangsiapa tidak dapat menemukan kain penutup aurat, hendaklah ia mengenakan celana panjang.” Beliau menjawab: “Saya belum pernah mendengar hal ini, dan saya tidak berpikir bahwa seorang jamaah haji yang sedang ihram harus mengenakan celana panjang, karena Nabi melarang mengenakan celana panjang bersamaan dengan pakaian lainnya, dan beliau tidak membuat pengecualian untuknya seperti halnya untuk kaus kaki kulit.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1093) dan Suwaid (489). {cite:muwatta-maruf-1997 p.437}"
