text: "… مُحَمَّدِ بْنِ عَمْرِو بْنِ حَزْمٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَتَبَ إِلَى أَهْلِ الْيَمَنِ كِتَابًا فِيهِ الْفَرَائِضُ وَالسُّنَنُ وَالدِّيَاتُ وَبَعَثَ بِهِ مَعَ عَمْرِو بْنِ حَزْمٍ فَقُرِئَتْ عَلَى أَهْلِ الْيَمَنِ هَذِهِ نُسْخَتُهَا ‏\"‏ مِنْ مُحَمَّدٍ النَّبِيِّ صلى الله عليه وسلم إِلَى شُرَحْبِيلَ بْنِ عَبْدِ كُلاَلٍ وَنُعَيْمِ بْنِ عَبْدِ كُلاَلٍ وَالْحَارِثِ بْنِ عَبْدِ كُلاَلٍ قَيْلِ ذِي …"
summary:
  ar: "في السنن النسائي؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan al-Nasa'i; sending a letter or message to a party."
  ur: "سنن النسائی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
