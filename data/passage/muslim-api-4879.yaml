label: { ar: "صحيح مسلم 4879 — رفع الدرجات", en: "Sahih Muslim 4879 — ranks raised", ur: "صحیح مسلم 4879 — درجات کی بلندی" }
text: "… دِينًا وَبِمُحَمَّدٍ نَبِيًّا وَجَبَتْ لَهُ الْجَنَّةُ \". فَعَجِبَ لَهَا أَبُو سَعِيدٍ فَقَالَ أَعِدْهَا عَلَىَّ يَا رَسُولَ اللَّهِ فَفَعَلَ ثُمَّ قَالَ \" وَأُخْرَى يُرْفَعُ بِهَا الْعَبْدُ مِائَةَ دَرَجَةٍ فِي الْجَنَّةِ مَا بَيْنَ كُلِّ دَرَجَتَيْنِ كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ \". قَالَ وَمَا هِيَ يَا رَسُولَ اللَّهِ قَالَ \" الْجِهَادُ فِي سَبِيلِ اللَّهِ الْجِهَادُ فِي سَبِيلِ اللَّهِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4879، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4879 (The Book on Government), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4879، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
