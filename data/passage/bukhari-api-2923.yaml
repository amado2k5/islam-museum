label: { ar: "صحيح البخاري 2923 — الأب والأبوة، النسب والانتساب", en: "Sahih al-Bukhari 2923 — the father and fatherhood; paternity and lineage", ur: "صحیح بخاری 2923 — باپ اور والدیت، نسب اور انتساب", es: "Sahih al-Bukhari 2923 — El padre y la paternidad; paternidad y linaje", fr: "Sahih al-Bukhari 2923 — le père et la paternité; la paternité et la lignée", tr: "Sahih el-Buhari 2923 — Baba ve babalık, soy ve bağlılık", id: "Sahih al-Bukhari 2923 — Ayah dan kebapaan, garis keturunan dan afiliasi" }
text: "حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنِ ابْنِ شِهَابٍ، عَنْ جَعْفَرِ بْنِ عَمْرِو بْنِ أُمَيَّةَ، عَنْ أَبِيهِ، قَالَ رَأَيْتُ النَّبِيَّ يَأْكُلُ مِنْ كَتِفٍ يَحْتَزُّ مِنْهَا، ثُمَّ دُعِيَ إِلَى الصَّلاَةِ فَصَلَّى وَلَمْ يَتَوَضَّأْ. حَدَّثَنَا أَبُو الْيَمَانِ أَخْبَرَنَا شُعَيْبٌ عَنِ الزُّهْرِيِّ وَزَادَ فَأَلْقَى السِّكِّينَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2923، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2923 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2923، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2923 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad, la filiación y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2923 (Le Jihad), mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith dans le Coran, la Sunna, la Sîra et les ouvrages traitant du père."
  tr: "Sahih el-Buhari'de 2923 numaralı hadis, babalık, soy ve atalık kavramlarından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2923, menyebutkan tentang ayah, garis keturunan, dan leluhur. Peramban \"Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
