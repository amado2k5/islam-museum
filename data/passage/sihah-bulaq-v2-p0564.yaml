text: |-
  •(فصل اخاهnn
  ٢٢
  فلما جزمت به قربتى • تيممت أطارقة أوخليفا
  ومنه قولهم ذيخ الخليف كما يقال ذتب غضا قال الشاعر
  وذفرى ككاهل ذيخ الخليف * أماب فريقة ليسل فعانا
  وخليفا الناقة ابطاها قال كثير
  كان خليقى زورها ورساهما * بن مكوين ثلمابعد صيدن
  المكاجدر الثعاب والارنب ونحوه والخليفة السلطان الاعظم وقديؤنت وأنشد الفراء
  أبوك خليفة ولدته أخرى * (دأنت خليفة ذالذ الكمال
  وابمع الخلاتف جاؤابه على الاصل مثل كريمة وكرائم وقالوا أيضا خلفاه. من أجل أنه لا يقع
  الاعلى مذ كروفيه الهامجعوه على اسقاط الهاء فصار مفسل ظريف وظرفاء لانّ فعيلة بالهاء.
  لا تجمع على فعلاء ويقال خلف فلان ألانا اذا كان خليفته يقال خلفه فى قومه خلافة ومنه
  قوله تعالى وقال موسى لاخيه هرون اخلفنى فى قومى وخلفته أيضا اذا جئت بعده وخلف
  فم الصائم خلوفا أى تغيرت رائحته وخلف اللبن والطعام اذا تغير طعمه أورا ئحته وقد
  خلف فلان أى فسد حكاه بعقوب وخلفت الثوب أخلفه :ه وخليف اذا بلى وسطه
  فأخرجت البالى منه تم لفقته وحىّ خلوف أى غيب قال أبوزبيد
  أصبح البيت بيت آل بنان * مقشعرا والحى حت خلوف
  أى لم يبق منهم أحد والخلوف أيضا الحضورالمتخلفون وهو من الاضداد وأخلف فوهلغة فى
  خلف أى تغير وأخلفت الثوب لغة فى خلفته اذا أصلحته قال الكميت يصف صائدا
  يمشى بهنّ خفىّ الشخص مختتل * كالنصل أخلف أداما بأطمار
  أى أخلف موضع الخلقان خلقانا ويقال لمن ذهب له مال أوولد أوشى يسستعاض أخلف
  للّه عليك أى ردّ عليك مثل ماذهب فان كان قد هلك له والدأوعتم أوأخ قلت خلف اللّٰه عليك
  بغير ألف أى كان اللّٰه خليفة والدك أومن فقدته عليك ويقال أخلفه ما وعده وهو أن
  يقول شيأولا يفعله على الاستقبال وأخلفه أيضاأى وجدموعدهخلفا قال الاعشى
  أثوى وقصر ليلة ليزوّد! * نفت وأخلف من قتيلة. وعدا
  أى مضت الليلة وكان أهل الجاهليسة يولون أخلفت النجوم اذا أمحلت فلم يكن فيه ا مطر
  وأخلف فلان لنفسه اذا كان قدذهب له شئ جعل مكانه آخر قال ابن مقبل
  فأخلف وأتلف إنما المال عارة * وكله مع الدهر الذى هوآكله
  يقول استفد خلف ما أتلفت وأخلف الرجل اذا أهوى سده الى سيفه ليله واخلف
  النبات أى أخرج الخلفة قال الاصمعىّ يقال أخلفت عن البعيروذلك اذا أصاب حقبه ثيله
  فيحقب أى يحتبس بوله فتحوّل الحقب فتجعل عما يلى خصي البعير ولا يقال ذلك فى الناقة لان
  بولها من حياتها ولا يبلغ الحقب الحياء وأخلف واستخلف أى استقى واستخلفه اى جعله
  خليفته وجلست خلف فلان أى بعده والخلاف المخالفة وقوله تعالى فرح المخلفون بمقعدهم
  خلاف رسول اللّٰه أى مخالفة رسول اللّٰه ويقال خلف رسول اللّٰه وشجر الخلاف معروف
  وموضعه المخلفة وأمافول الراجز
  قوله آل بنان فى نسنخ يمان وفى
  القاموس البنان بالضم موضع
  واسم بجماعة اه كنبه المسحح
