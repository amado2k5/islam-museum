label: { ar: "الموطأ 2330 — مالك: الشرط في الكتابة بالسفر والخدمة والضحية", en: "Muwatta 2330", es: "Muwatta 2330", fr: "Muwatta 2330", ur: "موطا 2330", tr: "El-Muvatta 2330 — Malik: Yazmanın şartı yolculuk, hizmet ve fedakarlıktır.", id: "Al-Muwatta 2330 — Malik: Syarat untuk menulis adalah bepergian, berbakti, dan berkorban." }
summary:
  ar: "حدث مالك في رجل كاتب عبده بذهب أو ورق، واشترط عليه في كتابته سفرا أو خدمة أو ضحية، ثم قوي المكاتب على أداء نجومه كلها قبل محلها: إذا أدى نجومه كلها وعليه هذا الشرط عتق، وأُسقط عنه ما كان من خدمة أو سفر مما يعالجه بنفسه، وما كان من ضحية أو كسوة أو شيء يؤديه فإنه يقوم كالدنانير والدراهم ويدفعه مع نجومه قبل العتق. {cite:muwatta-maruf-1997 p.360}"
  tr: "Malik, kölesi için altın veya gümüşle bir azat sözleşmesi yazan ve sözleşmede kölenin seyahat etmesi, hizmet etmesi veya kurban sunması şartını koşan bir adam hakkında şöyle demiştir: \"Böylece köle, tüm taksitlerini vadesinden önce ödeyebilir hale gelir: Eğer tüm taksitlerini öder ve bu şartı yerine getirirse, azat edilir ve kendi üstlendiği herhangi bir hizmet veya seyahatten muaf tutulur. Kurban, giysi veya sağlaması gereken başka herhangi bir şey ise dinar ve dirhem değerindedir ve azatından önce taksitleriyle birlikte ödenir.\" {cite:muwatta-maruf-1997 s.360}"
  id: "Malik berkata mengenai seorang pria yang membuat kontrak pembebasan budaknya dalam emas atau perak, dengan ketentuan dalam kontrak bahwa budak tersebut harus melakukan perjalanan, melakukan pelayanan, atau mempersembahkan kurban. Kemudian budak tersebut mampu membayar semua cicilannya sebelum jatuh tempo: jika ia membayar semua cicilannya dan memenuhi syarat ini, ia dibebaskan, dan ia dibebaskan dari segala pelayanan atau perjalanan yang dilakukannya sendiri. Adapun kurban, pakaian, atau apa pun yang harus ia sediakan, nilainya sama dengan dinar dan dirham dan dibayarkan bersamaan dengan cicilannya sebelum pembebasannya. {cite:muwatta-maruf-1997 p.360}"
