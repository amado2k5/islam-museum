label: { ar: "الموطأ 2330 — مالك: الشرط في الكتابة بالسفر والخدمة والضحية", en: "Muwatta 2330" }
summary:
  ar: "حدث مالك في رجل كاتب عبده بذهب أو ورق، واشترط عليه في كتابته سفرا أو خدمة أو ضحية، ثم قوي المكاتب على أداء نجومه كلها قبل محلها: إذا أدى نجومه كلها وعليه هذا الشرط عتق، وأُسقط عنه ما كان من خدمة أو سفر مما يعالجه بنفسه، وما كان من ضحية أو كسوة أو شيء يؤديه فإنه يقوم كالدنانير والدراهم ويدفعه مع نجومه قبل العتق. {cite:muwatta-maruf-1997 p.360}"
