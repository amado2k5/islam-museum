label: { ar: "سنن النسائي 1406 — الأب والأبوة", en: "Sunan al-Nasa'i 1406 — the father and fatherhood", ur: "سنن نسائی 1406 — باپ اور والدیت", es: "Sunan al-Nasa'i 1406 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1406 — le père et la paternité" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ سَلَمَةَ، قَالَ حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ إِبْرَاهِيمَ بْنِ نَشِيطٍ، أَنَّهُ سَأَلَ ابْنَ شِهَابٍ عَنِ الْغُسْلِ، يَوْمَ الْجُمُعَةِ فَقَالَ سُنَّةٌ وَقَدْ حَدَّثَنِي بِهِ، سَالِمُ بْنُ عَبْدِ اللَّهِ عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ تَكَلَّمَ بِهَا عَلَى الْمِنْبَرِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1406، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1406 (The Book of Jumu'ah (Friday Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1406، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1406 (El Libro de la Jumu'ah (Oración del viernes)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 1406 (Le Livre de la prière du vendredi), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
