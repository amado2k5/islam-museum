text: "… نعتصرُها فنشربُ منها، قال: لا فراجعته، قلتُ: إنا نستشفي للمريض، قال: إنَّ ذَلِكَ لَيسَ بِشِفَاءٍ وَلِكِنَّهُ دَاءٌ ليس في مسلم، وإنما أخرجه أحمد:، وابن ماجه:. وفي سنن النسائي أن طبيبباً ذكر ضِفْدَعاً في دواء عند رسول اللَّه وَلة، فنهاه عن …"
summary:
