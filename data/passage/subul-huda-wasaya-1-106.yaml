text: "… حالي. فلما مات لحقتُ بالمَوْصِل فأتيت صاحبَه فوجدته على مثل حاله من الاجتهاد والزهادة في الدنيا، فقلت له: إِن فلاناً أَوصى بي إِليك أَن آتيك وأَكون معك. فقال: فأَقم عندي. فأَقمت عنده على مثل أَمْر صاحبه، حتى حضرته الوفاة فقلت: …"
