text: "… إذا قلت المصدر أتخلَّصُ من إطالة الشرح سأله يوماً أستاذُه، وهو طالب علم عن كلمة قال ما هي؟ فأجابه الشيخ: هي مصدر. فقال له المعلم: لماذا لا تُجيبُ جواباً صحيحاً؟ فقال: إذا قلتِ: إنها فعل ماضٍ، يطول بنا الشرح، إذ …"
summary:
  ar: "سُئل جحا ما هي كلمة «قال»، فقال إنها مصدر، فسأله المعلم لماذا لم يجب إجابة صحيحة، فقال إن القول بأنها فعل ماض يتطلب شرحاً طويلاً لصيغها، أما المصدر فموجز. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  en: "Asked what the word 'qāla' is, Juha says it is a verbal noun; the teacher asks why he did not give a correct answer; Juha says calling it a past verb would require a long explanation of its forms, while the verbal noun is brief. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  ur: "جحا سے پوچھا گیا کہ لفظ «قال» کیا ہے، تو اس نے کہا کہ یہ مصدر ہے، استاد نے پوچھا کہ اس نے درست جواب کیوں نہیں دیا، تو اس نے کہا کہ اسے فعل ماضی کہنے کے لیے اس کی صیغوں کی لمبی وضاحت کرنی پڑتی ہے، جبکہ مصدر مختصر ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  fr: "Interrogé sur ce qu'est le mot « qāla », Juha répond que c'est un nom verbal ; le maître demande pourquoi il n'a pas donné une réponse correcte ; Juha dit que l'appeler verbe au passé exigerait une longue explication de ses formes, alors que le nom verbal est bref. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  es: "Al preguntarle qué es la palabra «qāla», Juha dice que es un nombre verbal; el maestro pregunta por qué no dio una respuesta correcta; Juha dice que llamarla verbo pasado exigiría una larga explicación de sus formas, mientras que el nombre verbal es breve. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  tr: "Juha'ya \"قال\" (dedi) kelimesinin ne anlama geldiği soruldu ve o da bunun bir fiil ismi (masdar) olduğunu söyledi. Öğretmen daha sonra neden doğru cevabı vermediğini sordu ve o da bunun geçmiş zaman fiili olduğunu söylemenin, fiil biçimlerinin uzun bir açıklamasını gerektireceğini, oysa bir fiil isminin özlü olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 180}"
  id: "Juha ditanya apa arti kata \"قال\" (berkata), dan dia menjawab bahwa itu adalah kata benda verbal (masdar). Guru kemudian bertanya mengapa dia tidak memberikan jawaban yang benar, dan dia menjawab bahwa mengatakan itu adalah kata kerja bentuk lampau akan membutuhkan penjelasan panjang lebar tentang bentuknya, sedangkan kata benda verbal lebih ringkas. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
