text: |-
  ٤٣٤
  *⁦(فصل الذون)⁩*
  .(a,)٠
  نلحامل ونبهته أنا رفعته من الجول يقال أشيعوا بالكنى فانها منبهة وانتبه من نومه استيقظ
  وأنيهته أنا والتنبيه مثله ونبهته على الشئ أوقفته عليه فتنبه هو عليه أبو زيد نبهت للامر
  بالسكسر أنيه نيها وهو الامر تنساه ثم تنتبه له أبو عمر وأنبهت حاجة فلان اذا نسيتها فهى
  منبهة ونيهان أبوحى من طيء وهو نبهات بن عمرو ⁦(نجه)⁩ اليه الزجر والردع قال
  حييت عنا أيها الوجه • ولغيركً البغضاء والنجه
  تقول منه نجهت الرجل وانتجهته وتهجهته قال رؤبة » كعكعته بالرجم والتهجه * ويروى
  كسكفته يقول رددت الخصم ورجل ناجه اذادخل بلدافكرهه ⁦(نده)⁩ النده الزجرتق ول
  ندهت البعيراذازبرته عن الحوض وغيره وندهت الابل سقتها مجتمعة وكان طلاق الجاهلمية
  اذ هبى فلا أنده مربك أى لا أردا بلك لتذهب حيث شاءت والندهة والندهة بفتح النون
  وضمها الكثرمن المال من صامت أوماشية وأنشد الامولجيل
  فكيف ولانوفى دماؤهم دهى * ولامالهم ذ وندهة فيدونى
  ⁦( نزه)⁩ النزهة معروفة ومكان نزه وقد نزهت الارض بالكسر وخر جنا نتنزه فى إلرياض
  وأصله من البعد قال ابن السكيت ويما يضعه الناس فى غيرم وضعه ولهم نرجنا نتنزه
  اذاخرجوا الى البساتين قال وانما التنزه التباعد عن المياه والارياف ومنه قبل فلان
  تنزه عن الاقذاروينزه نفسه عنما أى ياعدها عنها والنزاهة البعد عن السو" وزه الفلاة
  ما تساعد منهاءن المياه والارياف قال الهذلى
  أقب طريدينزه الفلا• فلايرد الماء الاانتيابا
  ويقال سقت ابلى ثم نزهتها نزها أى باعدتم ا عن الماء وان فلا نالنزيه كريم اذا كان بعمدامن
  اللوم وهونزيه الطاق وهذا مكان نزيه أى خلاء يعيد من الناس ايس فيه أحد .( )قه
  نقهت نفسه بالكسرأعيت وكات والنافه المكال المعي من الابل وغيرها والجع تفه وقد
  أنفه فلان الد ونفهها اذا أكلها وأءاها وجل منفه وناقة منفهة قال
  رب همّ جشمته فى هواكم * وبعير. نفه محسود
  والمنقوه الضعيف الفؤاد الجبان ⁦(نقه)⁩. نقه من مرضه بالحكسرنتها مثل تعب تعبا
  وكذلك نقه نقوها مثل كلخ كارحافهو ناقه اذاصح وهو فى عقب علته والمع نقه وآنقهه اللّٰه
  ويقال أيضافقه الكلام نقها ونقهه بالفتح نقها أى فهمه وفلان لا يفقه ولا سقه والاستنقاه
  الاستفهام وأنقه لى سمعك أى ارعفيه ⁦(نكد)⁩ النكهة ريح الفم ونكهته تشممت ربعه
  نكهت مجاهدا فوجدت منه•كريح الكاب مات حديث عهد
  واستنكهت الرجل فنكه فى وجهى شه وينكه نكها اذا أمرته بأن يشكه لتعلم أشارب
  هوأم غيرشارب والفكهبالضم من الابل التى ذهبت آصواتمامن الاعماء والضعف وهى
  لغسة تيم فى النقه ونكه الرجل تغيرت نكهته من التخمة ويقال فى الدعاء الانسان هندت
  ولا تذكه أى أصبت خيرا ولا أصدابك الضرّ هه نهنهت الرجل عن الشئ فتهنه أى
  كففته وزجرته فسكف ونهنهت السبيع اذا صحت به لتسكفه والتهنه الثوب الرقيق النسبج
  مثل الله له والهلهل والاص-ل فى نهذه نه بذلاث هاآت واغا أبدلوا من الهاءالوسطى نونا
  للفرق
