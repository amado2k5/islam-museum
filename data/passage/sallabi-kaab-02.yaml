text: "ونترك كعب بن مالك رمي يحدثنا فيقول: لم أتخلف عن رسول الله وَلِيِ في غزوة غزاها إلا في غزوة تبوك، غير أني كنت تخلفت في غزوة بدر، ولم يعاتب أحداً تخلف عنها، إنما خرج رسول اللّٰه وال في…"
