  ur: "الصلبی کی السیرۃ النبویہ سے ایک اقتباس، غزوة تبوك میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
