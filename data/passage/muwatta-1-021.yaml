label: { ar: "الموطأ 21 — الذي تفوته صلاة العصر كأنما وتر أهله وماله", en: "Muwatta 21" }
text: "الذي تفوته صلاة العصر كأنما وتر أهله وماله"
summary:
  ar: "أول حديث في باب جامع الوقوت. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر، أن النبي شبّه من تفوته صلاة العصر بمن أُصيب في أهله وماله إصابة يطلب بها الثأر. ويفسر المحقق الوتر بالجناية التي يُطلب ثأرها فيجتمع على صاحبها غم المصيبة وغم طلب الثأر، ويخرّج الحديث من طرق أصحاب مالك عند البخاري (552) ومسلم (2/111) وأبي داود (414) والنسائي وابن حبان، ويحيل على التمهيد (14/115). {cite:muwatta-maruf-1997 p.43}"
  en: "The Prophet: one who lets the afternoon prayer slip is as though he had been stripped of his family and his wealth — a hadith on the gravity of missing the afternoon prayer."
