text: "الذي تفوته صلاة العصر كأنما وتر أهله وماله"
summary:
  ar: "أول حديث في باب جامع الوقوت. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر، أن النبي شبّه من تفوته صلاة العصر بمن أُصيب في أهله وماله إصابة يطلب بها الثأر. ويفسر المحقق الوتر بالجناية التي يُطلب ثأرها فيجتمع على صاحبها غم المصيبة وغم طلب الثأر، ويخرّج الحديث من طرق أصحاب مالك عند البخاري (552) ومسلم (2/111) وأبي داود (414) والنسائي وابن حبان، ويحيل على التمهيد (14/115). {cite:muwatta-maruf-1997 p.43}"
  en: "The Prophet: one who lets the afternoon prayer slip is as though he had been stripped of his family and his wealth — a hadith on the gravity of missing the afternoon prayer."
  es: "El Profeta: quien deja pasar la oración de la tarde es como si le hubieran arrebatado a su familia y sus riquezas —un hadiz sobre la gravedad de faltar a la oración de la tarde."
  fr: "Le Prophète: celui qui manque la prière de l'après-midi est comme s'il avait été dépouillé de sa famille et de ses biens — un hadith sur la gravité de manquer la prière de l'après-midi."
  ur: "رسول اللہ: جس نے نماز ظہر کو پھسلنے دیا گویا اس سے اس کا اہل و عیال اور اس کا مال چھین لیا گیا، ظہر کی نماز نہ پڑھنے کی سنگینی پر حدیث ہے۔"
  tr: "Namazın tam vaktine ilişkin bölümdeki ilk hadis. Yahya'nın Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Peygamberimiz ikindi namazını kaçıranı, ailesine ve malına zarar vermiş, intikam almak isteyen birine benzetmiştir. Araştırmacı, \"vitr\"i intikam almak istenen bir suç olarak yorumluyor; dolayısıyla mağdur hem zararın hem de intikamın acısını çekiyor. Bu hadisi, Buhari (552), Müslim (2/111), Ebu Davud (414), Nesai ve İbn Hibban'daki Malik'in sahabelerinin rivayet zincirlerinden alıntılıyor ve Temhid'e (14/115) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.43}"
  id: "Hadits pertama dalam bab tentang waktu shalat yang lengkap. Diriwayatkan oleh Yahya dari Malik, dari Nafi’, dari Abdullah ibn Umar, bahwa Nabi menyamakan orang yang ketinggalan shalat Ashar dengan orang yang mengalami kerugian pada keluarga dan hartanya, kerugian yang dibalas dengan pembalasan. Peneliti menafsirkan “witr” sebagai kejahatan yang dibalas dengan pembalasan, sehingga korban menderita kesedihan karena kehilangan dan kesedihan karena pembalasan. Ia mengutip hadits tersebut melalui sanad para sahabat Malik dalam Bukhari (552), Muslim (2/111), Abu Dawud (414), An-Nasa’i, dan Ibn Hibban, dan merujuk pada At-Tamhid (14/115). {cite:muwatta-maruf-1997 p.43}"
