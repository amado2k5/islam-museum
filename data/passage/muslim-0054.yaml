label: { ar: "مسلم 54 — لا تدخلون الجنة حتى تؤمنوا ولا تؤمنون حتى تحابوا", en: "Muslim 54 — You will not enter Paradise until you believe and love one another", es: "Musulmán 54 — No entraréis en el Paraíso hasta que no creáis y os améis unos a otros.", fr: "Muslim 54 — Vous n’entrerez pas au Paradis tant que vous ne croirez pas et ne vous aimerez pas les uns les autres.", ur: "مسلم 54 - تم اس وقت تک جنت میں داخل نہیں ہو سکتے جب تک تم ایمان نہ لاؤ اور ایک دوسرے سے محبت نہ کرو", tr: "Müslim 54 — İman etmedikçe cennete giremezsiniz ve birbirinizi sevmedikçe iman edemezsiniz.", id: "Muslim 54 — Kalian tidak akan masuk surga sampai kalian beriman, dan kalian tidak akan beriman sampai kalian saling mencintai." }
text: "قال رسول الله: لا تدخلون الجنة حتى تؤمنوا، ولا تؤمنون حتى تحابوا، أولا أدلكم على شيء إذا فعلتموه تحاببتم؟ أفشوا السلام بينكم"
summary:
  ar: "رواية أبي هريرة في باب التحريض على إفشاء السلام من كتاب الإيمان في صحيح مسلم؛ ربط دخول الجنة بالإيمان والإيمان بالمحبة، والمفتاح العملي إفشاء السلام."
  tr: "Sahih Müslim'deki İman Kitabı'nda yer alan, barışın yayılmasını teşvik etme bölümünde Ebu Hurayra'nın rivayetine göre, cennete girmek imanla, iman da sevgiyle bağlantılıdır ve pratik çözüm barışı yaymaktır."
  id: "Riwayat Abu Hurairah dalam bab tentang mendorong penyebaran perdamaian dari Kitab Iman dalam Sahih Muslim menghubungkan masuk surga dengan iman dan iman dengan cinta, dan kunci praktisnya adalah menyebarkan perdamaian."
