text: "قال رسول الله: لا تدخلون الجنة حتى تؤمنوا، ولا تؤمنون حتى تحابوا، أولا أدلكم على شيء إذا فعلتموه تحاببتم؟ أفشوا السلام بينكم"
summary:
  ar: "رواية أبي هريرة في باب التحريض على إفشاء السلام من كتاب الإيمان في صحيح مسلم؛ ربط دخول الجنة بالإيمان والإيمان بالمحبة، والمفتاح العملي إفشاء السلام."
