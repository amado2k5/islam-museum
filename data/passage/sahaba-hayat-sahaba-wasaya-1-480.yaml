  tr: "Kandahlavi'nin *Hayat al-Sahaba* adlı eserinin resimli 1. cildinin 480. sayfasında, son bir vasiyetname veya miras belgesinden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
