text: "… - كشف الأستار، قال: حدَّثنا عَبْدَةُ بنُ عبدِ اللّٰه القَسْمَليُّ، ثنا عبدُ العزيزِ بنُ أَبانَ، ثنا معمرٌ، عنِ الزُّهريِّ، عن عمرَ بنِ عبدِ العزيز، عن أَبيه - فأَحْسِبُه قد ذكرَ: عن جدِّهِ-: أَنَّ النبيَّ وَلِ سُثِلَ: أَيُّ الإِسلامِ أَفضلُ؟ قال: …"
