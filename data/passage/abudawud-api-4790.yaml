label: { ar: "سنن أبي داود 4790 — وصف المؤمن", en: "Sunan Abi Dawud 4790 — a description of the believer", ur: "سنن ابی داؤد 4790 — مومن کا وصف", es: "Sunan Abi Dawud 4790 — una descripción del creyente", fr: "Sunan Abi Dawud 4790 — une description du croyant", tr: "Sunan Abi Davud 4790 — Müminin Tanımı", id: "Sunan Abi Dawud 4790 — Deskripsi tentang Orang Beriman" }
text: "… أَخْبَرَنِي أَبُو أَحْمَدَ، حَدَّثَنَا سُفْيَانُ، عَنِ الْحَجَّاجِ بْنِ فُرَافِصَةَ، عَنْ رَجُلٍ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، ح وَحَدَّثَنَا مُحَمَّدُ بْنُ الْمُتَوَكِّلِ الْعَسْقَلاَنِيُّ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا بِشْرُ بْنُ رَافِعٍ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، رَفَعَاهُ جَمِيعًا قَالَ قَالَ رَسُولُ اللَّهِ \" الْمُؤْمِنُ غِرٌّ كَرِيمٌ وَالْفَاجِرُ خِبٌّ لَئِيمٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4790، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 4790 (General Behavior (Kitab Al-Adab)), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 4790، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4790 (Conducta General (Kitab Al-Adab)), menciona una descripción del creyente. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Abi Dawud, n° 4790 (Comportement général), mentionne une description du croyant. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sünen Ebu Davud'da yer alan 4790 numaralı hadis, mümini tanımlar. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde ele alan bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4790, menjelaskan tentang orang beriman. Hadits ini disusun oleh seorang peneliti yang membahas rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
