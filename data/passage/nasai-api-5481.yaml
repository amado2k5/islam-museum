label: { ar: "سنن النسائي 5481 — جمع القرآن والمصاحف", en: "Sunan al-Nasa'i 5481 — the collection of the Qur'an and the codices", ur: "سنن نسائی 5481 — جمعِ قرآن اور مصاحف", es: "Sunan al-Nasa'i 5481 — la colección del Corán y los códices", fr: "Sunan al-Nasa'i 5481 — le recueil du Coran et des codex" }
text: "أَخْبَرَنَا سُلَيْمَانُ بْنُ سَلْمٍ الْبَلْخِيُّ، - هُوَ أَبُو دَاوُدَ الْمَصَاحِفِيُّ - قَالَ أَنْبَأَنَا النَّضْرُ، قَالَ أَنْبَأَنَا يُونُسُ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَمْرِو بْنِ مَيْمُونٍ، قَالَ سَمِعْتُ عُمَرَ بْنَ الْخَطَّابِ، يَقُولُ كَانَ رَسُولُ اللَّهِ يَتَعَوَّذُ مِنْ خَمْسٍ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ وَسُوءِ الْعُمُرِ وَفِتْنَةِ الصَّدْرِ وَعَذَابِ الْقَبْرِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5481، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan al-Nasa'i, no. 5481 (The Book of Seeking Refuge with Allah), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن نسائی کی حدیث نمبر 5481، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5481 (El Libro de la Búsqueda de Refugio en Alá), menciona la colección del Corán y los códices. El catálogo del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5481 (Le Livre de la recherche du refuge auprès d'Allah), mentionne la collection du Coran et des codex. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ces textes, ainsi que la Sunna, la Sîra et les ouvrages traitant de ce sujet."
