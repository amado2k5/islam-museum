text: "… قَالَ مَرِضَ، فَأَحْسَنْتُ الْقِيَامَ عَلَيْهِ، فَوَلِيتُ دَفْنَهُ. قَالَ قَدْ كَانَ أَهْلَ ذَاكَ مِنْكَ. فَمَكُثَ حِينًا، ثُمَّ إِنَّ الرَّجُلَ الَّذِي أَوْصَى إِلَيْهِ أَنْ يُبْلِغَ عَنْهُ وَافَى الْمَوْسِمَ فَقَالَ يَا آلَ قُرَيْشٍ. قَالُوا هَذِهِ قُرَيْشٌ. قَالَ يَا آلَ بَنِي هَاشِمٍ. قَالُوا هَذِهِ بَنُو هَاشِمٍ. قَالَ أَيْنَ أَبُو طَالِبٍ قَالُوا هَذَا أَبُو طَالِبٍ. قَالَ أَمَرَنِي فُلاَنٌ أَنْ أُبْلِغَكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3845، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3845 (Merits of the Helpers in Madinah (Ansaar)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3845، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3845 (Méritos de los Ayudantes en Medina (Ansar)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
