label: { ar: "الموطأ 209 — الصنابحي: قراءة أبي بكر في الثالثة من المغرب", en: "Muwatta 209" }
summary:
  ar: "يرويه مالك عن أبي عبيد مولى سليمان بن عبد الملك عن عبادة بن نسي عن قيس بن الحارث عن أبي عبد الله الصنابحي، في باب القراءة في المغرب والعشاء: قدم الصنابحي المدينة في خلافة أبي بكر الصديق فصلى وراءه المغرب، فقرأ في الركعتين الأوليين بفاتحة الكتاب وسورة من قصار المفصل، ثم قام في الثالثة فدنا منه الصنابحي حتى كادت ثيابه تمس ثيابه، فسمعه يقرأ بالفاتحة وبالآية الثامنة من سورة آل عمران التي فيها الدعاء بألا تزيغ القلوب بعد الهدى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن أبي أويس عند البخاري في التاريخ وعبد الرزاق ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.129}"
