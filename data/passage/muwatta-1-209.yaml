label: { ar: "الموطأ 209 — الصنابحي: قراءة أبي بكر في الثالثة من المغرب", en: "Muwatta 209", es: "Muwatta 209", fr: "Muwatta 209", ur: "موطا 209", tr: "Al-Muwatta 209 — Al-Sanabihi: Ebu Bekir'in akşamın üçüncü rekatında okuduğu okuma", id: "Al-Muwatta 209 — Al-Sanabihi: Bacaan Abu Bakar pada rakaat ketiga Maghrib" }
summary:
  ar: "يرويه مالك عن أبي عبيد مولى سليمان بن عبد الملك عن عبادة بن نسي عن قيس بن الحارث عن أبي عبد الله الصنابحي، في باب القراءة في المغرب والعشاء: قدم الصنابحي المدينة في خلافة أبي بكر الصديق فصلى وراءه المغرب، فقرأ في الركعتين الأوليين بفاتحة الكتاب وسورة من قصار المفصل، ثم قام في الثالثة فدنا منه الصنابحي حتى كادت ثيابه تمس ثيابه، فسمعه يقرأ بالفاتحة وبالآية الثامنة من سورة آل عمران التي فيها الدعاء بألا تزيغ القلوب بعد الهدى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن أبي أويس عند البخاري في التاريخ وعبد الرزاق ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.129}"
  tr: "Malik, Süleyman ibn Abdülmalik'in azatlı kölesi Ebu Ubeyd'den, o da Ubede ibn Nasi'den, o da Kays ibn el-Harith'ten, o da Ebu Abdül-Sunabihi'den rivayetle, akşam ve yatsı namazlarında okuma bölümünde şöyle anlatmaktadır: Sunabihi, Ebu Bekir es-Siddik'in halifeliği döneminde Medine'ye geldi ve onun arkasında akşam namazını kıldı. İlk iki rekatta Fatiha suresini ve Mufessal'dan (Kur'an'ın son bölümü) kısa bir sure okudu. Sonra üçüncü rekatta ayağa kalktı ve Sunabihi ona o kadar yaklaştı ki, elbisesi neredeyse ona değiyordu. Sunabihi'nin Fatiha suresini ve kalplerin hidayete ermeden sapmaması için dua içeren İmran suresinin sekizinci ayetini okuduğunu işitti. Editör, bu rivayetin Buhari'nin Tarih adlı eserinde Ebu Mus'ab ve İbn Abi Uveys tarafından Malik'ten nakledildiğini, Beyhaki'nin eserinde ise Abdül-Razzak ve Yahya ibn Bukayr tarafından aktarıldığını belirtiyor. {cite:muwatta-maruf-1997 s.129}"
  id: "Diriwayatkan oleh Malik dari Abu Ubayd, budak yang dibebaskan oleh Sulaiman ibn Abd al-Malik, dari Ubadah ibn Nasi, dari Qays ibn al-Harith, dari Abu Abd Allah al-Sunabihi, dalam bab tentang bacaan shalat Maghrib dan Isya: Al-Sunabihi datang ke Madinah pada masa kekhalifahan Abu Bakr al-Siddiq dan shalat Maghrib di belakangnya. Pada dua rakaat pertama, ia membaca Al-Fatihah dan sebuah surah pendek dari Mufassal (bagian terakhir Al-Quran). Kemudian, pada rakaat ketiga, ia berdiri, dan al-Sunabihi mendekat kepadanya hingga pakaiannya hampir menyentuh pakaiannya. Ia mendengar al-Sunabihi membaca Al-Fatihah dan ayat kedelapan Surah Al-Imran, yang berisi doa agar hati tidak tersesat dalam mencari petunjuk. Penyunting menyebutkan bahwa hadits ini diriwayatkan atas otoritas Malik oleh Abu Mus'ab dan Ibn Abi Uways dalam Sejarah al-Bukhari, dan oleh Abd al-Razzaq dan Yahya ibn Bukayr dalam sejarah al-Bayhaqi. {cite:muwatta-maruf-1997 p.129}"
