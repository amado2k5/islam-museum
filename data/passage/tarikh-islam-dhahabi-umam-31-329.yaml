text: "… اليمن من يقرأ ويكتب. قلتُ: وهذا فيه نظرٌ، فإنّ اليمن كان بها خَلّقٌ من أهل الكتاب يكتبون بالقلم بالعِبْرانيّ. إلى أن قال: فجميع كتابات الأمم إثنا عشر كتابة وهي العربيّة، والحِمْيَرِيّة، واليونانيّة، والفارسيّة، والسُّرْيانيّة، والعبرانيّة، والرُّوميّة، والقِبْطيّة، والبربريّة، والأندلُسيّة، والهنديّة، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 31، ص 329، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 31, p. 329, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 31، ص 329 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
