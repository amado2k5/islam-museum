text: |-
  *⁦(نسف )⁩
  لابط الكتيب نجفة الكثيب قال والنحيف من السهام العريض النصل والجمع نجف ومنه
  قول الهذلى
  تجف بذات لها خوا فى ناهض * حشر القوادم كاللفاع الاطحل
  واللفاع اللحاف تة ول منه نحفت السهم وسهم نجيف ومنجوف وغار منجوف أى. وسع ومنه
  قول الشاءر* تأوى الى حدث كالغار منجوف* ونجاف التيس أن يربط قضيبه الى رجله
  أوالى ظهره وذلك اذا أكنر الضراب يمنع بذلك منه تقول منه تدس منجوف وقال أبو
  الغوث بعصب قضيمه فلا يقدر على السفاد واتجاف الشى استخراجه يقال انتحفت اذا
  استخرجت أقصى ما فى الضرع من اللبن وانتجفت الربح السحاب اذا استفرغته ( يف
  النجافة الهزال وقد تحف بالضم فهو نحيف وأنحفه غيره ⁦(ن ف)⁩، ندف القسطن
  ضريه بالمندف وربما استعير فى غيره قال الاعشى
  جالس عنده الندامى قاينت فك يؤتى بمزهر مندوف
  وندفت السماء بالثلج أى رمت به والدابة تندف فى سيرها ندفا وهوسرعة رجع يديها
  والنديف القطن المندوف ⁦(نزف)⁩ نزفت ماء البترنزفا اذانزحته كاه ونزفت هى
  يتعدى ولا يتعسدى ونزفت أيضاعلى مالم يسم "قاءله وحكى الفراء أنزفت البئرأى ذهب
  ماؤها وقال أبو عبيدة نزفت عبرته بالسكسر وأنزفها صاحبها قال الحجياج
  وصرّح ابن معمر لمن دهر • وأنزف العبرة من لاقى العير
  وقال أيضا
  وقدأرانى بالديار-نزفا • أزمان لا أحسب شيأمنزقا
  وقوله تعالى لا يصدعون عنها ولا ينزفون أى لا يسكرون وانتد للابيرد
  لعمرى لثن أنزفتم أوصحوتم • لبئس الندامى كنتم آل أبجرا
  قال وقوم يجعلون المنزف مثل المنزوف الذى قد نزف دمه والنرفسة بالفضم التليل من الما؟
  أو الشراب مثل الغرفة والجمع نزف ويقال نزفه الدم اذا خرج منه دم كثيرحق يضعف فهو
  نزيف ومنزوف وفى المشل أجبن من المنزوف ضرطا والسكران نزيف أيضا اذانزف عقله
  ونزف الرجل فى الخصومة اذا انقطعت يعجته ويقال أنزف القوم اذا انقطع شرابهم وقرئ
  ولا ينزفون بكسر الزاى وأنرف القوم اذا ذهب ماء بئرهسم وانقطع ( سف أيوزيد
  نسفت البناء نسفاقلعته ونف البعير الكلا ينسفه بالكسراذا اقتلعه بأصله وانتسفت
  الشى اقتلعته قال الراجز
  وانتسف الحالب من أندابه * اغباطنا الميس على أصلابه
  والنسيف أثركدم الحار وأثرركض الرحسل بجنبى البعيراذا انحصّ عنه الوبرقال
  الممزق
  وقد تخذت رجلى الى جنب غرزها • نسيفا كاً فوص القطاة المطرّق
  وغول أجذة: فأنق التوم قدتر بوا فضموا • أمام القوم منظتهم تسيف
  حال
