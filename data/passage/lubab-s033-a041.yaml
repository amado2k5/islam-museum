text: "يا أيها الذين آمنوا اذكروا عمة الله عليكم الآية أخرج البيهقي في الدلائل عن حذيفة قال لقد رأيتنا ليلة الأحزاب ونحن صافون قعودا وأبو سفيان ومن معه من الأحزاب فوقنا وقريظة أسفل منا نخافهم على ذرارينا وما أتت قط علينا ليلة أشد ظلمة ولا أشد"
