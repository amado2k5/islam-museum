label: { ar: "الموطأ 2094 — مالك: فيمن كان شركاء في دار واحدة، فباع أحدهم حصته وشركاؤه غيب كلهم إلا رجلا حاضرا، فعرض عليه أن يأخذ بالشفعة أو يترك: لا يأخذ بحصته ويترك حصص شركائه، ولا شفعة له إن عرض عليه فلم يقبله", en: "Muwatta 2094", es: "Muwatta 2094", fr: "Muwatta 2094", ur: "موطا 2094", tr: "El-Muvatta 2094 — Malik: Tek bir evde ortak olan bir kimse hakkında: Ortaklardan biri, diğer ortakların hepsi yokken, sadece bir kişi hazır bulunarak kendi payını sattı ve kendisine öncelikli alım hakkı sunuldu, sunulmadıysa da bu hakkı kullanamaz.", id: "Al-Muwatta 2094 — Malik: Mengenai seseorang yang merupakan mitra dalam satu rumah, dan salah seorang dari mereka menjual bagiannya sementara semua mitranya tidak hadir kecuali satu orang yang ada, dan dia ditawari pilihan untuk membeli terlebih dahulu atau tidak: dia tidak dapat mengambil bagiannya dan meninggalkan bagian mitranya, dan dia tidak memiliki hak untuk membeli terlebih dahulu jika itu ditawarkan kepadanya dan dia tidak menerimanya." }
summary:
  ar: "قال مالك في نفر شركاء في دار واحدة، فباع أحدهم حصته، وشركاؤه غيب كلهم إلا رجلا فعرض على الحاضر أن يأخذ بالشفعة أو يترك، فقال: أنا آخذ بحصتي، وأترك حصص شركائي حتى يقدموا. قال مالك: ليس له إلا أن يأخذ ذلك كله أو يترك، فإن جاء شركاؤه أخذوا منه أو تركوا إن شاءوا. فإذا عرض هذا عليه فلم يقبله، فلا أرى له شفعة. {cite:muwatta-maruf-1997 p.256}"
  tr: "Malik, tek bir evde ortak olan bir grup hakkında şöyle dedi: Ortaklardan biri, diğerlerinin hepsi yokken, sadece bir kişi kalmışken kendi payını sattı. Kalan kişiye, öncelik hakkı seçeneği sunuldu veya payından vazgeçmesi istendi. Adam, \"Ben kendi payımı alacağım ve ortaklarımın paylarını onlar dönene kadar bırakacağım\" diye yanıtladı. Malik, \"Onun başka seçeneği yok, ya hepsini alacak ya da bırakacak. Ortakları gelirse, istedikleri gibi ondan pay alabilir veya bırakabilirler. Eğer bu teklif kendisine yapılmışsa ve kabul etmemişse, öncelik hakkına sahip olduğunu düşünmüyorum.\" dedi. {cite:muwatta-maruf-1997 s.256}"
  id: "Malik berkata mengenai sekelompok mitra dalam satu rumah, salah satu dari mereka menjual bagiannya sementara semua mitranya tidak ada kecuali satu orang. Orang yang hadir ditawari pilihan untuk mengambil bagiannya terlebih dahulu, atau ia akan melepaskan bagiannya. Orang itu menjawab, \"Saya akan mengambil bagian saya dan meninggalkan bagian mitra saya sampai mereka kembali.\" Malik berkata, \"Ia tidak punya pilihan selain mengambil semuanya atau meninggalkannya. Jika mitranya datang, mereka dapat mengambil darinya atau meninggalkannya sesuai keinginan mereka. Jika tawaran ini diberikan kepadanya dan ia tidak menerimanya, maka saya tidak melihat bahwa ia memiliki hak untuk mengambil bagiannya terlebih dahulu.\" {cite:muwatta-maruf-1997 p.256}"
