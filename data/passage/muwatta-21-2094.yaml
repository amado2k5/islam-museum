label: { ar: "الموطأ 2094 — مالك: فيمن كان شركاء في دار واحدة، فباع أحدهم حصته وشركاؤه غيب كلهم إلا رجلا حاضرا، فعرض عليه أن يأخذ بالشفعة أو يترك: لا يأخذ بحصته ويترك حصص شركائه، ولا شفعة له إن عرض عليه فلم يقبله", en: "Muwatta 2094" }
summary:
  ar: "قال مالك في نفر شركاء في دار واحدة، فباع أحدهم حصته، وشركاؤه غيب كلهم إلا رجلا فعرض على الحاضر أن يأخذ بالشفعة أو يترك، فقال: أنا آخذ بحصتي، وأترك حصص شركائي حتى يقدموا. قال مالك: ليس له إلا أن يأخذ ذلك كله أو يترك، فإن جاء شركاؤه أخذوا منه أو تركوا إن شاءوا. فإذا عرض هذا عليه فلم يقبله، فلا أرى له شفعة. {cite:muwatta-maruf-1997 p.256}"
