text: "… لا تنقض بالقبط، وأدخانى معهم، وألزمنى ما لزمهم، وقد اجتمعت. كلتى وكانهم على ما عاهدتك عليه، فهم متمّون، لك على ما تحب ؛ وأما الثانية إن. -ألك الروم بعد اليوم أن تصالحهم فلا تصالحهم حتى تجعلهم فيئا وعبيداً، فإنهم أهل …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 137، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 137, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 137 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
