label: { ar: "مسلم 651 — أثقل صلاة على المنافقين العشاء والفجر", en: "Muslim 651 — The heaviest prayers for the hypocrites", es: "Muslim 651 — Las oraciones más pesadas para los hipócritas", fr: "Muslim 651 — Les prières les plus intenses pour les hypocrites", ur: "مسلم 651 - منافقوں کے لیے سب سے بھاری دعا", tr: "Müslim 651 — Münafıklar için en ağır namazlar yatsı ve sabah namazlarıdır.", id: "Muslim 651 — Shalat yang paling berat bagi orang munafik adalah shalat Isya dan Subuh." }
text: "قال رسول الله: إن أثقل صلاة على المنافقين صلاة العشاء وصلاة الفجر، ولو يعلمون ما فيهما لأتوهما ولو حبواً، ولقد هممت أن آمر بالصلاة فتقام ثم آمر رجلاً فيصلي بالناس ثم أنطلق معي برجال معهم حزم من حطب إلى قوم لا يشهدون الصلاة فأحرق عليهم بيوتهم بالنار"
summary:
  ar: "رواية أبي هريرة في باب فضل صلاة الجماعة من كتاب المساجد في صحيح مسلم؛ ثقل صلاتي العشاء والفجر على المنافقين وما كان النبي همّ به ممن تخلف عنهما."
  tr: "Sahih Müslim'deki Mescitler Kitabı'nda cemaat namazının faziletiyle ilgili bölümde Ebu Hurayra'nın rivayeti; yatsı ve sabah namazlarının münafıklar üzerindeki yükü ve Peygamber'in bu namazlardan geri kalanlara yapmayı planladığı şey."
  id: "Riwayat Abu Hurairah dalam bab tentang keutamaan shalat berjamaah dari Kitab Masjid-Masjid dalam Sahih Muslim; beban shalat Isya dan Subuh bagi orang-orang munafik dan apa yang Nabi maksudkan untuk dilakukan terhadap orang-orang yang tidak melaksanakannya."
