label: { ar: "مسلم 651 — أثقل صلاة على المنافقين العشاء والفجر", en: "Muslim 651 — The heaviest prayers for the hypocrites" }
text: "قال رسول الله: إن أثقل صلاة على المنافقين صلاة العشاء وصلاة الفجر، ولو يعلمون ما فيهما لأتوهما ولو حبواً، ولقد هممت أن آمر بالصلاة فتقام ثم آمر رجلاً فيصلي بالناس ثم أنطلق معي برجال معهم حزم من حطب إلى قوم لا يشهدون الصلاة فأحرق عليهم بيوتهم بالنار"
summary:
  ar: "رواية أبي هريرة في باب فضل صلاة الجماعة من كتاب المساجد في صحيح مسلم؛ ثقل صلاتي العشاء والفجر على المنافقين وما كان النبي همّ به ممن تخلف عنهما."
