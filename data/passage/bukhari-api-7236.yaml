label: { ar: "صحيح البخاري 7236 — الأب والأبوة", en: "Sahih al-Bukhari 7236 — the father and fatherhood", ur: "صحیح بخاری 7236 — باپ اور والدیت", es: "Sahih al-Bukhari 7236 — El padre y la paternidad", fr: "Sahih al-Bukhari 7236 — Le père et la paternité" }
text: "… أَبِي، عَنْ شُعْبَةَ، حَدَّثَنَا أَبُو إِسْحَاقَ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ، قَالَ كَانَ النَّبِيُّ يَنْقُلُ مَعَنَا التُّرَابَ يَوْمَ الأَحْزَابِ، وَلَقَدْ رَأَيْتُهُ وَارَى التُّرَابُ بَيَاضَ بَطْنِهِ يَقُولُ \" لَوْلاَ أَنْتَ مَا اهْتَدَيْنَا نَحْنُ، وَلاَ تَصَدَّقْنَا وَلاَ صَلَّيْنَا، فَأَنْزِلَنْ سَكِينَةً عَلَيْنَا، إِنَّ الأُلَى وَرُبَّمَا قَالَ الْمَلاَ قَدْ بَغَوْا عَلَيْنَا، إِذَا أَرَادُوا فِتْنَةً أَبَيْنَا \" أَبَيْنَا يَرْفَعُ بِهَا صَوْتَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7236، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7236 (Wishes), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7236، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7236 (Deseos), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7236 (Souhaits), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
