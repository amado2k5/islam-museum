text: "… الوجوب، وكره مالك الصيد الذي يقصد به السرف، وللمتأخرين من أصحابه فيه تفصيل، محصول قولهم فيه: إن منه ما هو في حق بعض الناس واجب، وفي حق بعضهم حرام، وفي حق بعضهم مندوب، وفي حق عضهم مكروه؛ وهذا النظر في …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 502، يرد فيه ذكر الواجب، والوجوب، والمندوب، والمكروه، وما كرهه الفقهاء، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 502, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), the disliked (makruh), what the jurists disliked, the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 502 کا اقتباس جس میں واجب، وجوب، مندوب، مکروہ، جسے فقہاء نے مکروہ کہا، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 502, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mandub), le réprouvé (makruh), ce que les juristes ont réprouvé, l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 502, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mandub), lo reprobado (makruh), lo que los juristas reprobaron, lo prohibido (haram); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
