label: { ar: "سنن أبي داود 5224 — مزاح ودعابة", en: "Sunan Abi Dawud 5224 — jesting and playfulness", ur: "سنن ابی داؤد 5224 — مزاح اور خوش طبعی", fr: "Sunan Abi Dawud 5224 — plaisanterie et badinage", es: "Sunan Abi Dawud 5224 — broma y jovialidad" }
text: "… عَوْنٍ، أَخْبَرَنَا خَالِدٌ، عَنْ حُصَيْنٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ أُسَيْدِ بْنِ حُضَيْرٍ، - رَجُلٍ مِنَ الأَنْصَارِ - قَالَ بَيْنَمَا هُوَ يُحَدِّثُ الْقَوْمَ وَكَانَ فِيهِ مِزَاحٌ بَيْنَا يُضْحِكُهُمْ فَطَعَنَهُ النَّبِيُّ فِي خَاصِرَتِهِ بِعُودٍ فَقَالَ أَصْبِرْنِي. فَقَالَ اصْطَبِرْ . قَالَ إِنَّ عَلَيْكَ قَمِيصًا وَلَيْسَ عَلَىَّ قَمِيصٌ. فَرَفَعَ النَّبِيُّ عَنْ قَمِيصِهِ فَاحْتَضَنَهُ وَجَعَلَ يُقَبِّلُ كَشْحَهُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5224، فيه مزاح ودعابة. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Abi Dawud, no. 5224, with jesting and playfulness. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابی داؤد کی حدیث نمبر 5224، جس میں مزاح اور خوش طبعی ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Abi Dawud, n° 5224, avec plaisanterie et badinage. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Abi Dawud, n.º 5224, con broma y jovialidad. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
