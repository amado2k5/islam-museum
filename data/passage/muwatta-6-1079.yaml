text: "لا يصدرن أحد من الحاج حتى يطوف بالبيت، فإن آخر النسك الطواف بالبيت"
summary:
  ar: "أول حديث في باب وداع البيت. يرويه مالك عن نافع عن عبد الله بن عمر، أن عمر بن الخطاب قال: لا يصدرن أحد من الحاج حتى يطوف بالبيت، فإن آخر النسك الطواف بالبيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1442) والشافعي (131) والشيباني (517) ويحيى بن بكير عند البيهقي (5/161). {cite:muwatta-maruf-1997 p.496}"
