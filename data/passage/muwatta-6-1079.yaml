label: { ar: "الموطأ 1079 — ابن عمر: قال عمر بن الخطاب: لا يصدرن أحد من الحاج حتى يطوف بالبيت، فإن آخر النسك الطواف بالبيت", en: "Muwatta 1079", es: "Muwatta 1079", fr: "Muwatta 1079", ur: "موطا 1079", tr: "El-Muvatta 1079 — İbn Ömer: Ömer ibn el-Hattab şöyle dedi: Hiç kimse Kâbe'yi tavaf etmeden hacdan ayrılmamalıdır, çünkü Kâbe'yi tavaf etmek ibadetin sonuncusudur.", id: "Al-Muwatta 1079 — Ibn Umar: Umar ibn al-Khattab berkata: Tidak seorang pun boleh meninggalkan ibadah haji sebelum ia melakukan tawaf mengelilingi Ka'bah, karena ritual terakhir adalah tawaf mengelilingi Ka'bah." }
text: "لا يصدرن أحد من الحاج حتى يطوف بالبيت، فإن آخر النسك الطواف بالبيت"
summary:
  ar: "أول حديث في باب وداع البيت. يرويه مالك عن نافع عن عبد الله بن عمر، أن عمر بن الخطاب قال: لا يصدرن أحد من الحاج حتى يطوف بالبيت، فإن آخر النسك الطواف بالبيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1442) والشافعي (131) والشيباني (517) ويحيى بن بكير عند البيهقي (5/161). {cite:muwatta-maruf-1997 p.496}"
  tr: "Kabe'ye veda bölümündeki ilk hadis. Malik'in Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Ömer ibn el-Hattab şöyle buyurmuştur: \"Kim Kabe'yi tavaf etmeden Hac'dan ayrılmamalıdır, çünkü ibadetlerin sonuncusu Kabe'yi tavaf etmektir.\" Editör, bu hadisin Malik'ten Ebu Mus'ab (1442), Şafiî (131), Şeybani (517) ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Beyhaki'nin (5/161) de kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.496}"
  id: "Hadits pertama dalam bab tentang mengucapkan selamat tinggal kepada Ka'bah. Diriwayatkan oleh Malik dari Nafi' dari Abdullah ibn Umar, bahwa Umar ibn al-Khattab berkata: “Tidak seorang pun boleh meninggalkan ibadah haji sebelum ia melakukan tawaf di Ka'bah, karena ritual terakhir adalah tawaf di Ka'bah.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1442), al-Shafi'i (131), al-Shaybani (517), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (5/161). {cite:muwatta-maruf-1997 p.496}"
