label: { ar: "الموطأ 46 — أبو قتادة والهرة: إنها ليست بنجس", en: "Muwatta 46", es: "Muwatta 46", fr: "Muwatta 46", ur: "موطا 46", tr: "El-Muvatta 46 — Ebu Katada ve kedi: O, kirli değildir", id: "Al-Muwatta 46 — Abu Qatada dan kucing: Ia tidak najis" }
text: "إنها ليست بنجس، إنما هي من الطوافين عليكم أو الطوافات"
summary:
  ar: "يرويه مالك عن إسحاق بن عبد الله بن أبي طلحة عن حميدة عن خالتها كبشة بنت كعب بن مالك، وكانت زوجة ابن أبي قتادة الأنصاري، في باب الطهور للوضوء: دخل عليها أبو قتادة فصبّت له ماء الوضوء، فجاءت هرة لتشرب منه فأمال لها الإناء حتى شربت، فلما رآها تنظر إليه متعجبة أخبرها أن النبي قال إن الهرة ليست بنجس وإنما هي من الطوافين على الناس. ويقول مالك إنه لا بأس بسؤرها إلا أن تُرى على فمها نجاسة. ويذكر المحقق أن يحيى سمى الراوية «حميدة بنت أبي عبيدة بن فروة» وأن ذلك وهم خالفه فيه سائر رواة الموطأ فقالوا حميدة بنت عبيد بن رفاعة ⁦(التمهيد 1/318)⁩، ويخرّج الحديث عند أبي داود (75) والترمذي (92) والنسائي وابن ماجه (367) وابن خزيمة وابن حبان والحاكم، وينقل عن الدارقطني أن رفعه صحيح وأن أحسن أسانيده رواية مالك هذه التي حفظت أسماء النسوة وأنسابهن. أبو قتادة هنا هو الصحابي الأنصاري الحارث بن ربعي. {cite:muwatta-maruf-1997 p.56} {cite:muwatta-maruf-1997 p.57}"
  tr: "Malik, abdest alma bölümünde, İshak ibn Abdullah ibn Abi Talha'dan, o da Humayda'dan, o da Humayda'nın teyzesi Kabşa bint Ka'b ibn Malik'ten (İbn Abi Katade el-Ensari'nin karısı) rivayetle şöyle anlatmıştır: Ebu Katade onun yanına girdi ve Humayda ona abdest alması için su doldurdu. Bir kedi gelip sudan içmeye başladı, bu yüzden Ebu Katade kabı kedi için eğdi ve kedi içti. Kedinin şaşkınlıkla kendisine baktığını görünce, Peygamberimizin kedinin pis olmadığını, aksine insanlar arasında sık sık gelip gidenlerden olduğunu söylediğini aktardı. Malik, kedinin ağzında pislik görülmedikçe, kedinin artan suyundan içmenin sakıncası olmadığını söyledi. Araştırmacı, Yahya'nın ravîyi \"Hamida bint Abi Ubaida ibn Farwa\" olarak adlandırdığını ve bunun bir hata olduğunu, zira Muwatta'nın diğer tüm ravîlerinin onunla aynı fikirde olmadığını ve ravînin Hamida bint Ubaid ibn Rifa'a olduğunu söylediğini belirtiyor (el-Tamhid 1/318). Hadisi Ebu Davud (75), Tirmizi (92), Nesai, İbn Majah (367), İbn Huzeyme, İbn Hibban ve Hakim'in hadis derlemelerinde zikrediyor. El-Daraqutni'nin, hadisin isnadının sahih olduğunu ve en iyi isnadın, kadınların isimlerini ve soylarını koruyan Malik'in bu rivayeti olduğunu söylediğini aktarıyor. Buradaki Ebu Katada, Ensari Sahabesi el-Harith ibn Rib'i'dir. {cite:muwatta-maruf-1997 s.56} {cite:muwatta-maruf-1997 s.57}"
  id: "Malik meriwayatkannya dari Ishaq ibn Abdullah ibn Abi Talha, dari Humayda, dari bibinya dari pihak ibu, Kabsha bint Ka'b ibn Malik, yang merupakan istri Ibn Abi Qatada al-Ansari, dalam surah tentang penyucian untuk wudhu: Abu Qatada masuk menemuinya, dan dia menuangkan air untuknya berwudhu. Seekor kucing datang untuk minum dari air itu, maka dia memiringkan wadah itu agar kucing itu minum. Ketika dia melihat kucing itu menatapnya dengan heran, dia memberitahunya bahwa Nabi bersabda bahwa kucing tidaklah najis, melainkan termasuk hewan yang sering datang dan pergi di antara manusia. Malik berkata bahwa tidak ada salahnya minum air sisa kucing kecuali jika terlihat najis di mulutnya. Peneliti mencatat bahwa Yahya menyebut perawi tersebut sebagai \"Hamida bint Abi Ubaida ibn Farwa,\" dan bahwa ini adalah kesalahan, karena semua perawi Muwatta' lainnya tidak setuju dengannya, mengatakan bahwa itu adalah Hamida bint Ubaid ibn Rifa'a (al-Tamhid 1/318). Ia mengutip hadits tersebut dalam kumpulan Abu Dawud (75), al-Tirmidhi (92), al-Nasa'i, Ibn Majah (367), Ibn Khuzaymah, Ibn Hibban, dan al-Hakim. Ia mengutip al-Daraqutni yang mengatakan bahwa sanadnya sahih dan sanad terbaiknya adalah riwayat Malik ini, yang mempertahankan nama dan garis keturunan perempuan. Abu Qatada di sini adalah Sahabat Ansar al-Harith ibn Rib'i. {kutip:muwatta-maruf-1997 hal.56} {kutip:muwatta-maruf-1997 hal.57}"
