ref: "1.46"
label: { ar: "الموطأ 46 — أبو قتادة والهرة: إنها ليست بنجس", en: "Muwatta 46" }
text: "إنها ليست بنجس، إنما هي من الطوافين عليكم أو الطوافات"
summary:
  ar: "يرويه مالك عن إسحاق بن عبد الله بن أبي طلحة عن حميدة عن خالتها كبشة بنت كعب بن مالك، وكانت زوجة ابن أبي قتادة الأنصاري، في باب الطهور للوضوء: دخل عليها أبو قتادة فصبّت له ماء الوضوء، فجاءت هرة لتشرب منه فأمال لها الإناء حتى شربت، فلما رآها تنظر إليه متعجبة أخبرها أن النبي قال إن الهرة ليست بنجس وإنما هي من الطوافين على الناس. ويقول مالك إنه لا بأس بسؤرها إلا أن تُرى على فمها نجاسة. ويذكر المحقق أن يحيى سمى الراوية «حميدة بنت أبي عبيدة بن فروة» وأن ذلك وهم خالفه فيه سائر رواة الموطأ فقالوا حميدة بنت عبيد بن رفاعة (التمهيد 1/318)، ويخرّج الحديث عند أبي داود (75) والترمذي (92) والنسائي وابن ماجه (367) وابن خزيمة وابن حبان والحاكم، وينقل عن الدارقطني أن رفعه صحيح وأن أحسن أسانيده رواية مالك هذه التي حفظت أسماء النسوة وأنسابهن. أبو قتادة هنا هو الصحابي الأنصاري الحارث بن ربعي. {cite:muwatta-maruf-1997 p.56} {cite:muwatta-maruf-1997 p.57}"
