label: { ar: "سنن ابن ماجه 4332 — ضحك وتبسم", en: "Sunan Ibn Majah 4332 — laughter and smiling", ur: "سنن ابن ماجہ 4332 — ہنسی اور تبسم", fr: "Sunan Ibn Majah 4332 — rire et sourire", es: "Sunan Ibn Majah 4332 — risa y sonrisa", tr: "Sünen İbn Mace 4332 — Kahkaha ve Gülümseme", id: "Sunan Ibnu Majah 4332 — Tertawa dan Tersenyum" }
text: "حَدَّثَنَا الْعَبَّاسُ بْنُ عُثْمَانَ الدِّمَشْقِيُّ، حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، حَدَّثَنَا مُحَمَّدُ بْنُ مُهَاجِرٍ الأَنْصَارِيُّ، حَدَّثَنِي الضَّحَّاكُ الْمَعَافِرِيُّ، عَنْ سُلَيْمَانَ بْنِ مُوسَى، عَنْ كُرَيْبٍ، - مَوْلَى ابْنِ عَبَّاسٍ - قَالَ حَدَّثَنِي أُسَامَةُ بْنُ زَيْدٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ ذَاتَ يَوْمٍ لأَصْحَابِهِ أَلاَ مُشَمِّرٌ لِلْجَنَّةِ فَإِنَّ الْجَنَّةَ لاَ خَطَرَ لَهَا هِيَ وَرَبِّ الْكَعْبَةِ نُورٌ يَتَلأْلأُ وَرَيْحَانَةٌ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4332، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Ibn Majah, no. 4332, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4332، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Ibn Majah, n° 4332, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Ibn Majah, n.º 4332, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "İbn Majah'ın Sünen'inde yer alan 4332 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 4332, berisi tentang tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
