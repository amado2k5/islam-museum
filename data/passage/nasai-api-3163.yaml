text: "… شُرَيْحٍ، عَنْ عَبْدِ اللَّهِ بْنِ ثَعْلَبَةَ الْحَضْرَمِيِّ، أَنَّهُ سَمِعَ ابْنَ حُجَيْرَةَ، يُخْبِرُ عَنْ عُقْبَةَ بْنِ عَامِرٍ، أَنَّ رَسُولَ اللَّهِ قَالَ \" خَمْسٌ مَنْ قُبِضَ فِي شَىْءٍ مِنْهُنَّ فَهُوَ شَهِيدٌ الْمَقْتُولُ فِي سَبِيلِ اللَّهِ شَهِيدٌ وَالْغَرِقُ فِي سَبِيلِ اللَّهِ شَهِيدٌ وَالْمَبْطُونُ فِي سَبِيلِ اللَّهِ شَهِيدٌ وَالْمَطْعُونُ فِي سَبِيلِ اللَّهِ شَهِيدٌ وَالنُّفَسَاءُ فِي سَبِيلِ اللَّهِ شَهِيدٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3163، يذكر الطاعون والوباء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 3163 (The Book of Jihad), that mentions plague and epidemic. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 3163، جس میں طاعون اور وبا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
