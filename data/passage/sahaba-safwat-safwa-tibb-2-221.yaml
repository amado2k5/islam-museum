text: "… له نعالجك ؟ فقال لهم يا قوم اعلموا ان لى طبيبا ان سألته داوى كل عليل لكنى الا لا اسأله ان يدأوينى فقيل له ولم ذاك وانت تحتاج الى الدواء ؟ فعال اخشى ان برأت من هذه العلة طغيت فقيل …"
