label: { ar: "صحيح البخاري 2106 — الأب والأبوة", en: "Sahih al-Bukhari 2106 — the father and fatherhood", ur: "صحیح بخاری 2106 — باپ اور والدیت", es: "Sahih al-Bukhari 2106 — El padre y la paternidad" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسٍ ـ قَالَ قَالَ النَّبِيُّ \" يَا بَنِي النَّجَّارِ ثَامِنُونِي بِحَائِطِكُمْ \". وَفِيهِ خِرَبٌ وَنَخْلٌ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2106، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2106 (Sales and Trade), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2106، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2106 (Ventas y Comercio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
