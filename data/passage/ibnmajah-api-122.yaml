label: { ar: "سنن ابن ماجه 122 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Ibn Majah 122 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابن ماجہ 122 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Ibn Majah 122 — menciones de naciones, religiones y pueblos no musulmanes.", fr: "Sunan Ibn Majah 122 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا وَكِيعٌ، حَدَّثَنَا سُفْيَانُ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ يَوْمَ قُرَيْظَةَ \" مَنْ يَأْتِينَا بِخَبَرِ الْقَوْمِ \". فَقَالَ الزُّبَيْرُ أَنَا. فَقَالَ \" مَنْ يَأْتِينَا بِخَبَرِ الْقَوْمِ \". قَالَ الزُّبَيْرُ أَنَا. ثَلاَثًا فَقَالَ النَّبِيُّ ـ \" لِكُلِّ نَبِيٍّ حَوَارِيٌّ وَإِنَّ حَوَارِيَّ الزُّبَيْرُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 122، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 122 (The Book of the Sunnah), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 122، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan Ibn Majah, n.º 122 (El Libro de la Sunnah), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Ibn Majah, n° 122 (Le Livre de la Sunna), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
