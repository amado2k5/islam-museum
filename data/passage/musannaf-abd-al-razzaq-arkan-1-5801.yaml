text: "… إسحاق عن العيزار أَنَّ ابن عباس أَتاه الأَعراب فقالوا : إنَّا نقيم الصلاة، وذولي الزكاة، ونحج البيت، ونصوم رمضان، وإن ناساً من المهاجرين يقولون : لسنا على شيءٍ، فقال ابن عباس : من أَقام الصلاة، وآتى الزكاة، وحج البيت، وصام …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 5801، يذكر الصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 5801, that mentions the prayer, the zakat, the fast and the pilgrimage named together; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 5801 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
