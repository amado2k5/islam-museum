  fr: "Extrait du Musannaf d'Abd al-Razzaq (tome 1, p. 5801) mentionnant la prière, la zakat, le jeûne et le pèlerinage. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "Musannaf Abd al-Razzaq'ın Resimli Cilt 1, sayfa 5801'deki bir alıntısında namaz, zekât, oruç ve Hac birlikte anılmaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 5801, menyebutkan salat, zakat, puasa, dan haji secara bersamaan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
