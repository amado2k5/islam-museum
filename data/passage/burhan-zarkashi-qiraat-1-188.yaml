label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 188 — الأحرف السبعة، جمع القرآن والمصاحف", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 188 — the seven ahruf; the collection of the Qur'an and the codices", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 188 — سبعہ احرف، جمعِ قرآن اور مصاحف", es: "Al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, escaneo del volumen 1, pág. 188: los siete ahruf; la colección del Corán y los códices." }
text: "… مع المؤمنين، وذلك رعاية لحال المخاطبين وتلبية لحاجات مجتمعهم الجديد وعدم مفاجأتهم بتشريع جديد. ويتحدث عن جمع القرآن وحفظه فى عهد الصحابة والخلفاء الراشدين ودور عثمان فى نسخ المصاحف وتطور المصحف العثمانى والأحرف السبعة. وعن أسباب النزول يشير إلى خطأ …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 188، يذكر الأحرف السبعة، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 188, that mentions the seven ahruf, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 188 کا اقتباس جس میں سبعہ احرف، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, volumen 1, pág. 188, que menciona los siete ahruf, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
