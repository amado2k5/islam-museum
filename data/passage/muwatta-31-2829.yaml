label: { ar: "الموطأ 2829 — ابن مسعود: عليكم بالصدق فإنه يهدي إلى البر والبر إلى الجنة", en: "Muwatta 2829" }
summary:
  ar: "بلغ مالكا أن عبد الله بن مسعود كان يقول: عليكم بالصدق، فإن الصدق يهدي إلى البر، والبر يهدي إلى الجنة. وإياكم والكذب، فإن الكذب يهدي إلى الفجور، والفجور يهدي إلى النار. ويذكر المحقق أن الشيخين أخرجا معناه مرفوعا من حديث أبي وائل شقيق بن سلمة عن ابن مسعود. {cite:muwatta-maruf-1997 p.588}"
