label: { ar: "الموطأ 2829 — ابن مسعود: عليكم بالصدق فإنه يهدي إلى البر والبر إلى الجنة", en: "Muwatta 2829", es: "Muwatta 2829", fr: "Muwatta 2829", ur: "موطا 2829", tr: "İbn Mes'ud, El-Muvatta 2829: Doğruyu söylemelisiniz, çünkü doğruluk takvaya, takva da cennete götürür.", id: "Al-Muwatta 2829 — Ibnu Mas'ud: Kamu harus jujur, karena kejujuran mengarah kepada kebaikan, dan kebaikan mengarah kepada surga." }
summary:
  ar: "بلغ مالكا أن عبد الله بن مسعود كان يقول: عليكم بالصدق، فإن الصدق يهدي إلى البر، والبر يهدي إلى الجنة. وإياكم والكذب، فإن الكذب يهدي إلى الفجور، والفجور يهدي إلى النار. ويذكر المحقق أن الشيخين أخرجا معناه مرفوعا من حديث أبي وائل شقيق بن سلمة عن ابن مسعود. {cite:muwatta-maruf-1997 p.588}"
  tr: "Malik, Abdullah ibn Mes'ud'un şöyle dediğini rivayet etmiştir: \"Doğruluktan sakının, çünkü doğruluk iyiliğe, iyilik de cennete götürür. Yalan söylemekten sakının, çünkü yalan kötülüğe, kötülük de cehenneme götürür.\" Araştırmacı, iki şeyhin (Buhari ve Müslim) de benzer bir hadisi, İbn Mes'ud'dan rivayetle Ebu Veil Şakik ibn Seleme'den Peygamberimize kadar uzanan bir isnad zinciriyle birlikte aktardığını belirtmektedir. {cite:muwatta-maruf-1997 s.588}"
  id: "Malik meriwayatkan bahwa Abdullah ibn Mas'ud biasa berkata: \"Berpegang teguhlah pada kejujuran, karena kejujuran mengarah pada kebaikan, dan kebaikan mengarah pada surga. Dan waspadalah terhadap dusta, karena dusta mengarah pada kejahatan, dan kejahatan mengarah pada neraka.\" Peneliti menyebutkan bahwa kedua Syekh (Al-Bukhari dan Muslim) memasukkan hadits serupa dengan sanad yang kembali kepada Nabi (shalawat dan salam kepadanya) dari Abu Wa'il Shaqiq ibn Salamah, berdasarkan riwayat Ibn Mas'ud. {cite:muwatta-maruf-1997 p.588}"
