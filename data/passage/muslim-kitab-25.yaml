label:
  ar: "صحيح مسلم، كتاب الوصية"
  en: "Sahih Muslim, Book 25: The Book of Wills"
  ur: "صحیح مسلم، کتاب الوصیۃ"
  es: "Sahih Muslim, Libro 25: El Libro de los Testamentos"
  fr: "Sahih Muslim, Livre 25: Le Livre des Testaments"
summary:
  ar: "القسم 25 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوصية»، ويضم فيها النصوص من 4204 إلى 4234 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 25 of Sahih Muslim (The Book of Wills) in the division of the open hadith dataset the museum took its reports from: reports 4204 to 4234 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 25، عنوان «کتاب الوصیۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4204 تا 4234۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 25 del Sahih Muslim (El Libro de los Testamentos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4204 al 4234 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre des Testaments), volume 25, qui correspond aux hadiths 4204 à 4234 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
