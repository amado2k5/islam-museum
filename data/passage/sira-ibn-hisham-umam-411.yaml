text: "… قريش يوم أحد وتسمية قاتليهم: قال ابن إسحاق: وقُتِلَ مِنَ المشركين يَوْمَ أُحُدٍ: مِنَ قُرَيْشٍ، ثم مِنْ بني عبد الدار بن قُصَيِّ من أصحاب اللواء: طلحةُ. بن أبي طلحة، واسم أبي طلحة : عَبْدُالله بن عبد العُزَّى بن عثمان بن …"
