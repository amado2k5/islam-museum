label: { ar: "الموطأ 1007 — زيد بن أسلم: عطاء بن يسار أخبره عن أبي قتادة في الحمار الوحشي مثل حديث أبي النضر، إلا أن رسول الله قال: هل معكم من لحمه شيء؟", en: "Muwatta 1007", es: "Muwatta 1007", fr: "Muwatta 1007", ur: "موطا 1007", tr: "El-Muvatta 1007 — Zeyd ibn Aslam: Ata' ibn Yasar, Ebu Katade'den rivayetle, Ebu el-Nadr'ın hadisine benzer şekilde, yaban eşeği hakkında ona şöyle anlattı: \"Onun etinden var mı sizde?\"", id: "Al-Muwatta 1007 — Zayd ibn Aslam: Ata’ ibn Yasar memberitahunya dari Abu Qatada tentang keledai liar, mirip dengan hadits Abu al-Nadr, kecuali bahwa Rasulullah SAW bersabda: Apakah kamu memiliki dagingnya?" }
text: "هل معكم من لحمه شيء؟"
summary:
  ar: "يرويه مالك عن زيد بن أسلم أن عطاء بن يسار أخبره عن أبي قتادة في الحمار الوحشي مثل حديث أبي النضر، إلا أن في حديث زيد بن أسلم أن رسول الله قال: هل معكم من لحمه شيء؟ ويذكر المحقق أنه رواه عن مالك أبو مصعب (1137) وإسماعيل بن أبي أويس عند البخاري (5490) وسويد وغيرهم. {cite:muwatta-maruf-1997 p.471} {cite:muwatta-maruf-1997 p.472}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Ata ibn Yasar'ın kendisine Ebu Katade'den yaban eşeği hakkında bilgi verdiğini, bunun Ebu el-Nadr hadisine benzediğini, ancak Zeyd ibn Aslam'ın hadisinde Allah Resulü'nün \"Etinden var mı?\" diye buyurduğunu aktarmıştır. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab (1137), İsmail ibn Ebu Uveys, Buhari (5490), Suveyd ve diğerleri tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.471} {cite:muwatta-maruf-1997 s.472}"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, yang mengatakan bahwa Ata ibn Yasar memberitahukannya dari Abu Qatada tentang keledai liar, mirip dengan hadits Abu al-Nadr, kecuali bahwa dalam hadits Zayd ibn Aslam, Rasulullah SAW bersabda: \"Apakah kamu memiliki dagingnya?\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1137), Isma'il ibn Abi Uways, al-Bukhari (5490), Suwayd, dan lainnya. {cite:muwatta-maruf-1997 p.471} {cite:muwatta-maruf-1997 p.472}"
