text: "هل معكم من لحمه شيء؟"
summary:
  ar: "يرويه مالك عن زيد بن أسلم أن عطاء بن يسار أخبره عن أبي قتادة في الحمار الوحشي مثل حديث أبي النضر، إلا أن في حديث زيد بن أسلم أن رسول الله قال: هل معكم من لحمه شيء؟ ويذكر المحقق أنه رواه عن مالك أبو مصعب (1137) وإسماعيل بن أبي أويس عند البخاري (5490) وسويد وغيرهم. {cite:muwatta-maruf-1997 p.471} {cite:muwatta-maruf-1997 p.472}"
