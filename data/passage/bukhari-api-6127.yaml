text: "حَدَّثَنَا أَبُو النُّعْمَانِ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنِ الأَزْرَقِ بْنِ قَيْسٍ، قَالَ كُنَّا عَلَى شَاطِئِ نَهْرٍ بِالأَهْوَازِ قَدْ نَضَبَ عَنْهُ الْمَاءُ، فَجَاءَ أَبُو بَرْزَةَ الأَسْلَمِيُّ عَلَى فَرَسٍ، فَصَلَّى وَخَلَّى فَرَسَهُ، فَانْطَلَقَتِ الْفَرَسُ، فَتَرَكَ صَلاَتَهُ وَتَبِعَهَا حَتَّى أَدْرَكَهَا، فَأَخَذَهَا ثُمَّ جَاءَ فَقَضَى صَلاَتَهُ، وَفِينَا رَجُلٌ لَهُ رَأْىٌ، فَأَقْبَلَ يَقُولُ انْظُرُوا إِلَى هَذَا الشَّيْخِ تَرَكَ صَلاَتَهُ مِنْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6127، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6127 (Good Manners and Form (Al-Adab)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 6127، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
