label: { ar: "الموطأ 508 — ابن عباس يصف صلاة الكسوف: رأيت الجنة فتناولت عنقوداً، ورأيت النار", en: "Muwatta 508" }
text: "إني رأيت الجنة فتناولت منها عنقوداً، ولو أخذته لأكلتم منه ما بقيت الدنيا، ورأيت النار فلم أر كاليوم منظراً قط"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله بن عباس، في باب العمل في صلاة كسوف الشمس: خسفت الشمس فصلى النبي والناس معه، فقام قياماً طويلاً نحواً من سورة البقرة ثم ركع ركوعاً طويلاً ثم قام دون الأول ثم ركع دون الأول ثم سجد، ثم فعل في الركعة الثانية مثل ذلك، ثم انصرف وقد تجلت الشمس فقال إن الشمس والقمر آيتان من آيات الله لا يخسفان لموت أحد ولا لحياته، فإذا رأيتم ذلك فاذكروا الله. وسألوه عما رأوه يتناوله ثم يتكعكع، فقال إنه رأى الجنة فتناول منها عنقوداً، ولو أخذه لأكلوا منه ما بقيت الدنيا، ورأى النار فلم ير كاليوم منظراً قط، ورأى أكثر أهلها النساء لكفرهن، لا كفراً بالله بل كفران العشير والإحسان. ويخرّجه المحقق عند البخاري (29، 431، 748، 1052، 3202، 5197) ومسلم (3/34) وأبي داود (1189) والنسائي (3/146) وأحمد وابن حبان وابن خزيمة والشافعي والدارمي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (3/301)؛ ويبين أن لفظة «أفظع» في المطبوع لا أصل لها في النسخ. {cite:muwatta-maruf-1997 p.261} {cite:muwatta-maruf-1997 p.262}"
