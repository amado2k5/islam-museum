label: { ar: "الموطأ 508 — ابن عباس يصف صلاة الكسوف: رأيت الجنة فتناولت عنقوداً، ورأيت النار", en: "Muwatta 508", es: "Muwatta 508", fr: "Muwatta 508", ur: "موطا 508", tr: "İbn Abbas, Muvatta 508'de tutulma namazını şöyle anlatıyor: Cenneti gördüm ve bir salkım üzüm aldım, cehennemi de gördüm.", id: "Al-Muwatta 508 — Ibnu Abbas menggambarkan salat saat gerhana: Aku melihat Surga dan mengambil seikat anggur, dan aku melihat Neraka" }
text: "إني رأيت الجنة فتناولت منها عنقوداً، ولو أخذته لأكلتم منه ما بقيت الدنيا، ورأيت النار فلم أر كاليوم منظراً قط"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله بن عباس، في باب العمل في صلاة كسوف الشمس: خسفت الشمس فصلى النبي والناس معه، فقام قياماً طويلاً نحواً من سورة البقرة ثم ركع ركوعاً طويلاً ثم قام دون الأول ثم ركع دون الأول ثم سجد، ثم فعل في الركعة الثانية مثل ذلك، ثم انصرف وقد تجلت الشمس فقال إن الشمس والقمر آيتان من آيات الله لا يخسفان لموت أحد ولا لحياته، فإذا رأيتم ذلك فاذكروا الله. وسألوه عما رأوه يتناوله ثم يتكعكع، فقال إنه رأى الجنة فتناول منها عنقوداً، ولو أخذه لأكلوا منه ما بقيت الدنيا، ورأى النار فلم ير كاليوم منظراً قط، ورأى أكثر أهلها النساء لكفرهن، لا كفراً بالله بل كفران العشير والإحسان. ويخرّجه المحقق عند البخاري ⁦(29، 431، 748، 1052، 3202، 5197)⁩ ومسلم (3/34) وأبي داود (1189) والنسائي (3/146) وأحمد وابن حبان وابن خزيمة والشافعي والدارمي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (3/301)؛ ويبين أن لفظة «أفظع» في المطبوع لا أصل لها في النسخ. {cite:muwatta-maruf-1997 p.261} {cite:muwatta-maruf-1997 p.262}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan, o da Abdullah ibn Abbas'tan rivayet ederek, güneş tutulması namazı sırasındaki amelleri anlatan bölümde şöyle anlatmıştır: Güneş tutuldu, bunun üzerine Peygamber ve cemaat onunla birlikte namaz kıldılar. Uzun bir süre, yaklaşık Bakara Suresi uzunluğunda ayakta durdu, sonra uzun bir süre rükû etti, sonra ilkinden daha kısa bir süre ayakta durdu, sonra ilkinden daha kısa bir süre rükû etti, sonra secde etti. İkinci rekatta da aynı şekilde devam etti, sonra namazı bitirdi ve güneş tekrar ortaya çıktı. Peygamber, \"Güneş ve ay, Allah'ın işaretlerinden ikisidir. Bunlar kimsenin ölümü veya yaşamı için tutulmazlar. Öyleyse bunları gördüğünüzde Allah'ı hatırlayın.\" dedi. Cemaat ona, uzanıp da tökezlediği şeyin ne olduğunu sordu. \"Cenneti gördüm ve oradan bir salkım üzüm almak için uzandım. Eğer onu alsaydım, dünya var olduğu sürece ondan yerlerdi. Cehennemi gördüm ve hayatımda böyle bir manzara görmemiştim. Gördüm ki, sakinlerinin çoğu kadındı; bunun sebebi Allah'a inanmamaları değil, kocalarına ve iyiliğe karşı nankörlükleriydi.\" Araştırmacı bunu Buhari (29, 431, 748, 1052, 3202, 5197), Müslim (3/34), Ebu Davud (1189), Nesai (3/146), Ahmed, İbn Hibban, İbn Huzeyme, Şafiî, Darimi ve Beyhaki'de, Malik'in takipçilerinin rivayet zincirleri aracılığıyla aktarıyor ve Temhid'e (3/301) atıfta bulunuyor. ve basılı baskıdaki \"daha korkunç\" kelimesinin el yazmalarında hiçbir dayanağı olmadığını açıklığa kavuşturmaktadır. {cite:muwatta-maruf-1997 s.261} {cite:muwatta-maruf-1997 s.262}"
  id: "Malik meriwayatkannya dari Zaid bin Aslam, dari Ata bin Yasar, dari Abdullah bin Abbas, dalam surah tentang amalan saat salat gerhana: Matahari mengalami gerhana, lalu Nabi dan orang-orang melaksanakan salat bersamanya. Beliau berdiri cukup lama, kira-kira selama Surah Al-Baqarah, kemudian rukuk cukup lama, lalu berdiri lebih singkat dari sebelumnya, rukuk lebih singkat lagi, lalu sujud. Beliau melakukan hal yang sama pada rakaat kedua, kemudian selesai, dan matahari telah muncul kembali. Beliau bersabda, \"Matahari dan bulan adalah dua tanda dari tanda-tanda Allah. Gerhana keduanya tidak terjadi untuk kematian atau kehidupan siapa pun. Maka ketika kalian melihat itu, ingatlah Allah.\" Mereka bertanya kepadanya tentang apa yang mereka lihat beliau raih dan kemudian tersandung. Dia berkata, \"Aku melihat Surga dan aku meraih seikat anggur darinya. Jika aku mengambilnya, mereka akan memakannya selama dunia masih ada. Aku melihat Neraka dan aku belum pernah melihat pemandangan seperti itu. Aku melihat bahwa sebagian besar penghuninya adalah perempuan karena ketidakbersyukuran mereka, bukan karena kekafiran kepada Allah, tetapi ketidakbersyukuran kepada suami dan kebaikan mereka.\" Peneliti mengutipnya dalam al-Bukhari (29, 431, 748, 1052, 3202, 5197), Muslim (3/34), Abu Dawud (1189), al-Nasa'i (3/146), Ahmad, Ibn Hibban, Ibn Khuzaymah, al-Shafi'i, al-Darimi, dan al-Bayhaqi melalui sanad pengikut Malik, dan merujuk pada al-Tamhid (3/301); dan menjelaskan bahwa kata \"lebih mengerikan\" dalam edisi cetak tidak memiliki dasar dalam manuskrip. {kutip:muwatta-maruf-1997 hal.261} {kutip:muwatta-maruf-1997 hal.262}"
