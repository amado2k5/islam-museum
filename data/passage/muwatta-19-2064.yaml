label: { ar: "الموطأ 2064 — مالك: إنما فرق بين المساقاة في النخل والأرض البيضاء، لأن صاحب النخل لا يقدر على أن يبيع ثمرها حتى يبدو صلاحه، وصاحب الأرض يكريها وهي أرض بيضاء لا شيء فيها", en: "Muwatta 2064", es: "Muwatta 2064", fr: "Muwatta 2064", ur: "موطا 2064", tr: "Al-Muwatta 2064 — Malik: Hurma ağaçlarında ortakçılık ile verimsiz arazide ortakçılık arasındaki fark şudur: Hurma ağaçlarının sahibi, meyveler olgunlaşana kadar onları satamazken, verimsiz arazinin sahibi onu kiraya verir ve verimsiz arazi üzerinde hiçbir şey yoktur.", id: "Al-Muwatta 2064 — Malik: Perbedaan antara sistem bagi hasil perkebunan kurma dan lahan tandus adalah karena pemilik perkebunan kurma tidak dapat menjual buahnya sampai matang, sedangkan pemilik lahan tandus menyewakannya, dan itu adalah lahan tandus tanpa ada apa pun di atasnya." }
summary:
  ar: "قال مالك: وإنما فرق بين المساقاة في النخل والأرض البيضاء، أن صاحب النخل لا يقدر على أن يبيع ثمرها حتى يبدو صلاحه، وصاحب الأرض يكريها وهي أرض بيضاء لا شيء فيها. {cite:muwatta-maruf-1997 p.244}"
  tr: "Malik şöyle dedi: Hurma ağaçlarının ortakçılık sistemi ile verimsiz arazideki ortakçılık sistemi arasındaki fark şudur: Hurma ağaçlarının sahibi, meyveler olgunlaşana kadar onları satamazken, verimsiz arazinin sahibi onu kiraya verir ve verimsiz arazi üzerinde hiçbir şey yoktur. {cite:muwatta-maruf-1997 s.244}"
  id: "Malik berkata: Perbedaan antara sistem bagi hasil di perkebunan kurma dan di lahan tandus adalah bahwa pemilik perkebunan kurma tidak dapat menjual buahnya sampai matang, sedangkan pemilik lahan tandus menyewakannya, dan itu adalah lahan tandus tanpa apa pun di atasnya. {cite:muwatta-maruf-1997 p.244}"
