label: { ar: "صحيح البخاري 3877 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3877 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3877 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا أَبُو الرَّبِيعِ، حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنِ ابْنِ جُرَيْجٍ، عَنْ عَطَاءٍ، عَنْ جَابِرٍ ـ قَالَ النَّبِيُّ حِينَ مَاتَ النَّجَاشِيُّ \" مَاتَ الْيَوْمَ رَجُلٌ صَالِحٌ، فَقُومُوا فَصَلُّوا عَلَى أَخِيكُمْ أَصْحَمَةَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3877، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3877 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3877، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
