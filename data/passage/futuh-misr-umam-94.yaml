text: "… أَدْرَ حينَ كبَا التّفكُّر دُونهَا واسْتَوْهمَتْ لمَجيبها الأوْهامُ أَقْبُورُ أَمْلاَكِ الأعَاجمِ هُنّ أَمْ طِلِتْمُ رَمْلِ كَنَّ أَمْ أَعْلاَمُ حدثنا أسد بن موسى، حدثنا إسرائيل عن أبى إسحاق عن نَوْفٍ نحوه. ولم يذكر السرير، فلما أن أغرق اللّٰه فرعون وجنوده، كما …"
