text: "… الصحيحين عن النى : ثلاث من كن فيه وجد حلاوة الإيمان: من كان اللّٰه ورسوله أحب إليه مما سواهما، ومن كان يحب المرء لا يحبه إلا لله، ومن كان يكره أن يرجع فى الكفر بعد أن أنقذه اللّٰه منه كما …"
