label: { ar: "الموطأ 2470 — مالك: الجرح خطأ لا يُعقل حتى يبرأ المجروح ويصح", en: "Muwatta 2470", es: "Muwatta 2470", fr: "Muwatta 2470", ur: "موطا 2470", tr: "Al-Muwatta 2470 — Malik: Yara, yaralanan kişi iyileşip sağlığına kavuşana kadar kasıtsız bir hata olarak kabul edilir.", id: "Al-Muwatta 2470 — Malik: Luka dianggap sebagai kesalahan yang tidak disengaja sampai orang yang terluka sembuh dan pulih." }
summary:
  ar: "حدث مالك أن الأمر المجتمع عليه عندهم في الخطأ أنه لا يُعقل حتى يبرأ المجروح ويصح. فإذا كُسر عظم من الإنسان، يد أو رجل أو غير ذلك من الجسد، خطأ، فبرئ وعاد لهيئته، فليس فيه عقل، وإن نقص أو كان فيه عثل ففيه من العقل بحساب ما نقص منه. وما ورد فيه عن النبي عقل مسمى فبحسابه، وما لم يرد فيه عقل مسمى ولا سنة فيُجتهد فيه. {cite:muwatta-maruf-1997 p.421}"
  tr: "Malik, aralarındaki görüş birliğinin, kasıtsız yaralanmalarda, yaralanan kişi iyileşip sağlığına kavuşana kadar tazminat ödenmemesi yönünde olduğunu bildirmiştir. Dolayısıyla, bir kişinin kemiği, eli, bacağı veya vücudunun herhangi bir başka kısmı kasıtsız olarak kırılırsa ve iyileşip eski haline dönerse, tazminat ödenmez. Ancak, hasar görmüş veya deforme olmuşsa, hasarın derecesine orantılı olarak tazminat ödenir. Peygamber tarafından belirli bir tazminatın belirlendiği durumlarda, buna göre hesaplanır. Belirli bir tazminat veya sünnetin bulunmadığı durumlarda ise, âlimlerin yorumu gereklidir. {cite:muwatta-maruf-1997 s.421}"
  id: "Malik meriwayatkan bahwa konsensus di antara mereka mengenai cedera yang tidak disengaja adalah bahwa tidak ada ganti rugi yang harus diberikan sampai pihak yang cedera sembuh dan pulih. Jadi, jika tulang, tangan, kaki, atau bagian tubuh lainnya patah secara tidak sengaja, dan sembuh serta kembali ke keadaan semula, maka tidak ada ganti rugi yang harus diberikan. Namun, jika rusak atau cacat, maka ganti rugi harus diberikan sebanding dengan tingkat kerusakannya. Untuk kasus-kasus di mana ganti rugi khusus telah ditentukan oleh Nabi, maka dihitung sesuai dengan ketentuan tersebut. Untuk kasus-kasus di mana tidak ada ganti rugi khusus atau Sunnah yang ada, maka diperlukan penafsiran ulama. {cite:muwatta-maruf-1997 p.421}"
