label: { ar: "الموطأ 2470 — مالك: الجرح خطأ لا يُعقل حتى يبرأ المجروح ويصح", en: "Muwatta 2470" }
summary:
  ar: "حدث مالك أن الأمر المجتمع عليه عندهم في الخطأ أنه لا يُعقل حتى يبرأ المجروح ويصح. فإذا كُسر عظم من الإنسان، يد أو رجل أو غير ذلك من الجسد، خطأ، فبرئ وعاد لهيئته، فليس فيه عقل، وإن نقص أو كان فيه عثل ففيه من العقل بحساب ما نقص منه. وما ورد فيه عن النبي عقل مسمى فبحسابه، وما لم يرد فيه عقل مسمى ولا سنة فيُجتهد فيه. {cite:muwatta-maruf-1997 p.421}"
