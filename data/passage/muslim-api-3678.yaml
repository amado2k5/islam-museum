label: { ar: "صحيح مسلم 3678 — ما أُحل", en: "Sahih Muslim 3678 — what was made lawful", ur: "صحیح مسلم 3678 — جو حلال کیا گیا" }
text: "… إِنِّي أَجِدُ مِنْكَ رِيحَ مَغَافِيرَ أَكَلْتَ مَغَافِيرَ فَدَخَلَ عَلَى إِحْدَاهُمَا فَقَالَتْ ذَلِكَ لَهُ. فَقَالَ \" بَلْ شَرِبْتُ عَسَلاً عِنْدَ زَيْنَبَ بِنْتِ جَحْشٍ وَلَنْ أَعُودَ لَهُ \". فَنَزَلَ { لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ} إِلَى قَوْلِهِ { إِنْ تَتُوبَا} لِعَائِشَةَ وَحَفْصَةَ { وَإِذْ أَسَرَّ النَّبِيُّ إِلَى بَعْضِ أَزْوَاجِهِ حَدِيثًا} لِقَوْلِهِ \" بَلْ شَرِبْتُ عَسَلاً \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 3678، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3678 (The Book of Divorce), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3678، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
