label: { ar: "الموطأ 1008 — يحيى بن سعيد عن محمد بن إبراهيم عن عيسى بن طلحة عن عمير بن سلمة الضمري عن البهزي: خرج رسول الله يريد مكة وهو محرم، فلما كان بالروحاء إذا حمار وحشي عقير، فقال: دعوه، فإنه يوشك أن يأتي صاحبه، فجاء البهزي فقال: شأنكم بهذا الحمار، فأمر أبا بكر فقسمه بين الرفاق", en: "Muwatta 1008" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث عن عيسى بن طلحة عن عمير بن سلمة الضمري عن البهزي، أن رسول الله خرج يريد مكة وهو محرم، فلما كان بالروحاء إذا حمار وحشي عقير، فقال: دعوه، فإنه يوشك أن يأتي صاحبه. فجاء البهزي فقال: شأنكم بهذا الحمار، فأمر أبا بكر فقسمه بين الرفاق. ثم مضى حتى كان بالأثابة إذا ظبي حاقق في ظل فيه سهم، فأمر رجلاً أن يقف عنده لا يريبه أحد حتى يجاوزه. ويذكر المحقق أن ابن عبد البر بيّن أن الحديث عند حماد بن زيد وهشيم وعلي بن مسهر عن يحيى بن سعيد عن محمد بن إبراهيم عن عيسى بن طلحة عن عمير بن سلمة عن النبي مباشرة، وأن مالكاً جعله عن عمير عن البهزي. {cite:muwatta-maruf-1997 p.472}"
