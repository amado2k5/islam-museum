label: { ar: "الموطأ 1008 — يحيى بن سعيد عن محمد بن إبراهيم عن عيسى بن طلحة عن عمير بن سلمة الضمري عن البهزي: خرج رسول الله يريد مكة وهو محرم، فلما كان بالروحاء إذا حمار وحشي عقير، فقال: دعوه، فإنه يوشك أن يأتي صاحبه، فجاء البهزي فقال: شأنكم بهذا الحمار، فأمر أبا بكر فقسمه بين الرفاق", en: "Muwatta 1008", es: "Muwatta 1008", fr: "Muwatta 1008", ur: "موطا 1008", tr: "El-Muvatta 1008 — Yahya ibn Sa’id, Muhammed ibn İbrahim’den, o da İsa ibn Talha’dan, o da Ümeyr ibn Salama el-Damri’den, o da el-Bahzi’den rivayet eder: Allah Resulü, ihramlı halde Mekke’ye gitmek üzere yola çıktı. El-Ravha’ya vardığında yaralı bir yaban eşeği gördü. “Bırakın, sahibine gelmek üzere” dedi. Sonra el-Bahzi geldi ve “Bu eşek senindir” dedi. Bunun üzerine Ebu Bekir’e eşeği sahabeler arasında paylaştırmasını emretti.", id: "Al-Muwatta 1008 — Yahya ibn Sa’id, berdasarkan riwayat Muhammad ibn Ibrahim, berdasarkan riwayat Isa ibn Talha, berdasarkan riwayat Umayr ibn Salama al-Damri, berdasarkan riwayat al-Bahzi: Rasulullah SAW berangkat dengan maksud pergi ke Mekah dalam keadaan ihram. Ketika beliau sampai di al-Rawha’, beliau melihat seekor keledai liar yang terluka. Beliau berkata, “Biarkan saja, karena ia akan segera kembali kepada pemiliknya.” Kemudian al-Bahzi datang dan berkata, “Keledai ini milikmu.” Maka beliau memerintahkan Abu Bakr untuk membaginya kepada para sahabat." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم بن الحارث عن عيسى بن طلحة عن عمير بن سلمة الضمري عن البهزي، أن رسول الله خرج يريد مكة وهو محرم، فلما كان بالروحاء إذا حمار وحشي عقير، فقال: دعوه، فإنه يوشك أن يأتي صاحبه. فجاء البهزي فقال: شأنكم بهذا الحمار، فأمر أبا بكر فقسمه بين الرفاق. ثم مضى حتى كان بالأثابة إذا ظبي حاقق في ظل فيه سهم، فأمر رجلاً أن يقف عنده لا يريبه أحد حتى يجاوزه. ويذكر المحقق أن ابن عبد البر بيّن أن الحديث عند حماد بن زيد وهشيم وعلي بن مسهر عن يحيى بن سعيد عن محمد بن إبراهيم عن عيسى بن طلحة عن عمير بن سلمة عن النبي مباشرة، وأن مالكاً جعله عن عمير عن البهزي. {cite:muwatta-maruf-1997 p.472}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim ibn el-Harith'ten, o da İsa ibn Talha'dan, o da Ümeyr ibn Salama el-Damri'den, o da el-Bahzi'den rivayet ettiğine göre, Allah Resulü ihramlı halde Mekke'ye doğru yola çıktı. El-Ravha'ya vardığında yaralı bir yaban eşeği gördü ve \"Bırakın onu, sahibine dönmek üzere\" dedi. El-Bahzi geldi ve \"Bu eşeğe iyi bakın\" dedi. Bunun üzerine Ebu Bekir'e onu sahabeler arasında paylaştırmasını emretti. Sonra El-Athabah'a kadar devam etti ve orada gölgede ok saplanmış bir ceylan gördü. Ceylan geçene kadar kimsenin onu rahatsız etmemesi için yanına bir adam gönderdi. Araştırmacı, İbn Abdülbarr'ın hadisin Hammad ibn Zeyd, Huşeym ve Ali ibn Müşir tarafından Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim'den, o da İsa ibn Talha'dan, o da Ümeyr ibn Salama'dan, doğrudan Peygamber'den rivayet edildiğini açıkladığını ve Malik'in de bunu Ümeyr'e, el-Bahzi'den naklettiğini belirtiyor. {cite:muwatta-maruf-1997 s.472}"
  id: "Malik meriwayatkannya dari Yahya bin Sa'id, dari Muhammad bin Ibrahim bin al-Harith, dari Isa bin Talha, dari Umayr bin Salama al-Damri, dari al-Bahzi, bahwa Rasulullah SAW berangkat ke Mekah dalam keadaan ihram. Ketika sampai di al-Rawha', beliau melihat seekor keledai liar yang terluka dan berkata, \"Biarkan saja, karena ia akan kembali kepada pemiliknya.\" Al-Bahzi datang dan berkata, \"Jagalah keledai ini.\" Maka beliau memerintahkan Abu Bakar untuk membaginya kepada para sahabat. Kemudian beliau melanjutkan perjalanan hingga sampai di al-Athabah, di mana beliau melihat seekor kijang beristirahat di bawah naungan pohon dengan anak panah menancap di tubuhnya. Beliau memerintahkan seorang laki-laki untuk berdiri di dekatnya agar tidak ada yang mengganggunya sampai anak panah itu lewat. Peneliti menyebutkan bahwa Ibnu 'Abd al-Barr menjelaskan bahwa hadits tersebut diriwayatkan oleh Hammad ibn Zayd, Hushaym, dan 'Ali ibn Mushir atas otoritas Yahya ibn Sa'id, atas otoritas Muhammad ibn Ibrahim, atas otoritas 'Isa ibn Talha, atas otoritas 'Umayr ibn Salama, langsung dari Nabi, dan bahwa Malik menisbatkannya kepada 'Umayr, atas otoritas al-Bahzi. {cite:muwatta-maruf-1997 p.472}"
