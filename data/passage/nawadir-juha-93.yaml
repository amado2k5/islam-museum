label: { ar: "نوادر جحا الكبرى، ص 47 — «خذ منه الجزاء فأنا مستعجل»", en: "Nawadir Juha al-Kubra, p. 47 — 'Take the Penalty from Him, I'm in a Hurry'", ur: "نوادر جحا الکبریٰ، ص 47 — «اس سے تاوان لے لو، مجھے جلدی ہے»", fr: "Nawadir Juha al-Kubra, p. 47 — « Prenez-lui l'amende, je suis pressé »", es: "Nawadir Juha al-Kubra, p. 47 — «Cóbrenle la multa, tengo prisa»", tr: "Juha'nın Büyük Fıkraları, s. 47 — “Ödülü ondan alın, çünkü acelem var.”", id: "Anekdot Hebat Juha, hlm. 47 — “Ambillah hadiah itu darinya, karena aku sedang terburu-buru.”" }
text: "… خُذْ منه الجزاء، فأنا مستعجل كان جحا ماراً في السوق يوماً فجاءَهُ رجل من خلفِه، وصفعَهُ صفعةً شديدةً فالتفَتَ إليهِ وقال : ما هذا؟ فاعتذرَ لَهُ الصافِعُ بقولهِ: عفواً يا سيدي الشيخ، ظننتُكَ أحدَ أصدقائي الذين لا تكليف بيني وبينَهم. …"
summary:
  ar: "صفع رجل جحا في السوق عن غير قصد، فأمر القاضي جحا بأن يصفعه بالمثل، فرفض جحا، فعرض القاضي عشرة قروش تعويضًا، ثم ترك القاضي الرجل يهرب، فصفع جحا القاضي في المحكمة. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  en: "A man slaps Juha in the market by mistake; the judge orders Juha to slap him back; Juha refuses, and the judge offers ten piastres in compensation; the judge lets the man escape, and Juha slaps the judge in the court. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  ur: "بازار میں ایک آدمی نے غلطی سے جحا کو تھپڑ مار دیا؛ قاضی نے جحا کو حکم دیا کہ وہ بھی اسے تھپڑ مارے؛ جحا نے انکار کیا تو قاضی نے ہرجانے کے طور پر دس قرش پیش کیے؛ قاضی نے اس آدمی کو بھاگ جانے دیا، اور جحا نے عدالت میں قاضی کو تھپڑ مار دیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  fr: "Un homme gifle Juha au marché par erreur ; le juge ordonne à Juha de le gifler en retour ; Juha refuse et le juge offre dix piastres en compensation ; le juge laisse l'homme s'enfuir, et Juha gifle le juge au tribunal. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  es: "Un hombre abofetea a Juha en el mercado por error; el juez ordena a Juha que le devuelva la bofetada; Juha se niega y el juez le ofrece diez piastras como compensación; el juez deja escapar al hombre, y Juha abofetea al juez en el tribunal. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  tr: "Bir adam pazarda yanlışlıkla Juha'ya tokat attı, bunun üzerine hakim Juha'ya adama karşılık tokat atmasını emretti. Juha reddetti, bunun üzerine hakim ona tazminat olarak on kuruş teklif etti. Bunun üzerine hakim adamın kaçmasına izin verdi, bunun üzerine Juha mahkemede hakime tokat attı. {cite:juha-nawadir-kubra-djuwaydi s. 47}"
  id: "Seorang pria tanpa sengaja menampar Juha di pasar, sehingga hakim memerintahkan Juha untuk membalas tamparan tersebut. Juha menolak, sehingga hakim menawarkan sepuluh piaster sebagai kompensasi. Kemudian hakim membiarkan pria itu pergi, whereupon Juha menampar hakim di pengadilan. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
