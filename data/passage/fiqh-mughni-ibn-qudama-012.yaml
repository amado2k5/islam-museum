text: "هرب قبل الحكم عليه، فيسأل صاحب الحق الحاكم الحكم عليه، وأن يكتب له كتابا بحكبه ففي هذه الصور الثلاث، يلزم الحاكم إجابته إلى الكتابة، ويلزم المكتوب إليه قبوله، سواء كانت ينهما مسافة بعيدة أو قرية، حتى لو كانا في جانبي"
