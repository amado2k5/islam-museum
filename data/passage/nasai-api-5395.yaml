label: { ar: "سنن النسائي 5395 — الأب والأبوة", en: "Sunan al-Nasa'i 5395 — the father and fatherhood", ur: "سنن نسائی 5395 — باپ اور والدیت", es: "Sunan al-Nasa'i 5395 — El padre y la paternidad", fr: "Sunan al-Nasa'i 5395 — Le père et la paternité", tr: "Sunan an-Nasa'i 5395 — Baba ve Babalık", id: "Sunan an-Nasa'i 5395 — Sang Ayah dan Peran Ayah" }
text: "… شُعْبَةُ، عَنْ يَحْيَى بْنِ أَبِي إِسْحَاقَ، قَالَ سَمِعْتُ سُلَيْمَانَ بْنَ يَسَارٍ، يُحَدِّثُهُ عَنِ الْفَضْلِ بْنِ الْعَبَّاسِ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ يَا نَبِيَّ اللَّهِ إِنَّ أَبِي شَيْخٌ كَبِيرٌ لاَ يَسْتَطِيعُ الْحَجَّ وَإِنْ حَمَلْتُهُ لَمْ يَسْتَمْسِكْ أَفَأَحُجَّ عَنْهُ قَالَ \" حُجَّ عَنْ أَبِيكَ \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ سُلَيْمَانُ لَمْ يَسْمَعْ مِنَ الْفَضْلِ بْنِ الْعَبَّاسِ."
summary:
  ar: "حديث في سنن النسائي، رقم 5395، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5395 (The Book of the Etiquette of Judges), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5395، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5395 (El Libro de la Etiqueta de los Jueces), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5395 (Le Livre de l'Étiquette des Juges), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 5395 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5395, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
