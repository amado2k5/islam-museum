text: "… تريد ؟ قال: أُريد رسول اللّٰه. قال : قد أصبته. قال: يا رسول اللّٰه، ما الإيمان؟ قال: تشهد أن لا إله إلا الله، وأن محمد رسول اللّٰه، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت. قال: قد أقررت. قال: ثم …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1452، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1452, that mentions the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1452 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
