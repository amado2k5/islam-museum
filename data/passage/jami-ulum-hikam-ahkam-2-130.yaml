text: "… : إن الجهاد فرض إلى يوم القيامة، إلا أنه فرض على الكفاية إذا قام به بعضهم كان الباقون في سعة من تركه. وقد ذكر أبو عبيد أن سفيان الثوري كان يقول : ليس بفرض ولكن لا يسع الناس أن يجمعوا …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 130، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 130, whose wording mentions what was made obligatory on people, the obligatory (fard), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out, what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 130 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volume numérisé 2, p. 130, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent, ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen digitalizado 2, p. 130, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen, lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 130. sayfasından bir alıntı, insanlar için farz olan şeyleri, farz fiilleri, toplumsal yükümlülükleri, bazılarının yerine getirmesi halinde yükümlülükten kurtulanları ve farz olmayanları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 130, membahas tentang apa yang wajib dilakukan oleh manusia, perbuatan wajib, kewajiban kolektif, apa yang diwajibkan jika sebagian orang memenuhinya dan kewajiban tersebut dihapuskan dari yang lain, dan apa yang tidak wajib. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
