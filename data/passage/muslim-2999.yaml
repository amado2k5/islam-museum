label: { ar: "مسلم 2999 — عجباً لأمر المؤمن إن أمره كله له خير", en: "Muslim 2999 — Wondrous is the believer's affair", es: "Musulmán 2999 — Maravilloso es el asunto del creyente", fr: "Muslim 2999 — Merveilleuse est l'affaire du croyant", ur: "مسلم 2999 - عجب ہے مومن کا معاملہ", tr: "Müslim 2999 — Müminin hali ne kadar da şaşırtıcıdır! Çünkü onun bütün işleri onun için hayırlıdır.", id: "Muslim 2999 — Betapa menakjubkan urusan orang beriman, karena semua urusannya baik baginya." }
text: "قال صهيب: قال رسول الله: عجباً لأمر المؤمن، إن أمره كله له خير، وليس ذاك لأحد إلا للمؤمن: إن أصابته سراء شكر فكان خيراً له، وإن أصابته ضراء صبر فكان خيراً له"
summary:
  ar: "رواية صهيب في كتاب الزهد والرقائق في صحيح مسلم؛ شكر عند السراء وصبر عند الضراء يجعلان أمر المؤمن كله خيراً."
  tr: "Sahih Müslim'deki Zühd ve Kalpleri Yumuşatma Kitabı'nda Suhaib'in rivayetine göre: Bolluk zamanlarında şükretmek ve zorluk zamanlarında sabırlı olmak, müminin tüm işlerini hayırlı kılar."
  id: "Riwayat Suhaib dalam Kitab Ekaristi dan Pelunakan Hati dalam Sahih Muslim: Rasa syukur di saat senang dan kesabaran di saat susah menjadikan semua urusan seorang mukmin menjadi baik."
