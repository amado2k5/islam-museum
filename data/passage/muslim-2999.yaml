label: { ar: "مسلم 2999 — عجباً لأمر المؤمن إن أمره كله له خير", en: "Muslim 2999 — Wondrous is the believer's affair" }
text: "قال صهيب: قال رسول الله: عجباً لأمر المؤمن، إن أمره كله له خير، وليس ذاك لأحد إلا للمؤمن: إن أصابته سراء شكر فكان خيراً له، وإن أصابته ضراء صبر فكان خيراً له"
summary:
  ar: "رواية صهيب في كتاب الزهد والرقائق في صحيح مسلم؛ شكر عند السراء وصبر عند الضراء يجعلان أمر المؤمن كله خيراً."
