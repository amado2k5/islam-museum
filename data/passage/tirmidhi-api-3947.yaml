text: "… بْنَ مَلاَذٍ، يُحَدِّثُ عَنْ نُمَيْرِ بْنِ أَوْسٍ، عَنْ مَالِكِ بْنِ مَسْرُوحٍ، عَنْ عَامِرِ بْنِ أَبِي عَامِرٍ الأَشْعَرِيِّ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" نِعْمَ الْحَىُّ الأَسْدُ وَالأَشْعَرُونَ لاَ يَفِرُّونَ فِي الْقِتَالِ وَلاَ يَغُلُّونَ هُمْ مِنِّي وَأَنَا مِنْهُمْ \". قَالَ فَحَدَّثْتُ بِذَلِكَ مُعَاوِيَةَ فَقَالَ لَيْسَ هَكَذَا قَالَ رَسُولُ اللَّهِ قَالَ \" هُمْ مِنِّي وَإِلَىَّ \". …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3947، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3947 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3947، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
