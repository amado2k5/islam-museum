label: { ar: "الموطأ 2449 — بكير بن عبد الله بن الأشج عن عبد الرحمن بن الحباب عن أبي قتادة: النهي عن شرب التمر والزبيب معا", en: "Muwatta 2449" }
summary:
  ar: "يروي مالك عن ثقة عنده عن بكير بن عبد الله بن الأشج عن عبد الرحمن بن الحباب الأنصاري عن أبي قتادة الأنصاري أن النبي نهى أن يُشرب التمر والزبيب جميعا، والزهو والرطب جميعا. ويذكر المحقق قول المزي والخطيب في تعيين الثقة المبهم، ويرجح أن المحفوظ هو الإبهام كما في الموطأ. {cite:muwatta-maruf-1997 p.411} {cite:muwatta-maruf-1997 p.412}"
