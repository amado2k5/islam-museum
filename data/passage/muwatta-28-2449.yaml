label: { ar: "الموطأ 2449 — بكير بن عبد الله بن الأشج عن عبد الرحمن بن الحباب عن أبي قتادة: النهي عن شرب التمر والزبيب معا", en: "Muwatta 2449", es: "Muwatta 2449", fr: "Muwatta 2449", ur: "موطا 2449", tr: "El-Muvatta 2449 — Bakir ibn Abdullah ibn el-Aşajj, Abd el-Rahman ibn el-Habab'dan, o da Ebu Katade'den rivayetle: Hurma ve kuru üzümün birlikte içilmesinin yasaklanması", id: "Al-Muwatta 2449 — Bakir ibn Abdullah ibn al-Ashajj, berdasarkan riwayat Abd al-Rahman ibn al-Habab, berdasarkan riwayat Abu Qatada: Larangan meminum kurma dan kismis bersama-sama" }
summary:
  ar: "يروي مالك عن ثقة عنده عن بكير بن عبد الله بن الأشج عن عبد الرحمن بن الحباب الأنصاري عن أبي قتادة الأنصاري أن النبي نهى أن يُشرب التمر والزبيب جميعا، والزهو والرطب جميعا. ويذكر المحقق قول المزي والخطيب في تعيين الثقة المبهم، ويرجح أن المحفوظ هو الإبهام كما في الموطأ. {cite:muwatta-maruf-1997 p.411} {cite:muwatta-maruf-1997 p.412}"
  id: "Malik meriwayatkan, berdasarkan riwayat dari orang yang terpercaya, dari Bukayr ibn Abdullah ibn al-Ashajj, dari Abd al-Rahman ibn al-Hubab al-Ansari, dari Abu Qatada al-Ansari, bahwa Nabi (shalawat dan salam kepadanya) melarang meminum kurma dan kismis bersama-sama, dan kurma kering dan kurma segar bersama-sama. Peneliti menyebutkan pernyataan al-Mizzi dan al-Khatib mengenai identitas orang terpercaya yang tidak disebutkan namanya, dan ia menganggap bahwa ambiguitas tersebut lebih mungkin merupakan posisi yang benar, sebagaimana ditemukan dalam al-Muwatta. {cite:muwatta-maruf-1997 p.411} {cite:muwatta-maruf-1997 p.412}"
