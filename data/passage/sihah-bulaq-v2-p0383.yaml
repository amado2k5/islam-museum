text: |-
  تولهمصنايقال أصنّ اذا شمخ
  يانفه تكيرا قال المؤلف !ه
  ٢ ف نسخحة زيادة أحيهة بن
  الجلاح ا
  الحنذ بالتريك موضع قريب من
  المدينة وهو المراد فى هذا البيت
  قاله المؤلف اه
  ٤ ف تسهخة بقية البيت
  *ن عبس الصيف قرون الايل
  ٢٠٤
  •⁦(ف صل الصاد)⁩•
  كذلك قال أوس بن مغراء التميمى.
  وهم عند الحروب اذا اشمعات • بنوهائم والمتثوّبونا
  ول) شات بالجسرّة أشول بها شولارفعتها ولا تقسل ثلت ويقال أيضا أشات الجسرة
  فانشالت هى وقال الراجز الاسدى
  أابلى تأكلهامصنا • خافض سن ومشلاسنا.
  أى يأخذ بنت لبون فية ول هذه بنت مخاض فقد خفضها عن سنها التى هى فيها وتكون له بنت
  مخاض فيقولى لى بنت لبون فقد رفع السن التى هى له الى سنّ أخوى أعلى منها وتكون له بنت
  لبون فيأخذحقة وشال الميزان اذا ارتفعت احدى كفتيه وشالت الناقة بذنبها تشوله
  وأشالته أى رفعته قال النهربن ولب يصف فرسا
  جوم الشتشائلة الذنابى • تخال بياض غزتها سرابا
  وشال ذنيها أى ارتفع قال الراجز ٢
  تأبرى يا خيرة الفسيل • تأبرى من حنذفشولى
  أى ارتفعى أبوزيد تشاول القوم تناول بعضه-م بعضا فى القتال بالرماح والمشاولة مثله
  والشول الماء القليل فى أسغل القرية والمع أشوال قال الاعشى*وصب رواتها أشوالها•
  والشول أيضا النوق التى خفّ لبنها وإرتفع ضرعها وأتى عليها من نتاجها سبعة أشهر أومانية
  الواحدة شائلة وهو جمع على غير القياس يقال منه شوّلت الناقة بالتشديد أى صارت شائلة
  وقول الشاءر» حتى اذاما العشرعنها شولا* يعن ذهب وتصرّم وأمًا الشائل بلا ها فهى
  الناقة التى تشول بذنبها للقاح ولا لين لها أصلا والمع شوّل مثل راكع وركع قال أبو
  التجسم ٤ كأنّ فى أذنا بهنّ الشوّل • وشولة العق رب ما تشول من ذنبها وتسمى العقرب
  شوّالة والشولة كوكبان نيران متقاربان ينزاهما القمر بقال لهماحة خف الغترب والمشول
  منجل صغير وشوّال أوّل أشهر الحج واله-ع *والات وشواويل ورجل شول أى خفيف فى
  العمل والخدمة مثل شلشل وولهم فى المئل للانسان ينصح القوم أنت شولة الناصحة قال
  ابن السكيت كانت شولة أمة لعدوان رعناء وكانت تنصح مواليها فته ود نصيحتها وبالاعليهم
  لحقها هل الشهلة فى العين أن يشوب سوادها زرقة وعين شهلا وريل أشهل
  العين بين الشْهل وأنشد الفراء
  ولاعيب فيماغير شهلة عينها * كذاك عتاق الطيرشهلا عيونها
  قال وبعض بنى أسد وقضاعة ينصبون غيراذا كان فى معنى الاتم" الكلام قبلها أو لم يتمّ
  والشهلاء الحاجة وامرأة شهلة اذا كانت نصفا عاقلة وذلت اسم لهاخاصة لا يوصف به الرجل
  كال
  بات ينزى دلوه تنزيا • كما تنزى تشهلة صبيا
  وشهل بن شيبان الزمانىّ الملقب بغند والمشاهلة المشارة والمقارصة ومراجعة الكلام قال
  الراجز
  قد كان فيما بيننا مشاهله • فأدبرت غضبى تمشى البادله
  صل الصاد ( حل قال فى صوته بهجل أى بحوحة وقد صحل الرجل بالسكسر
  بصمل صحلا اذاصار أمح فه وصحل الصوت وأصحل قال الرأجز
