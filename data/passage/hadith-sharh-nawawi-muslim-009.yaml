text: "الذي صلى عليه الني ٣٤) ح ١٧٧٤ ٣٢- كتاب الجهاد والسير ٢٧ - باب كتب النهي ٣ إلى ملوك الكفار والتابعين. تصرفات الكفار ما تنفذه الضرورة، ولم يقل إلى هرقل فقط بل أتى بنوع من الملاطفة فقال عظيم الروم أي"
