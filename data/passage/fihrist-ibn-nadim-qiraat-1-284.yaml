text: "… العَجَمُ وبه يَقْرَءُون، حَدَثَ قَريبًا، وهو قال محمَّدُ بن إسْحَاق : أوَّلُ من كَتَّبَ المَصَاحِفَ في الصَّدْرِ الأوَّلِ ويُوصَفُ حُسْنِ الخَطُ : خَالِدُ بن أبي الهَيَّاجِ، رَأَيْتُ مُصْحَفًا بخَطَه. وكان سَعْدُ حُصَّه يَكْتُبُه المَصَاحِفَ والشِّعْرَ والأخْبَارَ للوَلِيدِ بن عبد الملك، …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 284، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
