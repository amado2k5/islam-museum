label: { ar: "سنن أبي داود 5111 — حلاوة الإيمان وكماله", en: "Sunan Abi Dawud 5111 — the sweetness and completeness of faith", ur: "سنن ابی داؤد 5111 — ایمان کی مٹھاس اور اس کا کمال", es: "Sunan Abi Dawud 5111 — La dulzura y plenitud de la fe" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا سُهَيْلٌ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ جَاءَهُ نَاسٌ مِنْ أَصْحَابِهِ فَقَالُوا يَا رَسُولَ اللَّهِ نَجِدُ فِي أَنْفُسِنَا الشَّىْءَ نُعْظِمُ أَنْ نَتَكَلَّمَ بِهِ أَوِ الْكَلاَمَ بِهِ مَا نُحِبُّ أَنَّ لَنَا وَأَنَّا تَكَلَّمْنَا بِهِ. قَالَ \" أَوَقَدْ وَجَدْتُمُوهُ \". قَالُوا نَعَمْ. قَالَ \" ذَاكَ صَرِيحُ الإِيمَانِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5111، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 5111 (General Behavior (Kitab Al-Adab)), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 5111، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 5111 (Conducta General (Kitab Al-Adab)), menciona la dulzura y la plenitud de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
