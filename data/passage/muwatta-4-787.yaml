label: { ar: "الموطأ 787 — مالك: إذا صام الناس يوم الفطر يظنونه من رمضان ثم جاءهم ثبت أن الهلال رُئي قبل يوم، أفطروا", en: "Muwatta 787", es: "Muwatta 787", fr: "Muwatta 787", ur: "موطا 787", tr: "El-Muvatta 787 — Malik: Eğer insanlar Ramazan Bayramı günü oruç tutarlarsa ve bunun Ramazan olduğunu düşünürlerse, bir önceki gün hilalin görüldüğü kesinleşmiş demektir; o zaman oruçlarını bozmalıdırlar.", id: "Al-Muwatta 787 — Malik: Jika orang-orang berpuasa pada hari raya Idul Fitri karena mengira itu adalah bulan Ramadan, lalu dipastikan bahwa hilal telah terlihat sehari sebelumnya, maka mereka harus berbuka puasa." }
summary:
  ar: "قول يرويه يحيى عن مالك: إذا صام الناس يوم الفطر وهم يظنون أنه من رمضان، ثم جاءهم ثبت أن هلال رمضان قد رُئي قبل أن يصوموا بيوم، وأن يومهم ذلك أحد وثلاثون، فإنهم يفطرون من ذلك اليوم أي ساعة جاءهم الخبر، غير أنهم لا يصلون صلاة العيد إن كان الخبر جاءهم بعد زوال الشمس. ويذكر المحقق أنه رواه عن مالك أبو مصعب (868). {cite:muwatta-maruf-1997 p.387} {cite:muwatta-maruf-1997 p.388}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Eğer insanlar Ramazan Bayramı günü oruç tutarken bunun Ramazan'ın ilk günü olduğunu düşünürlerse ve daha sonra Ramazan hilalinin oruç tutmaya başlamadan bir gün önce görüldüğü ve oruç günlerinin otuz bir gün olduğu kesinleşirse, haberi aldıkları vakitte o gün oruçlarını açarlar. Ancak, haber öğleden sonra kendilerine ulaşırsa bayram namazı kılmazlar. Araştırmacı, bu hadisin Ebu Musab'ın (868) Malik'ten rivayet ettiğini belirtmektedir."
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Jika orang-orang berpuasa pada hari Idul Fitri karena mengira itu adalah hari pertama Ramadhan, dan kemudian dipastikan bahwa hilal Ramadhan telah terlihat sehari sebelum mereka mulai berpuasa, dan bahwa hari mereka adalah tiga puluh satu hari, maka mereka berbuka puasa pada hari itu, pada waktu apa pun mereka menerima kabar tersebut. Namun, mereka tidak melaksanakan salat Id jika kabar tersebut sampai kepada mereka setelah tengah hari. Peneliti menyebutkan bahwa Abu Mus'ab (868) meriwayatkannya dari Malik."
