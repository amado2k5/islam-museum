label: { ar: "الموطأ 787 — مالك: إذا صام الناس يوم الفطر يظنونه من رمضان ثم جاءهم ثبت أن الهلال رُئي قبل يوم، أفطروا", en: "Muwatta 787" }
summary:
  ar: "قول يرويه يحيى عن مالك: إذا صام الناس يوم الفطر وهم يظنون أنه من رمضان، ثم جاءهم ثبت أن هلال رمضان قد رُئي قبل أن يصوموا بيوم، وأن يومهم ذلك أحد وثلاثون، فإنهم يفطرون من ذلك اليوم أي ساعة جاءهم الخبر، غير أنهم لا يصلون صلاة العيد إن كان الخبر جاءهم بعد زوال الشمس. ويذكر المحقق أنه رواه عن مالك أبو مصعب (868). {cite:muwatta-maruf-1997 p.387} {cite:muwatta-maruf-1997 p.388}"
