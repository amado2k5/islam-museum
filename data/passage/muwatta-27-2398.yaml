label: { ar: "الموطأ 2398 — هشام بن عروة عن أبيه: من قذف جماعة فعليه حد واحد", en: "Muwatta 2398", es: "Muwatta 2398", fr: "Muwatta 2398", ur: "موطا 2398", tr: "El-Muvatta 2398 — Hişam ibn Urve, babasından rivayetle: Bir grup insanı zina ile suçlayan kimse, aynı cezaya çarptırılır.", id: "Al-Muwatta 2398 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Barang siapa menuduh sekelompok orang berzina, maka ia akan dikenai satu hukuman." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أنه قال في رجل قذف جماعة من الناس: إنه ليس عليه إلا حد واحد. قال مالك: وإن تفرقوا فليس عليه إلا حد واحد. {cite:muwatta-maruf-1997 p.392}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından rivayet ederek, bir grup insanı iftira eden bir adam hakkında şöyle dediğini aktarır: \"O, yalnızca tek bir cezaya çarptırılır.\" Malik dedi ki: \"Onlar dağılmış olsalar bile, o yine de yalnızca tek bir cezaya çarptırılır.\" {cite:muwatta-maruf-1997 s.392}"
  id: "Malik meriwayatkan dari Hisham bin Urwah, dari ayahnya, bahwa ia berkata tentang seorang laki-laki yang memfitnah sekelompok orang: Ia hanya akan dikenai satu hukuman. Malik berkata: Sekalipun mereka tercerai-berai, ia tetap hanya akan dikenai satu hukuman. {cite:muwatta-maruf-1997 p.392}"
