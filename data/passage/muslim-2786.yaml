label: { ar: "مسلم 2786 — الحبر: السماوات على إصبع والأرضون على إصبع", en: "Muslim 2786 — The Jewish scholar: heavens on a Finger, earths on a Finger", es: "Musulmán 2786 — El erudito judío: cielos en un dedo, tierras en un dedo", fr: "Muslim 2786 — Le savant juif: les cieux sur un doigt, les terres sur un doigt", ur: "مسلم 2786 - یہودی عالم: آسمان ایک انگلی پر، زمین انگلی پر", tr: "Müslim 2786 — Mürekkep: Gökler bir parmağın ucunda, yer ise diğer parmağın ucundadır.", id: "Muslim 2786 — Tinta: Langit ada di satu jari dan bumi ada di jari lainnya." }
text: "قال عبد الله بن مسعود: جاء حبر إلى النبي فقال: يا محمد إن الله يمسك السماوات يوم القيامة على إصبع والأرضين على إصبع والجبال والشجر على إصبع والماء والثرى على إصبع وسائر الخلق على إصبع ثم يهزهن فيقول أنا الملك أنا الملك، فضحك رسول الله تعجباً مما قال الحبر تصديقاً له، ثم قرأ: «وما قدروا الله حق قدره»"
summary:
  ar: "رواية عبد الله بن مسعود في كتاب صفة القيامة والجنة والنار في صحيح مسلم؛ حبر يهودي يصف قبضة الخلائق يوم القيامة فيصدقه النبي وضحك ويتلى قوله «وما قدروا الله حق قدره» ⁦(الزمر 67)⁩."
  tr: "Abdullah bin Mesud'un Sahih Müslim'de yer alan \"Kıyamet, Cennet ve Cehennemin Tanımı\" adlı kitabında rivayet edildiğine göre: Bir Yahudi alim, kıyamet gününde yaratıkların toplanmasını anlatır ve Peygamberimiz onu onaylar ve güler; onun şu sözü de rivayet edilir: \"Onlar Allah'ı hakkıyla değerlendirmediler.\" (Zümer 67)."
  id: "Diriwayatkan oleh Abdullah bin Masoud dalam kitab “Deskripsi Kebangkitan, Surga dan Neraka” dalam Sahih Muslim: Seorang ulama Yahudi menggambarkan pengumpulan makhluk pada Hari Kiamat, dan Nabi membenarkannya dan tertawa, lalu sabdanya dibacakan: “Mereka tidak menilai Allah dengan penilaian yang benar” (Az-Zumar 67)."
