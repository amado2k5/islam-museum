label: { ar: "مسلم 2786 — الحبر: السماوات على إصبع والأرضون على إصبع", en: "Muslim 2786 — The Jewish scholar: heavens on a Finger, earths on a Finger" }
text: "قال عبد الله بن مسعود: جاء حبر إلى النبي فقال: يا محمد إن الله يمسك السماوات يوم القيامة على إصبع والأرضين على إصبع والجبال والشجر على إصبع والماء والثرى على إصبع وسائر الخلق على إصبع ثم يهزهن فيقول أنا الملك أنا الملك، فضحك رسول الله تعجباً مما قال الحبر تصديقاً له، ثم قرأ: «وما قدروا الله حق قدره»"
summary:
  ar: "رواية عبد الله بن مسعود في كتاب صفة القيامة والجنة والنار في صحيح مسلم؛ حبر يهودي يصف قبضة الخلائق يوم القيامة فيصدقه النبي وضحك ويتلى قوله «وما قدروا الله حق قدره» (الزمر 67)."
