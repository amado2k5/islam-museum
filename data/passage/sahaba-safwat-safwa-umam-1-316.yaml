text: "… اللّٰه يضمحل. وعن علي بن الحسين قال: كتب ملك الروم إلى عبد الملك بن مروان يتهدده ويتواعده ويحلف له : ليحملنّ إليه مائة ألف في البر ومائة ألف في البحر، أو يؤدي إليه الجزية! فسُقط في ذَرْعه ! فكتب إلى …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 316، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
