text: "… فكانت عامّة العِير لهم. ويقال كان لبنى مَخزوم فيها مائتا بعير، و خمسة أَو أربعة آلاف مثقال ذهب.، وكان يقال للحارث بن عامر بن نَوفل فيها أَلف مِثقال، وكان لأُميّة بن خَلَف أَلفا مِثقال. فى ح : راسه. سقط فى …"
