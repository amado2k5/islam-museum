label: { ar: "الموطأ 1176 — يحيى: سئل مالك عمن نسي الحلاق بمنى في الحج، هل له أن يحلق بمكة", en: "Muwatta 1176", es: "Muwatta 1176", fr: "Muwatta 1176", ur: "موطا 1176", tr: "El-Muvatta 1176 — Yahya: Malik'e, Hac sırasında Mina'da tıraş olmayı unutan biri hakkında soru soruldu; Mekke'de tıraş olmasına izin verilir mi?", id: "Al-Muwatta 1176 — Yahya: Malik ditanya tentang seseorang yang lupa bercukur di Mina saat haji; apakah dia diperbolehkan bercukur di Mekah?" }
summary:
  ar: "قال يحيى سئل مالك عن رجل نسي الحلاق بمنى في الحج، هل له رخصة في أن يحلق بمكة؟ فقال ذلك واسع، والحلاق بمنى أحب إليه. {cite:muwatta-maruf-1997 p.531}"
  tr: "Yahya şöyle dedi: Malik'e, Hac sırasında Mina'da saçını kestirmeyi unutan bir adam hakkında soru soruldu. Mekke'de saçını kestirmesi caiz midir? Malik şöyle cevap verdi: \"Bu caizdir, ancak Mina'da saçını kestirmesi onun için daha iyidir.\" {cite:muwatta-maruf-1997 s.531}"
  id: "Yahya berkata: Malik ditanya tentang seorang pria yang lupa memotong rambutnya di Mina saat haji. Apakah dia diperbolehkan memotong rambutnya di Mekah? Dia menjawab, \"Itu diperbolehkan, tetapi memotong rambut di Mina lebih baik baginya.\" {cite:muwatta-maruf-1997 p.531}"
