text: "… فيه زهر أبيض قليل العطرية، وينبت كثيراً في المقابر وبالشام، ويدرك بنيسان، ينفع لضيق التنفس والربو والإعياء وأوجاع الصدر، وينفع الكبد والطحال والاستسقاء واليرقان، وعرق النسا والبواسير، والقروح، ويخرج الديدان، ويسقط الأجنة، ويدر الحيض ويبرئ أمراض الرحم. التداوي بالأعشاب والنباتات …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 510، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأطوار خلق الجنين، وأعضاء البدن، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 510, that mentions illness and the sick, pain, named diseases, the stages of the embryo, the organs of the body, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 510 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، جنین کے مراحل، اعضائے بدن، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
