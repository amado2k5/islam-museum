summary:
  ar: "القسم 95 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب أخبار الآحاد»، ويضم فيها النصوص من 7246 إلى 7267 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 95 of Sahih al-Bukhari (Accepting Information Given by a Truthful Person) in the division of the open hadith dataset the museum took its reports from: reports 7246 to 7267 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 95، عنوان «کتاب اخبار الآحاد»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7246 تا 7267۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 95 de Sahih al-Bukhari (Aceptación de la información dada por una persona veraz) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 7246 a 7267 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 95 du Sahih al-Bukhari (Recueil des hadiths authentiques), soit les hadiths 7246 à 7267 de la numérotation de ce recueil. Le musée conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 95. bölümü \"Hadis Kitabı\" başlığını taşımakta olup, 7246 ile 7267 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 95 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Hadits\" dan berisi teks 7246 hingga 7267, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
