label: { ar: "الموطأ 2115 — مالك: وإنما يكون ذلك في الأموال خاصة، ولا يقع ذلك في شيء من الحدود، ولا في نكاح، ولا في طلاق، ولا في عتاقة، ولا في سرقة، ولا في فرية", en: "Muwatta 2115", es: "Muwatta 2115", fr: "Muwatta 2115", ur: "موطا 2115", tr: "Al-Muwatta 2115 — Malik: Bu sadece mali konular için geçerlidir ve öngörülen cezaların hiçbirine, evliliğe, boşanmaya, köle azad etmeye, hırsızlığa veya iftiraya uygulanmaz.", id: "Al-Muwatta 2115 — Malik: Ini hanya berlaku untuk masalah keuangan, dan tidak berlaku untuk hukuman yang telah ditentukan, tidak pula untuk pernikahan, perceraian, pembebasan budak, pencurian, atau fitnah." }
summary:
  ar: "قال مالك: وإنما يكون ذلك في الأموال خاصة، ولا يقع ذلك في شيء من الحدود، ولا في نكاح، ولا في طلاق، ولا في عتاقة، ولا في سرقة، ولا في فرية. فإن قال قائل: فإن العتاقة من الأموال، فقد أخطأ، ليس ذلك على ما قال. {cite:muwatta-maruf-1997 p.264}"
  tr: "Malik şöyle dedi: Bu sadece mali konular için geçerlidir ve öngörülen cezalardan hiçbirine, evliliğe, boşanmaya, köle azad etmeye, hırsızlığa veya iftiraya uygulanmaz. Eğer biri: \"Köle azad etmek mali bir konudur\" derse, yanılıyor demektir; dediği gibi değildir. {cite:muwatta-maruf-1997 s.264}"
  id: "Malik berkata: Ini hanya berlaku untuk masalah keuangan, dan tidak berlaku untuk hukuman yang telah ditentukan, maupun untuk perkawinan, perceraian, pembebasan budak, pencurian, atau fitnah. Jika seseorang berkata: \"Pembebasan budak adalah masalah keuangan,\" maka dia keliru; bukan seperti yang dia katakan. {cite:muwatta-maruf-1997 p.264}"
