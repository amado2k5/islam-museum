label: { ar: "الموطأ 2849 — عائشة والعنب: أتعجب؟ كم ترى في هذه الحبة من مثقال ذرة؟", en: "Muwatta 2849", es: "Muwatta 2849", fr: "Muwatta 2849", ur: "موطا 2849", tr: "Al-Muwatta 2849 — Aişe ve üzümler: Şaşırdınız mı? Bu üzümde bir atomun ağırlığının ne kadarını görüyorsunuz?", id: "Al-Muwatta 2849 — Aisyah dan anggur: Apakah kamu terkejut? Berapa banyak berat atom yang kamu lihat dalam anggur ini?" }
summary:
  ar: "بلغ مالكا أن مسكينا استطعم عائشة أم المؤمنين وبين يديها عنب، فقالت لإنسان: خذ حبة فأعطه إياها، فجعل ينظر إليها ويعجب، فقالت عائشة: أتعجب؟ كم ترى في هذه الحبة من مثقال ذرة؟ {cite:muwatta-maruf-1997 p.596}"
  tr: "Malik şöyle rivayet etmiştir: Bir fakir adam, Müminlerin Annesi Ayşe'den yiyecek istedi. Ayşe'nin önünde üzümler vardı. Ayşe birine, \"Al bir üzüm, ona ver,\" dedi. Adam üzüme bakıp hayretler içinde kaldı. Ayşe, \"Hayret mi ediyorsun? Sence bu üzümde bir atomun ağırlığı kadar üzüm var mı?\" dedi. {cite:muwatta-maruf-1997 s.596}"
  id: "Malik meriwayatkan bahwa seorang pria miskin meminta makanan kepada Aisyah, Ibu Kaum Beriman, sementara di depannya ada anggur. Aisyah berkata kepada seseorang: Ambillah satu buah anggur dan berikan kepadanya. Orang itu terus memandanginya dan takjub. Aisyah berkata: Apakah kamu takjub? Menurutmu, berapa berat atom yang terkandung dalam anggur ini? {cite:muwatta-maruf-1997 p.596}"
