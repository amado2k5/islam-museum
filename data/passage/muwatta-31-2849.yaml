  ar: "بلغ مالكا أن مسكينا استطعم عائشة أم المؤمنين وبين يديها عنب، فقالت لإنسان: خذ حبة فأعطه إياها، فجعل ينظر إليها ويعجب، فقالت عائشة: أتعجب؟ كم ترى في هذه الحبة من مثقال ذرة؟ {cite:muwatta-maruf-1997 p.596}"
