text: "… وصالحهم على أداءِ الجزية، والجزية إنما نزلت عامَ تبوك سنة تسع، وفيها نزل صدرُ سورة آل عمران، وناظرَ أهل الكتاب، ودعاهم إلى التوحيد والمُباهلة، ويدلُّ عليه أن أهلَ مكة وجدوا في نفوسهم على ما فاتهم من التجارة من المشركين لما …"
summary:
