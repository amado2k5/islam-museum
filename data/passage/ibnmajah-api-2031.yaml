text: "… الْخُدْرِيِّ أَنَّ أُخْتَهُ الْفُرَيْعَةَ بِنْتَ مَالِكٍ، قَالَتْ خَرَجَ زَوْجِي فِي طَلَبِ أَعْلاَجٍ لَهُ فَأَدْرَكَهُمْ بِطَرَفِ الْقَدُومِ فَقَتَلُوهُ فَجَاءَ نَعْىُ زَوْجِي وَأَنَا فِي دَارٍ مِنْ دُورِ الأَنْصَارِ شَاسِعَةٍ عَنْ دَارِ أَهْلِي فَأَتَيْتُ النَّبِيَّ ـ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّهُ جَاءَ نَعْىُ زَوْجِي وَأَنَا فِي دَارٍ شَاسِعَةٍ عَنْ دَارِ أَهْلِي وَدَارِ إِخْوَتِي وَلَمْ يَدَعْ مَالاً يُنْفِقُ عَلَىَّ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2031، فيه نعي وإخبار بوفاة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2031 (The Chapters on Divorce), that carries a death announcement. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2031، جس میں وفات کی خبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Ibn Majah, n° 2031, qui contient une annonce de décès. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Ibn Majah, n.º 2031, que contiene un anuncio de fallecimiento. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "İbn Majah'ın Sünen'inde yer alan 2031 numaralı hadis, bir ağıt ve ölüm müjdesini içermektedir. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü ağıt ve mersiyelerden bazılarını içermektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2031, berisi ratapan dan pengumuman kematian. Kompilasi ini mencakup beberapa elegi dan ratapan yang paling terkenal, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, kisah-kisah dari para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
