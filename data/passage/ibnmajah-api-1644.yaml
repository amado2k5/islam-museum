label: { ar: "سنن ابن ماجه 1644 — ما حُرّم", en: "Sunan Ibn Majah 1644 — what was made unlawful", ur: "سنن ابن ماجہ 1644 — جو حرام کیا گیا", es: "Sunan Ibn Majah 1644: lo que se declaró ilegal", fr: "Sunan Ibn Majah 1644 — ce qui a été rendu illégal" }
text: "حَدَّثَنَا أَبُو بَدْرٍ، عَبَّادُ بْنُ الْوَلِيدِ حَدَّثَنَا مُحَمَّدُ بْنُ بِلاَلٍ، حَدَّثَنَا عِمْرَانُ الْقَطَّانُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ: دَخَلَ رَمَضَانُ. فَقَالَ رَسُولُ اللَّهِ ـ \" إِنَّ هَذَا الشَّهْرَ قَدْ حَضَرَكُمْ وَفِيهِ لَيْلَةٌ خَيْرٌ مِنْ أَلْفِ شَهْرٍ مَنْ حُرِمَهَا فَقَدْ حُرِمَ الْخَيْرَ كُلَّهُ وَلاَ يُحْرَمُ خَيْرَهَا إِلاَّ مَحْرُومٌ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1644، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 1644 (Fasting), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1644، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1644 (Ayuno), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 1644 (Le jeûne), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
