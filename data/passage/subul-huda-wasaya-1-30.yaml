text: "… سيرته في دفن الميت وما يلتحق بذلك وفيه أَنواع. باب: سيرته في زيارة القبور وفيه أَنواع. باب: سيرته في الشهداء والموتى. جماع أبواب سيرته في الضَّدَقةِ باب: بعثه العمال لأخذها من الأغنياء وردها على الفقراء ووصيته عماله بالعدل. باب: وصيته …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 30، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 30, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 1، ص 30 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 1, pág. 30, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 1, page 30, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 1. cildinin 30. sayfasında, vasiyet veya son sözleşme, defin, mezar ve türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Subul al-Huda wa al-Rashad\" karya Al-Salihi, Volume 1, halaman 30, menyebutkan wasiat atau perjanjian terakhir, pemakaman, kuburan, dan makam; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Makam\"."
