text: "… فجاءت فاطمة حتى ألقته عنه، قال: فكان يستحب ثلاثاً يقول: اللهم عليك بقريش اللهم عليك بقريش اللهم عليك بقريش : بأبي جهل بن هشام وعتبة بن ربيعة وشيبة بن ربيعة والوليد بن عتبة وأمية بن خلف وعقبة بن أبي معيط، …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 332، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
