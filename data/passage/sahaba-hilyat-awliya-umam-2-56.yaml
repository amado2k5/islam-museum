text: "… هذا لكم بلاغ، قالت ولا والله ما ترك لنا حيثا ولكف أردت أن أسكن الشيخ بذلك. قال ابن اسحاق : وحدثت عن أسماء قالت : لا خرج رسول اللّٰه وأبو بكر أتانا نفر من قريش فيهم أبو جهل فوقفوا على …"
