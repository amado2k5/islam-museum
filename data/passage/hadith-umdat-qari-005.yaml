text: "ة، وصلى عليه عثمان، رضي الله تعالى عنه، وبعثه النبي عليا، بكتاب إلى المقوقس صاحب مصر والإسكندرية في محرم سنة ست بعد الحديبية، فأقام عنده خمسة أيام ورجع بهدية منها مارية أم إبراهيم وأختها سيرين، فوهبها لحسان بن ثابت، وبغلته"
