label: { ar: "الموطأ 1368 — مالك: عقد اليمين أن يحلف لا يبيع ثوبه بعشرة دنانير ثم يبيعه، فهذا تكفر عنه اليمين، وليس في اللغو كفارة", en: "Muwatta 1368" }
summary:
  ar: "يقول مالك إن عقد اليمين أن يحلف الرجل أن لا يبيع ثوبه بعشرة دنانير، ثم يبيعه بذلك، أو يحلف ليضربن غلامه ثم لا يضربه، ونحو هذا. فهذا الذي يكفر صاحبه عن يمينه، وليس في اللغو كفارة. {cite:muwatta-maruf-1997 p.612}"
