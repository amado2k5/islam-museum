label: { ar: "الموطأ 1368 — مالك: عقد اليمين أن يحلف لا يبيع ثوبه بعشرة دنانير ثم يبيعه، فهذا تكفر عنه اليمين، وليس في اللغو كفارة", en: "Muwatta 1368", es: "Muwatta 1368", fr: "Muwatta 1368", ur: "موطا 1368", tr: "El-Muvatta 1368 — Malik: Bir kimse elbisesini on dinara satmayacağına yemin eder de sonra satarsa, yemin edilmiş sayılır. Bu durumda yemin için kefaret gerekir, ancak kasıtsız yeminler için kefaret yoktur.", id: "Al-Muwatta 1368 — Malik: Sumpah itu terjadi jika seseorang bersumpah untuk tidak menjual pakaiannya seharga sepuluh dinar, lalu menjualnya. Hal ini memerlukan penebusan atas sumpah tersebut, tetapi tidak ada penebusan untuk sumpah yang tidak disengaja." }
summary:
  ar: "يقول مالك إن عقد اليمين أن يحلف الرجل أن لا يبيع ثوبه بعشرة دنانير، ثم يبيعه بذلك، أو يحلف ليضربن غلامه ثم لا يضربه، ونحو هذا. فهذا الذي يكفر صاحبه عن يمينه، وليس في اللغو كفارة. {cite:muwatta-maruf-1997 p.612}"
  tr: "Malik, bağlayıcı bir yeminin, bir adamın elbisesini on dinara satmayacağına yemin edip sonra o fiyata satması veya hizmetçisini döveceğine yemin edip sonra dövmemesi gibi durumlar olduğunu söyler. Yemini bozmanın kefaretini gerektiren durum budur ve kasıtsız yeminler için kefaret yoktur. {cite:muwatta-maruf-1997 s.612}"
  id: "Malik mengatakan bahwa sumpah yang mengikat adalah ketika seseorang bersumpah tidak akan menjual pakaiannya seharga sepuluh dinar, lalu menjualnya dengan harga tersebut, atau bersumpah akan memukul pelayannya, lalu tidak melakukannya, dan seterusnya. Inilah yang memerlukan penebusan dosa karena melanggar sumpah, dan tidak ada penebusan dosa untuk sumpah yang tidak disengaja. {cite:muwatta-maruf-1997 p.612}"
