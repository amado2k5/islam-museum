text: "… قريش ببعض وقد ترى ما هى فيه من محمد؟ فقال : أخفرت صبرك وحليفك وأنت راض بذلك ؟ فقال : من لم يصبر على صغير المكروه، فقد تعرّض للكبيرة. وأطفأ أبو سفيان ذلك الأمر. فقال حسان يحرّض على الطلب بدم …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 2، ص 136، يرد فيه ذكر المكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 2, p. 136, whose wording mentions the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 2، ص 136 کا اقتباس جس میں مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ansab al-Ashraf de al-Baladhuri, volume numérisé 2, p. 136, dont le texte mentionne le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Ansab al-Ashraf de al-Baladhuri, volumen digitalizado 2, p. 136, cuyo texto menciona lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Baladhuri'nin \"Ansab al-Ashraf\" (Soyluların Şecereleri) adlı eserinin 2. cildinin 136. sayfasından bir alıntı, mekruh (hoş görülmeyen) şeylerden bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, bir tarayıcı tarafından farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için derlenmiştir."
  id: "Sebuah kutipan dari \"Ansab al-Ashraf\" (Silsilah Para Bangsawan) karya Al-Baladhuri, Jilid 2, halaman 136, menyebutkan apa yang makruh (tidak disukai); ini berasal dari versi pindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
