text: |-
  ١ رفة بهسجو كمر وبن حند
  قوله عرقا أيضه قال الصغانى
  الصواب عرقى بالنعب كفواهم
  يوجمع رأسه اه بضع الباء
  فقط وضبطه غيره بكسرتين ورواء
  ابن برى أو-لمتفى فائله ومابضه
  ادم رف أيش
  قولل مثال كسر قال ابنْ بَرى
  قال ابن القطاع صوابه كفرح
  اه مر
  ٥٢٠
  باب الضاد)
  جارية فى درعها الفضفاض * أيض من أخت بى إياس
  قال المبردليس البيت الشاذ محجة على الاصل الجمع عليه وأماقول الراجز ١
  اذا الرجال شتواواشتذأ كاهم • فأنت أبيضهم-ربال طباخ
  فيحتمل أن لا يكون بمنى افعل الذى تصحبه من للمفاضلة واغماهو بعنزلة قولك هوأحستهم
  وجهاوأكرمهم أبايريد حسمنهم وجها وكريهم أبافكا نه قال فأنت مبيضهمسربالافلا
  أضافه انتصب ما بعده على التمييز والابيض السيف والجمع البيض والبيضان من النساس
  خلاف السودان قال ابن السكيت الابيضان اللبن والماء وأنشد
  ولكنه يأنى لى الحول كاملا • ومالى الا الابيضين شراب
  وضه قواهم يضت السقاء وبيضت الاناء أى ملاته من الماء واللبن وإلا يضان عرقان
  فى حالب البعير قال الراجز ميان بن قحافة السعدى
  قريبة ندونه من محضه • كأنما يجع عرقا أيضه * أوملتق فائله وأبضه
  والبيضة واحدة البيض من الحديد وبيض الطائرجيعا وقولهم *وأذلة من بيضة البلد أى
  من بيضة النعامة التى تتركها قال الشاعر
  لو كان حوض حارماشربت به * الاباذن حار آخر الابد
  كنه حوض من أودى باخوته • ريب الزمان فامسى يضة البلد
  والبيضة الخصية ويضة كل شئحوزته وبيضة القوم ساحتهم وقال ا قيط بن معيد .
  ياقوم بيضكم لا تفضن بهنا • انى أحاف عليها الازلم الجذعا
  يقول احفظواءة رداركم لا يفضن والبيض أيضاورم يكون فى يدالفرس-ثل النفخ والغدد
  قال الاصمعى هو من العبوب الهينة يقال قدياضت يد الفرس تبيض بيضا وياضت الطائرة
  فهى بائض ودجاجة بيوض اذا أكثرت البيض والمع بيض منال صبور وصبرويقال
  بيض فى لغة من يقول فى الرسل وسل وانما كسرت الباءلسلم الياء وياض المر أى اشنة
  وباضت البهمى سقطت فصالهاواتناض الرجل ليس البيضة وقواهم سدابن بض الطريق
  قال الاصمعى هو رجل كان فى الزمن الاول يقال له ابن بيض عقرناقته على نذية فسسبها
  الطريق ومنع الناس من سلو كها قال الشاعر
  -ددنا كماسدابن بيض طريقه * فلم يجدوا عند الثنية مطلعا
  والمبيضة بكسر الياء فرقة من الثنوية وهم أصواب المقنع سموا بذلك لتبيضهم شيابهم مخالفة
  للمسوّدة من أصحاب الدولة العباسية وبيضة بكسر الباءاسم بلد
  صل الجيم رض لحرض بالتحريك الريق يفص بهية الدبوض بريقه يجرض
  مثال كسر يكسروهو أن يبتلع ريقه على همّ وحزن بالجهد والحريض الغصة وق المثل
  حال الجريض دون القريض قال الشاعر ا مر والقيس
  كأن الفى لم يفن بالناس ليلة • اذا اختلف اللهيان عند جريض
  قال الاضى يقال هو يجرض بنفسه أى يكاد يقضى ومنه قول امرئ القيس
  وأفلتهن علباء جربضا • ولوأدركته صفر الوطاب
  ديات
