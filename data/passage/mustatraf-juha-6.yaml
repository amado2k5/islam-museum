text: "… فى المزاح والنهى عنه وماجاء فى الترخيص فيه والبسط والتنعم وفيسه فصول الباب السادس والسبعون فى النوادر والحكايات وفيه فصول الباب السابع والسبعون فى الدعاء وآدابه وشروطه وفيه فصول الباب الثامن والسبعون فى القضاء والقدر وأحكامهما والتوكل على اللّه الباب …"
