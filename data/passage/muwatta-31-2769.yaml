label: { ar: "الموطأ 2769 — عبد الله بن أبي بكر عن أبيه: إذا عطس فشمّته ثلاثا ثم قل إنك مضنوك", en: "Muwatta 2769", es: "Muwatta 2769", fr: "Muwatta 2769", ur: "موطا 2769", tr: "El-Muvatta 2769 — Abdullah bin Ebu Bekr, babasından rivayetle: Birisi hapşırırsa, üç defa \"Allah sana rahmet etsin\" deyin, sonra da \"Acı çekiyorsun\" deyin.", id: "Al-Muwatta 2769 — Abdullah bin Abi Bakr berdasarkan riwayat ayahnya: Jika seseorang bersin, ucapkan \"Semoga Allah merahmatimu\" tiga kali, kemudian ucapkan, \"Kamu sedang menderita.\"" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن أبيه أن رسول الله قال: إن عطس فشمّته، ثم إن عطس فشمّته، ثم إن عطس فشمّته، ثم إن عطس فقل: إنك مضنوك. قال عبد الله بن أبي بكر: لا أدري أبعد الثالثة أو الرابعة. ويذكر المحقق أن ابن عبد البر قال إن الحديث في الموطأ مرسل لا خلاف فيه، وأنه يتصل من وجوه، منها حديث سلمة بن الأكوع وحديث أبي هريرة. {cite:muwatta-maruf-1997 p.554}"
  tr: "Malik, Abdullah ibn Abi Bakr'dan, o da babasından rivayet ederek, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: “Eğer hapşırırsa, ona ‘Allah sana rahmet etsin’ deyin. Sonra tekrar hapşırırsa, ona ‘Allah sana rahmet etsin’ deyin. Sonra tekrar hapşırırsa, ona ‘Allah sana rahmet etsin’ deyin. Sonra tekrar hapşırırsa, ‘Acı çekiyorsun’ deyin.” Abdullah ibn Abi Bakr şöyle demiştir: “Bunun üçüncü mü yoksa dördüncü seferden sonra mı olduğunu bilmiyorum.” Araştırmacı, İbn Abd al-Barr'ın, el-Muwatta’daki hadisin mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve bu konuda bir ihtilaf bulunmadığını, ayrıca bu hadisin, Salama ibn al-Akwa’ hadisi ve Ebu Hurayra hadisi de dahil olmak üzere çeşitli rivayet zincirleriyle bağlı olduğunu söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.554}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr, yang juga dari ayahnya, bahwa Rasulullah SAW bersabda: “Jika dia bersin, ucapkan ‘Semoga Allah merahmatimu’ kepadanya. Kemudian jika dia bersin lagi, ucapkan ‘Semoga Allah merahmatimu’ kepadanya. Kemudian jika dia bersin lagi, ucapkan ‘Semoga Allah merahmatimu’ kepadanya. Kemudian jika dia bersin lagi, ucapkan ‘Engkau sedang menderita.’” Abdullah ibn Abi Bakr berkata: “Saya tidak tahu apakah ini setelah kali ketiga atau keempat.” Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits dalam al-Muwatta’ adalah mursal (hadits dengan mata rantai periwayatan yang hilang) dan tidak ada perbedaan pendapat tentang hal itu, dan bahwa hadits tersebut terhubung melalui beberapa rantai periwayatan, termasuk hadits Salama ibn al-Akwa’ dan hadits Abu Hurairah. {mengutip:muwatta-maruf-1997 hal.554}"
