label: { ar: "الموطأ 2769 — عبد الله بن أبي بكر عن أبيه: إذا عطس فشمّته ثلاثا ثم قل إنك مضنوك", en: "Muwatta 2769" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن أبيه أن رسول الله قال: إن عطس فشمّته، ثم إن عطس فشمّته، ثم إن عطس فشمّته، ثم إن عطس فقل: إنك مضنوك. قال عبد الله بن أبي بكر: لا أدري أبعد الثالثة أو الرابعة. ويذكر المحقق أن ابن عبد البر قال إن الحديث في الموطأ مرسل لا خلاف فيه، وأنه يتصل من وجوه، منها حديث سلمة بن الأكوع وحديث أبي هريرة. {cite:muwatta-maruf-1997 p.554}"
