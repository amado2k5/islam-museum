text: |-
  •باب الميم).
  •(رقم,n
  ٢٩٨
  لقى حلته أمه وهى ضيفة • فجات بيتن المضيافة أرشما
  والارشم أيضا الذى بد وشم وخطوط وأرشم البرق مشسل أوثم وغيت أرسم قليل مذ.وم
  ( رضم الرضم والرضام صخور عظام يرضم بعضها فوق بعض فى الابنية الواحدة رضمة
  بقال رضم عليه الصخرير ضم بالكسر ر ضهاورضم فلان بيته باخجارة والرضيم البناء بالصغر
  ورضمت الأرض أثرتها للزرع ووضم به الارض اذا جلديه الارض ورضم البعيرينفسه
  الارض وبرذون مرضوم العصب كأن عصبه قد تشتج طم طمته فى الوحل رطما
  فارتطم هوأى ارتبك فيسه وارئطم عليه أمراذ الم يقدر على الخروج منه والرطوم الاحق
  والرطوم المرأة الواسعة الفرج ورطم الرحل أى نكح والراطم اللازم لاذئ ⁦(رهم)⁩ شاة
  رعوم بهاداء يسيل من أنفها الرعام بالضم وهو المخاط وقدرعمت الشاة وأرعت والرعامى
  زيادة السكبدوهو بالعين والغين يجيها ورعمت الشمس أرعمها اذا رقبت غيوبها وهوقي شعر
  الطرماح غم الرغام بالفتح التراب وقال
  ولم آت البيوت مطتبات * بأكتبة فردن من الرعام
  أى انفردن ويقال أرغم اللّٰه أنفم أى ألصه بالرغام ومنمحديت عائشة رضي اللّٰه عنها
  فى الحضاب اسلتيه وأرغميه والرغامى بالعيز والفين زيادة الكبدويقال قسبة الرثة قال
  الشماخ بصف المر• لها بالرغامى والخياشيم بارز• والمراخمة المغاضبة بقال راغم فلان قومه
  اذا نا بذهم وخرج عليهم والترغم التغضب وربماياء بالزاى والرغم بالضم والرغم وفيه ثلاث
  اغات رغم ورغم ورغم والمرغمة مثله قال النبت عليه الصلاة والسلام بعثت مرغمة وتقول
  فعلت ذاع لى الرغم من أنفه ورغم فلان بالفتح اذا لم يقسدر على الانتصاف يقال رغم أننى للّه
  عزوجل بالكسر والفتح رغماور غماورغها والمراغم المذهب والمهرب قال الجعدى"
  كطوديلاذ بأركانه • عزيز المراغم والمهرب
  وضه قوله تعالى يجد فى الارض مراغما كفبيرا قال الفراء المراغم المضطرب والمذهب
  فى الارض ⁦( رقم)⁩ الرقم السكتابة والختم قال تعالى كتاب مزقوم وقولهم هو يرقم الماء أى بلغ
  من حذقه بالأمور أن يرقم حيث لا يثبت الرقم ورقم الشوب كتابه وهوفى الاصل مصد ريقال
  رقت الثوب ورقته ترقها مثل والرقم أيضاضرب من البرود قال أبو خراش
  فهلامست فى العقم والرقم• والرقة جانب الموادى وقد يقال الروضة قال زهير
  ودارلها بالرقتيي كأنها • مراجع وشم فى نواشبر معصم
  والمرقومة الارض بهانبات قليل والرقنان هنقان فى قوائم الشاة متقابلتان كالظفرين
  ورقنا الجار والفرس الاثران يباطن أعضادهما والرقيات سهام تنسب الى موضع بالمدينة
  فى قول لبيد
  رقيات عليها ناعض • تسكلح الإروق منهم والايل
  ويوم الرقم من أيام العرب عقرفبه قرزل فرس طفيل بن مالكْ والرقم بكسر القاف الداهية
  وكذلك يت الرقم يقال وقع فى الرقم الرقاء اذا وقع فيمالابة وم به والارقم الحية التى فيها سواد
  وبياض والاراقم حى من تغلب وهم جشم والرقيم الكتاب وقوله تعالى أن أصاب الكهف
  والرقيم بقال هو لوح فيه أسماؤهم وقصمهم وذكر عكرمة عن ابن عباس رضى اللٰه عنه أنه
