text: "… النيات يرخص فى ذكر المرض وإنما يشترط ذلك لأن ذكره شكاية والشكوى من اللّٰه تعالى ومثل العقل فى القلب حرام كماذكرته فى تحريم السؤال على الفقراء إلا بضرورة ويصير الاظهار شكاية بقزينة السخط وإظهار مثل النظر فى المين وهو الكراهة …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 3، ص 285، يذكر الحرام، والتحريم، والمكروه، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 3, p. 285, that mentions the unlawful, prohibition, the disliked, the concession; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 3، ص 285 کا اقتباس جس میں حرام، تحریم، مکروہ، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 3, pág. 285, que menciona lo ilícito, la prohibición, lo desaconsejado y la concesión; tomado de la lectura automática, citado con un límite de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
