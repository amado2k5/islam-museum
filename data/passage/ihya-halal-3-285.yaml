  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 3. cildinin 285. sayfasından, haram, yasak, mekruh ve helal konularını ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 3, halaman 285, yang membahas tentang yang haram, terlarang, tidak disukai, dan diperbolehkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
