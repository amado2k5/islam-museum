label: { ar: "الموطأ 816 — سعيد بن المسيب مرسلاً: أعرابي يضرب نحره ويقول هلك الأبعد؛ أصبت أهلي وأنا صائم في رمضان، فأمر بالعرق من التمر", en: "Muwatta 816", es: "Muwatta 816", fr: "Muwatta 816", ur: "موطا 816", tr: "El-Muvatta 816 — Sa’id ibn al-Musayyab, mursal: Bir bedevi boğazına vurarak, “Uzakta olan helak olur! Ramazan ayında oruçluyken ailemle cinsel ilişkiye girdim” diyordu. Sonra bir sepet hurma sipariş etti.", id: "Al-Muwatta 816 — Sa’id ibn al-Musayyab, mursal: Seorang Badui memukul tenggorokannya dan berkata, “Orang yang jauh itu celaka! Aku telah bersetubuh dengan keluargaku saat aku berpuasa di bulan Ramadan.” Maka ia memesan sekeranjang kurma." }
summary:
  ar: "يرويه مالك عن عطاء بن عبد الله الخراساني عن سعيد بن المسيب، أن أعرابياً جاء إلى النبي يضرب نحره وينتف شعره ويقول: هلك الأبعد. فقال له النبي: وما ذاك؟ فقال: أصبت أهلي وأنا صائم في رمضان. فقال: هل تستطيع أن تعتق رقبة؟ قال لا. قال: فهل تستطيع أن تهدي بدنة؟ قال لا. فقال: فاجلس، فأُتي النبي بعرق تمر، فقال: خذ هذا فتصدق به، فقال: ما أحد أحوج مني، فقال: كله، وصم يوماً مكان ما أصبت. قال مالك: قال عطاء: فسألت سعيد بن المسيب كم في ذلك العرق من التمر؟ فقال: ما بين خمسة عشر صاعاً إلى عشرين. ويذكر المحقق أن الحديث مرسل عند جماعة الرواة، وأن ذكر البدنة فيه غير محفوظ في الأحاديث الصحاح، وأن ذكر الرقبة والصدقة بالعرق محفوظ من حديث أبي هريرة وعائشة، ويحيل على التمهيد (8/21). {cite:muwatta-maruf-1997 p.400}"
  tr: "Malik, Ata ibn Abdullah el-Horasani'den, o da Said ibn el-Musayyab'dan rivayet ettiğine göre, bir bedevi Peygamberimize gelip boğazını vurarak ve saçlarını yolarak, \"Uzakta olan helak olur!\" dedi. Peygamberimiz ona, \"Sorun nedir?\" diye sordu. Bedevi, \"Ramazan ayında oruçluyken karımla cinsel ilişkiye girdim\" diye cevap verdi. Peygamberimiz, \"Bir köle azat edebilir misin?\" diye sordu. Bedevi, \"Hayır\" diye cevap verdi. Peygamberimiz, \"Bir deve kurban edebilir misin?\" diye sordu. Bedevi, \"Hayır\" diye cevap verdi. Peygamberimiz, \"Öyleyse otur\" dedi. Peygamberimize bir sepet hurma getirildi ve Peygamberimiz, \"Bunu al ve sadaka olarak ver\" dedi. Bedevi, \"Benden daha muhtaç kimse yok\" diye cevap verdi. Peygamberimiz, \"Bunu ye ve yaptığın şeyin yerine bir gün oruç tut\" dedi. Malik şöyle dedi: \"Ata dedi ki: 'Saeed ibn al-Musayyab'a o sepette kaç hurma olduğunu sordum. O da, 'On beş ile yirmi sa' (kuru ölçü birimi) arasında' dedi.\" Araştırmacı, hadisin bir grup ravi tarafından mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğu ve deveden bahsedilmesinin sahih hadislerde bulunmadığını belirtiyor. Ancak, bir köleyi azat edip sepeti sadaka olarak vermekten bahsedilmesi Ebu Hurayra ve Ayşe'nin hadislerinde geçiyor. El-Tamhid'e (8/21) atıfta bulunuyor."
  id: "Malik meriwayatkannya dari Ata ibn Abdullah al-Khorasani, dari Saeed ibn al-Musayyab, bahwa seorang Badui datang kepada Nabi, memukul tenggorokannya dan menjambak rambutnya, sambil berkata, \"Orang yang jauh itu celaka!\" Nabi bertanya kepadanya, \"Ada apa?\" Ia menjawab, \"Aku telah bersetubuh dengan istriku saat aku berpuasa di bulan Ramadhan.\" Nabi bertanya, \"Bisakah kau membebaskan seorang budak?\" Ia menjawab, \"Tidak.\" Nabi bertanya, \"Bisakah kau mempersembahkan unta sebagai kurban?\" Ia menjawab, \"Tidak.\" Nabi berkata, \"Kalau begitu, duduklah.\" Sebuah keranjang kurma dibawa kepada Nabi, yang berkata, \"Ambillah ini dan berikanlah sebagai sedekah.\" Badui itu menjawab, \"Tidak ada yang lebih membutuhkan daripada aku.\" Nabi berkata, \"Makanlah, dan berpuasalah sehari sebagai pengganti apa yang kau lakukan.\" Malik berkata, \"Ata berkata, 'Aku bertanya kepada Saeed ibn al-Musayyab berapa banyak kurma yang ada di dalam keranjang itu. Dia menjawab, \"Antara lima belas dan dua puluh sa' (satuan ukuran kering).\" Peneliti menyebutkan bahwa hadits ini mursal (hadits dengan mata rantai perawi yang hilang) menurut sekelompok perawi, dan penyebutan unta tidak ditemukan dalam hadits-hadits sahih. Namun, penyebutan tentang membebaskan seorang budak dan memberikan keranjang sebagai sedekah ditemukan dalam hadits Abu Hurairah dan Aisyah. Dia merujuk pada al-Tamhid (8/21)."
