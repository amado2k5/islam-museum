label: { ar: "الموطأ 816 — سعيد بن المسيب مرسلاً: أعرابي يضرب نحره ويقول هلك الأبعد؛ أصبت أهلي وأنا صائم في رمضان، فأمر بالعرق من التمر", en: "Muwatta 816" }
summary:
  ar: "يرويه مالك عن عطاء بن عبد الله الخراساني عن سعيد بن المسيب، أن أعرابياً جاء إلى النبي يضرب نحره وينتف شعره ويقول: هلك الأبعد. فقال له النبي: وما ذاك؟ فقال: أصبت أهلي وأنا صائم في رمضان. فقال: هل تستطيع أن تعتق رقبة؟ قال لا. قال: فهل تستطيع أن تهدي بدنة؟ قال لا. فقال: فاجلس، فأُتي النبي بعرق تمر، فقال: خذ هذا فتصدق به، فقال: ما أحد أحوج مني، فقال: كله، وصم يوماً مكان ما أصبت. قال مالك: قال عطاء: فسألت سعيد بن المسيب كم في ذلك العرق من التمر؟ فقال: ما بين خمسة عشر صاعاً إلى عشرين. ويذكر المحقق أن الحديث مرسل عند جماعة الرواة، وأن ذكر البدنة فيه غير محفوظ في الأحاديث الصحاح، وأن ذكر الرقبة والصدقة بالعرق محفوظ من حديث أبي هريرة وعائشة، ويحيل على التمهيد (8/21). {cite:muwatta-maruf-1997 p.400}"
