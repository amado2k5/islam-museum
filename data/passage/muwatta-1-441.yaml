label: { ar: "الموطأ 441 — الملائكة تصلي على أحدكم ما دام في مصلاه ما لم يحدث", en: "Muwatta 441", es: "Muwatta 441", fr: "Muwatta 441", ur: "موطا 441", tr: "El-Muvatta 441 — Melekler, biriniz namaz kıldığı yerde kaldığı sürece, abdestini bozmadığı takdirde, onun için dua ederler.", id: "Al-Muwatta 441 — Para malaikat berdoa untuk salah seorang dari kalian selama ia tetap berada di tempat shalatnya, kecuali jika ia membatalkan wudhunya." }
text: "الملائكة تصلي على أحدكم ما دام في مصلاه الذي صلى فيه ما لم يحدث: اللهم اغفر له، اللهم ارحمه"
summary:
  ar: "أول حديث في باب انتظار الصلاة والمشي إليها. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: أخبر النبي أن الملائكة تدعو للمصلي بالمغفرة والرحمة ما دام في مصلاه الذي صلى فيه ما لم يُحدث؛ ويقول مالك إنه لا يرى الإحداث هنا إلا ما ينقض الوضوء. ويفسر المحقق صلاة الملائكة بالترحم والدعاء، ويخرّج الحديث عند البخاري ⁦(445، 659)⁩ وأبي داود (469) والنسائي (2/55) وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (19/39). {cite:muwatta-maruf-1997 p.227} {cite:muwatta-maruf-1997 p.228}"
  tr: "Namazı beklemek ve namaza yürümek bölümündeki ilk hadis. Yahya, Malik'ten, o da Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet etmiştir: Peygamberimiz bize, namaz kılan kişi namaz kıldığı yerde kaldığı ve abdestini bozmadığı sürece meleklerin onun için dua ettiğini, bağışlanma ve rahmet dilediğini bildirmiştir. Malik, abdesti bozmayı, onu geçersiz kılan bir şeyden başka bir şey olarak görmediğini söyler. Araştırmacı, meleklerin duasını yalvarma ve rahmet olarak yorumlar ve hadisi Buhari (445, 659), Ebu Davud (469), Nesai (2/55), Ahmed ve Beyhaki'de Malik'in sahabelerinin rivayet zincirleriyle zikreder ve Temhid'e (19/39) atıfta bulunur. {cite:muwatta-maruf-1997 s.227} {cite:muwatta-maruf-1997 s.228}"
  id: "Hadits pertama dalam surah ini adalah tentang menunggu waktu salat dan berjalan menuju salat. Diriwayatkan oleh Yahya dari Malik, dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah: Nabi memberitahukan kepada kita bahwa para malaikat berdoa untuk orang yang salat, memohon ampunan dan rahmat baginya, selama ia tetap berada di tempat salatnya dan tidak membatalkan wudhunya. Malik mengatakan bahwa ia tidak menganggap membatalkan wudhu sebagai sesuatu selain sesuatu yang membatalkannya. Peneliti menafsirkan doa para malaikat sebagai permohonan dan rahmat, dan ia mengutip hadits dalam al-Bukhari (445, 659), Abu Dawud (469), al-Nasa'i (2/55), Ahmad, dan al-Bayhaqi melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (19/39). {kutip:muwatta-maruf-1997 hal.227} {kutip:muwatta-maruf-1997 hal.228}"
