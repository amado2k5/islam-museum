label: { ar: "الموطأ 441 — الملائكة تصلي على أحدكم ما دام في مصلاه ما لم يحدث", en: "Muwatta 441" }
text: "الملائكة تصلي على أحدكم ما دام في مصلاه الذي صلى فيه ما لم يحدث: اللهم اغفر له، اللهم ارحمه"
summary:
  ar: "أول حديث في باب انتظار الصلاة والمشي إليها. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: أخبر النبي أن الملائكة تدعو للمصلي بالمغفرة والرحمة ما دام في مصلاه الذي صلى فيه ما لم يُحدث؛ ويقول مالك إنه لا يرى الإحداث هنا إلا ما ينقض الوضوء. ويفسر المحقق صلاة الملائكة بالترحم والدعاء، ويخرّج الحديث عند البخاري (445، 659) وأبي داود (469) والنسائي (2/55) وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (19/39). {cite:muwatta-maruf-1997 p.227} {cite:muwatta-maruf-1997 p.228}"
