text: "… أدركته الصلاة أناخ. كلام أبي أمامة - حدثنا أبو أسامة عن عبد الرحمن بن يزيد قال حدثنا القاسم عن أبي أمامة قال : من أحب لله وأبغض لله وأعطى لله ومنع لله فقد استكمل الايمان. - حدثنا شبابة بن سوار …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 130، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 130, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 130 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 1, pág. 130, que menciona la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 1, page 130, évoquant la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 1. cildinin 130. sayfasından, imanın tatlılığı ve mükemmelliğinden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 1, halaman 130, yang menyebutkan manisnya dan kesempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
