label: { ar: "مسلم 2589 — أتدرون ما الغيبة؟ ذكرك أخاك بما يكره", en: "Muslim 2589 — Do you know what backbiting is? Mentioning your brother with what he dislikes", es: "Musulmán 2589 — ¿Sabes qué es la calumnia? Mencionar a tu hermano y lo que le disgusta.", fr: "Muslim 2589 — Sais-tu ce qu'est la médisance ? C'est parler de son frère en évoquant ce qu'il n'aime pas.", ur: "مسلم 2589 - کیا آپ جانتے ہیں کہ غیبت کیا ہے؟ اپنے بھائی کا اس بات سے ذکر کرنا جس کو وہ ناپسند کرتا ہے۔" }
text: "قال رسول الله: «أتدرون ما الغيبة؟» قالوا: الله ورسوله أعلم، قال: «ذكرك أخاك بما يكره»، قيل: أفرأيت إن كان في أخي ما أقول؟ قال: «إن كان فيه ما تقول فقد اغتبته، وإن لم يكن فيه فقد بهته»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ التعريف النبوي للغيبة بأنها ذكر الإنسان بما يكره — ولو كان صدقاً — وبهتانه إن لم يكن فيه."
