label: { ar: "مسلم 2589 — أتدرون ما الغيبة؟ ذكرك أخاك بما يكره", en: "Muslim 2589 — Do you know what backbiting is? Mentioning your brother with what he dislikes" }
text: "قال رسول الله: «أتدرون ما الغيبة؟» قالوا: الله ورسوله أعلم، قال: «ذكرك أخاك بما يكره»، قيل: أفرأيت إن كان في أخي ما أقول؟ قال: «إن كان فيه ما تقول فقد اغتبته، وإن لم يكن فيه فقد بهته»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ التعريف النبوي للغيبة بأنها ذكر الإنسان بما يكره — ولو كان صدقاً — وبهتانه إن لم يكن فيه."
