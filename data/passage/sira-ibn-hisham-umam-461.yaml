text: "… وحَذْرَهُمْ ما حَذَّرَهم. اختلاف الأحزاب فيما بينهم: فلما كانَتْ ليلة السَّبْتِ مِنْ شَوَّالٍ سَنَةً خَمْسٍ، وكان من صُنع اللّٰه لرسوله للِهِ أَنْ أرسل أبو سفيان بْنُ حَرْبٍ ورؤوسُ غَطَفَانَ إلى بني قُرَيْظَةَ عِكْرِمَةَ بن أبي جهل في نَفَرِ من قريش …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 461، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
