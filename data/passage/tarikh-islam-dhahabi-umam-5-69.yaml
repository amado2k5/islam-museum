text: "… أن قال : فمرّ عليه الدّهر فانهدم، فَبَنَتْه العمالقة، فمرّ عليه الدهر فانهدم، فَبَنَتْه جُرْهُم، فمرّ عليه الدَّهر فانهدم فَبَنَتْه قريش. وذكر في الحديث وضع النبيّ للي الحجر الأسود مكانه. وقال يونس، عن ابن إسحاق، حدّثني عبد اللّٰه بن أبي …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 69، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 5, p. 69, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 5، ص 69 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
