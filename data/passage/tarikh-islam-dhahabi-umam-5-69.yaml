  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 5. cildinin 69. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
