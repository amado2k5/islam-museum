text: "… أن قال : فمرّ عليه الدّهر فانهدم، فَبَنَتْه العمالقة، فمرّ عليه الدهر فانهدم، فَبَنَتْه جُرْهُم، فمرّ عليه الدَّهر فانهدم فَبَنَتْه قريش. وذكر في الحديث وضع النبيّ للي الحجر الأسود مكانه. وقال يونس، عن ابن إسحاق، حدّثني عبد اللّٰه بن أبي …"
summary:
