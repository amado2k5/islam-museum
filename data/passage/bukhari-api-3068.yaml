text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا يَحْيَى، عَنْ عُبَيْدِ اللَّهِ، قَالَ أَخْبَرَنِي نَافِعٌ، أَنَّ عَبْدًا، لاِبْنِ عُمَرَ أَبَقَ فَلَحِقَ بِالرُّومِ، فَظَهَرَ عَلَيْهِ خَالِدُ بْنُ الْوَلِيدِ، فَرَدَّهُ عَلَى عَبْدِ اللَّهِ، وَأَنَّ فَرَسًا لاِبْنِ عُمَرَ عَارَ فَلَحِقَ بِالرُّومِ، فَظَهَرَ عَلَيْهِ فَرَدُّوهُ عَلَى عَبْدِ اللَّهِ. قَالَ أَبُو عَبْد اللَّهِ عَارَ مُشْتَقٌّ مِنْ الْعَيْرِ وَهُوَ حِمَارُ وَحْشٍ أَيْ هَرَبَ"
summary:
  ar: "حديث في صحيح البخاري، رقم 3068، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3068 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3068، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
