text: "… فقال: يا رسول الله، ما الإيمان؟ فقال: الإيمان: أن تؤمن بالله وملائكته وكتبه ولقائه ورسله وتؤمن بالبعث الآخر، قال: يا رسول الله، ما الإسلام؟ قال: أن تعبد اللّٰه ولا تشرك به شيئاً وتقيم الصلاة المكتوبة وتؤتي الزكاة المفروضة وتصوم رمضان …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 6623، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 6623, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, belief in God, His angels, His books and His messengers, the question about faith and its answer, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 6623 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 6623, que menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, la creencia en Dios, sus ángeles, sus libros y sus mensajeros, la cuestión de la fe y su respuesta, y la creencia en la resurrección. Este fragmento, extraído de la lectura automática y citado en un máximo de cuarenta palabras según la política de fuentes, se encuentra en la lista de Pillars and Branches of Faith Browser."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 6623, qui évoque l'islam défini par ses actes (la prière, la zakat, le jeûne et le pèlerinage), la croyance en Dieu, Ses anges, Ses livres et Ses messagers, la question de la foi et sa réponse, ainsi que la croyance en la résurrection. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 6623. sayfasından bir alıntı, İslam'ı namaz, zekât, oruç ve Hac gibi ibadetlerin yanı sıra Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inançla tanımlar. Ayrıca imanla ilgili soruları ve cevaplarını, kıyamete olan inancı da ele alır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Ibn Abi Shaybah, Volume 2, halaman 6623, mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya. Kutipan ini juga membahas pertanyaan-pertanyaan tentang iman dan jawabannya, serta kepercayaan pada hari kiamat. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
