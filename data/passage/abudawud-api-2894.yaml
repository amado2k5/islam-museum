label: { ar: "سنن أبي داود 2894 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 2894 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 2894 — ترکہ اور میراث", es: "Sunan Abi Dawud 2894 — lo que quedó: patrimonio y herencia", fr: "Sunan Abi Dawud 2894 — Ce qui a été laissé derrière: biens et héritage", tr: "Sunan Abi Davud 2894 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sunan Abi Dawud 2894 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… عَنْ عُثْمَانَ بْنِ إِسْحَاقَ بْنِ خَرَشَةَ، عَنْ قَبِيصَةَ بْنِ ذُؤَيْبٍ، أَنَّهُ قَالَ جَاءَتِ الْجَدَّةُ إِلَى أَبِي بَكْرٍ الصِّدِّيقِ تَسْأَلُهُ مِيرَاثَهَا فَقَالَ مَا لَكِ فِي كِتَابِ اللَّهِ تَعَالَى شَىْءٌ وَمَا عَلِمْتُ لَكِ فِي سُنَّةِ نَبِيِّ اللَّهِ شَيْئًا فَارْجِعِي حَتَّى أَسْأَلَ النَّاسَ. فَسَأَلَ النَّاسَ فَقَالَ الْمُغِيرَةُ بْنُ شُعْبَةَ حَضَرْتُ رَسُولَ اللَّهِ أَعْطَاهَا السُّدُسَ. فَقَالَ أَبُو بَكْرٍ هَلْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2894، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2894 (Shares of Inheritance (Kitab Al-Fara'id)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2894، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 2894 (Partes de la herencia (Kitab Al-Fara'id)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2894 (Partage de l'héritage), mentionne ce qui a été laissé: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 2894 numaralı hadiste, Peygamber Efendimiz'in geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2894, menyebutkan apa yang ditinggalkannya berupa harta warisan. Informasi ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam suci, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
