  id: "Cuplikan dari Ihya Ulum al-Din, Volume 2, halaman 575, yang menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
