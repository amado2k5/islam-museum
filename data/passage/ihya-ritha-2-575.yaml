text: "… وسمدا، وعبد الرحمن. وقال يشهدكم عبد اللّه بن ممر واليس له من الأمر شيء، كبيئة التعزية له. فإن أصابت الإمارة سعدا فداك، وإلا فليسة من به أيكم أمر فإنى لم أعزله من عجز ولا خيانة. وقال: أوصى الحليفة من بعدى …"
summary:
  ar: "مقطع من إحياء علوم الدين، المجلد المصوَّر 2، ص 575، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 2, p. 575, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 2، ص 575 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
