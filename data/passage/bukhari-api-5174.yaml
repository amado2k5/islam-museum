label: { ar: "صحيح البخاري 5174 — المرض والمريض، عيادة المريض", en: "Sahih al-Bukhari 5174 — illness and the sick; visiting the sick", ur: "صحیح بخاری 5174 — بیماری اور بیمار، بیمار کی عیادت", es: "Sahih al-Bukhari 5174 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sahih al-Bukhari 5174 — la maladie et les malades; rendre visite aux malades", tr: "Sahih el-Buhari 5174 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sahih al-Bukhari 5174 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ سُفْيَانَ، قَالَ حَدَّثَنِي مَنْصُورٌ، عَنْ أَبِي وَائِلٍ، عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ قَالَ \" فُكُّوا الْعَانِيَ، وَأَجِيبُوا الدَّاعِيَ، وَعُودُوا الْمَرِيضَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5174، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5174 (Wedlock, Marriage (Nikaah)), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5174، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5174 (Matrimonio (Nikaah)), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5174 (Mariage, Nikah), mentionne la maladie et les malades, ainsi que les visites aux malades. Le dictionnaire de référence des textes médicaux (Medicine Browser) le classe parmi les ouvrages traitant de médecine prophétique, de médecine, d'anatomie, de chirurgie, de médicaments et de traitements."
  tr: "Sahih el-Buhari'de 5174 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5174, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
