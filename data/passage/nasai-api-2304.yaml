label: { ar: "سنن النسائي 2304 — الأب والأبوة", en: "Sunan al-Nasa'i 2304 — the father and fatherhood", ur: "سنن نسائی 2304 — باپ اور والدیت" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ إِسْمَاعِيلَ بْنِ إِبْرَاهِيمَ، عَنْ مُحَمَّدِ بْنِ بِشْرٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ حَمْزَةَ بْنِ عَمْرٍو الأَسْلَمِيِّ، أَنَّهُ سَأَلَ رَسُولَ اللَّهِ أَصُومُ فِي السَّفَرِ قَالَ \" إِنْ شِئْتَ فَصُمْ وَإِنْ شِئْتَ فَأَفْطِرْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2304، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2304 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2304، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
