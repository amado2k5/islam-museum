label: { ar: "سنن النسائي 5527 — الأب والأبوة", en: "Sunan al-Nasa'i 5527 — the father and fatherhood", ur: "سنن نسائی 5527 — باپ اور والدیت", es: "Sunan al-Nasa'i 5527 — El padre y la paternidad" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ حَدَّثَنَا الْمُعْتَمِرُ، عَنْ أَبِيهِ، عَنْ حُصَيْنٍ، عَنْ هِلاَلِ بْنِ يِسَافٍ، عَنْ فَرْوَةَ بْنِ نَوْفَلٍ، قَالَ سَأَلْتُ عَائِشَةَ فَقُلْتُ حَدِّثِينِي بِشَىْءٍ، كَانَ رَسُولُ اللَّهِ يَدْعُو بِهِ قَالَتْ كَانَ رَسُولُ اللَّهِ يَقُولُ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5527، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5527 (The Book of Seeking Refuge with Allah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5527، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5527 (El Libro de la Búsqueda de Refugio en Alá), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
