text: "… تغييره ؟ قال : ما أدري ما واجب إن غيَّر، فهو فضل. وقالٍ إسحاق بن راهويه : هو واجبٌ على كلِّ مسلمٍ، إلا أنْ يخشى على نفسه، ولعلَّ أحمد يتوقَّفُ في إطلاقه الواجب على ما ليس بواجبٍ على الأعيان، بل …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 621، يرد فيه ذكر فرض العين، وما وجب على كل مسلم، والواجب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 621, whose wording mentions the individual obligation (fard 'ayn), a duty laid on every Muslim, the obligatory (wajib), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 621 کا اقتباس جس میں فرضِ عین، جو ہر مسلمان پر لازم ہے، واجب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volume numérisé 2, p. 621, dont le texte mentionne l'obligation individuelle (fard 'ayn), un devoir imposé à chaque musulman, l'obligatoire (wajib), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen digitalizado 2, p. 621, cuyo texto menciona la obligación individual (fard 'ayn), un deber impuesto a cada musulmán, lo obligatorio (wajib), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 621. sayfasından bir alıntı, bireysel yükümlülükleri, her Müslümanın üzerine düşen görevleri, farz olan ve olmayan şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 621, membahas kewajiban individu, apa yang wajib dilakukan oleh setiap Muslim, apa yang wajib, dan apa yang tidak wajib. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
