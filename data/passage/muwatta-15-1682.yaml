label: { ar: "الموطأ 1682 — مالك: بلغه أن عمر قال في المرأة يطلقها زوجها وهو غائب عنها ثم يراجعها فلا يبلغها رجعته فتزوجت، إن دخل بها الآخر أو لم يدخل فلا سبيل للأول إليها", en: "Muwatta 1682", es: "Muwatta 1682", fr: "Muwatta 1682", ur: "موطا 1682", tr: "El-Muvatta 1682 — Malik: Ona, Ömer'in, kocası yanında olmadığı halde onu boşayan, sonra geri alan ama bunu ona bildirmeyen bir kadın hakkında şöyle dediği rivayet edildi: Kadın başka bir adamla evlenir; bu adam evliliği tamamlasa da tamamlamasa da, ilk adamın o kadın üzerinde hiçbir hakkı yoktur.", id: "Al-Muwatta 1682 — Malik: Diriwayatkan kepadanya bahwa Umar berkata tentang seorang wanita yang diceraikan suaminya saat ia tidak ada di sisinya, kemudian suaminya mengambilnya kembali tanpa memberitahukannya, sehingga wanita itu menikah dengan pria lain, baik pria pertama itu melakukan hubungan suami istri dengannya atau tidak, pria pertama itu tidak memiliki hak atas wanita tersebut." }
summary:
  ar: "يقول مالك وبلغني أن عمر بن الخطاب قال في المرأة يطلقها زوجها وهو غائب عنها، ثم يراجعها فلا يبلغها رجعته، وقد بلغها طلاقه إياها، فتزوجت، أنه إن دخل بها زوجها الآخر أو لم يدخل بها، فلا سبيل لزوجها الأول الذي كان طلقها إليها. قال مالك وهذا أحب ما سمعت إلي في هذا وفي المفقود. {cite:muwatta-maruf-1997 p.89}"
  tr: "Malik şöyle dedi ve bana da ulaştı ki, Ömer ibn el-Hattab, kocası yokken onu boşayan, sonra geri alan ama geri aldığını ona bildirmeyen, oysa boşanmadan haberdar olan ve daha sonra başka bir adamla evlenen bir kadın hakkında şöyle demiştir: İkinci kocası evliliği tamamlasa da tamamlamasa da, onu boşayan ilk kocanın ona hiçbir hakkı yoktur. Malik dedi ki, “Bu, bu konuda ve kayıp kişi konusunda duyduğum en tercih edilebilir görüştür.” {cite:muwatta-maruf-1997 s.89}"
  id: "Malik berkata, dan sampai kepadaku bahwa Umar bin al-Khattab berkata mengenai seorang wanita yang diceraikan suaminya saat ia tidak ada di rumah, kemudian suaminya mengambilnya kembali tetapi tidak memberitahukannya tentang pengambilan tersebut, padahal ia telah diberitahu tentang perceraian itu, dan kemudian ia menikah dengan pria lain: baik suami keduanya melakukan hubungan suami istri atau tidak, suami pertamanya yang menceraikannya tidak memiliki hak atas dirinya. Malik berkata, “Ini adalah pendapat yang paling baik yang pernah kudengar mengenai masalah ini dan mengenai orang yang hilang.” {cite:muwatta-maruf-1997 p.89}"
