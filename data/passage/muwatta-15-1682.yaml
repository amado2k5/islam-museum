label: { ar: "الموطأ 1682 — مالك: بلغه أن عمر قال في المرأة يطلقها زوجها وهو غائب عنها ثم يراجعها فلا يبلغها رجعته فتزوجت، إن دخل بها الآخر أو لم يدخل فلا سبيل للأول إليها", en: "Muwatta 1682" }
summary:
  ar: "يقول مالك وبلغني أن عمر بن الخطاب قال في المرأة يطلقها زوجها وهو غائب عنها، ثم يراجعها فلا يبلغها رجعته، وقد بلغها طلاقه إياها، فتزوجت، أنه إن دخل بها زوجها الآخر أو لم يدخل بها، فلا سبيل لزوجها الأول الذي كان طلقها إليها. قال مالك وهذا أحب ما سمعت إلي في هذا وفي المفقود. {cite:muwatta-maruf-1997 p.89}"
