text: "… بن زيد ابن حارثة الكلبي ثوبان بن مُجْدُد جبير بن مطع الحارث بن ربعي حكيم بن حزام حويطب بن عبد العُزّى العامري معبد بن يربوع بن عنكثة مرة بن شراحيل الهمداني النعيمان بن عمرو سودة بنت زمعة سنة خمس وخمسين …"
summary:
  ar: "مقطع من البداية والنهاية، المجلد المصوَّر 4، ص 720، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Bidaya wa-l-Nihaya, scan volume 4, p. 720, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "البدایہ والنہایہ، اسکین جلد 4، ص 720 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Bidaya wa-l-Nihaya, volume numérisé 4, p. 720, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Bidaya wa-l-Nihaya, volumen escaneado 4, p. 720, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"Başlangıç ve Son\" adlı resimli kitabın 4. cildinin 720. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Awal dan Akhir,\" Jilid Bergambar 4, halaman 720, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
