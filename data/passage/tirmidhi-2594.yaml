label:
  ar: "الترمذي 2594 — أخرجوا من النار من ذكرني يوما أو خافني"
  en: "Tirmidhi 2594 — Bring out of the Fire whoever remembered Me for a day or feared Me"
  ur: "ترمذی 2594 — آگ سے اسے نکالو جس نے ایک دن مجھے یاد کیا یا مجھ سے ڈرا"
text: "يقول الله أخرجوا من النار من ذكرني يوما أو خافني في مقام . قال هذا حديث حسن غريب ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2594: أخرجوا من النار من ذكرني يوما أو خافني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2594: Bring out of the Fire whoever remembered Me for a day or feared Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2594: آگ سے اسے نکالو جس نے ایک دن مجھے یاد کیا یا مجھ سے ڈرا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
