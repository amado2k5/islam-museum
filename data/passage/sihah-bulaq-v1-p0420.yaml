text: |-
  (فصل الحاء
  حدد)
  ٢٢١٩
  جودين وقد جيدت الارض فهى مجودة قال الراجز
  رعيتها أكرم عودعودا الصل والصفصل والبعضيدا والخاز باز الستم الجودا ١
  وجاد الرحل بماله يجود جودا بالضم فهوجواد وقوم جود مثل قذال وقذل واغاسكنت
  الواولانها حرف علة واجوادوأجاود وجوداء وكذلك امرأة جواد ونسوة جود مثل نوار
  ونور قال الشاعر أبوشهاب الهذلى
  صسناع بأشفاهاحصان بشكرها * جوادبقوت البطن والعرق زاخز
  واتا ليوربجود إلنواوجوا لذرو الأ خوني لجيادوا يباد البادب ى مار
  جبل يمكة سمى بذلك لموضع خيل تبع وسمى قعية عان لموضع سلاحه وجاد الشئ جودة
  وجودة أى صارجيدا وجادينفه عند الموت يجود جؤودا والجواد بالضم العطش
  قال الباهلى ونصرك خاذل عنى بطى . كأن بكم الى خذلى جوادا
  نقول منه حيد الرجل يجادفهو مجود والجودة العطنة قال ذوالرمة
  تظل تعاطيه اذا جيد جودة * رضابا كطعم الرنجبيل المعسل
  والجودىّ جبل بأرض الجزيرة استوت عليه-فينة نوح عليه السلام وقرأ الاعمش واستوت
  على الجودى بارسال الياء وذلك جائز للتخفيف أو يكون سمى بفعل الانى مثل خطى ثم أدخل
  عليه الالف واللام عن الفرّاء وأجاد الرجل اذا كان.عمذرس جواد واجدت الشى
  فجاد والتجويد مثله وقد قالوا أجودت كما قالوا أطال وأطول وأحال وأحول وأطاب وأطيب
  وألان وألين على النقصان والتمام وشاءر مجواد أى مجيد كثيرا واجدبه النقد أعطيته
  حيادا واستجدت الشى عددته جيدا وجاودت الرجل من الجود كما تقول ماجدته من المجد
  والجيد العنق والجمع أجياد والجيد بالتحريك طول العنق وحسنه رجل أجيد وامرأة جيداء
  والجممع جود والجادى الزعفران وقال الشاءر كشير
  يباشرن فار المسك فى كل مهجع * ويشرق بادىّ بهنّ -فيدا
  أى مدوف
  صل الحاء تد حتد بالمكان يحتد أقام به وببت والمحتد الاصل يقسال فلان
  من محتد صدق ومحتد صدقوعين حتديضم الحاء والتاء اذا كان لا يتقطع ماؤها من عيون
  الارض:⁦( حدد)⁩ الحد الحاجز بين الشيئين وحدّ الشئء منتهاه تقول حددت الدار أحدّها
  حدا والتحديد مثله وفلان حديد فلان اذاكان أرضه الى جنب أرضه والحد المنع
  ومنه قيل للبوّاب حداد قال الاعشى
  فقمنا ولما يصح ديكا * الى جونة عند حدادها
  ويقال للسجان حدادلاته يمنع من اللخروح أولانه يعالج الحديد من القيود قال الشاءر
  يقول لى الحداد رهو يقودنى * الى السمن لا تجزع قابك من باس
  والمدود الممنوع من البخت وغيره وه_ذا أهر حدد أى منيع حرام لا يحل ارتكابه ودعوة
  حدد أى باطلة ودونه حدد أى منع وقال الشاعر زيد بن عمروبن نفيل
  لا تعبدن الهادون خالقكم * فان دعيتم فولوادونه حدد
  ٥٦
  محاح
