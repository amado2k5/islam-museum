label: { ar: "سنن أبي داود 5272 — الأب والأبوة", en: "Sunan Abi Dawud 5272 — the father and fatherhood", ur: "سنن ابی داؤد 5272 — باپ اور والدیت" }
text: "… حَدَّثَنَا عَبْدُ الْعَزِيزِ، - يَعْنِي ابْنَ مُحَمَّدٍ عَنْ أَبِي الْيَمَانِ، عَنْ شَدَّادِ بْنِ أَبِي عَمْرِو بْنِ حِمَاسٍ، عَنْ أَبِيهِ، عَنْ حَمْزَةَ بْنِ أَبِي أُسَيْدٍ الأَنْصَارِيِّ، عَنْ أَبِيهِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ وَهُوَ خَارِجٌ مِنَ الْمَسْجِدِ فَاخْتَلَطَ الرِّجَالُ مَعَ النِّسَاءِ فِي الطَّرِيقِ فَقَالَ رَسُولُ اللَّهِ لِلنِّسَاءِ \" اسْتَأْخِرْنَ فَإِنَّهُ لَيْسَ لَكُنَّ أَنْ تَحْقُقْنَ الطَّرِيقَ عَلَيْكُنَّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5272، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5272 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5272، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
