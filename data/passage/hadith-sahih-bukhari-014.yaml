text: "ل لها: ((لا تؤذيني في هائشة، فإن الوخي 2578 - قوله: (وإنهم) في نسخة بفتح الهمزة وفي نسخة بكسرها اه. 2579 - قوله: (بعثت إليها) بهذا الضبط لأبي ذر قال في الفتح وهو الصواب وضبط بفتح الموحدة وسكون المثلثة وتاء"
