label: { ar: "جامع الترمذي 364 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 364 — what was left behind: estate and inheritance", ur: "جامع ترمذی 364 — ترکہ اور میراث", es: "Jami' al-Tirmidhi 364 — Lo que quedó: patrimonio y herencia" }
text: "… بْنِ شُبَيْلٍ عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ. وَجَابِرٌ الْجُعْفِيُّ قَدْ ضَعَّفَهُ بَعْضُ أَهْلِ الْعِلْمِ تَرَكَهُ يَحْيَى بْنُ سَعِيدٍ وَعَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ وَغَيْرُهُمَا. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ أَنَّ الرَّجُلَ إِذَا قَامَ فِي الرَّكْعَتَيْنِ مَضَى فِي صَلاَتِهِ وَسَجَدَ سَجْدَتَيْنِ مِنْهُمْ مَنْ رَأَى قَبْلَ التَّسْلِيمِ وَمِنْهُمْ مَنْ رَأَى بَعْدَ التَّسْلِيمِ. وَمَنْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 364، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 364 (The Book on Salat (Prayer)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 364، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 364 (El Libro de la Oración), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
