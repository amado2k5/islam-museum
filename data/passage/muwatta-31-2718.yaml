label: { ar: "الموطأ 2718 — زيد بن أسلم: الرجل الذي احتقن جرحه الدم فسأل النبي أيكما أطب", en: "Muwatta 2718", es: "Muwatta 2718", fr: "Muwatta 2718", ur: "موطا 2718", tr: "El-Muvatta 2718 — Zeyd ibn Aslam: Yarası kanla enfeksiyon kapan adam Peygambere sordu: \"Hanginiz beni tedavi etmede daha iyidir?\"", id: "Al-Muwatta 2718 — Zayd ibn Aslam: Seorang pria yang lukanya bernanah bertanya kepada Nabi, “Siapakah di antara kalian yang lebih ahli dalam mengobatiku?”" }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رجلا في زمان رسول الله أصابه جرح فاحتقن الجرح الدم، فدعا رجلين من بني أنمار فنظرا إليه، فزعما أن رسول الله قال لهما: أيكما أطب؟ فقالا: أوفي الطب خير يا رسول الله؟ فزعم زيد أن رسول الله قال: أنزل الدواء الذي أنزل الأدواء. ويذكر المحقق قول ابن عبد البر أن الحديث منقطع في رواية الجماعة، وأن عاصم بن عمر رواه عن سهيل بن أبي صالح عن أبي هريرة موصولا في شطره الأول. {cite:muwatta-maruf-1997 p.532}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa seorang pria pada zaman Rasulullah shalla Allahu alaihi wa sallam menderita luka, dan luka tersebut bernanah. Ia memanggil dua orang dari suku Anmar, dan mereka memeriksanya. Mereka mengklaim bahwa Rasulullah shalla Allahu alaihi wa sallam bertanya kepada mereka, \"Siapakah di antara kalian yang lebih ahli dalam pengobatan?\" Mereka menjawab, \"Apakah ada kebaikan dalam pengobatan, wahai Rasulullah?\" Zayd mengklaim bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda, \"Barangsiapa yang menurunkan penyakit, ia juga menurunkan obatnya.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits tersebut terputus dalam riwayat kelompok tersebut, dan bahwa Asim ibn Umar meriwayatkannya dari Suhayl ibn Abi Salih dari Abu Hurayrah dengan sanad yang terhubung pada bagian pertamanya. {cite:muwatta-maruf-1997 p.532}"
