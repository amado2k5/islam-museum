label: { ar: "الموطأ 2718 — زيد بن أسلم: الرجل الذي احتقن جرحه الدم فسأل النبي أيكما أطب", en: "Muwatta 2718" }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رجلا في زمان رسول الله أصابه جرح فاحتقن الجرح الدم، فدعا رجلين من بني أنمار فنظرا إليه، فزعما أن رسول الله قال لهما: أيكما أطب؟ فقالا: أوفي الطب خير يا رسول الله؟ فزعم زيد أن رسول الله قال: أنزل الدواء الذي أنزل الأدواء. ويذكر المحقق قول ابن عبد البر أن الحديث منقطع في رواية الجماعة، وأن عاصم بن عمر رواه عن سهيل بن أبي صالح عن أبي هريرة موصولا في شطره الأول. {cite:muwatta-maruf-1997 p.532}"
