label: { ar: "الموطأ 1031 — مالك: أما ما ضر من الطير فإن المحرم لا يقتله، إلا ما سمى النبي الغراب والحدأة، وإن قتل المحرم شيئاً من الطير سواهما فداه", en: "Muwatta 1031", es: "Muwatta 1031", fr: "Muwatta 1031", ur: "موطا 1031", tr: "El-Muvatta 1031 — Malik: Zararlı kuşlara gelince, ihramlı hacı, Peygamberin zikrettiği karga ve çaylak gibi kuşlar hariç, diğer kuşları öldüremez. İhramlı hacı bu ikisi dışında herhangi bir kuşu öldürürse, fidye ödemek zorundadır.", id: "Al-Muwatta 1031 — Malik: Adapun burung-burung yang berbahaya, seorang jamaah haji yang sedang ihram tidak boleh membunuhnya, kecuali burung-burung yang disebutkan oleh Nabi, seperti gagak dan elang. Jika seorang jamaah haji yang sedang ihram membunuh burung selain kedua burung tersebut, maka ia harus membayar tebusan." }
text: "أما ما ضر من الطير فإن المحرم لا يقتله إلا ما سمى النبي الغراب والحدأة، وإن قتل المحرم شيئاً من الطير سواهما فداه"
summary:
  ar: "قول لمالك: أما ما ضر من الطير فإن المحرم لا يقتله، إلا ما سمى النبي الغراب والحدأة، وإن قتل المحرم شيئاً من الطير سواهما فداه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1188). {cite:muwatta-maruf-1997 p.481}"
  tr: "Malik şöyle demiştir: “Zararlı kuşlara gelince, ihramlı bir hacı, Peygamberimiz tarafından özellikle zikredilenler, örneğin karga ve çaylak dışında, onları öldüremez. İhramlı bir hacı bu ikisi dışında başka bir kuş öldürürse, fidye ödemek zorundadır.” Araştırmacı, bunun Malik'ten Ebu Mus'ab (1188) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.481}"
  id: "Malik berkata: “Adapun burung-burung yang berbahaya, seorang jamaah haji yang sedang ihram tidak boleh membunuhnya, kecuali burung-burung yang secara khusus disebutkan oleh Nabi (shalawat dan salam kepadanya), seperti gagak dan layang-layang. Jika seorang jamaah haji yang sedang ihram membunuh burung lain selain kedua burung tersebut, maka ia harus membayar tebusan.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1188). {cite:muwatta-maruf-1997 p.481}"
