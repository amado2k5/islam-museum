label: { ar: "صحيح البخاري 5660 — محو السيئات وحط الخطايا", en: "Sahih al-Bukhari 5660 — bad deeds erased and sins shed", ur: "صحیح بخاری 5660 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… بِيَدِي فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّكَ تُوعَكُ وَعْكًا شَدِيدًا. فَقَالَ رَسُولُ اللَّهِ \" أَجَلْ إِنِّي أُوعَكُ كَمَا يُوعَكُ رَجُلاَنِ مِنْكُمْ \". فَقُلْتُ ذَلِكَ أَنَّ لَكَ أَجْرَيْنِ. فَقَالَ رَسُولُ اللَّهِ \" أَجَلْ \". ثُمَّ قَالَ رَسُولُ اللَّهِ \" مَا مِنْ مُسْلِمٍ يُصِيبُهُ أَذًى مَرَضٌ فَمَا سِوَاهُ إِلاَّ حَطَّ اللَّهُ لَهُ سَيِّئَاتِهِ كَمَا تَحُطُّ الشَّجَرَةُ وَرَقَهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5660، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 5660 (Patients), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 5660، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
