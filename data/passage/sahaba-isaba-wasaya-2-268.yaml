text: "تراجم الرجال حرف الحاء البرصاء فلقي سعد بن أبي وقاص فأخبره. قال سعيد: وروى داود بن رشيد عن عمرو بن معروف، قال: لما فلقيني سعد وأنا أريد المسجد؛ فقال: الحقني فتبعته احتضر الحارث اجتمع الناس إليه؛ فقالوا : أوصنا ؛ …"
