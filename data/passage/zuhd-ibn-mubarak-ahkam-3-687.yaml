text: "… ثواب ذلك فى الفريضة وإن لم يفعله فى الفريضة، وإنما فعله فى التطوع، ويحتمل أن يراد ما ترك من الفرائض رأساً فلم يصله فيعوض عنه من التطوع والله تعالى يقبل من التطوعات الصحيحة عوضا عن الصلاة المفروضه ولله سبحانه أن …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 687، يرد فيه ذكر الفريضة والفرائض، والفرض، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 687, whose wording mentions the obligation (farida), the obligatory (fard), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 687 کا اقتباس جس میں فریضہ اور فرائض، فرض، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ibn al-Mubarak, volume numérisé 3, p. 687, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Zuhd de Ibn al-Mubarak, volumen digitalizado 3, p. 687, cuyo texto menciona la obligación (farida), lo obligatorio (fard), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zühd) adlı eserinin 3. cildinin 687. sayfasından bir alıntı, farz olan amelleri, görevleri ve gönüllü amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Alıntıda farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh edilen amelleri, haram olan amelleri ve küçük günahları içeren bir bölüm bulunmaktadır."
  id: "Sebuah kutipan dari kitab Ibn al-Mubarak, \"Al-Zuhd\" (Asketisme), Jilid 3, halaman 687, menyebutkan amalan wajib, kewajiban, dan amalan sunnah. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Kutipan ini mencakup bagian tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
