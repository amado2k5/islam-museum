text: "… ثواب ذلك فى الفريضة وإن لم يفعله فى الفريضة، وإنما فعله فى التطوع، ويحتمل أن يراد ما ترك من الفرائض رأساً فلم يصله فيعوض عنه من التطوع والله تعالى يقبل من التطوعات الصحيحة عوضا عن الصلاة المفروضه ولله سبحانه أن …"
