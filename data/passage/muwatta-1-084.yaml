summary:
  ar: "فتوى لمالك في باب ما جاء في المسح على الخفين: سُئل عن رجل توضأ وعليه خفاه فسها عن المسح عليهما حتى جف وضوؤه وصلى، فقال: ليمسح على خفيه وليعد الصلاة ولا يعيد الوضوء. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.79}"
