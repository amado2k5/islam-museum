label: { ar: "الموطأ 84 — مالك فيمن سها عن المسح على الخفين حتى صلى", en: "Muwatta 84", es: "Muwatta 84", fr: "Muwatta 84", ur: "موطا 84", tr: "El-Muvatta 84 — Malik, namaza kadar çoraplarını silmeyi unutan kişi hakkında.", id: "Al-Muwatta 84 — Malik tentang seseorang yang lupa mengusap kaus kakinya sampai ia shalat" }
summary:
  ar: "فتوى لمالك في باب ما جاء في المسح على الخفين: سُئل عن رجل توضأ وعليه خفاه فسها عن المسح عليهما حتى جف وضوؤه وصلى، فقال: ليمسح على خفيه وليعد الصلاة ولا يعيد الوضوء. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.79}"
  tr: "Malik'in çorap üzerinden meshetme ile ilgili fetvası: Kendisine, çorap giymiş halde abdest alan, ancak abdest suyu kuruyana kadar çorap üzerinden meshetmeyi unutan ve namaz kılan bir adam hakkında soru soruldu. Malik şöyle dedi: Çorap üzerinden meshetmeli ve namazı tekrar kılmalıdır, ancak abdesti tekrar etmesine gerek yoktur. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.79}"
  id: "Fatwa Malik tentang mengusap kaus kaki: Beliau ditanya tentang seorang pria yang berwudhu sambil mengenakan kaus kaki, tetapi lupa mengusapnya hingga air wudhunya kering dan beliau shalat. Malik berkata: Ia harus mengusap kaus kakinya dan mengulangi shalat, tetapi ia tidak perlu mengulangi wudhu. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.79}"
