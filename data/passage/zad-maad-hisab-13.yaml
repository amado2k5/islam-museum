text: "… حديث أبي هريرة رضي اللَّه عنه قال: قال رسول اللّٰه مية: «إن في الجنة مئة درجة أعدها اللَّه للمجاهدين في سبيله، كلَّ درجتين ما بينهما كما بين السماء والأرض، فإذا سألتم اللَّه، فسلوه الفردوس، فإنه أوسط الجنة وأعلى الجنة، وفوقه …"
