text: "… إنما ولأكَ ذلك، لتحسنَ فيهم : فلما أكثروا، قال : لقد آن لسعد أن لا تأخذَه في اللّٰه لومةُ لاتم. فرجعَ بعضُ من كان معه من قومه إلى دار بني عبد الأشهل، فنَعى إليهم رجلاً من بني قريظة، قبلَ أن …"
