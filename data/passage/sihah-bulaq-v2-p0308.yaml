text: |-
  .ختم).
  ٢٧٩
  عو الفواخت والقمارى وساق -روالقطاوالوراشين وأشباه ذلك يقع على الذكر والانى
  لان الها اغادخلته على انه واحد من جنس لا للتأنيت وعند العامة انها الدواجن
  فقط الواحدة حامة قال حيدين تور الهلالى
  وماهاج هذا الشوق الاحامة • دعت ساف حرّرحة وترغا
  والحامة ههنا قرية وقال الاصمصى فى قول النابفة
  واحكم كمحكم فتاة الحاذنظرت • الى حام شراع وارد النمد
  هذه زرقاء المامة تظرت الى قطا ألاترى الى قواها
  لين الحام ليه * الى حامتيه * ونصفه قديه * تمّ القطاميه
  وقال الاموى والدواجن التى تستفرخ فى البيوت حام أيضا وأنشد
  قواطنامكة من ورق الحى * يريد الهام فخذف الميم وقلب الالفياء ويقال انه حذف الااف
  كما يحذف الممدود فاجتمع الممان فلزمه التضعيف فقلب أحدهماياء كما قالوا تظنيت وجع
  لهامة حام وسمامات وسمائم وربا قالواحام لاواحد قال الشاعر • حاماقفرة وقعا فطارا
  وقال جران العود
  وذكرنى الصبابعد التنائى • حامة أبسكة تدعوحاما
  والهام مشتداواحد الهامات المبنية وأمّا اليمام فهو الحام الوحشى وهو ضرب من طير
  المحراء وهذا قول الاصمعى وكان الكسائى" يقول الهام هو البرى واليمام هو الذى يألف
  البيوت والهام بالضم حى الابل وأرض محمة ذات حى والحامة الخاصة يقال كيف الحامة
  والعامة وهؤلا محامّة الرحل أى أقرباؤه وابل حامة اذا كانت خيارا وآل حم«ورفى القرآن.
  قال ابن مسعود رضى اللّٰه عنه آل حم ديساح القرآن قال الفراه انماهو كقولك آل فلان كانه
  نسب السوركاها الى حم قال الكميت
  وجد نالسكم فى آلحم آية • تأولها مناتقى ومعرب
  وأماقول العامَة الحواميم فليس من كلام العرب وقال أبو عبيدة الحواميم سور فى القرآن
  على غير القياس وأنشد • وبالحواميم التى قد سبعت * قال والاولى أن تجمع:ذوات حم
  وهان بصح الهاءاسم رجل ⁦(لحنتم)⁩ الهنتم الجزّة الخضراء والحناتم سدائب سودلان
  السواد عندهم خضرة (حنذم الخنذمان الجماعة ويقال الطائفة قال الشاعر
  وانازوارون بالمقنب العدا • اذا حقذمان الكوم طابت وطابها
  ⁦( حوم)⁩ حام الطائر وغيره حول الشيء يحوم -وما وحومانا أى دار والحوم القطيع
  الضخم من الابل وحومة القتال معظمه وكذلك من الماه والرمل وغيره والحومان موضع
  قال لبيديصف توروجش
  وأضحى يقترى الحومان فردا • كنضل السيف حودث بالصقال
  وحام أحدبنى نوح عليه السلام وهوأبو السودان بقال غلام حامى وعبدحامى
  صل الخا تم ختت الشى مختمافهو مختوم ومختم مدد للمبالغة وختم اللّٰه
  له يخير وختمت القرآن بلغت آخره واختمت الشى نقيض افتهحته واللهاتم وانلهاتم بكسر التاه
