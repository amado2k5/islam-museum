label: { ar: "سنن ابن ماجه 2284 — استحلال الشيء", en: "Sunan Ibn Majah 2284 — treating a thing as lawful", ur: "سنن ابن ماجہ 2284 — کسی چیز کو حلال ٹھہرانا", es: "Sunan Ibn Majah 2284 — tratar algo como lícito" }
text: "… أَنْ يُطْلِعَ النَّخْلُ فَلَمْ يُطْلِعِ النَّخْلُ شَيْئًا ذَلِكَ الْعَامَ فَقَالَ الْمُشْتَرِي هُوَ لِي حَتَّى يُطْلِعَ. وَقَالَ الْبَائِعُ إِنَّمَا بِعْتُكَ النَّخْلَ هَذِهِ السَّنَةَ. فَاخْتَصَمَا إِلَى رَسُولِ اللَّهِ ـ فَقَالَ لِلْبَائِعِ \" أَخَذَ مِنْ نَخْلِكَ شَيْئًا \". قَالَ لاَ. قَالَ \" فَبِمَ تَسْتَحِلُّ مَالَهُ ارْدُدْ عَلَيْهِ مَا أَخَذْتَ مِنْهُ وَلاَ تُسْلِمُوا فِي نَخْلٍ حَتَّى يَبْدُوَ صَلاَحُهُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2284، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2284 (The Chapters on Business Transactions), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2284، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2284 (Capítulos sobre transacciones comerciales), menciona el hecho de considerar algo como lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
