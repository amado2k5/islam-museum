text: "… النار قالوا : واستاقوا العر، وكانت العِير فيها خَمرٌ وأَدَمُ وزبيبٌ جاءوا به. من الطائف، فقدموا به على النبى. فقالت قُرَيش : قد استحلّ محمّد الشهر الحرام، فقد أصاب الدم والمال، وقد كان يُحرّم ذلك ويُعظِّمه. فقال من يرد عليهم …"
