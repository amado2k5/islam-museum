text: "… نجد في عبادتك ونسعى في طاعتك وقال يحيى بن قيس الكندي : أوصى شريح أن يصلى عليه في الجبانة، وأن لا يؤذن به أحد، وأن لا نتبعه صائحة، وأن لا يجعل على قبره تابوت، وأن يسرع به السير، وأن يلحد …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 321، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
