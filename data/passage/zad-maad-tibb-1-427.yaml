text: "… من عُكْلٍ وَعُرَيْنَةَ أَتَوْا رَسُولَ اللَّه ل، قَالُوا : يا رَسُولَ اللَّه! إِنَّا أَهْلُ ضَرْع، ولم نَكُنْ أَهْلَ ريف، فَاسْتَوْخَمْنَا المَدِينةَ، فَأَمَرَ لهم رَسُولُ اللّه بِذَوْدٍ، وأَمَرَهُم أَنْ يَخْرُجُوا فِيها، فَيَشْرَبُوا مِنْ أَلْبَانِهَا وأَبْوَالِهَا، فَلَمَّا صَحُّوا، قَتَلُوا راعِيَ رَسُولَ اللّه …"
