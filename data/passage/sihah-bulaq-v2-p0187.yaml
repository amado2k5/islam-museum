text: |-
  ٤٠٠
  وقد عرفت مغابنها وجادت • بدرتها قرى حجن قتين
  ⁦( تحزن)⁩ أبوز يد يقال ضريد فة حزنه بالزاى أى صرعه وقال ابن الاعرابى حتى تقهزن
  أى -تى وقع قال النغر القمزنة الهراوة. وأنشد
  جلدت جعار عندباب وجارها * بقعزتى عن جنبها جلدات
  رن لقرن للثور وغبره والقرن الخصلة من الشعرومنه قول أبي سفيان فى الروم ذات
  القرون قال الاصمعى أرادة رون شعورهم وكانوا يطولون ذلك فعرفوايه ويقال لامرأة
  قرفان أى ضفيرتان قال الاسدى
  كذيتم ويات اللّٰه لا تنكمونها • بن شاب قرناها نصر وتحاب
  أراديابى التى شاب قرناها فأضهره وذوالة ونين لقب اسكندر الرومى وكان يقال للمندرين
  ماء السماءذوالقرنين لضفيرتين كان يضفرهما فى قرنى رأسه فيرسلهما والقرن جبيل صغير
  منفرد والقرن حلبة منءرق والجمع القرون وأنشد الاصمعى
  تضمر بالاصائل كل يوم * تشنّ على سنابكها القرون
  بقال حلبنا الف رس قرنا أوقرنين أى عرقناه والقرن ثانون سنة ويقال ثلاثون سنة والقرن
  مثلك فى السنّ تقول هو على قرنى أى على سى والقرن من الناس أهل زمان واحد قال
  اذا ذهب القرن الذى أنت فيهم * وخلفت فى أون فأنت غريب
  والقرن أيضا العفلة السغيرة عن الاصعى" واختهم الى شريح فى جارية بهاقرن فقال
  أقعدوهافان أصاب الارض فهوعيب وان لم يصب الارض فليس بعيب والق-رن قرن
  الهودج قال حاجب المازنة
  صحاقلي وأقصر غيرأنى • أمس اذا مررت على الجهول
  كسون الفارسبة كل قرن • وزين الاشلة بالسدول
  والقرن جانب الرأس ويقال منسه سمى ذوالقرنين لانه دعاقومه الى اللّٰه تعالى فضربوه على
  قرنيه والة رنان منارتان تبنيات على رأس البثرويوضع فوقهسماختسية فتعلق البكرة فيها
  وقرن الشمس أعلاها وأول ما يبدومنها فى الطلوع والقرن بالتحريك الجعبة قال الاصححى
  القرن جعبة من جلود تكون مشقوقة ثم تخرزوانمانق -تى تصل الريح الى الريش فلا
  فد قال .
  با ابن مشام أههذ الناس اللبن • فكلهم بعدو بقوس وقرن
  والقون أيضا السيف والنبل ودجل قارن معه سيف ونبل والقرن حبل بقرن به البعيران
  قال جري
  أبلغ أبامسمع ان كنت لاقي* أنى لدى الباب كالمندود فى القرن
  والاقران المبال عن ابن السكيت والقرن البعبر المقرون بآخر وقال
  ولوعند غسان السليطى عرست • رعاقرن منهاوكاس عقير
  والقرن موضع وهوميقات أهل نجد ومنه أويس القرنىّ والقرن مصدرة ولك وجل أقرن
  بين القرن وه والمرون الحاجبين والقرن بالكسر حدة ول فى الشجاعة والقرنة بالضم
  الطرف الشاخص من كل شئ بقال قرنة الجبل وقرنة النصل وقرنة الرحم لاحدى شعبتي
  وقرن بين الحج والعمرة قرانا بالكسر وقرنت البعيرين أقرنهماة رنا اذا بجعتهما فى حبل واحد
