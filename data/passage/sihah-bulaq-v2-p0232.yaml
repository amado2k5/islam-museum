text: |-
  ٢٥٥
  ولا تقول أنت كى الا أنّ الضمير المنفصل عنههم كان بعنزلة المظهر فلد لك حسن وفارق المتصل
  ⁦( أون)⁩ الاون الدعة والسكينة والرفق تقول منه أنت آون أونا ورجل آين أى رافه
  وادع والاون أيضا المشى الرويدوهومبدل من الهون قال الراجز
  غيريابنت الحليس لونى * مزالد إلى واختلاف الجون * وسفركان قليل الاون
  ويقال أن على نفسك أى ارفق فى السير وا تدع وبيتناوبين مكة ثلاث لسال أوائن أى روافه
  وعشرليال آبنات أى وادعات والاون أحدجاي انارج تقول خرج ذوأونين وهما
  كالعدلين والاون العدل ومنه قولهم أون المهباراذا أكل وشرب وامتسلا يطنه وامتدت
  خاصر تاه فصار مثل الاون قال روّبة
  وسوص يدءو مخلصارب الفلق • سرّا وقد أون تاوين العقق
  يريدجمع العقوق وهى الحامل المقرب مثل رسول ورسل والاوان الجين والجمع آونة
  مثل زمان وأزمنة قال بعقوب يقال فلان يصنع ذلك الامر آونة اذا كان يصنعه حرارا
  ويدعه مرارا قال أبوز بيد
  حال أثقال أهل الوزاونة • أعطيهم الجهدمن بلهما أسع
  والاوان والايوان الصفة العظيمة كالازح ومنه ايوان كسرى وقال
  شطت نوى من أههم بالايوان • وجمع الاوان أون مثل خوان وخون ويجع الايوان ايوانات
  وأواوين-ثل ديوان ودواوين لانّ أصله اوان فأبدات من احدى الواوين ياء (اهن
  الاهان العرجون وجعه أهن ين الاين الاعياءقال أيوزيدلا يبنى منه فعل وقد
  خولف فيه والاين الحية مثل الايم وآن أينك أى حان حينك وآن لك أن تفعل كذا يئين أبنا
  عن أبي زيد أى حان مثل أنى لك وهومقلوب منه وأنشدابن السكيت
  ألما يتن ل أن تجلى عمايتى * واقصر عن ليلى بلى قد أنى ايا
  فجمع بين اللغتين وأين سؤال عن مكان اذا قلت أين زيدقانما تسأل عن مكانه وايان معناء أىّ
  حين و« وسؤال عن زمان من-ل مق قال اللّٰه تعالى أيان مرساها وايان بكسر الهمزة لغة
  سليم حكاها الفواء وبه قرأ السلمى ايان يعشون والان اسم للوقت الذى أنت فيه وهو ظرف
  غير متمكن وقع معرفة ولم تدخل عليه الالف واللام للتعريف لانه ليس له ما يشركه وربما
  تتهوامنه اللام وحذفوا الهمزتين وأنشد الاخفس
  وقد كنت تخقى حب سهراء حقبة * فبح لان منها بالذى أنت بأئح
  صل الباء ) ن بئنة بالتسكين الارض اللينة وبتصغيرها سميت بثينة والبثنية
  مُنطة:،نسوية الى موضع بالشأم وفي حديت خالدين الوليد فهما ألقى الشأم بوانيه وصاريثنية
  وعسلاع زلنى واستعمل غيرى وقال أبو الغوث كل حفظة تنبت فى الارض ال--هلة فهى بثنية
  خلاف الجبلية فجعله من الأول ( حن مجنة اسم امر أقنسبت اليهاتخلات كنّ عند
  بيتها كانت تقول هنّ بناتى فقبل بنات بجنة والبجونة القسربة الواسعة والواوزائدة
  والبحون العظيم البطن ⁦( بدن )⁩ بدن الانسان جسده وقوه تعالى قاليوم تجيك ببدنك
  فالوامجسد لاروح فيه قالَ الاخفسْ وأماقول من قال بدرعل فليس بشئ ورجل بدن أى
