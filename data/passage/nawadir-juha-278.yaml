text: "… أُريد أن أعرف إلى أين يصل صوتي كان يُؤَذْنُ، ويذهبُ مسرعاً، فسألوهُ عن السببِ، فقال: أريدُ أن أعرف إلى أين يصل صوتي. لا تريني وجهكِ وأريهِ مَنْ تشائين. زوّجوهُ بامرأة قبيحة المنظر، ففي الصباح، أراد الشيخ الانصراف فتقدَّمت إليه برشاقةٍ …"
summary:
