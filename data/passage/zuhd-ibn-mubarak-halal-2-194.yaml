  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 194. sayfasından, izin verilen, izin verilmeyen ve haram olan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
