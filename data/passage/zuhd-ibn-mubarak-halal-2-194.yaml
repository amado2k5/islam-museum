  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 2, p. 194, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 2، ص 194 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
