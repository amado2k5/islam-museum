text: "… لَهِيعةَ، حدَّثنا يزيدُ بن أبي حَبيبٍ، أنَّ سُوَيدَ بن قيسٍ أخبره، أنَّ عبدَ الرَّحمن بن معاويةَ بن حُدَيجِ أخبره قال: سأَل رجلٌ رسولَ اللّٰه وَلالفيه قال: يا رسولَ الله، ما يَحِلُّ لي ممَّا يَحرُمُ عليَّ؟ فسَكَتَ رسولُ اللّٰه وَلِهِ، فرَدَّ …"
summary:
