text: "… على زنة كتف وفي ز ولحيفة. أخرجه ابن سعد من طريق الأشعث ويونس عن الحسن ولفظه سمل قطيفة حمراء كان يلبسها وكان أرضاً ندية :. منسوبة إلى فدك، وقال العراقي : وفرشت في قبره قطيفة وقيل أخرجت وهذا أثبت سقط …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 1697، يذكر ما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 1697, that mentions what was left behind: estate and inheritance, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 1697 کا اقتباس جس میں ترکہ اور میراث، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 1, pág. 1697, que menciona lo que se dejó: patrimonio y herencia, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 1, page 1697, mentionnant les biens laissés: succession, sépulture, tombe ou lieu de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "Abdülrazzak'ın Musannaf'ının Resimli Cilt 1, s. 1697'den bir alıntı; mal varlığı, miras, defin, mezar ve türbesinden bahsediyor; makineyle okunabilir tıpkıbasım baskısından. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 1697, yang menyebutkan harta warisan, harta pusaka, pemakaman, makam, dan tempat sucinya; dari edisi faksimili yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, harta pusaka, barang antik, dan tempat suci."
