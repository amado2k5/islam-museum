label: { ar: "الموطأ 942 — عائشة: خرجنا مع رسول الله عام حجة الوداع، فمنا من أهل بعمرة، ومنا من أهل بحجة وعمرة، ومنا من أهل بالحج، وأهل رسول الله بالحج", en: "Muwatta 942" }
text: "خرجنا مع رسول الله عام حجة الوداع، فمنا من أهل بعمرة، ومنا من أهل بحجة وعمرة، ومنا من أهل بالحج، وأهل رسول الله بالحج"
summary:
  ar: "أول حديث في باب إفراد الحج. يرويه مالك عن أبي الأسود محمد بن عبد الرحمن عن عروة بن الزبير عن عائشة زوج النبي، أنها قالت: خرجنا مع رسول الله عام حجة الوداع، فمنا من أهل بعمرة، ومنا من أهل بحجة وعمرة، ومنا من أهل بالحج، وأهل رسول الله بالحج. فأما من أهل بعمرة فحل، وأما من أهل بحج أو جمع الحج والعمرة فلم يحلوا حتى كان يوم النحر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1075)، وأن البخاري وغيره رووه، وأن ابن عبد البر (التمهيد 17/239) رجا أن تكون رواية مالك فيه أصح. {cite:muwatta-maruf-1997 p.450} {cite:muwatta-maruf-1997 p.451}"
