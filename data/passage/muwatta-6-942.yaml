label: { ar: "الموطأ 942 — عائشة: خرجنا مع رسول الله عام حجة الوداع، فمنا من أهل بعمرة، ومنا من أهل بحجة وعمرة، ومنا من أهل بالحج، وأهل رسول الله بالحج", en: "Muwatta 942", es: "Muwatta 942", fr: "Muwatta 942", ur: "موطا 942", tr: "El-Muvatta 942 — Aişe: Biz, Veda Hac yılında Allah'ın Resulü ile birlikte çıktık. Bizden bazıları Umre için ihram giydi, bazıları hem Hac hem de Umre için ihram giydi, bazıları Hac için ihram giydi ve Allah'ın Resulü de Hac için ihram giydi.", id: "Al-Muwatta 942 — Aisyah: Kami berangkat bersama Rasulullah pada tahun Haji Perpisahan. Sebagian dari kami memasuki keadaan ihram untuk Umrah, sebagian dari kami memasuki keadaan ihram untuk Haji dan Umrah, sebagian dari kami memasuki keadaan ihram untuk Haji, dan Rasulullah pun memasuki keadaan ihram untuk Haji." }
text: "خرجنا مع رسول الله عام حجة الوداع، فمنا من أهل بعمرة، ومنا من أهل بحجة وعمرة، ومنا من أهل بالحج، وأهل رسول الله بالحج"
summary:
  ar: "أول حديث في باب إفراد الحج. يرويه مالك عن أبي الأسود محمد بن عبد الرحمن عن عروة بن الزبير عن عائشة زوج النبي، أنها قالت: خرجنا مع رسول الله عام حجة الوداع، فمنا من أهل بعمرة، ومنا من أهل بحجة وعمرة، ومنا من أهل بالحج، وأهل رسول الله بالحج. فأما من أهل بعمرة فحل، وأما من أهل بحج أو جمع الحج والعمرة فلم يحلوا حتى كان يوم النحر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1075)، وأن البخاري وغيره رووه، وأن ابن عبد البر ⁦(التمهيد 17/239)⁩ رجا أن تكون رواية مالك فيه أصح. {cite:muwatta-maruf-1997 p.450} {cite:muwatta-maruf-1997 p.451}"
  tr: "Hac ibadetini ayrı ayrı yerine getirme konusundaki bölümün ilk hadisi, Malik tarafından Ebu el-Esved Muhammed ibn Abd el-Rahman'dan, o da Urve ibn el-Zübeyr'den, o da Peygamberimizin eşi Aişe'den rivayet edilmiştir. Aişe şöyle demiştir: \"Biz, Veda Hac yılında Resulullah ile birlikte yola çıktık. Bizden bazıları Umre için, bazıları hem Hac hem de Umre için, bazıları da sadece Hac için ihrama girdi. Resulullah da sadece Hac için ihrama girdi. Umre için ihrama girenler ihramdan çıktılar, Hac veya Hac ve Umreyi birleştirenler ise Kurban Bayramı gününe kadar ihramdan çıkmadılar.\" Editör, bunun Malik'ten rivayetle Ebu Musab (1075) tarafından nakledildiğini, Buhari ve diğerlerinin de naklettiğini ve İbn Abdülberr'in (el-Temhid 17/239) Malik'in rivayetinin daha sahih olduğunu umduğunu belirtiyor. {cite:muwatta-maruf-1997 s.450} {cite:muwatta-maruf-1997 s.451}"
  id: "Hadits pertama dalam bab tentang pelaksanaan Haji secara terpisah. Diriwayatkan oleh Malik dari Abu al-Aswad Muhammad ibn Abd al-Rahman, dari Urwah ibn al-Zubayr, dari Aisyah, istri Nabi, yang berkata: “Kami berangkat bersama Rasulullah pada tahun Haji Perpisahan. Sebagian dari kami memasuki ihram untuk Umrah, sebagian untuk Haji dan Umrah, sebagian hanya untuk Haji, dan Rasulullah memasuki ihram hanya untuk Haji. Mereka yang memasuki ihram untuk Umrah keluar dari ihram, sedangkan mereka yang memasuki ihram untuk Haji atau gabungan Haji dan Umrah tidak keluar dari ihram sampai Hari Raya Kurban.” Penyunting menyebutkan bahwa hadits ini diriwayatkan atas otoritas Malik oleh Abu Musab (1075), dan bahwa al-Bukhari dan lainnya meriwayatkannya, dan bahwa Ibnu Abd al-Barr (al-Tamhid 17/239) berharap bahwa riwayat Malik lebih otentik. {cite:muwatta-maruf-1997 p.450} {cite:muwatta-maruf-1997 p.451}"
