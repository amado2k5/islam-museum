label: { ar: "الموطأ 131 — جواري ابن عمر يغسلن رجليه ويناولنه الخمرة وهن حيض", en: "Muwatta 131" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب جامع غسل الجنابة: كان عبد الله بن عمر يغسل جواريه رجليه ويناولنه الخمرة، وهي السجادة الصغيرة التي يصلي عليها، وهن حيض. ويفسر المحقق الخمرة بالسجادة، ويذكر أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.98}"
