label: { ar: "الموطأ 131 — جواري ابن عمر يغسلن رجليه ويناولنه الخمرة وهن حيض", en: "Muwatta 131", es: "Muwatta 131", fr: "Muwatta 131", ur: "موطا 131", tr: "El-Muvatta 131 — İbn Ömer'in cariyeleri, adetli oldukları halde ayaklarını yıkadılar ve ona humre verdiler.", id: "Al-Muwatta 131 — Budak-budak perempuan Ibnu Umar membasuh kakinya dan memberikan khumrah kepadanya saat mereka sedang haid." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب جامع غسل الجنابة: كان عبد الله بن عمر يغسل جواريه رجليه ويناولنه الخمرة، وهي السجادة الصغيرة التي يصلي عليها، وهن حيض. ويفسر المحقق الخمرة بالسجادة، ويذكر أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.98}"
  tr: "Malik'in Nafi'den rivayet ettiği, cinsel ilişkiden sonraki ritüel temizliğin genel kuralları bölümünde yer alan bir rivayete göre: Abdullah ibn Umar, kadın hizmetçilerine ayaklarını yıkatır ve namaz kıldığı küçük seccade olan humreyi kendisine verirdi; bu hizmetçiler adetli olsalar bile. Araştırmacı humreyi seccade olarak açıklıyor ve bunun Malik'ten Ebu Mus'ab, Suwaid, Abd al-Razzaq ve Muhammed ibn al-Hasan tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.98}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang aturan umum penyucian ritual setelah hubungan seksual: Abdullah ibn Umar biasa menyuruh para pelayan wanitanya mencuci kakinya dan memberinya khumrah, yaitu sajadah kecil yang digunakannya untuk shalat, meskipun mereka sedang haid. Peneliti menjelaskan khumrah sebagai sajadah, dan menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.98}"
