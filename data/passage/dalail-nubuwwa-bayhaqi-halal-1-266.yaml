text: "… اسماعيل بمكة، وأخوالهم من جُرهم ولاة البيت والحكام بمكة لا ينازعهم ولد اسماعيل في ذلك لخؤولتهم وقرابتهم، وإعظاماً للحرمة أن يكون بها بَغْيٌ أو قتال. ثم إن جُرهماً بغوًا بمكة واستحلوا حلالاً من الحَرَمِ، فظلموا من دخلها من غير أهلها، …"
