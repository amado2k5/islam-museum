label: { ar: "نوادر جحا الكبرى، ص 130 — «هل كان رأسه معه؟»", en: "Nawadir Juha al-Kubra, p. 130 — 'Did He Have His Head with Him?'", ur: "نوادر جحا الکبریٰ، ص 130 — «کیا اس کا سر اس کے ساتھ تھا؟»", fr: "Nawadir Juha al-Kubra, p. 130 — « Avait-il sa tête avec lui ? »", es: "Nawadir Juha al-Kubra, p. 130 — «¿Llevaba su cabeza consigo?»", tr: "Juha'nın Büyük Fıkraları, s. 130 — “Kafası onunla mıydı?”", id: "Anekdot-anekdot Hebat Juha, hlm. 130 — “Apakah kepalanya bersamanya?”" }
text: "… هل كان رأسه معه؟ ذهب مع رفيق له ليصطاد الذئاب، فرأيا ذئباً كبيراً، قد غطَّاه الشعر، فطمِعَا في جلده الذي يصلح للفراء، وأخذا يطاردانه حتى دخل جحره، فلحقه رفيق الشيخ، وأدخل رأسه في الجحر، وأنتظر الشيخ مدةً، فلم يرَ الرجل …"
summary:
  ar: "خرج جحا للصيد مع رفيق فأدخل الرفيق رأسه في وكر ذئب، فسحب جحا الجسد فقط، فسأل زوجة الرفيق هل خرج زوجها من البيت ورأسه معه. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  en: "Juha goes wolf hunting with a companion, and the companion puts his head into a den. Juha pulls out only the body, and he asks the companion's wife whether her husband left home with his head. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  ur: "جحا ایک ساتھی کے ساتھ بھیڑیے کے شکار کو نکلتا ہے اور ساتھی اپنا سر ایک کھوہ میں ڈال دیتا ہے۔ جحا صرف دھڑ باہر کھینچ لیتا ہے، اور ساتھی کی بیوی سے پوچھتا ہے کہ کیا اس کا شوہر گھر سے سر کے ساتھ نکلا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  fr: "Juha part chasser le loup avec un compagnon, et le compagnon met la tête dans une tanière. Juha ne ressort que le corps, et il demande à la femme du compagnon si son mari avait quitté la maison avec sa tête. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  es: "Juha sale a cazar lobos con un compañero, y el compañero mete la cabeza en una madriguera. Juha solo saca el cuerpo, y pregunta a la esposa del compañero si su marido salió de casa con la cabeza. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
  tr: "Juha bir arkadaşıyla ava gitti ve arkadaşı kafasını bir kurt inine soktu. Juha sadece cesedi çıkardı, sonra arkadaşının karısına kocasının evden kafasıyla birlikte çıkıp çıkmadığını sordu. {cite:juha-nawadir-kubra-djuwaydi s. 130}"
  id: "Juha pergi berburu bersama seorang teman, dan temannya memasukkan kepalanya ke dalam sarang serigala. Juha hanya menarik keluar tubuhnya, lalu bertanya kepada istri temannya apakah suaminya meninggalkan rumah dengan membawa kepalanya. {cite:juha-nawadir-kubra-djuwaydi p. 130}"
