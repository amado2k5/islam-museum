text: "… وكيع عن جَرير عن قيس بن سعد عن مجاهد قال: إذا قبلها، أو لمسها، أو نظر إلى فرجها؛ حرمت عليه ابنتها. - حدثنا غُنْدر عن شعبة عن مُغيرة عن إبراهيم قال: إذا قَبّل الأَمَة، لم تحلّ له ابنتها، وإذا قبل …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 3975، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
