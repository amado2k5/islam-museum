label: { ar: "الموطأ 500 — عروة يصلي يوم الفطر قبل الصلاة في المسجد", en: "Muwatta 500", es: "500 vatios", fr: "500 watts", ur: "500 واٹ", tr: "Al-Muwatta 500 — Urwah, Ramazan Bayramı günü camide namazdan önce dua ediyor.", id: "Al-Muwatta 500 — Urwah berdoa pada hari raya Idul Fitri sebelum shalat di masjid" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه أنه كان يصلي يوم الفطر قبل الصلاة في المسجد؛ وهو في باب الرخصة في الصلاة قبل العيدين وبعدهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.256}"
  tr: "Malik'in, Hişam ibn Urve'den, onun babasından rivayet ettiği bir hadise göre, Ramazan Bayramı günü mescitte namazdan önce namaz kılardı; bu, iki bayramdan önce ve sonra namaz kılmanın serbest olduğu bölümün altındadır. Editör, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.256}"
  id: "Riwayat yang dinarasikan oleh Malik dari Hisham ibn Urwah, dari ayahnya, menyebutkan bahwa beliau biasa shalat pada hari raya Idul Fitri sebelum shalat di masjid; hal ini termasuk dalam bab tentang keringanan shalat sebelum dan sesudah dua hari raya. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.256}"
