label: { ar: "صحيح البخاري 6804 — ألبان الإبل وأبوالها", en: "Sahih al-Bukhari 6804 — camel milk and urine as treatment", ur: "صحیح بخاری 6804 — اونٹنی کا دودھ اور پیشاب", es: "Sahih al-Bukhari 6804 — Leche y orina de camello como tratamiento", fr: "Sahih al-Bukhari 6804 — le lait et l'urine de chamelle comme traitement", tr: "Sahih el-Buhari 6804 — Deve sütü ve idrarı", id: "Sahih al-Bukhari 6804 — Susu unta dan air kencing" }
text: "… فَقَالَ \" مَا أَجِدُ لَكُمْ إِلاَّ أَنْ تَلْحَقُوا بِإِبِلِ رَسُولِ اللَّهِ \". فَأَتَوْهَا فَشَرِبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا حَتَّى صَحُّوا وَسَمِنُوا، وَقَتَلُوا الرَّاعِيَ وَاسْتَاقُوا الذَّوْدَ، فَأَتَى النَّبِيَّ الصَّرِيخُ، فَبَعَثَ الطَّلَبَ فِي آثَارِهِمْ، فَمَا تَرَجَّلَ النَّهَارُ حَتَّى أُتِيَ بِهِمْ، فَأَمَرَ بِمَسَامِيرَ فَأُحْمِيَتْ فَكَحَلَهُمْ وَقَطَعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ، وَمَا حَسَمَهُمْ، ثُمَّ أُلْقُوا فِي الْحَرَّةِ يَسْتَسْقُونَ فَمَا سُقُوا حَتَّى مَاتُوا. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6804، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6804 (Limits and Punishments set by Allah (Hudood)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6804، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6804 (Límites y castigos establecidos por Alá (Hudood)), menciona la leche y la orina de camella como tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 6804 (Limites et châtiments fixés par Allah (Hudood)), mentionne le lait et l'urine de chamelle comme remèdes. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 6804 numaralı hadiste deve sütü ve idrarından bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6804, menyebutkan susu unta dan air kencing. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
