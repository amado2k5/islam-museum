text: "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، حَدَّثَنَا أَبِي، عَنْ إِسْرَائِيلَ، ح قَالَ وَحَدَّثَنَا مُحَمَّدُ بْنُ أَحْمَدَ، وَهُوَ ابْنُ مَدُّويَهْ حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، عَنْ إِسْرَائِيلَ، وَاللَّفْظُ، لِحَدِيثِ عُبَيْدِ اللَّهِ عَنْ أَبِي إِسْحَاقَ الْهَمْدَانِيِّ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الْخَالَةُ بِمَنْزِلَةِ الأُمِّ ‏\"‏ ‏.‏ وَفِي الْحَدِيثِ قِصَّةٌ طَوِيلَةٌ ‏.‏ وَهَذَا حَدِيثٌ صَحِيحٌ ‏.‏"
summary:
  ar: "عن البراء بن عازب: الخالة بمنزلة الأم."
  en: "From al-Bara ibn Azib: «the maternal aunt stands in the mother's place.»"
  ur: "براء بن عازب سے: «خالہ ماں کے مقام پر ہے۔»"
  es: "De al-Bara ibn Azib: «la tía materna ocupa el lugar de la madre»."
