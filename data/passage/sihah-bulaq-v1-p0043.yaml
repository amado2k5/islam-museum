text: |-
  ١ السروعة النبكة العظيمة
  من الرمل وتجمع سروعات
  وسراوح .
  الى النار ويقال به سفعة من
  النار
  ٣ ل ن ال ارسودت صفاحها
  التى تلى النار
  متجرابه وفيه والجم-ع سلع
  ٦ فى نسخة ابن أخت تأبط
  شرااه
  قوله الضوأة كذا فى النسنخ ولم
  أجد هذه اللفظة فى بابها فليحرر
  ٥٩٨
  (باب العين
  وتعطو برخص غيرشثن كأنها * أساريع ظبى أومساويك إسحل
  وظبى اسم واديقال أسار يع ظبى كما يقال سيدرمل وضب كدية وتور عداب والاسروع
  أيضا واحد أساريع القوس وهى خطوط فيهاوطرائق ١ طع . سطح الغبار
  والرائحة والصبح يسطع سطوعااذا ارتفع والسطبع الصبح والسطعب تحدريك طول العنق
  نعلمة سطعاء والسطاع سمة وعنق البعير بالطول بقال بعبر مسطع والسطاع أيضاعمود
  البيت قال القطامى
  أليسوا بالألى فسطواجبعا * على النعمان وابتدروا السطاعا
  عع سعمع الرجل أى كبر-تى هرم وولى فأل رؤبة باهندما أسرع ماتسعسما
  ومنه قولهم تسعسع الشهراذاذهب أكنره وفى حديث عمررضى اللّٰه عنه أنه سافر فى عقب
  رمضان وقال ان الشهرقد تسعسع فلوصهنا بة يته وتسعسعت حال فلان اذا انحطت قال
  الفراء نقال سععت بالمعزى اذازجرتها وقلت لهاسع سع ⁦(لفع)⁩ سقعت يناصيته
  أى أخذت قال الشاعر .
  قوم اذافزعوا الصريخ رأيتهم * من بين ملجم مهره أوسافع
  ومنه قوله نعالى لنسفعا بالناصية ( ٢ ويقال به سفعة من الشيطان أى مس كانه أخذ
  يناصية وسفعته النار والسموم اذ الفحته انيسا يسير افغيرت لون البشرة والسوافع لوافح
  السموم والسفعة بالضم سواد مشرب حرة والرجل اسفع ومنه قيل للانافى سفع ٣
  والسفعة أيضا فى آثار الدار ماخااف من سوادها سائرلون الارض والسفعة فى الوجه
  -واد فى خدى المرأة الشاحبة ويقال للحمامة سفعاء لما فى عنقها من السفعة قال حيد بن
  تور
  من الورق سفعاء العلاطيز باكرت * فروع اشا مطلع الشمس أسحما
  والصور كاهاسفع وسفع الطائراطمه بجناحيه والمسانعة كالمطاردة قال الاعشى
  يسافع ورقاجونية * ليدركها فى حمام نكن
  قع لسقع لغة فى الصفع ٤ ويقال ما أدرى أين سقع أى أين ذهب وسقع الدين
  منل صقع وخطيب مسقع مثل مصقع والسقاع لغة فى الصقاع ⁦( فرقع)⁩ السقرقع
  تعريب السكر كه ساكنة اراء وهى خر الحيش تتخذدن الذرة ( س كع سكع الرجل مثل
  سقع يقال ما أدرى أين سكع وأين تسكع والتسكع التمادى فى الباطل ومنه قول الشاعر
  ألا إنه فى غمرة يتسكع لع لسلعة المتاع والسلعة الضوأة وهى زيادة تحدث فى الجسد
  كالغدّة تتحرك اذاحر كت وقد تكون من حصة الى بطيخة ٥ والسلعة بالفتح الشجة
  وسلعت رأسه أسلعه سلعا اى شققته وسلع أيضاجبل بالمدينة قال تأبط شرًا ٦
  إن بالشعب الذى دون سلع * اقتيلا دمه ما يطسل
  والسلع أيضا الشق فى القدم وجعه ساوع قال يعقوب يقال للشق فى الجمل سلع بالكسروجعه
  اسلاع وبعضهم :فتصه والسلع بالحدر يك شجرمز ومنه المسلعة لانهم كانوا فى الجدب بعلتون
  شيئا من هذه الشجروجن العشر باذناب البق رثم يضرمون فيها الناروهم يصعدونها فى الجبل
  فمطرون زعموا قال الشاعر
