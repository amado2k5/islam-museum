text: "… ابن عمر عن الجبن، فقال : كُلْ ما صنع المسلمون وأهل الكتاب، قال هق : وهذا لأن السخال تذبح فتوخذ منها الإنفحة التي بها يصلح الجبن، فإذا كانت من ذبائح المجوس وأهل الأوثان لم يحل، وهكذا إذا ماتت السخلة فأخذت …"
