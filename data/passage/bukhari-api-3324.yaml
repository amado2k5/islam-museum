label: { ar: "صحيح البخاري 3324 — نقص قيراط من الأجر كل يوم", en: "Sahih al-Bukhari 3324 — a qirat lost from the reward each day", ur: "صحیح بخاری 3324 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sahih al-Bukhari 3324 — una qirat perdida de la recompensa cada día", fr: "Sahih al-Bukhari 3324 — une qirat perdue pour la récompense chaque jour", tr: "Sahih el-Buhari 3324 — Her gün sevaptan bir kırat düşülür.", id: "Sahih al-Bukhari 3324 — Satu qirat dikurangi dari pahala setiap hari" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا هَمَّامٌ، عَنْ يَحْيَى، قَالَ حَدَّثَنِي أَبُو سَلَمَةَ، أَنَّ أَبَا هُرَيْرَةَ ـ حَدَّثَهُ قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ أَمْسَكَ كَلْبًا يَنْقُصْ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطٌ، إِلاَّ كَلْبَ حَرْثٍ أَوْ كَلْبَ مَاشِيَةٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3324، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 3324 (Beginning of Creation), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 3324، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3324 (El comienzo de la creación), habla de una qirat que se pierde de la recompensa cada día. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 3324 (Commencement de la Création), mentionne la perte d'une qirat (unité de mesure) pour la récompense quotidienne. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "Sahih el-Buhari'de 3324 numaralı hadis, her gün sevabın bir kırat (bir ağırlık birimi) azaldığından bahseder. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesine dahildir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3324, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
