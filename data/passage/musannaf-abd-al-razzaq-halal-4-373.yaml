text: "… : ثُمَّ خَطَبَ، ثُمَ قَالَ : إِنَّ اللَّهَ حَرَّمَ مَكَّةَ يَوْمَ خَلَقَ السَّمَوَاتِ وَالْأَرْضَ، فَهِيَ حَرَامٌ بِحَرَامِ اللَّهِ إِلَىٰ يَوْمِ الْقِيَامَةِ، لَمْ تَحِلَّ لِأحَدٍ قَبْلِي وَلَا لأَحَدٍ بَعْدِي، وَإِنَّمَا أَحَلَّهَا اللَّهُ لِي سَاعَةً مِنَ النَّهَارِ، لَا يُنَفَّرُ صَيْدُهَا، وَلَا يُعْضَدُ …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 4، ص 373، يذكر ما أُحل، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
