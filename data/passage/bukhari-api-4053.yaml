label: { ar: "صحيح البخاري 4053 — الأب والأبوة", en: "Sahih al-Bukhari 4053 — the father and fatherhood", ur: "صحیح بخاری 4053 — باپ اور والدیت", es: "Sahih al-Bukhari 4053 — El padre y la paternidad" }
text: "… وَتَرَكَ عَلَيْهِ دَيْنًا، وَتَرَكَ سِتَّ بَنَاتٍ، فَلَمَّا حَضَرَ جِذَاذُ النَّخْلِ قَالَ أَتَيْتُ رَسُولَ اللَّهِ فَقُلْتُ قَدْ عَلِمْتَ أَنَّ وَالِدِي قَدِ اسْتُشْهِدَ يَوْمَ أُحُدٍ، وَتَرَكَ دَيْنًا كَثِيرًا، وَإِنِّي أُحِبُّ أَنْ يَرَاكَ الْغُرَمَاءُ. فَقَالَ \" اذْهَبْ فَبَيْدِرْ كُلَّ تَمْرٍ عَلَى نَاحِيَةٍ \". فَفَعَلْتُ ثُمَّ دَعَوْتُهُ، فَلَمَّا نَظَرُوا إِلَيْهِ كَأَنَّهُمْ أُغْرُوا بِي تِلْكَ السَّاعَةَ، فَلَمَّا رَأَى مَا يَصْنَعُونَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4053، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4053 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4053، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4053 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
