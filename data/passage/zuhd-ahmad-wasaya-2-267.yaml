text: "… زَبْر الرَّبعي في وصايا العلماء ص - ومن طريقه ابن عساكر في تاريخ دمشق - عن إِسماعيلَ بنِ أَبي خالدٍ، عنِ الشَّعبيِّ، قال: لما حضرَ عبدَ اللّٰه بنَ مسعودِ الموتُ: دعا ابنَه، فقال: يا عبَدَ الرّحمنَ بنَ عبدِ الله بن …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 267، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 2, p. 267, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 2، ص 267 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 2, pág. 267, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal, volume 2, page 267, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Ahmed ibn Hanbal'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 267. sayfasından, son vasiyet veya ahit ve ölüm anına dair bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 2, halaman 267, yang menyebutkan wasiat atau perjanjian terakhir, dan saat kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
