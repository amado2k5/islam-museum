text: "… أذَانُ بِلالٍ، وَلا بِيَاضُ لا يَغُرَنَّكُمْ بِدَاءُ بلال، وَلا هَذَا الْبَيَاضُ حَتَّى يَبْدُوَ لا يَغْفِرُ اللهُ لِفَلان، وَإنَّ اللَّهَ تَعالَى قال: لا، يَغْفِرُ اللهُ لَكَ، يَا أخِي!... لا يَغُلُّ أحَدُكُمْ حِينَ يَغُلَّ وَهُوْ مُؤْمِنٌ، فَإِيَّاكُمْ لا يَفْرَكْ مُؤْمِنّ مُؤْمِنَةٌ، إنْ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 1950، يذكر ما يرتفع معه الإيمان حين الفعل، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 1950, that mentions what faith is lifted by at the moment of the act, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 1950 کا اقتباس جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 1950, que menciona qué es lo que fortalece la fe en el momento del acto, una descripción del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (tome 1, p. 1950) mentionnant ce qui élève la foi au moment de l'acte, ainsi qu'une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 1950. sayfasından bir alıntı, kişinin imanını yükselten amelleri ele alıyor ve müminin özelliklerini tanımlıyor. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Volume 1, halaman 1950, membahas tindakan-tindakan yang meningkatkan iman seseorang dan menggambarkan seorang mukmin. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
