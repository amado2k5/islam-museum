label: { ar: "سنن النسائي 3003 — الأب والأبوة", en: "Sunan al-Nasa'i 3003 — the father and fatherhood", ur: "سنن نسائی 3003 — باپ اور والدیت", es: "Sunan al-Nasa'i 3003 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3003 — le père et la paternité" }
text: "أَخْبَرَنَا عِيسَى بْنُ إِبْرَاهِيمَ، عَنِ ابْنِ وَهْبٍ، قَالَ أَخْبَرَنِي مَخْرَمَةُ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ يُونُسَ، عَنِ ابْنِ الْمُسَيَّبِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" مَا مِنْ يَوْمٍ أَكْثَرَ مِنْ أَنْ يَعْتِقَ اللَّهُ عَزَّ وَجَلَّ فِيهِ عَبْدًا أَوْ أَمَةً مِنَ النَّارِ مِنْ يَوْمِ عَرَفَةَ إِنَّهُ لَيَدْنُو ثُمَّ يُبَاهِي بِهِمُ الْمَلاَئِكَةَ وَيَقُولُ مَا أَرَادَ هَؤُلاَءِ \". …"
summary:
  ar: "حديث في سنن النسائي، رقم 3003، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3003 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3003، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3003 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3003 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
