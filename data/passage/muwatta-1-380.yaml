label: { ar: "الموطأ 380 — ميمونة تصلي في الدرع والخمار ليس عليها إزار", en: "Muwatta 380" }
summary:
  ar: "أثر يرويه مالك عن الثقة عنده عن بكير بن عبد الله بن الأشج عن بسر بن سعيد عن عبيد الله بن الأسود الخولاني، وكان في حجر ميمونة زوج النبي، أن ميمونة كانت تصلي في الدرع والخمار ليس عليها إزار؛ وهو في باب الرخصة في صلاة المرأة في الدرع والخمار. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.204} {cite:muwatta-maruf-1997 p.205}"
