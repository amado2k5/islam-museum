label: { ar: "الموطأ 380 — ميمونة تصلي في الدرع والخمار ليس عليها إزار", en: "Muwatta 380", es: "380 Muwatta", fr: "380 Muwatta", ur: "380 موطا", tr: "Al-Muwatta 380 — Maymuna, bel örtüsü olmadan, tunik ve başörtüsüyle namaz kılıyor.", id: "Al-Muwatta 380 — Maymuna shalat dengan mengenakan tunik dan jilbab, tanpa cawat." }
summary:
  ar: "أثر يرويه مالك عن الثقة عنده عن بكير بن عبد الله بن الأشج عن بسر بن سعيد عن عبيد الله بن الأسود الخولاني، وكان في حجر ميمونة زوج النبي، أن ميمونة كانت تصلي في الدرع والخمار ليس عليها إزار؛ وهو في باب الرخصة في صلاة المرأة في الدرع والخمار. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.204} {cite:muwatta-maruf-1997 p.205}"
  tr: "Malik'in güvenilir bir kişiden, Bukayr ibn Abdullah ibn al-Ashajj'dan, Busr ibn Sa'id'den, Ubaydullah ibn al-Aswad al-Khawlani'den rivayet ettiği bir rivayete göre, Peygamberin eşi Meymuna'nın himayesi altında olan Ubaydullah ibn al-Aswad al-Khawlani'den rivayet edildiğine göre Meymuna, alt giysi giymeden, tunik ve başörtüsüyle namaz kılardı; bu, bir kadının tunik ve başörtüsüyle namaz kılmasına izin verilen bölümde yer almaktadır. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Muhammed ibn al-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Bayhaqi tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.204} {cite:muwatta-maruf-1997 s.205}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari seorang yang terpercaya, dari Bukayr ibn Abdullah ibn al-Ashajj, dari Busr ibn Sa'id, dari Ubaydullah ibn al-Aswad al-Khawlani, yang berada di bawah perawatan Maymuna, istri Nabi, bahwa Maymuna biasa shalat dengan mengenakan tunik dan jilbab tanpa pakaian bawah; ini terdapat dalam surah tentang keringanan bagi wanita untuk shalat dengan mengenakan tunik dan jilbab. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.204} {cite:muwatta-maruf-1997 p.205}"
