label: { ar: "الموطأ 2546 — مالك: لا يجب العقل على النساء والصبيان مع العاقلة", en: "Muwatta 2546", es: "Muwatta 2546", fr: "Muwatta 2546", ur: "موطا 2546", tr: "Al-Muwatta 2546 — Malik: Kadın ve erkek çocuklarına, kadın akrabaları varsa kan parası gerekmez.", id: "Al-Muwatta 2546 — Malik: Uang darah tidak diwajibkan bagi perempuan dan anak laki-laki yang memiliki kerabat perempuan." }
summary:
  ar: "قال مالك: الأمر الذي لا اختلاف فيه عندنا أنه ليس على النساء والصبيان عقل يجب عليهم أن يعقلوه مع العاقلة فيما تعقله العاقلة من الديات، وإنما يجب العقل على من بلغ الحلم من الرجال. {cite:muwatta-maruf-1997 p.442}"
  tr: "Malik şöyle dedi: Aramızda ihtilaf bulunmayan konu şudur ki, kadınlar ve erkek çocuklar, klanın ödediği kan parası konusunda klayla birlikte kan parası ödemekle yükümlü değildir. Aksine, kan parası ödeme yükümlülüğü yalnızca ergenliğe ulaşmış erkeklere aittir. {cite:muwatta-maruf-1997 s.442}"
  id: "Malik berkata: Hal yang tidak menimbulkan perselisihan di antara kita adalah bahwa perempuan dan anak laki-laki tidak diwajibkan membayar uang darah bersama dengan klan, dalam hal uang darah yang dibayarkan oleh klan. Sebaliknya, kewajiban membayar uang darah hanya dibebankan kepada laki-laki yang telah mencapai usia pubertas. {cite:muwatta-maruf-1997 p.442}"
