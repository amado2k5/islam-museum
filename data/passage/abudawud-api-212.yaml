label: { ar: "سنن أبي داود 212 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 212 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 212 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 212 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 212 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan Abi Davud 212 — Neler caizdir, neler caiz değildir", id: "Sunan Abi Dawud 212 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "حَدَّثَنَا هَارُونُ بْنُ مُحَمَّدِ بْنِ بَكَّارٍ، حَدَّثَنَا مَرْوَانُ، - يَعْنِي ابْنَ مُحَمَّدٍ - حَدَّثَنَا الْهَيْثَمُ بْنُ حُمَيْدٍ، حَدَّثَنَا الْعَلاَءُ بْنُ الْحَارِثِ، عَنْ حَرَامِ بْنِ حَكِيمٍ، عَنْ عَمِّهِ، أَنَّهُ سَأَلَ رَسُولَ اللَّهِ مَا يَحِلُّ لِي مِنَ امْرَأَتِي وَهِيَ حَائِضٌ قَالَ \" لَكَ مَا فَوْقَ الإِزَارِ \". وَذَكَرَ مُؤَاكَلَةَ الْحَائِضِ أَيْضًا وَسَاقَ الْحَدِيثَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 212، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 212 (Purification (Kitab Al-Taharah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 212، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 212 (Purificación (Kitab Al-Taharah)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 212 (Purification (Kitab Al-Taharah)), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Sünen Ebu Davud'da yer alan 212 numaralı hadis, helal ve haram olanı belirtir. Helal ve Haram rehberinin bu bölümü, helal ve haram konusunda Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntılarla bunu birleştirir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 212, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian dari panduan Halal dan Haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
