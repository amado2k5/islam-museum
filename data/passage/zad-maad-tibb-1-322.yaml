text: "… بن قيس، عن محمد بن عجلان، عن سعيد، عن أبي هريرة، وهو حديث حسن. فإن قيلٍ : إذا كان به زكام، فهو أولى أن يُدعى له ممن لا عِلَّة به؟ قيل: يُدعى له كما يُدعى للمريض، ومَن بهِ داء ووجع. …"
