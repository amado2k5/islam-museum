label: { ar: "جامع الترمذي 1456 — الأب والأبوة", en: "Jami' al-Tirmidhi 1456 — the father and fatherhood", ur: "جامع ترمذی 1456 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1456 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1456 — le père et la paternité" }
text: "… مَلْعُونٌ مَنْ أَتَى بَهِيمَةً. وَقَدْ رُوِيَ هَذَا الْحَدِيثُ عَنْ عَاصِمِ بْنِ عُمَرَ عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ عَنْ أَبِيهِ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ قَالَ \" اقْتُلُوا الْفَاعِلَ وَالْمَفْعُولَ بِهِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ فِي إِسْنَادِهِ مَقَالٌ وَلاَ نَعْرِفُ أَحَدًا رَوَاهُ عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ غَيْرَ عَاصِمِ بْنِ عُمَرَ الْعُمَرِيِّ. وَعَاصِمُ بْنُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1456، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1456 (The Book on Legal Punishments (Al-Hudud)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1456، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1456 (El Libro de los Castigos Legales (Al-Hudud)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1456 (Le Livre des peines légales (Al-Hudud)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
