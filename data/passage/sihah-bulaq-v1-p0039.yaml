text: |-
  ابن عبد مناف منهم الشافعى
  كذا فى نسهنة بالاصل
  ٦٠٢
  والشعلع الطويل بزيادة الام ⁦( ع)⁩ التقع خلاف الزوج وهوالوترتول كان
  وترافشفعته شفعا والشفعة فى الدار والارض والتقيع صاحب الشنعة وصاحب
  الشفاعسة وناقة شاذع فى إطنها ولدوية:عها آخرتقول منه تفعت الناقة شفعاوفى الحسديت
  أه بعث مصدقا فأتاء بشاذافع فلم يأخذها د قال ائنى يمعتاط قال أيو عبيد فالشافع التى
  معهاولدها ميت شافعا لان ولدها شفعها وتفعته هي وناقة شفوع وهى التى تجمع بين
  محلبين فى حلبة واحدة واستشفعته الى فلان أى سألته أن يشفع لى اليه وتشفعت اليه
  فى فلان فشفعف فيه تشفيعا ١ ) ( كع السكاعى نبت يتداوى به قال الاخضس هو
  لضارسية ربت الشكاى والتعدت الله . وأدبات أفوا* العروقا لم،
  فال سيبويه هو واحد وجع وقال غيره الواحدة منها شكاعاة والشكع بالتحريك الوجع
  والغضب أيضا وقدشكع بالكسر بشال بات شكها أى وجعالا ينام وأشكعه أى أغضبه
  ويقال أ.له وآضجره ( مع لشمح بفتصتين الذى يستصبح به قال الفراءهذا كلام العرب
  والمولدون بة ولون شمع بالتسكين والشعة أخص منه وبذال أشمع السراج أى سطع نوره
  قال الراجز
  كلع برق أوسراج أشمعا والشمعة اللعب والمزاح وقد شمع يشمع شمعا
  وشموعا و مشععة قال الهذلى يذكر أضافه
  سأبدوهم يمشمعة وآتى • بجهدى من طعام أوبساط
  وفى الجديث من تتبع المشمعة أمن عيث بالناس أصاره اللّٰه الى حالة يعبث به فيها والشموع
  من النسا اللعوب الضحول ⁦(شنع )⁩ الشناعة الفظاعة وقد شنع الشى يشنع ف)وشنيع
  وأشنع ومنهقول الشاعر الهذلى
  واليوم يوم أشنع والاسم الشنعة وشنعت عليه
  نشنيعا والتشنيع أيضا التشعير يقال أشعت الفاقة أيضاأى شمرت حكاه أبو عبيد من
  الاصحى وشفعت فلانا أى استقيهته وستمته قال كثير
  وأسماءلامشنوعة علالة • لديناولامقلة إن تقلت
  ويروى أسيى بنا أوأحسى لاملومة • وتشنعت الابل فى السيرأى جدت قال الراجز
  كانه -ين بداتشنعه * وسال بعد الهمان أخدعه • جاءت بأعلى قنتين مرتعه
  وتشنعت الغارة بئنتها والة رس ركبته وعلوته والسلاح لبسته ( وع لشوع بالضم شجر
  البان الواحدة شوعة وقال يصف جبلابأ كناذمه الشوع والغريف وقال هذاشوع
  هذا يالفتح وشيع هذ اللذى ولديعده ولم يولد بينهما ⁦(شبع)⁩ شاع الخبر يشيع شيه وعة أى
  ذاع وسه-م حشاع وسهم شائع اى غير مقسوم وسهم شاع أيضا كما يقال سائر الشى وساره
  وأشاع الخبر أى أذاعه فهورجل مشياع أى مذباع وقولهم حياكم اللّٰه وأشاعكم السلام
  أى جعله اللّٰه صاحبالكم وتابعا وشاعكم السلام كما تقول عليكم السلام وهذا انمايقوله
  الرجل لاصحابه اذا أراد أن يفارقهم كماقال قيس بن زهير لما اصطلح القوم يابنى عبس
  شاعكم السلام فلا نظرت فى وجه ذبيانية قتلت أباها أو أخاها وصار الى ناحية عمان وهذاك
  اليوم عقبه وولده وأشاعت الناقة بيولها اذارمت به وقطعته مثل أوزعت ييولهناو الشيع
  المقدار
