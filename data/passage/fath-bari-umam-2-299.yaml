text: "… ووجه ذكر المسكنة هنا أنه لما فسر الصغار بالذلة وجاء فى وصف أهل الكتاب أنهم ضربت عايهم الذلة والمسكنة ناسب ذكر المسكنة عند ذكر الذلة. قوله وما جاء فى أخذ الجزية من اليهود والنصارى والمجوس والعجم هذه بقية الترجمة، قيل …"
