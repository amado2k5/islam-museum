text: "… ما كرهت من ذلك ان أرض العراق ارض رقيقة، وأن أهل المدينة يموتون حولى من الجوع، فحشيت ان آمر لك فيكون لك البارد ولى الحار، أما سمعت رصول اللّٰه يقول: لا يشبع المؤمن دون جاره. كذا فى الكنزج ص : …"
