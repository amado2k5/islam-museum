text: "… سمعت ابى يؤثر عن رسول اللّه وهو يقول اربع من كن فيه فهو مؤمن ومن جاء بثلائة فكتم واحدة فقد كفر شهادة ان لا اله الا اللّه وانى رسول اللّه وانه مبعوث من بعد الموت وايمان بالقدر خيره وشره فن …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 2، ص 431، يذكر الإيمان بالقدر، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 2, p. 431, that mentions belief in the decree, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 2، ص 431 کا اقتباس جس میں تقدیر پر ایمان، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Historia de Damasco de Ibn 'Asakir, volumen 2, pág. 431, que menciona la creencia en el decreto, rasgos que, presentes en una persona, indican fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
