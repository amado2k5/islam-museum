text: "… إِلَى كَذَا وَكَذَا \". قَالَ قَتَادَةُ قُلْتُ يَعْنِي قُلْتُ لأَنَسِ بْنِ مَالِكٍ مَا يَعْنِي قَالَ \" إِلَى أَسْفَلِ بَطْنِي فَاسْتُخْرِجَ قَلْبِي فَغُسِلَ قَلْبِي بِمَاءِ زَمْزَمَ ثُمَّ أُعِيدَ مَكَانَهُ ثُمَّ حُشِيَ إِيمَانًا وَحِكْمَةً \". وَفِي الْحَدِيثِ قِصَّةٌ طَوِيلَةٌ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ رَوَاهُ هِشَامٌ الدَّسْتَوَائِيُّ وَهَمَّامٌ عَنْ قَتَادَةَ. وَفِيهِ عَنْ أَبِي ذَرٍّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3346، يذكر شق الصدر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3346 (Chapters on Tafsir), that mentions the opening of the chest. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3346، جس میں شقِّ صدر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
