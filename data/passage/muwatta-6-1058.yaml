summary:
  ar: "قول لمالك: وذلك الأمر الذي لم يزل عليه أهل العلم ببلدنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1282). {cite:muwatta-maruf-1997 p.490}"
  tr: "Malik şöyle dedi: “Bu, ülkemizin âlimlerinin her zaman izlediği uygulamadır.” Editör, bunun Malik'ten Ebu Mus'ab (1282) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.490}"
  id: "Malik berkata: “Ini adalah praktik yang selalu diikuti oleh para ulama di negeri kita.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1282). {cite:muwatta-maruf-1997 p.490}"
