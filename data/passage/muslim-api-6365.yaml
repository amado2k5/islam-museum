label: { ar: "صحيح مسلم 6365 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 6365 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 6365 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 6365 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 6365 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنِي عَبْدُ الْحَمِيدِ بْنُ بَيَانٍ، أَخْبَرَنَا خَالِدٌ، عَنْ بَيَانٍ، عَنْ قَيْسٍ، عَنْ جَرِيرٍ، قَالَ كَانَ فِي الْجَاهِلِيَّةِ بَيْتٌ يُقَالُ لَهُ ذُو الْخَلَصَةِ وَكَانَ يُقَالُ لَهُ الْكَعْبَةُ الْيَمَانِيَةُ وَالْكَعْبَةُ الشَّامِيَّةُ فَقَالَ رَسُولُ اللَّهِ \" هَلْ أَنْتَ مُرِيحِي مِنْ ذِي الْخَلَصَةِ وَالْكَعْبَةِ الْيَمَانِيَةِ وَالشَّامِيَّةِ \". فَنَفَرْتُ إِلَيْهِ فِي مِائَةٍ وَخَمْسِينَ مِنْ أَحْمَسَ فَكَسَرْنَاهُ وَقَتَلْنَا مَنْ وَجَدْنَا عِنْدَهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6365، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6365 (The Book of the Merits of the Companions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 6365، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 6365 (El Libro de los Méritos de los Compañeros), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih Muslim, n° 6365 (Livre des mérites des Compagnons), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
