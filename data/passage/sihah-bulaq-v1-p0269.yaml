text: |-
  ٢٧٢
  ⁦(باب الرام)⁩
  (عود⅜⅜n⅜
  ان ذلك أصلدمجى اخواته على هذا اسودبود واحزيحمر ولا يقال فى الالوان غيره
  وكذلك قياسه فى العبوب آعرج واحمىّ فى عرج وعمى وان لم يسمع وتقول منه عرت عينه
  أعورها وفلاة عوراء لامامبها وعنده من المال عامرة عين أى يحار فيه البصر من كثرته كانة
  ٤-لا العين فيكاد يعورها والعار من السهام والجارة الذى لا يدرى من رماه يقال أصابه
  سهم عاروعواتر من الجراد أى جماعات متفرّقة والعوراء الكامة القبيحة وهى السقطة
  قال الشاءر (وهوحاتم طى
  وأغفرعورا السكريم اتخاره • واعرض عن شتم اللتيم تكرّما أى لاتخاره
  ويقال للغراب أعورسى بذلك لحدة بصره على التشاؤم وعو يرموضع ويقال فى الخصلتين
  المكروهتين كسيروعوير وكل غير خير وهو تصغير أعود مر خما والعوار العيب يقال
  ملعة ذات عوار يفتح العين وة-دتضم عن آبى زيد والعوّار بالضم والتشديد الخطاف
  كانما انقض تحت الضق عوّار والعوارأ يضا القذى فى العين يقال بعين
  عوار أى قذى والعائرمثله والعائر الرمد والعوار أيضا الجبان والجمع العواوير وان
  شئت لم تعوّض فى الشعر فقلت العواور قال لبيد
  وفى كل يوم ذى حفاظ يلومنى • فقمت مقامالم تقمه العواور
  قال أبو علىّ النحوى انماصحت فيه الواومع قربها من الطرف لان الياء المحذوفة للضرورة
  مرادة فهى فى حكم ما فى اللفظ فلما بعدت فى الحكم من الطرف لم تقلب همزة والعارية
  بالتشديد كأنهامنسوبة الى العارلان طلبها عاروعيب وينشد
  انما أنفسناعارية والسعوارى قصارى ان زد
  والعارة مثل العارية قال ابن مقبل
  فأخلف وأتلف انما المال عارة • وكله مع الدهر الذى هوآ كله
  يقال هسم يتعوّرون العوارى بينهم واستعاده ثو با فأعاره اياه ومنه قولهم كبر مستعار قال
  كان حفيف منخره اذاما * كتمن الربوكير مستعاد
  وقد قيل مستعار بمعنى متعاور أى متداول والاعوار الريبة عن أبى عبيد وهذا مكان معورّ
  أى يخاف فيه القطع وأءورلات السيد أى أمكنك وأعور الفارس اذا بدافيه موضع
  خلل للضرب قال الشاعر
  • الشدة الاولى اذا القرن أعورا
  وأعورت عينه لغة فى عرتها وعوّرتها تعو برامثله وعوّرت عين الركية اذا كبستها حتى
  نضب الماء وعوّرت عن فلان اذا كذبت عنه ورددت وعوّرته عن الامر صرفته عنه قال
  أبو عبيدة بقال للمستجير الذى يطلب الماء اذالم يسه قد هورت شريه وأنشد للفرزدق
  يقول متى ترديو ما سفار تجدبها • أديهم يرمى المستجير المعوّرا
  قال والاعور الذى قد عوّرولم تقض حاجته ولم يصب ماطلب وليس من عور العين وأنشد
  للعجاج
  وعوّد الرحن من ولى العود ويقال معناه أفدمن ولاه الفاد وعاورت
  المكابيل لغسة فى عايرتها ويقال عاوره الشى أى فعل به مثل مافعل صناحبه به واعتوروا
  الشئ أى تداولوه فيما بيتهم وكذلك تعوّروه وتهاوروه وانماظهسرت الواوف اعتور وإلانه
  فى معى
