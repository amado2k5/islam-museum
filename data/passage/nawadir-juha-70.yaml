text: "… القمر القديم كان جحا ماراً ذاتَ يوم بالقربِ من أحد الأوديةِ، فاعترضَهُ راعٍ وسأله : هل أنت فقيه يا سيدي؟ فقال: نعم. فقال الراعي: انظر إلى هذا الواديّ وإلى هؤلاء المطروحين فيه، فإنني قتلْتُهُم جميعاً لِتظاهُرِهِمْ بالعلمِ ولعِجزهِم عَنْ جوابٍ …"
summary:
  ar: "زعم راعٍ أنه قتل علماء عجزوا عن الإجابة عن سؤاله عن مصير الأقمار القديمة، فقال جحا إن الأقمار القديمة تُخزَّن للشتاء وتُصنع منها الصواعق، فقبّل الراعي يديه. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  en: "A shepherd claims he has killed scholars who could not answer his question about where old moons go; Juha says that old moons are stored for winter and made into lightning, and the shepherd kisses his hands. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  ur: "ایک چرواہے نے دعویٰ کیا کہ اس نے ان علماء کو مار ڈالا جو اس کے اس سوال کا جواب نہ دے سکے کہ پرانے چاند کہاں جاتے ہیں؛ جحا نے کہا کہ پرانے چاند سردیوں کے لیے جمع کر لیے جاتے ہیں اور ان سے بجلیاں بنتی ہیں، تو چرواہے نے اس کے ہاتھ چوم لیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  fr: "Un berger prétend avoir tué des savants qui ne savaient pas répondre à sa question sur le sort des vieilles lunes ; Juha dit que les vieilles lunes sont mises en réserve pour l'hiver et transformées en éclairs, et le berger lui baise les mains. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  es: "Un pastor afirma haber matado a unos sabios que no supieron responder a su pregunta sobre adónde van las lunas viejas; Juha dice que las lunas viejas se guardan para el invierno y se convierten en rayos, y el pastor le besa las manos. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
