text: "… حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، حَدَّثَنَا زَكَرِيَّا بْنُ أَبِي زَائِدَةَ، عَنِ الشَّعْبِيِّ، عَنِ الْحَارِثِ بْنِ مَالِكِ بْنِ الْبَرْصَاءِ، قَالَ سَمِعْتُ النَّبِيَّ يَوْمَ فَتْحِ مَكَّةَ يَقُولُ \" لاَ تُغْزَى هَذِهِ بَعْدَ الْيَوْمِ إِلَى يَوْمِ الْقِيَامَةِ \". قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنِ ابْنِ عَبَّاسٍ وَسُلَيْمَانَ بْنِ صُرَدٍ وَمُطِيعٍ. وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ وَهُوَ حَدِيثُ زَكَرِيَّا بْنِ أَبِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1611، يذكر الجذام والبرص. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 1611 (The Book on Military Expeditions), that mentions leprosy and vitiligo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 1611، جس میں جذام اور برص کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
