label: { ar: "الموطأ 229 — مالك: يقرأ المأموم في السرية ويترك في الجهرية", en: "Muwatta 229", es: "Muwatta 229", fr: "Muwatta 229", ur: "موطا 229", tr: "El-Muvatta 229 — Malik: Takip eden kişi bunu sessizce okur, sesli dualarda ise okumaz.", id: "Al-Muwatta 229 — Malik: Pengikut membacanya dalam hati dan menghilangkannya dalam salat yang diucapkan dengan suara keras." }
summary:
  ar: "قول لمالك يرويه يحيى سماعاً في باب ترك القراءة خلف الإمام فيما جهر فيه: الأمر عند أهل المدينة أن يقرأ الرجل وراء الإمام فيما لا يجهر فيه الإمام بالقراءة، ويترك القراءة فيما يجهر فيه. {cite:muwatta-maruf-1997 p.138} {cite:muwatta-maruf-1997 p.139}"
  tr: "Yahya'nın İmam'dan rivayet ettiği ve Malik'e atfedilen bir söz, imamın yüksek sesle okuduğu namazlarda imamın arkasından okumaktan kaçınma bölümünde yer almaktadır: Medine halkı arasında, imamın yüksek sesle okumadığı namazlarda bir erkeğin imamın arkasından okuması, imamın yüksek sesle okuduğu namazlarda ise okumaktan kaçınması adeti vardır. {cite:muwatta-maruf-1997 s.138} {cite:muwatta-maruf-1997 s.139}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya atas otoritas Imam, dalam bab tentang menahan diri dari membaca di belakang Imam dalam salat di mana Imam membaca dengan suara keras: Kebiasaan di kalangan penduduk Madinah adalah seorang laki-laki membaca di belakang Imam dalam salat di mana Imam tidak membaca dengan suara keras, dan menahan diri dari membaca dalam salat di mana Imam membaca dengan suara keras. {cite:muwatta-maruf-1997 p.138} {cite:muwatta-maruf-1997 p.139}"
