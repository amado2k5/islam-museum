text: "… الامي وعلى آله وصحبه وسلم - -م كتاب الحج الثالث م قلت لعبد الرحمن بن القاسم أرأيت كل هدى قلده رجل من جزاء الصيد أو نذر أو هدي القران أو غير ذلك من الهدى الواجب أو التطوع اذا قلده أو …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 255، يرد فيه ذكر الواجب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 255, whose wording mentions the obligatory (wajib), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 255 کا اقتباس جس میں واجب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
