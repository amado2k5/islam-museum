  id: "Kutipan dari Great Blog, Volume Bergambar 1, halaman 255, yang menyebutkan perbuatan wajib dan sukarela; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan terlarang, dan dosa kecil."
