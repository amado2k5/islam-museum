label: { ar: "الموطأ 232 — إذا قال الإمام آخر الفاتحة فقولوا آمين", en: "Muwatta 232", es: "Muwatta 232", fr: "Muwatta 232", ur: "موطا 232", tr: "Al-Muwatta 232 — Eğer İmam Fatiha suresinin son ayetini okursa, Âmin deyin.", id: "Al-Muwatta 232 — Jika Imam membaca ayat terakhir Al-Fatiha, maka ucapkanlah Amin." }
text: "فقولوا: آمين، فإنه من وافق قوله قول الملائكة غفر له ما تقدم من ذنبه"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي صالح السمان عن أبي هريرة، في باب ما جاء في التأمين خلف الإمام: أمر النبي المأمومين أن يقولوا آمين إذا ختم الإمام قراءة الفاتحة بالآية الأخيرة منها، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه. ويخرّجه المحقق عند البخاري ⁦(782، 4475)⁩ وأبي داود (935) والنسائي (2/144) وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الحديث في الموطأ بهذا الإسناد عند جماعة رواته ⁦(التمهيد 22/15–16)⁩. {cite:muwatta-maruf-1997 p.140} {cite:muwatta-maruf-1997 p.141}"
  id: "Malik meriwayatkan hadits ini dari Sumayy, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, dari Abu Salih al-Samman, dari Abu Hurayrah, dalam bab tentang apa yang diriwayatkan tentang mengucapkan \"Amin\" di belakang imam: Nabi (shalawat dan salam kepadanya) memerintahkan jamaah untuk mengucapkan \"Amin\" ketika imam selesai membaca Al-Fatihah dengan ayat terakhirnya. Barangsiapa yang ucapannya bertepatan dengan ucapan para malaikat, maka dosa-dosa masa lalunya akan diampuni. Peneliti memasukkannya ke dalam kumpulan hadits al-Bukhari (782, 4475), Abu Dawud (935), al-Nasa'i (2/144), Ahmad, dan al-Shafi'i melalui rantai periwayatan para sahabat Malik. Ia juga mengutip Ibnu Abd al-Barr yang mengatakan bahwa hadits tersebut terdapat dalam kitab al-Muwatta' dengan sanad yang diturunkan dari sekelompok perawinya (al-Tamhid 22/15–16)."
