label: { ar: "الموطأ 232 — إذا قال الإمام آخر الفاتحة فقولوا آمين", en: "Muwatta 232" }
text: "فقولوا: آمين، فإنه من وافق قوله قول الملائكة غفر له ما تقدم من ذنبه"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي صالح السمان عن أبي هريرة، في باب ما جاء في التأمين خلف الإمام: أمر النبي المأمومين أن يقولوا آمين إذا ختم الإمام قراءة الفاتحة بالآية الأخيرة منها، فمن وافق قوله قول الملائكة غُفر له ما تقدم من ذنبه. ويخرّجه المحقق عند البخاري (782، 4475) وأبي داود (935) والنسائي (2/144) وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الحديث في الموطأ بهذا الإسناد عند جماعة رواته (التمهيد 22/15–16). {cite:muwatta-maruf-1997 p.140} {cite:muwatta-maruf-1997 p.141}"
