text: "… مَات أرَادُوا دفنه عند قبر بشر، فجري في ذلك مَا ذكر شيخنا أبُو البرَكات إسمَاعيْل بن أبي سَعد الصُّوفي المَعرُوف بشيخ الشيوخ. قالَ: لما توفي أبُو بكر الخطيبُ الحَافظ أوْصَى أن يُدفن إلى جَانب بشر بن الحَارث، وكان الموضع الذي …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 34، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
