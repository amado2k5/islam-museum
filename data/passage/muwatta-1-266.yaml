label: { ar: "الموطأ 266 — من اغتسل يوم الجمعة ثم راح في الساعة الأولى فكأنما قرب بدنة", en: "Muwatta 266", es: "Muwatta 266", fr: "Muwatta 266", ur: "موطا 266", tr: "El-Muvatta 266 — Cuma günü gusül abdesti alıp ilk saatte camiye giden kimse, sanki bir deve kurban etmiş gibidir.", id: "Al-Muwatta 266 — Barang siapa yang bermandi (ghusl) pada hari Jumat dan kemudian pergi ke masjid pada jam pertama, maka seolah-olah ia mempersembahkan seekor unta sebagai kurban." }
text: "من اغتسل يوم الجمعة غسل الجنابة ثم راح في الساعة الأولى فكأنما قرب بدنة"
summary:
  ar: "أول حديث في باب العمل في غسل يوم الجمعة. يرويه يحيى عن مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي صالح السمان عن أبي هريرة: شبّه النبي من اغتسل يوم الجمعة غسل الجنابة ثم بكّر إليها في الساعة الأولى بمن قرّب بدنة، ومن راح في الثانية بمن قرّب بقرة، وفي الثالثة كبشاً أقرن، وفي الرابعة دجاجة، وفي الخامسة بيضة، فإذا خرج الإمام حضرت الملائكة يستمعون الذكر. ويخرّجه المحقق عند البخاري (881) ومسلم (3/4) وأبي داود (351) والترمذي (499) والنسائي (3/99) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (22/21). {cite:muwatta-maruf-1997 p.156} {cite:muwatta-maruf-1997 p.157}"
  id: "Hadits pertama dalam surah ini membahas tentang mandi wajib di hari Jumat. Diriwayatkan oleh Yahya dari Malik, dari Sumay, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, dari Abu Salih al-Samman, dari Abu Hurayrah: Nabi (shalawat dan salam kepadanya) menyamakan orang yang mandi wajib di hari Jumat, mandi setelah berhalusinasi, dan kemudian pergi ke masjid lebih awal di jam pertama dengan orang yang mempersembahkan unta sebagai kurban; orang yang pergi di jam kedua dengan orang yang mempersembahkan sapi; orang yang pergi di jam ketiga dengan orang yang mempersembahkan domba jantan bertanduk; orang yang pergi di jam keempat dengan orang yang mempersembahkan ayam; dan orang yang pergi di jam kelima dengan orang yang mempersembahkan sebutir telur. Ketika imam keluar, para malaikat hadir untuk mendengarkan khutbah. Peneliti memasukkannya ke dalam kumpulan al-Bukhari (881), Muslim (3/4), Abu Dawud (351), al-Tirmidzi (499), al-Nasa'i (3/99), Ibnu Hibban, Ahmad, dan al-Syafi'i melalui rantai penularan sahabat Malik, dan mengacu pada al-Tamhid (22/21). {kutip:muwatta-maruf-1997 hal.156} {kutip:muwatta-maruf-1997 hal.157}"
