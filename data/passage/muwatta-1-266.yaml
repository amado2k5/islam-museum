label: { ar: "الموطأ 266 — من اغتسل يوم الجمعة ثم راح في الساعة الأولى فكأنما قرب بدنة", en: "Muwatta 266" }
text: "من اغتسل يوم الجمعة غسل الجنابة ثم راح في الساعة الأولى فكأنما قرب بدنة"
summary:
  ar: "أول حديث في باب العمل في غسل يوم الجمعة. يرويه يحيى عن مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي صالح السمان عن أبي هريرة: شبّه النبي من اغتسل يوم الجمعة غسل الجنابة ثم بكّر إليها في الساعة الأولى بمن قرّب بدنة، ومن راح في الثانية بمن قرّب بقرة، وفي الثالثة كبشاً أقرن، وفي الرابعة دجاجة، وفي الخامسة بيضة، فإذا خرج الإمام حضرت الملائكة يستمعون الذكر. ويخرّجه المحقق عند البخاري (881) ومسلم (3/4) وأبي داود (351) والترمذي (499) والنسائي (3/99) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (22/21). {cite:muwatta-maruf-1997 p.156} {cite:muwatta-maruf-1997 p.157}"
