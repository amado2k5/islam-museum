label: { ar: "الموطأ 1647 — مالك: إذا قذف الرجل امرأته بعد أن يطلقها ثلاثا وهي حامل يقر بحملها، ثم يزعم أنه رآها تزني، جلد الحد ولم يلاعنها، وإن أنكر حملها لاعنها", en: "Muwatta 1647" }
summary:
  ar: "يقول مالك إذا قذف الرجل امرأته، بعد أن يطلقها ثلاثا، وهي حامل، يقر بحملها، ثم يزعم أنه قد رآها تزني قبل أن يفارقها، جلد الحد ولم يلاعنها. وإن أنكر حملها بعد أن يطلقها ثلاثا، لاعنها. قال وهذا الذي سمعت. {cite:muwatta-maruf-1997 p.79}"
