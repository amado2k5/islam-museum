label: { ar: "الموطأ 1647 — مالك: إذا قذف الرجل امرأته بعد أن يطلقها ثلاثا وهي حامل يقر بحملها، ثم يزعم أنه رآها تزني، جلد الحد ولم يلاعنها، وإن أنكر حملها لاعنها", en: "Muwatta 1647", es: "Muwatta 1647", fr: "Muwatta 1647", ur: "موطا 1647", tr: "El-Muvatta 1647 — Malik: Bir erkek, karısını üç defa boşadıktan sonra zina ile suçlarsa ve kadın hamile ise, erkek de kadının hamileliğini kabul eder ve sonra da zina yaparken gördüğünü iddia ederse, belirlenmiş cezaya göre kırbaçlanır ve Allah'ın lanetini ona yöneltmez. Fakat eğer hamileliği inkar ederse, Allah'ın lanetini ona yöneltir.", id: "Al-Muwatta 1647 — Malik: Jika seorang pria menuduh istrinya berzina setelah menceraikannya tiga kali, dan istrinya sedang hamil, lalu ia mengakui kehamilan istrinya, kemudian mengaku melihat istrinya berzina, maka ia dicambuk sesuai hukuman yang telah ditetapkan dan tidak dapat melaknat istrinya. Tetapi jika ia menyangkal kehamilan istrinya, maka ia dapat melaknat istrinya." }
summary:
  ar: "يقول مالك إذا قذف الرجل امرأته، بعد أن يطلقها ثلاثا، وهي حامل، يقر بحملها، ثم يزعم أنه قد رآها تزني قبل أن يفارقها، جلد الحد ولم يلاعنها. وإن أنكر حملها بعد أن يطلقها ثلاثا، لاعنها. قال وهذا الذي سمعت. {cite:muwatta-maruf-1997 p.79}"
  tr: "Malik şöyle dedi: Bir erkek, karısını üç kez boşadıktan sonra, hamile iken zina ile suçlarsa ve hamileliği kabul ederse, sonra da boşanmadan önce zina yaparken gördüğünü iddia ederse, belirlenen cezaya göre kırbaçlanır ve li'an yeminine tabi tutulmaz. Ancak üç kez boşandıktan sonra hamileliği inkar ederse, li'an yeminine tabi tutulur. Bunu işittim. {cite:muwatta-maruf-1997 s.79}"
  id: "Malik berkata: Jika seorang pria menuduh istrinya, setelah menceraikannya tiga kali, berzina saat istrinya sedang hamil, dan dia mengakui kehamilan istrinya, lalu mengaku bahwa dia melihat istrinya berzina sebelum dia menceraikannya, dia harus dicambuk sesuai dengan hukuman yang telah ditetapkan dan tidak dikenai sumpah kutukan (li'an). Tetapi jika dia menyangkal kehamilan istrinya setelah menceraikannya tiga kali, dia dikenai sumpah kutukan. Dia berkata: Inilah yang saya dengar. {cite:muwatta-maruf-1997 p.79}"
