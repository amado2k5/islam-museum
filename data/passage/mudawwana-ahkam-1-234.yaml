text: "… ينتفع به فعليه الفدية قلت وفديتهما اذا وجبت عليهما عند مالك سواء قال نعم وقات فهل كان مالك يكره للمرأة المهرمة لبس الحرير واخز والعصب قال قال لا بأس به للمحرمة قلت هل كان مالك يكره أن أعصب على الجراح …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 234، يرد فيه ذكر ما يجب على المكلف، وما كرهه الفقهاء، وما لا بأس به، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 234, whose wording mentions what is binding on the person addressed, what the jurists disliked, what is said to be no harm, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 234 کا اقتباس جس میں جو مکلف پر واجب ہے، جسے فقہاء نے مکروہ کہا، جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 1, p. 234, dont le texte mentionne ce qui s'impose à la personne responsable, ce que les juristes ont réprouvé, ce qui est dit sans inconvénient, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mudawwana al-Kubra, volumen digitalizado 1, p. 234, cuyo texto menciona lo que obliga a la persona responsable, lo que los juristas reprobaron, lo que se dice que no tiene inconveniente, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Hesap verebilir kişi için zorunlu olan, hukukçuların hoşlanmadığı, izin verilen ve hoşlanmadığı şeyleri belirten, resimli 1. cilt, 234. sayfadaki temel hukuk metninden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Zorunlu görevler, itaat eylemleri, tavsiye edilen eylemler, hoşlanmanan eylemler, yasaklanan eylemler ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari teks hukum utama, jilid 1 bergambar, halaman 234, yang menyebutkan apa yang wajib bagi orang yang bertanggung jawab, apa yang tidak disukai oleh para ahli hukum, apa yang diperbolehkan, dan apa yang tidak disukai; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari mengenai kewajiban, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa-dosa kecil."
