text: "… وقيل : معناه أَن يُحْمَى لهم الوادي الذي يُعَسّلُ فيه،لَ فلا بُتْركَ أَحدٌ يَعْرِض للعَسَل، لأن سبيلَ العسَل والمَعادِنِ والصُّيودِ، وإنما المُباحِ سبيلُ المِياهِ يَمْلِكُه مِن سَبَقِ إِليه، فإِذا حَماه ومَنَع الناسَ منه، وانْفَرَدَ به وَجَبَ عليه إِخراجُ العُشْرِ منه، …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 4، ص 382، يرد فيه ذكر ما يجب على المكلف، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 4, p. 382, whose wording mentions what is binding on the person addressed, the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 4، ص 382 کا اقتباس جس میں جو مکلف پر واجب ہے، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Lisan al-'Arab de Ibn Manzur, volume numérisé 4, p. 382, dont le texte mentionne ce qui s'impose à la personne responsable, le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen digitalizado 4, p. 382, cuyo texto menciona lo que obliga a la persona responsable, lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Manzur'un Lisan al-Arab adlı eserinin 4. cildinin 382. sayfasından, yasal sorumluluğu olan bir kişi için farz ve caiz olan şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Lisan al-Arab karya Ibn Manzur, Jilid 4, halaman 382, yang menyebutkan apa yang wajib dan diperbolehkan bagi orang yang bertanggung jawab secara hukum; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
