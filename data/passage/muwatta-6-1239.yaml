label: { ar: "الموطأ 1239 — عمر بن الخطاب قضى في الضبع بكبش، وفي الغزال بعنز، وفي الأرنب بعناق، وفي اليربوع بجفرة", en: "Muwatta 1239", es: "Muwatta 1239", fr: "Muwatta 1239", ur: "موطا 1239", tr: "El-Muvatta 1239 — Ömer ibn el-Hattab, sırtlanı öldürmenin cezasının koç, ceylanı öldürmenin cezasının keçi, tavşanı öldürmenin cezasının dişi genç keçi ve çöl sıçanını öldürmenin cezasının dişi genç keçi olduğunu hükmetmiştir.", id: "Al-Muwatta 1239 — Umar ibn al-Khattab menetapkan bahwa hukuman untuk membunuh hyena adalah seekor domba jantan, untuk seekor kijang seekor kambing, untuk seekor kelinci seekor kambing betina muda, dan untuk seekor jerboa seekor kambing betina muda." }
summary:
  ar: "يروي مالك عن أبي الزبير أن عمر بن الخطاب قضى في الضبع بكبش، وفي الغزال بعنز، وفي الأرنب بعناق، وفي اليربوع بجفرة. ويذكر المحقق أن أصحاب مالك رووه كلهم من حديث أبي الزبير عن جابر، وأن يحيى تفرد بعدم ذكر جابر. {cite:muwatta-maruf-1997 p.553}"
  tr: "Malik, Ebu el-Zübeyr'den rivayetle Ömer ibn el-Hattab'ın, sırtlanın öldürülmesinin karşılığının koç, ceylanın öldürülmesinin keçi, tavşanın öldürülmesinin oğlak ve jerboanın öldürülmesinin ise genç keçi olduğuna hükmettiğini aktarır. Araştırmacı, Malik'in tüm arkadaşlarının bunu Ebu el-Zübeyr'den, Cabir'den rivayet ettiğini ve Yahya'nın ise Cabir'den bahsetmeyen tek kişi olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.553}"
  id: "Malik meriwayatkan dari Abu al-Zubayr bahwa Umar ibn al-Khattab menetapkan bahwa ganti rugi untuk membunuh seekor hyena adalah seekor domba jantan, untuk seekor kijang seekor kambing, untuk seekor kelinci seekor anak kambing, dan untuk seekor jerboa seekor anak kambing. Peneliti mencatat bahwa semua sahabat Malik meriwayatkannya dari Abu al-Zubayr atas otoritas Jabir, dan bahwa Yahya adalah satu-satunya yang tidak menyebutkan Jabir. {cite:muwatta-maruf-1997 p.553}"
