label: { ar: "الموطأ 2065 — مالك: والأمر عندنا في النخل أيضا أنها تساقى السنين الثلاث والأربع وأقل من ذلك وأكثر، وذلك الذي سمعت", en: "Muwatta 2065", es: "Muwatta 2065", fr: "Muwatta 2065", ur: "موطا 2065", tr: "Al-Muwatta 2065 — Malik: Hurma ağaçlarıyla ilgili mesele şu ki, bunlar üç ya da dört yıl, daha az ya da daha fazla süreyle sulanıyor, ben de böyle duydum.", id: "Al-Muwatta 2065 — Malik: Dan masalah kita mengenai pohon kurma adalah bahwa pohon-pohon itu diairi selama tiga atau empat tahun, kurang dari itu, atau lebih, dan itulah yang saya dengar." }
summary:
  ar: "قال مالك: والأمر عندنا في النخل أيضا، أنها تساقى السنين الثلاث والأربع، وأقل من ذلك وأكثر. قال: وذلك الذي سمعت. {cite:muwatta-maruf-1997 p.244}"
  tr: "Malik şöyle dedi: Hurma ağaçlarıyla ilgili uygulamamız, onları üç veya dört yıl boyunca, ya da daha az veya daha fazla süreyle sulamaktır. Şöyle dedi: Ben de öyle duydum. {cite:muwatta-maruf-1997 s.244}"
  id: "Malik berkata: Praktik kami terkait pohon kurma adalah pohon-pohon tersebut diairi selama tiga atau empat tahun, atau kurang atau lebih dari itu. Dia berkata: Itulah yang saya dengar. {cite:muwatta-maruf-1997 p.244}"
