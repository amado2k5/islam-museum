text: "بمنى. وقد ذكره المصنف في باب الحلق، فهذا تعارض فرجح ابن حزم في كتاب ((حجة الوداع)) له قول عائشة وجابر وتبعه على ذلك جماعة بأربعة أوجه: أحدها : أنهما اثنان وهما أولى من الواحد. وثانيها : أن عائشة أخص الناس"
