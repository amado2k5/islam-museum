text: "… عني ولو آية أمرٌ قصد به الصحابة ويدخل في جملة هذا الخطاب من كان بوصفهم إلى يوم القيامة في تبليغ من بعدهم عنه وَاليم وهو فرض على الكفاية إذا قام البعض بتبليغه سقط عن الآخرين فرضه، وإنما يلزم فرضيّته من …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 1663، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 1663, whose wording mentions what was made obligatory on people, the obligatory (fard), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 1663 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 3, p. 1663, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 3, p. 1663, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, Resimli Cilt 3, s. 1663'ten bir alıntı; insanların üzerine farz olan, farz olan fiilleri, toplumsal yükümlülükleri ve bazıları tarafından yerine getirildikten sonra geri kalanlar için artık gerekli olmayan şeyleri belirtmektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid Bergambar 3, hlm. 1663, yang menyebutkan apa yang wajib bagi manusia, perbuatan wajib, kewajiban bersama, dan apa yang, jika dipenuhi oleh sebagian orang, tidak lagi diwajibkan bagi yang lain; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
