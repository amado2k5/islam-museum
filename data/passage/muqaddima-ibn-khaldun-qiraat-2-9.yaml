text: "… من اشتهر بروايتها من الجم الغفير، فصارت هذه القراءات السبع أصولاً للقراءة. وربما زيد بعد ذلك قراءات أخر لحقت بالسبع، إلا أنها عند أئمة القراءة لا تقوى قوتها في النقل. وهذه القراءات السبع معروفة في كتبها. وقد خالف بعض الناس …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 2، ص 9، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 2, p. 9, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 2، ص 9 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
