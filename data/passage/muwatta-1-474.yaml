label: { ar: "الموطأ 474 — أليس يشهد أن لا إله إلا الله؟ أليس يصلي؟ أولئك الذين نهاني الله عنهم", en: "Muwatta 474" }
text: "أليس يشهد أن لا إله إلا الله وأن محمداً رسول الله؟ فقال الرجل: بلى ولا شهادة له. فقال: أليس يصلي؟ قال: بلى ولا صلاة له"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عطاء بن يزيد الليثي عن عبيد الله بن عدي بن الخيار مرسلاً، في باب جامع الصلاة: بينما النبي جالس بين الناس جاءه رجل فسارّه، ثم جهر النبي فإذا هو يستأذنه في قتل رجل من المنافقين، فسأله النبي أليس يشهد الشهادتين، فقال بلى ولا شهادة له، فسأله أليس يصلي، فقال بلى ولا صلاة له، فقال النبي: أولئك الذين نهاني الله عنهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن سائر رواة الموطأ رووه مرسلاً إلا روح بن عبادة فوصله (التمهيد 10/150)، ويذكر أن ابن جريج تابع مالكاً على إرساله، وأن رواية عبد الرزاق عن معمر موصولة عدّها أبو حاتم من أوهام عبد الرزاق فالصواب الإرسال. {cite:muwatta-maruf-1997 p.242} {cite:muwatta-maruf-1997 p.243}"
