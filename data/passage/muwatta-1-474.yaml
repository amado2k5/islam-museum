ref: "1.474"
label: { ar: "الموطأ 474 — أليس يشهد أن لا إله إلا الله؟ أليس يصلي؟ أولئك الذين نهاني الله عنهم", en: "Muwatta 474", es: "Muwatta 474", fr: "Muwatta 474", ur: "موطا 474", tr: "El-Muvatta 474 — \"O, Allah'tan başka ilah olmadığına şahitlik etmiyor mu? Namaz kılmıyor mu? İşte Allah'ın bana ortak koşmayı yasakladığı kimselerdir bunlar.\"", id: "Al-Muwatta 474 — Tidakkah dia bersaksi bahwa tidak ada tuhan selain Allah? Tidakkah dia berdoa? Mereka itulah orang-orang yang diharamkan Allah untuk aku sekutukan." }
text: "أليس يشهد أن لا إله إلا الله وأن محمداً رسول الله؟ فقال الرجل: بلى ولا شهادة له. فقال: أليس يصلي؟ قال: بلى ولا صلاة له"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عطاء بن يزيد الليثي عن عبيد الله بن عدي بن الخيار مرسلاً، في باب جامع الصلاة: بينما النبي جالس بين الناس جاءه رجل فسارّه، ثم جهر النبي فإذا هو يستأذنه في قتل رجل من المنافقين، فسأله النبي أليس يشهد الشهادتين، فقال بلى ولا شهادة له، فسأله أليس يصلي، فقال بلى ولا صلاة له، فقال النبي: أولئك الذين نهاني الله عنهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن سائر رواة الموطأ رووه مرسلاً إلا روح بن عبادة فوصله ⁦(التمهيد 10/150)⁩، ويذكر أن ابن جريج تابع مالكاً على إرساله، وأن رواية عبد الرزاق عن معمر موصولة عدّها أبو حاتم من أوهام عبد الرزاق فالصواب الإرسال. {cite:muwatta-maruf-1997 p.242} {cite:muwatta-maruf-1997 p.243}"
  tr: "Malik, İbn Şihab'dan, Ata ibn Yazid el-Laythi'den, Ubeyd Allah ibn Adi ibn el-Khiyar'dan rivayetle, tam namaz bölümünde mursal hadis olarak şöyle nakletmiştir: Peygamberimiz halkın arasında otururken, bir adam yanına gelip ona fısıldadı. Bunun üzerine Peygamberimiz yüksek sesle konuştu ve adamın bir münafığı öldürmek için izin istediği ortaya çıktı. Peygamberimiz ona, \"İki şahitliğe şahitlik etmiyor mu?\" diye sordu. Adam, \"Evet, ama şahitliği yok\" diye cevap verdi. Peygamberimiz ona, \"Namaz kılmıyor mu?\" diye sordu. Adam, \"Evet, ama namazı yok\" diye cevap verdi. Peygamberimiz buyurdu ki: \"İşte bunlar, Allah'ın bana öldürmeyi yasakladığı kimselerdir.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtiyor ve İbn Abdülberr'in, Muvatta'nın tüm ravilerinin, Ravh ibn Ubadah hariç, mursal olarak naklettiğini söylediğini aktarıyor (el-Tamhid 10/150). Ayrıca İbn Cüreyc'in de Malik'i takip ederek mursal olarak naklettiğini ve Abdülrazzak'ın Ma'mar'dan rivayet ettiği, bağlı olan nakledinin ise Ebu Hatim tarafından Abdülrazzak'ın hatalarından biri olarak kabul edildiğini belirtiyor. Bu nedenle, doğru versiyon mursaldır. {cite:muwatta-maruf-1997 s.242} {cite:muwatta-maruf-1997 s.243}"
  id: "Malik meriwayatkannya dari Ibnu Shihab, dari Ata ibn Yazid al-Laythi, dari Ubayd Allah ibn Adi ibn al-Khiyar, sebagai hadits mursal, dalam surah tentang shalat lengkap: Ketika Nabi sedang duduk di antara orang-orang, seorang laki-laki datang kepadanya dan berbisik kepadanya. Kemudian Nabi berbicara dengan lantang, dan terungkap bahwa laki-laki itu meminta izin untuk membunuh seorang munafik. Nabi bertanya kepadanya, \"Apakah dia tidak bersaksi atas dua syahadat?\" Dia menjawab, \"Ya, tetapi dia tidak mempunyai syahadat.\" Nabi bertanya kepadanya, \"Apakah dia tidak shalat?\" Dia menjawab, \"Ya, tetapi dia tidak mempunyai syahadat.\" Nabi berkata, \"Mereka itulah orang-orang yang Allah haramkan untuk kubunuh.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkan hadits ini dari Malik, dan mengutip Ibnu Abd al-Barr yang mengatakan bahwa semua perawi Muwatta' meriwayatkan hadits ini sebagai mursal kecuali Rawh ibn Ubadah, yang menghubungkannya (al-Tamhid 10/150). Ia juga menyebutkan bahwa Ibnu Jurayj mengikuti Malik dalam meriwayatkan hadits ini sebagai mursal, dan bahwa riwayat Abd al-Razzaq atas otoritas Ma'mar, yang dihubungkan, dianggap oleh Abu Hatim sebagai salah satu kesalahan Abd al-Razzaq. Oleh karena itu, versi yang benar adalah mursal. {cite:muwatta-maruf-1997 p.242} {cite:muwatta-maruf-1997 p.243}"
