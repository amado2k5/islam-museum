text: "لقد علم الأقوام أن ابن هاشم هو الغصن ذو الأفنان لا الواحد الوغد"
summary:
  ar: "بيت من أبيات «لقد علم الأقوام» في هجاء أبي سفيان بن الحارث، كما في شرح البرقوقي لديوان حسان {{cite:sharh-diwan-hassan-barquqi-1929 p.159}}."
  en: "Verse 1 of verses against Abu Sufyan ibn al-Harith ('The peoples know'), as in al-Barquqi's commentary on Hassan's diwan."
  es: "Verso 1 de versos contra Abu Sufyan ibn al-Harith ('Los pueblos saben'), como en el comentario de al-Barquqi sobre el diwan de Hassan."
  fr: "Verset 1 des versets contre Abu Sufyan ibn al-Harith (« Les peuples savent »), comme dans le commentaire d'al-Barquqi sur le diwan de Hassan."
  ur: "ابو سفیان بن حارث کے خلاف آیات کی پہلی آیت ⁦('لوگ جانتے ہیں')⁩ جیسا کہ حسن کے دیوان کی تفسیر البرقی میں ہے۔"
  tr: "El-Barquqi'nin Hasan'ın Divanı üzerine yaptığı tefsirde yer alan, Ebu Sufyan ibn el-Harith'i hicveden \"İnsanlar Öğrendi\" şiirinden bir dize {{cite:sharh-diwan-hassan-barquqi-1929 s.159}}."
  id: "Sebuah bait dari puisi “Orang-orang telah belajar” dalam satire Abu Sufyan ibn al-Harith, sebagaimana terdapat dalam komentar al-Barquqi tentang Diwan Hassan {{cite:sharh-diwan-hassan-barquqi-1929 p.159}}."
translations:
  en:
    text: "The peoples know that the son of Hashim is the branch of many boughs, not the single base servant."
