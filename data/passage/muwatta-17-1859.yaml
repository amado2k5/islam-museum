label: { ar: "الموطأ 1859 — مالك: الأمر عندنا في بيع الذهب بالذهب، أو الورق بالورق، مراطلة، أنه لا بأس به، أن يأخذ أحد عشر دينارا بعشرة دنانير يدا بيد، إذا كان وزن الذهبين سواء، وإن تفاضل العدد، والدراهم بمنزلة الدنانير", en: "Muwatta 1859", es: "Muwatta 1859", fr: "Muwatta 1859", ur: "موطا 1859", tr: "El-Muvatta 1859 — Malik: Altın karşılığında altın veya gümüş karşılığında gümüş takası konusunda uygulamamız şöyledir: İki altın eşyanın ağırlığı aynıysa, sayıları farklı olsa bile, elden ele on bir dinar karşılığında on dinar almak gibi bir sakınca yoktur. Dirhemler dinar ile eşdeğer kabul edilir.", id: "Al-Muwatta 1859 — Malik: Kebiasaan kita mengenai jual beli emas dengan emas, atau perak dengan perak, melalui sistem barter, adalah tidak ada salahnya, seperti menerima sebelas dinar untuk sepuluh dinar secara langsung, jika berat kedua barang emas tersebut sama, meskipun jumlahnya berbeda. Dirham dianggap setara dengan dinar." }
summary:
  ar: "قال مالك: الأمر عندنا في بيع الذهب بالذهب، أو الورق بالورق، مراطلة، أنه لا بأس بذلك، أن يأخذ أحد عشر دينارا بعشرة دنانير، يدا بيد، إذا كان وزن الذهبين سواء، عينا بعين، وإن تفاضل العدد. والدراهم أيضا في ذلك بمنزلة الدنانير. {cite:muwatta-maruf-1997 p.164}"
  tr: "Malik şöyle dedi: Altın karşılığında altın veya gümüş karşılığında gümüş takası konusunda uygulamamız şudur: On bir dinarı on dinarla takas etmek gibi, iki altın eşyanın ağırlığı eşit olduğu sürece, sayıları farklı olsa bile, elden ele alışverişte hiçbir sakınca yoktur. Dirhemler de bu konuda dinarlarla aynı şekilde değerlendirilir. {cite:muwatta-maruf-1997 s.164}"
  id: "Malik berkata: Praktik kita mengenai penjualan emas dengan emas, atau perak dengan perak, melalui pertukaran, adalah bahwa tidak ada yang salah dengan hal itu, seperti mengambil sebelas dinar untuk sepuluh dinar, secara langsung, asalkan berat kedua barang emas tersebut sama, barang demi barang, meskipun jumlahnya berbeda. Dirham juga diperlakukan sama seperti dinar dalam hal ini. {cite:muwatta-maruf-1997 p.164}"
