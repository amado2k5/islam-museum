label: { ar: "صحيح البخاري 7314 — الرخصة", en: "Sahih al-Bukhari 7314 — the concession (rukhsa)", ur: "صحیح بخاری 7314 — رخصت", fr: "Sahih al-Bukhari 7314 — la dispense (rukhsa)", es: "Sahih al-Bujari 7314 — la dispensa (rukhsa)", tr: "Sahih el-Buhari 7314 — Lisans", id: "Sahih al-Bukhari 7314 — Lisensi" }
text: "… لَهُ رَسُولُ اللَّهِ \" هَلْ لَكَ مِنْ إِبِلٍ \". قَالَ نَعَمْ. قَالَ \" فَمَا أَلْوَانُهَا \". قَالَ حُمْرٌ. قَالَ \" هَلْ فِيهَا مِنْ أَوْرَقَ \". قَالَ إِنَّ فِيهَا لَوُرْقًا. قَالَ \" فَأَنَّى تُرَى ذَلِكَ جَاءَهَا \". قَالَ يَا رَسُولَ اللَّهِ عِرْقٌ نَزَعَهَا. قَالَ \" وَلَعَلَّ هَذَا عِرْقٌ نَزَعَهُ \". وَلَمْ يُرَخِّصْ لَهُ فِي الاِنْتِفَاءِ مِنْهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7314، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 7314 (Holding Fast to the Qur'an and Sunnah), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 7314، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 7314, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 7314, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 7314 numaralı hadis, bir istisnadan bahsetmektedir. Farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahları derleyen bu eser, Kur'an, Sünnet, biyografi ve Sahabe ve ümmetlerden gelen rivayetlerle birlikte, metinde yer alanları açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7314, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
