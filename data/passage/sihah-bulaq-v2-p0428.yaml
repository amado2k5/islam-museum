  فيدغم فية ول بلّ وه-ل وقسد بالتشديد ⁦(بول)⁩ البول واحد الابوال وقدبال يبول
  والاسم البيدلة كالجلسة والركية ويقال أخذه بوال بالضم اذا جعل البول بعستريه كثيرا
  وكثرة الشراب.بولة بالنتح والمبولة بالكسر كوزيسال فيه وبقال لنبيلن الحيل فى عرصاتكم
  وقول الفرزدق
  وان الذى ب- فى ايفد زوجق • كساع الى أسد الشرى يستبيلها
  أى يأخذيولها فى يده وبولان حى من طي والبال القلب تقول ما يخطر فلان ب.إلى والبال
  رحاء النفس يقال فلان رخىّ البال والبال الحال يقال ما بالك وقولهسم ايس هذا من
  بالى أى عما أبالمه والبال الحوت العظيم من حيتان البحر وليس بعربى والبالة وعاء الطيب
  فارسى معرب وأصل بالفارسية بيله قال أبو ذؤيب
