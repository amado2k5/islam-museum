  بلوا أرحا كم ولو بالسلام اى ندّوها بالص لة وقولهم بلك اللّٰه بابن أى رزقكه يدعوله وبللت به
  بالكسراذا ظ فوت به وصار فى يدلٰ يقال لثن بات بك يدى لا تفارقنى أو تؤدّى -قى قال ابن
  ويلى أن بلات بأريحى • من الفتيان لا يضحى بطينا
  ويروى فبلى ياغى ورجل أبلّ بين البال اذا كان حسلا فاظلوما وذكرأبو عبيدة أنّ الابل"
  الفاجر وأنشدامسيب بن علس
