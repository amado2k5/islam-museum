  بلاء وه والذى لا يدرك ماعنده من اللؤم. وصغاة بلاء اى ملساء وبل مخفف حرف يعطف بها
  الحرف الثانى على الاوّل فلزمه مثل اعرابه وهو للاضراب•ن الاوّل للثانى كقولك ماجاتى
  زيديل عم-رو ومارأيت زيدابل عمراوجاءنى أخول بل أبوك تعطف بها بعد الننى والانيات
  جيعا وربما وضعوه موضع رب كقول الراجز• بل مهمه قطعت بعدمهمه • يعى رب مهمه
  كمايوضع الحرفموضع غيره اتساعا وقال آخر• بل جوزتيها. كظهر الجفت• وقوله تعالى
  ص والقران ذى الذسكربل الذين كفروافى عزة وشقاق قال الاخفس عن بعضهم انّ بل
