text: "… عن هارون العطار، وأبي بكر بن السني وأبي بكر القطيعي. قال شيرويه في تاريخه : كان ثقة صدوقاً، كثير الرواية للمناكير، حسن الخط، كثير التصانيف. مات بنيسابور في ربيع الآخر سنة أربع عشرة وأربعمائة. - ابن البقال : عبيد اللّٰه …"
summary:
