label: { ar: "صحيح مسلم 6206 — أثر من الآثار المحفوظة", en: "Sahih Muslim 6206 — a relic kept after its owner", ur: "صحیح مسلم 6206 — محفوظ آثار و تبرکات", es: "Sahih Muslim 6206 — una reliquia conservada después de su dueño.", fr: "Sahih Muslim 6206 — une relique conservée après son propriétaire" }
text: "حَدَّثَنَا عُقْبَةُ بْنُ مُكْرَمٍ الْعَمِّيُّ، حَدَّثَنَا سَعِيدُ بْنُ عَامِرٍ، قَالَ جُوَيْرِيَةُ بْنُ أَسْمَاءَ أَخْبَرَنَا عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ عُمَرُ وَافَقْتُ رَبِّي فِي ثَلاَثٍ فِي مَقَامِ إِبْرَاهِيمَ وَفِي الْحِجَابِ وَفِي أُسَارَى بَدْرٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6206، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6206 (The Book of the Merits of the Companions), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 6206، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6206 (El Libro de los Méritos de los Compañeros), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 6206 (Livre des mérites des Compagnons), mentionne une relique conservée après le décès de son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
