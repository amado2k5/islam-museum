text: "… ٢٤٤٠، وابن ماجه: ١٧٣٢ ، وفي سنده من لا يُعرف] . وصح عنه أن صيامَه يُكفِّرُ السنة الماضيةَ والبَاقِيةً، ذكره مسلم [٢٧٧٧]. الحكم من فطر يوم عرفة بعرفة وقد ذُكر لِفطره بعرفة عِدَّةُ حِكم . منها أنه أقوى على الدعاء."
