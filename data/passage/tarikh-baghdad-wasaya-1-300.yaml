text: "… بالموصل - حدثنا احمد بن عبيد اللّٰه الترسى حدثنا شبابة بن سوار حدثنا شعبة عن نهيم بن أبي هند عن أبى وائل عن مسروق عن عائشة قالت : صلى النبى فى مرضه الذى مات فيه خلف أبى بكر"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 300، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
