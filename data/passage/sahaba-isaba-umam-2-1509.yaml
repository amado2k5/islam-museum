text: "… بن أبي هند، مشهور بكنيته: قال خليفة بن خياط: اسمه رافع بن أشيم يعد في - النضير بن النضر بن الحارث العبدري: الكوفيين يقال له نعمان مولى أشجع. ذكره المستغفري، ونقل عن أبي إسحاق أنه من أبناء مهاجرة الحبشة. وأورده …"
