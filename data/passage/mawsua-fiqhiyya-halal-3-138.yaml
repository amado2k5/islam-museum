  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 3, sayfa 138'den, helal, haram ve şüpheli (şüpheli) olan konuları ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikası gereği metin yaklaşık kırk kelimeyle sınırlıdır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
