  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 3, p. 138, that mentions the lawful, the unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 3، ص 138 کا اقتباس جس میں حلال، حرام، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
