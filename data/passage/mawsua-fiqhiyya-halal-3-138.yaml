text: "… يكون للواطىء فيها ملك أو شبهة ملك كالأمة المشتركة. أو في الطريق : بأن يكون حراما عند سورة المائدة اين عابدين، والطحطاوي، والشرح الصغير، والقوانين الفقهية، وروضة الطالبين، والمنثور في القواعد،، والمغني، حدود - قوم، حلالا عند آخر. وفي الموضوع …"
summary:
