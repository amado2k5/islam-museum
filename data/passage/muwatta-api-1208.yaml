label: { ar: "موطأ مالك 1208 — ما لا حرج فيه", en: "Muwatta Malik 1208 — what carries no blame", ur: "موطأ مالک 1208 — جس میں کوئی حرج نہیں", fr: "Muwatta de Malik 1208 — ce qui n'entraîne aucun blâme", es: "Muwatta de Malik 1208 — lo que no acarrea reproche" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ نَافِعٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، كَانَ يَقُولُ مَنْ أَذِنَ لِعَبْدِهِ أَنْ يَنْكِحَ فَالطَّلاَقُ بِيَدِ الْعَبْدِ لَيْسَ بِيَدِ غَيْرِهِ مِنْ طَلاَقِهِ شَىْءٌ فَأَمَّا أَنْ يَأْخُذَ الرَّجُلُ أَمَةَ غُلاَمِهِ أَوْ أَمَةَ وَلِيدَتِهِ فَلاَ جُنَاحَ عَلَيْهِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1208، يرد فيه ذكر ما لا حرج فيه. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1208 (Divorce), whose wording mentions what carries no blame. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1208، جس کے الفاظ میں جس میں کوئی حرج نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1208, dont le texte mentionne ce qui n'entraîne aucun blâme. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1208, cuyo texto menciona lo que no acarrea reproche. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
