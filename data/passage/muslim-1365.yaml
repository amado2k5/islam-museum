label: { ar: "مسلم 1365 — إن أحداً جبل يحبنا ونحبه", en: "Muslim 1365 — Uhud, a mountain that loves us and we love", es: "Musulmán 1365 — Uhud, una montaña que nos ama y a la que amamos.", fr: "Muslim 1365 — Uhud, une montagne qui nous aime et que nous aimons", ur: "مسلم 1365 - احد، ایک پہاڑ جو ہم سے محبت کرتا ہے اور ہم پیار کرتے ہیں۔", tr: "Müslim 1365 — Gerçekten de bizi seven ve bizim de sevdiğimiz bir dağ vardır.", id: "Muslim 1365 — Sesungguhnya ada sebuah gunung yang mencintai kita dan kita pun mencintainya." }
text: "قال أنس بن مالك: نظر رسول الله إلى أحد فقال: إن أحداً جبل يحبنا ونحبه"
summary:
  ar: "رواية أنس بن مالك في باب فضل المدينة من كتاب الحج في صحيح مسلم؛ قوله عن جبل أحد «جبل يحبنا ونحبه»، وفي السياق نفسه «هذه طيبة»."
  tr: "Sahih Müslim'deki Hac Kitabı'nda Medine'nin faziletleri bölümünde Enes bin Malik'in rivayetinde; Uhud Dağı hakkında söylediği şu sözler: \"Bizi seven ve bizim de sevdiğimiz bir dağ\" ve aynı bağlamda: \"Burası Taybe (Medine).\""
  id: "Riwayat Anas bin Malik dalam bab tentang keutamaan Madinah dalam Kitab Haji di Sahih Muslim; pernyataannya tentang Gunung Uhud: “Sebuah gunung yang mencintai kita dan kita mencintainya,” dan dalam konteks yang sama: “Inilah Taybah (Madinah).”"
