summary:
  ar: "قال مالك: ولا بأس بالسوم بالسلعة توقف للبيع، فيسوم بها غير واحد. قال: ولو ترك الناس السوم عند أول من يسوم بها، أخذت بشبه الباطل من الثمن، ودخل على البائعين في سلعهم المكروه. ولم يزل الأمر عندنا على هذا. {cite:muwatta-maruf-1997 p.217}"
