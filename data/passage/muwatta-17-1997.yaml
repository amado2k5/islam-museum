label: { ar: "الموطأ 1997 — مالك: لا بأس بالسوم بالسلعة توقف للبيع فيسوم بها غير واحد، ولو ترك الناس السوم عند أول من يسوم بها، أخذت بشبه الباطل من الثمن، ودخل على البائعين في سلعهم المكروه", en: "Muwatta 1997", es: "Muwatta 1997", fr: "Muwatta 1997", ur: "موطا 1997", tr: "Al-Muwatta 1997 — Malik: Satılık bir mal için birden fazla kişinin teklif vermesinde bir sakınca yoktur. Eğer insanlar teklif vermeyi bırakıp ilk teklif vereni beklerlerse, bu haksız bir fiyata benzer bir durum olur ve satıcıların mallarına istenmeyen bir şey girer.", id: "Al-Muwatta 1997 — Malik: Tidak ada salahnya menawar suatu barang yang dijual, sehingga lebih dari satu orang menawarnya. Jika orang-orang berhenti menawar dan menunggu orang pertama menawarnya, maka barang tersebut akan diambil dengan harga yang tidak adil, dan sesuatu yang tidak diinginkan akan masuk ke dalam barang milik penjual." }
summary:
  ar: "قال مالك: ولا بأس بالسوم بالسلعة توقف للبيع، فيسوم بها غير واحد. قال: ولو ترك الناس السوم عند أول من يسوم بها، أخذت بشبه الباطل من الثمن، ودخل على البائعين في سلعهم المكروه. ولم يزل الأمر عندنا على هذا. {cite:muwatta-maruf-1997 p.217}"
  tr: "Malik şöyle dedi: Satılık bir mal için birden fazla kişinin teklif vermesinde bir sakınca yoktur. Şöyle devam etti: Eğer insanlar en başından teklif vermeyi bırakırlarsa, fiyat gayrimeşru sayılır ve satıcılar mallarıyla ilgili istenmeyen uygulamalara maruz kalırlar. Bu, aramızda her zaman böyle olmuştur. {cite:muwatta-maruf-1997 s.217}"
  id: "Malik berkata: Tidak ada yang salah dengan penawaran pada suatu barang yang dijual, sehingga lebih dari satu orang menawarnya. Ia berkata: Jika orang-orang berhenti menawar sejak awal, harga tersebut akan dianggap tidak sah, dan para penjual akan menjadi sasaran praktik-praktik yang tidak diinginkan terkait barang dagangan mereka. Ini selalu menjadi praktik di antara kita. {cite:muwatta-maruf-1997 p.217}"
