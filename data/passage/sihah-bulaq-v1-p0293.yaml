text: |-
  ٣٤٨
  ⁦(باب الرا٠)⁩
  باانتح الذل والضيم وكذلك الصغر بالضم والمصدر الصغر بالتحريك وقد صغو الرجل بالكسر
  يضغر صغرايقال قم على صغرك وصغرك والصاغر الرضى بالضيم والصغوراء اصغار
  وأرس مصغرة نبتها صغير لم يطل عن ابن السكيت ⁦( صفر )⁩ الصفرلون الاصفروقد
  صفرّا نشئ واصفار وصفره غيره وأحلك النسا الاصفران الذهب والزعفران ويقال الورس
  والزعفران وفرس أصفروه و الذى يسمى بالفارسية زرده قال الاصمعى ولا يسمى أصفر
  حتى يصفريّذنْبه وعرفه وينو الاصفر الروم ورعماسمت العرب الاسود أصفر قال الاعشى
  تلك خبلى منه وتلك ركابى * هن صفر أولادها كازيب
  ويقال انه افى صفرة للذى يعتريه الجنون اذا كان فى أيام يزول فيهاعله لانهم كانوا
  عسحونه بشئ من الزعفران والصه ربااضم الذى تعمل منه إلا وانى وأبو عبيدة يقوله بالمكسر
  والصرأيضا الخالى يقال بيت صفرمن المشاع ورجل صفر البدين وفى الحديث ان أصفر
  البيوت من الخير البيت الصفر من كتاب اللّٰه وقدصفر بالكسر وأصفر الرجل فهو
  مصذرأى افتقر والصفاريت الفقراء الواحد صفريت قال ذوالرمة ولاخور صغاريت
  والتاءزائدة وصفر الشهر بعدالحرّم والجمع أصفار وقال ابن دريد الصفران شهرات
  من السنة عى أحدهما فى الاسلام المحزم والصفرىّ فى النتاج بعد القيظى والصفرية
  نسات يكون فى أوّل الخريف والصفرى المطر يأتى فى ذلك الوقت والصفر فيما تزعم العرب
  مة فى البطر تعض الانسان اذاجاع واللذع الذى يجده عند الموع من عضه قال أعشو
  باهلة يرثى أخاه لا يتأرى لما فى القدريرقبه • ولا يعض على شرسوفه الصفر
  وفى الحديث لأصة رولاهامة وقولهم لا يلتاط هذا بصفرى أى لا يلزق بى ولاقة.له نفسى
  والصفرأيضا مصدر قولك صفر الشى بالكسرأى خلايقال تعوذيالله من صفر الاناء
  يعنون به هلاك المواشى وصفر الطائريصفر صفيرا أى- كاومنه قواهم أجين من صافر وأصفر
  من يلبل والنسر يصفر وقولهم مابم اصافر أى أحد وحسكى الفرّاء عن بعضهم قال كان
  فى كلامه صفار بالضم يريد صفيرا والصفارية طائر والصفار بالفتح يبيس البهمى والصفار
  بالضم اجتماع الماء الاصفر فى البطن يعالج بقطع النائط وهو عرق فى الصلب قال الراجز
  قضب الطبيب نائط المصفور وقوله-م فى الشتمّ فلان مصفراسته هو من الصغير لا من الصفرة
  أى ضراط والصفراء القوص والصفراءنيت والصفرية بالض م صنف من الخوارج نسبوا الى
  زيادين الاصفررتيسهم وذعم قوم أنّ الذى نسبوا اليه هو عبد اللّٰه بن الصفاروأنهم الصفرية
  بكسر الصاد (صقر الصرالطائر الذى يصادبه والصقرأيضا الملبن الشديد الموضة
  يقال جاءنابصرة تزوى الوجه كما يقال بصربة -كاهما الكسائى والصة رأيضا الدبس عند
  أهل المدينة يقال رطب صقر للذى يصلح اللدبس والمصقر من الرطب المصلب يصب علي
  الدبنس ليلين وربماجاء بالسين لانهم كثيراما يقلبون الصادسينا اذا كان فى المكامة قاف أوطاء
  أوغين أوخاء مثل الصدغ والصماخ والصراط والبصاق أبوع روالصاقور الفاس العظيمة التى
  لهارأس واحددقيق تكسر به الحجارة وهو المعول أيضا والاصعى مشله وقدصقرت
  الحجارة صقرا اذا كسرتها بالصاقور والصة روالصرة شدة وقع الشمس يقال صقرته الشمس
  قال
