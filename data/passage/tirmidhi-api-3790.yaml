label: { ar: "جامع الترمذي 3790 — الحلال، الحرام", en: "Jami' al-Tirmidhi 3790 — the lawful; the unlawful", ur: "جامع ترمذی 3790 — حلال، حرام", es: "Jami' al-Tirmidhi 3790 — lo lícito; lo ilícito", fr: "Jami' al-Tirmidhi 3790 — le licite; l'illicite", tr: "Cami' el-Tirmizi 3790 — Helal, Haram", id: "Jami' al-Tirmidzi 3790 — Halal, Haram" }
text: "… قَالَ رَسُولُ اللَّهِ \" أَرْحَمُ أُمَّتِي بِأُمَّتِي أَبُو بَكْرٍ وَأَشَدُّهُمْ فِي أَمْرِ اللَّهِ عُمَرُ وَأَصْدَقُهُمْ حَيَاءً عُثْمَانُ وَأَعْلَمُهُمْ بِالْحَلاَلِ وَالْحَرَامِ مُعَاذُ بْنُ جَبَلٍ وَأَفْرَضُهُمْ زَيْدُ بْنُ ثَابِتٍ وَأَقْرَؤُهُمْ أُبَىُّ بْنُ كَعْبٍ وَلِكُلِّ أُمَّةٍ أَمِينٌ وَأَمِينُ هَذِهِ الأُمَّةِ أَبُو عُبَيْدَةَ بْنُ الْجَرَّاحِ \". هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ مِنْ حَدِيثِ قَتَادَةَ إِلاَّ مِنْ هَذَا الْوَجْهِ. …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3790، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3790 (Chapters on Virtues), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3790، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3790 (Capítulos sobre las virtudes), menciona lo lícito y lo ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3790 (Chapitres sur les vertus), mentionne le licite et l'illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs sur ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'de 3790 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, Helal ve Haram Tarayıcısı tarafından Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3790, menyebutkan apa yang diperbolehkan dan apa yang diharamkan. Hadits ini dikumpulkan oleh Halal and Haram Browser bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
