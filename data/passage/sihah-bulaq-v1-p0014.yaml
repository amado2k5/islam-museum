text: |-
  ٦٢٧
  أى وردت سدما ونسع لونه نصوعا اذا اشتد بياضه وخلص ونصع الامروضح وبان
  والنصع ضرب من الثباب بيض قال الشاءر
  يرعى انلخزامى بذى قارقد خضبت • منه الجافل والاطراف والزمعا
  مجناب نصع بمان فوق نقبته • وبالا كارع من ديباجه قطعا
  وحكى الفراء أنصعت الناقة للفهل أقرت له عند الضراب أبو عروأنصح الرجل أى أظهر
  ما فى تفه وقصد للقتال قال رؤية
  كربأحجى مانع أن يبمنعا • حق اقثهرجلده وأنصعا
  قال أبو يوسف تنال قيح اللّٰه أما نصعت به أى ولدنه منل مصعت به وقول الشاعز
  ولما أن دعوت بنى قعين • أتونى ناممين الى الصباح
  أى قاصدين
  ⁦( نطع)⁩ النطع فيه أربع لغات نطح ونطح ونطع ونطح وقال الراجز
  يضرين بالازقة الخسدودا • ضرب الرياح النطع الممدودا
  وابهع نطوع وأنطاع والنطع أيضاماظه ر من الغار الاعلى فيه آنار كالتحز ير يخفف ويثقل
  وتنطع فى الكلام أى تعمق فيه عع النعناع :قسلة معروفة وكذلك التعنع مقصور
  منه والنعنع بالضم الطويل والتنعنع التباعد ومنه قول ذى الرمة لطى المازح المتنعنع
  قال ابن السكيت النعاعة اللعاعة وهى :تلة تاعمة (نفع النفع ضد الضريقال نقعته
  بكذا فا نتفع به والاسم المنفعة تع لنقع الغبار والمع نقاع والنقع محبس الماءوكذلك
  ما اجتمع فى البتر منه وفى الحديت أنه نهى أن يمنع نقع البثر والنقع أيضا الارض الحرة الطين
  بستنقع فيما الماه والمع نقاع وأنقع منل بحر وبهار وأبحروفى المثل إنه لشراب بأنقع أى
  أنه معاودللا مور :أتبها حتى ييلغ الى أقصى هراده والانوعة وبسة الثريد والنقوع ما ينقع
  فى الماممن الليل لدواء أو نبيدوذلك الاناممنقع بالكسر ومنقع البرم بورصغير من حججارة
  والمنقعة برمة صغيرة يعارح فيها اللبن ويطعمه الصىّ والمنشع بالفتح الموضع يسة قع فيه الماء
  والجمع مماقع وأنقعت الدواء وغيره في الماء فهو منقع ونقع الماء ينقع ذوعا أى اجتمع
  فى المنقع ونقع الماء العطس نقعا ونقوعا أى سكنه وفى المشل الرشف أنقع أى أن الشراب
  الذى يترشف قليلا قل لا أقطع العطش وأنجع وان كان فيه بطه ويقسال سم نافع أى بالغ وقالا
  أبو نصر ثابت ودم ناقع أى طرى قال الشاعر قسام بن رواحة
  ومازالمن قت-لى رزاح بعالج • دم ناقع أوجاسد غير ماصح
  قال أبو معيدير يد بالناقع الطرى وبالجاس_دالقديم والنقيع البئرا الكثيرة الماء وهومذكر
  والجمع أنقعة والنقيع أيضا الماء الناقع والنقيع شراب يتخذ من زبيب ينقع فى الماء من غير
  طبخ والذمع الصراخ ونقع الصوت واستنقع أى ارتفع قال لبيد
  فتى ينقع صراخ صادق • جلبوه ذات جرص وزجل
  فال أبو يومف النقيع الحض من اللبن يبردوه والمنقع أيضا قال يصف فرسا
  فأنة فى الصف ظل بارد • ونصى ناعجة ومحض منقع
  فأنى، أى دام له والنقيعة طعام القادم من السفرقال مهاهل
  ونطاع ما ميسلادة م
