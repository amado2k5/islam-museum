label: { ar: "سنن أبي داود 386 — الأب والأبوة", en: "Sunan Abi Dawud 386 — the father and fatherhood", ur: "سنن ابی داؤد 386 — باپ اور والدیت", es: "Sunan Abi Dawud 386 — El padre y la paternidad" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ إِبْرَاهِيمَ، حَدَّثَنِي مُحَمَّدُ بْنُ كَثِيرٍ، - يَعْنِي الصَّنْعَانِيَّ - عَنِ الأَوْزَاعِيِّ، عَنِ ابْنِ عَجْلاَنَ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ بِمَعْنَاهُ قَالَ \" إِذَا وَطِئَ الأَذَى بِخُفَّيْهِ فَطَهُورُهُمَا التُّرَابُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 386، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 386 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 386، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 386 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
