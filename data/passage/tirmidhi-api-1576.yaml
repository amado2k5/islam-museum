label: { ar: "جامع الترمذي 1576 — الأب والأبوة", en: "Jami' al-Tirmidhi 1576 — the father and fatherhood", ur: "جامع ترمذی 1576 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1576 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1576 — le père et la paternité", tr: "Cami' el-Tirmizi 1576 — Baba ve Babalık", id: "Jami' al-Tirmidhi 1576 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا عَلِيُّ بْنُ سَعِيدٍ الْكِنْدِيُّ، حَدَّثَنَا عَبْدُ الرَّحِيمِ بْنُ سُلَيْمَانَ، عَنْ إِسْرَائِيلَ، عَنْ ثُوَيْرٍ، عَنْ أَبِيهِ، عَنْ عَلِيٍّ، عَنِ النَّبِيِّ أَنَّ كِسْرَى أَهْدَى إِلَيْهِ فَقَبِلَ مِنْهُ وَأَنَّ الْمُلُوكَ أَهْدَوْا إِلَيْهِ فَقَبِلَ مِنْهُمْ. قَالَ وَفِي الْبَابِ عَنْ جَابِرٍ. وَهَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. وَثُوَيْرٌ هُوَ ابْنُ أَبِي فَاخِتَةَ وَأَبُو فَاخِتَةَ اسْمُهُ سَعِيدُ بْنُ عِلاَقَةَ وَثُوَيْرٌ يُكْنَى أَبَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1576، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1576 (The Book on Military Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1576، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1576 (El Libro de las Expediciones Militares), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1576 (Livre des expéditions militaires), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 1576 numaralı hadisinde baba ve babalık kavramından bahsedilir. Araştırmacı, bu hadisi İslam'da babalık bölümünde, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1576, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits ini dalam bagian tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
