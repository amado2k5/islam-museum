label: { ar: "الموطأ 368 — حفصة تملي في مصحفها: والصلاة الوسطى وصلاة العصر", en: "Muwatta 368" }
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن عمرو بن رافع، في باب الصلاة الوسطى: كان يكتب مصحفاً لحفصة أم المؤمنين فأمرته أن يؤذنها إذا بلغ آية البقرة في المحافظة على الصلوات، فلما بلغها أملت عليه الآية بزيادة ذكر صلاة العصر بعد الصلاة الوسطى، كما في أثر عائشة قبله. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.201}"
