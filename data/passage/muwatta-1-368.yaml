label: { ar: "الموطأ 368 — حفصة تملي في مصحفها: والصلاة الوسطى وصلاة العصر", en: "Muwatta 368", es: "Muwatta 368", fr: "Muwatta 368", ur: "موطا 368", tr: "El-Muvatta 368 — Hafsa, Kur'an nüshasında şöyle dikte ediyor: “Ve öğle namazı ve ikindi namazı.”", id: "Al-Muwatta 368 — Hafsa mendiktekan dalam salinan Al-Qurannya: “Dan salat khazi dan salat asar.”" }
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن عمرو بن رافع، في باب الصلاة الوسطى: كان يكتب مصحفاً لحفصة أم المؤمنين فأمرته أن يؤذنها إذا بلغ آية البقرة في المحافظة على الصلوات، فلما بلغها أملت عليه الآية بزيادة ذكر صلاة العصر بعد الصلاة الوسطى، كما في أثر عائشة قبله. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.201}"
  tr: "Malik'in, Zeyd ibn Aslam'dan, o da Amr ibn Rafi'den rivayet ettiği, öğle namazı bölümündeki bir hadiste şöyle denmektedir: Hafsa (Müminlerin Annesi) için Kur'an yazıyordu ve Hafsa ona, Bakara Suresi'nde namazların kılınmasıyla ilgili ayete geldiğinde kendisine haber vermesini söyledi. Hafsa o ayete geldiğinde, ona ayeti dikte ettirdi ve daha önce Aişe'nin rivayetinde olduğu gibi, öğle namazından sonra ikindi namazını da ekledi. Araştırmacı, bu hadisin Ebu Musab tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.201}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Zayd ibn Aslam dari Amr ibn Rafi’, dalam surah tentang salat khadi: Beliau sedang menulis salinan Al-Quran untuk Hafsa, Ummul Mukminin, dan beliau memerintahkannya untuk memberitahunya ketika beliau sampai pada ayat dalam Surah Al-Baqarah tentang pelaksanaan salat. Ketika beliau sampai pada ayat tersebut, Hafsa mendiktekan ayat itu kepadanya, menambahkan penyebutan salat Ashar setelah salat khadi, sebagaimana dalam riwayat Aisyah sebelumnya. Peneliti menyebutkan bahwa Abu Mus’ab meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.201}"
