label: { ar: "موطأ مالك 1484 — الأب والأبوة", en: "Muwatta Malik 1484 — the father and fatherhood", ur: "موطأ مالک 1484 — باپ اور والدیت", es: "Muwatta Malik 1484 — el padre y la paternidad" }
text: "… أَنَّ سَعِيدَ بْنَ الْمُسَيَّبِ، سُئِلَ عَنْ عَبْدٍ لَهُ، وَلَدٌ مِنِ امْرَأَةٍ حُرَّةٍ لِمَنْ وَلاَؤُهُمْ فَقَالَ سَعِيدٌ إِنْ مَاتَ أَبُوهُمْ وَهُوَ عَبْدٌ لَمْ يُعْتَقْ فَوَلاَؤُهُمْ لِمَوَالِي أُمِّهِمْ. قَالَ مَالِكٌ وَمَثَلُ ذَلِكَ وَلَدُ الْمُلاَعَنَةِ مِنَ الْمَوَالِي يُنْسَبُ إِلَى مَوَالِي أُمِّهِ فَيَكُونُونَ هُمْ مَوَالِيَهُ إِنْ مَاتَ وَرِثُوهُ وَإِنْ جَرَّ جَرِيرَةً عَقَلُوا عَنْهُ فَإِنِ اعْتَرَفَ بِهِ أَبُوهُ أُلْحِقَ بِهِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1484، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1484 (Setting Free and Wala'), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1484، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1484 (Liberación y Wala'), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
