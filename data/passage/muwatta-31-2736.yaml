label: { ar: "الموطأ 2736 — مالك: لم يصبغ النبي وإلا لأرسلت عائشة بذلك إلى عبد الرحمن بن الأسود", en: "Muwatta 2736", es: "Muwatta 2736", fr: "Muwatta 2736", ur: "موطا 2736", tr: "El-Muvatta 2736 — Malik: Peygamber saçını boyamazdı, aksi takdirde Ayşe, Abdurrahman ibn el-Esved'e bu konuda haber gönderirdi.", id: "Al-Muwatta 2736 — Malik: Nabi tidak mewarnai rambutnya, jika tidak, Aisyah pasti sudah menyampaikan hal itu kepada Abdullah bin Aswad." }
summary:
  ar: "قال: وسمعت مالكا يقول: في هذا الحديث بيان أن رسول الله لم يصبغ، ولو صبغ رسول الله لأرسلت بذلك عائشة إلى عبد الرحمن بن الأسود. {cite:muwatta-maruf-1997 p.539}"
  tr: "O şöyle dedi: Malik'in şöyle dediğini duydum: Bu hadis, Allah'ın Resulü'nün saçını boyamadığını gösteriyor. Eğer Allah'ın Resulü saçını boyamış olsaydı, Ayşe bunu Abdurrahman ibn el-Esved'e bildirirdi. {cite:muwatta-maruf-1997 s.539}"
  id: "Dia berkata: Saya mendengar Malik berkata: Hadits ini menunjukkan bahwa Rasulullah tidak mewarnai rambutnya. Jika Rasulullah mewarnai rambutnya, Aisyah pasti akan menyampaikan hal ini kepada Abdullah bin Aswad. {cite:muwatta-maruf-1997 p.539}"
