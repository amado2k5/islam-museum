text: "… منكر مع مافيه من الوهم في ذكر رقية وروى ابن المبارك وابن وهب عن يونس بن يزيد عن ابن شهاب قال تخاف عثمان عن بدر على امر أنه رقية بنت رسول اللّٰه وكان قد اصابتها الحصبة فماتت وجاء زيد بن …"
