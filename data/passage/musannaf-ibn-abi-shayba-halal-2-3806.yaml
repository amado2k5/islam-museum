text: "… وَلِلِ؟ قال، فقال: إنه رُخص لنا في اللهو عند العُرس. - حدثنا شَبَابة عن شعبة عن أبي بَلْج عن محمد بن حاطب قال: قال رسول اللّٰه ولافي فَصْل ما بين الحلال والحرام الصوت. يعني: الضرب بالدُّف. - حدثنا غُنْدر عن …"
