text: "… امْرَأَتَهُ، فَكَانَتْ لَهُ شُبْهَةٌ فِي مَمْلُوكَتِهَا. وَعَنْ عُمَرَ وَعَلِيٌّ، وَعَطَاء، وَقَتَّادَةً، وَالشَّافِعِيّ، وَمَالِكِ، أَنّهُ كَوَطْءِ الأَجْنَبِيَّةِ، سَوَاء أَحَلَتْهَا لَهُ، أَوْ لَمْ تُحِلَّهَاء لأَنَّهُ لا سُبْهَةَ لَهُ فِيهَا، فَأَشْتَبهَ وَطْءَ جَاريَةٍ أُخْتِهِ، وَلأنَّهُ إِبَاحَةً لِرَدْء مُحَرَّمَةٍ عَلَيْهِ، فَلَمْ يَكُنْ شَبْهَةٌ، كَإِبَاحَةٍ …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 2198، يذكر ما أُحل، وما حُرّم، والشبهات، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 2198, that mentions what was made lawful, what was made unlawful, the doubtful matters, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
