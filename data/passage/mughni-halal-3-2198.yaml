text: "… امْرَأَتَهُ، فَكَانَتْ لَهُ شُبْهَةٌ فِي مَمْلُوكَتِهَا. وَعَنْ عُمَرَ وَعَلِيٌّ، وَعَطَاء، وَقَتَّادَةً، وَالشَّافِعِيّ، وَمَالِكِ، أَنّهُ كَوَطْءِ الأَجْنَبِيَّةِ، سَوَاء أَحَلَتْهَا لَهُ، أَوْ لَمْ تُحِلَّهَاء لأَنَّهُ لا سُبْهَةَ لَهُ فِيهَا، فَأَشْتَبهَ وَطْءَ جَاريَةٍ أُخْتِهِ، وَلأنَّهُ إِبَاحَةً لِرَدْء مُحَرَّمَةٍ عَلَيْهِ، فَلَمْ يَكُنْ شَبْهَةٌ، كَإِبَاحَةٍ …"
