text: "… مخاطبون بالمنهي دون المأمور واللّه أعلم. قال الشيخ أبو عمرو بن الصلاح: هذا الذي وقع في حديث معاذ من ذكر بعض دعائم الإسلام دون بعض هو من تقصير الراوي كما بيناه فيما سبق من - حدَّثَنَا ابْنُ أبِي عُمَرَ، حَدَّثَنَا …"
