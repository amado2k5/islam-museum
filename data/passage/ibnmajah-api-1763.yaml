label: { ar: "سنن ابن ماجه 1763 — الأب والأبوة", en: "Sunan Ibn Majah 1763 — the father and fatherhood", ur: "سنن ابن ماجہ 1763 — باپ اور والدیت", es: "Sunan Ibn Majah 1763 — El padre y la paternidad", fr: "Sunan Ibn Majah 1763 — le père et la paternité" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى الأَزْدِيُّ، حَدَّثَنَا مُوسَى بْنُ دَاوُدَ، وَخَالِدُ بْنُ أَبِي يَزِيدَ، قَالاَ حَدَّثَنَا أَبُو بَكْرٍ الْمَدَنِيُّ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ ـ قَالَ \" إِذَا نَزَلَ الرَّجُلُ بِقَوْمٍ فَلاَ يَصُومُ إِلاَّ بِإِذْنِهِمْ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1763، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1763 (Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1763، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1763 (El ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1763 (Le jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
