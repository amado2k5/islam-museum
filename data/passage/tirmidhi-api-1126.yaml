label: { ar: "جامع الترمذي 1126 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1126 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1126 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 1126 — lo que se ha hecho lícito; lo que no es lícito", fr: "Jami' al-Tirmidhi 1126 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Cami' el-Tirmizi 1126 — Neler caizdir, neler caiz değildir", id: "Jami' al-Tirmidhi 1126 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… عَبَّاسٍ وَأَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ عَامَّةِ أَهْلِ الْعِلْمِ لاَ نَعْلَمُ بَيْنَهُمُ اخْتِلاَفًا أَنَّهُ لاَ يَحِلُّ لِلرَّجُلِ أَنْ يَجْمَعَ بَيْنَ الْمَرْأَةِ وَعَمَّتِهَا أَوْ خَالَتِهَا فَإِنْ نَكَحَ امْرَأَةً عَلَى عَمَّتِهَا أَوْ خَالَتِهَا أَوِ الْعَمَّةَ عَلَى بِنْتِ أَخِيهَا فَنِكَاحُ الأُخْرَى مِنْهُمَا مَفْسُوخٌ. وَبِهِ يَقُولُ عَامَّةُ أَهْلِ الْعِلْمِ. قَالَ أَبُو عِيسَى أَدْرَكَ الشَّعْبِيُّ أَبَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1126، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1126 (The Book on Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1126، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Jami' al-Tirmidhi, n.º 1126 (El Libro del Matrimonio), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1126 (Le Livre du Mariage), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Cami' el-Tirmizi'nin 1126 numaralı hadisinde helal ve haram olan şeyler belirtilmiştir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1126, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
