label: { ar: "الموطأ 2099 — مالك: فيمن اشترى أرضا فمكثت في يديه حينا، ثم جاء رجل فأدرك فيها حقا بميراث: إن له الشفعة إن ثبت حقه، وما أغلت الأرض فهو للمشتري الأول إلى يوم يثبت حق الآخر، فإن طال الزمان أو هلك الشهود انقطعت الشفعة", en: "Muwatta 2099" }
summary:
  ar: "قال مالك وقال في الرجل يشتري أرضا فتمكث في يديه حينا، ثم يأتي رجل فيدرك فيها حقا بميراث: إن له الشفعة إن ثبت حقه. وإن ما أغلت الأرض من غلة فهي للمشتري الأول إلى يوم يثبت حق الآخر، لأنه قد كان ضمنها لو هلك ما كان فيها من غراس، أو ذهب به سيل. قال: فإن طال الزمان، أو هلك الشهود، أو مات البائع أو المشتري، فنسي أصل البيع والاشتراء لطول الزمان، فإن الشفعة تنقطع. {cite:muwatta-maruf-1997 p.257} {cite:muwatta-maruf-1997 p.258}"
