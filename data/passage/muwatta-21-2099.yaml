label: { ar: "الموطأ 2099 — مالك: فيمن اشترى أرضا فمكثت في يديه حينا، ثم جاء رجل فأدرك فيها حقا بميراث: إن له الشفعة إن ثبت حقه، وما أغلت الأرض فهو للمشتري الأول إلى يوم يثبت حق الآخر، فإن طال الزمان أو هلك الشهود انقطعت الشفعة", en: "Muwatta 2099", es: "Muwatta 2099", fr: "Muwatta 2099", ur: "موطا 2099", tr: "El-Muvatta 2099 — Malik: Bir kimse bir arazi satın alıp bir süre elinde bulundurduktan sonra, başka bir adam gelip miras yoluyla hak iddia ederse: Eğer hakkı ispatlanırsa, ön alım hakkına sahiptir ve arazinin verimi, diğerinin hakkı ispatlanana kadar ilk alıcıya aittir. Eğer zaman geçerse veya şahitler ölürse, ön alım hakkı ortadan kalkar.", id: "Al-Muwatta 2099 — Malik: Mengenai seseorang yang membeli tanah dan tanah itu tetap berada dalam kepemilikannya untuk beberapa waktu, kemudian orang lain datang dan mengklaim hak atas tanah itu melalui warisan: dia memiliki hak prioritas jika haknya terbukti, dan apa pun hasil tanah itu menjadi milik pembeli pertama sampai hak orang lain terbukti. Jika waktu berlalu atau saksi meninggal, hak prioritas tersebut hilang." }
summary:
  ar: "قال مالك وقال في الرجل يشتري أرضا فتمكث في يديه حينا، ثم يأتي رجل فيدرك فيها حقا بميراث: إن له الشفعة إن ثبت حقه. وإن ما أغلت الأرض من غلة فهي للمشتري الأول إلى يوم يثبت حق الآخر، لأنه قد كان ضمنها لو هلك ما كان فيها من غراس، أو ذهب به سيل. قال: فإن طال الزمان، أو هلك الشهود، أو مات البائع أو المشتري، فنسي أصل البيع والاشتراء لطول الزمان، فإن الشفعة تنقطع. {cite:muwatta-maruf-1997 p.257} {cite:muwatta-maruf-1997 p.258}"
  tr: "Malik, bir adamın arazi satın alıp bir süre elinde tutması, daha sonra başka bir adamın gelip miras yoluyla hak iddia etmesi durumunda, hakkı ispatlanırsa ön alım hakkına sahip olduğunu söylemiştir. Arazinin verdiği tüm ürünler, diğerinin hakkı ispatlanana kadar ilk alıcıya aittir, çünkü ürünlerin herhangi birinin yok olması veya selde sürüklenmesi durumunda sorumluluk ona aittir. Ayrıca, uzun bir süre geçerse, şahitler ölürse veya satıcı ya da alıcı ölürse ve zaman geçmesi nedeniyle asıl satış ve satın alma işlemi unutulursa, ön alım hakkının ortadan kalktığını belirtmiştir. {cite:muwatta-maruf-1997 s.257} {cite:muwatta-maruf-1997 s.258}"
  id: "Malik berkata, mengenai seorang pria yang membeli tanah dan tanah itu tetap berada dalam kepemilikannya untuk sementara waktu, kemudian pria lain datang dan mengklaim hak atas tanah itu melalui warisan: ia memiliki hak prioritas jika haknya terbukti. Dan apa pun hasil yang dihasilkan tanah itu menjadi milik pembeli pertama sampai hak orang lain terbukti, karena ia bertanggung jawab atas hal itu jika ada tanaman yang hancur atau hanyut oleh banjir. Ia berkata: Jika waktu berlalu lama, atau saksi meninggal, atau penjual atau pembeli meninggal, dan jual beli asli dilupakan karena berlalunya waktu, maka hak prioritas tersebut hilang. {cite:muwatta-maruf-1997 p.257} {cite:muwatta-maruf-1997 p.258}"
