text: "… أَثْمَرَ وَاتُوا حَقّهُ الأنعام:، فإن الإيناء واجب، والأكل مباح، والختان واجب عند الشافعي وكثير من العلماء ير على الرجال والنساء، وسنة عند مالك وأكثر العلماء، والتقليم سنة، ويستحب أن يبدأ بمسبحة يده اليمن، ثم الوسطى، ثم البنصر، ثم الإبهام، ثم …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 303، يرد فيه ذكر الواجب، والمستحب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 303, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 303 کا اقتباس جس میں واجب، مستحب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 1, p. 303, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Mishkat al-Masabih, volumen digitalizado 1, p. 303, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 303'ten, farz, tavsiye edilen ve caiz olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 303, yang menyebutkan amalan wajib, anjuran, dan yang diperbolehkan; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
