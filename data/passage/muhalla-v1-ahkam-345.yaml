text: "… فَضلٌ عَظيمٌ. والقَطْعُ فِي المَدحِ مَكروهٌ، لكن تَقولُ: فيما أعْلَمُ، ويُكرَهُ المَدحُ فِي الوجوهِ. وكانَ كِتَابُ الحَديثِ مُدّةَ نُزولِ القُرآنِ مَكروها ؛ فَإذا أُمِنَ اخْتلاطُها فالكتابُ واحِبٌ وهُوَ مِنَ التَّفَقُّهِ، وقَدْ أمَرَ النَّبِيَّ لِلفه باكتابِ كَلامِهِ لأبِي شَاه. ويُستَحَبُّ تَطييبُ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 345، يرد فيه ذكر المستحب، والمكروه، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 345, whose wording mentions the recommended (mustahabb), the disliked (makruh), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 345 کا اقتباس جس میں مستحب، مکروہ، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 345, dont le texte mentionne le recommandé (mustahabb), le réprouvé (makruh), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 345, cuyo texto menciona lo recomendado (mustahabb), lo reprobado (makruh), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
