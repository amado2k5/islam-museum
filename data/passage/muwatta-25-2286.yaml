label: { ar: "الموطأ 2286 — مالك: ميراث المكاتب إذا ترك مالا يفي بالكتابة", en: "Muwatta 2286", es: "Muwatta 2286", fr: "Muwatta 2286", ur: "موطا 2286" }
summary:
  ar: "قال مالك: إذا هلك المكاتب وترك مالا أكثر مما بقي عليه من الكتابة، وله ولد ولدوا في كتابته أو كوتبوا معه، ورثوا ما بقي من المال بعد قضاء الكتابة. {cite:muwatta-maruf-1997 p.343} {cite:muwatta-maruf-1997 p.344}"
  tr: "Malik şöyle demiştir: Eğer bir köle azat sözleşmesi altında ölür ve geride sözleşmeden kalan miktardan daha fazla mal bırakırsa ve azat edildiği sırada doğmuş veya onunla sözleşme yapmış çocukları varsa, sözleşme yerine getirildikten sonra kalan mal varlığı onlara miras kalır. {cite:muwatta-maruf-1997 s.343} {cite:muwatta-maruf-1997 s.344}"
  id: "Malik berkata: Jika seorang budak yang terikat perjanjian pembebasan meninggal dunia dan meninggalkan harta lebih banyak daripada sisa harta yang ada dalam perjanjian tersebut, dan ia mempunyai anak-anak yang lahir selama masa pembebasannya atau yang terikat perjanjian dengannya, maka mereka mewarisi sisa harta tersebut setelah perjanjian itu terpenuhi. {cite:muwatta-maruf-1997 p.343} {cite:muwatta-maruf-1997 p.344}"
