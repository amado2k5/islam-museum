  ar: "صحيح مسلم، كتاب الجنائز"
  en: "Sahih Muslim, Book 11: The Book of Prayer - Funerals"
  ur: "صحیح مسلم، کتاب الجنائز"
  es: "Sahih Muslim, Libro 11: El Libro de la Oración - Funerales"
  fr: "Sahih Muslim, Livre 11: Le Livre de la prière - Les funérailles"
summary:
  ar: "القسم 11 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجنائز»، ويضم فيها النصوص من 2123 إلى 2262 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 11 of Sahih Muslim (The Book of Prayer - Funerals) in the division of the open hadith dataset the museum took its reports from: reports 2123 to 2262 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 11، عنوان «کتاب الجنائز»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2123 تا 2262۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 11 de Sahih Muslim (El Libro de la Oración - Funerales) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2123 al 2262 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses données du Sahih Muslim (Livre de la prière – Funérailles), dans la partie ouverte du recueil de hadiths d'où proviennent les rapports 2123 à 2262. Le musée classe ses archives relatives à ces rapports sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
