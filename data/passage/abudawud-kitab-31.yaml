label:
  ar: "سنن أبي داود، كتاب العتق"
  en: "Sunan Abi Dawud, Book 31: The Book of Manumission of Slaves"
  ur: "سنن ابی داؤد، کتاب العتق"
  es: "Sunan Abi Dawud, Libro 31: El Libro de la Manumisión de los Esclavos"
  fr: "Sunan Abi Dawud, Livre 31: Le Livre de l'affranchissement des esclaves"
summary:
  ar: "القسم 31 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العتق»، ويضم فيها النصوص من 3926 إلى 3968 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 31 of Sunan Abi Dawud (The Book of Manumission of Slaves) in the division of the open hadith dataset the museum took its reports from: reports 3926 to 3968 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 31، عنوان «کتاب العتق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3926 تا 3968۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 31 de Sunan Abi Dawud (El Libro de la Manumisión de Esclavos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3926 al 3968, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses données du Sunan Abi Dawud (Livre de l'affranchissement des esclaves), dans la partie du recueil de hadiths ouvert dont il a extrait les récits: les hadiths 3926 à 3968 de cette base de données. Le musée classe ses archives relatives à ces récits sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
