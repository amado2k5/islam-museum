text: "… يقال: إنه ممتنع للمفسدة أو مناقضة الحكمة، فإن بناء الأمور على ذلك في حق الله - تعالى - محال، إذ لا يقبح منه شيء، ولا يجب عليه الأصلح. ثم الخلاف فيه وفي العباد واحد، والفساد والسفه من المخلوق ممكن، فلم …"
