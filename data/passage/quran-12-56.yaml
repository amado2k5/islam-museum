text: "وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِى ٱلْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَآءُ ۚ نُصِيبُ بِرَحْمَتِنَا مَن نَّشَآءُ ۖ وَلَا نُضِيعُ أَجْرَ ٱلْمُحْسِنِينَ"
text_search: "وكذلك مكنا ليوسف في الأرض يتبوأ منها حيث يشاء ۚ نصيب برحمتنا من نشاء ۖ ولا نضيع أجر المحسنين"
translations:
  en: { text: "Thus gave We power to Joseph in the land. He was the owner of it where he pleased. We reach with Our mercy whom We will. We lose not the reward of the good.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اس طرح ہم نے یوسف کو ملک (مصر) میں جگہ دی اور وہ اس ملک میں جہاں چاہتے تھے رہتے تھے۔ ہم اپنی رحمت جس پر چاہتے ہیں کرتے ہیں اور نیکوکاروں کے اجر کو ضائع نہیں کرتے", translator: "Fateh Muhammad Jalandhari", license: PD }
