summary:
  ar: "القسم 26 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النذر»، ويضم فيها النصوص من 4235 إلى 4253 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 26 of Sahih Muslim (The Book of Vows) in the division of the open hadith dataset the museum took its reports from: reports 4235 to 4253 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 26، عنوان «کتاب النذر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4235 تا 4253۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 26 de Sahih Muslim (El Libro de los Votos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4235 al 4253, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des vœux), dans le recueil ouvert Sahih Muslim: les hadiths 4235 à 4253 de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 26. bölümü \"Yeminler Kitabı\" başlığını taşımakta olup, 4235'ten 4253'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 26 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sumpah\" dan berisi teks 4235 hingga 4253, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
