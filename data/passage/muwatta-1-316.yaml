label: { ar: "الموطأ 316 — عائشة: كان يصلي بالليل ثلاث عشرة ركعة ثم ركعتين خفيفتين", en: "Muwatta 316" }
text: "كان رسول الله يصلي بالليل ثلاث عشرة ركعة، ثم يصلي إذا سمع النداء بالصبح ركعتين خفيفتين"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين، في باب صلاة النبي في الوتر: كان النبي يصلي بالليل ثلاث عشرة ركعة، ثم يصلي إذا سمع النداء بالصبح ركعتين خفيفتين. ويخرّجه المحقق عند البخاري (1170) وأبي داود (1339) والنسائي في الكبرى وأحمد والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد (22/119). {cite:muwatta-maruf-1997 p.178}"
