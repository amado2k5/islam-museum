label: { ar: "الموطأ 316 — عائشة: كان يصلي بالليل ثلاث عشرة ركعة ثم ركعتين خفيفتين", en: "Muwatta 316", es: "Muwatta 316", fr: "Muwatta 316", ur: "موطا 316", tr: "Al-Muwatta 316 — Aişe: Geceleyin on üç rekat namaz kılardı, sonra iki hafif rekat namaz kılardı.", id: "Al-Muwatta 316 — Aisyah: Beliau biasa shalat tiga belas rakaat di malam hari, kemudian dua rakaat sunnah." }
text: "كان رسول الله يصلي بالليل ثلاث عشرة ركعة، ثم يصلي إذا سمع النداء بالصبح ركعتين خفيفتين"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين، في باب صلاة النبي في الوتر: كان النبي يصلي بالليل ثلاث عشرة ركعة، ثم يصلي إذا سمع النداء بالصبح ركعتين خفيفتين. ويخرّجه المحقق عند البخاري (1170) وأبي داود (1339) والنسائي في الكبرى وأحمد والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد (22/119). {cite:muwatta-maruf-1997 p.178}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Müminlerin Annesi Ayşe'den rivayet ederek, Vitr namazı bölümünde Peygamberimizin gece namazını şöyle nakletmiştir: Peygamberimiz geceleyin on üç rekat namaz kılardı, sonra ezan okunduğunda iki hafif rekat namaz kılardı. Editör, bunu Sahih el-Buhari (1170), Sahih Ebu Davud (1339), Sahih el-Nesai (el-Kübra), Sahih Ahmed ve Sahih el-Tahavi'de Malik'in sahabelerinin rivayet zincirleriyle aktarmış ve el-Temhid'e (22/119) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.178}"
  id: "Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, Ibu Kaum Mukmin, dalam surah tentang shalat Nabi dalam Witir: Nabi biasa shalat tiga belas rakaat di malam hari, kemudian ketika mendengar seruan shalat Subuh, beliau shalat dua rakaat ringan. Editor memasukkannya dalam Sahih al-Bukhari (1170), Sahih Abu Dawud (1339), Sahih al-Nasa'i dalam al-Kubra, Sahih Ahmad, dan Sahih al-Tahawi melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (22/119). {cite:muwatta-maruf-1997 p.178}"
