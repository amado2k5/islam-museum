text: "… على وجوب صيام رمضان. وأنه أحد أركان الإسلام، التي عُلِمَت من الدين بالضرورة، وأن مُنْكِره كافرً مُرْتد عن الإسلام. وكانت فَرْضيتُه يوم الاثنين، لليلتين خلتا من شعبان، من السنة الثانية من الهجرة. فضل شهر رمضان، وفضل العمل فيه : - …"
