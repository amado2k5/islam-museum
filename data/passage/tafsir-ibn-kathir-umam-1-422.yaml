text: "… مصر، كافرًا مِن العماليق وغيرهم، كما أنَّ قيصر عَلَمٌ علىٰ كلِّ مَن ملك الرُّوم مع الشَّام كافرًا، وكِسْرىٰ لكلِّ مَن ملكَ الفُرْس، وتُبّع لمن ملك اليمَن كافرًا والنجاشي لمن ملك الحبشة، وبَطْلَيْمُوسَ لمن ملكَ الهندَ ويقال: كان اسمُ فرعون الذي …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 422، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 422, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 422 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
