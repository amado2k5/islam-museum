text: "ج - ° المنتظم كراسى من ذهب ومائتي طوق من ذهب وآنية كثيرة نحوا من عشرة آلاف علم وكان النفير الى اندر ياس يوم الثلا ثاء لسبع خلون من ربيع الاول. وفى هذه السنة قتل ملك الروم الصقابى وفيها بنى …"
summary:
