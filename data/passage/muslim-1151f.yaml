label:
  ar: "مسلم 1151f — الصوم لي وأنا أجزي به"
  en: "Muslim 1151f — Fasting is Mine, and I reward it"
  ur: "مسلم 1151f — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
  es: "Musulmán 1151f — El ayuno es mío, y yo lo recompenso."
  fr: "Muslim 1151f — Le jeûne m'appartient et je le récompense."
  tr: "Müslim 1151f — Oruç Benim içindir ve Ben onun karşılığını vereceğim."
  id: "Muslim 1151f — Puasa adalah untuk-Ku dan Aku akan memberi pahala kepadanya"
text: "إن الله عز وجل يقول إن الصوم لي وأنا أجزي به إن للصائم فرحتين إذا أفطر فرح وإذا لقي الله فرح . والذي نفس محمد بيده لخلوف فم الصائم أطيب عند الله من ريح المسك ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1151f: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1151f: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1151f: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 1151f: El ayuno es mío, y yo lo recompenso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 1151 et suivants: « Le jeûne M’appartient et Je le récompense. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 1151f: “Puasa itu untuk-Ku, dan Aku akan memberi pahala kepadanya.” Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
