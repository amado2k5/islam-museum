label: { ar: "صحيح البخاري 4815 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4815 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4815 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4815 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، حَدَّثَنَا الأَوْزَاعِيُّ، قَالَ حَدَّثَنِي يَحْيَى بْنُ أَبِي كَثِيرٍ، قَالَ حَدَّثَنِي مُحَمَّدُ بْنُ إِبْرَاهِيمَ التَّيْمِيُّ، قَالَ حَدَّثَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، قَالَ قُلْتُ لِعَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ أَخْبِرْنِي بِأَشَدِّ، مَا صَنَعَ الْمُشْرِكُونَ بِرَسُولِ اللَّهِ قَالَ بَيْنَا رَسُولُ اللَّهِ يُصَلِّي بِفِنَاءِ الْكَعْبَةِ، إِذْ أَقْبَلَ عُقْبَةُ بْنُ أَبِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4815، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4815 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4815، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4815 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
