text: "… وابن ابى حاتم وابن مردويه والبيهق عن ابن عباسما قال : قدم عيينة بن حصن بن بدر فنزل على ابن أخر الحر بن قيس وكان من النفر الذين يدتيهم عمر وكان القراء أهاب مجلس عمر ومشورته كهولا كانوا أو شبانا …"
