text: "… أو على حال العذر. وكان عيسى بن أبان يقول: الأولى تعجيلها للآثار، ولكن لا يكره التأخير مطلقاً. ألا ترى أن العذر لمرض ولسفر يؤخر المغرب للجمع بينها وبين العشاء فعلاً، ولو كان المذهب كراهة التأخير مطلقاً لما أبيح ذلك بعذر …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 579، يرد فيه ذكر المباح، والكراهة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 579, whose wording mentions the permitted (mubah), dislike (karaha), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 579 کا اقتباس جس میں مباح، کراہت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 579, dont le texte mentionne le permis (mubah), la réprobation (karaha), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 579, cuyo texto menciona lo permitido (mubah), la reprobación (karaha), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 579. sayfasından, izin verilen, mekruh edilen ve kınanması gereken fiillerden bahseden bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, kınanması gereken fiiller, haram fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 579, yang menyebutkan apa yang diperbolehkan, tidak disukai, dan tercela; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tercela, amalan yang dilarang, dan dosa-dosa kecil."
