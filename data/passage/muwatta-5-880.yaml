label: { ar: "الموطأ 880 — عمرة عن رسول الله: أراد أن يعتكف، فلما انصرف إلى المكان وجد أخبية: خباء عائشة وحفصة وزينب، فقال: البر تقولون بهن؟ فانصرف فلم يعتكف حتى اعتكف عشراً من شوال", en: "Muwatta 880", es: "Muwatta 880", fr: "Muwatta 880", ur: "موطا 880", tr: "El-Muvatta 880 — Allah Resulü'nün rivayetine göre: İtikaf yapmak istedi ve o yere döndüğünde, Ayşe, Hafsa ve Zeyneb'in çadırlarını buldu. \"Onlarda salihlik mi var diyorsunuz?\" dedi. Bunun üzerine oradan ayrıldı ve Şevval ayının on gününe kadar itikaf yapmadı.", id: "Al-Muwatta 880 — Dari Rasulullah SAW: Beliau hendak melaksanakan i'tikaf, dan ketika kembali ke tempat itu, beliau menemukan tenda-tenda: tenda Aisyah, Hafsa, dan Zainab. Beliau bertanya: Apakah kalian mengatakan bahwa kebaikan ada di dalam mereka? Maka beliau pergi dan tidak melaksanakan i'tikaf hingga beliau melaksanakannya selama sepuluh hari di bulan Syawal." }
text: "البر تقولون بهن؟ فانصرف فلم يعتكف حتى اعتكف عشراً من شوال"
summary:
  ar: "أول حديث في باب قضاء الاعتكاف. يرويه زياد عن مالك عن ابن شهاب عن عمرة بنت عبد الرحمن، أن رسول الله أراد أن يعتكف، فلما انصرف إلى المكان الذي أراد أن يعتكف فيه وجد أخبية: خباء عائشة وخباء حفصة وخباء زينب، فلما رآها سأل عنها فقيل له: هذا خباء عائشة وحفصة وزينب، فقال: البر تقولون بهن؟ ثم انصرف فلم يعتكف، حتى اعتكف عشراً من شوال. ويذكر المحقق أن هذا غلط من يحيى أو شبطون، فذكر الزهري غير محفوظ، وأن الحديث لمالك عن يحيى بن سعيد عن عمرة عن عائشة، وأن زيادة «عن عائشة» سقطت من رواية الموطآت كلها، وأن البخاري رواه عن عبد الله بن يوسف عن مالك عن يحيى بن سعيد عن عمرة عن عائشة. {cite:muwatta-maruf-1997 p.424} {cite:muwatta-maruf-1997 p.425}"
  id: "Hadits pertama dalam surah tentang mengganti i'tikaf yang terlewat. Diriwayatkan oleh Ziyad dari Malik, dari Ibnu Shihab, dari Amrah binti Abdullah al-Rahman, bahwa Rasulullah shalla Allahu alaihi wa sallam bermaksud untuk melakukan i'tikaf. Ketika beliau kembali ke tempat yang beliau maksudkan untuk melakukannya, beliau menemukan tenda-tenda: tenda Aisyah, tenda Hafsah, dan tenda Zaynab. Ketika beliau melihatnya, beliau bertanya tentang tenda-tenda tersebut, dan beliau diberitahu: \"Ini adalah tenda Aisyah, Hafsah, dan Zaynab.\" Beliau bertanya: \"Apakah kalian menganggap melakukan i'tikaf dengan mereka sebagai perbuatan baik?\" Kemudian beliau pergi dan tidak melakukan i'tikaf lagi sampai beliau melakukannya selama sepuluh hari di bulan Syawal. Peneliti menyebutkan bahwa ini adalah kesalahan dari Yahya atau Shabtun, karena penyebutan al-Zuhri tidak otentik, dan bahwa hadits tersebut berasal dari Malik, dari Yahya ibn Sa'id, dari 'Amrah, dari 'Aisyah, dan bahwa tambahan \"dari 'Aisyah\" hilang dari semua riwayat dalam Muwatta', dan bahwa al-Bukhari meriwayatkannya dari Abdullah ibn Yusuf, dari Malik, dari Yahya ibn Sa'id, dari 'Amrah, dari 'Aisyah. {cite:muwatta-maruf-1997 p.424} {cite:muwatta-maruf-1997 p.425}"
