label: { ar: "الموطأ 880 — عمرة عن رسول الله: أراد أن يعتكف، فلما انصرف إلى المكان وجد أخبية: خباء عائشة وحفصة وزينب، فقال: البر تقولون بهن؟ فانصرف فلم يعتكف حتى اعتكف عشراً من شوال", en: "Muwatta 880" }
text: "البر تقولون بهن؟ فانصرف فلم يعتكف حتى اعتكف عشراً من شوال"
summary:
  ar: "أول حديث في باب قضاء الاعتكاف. يرويه زياد عن مالك عن ابن شهاب عن عمرة بنت عبد الرحمن، أن رسول الله أراد أن يعتكف، فلما انصرف إلى المكان الذي أراد أن يعتكف فيه وجد أخبية: خباء عائشة وخباء حفصة وخباء زينب، فلما رآها سأل عنها فقيل له: هذا خباء عائشة وحفصة وزينب، فقال: البر تقولون بهن؟ ثم انصرف فلم يعتكف، حتى اعتكف عشراً من شوال. ويذكر المحقق أن هذا غلط من يحيى أو شبطون، فذكر الزهري غير محفوظ، وأن الحديث لمالك عن يحيى بن سعيد عن عمرة عن عائشة، وأن زيادة «عن عائشة» سقطت من رواية الموطآت كلها، وأن البخاري رواه عن عبد الله بن يوسف عن مالك عن يحيى بن سعيد عن عمرة عن عائشة. {cite:muwatta-maruf-1997 p.424} {cite:muwatta-maruf-1997 p.425}"
