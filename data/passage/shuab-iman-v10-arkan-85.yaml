text: "… أخبرني أبو منصور محمد بن القاسم العتكي، حدثنا أحمد ابن نصر، حدثنا أبو نعيم، حدثنا زكريا، قال: سمعتُ عامرًا، يقول: سمعتُ النعمان بن بشير يقول: قال رسول اللّٰه وَل فيخي مثل المؤمنين في تراحمهم وتوادهم وتواصلهم كمثل الجسد، إذا اشتكى …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 85، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 85, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 85 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Shu'ab al-Iman de al-Bayhaqi, vol. 10, pág. 85, que menciona la semejanza del creyente; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 10, page 85, évoquant la ressemblance du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 85. sayfasından, mümin kıssasını anlatan bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, iman dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 85, yang menyebutkan perumpamaan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
