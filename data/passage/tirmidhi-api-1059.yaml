label: { ar: "جامع الترمذي 1059 — رثاء وثناء على ميت", en: "Jami' al-Tirmidhi 1059 — an elegy or praise of the dead", ur: "جامع الترمذی۔ 1059 — مرثیہ یا میت کی تعریف", fr: "Jami' al-Tirmidhi 1059 — une élégie ou un éloge du défunt", es: "Jami' al-Tirmidhi 1059 — una elegía o elogio del difunto" }
text: "حَدَّثَنَا يَحْيَى بْنُ مُوسَى، وَهَارُونُ بْنُ عَبْدِ اللَّهِ الْبَزَّازُ، قَالاَ حَدَّثَنَا أَبُو دَاوُدَ الطَّيَالِسِيُّ، حَدَّثَنَا دَاوُدُ بْنُ أَبِي الْفُرَاتِ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِي الأَسْوَدِ الدِّيلِيِّ، قَالَ قَدِمْتُ الْمَدِينَةَ فَجَلَسْتُ إِلَى عُمَرَ بْنِ الْخَطَّابِ فَمَرُّوا بِجَنَازَةٍ فَأَثْنَوْا عَلَيْهَا خَيْرًا فَقَالَ عُمَرُ وَجَبَتْ. فَقُلْتُ لِعُمَرَ وَمَا وَجَبَتْ قَالَ أَقُولُ كَمَا قَالَ رَسُولُ اللَّهِ قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1059، فيه رثاء وثناء على ميت. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1059 (The Book on Jana''iz (Funerals)), that carries an elegy or praise of the dead. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "جامع الترمذی۔ کی حدیث نمبر 1059، جس میں مرثیہ یا میت کی تعریف ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Jami' al-Tirmidhi, n° 1059, qui contient une élégie ou un éloge du défunt. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Jami' al-Tirmidhi, n.º 1059, que contiene una elegía o elogio del difunto. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
