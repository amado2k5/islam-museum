text: "… النبي لا مرفوعاً وموقوفاً على عمر: إِمْضَاءُ الصُّلْحِ جَائِزٌ بَيْنَ المُسْلِمِينَ إِلَّا صُلْحَا أَحَلَّ حَرَامًا أَوْ حَرَّمَ حَلَالًا واتفق المسلمون على جوازه على الإقرار، واختلفوا في جوازه على الإنكار، فقال مالك وأبو حنيفة: يجوز على الإنكار، وقال الشافعي: لا يجوز …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 821، يذكر الحلال، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
