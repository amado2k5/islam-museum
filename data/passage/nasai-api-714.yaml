label: { ar: "سنن النسائي 714 — الأب والأبوة", en: "Sunan al-Nasa'i 714 — the father and fatherhood", ur: "سنن نسائی 714 — باپ اور والدیت" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَخْبَرَنِي يَحْيَى بْنُ سَعِيدٍ، عَنِ ابْنِ عَجْلاَنَ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ نَهَى عَنِ التَّحَلُّقِ يَوْمَ الْجُمُعَةِ قَبْلَ الصَّلاَةِ وَعَنِ الشِّرَاءِ وَالْبَيْعِ فِي الْمَسْجِدِ."
summary:
  ar: "حديث في سنن النسائي، رقم 714، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 714 (The Book of the Masjids), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 714، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
