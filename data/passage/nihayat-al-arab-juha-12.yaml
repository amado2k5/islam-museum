text: "في المدح والهجو والمجون والفُكاهات والمُلَح والخمر والمُعاقرة والنّدمان والقِيان... الخ لها وقدّمْ شاهِدَيْها قال لِلْجِلْوازِ قَرُبْ فقضى جَوْرًا على الخَضْ مِ ولم يقضٍ عليه قال الشعبيُّ: فدخلت على عبد الملكِ بن مروان؛ فلما نظر إليّ تبسّم، وقال : فُتِّن …"
