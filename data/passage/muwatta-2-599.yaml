label: { ar: "الموطأ 599 — عبد الله بن عمرو: الميت يقمص ويؤزر ويلف بالثوب الثالث", en: "Muwatta 599", es: "Muwatta 599", fr: "Muwatta 599", ur: "موطا 599", tr: "El-Muvatta 599 — Abdullah bin Amr: Merhum giyiniktir, peştamalla sarılmıştır ve üçüncü bir giysiyle de örtülmüştür.", id: "Al-Muwatta 599 — Abdullah bin Amr: Orang yang meninggal dipakaikan pakaian, dibungkus dengan kain penutup aurat, dan dibungkus dengan pakaian ketiga." }
text: "الميت يقمص، ويؤزر، ويلف بالثوب الثالث. فإن لم يكن إلا ثوب واحد، كفن فيه"
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف عن عبد الله بن عمرو بن العاص، أنه قال: الميت يُلبس القميص والإزار ويُلف بالثوب الثالث، فإن لم يكن إلا ثوب واحد كُفن فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق (6188) ومحمد بن الحسن (305) ويحيى بن بكير عند البيهقي (3/402). {cite:muwatta-maruf-1997 p.308}"
  tr: "Malik, İbn Şihab'dan, o da Humaid ibn Abd al-Rahman ibn Awf'tan, o da Abdullah ibn Amr ibn al-As'tan rivayet ederek şöyle buyurmuştur: \"Ölen kişi bir gömlek ve bir peştamal giyer ve üçüncü bir giysiye sarılır. Eğer sadece bir giysi varsa, onunla kefenlenir.\" Araştırmacı, bunun Malik'ten Ebu Musab, Suwaid, Abd al-Razzaq (6188), Muhammed ibn al-Hasan (305) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Bayhaqi (3/402) tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.308}"
  id: "Malik meriwayatkan hadits ini dari Ibn Shihab, dari Humaid ibn Abd al-Rahman ibn Awf, dari Abdullah ibn Amr ibn al-As, yang berkata: Orang yang meninggal dipakaikan baju dan kain penutup aurat, lalu dibungkus dengan kain ketiga. Jika hanya ada satu kain, maka ia dikafani dengan kain tersebut. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, Abd al-Razzaq (6188), Muhammad ibn al-Hasan (305), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (3/402). {cite:muwatta-maruf-1997 p.308}"
