label: { ar: "الموطأ 599 — عبد الله بن عمرو: الميت يقمص ويؤزر ويلف بالثوب الثالث", en: "Muwatta 599" }
text: "الميت يقمص، ويؤزر، ويلف بالثوب الثالث. فإن لم يكن إلا ثوب واحد، كفن فيه"
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف عن عبد الله بن عمرو بن العاص، أنه قال: الميت يُلبس القميص والإزار ويُلف بالثوب الثالث، فإن لم يكن إلا ثوب واحد كُفن فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق (6188) ومحمد بن الحسن (305) ويحيى بن بكير عند البيهقي (3/402). {cite:muwatta-maruf-1997 p.308}"
