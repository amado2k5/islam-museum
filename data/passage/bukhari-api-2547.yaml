label: { ar: "صحيح البخاري 2547 — الأجران", en: "Sahih al-Bukhari 2547 — the double reward", ur: "صحیح بخاری 2547 — دوہرا اجر", es: "Sahih al-Bukhari 2547 — la doble recompensa", fr: "Sahih al-Bukhari 2547 — la double récompense", tr: "Sahih el-Buhari 2547 — İki Ödül", id: "Sahih al-Bukhari 2547 — Dua Pahala" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ صَالِحٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ ـ قَالَ النَّبِيُّ \" أَيُّمَا رَجُلٍ كَانَتْ لَهُ جَارِيَةٌ فَأَدَّبَهَا فَأَحْسَنَ تَأْدِيبَهَا، وَأَعْتَقَهَا وَتَزَوَّجَهَا، فَلَهُ أَجْرَانِ، وَأَيُّمَا عَبْدٍ أَدَّى حَقَّ اللَّهِ وَحَقَّ مَوَالِيهِ، فَلَهُ أَجْرَانِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2547، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 2547 (Manumission of Slaves), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 2547، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2547 (Manumisión de esclavos), habla de la doble recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 2547 (Affranchissement des esclaves), évoque la double récompense. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, écrivent, effacent ou pèsent un acte."
  tr: "Sahih el-Buhari'de 2547 numaralı hadis, iki tür mükafattan bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2547, menyebutkan dua pahala. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
