label: { ar: "صحيح مسلم 260 — بر الوالدين أو عقوقهما", en: "Sahih Muslim 260 — dutifulness to the parents or disobedience to them", ur: "صحیح مسلم 260 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih Muslim 260 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos" }
text: "وَحَدَّثَنِي يَحْيَى بْنُ حَبِيبٍ الْحَارِثِيُّ، حَدَّثَنَا خَالِدٌ، - وَهُوَ ابْنُ الْحَارِثِ - حَدَّثَنَا شُعْبَةُ، أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ أَبِي بَكْرٍ، عَنْ أَنَسٍ، عَنِ النَّبِيِّ فِي الْكَبَائِرِ قَالَ \" الشِّرْكُ بِاللَّهِ وَعُقُوقُ الْوَالِدَيْنِ وَقَتْلُ النَّفْسِ وَقَوْلُ الزُّورِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 260، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 260 (The Book of Faith), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 260، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 260 (El Libro de la Fe), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
