label: { ar: "الموطأ 641 — إن أحدكم إذا مات عرض عليه مقعده بالغداة والعشي", en: "Muwatta 641" }
text: "إن أحدكم إذا مات، عرض عليه مقعده بالغداة والعشي. إن كان من أهل الجنة، فمن أهل الجنة. وإن كان من أهل النار، فمن أهل النار"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي أخبر أن أحدهم إذا مات عُرض عليه مقعده بالغداة والعشي: إن كان من أهل الجنة فمن أهل الجنة، وإن كان من أهل النار فمن أهل النار، ويقال له: هذا مقعدك حتى يبعثك الله إلى يوم القيامة. ويذكر المحقق أن في نسختي ص ون «إليه» وهي رواية ابن القاسم ويحيى بن يحيى النيسابوري كما نص عليه ابن عبد البر في التمهيد (14/103)، وأنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسحاق الطباع عند أحمد، وإسماعيل بن أبي أويس عند البخاري (1379)، وسويد، والقعنبي، وابن القاسم عند النسائي (4/107)، ويحيى بن يحيى النيسابوري عند مسلم (8/160). {cite:muwatta-maruf-1997 p.327}"
