label: { ar: "الموطأ 641 — إن أحدكم إذا مات عرض عليه مقعده بالغداة والعشي", en: "Muwatta 641", es: "Muwatta 641", fr: "Muwatta 641", ur: "موطا 641", tr: "Al-Muwatta 641 — Sizden biri öldüğünde, cennetteki yeri ona sabah ve akşam gösterilir.", id: "Al-Muwatta 641 — Apabila salah seorang dari kalian meninggal dunia, tempatnya di Surga akan diperlihatkan kepadanya pagi dan sore." }
text: "إن أحدكم إذا مات، عرض عليه مقعده بالغداة والعشي. إن كان من أهل الجنة، فمن أهل الجنة. وإن كان من أهل النار، فمن أهل النار"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي أخبر أن أحدهم إذا مات عُرض عليه مقعده بالغداة والعشي: إن كان من أهل الجنة فمن أهل الجنة، وإن كان من أهل النار فمن أهل النار، ويقال له: هذا مقعدك حتى يبعثك الله إلى يوم القيامة. ويذكر المحقق أن في نسختي ص ون «إليه» وهي رواية ابن القاسم ويحيى بن يحيى النيسابوري كما نص عليه ابن عبد البر في التمهيد (14/103)، وأنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسحاق الطباع عند أحمد، وإسماعيل بن أبي أويس عند البخاري (1379)، وسويد، والقعنبي، وابن القاسم عند النسائي (4/107)، ويحيى بن يحيى النيسابوري عند مسلم (8/160). {cite:muwatta-maruf-1997 p.327}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Peygamber ona şöyle buyurmuştur: \"Onlardan biri öldüğünde, yeri kendisine sabah ve akşam gösterilir: Eğer cennet ehli arasındaysa, cennet ehli arasındadır; eğer cehennem ehli arasındaysa, cehennem ehli arasındadır. Ve ona şöyle denir: 'Bu, Allah seni Kıyamet Günü'nde diriltinceye kadar senin yerindir.'\" Editör, benim nüshalarımda (S ve N) \"ona\" ifadesinin geçtiğini belirtiyor ki bu, İbn Abdül-Barr'ın el-Temhid'de (14/103) belirttiği gibi, İbn el-Kâsım ve Yahya ibn Yahya el-Naysaburi'nin rivayetidir. Ayrıca, bu hadisin Malik'ten Ebu Mus'ab tarafından, onun aracılığıyla da İbn Hibban ve el-Baghawi tarafından, Ahmed'e göre İshak el-Tabba' tarafından, Buhari'ye göre İsmail ibn Abi Uveys'ten (1379), Nesai'ye göre Suveyd, el-Ka'nebi ve İbn el-Kâsim'den (4/107) ve Müslim'e göre Yahya ibn Yahya el-Naysaburi'den (8/160) rivayet edildiğini de belirtmektedir. {cite:muwatta-maruf-1997 s.327}"
  id: "Malik meriwayatkannya dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar, bahwa Nabi memberitahunya bahwa ketika salah seorang dari mereka meninggal, tempatnya akan diperlihatkan kepadanya pagi dan sore: jika dia termasuk penghuni Surga, maka dia termasuk penghuni Surga, dan jika dia termasuk penghuni Neraka, maka dia termasuk penghuni Neraka. Dan dikatakan kepadanya: Inilah tempatmu sampai Allah membangkitkanmu pada Hari Kiamat. Editor menyebutkan bahwa dalam salinan saya, S dan N, tertulis “kepadanya,” yang merupakan riwayat Ibn al-Qasim dan Yahya ibn Yahya al-Naysaburi, sebagaimana dinyatakan oleh Ibn Abd al-Barr dalam al-Tamhid (14/103). Ia juga menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, dan melalui dia oleh Ibn Hibban dan al-Baghawi, dan Ishaq al-Tabba’ menurut Ahmad, dan Ismail ibn Abi Uways menurut al-Bukhari (1379), dan Suwaid, al-Qa’nabi, dan Ibn al-Qasim menurut al-Nasa’i (4/107), dan Yahya ibn Yahya al-Naysaburi menurut Muslim (8/160). {cite:muwatta-maruf-1997 p.327}"
