text: "… عن الشيبانيِّ عن غيلان عن عبدالله بن يزيد قال: رأيت أبا عُبَيدة بن عبدالله بن مسعود يشرب النبيذ في جَرّ أخضر، وقال: إن مُحَرِّم ما أَحَلَّ اللّٰه كمستحلُ ما حَرَّم الله. - حدَّثنا أبو بكر قال: حدَّثنا مروان بن معاوية …"
