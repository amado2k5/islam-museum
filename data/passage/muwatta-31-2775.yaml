label: { ar: "الموطأ 2775 — خالد بن الوليد يأكل الضب والنبي ينظر: لا حرام ولكنه ليس بأرض قومي", en: "Muwatta 2775" }
summary:
  ar: "يروي مالك عن ابن شهاب، عن أبي أمامة بن سهل بن حنيف، عن عبد الله بن عباس، عن خالد بن الوليد أنه دخل مع النبي بيت ميمونة، فأتي بضب مشوي بالحجارة المحماة، فمد النبي يده إليه، فقالت بعض النسوة: أخبروا رسول الله بما يريد أن يأكل منه، فقيل له إنه ضب، فرفع يده. فسأله خالد: أحرام هو؟ فقال: لا، ولكنه لم يكن بأرض قومي، فأجدني أعافه. فأكله خالد والنبي ينظر. ويذكر المحقق أن ابن عباس كان حاضرا للقصة، وأن ذلك يؤيده حديث ابن المنكدر عن أبي أمامة. {cite:muwatta-maruf-1997 p.560}"
