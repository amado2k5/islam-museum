label: { ar: "الموطأ 2775 — خالد بن الوليد يأكل الضب والنبي ينظر: لا حرام ولكنه ليس بأرض قومي", en: "Muwatta 2775", es: "Muwatta 2775", fr: "Muwatta 2775", ur: "موطا 2775", tr: "El-Muvatta 2775 — Halid ibn el-Velid, Peygamberimiz'in gözleri önünde kertenkele yiyor: Bu yasak değildir, fakat benim ümmetimin topraklarında yasaktır.", id: "Al-Muwatta 2775 — Khalid bin al-Walid memakan kadal sementara Nabi menyaksikan: Itu tidak dilarang, tetapi tidak di negeri kaumku." }
summary:
  ar: "يروي مالك عن ابن شهاب، عن أبي أمامة بن سهل بن حنيف، عن عبد الله بن عباس، عن خالد بن الوليد أنه دخل مع النبي بيت ميمونة، فأتي بضب مشوي بالحجارة المحماة، فمد النبي يده إليه، فقالت بعض النسوة: أخبروا رسول الله بما يريد أن يأكل منه، فقيل له إنه ضب، فرفع يده. فسأله خالد: أحرام هو؟ فقال: لا، ولكنه لم يكن بأرض قومي، فأجدني أعافه. فأكله خالد والنبي ينظر. ويذكر المحقق أن ابن عباس كان حاضرا للقصة، وأن ذلك يؤيده حديث ابن المنكدر عن أبي أمامة. {cite:muwatta-maruf-1997 p.560}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Umame ibn Sahl ibn Huneyf'ten, o da Abdullah ibn Abbas'tan, o da Halid ibn el-Velid'den rivayetle, Peygamberimizle birlikte Meymune'nin evine girdiğini anlatır. Ona sıcak taşlar üzerinde kızarmış bir kertenkele getirildi ve Peygamberimiz ona uzandı. Kadınlardan bazıları, \"Allah'ın Resulüne ne yemek istediğini söyle\" dediler. Bunun bir kertenkele olduğunu söylediler ve Peygamberimiz elini geri çekti. Halid ona, \"Bu haram mı?\" diye sordu. Peygamberimiz, \"Hayır, ama benim kavmimde bulunmaz, bu yüzden bana hoş gelmiyor\" diye cevap verdi. Halid, Peygamberimiz izlerken kertenkeleyi yedi. Araştırmacı, İbn Abbas'ın olayda hazır bulunduğunu ve bunun İbn el-Munkadir'in Ebu Umame'den rivayet ettiği hadisle desteklendiğini belirtiyor. {cite:muwatta-maruf-1997 s.560}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Abu Umamah ibn Sahl ibn Hunayf, dari Abdullah ibn Abbas, dari Khalid ibn al-Walid, bahwa ia memasuki rumah Maymunah bersama Nabi. Seekor kadal yang dipanggang di atas batu panas dibawa kepadanya, dan Nabi meraihnya. Beberapa wanita berkata, \"Katakan kepada Rasulullah apa yang ingin beliau makan.\" Maka mereka memberitahunya bahwa itu adalah kadal, dan beliau menarik tangannya. Khalid bertanya kepadanya, \"Apakah itu haram?\" Beliau menjawab, \"Tidak, tetapi itu tidak ditemukan di negeriku, jadi aku merasa tidak tertarik.\" Khalid memakannya sementara Nabi menyaksikan. Peneliti menyebutkan bahwa Ibn Abbas hadir pada kejadian tersebut, dan hal ini didukung oleh hadits Ibn al-Munkadir dari Abu Umamah. {cite:muwatta-maruf-1997 p.560}"
