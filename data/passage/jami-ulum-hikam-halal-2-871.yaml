text: "… يُطلَى بها الشُّفُنُ، ويُدهَنُ بها الجُلُودُ، ويَستَصبحُ بها النَّاسُ ؟ قَالَ : لا، هُوَ حَرامٌ، ثمّ قَال رَسُولُ اللّٰه وَلَةِ عِنْدَ ذلك : قَاتَل اللّٰه اليَهودَ، إنَّ اللّٰه حَرَّمَ عَليهِمُ الشُّحومَ، فأجْمَلوهُ، ثمَّ باعُوه، فأكَلوا ثَمَنه خرَّجه البُخاريُّ في صحيحه …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 871، يذكر الحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 871, that mentions the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 871 کا اقتباس جس میں حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
