text: "لَّا تَجْعَلُوا۟ دُعَآءَ ٱلرَّسُولِ بَيْنَكُمْ كَدُعَآءِ بَعْضِكُم بَعْضًا ۚ قَدْ يَعْلَمُ ٱللَّهُ ٱلَّذِينَ يَتَسَلَّلُونَ مِنكُمْ لِوَاذًا ۚ فَلْيَحْذَرِ ٱلَّذِينَ يُخَالِفُونَ عَنْ أَمْرِهِۦٓ أَن تُصِيبَهُمْ فِتْنَةٌ أَوْ يُصِيبَهُمْ عَذَابٌ أَلِيمٌ"
text_search: "لا تجعلوا دعاء الرسول بينكم كدعاء بعضكم بعضا ۚ قد يعلم الله الذين يتسللون منكم لواذا ۚ فليحذر الذين يخالفون عن أمره أن تصيبهم فتنة أو يصيبهم عذاب أليم"
translations:
  en: { text: "Make not the calling of the messenger among you as your calling one of another. Allah knoweth those of you who steal away, hiding themselves. And let those who conspire to evade orders beware lest grief or painful punishment befall them.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "مومنو پیغمبر کے بلانے کو ایسا خیال نہ کرنا جیسا تم آپس میں ایک دوسرے کو بلاتے ہو۔ بےشک خدا کو یہ لوگ معلوم ہیں جو تم میں سے آنکھ بچا کر چل دیتے ہیں تو جو لوگ ان کے حکم کی مخالفت کرتے ہیں ان کو ڈرنا چاہیئے کہ (ایسا نہ ہو کہ) ان پر کوئی آفت پڑ جائے یا تکلیف دینے والا عذاب نازل ہو", translator: "Fateh Muhammad Jalandhari", license: PD }
