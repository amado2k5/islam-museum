text: "… يحسن. ولقد بكى رسول اللَّه على ولده إبراهيم وقال : إن العين تدمع والقلب يحزن، ولا نقول إلا ما يرضى ربنا وإنا لفراقك يا إبراهيم محزونون رواه مسلم وإنما الجزع المذموم ما يقع من الجهلة من الصياح، والنياحة ولطم الصدور …"
summary:
