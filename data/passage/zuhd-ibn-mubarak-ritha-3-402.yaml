  tr: "*Al-Zuhd wa al-Raqa'iq* adlı resimli kitabın 3. cildinin 402. sayfasından, merhum için yazılmış ağıt ve övgüleri içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari buku *Al-Zuhd wa al-Raqa'iq*, jilid bergambar 3, halaman 402, berisi elegi dan pujian untuk orang yang telah meninggal; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan pujian paling terkenal."
