text: "العزى، قال: أخبرني عبد الله بن السعدي أنه قدم على عمر بن الخطاب من الشام، فقال: ألم أخبر أنك تعمل على عمل من أعمال المسلمين، فتعطى عليه عمالة، فلا تقبلها؟ فقال: أجل، إن لي أقراسا وأعبدا وأنا بخير، فأريد أن"
