text: "… بن دعموص النميري أنهم وفدوا إلى رسول اللّٰه ملة: قرة، وقيس بن عاصم بن أسيد، وأبو زهير بن أسيد، ويزيد بن عمرو، فقالوا: يا رسول اللّٰه لي، ما تعهد إلينا؟ قال: أَعهَدُ إليكم أن تقيموا الصلاة وتؤتوا الزكاة وتصوموا رمضان، …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1326، يذكر الصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1326, that mentions the prayer, the zakat, the fast and the pilgrimage named together; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
