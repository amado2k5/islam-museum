text: "… ذاك، إِلى خفتُ الإِسار وكان أَثرى عند محمّدٍ ما تعلم فى غير موطن. قال الحارث : أَيها الرجل، قد رأَيتَ ورأَينا معك أَمرًا بَيِّنَّا فى بنى النَّضير، ويوم الخَنْدق وقُرَيْظَة، وقبل ذلك قَيْنُقاع، وفى خَيبر، إنهم كانوا أَعزّ يهود الحجاز …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 729، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
