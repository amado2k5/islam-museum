text: "… حمزة، وبلغنا أن رجلاً قال لحمزة : يا أبا عمارة رأيت رجلاً من أصحابك همز حتى انقطع زرّه، فقال : لم آمرهم بهذا كله. وقال محمد بن الهيثم : أدركت الكوفة ومسجدها الغالب عليه قراءة حمزة الزيات. وروى عن حمزة …"
summary:
