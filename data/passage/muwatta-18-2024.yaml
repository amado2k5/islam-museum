label: { ar: "الموطأ 2024 — يحيى عن مالك: لا يصلح القراض إلا في العين، ولا يكون في العروض، لأن القراض فيها يقع على وجهين، وفيهما غرر، ويقوم عمل العامل بأجرة إن جهل الأمر حتى يمضي", en: "Muwatta 2024", es: "Muwatta 2024", fr: "Muwatta 2024", ur: "موطا 2024", tr: "El-Muvatta 2024 — Yahya, Malik'ten rivayetle: Kâr paylaşımı anlaşması yalnızca nakit ile geçerlidir, mal ile geçerli değildir; çünkü mal ile kâr paylaşımı, her ikisi de belirsizlik içeren iki yönü kapsar. İşçi, iş tamamlanana kadar durumdan haberdar olmasa bile emeğinin karşılığını alır.", id: "Al-Muwatta 2024 — Yahya berdasarkan riwayat Malik: Perjanjian bagi hasil hanya berlaku untuk uang tunai, dan bukan untuk barang dagangan, karena bagi hasil dengan barang dagangan melibatkan dua aspek, yang keduanya mengandung ketidakpastian. Upah pekerja tetap dibayar jika ia tidak mengetahui hal tersebut sampai selesai." }
summary:
  ar: "قال يحيى: قال مالك: لا ينبغي لأحد أن يقارض أحدا إلا في العين، ولا تنبغي المقارضة في العروض، لأن المقارضة في العروض إنما تكون على أحد وجهين: إما أن يقول صاحب العرض للعامل: خذ هذا العرض فبعه، فما خرج من ثمنه فاشتر به، وبع على وجه القراض، فقد اشترط صاحب المال فضلا لنفسه من بيع سلعته وما يكفيه من مؤونتها. أو يقول: اشتر بهذه السلعة وبع، فإذا فرغت فابتع لي مثل عرضي الذي دفعت إليك، فإن فضل شيء فهو بيني وبينك. ولعل صاحب العرض أن يدفعه إلى العامل في زمن هو فيه نافق كثير الثمن، ثم يرده العامل حين يرده وقد رخص، فيشتريه بثلث ثمنه أو أقل من ذلك، فيكون العامل قد ربح نصف ما نقص من ثمن العرض في حصته من الربح. فإن جهل ذلك حتى يمضي، نظر إلى قدر أجر الذي دفع إليه القراض في بيعه إياه وعلاجه، فيعطاه. ثم يكون المال قراضا من يوم نض واجتمع عينا، ويرد إلى قراض مثل. {cite:muwatta-maruf-1997 p.227} {cite:muwatta-maruf-1997 p.228}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Hiç kimse nakit dışında kimseyle kâr paylaşımı anlaşması yapmamalıdır. Mallarda kâr paylaşımı caiz değildir, çünkü mallarda kâr paylaşımı ancak iki şekilde yapılabilir: Ya mal sahibi acenteye şöyle der: \"Bu malları al ve sat, elde ettiğin gelirle de mal al ve kâr paylaşımı esasına göre sat.\" Bu durumda, sermaye sahibi mallarının satışından kendisi için bir kâr ve masraflarını karşılayacak kadar bir miktar belirlemiştir. Ya da şöyle der: \"Bu mallarla al ve sat, işin bittiğinde bana verdiğim mallara benzer mallar al. Artan bir şey olursa, onu aramızda paylaşalım.\" Belki de mal sahibi, mallar yüksek talep gördüğünde acenteye verir ve acente de mallar ucuzladığında onları geri verir ve fiyatının üçte biri veya daha azına geri alır. Böylece acente, malların fiyatındaki kaybın yarısını kâr payı olarak elde eder. Bu durum ancak olaydan sonra öğrenilirse, malların satışı ve taşınması için acenteye ödenen ücret miktarı dikkate alınır ve kendisine verilir. Daha sonra para, tahsil edildiği ve nakde dönüştüğü günden itibaren kâr paylaşım anlaşması haline gelir ve benzer bir kâr paylaşım anlaşmasına iade edilir. {cite:muwatta-maruf-1997 s.227} {cite:muwatta-maruf-1997 s.228}"
  id: "Yahya berkata: Malik berkata: Tidak seorang pun boleh mengadakan perjanjian bagi hasil dengan siapa pun kecuali dalam bentuk tunai. Bagi hasil barang tidak diperbolehkan, karena bagi hasil barang hanya dapat dilakukan dengan salah satu dari dua cara: pemilik barang berkata kepada agen: \"Ambil barang-barang ini dan juallah, dan dengan hasil penjualan itu belilah barang lain, dan juallah berdasarkan bagi hasil.\" Dalam hal ini, pemilik modal telah menetapkan keuntungan untuk dirinya sendiri dari penjualan barang-barangnya dan apa yang cukup untuk pengeluarannya. Atau dia berkata: \"Belilah dengan barang-barang ini dan juallah, dan setelah kamu selesai, belilah untukku barang-barang seperti yang kuberikan kepadamu. Jika ada yang tersisa, itu akan dibagi di antara kita.\" Mungkin pemilik barang memberikannya kepada agen ketika barang tersebut sedang banyak diminati, dan kemudian agen mengembalikannya ketika harganya menjadi lebih murah, dan membelinya kembali dengan harga sepertiga atau kurang dari harga aslinya. Dengan demikian, agen mendapat keuntungan setengah dari kerugian harga barang tersebut sebagai bagian keuntungannya. Jika hal ini baru diketahui setelah kejadian, maka jumlah biaya yang dibayarkan kepada agen untuk penjualan dan penanganan barang dipertimbangkan dan diberikan kepadanya. Kemudian uang tersebut menjadi perjanjian bagi hasil sejak hari dikumpulkan dan menjadi uang tunai, dan dikembalikan ke perjanjian bagi hasil yang serupa. {cite:muwatta-maruf-1997 p.227} {cite:muwatta-maruf-1997 p.228}"
