label: { ar: "الموطأ 2024 — يحيى عن مالك: لا يصلح القراض إلا في العين، ولا يكون في العروض، لأن القراض فيها يقع على وجهين، وفيهما غرر، ويقوم عمل العامل بأجرة إن جهل الأمر حتى يمضي", en: "Muwatta 2024" }
summary:
  ar: "قال يحيى: قال مالك: لا ينبغي لأحد أن يقارض أحدا إلا في العين، ولا تنبغي المقارضة في العروض، لأن المقارضة في العروض إنما تكون على أحد وجهين: إما أن يقول صاحب العرض للعامل: خذ هذا العرض فبعه، فما خرج من ثمنه فاشتر به، وبع على وجه القراض، فقد اشترط صاحب المال فضلا لنفسه من بيع سلعته وما يكفيه من مؤونتها. أو يقول: اشتر بهذه السلعة وبع، فإذا فرغت فابتع لي مثل عرضي الذي دفعت إليك، فإن فضل شيء فهو بيني وبينك. ولعل صاحب العرض أن يدفعه إلى العامل في زمن هو فيه نافق كثير الثمن، ثم يرده العامل حين يرده وقد رخص، فيشتريه بثلث ثمنه أو أقل من ذلك، فيكون العامل قد ربح نصف ما نقص من ثمن العرض في حصته من الربح. فإن جهل ذلك حتى يمضي، نظر إلى قدر أجر الذي دفع إليه القراض في بيعه إياه وعلاجه، فيعطاه. ثم يكون المال قراضا من يوم نض واجتمع عينا، ويرد إلى قراض مثل. {cite:muwatta-maruf-1997 p.227} {cite:muwatta-maruf-1997 p.228}"
