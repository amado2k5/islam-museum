text: "… بأهل الفضل والشرف والوجوه فاذا أخذوا مجالسهم فأذن للناس. كذا فى الكنزج ص. تسويد الأكابر أخرج البخارى فى الأدب ص عن حكيم بن قيس بن عاصم أن أباه أوصى عند موته بنيه فقال : اقواته! وسودوا أكبركم! فان القوم إذا …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 4، ص 452، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 4, p. 452, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 4، ص 452 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 4, pág. 452, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 4, page 452, mentionnant un testament ou des adieux, un lit de mort et les dernières heures. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Navigateur des Testaments."
  tr: "Kendahlevi'nin \"Peygamberin Sahabelerinin Biyografileri\" (Hayat el-Sahabe) adlı eserinin resimli 4. cildinin 452. sayfasında, son bir vasiyet veya ahit ve ölüm anından bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi para Sahabat Nabi (Hayat al-Sahaba) karya al-Kandahlawi, jilid 4 bergambar, halaman 452, menyebutkan wasiat atau perjanjian terakhir, dan saat kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
