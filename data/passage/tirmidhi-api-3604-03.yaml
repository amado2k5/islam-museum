label: { ar: "جامع الترمذي 3604.03 — وصية أو عهد أخير", en: "Jami' al-Tirmidhi 3604.03 — a testament or parting counsel", ur: "جامع ترمذی 3604.03 — وصیت یا آخری نصیحت", es: "Jami' al-Tirmidhi 3604.03 — un testamento o consejo de despedida", fr: "Jami' al-Tirmidhi 3604.03 — un testament ou un conseil d'adieu", tr: "Cami' el-Tirmizi 3604.03 — Son vasiyet veya sözleşme", id: "Jami' al-Tirmidhi 3604.03 — Wasiat atau perjanjian terakhir" }
text: "حَدَّثَنَا يَحْيَى بْنُ مُوسَى، أَخْبَرَنَا وَكِيعٌ، أَخْبَرَنَا أَبُو فَضَالَةَ الْفَرَجُ بْنُ فَضَالَةَ، عَنْ أَبِي سَعِيدٍ الْمَقْبُرِيِّ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ دُعَاءٌ حَفِظْتُهُ مِنْ رَسُولِ اللَّهِ لاَ أَدَعُهُ \" اللَّهُمَّ اجْعَلْنِي أُعَظِّمُ شُكْرَكَ وَأُكْثِرُ ذِكْرَكَ وَأَتَّبِعُ نَصِيحَتَكَ وَأَحْفَظُ وَصِيَّتَكَ \". هَذَا حَدِيثٌ غَرِيبٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3604.03، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3604.03 (Chapters on Supplication), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3604.03، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3604.03 (Capítulos sobre la súplica), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3604.03 (Chapitres sur l'invocation), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'de 3604.03 numaralı hadis, bir vasiyet veya son sözleşmeden bahsetmektedir. Bu hadis, vasiyetler, miras, eski eserler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3604.03, menyebutkan wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, barang antik, dan makam suci, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
