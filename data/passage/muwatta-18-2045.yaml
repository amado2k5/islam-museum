label: { ar: "الموطأ 2045 — مالك: فيمن أخذ من رجل مالا قراضا فعمل فيه، ثم سأله صاحب المال عن ماله فقال: هو عندي وافر، فلما أخذه به قال: قد هلك عندي منه كذا وكذا، وإنما قلت لك ذلك لتتركه عندي: لا ينتفع بإنكاره بعد إقراره، ويؤخذ بإقراره على نفسه، إلا أن يأتي على هلاك ذلك المال بأمر يعرف به قوله", en: "Muwatta 2045", es: "Muwatta 2045", fr: "Muwatta 2045", ur: "موطا 2045", tr: "Al-Muwatta 2045 — Malik: Bir kimseden borç para alıp yatırım yapan, sonra paranın sahibi ona parasını sorduğunda, \"Benim yanımda bol miktarda param var\" diyen kimse hakkında; ancak parayı ondan alırken, \"Benim yanımdayken şu kadar miktarı kayboldu, bunu sana sadece bende bırakman için söyledim\" demiştir. İtiraf ettikten sonra inkar etmesi ona fayda sağlamaz ve itirafından dolayı kendi aleyhine sorumlu tutulur; ancak paranın kaybolmasıyla ilgili olarak ifadesini ispatlayacak bir şey ortaya koyarsa durum değişir.", id: "Al-Muwatta 2045 — Malik: Mengenai seseorang yang mengambil uang dari seorang pria sebagai pinjaman dan menginvestasikannya, kemudian pemilik uang tersebut bertanya kepadanya tentang uangnya dan dia berkata: Uangku banyak, tetapi ketika dia mengambilnya darinya, dia berkata: Sejumlah sekian banyak uang itu hilang ketika aku bersamanya, dan aku hanya mengatakan itu kepadamu agar kamu meninggalkannya bersamaku: Dia tidak mendapat manfaat dari ingkarannya setelah pengakuannya, dan dia dimintai pertanggungjawaban atas pengakuannya terhadap dirinya sendiri, kecuali jika dia menunjukkan sesuatu tentang hilangnya uang itu yang membuktikan pernyataannya." }
summary:
  ar: "قال مالك في رجل أخذ من رجل مالا قراضا، فعمل فيه، ثم سأله صاحب المال عن ماله، فقال: هو عندي وافر. فلما أخذه به، قال: قد هلك عندي منه كذا وكذا، لمال يسميه، وإنما قلت لك ذلك لكي تتركه عندي. قال: لا ينتفع بإنكاره بعد إقراره أنه عنده، ويؤخذ بإقراره على نفسه، إلا أن يأتي على هلاك ذلك المال بأمر يعرف به قوله. فإن لم يأت بأمر معروف، أخذ بإقراره، ولم ينفعه إنكاره. {cite:muwatta-maruf-1997 p.235}"
  tr: "Malik, bir adamdan borç para alan, bu parayı yatırım yapan ve daha sonra borç verenin parasını sorduğunda adamın \"Param bol miktarda var\" diye cevap verdiği bir olaydan bahsetmiştir. Borç veren parayı ondan aldığında ise adam, \"Benimle birlikteyken şu kadar miktarı kaybettim,\" diyerek miktarı belirtmiş ve \"Bunu sadece parayı bende bırakmanız için söyledim\" demiştir. Malik şöyle demiştir: Paranın kendisinde olduğunu itiraf ettikten sonra inkârının hiçbir faydası yoktur ve iddiasını doğrulayacak bir kanıt sunmadığı sürece kendi itirafından sorumludur. Böyle bir kanıt sunmazsa, itirafından sorumludur ve inkârı ona hiçbir fayda sağlamaz. {cite:muwatta-maruf-1997 s.235}"
  id: "Malik berkata tentang seorang pria yang meminjam uang dari pria lain, menginvestasikannya, dan kemudian pemberi pinjaman menanyakan uangnya, dan dia menjawab, \"Uang saya banyak.\" Ketika pemberi pinjaman mengambilnya, dia berkata, \"Sejumlah uang itu telah hilang saat saya bersamanya,\" dengan menyebutkan jumlahnya, \"dan saya hanya mengatakan itu agar Anda meninggalkannya bersama saya.\" Malik berkata: Penolakannya tidak ada gunanya setelah pengakuannya bahwa uang itu ada padanya, dan dia bertanggung jawab atas pengakuannya sendiri kecuali dia memberikan bukti kehilangan uang tersebut yang akan mendukung klaimnya. Jika dia tidak memberikan bukti tersebut, dia bertanggung jawab atas pengakuannya, dan penolakannya tidak berguna baginya. {cite:muwatta-maruf-1997 p.235}"
