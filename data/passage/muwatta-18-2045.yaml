label: { ar: "الموطأ 2045 — مالك: فيمن أخذ من رجل مالا قراضا فعمل فيه، ثم سأله صاحب المال عن ماله فقال: هو عندي وافر، فلما أخذه به قال: قد هلك عندي منه كذا وكذا، وإنما قلت لك ذلك لتتركه عندي: لا ينتفع بإنكاره بعد إقراره، ويؤخذ بإقراره على نفسه، إلا أن يأتي على هلاك ذلك المال بأمر يعرف به قوله", en: "Muwatta 2045" }
summary:
  ar: "قال مالك في رجل أخذ من رجل مالا قراضا، فعمل فيه، ثم سأله صاحب المال عن ماله، فقال: هو عندي وافر. فلما أخذه به، قال: قد هلك عندي منه كذا وكذا، لمال يسميه، وإنما قلت لك ذلك لكي تتركه عندي. قال: لا ينتفع بإنكاره بعد إقراره أنه عنده، ويؤخذ بإقراره على نفسه، إلا أن يأتي على هلاك ذلك المال بأمر يعرف به قوله. فإن لم يأت بأمر معروف، أخذ بإقراره، ولم ينفعه إنكاره. {cite:muwatta-maruf-1997 p.235}"
