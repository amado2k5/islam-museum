text: |-
  ٣٨٨
  *⁦(ضان)⁩
  سامرنى أصوات صنج ملهيه • وصوت صحى فينة مغنيه
  والصحناء بالكسرادام يتخذمن السمن يمدّو يقصر والمحناءة أخص منه ( دن
  الصيدنانى الصيدلانى والصيدنانى أيضادويية قال أبو عبيد تعول لنفسها يتاقى الارض
  وتعميه ويقال له الصيدن أيضا قال كثير بصف ناقته
  كانَ خليفى زورهأورساهما • بن مكوين ثها بعد صيدن
  والصيدت الملك قال رؤية • انى اذا استغلق باب الصيدن* ⁦(صعن)⁩ الصعون الظليم
  بكسر الصادوتشديد الذون صفن الصفن بالتحريك جلدة بيضة الانسان والجمع
  أصفان والصفن بالسم وعاء من أدم مثل السفرة يستق بها وقال الفراءهوشئ مثل الركوة
  يتوضاً فيه قال صخر الغى" الهذلى" يصف ماء ورده
  فخضخضت صفى فى جمه • حياض المدابر قد حاعطوفا
  وقال أبوع ر والصفن خريطة تكون للراعى فيها طعامه وزناده وما يجتاج اليه قال
  ساعدة بن جوية
  معم قاءلا يفرّط حله • صفن وأخراص يلحن ومسأب
  وتصافن القوم الماء اقتسموه بالحصص وذلك انمايكون بالمقلة يسسق الرجل قدر ما يغمرها
  والصافن من الحيل القائم على ثلاث قوائم وقد أقام الرابعة على طرف الحافرتقول صفن
  الفرس يصفن صفونا والصافن الذى يصف قدميه وفى الحديث كااذا صلينا خلفه فرفع
  رأسه من الركوع قناخلفه صفونا فاذا-حد تبعناه أى قناصافين أقدامنا وصفين موضع
  كانت به وقعة بين على ومعاوية رضى اللّٰه عنهما والصافن عرق الساق ⁦(صنى )⁩. الصنّ
  بالكسربول الوبروهو منتن جداقال جرير
  تطلى وهى سيئة المعزى • يعنّ الوبر تحسبهملايا
  والصنّ أيضايوم من ايام العجوز والسنّ أيضاشبه السلة المطبقة يجعل فيه الخبز والصنان دفيز
  |الابط وقد أصن الرجل أى صارله صنان وأصنّ اذاشمخ يأنفه تصكبرا وقال
  أايلى تأكاها مصنا * ومنه قولهم أصنت الناقة اذا حلت فاستكبرت عسلى الفحل الاصممى
  فلان مصن غضبا أى ممتلى "غضبا ⁦(صون)⁩ صنت الشى صونا وصيانا وصيانة فهو
  مصون ولاتة-ل حصان وتوب مصون على النقص ومصوون على التمام وقد فسرناه فى دوف
  وجعلت الثوب فى صوانه وصواته بالضم والسكسر وصيانه أيضا وهو وعاؤه الذى يصان فيه
  وصان الفرس اذا قام على طرف حافره من وجى أوحقى قال النابقة
  وماحاولتما بقبادخيل • يصون الوردفيها والكميت
  وأماقو
  فاوردهن بطن الاتم شعنا • يصن المشى كالحد إالتوام
  فلم يعرفه الاصمعى وقال غيره ييقين بعض المشى ويقسال يتوجين فى المشى من حقى والصوّان
  بالتشديد ضرب من الجارة الواحدة موّانة والصين بلد والصوانى الاوانى منسويات ال.ه
  صل الفناد أن لضائن خلاف الماعز وابمع الذأن والمعز مثل راكب
  وركب وسافر وسف روضأن أيضًا مثل حارس وحوس وقد يجمع على ضمين وهوفعيل مثل غاز
  وغزى
