  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 680), mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn al-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 1, s. 680'inden bir alıntı; vasiyetname veya son vasiyetten ve ölüm saatinden bahsediyor; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir tıpkıbasım baskısından alınmıştır. Vasiyetler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
