text: "… واقتلوا عثمان. قال: وأخبرنا الترمذي : حدثنا قُتَيْبَة، حدثنا اللَّيْثُ، عن مُعَاوية بن صالح، عن ربيعة بن يزيد، عن أبي إدريس الخَوْلاني، عن يزيد بن عَمِيرة قال: لما حضر معاذَ بنّ جبل الموتُ قيل له: يا أبا عبدالرحمٰن، أوصنا. فقال: …"
summary:
