label: { ar: "الموطأ 1463 — عبد ربه بن سعيد: أن أبا بكر بن عبد الرحمن بن الحارث بن هشام كان لا يفرض إلا للجدتين", en: "Muwatta 1463", es: "Muwatta 1463", fr: "Muwatta 1463", ur: "موطا 1463", tr: "El-Muvatta 1463 — Abd Rabbo bin Saeed: Ebu Bekir bin Abdül-Rahman bin El-Harith bin Hişam, mirası yalnızca iki büyükannesine bırakırdı.", id: "Al-Muwatta 1463 — Abd Rabbo bin Saeed: Abu Bakr bin Abd Al-Rahman bin Al-Harith bin Hisham hanya akan membagikan warisan kepada kedua nenek." }
summary:
  ar: "يروي مالك عن عبد ربه بن سعيد أن أبا بكر بن عبد الرحمن بن الحارث بن هشام كان لا يفرض إلا للجدتين. {cite:muwatta-maruf-1997 p.16}"
  tr: "Malik, Abd Rabbih ibn Sa'id'den rivayetle, Ebu Bekr ibn Abd al-Rahman ibn al-Harith ibn Hişam'ın yalnızca iki büyükannesine pay ayırdığını bildirir. {cite:muwatta-maruf-1997 s.16}"
  id: "Malik meriwayatkan dari Abd Rabbih ibn Sa'id bahwa Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham hanya akan membagikan harta warisan kepada kedua neneknya. {cite:muwatta-maruf-1997 p.16}"
