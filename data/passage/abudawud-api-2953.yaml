label: { ar: "سنن أبي داود 2953 — الأب والأبوة، النسب والانتساب", en: "Sunan Abi Dawud 2953 — the father and fatherhood; paternity and lineage", ur: "سنن ابی داؤد 2953 — باپ اور والدیت، نسب اور انتساب", es: "Sunan Abi Dawud 2953 — El padre y la paternidad; paternidad y linaje", fr: "Sunan Abi Dawud 2953 — le père et la paternité; la paternité et la lignée" }
text: "… الْمُصَفَّى، قَالَ حَدَّثَنَا أَبُو الْمُغِيرَةِ، جَمِيعًا عَنْ صَفْوَانَ بْنِ عَمْرٍو، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، عَنْ عَوْفِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ كَانَ إِذَا أَتَاهُ الْفَىْءُ قَسَمَهُ فِي يَوْمِهِ فَأَعْطَى الآهِلَ حَظَّيْنِ وَأَعْطَى الْعَزَبَ حَظًّا. زَادَ ابْنُ الْمُصَفَّى فَدُعِينَا وَكُنْتُ أُدْعَى قَبْلَ عَمَّارٍ فَدُعِيتُ فَأَعْطَانِي حَظَّيْنِ وَكَانَ لِي أَهْلٌ ثُمَّ دُعِيَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2953، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2953 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2953، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2953 (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona al padre y la paternidad, la linaje. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2953 (Tribut, Butin et Suprématie (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith dans les textes du Coran, de la Sunna, de la Sîra et dans les ouvrages traitant du père."
