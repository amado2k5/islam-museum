text: |-
  قوله مثل النفيتّة قال فى مادقنفت
  والنفيتة الحريقة وهو أنيذة
  الدقيق على ماءأولين حتى ينفت
  وهى أغلف من السخينة يتوسع
  جهاصاحب العبال اذ اغلبه
  الدهر اه كنبه المصحح
  قول احر أنه كذا فى جميع النسخ
  النى بأيد يناوعبارة القاموس
  رشمابنته أوأخته لا أمّه وؤهم
  الجوه-رى اه كبه المصتميح
  د•⁦(حزق)⁩*
  شنج النساحرف الجماح كأنه • فى الدارائر الظاعنين مقيد
  وساب حرق أى شديد البرق ويقال ماحراق بالضم مخفف للشديد اللوحسة وقرس حراق
  المدوأيضااذا كا- يحترق فى عدوه والحراق والحراقة ما تقع فيه النار عند القدح والعامة
  تقوله بالتشديد والحروقاء لغة فيه والحرّاقة بالفتح والتشديدضرب من المسفن فيهاعرامى
  نيران يرمى بها العدوفى الجهر وقول الراجز يصف ابلا * حرّقها حض بلادفل • يعنى عطشها
  والحارقتان رؤس الفخذين فى الوركين ويقال هماعصبتان فى الورك والحروق
  لذى انقطعت حارقته ويقال الذى زال وركه ومنه قول الراجزيصف راعيا
  بظسل تحت الفنن الوريق • يشول بنخجن كالمحروق
  يقول انه يقوم على فرد رحل يتطاول للاففان ويجتذيما بالمحجن فينفضها للابل فكانه
  محروق وقال الآخر
  هم الغربان فى حرمات جار • وفى الادنين حرّاق الوروله
  يقول اذا نزل بهم جارذوحرمة أكاواماله كالغراب الذى لابعاف الدبرولا القذر وهم فى الظلم
  والجنف على أدانيهم كالحروق الذى يمشى متجانفاويزه-د فى معونته-م والذب عنهم
  وأماقول الراجز
  نقسم باللّه نسلم الحلقه • ولا حريقار أخته الحرقه
  فهما ولدا النعمان بن المنذر وقوله نسلم أى لانسلم والحرقشان تيم وسعد ابناقيس بن تعلبة
  ابن عكابة بن صعب والحريقة أغاظ من الحساء عن يعقوب وهن مثل المفيتة بقال وجدت
  بى قلان مالهم عيش الا الحرائق والحارقة من النساء الضيقة وفى حديت علىّ عليه السلام
  خير الذساء الحارقة والحرقان المذح وه واصط كال الفخذين والمهارقة المجامعة ⁦( حزق )⁩
  الحزق والحزقة الهاعة من الناس والطير والنخل وغيرها وفى الحديث كأنهما حزقان من
  طير صواف والجمع الحزق مثل فرقة وفرق قال عنترة
  تأوى الى قلص النعام كما أوت • حزق يمانية لاعجم طعطم
  وكذلك الحازقة والحز يق والحزيقة قال ذوالرمّة يصف حر الوحسْ
  كأن كلا ارفضت حزيقتها • بالصلب من نزسه أكفالها كلب
  والحزق القصير الذى يقارب الخطوقال الشاعر
  -زق اذا ما القوم أبدوافكاهة * تفكرآ اياه بعنون أم قردا
  والحزقة أيضا-ثله قال امر والقيس
  وأعجبى مشى الحزفة غالد • كشى أتان حلئت عن مفاهل
  وفى كلامهم جزقة حزفة ترق عين بقة ترق أى ارق من قولك رقيت فى الدرجة وحزقته
  الحبل أحزقه حز فائددته والمتحزق البخيل المتشدد والخازق الذى ضاق عليه خفسه عن ابن
  السكيت يقال لارأى لماقن ولا لحارق وحازوق امم رجل من انموارج بفعلته امر أنه
  حزافا وقاات ترثيه .%).
