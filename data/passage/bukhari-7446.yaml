ref: "7446"
label:
  ar: "البخاري 7446 — اليوم أمنعك فضلي كما منعت فضل ما لم تعمل يداك"
  en: "Bukhari 7446 — Today I withhold My bounty from you as you withheld what your hands did not make"
  ur: "بخاری 7446 — آج میں اپنا فضل تم سے روکتا ہوں جیسے تم نے وہ روکا جو تمہارے ہاتھوں نے نہیں بنایا"
  es: "Bujari 7446 — Hoy te retengo mi generosidad, así como tú retuviste lo que tus manos no hicieron."
  fr: "Bukhari 7446 — Aujourd'hui, Je vous refuse Ma grâce comme vous avez refusé ce que vos mains n'ont pas créé."
  tr: "Buhari 7446 — Bugün ben de, sizin ellerinizle üretmediğiniz şeylerin nimetini esirgediğiniz gibi, nimetimi sizden esirgeyeceğim."
  id: "Al-Bukhari 7446 — Hari ini Aku akan menahan nikmat-Ku darimu sebagaimana kamu menahan nikmat atas apa yang tidak kamu hasilkan."
text: "ثلاثة لا يكلمهم الله يوم القيامة ولا ينظر إليهم رجل حلف على سلعة لقد أعطى بها أكثر مما أعطى وهو كاذب، ورجل حلف على يمين كاذبة بعد العصر ليقتطع بها مال امرئ مسلم، ورجل منع فضل ماء فيقول الله يوم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7446: اليوم أمنعك فضلي كما منعت فضل ما لم تعمل يداك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7446: Today I withhold My bounty from you as you withheld what your hands did not make. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7446: آج میں اپنا فضل تم سے روکتا ہوں جیسے تم نے وہ روکا جو تمہارے ہاتھوں نے نہیں بنایا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7446: Hoy os retengo Mi favor, así como vosotros retuvisteis lo que vuestras manos no crearon. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih al-Bukhari, n° 7446: « Aujourd’hui, Je vous refuse Ma grâce comme vous avez refusé ce que vos mains n’ont pas créé. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, nomor 7446: “Hari ini Aku akan menahan karunia-Ku darimu sebagaimana kamu menahan karunia dari apa yang tidak kamu hasilkan.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
