label:
  ar: "البخاري 7446 — اليوم أمنعك فضلي كما منعت فضل ما لم تعمل يداك"
  en: "Bukhari 7446 — Today I withhold My bounty from you as you withheld what your hands did not make"
  ur: "بخاری 7446 — آج میں اپنا فضل تم سے روکتا ہوں جیسے تم نے وہ روکا جو تمہارے ہاتھوں نے نہیں بنایا"
text: "ثلاثة لا يكلمهم الله يوم القيامة ولا ينظر إليهم رجل حلف على سلعة لقد أعطى بها أكثر مما أعطى وهو كاذب، ورجل حلف على يمين كاذبة بعد العصر ليقتطع بها مال امرئ مسلم، ورجل منع فضل ماء فيقول الله يوم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7446: اليوم أمنعك فضلي كما منعت فضل ما لم تعمل يداك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7446: Today I withhold My bounty from you as you withheld what your hands did not make. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7446: آج میں اپنا فضل تم سے روکتا ہوں جیسے تم نے وہ روکا جو تمہارے ہاتھوں نے نہیں بنایا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
