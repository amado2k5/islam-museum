text: "… الآخِرِ، فَليُحسِنْ إلى جارِه، ومنْ كَانَ يُؤْمِنَ بِاللهِ واليومِ الآخِرِ فَليكْرِمْ ضَيْفه ومنْ كانَ يؤمنُ باللَهِ واليومِ الآخرِ فَلَيَقُلْ خَيْرا أَوْ لِيسكُتَ رَواء مسلُم بهَذَا اللفظ، وروى البخارى بعضه. - ومن عائشةا قالت : قلت : يا رسول اللَّه إِنَّ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 91، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
