label: { ar: "الموطأ 386 — ابن عمر يجمع مع الأمراء بين المغرب والعشاء في المطر", en: "Muwatta 386" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الجمع بين الصلاتين في الحضر والسفر: كان عبد الله بن عمر إذا جمع الأمراء بين المغرب والعشاء في المطر جمع معهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.208}"
