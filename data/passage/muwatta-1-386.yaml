label: { ar: "الموطأ 386 — ابن عمر يجمع مع الأمراء بين المغرب والعشاء في المطر", en: "Muwatta 386", es: "Muwatta 386", fr: "Muwatta 386", ur: "موطا 386", tr: "El-Muvatta 386 — İbn Ömer, yağmurlu günlerde akşam ve yatsı namazlarını prenslerle birleştirir.", id: "Al-Muwatta 386 — Ibnu Umar menggabungkan salat Maghrib dan Isya dengan para pangeran saat hujan." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الجمع بين الصلاتين في الحضر والسفر: كان عبد الله بن عمر إذا جمع الأمراء بين المغرب والعشاء في المطر جمع معهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.208}"
  tr: "Malik'in Nafi'den rivayet ettiği, evde veya yolculukta namazları birleştirme bölümünde yer alan bir rivayete göre: Hükümdarlar yağmur nedeniyle akşam ve yatsı namazlarını birleştirdiklerinde, Abdullah ibn Umar da onlara katılırdı. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suwaid, Abd al-Razzaq, Muhammed ibn al-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Bayhaqi tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.208}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang menggabungkan salat saat di rumah atau bepergian: Abdullah ibn Umar, ketika para penguasa menggabungkan salat Maghrib dan Isya karena hujan, akan menggabungkannya. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.208}"
