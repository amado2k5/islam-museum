text: "… بدء القنوت هو قنوتُ النبي لِعِ يدعو على رِعل وذَكوان، ففي الصحيحين من حديث عبد العزيز بن صهيب، عن أنس قال: بعثَ رسولُ اللَّه عي سبعين رجلاً لحاجة يقال لهم: القُرَّاءُ، فعرض لهم حَيَّانِ من بني سليم رِعِل وذكوان عند …"
