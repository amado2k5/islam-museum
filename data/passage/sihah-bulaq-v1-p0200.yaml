text: |-
  ⁦(فصل الالف)⁩
  ٤٤١
  نكرة أواضافه تقول مضى الامس المباركْ ومضى امسنا وكل غدصائرأمساوقال سيبويه
  قدجاء فى ضرورة الشعر مذ أمس بالفتح وأنشد
  لقدرآيت عمامذأما •غمازا.ئل العالى خ
  يا كان مافى رحلهن همسا • لاترك اللّٰه لهنّ ضرسا
  قال ولا يصغر أمس كمالا يصغر غداوالبارحة وكيف وأين ومتى وأىّ وما وعند وأسماء
  النهور والاسبوع غير الجمعة أنس الانس البشر الواحدانسى وانسىّ أيضا بالتحريك
  والجمع اناسى وان شئت جعلته انساناثم جعته اناسىّ فسكون ال.ساء عوضا من النون وقال
  عالى واناسىّ كمرا وكذلك الاناسية مثل الصارفة والصاقلة ويقال للمرأة أيضاانسان
  ولا يقال انسانة والعامة تقوله وانسان العين المثال الذى يرى فى السواد أى سواد العبن
  ويجمع أيضا على اناسى قال ذو الرمة يصف ابلاغارت عيونها من التعب والسير
  أناسى ملحوداها فى الحواجب ولا يجمع على اناس وتقسديرانسان فعلان وانمازيد
  فى تصقيره ياء كم زيد في تصغيرزجسل فقيل رويجل وقال قوم آضلد انس إن على افسلان
  فذفت الياء استخفا فالمكثرة ما يجرى على ألسنتهم فاذاصغروه رد وهالان التصغير لايكثر
  واستدلوا عليه بقول ابن عباس رضى اللّه عنه أنه قال انماسمى انسانالانه عه-د اليه ننسى
  والاناس لغة فى الناس وهو الاصل تخفف قال الشاعر
  انّ المنايا يطلعن على الاماس الامنينا ويقال كيف ابن أنسك وانسك يعنى نفسه أى كيف
  تزانى فى مصاحبتى اياك وفلان ابن انس فلان أى صفيه وخاصته وهذاخدنى وأنسى وخلصى
  وجلسى كله بالكسر واستأنست بفلان وتأنست به بعنى واستانس الوحذى اذا أحس
  انسياوالانيس المؤانس وكل مايؤنس به وما بالدارأنيس أى أحد وقول الكميت
  فيهن آنسة الخديث حبية * ليست بقاحشة ولاستفال
  أى تأنس محديثك ولم يرد أنها تونسك لانه لو أرادذلك لقال مؤنسة وآنسته أبصرنه بقال
  آنست منه رشدا أى علمته وآنست الصوت سمعته والابناس خلاف الايحاش وكذلك
  التأنيس وكانت العسرب تسمى يوم الخيس مؤنسا قال الفرّاء يقال يونس ويونس ويونس
  ثلاث لغات فى اسم رحسل وحكى فيه الهسمز أيضا قال أبوزيد الانسى الايسر من كل شئ
  وقال الاصهى هو الايمن وقال كل اثنين من الانسان مشل الساعدين والزندين والقسدمين
  فا أقبل منه-ماعلى الانسان فهو أنسى" وما أدبر عنه فهو وحشىّ وأنسىّ القوس ما أقبل
  عليك منها والانس بالتصريك الحالمقيمون والانس أيضالغة فى الانس وأنشدِ الاخفس
  أنوانارى فقلت منون أنتم * فقالوا الجن فقلت ه واظلاما
  فقلت الى الطعام فقال منهم • زعيم غحد الانس الطعاما
  قال والانس أيضا خلاف الوحشة وهومصدر قولك انست به بالكسرانسا وأنسة وفيه
  لغسة أخرى أنست به أنسامثال كفرت بدكفرا وس الاوس العطاءأبوزيد أست
  القوم أوسهم أوسااذا أعطيتهم وكذلكْاذاعوّضتهم من شئ وقال
  فلأً حشأنك منقصا * أوسا أويس من الهباله
  صاح
