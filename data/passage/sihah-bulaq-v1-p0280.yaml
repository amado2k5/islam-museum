  أى جعلتنا ذوى عذر والاعذارطعام الختان وهو فى الاصل مسدر والعذيرة مثلد الاضهى
  لقيت منه عاذورا أى شرًا وهى لغة فى العاثور أ واشغة وتعذر عليه الامر أى تعسر وتعذر
  أيضا من العذرة أى تلطخ وتعذريمعنى اعتذر واحتج لنفسه قال الشاعر
  كأن يديها حين يقلق ضفرها * يدائصف غيرى تعذر من جرم
  وتعدر الرسم أى درس وقال الشاعر
  لعبت بهاهوج الر ياح فأصبحت * قفر اتعذ ر غير أورق هامد
  وعذره تعذيرا أى الطخه بالعذرة والمعذرون من الاعراب يقرأ بالتشديد والتخفيف فأما
  المعذربالتشديد فقد يكون محقا وقديكون غير محق فاما الهق فهو فى المعنى المعتذرلان له
  عذرا والكن التاهقلبت ذالا فأدغمت فيها وجعلت حركتها على العين كما قرئ يخصمون بفتح
  نلحاء ويجوز كسر العين لاجتماع الساكنين ويجوزضمها اتباعاللمسيم واماالذى ليس
  يمحق فهو المعذر على جهة المفعل لانه الممرّض والمقصر يعتذر بغيرء_ذر وكان ابن عباس
  رضى اللّٰه عنهماية رأءمده وجاء المعذرون مخففة من أعذرو كان يقول واللّه لهاذا أنزات
  وكان يقول لعن اللٰه المعذرين وكأن الامر عنده ان المعذر بالتشديد هو المظهر للعذراعتلالا
  من غير حقيقة له فى العذر وهذ الاعذر له والمعذر الذى له عذر وقد بينا الوجه الثانى
  فى المشدّدوالمعذر يفتح الذال موضع العذارين ويقال عذ رعين بعيرك أى سمه بغيرسمة بعيرى
