  وذوحلق تقضى العواذير بينها * تزوح باحضار عظام اللواقح
  والعذير الحال التى يحاولها المريمذر عليها قال العجاج
  جارى لاتستنكرى عذيرى * سيرى واشفاقى على بعبرى
  ريدياجارية فرخم والجمع عذر مثل سريروسرر وقدجاء فى الشعر مخففا وأنشدأ
  يوعسد لحاء
  اماوى قدطال التجنب والهجر • وقد عذرتنى فى طلابكم عذر
  والعذور السي الخلق قال الشاعر
  اذا نزل الاضياف كان عذورا * على الحى حتى تستقل مراجله
  وحارعذور واسع الجوف .⁦(عذفر)⁩ جمل عذافروهوالعظيم الشديد وناقة عذافرة
  وعذا فراسم رجل ويسمى الاسدءذافرا .⁦(عرد)⁩ الاموى العز بالفتح الجرب تقول منه
  عرّت الابل تعرّفهى عارة وحكى أبو عبيد جل أعر وعارأى جرب والعر بالضم قروح مشمل
  القوباء تخرج بالابل متفرقة فى مشافرها وقوائمها يسيل منهامثل الماء الاصفر فتكوى
  الصجاح لثلا تعديها المراض تقول منه عرّت الابل فهى معرورة قال النابغة
