text: "… زوِّجُوا مَنْ أَكَلُوا الهريسة أَقِيمَتْ وليمةُ عرسٍ لجحا فحضرها أصحابه وأهله، وأخذوا يأكلون الطعام المهيَّأ لهم، وكان مِنَ الهريسةِ، وجحا يُحِبُّها كثيراً، لكنهم نَسَوْا أنْ يُنادُوهُ لِيأكلَ معهم، فأغتاظَ منهم وخرج. وسألوا عنه بعد ساعة، فلم يَجِدوه، فأرسلوا مَنْ يبحثُ …"
summary:
  ar: "نسي المدعوون في وليمة عرس جحا أن يدعوه لأكل الهريسة فغادر، ولما قيل له إنهم فاتهم حضور عرسه قال إنه لا حاجة له بالزواج وإن الذين أكلوا الهريسة هم من يجب أن يتزوجوا. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  en: "At his own wedding feast the guests forget to call Juha to eat the harissa, so he leaves; told they missed his wedding, he says he has no need to marry, and that the ones who ate the harissa should marry. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  ur: "جحا کی اپنی شادی کی دعوت میں مہمان اسے ہریسہ کھانے کے لیے بلانا بھول گئے تو وہ چلا گیا؛ جب بتایا گیا کہ وہ اس کی شادی میں شریک نہ ہو سکے تو اس نے کہا کہ مجھے شادی کی ضرورت نہیں، جنہوں نے ہریسہ کھایا انہی کی شادی ہونی چاہیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  fr: "À son propre festin de noces, les invités oublient d'appeler Juha à manger la harissa, alors il s'en va ; quand on lui dit qu'ils ont manqué ses noces, il répond qu'il n'a pas besoin de se marier et que ce sont ceux qui ont mangé la harissa qui devraient le faire. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  es: "En su propio banquete de bodas, los invitados olvidan llamar a Juha a comer la harisa, así que se marcha; cuando le dicen que se perdieron su boda, responde que no necesita casarse y que quienes comieron la harisa deberían casarse. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
