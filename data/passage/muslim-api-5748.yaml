label: { ar: "صحيح مسلم 5748 — أعضاء البدن، حسم الجرح", en: "Sahih Muslim 5748 — the organs of the body; cauterising a wound", ur: "صحیح مسلم 5748 — اعضائے بدن، زخم داغنا" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا أَبُو الزُّبَيْرِ، عَنْ جَابِرٍ، ح وَحَدَّثَنَا يَحْيَى، بْنُ يَحْيَى أَخْبَرَنَا أَبُو خَيْثَمَةَ، عَنْ أَبِي الزُّبَيْرِ، عَنْ جَابِرٍ، قَالَ رُمِيَ سَعْدُ بْنُ مُعَاذٍ فِي أَكْحَلِهِ - قَالَ - فَحَسَمَهُ النَّبِيُّ بِيَدِهِ بِمِشْقَصٍ ثُمَّ وَرِمَتْ فَحَسَمَهُ الثَّانِيَةَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5748، يذكر أعضاء البدن، وحسم الجرح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5748 (The Book of Greetings), that mentions the organs of the body, cauterising a wound. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5748، جس میں اعضائے بدن، زخم داغنا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
