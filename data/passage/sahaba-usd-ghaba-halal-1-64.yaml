text: "… سليمان بن أكيمة، عن أبيه عن جده أن أكيمة قال : يا رسول الله، إنا نسمع منك الحديث ولا نقدر على تأديته، قال: لا بأس زدت أو نقصت، إذا لم تحل حراماً أو تحرّم حلالاً وأصبت المعنى. وقد روى بعضهم …"
