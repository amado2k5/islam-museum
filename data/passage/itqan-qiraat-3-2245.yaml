label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2245 — جمع القرآن والمصاحف، رسم المصحف", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2245 — the collection of the Qur'an and the codices; the orthography of the mushaf", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2245 — جمعِ قرآن اور مصاحف، رسمِ مصحف", es: "Al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, volumen escaneado 3, pág. 2245 — la colección del Corán y los códices; la ortografía del mushaf", fr: "al-Itqan fi 'Ulum al-Qur'an d'al-Suyuti, scan volume 3, p. 2245 — le recueil du Coran et des codex; l'orthographe du mushaf" }
text: "في مرسوم الخط وآداب كتابته النوع السادس والسبعون مسألة اخْتُلِف في نَقْط المصحف وشَكْلِه. ويقال : أولُ مَنْ فعل ذلك أبو الأسود الدُّؤَلي بأمرِ عبد الملك بن مروان. وقيل: الحسنُ البصري ويحبى بن يَعْمَر، وقيل: نصرُ بنُ عاصم الليثيُّ. وأولُ …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2245، يذكر جمع القرآن والمصاحف، ورسم المصحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2245, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2245 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 2245, que menciona la colección del Corán y los códices, la ortografía del mushaf, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du livre d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 3, page 2245, mentionnant la compilation du Coran et des codex, l'orthographe du mushaf, ainsi que la ponctuation et les signes vocaliques de ce dernier. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
