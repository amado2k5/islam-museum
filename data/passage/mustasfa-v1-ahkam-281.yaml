text: "… خلافاً للمعتزلة. ودليله: أن لا معنى للواجب إلا ما أوجبه الله - تعالى - وأمر به، وتوعد بالعقاب على تركه، فإذا لم يرد الخطاب، فأي معنى للوجوب!. ثم تحقيق القول فيه: أن العقل لا يخلو: إما أن يوجب ذلك لفائدة، …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 281، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 281, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 281 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
