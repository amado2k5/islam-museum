  ur: { text: "اور (بھلا) جب تم اپنے باغ میں داخل ہوئے تو تم نے ماشاالله لاقوة الابالله کیوں نہ کہا۔ اگر تم مجھے مال واولاد میں اپنے سے کمتر دیکھتے ہو", translator: "Fateh Muhammad Jalandhari", license: PD }
