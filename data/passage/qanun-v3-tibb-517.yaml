text: "… واحتفظ به، وإذا احتجت إلى استعماله في إذهاب الإعياء فخذ منه ثلاث أواق، ومن شحم البط ثلاث أواق، ومن دهن الحناء ثلاث أواق واخلط به واستعمله. ضمّاد آخر : نافع لوجع المفاصل والنقرس وهو دواء ملحج."
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 517، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والحناء دواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 517, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the drug, henna as a remedy; from the machine-read scan, quoted within forty words per the sources policy."
