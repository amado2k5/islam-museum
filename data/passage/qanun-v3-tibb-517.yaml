text: "… واحتفظ به، وإذا احتجت إلى استعماله في إذهاب الإعياء فخذ منه ثلاث أواق، ومن شحم البط ثلاث أواق، ومن دهن الحناء ثلاث أواق واخلط به واستعمله. ضمّاد آخر : نافع لوجع المفاصل والنقرس وهو دواء ملحج."
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 517، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والحناء دواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 517, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the drug, henna as a remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 517 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، مہندی بطور دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 517, que menciona el dolor, enfermedades específicas, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el medicamento y la henna como remedio; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 517, qui mentionne la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament, le henné comme remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Bölümünün 517. sayfasından bir bölüm; ağrı, hastalıkların isimleri, vücut organları, cerrahi, sünnet, atel, ilaç ve kına gibi tıbbi uygulamalardan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 3, hlm. 517, yang menyebutkan rasa sakit, nama-nama penyakit, organ tubuh, pembedahan, sunat, bidai, obat-obatan, dan henna sebagai obat; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
