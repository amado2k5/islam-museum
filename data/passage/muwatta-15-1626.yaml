label: { ar: "الموطأ 1626 — نافع عن ابن عمر: الأمة تكون تحت العبد فتعتق، إن لها الخيار ما لم يمسها", en: "Muwatta 1626", es: "Muwatta 1626", fr: "Muwatta 1626", ur: "موطا 1626", tr: "El-Muvatta 1626 — İbn Ömer'den rivayet edildiğine göre Nafi': Bir erkek kölenin himayesi altında olan ve sonradan azat edilen kadın köle, erkek köle ona dokunmadığı sürece seçim yapma hakkına sahiptir." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يقول في الأمة تكون تحت العبد فتعتق، إن لها الخيار ما لم يمسها. {cite:muwatta-maruf-1997 p.72}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan naklederek, bir erkek kölenin vesayeti altında olan ve sonradan azat edilen bir kadın köle hakkında şöyle derdi: \"Erkek köle onunla cinsel ilişkiye girmemişse, kadın onunla evli kalma seçeneğine sahiptir.\" {cite:muwatta-maruf-1997 s.72}"
  id: "Malik meriwayatkan dari Nafi’ yang juga dari Abdullah ibn Umar bahwa beliau biasa berkata mengenai seorang budak perempuan yang berada di bawah perwalian seorang budak laki-laki dan kemudian dibebaskan, bahwa ia memiliki pilihan untuk tetap menikah dengannya selama ia belum melakukan hubungan seksual dengannya. {cite:muwatta-maruf-1997 p.72}"
