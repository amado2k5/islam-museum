text: "… دهنا، لم يفطر به اوط عل قاح او عبر القال الأوالفرة من أدف الحل، عن العمرة الوا ن احرم من الحل نظرت... • باس ان يلبى الحلال لا تحل للمحرم الإعانة على الصيد بشىء إن دل الحلال محرما على الصيد …"
summary:
