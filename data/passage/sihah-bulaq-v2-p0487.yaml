text: |-
  ١ ف نسخة زيادة عدى بن
  ١٠٠
  طريق قال الاعشى
  طريق وجبارروا أصوله • عليه أبابيسل من الطير تنعب
  والطر بقة نسيجة تفسج من صوف أوشعر فى عرض الذراع أو أقلّ وطولهاعسلى قدرالبيت
  فتخيط فى ملتقى الشقاق من الكسر الى الكسر وطريقة القوم أماثلهم وخيارهم يقال
  هذارجل طريقسة قومه وهؤلاء طريقة قومه-م وطرائق قومه-م أيضالار جال الاشراف.
  حكاها يعقوب عن الفراه قال ومنه قوله تعالى كناطرائق قددا أى كتافر قا مختلدة
  • أهواؤنا وطريسة الرجل مذهبه يقال مازال فلان على طريقة واحدة أى على حالة واحدة
  واختضبت المرأة طرقة أوطرقتين أى مرة أو. رتين وأنا آتى فلانا فى اليوم ط-رقتين أى
  مزتين وه-ذه النبل طرقة رجل واحد أى صنعة رجل واحد قال أبوزيد الطرق والمطروق
  ماءال-ياء الذى تبول في-ه الابل وتبعر قال الشاعر ⁦(١)⁩
  ثم كان المزاج ماءسيحاب • لاجواجن ولا مطروق
  ومنه قول ابراهيم الوضو بالطرق أحب الى من التيم والطرق أيضاما الفعل والطرق
  الاساريع التى فى القوس الواحدة طرقة مثال غرفة وغرف ويقا_ أيضامازال ذات طرقتك
  أى دأبك وقولهم مابه طرق بالكسر أى قوّة وأصل الطرق الشهم فكنى به عنها لانها أكثر
  ما تكون عنه والطرق بالتحريك جمع طرقة وهى مثل العرقة والصف والرزدق وحبالة الصائد
  ذات الكفف وآثار الابل بعضها فى اثر بعض طرقة يقال جات الابل على طرقة واحدة وعلى
  خف واحد أى على اثر واحد والطرق أيضائى القربة والمع أمراق وهى أثناؤها اذا تخمثت
  وتشفت وأماقول رؤية • للعداذ أخلفه ماء الطرق* فهى مناقع الياه قال الفرّاء الطرق
  فى البعير ضعف فى ركبتيه يقال بعير أطرق وناقة طرقاء بينة الطرق والطرق أيضافى
  الريس أن يكون بعضها فوق بعض وقال يصف قطلة
  أما القطاة فانى سوف أنعتها * نعتايوافق نعتى بعض مافيها
  سكا مخطومة فى ريشهاطرق • سودقوادمهاصهب خوافيها
  تقول منه اطرق جناح الطائر على افتعل أى التف قال الاصمعىّ رجل مط-روق أى في'
  رخوة وضعف قال ابن أحر
  ولا تصلى بطروق اذا ما • سرى فى القوم أصبح مستكينا
  ومصدره الطريقة بالتشديد يقال ات تحت طرّيقتك لعند أوة أى انّ فى لينه وانقياده أحيانا
  بعض العسر ويقال هذا مطراق هذا أى تاوه وتظيره وقال
  قات البغاة أبو البيداء مخترما * ولم يفادرله فى الناس مطراها
  والجمع مطاريق يقال جاءت الابل مطاريق اذاجادت يتبع بعضها بعضا وطرقت الابل الماءاذا !
  بالت فيسه وبعرت فهوماء مط-روق وطرق وأناناذلان طروقا اذاجاء بليل وقد طرق بطرق
  طروقافه وطارق ورج-ل طرقة مثال همزة اذا كان يسرى حتى يطرق أهله ليلا والطارق
  النحم الذى بقسال له كوكب الصبح ومنهقول هند
  تن بنات طارق * غمشى على النمارق
  ى
