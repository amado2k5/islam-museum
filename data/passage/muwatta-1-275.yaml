label: { ar: "الموطأ 275 — عثمان في خطبته: استمعوا وأنصتوا، واعدلوا الصفوف", en: "Muwatta 275" }
text: "إذا قام الإمام يخطب يوم الجمعة فاستمعوا وأنصتوا، فإن للمنصت الذي لا يسمع من الحظ مثل ما للمنصت السامع"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن مالك بن أبي عامر، في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب: كان عثمان بن عفان يقول في خطبته قلّ ما يدع ذلك: إذا قام الإمام يخطب يوم الجمعة فاستمعوا وأنصتوا، فإن للمنصت الذي لا يسمع من الحظ مثل ما للمنصت السامع، فإذا قامت الصلاة فاعدلوا الصفوف وحاذوا بالمناكب فإن اعتدال الصفوف من تمام الصلاة؛ ثم كان لا يكبر حتى يأتيه رجال وكّلهم بتسوية الصفوف فيخبرونه أن قد استوت فيكبر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.160} {cite:muwatta-maruf-1997 p.161}"
