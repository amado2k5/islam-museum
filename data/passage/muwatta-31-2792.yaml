summary:
  ar: "بلغ مالكا أن النبي قال: إن كان دواء يبلغ الداء فإن الحجامة تبلغه. ويذكر المحقق قول ابن عبد البر أن معنى هذا الحديث محفوظ من حديث أبي سلمة عن أبي هريرة، ومن حديث حميد عن أنس، ومن حديث سمرة، وأن ألفاظها مختلفة. {cite:muwatta-maruf-1997 p.569}"
