label: { ar: "الموطأ 2792 — الحجامة دواء يبلغ الداء", en: "Muwatta 2792", es: "Muwatta 2792", fr: "Muwatta 2792", ur: "موطا 2792", tr: "Al-Muwatta 2792 — Hacamat, hastalığı iyileştiren bir ilaçtır.", id: "Al-Muwatta 2792 — Bekam adalah obat yang menyembuhkan penyakit" }
summary:
  ar: "بلغ مالكا أن النبي قال: إن كان دواء يبلغ الداء فإن الحجامة تبلغه. ويذكر المحقق قول ابن عبد البر أن معنى هذا الحديث محفوظ من حديث أبي سلمة عن أبي هريرة، ومن حديث حميد عن أنس، ومن حديث سمرة، وأن ألفاظها مختلفة. {cite:muwatta-maruf-1997 p.569}"
  tr: "Malik, Peygamber'in şöyle buyurduğunu rivayet etmiştir: \"Eğer bir hastalığı iyileştirebilecek bir ilaç varsa, o da hacamattır.\" Araştırmacı, İbn Abdül-Barr'ın bu hadisin anlamının, Ebu Seleme'nin Ebu Hurayra'dan rivayet ettiği hadiste, Humayd'ın Enes'ten rivayet ettiği hadiste ve Samura'nın hadiste, ifadeleri farklı olsa da, korunduğuna dair ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.569}"
  id: "Malik meriwayatkan bahwa Nabi bersabda: “Jika ada obat yang dapat menyembuhkan penyakit, maka bekamlah salah satunya.” Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa makna hadits ini terdapat dalam hadits Abu Salama dari Abu Hurayra, dan dalam hadits Humayd dari Anas, serta dalam hadits Samura, meskipun redaksinya berbeda. {cite:muwatta-maruf-1997 p.569}"
