text: "… الرسول إلى المشركين فلحقوا بالساحل، ومنهم أبو بَصير، وجعلوا يغيرون على الكفار ويأخذون عيرهم، حتى جاء كبار قريش إلى النبي للي وقالوا: أضممهم إليك حتى نأمن ؛ ففعل. وقيل: هَمّت غَطَفَان وأسد منع المسلمين من يهود خَيْبر؛ لأنهم كانوا حلفاءهم، …"
