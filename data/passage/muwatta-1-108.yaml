label: { ar: "الموطأ 108 — ابن شهاب: من قبلة الرجل امرأته الوضوء", en: "Muwatta 108" }
summary:
  ar: "يروي مالك عن ابن شهاب الزهري أنه كان يقول إن قبلة الرجل امرأته توجب الوضوء؛ وهو في باب الوضوء من قبلة الرجل امرأته. ويذكر المحقق أن ابن أبي شيبة رواه عن وكيع عن عبد العزيز بن عبد الله سائلاً الزهري، وأن عبارة «قال مالك: وذلك أحب ما سمعت إلي» الواردة بعده في إحدى النسخ ليست من رواية يحيى وإنما من رواية عبد الله بن نافع الصائغ. {cite:muwatta-maruf-1997 p.88}"
