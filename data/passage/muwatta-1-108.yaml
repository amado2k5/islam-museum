label: { ar: "الموطأ 108 — ابن شهاب: من قبلة الرجل امرأته الوضوء", en: "Muwatta 108", es: "Muwatta 108", fr: "Muwatta 108", ur: "موطا 108", tr: "El-Muvatta 108 — İbn Şihab: Bir erkek karısını öperse abdest almalıdır.", id: "Al-Muwatta 108 — Ibn Shihab: Jika seorang pria mencium istrinya, dia wajib berwudhu." }
summary:
  ar: "يروي مالك عن ابن شهاب الزهري أنه كان يقول إن قبلة الرجل امرأته توجب الوضوء؛ وهو في باب الوضوء من قبلة الرجل امرأته. ويذكر المحقق أن ابن أبي شيبة رواه عن وكيع عن عبد العزيز بن عبد الله سائلاً الزهري، وأن عبارة «قال مالك: وذلك أحب ما سمعت إلي» الواردة بعده في إحدى النسخ ليست من رواية يحيى وإنما من رواية عبد الله بن نافع الصائغ. {cite:muwatta-maruf-1997 p.88}"
  tr: "Malik, İbn Şihab el-Zuhri'den rivayet eder ki, bir erkeğin karısını öpmesi abdest almayı gerektirir derdi; bu, bir erkeğin karısını öptükten sonraki abdest bölümünde yer almaktadır. Araştırmacı, İbn Abi Şeybe'nin bunu Vaki'den, o da Abdülaziz ibn Abdullah'tan rivayet ettiğini, Abdullah'ın da el-Zuhri'ye sorduğunu ve rivayetlerden birinde bundan sonra gelen \"Malik dedi ki: Duyduklarımdan daha çok bunu tercih ederim\" ifadesinin Yahya'nın değil, Abdullah ibn Nafi' el-Sa'igh'ın rivayetinden olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.88}"
  id: "Malik meriwayatkan dari Ibn Shihab al-Zuhri bahwa ia biasa mengatakan bahwa seorang pria yang mencium istrinya mewajibkan wudhu; ini terdapat dalam surah tentang wudhu setelah seorang pria mencium istrinya. Peneliti menyebutkan bahwa Ibn Abi Shaybah meriwayatkannya dari Waki' dari 'Abd al-'Aziz ibn 'Abd Allah, yang bertanya kepada al-Zuhri, dan bahwa ungkapan \"Malik berkata: Itulah yang saya pilih daripada yang saya dengar,\" yang muncul setelahnya dalam salah satu versi, bukanlah dari riwayat Yahya, melainkan dari riwayat 'Abd Allah ibn Nafi' al-Sa'igh. {cite:muwatta-maruf-1997 p.88}"
