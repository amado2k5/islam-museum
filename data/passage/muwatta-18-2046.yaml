label: { ar: "الموطأ 2046 — مالك: فيمن دفع إلى رجل مالا قراضا فربح، فقال العامل: قارضتك على أن لي الثلثين، وقال رب المال: على أن لك الثلث: القول قول العامل مع اليمين إذا كان يشبه قراض مثله، فإن جاء بأمر يستنكر لم يصدق ورد إلى قراض مثله", en: "Muwatta 2046" }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا فربح فيه ربحا، فقال العامل: قارضتك على أن لي الثلثين. وقال صاحب المال: قارضتك على أن لك الثلث. قال مالك: القول قول العامل، وعليه في ذلك اليمين، إذا كان ما قال يشبه قراض مثله، وكان ذلك نحوا مما يتقارض عليه الناس. وإن جاء بأمر يستنكر، ليس على مثله يتقارض الناس، لم يصدق، ورد إلى قراض مثله. {cite:muwatta-maruf-1997 p.235} {cite:muwatta-maruf-1997 p.236}"
