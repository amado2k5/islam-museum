label: { ar: "الموطأ 2046 — مالك: فيمن دفع إلى رجل مالا قراضا فربح، فقال العامل: قارضتك على أن لي الثلثين، وقال رب المال: على أن لك الثلث: القول قول العامل مع اليمين إذا كان يشبه قراض مثله، فإن جاء بأمر يستنكر لم يصدق ورد إلى قراض مثله", en: "Muwatta 2046", es: "Muwatta 2046", fr: "Muwatta 2046", ur: "موطا 2046", tr: "El-Muvatta 2046 — Malik: Bir kimse, bir adama kâr paylaşımı (kırad) için para vermiş ve kâr etmişse, işçi: “Ben bu anlaşmaya, kârın üçte ikisini almam şartıyla girdim” demişse ve paranın sahibi: “Sen de üçte birini alman şartıyla” demişse, işçinin sözü, benzer bir kâr paylaşımı anlaşmasına benziyorsa yeminle kabul edilir. Ancak kabul edilmeyen bir şey söylerse, ona inanılmaz ve mesele benzer bir kâr paylaşımı anlaşmasına geri döner." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا فربح فيه ربحا، فقال العامل: قارضتك على أن لي الثلثين. وقال صاحب المال: قارضتك على أن لك الثلث. قال مالك: القول قول العامل، وعليه في ذلك اليمين، إذا كان ما قال يشبه قراض مثله، وكان ذلك نحوا مما يتقارض عليه الناس. وإن جاء بأمر يستنكر، ليس على مثله يتقارض الناس، لم يصدق، ورد إلى قراض مثله. {cite:muwatta-maruf-1997 p.235} {cite:muwatta-maruf-1997 p.236}"
  tr: "Malik, bir adamın başka bir adama kâr paylaşımı (kırad) için para verdiğini ve diğerinin kâr elde ettiğini şöyle anlatmıştır: İşçi, \"Bu anlaşmaya, kârın üçte ikisini almam şartıyla girdim\" demiştir. Parayı alan kişi ise, \"Bu anlaşmaya, kârın üçte birini alman şartıyla girdim\" demiştir. Malik şöyle buyurmuştur: İşçinin sözü, eğer söylediği şey yaygın bir kâr paylaşımı anlaşmasına benziyorsa ve insanların genellikle yaptığı bir şeye benziyorsa kabul edilir ve bu konuda yemin etmesi gerekir. Ancak, alışılmadık bir şey, bu tür anlaşmalarda yaygın olarak yapılmayan bir şey söylerse, ona inanılmaz ve konu benzer bir kâr paylaşımı anlaşmasına geri döner. {cite:muwatta-maruf-1997 s.235} {cite:muwatta-maruf-1997 s.236}"
  id: "Malik berkata tentang seorang pria yang memberikan uang kepada pria lain untuk perjanjian bagi hasil (qirad), dan pria yang terakhir memperoleh keuntungan. Pekerja itu berkata, \"Saya membuat perjanjian ini dengan Anda dengan syarat saya menerima dua pertiga dari keuntungan.\" Pemilik uang itu berkata, \"Saya membuat perjanjian ini dengan Anda dengan syarat Anda menerima sepertiga.\" Malik berkata: Pernyataan pekerja itu diterima, dan dia harus bersumpah untuk itu, jika apa yang dia katakan serupa dengan perjanjian bagi hasil yang umum dan serupa dengan apa yang biasa dilakukan orang. Namun, jika dia menyampaikan sesuatu yang tidak biasa, sesuatu yang tidak umum dilakukan dalam perjanjian semacam itu, dia tidak dipercaya, dan masalah tersebut dikembalikan ke perjanjian bagi hasil yang serupa. {cite:muwatta-maruf-1997 p.235} {cite:muwatta-maruf-1997 p.236}"
