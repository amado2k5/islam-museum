text: |-
  ٥٨٠
  جنون يصيبه فى الاوقات فسح صدره ود عاله فمع ثعة فرج من جوفه جروأسود قال أبوزيد
  تع التى"من فيه انتعاعاو كذلك الدم من الانف والجرح ثلع ثلعت رأسه أثلعه ثلعا
  أى شدخته والمثلع المشدخ من البسر وغيره
  صل الجيم دع الجدع قطح الانف وقطع الاذن أيضا وقطع اليدوالشفة
  تقول منه جدعنه فهو أجدع بين الجدع والانتى جدعاء والجدعة مابن منه بعد القطع
  وجدعته أى سجنته وجسته وبالذال أيضا والجادعة المخاصمة ومنه قول الشاءر
  وجوه قرود تة: فى من تجادع وكذلات التجادع يقال تركت البلاد تجادع أفاعيها أى يأكل
  بعضها بعضا وصبىّ جدع-ي الغذاء وقد ج-دع بالسكسرجدعا وأجدعته اذا أسأت غذاه.
  قال أوس جن حبر
  وذات هدم عارنواشرها * تصمت بالماء تولباجدعا
  ورواه المفضل بالذال المهعمة فردّ عليه الاصمعى وجداع السنة الشديدة التى تجدع بالمال
  أى تذهببه قال الناعر لقداليت أغدرفى جداع • وانمنيت أمات الرباع
  والجدع من النبت ما أكل أعلاه وكلاً جداع بالضم أى دو قال الشاءر
  وغب عدوّتى كلا جداع وجدعه تجديم أى قال له جد عالد وحار مجدع أى مقطوع
  الاذن وأماقول ذى الارق الطهوى
  أنانى كلام التغلبى بن ريسق * ففى أت هذاويله يتترع
  يقول اللخما وأبغض العجم ناطقا • الح ر ناصوت الهار اليجدّع
  فان الاخفس يقول أراد الذى يجدع كاتقول هو البضربك تريده والذِّى يضر بك وهو من
  أبيات الكتاب وقال أبو بكر بن السراج لما احتاج إلى رفع القافية قلب الاسم فعلاوهو من
  أفبح ضرورات الشعر والجنادع الاحناش وبقال هى جنادب تسكون فى بجرة البرابيع
  والضباب يخرجن اذادنا الحافر من قعر الجر ومنه قيل رأيت جمادع الشر أى أوا اله
  ( الواحدة جندعة وهو مادبة من الشرّ وذات الجنادع الداهية وعبد اللّه بن جدعان
  ⁦( جذع)⁩، المذع قبل النق" والجمع جذعان وجداع والاتى جذعة والمع جذعات تقول
  منه لولد الشاة هى السنة الثانية وأولد البقر والحافر فى السنة الثالثة وللابل فى السنة
  انلخامسة أجذع والجذع اسم له فى زمن ايسبسن تنبت ولا تسقط وقد قيل فى ولد النعجة انه
  يجذع فى ستة أشهرا وتسعة اشهر وذلك جائز فى الاضحية والازلم الجذع الد هرقال لقبط بن
  معمر الايادى
  ياقوم يضسكم لا تفضنّ بها • انى أخاف عليها الازلم الجذعا
  واماقول الشاعر
  التى على يديه الازلم الجذع فيقال الدهرديقال الاسد وقولهم
  فلان فى هذا الاحر جذع اذا كان أخذفيه حديشا وجذعت الدابة حبسبتها على غير علف
  ومنه قول العجاج
  كانه من طول جذع العفس • ورملان انلهس بعد انلمس • ينعت من اقطاره بفأس
  وأجذعته مهنته وبالدال أيضاغير معجمة والجذع واحد جذوع النخل وجذع ايصااسم
  رجل وفى المثل خذمن جذع ما أعطالُ وأصل أنه كان أعطلى بعض الملول سيفه رهنا فلم
  يأخذه منه وقال اجعلى هذا فى كذا من أمك فضربه به فقتاه والجذعمة الصغسيروفى الحديث
