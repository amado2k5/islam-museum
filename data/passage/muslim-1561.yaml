label:
  ar: "مسلم 1561 — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Muslim 1561 — Pass over My servant: the one who was lenient with debtors"
  ur: "مسلم 1561 — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
text: "حوسب رجل ممن كان قبلكم فلم يوجد له من الخير شىء إلا أنه كان يخالط الناس وكان موسرا فكان يأمر غلمانه أن يتجاوزوا عن المعسر قال قال الله عز وجل نحن أحق بذلك منه تجاوزوا عنه ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1561: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1561: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1561: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
