text: "كتاب السنة - ثني أبي، ثنا أنس بن عياض، حدثني أبو حازم، عن عَمرو بن شُعيب، عن أبيه، عن جَدِّه: أن رسول اللّٰه لِهِ قال : لا يؤمنُ المرءُ حتى يؤمنَ بالقدرِ خيرِه وشرِّه؟.. وقال أبو حازم : لعنَ اللّٰه …"
