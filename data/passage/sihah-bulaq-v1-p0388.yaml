text: |-
  ⁦(فصل القاف)⁩
  ⁦(فعد)⁩
  ٢٥٣
  التضعيف لانه ملحق بفعلل والملحق لايدغم والمع قرادد وقد قالواقراديد كراهية الداليز
  والقردود من الارض مثل القردد وقردودة الظهرماارتفع من نببه ⁦(فرمد)⁩ القرمد
  ضرب من الحجارة يوقد عليها فاذانذج قرمدبه البرل أى طلى قال النابغة
  رابي الجسة بالعبير مقرمد أبو عبيدة القراميدأولاد الوعول الواحدقرمود وأنشد
  لابن أجر * ما أم غفر على دعجاءذى علق • :فى القراميدعنها الاعصم الوقل
  والقرميدالا جروالمع القراءيدوبناءمرمدمبى بالا جرأ والحجارة شد لقشدة
  بالكسر الثقل الذى يبق فى أسفل الربداذ الطبخ مع السويق ليتخذسمنا ⁦(ق صد)⁩ القصه
  اتيان الشءتة ول قصدته وقصدت له وقصدت اليه؟عى وقصدت قصده غحوت غموه وقصدت
  العود قصدا كسرته والقصدة بالكسر القطعة من الذاذا انكسر والجمع قصد يقال
  التناقصد وقد انقصد الرح وتقصدت الرماح تكسرت ورمح أقصاد قال الاخفر هذا أحد
  ماجاءعلى بناء الجمع وتقصد الكاب وغيره أى مات قال لبدد
  نقصدت منها كاب وضرحت • بدم وغودر فى المكربعامها
  وأقصد السهم أى صاب فقتل مكانه وأقصدته حية قتلته قال الاخطال
  فان كنت قد أقصدتى اذرميتى • بسهمك فالرامى يصيدولا يدرى
  أى ولا يختل والقصيد جع القصيدة من الشعر مثل سفين جمع سفينة والقصيد اللحم السابس
  والتاصد القريب يقال بنناويين الماءليلة قاصدة أى هيئة السير لا تعب فيه ولابطء
  والتصدبين الاسراف والتقمير يقال فلان مقتصد فى النفقة وقوله تعالى واقص_د في مشيك
  واقصد بذرعل أى اربع على نفسك والقصد العدل وقال الشاعر
  على الحكم المأتى يومااذاقضى • قضيته أن لا يجوروبقصد
  قال الاخفش أراد و ينبغى أن يقصد فلما حذفه وأوقع يقصدم وقع ينبقى رفعه لوقوعه موقع
  المرفوع وقال الفرا رفعه للمخالفة لان معناه مخالف لملدنخواف بينه-ما فى الاعراب
  ( قعد قعدقع وداومقعدا أى جلس وأفعدد غيره والقعدة المزة الواجدة والفعدة
  بالكسرنوع منه والمقعدة السافلة وذوالقعدة شهر والجمع ذوات القعدة وقعدت
  الرخة جتمت وقعدت الفسيلة صاراهاجذع والقاعد من النخل الذى تثاله اليد والقاعد
  من النساء التى قعدت عن الولد والحيض والجح القواعد والقاعدمن انموارج وابهع
  القعد مثل حارس وحرس ويقال القعد الذين لاديوان اهم والتعد أيضا أن يكون بوظيف
  البعير تطامن واسترخاء وقواعد البيت أساسه وقواعد الهودج خشبات أربع معترضات
  فى أسفله وتقعد فلان عن الامراذالم يطلبه وتقاعد به فلان اذ الم يخرج اليه من حقه
  وتقحدته أى ربنته عن حاجته وعقته و يقسال ما تقعدنى عن الاشغل أى ما حبف ورجل
  قعدة ضجعة أى كثير القسعود والأضطجاع والفسعود من الابل هو البكرحين يركب أى
  يكن ظهره من الركوب وأدقى ذلك أن يأتى عليه سنتان الى أن يثى قاذا أننى سمى جملا
  ولا تكون البكرة قعودا وائماتمكون ق_لوصا قال أبو عبيد القعود من الابل الذى يقتعده
  الراعى فى كل حاجة قال وهو بالفارسية رخت ويتصغيره باء المئسل اتخذوه قعيد الحايات
  ٢٤
