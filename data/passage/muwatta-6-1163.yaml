label: { ar: "الموطأ 1163 — فاطمة بنت المنذر: كانت أسماء بنت أبي بكر بالمزدلفة تأمر من يصلي بها الصبح أن يصلي عند طلوع الفجر، ثم تركب إلى منى ولا تقف", en: "Muwatta 1163", es: "Muwatta 1163", fr: "Muwatta 1163", ur: "موطا 1163", tr: "El-Muvatta 1163 — Fatıma bint el-Mundhir: Esma bint Ebu Bekir, Muzdalifa'dayken orada sabah namazı kılanlara şafak vakti namaz kılmalarını söyler, sonra da Mina'ya gider ve hiç durmazdı.", id: "Al-Muwatta 1163 — Fatima bint al-Mundhir: Asma bint Abi Bakr, ketika berada di Muzdalifah, biasa menginstruksikan orang-orang yang mengerjakan salat subuh di sana untuk salat subuh, kemudian dia akan pergi ke Mina tanpa berhenti." }
summary:
  ar: "تخبر فاطمة بنت المنذر أنها كانت ترى أسماء بنت أبي بكر بالمزدلفة، تأمر من يصلي لها ولأصحابها الصبح حين يطلع الفجر، ثم تركب فتسير إلى منى ولا تقف. {cite:muwatta-maruf-1997 p.525}"
  tr: "Fatıma bint el-Mundhir, Muzdalifa'da Asma bint Ebu Bekir'i gördüğünü, onun birine kendisini ve arkadaşlarını sabah namazına önderlik etmesi için talimat verdiğini, sonra da atına binip hiç durmadan Mina'ya doğru gittiğini rivayet etmiştir. {cite:muwatta-maruf-1997 s.525}"
  id: "Fatima bint al-Mundhir meriwayatkan bahwa ia melihat Asma bint Abi Bakr di Muzdalifah, memberi instruksi kepada seseorang untuk memimpinnya dan para sahabatnya dalam salat subuh, kemudian ia menaiki kudanya dan melanjutkan perjalanan ke Mina tanpa berhenti. {cite:muwatta-maruf-1997 p.525}"
