text: "… بكر الصديق أماماً للصحابة كلهم في الصلاة التي هي أكبر أركان الاسلام العملية. قال الشيخ ابو الحسن الأشعري : وتقديمه له أمر معلوم بالضرورة من دين الاسلام. قال : وتقديمه له دليل على أنه أعلم الصحابة وأقرؤهم لما ثبت في …"
