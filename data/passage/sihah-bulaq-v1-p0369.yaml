  والجذاذات القراضات والاتذاذالانقطاع قال الفراء يقال رحم جداء وحدّاء بالجيم
  والحاء٢دودان وذلك اذالم بوصل وماعاه جذة أفئمن الشاب والج ذيذة السويق
  ( برذ الجرذ بالتحريك كل ماحدث فى عرقوب الدابة من تزيدا وانتفاخ عصب والجرذ
  ضرب من الفأروابمع الجرذان وأرض جرذة ذات يرذان أبو عييد رجل مجرذاذا كان
  مجرّيافى الاسود ⁦(ÜŸجاذ)⁩ الجلذاء بالكسر مدود الارض الفلينة والجلداءة أخص
  منهاوقولهم أسهل من جلدّات وهوحى قريب من الطائف ليز مسستوكاراحة والجلذى
  بالضم من الابل التديد الغليظ قال الراجز
  صوّى لها ذا كدنة جلذيا • أخيف كانت أمه صفيا
  والناقة جلدية قال علقمة جلذية كاتان القمل علكوم والجلدى أيضا ال
  السريع قال الرابزابن ميادة لتقربن تقرباجلذيا واجلوذبهم السيراجلواذا أى
  دام مع السرعة وهو من سير الايل
  ( صل الماء حذذ الحذد خفة الذنب بعبر أحدّوة طاة حداء وهى التى خف
  ريس ذنيها ورجل أحدبين الحذذأى خفيف اليد قال الفرزدق يهجيوعمر بن هبيرة
  أوليت العراق ورافديه • فزار يا احذيد القميص
  واليمين الخذاء التى يحلف صاحبها يسرعدة ومن قالها بالجيم يدّهب الى أنه جذها جدالعبه
  الصلياتة ورحم حذاء وجذاء عن الفراء اذالم توصل والمذذ فى العروض من باب الكامل
  اسقاط الوتدمن عجز متفاعلن فيبق متقافينقل الى خعلن والقصيدة حذاء وقرب حذساذ
  أى سريع متسل حتحات ⁦(حنذ)⁩ حنذت الشاة أحنذها حنذا أى شويتها وجعات
  فوقه اسيارة عجماة لتنضيمها فهى حيذ وحتدّت الفرس أحنده حنذار« وأن تحضر سوطا
  أوسوطن تم تظاهر عله الخلال فى الشمس لمعرق فه ومحتوذ وحقدذفان لم يعرق قيل بكاومنا
  قولهم اذاسقيت فاحفذ أى عرّق شرايك أى صب فيه قلسل ما والحتدشدة الخرّواحراه
  قال الهجاح يصف مجاراواتانا
  ورهبا من حنذه أن يهرجا يقال حنذته الشمس
  أى أحوقته وحتذ بالتحريك موضع قريب من المدينة قال الرابو
  تتأبرى يا خيرة الفسيل • تأبرى من حنذ فشول • اذضن أهدل النخفل بالفعول
  ( وذ الموذ السوق السريع تقول حدّت إلابل أحوذها حوذا وأحوذتهامن-ل
  والاحوذىّ الخفيف فى النى لحذقه عن أب عرو وقال الشاءر يصف جناي قطاة
  على أحوذيين استقلت عليهما وقال آخر
