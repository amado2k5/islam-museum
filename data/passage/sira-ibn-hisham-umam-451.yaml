text: "… نزله. قال ابن هشام: واسْتَعْمَلَ على المدينة عَبْدَ اللهِ بْنَ عبداللهِ بْنِ أَبَيِّ ابْنِ سَلُولَ الأنصاريَّ. قال ابن إسحاق: فأقام عليه ثمانِيَ ليالٍ ينتظر أبا سفيان، وخرج أبو سفيان في أهل مَكَّةَ حتى نزل مَجَنَّةَ من ناحية الظَّهْرَانِ، وبعضُ الناس …"
