text: "رة لحصاره، ورجع وبعث إليه حفص يستأمنه فأمنه، وأعاظمهم: وجدت في كتاب مطريوس العالم عن دانيال النبي أنهم أيوب فحاصرها وقتل مطرف في أول جولة عليها، وقتل معه أتعبت عبد الرحمن الداخل سبع سنين، وانتقضت على هشام يونس بن عبد"
