label: { ar: "الموطأ 329 — مالك: من أوتر أول الليل ثم قام صلى مثنى مثنى", en: "Muwatta 329", es: "Muwatta 329", fr: "Muwatta 329", ur: "موطا 329", tr: "El-Muvatta 329 — Malik: Gecenin başında vitr namazını kılan, sonra kalkıp ikişer rekat namaz kılan kimse...", id: "Al-Muwatta 329 — Malik: Barangsiapa yang mengerjakan shalat Witir di awal malam, kemudian bangun dan mengerjakan shalat dua rakaat berturut-turut..." }
summary:
  ar: "قول لمالك في باب الأمر بالوتر: من أوتر أول الليل ثم نام ثم قام فبدا له أن يصلي فليصل مثنى مثنى ولا يعيد الوتر، وهو أحب ما سمع إليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.184}"
  tr: "Malik, Vitr namazı kılınmasıyla ilgili olarak şöyle buyurmuştur: “Kim gecenin başında Vitr namazını kılar, sonra uyur, sonra uyanır ve namaz kılmaya karar verirse, iki rekat kılsın ve Vitr namazını tekrarlamasın.” Bu, duyduğu en yaygın görüştür. Araştırmacı, bunu Malik'ten Ebu Mus'ab ve Suveyd'in rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.184}"
  id: "Malik berkata mengenai perintah shalat Witir: “Barang siapa yang shalat Witir di awal malam, kemudian tidur, lalu bangun dan memutuskan untuk shalat, maka hendaklah ia shalat dua rakaat sekaligus dan tidak mengulangi shalat Witir.” Ini adalah pendapat yang paling disukai yang pernah didengarnya. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.184}"
