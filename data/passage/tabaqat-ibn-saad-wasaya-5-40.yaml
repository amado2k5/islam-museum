text: "… بن مَخْلَد أَبو هاصم الشيبانى النبيل قال : حدّثنا حَبْوَة ابن شريح قال ! حدِّثنا يزيد بن أَبى حبيب عن ابن شِماسة المَهْرىّ قال : حضرها عمرو بن العاص وهو فى سياقة الموت فحوّل وجهه إلى الحائط، يبكّى طويلًا وابنه …"
