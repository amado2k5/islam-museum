label: { ar: "سنن ابن ماجه 1328 — محو السيئات وحط الخطايا، مغفرة ما تقدم من الذنب", en: "Sunan Ibn Majah 1328 — bad deeds erased and sins shed; forgiveness of past sins", ur: "سنن ابن ماجہ 1328 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا، پچھلے گناہوں کی مغفرت" }
text: "… كِلاَهُمَا عَنِ النَّضْرِ بْنِ شَيْبَانَ، قَالَ لَقِيتُ أَبَا سَلَمَةَ بْنَ عَبْدِ الرَّحْمَنِ فَقُلْتُ حَدِّثْنِي بِحَدِيثٍ، سَمِعْتَهُ مِنْ، أَبِيكَ يَذْكُرُهُ فِي شَهْرِ رَمَضَانَ. قَالَ نَعَمْ. حَدَّثَنِي أَبِي أَنَّ رَسُولَ اللَّهِ ـ ذَكَرَ شَهْرَ رَمَضَانَ فَقَالَ \" شَهْرٌ كَتَبَ اللَّهُ عَلَيْكُمْ صِيَامَهُ وَسَنَنْتُ لَكُمْ قِيَامَهُ فَمَنْ صَامَهُ وَقَامَهُ إِيمَانًا وَاحْتِسَابًا خَرَجَ مِنْ ذُنُوبِهِ كَيَوْمَ وَلَدَتْهُ أُمُّهُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1328، يذكر محو السيئات وحط الخطايا، ومغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1328 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of bad deeds erased and sins shed, forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1328، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا، پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
