text: "… تقع. - تجنّب كثرة السؤال وَعُضَلِ المسائل، ففي الحديث : إن اللّهَ كره لكم قيل وقال وكثرة السؤالِ، وإضاعة المال، وعنه : إن اللّٰه فَرِضٍ فرائض فلا تضيعُوها وحدَّ حُدُوداً فلا تعْتَدُوها، وحرَّم أشياء فلا تنتهيكُوها، وسكت عن أشياء رحمةً …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 15، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، والفرض، وما كرهه الله للناس، وما سُكت عنه فهو عفو، وما حرّم الله ورسوله، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 15, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, the obligatory (fard), what God disliked for people, what was passed over in silence and so pardoned, what God and His Messenger forbade, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 15 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، فرض، جو اللہ نے لوگوں کے لیے ناپسند کیا، جس سے سکوت کیا گیا وہ معاف ہے، جو اللہ اور اس کے رسول نے حرام کیا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 4, p. 15, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), ce que Dieu a réprouvé pour les gens, ce qui fut passé sous silence et donc pardonné, ce que Dieu et Son Messager ont interdit, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 4, p. 15, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), lo que Dios reprobó para la gente, lo que se pasó en silencio y quedó dispensado, lo que Dios y Su Mensajero prohibieron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 4. cildinin 15. sayfasından bir alıntı, farz olan fiiller ve görevler, Allah ve Resulü'nün emrettiği şeyler, Allah'ın insanlar için hoşlanmadığı şeyler, sessiz kaldığı (ve izin verilen) şeyler, Allah ve Resulü'nün yasakladığı şeyler ve hoş karşılanmayan şeyler hakkında bilgi vermektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, hoş karşılanmayan fiiller, yasak olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 4, halaman 15, membahas tentang amalan dan kewajiban yang wajib, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, apa yang tidak disukai Allah bagi manusia, apa yang tidak Dia sebutkan (yang diperbolehkan), apa yang dilarang oleh Allah dan Rasul-Nya, dan apa yang tidak disukai. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
