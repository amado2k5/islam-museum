text: "… إلى الدنيا، وزعم أن عنده كذا وكذا ألف حديث عن رسول اللّٰه عليغ لم ينطق بها. وقد قال الإمام أحمد عنه : تركه يحيى بن معين، وعبد الرحمن بن مهدي، وقال النسائي : متروك، وضعفه العقيلي، وجرحه ابن حبان، والعجلي. …"
