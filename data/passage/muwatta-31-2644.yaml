label: { ar: "الموطأ 2644 — جابر بن عبد الله: النبي يأمر من ضيع ثوبيه بلبسهما في غزوة بني أنمار", en: "Muwatta 2644", es: "Muwatta 2644", fr: "Muwatta 2644", ur: "موطا 2644", tr: "El-Muvatta 2644 — Cabir ibn Abdullah: Peygamber, iki elbisesini kaybedene, Beni Anmar Savaşı sırasında onları giymesini emretti.", id: "Al-Muwatta 2644 — Jabir ibn Abdullah: Nabi memerintahkan orang yang kehilangan dua pakaiannya untuk memakainya saat Perang Banu Anmar." }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن جابر بن عبد الله الأنصاري أنه قال: خرجنا مع رسول الله في غزوة بني أنمار، فبينا أنا نازل تحت شجرة إذا رسول الله، فقلت: هلم إلى الظل. فنزل، فقمت إلى غرارة لنا فالتمست فيها فوجدت جرو قثاء، فكسرته وقربته إلى رسول الله، فقال: من أين لكم هذا؟ قلت: خرجنا به من المدينة. وعندنا صاحب لنا نجهزه يذهب يرعى ظهرنا، فجهزته، فأدبر يذهب في الظهر وعليه بردان قد خلقا، فنظر إليه رسول الله فقال: أما له ثوبان غير هذين؟ قلت: بلى، له ثوبان في العيبة كسوته إياهما، فقال: فادعه فمره فليلبسهما. فدعوته فلبسهما، ثم ولى يذهب، فقال رسول الله: ماله ضرب الله عنقه، أليس هذا خيرا؟ فسمعه الرجل فقال: يا رسول الله في سبيل الله، فقال: في سبيل الله. فقُتل الرجل في سبيل الله. ويذكر المحقق قول يحيى بن معين إن زيد بن أسلم لم يسمع من جابر، فالرواية عنده مرسلة، ونقل ابن حبان وابن عبد البر قولا بالسماع. {cite:muwatta-maruf-1997 p.496} {cite:muwatta-maruf-1997 p.497}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari Jabir ibn Abdullah al-Ansari, yang berkata: Kami pergi bersama Rasulullah shalla Allahu alaihi wa sallam dalam ekspedisi melawan Bani Anmar. Ketika aku beristirahat di bawah pohon, Rasulullah shalla Allahu alaihi wa sallam muncul. Aku berkata, \"Mari duduk di bawah naungan pohon.\" Beliau turun, dan aku pergi ke karung kami dan mencari-cari di dalamnya. Aku menemukan mentimun, membelahnya, dan membawanya kepada Rasulullah shalla Allahu alaihi wa sallam. Beliau bertanya, \"Dari mana kamu mendapatkan ini?\" Aku menjawab, \"Kami membawanya dari Madinah. Kami memiliki seorang sahabat yang sedang kami persiapkan untuk pergi menggembalakan ternak kami.\" Aku mempersiapkannya, dan dia berbalik untuk pergi menggembalakan ternak, mengenakan dua jubah usang. Rasulullah shalla Allahu alaihi wa sallam memandanginya dan berkata, \"Bukankah dia memiliki dua pakaian lain selain ini?\" Aku berkata, \"Ya, dia memiliki dua pakaian di dalam tas pelana, dan aku memberikannya kepadanya.\" Beliau berkata, \"Panggil dia dan suruh dia memakainya.\" Maka aku memanggilnya, dan dia memakainya. Kemudian dia berbalik untuk pergi, dan Rasulullah shalla Allahu alaihi wa sallam bersabda, \"Apa yang salah dengannya? Semoga Allah merenggut nyawanya! Bukankah ini lebih baik?\" Orang itu mendengarnya dan berkata, \"Wahai Rasulullah, demi Allah!\" Beliau bersabda, \"Demi Allah.\" Dan orang itu gugur demi Allah. Peneliti menyebutkan pernyataan Yahya bin Ma'in bahwa Zaid bin Aslam tidak mendengar dari Jabir, sehingga riwayat tersebut dianggap mursal (riwayat dengan mata rantai transmisi yang hilang) menurutnya. Namun, Ibnu Hibban dan Ibnu Abd al-Barr melaporkan pernyataan bahwa dia memang mendengar darinya. {kutip:muwatta-maruf-1997 hal.496} {kutip:muwatta-maruf-1997 hal.497}"
