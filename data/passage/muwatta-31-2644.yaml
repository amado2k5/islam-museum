label: { ar: "الموطأ 2644 — جابر بن عبد الله: النبي يأمر من ضيع ثوبيه بلبسهما في غزوة بني أنمار", en: "Muwatta 2644" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن جابر بن عبد الله الأنصاري أنه قال: خرجنا مع رسول الله في غزوة بني أنمار، فبينا أنا نازل تحت شجرة إذا رسول الله، فقلت: هلم إلى الظل. فنزل، فقمت إلى غرارة لنا فالتمست فيها فوجدت جرو قثاء، فكسرته وقربته إلى رسول الله، فقال: من أين لكم هذا؟ قلت: خرجنا به من المدينة. وعندنا صاحب لنا نجهزه يذهب يرعى ظهرنا، فجهزته، فأدبر يذهب في الظهر وعليه بردان قد خلقا، فنظر إليه رسول الله فقال: أما له ثوبان غير هذين؟ قلت: بلى، له ثوبان في العيبة كسوته إياهما، فقال: فادعه فمره فليلبسهما. فدعوته فلبسهما، ثم ولى يذهب، فقال رسول الله: ماله ضرب الله عنقه، أليس هذا خيرا؟ فسمعه الرجل فقال: يا رسول الله في سبيل الله، فقال: في سبيل الله. فقُتل الرجل في سبيل الله. ويذكر المحقق قول يحيى بن معين إن زيد بن أسلم لم يسمع من جابر، فالرواية عنده مرسلة، ونقل ابن حبان وابن عبد البر قولا بالسماع. {cite:muwatta-maruf-1997 p.496} {cite:muwatta-maruf-1997 p.497}"
