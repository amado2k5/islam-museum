text: "… فيهم، وإبعاده عن الانعقاد، وتعريضه للتحلّل، ومن ذلك أنها تدرّ وتحرّك الأخلاط إلى غير جهة العروق، ومنها أنها تفيد الدم كيفية حادة غير حبيبة إلى القوة الجاذبة. والأدوية الملطفة في أكثر الأمر هي الأدوية المستعملة في أوجاع المفاصل، وهي القوية …"
