text: "… فيهم، وإبعاده عن الانعقاد، وتعريضه للتحلّل، ومن ذلك أنها تدرّ وتحرّك الأخلاط إلى غير جهة العروق، ومنها أنها تفيد الدم كيفية حادة غير حبيبة إلى القوة الجاذبة. والأدوية الملطفة في أكثر الأمر هي الأدوية المستعملة في أوجاع المفاصل، وهي القوية …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 389، يذكر الوجع، والبيمارستان وصناعة الطب، وأعضاء البدن، والعروق، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 389, that mentions pain, the hospital and the medical craft, the organs of the body, the vessels, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 389 کا اقتباس جس میں درد، بیمارستان، اعضائے بدن، رگیں، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 389, que menciona el dolor, el hospital y la práctica médica, los órganos del cuerpo, los vasos sanguíneos y los medicamentos; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 389, qui mentionne la douleur, l'hôpital et l'art médical, les organes du corps, les vaisseaux, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 389. sayfasından, ağrı, hastane, tıp mesleği, vücut organları, damarlar ve ilaçtan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 389, yang menyebutkan rasa sakit, rumah sakit, profesi medis, organ tubuh, pembuluh darah, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
