  والاسم العزلة يقال العزلة عبادة والاعزل الذى لاسلاح معه وقوم عزل وعزلان وعزل
  بالتشديد وسمى أحد السمبا كين الاعزل كأنه لاسلاح معه كما كان مع الرامح والاعزل من
  الخيل الذى يقع ذنيه فى جانب وذللن عادة لاخلقة وهو عيب والاعزل سحاب لامطرفيه
  والاعزلة موضع والعزلاءفم المزادة الاسفل والهع العزالى بكسر اللام وان شئت فتهت مثل
  الصمارى والصحارى والعذارى والمذارى قال الكميت
  مر ته الجذوب فماا كفهرحات ءزاله الشمال.
  وعزله أى أفرزه يقال أنا عن هذا الامر بعزل وقاله ١ .
  ولست بجاب جلب ريح وقزة • ولا بصفاصلد عن الخير معزل
  وعزله عن العسمل أى نهاه عنه فعزل وعزل من أمته والمعزال الذى يعتزل بماشيته وبرعاها
  بمعزل من الناس وأنتد الاصمى.
  اذا الهدف المعزال صوّب رأسه • وأعجبه ضفو من الثلة الخطل.
  وابهع المعاذيل وقال آخر
  اذ أشرف الديك يدء وبعض أسرنه * الى الصباح وهم قوم معازيل
  والمعازيل أيضا القوم الذين لارماح معهم قال الكميت
  ولسكنكم حى معازيل حسوة * ولا يمنع الجيرات باللوم والعذل
  والمعزال الضعيف الاحق والمعزال الذى يعتزل أحل الميسرلؤما زهل العزاهيل الابل
  المهملد الواحدعرّ هول والعزهل الذكر مِن الهام سل لعسل يذكرويؤنت تقول منه
  عسلث الطعام أعسله وأءله أى عمته بالعسل وزنجبيل معدل أى معمول بالعسل وأاماسل
  الذى يأخذ العسل من بيت التهل وقال ليد • وأرى دبور شاره النحل عاسل * أى من التحل
  وخلية عاسلة والتحل عسالة ويقال مالفلان مضرب عسلة يعسنى من النسب وما أعرف له
  مضرب عسلة يعنى أجراقه وعسلى اليهود علامتهم وفى الجماع العسيلة شبهت تللذ اللذة
  بالعسل وصغرت بالهاءلات الغالب على العسل التأنيث، ويقال انما أنث لانه أريذيه العسله
  وهى القطعة منه كمايقال للقطعة من الذهب ذهبة والعسيل مكنسة العطار ائلتى يجمع بجا
  العطر وقال قرشى بخير لا أكونن ومدحتى * كلحت يوماصخرة بعسيل
  أراد كتاحت صحرة يوما فحال بين المصاف والمضاف اليه لات الوقت عندهم كالقضل
  فى الكلام والعسسيل قضيب الفيل ويقال جاؤايستعسلون أى يطلبون العسل وعسلتهم
  عيلا أى زودتهم العسل والعلى والعلان الخبيه يقال عسل الذتب يع-ل علا
  وعسلانا اذا أعمق وأسرع وكذات الانسان وفى الحديث كذب علين الصل أى عليك
  بسرعة المشى وقال التابغة الجعدة
  عسلان الذتب أمبى قاريا • برد الليل عليه فنسل
