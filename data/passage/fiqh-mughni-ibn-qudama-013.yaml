text: "ية عنده بحق لرجل على آخر، ولم يحكم به، قيسآله صاحب الحق أن يكتب له كتابا بما حصل عنده، فإنه يكتب له أيضا. قال القاضي: ويكون في كتابه: شهد عندي فلان وفلان بكذا وكذا. ليكون المكتوب إليه هو الذي يقضي"
