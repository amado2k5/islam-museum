text: "… قَالَ حَدَّثَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ إِنَّ رَسُولَ اللَّهِ قَالَ \" لاَ عَدْوَى \". قَالَ أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ سَمِعْتُ أَبَا هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" لاَ تُورِدُوا الْمُمْرِضَ عَلَى الْمُصِحِّ \". وَعَنِ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي سِنَانُ بْنُ أَبِي سِنَانٍ الدُّؤَلِيُّ، أَنَّ أَبَا هُرَيْرَةَ ـ قَالَ إِنَّ رَسُولَ اللَّهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5773، يذكر العدوى، والصحة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5773, that mentions contagion, health. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5773، جس میں چھوت، صحت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
