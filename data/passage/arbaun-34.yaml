text: "من رأى منكم منكراً فليغيره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان"
summary:
  ar: "حديث أبي سعيد الخدري قال: سمعت رسول الله يقول: «من رأى منكم منكراً فليغيره بيده فإن لم يستطع فبلسانه فإن لم يستطع فبقلبه وذلك أضعف الإيمان» — وهو الحديث الرابع والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (49) من رواية قيس بن مسلم عن طارق بن شهاب عن أبي سعيد ومن رواية إسماعيل بن رجاء عن أبيه عن أبي سعيد، وفي حديث طارق أن سببه ما روي عن أبي سعيد أن مروان بدأ بالخطبة يوم العيد قبل الصلاة فقام إليه رجل فقال الصلاة قبل الخطبة فقال قد ترك ما هنالك فقال أبو سعيد أما هذا فقد قضى ما عليه ثم روى هذا الحديث؛ وروي معناه من حديث ابن مسعود عند مسلم «ما من نبي بعثه الله في أمة قبلي إلا كان له من أمته حواريون وأصحاب يأخذون بسنته ويقتدون بأمره ثم إنه يخلف من بعدهم خلوف يقولون ما لا يفعلون ويفعلون ما لا يؤمرون فمن جاهدهم بيده فهو مؤمن ومن جاهدهم بلسانه فهو مؤمن ومن جاهدهم بقلبه فهو مؤمن وليس وراء ذلك من الإيمان حبة خردل» — فجعل اليد واللسان والقلب مراتب لتغيير المنكر بحسب الاستطاعة ونهايتها عند القلب أضعف الإيمان ⁦(جامع العلوم والحكم ص 698–709)⁩."
  en: "The hadith of Abu Sa'id al-Khudri that he heard the Messenger of God say 'whoever of you sees an evil let him change it with his hand; if he cannot, then with his tongue; if he cannot, then with his heart — and that is the weakest of faith' — the thirty-fourth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Muslim (49) through Qays ibn Muslim from Tariq ibn Shihab from Abu Sa'id and through Isma'il ibn Raja' from his father from Abu Sa'id; Tariq's route reports its occasion — Marwan began the Eid sermon before the prayer, a man stood to him saying 'the prayer before the sermon', and when he answered 'what is there has been left', Abu Sa'id said 'as for him, he has fulfilled what was upon him' and narrated this hadith; the meaning also comes in Ibn Masud's report in Muslim: 'there was no prophet God sent in a community before me without his having disciples and companions who took to his sunna and followed his command, then after them successors come who say what they do not do and do what they are not commanded — whoever struggles against them with his hand is a believer, whoever with his tongue is a believer, whoever with his heart is a believer, and beyond that there is not a mustard-seed of faith' — so hand, tongue and heart are the grades of changing evil by ability, ending at the heart, which is the weakest of faith (Jami' al-Ulum wal-Hikam pp. 698–709)."
  es: "El hadiz de Abu Sa'id al-Khudri que oyó al Mensajero de Dios decir 'quien de vosotros vea un mal que lo cambie con su mano; si no puede, entonces con su lengua; si no puede, entonces con su corazón —y esa es la fe más débil'— el trigésimo cuarto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, transmitido por Muslim (49) a través de Qays ibn Muslim de Tariq ibn Shihab de Abu Sa'id y a través de Isma'il ibn Raja' de su padre de Abu Sa'id; la ruta de Tariq informa su ocasión: Marwan comenzó el sermón del Eid antes de la oración, un hombre se paró frente a él diciendo 'la oración antes del sermón', y cuando respondió 'lo que hay ha quedado pendiente', Abu Sa'id dijo 'en cuanto a él, ha cumplido lo que tenía que cumplir' y narró este hadiz; El significado también aparece en el relato de Ibn Masud en Muslim: «No hubo ningún profeta enviado por Dios en una comunidad antes de mí sin que tuviera discípulos y compañeros que adoptaran su sunna y siguieran su mandato; luego, después de ellos, vienen sucesores que dicen lo que no hacen y hacen lo que no se les ordena. Quien lucha contra ellos con su mano es creyente, quien lucha con su lengua es creyente, quien lucha con su corazón es creyente, y más allá de eso no hay ni una pizca de fe». Así pues, la mano, la lengua y el corazón son los grados de transformación del mal mediante la capacidad, culminando en el corazón, que es el más débil de la fe (Jami' al-Ulum wal-Hikam, págs. 698-709)."
  fr: "Le hadith d'Abu Sa'id al-Khudri selon lequel il a entendu le Messager de Dieu dire: « Quiconque parmi vous voit un mal, qu'il le change de sa main; s'il ne le peut, alors avec sa langue; s'il ne le peut, alors avec son cœur — et c'est le plus faible de la foi » — le trente-quatrième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, transmis par Muslim (49) par Qays ibn Muslim de Tariq ibn Shihab d'Abu Sa'id et par Isma'il ibn Raja' de son père d'Abu Sa'id; la voie de Tariq rapporte son occasion — Marwan a commencé le sermon de l'Aïd avant la prière, un homme s'est levé vers lui en disant « la prière avant le sermon », et quand il a répondu « ce qui restait a été laissé », Abu Sa'id a dit « quant à lui, il a accompli ce qui lui incombait » et a rapporté ce hadith; Cette signification apparaît également dans le récit d'Ibn Masud rapporté par Muslim: « Il n'y a pas eu de prophète que Dieu ait envoyé dans une communauté avant moi sans qu'il ait eu des disciples et des compagnons qui aient adopté sa sunna et suivi son commandement. Puis viennent après eux des successeurs qui disent ce qu'ils ne font pas et font ce qui ne leur est pas commandé. Quiconque lutte contre eux par la main est croyant, quiconque par la langue est croyant, quiconque par le cœur est croyant, et au-delà, il n'y a pas la moindre parcelle de foi. » Ainsi, la main, la langue et le cœur sont les degrés de la capacité à combattre le mal, le dernier degré étant le cœur, qui est le plus faible des degrés de foi (Jami' al-Ulum wal-Hikam, p. 698-709)."
  ur: "ابو سعید خدری سے روایت ہے کہ انہوں نے رسول اللہ کو فرماتے ہوئے سنا کہ تم میں سے جو کوئی برائی دیکھے اسے اپنے ہاتھ سے بدل دے۔ اگر وہ نہیں کر سکتا تو اپنی زبان سے۔ اگر وہ ایسا نہ کر سکے تو اپنے دل سے - اور یہ ایمان کا کمزور ترین ہے\" - النووی کی چالیسویں اور ابن رجب کی تفسیر کی چونتیسویں، جو مسلم (49) نے قیس بن مسلم کے ذریعے طارق بن شہاب سے ابو سعید سے اور اسماعیل بن راجا کے ذریعے ابو سعید سے اور اسمٰعیل بن راجا کے ذریعے ابو سعید سے نقل کی ہے۔ طارق کا راستہ اس کا واقعہ بیان کرتا ہے - مروان نے نماز سے پہلے عید کا خطبہ شروع کیا، ایک آدمی اس کے پاس کھڑا ہوا 'خطبہ سے پہلے کی نماز'، اور جب اس نے جواب دیا 'جو باقی رہ گیا ہے'، تو ابوسعید نے کہا، 'جو کچھ اس پر تھا، اس نے پورا کر دیا' اور یہ حدیث بیان کی۔ یہ معنی مسلم میں ابن مسعود کی روایت میں بھی آتا ہے: ’’مجھ سے پہلے کسی امت میں اللہ تعالیٰ نے ایسا کوئی نبی نہیں بھیجا جس کے حواری اور صحابی نہ ہوں جنہوں نے اس کی سنت کو اپنایا اور اس کے حکم کی پیروی کی، پھر ان کے بعد ایسے جانشین آئے جو کہتے ہیں کہ وہ کیا نہیں کرتے اور وہ کرتے ہیں جس کا ان کو حکم نہیں ہے، جو ان کے خلاف ہاتھ سے جہاد کرے وہ مومن ہے، جو اپنے دل اور زبان سے ایمان لائے، وہ مومن ہے۔ ایمان کی رائی کا دانہ نہیں ہے - لہٰذا ہاتھ، زبان اور دل برائی کو قابلیت سے بدلنے کے درجات ہیں، جس کا خاتمہ دل پر ہوتا ہے، جو ایمان کا کمزور ترین ہے ⁦(جامع العلوم والحکم صفحہ 698-709)⁩۔"
  tr: "Ebu Said el-Hudri'nin hadisi şöyledir: \"Allah Resulü'nün şöyle buyurduğunu işittim: 'Sizden kim bir yanlış görürse, onu eliyle düzeltsin; eğer bunu yapamıyorsa diliyle; eğer bunu da yapamıyorsa kalbiyle düzeltsin. İşte bu, imanın en zayıfıdır.'\" — Bu hadis, el-Arba'in el-Nawawiyya'da ve İbn Receb'in tefsirinde otuz dördüncü hadistir; Müslim (49), Kays bin Müslim'den, o da Tarık bin Şihab'dan, o da Ebu Said'den, o da İsmail bin Reca'dan, o da babasından, o da Ebu Said'den rivayet etmiştir. Tarık'ın hadisinde bunun sebebi, Ebu Said'den rivayet edilen şu olaydır: Mervan, bayram günü namazdan önce hutbeye başlardı. Bunun üzerine bir adam ayağa kalkıp şöyle dedi: \"Namaz hutbeden önce kılınır.\" Bunun üzerine şöyle dedi: \"O, orada olanı bıraktı.\" Ebu Said dedi ki: \"Buna gelince, ondan isteneni yerine getirdi.\" Sonra şu hadisi rivayet etti; anlamı İbn Mesud'un Müslim'deki hadisinde şöyle geçmektedir: \"Benden önce Allah'ın bir ümmete gönderdiği hiçbir peygamber yoktur ki, ümmetinden sünnetine uyan ve emirlerine itaat eden müritleri ve arkadaşları olmasın. Sonra onlardan sonra, yapmadıklarını söyleyen ve emredilmeyeni yapan halefler gelir. Kim onlarla eliyle mücadele ederse mümin olur, kim diliyle mücadele ederse mümin olur, kim kalbiyle mücadele ederse mümin olur; bundan sonra hardal tanesi kadar bile iman yoktur.\" — Böylece, gücü yeteneğe göre yanlışı düzeltmek için eli, dili ve kalbi birer seviye kıldı; işin sonu ise imanın en zayıfı olan kalptedir. (Cami' el-Ulum ve el-Hikam, s. 698-709)"
  id: "Hadits Abu Saeed al-Khudri, yang berkata: Aku mendengar Rasulullah SAW bersabda: “Barangsiapa di antara kalian melihat sesuatu yang salah, hendaklah ia mengubahnya dengan tangannya; jika ia tidak mampu melakukannya, maka dengan lidahnya; dan jika ia tidak mampu melakukannya, maka dengan hatinya, dan itulah iman yang paling lemah.” — Hadits ini adalah hadits ke-34 dalam al-Arba’in al-Nawawiyya dan dalam tafsir Ibnu Rajab; diriwayatkan oleh Muslim (49) dari Qais bin Muslim dari Tariq bin Shihab dari Abu Saeed, dan dari Ismail bin Raja’ dari ayahnya dari Abu Saeed. Dalam hadits Tariq, alasannya adalah apa yang diriwayatkan dari Abu Saeed bahwa Marwan memulai khutbah pada hari raya Idul Fitri sebelum salat, lalu seorang laki-laki berdiri kepadanya dan berkata: Salat itu sebelum khutbah. Maka beliau berkata: Dia telah meninggalkan apa yang ada di sana. Abu Saeed berkata: Adapun hal ini, dia telah memenuhi apa yang dituntut darinya. Kemudian beliau meriwayatkan hadits ini; Maknanya diriwayatkan dalam hadits Ibnu Masoud dalam Muslim: “Tidak ada seorang nabi pun yang diutus Allah kepada suatu umat sebelumku kecuali bahwa beliau mempunyai murid dan sahabat dari umatnya yang mengikuti Sunnahnya dan menaati perintahnya. Kemudian datanglah setelah mereka para pengganti yang mengatakan apa yang tidak mereka lakukan dan melakukan apa yang tidak diperintahkan kepada mereka. Maka barangsiapa yang melawan mereka dengan tangannya adalah orang yang beriman, dan barangsiapa yang melawan mereka dengan lidahnya adalah orang yang beriman, dan barangsiapa yang melawan mereka dengan hatinya adalah orang yang beriman, dan di luar itu tidak ada iman sebesar biji mustard pun.” — Maka Dia menjadikan tangan, lidah, dan hati sebagai tingkatan untuk mengubah yang salah sesuai kemampuan, dan akhirnya adalah hati, yang merupakan iman yang paling lemah (Jami’ al-‘Ulum wa al-Hikam, hlm. 698–709)."
