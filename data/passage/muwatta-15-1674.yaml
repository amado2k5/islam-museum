label: { ar: "الموطأ 1674 — عبد ربه بن سعيد عن محمد بن إبراهيم بن الحارث التيمي: نفيع استفتى زيد بن ثابت أنه طلق حرة تطليقتين، فقال حرمت عليك", en: "Muwatta 1674", es: "Muwatta 1674", fr: "Muwatta 1674", ur: "موطا 1674", tr: "El-Muvatta 1674 — Abd Rabbih ibn Saeed, Muhammed ibn İbrahim ibn el-Harith el-Taymi'den rivayetle: Nafi', Zayd ibn Thabit'ten fetva istedi ve iki kez hür bir kadını boşadığını söyledi. Zayd ibn Thabit ise, \"O sana haramdır\" dedi.", id: "Al-Muwatta 1674 — Abd Rabbih ibn Saeed, berdasarkan riwayat Muhammad ibn Ibrahim ibn al-Harith al-Taymi: Nafi’ meminta fatwa kepada Zayd ibn Thabit, dengan mengatakan bahwa ia telah menceraikan seorang wanita merdeka dua kali, dan beliau berkata, “Dia haram bagimu.”" }
summary:
  ar: "يروي مالك عن عبد ربه بن سعيد عن محمد بن إبراهيم بن الحارث التيمي أن نفيعا استفتى زيد بن ثابت فقال إني طلقت امرأة حرة تطليقتين، فقال زيد بن ثابت حرمت عليك. {cite:muwatta-maruf-1997 p.86}"
  tr: "Malik, Abd Rabbih ibn Sa'id'den, o da Muhammed ibn İbrahim ibn el-Harith el-Taymi'den rivayet ettiğine göre, Nafi', Zeyd ibn Sabit'ten fetva istedi ve \"Ben iki kez hür bir kadını boşadım\" dedi. Zeyd ibn Sabit, \"O sana haramdır\" diye cevap verdi. {cite:muwatta-maruf-1997 s.86}"
  id: "Malik meriwayatkan dari Abd Rabbih ibn Sa'id, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, bahwa Nafi' meminta fatwa dari Zayd ibn Thabit, dengan mengatakan, \"Aku telah menceraikan seorang wanita merdeka dua kali.\" Zayd ibn Thabit menjawab, \"Dia haram bagimu.\" {cite:muwatta-maruf-1997 p.86}"
