label: { ar: "سنن أبي داود 1686 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 1686 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 1686 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 1686 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 1686 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan Abi Davud 1686 — Neler caizdir, neler caiz değildir", id: "Sunan Abi Dawud 1686 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… لَمَّا بَايَعَ رَسُولُ اللَّهِ النِّسَاءَ قَامَتِ امْرَأَةٌ جَلِيلَةٌ كَأَنَّهَا مِنْ نِسَاءِ مُضَرَ فَقَالَتْ يَا نَبِيَّ اللَّهِ إِنَّا كَلٌّ عَلَى آبَائِنَا وَأَبْنَائِنَا - قَالَ أَبُو دَاوُدَ وَأُرَى فِيهِ وَأَزْوَاجِنَا - فَمَا يَحِلُّ لَنَا مِنْ أَمْوَالِهِمْ فَقَالَ \" الرَّطْبُ تَأْكُلْنَهُ وَتُهْدِينَهُ \". قَالَ أَبُو دَاوُدَ الرَّطْبُ الْخُبْزُ وَالْبَقْلُ وَالرُّطَبُ. قَالَ أَبُو دَاوُدَ وَكَذَا رَوَاهُ الثَّوْرِيُّ عَنْ يُونُسَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1686، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1686 (Zakat (Kitab Al-Zakat)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1686، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1686 (Zakat (Kitab Al-Zakat)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 1686 (Zakat), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sünen Ebu Davud'da 1686 numaralı hadis, helal ve haram olanı belirtir. Helal ve Haram rehberinin bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntılarla birleştirilmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1686, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian dari panduan Halal dan Haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
