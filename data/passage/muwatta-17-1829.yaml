label: { ar: "الموطأ 1829 — مالك عن ابن شهاب عن سعيد بن المسيب: نهى رسول الله عن المزابنة والمحاقلة، والمزابنة شراء الثمر بالتمر، والمحاقلة شراء الزرع بالحنطة واستكراء الأرض بالحنطة", en: "Muwatta 1829", es: "Muwatta 1829", fr: "Muwatta 1829", ur: "موطا 1829", tr: "El-Muvatta 1829 — Malik, İbn Şihab'dan, o da Said bin El-Musayyab'dan rivayetle: Allah Resulü, el-Muzabana ve el-Muhaqala'yı yasaklamıştır. El-Muzabana, hurma ile meyve satın almak; el-Muhaqala ise buğday ile ürün satın almak ve buğday ile arazi kiralamaktır.", id: "Al-Muwatta 1829 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab: Rasulullah SAW melarang al-Muzabana dan al-Muhaqala. Al-Muzabana adalah membeli buah dengan kurma, dan al-Muhaqala adalah membeli hasil panen dengan gandum dan menyewa tanah dengan gandum." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أن رسول الله نهى عن المزابنة والمحاقلة. والمزابنة: شراء الثمر بالتمر، والمحاقلة: شراء الزرع بالحنطة، واستكراء الأرض بالحنطة. {cite:muwatta-maruf-1997 p.149}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, bahwa Rasulullah shalla Allahu alaihi wa sallam melarang praktik muzabana dan muhaqala. Muzabana merujuk pada pembelian kurma mentah dengan kurma, sedangkan muhaqala merujuk pada pembelian hasil panen dengan gandum, atau menyewa lahan dengan gandum. {cite:muwatta-maruf-1997 p.149}"
