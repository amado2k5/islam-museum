text: "ل الله ٤، فقال (١) قوله 24: ((تربت يداك أو يمينك)) سبق شرحه في كتاب الغسل. أخبرني يونس، عن ابن شيهاب، عن عروة. الرضاعة، قالت عائشة: فقلت: والله! لا آذن لأفلح، حتى أستأذن رصول الله ٤، فإن أبا القعيس ليس"
