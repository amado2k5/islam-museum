label: { ar: "الموطأ 2501 — مالك: لا عقل فيما دون الموضحة من الشجاج", en: "Muwatta 2501", es: "Muwatta 2501", fr: "Muwatta 2501", ur: "موطا 2501", tr: "Al-Muwatta 2501 — Malik: Kemiklerin açığa çıktığı yaralardan daha hafif yaralar için kan parası yoktur.", id: "Al-Muwatta 2501 — Malik: Tidak ada uang ganti rugi darah untuk luka yang tidak separah luka yang memperlihatkan tulang." }
summary:
  ar: "قال مالك: الأمر عندنا أنه ليس فيما دون الموضحة من الشجاج عقل، حتى تبلغ الموضحة، وإنما العقل في الموضحة فما فوقها؛ لأن النبي انتهى إلى الموضحة في كتابه لعمرو بن حزم فجعل فيها خمسا من الإبل، ولم تقض الأئمة فيما دونها بعقل. {cite:muwatta-maruf-1997 p.429}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kami adalah tidak ada uang darah untuk luka yang tidak separah luka yang memperlihatkan tulang (al-mudihah), sampai pada titik memperlihatkan tulang (al-mudihah). Uang darah hanya diwajibkan untuk luka yang memperlihatkan tulang dan luka di atasnya, karena Nabi menyebutkan luka yang memperlihatkan tulang dalam suratnya kepada Amr ibn Hazm dan menetapkan lima unta sebagai kompensasinya. Para imam tidak menetapkan bahwa uang darah harus diwajibkan untuk luka yang tidak separah itu. {kutipan:muwatta-maruf-1997 hlm. 429}"
