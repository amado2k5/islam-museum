summary:
  ar: "قال مالك: الأمر عندنا أنه ليس فيما دون الموضحة من الشجاج عقل، حتى تبلغ الموضحة، وإنما العقل في الموضحة فما فوقها؛ لأن النبي انتهى إلى الموضحة في كتابه لعمرو بن حزم فجعل فيها خمسا من الإبل، ولم تقض الأئمة فيما دونها بعقل. {cite:muwatta-maruf-1997 p.429}"
