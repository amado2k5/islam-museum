text: "… تسمعونه عنهم من الأعاجيب فإن ذلك وقع لهم كثيرًا، وقيل : لا حرج في أن لا تحدثوا عنهم لأن قوله أولاً : حدثوا صيغة أمر تقتضي الوجوب فأشار إلى عدم الوجوب وأن الأمر فيه للإباحة بقوله: ولا حرج أي في …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 100، يرد فيه ذكر الوجوب، والمباح، وما لا حرج فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 1, p. 100, whose wording mentions obligation (wujub), the permitted (mubah), what carries no blame; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 1، ص 100 کا اقتباس جس میں وجوب، مباح، جس میں کوئی حرج نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Hajar, volume numérisé 1, p. 100, dont le texte mentionne l'obligation (wujub), le permis (mubah), ce qui n'entraîne aucun blâme ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen digitalizado 1, p. 100, cuyo texto menciona la obligatoriedad (wujub), lo permitido (mubah), lo que no acarrea reproche; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hacer'in Fethü'l-Bari adlı eserinin 1. cildinin 100. sayfasından, farz, helal ve farz olmayan fiilleri ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, Jilid 1, halaman 100, yang membahas tentang amalan wajib, amalan yang diperbolehkan, dan amalan yang tidak wajib; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
