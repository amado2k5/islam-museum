text: "… تسمعونه عنهم من الأعاجيب فإن ذلك وقع لهم كثيرًا، وقيل : لا حرج في أن لا تحدثوا عنهم لأن قوله أولاً : حدثوا صيغة أمر تقتضي الوجوب فأشار إلى عدم الوجوب وأن الأمر فيه للإباحة بقوله: ولا حرج أي في …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 100، يرد فيه ذكر الوجوب، والمباح، وما لا حرج فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 1, p. 100, whose wording mentions obligation (wujub), the permitted (mubah), what carries no blame; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
