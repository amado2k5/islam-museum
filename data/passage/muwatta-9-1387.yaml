label: { ar: "الموطأ 1387 — البراء بن عازب: سئل النبي عما يتقى من الضحايا، فأشار بيده أربعا: العرجاء البين ظلعها، والعوراء البين عورها، والمريضة البين مرضها، والعجفاء التي لا تنقي", en: "Muwatta 1387" }
text: "الْعَرْجاءُ الْبَيِّنُ ظَلْعُها، وَالْعَوْراءُ الْبَيِّنُ عَورُها"
summary:
  ar: "يروي مالك عن عمرو بن الحارث عن عبيد بن فيروز عن البراء بن عازب أن رسول الله سئل ماذا يتقى من الضحايا؟ فأشار بيده وقال أربعا، وكان البراء يشير بيده ويقول يدي أقصر من يد رسول الله، العرجاء البين ظلعها، والعوراء البين عورها، والمريضة البين مرضها، والعجفاء التي لا تنقي. ويذكر المحقق أن هذا منقطع، وأن ابن أبي حاتم وابن عبد البر ذكرا أن الحديث إنما رواه عمرو بن الحارث عن سليمان بن عبد الرحمن عن عبيد بن فيروز، فسقط لمالك ذكر سليمان. {cite:muwatta-maruf-1997 p.619}"
