label: { ar: "الموطأ 1387 — البراء بن عازب: سئل النبي عما يتقى من الضحايا، فأشار بيده أربعا: العرجاء البين ظلعها، والعوراء البين عورها، والمريضة البين مرضها، والعجفاء التي لا تنقي", en: "Muwatta 1387", es: "Muwatta 1387", fr: "Muwatta 1387", ur: "موطا 1387", tr: "El-Muvatta 1387 — El-Bara' ibn Azib: Peygamberimize, kurban edilmemesi gereken hayvan türleri soruldu ve eliyle dört tanesini işaret etti: Topallığı apaçık belli olan topal hayvan, körlüğü apaçık belli olan tek gözlü hayvan, hastalığı apaçık belli olan hasta hayvan ve iliği kalmamış, zayıflamış hayvan.", id: "Al-Muwatta 1387 — Al-Bara’ ibn Azib: Nabi ditanya tentang jenis-jenis hewan kurban yang harus dihindari, dan beliau menunjuk dengan tangannya ke empat jenis: hewan pincang yang kepincangannya terlihat jelas, hewan bermata satu yang kebutaannya terlihat jelas, hewan sakit yang penyakitnya terlihat jelas, dan hewan kurus kering yang tidak memiliki sumsum." }
text: "الْعَرْجاءُ الْبَيِّنُ ظَلْعُها، وَالْعَوْراءُ الْبَيِّنُ عَورُها"
summary:
  ar: "يروي مالك عن عمرو بن الحارث عن عبيد بن فيروز عن البراء بن عازب أن رسول الله سئل ماذا يتقى من الضحايا؟ فأشار بيده وقال أربعا، وكان البراء يشير بيده ويقول يدي أقصر من يد رسول الله، العرجاء البين ظلعها، والعوراء البين عورها، والمريضة البين مرضها، والعجفاء التي لا تنقي. ويذكر المحقق أن هذا منقطع، وأن ابن أبي حاتم وابن عبد البر ذكرا أن الحديث إنما رواه عمرو بن الحارث عن سليمان بن عبد الرحمن عن عبيد بن فيروز، فسقط لمالك ذكر سليمان. {cite:muwatta-maruf-1997 p.619}"
  tr: "Malik, Amr ibn al-Harith'ten, o da Ubayd ibn Fayruz'dan, o da al-Bara' ibn Azib'den rivayetle, Allah Resulü'ne kurbanlık hayvanlarda nelerden kaçınılması gerektiği sorulduğunu, Resulullah'ın eliyle işaret ederek \"Dört şey\" dediğini, al-Bara'nın da eliyle işaret ederek \"Benim elim Allah Resulü'nün elinden daha kısadır: Topallığı apaçık olan topal, körlüğü apaçık olan tek gözlü, hastalığı apaçık olan hasta ve iliği olmayan zayıf hayvan\" dediğini aktarır. Araştırmacı, bu rivayet zincirinin kopuk olduğunu ve İbn Abi Hatim ile İbn Abd al-Barr'ın hadisin aslında Amr ibn al-Harith tarafından, Süleyman ibn Abd al-Rahman'dan, o da Ubayd ibn Fayruz'dan rivayet edildiğini, dolayısıyla Malik'in Süleyman'dan bahsetmeyi atladığını belirtmektedir. {cite:muwatta-maruf-1997 s.619}"
  id: "Malik meriwayatkan dari Amr ibn al-Harith, dari Ubayd ibn Fayruz, dari al-Bara' ibn Azib, bahwa Rasulullah ditanya apa yang harus dihindari pada hewan kurban. Beliau menunjuk dengan tangannya dan berkata, \"Empat hal.\" Al-Bara' kemudian menunjuk dengan tangannya dan berkata, \"Tanganku lebih pendek daripada tangan Rasulullah: hewan pincang yang kepincangannya terlihat jelas, hewan bermata satu yang kebutaannya terlihat jelas, hewan sakit yang penyakitnya terlihat jelas, dan hewan kurus kering yang tidak memiliki sumsum.\" Peneliti menyebutkan bahwa rantai periwayatan ini terputus, dan bahwa Ibn Abi Hatim dan Ibn Abd al-Barr menyatakan bahwa hadits tersebut sebenarnya diriwayatkan oleh Amr ibn al-Harith dari Sulayman ibn Abd al-Rahman, dari Ubayd ibn Fayruz, sehingga Malik menghilangkan penyebutan Sulayman. {mengutip:muwatta-maruf-1997 hal.619}"
