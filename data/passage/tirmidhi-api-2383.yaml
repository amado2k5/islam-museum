text: "… الْبَصْرِيِّ، عَنِ ابْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" تَعَوَّذُوا بِاللَّهِ مِنْ جُبِّ الْحُزْنِ \". قَالُوا يَا رَسُولَ اللَّهِ وَمَا جُبُّ الْحُزْنِ قَالَ \" وَادٍ فِي جَهَنَّمَ تَتَعَوَّذُ مِنْهُ جَهَنَّمُ كُلَّ يَوْمٍ مِائَةَ مَرَّةٍ \". قُلْنَا يَا رَسُولَ اللَّهِ وَمَنْ يَدْخُلُهُ قَالَ \" الْقُرَّاءُ الْمُرَاءُونَ بِأَعْمَالِهِمْ \". قَالَ هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ"
summary:
  ar: "حديث في جامع الترمذي، رقم 2383، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 2383 (Chapters On Zuhd), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 2383، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
