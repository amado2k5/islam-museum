text: |-
  ١ قال اللجياتى عى لغة اهل
  الجازوهى الوجه وعاث لغة تيم
  وه-م يقولون ولا تعيشوا فى
  الارض اه ويقال عاث فى ماله
  أسرع انفاقه أو بذره وأفده
  .. فهو عيشان وامرأة عينى إه مد
  ٢ الصواب الغيشلون الى
  الغبرة والاغبث الذى لونه كذلك
  ١ه مر عن خط أبى زكريا وأبى
  سهل جاته
  ابن أبى وقاص قال ابن برى
  وصوابه بعفتك قابسا وكان
  لعائشة هذه مولى يقال له فتد
  وكان مخمثا من أهل المدينة
  بعثنه بقتبيرلها نارافتوجه
  الى.صر وأقام بم اسنة ثم أناها
  بناروهو بعدو فعتر قتبدد الجر
  فقال تعست العجلة فتالت عائشة
  يعثتدالخ اه
