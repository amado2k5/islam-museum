label: { ar: "صحيح البخاري 2678 — تعريف الإسلام بأعماله", en: "Sahih al-Bukhari 2678 — Islam defined by its acts", ur: "صحیح بخاری 2678 — اسلام کی تعریف اس کے اعمال سے" }
text: "… سَمِعَ طَلْحَةَ بْنَ عُبَيْدِ اللَّهِ، يَقُولُ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ فَإِذَا هُوَ يَسْأَلُهُ عَنِ الإِسْلاَمِ، فَقَالَ رَسُولُ اللَّهِ \" خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ وَاللَّيْلَةِ \". فَقَالَ هَلْ عَلَىَّ غَيْرُهَا قَالَ \" لاَ، إِلاَّ أَنْ تَطَّوَّعَ \". فَقَالَ رَسُولُ اللَّهِ \" وَصِيَامُ رَمَضَانَ \". قَالَ هَلْ عَلَىَّ غَيْرُهُ قَالَ \" لاَ، إِلاَّ أَنْ تَطَّوَّعَ \". …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2678، يذكر تعريف الإسلام بأعماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 2678 (Witnesses), that mentions Islam defined by its acts. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 2678، جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
