  والصاوى اليابس يقال صوت النخلة تصوى صوياوصويت لا بلى فى داذا اخسترته ور بيته
  واللفمعلة قال العدبس الكانىّ التصوية للغمول من الابل أن لا يحمل عليه ولا يعة دفيه حبل
  الميكون أنشط له فى الضراب وأقوى وقال الراجز يصف الراعى والابل
  صوّى اهاذا كدنة جلنيا * أخيف كانت أمّه صفيا
  الاصمعىّ التصوية أن ييدس الرحل لين شاته ليكون أسمن لها وأقوى يقال صوّيتها فصوت
  قال أبوذؤيب
