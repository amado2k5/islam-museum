  صلوان وأصلت الفرس اذا استرخى ملواها وذلك اذا قرب نتاجها والصلاء بالكسر والمذ
  الشواء لانه يصلى بالنار والص-لا- أيضاصلاء النارفان قصت الصادقصرت وقات صلا النار
  وقوه تعالى وبيع وص-اوات قال ابن عباس رضى اقه عنه-ما هى كنائس اليهود أى مواضع
  الصلوات ما الصحدان بالتصريك التقلب والوثب ورجل صميان شجاع وأصميت
  الصيداذارميته فقتلته وأنت تراء وفى الحديث كل ما أصحيث ودع ما أغميت وقد صمى
  الصيديصى إذامات وأنت راه وأصمى الفرس على لجاءه اذاعض عليه ومضى وانصعى
  عليه أى انسبة قال جرب
  الى انصيت من السماء عليكم * حتى اختطفتك يافرز دو من =ل .
  ويروى انصبيت ⁦(صنا)⁩ إذاخرج تخلتان أوثلاث من أصل واحد فكل واحدة منهن صنو
  والائنشان صنوان والمع صنوان برفع الذون وفى الحديث عمّ الرجسل صنوأبيه أبوزيد
  ركيتان صنوان اذا تقار بتاونيعتا من عين واحدة والدىّ حسى صغير لايرده أحد ولا يؤبه
  له وهو تصغير صنو قالت ليلى الاخيلية
  آنانغ لم تنبغ ولم تك أولا • وكنت صفيابين صدّيزمي،لا
  ويقال هوشق فى الجبل الفراء أخذت الشئ بصفايته اذا أخذته كله صوا أبو عمرو
