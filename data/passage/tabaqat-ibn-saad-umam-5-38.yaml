text: "… وبعث معاوية عمرو بن العاص فى أَربعمائة من أَهل الشأم حتى توافوا بدومة الجندل. قال : أَخبرنا محمد بن عمر قال : حدّثنى أَبو بكر ابن عبسد اللّٰه بن أَبى سَبْرة عن إسحاق بن عبد اللّٰه بن أَبى فَرْوة عن …"
