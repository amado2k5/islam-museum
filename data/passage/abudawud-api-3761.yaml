label: { ar: "سنن أبي داود 3761 — ما كرهه الفقهاء، ما كُره", en: "Sunan Abi Dawud 3761 — what the jurists disliked; what was disliked", ur: "سنن ابی داؤد 3761 — جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا", fr: "Sunan Abi Dawud 3761 — ce que les juristes ont réprouvé ; ce qui fut réprouvé", es: "Sunan Abi Dawud 3761 — lo que los juristas reprobaron; lo que se reprobó" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا قَيْسٌ، عَنْ أَبِي هَاشِمٍ، عَنْ زَاذَانَ، عَنْ سَلْمَانَ، قَالَ قَرَأْتُ فِي التَّوْرَاةِ أَنَّ بَرَكَةَ الطَّعَامِ الْوُضُوءُ قَبْلَهُ فَذَكَرْتُ ذَلِكَ لِلنَّبِيِّ فَقَالَ \" بَرَكَةُ الطَّعَامِ الْوُضُوءُ قَبْلَهُ وَالْوُضُوءُ بَعْدَهُ \". وَكَانَ سُفْيَانُ يَكْرَهُ الْوُضُوءَ قَبْلَ الطَّعَامِ. قَالَ أَبُو دَاوُدَ وَهُوَ ضَعِيفٌ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3761، يرد فيه ذكر ما كرهه الفقهاء، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 3761 (Foods (Kitab Al-At'imah)), whose wording mentions what the jurists disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 3761، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 3761, dont le texte mentionne ce que les juristes ont réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 3761, cuyo texto menciona lo que los juristas reprobaron, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
