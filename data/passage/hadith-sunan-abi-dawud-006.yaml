text: "عند العرب، وهو المتلمس الشاعر، وكان هجا عمرو بن مند الملك، فكتب له كتابا إلى عامله يوهمه أنه أمر له فيه بعطية، وقد كان كتب إليه يأمره بقتله فارتاب المتلمس به ففكه وقرئ له، فلما علم ما فيه رمى به"
