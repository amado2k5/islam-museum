label: { ar: "الموطأ 637 — عمرة مرسلاً: لعن النبي المختفي والمختفية، يعني نباشي القبور", en: "Muwatta 637", es: "Muwatta 637", fr: "Muwatta 637", ur: "موطا 637", tr: "El-Muvatta 637 — Umre, mursal: Peygamber, saklananı ve saklananı lanetlemiştir; yani mezar hırsızlarını.", id: "Al-Muwatta 637 — Umrah, mursal: Nabi melaknat orang yang bersembunyi dan orang yang menyembunyikan, maksudnya perampok kuburan." }
summary:
  ar: "الحديث الأول في باب ما جاء في المختفي وهو النباش. يرويه مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن، أنها قالت: لعن النبي المختفي والمختفية، يعني نباشي القبور. ويذكر المحقق أن عنوان الباب في نسخة م «باب ما جاء في الاختفاء»، وأن الحديث رواه عن مالك أبو مصعب وسويد والقعنبي عند العقيلي والشافعي في مسنده، وينقل عن ابن عبد البر ⁦(التمهيد 13/139)⁩ أنه روي مسنداً عن مالك عن أبي الرجال عن عمرة عن عائشة من رواية يحيى بن صالح الوحاظي وعبد الله بن عبد الوهاب، وأن العقيلي ساق المرسل من طريق القعنبي وقال: المرسل أولى، ويدافع المحقق عن ثقة الوحاظي وأنه من رجال الشيخين ولم ينفرد. {cite:muwatta-maruf-1997 p.325} {cite:muwatta-maruf-1997 p.326}"
  tr: "Gizlenenler hakkında rivayet edilenler bölümündeki ilk hadis, yani mezar hırsızı hakkında olan hadis. Malik, Ebu el-Rijal Muhammed ibn Abd el-Rahman'dan, o da annesi Amrah bint Abd el-Rahman'dan rivayet etmiştir. Amrah şöyle demiştir: Peygamber, gizlenenleri, erkek ve kadın fark etmeksizin, yani mezar hırsızlarını lanetlemiştir. Editör, M el yazmasındaki bölüm başlığının \"Gizlenme hakkında rivayet edilenler bölümü\" olduğunu ve hadisin Malik'ten Ebu Musab, Suveyd ve el-Kanabi tarafından rivayet edildiğini, el-Ukayli ve el-Şafiî'nin Musned'inde kaydedildiğini belirtmektedir. İbn Abdülberr'in (el-Tamhid 13/139) hadisin Malik'ten, Ebu el-Rijal'den, Amrah'tan, Aişe'den, Yahya ibn Salih el-Vahazi ve Abdullah ibn Abdül-Vahhab'dan rivayet zinciriyle nakledildiğini söylediğini aktarıyor. El-Ukayli, mursal hadisi el-Ka'nebi aracılığıyla aktararak, mursal hadisin daha tercih edilebilir olduğunu belirtmiştir. Editör, el-Vahazi'nin güvenilirliğini savunarak, onun iki Şeyh'in (el-Buhari ve Müslim) ravilerinden biri olduğunu ve tek başına rivayet etmediğini belirtiyor. {cite:muwatta-maruf-1997 s.325} {cite:muwatta-maruf-1997 s.326}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang diriwayatkan mengenai orang yang bersembunyi, yaitu perampok kubur. Hadits ini diriwayatkan oleh Malik dari Abu al-Rijal Muhammad ibn Abd al-Rahman, dari ibunya, Amrah bint Abd al-Rahman, yang berkata: Nabi melaknat orang yang bersembunyi, laki-laki dan perempuan, yang berarti perampok kubur. Editor menyebutkan bahwa judul bab dalam manuskrip M adalah “Bab tentang apa yang diriwayatkan mengenai bersembunyi,” dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, dan al-Qa’nabi, sebagaimana dicatat oleh al-‘Uqayli dan al-Shafi’i dalam Musnadnya. Ia mengutip Ibnu Abd al-Barr (al-Tamhid 13/139) yang mengatakan bahwa hadits tersebut diriwayatkan dengan sanad dari Malik, dari Abu al-Rijal, dari Amrah, dari Aisyah, melalui riwayat Yahya ibn Salih al-Wahazi dan Abdullah ibn Abd al-Wahhab. Al-‘Uqayli mengutip hadits mursal melalui al-Qa’nabi dan berkata: Hadits mursal lebih utama. Editor membela kredibilitas al-Wahazi, dengan menyatakan bahwa ia adalah salah satu perawi dari dua Syekh (al-Bukhari dan Muslim) dan bahwa ia tidak meriwayatkannya sendirian. {cite:muwatta-maruf-1997 p.325} {cite:muwatta-maruf-1997 p.326}"
