label: { ar: "الموطأ 637 — عمرة مرسلاً: لعن النبي المختفي والمختفية، يعني نباشي القبور", en: "Muwatta 637" }
summary:
  ar: "الحديث الأول في باب ما جاء في المختفي وهو النباش. يرويه مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن، أنها قالت: لعن النبي المختفي والمختفية، يعني نباشي القبور. ويذكر المحقق أن عنوان الباب في نسخة م «باب ما جاء في الاختفاء»، وأن الحديث رواه عن مالك أبو مصعب وسويد والقعنبي عند العقيلي والشافعي في مسنده، وينقل عن ابن عبد البر (التمهيد 13/139) أنه روي مسنداً عن مالك عن أبي الرجال عن عمرة عن عائشة من رواية يحيى بن صالح الوحاظي وعبد الله بن عبد الوهاب، وأن العقيلي ساق المرسل من طريق القعنبي وقال: المرسل أولى، ويدافع المحقق عن ثقة الوحاظي وأنه من رجال الشيخين ولم ينفرد. {cite:muwatta-maruf-1997 p.325} {cite:muwatta-maruf-1997 p.326}"
