text: "… عن حصين بن عبد اللّٰه الحماني عن أنس قال: ما أعرف شيئا إلا الصلاة. - حدثنا يحيى بن يعلى عن منصور عن طلق بن حبيب عن أنس بن مالك قال: ثلاث من كن فيه وجد طعم الايمان وحلاوته: بأن يكون …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 134، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 134, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 134 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 1, pág. 134, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
