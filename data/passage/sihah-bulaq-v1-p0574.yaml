text: |-
  ٦٧
  طب لشطبة السعفة الخضراء الرطبة والجمع الشطب وشطبت المرأة الجريد شطبا
  اذاشققته التعمل منه الحصر قال أبو عبيد ثم تلقمه الشاطبة الى المنقبة قال قيس بن انخطيم
  ترى قصد المران تلقى كأنها • تدرّع خرصان بأيدى الشواطب
  وجارية شطبة أى طويلة والشطيبة قطعة من السنام تقطح طولا وكذلك هى من الاديم
  وشطعية من نبع تتخذمنها القوس والانشطاب السسيلان وطريق شاطب أى مائل وشطب
  السيف طرائقه التى فى متنه الواحدة شطبة مثل صبرة وصبر وكذلك شطب السيف يضم الشين
  والطاموسيف مشطب وتوب مشطب فيم طرائق وشطيب اسم جبل ⁦(شعب)⁩ الشعب
  ما تشعب من قبائل العرب والعجم والجمع الشعوب والشعوبية فرقة لاتفضل العرب على
  العجم وأما الذى فى الحديث ان رجلا من الشعوب أسلم قانه بفى من العجم والشعب القبيلة
  لعظمة وهو أبو القبائل الذي ينسبدون اليه أى يجمعهم ويضمه-م وحسكى أبو عبيد عن ابن
  لكلبى عن أبيه الشعب أكبر من القسيلة ثم الفصيلة ثم العمارة ثم البحان ثم الفخذ وشعب الرأس
  شأنه الذى يضم قبائله وفى الرأس أربع قبائل وتقول هماشعبان أى مثلان والشعب الصدع
  فى الشئ واصلاحه أيضا الشعب ومصلحه الشعاب والا لة مشعب وشعبت الشئ فرقته
  وشعبته بمعته وهو من الإضداد تقول التأم شعبهم اذا اجتمع وابعد التفرّق وتفرّق شعيهم
  اذا تفرقوا بعد الاجتماع قال الطرماح
  شت شعب الحىّ بعد التئام وفى الحديث
  ماهذه الفتيا التى شعبت بها النهاس أى فرقتهم وشعب جبل باليمن وهوذ وشعبين نزله حسهان
  بن عمر والجيرى وولده فنسبوا اليه فن كان منهم بالكوفة يقال لهم شعبيون منهم عامر
  بن شراحيل الشعيّ وعداده فى همدان ومن كان منهم بالشأم يقال لهم الشعبائيون ومن
  كأن سنهم بالمِن يقال لهم آل ذى شعبين ومن كان منهم بعصر والمعرب يقال لهم الاشعوب
  والتشعب التفرق والانشعاب مثله وأشعب الرجل اذامات أو فارق فراقا لا يرجع قال
  الشاعر وكانوا أناسامن شعوب فأشعبوا ١ أ و عبيد الشعيب والمزادة والراويهة والسطيحة
  شي واحدوتيس أشعب بين الشعب اذا كان مابين قريه بعيداح_دا والهع شعب وقال
  أبود وادوصرى شتج الانسانباح من الشعب والشعب بالكسر الطريق فى الجبل والجمع
  لشعاب وفى المثل شغلت شعابي جدواى أى شُغلت كثرة المؤنة عطائى عن الناس والشعب
  أيضاصمة لبني منقروالشعب أيضا الحى العظيم والمشعب العاريق وقال
  ومالى الاآل أجرشعة * ومالى الامشعب الحق مشعب
  واتشعب الطريق وأغصان الشجرة أى تفرقت والشعبة بالضم واحسدة الشعبه وهى
  الاعصان وشعب الفرس أيضا ما أشرف منه كالعنق والمنسج قال الراجز
  أشم خنذ يذمنيف شعبه والشعبة أيضا المسيل الصغير يقال شعبة حافل أى ممتلئة سيلا
  والشعبة أيضا الفرقة تقول شعبته-م المنية أى فرقتهم ومنه جميت المنية شعوب لانها تفرق
  وهى معرفة لا تدخلها الالف واللام والشعبة أيضا الوية وهى قطعة يشعب بها الاناء يقال
  قصعة مشعبة أى شعبت فى مواضع منها شدد للكثرة والشعبة الطائفة من الشئ وشعبان
  اسم شهروالجمسع شعبانات وأشعب اسم رجل كان طماعا وفى المثل أطمع من أشعب وشعي
  ١ ال اب برى صوابه إنشادم
  وكانواشحوبامن اناس أى عمن
  لمق شعوب اه مى
