label: { ar: "صحيح البخاري 4324 — الأب والأبوة", en: "Sahih al-Bukhari 4324 — the father and fatherhood", ur: "صحیح بخاری 4324 — باپ اور والدیت", es: "Sahih al-Bukhari 4324 — El padre y la paternidad", fr: "Sahih al-Bukhari 4324 — le père et la paternité" }
text: "حَدَّثَنَا الْحُمَيْدِيُّ، سَمِعَ سُفْيَانَ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ، عَنْ زَيْنَبَ ابْنَةِ أَبِي سَلَمَةَ، عَنْ أُمِّهَا أُمِّ سَلَمَةَا ـ دَخَلَ عَلَىَّ النَّبِيُّ وَعِنْدِي مُخَنَّثٌ فَسَمِعْتُهُ يَقُولُ لِعَبْدِ اللَّهِ بْنِ أَبِي أُمَيَّةَ يَا عَبْدَ اللَّهِ أَرَأَيْتَ إِنْ فَتَحَ اللَّهُ عَلَيْكُمُ الطَّائِفَ غَدًا فَعَلَيْكَ بِابْنَةِ غَيْلاَنَ، فَإِنَّهَا تُقْبِلُ بِأَرْبَعٍ وَتُدْبِرُ بِثَمَانٍ. وَقَالَ النَّبِيُّ \" لاَ يَدْخُلَنَّ هَؤُلاَءِ عَلَيْكُنَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4324، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4324 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4324، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4324 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4324 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
