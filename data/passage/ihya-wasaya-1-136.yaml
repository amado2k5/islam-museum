text: "… وعد إنسانا فى موضع فلم يرجع إليه ذلك الإنسان بل نسى، فبقى اسمعيل اثنين وعشرين يوما فى انتظاره. ولما حضرت عبد اللّٰه بن عمر الوفاة قال : إنه كان خطب إلى ابتى رجل من قريش وقد كان إليه منى شبه …"
summary:
