summary:
  ar: "القسم 9 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب مواقيت الصلاة»، ويضم فيها النصوص من 522 إلى 602 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 9 of Sahih al-Bukhari (Times of the Prayers) in the division of the open hadith dataset the museum took its reports from: reports 522 to 602 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 9، عنوان «کتاب مواقیت الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 522 تا 602۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 9 de Sahih al-Bukhari (Horas de las oraciones) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 522 al 602, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 9 du Sahih al-Bukhari (Les Heures de la prière), soit les hadiths 522 à 602 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
