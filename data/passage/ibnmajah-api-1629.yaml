label: { ar: "سنن ابن ماجه 1629 — الأب والأبوة", en: "Sunan Ibn Majah 1629 — the father and fatherhood", ur: "سنن ابن ماجہ 1629 — باپ اور والدیت", es: "Sunan Ibn Majah 1629 — El padre y la paternidad", fr: "Sunan Ibn Majah 1629 — Le père et la paternité", tr: "Sunan İbn Majah 1629 — Baba ve Babalık", id: "Sunan Ibn Majah 1629 — Ayah dan Peran Ayah" }
text: "… عَلِيٍّ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ الزُّبَيْرِ أَبُو الزُّبَيْرِ، حَدَّثَنَا ثَابِتٌ الْبُنَانِيُّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ لَمَّا وَجَدَ رَسُولُ اللَّهِ ـ مِنْ كَرْبِ الْمَوْتِ مَا وَجَدَ قَالَتْ فَاطِمَةُ وَاكَرْبَ أَبَتَاهْ. فَقَالَ رَسُولُ اللَّهِ ـ \" لاَ كَرْبَ عَلَى أَبِيكِ بَعْدَ الْيَوْمِ إِنَّهُ قَدْ حَضَرَ مِنْ أَبِيكِ مَا لَيْسَ بِتَارِكٍ مِنْهُ أَحَدًا الْمُوَافَاةُ يَوْمَ الْقِيَامَةِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1629، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1629 (Chapters Regarding Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1629، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1629 (Capítulos sobre los funerales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1629 (Chapitres relatifs aux funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 1629 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1629, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
