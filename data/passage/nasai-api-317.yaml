label: { ar: "سنن النسائي 317 — الأب والأبوة", en: "Sunan al-Nasa'i 317 — the father and fatherhood", ur: "سنن نسائی 317 — باپ اور والدیت", es: "Sunan al-Nasa'i 317 — El padre y la paternidad" }
text: "… قَالَ حَدَّثَنَا بَهْزٌ، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ حَدَّثَنَا الْحَكَمُ، عَنْ ذَرٍّ، عَنِ ابْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِيهِ، أَنَّ رَجُلاً، سَأَلَ عُمَرَ بْنَ الْخَطَّابِ عَنِ التَّيَمُّمِ، فَلَمْ يَدْرِ مَا يَقُولُ فَقَالَ عَمَّارٌ أَتَذْكُرُ حَيْثُ كُنَّا فِي سَرِيَّةٍ فَأَجْنَبْتُ فَتَمَعَّكْتُ فِي التُّرَابِ فَأَتَيْتُ النَّبِيَّ فَقَالَ \" إِنَّمَا يَكْفِيكَ هَكَذَا \". وَضَرَبَ شُعْبَةُ بِيَدَيْهِ عَلَى رُكْبَتَيْهِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 317، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 317 (The Book of Purification), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 317، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 317 (El Libro de la Purificación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
