  مثل قطام أى دفرة سنتنة وقول عمررضى اللّٰه عنه وادفراه أى وانتناه ويقال دفرادافر الما
  يجى به فلان أى نتنا وكذلك اذا قجت عليه أمره ( دفتر الدفتر واحد الدفاتر وهو
  الكراريس ( دقر الدهارير الدواهى الواحدة دقرارة بقال فلان يفترى الدمارير
  • أى الاكاذيب والفحسْ ورجل دقرارة أى نمام والدقرار والدقرارة التبان ودقرى اسم
  روضة دمر الدمار الهلال يقال دمره تدميراودرعليه بمعنى وتدمير الصائدان
