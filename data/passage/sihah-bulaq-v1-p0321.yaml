  وكذبوابا ياتنا كذابا الاأن يكون بالهاء فيخرج على أصله مثسل الصنارة والدنامة لانه أمن
  الآن من الالتياس والمدنر من الخيل الذى يكون فيسه نكت فوق البرش ⁦(دور )⁩
  الدارمؤنشة وانما قال اللّٰه تعالى وانعم دار المتقين فذكر على معنى المثوى والموضع كما قال نعم
  الثواب وحسذت حى تفقافأنث على المعى وأدتى العدد أدؤر فالهمزة فيه مبدلة من واو
  مضمومة ولك أن لا تهم زوالكثير ديارم:ل جبل وأجبل وجبال ودور أبضامثل أسد وأسد
  والدارة أخص من الدار قال أمية بن أبى الصلت يمدح عبد اللّٰه بن جدعان
  لهداع بكة مشمعل • وآخرفوق دارته شادى
  والدارة التى حول القمر وهى الهالة وقول الشاعر ذميل الفزارى
  فلا تكترافيه الملامة انه * مما السيف ماقال ابن دارة أبجعا
  قال أبو عبيدة هوسالم بن دارة وحكان همابعض بنى فزاره فاغتاله الفزارى حتى قتل
