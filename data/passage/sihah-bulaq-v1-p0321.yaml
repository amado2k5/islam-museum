  فلاقى عليها من صباح مدقرا • لناموسه بين الصفيح سقائف
  ودهريد هردمورادخسل بغيراذن وفى الحديث من سبق طرفه استئذانه فقدد هر وتدهر
  بلدبااشام ويربوع تدهرى اذا كان صغير اقصيرا ⁦(دنر)⁩ الدينارأ صلهدناربالتشديد
