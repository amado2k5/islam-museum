text: |-
  المعى بل على لفظ الارائك ان
  أريد بالمرتفقموضع الارتفاق
  وهو الانكاء أوعلى اننظ الجنات
  ان أريد بالمرتفق المنزل اه مختار
  ٣٢٠٠
  ⁦(باب الراء)⁩
  دور)
  غر الدغرة أخذ الذئ اختلاسا وفى الحديث لاقطع فى الدغرة وأصل الدغر
  الدفع وفى الحديث علام تعذين أولاد كن بالدغروهوأن ترفع لهاة المعذور وقوله-م
  إدغرى لاصفا أى ادغر واعليهم ولا تصافوهم ويقال أيضاد غر الاصفامثل عقرى وحلقى
  وعقراوحلقا ⁦( دغمر )⁩ الدغمرة الظلط يقال خلق دغمرى ودغمرى قال العجاج
  لا يزدهيف العمل المقذة • ولا من الاخلاق دغمرى
  ودغمرت عليه الخبر خلطت عليه والمدغم رالخفى" (دفر الدفر النتزخاصة يقال دفراله أى
