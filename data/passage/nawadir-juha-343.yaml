text: "… هل كلُّ الحقِّ عليَّ ولا ذنب على اللص؟ سُرِق حمارُ الشيخ فاجتمع إليه أصحابُهُ فطلب منهم أن يساعدوه على معرفة السارق. وبعد أن أصغى الحاضرون إليه، وسمِعُوا تفاصيل الحادثة بحروفها، قال أحدُهم: يجب أن تضع قُفْلاً على باب الاسطبلِ، وإلا …"
summary:
  ar: "سُرق حمار جحا، فلامه أصدقاؤه على قفل الإسطبل والجدار ومفتاح البيت، فسأل جحا هل الذنب كله عليه ولا ذنب على اللص. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  en: "His donkey is stolen; friends blame Juha for the stall lock, the wall, and the house key; Juha asks whether all the fault is his and the thief bears none. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  ur: "جحا کا گدھا چوری ہو گیا، دوستوں نے اسے اصطبل کے تالے، دیوار اور گھر کی چابی پر ملامت کی، تو جحا نے پوچھا کہ کیا سارا قصور اس کا ہے اور چور پر کوئی گناہ نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  fr: "L'âne de Juha est volé ; ses amis lui reprochent la serrure de l'étable, le mur et la clé de la maison ; Juha demande si toute la faute est la sienne et si le voleur n'en porte aucune. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
  es: "Le roban el burro a Juha; sus amigos le reprochan la cerradura del establo, la pared y la llave de la casa; Juha pregunta si toda la culpa es suya y el ladrón no carga con ninguna. {cite:juha-nawadir-kubra-djuwaydi p. 169}"
