label: { ar: "الموطأ 398 — بلاغ: ابن عباس يقصر فيما بين مكة والطائف وعسفان وجدة", en: "Muwatta 398" }
summary:
  ar: "بلاغ في باب ما يجب فيه قصر الصلاة: يروي مالك أنه بلغه أن عبد الله بن عباس كان يقصر الصلاة في مثل ما بين مكة والطائف، وفي مثل ما بين مكة وعسفان، وفي مثل ما بين مكة وجدة؛ ويقول مالك إن ذلك أربعة بُرد وهو أحب ما تُقصر إليه فيه الصلاة عنده. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير، وأن الشافعي وعبد الرزاق وابن أبي شيبة أخرجوا آثاراً عن ابن عباس بمعناه، وأن الدارقطني أخرجه مرفوعاً ولا يصح مرفوعاً. {cite:muwatta-maruf-1997 p.211} {cite:muwatta-maruf-1997 p.212}"
