label: { ar: "الموطأ 398 — بلاغ: ابن عباس يقصر فيما بين مكة والطائف وعسفان وجدة", en: "Muwatta 398", es: "Muwatta 398", fr: "Muwatta 398", ur: "موطا 398", tr: "El-Muvatta 398 — Rapor: İbn Abbas, Mekke, Taif, Üsfan ve Cidde arasında namazlarını kısaltır.", id: "Al-Muwatta 398 — Laporan: Ibnu Abbas mempersingkat salatnya antara Mekah, Taif, Usfan, dan Jeddah" }
summary:
  ar: "بلاغ في باب ما يجب فيه قصر الصلاة: يروي مالك أنه بلغه أن عبد الله بن عباس كان يقصر الصلاة في مثل ما بين مكة والطائف، وفي مثل ما بين مكة وعسفان، وفي مثل ما بين مكة وجدة؛ ويقول مالك إن ذلك أربعة بُرد وهو أحب ما تُقصر إليه فيه الصلاة عنده. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير، وأن الشافعي وعبد الرزاق وابن أبي شيبة أخرجوا آثاراً عن ابن عباس بمعناه، وأن الدارقطني أخرجه مرفوعاً ولا يصح مرفوعاً. {cite:muwatta-maruf-1997 p.211} {cite:muwatta-maruf-1997 p.212}"
  tr: "Namazın hangi mesafelerde kısaltılmasının farz olduğuna dair bir rivayet: Malik, Abdullah ibn Abbas'ın namazı Mekke ile Taif, Mekke ile Usfan ve Mekke ile Cidde arasındaki mesafelere denk gelen mesafelerde kısalttığını işittiğini rivayet eder. Malik, bunun dört burd (yaklaşık 12.000 metrekare) olduğunu ve ona göre namazı kısaltmak için tercih edilen mesafe olduğunu söyler. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve Şafiî, Abdülrazzak ve İbn Abi Şeybe'nin de İbn Abbas'tan benzer anlamda rivayetler naklettiğini belirtir. Darakutni bunu Peygamberimize dayandırılan bir hadis olarak nakletmiştir, ancak bu sahih değildir. {cite:muwatta-maruf-1997 s.211} {cite:muwatta-maruf-1997 s.212}"
  id: "Sebuah riwayat mengenai jarak-jarak di mana mempersingkat salat diwajibkan: Malik meriwayatkan bahwa ia mendengar bahwa Abdullah ibn Abbas biasa mempersingkat salat pada jarak yang setara dengan jarak antara Mekah dan Ta'if, antara Mekah dan Usfan, dan antara Mekah dan Jeddah. Malik mengatakan bahwa jarak tersebut adalah empat burd (sekitar 12.000 meter persegi), dan ini adalah jarak yang lebih disukai untuk mempersingkat salat menurutnya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr, dan bahwa al-Shafi'i, Abd al-Razzaq, dan Ibn Abi Shaybah meriwayatkan riwayat dari Ibn Abbas dengan makna yang serupa. Al-Daraqutni meriwayatkannya sebagai hadits yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya), tetapi ini tidak sahih. {kutip:muwatta-maruf-1997 hal.211} {kutip:muwatta-maruf-1997 hal.212}"
