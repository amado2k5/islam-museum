label: { ar: "صحيح البخاري 3659 — الأب والأبوة", en: "Sahih al-Bukhari 3659 — the father and fatherhood", ur: "صحیح بخاری 3659 — باپ اور والدیت", es: "Sahih al-Bukhari 3659 — El padre y la paternidad", fr: "Sahih al-Bukhari 3659 — Le père et la paternité", tr: "Sahih el-Buhari 3659 — Baba ve Babalık", id: "Sahih al-Bukhari 3659 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا الْحُمَيْدِيُّ، وَمُحَمَّدُ بْنُ عَبْدِ اللَّهِ، قَالاَ حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ مُحَمَّدِ بْنِ جُبَيْرِ بْنِ مُطْعِمٍ، عَنْ أَبِيهِ، قَالَ أَتَتِ امْرَأَةٌ النَّبِيَّ فَأَمَرَهَا أَنْ تَرْجِعَ إِلَيْهِ. قَالَتْ أَرَأَيْتَ إِنْ جِئْتُ وَلَمْ أَجِدْكَ كَأَنَّهَا تَقُولُ الْمَوْتَ. قَالَ \" إِنْ لَمْ تَجِدِينِي فَأْتِي أَبَا بَكْرٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3659، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3659 (Companions of the Prophet), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3659، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3659 (Compañeros del Profeta), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3659 (Compagnons du Prophète), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3659 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3659, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
