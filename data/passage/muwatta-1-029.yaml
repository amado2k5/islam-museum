ref: "1.29"
label: { ar: "الموطأ 29 — حديث الإبراد من طريق أبي الزناد عن الأعرج", en: "Muwatta 29", es: "Muwatta 29", fr: "Muwatta 29", ur: "موطا 29", tr: "El-Muvatta 29 — Soğuma hadisi, Ebu el-Zinad'ın el-A'rac'tan rivayet ettiğine göre.", id: "Al-Muwatta 29 — Hadits tentang pendinginan, diriwayatkan oleh Abu al-Zinad dari al-A`raj" }
text: "إذا اشتد الحر فأبردوا عن الصلاة، فإن شدة الحر من فيح جهنم"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب النهي عن الصلاة بالهاجرة، بمثل لفظ الحديث السابق في الإبراد بالصلاة عند اشتداد الحر. ويفسر المحقق الإبراد بانكسار الحر، أي تأخير الصلاة إلى وقت ينكسر فيه، ويخرّجه عند أحمد (2/462) والشافعي وابن ماجه (677) والبغوي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن هذا الحديث «يتصل من وجوه كثيرة ثابتة» من غير طريق زيد بن أسلم. {cite:muwatta-maruf-1997 p.48}"
  tr: "Malik, öğle vakti namaz kılmanın yasaklanması bölümünde, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, aşırı sıcak olduğunda namazı erteleme hakkındaki önceki hadise benzer bir üslupla nakletmiştir. Araştırmacı, namazı sıcaklığın azalmasına kadar ertelemenin, sıcaklığın daha az olduğu bir zamana kadar bekletmek anlamına geldiğini açıklamaktadır. Bunu, Ahmed (2/462), Şafiî, İbn Majah (677) ve Bağavi'nin hadis külliyatlarında, Malik'in sahabelerinin rivayet zincirleriyle zikretmektedir. İbn Abd el-Barr'ın bu hadisin, Zeyd ibn Aslam'ınkinden başka \"birçok sahih rivayet zinciriyle\" nakledildiğini söylediğini aktarmaktadır. {cite:muwatta-maruf-1997 s.48}"
  id: "Malik meriwayatkan hadits ini dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam bab tentang larangan shalat tengah hari, dengan redaksi yang mirip dengan hadits sebelumnya tentang menunda shalat ketika cuaca sangat panas. Peneliti menjelaskan bahwa menunda shalat hingga cuaca mereda berarti menundanya hingga cuaca tidak terlalu panas. Ia mengutipnya dalam kumpulan hadits Ahmad (2/462), al-Shafi'i, Ibn Majah (677), dan al-Baghawi, melalui sanad para sahabat Malik. Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa hadits ini \"terkait melalui banyak sanad sahih\" selain sanad Zaid ibn Aslam. {cite:muwatta-maruf-1997 p.48}"
