label: { ar: "الموطأ 29 — حديث الإبراد من طريق أبي الزناد عن الأعرج", en: "Muwatta 29" }
text: "إذا اشتد الحر فأبردوا عن الصلاة، فإن شدة الحر من فيح جهنم"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب النهي عن الصلاة بالهاجرة، بمثل لفظ الحديث السابق في الإبراد بالصلاة عند اشتداد الحر. ويفسر المحقق الإبراد بانكسار الحر، أي تأخير الصلاة إلى وقت ينكسر فيه، ويخرّجه عند أحمد (2/462) والشافعي وابن ماجه (677) والبغوي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن هذا الحديث «يتصل من وجوه كثيرة ثابتة» من غير طريق زيد بن أسلم. {cite:muwatta-maruf-1997 p.48}"
