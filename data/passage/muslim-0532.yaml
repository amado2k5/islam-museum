label: { ar: "مسلم 532 — «لو كنت متخذا خليلا لاتخذت أبا بكر خليلا»", en: "Muslim 532 — Had I taken a bosom friend, it would have been Abu Bakr" }
text: "سمعت النبي قبل أن يموت بخمس وهو يقول: «إني أبرأ إلى الله أن يكون لي منكم خليل؛ فإن الله تعالى قد اتخذني خليلا كما اتخذ إبراهيم خليلا، ولو كنت متخذا من أمتي خليلا لاتخذت أبا بكر خليلا»"
summary:
  ar: "رواية جندب بن عبد الله البجلي في كتاب الصلاة من صحيح مسلم؛ سمعه من النبي قبل وفاته بخمسة أيام، وفيه تسوية منزلة أبي بكر بين الخلة الإلهية للنبي ومحبة الصديق الخاصة، ويليه في المتن «ألا وإن أشكر الناس لي صحبة ومالا أبو بكر»."
