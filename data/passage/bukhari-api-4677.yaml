label: { ar: "صحيح البخاري 4677 — الأب والأبوة", en: "Sahih al-Bukhari 4677 — the father and fatherhood", ur: "صحیح بخاری 4677 — باپ اور والدیت", es: "Sahih al-Bukhari 4677 — El padre y la paternidad", fr: "Sahih al-Bukhari 4677 — Le père et la paternité", tr: "Sahih el-Buhari 4677 — Baba ve Babalık", id: "Sahih al-Bukhari 4677 — Ayah dan Peran Ayah" }
text: "… إِسْحَاقُ بْنُ رَاشِدٍ، أَنَّ الزُّهْرِيَّ، حَدَّثَهُ قَالَ أَخْبَرَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ أَبِي كَعْبَ بْنَ مَالِكٍ،، وَهْوَ أَحَدُ الثَّلاَثَةِ الَّذِينَ تِيبَ عَلَيْهِمْ أَنَّهُ لَمْ يَتَخَلَّفْ عَنْ رَسُولِ اللَّهِ فِي غَزْوَةٍ غَزَاهَا قَطُّ غَيْرَ غَزْوَتَيْنِ غَزْوَةِ الْعُسْرَةِ وَغَزْوَةِ بَدْرٍ. قَالَ فَأَجْمَعْتُ صِدْقَ رَسُولِ اللَّهِ ضُحًى، وَكَانَ قَلَّمَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4677، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4677 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4677، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4677 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4677 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 4677 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4677, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
