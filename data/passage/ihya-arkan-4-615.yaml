text: "… ما الإيمان ش محمدا ً رسول االله وأن تقيموا الصلاة وتؤتوا الزكاة وتصوموا رمضان وتحجوا البيت الحرام والحديث في الصحيحين لكن ل يس فيه ذكر الحج وزاد وأن تؤتوا خمسا من المغنم حديث جبريل لما سأله عن الإيمان فقال أن …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 615، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 615, that mentions the prayer, the zakat, the fast and the pilgrimage named together, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 615 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 615, que menciona la oración, el zakat, el ayuno y la peregrinación, así como la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 4, page 615), mentionnant la prière, la zakat, le jeûne et le pèlerinage, ainsi que la question de la foi et sa réponse. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Gazali'nin İhya Ulum el-Din (Dinî İlimlerin Yeniden Canlandırılması) adlı eserinin 4. cildinin 615. sayfasından bir alıntı, namaz, zekât, oruç ve Hac'ı birlikte ele alarak imanla ilgili soru ve cevaba değinmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ihya Ulum al-Din (Kebangkitan Ilmu-ilmu Agama) karya Al-Ghazali, Jilid 4, halaman 615, menyebutkan salat, zakat (sedekah), puasa, dan haji (ziarah) secara bersamaan, dan membahas pertanyaan dan jawaban mengenai iman. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
