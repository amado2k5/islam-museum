label: { ar: "صحيح البخاري 1860 — الأب والأبوة", en: "Sahih al-Bukhari 1860 — the father and fatherhood", ur: "صحیح بخاری 1860 — باپ اور والدیت", es: "Sahih al-Bukhari 1860 — El padre y la paternidad", fr: "Sahih al-Bukhari 1860 — Le père et la paternité", tr: "Sahih el-Buhari 1860 — Baba ve Babalık", id: "Sahih al-Bukhari 1860 — Sang Ayah dan Peran Ayah" }
text: "وَقَالَ لِي أَحْمَدُ بْنُ مُحَمَّدٍ حَدَّثَنَا إِبْرَاهِيمُ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَذِنَ عُمَرُ ـ لأَزْوَاجِ النَّبِيِّ فِي آخِرِ حَجَّةٍ حَجَّهَا، فَبَعَثَ مَعَهُنَّ عُثْمَانَ بْنَ عَفَّانَ وَعَبْدَ الرَّحْمَنِ بْنَ عَوْفٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1860، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1860 (Penalty of Hunting while on Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1860، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1860 (Castigo de la caza durante la peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1860 (La peine pour avoir chassé en pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 1860 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1860, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
