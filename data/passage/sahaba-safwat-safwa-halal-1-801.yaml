text: "… قيد فرسك، لعل اللّٰه يرى شعري قيد فرسك في سبيله فيغفر لي. فلما كانت صبيحة القتال فإذا بغلام بين يدي الصفوف يقاتل، فتقدمت إليه وقلت: يا فتى أنت النظر إلى شعر الأجنبية حرام، إلا الشعر البائن المنفصل فلا يحرم عند …"
