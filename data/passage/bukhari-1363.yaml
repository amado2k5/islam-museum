label:
  ar: "البخاري 1363 — بادرني عبدي بنفسه فحرمت عليه الجنة"
  en: "Bukhari 1363 — My servant hastened to Me with his own life"
  ur: "بخاری 1363 — میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی"
text: "من حلف بملة غير الإسلام كاذبا متعمدا فهو كما قال، ومن قتل نفسه بحديدة عذب به في نار جهنم . وقال حجاج بن منهال حدثنا جرير بن حازم، عن الحسن، حدثنا جندب في هذا المسجد فما نسينا، وما نخاف أن …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 1363: بادرني عبدي بنفسه فحرمت عليه الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 1363: My servant hastened to Me with his own life. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 1363: میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
