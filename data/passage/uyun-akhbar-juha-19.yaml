text: "… الأبدان بما يصلحها من الغذاء والحمية وشرب الدواء ومضار الأطعمة ومنافعها ومصالحها وتُتّف من طبِّ العرب والعجم وماجاء فى ذلك • من النوادر وأبيات الشعر المشاكلة لتلك الأخبار. والكتاب العاشر كاب النساء وهذا الكتاب مقارب لكتاب الطعام، والعرب تدعو الأكل …"
