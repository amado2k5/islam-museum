text: "… أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ دَاوُدَ بْنِ قَيْسٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُبَيْدِ اللَّهِ بْنِ أَقْرَمَ الْخُزَاعِيِّ، عَنْ أَبِيهِ، قَالَ كُنْتُ مَعَ أَبِي بِالْقَاعِ مِنْ نَمِرَةَ فَمَرَّ بِنَا رَكْبٌ فَأَنَاخُوا بِنَاحِيَةِ الطَّرِيقِ فَقَالَ لِي أَبِي كُنْ فِي بَهْمِكَ حَتَّى آتِيَ هَؤُلاَءِ الْقَوْمَ فَأُسَائِلَهُمْ. قَالَ فَخَرَجَ وَجِئْتُ - يَعْنِي دَنَوْتُ - فَإِذَا رَسُولُ اللَّهِ ـ فَحَضَرْتُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 881، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 881 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 881، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
