label: { ar: "صحيح البخاري 3872 — وصية أو عهد أخير", en: "Sahih al-Bukhari 3872 — a testament or parting counsel", ur: "صحیح بخاری 3872 — وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 3872 — un testamento o consejo de despedida", fr: "Sahih al-Bukhari 3872 — un testament ou un conseil d'adieu", tr: "Sahih el-Buhari 3872 — Son bir vasiyet veya antlaşma", id: "Sahih al-Bukhari 3872 — Sebuah wasiat atau perjanjian terakhir" }
text: "… مَا عَصَيْتُهُ وَلاَ غَشَشْتُهُ حَتَّى تَوَفَّاهُ اللَّهُ، ثُمَّ اسْتَخْلَفَ اللَّهُ أَبَا بَكْرٍ فَوَاللَّهِ مَا عَصَيْتُهُ وَلاَ غَشَشْتُهُ، ثُمَّ اسْتُخْلِفَ عُمَرُ، فَوَاللَّهِ مَا عَصَيْتُهُ وَلاَ غَشَشْتُهُ، ثُمَّ اسْتُخْلِفْتُ، أَفَلَيْسَ لِي عَلَيْكُمْ مِثْلُ الَّذِي كَانَ لَهُمْ عَلَىَّ قَالَ بَلَى. قَالَ فَمَا هَذِهِ الأَحَادِيثُ الَّتِي تَبْلُغُنِي عَنْكُمْ فَأَمَّا مَا ذَكَرْتَ مِنْ شَأْنِ الْوَلِيدِ بْنِ عُقْبَةَ، فَسَنَأْخُذُ فِيهِ إِنْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3872، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3872 (Merits of the Helpers in Madinah (Ansaar)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3872، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3872 (Méritos de los Ayudantes en Medina (Ansar)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 3872 (Mérites des Compagnons de Médine (Ansar)), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 3872 numaralı hadis, vasiyet veya son bir ahitten bahsetmektedir. Bu hadis, vasiyet, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3872, menyebutkan tentang wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
