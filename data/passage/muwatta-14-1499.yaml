label: { ar: "الموطأ 1499 — سعيد بن المسيب عن عمر: من تزوج امرأة بها جنون أو جذام أو برص فمسها فلها صداقها كاملا، وهو غرم على وليها", en: "Muwatta 1499" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه قال قال عمر بن الخطاب أيما رجل تزوج امرأة وبها جنون، أو جذام، أو برص، فمسها، فلها صداقها كاملا، وذلك لزوجها غرم على وليها. قال مالك وإنما يكون ذلك غرما على وليها لزوجها، إذا كان وليها الذي أنكحها أباها أو أخاها، أو من يرى أنه يعلم ذلك منها، فأما إذا كان وليها ابن عم أو مولى أو من العشيرة ممن لا يعلم ذلك منها، فليس عليه غرم، وترد تلك المرأة ما أخذت من صداقها. {cite:muwatta-maruf-1997 p.31}"
