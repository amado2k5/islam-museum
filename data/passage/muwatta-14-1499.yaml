label: { ar: "الموطأ 1499 — سعيد بن المسيب عن عمر: من تزوج امرأة بها جنون أو جذام أو برص فمسها فلها صداقها كاملا، وهو غرم على وليها", en: "Muwatta 1499", es: "Muwatta 1499", fr: "Muwatta 1499", ur: "موطا 1499", tr: "El-Muvatta 1499 — Sa'id ibn el-Musayyab, Ömer'den rivayetle: Akıl hastalığı, cüzzam veya vitiligo hastalığı olan bir kadınla evlenip onunla cinsel ilişkiye giren kadın, mehirinin tamamını almaya hak kazanır ve bu, vasisinin borcudur.", id: "Al-Muwatta 1499 — Sa’id ibn al-Musayyab berdasarkan riwayat Umar: Barang siapa menikahi seorang wanita yang menderita gangguan jiwa, kusta, atau vitiligo dan melakukan hubungan seksual dengannya, maka ia berhak atas seluruh maharnya, dan itu merupakan kewajiban bagi walinya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه قال قال عمر بن الخطاب أيما رجل تزوج امرأة وبها جنون، أو جذام، أو برص، فمسها، فلها صداقها كاملا، وذلك لزوجها غرم على وليها. قال مالك وإنما يكون ذلك غرما على وليها لزوجها، إذا كان وليها الذي أنكحها أباها أو أخاها، أو من يرى أنه يعلم ذلك منها، فأما إذا كان وليها ابن عم أو مولى أو من العشيرة ممن لا يعلم ذلك منها، فليس عليه غرم، وترد تلك المرأة ما أخذت من صداقها. {cite:muwatta-maruf-1997 p.31}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle, Ömer ibn al-Khattab'ın şöyle dediğini aktarır: \"Bir erkek, akıl hastalığı, cüzzam veya vitiligo hastası bir kadınla evlenir ve onunla cinsel ilişkiye girerse, kadın mehirinin tamamını almaya hak kazanır ve kocası, kadının vasisinden bir ceza ödemekle yükümlüdür.\" Malik şöyle dedi: \"Bu ceza, ancak evliliği düzenleyen vasi kadının babası, erkek kardeşi veya durumunu bilen biri ise geçerlidir. Ancak vasi kadının kuzeni, azatlı kölesi veya durumunu bilmeyen kabileden biri ise, vasi sorumlu değildir ve kadın aldığı mehiri iade etmekle yükümlüdür.\" {cite:muwatta-maruf-1997 s.31}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa beliau berkata: Umar ibn al-Khattab berkata, \"Jika seorang pria menikahi seorang wanita yang menderita gangguan jiwa, kusta, atau vitiligo, dan melakukan hubungan seksual dengannya, maka wanita tersebut berhak atas mahar penuhnya, dan suaminya wajib membayar denda dari walinya.\" Malik berkata, \"Denda ini hanya dikenakan oleh walinya kepada suaminya jika wali yang mengatur pernikahan tersebut adalah ayahnya, saudara laki-lakinya, atau seseorang yang mengetahui kondisinya. Namun, jika walinya adalah sepupu, budak yang telah dibebaskan, atau seseorang dari suku yang tidak mengetahui kondisinya, maka ia tidak wajib membayar denda, dan wanita tersebut harus mengembalikan mahar yang telah diterimanya.\" {cite:muwatta-maruf-1997 p.31}"
