text: "… مَطَر الوراق - م - أبو رجاء بن طَهْمان مولى علباء بن أحمد اليشكري. خراساني نزل البصرة وكان يكتب المصاحف وله حظ من علم وعمل. روى عن أنس والحسن وعكرمة وشهر بن حوشب وابن بريدة وبكر بن عبد اللّه المزني. …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 11، ص 268، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 11, p. 268, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 11، ص 268 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 11, pág. 268, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 11, page 268, mentionne la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 11. cildinin 268. sayfasından bir alıntı, Kur'an'ın derlenmesi ve el yazmalarının yanı sıra hat sanatı ve yazıdan bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 11, halaman 268, menyebutkan penyusunan Al-Qur'an dan manuskripnya, serta kaligrafi dan tulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
