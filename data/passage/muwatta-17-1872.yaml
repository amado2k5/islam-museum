label: { ar: "الموطأ 1872 — مالك عن كثير بن فرقد: سأل أبا بكر بن محمد بن عمرو بن حزم عن بيع الطعام بالذهب إلى أجل، ثم شراء التمر بالذهب قبل قبضه، فكره ذلك ونهى عنه", en: "Muwatta 1872", es: "Muwatta 1872", fr: "Muwatta 1872", ur: "موطا 1872", tr: "El-Muvatta 1872 — Malik, Kathir ibn Farqad'dan rivayetle: Ebu Bekr ibn Muhammed ibn Amr ibn Hazm'a, yiyecekleri altın karşılığında kredili olarak satıp, hurmaları altın karşılığında alıp sonra da teslim almanın doğru olup olmadığını sordu. Ebu Bekr ibn Muhammed ibn Amr ibn Hazm bunu hoş karşılamadı ve yasakladı.", id: "Al-Muwatta 1872 — Malik, berdasarkan riwayat Kathir ibn Farqad: Dia bertanya kepada Abu Bakr ibn Muhammad ibn Amr ibn Hazm tentang menjual makanan dengan emas secara kredit, kemudian membeli kurma dengan emas sebelum menerimanya. Beliau tidak menyukai hal itu dan melarangnya." }
summary:
  ar: "يروي مالك عن كثير بن فرقد أنه سأل أبا بكر بن محمد بن عمرو بن حزم عن الرجل يبيع الطعام من الرجل بالذهب إلى أجل، ثم يشتري بالذهب تمرا قبل أن يقبض الذهب؟ فكره ذلك، ونهى عنه. {cite:muwatta-maruf-1997 p.170}"
  tr: "Malik, Kathir ibn Farqad'dan rivayetle, Ebu Bekir ibn Muhammed ibn Amr ibn Hazm'a, bir adama altın karşılığında veresiye yiyecek satan, sonra altını almadan önce o altınla hurma alan bir adam hakkında sorduğunu anlatır. Ebu Bekir bu davranışı beğenmemiş ve yasaklamıştır. {cite:muwatta-maruf-1997 s.170}"
  id: "Malik meriwayatkan dari Kathir ibn Farqad bahwa ia bertanya kepada Abu Bakr ibn Muhammad ibn Amr ibn Hazm tentang seorang pria yang menjual makanan kepada pria lain dengan imbalan emas secara kredit, kemudian membeli kurma dengan emas tersebut sebelum menerima emasnya. Beliau tidak menyukai hal ini dan melarangnya. {cite:muwatta-maruf-1997 p.170}"
