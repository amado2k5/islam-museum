label: { ar: "الموطأ 2016 — يحيى عن مالك: في رجل دفع إلى رجل مالا قراضا وشرط عليه ألا يشتري إلا سلعة كذا، أو نهاه أن يشتري سلعة بعينها: فلا بأس أن يشترط ألا يشتري حيوانا أو سلعة بعينها، ويكره أن يشترط عليه أن لا يشتري إلا سلعة كذا إلا أن تكون كثيرة موجودة لا تختلف", en: "Muwatta 2016" }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، وشرط عليه أن لا تشتري بمالي إلا سلعة كذا وكذا، أو ينهاه أن يشتري سلعة باسمها. قال مالك: من اشترط على من قارضه أن لا يشتري حيوانا أو سلعة باسمها، فلا بأس بذلك. ومن اشترط على من قارضه أن لا يشتري إلا سلعة كذا وكذا، فإن ذلك مكروه، إلا أن تكون السلعة التي أمره أن لا يشتري غيرها كثيرة موجودة، لا تخلف في شتاء ولا صيف، فلا بأس بذلك. {cite:muwatta-maruf-1997 p.224}"
