label: { ar: "الموطأ 2016 — يحيى عن مالك: في رجل دفع إلى رجل مالا قراضا وشرط عليه ألا يشتري إلا سلعة كذا، أو نهاه أن يشتري سلعة بعينها: فلا بأس أن يشترط ألا يشتري حيوانا أو سلعة بعينها، ويكره أن يشترط عليه أن لا يشتري إلا سلعة كذا إلا أن تكون كثيرة موجودة لا تختلف", en: "Muwatta 2016", es: "Muwatta 2016", fr: "Muwatta 2016", ur: "موطا 2016", tr: "El-Muvatta 2016 — Yahya, Malik'ten rivayetle: Bir kimse başka bir kimseye borç para verip, sadece şu veya bu malı alabileceğini veya belirli bir malı almasını yasaklayabileceğini şart koşarsa: Belirli bir hayvanı veya malı almasını yasaklamasında bir sakınca yoktur; ancak, bol miktarda bulunan, kolayca temin edilebilen ve değişmeyen bir mal olmadığı sürece, sadece şu veya bu malı alabileceğini şart koşması mekruhtur.", id: "Al-Muwatta 2016 — Yahya berdasarkan riwayat Malik: Mengenai seorang laki-laki yang memberi uang kepada laki-laki lain sebagai pinjaman dan menetapkan syarat bahwa ia hanya boleh membeli barang tertentu, atau melarangnya membeli barang tertentu: tidak ada salahnya menetapkan syarat bahwa ia tidak boleh membeli hewan atau barang tertentu, tetapi tidak disukai jika menetapkan syarat bahwa ia hanya boleh membeli barang tertentu kecuali jika barang tersebut berlimpah, mudah didapatkan, dan tidak berubah-ubah." }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، وشرط عليه أن لا تشتري بمالي إلا سلعة كذا وكذا، أو ينهاه أن يشتري سلعة باسمها. قال مالك: من اشترط على من قارضه أن لا يشتري حيوانا أو سلعة باسمها، فلا بأس بذلك. ومن اشترط على من قارضه أن لا يشتري إلا سلعة كذا وكذا، فإن ذلك مكروه، إلا أن تكون السلعة التي أمره أن لا يشتري غيرها كثيرة موجودة، لا تخلف في شتاء ولا صيف، فلا بأس بذلك. {cite:muwatta-maruf-1997 p.224}"
  tr: "Yahya şöyle dedi: Malik, bir başkasına borç para veren ve bu parayla sadece şu veya bu malı almasını veya o isimle başka hiçbir malı almasını yasaklayan bir kişi hakkında şöyle dedi: Malik dedi ki: Eğer bir kimse borç ortağına o isimle bir hayvan veya başka bir mal almaması gerektiğini şart koşarsa, bunda bir sakınca yoktur. Ancak bir kimse borç ortağına sadece şu veya bu malı alması gerektiğini şart koşarsa, bu mekruhtur; ancak almaması gereken mallar bol ve kolayca bulunabilen, kış veya yaz aylarında kıtlığı olmayan mallar ise, bunda bir sakınca yoktur. {cite:muwatta-maruf-1997 s.224}"
  id: "Yahya berkata: Malik berkata mengenai seorang pria yang memberi uang kepada pria lain sebagai pinjaman, dengan syarat bahwa ia hanya boleh membeli barang-barang tertentu dengan uang itu, atau melarangnya membeli barang lain dengan nama yang sama: Malik berkata: Jika seseorang menetapkan syarat kepada teman pinjamannya bahwa ia tidak boleh membeli hewan atau barang lain dengan nama yang sama, maka tidak ada salahnya. Tetapi jika seseorang menetapkan syarat kepada teman pinjamannya bahwa ia hanya boleh membeli barang-barang tertentu, maka itu tidak disukai, kecuali jika barang-barang yang dilarang dibeli itu berlimpah dan mudah didapatkan, tidak kekurangan di musim dingin atau musim panas, maka tidak ada salahnya. {cite:muwatta-maruf-1997 p.224}"
