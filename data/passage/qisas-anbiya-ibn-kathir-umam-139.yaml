text: "… وغيره. وقد يكون هذا السياق لإهلاك عاد الآخرة، فإن فيما ذكره ابن إسحاق وغيره ذكر لمكة، ولم تبن إلا بعد إبراهيم الخليل، حين أسكن فيها هاجر وابنه إسماعيل، فنزلت جرهم عندهم كما سيأتى، وعاد الأولى قبل الخليل، وفيه ذكر معاوية …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 139، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
