label: { ar: "الموطأ 493 — سعيد بن المسيب: كان الناس يؤمرون بالأكل يوم الفطر قبل الغدو", en: "Muwatta 493", es: "Muwatta 493", fr: "Muwatta 493", ur: "موطا 493", tr: "El-Muvatta 493 — Sa’id ibn al-Musayyab: İnsanlara Ramazan Bayramı günü yatmadan önce yemek yemeleri emredildi.", id: "Al-Muwatta 493 — Sa’id ibn al-Musayyab: Orang-orang diperintahkan untuk makan pada hari raya Idul Fitri sebelum tidur." }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب أنه أخبره أن الناس كانوا يؤمرون بالأكل يوم الفطر قبل الغدو؛ قال مالك: ولا أرى ذلك على الناس في الأضحى. وهو في باب الأمر بالأكل قبل الغدو في العيد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.252}"
  tr: "Malik'in İbn Şihab'tan, o da Sa'id ibn al-Musayyab'tan rivayet ettiği bir hadiste, insanların Ramazan Bayramı günü şafak sökmeden önce yemek yemeleri emredildiği bildirilmiştir. Malik şöyle demiştir: \"Bu uygulamanın Kurban Bayramı'nda insanlar için geçerli olduğunu görmüyorum.\" Bu, bayramda şafak sökmeden önce yemek yeme emriyle ilgili bölümle ilgilidir. Editör, bunu Malik'ten Ebu Mus'ab ve Suveyd'in rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.252}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, yang memberitahukan kepadanya bahwa orang-orang diperintahkan untuk makan pada hari raya Idul Fitri sebelum subuh. Malik berkata: Saya tidak melihat praktik ini diterapkan pada orang-orang pada Idul Adha. Ini terkait dengan surah tentang perintah untuk makan sebelum subuh pada hari raya. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.252}"
