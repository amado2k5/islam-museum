summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب أنه أخبره أن الناس كانوا يؤمرون بالأكل يوم الفطر قبل الغدو؛ قال مالك: ولا أرى ذلك على الناس في الأضحى. وهو في باب الأمر بالأكل قبل الغدو في العيد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.252}"
