label: { ar: "سنن أبي داود 1700 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 1700 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 1700 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 1700 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 1700 — mentions de nations, religions et peuples non musulmans", tr: "Sunan Abi Davud 1700 — Gayrimüslim milletlerin, dinlerin ve halkların bahsi", id: "Sunan Abi Dawud 1700 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا إِسْمَاعِيلُ، أَخْبَرَنَا أَيُّوبُ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ، أَنَّهَا ذَكَرَتْ عِدَّةً مِنْ مَسَاكِينَ - قَالَ أَبُو دَاوُدَ وَقَالَ غَيْرُهُ أَوْ عِدَّةً مِنْ صَدَقَةٍ - فَقَالَ لَهَا رَسُولُ اللَّهِ \" أَعْطِي وَلاَ تُحْصِي فَيُحْصِيَ عَلَيْكِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1700، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1700 (Zakat (Kitab Al-Zakat)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1700، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1700 (Zakat (Kitab Al-Zakat)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 1700 (Zakat (Kitab Al-Zakat)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sünen Ebu Davud'da yer alan 1700 numaralı hadiste, gayrimüslim milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1700, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
