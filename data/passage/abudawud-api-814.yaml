label: { ar: "سنن أبي داود 814 — صغائر الذنوب، الصلاة المكتوبة", en: "Sunan Abi Dawud 814 — the minor sins; the prescribed prayer", ur: "سنن ابی داؤد 814 — صغیرہ گناہ، فرض نماز", fr: "Sunan Abi Dawud 814 — les péchés mineurs ; la prière prescrite", es: "Sunan Abi Dawud 814 — los pecados menores; la oración prescrita" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ سَعِيدٍ السَّرْخَسِيُّ، حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، حَدَّثَنَا أَبِي قَالَ، سَمِعْتُ مُحَمَّدَ بْنَ إِسْحَاقَ، يُحَدِّثُ عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّهُ قَالَ مَا مِنَ الْمُفَصَّلِ سُورَةٌ صَغِيرَةٌ وَلاَ كَبِيرَةٌ إِلاَّ وَقَدْ سَمِعْتُ رَسُولَ اللَّهِ يَؤُمُّ النَّاسَ بِهَا فِي الصَّلاَةِ الْمَكْتُوبَةِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 814، يرد فيه ذكر صغائر الذنوب، والصلاة المكتوبة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 814 (Prayer (Kitab Al-Salat)), whose wording mentions the minor sins, the prescribed prayer. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 814، جس کے الفاظ میں صغیرہ گناہ، فرض نماز کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 814, dont le texte mentionne les péchés mineurs, la prière prescrite. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 814, cuyo texto menciona los pecados menores, la oración prescrita. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
