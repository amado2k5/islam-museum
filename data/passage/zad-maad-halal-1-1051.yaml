text: "… إضرار ببهائمه. وأيضاً فإنه لا فائدة لهذا الإذن، لأنه ليس لصاحب الأرض منعُه مِن الدخول، بل يجبُ عليه تمكينُه، فغايةُ ما يقدر أنه لم يأذن له، وهذا حرامٌ عليه شرعاً لا يَحِلُّ له منعُه من الدخول، فلا فائدة في توقف …"
summary:
