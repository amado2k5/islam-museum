ref: "3189"
label: { ar: "البخاري 3189 — لا هجرة بعد الفتح وحرمة مكة", en: "Bukhari 3189 — No hijra after the conquest; the sanctity of Mecca" }
text: "قال رسول الله يوم فتح مكة: «لا هجرة ولكن جهاد ونية، وإذا استنفرتم فانفروا»، وقال: «إن هذا البلد حرمه الله يوم خلق السماوات والأرض، فهو حرام بحرمة الله إلى يوم القيامة، ولم يحل القتال فيه لأحد قبلي ولم يحل لي إلا ساعة من نهار»"
summary:
  ar: "في كتاب الجزية؛ رواية ابن عباس أن النبي خطب يوم فتح مكة بحرمة البلد الدائمة — لا يعضد شوكه ولا ينفر صيده ولا تلتقط لقطته إلا من عرفها — واستثنى الإذخر لقينهم وبيوتهم بطلب العباس، وأعلن انتهاء الهجرة وبقاء الجهاد والنية."
