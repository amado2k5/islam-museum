label: { ar: "البخاري 3189 — لا هجرة بعد الفتح وحرمة مكة", en: "Bukhari 3189 — No hijra after the conquest; the sanctity of Mecca", es: "Bukhari 3189 — No hay hégira después de la conquista; la santidad de La Meca", fr: "Bukhari 3189 — Pas d'hégire après la conquête; la sainteté de La Mecque", ur: "بخاری 3189 - فتح کے بعد کوئی حجرہ نہیں مکہ کی حرمت", tr: "Buhari 3189 — Fetih sonrası hicret yoktur ve Mekke'nin kutsallığı", id: "Al-Bukhari 3189 — Tidak ada hijrah setelah penaklukan dan kesucian Mekah" }
text: "قال رسول الله يوم فتح مكة: «لا هجرة ولكن جهاد ونية، وإذا استنفرتم فانفروا»، وقال: «إن هذا البلد حرمه الله يوم خلق السماوات والأرض، فهو حرام بحرمة الله إلى يوم القيامة، ولم يحل القتال فيه لأحد قبلي ولم يحل لي إلا ساعة من نهار»"
summary:
  ar: "في كتاب الجزية؛ رواية ابن عباس أن النبي خطب يوم فتح مكة بحرمة البلد الدائمة — لا يعضد شوكه ولا ينفر صيده ولا تلتقط لقطته إلا من عرفها — واستثنى الإذخر لقينهم وبيوتهم بطلب العباس، وأعلن انتهاء الهجرة وبقاء الجهاد والنية."
  tr: "Cizye Kitabı'nda İbn Abbas, Peygamber'in Mekke'nin fethi günü bir hutbe verdiğini, şehrin ebedi kutsallığını ilan ettiğini - dikenlerinin kesilmemesi, av hayvanlarının rahatsız edilmemesi ve kayıp eşyalarının ancak tanıyan biri tarafından alınması gerektiğini - ve Abbas'ın isteği üzerine demircileri ve evleri için ihkhir otuna istisna getirdiğini ve hicretin sona erdiğini, cihadın ve niyetin devam ettiğini bildirdiğini rivayet etmiştir."
  id: "Dalam kitab Jizya, Ibnu Abbas meriwayatkan bahwa Nabi memberikan khutbah pada hari penaklukan Mekah, menyatakan kesucian abadi kota itu — bahwa duri-durinya tidak boleh dipotong, hewan buruannya tidak boleh diganggu, dan harta benda yang hilang tidak boleh diambil kecuali oleh seseorang yang mengetahuinya — dan beliau membuat pengecualian untuk rumput idzkhir bagi para pandai besi dan rumah mereka atas permintaan Abbas, dan beliau mengumumkan berakhirnya hijrah dan berlanjutnya jihad dan niat."
