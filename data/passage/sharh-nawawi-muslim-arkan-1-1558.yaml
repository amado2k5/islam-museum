text: "… الباب ظاهرة في فضل إزالة الأذى عن الطريق سواء كان الأذى شجرة تؤذي أو غصن شوك أو حجراً يعثر به أو قذراً أو جيفة وغير ذلك وإماطة الأذى عن الطريق من شعب الإيمان وأزال عنهم ضررا. - حدثنا يَحْيِى ابن …"
