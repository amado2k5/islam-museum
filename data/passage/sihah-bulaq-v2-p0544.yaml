text: |-
  ٤٢
  قباد أى كثرت طر يفته وأرض-طروفة كثيرة الطريضسة قال أبويوسف والطسر يفة من
  النصىّ والصليان اذا اعتماوتما والطراف بيت من أدم وقولهم جاءفلان بطارفة عين اذاجاء
  بال كثير والطوارف من الخياء مارذعت من جوانيه للنظر الى خارج وطرفه عنه أى صرفه
  ورده ومنسه قول الشاعر
  انك واللّه لذوملة * يطرؤك الادتى عن الابعد
  بقول تصرف بصرك عنه أى تستطرف الجديد وتنسى القديم وطرف بصره يطرف طرقًا
  اذا أطبق أحد جفنيه على الآخر الواحدة من ذلك طرقة يقال أسرع من طرفة عين
  وطرفت عينه اذا أصبتها بشئ قد معت وقد ط رفت عينه فهى مطروفة والعارفة أيضانقطة
  حراء من الدم تحدث فى العين من ضرية وغيرها وقواهم لاتراه العاوارف أى العيون ويقال.
  طرف فلان اذا قاتل حول العسكولانه يحمل على طرف منهم فيردّهم الى ابنههور ومنه سخى
  لطرّف والمطرّف من الخمل بفتح الراءهو الاسض الرأس والذنب وسأرج-دء يخالف
  ذلك وكذلك اذا كان أسود الرأس والذنب ويقال للشاة التى اسودطرف ذنيها وساخرها
  أبيض مطرّقة رهف المطرهف الحسن التامّ قال الراجز
  تحب منامطر هفا فوهدا * عجزة شيفين غلاما أمردا
  (طفف الطفيق القليل وطفاف المكوك وطفافه بالكسر والفتح ماملا أصباو
  كذلك طف المكولك وطففه وفى الحديث كاكم بنوآدم طف الصاع لم علو • وهو أن يقرب
  أن يمتلئ فلا يفعل والطفة أبضااسمم وضع بناحية الكوفة والطفاف والطفافة بالضم
  ما فوف المكيال واناء لفان اذا بلغ السكيل طفافه تقول منه أطففته والتطضيف نقص المكيال
  وهو أن لا تملاه الى أصباره وقول ابن عمررضى اللّٰه عنه-ما حين ذكرأنَ النىّ صلى اللّٰه علميه
  وسلم سبق الخيل كنت فارسايوم مذ فسيقت الناس حتى طفف بى الفرس مسجد بني زريق
  حتى كاديساوى المسيد يعنى وثب بى والطفطفة الخاصرة والطفطاف أطراف الشنجر
  قال السكميت
  : أوين الى-لاطفة خضود • لأكلهن طفطاف الربول
  يعنى فراخ النعام وأنهن يأوين الى أمّ ملاطفة تكسر لهنّ أطراف الربول وهى شجر وقوليم
  خذماطف لك وأطف وإستطف أى خذما ارتفع لك وأمكن لف أبو عجرو
  يقال ذهب دمه طلفا أى (هدرا قال الأفوه الاودى"
  حكم الدهر علينا أنه • طلف مانال مناوجبار
  وااطلف أيضا العطاء والهبة يقال أطافنى وأسلفى والسلف ما يقتضى وأطلفه أى أهدره
  ( طنف الطنف بالتحريك الحيد من الجمل ورأس من رؤسه والمطنف الذى يعلوه
  قال الشنغرى
  كأن حفيف النبل من فوق ع-ها * عواز ب نحل أخطأ الغار مطنف
  والطنف أيضا افريز الحائط وكذلك السقيفة تشرع فوق باب الدار والطنف أيضا السيور
  عن أبى عبيد وضم الطاء والنون اغة فى جيع ذلك ⁦( وف)⁩ طاف حول الشّئ
