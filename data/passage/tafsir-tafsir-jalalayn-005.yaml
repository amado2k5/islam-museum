text: "نملة (في السماوات ولا في الأرض ولا أصغر من ذلك ولا أكبر إلا في كتاب مبين) بين هو اللوح الحفوظ حسن في الجنة . (٤) (ليجزي) فيها (الذين آمنوا وعملوا الصالحات أولئك لهم مغفرة ورزق كريم ) حسن في الجنة."
