label: { ar: "سنن النسائي 3476 — استحلال الشيء", en: "Sunan al-Nasa'i 3476 — treating a thing as lawful", ur: "سنن نسائی 3476 — کسی چیز کو حلال ٹھہرانا", es: "Sunan al-Nasa'i 3476 — tratar algo como lícito" }
text: "… عَمْرٍو، قَالَ سَمِعْتُ سَعِيدَ بْنَ جُبَيْرٍ، يَقُولُ سَأَلْتُ ابْنَ عُمَرَ عَنِ الْمُتَلاَعِنَيْنِ، فَقَالَ قَالَ رَسُولُ اللَّهِ لِلْمُتَلاَعِنَيْنِ \" حِسَابُكُمَا عَلَى اللَّهِ أَحَدُكُمَا كَاذِبٌ وَلاَ سَبِيلَ لَكَ عَلَيْهَا \". قَالَ يَا رَسُولَ اللَّهِ مَالِي قَالَ \" لاَ مَالَ لَكَ إِنْ كُنْتَ صَدَقْتَ عَلَيْهَا فَهُوَ بِمَا اسْتَحْلَلْتَ مِنْ فَرْجِهَا وَإِنْ كُنْتَ كَذَبْتَ عَلَيْهَا فَذَاكَ أَبْعَدُ لَكَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3476، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3476 (The Book of Divorce), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3476، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3476 (El Libro del Divorcio), menciona que se considera algo lícito. El Navegador Halal y Haram lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
