label: { ar: "صحيح البخاري 6062 — الأب والأبوة", en: "Sahih al-Bukhari 6062 — the father and fatherhood", ur: "صحیح بخاری 6062 — باپ اور والدیت", es: "Sahih al-Bukhari 6062 — El padre y la paternidad", fr: "Sahih al-Bukhari 6062 — Le père et la paternité" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا مُوسَى بْنُ عُقْبَةَ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ حِينَ ذَكَرَ فِي الإِزَارِ مَا ذَكَرَ، قَالَ أَبُو بَكْرٍ يَا رَسُولَ اللَّهِ إِنَّ إِزَارِي يَسْقُطُ مِنْ أَحَدِ شِقَّيْهِ. قَالَ \" إِنَّكَ لَسْتَ مِنْهُمْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6062، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6062 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6062، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6062 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 6062 (Les bonnes manières et la bienséance), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
