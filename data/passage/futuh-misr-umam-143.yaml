text: "… فى سنة تسع عشرة، فكسر اللّٰه بموته شوكة الروم، فرجع جمع كثير ممن كان قد توجه إلى الإسكندرية. حدثنا يحيى بن عبد اللّٰه بن بكير عن الليث بن سعد قال : مات هرقل فى سنه عشرين، وفيما فقحت قيسارية الشام …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 143، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 143, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 143 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
