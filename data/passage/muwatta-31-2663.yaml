label: { ar: "الموطأ 2663 — نافع عن ابن عمر: عمر يرى حلة سيراء تباع فيمنعه النبي من لبسها", en: "Muwatta 2663", es: "Muwatta 2663", fr: "Muwatta 2663", ur: "موطا 2663", tr: "El-Muvatta 2663 — İbn Ömer'den rivayet edildiğine göre, Nafi' şöyle buyurmuştur: Ömer, ipek bir elbisenin satıldığını gördü ve Peygamber ona bu elbiseyi giymesini yasakladı.", id: "Al-Muwatta 2663 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Umar melihat pakaian sutra yang dijual, dan Nabi melarangnya mengenakannya." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن عمر بن الخطاب رأى حلة سيراء تُباع عند باب المسجد، فقال: يا رسول الله، لو اشتريت هذه الحلة فلبستها يوم الجمعة وللوفد إذا قدموا عليك. فقال رسول الله: إنما يلبس هذه من لا خلاق له في الآخرة. ثم جاءت منها حلل فأعطى عمر منها حلة، فقال عمر: أكسوتنيها وقد قلت في حلة عطارد ما قلت؟ فقال رسول الله: لم أكسكها لتلبسها، فكساها عمر أخا له مشركا بمكة. {cite:muwatta-maruf-1997 p.504}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Ömer ibn el-Hattab, mescidin kapısında satılan ipek bir elbise gördü. \"Ey Allah'ın Resulü, keşke bu elbiseyi satın alıp cuma günleri ve sana heyetler geldiğinde giyebilsem\" dedi. Allah'ın Resulü, \"Böyle elbiseleri ancak ahirette payı olmayanlar giyer\" dedi. Sonra aynı türden daha fazla elbise getirildi ve Ömer'e bir tane verildi. Ömer, \"Atarid elbisesi hakkında söylediklerinizden sonra mı bana verdiniz?\" dedi. Allah'ın Resulü, \"Sana giymen için vermedim\" dedi. Bunun üzerine Ömer, elbiseyi Mekke'deki müşrik bir kardeşine verdi. {cite:muwatta-maruf-1997 s.504}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa Umar ibn al-Khattab melihat sehelai kain sutra dijual di depan pintu masjid. Ia berkata, “Wahai Rasulullah, seandainya aku bisa membeli kain ini dan memakainya pada hari Jumat dan ketika delegasi datang kepadamu.” Rasulullah SAW bersabda, “Hanya orang-orang yang tidak mendapat bagian di akhirat yang memakai pakaian seperti itu.” Kemudian lebih banyak kain sejenis dibawa, dan Umar diberi satu. Umar berkata, “Engkau memberikannya kepadaku setelah engkau mengatakan apa yang engkau katakan tentang pakaian Atarid?” Rasulullah SAW bersabda, “Aku tidak memberikannya kepadamu untuk dipakai.” Maka Umar memberikannya kepada saudaranya yang musyrik di Mekah. {cite:muwatta-maruf-1997 p.504}"
