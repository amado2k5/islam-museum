text: "… اللَّهِ يُفَجِّرُونَهَا تَفْجِيرًا الإنسان :،. والكأس هو الإناء فيه الشراب، ويطلق كذلك على نفس الخمر كما قال بعضهم : وَكَأَسٍ شَرِبْتُ عَلَى لَذَّةٍ وَأُخْرَى تَدَاوَيْتُ مِنْهَا بِهَا رواه مسلم الجنة وصفة نعيهما. رواه مسلم الحيض بزيادة في أوله وآخره والبغوي …"
summary:
  ar: "مقطع من كتاب الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 386، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Kitab al-Zuhd of Ahmad ibn Hanbal, scan volume 1, p. 386, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "کتاب الزہد ⁦(احمد بن حنبل)⁩، اسکین جلد 1، ص 386 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd d'Ahmad ibn Hanbal, volume numérisé 1, p. 386, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Kitab al-Zuhd de Ahmad ibn Hanbal, volumen escaneado 1, p. 386, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Ahmed ibn Hanbal'ın *Kitab al-Zuhd* (İzlahiyat Kitabı) adlı eserinin 1. cildinin 386. sayfasından, bir ağıt ve ölüm ilanı içeren bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari *Kitab al-Zuhd* (Kitab Askestisme) karya Ahmad ibn Hanbal, Jilid 1, halaman 386, yang berisi eulogi dan pengumuman kematian; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
