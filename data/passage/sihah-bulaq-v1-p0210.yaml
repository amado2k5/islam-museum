text: |-
  ⁦(فصل العين)⁩
  يض الوجوه كربمة أحسابهم • شمّ الانوفمن الطراز الاول
  أى من النط الاول ⁦( طنز)⁩ الطنز السخرية وطنز يطنز فهوطناز وأظنه- ولدا أومعربا
  صل العين جز لفجز مؤخر الشى يؤنت ويذكروهو للرجل والمرأة بجيعا وابهع
  الاجهاز والعجيزة للمرأة خاصة والعجز الضعف تقول عجزت عن كذا أعجز بالكسر عجزا ومهجزة
  ومعجزة ومهجزاومعجزا بالفتح أيضاعلى القياس وفى الحسدين لا تلذوا بدار مهجزة أى لا تقيموا
  ببلدة تعجزون فيها عن الاكتساب والتعيس وعجزت المرأة تهجز بالضم عجوزا أى مسارت عجوزا
  وعجزت بالسكسر تهجز عجزا وعجزابالضم عظمت عجيزتها قال ثعلب سمعت ابن الاعرابي يقول
  لا يقال عجز الرجل بالكسر الا اذا عظم عجزه وامرأة عجزا. عظيمة العجز والعجزاه رملة مر تفعة
  وعقاب عجزاء للقصيرة الذنب وأعجزت الرجل وجدته عاجزا وأعجزه الشى أى فاته والاعجازة
  ما تعظم يدا لمرأة عجيزتها ويحزت المرأة تعجيز اصارت عجوذا والتعجيز التنبيط وكذلك اذانسبته
  الى العجز وعاجز فلان اذا ذهب فلم يوصل اليه وانه ليهاجزالى ثقة اذا مال اليه والمهجزة واحدة
  معجزات الانبيا والعجوز المرأة الكبيرة قال ابن السكيت ولاتسل عجوزة والعامة تقوله
  والجمع عجائروعج زوفى الحديث ان الجنة لا تدخلها العجزوقد تسمى الهرعجوز العتقها والهجوز
  نصل السيف والعجوزر. لة بالدهناه قال يصف دارا
  على ظهر جرعاء العجوز كانها • دوا مررقم فى سراة قرام
  وأيام العجوز عند العرب خسة أيام صن وصنبر وأخيهما وبروم طفى الجرومكفىّ الظعن قال
  ابن كناسة هى فى نوء الصرفة وقال أبو الغون هى سبعة أيام وأنشدنى لا بن أحر
  كسع الشتاء بسبعة غبر • أيام شهاتنا من الشهر
  فاذا انتضت أيامها ومضت • صن رصنبر مع الوبر
  وبامر وأخبه مؤتمر • ومعلل وبطفى الجر
  ذهب الشتاء مولياعجلا • وأنتك واقدقدر النجر
  وأعم إز التخل أه واها وتعجزت البعيرر كبت عجزه عن يعدة وب والعجزة بالكسرآخر
  ولد الرجل يقال فلان عجزة ولد أبويه اذا كان آخرهم يستوء فيه المذكر والمؤنث وايهع
  والعجيز الذى لا يأتى النساء بالزاى والرامجميعا ⁦( جملز)⁩ ناقة عجلزة وعجلزة أى قوية شديدة
  والفتح لتميم والكسر لقيس وأرس عجلزة أيضاً قال بشر
  على شقاء عملزة وقاح
  ولا يقال للذكروعجلزة اسم رملة بالبادية ⁦(عرز )⁩ أبو عبيد المعارزة المعاندة والجانية
  رطز) عرطزلغة فى عرطس أى تنجى زز) العز خلاف الذل ومطر عز أى شديد
  وعز السىء يعزعزاوعزة وعزازة اذا قل لا يكاد يوجد فهو عزيز وعز فلان بمزعزادعزة وعزازة
  ايضا أى صار عزيزا أى قوى بعدذلة وأعزه اللّٰه وهززت عليه أيضا كرمت عليه وقوله تعالى
  فع ززنايشالث يخفف ويشدد أى قوينا وشددنا قال الاسمعى أنشدنى فيه أبوهمروبن
  العلاء للمناس أجداذارحات تعززلمها • واذاتشت بنسعهالاتنيس
  ويروى أجمداذاضحرت قوله لا تنيس أى لا ترغو وتعزز الرجل صارء زيزا وهو يعتزبفلان
  وعزعلى أن تفعل كذا وعز علىّ ذاكأى حق واشتدّوفى المشل اذاعز أخول فهن وأعزز
  قرله واخبهما هو بالتصغيراه
