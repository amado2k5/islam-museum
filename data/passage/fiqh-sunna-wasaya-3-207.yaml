  tr: "Seyyid Sabiq'in *Fıkıh el-Sünne* adlı eserinin 3. cildinin 207. sayfasından bir alıntı, vasiyetname veya son miras belgesinden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. *Vasiyetnameler, Miras, Antik Eserler ve Türbeler* tarayıcısı tarafından derlenmiştir."
