text: "… وبين الجانين والمعاتهة، فاتفقوا على أن الولاية على الجانين، والمعاتهة تثبت للأب، والجد، والوصي، الحاكم. واختلفوا فين تثبت له هذه الولاية على الصغيرة والصغير فقال الإمام مالك وأحمد : تثبيت للأب، ووصيه فقط ولا تثبت لغيرهما. وذهب الشافعي إلى أنها …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 207، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
