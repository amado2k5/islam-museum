label: { ar: "صحيح مسلم 5407 — الأب والأبوة", en: "Sahih Muslim 5407 — the father and fatherhood", ur: "صحیح مسلم 5407 — باپ اور والدیت", es: "Sahih Muslim 5407 — El padre y la paternidad", fr: "Sahih Muslim 5407 — Le père et la paternité" }
text: "وَحَدَّثَنِي ابْنُ نُمَيْرٍ، حَدَّثَنَا رَوْحٌ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا أَبُو بَكْرِ بْنُ حَفْصٍ، عَنْ سَالِمِ، بْنِ عَبْدِ اللَّهِ بْنِ عُمَرَ عَنْ أَبِيهِ، أَنَّ عُمَرَ بْنَ الْخَطَّابِ، رَأَى عَلَى رَجُلٍ مِنْ آلِ عُطَارِدٍ. بِمِثْلِ حَدِيثِ يَحْيَى بْنِ سَعِيدٍ غَيْرَ أَنَّهُ قَالَ \" إِنَّمَا بَعَثْتُ بِهَا إِلَيْكَ لِتَنْتَفِعَ بِهَا وَلَمْ أَبْعَثْ بِهَا إِلَيْكَ لِتَلْبَسَهَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5407، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5407 (The Book of Clothes and Adornment), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5407، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5407 (El Libro de la Vestimenta y el Adorno), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Le Sahih Muslim, n° 5407 (Le Livre des vêtements et des ornements), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
