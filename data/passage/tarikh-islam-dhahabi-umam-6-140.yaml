text: "… مائة ألف، عليهم السقلاب خصيٌّ لِهِرَقْل. وقال أبن الكَلّبيّ : كانت الروم ثلاثمائة ألف، عليهم باهان، رجلٌ من أبناء فارس تنصَّر ولحق بالروم، قال : وضمّ أبو عُبَيدة إليه أطرافه، وأمَدَّه عمرُ بسعيد بن عامر بن حُذَيْم، فهزم اللّه المشركين …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 140، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 140, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 140 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
