label: { ar: "الموطأ 2861 — أسماء النبي الخمسة: محمد وأحمد والماحي والحاشر والعاقب", en: "Muwatta 2861", es: "Muwatta 2861", fr: "Muwatta 2861", ur: "موطا 2861", tr: "El-Muvatta 2861 — Peygamberin Beş İsmi: Muhammed, Ahmed, El-Mahi, El-Haşir ve El-Akib", id: "Al-Muwatta 2861 — Lima Nama Nabi: Muhammad, Ahmad, Al-Mahi, Al-Hashir, dan Al-Aqib" }
summary:
  ar: "يروي مالك عن ابن شهاب، عن محمد بن جبير بن مطعم، عن أبيه أن النبي قال: لي خمسة أسماء: أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشر الذي يحشر الناس على قدمي، وأنا العاقب. ويذكر المحقق قول ابن عبد البر أن يحيى رواه مرسلا، وأن أكثر رواة الموطأ رووه كذلك، وأن رواية معن بن عيسى عن مالك موصولة إلى جبير بن مطعم، وأن البخاري أخرجها، فتكون الرواية الموصولة مقدمة. {cite:muwatta-maruf-1997 p.603} {cite:muwatta-maruf-1997 p.604}"
  tr: "Malik, İbn Şihab'dan, o da Muhammed ibn Cübeyr ibn Mut'im'den, o da babasından rivayet ederek, Peygamber'in şöyle buyurduğunu nakletmiştir: \"Beş ismim var: Ben Muhammed'im, ben Ahmed'im, ben Allah'ın küfürü sildiği el-Mahi'yim (Silici), ben insanların önünde toplanacağı el-Haşir'im (Toplayıcı) ve ben el-Akib'im (Sonuncu).\" Araştırmacı, İbn Abdülberr'in Yahya'nın bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak naklettiğine, el-Muvatta'nın ravilerinin çoğunun da bu şekilde naklettiğine, Ma'n ibn İsa'nın Malik'ten naklettiği rivayetin Cübeyr ibn Mut'im'e bağlı olduğuna ve Buhari'nin de bunu dahil ettiğine dair ifadesini aktararak, bağlı rivayetin öncelik taşıdığını belirtmektedir. {cite:muwatta-maruf-1997 s.603} {cite:muwatta-maruf-1997 s.604}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Muhammad ibn Jubayr ibn Mut'im, dari ayahnya, bahwa Nabi bersabda: \"Aku mempunyai lima nama: Aku adalah Muhammad, Aku adalah Ahmad, Aku adalah al-Mahi (Penghapus) yang melaluinya Allah menghapus kekafiran, Aku adalah al-Hashir (Pengumpul) di hadapan siapa manusia akan dikumpulkan, dan Aku adalah al-'Aqib (Yang Terakhir).\" Peneliti menyebutkan pernyataan Ibn 'Abd al-Barr bahwa Yahya meriwayatkannya sebagai mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa sebagian besar perawi al-Muwatta' meriwayatkannya dengan cara ini, dan bahwa riwayat Ma'n ibn 'Isa dari Malik terhubung dengan Jubayr ibn Mut'im, dan bahwa al-Bukhari memasukkannya, sehingga riwayat yang terhubung lebih diutamakan. {kutip:muwatta-maruf-1997 hal.603} {kutip:muwatta-maruf-1997 hal.604}"
