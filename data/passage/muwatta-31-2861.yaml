summary:
  ar: "يروي مالك عن ابن شهاب، عن محمد بن جبير بن مطعم، عن أبيه أن النبي قال: لي خمسة أسماء: أنا محمد، وأنا أحمد، وأنا الماحي الذي يمحو الله بي الكفر، وأنا الحاشر الذي يحشر الناس على قدمي، وأنا العاقب. ويذكر المحقق قول ابن عبد البر أن يحيى رواه مرسلا، وأن أكثر رواة الموطأ رووه كذلك، وأن رواية معن بن عيسى عن مالك موصولة إلى جبير بن مطعم، وأن البخاري أخرجها، فتكون الرواية الموصولة مقدمة. {cite:muwatta-maruf-1997 p.603} {cite:muwatta-maruf-1997 p.604}"
