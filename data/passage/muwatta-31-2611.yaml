label: { ar: "الموطأ 2611 — ابن عباس: عمر يرجع من سرغ عن الشام لأن الوباء وقع فيها", en: "Muwatta 2611" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبد الحميد بن عبد الرحمن بن زيد بن الخطاب عن عبد الله بن عبد الله بن الحارث بن نوفل عن ابن عباس أن عمر بن الخطاب خرج إلى الشام، حتى إذا كان بسرغ لقيه أمراء الأجناد أبو عبيدة بن الجراح وأصحابه، فأخبروه أن الوباء قد وقع بالشام. فاستشار عمر المهاجرين الأولين فاختلفوا، ثم الأنصار فاختلفوا، ثم مشيخة قريش من مهاجرة الفتح فاتفقوا على الرجوع. فنادى عمر في الناس: إني مصبح على ظهر، فأصبحوا عليه. فقال أبو عبيدة: أفرارا من قدر الله؟ فقال عمر: نفر من قدر الله إلى قدر الله. فجاء عبد الرحمن بن عوف فقال: إن عندي من هذا علما، سمعت رسول الله يقول: إذا سمعتم به بأرض فلا تقدموا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارا منه. فحمد الله عمر وانصرف. {cite:muwatta-maruf-1997 p.472} {cite:muwatta-maruf-1997 p.473}"
