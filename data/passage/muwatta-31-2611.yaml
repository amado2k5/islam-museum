label: { ar: "الموطأ 2611 — ابن عباس: عمر يرجع من سرغ عن الشام لأن الوباء وقع فيها", en: "Muwatta 2611", es: "Muwatta 2611", fr: "Muwatta 2611", ur: "موطا 2611", tr: "El-Muvatta 2611 — İbn Abbas: Ömer, veba salgını çıktığı için Sargh'tan Suriye'ye döndü.", id: "Al-Muwatta 2611 — Ibn Abbas: Umar kembali dari Sargh ke Suriah karena wabah penyakit telah terjadi di sana." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبد الحميد بن عبد الرحمن بن زيد بن الخطاب عن عبد الله بن عبد الله بن الحارث بن نوفل عن ابن عباس أن عمر بن الخطاب خرج إلى الشام، حتى إذا كان بسرغ لقيه أمراء الأجناد أبو عبيدة بن الجراح وأصحابه، فأخبروه أن الوباء قد وقع بالشام. فاستشار عمر المهاجرين الأولين فاختلفوا، ثم الأنصار فاختلفوا، ثم مشيخة قريش من مهاجرة الفتح فاتفقوا على الرجوع. فنادى عمر في الناس: إني مصبح على ظهر، فأصبحوا عليه. فقال أبو عبيدة: أفرارا من قدر الله؟ فقال عمر: نفر من قدر الله إلى قدر الله. فجاء عبد الرحمن بن عوف فقال: إن عندي من هذا علما، سمعت رسول الله يقول: إذا سمعتم به بأرض فلا تقدموا عليه، وإذا وقع بأرض وأنتم بها فلا تخرجوا فرارا منه. فحمد الله عمر وانصرف. {cite:muwatta-maruf-1997 p.472} {cite:muwatta-maruf-1997 p.473}"
  tr: "Malik, İbn Şihab'dan, o da Abdülhamid ibn Abdülrahman ibn Zeyd ibn el-Hattab'dan, o da Abdullah ibn Abdullah ibn el-Haris ibn Nevfel'den, o da İbn Abbas'tan rivayet eder ki, Ömer ibn el-Hattab Suriye'ye gitti. Sargh'a vardığında, orduların komutanları Ebu Ubeyde ibn el-Cerrah ve arkadaşları onu karşıladı ve Suriye'de bir salgın çıktığını bildirdiler. Ömer, ilk Muhacirlere danıştı, onlar da farklı görüşteydiler. Sonra Ensar'a danıştı, onlar da farklı görüşteydiler. Sonunda, Mekke'nin fethi sırasındaki Muhacirlerden Kureyş ileri gelenlerine danıştı ve onlar da geri dönmeyi kabul ettiler. Ömer halka seslendi: \"Şafak vakti yola çıkacağım, siz de şafak vakti yola çıkın.\" Ebu Ubeyde dedi ki: \"Allah'ın hükmünden mi kaçıyoruz?\" Ömer şöyle cevap verdi: \"Biz Allah'ın hükmünden Allah'ın hükmüne kaçıyoruz.\" Sonra Abdurrahman ibn Avf geldi ve dedi ki: \"Bunu biliyorum. Allah Resulü'nün şöyle dediğini işittim: 'Eğer bir yerde bunu duyarsanız, oraya gitmeyin; eğer bulunduğunuz yerde bir şey çıkarsa, ondan kaçmayı bırakmayın.'\" Bunun üzerine Ömer Allah'a hamd etti ve oradan ayrıldı."
  id: "Malik meriwayatkan dari Ibn Shihab, dari Abd al-Hamid ibn Abd al-Rahman ibn Zayd ibn al-Khattab, dari Abdullah ibn Abdullah ibn al-Harith ibn Nawfal, dari Ibn Abbas, bahwa Umar ibn al-Khattab pergi ke Suriah. Ketika ia sampai di Sargh, para komandan pasukan, Abu Ubaydah ibn al-Jarrah dan para sahabatnya, menemuinya dan memberitahunya bahwa wabah penyakit telah terjadi di Suriah. Umar berkonsultasi dengan kaum Muhajirin (imigran) terdahulu, dan mereka berbeda pendapat. Kemudian ia berkonsultasi dengan kaum Ansar (penolong), dan mereka juga berbeda pendapat. Akhirnya, ia berkonsultasi dengan para tetua Quraisy dari kalangan Muhajirin penaklukan (Mekah), dan mereka setuju untuk kembali. Umar menyerukan kepada orang-orang: “Aku akan berangkat pada waktu subuh, maka berangkatlah pada waktu subuh.” Abu Ubaydah berkata: “Apakah kita melarikan diri dari ketetapan Allah?” Umar menjawab: “Kita melarikan diri dari ketetapan Allah menuju ketetapan Allah.” Kemudian Abd al-Rahman ibn Awf datang dan berkata: “Aku mengetahui hal ini. Aku mendengar Rasulullah SAW bersabda: ‘Jika kalian mendengar tentang hal itu di suatu negeri, janganlah kalian pergi ke negeri itu, dan jika hal itu terjadi di negeri tempat kalian berada, janganlah kalian berhenti melarikan diri darinya.’” Maka Umar memuji Allah dan pergi."
