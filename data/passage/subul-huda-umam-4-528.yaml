text: "… وهو أَول من سَنَّ الرحلتين، رحلة الشتاء إلى الحبشة ورحلة الصيف إِلى الشام. قال الرشاطى : كانت قريش تجارتهم لا تَعْدو مكة، وكانت الأَعاجم تَقْدَم عليهم بالسلع فيشترون منهم، حتى ركب هاشم إلى الشام فنزل بقيصر وكان كل يوم يذبح …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 528، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
