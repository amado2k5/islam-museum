label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 194 — قراءات القرآن، جمع القرآن والمصاحف", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 194 — the readings of the Qur'an; the collection of the Qur'an and the codices", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 194 — قرآن کی قراءتیں، جمعِ قرآن اور مصاحف", es: "Al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, escaneo del volumen 1, pág. 194: las lecturas del Corán; la colección del Corán y los códices.", fr: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 194 — les lectures du Coran; le recueil du Coran et les codex", tr: "El-Zarkashi'nin \"El-Burhan fi Ulum al-Qur'an\" adlı eserinin resimli 1. cildinin 194. sayfası — Kur'an Okumaları, Kur'an Derlemeleri ve Kur'an Kopyaları", id: "Al-Burhan fi Ulum al-Qur'an karya al-Zarkashi, Jilid Bergambar 1, hlm. 194 — Bacaan Al-Qur'an, Kompilasi Al-Qur'an dan Salinan Al-Qur'an" }
text: "… إلى الحديث عن جمع القرآن ودور عثمان واختلاف القراءات والمجاز. ويعقد فصلاً عن التفسير نشأته واتجاه وتطوره يشير إلى المعنى اللغوى لكلمة النص ثم المحكم والمتشابه ورأى الراغب فى معنى كلمة التفسير والتأويل. ثم يتحدث عن حاجة المجتمع إلى التفسير …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 194، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 194, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 194 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, volumen 1, pág. 194, que menciona las lecturas del Corán, su recopilación y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre d'al-Zarkashi, *al-Burhan fi 'Ulum al-Qur'an*, volume 1, page 194, mentionnant les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Zarkashi'nin \"Al-Burhan fi Ulum al-Qur'an\" adlı eserinin 1. cildinin 194. sayfasından, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları hakkında bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 1, halaman 194, membahas bacaan Al-Qur'an, penyusunan Al-Qur'an, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
