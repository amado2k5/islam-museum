text: "… ؛ ومالك بن مَسعود ؛ وهؤلاء بنو البَدىّ. حدّثنى أُبَيّ بن عَبّاس بن سَهْل، عن أَبيه، عن جدّه، قال : تجهَّز سعد ابن مالك يخرج إلى بدر فمرض فمات، فموضع قبره عند دار ابن فارط، فأَسهم له النبيّ بسهمه وأَجره. …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 168، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 168, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 168 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
