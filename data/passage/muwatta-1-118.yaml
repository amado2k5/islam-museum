text: "توضأ واغسل ذكرك ثم نم"
summary:
  ar: "أول حديث في باب وضوء الجنب إذا أراد أن ينام أو يطعم قبل أن يغتسل. يرويه يحيى عن مالك عن عبد الله بن دينار عن عبد الله بن عمر: ذكر عمر بن الخطاب للنبي أنه تصيبه الجنابة من الليل، فأمره أن يتوضأ ويغسل ذكره ثم ينام. ويخرّجه المحقق عند البخاري (290) ومسلم (1/171) وأبي داود (221) والنسائي (1/140) وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن هذا الإسناد هو المحفوظ عند أكثر الرواة، وأن طائفة روته بلفظ أن عمر قال: يا رسول الله، وأن إسحاق الطباع وجماعة رووه عن مالك عن نافع عن ابن عمر، وحديث نافع عند العلماء كالمستغرب (التمهيد 17/32–33). {cite:muwatta-maruf-1997 p.92} {cite:muwatta-maruf-1997 p.93}"
