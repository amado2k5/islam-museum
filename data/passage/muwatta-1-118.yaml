label: { ar: "الموطأ 118 — عمر تصيبه الجنابة من الليل: توضأ واغسل ذكرك ثم نم", en: "Muwatta 118", es: "Muwatta 118", fr: "Muwatta 118", ur: "موطا 118", tr: "Al-Muwatta 118 — Ömer geceleyin ritüel olarak kirlenir: Abdest al ve cinsel organlarını yıka, sonra uyu.", id: "Al-Muwatta 118 — Umar menjadi najis secara ritual di malam hari: Berwudhu dan bersihkan kemaluanmu, lalu tidurlah" }
text: "توضأ واغسل ذكرك ثم نم"
summary:
  ar: "أول حديث في باب وضوء الجنب إذا أراد أن ينام أو يطعم قبل أن يغتسل. يرويه يحيى عن مالك عن عبد الله بن دينار عن عبد الله بن عمر: ذكر عمر بن الخطاب للنبي أنه تصيبه الجنابة من الليل، فأمره أن يتوضأ ويغسل ذكره ثم ينام. ويخرّجه المحقق عند البخاري (290) ومسلم (1/171) وأبي داود (221) والنسائي (1/140) وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن هذا الإسناد هو المحفوظ عند أكثر الرواة، وأن طائفة روته بلفظ أن عمر قال: يا رسول الله، وأن إسحاق الطباع وجماعة رووه عن مالك عن نافع عن ابن عمر، وحديث نافع عند العلماء كالمستغرب ⁦(التمهيد 17/32–33)⁩. {cite:muwatta-maruf-1997 p.92} {cite:muwatta-maruf-1997 p.93}"
  id: "Hadits pertama dalam surah ini membahas tentang wudhu bagi orang yang dalam keadaan junub (najis) jika ia ingin tidur atau makan sebelum mandi wajib (ghusl). Hadits ini diriwayatkan oleh Yahya dari Malik, dari Abdullah ibn Dinar, dari Abdullah ibn Umar: Umar ibn al-Khattab menyebutkan kepada Nabi (shalawat dan salam kepadanya) bahwa ia mengalami najis di malam hari, maka beliau menyuruhnya untuk berwudhu, membersihkan kemaluannya, lalu tidur. Hadits ini terdapat dalam kumpulan hadits al-Bukhari (290), Muslim (1/171), Abu Dawud (221), al-Nasa'i (1/140), dan Ahmad, melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa sanad ini adalah sanad yang paling banyak diwariskan, dan bahwa sekelompok perawi meriwayatkannya dengan redaksi bahwa Umar berkata: \"Wahai Rasulullah.\" Diriwayatkan juga bahwa Ishaq al-Tabba' dan sekelompoknya meriwayatkan hadits ini dari Malik, dari Nafi', dan dari Ibnu Umar. Hadits Nafi' dianggap langka oleh para ulama (al-Tamhid 17/32–33). {cite:muwatta-maruf-1997 p.92} {cite:muwatta-maruf-1997 p.93}"
