text: "… الناس وثناءهم عليه وإكرامهم له، وهذا هو عين الحسد وهو غير الغضب والحقد، فإنّ ذلك يستدعى جناية من المغضوب عليه، والحسد قد يكون مع الصديق المحسن والرفيق الموافق. السابع : اللعب والهزل والمطايبة وتزجية الوقت بالضحك، فيذكر عيوب غيره بما …"
