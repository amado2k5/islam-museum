text: "… كِتَابُ النَّبِيِّ وَلِ قَبْلَ وَفَاتِهِ بِشَهْرَيْنِ. سَمِعْتُ أَحْمَدَ بنَ الحَسَنِ يَقُولُ: كَانَ أَحْمَدُ بنُ حَنْبَلٍ يَذْهَبُ إِلَى هَذَا الحَدِيثِ لِمَا ذُكِرَ فِيهِ قَبْلَ وَفَاتِهِ بِشَهْرَيْنِ، وَكَانَ يَقُولُ : هَذَا آخِرُ أَمْرِ النَّبِيِّ. ثُمَّ تَرَكَ أَحْمَدُ بنُ حَنْبَلٍ هَذَا الحَدِيثَ لَمَّا …"
summary:
