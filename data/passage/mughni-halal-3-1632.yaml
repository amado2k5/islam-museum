text: "… وَلا تُؤْمَنُ مَعَهُ الَّهْوَةُ وَمُوَاقَعَةُ الْمَحْظُورِ، فَحُرِّمَ النَّظّرُ الَيْهِ كَمَا تَحْتَ السَّرَّةِ. فصل ذوات المحارم وَذَوَاتُ مَحَارِمِهِ: كُلُّ مَنْ حُرِّمَ عَلْهِ نِكَاحُهَا عَلَى التَّأْبِيدِ، بِنَسَبِ أَوْ رَضَاعِ أَدْ تَحْرِيمِ الْمُصَاهَرَةِ بِسَبَبِ مُبَاحٍ لِمَا ذَكَرْنَا مِنْ حَدِيثِ سَالِمٍ وَزَيْنَبَ. وَعَنْ عَائِمَةَ …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1632، يذكر ما حُرّم، والتحريم، والمحرمات، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
