text: |-
  ٤٦٠٠
  • ⁦(فصل الحام)⁩.
  لادر درى ان أطعمت ناراهم • قرف الحتى وعندى البر مكنوز
  رحنوت هدب الكساء حنوا اذا كففته ملزقابه يهمزولا يهمز حنا حنافى وجهه التراب
  يحنوويحى -نوا وحدا وتحشا وحثوت لاذا أعطيته شيأيسيرا وأرض حنواءكثيرة
  التراب والمق دقاق التين قال الراجزه كانه غرارة ملاى حتى* جا جوت بالمكان
  أنت به قال الهجاج • فهن يعكفن به اذاجاء وكذلك تحعيت به وتحجيت الشى تعمدته
  قال ذو الرمّة يصف حرا فجاءت بأغباش تحجى شريعة • بلاداعليها رميها واعتدالها
  وحجوت بالشئ ضنفت به وبد سمى الرجل حموة والحجاة النفاخة تكون فوق الماء من قطر المطرا
  وجمهاجا والجاأيضا الناحية والجم-ع أحجاه قال ابن مقبل
  لا تحرز المرأجاء البلادولا • تبنى له فى السموات السلاليم
  ويروى أعناه قال الفراء بهيت بالذى بالكسر أى أولعت به ولزمته يهمزولايه مزوكذلك
  تحجيت به قال ابن أحر
  أسم دعاء عاذلتى تحجى • باخرناوتنسى أولينا
  يقال تحجيت بهذا المكان أى سبقتكم اليه ولزمته قبلكم وجت الريح السفيئة ساقتها
  ويقال عنهم أهبة يتهاجون بها وحاجيته فحجوته اذاداعبته تغلبته والاسم الحماوالاعجيا
  قسال جماكما كذاوكذا وهى لعمة وأغلوطة يتعاطاها الناس بنهم قالى أبو عبيدهونحو
  قوله-م أخرج ما فى يدى ولك كذا وتقول أيضا أنا جياك فى ه_ذا الامر أى من يحا جبك
  والججا العقل وهوجى بذا على فعيل أى خليق وج بذال وجى بذاك كلس عنى الا أنك اذا
  نحت الجيم لم نثن ولم تؤنت ولم تجمع كماقلناه فى قن وكذلك اذا قلت انه لمحجاة أن يفعل ذالن أى
  مقمنة وانه -لمحجاة وانم لمحجاة وما أحجاه اذلك الامر أى ما أخلقه وأج به أى أخلق بدوانى
  أججوبه خيرا أى أظنّ وحجا ارجل القوم كذاوكذا أى حزاهم وظهم كذلك ⁦( دا)⁩
  الحدوسوق الابل والغناءلها وقد -دوت الابل حدواو-داء ويقال للشمال-دواء لانما
  تحدو: لسحاب أى تسوقه قال الهجاج* -دواء جاءت من بلاد العور» ولا يقال للمذكر
  أ-دى وربماقيل للعماراذاقدم آتنهحاد قال ذوالرمّة•حادى ثلاث من الحقب السماحيج
  وتحديت فلانا اذا باريته فى فعسل ونازعته الغلبة يقال أفاحدياك أى ابرزلى وحدك قال
  عمروبن كلنوم
  حديا الناس كلهم جيعا * مقارعة بنيهم عن بنينا
  وقوله-م حادى عشر مقلوب من واحدلات تقدير واحدفاعل فأخر الفاء وهو الوا وفقليت ياء
  لانكسازما قبلها وقدم العين فصارتقديره عالف ذا) حذوت النعل بالتعل حذوا
  اذا قدرت كل واحدة على صاحبتها يقال حذ والقسذة بالقدة قال ابن السكيت حذوته أى
  قعدت عهذاته وحذى الخلّ فايحذيه حذيا اذا قرمه وقال هذا شراب يهذى اللسان
  وحذيت يده بالسكين أى قطعتها وحدت الشغفرة النعل قطعتها وحذيت الشاة تحذى حذى
  مقصور وهو أن ينقطع سلاهافى بطنها فتشتكى والحذاء النعل واحتذى انتعل وقال
  كل الحذاء يحتذى الحافى الوقع• والحذاء ما وطى عليه البعير من خفه والفرس من حافره
  وفى الحديث معها حذاؤها وسقاؤها وأحذيته نعلااذا أعطمته نعلاتول منه استحذيته
  فاحدانى
