text: |-
  ٢٠١٠
  وكذلك السأمة بقال قعد فلان شأمة ويقال يافلان شائم بأصحابك أى خذبهم شأمة
  أى ذات الشمال ونظرت يمنة وشأمة والشوم نقيض المن يقال رجل مشوم ومشؤم.
  والاشائم نقيض الايامن ويقال ما أشأم فلانا والعياتة تقول ما أيشمه وقدشأم فلان
  على قومه يشأمهم فهوشائم اذا جرّ عليهم الشوم وقدشيم عليهم فهومشؤم اذا صبارشؤما
  عليهم وقوم مشاتيم وأنت_دأيومهدى
  مشائيم ليسوا مصلحين عشيرة • ولاناعب الابشوم غراجها
  ردّنا عبا على موضع مصلهين وموضعه خفض بالباء أى ليوا بصلحين لانْ قولك ليسوا
  مصلحين وليسوا بصلمين معناهما واحد وقد تشاء موابه وأمّاقول زهير
  فتنتج لكم غلمان أشأم كلهم • كأحرعاد ثم ترضع فتقطم
  فهو أفعل بمعنى المص-درلانه أراد غلمان شؤم فجعل اسم الشوم أشأم كماجعلوا اسم الضر
  الضرّاء فلهذالم بقولو اشأماء كمالم يقولوا أضرّ للمذكراذ كان لا يقع بين مؤتسه ومذكره
  فصل لانه بمعنى المصدر وتشأم الرجل تنسب الى الشأم مثل تقيس وتكوّف وأشأم الرجل
  اذا أتى الشأم وقال «صرمت حبالث فى انخليط المشتم* ⁦(شيم)⁩ الشيم بالتحريك البرد
  يقال غداة ذات شيم وقدشيم الماء باليكسر فهوشيم أبو عمر والشبم الذى يجد البردمع
  الجوع وأنشد بعينى قطامى نمافوق مرقب * غداشما ينقض بين الهجارس
  والشمام خشبة تعرض فى فم الجدى لثلار تضع والشبامان خيطان فى البرقع تشدّه المرأة
  جهما فى قفاها والشبام حى من العرب برم لشبرم حب تشبيه بالحص قال عنترة
  تسعى جلائلنا الى جتمانه * تجن الار اكتفيئة والتبرم
  نفيئة من الفوالشبرم من الرجال القصير والبخيل أيضا وأنشدلهميان السعدى
  مامنهم الالتيم شبرم• وشبرعة اسم رجل وشبرمان موضع وقال يصف جيرا.
  ترفع فى كل رقاق قسطلا * فصححت من شبرمان منهلا
  تم لشتم السب والاسم البشتيمة والتشاتم التساب والمشائمة المسابة والنقيم الرجل
  لكريه الوجه وكذلك الاسديقال رجل شقيم الحيا وقد شم بالضم شتامة حم) الشحم
  معروف والشحمة أخص منه وشحمة الارض الكمأة البيضاء وشحمة الآذن معلق القرط
  ورجل مشحم كثير الشحم في بيته وشبهيم أى سمين وقدشهم بالضم وشحم بالفتح فلان أصحابه
  أطعمهم الشحم فهوشاحم وشهام يبيعه وشهم يشتهيه وقد شيم بالكسر ⁦( خم)⁩ أشخم
  اللبن تغيرت رائحته وشخم الطعام بالفتح وشخم بالمكسر اذا فسد وشخمه غيره وقال
  ولئة قد تتنت مشخمة* أى قاسدة ⁦( دقم)⁩ شدقم اسم خل كان للتعمان بن المندرتنسب
  اليه الشدقيات من الابل قال الكميت
  غريرية الانساب أوشدقية * يصلى الى البيد الفدافد فدفدا
  والشدقم الواسع الشدق والميم زابدة ذم لشيذمان بضم الذال الذئب رم
  الشروم والشريم المرأة المفضاة وشرم من البحر خليج منه وعشب شرم كثير يؤ كل أعلاء
  ولا يحتاج إلى أوساطه وأصوله والشرم مصدرشرمه أى شقه وقال
  ٧٦
