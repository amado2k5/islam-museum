label: { ar: "الموطأ 1564 — مالك: إذا ملكت المرأة زوجها العبد أو الزوج يملك امرأته، فذلك فسخ بغير طلاق، ولا يتراجعان إلا بنكاح جديد", en: "Muwatta 1564" }
summary:
  ar: "يقول مالك في العبد إذا ملكته امرأته، أو الزوج يملك امرأته، إن ملك كل واحد منهما صاحبه يكون فسخا بغير طلاق، فإن تراجعا بنكاح بعد لم تكن تلك الفرقة طلاقا. وإذا أعتقته امرأته وهي في عدة منه لم يتراجعا إلا بنكاح جديد. {cite:muwatta-maruf-1997 p.51}"
