label: { ar: "الموطأ 1564 — مالك: إذا ملكت المرأة زوجها العبد أو الزوج يملك امرأته، فذلك فسخ بغير طلاق، ولا يتراجعان إلا بنكاح جديد", en: "Muwatta 1564", es: "Muwatta 1564", fr: "Muwatta 1564", ur: "موطا 1564", tr: "El-Muvatta 1564 — Malik: Eğer bir kadın köle kocasına sahipse veya bir koca karısına sahipse, bu boşanma olmaksızın evliliğin iptali demektir ve ancak yeni bir evlilik sözleşmesiyle barışabilirler.", id: "Al-Muwatta 1564 — Malik: Jika seorang wanita memiliki suami budaknya, atau seorang suami memiliki istrinya, ini adalah pembatalan tanpa perceraian, dan mereka tidak dapat berdamai kecuali dengan kontrak pernikahan baru." }
summary:
  ar: "يقول مالك في العبد إذا ملكته امرأته، أو الزوج يملك امرأته، إن ملك كل واحد منهما صاحبه يكون فسخا بغير طلاق، فإن تراجعا بنكاح بعد لم تكن تلك الفرقة طلاقا. وإذا أعتقته امرأته وهي في عدة منه لم يتراجعا إلا بنكاح جديد. {cite:muwatta-maruf-1997 p.51}"
  tr: "Malik, karısının kölesi olan veya karısının sahibi olan bir koca hakkında şöyle der: Eğer her ikisi de birbirine sahipse, bu boşanma olmaksızın evliliğin sona ermesi anlamına gelir. Eğer daha sonra yeniden evlenirlerse, bu ayrılık boşanma sayılmaz. Ve eğer karısı iddet süresi içinde onu azat ederse, yeni bir evlilik dışında yeniden evlenemezler. {cite:muwatta-maruf-1997 s.51}"
  id: "Malik berkata mengenai seorang budak yang dimiliki oleh istrinya, atau seorang suami yang memiliki istrinya, bahwa jika masing-masing dari mereka memiliki yang lain, maka hal itu merupakan pembubaran perkawinan tanpa perceraian. Jika mereka menikah lagi setelah itu, perpisahan tersebut tidak dianggap sebagai perceraian. Dan jika istrinya membebaskannya saat ia sedang dalam masa iddah, mereka tidak dapat menikah lagi kecuali melalui pernikahan baru. {cite:muwatta-maruf-1997 p.51}"
