label: { ar: "صحيح البخاري 4421 — الأب والأبوة", en: "Sahih al-Bukhari 4421 — the father and fatherhood", ur: "صحیح بخاری 4421 — باپ اور والدیت", es: "Sahih al-Bukhari 4421 — El padre y la paternidad", fr: "Sahih al-Bukhari 4421 — Le père et la paternité" }
text: "… عَبْدِ الْعَزِيزِ بْنِ أَبِي سَلَمَةَ، عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ، عَنْ نَافِعِ بْنِ جُبَيْرٍ، عَنْ عُرْوَةَ بْنِ الْمُغِيرَةِ، عَنْ أَبِيهِ الْمُغِيرَةِ بْنِ شُعْبَةَ، قَالَ ذَهَبَ النَّبِيُّ لِبَعْضِ حَاجَتِهِ، فَقُمْتُ أَسْكُبُ عَلَيْهِ الْمَاءَ ـ لاَ أَعْلَمُهُ إِلاَّ قَالَ فِي غَزْوَةِ تَبُوكَ ـ فَغَسَلَ وَجْهَهُ، وَذَهَبَ يَغْسِلُ ذِرَاعَيْهِ فَضَاقَ عَلَيْهِ كُمُّ الْجُبَّةِ، فَأَخْرَجَهُمَا مِنْ تَحْتِ جُبَّتِهِ فَغَسَلَهُمَا ثُمَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4421، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4421 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4421، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4421 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4421 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
