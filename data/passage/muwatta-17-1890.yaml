label: { ar: "الموطأ 1890 — يحيى عن مالك عن محمد بن عبد الله بن أبي مريم: سأل سعيد بن المسيب عن شراء الطعام بالجار، فيشتري بدينار ونصف درهم، فهل يعطى بالنصف طعاما؟ فقال سعيد: لا، بل أعط درهما وخذ بقيته طعاما", en: "Muwatta 1890", es: "Muwatta 1890", fr: "Muwatta 1890", ur: "موطا 1890", tr: "El-Muvatta 1890 — Yahya, Malik'ten, o da Muhammed ibn Abdullah ibn Abi Maryam'dan rivayetle: Said ibn el-Musayyab, bir komşusundan yiyecek satın almak hakkında sordu; bir buçuk dinara yiyecek alıyor. Miktarın yarısını yiyecek olarak vermeli mi? Said dedi ki: Hayır, bir dirhem ver ve geri kalanını yiyecek olarak al.", id: "Al-Muwatta 1890 — Yahya, dari Malik, dari Muhammad ibn Abdullah ibn Abi Maryam: Saeed ibn al-Musayyab bertanya tentang membeli makanan dari tetangga, lalu ia membelinya seharga satu dinar dan setengah dirham. Haruskah ia memberikan setengahnya dalam bentuk makanan? Saeed berkata: Tidak, lebih baik berikan satu dirham dan ambil sisanya sebagai makanan." }
summary:
  ar: "يروي يحيى عن مالك عن محمد بن عبد الله بن أبي مريم أنه سأل سعيد بن المسيب فقال: إني رجل أبتاع الطعام يكون من الصكوك بالجار، فربما ابتعت منه بدينار ونصف درهم، أفأعطى بالنصف طعاما؟ فقال سعيد: لا. ولكن أعط أنت درهما، وخذ بقيته طعاما. {cite:muwatta-maruf-1997 p.176}"
  tr: "Yahya, Malik'ten, o da Muhammed ibn Abdullah ibn Abi Maryam'dan rivayet ettiğine göre, Said ibn el-Musayyab'a şöyle sordu: \"Komşumdan veresiye yiyecek alıyorum ve bazen bir buçuk dinara alıyorum. Miktarın yarısını yiyecek olarak mı vermeliyim?\" Said şöyle cevap verdi: \"Hayır. Ama bir dirhem ver, geri kalanını yiyecek olarak al.\" {cite:muwatta-maruf-1997 s.176}"
  id: "Yahya meriwayatkan dari Malik, dari Muhammad ibn Abdullah ibn Abi Maryam, bahwa ia bertanya kepada Saeed ibn al-Musayyab, katanya: “Saya seorang pria yang membeli makanan dari tetangga secara kredit, dan terkadang saya membelinya seharga satu dinar dan setengah dirham. Haruskah saya memberikan setengahnya dalam bentuk makanan?” Saeed menjawab: “Tidak. Tetapi kamu berikan satu dirham, dan ambil sisanya sebagai makanan.” {cite:muwatta-maruf-1997 p.176}"
