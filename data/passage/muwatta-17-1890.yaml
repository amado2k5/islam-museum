label: { ar: "الموطأ 1890 — يحيى عن مالك عن محمد بن عبد الله بن أبي مريم: سأل سعيد بن المسيب عن شراء الطعام بالجار، فيشتري بدينار ونصف درهم، فهل يعطى بالنصف طعاما؟ فقال سعيد: لا، بل أعط درهما وخذ بقيته طعاما", en: "Muwatta 1890" }
summary:
  ar: "يروي يحيى عن مالك عن محمد بن عبد الله بن أبي مريم أنه سأل سعيد بن المسيب فقال: إني رجل أبتاع الطعام يكون من الصكوك بالجار، فربما ابتعت منه بدينار ونصف درهم، أفأعطى بالنصف طعاما؟ فقال سعيد: لا. ولكن أعط أنت درهما، وخذ بقيته طعاما. {cite:muwatta-maruf-1997 p.176}"
