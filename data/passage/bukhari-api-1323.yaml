label: { ar: "صحيح البخاري 1323 — قيراط الأجر", en: "Sahih al-Bukhari 1323 — the qirat of reward", ur: "صحیح بخاری 1323 — اجر کا قیراط" }
text: "حَدَّثَنَا أَبُو النُّعْمَانِ، حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، قَالَ سَمِعْتُ نَافِعًا، يَقُولُ حُدِّثَ ابْنُ عُمَرَ، أَنَّ أَبَا هُرَيْرَةَم ـ يَقُولُ مَنْ تَبِعَ جَنَازَةً فَلَهُ قِيرَاطٌ. فَقَالَ أَكْثَرَ أَبُو هُرَيْرَةَ عَلَيْنَا. فَصَدَّقَتْ ـ يَعْنِي عَائِشَةَ ـ أَبَا هُرَيْرَةَ وَقَالَتْ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُهُ. فَقَالَ ابْنُ عُمَرَما ـ لَقَدْ فَرَّطْنَا فِي قَرَارِيطَ كَثِيرَةٍ. {فَرَّطْتُ} ضَيَّعْتُ مِنْ أَمْرِ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1323، يذكر قيراط الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1323, that speaks of the qirat of reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1323، جس میں اجر کا قیراط کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
