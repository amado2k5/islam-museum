text: "… تقدم من ذنبه وما تأخر، وبايعوا بيعة الرضوان، واطعموا نخيل خيبر، وظهرت الروم على فارس، وفرح المؤمنون بتصديق كتاب اللّٰه، وظهور أهل الكتاب على المجوس. الفتح -. الفتح -."
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 2، ص 166، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
