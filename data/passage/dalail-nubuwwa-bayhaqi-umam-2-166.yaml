  tr: "El-Beyhakî'nin \"Dala'il al-Nubuwwah\" (Peygamberliğin Delilleri) adlı eserinin 2. cildinin 166. sayfasından, gayrimüslim milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Gayrimüslim Milletler, Dinler, Mezhepler ve Halklar\" tarayıcısı tarafından derlenmiştir."
