label: { ar: "الموطأ 2431 — مالك: نبش القبور وقطع يد النابش إذا أخرج ما يجب فيه القطع", en: "Muwatta 2431" }
summary:
  ar: "قال مالك: الأمر عندنا في الذي ينبش القبور أنه إذا بلغ ما أُخرج من القبر ما يجب فيه القطع، فعليه القطع؛ لأن القبر حرز لما فيه، كما أن البيوت حرز لما فيها، ولا يجب عليه القطع حتى يخرج به من القبر. {cite:muwatta-maruf-1997 p.403}"
