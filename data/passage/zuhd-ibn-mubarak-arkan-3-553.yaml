text: "… أخبرنا سليمان التيمى عن إبراهيم بن إسماعيل عن أبى رواه مسلم عن أبى هريرة أن رسول اللّه قال : لا يدخل الجنة من لا يأمن جاره بوائقه الإيمان ورواه البخارى عن أبى شريح عن النبى قال : والله لا يؤمن …"
summary:
