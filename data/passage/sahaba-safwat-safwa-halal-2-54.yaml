text: "… يعنيه والثالث قوله لا يكون المؤمن مؤمنا حتى يرضى لأخيه ما يرضاه لنفسه والرابع قوله الحلال بين والحرم بين وبين ذلك امور مشتبهات الحديث - عبيد العلّه بن احمد بن يعقوب المقرى قال اخبرنى عمد بن بكر بن عبد الرزاق …"
