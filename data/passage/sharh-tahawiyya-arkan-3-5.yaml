text: "… يُعَبَّرُ عنها بالأركان، وكلمة الأركان سواءً أركان الإسلام، أو أركان الإيمان، أو غير ذلك هي تسمية اصطلاحية، لم يأتِ بها الدّليل أنَّ هذا ركن. فالأدلة ليس فيها تفريق في المباني ما بين الركن وما بين غيره من حيث التّسمية. وفي …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 3، ص 5، يذكر أركان الإسلام، وأركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 3, p. 5, that mentions the pillars of Islam, the pillars of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 3، ص 5 کا اقتباس جس میں ارکانِ اسلام، ارکانِ ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
