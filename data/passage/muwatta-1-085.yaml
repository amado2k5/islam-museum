label: { ar: "الموطأ 85 — مالك فيمن غسل قدميه ثم لبس خفيه ثم استأنف الوضوء", en: "Muwatta 85", es: "Muwatta 85", fr: "Muwatta 85", ur: "موطا 85", tr: "El-Muvatta 85 — Malik, ayaklarını yıkayıp, çoraplarını giyip, sonra tekrar abdest alan kimse hakkında.", id: "Al-Muwatta 85 — Malik tentang orang yang mencuci kakinya, kemudian memakai kaus kaki, lalu berwudhu lagi" }
summary:
  ar: "فتوى لمالك في باب ما جاء في المسح على الخفين: سُئل عن رجل غسل قدميه ثم لبس خفيه ثم استأنف الوضوء، فقال: لينزع خفيه ثم ليتوضأ وليغسل رجليه. {cite:muwatta-maruf-1997 p.79}"
  tr: "Malik'in çorapla abdest alma konusunda rivayet edilen bir fetvası: Ona, ayaklarını yıkadıktan sonra çoraplarını giyen ve daha sonra tekrar abdest alan bir adam soruldu. Malik şöyle buyurdu: Önce çoraplarını çıkarmalı, sonra abdest almalı ve ayaklarını yıkamalıdır. {cite:muwatta-maruf-1997 s.79}"
  id: "Fatwa Malik mengenai apa yang diriwayatkan tentang mengusap kaus kaki: Beliau ditanya tentang seorang pria yang mencuci kakinya, kemudian memakai kaus kakinya, lalu berwudhu lagi. Beliau berkata: Dia harus melepas kaus kakinya, kemudian berwudhu dan mencuci kakinya. {cite:muwatta-maruf-1997 p.79}"
