  على خلافه وبرست وتجترّست أى مكامت بشئء وتنفمت أبو عرو المجرس بفتح الراه الذى
  قد جزب الاموريقال جرّسته الامود أى جرمّه وأحكمته قال العجاج
  والعصر قيل هذه العصور • مجزسات غزة الغرير • بالاجر والريم على المزجود
  قول قد حرّست الفرّة بالزجر عمالا يجب اتيمائه ⁦(جرجس )⁩ الجرجس لغة فى القرقس وهو
  االبعوض الصغار قال شريح بن حراش الكاب
  مض بنجد لم يتى نواطرا • ارع ولم يدرج عليهن جرجسر
  أحب البنامن سواكن قرية • منج-لة داياتم ا تسكتس
  وجوجيس اسم ني عليه السلام ⁦(برفس)⁩ الجرفاس الضضم ويقال الغليظ الشدي
  س جسه بيده واجته أى مسه والجة الموضع الذى يجسه الطبيب وفى المثلى
  أفواهها مجاسهالان الابل اذا أحسفت الاكل اكتف الناظر اليم إبذل فى معرفة -منها من
  أن يجسها وجست الاخباروتجتها أى:فحدث عنها ومنه الحاسوس وحكر عن الخليل
  الجواس الحواص وقال ابن دريد قد يكون الجسر بالعين وأنتسد
  فاعصوصبوائم جمو بأعينهم • ثم اختفوه وقرن الشمير قدرالا
  وجساس بن مرة الشيباتى قاتل كليب وائل عس) الاسمعى رجل جد- ومر منل
