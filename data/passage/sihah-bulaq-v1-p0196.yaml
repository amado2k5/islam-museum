  وجعشوش تالسين والشيئ ججعاوذلك الى قاءة وصر وقلة بقال هو من بعاسيس الناس
  قال ولا يقال هذا بالشن قال عمروبن معدى كرب
  نداعت حوله جشم بن بكر • واسله جماسير الرباب
  والحس الرجيغ وهو مولد والعرب تقول الجعموس بريادة الميم يقال رى بجمامر بطنه
  (ج فس لمناسة الاتخام وقد جفس بالك يجفسجفا (جلس جلس
