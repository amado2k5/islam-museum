text: "… البقرة المذنبة اختطفَ عجلّ له حزمَةً مِنَ الكلأ الحشيش وأخذَ يركضُ بها هنا وهناك، غضب جحا، وأسرع إلى البقرة، فانْهالَ عليها ضَرْباً بِعصاهُ الغليظةِ، فرآهُ جارُه فقال له: لماذا تضرِبُها. هل أتَتْ ذنباً؟ فقال: نعم، يا سيدي، هي المذنبة لا …"
summary:
  ar: "ضرب جحا بقرة لأنها سرقت علفًا، فسأله الجار هل ارتكبت ذنبًا، فقال إنها المذنبة لا عجلها لأنها هي التي ربّته وعلّمته. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  en: "Juha beats a cow for stealing fodder; the neighbour asks whether it did something wrong; Juha says it is guilty, not its calf, because it raised and taught the calf. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  ur: "جحا نے ایک گائے کو چارہ چرانے پر مارا؛ پڑوسی نے پوچھا کہ کیا اس نے کوئی غلطی کی ہے؛ جحا نے کہا کہ قصوروار گائے ہے نہ کہ اس کا بچھڑا، کیونکہ اسی نے اسے پالا اور سکھایا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  fr: "Juha bat une vache qui a volé du fourrage ; le voisin demande si elle a mal agi ; Juha dit qu'elle est coupable, et non son veau, parce que c'est elle qui l'a élevé et instruit. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  es: "Juha golpea a una vaca por robar forraje; el vecino pregunta si hizo algo malo; Juha dice que es culpable ella, no su ternero, porque ella lo crió y lo enseñó. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
  tr: "Juha, yemini çaldığı için bir ineğe vurdu. Komşusu ona günah işleyip işlemediğini sordu ve Juha, suçlu olanın yavrusu değil, inek olduğunu, çünkü onu büyüten ve eğiten kişinin o olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 38}"
  id: "Juha memukul seekor sapi karena sapi itu mencuri pakan. Tetangganya bertanya apakah sapi itu telah berbuat dosa, dan Juha menjawab bahwa sapi itulah yang bersalah, bukan anaknya, karena dialah yang membesarkan dan mendidik anak sapi itu. {cite:juha-nawadir-kubra-djuwaydi p. 38}"
