text: |-
  بزوع صحابية كما فى القاموس
  قوله وعق الفرس بابه وعد وقوله
  ورجل وعق بكسر العسيز أى
  ككتف ويقال كعدل وقوله
  وبه وعقة أى كصغرة كما يؤخذ
  من القاموس ١
  ٣ نسخة زيادة للقلاخ :ن
  حزن ام
  ١٢٦
  ⁦(ف صل الواد)⁩
  ⁦(واف)⁩
  والوسق ستون صاعاقال الخليل الوسق هوحل البعير والوقرحل البغل أوالحمار وقولهم
  لا أفعله ما وسسقت عيني الماءأى حلته ووسقت الناقة وغيرها تسق وسقا بالفتح أى حلت
  وأغلقت رحها على الماءفهى ناقة واسق ونوق وساق مثل نائم ونيام وصاحب وصحاب قال
  بشر بن أبى خازم الاسدى ألظ بهن يحدوهن حتى • تبينت الحيال من الوساق
  ويقال أيضانوق مواسيق ومواسق وهوجع على غير قياس والانساق الانتظام ووسقت
  الحنطة توسيقا أى جعلتها وسقاوسا واستوسقت الابل اجتمعت قال الراجز
  ان لناقلائصا حتائقا • مستوسقات لويجدن سائفا
  وأوست البعير حلته حمله وأوسقت النخلة كثرحلها قال لبيد
  يوم أرزاق من يقضل عم • موسقات وحفل أبكار
  قال أبو عبيد الميساق الطائر الذى يصفق بجناحيه اذا طار قال ويجعه مياسيق ⁦(وشق)⁩
  الوشيق والوشيقة اللحم يغلى اغلاءة ثم بقسدد ويحمل فى الاسفار وهو أبق قديد يكون قال
  أبو عبيد وز عم بعضهم أنه بنزلة القديد لا تمسه النار وفى الحديث انه أتى بوشيقة يابسة من لحم
  صيد فقال انى حرام أى محوم تقول منه وشقت اللحم أشقه وشقا واتشقتة مثله قال الشاعر
  اذا عرضت منها كهاة سمينة • فلاتهد منها واتشق وتجيجب
  وواشق اسم كلب واسم دجل ومنه بروع بنت واشق ⁦( وعق)⁩ الوعيق والوعاق صوت يسمع
  من بطن الدابة اذامشت بنزلة الحقيق من قنب الذصك رتقول منه وعق الفرس يعق وعمة
  ووعاقا ورجل وعق بكسر العين أى عسر وبه وعقة وهى الشراسة وشدّة اظاق ومنه
  قول رؤبة
  مخافة اللّه وأن يوعقا * على امرئ ضلّ الهدى وأوبقا
  أى أن يقال انك لوءق ⁦( وفق)⁩. الوقاق الموافقة والتوافق الاتفاق والتظاهر ووافقته
  أى صادفته ووفه اللّه من التوفيق واستوفقت القه أى سألت← التوفيق ويقال وذقت
  أمرك تفق بالكرفيهما أى صادقته موافقا وهو من التوفيق كما يقال رشدت أمرك
  والوفق من الموافقة بين الشيتين كالا لتحسام يقمال -لوبته وفق عياه أى لها لبن ق_دركفايتهم
  لافضل فيه قال الشاعر
  أما الفقير الذى كانت حاو بته • وفق العيال فلم يترل له سبد
  ويقال أتتك لوفق الامر ونوفاق الامر وتيفاقه قال الاحر يقال كان ذلت لليفاق الهلال
  وتيفاقه وتوفاقه أى حين أهلّ الهسلال ويقال أوفقت السهم وأوفقت بالسهم اذا وضعت
  الفوق فى الوتر لترى كانه قلب أفوقت ولا يقال أفوقت {وقق) الوقوقة نباح السكاب عند
  الفرق والوقواق مثل الوكوالك وهو الجبان والوقواف شجر تتخذمنه الدوت وبلاد الوقواق
  فوق بلاد الصين : ⁦( لق)⁩ الواق الاسراع عن أب عمرو يقال جاءت الابل تلق أى تسرع
  وأنشد (٣
  انّ الحصين زاق وزقلق • جاءت به عفس من الشأم تلق
  والولق أخف الطعن وقد ولقه يلقه واقاويقال ولقه بالسيف ولقات أى ضريات والولق
  أيضا الاستمرار فى السيروف المكذب وقرأت عائشة رضى اللّٰه عنها اذ تلقونه بألمنتكم والفاقة
  تعدو الولقى وه وعدوفيه نزووناقة واقى سريعة والوليقة طعام يتخذمن دقيق وسمن والاولق
