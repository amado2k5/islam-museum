text: "… ما تأتي إليهم، وبقاء ما يأتون إليك. وقال عبد الرحمن بن مهدي عن جرير بن حازم عن عيسى بن عاصم قال: كتب عمر بن عبد العزيز إلى عدي بن عدي إن للإسلام سنناً وفرائض وشرائع، فمن استكملها استكمل الإيمان، ومن …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 5، ص 218، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
