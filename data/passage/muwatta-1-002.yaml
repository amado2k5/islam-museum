label: { ar: "الموطأ 2 — عائشة: كان يصلي العصر والشمس في حجرتها", en: "Muwatta 2" }
text: "كان يصلي العصر والشمس في حجرتها قبل أن تظهر"
summary:
  ar: "تتمة متصلة بالحديث الأول في باب وقوت الصلاة: يقول عروة بن الزبير إن عائشة زوج النبي حدثته أن رسول الله كان يصلي العصر والشمس ما تزال داخل حجرتها قبل أن ترتفع عن أرضها، وهو دليل على تبكيره بالعصر. ويبين المحقق أن هذا من قول ابن شهاب موصولاً بما قبله لا معلقاً، نقلاً عن ابن حجر في الفتح رداً على الكرماني، وأن محمد بن الحسن الشيباني أفرده في روايته بإسناده عن مالك عن ابن شهاب عن عروة عن عائشة. ويخرّجه عند البخاري (522) وأبي داود (407) ومسلم (2/103–104) والدارمي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.34}"
  en: "Urwa from A'isha: the Prophet used to pray the afternoon prayer while the sun was still in her chamber and had not yet left it."
