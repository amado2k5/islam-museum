label: { ar: "الموطأ 2 — عائشة: كان يصلي العصر والشمس في حجرتها", en: "Muwatta 2", es: "Muwatta 2", fr: "Muwatta 2", ur: "موطا 2", tr: "Al-Muwatta 2 — Aişe: O, güneş henüz onun odasındayken ikindi namazını kılardı.", id: "Al-Muwatta 2 — Aisyah: Dia biasa shalat Ashar ketika matahari masih berada di kamarnya." }
text: "كان يصلي العصر والشمس في حجرتها قبل أن تظهر"
summary:
  ar: "تتمة متصلة بالحديث الأول في باب وقوت الصلاة: يقول عروة بن الزبير إن عائشة زوج النبي حدثته أن رسول الله كان يصلي العصر والشمس ما تزال داخل حجرتها قبل أن ترتفع عن أرضها، وهو دليل على تبكيره بالعصر. ويبين المحقق أن هذا من قول ابن شهاب موصولاً بما قبله لا معلقاً، نقلاً عن ابن حجر في الفتح رداً على الكرماني، وأن محمد بن الحسن الشيباني أفرده في روايته بإسناده عن مالك عن ابن شهاب عن عروة عن عائشة. ويخرّجه عند البخاري (522) وأبي داود (407) ومسلم (2/103–104) والدارمي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.34}"
  en: "Urwa from A'isha: the Prophet used to pray the afternoon prayer while the sun was still in her chamber and had not yet left it."
  es: "Urwa, de Aisha: El Profeta solía rezar la oración de la tarde mientras el sol aún estaba en su habitación y no la había abandonado."
  fr: "Urwa d'après Aïcha: le Prophète avait l'habitude de faire la prière de l'après-midi alors que le soleil était encore dans sa chambre et ne l'avait pas encore quittée."
  ur: "عروہ عائشہ ا سے کہتی ہیں کہ نبی عصر کی نماز اس وقت پڑھتے تھے جب سورج ابھی ان کے حجرے میں ہی تھا اور ابھی باہر نہیں نکلا تھا۔"
  tr: "Namaz vakitleri bölümündeki ilk hadisten devam ederek: Urve ibn el-Zübeyr, Peygamber'in eşi Ayşe'nin kendisine, Allah Resulü'nün ikindi namazını (Asr) güneş henüz yerden yükselmeden, odasının içindeyken kıldığını söylediğini aktarmıştır. Bu, Asr namazını erken kıldığına dair bir delildir. Araştırmacı, bunun İbn Şihab'dan geldiğini ve öncesindekiyle bağlantılı olduğunu, İbn Hacer'in Feth el-Bari'de Kirmani'ye cevaben aktardığı gibi ayrı bir ifade olmadığını açıklığa kavuşturmaktadır. Muhammed ibn el-Hasan el-Şeybani, bunu Malik'ten, İbn Şihab'tan, Urve'den ve Ayşe'den gelen isnad zinciriyle ayrı olarak kendi rivayetine dahil etmiştir. Ayrıca Buhari (522), Ebu Davud (407), Müslim (2/103-104) ve Darimi'de de Malik'in sahabelerinin isnad zincirleriyle bulunmaktadır. {cite:muwatta-maruf-1997 s.34}"
  id: "Melanjutkan dari hadits pertama dalam bab tentang waktu shalat: Urwah ibn al-Zubayr berkata bahwa Aisyah, istri Nabi, memberitahunya bahwa Rasulullah biasa mengerjakan shalat Ashar ketika matahari masih berada di dalam kamarnya, sebelum terbit di atas bumi. Ini adalah bukti bahwa beliau mengerjakan shalat Ashar lebih awal. Peneliti mengklarifikasi bahwa ini berasal dari Ibn Shihab, terkait dengan apa yang mendahuluinya, bukan pernyataan terpisah, seperti yang dikutip oleh Ibn Hajar dalam Fath al-Bari sebagai tanggapan terhadap al-Kirmani. Muhammad ibn al-Hasan al-Shaybani memasukkannya secara terpisah dalam riwayatnya dengan sanadnya dari Malik, dari Ibn Shihab, dari Urwah, dari Aisyah. Hal ini juga ditemukan dalam al-Bukhari (522), Abu Dawud (407), Muslim (2/103–104), dan al-Darimi melalui sanad para sahabat Malik. {mengutip:muwatta-maruf-1997 hal.34}"
