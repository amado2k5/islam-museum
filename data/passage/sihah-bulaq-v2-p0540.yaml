text: |-
  nnعصف)*
  ٤٧
  الضالة والتعريف التطبيب من العرف وقوله تعالى عرّفها لهسم أى طيبها قال الشاعر
  يخاطب وجلاويمدحه* عرفت كأتب ءزفته اللطائم * يقول كماعرف الاتب وهو اليقير
  والعراف السكاهن والطبيب قال الشاعر
  فتلت لعزاف اليمامة داونى • فانك ان أبرأتنى لطبيب
  والتعريف الوقوف بعرفات يقال عرّف الناس اذاشهد واعرفات وه والمعرّف للموقف
  والاعتراف بالذنب الاقراربه واعترفت القوم اذاسألتهم عن خبر لتعرفه قال الشاعر 1 .
  أسائلة عميرة عن أبيها * خلال الركب تعترف الركابا
  وربما وضعوا اعترف موضع عرف كماوضعو اعرف موضع اعترف قال أيوذؤيب بصف
  حابا
  هرته التعامى فلم يعترف • خلاف النعامى من الشأم ريحا
  أى لم يع رف غير الجنوب لانها أبلّ الرياح وأرطبها وتعرفت ما عندفلان أى تطلبت حتى
  ءرفت وتقول انت فلا نا فا ستعرف اليه -تى يع رفك وقد تعارف القوم أى عرف بعضهم:
  بعضا وامر أة حسنة المعارف أى الوجه وما يظهر منها واحدها معرف قال الراعى
  متلغمين على معارفنا * تتنى لهنّ حوانى العصب
  ⁦( عرصف)⁩ العرصاف واحد عراصيف الرحل وهى أربعة أو تاديجمعن بيزرؤس
  أحنا القتب فى رأس كل حنووتدان مشدودان بعقب أو بجلود الابل وفيه الفللفات
  رعرصاف الاكاف وعرصوفه وعصفوره أيضا قطعة خشب مشدودة بين الحنوين المقدمين
  -⁦( عزف)⁩ عزفت نفسى عن الشى تعزف وتعزف عزوفا أى زهدت فيه وانصرفت عنه
  قال الفرزدق يخاطب نفسه
  عزفت بأعشاش وما كدت تعزف • وأنكرت من حدراء ما كنت تعرف
  والعزيف صوت الجنّ وقد عزفت الجن تعزف بالكسر عز يفا وسيجاب عزاف يسمسع منه
  عزيف الرعدوهودويه وأنشد الاصمعىّ
  بارب رب المسلمين بالود * لانقم صيب عزاف جور
  ويروى غرّاف والعزاف أيضار مل لبنى سعدو يسمى أبرق العزاف وهوقريب من زرود
  والمعازف الملاهى والعازف اللاعب بها والمغنى وقد عزف عزفا وعزف الرياح أصواتها
  سف) العسف الاخذ على غير الطريق وكذلك التعف والاعتاف والعف أيضا
  القسدح الفخم والعسوف الظلوم قال أبو يوسف ناقة عاسف اذا أشرفت على الموت من
  الغسدة وجعات تنفس قال الاصمعى قلت (جل من أهل البادية ما العساف قال حين
  نقمص خجرته أى ترجف من النفس قال عامر بن الطفيل فى قرنل يوم الرقم
  ونعم أخو الصعلوك أمس تركته • بتضرع بمرى باليدين ويعسف
  قال والعيف الاجير والجمع عسفاء وعسفانم وضع ⁦(عسقف)⁩ عقف الرجل أى
  جدت عينه وذلكْ اذاهم بالبكاء فلم يقدر عليه (عصف العصف بقل الزرع عن الفراء
  وقد أعصف الزرع ومكان معصق أى كثير الزرع قال أبوقيس بن الاسلت الانصارى"
  ١ ى نسفة زيادة بشر بن أتي
  خازم اه
