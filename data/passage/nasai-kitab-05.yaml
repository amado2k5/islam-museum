summary:
  ar: "القسم 5 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصلاة»، ويضم فيها النصوص من 448 إلى 493 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 5 of Sunan al-Nasa'i (The Book of Salah) in the division of the open hadith dataset the museum took its reports from: reports 448 to 493 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 5، عنوان «کتاب الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 448 تا 493۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 5 de Sunan al-Nasa'i (El Libro de Salah) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 448 al 493, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 5 du Sunan al-Nasa'i (Le Livre de la prière), qui comprend les hadiths 448 à 493 selon la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 5. bölümü \"Namaz Kitabı\" başlığını taşımakta olup, 448 ila 493 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 5 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Doa\" dan berisi teks 448 hingga 493, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
