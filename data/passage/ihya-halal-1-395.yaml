text: "… قديتهى غرور بعضهم إلى أن يأخذ من ما لهم وإذا خطر له أنه حرام قال له الشيطان : هذا مال لامالك له وهو لمصالح المسلمين وأنت إمام المسامين وعالمهم وبك قوام الدين ! أفلا يحل لك أن تأخذ قدر حاجتك …"
summary:
