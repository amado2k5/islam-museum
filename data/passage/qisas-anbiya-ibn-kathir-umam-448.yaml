text: "… يسير أمامهم فيه عمود نور، والليل أمامهم عمود نار، فانتهى بهم الطريق إلى ساحل البحر فنزلوا هنالك، وأدركهم فرعون وجنوده من المصريين، وهم هناك حلول على شاطىء اليم، فقلق كثير من بنى إسرائيل، حتى قال قائلهم : كان بقاؤنا بمصر …"
