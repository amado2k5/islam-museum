text: "تم ونقشه (٤) ، لما ثبت أن النبي وليفي اتخذ خاتما ونقش عليه (محمد رسول الله) فقد ورد أن النبي وليي لما رجع من الحديبية كتب إلى ملوك الأرض، وأرسل إليهم رسله، فكتب إلى ملك الروم، فقيل له: إنهم لا"
