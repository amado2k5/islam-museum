text: "… أن الوضوء متعلق بوقت الصلاة، فلها أن تصلي به الفريضة الحاضرة وما شاءت من الفوائت ما لم يخرج وقت الحاضرة، وعند المالكية يستحب لها الوضوء لكل صلاة، ولا يجب إلا بحدث آخر، وقال أحمد وإسحاق: إن اغتسلت لكل فرض فهو …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 1، ص 189، يرد فيه ذكر الفريضة والفرائض، والفرض، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
