text: |-
  ⁦(فصل الدال)⁩
  ٤٥١
  وتقول فى المؤنث عندى خس القدور كما قال ذوالرمة
  وهل يرجع النسليم أو يكشف العمى ١ لاث الاثافى والرسوم البلاقع
  وتقول هذه الخسة الدراهم وان شقت رفعت الدراهم وتجريم سامجرى النعت وكذلك الى
  العشرة وقولهم فلان يضرب اخماسا فى أسداس أى يعى فى المكر والخديمة وأصلد فى اظماء
  الابل وعلام رباعى وخاسى ولا يقال سباعى لانه اذا بلغ سبعة أشبارصاررجلا، ⁦(خنس )⁩
  خنس عنه يخنس بالضم أى تأخروأخنسه غيره اذا خلفه ومضى عنه والخنس تأخر الانف
  عن الوجه مع ارتفاع قليل فى الارنبة والرجل أخنس والمرأة خنساء والبة ركاماخنس
  والحناس الشيطان لانه يختس اذاذ كر اللّٰه عزوحل والخفس الكواكب كاها لانه ا تخنس
  فى المغيب أولانها تخفى بالنهار ويقال هي السكواكب السيارة منهادون الثابتة وقال الفرّاء
  فى قوله تع الى فلا أقسم بالخنس الجوار الكنس انها النجوم الحمسة زحل والمنترى والمرّيخ:
  والزهرة وعطاردلانها تختس فى مجراها وتكنس أى ت-ستتر كما تكنس الظباء فى المغاروهى
  الكناس ويقال سميت خنس التأخرهالانها الكواكب المتحيرة التى ترجع وتستقيم وقول
  أخناس قدهام الفؤادبكم * وأصابه نبل من الحب
  يعف به خفساء بنت عمروبن الشريد فغيره ليستقيم لهوزن الشعر ( خيس الخيس
  بالكسر الشجر الملتف وموضع الاسد أيضاخيس والخيس بالفتح مصدرولك خاست الجيفة
  أى أروحت ومنه قيل خاس البيع والطعام كانه كسد حتى فسدوخاس به يخيس ويخوس
  أى غدر به يقال خاس فلان بالعهداذانكث وخيسه تخيبا أى ذلله ومنه المخيس وهو
  سم سجن كان بالعراق أىء وضع التذلل وقال (
  أماترانى كيسامكيسا • بنيت بعد نافع مخيسا
  وكل مجن مخيس ومخيس أيضاقال الفرزدق
  فلم ييق الاداخر فى مخيس * ومنجمر فى غير أرضك فى حجر
  صمل الدال) بس لديس مايسيل من الرطب والاديس.ن الطير والجيل الذى
  لونه بين السوادوالحرة وقدادبس ادبساسا والدبسى طائروهومنسوب الى طيردبس ويقال
  الى دبس الرطب لانهم يغيرون فى النسب كالدهرىّ والسهلى وأدبست الارض فهى مدبسة
  وذلك أول مايرى فيهاسواد النبت والدباساء ممدود الاتى من الجراد وقول لقيط بن زرارة
  لوسععواوقع الديابيس* واحدهادبوس وأراه معربا حس دحست بين القوم أى
  افدت ومنه قول العجاج يصف الخلفاء
  .. ويعتلون من ما فى الدحس
  والدحس أيضا ادخال اليدبين جلد الشاة وصفاقها لسلخها والدحاس دويبة تغيب فى التراب
  والجم-ع الدحاحيس وداحس اسم فرس مشهوراقيس بن زهيربن جذيمة العبسى ومنه
  حرب داحس وذلك أن قيسا وحذيفسة بن بدر الذبيانى ثم الفزارى تراهنا على خطر عشرين
  بعسيرا وجعلا الغاية مائة غلوة والمضمار أربعين ليسلة والمجرى من ذات الاصاد فأجرى قيس
  داحسا والغبراء وأجرى حذينة الخطار والحنقاء فوضعت بنوفزارة كيناء-لى الطريق
  فردّوا الغبراء ولط موها وكانت سابقة فهاجت الحرب بين عبس وذبيان أر بعين سفة
  ١ رواية الاشمونى العناا
  ٢ ى الامامع-لى كرّم اللّٰه
  وجهه انظر الفاموس
