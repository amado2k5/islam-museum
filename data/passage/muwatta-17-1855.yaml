label: { ar: "الموطأ 1855 — مالك: من اشترى مصحفا أو سيفا أو خاتما، وفي شيء من ذلك ذهب أو فضة، بدنانير أو دراهم، فينظر إلى قيمته: فإن كانت قيمته الثلثين، وقيمة الذهب الثلث، فجائز إذا كان يدا بيد", en: "Muwatta 1855", es: "Muwatta 1855", fr: "Muwatta 1855", ur: "موطا 1855", tr: "El-Muvatta 1855 — Malik: Kim Kur'an, kılıç veya yüzük alır ve bunlardan herhangi birinde altın veya gümüş varsa, dinar veya dirhemle alırsa, değeri göz önünde bulundurulmalıdır: Değeri üçte iki, altının değeri ise üçte bir ise, elden ele alışveriş yapılması şartıyla caizdir.", id: "Al-Muwatta 1855 — Malik: Barang siapa membeli Al-Qur'an, pedang, atau cincin, dan salah satu dari barang-barang tersebut mengandung emas atau perak, dengan dinar atau dirham, maka nilai barang tersebut harus dipertimbangkan: jika nilai barang tersebut dua pertiga dan nilai emasnya sepertiga, maka hal itu diperbolehkan jika dilakukan secara tunai." }
summary:
  ar: "قال مالك: من اشترى مصحفا أو سيفا أو خاتما، وفي شيء من ذلك ذهب أو فضة، بدنانير أو دراهم. فإن ما اشتري من ذلك وفيه الذهب بدنانير، فإنه ينظر إلى قيمته، فإن كانت قيمة ذلك الثلثين، وقيمة ما فيه من الذهب الثلث، فذلك جائز لا بأس به، إذا كان ذلك يدا بيد، ولا يكون فيه تأخير. وما اشتري من ذلك بالورق، مما فيه الورق، نظر إلى قيمته، فإن كان قيمة ذلك الثلثين، وقيمة ما فيه من الورق الثلث، فذلك جائز لا بأس به، إذا كان ذلك يدا بيد. {cite:muwatta-maruf-1997 p.161} {cite:muwatta-maruf-1997 p.162}"
  tr: "Malik şöyle dedi: Bir kimse Kur'an, kılıç veya yüzük alırsa ve bu eşyalardan herhangi biri altın veya gümüş içeriyorsa, dinar veya dirhemle satın alırsa, altın içeren eşya dinarla alınmışsa, altının değeri dikkate alınır. Eşyanın değeri üçte iki, altının değeri ise üçte bir ise, bu caizdir ve işlem derhal ve gecikmeden yapıldığı sürece bunda bir sakınca yoktur. Benzer şekilde, gümüş içeren bir eşya gümüşle satın alınırsa, gümüşün değeri dikkate alınır. Eşyanın değeri üçte iki, gümüşün değeri ise üçte bir ise, bu caizdir ve işlem derhal ve gecikmeden yapıldığı sürece bunda bir sakınca yoktur."
  id: "Malik berkata: Jika seseorang membeli Al-Qur'an, pedang, atau cincin, dan salah satu dari barang-barang tersebut mengandung emas atau perak, dengan dinar atau dirham, maka jika barang yang mengandung emas dibeli dengan dinar, maka nilainya yang diperhitungkan. Jika nilai barang tersebut dua pertiga dan nilai emasnya sepertiga, maka hal ini diperbolehkan dan tidak ada salahnya, asalkan transaksi dilakukan segera dan tanpa penundaan. Demikian pula, jika barang yang mengandung perak dibeli dengan perak, maka nilainya yang diperhitungkan. Jika nilai barang tersebut dua pertiga dan nilai peraknya sepertiga, maka hal ini diperbolehkan dan tidak ada salahnya, asalkan transaksi dilakukan segera dan tanpa penundaan."
