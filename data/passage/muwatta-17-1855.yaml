label: { ar: "الموطأ 1855 — مالك: من اشترى مصحفا أو سيفا أو خاتما، وفي شيء من ذلك ذهب أو فضة، بدنانير أو دراهم، فينظر إلى قيمته: فإن كانت قيمته الثلثين، وقيمة الذهب الثلث، فجائز إذا كان يدا بيد", en: "Muwatta 1855" }
summary:
  ar: "قال مالك: من اشترى مصحفا أو سيفا أو خاتما، وفي شيء من ذلك ذهب أو فضة، بدنانير أو دراهم. فإن ما اشتري من ذلك وفيه الذهب بدنانير، فإنه ينظر إلى قيمته، فإن كانت قيمة ذلك الثلثين، وقيمة ما فيه من الذهب الثلث، فذلك جائز لا بأس به، إذا كان ذلك يدا بيد، ولا يكون فيه تأخير. وما اشتري من ذلك بالورق، مما فيه الورق، نظر إلى قيمته، فإن كان قيمة ذلك الثلثين، وقيمة ما فيه من الورق الثلث، فذلك جائز لا بأس به، إذا كان ذلك يدا بيد. {cite:muwatta-maruf-1997 p.161} {cite:muwatta-maruf-1997 p.162}"
