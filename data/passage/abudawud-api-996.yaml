label: { ar: "سنن أبي داود 996 — الأب والأبوة", en: "Sunan Abi Dawud 996 — the father and fatherhood", ur: "سنن ابی داؤد 996 — باپ اور والدیت", es: "Sunan Abi Dawud 996 — El padre y la paternidad", fr: "Sunan Abi Dawud 996 — Le père et la paternité" }
text: "… \". قَالَ أَبُو دَاوُدَ وَهَذَا لَفْظُ حَدِيثِ سُفْيَانَ وَحَدِيثُ إِسْرَائِيلَ لَمْ يُفَسِّرْهُ. قَالَ أَبُو دَاوُدَ وَرَوَاهُ زُهَيْرٌ عَنْ أَبِي إِسْحَاقَ وَيَحْيَى بْنُ آدَمَ عَنْ إِسْرَائِيلَ عَنْ أَبِي إِسْحَاقَ عَنْ عَبْدِ الرَّحْمَنِ بْنِ الأَسْوَدِ عَنْ أَبِيهِ وَعَلْقَمَةَ عَنْ عَبْدِ اللَّهِ. قَالَ أَبُو دَاوُدَ شُعْبَةُ كَانَ يُنْكِرُ هَذَا الْحَدِيثَ - حَدِيثَ أَبِي إِسْحَاقَ - أَنْ يَكُونَ مَرْفُوعًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 996، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 996 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 996، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 996 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 996 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
