text: "… - يعني: عبد الملكِ-: أَنَّ رجلًا مِن أَهلِ الشَّام أَوصى ابنَه عند موتِه، وذكر أَنَّه بلغَه: أَنَّ معاذَ بنَ جبل قال.. وذكره. وإسناده ضعيف؛ للجهالة لإعضالِه. ثُمِّ إِنَّ عبدَ الملك بنَ عُميرٍ قدِ اضطربَ فيه، وقد جاء في ترجمته: أَنَّه …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 265، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 2, p. 265, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 2، ص 265 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 2, pág. 265, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal, volume 2, page 265, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 265. sayfasından, son vasiyet veya ahit ve ölüm anından bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir baskıdan alınmıştır. Vasiyetler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 2, halaman 265, yang menyebutkan wasiat atau perjanjian terakhir, dan saat kematian; diambil dari edisi yang dapat dibaca mesin, dengan teks yang disarikan sekitar empat puluh kata sesuai kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
