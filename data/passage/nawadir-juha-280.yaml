label: { ar: "نوادر جحا الكبرى، ص 137 — «يقولون: إن الحشيش مسكر»", en: "Nawadir Juha al-Kubra, p. 137 — 'They Say Hashish Intoxicates'", ur: "نوادر جحا الکبریٰ، ص 137 — «کہتے ہیں کہ بھنگ نشہ آور ہے»", fr: "Nawadir Juha al-Kubra, p. 137 — « On dit que le haschich enivre »", es: "Nawadir Juha al-Kubra, p. 137 — «Dicen que el hachís embriaga»", tr: "Juha'nın Büyük Fıkraları, s. 137 — “Derler ki: Haşiş sarhoş edicidir.”", id: "Anekdot Hebat Juha, hlm. 137 — “Mereka bilang: Hashish itu memabukkan.”" }
text: "… يقولون: إنَّ الحشيش مسكرٌ، وكل ذلك كلام سمع أنَّ الحشيش يُسْكِر، فأهمَّهُ ذلك وابتاعٍ مِقْداراً منه من عندِ العطار واستعمله، ثمَّ ذهب إلى الحمَّام. وعندما كان يغتسلُ خطر في بالهِ أنهم يقولون : أن الحشيش يُسْكِر وأنَّهُ يُخِلْ بالعقل، فقال: …"
summary:
  ar: "اشترى جحا حشيشاً وتناوله وذهب إلى الحمام، ثم خشي ألا يكون له أثر، فخرج من الحمام عارياً وقال لأصدقائه إن العشاب غشه لأن حشيشه لا يسكر. {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  en: "Juha buys hashish, takes it and goes to the bath, and then fears it has no effect. He leaves the bath naked and tells his friends that the herbalist cheated him, since his hashish does not intoxicate. {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  ur: "جحا بھنگ خریدتا ہے، اسے کھا کر حمام جاتا ہے، پھر اسے ڈر ہوتا ہے کہ اس کا کوئی اثر نہیں ہوا۔ وہ حمام سے برہنہ نکلتا ہے اور دوستوں سے کہتا ہے کہ جڑی بوٹی بیچنے والے نے اسے دھوکا دیا ہے کیونکہ اس کی بھنگ نشہ نہیں دیتی۔ {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  fr: "Juha achète du haschich, le prend et va au bain, puis craint qu'il n'ait aucun effet. Il sort du bain nu et dit à ses amis que l'herboriste l'a trompé, puisque son haschich n'enivre pas. {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  es: "Juha compra hachís, lo toma y va al baño, y luego teme que no tenga efecto. Sale del baño desnudo y dice a sus amigos que el herborista lo engañó, pues su hachís no embriaga. {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  tr: "Juha esrar satın aldı, yedi ve banyoya gitti. Sonra, hiçbir etkisi olmayacağından korkarak banyodan çıplak çıktı ve arkadaşlarına esrarın sarhoş etmediği için bitki satıcısının onu kandırdığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 137}"
  id: "Juha membeli ganja, memakannya, dan pergi ke kamar mandi. Kemudian, karena takut tidak akan berpengaruh, dia keluar dari kamar mandi dalam keadaan telanjang dan memberi tahu teman-temannya bahwa dukun itu telah menipunya karena ganja yang dibelinya tidak memabukkan. {cite:juha-nawadir-kubra-djuwaydi p. 137}"
