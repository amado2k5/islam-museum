text: "أخته اجتمع أهل الشورى، وكانت نبيلة، وهي راوية حديث الجسّاسة. وقال الواقدي: وُلد الضّحّاك قبل وفاة النّبيّ لِله ب سمنتين. وقال غيره: بل سمع منه. وذكر مسلم بن الحَجّاج أنه شهد بدْراً، فغلط. وقال خليفة : مات زياد ابن أبيه …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 8، ص 133، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
