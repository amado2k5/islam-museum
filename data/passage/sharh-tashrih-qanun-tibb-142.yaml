text: "… البحث السابع تشريح المشيمية ما يأتيها من العروق قال الشيخ الرئيس رحمة اللّٰه عليه وبين هذا البطن، والبطن المؤخر من تحتهما مكان هو متوزع العرقين العظيمين الصاعدين... إلى قوله: ويكون هناك تنسج على مثال المتنسج في المشيمة فيستقر فيه. الشرح …"
