text: ": مرية عمرو بن العساص الى سواع النبى، صلعم، أن يخرج إلى الطائف خرج معه سعيد بن سعيد فاستشهد بالطائف. أخبرنا أَبو بكر بن محمد بن أَبى مُرّة، حدثنى مسلم بن خالد الزنجى عن أبن جُريج قال : لما خرج …"
