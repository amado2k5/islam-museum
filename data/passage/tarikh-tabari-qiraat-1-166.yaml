text: "… واصحابه فيها وجدّ فى بنائها ويحوّل الى الحمديدة ليتمّ أمر الماحوزة وامر بنقض، القصر المختارة والبّديع وحمل ساجهما. الى الجعفري وانفق، عليهام فيما قيل اكثر من و الغى الف دينار ا وجمع فيها القراء تقرءوا وحضر اصحاب الملافى فوهب لهم …"
