text: "… عهدة الشريك شهادة ولد الزنا والشريك قتل أهل الشرك صبراً وفداء الأسرى الرجل يحصن في الشرك ثم يزني في الاسلام الرجل يجلد ثم يموت أويزني في الشرك هل يقاتل أهل الشرك حتى يؤمنوا من غير أهل الكتاب وتؤخذ منهم الجزية …"
