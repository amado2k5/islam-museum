text: |-
  ٢٠٢
  فأبصر ألها با من الموددونها * ترى بين راسى كل نيقين مهبلا
  وقال أبو ذؤيب وتنصب ألها بامصيفا كرابها وبنواهب أيضاقوم من الازد
  صل النون دب ) نبّ التيسينب نبيبا اذاصاح وهاج والانبوبة مابين كل
  عقد تيز من القصب وهى أفعولة والجمع آنبوب وآنابيب"تتب تتب الشى توبامثل نهد
  أشرف ندياهاعلى التريب * لم يعدوا التقليك فى التتوب
  ⁦( تجب )⁩ النجب بالتحريك لماء الشجر و النجب بالتسكين مصدرقولك نجبت الشهجرة أنجيها
  وأنجيما اذا أخذت قشرة ساقها والمنجوب الجلد المدبوغ بقشور سوق الطلح وسقاء منجوب
  ونحيّ أيضا والمنجوب القدح الواسع ويوم ذى نجب يوم من أيام العرب مشهور ورجل
  نجيب أى كريم بين النجابة والنجبة مثال الهسمزة النجيب يقسال هو نجيسة القوم اذا كان
  النجيب منهم وأنجب الرجل أى ولد نجيبا قال الشّاءر
  أنجب أزمان والداه به • اذنجلاه فنعم مانجلا
  وامرأة منجبة ومنجاب تلدالنجياء ونسوة مناجيب أبو عبيد المنجاب السهم الذى ليس عليه
  ريسْ ولا نصل والمنجاب الرجل الضعيف وانتجبه اختاره واصطفاه والنحيب من الابل وابهع
  النجب والنجائب ⁦( ب)⁩ النحب النسذر تقول منه نحبت أنحب باضم وسارفلان على
  نحب اذ اسارفأجهد السيركأنه خاطر على شئ فجد قال الشاعر
  ورد القطامنها بخمس نحب أى دائب والنحب المدّة والوقت يقال قضى فلان نحبه اذا
  مات والنحيب رفع الصوت بالبكاء وقد تحب ينحب بالكسر نحيبا والاتحاب مثله وتحب البعر
  أيضا ينحب نحانا اذا أخذه السعال أبوعم ر والنحب السير السريع مثل النعب قال ونحب
  القوم تحيبا اذا جدّوا فى عملهم والتحيب شدّة القرب للماء قال الشاءر
  ورب مفازة قذف جوح • تغول مضب القرب اغتيالا
  وناحبت الرجل الى فلان مثل حاكمته قال طلحة لا بن عباس رضى اللّٰه عنه-ماهل لكّ فى أن
  أنا حبك وترفع النبي" صلى اللّٰه عليه وسلم ١ حب النخب النزع تقول نخبته أنخبه اذا
  نزعته والنخب أيضا البضاع وقد استخبت المرأة اذا أرادنه عن الاموى والانتخاب الانتزاع
  والانتخاب الاختيار والنخبة مثل النجبة وابهع نخب مثل رطبسة ورطب يقال جاء فى فخب
  أصحابه أى فى خيارهم ورجل نخب بكسر الجاء أى جبان لافؤادله وكذلك تخيب وعنهوب
  ومنتخب كأنه منتزع الفؤاد ⁦(نخرب)⁩ النخروب واحد النخاريب وهى شقوق الحجر
  (ندب تدب الميت أى بكى عليه وعدد محاصنه يندبه ندبا والاسم القدية بالضم وندية
  بالفتح أم خفاف بن ندبة السلمى وكانت سوداء حبشية وندبد لأ مرفانتدب له أى دعا.
  له فأجاب ومندوب اسم فرس أبى طلحة الذى قال فيه النبىّ صلى اللّٰه عليه وسلم ان وجدناه
  لبحراورجل ندب أى خفيف فى الحاجة وفرس ندب أى ماض والنسدب بالتحريك اخطر
  قال عروة
  أيهلك معتم وزيدولم أقم • على ندب يوماولى نفس مخطر
  وه-ماجداه وتقول رمينانديا أى رشقا والندب أيضا أثر الجرح اذالم يرتفع عن الجلد قال
  الفرزدق
  ومكمل ترك الحديد بساقه • ندبامن الرسفان فى الاحجال
  (١ كأنه قال افاخرك تعة
  فضاقلك وأعتفضائلى ولا تذكر
  فى فضاتلك المصطفى وأنا فركبما
  سواه يعنى أنه لا يقصر عنه فيما
  عداذلك من المفاخر اه مر تضى
  عن لسان العرب
