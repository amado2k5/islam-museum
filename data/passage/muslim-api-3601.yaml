label: { ar: "صحيح مسلم 3601 — ما حُرّم", en: "Sahih Muslim 3601 — what was made unlawful", ur: "صحیح مسلم 3601 — جو حرام کیا گیا", es: "Sahih Muslim 3601 — lo que se declaró ilícito", fr: "Sahih Muslim 3601 — ce qui a été déclaré illicite" }
text: "… - تَعْنِي ابْنَةَ سُهَيْلٍ - النَّبِيَّ فَقَالَتْ إِنَّ سَالِمًا قَدْ بَلَغَ مَا يَبْلُغُ الرِّجَالُ وَعَقَلَ مَا عَقَلُوا وَإِنَّهُ يَدْخُلُ عَلَيْنَا وَإِنِّي أَظُنُّ أَنَّ فِي نَفْسِ أَبِي حُذَيْفَةَ مِنْ ذَلِكَ شَيْئًا. فَقَالَ لَهَا النَّبِيُّ \" أَرْضِعِيهِ تَحْرُمِي عَلَيْهِ وَيَذْهَبِ الَّذِي فِي نَفْسِ أَبِي حُذَيْفَةَ \". فَرَجَعَتْ فَقَالَتْ إِنِّي قَدْ أَرْضَعْتُهُ فَذَهَبَ الَّذِي فِي نَفْسِ أَبِي حُذَيْفَةَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3601، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3601 (The Book of Suckling), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3601، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 3601 (El Libro de la Lactancia), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3601 (Le Livre de l'allaitement), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
