  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 631. sayfasından, bir Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve bir müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
