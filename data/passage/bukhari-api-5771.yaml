text: "وَعَنْ أَبِي سَلَمَةَ، سَمِعَ أَبَا هُرَيْرَةَ، بَعْدُ يَقُولُ قَالَ النَّبِيُّ \" لاَ يُورِدَنَّ مُمْرِضٌ عَلَى مُصِحٍّ \". وَأَنْكَرَ أَبُو هُرَيْرَةَ حَدِيثَ الأَوَّلِ قُلْنَا أَلَمْ تُحَدِّثْ أَنَّهُ لاَ عَدْوَى فَرَطَنَ بِالْحَبَشِيَّةِ. قَالَ أَبُو سَلَمَةَ فَمَا رَأَيْتُهُ نَسِيَ حَدِيثًا غَيْرَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5771، يذكر العدوى، والصحة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5771 (Medicine), that mentions contagion, health. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5771، جس میں چھوت، صحت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
