text: |-
  * ⁦(فصل الجيم)⁩
  * ⁦( جلف)⁩,
  ١٢
  كيل عدا بالجراف القفقل • من صبرة مثل السكثيب الاهيل
  قوله عداء أى موالاة جزف) الجزف أخذ الشى مجازفة وجزاقا فارسىّ معرب
  عف عفت الرجسل صر عتموجهفت الشى فانجعف أى قلعته فانقلع وجعنى
  أبو قبيلة من اليمن وهو جعفىّ بن سعد العشيرة بن مذج والنسبة اليه كذلك قال لبيد
  قبائل جعنى بن سعد كانما * سقى جعهم ماء الذعاف منيم
  قوله منيم أى مهلك جعل الموت نوما ويقال هذا كقولهم تأرمنيم ومنهم عبيد اللّٰه بن الحر
  الجعفى" وجابر الجعفى (جفف الطفة بالفتح بهاعة الناس يقال دعيت فى جفة الناس
  وجاء القوم جفة واحدة قال ابن عباس رضى اللّٰه عنه لا نفل فى غنيمة حتى تقسم حفة أى كلها
  وكذلك الحف بالضم قال النابغة يخاطب عروبن هند اللك .
  من مبلغ عمروبن هندآية * ومن النصيحة كثرة الاندار
  لا أعرفنك عارضالر ماحنا * فى جف تغلب واردى الامرار
  يعى جاعتهم وكان أبو عبيدة يرويد فى جف ثعلب قال يريد ثعلبة بن عوف بن سعّد بن ذبيان
  والجف أيضاوعاه الطلع والحف أيضا الشن البالى تقطع من نصفها فتجعل كالدلو
  قال الراجز
  رب عجوزرأسها كالسكفة • تحمل جفامعها هرشفة
  وربمما كان الحف من أصل نخل ينقر والحفان بكروتيم قال حيد بن نور الهلالى
  مافتئت مرّاق أهل المصرين * مقط عمان واصوص الحفين
  وقال أبوميمون العجلى
  قدنا الى الشأم جياد المصرين * من قيس عيلان وخيل المفين
  والحفافة ما ينتسترم ن الحشيشْ والقت وجفاف الطير موضع قال جرير
  فا أبصر الذار التى وضحت له • وراء جفاف الطير الاتماريا
  والجفيف ما يبس من النبت قال الاصمعى يقال الابل فيماشاءت من جفيف وقفيفَ قال
  والجفيف الارض المرتفعة وليست بالغليظة وجفّ النوب وغيره يجف بالمكسر جفاقا
  وجة وفا ويجف بالفتح لغة فيه حكاها أبو زيد وردها الكسائىّ وتجفيف الثوب اذا ابتل تثم
  جفّ وفيه ندى فان يبس كل اليبس قبل قدقف وأصلها تجفف فأبدلوا مكان الفاء
  الوسطى فاء الفعل كما قالوا تبشبش أصلها تبشش وأنشديعقوب
  فقام على قوائم لينات * قبيل تجفعف الوبر الرطيب
  وجففته أنا تجفيفا وتجفيف الفرس أيضا أن تلبسه التجفاف والمع التجافيف قال أبو على
  النحوىّ الشاءزائدة اف) الحلف القشريقال جلفت الطين عن رأس الدنّ أجلفه
  بالضم والحالفة الشجة التى تقشر الجلدمع اللحم وطعنة جالفة اذ الم تصل الى الجوف وهى
  خلاف الجائفة وجلفت الشى قطعته واستأصلته والجالفة السنة التى تذهب بأموال
  الناس ويقال أصابتهم جليفة عظيمة اذا اجتلفت أموالهم وهم قوم مجتلفون والجلف
  الذى أخذمن جوانيه قال الفرزدق
  بى
  قوله رب عجوزرواه فى هرشف كل
  عجوزالخ ا• مصحمه
  قوله التجفاف بالمكسر آلة للمحرب
  يلدسه الفرس والانسان ايقيه فى
  الحرب وجفف الفرس ألبسه
  اياه اه من المجد ام مصحمه
