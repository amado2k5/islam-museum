label: { ar: "سنن أبي داود 3877 — القسط والعود الهندي، القسط", en: "Sunan Abi Dawud 3877 — costus (Indian aloeswood); costus", ur: "سنن ابی داؤد 3877 — قسط ہندی، قسط", es: "Sunan Abi Dawud 3877 - costus (madera de áloe india); costo", fr: "Sunan Abi Dawud 3877 — costus (bois d'aloès indien); costus", tr: "Sunan Abi Dawud 3877 - Costus ve Hint Udu, Costus", id: "Sunan Abi Dawud 3877 — Costus dan Oud India, Costus" }
text: "… عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنْ أُمِّ قَيْسٍ بِنْتِ مِحْصَنٍ، قَالَتْ دَخَلْتُ عَلَى رَسُولِ اللَّهِ بِابْنٍ لِي قَدْ أَعْلَقْتُ عَلَيْهِ مِنَ الْعُذْرَةِ فَقَالَ \" عَلاَمَ تَدْغَرْنَ أَوْلاَدَكُنَّ بِهَذَا الْعِلاَقِ عَلَيْكُنَّ بِهَذَا الْعُودِ الْهِنْدِيِّ فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ مِنْهَا ذَاتُ الْجَنْبِ يُسْعَطُ مِنَ الْعُذْرَةِ وَيُلَدُّ مِنْ ذَاتِ الْجَنْبِ \". قَالَ أَبُو دَاوُدَ يَعْنِي بِالْعُودِ الْقُسْطَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3877، يذكر القسط والعود الهندي، والقسط، واللدود والسعوط، وأسماء الأمراض، وعلاج العذرة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3877 (Medicine (Kitab Al-Tibb)), that mentions costus (Indian aloeswood), costus, medicine given by the mouth-side or the nose, named diseases, treating the throat ailment (al-udhra), healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3877، جس میں قسط ہندی، قسط، لدود اور سعوط، بیماریوں کے نام، گلے کی بیماری عذرہ کا علاج، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3877 (Medicina (Kitab Al-Tibb)), menciona el costus (árbol de aloe indio), la medicina administrada por vía oral o nasal, enfermedades específicas, el tratamiento de afecciones de la garganta (al-udhra) y la curación. El Navegador de Medicina lo incluye en los textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3877 (Kitab Al-Tibb), mentionne le costus (bois d'aloès indien), son utilisation comme remède par voie orale ou nasale, et le traitement de maladies spécifiques, notamment les maux de gorge (al-udhra). Le Répertoire des ouvrages de référence sur la médecine le classe parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Abi Davud'da yer alan 3877 numaralı hadiste, kostus, Hint öd ağacı, kostus kökü, ağızdan ilaç kullanımı, burundan inhalasyon, hastalıkların isimleri, bademcik iltihabının tedavisi ve iyileşme konularından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3877, menyebutkan costus, gaharu India, akar costus, pengobatan oral, inhalasi nasal, nama-nama penyakit, pengobatan radang amandel, dan penyembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
