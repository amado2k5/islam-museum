text: "… مستحب مؤكد استحبابه واختلفوا في وجوبد على قولين : قال شيخ الإسلام: ولم يجيء الأمر به كما جاء الأمر بالصبر وإنما جاء الثناء على أصحابه ومدحهم. قال النبي : ذَاقَ طَعم الإِيمَانِ مَنْ رَضِيِّ بِاللهَ رَبَّا، وَبِالإِسْلامِ دِينًا، وَبِمُحَمَّدٍ رسولًا …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 290، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
