text: "… ب - لَيْسَتْ بِواجِبَةِ. وكانَ يُقَالُ هُمَا حَجَّان: الحَجُّ الأَكْبَرُ يَوْمُ النَّحْرِ والحَجُّ الأَصْغَرُ العُمْرَةُ. وقَالَ الشَّافِعِيُّ: العُمْرَةُ سُنَّةٌ لَا نَعْلَمُ أَحَدًا رَخَصَ في تَرْكِها، ولَيْسَ فِيها شَيْءٌ ثابِتٌ بِأَنَّها تَطَوُّعٌ قَالَ : وقَدْ رُوِيَ عَنِ النَّبِيِّ وَلِعِ بِإِسْنَادِ وهُوَ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 228، يرد فيه ذكر الواجب، والتطوع، وما ليس بواجب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 228, whose wording mentions the obligatory (wajib), the voluntary act (tatawwu'), what is said not to be obligatory, the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 228 کا اقتباس جس میں واجب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Tirmidhi, volume numérisé 1, p. 228, dont le texte mentionne l'obligatoire (wajib), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire, la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
