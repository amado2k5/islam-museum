text: "… حتى نزلوا بدراً، وَرَدت عليهم روايا قريش، وفيهم غلام أسود لبني الحجاج، فأخذوه، فكان أصحاب رسول اللّٰه يسألونه عن أبي سفيان وأصحابه، فيقول: ما لي علم بأبي سفيان، ولكن هذا أبو جهل وعُتبة وشَيبة وأُمية بن خَلَف، فإذا قال ذلك …"
