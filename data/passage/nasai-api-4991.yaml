text: "… \" ادْنُ \". حَتَّى وَضَعَ يَدَهُ عَلَى رُكْبَتَىْ رَسُولِ اللَّهِ قَالَ يَا مُحَمَّدُ أَخْبِرْنِي مَا الإِسْلاَمُ قَالَ \" الإِسْلاَمُ أَنْ تَعْبُدَ اللَّهَ وَلاَ تُشْرِكَ بِهِ شَيْئًا وَتُقِيمَ الصَّلاَةَ وَتُؤْتِيَ الزَّكَاةَ وَتَحُجَّ الْبَيْتَ وَتَصُومَ رَمَضَانَ \". قَالَ إِذَا فَعَلْتُ ذَلِكَ فَقَدْ أَسْلَمْتُ قَالَ \" نَعَمْ \". قَالَ صَدَقْتَ. فَلَمَّا سَمِعْنَا قَوْلَ الرَّجُلِ صَدَقْتَ أَنْكَرْنَاهُ قَالَ يَا …"
summary:
  ar: "حديث في سنن النسائي، رقم 4991، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 4991 (The Book Of Faith and its Signs), that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 4991، جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
