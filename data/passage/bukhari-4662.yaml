label: { ar: "البخاري 4662 — إن الزمان قد استدار", en: "Bukhari 4662 — Time has come full circle" }
text: "قال النبي: «إن الزمان قد استدار كهيئته يوم خلق الله السماوات والأرض، السنة اثنا عشر شهراً منها أربعة حرم: ثلاث متواليات ذو القعدة وذو الحجة والمحرم، ورجب مضر الذي بين جمادى وشعبان»"
summary:
  ar: "في كتاب التفسير عند قوله تعالى في سورة التوبة؛ رواية أبي بكرة في خطبة يوم النحر بمكة في حجة الوداع، وفيها ضبط الأشهر الحرم الأربعة ورد النسيء الجاهلي. من نصوص خطبة الوداع الثابتة."
