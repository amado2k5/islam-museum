summary:
  ar: "القسم 63 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب مناقب الأنصار»، ويضم فيها النصوص من 3776 إلى 3948 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 63 of Sahih al-Bukhari (Merits of the Helpers in Madinah (Ansaar)) in the division of the open hadith dataset the museum took its reports from: reports 3776 to 3948 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 63، عنوان «کتاب مناقب الانصار»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3776 تا 3948۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 63 de Sahih al-Bukhari (Méritos de los Ayudantes en Medina (Ansar)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3776 al 3948, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 63 du Sahih al-Bukhari (Mérites des Compagnons de Médine (Ansar)) correspond aux hadiths 3776 à 3948, selon la numérotation du recueil ouvert utilisé par le musée. Le musée conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
