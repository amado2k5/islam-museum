label: { ar: "الموطأ 652 — أبو سعيد: ليس فيما دون خمس ذود صدقة، ولا فيما دون خمس أواق، ولا فيما دون خمسة أوسق", en: "Muwatta 652", es: "Muwatta 652", fr: "Muwatta 652", ur: "موطا 652", tr: "El-Muvatta 652 — Ebu Said: Beşten az deve, beşten az ukiye ve beşten az vask için zekât gerekmez.", id: "Al-Muwatta 652 — Abu Saeed: Tidak ada zakat yang wajib dibayarkan atas kurang dari lima ekor unta, tidak pula kurang dari lima ekor uqiyah, dan tidak pula kurang dari lima ekor wasq." }
text: "ليس فيما دون خمس ذود صدقة، وليس فيما دون خمس أواق صدقة، وليس فيما دون خمسة أوسق صدقة"
summary:
  ar: "أول حديث في كتاب الزكاة وفي باب ما تجب فيه الزكاة. يرويه مالك عن عمرو بن يحيى المازني عن أبيه، أنه سمع أبا سعيد الخدري يقول: قال النبي: لا صدقة فيما دون خمس من الإبل، ولا فيما دون خمس أواق من الفضة، ولا فيما دون خمسة أوسق من الحب والثمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب، والقعنبي عند أبي داود (1558)، وابن وهب عند ابن خزيمة والطحاوي، والتنيسي عند البخاري (1447)، وابن مهدي عند أحمد والترمذي (627) والنسائي (5/17) وابن خزيمة وابن حبان، والشافعي في مسنده. {cite:muwatta-maruf-1997 p.333}"
  tr: "Zekat Kitabı'ndaki ilk hadis, zekâta tabi olanlar bölümünde, Malik'in Amr ibn Yahya el-Mazini'den, onun babasından rivayet ettiği ve Ebu Sa'id el-Hudri'nin şöyle dediğini işittiği bir hadistir: Peygamber şöyle buyurdu: \"Beş deveden azına, beş ukiye gümüşten azına ve beş vaski tahıl ve meyveden azına zekât verilmez.\" Editör, bu hadisin Malik'ten Ebu Mus'ab, el-Ka'nabi (Ebu Davud'da, 1558), İbn Vahb (İbn Huzeyme'de ve el-Tahavi'de), el-Tunisi (Buhari'de, 1447), İbn Mehdi (Ahmed'de), el-Tirmizi (627), el-Nesai (5/17), İbn Huzeyme, İbn Hibban ve el-Şafiî'nin Musned'inde rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.333}"
  id: "Hadits pertama dalam Kitab Zakat, dalam bab tentang apa yang termasuk zakat, diriwayatkan oleh Malik dari Amr ibn Yahya al-Mazini, dari ayahnya, yang mendengar Abu Sa'id al-Khudri berkata: Nabi bersabda: \"Tidak ada zakat yang wajib dibayarkan kurang dari lima ekor unta, dan kurang dari lima uqiyah perak, dan kurang dari lima wasq gandum dan buah-buahan.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, al-Qa'nabi dalam Abu Dawud (1558), Ibn Wahb dalam Ibn Khuzaymah dan al-Tahawi, al-Tunisi dalam al-Bukhari (1447), Ibn Mahdi dalam Ahmad, al-Tirmidhi (627), al-Nasa'i (5/17), Ibn Khuzaymah, Ibn Hibban, dan al-Shafi'i dalam Musnadnya. {mengutip:muwatta-maruf-1997 hal.333}"
