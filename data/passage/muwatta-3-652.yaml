label: { ar: "الموطأ 652 — أبو سعيد: ليس فيما دون خمس ذود صدقة، ولا فيما دون خمس أواق، ولا فيما دون خمسة أوسق", en: "Muwatta 652" }
text: "ليس فيما دون خمس ذود صدقة، وليس فيما دون خمس أواق صدقة، وليس فيما دون خمسة أوسق صدقة"
summary:
  ar: "أول حديث في كتاب الزكاة وفي باب ما تجب فيه الزكاة. يرويه مالك عن عمرو بن يحيى المازني عن أبيه، أنه سمع أبا سعيد الخدري يقول: قال النبي: لا صدقة فيما دون خمس من الإبل، ولا فيما دون خمس أواق من الفضة، ولا فيما دون خمسة أوسق من الحب والثمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب، والقعنبي عند أبي داود (1558)، وابن وهب عند ابن خزيمة والطحاوي، والتنيسي عند البخاري (1447)، وابن مهدي عند أحمد والترمذي (627) والنسائي (5/17) وابن خزيمة وابن حبان، والشافعي في مسنده. {cite:muwatta-maruf-1997 p.333}"
