label: { ar: "الموطأ 604 — أسماء بنت أبي بكر لأهلها: أجمروا ثيابي إذا مت وحنطوني ولا تتبعوني بنار", en: "Muwatta 604", es: "Muwatta 604", fr: "Muwatta 604", ur: "موطا 604", tr: "El-Muvatta 604 — Esma bint Ebu Bekir ailesine: Öldüğümde elbiselerimi yakın, beni mumyalayın ve ardından ateşle gelmeyin.", id: "Al-Muwatta 604 — Asma binti Abi Bakr kepada keluarganya: Bakarlah pakaianku ketika aku mati, awetkanlah jenazahku, dan janganlah kalian mengikutiku dengan api." }
text: "أجمروا ثيابي إذا مت، ثم حنطوني، ولا تذروا على كفني حناطاً، ولا تتبعوني بنار"
summary:
  ar: "أول حديث في باب النهي أن تتبع الجنازة بنار. يرويه مالك عن هشام بن عروة عن أسماء بنت أبي بكر، أنها أوصت أهلها أن يبخروا ثيابها إذا ماتت ثم يحنطوها، وأن لا يذروا على كفنها حناطاً، وأن لا يتبعوها بنار. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.310}"
  tr: "Cenaze alayının ardından ateş yakılmasının yasaklanması bölümündeki ilk hadis, Malik'in Hişam ibn Urve'den, o da Esma bint Ebu Bekir'den rivayet ettiğine göre, Esma bint Ebu Bekir ailesine öldüğünde elbiselerini tütsülemelerini, sonra da mumyalamalarını, kefenine hiçbir koku serpmemelerini ve ardından ateş yakmamalarını emretmiştir. Editör, bu hadisin Malik'ten Ebu Musab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.310}"
  id: "Hadits pertama dalam bab tentang larangan mengikuti prosesi pemakaman dengan api diriwayatkan oleh Malik dari Hisham ibn Urwah, dari Asma bint Abi Bakr, bahwa ia memerintahkan keluarganya untuk mengasapi pakaiannya ketika ia meninggal, kemudian membalsemnya, dan tidak menaburkan parfum pada kain kafannya, dan tidak mengikutinya dengan api. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab dan Suwaid. {cite:muwatta-maruf-1997 p.310}"
