label: { ar: "الموطأ 604 — أسماء بنت أبي بكر لأهلها: أجمروا ثيابي إذا مت وحنطوني ولا تتبعوني بنار", en: "Muwatta 604" }
text: "أجمروا ثيابي إذا مت، ثم حنطوني، ولا تذروا على كفني حناطاً، ولا تتبعوني بنار"
summary:
  ar: "أول حديث في باب النهي أن تتبع الجنازة بنار. يرويه مالك عن هشام بن عروة عن أسماء بنت أبي بكر، أنها أوصت أهلها أن يبخروا ثيابها إذا ماتت ثم يحنطوها، وأن لا يذروا على كفنها حناطاً، وأن لا يتبعوها بنار. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.310}"
