label: { ar: "مسلم 218 — سبعون ألفاً يدخلون الجنة بغير حساب", en: "Muslim 218 — Seventy thousand entering Paradise without reckoning" }
text: "قال عبد الله بن عباس عن رسول الله: هذه أمتك، ومعهم سبعون ألفاً يدخلون الجنة بغير حساب ولا عذاب... هم الذين لا يَرقون ولا يسترقون ولا يتطيرون وعلى ربهم يتوكلون، فقام عكاشة بن محصن فقال: ادع الله أن يجعلني منهم، قال: أنت منهم، فقام رجل آخر فقال: ادع الله أن يجعلني منهم، فقال: سبقك بها عكاشة"
summary:
  ar: "رواية ابن عباس في باب عدد أهل الجنة والسبعين ألفاً من كتاب الإيمان في صحيح مسلم؛ الذين يدخلون بلا حساب صفاتهم ترك الرقية والتطير مع التوكل."
