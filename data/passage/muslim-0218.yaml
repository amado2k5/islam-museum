label: { ar: "مسلم 218 — سبعون ألفاً يدخلون الجنة بغير حساب", en: "Muslim 218 — Seventy thousand entering Paradise without reckoning", es: "Musulmán 218 — Setenta mil entrarán al Paraíso sin rendir cuentas", fr: "Muslim 218 — Soixante-dix mille personnes entreront au Paradis sans avoir à rendre de comptes.", ur: "مسلم 218 - ستر ہزار بغیر حساب کے جنت میں داخل ہوئے۔", tr: "Müslim 218 — Yetmiş bin kişi hesaba çekilmeden cennete girecektir.", id: "Muslim 218 — Tujuh puluh ribu orang akan masuk surga tanpa dimintai pertanggungjawaban" }
text: "قال عبد الله بن عباس عن رسول الله: هذه أمتك، ومعهم سبعون ألفاً يدخلون الجنة بغير حساب ولا عذاب... هم الذين لا يَرقون ولا يسترقون ولا يتطيرون وعلى ربهم يتوكلون، فقام عكاشة بن محصن فقال: ادع الله أن يجعلني منهم، قال: أنت منهم، فقام رجل آخر فقال: ادع الله أن يجعلني منهم، فقال: سبقك بها عكاشة"
summary:
  ar: "رواية ابن عباس في باب عدد أهل الجنة والسبعين ألفاً من كتاب الإيمان في صحيح مسلم؛ الذين يدخلون بلا حساب صفاتهم ترك الرقية والتطير مع التوكل."
  tr: "İbn Abbas'ın Sahih Müslim'deki İman Kitabı'nda yer alan Cennet Ehli ve Yetmiş Bin Kişi bölümünde rivayet edildiğine göre; hesap yapmadan cennete girenlerin özellikleri, büyü ve batıl inançlardan vazgeçip Allah'a tevekkül etmeleridir."
  id: "Riwayat Ibnu Abbas dalam bab tentang jumlah penghuni surga dan tujuh puluh ribu orang dari Kitab Iman dalam Sahih Muslim; mereka yang masuk tanpa perhitungan, ciri-cirinya adalah meninggalkan mantra dan takhayul serta berserah diri kepada Allah."
