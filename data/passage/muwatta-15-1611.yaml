label: { ar: "الموطأ 1611 — مالك: بلغه أن رجلا سأل القاسم بن محمد وسليمان بن يسار عن رجل تظاهر من امرأة قبل أن ينكحها، فقالا إن نكحها فلا يمسها حتى يكفر كفارة المتظاهر", en: "Muwatta 1611", es: "Muwatta 1611", fr: "Muwatta 1611", ur: "موطا 1611", tr: "El-Muvatta 1611 — Malik: Ona, bir adamın El-Kâsım bin Muhammed ve Süleyman bin Yaşar'a, evlenmeden önce bir kadından boşanmaya yemin eden bir adam hakkında sorduğu rivayet edildi. Onlar da şöyle dediler: Eğer onunla evlenirse, boşanmaya yemin edenin kefaretini ödeyene kadar ona dokunmamalıdır.", id: "Al-Muwatta 1611 — Malik: Sampai kepadanya bahwa seorang pria bertanya kepada Al-Qasim bin Muhammad dan Sulayman bin Yasar tentang seorang pria yang telah bersumpah untuk menceraikan seorang wanita sebelum menikahinya. Mereka berkata: Jika dia menikahinya, dia tidak boleh menyentuhnya sampai dia menebus dosa orang yang bersumpah untuk menceraikannya." }
summary:
  ar: "يروي مالك أنه بلغه أن رجلا سأل القاسم بن محمد وسليمان بن يسار عن رجل تظاهر من امرأة قبل أن ينكحها، فقالا إن نكحها فلا يمسها حتى يكفر كفارة المتظاهر. {cite:muwatta-maruf-1997 p.68}"
  tr: "Malik, bir adamın el-Kâsım ibn Muhammed ve Süleyman ibn Yaşar'a, evlenmeden önce bir kadına iftira eden bir adam hakkında soru sorduğunu duyduğunu aktarır. Onlar da, eğer o kadınla evlenirse, iftira kefaretini ödeyene kadar ona dokunmaması gerektiğini söylemişlerdir. {cite:muwatta-maruf-1997 s.68}"
  id: "Malik menceritakan bahwa ia mendengar seorang pria bertanya kepada al-Qasim ibn Muhammad dan Sulayman ibn Yasar tentang seorang pria yang telah memfitnah seorang wanita sebelum menikahinya. Mereka menjawab bahwa jika ia menikahinya, ia tidak boleh menyentuhnya sampai ia melakukan penebusan atas fitnah tersebut. {cite:muwatta-maruf-1997 p.68}"
