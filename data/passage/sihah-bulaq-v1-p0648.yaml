text: |-
  الصاحب ابنء إذوه وسبع م لدات على ما فى الوفيات والجامع للقزازوغ-يرذلك ؟الا
  يحصى أى كالمهدباح الذى ذكرفى آخره من أسماء كب الفسن تحوسبعين تأليفاة.-ل
  وحوده ثم قال المزهر وغالب هذه الكتب لم يلتزم فيها ولفوها المميح بل جعوا فيها ماصح
  وغيره وينبهون على مالم يثبت غالبا وأول من التزم الحيح مقتصرا عليه الامام أبونصر
  اسمعيل بن حاد الجوهرى واه ذاممى كتابد بالصاح ي ول الفقي ر كانه عبر بالغالب
  نظر القوله بعد وكان فى عصر صاحب السجاح ابن فارس فالتزم أيضا فى مجمله الصحيح ثم قال
  وأعظم كتاب ألف فى اللغة بعدعصر صاحب الصحاح كتاب الممكم والمحط ألا : ظم
  لابى الحسن على بن سيده الضرير الاندلسى المتوفى سنة ٤٥٨ عن ستين سنة ثم كتاب العباب
  للا مام رضىّ الدين حسن بن محمد الصفانى الذى وصل فيه إلى بكم ومات سنة ٦٥٠ فلذا قيل
  ان المَغانى الذى • حاز العلوم والجكم • كان قصارى أمره • أن ابتهى الى بك.
  ثم كتاب القاموم للامام مجد الدين محد بن يعقوب الغيرورا بادى ولم يصل واجدمن هذه
  الثلاثة الى ما وصل البمصاحب الحاح ولا نقصت رتبة العصاح ولا شهرته بوجود هذه
  وذلك لالتزامه مأصح فهو فى اللغة تظير صيح البضارى فى الحديث وليس المدار فى الاعتماد
  على كثرة الجمع بل على شرط الصحة ول الفقي ر قد شهده صاحب القاموس فى ديباجته
  بوله ولما رأيت اقبال الناس على صاح الجوهرى وهوجذير بذل الى أن قال واختصصت
  كتاب الجودرى من بين الكتب التغوية مع مافى تاليها من الاوهام الواضحه والاغلاط
  الفاضه لتداوله واشتهاره بخدوصه واعفاد المدرسين على نقوله ونصوصه وأماما تعقبه
  به فى قوله غيرأنه فاته ثلثا اللغة أوا كثر فقداتقدوه علمه من وجوه أولهاان ادعاء.حه
  الفوات فى الملئين على ما فى النسعة الناصرية التى نقسل منها الحلال أو النصف على النسذ
  المكية غير مقبول لان اللغة لا يوصل إلى منتهاها فلا يعرف لها نصف ولاغيره وثانيها
  أيهام كلامه انه بمع اللغة فى قاء وسه وهذا أمر متعذر كيف وقد قال الامام الشافعى رضي
  اللّٰه عنه لا يحبط باللغة الانتعسلى انه ما بمع فيه غبرستين ألف مادة. فلم يزد عن الصحاح غير
  عشرين ألفا وأين هذا من لسان العرب الذى جع فيهم ؤلفه ثمانين ألفا واهل المجد لم يطلمع
  عله ومؤلفه هو الامام جمال الدين محمدين مكرم الإنصارى الخزرجى ويقال لدابن منظور
  أيضا الافريق نزيل مصرولد فى المحرم سنة ٦٩٠ وسمع من اب المقيروغيره وروى عنه
  الحافظان السبكى والذهى وروفى سنة ٧٧١ التزم فيه جع الصحاح والتهذيب والنهاية
  والمحكم والههرة وأمالى ابن برى قال م ر وهو مادة شرسى هذا فى غجالب المواضع وقد اطلعت
  منه على نسخة قديمة يقال انهاعجط المؤاف وعلى أول جزء منهاخط سيدنا الامام حلال الدين
  أبى الفضل السسيوطى اه من مودته وضرب عليه بالمبيضة لانه ذ كرقبل عند تعداد
  الكتب التى كانت معه حال الشرح للقاموس انه كان عنده نسجة من اسان العرب ٨؟
  مجلدا قال وهى المنقولة من مسودة المصنف فى حبانه وثالثها إن الجوهرى ما ادعى
  الاحاطة ولا-يى كتابه البحر ولا القاموس وانها التزم أن يورد فيه ماصح عندهكما
  صرح هو بذلك أوّل خطبة كتابه فلا يلزمه كل العميح ولا الصيح عندغيره ولا غيراصحيح
  وأما تخطئته للجوهرى وتوهيمه اياه فقد ردّها عليه الاعلام كالدر القرافى فى شرحه المسهى
