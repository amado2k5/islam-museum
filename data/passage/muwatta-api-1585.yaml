text: "كَتَبَ إِلَىَّ رَسُولُ اللَّهِ صلى الله عليه وسلم أَنْ أُوَرِّثَ امْرَأَةَ أَشْيَمَ الضِّبَابِيِّ مِنْ دِيَةِ زَوْجِهَا ‏.‏ فَقَالَ لَهُ عُمَرُ بْنُ الْخَطَّابِ ادْخُلِ الْخِبَاءَ حَتَّى آتِيَكَ فَلَمَّا نَزَلَ عُمَرُ بْنُ الْخَطَّابِ أَخْبَرَهُ الضَّحَّاكُ فَقَضَى بِذَلِكَ عُمَرُ بْنُ الْخَطَّابِ ‏.‏ قَالَ ابْنُ شِهَابٍ وَكَانَ قَتْلُ أَشْيَمَ خَطَأً ‏.‏"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Muwatta Malik; sending a letter or message to a party."
  ur: "موطأ مالک میں؛ کسی فریق کو خط یا پیغام بھیجنا."
