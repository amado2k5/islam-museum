label: { ar: "الموطأ 177 — إذا نودي للصلاة أدبر الشيطان", en: "Muwatta 177", es: "Muwatta 177", fr: "Muwatta 177", ur: "موطا 177", tr: "El-Muvatta 177 — Ezan okunduğu zaman şeytan kaçar.", id: "Al-Muwatta 177 — Ketika azan berkumandang, setan lari" }
text: "إذا نودي للصلاة أدبر الشيطان له ضراط حتى لا يسمع النداء، فإذا قضي النداء أقبل"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب ما جاء في النداء للصلاة: أخبر النبي أن الشيطان يدبر عند الأذان حتى لا يسمعه، فإذا انقضى أقبل، فإذا أقيمت الصلاة أدبر، فإذا انقضت الإقامة أقبل حتى يخطر بين المرء ونفسه يذكّره ما لم يكن يذكر، حتى يظل الرجل لا يدري كم صلى. ويخرّجه المحقق عند البخاري (608) وأبي داود (516) والنسائي (2/21) وابن حبان (1754) وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (18/305). {cite:muwatta-maruf-1997 p.117}"
  tr: "Malik, namaz çağrısı hakkında rivayet edilenler bölümünde, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan naklettiği rivayette şöyle buyurmuştur: Peygamberimiz bize, şeytanın ezan okunduğu sırada onu duymamak için kaçtığını, ezan bittiğinde geri döndüğünü, namaz başlamak üzereyken tekrar kaçtığını, ikamet bittiğinde ise geri dönüp bir kişiye unuttuğu şeyleri fısıldadığını, sonunda kişinin kaç rekat namaz kıldığını hatırlayamayacak hale geldiğini bildirmiştir. Editör ayrıca, Malik'in sahabelerinin rivayet zincirleriyle Buhari (608), Ebu Davud (516), Nesai (2/21), İbn Hibban (1754) ve Ahmed'in derlemelerine de bu hadisi dahil etmiş ve Temhid'e (18/305) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.117}"
  id: "Malik meriwayatkan hadits ini dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surah tentang apa yang diriwayatkan mengenai azan: Nabi memberitahukan kepada kita bahwa setan melarikan diri pada saat azan berkumandang agar tidak mendengarnya. Setelah azan selesai, ia kembali. Ketika shalat hendak dimulai, ia melarikan diri lagi. Setelah iqamah selesai, ia kembali dan berbisik kepada seseorang, mengingatkannya tentang hal-hal yang telah dilupakannya, hingga orang tersebut tidak tahu berapa rakaat yang telah dikerjakannya. (Penyunting juga memasukkan hadits ini dalam kumpulan hadits al-Bukhari (608), Abu Dawud (516), al-Nasa'i (2/21), Ibn Hibban (1754), dan Ahmad, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (18/305). {cite:muwatta-maruf-1997 p.117}"
