label: { ar: "الموطأ 177 — إذا نودي للصلاة أدبر الشيطان", en: "Muwatta 177" }
text: "إذا نودي للصلاة أدبر الشيطان له ضراط حتى لا يسمع النداء، فإذا قضي النداء أقبل"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب ما جاء في النداء للصلاة: أخبر النبي أن الشيطان يدبر عند الأذان حتى لا يسمعه، فإذا انقضى أقبل، فإذا أقيمت الصلاة أدبر، فإذا انقضت الإقامة أقبل حتى يخطر بين المرء ونفسه يذكّره ما لم يكن يذكر، حتى يظل الرجل لا يدري كم صلى. ويخرّجه المحقق عند البخاري (608) وأبي داود (516) والنسائي (2/21) وابن حبان (1754) وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (18/305). {cite:muwatta-maruf-1997 p.117}"
