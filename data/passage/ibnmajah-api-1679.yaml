label: { ar: "سنن ابن ماجه 1679 — الحجامة", en: "Sunan Ibn Majah 1679 — cupping", ur: "سنن ابن ماجہ 1679 — حجامہ", es: "Sunan Ibn Majah 1679 - catación", fr: "Sunan Ibn Majah 1679 — ventouses", tr: "Sünen İbn Mace 1679 - Hacamat", id: "Sunan Ibnu Majah 1679 — Bekam" }
text: "حَدَّثَنَا أَيُّوبُ بْنُ مُحَمَّدٍ الرَّقِّيُّ، وَدَاوُدُ بْنُ رُشَيْدٍ، قَالاَ حَدَّثَنَا مُعَمَّرُ بْنُ سُلَيْمَانَ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بِشْرٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: قَالَ رَسُولُ اللَّهِ ـ \" أَفْطَرَ الْحَاجِمُ وَالْمَحْجُومُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1679، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1679 (Fasting), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1679، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "En el Sunan Ibn Majah, n.º 1679 (Ayuno), se menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 1679 (Le jeûne), mentionne la ventousothérapie. Le Répertoire des ouvrages de médecine la répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 1679 numaralı hadiste hacamat uygulamasından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1679, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
