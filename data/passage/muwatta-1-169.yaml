label: { ar: "الموطأ 169 — يوم الجمعة عيد: اغتسلوا وتطيبوا وعليكم بالسواك", en: "Muwatta 169", es: "Muwatta 169", fr: "Muwatta 169", ur: "موطا 169", tr: "Al-Muwatta 169 — Cuma günü kutlama günüdür: Yıkan, parfüm sür ve misvak kullan.", id: "Al-Muwatta 169 — Jumat adalah hari perayaan: Mandilah, pakailah parfum, dan gunakan miswak (batang pembersih gigi)." }
text: "يا معشر المسلمين إن هذا يوم جعله الله عيداً فاغتسلوا، ومن كان عنده طيب فلا يضره أن يمس منه، وعليكم بالسواك"
summary:
  ar: "أول حديث في باب ما جاء في السواك. يرويه يحيى عن مالك عن ابن شهاب عن ابن السباق مرسلاً: خطب النبي في جمعة من الجمع فأخبر أن الله جعل ذلك اليوم عيداً للمسلمين، وأمرهم بالغسل، وبمس الطيب لمن كان عنده، وبالسواك. ويذكر المحقق أن صالح بن أبي الأخضر وصله عن الزهري عن ابن السباق عن ابن عباس عند ابن ماجه (1098) وإسناده ضعيف، وينقل عن البيهقي أن الصحيح مرسل ولا يصح وصله، وعن ابن عبد البر أنه لا يصح عن مالك إلا ما في الموطأ وأن رواية يزيد بن سعيد الإسكندراني له بإسناد آخر لا تصح لضعفه واضطرابه ⁦(التمهيد 11/210–213)⁩، ويرى أن رواية مالك المرسلة هي الأصح. {cite:muwatta-maruf-1997 p.111}"
  id: "Hadits pertama dalam bab ini membahas tentang siwak (tongkat pembersih gigi). Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Ibn al-Sabbaq, dengan sanad mursal (terputus): Nabi (shalawat dan salam kepadanya) menyampaikan khutbah pada hari Jumat, memberitahukan bahwa Allah telah menjadikan hari itu sebagai hari raya bagi kaum Muslimin, dan beliau memerintahkan mereka untuk bermandi (ghusl), memakai parfum jika hadir, dan menggunakan siwak. Peneliti menyebutkan bahwa Salih ibn Abi al-Akhdar menghubungkannya dari al-Zuhri, dari Ibn al-Sabbaq, dari Ibn Abbas, sebagaimana dicatat oleh Ibn Majah (1098), tetapi sanadnya lemah. Ia mengutip al-Bayhaqi yang mengatakan bahwa hadits sahih tersebut mursal dan hubungannya tidak valid, dan Ibnu Abd al-Barr yang mengatakan bahwa tidak ada hadits sahih dari Malik kecuali yang ada dalam al-Muwatta, dan bahwa riwayat Yazid ibn Sa'id al-Iskandarani mengenainya dengan sanad yang berbeda tidak sahih karena lemah dan tidak konsisten (al-Tamhid 11/210–213). Ia menganggap riwayat mursal Malik sebagai yang paling sahih. {cite:muwatta-maruf-1997 p.111}"
