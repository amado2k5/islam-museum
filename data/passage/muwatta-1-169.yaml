label: { ar: "الموطأ 169 — يوم الجمعة عيد: اغتسلوا وتطيبوا وعليكم بالسواك", en: "Muwatta 169" }
text: "يا معشر المسلمين إن هذا يوم جعله الله عيداً فاغتسلوا، ومن كان عنده طيب فلا يضره أن يمس منه، وعليكم بالسواك"
summary:
  ar: "أول حديث في باب ما جاء في السواك. يرويه يحيى عن مالك عن ابن شهاب عن ابن السباق مرسلاً: خطب النبي في جمعة من الجمع فأخبر أن الله جعل ذلك اليوم عيداً للمسلمين، وأمرهم بالغسل، وبمس الطيب لمن كان عنده، وبالسواك. ويذكر المحقق أن صالح بن أبي الأخضر وصله عن الزهري عن ابن السباق عن ابن عباس عند ابن ماجه (1098) وإسناده ضعيف، وينقل عن البيهقي أن الصحيح مرسل ولا يصح وصله، وعن ابن عبد البر أنه لا يصح عن مالك إلا ما في الموطأ وأن رواية يزيد بن سعيد الإسكندراني له بإسناد آخر لا تصح لضعفه واضطرابه (التمهيد 11/210–213)، ويرى أن رواية مالك المرسلة هي الأصح. {cite:muwatta-maruf-1997 p.111}"
