text: "… صلعم حمَّاد بن جرير الطبرقَّ وكان الواثق وجّه حمّادا مسلحة للمدينة و لثلا يتطلرَّقها ا الاعراب فى مثتى فارس من الشاكرية فتوجّه اليهم حمّاد فى جماعة من الجند ومن تطوع للتخروج من قريش والانصار ومواليام وغيرهم من اهل المدينة فسارة …"
summary:
