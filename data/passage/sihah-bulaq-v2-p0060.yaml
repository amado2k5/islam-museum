text: |-
  ٥٢٧
  اذا كان يأكل الغضى وابل غاضية وغواض واذا اشتكت بعاونها من أكل الغضى قلت بعه
  فض وابل غضية وغضا بامثل رمشة ورمائى واذانسبته الى الغضى قلت بعير غضوى
  والاغضاء إدناء الحفون وأغضي الليسل أى أظلم وليل مغض لغة قليلة وأكثرما يقال ليل
  غاض قال رؤبة• يخرجن من أجوازابل غاض • رليلة غاضية أى مظلمة ونارغاضية أى
  مضيئة وهومن الاضداد ⁦(غطا)⁩ القطاء ماتفطيت به وغطيت الشىء تغطسة وغطيته
  أيضا أغطى غطيا وقال
  أنا ابن كلاب وابن أوم فن يكن • قناعه مغطيافانى لجتلى
  وعطا الليل يغعاوويغطى أى أظلم وغطا الماء وكل شوارتة سع وطال على شى فقدغطاعليه
  قال ساعدة بن جوبة
  كذوائب الحفا الرطيب غطابه • عبل ومدبجانيه الطحلب
  قال الفراء واذا امتلأ الزجل شباباقيل غطايقطى غطيا وغطيا بالفح والضم وأنشة
  يحملن سرياغطافيه الشباب معا • وأخطأته عيون الجن والمسده
  ⁦(غقا )⁩ أغفيت اغفاء أى نمت قال ابن السكيت ولا تقل غنفوت والغفامقصور ما يرج
  من الطعام فسيرمى به كازوان والغفا أيضا آفة تصيب النخل وهوشبه الغبار يقع على البسر
  فينعه من الادراك والنضجج ويمسخ طعمه لى ت القدرتغ لى غليا وغليانا وأغليتها
  أنا ولا يقال غليت قال أبو الاسود الدولى
  ولا أقول لقدر القومدغليت • ولا أقول لباب الدار مغلوق
  أى أنى فصيح لا ألحن وغلافى الامر يغلو غلوًا أى بارزفيه الحدّوغلا السعر غلا" وأغلى اللّٰه
  السعر وغلوت بالسهم غلوا اذارميت به أبعدما تقدر عليه والغلوة الغاية مقداررمية وفى
  المثل جرى المذ كيات غلاه وغالى باللحم أى اشتراه بتمن غال وقال
  نغالى اللحم للاضياف نيأ * وزخصه اذا نضج القدور
  فذف الباه وهو يريده وية ال أيضا أغلى بالحم وقال» كأنهادرة أغلى التجارجا• والغالة
  من الطيب يقال أوّل من سماها بذلك سليمان من عبد الملك تقول منه تغليت بالغالة
  والاغتلاء الاسراع وقال
  كيف تراهاتغعلى ياشرح • وقد سهجناها فطال السهج
  وفاقة مغلاة الوهق تغتلى اذانواهقت أخفافها قال روية • تنشطه كل مغلاة الوهق
  والهاء الخرق وه والمفازة وتغالى لحم الناقة أى ارتفع وذهب قال لبيد
  فاذا نغالى لجمها وتحسرت • وتقطعت بعد الكلال خدامها
  ورواه ثعلب بالعين غير معجمة والغلواء الغلو والغلواه أيضاسرعة البشباب وأوّه عن أب زيد
  مى) تركت فلانا غحمى منل ققا مقصور أى مغشيا عليه وكذات الاثنان وابهع
  والمؤنت وان شئت قلت هما غميان وهم أغماء وقد أخمى عليه فهو مغمى عليه وغمى عليه فهو
  مغمىّ عليه على مفعول وأغمى عليه الخبر أى استعجم مثل غم وغمى البيت مافوق السقف
  من القصب والتراب ولمحوه فان كسرت الغيز مددت وقد غميت البيت الفراء يقال صمنا
