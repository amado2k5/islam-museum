text: "… إنَّه سلوتي عافاكُمُ اللَّهُ صلّى بقوم يوماً، وفي كمِّهِ جروُ كلبٍ، فلما ركع سقط الجرو من كمّه، وعوى، فتنحنح الناس، فالتفت إليهم وقال : إنَّه سلوتي عافاكُمُ اللهُ! كان فيها قطن فما سال منها شيء حمل جرة إلى السوق ليبيعها، …"
summary:
  ar: "أمّ جحا الناس في الصلاة وفي كمّه جرو، فأنّ الجرو حين ركع، فقال جحا للمصلين «إنه سلوتي عافاكم الله». {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  en: "Juha leads prayer with a puppy in his sleeve; the puppy whines when he bows; he tells the congregation: 'it is my comfort, God keep you'. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  ur: "جحا نے آستین میں کتے کا پلا رکھ کر نماز کی امامت کی، جب وہ رکوع میں گیا تو پلا چیخ پڑا، تو اس نے نمازیوں سے کہا «یہ میری تسلی ہے، اللہ آپ کو عافیت دے»۔ {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  fr: "Juha dirige la prière avec un chiot dans sa manche ; le chiot gémit lorsqu'il s'incline ; il dit à l'assemblée : « C'est mon réconfort, que Dieu vous garde ». {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  es: "Juha dirige la oración con un cachorro en la manga; el cachorro gime cuando se inclina; dice a la congregación: «Es mi consuelo, que Dios los guarde». {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  tr: "Juha, cemaate dua ettirirken kolunda bir köpek yavrusu taşıyordu. Eğildiğinde köpek yavrusu miyavladı, bunun üzerine Juha cemaate, \"Bu benim tesellimdir, Allah size esenlik versin.\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 186}"
  id: "Juha memimpin orang-orang berdoa, dan di lengan bajunya ada seekor anak anjing. Ketika ia membungkuk, anak anjing itu mengeong, lalu Juha berkata kepada para jamaah, \"Ini adalah penghiburku, semoga Allah menganugerahkan kesejahteraan kepada kalian.\" {cite:juha-nawadir-kubra-djuwaydi p. 186}"
