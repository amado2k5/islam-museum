text: "… أَنْ لاَ يَبِيعَهَا أَوْ لاَ يَهَبَهَا أَوْ مَا أَشْبَهَ ذَلِكَ مِنَ الشُّرُوطِ فَإِنَّهُ لاَ يَنْبَغِي لِلْمُشْتَرِي أَنْ يَطَأَهَا وَذَلِكَ أَنَّهُ لاَ يَجُوزُ لَهُ أَنْ يَبِيعَهَا وَلاَ يَهَبَهَا فَإِذَا كَانَ لاَ يَمْلِكُ ذَلِكَ مِنْهَا فَلَمْ يَمْلِكْهَا مِلْكًا تَامًّا لأَنَّهُ قَدِ اسْتُثْنِيَ عَلَيْهِ فِيهَا مَا مَلَكَهُ بِيَدِ غَيْرِهِ فَإِذَا دَخَلَ هَذَا الشَّرْطُ لَمْ يَصْلُحْ وَكَانَ بَيْعًا مَكْرُوهًا."
summary:
  ar: "حديث في موطأ مالك، رقم 1295، يرد فيه ذكر المكروه. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1295 (Business Transactions), whose wording mentions the disliked (makruh). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1295، جس کے الفاظ میں مکروہ کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1295, dont le texte mentionne le réprouvé (makruh). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1295, cuyo texto menciona lo reprobado (makruh). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
