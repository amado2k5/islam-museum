  الديشابن الهون بن خزيمة ورب ،قالوه بفتح الدال وه وأحد القارة والاآخر عضل بن الهون
  يقال لهما جيعا القارة
  صل الرد ئش لرش للماء والدم والدمع وقدرشنت المكان رشاورشش عليه
  الماء والرش المطر القليل والمع رشاش ورشت السماء وأرشت أى جاءت بالرشاش والرشاس
  بالفتح ما ترشش من الدم والدمع يقال أرشت الطعنة عش لرعش بالتهريك الرع-دة
  وقدرعش بالسكسر وارتعش أى ارتعد وأرعشه اللّٰه ورجل رعش أى جبان ويقال
