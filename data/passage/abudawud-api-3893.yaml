label: { ar: "سنن أبي داود 3893 — الأب والأبوة، تربية الأب ووصيته", en: "Sunan Abi Dawud 3893 — the father and fatherhood; the father raising and counselling", ur: "سنن ابی داؤد 3893 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 3893 — El padre y la paternidad; la crianza y el asesoramiento paternos", fr: "Sunan Abi Dawud 3893 — Le père et la paternité; l'éducation et les conseils du père", tr: "Sunan Abi Dawud 3893 — Baba ve Babalık, Babanın Yetiştirilmesi ve İradesi", id: "Sunan Abi Dawud 3893 — Ayah dan Peran Ayah, Didikan dan Wasiat Ayah" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ كَانَ يُعَلِّمُهُمْ مِنَ الْفَزَعِ كَلِمَاتٍ \" أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ غَضَبِهِ وَشَرِّ عِبَادِهِ وَمِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَنْ يَحْضُرُونِ \". وَكَانَ عَبْدُ اللَّهِ بْنُ عَمْرٍو يُعَلِّمُهُنَّ مَنْ عَقَلَ مِنْ بَنِيهِ وَمَنْ لَمْ يَعْقِلْ كَتَبَهُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3893، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3893 (Medicine (Kitab Al-Tibb)), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3893، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3893 (Medicina (Kitab Al-Tibb)), menciona al padre y la paternidad, así como la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3893 (Médecine (Kitab Al-Tibb)), évoque le père et la paternité, l'éducation des enfants et les conseils prodigués par le père. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
  tr: "Sünen Ebu Davud'da yer alan 3893 numaralı hadis, baba ve babalık kavramını, babanın çocuk yetiştirmedeki rolünü ve vasiyetini ele almaktadır. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3893, menyebutkan tentang ayah dan peran ayah, peran ayah dalam membesarkan anak, dan wasiatnya. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
