label: { ar: "الموطأ 1614 — مالك: من تظاهر من امرأته في مجالس متفرقة فعليه كفارة واحدة، فإن كفر ثم تظاهر بعد أن كفر فعليه الكفارة أيضا", en: "Muwatta 1614", es: "Muwatta 1614", fr: "Muwatta 1614", ur: "موطا 1614", tr: "El-Muvatta 1614 — Malik: Kim karısına karşı ayrı ayrı meclislerde zihar beyanında bulunursa, bir defa kefaret ödemelidir. Eğer kefaret ödedikten sonra tekrar zihar beyanında bulunursa, tekrar kefaret ödemelidir.", id: "Al-Muwatta 1614 — Malik: Barang siapa yang menyatakan zihar terhadap istrinya di beberapa pertemuan terpisah, maka ia wajib membayar satu kali penebusan. Jika kemudian ia membayar penebusan dan kemudian menyatakan zihar lagi setelah membayar penebusan, maka ia wajib membayar penebusan lagi." }
summary:
  ar: "يقول مالك في الرجل يتظاهر من امرأته في مجالس متفرقة، إنه ليس عليه إلا كفارة واحدة. فإن تظاهر ثم كفر، ثم تظاهر بعد أن يكفر، فعليه الكفارة أيضا. {cite:muwatta-maruf-1997 p.69}"
  tr: "Malik, ayrı toplantılarda karısıyla evlilik anlaşmazlığı taklidi yapan bir adam hakkında, yalnızca bir kez kefaret ödemesinin gerektiğini söyler. Eğer evlilik anlaşmazlığı taklidi yapar, sonra kefaret öder ve kefaret ödedikten sonra tekrar evlilik anlaşmazlığı taklidi yaparsa, yine de tekrar kefaret ödemesi gerekir. {cite:muwatta-maruf-1997 s.69}"
  id: "Malik mengatakan mengenai seorang pria yang berpura-pura berselisih dengan istrinya di pertemuan terpisah, bahwa ia hanya diwajibkan untuk melakukan satu kali penebusan dosa. Jika ia berpura-pura berselisih, kemudian melakukan penebusan dosa, dan kemudian berpura-pura berselisih lagi setelah melakukan penebusan dosa, ia tetap diwajibkan untuk melakukan penebusan dosa lagi. {cite:muwatta-maruf-1997 p.69}"
