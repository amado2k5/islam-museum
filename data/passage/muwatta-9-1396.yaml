label: { ar: "الموطأ 1396 — عمارة بن صياد عن عطاء بن يسار: أخبره أبو أيوب الأنصاري أنهم كانوا يضحون بالشاة الواحدة يذبحها الرجل عنه وعن أهل بيته، ثم تباهى الناس", en: "Muwatta 1396" }
text: "يَذْبَحُها الرَّجُلُ عَنْهُ وَعَن أهْلِ بَيْتِهِ"
summary:
  ar: "يروي مالك عن عمارة بن صياد أن عطاء بن يسار أخبره أن أبا أيوب الأنصاري أخبره قال كنا نضحي بالشاة الواحدة، يذبحها الرجل عنه وعن أهل بيته، ثم تباهى الناس بعد فصارت مباهاة. ويذكر المحقق أن التصويب في اسم الراوي عمارة بن صياد. {cite:muwatta-maruf-1997 p.625}"
