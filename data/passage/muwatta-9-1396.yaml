label: { ar: "الموطأ 1396 — عمارة بن صياد عن عطاء بن يسار: أخبره أبو أيوب الأنصاري أنهم كانوا يضحون بالشاة الواحدة يذبحها الرجل عنه وعن أهل بيته، ثم تباهى الناس", en: "Muwatta 1396", es: "Muwatta 1396", fr: "Muwatta 1396", ur: "موطا 1396", tr: "El-Muvatta 1396 — Ammarah ibn Sayyad, Ata ibn Yasar'dan rivayetle: Ebu Eyyub el-Ensari ona, eskiden bir kişinin kendisi ve ailesi adına tek bir koyun kurban ettiğini ve bunun üzerine insanların bununla övünmeye başladığını anlattı.", id: "Al-Muwatta 1396 — Ammarah ibn Sayyad, berdasarkan riwayat Ata ibn Yasar: Abu Ayyub al-Ansari memberitahunya bahwa mereka biasa menyembelih seekor domba, yang disembelih oleh seorang pria atas nama dirinya dan keluarganya, kemudian orang-orang mulai membanggakannya." }
text: "يَذْبَحُها الرَّجُلُ عَنْهُ وَعَن أهْلِ بَيْتِهِ"
summary:
  ar: "يروي مالك عن عمارة بن صياد أن عطاء بن يسار أخبره أن أبا أيوب الأنصاري أخبره قال كنا نضحي بالشاة الواحدة، يذبحها الرجل عنه وعن أهل بيته، ثم تباهى الناس بعد فصارت مباهاة. ويذكر المحقق أن التصويب في اسم الراوي عمارة بن صياد. {cite:muwatta-maruf-1997 p.625}"
  tr: "Malik, Ammarah ibn Sayyad'dan rivayetle Ata ibn Yasar'ın kendisine Ebu Eyyub el-Ensari'nin şöyle dediğini aktarır: \"Biz eskiden bir koyunu kurban ederdik; bir adam kendisi ve ailesi adına keserdi. Sonra insanlar bununla övünmeye başladılar ve bu bir gösteriş meselesi haline geldi.\" Editör, rivayet edenin doğru adının Ammarah ibn Sayyad olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.625}"
  id: "Malik meriwayatkan dari Ammarah ibn Sayyad bahwa Ata ibn Yasar memberitahunya bahwa Abu Ayyub al-Ansari berkata kepadanya: “Dahulu kami menyembelih seekor domba, yang disembelih oleh seseorang untuk dirinya dan keluarganya. Kemudian orang-orang mulai membanggakannya, dan itu menjadi masalah pamer.” Editor mencatat bahwa nama perawi yang benar adalah Ammarah ibn Sayyad. {cite:muwatta-maruf-1997 p.625}"
