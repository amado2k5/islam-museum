label: { ar: "الموطأ 2229 — مالك عن هشام بن عروة عن أبيه: كان عند أم سلمة مخنث، فقال لعبد الله بن أبي أمية والنبي يسمع: إن فتح الله عليكم الطائف غدا فأنا أدلك على ابنة غيلان، فإنها تقبل بأربع وتدبر بثمان، فقال رسول الله: لا يدخلن هؤلاء عليكم", en: "Muwatta 2229" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن مخنثا كان عند أم سلمة زوج النبي، فقال لعبد الله بن أبي أمية، ورسول الله يسمع: يا عبد الله، إن فتح الله عليكم الطائف غدا، فأنا أدلك على ابنة غيلان، فإنها تقبل بأربع وتدبر بثمان. فقال رسول الله: لا يدخلن هؤلاء عليكم. ويذكر المحقق أن جمهور رواة الموطأ رووه مرسلا، وأن الصواب عن مالك أنه عن عروة عن زينب بنت أم سلمة عن أمها. {cite:muwatta-maruf-1997 p.316} {cite:muwatta-maruf-1997 p.317}"
