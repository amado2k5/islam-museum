label: { ar: "الموطأ 2229 — مالك عن هشام بن عروة عن أبيه: كان عند أم سلمة مخنث، فقال لعبد الله بن أبي أمية والنبي يسمع: إن فتح الله عليكم الطائف غدا فأنا أدلك على ابنة غيلان، فإنها تقبل بأربع وتدبر بثمان، فقال رسول الله: لا يدخلن هؤلاء عليكم", en: "Muwatta 2229", es: "Muwatta 2229", fr: "Muwatta 2229", ur: "موطا 2229", tr: "El-Muvatta 2229 — Malik, Hişam ibn Urve'den, o da babasından rivayetle: Ümmü Seleme'nin yanında bir hermafrodit vardı ve Peygamberimiz işitirken Abdullah ibn Ebu Ümeyye'ye şöyle dedi: \"Eğer Allah yarın sana Taif'te zafer nasip ederse, sana Gaylan'ın kızını göstereceğim; çünkü o dört çocukla gelir, sekiz çocukla gider.\" Allah'ın Resulü şöyle buyurdu: \"Bu insanlar sana yaklaşmasınlar.\"", id: "Al-Muwatta 2229 — Malik, berdasarkan riwayat Hisham ibn Urwah, berdasarkan riwayat ayahnya: Ada seorang hermafrodit bersama Umm Salamah, dan dia berkata kepada Abdullah ibn Abi Umayyah, sementara Nabi mendengarkan: “Jika Allah memberimu kemenangan atas Ta’if besok, aku akan memperlihatkan kepadamu putri Ghaylan, karena dia datang dengan empat orang dan pergi dengan delapan orang.” Rasulullah SAW bersabda: “Orang-orang ini janganlah menghampirimu.”" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن مخنثا كان عند أم سلمة زوج النبي، فقال لعبد الله بن أبي أمية، ورسول الله يسمع: يا عبد الله، إن فتح الله عليكم الطائف غدا، فأنا أدلك على ابنة غيلان، فإنها تقبل بأربع وتدبر بثمان. فقال رسول الله: لا يدخلن هؤلاء عليكم. ويذكر المحقق أن جمهور رواة الموطأ رووه مرسلا، وأن الصواب عن مالك أنه عن عروة عن زينب بنت أم سلمة عن أمها. {cite:muwatta-maruf-1997 p.316} {cite:muwatta-maruf-1997 p.317}"
  tr: "Malik, Hişam ibn Urva'dan, babasından rivayetle, Peygamberimizin eşi Ümmü Seleme ile birlikte bir hermafrodit bulunduğunu ve Allah Resulü'nün dinlediği sırada Abdullah ibn Ebu Ümeyye'ye şöyle dediğini aktarır: \"Ey Abdullah, eğer Allah sana yarın Taif'te zafer nasip ederse, sana Gaylan'ın kızını göstereceğim; çünkü o dört kişiyle gelir, sekiz kişiyle gider.\" Allah Resulü şöyle buyurdu: \"Böyle insanların yanına girmesine izin verme.\" Araştırmacı, Muvatta'nın ravilerinin çoğunun bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak naklettiğini ve Malik'in rivayetine göre doğru versiyonun, Urva'dan, Zeynep bint Ümmü Seleme'den, annesinin rivayetine dayandığı şeklinde olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.316} {cite:muwatta-maruf-1997 s.317}"
  id: "Malik meriwayatkan dari Hisham bin Urwah, dari ayahnya, bahwa seorang wanita hermafrodit bersama Umm Salamah, istri Nabi, dan dia berkata kepada Abdullah bin Abi Umayyah, sementara Rasulullah mendengarkan: “Wahai Abdullah, jika Allah memberimu kemenangan atas Ta’if besok, aku akan memperlihatkan kepadamu putri Ghaylan, karena dia datang dengan empat dan pergi dengan delapan.” Rasulullah bersabda: “Jangan biarkan orang-orang seperti itu masuk ke dalam dirimu.” Peneliti menyebutkan bahwa mayoritas perawi Muwatta’ meriwayatkannya sebagai mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa versi yang benar dari Malik adalah dari Urwah, dari Zaynab bint Umm Salamah, dari ibunya. {cite:muwatta-maruf-1997 p.316} {cite:muwatta-maruf-1997 p.317}"
