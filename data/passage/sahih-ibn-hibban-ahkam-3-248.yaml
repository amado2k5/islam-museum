text: "… وخرج إلى ما ليس في وسعه، وتكلف إلزام الفرائض بالرد على المسلمين، وإذا كان الرد الذي هو الفرض صار على الكفاية كان ابتداء السلام الذي ليس له خصيص فرض أولى أن يكون على الكفاية. وقوله: أطعِموا الطعام أمر ندب إلى …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 248، يرد فيه ذكر الفريضة والفرائض، والفرض، والمندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
