label: { ar: "سنن أبي داود 4571 — الأب والأبوة", en: "Sunan Abi Dawud 4571 — the father and fatherhood", ur: "سنن ابی داؤد 4571 — باپ اور والدیت" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا وُهَيْبٌ، عَنَ هِشَامٍ، عَنْ أَبِيهِ، عَنِ الْمُغِيرَةِ، عَنْ عُمَرَ، بِمَعْنَاهُ. قَالَ أَبُو دَاوُدَ رَوَاهُ حَمَّادُ بْنُ زَيْدٍ وَحَمَّادُ بْنُ سَلَمَةَ عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّ عُمَرَ، قَالَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4571، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4571 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4571، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
