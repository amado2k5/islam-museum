label: { ar: "سنن أبي داود 3250 — الأب والأبوة", en: "Sunan Abi Dawud 3250 — the father and fatherhood", ur: "سنن ابی داؤد 3250 — باپ اور والدیت", es: "Sunan Abi Dawud 3250 — El padre y la paternidad", fr: "Sunan Abi Dawud 3250 — le père et la paternité" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، حَدَّثَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، عَنْ عُمَرَ، - - قَالَ سَمِعَنِي رَسُولُ اللَّهِ نَحْوَ مَعْنَاهُ إِلَى \" بِآبَائِكُمْ \". زَادَ قَالَ عُمَرُ فَوَاللَّهِ مَا حَلَفْتُ بِهَذَا ذَاكِرًا وَلاَ آثِرًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 3250، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3250 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3250، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3250 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3250 (Serments et Vœux), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
