text: "… الحريقة في جوف جحا كان جحا جائعاً فطلب طعاماً فجاؤوه بحساء شوربا ساخن، فلم يصبر عليه، حتى تهمد حرارته بل تناول الملعقة الأولى، بسرعة، ولهف، فاحترق فمه، وأحس كأن النار تلتهب بين معدته وفمه، فقام هائماً على وجهه، يهرول في …"
summary:
  ar: "ابتلع جحا حساءً ساخنًا يغلي، وركض في الأسواق يصيح بالناس ألا يقتربوا لأن في جوفه نارًا. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  en: "Juha gulps scalding soup and runs through the markets shouting at people not to approach, because there is a fire inside him. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  ur: "جحا نے کھولتا ہوا شوربہ نگل لیا اور بازاروں میں دوڑتے ہوئے لوگوں سے چلا کر کہا کہ قریب نہ آؤ، کیونکہ اس کے پیٹ میں آگ لگی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  fr: "Juha avale une soupe brûlante et court à travers les marchés en criant aux gens de ne pas approcher, car il y a un feu en lui. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
  es: "Juha se traga una sopa hirviendo y corre por los mercados gritando a la gente que no se acerque, porque hay un fuego dentro de él. {cite:juha-nawadir-kubra-djuwaydi p. 17}"
