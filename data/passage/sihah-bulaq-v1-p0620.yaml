text: |-
  ⁦( كلد )⁩
  ٢٥
  أزهر لم يولد بنجم الشمح * سيمم البيت كريم السنخ
  هذا قول أبى زيدوه والمعروف عند العرب وقال الفرّاء أكفأ الشاعر اذا خالف بين حركات
  الروي وهو مشل الاقواء حكاه عنه ابن السكيت الكسائى كفأت الاناه كييته وأكفاته
  أملته قال واهذا قيل أكفأت القوس اذا أملت رأسها ولم تنصبها نصباحين ترمى عنها قال
  ومنه قول ذى الرمّة
  قطعت بها أرضائرى وجه ركيها * اذا ماعلوها مكفأ غير ساجع ١
  وقال أبو زيد يعنى جائراغير قاصد والسكتىء النظير وكذلك الكف والكذؤ على فعل وفعل
  والمصدر الكفاءة بالفتح والمد وتقول لاكفاءله بالكسر وهو فى الاصل مصدر أى لا تطير له
  وفى حديث العقيقة شاتان مكافتشان أى متساويتان والمحدثون يقولون مكافأتان وكل شئ
  ساوى شيئاحتى يكون مثله فهومكافىّ له وقال بعضهم فى تفسير الحديت تدبح احداهما
  مقابلة الاخرى وكافأته على ما كان منه مكافأة وكفا جازيته تقول مالى يه قبل ولا كفاء
  أى مالى به طاقة على أن أكافته والتكافؤ الاستواء يقال المسلون تسكافأدماؤهم
  واكتفأت الاناء مثل كفأنه أى قلبته واستكفأت فلانا ابله أى سألته نتاج ابله سنة فأكفأنيها
  أى أعطانى لبنها ووبرها وأولادهاسنة والاسم السكفاة والكفأة يضم ويفتح تقول أعطنى
  كفأة ناقتك وكفأة ناقتك وتقول أيضا أ كفأت ابلى كفأتين اذا جعلتها نصفين تنتج كل عام
  نصفها وتترك تنصفالان أفضل النتاج أن تحمل على الابل الفحولة عاما وتترك عاما كما يصنع
  بالارض فى الزراعة قال ذو الرمّة
  كلد كفأتيها تنقصان ولم يجد * لهاثيل سقب فى النشاجين لامس
  يقول ائما نتحت اناثا كلها وهذا محمود عندهم أبو زيد وهبت له كفأة ناقتى وكفأة ناقتى يضم
  ويفتح وهبت له وادها ولبتها ووبرهاسنة ⁦(كلاً)⁩ الكلا العشب وقد كائت الارض وأكلات
  ذهى أرض مكلتة وكلنة أى ذات كلا وسواء رطبه ويابسه وكلات الناقة وأكلات اذا
  أكات الكالا حكاه أبو عبيد وكلا اللّٰه كلاءة بالكسر أى حفظه وحرسه يقال آذهب فى كلاءة
  اللّٰه وا كتلات منهم أحترست قال الشاعر أنخت بعيرى واكتلات بعينه ويقال
  اكتلات عينى اذ الم تنم وسهرت وحذرت أمر اوالمكلا بالتشديد شاطئ النهر ومرفأ السفر
  أبوزيد كلاً القوم سفيقتهم تكليتا حيسوها ومنه الكلاء مشتد معدودوه وموضع بالبصرة
  لانهم يكاتون سفنهم هناك أى يحبسونها يؤّنت ويذكر وقال سيبويه هو فعال مشل جبار
  بالتشديد والمعنى أنّ الموضع يدفع الرويح عن السفن ويحفظها وهوعلى هذامذ كر مصروف
  وقال الاصمعى الكلا والمكلاً موضع ترفأفيه السفن وهوساحل كل نهروكلات تكلئة
  اذا أتيت مكانافيه مستنر من الريح والموضع مكلا وكلاء وقولهم بلغ اللّٰه بك أكلا العمرأى
  آخره وأبعده وكلاً الدين أى تأخر والكالئ النسيئة قال الشاعر وعينه كالكالئ الضمار
  أى نقده كالنيئة التى لا ترحى وفى الحديث انه عليه السلام نهى عن الكالئ بالسكالئ وهو
  بيع النسيئة بالنسيئة وكان الاصمعى لا يهمزه وينشد
  واذا تباشرك الهمو*م فانها كال وناخز أى منهانسيئة ومنها ماهو نقد أبو عبيد تكلات
  ١ أى ممالاغير مستقيم اه
  قوله على فعل وفعل بعنى بسكون
  الفاءوضمها وفى أكنرنسخ
  الصحاح فعل وفعول وهو من
  تحريف الناسخ اه من المختار
