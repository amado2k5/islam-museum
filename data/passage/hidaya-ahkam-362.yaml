text: "… خطوطاً بالأصابع. ثم المسحُ علىٰ ظاهر الخفِّ حَتْمُ، حتىٰ لا يجوزُ علىٰ باطنِ الخُفَ وعَقِبِهِ وساقِه؛ لأنه معدولٌ به عن القياس، فيُراعىٰ فيه جميعُ ما وَرَدَ به الشرعُ. والبَداءَةُ من الأصابع: استحبابٌ؛ اعتباراً بالأصل، وهو الغَسْل. قال: وفَرْضُ ذلك: مقدارُ …"
