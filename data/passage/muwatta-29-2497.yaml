label: { ar: "الموطأ 2497 — مالك: المنقلة فيها خمس عشرة فريضة", en: "Muwatta 2497", es: "Muwatta 2497", fr: "Muwatta 2497", ur: "موطا 2497", tr: "Al-Muwatta 2497 — Malik: Devir işlemi on beş zorunlu görevi içermektedir.", id: "Al-Muwatta 2497 — Malik: Pengalihan tersebut mencakup lima belas kewajiban" }
summary:
  ar: "قال مالك: والأمر عندنا أن في المنقلة خمس عشرة فريضة. والمنقلة التي يطير فراشها من العظم ولا تخرق إلى الدماغ، وهي تكون في الرأس وفي الوجه. {cite:muwatta-maruf-1997 p.428}"
  tr: "Malik şöyle dedi: Bizim mezhebimize göre, kafa travması için on beş farz namaz vardır. Kafa travması, kemik parçalarının fırladığı ancak beyne ulaşmadığı durumdur; baş veya yüz bölgesinde meydana gelebilir. {cite:muwatta-maruf-1997 s.428}"
  id: "Malik berkata: Menurut mazhab kami, ada lima belas salat wajib untuk cedera kepala. Cedera kepala adalah cedera di mana serpihan tulang terlepas tetapi tidak menembus otak; cedera ini dapat terjadi di kepala atau wajah. {cite:muwatta-maruf-1997 p.428}"
