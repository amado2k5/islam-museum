text: "… فيه شيئاً، ولم يُحَرّمه، صالح الناس فهم تبع للحلال : - عبد الرزاق عن الثوري عن رجل من قريش عن أُمّه أَنها سأَلت أَبا هريرة عن قضاء رمضان فقال : لا بأُس بأَن يفرقه إنما هي عِدَّة من أَيامِ أُخر. …"
