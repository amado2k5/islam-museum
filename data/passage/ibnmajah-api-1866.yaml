label: { ar: "سنن ابن ماجه 1866 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan Ibn Majah 1866 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن ابن ماجہ 1866 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Ibn Majah 1866 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sunan Ibn Majah 1866 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan İbn Majah 1866 — Baba ve Babalık, Anne Babaya İyilik mi Yoksa Onlara İtaatsizlik mi?", id: "Sunan Ibn Majah 1866 — Ayah dan Peran Ayah, Berbakti kepada Orang Tua atau Tidak Taat kepada Mereka" }
text: "… امْرَأَةً أَخْطُبُهَا فَقَالَ \" اذْهَبْ فَانْظُرْ إِلَيْهَا فَإِنَّهُ أَجْدَرُ أَنْ يُؤْدَمَ بَيْنَكُمَا \". فَأَتَيْتُ امْرَأَةً مِنَ الأَنْصَارِ فَخَطَبْتُهَا إِلَى أَبَوَيْهَا وَأَخْبَرْتُهُمَا بِقَوْلِ النَّبِيِّ ـ. فَكَأَنَّهُمَا كَرِهَا ذَلِكَ. قَالَ فَسَمِعَتْ ذَلِكَ الْمَرْأَةُ وَهِيَ فِي خِدْرِهَا فَقَالَتْ إِنْ كَانَ رَسُولُ اللَّهِ ـ أَمَرَكَ أَنْ تَنْظُرَ فَانْظُرْ. وَإِلاَّ فَإِنِّي أَنْشُدُكَ كَأَنَّهَا أَعْظَمَتْ ذَلِكَ. قَالَ فَنَظَرْتُ إِلَيْهَا فَتَزَوَّجْتُهَا. فَذَكَرَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1866، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1866 (The Chapters on Marriage), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1866، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1866 (Los capítulos sobre el matrimonio), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1866 (Les chapitres sur le mariage), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "İbn Majah'ın Sünen'inde yer alan 1866 numaralı hadis, baba ve babalık kavramını, anne babaya saygı göstermeyi veya göstermemeyi ele almaktadır. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1866, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
