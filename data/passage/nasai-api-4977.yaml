text: "أَخْبَرَنَا سُلَيْمَانُ بْنُ سَلْمٍ الْمَصَاحِفِيُّ الْبَلْخِيُّ، قَالَ حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ حَدَّثَنَا حَمَّادٌ، قَالَ أَنْبَأَنَا يُوسُفُ، عَنِ الْحَارِثِ بْنِ حَاطِبٍ، أَنَّ رَسُولَ اللَّهِ أُتِيَ بِلِصٍّ فَقَالَ \" اقْتُلُوهُ \". فَقَالُوا يَا رَسُولَ اللَّهِ إِنَّمَا سَرَقَ. فَقَالَ \" اقْتُلُوهُ \". قَالُوا يَا رَسُولَ اللَّهِ إِنَّمَا سَرَقَ. قَالَ \" اقْطَعُوا يَدَهُ \". قَالَ ثُمَّ سَرَقَ فَقُطِعَتْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4977، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan al-Nasa'i, no. 4977 (The Book of Cutting off the Hand of the Thief), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن نسائی کی حدیث نمبر 4977، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
