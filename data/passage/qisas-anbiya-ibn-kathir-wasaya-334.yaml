text: "… مبارك بن فضالة عن الحسن : ألقى يوسف في الجب وهو ابن سبع عشرة سنة، وغاب عن أبيه ثمانين سنة، وعاش بعد ذلك ثلاثاً وعشرين سنة، ومات وهو ابن مائة سنة وعشرين سنة. وقال غيره : أوصى إلى أخيه يهوذا، …"
