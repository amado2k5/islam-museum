text: |-
  الليل وقدزاغ يزيغ وزاغ البصر أى كلّ وأزاعه عن الطريق أى أماله وزاغت الشمس
  أى مالت وذلك اذافا، الفى" وقوم زاغة عن الشى أى زاتغون والترايغ التمايل قال أبوزيد
  تزيغت المسرأة أى تزينت وتبرّجت
  سبوعا انسعت وأسبغ اللّه عليه النعمة أى أتمها واسباغ الوضوء اتمامه وسبغت الناقة
  سدفاألقت ولدها وة د أشعر وذنب سابغ أى واف والابغة الدرع الواسعة ورجل
  منيغ عليه درع سابغة وتسبغة البيضة مالوصل به البيضة من حلق الدرع فتستر العنق
  لان البيضة به تسبغ ولولاه لسكان بينها وبين جيب الدرع خلل وعورة قال الاصمعىّ يقال
  يضة لهاسابغ وخل سابغ أى طويل الجردان وضدّه الكمس ( فغ غسغت الشئ
  فى التراب دسمته فيه وتسغسغ فى الارمض أى دخل قال رؤية* ان لم يعقنى عائق التسغسغ*
  يعنى الموت وسغسغت الطعام أو سعته دسما وسغسفت رأسى اذا وضعت عليه الدهن بكفك
  وعصرته ليتشرب وأصله سغغته بشلاث غينات الا أنهم أبدلوا من الفيز الوسطى سينا فرقا
  بين فعلل وفعل وانغمازادوا السين دون سائر الحروف لان فى الحرف سينا وكذلك لءول
  فى جميع ما أشبهه من المضاعف مثل لقلق وعثعت وكعكع ( لغ سلفت البقرة والساة
  تسلغ ساوعًا اذا أسقطت السن التى خلف السديس وصلغت فهى سالغ وصالغ وكذلك
  الاننى بغيرالهاء وذل فى السنة السادسة والاوغ فى ذوات الاظلاف بمنزلة المعزول فى
  ذوات الاخفاف لانهما أقصى أسنائم مالان واد المبقرة أول سنة عجل ثم تسع أجذع ثم ثىّ
  ثمرباع ثم سديس ثم سالغ سنة وسالغ سنتين الى مازاد وولد الشاة أوّل سنة سحل أوجدى
  ثم جذع ثم ثىّ ثم رباع ثم-ديس تم سالغ وحكى الفراءلحم أسلغ بين السلغ يطبخ فلا ينضمج
  وسلخ رأسه لغة فى ثلغه سوغ) ساغ الشراب بسو غ-وغا أى سهل مدخله فى الخلق
  وسغته أنا أسوغموأسيغه بتعدى ولا يتعدى والاجود أسغته اساغة بقال أسغ لى غصتى
  أى أمهلنى ولا تعجلنى قال تع الى يتجرّعه ولا يكاد يسيغه والسواغ يكسر السين ما أسغت
  به غصتك بقال الماءسواغ الغصص ومنه قول الكميت * وكانت سواغاان جنت بغمة
  وساغ له ما فعل أى جازله ذلك وأناسوّغتهه أى جوّزنه ويقال هذاسوغ (هذا وسبغ هذا
  لذذى ولد بعده ولم يولد بينهما ويقال هى أخته سوغه وسوغته أيضا
  صل لشين فغ لشغشفة تحريك السنات فى المطعون وقال أبو عبيدة هى
  أن يدخله ويخرجه وأنشد لعبدمناف بن ربع الهذلى
  فالطعن شغشغة والضرب هيقعة • ضبرب المعوّل تحت الديمة العضدا
  والمعوّل الذى يبني العالة وهى شبه القللة يستربح امن المطر والشغشغة ضرب سن الهدير
  صل الصاء بغ) الصبغ والسبغة ما يصبغ بدوالمع أصباغ والصبغ أيضا
  ما يصطبغ به من الادام ومنه قوله تمالى وصبغ للا كلين والمع صباغ قال الرابخ
