text: "… يسمع له بمشهد إلا شهوده الفتح، وحنيناً، والطائف. وكان قد ابتاع الحلة التي أرادوا أن يُدْفَنَ فيها رسول اللّٰه عله بسبعة دنانير، فلم يكفن فيها رسول اللّٰه عليه، فتركها لنفسه ليكفن فيها، فلما حضرته الوفاةِ قال: لا تكفنوني فيها، فلو …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 696، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
