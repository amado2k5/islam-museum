label: { ar: "الموطأ 348 — عثمان: من شهد العشاء فكأنما قام نصف ليلة ومن شهد الصبح فكأنما قام ليلة", en: "Muwatta 348", es: "Muwatta 348", fr: "Muwatta 348", ur: "موطا 348", tr: "Al-Muwatta 348 — Osman: Yatsı namazına katılan, gecenin yarısını namaz kılmış gibidir; sabah namazına katılan ise bütün gece namaz kılmış gibidir." }
text: "من شهد العشاء فكأنما قام نصف ليلة، ومن شهد الصبح فكأنما قام ليلة"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم التيمي عن عبد الرحمن بن أبي عمرة الأنصاري، في باب ما جاء في العتمة والصبح: جاء عثمان بن عفان إلى صلاة العشاء فرأى أهل المسجد قليلاً فاضطجع في مؤخر المسجد ينتظر أن يكثر الناس، فجلس إليه ابن أبي عمرة وسأله عثمان عن نفسه وعما معه من القرآن، ثم قال له إن من شهد العشاء فكأنما قام نصف ليلة ومن شهد الصبح فكأنما قام ليلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد موقوفاً، وينقل عن ابن عبد البر أن مثله لا يُدرك بالرأي وأنه روي مرفوعاً من طريق عثمان بن حكيم عن محمد بن إبراهيم ⁦(التمهيد 23/352–353)⁩، ويذكر أن الدارقطني والترمذي رجحا المرفوع، ويخرّجه عند مسلم (2/125) وأبي داود (555) والترمذي (221) وابن خزيمة وابن حبان. {cite:muwatta-maruf-1997 p.192} {cite:muwatta-maruf-1997 p.193}"
  tr: "Malik'in, Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim el-Taymi'den, o da Abdülrahman ibn Abi Amrah el-Ensari'den rivayet ettiği, İşa ve Fecr namazları hakkında rivayet edilenler bölümünde yer alan bir rivayette şöyle denmektedir: Osman ibn Affan İşa namazına geldi ve mescitteki insanların az olduğunu görünce, insanların artmasını beklemek üzere mescidin arka tarafına uzandı. İbn Abi Amrah onun yanına oturdu ve Osman ona kendisi ve Kur'an hakkında bildikleri hakkında sorular sordu. Sonra ona şöyle dedi: \"İşa namazına katılan, gecenin yarısını namaz kılmış gibidir; Fecr namazına katılan ise, bütün gece namaz kılmış gibidir.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten bir Sahabe sözü (mevkuf) olarak naklettiğini belirtiyor ve İbn Abdülberr'in böyle bir şeyin kişisel görüşle anlaşılamayacağını, Osman ibn Hakim'in zinciriyle Muhammed ibn İbrahim'den rivayet edilen ve Peygamber'e kadar uzanan (merfu') bir hadis olduğunu söylediğini aktarıyor (el-Temhid 23/352-353). El-Daraqutni ve el-Tirmizi'nin ikinci versiyonu daha güçlü kabul ettiğini ve bunun Müslim (2/125), Ebu Davud (555), el-Tirmizi (221), İbn Huzeyme ve İbn Hibban'ın derlemelerinde yer aldığını belirtiyor. {cite:muwatta-maruf-1997 s.192} {cite:muwatta-maruf-1997 s.193}"
  id: "Sebuah riwayat yang diceritakan oleh Malik, dari Yahya ibn Sa'id, dari Muhammad ibn Ibrahim al-Taymi, dari Abd al-Rahman ibn Abi 'Amrah al-Ansari, dalam bab tentang apa yang diriwayatkan mengenai salat Isya dan Subuh: Utsman ibn Affan datang ke salat Isya dan melihat bahwa orang-orang di masjid sedikit, maka ia berbaring di belakang masjid menunggu orang-orang bertambah. Ibn Abi 'Amrah duduk bersamanya, dan Utsman bertanya kepadanya tentang dirinya dan apa yang dia ketahui tentang Al-Quran. Kemudian dia berkata kepadanya, \"Siapa pun yang menghadiri salat Isya seolah-olah dia telah berdiri dalam salat selama setengah malam, dan siapa pun yang menghadiri salat Subuh seolah-olah dia telah berdiri dalam salat sepanjang malam.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkan hadits ini dari Malik sebagai pernyataan seorang Sahabat (mawquf), dan ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa hal seperti itu tidak dapat dipahami melalui pendapat pribadi, dan bahwa hadits ini diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi (marfu') melalui sanad Utsman bin Hakim, berdasarkan otoritas Muhammad bin Ibrahim (al-Tamhid 23/352-353). Ia menyebutkan bahwa al-Daraqutni dan al-Tirmidhi menganggap versi yang terakhir sebagai versi yang lebih kuat, dan hadits ini termasuk dalam kumpulan hadits Muslim (2/125), Abu Dawud (555), al-Tirmidhi (221), Ibnu Khuzaymah, dan Ibnu Hibban. {cite:muwatta-maruf-1997 p.192} {cite:muwatta-maruf-1997 p.193}"
