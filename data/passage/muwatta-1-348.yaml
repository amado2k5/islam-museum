label: { ar: "الموطأ 348 — عثمان: من شهد العشاء فكأنما قام نصف ليلة ومن شهد الصبح فكأنما قام ليلة", en: "Muwatta 348" }
text: "من شهد العشاء فكأنما قام نصف ليلة، ومن شهد الصبح فكأنما قام ليلة"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم التيمي عن عبد الرحمن بن أبي عمرة الأنصاري، في باب ما جاء في العتمة والصبح: جاء عثمان بن عفان إلى صلاة العشاء فرأى أهل المسجد قليلاً فاضطجع في مؤخر المسجد ينتظر أن يكثر الناس، فجلس إليه ابن أبي عمرة وسأله عثمان عن نفسه وعما معه من القرآن، ثم قال له إن من شهد العشاء فكأنما قام نصف ليلة ومن شهد الصبح فكأنما قام ليلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد موقوفاً، وينقل عن ابن عبد البر أن مثله لا يُدرك بالرأي وأنه روي مرفوعاً من طريق عثمان بن حكيم عن محمد بن إبراهيم (التمهيد 23/352–353)، ويذكر أن الدارقطني والترمذي رجحا المرفوع، ويخرّجه عند مسلم (2/125) وأبي داود (555) والترمذي (221) وابن خزيمة وابن حبان. {cite:muwatta-maruf-1997 p.192} {cite:muwatta-maruf-1997 p.193}"
