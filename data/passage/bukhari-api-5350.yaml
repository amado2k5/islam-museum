label: { ar: "صحيح البخاري 5350 — استحلال الشيء", en: "Sahih al-Bukhari 5350 — treating a thing as lawful", ur: "صحیح بخاری 5350 — کسی چیز کو حلال ٹھہرانا", es: "Sahih al-Bukhari 5350 — tratar algo como lícito", fr: "Sahih al-Bukhari 5350 — considérer une chose comme licite", tr: "Sahih el-Buhari 5350 — Bir şeyi helal kılmak", id: "Sahih al-Bukhari 5350 — Memperbolehkan sesuatu" }
text: "… حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرٍو، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عُمَرَ، أَنَّ النَّبِيَّ قَالَ لِلْمُتَلاَعِنَيْنِ \" حِسَابُكُمَا عَلَى اللَّهِ، أَحَدُكُمَا كَاذِبٌ، لاَ سَبِيلَ لَكَ عَلَيْهَا \". قَالَ يَا رَسُولَ اللَّهِ مَالِي. قَالَ \" لاَ مَالَ لَكَ، إِنْ كُنْتَ صَدَقْتَ عَلَيْهَا، فَهْوَ بِمَا اسْتَحْلَلْتَ مِنْ فَرْجِهَا، وَإِنْ كُنْتَ كَذَبْتَ عَلَيْهَا، فَذَاكَ أَبْعَدُ وَأَبْعَدُ لَكَ مِنْهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5350، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5350 (Divorce), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5350، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5350 (Divorcio), menciona el hecho de considerar algo como lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 5350 (Divorce), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 5350 numaralı hadis, bir şeyin helal ve haram olduğunu belirtir. Helal ve haram bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntılar derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5350, menyebutkan tentang kebolehan sesuatu. Bagian halal dan haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
