label: { ar: "صحيح البخاري 7410 — مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 7410 — forgiveness of past sins", ur: "صحیح بخاری 7410 — پچھلے گناہوں کی مغفرت", es: "Sahih al-Bukhari 7410 — Perdón de los pecados pasados", fr: "Sahih al-Bukhari 7410 — pardon des péchés passés", tr: "Sahih el-Buhari 7410 — Geçmiş günahların affı", id: "Sahih al-Bukhari 7410 — Pengampunan dosa masa lalu" }
text: "… ائْتُوا عِيسَى عَبْدَ اللَّهِ وَرَسُولَهُ وَكَلِمَتَهُ وَرُوحَهُ. فَيَأْتُونَ عِيسَى فَيَقُولُ لَسْتُ هُنَاكُمْ وَلَكِنِ ائْتُوا مُحَمَّدًا عَبْدًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ وَمَا تَأَخَّرَ. فَيَأْتُونِي فَأَنْطَلِقُ فَأَسْتَأْذِنُ عَلَى رَبِّي فَيُؤْذَنُ لِي عَلَيْهِ، فَإِذَا رَأَيْتُ رَبِّي وَقَعْتُ لَهُ سَاجِدًا فَيَدَعُنِي مَا شَاءَ اللَّهُ أَنْ يَدَعَنِي ثُمَّ يُقَالُ لِي ارْفَعْ مُحَمَّدُ، وَقُلْ يُسْمَعْ، وَسَلْ تُعْطَهْ، وَاشْفَعْ تُشَفَّعْ. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7410، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 7410 (Oneness, Uniqueness of Allah (Tawheed)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 7410، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7410 (Unicidad de Alá (Tawhid)), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 7410 (Unicité d'Allah), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "Sahih el-Buhari'de 7410 numaralı hadis, geçmiş günahların affedilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7410, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
