label: { ar: "صحيح البخاري 3605 — الأب والأبوة", en: "Sahih al-Bukhari 3605 — the father and fatherhood", ur: "صحیح بخاری 3605 — باپ اور والدیت", es: "Sahih al-Bukhari 3605 — El padre y la paternidad" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ مُحَمَّدٍ الْمَكِّيُّ، حَدَّثَنَا عَمْرُو بْنُ يَحْيَى بْنِ سَعِيدٍ الأُمَوِيُّ، عَنْ جَدِّهِ، قَالَ كُنْتُ مَعَ مَرْوَانَ وَأَبِي هُرَيْرَةَ فَسَمِعْتُ أَبَا هُرَيْرَةَ، يَقُولُ سَمِعْتُ الصَّادِقَ الْمَصْدُوقَ، يَقُولُ \" هَلاَكُ أُمَّتِي عَلَى يَدَىْ غِلْمَةٍ مِنْ قُرَيْشٍ \". فَقَالَ مَرْوَانُ غِلْمَةٌ. قَالَ أَبُو هُرَيْرَةَ إِنْ شِئْتَ أَنْ أُسَمِّيَهُمْ بَنِي فُلاَنٍ وَبَنِي فُلاَنٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3605، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3605 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3605، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3605 (Virtudes y méritos del Profeta y sus compañeros), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
