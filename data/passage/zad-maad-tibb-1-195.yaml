text: "… عنه خلافُه. ويذكر عنه: مِنْ خَيْرِ خِصَالِ الصَّائِمِ السِّواكُ، رواه ابن ماجه من حديث مجالد وفيه ضعف ابن ماجه: فصل الاكتحال للصانم وروي عنه يل، أنه اكتحل وهو صائم، ورُوي عنه، أنه خرج عليهم في رمضان وعيناه مملوءتان من الإثْمِدِ …"
