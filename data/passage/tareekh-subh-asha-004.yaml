text: "لمنا ذلك ، والذى نعرف به المقر الكريم أنا كنا رسمنا بأن لا يكتب له جواب ورد كتابه وقاصده ؛ ولما تكرر استشفاعه بالمقر الكريم، ودخل دخول الحريم، وعرفنا أنه ضاقت عليه الأرض برحبها وأخلص فى الندم، عطفت عليه الصدقات"
