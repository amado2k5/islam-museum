text: "الدين، ويعلمهم السنة ومعالم الإسلام، ويأخذ منهم صدقاتهم . وكتب له كتابا عهد فيه عهده، وأمره فيه أمره ، على ماسيأتى ذكره فى أول نسخ العهود الواردة فى هذا الكتاب إن شاء الله تعالى . فقد فوض النبى صلى الله"
