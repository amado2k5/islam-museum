label: { ar: "مسلم 2983 — أنا وكافل اليتيم كهاتين في الجنة", en: "Muslim 2983 — I and the orphan's sponsor are like these two in Paradise", es: "Musulmán 2983 — Yo y el patrocinador del huérfano somos como estos dos en el Paraíso", fr: "Muslim 2983 — Moi et le parrain de l'orphelin sommes comme ces deux-là au Paradis", ur: "مسلم 2983 - میں اور یتیم کی کفالت کرنے والے جنت میں ان دونوں کی طرح ہیں۔", tr: "Müslim 2983 — Ben ve bir yetime himaye eden kişi, cennette bu iki kişi gibi olacağız.", id: "Muslim 2983 — Aku dan orang yang menafkahi anak yatim akan seperti dua orang ini di Surga" }
text: "قال رسول الله: «كافل اليتيم له أو لغيره، أنا وهو كهاتين في الجنة»، وأشار مالك بالسبابة والوسطى"
summary:
  ar: "رواية أبي هريرة في باب ثواب كافل اليتيم من كتاب الزهد في صحيح مسلم؛ قرن مكانة كافل اليتيم بالنبي في الجنة بإشارة إصبعين."
  tr: "Sahih Müslim'deki İhtisas Kitabı'nda yetime himaye etmenin sevabı bölümünde Ebu Hurayra'nın rivayetinde; yetime himaye edenin konumunu, iki parmağıyla işaret ederek Peygamber'in cennetteki konumuna bağlamıştır."
  id: "Riwayat Abu Hurairah dalam bab tentang pahala menafkahi anak yatim dari Kitab Asketisme dalam Sahih Muslim; beliau mengaitkan kedudukan orang yang menafkahi anak yatim dengan Nabi di Surga dengan menunjuk menggunakan dua jari."
