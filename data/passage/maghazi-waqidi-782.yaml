text: "هذا كتاب من محمد رسول اللاه لاسلم. لمن امن منهم بالله ، وشهد انه لا اله الا اللاه وان محمدا عبده ورسوله ؛ فانه امن بامان اللاه ، وله ذمة الله وذمة رسوله . وان امرنا وامركم واحد علي من دهمنا من"
