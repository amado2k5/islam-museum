label: { ar: "بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 170 — ما فُرض على الناس، الفرض", en: "Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 170 — what was made obligatory on people; the obligatory (fard)", ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 170 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 170 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 170 — lo que se impuso a la gente; lo obligatorio (fard)" }
text: "… سمع النداء فإن العلماء اختلفوا فيها، فذهب الجمهور إلى أنها سنة أو فرض على الكفاية. وذهبت الظاهرية إلى أن صلاة الجماعة فرض متعين على كل مكلف. والسبب في اختلافهم تعارض مفهومات الآثار في ذلك، وذلك أن ظاهر قوله واليم صَلَاةُ …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 170، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض العين، وما وجب على كل مسلم، وفرض الكفاية؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 170, whose wording mentions what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn), a duty laid on every Muslim, the communal obligation (fard kifaya); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 170 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ عین، جو ہر مسلمان پر لازم ہے، فرضِ کفایہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 170, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation individuelle (fard 'ayn), un devoir imposé à chaque musulman, l'obligation collective (fard kifaya) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 170, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación individual (fard 'ayn), un deber impuesto a cada musulmán, la obligación colectiva (fard kifaya); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
