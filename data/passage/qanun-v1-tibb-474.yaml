text: "… يفعل في الجراحات فعل دم الأخوين، ويوضع على كسر العظام وحده وبقيروطي. آلات المفاصل : ينفع لأوجاع العصب، ويدخل في مراهم الفالج والتمدّد، ودهنه يحلّل الاعياء ويليّن الأعصاب، وينفع من كسيرة لالنا يراجع : التداوي بالنباتات والأعشاب، قديماً وحديثاً، أحمد …"
summary:
