summary:
  ar: "قال مالك: ولا يصلح لمن دفع إلى رجل مالا قراضا أن يشترط عليه الزكاة في حصته من الربح خاصة؛ لأن رب المال إذا اشترط ذلك، فقد اشترط لنفسه فضلا من الربح ثابتا فيما سقط عنه من حصة الزكاة التي تصيبه من حصته. ولا يجوز لرجل أن يشترط على من قارضه أن لا يشتري إلا من فلان، لرجل يسميه، فذلك غير جائز، لأنه يصير له رسولا بأجر ليس بمعروف. {cite:muwatta-maruf-1997 p.226}"
