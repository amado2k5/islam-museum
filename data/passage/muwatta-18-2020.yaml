label: { ar: "الموطأ 2020 — مالك: لا يصلح لمن دفع إلى رجل مالا قراضا أن يشترط عليه الزكاة في حصته من الربح خاصة، ولا أن يشترط عليه أن لا يشتري إلا من فلان", en: "Muwatta 2020", es: "Muwatta 2020", fr: "Muwatta 2020", ur: "موطا 2020", tr: "Al-Muwatta 2020 — Malik: Bir kimseye borç para veren kişinin, kârın kendi payına düşen kısmından zekât ödemesini şart koşması veya sadece falanca kişiden satın almasını şart koşması caiz değildir.", id: "Al-Muwatta 2020 — Malik: Tidak diperbolehkan bagi seseorang yang memberi uang kepada orang lain sebagai pinjaman untuk mensyaratkan bahwa ia membayar zakat atas bagian keuntungannya secara khusus, atau mensyaratkan bahwa ia hanya membeli dari si fulan." }
summary:
  ar: "قال مالك: ولا يصلح لمن دفع إلى رجل مالا قراضا أن يشترط عليه الزكاة في حصته من الربح خاصة؛ لأن رب المال إذا اشترط ذلك، فقد اشترط لنفسه فضلا من الربح ثابتا فيما سقط عنه من حصة الزكاة التي تصيبه من حصته. ولا يجوز لرجل أن يشترط على من قارضه أن لا يشتري إلا من فلان، لرجل يسميه، فذلك غير جائز، لأنه يصير له رسولا بأجر ليس بمعروف. {cite:muwatta-maruf-1997 p.226}"
  tr: "Malik şöyle demiştir: Bir kimseye borç para veren kişinin, zekâtın sadece kendi payına düşen kâr üzerinden ödenmesini şart koşması caiz değildir. Borç veren bunu şart koşarsa, esasen kârın belirli bir kısmını kendine ayırmış olur ve bu da zekât payından düşülür. Ayrıca, bir kimsenin borç ortağının sadece adını verdiği belirli bir kişiden mal satın almasını şart koşması da caiz değildir. Bu caiz değildir çünkü borç ortağını haksız bir ücret karşılığında aracı konumuna getirir. {cite:muwatta-maruf-1997 s.226}"
  id: "Malik berkata: Tidak diperbolehkan bagi seseorang yang memberi uang kepada orang lain sebagai pinjaman untuk menetapkan bahwa zakat hanya dibayarkan atas bagian keuntungannya. Jika pemberi pinjaman menetapkan hal ini, pada dasarnya ia mengklaim sebagian keuntungan tetap untuk dirinya sendiri, yang dikurangkan dari bagian zakatnya. Lebih lanjut, tidak diperbolehkan bagi seseorang untuk menetapkan bahwa penerima pinjamannya hanya membeli dari individu tertentu yang ia sebutkan. Hal ini tidak diperbolehkan karena menjadikan penerima pinjaman sebagai agen dengan imbalan yang tidak wajar. {cite:muwatta-maruf-1997 p.226}"
