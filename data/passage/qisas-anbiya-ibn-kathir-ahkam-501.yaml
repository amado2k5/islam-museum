text: "… لا، وأنا يومئذ لا أدري. فلقيت ابن عباس فذكرت ذلك له، فقال : أما علمت أن ثمانية كانت على نبي اللّٰه واجبة، لم يكن نبي اللّٰه لينقص منها شيئا ؟ وتعلم أن اللّٰه كان قاضيا عن موسى. عدته التي وعده، …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 501، يرد فيه ذكر الواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 501, whose wording mentions the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 501 کا اقتباس جس میں واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Qisas al-Anbiya' de Ibn Kathir, p. 501, dont le texte mentionne l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Qisas al-Anbiya' de Ibn Kathir, p. 501, cuyo texto menciona lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 501. sayfasından bir alıntı, farz olan amellerden bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Kathir, \"Kisah Para Nabi,\" halaman 501, menyebutkan amalan-amalan wajib; ini diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan-amalan wajib, kewajiban, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
