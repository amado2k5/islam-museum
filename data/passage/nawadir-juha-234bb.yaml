label: { ar: "نوادر جحا الكبرى، ص 110 — «هل تبيض الدجاجة المطبوخة؟»", en: "Nawadir Juha al-Kubra, p. 110 — 'Does a Cooked Hen Lay Eggs? Part Three'", ur: "نوادر جحا الکبریٰ، ص 110 — «کیا پکی ہوئی مرغی انڈے دیتی ہے؟ تیسرا حصہ»", fr: "Nawadir Juha al-Kubra, p. 110 — « Une poule cuite pond-elle des œufs ? Troisième partie »", es: "Nawadir Juha al-Kubra, p. 110 — «¿Pone huevos una gallina cocinada? Tercera parte»" }
text: "نوادر جحا الكبرى فقال الفندقيُّ : أَلَمْ أَقل لك أنَّ الحساب قد طال وقتُهُ عليك، فإنّي أفصِّلُهُ، فتظهرُ المسألةُ بأجلى مظاهرِها، وعندها لا يكون لك حقُّ بإساءةِ الظنِّ، فأنت أتيْتَ إلينا منذُ ثلاثةِ أشهرٍ، فالدجاجةُ التي أكلتها، لو باضَتْ كُلَّ …"
summary:
  ar: "رُفعت القضية إلى الوالي فسأل هل اتُفق على ثمن، فقال التاجر لا، وسأل هل يمكن لدجاجتين وست بيضات أن تعطي آلاف البيض، فاعترض التاجر، وأُجلت القضية، واستُدعي جحا للدفاع عن التاجر فوصل متأخراً وقال إنه كان يحمل قمحاً مسلوقاً إلى شريكه. {cite:juha-nawadir-kubra-djuwaydi p. 110}"
  en: "The case goes to the governor, who asks whether a price was agreed, and the merchant says no. The governor asks whether two hens and six eggs could give thousands of eggs, and the merchant objects. The case is postponed, and Juha is called to defend the merchant and arrives late, saying he was bringing boiled wheat to his partner. {cite:juha-nawadir-kubra-djuwaydi p. 110}"
  ur: "مقدمہ والی کے پاس جاتا ہے جو پوچھتا ہے کہ کیا کوئی قیمت طے ہوئی تھی، تو تاجر کہتا ہے نہیں۔ والی پوچھتا ہے کہ کیا دو مرغیاں اور چھ انڈے ہزاروں انڈے دے سکتے ہیں، تو تاجر اعتراض کرتا ہے۔ مقدمہ ملتوی ہو جاتا ہے اور جحا کو تاجر کی طرف سے دفاع کے لیے بلایا جاتا ہے، وہ دیر سے پہنچتا ہے اور کہتا ہے کہ وہ اپنے شریک کے لیے ابلا ہوا گیہوں لے جا رہا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 110}"
  fr: "L'affaire est portée devant le gouverneur, qui demande si un prix avait été convenu, et le marchand dit que non. Le gouverneur demande si deux poules et six œufs pourraient donner des milliers d'œufs, et le marchand proteste. L'affaire est reportée, et Juha est appelé pour défendre le marchand; il arrive en retard et dit qu'il apportait du blé bouilli à son associé. {cite:juha-nawadir-kubra-djuwaydi p. 110}"
  es: "El caso llega al gobernador, que pregunta si se acordó un precio, y el mercader dice que no. El gobernador pregunta si dos gallinas y seis huevos podrían dar miles de huevos, y el mercader protesta. El caso se aplaza, y Juha es llamado para defender al mercader y llega tarde, diciendo que llevaba trigo cocido a su socio. {cite:juha-nawadir-kubra-djuwaydi p. 110}"
