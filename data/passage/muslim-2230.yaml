  tr: "Sahih Müslim'in Barış Kitabı'nda yer alan, \"Kim falcıya giderse, namazı kabul olmaz\" başlıklı bölümde, Peygamberimizin eşlerinden bazılarının rivayeti."
  id: "Riwayat dari beberapa istri Nabi dalam surah tentang siapa pun yang pergi ke peramal, doanya tidak akan diterima, dari Kitab Perdamaian dalam Sahih Muslim."
