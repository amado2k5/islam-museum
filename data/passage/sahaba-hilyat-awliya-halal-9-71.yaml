text: "… حلال الدنيا ويشفقون منها أشد من حذر الجمال من حرامها لأنه لا يسلم من الدنيا من ينالها، ولا يسلم مق شرها من أحبها وأمن مكرها، هى حتف أهلها دون الحتف، واعلم أن المالم بالله الخائف من اللّٰه يهدم بحق اللّٰه …"
