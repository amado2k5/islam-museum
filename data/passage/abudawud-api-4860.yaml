text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى بْنِ فَارِسٍ، حَدَّثَنَا الْفِرْيَابِيُّ، عَنْ إِسْرَائِيلَ، عَنِ الْوَلِيدِ، - قَالَ أَبُو دَاوُدَ وَنَسَبَهُ لَنَا زُهَيْرُ بْنُ حَرْبٍ - عَنْ حُسَيْنِ بْنِ مُحَمَّدٍ، عَنْ إِسْرَائِيلَ، فِي هَذَا الْحَدِيثِ - قَالَ الْوَلِيدُ بْنُ أَبِي هِشَامٍ - عَنْ زَيْدِ بْنِ زَائِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يُبَلِّغْنِي أَحَدٌ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4860، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4860 (General Behavior (Kitab Al-Adab)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4860، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4860 (Conducta General (Kitab Al-Adab)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4860 (Guide pratique), mentionne la paternité et la filiation. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
