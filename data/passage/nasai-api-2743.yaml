label: { ar: "سنن النسائي 2743 — ما لا يحل", en: "Sunan al-Nasa'i 2743 — what is not lawful", ur: "سنن نسائی 2743 — جو حلال نہیں", es: "Sunan al-Nasa'i 2743 — lo que no es lícito", fr: "Sunan al-Nasa'i 2743 — ce qui n'est pas licite" }
text: "… بْنُ سَعِيدٍ، عَنْ جَعْفَرِ بْنِ مُحَمَّدٍ، قَالَ حَدَّثَنَا أَبِي قَالَ، أَتَيْنَا جَابِرَ بْنَ عَبْدِ اللَّهِ فَسَأَلْنَاهُ عَنْ حَجَّةِ النَّبِيِّ، فَحَدَّثَنَا أَنَّ عَلِيًّا قَدِمَ مِنَ الْيَمَنِ بِهَدْىٍ وَسَاقَ رَسُولُ اللَّهِ مِنَ الْمَدِينَةِ هَدْيًا قَالَ لِعَلِيٍّ \" بِمَا أَهْلَلْتَ \". قَالَ قُلْتُ اللَّهُمَّ إِنِّي أُهِلُّ بِمَا أَهَلَّ بِهِ رَسُولُ اللَّهِ وَمَعِيَ الْهَدْىُ. قَالَ \" فَلاَ تَحِلَّ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2743، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2743 (The Book of Hajj), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2743، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2743 (El Libro del Hajj), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2743 (Le Livre du Hajj), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
