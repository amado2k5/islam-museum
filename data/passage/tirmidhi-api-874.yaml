label: { ar: "جامع الترمذي 874 — النافلة والنوافل، التطوع", en: "Jami' al-Tirmidhi 874 — the supererogatory (nafila); the voluntary act (tatawwu')", ur: "جامع ترمذی 874 — نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩", fr: "Jami' al-Tirmidhi 874 — le surérogatoire (nafila) ; l'acte volontaire (tatawwu')", es: "Yami' al-Tirmidhi 874 — lo supererogatorio (nafila); el acto voluntario (tatawwu')", tr: "Cami' el-Tirmizi 874 - Nafl ve Nawafil, Gönüllü Eylemler", id: "Jami' al-Tirmidzi 874 — Nafl dan Nawafil, Tindakan Sukarela" }
text: "… عُثْمَانَ. قَالَ أَبُو عِيسَى حَدِيثُ بِلاَلٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَيْهِ عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ لاَ يَرَوْنَ بِالصَّلاَةِ فِي الْكَعْبَةِ بَأْسًا. وَقَالَ مَالِكُ بْنُ أَنَسٍ لاَ بَأْسَ بِالصَّلاَةِ النَّافِلَةِ فِي الْكَعْبَةِ. وَكَرِهَ أَنْ تُصَلَّى الْمَكْتُوبَةُ فِي الْكَعْبَةِ. وَقَالَ الشَّافِعِيُّ لاَ بَأْسَ أَنْ تُصَلَّى الْمَكْتُوبَةُ وَالتَّطَوُّعُ فِي الْكَعْبَةِ لأَنَّ حُكْمَ النَّافِلَةِ وَالْمَكْتُوبَةِ فِي الطَّهَارَةِ وَالْقِبْلَةِ سَوَاءٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 874، يرد فيه ذكر النافلة والنوافل، والتطوع، وما لا بأس به، والصلاة المكتوبة، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 874 (The Book on Hajj), whose wording mentions the supererogatory (nafila), the voluntary act (tatawwu'), what is said to be no harm, the prescribed prayer, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 874، جس کے الفاظ میں نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩، جس میں کوئی مضائقہ نہیں، فرض نماز، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 874, dont le texte mentionne le surérogatoire (nafila), l'acte volontaire (tatawwu'), ce qui est dit sans inconvénient, la prière prescrite, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 874, cuyo texto menciona lo supererogatorio (nafila), el acto voluntario (tatawwu'), lo que se dice que no tiene inconveniente, la oración prescrita, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 874 numaralı hadis, nafile amelleri, gönüllü amelleri, helal amelleri, farz namazları ve mekruh amelleri zikretmektedir. Bu hadis, farz amelleri, itaat amelleri, tavsiye edilen amelleri, mekruh amelleri, haram amelleri ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 874, menyebutkan amalan sunnah, amalan sukarela, amalan yang diperbolehkan, salat wajib, dan amalan yang tidak disukai. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
