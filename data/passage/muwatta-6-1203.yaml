summary:
  ar: "يقول مالك إن التكبير في أيام التشريق واجب على الرجال والنساء، من كان في جماعة أو وحده، بمنى أو بالآفاق، وإنما يأتم الناس في ذلك بإمام الحاج وبالناس بمنى، لأنهم إذا رجعوا وانقضى الإحرام ائتموا بهم. أما من لم يكن حاجا فإنه لا يأتم بهم إلا في تكبير أيام التشريق. {cite:muwatta-maruf-1997 p.540}"
