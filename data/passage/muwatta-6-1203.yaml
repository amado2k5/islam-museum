label: { ar: "الموطأ 1203 — مالك: التكبير في أيام التشريق واجب على الرجال والنساء، في جماعة أو وحده، بمنى أو بالآفاق", en: "Muwatta 1203", es: "Muwatta 1203", fr: "Muwatta 1203", ur: "موطا 1203", tr: "El-Muvatta 1203 — Malik: Teşrik günlerinde tekbir, Mina'da veya başka bir yerde, cemaatle veya tek başına, erkekler ve kadınlar için farzdır.", id: "Al-Muwatta 1203 — Malik: Takbir pada hari-hari Tashreeq wajib bagi laki-laki dan perempuan, berjamaah atau sendirian, di Mina atau di tempat lain." }
summary:
  ar: "يقول مالك إن التكبير في أيام التشريق واجب على الرجال والنساء، من كان في جماعة أو وحده، بمنى أو بالآفاق، وإنما يأتم الناس في ذلك بإمام الحاج وبالناس بمنى، لأنهم إذا رجعوا وانقضى الإحرام ائتموا بهم. أما من لم يكن حاجا فإنه لا يأتم بهم إلا في تكبير أيام التشريق. {cite:muwatta-maruf-1997 p.540}"
  tr: "Malik, teşrik günlerinde tekbir getirmenin (\"Allahu Ekber\") hem erkekler hem de kadınlar için, cemaat halinde veya yalnız, Mina'da veya başka bir yerde farz olduğunu söyler. İnsanlar bu konuda hacıların imamını ve Mina'daki insanları takip ederler, çünkü onlar döndüklerinde ve ihram hali sona erdiğinde onları takip ederler. Hac yapmayanlara gelince, onlar teşrik günlerinde tekbir getirmek dışında onları takip etmezler. {cite:muwatta-maruf-1997 s.540}"
  id: "Malik mengatakan bahwa takbir (mengucapkan \"Allahu Akbar\") pada hari-hari Tasyriq hukumnya wajib bagi laki-laki dan perempuan, baik berjamaah maupun sendirian, di Mina maupun di tempat lain. Orang-orang mengikuti imam jamaah haji dan orang-orang di Mina dalam hal ini, karena ketika mereka kembali dan keadaan ihram berakhir, mereka mengikuti mereka. Adapun bagi mereka yang tidak melaksanakan haji, mereka tidak mengikuti mereka kecuali dalam takbir pada hari-hari Tasyriq. {cite:muwatta-maruf-1997 p.540}"
