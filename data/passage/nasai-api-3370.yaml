label: { ar: "سنن النسائي 3370 — الحلال، الحرام", en: "Sunan al-Nasa'i 3370 — the lawful; the unlawful", ur: "سنن نسائی 3370 — حلال، حرام", es: "Sunan al-Nasa'i 3370 — lo lícito; lo ilícito", fr: "Sunan al-Nasa'i 3370 — le licite; l'illicite" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ حَدَّثَنَا خَالِدٌ، عَنْ شُعْبَةَ، عَنْ أَبِي بَلْجٍ، قَالَ سَمِعْتُ مُحَمَّدَ بْنَ حَاطِبٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ فَصْلَ مَا بَيْنَ الْحَلاَلِ وَالْحَرَامِ الصَّوْتُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3370، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3370 (The Book of Marriage), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3370، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3370 (El Libro del Matrimonio), menciona lo lícito y lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3370 (Le Livre du Mariage), mentionne ce qui est licite et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
