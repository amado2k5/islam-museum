text: "لا يزال الناس بخير ما عجلوا الفطر"
summary:
  ar: "أول حديث في باب ما جاء في تعجيل الفطر. يرويه مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي، أن النبي قال: لا يزال الناس بخير ما عجلوا الفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه الترمذي (699) وابن حبان والبغوي، وإسحاق الطباع وإسماعيل بن عمر عند أحمد، وسويد، والقعنبي، والتنيسي عند البخاري (1957)، وابن القاسم عند النسائي، والشافعي، ومحمد بن الحسن الشيباني (364). {cite:muwatta-maruf-1997 p.389}"
