text: "لا يزال الناس بخير ما عجلوا الفطر"
summary:
  ar: "أول حديث في باب ما جاء في تعجيل الفطر. يرويه مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي، أن النبي قال: لا يزال الناس بخير ما عجلوا الفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه الترمذي (699) وابن حبان والبغوي، وإسحاق الطباع وإسماعيل بن عمر عند أحمد، وسويد، والقعنبي، والتنيسي عند البخاري (1957)، وابن القاسم عند النسائي، والشافعي، ومحمد بن الحسن الشيباني (364). {cite:muwatta-maruf-1997 p.389}"
  tr: "Orucun çabuk açılması konusundaki bölümdeki ilk hadis. Malik'in, Ebu Hazim ibn Dinar'dan, o da Sahl ibn Sa'd el-Sa'idi'den rivayet ettiğine göre, Peygamber şöyle buyurmuştur: \"İnsanlar oruçlarını çabuk açtıkları sürece sağlıklı kalırlar.\" Editör, bu hadisin Malik'ten Ebu Mus'ab tarafından, onun aracılığıyla da Tirmizi (699), İbn Hibban, el-Baghawi, İshak el-Tabba', İsmail ibn Ömer (Ahmed'e göre), Süveyd, el-Ka'nebi ve el-Tunisi (Buhari'ye göre, 1957), İbn el-Kâsım (Nesai'ye göre), el-Şafiî ve Muhammed ibn el-Hasan el-Şeybani'ye (364) nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.389}"
  id: "Hadits pertama dalam bab tentang bersegera berbuka puasa. Diriwayatkan oleh Malik dari Abu Hazim ibn Dinar dari Sahl ibn Sa'd al-Sa'idi, bahwa Nabi bersabda: \"Manusia akan tetap sehat selama mereka bersegera berbuka puasa.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh al-Tirmidhi (699), Ibn Hibban, al-Baghawi, Ishaq al-Tabba', Isma'il ibn 'Umar (menurut Ahmad), Suwaid, al-Qa'nabi, dan al-Tunisi (menurut al-Bukhari, 1957), Ibn al-Qasim (menurut al-Nasa'i), al-Shafi'i, dan Muhammad ibn al-Hasan al-Shaybani (364). {cite:muwatta-maruf-1997 p.389}"
