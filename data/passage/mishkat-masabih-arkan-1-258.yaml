text: "… خبر أي هو يشتري نفسه بدليل قوله: فمعتقها والإعتاق يصح من المشتري، وقوله: فمعتقها خبر بعد الخبر، ويجوز أن يكون بدل البعض من قوله: فبائعٌ نفسه، قيل: لعل المعنى بالإيمان هنا شعبة، كما في قوله ل: الإيمان بضع وسبعون شعبة، …"
summary:
