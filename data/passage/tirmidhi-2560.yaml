label:
  ar: "الترمذي 2560 — حفت الجنة بالمكاره وحفت النار بالشهوات"
  en: "Tirmidhi 2560 — Paradise is surrounded by hardships and the Fire by desires"
  ur: "ترمذی 2560 — جنت ناپسندیدہ چیزوں سے اور آگ خواہشات سے گھیر دی گئی ہے"
text: "لما خلق الله الجنة والنار أرسل جبريل إلى الجنة فقال انظر إليها وإلى ما أعددت لأهلها فيها قال فجاءها ونظر إليها وإلى ما أعد الله لأهلها فيها قال فرجع إليه قال فوعزتك لا يسمع بها أحد إلا دخلها . فأمر …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2560: حفت الجنة بالمكاره وحفت النار بالشهوات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2560: Paradise is surrounded by hardships and the Fire by desires. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2560: جنت ناپسندیدہ چیزوں سے اور آگ خواہشات سے گھیر دی گئی ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
