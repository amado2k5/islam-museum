ref: "2560"
label:
  ar: "الترمذي 2560 — حفت الجنة بالمكاره وحفت النار بالشهوات"
  en: "Tirmidhi 2560 — Paradise is surrounded by hardships and the Fire by desires"
  ur: "ترمذی 2560 — جنت ناپسندیدہ چیزوں سے اور آگ خواہشات سے گھیر دی گئی ہے"
  es: "Tirmidhi 2560 — El Paraíso está rodeado de dificultades y el Fuego de deseos."
  fr: "Tirmidhi 2560 — Le Paradis est entouré d'épreuves et le Feu de désirs."
  tr: "Tirmizi 2560 — Cennet zorluklarla çevrilidir, cehennem ise arzularla çevrilidir."
  id: "Tirmidhi 2560 — Surga dikelilingi oleh kesulitan, dan Neraka dikelilingi oleh keinginan."
text: "لما خلق الله الجنة والنار أرسل جبريل إلى الجنة فقال انظر إليها وإلى ما أعددت لأهلها فيها قال فجاءها ونظر إليها وإلى ما أعد الله لأهلها فيها قال فرجع إليه قال فوعزتك لا يسمع بها أحد إلا دخلها . فأمر …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2560: حفت الجنة بالمكاره وحفت النار بالشهوات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2560: Paradise is surrounded by hardships and the Fire by desires. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2560: جنت ناپسندیدہ چیزوں سے اور آگ خواہشات سے گھیر دی گئی ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, núm. 2560: El Paraíso está rodeado de penurias y el Fuego de deseos. El Profeta lo relata de su Señor; Hadith Qudsi Browser reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi dans Jami al-Tirmidhi, no. 2560: Le Paradis est entouré d'épreuves et le Feu de désirs. Le Prophète le raconte de la part de son Seigneur; le navigateur Hadith Qudsi rassemble ses narrations à travers les six livres et le Muwatta."
  tr: "Cami' el-Tirmizi'de 2560 numaralı hadis-i kudsi şöyledir: Cennet zorluklarla çevrilidir, cehennem ise arzularla çevrilidir. Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi (firman ilahi) dalam Jami' al-Tirmidhi, no. 2560: Surga dikelilingi oleh kesulitan, dan Neraka dikelilingi oleh hawa nafsu. Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta'."
