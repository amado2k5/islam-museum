label: { ar: "صحيح مسلم 6959 — الأب والأبوة", en: "Sahih Muslim 6959 — the father and fatherhood", ur: "صحیح مسلم 6959 — باپ اور والدیت", es: "Sahih Muslim 6959 — El padre y la paternidad" }
text: "… زِمَامَهَا بِأَرْضٍ قَفْرٍ لَيْسَ بِهَا طَعَامٌ وَلاَ شَرَابٌ وَعَلَيْهَا لَهُ طَعَامٌ وَشَرَابٌ فَطَلَبَهَا حَتَّى شَقَّ عَلَيْهِ ثُمَّ مَرَّتْ بِجِذْلِ شَجَرَةٍ فَتَعَلَّقَ زِمَامُهَا فَوَجَدَهَا مُتَعَلِّقَةً بِهِ \". قُلْنَا شَدِيدًا يَا رَسُولَ اللَّهِ. فَقَالَ رَسُولُ اللَّهِ \" أَمَا وَاللَّهِ لَلَّهُ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ مِنَ الرَّجُلِ بِرَاحِلَتِهِ \". قَالَ جَعْفَرٌ حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ إِيَادٍ عَنْ أَبِيهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6959، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6959 (The Book of Repentance), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6959، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6959 (El Libro del Arrepentimiento), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
