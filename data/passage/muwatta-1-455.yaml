label: { ar: "الموطأ 455 — بلاغ: ابن مسعود يدب راكعاً", en: "Muwatta 455" }
summary:
  ar: "بلاغ في باب ما يفعل من جاء والإمام راكع: يروي مالك أنه بلغه أن عبد الله بن مسعود كان يدب راكعاً حتى يصل الصف. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق أخرج عن قتادة قول ابن مسعود إنه لا بأس أن تركع دون الصف، وعن زيد بن وهب أنه دخل مع ابن مسعود المسجد والإمام راكع فركعا ثم مضيا حتى استويا في الصف. {cite:muwatta-maruf-1997 p.233}"
