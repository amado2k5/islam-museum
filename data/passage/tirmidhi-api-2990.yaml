text: "… مَنْ، سَمِعَ عَلِيًّا، يَقُولُ لَمَّا نَزَلَتْ هَذِهِ الآيَةُ : (إِنْ تُبْدُوا مَا فِي أَنْفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُمْ بِهِ اللَّهُ فَيَغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ ) الآيَةَ أَحْزَنَتْنَا قَالَ قُلْنَا يُحَدِّثُ أَحَدُنَا نَفْسَهُ فَيُحَاسَبُ بِهِ لاَ نَدْرِي مَا يُغْفَرُ مِنْهُ وَلاَ مَا لاَ يُغْفَرُ فَنَزَلَتْ هَذِهِ الآيَةُ بَعْدَهَا فَنَسَخَتْهَا ( لاَ يُكَلِّفُ اللَّهُ نَفْسًا إِلاَّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2990، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2990 (Chapters on Tafsir), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2990، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
