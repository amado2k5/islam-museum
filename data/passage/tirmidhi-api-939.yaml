label: { ar: "جامع الترمذي 939 — عمل يعدل عملا أعظم منه", en: "Jami' al-Tirmidhi 939 — a deed that equals a greater one", ur: "جامع ترمذی 939 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… بْنِ يَزِيدَ، عَنِ ابْنِ أُمِّ مَعْقِلٍ، عَنْ أُمِّ مَعْقِلٍ، عَنِ النَّبِيِّ قَالَ \" عُمْرَةٌ فِي رَمَضَانَ تَعْدِلُ حَجَّةً \". وَفِي الْبَابِ عَنِ ابْنِ عَبَّاسٍ وَجَابِرٍ وَأَبِي هُرَيْرَةَ وَأَنَسٍ وَوَهْبِ بْنِ خَنْبَشٍ. قَالَ أَبُو عِيسَى وَيُقَالُ هَرَمُ بْنُ خَنْبَشٍ. قَالَ بَيَانٌ وَجَابِرٌ عَنِ الشَّعْبِيِّ عَنْ وَهْبِ بْنِ خَنْبَشٍ. وَقَالَ دَاوُدُ الأَوْدِيُّ عَنِ الشَّعْبِيِّ عَنْ هَرَمِ بْنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 939، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 939 (The Book on Hajj), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 939، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
