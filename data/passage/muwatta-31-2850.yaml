label: { ar: "الموطأ 2850 — عطاء بن يزيد الليثي عن أبي سعيد: ومن يستعفف يعفه الله", en: "Muwatta 2850", es: "Muwatta 2850", fr: "Muwatta 2850", ur: "موطا 2850", tr: "El-Muvatta 2850 — Ata’ ibn Yazid el-Laythi, Ebu Sa’id’den rivayetle: Kim iffet dilerse, Allah ona iffet verir.", id: "Al-Muwatta 2850 — Ata’ ibn Yazid al-Laythi berdasarkan riwayat Abu Sa’id: Dan barangsiapa yang berusaha menjaga kesucian, maka Allah akan memberikannya kesucian." }
summary:
  ar: "يروي مالك عن ابن شهاب، عن عطاء بن يزيد الليثي، عن أبي سعيد الخدري أن ناسا من الأنصار سألوا رسول الله فأعطاهم، ثم سألوه فأعطاهم، حتى نفد ما عنده. فقال: ما يكون عندي من خير فلن أدخره عنكم، ومن يستعفف يعفه الله، ومن يستغن يغنه الله، ومن يتصبر يصبره الله، وما أعطي أحد عطاء هو خير وأوسع من الصبر. {cite:muwatta-maruf-1997 p.597}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Ata ibn Yazid al-Laythi, dari Abu Sa'id al-Khudri, bahwa sebagian kaum Ansar meminta sesuatu kepada Rasulullah shalla Allahu alaihi wa sallam, lalu beliau memberikannya kepada mereka. Kemudian mereka meminta lagi, dan beliau memberikannya kepada mereka, hingga beliau tidak memiliki apa pun lagi. Beliau bersabda: \"Apa pun kebaikan yang kumiliki, tidak akan kutahan dari kalian. Barangsiapa yang berusaha menjaga kesucian, Allah akan memberikannya kesucian; barangsiapa yang berusaha mandiri, Allah akan memberikannya mandiri; dan barangsiapa yang berusaha bersabar, Allah akan memberikannya kesabaran. Dan tidak ada karunia yang lebih baik dan lebih banyak daripada kesabaran.\" {cite:muwatta-maruf-1997 p.597}"
