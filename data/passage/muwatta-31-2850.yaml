label: { ar: "الموطأ 2850 — عطاء بن يزيد الليثي عن أبي سعيد: ومن يستعفف يعفه الله", en: "Muwatta 2850" }
summary:
  ar: "يروي مالك عن ابن شهاب، عن عطاء بن يزيد الليثي، عن أبي سعيد الخدري أن ناسا من الأنصار سألوا رسول الله فأعطاهم، ثم سألوه فأعطاهم، حتى نفد ما عنده. فقال: ما يكون عندي من خير فلن أدخره عنكم، ومن يستعفف يعفه الله، ومن يستغن يغنه الله، ومن يتصبر يصبره الله، وما أعطي أحد عطاء هو خير وأوسع من الصبر. {cite:muwatta-maruf-1997 p.597}"
