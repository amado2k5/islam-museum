label: { ar: "الموطأ 2854 — رجل من بني أسد: لا يسأل من له أوقية أو عدلها فقد سأل إلحافا", en: "Muwatta 2854", es: "Muwatta 2854", fr: "Muwatta 2854", ur: "موطا 2854", tr: "El-Muvatta 2854 — Beni Esad kabilesinden bir adam: Elinde bir gram veya ona denk bir şey olan kimse istemesin, çünkü o küstahça bir istekte bulunmuştur.", id: "Al-Muwatta 2854 — Seorang pria dari Banu Asad: Barangsiapa memiliki satu ons atau yang setara dengannya, janganlah ia meminta, karena ia telah meminta dengan lancang." }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن عطاء بن يسار، عن رجل من بني أسد أنه نزل هو وأهله ببقيع الغرقد، فطلب إليه أهله أن يسأل النبي شيئا يأكلونه. فوجد عنده رجلا يسأله، فقال النبي: لا أجد ما أعطيك. فتولى الرجل عنه غاضبا وهو يقول: لعمري إنك لتعطي من شئت. فقال النبي: إنه ليغضب علي أن لا أجد ما أعطيه، ومن سأل منكم وله أوقية أو عدلها فقد سأل إلحافا. قال الأسدي: فقلت لقحة لنا خير من أوقية. ويبين مالك أن الأوقية أربعون درهما. فرجع ولم يسأله، ثم قدم على النبي بعد ذلك شعير وزبيب فقسم لهم منه حتى أغناهم الله. {cite:muwatta-maruf-1997 p.599}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari Ata ibn Yasar, dari seorang pria dari Banu Asad yang, bersama keluarganya, berkemah di Baqi' al-Gharqad. Keluarganya memintanya untuk meminta sesuatu kepada Nabi (shalawat dan salam kepadanya) untuk mereka makan. Ia menemukan seorang pria bersama Nabi yang meminta sesuatu kepadanya, dan Nabi berkata, \"Aku tidak punya apa-apa untuk diberikan kepadamu.\" Pria itu berpaling dengan marah, berkata, \"Demi hidupku, engkau memberi kepada siapa pun yang engkau kehendaki!\" Nabi berkata, \"Dia marah kepadaku karena aku tidak punya apa-apa untuk diberikan kepadanya. Siapa pun di antara kalian yang meminta padahal memiliki satu ons biji-bijian atau yang setara dengannya, telah meminta dengan lancang.\" Pria dari Banu Asad itu berkata, \"Aku berkata, 'Seekor unta betina kami lebih baik daripada satu ons biji-bijian.'\" Malik menjelaskan bahwa satu ons biji-bijian adalah empat puluh dirham. Pria itu kembali tanpa meminta kepada Nabi. Kemudian, jelai dan kismis dibawa kepada Nabi, dan beliau membagikan sebagian darinya kepada mereka hingga Allah memperkaya mereka. {cite:muwatta-maruf-1997 p.599}"
