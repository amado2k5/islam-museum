text: "باب ذكر نبينا محمد ل وذكر نسبه ذكر وجوب تقديم محبته وير على النفس والولد والوالد: عن أنس بن مالك، قال: قال رسول اللّٰه وتايي : لا يؤمن أحدكم حتى أكون أحب إليه من نفسه ووالده وولده والناس أجمعين. أخرجاه …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 81، يذكر ما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
