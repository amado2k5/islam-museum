text: "… يقول : كنت أعود السرى فى كل ثلاثة أيام عيادة السنة، فدخات عليه وهو يجود بنفسه، فجلست عند رأسه فيكيت، وسقط من دموعى على خده، ففتح عينيه ونظر الى فقلت له أوصنى، فقال. لا تصحب الاشرار. ولا تشتغل عن اللّٰه …"
