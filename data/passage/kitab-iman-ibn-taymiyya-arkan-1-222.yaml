text: "… عن هؤلاء فقال: لا يزني الزاني حين يزني وهو مؤمن، وقال: لا يؤمن أحدكم حتى يحب لأخيه من الخير ما يحبه لنفسه : وقال لا يؤمن من لا يأمن جاره بوائقه وأقسم على ذلك مرات. وقال المؤمن من أمنه الناس …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 222، يذكر ما لا يتم الإيمان إلا به، وما يرتفع معه الإيمان حين الفعل، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 222, that mentions what faith is not complete without, what faith is lifted by at the moment of the act, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 222 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، وہ عمل جس کے وقت ایمان اٹھ جاتا ہے، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 222, que menciona lo que no está completo sin la fe, lo que fortalece la fe en el momento del acto y una descripción del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 222): ce passage mentionne ce sans quoi la foi est incomplète, ce qui la fortifie au moment de l'acte, et une description du croyant. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 222. sayfasından bir alıntı, iman için gerekli olan şeyleri, amel yoluyla imanı yükselten unsurları ve müminin özelliklerini anlatmaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 222, menyebutkan apa yang penting bagi iman, apa yang meningkatkan iman melalui perbuatan, dan menggambarkan seorang mukmin. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
