text: "… ما قلتم وبددما اخْسترَقم فنصبه على التعب قال والله أعسلم أهو ذلك أم لا فاما قراءة العامة فالرفع ويقولون هو اسم من أسماء الله سبمانه قال الازهرى ما علت أحدا من القراء قرأ بديع بالنصب والتعجبُ فيه غير جاتزوان باء …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 3، ص 361، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 3, p. 361, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 3، ص 361 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Lisan al-'Arab de Ibn Manzur, volumen 3, pág. 361, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Lisan al-'Arab d'Ibn Manzur, volume 3, page 361, mentionne les lectures du Coran et les lecteurs; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
