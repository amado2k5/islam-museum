text: "… فإِلى ما تدعويا محمّد؟ قال : أَدعوك إلى أَن تشهد أَن لا إله إِلَّا اللّٰه وأَنى رسول الله، وأَن تُقيم الصلاة، وتُؤْتىَ الزكاة - وتفعل، وتفعل، حتى عدّ خِصال الإسلام. فقال عِكْرِمَة : واللهِ ما دعوتَ إلَّا إلى الحقّ وأَمرٍ …"
summary:
