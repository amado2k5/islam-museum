label: { ar: "الموطأ 914 — الفرافصة بن عمير: رأى عثمان بن عفان بالعرج يغطي وجهه وهو محرم", en: "Muwatta 914", es: "Muwatta 914", fr: "Muwatta 914", ur: "موطا 914", tr: "El-Muvatta 914 — El-Farafisa ibn Umayr: O, El-Arj'da Osman ibn Affan'ı ihramlı haldeyken yüzünü örtmüş olarak gördü.", id: "Al-Muwatta 914 — Al-Farafisa ibn Umayr: Dia melihat Uthman ibn Affan di Al-Arj menutupi wajahnya ketika dia dalam keadaan ihram" }
text: "يغطي وجهه وهو محرم"
summary:
  ar: "أول حديث في باب تخمير المحرم وجهه. يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد، أنه قال: أخبرني الفرافصة بن عمير الحنفي أنه رأى عثمان بن عفان بالعرج يغطي وجهه وهو محرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1047) وسويد (494)، وأن البيهقي (5/54) رواه عن القعنبي عن سليمان بن بلال عن يحيى بن سعيد. {cite:muwatta-maruf-1997 p.440}"
  tr: "Bu hadis bölümündeki ilk hadis, hacı olan bir kişinin ihramlı halde yüzünü örtmesiyle ilgilidir. Malik, Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayet etmiştir. El-Farafisa ibn Umeyr el-Hanafi bana, Osman ibn Affan'ı el-Arj'da ihramlı haldeyken yüzünü örterken gördüğünü bildirmiştir. Editör, bu hadisin Malik'ten Ebu Mus'ab (1047) ve Suveyd (494) tarafından rivayet edildiğini ve el-Beyhaki'nin (5/54) bunu el-Ka'nebi'den, o da Süleyman ibn Bilal'den, o da Yahya ibn Sa'id'den rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.440}"
  id: "Hadits pertama dalam bab ini adalah tentang seorang jamaah haji yang menutupi wajahnya saat ihram. Diriwayatkan oleh Malik dari Yahya ibn Sa'id dari al-Qasim ibn Muhammad, yang berkata: Al-Farafisa ibn 'Umayr al-Hanafi memberitahuku bahwa dia melihat 'Uthman ibn 'Affan di al-'Arj menutupi wajahnya saat ihram. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1047) dan Suwayd (494), dan bahwa al-Bayhaqi (5/54) meriwayatkan dari al-Qa'nabi dari Sulayman ibn Bilal dari Yahya ibn Sa'id. {cite:muwatta-maruf-1997 p.440}"
