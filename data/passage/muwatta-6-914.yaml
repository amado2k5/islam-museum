text: "يغطي وجهه وهو محرم"
summary:
  ar: "أول حديث في باب تخمير المحرم وجهه. يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد، أنه قال: أخبرني الفرافصة بن عمير الحنفي أنه رأى عثمان بن عفان بالعرج يغطي وجهه وهو محرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1047) وسويد (494)، وأن البيهقي (5/54) رواه عن القعنبي عن سليمان بن بلال عن يحيى بن سعيد. {cite:muwatta-maruf-1997 p.440}"
