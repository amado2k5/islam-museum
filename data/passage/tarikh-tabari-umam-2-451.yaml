text: "… فرعونْ اشدّ غلظةً ولا أقسى قلبا ولا أسوأ، ملكةً لبنى أسرائيل منه يعذّبهم فيجعلم خَدَمًا وخّوَلا وصنّفهم فى أعماله، فصنفْ يبنون وصنفّ يحرثون، وصنفً يزرعون له فهم في أعماله ومن لم يكن منهم فى صنعة له من عمله فعليه الجزيةُ …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 2، ص 451، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
