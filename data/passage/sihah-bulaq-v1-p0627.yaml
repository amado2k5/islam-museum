text: |-
  ⁦(شنا)⁩
  وقرى عليهم دائرة السوم يعسنى الهزيمة والشرّومن فتح فهو من المساءة وتقول هبذارجل
  سوء بالاضافة ثم تدخل عليه الالف واللام متقول هذارجل السوءقال الشاعر
  وكنت كذئب السو لمارأى دما * بصاحبه يوما أحال على الدم
  قال الاخفسْ ولا يقال الرجل السوءويقال الحق اليقين وحق البقين جيعالات السوءليس
  بارجل واليقين هو الحق قال ولا يقال هذار جل السو« بالضم وأساء اليه نقيض أحيسن اليه
  والسوآى نقيض الحمسى وفى القرآن ثم كان عاقبة الذين أساوا السوآى يعى النار والسية
  أصاها سيونة فقليت الواويا. وأدغمت ويقال فلان سي الاختياروقد يخفف مثل هين وهين
  وليز ولين قال الطهوى
  ولا يجزون من جسن بسى * ولا يجزون من غلظ بلين
  واهر أقسوآه قبيحة ويقال له عندى ماساءهوناء، ومايسوءه وينوه ابن السكيت سوت به
  ظفا وأسأت به الظنّ قال يثبتون الالف اذاجاوا بالالف واللام وة ولهم ما أنكرك من سوءأى
  لم يكن انكارى ايالذمن سوءرأيته بك انماهواة له المعرفة بك وقسل فى قوله تعالى تخرج
  يضاءمن غير موءاى من غير برص والسوأة العورة والفاحشة والوأة السوآه اللخلة
  المقبصة وسوأت عليه ماصنع تسوئة وتسويشا اذا عبته عليه وقلت له أسأت يقال ان أسأت
  فسوّىْ على قال وسوْت الرجل سواية وحساية مخففان أى ساءه مارآه منى قال سيبويه سألته
  يعى انخليل عن سؤته سوابية فقال هى فعالية بمنزلة علانية والذين قالواسواية حسذفوا
  الهعزة وأصله الهمزقال وسألته عن مسائية فقال مقاوية وأصلها مسادئة فسكرهوا الواو
  مع الهمزة والذين قالوا مسابة حذفوا الهمزة تحفيفا وقولهم الخسل تجرى على مساوبها
  أى انهاوان كانت جهما أوصاب وعيوب قان كرمها يحملها ءلى الجرى وتقول من السوء
  استاء الرجل مئسل استاع كما نقول من القم اغتم يأ ) السى مبالفتح اللين الذى يكون
  فى أطراف الاخلاف قبل نزول الدرة قال زهير
  كمااستغاث بسى *فزغيطلة • خاف العيون ولم ينظربه الحشك ( ١
  الفراء تسيأت الناقة اذا أرسلت لبنها من غير حلب قال وهو السى "رقد انسيأ اللبن
  ف ل لير) أش بوني شأشأْت بالهاداذادعوته وقلت له تنونشو وقال رجل
  من بنى الحرمازتش أنت أوفتح الشين ( طأ شطه الزرع والنبات قراخه واله-ع أشطاء
  وة-د أشطأ الزرع خرج شطوه قال الاخفشر فى قوله تعالى أخرج شطأه أى طرفه أبو عمرو
  شطأت الناقة شطأشددت عليها الرحل وشاطى الوادى شطه وجانيه وتقول شاطى الاودية
  ولا تجمع وشاطأت الرجل اذا مشيت على شاطئ ومشى هو على الشاطئ الآخر ( قأ
  ثقأناب البعيرشأ وثوء اطلع أبوزيد شقأشعره بالمشط شقأفرقه قال والمشقأ المفرق
  والمشقأ بالكسر المشط وشقأته بالعصاثقأ أصبت مشقأ. أى مفرقه ⁦(شنأ)⁩ الشناءة
  مثال الشسناعة البغض وقد شئته شنئا وشنها وشقتا ومئنا وثنا نابالتحريك وشناناء
  بالتسكين وقدرى جما قوله تعالى شنان قوم وهماساذان فالتحريك شاذي المعى لان
  نعلان انماهو من بنامما كان معناه الحرصكة والاضطراب كالضربات واللخفقات
  التكيز
