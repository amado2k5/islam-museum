  tr: "Ebu Nu'aym'ın Hilyat al-Awliya' adlı eserinin 7. resimli cildinin 354. sayfasında yer alan, tedavi ve ilaçtan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
