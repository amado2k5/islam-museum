text: "… لم لم تعالج بهذا الدواء ? فقال : إن أنت لم تأخذ الدينار لم أمسه، وقال الرباطى إن لم تأخذه لم أعالجه. حدثنا إبراهيم بن أحمد بن أبى حصين ثما محمد بن عبد الله الحضر مى ثنا أبو يعقوب يوسف …"
