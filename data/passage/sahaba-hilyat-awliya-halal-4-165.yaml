text: "… قالاثنا إبراهيم بن طهمان عن إسماعيل السدى عن مرة الهمدانى. قال : قرأ علينا على بن أبى طالب صحيفة قدر أصبع كانت فى قراب سيف رسول اللّٰه، وإذا فيها : ان لكل ني حراما وأنا أحرم المدينة، من أحدث حدثا، …"
