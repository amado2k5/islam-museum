text: "… اللّٰه : إنى لأمزح، ولا أقول إلا حقا، ورواه الخطيب عن أَنس. وروى أَبو الشيخ عن عبد اللّٰه بن الحارث بن جَزْء قال : ما رأَيت أحداً أكثر مُزَاح من رسول اللّٰه. وروى المُعَافَى بن زكريا وفيه انقطاع عن عائشةا …"
