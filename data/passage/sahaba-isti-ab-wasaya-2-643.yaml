text: "… وقِيل : سنة ست وأربعين. وقِيل : ذكرنا أباه وعمه وعماته كُلّهم في مواضعهم من هذا سنة سبع وأربعين، وهو ابنُ سبع وسبعين سنة، الكتاب، والحمد لله. وكان عبدُ اللّه بنُ جحش قد أوصى بابنه محمَّد وصَلَّى عليه مروان بن …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 643، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 643, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 643 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 2, pág. 643, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du traité al-Isti'ab d'Ibn 'Abd al-Barr (tome 2, p. 643) mentionnant un testament ou des adieux, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments Browser."
  tr: "İbn Abdülbarr'ın resimli 2. cildi, 643. sayfasındaki el-İsti'ab adlı eserinden bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 2 bergambar, halaman 643, menyebutkan surat wasiat atau testamen terakhir, pemakaman, kuburan, dan makam; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Wills, Inheritance, Antiquities, and Tombs Browser."
