label: { ar: "سنن ابن ماجه 2697 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Sunan Ibn Majah 2697 — a testament or parting counsel; a deathbed and last hours", ur: "سنن ابن ماجہ 2697 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات", es: "Sunan Ibn Majah 2697 — un testamento o consejo de despedida; un lecho de muerte y últimas horas", fr: "Sunan Ibn Majah 2697 — un testament ou des conseils d'adieu; un lit de mort et les dernières heures", tr: "Sunan İbn Majah 2697 — Ölüm anında yapılan son vasiyet veya sözleşme.", id: "Sunan Ibn Majah 2697 — Wasiat atau perjanjian terakhir, pada saat kematian" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ الْمِقْدَامِ، حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، سَمِعْتُ أَبِي يُحَدِّثُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَتْ عَامَّةُ وَصِيَّةِ رَسُولِ اللَّهِ حِينَ حَضَرَتْهُ الْوَفَاةُ وَهُوَ يُغَرْغِرُ بِنَفْسِهِ \" الصَّلاَةَ وَمَا مَلَكَتْ أَيْمَانُكُمْ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2697، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2697 (The Chapters on Wills), that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2697، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2697 (Los capítulos sobre testamentos), menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 2697 (Les chapitres sur les testaments), mentionne un testament ou des dernières volontés, le lit de mort et les dernières heures. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
  tr: "İbn Majah'ın Sünen'inde yer alan 2697 numaralı hadis, son vasiyetten ve ölüm anından bahsetmektedir. Bu hadis, vasiyetler, miras, tarihi kayıtlar ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2697, menyebutkan wasiat terakhir dan saat kematian. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, catatan sejarah, dan makam suci, bersama dengan teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
