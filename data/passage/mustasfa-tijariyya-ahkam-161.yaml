text: "… تعم به البلوى كأوقات الصلاة وكيفيتها، وعدد ركعاتها. ومقدار واجب الزكاة وجنسها فانهم قالوا لا يجوز أن يبين إلا بطريق قاطع. وأما مالا تعم به البلوى كقطع يد السارق، وما يجب على الأئمة من الحد، وذكر أحكام المكاتب، والمدر فيجوز …"
