label: { ar: "الموطأ 1956 — مالك: الأمر عندنا في القوم يشترون السلعة، البز أو الرقيق، فيسمع بها رجل فيقول لأحدهم: هل لك أن أربحك في نصيبك كذا وكذا؟ فإذا رآه قبيحا واستغلاه، فذلك لازم له إذا كان ابتاعه على برنامج وصفة معلومة", en: "Muwatta 1956" }
summary:
  ar: "قال مالك: الأمر عندنا في القوم يشترون السلعة، البز أو الرقيق، فيسمع به الرجل فيقول لرجل منهم: البز الذي اشتريت من فلان قد بلغني صفته وأمره، فهل لك أن أربحك في نصيبك كذا وكذا؟ فيقول: نعم. فيربحه، ويكون شريكا للقوم مكانه. فإذا نظر إليه رآه قبيحا واستغلاه، قال مالك: ذلك لازم له، ولا خيار له فيه، إذا كان ابتاعه على برنامج وصفة معلومة. {cite:muwatta-maruf-1997 p.200}"
