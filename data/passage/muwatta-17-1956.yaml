label: { ar: "الموطأ 1956 — مالك: الأمر عندنا في القوم يشترون السلعة، البز أو الرقيق، فيسمع بها رجل فيقول لأحدهم: هل لك أن أربحك في نصيبك كذا وكذا؟ فإذا رآه قبيحا واستغلاه، فذلك لازم له إذا كان ابتاعه على برنامج وصفة معلومة", en: "Muwatta 1956", es: "Muwatta 1956", fr: "Muwatta 1956", ur: "موطا 1956", tr: "El-Muvatta 1956 — Malik: Bizde durum şöyledir: Bir grup insan kumaş veya köle gibi bir mal satın alır ve bir adam bunu duyar ve içlerinden birine şöyle der: \"Senin payından sana şu kadar kar vereyim mi?\" Eğer o kişi bunu çirkin bulur ve bundan faydalanırsa, bilinen bir program ve tanıma göre satın almışsa, bu onun için bağlayıcıdır.", id: "Al-Muwatta 1956 — Malik: Masalahnya adalah, sekelompok orang membeli suatu barang, seperti kain atau budak, dan seseorang mendengar tentang hal itu dan berkata kepada salah seorang dari mereka: Apakah kamu ingin aku memberimu keuntungan sekian untuk bagianmu? Jika dia melihatnya sebagai sesuatu yang buruk dan mengambil keuntungan darinya, maka itu mengikat baginya jika dia membelinya sesuai dengan program dan deskripsi yang diketahui." }
summary:
  ar: "قال مالك: الأمر عندنا في القوم يشترون السلعة، البز أو الرقيق، فيسمع به الرجل فيقول لرجل منهم: البز الذي اشتريت من فلان قد بلغني صفته وأمره، فهل لك أن أربحك في نصيبك كذا وكذا؟ فيقول: نعم. فيربحه، ويكون شريكا للقوم مكانه. فإذا نظر إليه رآه قبيحا واستغلاه، قال مالك: ذلك لازم له، ولا خيار له فيه، إذا كان ابتاعه على برنامج وصفة معلومة. {cite:muwatta-maruf-1997 p.200}"
  tr: "Malik şöyle dedi: Bizim uygulamamız şudur: Bir grup insan kumaş veya köle gibi mallar satın aldığında ve bir adam bunu duyduğunda, içlerinden birine şöyle der: \"Filanca kişiden aldığım kumaş hakkında bir şeyler duydum; senin payından sana şu kadar kar vermeme razı olur musun?\" Diğer adam \"Evet\" diye cevap verir. Böylece ona karı verir ve onun yerine grupla ortak olur. Sonra, kumaşa baktığında onu çirkin bulur ve fiyatının yüksek olduğunu düşünür. Malik dedi ki: Bu onun için bağlayıcıdır ve eğer bilinen bir plan ve açıklamaya göre satın aldıysa, bu konuda bir seçeneği yoktur. {cite:muwatta-maruf-1997 s.200}"
  id: "Malik berkata: Kebiasaan kami adalah ketika sekelompok orang membeli barang, seperti kain atau budak, dan seseorang mendengarnya, dia berkata kepada salah seorang dari mereka: \"Saya telah mendengar tentang kain yang saya beli dari si anu; maukah Anda memberi saya keuntungan sekian dari bagian Anda?\" Orang lain menjawab: \"Ya.\" Maka dia memberikan keuntungan itu dan menjadi mitra dalam kelompok tersebut. Kemudian, ketika dia melihatnya, dia mendapati kain itu jelek dan menganggapnya terlalu mahal. Malik berkata: Ini mengikatnya, dan dia tidak punya pilihan dalam hal ini, jika dia membelinya sesuai dengan rencana dan deskripsi yang diketahui. {cite:muwatta-maruf-1997 p.200}"
