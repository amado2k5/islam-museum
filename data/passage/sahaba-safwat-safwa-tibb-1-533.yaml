text: "… ترك عبد شيئاً لله فوجد فقده. قال ابن سيرين: ولا أرى شريحاً حلف إلا على علم. عن الأعمش قال: اشتكى شريح رِجْلَه، فطلاها بالعسل، وجلس في الشمس، فدخل عليه عُوّاده فقالوا: كيف تجدك؟ قال: صالحاً. فقالوا: ألا أريتها الطبيب؟ فقال: …"
