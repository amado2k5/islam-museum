label:
  ar: "الترمذي 2926 — من شغله القرآن عن ذكري ومسألتي"
  en: "Tirmidhi 2926 — Whoever is kept by the Qur'an from remembering Me and asking of Me"
  ur: "ترمذی 2926 — جسے قرآن نے میرے ذکر اور مجھ سے مانگنے سے مشغول رکھا"
text: "يقول الرب عز وجل من شغله القرآن عن ذكري و مسألتي أعطيته أفضل ما أعطي السائلين وفضل كلام الله على سائر الكلام كفضل الله على خلقه . هذا حديث حسن غريب ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2926: من شغله القرآن عن ذكري ومسألتي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2926: Whoever is kept by the Qur'an from remembering Me and asking of Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2926: جسے قرآن نے میرے ذکر اور مجھ سے مانگنے سے مشغول رکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
