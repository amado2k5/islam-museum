text: "… القرآن بلسان السكعبَيْن، كعب ان لؤى، وكعب بن عمرو، قال فقال خالد ين سلمة لسعد بن ابراهيم : ألا تسمع ما يقول هذا الأعمى ؟ نزل القرآن بلسان الكمبين، وإنما نزل بلسان قريش. نفرد به صالح بن نصر عن شعبة. …"
