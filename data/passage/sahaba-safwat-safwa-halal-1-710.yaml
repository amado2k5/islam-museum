text: "… العدوية قال أبو عبد الرحمن السلمي: كانت معاذة العدوية أرضعت أم الأسود. وقالت أم الأسود: قالت لي معاذة العدوية: لا تفسدي رضاعي بأكل الحرام، فإني جهدت جهدي حين أرضعتك حتى أكلت الحلال، فاجتهدي أن لا تأكلي إلا حلالاً؛ لعلك أن …"
