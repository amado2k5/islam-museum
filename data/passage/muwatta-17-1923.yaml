label: { ar: "الموطأ 1923 — مالك: لا بأس أن تبيع ما اشتريت منها من قبل أن تستوفيه من غير صاحبه الذي اشتريته منه، إذا نقدت ثمنه", en: "Muwatta 1923", es: "Muwatta 1923", fr: "Muwatta 1923", ur: "موطا 1923", tr: "El-Muvatta 1923 — Malik: Birinden satın aldığınız şeyi, onu satın aldığınız kişiden başkasından teslim almadan önce, bedelini ödediğiniz takdirde satmanızda bir sakınca yoktur.", id: "Al-Muwatta 1923 — Malik: Tidak ada salahnya menjual apa yang kamu beli darinya sebelum kamu memilikinya dari orang lain selain orang yang menjualnya kepadamu, asalkan kamu membayar harganya." }
summary:
  ar: "قال مالك: ولا بأس أن تبيع ما اشتريت منها، من قبل أن تستوفيه، من غير صاحبه الذي اشتريته منه، إذا نقدت ثمنه. {cite:muwatta-maruf-1997 p.188}"
  tr: "Malik şöyle dedi: Ondan satın aldığınız şeyi, teslim almadan önce, satın aldığınız kişiden başka birine satmanızda bir sakınca yoktur, yeter ki bedelini nakit olarak ödemiş olun. {cite:muwatta-maruf-1997 s.188}"
  id: "Malik berkata: Tidak ada yang salah dengan menjual apa yang Anda beli darinya, sebelum mengambil alih kepemilikannya, kepada orang lain selain orang yang menjualnya kepada Anda, asalkan Anda telah membayar harganya secara tunai. {cite:muwatta-maruf-1997 p.188}"
