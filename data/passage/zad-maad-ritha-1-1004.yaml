  tr: "Zad al-Ma'ad fi Hadyi Khayr al-'Ibad adlı resimli cilt 1'in 1004. sayfasından bir alıntı; bir ağıt ve ölüm ilanı içeriyor; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Zad al-Ma'ad fi Hadyi Khayr al-'Ibad, jilid bergambar 1, halaman 1004, berisi eulogi dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
