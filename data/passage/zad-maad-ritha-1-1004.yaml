text: "… بن ثابت لم يُرَخّص لها إلَّا في بياض يومها أو ليلها. وذكر عبد الرزاق عن سفيان الثوري، عن منصور بن المعتمِر، عن إبراهيم النَّخَعي، عن علقمة، قال: سأل ابنَ مسعود نساءٌ من همدان نُعِيَ إليهن أزواجُهن، فَقُلْنَ : إنا نَسْتَوحِشُ، …"
summary:
  ar: "مقطع من زاد المعاد في هدي خير العباد، المجلد المصوَّر 1، ص 1004، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Zad al-Ma'ad fi Hady Khayr al-Ibad, scan volume 1, p. 1004, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "زاد المعاد فی حدی خیر العباد، اسکین جلد 1، ص 1004 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Zad al-Ma'ad fi Hady Khayr al-Ibad, volume numérisé 1, p. 1004, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
