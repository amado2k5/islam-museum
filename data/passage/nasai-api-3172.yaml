text: "… عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ مُحَمَّدِ بْنِ يَحْيَى بْنِ حَبَّانَ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنْ أُمِّ حَرَامٍ بِنْتِ مِلْحَانَ، قَالَتْ أَتَانَا رَسُولُ اللَّهِ وَقَالَ عِنْدَنَا فَاسْتَيْقَظَ وَهُوَ يَضْحَكُ فَقُلْتُ يَا رَسُولَ اللَّهِ بِأَبِي وَأُمِّي مَا أَضْحَكَكَ قَالَ رَأَيْتُ قَوْمًا مِنْ أُمَّتِي يَرْكَبُونَ هَذَا الْبَحْرَ كَالْمُلُوكِ عَلَى الأَسِرَّةِ . قُلْتُ ادْعُ اللَّهَ أَنْ يَجْعَلَنِي مِنْهُمْ. قَالَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3172، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan al-Nasa'i, no. 3172, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن نسائی کی حدیث نمبر 3172، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 3172, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan al-Nasa'i, n.º 3172, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sunan-ı Nesai'de yer alan 3172 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3172, berisi tentang tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
