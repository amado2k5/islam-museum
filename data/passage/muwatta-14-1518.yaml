label: { ar: "الموطأ 1518 — مالك: بلغه أن القاسم بن محمد سئل عن رجل طلق امرأته البتة ثم تزوجها آخر فمات عنها قبل أن يمسها، فقال لا يحل لزوجها الأول أن يراجعها", en: "Muwatta 1518", es: "Muwatta 1518", fr: "Muwatta 1518", ur: "موطا 1518", tr: "El-Muvatta 1518 — Malik: Ona, El-Kâsım bin Muhammed'e, karısını geri dönülmez bir şekilde boşayan, sonra başka bir adamla evlenen ve evliliği tamamlamadan ölen bir adam hakkında soru sorulduğu rivayet edildi. O da, \"İlk kocasının onu geri alması caiz değildir\" dedi.", id: "Al-Muwatta 1518 — Malik: Sampai kepadanya bahwa Al-Qasim bin Muhammad ditanya tentang seorang pria yang menceraikan istrinya secara mutlak, kemudian pria lain menikahinya dan meninggal sebelum pernikahan mereka disempurnakan. Beliau berkata, “Tidak diperbolehkan bagi suami pertamanya untuk mengambilnya kembali.”" }
summary:
  ar: "يروي مالك أنه بلغه أن القاسم بن محمد سئل عن رجل طلق امرأته البتة، ثم تزوجها آخر، فمات عنها قبل أن يمسها، هل يحل لزوجها الأول أن يراجعها؟ فقال القاسم لا يحل لزوجها الأول أن يراجعها. {cite:muwatta-maruf-1997 p.38}"
  tr: "Malik, el-Kâsım ibn Muhammed'e, karısını geri dönülmez bir şekilde boşayan, daha sonra başka bir adamla evlenen ancak evliliği tamamlamadan ölen bir adam hakkında soru sorulduğunu duyduğunu aktarır. İlk kocasının onu geri alması caiz midir? El-Kâsım, ilk kocasının onu geri almasının caiz olmadığını yanıtlamıştır. {cite:muwatta-maruf-1997 s.38}"
  id: "Malik menceritakan bahwa ia mendengar bahwa al-Qasim bin Muhammad ditanya tentang seorang pria yang menceraikan istrinya secara mutlak, kemudian pria lain menikahinya, tetapi meninggal sebelum pernikahan mereka disempurnakan. Apakah diperbolehkan bagi suami pertamanya untuk mengambilnya kembali? Al-Qasim menjawab bahwa tidak diperbolehkan bagi suami pertamanya untuk mengambilnya kembali. {cite:muwatta-maruf-1997 p.38}"
