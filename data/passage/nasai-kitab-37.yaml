label:
  ar: "سنن النسائي، كتاب تحريم الدم"
  en: "Sunan al-Nasa'i, Book 37: The Book of Fighting [The Prohibition of Bloodshed]"
  ur: "سنن نسائی، کتاب تحریم الدم"
  es: "Sunan al-Nasa'i, Libro 37: El Libro de la Lucha [La Prohibición del Derrame de Sangre]"
  fr: "Sunan al-Nasa'i, Livre 37: Le Livre du Combat [L'Interdiction de l'effusion de sang]"
summary:
  ar: "القسم 37 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب تحريم الدم»، ويضم فيها النصوص من 3966 إلى 4132 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 37 of Sunan al-Nasa'i (The Book of Fighting [The Prohibition of Bloodshed]) in the division of the open hadith dataset the museum took its reports from: reports 3966 to 4132 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 37، عنوان «کتاب تحریم الدم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3966 تا 4132۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 37 de Sunan al-Nasa'i (El Libro de la Lucha [La Prohibición del Derramamiento de Sangre]) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3966 al 4132, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre 37, « Le Livre du Combat » [L'interdiction de l'effusion de sang]), dans la base de données ouverte: les hadiths 3966 à 4132 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
