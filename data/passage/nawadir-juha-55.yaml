text: "… أَتُريدُ أَنْ أبعدَ أكثر ؟ قالت له أمرأتُهُ ذاتَ ليلة: ابتعِذْ عنِّي قليلاً فأسرعَ إلى حذائِهِ وأخذَهُ ومِشي مِسافةَ ساعتين إلى أن لَقِيَ أحدَ معارفِهِ فقال له : إذا صادفْتَ امرأتي، فقلْ لها أتُريدُ أَنْ أبعدَ أكثرَ مِمَّا بعدْت؟ الورطة: …"
summary:
  ar: "قالت زوجة جحا له أن يذهب بعيدًا، فمشى ساعتين وقال لأحد معارفه أن يسأل زوجته هل تريد أن يبتعد أكثر. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  en: "Juha's wife tells him to go away; he walks two hours and tells an acquaintance to ask his wife whether she wants him to go further. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  ur: "جحا کی بیوی نے اسے دور چلے جانے کو کہا؛ وہ دو گھنٹے چلتا رہا اور ایک جاننے والے سے کہا کہ اس کی بیوی سے پوچھ لے کہ کیا وہ چاہتی ہے کہ وہ اور دور چلا جائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  fr: "La femme de Juha lui dit de s'en aller ; il marche deux heures et dit à une connaissance de demander à sa femme si elle veut qu'il aille plus loin. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  es: "La mujer de Juha le dice que se vaya; camina dos horas y le dice a un conocido que pregunte a su mujer si quiere que se vaya más lejos. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  tr: "Juha'nın karısı ona çok uzaklara gitmesini söyledi, bu yüzden iki saat yürüdü ve sonra bir tanıdığına karısına daha da uzaklara gitmesini isteyip istemediğini sormasını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 33}"
  id: "Istri Juha menyuruhnya pergi jauh, jadi dia berjalan selama dua jam dan kemudian menyuruh seorang kenalan untuk bertanya kepada istrinya apakah dia ingin dia pergi lebih jauh lagi. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
