label: { ar: "الموطأ 487 — لا نداء ولا إقامة في الفطر والأضحى منذ زمان النبي", en: "Muwatta 487", es: "Muwatta 487", fr: "Muwatta 487", ur: "موطا 487", tr: "El-Muvatta 487 — Peygamberimiz zamanından beri Ramazan Bayramı ve Kurban Bayramı için ezan veya ikamet okunmamıştır.", id: "Al-Muwatta 487 — Tidak ada seruan salat atau iqamah untuk Idul Fitri dan Idul Adha sejak zaman Nabi." }
summary:
  ar: "أول خبر في باب العمل في غسل العيدين والنداء فيهما والإقامة. يرويه يحيى عن مالك أنه سمع غير واحد من علمائهم يقول: لم يكن في الفطر والأضحى نداء ولا إقامة منذ زمان النبي إلى اليوم؛ قال مالك: وتلك السنة التي لا اختلاف فيها عندنا. وينقل المحقق عن ابن عبد البر أنه لم يكن عند مالك في هذا الباب حديث مسند، وفيه أحاديث صحاح مسندة، وأنه أمر لا خلاف فيه بين العلماء أن لا أذان ولا إقامة في العيدين ولا في شيء من السنن والنوافل، وعلى هذا مضى عمل الخلفاء الأربعة والصحابة والتابعين وفقهاء الأمصار ⁦(التمهيد 24/239)⁩. {cite:muwatta-maruf-1997 p.250}"
  tr: "İki bayram için yapılan abdest, ezan ve ikamet uygulamasına ilişkin ilk rivayet, Malik'ten nakledilen Yahya tarafından aktarılmıştır. Malik, birçok âlimin şöyle dediğini işitmiştir: \"Peygamberimiz zamanından bugüne kadar Ramazan Bayramı ve Kurban Bayramı için ezan veya ikamet okunmamıştır.\" Malik şöyle demiştir: \"Bu, aramızda ihtilaf bulunmayan yerleşik bir uygulamadır.\" Araştırmacı, İbn Abdül-Barr'ın Malik'in bu konuda isnadlı bir hadisi olmadığını, ancak bu konuda isnadlı sahih hadisler bulunduğunu söylediğini aktarmaktadır. Ayrıca, iki bayram için, sünnet veya nafile namazlar için ezan veya ikamet okunmadığı konusunda âlimler arasında ihtilaf bulunmadığını belirtmektedir. Bu, dört halifenin, sahabelerin, halifelerin ve çeşitli bölgelerin hukukçularının uygulamasıydı (el-Tamhid 24/239). {cite:muwatta-maruf-1997 s.250}"
  id: "Riwayat pertama mengenai praktik berwudhu untuk kedua hari raya, azan, dan iqamah diriwayatkan oleh Yahya dari Malik, yang mendengar lebih dari satu ulama mereka berkata: \"Tidak ada azan atau iqamah untuk Idul Fitri dan Idul Adha sejak zaman Nabi hingga sekarang.\" Malik berkata: \"Ini adalah praktik yang telah ditetapkan dan tidak ada perbedaan pendapat di antara kami.\" Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa Malik tidak memiliki hadits dengan sanad yang sahih mengenai hal ini, meskipun ada hadits-hadits sahih dengan sanad yang sahih mengenai hal tersebut. Ia lebih lanjut menyatakan bahwa hal ini merupakan masalah yang tidak ada perbedaan pendapat di antara para ulama bahwa tidak ada azan atau iqamah untuk kedua hari raya tersebut, maupun untuk shalat sunnah atau shalat sunnah. Ini adalah praktik keempat Khalifah, para Sahabat, para Penerus, dan para ahli fiqih dari berbagai wilayah (al-Tamhid 24/239). {mengutip:muwatta-maruf-1997 hal.250}"
