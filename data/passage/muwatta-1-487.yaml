label: { ar: "الموطأ 487 — لا نداء ولا إقامة في الفطر والأضحى منذ زمان النبي", en: "Muwatta 487" }
summary:
  ar: "أول خبر في باب العمل في غسل العيدين والنداء فيهما والإقامة. يرويه يحيى عن مالك أنه سمع غير واحد من علمائهم يقول: لم يكن في الفطر والأضحى نداء ولا إقامة منذ زمان النبي إلى اليوم؛ قال مالك: وتلك السنة التي لا اختلاف فيها عندنا. وينقل المحقق عن ابن عبد البر أنه لم يكن عند مالك في هذا الباب حديث مسند، وفيه أحاديث صحاح مسندة، وأنه أمر لا خلاف فيه بين العلماء أن لا أذان ولا إقامة في العيدين ولا في شيء من السنن والنوافل، وعلى هذا مضى عمل الخلفاء الأربعة والصحابة والتابعين وفقهاء الأمصار (التمهيد 24/239). {cite:muwatta-maruf-1997 p.250}"
