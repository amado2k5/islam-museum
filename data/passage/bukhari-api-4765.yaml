label: { ar: "صحيح البخاري 4765 — ما حُرّم", en: "Sahih al-Bukhari 4765 — what was made unlawful", ur: "صحیح بخاری 4765 — جو حرام کیا گیا", es: "Sahih al-Bukhari 4765 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 4765 — ce qui a été déclaré illicite" }
text: "… ابْنُ أَبْزَى سَلِ ابْنَ عَبَّاسٍ عَنْ قَوْلِهِ تَعَالَى {وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ} وَقَوْلِهِ {لاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ} حَتَّى بَلَغَ {إِلاَّ مَنْ تَابَ} فَسَأَلْتُهُ فَقَالَ لَمَّا نَزَلَتْ قَالَ أَهْلُ مَكَّةَ فَقَدْ عَدَلْنَا بِاللَّهِ وَقَتَلْنَا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ وَأَتَيْنَا الْفَوَاحِشَ، فَأَنْزَلَ اللَّهُ {إِلاَّ مَنْ تَابَ وَآمَنَ وَعَمِلَ عَمَلاً …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4765، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4765 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4765، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4765 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4765 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
