text: |-
  ٥٥٢
  • ⁦(تجا )⁩ .
  صبّ اللهيف لها السبوب بطغية • تنى العقاب كمايلط المجنب
  ويقال أصلد الهمز من الانباء أى انّ الفعل يخبر عن حقيقتك لا القول وندا السيف اذ الم يعمل
  فى الضرية ونبابصرى عن الشىء ونبايفلان منزله اذ الم يوافقه وكذلك قراشه والنابية القوم
  التى نبت عن وترها أى تجافت والنبوة والنباوة ما ارتفسع من الارض فان جعلت النبى
  مأخوذا منه أى أنه شرف على سائو الحلق فأصله غير الهمز وهو فعيل ؛ن مفعول وتصغيره
  ني والجع أنبيا" وأماقول أوص بن حجرير فى فضالة بن كادة الاسدى"
  على السيد الصعب لوأنه • يقوم على ذروة الصاقب
  لاصبح رتمادقاق الحصى • مكان النبى من الكاذب
  فيقال السكائب جيل وحوله رواب يقال لها النبىّ الواحد ناب مثسل غاز وغزى يقول لوقام
  وضالة على الصاقب وهو جبل يذالله لتسهل لهحتى يصير كالرمل الذى فى الكائب ى
  النواتى الملاحون واحدهم نوتى ⁦(نشا)⁩ النشامصور مثل الثناء الاانه فى الخير والشعر
  جميعا والثناء فى اخير خاصة وتنوت الخبرننوا أظهرته وتناتوا الذى أى تذاكروه جا)
  نجوت من كذانجا، ممدودونجاة مة صور والصدق منجاة وأنجيت غيرى ونجيته وقرى بهما
  قوله تعالى فالوم تحمك يمدنك المعنى تتحمك لا تفعل بل نهلكن فأضمر قوله لا تفعل وقال
  عضهسم تنحسك أى ترفعك على تجوة من الارض فنظهرك لانه قال يبدنك ولم يقل بروحك
  ونجوت أيضائجاء مدود أى أسرعت وسبقت والناجية والنجاة الناقة السريعة تنجوين
  اركيهما والبعيرناج وقال * ناجية وناجيا أباها* وقول الاعشى
  تقطع الامعز المكوكب وخدا * بنواج مريعة الايغال
  أى بقوائم سراع واستنجى أى أسرع (دفى المديث اذاساذرتم فى الجسدوبة فاستهجواوبنو
  ناجبة قوم من العرب والنسبة اليهم ناجىّ تحمذف منه الهاه والياءونجوت فلانااذا
  استفكهته وقال
  نجوت مجالدافوجدت منه *كريح الكلب مات حديث عهد
  ونجو السبع جعره والنجوما يخرج من البطن ويقال أنجى أى أحدث وشرب دوامفا أنجاه أى.
  ما أقامه ونجا الغائط نفسه ينجر عن الاصمعى واستنجى آى مسح موضع انجوا وغل
  واستنجي الوزأى مدّ القومن وقال
  فتبازت وتبازيت لها ل،, جلة الاعسر يستهجى الوتر
  وأصله الذى يتخذ أوتار القسى لانه يخرج ما فى المصارين من النجو والنجامقصورم ن قولك
  نجوت جاد البعير عنه وأنجبته اذ اسلفته وقال يخاطب ضيفين طرقاه
  فقلت انجواعنها نجا الجلدانه • سيرضيكما منها سفام وغاربه
  قال الفراء أضاف النجا الى الجلدلان العرب تضيف الشى الى تفسه اذا اختلف اللفظان
  كقواه-م حق اليقين ودار الآخرة والجلد نجامة سور أيضاوالنجاعيدات الهودج وفلان فى
  أرض نجاة يستنجى من شبرها العصىّ والقسى" واستنجى الناس فى كل وجه اذا أصابوا الرطب
  الاصمعى استجيت النخلة اذا التقطت رطبها قال ونجوت غصون الشجرة أى قطعتها
  وأنجيت
