label: { ar: "الموطأ 1369 — مالك: من حلف على شيء وهو يعلم أنه آثم، ليرضي به أحدا أو ليقطع به مالا، فهذا أعظم من أن تكون فيه كفارة", en: "Muwatta 1369", es: "Muwatta 1369", fr: "Muwatta 1369", ur: "موطا 1369", tr: "El-Muvatta 1369 — Malik: Kimse, birini memnun etmek veya para ele geçirmek amacıyla, günah olduğunu bildiği halde bir şey hakkında yemin ederse, bu, kefaret edilemeyecek kadar büyük bir günahtır.", id: "Al-Muwatta 1369 — Malik: Barang siapa bersumpah tentang sesuatu padahal ia tahu itu berdosa, dengan tujuan menyenangkan seseorang atau untuk mendapatkan uang, maka ini adalah dosa yang lebih besar yang tidak dapat ditebus." }
summary:
  ar: "يقول مالك أما الذي يحلف على الشيء وهو يعلم أنه آثم، ويحلف على الكذب وهو يعلم، ليرضي به أحدا، أو ليعتذر به إلى معتذر إليه، أو ليقطع به مالا، فهذا أعظم من أن تكون فيه كفارة. {cite:muwatta-maruf-1997 p.612}"
  tr: "Malik şöyle der: \"Bilerek günah olan bir şeye yemin eden, birini memnun etmek, özür dilediği birinden özür dilemek veya para ele geçirmek için bilerek yalan yere yemin eden kimsenin suçu, kefaretle ödenemeyecek kadar ağırdır.\" {cite:muwatta-maruf-1997 s.612}"
  id: "Malik berkata: Adapun orang yang bersumpah atas sesuatu padahal ia tahu itu berdosa, dan bersumpah secara dusta dengan maksud menyenangkan seseorang, atau meminta maaf kepada orang yang kepadanya ia meminta maaf, atau untuk merebut uang, maka ini terlalu berat untuk dikenakan penebusan dosa. {cite:muwatta-maruf-1997 p.612}"
