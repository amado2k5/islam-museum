summary:
  ar: "يقول مالك أما الذي يحلف على الشيء وهو يعلم أنه آثم، ويحلف على الكذب وهو يعلم، ليرضي به أحدا، أو ليعتذر به إلى معتذر إليه، أو ليقطع به مالا، فهذا أعظم من أن تكون فيه كفارة. {cite:muwatta-maruf-1997 p.612}"
