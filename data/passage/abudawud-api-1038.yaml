label: { ar: "سنن أبي داود 1038 — الأب والأبوة", en: "Sunan Abi Dawud 1038 — the father and fatherhood", ur: "سنن ابی داؤد 1038 — باپ اور والدیت" }
text: "… بْنُ مَخْلَدٍ، - بِمَعْنَى الإِسْنَادِ - أَنَّ ابْنَ عَيَّاشٍ، حَدَّثَهُمْ عَنْ عُبَيْدِ اللَّهِ بْنِ عُبَيْدٍ الْكَلاَعِيِّ، عَنْ زُهَيْرٍ، - يَعْنِي ابْنَ سَالِمٍ الْعَنْسِيِّ - عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، قَالَ عَمْرٌو وَحْدَهُ عَنْ أَبِيهِ، عَنْ ثَوْبَانَ، عَنِ النَّبِيِّ قَالَ \" لِكُلِّ سَهْوٍ سَجْدَتَانِ بَعْدَ مَا يُسَلِّمُ \". لَمْ يَذْكُرْ عَنْ أَبِيهِ. غَيْرُ عَمْرٍو."
summary:
  ar: "حديث في سنن أبي داود، رقم 1038، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1038 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1038، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
