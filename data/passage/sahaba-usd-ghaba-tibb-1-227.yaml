text: "… يُضَرِّ بك قوم وينتفعٍ بك آخرون ثم قال للحارث بن كلدة: عالج سعداً مما به، فقال: واللّٰه إني لأرجو شفاءه فيما ينفعه في رحله، هل معك من هذه التمرة العجوة شيء؟ قال: نعم، فصنع له الفَرِيقَةَ، خلط له التمر بالحلبة، …"
summary:
