  tr: "İbn al-Athir'in \"Asad al-Ghaba\" adlı eserinin resimli 1. cildinin 227. sayfasından, Ajwa hurması, ilaçlar, eczacılık ve şifa konularından bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
