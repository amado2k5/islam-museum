label: { ar: "صحيح مسلم 5762 — القسط والعود الهندي، اللدود والسعوط", en: "Sahih Muslim 5762 — costus (Indian aloeswood); medicine given by the mouth-side or the nose", ur: "صحیح مسلم 5762 — قسط ہندی، لدود اور سعوط", es: "Sahih Muslim 5762 — costus (árbol de aloe indio); medicamento administrado por vía oral o nasal.", fr: "Sahih Muslim 5762 — costus (bois d'aloès indien); médicament administré par voie orale ou nasale" }
text: "… أُخْتِ عُكَّاشَةَ بْنِ مِحْصَنٍ قَالَتْ دَخَلْتُ بِابْنٍ لِي عَلَى رَسُولِ اللَّهِ لَمْ يَأْكُلِ الطَّعَامَ فَبَالَ عَلَيْهِ فَدَعَا بِمَاءٍ فَرَشَّهُ. قَالَتْ وَدَخَلْتُ عَلَيْهِ بِابْنٍ لِي قَدْ أَعْلَقْتُ عَلَيْهِ مِنَ الْعُذْرَةِ فَقَالَ \" عَلاَمَهْ تَدْغَرْنَ أَوْلاَدَكُنَّ بِهَذَا الْعِلاَقِ عَلَيْكُنَّ بِهَذَا الْعُودِ الْهِنْدِيِّ فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ مِنْهَا ذَاتُ الْجَنْبِ يُسْعَطُ مِنَ الْعُذْرَةِ وَيُلَدُّ مِنْ ذَاتِ الْجَنْبِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5762، يذكر القسط والعود الهندي، واللدود والسعوط، وأسماء الأمراض، وعلاج العذرة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5762 (Introduction), that mentions costus (Indian aloeswood), medicine given by the mouth-side or the nose, named diseases, treating the throat ailment (al-udhra), healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5762، جس میں قسط ہندی، لدود اور سعوط، بیماریوں کے نام، گلے کی بیماری عذرہ کا علاج، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5762 (Introducción), menciona el costus (árbol de aloe indio), un medicamento administrado por vía oral o nasal, para tratar enfermedades, afecciones de la garganta (al-udhra) y para la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5762 (Introduction), mentionne le costus (bois d'aloès indien), un remède administré par voie orale ou nasale, contre certaines maladies, notamment les maux de gorge (al-udhra), et pour ses propriétés curatives. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
