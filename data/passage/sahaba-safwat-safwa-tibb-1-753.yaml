text: "… أبي عثمان الخيري فخرج، ثم قعد على موضعه الذي كان يقعد فيه للتذكير، فسكَتَ حتى طال سكوته، فناداه رجل : ترى أن تقول في سكوتك شيئاً؟ فأنشا يقول : طبيبٌ يداوي والطبيبُ مريض وغير تقيّ يأمر الناسَ بالتقى فارتفعت الأصوات …"
