label:
  ar: "البخاري 6424 — ما لعبدي المؤمن جزاء إذا قبضت صفيه إلا الجنة"
  en: "Bukhari 6424 — My believing servant has no reward but Paradise when I take his dearest one"
  ur: "بخاری 6424 — میرے مومن بندے کا بدلہ جب میں اس کا عزیز لے لوں جنت ہی ہے"
text: "يقول الله تعالى ما لعبدي المؤمن عندي جزاء، إذا قبضت صفيه من أهل الدنيا، ثم احتسبه إلا الجنة ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6424: ما لعبدي المؤمن جزاء إذا قبضت صفيه إلا الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6424: My believing servant has no reward but Paradise when I take his dearest one. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6424: میرے مومن بندے کا بدلہ جب میں اس کا عزیز لے لوں جنت ہی ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
