summary:
  ar: "القسم 19 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأضاحي عن رسول الله»، ويضم فيها النصوص من 1493 إلى 1523 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 19 of Jami' al-Tirmidhi (The Book on Sacrifices) in the division of the open hadith dataset the museum took its reports from: reports 1493 to 1523 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 19، عنوان «کتاب الاضاحی عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1493 تا 1523۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 19 de Jami' al-Tirmidhi (El Libro de los Sacrificios) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1493 al 1523, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 19 de Jami' al-Tirmidhi (Le Livre des sacrifices), qui comprend les hadiths 1493 à 1523 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanında yer alan Cami' el-Tirmizi'nin 19. bölümü, \"Allah Resulü'nden Kurbanlar Kitabı\" başlığını taşımakta olup, 1493'ten 1523'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 19 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Kurban dari Rasulullah\" dan berisi teks 1493 hingga 1523, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
