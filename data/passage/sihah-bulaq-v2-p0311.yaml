text: |-
  قوله أنا اذا الج فى بعض النسم
  من حطمة أقبت حتت لنا ورقاً
  ٢ ف نسطة بقبة البيت
  ليس برامى ابل ولا غنم
  :٢٧٦
  •فص ل الجاء).
  جبال شواهق ملس الجواذب لا يكاد القتام يفارقها قال الذابغة
  فأصبح عاقلا مجبال حسمى • دقاق الترب محتوم القتام
  وفى جديث أبى «ريرة رضى اللّٰه عنه تخرحكم الروم منها كفراكفرا الى سنبك من الارض
  قبل وماذ الذالسنبك قال حسمى جذام ( حشم أبونيد حشمت الرجل وأحشمته بمعنى
  (هو أن يجلس اليك فتؤذيه وتغضبه ابن الاءرابى حشمته أخجلته وأحشمته اغضبته
  وانشد
  لعمرك ان قرص أبى خييب • بطى النضج محسوم الاكيل
  والاسم الحشمة وهوالاستهياء والغضب أيضا وقال الاصعى الحشمة انماهى بمعنى الغضب
  لا يمعنى الاستباء وحكى عن بعض فعهما العرب أنه قال ان ذلك لمما يحشيم بنى فلان أى
  يغضبهم واحتشمته واحتشمت منه يمعنى قال الكميت
  ورأيت الشر يف فى أهين الناس وضيعا وقل منه احتشامى
  ورجل حشيم أى محتشم وحشم الرجل خدمه ومن يفضب لسموا بذلك لانهم يغضبون له
  وقال النضر حشمت الدواب صاحت ⁦(حصم)⁩ حصم بها أى حبق وافحصم العودانكسر
  وياضا أحد تتماف • من-ل عبدان الحصاد المخصم
  صرم ابن السكيت يقال للرجل الضيق البخيل حصرم ومحصرم والحصرم أول
  اعتب وحصرم قوسه أى شد توتيرها ⁦( حضرم)⁩ أبو عبيد حضرم الرجل حضرمة اذالحن
  وخالف الاعراب فى كلامه ⁦( حطم)⁩ -طمته حطها أى كسرته فاحطم وتجطم والتصطحيم
  التكسير وأصابتهم حطمة أى سنة وجدب قال ذوالخرق الطهوى
  انا اذاحطمة حتت لناورقا • غمارس العود-تى بثبت الورق
  وحظمة النسيل مثل طحمته وهى دفعته والحطم المنكسرقى نفسه ويقال للرس اذاتهدم
  اطول عمره حطم ويقال حطمت الداية بالكسر أى أسنت وحطمته الن بالفتح حطما
  والحطمة على وزن فعلة من أسما النار لانم اتحطم ماتلقى ويقال أيضارجل حطمة المكثير
  الاكل ورجل حطم وحطمة أبضا اذا كان قليل الرحة للماشبة يه شم بعضها ببعض وفى المثل
  شرّ الرعاء الحطمة وقال الراجز *قدلفها الليل ب-واق حطم• ويقال للعكرة من الابل
  حطسمة لاتم اتحطم كل شئ قال ابن عباس رضى اللّٰه عنهها الحطيم الجدر يعنى جد اربحجر
  الكهبة والحطام ما تكسر من اليبيس ⁦(حقم )⁩ الحقم ضرب من الطير يقال انه الهام
  (حكم الحكم مصدرقولك حكم بينهم يحكم أى قضى وحكم له وحكم عليه والحكم
  أيضا الحكمة من العلم والحكيم العالم وصاحب الحكمة والحكيم المتقن للامور وقد حكم
  يضم الكاف أى صارحكها قال النمربن تواب
  وأبغض بغيضك بغضارويدا * اذا أنت حاوات أن تحكل
  قال الاصمعى أى اذا ساولت أن تمكون حكيما. قال وكذلا قول النابغة
  واحكم كمكم فتاة الحى اذا تظرت • الى حام شراع وارد الثد
  وأ-كمن الشى فاستسكم أى صار محكما والححكم باتصريك الهاكم وفى المثل فى بيته يؤتى
  الحكم وحكم أيضا أبوحىّ من المين وحكمة الشاذقنها وحكمة اللجام ماأساط بالحنك
  تقول
