text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ نَافِعٍ، أَنَّ صَفِيَّةَ بِنْتَ أَبِي عُبَيْدٍ، اشْتَكَتْ عَيْنَيْهَا وَهِيَ حَادٌّ عَلَى زَوْجِهَا عَبْدِ اللَّهِ بْنِ عُمَرَ فَلَمْ تَكْتَحِلْ حَتَّى كَادَتْ عَيْنَاهَا تَرْمَصَانِ. قَالَ مَالِكٌ تَدَّهِنُ الْمُتَوَفَّى عَنْهَا زَوْجُهَا بِالزَّيْتِ وَالشَّبْرَقِ وَمَا أَشْبَهَ ذَلِكَ إِذَا لَمْ يَكُنْ فِيهِ طِيبٌ. قَالَ مَالِكٌ وَلاَ تَلْبَسُ الْمَرْأَةُ الْحَادُّ عَلَى زَوْجِهَا شَيْئًا مِنَ الْحَلْىِ خَاتَمًا وَلاَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1269، يذكر الكحل، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1269 (Divorce), that mentions kohl for the eye, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1269، جس میں سرمہ، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1269 (Divorcio), menciona el kohl para los ojos, una queja sobre una dolencia. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik, n° 1269 (Divorce), mentionne l'utilisation du khôl pour soigner un trouble oculaire. Le Répertoire des ouvrages médicaux le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta'sında yer alan 1269 numaralı hadiste, sürme ve hastalık şikayetlerinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1269, menyebutkan kohl dan keluhan penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
