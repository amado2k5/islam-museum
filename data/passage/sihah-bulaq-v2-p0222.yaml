text: |-
  • ⁦(باب النون)⁩
  *⁦(حسن)⁩•
  ٦٥م
  وصقر أحن الخالب معرجها والمحجن كالصولحان وحجنت الشى واحتجته اذا جذن‹
  بالمحجن الى نفسك ومنه قول قيس بن عاصم فى وصيته عليكم بالمال واحتجانه وهوضمكه الى
  فسك وامساكل اياه وحجنة المغزل بالضم هى المنعقفة فى رأسه أبو عبيدأحجن النمام اذا
  خرجت عجنته وهى خوصه والجون يفتح الحاه جبل بمكة وهى مقبرة قال الشاعر الجرهمى
  كأن لم يكن بين الحجون الى الصفا * أيس ولم يسمر بمكة ساهى
  ويقال أيضا غزوة حجون أى بعيدة وسر ناعقبة حجوناوهى البعيدة الطويلة ذن
  الحذنتان الاذنان بالضم والتشديدوأنشدأبوعبيد • ياابن التى حذنتا هاباع•حرن )
  فرس حرون لا ينقادواذا اشمدّبه الجرى وقف وق-دحرن يحسرن حرونا وحرن بالضم
  أى صار وونا والاسم الحران وحرون اسم فرص أبى صالح مسلم بن عرو الباهلى
  والدقتية قال الشاعر
  اذا ماقريش خلاطكها * فان الخلافسة فى باهله
  ارب الحرون أبي صالح • وماذاك بالسنة العاده
  قال الاسمعىّ هو من نسل أعوج وه والحرون بن الاثانى بن الخزر بن ذى الصوفة بن أعوج
  قال وكان يسبق الخيل ثم يحرن حتى تلحقه فاذ الحقته سبها والمرون فى قول الشهاخ
  وما أروى ولو كرمت عايدًا * بأدنى من موقفة حرون
  هى التى لا تبرح أعلى الجبل من الصيدو كان حبيب بن المهلب يلقب بالحرون والمهارين من
  الهل اللواتى يلصة ن بالشهد فينز عن بالمحابض وقال الشاءرابن مقبل
  كان أصواتها من حيث تسعها * نبض المحٰبض ينزعن الحارينا
  ويقال حرن فى البيع اذا لم يزد ولم يتقص وحرّان اسم :ادوه وفعال ويجوز أن يكون فعلان
  والفسبة اليه سونانى على غير قياس كما قالوامنانى فى النسسبة الى مانى والقياس مانوى.
  .حرّانى على ما عليه العامة ⁦(وذن)⁩ الحرذون دويبة بكسر الحاء وبقال هوذكر
  الضب زن الحتزن والمزن خلاف السرور وحزن الرجل بالكسرفهوحزن وحزين
  وأحزنه غيره وحزنه أيضامشل أسلكه وسلكه ومحزون بن عليه قال اليزيدى حزنه لغة قريش
  وأحزنه لغة تميم وقد قرى بهما واحتزن وتحزن بمعنى قال العجاج
  بكوت والمنزن البكى"* واغايأتى الصبا الصبي
  والحزانة بالضم والتنيف عيال الرجل الذين يتهزن بامرهم وفلان بقرأبالتحزين اذا أرق
  صوته به والحزن ما غلظ من الارض وفيها حزونة ابن السكيت بعير حزنى يرحى فى الجزن من
  الارض وقول أبى ذؤيب يصف مطرا
  غط من الحزن المغفرات • والطيرتلثق حتى تصيحا
  قال الاصمعى الحزن الجبال الغسلاظ الواحدة حزنة مثل ص-برة وصبر والحزن بلاد العرب
  والحزن حمن غسان وهم الذين ذكرهم الاخطال فى قوله
  تسأله السبرمن غسان اذحضروا • والحزن كيف قراه الغلة الجشر
  والحزون الشاة الديتة انحاق ⁦(حسن)⁩ الحسن نقبض القبح والبجمع محاسن على غيرقياس
  ٩٢
  في
