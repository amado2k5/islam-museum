text: "… الوخش، وشراء الخمر للشرب، والميتة والدم والخنزير للأكل، هو الغالب المعتاد عند العرب الذين نزل القرآن عليهم. ولذلك حذف متعلق التحريم والتحليل في نحو: حُرِّمَتْ عَلَيْكُمْ أُمَّهَٰتُكُمْ النساء: إلى قوله : وَأُحِلَّ لَكُم مَا بالضروري. وهذا الدليل المتين لم يسبق …"
