text: "إلى محمد بن عليّ بن عبد اللّٰه بن عبّاس والد السّفّاحِ، ودفع إليه كُتُبَه وصرف الشيعة إليه. وقال ابن سعد: كان ثقة قليل الحديث وكان الشيعة يلقونه وينتحلونه، فلما احتضر أوصى إلى محمد بن عليّ، وقال: أنت صاحب هذا الأمر، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 9، ص 406، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
