text: "إلى محمد بن عليّ بن عبد اللّٰه بن عبّاس والد السّفّاحِ، ودفع إليه كُتُبَه وصرف الشيعة إليه. وقال ابن سعد: كان ثقة قليل الحديث وكان الشيعة يلقونه وينتحلونه، فلما احتضر أوصى إلى محمد بن عليّ، وقال: أنت صاحب هذا الأمر، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 9، ص 406، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 9, p. 406, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 9، ص 406 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 9, pág. 406, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 9, page 406, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 9. cildinin 406. sayfasında, vasiyetname veya son miras ve ölüm saati konularına değinilmektedir; makineyle okunabilir baskıdan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, tarihi eserler ve türbeler üzerine araştırmalar yapan bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 9, halaman 406, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; diambil dari edisi yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
