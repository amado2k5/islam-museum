label: { ar: "نوادر جحا الكبرى، ص 65 — «أجرة اليوم لتلك وأجرة تلك اليوم»", en: "Nawadir Juha al-Kubra, p. 65 — 'Today's Fee Is for That Visit, and That Visit's Fee Is for Today'", ur: "نوادر جحا الکبریٰ، ص 65 — «اجرت آج کی اُس کے لیے اور اُس دن کی آج کے لیے»", fr: "Nawadir Juha al-Kubra, p. 65 — « Le prix d'aujourd'hui est pour l'autre fois »", es: "Nawadir Juha al-Kubra, p. 65 — «La tarifa de hoy es por aquella y la de aquella por hoy»", tr: "Juha'nın Büyük Anekdotları, s. 65 — “Şunun bugünkü ücreti ve bunun bugünkü ücreti”", id: "Anekdot Hebat Juha, hlm. 65 — “Upah hari ini untuk yang satu itu dan upah hari ini untuk yang lainnya”" }
text: "… أجرةُ اليومِ لتلك وأجرةُ تلك اليومَ ذهب يوماً إلى الحمّام، فأعطوه مناشِفَ قديمة، ولم يقوموا بالرعاية الواجبة، نعندما خرج، وضع على المرآة، عشرة قروش، فعجِبَ الحمّاميون، وفرحوا طبعاً. ثم بعدَ أُسبوع حضرَ إلى الحمّام، فقابله الحماميون بالرعاية والإكرام، فوق العادة، …"
summary:
  ar: "أعطوا جحا في الحمام فوطًا قديمة فدفع عشرة قروش؛ وفي الأسبوع التالي أعطوه فوطًا فاخرة فدفع قرشًا واحدًا، وقال إن أجرة اليوم عن الزيارة السابقة وأجرة تلك الزيارة عن هذه. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  en: "At the bath Juha is given old towels and pays ten piastres; the next week he is given fine towels and pays one piastre, saying that today's fee is for the last visit, and that visit's fee is for this one. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  ur: "حمام میں جحا کو پرانے تولیے دیے گئے تو اس نے دس قرش دیے؛ اگلے ہفتے عمدہ تولیے دیے گئے تو ایک قرش دیا، اور کہا کہ آج کی اجرت پچھلے دورے کی ہے اور اُس دورے کی اجرت آج کے لیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  fr: "Au bain, on donne à Juha de vieilles serviettes et il paie dix piastres; la semaine suivante, on lui en donne de belles et il paie une piastre, disant que le prix d'aujourd'hui est pour la dernière visite, et celui de cette visite pour celle-ci. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  es: "En el baño le dan a Juha toallas viejas y paga diez piastras; la semana siguiente le dan toallas finas y paga una piastra, diciendo que la tarifa de hoy es por la última visita, y la de aquella visita, por esta. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  tr: "Hamamda Juha'ya eski havlular verdiler ve o da on kuruş ödedi; ertesi hafta ona güzel havlular verdiler ve o da bir kuruş ödeyerek, bugünkü ücretin önceki ziyaret için, o ziyaretin ücretinin ise bu ziyaret için olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 65}"
  id: "Mereka memberi Juha handuk bekas di pemandian umum, dan dia membayar sepuluh piaster; minggu berikutnya mereka memberinya handuk bagus, dan dia membayar satu piaster, dengan mengatakan bahwa biaya hari ini adalah untuk kunjungan sebelumnya, dan biaya kunjungan itu adalah untuk kunjungan kali ini. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
