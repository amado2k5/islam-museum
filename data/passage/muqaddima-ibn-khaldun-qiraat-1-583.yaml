text: "… كأصاغر أبناء العجم الذين يربون مع العرب قبل أن تستحكم عجمتهم، فتكون اللغة العربية كأنها السابقة لهم، ولا يكون عندهم تقصير في فهم المعاني من اللغة العربية. وكذا أيضًا شأن من سبق له تعلم الخط الأعجمي قبل العربي. ولهذا نجد …"
summary:
