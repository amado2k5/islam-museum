label: { ar: "الموطأ 460 — أترون قبلتي هاهنا؟ إني لأراكم من وراء ظهري", en: "Muwatta 460" }
text: "أترون قبلتي هاهنا؟ فوالله ما يخفى علي خشوعكم ولا ركوعكم، إني لأراكم من وراء ظهري"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب العمل في جامع الصلاة: قال النبي للمصلين خلفه إنهم إن ظنوا أن قبلته هنا فقط فإنه لا يخفى عليه خشوعهم ولا ركوعهم، وإنه ليراهم من وراء ظهره. ويخرّجه المحقق عند البخاري (418، 741) ومسلم (2/27) وأحمد والبيهقي في الدلائل من طرق أصحاب مالك، ويحيل على التمهيد (18/346). {cite:muwatta-maruf-1997 p.236}"
