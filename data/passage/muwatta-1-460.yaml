label: { ar: "الموطأ 460 — أترون قبلتي هاهنا؟ إني لأراكم من وراء ظهري", en: "Muwatta 460", es: "Muwatta 460", fr: "Muwatta 460", ur: "موطا 460", tr: "Al-Muwatta 460 — Kıblemi burada görüyor musun? Seni arkamdan görüyorum.", id: "Al-Muwatta 460 — Apakah kau melihat kiblatku di sini? Aku melihatmu dari belakang punggungku" }
text: "أترون قبلتي هاهنا؟ فوالله ما يخفى علي خشوعكم ولا ركوعكم، إني لأراكم من وراء ظهري"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب العمل في جامع الصلاة: قال النبي للمصلين خلفه إنهم إن ظنوا أن قبلته هنا فقط فإنه لا يخفى عليه خشوعهم ولا ركوعهم، وإنه ليراهم من وراء ظهره. ويخرّجه المحقق عند البخاري ⁦(418، 741)⁩ ومسلم (2/27) وأحمد والبيهقي في الدلائل من طرق أصحاب مالك، ويحيل على التمهيد (18/346). {cite:muwatta-maruf-1997 p.236}"
  tr: "Malik, mescitteki ameller bölümünde, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle şöyle buyurmuştur: Peygamber, arkasında namaz kılanlara, kıblesinin sadece bu yönde olduğunu düşünseler bile, tevazularının ve rükûlarının kendisinden gizli olmadığını ve onları arkasından gördüğünü söylemiştir. Editör, bunu Buhari (418, 741), Müslim (2/27), Ahmed ve \"el-Dalail\" adlı kitabında el-Beyhaki'ye, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiş ve el-Temhid'e (18/346) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.236}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surah tentang amalan di masjid: Nabi bersabda kepada orang-orang yang shalat di belakangnya bahwa meskipun mereka mengira kiblatnya hanya ke arah ini, kerendahan hati dan rukuk mereka tidak tersembunyi darinya, dan beliau melihat mereka dari belakang punggungnya. (Penyunting menyertakannya dalam kitab al-Bukhari (418, 741), Muslim (2/27), Ahmad, dan al-Bayhaqi dalam kitabnya \"al-Dalail\" melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (18/346)). {cite:muwatta-maruf-1997 p.236}"
