label: { ar: "الموطأ 1017 — عائشة لعبد الله بن عامر: يا ابن أختي، إنما هي عشر ليال، فإن تخلج في نفسك شيء فدعه، تعني أكل لحم الصيد", en: "Muwatta 1017", es: "Muwatta 1017", fr: "Muwatta 1017", ur: "موطا 1017", tr: "El-Muvatta 1017 — Aişe, Abdullah bin Amer'e: Ey yeğenim, daha on gece var, aklına bir şey gelirse vazgeç, yani av eti yemekten bahsediyorum.", id: "Al-Muwatta 1017 — Aisyah kepada Abdullah bin Amer: Wahai keponakanku, hanya ada sepuluh malam, jadi jika ada sesuatu yang terlintas di pikiranmu, tinggalkanlah, maksudnya makan daging buruan." }
text: "يا ابن أختي، إنما هي عشر ليال، فإن تخلج في نفسك شيء فدعه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين، أنها قالت له: يا ابن أختي، إنما هي عشر ليال، فإن تخلج في نفسك شيء فدعه، تعني أكل لحم الصيد. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1148) وسويد (577) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.476}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından, o da Müminlerin Annesi Ayşe'den rivayet ederek, kendisine şöyle dediğini aktarmıştır: \"Ey yeğenim, daha on gece var. Eğer seni cezbeden bir şey olursa, bırak gitsin,\" yani av eti yemekten bahsetmiştir. Araştırmacı, bu hadisin Malik'ten Ebu Musab (1148), Suveyd (577) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.476}"
  id: "Malik meriwayatkan hadits ini dari Hisham bin Urwah, dari ayahnya, dari Aisyah, Ibu Kaum Mukminin, yang berkata kepadanya: “Wahai keponakanku, hanya sepuluh malam saja. Jika ada sesuatu yang menggoda kamu, maka tinggalkanlah,” yang dimaksud adalah memakan daging buruan. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1148), Suwaid (577), dan Yahya bin Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.476}"
