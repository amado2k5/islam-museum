text: "يا ابن أختي، إنما هي عشر ليال، فإن تخلج في نفسك شيء فدعه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين، أنها قالت له: يا ابن أختي، إنما هي عشر ليال، فإن تخلج في نفسك شيء فدعه، تعني أكل لحم الصيد. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1148) وسويد (577) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.476}"
