text: "قال الله تبارك وتعالى: إذا أحب عبدي لقائي أحببت لقاءه، وإذا كره لقائي كرهت لقاءه"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي روى عن الله أنه قال: إذا أحب عبدي لقائي أحببت لقاءه، وإذا كره لقائي كرهت لقاءه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (7504)، وسويد، والقعنبي، وابن القاسم عند النسائي (4/10)، ويحيل على التمهيد (18/29). {cite:muwatta-maruf-1997 p.328} {cite:muwatta-maruf-1997 p.329}"
