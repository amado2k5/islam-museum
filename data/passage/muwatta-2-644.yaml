label: { ar: "الموطأ 644 — قال الله: إذا أحب عبدي لقائي أحببت لقاءه، وإذا كره لقائي كرهت لقاءه", en: "Muwatta 644", es: "Muwatta 644", fr: "Muwatta 644", ur: "موطا 644", tr: "El-Muvatta 644 — Allah şöyle buyurdu: \"Kulum benimle buluşmayı severse, ben de onunla buluşmayı severim; benimle buluşmaktan nefret ederse, ben de onunla buluşmaktan nefret ederim.\"" }
text: "قال الله تبارك وتعالى: إذا أحب عبدي لقائي أحببت لقاءه، وإذا كره لقائي كرهت لقاءه"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي روى عن الله أنه قال: إذا أحب عبدي لقائي أحببت لقاءه، وإذا كره لقائي كرهت لقاءه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (7504)، وسويد، والقعنبي، وابن القاسم عند النسائي (4/10)، ويحيل على التمهيد (18/29). {cite:muwatta-maruf-1997 p.328} {cite:muwatta-maruf-1997 p.329}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Peygamber'in Allah'tan şöyle buyurduğunu naklettiğini bildirmiştir: \"Kulum benimle buluşmayı severse, ben de onunla buluşmayı severim; benimle buluşmayı istemezse, ben de onunla buluşmayı istemem.\" Editör, bu hadisin Malik'ten Ebu Mus'ab tarafından, onun isnadından da İbn Hibban, el-Baghawi, İsmail ibn Abi Uways tarafından Buhari'de (7504), Suwayd, el-Ka'nabi ve İbn el-Kâsim tarafından Nesai'de (4/10) nakledildiğini ve el-Tamhid'e (18/29) atıfta bulunduğunu belirtmektedir."
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Nabi meriwayatkan dari Allah bahwa Dia berfirman: \"Jika hamba-Ku senang bertemu dengan-Ku, maka Aku senang bertemu dengannya, dan jika ia tidak senang bertemu dengan-Ku, maka Aku tidak senang bertemu dengannya.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan dari sanadnya oleh Ibn Hibban, al-Baghawi, Isma'il ibn Abi Uways dalam al-Bukhari (7504), Suwayd, al-Qa'nabi, dan Ibn al-Qasim dalam al-Nasa'i (4/10), dan ia merujuk pada al-Tamhid (18/29)."
