label: { ar: "الموطأ 1970 — مالك: من اشترى سلعة على أن يوفيه البائع إياها إلى أجل مسمى، ثم أخلفه البائع عن ذلك الأجل، فليس للمشتري رد السلعة، والبيع لازم له، ولو جاء البائع بالسلعة قبل الأجل لم يكره المشتري على أخذها", en: "Muwatta 1970" }
summary:
  ar: "قال مالك في الذي يشتري السلعة من الرجل على أن يوفيه تلك السلعة إلى أجل مسمى، إما لسوق يرجو نفاقها، وإما لحاجة في ذلك الزمان الذي اشترط عليه، ثم يخلفه البائع عن ذلك الأجل، فيريد المشتري رد تلك السلعة على البائع: إن ذلك ليس للمشتري، وإن البيع لازم له. ولو أن البائع جاء بتلك السلعة قبل محل الأجل لم يكره المشتري على أخذها. {cite:muwatta-maruf-1997 p.206}"
