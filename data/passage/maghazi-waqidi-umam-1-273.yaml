text: "… سلاحه، فلحق برسول اللّٰه بأُحُد وهو يُسوّى الصفوف. قال : فلمّا انكشف المشركون اعترض حَنْظَلَة ابن أَبي عامر لأَبي سُفيان بن حَرب فضرب عُرقوب فَرَسه فاكتسعت الفَرَس، ويقع أَبو سُفيان إلى الأَرض، فجعل يصيح : يا معشر قُرَيش.، أَنا أَبو …"
