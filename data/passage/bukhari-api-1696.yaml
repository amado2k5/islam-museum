ref: "1696"
label: { ar: "صحيح البخاري 1696 — ما أُحل، ما حُرّم", en: "Sahih al-Bukhari 1696 — what was made lawful; what was made unlawful", ur: "صحیح بخاری 1696 — جو حلال کیا گیا، جو حرام کیا گیا", es: "Sahih al-Bukhari 1696 — lo que se hizo lícito; lo que se hizo ilícito", fr: "Sahih al-Bukhari 1696 — ce qui a été déclaré licite; ce qui a été déclaré illicite" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا أَفْلَحُ، عَنِ الْقَاسِمِ، عَنْ عَائِشَةَا ـ قَالَتْ فَتَلْتُ قَلاَئِدَ بُدْنِ النَّبِيِّ بِيَدَىَّ، ثُمَّ قَلَّدَهَا وَأَشْعَرَهَا وَأَهْدَاهَا، فَمَا حَرُمَ عَلَيْهِ شَىْءٌ كَانَ أُحِلَّ لَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1696، يذكر ما أُحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1696 (Hajj (Pilgrimage)), that mentions what was made lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1696، جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1696 (Hajj (Peregrinación)), menciona lo que es lícito e ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1696 (Hajj (Pèlerinage)), mentionne ce qui a été rendu licite et ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
