label: { ar: "سنن النسائي 5744 — ما كان يُكره، ما كُره", en: "Sunan al-Nasa'i 5744 — what used to be disliked; what was disliked", ur: "سنن نسائی 5744 — جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا", fr: "Sunan al-Nasa'i 5744 — ce qui était réprouvé ; ce qui fut réprouvé", es: "Sunan al-Nasa'i 5744 — lo que se reprobaba; lo que se reprobó", tr: "Sunan an-Nasa'i 5744 — Hoş karşılanmayan şey, hoş karşılanmayan şey", id: "Sunan an-Nasa'i 5744 — Apa yang tidak disukai, apa yang tidak disukai" }
text: "أَخْبَرَنَا سُوَيْدٌ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ، عَنْ مَعْمَرٍ، عَنْ قَتَادَةَ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، أَنَّهُ كَانَ يَكْرَهُ أَنْ يَجْعَلَ، نَطْلَ النَّبِيذِ فِي النَّبِيذِ لِيَشْتَدَّ بِالنَّطْلِ."
summary:
  ar: "حديث في سنن النسائي، رقم 5744، يرد فيه ذكر ما كان يُكره، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 5744 (The Book of Drinks), whose wording mentions what used to be disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 5744، جس کے الفاظ میں جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 5744, dont le texte mentionne ce qui était réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 5744, cuyo texto menciona lo que se reprobaba, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de 5744 numaralı hadis, mekruh ve mekruh olan şeylerden bahsetmektedir. Farz, görev, itaat, tavsiye edilen, mekruh olan, haram olan ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, biyografi ve Sahabe ve Salihlerden gelen rivayetlerle bir araya getirir. Derleyen kişi metinde yer alanları açıklar ancak buna dayanarak fetva vermez."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5744, menyebutkan apa yang dibenci dan apa yang tidak dibenci. Penyusun kitab tentang amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang dibenci, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
