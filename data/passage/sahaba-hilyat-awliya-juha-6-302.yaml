text: "… الدنيا مثل مارضيت به فقال : يايمتوب من : ضى بالدنيا بمثل كلها عرضا عن الآخرة فذلك الذى رضى باقل مما رضيت به. د حدثنا أبي ثنا أحمد بن محمدثنا عبد اللّه بن محمد ثنا الحسن بن ثمد بن يحي …"
summary:
  ar: "مقطع من حلية الأولياء وطبقات الأصفياء، المجلد المصوَّر 6، ص 302، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Hilyat al-Awliya' wa-Tabaqat al-Asfiya', scan volume 6, p. 302, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "حلیۃ الاولیاء و طبقات الاصفیاء، اسکین جلد 6، ص 302 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volume numérisé 6, p. 302, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volumen escaneado 6, p. 302, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hilyat al-Awliya' wa Tabaqat al-Asfiya' adlı resimli 6. cildin 302. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Hilyat al-Awliya' wa Tabaqat al-Asfiya', jilid bergambar 6, halaman 302, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Islamic Folklore Browser."
