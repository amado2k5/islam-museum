text: "تَٱللَّهِ لَقَدْ أَرْسَلْنَآ إِلَىٰٓ أُمَمٍ مِّن قَبْلِكَ فَزَيَّنَ لَهُمُ ٱلشَّيْطَـٰنُ أَعْمَـٰلَهُمْ فَهُوَ وَلِيُّهُمُ ٱلْيَوْمَ وَلَهُمْ عَذَابٌ أَلِيمٌ"
text_search: "تالله لقد أرسلنا إلى أمم من قبلك فزين لهم الشيطان أعمالهم فهو وليهم اليوم ولهم عذاب أليم"
translations:
  en: { text: "By Allah, We verily sent messengers unto the nations before thee, but the devil made their deeds fairseeming unto them. So he is their patron this day, and theirs will be a painful doom.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "خدا کی قسم ہم نے تم سے پہلی امتوں کی طرف بھی پیغمبر بھیجے تو شیطان نے ان کے کردار (ناشائستہ) ان کو آراستہ کر دکھائے تو آج بھی وہی ان کا دوست ہے اور ان کے لیے عذاب الیم ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
