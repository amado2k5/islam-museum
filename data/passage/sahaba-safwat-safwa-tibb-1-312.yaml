text: "… اسم أم عمارة المتقدمة. عن حفصة بنت سيرين عن أم عطية قالت: غزوت مع رسول اللّٰه وَتَيِ سبع غزوات، وكنت أخلفهم في الرحال، وأصنع لهم الطعام، وأقوم على المرضى، وأداوي الجرحى. - أم ورقة بنت عبد اللّٰه بن الحارث يِيهَا …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 312، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
