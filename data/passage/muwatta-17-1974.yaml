label: { ar: "الموطأ 1974 — مالك: في الرجل يبيع البز المصنف ويستثني ثيابا برقومها، فإن اشترط أن يختار من ذلك الرقم فلا بأس، وإن لم يشترط فهو شريك في عدد البز، لأن الثوبين رقمهما واحد وبينهما تفاوت في الثمن", en: "Muwatta 1974", es: "Muwatta 1974", fr: "Muwatta 1974", ur: "موطا 1974", tr: "El-Muvatta 1974 — Malik: Sınıflandırılmış kumaş satan ve giysileri numaralarına göre ayıran bir kişi, eğer bu numaralar arasından seçim yapabileceğini belirtirse, sorun yoktur. Eğer belirtmezse, o zaman kumaş sayısında ortaktır; çünkü iki giysi aynı numaraya sahip olsa da aralarında fiyat farkı vardır.", id: "Al-Muwatta 1974 — Malik: Mengenai seorang pria yang menjual kain yang telah diklasifikasikan dan memisahkan pakaian berdasarkan nomornya, jika ia menetapkan bahwa pembeli boleh memilih dari nomor-nomor tersebut, maka tidak ada masalah. Jika ia tidak menetapkan, maka ia menjadi mitra dalam jumlah kain tersebut, karena kedua pakaian tersebut memiliki nomor yang sama tetapi terdapat perbedaan harga di antara keduanya." }
summary:
  ar: "قال مالك في الرجل يبيع البز المصنف، ويستثني ثيابا برقومها: إنه إن اشترط أن يختار من ذلك الرقم، فلا بأس به. وإن لم يشترط أن يختار منه حين استثنى، فإني أراه شريكا في عدد البز الذي اشتري منه، وذلك أن الثوبين يكون رقمهما سواء، وبينهما تفاوت في الثمن. {cite:muwatta-maruf-1997 p.208}"
  tr: "Malik, sınıflandırılmış kumaş satan ve bazı giysileri numaralarına göre hariç tutan bir adam hakkında şunları söyledi: Eğer bu numaralar arasından seçim yapabileceğini şart koşarsa, bunda bir sakınca yoktur. Ancak hariç tuttuğu giysiler için bu numaralar arasından seçim yapabileceğini şart koşmazsa, o zaman onu satın aldığı kumaş sayısı bakımından ortak sayarım, çünkü iki giysinin numarası aynıdır, ancak aralarında fiyat farkı vardır. {cite:muwatta-maruf-1997 s.208}"
  id: "Malik berkata mengenai seorang pria yang menjual kain yang diklasifikasikan dan mengecualikan pakaian tertentu berdasarkan nomornya: Jika dia menetapkan bahwa dia boleh memilih dari nomor-nomor tersebut, maka tidak ada yang salah dengan itu. Tetapi jika dia tidak menetapkan bahwa dia boleh memilih dari nomor-nomor tersebut ketika dia mengecualikannya, maka saya menganggapnya sebagai mitra dalam jumlah kain yang dia beli, karena kedua pakaian tersebut memiliki nomor yang sama, tetapi ada perbedaan harga di antara keduanya. {cite:muwatta-maruf-1997 p.208}"
