summary:
  ar: "قال مالك في الرجل يبيع البز المصنف، ويستثني ثيابا برقومها: إنه إن اشترط أن يختار من ذلك الرقم، فلا بأس به. وإن لم يشترط أن يختار منه حين استثنى، فإني أراه شريكا في عدد البز الذي اشتري منه، وذلك أن الثوبين يكون رقمهما سواء، وبينهما تفاوت في الثمن. {cite:muwatta-maruf-1997 p.208}"
