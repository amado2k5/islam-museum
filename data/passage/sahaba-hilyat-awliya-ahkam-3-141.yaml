text: "… الصوم شئ واجب إلا شهر رمضان. فقال : يا زهرى ليس كما قلتم، الصوم على أربعدين وجها ؛ عشرة منها واجبة كوجوب شهر رمضان، وعشرة منها حرام، وأربعة عشرة خصلة صاحبها بالحيار إن شاء صام وإن شاء أفطر، وصوم النذر …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 141، يرد فيه ذكر الواجب، والوجوب، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 141, whose wording mentions the obligatory (wajib), obligation (wujub), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 3، ص 141 کا اقتباس جس میں واجب، وجوب، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' de Abu Nu'aym, volume numérisé 3, p. 141, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen digitalizado 3, p. 141, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo prohibido (haram); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 3. cildinin 141. sayfasından, farz, zorunlu ve haram fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 3, halaman 141, yang menyebutkan perbuatan wajib, yang harus dilakukan, dan yang dilarang; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
