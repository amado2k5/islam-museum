label: { ar: "صحيح مسلم 995 — الأب والأبوة", en: "Sahih Muslim 995 — the father and fatherhood", ur: "صحیح مسلم 995 — باپ اور والدیت", es: "Sahih Muslim 995 — El padre y la paternidad", fr: "Sahih Muslim 995 — Le père et la paternité", tr: "Sahih Muslim 995 — Baba ve Babalık", id: "Sahih Muslim 995 — Ayah dan Peran Ayah" }
text: "… عَبْدُ اللَّهِ بْنُ يَزِيدَ الْمُقْرِئُ، حَدَّثَنَا سَعِيدٌ، - يَعْنِي ابْنَ أَبِي أَيُّوبَ - حَدَّثَنَا كَعْبُ بْنُ عَلْقَمَةَ، عَنْ بِلاَلِ بْنِ عَبْدِ اللَّهِ بْنِ عُمَرَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ تَمْنَعُوا النِّسَاءَ حُظُوظَهُنَّ مِنَ الْمَسَاجِدِ إِذَا اسْتَأْذَنُوكُمْ \" فَقَالَ بِلاَلٌ وَاللَّهِ لَنَمْنَعُهُنَّ. فَقَالَ لَهُ عَبْدُ اللَّهِ أَقُولُ قَالَ رَسُولُ اللَّهِ وَتَقُولُ أَنْتَ لَنَمْنَعُهُنَّ."
summary:
  ar: "حديث في صحيح مسلم، رقم 995، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 995 (The Book of Prayers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 995، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 995 (El Libro de las Oraciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 995 (Le Livre des prières), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 995 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 995, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
