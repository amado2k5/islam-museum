text: "… بن عَبْد اللَّهِ بن عتبة، عَن يُوْسُف بن عَبْد اللَّهِ بن سلام، عَن أبيه قَالَ: بينما نحنُ مَع رَسُوْلِ اللَّهِ وَل يهِ ذْ سمعَ القومُ وهمْ يقولون: أيُّ الأعمال أفضلُ يا رَسُوْلَ اللَّهِ؟ قالَ رَسُوْلُ اللَّهِ وَطِيعِ: إيمانٌ باللَّهِ ورسولِهِ، …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 1243، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
