label: { ar: "سنن النسائي 2854 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 2854 — a burial, grave or resting place", ur: "سنن نسائی 2854 — تدفین، قبر اور مرقد", es: "Sunan al-Nasa'i 2854 — un lugar de entierro, tumba o descanso." }
text: "… عَبَّاسٍ، أَنَّ رَجُلاً، مُحْرِمًا صُرِعَ عَنْ نَاقَتِهِ، فَأُوقِصَ ذُكِرَ أَنَّهُ قَدْ مَاتَ فَقَالَ النَّبِيُّ \" اغْسِلُوهُ بِمَاءٍ وَسِدْرٍ وَكَفِّنُوهُ فِي ثَوْبَيْنِ \". ثُمَّ قَالَ عَلَى إِثْرِهِ \" خَارِجًا رَأْسُهُ \". قَالَ \" وَلاَ تُمِسُّوهُ طِيبًا فَإِنَّهُ يُبْعَثُ يَوْمَ الْقِيَامَةِ مُلَبِّيًا \". قَالَ شُعْبَةُ فَسَأَلْتُهُ بَعْدَ عَشْرِ سِنِينَ فَجَاءَ بِالْحَدِيثِ كَمَا كَانَ يَجِيءُ بِهِ إِلاَّ أَنَّهُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2854، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2854 (The Book of Hajj), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2854، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2854 (El Libro del Hajj), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
