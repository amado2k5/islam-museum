label: { ar: "جامع الترمذي 2070 — الحبة السوداء، الدواء", en: "Jami' al-Tirmidhi 2070 — the black seed; the drug", ur: "جامع ترمذی 2070 — کلونجی، دوا" }
text: "… قال حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، قال حَدَّثَنَا أَبِي، عَنْ قَتَادَةَ، قَالَ حُدِّثْتُ أَنَّ أَبَا هُرَيْرَةَ قَالَ الشُّونِيزُ دَوَاءٌ مِنْ كُلِّ دَاءٍ إِلاَّ السَّامَ. قَالَ قَتَادَةُ يَأْخُذُ كُلَّ يَوْمٍ إِحْدَى وَعِشْرِينَ حَبَّةً فَيَجْعَلُهُنَّ فِي خِرْقَةٍ فَلْيَنْقَعْهُ فَيَتَسَعَّطُ بِهِ كُلَّ يَوْمٍ فِي مَنْخَرِهِ الأَيْمَنِ قَطْرَتَيْنِ وَفِي الأَيْسَرِ قَطْرَةً وَالثَّانِي فِي الأَيْسَرِ قَطْرَتَيْنِ وَفِي الأَيْمَنِ قَطْرَةً وَالثَّالِثُ فِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2070، يذكر الحبة السوداء، والدواء، والداء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2070 (Chapters on Medicine), that mentions the black seed, the drug, the disease and its remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2070، جس میں کلونجی، دوا، بیماری کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
