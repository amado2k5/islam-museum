text: "… عند ربّنا، فأمّا قتال فوالله ما آمُسرك بقتال. فقال سعيد : والله لا أَسأَل عنك أَحدًا أَبدًا. فخرج فقاتل حتى أُمّ. أَخبرنا محمد بن عمر قال : حدّثنى الحَكم بن القاسم من مُصْعَب ابن محمد بن عبد اللّٰه بن أَبى …"
