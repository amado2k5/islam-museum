text: "… بني النضير وقريظة، فقال من الوافر : لِمَا لَقِيَتْ قُرَيْظَةُ وَالنَّضِيرُ أَلاَ يَا سَعْدُ سَعْدَ بَنِي مُعَاذٍ غَدَاةَ تَحَمَّلُوا لَهْوَ الصَّبُورُ لَعَمْرُكَ إِنَّ سَعْدَ بَنِي مُعَاذٍ فَأمّا الْخَزْرَجِيْ أَبُو حُبَابٍ فَقَالَ لِقَيْنُقَاعِ: لاَ تَسِيرُوا أُسَيْداً وَالدَّوَاثِرُ قَدْ تَدُورُ وَبُدْلَتِ الْمَوَالِي …"
summary:
