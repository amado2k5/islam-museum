label: { ar: "الموطأ 1473 — مالك: الجد أبو الأب أولى من بني الأخ للأب والأم بالميراث، وابن الأخ للأب والأم أولى من الجد بولاء الموالي", en: "Muwatta 1473", es: "Muwatta 1473", fr: "Muwatta 1473", ur: "موطا 1473", tr: "El-Muvatta 1473 — Malik: Baba tarafından dedenin, (hem baba hem anne tarafından) kardeşin oğullarından miras konusunda önceliği vardır; ve (hem baba hem anne tarafından) kardeşin oğlu, müvekkil sadakati konularında dededen önceliğe sahiptir.", id: "Al-Muwatta 1473 — Malik: Kakek dari pihak ayah memiliki prioritas atas putra-putra saudara laki-laki (yang sama-sama ayah dan ibu) dalam hal warisan, dan putra dari saudara laki-laki (yang sama-sama ayah dan ibu) memiliki prioritas atas kakek dalam hal kesetiaan klien." }
summary:
  ar: "يقول مالك إن الجد أبا الأب أولى من بني الأخ للأب والأم، وأولى من العم أخي الأب للأب والأم بالميراث. وابن الأخ للأب والأم أولى من الجد بولاء الموالي. {cite:muwatta-maruf-1997 p.20}"
  tr: "Malik, baba tarafından dedenin, hem anne hem de babayı paylaşan öz kardeşinin oğullarından hem de baba tarafından amcasından daha güçlü bir miras hakkına sahip olduğunu söylüyor. Ancak, özgür bırakılan kölelerin bağlılığı söz konusu olduğunda, öz kardeşin oğlu, dededen daha güçlü bir miras hakkına sahiptir. {cite:muwatta-maruf-1997 s.20}"
