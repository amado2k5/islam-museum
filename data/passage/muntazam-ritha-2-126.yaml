text: "… هذه السنة وله سبع واربعون سنة تنقص شهرا واياما. تال ابو بكر الصولى حدثنى عبد اللّه بن المعتز تال لما مات الموفق كتب الى عبيد اللّه بن عبد اللّه ابن طاهر يعزينى عنه ونال انما اعزيك بالمنصور الثانى لأنى لا …"
summary:
  ar: "مقطع من المنتظم في تاريخ الملوك والأمم، المجلد المصوَّر 2، ص 126، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Muntazam of Ibn al-Jawzi, scan volume 2, p. 126, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنتظم ابن الجوزی، اسکین جلد 2، ص 126 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam d'Ibn al-Jawzi, volume numérisé 2, p. 126, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen escaneado 2, p. 126, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Kralların ve Milletlerin Tarihindeki Düzenlilik), Resimli Cilt 2, s. 126'dan bir alıntı; felaket karşısında taziye, teselli ve sabır içeriyor; makine tarafından okunabilir taranmış baskıdan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgülerin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Yang Teratur dalam Sejarah Raja dan Bangsa-Bangsa), Jilid Bergambar 2, hlm. 126, berisi ucapan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan pujian paling terkenal."
