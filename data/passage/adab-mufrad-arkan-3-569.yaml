text: "… عن أبي موسى، وبريدة بن الحصيب. - باب الأدب وإخراج الذين يلعبون بالنرد وأهل الباطل. فيه آثار أربعة، عن ابن عمر، وعائشة، وابن الزيير، وعبداللَّه بن عمرو ابن العاص. - باب لا يلدغ المؤمن من جحر مرتين. فيه عن أبي …"
