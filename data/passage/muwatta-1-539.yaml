text: "لكي أتدبره وأقف عليه"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد، قال: كنت أنا ومحمد بن يحيى بن حبان جالسين، فدعا محمد رجلاً وطلب منه أن يخبره بما سمع من أبيه، فأخبر الرجل أن أباه أتى زيد بن ثابت وسأله عن قراءة القرآن في سبع، فقال زيد: حسن، ولأن أقرأه في نصف شهر أو عشر أحب إلي، وعلل ذلك بأنه يريد أن يتدبره ويقف عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.277}"
