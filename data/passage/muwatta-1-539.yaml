label: { ar: "الموطأ 539 — زيد بن ثابت: قراءة القرآن في نصف شهر أو عشر أحب إلي لكي أتدبره وأقف عليه", en: "Muwatta 539", es: "Muwatta 539", fr: "Muwatta 539", ur: "موطا 539", tr: "El-Muvatta 539 — Zeyd ibn Sabit: Kur'an'ı yarım ayda veya on günde okumak bana daha sevimli gelir, böylece üzerinde düşünüp tefekkür edebilirim.", id: "Al-Muwatta 539 — Zayd ibn Thabit: Membaca Al-Qur'an dalam setengah bulan atau sepuluh hari lebih kusukai agar aku dapat merenungkannya dan memikirkannya." }
text: "لكي أتدبره وأقف عليه"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد، قال: كنت أنا ومحمد بن يحيى بن حبان جالسين، فدعا محمد رجلاً وطلب منه أن يخبره بما سمع من أبيه، فأخبر الرجل أن أباه أتى زيد بن ثابت وسأله عن قراءة القرآن في سبع، فقال زيد: حسن، ولأن أقرأه في نصف شهر أو عشر أحب إلي، وعلل ذلك بأنه يريد أن يتدبره ويقف عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.277}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ederek şöyle demiştir: Muhammed ibn Yahya ibn Hibban ile birlikte oturuyorduk. Muhammed bir adamı çağırdı ve babasından duyduklarını anlatmasını istedi. Adam, babasının Zeyd ibn Sabit'e gidip Kur'an'ı yedi günde okumayı sorduğunu söyledi. Zeyd şöyle cevap verdi: \"Güzel, ama ben onu yarım ayda veya on günde okumayı tercih ederim.\" Bunun nedenini ise Kur'an'ı daha iyi anlamak ve üzerinde düşünmek istemesi olarak açıkladı. Editör, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.277}"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id, yang berkata: Muhammad bin Yahya bin Hibban dan aku sedang duduk bersama ketika Muhammad memanggil seorang pria dan memintanya untuk menceritakan apa yang telah didengarnya dari ayahnya. Pria itu mengatakan bahwa ayahnya telah pergi ke Zayd bin Thabit dan bertanya kepadanya tentang membaca Al-Quran dalam tujuh hari. Zayd menjawab: \"Bagus, tetapi saya lebih suka membacanya dalam setengah bulan atau sepuluh hari.\" Dia menjelaskan bahwa dia ingin merenungkannya dan memahaminya lebih baik. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.277}"
