label: { ar: "جامع الترمذي 146 — جمع القرآن والمصاحف", en: "Jami' al-Tirmidhi 146 — the collection of the Qur'an and the codices", ur: "جامع ترمذی 146 — جمعِ قرآن اور مصاحف", es: "Jami' al-Tirmidhi 146 — la colección del Corán y los códices", fr: "Jami' al-Tirmidhi 146 — le recueil du Coran et des codex", tr: "Cami' el-Tirmizi 146 — Kur'an ve Kur'an Reçeteleri Koleksiyonu", id: "Jami' al-Tirmidhi 146 — Kumpulan Al-Qur'an dan Salinan Al-Qur'an" }
text: "… عَلِيٍّ، قَالَ كَانَ رَسُولُ اللَّهِ يُقْرِئُنَا الْقُرْآنَ عَلَى كُلِّ حَالٍ مَا لَمْ يَكُنْ جُنُبًا. قَالَ أَبُو عِيسَى حَدِيثُ عَلِيٍّ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَبِهِ قَالَ غَيْرُ وَاحِدٍ مِنْ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَالتَّابِعِينَ. قَالُوا يَقْرَأُ الرَّجُلُ الْقُرْآنَ عَلَى غَيْرِ وُضُوءٍ وَلاَ يَقْرَأُ فِي الْمُصْحَفِ إِلاَّ وَهُوَ طَاهِرٌ. وَبِهِ يَقُولُ سُفْيَانُ الثَّوْرِيُّ وَالشَّافِعِيُّ وَأَحْمَدُ وَإِسْحَاقُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 146، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 146 (The Book on Purification), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 146، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 146 (El Libro de la Purificación), menciona la colección del Corán y los códices. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 146 (Le Livre de la Purification), mentionne la collection du Coran et des codex. Le catalogue du musée, consacré à la lecture et à l'écriture du Coran, répertorie ces documents avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de ce sujet."
  tr: "Cami' el-Tirmizi'nin 146 numaralı hadisinde Kur'an'ın ve el yazmalarının derlenmesinden bahsedilir. Bu hadis, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 146, menyebutkan penyusunan Al-Quran dan manuskrip-manuskripnya. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
