label: { ar: "الموطأ 443 — أبو بكر بن عبد الرحمن: من غدا إلى المسجد ليتعلم خيراً كان كالمجاهد", en: "Muwatta 443", es: "Muwatta 443", fr: "Muwatta 443", ur: "موطا 443", tr: "El-Muvatta 443 — Ebu Bekir ibn Abdül-Rahman: Kim hayırlı bir şey öğrenmek için mescide giderse, mücahit gibidir (Allah yolunda çabalayan gibidir).", id: "Al-Muwatta 443 — Abu Bakr ibn Abd al-Rahman: Barangsiapa pergi ke masjid untuk mempelajari sesuatu yang baik, maka ia seperti seorang mujahid (orang yang berjuang di jalan Allah)." }
text: "من غدا أو راح إلى المسجد لا يريد غيره ليتعلم خيراً أو ليعلمه ثم رجع إلى بيته كان كالمجاهد في سبيل الله رجع غانماً"
summary:
  ar: "أثر يرويه مالك عن سمي مولى أبي بكر أن أبا بكر بن عبد الرحمن كان يقول، في باب انتظار الصلاة والمشي إليها: من غدا أو راح إلى المسجد لا يريد غيره ليتعلم خيراً أو ليعلمه ثم رجع إلى بيته كان كالمجاهد في سبيل الله رجع غانماً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل الزرقاني عن ابن عبد البر أن هذا لا يُدرك بالرأي لأنه قطع على غيب من ثواب الله. {cite:muwatta-maruf-1997 p.228}"
  tr: "Malik'in, Ebu Bekir'in azatlı kölesi Sümey'den rivayet ettiği bir rivayete göre, Ebu Bekir ibn Abdülrahman namazı beklemek ve namaza gitmekle ilgili olarak şöyle derdi: \"Kim sabah veya akşam, başka bir niyet olmaksızın, sadece hayırlı bir şey öğrenmek veya öğretmek için mescide gider ve sonra evine dönerse, Allah yolunda savaşmış ve zaferle dönmüş gibidir.\" Araştırmacı, bunu Ebu Musab ve Süveyd'in Malik'ten rivayet ettiğini ve el-Zarkani'nin İbn Abdülberr'den bunun kişisel görüşle anlaşılamayacağını, çünkü Allah'ın gayb mükafatı hakkında kesin bir ifade olduğunu söylediğini aktarıyor. {cite:muwatta-maruf-1997 s.228}"
  id: "Sebuah riwayat yang dilaporkan oleh Malik dari Sumayy, budak yang dibebaskan oleh Abu Bakr, menyatakan bahwa Abu Bakr ibn Abd al-Rahman biasa berkata, mengenai menunggu salat dan berjalan ke masjid: “Siapa pun yang pergi ke masjid di pagi atau sore hari, dengan tujuan semata-mata untuk belajar atau mengajarkan sesuatu yang baik, lalu pulang ke rumah, maka ia seperti orang yang telah berperang di jalan Allah dan kembali dengan kemenangan.” Peneliti menyebutkan bahwa Abu Musab dan Suwayd meriwayatkannya dari Malik, dan al-Zarqani mengutip Ibn Abd al-Barr yang mengatakan bahwa hal ini tidak dapat dipahami melalui pendapat pribadi karena ini adalah pernyataan pasti tentang pahala Allah yang gaib. {cite:muwatta-maruf-1997 p.228}"
