label: { ar: "الموطأ 443 — أبو بكر بن عبد الرحمن: من غدا إلى المسجد ليتعلم خيراً كان كالمجاهد", en: "Muwatta 443" }
text: "من غدا أو راح إلى المسجد لا يريد غيره ليتعلم خيراً أو ليعلمه ثم رجع إلى بيته كان كالمجاهد في سبيل الله رجع غانماً"
summary:
  ar: "أثر يرويه مالك عن سمي مولى أبي بكر أن أبا بكر بن عبد الرحمن كان يقول، في باب انتظار الصلاة والمشي إليها: من غدا أو راح إلى المسجد لا يريد غيره ليتعلم خيراً أو ليعلمه ثم رجع إلى بيته كان كالمجاهد في سبيل الله رجع غانماً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل الزرقاني عن ابن عبد البر أن هذا لا يُدرك بالرأي لأنه قطع على غيب من ثواب الله. {cite:muwatta-maruf-1997 p.228}"
