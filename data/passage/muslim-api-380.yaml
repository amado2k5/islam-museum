label: { ar: "صحيح مسلم 380 — الأب والأبوة", en: "Sahih Muslim 380 — the father and fatherhood", ur: "صحیح مسلم 380 — باپ اور والدیت" }
text: "… بْنُ حُمَيْدٍ، قَالاَ حَدَّثَنَا يَعْقُوبُ، - وَهُوَ ابْنُ إِبْرَاهِيمَ بْنِ سَعْدٍ - حَدَّثَنَا أَبِي، عَنْ صَالِحٍ، عَنِ ابْنِ شِهَابٍ، قَالَ حَدَّثَنِي عَامِرُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، سَعْدٍ أَنَّهُ قَالَ أَعْطَى رَسُولُ اللَّهِ رَهْطًا وَأَنَا جَالِسٌ فِيهِمْ. بِمِثْلِ حَدِيثِ ابْنِ أَخِي ابْنِ شِهَابٍ عَنْ عَمِّهِ. وَزَادَ فَقُمْتُ إِلَى رَسُولِ اللَّهِ فَسَارَرْتُهُ فَقُلْتُ مَا لَكَ عَنْ فُلاَنٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 380، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 380 (The Book of Faith), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 380، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
