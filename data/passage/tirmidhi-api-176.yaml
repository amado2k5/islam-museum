text: "… ذَرٍّ أُمَرَاءُ يَكُونُونَ بَعْدِي يُمِيتُونَ الصَّلاَةَ فَصَلِّ الصَّلاَةَ لِوَقْتِهَا فَإِنْ صُلِّيَتْ لِوَقْتِهَا كَانَتْ لَكَ نَافِلَةً وَإِلاَّ كُنْتَ قَدْ أَحْرَزْتَ صَلاَتَكَ \". وَفِي الْبَابِ عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ وَعُبَادَةَ بْنِ الصَّامِتِ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي ذَرٍّ حَدِيثٌ حَسَنٌ. وَهُوَ قَوْلُ غَيْرِ وَاحِدٍ مِنْ أَهْلِ الْعِلْمِ يَسْتَحِبُّونَ أَنْ يُصَلِّيَ الرَّجُلُ الصَّلاَةَ لِمِيقَاتِهَا إِذَا أَخَّرَهَا الإِمَامُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 176، يرد فيه ذكر المستحب، والنافلة والنوافل. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 176 (The Book on Salat (Prayer)), whose wording mentions the recommended (mustahabb), the supererogatory (nafila). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 176، جس کے الفاظ میں مستحب، نفل اور نوافل کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 176, dont le texte mentionne le recommandé (mustahabb), le surérogatoire (nafila). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 176, cuyo texto menciona lo recomendado (mustahabb), lo supererogatorio (nafila). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
