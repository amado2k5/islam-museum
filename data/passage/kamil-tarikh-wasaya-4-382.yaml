  fr: "Extrait du *Kamil fi al-Tarikh* d'Ibn al-Athir, volume 4, page 382, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire *Testaments Browser*."
  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 4. cildinin 382. sayfasından bir alıntı, vasiyetname veya son vasiyetten ve ölüm saatinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir baskıdan alınmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
