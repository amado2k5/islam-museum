text: "… بن جُبيْر، عن ابن عباس : أن مشركي قريش بعثوا النضر بن الحارث، وعقبة بن أبي مُعَيْط إلى أحبار اليهود بالمدينة وقالوا لهم : سَلوهم عن محمد وصفوا لهم صِفَتَهُ وأخبروهم بقوله فإنهم أهل الكتاب الأول وعندهم علمُ ما ليس …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 839، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
