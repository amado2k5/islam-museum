label: { ar: "سنن أبي داود 856 — الأب والأبوة", en: "Sunan Abi Dawud 856 — the father and fatherhood", ur: "سنن ابی داؤد 856 — باپ اور والدیت" }
text: "… يَحْيَى بْنُ سَعِيدٍ، عَنْ عُبَيْدِ اللَّهِ، - وَهَذَا لَفْظُ ابْنِ الْمُثَنَّى - حَدَّثَنِي سَعِيدُ بْنُ أَبِي سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ دَخَلَ الْمَسْجِدَ فَدَخَلَ رَجُلٌ فَصَلَّى ثُمَّ جَاءَ فَسَلَّمَ عَلَى رَسُولِ اللَّهِ فَرَدَّ رَسُولُ اللَّهِ وَقَالَ \" ارْجِعْ فَصَلِّ فَإِنَّكَ لَمْ تُصَلِّ \". فَرَجَعَ الرَّجُلُ فَصَلَّى كَمَا كَانَ صَلَّى ثُمَّ جَاءَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 856، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 856 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 856، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
