label: { ar: "الموطأ 544 — عمر يسأل النبي ثلاثاً فلا يجيبه، ثم نزول سورة الفتح: لهي أحب إلي مما طلعت عليه الشمس", en: "Muwatta 544", es: "Muwatta 544", fr: "Muwatta 544", ur: "موطا 544", tr: "Muvatta Suresi 544 — Ömer, Peygamber'e üç defa sorar, fakat Peygamber ona cevap vermez. Bunun üzerine Feth Suresi nazil olur: \"O, güneşin doğduğu her şeyden daha sevgilidir benim için.\"", id: "Al-Muwatta 544 — Umar bertanya kepada Nabi tiga kali, tetapi beliau tidak menjawabnya, kemudian Surah Al-Fath diturunkan: “Ia lebih kucintai daripada segala sesuatu yang telah diterangi matahari.”" }
text: "لقد أنزلت علي هذه الليلة سورة، لهي أحب إلي مما طلعت عليه الشمس"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن أبيه أسلم مولى عمر، أن النبي كان يسير في بعض أسفاره وعمر بن الخطاب معه ليلاً، فسأله عمر عن شيء ثلاث مرات فلم يجبه، فلام عمر نفسه على إلحاحه، وحرك بعيره حتى تقدم الناس خشية أن ينزل فيه قرآن، فما لبث أن سمع صارخاً يصرخ به، فجاء النبي وسلم عليه، فأخبره أنه أنزلت عليه تلك الليلة سورة هي أحب إليه مما طلعت عليه الشمس، ثم قرأ أول سورة الفتح [[passage/quran-48-1|الفتح 1]]. ويذكر المحقق بتفصيل أن رواة الموطأ رووه عن مالك مرسلاً ⁦(منهم القعنبي وإسماعيل بن أبي أويس عند البخاري 4833 و5012)⁩، وأن عبد الرحمن بن غزوان ومحمد بن حرب ومحمد بن خالد بن عثمة أسندوه عن مالك عن زيد عن أبيه عن عمر ⁦(أحمد 1/31، الترمذي 3262)⁩، وأن الدارقطني نص على أن أصحاب الموطأ أرسلوه، وأن ابن حجر في مقدمة الفتح يرى أن ظاهر رواية البخاري الوصل لأن معظم القصة محكي عن عمر، ويعلق المحقق بأن كلام البزار وابن عبد البر يعكر على ذلك. {cite:muwatta-maruf-1997 p.280} {cite:muwatta-maruf-1997 p.281}"
  tr: "Malik, Zeyd bin Aslam'dan, o da babası Ömer'in azatlı kölesi Aslam'dan rivayet ettiğine göre, Peygamberimiz yolculuklarından birindeyken, Ömer bin Hattab geceleyin onunla birlikteydi. Ömer ona üç kez bir şey sordu, ancak Ömer cevap vermedi. Ömer, ısrarından dolayı kendini suçladı ve Kur'an'dan bir ayetin kendisine indirilmesinden korkarak devesini öne doğru hareket ettirdi. Çok geçmeden birinin kendisine bağırdığını duydu, bunun üzerine Peygamberimiz yanına gelip onu selamladı ve ona o gece kendisine güneşin aydınlattığı her şeyden daha çok sevdiği bir surenin indirildiğini söyledi. Sonra da Feth Suresi'nin başlangıcını okudu. Araştırmacı, Muwatta rivayetçilerinin bunu Malik'ten mursal hadis olarak naklettiklerini (Buhari 4833 ve 5012'de el-Ka'nebi ve İsmail ibn Abi Uveys dahil) ve Abdurrahman ibn Gazvan, Muhammed ibn Harb ve Muhammed ibn Halid ibn Osman'ın ise bunu Malik'ten, Zeyd'den, babasından, Ömer'den gelen bir rivayet zinciriyle naklettiklerini ayrıntılı olarak belirtmektedir (Ahmed 1/31, Tirmizi 3262). Ayrıca, el-Daraqutni'nin Muwatta derleyicilerinin bunu mursal hadis olarak naklettiğini ve İbn Hacer'in Feth el-Bari'nin girişinde, Buhari'nin rivayetinin zahiri anlamının bağlantılı olduğu yönünde olduğunu, çünkü hikayenin büyük kısmının Ömer'den nakledildiğini belirttiğini de kaydetmektedir. Araştırmacı, el-Bezzar ve İbn Abdülberr'in açıklamalarının bununla çeliştiği yorumunu yapmaktadır. {cite:muwatta-maruf-1997 s.280} {cite:muwatta-maruf-1997 s.281}"
  id: "Diriwayatkan oleh Malik dari Zaid bin Aslam dari ayahnya Aslam, budak yang dibebaskan oleh Umar, bahwa Nabi sedang dalam perjalanan dan Umar bin Al-Khattab bersamanya pada malam hari. Umar bertanya kepadanya tentang sesuatu tiga kali dan dia tidak menjawabnya. Umar menyalahkan dirinya sendiri karena bersikeras, dan dia menggerakkan untanya hingga berada di depan orang-orang karena takut Al-Qur'an akan diturunkan kepadanya. Tidak lama kemudian dia mendengar seseorang berteriak kepadanya, lalu Nabi datang dan memberi salam kepadanya, dan beliau memberitahunya bahwa sebuah surah telah diturunkan kepadanya malam itu yang lebih dicintainya daripada apa pun yang pernah disinari matahari. Kemudian beliau membacakan permulaan Surah Al-Fath [[passage/quran-48-1|Al-Fath 1]]. Peneliti tersebut menyebutkan secara rinci bahwa para perawi Muwatta meriwayatkan hadits tersebut dari Malik sebagai hadits mursal (termasuk al-Qa'nabi dan Isma'il ibn Abi Uways dalam al-Bukhari 4833 dan 5012), dan bahwa 'Abd al-Rahman ibn Ghazwan, Muhammad ibn Harb, dan Muhammad ibn Khalid ibn 'Uthmah meriwayatkannya dengan sanad dari Malik, dari Zayd, dari ayahnya, dari 'Umar (Ahmad 1/31, al-Tirmidhi 3262). Ia juga mencatat bahwa al-Daraqutni menyatakan bahwa para penyusun Muwatta meriwayatkannya sebagai hadits mursal, dan bahwa Ibn Hajar, dalam pengantar Fath al-Bari, meyakini bahwa makna yang tampak dari riwayat al-Bukhari adalah bahwa riwayat tersebut saling berhubungan, karena sebagian besar cerita diriwayatkan dari 'Umar. Peneliti berkomentar bahwa pernyataan al-Bazzar dan Ibn 'Abd al-Barr bertentangan dengan hal ini. {kutip:muwatta-maruf-1997 hal.280} {kutip:muwatta-maruf-1997 hal.281}"
