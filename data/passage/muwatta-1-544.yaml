label: { ar: "الموطأ 544 — عمر يسأل النبي ثلاثاً فلا يجيبه، ثم نزول سورة الفتح: لهي أحب إلي مما طلعت عليه الشمس", en: "Muwatta 544" }
text: "لقد أنزلت علي هذه الليلة سورة، لهي أحب إلي مما طلعت عليه الشمس"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن أبيه أسلم مولى عمر، أن النبي كان يسير في بعض أسفاره وعمر بن الخطاب معه ليلاً، فسأله عمر عن شيء ثلاث مرات فلم يجبه، فلام عمر نفسه على إلحاحه، وحرك بعيره حتى تقدم الناس خشية أن ينزل فيه قرآن، فما لبث أن سمع صارخاً يصرخ به، فجاء النبي وسلم عليه، فأخبره أنه أنزلت عليه تلك الليلة سورة هي أحب إليه مما طلعت عليه الشمس، ثم قرأ أول سورة الفتح [[passage/quran-48-1|الفتح 1]]. ويذكر المحقق بتفصيل أن رواة الموطأ رووه عن مالك مرسلاً (منهم القعنبي وإسماعيل بن أبي أويس عند البخاري 4833 و5012)، وأن عبد الرحمن بن غزوان ومحمد بن حرب ومحمد بن خالد بن عثمة أسندوه عن مالك عن زيد عن أبيه عن عمر (أحمد 1/31، الترمذي 3262)، وأن الدارقطني نص على أن أصحاب الموطأ أرسلوه، وأن ابن حجر في مقدمة الفتح يرى أن ظاهر رواية البخاري الوصل لأن معظم القصة محكي عن عمر، ويعلق المحقق بأن كلام البزار وابن عبد البر يعكر على ذلك. {cite:muwatta-maruf-1997 p.280} {cite:muwatta-maruf-1997 p.281}"
