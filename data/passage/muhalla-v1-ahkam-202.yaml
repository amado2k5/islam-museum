text: "… تعالى في الجزء الثالث مسألة والزكاة واجبة في أوله آخره ولجميع المسلمين. كتاب الدماء والقصاص إلى كتاب الحدود. المصدر دار الكتب المصرية الناسخ خليل بن أكجي المعروف والده بسلحدار القرماني الخط النسخ أوله والطمأنينة. آخره حلي الفضة والذهب. كتاب الصلاة …"
summary:
