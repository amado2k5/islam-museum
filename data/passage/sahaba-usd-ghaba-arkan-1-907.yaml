text: "… حَضَرت رسول اللّٰه عله الوفاة قال: مُرُوا أَبا بكر أَن يصلي بالناس، وهو يرى مكاني، فصلى بالناس سبعة أيام في حياة رسول اللّٰه و، فلما قَبَضَ اللّٰه نبيه ارتدَّ الناسُ عن الإسلام، فقالوا: نصلي ولا نعطي الزكاة، فرضي أَصحابُ رسول …"
