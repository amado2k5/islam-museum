text: "… الناس فنفس الخصلتين كفر، حيث كانتا في أعمال الكفار وهما قائمتان بالناس لكن ليس من قام به شعبة من شعب الكفر يصير كافراً الكفر المطلق حتى تقوم به حقيقة الكفر، كما أنه ليس من قام به شعبة من شعب الإيمان …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 746، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 746, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 746 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe, de Ibn Batta, volumen 1, pág. 746, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye en su lista."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 1, page 746, mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1), sayfa 746'dan, imanın dallarını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 1 Bergambar, hlm. 746, yang menyebutkan cabang-cabang keimanan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
