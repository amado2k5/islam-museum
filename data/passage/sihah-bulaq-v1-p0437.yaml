text: |-
  ١ ا عترضه وانقولى فقال هذا
  غلط والصواب شرحا الرحسل
  ظرفاه وقال صاحب الاساس
  يقال لايزال فلان بين شرخى
  رحلد اذا كان مسفارااه:
  ⁦(ضمخ)⁩
  يعف ركب نعلة مشهورة قبيحة فى قتل أبيه رخ) الشارخ الشاب والهع
  شرخ مثل صاحب وصحب وفى الحديث اقتلواشيوح المشركين واستحبواشرخهم
  وقدشرخ الصبى شروجا وشرخ الامر والشباب أوله وقال حسات بن ثابت
  انّ شرخ الشباب والشعر الاس ودمالم يعاص كان جنونا
  واشرخ نتاج كلسنة من أولاد الابل وشرخ ناب البعيرشرخا اذاشق البضعة وشرحا الفوق
  حرفاه بينهمامرقع الوتروكذلات شرخا الرجل آخرته وواسطته ١ قال العجاج
  شرخا غبيط ساس هى كاح والشرخ النصل الذى لم يسويه-دولم يركب عليه قائمه والجع
  شروخ وهماشرخار أى.ثلان وابمع شروخ وهم الاتراب ردخ ابن السكيت
  رجل شرداخ القدم أى عظيم القدم عريضها شمخ الجبال التوامخ هى الشواهق
  وقد شمخ الجبل فهوشامخ وشمخ الرجل بأنفه تكبر والانوف الشمخ مثل الزمخ والشهاخ
  ابنضرار الشاعر ⁦(شمرخ)⁩ الشمراخ والشهروخ العشكال والعشكول والشهراخ رأس
  الجبل والشمراخ غرة الفرس اذادقت وسالت وجاات الخيشوم ولم تباخ الحجفلة والفرس
  نهراخ أيضا قال الشاءر (حريث بن عتاب النبهانى
  ترى الجون ذا الشمراخ والورد يبتفى * ليالى عشر اوسطنا وهوعامر
  والشمراخية صنف من الخوارج أصحاب عبد اللّٰه بن شمراخ يخ جمع الشيخ شبوخ
  وأشباخ وشيخة وشيخان ومشيخة ومشايخ ومشيوحاء والمرأة شيخة قال عبدد
  كانهاشيخة رقوب وهدشخ الرحل يشيخ شيخا بالتعريك ياء على أصل وشيخوخة وأصل
  الياءمتصركة سكنت لانه ليمر فى الكلام فعلول وما ياء على هذا من ذوات الواومثل كينونة
  وقيدودة ودي رمة وهيموعة فأصل كينونة بالتشديد فخفف ولولا ذلك لقالوا كونوتة وقودودة
  ولا يجب ذلك فى ذوات الياهمثل الحمدودة والطيرورة والشيخوخة وشيخ تشييخا أى شاخ
  وشيخته دءوته شيخا للتيجيل وتصغير الشيخ شيخ وشيخ أيضا بالكسر ولاتقل شويخ
  صل الصاد خخ الصاخة الصيحة تصم لشدتها تقول صح الصوت الاذن
  بصضهاه ها ومنه هيت القيامة الصاخة وضريت الصخرة بحير فسمعت اهاصفة
  (صرخ الصراخ الصوت تقول صرخ صرخة واصطرخ بعن والتصرخ تصكاف
  الصراخ يقال التصرخ به حق أى بالعطاس والمصرخ المغيث والمستصرخ المستغيث تقول
  منه استصرخف فأصرخته والصريخ صوت المستصرخ والصريمخ أيضا الصارخ وهو
  المغيث والمستغيث أيضا وهو من الاضداد ⁦(صلخ)⁩ الاصلح الاصم الذى لا يسمع شيئا
  البتة رجل أصلح بين الصلح قال الفرّاء كان الكميت أصم أصلح ⁦(صمخ)⁩ الصهاخ خرق
  الاذن وبالسين لغة ويقال هو الاذن نفسها قال العجاج . حتى اذاصر الدماخ الاصمعا
  اصمفت الرجل أصبت صماخه ⁦(صعلخ)⁩ الصملاخ والصملوخ ومخ الاذن والصمالخ
  اللبن الجائر المتكبد ⁦(صوخ)⁩ أصاح ه أى استمع وقال أبودواد
  وبصيح أحيانا كما اعثة مع المضل لصوت ناشد
  فصل الضا د) ( ض م ضع بالطيب تاطخ به وضمخنته أناتضميفًا
