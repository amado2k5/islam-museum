text: |-
  قوله حيلان بالمهملة كما هو ظاهر
  وغلط المرجم فجعل بالجيم قاله نصر
  ٣٦٠
  ⁦(با ب الراء)⁩
  . ⁦(عذد)⁩
  والعذرة وجمع الحلق من الدم وذلك الموضع أيضا يسمى عذرة وهو قريب من اللهاة وعذرة
  الفرس ماعلى المنسج من الشعر والجمع عذر وقال الاصمعى العذرة الخصلة من الشعر وأنشد
  لابى النجم مشى العذارى الشعث ينفضن العذر • وعذرة قبيلة من المين والعذرة
  كواكب فى آخر المجرّة خسة والعذرة البكارة والعذراء البكر والمسع العذارى والعذارى
  والعذراوات كما قلناه فى الصمارى ويقال فلان أبو عذرها اذا كان هوالذى افترعها واقتضها
  وقولهم ما أنت بذى عذرهذا الكلام أى است بأوّل من اقتضبه والعذرة فناء الدار
  سميت يذلك لانّ العذرة كانت تلتى فى الاقنية قال الحطليئة يهجوقومه
  لعمرى لقد جرّسكم فوجدتكم * قباح الوجوميثى العذرات
  أراد سيمين حذف النون للاضافة ومدح فى هذه القصيدة ابلدفقال
  مهاريس بروى رسلهاضف أهلها * اذا الفارأبدت أوجه انخفرات
  فقال له عمررضى اللّٰه عنه بئس الرجل أنت تدح ابلكْ وتهجوقومك ويقال عذرته فيما صنع
  أعذره عذرا وعذرا والاسم المعذرة والعذرى قال الشاعر
  قه درك انى قد رميتهم • انى حددت ولاعذرى هدود
  وكذلك العذرة وهى مثل الركبة والجلسة قال النابقة
  ها إنّ تاعذرة إلا تكن نفعت • فانّ صاحبها قد تاه فى البلد
  قال مجاهد فى قوله تعالى بل الانسان على نفسه بصيرة ولو ألقى معاذيره أى ولوجادل عنها
  والعذار للداية والجمع عذروكذلك عذار الرجل شحره النابت فى موضع العذار تقول منه
  عذرت الفرس بالعذار أعذره وأعذره اذاشددت عذاره وكذلك أعذرته بالااف والعذار
  سمة فى موضع العذار ويقال للمنهمك فى التى خلع عذاره والعذار فى قول ذى الرمة
  عذارين فى جرداء وعث حضورها * حبلان مستطيلان من الرمل ويقال طريتان
  وعذر الغلام ختنه قال الشاعر
  فى قية جعلوا الصليب إلههم * حاشاى انى مسلم معذور
  قال أبو عببد يقال عسذرت الغلام والجارية أعذرهماء ذرا أى ختنتهما وكذلك أعذرهما
  والاكثر خفضت الجارية وعذره اللّٰه من العذرة فعذر وهذر وهو معذور أى هاج به وجع
  الحلق من الدم قال جرير
  غمزابن مزة يافرزدق كينها * غمز الطبيب تغانغ المعذور
  وعذر أى كثرت عيوبه وذنويه وكذلك أعذر وفى الحديث أن يهلك النساس حتى يعدْروا من
  أنفسهم أى تكثرذنوبه-م وعيو به-م قال أبو عبيد ولا أراه الامن العذرأى يستوجبون
  العقوبة فيكون لمن يعذبهم العذر والتعذير فى الامى التقصير فيه والعاذر أثر الجرح قال ابن
  أحر أزاجهم فى الباب اذيد فعونى * وفى الظهرمق من قرى الباب عاذر
  قول منه أعدربه أى تزكْ به عادراوا اعذيرة مثله والعاذ رلغسة فى العاذل أواثغة وهو عرق
  الاستهاضة وأعذر فى الامر أى نااغ فيه ويقال ضرب فلان فأعذرأى أشرف به على الهلاك
  وأعذرت الدارأى كثرت فيها العذرة وأعذر الرجل صارذاعذر وفى المنل أعذر
