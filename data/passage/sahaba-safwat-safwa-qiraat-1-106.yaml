text: "صفة الصفوة العشرة المبشرون بالجنة ذكر جملة من مناقبه وفضائله قال أهل العلم: لما أسلم عمر عزّ الإسلام، وهاجر جهراً، وشهد بدراً وأُحداً والمشاهد كلها، وهو أول خليفة دعي بأمير المؤمنين، وأول من كتب التاريخ للمسلمين، وأول من جمع القرآن …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 106، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 106, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 106 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 1, pág. 106, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
