text: "… النبيّ ل منها أو لم يأكل ؟ وأكثرُ الروايات، أنه أكل منها، وبقي بعد ذلك ثلاث سنين حتى قال فِي وجعه الذي مات فيه: مَا زِلْتُ أَجِدُ مِن الأُكْلَةِ الَّتِي أَكَلْتُ مِن الشَّاةِ يَوْمَ خَيْبَر، فَهْذَا أوانُ انْقِطَاع الأبْهَرِ منِّي. …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 447، يذكر مرض النبي، والوجع، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 447, that mentions the Prophet's illness, pain, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 447 کا اقتباس جس میں نبی کی بیماری، درد، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 447, que menciona la enfermedad del Profeta, el dolor y los órganos del cuerpo; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 447, qui mentionne la maladie du Prophète, sa douleur et les organes de son corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 447. sayfasından, Peygamberin hastalığı, ağrısı ve vücut parçalarından bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid 1 bergambar, halaman 447, yang menyebutkan penyakit, rasa sakit, dan bagian tubuh Nabi; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
