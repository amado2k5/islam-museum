label: { ar: "جامع الترمذي 599 — التطوع", en: "Jami' al-Tirmidhi 599 — the voluntary act (tatawwu')", ur: "جامع ترمذی 599 — تطوع ⁦(نفلی عمل)⁩", fr: "Jami' al-Tirmidhi 599 — l'acte volontaire (tatawwu')", es: "Yami' al-Tirmidhi 599 — el acto voluntario (tatawwu')", tr: "Cami' el-Tirmizi 599 — Gönüllülük", id: "Jami' al-Tirmidhi 599 — Sukarelawan" }
text: "… قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَقَالَ إِسْحَاقُ بْنُ إِبْرَاهِيمَ أَحْسَنُ شَيْءٍ رُوِيَ فِي تَطَوُّعِ النَّبِيِّ فِي النَّهَارِ هَذَا. وَرُوِيَ عَنْ عَبْدِ اللَّهِ بْنِ الْمُبَارَكِ أَنَّهُ كَانَ يُضَعِّفُ هَذَا الْحَدِيثَ. وَإِنَّمَا ضَعَّفَهُ عِنْدَنَا وَاللَّهُ أَعْلَمُ لأَنَّهُ لاَ يُرْوَى مِثْلُ هَذَا عَنِ النَّبِيِّ إِلاَّ مِنْ هَذَا الْوَجْهِ عَنْ عَاصِمِ بْنِ ضَمْرَةَ عَنْ عَلِيٍّ. وَعَاصِمُ بْنُ ضَمْرَةَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 599، يرد فيه ذكر التطوع. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 599 (The Book on Traveling), whose wording mentions the voluntary act (tatawwu'). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 599، جس کے الفاظ میں تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 599, dont le texte mentionne l'acte volontaire (tatawwu'). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 599, cuyo texto menciona el acto voluntario (tatawwu'). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 599 numaralı hadis, gönüllü ibadetlerden bahsetmektedir. Bu hadis, farz ibadetler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh ibadetler, haram ibadetler ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 599, menyebutkan tentang ibadah sunnah. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
