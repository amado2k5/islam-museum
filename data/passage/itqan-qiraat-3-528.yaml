text: "… المصحفِ الإمام، فهو من السبعةِ المنصوصةِ، ومتى فُقِدَ شرطٌ من الثلاثة فهو الشاذّ. وقد اشتد إِنكارُ أئمة هذا الشأن على مَنْ ظن انحصارَ القراءاتِ المشهورةِ في مثل ما في التيسير و الشاطبية، وآخِرُ مَنْ صَرَّحِ بذلك الشيخُ تقيُّ الدينِ السبكيِّ …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 528، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 528, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 528 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 528, que menciona las lecturas del Corán, los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du livre « al-Itqan fi 'Ulum al-Qur'an » d'al-Suyuti (tome 3, p. 528), numérisé, mentionnant les lectures du Coran, les lecteurs, la compilation du Coran et des codex, ainsi que l'orthographe du mushaf. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 3. cildinin 528. sayfasından bir alıntı, Kur'an okunuşlarını, okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını ve Kur'an yazısını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazısı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 3, halaman 528, membahas bacaan Al-Qur'an, para qari, penyusunan Al-Qur'an dan manuskripnya, serta aksara Al-Qur'an. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
