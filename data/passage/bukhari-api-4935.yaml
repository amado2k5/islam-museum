label: { ar: "صحيح البخاري 4935 — أعضاء البدن", en: "Sahih al-Bukhari 4935 — the organs of the body", ur: "صحیح بخاری 4935 — اعضائے بدن" }
text: "… قَالَ قَالَ رَسُولُ اللَّهِ \" مَا بَيْنَ النَّفْخَتَيْنِ أَرْبَعُونَ \". قَالَ أَرْبَعُونَ يَوْمًا قَالَ أَبَيْتُ. قَالَ أَرْبَعُونَ شَهْرًا قَالَ أَبَيْتُ. قَالَ أَرْبَعُونَ سَنَةً قَالَ أَبَيْتُ. قَالَ \" ثُمَّ يُنْزِلُ اللَّهُ مِنَ السَّمَاءِ مَاءً. فَيَنْبُتُونَ كَمَا يَنْبُتُ الْبَقْلُ لَيْسَ مِنَ الإِنْسَانِ شَىْءٌ إِلاَّ يَبْلَى إِلاَّ عَظْمًا وَاحِدًا وَهْوَ عَجْبُ الذَّنَبِ، وَمِنْهُ يُرَكَّبُ الْخَلْقُ يَوْمَ الْقِيَامَةِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4935، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4935 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4935، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
