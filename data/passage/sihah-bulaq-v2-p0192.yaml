text: |-
  * ⁦(عين)⁩
  ٢٩٥
  وأماعن مخففة فعناها ماءد االشي تقول رمت عن القوس لانه بهاقدف سه-ممعنه.
  وعداها وأطعمه عن جوع لانه جمل الجوع منصرفابه تاركاك وقد جاوزه وتقع.ن موقعها
  الا أنّ عن قد تكون اسمايد خل عليه حرف جرّ لانك تقول جئت من عن يينه أى من ناحية
  عينه قال القطامى فقلت المركب لما أن علابهم * من عن يمين الحبيا نظوة قبل
  وانمابتيت لمضارعتها للحرف وقد توضع عن موضع بعد كما قال الحرث بن عياد
  قحت حرب وائل عن حبال• أى بعد حيال وقال امر والقيس
  نؤوم الضحى لم تنتعاق عن تفضل * ورعا وضعت موضع على كماقال
  لاه ابن عملا لا أفضلت فى حسب • عنى ولا أنت ديانى قضزونى
  ( عون، العوان النصف فى سنها من كل شئء والجهع عون وفى المشل لاتعلم العوان الهرة
  وتقول منه عوّنت المرأة نعو شاوعانت تعون ءونا والعوان من الحروب التى قوقل فيهامرة
  عدمرة كأنهم جعلوا الا ولى بكرا وبقرةء وان لافارض مسنة ولا بكر صسغيرة بين ذلك
  والعون الظهير على الامر والجمع الاعوان والمعونة الاعانة يقال ماعنسدك معونة ولا معانة
  ولاعون قال الكسائىّ المعون المعونة قال جيل
  بثين الزمى لا انّ لا ان لزمته * على كثرة الواشين أى معون
  يقول نعم العون قولك لا فى ردّ الوشاة وان كنروا وقال الفراء هو جع معونة وليسر فى السكلام
  مفعل بواحدة وقد فسرناه فى مكرم وتول ما أخلانى فلان من معاونه وهوجع معونة ورجل
  معوان كثير المعونة للناس واستعنت بفلان فأعاننى وعاوتنى وفى الدعاءرب أعنى ولا تعن
  لى وتعاون القوم اذا أعان بعضهم بعضاواعتونوا مثله واتماصحت الواولصحتها فى تعاونوا
  لان معناهما واحدفبنى عليه ولولا ذللت لاعتات والمتعاوتة من النساء التى ضعنت فى السنّ
  ولا تكون الامع كثرة اللحم والعانة القطميع من -رالو-س وابلهعءون والعانة شعر الركب
  واستعان فلان-لق عانته وعانه قرية على الفرات تنسب اليها الحرفيقال عانية قال زهبر
  من خرعاتة لما يعد أن عتقا * وربما قالواعانات كما قالواعرفسة وعرفات والقول فى صرف
  عانات كالة ول فى عرفات وأذرعات ⁦(عهن)⁩ العاهن واحد العواهن وهي السعقات
  اللواتى يليز القلبة فى اغسة أهل الحجاز وأما أهل محد قيسه ونماالحوانى ومنه سمى جوارح
  الانسان عواهن والعواهن عروق فى رحم الناقة وقد عهنت عواهن النخل تعهن بالضم أى
  يست ورمى فلان بالكلام على عواهنه اذا لم يبال أصاب أم أخطأ أبو عبيدة العهن الصوف
  والقطعة منه عهنة والجمع عهون وفلان عهن مال اذا كان حسن القيام عليه وأعطاهمن
  عاهن مله وآهنه أى من تلاده والعاهن الحاضر المقيم الثابت قال كثير
  ديارابنة الضمرى اذحبل حبها• متين واذمعروفها لك عاهن
  وعهن بالمكان أقام: (عين العيز حاسة الرؤية وهى. ؤنسة والجمع أعين وعيون
  وأعسان قال يزيد • دلاس كاعيان الجراد المنظم • وتصغيرهاعييفة ومنه قيسل
  دوالمعيينتين لتجاسوس ولاتسل ذو العوينتين والعين عين الماءوعين الركبة ولكل ركبسة
  عينان وهمانة رتان فى مقدمها عند الساق والعين عين الشمس والمين الدينار والعين المال
  قوله قال زهير فى نسيخسة قال
  الاخطل
  من خرعانة يتصاع الفرات لها
  فى جدول صحب الاذى مرّاد
