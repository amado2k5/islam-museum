label: { ar: "الموطأ 470 — سعيد بن المسيب: ما صلاة يُجلس في كل ركعة منها؟ المغرب إذا فاتتك منها ركعة", en: "Muwatta 470", es: "Muwatta 470", fr: "Muwatta 470", ur: "موطا 470", tr: "El-Muvatta 470 — Sa'id ibn el-Musayyab: Hangi namazda her rekatında oturulması gerekir? Akşam namazı, eğer bir rekatını kaçırırsanız.", id: "Al-Muwatta 470 — Sa’id ibn al-Musayyab: Shalat manakah yang mengharuskan duduk di setiap rakaatnya? Shalat Maghrib, jika Anda melewatkan satu rakaatnya." }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب، في باب العمل في جامع الصلاة: سأل سعيد ما الصلاة التي يُجلس في كل ركعة منها، ثم أجاب: هي المغرب إذا فاتتك منها ركعة، وكذلك سنة الصلاة كلها، أي أن المسبوق يجلس مع الإمام ثم يجلس في قضائه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.240}"
  tr: "Malik'in İbn Şihab'tan, o da Sa'id ibn el-Musayyab'dan rivayet ettiği, cemaat namazı sırasındaki davranışlar bölümünde yer alan bir rivayette şöyle denmektedir: Sa'id'e hangi namazda her rekatta oturmak gerektiği sorulmuş ve o şöyle cevap vermiştir: Eğer bir rekatı kaçırırsanız, bu akşam namazıdır; aynı şekilde namazın sünnet namazlarında da oturmak gerekir. Yani geç kalan kişi imamla birlikte oturur ve sonra kaçırdığı rekatı kaza etmek için oturur. Editör, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.240}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Ibn Shihab dari Sa'id ibn al-Musayyab, dalam bab tentang amalan-amalan dalam shalat berjamaah: Sa'id ditanya shalat mana yang mengharuskan duduk di setiap rakaat, dan beliau menjawab: Shalat Maghrib jika Anda melewatkan satu rakaat, dan demikian pula shalat Sunnah secara keseluruhan, artinya orang yang datang terlambat duduk bersama imam dan kemudian duduk untuk mengganti rakaat yang terlewat. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.240}"
