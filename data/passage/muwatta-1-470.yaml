label: { ar: "الموطأ 470 — سعيد بن المسيب: ما صلاة يُجلس في كل ركعة منها؟ المغرب إذا فاتتك منها ركعة", en: "Muwatta 470" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب، في باب العمل في جامع الصلاة: سأل سعيد ما الصلاة التي يُجلس في كل ركعة منها، ثم أجاب: هي المغرب إذا فاتتك منها ركعة، وكذلك سنة الصلاة كلها، أي أن المسبوق يجلس مع الإمام ثم يجلس في قضائه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.240}"
