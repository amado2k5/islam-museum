text: "… يعمل صحيحاً مقيماً. - حدثنا أبو أُسامة عن الوليد بن كثير عن محمد بن عمرو ابن عطاء عن عطاء بن يسار عن أبي سعيد وأبي هريرة: أنهما سمعا رسول اللّٰه وللي يقول: ما يصيب المؤمن من وَصَب، ولا نَصَب، ولا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 2752، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
