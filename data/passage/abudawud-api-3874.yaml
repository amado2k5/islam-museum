label: { ar: "سنن أبي داود 3874 — الدواء، الداء", en: "Sunan Abi Dawud 3874 — the drug; the disease and its remedy", ur: "سنن ابی داؤد 3874 — دوا، بیماری", es: "Sunan Abi Dawud 3874 — El medicamento; la enfermedad y su remedio", fr: "Sunan Abi Dawud 3874 — le médicament; la maladie et son remède", tr: "Sunan Abi Dawud 3874 — Tıp, Hastalık", id: "Sunan Abi Dawud 3874 — Pengobatan, Penyakit" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عَبَادَةَ الْوَاسِطِيُّ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا إِسْمَاعِيلُ بْنُ عَيَّاشٍ، عَنْ ثَعْلَبَةَ بْنِ مُسْلِمٍ، عَنْ أَبِي عِمْرَانَ الأَنْصَارِيِّ، عَنْ أُمِّ الدَّرْدَاءِ، عَنْ أَبِي الدَّرْدَاءِ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ اللَّهَ أَنْزَلَ الدَّاءَ وَالدَّوَاءَ وَجَعَلَ لِكُلِّ دَاءٍ دَوَاءً فَتَدَاوَوْا وَلاَ تَدَاوَوْا بِحَرَامٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3874، يذكر الدواء، والداء، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3874 (Medicine (Kitab Al-Tibb)), that mentions the drug, the disease and its remedy, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3874، جس میں دوا، بیماری، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3874 (Medicina (Kitab Al-Tibb)), menciona el medicamento, la enfermedad y su remedio, así como la búsqueda de tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Sunan Abi Dawud, n° 3874 (Médecine (Kitab Al-Tibb)), mentionne le médicament, la maladie et son remède, ainsi que la recherche d'un traitement. Le Navigateur de Médecine le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et le traitement."
  tr: "Sunan Abi Davud'da yer alan 3874 numaralı hadiste tıp, hastalık ve tedavi konularına değinilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3874, menyebutkan tentang obat-obatan, penyakit, dan pengobatan. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
