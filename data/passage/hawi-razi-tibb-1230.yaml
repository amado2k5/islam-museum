  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 1230. sayfasından bir bölüm; hacamat, hastane ve tıp mesleği, tedavi, vücut parçaları, cerrahi, sünnet ve ateller, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
