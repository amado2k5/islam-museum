text: "… وبثجير حب البان والخل والحلبة والقردمانا والبورق والخل. الثانية من الأخلاط: شرب ماء التفاح والإجاص يعظم الطحال. ضماد الشيطرج يعالج على ما في باب عرق النساء: قال: فإن بقيت العلة على حالها فعلق على الطحال محجمة بشرط. ما بال: الطحال …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1230، يذكر الحجامة، والبيمارستان وصناعة الطب، والعلاج، وأعضاء البدن، والجراحة والختان والجبائر، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1230, that mentions cupping, the hospital and the medical craft, treatment, the organs of the body, surgery, circumcision and splints, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
