text: "… مرض يَعُوقُها عن جِدِّها في سيرها إلى اللَّه والدارِ الآخرة، فإذا أراد بها ربُّها ومالِكُهَا وراحِمُهَا كرامته، نيَّض لها من الابتلاء والامتحانِ ما يكون دواء لذلك المرض العائق عن السيرِ الحثيث إليه، فيكون ذلك البلاء والمحنة بمنزلة الطبيب يسقي العليلَ …"
