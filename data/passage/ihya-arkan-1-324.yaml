text: "… وراء ألم الذم والقصد بالشر، وهو خلق كريم يحدث فى أول الصبامهما أشرق عليه نور العقل فيستحي من الفبائح إذا شوهدت وهو منه وصف محمود إذ قال رسول اللّٰه الحياء خير كله، وقال الحياه شعبة من الإيمان، وقال و الحياء …"
