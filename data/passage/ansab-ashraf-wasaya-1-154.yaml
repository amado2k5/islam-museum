text: "… دوس والأزد، فوثبت دوس عليه ليقتلوه بأبي أزيهر، فسعى حتى دخل بيت امرأة من الأزد، يقال لها أم جميل، واتبعه رجل منهم ليضربه. فوقع ذبابُ السيف على الباب، وقامت في وجوههم فذّبتهم ونادت قومها، فمنعوه لها، فلما استخلف عمر بن …"
