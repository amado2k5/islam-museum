text: "… قال : كان مطرف يقول : هذه آية القراء حدثنا عبد اللّٰه بن محمد بن عطاء قال ثنا أبو اللّٰه بن شيرزاد قال ثنا عبد اللّٰه بن محمد العبى. قال ثنا غندر قال ثنا شعبة عن يزيد الدشك عن مطرف …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 203، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 203, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 203 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 2, pág. 203, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 2, page 203, mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 2. resimli cildinin 203. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 2, halaman 203, yang menyebutkan para qari; dari versi pindaian yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
