label: { ar: "الموطأ 1940 — مالك: في رجل قال لرجل أشتري منك هذه العجوة خمسة عشر صاعا، أو الصيحاني عشرة آصع، أو الحنطة المحمولة خمسة عشر صاعا، أو الشامية عشرة آصع بدينار، وقد وجبت لي إحداهما: إن ذلك مكروه لا يحل، وهو مما نهي عنه من بيعتين في بيعة", en: "Muwatta 1940" }
summary:
  ar: "قال مالك في رجل قال لرجل: أشتري منك هذه العجوة خمسة عشر صاعا، أو الصيحاني عشرة آصع، أو الحنطة المحمولة خمسة عشر صاعا، أو الشامية عشرة آصع، بدينار، قد وجبت لي إحداهما: إن ذلك مكروه لا يحل. وذلك أنه قد أوجب له عشرة آصع صيحانيا، فهو يدعها ويأخذ خمسة عشر صاعا من العجوة، أو تجب عليه خمسة عشر صاعا من الحنطة المحمولة، فيدعها ويأخذ عشرة آصع من الشامية، فهذا أيضا مكروه لا يحل. وهو يشبه ما نهي عنه من بيعتين في بيعة، وهو أيضا مما نهي عنه أن يباع من صنف واحد من الطعام اثنان بواحد. {cite:muwatta-maruf-1997 p.193}"
