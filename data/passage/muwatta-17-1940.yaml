label: { ar: "الموطأ 1940 — مالك: في رجل قال لرجل أشتري منك هذه العجوة خمسة عشر صاعا، أو الصيحاني عشرة آصع، أو الحنطة المحمولة خمسة عشر صاعا، أو الشامية عشرة آصع بدينار، وقد وجبت لي إحداهما: إن ذلك مكروه لا يحل، وهو مما نهي عنه من بيعتين في بيعة", en: "Muwatta 1940", es: "Muwatta 1940", fr: "Muwatta 1940", ur: "موطا 1940", tr: "El-Muvatta 1940 — Malik: Bir kimse bir başkasına, “Senden bir dinara on beş sa’lık Ajwa hurması, ya da on sa’lık Sayhani hurması, ya da on beş sa’lık taşıyıcı buğdayı, ya da on sa’lık Şami buğdayı alacağım ve bunlardan birini almakla yükümlüyüm” derse, bu mekruhtur ve haramdır; ayrıca tek işlemde iki satışın yasaklanması kapsamındadır.", id: "Al-Muwatta 1940 — Malik: Mengenai seorang pria yang berkata kepada orang lain, “Aku akan membeli darimu kurma Ajwa ini, lima belas sa, atau kurma Sayhani, sepuluh sa, atau gandum pengangkut, lima belas sa, atau gandum Shami, sepuluh sa, seharga satu dinar, dan aku wajib membeli salah satunya,” ini adalah perbuatan yang tidak disukai dan tidak diperbolehkan, dan termasuk dalam perbuatan haram membeli dua barang dalam satu transaksi." }
summary:
  ar: "قال مالك في رجل قال لرجل: أشتري منك هذه العجوة خمسة عشر صاعا، أو الصيحاني عشرة آصع، أو الحنطة المحمولة خمسة عشر صاعا، أو الشامية عشرة آصع، بدينار، قد وجبت لي إحداهما: إن ذلك مكروه لا يحل. وذلك أنه قد أوجب له عشرة آصع صيحانيا، فهو يدعها ويأخذ خمسة عشر صاعا من العجوة، أو تجب عليه خمسة عشر صاعا من الحنطة المحمولة، فيدعها ويأخذ عشرة آصع من الشامية، فهذا أيضا مكروه لا يحل. وهو يشبه ما نهي عنه من بيعتين في بيعة، وهو أيضا مما نهي عنه أن يباع من صنف واحد من الطعام اثنان بواحد. {cite:muwatta-maruf-1997 p.193}"
  tr: "Malik, bir başkasına, “Senden bir dinara on beş sa’lık Ajwa hurması, on sa’lık Sayhani hurması, on beş sa’lık limandan buğday veya on sa’lık Şamiye buğdayı alacağım, çünkü bunlardan birini vermekle yükümlüyüm” diyen bir adam hakkında şöyle demiştir: Bu, kınanacak ve caiz değildir. Çünkü o, kendisine on sa’lık Sayhani hurması verme yükümlülüğünü yerine getirmişken, bu yükümlülüğünden vazgeçip on beş sa’lık Ajwa hurması almaktadır. Veya, ona on beş sa’lık limandan buğday verme yükümlülüğü varken, bu yükümlülüğünden vazgeçip on sa’lık Şamiye buğdayı almaktadır. Bu da kınanacak ve caiz değildir. Bu, bir işlemde iki satış yapılmasına ilişkin yasağa benzer; aynı türden iki yiyeceği bir fiyata satmak da yasaktır. {cite:muwatta-maruf-1997 s.193}"
  id: "Malik berkata mengenai seorang pria yang berkata kepada orang lain, “Aku akan membeli darimu lima belas sa’ kurma Ajwa, atau sepuluh sa’ kurma Sayhani, atau lima belas sa’ gandum dari pelabuhan, atau sepuluh sa’ gandum Shamiya, dengan harga satu dinar, karena aku wajib memberikan salah satunya”: Ini tercela dan tidak diperbolehkan. Hal ini karena ia telah berkewajiban untuk memberikan sepuluh sa’ kurma Sayhani, namun ia meninggalkan kewajiban ini dan mengambil lima belas sa’ kurma Ajwa. Atau, ia berkewajiban untuk memberikan lima belas sa’ gandum dari pelabuhan, namun ia meninggalkan kewajiban ini dan mengambil sepuluh sa’ gandum Shamiya. Ini juga tercela dan tidak diperbolehkan. Hal ini serupa dengan apa yang dilarang mengenai dua penjualan dalam satu transaksi, dan juga dilarang menjual dua jenis makanan yang sama dengan harga satu. {cite:muwatta-maruf-1997 p.193}"
