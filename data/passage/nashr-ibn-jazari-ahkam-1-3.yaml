  tr: "İbn el-Cezeri'nin \"On Okuma\" adlı eserinin 1. cildinin 3. sayfasından, küçük günahları anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jazari, \"Sepuluh Bacaan,\" Jilid 1, halaman 3, yang menyebutkan dosa-dosa kecil; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
