text: "… لم يغادر مسألة صغيرة ولا كبيرة مما يتعلق في هذا العلم إلا وشرحها في هذا الكتاب. كما انه جعله معلة كبيرة لحفظة كلام اللّٰه ولمن يريد معرفة تاريخه وآدابه وكتابته وجمعه ومن اشتغل بهذا الفن من العلماء وغير ذلك مما …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 3، يرد فيه ذكر صغائر الذنوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
