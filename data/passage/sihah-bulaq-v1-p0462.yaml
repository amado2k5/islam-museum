text: |-
  ⁦(فصل السين)⁩
  ١٧٩
  وبنى القوم بيوتهم على سجيح واحد وعلى،لبجيدة واحدة أى على قدرواحد ⁦(سحح)⁩
  حدت الماء وغيره أصه سبج اذاصيبدته قال دريد بن الصمة
  فربت غارة أسرعت فيها * كسح الخزر جى جر يم تو
  وسمح الماءيسح نها أى سال من فوق وكذلك المطر والدمع وسحهمائة موط أى جلده
  ومتحابة سحوح وتسخسم الماء أى سال ومعارسحاح أى يسح شديدا وطعنة مسحسحة
  وسحت الشاة نسح بالكسر سحوحا وسحوحة أى سمنت وغتم سحاح أى سمان ولحم
  ساح قال الاصمعى كانه من سمنه يصب الودك وفرس مسح :كسر المسيم كانه يصب
  الجرى صباوالخسح والسصيجة ساحة الدار (سدح السدح الصرء بطحاعلى الوجه
  أوالقاء على الظهرلا يقع قاعداولا متكوّراتول سد -ه فانسدح فهو مسدوح وبديح
  قال الشاعر بين الاراكوبين النخل تسدحهم * زرق الاسنة فى أطرافها شيم
  ورواه المفضلى تشدخهم فقال له الاصمى صارت الاسنة كافر كوبات تشدخ الرؤس واما
  هو تسدحهم وفلان سادح أى مخصب رح لسرح المال السائم تول أرحت الماشية
  انفشتها واسمتهاواهملتها ومزحتهاسرحاهسده وحدهابلاآلف ومنهقوله تعالى وحر
  سيرحون وسرحت هى بنفسهاسر وحا يتعدّى ولا يتعبدى تقول.رحت بالغداة وراح
  بالعشى يقال ماله سارحة ولا رائحة أى شئء وسرحت فلانا الى موضع كذا اذا أرسلته
  وتسريح المرأة تطليها والاسم السراح مثل التبليغ والبلاغ وفى الثل السراح من النجاح
  أى اذالم تقدر على قضاء حاجة الرجل فايسته فان ذلك عنده بمنزلة الإسعاف وتسريح الشع,
  ارساله و-له قبل المشط والتسريح النسهيل وفرس سريمح أىء رى وخيل سرح وناقه سرح
  ومنسرحة أى سريمة قال الاصعى ملاط سرح الجنب المنسرح للذهاب والمجى ومشية
  سرح مثل سجح أى سهلة والمنسرح الخارج من فيا به وا نسرح جنس من العروض وانسرح
  الرجل اذا استلقى وفرّج رجليه والسرح شجر عظام طوال الواحدة سرحة يقال هى الاة
  على وزن العاع وأماقول جيد
  أبى اللّه الا أنّ سرحة مالك * على كل أفنان العضاه تروق
  فانما كتى بها عن أمرأة وسرحسة فى قول لبيد
  وضح والوياح العوبسل والسرياح الجراد واتمسرياح امرأة قالرانة فاظيال اسم
  اذا أمّ مرياح غدت فى ظعائن * جوالس فجدافاضت العين تدمع
  والسريحة واحدة السرح والسرائح وهى السيور التى يخصف بها والسرحان الذتب وهذيل
  نسمى الاسد سرحاناوفى المثل سقط العشاءبه على سرحان قال سيبويه النون زائدة وه وفعلان
  والجمع سراحين قال المكسائى الاتى سرحانة ⁦(سردح)⁩ السرداح مكان لين ينبت النجم
  والنصىّ والسرداح الذاق: الكثيرة اللحم وقال الفرّاء العظيمة ⁦( طح)⁩ السطح مغروف
  وهو من كل شى أعلاه وسطح اللّٰه الارض سطح ابسطها وتسطيح القبر خلاف تسنيمه وأنف
  مسطح منبسط جدّا والسطيحة والسطيح المزادة والسطابح الاستلقى على قفاه من الزمانة رسطيح
  كاهن بنى ذئب يقال كان لاعظم فيه سوى رأسه وانسطح الرجل امتد على قفاه ولم يتحرّك
