text: "حَدَّثَنَا أَحْمَدُ بْنُ صَالِحٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي عَمْرٌو، عَنْ بُكَيْرِ بْنِ الأَشَجِّ، عَنِ الْحَسَنِ بْنِ عَلِيِّ بْنِ أَبِي رَافِعٍ، أَنَّ أَبَا رَافِعٍ، أَخْبَرَهُ قَالَ بَعَثَتْنِي قُرَيْشٌ إِلَى رَسُولِ اللَّهِ فَلَمَّا رَأَيْتُ رَسُولَ اللَّهِ أُلْقِيَ فِي قَلْبِيَ الإِسْلاَمُ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنِّي وَاللَّهِ لاَ أَرْجِعُ إِلَيْهِمْ أَبَدًا فَقَالَ رَسُولُ اللَّهِ \" إِنِّي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2758، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2758 (Jihad (Kitab Al-Jihad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 2758، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
