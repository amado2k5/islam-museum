text: "… بأنواع الصدقات ويُظْهرون السرور ويزيدون في المبرّات ويَعْتنون بقراءة مولده الكريم ويظهر عليهم من بركاته كل فضل عميم. انتهى. وقال الإِمام الحافظ أبو الخير بن الجزَرِيّ - تعالى - شيخ القُرَاء: من خواصه أَنه أَمانٌ في ذلك العام ويُشْرى عاجلة …"
