label: { ar: "الموطأ 1869 — يحيى عن مالك عن يحيى بن سعيد: سمع جميل بن عبد الرحمن المؤذن يقول لسعيد بن المسيب إنه يبتاع من الأرزاق التي تعطى الناس بالجار ثم يبيع الطعام المضمون عليه إلى أجل، فنهاه سعيد", en: "Muwatta 1869" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع جميل بن عبد الرحمن المؤذن يقول لسعيد بن المسيب: إني رجل أبتاع من الأرزاق التي تعطى الناس بالجار ما شاء الله، ثم أريد أن أبيع الطعام المضمون علي إلى أجل. فقال له سعيد: أتريد أن توفيهم من تلك الأرزاق التي ابتعت؟ قال: نعم. فنهاه عن ذلك. {cite:muwatta-maruf-1997 p.169}"
