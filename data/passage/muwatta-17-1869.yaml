label: { ar: "الموطأ 1869 — يحيى عن مالك عن يحيى بن سعيد: سمع جميل بن عبد الرحمن المؤذن يقول لسعيد بن المسيب إنه يبتاع من الأرزاق التي تعطى الناس بالجار ثم يبيع الطعام المضمون عليه إلى أجل، فنهاه سعيد", en: "Muwatta 1869", es: "Muwatta 1869", fr: "Muwatta 1869", ur: "موطا 1869", tr: "El-Muvatta 1869 — Yahya, Malik'ten, o da Yahya ibn Said'den rivayetle: Müezzin Cemil ibn Abdülrahman'ın Said ibn el-Musayyab'a, komşunun insanlara verdiği erzakları satın alıp, garantili yiyecekleri kredili olarak sattığını söylediğini işitti. Bunun üzerine Said, Said'in bunu yapmasını yasakladı.", id: "Al-Muwatta 1869 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Yahya bin Saeed: Ia mendengar Jamil bin Abd al-Rahman, muazin, berkata kepada Saeed bin al-Musayyab bahwa ia membeli bahan makanan yang diberikan tetangga kepada orang-orang, kemudian menjual makanan yang terjamin itu secara kredit, maka Saeed melarangnya melakukan hal itu." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع جميل بن عبد الرحمن المؤذن يقول لسعيد بن المسيب: إني رجل أبتاع من الأرزاق التي تعطى الناس بالجار ما شاء الله، ثم أريد أن أبيع الطعام المضمون علي إلى أجل. فقال له سعيد: أتريد أن توفيهم من تلك الأرزاق التي ابتعت؟ قال: نعم. فنهاه عن ذلك. {cite:muwatta-maruf-1997 p.169}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet eder ki, müezzin Cemil ibn Abdülrahman'ın Sa'id ibn el-Musayyab'a şöyle dediğini işitmiştir: \"Ben, Allah'ın dilediği kadar komşulara verilen erzaklardan satın alan biriyim, sonra da teslimi garantili olan yiyecekleri kredili olarak satmak istiyorum.\" Sa'id ona, \"Onlara satın aldığın bu erzaklardan mı ödemek istiyorsun?\" diye sordu. Adam, \"Evet\" dedi. Bunun üzerine Sa'id ona bunu yapmasını yasakladı. {cite:muwatta-maruf-1997 s.169}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, bahwa ia mendengar Jamil ibn Abd al-Rahman, seorang muazin, berkata kepada Sa'id ibn al-Musayyab: \"Saya adalah orang yang membeli dari rezeki yang diberikan orang kepada tetangga sebanyak yang dikehendaki Allah, kemudian saya ingin menjual makanan yang dijamin akan saya antarkan secara kredit.\" Sa'id berkata kepadanya: \"Apakah kamu ingin membayarnya dari rezeki yang kamu beli?\" Ia menjawab: \"Ya.\" Maka ia melarangnya melakukan hal itu. {cite:muwatta-maruf-1997 p.169}"
