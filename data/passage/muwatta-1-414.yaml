label: { ar: "الموطأ 414 — أنس يصلي على حمار في السفر إلى غير القبلة يومئ إيماء", en: "Muwatta 414" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب صلاة النافلة في السفر: رأى أنس بن مالك في السفر يصلي على حمار متوجهاً إلى غير القبلة، يركع ويسجد إيماءً من غير أن يضع وجهه على شيء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن النسائي أخرج من طريق يحيى بن سعيد عن أنس أنه رأى النبي يصلي على حماره وهو راكب إلى خيبر والقبلة خلفه بإسناد حسن، وأن في الصحيحين من حديث أنس بن سيرين أنه رأى أنساً يصلي على حمار لغير القبلة فقال: لولا أني رأيت رسول الله فعله لم أفعله. {cite:muwatta-maruf-1997 p.216}"
