label: { ar: "الموطأ 414 — أنس يصلي على حمار في السفر إلى غير القبلة يومئ إيماء", en: "Muwatta 414", es: "Muwatta 414", fr: "Muwatta 414", ur: "موطا 414", tr: "Al-Muwatta 414 — Enes, yolculuk halindeyken eşeğe binmiş, kıble yönünden başka bir yöne dönerek ve başıyla işaret ederek namaz kıldı.", id: "Al-Muwatta 414 — Anas shalat di atas seekor keledai sambil berjalan menghadap arah selain kiblat, sambil memberi isyarat dengan kepalanya." }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب صلاة النافلة في السفر: رأى أنس بن مالك في السفر يصلي على حمار متوجهاً إلى غير القبلة، يركع ويسجد إيماءً من غير أن يضع وجهه على شيء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن النسائي أخرج من طريق يحيى بن سعيد عن أنس أنه رأى النبي يصلي على حماره وهو راكب إلى خيبر والقبلة خلفه بإسناد حسن، وأن في الصحيحين من حديث أنس بن سيرين أنه رأى أنساً يصلي على حمار لغير القبلة فقال: لولا أني رأيت رسول الله فعله لم أفعله. {cite:muwatta-maruf-1997 p.216}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği, yolculuk halindeyken yapılan gönüllü namazlar bölümünde yer alan bir rivayette şöyle denmektedir: Enes ibn Malik'in, eşek üzerinde yolculuk ederken, kıbleden başka bir yöne dönerek, yüzünü hiçbir şeye değdirmeden, işaretlerle rükû ve secde yaparak namaz kıldığı görülmüştür. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn Hasan tarafından nakledildiğini ve Nesai'nin de Yahya ibn Sa'id'den Enes'e dayanan isnad zinciriyle, Peygamber'in Hayber'e giderken eşek üzerinde, kıbleyi arkasında tutarak namaz kıldığını gördüğünü, sahih bir isnad zinciriyle aktardığını belirtmektedir. Ayrıca, iki sahih hadiste (Buhari ve Müslim) Enes ibn Sirin'in hadisinde de, Enes'in eşek üzerinde kıbleden başka bir yöne dönerek namaz kıldığını gördüğü ve \"Eğer Allah Resulü'nün bunu yaptığını görmeseydim, ben yapmazdım\" dediği rivayet edilmektedir. {cite:muwatta-maruf-1997 s.216}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id, dalam surah tentang salat sunnah saat bepergian: Anas ibn Malik terlihat salat sambil bepergian di atas keledai, menghadap ke arah selain kiblat, rukuk dan sujud dengan gerakan tanpa meletakkan wajahnya pada apa pun. Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan, dan bahwa al-Nasa'i menyertakan, melalui sanad Yahya ibn Sa'id atas otoritas Anas, bahwa ia melihat Nabi salat di atas keledainya saat menuju Khaybar, dengan kiblat di belakangnya, dengan sanad yang sahih. Hal ini juga ditemukan dalam dua kitab Sahih (Bukhari dan Muslim) dalam hadits Anas ibn Sirin bahwa ia melihat Anas salat di atas keledai menghadap ke arah selain kiblat, dan ia berkata: \"Jika aku tidak melihat Rasulullah melakukannya, aku tidak akan melakukannya.\" {mengutip:muwatta-maruf-1997 hal.216}"
