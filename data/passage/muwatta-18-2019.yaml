label: { ar: "الموطأ 2019 — مالك: لا يجوز للذي يأخذ المال قراضا أن يشترط أن يعمل فيه سنين لا ينزع منه، ولا يصلح لصاحب المال أن يشترط أنك لا ترده إلي سنين لأجل يسمياه، لأن القراض لا يكون إلى أجل", en: "Muwatta 2019", es: "Muwatta 2019", fr: "Muwatta 2019", ur: "موطا 2019", tr: "Al-Muwatta 2019 — Malik: Borç alan kişinin, o parayla yıllarca çalışıp geri almamayı şart koşması caiz değildir; aynı şekilde, borç alan kişinin de, parayı belirli bir süre boyunca geri ödemeyeceğini şart koşması caiz değildir. Çünkü borç, belirli bir süre için verilemez.", id: "Al-Muwatta 2019 — Malik: Tidak diperbolehkan bagi orang yang mengambil uang sebagai pinjaman untuk menetapkan syarat bahwa ia harus mengolah uang tersebut selama bertahun-tahun tanpa uang itu diambil darinya, dan tidak pula diperbolehkan bagi pemilik uang untuk menetapkan syarat bahwa Anda tidak akan mengembalikannya kepadanya selama bertahun-tahun untuk jangka waktu yang mereka tentukan, karena pinjaman tidak dapat berjangka waktu tetap." }
summary:
  ar: "قال مالك: لا يجوز للذي يأخذ المال قراضا أن يشترط أن يعمل فيه سنين لا ينزع منه. قال: ولا يصلح لصاحب المال أن يشترط أنك لا ترده إلي سنين، لأجل يسمياه؛ لأن القراض لا يكون إلى أجل. ولكن يدفع رب المال ماله إلى الذي يعمل له فيه، فإن بدا لأحدهما أن يترك ذلك، والمال ناض لم يشتر به شيئا، تركه، وأخذ صاحب المال ماله. وإن بدا لرب المال أن يقبضه بعد أن يشتري به سلعة، فليس ذلك له، حتى يباع المتاع ويصير عينا. فإن بدا للعامل أن يرده، وهو عرض، لم يكن ذلك له، حتى يبيعه، فيرده عينا كما أخذه. {cite:muwatta-maruf-1997 p.225} {cite:muwatta-maruf-1997 p.226}"
  tr: "Malik şöyle dedi: Kâr paylaşımı anlaşması için para alan kimsenin, o parayı yıllarca geri almadan çalışmayı şart koşması caiz değildir. Aynı şekilde, para sahibinin de, belirli bir süre için, yıllarca bana geri vermeyeceğini şart koşması caiz değildir; çünkü kâr paylaşımı anlaşması belirli bir süre için değildir. Aksine, para sahibi parasını onunla çalışan kişiye verir. Eğer ikisinden biri anlaşmayı terk etmeye karar verirse ve para hala mevcutsa ve onunla hiçbir şey satın alınmamışsa, o zaman anlaşmayı terk edebilir ve para sahibi parasını geri alır. Eğer para sahibi, onunla mal satın aldıktan sonra parayı geri almaya karar verirse, mal satılıp somut hale gelene kadar bunu yapmaya hakkı yoktur. Eğer işçi, para henüz mal halindeyken onu geri vermeye karar verirse, onu satıp somut bir mal olarak, aldığı gibi geri vermeden önce bunu yapmaya hakkı yoktur. {cite:muwatta-maruf-1997 s.225} {cite:muwatta-maruf-1997 s.226}"
  id: "Malik berkata: Tidak diperbolehkan bagi orang yang menerima uang untuk perjanjian bagi hasil untuk menetapkan bahwa ia harus menggunakannya selama bertahun-tahun tanpa mengambilnya kembali. Ia berkata: Juga tidak diperbolehkan bagi pemilik uang untuk menetapkan bahwa Anda tidak akan mengembalikannya kepada saya selama bertahun-tahun, untuk jangka waktu tertentu, karena perjanjian bagi hasil bukanlah untuk jangka waktu tetap. Sebaliknya, pemilik uang memberikan uangnya kepada orang yang menggunakannya. Jika salah satu dari mereka memutuskan untuk meninggalkan perjanjian tersebut, dan uang itu masih tersedia dan belum ada yang dibeli dengannya, maka ia boleh meninggalkannya, dan pemilik uang mengambil kembali uangnya. Jika pemilik uang memutuskan untuk mengambilnya kembali setelah membeli barang dengannya, ia tidak berhak melakukannya sampai barang tersebut terjual dan menjadi barang berwujud. Jika pekerja memutuskan untuk mengembalikannya saat masih berupa barang dagangan, ia tidak berhak melakukannya sampai ia menjualnya dan mengembalikannya sebagai barang berwujud, seperti saat ia menerimanya. {kutip:muwatta-maruf-1997 hal.225} {kutip:muwatta-maruf-1997 hal.226}"
