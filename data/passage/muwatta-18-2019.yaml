label: { ar: "الموطأ 2019 — مالك: لا يجوز للذي يأخذ المال قراضا أن يشترط أن يعمل فيه سنين لا ينزع منه، ولا يصلح لصاحب المال أن يشترط أنك لا ترده إلي سنين لأجل يسمياه، لأن القراض لا يكون إلى أجل", en: "Muwatta 2019" }
summary:
  ar: "قال مالك: لا يجوز للذي يأخذ المال قراضا أن يشترط أن يعمل فيه سنين لا ينزع منه. قال: ولا يصلح لصاحب المال أن يشترط أنك لا ترده إلي سنين، لأجل يسمياه؛ لأن القراض لا يكون إلى أجل. ولكن يدفع رب المال ماله إلى الذي يعمل له فيه، فإن بدا لأحدهما أن يترك ذلك، والمال ناض لم يشتر به شيئا، تركه، وأخذ صاحب المال ماله. وإن بدا لرب المال أن يقبضه بعد أن يشتري به سلعة، فليس ذلك له، حتى يباع المتاع ويصير عينا. فإن بدا للعامل أن يرده، وهو عرض، لم يكن ذلك له، حتى يبيعه، فيرده عينا كما أخذه. {cite:muwatta-maruf-1997 p.225} {cite:muwatta-maruf-1997 p.226}"
