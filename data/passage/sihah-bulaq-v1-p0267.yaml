text: |-
  ٣٧٤
  .كاييلكم وموازينكم وهوفاعلوا من العيار ولا تقل عبروا والمعيار العصارو بنات معير
  الدواهى والعبرانة الناقة تشبه بالعبر فى سرعتها ونشاطها والعير بالكسر الابل الف تحمل المبرة
  ويجوز أن تجمعه على عيرات
  صل الغسين بر الغباد والغبرة واحدوالغبرة لون الاغبر وهو شبيه بالغبار
  قداغرّ الشاغبرارا والغيراء الارض والغبراءضرب من النبات وبنواءيراء الذى ق
  نعرطرفة المحاويج والوطأة الغبراء الدارسة وهى مثل الوطأة السوداء والغبراء اسم فرس
  قيس بن زهير العبسى والغبيراء بالمدمعروف والغبيراء أيضاشراب تخذه الحيس مسكر من
  الذرة وفى المحديث اياكم والغبيراء فانهاخر العالم والغبربقية اللبن فى الضرع يقال بها غبر من
  لبن أى بالنساقة والجمع أغبار وغبرالحيض بقاياه قال أبو كبير الهذلى واسمه عامى بن الحليس
  ومبرأ من كل غبر حيضة • وفساد مرضعة وداء مغيل ومبرأ معطوف على قوله
  ولقد سريت على الظلام بمغشم • جلد من الفتدان غير مثقل
  وغبر المرض أيضا بقاياه وكذلك غبر الليل وغبر الشي يغبر أى بقى والغابر الباقى والغابر الماضى
  وهو من الاضدادوغبر الجرح بالكسر بغبر غبرا اندمل عسلى فساد ثم ينتقض بعدذلكْ ومنه
  عى العرق الغبر بكسر الباء لانه لا يزال ينتقض وداهية الغبر بالتحريك هى العظيمة التى
  لا يمتدى لها قال الحرمازى يدح المنذر
  أنت اها منذرمن بين البشر • داهية الدهر وصماء الغبر
  يريديا مغذروأغبر الرجل فى طلب الحاجة اذاجد فى طلبها عن ابن السكيت وأغيرت السماء
  اذا جد وقعها واشتد قال وأغيرت أى أثرت الغباروكذلك غسبرت تغبيرا وتغبرت من المرأة
  ولداوتزوج رجل امرأة كبيرة فقيل هه فى ذلك فقال لعلى أتغبر منها ولدافلما ولدله سماه غبر
  بن غنم مثال عر⁦(غنر)⁩ الاغثر قرب من الاغبر ويسمى الطحلب أغنر والغثرة غيرة الى خضرة
  والغثراء والغثرسة لة الناس الواحد أغثر مثل أحر وحر وأسود وسود وكذلك الغيثرة
  وفى الحديث رعاع غثرة هكذ ايروى وترى أنّ أصله غينرة حذفت منه الياء وقولهم كانت بين
  القوم غيئرة شديدة قال ابن الاعرابى هى مداوسة القوم بعضهم بعضا فى القتال والمغتوراغة
  فى المغفوروهوشى يتضحه العرفط والرمث مثل الصمغ وهو -لو كالع_ل يؤكل وربعاسال
  اشاه على الثرى مثل الدبس ولدريح كريهة والمغتر بكسر الميم لغة فيمحكاها يعقوب
  ⁦( غثمر )⁩ المغثمر الثوب الخشن الردى النسج قال الراجز
  عمدا كسرت مرهبامغمرا * ولوأشاء حكه محبرا
  يقول ألبسته المغثمر لاد فع بهعنه العين ومرهب اسم ولده ( در الغدرترك الوفاء
  وقد غدر به فهو غادروغدرأيضارأ كثر مايستعمل حذا فى التداء بالشتم يقال باغدروفى
  المديت با غدرألست أسعى فى غدرتك ويقال فى الجمع يال غدر وغدرت الليلة بالكم
  تغدر غدرا أى أظلت فهى غدرة وأغدرت فهى مغدرة وغ_درت الناقة أيضاعن الابل
  والشاة عن الغنم اذا تخلفت عنهافان تركها الراحى فهى غديرة وقد أغدرها قال الراجز
  فقل
