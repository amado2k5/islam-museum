text: "… غير منقاد فى الباطن وقد يكون صادقا فى الباطن غير منقاد فى الظاهر. وقال الخطابى أيضا فى قول النبى الايمان بضع وسبعون شعبة فى هذا الحديث بيان أن الايمان الشرعى اسم لمعنى ذى شعب وأجزاء له أدنى وأعلى والاسم يتعلق …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 2، ص 145، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 2, p. 145, that mentions faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 2، ص 145 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
