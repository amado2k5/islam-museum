text: "… كان المسح على الجبائر يضره أنه يسقط عنه المسح؛ لأن الغسل يسقط بالعذر فالمسح أولى. وأما إذا كان لا يضر، فقد حقق بعض مشايخنا الاختلاف، فقال عَلَى قول أبي حنيفة : المسح على الجبائر مستحب وليس بواجب. وهكذا ذكر قول …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 152، يرد فيه ذكر الواجب، والمستحب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 152, whose wording mentions the obligatory (wajib), the recommended (mustahabb), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 152 کا اقتباس جس میں واجب، مستحب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
