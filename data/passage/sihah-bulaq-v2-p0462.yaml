text: |-
  ⁦(باب القاف)⁩
  وسق
  ١٢٥
  ربع العشر ويجمع على رقين مثل ارة وارين ومنه قولهم انّ الرقين تغطى أفن الافين وتقول
  فى الرفع هذه الرقون وفى الورق ثلاث لغات حكاهن الفراء ورق وورق وورق مثل ك.دوكد
  وكبد وكلة وكلمة وكلمة لان فيهم من ينقل كسرة الراء الى الواوبعد التخفيف ومنهم من يتركها على
  حالها ورجل وراق وهوالذى يورّق ويكتب وورّاق أيضا كثير الدراهم قال الراجز
  جارية من ساكف العسراق * تأكل من كيس امرى ورّاق
  قال ابن الاعرابة أى كشير الورق والمال والورق من أوراق الشجر والكتاب الواحدة
  ورقة وشجرة ورقسة وور يقة أى كثيرة الأوراق وأمًا الوراق بالفتح فخضرة الارض من
  الحشيش وليس من الورق قال أوس يصف جيشا بالكثرة
  كان جيادهن برعن قفّ • جرادقد أطاع له الوراق
  ويروى برءن زمّ ويقال ورقت الشجرة أرقها ورقا اذا أخذت ورقها وأورق الشجر أى
  خرج ورقه قال الاصمى" بقال ورق انشجر وأورق والالف أكثر وورّق توريقا مثله
  والوارقة الشجرة اللحضراء الورق الحسنته وأورق الرجل أى كثر ماله وأورق الصائداذ الم يصد
  وأورق الغازى اذ الم يغتم وأورق الطالب اذ الم يتل والورق ما استدار من الدم على الارض
  قال آبو عسدة أوله ورق وهو مثل الرس والبصيرة مثل فرسن البعير والجدية أعظم من دلات
  والاسباءة فى طول الرمح والمع الاسابىّ قال أبويوسف ورق القوم أحدائهم قال الشاءر(
  بصف قوماق طعوامغازة
  اذاورق الفسان صاروا كأنهم • دراهم منها جائزات وزيف
  ويروى وزائف والورق أيضا المال من دراهم وابل وغير ذلك ومنه قول العجاج
  ايالأدعوفتقبل ملق • واغفر خاياى وغرورقى
  وية-ل فى التوس ورقة بالتسكين أى عيب وهومخرج الغصن اذا كان خفيا قال الاسمعى
  الاورق من الابل الذى فى لونه ساضِ الى سواد وهو أطيب الابل لجما وليس بحمود عندهم
  فى عمل وسيره ومنه قيل للرماد أورق والحمامة والذئبة ورقاء قال رؤية
  فلا نكونى يا ابنة الاشم * ورقاءدمى ذبها المدتى
  وقال أبوذ يدهو الذى يضرب لونه الى الخضرة وقواهسم جاءنا بأمّ الربيق عسلى اريق قال
  الاصمى تزعم العرب أنه من قول رجل رأى الغول على جحل أورق كانه أرادوريقاتسغير
  أورق فقلب الواوألفا مشل أقت ووقت وعام أورق لامطرفيه والجع ورق وورقا اسم
  رجل والمع وراق ووراقى مثل محار وصحارى ونبوا اليه ورقاوى أبدلوامن همزة
  التأنيت واوا . وفلان بن مورق بالنتح وهوشاذ مثل موحد ⁦( وسق )⁩ الو-ق مصدروسقت
  الشئ بمعته وحلته ومنه قوله تعالى والليل وما وسق قال ضابئ ئبن الحرث البرجىّ
  فانى واياكم وشبوها اليكم • كتابض ماءلم نسقه أنامله
  يقول ليس فى يدى من ذلك شئ كما أنه ليس فى يد القابض على المامشئ فاذا جلل الليل الجبال
  والاشجار والبحار والارض فاجتمعت له نقدوسقبها والوسق الطرد ومنه سميت الوسيقة وهى
  من الابل كالرفقة من الناس فاذ اسرقت طردت معاقال الشاعر• كماقاف آثار الوسيقة قائف
  ٢٢
  صاج
  قوله من كيس امرئ فى سنخة
  كسب اه معه
  قوله بالفتح يعنى كسماب كما
  فى القاموس اه مصحه
  ١ ف نسخة زيادة هسدية بن
  الخشرم اه
  قوله خطاياى فى نسخة خطياتى
  قوله وفلان بن مورق عبارة
  القاموس ومورق كفعدمالت
  الروم ووالدطريف المدنى
  المحدّث ولا تظير لهاسوى موكل
  وموزن وموهب وموطب
  ودرحد اه
