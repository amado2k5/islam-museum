text: "… - إذ أنا بهاتف يصرخ بصوت صَحِل، رُفَيدة حتى أعوده من قريب - وكانت امرأة من يقول: يا معشر قريش، إن هذا النبي مبعوث، قد أظلتكم أيامه، وهذا إبَّان نجومه، فحيَّ هَلاَ بالحيا أسلم، في مسجده، فكانت تداوي الجرحى، وتحتسب …"
summary:
