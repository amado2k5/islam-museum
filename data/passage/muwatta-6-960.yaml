label: { ar: "الموطأ 960 — مالك: وإنما يهل أهل مكة وغيرهم بالحج إذا كانوا بها، ومن كان مقيماً بمكة من غير أهلها من جوف مكة لا يخرج من الحرم", en: "Muwatta 960", es: "Muwatta 960", fr: "Muwatta 960", ur: "موطا 960", tr: "El-Muvatta 960 — Malik: Mekke halkı ve diğerleri, ancak Mekke'de bulundukları takdirde Hac için ihram haline girerler. Mekke'de ikamet eden, ancak Mekke halkından olmayan kimse ise Mekke'nin iç kesimlerinde kutsal alandan ayrılmaz.", id: "Al-Muwatta 960 — Malik: Penduduk Mekah dan lainnya hanya memasuki keadaan ihram untuk haji jika mereka berada di Mekah. Dan barang siapa yang tinggal di Mekah tetapi bukan dari penduduknya, di dalam wilayah Mekah, tidak meninggalkan tempat suci." }
summary:
  ar: "قول يرويه يحيى عن مالك: وإنما يهل أهل مكة وغيرهم بالحج إذا كانوا بها، ومن كان مقيماً بمكة من غير أهلها من جوف مكة لا يخرج من الحرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1085) وسويد (500). {cite:muwatta-maruf-1997 p.456} {cite:muwatta-maruf-1997 p.457}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Mekke halkı ve diğerleri, Hac için ihram haline ancak Mekke'de bulunduklarında girerler. Mekke'de ikamet eden, aslen Mekke'li olmayan, ancak şehir sınırları içinde yaşayanlar Haram'dan (kutsal alandan) ayrılmazlar. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1085) ve Suveyd (500) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.456} {cite:muwatta-maruf-1997 s.457}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Penduduk Mekah dan lainnya memasuki keadaan ihram untuk haji hanya ketika mereka berada di Mekah. Mereka yang tinggal di Mekah yang bukan berasal dari Mekah, tetapi tinggal di dalam batas kota, tidak meninggalkan Haram (tempat suci). Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1085) dan Suwaid (500). {cite:muwatta-maruf-1997 p.456} {cite:muwatta-maruf-1997 p.457}"
