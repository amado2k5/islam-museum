summary:
  ar: "كتاب النذور والأيمان، الكتاب الثامن من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 36 نصاً (1351–1386) في تسعة أبواب، من الصفحة 605 إلى الصفحة 618 من ملف PDF المجلد الأول. يبدأ بالنذر في المشي وما يجب منه، ثم ما لا يجوز من النذور في معصية الله، ثم اللغو والعقد والتوكيد في الأيمان، وكفارتها، ويختم بجامع الأيمان وحديث أبي لبابة. {cite:muwatta-maruf-1997 p.605} {cite:muwatta-maruf-1997 p.617}"
  en: "The Book of Vows and Oaths, eighth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 36 reports (1351–1386) in nine babs, PDF pp. 605–618 of volume 1, from walking as a vow to the expiation of oaths and the story of Abu Lubaba."
