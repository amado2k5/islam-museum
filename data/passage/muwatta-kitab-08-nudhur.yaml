summary:
  ar: "كتاب النذور والأيمان، الكتاب الثامن من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 36 نصاً (1351–1386) في تسعة أبواب، من الصفحة 605 إلى الصفحة 618 من ملف PDF المجلد الأول. يبدأ بالنذر في المشي وما يجب منه، ثم ما لا يجوز من النذور في معصية الله، ثم اللغو والعقد والتوكيد في الأيمان، وكفارتها، ويختم بجامع الأيمان وحديث أبي لبابة. {cite:muwatta-maruf-1997 p.605} {cite:muwatta-maruf-1997 p.617}"
  en: "The Book of Vows and Oaths, eighth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 36 reports (1351–1386) in nine babs, PDF pp. 605–618 of volume 1, from walking as a vow to the expiation of oaths and the story of Abu Lubaba."
  es: "El Libro de los Votos y Juramentos, octavo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 36 informes (1351–1386) en nueve babs, PDF pp. 605–618 del volumen 1, desde caminar como un voto hasta la expiación de juramentos y la historia de Abu Lubaba."
  fr: "Le Livre des Vœux et des Serments, huitième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 36 rapports (1351–1386) dans neuf babs, PDF pp. 605–618 du volume 1, de la marche comme vœu à l'expiation des serments et l'histoire d'Abu Lubaba."
  ur: "نذروں اور قسموں کی کتاب، یحییٰ بن یحییٰ کی تجدید میں موطا کی آٹھویں کتاب ⁦(ایڈ. معارف 1997)⁩: نو باب میں 36 رپورٹیں (1351–1386) جلد 1 کی پی ڈی ایف صفحہ 605-618، ابواب کی نذر کے طور پر چلنے سے لے کر کفارہ کی کہانی تک۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği, Beşar Awad Maruf'un (1997) baskısında yer alan, Al-Muwatta'nın sekizinci kitabı olan Yeminler ve Adaklar Kitabı: 1. Cilt PDF dosyasının 605. sayfasından 618. sayfasına kadar dokuz bölümden oluşan 36 metin (1351-1386 Hicri). Yürümeye ilişkin adaklar ve bunlarda farz olanlarla başlar, ardından Allah'a itaatsizlik içeren adaklarda caiz olmayanlar, sonra boş, bağlayıcı ve vurgulu yeminler ve bunların kefareti ele alınır ve yeminler ve Ebu Lubaba hadisi üzerine kapsamlı bir bölümle sona erer. {cite:muwatta-maruf-1997 s.605} {cite:muwatta-maruf-1997 s.617}"
  id: "Kitab Sumpah dan Janji, kitab kedelapan Al-Muwatta, sebagaimana diriwayatkan oleh Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997): 36 teks (1351–1386 H) dalam sembilan bab, dari halaman 605 hingga halaman 618 dari file PDF Volume 1. Kitab ini dimulai dengan sumpah mengenai berjalan dan apa yang wajib di dalamnya, kemudian apa yang tidak diperbolehkan dalam sumpah yang melibatkan ketidaktaatan kepada Tuhan, kemudian sumpah yang sia-sia, mengikat, dan tegas, serta penebusannya, dan diakhiri dengan bagian komprehensif tentang sumpah dan hadits Abu Lubaba. {cite:muwatta-maruf-1997 p.605} {cite:muwatta-maruf-1997 p.617}"
