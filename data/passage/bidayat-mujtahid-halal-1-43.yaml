text: "… حَرَامٌ، وَإِنْ كَانَ يُحْتَمَلُ أَنْ يُرَادَ بِهِ الْقَدْرُ الْمُسْكِرُ لَا الْجِنْسُ الْمُسْكِرُ، فَإِنَّ ظُهُورَهُ فِي تَعْلِيقِ التَّحْرِيمِ بِالْجِنْسِ أَغْلَبُ عَلَى الظَّنِّ مِنْ تَعْلِيقِهِ بِالْقَدْرِ؛ لِمَكَانِ مُعَارَضَةِ ذَلِكَ الْقِيَاسِ لَهُ، عَلَى مَا تَأَوَّلَهُ عليه الْكُوفِيُّونَ، فَإِنَّهُ لَا يَبْعُدُ أَنْ يُحَرِّمَ الشَّارعُ …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 43، يذكر الحرام، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
