label: { ar: "الموطأ 1522 — زيد بن ثابت: سئل عن رجل تزوج امرأة ثم فارقها قبل أن يصيبها هل تحل له أمها، فقال لا، الأم مبهمة ليس فيها شرط، وإنما الشرط في الربائب", en: "Muwatta 1522", es: "Muwatta 1522", fr: "Muwatta 1522", ur: "موطا 1522", tr: "El-Muvatta 1522 — Zeyd ibn Sabit: Ona, bir kadınla evlenip evliliği tamamlamadan önce boşanan bir adam hakkında soru soruldu. Bu adamın kadının annesiyle evlenmesi caiz midir? Şöyle dedi: Hayır, anne belirtilmemiştir ve onunla ilgili bir şart yoktur. Şart sadece üvey kızlar için geçerlidir.", id: "Al-Muwatta 1522 — Zayd ibn Thabit: Ia ditanya tentang seorang pria yang menikahi seorang wanita lalu menceraikannya sebelum melakukan hubungan suami istri. Apakah diperbolehkan baginya untuk menikahi ibunya? Beliau menjawab: Tidak, ibu tidak ditentukan dan tidak ada syarat mengenainya. Syaratnya hanya untuk anak tiri perempuan." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال سئل زيد بن ثابت عن رجل تزوج امرأة ثم فارقها قبل أن يصيبها، هل تحل له أمها؟ فقال زيد بن ثابت لا، الأم مبهمة، ليس فيها شرط، وإنما الشرط في الربائب. {cite:muwatta-maruf-1997 p.39}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle şöyle der: Zeyd ibn Sabit'e, bir kadınla evlenip evliliği tamamlamadan önce boşanan bir adam hakkında soru soruldu. Annesi ona caiz midir? Zeyd ibn Sabit şöyle cevap verdi: Hayır, anne bir şart değildir; onunla ilgili bir şart yoktur. Şart sadece üvey kızlar için geçerlidir. {cite:muwatta-maruf-1997 s.39}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia berkata: Zayd ibn Thabit ditanya tentang seorang pria yang menikahi seorang wanita dan kemudian menceraikannya sebelum melakukan hubungan suami istri. Apakah ibunya halal baginya? Zayd ibn Thabit menjawab: Tidak, ibu bukanlah syarat; tidak ada ketentuan mengenainya. Ketentuan itu hanya berlaku untuk anak tiri perempuan. {cite:muwatta-maruf-1997 p.39}"
