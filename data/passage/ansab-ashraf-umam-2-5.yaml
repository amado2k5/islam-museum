text: "… أشليخا بن لوذ بن سام بن نوح. وحصرموت وهو حضرموت، وشالاف وهو السلف، والموذاذ وهو الموذ بنو يقظان ابن عابر بن شالخ بن أرفخشذ بن سام بن نوح. وثمود، وجديس بن إرم بن نوح. ويقظان هو يقطن فى قول بعضهم. …"
