text: "… وأشهد أن لا إله إلا اللّٰه وأشهد أن محمداً عبده ورسوله، وأوصيكم بتقوى اللّٰه فإن أفضل ما توسل به العبد الإيمان والجهاد في سبيله وكلمة الإخلاص فإنها الفطرة، وإقام الصلاة فإنها الملة، وإيتاء الزكاة فإنها فرائض الله، وصوم شهر رمضان …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 4، ص 299، يذكر الصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 4, p. 299, that mentions the prayer, the zakat, the fast and the pilgrimage named together; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 4، ص 299 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 4, pág. 299, que menciona la oración, el zakat, el ayuno y la peregrinación en conjunto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 4, p. 299), mentionnant la prière, la zakat, le jeûne et le pèlerinage. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 4. cildinin 299. sayfasında namaz, zekât, oruç ve Hac birlikte anılmaktadır; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Awal dan Akhir), Jilid 4, halaman 299, menyebutkan salat, zakat, puasa, dan haji secara bersamaan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
