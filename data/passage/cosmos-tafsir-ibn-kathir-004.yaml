text: "وهذا ما لا أَعْلَم فيه نزاعًا بين العُلَمَاء إلَّا ما نقله ابن جرير عَن قتادة: أنَّه زعم أنَّ السماء خُلِقَتْ قبل الأرض"
summary:
  ar: "يقرر ابن كثير أن الأرض خُلقت قبل السماء، ويقول إنه لا يعلم في ذلك نزاعاً بين العلماء إلا ما نقله ابن جرير عن قتادة، ثم يفرّق بين خلق الأرض ودحوها بعد خلق السماء استناداً إلى جواب ابن عباس المروي في صحيح البخاري."
  en: "Ibn Kathir affirms that the earth was created before the heaven and says he knows of no dispute among scholars except what Ibn Jarir reports of Qatada. He then separates the creation of the earth from its spreading out after the heaven, following Ibn Abbas's answer recorded in Sahih al-Bukhari."
  es: "Ibn Kathir afirma que la Tierra fue creada antes que el cielo y dice que no conoce ninguna controversia entre los eruditos, salvo lo que Ibn Jarir relata sobre Qatada. Luego, separa la creación de la Tierra de su expansión posterior a la del cielo, siguiendo la respuesta de Ibn Abbas recogida en Sahih al-Bukhari."
  fr: "Ibn Kathir affirme que la terre fut créée avant le ciel et déclare n'avoir connaissance d'aucune controverse parmi les savants, hormis celle rapportée par Ibn Jarir au sujet de Qatada. Il distingue ensuite la création de la terre de son expansion après le ciel, suivant la réponse d'Ibn Abbas consignée dans le Sahih al-Bukhari."
  ur: "ابن کثیر اس بات کی تصدیق کرتے ہیں کہ زمین آسمان سے پہلے پیدا ہوئی تھی اور کہتے ہیں کہ وہ علما کے درمیان کسی اختلاف کو نہیں جانتے سوائے اس کے جو ابن جریر قتادہ سے روایت کرتے ہیں۔ اس کے بعد وہ زمین کی تخلیق کو اس کے آسمان کے بعد پھیلنے سے الگ کرتا ہے، صحیح البخاری میں درج ابن عباس کے جواب کے بعد۔"
  tr: "İbn Kathir, yeryüzünün göklerden önce yaratıldığına hükmeder ve İbn Cerir'in Katade'den rivayet ettiği dışında bu konuda âlimler arasında herhangi bir ihtilaf bilmediğini söyler. Daha sonra, Sahih el-Buhari'de rivayet edilen İbn Abbas'ın cevabına dayanarak, yeryüzünün yaratılışı ile göklerin yaratılışından sonra yayılması arasında ayrım yapar."
  id: "Ibn Kathir memutuskan bahwa bumi diciptakan sebelum langit, dan mengatakan bahwa ia tidak mengetahui adanya perselisihan di antara para ulama mengenai hal ini kecuali apa yang diriwayatkan oleh Ibn Jarir berdasarkan riwayat Qatadah. Kemudian ia membedakan antara penciptaan bumi dan penyebarannya setelah penciptaan langit, berdasarkan jawaban Ibn Abbas yang diriwayatkan dalam Sahih al-Bukhari."
