  ar: "صحيح مسلم، كتاب صفة القيامة والجنة والنار"
  en: "Sahih Muslim, Book 52: Characteristics of the Day of Judgment, Paradise, and Hell"
  ur: "صحیح مسلم، کتاب صفۃ القیامۃ والجنۃ والنار"
  es: "Sahih Muslim, Libro 52: Características del Día del Juicio, el Paraíso y el Infierno"
  fr: "Sahih Muslim, Livre 52: Caractéristiques du Jour du Jugement, du Paradis et de l’Enfer"
summary:
  ar: "القسم 52 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صفة القيامة والجنة والنار»، ويضم فيها النصوص من 7045 إلى 7129 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 52 of Sahih Muslim (Characteristics of the Day of Judgment, Paradise, and Hell) in the division of the open hadith dataset the museum took its reports from: reports 7045 to 7129 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 52، عنوان «کتاب صفۃ القیامۃ والجنۃ والنار»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7045 تا 7129۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 52 de Sahih Muslim (Características del Día del Juicio, el Paraíso y el Infierno) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 7045 al 7129, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre 52, « Caractéristiques du Jour du Jugement, du Paradis et de l’Enfer »), dans la base de données ouverte: les hadiths 7045 à 7129 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
