label: { ar: "سنن أبي داود 3714 — ما أُحل", en: "Sunan Abi Dawud 3714 — what was made lawful", ur: "سنن ابی داؤد 3714 — جو حلال کیا گیا" }
text: "… رِيحَ مَغَافِيرَ فَدَخَلَ عَلَى إِحْدَاهُنَّ فَقَالَتْ لَهُ ذَلِكَ فَقَالَ \" بَلْ شَرِبْتُ عَسَلاً عِنْدَ زَيْنَبَ بِنْتِ جَحْشٍ وَلَنْ أَعُودَ لَهُ \". فَنَزَلَتْ { لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ تَبْتَغِي } إِلَى { إِنْ تَتُوبَا إِلَى اللَّهِ } لِعَائِشَةَ وَحَفْصَةَما { وَإِذْ أَسَرَّ النَّبِيُّ إِلَى بَعْضِ أَزْوَاجِهِ حَدِيثًا } لِقَوْلِهِ \" بَلْ شَرِبْتُ عَسَلاً \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3714، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3714 (Drinks (Kitab Al-Ashribah)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3714، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
