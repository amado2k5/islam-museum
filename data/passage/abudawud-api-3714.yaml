label: { ar: "سنن أبي داود 3714 — ما أُحل", en: "Sunan Abi Dawud 3714 — what was made lawful", ur: "سنن ابی داؤد 3714 — جو حلال کیا گیا", es: "Sunan Abi Dawud 3714: lo que se hizo legal", fr: "Sunan Abi Dawud 3714 — ce qui a été rendu licite", tr: "Sunan Abi Davud 3714 — İzin verilenler", id: "Sunan Abi Dawud 3714 — Apa yang diperbolehkan" }
text: "… رِيحَ مَغَافِيرَ فَدَخَلَ عَلَى إِحْدَاهُنَّ فَقَالَتْ لَهُ ذَلِكَ فَقَالَ \" بَلْ شَرِبْتُ عَسَلاً عِنْدَ زَيْنَبَ بِنْتِ جَحْشٍ وَلَنْ أَعُودَ لَهُ \". فَنَزَلَتْ { لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ تَبْتَغِي } إِلَى { إِنْ تَتُوبَا إِلَى اللَّهِ } لِعَائِشَةَ وَحَفْصَةَما { وَإِذْ أَسَرَّ النَّبِيُّ إِلَى بَعْضِ أَزْوَاجِهِ حَدِيثًا } لِقَوْلِهِ \" بَلْ شَرِبْتُ عَسَلاً \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3714، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3714 (Drinks (Kitab Al-Ashribah)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3714، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3714 (Bebidas (Kitab Al-Ashribah)), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3714 (Boissons (Kitab Al-Ashribah)), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 3714 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3714, menyebutkan apa yang diperbolehkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
