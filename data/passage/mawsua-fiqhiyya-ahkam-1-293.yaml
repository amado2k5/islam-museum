text: "… العلوم التى تعلّمها فرض عين تعلم ما يحتاجه الإِنسان من علم الفقه والعقيدة. قال ابن عابدين نقلا عن العلامى : من فرائض الإِسلام تعلم ما يحتاج إليه العبد فى إقامة دينه وإخلاص عمله لله تعالى ومعاشرة عباده، وفرض على كل …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 1، ص 293، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض، وفرض العين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 1, p. 293, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 1، ص 293 کا اقتباس جس میں فریضہ اور فرائض، جو لوگوں پر فرض کیا گیا، فرض، فرضِ عین کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 1, p. 293, dont le texte mentionne l'obligation (farida), ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation individuelle (fard 'ayn) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 1, p. 293, cuyo texto menciona la obligación (farida), lo que se impuso a la gente, lo obligatorio (fard), la obligación individual (fard 'ayn); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 1, sayfa 293'ten bir alıntı, farz olan amelleri, insanlar için farz kılınanları, bireysel yükümlülükleri ve özel bireysel yükümlülükleri ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 1 Bergambar, halaman 293, menyebutkan tentang amalan wajib, apa yang dianjurkan bagi manusia, kewajiban individu, dan kewajiban individu tertentu. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, kewajiban, tindakan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
