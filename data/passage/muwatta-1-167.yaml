summary:
  ar: "أثر يرويه مالك عن عبد الله بن دينار أنه رأى عبد الله بن عمر يبول قائماً؛ وهو في باب ما جاء في البول قائماً وغيره. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند البيهقي، وأن ابن أبي شيبة أخرجه من طريق عبد الله الرومي. {cite:muwatta-maruf-1997 p.110}"
