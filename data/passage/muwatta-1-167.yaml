label: { ar: "الموطأ 167 — ابن عمر يبول قائماً", en: "Muwatta 167", es: "Muwatta 167", fr: "Muwatta 167", ur: "موطا 167", tr: "Muvatta 167 — İbn Ömer ayakta idrarını yapıyor", id: "Al-Muwatta 167 — Ibnu Umar kencing sambil berdiri" }
summary:
  ar: "أثر يرويه مالك عن عبد الله بن دينار أنه رأى عبد الله بن عمر يبول قائماً؛ وهو في باب ما جاء في البول قائماً وغيره. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند البيهقي، وأن ابن أبي شيبة أخرجه من طريق عبد الله الرومي. {cite:muwatta-maruf-1997 p.110}"
  tr: "Malik'in Abdullah ibn Dinar'dan rivayet ettiği bir hadiste, Abdullah ibn Ömer'in ayakta işediğini gördüğü belirtilmektedir; bu, ayakta işeme ve diğer ilgili konular hakkında rivayet edilenler bölümünde yer almaktadır. Editör, bunun Malik'ten Ebu Musab, Suveyd ve İbn Vahb tarafından rivayet edildiğini, el-Beyhaki tarafından kaydedildiğini ve İbn Abi Şeybe'nin bunu Abdullah el-Rumi'nin zinciriyle naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.110}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Abdullah ibn Dinar menyatakan bahwa ia melihat Abdullah ibn Umar buang air kecil sambil berdiri; hal ini terdapat dalam bab tentang apa yang telah dinarasikan mengenai buang air kecil sambil berdiri dan hal-hal terkait lainnya. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Musab, Suwaid, dan Ibn Wahb, sebagaimana dicatat oleh al-Bayhaqi, dan bahwa Ibn Abi Shaybah meriwayatkannya melalui sanad Abdullah al-Rumi. {cite:muwatta-maruf-1997 p.110}"
