label: { ar: "صحيح البخاري 5468 — الأب والأبوة", en: "Sahih al-Bukhari 5468 — the father and fatherhood", ur: "صحیح بخاری 5468 — باپ اور والدیت", es: "Sahih al-Bukhari 5468 — El padre y la paternidad" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ أُتِيَ النَّبِيُّ بِصَبِيٍّ يُحَنِّكُهُ، فَبَالَ عَلَيْهِ، فَأَتْبَعَهُ الْمَاءَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5468، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5468 (Sacrifice on Occasion of Birth (`Aqiqa)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5468، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5468 (Sacrificio con motivo del nacimiento (`Aqiqa)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
