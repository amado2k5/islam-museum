text: "… غزية بن الحارث، صفوان بن عبد الرحمن، يعلى على لا و الله لا أعطيكما وأدع... عائشة لا والله ما أبدلنى الله خيرا منها ؛... لا وأبيك يزيد بن سنان لا وصية لوارث عبد الرحمن بن غنم، لا وضوء إلا من …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 4، ص 138، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 4, p. 138, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 4، ص 138 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra al-Isaba de Ibn Hajar, volumen 4, pág. 138, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 4, p. 138), mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Navigateur de testaments."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 4. cildinin 138. sayfasından bir alıntı, bir vasiyetname veya nihai miras belgesinden ve geride bıraktığı mal ve miraslardan bahsetmektedir; makine tarafından okunabilir taranmış kopyadan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 4, halaman 138, menyebutkan sebuah wasiat atau surat wasiat terakhir, dan apa yang ditinggalkannya berupa harta warisan; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
