label: { ar: "الموطأ 2317 — مالك: بيع أم ولد الأب لإنقاذ أولاد المكاتب من العجز", en: "Muwatta 2317" }
summary:
  ar: "قال مالك في مكاتب يهلك ويترك أم ولد وأولادا صغارا منها أو من غيرها لا يقوون على السعي ويخاف عليهم العجز: تباع أم ولد أبيهم إذا كان في ثمنها ما يؤدى به جميع كتابتهم، لأن أباهم لم يكن يمنع بيعها إذا خاف العجز. فإن لم يكن في ثمنها ما يكفي، ولم تقو هي ولا هم على السعي، رجعوا جميعا رقيقا لسيدهم. {cite:muwatta-maruf-1997 p.356}"
