label: { ar: "الموطأ 2317 — مالك: بيع أم ولد الأب لإنقاذ أولاد المكاتب من العجز", en: "Muwatta 2317", es: "Muwatta 2317", fr: "Muwatta 2317", ur: "موطا 2317", tr: "El-Muvatta 2317 — Malik: Kölenin çocuklarını acizlikten kurtarmak için babanın çocuğunun annesini satmak", id: "Al-Muwatta 2317 — Malik: Menjual ibu dari anak seorang ayah untuk menyelamatkan anak-anak budak dari kecacatan" }
summary:
  ar: "قال مالك في مكاتب يهلك ويترك أم ولد وأولادا صغارا منها أو من غيرها لا يقوون على السعي ويخاف عليهم العجز: تباع أم ولد أبيهم إذا كان في ثمنها ما يؤدى به جميع كتابتهم، لأن أباهم لم يكن يمنع بيعها إذا خاف العجز. فإن لم يكن في ثمنها ما يكفي، ولم تقو هي ولا هم على السعي، رجعوا جميعا رقيقا لسيدهم. {cite:muwatta-maruf-1997 p.356}"
  tr: "Malik, ölen bir adamın geride köle bir kadın ve çalışamayacak durumda olan, hatta çalışamayacaklarından korkulan küçük çocuklar bırakması durumunda şunları söylemiştir: Köle kadın, eğer fiyatı tüm özgürlük sözleşmelerinin bedelini ödemeye yeterse satılmalıdır; çünkü babaları, çalışamayacaklarından korksaydı satışına engel olmazdı. Eğer fiyat yetersizse ve ne o ne de çocuklar çalışamayacak durumdaysa, hepsi efendilerinin kölesi olmaya geri dönerler. {cite:muwatta-maruf-1997 s.356}"
  id: "Malik berkata mengenai seorang pria yang meninggal dunia dan meninggalkan seorang budak perempuan dan anak-anak kecil, baik dari istri pertamanya maupun istri lainnya, yang tidak mampu bekerja dan dikhawatirkan tidak akan mampu bekerja: Budak perempuan itu harus dijual jika harganya cukup untuk melunasi semua kontrak pembebasan mereka, karena ayah mereka tidak akan mencegah penjualannya jika ia khawatir akan ketidakmampuan mereka. Jika harganya tidak mencukupi, dan baik dia maupun mereka tidak mampu bekerja, mereka semua kembali menjadi budak tuan mereka. {cite:muwatta-maruf-1997 p.356}"
