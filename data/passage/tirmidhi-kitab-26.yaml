summary:
  ar: "القسم 26 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأشربة عن رسول الله»، ويضم فيها النصوص من 1861 إلى 1896 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 26 of Jami' al-Tirmidhi (The Book on Drinks) in the division of the open hadith dataset the museum took its reports from: reports 1861 to 1896 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 26، عنوان «کتاب الاشربۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1861 تا 1896۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 26 de Jami' al-Tirmidhi (El Libro de las Bebidas) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1861 al 1896, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
