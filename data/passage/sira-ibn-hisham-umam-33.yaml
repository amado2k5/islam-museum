text: "… إسحاق: فلما هلك أبرهة مَلَكَ الحبشةَ ابنُهُ يَكْسُومُ بن أبرهة، وبه كان يُكْنَىٰ، فلما هلك يكسومُ بن أبرهة مَلَكَ اليمنَ في الحبشة أخوه مَسْرُوق بن أبرهة. سيف بن ذي يزن الحميري يطالب بملك اليمن ويستنجد قيصر الروم: فلما طال البلاءُ …"
