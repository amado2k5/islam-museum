text: "… محمد: أن عبد الرحمن بن عوف توفي وكان فيما ترك ذهبٌ قُطِع بالفؤوس حتى مَجلت أيدي الرجال منه، وترك أربع نسوة، فأَخرِجَت امرأة من ثُمنها بثلاثين ألفا. ذكر وفاته رضيعَنَة توفي عبد الرحمن بن عوف سنة اثنتين وثلاثين، ودفن بالبقيع، …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 130، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 130, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 130 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de Sifat al-Safwa de Ibn al-Jawzi, volumen 1, pág. 130, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 1, p. 130) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 1. cildinin 130. sayfasından bir alıntı, bir mezar, bir türbe ve bir türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 1, halaman 130, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
