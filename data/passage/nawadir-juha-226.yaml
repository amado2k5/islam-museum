text: "… خذ منه وَأعطِ الخباز كان له دَينٌ عند بعضهم، فذهب إلى داره وطالبهُ فلم يعطه شيئاً، وقال له : ما معي بارة، فعاد الشيخ خائباً خاسِراً، وجاع جوعاً عظيماً، فمرّ بفرنٍ، وكان قد خرج الخبز، وانتشرت روائحه الزكية، فأنتشل رغيفاً …"
summary:
  ar: "رفض مدين جحا أن يسدد دينه، فجاع جحا وسرق رغيفاً من خباز، ودعا الله أن يأخذ من المدين دراهم قليلة للخباز. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  en: "Juha's debtor refuses to pay, and Juha, going hungry, steals a loaf from a baker, praying that God take a few coins from the debtor for the baker. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  ur: "جحا کا مقروض قرض ادا کرنے سے انکار کرتا ہے، اور بھوکا جحا ایک نان بائی سے روٹی چرا لیتا ہے اور دعا کرتا ہے کہ اللہ مقروض سے چند سکے لے کر نان بائی کو دے دے۔ {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  fr: "Le débiteur de Juha refuse de payer, et Juha, affamé, vole un pain à un boulanger, priant Dieu de prendre quelques pièces au débiteur pour le boulanger. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  es: "El deudor de Juha se niega a pagar, y Juha, con hambre, roba un pan a un panadero, rogando a Dios que tome unas monedas del deudor para el panadero. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
