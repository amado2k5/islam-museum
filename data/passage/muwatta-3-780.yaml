label: { ar: "الموطأ 780 — مالك: ليس على الرجل في عبيد عبيده ولا أجيره ولا رقيق امرأته زكاة الفطر إلا من يخدمه ولا بد له منه، ولا في رقيقه الكافر", en: "Muwatta 780" }
summary:
  ar: "آخر نص في كتاب الزكاة، والوحيد في باب من لا تجب عليه زكاة الفطر. يقول يحيى: قال مالك: ليس على الرجل في عبيد عبيده ولا في أجيره ولا في رقيق امرأته زكاة، إلا من كان منهم يخدمه ولا بد له منه فتجب عليه، وليس عليه زكاة في أحد من رقيقه الكافر ما لم يسلم، لتجارة كانوا أو لغير تجارة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (754). {cite:muwatta-maruf-1997 p.384}"
