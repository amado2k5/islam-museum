label: { ar: "الموطأ 780 — مالك: ليس على الرجل في عبيد عبيده ولا أجيره ولا رقيق امرأته زكاة الفطر إلا من يخدمه ولا بد له منه، ولا في رقيقه الكافر", en: "Muwatta 780", es: "Muwatta 780", fr: "Muwatta 780", ur: "موطا 780", tr: "Al-Muwatta 780 — Malik: Bir erkek, kendisine hizmet eden ve vazgeçilmez olanlar hariç, köleleri, ücretli hizmetçileri veya karısının köleleri için zekât-ı fitr ödemekle yükümlü değildir; aynı şekilde gayrimüslim köleleri için de zekât-ı fitr ödemekle yükümlü değildir.", id: "Al-Muwatta 780 — Malik: Seorang pria tidak diwajibkan membayar Zakat al-Fitr atas budaknya, pembantu upahannya, atau budak istrinya, kecuali bagi mereka yang melayaninya dan sangat dibutuhkan olehnya, dan juga tidak diwajibkan membayar Zakat al-Fitr atas budak-budaknya yang bukan Muslim." }
summary:
  ar: "آخر نص في كتاب الزكاة، والوحيد في باب من لا تجب عليه زكاة الفطر. يقول يحيى: قال مالك: ليس على الرجل في عبيد عبيده ولا في أجيره ولا في رقيق امرأته زكاة، إلا من كان منهم يخدمه ولا بد له منه فتجب عليه، وليس عليه زكاة في أحد من رقيقه الكافر ما لم يسلم، لتجارة كانوا أو لغير تجارة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (754). {cite:muwatta-maruf-1997 p.384}"
  tr: "Zekât Kitabı'ndaki son metin ve Zekâtü'l-Fitr ödemekle yükümlü olmayanlar bölümündeki tek metin. Yahya şöyle diyor: Malik dedi ki: Bir kimse, köleleri, ücretli hizmetçileri veya karısının köleleri için zekât ödemekle yükümlü değildir; ancak kendisine hizmet eden ve onlarsız yapamayacağı kişiler hariç. Bu durumda zekât farzdır. Müslüman olmayan kölelerinden, ticaret için olsun veya olmasın, İslam'a girmedikleri sürece zekât ödemekle yükümlü değildir. Editör, bunu Ebu Musab'ın (754) Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.384}"
  id: "Teks terakhir dalam Kitab Zakat, dan satu-satunya dalam bab tentang orang-orang yang tidak wajib membayar Zakat Fitrah. Yahya berkata: Malik berkata: Seorang laki-laki tidak wajib membayar Zakat atas budaknya, pekerja upahannya, atau budak istrinya, kecuali bagi mereka yang melayaninya dan yang tidak dapat ia tinggalkan, dalam hal ini wajib. Ia tidak wajib membayar Zakat atas budak-budaknya yang bukan Muslim kecuali jika mereka masuk Islam, baik untuk perdagangan atau tidak. Editor menyebutkan bahwa Abu Mus'ab (754) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.384}"
