  ar: "صحيح مسلم، كتاب التفسير"
  en: "Sahih Muslim, Book 56: The Book of Commentary on the Qur'an"
  ur: "صحیح مسلم، کتاب التفسیر"
  es: "Sahih Muslim, Libro 56: El libro de comentarios sobre el Corán"
summary:
  ar: "القسم 56 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التفسير»، ويضم فيها النصوص من 7523 إلى 7563 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 56 of Sahih Muslim (The Book of Commentary on the Qur'an) in the division of the open hadith dataset the museum took its reports from: reports 7523 to 7563 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 56، عنوان «کتاب التفسیر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7523 تا 7563۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 56 del Sahih Muslim (El Libro de Comentarios del Corán) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 7523 al 7563, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
