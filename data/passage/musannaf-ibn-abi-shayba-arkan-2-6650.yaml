text: "… أن لا إله إلا اللّٰه وأدناها إماطة الأذى عن الطريق، والحياء شعبة من الإيمان. - حدثنا ابن عُيَيْنة عن الزُّهريّ عن سالم عن أبيه قال: قال رسول اللّٰه وَ لِيعه الحياء من الإيمان. - حدثنا وكيع قال: حدثنا الأعمش عن …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 6650، يذكر شعب الإيمان، وما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 6650, that mentions the branches of faith, what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 6650 کا اقتباس جس میں ایمان کی شاخیں، جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 6650, que menciona las ramas de la fe y lo que se considera parte de ella; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 6650, mentionnant les piliers de la foi et ce qui en fait partie; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 6650. sayfasından, imanın dallarını ve imanın ne olduğunu anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 2, halaman 6650, yang menyebutkan cabang-cabang iman dan apa yang membentuk iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
