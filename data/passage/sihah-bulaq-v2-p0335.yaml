text: |-
  ٢٥٢
  *⁦(حدل)⁩•
  صل الهاء بل لهبل بالتحريك مصدر قولت هبلته أقه أى شكلته والاهبال
  الاشكال والهبول من النساء الشكول والمهيل أقصى الرحم ويقال طريق الولدوهوما بين
  الظبية والرجمُ قال السكميت
  اذاطرّق الامر بالمعضلات يتنا وضاق به المهيل
  ١ عى يصف ذتباطمع فى ناقته
  المذكورة وقوله فلاً -شأنك
  والهبالا-م ناقة لاسماء بن خارجة وقال ١
  فلأحشأنك مشقصا • أوسا أويس من الهباله
  يقال حثأت الرجل بالسهم
  والهبسلّ مثال الهيف الثقيل المسنّ من الناس والابل وقد هبله اللحم اذا كثر عليه وركب
  حشأ اذا أصبت به جوفه وقوله
  بعضه بعضا وأهبلد يقال رجل مهيل قال أبو كبير ٢ فشب غير مهبل• وبقال هوالملعن
  أوسابعى عوضا والأويس
  وقالت عائشة رضى اللّٰه عنها فى حديث الافك والنساء يومتذلا يهبلهنّ اللحم والاهتبال
  المتب ٢) و قف الواف ١م
  الاغتنام والاحتيال والاقتصاص يقال اهتبات غفلته قال الكميت ٤
  وعاث فى غابر منها يعنعثة * نحر المكافئ والمكنور يهتبل
  حمن - أن بدءهنّءواقد
  والهبال الصباد الذى يهتبل الصيدأى يغترّه قال ذوالرمّة
  حبك التطاق
  ومطعم الميدهبال لبغيته * ألفى أباه بذاك الكسب يكنسب
  وذتب هبل محتال وهبل اسم صم كان فى الكعبة والهنبلة بزيادة النون مشسية الضبع
  قولد لا يهبلهنّ فى نسخة لم يهبلهنّ
  العرجاء ⁦(هتل)⁩ الاصمعى التهتال مثل التهتان وأنشد للعجاج
  وأخرى مايهبلهنّ وليحرّر اه
  ضرب السوارى متنه بالتهتال • يقال هتلت السماء هتلا وهتلانا وتهتالا وسمائب هتل
  ٤ عنى بصف الذور والكلاب
  تمل لهتملة الكلام الخفىّ وقد هتمل جل لهجل غاتطبين الجبال مطمئنة وقال
  والعنعنة اللين من الارض
  بالهجل منها كاصوات الزنابير* وهجل به تهجيلا أسمعه القبيح وشه وهجل بالقصبة وغيرها
  والمكافئ الذى يذبح شاتين
  اذارى بها والهوجل من الابل السريعة مثل الهوجاء قال الكميت
  احداهما مقابلٱوالاخرى للعقيقة
  وبعداشارتهم بالسياط • هوجاءليلتها هوجل
  والمسكنود المغلوب قاله المؤاف
  أى فى ليلتها والهوجل الرجل الاهوج وقال * سهدا اذامانام ليل الهوجل • والهوجل
  الفلاة لا أعلام بها الاصمعى الهوجل الارض تأخذمرة مكذا ومرة هكذاقال
  جندل
  والآل فى كل مراد هوجل • كانه بالصصمان الانجل * قطن سيخام بأيادى غزل
  (هدل الهديل الذكر من المام قال جران العود
  كانَ الهديل الظااع الرجل وسطها • من البعى شرّيب يغرَّد مسنزف
  والهديل صوت الحمام يق ال هدل القمرىّ يهدل هديلا مثل يهدر قال ذوالرمّة
  أرى ناقى عند المحصب شاقها • رواح المانى والهديل المرجع
  والهديل فرخ كان على عهد نوح عليه السلام قصاده جارح من جوارح الطير قالوافليس
  من حامة الاوتبكى عليه قال الشاعر
  ومامن ت)تفين بهانصر • بأسرع جابلك من ديل
  وهدات الشئ أهدله هدلااذا أرخيته وأرسلته الى أسفل ويقال هدل البعير هدلا وهو أن
  تأخذه القرحة فيهدل مشة ره فهوفصيل هادل وبعير هدل اذا كان طويل المشفروذلك مما
