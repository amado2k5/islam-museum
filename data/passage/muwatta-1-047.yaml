label: { ar: "الموطأ 47 — عمر وحوض ترده السباع: لا تخبرنا", en: "Muwatta 47", es: "Muwatta 47", fr: "Muwatta 47", ur: "موطا 47", tr: "Al-Muwatta 47 — Ömer ve vahşi hayvanların sıkça uğradığı bir havza: Bize söyleme.", id: "Al-Muwatta 47 — Umar dan sebuah cekungan yang sering dikunjungi binatang buas: Jangan ceritakan kepada kami" }
text: "يا صاحب الحوض لا تخبرنا، فإنا نرد على السباع وترد علينا"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم التيمي عن يحيى بن عبد الرحمن بن حاطب، في باب الطهور للوضوء: خرج عمر بن الخطاب في ركب فيهم عمرو بن العاص فوردوا حوضاً، فسأل عمرو صاحبه هل ترده السباع، فنهاه عمر أن يخبرهم، وقال إنهم يردون على السباع وترد عليهم، أي أن الماء طهور ما لم يتغير. ويقول المحقق إن الأثر منقطع لأن يحيى بن عبد الرحمن بن حاطب لم يدرك عمر، وينقل عن يحيى بن معين أن قول من قال فيه «سمعت عمر» باطل وإنما هو عن أبيه، وأن يحيى وُلد في خلافة عثمان كما في طبقات ابن سعد. {cite:muwatta-maruf-1997 p.57} {cite:muwatta-maruf-1997 p.58}"
  tr: "Malik'in Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim el-Taymi'den, o da Yahya ibn Abd el-Rahman ibn Hatib'den rivayet ettiği, abdest temizliği bölümündeki bir hadiste şöyle anlatılır: Ömer ibn el-Hattab, Amr ibn el-As'ın da aralarında bulunduğu bir grupla birlikte dışarı çıktı. Bir su kaynağına geldiler ve Amr, sahibine vahşi hayvanların bu sudan içip içmediğini sordu. Ömer, onlara söylemesini yasakladı ve \"Onlar da sudan içiyorlar, vahşi hayvanlar da içiyor\" dedi; yani su değişmediği sürece temizdir. Araştırmacı, Yahya ibn Abd el-Rahman ibn Hatib'in Ömer zamanında yaşamadığı için bu hadisin bağlantısız olduğunu söylüyor. Yahya ibn Ma'in'in, kendisine atfedilen \"Ömer'i duydum\" ifadesinin yanlış olduğunu, bunun babasından geldiğini söylediğini aktarıyor. Ayrıca, İbn Sa'd'ın Tabaqat'ında belirtildiği gibi, Yahya, Osman'ın halifeliği döneminde doğmuştur. {cite:muwatta-maruf-1997 s.57} {cite:muwatta-maruf-1997 s.58}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id, atas otoritas Muhammad ibn Ibrahim al-Taymi, atas otoritas Yahya ibn Abd al-Rahman ibn Hatib, dalam bab tentang penyucian untuk wudhu: Umar ibn al-Khattab pergi bersama sekelompok orang yang termasuk Amr ibn al-As. Mereka sampai di sebuah tempat minum, dan Amr bertanya kepada pemiliknya apakah hewan liar minum dari sana. Umar melarangnya untuk memberi tahu mereka, dengan mengatakan bahwa mereka minum dari air itu dan hewan liar juga minum dari sana, artinya air itu suci selama tidak berubah. Peneliti mengatakan bahwa riwayat tersebut tidak relevan karena Yahya ibn Abd al-Rahman ibn Hatib tidak hidup pada masa Umar. Ia mengutip Yahya ibn Ma'in yang mengatakan bahwa pernyataan yang dinisbahkan kepadanya, \"Aku mendengar Umar,\" adalah salah; melainkan, itu berasal dari ayahnya. Selanjutnya Yahya lahir pada masa kekhalifahan Utsman, sebagaimana disebutkan dalam Tabaqat karya Ibnu Sa'd. {kutip:muwatta-maruf-1997 hal.57} {kutip:muwatta-maruf-1997 hal.58}"
