label: { ar: "الموطأ 47 — عمر وحوض ترده السباع: لا تخبرنا", en: "Muwatta 47" }
text: "يا صاحب الحوض لا تخبرنا، فإنا نرد على السباع وترد علينا"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم التيمي عن يحيى بن عبد الرحمن بن حاطب، في باب الطهور للوضوء: خرج عمر بن الخطاب في ركب فيهم عمرو بن العاص فوردوا حوضاً، فسأل عمرو صاحبه هل ترده السباع، فنهاه عمر أن يخبرهم، وقال إنهم يردون على السباع وترد عليهم، أي أن الماء طهور ما لم يتغير. ويقول المحقق إن الأثر منقطع لأن يحيى بن عبد الرحمن بن حاطب لم يدرك عمر، وينقل عن يحيى بن معين أن قول من قال فيه «سمعت عمر» باطل وإنما هو عن أبيه، وأن يحيى وُلد في خلافة عثمان كما في طبقات ابن سعد. {cite:muwatta-maruf-1997 p.57} {cite:muwatta-maruf-1997 p.58}"
