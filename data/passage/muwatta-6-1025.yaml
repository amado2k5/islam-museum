label: { ar: "الموطأ 1025 — مالك: سمعت أنه يُحكم على من قتل الصيد في الحرم وهو حلال بمثل ما يُحكم به على المحرم الذي يقتل الصيد في الحرم وهو محرم", en: "Muwatta 1025", es: "Muwatta 1025", fr: "Muwatta 1025", ur: "موطا 1025", tr: "El-Muvatta 1025 — Malik: İhramlı olmadığı halde kutsal mekânda av hayvanı öldürenin, ihramlı olduğu halde kutsal mekânda av hayvanı öldürenle aynı şekilde hüküm verildiğini duydum.", id: "Al-Muwatta 1025 — Malik: Aku mendengar bahwa orang yang membunuh hewan buruan di tempat suci ketika tidak dalam keadaan ihram akan dinilai sama seperti orang yang membunuh hewan buruan di tempat suci ketika dalam keadaan ihram." }
summary:
  ar: "قول لمالك: سمعت أنه يحكم على من قتل الصيد في الحرم وهو حلال بمثل ما يحكم به على المحرم الذي يقتل الصيد في الحرم وهو محرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1157) و(1158). {cite:muwatta-maruf-1997 p.478} {cite:muwatta-maruf-1997 p.479}"
  tr: "Malik şöyle dedi: \"İhramlı olmadığı halde kutsal alanda av hayvanı öldürenin hükmünün, ihramlı olduğu halde kutsal alanda av hayvanı öldürenin hükmüyle aynı olduğunu duydum.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1157) ve (1158) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.478} {cite:muwatta-maruf-1997 s.479}"
  id: "Malik berkata: Saya mendengar bahwa hukum bagi orang yang membunuh hewan buruan di dalam tempat suci ketika tidak dalam keadaan ihram sama dengan hukum bagi orang yang sedang ihram yang membunuh hewan buruan di dalam tempat suci ketika sedang ihram. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1157) dan (1158). {cite:muwatta-maruf-1997 p.478} {cite:muwatta-maruf-1997 p.479}"
