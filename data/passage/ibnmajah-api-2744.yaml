label: { ar: "سنن ابن ماجه 2744 — الأب والأبوة، النسب والانتساب", en: "Sunan Ibn Majah 2744 — the father and fatherhood; paternity and lineage", ur: "سنن ابن ماجہ 2744 — باپ اور والدیت، نسب اور انتساب", es: "Sunan Ibn Majah 2744 — El padre y la paternidad; paternidad y linaje", fr: "Sunan Ibn Majah 2744 — le père et la paternité; la paternité et la lignée", tr: "Sunan İbn Majah 2744 — Baba ve babalık, soy ve akrabalık", id: "Sunan Ibn Majah 2744 — Ayah dan kebapakan, garis keturunan dan afiliasi" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ قَالَ \" كُفْرٌ بِامْرِئٍ ادِّعَاءُ نَسَبٍ لاَ يَعْرِفُهُ أَوْ جَحْدُهُ وَإِنْ دَقَّ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2744، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2744 (Chapters on Shares of Inheritance), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2744، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2744 (Capítulos sobre la herencia), menciona al padre y la paternidad, la genealogía y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2744 (Chapitres sur le partage de l'héritage), mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "İbn Majah'ın Sünen'inde yer alan 2744 numaralı hadis, babalık, soy ve atalık kavramlarından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2744, menyebutkan tentang ayah, garis keturunan, dan leluhur. Peramban \"Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang subjek tersebut."
