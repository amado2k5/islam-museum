text: "… التي في الجلد، وما يقرب منه فيعسر في الأحياء لما قلناه، وكذلك في الموتى الذين ماتوا بمرض ونحوه. وخصوصاً إذا كان من الأمراض يلزمه قلة الدم والرطوبات فتختفي تلك العروق، كما في الإسهال والدق والنزف. وأسهل تشريح هذه ما يكون …"
