label: { ar: "الموطأ 1843 — يحيى عن مالك عن يحيى بن سعيد: أمر النبي السعدين أن يبيعا آنية من المغانم من ذهب أو فضة، فباعا كل ثلاثة بأربعة عينا، فقال: أربيتما فردا", en: "Muwatta 1843", es: "Muwatta 1843", fr: "Muwatta 1843", ur: "موطا 1843", tr: "El-Muvatta 1843 — Yahya, Malik'ten, o da Yahya bin Said'den rivayetle: Peygamber, iki Sa'd'a savaş ganimetlerinden altın veya gümüş kaplar satmalarını emretti. Onlar da üçünü dört kuruşa sattılar. Peygamber şöyle buyurdu: \"Siz faizcilik yapıyorsunuz.\"", id: "Al-Muwatta 1843 — Yahya dari Malik dari Yahya bin Saeed: Nabi memerintahkan kedua Sa'd untuk menjual bejana emas atau perak dari rampasan perang, lalu mereka menjual tiga bejana seharga empat koin. Beliau bersabda: Kalian telah melakukan riba." }
text: "أرْبيْتُمَا فَرُدَّا"
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه قال: أمر رسول الله السعدين أن يبيعا آنية من المغانم من ذهب أو فضة، فباعا كل ثلاثة بأربعة عينا، أو كل أربعة بثلاثة عينا. فقال لهما رسول الله: أربيتما فردا. ويذكر المحقق أن السعدين هما سعد بن أبي وقاص وسعد بن عبادة، وأن الرواية اختلفت بين يوم خيبر ويوم حنين. {cite:muwatta-maruf-1997 p.156} {cite:muwatta-maruf-1997 p.157}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet ettiğine göre, şöyle demiştir: Allah'ın Resulü, iki Sa'd'a savaş ganimetlerinden altın veya gümüş kaplar satmalarını emretti. Üçünü dört kuruşa, dördünü de üç kuruşa sattılar. Allah'ın Resulü onlara, \"Siz faizcilik yapıyorsunuz\" dedi. Araştırmacı, iki Sa'd'ın Sa'd ibn Abi Waqqas ve Sa'd ibn Ubadah olduğunu ve rivayetin Hayber günü ile Huneyn günü arasında farklılık gösterdiğini belirtmektedir. {cite:muwatta-maruf-1997 s.156} {cite:muwatta-maruf-1997 s.157}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya bin Sa'id, bahwa ia berkata: Rasulullah memerintahkan kedua Sa'd untuk menjual beberapa bejana emas atau perak dari rampasan perang. Mereka menjual tiga bejana seharga empat koin, atau empat bejana seharga tiga koin. Rasulullah berkata kepada mereka, \"Kalian telah melakukan riba.\" Peneliti menyebutkan bahwa kedua Sa'd tersebut adalah Sa'd bin Abi Waqqas dan Sa'd bin 'Ubadah, dan bahwa riwayat tersebut berbeda antara hari Khaybar dan hari Hunayn. {cite:muwatta-maruf-1997 p.156} {cite:muwatta-maruf-1997 p.157}"
