label: { ar: "الموطأ 1843 — يحيى عن مالك عن يحيى بن سعيد: أمر النبي السعدين أن يبيعا آنية من المغانم من ذهب أو فضة، فباعا كل ثلاثة بأربعة عينا، فقال: أربيتما فردا", en: "Muwatta 1843" }
text: "أرْبيْتُمَا فَرُدَّا"
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه قال: أمر رسول الله السعدين أن يبيعا آنية من المغانم من ذهب أو فضة، فباعا كل ثلاثة بأربعة عينا، أو كل أربعة بثلاثة عينا. فقال لهما رسول الله: أربيتما فردا. ويذكر المحقق أن السعدين هما سعد بن أبي وقاص وسعد بن عبادة، وأن الرواية اختلفت بين يوم خيبر ويوم حنين. {cite:muwatta-maruf-1997 p.156} {cite:muwatta-maruf-1997 p.157}"
