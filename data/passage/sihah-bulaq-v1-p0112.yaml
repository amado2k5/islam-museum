text: |-
  ⁦(ع رض)⁩ ٥٢٩
  فلان فلابا أى وقع فيه وعارضه أى جانبه وعدل عنه قال ذوالرمة
  وقد عارض الشعرى سهيل كانه * قريع هجان عار الشول جافر
  ويقال ضرب الفحل النساقة عراضا وهو أن يقاد اليها ويعرض عليها ان اشتهت ضر بهاوالا
  فلاوذلك اسكرمها قال الشاعر ا راعى
  قلاتص لا يلقحن الايعارة • عواضا ولا يشرين الاغواليا
  والعراض سمة قال يعقوب هو خط فى الفخذعر ضاتة ول منهء رض بعيره عرضا وبعيرذو
  عرا يعارض الشهيرذا الشول بقيه وناقة عرضئة بكسر العين وفتح الراء والذون زائدة
  اذا كان من عادتها ان تشى معارضه للنشاط وقال
  عرضة ليل فى العرضات جنها أى من العرضات كما يقال فلان رجل من الرجال
  ويقال أيضاهو عشى العرضة ويمشى العرضى اذا مشى مشية فى شق فيها بغى من نشاطه
  وتطرت الى فلان ءرضنة أى بمؤخريف وتقول فى تصغير العرضئر يضن تثيت الذون
  لانها ملطقة وتحذف اليناء لانها غير ملحقة وقول أبى ذؤيب فى وصف برق
  كانه فى عراض الشام مصباح أى فى شقه وناحيته والعارض السحاب يعترض فى الافق
  ومنه قوله تعالى هذا عارض عطرنا أى ممطرلنا لانه معرفة لا يجوز أن يكون صفة لعارض وهو
  نكرة والعرب انما تفعل مثل هذا فى الاسماء المشتقة من الافعال دون غيرها قال جرير
  يارب غابطنا لو كان يعرفكم • لاقى مباعدة منكم وحرمانا
  فلا يجوز أن تقول هذا رجل غلا منا وقال اء رابى بعد الفطررب صائمه ان يصومه ورب قائمه
  ن يقومه فعله نعناللنكرة واضافه الى المعرفة ويقال للجبل عارض قال ابو عبيدوبه سمء
  ارض المامة وقال أبو نصر أحدبن حاتم بقال للجراداذا كترقد مر شاعارض قدملا
  الافق والعارض ماعرض من الاعطية قال الراجز⁦(١)⁩
  هل لك والعارض منك عائض • فى هجمة بغدرمنها القابض
  قال الاصمعى يخاطب امرأة رغب فى ذكاحها يقول هل لك فى مائة من الابل اجعلها لامهرا
  يترك منها السائق بعضها لا يقدر أن يجمعها لكثرتها وماعرض منك من العطاه عوّضتك
  منه والعارضة واحدة العوارض وهى الحاجات وفلان ذوعارضة أى ذو جلد وصرامة
  وقدوة على الكلام والعارضة واحدة عوارض السقف وعارضة الباب هى اللخشبة التى
  تسك عضادتيه من فوق محاذية للاسكفة والعارضة الذاقة التى يصيما كسراوحرض فتحر
  يقال بنوفلان لا يأ كاون الا العوارض أى لا يحرون الابل الامن داء يصييها يعمبهسم يذلك
  وتقول العرب لمرجل اذا قرب اليهم حما أعبيط أم عارضة فالعبيط الذى يحر من غير علة قال
  ناود
  اذاء رضت منها كهاة سمينة • فلاتهد منها واتشق وتجيجب
  وعارضنا الانسان صفعتاخذيه وقولهم فلان خفيف العارضين يرادبه خفشعرعارضيه
  وامر أة نقية العارض أى نقية عرض الفم قال برير
  اتذكريوم تصفل عارضيها * بفرع بشامة سقى البشام
  قال أبو نصريعنى به الاسنان ما بعد المنايا والثناياليست من العارض وقال ابن السكيت
  ٤٣٢
  قوله ان اشتهت الخ أحسن من
  قول القاموس ان اشتها هالانه
  اذا اشتها هافضر به الايثبت
  الكرم لها اهتبه عليهمر
  قوله فى الفخذا تظرهامس ٥٣٠
  قوله لا يجوزالح قال مترجمه ولك
  أن تقول هذه اضافة لفظية
  لا تفيد التعريف فتأمل فيه اه
  ١ أبو فح_د الفقمسى وأولة
  ياليل أسقال البريق الوامض'
  قالم روكان الواجب على
  الجوهرى أن يوضحه اكثر عماذكره
  عن الاصمعى لان فسة تقديما
  وتأخيرا والمعنى هل لك مائة
  من الابل يسترمنها القابض
  أى قايضها الذى بسوقها
  لسكثرتها ثم قال والعارض
  عائض أى المعطى بدل بضعك
  عرضاعائض أى آخذء وضا
  منك بالتزويج يسكون كفا لما
  عرض منك ول عضت اعاض
  اذا اعتضت عوضا وعضت
  أعوض اذا ءوضت عوضا
  أى دفعت وقوله عائض من عضت
  بالكسر لا من عضت بإاضم
  وقوله والعارض منسك قال
  ابن برى والمروى والعائض
  منك عائض أى والعوض منك
  عوض كماتة ول الهبة منك هبة
  وفى رواية منه وفى رواية مائة بدل
  هجمة ويستريدل يغدر اه ملصا
