text: "… البخاى سوى هذا الحديث، للكنه أورده فى مواضع. واللّه أعلم. قوله استنصت الناس فيه دليل على وهم من زعم أن إسلام جرير كان قبل موت الذى ع بأربمين يوما، لأن حجمة الوداع كانت قبل وفاته بزكاع بأكثر من ثمانين يوما، …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 108، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
