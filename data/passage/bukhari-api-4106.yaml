label: { ar: "صحيح البخاري 4106 — الأب والأبوة", en: "Sahih al-Bukhari 4106 — the father and fatherhood", ur: "صحیح بخاری 4106 — باپ اور والدیت", es: "Sahih al-Bukhari 4106 — El padre y la paternidad" }
text: "… اللَّهِ رَأَيْتُهُ يَنْقُلُ مِنْ تُرَابِ الْخَنْدَقِ حَتَّى وَارَى عَنِّي الْغُبَارُ جِلْدَةَ بَطْنِهِ، وَكَانَ كَثِيرَ الشَّعَرِ، فَسَمِعْتُهُ يَرْتَجِزُ بِكَلِمَاتِ ابْنِ رَوَاحَةَ، وَهْوَ يَنْقُلُ مِنَ التُّرَابِ يَقُولُ اللَّهُمَّ لَوْلاَ أَنْتَ مَا اهْتَدَيْنَا وَلاَ تَصَدَّقْنَا وَلاَ صَلَّيْنَا فَأَنْزِلَنْ سَكِينَةً عَلَيْنَا وَثَبِّتِ الأَقْدَامَ إِنْ لاَقَيْنَا إِنَّ الأُلَى قَدْ بَغَوْا عَلَيْنَا وَإِنْ أَرَادُوا فِتْنَةً أَبَيْنَا قَالَ ثُمَّ يَمُدُّ صَوْتَهُ بِآخِرِهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 4106، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4106 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4106، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4106 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
