text: "الجزء الثامن من تفسير القرطي جِدهنَّ جِدّ وهَزْلهنّ جِدّ النكاحُ والطلاق والرجعة. قال الترمذيّ: حديث حسن غريب، والعمل على هذا عند أهل العلم من أصحاب النبي ار وغيرهم. قلت: كذا في الحديث والرَّجعة. وفي موطأ مالك عن يحيى بن سعيد …"
