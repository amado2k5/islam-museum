label: { ar: "الموطأ 1579 — يحيى بن سعيد عن سعيد بن المسيب: ثلاث ليس فيهن لعب: النكاح والطلاق والعتق", en: "Muwatta 1579", es: "Muwatta 1579", fr: "Muwatta 1579", ur: "موطا 1579", tr: "El-Muvatta 1579 — Yahya ibn Sa’id, Sa’id ibn al-Musayyab’dan rivayetle: Şaka yapılmaması gereken üç şey vardır: evlilik, boşanma ve köle azat etme.", id: "Al-Muwatta 1579 — Yahya ibn Sa’id berdasarkan riwayat Sa’id ibn al-Musayyab: Ada tiga hal yang tidak boleh dijadikan bahan lelucon: pernikahan, perceraian, dan pembebasan budak." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه قال ثلاث ليس فيهن لعب: النكاح، والطلاق، والعتق. {cite:muwatta-maruf-1997 p.57}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle şöyle buyurduğunu aktarır: \"Şaka yapılmaması gereken üç şey vardır: evlilik, boşanma ve köle azat etme.\" {cite:muwatta-maruf-1997 s.57}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa beliau berkata: \"Ada tiga hal yang tidak boleh dijadikan bahan candaan: pernikahan, perceraian, dan membebaskan seorang budak.\" {cite:muwatta-maruf-1997 p.57}"
