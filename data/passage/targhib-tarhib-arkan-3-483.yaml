text: "… مسلم والترمذى والنسائى وابن ماجه • - وعن ابن عمرما ان النبى كان يقول المسلم أخو المسلم لا يظلمه ولا يخذله ويقول والذى نفسى بيده ماتواد اثنان فيفرق بينهما الأبذنب يحدثه احدها وكان يقول للمسلم على المسلم ست يشمته اذا …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 3، ص 483، يذكر حق المؤمن على المؤمن، ووصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 3, p. 483, that mentions what a believer owes a believer, a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 3، ص 483 کا اقتباس جس میں مومن کا مومن پر حق، مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 3, pág. 483, que menciona la lealtad de un creyente hacia otro, una descripción del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Tarhib wa-l-Tarhib d'al-Mundhiri (tome 3, p. 483) évoquant les devoirs d'un croyant envers un autre et une description du musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 3. cildinin 483. sayfasından, bir müminin diğerine karşı haklarından bahseden ve bir Müslümanı tanımlayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve bir müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Dorongan dan Peringatan), Jilid 3, halaman 483, yang menyebutkan hak-hak seorang mukmin atas mukmin lainnya dan menjelaskan tentang seorang Muslim; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
