text: "… تعلق لهم بالعراق وفارس والمشرق. ولو أراد أن يجعل كسرى رأس الملوك وهو ملك المشرق وقيصر ملك الروم دونه ولذلك جعله جناحان لكان المناسب أن يجعل الجناح الثانى ما يقابله من جهة اليمين كملوك الهند والصين مثلا، لكن دلت الرواية …"
