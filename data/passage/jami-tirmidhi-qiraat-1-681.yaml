text: "… النَّبِيِّ للمِ قَالَ: وَكَانَ ضَرِيرَ البَصَرِ، فَقَالَ: يَا رَسُولَ اللهِ مَا تَأْمُرُنِي؟ إِنِّي ضَرِيرُ البَصَرِ، فَأَنْزَلَ اللّٰه تَعَالَى هَذِهِ الآيَةَ عَالح له غَيّرُ أُوْلِى الضَّرَرِ الآيَةَ، فَقَالَ النَّبِيُّ ايتُوني بالكَتِفِ وَالدَّوَاةِ أَوِ اللَّوْحِ وَالدَّوَاةِ. قَالَ أَبُو عِيسَى : هَذَا حَدِيثٌ …"
