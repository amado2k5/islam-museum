text: "… شرها إستعينوا برقاد الليل على قيام الليل استغفر ربك، وصل أربع ركعات استغفر لي استغفروا له غفر اللّٰه لكم استمتع باهلك استمتعوا استمتعوا بها اسجعا كسجع الاعراب اسرعوا بجنائزكم اسرف رجل على نفسه، فلما حضره الموت أوصى اسعد العجم بالاسلام، …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 6053، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 6053, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 6053 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 1, pág. 6053, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Abd al-Razzaq (tome 1, p. 6053) mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Abdülrazzak'ın Musannaf adlı eserinin Resimli Cilt 1, s. 6053'ten, son vasiyetname ve ölüm saatinden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, hlm. 6053, yang menyebutkan wasiat terakhir dan saat kematian; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
