text: "… وأجرى عليه وزقه وأمن من الفتان رواه مسلم واللفظ له والترمذى والنسائى والطبرانى وزاد وبعث يوم القيامة شهيدا - وعن فضالة بن عبيد أن رسول اللّه قال و كل ميت يختم على عمله الا المرابط في سبيل اللّه فانه ينعى …"
summary:
  ar: "مقطع من الترغيب والترهيب من الحديث الشريف، المجلد المصوَّر 4، ص 442، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), scan volume 4, p. 442, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الترغیب والترہیب من الحدیث الشریف، اسکین جلد 4، ص 442 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), volume numérisé 4, p. 442, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), volumen escaneado 4, p. 442, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Hadislerden Teşvik ve Uyarı\" adlı kitabın 4. cildinin 442. sayfasından, bir övgü ve ölüm ilanı içeren bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü övgü ve ölüm ilanlarından derlenmiştir."
  id: "Cuplikan dari buku \"Dorongan dan Peringatan dari Hadits Mulia,\" Jilid 4, halaman 442, berisi pidato penghormatan dan pengumuman kematian; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan pidato penghormatan dan pengumuman kematian yang paling terkenal."
