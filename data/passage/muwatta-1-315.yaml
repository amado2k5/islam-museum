label: { ar: "الموطأ 315 — عائشة: ما كان يزيد في رمضان ولا غيره على إحدى عشرة ركعة", en: "Muwatta 315", es: "Muwatta 315", fr: "Muwatta 315", ur: "موطا 315", tr: "Al-Muwatta 315 — Aişe: Ramazan ayında veya başka herhangi bir zamanda namazlarını on bir rekattan fazla kılmadı.", id: "Al-Muwatta 315 — Aisyah: Dia tidak menambah salatnya di bulan Ramadan atau di waktu lain melebihi sebelas rakaat." }
text: "يا عائشة إن عيني تنامان ولا ينام قلبي"
summary:
  ar: "يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبي سلمة بن عبد الرحمن، في باب صلاة النبي في الوتر: سأل عائشة كيف كانت صلاة النبي في رمضان، فقالت إنه ما كان يزيد في رمضان ولا في غيره على إحدى عشرة ركعة: يصلي أربعاً لا يُسأل عن حسنهن وطولهن، ثم أربعاً كذلك، ثم ثلاثاً. وسألته عائشة أينام قبل أن يوتر، فقال إن عينيه تنامان ولا ينام قلبه. ويخرّجه المحقق عند البخاري ⁦(1147، 2013، 3569)⁩ ومسلم (2/166) وأبي داود (1341) والنسائي والترمذي في الشمائل وابن خزيمة وابن حبان من طرق أصحاب مالك، ويحيل على التمهيد (21/69). {cite:muwatta-maruf-1997 p.177}"
  tr: "Malik, Vitr namazı bölümünde, Sa'id ibn Abi Sa'id al-Maqburi'den, o da Ebu Seleme ibn Abd al-Rahman'dan rivayetle şöyle nakletmiştir: Peygamberimiz, Aişe'ye Ramazan ayında nasıl namaz kıldığını sormuş, Aişe de şöyle buyurmuştur: \"Ramazan ayında veya başka herhangi bir zamanda on bir rekattan fazla namaz kılmazdı; dört rekat kılardı ve kimse bunların güzelliğini veya uzunluğunu sorgulamazdı, sonra dört rekat daha, sonra üç rekat.\" Aişe, Vitr namazından önce uyuyup uyumadığını sormuş, Peygamberimiz de gözlerinin uyuduğunu, ancak kalbinin uyumadığını söylemiştir. Editör aynı zamanda Buhârî (1147, 2013, 3569), Müslim (2/166), Ebu Davud (1341), en-Nesa'i, el-Tirmizî, el-Şema'il, İbn Huzeyme ve İbn Hibban'ı Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil etmiş ve et-Temhid'e (21/69) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.177}"
  id: "Malik meriwayatkannya dari Sa'id ibn Abi Sa'id al-Maqburi, dari Abu Salamah ibn Abd al-Rahman, dalam surah tentang shalat Witir Nabi: Dia bertanya kepada Aisyah bagaimana Nabi shalat di bulan Ramadhan, dan Aisyah menjawab bahwa beliau tidak pernah shalat lebih dari sebelas rakaat di bulan Ramadhan atau di waktu lain: beliau shalat empat rakaat, dan tidak ada yang mempertanyakan keindahan atau lamanya, kemudian empat rakaat lagi seperti itu, lalu tiga rakaat. Aisyah bertanya kepadanya apakah beliau tidur sebelum shalat Witir, dan beliau menjawab bahwa matanya akan mengantuk, tetapi hatinya tidak. Redaksi juga memasukkannya dalam Bukhari (1147, 2013, 3569), Muslim (2/166), Abu Dawud (1341), al-Nasa'i, al-Tirmidzi dalam al-Shama'il, Ibnu Khuzaymah, dan Ibnu Hibban melalui silsilah sahabat Malik, dan ia merujuk pada al-Tamhid (21/69). {mengutip:muwatta-maruf-1997 hal.177}"
