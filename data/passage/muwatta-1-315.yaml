label: { ar: "الموطأ 315 — عائشة: ما كان يزيد في رمضان ولا غيره على إحدى عشرة ركعة", en: "Muwatta 315" }
text: "يا عائشة إن عيني تنامان ولا ينام قلبي"
summary:
  ar: "يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبي سلمة بن عبد الرحمن، في باب صلاة النبي في الوتر: سأل عائشة كيف كانت صلاة النبي في رمضان، فقالت إنه ما كان يزيد في رمضان ولا في غيره على إحدى عشرة ركعة: يصلي أربعاً لا يُسأل عن حسنهن وطولهن، ثم أربعاً كذلك، ثم ثلاثاً. وسألته عائشة أينام قبل أن يوتر، فقال إن عينيه تنامان ولا ينام قلبه. ويخرّجه المحقق عند البخاري (1147، 2013، 3569) ومسلم (2/166) وأبي داود (1341) والنسائي والترمذي في الشمائل وابن خزيمة وابن حبان من طرق أصحاب مالك، ويحيل على التمهيد (21/69). {cite:muwatta-maruf-1997 p.177}"
