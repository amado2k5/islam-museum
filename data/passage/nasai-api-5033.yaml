label: { ar: "سنن النسائي 5033 — ما عُدّ من الإيمان", en: "Sunan al-Nasa'i 5033 — what is counted as part of faith", ur: "سنن نسائی 5033 — جو ایمان میں سے گنا گیا" }
text: "أَخْبَرَنَا هَارُونُ بْنُ عَبْدِ اللَّهِ قَالَ حَدَّثَنَا مَعْنٌ قَالَ حَدَّثَنَا مَالِكٌ ح وَالْحَارِثُ بْنُ مِسْكِينٍ قِرَاءَةً عَلَيْهِ وَأَنَا أَسْمَعُ عَنْ ابْنِ الْقَاسِمِ أَخْبَرَنِي مَالِكٌ وَاللَّفْظُ لَهُ عَنْ ابْنِ شِهَابٍ عَنْ سَالِمٍ عَنْ أَبِيهِ أَنَّ رَسُولَ اللَّهِ مَرَّ عَلَى رَجُلٍ يَعِظُ أَخَاهُ فِي الْحَيَاءِ فَقَالَ دَعْهُ فَإِنَّ الْحَيَاءَ مِنْ الْإِيمَانِ"
summary:
  ar: "حديث في سنن النسائي، رقم 5033، يذكر ما عُدّ من الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5033 (The Book Of Faith and its Signs), that mentions what is counted as part of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5033، جس میں جو ایمان میں سے گنا گیا کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
