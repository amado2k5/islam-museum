text: "… لا تَفْعَل؛ فإنّك إذا فعلتَ ذلك: هَجَمَت له العينُ، ونَفَهَت له النَّفسُ، إِنَّ لربِّكَ عليك حقًّا، ولنفسكَ عليكَ حقًّا، ولِزَوْرِكَ عليك حقًّا، ولِزَوْحِكَ عليك حقًّا، فآتِ كلَّ ذي حقِّ حقَّه. فالمداومة على قيام جميع الليل ليس بمستحب، بل هو مكروه …"
summary:
