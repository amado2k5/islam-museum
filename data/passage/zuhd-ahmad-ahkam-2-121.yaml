  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zühd) adlı eserinin 2. cildinin 121. sayfasından, müstehaplı ve müstehaplı amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz ameller, görevler, itaat amelleri, müstehaplı ameller, müstehaplı ameller, haram ameller ve küçük günahlar üzerine araştırma yapan bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 2, halaman 121, yang menyebutkan amalan yang dianjurkan dan yang tidak disukai; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang peneliti tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
