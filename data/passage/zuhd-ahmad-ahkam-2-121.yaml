text: "… لا تَفْعَل؛ فإنّك إذا فعلتَ ذلك: هَجَمَت له العينُ، ونَفَهَت له النَّفسُ، إِنَّ لربِّكَ عليك حقًّا، ولنفسكَ عليكَ حقًّا، ولِزَوْرِكَ عليك حقًّا، ولِزَوْحِكَ عليك حقًّا، فآتِ كلَّ ذي حقِّ حقَّه. فالمداومة على قيام جميع الليل ليس بمستحب، بل هو مكروه …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 121، يرد فيه ذكر المستحب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 2, p. 121, whose wording mentions the recommended (mustahabb), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 2، ص 121 کا اقتباس جس میں مستحب، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ahmad ibn Hanbal, volume numérisé 2, p. 121, dont le texte mentionne le recommandé (mustahabb), le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
