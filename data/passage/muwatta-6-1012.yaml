label: { ar: "الموطأ 1012 — مالك عن لحم صيد يوجد على الطريق: يبتاعه المحرم؟ أما ما كان يعترض به فلا بأس، وأما ما كان يُقصد من أجل المحرمين فأكرهه وأنهى عنه", en: "Muwatta 1012" }
summary:
  ar: "سئل مالك عما يوجد من لحوم الصيد على الطريق: هل يبتاعه المحرم؟ فقال: أما ما كان من ذلك يعترض به ولم يصد من أجل المحرمين، فلا بأس بأن يبتاعه المحرم. وأما ما صيد من أجل المحرمين فإني أكرهه وأنهى عنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1142). {cite:muwatta-maruf-1997 p.474} {cite:muwatta-maruf-1997 p.475}"
