label: { ar: "الموطأ 1012 — مالك عن لحم صيد يوجد على الطريق: يبتاعه المحرم؟ أما ما كان يعترض به فلا بأس، وأما ما كان يُقصد من أجل المحرمين فأكرهه وأنهى عنه", en: "Muwatta 1012", es: "Muwatta 1012", fr: "Muwatta 1012", ur: "موطا 1012", tr: "El-Muvatta 1012 — Malik, yolda bulunan av etine ilişkin olarak: İhramlı bir hacının bunu satın alması caiz midir? Dikkat çekmek amacıyla yapılanlarda bir sakınca yoktur. Ancak ihramlıların yararına yapılanlarda ise bunu hoş karşılamam ve yasaklarım.", id: "Al-Muwatta 1012 — Malik tentang daging buruan yang ditemukan di jalan: Apakah diperbolehkan bagi seorang jamaah haji yang sedang ihram untuk membelinya? Adapun yang dimaksudkan untuk menarik perhatian, tidak ada bahayanya. Tetapi adapun yang dimaksudkan untuk kepentingan orang-orang yang sedang ihram, aku tidak menyukainya dan mengharamkannya." }
summary:
  ar: "سئل مالك عما يوجد من لحوم الصيد على الطريق: هل يبتاعه المحرم؟ فقال: أما ما كان من ذلك يعترض به ولم يصد من أجل المحرمين، فلا بأس بأن يبتاعه المحرم. وأما ما صيد من أجل المحرمين فإني أكرهه وأنهى عنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1142). {cite:muwatta-maruf-1997 p.474} {cite:muwatta-maruf-1997 p.475}"
  tr: "Malik'e yolda bulunan av etleri hakkında soru soruldu: İhramlı bir hacının bunu satın alması caiz midir? Cevabı şöyle oldu: \"Tesadüfen yakalanan ve özellikle ihramlı hacılar için avlanmayan etlere gelince, bir hacının bunları satın almasında bir sakınca yoktur. Ancak özellikle ihramlı hacılar için avlanan etlere gelince, ben bunları hoş karşılamam ve yasaklarım.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1142) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.474} {cite:muwatta-maruf-1997 s.475}"
  id: "Malik ditanya tentang daging buruan yang ditemukan di jalan: Apakah diperbolehkan bagi seorang jamaah haji yang sedang ihram untuk membelinya? Beliau menjawab: “Adapun yang tertangkap secara kebetulan dan bukan hasil buruan khusus untuk jamaah haji yang sedang ihram, tidak ada salahnya jika seorang jamaah haji membelinya. Tetapi adapun yang hasil buruannya khusus untuk jamaah haji yang sedang ihram, saya tidak menyukainya dan mengharamkannya.” Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus’ab (1142). {cite:muwatta-maruf-1997 p.474} {cite:muwatta-maruf-1997 p.475}"
