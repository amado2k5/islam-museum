label: { ar: "الموطأ 765 — ابن شهاب: كان العشر يؤخذ من النبط في الجاهلية فألزمهم ذلك عمر", en: "Muwatta 765" }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب على أي وجه كان عمر بن الخطاب يأخذ من النبط العشر، فقال ابن شهاب: كان ذلك يؤخذ منهم في الجاهلية فألزمهم ذلك عمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع عند أبي عبيد في الأموال (1669). {cite:muwatta-maruf-1997 p.378}"
