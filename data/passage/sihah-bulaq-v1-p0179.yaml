text: |-
  ٤٦٢
  ⁦(باب السين)⁩
  انارجد ناعرس الحناط * لتيمة مذمومة الحوّاط * ندعى مع النساج والخياط
  والجمع الاعراس والعرسات وقد أعرس فلان أى اتخذء رسا وأعرس بأهله اذا بنى بها
  وكذلك اذا غشيما ولا تقل عرّس والعامة تقوله قال الراجز يصف حارا
  يعرس ابكارا بها وعنسا * أكرم عرس با٠ة اذ أعرسا
  و•رست البعير أعرسه بالضم عرسا أى شددت عنقه الى ذراءسه وهو بارك واسم ذلك الحيل
  العراس والعرس بالتعريك الدهش وقد عرس الرجل بالكسر أى دهش فه وعرس وعرس
  به أيضالزمه والتعريس نزول القوم فى السة رمن آخر الليسل يقعون فيسه وقعة للاستراحة
  ثم يرتحسلون وأعرسوالفة فيه قليلة والموضع معرّس ومعرس واله ريس بالتشديد والعريسة
  مأوى الاسدوذات العرائس موضع :⁦(عردس)⁩ العرندص من الابل الشديدوناقة
  *رندسة أى قوية طويلة القامة قال الكميت
  أطوى بهنّ سهوب الارض مندلنا * على عرندسة للخرق مسبار
  ⁦( عرطس)⁩ عرطس الرجل مثل عرط زاذاتنحى عن القوم وذل عن منا واتهم وممازعتهم
  وأنشد أبوالغوث وقدأتانى أن عبد اطمرسا • يوعدنى ولور آنى عرطسا
  ( عركس الاعر نكاس الاجتماع تقول عركست الشى اذا بمعت بعضهعلى بعض
  وقد اعر نكس الشعرأى اشتتسواده ⁦(عرمس)⁩ العرمس الصغرة والعرمس الناقة
  الشديدة قال الاصمى شبهت بالصخرة سس) عس يعس عسا وعسسا أى طاف بالليل
  وهو نفض اللسل عن أهسل الريبة فهوعاس وقوم عسمر مثل خادم وخدم وطالب وطلب
  وفى المنسلُ كاب عس خير من كاب ربض واعتس مثل عس وقواهم عمر خبر فلان أى أبطأ
  وعسعس الذئب أى طاف بالليل ويقال أيضاعسعس الليل اذا أقبل ظلامه وقوله تعالى
  والددل اذاءسعس قال الفرّاء أجمع المفسرون على أن معنى عسعس أدبر قال وقال بعض
  أصابنا انه دنامن أوّله وأظلم وكذلك السحاب اذادنا من الارض والعس القدح العظيم
  والرفد أكبر منه وجعه عساص وقواهم جى بالمال من عسك وبسلك لغة فى حسك وبسك
  أبو زيد العسوس الناقة التى ترعى وحدها مثل القسوس وقد عست تعس والعسوس أيضا
  الناقة التى لا تدر حتق تباعد من الناس والاعتساس الاكفساب والطلب والمعس المطاب
  والعسوس الطالب للصيد قال الراجز واللعلع المهتبل العسوس يقال للذئب
  العسعس والعسعاس والعساس لانه يعس بالليل ويطلب ويقال للقنافذ العساعس لسكثرة
  تردّدها بالليل قال أبوعم رو التعسعس الشم وأنشد كخضر الذئب اذا تععا والتعسعم
  أيضاطلب الصيدبالليل وعسعس موضع بالبادية واسم رجل أيضا قال الراجز
  ومسعس نعم الفتق تبياه أى تعتمده عسطس) عسطوس بتكرير العين شجريشب
  الخسيزران قال الشاعر عصاعسطوس لينها واعتدالها (عضرس العضرس
  البردوهوحب الغمام وقال يصف كلاب الصيد
  محرّجة حص كأنّ عيونها • اذا أذن القناص بالصيد عضرشَ
  ويروى مغرثة حصا وفى المشل أبرد من عضرس وكذلك العضارس بالضم قال الشاعر
  ضرل
