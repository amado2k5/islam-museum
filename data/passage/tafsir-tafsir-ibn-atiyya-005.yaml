text: "القلب يوجب فساد العقل متى اختل الدماغ، (فتكون))، نصب بالفاء في جواب الاستفهام صرف الفعل من الجزم إلى النصب، وقوله (فإنها لا تعمى الأبصار)، لفظ مبالغة كأنه قال: ليس العمى عمى العين وإنما العمى حق العمى عمى القلب، ومعلوم أن"
