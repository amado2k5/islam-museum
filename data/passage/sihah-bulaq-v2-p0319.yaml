  *جذم)•
  انثال عليه وانتم جسم فلان أى ذاب مثل انهمّ عن ابن السكيت والثمة بالضم القبضة من
  الحشيش وقولهم ماله ثمّ ولارتم ومايلك غمادلارما قال ابن السكيت فالتم تقاش أساقيه-م
  وآنيتهم والرمّ مرمَة البيت وثم حوف عطف يدل على الترتيب والتراخى وربعا أدنلوا عليها
  التا.كاقال
  ولقد اً مرّ على اللنيم يسعنى • فضيت تمت قلت لا يعنينى
  وثم بمعنى هناك وهوللتبعيد بنزلة هنا للتة ريب ومتمّ الفرس بانتح منقطع سرته والمنممشله
  ابن السكيت أمت العظم تميما وذلك اذا كان عضا فأبنته والتممام الذى اذا أخذ الشئ
