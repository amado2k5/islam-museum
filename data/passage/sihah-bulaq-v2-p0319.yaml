  الانسان قال الراجز
  اذا الكماة جتمواعلى الركب * يجت ياعمر وتبوج الحتطب
  ويقال رجل جثمة وجثامة للنؤم الذى لا يسافر والمجنمة المصبورة الاأنهاقى الطير خاصة
  والارانب وأشباه ذلك تجتم ثم ترمى حتى تقتل وقدنهى عن ذلات أبوزيد الجثمان الجسمان يقال
  ما أحسن جنمان الرجل وحسمانه قال أى جسده قال الممزق العبدى
