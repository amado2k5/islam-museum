text: "الأدوية المفردة باب السين الصنعة فقال فيه: إن شرب أسهل كيموساً غليظاً ونفع من عرق النسا ووجع المفاصل والصرع ونهش الأفعى وشرب الأفيون والسم المسمى تافسيا، ويتغرغر به للخناق. ج: في السكنجبين: إنه أصلح الأشربة لكل مزاج وللأسنان في حفظ …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3149، يذكر الوجع، وأسماء الأمراض، والصرع، وأعضاء البدن، والدواء، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3149, that mentions pain, named diseases, epilepsy, the organs of the body, the drug, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3149 کا اقتباس جس میں درد، بیماریوں کے نام، مرگی، اعضائے بدن، دوا، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
