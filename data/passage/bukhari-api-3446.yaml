label: { ar: "صحيح البخاري 3446 — الأجران", en: "Sahih al-Bukhari 3446 — the double reward", ur: "صحیح بخاری 3446 — دوہرا اجر" }
text: "… حَىٍّ، أَنَّ رَجُلاً، مِنْ أَهْلِ خُرَاسَانَ قَالَ لِلشَّعْبِيِّ. فَقَالَ الشَّعْبِيُّ أَخْبَرَنِي أَبُو بُرْدَةَ عَنْ أَبِي مُوسَى الأَشْعَرِيِّ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" إِذَا أَدَّبَ الرَّجُلُ أَمَتَهُ فَأَحْسَنَ تَأْدِيبَهَا، وَعَلَّمَهَا فَأَحْسَنَ تَعْلِيمَهَا ثُمَّ أَعْتَقَهَا فَتَزَوَّجَهَا، كَانَ لَهُ أَجْرَانِ، وَإِذَا آمَنَ بِعِيسَى ثُمَّ آمَنَ بِي، فَلَهُ أَجْرَانِ، وَالْعَبْدُ إِذَا اتَّقَى رَبَّهُ وَأَطَاعَ مَوَالِيَهُ، فَلَهُ أَجْرَانِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3446، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 3446 (Prophets), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 3446، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
