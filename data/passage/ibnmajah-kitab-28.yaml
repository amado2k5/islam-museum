summary:
  ar: "القسم 28 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصيد»، ويضم فيها النصوص من 3200 إلى 3250 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 28 of Sunan Ibn Majah (Chapters on Hunting) in the division of the open hadith dataset the museum took its reports from: reports 3200 to 3250 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 28، عنوان «کتاب الصید»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3200 تا 3250۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 28 de Sunan Ibn Majah (Capítulos sobre la caza) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3200 al 3250 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
