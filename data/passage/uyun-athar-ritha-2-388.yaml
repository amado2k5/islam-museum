text: "… مهرو أحسن فى مواليك فان رسول الله. إنماو الاك ذلك لتحمن فيهم فلما أكثروا قال لقد آن لسعد أن لا يأخذه فى الله لومة لائم فرجع بعض من كان معه من قومه الى دار إف. عبد الاشهل فنعى اليهم رجال …"
summary:
  ar: "مقطع من عيون الأثر في فنون المغازي والشمائل والسير، المجلد المصوَّر 2، ص 388، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar, scan volume 2, p. 388, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "عیون الاثر فی فنون المغازی والشمائل والسیر، اسکین جلد 2، ص 388 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar, volume numérisé 2, p. 388, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar, volumen escaneado 2, p. 388, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Askeri Seferlerin Sanatlarında, Özelliklerinde ve Biyografilerinde Geleneklerin Özü\" adlı eserin 2. Resimli Cilt, s. 388'inden bir alıntı; bir ağıt ve ölüm ilanı içeriyor; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Inti Tradisi dalam Seni Ekspedisi Militer, Karakteristik, dan Biografi,\" Volume Bergambar 2, hlm. 388, berisi elegi dan pengumuman kematian; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
