text: "… الخمس، وبر الوالدين، وصلة الرحم، أو على سبيل الندب كالنوافل وصدقات التطوع ومنهم من جعله أشمل وأعم من ذلك فقال: هو اسم جامع لكل ما عرف من طاعة اللّٰه والتقرب إليه، والإحسان إلى الناس بكل ما ندب إليه الشرع، ونهى …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 3، ص 250، يرد فيه ذكر طاعة الله ورسوله، والمندوب، والنافلة والنوافل، والتطوع، والطاعة، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 3, p. 250, whose wording mentions obedience to God and His Messenger, the recommended (mandub), the supererogatory (nafila), the voluntary act (tatawwu'), obedience, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 3، ص 250 کا اقتباس جس میں اللہ اور اس کے رسول کی اطاعت، مندوب، نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩، اطاعت، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 3, p. 250, dont le texte mentionne l'obéissance à Dieu et à Son Messager, le recommandé (mandub), le surérogatoire (nafila), l'acte volontaire (tatawwu'), l'obéissance, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 3, p. 250, cuyo texto menciona la obediencia a Dios y a Su Mensajero, lo recomendado (mandub), lo supererogatorio (nafila), el acto voluntario (tatawwu'), la obediencia, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 3, sayfa 250'den bir alıntı, Allah'a ve Resulüne itaat, tavsiye edilen ibadetler, nafile ibadetler ve gönüllü ibadetlerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir, taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Bu metin, farz ibadetler, görevler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram edilen ibadetler ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 3 Bergambar, halaman 250, menyebutkan ketaatan kepada Allah dan Rasul-Nya, amalan yang dianjurkan, amalan sunnah, dan ibadah sukarela. Kutipan ini berasal dari versi yang dapat dibaca mesin dan dipindai, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
