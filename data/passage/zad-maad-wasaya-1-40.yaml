text: "… لحسان بن ثابت، وأهدى له جارية أخرى، وألفَ مثقالٍ ذهباً، وعشرين ثوباً من قباطي مصر، وبغلة شهباء وهي دُلدل، وحماراً أشهب، وهو عُفير، وغلاماً خصياً يقال له : مابور. وقيل : هو ابن عمِ مارية، وفرساً وهو اللزاز، وقدحاً من …"
summary:
