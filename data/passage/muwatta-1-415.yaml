text: "صلى عام الفتح ثماني ركعات ملتحفاً في ثوب واحد"
summary:
  ar: "أول حديث في باب صلاة الضحى. يرويه يحيى عن مالك عن موسى بن ميسرة عن أبي مرة مولى عقيل بن أبي طالب أن أم هانئ بنت أبي طالب أخبرته أن النبي صلى عام فتح مكة ثماني ركعات ملتحفاً في ثوب واحد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وعثمان بن عمر عند أحمد ومحمد بن الحسن، ويحيل على التمهيد (13/184). {cite:muwatta-maruf-1997 p.216} {cite:muwatta-maruf-1997 p.217}"
