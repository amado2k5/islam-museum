label: { ar: "الموطأ 922 — عمر بن الخطاب وجد ريح طيب وهو بالشجرة فسأل: ممن ريح هذا الطيب؟ فقال معاوية: مني يا أمير المؤمنين، فقال عمر: عزمت عليك لترجعن فلتغسلنه", en: "Muwatta 922", es: "Muwatta 922", fr: "Muwatta 922", ur: "موطا 922", tr: "El-Muvatta 922 — Ömer ibn el-Hattab bir ağacın altındayken hoş bir koku duydu ve sordu: \"Bu koku kimden geliyor?\" Muaviye cevap verdi: \"Ey Müminlerin Emiri, benden geliyor.\" Ömer dedi ki: \"Sana yalvarıyorum, geri dön ve onu yıka.\"", id: "Al-Muwatta 922 — Umar bin al-Khattab mencium aroma yang harum ketika berada di bawah pohon, lalu ia bertanya: \"Aroma ini dari siapa?\" Mu'awiyah menjawab: \"Dari saya, wahai Amirul Mukminin.\" Umar berkata: \"Aku menyuruhmu kembali dan membersihkannya.\"" }
text: "عزمت عليك لترجعن فلتغسلنه"
summary:
  ar: "يرويه مالك عن نافع عن أسلم مولى عمر بن الخطاب، أن عمر بن الخطاب وجد ريح طيب وهو بالشجرة، فقال: ممن ريح هذا؟ فقال معاوية بن أبي سفيان: مني يا أمير المؤمنين. فقال عمر: منك؟ لعمر الله. فقال معاوية: إن أم حبيبة طيبتني يا أمير المؤمنين. فقال عمر: عزمت عليك لترجعن فلتغسلنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1057) وسويد (492) والطحاوي وابن وهب والشيباني (402). {cite:muwatta-maruf-1997 p.443}"
  tr: "Malik, Ömer ibn el-Hattab'ın azatlı kölesi Aslam'dan rivayet ettiğine göre, Ömer ibn el-Hattab bir ağacın altında iken hoş bir koku duydu. \"Bu koku kimin?\" diye sordu. Muaviye ibn Ebu Sufyan, \"Ey Müminlerin Emiri, benden geliyor\" diye cevap verdi. Ömer, \"Senden mi? Allah'a yemin ederim!\" dedi. Muaviye, \"Ey Müminlerin Emiri, Ümmü Habibe bana güzel koku sürdü\" dedi. Ömer, \"Sana yemin ederim ki, geri dön ve yıka.\" dedi. Araştırmacı, bu rivayetin Malik'ten Ebu Musab (1057), Suveyd (492), el-Tahavi, İbn Vahb ve el-Şeybani (402) tarafından da nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.443}"
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Aslam, budak yang dibebaskan oleh Umar ibn al-Khattab, bahwa Umar ibn al-Khattab mencium aroma yang harum ketika berada di bawah pohon. Beliau bertanya, “Aroma siapakah ini?” Mu’awiyah ibn Abi Sufyan menjawab, “Ini dari saya, wahai Amirul Mukminin.” Umar berkata, “Darimu? Demi Allah!” Mu’awiyah berkata, “Umm Habibah yang memberi saya wewangian, wahai Amirul Mukminin.” Umar berkata, “Aku suruh engkau kembali dan membersihkannya.” Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus’ab (1057), Suwaid (492), al-Tahawi, Ibn Wahb, dan al-Shaybani (402). {cite:muwatta-maruf-1997 p.443}"
