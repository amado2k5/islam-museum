label: { ar: "الموطأ 922 — عمر بن الخطاب وجد ريح طيب وهو بالشجرة فسأل: ممن ريح هذا الطيب؟ فقال معاوية: مني يا أمير المؤمنين، فقال عمر: عزمت عليك لترجعن فلتغسلنه", en: "Muwatta 922" }
text: "عزمت عليك لترجعن فلتغسلنه"
summary:
  ar: "يرويه مالك عن نافع عن أسلم مولى عمر بن الخطاب، أن عمر بن الخطاب وجد ريح طيب وهو بالشجرة، فقال: ممن ريح هذا؟ فقال معاوية بن أبي سفيان: مني يا أمير المؤمنين. فقال عمر: منك؟ لعمر الله. فقال معاوية: إن أم حبيبة طيبتني يا أمير المؤمنين. فقال عمر: عزمت عليك لترجعن فلتغسلنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1057) وسويد (492) والطحاوي وابن وهب والشيباني (402). {cite:muwatta-maruf-1997 p.443}"
