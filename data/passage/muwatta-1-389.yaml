label: { ar: "الموطأ 389 — ابن عمر في صلاة السفر: إنما نفعل كما رأيناه يفعل", en: "Muwatta 389" }
text: "إن الله عز وجل بعث إلينا محمداً ولا نعلم شيئاً، فإنما نفعل كما رأيناه يفعل"
summary:
  ar: "أول حديث في باب قصر الصلاة في السفر. يرويه يحيى عن مالك عن ابن شهاب عن رجل من آل خالد بن أسيد: سأل عبد الله بن عمر أنهم يجدون صلاة الخوف وصلاة الحضر في القرآن ولا يجدون صلاة السفر، فقال ابن عمر إن الله بعث إليهم محمداً وهم لا يعلمون شيئاً فإنما يفعلون كما رأوه يفعل. وينقل المحقق عن ابن عبد البر أن مالكاً لم يسم السائل وأسقط من الإسناد رجلاً، وأن السائل أمية بن عبد الله بن خالد بن أسيد، وأن ابن شهاب يرويه عن عبد الله بن أبي بكر بن عبد الرحمن بن الحارث عن أمية عن ابن عمر (التمهيد 11/161)؛ ويرى المحقق أن حديث الزهري عن عبد الله بن أبي بكر ضعيف لضعف عبد الله، ويخرّجه عند عبد الرزاق وأحمد وابن ماجه (1066) والنسائي وابن خزيمة وابن حبان والحاكم. {cite:muwatta-maruf-1997 p.209}"
