label: { ar: "الموطأ 389 — ابن عمر في صلاة السفر: إنما نفعل كما رأيناه يفعل", en: "Muwatta 389", es: "Muwatta 389", fr: "Muwatta 389", ur: "موطا 389", tr: "El-Muvatta 389 — İbn Ömer'in yolculuk namazı hakkındaki görüşü: Biz ancak O'nun yaptıklarını yaptığımız gibi yaparız.", id: "Al-Muwatta 389 — Ibnu Umar tentang salat musyawarah: Kita hanya melakukan seperti yang kita lihat dia lakukan" }
text: "إن الله عز وجل بعث إلينا محمداً ولا نعلم شيئاً، فإنما نفعل كما رأيناه يفعل"
summary:
  ar: "أول حديث في باب قصر الصلاة في السفر. يرويه يحيى عن مالك عن ابن شهاب عن رجل من آل خالد بن أسيد: سأل عبد الله بن عمر أنهم يجدون صلاة الخوف وصلاة الحضر في القرآن ولا يجدون صلاة السفر، فقال ابن عمر إن الله بعث إليهم محمداً وهم لا يعلمون شيئاً فإنما يفعلون كما رأوه يفعل. وينقل المحقق عن ابن عبد البر أن مالكاً لم يسم السائل وأسقط من الإسناد رجلاً، وأن السائل أمية بن عبد الله بن خالد بن أسيد، وأن ابن شهاب يرويه عن عبد الله بن أبي بكر بن عبد الرحمن بن الحارث عن أمية عن ابن عمر ⁦(التمهيد 11/161)⁩؛ ويرى المحقق أن حديث الزهري عن عبد الله بن أبي بكر ضعيف لضعف عبد الله، ويخرّجه عند عبد الرزاق وأحمد وابن ماجه (1066) والنسائي وابن خزيمة وابن حبان والحاكم. {cite:muwatta-maruf-1997 p.209}"
  tr: "Yolculuk sırasında namazları kısaltma konusundaki bölümün ilk hadisi. Yahya, Malik'ten, o da İbn Şihab'tan, o da Halid ibn Asid'in ailesinden bir kişiden rivayet etmiştir: Abdullah ibn Umar'a sordu: \"Kur'an'da korku namazını ve yolculuk yapmayanların namazını buluyorlar, ama yolculuk namazını bulamıyorlar.\" İbn Umar cevap verdi: \"Allah, onlar hiçbir şey bilmezken Muhammed'i onlara gönderdi, bu yüzden sadece onu gördükleri gibi yapıyorlar.\" Editör, İbn Abd al-Barr'ın şöyle dediğini aktarıyor: Malik, soruyu soranın adını vermemiş ve rivayet zincirinden bir kişiyi çıkarmıştır; soruyu soran kişi Ümeyye ibn Abdullah ibn Halid ibn Asid'dir; İbn Şihab ise bunu Abdullah ibn Abi Bekr ibn Abd al-Rahman ibn al-Harith'ten, o da Ümeyye'den, o da İbn Umar'dan rivayet etmiştir (el-Temhid 11/161). Editör, Abdullah ibn Abi Bakr'dan rivayet edilen el-Zuhri hadisini, Abdullah'ın zayıflığı nedeniyle zayıf kabul eder ve onu Abd el-Razzaq, Ahmed, İbn Majah (1066), el-Nasa'i, İbn Huzeyme, İbn Hibban ve el-Hakim'in hadis derlemelerine dahil eder. {cite:muwatta-maruf-1997 s.209}"
  id: "Hadits pertama dalam bab tentang mempersingkat salat saat bepergian. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari seorang laki-laki dari keluarga Khalid ibn Asid: Dia bertanya kepada Abdullah ibn Umar, \"Mereka menemukan salat ketakutan dan salat orang yang tidak bepergian dalam Al-Quran, tetapi mereka tidak menemukan salat perjalanan.\" Ibn Umar menjawab, \"Allah mengutus Muhammad kepada mereka ketika mereka tidak tahu apa-apa, jadi mereka hanya melakukan apa yang mereka lihat dia lakukan.\" Editor mengutip Ibn Abd al-Barr yang mengatakan bahwa Malik tidak menyebutkan nama penanya dan menghilangkan seorang laki-laki dari sanad, dan bahwa penanya adalah Umayya ibn Abdullah ibn Khalid ibn Asid, dan bahwa Ibn Shihab meriwayatkannya dari Abdullah ibn Abi Bakr ibn Abd al-Rahman ibn al-Harith, dari Umayya, dari Ibn Umar (al-Tamhid 11/161). Penyunting menganggap hadits al-Zuhri yang diriwayatkan oleh Abdullah ibn Abi Bakr lemah karena kelemahan Abdullah, dan ia memasukkannya ke dalam kumpulan hadits Abd al-Razzaq, Ahmad, Ibn Majah (1066), al-Nasa'i, Ibn Khuzaymah, Ibn Hibban, dan al-Hakim. {cite:muwatta-maruf-1997 p.209}"
