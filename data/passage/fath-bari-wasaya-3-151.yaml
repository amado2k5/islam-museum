text: "… إلى أن ذلك من آخر أخواله، وهو يناسب حديث عمرو جن الحارث فى الباب الاول أنه لم يترك دينارا ولا درهما - يإب بَدثِ النبئِ ورطاع أسامةَ بن زيدٍما فى مرضهِ الذى تُوفىَ فيه اا بياض بالاصل"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 151، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
