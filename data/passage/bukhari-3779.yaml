label: { ar: "البخاري 3779 — لولا الهجرة لكنت امرءاً من الأنصار", en: "Bukhari 3779 — Were it not for the hijra I would be one of the Ansar" }
text: "قال رسول الله: «لو أن الأنصار سلكوا وادياً — أو شعباً — لسلكت وادي الأنصار، ولولا الهجرة لكنت امرءاً من الأنصار»"
summary:
  ar: "في كتاب مناقب الأنصار؛ رواية أبي هريرة في حب النبي للأنصار وموالاتهم، وتبعه أبو هريرة بقوله «ما ظلم بأبي وأمي، آووه ونصروه». من أشهر نصوص فضل الأنصار."
