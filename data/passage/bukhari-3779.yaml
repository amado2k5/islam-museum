label: { ar: "البخاري 3779 — لولا الهجرة لكنت امرءاً من الأنصار", en: "Bukhari 3779 — Were it not for the hijra I would be one of the Ansar", es: "Bukhari 3779 — Si no fuera por la hijra, yo sería uno de los Ansar", fr: "Bukhari 3779 — Sans l'Hégire, je serais un Ansar", ur: "بخاری 3779 - اگر حجرہ نہ ہوتا تو میں انصار میں سے ہوتا", tr: "Buhari 3779 — Hicret olmasaydı, ben de Ensar'dan biri olurdum.", id: "Al-Bukhari 3779 — Seandainya bukan karena Hijrah, aku pasti termasuk golongan Ansar." }
text: "قال رسول الله: «لو أن الأنصار سلكوا وادياً — أو شعباً — لسلكت وادي الأنصار، ولولا الهجرة لكنت امرءاً من الأنصار»"
summary:
  ar: "في كتاب مناقب الأنصار؛ رواية أبي هريرة في حب النبي للأنصار وموالاتهم، وتبعه أبو هريرة بقوله «ما ظلم بأبي وأمي، آووه ونصروه». من أشهر نصوص فضل الأنصار."
  tr: "\"Manaqib al-Ansar\" (Ensar'ın Faziletleri) adlı kitapta, Ebu Hurayra'nın Peygamberimizin Ensar'a olan sevgisi ve bağlılığı hakkında bir rivayeti yer almaktadır; ardından Ebu Hurayra'nın şu sözü gelmektedir: \"Ona haksızlık edilmedi, babam ve annem ona feda olsun; onu korudular ve desteklediler.\" Bu, Ensar'ı öven en meşhur metinler arasındadır."
  id: "Dalam kitab \"Manaqib al-Ansar\" (Keutamaan Kaum Ansar), terdapat riwayat dari Abu Hurayrah tentang kecintaan dan kesetiaan Nabi kepada kaum Ansar, diikuti dengan pernyataan Abu Hurayrah, \"Beliau tidak dizalimi, semoga ayah dan ibuku berkorban untuknya; mereka melindungi dan mendukungnya.\" Ini adalah salah satu teks paling terkenal yang memuji kaum Ansar."
