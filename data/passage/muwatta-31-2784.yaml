label: { ar: "الموطأ 2784 — ابن عمر يقدم عشاءه ولا يعجل عن طعامه حتى يقضي حاجته", en: "Muwatta 2784", es: "Muwatta 2784", fr: "Muwatta 2784", ur: "موطا 2784", tr: "El-Muvatta 2784 — İbn Ömer yemeğini yer ve ihtiyacını gidermeden yemeğini bırakmazdı.", id: "Al-Muwatta 2784 — Ibnu Umar biasa menyajikan makan malamnya dan tidak terburu-buru meninggalkan tempat makannya sampai ia selesai buang air." }
summary:
  ar: "يروي مالك عن نافع أن ابن عمر كان يقرب إليه عشاؤه، فيسمع قراءة الإمام وهو في بيته، فلا يعجل عن طعامه حتى يقضي حاجته منه. {cite:muwatta-maruf-1997 p.564} {cite:muwatta-maruf-1997 p.565}"
  tr: "Malik, Nafi'den rivayetle İbn Ömer'e akşam yemeği getirilir ve o, evindeyken imamın Kur'an okumasını dinlerdi, ancak yemeğini bitirene kadar oradan ayrılmazdı. {cite:muwatta-maruf-1997 s.564} {cite:muwatta-maruf-1997 s.565}"
  id: "Malik meriwayatkan dari Nafi' bahwa Ibnu Umar biasa meminta makan malamnya diantarkan kepadanya, dan dia akan mendengarkan Imam membaca Al-Quran di rumahnya, namun dia tidak akan terburu-buru meninggalkan makanannya sampai dia selesai makan. {cite:muwatta-maruf-1997 p.564} {cite:muwatta-maruf-1997 p.565}"
