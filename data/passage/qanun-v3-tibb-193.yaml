text: "… بعسل والشربة مثقال إلى درهمين بعد تنقية البدن، فإن أخذ منه مع مثله دواء المسك لم تخف غائلته فإنه باد زهره. صفة المعجون المسمى بزرجلي الأكبر : وهو الجوانداران النافع من الجذام والبرص، والبهق والقوباء، والماء الأصفر، والحكّة والجرب العتيق، …"
