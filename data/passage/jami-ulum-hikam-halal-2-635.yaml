text: "… ذلك في الكلام على حديث : الحلال بيِّن والحرام بيِّن، وبينهما أمورٌ مشتبهات. وقوله في الأشياء التي سكت عنها : رحمة من غير نسيان يعني : أنَّه إنَّما سكت عن ذكرها رحمةً بعباده ورفقاً؛ حيث لم يحرِّمها عليهم حتّى يُعاقبَهم …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 635، يذكر الحلال، والحرام، وما حُرّم، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 635, that mentions the lawful, the unlawful, what was made unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 635 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
