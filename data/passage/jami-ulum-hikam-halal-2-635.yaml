text: "… ذلك في الكلام على حديث : الحلال بيِّن والحرام بيِّن، وبينهما أمورٌ مشتبهات. وقوله في الأشياء التي سكت عنها : رحمة من غير نسيان يعني : أنَّه إنَّما سكت عن ذكرها رحمةً بعباده ورفقاً؛ حيث لم يحرِّمها عليهم حتّى يُعاقبَهم …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 635، يذكر الحلال، والحرام، وما حُرّم، والشبهات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 635, that mentions the lawful, the unlawful, what was made unlawful, the doubtful matters; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 635 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا، مشتبہ امور کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen 2, pág. 635, que menciona lo lícito, lo ilícito, lo que se prohibió y los asuntos dudosos; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Jami' al-'Ulum wa-l-Hikam d'Ibn Rajab (tome 2, p. 635) mentionnant le licite, l'illicite, ce qui a été rendu illicite et les points douteux. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Halal and Haram Browser."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 635. sayfasından, helal, haram, yasak ve şüpheli olan konuları ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 635, yang membahas tentang apa yang diperbolehkan (halal), haram, dilarang, dan yang diragukan; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
