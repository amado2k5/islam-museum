text: |-
  ٥٨٥
  تلاعب مشنى حضرمى كأنه * تعمج شيطان بدى خروع قضر
  والحراع بالضم جنون الناقة عن الكسائى يقال ناقة مخروعة وانخرءت كتفه لغة
  فى انخلمت واناراعة لغد فى الخلاعة وهى الدعارة خزع خزع فلان عن أصحابه يخزع
  خزعا أى تخلف وتخزع مثله وخزاعة حمن الازد سمواذلك لات الازد لما خرجت من مكة
  لتتفرّق فى اليلاد تخلفت عنهم خزاعة وأقامت بها قال الشاعر .
  فلماهبطما بطن ورّتخزعت ، خزاعة عنا فى حاول كراكر
  وتخزعنا الشئ بيتذا أى اقتسمناه قطعا واختزعته عن القوم أى قطعته عنهم وانخزع
  الحبل انقطع من ذصفه ولا بال ذلك اذا انقطع من طرفه وخزعنى ظلع فى رجلى تخزيعا أى
  فطعنى عن المشى ووجل خزعة مثال همزة أى عوقة والخوزعة رملة تتقطع من معظم الرمل
  ⁦(خشع)⁩ الخشوع الخضوع يقال خشع واختشع وخشع بيصر، أى غضه وبلدة خاشعة
  أى مغيرّة لا منزل بها ومكان خاشع وانحشعة مثال الصبرا كمة متواضعة وفى الحديث كانت
  الارض خشعة على الماءثم دحيت والتضتع تكاف الخشوع ⁦(خضع)⁩ الخضوع التطامن
  والتواضع يقال خضع واختضع وأخضعتنى اليك الحاجة ورجل خضعة مثال همزة أى
  بخضع اكل أحد وخضع النجم أى مال للمغيب وانهضيعة صوت بان الدابة ولا يبى منه
  فعل قال الشاءر كان خضيعة بطن الجواد * وعوعة الذئب فى قدفد
  وقولهم سمعت للسياط خضعة وللسيوف بضعة فانلخضعة وقع السياط والبضع القطع
  وأما قول لبيد والضاربون الهام تحت الخيضعة فان أباعبيد -كى عن القراءانها
  البيضة وحكى سلمة عن المفرّاء انه الصوت فى الحرب والاخضع الذى فى عنقه خضوع وتطامن
  خلقة يقال فرس اخضع بين الخضع وظليم اخضع وقوم خضع الرقاب جمع خضوع أى خاضع
  قال الشاءر ا فرزدق
  واذا الرجال رأ وايزيدرايتهم • خضع الرقاب نواكس الابصار
  فع خفع الرجل خفعا أى ديربه فسقط من جوع وغيره قال الشاعر ج ير
  ١ وغدوا وضيف بنى عقال يخقع
  واتخقعت كبدده استرخت من الجوع ورقت
  ⁦( خلع)⁩ خلع توبه ونعله وقائده خلها وخلع عليه خلعة وخالع اهر أنه خلعا بالضم والخلعة
  خيار المال وينشديت جرير بضم الخاء
  من شاء بابعته مالى وخلعته * ما تكمل التيم فى ديواتهم سطرا
  وخلع الوالى أى عزل وخالعت المرأة بعلها ارادته على طلاقها يسذل منهاله ذهي خالع ا
  والاسم الخلعة وقد تخالها واختاعت فهى مختلعة وأماقول الشاءريخاطب إمر أنه
  ان الرزيما ألالاذا • هرالمخالع أقدح اليسر
  فهو المقسامر لانه يمر خلعته وقوله هتزأى كره والخلع لحم يطبخ بالتوابل ثم يجعل فى القرف
  وهو وعاء من جاد وخلع السنبل أى صارله سفا وخلع الغلام كبرزبه وتخالع القوم
  اذا نقضوا الحلف بينهم والخالع من الرطب المنسبت ويقال بعير به خالع وهو الذى لا يقدر
  على أن يثوراذا جلس الرجل على غراب وركه والتخلع التفكان فى المشبة ورجل مخلع
  ١٤٧
  صداح
  يشون قد نفخ الخرير يطوتهسم
