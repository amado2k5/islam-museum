text: "إن تستفتحوا الآية روى الحاكم عن عبد الله بن ثعلبة ابن صغير قال كان المستفتح أبا جهل فإنه قال حين التقى القوم اللهم أينا كان أقطع لرحم وأتى بما لا يعرف فاحنه الغداة وكان ذلك استفتاحا فأنزل الله إن تستفتحوا فقد جاءكم الفتح إلى قوله"
