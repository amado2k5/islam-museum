label: { ar: "الموطأ 736 — مالك: من باع زرعه وقد صلح ويبس في أكمامه فعليه زكاته وليس على المشتري زكاة", en: "Muwatta 736", es: "Muwatta 736", fr: "Muwatta 736", ur: "موطا 736", tr: "Al-Muwatta 736 — Malik: Kim ürününü olgunlaşıp kuruduktan sonra, kabukları içinde satarsa zekâtını ödemek zorundadır; ancak alıcı zekât ödemekle yükümlü değildir.", id: "Al-Muwatta 736 — Malik: Barang siapa menjual hasil panennya setelah matang dan kering dalam selubungnya, wajib membayar zakatnya, tetapi pembeli tidak wajib membayar zakat." }
summary:
  ar: "قول لمالك: من باع زرعه وقد صلح ويبس في أكمامه فعليه زكاته، وليس على الذي اشتراه زكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.368}"
  tr: "Malik şöyle demiştir: \"Kim hasadını olgunlaşıp kuruduktan sonra, kozalaklarında satarsa zekâtını ödemekle yükümlüdür; fakat hasadı satın alan kişi zekât ödemekle yükümlü değildir.\" Araştırmacı, bu rivayetin Ebu Mus'ab tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.368}"
  id: "Malik berkata: Barang siapa menjual hasil panennya setelah matang dan kering dalam selubungnya, wajib membayar zakat atasnya, tetapi pembelinya tidak wajib membayar zakat. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.368}"
