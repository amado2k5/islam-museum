label: { ar: "صحيح مسلم 7192 — الأب والأبوة", en: "Sahih Muslim 7192 — the father and fatherhood", ur: "صحیح مسلم 7192 — باپ اور والدیت", es: "Sahih Muslim 7192 — El padre y la paternidad", fr: "Sahih Muslim 7192 — Le père et la paternité" }
text: "حَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا جَرِيرٌ، عَنْ سُهَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" رَأَيْتُ عَمْرَو بْنَ لُحَىِّ بْنِ قَمَعَةَ بْنِ خِنْدِفَ أَبَا بَنِي كَعْبٍ هَؤُلاَءِ يَجُرُّ قُصْبَهُ فِي النَّارِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7192، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7192 (The Book of Paradise, its Description, its Bounties and its Inhabitants), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7192، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 7192 (El Libro del Paraíso, su Descripción, sus Bendiciones y sus Habitantes), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 7192 (Le Livre du Paradis, sa description, ses bienfaits et ses habitants), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
