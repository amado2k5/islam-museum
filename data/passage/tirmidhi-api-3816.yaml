text: "… بْنَ زَيْدٍ فَطَعَنَ النَّاسُ فِي إِمَارَتِهِ فَقَالَ النَّبِيُّ \" إِنْ تَطْعَنُوا فِي إِمَارَتِهِ فَقَدْ كُنْتُمْ تَطْعَنُونَ فِي إِمْرَةِ أَبِيهِ مِنْ قَبْلُ وَايْمُ اللَّهِ إِنْ كَانَ لَخَلِيقًا لِلإِمَارَةِ وَإِنْ كَانَ مِنْ أَحَبِّ النَّاسِ إِلَىَّ وَإِنَّ هَذَا مِنْ أَحَبِّ النَّاسِ إِلَىَّ بَعْدَهُ \". هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. حَدَّثَنَا عَلِيُّ بْنُ حُجْرٍ، قَالَ حَدَّثَنَا إِسْمَاعِيلُ بْنُ جَعْفَرٍ، عَنْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3816، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3816 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3816، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
