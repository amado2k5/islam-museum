label: { ar: "الموطأ 2015 — مالك: لا يصلح القراض إلا في العين من الذهب أو الورق، ولا يكون في شيء من العروض، وأما الربا فإنه لا يكون فيه إلا الرد أبدا، ولا يجوز منه قليل ولا كثير، ويستشهد مالك بآية في سورة البقرة في رد الربا", en: "Muwatta 2015" }
summary:
  ar: "قال مالك: لا يصلح القراض إلا في العين من الذهب أو الورق، ولا يكون في شيء من العروض، ومن البيوع ما لا يجوز إذا تفاوت أمره وتفاحش رذه. فأما الربا، فإنه لا يكون فيه إلا الرد أبدا، ولا يجوز منه قليل ولا كثير، ولا يجوز فيه ما يجوز في غيره. ويستشهد مالك بالآية التي في سورة البقرة في أن لرب المال رأس ماله دون زيادة. {cite:muwatta-maruf-1997 p.223} {cite:muwatta-maruf-1997 p.224}"
