label: { ar: "الموطأ 2015 — مالك: لا يصلح القراض إلا في العين من الذهب أو الورق، ولا يكون في شيء من العروض، وأما الربا فإنه لا يكون فيه إلا الرد أبدا، ولا يجوز منه قليل ولا كثير، ويستشهد مالك بآية في سورة البقرة في رد الربا", en: "Muwatta 2015", es: "Muwatta 2015", fr: "Muwatta 2015", ur: "موطا 2015", tr: "Al-Muwatta 2015 — Malik: Kâr paylaşımı anlaşması (kırad) yalnızca altın veya gümüşle geçerlidir, başka hiçbir mal türüyle geçerli değildir. Faiz (riba) ise yalnızca geri ödenebilir; ne az ne de çok miktarda faiz caiz değildir. Malik, faizin geri ödenmesiyle ilgili olarak Bakara Suresi'nde bir ayet zikrediyor.", id: "Al-Muwatta 2015 — Malik: Perjanjian bagi hasil (qirad) hanya sah dengan emas atau perak, dan tidak dengan bentuk barang dagangan lainnya. Adapun riba, hanya dapat dikembalikan; baik jumlah kecil maupun besar tidak diperbolehkan. Malik mengutip sebuah ayat dalam Surah Al-Baqarah mengenai pengembalian riba." }
summary:
  ar: "قال مالك: لا يصلح القراض إلا في العين من الذهب أو الورق، ولا يكون في شيء من العروض، ومن البيوع ما لا يجوز إذا تفاوت أمره وتفاحش رذه. فأما الربا، فإنه لا يكون فيه إلا الرد أبدا، ولا يجوز منه قليل ولا كثير، ولا يجوز فيه ما يجوز في غيره. ويستشهد مالك بالآية التي في سورة البقرة في أن لرب المال رأس ماله دون زيادة. {cite:muwatta-maruf-1997 p.223} {cite:muwatta-maruf-1997 p.224}"
  tr: "Malik şöyle demiştir: Kâr paylaşımı yalnızca altın veya gümüşle caizdir, başka hiçbir malla caiz değildir. Değeri tutarsız veya aşırı olan bazı satışlar caiz değildir. Faiz ise ancak geri ödenir; ne az ne de çok miktarda caizdir ve diğer işlemlerle aynı kurallara tabi değildir. Malik, sermaye sahibinin herhangi bir artış olmaksızın asıl sermayesine hak kazandığı görüşünü desteklemek için Bakara Suresi'ndeki ayeti zikreder. {cite:muwatta-maruf-1997 s.223} {cite:muwatta-maruf-1997 s.224}"
  id: "Malik berkata: Bagi hasil hanya diperbolehkan dengan emas atau perak, dan tidak dengan barang dagangan lainnya. Beberapa penjualan tidak diperbolehkan jika nilainya tidak konsisten dan nilainya berlebihan. Adapun riba, hanya dapat dikembalikan; baik jumlah kecil maupun besar tidak diperbolehkan, dan tidak tunduk pada aturan yang sama seperti transaksi lainnya. Malik mengutip ayat dalam Surah Al-Baqarah untuk mendukung pandangan bahwa pemilik modal berhak atas modal awalnya tanpa penambahan apa pun. {cite:muwatta-maruf-1997 p.223} {cite:muwatta-maruf-1997 p.224}"
