text: "… هذه الملابس رزقه ذهب الشيخ، وهو طالب علم، للوعظ في إحدى القرى، وكان كلّما وصل إلى قرية، اعتذر أهلُها قائلين: لقد شرّفْتَنا، ولكن عندَنا إمامٌ في رمضان، ولا بقبلونه. وهكذا طاف قرّى متعددةً، وأخيراً وصل إلى قرية، كان قد تسلَّطَ …"
summary:
  ar: "ذهب جحا الطالب ليعظ في قرية، وكان في القرية إمام مضيف، فوصل أخيراً إلى قرية سطا فيها ثعلب على الدجاج، وحاصر القرويون الثعلب، فألبسه جحا جبته وحزامه وربطهما وأطلقه، وقال إن الثياب ستمنع أي أحد من إطعامه أو إيوائه. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  en: "Juha, a student, goes to preach in a village; the village has a host imam; he finally reaches a village where a fox has raided the chickens; villagers trap the fox; Juha puts his robe and belt on the fox, binds them, and frees it, saying the clothes will stop anyone from giving it food or shelter. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  ur: "جحا طالب علم تھا اور ایک گاؤں میں وعظ کرنے گیا، اس گاؤں میں ایک میزبان امام تھا، آخر وہ ایک ایسے گاؤں پہنچا جہاں لومڑی نے مرغیوں پر حملہ کیا تھا، گاؤں والوں نے لومڑی کو گھیر لیا، تو جحا نے اپنا جبہ اور پٹکا اسے پہنایا، انہیں باندھا اور اسے چھوڑ دیا، اور کہا کہ یہ کپڑے کسی کو اسے کھانا یا پناہ دینے سے روک دیں گے۔ {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  fr: "Juha, étudiant, va prêcher dans un village ; le village a un imam hôte ; il arrive enfin dans un village où un renard a ravagé les poules ; les villageois piègent le renard ; Juha lui met sa robe et sa ceinture, les attache et le libère, disant que ces vêtements empêcheront quiconque de lui donner à manger ou de l'abriter. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  es: "Juha, estudiante, va a predicar a una aldea; la aldea tiene un imán anfitrión; al fin llega a una aldea donde un zorro ha asaltado los gallineros; los aldeanos atrapan al zorro; Juha le pone su túnica y su cinturón, los ata y lo libera, diciendo que esa ropa impedirá que nadie le dé comida o refugio. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  tr: "Öğrenci Juha, vaaz vermek için bir köye gitti. Köyde misafirperver bir imam vardı. Sonunda, bir tilkinin tavuklara saldırdığı bir köye vardı. Köylüler tilkiyi kuşattılar, bu yüzden Juha ona cübbesini ve kemerini giydirdi, bağladı ve serbest bıraktı. Giysilerin kimsenin onu beslemesini veya barındırmasını engelleyeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 163}"
  id: "Juha, seorang siswa, pergi berdakwah di sebuah desa. Desa itu memiliki seorang imam yang ramah. Akhirnya ia tiba di sebuah desa di mana seekor rubah telah menyerang ayam-ayam. Penduduk desa mengepung rubah itu, lalu Juha memakaikan jubah dan ikat pinggangnya pada rubah tersebut, mengikatnya, dan melepaskannya, sambil berkata bahwa pakaian itu akan mencegah siapa pun memberi makan atau melindunginya. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
