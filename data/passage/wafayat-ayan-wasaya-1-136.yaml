text: "… في الثالثة، فلما وصلوا به إلى إشبيلية صبّروه وصيروه في تابوت وحملوه إلى تين مل، ودفن هناك عند أبيه عبد المومن والمهدي محمد بن تومرت. وكانت وفاته يوم السبت لسبع خلون من رجب سنة ثمانين وخمسمائة، وكان قبل موته بأشهر …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 136، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 136, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 136 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
