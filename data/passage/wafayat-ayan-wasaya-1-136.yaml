  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Önemli Şahsiyetlerin Biyografik Sözlüğü) adlı eserinin 1. cildinin 136. sayfasından, ölüm saati ve vefatı anlatan bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
