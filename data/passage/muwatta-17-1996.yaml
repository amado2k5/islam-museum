label: { ar: "الموطأ 1996 — مالك: تفسير قول رسول الله لا يبع بعضكم على بيع بعض، فيما نرى، أنه إنما نهى أن يسوم الرجل على سوم أخيه، إذا ركن البائع إلى السائم، وجعل يشترط وزن الذهب، ويتبرأ من العيوب", en: "Muwatta 1996", es: "Muwatta 1996", fr: "Muwatta 1996", ur: "موطا 1996", tr: "Al-Muwatta 1996 — Malik: Allah Resulü'nün, \"Hiçbiriniz diğerinden daha yüksek teklif vermesin\" sözünü bizim gördüğümüz şekilde yorumlarsak, o ancak satıcı teklif verene meyilli olup altının ağırlığını belirtmeye ve herhangi bir kusuru reddetmeye başlarsa, bir adamın kardeşinin teklifine karşı teklif vermesini yasaklamıştır.", id: "Al-Muwatta 1996 — Malik: Menafsirkan sabda Rasulullah, “Janganlah seorang pun di antara kalian menawar lebih tinggi daripada yang lain,” menurut pemahaman kami, adalah bahwa beliau hanya melarang seseorang menawar lebih tinggi daripada saudaranya, jika penjual condong kepada penawar dan mulai menetapkan berat emas serta menyangkal adanya cacat." }
summary:
  ar: "قال مالك: وتفسير قول رسول الله: لا يبع بعضكم على بيع بعض، فيما نرى والله أعلم: أنه إنما نهى أن يسوم الرجل على سوم أخيه، إذا ركن البائع إلى السائم، وجعل يشترط وزن الذهب، ويتبرأ من العيوب، وما أشبه هذا، مما يعرف به أن البائع قد أراد مبايعة السائم. فهذا الذي نهي عنه، والله أعلم. {cite:muwatta-maruf-1997 p.217}"
  tr: "Malik şöyle dedi: Peygamberimizin, \"Hiçbiriniz diğerinden daha yüksek teklif vermesin\" sözünün tefsiri, bizim görüşümüze göre ve Allah en iyisini bilir, ancak satıcının teklif verenden daha yüksek teklif vermeye meyilli olduğu ve altının ağırlığını belirtmeye, kusurları reddetmeye vb. başladığı durumlarda, yani satıcının teklif verenden satın alma niyetinde olduğu durumlarda yasaklanmıştır. Yasaklanan budur ve Allah en iyisini bilir. {cite:muwatta-maruf-1997 s.217}"
  id: "Malik berkata: Penafsiran sabda Nabi, \"Janganlah seorang pun di antara kalian menawar lebih tinggi daripada yang lain,\" menurut pandangan kami, dan Allah Maha Mengetahui, adalah bahwa beliau hanya melarang seseorang menawar lebih tinggi daripada saudaranya ketika penjual cenderung menawar lebih tinggi dan mulai menetapkan berat emas, menyangkal adanya cacat, dan sebagainya, yang menunjukkan bahwa penjual bermaksud membeli dari penawar. Inilah yang dilarang, dan Allah Maha Mengetahui. {cite:muwatta-maruf-1997 p.217}"
