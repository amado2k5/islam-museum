summary:
  ar: "قال مالك: وتفسير قول رسول الله: لا يبع بعضكم على بيع بعض، فيما نرى والله أعلم: أنه إنما نهى أن يسوم الرجل على سوم أخيه، إذا ركن البائع إلى السائم، وجعل يشترط وزن الذهب، ويتبرأ من العيوب، وما أشبه هذا، مما يعرف به أن البائع قد أراد مبايعة السائم. فهذا الذي نهي عنه، والله أعلم. {cite:muwatta-maruf-1997 p.217}"
