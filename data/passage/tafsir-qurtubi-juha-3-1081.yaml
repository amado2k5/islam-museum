text: "… طلق هازلاً أن الطلاق يلزمه، وأختلفوا في غيره على ما يأتي بيانه في براءة إن شاء اللّٰه تعالى. وخرّج أبو داود عن أبي هريرة أن رسول اللّٰه قال: ثلاث جِدّهن جِدّ وهزلهن جِدّ النكاح والطلاق والرّجعة. وروي عن عليّ بن …"
