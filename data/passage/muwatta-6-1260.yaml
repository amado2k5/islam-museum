label: { ar: "الموطأ 1260 — مالك: الفدية بالخيار فيما ذكره الله في الكفارات، وأما النسك فشاة، والصيام ثلاثة أيام، والإطعام ستة مساكين", en: "Muwatta 1260" }
summary:
  ar: "سئل مالك عن الفدية من الصيام أو الصدقة أو النسك، أصاحبه بالخيار فيها؟ فقال كل شيء في كتاب الله في الكفارات فصاحبه مخير فيه، أي شيء أحب أن يفعله فعله. وأما النسك فشاة، وأما الصيام فثلاثة أيام، وأما الطعام فيطعم ستة مساكين، لكل مسكين مدان بالمد الأول، مد النبي. {cite:muwatta-maruf-1997 p.560}"
