label: { ar: "الموطأ 1260 — مالك: الفدية بالخيار فيما ذكره الله في الكفارات، وأما النسك فشاة، والصيام ثلاثة أيام، والإطعام ستة مساكين", en: "Muwatta 1260", es: "Muwatta 1260", fr: "Muwatta 1260", ur: "موطا 1260", tr: "El-Muvatta 1260 — Malik: Allah'ın kefaret konusunda belirttiği şeylerde kefaret isteğe bağlıdır. Kurban ise bir koyun, üç gün oruç tutmak ve altı fakiri doyurmaktır.", id: "Al-Muwatta 1260 — Malik: Penebusan dosa bersifat opsional dalam hal-hal yang telah Allah sebutkan mengenai penebusan dosa. Adapun kurbannya adalah seekor domba, berpuasa selama tiga hari, dan memberi makan enam orang miskin." }
summary:
  ar: "سئل مالك عن الفدية من الصيام أو الصدقة أو النسك، أصاحبه بالخيار فيها؟ فقال كل شيء في كتاب الله في الكفارات فصاحبه مخير فيه، أي شيء أحب أن يفعله فعله. وأما النسك فشاة، وأما الصيام فثلاثة أيام، وأما الطعام فيطعم ستة مساكين، لكل مسكين مدان بالمد الأول، مد النبي. {cite:muwatta-maruf-1997 p.560}"
  tr: "Malik'e kefaretin oruç, sadaka veya kurban gibi şeylerle ilgili soru soruldu. Kişinin bu konuda bir seçeneği var mıydı? O şöyle cevap verdi: \"Allah'ın Kitabında kefaretle ilgili olarak belirtilen her şey caizdir; kişinin bu konuda bir seçeneği vardır. Dilediğini yapabilir. Kurban ise bir koyundur; oruç üç gündür; yiyecek ise altı fakire, her birine iki mudd (bir ölçü tahıl) vererek, Peygamberin mudd'una göre doyurmaktır.\" {cite:muwatta-maruf-1997 s.560}"
  id: "Malik ditanya tentang penebusan dosa, baik itu puasa, sedekah, atau kurban. Apakah seseorang memiliki pilihan dalam hal itu? Dia menjawab, \"Segala sesuatu yang disebutkan dalam Kitab Allah mengenai penebusan dosa diperbolehkan; seseorang memiliki pilihan dalam hal itu. Dia boleh melakukan apa pun yang dia sukai. Adapun kurban, yaitu seekor domba; adapun puasa, yaitu tiga hari; dan adapun makanan, dia memberi makan enam orang miskin, memberi masing-masing dua mudd (ukuran biji-bijian) sesuai dengan mudd pertama, mudd Nabi.\" {cite:muwatta-maruf-1997 p.560}"
