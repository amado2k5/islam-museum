text: "… صاحب سره، وكان له دار بدمشق بباب البريد وتوفي بدمشق. عروة بن المغيرة بن شعبة وُلِّيَ إمرة الكوفة للحجاج، وكان شريفاً لبيباً مطاعاً في الناس، وكان أحول. توفي بالكوفة. يحيى بن يعمر كان قاضي مرو، وهو أول من نقط المصاحف، …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 5، ص 85، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 5, p. 85, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 5، ص 85 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 5, pág. 85, que menciona la colección del Corán y los códices, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 5, p. 85), mentionnant la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 5. cildinin 85. sayfasından, Kur'an'ın derlenmesi ve el yazmaları ile Kur'an'ın diyakritik işaretleri ve biçimlendirilmesini ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Awal dan Akhir), Jilid 5, halaman 85, yang membahas penyusunan Al-Quran dan manuskripnya, serta tanda diakritik dan format Al-Quran. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
