text: "له ومن يعنصم بالله فقد هدي إلى صرط مستقيم) يوبخ تعالى أهل الكتاب من اليهود والنصارى على كفرهم بآيات الله التي أنزلها الله على رسله، التي جعلها رحمة لعباده يهتدون بها إليه، ويستدلون بها على جميع المطالب المهمة والعلوم النافعة،"
