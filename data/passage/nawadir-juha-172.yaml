text: "… السلحفاةُ تحرث كان يوماً يحرث أرضه فلقي سلحفاة فأخذها وعلّقها على رقبته بخيط فكانت كلَّما تحرَّكت، يقول لها: لماذا تضطربين هكذا؟... أليس من العار أن تتعلمي الحراثة أيضاً؟ ألبسها بالعافية كان في سيوري حصار بلدة الشيخ قاض سكّيرٌ فَسَكِرَ يوماً …"
summary:
  ar: "ربط جحا سلحفاة بعنقه ليحرث، ووبّخها لأنها تتخبط، وسألها أهو عيب على السلحفاة أن تتعلم الحراثة هي أيضًا. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  en: "Juha ties a tortoise to his neck to plough and chides it for struggling, asking whether it is shameful for a tortoise to learn to plough too. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  ur: "جحا نے ہل چلانے کے لیے ایک کچھوا اپنی گردن سے باندھ لیا اور اس کے تڑپنے پر اسے ڈانٹا، اور پوچھا کہ کیا کچھوے کا ہل چلانا سیکھنا بھی عیب ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  fr: "Juha s'attache une tortue au cou pour labourer et la gronde parce qu'elle se débat, demandant s'il est honteux pour une tortue d'apprendre elle aussi à labourer. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  es: "Juha se ata una tortuga al cuello para arar y la regaña porque se debate, preguntando si es vergonzoso que una tortuga aprenda también a arar. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
