text: "… فيه دُعَابَة، وقد أسره الروم زمن عمر فأرادوه على الكُفْر فأبَى عليهم، فقال له ملكهم : قبّل رأسي حتّى أُطْلِقَكَ ومَن معك، ففعل فأطلقه وثمانين أسيراً، فلمّا قدِم قال له عمر : حقَّ على كلّ مسلم أن يقبّل رأسَك وأنا …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 343، يرد فيه ذكر ما وجب على كل مسلم، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 343, whose wording mentions a duty laid on every Muslim, a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 343 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
