label: { ar: "مسلم 2584 — دعوها فإنها منتنة / انصر أخاك ظالماً أو مظلوماً", en: "Muslim 2584 — The fetid call / Help your brother wronged or wronging" }
text: "قال جابر: كسع رجل من المهاجرين رجلاً من الأنصار، فقال الأنصاري: يا للأنصار، وقال المهاجر: يا للمهاجرين، فقال رسول الله: ما بال دعوى الجاهلية؟ قالوا: يا رسول الله كسع رجل من المهاجرين رجلاً من الأنصار، فقال: دعوها فإنها منتنة"
summary:
  ar: "رواية جابر بن عبد الله في باب نهيه عن دعوى الجاهلية من كتاب البر في صحيح مسلم؛ تناشد المهاجرين والأنصار بالقبيلة بعد مشادّة، فسماها النبي دعوى الجاهلية المنتنة — وفي الحديث نصر الأخ ظالماً بردّه عن الظلم ومظلوماً بنصره."
