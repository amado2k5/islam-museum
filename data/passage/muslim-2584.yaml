label: { ar: "مسلم 2584 — دعوها فإنها منتنة / انصر أخاك ظالماً أو مظلوماً", en: "Muslim 2584 — The fetid call / Help your brother wronged or wronging", es: "Musulmán 2584 — El llamado fétido / Ayuda a tu hermano agraviado o agraviado", fr: "Muslim 2584 — L'appel fétide / Aidez votre frère lésé ou fautif", ur: "مسلم 2584 - اپنے بھائی پر ظلم یا زیادتی کرنے میں مدد کرنا", tr: "Müslim 2584 — Bunu bırak, çünkü bu iğrençtir. / İster zalim olsun ister mazlum, kardeşine destek ol.", id: "Muslim 2584 — Tinggalkanlah, karena itu adalah perbuatan yang buruk / Dukunglah saudaramu, baik dia seorang penindas maupun yang tertindas" }
text: "قال جابر: كسع رجل من المهاجرين رجلاً من الأنصار، فقال الأنصاري: يا للأنصار، وقال المهاجر: يا للمهاجرين، فقال رسول الله: ما بال دعوى الجاهلية؟ قالوا: يا رسول الله كسع رجل من المهاجرين رجلاً من الأنصار، فقال: دعوها فإنها منتنة"
summary:
  ar: "رواية جابر بن عبد الله في باب نهيه عن دعوى الجاهلية من كتاب البر في صحيح مسلم؛ تناشد المهاجرين والأنصار بالقبيلة بعد مشادّة، فسماها النبي دعوى الجاهلية المنتنة — وفي الحديث نصر الأخ ظالماً بردّه عن الظلم ومظلوماً بنصره."
  tr: "Sahih Müslim'deki Salihlik Kitabı'nda yer alan Cabir bin Abdullah'ın cahiliye davetinin yasaklanması bölümünde rivayet edildiğine göre; Muhacirler ve Ensar bir anlaşmazlıktan sonra kabileye başvurdular, bunun üzerine Peygamberimiz bunu \"cahiliye daveti\" olarak nitelendirdi. Hadiste ise, ister zalim olsun ister olmasın, kardeşin zulümden uzaklaştırılması, ister zulüm gören olsun, ona destek olunması gerektiği belirtilmiştir."
  id: "Riwayat Jabir bin Abdullah dalam bab tentang larangan seruan kebodohan dari Kitab Kebenaran dalam Sahih Muslim; kaum Muhajirin dan Ansar meminta pertolongan kepada suku mereka setelah terjadi perselisihan, sehingga Nabi menyebutnya sebagai seruan keji kebodohan — dan dalam hadits tersebut terdapat dukungan kepada saudara, baik dia seorang penindas, dengan menjauhkannya dari penindasan, dan baik dia yang tertindas, dengan mendukungnya."
