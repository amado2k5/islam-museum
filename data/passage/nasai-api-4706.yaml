text: "… ثُمَّ مَاتَ فَنَزَلْتُ فَدَفَنْتُهُ. فَقَالَ كَانَ ذَا أَهْلَ ذَاكَ مِنْكَ. فَمَكُثَ حِينًا ثُمَّ إِنَّ الرَّجُلَ الْيَمَانِيَّ الَّذِي كَانَ أَوْصَى إِلَيْهِ أَنْ يُبَلِّغَ عَنْهُ وَافَى الْمَوْسِمَ قَالَ يَا آلَ قُرَيْشٍ. قَالُوا هَذِهِ قُرَيْشٌ. قَالَ يَا آلَ بَنِي هَاشِمٍ. قَالُوا هَذِهِ بَنُو هَاشِمٍ. قَالَ أَيْنَ أَبُو طَالِبٍ قَالَ هَذَا أَبُو طَالِبٍ. قَالَ أَمَرَنِي فُلاَنٌ أَنْ أُبَلِّغَكَ رِسَالَةً …"
summary:
  ar: "حديث في سنن النسائي، رقم 4706، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4706 (The Book of Oaths (qasamah), Retaliation and Blood Money), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 4706، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4706 (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Sangre), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4706 (Le Livre des Serments (qasamah), des représailles et du prix du sang), mentionne un testament ou un conseil d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sunan-ı Nesai'de yer alan 4706 numaralı hadis, vasiyet veya son bir ahitten bahsetmektedir. Bu hadis, vasiyet, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4706, menyebutkan wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
