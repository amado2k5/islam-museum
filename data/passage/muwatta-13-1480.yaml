label: { ar: "الموطأ 1480 — مالك: إن جاءت امرأة حامل من أرض العدو فوضعت في أرض العرب، فهو ولدها يرثها وترثه ميراثها في كتاب الله", en: "Muwatta 1480", es: "Muwatta 1480", fr: "Muwatta 1480", ur: "موطا 1480", tr: "El-Muvatta 1480 — Malik: Eğer hamile bir kadın düşman topraklarından gelip Arap topraklarında doğum yaparsa, Allah'ın Kitabında belirtildiği gibi, çocuğu annesinden, çocuğu da çocuğundan miras alacaktır.", id: "Al-Muwatta 1480 — Malik: Jika seorang wanita hamil datang dari wilayah musuh dan melahirkan di wilayah Arab, maka anaknya akan mewarisi harta darinya dan dia akan mewarisi harta anaknya, sebagaimana yang telah ditetapkan dalam Kitab Allah." }
summary:
  ar: "يقول مالك إن جاءت امرأة حامل من أرض العدو، فوضعت في أرض العرب، فهو ولدها، يرثها إن ماتت، وترثه إن مات، ميراثها في كتاب الله. {cite:muwatta-maruf-1997 p.24}"
  tr: "Malik, hamile bir kadının düşman topraklarından gelip Arap topraklarında doğum yapması durumunda çocuğun onun olduğunu ve kadının ölmesi halinde çocuğun ondan miras alacağını, erkeğin ölmesi halinde ise çocuğun ondan miras alacağını; mirasın Allah'ın Kitabına göre olduğunu söylüyor. {cite:muwatta-maruf-1997 s.24}"
  id: "Malik mengatakan bahwa jika seorang wanita hamil datang dari wilayah musuh dan melahirkan di wilayah Arab, anak itu adalah miliknya dan akan mewarisi hartanya jika ia meninggal, dan ia akan mewarisi harta anaknya jika anaknya meninggal; warisannya sesuai dengan Kitab Allah. {cite:muwatta-maruf-1997 p.24}"
