label: { ar: "سنن أبي داود 96 — الأب والأبوة، تربية الأب ووصيته", en: "Sunan Abi Dawud 96 — the father and fatherhood; the father raising and counselling", ur: "سنن ابی داؤد 96 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 96 — El padre y la paternidad; la crianza y el asesoramiento paternos", fr: "Sunan Abi Dawud 96 — Le père et la paternité; l’éducation et les conseils du père" }
text: "… بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، حَدَّثَنَا سَعِيدٌ الْجُرَيْرِيُّ، عَنْ أَبِي نَعَامَةَ، أَنَّ عَبْدَ اللَّهِ بْنَ مُغَفَّلٍ، سَمِعَ ابْنَهُ، يَقُولُ اللَّهُمَّ إِنِّي أَسْأَلُكَ الْقَصْرَ الأَبْيَضَ عَنْ يَمِينِ الْجَنَّةِ، إِذَا دَخَلْتُهَا. فَقَالَ أَىْ بُنَىَّ سَلِ اللَّهَ الْجَنَّةَ وَتَعَوَّذْ بِهِ مِنَ النَّارِ فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّهُ سَيَكُونُ فِي هَذِهِ الأُمَّةِ قَوْمٌ يَعْتَدُونَ فِي الطُّهُورِ وَالدُّعَاءِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 96، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 96 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 96، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 96 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad, así como la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 96 (Purification (Kitab Al-Taharah)), évoque le père et la paternité, l'éducation des enfants et les conseils prodigués par le père. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
