label: { ar: "صحيح مسلم 2944 — الحلال", en: "Sahih Muslim 2944 — the lawful", ur: "صحیح مسلم 2944 — حلال", es: "Sahih Muslim 2944 — el lícito" }
text: "… نَحِلَّ وَنَجْعَلَهَا عُمْرَةً فَكَبُرَ ذَلِكَ عَلَيْنَا وَضَاقَتْ بِهِ صُدُورُنَا فَبَلَغَ ذَلِكَ النَّبِيَّ فَمَا نَدْرِي أَشَىْءٌ بَلَغَهُ مِنَ السَّمَاءِ أَمْ شَىْءٌ مِنْ قِبَلِ النَّاسِ فَقَالَ \" أَيُّهَا النَّاسُ أَحِلُّوا فَلَوْلاَ الْهَدْىُ الَّذِي مَعِي فَعَلْتُ كَمَا فَعَلْتُمْ \". قَالَ فَأَحْلَلْنَا حَتَّى وَطِئْنَا النِّسَاءَ وَفَعَلْنَا مَا يَفْعَلُ الْحَلاَلُ حَتَّى إِذَا كَانَ يَوْمُ التَّرْوِيَةِ وَجَعَلْنَا مَكَّةَ بِظَهْرٍ أَهْلَلْنَا بِالْحَجِّ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2944، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 2944 (The Book of Pilgrimage), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 2944، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 2944 (El Libro de la Peregrinación), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
