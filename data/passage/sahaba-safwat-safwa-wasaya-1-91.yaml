text: "… عبيدة، أبا عبيدة، ووجد صاحب أبي طلحة أبا طلحة فلحد لرسول اللّٰه ليخِ. رواه الإمام أحمد. وروى جعفر بن محمد قال: كان الماء يستنقع في جفون النبي وَلِيِ فكان علي يحسوه. ذِكْرُ موضع قبره وَلِيم عن ابن جريج قال: أخبرني …"
