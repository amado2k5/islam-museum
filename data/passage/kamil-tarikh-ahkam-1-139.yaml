  tr: "İbn el-Athir'in *El-Kamil fi el-Tarikh* adlı eserinin 1. cildinin 139. sayfasından, farz olan amelleri ve görevleri anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
