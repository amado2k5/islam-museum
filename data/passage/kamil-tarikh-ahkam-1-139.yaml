text: "… فلا. وقال عبّاس بن مِرْداس : ما كان لي ولسُلَيْم فلا. فقالت بنو سليم: ما كان لنا فهو لرسول اللّه. فقال: وهنتموني. فقال رسول اللّٰه، وَلِفِ:. مَنْ تمِسّك بحقّه من السبي فله بكلّ إنسان ستّ فرائض، من أوّل شيء نصيبه، …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 139، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
