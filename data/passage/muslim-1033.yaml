label: { ar: "مسلم 1033 — اليد العليا خير من اليد السفلى", en: "Muslim 1033 — The upper hand is better than the lower", es: "Musulmán 1033 — La mano dominante es mejor que la inferior", fr: "Muslim 1033 — La position dominante est préférable à la position dominée.", ur: "مسلم 1033 - اوپر والا ہاتھ نیچے والے ہاتھ سے بہتر ہے۔", tr: "Müslim 1033 — Üst el, alt elden daha hayırlıdır.", id: "Muslim 1033 — Tangan yang lebih tinggi lebih baik daripada tangan yang lebih rendah." }
text: "قال رسول الله وهو على المنبر وهو يذكر الصدقة والتعفف عن المسألة: «اليد العليا خير من اليد السفلى، واليد العليا المنفقة والسفلى السائلة»"
summary:
  ar: "رواية عبد الله بن عمر في كتاب الزكاة من صحيح مسلم؛ اليد العليا المنفقة خير من السفلى السائلة، وفي رواية حكيم بن حزام «ابدأ بمن تعول» — نص الإنفاق والعفة."
  tr: "Sahih Müslim'deki Zekat Kitabı'nda Abdullah bin Ömer'in rivayeti şöyledir: \"Veren el, isteyen elden daha hayırlıdır.\" Ve Hakim bin Hizam'ın rivayetinde ise: \"Önce desteklediklerinizden başlayın\" - bu, harcama ve iffetle ilgili bir ayettir."
  id: "Riwayat Abdullah bin Omar dalam Kitab Zakat di Sahih Muslim: “Tangan atas yang memberi lebih baik daripada tangan bawah yang meminta.” Dan dalam riwayat Hakim bin Hizam: “Mulailah dengan orang-orang yang kamu dukung” — teks tentang pengeluaran dan kesucian."
