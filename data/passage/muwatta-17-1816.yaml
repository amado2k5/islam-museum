label: { ar: "الموطأ 1816 — يحيى عن مالك عن أبي الرجال عن عمرة: ابتاع رجل ثمر حائط في زمن رسول الله فنقص، فسأل رب الحائط أن يضع عنه أو يقيله فحلف أن لا يفعل، فذكرت أم المشتري ذلك للنبي فقال: تألى أن لا يفعل خيرا، فسمع رب الحائط فقال: هو له", en: "Muwatta 1816", es: "Muwatta 1816", fr: "Muwatta 1816", ur: "موطا 1816", tr: "El-Muvatta 1816 — Yahya, Malik'ten, o da Ebu el-Rijal'den, o da Amrah'tan rivayetle: Bir adam, Allah Resulü zamanında bir meyve bahçesinden meyve satın aldı ve meyvelerin değeri düştü. Bunun üzerine, meyve bahçesinin sahibinden fiyatı düşürmesini veya satışı iptal etmesini istedi, ancak sahibi bunu yapmayacağına yemin etti. Alıcının annesi bunu Peygamber'e anlattı, o da: \"İyilik yapmayacağına yemin etti.\" dedi. Meyve bahçesinin sahibi bunu duyunca: \"O benimdir.\" dedi.", id: "Al-Muwatta 1816 — Yahya, dari Malik, dari Abu al-Rijal, dari Amrah: Seorang pria membeli buah dari sebuah kebun pada zaman Rasulullah, dan nilainya menurun. Maka ia meminta pemilik kebun untuk menurunkan harga atau membatalkan penjualan, tetapi pemilik kebun bersumpah bahwa ia tidak akan melakukannya. Ibu pembeli menceritakan hal ini kepada Nabi, yang kemudian berkata: “Dia bersumpah bahwa dia tidak akan berbuat baik.” Pemilik kebun mendengar ini dan berkata: “Itu miliknya.”" }
summary:
  ar: "يروي يحيى عن مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن أنها سمعت أن رجلا ابتاع ثمر حائط في زمان رسول الله، فعالجه وقام فيه حتى تبين له النقصان، فسأل رب الحائط أن يضع له أو أن يقيله، فحلف أن لا يفعل. فذهبت أم المشتري إلى رسول الله فذكرت ذلك له، فقال: تألى أن لا يفعل خيرا. فسمع بذلك رب الحائط، فأتى وليه فقال: يا رسول الله، هو له. {cite:muwatta-maruf-1997 p.143} {cite:muwatta-maruf-1997 p.144}"
  tr: "Yahya, Malik'ten, o da Ebu el-Rijal Muhammed ibn Abd el-Rahman'dan, o da annesi Amrah bint Abd el-Rahman'dan rivayet eder ki, Amrah, Allah Resulü zamanında bir adamın bir meyve bahçesinin meyvelerini satın aldığını, onlara özen gösterip baktığını, ancak bir eksiklik olduğunu fark ettiğini işittiğini anlatır. Meyve bahçesinin sahibinden fiyatı düşürmesini veya satışı iptal etmesini istemiş, ancak sahibi bunu yapmayacağına yemin etmiştir. Alıcının annesi Allah Resulü'ne gidip durumu anlatmış, o da: \"İyilik yapmayacağına yemin etti\" demiştir. Meyve bahçesinin sahibi bunu duyunca vasisine gidip: \"Ey Allah Resulü, o ona aittir\" demiştir. {cite:muwatta-maruf-1997 s.143} {cite:muwatta-maruf-1997 s.144}"
  id: "Yahya meriwayatkan dari Malik, dari Abu al-Rijal Muhammad ibn Abd al-Rahman, dari ibunya, Amrah bint Abd al-Rahman, bahwa ia mendengar seorang pria membeli buah dari sebuah kebun pada zaman Rasulullah. Ia merawat dan memeliharanya hingga ia menyadari ada kekurangan. Ia meminta pemilik kebun untuk menurunkan harga atau membatalkan penjualan, tetapi pemilik kebun bersumpah tidak akan melakukannya. Ibu pembeli pergi kepada Rasulullah dan menceritakan hal itu kepadanya, dan beliau berkata: \"Ia bersumpah tidak akan berbuat baik.\" Pemilik kebun mendengar tentang hal ini dan pergi kepada walinya dan berkata: \"Wahai Rasulullah, itu miliknya.\" {cite:muwatta-maruf-1997 p.143} {cite:muwatta-maruf-1997 p.144}"
