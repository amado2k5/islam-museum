label: { ar: "الموطأ 1816 — يحيى عن مالك عن أبي الرجال عن عمرة: ابتاع رجل ثمر حائط في زمن رسول الله فنقص، فسأل رب الحائط أن يضع عنه أو يقيله فحلف أن لا يفعل، فذكرت أم المشتري ذلك للنبي فقال: تألى أن لا يفعل خيرا، فسمع رب الحائط فقال: هو له", en: "Muwatta 1816" }
summary:
  ar: "يروي يحيى عن مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن أنها سمعت أن رجلا ابتاع ثمر حائط في زمان رسول الله، فعالجه وقام فيه حتى تبين له النقصان، فسأل رب الحائط أن يضع له أو أن يقيله، فحلف أن لا يفعل. فذهبت أم المشتري إلى رسول الله فذكرت ذلك له، فقال: تألى أن لا يفعل خيرا. فسمع بذلك رب الحائط، فأتى وليه فقال: يا رسول الله، هو له. {cite:muwatta-maruf-1997 p.143} {cite:muwatta-maruf-1997 p.144}"
