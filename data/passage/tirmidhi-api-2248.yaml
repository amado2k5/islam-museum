label: { ar: "جامع الترمذي 2248 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 2248 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 2248 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 2248 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos." }
text: "… بْنُ مُعَاوِيَةَ الْجُمَحِيُّ، حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ عَلِيِّ بْنِ زَيْدٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" يَمْكُثُ أَبُو الدَّجَّالِ وَأُمُّهُ ثَلاَثِينَ عَامًا لاَ يُولَدُ لَهُمَا وَلَدٌ ثُمَّ يُولَدُ لَهُمَا غُلاَمٌ أَعْوَرُ أَضَرُّ شَيْءٍ وَأَقَلُّهُ مَنْفَعَةً تَنَامُ عَيْنَاهُ وَلاَ يَنَامُ قَلْبُهُ \". ثُمَّ نَعَتَ لَنَا رَسُولُ اللَّهِ أَبَوَيْهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2248، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2248 (Chapters On Al-Fitan), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2248، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2248 (Capítulos sobre Al-Fitan), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
