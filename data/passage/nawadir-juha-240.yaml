text: "… لم أفقه حسابك الدقيق تزوَّج الشيخ فأعلمته زوجته أنَّها حاملٌ منذُ ثلاثةِ أشهرِ وستلِدُ، وطلبَتْ أن يأتِيها بقابلة. بنواه : ببذره."
summary:
  ar: "تزوج جحا وقالت له زوجته إنها حامل منذ ثلاثة أشهر وتحتاج إلى قابلة، فقال إن النساء يلدن بعد تسعة أشهر، فقالت إنهما متزوجان منذ ثلاثة أشهر فأشهر الطفل تكمل التسعة، فاعترف جحا بأنه لم يفهم الحساب واعتذر. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  en: "Juha marries, and his wife says she has been pregnant for three months and needs a midwife. He says women give birth after nine months, and she says they have been married three months, so the child's months complete the nine. Juha admits he did not follow the calculation and apologises. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  ur: "جحا شادی کرتا ہے اور اس کی بیوی کہتی ہے کہ وہ تین مہینے سے حاملہ ہے اور دائی کی ضرورت ہے۔ وہ کہتا ہے کہ عورتیں نو مہینے بعد جنتی ہیں، تو وہ کہتی ہے کہ ان کی شادی کو تین مہینے ہوئے ہیں، اس لیے بچے کے مہینے ملا کر نو پورے ہو جاتے ہیں۔ جحا مان لیتا ہے کہ وہ حساب نہ سمجھ سکا اور معذرت کرتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  fr: "Juha se marie, et sa femme dit qu'elle est enceinte depuis trois mois et qu'il lui faut une sage-femme. Il dit que les femmes accouchent après neuf mois, et elle répond qu'ils sont mariés depuis trois mois, de sorte que les mois de l'enfant complètent les neuf. Juha avoue n'avoir pas suivi le calcul et s'excuse. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  es: "Juha se casa, y su esposa dice que lleva tres meses embarazada y necesita una partera. Él dice que las mujeres paren a los nueve meses, y ella responde que llevan tres meses casados, así que los meses del niño completan los nueve. Juha admite que no siguió el cálculo y se disculpa. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
  tr: "Juha evlendi ve karısı ona üç aylık hamile olduğunu ve bir ebeye ihtiyacı olduğunu söyledi. Juha, kadınların dokuz ay sonra doğum yaptığını söyledi. Karısı ise üç aydır evli olduklarını, dolayısıyla bebeğin aylarının dokuzu tamamlayacağını söyledi. Juha matematiği anlamadığını itiraf etti ve özür diledi. {cite:juha-nawadir-kubra-djuwaydi s. 115}"
  id: "Juha menikah, dan istrinya memberitahunya bahwa dia hamil tiga bulan dan membutuhkan bidan. Juha mengatakan bahwa wanita melahirkan setelah sembilan bulan. Istrinya menjawab bahwa mereka telah menikah selama tiga bulan, jadi usia kehamilan bayi akan melengkapi sembilan bulan tersebut. Juha mengakui bahwa dia tidak mengerti perhitungannya dan meminta maaf. {cite:juha-nawadir-kubra-djuwaydi p. 115}"
