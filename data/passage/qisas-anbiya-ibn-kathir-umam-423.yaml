text: "… ولى اللّٰه إن كذبوا برسول اللّٰه موسى أن يحل بهم ما حل بالأمم من قبلهم، من النقمات والمثلات، مما تواتر عندهم وعند غيرهم، مما حل بقوم نوح وعاد وثمود ومن بعدهم إلى زمانهم ذلك، مما أقام به الحجج على أهل …"
