text: "… مؤمن فلما هاجر رسول اللّٰه علقع إلى المدينة وكان بها الأنصار من الأوس والخزرج وكانوا فى جاهليتهم يعبدون الأصنام على طريقة مشركى العرب وبها اليهود من أهل الكتاب على طريقة أسلافهم وكانوا ثلاث قبائل بنو قينقاع حلفاء الخزرج وبنو النضير …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 3، ص 51، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 3, p. 51, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
