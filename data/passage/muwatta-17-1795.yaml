label: { ar: "الموطأ 1795 — مالك: إذا اشترى الرجل عبدا فوجد به عيبا يرد منه، وحدث عنده عيب آخر مفسد كالقطع أو العور، فالمشتري بخير النظرين، فإن مات العبد عنده أقيم بالعيب يوم اشتراه، ووضع عنه ما بين القيمتين", en: "Muwatta 1795", es: "Muwatta 1795", fr: "Muwatta 1795", ur: "موطا 1795", tr: "El-Muvatta 1795 — Malik: Bir kimse bir köle satın alır ve kölede iadesini gerektiren bir kusur bulursa ve köle elindeyken bir kesik veya körlük gibi başka bir kusur daha ortaya çıkarsa, alıcının iki seçenek arasında seçim yapma hakkı vardır. Köle, alıcının elindeyken ölürse, satın alındığı günkü kusuruna göre değer biçilir ve iki değer arasındaki fark değerinden düşülür.", id: "Al-Muwatta 1795 — Malik: Jika seseorang membeli seorang budak dan menemukan cacat padanya yang mengharuskan pengembaliannya, dan kemudian terjadi cacat lain saat ia memiliki budak tersebut, seperti luka atau kebutaan, maka pembeli memiliki pilihan antara kedua opsi tersebut. Jika budak tersebut mati dalam kepemilikannya, maka ia dinilai berdasarkan cacat pada hari ia dibeli, dan selisih antara kedua nilai tersebut dikurangkan dari nilainya." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في الرجل يشتري العبد، ثم يظهر منه على عيب يرد منه، وقد حدث به عند المشتري عيب آخر: إنه إذا كان العيب الذي حدث به مفسدا، مثل القطع أو العور أو ما أشبه ذلك من العيوب المفسدة، فإن الذي اشترى العبد بخير النظرين: إن أحب أن يوضع عنه من ثمن العبد بقدر العيب الذي كان بالعبد يوم اشتراه وضع عنه، وإن أحب أن يغرم قدر ما أصاب العبد من العيب عنده ثم يرد العبد فذلك له. وإن مات العبد عند الذي اشتراه أقيم العبد وبه العيب الذي كان به يوم اشتراه، فينظر كم ثمنه، فإن كانت قيمة العبد يوم اشتراه بغير عيب مائة دينار، وقيمته يوم اشتراه وبه العيب ثمانين دينارا، وضع عن المشتري ما بين القيمتين. {cite:muwatta-maruf-1997 p.135} {cite:muwatta-maruf-1997 p.136}"
  tr: "Malik şöyle dedi: Bizde yerleşik uygulama şudur: Bir adam bir köle satın alır ve sonra kölede bir kusur ortaya çıkarsa ve bu kusur kölenin iadesini gerektirirse ve köle henüz alıcının elindeyken başka bir kusur daha gelişirse, yeni edinilen kusur, kesik, körlük veya benzeri sakatlayıcı bir durum ise, alıcının iki seçeneği vardır: Kölenin satın alındığı günkü kusuruna denk bir miktarda fiyatın düşürülmesini isterse, bunu yapabilir; veya kölenin kendi elindeyken edindiği kusura denk bir miktarı ödeyip köleyi iade etmek isterse, bu onun hakkıdır. Köle alıcının elindeyken ölürse, köle satın alındığı günkü kusuruyla değerlendirilir ve değeri belirlenir. Kölenin satın alındığı günkü değeri kusursuzken yüz dinar, satın alındığı günkü değeri ise seksen dinar ise, alıcıdan iki değer arasındaki fark düşülür. {cite:muwatta-maruf-1997 s.135} {cite:muwatta-maruf-1997 s.136}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah jika seseorang membeli seorang budak, dan kemudian muncul cacat pada budak tersebut yang mengharuskan pengembaliannya, dan kemudian muncul cacat lain saat budak itu masih bersama pembeli, maka jika cacat yang baru didapat itu menyebabkan kecacatan, seperti luka, kebutaan, atau cacat serupa lainnya, maka pembeli memiliki dua pilihan: jika ia ingin harga budak dikurangi sejumlah yang setara dengan cacat yang dimiliki budak pada hari pembelian, ia dapat melakukannya; atau jika ia ingin membayar sejumlah yang setara dengan cacat yang didapat budak saat berada dalam kepemilikannya dan kemudian mengembalikan budak tersebut, itu adalah haknya. Jika budak tersebut mati saat bersama pembeli, budak tersebut dinilai dengan cacat yang dimilikinya pada hari pembelian, dan nilainya ditentukan. Jika nilai budak pada hari ia dibeli tanpa cacat adalah seratus dinar, dan nilainya pada hari ia dibeli dengan cacat adalah delapan puluh dinar, maka pembeli akan dikurangi selisih antara kedua nilai tersebut. {kutip:muwatta-maruf-1997 hal.135} {kutip:muwatta-maruf-1997 hal.136}"
