label: { ar: "الموطأ 1795 — مالك: إذا اشترى الرجل عبدا فوجد به عيبا يرد منه، وحدث عنده عيب آخر مفسد كالقطع أو العور، فالمشتري بخير النظرين، فإن مات العبد عنده أقيم بالعيب يوم اشتراه، ووضع عنه ما بين القيمتين", en: "Muwatta 1795" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في الرجل يشتري العبد، ثم يظهر منه على عيب يرد منه، وقد حدث به عند المشتري عيب آخر: إنه إذا كان العيب الذي حدث به مفسدا، مثل القطع أو العور أو ما أشبه ذلك من العيوب المفسدة، فإن الذي اشترى العبد بخير النظرين: إن أحب أن يوضع عنه من ثمن العبد بقدر العيب الذي كان بالعبد يوم اشتراه وضع عنه، وإن أحب أن يغرم قدر ما أصاب العبد من العيب عنده ثم يرد العبد فذلك له. وإن مات العبد عند الذي اشتراه أقيم العبد وبه العيب الذي كان به يوم اشتراه، فينظر كم ثمنه، فإن كانت قيمة العبد يوم اشتراه بغير عيب مائة دينار، وقيمته يوم اشتراه وبه العيب ثمانين دينارا، وضع عن المشتري ما بين القيمتين. {cite:muwatta-maruf-1997 p.135} {cite:muwatta-maruf-1997 p.136}"
