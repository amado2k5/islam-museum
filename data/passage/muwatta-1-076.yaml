label: { ar: "الموطأ 76 — صفية بنت أبي عبيد تنزع خمارها وتمسح رأسها", en: "Muwatta 76" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما جاء في المسح بالرأس والأذنين: رأى نافع صفية بنت أبي عبيد، زوج عبد الله بن عمر، تنزع خمارها وتمسح على رأسها بالماء، ونافع يومئذ صغير. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ووكيع ويحيى بن بكير. {cite:muwatta-maruf-1997 p.74} {cite:muwatta-maruf-1997 p.75}"
