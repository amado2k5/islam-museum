label: { ar: "الموطأ 76 — صفية بنت أبي عبيد تنزع خمارها وتمسح رأسها", en: "Muwatta 76", es: "Muwatta 76", fr: "Muwatta 76", ur: "موطا 76", tr: "Al-Muwatta 76 — Safiyya bint Abi Ubayd başörtüsünü çıkarıp başını siliyor.", id: "Al-Muwatta 76 — Safiyya bint Abi Ubayd melepas jilbabnya dan mengusap kepalanya" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما جاء في المسح بالرأس والأذنين: رأى نافع صفية بنت أبي عبيد، زوج عبد الله بن عمر، تنزع خمارها وتمسح على رأسها بالماء، ونافع يومئذ صغير. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ووكيع ويحيى بن بكير. {cite:muwatta-maruf-1997 p.74} {cite:muwatta-maruf-1997 p.75}"
  tr: "Malik'in Nafi'den rivayet ettiği, baş ve kulak silme ile ilgili rivayetler bölümünde yer alan bir rivayette şöyle denmektedir: Nafi', Abdullah ibn Umar'ın karısı Safiyye bint Abi Ubayd'ın başörtüsünü çıkarıp başını suyla sildiğini görmüştür. Nafi' o zamanlar küçük bir çocuktu. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd, Abdül-Razzak, Muhammed ibn el-Hasan, Vaki' ve Yahya ibn Bukayr tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.74} {cite:muwatta-maruf-1997 s.75}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang apa yang telah dinarasikan mengenai mengusap kepala dan telinga: Nafi’ melihat Safiyyah binti Abi Ubayd, istri Abdullah ibn Umar, melepas jilbabnya dan mengusap kepalanya dengan air, dan Nafi’ masih seorang anak kecil pada saat itu. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwayd, Abd al-Razzaq, Muhammad ibn al-Hasan, Waki’, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.74} {cite:muwatta-maruf-1997 p.75}"
