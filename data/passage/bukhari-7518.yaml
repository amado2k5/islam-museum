label:
  ar: "البخاري 7518 — أحل عليكم رضواني فلا أسخط عليكم بعده أبدا"
  en: "Bukhari 7518 — I grant you My good pleasure and shall never be displeased with you"
  ur: "بخاری 7518 — میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا"
text: "إن الله يقول لأهل الجنة يا أهل الجنة. فيقولون لبيك ربنا وسعديك والخير في يديك. فيقول هل رضيتم فيقولون وما لنا لا نرضى يا رب وقد أعطيتنا ما لم تعط أحدا من خلقك. فيقول ألا أعطيكم أفضل من ذلك. فيقولون …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7518: أحل عليكم رضواني فلا أسخط عليكم بعده أبدا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7518: I grant you My good pleasure and shall never be displeased with you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7518: میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
