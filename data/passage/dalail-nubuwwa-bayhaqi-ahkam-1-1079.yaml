text: "… الباهلي، عن أبي أيوب. رواه مسلم عن أحمد بن سعيد، وحجاج بن الشاعر في : - كتاب الأشربة، باب إباحة أكل الثوم، الحديث، ص. وأخرجه الترمذي في كتاب الأطعمة، باب ما جاء في كراهية اكل الثوم والبصل، الحديث عن محمود …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1079، يرد فيه ذكر الكراهة، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
