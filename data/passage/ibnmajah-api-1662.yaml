label: { ar: "سنن ابن ماجه 1662 — الأب والأبوة", en: "Sunan Ibn Majah 1662 — the father and fatherhood", ur: "سنن ابن ماجہ 1662 — باپ اور والدیت" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نُمَيْرٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ: سَأَلَ حَمْزَةُ الأَسْلَمِيُّ رَسُولَ اللَّهِ ـ فَقَالَ: إِنِّي أَصُومُ أَفَأَصُومُ فِي السَّفَرِ؟ فَقَالَ ـ \" إِنْ شِئْتَ فَصُمْ وَإِنْ شِئْتَ فَأَفْطِرْ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1662، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1662 (Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1662، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
