text: "ج - المنتظم يوم الخميس بمشرعة الساج من الجانب الغربي ببغداد وتبره اليوم ظاهر يتبرك به، - محمل بن اسحاق بن ابراهيم ابن مهران بن عبد اللّه ابو العباس السراج مولى ثقيف ولد فى سنة ثمان عشرة. ومائتين وسمع قتيبة …"
