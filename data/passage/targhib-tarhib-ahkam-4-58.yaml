  es: "Un extracto de al-Targhib wa-l-Tarhib de al-Mundhiri, volumen digitalizado 4, p. 58, cuyo texto menciona la obligación (farida), un deber impuesto a cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 4. cildinin 58. sayfasından, farz olan amelleri ve görevleri, her Müslümandan beklenenleri anlatan bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Anjuran dan Peringatan), Jilid 4, halaman 58, yang menyebutkan amalan dan kewajiban wajib, serta apa yang dituntut dari setiap Muslim; dari versi pindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
