label: { ar: "صحيح البخاري 6133 — وصف المؤمن", en: "Sahih al-Bukhari 6133 — a description of the believer", ur: "صحیح بخاری 6133 — مومن کا وصف", es: "Sahih al-Bukhari 6133 — una descripción del creyente", fr: "Sahih al-Bukhari 6133 — une description du croyant", tr: "Sahih el-Buhari 6133 — Müminin Tanımı", id: "Sahih al-Bukhari 6133 — Deskripsi tentang Orang Beriman" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ الزُّهْرِيِّ، عَنِ ابْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ ـ عَنِ النَّبِيِّ أَنَّهُ قَالَ \" لاَ يُلْدَغُ الْمُؤْمِنُ مِنْ جُحْرٍ وَاحِدٍ مَرَّتَيْنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6133، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6133 (Good Manners and Form (Al-Adab)), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6133، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6133 (Buenas costumbres y modales (Al-Adab)), menciona una descripción del creyente. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 6133 (Les bonnes manières et la forme), mentionne une description du croyant. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih el-Buhari'de 6133 numaralı hadis, mümini tanımlar. İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bu hadis, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle bu dört kategori içinde derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6133, menjelaskan tentang orang beriman. Hadits ini, yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri orang beriman, disusun dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka dalam empat kategori tersebut."
