text: "… سلام السوَّاق، قال: حدثنا عبيد الله بن موسى، قال: حدثنا داود بن يزيد، عن خمس: شهادة أن لا إله إلَّا الله، وإقام الصلاة، وإبتاء الزكاة، وحج عن جرير، قال: سمعت رسول اللّٰه لله يقول: بُني الإسلام على"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 4، ص 506، يذكر ما بُني عليه الإسلام، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 4, p. 506, that mentions what Islam is built on, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 4، ص 506 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
