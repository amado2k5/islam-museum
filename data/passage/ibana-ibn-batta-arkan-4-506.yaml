text: "… سلام السوَّاق، قال: حدثنا عبيد الله بن موسى، قال: حدثنا داود بن يزيد، عن خمس: شهادة أن لا إله إلَّا الله، وإقام الصلاة، وإبتاء الزكاة، وحج عن جرير، قال: سمعت رسول اللّٰه لله يقول: بُني الإسلام على"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 4، ص 506، يذكر ما بُني عليه الإسلام، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 4, p. 506, that mentions what Islam is built on, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 4، ص 506 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe de Ibn Batta, volumen 4, pág. 506, que menciona los fundamentos del Islam: el testimonio, la oración y el zakat. Este extracto, extraído de la lectura automática y citado con un límite de cuarenta palabras según la política de fuentes, se encuentra en la lista de Pillars and Branches of Faith Browser."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 4, page 506, qui évoque les fondements de l'islam: le témoignage, la prière et la zakat. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı), Resimli Cilt 4, sayfa 506'dan, İslam'ın esasları, iman ikrarı, namaz ve zekâtı anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın Temelleri, İmanın Temelleri, İmanın Dalları ve Müminin Özellikleri için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 4 Bergambar, hlm. 506, yang menyebutkan dasar-dasar Islam, pengakuan iman, salat, dan sedekah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber. Teks ini disusun oleh peramban untuk Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Karakteristik Orang Beriman."
