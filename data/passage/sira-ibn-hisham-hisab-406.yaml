text: "… المصير؟! أسواء المَثَلاَنِ؟ فاعرفوا، هُمْ دَرَجَٰتٌ عِندَ اللهِ وَاللَّهُ بَصِيرٌ بِمَا يَعْمَلُونَ ١ : لِكُلِّ دَرَجَاتْ مِمَا عَمِلُوا في الجنة والنار، أي : إِنَّ اللّٰه لا يَخْفَىٰ عليه أَهْلُ طاعته من أهل معصيته . ثم قال: لَقَدْ مَنَّ ٱللَّهُ عَلَ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 406، يذكر رفع الدرجات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hisham's Sirah, p. 406, that speaks of ranks raised; from the extracted copy, quoted within forty words per the sources policy."
