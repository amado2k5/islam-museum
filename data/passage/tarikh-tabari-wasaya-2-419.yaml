text: "ابن عملاق بن لاون بن سام بن نوح وكان كاثرا خدماة يوسعيز الى الايمان بالله فلم يستجب اليه وان يوسف اوصى الى اخيه يهونا ومات وقد أتت له مائة وعشرون سنة وان فراق يعقوب أيَّاه كان اثنتين وعشرين سنة وان …"
