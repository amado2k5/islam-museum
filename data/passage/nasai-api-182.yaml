label: { ar: "سنن النسائي 182 — الأب والأبوة", en: "Sunan al-Nasa'i 182 — the father and fatherhood", ur: "سنن نسائی 182 — باپ اور والدیت", es: "Sunan al-Nasa'i 182 — El padre y la paternidad", fr: "Sunan al-Nasa'i 182 — le père et la paternité", tr: "Sunan an-Nasa'i 182 — Baba ve Babalık", id: "Sunan an-Nasa'i 182 — Sang Ayah dan Peran Ayah" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، قَالَ حَدَّثَنَا يَحْيَى، عَنْ جَعْفَرِ بْنِ مُحَمَّدٍ، عَنْ أَبِيهِ، عَنْ عَلِيِّ بْنِ الْحُسَيْنِ، عَنْ زَيْنَبَ بِنْتِ أُمِّ سَلَمَةَ، عَنْ أُمِّ سَلَمَةَ، أَنَّ رَسُولَ اللَّهِ أَكَلَ كَتِفًا فَجَاءَهُ بِلاَلٌ فَخَرَجَ إِلَى الصَّلاَةِ وَلَمْ يَمَسَّ مَاءً."
summary:
  ar: "حديث في سنن النسائي، رقم 182، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 182 (The Book of Purification), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 182، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 182 (El Libro de la Purificación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 182 (Le Livre de la Purification), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 182 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 182, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
