label: { ar: "سنن أبي داود 4248 — طاعة الله ورسوله، الطاعة", en: "Sunan Abi Dawud 4248 — obedience to God and His Messenger; obedience", ur: "سنن ابی داؤد 4248 — اللہ اور اس کے رسول کی اطاعت، اطاعت", fr: "Sunan Abi Dawud 4248 — l'obéissance à Dieu et à Son Messager ; l'obéissance", es: "Sunan Abi Dawud 4248 — la obediencia a Dios y a Su Mensajero; la obediencia", tr: "Sunan Abi Davud 4248 — Allah'a ve Resulüne İtaat, itaat", id: "Sunan Abi Dawud 4248 — Ketaatan kepada Allah dan Rasul-Nya, ketaatan" }
text: "… بْنِ عَمْرٍو، أَنَّ النَّبِيَّ قَالَ \" مَنْ بَايَعَ إِمَامًا فَأَعْطَاهُ صَفْقَةَ يَدِهِ وَثَمَرَةَ قَلْبِهِ فَلْيُطِعْهُ مَا اسْتَطَاعَ فَإِنْ جَاءَ آخَرُ يُنَازِعُهُ فَاضْرِبُوا رَقَبَةَ الآخَرِ \". قُلْتُ أَنْتَ سَمِعْتَ هَذَا مِنْ رَسُولِ اللَّهِ قَالَ سَمِعَتْهُ أُذُنَاىَ وَوَعَاهُ قَلْبِي. قُلْتُ هَذَا ابْنُ عَمِّكَ مُعَاوِيَةُ يَأْمُرُنَا أَنْ نَفْعَلَ وَنَفْعَلَ. قَالَ أَطِعْهُ فِي طَاعَةِ اللَّهِ وَاعْصِهِ فِي مَعْصِيَةِ اللَّهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4248، يرد فيه ذكر طاعة الله ورسوله، والطاعة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 4248 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), whose wording mentions obedience to God and His Messenger, obedience. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 4248، جس کے الفاظ میں اللہ اور اس کے رسول کی اطاعت، اطاعت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 4248, dont le texte mentionne l'obéissance à Dieu et à Son Messager, l'obéissance. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 4248, cuyo texto menciona la obediencia a Dios y a Su Mensajero, la obediencia. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 4248 numaralı hadis, Allah'a ve Resulüne itaatten bahsetmektedir. Bu hadis, farz, ibadet, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4248, menyebutkan ketaatan kepada Allah dan Rasul-Nya. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
