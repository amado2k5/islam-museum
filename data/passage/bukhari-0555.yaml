ref: "555"
label:
  ar: "البخاري 555 — يتعاقبون فيكم ملائكة: كيف تركتم عبادي"
  en: "Bukhari 555 — Angels take turns among you: how did you leave My servants"
  ur: "بخاری 555 — فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا"
text: "يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار، ويجتمعون في صلاة الفجر وصلاة العصر، ثم يعرج الذين باتوا فيكم، فيسألهم وهو أعلم بهم كيف تركتم عبادي فيقولون تركناهم وهم يصلون، وأتيناهم وهم يصلون ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 555: يتعاقبون فيكم ملائكة: كيف تركتم عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 555: Angels take turns among you: how did you leave My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 555: فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
