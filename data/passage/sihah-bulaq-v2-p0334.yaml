  بالفتح ما تدلى من الغضن وقال
  يدعو الهديل وساف حزفوة. • أصلابأودية ذوات هدال
  ( ه دمل لهدمل بالكسر الثوب الخاق قال تأبطشرا (١ عجوز عليها هدمل ذات خيعل
  والهدملة على وزن السيحلة الرلة السكثيرة الشجر عن أبي عبيد وقال ٢
  كانم ابالهدملات الرواسيم• ذل الهذاول الرجل الخفيف والسهم الخفيف
  والهذاليل التلال الصغار الواحد هذلول وه وذل البعير يبوله اذا اهتزبوله وتحرّك وه وذل
  السقاءاذا تمخض وهوذل الرجل اذا اضطرب فى عدوه وكذلك الدلو وقال
  هو ذلة المشاة فى قعر الطوى» وهذيل حى من مضروه وهذيل بن مدركة بن الياس بن مضر
  هرجات مرجل) الهمرجل من الابل السريع والميم زائدة وقال أبوز يد الهعرجلة
  من النوف النجيبة الرا-لة رطل) الهرطال الطويل رقل هرقل ملك الروم على
  وزن خند ف ويقال أيضاهرقل على وزندمشق ⁦( ركل )⁩ المركولة على وزن البردونة
  الجارية الضخمة المرتجة الارداف والهراكلة من ماء البحر حيث تثرف-ه الامواج
  قال ابن أ- ريصف درة
  رأى من دونها الغوّاص هولا • هراكلة وحمتاناونونا
  ( رمل هرمله أى نتف شعره وشعر هراميل اذاسقط قال ذوالرمّة
  ة- هرمل الصيف عن أعنامها الوبراء ⁦(هرول )⁩. الهرولة ضرب من العدووهو بين المشى
  والعدد ( زل الهزل ضد الجد وقد هزل يهزل قال الكميت
  تجدينا فى كل يوم ونهزل • والهزال ضد السمن يقال هزات الدابة هزالاعلى مالم يسم
  فاعسله وهزاتها أنا هزلا فهومه زول وأحزل القوم اذا أصابت مواشبه-م سنة فهزلت
  زبل بن السكيت مافيه هز بليلة أى شئ ( شل لهشيلة من الابل وغيره
  الذى يأخذه الرجل من غيراذن صاحبه يبلغ عليه حيث ر يدنم يرده وقال
  وكل هشيلة مادمت حيا • علمحزم الا الجمال
  هيضل أبو عبيد عن الفرا الهيضلة من النساء الضخمة الصف ومن الموق الغزيرة
  قال والهيضلة أصوات الناس وقال غيره الهيضل الميش الكثير وأنشد للكميت
  وحول سريركك من غالب • ثبى العز والعرب الهيضل
  طل ، الهطل تتابع المطر والذمع وسيلانه يقال هطلت السماءتهطل لا وهطلانا
  وتهطالا وسحاب هطل ومعار هطل كثير الهطلان وسحائب هطل جع هاطل وديمة هطلاء
  ولا يقال ساب أهطل وهذا كقواهم فرس روعاء وهى الذكيسة ولا يقال للذ كراروع
  وامرأة حسناء ولم يقولوارجل أحسن قال إمر ؤالقيس
  ديمة هطلا فيها رطف • طبق الارض تحرّى وتدر
