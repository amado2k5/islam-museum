summary:
  ar: "القسم 41 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الديات»، ويضم فيها النصوص من 4494 إلى 4595 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 41 of Sunan Abi Dawud (Types of Blood-Wit (Kitab Al-Diyat)) in the division of the open hadith dataset the museum took its reports from: reports 4494 to 4595 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 41، عنوان «کتاب الدیات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4494 تا 4595۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 41 de Sunan Abi Dawud (Tipos de Sabiduría Sanguínea (Kitab Al-Diyat)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 4494 a 4595 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
