label: { ar: "سنن أبي داود 3873 — الدواء، الداء", en: "Sunan Abi Dawud 3873 — the drug; the disease and its remedy", ur: "سنن ابی داؤد 3873 — دوا، بیماری", es: "Sunan Abi Dawud 3873 — El medicamento; la enfermedad y su remedio", fr: "Sunan Abi Dawud 3873 — le médicament; la maladie et son remède", tr: "Sunan Abi Dawud 3873 — Tıp, Hastalık", id: "Sunan Abi Dawud 3873 — Pengobatan, Penyakit" }
text: "حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا شُعْبَةُ، عَنْ سِمَاكٍ، عَنْ عَلْقَمَةَ بْنِ وَائِلٍ، عَنْ أَبِيهِ، ذَكَرَ طَارِقَ بْنَ سُوَيْدٍ أَوْ سُوَيْدَ بْنَ طَارِقٍ سَأَلَ النَّبِيَّ عَنِ الْخَمْرِ فَنَهَاهُ ثُمَّ سَأَلَهُ فَنَهَاهُ فَقَالَ لَهُ يَا نَبِيَّ اللَّهِ إِنَّهَا دَوَاءٌ. قَالَ النَّبِيُّ \" لاَ وَلَكِنَّهَا دَاءٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3873، يذكر الدواء، والداء، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3873 (Medicine (Kitab Al-Tibb)), that mentions the drug, the disease and its remedy, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3873، جس میں دوا، بیماری، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3873 (Medicina (Kitab Al-Tibb)), menciona el medicamento, la enfermedad y su remedio, así como el tratamiento con lo que está prohibido. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3873 (Médecine (Kitab Al-Tibb)), mentionne un médicament, une maladie et son remède, ainsi que le recours à des traitements interdits. Le Navigateur de Médecine le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 3873 numaralı hadiste, tıp, hastalık ve haram maddelerle tedavi konularından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3873, menyebutkan tentang obat-obatan, penyakit, dan pengobatan dengan zat-zat terlarang. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
