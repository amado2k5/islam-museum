label: { ar: "سنن أبي داود 3873 — الدواء، الداء", en: "Sunan Abi Dawud 3873 — the drug; the disease and its remedy", ur: "سنن ابی داؤد 3873 — دوا، بیماری" }
text: "حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا شُعْبَةُ، عَنْ سِمَاكٍ، عَنْ عَلْقَمَةَ بْنِ وَائِلٍ، عَنْ أَبِيهِ، ذَكَرَ طَارِقَ بْنَ سُوَيْدٍ أَوْ سُوَيْدَ بْنَ طَارِقٍ سَأَلَ النَّبِيَّ عَنِ الْخَمْرِ فَنَهَاهُ ثُمَّ سَأَلَهُ فَنَهَاهُ فَقَالَ لَهُ يَا نَبِيَّ اللَّهِ إِنَّهَا دَوَاءٌ. قَالَ النَّبِيُّ \" لاَ وَلَكِنَّهَا دَاءٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3873، يذكر الدواء، والداء، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3873 (Medicine (Kitab Al-Tibb)), that mentions the drug, the disease and its remedy, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3873، جس میں دوا، بیماری، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
