text: "فتتبعت القرآن أجمعه من الرقاع والأكتاف والعسب وصدور الرجال، حتى وجدت من سورة التوبة آيتين مع خزيمة بن ثابت لم أجدهما مع غيره"
summary:
  ar: "في كتاب فضائل القرآن باب جمع القرآن؛ رواية زيد بن ثابت نفسه: إنذار عمر بعد مقتل قراء اليمامة، وتردد أبي بكر وإلحاح عمر، ووصف مادة الجمع — النص المؤسس لتاريخ المصحف."
