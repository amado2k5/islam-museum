label: { ar: "البخاري 4986 — جمع القرآن في خلافة أبي بكر", en: "Bukhari 4986 — collecting the Qur'an under Abu Bakr", es: "Bukhari 4986 — recopilación del Corán bajo el mandato de Abu Bakr", fr: "Bukhari 4986 — Compilation du Coran sous Abu Bakr", ur: "بخاری 4986 - ابوبکر کے ماتحت قرآن جمع کرنا", tr: "Buhari 4986 — Kur'an, Ebu Bekir'in halifeliği döneminde derlenmiştir.", id: "Al-Bukhari 4986 — Al-Qur'an disusun pada masa kekhalifahan Abu Bakar" }
text: "فتتبعت القرآن أجمعه من الرقاع والأكتاف والعسب وصدور الرجال، حتى وجدت من سورة التوبة آيتين مع خزيمة بن ثابت لم أجدهما مع غيره"
summary:
  ar: "في كتاب فضائل القرآن باب جمع القرآن؛ رواية زيد بن ثابت نفسه: إنذار عمر بعد مقتل قراء اليمامة، وتردد أبي بكر وإلحاح عمر، ووصف مادة الجمع — النص المؤسس لتاريخ المصحف."
  tr: "“Kur’an’ın Faziletleri” adlı kitapta, Kur’an’ın derlenmesi bölümünde, Zeyd ibn Sabit’in kendi anlatımı yer almaktadır: Ömer’in Yamame’nin okuyucularının öldürülmesinden sonraki uyarısı, Ebu Bekir’in tereddüdü ve Ömer’in ısrarı ile derlemenin temel metni olan Kur’an tarihinin ana metni anlatılmaktadır."
  id: "Dalam kitab “Keutamaan Al-Qur’an,” pada bab tentang penyusunan Al-Qur’an, terdapat riwayat dari Zayd ibn Thabit sendiri: peringatan Umar setelah pembunuhan para pembaca Yamamah, keraguan Abu Bakr dan desakan Umar, serta uraian tentang materi penyusunan — teks dasar sejarah Al-Qur’an."
