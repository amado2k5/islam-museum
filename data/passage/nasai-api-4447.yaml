label: { ar: "سنن النسائي 4447 — الأب والأبوة", en: "Sunan al-Nasa'i 4447 — the father and fatherhood", ur: "سنن نسائی 4447 — باپ اور والدیت" }
text: "أَخْبَرَنِي عُثْمَانُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي سَهْلُ بْنُ بَكَّارٍ، قَالَ حَدَّثَنَا وُهَيْبُ بْنُ خَالِدٍ، عَنِ ابْنِ طَاوُسٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، مُحَمَّدِ بْنِ عَبْدِ اللَّهِ بْنِ عَمْرٍو قَالَ مَرَّةً عَنْ أَبِيهِ، وَقَالَ، مَرَّةً عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ نَهَى يَوْمَ خَيْبَرَ عَنْ لُحُومِ الْحُمُرِ الأَهْلِيَّةِ وَعَنِ الْجَلاَّلَةِ وَعَنْ رُكُوبِهَا وَعَنْ أَكْلِ لَحْمِهَا."
summary:
  ar: "حديث في سنن النسائي، رقم 4447، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4447 (The Book of ad-Dahaya (Sacrifices)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4447، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
