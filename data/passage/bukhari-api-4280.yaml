label: { ar: "صحيح البخاري 4280 — استحلال الشيء", en: "Sahih al-Bukhari 4280 — treating a thing as lawful", ur: "صحیح بخاری 4280 — کسی چیز کو حلال ٹھہرانا", es: "Sahih al-Bukhari 4280 — tratar algo como lícito", fr: "Sahih al-Bukhari 4280 — considérer une chose comme licite", tr: "Sahih el-Buhari 4280 — Bir şeyi helal kılmak", id: "Sahih al-Bukhari 4280 — Memperbolehkan sesuatu" }
text: "… الأَنْصَارُ عَلَيْهِمْ سَعْدُ بْنُ عُبَادَةَ مَعَهُ الرَّايَةُ. فَقَالَ سَعْدُ بْنُ عُبَادَةَ يَا أَبَا سُفْيَانَ الْيَوْمُ يَوْمُ الْمَلْحَمَةِ، الْيَوْمَ تُسْتَحَلُّ الْكَعْبَةُ. فَقَالَ أَبُو سُفْيَانَ يَا عَبَّاسُ حَبَّذَا يَوْمُ الذِّمَارِ. ثُمَّ جَاءَتْ كَتِيبَةٌ، وَهْىَ أَقَلُّ الْكَتَائِبِ، فِيهِمْ رَسُولُ اللَّهِ وَأَصْحَابُهُ، وَرَايَةُ النَّبِيِّ مَعَ الزُّبَيْرِ بْنِ الْعَوَّامِ، فَلَمَّا مَرَّ رَسُولُ اللَّهِ بِأَبِي سُفْيَانَ قَالَ أَلَمْ تَعْلَمْ مَا قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4280، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4280 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4280، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4280 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona que se considera algo lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4280 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 4280 numaralı hadis, bir şeyin helal olup olmadığını belirtir. Helal ve haram bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntılar derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4280, menyebutkan tentang kebolehan sesuatu. Bagian halal dan haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
