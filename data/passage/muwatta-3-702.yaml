label: { ar: "الموطأ 702 — مالك: الإبل العراب والبخت يجمعان على ربهما في الصدقة، إنما هي إبل كلها", en: "Muwatta 702" }
summary:
  ar: "قول لمالك: وكذلك الإبل العراب والبخت يُجمعان على ربهما في الصدقة لأنها إبل كلها، فإن كانت العراب أكثر ولم يجب إلا بعير واحد أُخذ من العراب، وإن كانت البخت أكثر أُخذ منها، فإن استوتا فمن أيتهما شاء. ويذكر المحقق أن أبا مصعب رواه عن مالك إلى قوله «في الصدقة». {cite:muwatta-maruf-1997 p.352}"
