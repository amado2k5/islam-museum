label: { ar: "الموطأ 702 — مالك: الإبل العراب والبخت يجمعان على ربهما في الصدقة، إنما هي إبل كلها", en: "Muwatta 702", es: "Muwatta 702", fr: "Muwatta 702", ur: "موطا 702", tr: "Al-Muwatta 702 — Malik: Arap ve Baktriya develeri, hepsi deve oldukları için sahiplerinden sadaka olarak alınır.", id: "Al-Muwatta 702 — Malik: Unta Arab dan unta Bactrian dikumpulkan dari pemiliknya sebagai sedekah, karena semuanya adalah unta." }
summary:
  ar: "قول لمالك: وكذلك الإبل العراب والبخت يُجمعان على ربهما في الصدقة لأنها إبل كلها، فإن كانت العراب أكثر ولم يجب إلا بعير واحد أُخذ من العراب، وإن كانت البخت أكثر أُخذ منها، فإن استوتا فمن أيتهما شاء. ويذكر المحقق أن أبا مصعب رواه عن مالك إلى قوله «في الصدقة». {cite:muwatta-maruf-1997 p.352}"
  tr: "Malik şöyle demiştir: Benzer şekilde, Arap ve Baktriya develeri, hepsi deve oldukları için sahiplerinden alınacak zekâtta birleştirilir. Eğer Arap devesi sayısı fazlaysa ve sadece bir tanesi zekât olarak verilecekse, Arap develerinden alınır. Eğer Baktriya develeri sayısı fazlaysa, onlardan alınır. Sayıları eşitse, dilediğinden verebilir. Araştırmacı, Ebu Mus'ab'ın bunu Malik'ten \"zekâtta\" ifadesine kadar rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.352}"
  id: "Malik berkata: Demikian pula, unta Arab dan unta Baktria digabungkan dalam zakat yang wajib dibayarkan oleh pemiliknya karena semuanya adalah unta. Jika ada lebih banyak unta Arab dan hanya satu yang wajib dibayarkan, maka zakat diambil dari unta Arab tersebut. Jika ada lebih banyak unta Baktria, maka zakat diambil dari unta Baktria tersebut. Jika jumlahnya sama, maka ia boleh memberikan dari unta mana pun yang diinginkannya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik hingga frasa \"dalam zakat.\" {cite:muwatta-maruf-1997 p.352}"
