label: { ar: "الموطأ 1319 — عمرو بن شعيب: لما صدر النبي من حنين وأخذت شجرة رداءه قال أدوا الخياط والمخيط فإن الغلول عار ونار", en: "Muwatta 1319" }
text: "فَإِنَّ الْغُلُولَ عَارٌ، وَنَارٌ، وَشَنارٌ على أَهْلِهِ يَوْمَ الْقِيامةِ"
summary:
  ar: "يروي مالك عن عبد ربه بن سعيد عن عمرو بن شعيب أن رسول الله حين صدر من حنين، وهو يريد الجعرانة، سأله الناس حتى دنت به ناقته من شجرة فتشبكت برداءه، فقال رُدوا علي ردائي، ثم قال لو أفاء الله عليكم مثل سمر تهامة نعما لقسمته بينكم، ثم قام في الناس وقال أدوا الخياط والمخيط، فإن الغلول عار ونار وشنار على أهله يوم القيامة. ويذكر المحقق أن ابن عبد البر قال إن الحديث مرسل عن عمرو بن شعيب عند مالك، وقد روي متصلا عن عمرو عن أبيه عن جده. {cite:muwatta-maruf-1997 p.589}"
