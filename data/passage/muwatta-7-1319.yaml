label: { ar: "الموطأ 1319 — عمرو بن شعيب: لما صدر النبي من حنين وأخذت شجرة رداءه قال أدوا الخياط والمخيط فإن الغلول عار ونار", en: "Muwatta 1319", es: "Muwatta 1319", fr: "Muwatta 1319", ur: "موطا 1319", tr: "El-Muvatta 1319 — Amr ibn Şuayb: Peygamber Huneyn'den döndüğünde bir ağaç onun cübbesini aldı. Peygamber, \"İğneyi ve ipliği geri ver, çünkü zimmete para geçirmek rezillik ve ateştir\" dedi.", id: "Al-Muwatta 1319 — Amr ibn Shu’ayb: Ketika Nabi kembali dari Hunayn dan sebatang pohon mengambil jubahnya, beliau bersabda, “Kembalikan jarum dan benangnya, karena penggelapan adalah kehinaan dan api neraka.”" }
text: "فَإِنَّ الْغُلُولَ عَارٌ، وَنَارٌ، وَشَنارٌ على أَهْلِهِ يَوْمَ الْقِيامةِ"
summary:
  ar: "يروي مالك عن عبد ربه بن سعيد عن عمرو بن شعيب أن رسول الله حين صدر من حنين، وهو يريد الجعرانة، سأله الناس حتى دنت به ناقته من شجرة فتشبكت برداءه، فقال رُدوا علي ردائي، ثم قال لو أفاء الله عليكم مثل سمر تهامة نعما لقسمته بينكم، ثم قام في الناس وقال أدوا الخياط والمخيط، فإن الغلول عار ونار وشنار على أهله يوم القيامة. ويذكر المحقق أن ابن عبد البر قال إن الحديث مرسل عن عمرو بن شعيب عند مالك، وقد روي متصلا عن عمرو عن أبيه عن جده. {cite:muwatta-maruf-1997 p.589}"
  id: "Malik meriwayatkan dari Abd Rabbih ibn Sa'id, dari Amr ibn Shu'ayb, bahwa ketika Rasulullah shalla Allahu alaihi wa sallam kembali dari Hunayn, menuju Jiranah, orang-orang meminta sesuatu kepadanya hingga untanya mendekati sebuah pohon dan tersangkut jubahnya. Beliau berkata, \"Kembalikan jubahku.\" Kemudian beliau berkata, \"Sekiranya Allah menganugerahkan kepada kalian ternak sebanyak pohon akasia di Tihamah, aku akan membaginya di antara kalian.\" Kemudian beliau berdiri di hadapan orang-orang dan berkata, \"Kembalikanlah meskipun hanya barang yang sedikit, karena penggelapan adalah kehinaan, api neraka, dan aib bagi pelakunya di Hari Kiamat.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits tersebut mursal (hadits dengan rantai periwayatan yang hilang) menurut Amr bin Syu'aib berdasarkan Malik, dan hadits tersebut juga diriwayatkan dengan rantai periwayatan yang berkesinambungan menurut Amr, menurut ayahnya, menurut kakeknya. {cite:muwatta-maruf-1997 p.589}"
