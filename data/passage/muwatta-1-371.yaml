label: { ar: "الموطأ 371 — عمر بن أبي سلمة: رآه يصلي في ثوب واحد مشتملاً به", en: "Muwatta 371", es: "Muwatta 371", fr: "Muwatta 371", ur: "موطا 371", tr: "El-Muvatta 371 — Ömer ibn Abi Salama: Onu tek bir giysiyle, ona sarınmış halde namaz kılarken gördü.", id: "Al-Muwatta 371 — Umar ibn Abi Salama: Dia melihatnya shalat dengan sehelai pakaian, terbungkus di dalamnya" }
text: "رأى رسول الله يصلي في ثوب واحد مشتملاً به في بيت أم سلمة واضعاً طرفيه على عاتقيه"
summary:
  ar: "أول حديث في باب الرخصة في الصلاة في الثوب الواحد. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عمر بن أبي سلمة أنه رأى النبي يصلي في ثوب واحد مشتملاً به في بيت أم سلمة واضعاً طرفيه على عاتقيه. ويخرّجه المحقق عند النسائي (2/70) والبغوي والجوهري من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه لم يُختلف عن مالك في إسناده ولفظه وكذلك رواه أصحاب هشام ⁦(التمهيد 22/209)⁩. {cite:muwatta-maruf-1997 p.202}"
  tr: "Tek elbise ile namaz kılmanın caizliği bölümündeki ilk hadis. Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından, o da Ömer ibn Ebu Seleme'den rivayet ettiğine göre, Peygamber'i Ümmü Seleme'nin evinde tek elbise içinde, omuzlarına dolanmış şekilde namaz kılarken görmüştür. Bu hadis, Malik'in sahabelerinin rivayet zincirleriyle Nesai (2/70), Bağavi ve Cevhari tarafından da nakledilmiştir. İbn Abdülberr'den rivayet edildiğine göre, Malik'ten gelen rivayet zincirinde ve lafzında ihtilaf yoktur ve Hişam'ın sahabeleri de aynı şekilde rivayet etmişlerdir (Tamhid 22/209). {kaynak: Muwatta-maruf-1997 s.202}"
  id: "Hadits pertama dalam bab ini adalah tentang kebolehan shalat dengan sehelai pakaian. Diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya, dari Umar ibn Abi Salamah, bahwa ia melihat Nabi shalat dengan sehelai pakaian, terbungkus di dalamnya, di rumah Umm Salamah, dengan ujung-ujungnya diletakkan di atas bahunya. Hadits ini dikutip oleh al-Nasa'i (2/70), al-Baghawi, dan al-Jawhari melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa tidak ada perbedaan pendapat mengenai sanad atau redaksi dari Malik, dan bahwa para sahabat Hisham juga meriwayatkannya dengan cara yang sama (al-Tamhid 22/209). {cite:muwatta-maruf-1997 p.202}"
