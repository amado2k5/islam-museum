label: { ar: "الموطأ 371 — عمر بن أبي سلمة: رآه يصلي في ثوب واحد مشتملاً به", en: "Muwatta 371" }
text: "رأى رسول الله يصلي في ثوب واحد مشتملاً به في بيت أم سلمة واضعاً طرفيه على عاتقيه"
summary:
  ar: "أول حديث في باب الرخصة في الصلاة في الثوب الواحد. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عمر بن أبي سلمة أنه رأى النبي يصلي في ثوب واحد مشتملاً به في بيت أم سلمة واضعاً طرفيه على عاتقيه. ويخرّجه المحقق عند النسائي (2/70) والبغوي والجوهري من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه لم يُختلف عن مالك في إسناده ولفظه وكذلك رواه أصحاب هشام (التمهيد 22/209). {cite:muwatta-maruf-1997 p.202}"
