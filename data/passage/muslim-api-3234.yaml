text: "… الْحَارِثِ - حَدَّثَنَا عَبْدُ اللَّهِ، بْنُ عَوْنٍ عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّهُ انْتَهَى إِلَى الْكَعْبَةِ وَقَدْ دَخَلَهَا النَّبِيُّ وَبِلاَلٌ وَأُسَامَةُ وَأَجَافَ عَلَيْهِمْ عُثْمَانُ بْنُ طَلْحَةَ الْبَابَ قَالَ فَمَكَثُوا فِيهِ مَلِيًّا ثُمَّ فُتِحَ الْبَابُ فَخَرَجَ النَّبِيُّ وَرَقِيتُ الدَّرَجَةَ فَدَخَلْتُ الْبَيْتَ فَقُلْتُ أَيْنَ صَلَّى النَّبِيُّ قَالُوا هَا هُنَا. قَالَ وَنَسِيتُ أَنْ أَسْأَلَهُمْ كَمْ صَلَّى"
summary:
  ar: "حديث في صحيح مسلم، رقم 3234، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 3234 (The Book of Pilgrimage), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 3234، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
