text: |-
  ٦١٠
  يقول استاع يستيع فيحذف اظاء استئة الاوهو يريداستطاع يستطييع قال وبعض
  يقول أسطاع بسطبع بقطع الالف وهو يريد أن يقول أطاع يطبع ويجعل السين ءوضا
  من ذهاب حركة عين الفعل ويقال تطاوع اهذا الامرحق تستطيعه وتطوّع أى ت-كاف
  استطاعته والتطوّع بالشئ التبرع به وقوله ته سالى فطوّءت له نفسه قنسل أخيه قال الاخفش
  هومثل طوّقت له ومعناه رخصت وسهلت والمطوّعة الذين يتطوّعون بالجهادو منه قوله تعالى
  الذين يلمزون المطوّعين وأصله المتطوّعين فأدغم والمطاوعة الموافقسة والنحويون ربي لسموا
  الفعل اللازم مطاوعا ورجل مطواع أى مطيع وفلان حسن الطواعية للامنال الثمانية أى
  حسن الطاعة لك وطاع لديطوع اذا انقاد ولانه لا يطوع بكذا أى لا يتابعه ويقال جاء
  فلان طائعا غيره كره والجمع طوع قال أبويوسف يقال قد أطاع النخل والشجراذا أدرل
  تمبره وأمكن أن يجتنى وقد أطاع له المرتع أى تسع له وأمكنه من الرعى قال أوس بن حجر
  كأنّ جيادنا فى رءن زم * جرادقد أطاع له الوراق
  وقد يقال فى هذا المعف طاع له المرتع ويقال أمرهفاطاعه بالالف لاغير وانطاع له أى انقاد
  عن أبى عبيد ورجل طبع ١ ى طائع
  صل الف).) ( لع لع البعيريظلع ظلعا أى غمز فى مشيه قال أيوذؤيبيذ كرفرسا
