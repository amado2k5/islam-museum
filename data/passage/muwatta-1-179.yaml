label: { ar: "الموطأ 179 — مالك: لا نداء للجمعة إلا بعد الزوال", en: "Muwatta 179", es: "Muwatta 179", fr: "Muwatta 179", ur: "موطا 179", tr: "Al-Muwatta 179 — Malik: Cuma namazı için öğleden sonra dışında ezan okunmaz.", id: "Al-Muwatta 179 — Malik: Tidak ada azan untuk salat Jumat kecuali setelah tengah hari." }
summary:
  ar: "فتوى لمالك في باب ما جاء في النداء للصلاة: سُئل عن النداء يوم الجمعة هل يكون قبل أن يحل الوقت، فقال: لا يكون إلا بعد أن تزول الشمس. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن في صحيح البخاري (904) من حديث أنس أن النبي كان يصلي الجمعة حين تميل الشمس. {cite:muwatta-maruf-1997 p.118}"
  id: "Fatwa Malik tentang seruan salat: Beliau ditanya apakah seruan salat Jumat harus dikumandangkan sebelum waktu salat, dan beliau menjawab: Seruan itu hanya boleh dikumandangkan setelah matahari melewati titik zenitnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan bahwa dalam Sahih al-Bukhari (904), terdapat hadits dari Anas yang menyatakan bahwa Nabi (shalawat dan salam kepadanya) biasa melaksanakan salat Jumat setelah matahari melewati titik zenitnya. {cite:muwatta-maruf-1997 p.118}"
