summary:
  ar: "فتوى لمالك في باب ما جاء في النداء للصلاة: سُئل عن النداء يوم الجمعة هل يكون قبل أن يحل الوقت، فقال: لا يكون إلا بعد أن تزول الشمس. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن في صحيح البخاري (904) من حديث أنس أن النبي كان يصلي الجمعة حين تميل الشمس. {cite:muwatta-maruf-1997 p.118}"
