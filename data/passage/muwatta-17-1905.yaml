label: { ar: "الموطأ 1905 — مالك: لا بأس بأن يبتاع البعير النجيب بالبعيرين أو الأبعرة من الحمولة من حاشية الإبل، فإذا اختلفت واضحا فلا بأس بالاثنين بواحد إلى أجل، وإن أشبه بعضها بعضا فلا يؤخذ منها اثنان بواحد إلى أجل", en: "Muwatta 1905", es: "Muwatta 1905", fr: "Muwatta 1905", ur: "موطا 1905", tr: "El-Muvatta 1905 — Malik: Deve sürüsünden iki veya daha fazla deve karşılığında güzel bir deve satın almakta bir sakınca yoktur. Eğer develer birbirinden çok farklıysa, iki deveyi bir deve fiyatına krediyle almakta bir sakınca yoktur. Ancak birbirlerine benziyorlarsa, iki deveyi bir deve fiyatına krediyle almak doğru değildir.", id: "Al-Muwatta 1905 — Malik: Tidak ada salahnya membeli seekor unta yang bagus dengan dua ekor unta atau lebih dari kawanan unta. Jika unta-unta tersebut jelas berbeda, maka tidak ada salahnya membeli dua ekor dengan harga satu ekor secara kredit. Tetapi jika unta-unta tersebut serupa, maka sebaiknya jangan membeli dua ekor dengan harga satu ekor secara kredit." }
summary:
  ar: "قال مالك: ولا بأس بأن يبتاع البعير النجيب بالبعيرين أو الأبعرة من الحمولة من حاشية الإبل، وإن كانت من نعم واحدة. فلا بأس أن يشترى منها اثنان بواحد إلى أجل، إذا اختلفت فبان اختلافها، وإن أشبه بعضها بعضا، واختلفت أجناسها أو لم تختلف، فلا يؤخذ منها اثنان بواحد إلى أجل. {cite:muwatta-maruf-1997 p.181}"
  tr: "Malik şöyle dedi: Bir deve sürüsünden, hatta aynı sürüden olsalar bile, iki veya daha fazla deveyi bir fiyata almakta bir sakınca yoktur. Eğer develer farklıysa ve aralarındaki fark açıkça belliyse, iki deveyi bir fiyatına krediyle almak caizdir. Ancak, farklı cinslerden olsalar bile, benzerlerse, iki deveyi bir fiyatına krediyle almak caiz değildir. {cite:muwatta-maruf-1997 s.181}"
  id: "Malik berkata: Tidak ada salahnya membeli unta yang bagus dengan harga dua unta atau lebih dari satu kawanan unta, meskipun keduanya berasal dari kawanan yang sama. Diperbolehkan membeli dua unta dengan harga satu unta secara kredit jika keduanya berbeda dan perbedaannya terlihat jelas. Namun, jika keduanya serupa, baik dari jenis yang berbeda maupun tidak, maka tidak diperbolehkan membeli dua unta dengan harga satu unta secara kredit. {cite:muwatta-maruf-1997 p.181}"
