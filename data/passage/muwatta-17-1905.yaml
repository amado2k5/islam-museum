label: { ar: "الموطأ 1905 — مالك: لا بأس بأن يبتاع البعير النجيب بالبعيرين أو الأبعرة من الحمولة من حاشية الإبل، فإذا اختلفت واضحا فلا بأس بالاثنين بواحد إلى أجل، وإن أشبه بعضها بعضا فلا يؤخذ منها اثنان بواحد إلى أجل", en: "Muwatta 1905" }
summary:
  ar: "قال مالك: ولا بأس بأن يبتاع البعير النجيب بالبعيرين أو الأبعرة من الحمولة من حاشية الإبل، وإن كانت من نعم واحدة. فلا بأس أن يشترى منها اثنان بواحد إلى أجل، إذا اختلفت فبان اختلافها، وإن أشبه بعضها بعضا، واختلفت أجناسها أو لم تختلف، فلا يؤخذ منها اثنان بواحد إلى أجل. {cite:muwatta-maruf-1997 p.181}"
