label: { ar: "الموطأ 2169 — مالك عن أبي الزناد عن الأعرج عن أبي هريرة: لا يمنع فضل الماء ليمنع به الكلأ", en: "Muwatta 2169", es: "Muwatta 2169", fr: "Muwatta 2169", ur: "موطا 2169", tr: "El-Muvatta 2169 — Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle: Otlakların ekimini engellemek için fazla suyu tutmak doğru değildir.", id: "Al-Muwatta 2169 — Malik, dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah: Tidaklah pantas menahan air berlebih untuk mencegah penanaman padang rumput." }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: لا يمنع فضل الماء ليمنع به الكلأ. {cite:muwatta-maruf-1997 p.289}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Mera ekimini engellemek için fazla suyu tutmak doğru değildir.\" {cite:muwatta-maruf-1997 s.289}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Janganlah seseorang menahan air berlebih untuk mencegah penanaman padang rumput.\" {cite:muwatta-maruf-1997 p.289}"
