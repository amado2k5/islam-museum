label: { ar: "نوادر جحا الكبرى، ص 20 — «البغال في الآخرة»", en: "Nawadir Juha al-Kubra, p. 20 — 'Mules in the Afterlife'", ur: "نوادر جحا الکبریٰ، ص 20 — «آخرت میں خچر»", fr: "Nawadir Juha al-Kubra, p. 20 — « Les mulets dans l'au-delà »", es: "Nawadir Juha al-Kubra, p. 20 — «Las mulas en el más allá»" }
text: "… البغال في الآخرة كان يتمشّى يوماً في مقبرة فزلّتْ رِجْلُهُ في قبر قديم، فوقع، ولما كان في داخل القبر، خطر له أن يجرِّبَ فيما إذا كان يأتيه الملكان، منكر ونكير، لو صادفاه في القبر أم لا. ولم يمضٍ عليه إلَّا …"
summary:
  ar: "سقط جحا في قبر قديم ليختبر هل يأتيه الملكان، فأفزعته أجراس البغال فخرج منه، وضربه البغالون، فسألته زوجته عما رأى فقال إن الآخرة لا شيء إن لم تفزعك البغال. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  en: "Juha falls into an old grave to test whether the angels come; the bells of mules scare him out, the muleteers beat him, and his wife asks what he saw; Juha says the afterlife is nothing if mules do not frighten you. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  ur: "جحا نے یہ آزمانے کے لیے کہ فرشتے آتے ہیں یا نہیں، ایک پرانی قبر میں چھلانگ لگائی؛ خچروں کی گھنٹیوں نے اسے ڈرا کر باہر نکال دیا اور خچر بانوں نے اسے مارا، پھر بیوی نے پوچھا کہ اس نے کیا دیکھا تو جحا نے کہا کہ آخرت کچھ بھی نہیں اگر خچر تمہیں نہ ڈرائیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  fr: "Juha tombe dans une vieille tombe pour vérifier si les anges viennent ; les clochettes de mulets l'effraient et le font sortir, les muletiers le battent, et sa femme lui demande ce qu'il a vu ; Juha répond que l'au-delà n'est rien si les mulets ne vous font pas peur. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
  es: "Juha cae en una tumba vieja para comprobar si vienen los ángeles; los cascabeles de unas mulas lo asustan y lo hacen salir, los arrieros lo golpean, y su mujer le pregunta qué vio; Juha dice que el más allá no es nada si las mulas no te asustan. {cite:juha-nawadir-kubra-djuwaydi p. 20}"
