label: { ar: "الموطأ 1026 — ابن عمر عن النبي: خمس من الدواب ليس على المحرم في قتلهن جناح: الغراب، والحدأة، والعقرب، والفأرة، والكلب العقور", en: "Muwatta 1026", es: "Muwatta 1026", fr: "Muwatta 1026", ur: "موطا 1026", tr: "El-Muvatta 1026 — İbn Ömer, Peygamber'den rivayetle: İhramda olan hacı için karga, çaylak, akrep, fare ve kuduz köpek olmak üzere beş hayvanı öldürmekte bir sakınca yoktur.", id: "Al-Muwatta 1026 — Ibnu Umar berdasarkan riwayat Nabi: Tidak ada dosa bagi seorang jamaah haji yang sedang ihram membunuh lima hewan: burung gagak, burung layang-layang, kalajengking, tikus, dan anjing gila." }
text: "خمس من الدواب ليس على المحرم في قتلهن جناح: الغراب، والحدأة، والعقرب، والفأرة، والكلب العقور"
summary:
  ar: "أول حديث في باب ما يقتل المحرم من الدواب. يرويه مالك عن نافع عن عبد الله بن عمر، أن رسول الله قال: خمس من الدواب ليس على المحرم في قتلهن جناح: الغراب، والحدأة، والعقرب، والفأرة، والكلب العقور. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1183) وإسحاق الطباع وسويد (629) والبخاري وغيرهم كثيرون، ويحيل على التمهيد (15/153). {cite:muwatta-maruf-1997 p.479}"
  id: "Hadits pertama dalam bab tentang hewan yang boleh dibunuh oleh seorang jamaah haji yang sedang ihram. Diriwayatkan oleh Malik dari Nafi' dari Abdullah ibn Umar, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: \"Ada lima jenis hewan yang tidak boleh dibunuh oleh seorang jamaah haji yang sedang ihram: burung gagak, burung layang-layang, kalajengking, tikus, dan anjing gila.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1183), Ishaq al-Tabba', Suwaid (629), al-Bukhari, dan banyak lainnya, dan beliau merujuk pada al-Tamhid (15/153). {cite:muwatta-maruf-1997 p.479}"
