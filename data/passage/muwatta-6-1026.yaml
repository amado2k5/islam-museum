label: { ar: "الموطأ 1026 — ابن عمر عن النبي: خمس من الدواب ليس على المحرم في قتلهن جناح: الغراب، والحدأة، والعقرب، والفأرة، والكلب العقور", en: "Muwatta 1026" }
text: "خمس من الدواب ليس على المحرم في قتلهن جناح: الغراب، والحدأة، والعقرب، والفأرة، والكلب العقور"
summary:
  ar: "أول حديث في باب ما يقتل المحرم من الدواب. يرويه مالك عن نافع عن عبد الله بن عمر، أن رسول الله قال: خمس من الدواب ليس على المحرم في قتلهن جناح: الغراب، والحدأة، والعقرب، والفأرة، والكلب العقور. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1183) وإسحاق الطباع وسويد (629) والبخاري وغيرهم كثيرون، ويحيل على التمهيد (15/153). {cite:muwatta-maruf-1997 p.479}"
