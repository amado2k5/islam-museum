text: "وللمطلقات متاع بالمعروف الاية أخرج ابن جرير عن ابن زيد قال لما نزلت ومتعوهن على الموسع قدره وعلى المقتر قدره متاعا بالمعروف حقا على المحسنين قال رجل إن أحسنت فعلت وإن لم أرد ذلك لم أفعل فأنزل الله وللمطلقات متاع بالمعروف حقا على المتقين"
