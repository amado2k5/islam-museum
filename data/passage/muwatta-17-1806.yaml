label: { ar: "الموطأ 1806 — يحيى عن مالك عن نافع عن ابن عمر: من باع نخلا قد أبرت فثمرها للبائع إلا أن يشترط المبتاع", en: "Muwatta 1806", es: "Muwatta 1806", fr: "Muwatta 1806", ur: "موطا 1806", tr: "El-Muvatta 1806 — Yahya, Malik'ten, o da Nafi'den, o da İbn Umar'dan rivayetle: Döllenmiş bir hurma ağacını satan kimsenin meyvesi, alıcı aksini şart koşmadıkça satıcıya aittir.", id: "Al-Muwatta 1806 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Nafi’ berdasarkan riwayat Ibn Umar: Barang siapa menjual pohon kurma yang telah diserbuki, buahnya menjadi milik penjual kecuali jika pembeli menetapkan sebaliknya." }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: من باع نخلا قد أبرت، فثمرها للبائع، إلا أن يشترط المبتاع. {cite:muwatta-maruf-1997 p.139}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Kim döllenmiş bir hurma ağacını satarsa, alıcı aksini şart koşmadıkça, meyvesi satıcıya aittir.\" {cite:muwatta-maruf-1997 s.139}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi', dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: \"Barang siapa menjual pohon kurma yang telah diserbuki, maka buahnya menjadi milik penjual, kecuali jika pembeli menetapkan sebaliknya.\" {cite:muwatta-maruf-1997 p.139}"
