text: "… أوْ نَهَىٰ عَنْهُ، وهذا القَوْلُ هُوَ الصَّحِيحُ فإنَّ الحُكْمَ بِبُطْلانِها حُكْمٌ بِالتَّحْرِيمِ والتَّأثِيمِ، ومَعْلُومٌ أنَّهُ لا حَرامَ إلّا ما حَرَّمَهُ الله ورَسُولُهُ، ولا تأثِيمَ إلّا ما أنَّمَ اللهُ ورَسُولُهُ بِهِ فاعِلَهُ، كَما أنَّهُ لا واجِبَ إلّا ما أوْجَبَهُ اللهُ، ولا …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 133، يرد فيه ذكر الواجب، وما يجب على المكلف، والحرام، وما حرّم الله ورسوله، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 133, whose wording mentions the obligatory (wajib), what is binding on the person addressed, the forbidden (haram), what God and His Messenger forbade, forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 133 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، حرام، جو اللہ اور اس کے رسول نے حرام کیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 133, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, l'interdit (haram), ce que Dieu et Son Messager ont interdit, l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 133, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo prohibido (haram), lo que Dios y Su Mensajero prohibieron, la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
