label: { ar: "جامع الترمذي 3145 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 3145 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 3145 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا عَبْدُ بْنُ حُمَيْدٍ، حَدَّثَنَا سُلَيْمَانُ بْنُ دَاوُدَ، عَنْ شُعْبَةَ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، وَلَمْ يَذْكُرْ عَنِ ابْنِ عَبَّاسٍ، وَهُشَيْمٍ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ : ⁦(وَلاَ تَجْهَرْ بِصَلاَتِكَ )⁩ قَالَ نَزَلَتْ بِمَكَّةَ كَانَ رَسُولُ اللَّهِ إِذَا رَفَعَ صَوْتَهُ بِالْقُرْآنِ سَبَّهُ الْمُشْرِكُونَ وَمَنْ أَنْزَلَهُ وَمَنْ جَاءَ بِهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3145، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3145 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3145، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
