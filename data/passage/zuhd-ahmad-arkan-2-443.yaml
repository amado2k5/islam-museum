text: "… يَرفَعُ صوتَه، فقال الحسنُ: إِنِّي أَرى الشَّيطانَ يُبكي هذا الآنَ. - حدَّثنا عبدُ الله، قال: حدَّثني يحيى بنُ مَعينٍ، قال: ثنا يحيى بنُ سعيدٍ، عن عوفٍ، عنِ الحسنِ: ما بين المعقوفتين سقط مِنَ الأصل المخطوط، واستدركتُه من شُعب الإيمان، وقد …"
