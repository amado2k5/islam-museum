label: { ar: "الموطأ 1006 — هشام بن عروة عن أبيه: الزبير بن العوام كان يتزود صفيف الظباء في الإحرام، والصفيف القديد", en: "Muwatta 1006", es: "Muwatta 1006", fr: "Muwatta 1006", ur: "موطا 1006", tr: "El-Muvatta 1006 — Hişam ibn Urve, babasından rivayetle: El-Zübeyr ibn el-Evvem, ihramlı olduğu dönemde kurutulmuş ceylan eti erzakı taşırdı.", id: "Al-Muwatta 1006 — Hisham ibn Urwah, berdasarkan keterangan ayahnya: Al-Zubayr ibn al-Awwam biasa membawa bekal berupa daging kijang kering saat dalam keadaan ihram." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن الزبير بن العوام كان يتزود صفيف الظباء في الإحرام. ويقول مالك: والصفيف القديد. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1138) وسويد (571)، وأن مالكاً سيأتي عنده التفسير. {cite:muwatta-maruf-1997 p.471}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Zubeyr ibn el-Evvem'in ihram halindeyken erzak olarak kurutulmuş ceylan eti aldığını nakletmiştir. Malik şöyle der: \"'El-safif' kurutulmuş et demektir.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1138) ve Suveyd (571) tarafından nakledildiğini ve Malik'in açıklamasının daha sonra geleceğini belirtmektedir. {cite:muwatta-maruf-1997 s.471}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, yang juga dari ayahnya, bahwa Zubayr ibn al-Awwam biasa mengonsumsi daging kijang kering sebagai bekal untuk keadaan ihramnya. Malik berkata: \"Dan 'al-safif' artinya daging kering.\" Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus'ab (1138) dan Suwayd (571), dan penjelasan Malik akan disampaikan kemudian. {cite:muwatta-maruf-1997 p.471}"
