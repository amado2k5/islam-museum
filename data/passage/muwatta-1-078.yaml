label: { ar: "الموطأ 78 — مالك فيمن نسي مسح رأسه حتى جف وضوؤه", en: "Muwatta 78", es: "Muwatta 78", fr: "Muwatta 78", ur: "موطا 78", tr: "El-Muvatta 78 — Malik, abdest suyu kuruyana kadar başını silmeyi unutan kimse hakkında.", id: "Al-Muwatta 78 — Malik tentang orang yang lupa mengusap kepalanya sampai air wudhunya kering" }
summary:
  ar: "فتوى لمالك في باب ما جاء في المسح بالرأس والأذنين: سُئل عن رجل توضأ فنسي أن يمسح رأسه حتى جف وضوؤه، فقال إنه يرى أن يمسح رأسه، وإن كان قد صلى أعاد الصلاة. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.75}"
  tr: "Malik'in baş ve kulak silme ile ilgili fetvası: Abdest alan ancak abdest suyu kuruyana kadar başını silmeyi unutan bir adam hakkında kendisine soru soruldu. Malik, adamın başını silmesinin gerektiğini ve eğer namaz kılmışsa namazı tekrar kılmasının gerektiğini söyledi. Araştırmacı, bu fetvanın Ebu Mus'ab tarafından Malik'ten rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.75}"
  id: "Fatwa Malik tentang mengusap kepala dan telinga: Beliau ditanya tentang seorang pria yang berwudhu tetapi lupa mengusap kepalanya sampai air wudhunya kering. Beliau berkata bahwa menurutnya pria itu harus mengusap kepalanya, dan jika ia sudah shalat, ia harus mengulangi shalatnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.75}"
