summary:
  ar: "قال مالك في الرجل يشتري الإبل أو الغنم أو البز أو الرقيق، أو شيئا من العروض جزافا: إنه لا يكون الجزاف في شيء مما يعد عدا. {cite:muwatta-maruf-1997 p.219}"
  tr: "Malik, deve, koyun, kumaş, köle veya başka herhangi bir malı toplu olarak satın alan bir kişi hakkında şöyle demiştir: Sayılan hiçbir şey için toplu alım caiz değildir. {cite:muwatta-maruf-1997 s.219}"
  id: "Malik berkata mengenai seorang pria yang membeli unta, domba, kain, budak, atau barang-barang lainnya dalam jumlah besar: Pembelian dalam jumlah besar tidak diperbolehkan untuk apa pun yang dihitung. {cite:muwatta-maruf-1997 p.219}"
