text: |-
  ١ ي تى تسيره فى غطل بالها مشر
  ٤٢٤
  وتمزت الكبس مثل غبطت والغموز من النوق مثل العرول والشكول عن أبى عبيد
  الفرز ما اطمأن من الارض قال رؤ بة يصف فاقته كم جاوزت من حدب وفرز
  والفرز أيضامصد رقولك فرزت الشى أفرزه فرزا اذا عزلته عن غيره وحزته والقطعة من
  فرزة بالكسر وكذلك أفرزته بالالف وفارزفلان شريكه أى فاصله وقاطعه وأفرزه الصيد
  أى أمكنه فرماهمن قرب وأما إفريز الحائط فعرب ومنه توب مه روز فزز) فزالجرح يقز
  فزيزا أى ندى وسال واستفزه الحوف أى استخفه وقعد مستفزا أى غير. طلمئن وأفززته
  افزعته وأزعجته وطيرت فواده قال أبوذؤيب
  والدهرلايبق على حدثانه * شبب أفرته الكلاب مروع!
  ورجل فزأى خفيف والفزأ يضا ولد البقرة والمع أفزاز قال زهير
  كما استغاث بسي فزغيطلة • خاف العيون ولم ينظر به الحشك ١
  لز) الفلز بالكسر وتشديد الزاى ما ينفيه الكير ممايذاب من جواهر الارض
  ⁦( فود )⁩ القوز النجاة والظفر باير والفوز أيضا الهلال تقول مننهمافازيفوز
  وفوزأى مات ومنه قول الشاعر⁦(كعب بن زهير)⁩
  فن القوافى شأنهامن حوكها * اذا مانوى كعب وفوزجرول
  وقال التكممت
  وماضرها ان كعبانوى * وفوز من بعده جرول
  وأفازه اللّٰه بكذا ففاز به أى ذهب به وقوله تعالى فلا تحسبنه-م بمفازة من العذاب أى بمنجاة
  منّه والمفازة أيضا واحدة المضاوز قال ابن الاعرابي سميت بذلك لانها مهلسكة من فوزأى
  هلك وقال الاصعى سهيت بذلك تفاؤلا بالسلامة والفوزويقال فوّز الرجل بابلداذاركب
  بها المفازة ومنه قول الراجز فوز من قراقر الى سوى* وهماما آن السكلب والفازة مظله
  تد بعمودعربى فيما أرى
  صل القاف ( ز القحز الوثب والقلق تقول منه ضر بته فقحز قال
  أبو كبيريصف الطعنة
  مستنستن الفلومرشة • تنقى التراب بقاحز معرورف
  والمعرورف الذى له عرف من ارتفاءه وفحزه غيره تقميزا أى نزاه والقماز داء يصيب الغم
  ربز جل قربز أى خب مثل جربزوه مامعريان زز) التقزز التنطس والتباعد
  م الدنس وقد تقززمن أكل الضب وغيره فهورجسل قز وقز وقزثلاث لغات وأما القزمن
  الإبر يسم فعرب والقازوزة مشرية وهى قدح وكذلك القاقوزة ولا تقل فاقزة فال اين
  السكيت أما القاقزة ولدة وأند
  أفنى تلادى وماجعت من تشب • قرع القواقيز أفواه الاباريق
  عز قعزالاناءم زاأى ملا ه وأيضاشربه شرباشديدا عفز) قال القراء بقال
  جلس ذ-لان القعفزى وقد اقعنفز أى جلس مستوفزا ⁦(قفز)⁩ قفزيقنز قفزا وقفزانا
  وثب ويقال جاءت الخسل تعد والقفزى من القفز والقفيز كيال وهو ثمائية مكاكيك
  والجع
