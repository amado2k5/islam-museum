label: { ar: "الموطأ 2356 — مالك: ولد الأمة الموصى بعتقها غير المدبرة لا يعتق معها", en: "Muwatta 2356", es: "Muwatta 2356", fr: "Muwatta 2356", ur: "موطا 2356" }
summary:
  ar: "قال مالك: وكل ولد ولدته أمة أوصي بعتقها ولم تدبر، فإن ولدها لا يعتقون معها إذا عتقت؛ لأن سيدها يغير وصيته إن شاء ويردها متى شاء، ولم تثبت لها عتاقة. وإنما هي بمنزلة رجل قال لجاريته: إن بقيت عندي فلانة حتى أموت فهي حرة. فإن أدركت ذلك كان لها، وإن شاء قبل ذلك باعها وولدها، لأنه لم يدخل ولدها في شيء مما جعل لها. {cite:muwatta-maruf-1997 p.371} {cite:muwatta-maruf-1997 p.372}"
  tr: "Malik şöyle dedi: Eğer bir köle kadına özgürlüğü vasiyet edilmişse ama henüz özgür bırakılmamışsa, çocukları da onunla birlikte özgür bırakılmaz. Çünkü efendisi dilediği zaman vasiyetini değiştirebilir ve istediği zaman geri alabilir; özgürlüğü ise kesinleşmiş değildir. Bu, bir adamın köle kızına, \"Eğer filanca kişi ben ölene kadar benimle kalırsa, özgürdür\" demesine benzer. Eğer o zamana kadar yaşarsa, özgürdür. Eğer efendisi bundan önce isterse, onu ve çocuğunu satabilir, çünkü çocuğu ona ait olan hiçbir şeye dahil değildir. {cite:muwatta-maruf-1997 s.371} {cite:muwatta-maruf-1997 s.372}"
  id: "Malik berkata: Jika seorang budak perempuan diwariskan kebebasannya tetapi belum dibebaskan, anak-anaknya tidak ikut dibebaskan bersamanya. Ini karena tuannya dapat mengubah wasiatnya jika ia mau dan mencabutnya kapan pun ia inginkan, dan kebebasannya belum ditegakkan. Ini seperti seorang pria yang berkata kepada budak perempuannya, \"Jika si anu tetap bersamaku sampai aku mati, dia bebas.\" Jika dia hidup sampai saat itu, dia bebas. Jika dia mau sebelum itu, dia dapat menjualnya dan anaknya, karena anaknya tidak termasuk dalam apa pun yang telah ditetapkan untuknya. {cite:muwatta-maruf-1997 p.371} {cite:muwatta-maruf-1997 p.372}"
