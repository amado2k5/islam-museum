label: { ar: "الموطأ 2356 — مالك: ولد الأمة الموصى بعتقها غير المدبرة لا يعتق معها", en: "Muwatta 2356" }
summary:
  ar: "قال مالك: وكل ولد ولدته أمة أوصي بعتقها ولم تدبر، فإن ولدها لا يعتقون معها إذا عتقت؛ لأن سيدها يغير وصيته إن شاء ويردها متى شاء، ولم تثبت لها عتاقة. وإنما هي بمنزلة رجل قال لجاريته: إن بقيت عندي فلانة حتى أموت فهي حرة. فإن أدركت ذلك كان لها، وإن شاء قبل ذلك باعها وولدها، لأنه لم يدخل ولدها في شيء مما جعل لها. {cite:muwatta-maruf-1997 p.371} {cite:muwatta-maruf-1997 p.372}"
