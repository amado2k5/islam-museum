text: "كتَابٌ السُنَةُ للجَلال ثلاثٌ من كُنَّ فيه وجدَ بهنَّ حلاوةَ الإيمان: أن يكون اللّٰه ورسوله أَحَبَّ إليه مما سواهما، وأن يُحِبَّ المرءَ لا يُحِبُّه إلَّا لله، وأن يكره أن يعودَ في الكفرِ بعدَ أن أنقَذَه اللّٰه منه، كما يكره أن …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 621، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 621, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 621 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
