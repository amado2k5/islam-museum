text: |-
  ٢٩٢
  •أعرن)•
  قال النابغة فاريك عامر قد قال جهلا * فأن مظاقة الجهل الشباب
  ويروى السماب ويروى مطية والدين الظنون الذى لا يدرى أيقضيه آخذه أم لا والفنون
  الرجال السيء الظنّ والظنون البثرلا يدرى أفيهاما. أم لا ويقال القليلة المباء قال الاعشى
  ما جعل الحد الناشون الذى • جنب صوب اللجب الماطر
  مشل الفراتى اذاماطما • يقذف بالبومى والماهر
  صل المسين بى) نسرعين مشدد النون أى عنليم وكذلك الجمل الضضم وعبنى
  منلد ملحق بفعلى ياء اذا وصلته تونت والانثى عبناة والهع عبفيات قال الراجز
  هان على ءزة بنت الشحاج • مهوى بجال مالك فى الادلاج
  بالسيرأرذاه وجيف الجاج * كل عبنىّ بالعلاوى هجهاج * بحيث لامستودع ولاناج
  ( عثن العثان الدخان ويعهماعواثن ودواخن وكذلات العثن ولا يعرف لهما نظير وقد
  عننت النار تعثن بالضم اذادخنت وربماسموا الغبارعشانا وعشنت قوبى بالبخور تعنينا
  والعشون شعيرات طوال تحدت حنك البعير يقال بعيردوعيائين كما قالو المفرق الرأس مفارق
  وعشنون الريح والمطرأولهما أبوزيد العثانين المطر بين السعاب والارض مثل السبل
  واحدها عثنون جن لعجيين معروف وقد عجنت المرأة تعجن عجنا واعتينت أى اتخذت
  عجينا وعجنت الناقة أيضا اذاضربت الارض ببديها فى سيرها وهى عاجن وهجن الرجل
  اذا نهض معتمدا بيديه على الارض من الكبر قال
  فأصبحت كنتيا وأصبت عاجنا • وشرّ خصال المركنت وعاجن
  وعجنت الناقة بالكسر عجنا سمنت فهى عجنة وعجناه وبعير عجن أى مكتنزسمنا والعجان مابين
  الخصية والفقعة والهجن ورم يصيب الناقة بين حياثها ودبرهاور بماقتصلا يقال ناقة عتجفا.
  بيئة العجن والعجان الاحق عن الحليل ⁦(علجن)⁩ العلمين الناقة الشديدة والمرأة الحقاء
  واللام زائدة ( جهن الهجاهن بالضم الضادم والطباخ والجمع العجاهنة بالفخ قال
  وينصين القدور مشمرات • يشاز عن العجاهنة الرئينا
  يريد جمع الرثة والمرأة عجاهنة وقد تعجهن ⁦(عدن)⁩ عدنت البلدتوطنته وعدنت الابل بمكان
  كذ الزمته فلم تبرح ومنه جنات عدن أى جفات اقامة ومنه سمى المعدن بكسر الدال
  لات الناس يقيمون فيه الصيف والشتاء ومركز كل شى معدته والعادن الناقة المقيمة فى المرحى
  وعدن بلد بالمين وعدان البحدر بالفتح ساحله وأماقول لبيد
  ولقديعلم سحبى كاهم * بعدان السبف صبرى ونقل
  ف.قال أرادعدن فزاد فيه الالف للضرورة ويقال هوموضع آخر والعيدان الففل الطوال
  وقدذ كرناه فى الدال وأنتدأبوعبيدة لابن مقبل
  يه ززن للمشى أوص الامنعمة * هز الجنوب ضحى عبدان يبرينا
  وعدنان بن أذأ بو معدوا لهد ينسة رقعة فى أسفل الدلووابهع العدائن يقسال غرب معدن اذا
  قطع أسفله ثم خر زبرقعة وقال * والغرب ذا العدينة الموعدا* والعدانات الفرق من الناس
  ⁦( عرن)⁩ عرنين كل شىء أوّله وعرانين القوم سادتهسم وعرنين الانف تحت مجتمع الحاجبين
