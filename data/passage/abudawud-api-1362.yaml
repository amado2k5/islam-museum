text: "حَدَّثَنَا أَحْمَدُ بْنُ صَالِحٍ، وَمُحَمَّدُ بْنُ سَلَمَةَ الْمُرَادِيُّ، قَالاَ حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي قَيْسٍ، قَالَ قُلْتُ لِعَائِشَةَا : بِكَمْ كَانَ رَسُولُ اللَّهِ يُوتِرُ قَالَتْ : كَانَ يُوتِرُ بِأَرْبَعٍ وَثَلاَثٍ، وَسِتٍّ وَثَلاَثٍ، وَثَمَانٍ وَثَلاَثٍ، وَعَشْرٍ وَثَلاَثٍ، وَلَمْ يَكُنْ يُوتِرُ بِأَنْقَصَ مِنْ سَبْعٍ، وَلاَ بِأَكْثَرَ مِنْ ثَلاَثَ عَشْرَةَ. قَالَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1362، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1362 (Prayer (Kitab Al-Salat): Voluntary Prayers), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1362، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
