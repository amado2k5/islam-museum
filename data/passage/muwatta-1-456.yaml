text: "اللهم صل على محمد وأزواجه وذريته كما صليت على آل إبراهيم، وبارك على محمد وأزواجه وذريته كما باركت على آل إبراهيم، إنك حميد مجيد"
summary:
  ar: "أول حديث في باب ما جاء في الصلاة على النبي. يرويه يحيى عن مالك عن عبد الله بن أبي بكر بن حزم عن أبيه عن عمرو بن سليم الزرقي أن أبا حميد الساعدي أخبره أنهم سألوا النبي كيف يصلون عليه، فعلمهم أن يقولوا: اللهم صل على محمد وأزواجه وذريته كما صليت على آل إبراهيم، وبارك على محمد وأزواجه وذريته كما باركت على آل إبراهيم، إنك حميد مجيد. ويخرّجه المحقق عند البخاري ⁦(3369، 6360)⁩ ومسلم (2/16) وأبي داود (979) وابن ماجه (905) والنسائي (3/49) وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (17/302). {cite:muwatta-maruf-1997 p.233} {cite:muwatta-maruf-1997 p.234}"
  tr: "Peygamberimize yapılan dualarla ilgili rivayetler bölümündeki ilk hadis şöyledir: Yahya, Malik'ten, o da Abdullah ibn Abi Bekr ibn Hazm'dan, o da babasından, o da Amr ibn Salim el-Zuraki'den rivayet ettiğine göre, Ebu Humaid el-Sa'idi ona şöyle bildirmiştir: \"Peygamberimize nasıl dua edileceğini sordular, o da onlara şöyle demeyi öğretti: 'Ey Allah'ım, İbrahim ailesine salât ettiğin gibi Muhammed'e, eşlerine ve soyuna da salât et ve İbrahim ailesine lütfettiğin gibi Muhammed'e, eşlerine ve soyuna da lütfet. Şüphesiz Sen övgüye layık ve yücesin.'\" Editör, bu hadisi Buhari (3369, 6360), Müslim (2/16), Ebu Davud (979), İbn Majah (905), Nesai (3/49), Ahmed ve Şafiî'nin derlemelerine, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla dahil eder ve Temhid'e (17/302) atıfta bulunur. {cite:muwatta-maruf-1997 s.233} {cite:muwatta-maruf-1997 s.234}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang telah diriwayatkan mengenai salat kepada Nabi. Diriwayatkan oleh Yahya dari Malik, dari Abdullah ibn Abi Bakr ibn Hazm, dari ayahnya, dari Amr ibn Salim al-Zuraqi, bahwa Abu Humaid al-Sa'idi memberitahunya bahwa mereka bertanya kepada Nabi bagaimana cara bersalat kepadanya, lalu beliau mengajari mereka untuk mengucapkan: \"Ya Allah, limpahkanlah rahmat kepada Muhammad, istri-istrinya, dan keturunannya sebagaimana Engkau telah melimpahkan rahmat kepada keluarga Ibrahim, dan berikanlah karunia-Mu kepada Muhammad, istri-istrinya, dan keturunannya sebagaimana Engkau telah melimpahkan karunia-Mu kepada keluarga Ibrahim. Sesungguhnya Engkau Maha Terpuji dan Maha Agung.\" Penyunting memasukkannya ke dalam koleksi al-Bukhari (3369, 6360), Muslim (2/16), Abu Dawud (979), Ibn Majah (905), al-Nasa'i (3/49), Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (17/302). {cite:muwatta-maruf-1997 p.233} {cite:muwatta-maruf-1997 p.234}"
