label: { ar: "الموطأ 456 — أبو حميد الساعدي: كيف نصلي عليك؟", en: "Muwatta 456" }
text: "اللهم صل على محمد وأزواجه وذريته كما صليت على آل إبراهيم، وبارك على محمد وأزواجه وذريته كما باركت على آل إبراهيم، إنك حميد مجيد"
summary:
  ar: "أول حديث في باب ما جاء في الصلاة على النبي. يرويه يحيى عن مالك عن عبد الله بن أبي بكر بن حزم عن أبيه عن عمرو بن سليم الزرقي أن أبا حميد الساعدي أخبره أنهم سألوا النبي كيف يصلون عليه، فعلمهم أن يقولوا: اللهم صل على محمد وأزواجه وذريته كما صليت على آل إبراهيم، وبارك على محمد وأزواجه وذريته كما باركت على آل إبراهيم، إنك حميد مجيد. ويخرّجه المحقق عند البخاري (3369، 6360) ومسلم (2/16) وأبي داود (979) وابن ماجه (905) والنسائي (3/49) وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (17/302). {cite:muwatta-maruf-1997 p.233} {cite:muwatta-maruf-1997 p.234}"
