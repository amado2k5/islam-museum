label: { ar: "موطأ مالك 488 — عمل يعدل عملا أعظم منه", en: "Muwatta Malik 488 — a deed that equals a greater one", ur: "موطأ مالک 488 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ حُمَيْدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، أَنَّهُ أَخْبَرَهُ أَنَّ {قُلْ هُوَ اللَّهُ أَحَدٌ} تَعْدِلُ ثُلُثَ الْقُرْآنِ وَأَنَّ {تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ} تُجَادِلُ عَنْ صَاحِبِهَا."
summary:
  ar: "حديث في موطأ مالك، رقم 488، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 488 (The Qur'an), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 488، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
