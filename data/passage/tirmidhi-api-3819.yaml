text: "… حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، قَالَ حَدَّثَنَا أَبُو عَوَانَةَ، قَالَ حَدَّثَنَا عُمَرُ بْنُ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِيهِ، قَالَ أَخْبَرَنِي أُسَامَةُ بْنُ زَيْدٍ، قَالَ كُنْتُ جَالِسًا عِنْدَ النَّبِيِّ إِذْ جَاءَ عَلِيٌّ وَالْعَبَّاسُ يَسْتَأْذِنَانِ فَقَالاَ يَا أُسَامَةُ اسْتَأْذِنْ لَنَا عَلَى رَسُولِ اللَّهِ. فَقُلْتُ يَا رَسُولَ اللَّهِ عَلِيٌّ وَالْعَبَّاسُ يَسْتَأْذِنَانِ. فَقَالَ \" أَتَدْرِي مَا جَاءَ بِهِمَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3819، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3819 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3819، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3819 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
