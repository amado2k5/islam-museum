label: { ar: "الموطأ 2812 — أميمة بنت رقيقة: مبايعة النساء على الإسلام وقوله لمائة امرأة كقوله لواحدة", en: "Muwatta 2812" }
summary:
  ar: "يروي مالك عن محمد بن المنكدر، عن أميمة بنت رقيقة أنها قالت: أتيت رسول الله في نسوة يبايعنه على الإسلام، فاشترطن ألا يشركن بالله شيئا، ولا يسرقن، ولا يزنين، ولا يقتلن أولادهن، ولا يأتين ببهتان يفترينه، ولا يعصينه في معروف. فقال: فيما استطعتن وأطقتن. ثم عرضن أن يبايعنه باليد، فقال إنه لا يصافح النساء، وإن قوله لمائة امرأة كقوله لامرأة واحدة. {cite:muwatta-maruf-1997 p.578}"
