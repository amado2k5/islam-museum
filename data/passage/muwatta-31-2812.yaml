label: { ar: "الموطأ 2812 — أميمة بنت رقيقة: مبايعة النساء على الإسلام وقوله لمائة امرأة كقوله لواحدة", en: "Muwatta 2812", es: "Muwatta 2812", fr: "Muwatta 2812", ur: "موطا 2812", tr: "El-Muvatta 2812 — Umayme bint Ruqayqah: Kadınların İslam'a biat etmesi ve onun yüz kadına söylediği söz, bir kadına söylediği söz gibidir.", id: "Al-Muwatta 2812 — Umaymah bint Ruqayqah: Ikrar kesetiaan wanita kepada Islam, dan perkataannya kepada seratus wanita sama seperti perkataannya kepada satu wanita." }
summary:
  ar: "يروي مالك عن محمد بن المنكدر، عن أميمة بنت رقيقة أنها قالت: أتيت رسول الله في نسوة يبايعنه على الإسلام، فاشترطن ألا يشركن بالله شيئا، ولا يسرقن، ولا يزنين، ولا يقتلن أولادهن، ولا يأتين ببهتان يفترينه، ولا يعصينه في معروف. فقال: فيما استطعتن وأطقتن. ثم عرضن أن يبايعنه باليد، فقال إنه لا يصافح النساء، وإن قوله لمائة امرأة كقوله لامرأة واحدة. {cite:muwatta-maruf-1997 p.578}"
  tr: "Malik, Muhammed ibn el-Munkadir'den, o da Ümeyme bint Rukayka'dan rivayet ettiğine göre, Ümeyme şöyle demiştir: \"Bazı kadınlarla birlikte Allah'ın Resulü'nün yanına geldim. Onlar, Allah'a hiçbir şeyi ortak koşmayacaklarına, hırsızlık yapmayacaklarına, zina etmeyeceklerine, çocuklarını öldürmeyeceklerine, yalan uydurmayacaklarına ve doğru yolda ona isyan etmeyeceklerine dair söz verdiler. Resulullah, 'Gücünüz yettiğince yapın' dedi. Sonra kadınlar el sıkışarak biat etmeyi teklif ettiler, fakat Resulullah, 'Ben kadınlarla el sıkışmam, yüz kadına verdiğim söz bir kadına verdiğim söz gibidir' dedi.\" {cite:muwatta-maruf-1997 s.578}"
  id: "Malik meriwayatkan dari Muhammad ibn al-Munkadir, dari Umaymah bint Ruqayqah, bahwa dia berkata: Aku datang kepada Rasulullah bersama beberapa wanita yang berbaiat kepadanya dalam Islam. Mereka berjanji tidak akan menyekutukan Allah dengan sesuatu pun, tidak akan mencuri, tidak akan berzina, tidak akan membunuh anak-anak mereka, tidak akan membuat kebohongan, dan tidak akan durhaka kepadanya dalam hal yang benar. Beliau bersabda: Sebisa dan semampu kalian. Kemudian mereka menawarkan untuk berbaiat kepadanya dengan berjabat tangan, tetapi beliau bersabda bahwa beliau tidak berjabat tangan dengan wanita, dan bahwa perkataannya kepada seratus wanita sama seperti perkataannya kepada satu wanita. {cite:muwatta-maruf-1997 p.578}"
