label: { ar: "سنن ابن ماجه 3806 — عمل يعدل عملا أعظم منه، الميزان", en: "Sunan Ibn Majah 3806 — a deed that equals a greater one; the Scale", ur: "سنن ابن ماجہ 3806 — ایک عمل جو بڑے عمل کے برابر ہے، میزان", es: "Sunan Ibn Majah 3806 — una acción que equivale a una mayor; la Escala", fr: "Sunan Ibn Majah 3806 — un acte qui en vaut un autre, plus grand encore; l'Échelle", tr: "Sunan İbn Majah 3806 — Daha büyük bir amele denk olan bir amel, terazi", id: "Sunan Ibn Majah 3806 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar, timbangan amal." }
text: "حَدَّثَنَا أَبُو بِشْرٍ، وَعَلِيُّ بْنُ مُحَمَّدٍ، قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ عُمَارَةَ بْنِ الْقَعْقَاعِ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ حَبِيبَتَانِ إِلَى الرَّحْمَنِ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3806، يذكر عمل يعدل عملا أعظم منه، والميزان. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3806 (Etiquette), that speaks of a deed that equals a greater one, the Scale. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3806، جس میں ایک عمل جو بڑے عمل کے برابر ہے، میزان کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3806 (Etiqueta), habla de una acción que equivale a otra mayor: la Balanza. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3806 (Étiquette), évoque un acte qui en vaut un autre, la Balance. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 3806 numaralı hadiste, daha büyük bir ameli sayan bir amelden ve teraziden bahsedilir. Bu hadis, iyi ve kötü amellerin listesini, amelleri sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3806, menyebutkan suatu amal perbuatan yang setara dengan amal perbuatan yang lebih besar, dan timbangan amal perbuatan tersebut. Hadits ini menggabungkan daftar amal perbuatan baik dan buruk dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang amal perbuatan tersebut."
