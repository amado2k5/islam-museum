text: "بعث رسول الله وايقه مكانه رجلا يقال له : عبد الله بن جحش، وكتب له كتابا وأمره ألا يقرأه إلا بمكان كذا وكذا، وقال: (لا تكرهن أحدا من أصحابك على السير معك»، فلما صار فى ذلك الموضع، قرأ الكتاب واسترجع،"
