label: { ar: "صحيح البخاري 880 — ما وجب على كل مسلم، الواجب", en: "Sahih al-Bukhari 880 — a duty laid on every Muslim; the obligatory (wajib)", ur: "صحیح بخاری 880 — جو ہر مسلمان پر لازم ہے، واجب", fr: "Sahih al-Bukhari 880 — un devoir imposé à chaque musulman ; l'obligatoire (wajib)", es: "Sahih al-Bujari 880 — un deber impuesto a cada musulmán; lo obligatorio (wajib)", tr: "Sahih el-Buhari 880 — Her Müslüman için farz olan, farz olan", id: "Sahih al-Bukhari 880 — Apa yang wajib bagi setiap Muslim, yang wajib" }
text: "… أَشْهَدُ عَلَى أَبِي سَعِيدٍ قَالَ أَشْهَدُ عَلَى رَسُولِ اللَّهِ قَالَ \" الْغُسْلُ يَوْمَ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِمٍ، وَأَنْ يَسْتَنَّ وَأَنْ يَمَسَّ طِيبًا إِنْ وَجَدَ \". قَالَ عَمْرٌو أَمَّا الْغُسْلُ فَأَشْهَدُ أَنَّهُ وَاجِبٌ، وَأَمَّا الاِسْتِنَانُ وَالطِّيبُ فَاللَّهُ أَعْلَمُ أَوَاجِبٌ هُوَ أَمْ لاَ، وَلَكِنْ هَكَذَا فِي الْحَدِيثِ. قَالَ أَبُو عَبْدِ اللَّهِ هُوَ أَخُو مُحَمَّدِ بْنِ الْمُنْكَدِرِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 880، يرد فيه ذكر ما وجب على كل مسلم، والواجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 880 (Friday Prayer), whose wording mentions a duty laid on every Muslim, the obligatory (wajib). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 880، جس کے الفاظ میں جو ہر مسلمان پر لازم ہے، واجب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 880, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 880, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'nin 880 numaralı hadisi, her Müslüman için farz olan şeyleri sıralamaktadır. Bu hadis, diğer farz, itaat, tavsiye edilen, mekruh ve haram olan amellerle birlikte, araştırmacı tarafından derlenmiş olup Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin bu konulardaki rivayetlerinden metinler içermektedir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 880, menyebutkan apa yang wajib bagi setiap Muslim. Hadits ini, bersama dengan amalan wajib lainnya, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, dikumpulkan oleh peneliti dan mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini. Peneliti menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
