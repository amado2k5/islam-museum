text: "… بكر بن حزم، فأجاز شهادتي. - شهادة أهل الشِّرك بعضهم على بعض - حدثنا أبو بكر قال: حدثنا وكيع قال: حدثنا سفيان عن عمرو ابن ميمون عن عمر بن عبدالعزيز: أنه أجاز شهادة مجوسي على يهوديّ أو نصرانيّ. في ط …"
