label: { ar: "سنن ابن ماجه 1138 — الأب والأبوة", en: "Sunan Ibn Majah 1138 — the father and fatherhood", ur: "سنن ابن ماجہ 1138 — باپ اور والدیت", es: "Sunan Ibn Majah 1138 — El padre y la paternidad", fr: "Sunan Ibn Majah 1138 — le père et la paternité" }
text: "… بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ، حَدَّثَنَا كَثِيرُ بْنُ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ عَوْفٍ الْمُزَنِيُّ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ: \" فِي يَوْمِ الْجُمُعَةِ سَاعَةٌ مِنَ النَّهَارِ، لاَ يَسْأَلُ اللَّهَ فِيهَا الْعَبْدُ شَيْئًا إِلاَّ أُعْطِيَ سُؤْلَهُ \" قِيلَ: أَىُّ سَاعَةٍ؟ قَالَ \" حِينَ تُقَامُ الصَّلاَةُ إِلَى الاِنْصِرَافِ مِنْهَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1138، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1138 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1138، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1138 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1138 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
