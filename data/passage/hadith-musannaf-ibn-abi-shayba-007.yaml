text: "فقال إبراهيم التيمي(٣): (إلى من تدعوهم؟ إلى الحجاج؟!). ١٣٥- في أمان المرأة والمملوك ٣٣٩٤٣- حدثنا عبدالرحيم بن سليمان عن الحجاج عن الوليد بن أبي مالك عن عبدالرحمن بن سلمة(٤) أن رجلا أمن قوما وهو مع عمرو بن (١) كتبها في"
