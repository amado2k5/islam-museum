label: { ar: "موطأ مالك 1406 — الأب والأبوة", en: "Muwatta Malik 1406 — the father and fatherhood", ur: "موطأ مالک 1406 — باپ اور والدیت", es: "Muwatta Malik 1406 — El padre y la paternidad" }
text: "قَالَ يَحْيَى قَالَ مَالِكٌ عَنْ جَعْفَرِ بْنِ مُحَمَّدٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَضَى بِالْيَمِينِ مَعَ الشَّاهِدِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1406، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1406 (Judgements), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1406، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1406 (Sentencias), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
