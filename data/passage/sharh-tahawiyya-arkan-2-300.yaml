text: "… والقدر خيره وشره، وحلوه ومره من اللّٰه تعالى: ش: تقدم أن هذه الخصال هى أصول الدين، وبها أجاب النى فى حديث جبرائيل المشهور، المتفق على صحته، حين جاء إلى النبى عق على صورة رجل أعرابى وسأله عن الإسلام فقال: أن …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 2، ص 300، يذكر تعريف الإسلام بأعماله، والإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 2, p. 300, that mentions Islam defined by its acts, belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 2، ص 300 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 2, pág. 300, que menciona el Islam definido por sus actos y la creencia en el decreto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 2, p. 300), mentionnant que l'islam se définit par ses actes et la croyance au décret. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in, Tahavi'nin İman Bildirgesi'nin 2. cildinin 300. sayfasında yer alan, İslam'ın amelleri ve kader inancı üzerinden tanımlanmasını ele alan açıklamasından bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari penjelasan Ibn Abi al-Izz tentang Akidah al-Tahawi, Jilid 2, halaman 300, yang membahas definisi Islam melalui tindakan dan keyakinannya pada takdir; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
