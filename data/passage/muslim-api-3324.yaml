label: { ar: "صحيح مسلم 3324 — الحرام، ما حُرّم", en: "Sahih Muslim 3324 — the unlawful; what was made unlawful", ur: "صحیح مسلم 3324 — حرام، جو حرام کیا گیا" }
text: "حَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا عَاصِمٌ الأَحْوَلُ، قَالَ سَأَلْتُ أَنَسًا أَحَرَّمَ رَسُولُ اللَّهِ الْمَدِينَةَ قَالَ نَعَمْ هِيَ حَرَامٌ لاَ يُخْتَلَى خَلاَهَا فَمَنْ فَعَلَ ذَلِكَ فَعَلَيْهِ لَعْنَةُ اللَّهِ وَالْمَلاَئِكَةِ وَالنَّاسِ أَجْمَعِينَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3324، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3324 (The Book of Pilgrimage), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3324، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
