label: { ar: "صحيح البخاري 4939 — كتاب الأعمال والملائكة الكاتبون، الحساب", en: "Sahih al-Bukhari 4939 — the record of deeds and the recording angels; the reckoning", ur: "صحیح بخاری 4939 — نامۂ اعمال اور لکھنے والے فرشتے، حساب", es: "Sahih al-Bukhari 4939 — El registro de los hechos y los ángeles que registran; el cálculo", fr: "Sahih al-Bukhari 4939 — le livre des actes et les anges enregistreurs; le jugement", tr: "Sahih el-Buhari 4939 — Amellerin Kitabı ve Hesap Melekleri, Hesaplama", id: "Sahih al-Bukhari 4939 — Kitab Amal dan Malaikat Pencatat, Perhitungan" }
text: "… أَبِي صَغِيرَةَ عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنِ الْقَاسِمِ، عَنْ عَائِشَةَا ـ قَالَتْ قَالَ رَسُولُ اللَّهِ \" لَيْسَ أَحَدٌ يُحَاسَبُ إِلاَّ هَلَكَ \". قَالَتْ قُلْتُ يَا رَسُولَ اللَّهِ جَعَلَنِي اللَّهُ فِدَاءَكَ، أَلَيْسَ يَقُولُ اللَّهُ عَزَّ وَجَلَّ {فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ * فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا}. قَالَ \" ذَاكَ الْعَرْضُ يُعْرَضُونَ، وَمَنْ نُوقِشَ الْحِسَابَ هَلَكَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4939، يذكر كتاب الأعمال والملائكة الكاتبون، والحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 4939 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that speaks of the record of deeds and the recording angels, the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 4939، جس میں نامۂ اعمال اور لکھنے والے فرشتے، حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4939 (Comentario Profético del Corán (Tafsir del Profeta (pbuh))), habla del registro de las acciones y de los ángeles que las registran, es decir, del cálculo. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 4939 (Commentaire prophétique du Coran (Tafsir du Prophète)), évoque le registre des actes et les anges chargés de cet enregistrement, ainsi que le décompte des comptes. Le Livre des Hasanat et des Sayyi'at le mentionne parmi les textes relatifs au comptage, à l'inscription, à l'effacement ou à la pesée d'un acte."
  tr: "Sahih el-Buhari'de 4939 numaralı hadis, Amel Kitabı'ndan, kayıt tutan meleklerden ve hesaptan bahseder. Bu kitap, iyi ve kötü amellerin listesini, amelleri kaydeden, yazan, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4939, menyebutkan Kitab Amal, para malaikat pencatat, dan perhitungan amal. Kitab ini menggabungkan daftar amal baik dan buruk dengan teks-teks yang mencatat, menuliskan, menghapus, atau menimbang amal tersebut."
