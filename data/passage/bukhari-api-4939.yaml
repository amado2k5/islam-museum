label: { ar: "صحيح البخاري 4939 — كتاب الأعمال والملائكة الكاتبون، الحساب", en: "Sahih al-Bukhari 4939 — the record of deeds and the recording angels; the reckoning", ur: "صحیح بخاری 4939 — نامۂ اعمال اور لکھنے والے فرشتے، حساب" }
text: "… أَبِي صَغِيرَةَ عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنِ الْقَاسِمِ، عَنْ عَائِشَةَا ـ قَالَتْ قَالَ رَسُولُ اللَّهِ \" لَيْسَ أَحَدٌ يُحَاسَبُ إِلاَّ هَلَكَ \". قَالَتْ قُلْتُ يَا رَسُولَ اللَّهِ جَعَلَنِي اللَّهُ فِدَاءَكَ، أَلَيْسَ يَقُولُ اللَّهُ عَزَّ وَجَلَّ {فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ * فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا}. قَالَ \" ذَاكَ الْعَرْضُ يُعْرَضُونَ، وَمَنْ نُوقِشَ الْحِسَابَ هَلَكَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4939، يذكر كتاب الأعمال والملائكة الكاتبون، والحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 4939 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that speaks of the record of deeds and the recording angels, the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 4939، جس میں نامۂ اعمال اور لکھنے والے فرشتے، حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
