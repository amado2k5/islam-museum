text: "قال أبو هريرة: قال رسول الله: لكل نبي دعوة دعا بها في أمته فاستجيب له، وإني أريد إن شاء الله أن أؤخر دعوتي شفاعة لأمتي يوم القيامة"
summary:
  ar: "رواية أبي هريرة في باب دعاء النبي لأمته واستبكاره من ذلك من كتاب الإيمان في صحيح مسلم؛ لكل نبي دعوة مستجابة، ودعوة محمد ادُّخرت شفاعةً لأمته يوم القيامة."
