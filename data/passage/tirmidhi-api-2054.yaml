text: "… قَالَتْ مَا كَانَ يَكُونُ بِرَسُولِ اللَّهِ قُرْحَةٌ وَلاَ نَكْبَةٌ إِلاَّ أَمَرَنِي رَسُولُ اللَّهِ أَنْ أَضَعَ عَلَيْهَا الْحِنَّاءَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ إِنَّمَا نَعْرِفُهُ مِنْ حَدِيثِ فَائِدٍ. وَرَوَى بَعْضُهُمْ هَذَا الْحَدِيثَ عَنْ فَائِدٍ فَقَالَ عَنْ عُبَيْدِ اللَّهِ بْنِ عَلِيٍّ عَنْ جَدَّتِهِ سَلْمَى وَعُبَيْدُ اللَّهِ بْنُ عَلِيٍّ أَصَحُّ وَيُقَالُ سُلْمَى. حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2054، يذكر الحناء دواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2054 (Chapters on Medicine), that mentions henna as a remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2054، جس میں مہندی بطور دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
