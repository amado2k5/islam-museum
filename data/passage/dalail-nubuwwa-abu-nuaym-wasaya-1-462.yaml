text: "الفصل الرابع والعشرون ح وهو ببقيع الغَرْقَد، فدخل خُربة لحاجته، فبينما هو جالس إذ أخرجَ جُرذٌ من جحره ديناراً، فلم يزل يُخرج ديناراً ديناراً حتى بلغ سبعة عشر ديناراً، فخرج بها حتى جاء بها النبي في فأخبره خبرها فقال: هل …"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، المجلد المصوَّر 1، ص 462، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, scan volume 1, p. 462, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "دلائل النبوۃ، ابو نعیم، اسکین جلد 1، ص 462 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
