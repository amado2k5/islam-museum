  fr: "Extrait du Dala'il al-Nubuwwa d'Abu Nu'aym (tome 1, p. 462) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "Ebu Nuaym'ın \"Dala'il al-Nubuwwah\" (Peygamberliğin Delilleri) adlı eserinin Resimli Cilt 1, sayfa 462'deki bir alıntısında bir defin, bir mezar ve bir türbeden bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Dala'il al-Nubuwwah\" (Bukti Kenabian) karya Abu Nu'aym, Jilid 1 Bergambar, hlm. 462, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
