text: "… خروجك من بيتك تؤم البيت الحرام قال فإنّ لك بكل مؤطأة تطأها راحلتك أن تُكتب لك حسنة وتُمْحَى عنك سيئة ، وإذا وقفتَ بعرفاتٍ فإن اللّٰه ينزل إلى السماء الدنيا فيقول للملائكة : هؤلاء عبادي جاءوني شعثاً غبراً من كل …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 2850، يذكر كتابة الحسنات، وكتابة السيئات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 2850, that speaks of the writing of good deeds, the writing of bad deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 2850 کا اقتباس جس میں نیکیوں کا لکھا جانا، برائیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 2850, que habla de la escritura de buenas obras y de malas obras; del texto extraído, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, p. 2850, qui parle de l'écriture des bonnes actions, de l'écriture des mauvaises actions; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 2850. sayfasından, iyi amellerin ve kötü amellerin yazılmasından bahseden bir pasaj; alıntılanan versiyondan ve kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian,” hlm. 2850, yang menyebutkan tentang pencatatan amal baik dan pencatatan amal buruk; dari versi yang diekstrak, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
