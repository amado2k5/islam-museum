text: "… خروجك من بيتك تؤم البيت الحرام قال فإنّ لك بكل مؤطأة تطأها راحلتك أن تُكتب لك حسنة وتُمْحَى عنك سيئة ، وإذا وقفتَ بعرفاتٍ فإن اللّٰه ينزل إلى السماء الدنيا فيقول للملائكة : هؤلاء عبادي جاءوني شعثاً غبراً من كل …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 2850، يذكر كتابة الحسنات، وكتابة السيئات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 2850, that speaks of the writing of good deeds, the writing of bad deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 2850 کا اقتباس جس میں نیکیوں کا لکھا جانا، برائیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
