summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن النبي خطب الناس في بعض مغازيه، قال ابن عمر: فأقبلت نحوه فانصرف قبل أن أبلغه، فسألت ماذا قال؟ فقيل لي: نهى أن يُنبذ في الدباء والمزفت. ويذكر المحقق أن ابن عمر ومالكا كانا يريان أن النهي عن الانتباذ في الدباء والمزفت غير منسوخ. {cite:muwatta-maruf-1997 p.410} {cite:muwatta-maruf-1997 p.411}"
