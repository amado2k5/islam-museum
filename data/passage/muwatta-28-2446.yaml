label: { ar: "الموطأ 2446 — نافع عن ابن عمر: النبي نهى أن ينبذ في الدباء والمزفت", en: "Muwatta 2446", es: "Muwatta 2446", fr: "Muwatta 2446", ur: "موطا 2446", tr: "El-Muvatta 2446 — İbn Ömer'den rivayet edildiğine göre Nafi': Peygamber, kabaklarda ve katranlı kaplarda mayalanmış içecekleri yasaklamıştır.", id: "Al-Muwatta 2446 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Nabi melarang fermentasi minuman dalam labu dan wadah yang dilapisi ter." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن النبي خطب الناس في بعض مغازيه، قال ابن عمر: فأقبلت نحوه فانصرف قبل أن أبلغه، فسألت ماذا قال؟ فقيل لي: نهى أن يُنبذ في الدباء والمزفت. ويذكر المحقق أن ابن عمر ومالكا كانا يريان أن النهي عن الانتباذ في الدباء والمزفت غير منسوخ. {cite:muwatta-maruf-1997 p.410} {cite:muwatta-maruf-1997 p.411}"
  tr: "Malik, Abdullah ibn Umar'dan rivayetle Nafi'den naklederek, Peygamber'in askeri seferlerinden birinde halka hitap ettiğini anlatır. İbn Umar şöyle dedi: \"Ona yaklaştım, ama ben ona ulaşmadan önce geri döndü. Ne dediğini sordum ve bana şöyle denildi: 'Kabak ve katranlı kaplarda fermente içkilerin hazırlanmasını yasakladı.'\" Araştırmacı, İbn Umar ve Malik'in, kabak ve katranlı kaplarda fermente içkilerin hazırlanmasının yasaklanmasının yürürlükten kaldırılmadığı görüşünü savunduklarını belirtiyor. {cite:muwatta-maruf-1997 s.410} {cite:muwatta-maruf-1997 s.411}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa Nabi berpidato kepada orang-orang selama salah satu kampanye militernya. Ibn Umar berkata: “Aku mendekatinya, tetapi beliau berpaling sebelum aku sampai kepadanya. Aku bertanya apa yang beliau katakan, dan aku diberitahu: ‘Beliau melarang pembuatan minuman fermentasi dalam labu dan wadah yang dilapisi ter.’” Peneliti mencatat bahwa Ibn Umar dan Malik berpendapat bahwa larangan pembuatan minuman fermentasi dalam labu dan wadah yang dilapisi ter tidak dibatalkan. {cite:muwatta-maruf-1997 p.410} {cite:muwatta-maruf-1997 p.411}"
