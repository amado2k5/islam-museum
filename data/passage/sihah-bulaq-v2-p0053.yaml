text: |-
  ٥٣٤
  • ⁦(ق ص )⁩ .
  كسرت القاف قصرت واذا فتحت مددت وتقول تقرّيت المياه أى تتبعتها وقريت
  الماء فى الحوض أى جعت واسم ذلك الماء قرى بكسر القاف مقصور وكذلك ماقرى به
  الضيف وقرى على فعلى بالضم اسم ماء بالبادية والبعير يقرى العلف فى شدقه أى يجمعه
  وناقة قرواء طويلة السنام ويقال الشديدة الظهر بينة القرى ولا يقال ج-ل أقرى
  والقرورى موضع على طريق الكوفة وهو متعشى بين النرة والجاجر وقال
  بيز قرورى ومر ورياتها* وهو فعوع-ل عن سيبويه والة-يروان القافلة فارسى معرب
  وفى حديث مجاهديغد والشيطان بقيروانه الى السوق وجعلها امر والقيس للجيش فقال
  وغارة ذات قيروان • كأن أسرابها الرعال
  (⁦(لسا)⁩ قساقلبه قسوة وقساوة وقساء بالفتح والمتوهو غلظ القلب وشدته وأقساه الذنب
  ويقال الذتب مقساة لتقلب وجر قاس صلب وقاساه أى كابده وقسااسم موضع قال رجل
  من خ ضية
  لنا ابل لم تدرما الذعريتهَا . بتعشار مر عاها قسا فصراعه
  ودرهم قسى وهوضرب من الزيوف أى فضة صلبة رديتة ليست بلينة وجمعه قسبان مثل
  صبىّ وصبيان ودراهم قسية وقسيات قال أبوزبيد ،
  لهامواهل فى صم" السلام كما * ماح القسبات فى أيدى الصياريف
  وقد قست الدراهم تقسو ويقال أيضايوم قىّ أى شديد من -رأوشر" وليلة قسبة باردة
  وقسىّ أيضالقب ثقيف قال أبو عبيد لانهم وعلى أبى رعال وكان مصدّقافقتله فقيل قساقلبه
  فسمى قسياقال شاعرهم *نحن قسى" وقسا أبونا* ( شا قشوت الشىّ أقشوه قشوا
  أى قشرته والمقشوّ المقشور عن الفراءيقال قشوت وجهه وفى حديث قيلة ومعه عسيب تخلة
  مقشوغير خوصين من أعلاه وقشوته تقشية فهومقشىّ أى مقشر ⁦(قصا )⁩. قضا
  المكان يقصو قصوًا بعد فه وقصى وأرض قاصبة وقصية وقصوت عن القوم ساعدت والقصا
  البعد والناحبة بقال قصى فلان عن جوارنا بالكسريهى قصاوأقصيته أنافه ومقصى
  ولا تقل مقصى قال بشر
  فاطونا القصا ولقدرأونا • قريباحيت يستمع السرار.
  قال الاصمعى" معنى حاطونا القصا أى تباعدواعنا وهم -ولنا وما كنا بالنعد منهم
  لو أرادوا أن يدنوا منا ويمال ذهبت قصافلإن أى ناحيته وكنت منه فى قاصيته أى ناحيته
  ويقال هلم أقاصك أينا أبعد من الشرّ وقصوت البعير فهو مقصو اذا قطعت من طرف أذنه
  وكذلك الشاة عن أب زيد يقال شاة قصواء وناقة قصواء ولا يقال جمل أقصى وانمايقال
  مقصوّ ومة صىّ تركوافيه القياس ولان أفعل الذى أنشاه على فعلاء انا يكون من باب ذعل
  يفعل وهذا إما يقال فيه قصوت البعبر وقصواء بائفة عن بابه ومثله امر أة حسناء ولا يقال
  رجل أحسن وكان لرسول اللّٰه صلى اللّٰه عليه وسلم فاقة تسمى قصواء ولم تكن مقطوعسة الاذن
  والقصية من الابل المودعة الكريمة التى لا تجهد فى الحلب ولا تزكب وهى متدعة واذاحدت
  ابل الرجل قيل فيهاقصايايثق به ا أى فيها بقسة اذا اشتد الدهر وحكى الفراء عن القنانية
  قصيت
