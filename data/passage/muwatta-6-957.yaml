label: { ar: "الموطأ 957 — يحيى بن سعيد: عمر بن عبد العزيز غدا يوم عرفة من منى فسمع التكبير عالياً، فبعث الحرس يصيحون في الناس: أيها الناس، إنها التلبية", en: "Muwatta 957", es: "Muwatta 957", fr: "Muwatta 957", ur: "موطا 957", tr: "El-Muvatta 957 — Yahya ibn Said: Ömer ibn Abdülaziz, Arafat Günü Mina'ya gitti ve yüksek sesle tekbir duydu. Bunun üzerine muhafızlarını göndererek halka şöyle bağırmalarını istedi: Ey insanlar, bu Talbiye'dir!", id: "Al-Muwatta 957 — Yahya ibn Saeed: Umar ibn Abd al-Aziz pergi ke Mina pada Hari Arafah dan mendengar Takbir dengan keras, lalu ia mengirim para penjaga untuk berteriak kepada orang-orang: Wahai manusia, itu adalah Talbiyah" }
text: "أيها الناس، إنها التلبية"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أن عمر بن عبد العزيز غدا يوم عرفة من منى، فسمع التكبير عالياً، فبعث الحرس يصيحون في الناس: أيها الناس، إنها التلبية. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1095) وسويد (504). {cite:muwatta-maruf-1997 p.456}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ettiğine göre, Ömer ibn Abdülaziz Arafat günü Mina'dan çıktı ve tekbirin yüksek sesle okunduğunu duydu. Bunun üzerine muhafızlarını göndererek halka şöyle bağırmalarını istedi: \"Ey insanlar, bu Talbiyedir!\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1095) ve Suveyd (504) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.456}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Umar ibn Abd al-Aziz keluar dari Mina pada Hari Arafah dan mendengar Takbir dibaca dengan lantang. Kemudian ia mengirim pengawalnya untuk berteriak kepada orang-orang: \"Wahai manusia, inilah Talbiyah!\" Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1095) dan Suwaid (504). {cite:muwatta-maruf-1997 p.456}"
