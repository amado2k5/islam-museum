text: "… عَوْنٍ وَالْمِنْصَفُ الْخَادِمُ - فَقَالَ بِثِيَابِي مِنْ خَلْفِي - وَصَفَ أَنَّهُ رَفَعَهُ مِنْ خَلْفِهِ بِيَدِهِ - فَرَقِيتُ حَتَّى كُنْتُ فِي أَعْلَى الْعَمُودِ فَأَخَذْتُ بِالْعُرْوَةِ فَقِيلَ لِيَ اسْتَمْسِكْ. فَلَقَدِ اسْتَيْقَظْتُ وَإِنَّهَا لَفِي يَدِي فَقَصَصْتُهَا عَلَى النَّبِيِّ فَقَالَ \" تِلْكَ الرَّوْضَةُ الإِسْلاَمُ وَذَلِكَ الْعَمُودُ عَمُودُ الإِسْلاَمِ وَتِلْكَ الْعُرْوَةُ عُرْوَةُ الْوُثْقَى وَأَنْتَ عَلَى الإِسْلاَمِ حَتَّى تَمُوتَ \". قَالَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6381، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 6381 (The Book of the Merits of the Companions), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 6381، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
