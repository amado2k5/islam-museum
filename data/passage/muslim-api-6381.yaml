label: { ar: "صحيح مسلم 6381 — الرقية", en: "Sahih Muslim 6381 — ruqya recited over the sick", ur: "صحیح مسلم 6381 — رقیہ", es: "Sahih Muslim 6381 — ruqya recitada sobre el enfermo", fr: "Sahih Muslim 6381 — Ruqya récitée sur les malades", tr: "Sahih Muslim 6381 — Rukye", id: "Sahih Muslim 6381 — Ruqyah" }
text: "… عَوْنٍ وَالْمِنْصَفُ الْخَادِمُ - فَقَالَ بِثِيَابِي مِنْ خَلْفِي - وَصَفَ أَنَّهُ رَفَعَهُ مِنْ خَلْفِهِ بِيَدِهِ - فَرَقِيتُ حَتَّى كُنْتُ فِي أَعْلَى الْعَمُودِ فَأَخَذْتُ بِالْعُرْوَةِ فَقِيلَ لِيَ اسْتَمْسِكْ. فَلَقَدِ اسْتَيْقَظْتُ وَإِنَّهَا لَفِي يَدِي فَقَصَصْتُهَا عَلَى النَّبِيِّ فَقَالَ \" تِلْكَ الرَّوْضَةُ الإِسْلاَمُ وَذَلِكَ الْعَمُودُ عَمُودُ الإِسْلاَمِ وَتِلْكَ الْعُرْوَةُ عُرْوَةُ الْوُثْقَى وَأَنْتَ عَلَى الإِسْلاَمِ حَتَّى تَمُوتَ \". قَالَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6381، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 6381 (The Book of the Merits of the Companions), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 6381، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 6381 (El Libro de los Méritos de los Compañeros), menciona la ruqya recitada sobre los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 6381 (Livre des mérites des Compagnons), mentionne la récitation de la roqya sur les malades. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 6381 numaralı hadis, rukyeden (Kur'an ayetleri ve dualarla yapılan İslami şifa) bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6381, menyebutkan ruqyah (penyembuhan Islami melalui ayat-ayat Al-Quran dan doa). Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
