text: "… يا ابن أخي مهرت أكثر منِّي علم أعيان مدينة آقَ شَهْرُ بفضل الشيخ وكماله، فأقاموه معلم مدرسةِ لأولادهم، حتى يكتسبوا من معارفه، وأرسلوا أولادهم إليه. وفي ذات يوم عاد ابن أحد الأشراف إلى بيته، فأختبره والده بالدروس التي يتلقَّاها، فأجاب …"
summary:
  ar: "عيّن وجهاء آق شهر جحا معلماً، فأجاب ابن أحد الوجهاء جيداً فأرسل والده حلوى بقلاوة هدية، فقال جحا للتلاميذ ألا يأكلوها لأنها قد تكون مسمومة، فأكلها ابن أخيه المشرف مع الأطفال ثم كسر مقلمة جحا وادعى أنه حاول الانتحار، فقال جحا إن ابن أخيه تعلم أسرع منه. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  en: "Akshehir notables appoint Juha teacher; a notable's son answers well and his father sends a baklava as a gift; Juha tells the pupils not to eat it as it might be poisoned; the nephew, a monitor, eats it with the children and then breaks Juha's pen-knife and claims he tried to kill himself; Juha says the nephew has learned faster than him. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  ur: "آق شہر کے معززین نے جحا کو معلم مقرر کیا، ایک معزز کے بیٹے نے اچھا جواب دیا تو اس کے باپ نے تحفے میں بقلاوہ بھیجا، جحا نے شاگردوں سے کہا کہ اسے نہ کھائیں کیونکہ ہو سکتا ہے اس میں زہر ہو، جحا کا بھتیجا جو نگران تھا اسے بچوں کے ساتھ کھا گیا، پھر جحا کا قلم تراش توڑ دیا اور دعویٰ کیا کہ اس نے خودکشی کی کوشش کی تھی، تو جحا نے کہا کہ بھتیجے نے اس سے زیادہ تیزی سے سیکھ لیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  fr: "Les notables d'Akshehir nomment Juha instituteur ; le fils de l'un d'eux répond bien et son père envoie en cadeau un baklava ; Juha dit aux élèves de ne pas le manger, car il pourrait être empoisonné ; son neveu, qui est moniteur, le mange avec les enfants, puis brise le canif de Juha et prétend avoir voulu se tuer ; Juha dit que le neveu a appris plus vite que lui. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
  es: "Los notables de Akshehir nombran maestro a Juha; el hijo de uno de ellos responde bien y su padre envía un baklava de regalo; Juha dice a los alumnos que no lo coman porque podría estar envenenado; su sobrino, que es monitor, lo come con los niños y luego rompe la navaja de Juha y afirma que intentó suicidarse; Juha dice que el sobrino ha aprendido más rápido que él. {cite:juha-nawadir-kubra-djuwaydi p. 167}"
