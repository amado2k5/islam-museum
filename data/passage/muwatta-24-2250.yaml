label: { ar: "الموطأ 2250 — مالك: الأمر عندنا أنه لا تجوز عتاقة رجل وعليه دين يحيط بماله، ولا تجوز عتاقة الغلام حتى يحتلم أو يبلغ مبلغ المحتلم، ولا تجوز عتاقة المولى عليه في ماله حتى يلي ماله", en: "Muwatta 2250", es: "2250 Muwatta", fr: "2250 Muwatta", ur: "2250 موطا", tr: "El-Muvatta 2250 — Malik: Bizim aramızdaki yerleşik uygulama şudur: Bir adamın borcu mal varlığını aşarsa azad edilemez; bir oğlan çocuğu ergenlik çağına veya reşitlik yaşına ulaşana kadar azad edilemez; vesayet altındaki bir kişi de kendi mal varlığını yönetene kadar azad edilemez.", id: "Al-Muwatta 2250 — Malik: Kebiasaan yang berlaku di antara kita adalah bahwa seseorang tidak dapat dibebaskan jika ia memiliki hutang yang melebihi kekayaannya, demikian pula seorang anak laki-laki tidak dapat dibebaskan sampai ia mencapai usia pubertas atau usia dewasa, dan seseorang yang berada di bawah perwalian tidak dapat dibebaskan sampai ia mengelola kekayaannya sendiri." }
summary:
  ar: "قال مالك: الأمر عندنا أنه لا تجوز عتاقة رجل، وعليه دين يحيط بماله، ولا تجوز عتاقة الغلام حتى يحتلم، أو يبلغ مبلغ المحتلم، ولا تجوز عتاقة المولى عليه في ماله، وإن بلغ الحلم، حتى يلي ماله. {cite:muwatta-maruf-1997 p.328}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur ki, bir adamın borcu mal varlığını aşarsa özgür bırakılamaz; bir oğlan çocuğu ergenliğe veya reşitlik çağına ulaşana kadar özgür bırakılamaz; vesayet altındaki bir kişi de kendi mal varlığını yönetene kadar özgür bırakılamaz. {cite:muwatta-maruf-1997 s.328}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah bahwa seseorang tidak dapat dibebaskan jika ia memiliki hutang yang melebihi kekayaannya, demikian pula seorang anak laki-laki tidak dapat dibebaskan sampai ia mencapai pubertas atau usia dewasa, dan seseorang yang berada di bawah perwalian tidak dapat dibebaskan sampai ia mengelola kekayaannya sendiri. {cite:muwatta-maruf-1997 p.328}"
