text: "باب حرف الضاد - ضماد الأزدي : من أزد شنوءة، كان هذا الموضع بتمامه. صديقًا للنَّبيِّ وَاليم في الجاهلية، وكان رجلاً يتطبّب وروى مسلمة بن علقمة، عن دَاوُدَ بن أبي هند، ويَرقي، ويطلب العلم، أسلم في أَوَّل الإسلام. عن سعيدٍ …"
