label: { ar: "جامع الترمذي 1321 — ما كرهه الفقهاء، الرخصة", en: "Jami' al-Tirmidhi 1321 — what the jurists disliked; the concession (rukhsa)", ur: "جامع ترمذی 1321 — جسے فقہاء نے مکروہ کہا، رخصت", fr: "Jami' al-Tirmidhi 1321 — ce que les juristes ont réprouvé ; la dispense (rukhsa)", es: "Yami' al-Tirmidhi 1321 — lo que los juristas reprobaron; la dispensa (rukhsa)" }
text: "… يَبْتَاعُ فِي الْمَسْجِدِ فَقُولُوا لاَ أَرْبَحَ اللَّهُ تِجَارَتَكَ وَإِذَا رَأَيْتُمْ مَنْ يَنْشُدُ فِيهِ ضَالَّةً فَقُولُوا لاَ رَدَّ اللَّهُ عَلَيْكَ \". قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ غَرِيبٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ الْعِلْمِ كَرِهُوا الْبَيْعَ وَالشِّرَاءَ فِي الْمَسْجِدِ. وَهُوَ قَوْلُ أَحْمَدَ وَإِسْحَاقَ. وَقَدْ رَخَّصَ بَعْضُ أَهْلِ الْعِلْمِ فِي الْبَيْعِ وَالشِّرَاءِ فِي الْمَسْجِدِ"
summary:
  ar: "حديث في جامع الترمذي، رقم 1321، يرد فيه ذكر ما كرهه الفقهاء، والرخصة، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 1321 (The Book on Business), whose wording mentions what the jurists disliked, the concession (rukhsa), what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 1321، جس کے الفاظ میں جسے فقہاء نے مکروہ کہا، رخصت، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1321, dont le texte mentionne ce que les juristes ont réprouvé, la dispense (rukhsa), ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 1321, cuyo texto menciona lo que los juristas reprobaron, la dispensa (rukhsa), lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
