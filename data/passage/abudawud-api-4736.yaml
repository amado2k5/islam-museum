text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ عُمَرَ، أَخْبَرَنَا إِبْرَاهِيمُ بْنُ مُوسَى، أَخْبَرَنَا ابْنُ أَبِي زَائِدَةَ، عَنْ مُجَالِدٍ، عَنْ عَامِرٍ، - يَعْنِي الشَّعْبِيَّ - عَنْ عَامِرِ بْنِ شَهْرٍ، قَالَ : كُنْتُ عِنْدَ النَّجَاشِيِّ فَقَرَأَ ابْنٌ لَهُ آيَةً مِنَ الإِنْجِيلِ فَضَحِكْتُ فَقَالَ : أَتَضْحَكُ مِنْ كَلاَمِ اللَّهِ"
summary:
  ar: "حديث في سنن أبي داود، رقم 4736، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4736 (Model Behavior of the Prophet (Kitab Al-Sunnah)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 4736، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 4736 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
