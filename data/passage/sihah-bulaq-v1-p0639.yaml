  * ال الشيخ أبونه راسمعيل بن حاد الجوهرى رحه اللّه
  الحدللّه شكراعلى نواله والصلاة على محمد وآله ⁦(أمابعد)⁩ فانى قد أودعت هذا الكتاب
  ماممح عندى من ه_ذه اللغة التى شرّف اللّٰه تعالى منزاتها وجعل علم الدين والدنيا منوطا
  بعرفتها على ترتيب لم أسبق اليه وتهذيب لم أغلب عليه فى غمانية وعشرين بابا وكل باب
  منهاثمانية وعشرون فصلا على عدد حروف المعجم وترتيبها الا أن يهمل من الابواب جنمر
  ٢ قال ابن برى فى حائسية
  من الفصول بعد تحصيلها بالعراق رواية واتقانم ادراية ومشافهى بها العرب العاربة
  عند أهل اللغ
  فى ديارهم بالبادية ولم آل فى ذلك نصحا ولا اتخرت وسما نفعنا اللّٰه واياكم به
  ب ب الالف الهموزة من كتاب الصحاح فى الغ
  ان السر
  شرذمة منهمان
  قال أبونصراسمعيل بن حاد الجوهرى رحه اللّه نذكرفى هذا الباب الهمزة الاصلي
  التى هى لام الفسعل فأما الهمزة المبدلة من الواونحو العزاء الذى أصله عزاو لانه من عزوت
  جدا وعنبا اه من شرح المناوى
  أو المبدلة من الياء نحو الاباء الذى أصلهاباى لانه من أبيت قنذ كرهما فى باب الواو والياء
  ان شاءاللّٰه تبارك وتعالى ونذ كرفيسه أنّ همزة الاشاء والالا غير أصلية ١
  صل الااف ا جأ ع ى فعل بالتحريك أحد جبلى طي والآخرسلى وينسب اليهما
  على القاموس
