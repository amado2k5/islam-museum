text: "… وَجَعِهِ الذِي تُوُفِّي فيهِ فَبَكَيتُ، ثُمَّ سَارَتي فَأَخْبِرَني أَنِّي أَوَّلُ أَهْلِ بَيتِهِ أَتْبعُهُ فَضَحِكْتُ. تقدم في:، الأطراف :،، - حَدَّثَنَا مُحَمَّدُ بْنُ عَرْعَرَةَ حَدَّثَنَا شُعْبَةُ عَنْ أَبِي بِشْرٍ عَنْ سَعِيدِ بْنِ جُبَيْرٍ عَنِ ابْنِ عَبَّاسٍ قَالَ: كَانَ عُمَرُ بْنُ الْخَطَّابِ …"
