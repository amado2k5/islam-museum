text: "… مؤمن ولا فاجر إلا وقد كتب اللّٰه تعالى له رزقه من الحلال، فان صير حق يأتيه آتاء اللّٰه تعالى، وان جزع فتناول شيئاً من الحرام نقصه اللّٰه من رزقه الحلال حدثنا محمد بن على بن حبيش ثنا الحسن بن زكريا …"
summary:
