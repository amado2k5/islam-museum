text: "في رواية شبه العمد، وقال: القتل إما عمد وإما خطأ، لأنه ليس في كتاب الله تعالى إلا العمد والخطأ، وجعل شبه العمد في حكم جناية ٧ - ٥ العمد، وروي عنه أنه قال بشبه العمد (١) وبيان كل من أقسام"
