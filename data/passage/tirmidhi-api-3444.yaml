text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ أَبِي زِيَادٍ، حَدَّثَنَا سَيَّارٌ، حَدَّثَنَا جَعْفَرُ بْنُ سُلَيْمَانَ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أُرِيدُ سَفَرًا فَزَوِّدْنِي. قَالَ \" زَوَّدَكَ اللَّهُ التَّقْوَى \". قَالَ زِدْنِي. قَالَ \" وَغَفَرَ ذَنْبَكَ \". قَالَ زِدْنِي بِأَبِي أَنْتَ وَأُمِّي. قَالَ \" وَيَسَّرَ لَكَ الْخَيْرَ حَيْثُمَا كُنْتَ \". …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3444، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3444 (Chapters on Supplication), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3444، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
