text: "… بالمغرب ومن تبعهم من قرى البربر، أمم المغرب، في ولدانهم إلى أن يجاوزوا حد البلوغ إلى الشبيبة. وكذا في الكبير إذا راجع مدارسة القرآن بعد طائفة من عمره. فهم لذلك أقوم على رسم القرآن وحفظه من سواهم. وأما أهل الأندلس …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 2، ص 166، يذكر رسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 2, p. 166, that mentions the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 2، ص 166 کا اقتباس جس میں رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 2, pág. 166, que menciona la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
