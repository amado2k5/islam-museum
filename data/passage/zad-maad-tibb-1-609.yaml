text: "وفصد القيفال : ينفع مِن المِلل العارضة في تَشْفي مِنْ خَمْسَةِ أَدْواءٍ، ذكر منها الجُدَامُ الدم، وينفع من أورام الرئة، وينفع من الشَّوْصَة وذات الجنب وجميع الأمراض الدموية العارضة من أسفل الركبة إلى الوَرِك. وفصد الأكحل: ينفع من الامتلاء العارض …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 609، يذكر المرض والمريض، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والداء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 609, that mentions illness and the sick, named diseases, the organs of the body, surgery, circumcision and splints, the disease and its remedy, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 609 کا اقتباس جس میں بیماری اور بیمار، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، بیماری، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
