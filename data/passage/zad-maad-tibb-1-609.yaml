text: "وفصد القيفال : ينفع مِن المِلل العارضة في تَشْفي مِنْ خَمْسَةِ أَدْواءٍ، ذكر منها الجُدَامُ الدم، وينفع من أورام الرئة، وينفع من الشَّوْصَة وذات الجنب وجميع الأمراض الدموية العارضة من أسفل الركبة إلى الوَرِك. وفصد الأكحل: ينفع من الامتلاء العارض …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 609، يذكر المرض والمريض، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والداء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 609, that mentions illness and the sick, named diseases, the organs of the body, surgery, circumcision and splints, the disease and its remedy, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 609 کا اقتباس جس میں بیماری اور بیمار، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، بیماری، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 609, que menciona la enfermedad y los enfermos, las enfermedades nombradas, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, la enfermedad y su remedio, la curación; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 609, qui mentionne la maladie et les malades, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles, la maladie et son remède, la guérison; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 609. sayfasından bir alıntı; hastalık ve hasta kişi, hastalıkların isimleri, vücut parçaları, ameliyat, sünnet, ateller, hastalık ve iyileşmeden bahsediyor; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 609, yang menyebutkan penyakit dan orang sakit, nama-nama penyakit, bagian tubuh, pembedahan, sunat, bidai, penyakit, dan penyembuhan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
