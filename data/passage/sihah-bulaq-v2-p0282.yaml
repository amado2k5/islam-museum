text: |-
  * ⁦(باب الميم)⁩.
  ⁦(صمم)⁩.
  ٢٠٥
  والصريم الصبح وهوص الاضداد قال بشره تجلى عن صريته الظلام,،والصريم الجدود
  المقطوع قال تعالى فأصبحت كالصريم أى احترقت واسودت والصريمة العزيمة على الشئ
  والصريمة ما انصرم من معظم الرمل يقال أفعى صريمة وصريمة من غضى ومن سلم أى
  بجاعة منه والصريمة الارض المهصود زرعها والصيرم الوجبة يقال فلان بأكل الصيرم
  ⁦( سكم)⁩ قال القرّاظلظلصللكمته ضريته ودفعته والصكمة الصدمة الشديدة والعرب
  تقول صكمته صواكم الدهر والفرس يصكم اذاعضّ على لجامه ومدرأسه ( لم
  رجل أصلم اذا كان مستأصل الاذنين وقد صلت أذنه أصلمها صلا إذا استأصلتها ورجل
  مص-لم الاذنين اذا اقتطعتا من أصولهما ويقال لاظليم مصلم الاذنين كانه مسستأصل الاذنين
  خلقة والصلامة بالكسر الفرقة من الناس والصلامات الجاعات والفرق والصيلم الداهية
  ويسمى السيف صيلا قال يشر بن أبى خازم
  قضبت تيم أن تقتل عامى * يوم النسارفا عتبوا بالصيلم
  والاصطلام الاستصال لخم اصلخم اصلذماما اذا انتصب قائما لخدم
  الصلخدم التديد من الابل والميم زابدة ادم) فرس صلدم بالكسر صلب شديد
  والانتى صلدمة ورأس صلدم وصلادم بالضم صلب وأنشدابن السكيت
  تشهابستن الذنوب الراذم • شدقين فى رأس لها صلادم
  والمع صلادم بالفتح (صلقم، الصلقمة تصادم الانياب ويقال الميم زائدة والصلقم العجوز
  الكبيرة مم صمام القارورة سدادها يقال صممت القادورة أى سددتها وأصممت
  القارورة أى جعلت لهاصماما وحجرأصم صلب مصمت والصماء الداهية وقتنة صماء شديدة
  ورحل أصمّ بين الصمم فيهنّ وكان أهل الجاهلية بسمون رجباشهر اللّٰه الاصمّ قال الخليل
  اغماسمى بذلك لانه كان لا يسمع فيه صوت مستغيت ولاحركة قتال ولا قعقعة سلاح لانه من
  الاشهر الحرم ويقال للداهية صمى صمام مثال قطام وهى الداهية أى زيدى ويقولون صحى
  ابنة الجبل ويقال صمام صمام أى تصاموا فى السكوت وصمه بالعصاأى ضريه بها وصمه
  بحجروصمّ صداه أى هلك قال أبو عبيد وا شتمال الصماء إن تجلل جسدك بثوبك نحو
  لملة الاعراب بأكسيتهم وهو أن يردّ الكساء من قبل يمينه على بده السرى وعائقه الايسر
  تم يردّه ثانية من خلفه على يده المى وعائقه الاين فبغطيهما جيعاود كرآبو عبيد أن الفقهاء
  يقولون هو أن يشتقمل بنوب واحدليس عليه غيره ثم رفعه من أحد جانهمه فضعه على منك.
  نيبدومنه فرجه فاذا قلت اشتمل فلان الصماء كانك قلت اشتمل الشملة التى تعرف بهذا الاسم
  لان الصماء ضرب من الاشتمال والصمّ بالكسراسم من أسماء الاسد والداهية والصمة
  الرجل الشجاع والذكر من الحيات وجعه صمم ومنه سمى دريد بن الصمة وقول بوير
  سعرت عليك الحرب تغلى قدورها • فهلاغداة الصحتين تديعمها
  أراد الصمسة أبادر يدو عمه مالكا وصميم الشى خالصه يقال هو فى صميم قومه وصميم الخر
  وصميم البرد أشده قال خضاف بن ندية
  وان تلك خيلى قد أصيب صميمها • فعمداعلى عين تيحممت مالكا
  صحاح
