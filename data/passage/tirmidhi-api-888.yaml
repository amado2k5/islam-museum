label: { ar: "جامع الترمذي 888 — الأب والأبوة", en: "Jami' al-Tirmidhi 888 — the father and fatherhood", ur: "جامع ترمذی 888 — باپ اور والدیت", es: "Jami' al-Tirmidhi 888 — El padre y la paternidad" }
text: "… وَهُوَ قَوْلُ الشَّافِعِيِّ. قَالَ أَبُو عِيسَى وَرَوَى إِسْرَائِيلُ هَذَا الْحَدِيثَ عَنْ أَبِي إِسْحَقَ عَنْ عَبْدِ اللَّهِ وَخَالِدٍ ابْنَيْ مَالِكٍ عَنْ ابْنِ عُمَرَ وَحَدِيثُ سَعِيدِ بْنِ جُبَيْرٍ عَنْ ابْنِ عُمَرَ هُوَ حَدِيثٌ حَسَنٌ صَحِيحٌ أَيْضًا رَوَاهُ سَلَمَةُ بْنُ كُهَيْلٍ عَنْ سَعِيدِ بْنِ جُبَيْرٍ وَأَمَّا أَبُو إِسْحَقَ فَرَوَاهُ عَنْ عَبْدِ اللَّهِ وَخَالِدٍ ابْنَيْ مَالِكٍ عَنْ ابْنِ عُمَرَ"
summary:
  ar: "حديث في جامع الترمذي، رقم 888، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 888 (The Book on Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 888، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 888 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
