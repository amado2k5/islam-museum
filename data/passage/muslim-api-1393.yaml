label: { ar: "صحيح مسلم 1393 — الأب والأبوة", en: "Sahih Muslim 1393 — the father and fatherhood", ur: "صحیح مسلم 1393 — باپ اور والدیت", es: "Sahih Muslim 1393 — El padre y la paternidad" }
text: "… بْنُ عَبْدِ اللَّهِ بْنِ نُمَيْرٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا بَدْرُ بْنُ عُثْمَانَ، حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي مُوسَى، عَنْ أَبِيهِ، عَنْ رَسُولِ اللَّهِ أَنَّهُ أَتَاهُ سَائِلٌ يَسْأَلُهُ عَنْ مَوَاقِيتِ الصَّلاَةِ فَلَمْ يَرُدَّ عَلَيْهِ شَيْئًا - قَالَ - فَأَقَامَ الْفَجْرَ حِينَ انْشَقَّ الْفَجْرُ وَالنَّاسُ لاَ يَكَادُ يَعْرِفُ بَعْضُهُمْ بَعْضًا ثُمَّ أَمَرَهُ فَأَقَامَ بِالظُّهْرِ حِينَ زَالَتِ الشَّمْسُ وَالْقَائِلُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1393، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1393 (The Book of Mosques and Places of Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1393، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 1393 (El Libro de las Mezquitas y Lugares de Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
