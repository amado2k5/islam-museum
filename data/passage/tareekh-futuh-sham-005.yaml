text: "فأسرحوا إليهم فإذا هم من ثقيف وطي ومرداس قد وجههم عمر بن الخطاب إلى مصر مع رفاعة بن قيس وبشار بن عون. قال : فلما رأوهم سلموا عليهم ورحبوا بهم واستبشروا بالنصر لما رأوا خالدا وعمارا والمقداد ومالكا وارتفعت أصواتهم"
