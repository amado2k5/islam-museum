text: "… الحديث: ثم ارفع حتى تعتدل قائماً فاكتفى بالاعتدال، ولم يذكر الطمأنينة كما ذكرها في سائرها، وقال أي مح في الحديث استحباب السلام عند اللقاء وإن تكرر مع قرب العهد، ووجوب ردّه، وفيه أن من أخلّ يبعض الواجبات لا يصح صلاته، …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 484، يرد فيه ذكر الواجب، والوجوب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 484, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 484 کا اقتباس جس میں واجب، وجوب، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 1, p. 484, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Mishkat al-Masabih, volumen digitalizado 1, p. 484, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 484'ten, farz, tavsiye edilen ve müstehap olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz, tavsiye edilen ve müstehap olan ameller, itaat amelleri, tiksindirilen ameller, yasaklanmış ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 484, yang menyebutkan amalan wajib, anjuran, dan yang diinginkan; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, anjuran, dan yang diinginkan, amalan ketaatan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
