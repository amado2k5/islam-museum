summary:
  ar: "بلغ مالكا أنه إذا دخل البيت غير المسكون يُقال: السلام علينا وعلى عباد الله الصالحين. {cite:muwatta-maruf-1997 p.552}"
  tr: "Malik, ıssız bir eve girildiğinde, \"Selam olsun bize ve Allah'ın salih kullarına\" denmesi gerektiğini bildirmiştir. {cite:muwatta-maruf-1997 s.552}"
  id: "Malik meriwayatkan bahwa jika seseorang memasuki rumah yang tidak berpenghuni, hendaknya ia mengucapkan: \"Salam sejahtera atas kami dan atas hamba-hamba Allah yang saleh.\" {cite:muwatta-maruf-1997 p.552}"
