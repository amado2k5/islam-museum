text: "… قبسل لقائكم - وسمع الفتويع وى أعمرى كطرفه وخبرت عنكم كل جود ورفعة - قلا التقينا كنتم فوق وصفه وقال آخر تبسم الثغرون أوصافكم فندا • من طيب ذكركم شرا فاحيانا أن هنا عشقناكم ولم تركم والاذن تعشق قبل العين …"
