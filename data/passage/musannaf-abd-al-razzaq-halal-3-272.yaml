text: "… لَا أُحِلُّ إِلَّا مَا أَحَلّ اللَّهُ فِي كِتَابِهِ، وَلَا أُحَرَّمُ إِلَّا مَا حَرَّمَ اللَّهُ فِي كِتَابِهِ. عبد الرزاق، عَنِ ابْنِ عُيَيْنَةَ، عَنْ عَمْرِوبْنِ دِينَارِ، أَنَّهُ سَمِعَ عُبَيْدَ بْنَ عُمَيْرِ يَقُولُ : أَحَلَّ اللّهُ حَلَالَهُ، وَحَرَّمَ حَرَامَهُ، فَمَا أَحَلَّ فَهُوَ حَلَالٌ، …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 3، ص 272، يذكر الحلال، وما أُحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 3, p. 272, that mentions the lawful, what was made lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 3، ص 272 کا اقتباس جس میں حلال، جو حلال کیا گیا، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 3, pág. 272, que menciona lo lícito, lo que se hizo lícito, lo ilícito y lo que se hizo ilícito; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 3, page 272, mentionnant le licite, ce qui a été rendu licite, l'illicite et ce qui a été rendu illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Halal and Haram Browser."
  tr: "Musannaf Abd al-Razzaq, Resimli Cilt 3, sayfa 272'den, helal olan, haram olan ve haram olan şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
