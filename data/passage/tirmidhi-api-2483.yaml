text: "حَدَّثَنَا عَلِيُّ بْنُ حُجْرٍ، أَخْبَرَنَا شَرِيكٌ، عَنْ أَبِي إِسْحَاقَ، عَنْ حَارِثَةَ بْنِ مُضَرِّبٍ، قَالَ أَتَيْنَا خَبَّابًا نَعُودُهُ وَقَدِ اكْتَوَى سَبْعَ كَيَّاتٍ فَقَالَ لَقَدْ تَطَاوَلَ مَرَضِي وَلَوْلاَ أَنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" لاَ تَمَنَّوُا الْمَوْتَ \". لَتَمَنَّيْتُ وَقَالَ \" يُؤْجَرُ الرَّجُلُ فِي نَفَقَتِهِ كُلِّهَا إِلاَّ التُّرَابَ أَوْ قَالَ فِي الْبِنَاءِ \". قَالَ أَبُو عِيسَى هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2483، يذكر الكي، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2483 (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara'), that mentions cautery, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2483، جس میں داغنا، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
