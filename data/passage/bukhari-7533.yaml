label:
  ar: "البخاري 7533 — هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها"
  en: "Bukhari 7533 — Have I wronged you in your wage: this community and those before it"
  ur: "بخاری 7533 — کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں"
text: "إنما بقاؤكم فيمن سلف من الأمم كما بين صلاة العصر إلى غروب الشمس، أوتي أهل التوراة التوراة فعملوا بها حتى انتصف النهار، ثم عجزوا فأعطوا قيراطا قيراطا، ثم أوتي أهل الإنجيل الإنجيل فعملوا به حتى صليت العصر، ثم عجزوا فأعطوا …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7533: هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7533: Have I wronged you in your wage: this community and those before it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7533: کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
