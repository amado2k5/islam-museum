label:
  ar: "مسلم 2846b — تحاجت الجنة والنار: أنت رحمتي وأنت عذابي"
  en: "Muslim 2846b — Paradise and the Fire disputed: you are My mercy, you are My punishment"
  ur: "مسلم 2846b — جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب"
text: "تحاجت النار والجنة فقالت النار أوثرت بالمتكبرين والمتجبرين . وقالت الجنة فما لي لا يدخلني إلا ضعفاء الناس وسقطهم وعجزهم . فقال الله للجنة أنت رحمتي أرحم بك من أشاء من عبادي . وقال للنار أنت عذابي أعذب بك من …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2846b: تحاجت الجنة والنار: أنت رحمتي وأنت عذابي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2846b: Paradise and the Fire disputed: you are My mercy, you are My punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2846b: جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
