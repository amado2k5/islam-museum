label: { ar: "الموطأ 2667 — سعيد المقبري عن أبيه عن أبي هريرة: خمس من الفطرة", en: "Muwatta 2667", es: "Muwatta 2667", fr: "Muwatta 2667", ur: "موطا 2667", tr: "El-Muvatta 2667 — Said el-Makburi, babasından, o da Ebu Hurayra'dan rivayetle: Beş şey fıtrattandır.", id: "Al-Muwatta 2667 — Saeed Al-Maqburi, berdasarkan riwayat ayahnya, berdasarkan riwayat Abu Hurairah: Lima hal yang termasuk fitrah (kecenderungan alamiah)." }
summary:
  ar: "يروي مالك عن سعيد بن أبي سعيد المقبري عن أبيه عن أبي هريرة أنه قال: خمس من الفطرة: تقليم الأظفار، وقص الشارب، ونتف الإبط، وحلق العانة، والاختتان. {cite:muwatta-maruf-1997 p.506}"
  tr: "Malik, Sa'id ibn Abi Sa'id al-Maqburi'den, o da babasından, o da Ebu Hurayra'dan rivayetle şöyle buyurduğunu nakletmiştir: \"Beş şey doğal eğilimin bir parçasıdır: Tırnak kesmek, bıyık kesmek, koltuk altı kıllarını yolmak, kasık kıllarını tıraş etmek ve sünnet olmak.\" {cite:muwatta-maruf-1997 s.506}"
  id: "Malik meriwayatkan dari Sa'id ibn Abi Sa'id al-Maqburi, dari ayahnya, dari Abu Hurayrah, bahwa beliau berkata: \"Lima hal merupakan bagian dari watak alamiah: memotong kuku, memotong kumis, mencabut bulu ketiak, mencukur bulu kemaluan, dan sunat.\" {cite:muwatta-maruf-1997 p.506}"
