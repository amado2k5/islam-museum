text: "… مَنْ قَاتَلَ في سَبيلِ اللَّهِ من رَجُل مُسْلِمِ والنسائي ٢٥/٦]. وقالَ: إِنَّ في الجَنَّةِ مِائَةَ دَرَجَةٍ أعَدّهَا اللَّهُ لمُمُجاهِدِينَ فى سَبِيل اللّهِ مَا بَيْنَ كُلَّ دَرَجَتَيْن كَمَا بَيْنَ السَّمَاءِ والأرْضِ، فَإِذَا سَأَلْتُمُ اللَّهَ فَاسْأَلُوهُ الفِرْدَوْس، فإِنَّهُ أَوْسَطُ الجَنَّةِ وَأَعْلَى الجَنَّةِ، …"
