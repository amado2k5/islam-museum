label: { ar: "الموطأ 778 — مالك: رأى أهل العلم يستحبون إخراج زكاة الفطر إذا طلع الفجر من يوم الفطر قبل الغدو إلى المصلى", en: "Muwatta 778" }
summary:
  ar: "يروي مالك أنه رأى أهل العلم يستحبون أن يخرجوا زكاة الفطر إذا طلع الفجر من يوم الفطر قبل أن يغدوا إلى المصلى. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأنه روي عن نافع عن ابن عمر أن النبي كان يأمر بإخراج الزكاة قبل الغدو للصلاة من يوم الفطر، وهو حديث صحيح أخرجه البخاري (2/162) ومسلم (3/70)، وأن الترمذي قال عقبه إن ذلك الذي يستحبه أهل العلم. {cite:muwatta-maruf-1997 p.383} {cite:muwatta-maruf-1997 p.384}"
