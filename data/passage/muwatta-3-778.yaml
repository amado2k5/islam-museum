label: { ar: "الموطأ 778 — مالك: رأى أهل العلم يستحبون إخراج زكاة الفطر إذا طلع الفجر من يوم الفطر قبل الغدو إلى المصلى", en: "Muwatta 778", es: "Muwatta 778", fr: "Muwatta 778", ur: "موطا 778", tr: "Al-Muwatta 778 — Malik: Alimler, zekât-ı fitrenin Ramazan Bayramı günü sabahın erken saatlerinden sonra, namaz kılınacak yere gitmeden önce verilmesinin daha faziletli olduğuna inanırlar.", id: "Al-Muwatta 778 — Malik: Para ulama meyakini bahwa lebih baik membayar zakat fitrah setelah fajar menyingsing pada hari raya Idul Fitri, sebelum pergi ke tempat shalat." }
summary:
  ar: "يروي مالك أنه رأى أهل العلم يستحبون أن يخرجوا زكاة الفطر إذا طلع الفجر من يوم الفطر قبل أن يغدوا إلى المصلى. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأنه روي عن نافع عن ابن عمر أن النبي كان يأمر بإخراج الزكاة قبل الغدو للصلاة من يوم الفطر، وهو حديث صحيح أخرجه البخاري (2/162) ومسلم (3/70)، وأن الترمذي قال عقبه إن ذلك الذي يستحبه أهل العلم. {cite:muwatta-maruf-1997 p.383} {cite:muwatta-maruf-1997 p.384}"
  id: "Malik meriwayatkan bahwa ia melihat para ulama menganjurkan untuk membayar Zakat Fitrah pada waktu subuh di hari raya Idul Fitri, sebelum pergi ke tempat shalat. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik, dan bahwa hal itu diriwayatkan dari Nafi' atas otoritas Ibnu Umar bahwa Nabi (shalawat dan salam kepadanya) biasa memerintahkan agar Zakat dibayarkan sebelum pergi ke tempat shalat pada hari raya Idul Fitri. Ini adalah hadits sahih yang dicatat oleh al-Bukhari (2/162) dan Muslim (3/70), dan bahwa al-Tirmidhi mengatakan setelahnya bahwa inilah yang dianjurkan oleh para ulama. {cite:muwatta-maruf-1997 p.383} {cite:muwatta-maruf-1997 p.384}"
