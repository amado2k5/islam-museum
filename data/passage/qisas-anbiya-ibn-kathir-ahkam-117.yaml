  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 117. sayfasından, itaat amellerinden bahseden bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Zorunlu, tavsiye edilen, mekruh edilen, yasaklanan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 117, yang menyebutkan perbuatan-perbuatan ketaatan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk dosa-dosa wajib, anjuran, yang tidak disukai, yang dilarang, dan dosa-dosa kecil."
