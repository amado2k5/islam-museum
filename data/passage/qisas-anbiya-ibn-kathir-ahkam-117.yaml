text: "… مالك قال : قال رسول اللّٰه عليّا : إن اللّٰه ليرضى عن العبد أن يأكل الأكلة فيحمده عليها أو يشرب الشربة فيحمده عليها. وكذا رواه مسلم والترمذى والنسائى من حديث أبى أسامة. والظاهر أن الشكور هو الذى يعمل بجميع الطاعات …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 117، يرد فيه ذكر الطاعات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
