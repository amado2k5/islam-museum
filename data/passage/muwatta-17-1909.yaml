summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أنه قال: لا ربا في الحيوان، وإنما نهي من الحيوان عن ثلاثة: المضامين والملاقيح وحبل الحبلة. فالمضامين ما في بطون إناث الإبل، والملاقيح ما في ظهور الجمال. {cite:muwatta-maruf-1997 p.183}"
