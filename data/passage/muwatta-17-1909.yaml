label: { ar: "الموطأ 1909 — مالك عن ابن شهاب عن سعيد بن المسيب: لا ربا في الحيوان، وإنما نهي عن ثلاثة: المضامين والملاقيح وحبل الحبلة", en: "Muwatta 1909", es: "Muwatta 1909", fr: "Muwatta 1909", ur: "موطا 1909", tr: "El-Muvatta 1909 — Malik, İbn Şihab'dan, o da Said bin El-Musayyab'dan rivayet ettiğine göre: Hayvanlarda faiz yoktur, fakat üç şey haramdır: gebe hayvanın yavrusu, gebe hayvanın yavrusu ve gebe hayvanın yavrusu.", id: "Al-Muwatta 1909 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab: Tidak ada riba pada hewan, tetapi tiga hal yang diharamkan: anak dari hewan yang sedang hamil, anak dari hewan yang sedang hamil, dan anak dari hewan yang sedang hamil." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أنه قال: لا ربا في الحيوان، وإنما نهي من الحيوان عن ثلاثة: المضامين والملاقيح وحبل الحبلة. فالمضامين ما في بطون إناث الإبل، والملاقيح ما في ظهور الجمال. {cite:muwatta-maruf-1997 p.183}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn al-Musayyab'dan rivayetle şöyle buyurduğunu aktarır: \"Hayvanlarda faiz yoktur. Hayvanlarla ilgili haram olan sadece üç şeydir: doğmamış yavrular, gebe devenin yavrusu ve gebe devenin yavrusu. Doğmamış yavrular dişi develerin rahimlerinde bulunanlardır, yavrular ise develerin sırtlarında bulunanlardır.\" {cite:muwatta-maruf-1997 s.183}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, bahwa beliau berkata: \"Tidak ada riba pada hewan. Yang diharamkan pada hewan hanyalah tiga hal: anak yang belum lahir, anak unta yang sedang bunting, dan anak unta yang sedang bunting. Anak yang belum lahir adalah yang ada di dalam rahim unta betina, dan anak unta adalah yang ada di punggung unta.\" {cite:muwatta-maruf-1997 p.183}"
