label: { ar: "صحيح البخاري 3703 — الأب والأبوة", en: "Sahih al-Bukhari 3703 — the father and fatherhood", ur: "صحیح بخاری 3703 — باپ اور والدیت", es: "Sahih al-Bukhari 3703 — El padre y la paternidad", fr: "Sahih al-Bukhari 3703 — Le père et la paternité" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي حَازِمٍ، عَنْ أَبِيهِ، أَنَّ رَجُلاً، جَاءَ إِلَى سَهْلِ بْنِ سَعْدٍ فَقَالَ هَذَا فُلاَنٌ ـ لأَمِيرِ الْمَدِينَةِ ـ يَدْعُو عَلِيًّا عِنْدَ الْمِنْبَرِ. قَالَ فَيَقُولُ مَاذَا قَالَ يَقُولُ لَهُ أَبُو تُرَابٍ. فَضَحِكَ قَالَ وَاللَّهِ مَا سَمَّاهُ إِلاَّ النَّبِيُّ، وَمَا كَانَ لَهُ اسْمٌ أَحَبَّ إِلَيْهِ مِنْهُ. فَاسْتَطْعَمْتُ الْحَدِيثَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3703، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3703 (Companions of the Prophet), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3703، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3703 (Compañeros del Profeta), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3703 (Compagnons du Prophète), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
