label: { ar: "الموطأ 1865 — مالك عن نافع عن ابن عمر: كانوا يبتاعون الطعام في زمن النبي، فيبعث من يأمرهم بنقله من المكان الذي ابتاعوه فيه قبل أن يبيعوه", en: "Muwatta 1865", es: "Muwatta 1865", fr: "Muwatta 1865", ur: "موطا 1865", tr: "El-Muvatta 1865 — Malik, Nafi'den, o da İbn Ömer'den rivayetle: Peygamberimiz zamanında yiyecek alırlardı; o da satmadan önce aldıkları yerden başka bir yere taşımaları için birini gönderirdi.", id: "Al-Muwatta 1865 — Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Ibn Umar: Mereka biasa membeli makanan pada zaman Nabi, lalu beliau akan mengirim seseorang untuk memerintahkan mereka memindahkan makanan itu dari tempat mereka membelinya sebelum mereka menjualnya." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه قال: كنا في زمان رسول الله نبتاع الطعام، فيبعث علينا من يأمرنا بانتقاله من المكان الذي ابتعناه فيه إلى مكان سواه، قبل أن نبيعه. {cite:muwatta-maruf-1997 p.167} {cite:muwatta-maruf-1997 p.168}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre şöyle buyurmuştur: \"Allah Resulü zamanında yiyecek alırdık ve o da bize, aldığımızı satmadan önce başka bir yere taşımamızı emretmesi için birini gönderirdi.\" {cite:muwatta-maruf-1997 s.167} {cite:muwatta-maruf-1997 s.168}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar, yang berkata: “Pada zaman Rasulullah, kami biasa membeli makanan, dan beliau akan mengirim seseorang untuk memerintahkan kami memindahkannya dari tempat kami membelinya ke tempat lain sebelum kami menjualnya.” {cite:muwatta-maruf-1997 p.167} {cite:muwatta-maruf-1997 p.168}"
