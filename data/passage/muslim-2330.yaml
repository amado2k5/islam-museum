label: { ar: "مسلم 2330 — أزهر اللون كأن عرقه اللؤلؤ", en: "Muslim 2330 — Radiant of colour, his sweat like pearls" }
text: "قال أنس: كان رسول الله أزهر اللون، كأن عرقه اللؤلؤ، إذا مشى تكفأ، ولا مسست ديباجة ولا حريرة ألين من كف رسول الله، ولا شممت مسكة ولا عنبرة أطيب من رائحة رسول الله"
summary:
  ar: "رواية أنس بن مالك في باب صفة خلقه من كتاب الفضائل في صحيح مسلم؛ وصف اللون والعرق والكف والرائحة — من أنصع نصوص الشمائل."
