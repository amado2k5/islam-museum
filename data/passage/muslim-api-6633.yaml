label: { ar: "صحيح مسلم 6633 — الرخصة", en: "Sahih Muslim 6633 — the concession (rukhsa)", ur: "صحیح مسلم 6633 — رخصت", fr: "Sahih Muslim 6633 — la dispense (rukhsa)", es: "Sahih Muslim 6633 — la dispensa (rukhsa)", tr: "Sahih Muslim 6633 — Ruhsat", id: "Sahih Muslim 6633 — Lisensi" }
text: "… عُقْبَةَ بْنِ أَبِي مُعَيْطٍ، وَكَانَتْ، مِنَ الْمُهَاجِرَاتِ الأُوَلِ اللاَّتِي بَايَعْنَ النَّبِيَّ أَخْبَرَتْهُ أَنَّهَا سَمِعَتْ رَسُولَ اللَّهِ وَهُوَ يَقُولُ \" لَيْسَ الْكَذَّابُ الَّذِي يُصْلِحُ بَيْنَ النَّاسِ وَيَقُولُ خَيْرًا وَيَنْمِي خَيْرًا \". قَالَ ابْنُ شِهَابٍ وَلَمْ أَسْمَعْ يُرَخَّصُ فِي شَىْءٍ مِمَّا يَقُولُ النَّاسُ كَذِبٌ إِلاَّ فِي ثَلاَثٍ الْحَرْبُ وَالإِصْلاَحُ بَيْنَ النَّاسِ وَحَدِيثُ الرَّجُلِ امْرَأَتَهُ وَحَدِيثُ الْمَرْأَةِ زَوْجَهَا."
summary:
  ar: "حديث في صحيح مسلم، رقم 6633، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 6633 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 6633، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 6633, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 6633, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 6633 numaralı hadis, bir istisnadan bahsetmektedir. Farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahları, Kur'an, Sünnet, biyografi ve Sahabe ve ümmetlerden gelen rivayetlerle birlikte derleyen bu kitap, metinde yer alanları açıklasa da, buna dayanarak bir fetva vermemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6633, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
