label:
  ar: الموطأ 421 — فليدرأه ما استطاع، فإن أبى فليقاتله فإنما هو شيطان
  en: Muwatta 421
  es: "Muwatta 421"
  fr: "Muwatta 421"
  ur: "موطا 421"
  tr: "El-Muvatta 421 — Onu elinden geldiğince savuştursun, eğer reddederse onunla savaşsın; çünkü o bir şeytandan başka bir şey değildir."
  id: "Al-Muwatta 421 — Hendaklah ia menolaknya sebisa mungkin, dan jika ia menolak, maka hendaklah ia melawannya, karena ia hanyalah setan."
text: إذا كان أحدكم يصلي فلا يدع أحداً يمر بين يديه، وليدرأه ما استطاع، فإن أبى فليقاتله، فإنما هو شيطان
summary:
  ar: 'أول حديث في باب التشديد في أن يمر أحد بين يدي المصلي. يرويه يحيى عن مالك عن زيد بن أسلم عن عبد الرحمن بن أبي سعيد الخدري عن أبيه: أمر النبي المصلي ألا يدع أحداً يمر بين يديه وأن يدفعه ما استطاع، فإن أبى فليقاتله فإنما هو شيطان. ويخرّجه المحقق عند مسلم (2/57) وأبي داود (697) والنسائي (2/66) وابن حبان والدارمي وأحمد وابن الجارود من طرق أصحاب مالك، ويحيل على التمهيد (4/185). {cite:muwatta-maruf-1997 p.219} {cite:muwatta-maruf-1997 p.220}'
  id: "Hadits pertama dalam bab ini membahas larangan keras bagi siapa pun untuk melewati orang yang sedang shalat. Diriwayatkan oleh Yahya dari Malik, dari Zayd ibn Aslam, dari Abd al-Rahman ibn Abi Sa'id al-Khudri, dari ayahnya: Nabi (shalawat dan salam kepadanya) memerintahkan orang yang sedang shalat untuk tidak membiarkan siapa pun melewatinya dan untuk mendorongnya menjauh sebisa mungkin. Jika orang itu menolak, maka ia harus memeranginya, karena ia hanyalah setan. Editor menyertakannya dalam Muslim (2/57), Abu Dawud (697), al-Nasa'i (2/66), Ibn Hibban, al-Darimi, Ahmad, dan Ibn al-Jarud melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (4/185). {cite:muwatta-maruf-1997 p.219} {cite:muwatta-maruf-1997 p.220}"
