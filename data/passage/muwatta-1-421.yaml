label: { ar: "الموطأ 421 — فليدرأه ما استطاع، فإن أبى فليقاتله فإنما هو شيطان", en: "Muwatta 421" }
text: "إذا كان أحدكم يصلي فلا يدع أحداً يمر بين يديه، وليدرأه ما استطاع، فإن أبى فليقاتله، فإنما هو شيطان"
summary:
  ar: "أول حديث في باب التشديد في أن يمر أحد بين يدي المصلي. يرويه يحيى عن مالك عن زيد بن أسلم عن عبد الرحمن بن أبي سعيد الخدري عن أبيه: أمر النبي المصلي ألا يدع أحداً يمر بين يديه وأن يدفعه ما استطاع، فإن أبى فليقاتله فإنما هو شيطان. ويخرّجه المحقق عند مسلم (2/57) وأبي داود (697) والنسائي (2/66) وابن حبان والدارمي وأحمد وابن الجارود من طرق أصحاب مالك، ويحيل على التمهيد (4/185). {cite:muwatta-maruf-1997 p.219} {cite:muwatta-maruf-1997 p.220}"
