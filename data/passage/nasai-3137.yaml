label:
  ar: "النسائي 3137 — أول من يقضى عليه يوم القيامة: الشهيد والعالم والمتصدق المراؤون"
  en: "Nasa'i 3137 — The first judged on the Day: those who fought, taught and gave for show"
  ur: "نسائی 3137 — قیامت کے دن پہلے فیصلہ: دکھاوے کے لیے لڑنے، پڑھانے اور خرچ کرنے والے"
text: "أول الناس يقضى لهم يوم القيامة ثلاثة رجل استشهد فأتي به فعرفه نعمه فعرفها قال فما عملت فيها قال قاتلت فيك حتى استشهدت . قال كذبت ولكنك قاتلت ليقال فلان جريء فقد قيل ثم أمر به فسحب على وجهه حتى …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 3137: أول من يقضى عليه يوم القيامة: الشهيد والعالم والمتصدق المراؤون. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 3137: The first judged on the Day: those who fought, taught and gave for show. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 3137: قیامت کے دن پہلے فیصلہ: دکھاوے کے لیے لڑنے، پڑھانے اور خرچ کرنے والے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
