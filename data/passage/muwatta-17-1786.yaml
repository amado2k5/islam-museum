label: { ar: "الموطأ 1786 — مالك: من اشترى عبدا أو وليدة بمائة دينار إلى أجل، ثم ندم البائع فسأل المشتري أن يقيله بعشرة دنانير يدفعها نقدا أو إلى أجل، فلا بأس، أما إن ندم المشتري وسأل البائع أن يقيله بزيادة عشرة إلى أجل أبعد، فلا ينبغي", en: "Muwatta 1786" }
summary:
  ar: "قال مالك في الرجل يبتاع العبد أو الوليدة بمائة دينار إلى أجل، ثم يندم البائع فيسأل المبتاع أن يقيله بعشرة دنانير، يدفعها نقدا أو إلى أجل، ويمحو عنه المائة دينار التي له: قال مالك: لا بأس بذلك. وإن ندم المبتاع فسأل البائع أن يقيله في الجارية أو العبد، ويزيده عشرة دنانير نقدا أو إلى أجل أبعد من الأجل الذي اشترى إليه، فإن ذلك لا ينبغي؛ لأن البائع كأنه باع منه مائة دينار له إلى سنة قبل أن تحل بجارية وبعشرة دنانير نقدا، أو إلى أجل أبعد، فدخل في ذلك بيع الذهب بالذهب إلى أجل. {cite:muwatta-maruf-1997 p.130} {cite:muwatta-maruf-1997 p.131}"
