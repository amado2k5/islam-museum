label: { ar: "الموطأ 936 — ابن عمر كان يصلي في مسجد ذي الحليفة ثم يخرج فيركب، فإذا استوت به راحلته أحرم", en: "Muwatta 936", es: "Muwatta 936", fr: "Muwatta 936", ur: "موطا 936", tr: "El-Muvatta 936 — İbn Ömer, Zül-Huleyfe mescidinde namaz kılardı, sonra dışarı çıkar ve devesine binerdi. Bineği yerine oturduğunda ihram haline girerdi.", id: "Al-Muwatta 936 — Ibnu Umar biasa shalat di masjid Dhu al-Hulayfah, kemudian ia keluar dan menaiki untanya. Setelah untanya duduk dengan nyaman, ia memasuki keadaan ihram." }
text: "كان يصلي في مسجد ذي الحليفة، ثم يخرج فيركب، فإذا استوت به راحلته أحرم"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يصلي في مسجد ذي الحليفة، ثم يخرج فيركب، فإذا استوت به راحلته أحرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (1069). {cite:muwatta-maruf-1997 p.449}"
  tr: "Malik, Nafi’den rivayet ettiğine göre, Abdullah ibn Umar, Zül-Hulayfe mescidinde namaz kılardı, sonra dışarı çıkar ve devesine binerdi. Bineğine bindikten sonra ihram haline girerdi. Araştırmacı, bunu Malik’ten rivayet edenlerin Ebu Mus’ab ve Muhammed ibn el-Hasan el-Şeybani’nin (1069) de naklettiğini belirtiyor. {cite:muwatta-maruf-1997 s.449}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa shalat di masjid Dhu al-Hulayfah, kemudian ia keluar dan menaiki untanya. Setelah untanya duduk, ia memasuki keadaan ihram. Peneliti menyebutkan bahwa Abu Mus’ab dan Muhammad ibn al-Hasan al-Shaybani (1069) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.449}"
