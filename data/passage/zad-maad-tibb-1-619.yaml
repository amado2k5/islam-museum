text: "… وهي الحمى والسعال، والوجع الناخِس، وضيق النفس،. والنبض المنشاري والعلاج الموجود في الحديث، ليس هو لهذا القسم، لكن للقسم الثاني الكائن عن الريح الغليظة، فإن القسط البحري - وهو العود الهندي على ما جاء الريحِ المذكور، أو لعق، كان دواءً …"
