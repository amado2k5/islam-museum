label: { ar: "صحيح مسلم 256 — بر الوالدين أو عقوقهما", en: "Sahih Muslim 256 — dutifulness to the parents or disobedience to them", ur: "صحیح مسلم 256 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih Muslim 256 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sahih Muslim 256 — le respect des parents ou la désobéissance envers eux", tr: "Sahih Muslim 256 — Anne babaya iyilik mi, itaatsizlik mi?", id: "Sahih Muslim 256 — Kebaikan atau ketidaktaatan kepada orang tua" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَرِيرٌ، عَنِ الْحَسَنِ بْنِ عُبَيْدِ اللَّهِ، عَنْ أَبِي عَمْرٍو الشَّيْبَانِيِّ، عَنْ عَبْدِ اللَّهِ، عَنِ النَّبِيِّ قَالَ \" أَفْضَلُ الأَعْمَالِ - أَوِ الْعَمَلِ - الصَّلاَةُ لِوَقْتِهَا وَبِرُّ الْوَالِدَيْنِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 256، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 256 (The Book of Faith), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 256، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 256 (El Libro de la Fe), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 256 (Le Livre de la Foi), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih Müslim'de 256 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. Bu hadis, \"İslam'da Anne Babalık\" tarayıcısı tarafından Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 256, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Hadits ini dikumpulkan oleh peramban \"Parenthood in Islam\" bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
