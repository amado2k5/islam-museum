label: { ar: "سنن النسائي 1297 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Sunan al-Nasa'i 1297 — ranks raised; bad deeds erased and sins shed", ur: "سنن نسائی 1297 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sunan al-Nasa'i 1297 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Sunan al-Nasa'i 1297 — Les rangs s'élèvent; les mauvaises actions sont effacées et les péchés sont pardonnés.", tr: "Sunan an-Nasa'i 1297 — Rütbeleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Sunan an-Nasa'i 1297 — Meningkatkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ يُوسُفَ، قَالَ حَدَّثَنَا يُونُسُ بْنُ أَبِي إِسْحَاقَ، عَنْ بُرَيْدِ بْنِ أَبِي مَرْيَمَ، قَالَ حَدَّثَنَا أَنَسُ بْنُ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ صَلَّى عَلَىَّ صَلاَةً وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرَ صَلَوَاتٍ وَحُطَّتْ عَنْهُ عَشْرُ خَطِيئَاتٍ وَرُفِعَتْ لَهُ عَشْرُ دَرَجَاتٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1297، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 1297 (The Book of Forgetfulness (In Prayer)), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 1297، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1297 (El Libro del Olvido (En la Oración)), habla de ascensos de rango, borrado de malas acciones y perdón de pecados. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1297 (Le Livre de l'oubli (dans la prière)), évoque l'élévation au rang social, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "Sunan-ı Nesai'de yer alan 1297 numaralı hadis, mertebelerin yükseltilmesinden, günahların silinmesinden ve suçların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 1297, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
