text: "… حدثنا أبو بكر محمد بن عبد اللّٰه ابن ابى شيبة حدثنا سلام ابو الاحوص عن منصور عن عبد اللّٰه بن عبد الرحمن بن ابزى قال كان على اذا انتهى اليه نعى الرجل قال انا لله وانا اليه راجعون اللهم ارفع …"
summary:
  ar: "مقطع من المصنف — ابن أبي شيبة، المجلد المصوَّر 3، ص 374، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Musannaf — Ibn Abi Shayba, scan volume 3, p. 374, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المصنف ابن ابی شیبہ، اسکین جلد 3، ص 374 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
