label: { ar: "جامع الترمذي 1047 — دفن وقبر ومرقد", en: "Jami' al-Tirmidhi 1047 — a burial, grave or resting place", ur: "جامع ترمذی 1047 — تدفین، قبر اور مرقد", es: "Jami' al-Tirmidhi 1047 — un lugar de entierro, tumba o descanso.", fr: "Jami' al-Tirmidhi 1047 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Tirmizi Derlemesi 1047 — Defin, Türbe ve Kutsal Mekan", id: "Koleksi Al-Tirmidhi 1047 — Pemakaman, Kuburan, dan Makam" }
text: "… بْنُ أَخْزَمَ الطَّائِيُّ الْبَصْرِيُّ، حَدَّثَنَا عُثْمَانُ بْنُ فَرْقَدٍ، قَالَ سَمِعْتُ جَعْفَرَ بْنَ مُحَمَّدٍ، عَنْ أَبِيهِ، قَالَ الَّذِي أَلْحَدَ قَبْرَ رَسُولِ اللَّهِ أَبُو طَلْحَةَ وَالَّذِي أَلْقَى الْقَطِيفَةَ تَحْتَهُ شُقْرَانُ مَوْلَى رَسُولِ اللَّهِ. قَالَ جَعْفَرٌ وَأَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ أَبِي رَافِعٍ قَالَ سَمِعْتُ شُقْرَانَ يَقُولُ أَنَا وَاللَّهِ طَرَحْتُ الْقَطِيفَةَ تَحْتَ رَسُولِ اللَّهِ فِي الْقَبْرِ. قَالَ وَفِي الْبَابِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1047، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1047 (The Book on Jana''iz (Funerals)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1047، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1047 (El Libro de los Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1047 (Livre des funérailles), mentionne une sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'de 1047 numaralı hadis, defin, mezar ve türbeden bahsetmektedir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler üzerine çalışan araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1047, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini dikumpulkan oleh para peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
