label: { ar: "الموطأ 1340 — معاذ بن جبل: الغزو غزوان، غزو تنفق فيه الكريمة ويطاع فيه ذو الأمر، وغزو لا يرجع صاحبه كفافا", en: "Muwatta 1340", es: "Muwatta 1340", fr: "Muwatta 1340", ur: "موطا 1340", tr: "El-Muvatta 1340 — Mu'adh ibn Jabal: İki çeşit baskın vardır: Cömert insanların harcadığı ve yetkililere itaat edildiği baskın ve eli boş dönmeyen baskın.", id: "Al-Muwatta 1340 — Mu'adh ibn Jabal: Ada dua jenis penyerangan: penyerangan di mana orang-orang dermawan memberi dan orang-orang yang berwenang ditaati, dan penyerangan di mana seseorang tidak pulang dengan tangan kosong." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن معاذ بن جبل أنه قال الغزو غزوان: فغزو تنفق فيه الكريمة، ويياسر فيه الشريك، ويطاع فيه ذو الأمر، ويجتنب فيه الفساد، فذلك الغزو خير كله. وغزو لا تنفق فيه الكريمة، ولا يياسر فيه الشريك، ولا يطاع فيه ذو الأمر، ولا يجتنب فيه الفساد، فذلك الغزو لا يرجع صاحبه كفافا. ويذكر المحقق أن الحديث روي مرفوعا من طريق بقية بن الوليد، وفيه بقية وهو ضعيف. {cite:muwatta-maruf-1997 p.600}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Mu'adh ibn Jabal'dan rivayetle şöyle buyurduğunu aktarır: \"İki çeşit sefer vardır: Birincisinde cömert harcama yapılır, ortaklara müsamaha gösterilir, yetkililere itaat edilir ve rüşvetten kaçınılır; bu sefer tamamen hayırlıdır. Diğer sefer ise cömert harcama yapılmaz, ortaklara müsamaha gösterilmez, yetkililere itaat edilmez ve rüşvetten kaçınılmaz; bu sefer katılımcılarını az da olsa bir kazançla geri getirmeyecektir.\" Araştırmacı, bu hadisin, zayıf kabul edilen Baqiyyah ibn al-Walid'in rivayet zinciriyle Peygamberimize kadar uzanan bir hadis olarak nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.600}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Mu'adh ibn Jabal, bahwa beliau berkata: \"Ada dua jenis ekspedisi: yang pertama adalah ekspedisi yang dilakukan dengan murah hati, para mitra diperlakukan dengan baik, penguasa ditaati, dan korupsi dihindari—ekspedisi ini sepenuhnya baik. Jenis ekspedisi lainnya adalah ekspedisi yang tidak dilakukan dengan murah hati, para mitra tidak diperlakukan dengan baik, penguasa tidak ditaati, dan korupsi tidak dihindari—ekspedisi ini tidak akan membawa kembali para pesertanya dengan imbalan yang sedikit pun.\" Peneliti mencatat bahwa hadits ini diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi melalui rantai periwayatan Baqiyyah ibn al-Walid, yang mencakup Baqiyyah, yang dianggap lemah. {cite:muwatta-maruf-1997 p.600}"
