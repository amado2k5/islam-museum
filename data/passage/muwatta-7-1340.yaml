label: { ar: "الموطأ 1340 — معاذ بن جبل: الغزو غزوان، غزو تنفق فيه الكريمة ويطاع فيه ذو الأمر، وغزو لا يرجع صاحبه كفافا", en: "Muwatta 1340" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن معاذ بن جبل أنه قال الغزو غزوان: فغزو تنفق فيه الكريمة، ويياسر فيه الشريك، ويطاع فيه ذو الأمر، ويجتنب فيه الفساد، فذلك الغزو خير كله. وغزو لا تنفق فيه الكريمة، ولا يياسر فيه الشريك، ولا يطاع فيه ذو الأمر، ولا يجتنب فيه الفساد، فذلك الغزو لا يرجع صاحبه كفافا. ويذكر المحقق أن الحديث روي مرفوعا من طريق بقية بن الوليد، وفيه بقية وهو ضعيف. {cite:muwatta-maruf-1997 p.600}"
