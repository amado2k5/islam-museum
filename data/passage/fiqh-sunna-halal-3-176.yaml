  tr: "Seyyid Sabiq'in *Fıkıh el-Sünnet* adlı eserinin 3. cildinin 176. sayfasından, helal, haram ve haram olan hususları belirten bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
