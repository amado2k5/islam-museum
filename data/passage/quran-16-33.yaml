text: "هَلْ يَنظُرُونَ إِلَّآ أَن تَأْتِيَهُمُ ٱلْمَلَـٰٓئِكَةُ أَوْ يَأْتِىَ أَمْرُ رَبِّكَ ۚ كَذَٰلِكَ فَعَلَ ٱلَّذِينَ مِن قَبْلِهِمْ ۚ وَمَا ظَلَمَهُمُ ٱللَّهُ وَلَـٰكِن كَانُوٓا۟ أَنفُسَهُمْ يَظْلِمُونَ"
text_search: "هل ينظرون إلا أن تأتيهم الملائكة أو يأتي أمر ربك ۚ كذلك فعل الذين من قبلهم ۚ وما ظلمهم الله ولكن كانوا أنفسهم يظلمون"
translations:
  en: { text: "Await they aught say that the angels should come unto them or thy Lord's command should come to pass? Even so did those before them. Allah wronged them not, but they did wrong themselves,", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کیا یہ (کافر) اس بات کے منتظر ہیں کہ فرشتے ان کے پاس (جان نکالنے) آئیں یا تمہارے پروردگار کا حکم (عذاب) آپہنچے۔ اسی طرح اُن لوگوں نے کیا تھا جو اُن سے پہلے تھے اور خدا نے اُن پر ظلم نہیں کیا بلکہ وہ خود اپنے آپ پر ظلم کرتے تھے", translator: "Fateh Muhammad Jalandhari", license: PD }
