text: "… دنا الأجل فما الفائدة خرج يوماً ذاهباً إلى إحدى القرى المجاورة. وكان شبان بلدته قد أعدُّوا حفلة ساهرة للعب والتسلية، وكان هو واسطة عقد الانشراح والسرور في مثل هذه الحفلات، فقصدوا تأخيرَهُ عن الذهاب إلى تلك القرية. وعندما لَبِسَ الشيخ …"
summary:
  ar: "حاول شبان تأخير جحا عن رحلة إلى قرية مجاورة بإقناعه أنه ميت ويجب دفنه، فجرّدوه من ثيابه وهيّأوا غسله؛ ومرّ صديق فأصرّوا أن يشهد الجنازة؛ فقال جحا إن لا فائدة من الجدال، فقد حان الأجل. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  en: "Young men try to delay Juha from a trip to a neighbouring village by telling him he is dead and must be buried; he is stripped and they prepare his washing; a friend passes and they insist he attend the funeral; Juha says there is no point arguing, the appointed time has come. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  ur: "کچھ نوجوانوں نے جحا کو پڑوس کے گاؤں کے سفر سے روکنے کے لیے کہا کہ تم مر چکے ہو اور تمہیں دفن کرنا ہے؛ انہوں نے اس کے کپڑے اتارے اور غسل کی تیاری کی؛ ایک دوست گزرا تو انہوں نے اصرار کیا کہ جنازے میں شریک ہو؛ جحا نے کہا کہ بحث کا کوئی فائدہ نہیں، وقت آ گیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  fr: "Des jeunes gens veulent retarder Juha d'un voyage vers un village voisin en lui disant qu'il est mort et doit être enterré; ils le dévêtent et préparent sa toilette funéraire; un ami passe et ils insistent pour qu'il assiste aux funérailles; Juha dit qu'il ne sert à rien de discuter, son terme est venu. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  es: "Unos jóvenes intentan retrasar a Juha de un viaje a una aldea vecina diciéndole que está muerto y debe ser enterrado; lo desvisten y preparan su lavado; pasa un amigo y insisten en que asista al funeral; Juha dice que no tiene sentido discutir, ha llegado su hora. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
