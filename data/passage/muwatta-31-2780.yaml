summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن النبي قال: رأس الكفر نحو المشرق، والفخر والخيلاء في أهل الخيل والإبل من الفدادين أهل الوبر، والسكينة في أهل الغنم. ويبين المحقق معنى «الفدادين»، وهم من يعلو صوته في إبله وخيله. {cite:muwatta-maruf-1997 p.562} {cite:muwatta-maruf-1997 p.563}"
