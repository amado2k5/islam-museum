label: { ar: "الموطأ 2780 — أبو هريرة: رأس الكفر نحو المشرق والسكينة في أهل الغنم", en: "Muwatta 2780", es: "Muwatta 2780", fr: "Muwatta 2780", ur: "موطا 2780", tr: "El-Muvatta 2780 — Ebu Hurayra: Küfürün kaynağı doğudadır, huzur ise koyun ümmetindedir.", id: "Al-Muwatta 2780 — Abu Hurairah: Sumber kekafiran berada di sebelah timur, dan ketenangan ada pada kaum domba." }
summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن النبي قال: رأس الكفر نحو المشرق، والفخر والخيلاء في أهل الخيل والإبل من الفدادين أهل الوبر، والسكينة في أهل الغنم. ويبين المحقق معنى «الفدادين»، وهم من يعلو صوته في إبله وخيله. {cite:muwatta-maruf-1997 p.562} {cite:muwatta-maruf-1997 p.563}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Peygamberimizin şöyle buyurduğunu nakletmiştir: \"Küfürün kaynağı doğudadır. At ve deve sahipleri, deve çobanları ve çöl sakinleri arasında kibir ve gurur bulunur; koyun çobanları arasında ise huzur bulunur.\" Araştırmacı, \"deve çobanları\" ifadesinin anlamını açıklayarak, bunların develeri ve atları üzerinde seslerini yükseltenler olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.562} {cite:muwatta-maruf-1997 s.563}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Nabi bersabda: \"Sumber kekafiran terletak di sebelah timur, dan kesombongan serta keangkuhan terdapat di antara pemilik kuda dan unta, para penggembala unta, penduduk padang pasir, sedangkan ketenangan terdapat di antara para penggembala domba.\" Peneliti menjelaskan makna \"penggembala unta,\" dengan menjelaskan bahwa mereka adalah orang-orang yang meninggikan suara mereka atas unta dan kuda mereka. {cite:muwatta-maruf-1997 p.562} {cite:muwatta-maruf-1997 p.563}"
