text: |-
  وحكم تنوين ونون يلفى * اظهار ادغام وقلب إخفا
  فعند حرف الحلق أظهر وادغم * في اللام والرا لا بغنة لزم
  وأدغمن بغنة في يومن * إلا بكلمة كدنيا عنونوا
  والقلب عند البا بغنة كذا * إخفا لدى باقي الحروف أخذا
