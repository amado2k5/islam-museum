label: { ar: "الموطأ 2299 — مالك: العبيد المكاتبون كتابة واحدة يحمل بعضهم عن بعض", en: "Muwatta 2299", es: "Muwatta 2299", fr: "Muwatta 2299", ur: "موطا 2299", tr: "El-Muvatta 2299 — Malik: Tek bir yazılı azat sözleşmesine sahip köleler, bu sözleşmenin bazı hükümlerini diğerleri adına yerine getirirler.", id: "Al-Muwatta 2299 — Malik: Budak yang memiliki satu kontrak pembebasan tertulis melaksanakan sebagian dari perjanjian tersebut atas nama budak lainnya." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن العبيد إذا كوتبوا جميعا كتابة واحدة، فإن بعضهم ضامن عن بعض، ولا يوضع عنهم شيء بموت أحدهم. فإن قال أحدهم: عجزت، فلأصحابه أن يستعملوه فيما يطيق من العمل ويتعاونوا على كتابتهم، حتى يعتقوا بعتقهم أو يرقوا برقهم. {cite:muwatta-maruf-1997 p.347} {cite:muwatta-maruf-1997 p.348}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama şudur ki, eğer kölelerin hepsine tek bir özgürlük sözleşmesi verilirse, bazılarının diğerlerinden sorumlu olması ve birinin ölümü üzerine hiçbir sorumluluktan kurtulmaması söz konusudur. Eğer içlerinden biri, \"Yapamam\" derse, efendileri onu yapabileceği herhangi bir işte çalıştırabilir ve özgür bırakılana veya köle olarak kalana kadar özgür bırakılmalarını sağlamak için işbirliği yapabilirler. {cite:muwatta-maruf-1997 s.347} {cite:muwatta-maruf-1997 s.348}"
  id: "Malik berkata: Praktik yang berlaku di antara kita adalah jika semua budak diberikan satu kontrak pembebasan, maka sebagian dari mereka bertanggung jawab atas budak lainnya, dan tidak ada yang dibebaskan dari tanggung jawab mereka atas kematian salah satu dari mereka. Jika salah satu dari mereka berkata, \"Saya tidak mampu,\" maka tuannya dapat mempekerjakannya dalam pekerjaan apa pun yang mampu ia lakukan dan bekerja sama dalam mengamankan pembebasan mereka, sampai mereka dibebaskan setelah pembebasan mereka atau tetap diperbudak setelah perbudakan mereka. {cite:muwatta-maruf-1997 p.347} {cite:muwatta-maruf-1997 p.348}"
