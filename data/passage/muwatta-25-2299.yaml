summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن العبيد إذا كوتبوا جميعا كتابة واحدة، فإن بعضهم ضامن عن بعض، ولا يوضع عنهم شيء بموت أحدهم. فإن قال أحدهم: عجزت، فلأصحابه أن يستعملوه فيما يطيق من العمل ويتعاونوا على كتابتهم، حتى يعتقوا بعتقهم أو يرقوا برقهم. {cite:muwatta-maruf-1997 p.347} {cite:muwatta-maruf-1997 p.348}"
