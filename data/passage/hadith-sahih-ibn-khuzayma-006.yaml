text: "ابن حمزة الأسدي. وشقيق بن سلمة هو أبو وائل . (١١٨) باب استحباب صك الوجه بالماء عند غسل الوجه ١٥٣ - أخبرنا أبو طاهر، نا أبو بكر، نا يعقوب بن إبراهيم الدورقي، نا ابن علية، وله متابع وشواهد عند الحاكم"
