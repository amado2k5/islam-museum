text: "… فقاءت من قيح ودم وصديد ولحم عيط ' وغيره حتى ملات القدح. ثمّ قال : ان هاتين صامتا عما احل اللّٰه لهما وأفطرتا على ما حرم اللّٰه عليهما، جلست احداهما الى الأخرى فجعلتا تأكلان من لحوم الناس. كذا فى الترغيب …"
