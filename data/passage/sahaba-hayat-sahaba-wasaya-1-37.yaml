text: "… الشعبى عن الجزل عن امرأة سلمانا بقيرة انه لما حضرته الوفاة - يعنى سلمان - دعانى وهو فى علية له لها اربعة ابواب فقال: افتحى هذه الابواب يا بقيرة! فان لى اليوم زوارا لا ادرى من اى هذه الأبواب يدخلون …"
