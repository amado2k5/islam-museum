label: { ar: "سنن ابن ماجه 1398 — محو السيئات وحط الخطايا", en: "Sunan Ibn Majah 1398 — bad deeds erased and sins shed", ur: "سنن ابن ماجہ 1398 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… اللَّهِ بْنِ مَسْعُودٍ، أَنَّ رَجُلاً، أَصَابَ مِنِ امْرَأَةٍ يَعْنِي مَا دُونَ الْفَاحِشَةِ فَلاَ أَدْرِي مَا بَلَغَ غَيْرَ أَنَّهُ دُونَ الزِّنَا فَأَتَى النَّبِيَّ ـ فَذَكَرَ ذَلِكَ لَهُ فَأَنْزَلَ اللَّهُ سُبْحَانَهُ {أَقِمِ الصَّلاَةَ طَرَفَىِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ذَلِكَ ذِكْرَى لِلذَّاكِرِينَ} فَقَالَ يَا رَسُولَ اللَّهِ أَلِي هَذِهِ قَالَ \" لِمَنْ أَخَذَ بِهَا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1398، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1398 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1398، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
