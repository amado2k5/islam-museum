text: "… على الندب على ما سيقال في حد الواجب والمندوب إليه، أو يتوقف حتى يدل الدليل على أحدهما ؟ فيه بين العلماء خلاف مذكور في كتب أصول الفقه. وكذلك الحال في صيغ النهي هل تدل على الكراهية أو التحريم، أو لا …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 3، ص 24، يرد فيه ذكر الواجب، والمندوب، والكراهة، والتحريم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 3, p. 24, whose wording mentions the obligatory (wajib), the recommended (mandub), dislike (karaha), forbidding (tahrim), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 3، ص 24 کا اقتباس جس میں واجب، مندوب، کراہت، تحریم، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 3, p. 24, dont le texte mentionne l'obligatoire (wajib), le recommandé (mandub), la réprobation (karaha), l'interdiction (tahrim), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 3, p. 24, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mandub), la reprobación (karaha), la prohibición (tahrim), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Rüşd'ün *Bidayat al-Mujtahid* adlı eserinin 3. cildinin 24. sayfasından, farz, müstehap, mekruh, haram ve müstehap amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, itaat amelleri, müstehap ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Bidayat al-Mujtahid* karya Ibn Rushd, Jilid 3, halaman 24, yang menyebutkan amalan wajib, anjuran, makruh, haram, dan yang diinginkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
