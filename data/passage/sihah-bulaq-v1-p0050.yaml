text: |-
  دجع)
  0g١
  من المربعين ومن آزل * اذاجنه الليل كالناحط
  وفى الحديث أغبوا فى عيادة المريض وأربعوا الا أن يكون مغ_لوباق وله وأربعوا أى دعوه
  يومين وأتوه اليوم الثالث وناقة مر بع تنتج فى الربيع فان كان ذلت من عادتها فهى مرباع
  قال الاصمى المرباع من النوق التى تلد فى أول النتاج والمربع التى ولدهامعها وهوربع
  والمرابيع الامطار التى تجى فى أول الربيع قال لبيديصف الديار
  رزقت مرابيع النجوم وصابها • ودق الرواعد جودها فرهامها
  وعن بالنجوم الانواء والمرباع ما كان باخذه الرئيس وهوربع المغتم قال ابن عنمة الضبي ١
  لث المرباع منها والصفايا * وحكمك والنشيطة والفضول
  والاربعاء من الايام وقد حكى عن بعض بنى أسدفتح الياءفيه والجمع أربعاوات واليربوع
  واحد البرابيع والياء زائدة لانه ليس فى كلامهم فعلول وأرض مربعة ذات يرابيع ويرابيع
  المتزلمانه واحد ها يربوع ويربوع أيضا أبو حى من عيم وهويربوع بن حنظلة بن مالك بن عمرو
  ابن تميم و يربوع أيضا أبوبطن من مرة وهو يربوع بن غيظ بن مرة بن عوف بن سعدين ذبيان
  منهسم الحرث بن ظالم اليربوعى المرى وفى عقيل ربيعتان ربيعة بن عقيل وهو أبوانلخلعاء
  وربيعة بن عاهى بن عيل وهو أبو الابرص وقحافة وعرعرة وقرة وهماينسبان الربيعتين
  وفى تميم ربيعتان الكبرى وهور بيعة بن مالث بن زيد مناة بن تميم ويلقب ربيعة الجوع وربيعة
  الصفرى وهور بيعة بن حنظ-له بن مالك وربيعة أبوسى من هوازن وهو دبيعة بن عامرين
  صعصعة وهم بنو مجدو مجداسم أمهم نسبوا اليها ⁦(رقع)⁩. رتعت الماشية تزتع دبوعاأى
  أكات ماشاءت ويقال خرجنانر تع ونلعب أى ننعم ونلهو وابل رتاع جمع رائع مثل نيام جمع
  مائم وقوم راتعون والموضع مرقع وأرقع ابله فرتعت وقوم مر تعون وأرتع الغيث اى أنبت
  ما ترتع فيه الابل فع الرفع بالتصريك الطمع والحوص الشديد وقد رئع بالكسرينع
  رئمافه ورائع ورفع ⁦( رجع)⁩ رجع بنفسه رجوعا ور جعه غيره رجعا وهذيل تقول
  أرجعه غسيره وقوله تعالى يرجع بعضهم الى بعض القول أى يتلاومون والرجعي الرجوع
  تقول أرسلت اليك فاجا نى رجعى رسالتى أى مرجوعها وكذلك المرجع ومنه قوله تعالى
  ثم الى ربكم مرجعكم وهو شاذلات المصادر من فعل يفعل انماتكون بالفتح وفلان يوْمن:
  بالرجعة أى بالرجوع الى الدنيا بعد الموت وقواهم هل جاءرجعة كتابك أى جوابه وله على
  امر أنه رجعة ورجعة أيضاوالفتح أفصح ويقال ما كان من مرجوع فلان عليك أى من
  مر دوده وجوابه والرجعة الناقة تباع ويشترى بتمنها مثلها فالثانية راجعة ورجعة وقد
  ارتجعتها ورجعتها ورجعتها بقال باع فلان ابله فارتجع منهارجعة صالحة بالكسراذ اصرف
  أتمانها فيما يعود عليه بالعائدة الصالحة وكذلك الرجعة فى الصدقة اذا وجبت على رب المال
  أسنان فأخذ المصدق مكانها أسفانا فوقها اودونها واتان راجع وناقة راجع اذا كانت تشول
  بذنبها وتجمع قطر بها وتوزع يبولها فيظن ان بهاحلاثم تخلف وقد رجعت ترجع وجاعا
  ونوق رواجع والرجاع أيضار جوع الطير بعدقطاعها والراجع المرأة؟ وت زوجها فترجع
  الى أهلها وأما المطلقة فهى المردودة والرجع المطرقال اللّٰه تعالى والسماء ذات الرجع
  والربع الرعى فى الخصب ومئة
  قولهم القيد والرتعة ومعنى
  الربعة الخصبع
