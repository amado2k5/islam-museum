text: "وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، قَالَ لَمَّا كَانَ يَوْمُ الْخَنْدَقِ كُنْتُ أَنَا وَعُمَرُ بْنُ أَبِي سَلَمَةَ فِي الأُطُمِ الَّذِي فِيهِ النِّسْوَةُ يَعْنِي نِسْوَةَ النَّبِيِّ وَسَاقَ الْحَدِيثَ بِمَعْنَى حَدِيثِ ابْنِ مُسْهِرٍ فِي هَذَا الإِسْنَادِ وَلَمْ يَذْكُرْ عَبْدَ اللَّهِ بْنَ عُرْوَةَ فِي الْحَدِيثِ وَلَكِنْ أَدْرَجَ الْقِصَّةَ فِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6246، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6246 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6246، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
