summary:
  ar: "القسم 23 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجهاد عن رسول الله»، ويضم فيها النصوص من 1670 إلى 1719 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 23 of Jami' al-Tirmidhi (The Book on Jihad) in the division of the open hadith dataset the museum took its reports from: reports 1670 to 1719 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 23، عنوان «کتاب الجہاد عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1670 تا 1719۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 23 de Jami' al-Tirmidhi (El Libro de la Yihad) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1670 al 1719, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 23 de Jami' al-Tirmidhi (Le Livre du Jihad), qui comprend les hadiths 1670 à 1719 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
