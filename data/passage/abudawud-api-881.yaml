label: { ar: "سنن أبي داود 881 — الأب والأبوة", en: "Sunan Abi Dawud 881 — the father and fatherhood", ur: "سنن ابی داؤد 881 — باپ اور والدیت" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ دَاوُدَ، عَنِ ابْنِ أَبِي لَيْلَى، عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ أَبِيهِ، قَالَ صَلَّيْتُ إِلَى جَنْبِ رَسُولِ اللَّهِ فِي صَلاَةِ تَطَوُّعٍ فَسَمِعْتُهُ يَقُولُ \" أَعُوذُ بِاللَّهِ مِنَ النَّارِ وَيْلٌ لأَهْلِ النَّارِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 881، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 881 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 881، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
