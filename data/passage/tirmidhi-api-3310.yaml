label: { ar: "جامع الترمذي 3310 — الأب والأبوة", en: "Jami' al-Tirmidhi 3310 — the father and fatherhood", ur: "جامع ترمذی 3310 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3310 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3310 — le père et la paternité", tr: "Cami' el-Tirmizi 3310 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3310 — Ayah dan Peran Ayah" }
text: "… لَتَنَاوَلَهُ رِجَالٌ مِنْ هَؤُلاَءِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ وَقَدْ رُوِيَ هَذَا الْحَدِيثُ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ مِنْ غَيْرِ وَجْهٍ. وَعَبْدُ اللَّهِ بْنُ جَعْفَرٍ هُوَ وَالِدُ عَلِيِّ بْنِ الْمَدِينِيِّ ضَعَّفَهُ يَحْيَى بْنُ مَعِينٍ. ثَوْرُ بْنُ زَيْدٍ مَدَنِيٌّ وَثَوْرُ بْنُ يَزِيدَ شَامِيٌّ وَأَبُو الْغَيْثِ اسْمُهُ سَالِمٌ مَوْلَى عَبْدِ اللَّهِ بْنِ مُطِيعٍ مَدَنِيٌّ ثِقَةٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3310، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3310 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3310، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3310 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3310 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le navigateur « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
  tr: "Cami' el-Tirmizi'de yer alan 3310 numaralı hadiste baba ve babalık kavramından bahsedilir. Araştırmacı, bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3310, menyebutkan tentang ayah dan peran ayah. Peneliti tentang peran ayah dalam Islam menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
