label: { ar: "الموطأ 600 — ابن شهاب مرسلاً: كان النبي وأبو بكر وعمر يمشون أمام الجنازة", en: "Muwatta 600" }
summary:
  ar: "أول حديث في باب المشي أمام الجنازة. يرويه مالك عن ابن شهاب مرسلاً، أن النبي وأبا بكر وعمر كانوا يمشون أمام الجنازة، والخلفاء بعدهم، وعبد الله بن عمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني ولم يذكروا أبا بكر وعمر، وينقل عن ابن عبد البر (التمهيد 2/83–85) أنه مرسل في الموطأ، وأن قوماً وصلوه عن مالك، والصحيح الإرسال، لكن وصله جماعة من ثقات أصحاب ابن شهاب كابن عيينة ومعمر وموسى بن عقبة من حديث ابن عمر. ويضيف المحقق أن حديث ابن عمر الموصول عند أحمد وأبي داود (3179) والترمذي (1007 و1008) وابن ماجة (1482) والنسائي وابن حبان، وأن الترمذي نقل أن أهل الحديث كلهم يرون المرسل أصح، وأن ابن المبارك قال إن حديث الزهري المرسل أصح من حديث ابن عيينة، ويرى المحقق أن نسبة الوصل إلى معمر فيها نظر لأنها من رواية يحيى بن اليمان وهو ضعيف عند المخالفة، وأن الصواب الإرسال. {cite:muwatta-maruf-1997 p.308} {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.310}"
