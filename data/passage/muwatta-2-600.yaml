label: { ar: "الموطأ 600 — ابن شهاب مرسلاً: كان النبي وأبو بكر وعمر يمشون أمام الجنازة", en: "Muwatta 600", es: "600 vatios", fr: "600 watts", ur: "600 واٹ", tr: "El-Muvatta 600 — İbn Şihab, mursal: Peygamber, Ebu Bekir ve Ömer cenaze alayının önünde yürürlerdi.", id: "Al-Muwatta 600 — Ibn Shihab, mursal: Nabi, Abu Bakar, dan Umar biasa berjalan di depan iring-iringan jenazah." }
summary:
  ar: "أول حديث في باب المشي أمام الجنازة. يرويه مالك عن ابن شهاب مرسلاً، أن النبي وأبا بكر وعمر كانوا يمشون أمام الجنازة، والخلفاء بعدهم، وعبد الله بن عمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني ولم يذكروا أبا بكر وعمر، وينقل عن ابن عبد البر ⁦(التمهيد 2/83–85)⁩ أنه مرسل في الموطأ، وأن قوماً وصلوه عن مالك، والصحيح الإرسال، لكن وصله جماعة من ثقات أصحاب ابن شهاب كابن عيينة ومعمر وموسى بن عقبة من حديث ابن عمر. ويضيف المحقق أن حديث ابن عمر الموصول عند أحمد وأبي داود (3179) والترمذي ⁦(1007 و1008)⁩ وابن ماجة (1482) والنسائي وابن حبان، وأن الترمذي نقل أن أهل الحديث كلهم يرون المرسل أصح، وأن ابن المبارك قال إن حديث الزهري المرسل أصح من حديث ابن عيينة، ويرى المحقق أن نسبة الوصل إلى معمر فيها نظر لأنها من رواية يحيى بن اليمان وهو ضعيف عند المخالفة، وأن الصواب الإرسال. {cite:muwatta-maruf-1997 p.308} {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.310}"
  tr: "Cenaze alayının önünde yürümek bölümündeki ilk hadis. Malik'in İbn Şihab'dan rivayet ettiği mursal hadiste, Peygamberimiz, Ebu Bekir ve Ömer'in, onlardan sonraki halifelerin ve Abdullah ibn Ömer'in cenaze alayının önünde yürüdükleri belirtilmiştir. Araştırmacı, bu hadisin Malik'ten Ebu Musab, Suveyd ve Şeybani tarafından da rivayet edildiğini, ancak Ebu Bekir ve Ömer'den bahsedilmediğini belirtmektedir. İbn Abdülberr'in (el-Temhid 2/83-85) bunun el-Muvatta'da mursal olduğunu ve bazı kişilerin bunu Malik'ten rivayetle bağladığını, doğru versiyonun ise mursal olduğunu söylediğini aktarmaktadır. Bununla birlikte, İbn Şihab'ın İbn Uyaynah, Ma'mar ve Musa ibn Ukbe gibi güvenilir sahabelerinden bir grup, bunu İbn Ömer'den rivayetle bağlamıştır. Araştırmacı, İbn Ömer'in bağlantılı hadisinin Ahmed, Ebu Davud (3179), Tirmizi (1007 ve 1008), İbn Majah (1482), Nesai ve İbn Hibban'ın hadis derlemelerinde bulunduğunu ekliyor. Tirmizi, tüm hadis âlimlerinin mursal hadisi daha sahih kabul ettiğini ve İbn Mübarek'in Zühri'nin mursal hadisinin İbn Uyaynah hadisinden daha sahih olduğunu belirttiğini aktarmıştır. Araştırmacı, bağlantılı hadisin Ma'mar'a isnat edilmesinin şüpheli olduğunu, çünkü bu hadisin diğer rivayetlerle çeliştiğinde zayıf kabul edilen Yahya ibn el-Yaman tarafından rivayet edildiğini ve doğru versiyonun mursal olan olduğunu düşünüyor. {cite:muwatta-maruf-1997 s.308} {cite:muwatta-maruf-1997 s.309} {cite:muwatta-maruf-1997 s.310}"
  id: "Hadits pertama dalam bab ini adalah tentang berjalan di depan iring-iringan jenazah. Diriwayatkan oleh Malik dari Ibnu Shihab, dalam hadits mursal, bahwa Nabi, Abu Bakar, dan Umar biasa berjalan di depan iring-iringan jenazah, demikian pula para khalifah setelah mereka, dan Abdullah ibn Umar. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, dan al-Shaybani, tetapi mereka tidak menyebutkan Abu Bakar dan Umar. Ia mengutip Ibnu Abd al-Barr (al-Tamhid 2/83-85) yang mengatakan bahwa hadits ini mursal dalam al-Muwatta, dan bahwa sebagian orang menghubungkannya dari Malik, dan versi yang benar adalah mursal. Namun, sekelompok sahabat Ibnu Shihab yang terpercaya, seperti Ibnu Uyaynah, Ma'mar, dan Musa ibn Uqbah, menghubungkannya dari Ibnu Umar. Peneliti menambahkan bahwa hadits terkait dari Ibnu Umar ditemukan dalam koleksi Ahmad, Abu Dawud (3179), al-Tirmidhi (1007 dan 1008), Ibnu Majah (1482), al-Nasa'i, dan Ibnu Hibban. Al-Tirmidhi melaporkan bahwa semua ulama hadits menganggap hadits mursal lebih otentik, dan bahwa Ibnu al-Mubarak menyatakan bahwa hadits mursal al-Zuhri lebih otentik daripada hadits Ibnu Uyaynah. Peneliti percaya bahwa mengaitkan hadits terkait kepada Ma'mar patut dipertanyakan karena diriwayatkan oleh Yahya ibn al-Yaman, yang dianggap lemah ketika bertentangan dengan riwayat lain, dan bahwa versi yang benar adalah versi mursal. {cite:muwatta-maruf-1997 hal.308} {cite:muwatta-maruf-1997 hal.309} {cite:muwatta-maruf-1997 hal.310}"
