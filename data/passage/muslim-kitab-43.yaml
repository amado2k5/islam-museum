label:
  ar: "صحيح مسلم، كتاب الفضائل"
  en: "Sahih Muslim, Book 43: The Book of Virtues"
  ur: "صحیح مسلم، کتاب الفضائل"
  es: "Sahih Muslim, Libro 43: El Libro de las Virtudes"
  fr: "Sahih Muslim, Livre 43: Le Livre des Vertus"
summary:
  ar: "القسم 43 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفضائل»، ويضم فيها النصوص من 384 إلى 6168 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 43 of Sahih Muslim (The Book of Virtues) in the division of the open hadith dataset the museum took its reports from: reports 384 to 6168 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 43، عنوان «کتاب الفضائل»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 384 تا 6168۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 43 de Sahih Muslim (El Libro de las Virtudes) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 384 al 6168, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des Vertus), dans le recueil ouvert Sahih Muslim (les hadiths 384 à 6168). Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
