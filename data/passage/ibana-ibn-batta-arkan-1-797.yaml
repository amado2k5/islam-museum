text: "… المثنى، قال: حدثنا محمد بن جعفر، قال: حدثنا شعبة، عن أبي جمرة، عن ابن عباس أن وفد عبد القيس أتوا النبي علي فأمرهم بأربع ونهاهم عن أربع: أمرهم بالإيمان بالله وحده وقال: هل تدرون ما الإيمان؟ قالوا : اللّٰه ورسوله …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 797، يذكر السؤال عن الإيمان وجوابه، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 797, that mentions the question about faith and its answer, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 797 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
