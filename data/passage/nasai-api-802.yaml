label: { ar: "سنن النسائي 802 — اليتيم وفقد الأب", en: "Sunan al-Nasa'i 802 — the orphan and the father lost", ur: "سنن نسائی 802 — یتیم اور باپ کی موت", es: "Sunan al-Nasa'i 802 — El huérfano y el padre perdido" }
text: "أَخْبَرَنَا سُوَيْدُ بْنُ نَصْرٍ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، عَنْ سُلَيْمَانَ بْنِ الْمُغِيرَةِ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ، قَالَ دَخَلَ عَلَيْنَا رَسُولُ اللَّهِ وَمَا هُوَ إِلاَّ أَنَا وَأُمِّي وَالْيَتِيمُ وَأُمُّ حَرَامٍ خَالَتِي فَقَالَ \" قُومُوا فَلأُصَلِّيَ بِكُمْ \". قَالَ فِي غَيْرِ وَقْتِ صَلاَةٍ - قَالَ - فَصَلَّى بِنَا."
summary:
  ar: "حديث في سنن النسائي، رقم 802، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 802 (The Book of Leading the Prayer (Al-Imamah)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 802، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 802 (El Libro de la Oración (Al-Imamah)), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
