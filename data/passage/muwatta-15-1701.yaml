label: { ar: "الموطأ 1701 — مالك: الحر يطلق الأمة ثلاثا وتعتد حيضتين، والعبد يطلق الحرة تطليقتين وتعتد ثلاثة قروء", en: "Muwatta 1701", es: "Muwatta 1701", fr: "Muwatta 1701", ur: "موطا 1701", tr: "El-Muvatta 1701 — Malik: Bir hür erkek bir kadın köleyi üç defa boşadığında, kadın iki adet adet döngüsü kadar bekleme süresine riayet eder. Bir köle bir hür kadını iki defa boşadığında ise, kadın üç adet adet döngüsü kadar bekleme süresine riayet eder." }
summary:
  ar: "يقول مالك والحر يطلق الأمة ثلاثا، وتعتد حيضتين، والعبد يطلق الحرة تطليقتين، وتعتد ثلاثة قروء. {cite:muwatta-maruf-1997 p.95}"
  tr: "Malik şöyle dedi: Özgür bir erkek bir kadın köleyi üç kez boşadığında, kadın iki adet adet döngüsü kadar bekleme süresine riayet eder. Bir köle özgür bir kadını iki kez boşadığında ise, kadın üç adet adet döngüsü kadar bekleme süresine riayet eder. {cite:muwatta-maruf-1997 s.95}"
  id: "Malik berkata: Seorang pria merdeka menceraikan seorang budak perempuan tiga kali, dan dia menjalani masa iddah selama dua siklus menstruasi. Seorang budak menceraikan seorang perempuan merdeka dua kali, dan dia menjalani masa iddah selama tiga siklus menstruasi. {cite:muwatta-maruf-1997 p.95}"
