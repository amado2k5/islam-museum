text: "… يرى بأساً أن يجلس أهل الكتاب في المسجد. - حدثنا عَبّاد بن عَوَّام عن حُصين قال: كتب عمر بن عَبْد العزيز: لا يجلس قاضياً في مسجد دمشق يدخل عليه اليهودي والنصراني فيه. - حدثنا هاشم بن القاسم عن محمد بن …"
