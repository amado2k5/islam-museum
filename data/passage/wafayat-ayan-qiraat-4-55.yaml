text: "… نفسه من لفظ والده فى ليله السبت الخامس والعشير ين من شهر رمضان سن أحدى وخسين وسعمائة بدمشق وحفظ القرآب نسنة أربع وستين وصلى به سنة مس وستين وسمع الحديث من جاعة وأحرد القراآت على بعض الشبوح وجع السعة فى …"
