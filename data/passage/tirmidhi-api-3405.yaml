text: "حَدَّثَنَا صَالِحُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَبِي لُبَابَةَ، قَالَ قَالَتْ عَائِشَةُا كَانَ النَّبِيُّ لاَ يَنَامُ حَتَّى يَقْرَأَ الزُّمَرَ وَبَنِي إِسْرَائِيلَ. أَخْبَرَنِي مُحَمَّدُ بْنُ إِسْمَاعِيلَ قَالَ أَبُو لُبَابَةَ هَذَا اسْمُهُ مَرْوَانُ مَوْلَى عَبْدِ الرَّحْمَنِ بْنِ زِيَادٍ وَسَمِعَ مِنْ عَائِشَةَ سَمِعَ مِنْهُ حَمَّادُ بْنُ زَيْدٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3405، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3405 (Chapters on Supplication), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3405، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
