label: { ar: "الموطأ 274 — ثعلبة بن أبي مالك: خروج الإمام يقطع الصلاة وكلامه يقطع الكلام", en: "Muwatta 274" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن ثعلبة بن أبي مالك القرظي، في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب: كانوا في زمان عمر بن الخطاب يصلون يوم الجمعة حتى يخرج عمر، فإذا خرج وجلس على المنبر وأذّن المؤذنون جلسوا يتحدثون، فإذا سكت المؤذنون وقام عمر يخطب أنصتوا فلم يتكلم منهم أحد؛ وقال ابن شهاب: فخروج الإمام يقطع الصلاة وكلامه يقطع الكلام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.160}"
