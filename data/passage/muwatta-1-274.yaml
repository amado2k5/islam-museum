label: { ar: "الموطأ 274 — ثعلبة بن أبي مالك: خروج الإمام يقطع الصلاة وكلامه يقطع الكلام", en: "Muwatta 274", es: "Muwatta 274", fr: "Muwatta 274", ur: "موطا 274", tr: "Al-Muwatta 274 — Tha’labah ibn Abi Malik: İmamın ayrılışı namazı bölüyor, konuşması da sohbeti bölüyor.", id: "Al-Muwatta 274 — Tha’labah ibn Abi Malik: Kepergian Imam mengganggu salat, dan ucapannya mengganggu percakapan." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن ثعلبة بن أبي مالك القرظي، في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب: كانوا في زمان عمر بن الخطاب يصلون يوم الجمعة حتى يخرج عمر، فإذا خرج وجلس على المنبر وأذّن المؤذنون جلسوا يتحدثون، فإذا سكت المؤذنون وقام عمر يخطب أنصتوا فلم يتكلم منهم أحد؛ وقال ابن شهاب: فخروج الإمام يقطع الصلاة وكلامه يقطع الكلام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.160}"
  tr: "Malik, imamın hutbe okuduğu Cuma günleri dikkatle dinlemeye dair rivayetler bölümünde, İbn Şihab'dan, o da Tha'labah ibn Abi Malik el-Kurazi'den naklettiği bir rivayetle şöyle aktarmıştır: Ömer ibn el-Hattab zamanında, Ömer dışarı çıkana kadar Cuma namazı kılarlardı. Ömer dışarı çıkıp minbere oturduğunda ve müezzinler ezan okuduğunda, oturup konuşurlardı. Müezzinler bitirip Ömer hutbe okumaya başladığında ise dikkatle dinlerlerdi ve hiçbiri konuşmazdı. İbn Şihab şöyle demiştir: İmamın dışarı çıkması namazı böler, konuşması da sohbeti böler. Editör, bunun Malik'ten Ebu Musab, Suveyd ve Muhammed ibn el-Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.160}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang juga dari Tha'labah ibn Abi Malik al-Qurazi, dalam bab tentang apa yang diriwayatkan mengenai mendengarkan dengan saksama pada hari Jumat ketika imam menyampaikan khutbah: Pada masa Umar ibn al-Khattab, mereka biasa shalat Jumat sampai Umar keluar. Ketika ia keluar dan duduk di mimbar, dan muazin mengumandangkan adzan, mereka akan duduk dan berbicara. Ketika muazin selesai dan Umar berdiri untuk menyampaikan khutbah, mereka akan mendengarkan dengan saksama, dan tidak seorang pun dari mereka berbicara. Ibnu Shihab berkata: Keluarnya imam mengganggu shalat, dan bicaranya mengganggu percakapan. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.160}"
