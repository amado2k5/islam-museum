label: { ar: "جامع الترمذي 965 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Jami' al-Tirmidhi 965 — ranks raised; bad deeds erased and sins shed", ur: "جامع ترمذی 965 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Jami' al-Tirmidhi 965 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Jami' al-Tirmidhi 965 — les rangs sont élevés; les mauvaises actions sont effacées et les péchés sont pardonnés", tr: "Cami' el-Tirmizi 965 — Mertebeleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Jami' al-Tirmidhi 965 — Menaikkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "… عَنِ الأَسْوَدِ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" لاَ يُصِيبُ الْمُؤْمِنَ شَوْكَةٌ فَمَا فَوْقَهَا إِلاَّ رَفَعَهُ اللَّهُ بِهَا دَرَجَةً وَحَطَّ عَنْهُ بِهَا خَطِيئَةً \". قَالَ وَفِي الْبَابِ عَنْ سَعْدِ بْنِ أَبِي وَقَّاصٍ وَأَبِي عُبَيْدَةَ بْنِ الْجَرَّاحِ وَأَبِي هُرَيْرَةَ وَأَبِي أُمَامَةَ وَأَبِي سَعِيدٍ وَأَنَسٍ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو وَأَسَدِ بْنِ كُرْزٍ وَجَابِرِ بْنِ عَبْدِ اللَّهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 965، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 965 (The Book on Jana''iz (Funerals)), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 965، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 965 (El Libro de los Funerales), habla de ascensos de rango, borrado de malas acciones y perdón de pecados. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un récit du Jami' al-Tirmidhi, n° 965 (Livre des funérailles), évoque l'élévation de grade, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou pèsent un acte."
  tr: "Cami' el-Tirmizi'de 965 numaralı hadis, derecelerin yükseltilmesinden, günahların silinmesinden ve zulümlerin giderilmesinden bahseder. Bu hadis, iyi ve kötü ameller listesiyle birlikte, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 965, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
