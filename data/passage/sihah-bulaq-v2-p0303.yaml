text: |-
  ١ ف نسبخة زيادة الراجز
  وأول البين
  لاهمَ انّ الحرث ين جهم
  ٢٨٤
  •⁦(دم)⁩
  شرجيل قال الراج
  أندت من حيات بهل كشمين • صلَ مفا داهية درخين
  ( درهم الدرهم فارسى" معرب وكسرالهاءلغة وربما قالوادرهام قال الشاعر
  لوأن عندى ماتنى درهام * لإازفى آفاقها خاتاى.
  وجع الدرهم دراهم وجمع الدرهام دراهيم وقال
  تنقى يداها الحصى فى كل هاجرة • نقى الدراهيم تتقاد الصياريف
  وشيخ مدرهمّ أى مسن وقدادرهمّ ادرهما ما أى ستط من السكبر وقال القلاخ
  أنا التلاخ فى بغائى مقسما * أقسمت لا أسأم حتى يسأما • ويدرهم هرما وأهرما
  ⁦(دسم)⁩ الدسم معروف تقول منه دسم الشى بالكسر وتدسيم الشئ جعل الدسم علي
  ريقال أيضادسم المطر الارض بلها ولم يسبالغ والدسمة الدنى"مسن الرجال وثداب دسم وسنذ
  وقال ١ * أوذم جافى ثياب دسم * والدسام بالكسر مايستبه الإذن والجرح ونحوذلك
  تقول منه دسمته أدسمه بالضم دسما وقال * اذا أرد نادسمه تنفقا» والدسام السدادوهو
  ما يستبه رأس القارورة وتحمرها والديسم ولد الدب وقلت لابى الغوث بقال انه واد الذئب
  من الكابة فقال ماهو الاواد الدب والديسم نسات والديسمة الذرّة ودسم الاز من-ل طسم
  ⁦( دعم)⁩ - دعمت الشى دعما والدعامة عماد البيت وقد اد عمت اذا اتكأت عليها وهو
  افتعلت منسه ويسمى السيد الدعلمة والدعامتان خشبتا البكرة فان كانتا من طين فهما
  زرتوقان وقال • نزعت نزعازعزع الدعامه « ولادعم بفلان اذ الم تكن به قوّة ولا سمن وقال
  لادهم بى لكن بليلى دعم • جارية فى وركيها شهم
  ودعمىّ قبيلة وهودعمى بن جديلة بن أسدين ربيعة بن تزارين معد (دغم». دغمهم الحتر
  ودنمهم أيضابالكسر وأدغمهم أى غشيهم والادغم من اخيل الذى لون وجهه وما يلى جافله
  ضرب الى السواد مخالفاللون سارجده وهو الذى تسميه الاعاجم ديزج والانى دهماء بينا
  الدغم عن الاصمعىّ والشادعماء وفى الممل الذتب أدغم لان الذئب ولغ أولم يلسغ فالدغمة
  لازمة له لات الذئاب دغم فربما اتهم بالواوغ وهو جائع يضرب ه ذامثلا لمن يغبط بمالم ينله ؟
  والدغمان بالضم من الرجال الاسود وأدغمت الفرس اللجام اذا أدخلته فى فيه ومنه ادغام
  الحروف يق ال أدغمت الحرف واذغمته على اقتعلته والدغم كسر الانف الى باطنه هشما
  قم دقم فاممشل دمق على القلب أى كسر أسناته لم الادلم من الرجال
  والهيز الاسود وقدادلاتم الرجل والحارادليماما وأبودلامة كفية رحل والديلم جبل من
  الناس والديلم الداهية وأنشد أبوزيديصف سهما
  أنعت أعبارارعين كيرا • مستبطنات قصباضمورا
  يحملن عنقاء وعنة فيرا • والدلو والدي-لم والزفيرا
  وكلها دواه وأعيار النصول هى الناتنة فى وسطها ورعيهنّ كبر الحداد كونهن فى النارثم ركين
  فى قصب السهام والديلم فى قول عنترة
  شربت بعماء الدحرضين فأصبحت * زوراه تنفر عن حياض الديلم
  مقال
