text: "… : أَخْبَرَنَا اللَّيْثُ عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ، عَنْ رَبِيعَةَ بْنِ يَزِيدَ، عَنْ أَبي إِدْرِيسَ الخَوْلَانِيَّ، عَنْ يَزِيدَ بْنِ عُمَيْرَةَ قَالَ : لَمَّا حَضَرَ مُعَاذَ بْنَ جَبَلِ المَوْتُ قِيلَ لَهُ: يَا أَبَا عَبْدِ الرَّحْمْنِ! أَوْصِنَا قَالَ: أَجْلِسُونِي فَقَالَ: إِنَّ العِلْمَ والإِيمَانَ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 863، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
