text: "… : أَخْبَرَنَا اللَّيْثُ عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ، عَنْ رَبِيعَةَ بْنِ يَزِيدَ، عَنْ أَبي إِدْرِيسَ الخَوْلَانِيَّ، عَنْ يَزِيدَ بْنِ عُمَيْرَةَ قَالَ : لَمَّا حَضَرَ مُعَاذَ بْنَ جَبَلِ المَوْتُ قِيلَ لَهُ: يَا أَبَا عَبْدِ الرَّحْمْنِ! أَوْصِنَا قَالَ: أَجْلِسُونِي فَقَالَ: إِنَّ العِلْمَ والإِيمَانَ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 863، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 863, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 863 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 1, pág. 863, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Jami' al-Tirmidhi, volume 1, page 863, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Cami' el-Tirmizi'nin 1. cildinin 863. sayfasından, vasiyetname ve ölüm anını anlatan bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 1, halaman 863, yang menyebutkan wasiat terakhir dan saat kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
