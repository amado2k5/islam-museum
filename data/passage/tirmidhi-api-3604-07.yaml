label: { ar: "جامع الترمذي 3604.07 — الأب والأبوة", en: "Jami' al-Tirmidhi 3604.07 — the father and fatherhood", ur: "جامع ترمذی 3604.07 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3604.07 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3604.07 — le père et la paternité" }
text: "حَدَّثَنَا يَحْيَى بْنُ مُوسَى، أَخْبَرَنَا عَمْرُو بْنُ عَوْنٍ، أَخْبَرَنَا أَبُو عَوَانَةَ، عَنْ عُمَرَ بْنِ أَبِي سَلَمَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" لِيَنْظُرَنَّ أَحَدُكُمْ مَا الَّذِي يَتَمَنَّى فَإِنَّهُ لاَ يَدْرِي مَا يُكْتَبُ لَهُ مِنْ أُمْنِيَّتِهِ \". هَذَا حَدِيثٌ حَسَنٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3604.07، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3604.07 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3604.07، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3604.07 (Capítulos sobre la súplica), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3604.07 (Chapitres sur l'invocation), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
