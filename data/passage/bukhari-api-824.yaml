label: { ar: "صحيح البخاري 824 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 824 — the orphan and the father lost", ur: "صحیح بخاری 824 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 824 — El huérfano y el padre perdido" }
text: "… مَسْجِدِنَا هَذَا فَقَالَ إِنِّي لأُصَلِّي بِكُمْ، وَمَا أُرِيدُ الصَّلاَةَ، وَلَكِنْ أُرِيدُ أَنْ أُرِيَكُمْ كَيْفَ رَأَيْتُ النَّبِيَّ يُصَلِّي. قَالَ أَيُّوبُ فَقُلْتُ لأَبِي قِلاَبَةَ وَكَيْفَ كَانَتْ صَلاَتُهُ قَالَ مِثْلَ صَلاَةِ شَيْخِنَا هَذَا ـ يَعْنِي عَمْرَو بْنَ سَلِمَةَ ـ قَالَ أَيُّوبُ وَكَانَ ذَلِكَ الشَّيْخُ يُتِمُّ التَّكْبِيرَ، وَإِذَا رَفَعَ رَأْسَهُ عَنِ السَّجْدَةِ الثَّانِيَةِ جَلَسَ وَاعْتَمَدَ عَلَى الأَرْضِ، ثُمَّ قَامَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 824، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 824 (Call to Prayers (Adhaan)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 824، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 824 (Llamada a la oración (Adhan)), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
