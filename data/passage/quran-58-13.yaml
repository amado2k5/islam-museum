text: "ءَأَشْفَقْتُمْ أَن تُقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَـٰتٍ ۚ فَإِذْ لَمْ تَفْعَلُوا۟ وَتَابَ ٱللَّهُ عَلَيْكُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ"
text_search: "أأشفقتم أن تقدموا بين يدي نجواكم صدقات ۚ فإذ لم تفعلوا وتاب الله عليكم فأقيموا الصلاة وآتوا الزكاة وأطيعوا الله ورسوله ۚ والله خبير بما تعملون"
translations:
  en: { text: "Fear ye to offer alms before your conference? Then, when ye do it not and Allah hath forgiven you, establish worship and pay the poor-due and obey Allah and His messenger. And Allah is Aware of what ye do.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کیا تم اس سےکہ پیغمبر کے کان میں کوئی بات کہنے سے پہلے خیرات دیا کرو ڈر گئے؟ پھر جب تم نے (ایسا) نہ کیا اور خدا نے تمہیں معاف کردیا تو نماز پڑھتے اور زکوٰة دیتے رہو اور خدا اور اس کے رسول کی فرمانبرداری کرتے رہو۔ اور جو کچھ تم کرتے ہو خدا اس سے خبردار ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
