text: "… كمال المحبة الواجبة والمستحبة، ويستلزم ذلك الاجتهاد في التقرّب إليه بنوافل الطاعات على هذا الوجه وترك المحرَّمات والمكروهات على هذا الوجه أيضاً. وفي مراسيل الحسن، عن النَّبيِّ وَلِقِ قال : أرأيتُم لو كان لأحدكم عبدانِ، فكان أحدهما يُطيعُه إذا أمره، …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 197، يرد فيه ذكر الطاعات، والواجب، والمستحب، والنافلة والنوافل، والمكروه، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 197, whose wording mentions the acts of obedience, the obligatory (wajib), the recommended (mustahabb), the supererogatory (nafila), the disliked (makruh), the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 197 کا اقتباس جس میں طاعات، واجب، مستحب، نفل اور نوافل، مکروہ، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volume numérisé 2, p. 197, dont le texte mentionne les actes d'obéissance, l'obligatoire (wajib), le recommandé (mustahabb), le surérogatoire (nafila), le réprouvé (makruh), les choses interdites ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen digitalizado 2, p. 197, cuyo texto menciona los actos de obediencia, lo obligatorio (wajib), lo recomendado (mustahabb), lo supererogatorio (nafila), lo reprobado (makruh), las cosas prohibidas; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 197. sayfasından, itaat amelleri, farz amelleri, tavsiye edilen amelleri, nafile amelleri, mekruh amelleri ve haram amelleri (Allah tarafından haram kılınanlar dahil) ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz amelleri, itaat amelleri, tavsiye edilen amelleri, mekruh amelleri, haram amelleri ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 197, yang membahas tentang amalan ketaatan, amalan wajib, amalan anjuran, amalan sunnah, amalan makruh, dan amalan haram, termasuk amalan yang dilarang oleh Allah. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
