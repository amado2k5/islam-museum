text: |-
  *⁦(باب اللام)⁩
  ٢: ٣
  وقد تردى من أراط ملجفا * منها شماليل وما تلففا
  وذهب القوم شماليل اذا تفرّة واونوب شهاليل مثل شماطيط والمشمل سيف قصير يشتمل
  عليه الرجل أى يغطيه بثوبه والمشملة كساء يشتمل بهدون القطيفة والشمان الريح التى تهب
  -ن ناحية القطبّ وفيها خس لغات شمل بالتسكين وشمل بالتحريك وشمال وشمأل مهموز
  وشأمل مقلوب منه وربماجاء بتسديد اللام قال الزفيان ١
  فلمفه نكباء أوشمأل * والجمع شمالات قال جذيمة الابرش
  ربما أوفيت فى علم * ترفعن توبى شمالات
  فأدخل الذون الخفيفة فى الواجب ضرورة وشمائل أيضا على غير قياس كأنهم جعواشمالة
  مثل حالة وحائل قال أبو خواش
  تكاديداه تسلمان رداءه * من الجودلما استقبلته الشمائل
  وغدير مشمول تضربه ريح الشمال حتى يبرد ومنه قيل للخمر مشمولة اذا كانت باردة الطعم
  والنار مشمولة اذاهبت عليهاريح الشمال والشمول الهر واليد الشمال خلاف المين والجمع
  أشمل مثل أعنق وأذرع لانها مؤننة وشمائل أيضاء لى غير قياس قال اللّٰه تعالى عن اليمسين
  والشمائل والشمال أيضا اللخلق قال جوير *ومالومى أخى من شماليا• والجمع الشمائل وطه
  شمال كل طيريتشاءم به والشمال أيضا كالسكيس يجعل فيه ضرع الشاة وكذلك النخلة اذا
  شدّت أعذاقها بقطع الاكسبة لثلا تنفض تقول منه شملت الشاة أشملها شملا وشملت الريح
  أيضا تشمل شمولا أى تحوّلت شمالا وناقة شملة بالتشديد أى خفيفة وشملال وشمليل مثله وقد
  شمال شمللة اذا أسرع ومنسه قول امرئ القيس يصف فرسا
  كأنى بفتخا الجنا حين لقوة * ذفوف من العقبات طأطأت شملالى
  فال أبوعمر وشملالى أراديده الشمال قال والشملال والشمال سواء وأشمل القوم اذادخلوا
  فى ريح الشمال فان أردت أنها أصابتهم قلت شملوافهم مشمولون أبوزيد أشمل الفحل شوله
  اشمالا اذا ألقح النصف منها الى الثلنين فاذا ألقسها كلهاقيل أقها وأشمل فلان خراتفه اذا
  لقط ما عليها من الرطب الاقليلا واستمل بنوبه اذا تلفف واشتمال الصحاء أن يجلل جسده كاه
  بالكاء أوبالازار ( ردل الشمردل بالدال غير معجمة السريع من الابل
  وغير، قال الشاعر المساورين حند
  اذا قلت عودواعاد كل شمردل • أشم" من الفتيان جزل مواهبه
  وقال أبوزياد الكلابى الشمردلة الناقة الحسنة الهيلة الخلق حكاه عنه أبو عبيد شمعل.
  اشمعل القوم فى الطلب اشمعلالا اذا بادروافيه وتفرّقوا وقال أمية بن أبي الصلت
  ل داع بمكة مشمعل • وآخرفوق دارته بنادى
  وشمعلة اليهود قرامتهم والمشمعلّ أيضا النافة السريعسة وقد اشمعلت الناقة فهى مشمعلة
  قال ربيعة بن مضرّس الضوٱو
  كان هويهالما اشمعلت • هوى الطير تبتدر الايايا
  قال انخليل اشمعلت الابل اذامضت وتفرّقت مرجاونشاطا قال واشمعلت الغارة فى العدو
  والقطر عن متنبه هر معل
  قوله مضرّس فى بعض القسخ
  مقروم ١ه
