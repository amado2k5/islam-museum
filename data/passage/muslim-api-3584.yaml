label: { ar: "صحيح مسلم 3584 — ما حُرّم", en: "Sahih Muslim 3584 — what was made unlawful", ur: "صحیح مسلم 3584 — جو حرام کیا گیا", es: "Sahih Muslim 3584 — lo que se declaró ilícito", fr: "Sahih Muslim 3584 — ce qui a été déclaré illicite", tr: "Sahih Muslim 3584 — Haram Olan Şeyler", id: "Sahih Muslim 3584 — Apa yang dilarang" }
text: "… أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَلِيُّ بْنُ مُسْهِرٍ، عَنْ سَعِيدِ بْنِ أَبِي عَرُوبَةَ، كِلاَهُمَا عَنْ قَتَادَةَ، بِإِسْنَادِ هَمَّامٍ سَوَاءً غَيْرَ أَنَّ حَدِيثَ شُعْبَةَ انْتَهَى عِنْدَ قَوْلِهِ \" ابْنَةُ أَخِي مِنَ الرَّضَاعَةِ \". وَفِي حَدِيثِ سَعِيدٍ \" وَإِنَّهُ يَحْرُمُ مِنَ الرَّضَاعَةِ مَا يَحْرُمُ مِنَ النَّسَبِ \". وَفِي رِوَايَةِ بِشْرِ بْنِ عُمَرَ سَمِعْتُ جَابِرَ بْنَ زَيْدٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3584، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3584 (The Book of Suckling), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3584، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 3584 (El Libro de la Lactancia), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3584 (Le Livre de l'allaitement), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 3584 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram sözlüğünün bu bölümü, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3584, menyebutkan apa yang diharamkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
