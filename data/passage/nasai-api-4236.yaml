label: { ar: "سنن النسائي 4236 — ما حُرّم", en: "Sunan al-Nasa'i 4236 — what was made unlawful", ur: "سنن نسائی 4236 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 4236 — lo que se declaró ilícito" }
text: "… عَنِ ابْنِ أَبِي حَبِيبٍ، - يَعْنِي يَزِيدَ - عَنْ حَفْصِ بْنِ الْوَلِيدِ، عَنْ مُحَمَّدِ بْنِ مُسْلِمٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، حَدَّثَهُ أَنَّ ابْنَ عَبَّاسٍ حَدَّثَهُ قَالَ أَبْصَرَ رَسُولُ اللَّهِ شَاةً مَيِّتَةً لِمَوْلاَةٍ لِمَيْمُونَةَ وَكَانَتْ مِنَ الصَّدَقَةِ فَقَالَ \" لَوْ نَزَعُوا جِلْدَهَا فَانْتَفَعُوا بِهِ \". قَالُوا إِنَّهَا مَيْتَةٌ. قَالَ \" إِنَّمَا حُرِّمَ أَكْلُهَا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4236، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4236 (The Book of al-Fara' and al-'Atirah), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4236، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4236 (El Libro de al-Fara' y al-'Atirah), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
