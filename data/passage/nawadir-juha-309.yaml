text: "… دعيني أبكي مرضت امرأتُهُ، فكان كلَّما عاد من شغلِهِ، يومياً، يأتي إليها ويبكي فوق رأسها. فقالت له إحدى جاراته: لا تبتئس فلا بأس عليها، إن شاء اللَّهُ ستتعافى قريباً. فقال : أيتها السيدة، إنّي رجل ذو شغلٍ وأذهبُ صباحاً إلى …"
summary:
  ar: "قالت جارة لجحا لا تقلق وزوجته مريضة، فقال إنه لا عمل عنده الآن فليدعها تبكيه، إذ لن يبكيها أحد غيره. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  en: "As his wife lies sick, a neighbour tells Juha not to worry; Juha says he has no work now, so let him cry, since no one else will cry for her. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  ur: "جحا کی بیوی بیمار تھی، ایک پڑوسن نے اس سے کہا کہ فکر نہ کرو، تو جحا نے کہا کہ اب اس کے پاس کوئی کام نہیں، اس لیے اسے رو لینے دو، کیونکہ اس کے لیے اور کوئی نہیں روئے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  fr: "Alors que sa femme est malade, une voisine dit à Juha de ne pas s'inquiéter ; Juha répond qu'il n'a plus de travail maintenant, qu'on le laisse donc pleurer, puisque personne d'autre ne la pleurera. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  es: "Mientras su esposa está enferma, una vecina le dice a Juha que no se preocupe; Juha dice que ahora no tiene trabajo, así que lo deje llorar, ya que nadie más la llorará. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
  tr: "Komşusu Juha'ya endişelenmemesini, karısının hasta olduğunu söyledi. Juha ise şu an işi olmadığını, bu yüzden karısının kendisi için ağlaması gerektiğini, çünkü başka kimsenin onun için ağlamayacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 152}"
  id: "Seorang tetangga memberi tahu Juha agar tidak khawatir, istrinya sedang sakit. Juha menjawab bahwa dia sedang tidak bekerja sekarang, jadi biarkan istrinya menangisinya, karena tidak ada orang lain yang akan menangisinya. {cite:juha-nawadir-kubra-djuwaydi p. 152}"
