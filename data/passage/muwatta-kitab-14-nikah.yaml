label: { ar: "الموطأ، كتاب النكاح", en: "Muwatta, Book of Marriage (nikah)", es: "Muwatta, Libro del matrimonio (nikah)", fr: "Muwatta, Livre du Mariage (nikah)", ur: "موطا، نکاح کی کتاب ⁦(نکاح)⁩", tr: "Al-Muwatta, Evlilik Kitabı", id: "Al-Muwatta, Kitab Pernikahan" }
summary:
  ar: "كتاب النكاح، الكتاب الرابع عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 92 نصاً (1489–1580) في اثنين وعشرين باباً، من الصفحة 27 إلى الصفحة 58 من ملف PDF المجلد الثاني. يبدأ بالخطبة والاستئذان في النكاح، ثم الصداق وإرخاء الستور والمقام عند البكر والثيب، ثم ما لا يجوز من الشروط والمحلل، وما لا يجمع من النساء وملك اليمين، ونكاح الإماء والعبيد، والإحصان، والمتعة، ويختم بنكاح المشرك إذا أسلمت امرأته والوليمة. {cite:muwatta-maruf-1997 p.27} {cite:muwatta-maruf-1997 p.58}"
  en: "The Book of Marriage, fourteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 92 reports (1489–1580) in twenty-two babs, PDF pp. 27–58 of volume 2, from the proposal and the consent of the bride, through the dowry, the consummation, the forbidden combinations of women and slave-women, to the feast and the conversion of a husband or wife."
  es: "El Libro del Matrimonio, decimocuarto libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 92 informes (1489–1580) en veintidós babs, PDF pp. 27–58 del volumen 2, desde la propuesta y el consentimiento de la novia, pasando por la dote, la consumación, las combinaciones prohibidas de mujeres y esclavas, hasta el banquete y la conversión de un marido o una mujer."
  fr: "Le Livre du Mariage, quatorzième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 92 rapports (1489–1580) dans vingt-deux babs, PDF pp. 27–58 du volume 2, depuis la proposition et le consentement de la mariée, en passant par la dot, la consommation, les combinaisons interdites de femmes et d'esclaves, jusqu'au festin et à la conversion d'un mari ou d'une femme."
  ur: "شادی کی کتاب، موطا کی چودھویں کتاب یحییٰ بن یحییٰ کی تجدید میں ⁦(مطلوبہ معارف 1997)⁩، جلد 2: 92 رپورٹس (1489-1580) بائیس باب میں، پی ڈی ایف صفحہ 27-58 جلد 2، ضوابط اور ضوابط سے۔ عورتوں اور غلام عورتوں کے ممنوع امتزاج، دعوت اور شوہر یا بیوی کی تبدیلی۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği, El-Muvatta'nın on dördüncü kitabı olan Evlilik Kitabı, Beşar Awad Maruf'un (1997) ikinci cildinde, yirmi iki bölümden oluşan 92 metin (1489-1580) içermektedir ve ikinci cildin PDF dosyasının 27. sayfasından 58. sayfasına kadar uzanmaktadır. Kitap, vaaz ve evlilik izni istemeyle başlar, ardından mehir, perdelerin çekilmesi ve bakire ve daha önce evlenmiş bir kadınla birlikte kalma konularına değinir. Daha sonra, caiz olmayan durumları ve aracı kadını (kocası ölmeden önce boşanmış bir kadınla evlenen kadın), evlenilemeyecek kadın sayısını, köle sahipliğini, kadın ve erkek kölelerle evliliği, iffeti ve geçici evliliği (mut'ah) ele alır. Kitabın son bölümü ise, karısı İslam'a geçerse müşrik bir adamın evliliği ve düğün ziyafetidir. {cite:muwatta-maruf-1997 s.27} {cite:muwatta-maruf-1997 s.58}"
  id: "Kitab Pernikahan, kitab keempat belas dari Al-Muwatta, sebagaimana diriwayatkan oleh Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 92 teks (1489–1580) dalam dua puluh dua bab, dari halaman 27 hingga halaman 58 dari file PDF Jilid Dua. Kitab ini dimulai dengan khutbah dan meminta izin untuk menikah, kemudian mas kawin, pemasangan tirai, dan tinggal bersama seorang perawan dan seorang wanita yang telah menikah sebelumnya. Kemudian membahas syarat-syarat yang tidak diperbolehkan dan perantara (seorang wanita yang menikahi wanita yang bercerai sebelum kematian suaminya), jumlah wanita yang tidak boleh dinikahi, kepemilikan budak, pernikahan dengan budak perempuan dan laki-laki, kesucian, dan pernikahan sementara (mut'ah). Kitab ini diakhiri dengan pernikahan seorang musyrik jika istrinya masuk Islam dan pesta pernikahan. {kutip:muwatta-maruf-1997 hal.27} {kutip:muwatta-maruf-1997 hal.58}"
