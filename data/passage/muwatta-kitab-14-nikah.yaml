summary:
  ar: "كتاب النكاح، الكتاب الرابع عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 92 نصاً (1489–1580) في اثنين وعشرين باباً، من الصفحة 27 إلى الصفحة 58 من ملف PDF المجلد الثاني. يبدأ بالخطبة والاستئذان في النكاح، ثم الصداق وإرخاء الستور والمقام عند البكر والثيب، ثم ما لا يجوز من الشروط والمحلل، وما لا يجمع من النساء وملك اليمين، ونكاح الإماء والعبيد، والإحصان، والمتعة، ويختم بنكاح المشرك إذا أسلمت امرأته والوليمة. {cite:muwatta-maruf-1997 p.27} {cite:muwatta-maruf-1997 p.58}"
  en: "The Book of Marriage, fourteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 92 reports (1489–1580) in twenty-two babs, PDF pp. 27–58 of volume 2, from the proposal and the consent of the bride, through the dowry, the consummation, the forbidden combinations of women and slave-women, to the feast and the conversion of a husband or wife."
