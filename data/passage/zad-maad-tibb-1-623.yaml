text: "… واغتذائها به فوق تأثير الغِذاء الجسماني، واللَّه الموفق. فصل في هديه وَلِفِ في علاج العُذرة، وفي العلاج بالسّعوط ثبت عنه في الصحيحين أنه قال: خَيْرُ ما تَدَاوَيْتُم به الحِجَامَةُ، والقُسْطُ البَحْرِي، ولا تُعَذّبوا صِبْيَانَكُمْ بالغَمْزِ مِن العُذْرَة البخاري:، ومسلم: وفي …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 623، يذكر الحجامة، والقسط والعود الهندي، والقسط، واللدود والسعوط، وعلاج العذرة، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 623, that mentions cupping, costus (Indian aloeswood), costus, medicine given by the mouth-side or the nose, treating the throat ailment (al-udhra), seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 623 کا اقتباس جس میں حجامہ، قسط ہندی، قسط، لدود اور سعوط، گلے کی بیماری عذرہ کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 623, que menciona la ventosaterapia, el costus (madera de aloe de la India), el costus, la medicina administrada por vía oral o nasal, el tratamiento de la afección de la garganta (al-udhra) y la búsqueda de tratamiento; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 623, qui mentionne la ventousothérapie, le costus (bois d'aloès indien), le costus, la médecine administrée par voie buccale ou nasale, le traitement des maux de gorge (al-udhra), la recherche d'un traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 623. sayfasında hacamat, kostus ve Hint öd ağacı, kostus, sakinleştiriciler ve enfiye, bademcik iltihabı tedavisi ve ilaçtan bahsedilmektedir; bu metin, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 623, menyebutkan bekam, costus dan gaharu India, costus, obat penenang dan tembakau hisap, pengobatan radang amandel, dan obat-obatan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
