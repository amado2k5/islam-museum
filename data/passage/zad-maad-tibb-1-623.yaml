text: "… واغتذائها به فوق تأثير الغِذاء الجسماني، واللَّه الموفق. فصل في هديه وَلِفِ في علاج العُذرة، وفي العلاج بالسّعوط ثبت عنه في الصحيحين أنه قال: خَيْرُ ما تَدَاوَيْتُم به الحِجَامَةُ، والقُسْطُ البَحْرِي، ولا تُعَذّبوا صِبْيَانَكُمْ بالغَمْزِ مِن العُذْرَة البخاري:، ومسلم: وفي …"
