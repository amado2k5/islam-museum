text: "… ما أراه الله، فلمَّا اقتتلَ الناسُ قَاتَلَ حتَّى قُتِلَ؛ فكان رسولُ اللّٰه وليفي - فيما بلغني - يقول : مُخَيْريق خَيْرُ يَهُودَ وَقَبَضَ رسولُ اللّٰه وَالم أمواله، فعامَّةُ صدقات رسول الله لله بالمدينة منها. حديث صفية عن أبيها وعمها قال …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 241، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 241, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 241 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
