text: "… ما أراه الله، فلمَّا اقتتلَ الناسُ قَاتَلَ حتَّى قُتِلَ؛ فكان رسولُ اللّٰه وليفي - فيما بلغني - يقول : مُخَيْريق خَيْرُ يَهُودَ وَقَبَضَ رسولُ اللّٰه وَالم أمواله، فعامَّةُ صدقات رسول الله لله بالمدينة منها. حديث صفية عن أبيها وعمها قال …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 241، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 241, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 241 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de la Sira de Ibn Hisham, pág. 241, que menciona el lecho de muerte y las últimas horas, y lo que quedó tras de sí: patrimonio y herencia; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Un extrait de la Sira d'Ibn Hisham, p. 241, évoque un lit de mort et les dernières heures du défunt, ainsi que les biens et l'héritage laissés. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire Testaments Browser."
  tr: "İbn Hişam'ın Peygamber biyografisinden, 241. sayfada yer alan bir alıntı, ölüm anını, merhumun vefatını, geride bıraktığı mal varlığını ve mirasını anlatmaktadır; taranmış, makineyle okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi Nabi karya Ibnu Hisham, halaman 241, menyebutkan saat kematian dan wafatnya almarhum, serta harta dan warisan yang ditinggalkannya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
