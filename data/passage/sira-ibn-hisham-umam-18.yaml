text: "… حتى أدركوه، فقالوا: ما ينبغي أن يَمْلِكنا غيرك؛ إذ أرحتنا من هذا الخبيث. ملك ذي نواس فَمَلَّكُوهُ، واجتمعَتْ عليه حمير وقبائل اليمن، فكان آخِرَ ملوك حمير، وهو صاحب الأُخدُود، وتَسَمَّى يوسف، فأقام في ملكه زماناً. النصرانية بنجران : وبِنَجْرَان بقايا …"
