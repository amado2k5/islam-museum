label:
  ar: "الترمذي 3168 — يا آدم أخرج بعث النار"
  en: "Tirmidhi 3168 — Adam, bring out the party of the Fire"
  ur: "ترمذی 3168 — اے آدم، آگ والوں کا حصہ نکالو"
text: "أتدرون أى يوم ذلك . فقالوا الله ورسوله أعلم . قال ذلك يوم يقول الله لآدم ابعث بعث النار فقال يا رب وما بعث النار قال تسعمائة وتسعة وتسعون إلى النار وواحد إلى الجنة . قال فأنشأ المسلمون يبكون فقال …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3168: يا آدم أخرج بعث النار. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3168: Adam, bring out the party of the Fire. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3168: اے آدم، آگ والوں کا حصہ نکالو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
