label: { ar: "الموطأ 1155 — مالك: الراكب يقف بعرفة راكبا إلا أن يكون به أو بدابته علة", en: "Muwatta 1155", es: "Muwatta 1155", fr: "Muwatta 1155", ur: "موطا 1155", tr: "Al-Muwatta 1155 — Malik: Binici, kendisinde veya binek hayvanında bir rahatsızlık olmadığı sürece, Arafat'ta ayakta durabilir.", id: "Al-Muwatta 1155 — Malik: Penunggang kuda boleh berdiri di Arafat saat berkuda kecuali jika ia atau tunggangannya sakit." }
text: "بَل يَقفُ راكِباً"
summary:
  ar: "سئل مالك عن الوقوف بعرفة للراكب: أينزل أم يقف راكبا؟ فقال بل يقف راكبا، إلا أن يكون به أو بدابته علة، فالله أعذر بالعذر. {cite:muwatta-maruf-1997 p.523}"
  tr: "Malik'e Arafat'ta at üzerinde ayakta durmak hakkında soru soruldu: Atından inmeli mi yoksa ayakta mı durmalı? Şöyle dedi: \"Allah mazeretleri kabul eder, bu yüzden kendisi veya atı rahatsız olmadığı sürece ayakta durmalıdır.\" {cite:muwatta-maruf-1997 s.523}"
  id: "Malik ditanya tentang berdiri di Arafat sambil menunggang kuda: Haruskah ia turun dari kuda atau tetap menunggangi kuda? Dia menjawab: Sebaiknya ia tetap menunggangi kuda, kecuali jika ia atau kudanya sakit, karena Allah menerima alasan. {cite:muwatta-maruf-1997 p.523}"
