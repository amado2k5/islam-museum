label: { ar: "الموطأ 165 — ابن أم قيس يبول في حجر النبي فينضحه ولا يغسله", en: "Muwatta 165" }
text: "فدعا رسول الله بماء فنضحه ولم يغسله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن أم قيس بنت محصن، في باب ما جاء في بول الصبي: أتت بابن لها صغير لم يأكل الطعام إلى النبي، فأجلسه في حجره فبال على ثوبه، فدعا بماء فنضحه ولم يغسله. ويخرّجه المحقق عند البخاري (223) وأبي داود (374) والنسائي (1/157) وابن خزيمة (286) والدارمي والطبراني من طرق أصحاب مالك، ويحيل على التمهيد (9/108). {cite:muwatta-maruf-1997 p.109}"
