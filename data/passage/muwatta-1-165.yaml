label: { ar: "الموطأ 165 — ابن أم قيس يبول في حجر النبي فينضحه ولا يغسله", en: "Muwatta 165", es: "Muwatta 165", fr: "Muwatta 165", ur: "موطا 165", tr: "El-Muvatta 165 — İbn Ümmü Kays, Peygamberin kucağına işedi; Peygamber de onu serpti ama yıkamadı.", id: "Al-Muwatta 165 — Ibnu Umm Qais buang air kecil di pangkuan Nabi, lalu beliau memercikkannya tetapi tidak mencucinya." }
text: "فدعا رسول الله بماء فنضحه ولم يغسله"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن أم قيس بنت محصن، في باب ما جاء في بول الصبي: أتت بابن لها صغير لم يأكل الطعام إلى النبي، فأجلسه في حجره فبال على ثوبه، فدعا بماء فنضحه ولم يغسله. ويخرّجه المحقق عند البخاري (223) وأبي داود (374) والنسائي (1/157) وابن خزيمة (286) والدارمي والطبراني من طرق أصحاب مالك، ويحيل على التمهيد (9/108). {cite:muwatta-maruf-1997 p.109}"
  id: "Diriwayatkan oleh Malik dari Ibn Shihab, dari Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud, dari Umm Qays bint Mihsan, dalam bab tentang apa yang diriwayatkan mengenai air kencing anak kecil: Ia membawa anaknya yang masih kecil, yang belum mulai makan makanan padat, kepada Nabi (shalawat dan salam kepadanya). Beliau mendudukkan anak itu di pangkuannya, dan anak itu buang air kecil di pakaiannya. Nabi (shalawat dan salam kepadanya) meminta air dan memercikkannya ke pakaian itu tanpa mencucinya. Editor juga memasukkannya dalam kumpulan al-Bukhari (223), Abu Dawud (374), al-Nasa'i (1/157), Ibn Khuzaymah (286), al-Darimi, dan al-Tabarani, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (9/108). {mengutip:muwatta-maruf-1997 hal.109}"
