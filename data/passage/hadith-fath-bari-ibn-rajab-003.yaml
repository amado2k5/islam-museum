text: "قبر ابنه ⁦(٣)⁩ مسجد . خرجه حرب الكرماني. وقال أبو بكر الأثرم في كتاب ⁦(الناسخ والمنسوخ)⁩»: إنما كرهت الصلاة في المقبرة للتشبه بأهل الكتاب؛ لأنهم يتخذون قبور أنبيائهم وصالحيهم مساجد، ووجدنا في كتاب مصنف على مذهب سفيان الثوري : وإذا"
