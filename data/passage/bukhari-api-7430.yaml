label: { ar: "صحيح البخاري 7430 — تربية الأب ووصيته", en: "Sahih al-Bukhari 7430 — the father raising and counselling", ur: "صحیح بخاری 7430 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 7430 — El padre que cría y aconseja", fr: "Sahih al-Bukhari 7430 — l'éducation et les conseils du père" }
text: "… اللَّهِ \" مَنْ تَصَدَّقَ بِعَدْلِ تَمْرَةٍ مِنْ كَسْبٍ طَيِّبٍ، وَلاَ يَصْعَدُ إِلَى اللَّهِ إِلاَّ الطَّيِّبُ، فَإِنَّ اللَّهَ يَتَقَبَّلُهَا بِيَمِينِهِ، ثُمَّ يُرَبِّيهَا لِصَاحِبِهِ كَمَا يُرَبِّي أَحَدُكُمْ فَلُوَّهُ، حَتَّى تَكُونَ مِثْلَ الْجَبَلِ \". وَرَوَاهُ وَرْقَاءُ عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ عَنْ سَعِيدِ بْنِ يَسَارٍ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ \" وَلاَ يَصْعَدُ إِلَى اللَّهِ إِلاَّ الطَّيِّبُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7430، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7430 (Oneness, Uniqueness of Allah (Tawheed)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7430، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7430 (Unicidad de Alá (Tawhid)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7430 (Unicité d'Allah), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
