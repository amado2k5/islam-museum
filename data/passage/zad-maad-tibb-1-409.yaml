text: "… الإيمانِ والإسلام والبر والتقوى، فلو تركت في عافية دائمة مستمرة، لم تَتَخَلَّص من هذه المخالطة، ولم تتمحَّص منه، فاقتضت حِكمةُ العزيزِ أن قَيْض لها مِن المِحن والبلايا ما يكون كالدواء الكريه لمن عرض له داء إن لم يتداركه طبيبه بإزالته …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 409، يذكر الطب والطبيب، والدواء، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 409, that mentions medicine and the physician, the drug, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 409 کا اقتباس جس میں طب اور طبیب، دوا، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 409, que menciona la medicina y el médico, el medicamento, la enfermedad y su remedio; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 409, qui mentionne la médecine et le médecin, le médicament, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 409. sayfasından, tıp, hekim, ilaç ve hastalıktan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 409, yang menyebutkan tentang kedokteran, dokter, obat-obatan, dan penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
