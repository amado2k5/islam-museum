label:
  ar: "أبو داود 1203 — يعجب ربك من راعي غنم يؤذن ويصلي"
  en: "Abu Dawud 1203 — Your Lord delights in a shepherd who calls the adhan and prays"
  ur: "ابو داود 1203 — تمہارا رب اس چرواہے پر خوش ہوتا ہے جو اذان دیتا اور نماز پڑھتا ہے"
  es: "Abu Dawud 1203 — Tu Señor se complace en un pastor que llama al adhan y ora."
  fr: "Abou Dawoud 1203 — Ton Seigneur se réjouit du berger qui appelle à la prière et prie."
  tr: "Ebu Davud 1203 — Rabbin, ezan okuyan ve namaz kılan çobandan razıdır."
  id: "Abu Dawud 1203 — Tuhanmu senang dengan seorang gembala yang mengumandangkan azan dan shalat."
text: "يعجب ربكم من راعي غنم في رأس شظية بجبل يؤذن بالصلاة ويصلي فيقول الله عز وجل انظروا إلى عبدي هذا يؤذن ويقيم الصلاة يخاف مني فقد غفرت لعبدي وأدخلته الجنة ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 1203: يعجب ربك من راعي غنم يؤذن ويصلي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 1203: Your Lord delights in a shepherd who calls the adhan and prays. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 1203: تمہارا رب اس چرواہے پر خوش ہوتا ہے جو اذان دیتا اور نماز پڑھتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Abi Dawud, n.° 1203: Tu Señor se complace en un pastor que llama al adhan y reza. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan Abi Dawud n° 1203: Ton Seigneur se réjouit du berger qui appelle à la prière et prie. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et du Muwatta."
  tr: "Sunan Ebu Davud'da yer alan 1203 numaralı hadis-i kudsi şöyledir: \"Rabbiniz ezan okuyan ve namaz kılan çobandan razıdır.\" Peygamberimiz bunu Rabbinden rivayet etmiş olup, hadis-i kudsi ise bu hadisin altı şeriat hadisi ve Muvatta'daki rivayetlerini bir araya getirmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Abi Dawud, no. 1203: Tuhanmu senang dengan seorang penggembala yang mengumandangkan adzan dan shalat. Nabi meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
