label:
  ar: "أبو داود 1203 — يعجب ربك من راعي غنم يؤذن ويصلي"
  en: "Abu Dawud 1203 — Your Lord delights in a shepherd who calls the adhan and prays"
  ur: "ابو داود 1203 — تمہارا رب اس چرواہے پر خوش ہوتا ہے جو اذان دیتا اور نماز پڑھتا ہے"
text: "يعجب ربكم من راعي غنم في رأس شظية بجبل يؤذن بالصلاة ويصلي فيقول الله عز وجل انظروا إلى عبدي هذا يؤذن ويقيم الصلاة يخاف مني فقد غفرت لعبدي وأدخلته الجنة ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 1203: يعجب ربك من راعي غنم يؤذن ويصلي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 1203: Your Lord delights in a shepherd who calls the adhan and prays. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 1203: تمہارا رب اس چرواہے پر خوش ہوتا ہے جو اذان دیتا اور نماز پڑھتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
