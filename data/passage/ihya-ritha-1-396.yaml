text: "… ضمناً بالطعن فى غيره، ليستبين من طعنه فى غيره، أنه أفضل عمن طعن فيه وأعظم منه علما ولقد كان فى غنية عن الطعن فيه، ولعله يحكى من السكلام المزيف ما يزيد تزييفه فيعزيه إلى قائله وما يستحسته فلعله لا يعزيه …"
summary:
  ar: "مقطع من إحياء علوم الدين، المجلد المصوَّر 1، ص 396، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 1, p. 396, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 1، ص 396 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din, volume numérisé 1, p. 396, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Ihya' 'Ulum al-Din, volumen escaneado 1, p. 396, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "İhya Ulum el-Din'in 1. cildinin 396. sayfasından, felaket karşısında taziye, teselli ve sabır içeren bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü mersiye ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Ihya Ulum al-Din, Volume 1, halaman 396, berisi ucapan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
