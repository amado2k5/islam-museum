text: "آمر كم بأربع وأنهاكم عن أربع آمركم بالإيمان بالله وحده،، آية الإيمان حب الأنصار آية المنافق ثلاث أتحب أن أخبرك بصريح الإيمان؟ أتدرون ما الإيمان بالله وحده؟ أتسخر بي وأنت رب العالمين أتشهدين أن لا إله إلا اللّٰه أحب الأسماء …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 3، ص 363، يذكر السؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 3, p. 363, that mentions the question about faith and its answer, the sweetness and completeness of faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 3، ص 363 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 3, pág. 363, que menciona la cuestión de la fe y su respuesta, la dulzura y la plenitud de la fe, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
