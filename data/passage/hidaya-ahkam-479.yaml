text: "… الأولىٰ على الثانيةِ في الصلوات كلِّها.: أن اقرأ في الفجرِ والظهر بطوَال المُفصَّل، وفي العصر والعشاء بأوساط المفصَّل، وفي المغرب بقِصارِ المفصل. ولأنَّ مبنىُ المغربِ علىٰ العَجَلَةِ، والتخفيفُ أليقُ بها. والعصرُ والعشاءُ يُستحبُّ فيهما التأخيرُ، وقد يقعان بالتطويل في وقتٍ …"
summary:
