label: { ar: "صحيح البخاري 6122 — مَثَل المؤمن", en: "Sahih al-Bukhari 6122 — the likeness of the believer", ur: "صحیح بخاری 6122 — مومن کی مثال", es: "Sahih al-Bukhari 6122 — la semejanza del creyente" }
text: "… حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا مُحَارِبُ بْنُ دِثَارٍ، قَالَ سَمِعْتُ ابْنَ عُمَرَ، يَقُولُ قَالَ النَّبِيُّ \" مَثَلُ الْمُؤْمِنِ كَمَثَلِ شَجَرَةٍ خَضْرَاءَ، لاَ يَسْقُطُ وَرَقُهَا، وَلاَ يَتَحَاتُّ \". فَقَالَ الْقَوْمُ هِيَ شَجَرَةُ كَذَا. هِيَ شَجَرَةُ كَذَا، فَأَرَدْتُ أَنْ أَقُولَ هِيَ النَّخْلَةُ. وَأَنَا غُلاَمٌ شَابٌّ فَاسْتَحْيَيْتُ، فَقَالَ \" هِيَ النَّخْلَةُ \". وَعَنْ شُعْبَةَ حَدَّثَنَا خُبَيْبُ بْنُ عَبْدِ الرَّحْمَنِ عَنْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6122، يذكر مَثَل المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6122 (Good Manners and Form (Al-Adab)), that mentions the likeness of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6122، جس میں مومن کی مثال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6122 (Buenas costumbres y modales (Al-Adab)), menciona la semejanza del creyente. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
