text: |-
  قوله بين الحبلين من حبال الرمل
  ٩٤
  • (فصل الشينnnœ
  والغصة وقد شرق بريقه أى غص به قال عدة بن زيد
  لو بغير الماءحاق شرق • كنت كالغصان بالماء اعتصارى
  وفى الحسديث يؤخرون الصلاة الى شرق الموتى أى الى أن يبقى من الشمس مقدار ما يبقى من
  حياة من شرق بريقه عند الموت ولحم شرق أينا أى لادسم عليه وتشريق اللحم تقديده ومنه
  سميت أيام التشريق وهى ثلاثة أيام بعديوم النحرلات لحوم الاضاحى تشرق فيها أى تشرّر
  فى الشمسر ويقال سميت بذلك اقواهم أشرق ثبير كيما نغير حكاه يعة وب وقال ابن الاءرابى
  -حيت بذلك لانَ الهسدى لا ينحر حتى تشرق الشمس والمشرّق المصلى ومسجد الخيف هو
  المشرق والتشريق أيضا الاخذ فى ناحية المشرق يقال شتان بين مشرق ومغرّب وشريق
  اسم رجل شفق) الشفق بقية ضوء الشمس وحرتها فى أوّل الليل الى قريب من العتمة
  وقال اللحليسل الشفق الجرة من غروب الشمس الى وقت العشاء الآخرة فاذاذهب قيل غاب
  الشفق وقال الفراء معت بعض العرب يقول عليه ثوب كأنه الشفق وكان أحر والشفقة
  الاسم من الاشفاق وكذلك الشفق قال الشاءر
  تهوى حداتى وأهوى. وتهاشفقا * والموت أكرم نزال على الحرم
  وأشفقت عليه فأنا مشفق وشفيق واذاقلت أشفقت منه قاغمانعنى حذرته وأصلهما واحد
  ولا يقال شفقت قال ابن دريدشفقت وأشفقت بمعنى وأنكره أهل اللغة والشفق الردءمن
  الاشياء يقال عطامشفق أى مقلل قال الكميت
  ملل أغزمن الملوكك تحلبت • للسائلين يداه غير مشفق
  ⁦( شقق)⁩ الشق واحد الشقوق وهو فى الاصل مصدر وتقول بيدفلان وبرجله شقوق
  ولا تقل شقاق وانما الشتاق داه يكون بالدواب وهو تشقق يصيب أرساغها وربا ارتفع الى
  أوظفتها عن يعقوب والشق الصبح والشو بالكسرنصف الشي يقال أخذت شق الشاة وشقة
  الشاة والشق أيضا الناحية من الجبل وفى حديث أمّ زرع وجدنى فى أهل غنيمة بشق وقال
  أبو عبيدهو اسم موضع والشق أيضا الشقيق بقال هو أخى وشق نفى وشق اسم كاهن من
  كهان العرب والشق المثقة ومنه قوله تعالى لم تكونوا بالغيه الابئق الانفس وهذاقد يفح
  حكاه أبو عبيد والثقة شظية تشظى من لوح أوخشبة يقال للغضبان احتدفطارت منه شقة
  والشقة بالضم من الشياب والشقة أيضا السة رالبعيديقال شقة شاقة وربعماقانوه بالسكسر
  وهذا شقيق هذا اذا انشق الشىء بتصفين فكل واحد منه-ما شقيق الآخر ومنه قيل فلان
  شقيق فلان أى أخوه قال الشاعر وقد صفره
  يا ابن أقى وياشقيق نفسى • أنت خليتى لأمرشديد
  والشقيقة الفرجة بين الحبلين من حبال الرمل تنبت العشب والجع الثقائق قال الشاءر
  ويوم نقيقة الحسنين لاقت * بنوشيبان آجالافصارا
  والحسنان نقوان من رمل بى سعد وشقائق النعمان معروف واحده وجعه سواء وإنما
  أضيف الى النعمان لائه حى أرضا نكثرفيها ذلك والشقيقة وجع يأخذ نصف الرأس والوجه
  والشقيقة اسم جدّة النعمان بن المنذر قال ابن السكابى هى بنت أبى ربيعة بن ذهل بن شيبان
  قال
