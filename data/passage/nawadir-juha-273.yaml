label: { ar: "نوادر جحا الكبرى، ص 131 — «لا يهشم ولا يغمس»", en: "Nawadir Juha al-Kubra, p. 131 — 'He Neither Crumbles Nor Dips'", ur: "نوادر جحا الکبریٰ، ص 131 — «نہ چورا کرتا ہے نہ ڈبوتا ہے»", fr: "Nawadir Juha al-Kubra, p. 131 — « Il n'émiette pas et ne trempe pas »", es: "Nawadir Juha al-Kubra, p. 131 — «No desmenuza ni moja»", tr: "Juha'nın Büyük Fıkraları, s. 131 — “Ne ezer ne de batırır”", id: "Anekdot Hebat Juha, hlm. 131 — “Dia tidak menghancurkan atau mencelupkan”" }
text: "… لا يهشم ولا يغمس كان يأكل حليباً لبناً مع رفاقٍ له ثلاثة، وكان كلَّما هشم الشيخ ورفيقه خبزاً في اللبن، وهما مشغولان في الحديث. يتناول الثالث ما هشماه رغماً عن هَشَمَ: فتّت الخبر ومزجه باللبن."
summary:
  ar: "أكل جحا وصديق خبزاً في لبن بينما اختطف رفيق ثالث ما يفتتانه، فضربه جحا بمغرفة فأغمي عليه، وقال إن الرجل لا يفتت ولا يغمس ولا يرفع يده عن الصحن، وإذا ضُرب تظاهر بالموت. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  en: "Juha and a friend eat bread in milk while a third companion grabs what they crumble. Juha hits him with a ladle and the man faints. Juha says the man does not crumble, dip, or lift his hand from the dish, and when struck he pretends to be dead. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  ur: "جحا اور ایک دوست دودھ میں روٹی کھاتے ہیں جب کہ ایک تیسرا ساتھی ان کے چورے ہوئے ٹکڑے اچک لیتا ہے۔ جحا اسے کفگیر سے مارتا ہے تو وہ بے ہوش ہو جاتا ہے۔ جحا کہتا ہے کہ یہ آدمی نہ چورا کرتا ہے، نہ ڈبوتا ہے، نہ پیالے سے ہاتھ اٹھاتا ہے، اور مار پڑے تو مرنے کا بہانہ کرتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  fr: "Juha et un ami mangent du pain dans du lait pendant qu'un troisième compagnon saisit ce qu'ils émiettent. Juha le frappe avec une louche et l'homme s'évanouit. Juha dit que cet homme n'émiette pas, ne trempe pas et ne lève pas la main du plat, et que, frappé, il fait le mort. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  es: "Juha y un amigo comen pan en leche mientras un tercer compañero atrapa lo que ellos desmenuzan. Juha lo golpea con un cucharón y el hombre se desmaya. Juha dice que ese hombre ni desmenuza, ni moja, ni levanta la mano del plato, y que al ser golpeado se hace el muerto. {cite:juha-nawadir-kubra-djuwaydi p. 131}"
  tr: "Juha ve bir arkadaşı süte batırılmış ekmek yerken, üçüncü bir kişi tam koparacakları parçayı kaptı. Juha ona kepçeyle vurarak bayılttı ve şöyle dedi: \"Bu adam ne koparıyor ne de batırıyor ne de elini tabaktan kaldırıyor, vurulsa da ölmüş gibi yapıyor.\" {cite:juha-nawadir-kubra-djuwaydi s. 131}"
  id: "Juha dan seorang temannya sedang makan roti yang dicelupkan ke dalam susu ketika teman ketiga mereka merebut roti yang hendak mereka potong. Juha memukulnya dengan sendok sayur, membuatnya pingsan, dan berkata, \"Orang itu tidak pernah memotong, mencelupkan, atau mengangkat tangannya dari piring, dan jika dia dipukul, dia berpura-pura mati.\" {cite:juha-nawadir-kubra-djuwaydi p. 131}"
