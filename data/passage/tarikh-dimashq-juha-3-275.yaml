text: "… كثرة الضحك، فإن كثرته تستخف قلب الرجل الحليم وقال : إِن كان الكلام من فضة فالسكوت من ذهب. وقال لابنه : يا بني لا نقطع أمراً حتى تشاور مرشداً، فإنك إن فعلت ذلك لم تحزن عليه، يا بني إِياك وكثرة …"
summary:
  ar: "مقطع من تاريخ مدينة دمشق، المجلد المصوَّر 3، ص 275، فيه أدب المزاح وحدوده؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Ta'rikh Madinat Dimashq, scan volume 3, p. 275, with the ethics and limits of jesting; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "Ta'rikh Madinat Dimashq، اسکین جلد 3، ص 275 کا اقتباس جس میں مزاح کے آداب اور حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
