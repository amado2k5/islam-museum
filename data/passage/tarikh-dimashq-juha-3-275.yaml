  es: "Un extracto de Ta'rikh Madinat Dimashq, volumen escaneado 3, p. 275, con la ética y los límites de la broma; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Şam Tarihi, Resimli Cilt 3, sayfa 275'ten, mizahın adabı ve sınırlarını ele alan bir bölüm; kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Juha ve İslam Folkloru Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Damaskus, Jilid Bergambar 3, halaman 275, yang membahas etika humor dan batasannya; diambil dari versi pindaian yang dapat dibaca mesin, dengan teks yang dipetik sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
