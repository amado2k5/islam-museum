label: { ar: "الموطأ 1945 — مالك: لا يحل بيع الزيتون بالزيت، ولا الجلجلان بدهن الجلجلان، ولا الزبد بالسمن، لأن المزابنة تدخله، ولأن من يشتري الحب بشيء مسمى مما يخرج منه لا يدري أيخرج منه أقل من ذلك أو أكثر، وكذلك اشتراء حب البان بالسليخة", en: "Muwatta 1945" }
summary:
  ar: "قال مالك: ولا يحل بيع الزيتون بالزيت، ولا الجلجلان بدهن الجلجلان، ولا الزبد بالسمن، لأن المزابنة تدخله. ولأن الذي يشتري الحب وما أشبهه، بشيء مسمى مما يخرج منه، لا يدري أيخرج منه أقل من ذلك أو أكثر، فهذا غرر ومخاطرة. ومن ذلك أيضا اشتراء حب البان بالسليخة، فذلك غرر؛ لأن الذي يخرج من حب البان هو السليخة. ولا بأس بحب البان بالبان المطيب. {cite:muwatta-maruf-1997 p.195} {cite:muwatta-maruf-1997 p.196}"
