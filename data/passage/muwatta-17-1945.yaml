label: { ar: "الموطأ 1945 — مالك: لا يحل بيع الزيتون بالزيت، ولا الجلجلان بدهن الجلجلان، ولا الزبد بالسمن، لأن المزابنة تدخله، ولأن من يشتري الحب بشيء مسمى مما يخرج منه لا يدري أيخرج منه أقل من ذلك أو أكثر، وكذلك اشتراء حب البان بالسليخة", en: "Muwatta 1945", es: "Muwatta 1945", fr: "Muwatta 1945", ur: "موطا 1945", tr: "El-Muvatta 1945 — Malik: Zeytinleri yağ karşılığında, susam tohumlarını susam yağı karşılığında, tereyağını da sade yağ karşılığında satmak caiz değildir; çünkü bu, olgunlaşmamış hurmaları olgun hurma karşılığında satmaya benzer ve kim belirli bir miktarda tahıl satın alırsa, ondan daha az mı yoksa daha fazla mı ürün elde edileceğini bilemez. Benzer şekilde, Moringa ağacının tohumlarını sade yağ karşılığında satın almak da caiz değildir.", id: "Al-Muwatta 1945 — Malik: Tidak diperbolehkan menjual buah zaitun untuk minyak, biji wijen untuk minyak wijen, atau mentega untuk ghee, karena hal itu melibatkan praktik menjual kurma mentah untuk kurma matang, dan karena siapa pun yang membeli biji-bijian dengan jumlah tertentu yang akan dihasilkan tidak tahu apakah hasilnya akan kurang atau lebih dari jumlah tersebut. Demikian pula, tidak diperbolehkan membeli biji pohon Moringa untuk mendapatkan ghee." }
summary:
  ar: "قال مالك: ولا يحل بيع الزيتون بالزيت، ولا الجلجلان بدهن الجلجلان، ولا الزبد بالسمن، لأن المزابنة تدخله. ولأن الذي يشتري الحب وما أشبهه، بشيء مسمى مما يخرج منه، لا يدري أيخرج منه أقل من ذلك أو أكثر، فهذا غرر ومخاطرة. ومن ذلك أيضا اشتراء حب البان بالسليخة، فذلك غرر؛ لأن الذي يخرج من حب البان هو السليخة. ولا بأس بحب البان بالبان المطيب. {cite:muwatta-maruf-1997 p.195} {cite:muwatta-maruf-1997 p.196}"
  tr: "Malik şöyle dedi: Zeytinyağı yerine zeytin, susam yerine susam tohumu veya sade yağ yerine tereyağı satmak caiz değildir; çünkü bu, olgunlaşmamış hurmayı olgun hurma yerine satmak uygulamasına benzer. Ayrıca, bir kişi belirli bir miktarda özüt içeren tahıl veya benzeri ürünler satın aldığında, gerçek verimin bundan daha az mı yoksa daha fazla mı olacağını bilemez. Bu belirsizlik ve risk olarak kabul edilir. Benzer şekilde, tarçın kabuğu içeren betel fındığı satın almak da belirsizlik olarak kabul edilir, çünkü betel fındığından özütlenen şey tarçın kabuğudur. Ancak, parfümlü betel fındığı satın almanın bir sakıncası yoktur. {cite:muwatta-maruf-1997 s.195} {cite:muwatta-maruf-1997 s.196}"
  id: "Malik berkata: Tidak diperbolehkan menjual zaitun untuk minyak, biji wijen untuk minyak wijen, atau mentega untuk ghee, karena ini melibatkan praktik menjual kurma mentah sebagai pengganti kurma matang. Lebih lanjut, ketika seseorang membeli biji-bijian atau barang serupa dengan jumlah tertentu dari apa yang diekstrak darinya, mereka tidak tahu apakah hasil sebenarnya akan kurang atau lebih dari itu. Ini dianggap sebagai ketidakpastian dan risiko. Demikian pula, membeli sirih dengan kulit kayu manis juga dianggap sebagai ketidakpastian karena yang diekstrak dari sirih adalah kulit kayu manis. Namun, tidak ada salahnya membeli sirih dengan sirih yang diberi wewangian. {cite:muwatta-maruf-1997 p.195} {cite:muwatta-maruf-1997 p.196}"
