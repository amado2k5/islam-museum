text: "… وَإِنَّ مِنْ أَكْبَرِ هَمِّي لَدَيْنِي، أَفَتُرَى يُبْقِي دَيْنُنَا مِنْ مَالِنَا شَيْئًا فَقَالَ يَا بُنَىِّ بِعْ مَالَنَا فَاقْضِ دَيْنِي. وَأَوْصَى بِالثُّلُثِ، وَثُلُثِهِ لِبَنِيهِ، يَعْنِي عَبْدَ اللَّهِ بْنَ الزُّبَيْرِ يَقُولُ ثُلُثُ الثُّلُثِ، فَإِنْ فَضَلَ مِنْ مَالِنَا فَضْلٌ بَعْدَ قَضَاءِ الدَّيْنِ شَىْءٌ فَثُلُثُهُ لِوَلَدِكَ. قَالَ هِشَامٌ وَكَانَ بَعْضُ وَلَدِ عَبْدِ اللَّهِ قَدْ وَازَى بَعْضَ بَنِي الزُّبَيْرِ خُبَيْبٌ وَعَبَّادٌ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3129، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3129 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3129، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
