text: "إخوتي وغيرهم فقال: إنما عليك نفسك اعطنا حقك وبرئت فاشهد له وكتب عليه كتاب شراء على سبعة عشر ألف دينار ثم تتبع إخوته ففتنهم كثرة المال فباعوه فصارت لأبي جعفر ولمن أقطعها، ثم صيرها المهدي للخيزران أم موسى وهارون فبنتها"
