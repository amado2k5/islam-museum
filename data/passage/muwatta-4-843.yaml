label: { ar: "الموطأ 843 — مالك: من أكل أو شرب في رمضان ساهياً أو ناسياً، أو في صيام واجب، فعليه قضاء يوم مكانه", en: "Muwatta 843" }
summary:
  ar: "قول لمالك: من أكل أو شرب في رمضان ساهياً أو ناسياً، أو كان من صيام واجب عليه، فعليه قضاء يوم مكانه. ويذكر المحقق أن هذه الفتوى تخالف حديث أبي هريرة المرفوع: إذا نسي فأكل وشرب فليتم صومه، فإنما أطعمه الله وسقاه (البخاري 3/40 ومسلم 3/160)، ويحيل على فتح الباري (4/195–197)، ويذكر أن مالكاً رواها عنه أبو مصعب (824). {cite:muwatta-maruf-1997 p.409}"
