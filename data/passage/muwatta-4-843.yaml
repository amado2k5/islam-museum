label: { ar: "الموطأ 843 — مالك: من أكل أو شرب في رمضان ساهياً أو ناسياً، أو في صيام واجب، فعليه قضاء يوم مكانه", en: "Muwatta 843", es: "Muwatta 843", fr: "Muwatta 843", ur: "موطا 843", tr: "Al-Muwatta 843 — Malik: Ramazan ayında kasıt olmadan veya unutarak ya da farz oruç tutarken yiyen veya içen kimse o günü kaza etmelidir.", id: "Al-Muwatta 843 — Malik: Barang siapa makan atau minum selama Ramadan tanpa sengaja atau karena lupa, atau saat sedang berpuasa wajib, maka ia wajib mengganti puasa yang hilang atau tidak sehat pada hari itu." }
summary:
  ar: "قول لمالك: من أكل أو شرب في رمضان ساهياً أو ناسياً، أو كان من صيام واجب عليه، فعليه قضاء يوم مكانه. ويذكر المحقق أن هذه الفتوى تخالف حديث أبي هريرة المرفوع: إذا نسي فأكل وشرب فليتم صومه، فإنما أطعمه الله وسقاه ⁦(البخاري 3/40 ومسلم 3/160)⁩، ويحيل على فتح الباري (4/195–197)، ويذكر أن مالكاً رواها عنه أبو مصعب (824). {cite:muwatta-maruf-1997 p.409}"
  tr: "Malik şöyle demiştir: Ramazan ayında kasıtsız veya unutarak yiyen veya içen kimse, ya da farz oruç sırasında bunu yapmışsa, o günü kaza etmelidir. Araştırmacı, bu hükmün, Peygamberimize atfedilen Ebu Hurayra hadisiyle çeliştiğini belirtmektedir: “Kim unutur da yer veya içerse, orucunu tamamlasın; çünkü onu doyuran ve içiren Allah'tır” (Buhari 3/40 ve Müslim 3/160). Fethü'l-Bari'ye (4/195-197) atıfta bulunarak, Ebu Musab'ın (824) bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.409}"
  id: "Malik berkata: Barang siapa makan atau minum selama Ramadan tanpa sengaja atau karena lupa, atau jika itu terjadi saat berpuasa wajib, maka ia harus mengganti puasanya hari itu. Peneliti mencatat bahwa hukum ini bertentangan dengan hadits yang diriwayatkan oleh Abu Hurairah, yang dinisbahkan kepada Nabi: “Jika seseorang lupa dan makan atau minum, maka hendaklah ia mengganti puasanya, karena Allah-lah yang telah memberinya makan dan minum” (Al-Bukhari 3/40 dan Muslim 3/160). Ia merujuk pada Fath al-Bari (4/195–197) dan menyebutkan bahwa Abu Musab (824) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.409}"
