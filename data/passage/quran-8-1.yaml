text: "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ يَسْـَٔلُونَكَ عَنِ ٱلْأَنفَالِ ۖ قُلِ ٱلْأَنفَالُ لِلَّهِ وَٱلرَّسُولِ ۖ فَٱتَّقُوا۟ ٱللَّهَ وَأَصْلِحُوا۟ ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّؤْمِنِينَ"
text_search: "بسم الله الرحمن الرحيم يسألونك عن الأنفال ۖ قل الأنفال لله والرسول ۖ فاتقوا الله وأصلحوا ذات بينكم ۖ وأطيعوا الله ورسوله إن كنتم مؤمنين"
translations:
  en: { text: "They ask thee (O Muhammad) of the spoils of war. Say: The spoils of war belong to Allah and the messenger, so keep your duty to Allah, and adjust the matter of your difference, and obey Allah and His messenger, if ye are (true) believers.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(اے محمد! مجاہد لوگ) تم سے غنیمت کے مال کے بارے میں دریافت کرتے ہیں کہ (کیا حکم ہے) کہہ دو کہ غنیمت خدا اور اس کے رسول کا مال ہے۔ تو خدا سے ڈرو اور آپس میں صلح رکھو اور اگر ایمان رکھتے ہو تو خدا اور اس کے رسول کے حکم پر چلو", translator: "Fateh Muhammad Jalandhari", license: PD }
