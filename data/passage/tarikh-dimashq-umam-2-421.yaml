text: "… من قريش لهم اسنان مستمسكين بماهم عليه من امر الجاهلية فاقتدى بهم وما كان لى ان اقتدى يهم فيا اهلكنا الا الاقتداء با بائنا وكبرائنا فلما غزا رسول اللّٰه مكة جمات افكر فاتانى ابو سفيان بن حرب فقال يا ابا …"
summary:
