text: "… مباحٍ. تركُ حرام تركُ حرام، ألا ترى أنَّه تركَ المحرماتِ كلَّها عند فعل المباح؛ فقد شغَل النفسَ به عن جميعها، وهذا الثاني أولى ؛ لأنّ الكليَّة هنا تصحّ، ولا يصع أنْ يقال: كلُّ مباح وسيلةً إلى محرَّم أو منهيٍّ عنه …"
