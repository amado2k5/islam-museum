label: { ar: "جامع الترمذي 3733 — الأب والأبوة", en: "Jami' al-Tirmidhi 3733 — the father and fatherhood", ur: "جامع ترمذی 3733 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3733 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3733 — le père et la paternité" }
text: "… قَالَ حَدَّثَنَا عَلِيُّ بْنُ جَعْفَرِ بْنِ مُحَمَّدِ بْنِ عَلِيٍّ، قَالَ أَخْبَرَنِي أَخِي، مُوسَى بْنُ جَعْفَرِ بْنِ مُحَمَّدٍ عَنْ أَبِيهِ، جَعْفَرِ بْنِ مُحَمَّدٍ عَنْ أَبِيهِ، مُحَمَّدِ بْنِ عَلِيٍّ عَنْ أَبِيهِ، عَلِيِّ بْنِ الْحُسَيْنِ عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَلِيِّ بْنِ أَبِي طَالِبٍ أَنَّ رَسُولَ اللَّهِ أَخَذَ بِيَدِ حَسَنٍ وَحُسَيْنٍ فَقَالَ \" مَنْ أَحَبَّنِي وَأَحَبَّ هَذَيْنِ وَأَبَاهُمَا وَأُمَّهُمَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3733، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3733 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3733، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3733 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3733 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
