label: { ar: "الموطأ 1625 — عائشة: كان في بريرة ثلاث سنن، عتقها فخيرت في زوجها، وقال النبي الولاء لمن أعتق، وأن اللحم المتصدق به على بريرة هدية للنبي", en: "Muwatta 1625", es: "Muwatta 1625", fr: "Muwatta 1625", ur: "موطا 1625", tr: "Muvatta 1625 — Aişe: Barirah hakkında üç sünnet vardı: Onu azat etti, kocası konusunda ona seçim hakkı verdi ve Peygamberimiz şöyle buyurmuştur: \"Sadakat azat edene aittir.\" Ve Barirah'a sadaka olarak verilen et, Peygamberimize bir hediyeydi.", id: "Al-Muwatta 1625 — Aisyah: Ada tiga Sunnah mengenai Barirah: beliau membebaskannya dan dia diberi pilihan mengenai suaminya, dan Nabi bersabda bahwa kesetiaan adalah milik orang yang membebaskan, dan bahwa daging yang diberikan sebagai sedekah kepada Barirah adalah hadiah kepada Nabi." }
summary:
  ar: "يروي يحيى عن مالك عن ربيعة بن أبي عبد الرحمن عن القاسم بن محمد عن عائشة أم المؤمنين أنها قالت كان في بريرة ثلاث سنن، فكانت إحدى السنن الثلاث أنها أعتقت فخيرت في زوجها، وقال رسول الله الولاء لمن أعتق، ودخل رسول الله والبرمة تفور بلحم، فقرب إليه خبز وأدم من أدم البيت، فقال ألم أر برمة فيها لحم؟ فقالوا بلى، ولكن ذلك لحم تصدق به على بريرة، وأنت لا تأكل الصدقة، فقال هو عليها صدقة، وهو لنا هدية. {cite:muwatta-maruf-1997 p.71}"
  tr: "Yahya, Malik'ten, Rabi'ah ibn Abi Abdül-Rahman'dan, el-Kasım ibn Muhammed'den ve Müminlerin Annesi Aişe'den rivayetle şöyle buyurmuştur: Barirah hakkında üç rivayet vardır. Bu üç rivayetten biri, Barirah'ın azat edildiği ve kocasını seçme hakkının kendisine verildiğidir. Allah Resulü şöyle buyurmuştur: \"Miras, azat edene aittir.\" Allah Resulü, içinde et kaynayan bir tencereye girdi. Ona ekmek ve ev halkının bazı baharatları getirildi. \"Et dolu bir tencere görmedim mi?\" dedi. Onlar da: \"Evet, ama o et Barirah'a sadaka olarak verildi ve sen sadaka yemezsin.\" dediler. O da: \"Onun için sadakadır, ama bizim için bir hediyedir.\" dedi. {cite:muwatta-maruf-1997 s.71}"
  id: "Yahya meriwayatkan dari Malik, dari Rabi'ah ibn Abi Abd al-Rahman, dari al-Qasim ibn Muhammad, dari Aisyah, Ummul Mukminin, bahwa ia berkata: Ada tiga riwayat tentang Barirah. Salah satu dari tiga riwayat itu adalah bahwa ia dibebaskan dan diberi pilihan mengenai suaminya. Rasulullah SAW bersabda: \"Warisan adalah milik orang yang membebaskan.\" Rasulullah SAW masuk ketika panci sedang mendidih berisi daging. Roti dan beberapa bumbu rumah tangga dibawa kepadanya. Beliau bersabda: \"Tidakkah aku melihat panci berisi daging?\" Mereka menjawab: \"Ya, tetapi daging itu diberikan sebagai sedekah kepada Barirah, dan engkau tidak makan sedekah.\" Beliau bersabda: \"Itu sedekah untuknya, tetapi itu hadiah untuk kita.\" {cite:muwatta-maruf-1997 p.71}"
