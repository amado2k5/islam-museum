label: { ar: "الموطأ 1625 — عائشة: كان في بريرة ثلاث سنن، عتقها فخيرت في زوجها، وقال النبي الولاء لمن أعتق، وأن اللحم المتصدق به على بريرة هدية للنبي", en: "Muwatta 1625" }
summary:
  ar: "يروي يحيى عن مالك عن ربيعة بن أبي عبد الرحمن عن القاسم بن محمد عن عائشة أم المؤمنين أنها قالت كان في بريرة ثلاث سنن، فكانت إحدى السنن الثلاث أنها أعتقت فخيرت في زوجها، وقال رسول الله الولاء لمن أعتق، ودخل رسول الله والبرمة تفور بلحم، فقرب إليه خبز وأدم من أدم البيت، فقال ألم أر برمة فيها لحم؟ فقالوا بلى، ولكن ذلك لحم تصدق به على بريرة، وأنت لا تأكل الصدقة، فقال هو عليها صدقة، وهو لنا هدية. {cite:muwatta-maruf-1997 p.71}"
