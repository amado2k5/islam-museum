text: |-
  .٦ : * (با ب القاف "
  ١٠٥.°
  توضع معترضة بين سافى الحائط والعرقات المسوع والعرقة واحدة العرق وهو السطر
  من الحيل والطير وضحوه والعروق نجات أصة ريصبغ به والعروق عروق الشجر الواخد غرق
  وفى الحديث من أحيا أرضاميتة فهى له وليس لعرق ظالم -ق والعرق الظالم أن يجى«الرجل
  الى أرض قد أحياهاغيره فيغرس فيها أويزرع ايستوحب به الارض ويقان أيضافى
  الشراب عرق من الماءليس بالكثير وذات عرقموضع بالبادية والعرق بالفتح مصدر.
  قولك عرقت العظم أعسرقه بالضم عرقا ومعسرقااذا أكات ماعليه من اللهم وقال
  أكف لدانى عن صديق فان أجأ* اليسه فانى عارق كل معرق .
  والعرق أيضا العظم الذى أخذ عنه اللعم والجمع ءراق بالضم قال ابن السكيت ولم يجشى من
  المع ع-لى فعال الاأحرف منها تؤام جمع توأم وشاة ربى وغم رياب وظئر وظؤار وعرق
  وعراق ورخل ودخال وفرير وفرار قال ولا نظيرلها ورجل معروق العظام ومعترق أى قليل
  اللهم وتعرقت العظم مثسل عرقته والعراق بلاديذ كرويؤنث ويقال هو فارسىّ معرب
  والعراقان الكوفة والبصرة وأعرق الرجيل اذاصار الى العراق قال الممزق العبدى
  فان تتهموا أنجد خلافا عليكم • وان تعمنوامستحقى الحرب أعرق
  وقال أبو زيداذا كان الجلد فى أسفل السقاء مثنياثم خرزعليه فهو العراق والجمعء رق واذا
  موى ثم خرزءايه غير مثني "فهو الطباب وقال الاصعى العراف الطبابة وهى الجلمدة التى
  تغطوبم اعيون الحوز وأعرق الرجل أى صارعريتا وهو الذى له عسرق فى الكرم وكذلك
  الفرس وفلان معرق يقال ذلل فى اللؤه والكرم جمعا وقدأعرق فيه أعمامه وأخواله
  ويقال ان امر أليس بينه و بين آدم أب حىّ لع رقله فى الموت كما يقال لمعرف له فى الكرم أى له
  عرق فى ذلك يموت لا محالة وأعرق الشجر والنبات اذا امتدت عروقه فى الارض وعرق فلان
  فى الارض يعرق ءروقامثال جلس جلوسا أى ذهب وعارق اسم شاءر من طي سمى بذلك
  رقوله لا تتهين للعظم ذو أنا عارقه * وأعرقت الشراب فهو مع رق أى فيه عرق من الماء
  ايمر بالمكثير وعرّقت الشراب تعريقا اذا عن جته من غير أن تبالغ فيه ومنه طلا معرّق
  ويقال أيضارجل معرّق الخدين اذا كان قليل لحم الخدين ويق ال عرّق فى الاناء أى اجعل
  فيه دون المل° وعرّقت فى الدلواذا استقيت فيهادون الملء قال الراجز
  لا تملا الدلو وعرّق فيها • ألاترى -بارمن يسقيها
  وعرقوة الدلو بفتح العين ولا تقسل عرقوة وانماتضمّ فعلوة اذا كان نأنيسه نون مثل عنصوة
  والعرة وتان الخشبتان اللثان تعرضان على الدلو كاصليب والجمع العراقى قال
  •خذات منهااعراقى فانجذم• أراد بقوله منها الدلو وبقوله انجذم السجل لانّ السجل
  والدلو واحد وان جعت بحذف الهاءقات عرق وأصله عرق والا أنه فعسل به ما فع-ل بثلاثة
  أحق فى جمع حة ووتقول عرقيت الدلوعرقاة اذاشددتهما عليها وذات العراقى الداهية قال
  عوف ابن الاحوص
  لقيتم من تدرّتكم علينا • وقتل سراتناذات العراقى
  يقال فى.أخوذة من عراقى الاكام وهى التى غلظت جد الارتقى الابمشقة والعرة وتان أيضا
