text: "… ابنها عبدالرحمٰن أنها قالت: حضر إبراهيم ابن النبي عل الموتُ فرأيت رسول اللّٰه علات كلما صِحْتُ أنا وأُختي، نهانا عن الصياح، وغسَّله الفضل بن العباس، ورسول اللّٰه والعباس على سرير، ثم حمل فرأيته جالساً على شفير القبر، ونزل في قبره …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1538، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
