text: "… يعاتبُ إلّا المؤمنينَ؟ - حدَّثنا الحسينُ، أخبرنا الحَجّاجُ بن أبي مَنيعٍ، عن جدِّه، عن الزُّهْريِّ قال: أخبرني حُمَيدُ بن عبدِ الرَّحمن، أنَّ أبا هُرَيرة أخبره قال: سمعتُ رسول اللّٰه وَالفي يقول: أسرَفَ رجلٌ على نفسِه حتَّى إذا حَضَرَتْه الوفاةُ قال …"
