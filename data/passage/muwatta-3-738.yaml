label: { ar: "الموطأ 738 — مالك في آية الأنعام عن إيتاء حقه يوم حصاده: أن ذلك الزكاة، والله أعلم", en: "Muwatta 738", es: "Muwatta 738", fr: "Muwatta 738", ur: "موطا 738", tr: "Al-Muwatta 738 — Malik, Al-An'am suresinin, hasat gününde hakkını vermeye ilişkin ayetinde şöyle buyurmuştur: Bu zekâttır ve Allah en iyisini bilir.", id: "Al-Muwatta 738 — Malik, dalam ayat Al-An'am, mengenai pemberian zakat pada hari panen: bahwa ini adalah zakat, dan Allah Maha Mengetahui." }
summary:
  ar: "قول لمالك في قول الله في سورة الأنعام عن إيتاء حق الزرع يوم حصاده [[passage/quran-6-141|الأنعام 141]]: أن ذلك الزكاة، والله أعلم، وقد سمع من يقول ذلك. ويذكر المحقق أن قوله «والله أعلم» سقط من نسخة م وهو في النسخ ورواية أبي مصعب، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.368}"
  tr: "Malik, En'am Suresi'nde Allah'ın hasadın yapıldığı gün ürünün hakkının verilmesiyle ilgili ayette [[pasaj/kuran-6-141|En'am 141]] şöyle demiştir: \"Bu zekâttır ve Allah en iyisini bilir.\" Bunu birinden duyduğunu belirtmiştir. Editör, \"ve Allah en iyisini bilir\" ifadesinin M el yazmasında bulunmadığını, ancak el yazmalarında ve Ebu Mus'ab'ın rivayetinde mevcut olduğunu ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.368}"
  id: "Malik berkata, mengenai firman Allah dalam Surah Al-An'am tentang memberikan zakat pada hari panennya [[passage/quran-6-141|Al-An'am 141]]: bahwa ini adalah zakat, dan Allah Maha Mengetahui, dan dia mendengar seseorang mengatakan itu. Editor menyebutkan bahwa pernyataannya \"dan Allah Maha Mengetahui\" tidak ada dalam manuskrip M, tetapi ada dalam manuskrip dan riwayat Abu Mus'ab, dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.368}"
