label: { ar: "الموطأ 2706 — أبو بشير الأنصاري: النبي يأمر بقطع القلادة من وتر في رقبة البعير، ومالك يراه من العين", en: "Muwatta 2706" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن عباد بن تميم أن أبا بشير الأنصاري أخبره أنه كان مع رسول الله في بعض أسفاره، فأرسل رسولا: لا تبقين في رقبة بعير قلادة من وتر أو قلادة إلا قُطعت. قال يحيى: سمعت مالكا يقول: أرى ذلك من العين. {cite:muwatta-maruf-1997 p.526}"
