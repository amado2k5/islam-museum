label: { ar: "الموطأ 2706 — أبو بشير الأنصاري: النبي يأمر بقطع القلادة من وتر في رقبة البعير، ومالك يراه من العين", en: "Muwatta 2706", es: "Muwatta 2706", fr: "Muwatta 2706", ur: "موطا 2706", tr: "El-Muvatta 2706 — Ebu Beşir el-Ensari: Peygamber, kolyenin devenin boynundaki bir tendondan kesilmesini emretti ve Malik onu gözden gördü.", id: "Al-Muwatta 2706 — Abu Bashir al-Ansari: Nabi memerintahkan agar kalung itu dipotong dari urat di leher unta, dan Malik melihatnya sebagai berasal dari mata." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن عباد بن تميم أن أبا بشير الأنصاري أخبره أنه كان مع رسول الله في بعض أسفاره، فأرسل رسولا: لا تبقين في رقبة بعير قلادة من وتر أو قلادة إلا قُطعت. قال يحيى: سمعت مالكا يقول: أرى ذلك من العين. {cite:muwatta-maruf-1997 p.526}"
  tr: "Malik, Abdullah ibn Abi Bekr'den, o da Abbad ibn Tamim'den rivayet ettiğine göre, Ebu Beşir el-Ensari ona şöyle demişti: \"Allah'ın Resulü ile bir yolculuktaydım ve Resulullah bir elçi gönderdi: 'Devenin boynunda hiçbir ip veya kolyeyi kesmeden bırakmayın.' Yahya dedi ki: Malik'in şöyle dediğini işittim: 'Bunun nazardan kaynaklandığına inanıyorum.'\" {cite:muwatta-maruf-1997 s.526}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr, dari Abbad ibn Tamim, bahwa Abu Bashir al-Ansari memberitahunya bahwa ia bersama Rasulullah dalam salah satu perjalanannya, dan beliau mengutus seorang utusan: “Jangan tinggalkan tali atau kalung di leher unta tanpa memotongnya.” Yahya berkata: Aku mendengar Malik berkata: Aku percaya bahwa ini disebabkan oleh mata jahat. {cite:muwatta-maruf-1997 p.526}"
