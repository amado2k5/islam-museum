text: "… بعضِ الوجه، وهو المأمورُ به، إلا أن الخَدَّ والذَّقَنَ خارج، بالإجماع. والمذكورُ فيما رُوي : الوَجْه، في المشهور. ووَضْعُ اليدين والركبتين سُنَّةٌ عندنا؛ لتحقُّق السجودِ بدونهما. وأما وَضْعُ القدمَيْن: فقد ذَكَرَ القدوري أنه فريضةٌ في السجود. قال: فإن سجد علىٰ …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 458، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Marghinani's al-Hidaya, p. 458, whose wording mentions the obligation (farida); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ہدایہ، مرغینانی، ص 458 کا اقتباس جس میں فریضہ اور فرائض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Hidaya de al-Marghinani, p. 458, dont le texte mentionne l'obligation (farida) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Hidaya de al-Marghinani, p. 458, cuyo texto menciona la obligación (farida); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Marghinani'nin El-Hidaye adlı eserinin 458. sayfasından, farz olan amelleri ve görevleri anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Hidayah karya Al-Marghinani, halaman 458, yang menyebutkan amalan dan kewajiban wajib; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
