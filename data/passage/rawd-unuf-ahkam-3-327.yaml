  tr: "Suhayli'nin \"El-Ravd El-Enf\" adlı eserinin resimli 3. cildinin 327. sayfasından, \"zorunlu\" ve \"zorunluluk\" terimlerinin geçtiği bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu metin, farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Rawd Al-Anf karya Al-Suhayli, jilid 3, halaman 327, yang menyebutkan istilah \"wajib\" dan \"kewajiban.\" Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus mengurutkan perbuatan wajib, tugas, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
