text: "… نزل بلسان العرب، وليست عسى فى كلام العرب. يخبر، ولا تقتفى وجوباً، فكيف تكون عسى واجبةً فى القرآن، وليس. يخارج عن كلام العرب ؟... وأيضاً : فإن لمل تمطى معنى التَّرَجِّى، وليست من اللّٰه واجبة، فقد قال :- لماهم يشكرون …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 327، يرد فيه ذكر الواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 327, whose wording mentions the obligatory (wajib), obligation (wujub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 327 کا اقتباس جس میں واجب، وجوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Rawd al-Unuf de al-Suhayli, volume numérisé 3, p. 327, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
