label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 193 — جمع القرآن والمصاحف، رسم المصحف", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 193 — the collection of the Qur'an and the codices; the orthography of the mushaf", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 193 — جمعِ قرآن اور مصاحف، رسمِ مصحف", es: "Al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, escaneo del volumen 1, pág. 193: la colección del Corán y los códices; la ortografía del mushaf." }
text: "… عليه موظع الخلاف قال على ان القرل بان القراآن الثلاث غير متواترة في غاية السقرط ولا يصح القول به همن يعنير قوله فى الدين وهي ا تشالف رسم المصحف قال وقد سمعت أبي يشدر النكير على بعض القضاء وقد بلغه …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 193، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 193, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 193 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 1, pág. 193, que menciona la colección del Corán y los códices, así como la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
