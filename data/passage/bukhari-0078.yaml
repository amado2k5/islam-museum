label:
  ar: "البخاري 78 — موسى والعبد الصالح بمجمع البحرين"
  en: "Bukhari 78 — Musa and the righteous servant at the meeting of the two seas"
  ur: "بخاری 78 — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
text: "بينما موسى في ملإ من بني إسرائيل، إذ جاءه رجل فقال أتعلم أحدا أعلم منك قال موسى لا. فأوحى الله عز وجل إلى موسى بلى، عبدنا خضر، فسأل السبيل إلى لقيه، فجعل الله له الحوت آية، وقيل له إذا فقدت …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 78: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 78: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 78: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
