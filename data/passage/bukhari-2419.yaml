label: { ar: "البخاري 2419 — سبعة أحرف", en: "Bukhari 2419 — the seven ahruf", es: "Bukhari 2419 — los siete ahruf", fr: "Bukhari 2419 — les sept ahruf", ur: "بخاری 2419 - سات احرف", tr: "Buhari 2419 — Yedi harf", id: "Al-Bukhari 2419 — Tujuh surat" }
text: "سمعت هشام بن حكيم يقرأ سورة الفرقان على غير ما أقرأها، وكان رسول الله أقرأنيها… فقال له: اقرأ، فقرأ، قال: هكذا أنزلت، ثم قال لي: اقرأ، فقرأت، فقال: هكذا أنزلت، إن القرآن أنزل على سبعة أحرف فاقرؤوا منه ما تيسر"
summary:
  ar: "في كتاب فضائل القرآن؛ قصة خصومة عمر وهشام بن حكيم في القراءة أمام النبي، وفيها متن التيسير الشهير بسبعة أحرف — أساس أبواب القراءات وتوحيد عثمان لاحقاً."
  tr: "Kur'an'ın Faziletleri adlı kitapta, Ömer ile Hişam bin Hakim arasında Peygamber huzurunda Kur'an okuma konusunda çıkan ihtilafın öyküsü yer almaktadır ve yedi harften oluşan ünlü Teysir metni de bu kitapta bulunmaktadır; bu metin, Kur'an okuma bölümlerinin ve daha sonra Osman'ın birleştirmesinin temelini oluşturmaktadır."
  id: "Dalam kitab Keutamaan Al-Qur'an; kisah perselisihan antara Umar dan Hisham bin Hakim mengenai bacaan di hadapan Nabi, dan di dalamnya terdapat teks terkenal Al-Taysir dengan tujuh huruf — dasar dari bab-bab tentang bacaan dan penyatuan selanjutnya oleh Utsman."
