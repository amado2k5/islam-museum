label: { ar: "البخاري 2419 — سبعة أحرف", en: "Bukhari 2419 — the seven ahruf" }
text: "سمعت هشام بن حكيم يقرأ سورة الفرقان على غير ما أقرأها، وكان رسول الله أقرأنيها… فقال له: اقرأ، فقرأ، قال: هكذا أنزلت، ثم قال لي: اقرأ، فقرأت، فقال: هكذا أنزلت، إن القرآن أنزل على سبعة أحرف فاقرؤوا منه ما تيسر"
summary:
  ar: "في كتاب فضائل القرآن؛ قصة خصومة عمر وهشام بن حكيم في القراءة أمام النبي، وفيها متن التيسير الشهير بسبعة أحرف — أساس أبواب القراءات وتوحيد عثمان لاحقاً."
