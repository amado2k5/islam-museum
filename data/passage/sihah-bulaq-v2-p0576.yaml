text: |-
  * ⁦(ف صل التاء)⁩
  بتمكى أنفه والاستئناف الابتداء وكذلك الأئتناف وقلت كذا آنفاوهالذا
  والتأنف تحديد طرف الشئ ⁦(أوف )⁩ الافة العاهة وقدايف الزرع على مالم يسمّ
  فاعل أى أصابته آفة فهو موف مثال معوف
  صل التا حف) التحفة ما أتحفت به الرجل من البرّ واللطف وكذلك
  التحفة بفتح الحاء والجمع تحف ف الترفة بالضم هنة ناتئسة فى وسط الشفة العليا خلدة
  وأترفته النعمة أى أطغته (تلف التلف الملال وقد تلف الشئ وأتلفه غيره والمتلف
  المفازة وذهبت نفس فلان تلفا وطلفا يعنى واحدأى هدرا ورجل متلاف أى صكثير
  الاتلاف لماله ⁦( ت ف)⁩ التنوفة المفازة وكذلك التنوفية كما قالوادة ودوّية لانها أرض
  مثلها قدب اليها قال ابن أحر
  كم دون ليلى من تنوفية * امعة تنذرفيها النذر
  صل الثا قف قف الرجل ثقفا وثقافة أى صار ماذقاخفيفا فهوثقف
  مثال ضخم فهو ضخم ومنه المثاقفة والمقاف ما تسوّى به الرماح ومنه قول عرو
  اذاعض الثقاف بع ااشمأزت * تتجّقفا المنقف والجبينا
  وتثقيفهاتسويتها وثقفته ثقفامثال بلعته بلعا أى صادفته وقال
  فاماتشة فونى فاقتلونى * فأن أثقف فسوف ترون بالى
  وثقف أيضاثقفا مثال تعب تمبالغة فى ثقف أى صارحاذ قافطنا فهوثقف وثقن مثال حذر
  وحسذر وندس وندس وثقيف أبو قبيلة من هوازن واسمه قسى والنسب اليه ثقنىّ ابن
  الاعرابى خلّ ثقيف بالتشديد أى حامض جدامثال قولك بصل حزيف
  صل الجيم ( أف جأفه اغة فى جعفه أى صرعه وجأفه أيضا بعنى ذعره
  وقد جيف أشد المأف فهو مجوف مثال مجعوف أى خادم ورجل مجوف أيضا أى جائع
  حكاه أبو عبيد وقد جنف ( ف أحف بد أى ذهب به وأبحف به أيضا أى قاربه ودنا
  منه وجاحفه أى زاجه وداناه ويقال مرّ الشي حضرًا ومجعفا أى مقاربا وسيل بجاف
  بالضم اذا جرف كل شئؤذهب به وقال
  لها كفل كصفاة المسشيل أبرز عنها جحاف مضر
  والححاف أيضا الموت عن أبى عمرو يقال موت جماف يدهب بكل شئ هال دو الرمّة
  وكائن تفظت ناقى من مفازة • وكم ذلّ عنها من جاف المقادر
  والجاف أيضامشى البطان من تخمة والرجل مجموف قال الراجز
  أرفقة تشكوالحاف والقبص • جاودهم ألين من مس القمص
  والجاف بكسر الجيم أن تصيب الدلوفم البئر فينصب ماؤهاوري اتخرّقت قال الراجز
  قدعات دلوبى مناف • تقويم فرغيها عن الجاف
  والجوف الدلوا لتى تجحف الماء أى تأخذه وتذهب به وقول الشاعر
  ولايستوى الجفان حف ثريدة • وحف جرورى بأبيض صارم
  قال أبو عم رويعنى أكل الز بدبالتمر والضرب بالسيف وححفسة موضع بين مكة والمدينة ونهى
