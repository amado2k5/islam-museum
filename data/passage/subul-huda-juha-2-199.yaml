text: "… من دراهم الصدقة كما ورد، ودرهم الصدقة بعشرة.، ودرهم القرض يرجع للمُقْرِض بَدَلُه، وهو بدرهمين من جملة مبلغ أَصله عشرون يتأَخر للمُقْرض منه ثمانية عشر.. وسمعت شيخنا الإمام العلامة نور الدين المَحَلىِّ يذكر ذلك فى الأُصول. ثم رأَيت فى نوادر …"
