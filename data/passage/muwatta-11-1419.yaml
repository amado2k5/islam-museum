label: { ar: "الموطأ 1419 — مالك: لا بأس بأكل الصيد وإن غاب مصرعه إذا وجدت به أثرا من كلبك أو كان به سهمك، ما لم يبت", en: "Muwatta 1419", es: "Muwatta 1419", fr: "Muwatta 1419", ur: "موطا 1419", tr: "El-Muvatta 1419 — Malik: Av hayvanının nerede öldürüldüğü bilinmese bile, üzerinde köpeğinizin izine rastlarsanız veya okunuzun izini bulursanız, gece öldürülmemiş olması şartıyla av eti yemekte bir sakınca yoktur.", id: "Al-Muwatta 1419 — Malik: Tidak ada salahnya memakan hewan buruan meskipun tempat kematiannya tidak diketahui, jika kamu menemukan jejak anjingmu atau panahmu di atasnya, asalkan hewan itu tidak dibunuh pada malam hari." }
summary:
  ar: "يقول مالك لا بأس بأكل الصيد وإن غاب عنك مصرعه، إذا وجدت به أثرا من كلبك، أو كان به سهمك، ما لم يبت، فإذا بات فإنه يكره أكله. {cite:muwatta-maruf-1997 p.636}"
  tr: "Malik, av hayvanının nerede öldürüldüğünü bilmeseniz bile, üzerinde köpeğinizin izine rastlasanız veya okunuzun izine rastlasanız bile, gece boyunca yenmemiş olması şartıyla yemenin caiz olduğunu söyler. Gece boyunca yenmişse, yemek mekruhtur. {cite:muwatta-maruf-1997 s.636}"
  id: "Malik mengatakan bahwa boleh memakan hewan buruan meskipun tidak diketahui di mana hewan itu dibunuh, jika terdapat jejak anjing Anda di atasnya, atau jika terdapat bekas panah Anda di atasnya, asalkan belum dimakan semalaman. Jika sudah dimakan semalaman, maka tidak disukai untuk memakannya. {cite:muwatta-maruf-1997 p.636}"
