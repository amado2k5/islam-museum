text: "… فصل : في هديه في علاج الفَزعِ، والأَرَقِ المانِع من النوم فصل : في هديه كل لير في علاج داء الحريق وإطفائه أثر التكبير في إخماد النار مادة الشيطان.. فصل : في هديه في حفظ الصحة قوام البدن على الحرارة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 1101، يذكر البيمارستان وصناعة الطب، والعلاج، والصحة، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1101, that mentions the hospital and the medical craft, treatment, health, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 1101 کا اقتباس جس میں بیمارستان، علاج، صحت، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 1101, que menciona el hospital y la práctica médica, el tratamiento, la salud, la enfermedad y su remedio; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
