  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 1101. sayfasında hastaneden, tıp mesleğinden, tedaviden, sağlıktan ve hastalıktan bahsedilmektedir; bu alıntı, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynakların politikasına göre yaklaşık kırk kelimeyle özetlenmiştir."
