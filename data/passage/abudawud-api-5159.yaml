label: { ar: "سنن أبي داود 5159 — الأب والأبوة", en: "Sunan Abi Dawud 5159 — the father and fatherhood", ur: "سنن ابی داؤد 5159 — باپ اور والدیت", es: "Sunan Abi Dawud 5159 — El padre y la paternidad", fr: "Sunan Abi Dawud 5159 — Le père et la paternité" }
text: "… قَالَ حَدَّثَنَا أَبُو مُعَاوِيَةَ، ح وَحَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ أَبِيهِ، عَنْ أَبِي مَسْعُودٍ الأَنْصَارِيِّ، قَالَ كُنْتُ أَضْرِبُ غُلاَمًا لِي فَسَمِعْتُ مِنْ خَلْفِي صَوْتًا \" اعْلَمْ أَبَا مَسْعُودٍ \". قَالَ ابْنُ الْمُثَنَّى مَرَّتَيْنِ \" لَلَّهُ أَقْدَرُ عَلَيْكَ مِنْكَ عَلَيْهِ \". فَالْتَفَتُّ فَإِذَا هُوَ النَّبِيُّ فَقُلْتُ يَا رَسُولَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5159، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5159 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5159، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5159 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 5159 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
