text: "قال رسول الله: «اجتنبوا السبع الموبقات»، قيل: يا رسول الله وما هن؟ قال: «الشرك بالله، والسحر، وقتل النفس التي حرم الله إلا بالحق، وأكل مال اليتيم، وأكل الربا، والتولي يوم الزحف، وقذف المحصنات الغافلات المؤمنات»"
summary:
  ar: "رواية أبي هريرة في كتاب الإيمان من صحيح مسلم؛ قائمة الكبائر السبع التي صارت مرجعاً لأبواب الكبائر في الفقه والفتاوى."
