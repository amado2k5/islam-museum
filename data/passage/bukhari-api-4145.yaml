label: { ar: "صحيح البخاري 4145 — الأب والأبوة", en: "Sahih al-Bukhari 4145 — the father and fatherhood", ur: "صحیح بخاری 4145 — باپ اور والدیت", es: "Sahih al-Bukhari 4145 — El padre y la paternidad", fr: "Sahih al-Bukhari 4145 — Le père et la paternité" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدَةُ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، قَالَ ذَهَبْتُ أَسُبُّ حَسَّانَ عِنْدَ عَائِشَةَ فَقَالَتْ لاَ تَسُبَّهُ، فَإِنَّهُ كَانَ يُنَافِحُ عَنْ رَسُولِ اللَّهِ. وَقَالَتْ عَائِشَةُ اسْتَأْذَنَ النَّبِيَّ فِي هِجَاءِ الْمُشْرِكِينَ قَالَ \" كَيْفَ بِنَسَبِي \". قَالَ لأَسُلَّنَّكَ مِنْهُمْ كَمَا تُسَلُّ الشَّعْرَةُ مِنَ الْعَجِينِ. وَقَالَ مُحَمَّدٌ حَدَّثَنَا عُثْمَانُ بْنُ فَرْقَدٍ، سَمِعْتُ هِشَامًا، عَنْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4145، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4145 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4145، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4145 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4145 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
