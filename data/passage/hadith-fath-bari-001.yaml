text: "الله صلى الله عليه فقرئ، فإذا فيه: بسم الله الرحمن الرحيم. من محمد عبدالله ورسوله، إلى هرقل عظيم الروم. سلام على من اتبع الهدى. أما بعد فإني أدعوك بدعاية الإسلام، أسلم تسلم، وأسلم يؤتك الله أجرك مرتين، فإن توليت فعليك"
