label: { ar: "سنن أبي داود 394 — الأب والأبوة", en: "Sunan Abi Dawud 394 — the father and fatherhood", ur: "سنن ابی داؤد 394 — باپ اور والدیت" }
text: "… لِلْمَغْرِبِ حِينَ غَابَتِ الشَّمْسُ - يَعْنِي مِنَ الْغَدِ - وَقْتًا وَاحِدًا. قَالَ أَبُو دَاوُدَ وَكَذَلِكَ رُوِيَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ قَالَ ثُمَّ صَلَّى بِيَ الْمَغْرِبَ يَعْنِي مِنَ الْغَدِ وَقْتًا وَاحِدًا وَكَذَلِكَ رُوِيَ عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ مِنْ حَدِيثِ حَسَّانَ بْنِ عَطِيَّةَ عَنْ عَمْرِو بْنِ شُعَيْبٍ عَنْ أَبِيهِ عَنْ جَدِّهِ عَنِ النَّبِيِّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 394، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 394 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 394، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
