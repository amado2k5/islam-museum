text: "… عمرا الخضر، واسمه خضرون بن قابيل ابن ادم. قال : وذكر ابن إسحاق : أن آدم لما حضرته الوفاة أخبر بنيه أن الطوفان سيقع بالناس، وأوصاهم إذا كان ذلك أن يحملوا جسده معهم في السفينة، وأن يدفنوه معهم في مكان …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 547، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 547, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 547 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Qisas al-Anbiya' de Ibn Kathir, pág. 547, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Qisas al-Anbiya' d'Ibn Kathir, p. 547, mentionnant un testament ou des adieux, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 547. sayfasından bir alıntı, son vasiyet veya ahit, ölüm ve geçiş anı, defin, mezar ve istirahat yerinden bahsetmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, \"Vasiyetler, Miraslar, Antikalar ve İstirahat Yerleri\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 547, menyebutkan wasiat atau perjanjian terakhir, saat kematian dan wafat, penguburan, kuburan, dan tempat peristirahatan; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Peristirahatan\"."
