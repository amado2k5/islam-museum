label: { ar: "جامع الترمذي 3289 — الأب والأبوة", en: "Jami' al-Tirmidhi 3289 — the father and fatherhood", ur: "جامع ترمذی 3289 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3289 — El padre y la paternidad" }
text: "… حُمَيْدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، حَدَّثَنَا سُلَيْمَانُ بْنُ كَثِيرٍ، عَنْ حُصَيْنٍ، عَنْ مُحَمَّدِ بْنِ جُبَيْرِ بْنِ مُطْعِمٍ، عَنْ أَبِيهِ، قَالَ انْشَقَّ الْقَمَرُ عَلَى عَهْدِ النَّبِيِّ حَتَّى صَارَ فِرْقَتَيْنِ عَلَى هَذَا الْجَبَلِ وَعَلَى هَذَا الْجَبَلِ فَقَالُوا سَحَرَنَا مُحَمَّدٌ فَقَالَ بَعْضُهُمْ لَئِنْ كَانَ سَحَرَنَا مَا يَسْتَطِيعُ أَنْ يَسْحَرَ النَّاسَ كُلَّهُمْ. قَالَ أَبُو عِيسَى وَقَدْ رَوَى بَعْضُهُمْ هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3289، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3289 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3289، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3289 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
