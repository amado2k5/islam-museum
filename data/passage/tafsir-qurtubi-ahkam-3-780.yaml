text: "… السفر المندوب كزيارة الإخوان من الفضلاء والصالحين، أو المباح في طلب الرزق الزائد على الكفاية. وأما السفر الواجب في طلب القوت الضروري، أو فتح بلد إذا تحقّق ذلك، أو دفع عدّو، فالمرء فيه مخيّر ولا يجب عليه الإمساك؛ بل الفطر …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 780، يرد فيه ذكر الواجب، وما يجب على المكلف، والمندوب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 780, whose wording mentions the obligatory (wajib), what is binding on the person addressed, the recommended (mandub), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 780 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، مندوب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volume numérisé 3, p. 780, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, le recommandé (mandub), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volumen digitalizado 3, p. 780, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo recomendado (mandub), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin 3. cildinin 780. sayfasından, farz olan amelleri, sorumlu kişiden beklenenleri, müstehap olan amelleri ve caiz olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan amelleri, görevleri, itaat amellerini, müstehap olan amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları sıralayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Jami' li-Ahkam al-Qur'an karya Al-Qurtubi, Volume 3, halaman 780, yang menyebutkan amalan wajib, apa yang dituntut dari orang yang bertanggung jawab, amalan yang dianjurkan, dan amalan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
