text: "… السفر المندوب كزيارة الإخوان من الفضلاء والصالحين، أو المباح في طلب الرزق الزائد على الكفاية. وأما السفر الواجب في طلب القوت الضروري، أو فتح بلد إذا تحقّق ذلك، أو دفع عدّو، فالمرء فيه مخيّر ولا يجب عليه الإمساك؛ بل الفطر …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 780، يرد فيه ذكر الواجب، وما يجب على المكلف، والمندوب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 780, whose wording mentions the obligatory (wajib), what is binding on the person addressed, the recommended (mandub), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
