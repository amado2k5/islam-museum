text: "… أشرَكَ بعدَما يُسلِمُ عملاً، وتُفارِقُ المُشرِكينَ إلى المسلمينَ. ما لي أُمسِكُ بحُجَزِكم عن النّارِ، ألا وإنَّ ربِّي تبارك وتعالى داعيَّ وسائلي: هل بَلَّغتَ عِبادي؟ وإنّي قائلٌ: ربِّ قد بَلَّغتُهم، فليُبلِّغِ الشّاهدُ منكم الغائبَ. ثمَّ إِنَّكم مَدعُوُّونَ مُفدَّمةً أفواهُكم بالغِدَامِ، ثمَّ …"
