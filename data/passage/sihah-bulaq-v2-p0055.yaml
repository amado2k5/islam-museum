  • (قدا,
  كا قالوا ما أحستمنهم أحدافالفوا احدى السينين استثق الافهدا أجد ر أن ي- تثقل لانهما
  جميعا متمتر كان ⁦( فى)⁩ فى الشقفاه وأفناه غيره وتفانوا أى أخنى بعضهم يعضافى الحرب
  وفقاه الدارما امتتمن جوانيها وابهع أقنية ويقال هو من أفناء الناس اذا لم يعلم من هو
  أبوعمر وشجرة فذواء أى ذات أفنان وهوعلى غيرقياس لان قياسه فناء والفنامة صورعذب
  التعلب الواحدة فناة قال زهير .
  كأنقتات المهن فى كل منزل • نزان به حب الفمالم يعطم
  ويقال *وشجرله حب أحر تخذمنه القلائد والفقاة أيضا البقرة والجمع فنوات والافانى نبت
  مادام رطبا فاذا ييس فه والحماط واحدتها أفانية مثال يمانيسة ويقال هوأيضاعذب
  المعلب أبوع رفانيته أى داريته قال المكميت • كما يضانى الشموس قائدها * الاموى
  للوعاء والظرف وماقدّر تقدير الوعاء تقول الماء فى الاناءوزيد فى الدار والشك فى الخبروقد
  يكون بعف على كقوله تعالى ولا صابنكم فى جذوع النخل وزعم يونس أنّ العرب تقول
  نزات فى أبيدير يدون عليه وربما استعمل بمعنى الباء قال زيدانخيل
  ويركب يوم الروع فيها فوارس • يصيرون فى طعن الاياهر والكلى
  أى بطعن الاباهر والكلى
  صل القاف با لقباء الذى يلبس والمع الاقبية وتقبيت قباءاذ البست
  والقبو الضم قال الخليل نبرة مقبوة أى مضمومة وقية الشاة اذ الم تندر يحتمل أن تكون من
  ه_ذا الباب والهاءء وض من الواورهى هنة متصلة بالكرش ذات أطبدق وقباء ممدود
  موضع بالجازيذكرويؤنت ( تا لقتوالخدمة وقد قتون أقتوقتوا ومتى أى خدمب
  مثال غزوت أغزوغزوا ومخزى وقال
  انى امرؤمن :ف فزارة لا • أحسن قتو الملول والخبيا
  ويقال الخادم مقتوىّ بفتح الميم وتشديد الياه كانه منسوب الى المقى وهو مصدر كما قالوا
  ضيعة عجزية للتى لاتفى غلتها بخراجها ويجوز تخفيفياء النسسبة قال عمرو بن كانوم
  متى كالامك مقتوينا* قال أبو عبيدة قال رجل من بي الحرماز هذارجل مقتوين
  ورجلان مقتوين ورجال.نوين كلهسواء وكذلك المونث رهم الذين يعملون للناس بطعام
  بطونهم قال سدويه سألوا النخليسل عن مقتوى ومقتو ين فقال هو بمنزلة الاشعرىّ
  والاشعرين ⁦( قما)⁩ الاقحوان البابونج على أفعلان وهو نبت طيب الريح حواليه ورق
  أبيض ووسطه أصهر ويصغر على أقيحىّ لانه يجسمع على أقاحى بحذف الالف والنون وان
  ثقت قلت أقاح بلاتشديد والمقعوّمن الاودية الذى فيه الا قحوان والافحوانة اسم موضع
  قدا) القدوة الاسوة يقال فلان قدوة يقتدى به وقديضم فيقال لى بك قدوة وقدوة
  وفدة وقدا اللحم والطعام يقد وقدوا وقدى يقدى قديا وقدى بالكسر يقدى قدى كاه بمعنى
  اذا شم.ت له رأئحة طيبة يقال شممت قداة القدرفهى قدية على فعلة أى طيبة الريح وما
