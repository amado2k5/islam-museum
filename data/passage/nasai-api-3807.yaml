label: { ar: "سنن النسائي 3807 — من أطاع الله ورسوله", en: "Sunan al-Nasa'i 3807 — whoever obeys God and His Messenger", ur: "سنن نسائی 3807 — جس نے اللہ اور اس کے رسول کی اطاعت کی", fr: "Sunan al-Nasa'i 3807 — celui qui obéit à Dieu et à Son Messager", es: "Sunan al-Nasa'i 3807 — quien obedece a Dios y a Su Mensajero", tr: "Sunan an-Nasa'i 3807 — Allah'a ve Resulüne itaat eden kimse", id: "Sunan an-Nasa'i 3807 — Barangsiapa yang taat kepada Allah dan Rasul-Nya" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا يَحْيَى، قَالَ حَدَّثَنَا مَالِكٌ، قَالَ حَدَّثَنِي طَلْحَةُ بْنُ عَبْدِ الْمَلِكِ، عَنِ الْقَاسِمِ، عَنْ عَائِشَةَ، قَالَتْ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ نَذَرَ أَنْ يُطِيعَ اللَّهَ فَلْيُطِعْهُ وَمَنْ نَذَرَ أَنْ يَعْصِيَ اللَّهَ فَلاَ يَعْصِهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3807، يرد فيه ذكر من أطاع الله ورسوله. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 3807 (The Book of Agriculture), whose wording mentions whoever obeys God and His Messenger. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 3807، جس کے الفاظ میں جس نے اللہ اور اس کے رسول کی اطاعت کی کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 3807, dont le texte mentionne celui qui obéit à Dieu et à Son Messager. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 3807, cuyo texto menciona quien obedece a Dios y a Su Mensajero. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de yer alan 3807 numaralı hadis, Allah'a ve Resulüne itaat edenlerden bahsetmektedir. Bu hadis, farz, ibadet, sünnet, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3807, menyebutkan orang-orang yang taat kepada Allah dan Rasul-Nya. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
