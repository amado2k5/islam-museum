text: "… شعب الإيمان. - وعن الحسن مرسلاً، قال: قال رسول اللّٰه وي : يأتي على الناس زمان يكون حديثهم في مساجدهم في أمر دنياهم. فلا تجالسوهم؛ فليس الله فيهم حاجة. رواه البيهقي في شعب الإيمان. صحيح: الترمذي. صحيح الجامع. ضعيف: أبو …"
