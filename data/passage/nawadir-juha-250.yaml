label: { ar: "نوادر جحا الكبرى، ص 122 — «أنت لا تفين دين الخالق فكيف تفين دين المخلوق؟»", en: "Nawadir Juha al-Kubra, p. 122 — 'You Do Not Repay the Creator's Debt, So How the Creature's?'", ur: "نوادر جحا الکبریٰ، ص 122 — «تم خالق کا قرض ادا نہیں کرتیں تو مخلوق کا کیسے کرو گی؟»", fr: "Nawadir Juha al-Kubra, p. 122 — « Tu ne t'acquittes pas de la dette du Créateur, comment t'acquitteras-tu de celle de la créature ? »", es: "Nawadir Juha al-Kubra, p. 122 — «Tú no pagas la deuda del Creador, ¿cómo pagarás la de una criatura?»", tr: "Cuha'nın Büyük Öyküleri, s. 122 — “Yaratıcının dinini yerine getirmiyorsunuz, öyleyse yaratılanın dinini nasıl yerine getirebilirsiniz?”", id: "Anekdot-Anekdot Hebat Juha, hlm. 122 — “Kamu tidak memenuhi agama Sang Pencipta, jadi bagaimana kamu dapat memenuhi agama ciptaan?”" }
text: "… أنتِ لا تفِينَ دَين الخالق فكيف تفين دَين المخلوق؟ كان يبيع زيتوناً، فجاءت امرأةٌ وسامتٍ الثمن فرأتهُ غالياً، فاعترضَتْ على ذلك. فقال الشيخ: أيَّتها المرأة هذا زيتون، ليس من الزيتون الساقط، فهو قد أعتُنِي بزرعه وقطفه، فذوقي واحدة، تريه حلواً، …"
summary:
  ar: "كان جحا يبيع الزيتون فساومته امرأة على السعر وطلبت الشراء بالدين، فسألها جحا هل سددت دينها لله، أي صيام رمضان، فكيف ستسدد لمخلوق. {cite:juha-nawadir-kubra-djuwaydi p. 122}"
  en: "Juha sells olives, and a woman haggles over the price and asks to buy on credit. Juha asks whether she has repaid her debt to God, meaning the Ramadan fasts, and so how she will repay a creature. {cite:juha-nawadir-kubra-djuwaydi p. 122}"
  ur: "جحا زیتون بیچ رہا ہے اور ایک عورت قیمت پر بھاؤ تاؤ کرتی ہے اور ادھار پر خریدنا چاہتی ہے۔ جحا اس سے پوچھتا ہے کہ کیا اس نے اللہ کا قرض، یعنی رمضان کے روزے، ادا کر دیا ہے، تو وہ ایک مخلوق کا قرض کیسے ادا کرے گی۔ {cite:juha-nawadir-kubra-djuwaydi p. 122}"
  fr: "Juha vend des olives, et une femme marchande le prix et demande à acheter à crédit. Juha lui demande si elle a remboursé sa dette envers Dieu, c'est-à-dire les jeûnes du Ramadan, et comment elle remboursera donc une créature. {cite:juha-nawadir-kubra-djuwaydi p. 122}"
  es: "Juha vende aceitunas, y una mujer regatea el precio y pide comprar a crédito. Juha le pregunta si ha saldado su deuda con Dios, es decir, los ayunos de Ramadán, y cómo pagará entonces a una criatura. {cite:juha-nawadir-kubra-djuwaydi p. 122}"
  tr: "Juha zeytin satarken bir kadın fiyat konusunda pazarlık yaptı ve verasetle almak istedi. Juha kadına, Ramazan ayında oruç tutarak Allah'a olan yükümlülüğünü yerine getirdiyse, bir insana nasıl borç ödeyebileceğini sordu. {cite:juha-nawadir-kubra-djuwaydi s. 122}"
  id: "Juha sedang menjual buah zaitun ketika seorang wanita menawar harga dan meminta untuk membeli secara kredit. Juha bertanya kepadanya apakah dia telah memenuhi kewajibannya kepada Tuhan, yaitu berpuasa selama Ramadan, jadi bagaimana dia bisa membayar kepada manusia? {cite:juha-nawadir-kubra-djuwaydi p. 122}"
