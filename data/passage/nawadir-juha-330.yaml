text: "… خلاصة الطبِّ قال الشيخ يوماً : إنَّ خُلاصة الطبِّ أن تُدفِّئ رجليك، وتُبرِّد رأسك، وتعتنِيَ بطعامِك، ولا تفكر طويلاً فيما يهمُّك. ا ضيف اللَّه يذهب لبيت اللَّه كان أحد القرويين قد قلّ حياؤُهُ، وتجرد من فضائل الأخلاق، فلا يتعاطى شغلاً، …"
summary:
  ar: "ذكر جحا خلاصة الطب: أن تُدفأ القدمان ويُبرَّد الرأس ويُعتنى بالطعام ولا يُطال التفكير فيما يقلق. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  en: "Juha states the essence of medicine: warm the feet, cool the head, care for food, and do not think long about what worries you. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  ur: "جحا نے طب کا خلاصہ بیان کیا کہ پاؤں کو گرم رکھو، سر کو ٹھنڈا رکھو، کھانے کا خیال رکھو، اور جو بات پریشان کرتی ہے اس کے بارے میں دیر تک نہ سوچو۔ {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  fr: "Juha énonce l'essentiel de la médecine : tenir les pieds au chaud, la tête au frais, soigner son alimentation, et ne pas penser longtemps à ce qui inquiète. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  es: "Juha enuncia la esencia de la medicina: mantener calientes los pies, fresca la cabeza, cuidar la comida y no pensar mucho en lo que preocupa. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
  tr: "Juha, tıbbın özünü şöyle özetlemiştir: ayakları sıcak tutmak, başı serin tutmak, beslenmeye dikkat etmek ve endişelere kapılmamak. {cite:juha-nawadir-kubra-djuwaydi s. 163}"
  id: "Juha merangkum esensi pengobatan: menjaga kaki tetap hangat, kepala tetap sejuk, memperhatikan makanan, dan tidak terlalu larut dalam kekhawatiran. {cite:juha-nawadir-kubra-djuwaydi p. 163}"
