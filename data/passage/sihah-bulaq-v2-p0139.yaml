text: |-
  ٤٤٨
  •⁦(فصل الباء)⁩.
  .⁦(:لا)⁩.
  والبغايا أيض الطلائع التى تكون قبل ورود الجيش وبيت طفيل
  على الاماءادل منه على الطلائع • قال الاصمعى رفعنا بفى السماء خلفنا أى معظم مطرها
  والبغى اختيال ومرح فى الفرس قال الخليل ولا يقال فرس باغ وبغيت الشئ طلبته ويقال
  فمت المال من مبغاته كمانقول أتيت الامرمن مأتاته تريد المأتى والمبغى وبغنتك الشى طلبت
  لك ومنه قول الشاعر• لمبغيه خيرا وليس بفاءل• وقولهم يذفى لك أن تفعل كذا هومن
  أفعال الماوعة يقال بغيسه فأنبفى كماتة ول كسرته فانكسر وأيفيتسك الشئ أيضا جعلتك
  طالباله وابتغيت الشى وتبغيته اذاطلبته وبغيته قال ساعدة بن جؤية الهذلى.
  ولكنما أهلى بواد أنيسه * سباع تبغى الناس مثنى وه وحدا
  وتساغوا أى إنى بعضهم على بعض ى بقى الشى ييق بقاء وكذلك بقى الرجل زمانا
  فويلا أئش وأبقاه اللٰه وإقى من الشئ بقية والباقية توضع موضع المصدر قال اللّٰه تعالى
  فهل ترى اهم من باقية أى بقاء وأيقيت على فلان اذا أرعيت عليه ورحته يقال لا أبقى اللّٰه
  علمك ان أبقت علىّ والاسم منه البقيا قال الشاعر
  فابقيا علركتمانى • ولكن خفتماصرد النبال
  وكذلك البقوى بفتح الباه ويقيته أبقية أى نظرت اليه وترقبته قال كثير
  فازلت أبق الظعن -تق كأنها • أواقى سدى تغتالهن الحوائك
  يقول شبهت الاظعان فى تباعدها عن عيق ودخولها فى السراب بالغزل الذى تسديه الحاكة
  فيتناقص أولا فأوّلا وفى الحديث بقينا رسول اللّٰه صلى اللّٰه عليه وسلم أى انتظرناه ويقيته
  بالتشديدواً بقيته وتبقيته كله بعنى واستبقيت من الذى أى تركت بعضه واستباه استحياه
  وطيء تقول بقا ويقت مكان بقى وبقيت وكذلك أخواتها من المعتل قال البولانىْ
  نستوقد النبل بالحضيض ونصث طادنة وسابنت على الكرم
  أى بنيت يعى اذا أخطأ يورى النار ⁦(بكى)⁩. البكايمد ويقصرفاذامددت أردت
  الموت الذى يكون مع البكاء واذاقصرت أردت الدموع وخروجها قال الشاعر
  بكت عين وحقلها بكاها • وما يغنى البكاءولا العويل
  ويكيته وبكيت عليه بمعني قال الاصمعىّ بكيت الرجل وبكينه بالتشديد كلاهما اذا بكيت
  عليه وأبو زيد مشله وأيكيته اذا صنعت به ماسيكسسه ويا كيته فيكيته اذا كنت أبكى
  منه قال الشاعر
  الشمس طالعة ليست بكاسفة • تبكى عليك نجوم الليل والقمرا
  واستبكيته وأبكيته بعنى وتياكى تكاف البكاء والبكى الكثير البكاء على فعيل والبكعلى فعول
  جمع بالكمنل جالس وجلوس الاأنهم قلبوا الواوياه ( ا يقال ناقة بلوسة ربكسر
  الباءوبلى سفرلاتى قد أبلاها السة روالجمع أبلاء وأنتد الاصعى
  ومنهل من الانيس نائى *شده لون الارض بالسماء• داويته برجع آبلاء
  والبلوة أيضا بالكسر والبلية مثله والبلية والبلوى والبلاء واحد والجع البلاياصر فوافعاكل
  الى فعالى كماقلناه فى ادارة والبلية أيضا الناقة التى كانت تعقل فى الجاهلية عن دقبر صاحيها
