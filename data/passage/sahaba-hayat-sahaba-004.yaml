text: "بخبر من أخبار قريش ولم يأمره بقتال، وذلك فى الشهر الحرام وكتب له كتابا قبل ان يعلمه اين يسير، فقال: اخرج انت و أصحابك حتى اذا سرت يومين فافتح كتابك وانظر فيه فما أمرتك فيه فامض له و لا تستكرهن"
