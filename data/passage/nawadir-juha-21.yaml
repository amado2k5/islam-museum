text: "… لم يصبها شيء خرج يوماً للاحتطاب في الجبل، وأخذ معه بضع بطيخات، يروي بها عطشه، في ذلك الجبل الذي لا ماء فيه، فكان كلما أصابه العطش، يكسر بطيخة، فيأكل منها قطعة ثم يرميها على مزبلة كانت هناك بحجة أنها غير …"
summary:
  ar: "أكل جحا البطيخ في جبل لا ماء فيه، ورمى ما أكله نصفًا في كومة روث، ثم عاد فأكله من القذارة قائلًا إن هذه ما زالت نظيفة. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  en: "Juha eats melons on a waterless mountain, throwing the half-eaten ones on a dung heap, and later eats them from the filth, saying 'this one is still clean'. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  ur: "جحا نے بے آب پہاڑ پر خربوزے کھائے اور آدھے کھائے ہوئے خربوزے گوبر کے ڈھیر پر پھینک دیے، پھر بعد میں انہیں گندگی میں سے اٹھا کر کھایا اور کہا کہ «یہ ابھی صاف ہے»۔ {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  fr: "Juha mange des melons sur une montagne sans eau, jette les moitiés entamées sur un tas de fumier, puis les ramasse dans la saleté pour les manger en disant : «celui-ci est encore propre». {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  es: "Juha come melones en una montaña sin agua, arroja los mordidos a un montón de estiércol y luego los come de entre la inmundicia diciendo: «este todavía está limpio». {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  tr: "Juha, susuz bir dağda karpuz yedi, yediğinin yarısını bir gübre yığınına attı, sonra geri dönüp kalanını o pislikten yedi ve bunun hala temiz olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 16}"
  id: "Juha memakan semangka di gunung yang tidak berair, membuang setengah dari yang dimakannya ke tumpukan kotoran, lalu kembali dan memakannya dari kotoran itu, sambil berkata bahwa itu masih bersih. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
