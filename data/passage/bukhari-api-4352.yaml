label: { ar: "صحيح البخاري 4352 — الحرام", en: "Sahih al-Bukhari 4352 — the unlawful", ur: "صحیح بخاری 4352 — حرام", es: "Sahih al-Bukhari 4352 — lo ilícito", fr: "Sahih al-Bukhari 4352 — l'illicite", tr: "Sahih el-Buhari 4352 — Haram", id: "Sahih al-Bukhari 4352 — Haram" }
text: "… قَالَ عَطَاءٌ قَالَ جَابِرٌ أَمَرَ النَّبِيُّ عَلِيًّا أَنْ يُقِيمَ عَلَى إِحْرَامِهِ. زَادَ مُحَمَّدُ بْنُ بَكْرٍ عَنِ ابْنِ جُرَيْجٍ، قَالَ عَطَاءٌ قَالَ جَابِرٌ فَقَدِمَ عَلِيُّ بْنُ أَبِي طَالِبٍ بِسِعَايَتِهِ، قَالَ لَهُ النَّبِيُّ \" بِمَ أَهْلَلْتَ يَا عَلِيُّ \". قَالَ بِمَا أَهَلَّ بِهِ النَّبِيُّ قَالَ \" فَأَهْدِ وَامْكُثْ حَرَامًا كَمَا أَنْتَ \". قَالَ وَأَهْدَى لَهُ عَلِيٌّ هَدْيًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 4352، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4352 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4352، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4352 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona lo ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4352 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 4352 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısı, bunu Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4352, menyebutkan apa yang dilarang. Peramban Halal dan Haram menggabungkan ini dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
