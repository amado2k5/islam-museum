label:
  ar: "الترمذي 2400 — من ابتليته بحبيبتيه فصبر عوضته الجنة"
  en: "Tirmidhi 2400 — Whoever I try with the loss of his eyes and is patient, I give him Paradise"
  ur: "ترمذی 2400 — جس کی دونوں آنکھیں لے کر میں آزماؤں اور وہ صبر کرے، اسے جنت دیتا ہوں"
text: "إن الله يقول إذا أخذت كريمتى عبدي في الدنيا لم يكن له جزاء عندي إلا الجنة . وفي الباب عن أبي هريرة وزيد بن أرقم . قال أبو عيسى هذا حديث حسن غريب من هذا الوجه . وأبو ظلال اسمه …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2400: من ابتليته بحبيبتيه فصبر عوضته الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2400: Whoever I try with the loss of his eyes and is patient, I give him Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2400: جس کی دونوں آنکھیں لے کر میں آزماؤں اور وہ صبر کرے، اسے جنت دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
