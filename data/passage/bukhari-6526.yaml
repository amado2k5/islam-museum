ref: "6526"
label:
  ar: "البخاري 6526 — فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك"
  en: "Bukhari 6526 — I will say: O Lord, my companions; and it will be said: you do not know what they did after you"
  ur: "بخاری 6526 — میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا"
text: "سيجاء برجال من أمتي فيؤخذ بهم ذات الشمال فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك فأقول كما قال العبد الصالح …"
summary:
  ar: "حديث قدسي في البخاري، رقم 6526: فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Bukhari, no. 6526: I will say: O Lord, my companions; and it will be said: you do not know what they did after you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "بخاری میں حدیثِ قدسی، نمبر 6526: میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
