label: { ar: "الموطأ 1094 — مالك: من نسي السعي بين الصفا والمروة في عمرة فلم يذكر حتى يستبعد من مكة، فإنه يرجع فيسعى؛ وإن كان قد أصاب النساء فليرجع فليسع حتى يتم ما بقي عليه من تلك العمرة، ثم عليه عمرة أخرى والهدي", en: "Muwatta 1094", es: "Muwatta 1094", fr: "Muwatta 1094", ur: "موطا 1094", tr: "El-Muvatta 1094 — Malik: Umre sırasında Safa ile Merve arasında Sa'i yapmayı unutan ve Mekke'den ayrıldıktan sonra hatırlayan kimse, geri dönüp Sa'i yapmalıdır. Eğer karısıyla cinsel ilişkiye girmişse, Umre'nin geri kalanını tamamlayana kadar geri dönüp Sa'i yapmalıdır. Sonra başka bir Umre yapmalı ve kurban kesmelidir.", id: "Al-Muwatta 1094 — Malik: Barang siapa yang lupa melaksanakan Sa'i antara Safa dan Marwa selama Umrah dan baru ingat setelah meninggalkan Mekah, maka ia harus kembali dan melaksanakan Sa'i. Jika ia telah bersetubuh dengan istrinya, maka ia harus kembali dan melaksanakan Sa'i hingga menyelesaikan sisa Umrah tersebut. Kemudian ia harus melaksanakan Umrah lagi dan mempersembahkan hewan kurban." }
summary:
  ar: "قول لمالك: من نسي السعي بين الصفا والمروة في عمرة فلم يذكر حتى يستبعد من مكة، فإنه يرجع فيسعى. وإن كان قد أصاب النساء فليرجع فليسع حتى يتم ما بقي عليه من تلك العمرة، ثم عليه عمرة أخرى والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1318). {cite:muwatta-maruf-1997 p.502}"
  tr: "Malik şöyle demiştir: Umre sırasında Safa ile Merve arasında Sa'i (ritüel yürüyüş) yapmayı unutan ve Mekke'den ayrıldıktan sonra hatırlayan kimse, geri dönüp Sa'i yapmalıdır. Karısıyla cinsel ilişkiye girmişse, Umre'nin geri kalanını tamamlayana kadar geri dönüp Sa'i yapmalıdır. Sonra başka bir Umre yapmalı ve kurban kesmelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1318) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.502}"
  id: "Malik berkata: Jika seseorang lupa melaksanakan Sa'i (berjalan ritual) antara Safa dan Marwa selama Umrah dan baru ingat setelah meninggalkan Mekah, maka ia harus kembali dan melaksanakan Sa'i. Jika ia telah bersetubuh dengan istrinya, maka ia harus kembali dan melaksanakan Sa'i hingga menyelesaikan sisa Umrah tersebut. Kemudian ia harus melaksanakan Umrah lagi dan mempersembahkan hewan kurban. Peneliti menyebutkan bahwa hadis ini diriwayatkan dari Malik oleh Abu Mus'ab (1318). {cite:muwatta-maruf-1997 p.502}"
