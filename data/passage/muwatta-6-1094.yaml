label: { ar: "الموطأ 1094 — مالك: من نسي السعي بين الصفا والمروة في عمرة فلم يذكر حتى يستبعد من مكة، فإنه يرجع فيسعى؛ وإن كان قد أصاب النساء فليرجع فليسع حتى يتم ما بقي عليه من تلك العمرة، ثم عليه عمرة أخرى والهدي", en: "Muwatta 1094" }
summary:
  ar: "قول لمالك: من نسي السعي بين الصفا والمروة في عمرة فلم يذكر حتى يستبعد من مكة، فإنه يرجع فيسعى. وإن كان قد أصاب النساء فليرجع فليسع حتى يتم ما بقي عليه من تلك العمرة، ثم عليه عمرة أخرى والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1318). {cite:muwatta-maruf-1997 p.502}"
