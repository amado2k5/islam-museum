text: "… جمفر ورأيت أنا فى زماننا عند أبى يعلى حمزة الحسنى مصحفا قد سقط منه أوراق بخط على بن ألى طالب يتوارثه بذو حسن على مر الزمان وهذا ترتيب السور من ذلك المصحف أخبار القراء السبعة وأسماء رواياتهم وقراءتهم أبو عمرو …"
summary:
