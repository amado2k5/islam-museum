label: { ar: "الموطأ 296 — النعمان بن بشير: كان يقرأ في الجمعة بسورة الغاشية بعد سورة الجمعة", en: "Muwatta 296", es: "Muwatta 296", fr: "Muwatta 296", ur: "موطا 296", tr: "El-Muvatta 296 — El-Nu'man ibn Beşir: Cuma günleri Cum'a Sûresi'nden sonra Gâşiye Sûresi'ni okurdu.", id: "Al-Muwatta 296 — Al-Nu’man ibn Bashir: Beliau biasa membaca Surat Al-Ghashiyah setelah Surat Al-Jumu’ah pada hari Jum’at" }
summary:
  ar: "أول حديث في باب القراءة في صلاة الجمعة والاحتباء ومن تركها من غير عذر. يرويه يحيى عن مالك عن ضمرة بن سعيد المازني عن عبيد الله بن عبد الله بن عتبة: سأل الضحاك بن قيس النعمان بن بشير عما كان النبي يقرأ به يوم الجمعة بعد سورة الجمعة، فأخبره أنه كان يقرأ بسورة الغاشية. ويخرّجه المحقق عند أبي داود (1123) والنسائي (3/112) وابن حبان والدارمي وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (16/321). {cite:muwatta-maruf-1997 p.168}"
  id: "Hadits pertama dalam bab ini tentang bacaan dalam salat Jumat, yaitu duduk dengan lutut ditarik ke dada, dan orang yang meninggalkannya tanpa alasan. Diriwayatkan oleh Yahya dari Malik, dari Damrah ibn Sa'id al-Mazini, dari 'Ubayd Allah ibn 'Abd Allah ibn 'Utbah: Al-Dahhak ibn Qays bertanya kepada al-Nu'man ibn Bashir apa yang biasa dibaca Nabi (shalawat dan salam kepadanya) pada hari Jumat setelah Surah al-Jumu'ah, dan dia memberitahunya bahwa beliau biasa membaca Surah al-Ghashiyah. Peneliti memasukkannya ke dalam kumpulan Abu Dawud (1123), al-Nasa'i (3/112), Ibnu Hibban, al-Darimi, Ahmad, dan al-Bayhaqi melalui rantai penularan sahabat Malik, dan merujuk pada al-Tamhid (16/321). {mengutip:muwatta-maruf-1997 hal.168}"
