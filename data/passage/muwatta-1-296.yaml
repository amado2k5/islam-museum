label: { ar: "الموطأ 296 — النعمان بن بشير: كان يقرأ في الجمعة بسورة الغاشية بعد سورة الجمعة", en: "Muwatta 296" }
summary:
  ar: "أول حديث في باب القراءة في صلاة الجمعة والاحتباء ومن تركها من غير عذر. يرويه يحيى عن مالك عن ضمرة بن سعيد المازني عن عبيد الله بن عبد الله بن عتبة: سأل الضحاك بن قيس النعمان بن بشير عما كان النبي يقرأ به يوم الجمعة بعد سورة الجمعة، فأخبره أنه كان يقرأ بسورة الغاشية. ويخرّجه المحقق عند أبي داود (1123) والنسائي (3/112) وابن حبان والدارمي وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (16/321). {cite:muwatta-maruf-1997 p.168}"
