text: "… الفراريج حزينة على أمِّها ضاعت دجاجة الشيخ فأتى بخرق سوداء وربطها في أعناق الفراريج وتركها. فقالوا له : ما هذا؟ فقال: حزِنوا على موتِ أَمّهِم! الحمدُ للَّه سرق له ذات يوم ألفُ غرش، وذهبَ إلى الجامع. وظلَّ يتضرَّعُ، ويدعو اللَّه …"
summary:
  ar: "ماتت دجاجة جحا، فوضع خرقًا سوداء على أعناق الفراخ، وقال إنها حزينة على أمها. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  en: "Juha loses his hen, puts black rags on the chicks' necks, and says they are mourning their mother. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  ur: "جحا کی مرغی مر گئی تو اس نے چوزوں کی گردنوں پر کالے چیتھڑے باندھ دیے اور کہا کہ وہ اپنی ماں کا سوگ منا رہے ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  fr: "Juha perd sa poule, met des chiffons noirs au cou des poussins et dit qu'ils sont en deuil de leur mère. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  es: "Juha pierde su gallina, les pone trapos negros en el cuello a los pollitos y dice que están de luto por su madre. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
