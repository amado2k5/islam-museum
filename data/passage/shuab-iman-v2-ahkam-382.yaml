summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 382، يرد فيه ذكر المستحب، وما كان يُكره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
