text: "… الحسن من الثياب والتطيب لقراءة القرآن - روي عن تميم الداري أنه كان إذا قام بالليل فتهجد بالليل اعتكف بالغالية. - وقال مجاهد كانوا يكرهون أكل الثوم والبصل والكراث للقيام من الليل ويستحبون أن يمس الرجل عند قيامه من الليل …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 382، يرد فيه ذكر المستحب، وما كان يُكره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 382, whose wording mentions the recommended (mustahabb), what used to be disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 382 کا اقتباس جس میں مستحب، جو ناپسند کیا جاتا تھا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 382, dont le texte mentionne le recommandé (mustahabb), ce qui était réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 382, cuyo texto menciona lo recomendado (mustahabb), lo que se reprobaba; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 2. cildinin 382. sayfasından, müstehaplı ve mekruhlu amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz ameller, itaat amelleri, müstehaplı ameller, mekruhlu amelleri, haram amelleri ve küçük günahları ele almaktadır."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 382, yang menyebutkan amalan yang dianjurkan dan yang tidak disukai; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
