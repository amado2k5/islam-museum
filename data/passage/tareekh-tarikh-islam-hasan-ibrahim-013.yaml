text: "ير المؤمنين عمر بن الخطاب. وكتب إلى عمر وعرفه قول يحيى . فورد عليه كتاب عمر يقول فيه: وأما الكتب التي ذكرتها، فإن كان فيها ما يوافق كتاب الله، ففي كتاب الله عنه غنى، وإن كان فيها ما يخالف كتاب"
