  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi, volume 2, page 406, mentionne la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
