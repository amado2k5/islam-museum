text: "الجزء الأول ومنها التعشير زعموا أن الرجل إذا أراد دخول قرية فخاف وباءها فوقف على بابها قبل أن يدخلها فعَشَّر كما ينهق الحمار ثم دخلها، لم يصبه وباؤها، قال عُروة آبن الورد : لَعَمْرِي لَيْنْ عَشَّرتُ مِنْ خَشْيَةِ الرَّدىٰ نُهاقَ …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 2، ص 406، يذكر نقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 2, p. 406, that mentions the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 2، ص 406 کا اقتباس جس میں مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
