text: "… منازلُ الأنبياء ما يبلغها غيرهم، قالَ: إي والذي نفسي بيده، رجالٌ آمنوا باللهِ وصدَّقُوا المرسلينَ. خرجاه في الصحيحينِ من حديثِ أبي سعيدِ. الخَصلةُ الثانية : أن يحبَّ المرءَ لا يحبُّه إِلا للهِ. والحبَّ في اللهِ من أصولِ الإيمانِ وأعلَى درجاتِهِ. …"
