text: "… ما لم تمسوهن أوتفرضوا لهن فريضة- فقيل إنه منصوب لا مجزوم بالعطف على تمسوهن لئلا يصير المعنى : لا جناح عليكم فيما يتعلق بمهور النساء إن طلقتموهن في مدة انتفاء أحد هذين الأمرين، مع أنه إذا انتفى الفرض دون المس …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 4، ص 235، يرد فيه ذكر الفريضة والفرائض، والفرض، وما لا حرج فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 4, p. 235, whose wording mentions the obligation (farida), the obligatory (fard), what carries no blame; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 4، ص 235 کا اقتباس جس میں فریضہ اور فرائض، فرض، جس میں کوئی حرج نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, volume numérisé 4, p. 235, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), ce qui n'entraîne aucun blâme ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, volumen digitalizado 4, p. 235, cuyo texto menciona la obligación (farida), lo obligatorio (fard), lo que no acarrea reproche; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 4. cildinin 235. sayfasından bir alıntı, farz olan amelleri, farz amelleri ve caiz olan amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh amelleri, haram amelleri ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 4, halaman 235, membahas tentang amalan wajib, amalan-amalan yang wajib dilakukan, dan amalan-amalan yang diperbolehkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
