label: { ar: "سنن النسائي 3143 — عمل يعدل عملا أعظم منه", en: "Sunan al-Nasa'i 3143 — a deed that equals a greater one", ur: "سنن نسائی 3143 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… حَدَّثَنَا قَتَادَةُ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنْ مَعْدَانَ بْنِ أَبِي طَلْحَةَ، عَنْ أَبِي نَجِيحٍ السُّلَمِيِّ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ بَلَغَ بِسَهْمٍ فِي سَبِيلِ اللَّهِ فَهُوَ لَهُ دَرَجَةٌ فِي الْجَنَّةِ \". فَبَلَّغْتُ يَوْمَئِذٍ سِتَّةَ عَشَرَ سَهْمًا. قَالَ وَسَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ رَمَى بِسَهْمٍ فِي سَبِيلِ اللَّهِ فَهُوَ عِدْلُ مُحَرَّرٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3143، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3143 (The Book of Jihad), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3143، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
