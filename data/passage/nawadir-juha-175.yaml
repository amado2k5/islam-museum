text: "… على كل إنسان أن يحمل ماله تحت رأسِه كان يزرع في النهار النصوبَ في بستانٍ ويقلعُها في الليل، ويأخذُها إلى البيت، فقيل له: ما هذا؟ فأجاب: يا أولادي، الدنيا خربت، فيلزم على كل إنسانٍ أن يجعل ماله تحت رأسه، فمن …"
summary:
  ar: "زرع جحا في البستان بصلات نهارًا وكان يقتلعها ليلًا ليحملها إلى البيت، وقال إن الدنيا فسدت، فعلى كل إنسان أن يجعل ماله تحت رأسه. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  en: "Juha plants onion-like bulbs in the orchard by day and digs them up at night to carry home, saying the world has been ruined, so each person should keep his money under his head. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  ur: "جحا دن کو باغ میں پیاز جیسے گانٹھیں لگاتا اور رات کو انہیں نکال کر گھر لے جاتا، اور کہتا کہ دنیا بگڑ گئی ہے، اس لیے ہر آدمی کو اپنا مال اپنے سر کے نیچے رکھنا چاہیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  fr: "Juha plante le jour des bulbes semblables à des oignons dans le verger et les déterre la nuit pour les rapporter chez lui, disant que le monde est perdu et que chacun devrait garder son argent sous sa tête. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  es: "Juha planta de día bulbos parecidos a cebollas en el huerto y los desentierra de noche para llevarlos a casa, diciendo que el mundo está echado a perder y que cada uno debe guardar su dinero bajo la cabeza. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
