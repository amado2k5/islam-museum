text: "كان يغتسل من إناء هو الفرق من الجنابة"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عائشة، في باب العمل في غسل الجنابة: كان النبي يغتسل من الجنابة من إناء يسمى الفرق. ويفسر المحقق الفرق بثلاثة آصع وقيل صاعان، ويخرّج الحديث عند مسلم (1/175) وأبي داود (238) والبيهقي من طرق أصحاب مالك، ويذكر أن ابن أبي شيبة وأبا عوانة وعبد الرزاق والبغوي أخرجوه من طرق أخرى عن الزهري. {cite:muwatta-maruf-1997 p.89}"
