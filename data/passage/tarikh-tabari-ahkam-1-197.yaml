text: "… مع البيان والافهام حتجة لتعلّم ولا بعد لجحود للبرهان ولحق الّاّ السيف لظهور الحتجة فقال له المتوكّل لم ارد منك ما ذهبت اليه من هذا المعنى قال له يحيى القول بالمحاسن فى المغيب فريضة على ذى نعمة قال نما كان …"
