text: "… مسلم عن أسماء بنت أبي بكر قالت: هذه جبة رسول اللّٰه وَية، فأخرجت جباً طيالِسة كَسِروانية لها لِبْتَةُ دِيباج. وفرجاها مكفوفان بالديباج، فقالت: هذه كانت عند عائشة حتى قُبِضَت، فلما قبضت قبضتُها، وكان الني وَلعَ يلبَسُها، فَنَحنُ نَغْسِلُهَا للمرضى يُسْتَشفى …"
