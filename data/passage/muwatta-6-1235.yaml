label: { ar: "الموطأ 1235 — مالك: لو كان الذي يقولونه لأصبح بمنى أكثر من ستة آلاف امرأة حائض قد أفضن، فلم يقدم الناس نساءهم إن كان لا ينفعهن", en: "Muwatta 1235" }
summary:
  ar: "يذكر مالك قول هشام وعروة وعائشة، ونحن نذكر ذلك، فيقول فلم يقدم الناس نساءهم إن كان ذلك لا ينفعهن، ولو كان الذي يقولونه لأصبح بمنى أكثر من ستة آلاف امرأة حائض، كلهن قد أفضن. {cite:muwatta-maruf-1997 p.552}"
