label: { ar: "الموطأ 1235 — مالك: لو كان الذي يقولونه لأصبح بمنى أكثر من ستة آلاف امرأة حائض قد أفضن، فلم يقدم الناس نساءهم إن كان لا ينفعهن", en: "Muwatta 1235", es: "Muwatta 1235", fr: "Muwatta 1235", ur: "موطا 1235", tr: "El-Muvatta 1235 — Malik: Eğer söyledikleri doğru olsaydı, Mina'da abdest almış altı binden fazla adet gören kadın olurdu. Öyleyse, eğer onlara fayda sağlamayacaksa, insanlar neden kadınlarını öne çıkarırlar ki?", id: "Al-Muwatta 1235 — Malik: Jika apa yang mereka katakan benar, maka akan ada lebih dari enam ribu wanita yang sedang haid di Mina yang telah berwudhu. Lalu mengapa orang-orang membawa istri mereka ke depan jika hal itu tidak bermanfaat bagi mereka?" }
summary:
  ar: "يذكر مالك قول هشام وعروة وعائشة، ونحن نذكر ذلك، فيقول فلم يقدم الناس نساءهم إن كان ذلك لا ينفعهن، ولو كان الذي يقولونه لأصبح بمنى أكثر من ستة آلاف امرأة حائض، كلهن قد أفضن. {cite:muwatta-maruf-1997 p.552}"
  tr: "Malik, Hişam, Urve ve Ayşe'nin sözlerinden bahsetmiş ve biz de aynı şeyi belirtmişizdir. Şöyle der: \"Eğer kendileri için faydalı olmasaydı, insanlar neden kadınlarını öne çıkarırlardı? Eğer söyledikleri doğru olsaydı, Mina'da altı binden fazla adet gören kadın olurdu ve bunların hepsi de Tavafü'l-İfade'yi yapardı.\" {cite:muwatta-maruf-1997 s.552}"
  id: "Malik menyebutkan perkataan Hisham, Urwah, dan Aisha, dan kami pun menyebutkannya. Beliau berkata, \"Mengapa orang-orang mendampingi perempuan mereka jika hal itu tidak bermanfaat bagi mereka? Jika apa yang mereka katakan benar, niscaya akan ada lebih dari enam ribu perempuan haid di Mina, yang semuanya akan melaksanakan Tawaf al-Ifadah.\" {cite:muwatta-maruf-1997 p.552}"
