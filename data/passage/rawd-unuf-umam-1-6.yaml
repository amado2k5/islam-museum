text: "… إمنا التمر ملن أبره، فزاد ذلك تبعا حنقا عليهم فاقتتلوا، فتزعم األنصار أهنم كانوا يقاتلونه ابلنهار.ويقرونه ابلليل فيعجبه ذلك منهم ويقول وهللا إن قومنا لكرام فبينا تبع على ذلك من قتاهلم إذ جاءه حربان من أحبار اليهود، من بين قريظة– …"
