text: |-
  ٥٤٠
  موضع الجتروالقصب فقلت رأيت كليهما وحروت بكليهما كما تتول عليهما وتيقى والرفع على
  حالها وقال الفراءهومثى وهو-أخوذ من كل خففت اللام وزيدت الااف التقنية وكذلك
  كا اللمونت ولا يكونان الامضافين ولا يتكلم منه-هابواحد ولو تكلم به لقيل كل وكات
  وكلان وكلتان واحتج بقول الشاعر
  فى كات رجليها سلامى واحده • كلتاهمامة رونة مزائدة
  أراد فى احدى رجليها : أفرد وهذا القول ضعيف عندأهل البصرة لانه لو كان مثق لوجب
  أن تنقلب ألفه فى النصب والجرياء مع الاسم الظاهر ولان معنى كلا مخالف لمعنى كل لاث كلا
  للاحاطة وكاايدل على شيء مخصوص وأماهذا الشاعر فانماحذو الالف للضرورة وقدرأنها
  زائدة وما يكو: ضرورة لا يجوز أن يجعل حجة فثبت أنه اسم مة ردكعى الاأنه وضع لبدل على
  التننية كم أن قواءم نحن اسم مفرديدل على الاثنيز فمافوقهمايدل على ذلك قول بربر
  كلايومى أمامة يوم صة • وان لم نأتها الالماما
  أنشدنيه أبو على فان قال قائل فلم صاركلا بالياء فى النصب والجرمع المضمر ولزمت الالف مع
  المظهركم لزمت فى الرفع مع المذ، رقيل له قد كانم ن -هاأن تكون بالااف على كل حال مثل
  مصاومعى الاأنهم الما كانت لا تنفك من الاضافة شبهت بعلى ولدى فجعلت بالياء مع المضمر
  فى النصب والجرلات على لا تقسع الامتصوية أومجرورة ولا تستعمل مرفوعة فبقيت كلا
  فى الرفع على أصلها مع المضمر لانها لم تشبه بعلى فى هذه الحال وأمًا كلتا التى للتأنيت فانّ
  سيبويه يقول ألفها للتأنيت والتاء يدلمن لام الفعل وهى واو والاصل كلوا واتما أبدات
  نالان فى التاء-لم التانيت والااء فى كلتا قد تصيرياء مع المضمر فتخرج عنء-لم التانيث
  فصارفى ابدال الواوتاء تأكيد للتأنيت وقال أبوعمرالجرمى التاءملقة والالف لام الفعل
  وتقدير «اعنده فعتل ولو كان الامر على ما زعم لقالوا فى النسبة اليها كاتوى فلما قالوا كاوىّ
  وأسقطوا الناهدل على أنهم أجروها مجرى التاء التى فى أخت التى اذانسبت اليها قلت
  أخوى ( ى كى فلان شهادته يكميها اذا كتمها وانكعى أى أستخقى وتكمى تغطى
  وتكمت الفتنة الناس اذاغشيتهم والكمى الشجاع المتكمى فى سلاحهلانه كمى نفسه أى
  سترها بالدرع والبيضة وابمع الكماة كأنهم جمعوا كام مثل قاض وقضاة والكيميا مثال
  السيماء اسم صنعة وهو عربة ( كنى الكاية أن تتسكلم بشى وتريديه غيره وقد كنيت
  بكذاءن كذاوكنوت وأنند أبوزياد
  وانى لا كنو عن قذور بغيرها * وأعرب أحيانا بها فأصارح
  ورجل كان وقوم كانون والكفية والكفية أيضابالكسرواحدة المكنى واكتنى فلاث
  بكذا وفلان يكنى بأبى عبد اللّٰه ولا تقل يكنى بعبسد اللّٰه وكنيته أبازيد وبابى زيد تكنية وهو
  كنيه كما تقول سميه وكى الرؤياهى الامشال التى يضر بهاملك الرؤيا يكنى بهاءن أعيان
  الامور ⁦(كوى)⁩ الكى معروف وقد كويته فا كتوى هو ويقال آخر الدواء الكى"ولا تقل
  آخر الداه السكى وكواه بعينه اذا أحد اليه النظر وكونه العقرب لدغته وكاويت الرجل
  اذاشاتمته مثل كاوحته والمكواة الميسم وفى المثل العيريضرط والمكواة فى النار والكوة
