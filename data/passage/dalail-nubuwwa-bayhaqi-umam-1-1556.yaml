text: "… : خرج أبو سفيان وقريش ومن اتبعهم من مشركي العرب معهم حُتَيّ بن أخطَب، واستمدُّوا عُيينة ابن حصن بن حذيفة بن بدرٍ، فأقبل بمن أطاعه من غطفان وبنو أبي الحقيق كنانة بن الربيع بن أبي الحقيق سعى في غطفان وحضهم …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1556، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
