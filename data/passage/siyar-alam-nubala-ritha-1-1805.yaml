  tr: "Siyar A'lam al-Nubala'nın Resimli Cilt 1, s. 1805'inden bir alıntı; ölen kişi için bir ağıt ve övgü içeriyor; makineyle okunabilir tıpkıbasım baskısından. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Siyar A'lam al-Nubala', Jilid Bergambar 1, hlm. 1805, berisi elegi dan pujian untuk almarhum; dari edisi faksimili yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
