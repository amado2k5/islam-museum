text: "… مع علمنا بكراهيته للأوثان، نعلم أَيضاً أنه ما كان قبل النبوة مجاهراً بذمِّها بين قريش، ولا معْلِناً بمقتها قبل المبعث، والظاهر أَن زيداً رحه اللّه توفي قبل المبعث، فقد نقل ابن إسحاق أَن ورقة بنَ نوفل رثاه بأبيات، وهي: بدينك …"
summary:
  ar: "مقطع من سير أعلام النبلاء، المجلد المصوَّر 1، ص 1805، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Siyar A'lam al-Nubala', scan volume 1, p. 1805, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "سیر اعلام النبلاء، اسکین جلد 1، ص 1805 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
