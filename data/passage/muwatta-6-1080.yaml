label: { ar: "الموطأ 1080 — مالك في قول عمر: فإن آخر النسك الطواف بالبيت، أن ذلك فيما نرى، والله أعلم، لقول الله تعالى: ومن يعظم شعائر الله فإنها من تقوى القلوب، ومحل الشعائر كلها وانقضاؤها إلى البيت العتيق", en: "Muwatta 1080" }
summary:
  ar: "قول لمالك في قول عمر: فإن آخر النسك الطواف بالبيت، أن ذلك فيما نرى، والله أعلم، لقول الله تعالى: ومن يعظم شعائر الله فإنها من تقوى القلوب، وقوله: ثم محلها إلى البيت العتيق، فمحل الشعائر كلها وانقضاؤها إلى البيت العتيق. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1443). {cite:muwatta-maruf-1997 p.496} {cite:muwatta-maruf-1997 p.497}"
