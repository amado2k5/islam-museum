label: { ar: "الموطأ 1080 — مالك في قول عمر: فإن آخر النسك الطواف بالبيت، أن ذلك فيما نرى، والله أعلم، لقول الله تعالى: ومن يعظم شعائر الله فإنها من تقوى القلوب، ومحل الشعائر كلها وانقضاؤها إلى البيت العتيق", en: "Muwatta 1080", es: "Muwatta 1080", fr: "Muwatta 1080", ur: "موطا 1080", tr: "El-Muvatta 1080 — Malik, Ömer'in \"Ritüellerin sonuncusu Kabe'yi tavaf etmektir\" sözüne ilişkin olarak, bunun bizim inanışımız olduğunu ve Allah'ın en doğrusunu bildiğini, Yüce Allah'ın şu sözüne dayanarak söylemiştir: \"Kim Allah'ın surelerine saygı gösterirse, işte bu kalbin takvasındandır.\" Ve bütün rükünlerin ve ritüellerin tamamlanma yeri Kabe'dir.", id: "Al-Muwatta 1080 — Malik, mengenai pernyataan Umar: \"Ritual terakhir adalah tawaf mengelilingi Baitullah,\" berkata bahwa inilah yang kami yakini, dan Allah Maha Mengetahui, berdasarkan firman Allah Yang Maha Kuasa: \"Dan barangsiapa yang menghormati simbol-simbol Allah, sesungguhnya itu adalah termasuk ketakwaan hati,\" dan tempat segala ritual dan penyempurnaannya adalah Baitullah." }
summary:
  ar: "قول لمالك في قول عمر: فإن آخر النسك الطواف بالبيت، أن ذلك فيما نرى، والله أعلم، لقول الله تعالى: ومن يعظم شعائر الله فإنها من تقوى القلوب، وقوله: ثم محلها إلى البيت العتيق، فمحل الشعائر كلها وانقضاؤها إلى البيت العتيق. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1443). {cite:muwatta-maruf-1997 p.496} {cite:muwatta-maruf-1997 p.497}"
  tr: "Malik, Ömer'in \"Ritüellerin sonuncusu Kâbe'yi tavaf etmektir\" sözüyle ilgili olarak, bunun Allah'ın şu sözlerine dayanarak inandığımız şey olduğunu ve Allah'ın en doğrusunu bildiğini söylemiştir: \"Kim Allah'ın kutsal ritüellerine saygı gösterirse, bu kalbin takvasındandır\" ve \"O halde onun yeri Eski Ev'dedir\". Dolayısıyla, tüm ritüellerin yeri ve sonu Eski Ev'dedir. Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (1443) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.496} {cite:muwatta-maruf-1997 s.497}"
  id: "Malik berkata, mengenai pernyataan Umar: \"Ritual terakhir adalah tawaf Ka'bah,\" bahwa inilah yang kita yakini, dan Allah Maha Mengetahui, berdasarkan firman Allah: \"Dan barangsiapa yang menghormati ritual-ritual suci Allah, maka itu berasal dari ketakwaan hati,\" dan firman-Nya: \"Maka tempatnya adalah di Baitullah.\" Dengan demikian, tempat dan akhir dari semua ritual adalah di Baitullah. Peneliti menyebutkan bahwa Abu Mus'ab (1443) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.496} {cite:muwatta-maruf-1997 p.497}"
