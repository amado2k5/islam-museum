label: { ar: "الموطأ 1955 — مالك: إن باع رجل سلعة مرابحة فقال قامت علي بمائة دينار، ثم جاءه بعد ذلك أنها قامت عليه بمائة وعشرين، خير المبتاع: إن شاء أعطى قيمة السلعة يوم قبضها، وإن شاء أعطى الثمن الذي ابتاع به على حساب ما ربحه، إلا أن يكون أقل من الثمن", en: "Muwatta 1955", es: "Muwatta 1955", fr: "Muwatta 1955", ur: "موطا 1955", tr: "El-Muvatta 1955 — Malik: Bir kimse bir malı kredili olarak satar ve maliyetinin yüz dinar olduğunu söylerse, daha sonra maliyetinin yüz yirmi dinar olduğu ortaya çıkarsa, alıcının seçeneği vardır: İsterse malı aldığı günkü değerini verebilir, isterse de kârını hesaba katarak hesapladığı fiyatı verebilir; ancak bu fiyat, aldığı fiyattan düşük değilse.", id: "Al-Muwatta 1955 — Malik: Jika seseorang menjual suatu barang secara kredit dan mengatakan bahwa harga belinya adalah seratus dinar, kemudian belakangan ia mengetahui bahwa harga belinya adalah seratus dua puluh dinar, maka pembeli memiliki pilihan: jika ia mau, ia dapat memberikan nilai barang tersebut pada hari ia menerimanya, atau jika ia mau, ia dapat memberikan harga belinya, yang dihitung berdasarkan keuntungannya, kecuali jika keuntungannya lebih rendah dari harga beli." }
summary:
  ar: "قال مالك: وإن باع رجل سلعة مرابحة، فقال: قامت علي بمائة دينار، ثم جاءه بعد ذلك أنها قامت عليه بمائة وعشرين دينارا: خير المبتاع. فإن شاء أعطى البائع قيمة السلعة يوم قبضها، وإن شاء أعطى الثمن الذي ابتاع به على حساب ما ربحه، بالغا ما بلغ، إلا أن يكون ذلك أقل من الثمن الذي ابتاع به السلعة. فليس له أن ينقص رب السلعة من الثمن الذي ابتاعها به، لأنه قد كان رضي بذلك، وإنما جاء رب السلعة يطلب الفضل، فليس للمبتاع في هذا حجة على البائع. {cite:muwatta-maruf-1997 p.199} {cite:muwatta-maruf-1997 p.200}"
  tr: "Malik şöyle dedi: Bir adam bir malı kârla satıp, \"Bana yüz dinara mal oldu\" derse ve daha sonra maliyetinin yüz yirmi dinar olduğunu bildirirse, alıcının seçeneği vardır. Ya satıcıya malı aldığı günkü değerini verebilir ya da satın aldığı fiyata kendi kârını ekleyebilir; kârı ne kadar yüksek olursa olsun, satın aldığı fiyattan daha düşük olmadığı sürece. Satıcının ödediği fiyattan indirim yapamaz, çünkü satıcı zaten o fiyata anlaşmış durumdadır. Satıcı sadece kâr elde etmek için gelmiştir, bu nedenle alıcının bu konuda satıcıya karşı bir hakkı yoktur. {cite:muwatta-maruf-1997 s.199} {cite:muwatta-maruf-1997 s.200}"
  id: "Malik berkata: Jika seseorang menjual suatu barang dengan keuntungan, dengan mengatakan, \"Harganya seratus dinar,\" dan kemudian melaporkan bahwa harganya seratus dua puluh dinar, pembeli memiliki pilihan. Ia dapat memberikan kepada penjual nilai barang tersebut pada hari ia menerimanya, atau ia dapat memberikan harga belinya ditambah keuntungannya, berapa pun tingginya, kecuali jika kurang dari harga beli barang tersebut. Ia tidak dapat mengurangi harga yang dibayarkan penjual, karena penjual telah menyetujui harga tersebut. Penjual hanya mencari keuntungan, sehingga pembeli tidak memiliki klaim terhadap penjual dalam hal ini. {cite:muwatta-maruf-1997 p.199} {cite:muwatta-maruf-1997 p.200}"
