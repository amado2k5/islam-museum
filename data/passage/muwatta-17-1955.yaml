label: { ar: "الموطأ 1955 — مالك: إن باع رجل سلعة مرابحة فقال قامت علي بمائة دينار، ثم جاءه بعد ذلك أنها قامت عليه بمائة وعشرين، خير المبتاع: إن شاء أعطى قيمة السلعة يوم قبضها، وإن شاء أعطى الثمن الذي ابتاع به على حساب ما ربحه، إلا أن يكون أقل من الثمن", en: "Muwatta 1955" }
summary:
  ar: "قال مالك: وإن باع رجل سلعة مرابحة، فقال: قامت علي بمائة دينار، ثم جاءه بعد ذلك أنها قامت عليه بمائة وعشرين دينارا: خير المبتاع. فإن شاء أعطى البائع قيمة السلعة يوم قبضها، وإن شاء أعطى الثمن الذي ابتاع به على حساب ما ربحه، بالغا ما بلغ، إلا أن يكون ذلك أقل من الثمن الذي ابتاع به السلعة. فليس له أن ينقص رب السلعة من الثمن الذي ابتاعها به، لأنه قد كان رضي بذلك، وإنما جاء رب السلعة يطلب الفضل، فليس للمبتاع في هذا حجة على البائع. {cite:muwatta-maruf-1997 p.199} {cite:muwatta-maruf-1997 p.200}"
