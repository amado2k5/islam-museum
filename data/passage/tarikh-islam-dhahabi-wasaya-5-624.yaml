text: "… إلاّ وقد أعطي الآيات ما آمن على مثله البشر. مُرُوا أبا بكر فلْيُصَلِّ بالناس... مات رسول اللّٰه وهو بين سَحْري ونحْري... مات رسول اللّٰه ولم يُوصٍ. ما ترك رسول اللّٰه عند موته ديناراً ولا درهماً. نعم، فأستغفروا له فإنّه يُبعث …"
