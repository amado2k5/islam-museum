summary:
  ar: "قال مالك: ولا أرى اللحي الأسفل والأنف من الرأس في جراحهما؛ لأنهما عظمان منفردان، والرأس بعدهما عظم واحد. {cite:muwatta-maruf-1997 p.430}"
  tr: "Malik şöyle dedi: Alt çene ve burun yaralandığında başın bir parçası olarak kabul etmiyorum, çünkü bunlar iki ayrı kemiktir ve baş o zaman tek bir kemik olur. {cite:muwatta-maruf-1997 s.430}"
  id: "Malik berkata: Saya tidak menganggap rahang bawah dan hidung sebagai bagian dari kepala ketika terluka, karena keduanya adalah dua tulang yang terpisah, dan kepala kemudian menjadi satu tulang tunggal. {cite:muwatta-maruf-1997 p.430}"
