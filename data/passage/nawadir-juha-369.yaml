text: "… كرامةُ الشيخ بعد موته بعد وفاة الشيخ بقرنٍ أو قرنين، كان أُلُوفٌ من الناس مجتمِعِين في الجامع الكبير، لصلاة الجمعة، وإذا بقيِّم قبرِهِ أتى من الباب الكبير لابساً لباساً موافقاً لملابس الشيخ، وقال بصوت جهوري: أيها الأخوان: سأقصُ عليكم قصة …"
summary:
  ar: "بعد قرن أو قرنين من وفاة جحا جاء حارس القبر إلى مسجد الجمعة وقال إن جحا ظهر على نعشه وأمر الناس أن يأتوا إليه، فذهبت الجماعة وقرأت الفاتحة، وعادت فوجدت قبة المسجد الكبرى قد انهارت. {cite:juha-nawadir-kubra-djuwaydi p. 182}"
  en: "A century or two after Juha's death, the grave-keeper comes to the Friday mosque and says Juha appeared on his coffin and told the people to come to him; the congregation go, read the Fatiha, and return to find the mosque's great dome has collapsed. {cite:juha-nawadir-kubra-djuwaydi p. 182}"
  ur: "جحا کی وفات کے ایک دو صدی بعد قبر کا نگہبان جمعہ کی مسجد میں آیا اور کہا کہ جحا اس کے تابوت پر ظاہر ہوا اور لوگوں سے کہا کہ اس کے پاس آؤ، جماعت وہاں گئی، فاتحہ پڑھی، اور لوٹی تو دیکھا کہ مسجد کا بڑا گنبد گر چکا تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 182}"
  fr: "Un siècle ou deux après la mort de Juha, le gardien de la tombe vient à la mosquée du vendredi et dit que Juha lui est apparu sur son cercueil et a dit aux gens de venir à lui ; la congrégation s'y rend, récite la Fatiha, et revient pour trouver que le grand dôme de la mosquée s'est effondré. {cite:juha-nawadir-kubra-djuwaydi p. 182}"
  es: "Uno o dos siglos después de la muerte de Juha, el guardián de la tumba llega a la mezquita del viernes y dice que Juha se apareció sobre su ataúd y dijo a la gente que fuera a él; la congregación va, recita la Fatiha y, al volver, encuentra que la gran cúpula de la mezquita se ha derrumbado. {cite:juha-nawadir-kubra-djuwaydi p. 182}"
