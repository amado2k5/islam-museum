label: { ar: "مسلم 2816 — لن يدخل أحداً الجنة عمله", en: "Muslim 2816 — No one's work alone enters him Paradise" }
text: "قالت عائشة: قال رسول الله: «سددوا وقاربوا وأبشروا، فإنه لن يدخل الجنة أحداً عمله» قالوا: ولا أنت يا رسول الله؟ قال: «ولا أنا، إلا أن يتغمدني الله منه برحمة، واعلموا أن أحب العمل إلى الله أدومه وإن قل»"
summary:
  ar: "رواية عائشة في كتاب صفة القيامة من صحيح مسلم؛ الدخول إلى الجنة بالرحمة لا بمجرد العمل، مع الأمر بالسداد والمقاربة — نص جامع للعمل والرحمة."
