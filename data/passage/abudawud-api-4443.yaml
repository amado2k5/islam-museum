label: { ar: "سنن أبي داود 4443 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 4443 — a burial, grave or resting place", ur: "سنن ابی داؤد 4443 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 4443 — un lugar de entierro, tumba o descanso." }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعُ بْنُ الْجَرَّاحِ، عَنْ زَكَرِيَّا أَبِي عِمْرَانَ، قَالَ سَمِعْتُ شَيْخًا، يُحَدِّثُ عَنِ ابْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ رَجَمَ امْرَأَةً فَحُفِرَ لَهَا إِلَى الثَّنْدُوَةِ. قَالَ أَبُو دَاوُدَ أَفْهَمَنِي رَجُلٌ عَنْ عُثْمَانَ. قَالَ أَبُو دَاوُدَ قَالَ الْغَسَّانِيُّ جُهَيْنَةُ وَغَامِدٌ وَبَارِقٌ وَاحِدٌ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4443، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4443 (Prescribed Punishments (Kitab Al-Hudud)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4443، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4443 (Castigos Prescritos (Kitab Al-Hudud)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
