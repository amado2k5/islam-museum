label: { ar: "سنن أبي داود 5012 — الأب والأبوة", en: "Sunan Abi Dawud 5012 — the father and fatherhood", ur: "سنن ابی داؤد 5012 — باپ اور والدیت", es: "Sunan Abi Dawud 5012 — El padre y la paternidad" }
text: "… قَالَ حَدَّثَنِي أَبُو جَعْفَرٍ النَّحْوِيُّ عَبْدُ اللَّهِ بْنُ ثَابِتٍ، قَالَ حَدَّثَنِي صَخْرُ بْنُ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ مِنَ الْبَيَانِ سِحْرًا وَإِنَّ مِنَ الْعِلْمِ جَهْلاً وَإِنَّ مِنَ الشِّعْرِ حُكْمًا وَإِنَّ مِنَ الْقَوْلِ عِيَالاً \". فَقَالَ صَعْصَعَةُ بْنُ صُوحَانَ صَدَقَ نَبِيُّ اللَّهِ أَمَّا قَوْلُهُ \" إِنَّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5012، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5012 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5012، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5012 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
