text: "… النبي ال يمشون أمامه إذا خرج، ويدَعون ظهره للملائكة. رواه الامام أحمد : ذِكْرُ وجوب تقديم محبته الِير على النفس والولد والوالد عن أنس بن مالك قال: قال رسول اللّٰه لِيِ: لا يؤمن أحدكم حتى أكون أحبَّ إليه من نفس …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 79، يذكر ما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
