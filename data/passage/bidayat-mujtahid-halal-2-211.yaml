text: "… كتاب اللّٰه فهو باطل، وإن كان مائة شرط وبقوله المسلمون على شروطهم، إلا شرطاً أحل حراماً، أو حرم حلالاً وهذا يحرم الحلال. وحجة أصحاب القول الأول قوله مطع إن أحق ما وفيتم به من الشروط ما استحللتم به الفروج رواه …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 211، يذكر الحلال، واستحلال الشيء، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 211, that mentions the lawful, treating a thing as lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 211 کا اقتباس جس میں حلال، کسی چیز کو حلال ٹھہرانا، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 2, pág. 211, que menciona lo lícito, tratando como lícito lo ilícito; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de Bidayat al-Mujtahid d'Ibn Rushd, volume 2, page 211, mentionnant le licite, le fait de considérer une chose comme licite et l'illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 2. cildinin 211. sayfasından, helal olan (izin verilen) ve haram olan (yasaklanan) şeyleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 2, halaman 211, yang membahas tentang apa yang diperbolehkan (halal), kebolehan sesuatu, dan apa yang dilarang (haram); diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
