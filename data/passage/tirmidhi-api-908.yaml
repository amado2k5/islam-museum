label: { ar: "جامع الترمذي 908 — ما حُرّم", en: "Jami' al-Tirmidhi 908 — what was made unlawful", ur: "جامع ترمذی 908 — جو حرام کیا گیا", es: "Jami' al-Tirmidhi 908 — lo que se declaró ilícito", fr: "Jami' al-Tirmidhi 908 — ce qui a été déclaré illicite" }
text: "… اللَّهِ ثُمَّ لَمْ يُحْرِمْ وَلَمْ يَتْرُكْ شَيْئًا مِنَ الثِّيَابِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ الْعِلْمِ قَالُوا إِذَا قَلَّدَ الرَّجُلُ الْهَدْىَ وَهُوَ يُرِيدُ الْحَجَّ لَمْ يَحْرُمْ عَلَيْهِ شَيْءٌ مِنَ الثِّيَابِ وَالطِّيبِ حَتَّى يُحْرِمَ. وَقَالَ بَعْضُ أَهْلِ الْعِلْمِ إِذَا قَلَّدَ الرَّجُلُ هَدْيَهُ فَقَدْ وَجَبَ عَلَيْهِ مَا وَجَبَ عَلَى الْمُحْرِمِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 908، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 908 (The Book on Hajj), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 908، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 908 (El Libro del Hajj), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 908 (Le Livre du Hajj), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
