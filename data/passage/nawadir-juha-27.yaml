text: "… الدقيق المنشور على الحبل طلب إليه جاره أن يعيره حبلاً، فدخل إلى داره، ثم عاد فقال له : إن الحبل مشغول، لأن أهل البيت، نشروا عليه دقيقاً. فقال الرجل : وهل يُنشر الدقيق على الحبل؟ فأجابه جحا : سبحانَ اللَّهِ …"
summary:
  ar: "رفض جحا إعارة حبله بقوله إن الدقيق منشور عليه، فسأله الجار هل ينشر الدقيق على الحبل. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  en: "Juha refuses to lend his rope by saying flour is hung on it, and the neighbour asks whether flour is hung on a rope. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  ur: "جحا نے اپنی رسی ادھار دینے سے یہ کہہ کر انکار کیا کہ اس پر آٹا پھیلا ہوا ہے، تو پڑوسی نے پوچھا کہ کیا آٹا رسی پر پھیلایا جاتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  fr: "Juha refuse de prêter sa corde en disant que de la farine y est étendue, et le voisin demande si l'on étend de la farine sur une corde. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  es: "Juha se niega a prestar su cuerda diciendo que hay harina tendida en ella, y el vecino pregunta si se tiende harina en una cuerda. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  tr: "Juha, ipini ödünç vermeyi reddetti ve ipin üzerinde un kurutulduğunu söyledi. Bunun üzerine komşusu ona, ipe un mu astığını sordu. {cite:juha-nawadir-kubra-djuwaydi s. 18}"
  id: "Juha menolak meminjamkan talinya, dengan alasan tepung sedang dijemur di tali itu. Tetangganya kemudian bertanya apakah dia sedang menjemur tepung di tali. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
