text: "… يخبره بقتل كسرى، ويأمره بأخذ الطاعة ممن ذكر الذهبي ثالثاً ؛ فقال: باذان ملك اليمن. قبله، ولا يتعرض للرجل الذي كتب إليك كسرى في ذكره الوَاقِدِيّ فيمن أسلم من أهل سبأ. أمره، قال : فأسلم باذان وأسلمت الأبناء من فارس …"
summary:
