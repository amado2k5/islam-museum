text: "… جلاء. - وكان هاشم بن عبد مناف صاحب إيلاف قريش الرحلتين، وأولَ من سَنَّها. وذلك أنه أخذ لهم عِصَماً من ملوك الشأم، فتجروا آمنين. ثم إنّ أخاه عبد شمس أخذ لهم عصما من صاحب الحبشة، وإليه كان متجره. وأخذ لهم …"
