text: "… يزيد، والتصويب من مستخرج أبي عوانة من طريق الثوري، به. ليس في الأصل، واستدركناه من مستخرج أبي عوانة فيما تقدم. في الأصل : كثير وهو خطأ، وصوبناه من شعب الإيمان للبيهقي من حديث عبد الرزاق، به. في الأصل : أبي، …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 4، ص 59، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 4, p. 59, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 4، ص 59 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 4, pág. 59, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 4, page 59, mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "Musannaf Abd al-Razzaq'ın Resimli Cilt 4, sayfa 59'undan, inancın dallarını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 4, hlm. 59, yang menyebutkan cabang-cabang iman; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus dalam pilar-pilar Islam, pilar-pilar iman, cabang-cabang iman, dan karakteristik seorang mukmin."
