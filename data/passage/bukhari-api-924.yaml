label: { ar: "صحيح البخاري 924 — ما فُرض على الناس، ما تُرك خشية أن يُفرض", en: "Sahih al-Bukhari 924 — what was made obligatory on people; what was left for fear it would be made obligatory", ur: "صحیح بخاری 924 — جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا", fr: "Sahih al-Bukhari 924 — ce qui a été imposé aux gens ; ce qui fut délaissé de crainte qu'il ne devienne obligatoire", es: "Sahih al-Bujari 924 — lo que se impuso a la gente; lo que se dejó por temor a que se hiciera obligatorio", tr: "Sahih el-Buhari 924 — İnsanlar için farz kılınan şeyler, farz kılınmasından korkulduğu için yapılmamıştır.", id: "Sahih al-Bukhari 924 — Apa yang diwajibkan bagi manusia dibiarkan tidak dilakukan karena khawatir akan diwajibkan di kemudian hari." }
text: "… فَصَلَّوْا مَعَهُ، فَأَصْبَحَ النَّاسُ فَتَحَدَّثُوا فَكَثُرَ أَهْلُ الْمَسْجِدِ مِنَ اللَّيْلَةِ الثَّالِثَةِ، فَخَرَجَ رَسُولُ اللَّهِ فَصَلَّوْا بِصَلاَتِهِ، فَلَمَّا كَانَتِ اللَّيْلَةُ الرَّابِعَةُ عَجَزَ الْمَسْجِدُ عَنْ أَهْلِهِ حَتَّى خَرَجَ لِصَلاَةِ الصُّبْحِ، فَلَمَّا قَضَى الْفَجْرَ أَقْبَلَ عَلَى النَّاسِ، فَتَشَهَّدَ ثُمَّ قَالَ \" أَمَّا بَعْدُ فَإِنَّهُ لَمْ يَخْفَ عَلَىَّ مَكَانُكُمْ، لَكِنِّي خَشِيتُ أَنْ تُفْرَضَ عَلَيْكُمْ فَتَعْجِزُوا عَنْهَا \". تَابَعَهُ يُونُسُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 924، يرد فيه ذكر ما فُرض على الناس، وما تُرك خشية أن يُفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 924 (Friday Prayer), whose wording mentions what was made obligatory on people, what was left for fear it would be made obligatory. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 924، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 924, dont le texte mentionne ce qui a été imposé aux gens, ce qui fut délaissé de crainte qu'il ne devienne obligatoire. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 924, cuyo texto menciona lo que se impuso a la gente, lo que se dejó por temor a que se hiciera obligatorio. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Buhari'nin 924 numaralı hadisinde, insanların farz kıldığı ve farz olma korkusuyla yapılmadığı şeyler anlatılmaktadır. Bu hadis, farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 924, menyebutkan apa yang telah diwajibkan bagi manusia dan apa yang ditinggalkan karena dikhawatirkan akan menjadi wajib. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
