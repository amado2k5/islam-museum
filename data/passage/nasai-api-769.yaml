label: { ar: "سنن النسائي 769 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 769 — the father raising and counselling", ur: "سنن نسائی 769 — باپ کی تربیت اور نصیحت", es: "Sunan al-Nasa'i 769 — El padre que cría y aconseja", fr: "Sunan al-Nasa'i 769 — l'éducation et les conseils du père", tr: "Sunan an-Nasa'i 769 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan an-Nasa'i 769 — Didikan dan Wasiat Ayah" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ مَنْصُورٍ، قَالَ حَدَّثَنَا سُفْيَانُ، قَالَ حَدَّثَنَا أَبُو الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يُصَلِّيَنَّ أَحَدُكُمْ فِي الثَّوْبِ الْوَاحِدِ لَيْسَ عَلَى عَاتِقِهِ مِنْهُ شَىْءٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 769، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 769 (The Book of the Qiblah), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 769، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 769 (El Libro de la Qibla), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 769 (Le Livre de la Qibla), mentionne le rôle du père dans l'éducation et le soutien des enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 769 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, \"İslam'da Babalık\" bölümü tarafından Kur'an, Sünnet, Peygamberimizin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 769, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini dikompilasi oleh bagian \"Peran Ayah dalam Islam\", bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
