text: "… الآخَرِ. قَالَ عُمَرُ تَيْدَكُمْ، أَنْشُدُكُمْ بِاللَّهِ الَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ، هَلْ تَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". يُرِيدُ رَسُولُ اللَّهِ نَفْسَهُ. قَالَ الرَّهْطُ قَدْ قَالَ ذَلِكَ. فَأَقْبَلَ عُمَرُ عَلَى عَلِيٍّ وَعَبَّاسٍ فَقَالَ أَنْشُدُكُمَا اللَّهَ، أَتَعْلَمَانِ أَنَّ رَسُولَ اللَّهِ قَدْ قَالَ ذَلِكَ قَالاَ قَدْ قَالَ ذَلِكَ. قَالَ عُمَرُ فَإِنِّي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3094، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3094 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3094، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
