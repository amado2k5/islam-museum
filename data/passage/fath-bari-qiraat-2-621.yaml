text: "… إِذا اختلفتم أَنتم وزيدُ بن ثابت في شيءٍ من القرآن فاكتبوها بلسانِ قريشٍ فإنما نزلَ بلسانهم. ففعلوا ذلك. الحديث - طرفاه في :،. قوله باب نزل القرآن بلسان قريش أورد فيه طرفاً من حديث أنس فى أمر عثمان بكتابة المصاحف، …"
summary:
