text: "تاب رسول الله للا فقرأه، فإذا فيه: 'بسم الله الرحمن الرحيم، من محمد رسول الله ولو إلى هرقل عظيم الروم، سلام على من اتبع الهدى، أما بعد، فإني أدعوك بدعاية الإسلام، أسلم تسلم، وأسلم يؤتك الله أجرك مرتين، فإن توليت"
