text: "… ابن أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ قَالَتْ : لَمَّا قُبِضَ رَسُولُ اللّه وِ، اخْتَلَفُوا فِي دَفْنِهِ، فَقَالَ أَبُو بَكْرٍ : سَمِعْتُ مِنْ رَسُولِ اللّٰه وَل في شَيْئَاْ مَا نَسِيتُهُ، قَالَ: مَا قَبَضَ اللّٰه نَبِيَّا إِلَّا فِي المَوْضِعِ الَّذِي يُحِبُّ أَنْ يُدْفَنَ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 507، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 507, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 507 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 2, pág. 507, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Jami' al-Tirmidhi, volume 2, page 507, mentionnant un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 507. sayfasından alınan bir alıntıda, ölüm ve vefat anı, defin, mezar ve istirahat yeri konularına değinilmektedir; bu metin, makineyle okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, tarihi eserler ve istirahat yerleri araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 507, menyebutkan saat kematian dan wafat, penguburan, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat peristirahatan."
