label: { ar: "الموطأ 15 — من أدرك ركعة من الصلاة فقد أدرك الصلاة", en: "Muwatta 15" }
text: "من أدرك ركعة من الصلاة فقد أدرك الصلاة"
summary:
  ar: "أول حديث في باب من أدرك ركعة من الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن عن أبي هريرة، أن النبي جعل من أدرك ركعة من الصلاة مدركاً لها. ويخرّجه المحقق من طرق أصحاب مالك عند مسلم (2/102) وأبي داود (1121) والنسائي (1/274) وابن حبان (1483) والبخاري في جزء القراءة خلف الإمام، ويحيل على التمهيد (7/63). {cite:muwatta-maruf-1997 p.41} {cite:muwatta-maruf-1997 p.42}"
  en: "Abu Hurayra from the Prophet: whoever catches one rak'a of the prayer has caught the prayer."
