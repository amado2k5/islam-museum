text: "من أدرك ركعة من الصلاة فقد أدرك الصلاة"
summary:
  ar: "أول حديث في باب من أدرك ركعة من الصلاة. يرويه يحيى عن مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن عن أبي هريرة، أن النبي جعل من أدرك ركعة من الصلاة مدركاً لها. ويخرّجه المحقق من طرق أصحاب مالك عند مسلم (2/102) وأبي داود (1121) والنسائي (1/274) وابن حبان (1483) والبخاري في جزء القراءة خلف الإمام، ويحيل على التمهيد (7/63). {cite:muwatta-maruf-1997 p.41} {cite:muwatta-maruf-1997 p.42}"
  en: "Abu Hurayra from the Prophet: whoever catches one rak'a of the prayer has caught the prayer."
  es: "Abu Hurayra del Profeta: quien atrapa una rak'a de la oración, ha atrapado la oración."
  fr: "D'après Abou Hourayra, rapporté par le Prophète: quiconque accomplit une rak'a de la prière a accompli la prière."
  ur: "ابوہریرہ سے مروی ہے کہ جس نے نماز کی ایک رکعت پکڑی اس نے نماز پکڑ لی۔"
  id: "Hadits pertama dalam bab ini adalah tentang orang yang menggantikan rakaat shalat. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Abu Salamah ibn Abd al-Rahman, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) menganggap orang yang menggantikan rakaat shalat telah menggantikannya. Editor menyertakannya dari sanad sahabat Malik dalam Muslim (2/102), Abu Dawud (1121), al-Nasa'i (1/274), Ibn Hibban (1483), dan al-Bukhari dalam bagian tentang membaca di belakang imam, dan merujuk pada al-Tamhid (7/63). {cite:muwatta-maruf-1997 p.41} {cite:muwatta-maruf-1997 p.42}"
