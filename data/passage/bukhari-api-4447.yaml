label: { ar: "صحيح البخاري 4447 — مرض النبي، الوجع", en: "Sahih al-Bukhari 4447 — the Prophet's illness; pain", ur: "صحیح بخاری 4447 — نبی کی بیماری، درد", es: "Sahih al-Bukhari 4447 — La enfermedad del Profeta; dolor", fr: "Sahih al-Bukhari 4447 — La maladie du Prophète; la douleur", tr: "Sahih el-Buhari 4447 — Peygamberin hastalığı, acısı", id: "Sahih al-Bukhari 4447 — Penyakit dan rasa sakit Nabi" }
text: "… اللَّهِ بْنَ عَبَّاسٍ أَخْبَرَهُ أَنَّ عَلِيَّ بْنَ أَبِي طَالِبٍ ـ خَرَجَ مِنْ عِنْدِ رَسُولِ اللَّهِ فِي وَجَعِهِ الَّذِي تُوُفِّيَ فِيهِ، فَقَالَ النَّاسُ يَا أَبَا حَسَنٍ، كَيْفَ أَصْبَحَ رَسُولُ اللَّهِ فَقَالَ أَصْبَحَ بِحَمْدِ اللَّهِ بَارِئًا، فَأَخَذَ بِيَدِهِ عَبَّاسُ بْنُ عَبْدِ الْمُطَّلِبِ، فَقَالَ لَهُ أَنْتَ وَاللَّهِ بَعْدَ ثَلاَثٍ عَبْدُ الْعَصَا، وَإِنِّي وَاللَّهِ لأُرَى رَسُولَ اللَّهِ سَوْفَ يُتَوَفَّى …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4447، يذكر مرض النبي، والوجع. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4447 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the Prophet's illness, pain. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4447، جس میں نبی کی بیماری، درد کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4447 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona la enfermedad y el dolor del Profeta. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un récit du Sahih al-Bukhari, n° 4447 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne la maladie et les douleurs du Prophète. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4447 numaralı hadis, Peygamberimizin hastalığından ve çektiği acılardan bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4447, menyebutkan penyakit dan rasa sakit Nabi. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan perawatan."
