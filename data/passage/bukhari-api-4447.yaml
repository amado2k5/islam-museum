text: "… اللَّهِ بْنَ عَبَّاسٍ أَخْبَرَهُ أَنَّ عَلِيَّ بْنَ أَبِي طَالِبٍ ـ خَرَجَ مِنْ عِنْدِ رَسُولِ اللَّهِ فِي وَجَعِهِ الَّذِي تُوُفِّيَ فِيهِ، فَقَالَ النَّاسُ يَا أَبَا حَسَنٍ، كَيْفَ أَصْبَحَ رَسُولُ اللَّهِ فَقَالَ أَصْبَحَ بِحَمْدِ اللَّهِ بَارِئًا، فَأَخَذَ بِيَدِهِ عَبَّاسُ بْنُ عَبْدِ الْمُطَّلِبِ، فَقَالَ لَهُ أَنْتَ وَاللَّهِ بَعْدَ ثَلاَثٍ عَبْدُ الْعَصَا، وَإِنِّي وَاللَّهِ لأُرَى رَسُولَ اللَّهِ سَوْفَ يُتَوَفَّى …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4447، يذكر مرض النبي، والوجع. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4447 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the Prophet's illness, pain. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4447، جس میں نبی کی بیماری، درد کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
