summary:
  ar: "القسم 28 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطب عن رسول الله»، ويضم فيها النصوص من 2036 إلى 2089 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 28 of Jami' al-Tirmidhi (Chapters on Medicine) in the division of the open hadith dataset the museum took its reports from: reports 2036 to 2089 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 28، عنوان «کتاب الطب عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2036 تا 2089۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 28 de Jami' al-Tirmidhi (Capítulos sobre Medicina) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2036 al 2089, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de forma diferente."
  fr: "Le musée a tiré ses hadiths du livre 28 de Jami' al-Tirmidhi (Chapitres sur la médecine), dans la partie de la base de données ouverte (hadiths) dont il a extrait les récits: les hadiths 2036 à 2089 de cette base de données. Le musée classe ses archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanında yer alan Cami' el-Tirmizi'nin 28. bölümü, \"Allah'ın Elçisinden Tıp Kitabı\" başlığını taşımakta olup, 2036'dan 2089'a kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 28 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pengobatan dari Rasulullah\" dan berisi teks 2036 hingga 2089, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
