text: |-
  ٠٠٨
  ونصروعروابناقعين وهما بطنان من بنى أسد ⁦(ضرا)⁩ عرق ضرى لا يكار ينقطح دمه
  قال العجاج *مماضر العرق به الضرى • وقد ضر ايضر وضروافهو ضار أيضااذايدا
  منه الدم قال الاخمال
  لم أتوها بصباح ومبزلهم • سارت اليهم سؤْر الايجل الضارى
  واضرو بالسكسر ممغ شجرة تدعى السكمكام يجلب من اليمن والضر وأيضا الضارى من
  أولاد الكلاب والاتى ضروة وابهع أضر وضراء مثل ذتب وأذوب وذناب قال دوالرمّة
  حقزع أطلس الاطمارليس له • الا الضراء والاميدها نشب
  وقد ضبرى الكلب بالسيد يضرى ضبراوة أى تعوّد وكلب ضار وكلبة ضارية وأضراه
  صاحبه أى دربه وعوّده وأضراهيه أيضا أى أغراه وكذلك التضرية قال زهير
  ونضرى اذا ضر تتوها قتضرم • وقد ضريت بذلك الامر أضرضراوة ومنه قول عمر
  رضى اللّٰه عنه ايا كم وهذه الجازرفات اهاضبراوة كضراوة المر واضرورى الرجل اضريراء
  انتفخ بطنه من الطعام واتخم والضراء بالفتح الشجر اللتف فى الوادى بقال توارى الصيد
  منى فى ضراء وفلان يمنى الضراء اذامشى مستخفيا فيمايوارى من الشجر ويقال للرجل
  إذا ختل صاحبه هو عشى ل الضراء ويدبة له الحر قال بشر
  عظفذ الهم عطف الضروس بن الملا • بشهبا لايمشى الضراءرقيها
  واستضريت للصيداذاختلته من حيث لايعلم وضرية قرية لبنى كلاب على طريق البصرة
  الى مكة رهى الى كة أقرب ⁦( عا)⁩ الضعة شجر وأصلها ضعو والهاءعوض لانه يجمع على
  ضعوات قال جريره متخذا فى ضعوات يولجماء والنسبة البهاضعوى وقال بعضهم الهاء
  عوض من االواوالذاهبة من أوه وقدذ كرناه فى فصل وضع ⁦(ضفا)⁩ ضغا الفعلب والسنور
  يضغوضغوا وضغاء أى صاح وكذلك صوت كل ذليل مقهور ⁦(ضفا)⁩ الضفوالسبوغ يقال
  ضفا الشى يضفو وتوب ضاف أى سابع قال بشر
  اليالى لا أطاوع من نهانى * ويضفوقحت كعى الازار
  وفلان فى ضفوة من عيشه وضفا المال كثر قال الاخطل
  اذا الهدف المعزال صوّب رأسه * وأع.ه ضفومن الثلة الخطل
  ورجل ضاف الرأس أى كنسير شعر الرأس ⁦( نا)⁩ ضنت المرأة ضناء عدود كثر والدهايم-مز
  ولا يهمز أبو هر والضووالضنو الولد يفح الضاد وكسرها بلا همز والصّنا المرض بقال
  منه ضنى بالنكسر يضى ضى شديدافهور جل عق وضن مثل سرى وسر يقال تركنه ضى
  وضنيا فاذاقلت ضى استوى فيه المذ كروالمؤنث وابجمع لانه مصدر فى الاصل واذا كسرت
  النون ثنيت وجمعت كماقلناه فى حر وأضناه المرض أى أدنفه وأثقلد والمضاناة المعاناة
  ⁦( ضوا)⁩ الاصمحى الذوة الصوت والجلبة يقال عمت ضوّة القوم وأبوز يد مثله والضوضاة
  أصوات الناس وخلبتهم يقال ضوضوا بلاهمزوضوضيت أبدلوا من الواوياء وضويت
  اليه بالفعح أضوى ضويالذا أويت اليه وأنضممت وأضويت الامراذا أضعفته ولم تحسكمه
  وبقال بالمعبرضواة أى سلعة والضوى الهزال وقال ذوالرقة بصف زندة
  اخوها
