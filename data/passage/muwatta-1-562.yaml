label: { ar: "الموطأ 562 — أبو هريرة موقوفاً: التسبيح والتكبير والتحميد ثلاثاً وثلاثين دبر كل صلاة وختم المئة بالتهليل", en: "Muwatta 562" }
summary:
  ar: "يرويه مالك عن أبي عبيد مولى سليمان بن عبد الملك عن عطاء بن يزيد الليثي عن أبي هريرة موقوفاً عليه، أن من سبح الله دبر كل صلاة ثلاثاً وثلاثين، وكبر ثلاثاً وثلاثين، وحمد ثلاثاً وثلاثين، وختم المئة بلا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، غُفرت ذنوبه ولو كانت مثل زبد البحر. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وينقل عن ابن عبد البر (التمهيد 24/160) أنه موقوف في الموطأ ومثله لا يدرك بالرأي، وهو مرفوع صحيح من وجوه كثيرة، ويضيف أن حديث أبي هريرة المرفوع في الصحيحين (البخاري 1/213 و8/89، ومسلم 2/97) من رواية أبي صالح عنه، وعند مسلم (2/98) من رواية عطاء بن يزيد الليثي عنه. {cite:muwatta-maruf-1997 p.288} {cite:muwatta-maruf-1997 p.289}"
