label: { ar: "الموطأ 562 — أبو هريرة موقوفاً: التسبيح والتكبير والتحميد ثلاثاً وثلاثين دبر كل صلاة وختم المئة بالتهليل", en: "Muwatta 562", es: "Muwatta 562", fr: "Muwatta 562", ur: "موطا 562", tr: "El-Muvatta 562 — Ebu Hurayra, bir Sahabeden rivayetle: Her namazdan sonra otuz üç defa Sübhanallah, Tekbir ve Tahmid demek ve yüzüncüyü Tahlil ile bitirmek.", id: "Al-Muwatta 562 — Abu Hurayrah, dari seorang Sahabat: Mengucapkan Subhanallah, Takbir, dan Tahmid sebanyak tiga puluh tiga kali setelah setiap shalat, dan mengakhiri seratus kali tersebut dengan Tahlil." }
summary:
  ar: "يرويه مالك عن أبي عبيد مولى سليمان بن عبد الملك عن عطاء بن يزيد الليثي عن أبي هريرة موقوفاً عليه، أن من سبح الله دبر كل صلاة ثلاثاً وثلاثين، وكبر ثلاثاً وثلاثين، وحمد ثلاثاً وثلاثين، وختم المئة بلا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، غُفرت ذنوبه ولو كانت مثل زبد البحر. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وينقل عن ابن عبد البر ⁦(التمهيد 24/160)⁩ أنه موقوف في الموطأ ومثله لا يدرك بالرأي، وهو مرفوع صحيح من وجوه كثيرة، ويضيف أن حديث أبي هريرة المرفوع في الصحيحين ⁦(البخاري 1/213 و8/89، ومسلم 2/97)⁩ من رواية أبي صالح عنه، وعند مسلم (2/98) من رواية عطاء بن يزيد الليثي عنه. {cite:muwatta-maruf-1997 p.288} {cite:muwatta-maruf-1997 p.289}"
  tr: "Malik, Süleyman ibn Abdülmalik'in azatlı kölesi Ebu Ubeyd'den, Ata ibn Yezid el-Leyti'den, o da Ebu Hurayra'dan rivayetle, (doğrudan Peygamber'e değil) ona atfedilen bir hadis olarak şöyle nakletmiştir: \"Kim her namazdan sonra otuz üç defa Allah'ı şanlandırır, otuz üç defa O'nu yüceltir, otuz üç defa O'na hamd eder ve yüzüncü namazı 'Allah'tan başka ilah yoktur, O tektir, ortağı yoktur; mülk de O'na aittir, övgü de O'nadır ve her şeye kadirdir' diyerek bitirirse, günahları deniz köpüğü kadar çok olsa bile affedilir.\" Araştırmacı, Ebu Musab'ın bunu Malik'ten naklettiğini ve İbn Abdülberr'in (el-Temhid 24/160) bunun el-Muvatta'da bir Sahabe'ye atfedilen bir hadis olduğunu ve böyle bir hadisin kişisel görüşle çıkarılamayacağını söylediğini aktarmaktadır. Bu, Peygamberimize (marfu') kadar uzanan, birçok rivayet zinciriyle tam bir isnad zincirine sahip sahih bir hadistir. Ayrıca, Peygamberimize kadar uzanan tam bir isnad zincirine sahip Ebu Hurayra hadisinin, Ebu Salih'in rivayetiyle iki Sahih'te (Buhari 1/213 ve 8/89 ve Müslim 2/97) ve Ata ibn Yazid el-Laythi'nin rivayetiyle Müslim'de (2/98) bulunduğunu ekler. {cite:muwatta-maruf-1997 s.288} {cite:muwatta-maruf-1997 s.289}"
  id: "Malik meriwayatkan hadits ini dari Abu Ubayd, budak yang dibebaskan oleh Sulayman ibn Abd al-Malik, dari Ata ibn Yazid al-Laythi, dari Abu Hurayrah, sebagai pernyataan yang dinisbahkan kepadanya (bukan langsung kepada Nabi): “Barangsiapa memuji Allah tiga puluh tiga kali setelah setiap shalat, mengagungkan-Nya tiga puluh tiga kali, memuji-Nya tiga puluh tiga kali, dan mengakhiri seratus kali tersebut dengan ‘Tidak ada tuhan selain Allah, Yang Maha Esa, tanpa sekutu; kepada-Nya milik kekuasaan dan kepada-Nya milik pujian, dan Dia Maha Kuasa atas segala sesuatu,’ maka dosa-dosanya akan diampuni meskipun sebanyak buih di laut.” Peneliti menyebutkan bahwa Abu Musab meriwayatkan hadits ini dari Malik, dan mengutip Ibnu Abd al-Barr (al-Tamhid 24/160) yang mengatakan bahwa itu adalah pernyataan yang dinisbahkan kepada seorang Sahabat dalam al-Muwatta, dan pernyataan seperti itu tidak dapat disimpulkan melalui pendapat pribadi. Hadits ini sahih dengan sanad lengkap yang sampai kepada Nabi (marfu’) melalui banyak sanad. Beliau menambahkan bahwa hadits Abu Hurairah dengan sanad lengkap yang sampai kepada Nabi terdapat dalam dua kitab Sahih (al-Bukhari 1/213 dan 8/89, dan Muslim 2/97) melalui riwayat Abu Salih atas otoritasnya, dan dalam Muslim (2/98) melalui riwayat Ata ibn Yazid al-Laythi atas otoritasnya. {cite:muwatta-maruf-1997 p.288} {cite:muwatta-maruf-1997 p.289}"
