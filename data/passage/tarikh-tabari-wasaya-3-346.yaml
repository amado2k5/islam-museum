text: "سنة هُمُ أَطْمَعُوا خَاقَاتَ فِينا فأَصْبَحَتْ جَلائِبُهُ تَرْجُو أَحْتِوَاءه الْمَغانِمِ قال وكان السّبْل، أوصى عند موته ابن السائجى، حين استخلفه بثلث خصال فقال لا تستطل لا على أهل الخُتَّل استطالتي التى كانت عليهم فانى ملك ولست بملك أنّماء انت رجل …"
summary:
