text: "… المتأخر منهما بالأصغر؛ وربما وقع ذلك فى الأخوين إذا كان أحدهما أكبر من الآخر. المهيع الثانى فى معرفة تفاصيل أنساب العرب وآعلم أن العرب علىٰ قسمين : أهمله في الأصل وصوابه الإعجام."
summary:
