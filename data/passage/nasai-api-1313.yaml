text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا اللَّيْثُ، عَنِ ابْنِ عَجْلاَنَ، عَنْ عَلِيٍّ، - وَهُوَ ابْنُ يَحْيَى - عَنْ أَبِيهِ، عَنْ عَمٍّ، لَهُ بَدْرِيٍّ أَنَّهُ حَدَّثَهُ أَنَّ رَجُلاً دَخَلَ الْمَسْجِدَ فَصَلَّى وَرَسُولُ اللَّهِ يَرْمُقُهُ وَنَحْنُ لاَ نَشْعُرُ فَلَمَّا فَرَغَ أَقْبَلَ فَسَلَّمَ عَلَى رَسُولِ اللَّهِ فَقَالَ \" ارْجِعْ فَصَلِّ فَإِنَّكَ لَمْ تُصَلِّ \". فَرَجَعَ فَصَلَّى ثُمَّ أَقْبَلَ إِلَى رَسُولِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1313، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1313 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1313، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1313 (El Libro del Olvido (En la Oración)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
