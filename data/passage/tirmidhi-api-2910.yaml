label: { ar: "جامع الترمذي 2910 — مضاعفة الحسنة بعشر أمثالها", en: "Jami' al-Tirmidhi 2910 — the good deed multiplied tenfold and beyond", ur: "جامع ترمذی 2910 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا", es: "Jami' al-Tirmidhi 2910 — la buena acción multiplicada por diez y más allá", fr: "Jami' al-Tirmidhi 2910 — la bonne action multipliée par dix et au-delà", tr: "Cami' el-Tirmizi 2910 — İyi bir amel on kat çoğalır.", id: "Jami' al-Tirmidhi 2910 — Suatu amal kebaikan akan dilipatgandakan sepuluh kali lipat" }
text: "… مَسْعُودٍ، يَقُولُ قَالَ رَسُولُ اللَّهِ \" مَنْ قَرَأَ حَرْفًا مِنْ كِتَابِ اللَّهِ فَلَهُ بِهِ حَسَنَةٌ وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا لاَ أَقُولُ الم حَرْفٌ وَلَكِنْ أَلِفٌ حَرْفٌ وَلاَمٌ حَرْفٌ وَمِيمٌ حَرْفٌ \". وَيُرْوَى هَذَا الْحَدِيثُ مِنْ غَيْرِ هَذَا الْوَجْهِ عَنِ ابْنِ مَسْعُودٍ وَرَوَاهُ أَبُو الأَحْوَصِ عَنِ ابْنِ مَسْعُودٍ رَفَعَهُ بَعْضُهُمْ وَوَقَفَهُ بَعْضُهُمْ عَنِ ابْنِ مَسْعُودٍ. قَالَ أَبُو …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2910، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2910 (Chapters on The Virtues of the Qur'an), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2910، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2910 (Capítulos sobre las virtudes del Corán), habla de la buena acción multiplicada por diez o más. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, registran, borran o valoran una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2910 (Chapitres sur les vertus du Coran), évoque la multiplication décuple, voire au-delà, des bonnes actions. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent les actes accomplis."
  tr: "Cami' el-Tirmizi'de 2910 numaralı hadiste, iyi bir amelin on katıyla ödüllendirileceğinden bahsedilir. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2910, menyebutkan bahwa amal kebaikan dilipatgandakan sepuluh kali. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
