text: "… عن زيد بإسناده مثله؛ إلا أنه قال : عبدالله بن عبدالله بن هلال. أخرجه أبو موسى. - عَبْدُ الوَاحِد، غير منسوب. أخرجه البَاطِرْ قَاني في طبقات المقرئين. روى ابن وهب، عن خلاد بن سليمان قال: وكان ممن جمع القرآن على …"
