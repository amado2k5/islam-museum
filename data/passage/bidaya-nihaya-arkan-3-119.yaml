text: "… وبعدها. وقد قيل إن فريضة الحجّ نزلت عامئذ، وقيل سنة تسع، وقيل سنة ست، وقيل قبل الهجرة، وهو غريب، وسمّيت حجّة البلاغ لأنه بلّغ الناس شرع اللّٰه في الحج قولاً وفعلاً، ولم بكن بقى من دعائم الإسلام وقواعده شيء إلا …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 119، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
