text: "أمراض القلب وخفقانه وخفقان قم الممدة المشبه بخفقان القلب... الخ جورجس: إذا كثرت الحرارة والدم في القلب كثر الغشي، فعالجه بالفصد والإسهال والأغذية اللطيفة المطفئة وماء الشعير ونحوه، وإن كان فيه سوء مزاج بارد فإنه يجمد النبض، فعالجه بدواء المسك …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1095، يذكر المرض والمريض، وأسماء الأمراض، والبيمارستان وصناعة الطب، والعلاج، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
