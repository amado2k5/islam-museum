label:
  ar: "البخاري 5988 — الرحم: من وصلك وصلته ومن قطعك قطعته"
  en: "Bukhari 5988 — Kinship: whoever joins you I join, whoever cuts you I cut"
  ur: "بخاری 5988 — رشتہ داری: جو تجھے جوڑے میں اسے جوڑوں، جو تجھے کاٹے میں اسے کاٹوں"
text: "إن الرحم سجنة من الرحمن، فقال الله من وصلك وصلته، ومن قطعك قطعته ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 5988: الرحم: من وصلك وصلته ومن قطعك قطعته. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 5988: Kinship: whoever joins you I join, whoever cuts you I cut. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 5988: رشتہ داری: جو تجھے جوڑے میں اسے جوڑوں، جو تجھے کاٹے میں اسے کاٹوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
