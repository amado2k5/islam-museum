text: "… يُسْتَحَب، لأُنْهُ لا حَاجَةَ إلَيْهَا، وَلا يَأْمَنُ أَنْ يُغْلَبَ، فَيَكْرُ قُلُوبَ الْمُسْلِمِينَ، إلا أَنَّهُ لَمَّا كَانَ شُجَاعاً وَائِقاً مِنْ نَفْيِهِ، أُبِيحَ لَهُ؛ لأنَّهُ بِحُكْمِ الظَّاهِرِ غَالِبٌ، وَالْمَكْرُوهُ أَنْ يَبْرُزَ الضَعِيفُ الْمُنَّةِ، الّذِي لا يَثْقُ مِنْ نَفْسِهِ، فَتُكْرَه لَهُ الْمُبَارَزَةً؛ لِمَا …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 2283، يرد فيه ذكر المستحب، والمكروه، والمباح، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 2283, whose wording mentions the recommended (mustahabb), the disliked (makruh), the permitted (mubah), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 2283 کا اقتباس جس میں مستحب، مکروہ، مباح، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 3, p. 2283, dont le texte mentionne le recommandé (mustahabb), le réprouvé (makruh), le permis (mubah), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
