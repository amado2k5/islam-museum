text: |-
  ١ ى لا تنصرف وهذه عبارة
  قدماء الكوفيين يعبرون عن
  المنصرف بالجرى وأما البصريون
  فيقولون منصرف اه ذكره
  محشي القاموس
  ٣١٤
  ⁦(باب الرا. )⁩
  طريق وة أخذأنت فى غيره حتى تلتقيا فى مكان واختصار الطريق سلول أقربه واختصار
  الكلام ايجازه ⁦( ضر)⁩ الخضرلون الاخضر واخضر الشى اخضرارا وأخضوضر
  وخضرته أنا وربمامموا الاسود أخضروقوله تعالى مدهامتان قالواخضراوان لائم-ما
  يضربان الى السواد من شدة الرى وسهى قرى العراق سواد الكثرة شجرها والخضرة فى ألوان
  الابل والخيل غبرة تخااطهادهمة يقال فرس أخضروه والديزج وفى ألوان النام السمرة
  قال اللهبي هو الفضل بن عياس بن عتبة بن أبى اهب)
  وأنا الاخضر من يعرفى • أخضر الجلدة فى ت العرب
  يقول أنا خالص لان الوان العرب السمرة والخضراء السماء ويقال كتيبة خضراء لاتى يعلوها
  سواد الحديد وفى الحديث ايا كم وخضراء الدمن يعنى المرأة الحسناء فى منيت السولان
  ما ينيت فى الدمنة وان كان ناضر الايكون ثامر ا ويقال الدنيا حلوة خضرة وقواهم أباداللٰه
  خضراءهم أى سوادهم ومعظمهم وأنكره الاصعى وقال انمايقال أباد اللّٰه غضراءهم أى
  خيرهم وغضارتهم والخضيرة النخلة التى ينأربسرها وهو أخضر واختضرت الكلا اذا
  جززته وهو أخضر ومنه قيل للرجل اذامات شاباغضاقد اختضر وكان فييات يقولون لشيخ
  أجززت ياشيخ فيقول أى بنىْ وتختضرون وخضارة بالضم البحرمحرفة لا تجرى ١ تقول
  هذه خضارة طاميا والخضارى طائريسمى الاخيل كانه منسوب الى الاول واظضار بالفتح
  اللبن الذى أكثر ماؤه واحضاراً يضا البقل الأول والخاضرة ييع النمار قبل أن يبدوصلاحها
  وهى خضر بعد ونهى عنه ويدخل فيه بيع الرطاب والبة ول وأشباهها ولهذا كره بعضه-م
  يع الرطاب أكثر من جزة واحدة ويقال للزرع الفضارى بتشديد الضاد مثال الشقارى
  وقوله تعالى فأخر جنامنه خضراقال الاخفس يريد الاخضر كسول العرب أرنيهاغرة
  أركها مطرة ويقال ذهب دمه خضرامضرا أى هدرا وخضرأ يضاصاحب مومى عليهما
  السلام ويقال خضر مثال كبدوكبدوهوأفصح خطر لخطر الاشراف على الهلاك
  بقال خاطرينفه واظطر السبق الذى يتراهن عليه وقد أخطر المال أى جعله خطرابين
  المتراهنين وخاطره على كذا وخطر الرجل أيضا ئدره ومنزله وهذا خطر لهذا وخطر أى
  مثله فى القدر والخطر بالمكسرنيات يختضب به ومنه قبل للبن الكثير الماءخطر وانخطر أيضا
  الابل الكثيرة وايلمع أخطار وخطر البعير بذنبه يخطر بالكسر خطرا وخطرانا اذارفعه هرة
  بعدمرة وضرب به نفخذيه قال ذوازمة
  وقربن بالزرق الهائل بعدما • تقوب عن غربان أوراكها الجطر
  قوله تقوّب يحتمل أن يكون بعدنى قوب كقوله تصالى فتقطعوا أمرهم بينهم أى قطعوا
  وتقسمت الشئ أى قسمته وقال بعضهم أراد تقوبت غربانها عن الخطر فقلبه وخطر الرح
  بخذراهتزورح خطارذ واحتزازويقال مخطران الرح ارتَماعه وانخفاضه للطعن ورجل
  خطار بالرح طعان وقال مصاليت خطارون بالرمح فى الوغى وخطران الرجل أيضا
  اهتزاز. فى المشى وتيختره وخطر الدهر خطرانه كما بقال ضرب الدهرضريانه وانخطه
  الزمام ورجل خطيرأى فه قدر وخطر وقد خطر بالضم خطورة والخطاراسم فرص حذيفة
