text: |-
  ٢٣٤
  nnœnفضل الثام)•
  =, ٠رام).
  طلع سهيل أخذه الراعى وقال له أترى هيلا واللّٰه لا تذوق عندى قطرة ثم اطمه وضماه
  واللطيم التاسع من سوابق الخيل ولاطمه فتلاطما والتطمت الامواج ضرب بعضها بعضا
  ثم أبوزيد تلعتم الرجل فى الامراذا تمكث فيه وتأنى وقال الخليل نكل عنه وتبصره
  ( لغم لغام البعيرز بده والملاغم ماحول القم الذى ييلفه اللسان ويشبه أن يكون مفعلا
  من لغسام البعير وتلغمت بالطيب اذاجعلته فى الملاغم وقال ابن الاعرائى قلت لاع راتي متى
  المسير فقال تلغموا بيوم السبت يع-نى ذكروه واشتقاقه من أنهم حركوام لاغمهم به
  الكان لغوت ألغم لغمااذا أخبرت صاحبك بنى لانستيقنه ⁦(لفم)⁩ اللفام
  ما كان على ظهرف الانف من النقاب وقد لذمت المرأة فاها بلفامها اذا نقبته وافمت
  وتلفمت والتغمت اداشدت اللفام قال الاصمعى اذا كان النقاب على الف-مفهواللشام
  واللفام كما قالوا الدفتي والدننى قال الشاعر• وقد زل عن غرّ الثنا يالفامها• وقال أبوزيد
  تلفعت تلفما اذا أخذت عمامة فجعلتها على فيسك شبه النقاب ولم تبلغ بها أرنسة الانف
  ولامارنه قال وبذوتيم تقول فى هذا المعنى تلثمت تلثما قال فاذا انتهى الى الانف فغشيه
  أوبعضه فه والنقاب ⁦(لقم)⁩ اللقم بالتحر يك وسط العاريق واللقم بالتسكين مصدر
  قولات لقدت بانفتح الطاريق وغيره ألقمه بالضم اذاسددت فه والتقمت اللقمة اذا اتلعتها
  ولقمتها بالمكسر لقما وتلقمتها اذا بتلعتها فى مهلة ولة مت غيرى تلقيما وألقمته ججراورجل
  تلقامة أى كثير اللقم ولقمان صاحب الفسور ينسبه الشعراء الى عاد وقال
  تراه يطوف الا فاق حرسا * لمبأكل رأس لقمان بن عاد
  ا كم لكمته ألسكمه لكما اذاضربته بجمع كفك والملكمة القرصة المضروية
  باليدو اللسكام بالتشديد جبل بالشأم وملكوم اسم ما بمكة (ل م لمّ اللّٰه شعنه أى أصلح
  وججمع ما تفرّق من أموره ومنه قولهم انّ داركم لمومة أى تلمّ الناس وتربهم وتجمعهم وقال
  المرناف الطائى فدكىّ بن أعيد يدح علقمة بن سيف
  وأحبنى حب الصبىّ ولمنى • لم الهدىّ الى الكريم الماجد
  والالمام النزول وقد ألتم به أى نزل به وغسلام ملمّ أى قارب البلوغ وفى الحديث وان مما ينبت
  الربيع ما يقتل حبطا أويلمّ أى يقرب من ذلك وألتمّ الرجل من اللمم وهو صغار الذنوب وقال
  ان تغفر اللهمّ تغفرجا وأى عبدلك لا ألما
  ويقال هو مقارية المعصية من غير مواقعة وقال الاخفش اللمم المتقارب من الذنوب واللمم
  أيضاطرف من الجنون ورحل ملوم أى هلم ويقال أيضا أصابت فلانا من الإن لمة وهو
  المس والشى القليل وقال
  فاذا وذلك يا كبيشة لم يكن • الاكلمة سالم بخيال
  والملمة النازلة من نوازل الدنيبا والعين اللامّة التى تصيب بنوءيقال أعيدممن كل هامّة
  ولامة وأماقوله • أعيذه من حادثات اللمه فهوالدهرويقال الشدّة وأنسد الفراه
  علصروف الدهر أودولاتها * يدلتنا اللمة من لماتها
  واللمة بالكيسر الشعر يجا وزشحمة الاذن فاذابلغت المنكبين فهى جمة والجم-ع لمم ولممام
  مال
