ref: "666"
label:
  ar: "النسائي 666 — يعجب ربك من راعي غنم يؤذن ويصلي"
  en: "Nasa'i 666 — Your Lord delights in a shepherd who calls the adhan and prays"
  ur: "نسائی 666 — تمہارا رب اس چرواہے پر خوش ہوتا ہے جو اذان دیتا اور نماز پڑھتا ہے"
text: "يعجب ربك من راعي غنم في رأس شظية الجبل يؤذن بالصلاة ويصلي فيقول الله عز وجل انظروا إلى عبدي هذا يؤذن ويقيم الصلاة يخاف مني قد غفرت لعبدي وأدخلته الجنة ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 666: يعجب ربك من راعي غنم يؤذن ويصلي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 666: Your Lord delights in a shepherd who calls the adhan and prays. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 666: تمہارا رب اس چرواہے پر خوش ہوتا ہے جو اذان دیتا اور نماز پڑھتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
