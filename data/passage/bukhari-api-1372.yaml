label: { ar: "صحيح البخاري 1372 — الأب والأبوة", en: "Sahih al-Bukhari 1372 — the father and fatherhood", ur: "صحیح بخاری 1372 — باپ اور والدیت", es: "Sahih al-Bukhari 1372 — El padre y la paternidad", fr: "Sahih al-Bukhari 1372 — le père et la paternité" }
text: "حَدَّثَنَا عَبْدَانُ، أَخْبَرَنِي أَبِي، عَنْ شُعْبَةَ، سَمِعْتُ الأَشْعَثَ، عَنْ أَبِيهِ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَا ـ أَنَّ يَهُودِيَّةً، دَخَلَتْ عَلَيْهَا، فَذَكَرَتْ عَذَابَ الْقَبْرِ، فَقَالَتْ لَهَا أَعَاذَكِ اللَّهُ مِنْ عَذَابِ الْقَبْرِ. فَسَأَلَتْ عَائِشَةُ رَسُولَ اللَّهِ عَنْ عَذَابِ الْقَبْرِ فَقَالَ \" نَعَمْ عَذَابُ الْقَبْرِ \". قَالَتْ عَائِشَةُا ـ فَمَا رَأَيْتُ رَسُولَ اللَّهِ بَعْدُ صَلَّى صَلاَةً إِلاَّ تَعَوَّذَ مِنْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1372، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1372 (Funerals (Al-Janaa'iz)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1372، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1372 (Funerales (Al-Janaa'iz)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1372 (Funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
