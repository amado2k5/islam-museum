label:
  ar: "البخاري 7501 — إن الله كتب الحسنات والسيئات"
  en: "Bukhari 7501 — God has written good deeds and bad deeds"
  ur: "بخاری 7501 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
text: "يقول الله إذا أراد عبدي أن يعمل سيئة فلا تكتبوها عليه حتى يعملها، فإن عملها فاكتبوها بمثلها وإن تركها من أجلي فاكتبوها له حسنة وإذا أراد أن يعمل حسنة فلم يعملها فاكتبوها له حسنة، فإن عملها فاكتبوها له بعشر أمثالها …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7501: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7501: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7501: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
