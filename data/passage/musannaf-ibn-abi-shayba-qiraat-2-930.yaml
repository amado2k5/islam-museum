text: "… - حدثنا عبيدالله عن إسرائيل عن عمر بن عبدالله عن ابن مَعْقِل: مثل ذلك. - حدثنا وكيع عن شعبة عن حماد عن سعيد بن المسيب قال: يقرأ الجنب القرآن قال: فذكرته لإبراهيم، فكرهه. - حدثنا حفص عن عاصم عن أبي …"
