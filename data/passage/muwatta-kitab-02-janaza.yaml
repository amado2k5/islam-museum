label: { ar: "الموطأ، كتاب الجنائز", en: "Muwatta, Book of Funerals" }
summary:
  ar: "كتاب الجنائز، الكتاب الثاني من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 61 نصاً (591–651) في ستة عشر باباً، من الصفحة 305 إلى الصفحة 332 من ملف PDF المجلد الأول. يبدأ بغسل الميت وكفنه، ثم المشي أمام الجنازة والنهي أن تُتبع بنار، والتكبير على الجنائز وما يقول المصلي عليها والصلاة عليها بعد العصر والصبح وفي المسجد، ثم دفن الميت والوقوف للجنائز والجلوس على المقابر، والنهي عن البكاء على الميت والحسبة في المصيبة، والنباش، ويختم بباب جامع فيه أحاديث آخر حياة النبي وما يلقاه الميت بعد موته. ويذكر المحقق أن الكتاب وقع في بعض النسخ بعد كتاب الجهاد. {cite:muwatta-maruf-1997 p.305} {cite:muwatta-maruf-1997 p.332}"
  en: "The Book of Funerals, second book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 61 reports (591–651) in sixteen babs, PDF pp. 305–332 of volume 1, from washing and shrouding the dead through the funeral prayer, burial, mourning and what awaits the dead."
