label: { ar: "سنن النسائي 2644 — الأب والأبوة", en: "Sunan al-Nasa'i 2644 — the father and fatherhood", ur: "سنن نسائی 2644 — باپ اور والدیت", es: "Sunan al-Nasa'i 2644 — El padre y la paternidad" }
text: "أَخْبَرَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ الدَّوْرَقِيُّ، قَالَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، عَنْ مَنْصُورٍ، عَنْ مُجَاهِدٍ، عَنْ يُوسُفَ، عَنِ ابْنِ الزُّبَيْرِ، أَنَّ النَّبِيَّ قَالَ لِرَجُلٍ \" أَنْتَ أَكْبَرُ وَلَدِ أَبِيكَ فَحُجَّ عَنْهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2644، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2644 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2644، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2644 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
