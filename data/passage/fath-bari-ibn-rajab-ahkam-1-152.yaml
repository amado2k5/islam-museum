text: "… والمندوبات، وبالمقاربةِ: الاقتصارُ على الواجباتِ. وقيل فيهما غيرُ ذلك. وقوله أبشرُوا يعني: أن من قصد المرادَ فَلْيُبَشِّرْ. وخرَّج البخاريُّ في موضع آخرَ من صحيحه من حديث عائشةَ أن النبي وَا قه قال: سدِّدُوا وقاربُوا وأبشرُوا. وقوله واسْتَعِينُوا بالغُدْوَةِ والرَّوْحةِ وشَيءٍ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 152، يرد فيه ذكر الواجب، والمندوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
