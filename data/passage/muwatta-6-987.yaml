text: "العمرة إلى العمرة كفارة لما بينهما، والحج المبرور ليس له جزاء إلا الجنة"
summary:
  ar: "أول حديث في باب جامع ما جاء في العمرة. يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي صالح السمان عن أبي هريرة، أن رسول الله قال: العمرة إلى العمرة كفارة لما بينهما، والحج المبرور ليس له جزاء إلا الجنة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1125) والبغوي وسويد (521) وعبد الله بن مسلمة القعنبي عند الجوهري، والتنيسي عند البخاري (1773)، ويحيى بن يحيى النيسابوري عند مسلم (4/107). {cite:muwatta-maruf-1997 p.464} {cite:muwatta-maruf-1997 p.465}"
