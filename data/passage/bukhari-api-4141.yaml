label: { ar: "صحيح البخاري 4141 — أطوار خلق الجنين", en: "Sahih al-Bukhari 4141 — the stages of the embryo", ur: "صحیح بخاری 4141 — جنین کے مراحل" }
text: "… وَهُمْ يَحْسِبُونَ أَنِّي فِيهِ، وَكَانَ النِّسَاءُ إِذْ ذَاكَ خِفَافًا لَمْ يَهْبُلْنَ وَلَمْ يَغْشَهُنَّ اللَّحْمُ، إِنَّمَا يَأْكُلْنَ الْعُلْقَةَ مِنَ الطَّعَامِ، فَلَمْ يَسْتَنْكِرِ الْقَوْمُ خِفَّةَ الْهَوْدَجِ حِينَ رَفَعُوهُ وَحَمَلُوهُ، وَكُنْتُ جَارِيَةً حَدِيثَةَ السِّنِّ، فَبَعَثُوا الْجَمَلَ فَسَارُوا، وَوَجَدْتُ عِقْدِي بَعْدَ مَا اسْتَمَرَّ الْجَيْشُ، فَجِئْتُ مَنَازِلَهُمْ وَلَيْسَ بِهَا مِنْهُمْ دَاعٍ وَلاَ مُجِيبٌ، فَتَيَمَّمْتُ مَنْزِلِي الَّذِي كُنْتُ بِهِ، وَظَنَنْتُ أَنَّهُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4141، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4141 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4141، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
