text: "… وَهُمْ يَحْسِبُونَ أَنِّي فِيهِ، وَكَانَ النِّسَاءُ إِذْ ذَاكَ خِفَافًا لَمْ يَهْبُلْنَ وَلَمْ يَغْشَهُنَّ اللَّحْمُ، إِنَّمَا يَأْكُلْنَ الْعُلْقَةَ مِنَ الطَّعَامِ، فَلَمْ يَسْتَنْكِرِ الْقَوْمُ خِفَّةَ الْهَوْدَجِ حِينَ رَفَعُوهُ وَحَمَلُوهُ، وَكُنْتُ جَارِيَةً حَدِيثَةَ السِّنِّ، فَبَعَثُوا الْجَمَلَ فَسَارُوا، وَوَجَدْتُ عِقْدِي بَعْدَ مَا اسْتَمَرَّ الْجَيْشُ، فَجِئْتُ مَنَازِلَهُمْ وَلَيْسَ بِهَا مِنْهُمْ دَاعٍ وَلاَ مُجِيبٌ، فَتَيَمَّمْتُ مَنْزِلِي الَّذِي كُنْتُ بِهِ، وَظَنَنْتُ أَنَّهُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4141، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4141 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4141، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 4141 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona las etapas del desarrollo embrionario. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un récit du Sahih al-Bukhari, n° 4141 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne les stades du développement embryonnaire. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4141 numaralı hadis, fetüsün gelişim aşamalarını anlatmaktadır. Bu hadis, tıp camiası tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine yazılmış metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4141, menjelaskan tahapan perkembangan janin. Hadits ini dikumpulkan oleh komunitas medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
