text: "… بالف بعد الراء وفتح الياء وقرأ ورش الراء بين • اللفظين والباقون باخلاص فتحها وبذلك يأخذ عامّة اهل الاداء فى مذهب ابى عمرو وهو قول ابن مجاهد وبه قرأت وبذلك ورد النص عنه عن طريق السوسى عن اليزيدى وغيره تافع …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 1، ص 146، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 1, p. 146, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 1، ص 146 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Taysir fi al-Qira'at al-Sab' de al-Dani, volumen 1, pág. 146, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait de l'ouvrage d'al-Dani, al-Taysir fi al-Qira'at al-Sab', volume 1, page 146, mentionnant les lectures du Coran et les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "Al-Dani'nin \"Al-Taysir fi al-Qira'at al-Sab'a\" (Yedi Kıraat'ın Kolaylaştırılması) adlı eserinin 1. cildinin 146. sayfasından, Kur'an kıraatleri ve okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an kıraatleri, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan) karya Al-Dani, Jilid 1, halaman 146, yang menyebutkan bacaan Al-Quran dan para qarinya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
