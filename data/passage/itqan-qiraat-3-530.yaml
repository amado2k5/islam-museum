label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 530 — قراءات القرآن، القراء", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 530 — the readings of the Qur'an; the readers", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 530 — قرآن کی قراءتیں، قراء" }
text: "… المصحفِ. أبي يُشَدِّدُ النكيرَ على بعض القضاةِ، وقد بَلَغَه أنه مَنَعَ من القراءةِ بها، واستأذنه بعضُ أصحابنا مرةً في إقراءِ السبع فقال : أَذِنْتُ لك أن تُقْرِئَ العشر انتهى. وقال في جوابِ سؤالٍ سأله ابنُ الجَزَري : القراءاتُ السبعُ التي …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 530، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 530, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 530 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
