ref: "19"
label: { ar: "غزوة بدر الكبرى — سببها والمناداة لبني هاشم", en: "Battle of Badr — its cause and the call to Banu Hashim" }
text: "نادى منادي المشركين: يا محمد، أخرج لنا الأكفاء من قومنا. فقال لهم رسول الله: يا بني هاشم، قوموا فقاتلوا بحقكم الذي بعث الله به نبيكم"
summary:
  ar: "سرد الواقدي خبر حيلة المشركين لاستخراج ثلاثة من أصحاب النبي للمبارزة قبل القتال، ومناديهم ينادي: «يا محمد، أخرج لنا الأكفاء من قومنا». فدعا النبي بني هاشم ليقوموا بقتالهم بحق النبوة، فخرج حمزة وعلي وعبيدة بن الحارث، ففازوا بأنفسهم وجرحوا عتبة وشيبة والوليد. ثم كانت مجزرة بدر بعد أن أظهر الله نصره."
  en: "Waqidi recounts how the Quraysh sought single combatants: their caller shouted 'Muhammad, send out our peers from your people,' and the Prophet called Banu Hashim to answer in their own right — Hamza, Ali and Ubayda ibn al-Harith won their duels before the rout at Badr."
