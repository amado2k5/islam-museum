label: { ar: "غزوة بدر الكبرى — سببها والمناداة لبني هاشم", en: "Battle of Badr — its cause and the call to Banu Hashim", es: "La batalla de Badr: su causa y el llamamiento a Banu Hashim.", fr: "La bataille de Badr — sa cause et l'appel aux Banu Hashim", ur: "غزوہ بدر - اس کا سبب اور بنو ہاشم کی دعوت", tr: "Bedir Muharebesi — sebebi ve Beni Haşim'e çağrı", id: "Perang Badar — penyebabnya dan seruan kepada Bani Hasyim" }
text: "نادى منادي المشركين: يا محمد، أخرج لنا الأكفاء من قومنا. فقال لهم رسول الله: يا بني هاشم، قوموا فقاتلوا بحقكم الذي بعث الله به نبيكم"
summary:
  ar: "سرد الواقدي خبر حيلة المشركين لاستخراج ثلاثة من أصحاب النبي للمبارزة قبل القتال، ومناديهم ينادي: «يا محمد، أخرج لنا الأكفاء من قومنا». فدعا النبي بني هاشم ليقوموا بقتالهم بحق النبوة، فخرج حمزة وعلي وعبيدة بن الحارث، ففازوا بأنفسهم وجرحوا عتبة وشيبة والوليد. ثم كانت مجزرة بدر بعد أن أظهر الله نصره."
  en: "Waqidi recounts how the Quraysh sought single combatants: their caller shouted 'Muhammad, send out our peers from your people,' and the Prophet called Banu Hashim to answer in their own right — Hamza, Ali and Ubayda ibn al-Harith won their duels before the rout at Badr."
  es: "Waqidi relata cómo los Quraysh buscaban combatientes solitarios: su pregonero gritó: \"Mahoma, envía a nuestros iguales de entre tu pueblo\", y el Profeta llamó a los Banu Hashim para que respondieran por derecho propio; Hamza, Ali y Ubayda ibn al-Harith ganaron sus duelos antes de la derrota en Badr."
  fr: "Waqidi raconte comment les Quraysh cherchaient des combattants individuels: leur meneur cria « Muhammad, envoie nos pairs de ton peuple », et le Prophète appela Banu Hashim à répondre de leur propre chef — Hamza, Ali et Ubayda ibn al-Harith remportèrent leurs duels avant la déroute de Badr."
  ur: "واقدی بیان کرتے ہیں کہ قریش نے کس طرح اکیلی جنگجوؤں کی تلاش کی: ان کے پکارنے والے نے پکارا 'محمد، ہمارے ساتھیوں کو اپنی قوم میں سے بھیج دو،' اور نبی نے بنو ہاشم کو اپنے حق میں جواب دینے کے لیے بلایا - حمزہ، علی اور عبیدہ بن الحارث نے بدر میں شکست سے پہلے اپنی لڑائی جیت لی۔"
  tr: "El-Vakidi, müşriklerin, savaştan önce Peygamber'in üç sahabesini teke tek dövüşe çekmek için kurdukları hileyi anlattı. Habercileri, \"Ey Muhammed, layık rakiplerimizi gönder!\" diye seslendi. Bunun üzerine Peygamber, peygamberliğin hakikatine uygun olarak onlarla savaşmaları için Beni Haşim'i çağırdı. Hamza, Ali ve Ubeyde ibn el-Harith öne çıktılar ve Utbe, Şeybe ve el-Valid'i yaralayarak zafer kazandılar. Ardından, Allah'ın zaferi bahşetmesinin ardından Bedir katliamı yaşandı."
  id: "Al-Waqidi menceritakan kisah tipu daya kaum musyrik untuk memancing tiga sahabat Nabi keluar untuk duel satu lawan satu sebelum pertempuran. Utusan mereka berseru, \"Wahai Muhammad, kirimkan lawan-lawan kami yang layak!\" Maka Nabi menyeru Bani Hasyim untuk melawan mereka sesuai dengan kebenaran kenabian. Hamza, Ali, dan Ubayda ibn al-Harith maju, dan mereka menang, melukai Utbah, Shaybah, dan al-Walid. Kemudian terjadilah pembantaian Badar setelah Allah memberikan kemenangan."
