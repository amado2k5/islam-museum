text: "… يجوز البحث في القدر؟ نعم، فنحن الآن نبحث ونتكلم في القدر، وهذا الذي نتكلم فيه ليس هو الذي نُهينا عنه، نحن الآن نتكلم في معرفة ما يجوز وما لا يجوز من الكلام في القدر، فالإيمان بالقدر أحد أصول الإيمان، والإيمان …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 173، يذكر أركان الإيمان، والإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
