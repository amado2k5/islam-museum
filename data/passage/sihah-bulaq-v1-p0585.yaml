  ختلفوافيه قال الكسائى أصل قدته قولته وقال سيبويه لا يجوزذلك لانه يتعدى وايس
  كذلك طلته ألاترى أنك تقول طويل وأرحبت الشئ وسعته قال انجاج حين قتسل ابن
  القرية أرحب ياغلام جرحه ويقال أيضافى زجر الفرس ارحب وأرحى اى توسعى
  وتناعدى قال الشاعر نعلهاهى وهلا وأرحب ورحبسة المسجد بالتحريك ساحته
  والجمع رحب ورحبات ورحاب وبنورحب أيضابطن من همدان وأرحب قبيلة من همدان
  قال الكميت يقولون لم يورث ولولاترائه • لقدشركت فيه بكيل وأرحب
  وتنسب ل ا الارحبيات من الابل دب ) الاردبة مكبال ٢ خم لاهل مصر
  قال الاخطل ٣ والخبز كالعنبر الهندى عندهم * والقمح سبعون إردبابدينار
  والاردية القرميدو و لا جر الكبير ⁦( زب)⁩ المرزاب لغة فى الميزاب وليست بالفصيحة
  أبوزيد المرازيب السفن الطوال الواحدة مرزاب والارزب القصير وهو ملحق بجرد حسل
  وركب إرزب أى ضخم قال رؤية كرّ الحيا أمح ارزب والارزية التى يكسرجها
  المدر فان قلتها بالميم خففت فقلت المرزية وأنشدالفراء ضريك بالمرزية العود النخر*
