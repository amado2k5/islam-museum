  وليست بسنهاء ولارجبية ١ لكن عرايا فى السنين الجوائح
  والرجبة أيضابناء يبنى يصادبه الذتب وغيره يوضع فيه لحم ويشد بخيط فاذاحذ به سقط عليه
  الرجبة والراجية فى الاصبع واحدة الرواجب وهى مفاصل الاصابع اللاتى تلى الانامل
  واح_دها رجب ورجب ثم البراجم ثم الاشاجع اللاتى يلين السكف قال الاصمعىّ الأرجاب
  الامعاء ولم يعرف واحدها قال أبو سهل قال ابن حدويه واحد ها رجب : كسر الراء
  وسكون الجيم وقال غيره واحط هارجب بقتحهما ( رحب الرحب بالضم السعة تقول
  منه فلان رحب الصدر والرحب بالفتح الواسع تقول منه بلدرحب وأرض رحبة وقد رحبت
  بالضم ترحب رحباورحابة وقوله-م مرحباوأهلا أى أتيت سعة وأتيت أهلافاستأنس
  ولا تستوحسْ وقد رحب به ترحيبا اذا قال له حى حبا وقول الشاءر
  وكيف نواصل من أصبحت * خلاله كابى مرحب يعنى به الظل
  وقد ررحاب أى واسعة والرحبى أعرض الاضلاع وانما يكون الناحز فى الرحبييز وهما
  مرجع المرفقين وهو أيضاسمة فى جنب البعير والرحيب الاكول وفلان رحيب
  الصدر أى واسع الصدر ورحائب التخوم سعة أقطار الارض ورحبت الداروا رحبت بمعنى
  أى انسعت قال الخليل قال نصر بن سيارأرحبكم الدخول فى طاعة الكرمانى أى
