  مرزيان الزأرة قال أوس فى صفة أسد
  ليث عليه من البردى هبربة • كالمرزبانى عيال بأوصال ص وابهبا صال اه
  ورواه المفضل كالمزبرانى عيار بأ وصال ذهب الى زبرة الاسد فقال له الاصمى ياعجباه الشئ
