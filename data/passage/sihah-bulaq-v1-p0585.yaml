text: |-
  قوله الرحى عب لى وتثنته
  رجبيان اه
  ٢ ال ابن برى ليس بصحيح لان
  الاردب لايكال به وانما يكال
  فالويبة
  قوم اذا استنبح الاضاف كابهمو
  قالو الاتهم بولى على الذار
  وهذا أشجى بدت قالته العرب
  اه مرتضى
  أعوذ بالله من المرازبه
  وماباً يديهم من المرازيه
  أه مرتضى
