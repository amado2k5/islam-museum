label: { ar: "سنن النسائي 5004 — شعب الإيمان، الإيمان بضع وسبعون شعبة", en: "Sunan al-Nasa'i 5004 — the branches of faith; faith as seventy-odd branches", ur: "سنن نسائی 5004 — ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں", es: "Sunan al-Nasa'i 5004 — Las ramas de la fe; la fe como setenta y tantos ramas", fr: "Sunan al-Nasa'i 5004 — les branches de la foi; la foi comme soixante-dix branches environ" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ الْمُبَارَكِ، قَالَ حَدَّثَنَا أَبُو عَامِرٍ، قَالَ حَدَّثَنَا سُلَيْمَانُ، - وَهُوَ ابْنُ بِلاَلٍ - عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" الإِيمَانُ بِضْعٌ وَسَبْعُونَ شُعْبَةً وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5004، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5004 (The Book Of Faith and its Signs), that mentions the branches of faith, faith as seventy-odd branches. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5004، جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5004 (El Libro de la Fe y sus Signos), menciona las ramas de la fe, que constan de setenta y tantos. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5004 (Le Livre de la Foi et ses Signes), mentionne les soixante-dix branches de la foi. Le moteur de recherche « Piliers et Branches de la Foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
