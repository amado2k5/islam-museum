text: "… فسماه رسول الله وَلِلِهِ أن عليّا بعث إلى النبى وَظِيفِ بذهيية فى أديم مقروظ لم تحصل من تربتها أبو سعيد الخدري قتادة آن عليًا تزوج أمامة هذه بعد موت خالتها آن عليا حرق ناسا، عكرمة أن عليًّا لما حضرته الوفاة …"
summary:
