text: |-
  البشكراه
  ١٩٦
  . ..مجل).
  وأءوج لبنى آكل المرار ثم صار لبنى هلال بن عامر وقال
  هوالجواداين الجوادا بن سبل * والسبل أيضاداء فى العين شبه غشاوة كانهانسج
  العنصكبوت بعروق حر والسبيل الطريق يذكرويونت قال اللّٰه تعالى قل هذه سبيلى
  فأنت وقال وان يرواسبيل الرشدلا يتخذوم سيلا فذكر وسيل ضيعته أى جعلها فى سعيل اللّٰه
  وقوله تعالى باليقنى اتخذت مع الرسول سبيلا أى سيباووصلة وأنشد أبو عبيدة لحرير
  أفبعد مقتلكم خليل محمد • برج والقيون مع الرسول سيلا
  أى سعياووص-لة والسابلة أبناء السبيل المختلفة فى الطرقات وأسبال الدلونغاهها
  قال الشاعر (١
  اذ أرسلونى ماتحابدلاتهم • فلاتها علقا الى أسبالها
  يقول بعثونى طالبالتراتهم فأكثرت من القتل والعلق الدم والمسبل السادس -ن سهام الميسر
  وهو المصفيح أيضا والسيلة الشارب والبمع السبال والسنيلة واحدة سنابل الزرع وقد سنيل
  الزرع اذا خرج سنبله والسنبلة برح فى السماء وملسبيل اسم عين فى الجنة قال تعالى عينا
  فيها تسهى سلسبيلا قال الاخفس هى معرفة ولكن لما كان رأس آية وكان مفوحازيدت
  فيه الالف كما قال كانت قوارير اقواريرا ( حل لسجدل على وزن الهجف الضخم من
  الضرب والبعبروااسقاء والجارية والاتى سبحلة مثل ربحلة يقال سقاء سبحل وسبحلل أيضا
  عن ابن السكيت وسحل الرحل اذا قال سبحان اللّٰه ⁦(سبغل)⁩ اسبغلّ الذوب اسبغلالا
  اذا ابتل بالماء وازيغل مثله ⁦(سبهل)⁩ أبوزيده والضلال بن السبهال يعنى الباطل قال
  الاصمعىّ جاء الرجل يمشى سبه للا اذا باء وذهب فى غيرشئ وقال عررضى اللّٰه عنه انى لأكره
  أن أرى أحدكم سبه للالا فى عمل دنيا ولا في عمل آخرة قال الصكسائى جاءنافلات سبى لملا
  أى ليس معمتئ وأنشد
  اذا الجارلم يعلم مجير ايجيره • فصار حريبا فى الديارسبه للا
  قطعناله من عفوة المال عيشة • فأثرى فلايقى سوانا محوّلا
  ( سصل السهبل مذكروه والدلواذا كان فيه ما« قل" أوكثرولا يقال لهاوهى فارغة مجل
  ولاذنوب والجمع السجال والسجيلة الدلو الغضمة قال الراجز
  خذها وأعط حمك السميله • ان لم يكن همك ذا حليله
  ومصلت الماء فانسجل أى صيبته فانسب وأسبحات الحوض ملانه وقال
  وغادر الاخذوالاوجاذ مترعة • تطفو وأسجل أنهاء وغدرانا
  والسصيل من الضروع الطويل يقال ناقة سيلاه والسجل الصل وقد سجل الحاكم تسيييلا
  وقوله تعالى حجارة من-يجيل قالواهى حجارة من طين طبذت بشارجهم مكتوب عليها أسهاه
  القوم لقوله تعانى ترسل عليهم حجارة من طين والمساجلة المفاخرة بان تصنع مثل صنعه فى
  جرى أو سقى وأمله من الدلو وقال الفضل بن عساس بن عتبة بن أبى لهب
  من بساجلنى يساجل ماجدا • علا الدلوالى عقد الكرب
  ومنه قولهم الحرب سجال وتساجلوا أى تفاخروا والمسجل المبسذول المباح الذى لا يمنع من
