label: { ar: "سنن النسائي 4988 — حلاوة الإيمان وكماله، خصال من كنّ فيه", en: "Sunan al-Nasa'i 4988 — the sweetness and completeness of faith; traits that, found in a person, mark faith", ur: "سنن نسائی 4988 — ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں", es: "Sunan al-Nasa'i 4988 — La dulzura y la plenitud de la fe; rasgos que, encontrados en una persona, marcan la fe.", fr: "Sunan al-Nasa'i 4988 — la douceur et la plénitude de la foi; les traits qui, chez une personne, marquent la foi" }
text: "… عَنْ شُعْبَةَ، عَنْ قَتَادَةَ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، يُحَدِّثُ عَنِ النَّبِيِّ قَالَ \" ثَلاَثٌ مَنْ كُنَّ فِيهِ وَجَدَ حَلاَوَةَ الإِيمَانِ مَنْ أَحَبَّ الْمَرْءَ لاَ يُحِبُّهُ إِلاَّ لِلَّهِ عَزَّ وَجَلَّ وَمَنْ كَانَ اللَّهُ عَزَّ وَجَلَّ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا وَمَنْ كَانَ أَنْ يُقْذَفَ فِي النَّارِ أَحَبَّ إِلَيْهِ مِنْ أَنْ يَرْجِعَ إِلَى الْكُفْرِ بَعْدَ أَنْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4988، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 4988 (The Book Of Faith and its Signs), that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 4988، جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4988 (El Libro de la Fe y sus Signos), menciona la dulzura y la plenitud de la fe, características que, presentes en una persona, la distinguen. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4988 (Le Livre de la Foi et ses Signes), évoque la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent. Le Navigateur des Piliers et des Branches de la Foi répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
