text: "دوس بن كامل عن شجاع بن مخلد: كنت عند أبي الوليد الطيالسي. فورد عليه كتاب أحمد بن حنبل، فسمعته يقول: ما بالمصرين- يعني البصرة والكوفة- أحد أحب إلي من أحمد ابن حنبل، ولا أرفع قدرا في نفسي منه. وقال أبو"
