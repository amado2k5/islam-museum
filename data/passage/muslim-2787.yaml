unit: hadith
work: work/sahih-muslim
ref: "2787"
label:
  ar: "مسلم 2787 — أنا الملك أين ملوك الأرض"
  en: "Muslim 2787 — I am the King; where are the kings of the earth?"
  ur: "مسلم 2787 — میں بادشاہ ہوں، زمین کے بادشاہ کہاں ہیں"
  es: "Musulmán 2787 — Yo soy el Rey; ¿dónde están los reyes de la tierra?"
  fr: "Muslim 2787 — Je suis le Roi; où sont les rois de la terre ?"
  tr: "Müslim 2787 — Ben kralım, yeryüzünün kralları nerede?"
  id: "Muslim 2787 — Akulah raja, di manakah raja-raja di bumi?"
text: "يقبض الله الأرض ويطوي السماوات بيمينه ثم يقول أنا الملك أين ملوك الأرض …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2787: أنا الملك أين ملوك الأرض. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2787: I am the King; where are the kings of the earth?. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2787: میں بادشاہ ہوں، زمین کے بادشاہ کہاں ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2787: «Yo soy el Rey; ¿dónde están los reyes de la tierra?». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2787: « Je suis le Roi; où sont les rois de la terre ? » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations à travers les six livres et la Muwatta."
  tr: "Sahih Müslim'de 2787 numaralı hadis-i kudsi şöyledir: \"Ben Kralım, yeryüzünün kralları nerede?\" Peygamberimiz bunu Rabbinden rivayet etmiştir ve hadis-i kudsiyi inceleyenler bunun rivayetlerini altı şeriat hadis külliyatında ve Muvatta'da bulacaklardır."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2787: “Akulah Raja, di manakah raja-raja di bumi?” Nabi meriwayatkannya dari Tuhannya, dan mereka yang mempelajari hadits qudsi akan menemukan riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
