text: "حَدَّثَنَا مُحَمَّدُ بْنُ عَبَادَةَ، أَخْبَرَنَا يَزِيدُ، أَخْبَرَنَا سَلِيمٌ، حَدَّثَنَا عَمْرُو بْنُ دِينَارٍ، حَدَّثَنَا جَابِرُ بْنُ عَبْدِ اللَّهِ، أَنَّ مُعَاذَ بْنَ جَبَلٍ ـ كَانَ يُصَلِّي مَعَ النَّبِيِّ ثُمَّ يَأْتِي قَوْمَهُ فَيُصَلِّي بِهِمُ الصَّلاَةَ، فَقَرَأَ بِهِمُ الْبَقَرَةَ ـ قَالَ ـ فَتَجَوَّزَ رَجُلٌ فَصَلَّى صَلاَةً خَفِيفَةً، فَبَلَغَ ذَلِكَ مُعَاذًا فَقَالَ إِنَّهُ مُنَافِقٌ. فَبَلَغَ ذَلِكَ الرَّجُلَ، فَأَتَى النَّبِيَّ فَقَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6106، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6106 (Good Manners and Form (Al-Adab)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 6106، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 6106 (Buenas costumbres y modales (Al-Adab)), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
