label: { ar: "الموطأ 919 — فاطمة بنت المنذر: كنا نخمر وجوهنا ونحن محرمات، ونحن مع أسماء بنت أبي بكر", en: "Muwatta 919", es: "Muwatta 919", fr: "Muwatta 919", ur: "موطا 919", tr: "El-Muvatta 919 — Fatıma bint el-Mundhir: İhram halindeyken yüzlerimizi örterdik ve Asma bint Ebu Bekir ile birlikteydik.", id: "Al-Muwatta 919 — Fatima bint al-Mundhir: Kami biasa menutupi wajah kami ketika dalam keadaan ihram, dan kami bersama Asma bint Abi Bakr" }
text: "كنا نخمر وجوهنا ونحن محرمات"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن فاطمة بنت المنذر، أنها قالت: كنا نخمر وجوهنا ونحن محرمات، ونحن مع أسماء بنت أبي بكر الصديق. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1050) وسويد (494). {cite:muwatta-maruf-1997 p.441}"
  tr: "Malik, Hişam ibn Urvah'tan, o da Fatıma bint el-Mundhir'den rivayet ederek şöyle buyurmuştur: \"İhram halindeyken yüzlerimizi örtüyorduk ve Asma bint Ebu Bekir el-Siddik ile birlikteydik.\" Editör, bunun Malik'ten Ebu Mus'ab (1050) ve Suveyd (494) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.441}"
  id: "Malik meriwayatkan hadits ini dari Hisham binn Urwah, yang juga dari Fatimah bint al-Mundhir, yang berkata: \"Kami biasa menutupi wajah kami ketika dalam keadaan ihram, dan kami bersama Asma bint Abi Bakr al-Siddiq.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1050) dan Suwaid (494). {cite:muwatta-maruf-1997 p.441}"
