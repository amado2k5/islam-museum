text: "… كانوايعملون، وما أنا بطارد المؤمنين ? فقلت : إما مثلى ومثلك كمثل الطبيب والصيد لالى فانا الطبيب وأنت الصيدلانى. • حدثنا سليمان بن أحمد ثنا أحمد بن سهل بن أيوب ثنا على بن بحر قال سمعت المؤمل بن إسماعيل يقول …"
