text: "… كانوايعملون، وما أنا بطارد المؤمنين ? فقلت : إما مثلى ومثلك كمثل الطبيب والصيد لالى فانا الطبيب وأنت الصيدلانى. • حدثنا سليمان بن أحمد ثنا أحمد بن سهل بن أيوب ثنا على بن بحر قال سمعت المؤمل بن إسماعيل يقول …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 7، ص 29، يذكر الطب والطبيب، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 7, p. 29, that mentions medicine and the physician, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 7، ص 29 کا اقتباس جس میں طب اور طبیب، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 7, pág. 29, que menciona la medicina y el médico, los medicamentos y la farmacia; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 7, p. 29, qui mentionne la médecine et le médecin, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 7. cildinin 29. sayfasından, tıp ve hekim, ilaçlar ve eczacılıktan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikası gereği metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 7, hlm. 29, yang menyebutkan tentang kedokteran dan dokter, obat-obatan dan farmasi; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
