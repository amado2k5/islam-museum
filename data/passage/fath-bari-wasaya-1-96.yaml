  tr: "İbn Hacer'in Feth el-Bari adlı eserinin resimli 1. cildinin 96. sayfasından, vasiyetname veya son vasiyetnameden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
