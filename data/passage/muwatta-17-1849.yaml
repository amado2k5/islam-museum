label: { ar: "الموطأ 1849 — مالك عن نافع عن ابن عمر: قال عمر لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا الورق بالورق، ولا الورق بالذهب إذا كان أحدهما غائبا، وإني أخاف عليكم الرماء وهو الربا", en: "Muwatta 1849", es: "Muwatta 1849", fr: "Muwatta 1849", ur: "موطا 1849", tr: "El-Muvatta 1849 — Malik, Nafi'den, o da İbn Ömer'den rivayetle: Ömer dedi ki: \"Altını altına altınla, gümüşü gümüşle, gümüşü de altından satmayın, eğer biri eksikse. Ve ben sizin için faiz (riba) riskinden korkuyorum.\"", id: "Al-Muwatta 1849 — Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Ibn Umar: Umar berkata, “Janganlah kalian menjual emas dengan emas kecuali dengan cara yang sama, dan jangan pula menjual perak dengan perak, dan jangan pula menjual perak dengan emas jika salah satu dari keduanya tidak ada. Dan aku khawatir kalian akan terjerat riba.”" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن عمر بن الخطاب قال: لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا الورق بالورق إلا مثلا بمثل، ولا تشفوا بعضها على بعض. ولا تبيعوا الورق بالذهب، أحدهما غائب والآخر ناجز. وإن استنظرك إلى أن يلج بيته فلا تنظره، إني أخاف عليكم الرماء. والرماء هو الربا. {cite:muwatta-maruf-1997 p.160}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Ömer ibn el-Hattab şöyle buyurmuştur: “Altını altına ancak aynı miktarda alınıp satmayın ve birini diğerine tercih etmeyin. Gümüşü gümüşe ancak aynı miktarda alınıp satmayın ve birini diğerine tercih etmeyin. Biri yokken diğeri varken gümüşü altına çevirmeyin. Eğer sizden evine girene kadar beklemenizi isterse, ona bu gecikmeyi vermeyin; çünkü sizin için faizcilikten korkuyorum.” (Faizcilik, faizciliktir.)"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa Umar ibn al-Khattab berkata: “Janganlah kalian menjual emas dengan emas kecuali dengan nilai yang sama, dan janganlah kalian mengutamakan salah satu di antara keduanya. Janganlah kalian menjual perak dengan perak kecuali dengan nilai yang sama, dan janganlah kalian mengutamakan salah satu di antara keduanya. Janganlah kalian menjual perak dengan emas ketika salah satu tidak ada dan yang lain ada. Jika dia meminta kalian menunggu sampai dia masuk ke rumahnya, janganlah kalian mengabulkan permintaan itu, karena aku khawatir kalian telah melakukan praktik riba.” (Riba adalah praktik riba.)"
