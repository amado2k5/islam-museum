label: { ar: "الموطأ 1849 — مالك عن نافع عن ابن عمر: قال عمر لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا الورق بالورق، ولا الورق بالذهب إذا كان أحدهما غائبا، وإني أخاف عليكم الرماء وهو الربا", en: "Muwatta 1849" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن عمر بن الخطاب قال: لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا الورق بالورق إلا مثلا بمثل، ولا تشفوا بعضها على بعض. ولا تبيعوا الورق بالذهب، أحدهما غائب والآخر ناجز. وإن استنظرك إلى أن يلج بيته فلا تنظره، إني أخاف عليكم الرماء. والرماء هو الربا. {cite:muwatta-maruf-1997 p.160}"
