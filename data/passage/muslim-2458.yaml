label: { ar: "مسلم 2458 — سمعت خشف نعليك بين يدي في الجنة", en: "Muslim 2458 — I heard the shuffle of your sandals ahead of me in Paradise", es: "Musulmán 2458 — Escuché el arrastrar de tus sandalias delante de mí en el Paraíso", fr: "Muslim 2458 — J'ai entendu le bruit de tes sandales devant moi au Paradis", ur: "مسلم 2458 — میں نے جنت میں اپنے آگے آپ کے جوتوں کے بدلنے کی آواز سنی", tr: "Müslim 2458 — Cennette önümde senin sandaletlerinin sesini duydum.", id: "Muslim 2458 — Aku mendengar suara sandalmu sebelumku di Surga" }
text: "قال رسول الله لبلال عند صلاة الغداة: «يا بلال، حدثني بأرجى عمل عملته في الإسلام منفعة، فإني سمعت الليلة خشف نعليك بين يدي في الجنة»؛ قال بلال: ما عملت عملاً أرجى عندي من أني لا أتطهر طهوراً تاماً في ساعة من ليل ولا نهار إلا صليت بذلك الطهور ما كتب لي أن أصلي"
summary:
  ar: "رواية أبي هريرة في باب فضائل بلال من صحيح مسلم؛ سماع النبي خشف نعلي بلال أمامه في الجنة، وإجابة بلال عن عمله: المحافظة على الصلاة بكل طهور — من أشهر نصوص البشارة بالجنة."
  tr: "Sahih Müslim'de Bilal'in faziletleri bölümünde Ebu Hurayra'nın rivayeti; Peygamber'in cennette önünde Bilal'in sandaletlerinin sesini duyması ve Bilal'in göreviyle ilgili olarak verdiği cevap: \"Namazı her türlü temizlikle birlikte sürdürmek\" - cennetin müjdesinin en meşhur metinlerinden biridir."
  id: "Riwayat Abu Hurairah dalam surah tentang keutamaan Bilal dalam Sahih Muslim; Nabi mendengar suara sandal Bilal di hadapannya di Surga, dan jawaban Bilal mengenai pekerjaannya: mendirikan salat dengan setiap penyucian — adalah salah satu teks paling terkenal tentang kabar gembira Surga."
