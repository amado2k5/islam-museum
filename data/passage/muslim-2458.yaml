label: { ar: "مسلم 2458 — سمعت خشف نعليك بين يدي في الجنة", en: "Muslim 2458 — I heard the shuffle of your sandals ahead of me in Paradise" }
text: "قال رسول الله لبلال عند صلاة الغداة: «يا بلال، حدثني بأرجى عمل عملته في الإسلام منفعة، فإني سمعت الليلة خشف نعليك بين يدي في الجنة»؛ قال بلال: ما عملت عملاً أرجى عندي من أني لا أتطهر طهوراً تاماً في ساعة من ليل ولا نهار إلا صليت بذلك الطهور ما كتب لي أن أصلي"
summary:
  ar: "رواية أبي هريرة في باب فضائل بلال من صحيح مسلم؛ سماع النبي خشف نعلي بلال أمامه في الجنة، وإجابة بلال عن عمله: المحافظة على الصلاة بكل طهور — من أشهر نصوص البشارة بالجنة."
