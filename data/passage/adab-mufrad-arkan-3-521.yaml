text: "… من دعا اللَّه أن يحسن خُلُقه. تحته حديث عائشة : كان خلقه القرآن. - باب ليس المؤمن بالطعان. فيه حديث ابن عمر، وعائشة، وابن مسعود، وأبي هريرة، وأثر ابن مسعود. - باب اللَّعّان. فيه عن أبي الدرداء، وأبي هريرة، وأثر …"
summary:
