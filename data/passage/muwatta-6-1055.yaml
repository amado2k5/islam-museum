text: "ما أبالي أصليت في الحجر أم في البيت"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن عائشة أم المؤمنين قالت: ما أبالي أصليت في الحجر أم في البيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1279). {cite:muwatta-maruf-1997 p.489}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Müminlerin Annesi Aişe'nin şöyle dediğini nakletmiştir: \"Hicr'de mi yoksa Kâbe'de mi namaz kıldığımın önemi yoktur.\" Editör, bunun Malik'ten Ebu Mus'ab (1279) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.489}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa Aisyah, Ummul Mukminin, berkata: \"Aku tidak peduli apakah aku shalat di Hijr atau di Ka'bah.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1279). {cite:muwatta-maruf-1997 p.489}"
