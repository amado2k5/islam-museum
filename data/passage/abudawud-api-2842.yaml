label: { ar: "سنن أبي داود 2842 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan Abi Dawud 2842 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن ابی داؤد 2842 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Abi Dawud 2842 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sunan Abi Dawud 2842 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux" }
text: "… بْنُ سُلَيْمَانَ الأَنْبَارِيُّ حَدَّثَنَا عَبْدُ الْمَلِكِ - يَعْنِي ابْنَ عَمْرٍو - عَنْ دَاوُدَ عَنْ عَمْرِو بْنِ شُعَيْبٍ عَنْ أَبِيهِ أُرَاهُ عَنْ جَدِّهِ قَالَ سُئِلَ رَسُولُ اللَّهِ عَنِ الْعَقِيقَةِ فَقَالَ \" لاَ يُحِبُّ اللَّهُ الْعُقُوقَ \". كَأَنَّهُ كَرِهَ الاِسْمَ وَقَالَ \" مَنْ وُلِدَ لَهُ وَلَدٌ فَأَحَبَّ أَنْ يَنْسُكَ عَنْهُ فَلْيَنْسُكْ عَنِ الْغُلاَمِ شَاتَانِ مُكَافِئَتَانِ وَعَنِ الْجَارِيَةِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2842، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2842 (Sacrifice (Kitab Al-Dahaya)), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2842، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2842 (El Sacrificio (Kitab Al-Dahaya)), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2842 (Sacrifice (Kitab Al-Dahaya)), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
