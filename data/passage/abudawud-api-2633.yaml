text: "دُعَاءِ الْمُشْرِكِينَ، عِنْدَ الْقِتَالِ فَكَتَبَ إِلَىَّ أَنَّ ذَلِكَ كَانَ فِي أَوَّلِ الإِسْلاَمِ وَقَدْ أَغَارَ نَبِيُّ اللَّهِ صلى الله عليه وسلم عَلَى بَنِي الْمُصْطَلِقِ وَهُمْ غَارُّونَ وَأَنْعَامُهُمْ تُسْقَى عَلَى الْمَاءِ فَقَتَلَ مُقَاتِلَتَهُمْ وَسَبَى سَبْيَهُمْ وَأَصَابَ يَوْمَئِذٍ جُوَيْرِيَةَ بِنْتَ الْحَارِثِ حَدَّثَنِي بِذَلِكَ عَبْدُ اللَّهِ وَكَانَ فِي ذَلِكَ الْجَيْشِ ‏.‏ قَالَ أَبُو دَاوُدَ هَذَا حَدِيثٌ نَبِيلٌ رَوَاهُ ابْن …"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
