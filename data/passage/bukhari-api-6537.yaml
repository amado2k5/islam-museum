label: { ar: "صحيح البخاري 6537 — كتاب الأعمال والملائكة الكاتبون، الحساب", en: "Sahih al-Bukhari 6537 — the record of deeds and the recording angels; the reckoning", ur: "صحیح بخاری 6537 — نامۂ اعمال اور لکھنے والے فرشتے، حساب", es: "Sahih al-Bukhari 6537 — El registro de los hechos y los ángeles que registran; el cálculo", fr: "Sahih al-Bukhari 6537 — le livre des actes et les anges enregistreurs; le décompte", tr: "Sahih el-Buhari 6537 — Amellerin Kitabı ve Hesap Melekleri, Hesaplama", id: "Sahih al-Bukhari 6537 — Kitab Amal dan Malaikat Pencatat, Perhitungan" }
text: "… بْنُ أَبِي مُلَيْكَةَ، حَدَّثَنِي الْقَاسِمُ بْنُ مُحَمَّدٍ، حَدَّثَتْنِي عَائِشَةُ، أَنَّ رَسُولَ اللَّهِ قَالَ \" لَيْسَ أَحَدٌ يُحَاسَبُ يَوْمَ الْقِيَامَةِ إِلاَّ هَلَكَ \". فَقُلْتُ يَا رَسُولَ اللَّهِ أَلَيْسَ قَدْ قَالَ اللَّهُ تَعَالَى {فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ * فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا} فَقَالَ رَسُولُ اللَّهِ \" إِنَّمَا ذَلِكِ الْعَرْضُ، وَلَيْسَ أَحَدٌ يُنَاقَشُ الْحِسَابَ يَوْمَ الْقِيَامَةِ إِلاَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6537، يذكر كتاب الأعمال والملائكة الكاتبون، والحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 6537 (To make the Heart Tender (Ar-Riqaq)), that speaks of the record of deeds and the recording angels, the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 6537، جس میں نامۂ اعمال اور لکھنے والے فرشتے، حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6537 (Para ablandar el corazón (Ar-Riqaq)), habla del registro de las obras y de los ángeles que las registran, el cálculo. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una obra."
  fr: "Un hadith du Sahih al-Bukhari, n° 6537 (Pour attendrir le cœur (Ar-Riqaq)), évoque le registre des actes et les anges qui le consignent, ainsi que le décompte des comptes. Le Livre des Hasanat et des Sayyi'at le mentionne parmi les textes relatifs au comptage, à l'écriture, à l'effacement ou à la pesée d'un acte."
  tr: "Sahih el-Buhari'de 6537 numaralı hadis, Amel Kitabı'ndan, kayıt tutan meleklerden ve hesaptan bahseder. Bu kitap, iyi ve kötü amellerin listesini, amelleri kaydeden, yazan, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6537, menyebutkan Kitab Amal, para malaikat pencatat, dan perhitungan amal. Kitab ini menggabungkan daftar amal baik dan buruk dengan teks-teks yang mencatat, menuliskan, menghapus, atau menimbang amal tersebut."
