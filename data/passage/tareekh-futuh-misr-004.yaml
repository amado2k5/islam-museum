text: "بن مسلمة الأنصارى وقد شهد بدرا ، وهو الذى كان بعثه عمر بن الخطاب إلى مصر،. فقاسم عمرو بن العاص ماله ، وهو أحد من صعد الحصن مع الزبير بن العوام ، ومسلمة بن محكد الأنصارى ، يقال له صحبة"
