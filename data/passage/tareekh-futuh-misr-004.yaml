  ur: "\"فتوح مصر - ابن عبد الحکم\" کا ایک اقتباس جس میں خط و کتابت، خط، خط یا سیاق و سباق میں جواب کی رپورٹ شامل ہے۔ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "İbn Abdül-Hakam'ın \"Mısır'ın Fethi\" adlı eserinden bir alıntı, bağlam içinde yazışma, kitap, mektup veya cevap haberlerini içerir; metin, kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanır."
