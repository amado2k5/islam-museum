text: "… أنا لم أنسه بل أنت نسيته دعاه الحاكم يوماً، وكان قد أوصى الطَّاهي أن يطبخ حلاوة التين بالقشطة، وبعد تناول الطعام، لم يحضر على المائدة شيء من ذلك، فأنقبض الشيخ، ولكنه لم يقل شيئاً. وبعد صلاة العشاء قال الحاكم: أسمعنا …"
summary:
  ar: "في عشاء عند الوالي غاب حلوى التين والقشدة التي طُلبت، وبعد صلاة العشاء طلب الوالي من جحا أن يقرأ شيئاً من القرآن، فبدأ جحا بالزيتون، فسأله الوالي لماذا نسي التين، فقال: أنا لم أنسه بل أنت نسيته. {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  en: "At a governor's dinner the fig-and-cream sweet that was ordered is missing. After the night prayer the governor asks Juha to recite part of the Qur'an, and Juha begins with the olive. The governor asks why he forgot the fig, and Juha says, 'I did not forget it; you forgot it.' {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  ur: "والی کے عشائیے میں منگوائی گئی انجیر اور بالائی کی مٹھائی غائب ہوتی ہے۔ عشاء کی نماز کے بعد والی جحا سے قرآن کا کچھ حصہ پڑھنے کو کہتا ہے اور جحا زیتون سے آغاز کرتا ہے۔ والی پوچھتا ہے کہ وہ انجیر کیوں بھول گیا، تو جحا کہتا ہے: میں نہیں بھولا، تم بھولے ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  fr: "Au dîner d'un gouverneur, la douceur aux figues et à la crème commandée est absente. Après la prière de la nuit, le gouverneur demande à Juha de réciter une partie du Coran, et Juha commence par l'olivier. Le gouverneur demande pourquoi il a oublié la figue, et Juha dit : « Je ne l'ai pas oubliée, c'est toi qui l'as oubliée. » {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  es: "En la cena de un gobernador falta el dulce de higos y crema que se había pedido. Tras la oración de la noche el gobernador pide a Juha que recite una parte del Corán, y Juha empieza por el olivo. El gobernador pregunta por qué olvidó el higo, y Juha dice: «Yo no lo olvidé, tú lo olvidaste». {cite:juha-nawadir-kubra-djuwaydi p. 123}"
