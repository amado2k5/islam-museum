label: { ar: "الموطأ 1216 — مالك سأل عبد الرحمن بن القاسم من أين كان القاسم يرمي جمرة العقبة، فقال من حيث تيسر", en: "Muwatta 1216", es: "Muwatta 1216", fr: "Muwatta 1216", ur: "موطا 1216", tr: "El-Muvatta 1216 — Malik, Abdülrahman ibn el-Kâsım'a Cemretü'l-Akabe'de taşları nereden attığını sordu ve o da şöyle dedi: Uygun gördüğü yerden.", id: "Al-Muwatta 1216 — Malik bertanya kepada Abd al-Rahman ibn al-Qasim dari mana al-Qasim melemparkan kerikil di Jamrat al-Aqaba, dan dia menjawab: Dari mana pun yang mudah dijangkau." }
text: "مِنْ حَيثُ تَيَسَّرَ"
summary:
  ar: "يروي مالك أنه سأل عبد الرحمن بن القاسم من أين كان القاسم بن محمد يرمي جمرة العقبة، فقال من حيث تيسر. {cite:muwatta-maruf-1997 p.544}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'a, el-Kâsım ibn Muhammed'in Cemretü'l-Akabe'de taşları nereden attığını sorduğunu ve onun da \"Uygun olan her yerden\" diye cevap verdiğini rivayet eder. {cite:muwatta-maruf-1997 s.544}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Abd al-Rahman ibn al-Qasim dari mana al-Qasim ibn Muhammad melemparkan kerikil di Jamrat al-Aqaba, dan ia menjawab, \"Dari mana pun yang mudah.\" {cite:muwatta-maruf-1997 p.544}"
