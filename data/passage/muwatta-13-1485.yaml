label: { ar: "الموطأ 1485 — مالك: أخوان لأب وأم يموتان، لأحدهما ولد والآخر لا ولد له، فميراث الذي لا ولد له لأخيه لأبيه، وليس لبني أخيه لأبيه وأمه شيء", en: "Muwatta 1485" }
summary:
  ar: "يقول مالك ومن ذلك أيضا الأخوان للأب والأم يموتان، ولأحدهما ولد، والآخر لا ولد له، ولهما أخ لأبيهما، فلا يعلم أيهما مات قبل، فميراث الذي لا ولد له لأخيه لأبيه، وليس لبني أخيه لأبيه وأمه شيء. {cite:muwatta-maruf-1997 p.25}"
