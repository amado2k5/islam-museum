label: { ar: "الموطأ 1485 — مالك: أخوان لأب وأم يموتان، لأحدهما ولد والآخر لا ولد له، فميراث الذي لا ولد له لأخيه لأبيه، وليس لبني أخيه لأبيه وأمه شيء", en: "Muwatta 1485", es: "Muwatta 1485", fr: "Muwatta 1485", ur: "موطا 1485", tr: "El-Muvatta 1485 — Malik: Aynı anne ve babadan iki erkek kardeş ölür. Birinin çocuğu vardır, diğerinin çocuğu yoktur. Çocuğu olmayan kardeşin mirası, aynı babadan olan erkek kardeşine kalır ve erkek kardeşinin hem anne hem de babadan olan çocukları hiçbir şey almaz.", id: "Al-Muwatta 1485 — Malik: Dua bersaudara, keduanya dari ayah dan ibu yang sama, meninggal dunia. Yang satu mempunyai anak, dan yang lain tidak mempunyai anak. Warisan dari yang tidak mempunyai anak diberikan kepada saudaranya dari ayah yang sama, dan anak-anak saudaranya dari ayah dan ibu yang sama tidak mendapat apa pun." }
summary:
  ar: "يقول مالك ومن ذلك أيضا الأخوان للأب والأم يموتان، ولأحدهما ولد، والآخر لا ولد له، ولهما أخ لأبيهما، فلا يعلم أيهما مات قبل، فميراث الذي لا ولد له لأخيه لأبيه، وليس لبني أخيه لأبيه وأمه شيء. {cite:muwatta-maruf-1997 p.25}"
  tr: "Malik şöyle der: Benzer şekilde, aynı anne ve babadan iki erkek kardeş ölür; birinin çocuğu vardır, diğerinin çocuğu yoktur ve her ikisinin de baba tarafından birer erkek kardeşi vardır ve hangisinin önce öldüğü bilinmemektedir. Çocuğu olmayanın mirası, baba tarafından olan erkek kardeşine geçer ve erkek kardeşinin anne ve babadan olan çocukları hiçbir şey almaz. {cite:muwatta-maruf-1997 s.25}"
  id: "Malik berkata: Demikian pula, dua saudara laki-laki dari ayah dan ibu yang sama meninggal, salah satunya memiliki anak, dan yang lainnya tidak memiliki anak, dan keduanya memiliki saudara laki-laki dari pihak ayah mereka, dan tidak diketahui siapa di antara mereka yang meninggal lebih dulu. Warisan dari orang yang tidak memiliki anak diberikan kepada saudara laki-lakinya dari pihak ayah, dan anak-anak dari saudara laki-lakinya dari pihak ayah dan ibu tidak menerima apa pun. {cite:muwatta-maruf-1997 p.25}"
