text: "… أركاغانيس في كتابه في الأمراض: وصف للطحال الأدوية المحمرة وإدامة الإسهال والعلق على الطحال وخل العنصل يتحسى بعد أن يمسي ساعة ويصبح ويتحسا منه حسوات ويجعل منه بدقيق الكرسنة ضماد عليه ويسقى نصف درهم أشق بسكنجبين. قال ج: المحجمة إذا …"
summary:
