text: "… يكن لمسلم تركهُ فى وقته، ولو تَرَكه كان عليه قَضَاهُ. والآخَرُ ما تَقَرَّب إلى اللّه بالتَّنَفُّل فيه، وقد كان للمتنفَل تَركُه بلا قضاً له عليه. ووجدنا الواجب عليه منها يفارقُ التطوع فى السف. إذا كان المرء راكبا، فيُصلَى المكتوبةَ بالأرضِ، …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 436، يرد فيه ذكر الواجب، والنافلة والنوافل، والتطوع، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 436, whose wording mentions the obligatory (wajib), the supererogatory (nafila), the voluntary act (tatawwu'), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 436 کا اقتباس جس میں واجب، نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 436, dont le texte mentionne l'obligatoire (wajib), le surérogatoire (nafila), l'acte volontaire (tatawwu'), la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 436, cuyo texto menciona lo obligatorio (wajib), lo supererogatorio (nafila), el acto voluntario (tatawwu'), la oración prescrita; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 436. sayfasından bir alıntı, farz olan amelleri, nafile amelleri, gönüllü amelleri ve farz namazları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan amelleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 436, menyebutkan amalan wajib, amalan sunnah, amalan sukarela, dan salat yang diwajibkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
