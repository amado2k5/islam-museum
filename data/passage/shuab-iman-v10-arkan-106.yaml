text: "… الفقيه، أخبرنا أبوبكر القطان، حدثنا أحمد بن يوسف السلمي، حدثنا محمد بن يوسف، حدثنا سفيان، عن كثير بن زيد، عن المطلب بن عبدالله بن حنطب قال قال رسول اللّٰه وَل في: المؤمن أخو المؤمن من حيث يغيب يحفظه من ورائه، …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 106، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 106, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 106 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Shu'ab al-Iman de al-Bayhaqi, vol. 10, pág. 106, que menciona la semejanza del creyente; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 10, page 106, évoquant la ressemblance du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 106. sayfasından, mümin kıssasını anlatan bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın temelleri, imanın temelleri, iman dalları ve müminin özelliklerine ilişkin girişleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 106, yang menyebutkan perumpamaan tentang orang beriman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup entri tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
