text: "… الفقيه، أخبرنا أبوبكر القطان، حدثنا أحمد بن يوسف السلمي، حدثنا محمد بن يوسف، حدثنا سفيان، عن كثير بن زيد، عن المطلب بن عبدالله بن حنطب قال قال رسول اللّٰه وَل في: المؤمن أخو المؤمن من حيث يغيب يحفظه من ورائه، …"
