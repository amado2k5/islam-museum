label: { ar: "سنن ابن ماجه 3929 — ما حُرّم", en: "Sunan Ibn Majah 3929 — what was made unlawful", ur: "سنن ابن ماجہ 3929 — جو حرام کیا گیا", es: "Sunan Ibn Majah 3929: lo que se declaró ilegal", fr: "Sunan Ibn Majah 3929 — ce qui a été rendu illégal", tr: "Sünen İbni Mace 3929 — Yasak olan nedir", id: "Sunan Ibnu Majah 3929 — Apa yang dilarang" }
text: "… إِذْ أَتَاهُ رَجُلٌ فَسَارَّهُ فَقَالَ النَّبِيُّ ـ \" اذْهَبُوا بِهِ فَاقْتُلُوهُ \". فَلَمَّا وَلَّى الرَّجُلُ دَعَاهُ رَسُولُ اللَّهِ ـ فَقَالَ \" هَلْ تَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ \". قَالَ نَعَمْ قَالَ \" اذْهَبُوا فَخَلُّوا سَبِيلَهُ فَإِنَّمَا أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَقُولُوا لاَ إِلَهَ إِلاَّ اللَّهُ فَإِذَا فَعَلُوا ذَلِكَ حَرُمَ عَلَىَّ دِمَاؤُهُمْ وَأَمْوَالُهُمْ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3929، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 3929 (Tribulations), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3929، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3929 (Tribulaciones), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 3929 (Tribulations), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde 3929 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" kitabının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 3929, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
