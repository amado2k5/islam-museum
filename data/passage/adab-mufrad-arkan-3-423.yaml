  fr: "Extrait du traité al-Adab al-Mufrad d'al-Bukhari (tome 3, p. 423) évoquant les devoirs d'un croyant envers un autre; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur « Piliers et Branches de la Foi »."
