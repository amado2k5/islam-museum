text: "… عندي ؟ لأنَّه يعني أنَّه لو التقى مسلمان فلم يبدأ أحدهما أخاه بالسلام، وأنّما بالكلام - أنَّه لا إثم عليهما ! وفي ذلك ما لا يخفى من مخالفة الأحاديث الكثيرة التي تأمر بالسلام وإفشائه، وبأنَّه من حق المسلم على المسلم …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 3، ص 423، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
