text: "… نبيَّ بعدي، أوتيتُ فواتِحَ الكَلِم وخواتمه وجوامعه، وعلمت كم خزنةُ النَّار، وحملةُ العرش، وتَجَوَّزَ لي ربِّي وعُوفيتُ وعُفِيَتْ أمَّتي، فاسمعوا وأطيعوا ما دمتُ فيكم، فإذا ذُهِبَ بي، فعليكم بكتاب اللّه، أحلوا حلاله، وحرِّموا حرامه. فلعلّ الخطبة التي أشار إليها العرباضُ …"
