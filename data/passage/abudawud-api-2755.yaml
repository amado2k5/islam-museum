label: { ar: "سنن أبي داود 2755 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 2755 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 2755 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 2755 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 2755 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "حَدَّثَنَا الْوَلِيدُ بْنُ عُتْبَةَ، حَدَّثَنَا الْوَلِيدُ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ الْعَلاَءِ، أَنَّهُ سَمِعَ أَبَا سَلاَّمٍ الأَسْوَدَ، قَالَ سَمِعْتُ عَمْرَو بْنَ عَبَسَةَ، قَالَ صَلَّى بِنَا رَسُولُ اللَّهِ إِلَى بَعِيرٍ مِنَ الْمَغْنَمِ فَلَمَّا سَلَّمَ أَخَذَ وَبَرَةً مِنْ جَنْبِ الْبَعِيرِ ثُمَّ قَالَ \" وَلاَ يَحِلُّ لِي مِنْ غَنَائِمِكُمْ مِثْلُ هَذَا إِلاَّ الْخُمُسَ وَالْخُمُسُ مَرْدُودٌ فِيكُمْ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2755، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2755 (Jihad (Kitab Al-Jihad)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2755، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2755 (Yihad (Kitab Al-Jihad)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2755 (Jihad), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
