label: { ar: "الموطأ 1707 — مالك: السنة عندنا أن الرجل إذا طلق امرأته وله عليها رجعة، فاعتدت بعض عدتها، ثم ارتجعها ثم فارقها قبل أن يمسها، فإنها تستأنف عدة مستقبلة من يوم طلقها", en: "Muwatta 1707", es: "Muwatta 1707", fr: "Muwatta 1707", ur: "موطا 1707", tr: "El-Muvatta 1707 — Malik: Bizde sünnet şudur ki, bir erkek karısını boşadıktan sonra onu geri alma hakkına sahipse ve kadın bekleme süresinin bir kısmını tamamladıktan sonra onu geri alır ve cinsel ilişkiye girmeden önce tekrar boşadığında, kadın boşandığı günden itibaren yeni bir bekleme süresine başlar.", id: "Al-Muwatta 1707 — Malik: Sunnah di kalangan kami adalah jika seorang pria menceraikan istrinya dan berhak untuk mengambilnya kembali, dan istrinya telah menyelesaikan sebagian masa iddahnya, kemudian pria itu mengambilnya kembali dan kemudian menceraikannya lagi sebelum berhubungan intim dengannya, maka istrinya memulai masa iddah baru sejak hari pria itu menceraikannya." }
summary:
  ar: "يقول مالك السنة عندنا أن الرجل إذا طلق امرأته وله عليها رجعة، فاعتدت بعض عدتها، ثم ارتجعها، ثم فارقها قبل أن يمسها، فإنها لا تبني على ما مضى من عدتها، وإنها تستأنف عدة مستقبلة من يوم طلقها. وقد ظلم زوجها نفسه وأخطأ، إن كان ارتجعها ولا حاجة له بها. {cite:muwatta-maruf-1997 p.97}"
  tr: "Bizim görüşümüze göre Malik el-Sünne, bir erkek karısını boşadıktan sonra onu geri alma hakkına sahipse ve kadın bekleme süresinin bir kısmını tamamladıktan sonra erkek onu geri alırsa ve daha sonra onunla cinsel ilişkiye girmeden önce tekrar boşarsa, kadın önceki bekleme süresinden devam etmez, boşandığı günden itibaren yeni bir bekleme süresine başlar. Kocası, ona ihtiyacı olmadığı halde onu geri alırsa, kendisine haksızlık etmiş ve hata etmiş olur. {cite:muwatta-maruf-1997 s.97}"
  id: "Menurut mazhab kami, Malik al-Sunnah menyatakan bahwa jika seorang pria menceraikan istrinya dan berhak untuk mengambilnya kembali, dan istrinya telah menyelesaikan sebagian masa iddahnya, kemudian pria itu mengambilnya kembali, dan kemudian menceraikannya lagi sebelum berhubungan intim dengannya, maka istrinya tidak melanjutkan masa iddah sebelumnya, tetapi memulai masa iddah baru sejak hari suaminya menceraikannya. Suaminya telah berbuat zalim dan keliru jika ia mengambilnya kembali padahal ia tidak membutuhkannya. {cite:muwatta-maruf-1997 p.97}"
