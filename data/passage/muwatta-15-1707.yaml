summary:
  ar: "يقول مالك السنة عندنا أن الرجل إذا طلق امرأته وله عليها رجعة، فاعتدت بعض عدتها، ثم ارتجعها، ثم فارقها قبل أن يمسها، فإنها لا تبني على ما مضى من عدتها، وإنها تستأنف عدة مستقبلة من يوم طلقها. وقد ظلم زوجها نفسه وأخطأ، إن كان ارتجعها ولا حاجة له بها. {cite:muwatta-maruf-1997 p.97}"
