label: { ar: "صحيح مسلم 6568 — محو السيئات وحط الخطايا", en: "Sahih Muslim 6568 — bad deeds erased and sins shed", ur: "صحیح مسلم 6568 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sahih Muslim 6568 — malas acciones borradas y pecados perdonados", fr: "Sahih Muslim 6568 — Les mauvaises actions sont effacées et les péchés pardonnés", tr: "Sahih Muslim 6568 — Günahları silmek ve ihlalleri ortadan kaldırmak", id: "Sahih Muslim 6568 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "… بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو كُرَيْبٍ قَالاَ حَدَّثَنَا أَبُو أُسَامَةَ، عَنِ الْوَلِيدِ بْنِ، كَثِيرٍ عَنْ مُحَمَّدِ بْنِ عَمْرِو بْنِ عَطَاءٍ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي سَعِيدٍ، وَأَبِي، هُرَيْرَةَ أَنَّهُمَا سَمِعَا رَسُولَ اللَّهِ يَقُولُ \" مَا يُصِيبُ الْمُؤْمِنَ مِنْ وَصَبٍ وَلاَ نَصَبٍ وَلاَ سَقَمٍ وَلاَ حَزَنٍ حَتَّى الْهَمِّ يُهَمُّهُ إِلاَّ كُفِّرَ بِهِ مِنْ سَيِّئَاتِهِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6568، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 6568 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 6568، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato del Sahih Muslim, n.º 6568 (El Libro de la Virtud, que ordena las buenas costumbres y fortalece los lazos de parentesco), habla de las malas acciones borradas y los pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 6568 (Le Livre de la Vertu, qui exhorte à la bonne conduite et renforce les liens de parenté), évoque l'effacement des mauvaises actions et le pardon des péchés. Le Hasanat and Sayyi'at Ledger le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "Sahih Müslim'de 6568 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin bir listesini ve amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6568, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini memuat daftar amal baik dan buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
