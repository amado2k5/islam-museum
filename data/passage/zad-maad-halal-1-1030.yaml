text: "… قوله: لا، هو حرام بيع الميتة، فكانهم طلبوا منه أن يرخَص لهم في بيعِ الشحوم لهذه المنافع التي ذكروها، فلم يفعل. ونهاية الأمر أن الحديث يحتمل الأمرين، فلا يحرم ما لم يعلمْ أنَّ اللَّه ورسوله حَرَّمه. قالوا : وقد ثبت …"
