label: { ar: "الموطأ 294 — أبو هريرة: الصلاة بظهر الحرة خير من تخطي الرقاب", en: "Muwatta 294", es: "Muwatta 294", fr: "Muwatta 294", ur: "موطا 294", tr: "El-Muvatta 294 — Ebu Hurayra: Lav tarlasının üzerinde namaz kılmak, insanların boyunlarının üzerinden geçmekten daha hayırlıdır.", id: "Al-Muwatta 294 — Abu Hurairah: Shalat di atas hamparan lava lebih baik daripada melangkahi leher orang." }
text: "لأن يصلي أحدكم بظهر الحرة خير له من أن يقعد حتى إذا قام الإمام يخطب جاء يتخطى رقاب الناس يوم الجمعة"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر بن حزم عمن حدثه عن أبي هريرة أنه كان يقول، في باب الهيئة وتخطي الرقاب واستقبال الإمام يوم الجمعة: لأن يصلي أحدكم بظهر الحرة خارج المدينة خير له من أن يقعد حتى إذا قام الإمام يخطب جاء يتخطى رقاب الناس يوم الجمعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.167}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Hazm'dan, o da Ebu Hurayra'dan rivayetle naklettiğine göre, cuma günü insanların boyunlarına basmak ve imama doğru dönmek gibi edep kuralları hakkında şöyle derdi: \"Sizden birinin Medine'nin dış mahallelerinde namaz kılması, imam hutbe okumak için ayağa kalkana kadar oturup sonra cuma günü insanların boyunlarına basmaktan daha iyidir.\" Araştırmacı, Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr'ın da Malik'ten rivayet ettiğini, el-Beyhaki'nin de bunu kaydettiğini belirtiyor. {cite:muwatta-maruf-1997 s.167}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Abi Bakr ibn Hazm, yang juga meriwayatkannya dari seseorang yang menceritakannya dari Abu Hurayrah, yang biasa berkata mengenai adab yang benar, melangkahi leher orang banyak, dan menghadap imam pada hari Jumat: \"Bagi kalian shalat di pinggiran Madinah lebih baik daripada duduk menunggu imam berdiri untuk menyampaikan khutbah, kemudian melangkahi leher orang banyak pada hari Jumat.\" Peneliti menyebutkan bahwa Abu Mus'ab, Suwayd, dan Yahya ibn Bukayr meriwayatkan hadits ini dari Malik, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.167}"
