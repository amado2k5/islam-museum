label: { ar: "الموطأ 294 — أبو هريرة: الصلاة بظهر الحرة خير من تخطي الرقاب", en: "Muwatta 294" }
text: "لأن يصلي أحدكم بظهر الحرة خير له من أن يقعد حتى إذا قام الإمام يخطب جاء يتخطى رقاب الناس يوم الجمعة"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر بن حزم عمن حدثه عن أبي هريرة أنه كان يقول، في باب الهيئة وتخطي الرقاب واستقبال الإمام يوم الجمعة: لأن يصلي أحدكم بظهر الحرة خارج المدينة خير له من أن يقعد حتى إذا قام الإمام يخطب جاء يتخطى رقاب الناس يوم الجمعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.167}"
