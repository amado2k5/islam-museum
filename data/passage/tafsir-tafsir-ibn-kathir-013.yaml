text: "إلى رسول الله ولي، فجلس، فبعث عليهم مكانه عبد الله بن جحش، وكتب له كتابا، وأمره ألا يقرأ الكتاب حتى يبلغ مكان كذا وكذا، وقال: ((لا تكرهن أحدا على السير معك من أصحابك». فلما قرأ الكتاب استرجع، وقال: سمعا وطاعة"
