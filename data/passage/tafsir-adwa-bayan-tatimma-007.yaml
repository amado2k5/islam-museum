text: "ق بالله كاذب عليه كذبا شنيعا . وقال الشيخ أبو الحسن الأشعري في كتاب الإبانة أيضا في إثبات الاستواء لله تعالى، ما نصه : إن قال قائل : ما تقولون في الاستواء؟ قيل له: نقول: إن الله عز وجل مستو"
