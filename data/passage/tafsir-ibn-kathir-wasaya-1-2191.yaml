text: "… أنَّها ناسخة للإرث بالحلف والإخاء اللَّذَيْن كانوا يتوارثون بهما أوَّلًا، وعلىٰ هذا فتشمل ذوي الأرحام بالاسم الخاص، ومن لم يورثهم يحتج بأدلَّةٍ من أقواها حديث: إِنَّ اللهَ قَذْ أَعْطَىٰ كُلَّ ذِي حَقِّ حَقَّهُ، فَلَا وَصِيَّةَ لِوَارِثِ، قالوا: فلو كان ذا …"
summary:
