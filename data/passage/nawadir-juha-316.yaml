text: "… حساب مضبوط كان ماراً أمام دكان بائع خضار، فطالبه بدَين، فقال الشيخ: لننظر في الدفتر ونعلم مِقدار الدَين لنتخلَّص من الطلب. فأخذ الخضري يقلِّب الدفتر، والشيخ ينظر إليه فرأى اسمه، وكانت بينه وبين الخضري معاملة بمئات من القروش، لم يبق …"
summary:
  ar: "طلب بقال ديناً من جحا، فراجع جحا الدفتر ورأى أن عليه ديناً قدره واحد وثلاثون قرشاً وعلى الإمام ستة وعشرون، فقال أن يُلغى دين الإمام ويدفع هو خمسة فتتم تسوية الحسابين، فوافق البقال وبقي حائراً. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  en: "A greengrocer asks for a debt; Juha checks the ledger, sees his own debt of 31 piastres and the imam's 26; he says to cancel the imam's 26 and pay five, settling both accounts; the greengrocer agrees and is left puzzled. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  ur: "ایک سبزی فروش نے جحا سے قرض مانگا، جحا نے کھاتا دیکھا تو اس پر اکتیس قروش کا قرض تھا اور امام پر چھبیس کا، اس نے کہا کہ امام کے چھبیس ختم کر دو اور میں پانچ دیتا ہوں، یوں دونوں حساب برابر ہو جائیں گے، سبزی فروش مان گیا اور حیران رہ گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  fr: "Un marchand de légumes réclame une dette ; Juha consulte le registre, y voit sa propre dette de 31 piastres et celle de l'imam de 26 ; il dit d'annuler les 26 de l'imam et qu'il paiera cinq, ce qui règle les deux comptes ; le marchand accepte et reste perplexe. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  es: "Un verdulero reclama una deuda; Juha revisa el libro de cuentas y ve su propia deuda de 31 piastras y la del imán de 26; dice que se anulen las 26 del imán y que él pagará cinco, con lo que quedan saldadas ambas cuentas; el verdulero acepta y se queda desconcertado. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  tr: "Bir bakkal, Juha'dan borç istedi. Juha defterini kontrol etti ve kendisinin otuz bir kuruş, imamın ise yirmi altı kuruş borcu olduğunu gördü. İmamın borcunun silinmesini ve hesapları kapatmak için beş kuruş ödemesini önerdi. Bakkal kabul etti, ancak kafası karışık kaldı. {cite:juha-nawadir-kubra-djuwaydi s. 155}"
  id: "Seorang pedagang meminta pinjaman kepada Juha. Juha memeriksa buku besarnya dan melihat bahwa ia berutang tiga puluh satu piaster dan imam berutang dua puluh enam. Ia menyarankan agar utang imam dibatalkan dan ia membayar lima piaster untuk menyelesaikan perhitungan. Pedagang itu setuju, tetapi tetap bingung. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
