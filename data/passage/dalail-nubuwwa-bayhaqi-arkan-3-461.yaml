text: "… رَضي أن يُطاع فيما سوى ذلك مِمَّا تحاورُونَ مِن أعمالكم فاحذروا أيها الناس إني قد تركتُ فيكم ما أن اعتصمتم به فلن تضلُّوا أبداً : كتاب اللّه، وسنَّةَ نبيه، إنَّ كل مسلم أخُوْ المسلم، المسلمون أخوةً، ولا يحل لا مرء …"
