text: "سمعت رسول الله قرأ بالطور في المغرب"
summary:
  ar: "أول حديث في باب القراءة في المغرب والعشاء. يرويه يحيى عن مالك عن ابن شهاب عن محمد بن جبير بن مطعم عن أبيه جبير بن مطعم أنه سمع النبي يقرأ بسورة الطور في صلاة المغرب. ويخرّجه المحقق عند البخاري (765) ومسلم (2/41) وأبي داود (811) والنسائي (2/169) وابن خزيمة وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (9/145). {cite:muwatta-maruf-1997 p.128}"
