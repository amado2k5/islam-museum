label: { ar: "الموطأ 207 — جبير بن مطعم: سمعته يقرأ بالطور في المغرب", en: "Muwatta 207", es: "Muwatta 207", fr: "Muwatta 207", ur: "موطا 207", tr: "El-Muvatta 207 — Cübeyr ibn Mut'im: Onu akşam namazında Tur Suresi okurken işittim.", id: "Al-Muwatta 207 — Jubayr ibn Mut'im: Aku mendengarnya membaca Surah At-Tur dalam salat Maghrib." }
text: "سمعت رسول الله قرأ بالطور في المغرب"
summary:
  ar: "أول حديث في باب القراءة في المغرب والعشاء. يرويه يحيى عن مالك عن ابن شهاب عن محمد بن جبير بن مطعم عن أبيه جبير بن مطعم أنه سمع النبي يقرأ بسورة الطور في صلاة المغرب. ويخرّجه المحقق عند البخاري (765) ومسلم (2/41) وأبي داود (811) والنسائي (2/169) وابن خزيمة وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (9/145). {cite:muwatta-maruf-1997 p.128}"
  tr: "Akşam ve yatsı namazlarında Kur'an okuma bölümündeki ilk hadis. Yahya, Malik'ten, o da İbn Şihab'dan, o da Muhammed ibn Cübeyr ibn Mut'im'den, o da babası Cübeyr ibn Mut'im'den rivayet ederek, Peygamberimizin akşam namazında Tur Suresi'ni okuduğunu işittiğini nakletmiştir. Araştırmacı, bu hadisi Buhari (765), Müslim (2/41), Ebu Davud (811), Nesai (2/169), İbn Huzeyme ve Ahmed'in hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil etmiş ve Temhid'e (9/145) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.128}"
  id: "Hadits pertama dalam bab tentang bacaan dalam shalat Maghrib dan Isya. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Muhammad ibn Jubayr ibn Mut'im, dari ayahnya, Jubayr ibn Mut'im, bahwa ia mendengar Nabi membaca Surah At-Tur dalam shalat Maghrib. Peneliti memasukkannya dalam kumpulan hadits Al-Bukhari (765), Muslim (2/41), Abu Dawud (811), An-Nasa'i (2/169), Ibn Khuzaymah, dan Ahmad, melalui sanad para sahabat Malik, dan merujuk pada At-Tamhid (9/145). {cite:muwatta-maruf-1997 p.128}"
