text: |-
  ٢٠٨
  •ذال)•
  ⁦( طحل)⁩ الطحلة لون بين الغبرة والبياض ورماد أطحل وشراب أطمل اذالم يكن صافيا
  ويقال فرس أخضر أطحل للذى يعاو خضرته قليل صفرة وأطهل جبل بمكة يضاف اليه ثور
  ابن عبدمناة بن أدّبن طابخة يقال نور أطمل لانه نزله والطحال معدروف يقال ات الفرس
  لا طحال له وهو مثل لسرعته وجريه كما يقال البعير لا مرارة له أى لاخسارة له وطحلته أى
  أصبت طحاله فهو مطعول وطحل بالكسر طحلا اشتكى طحاله وطول الماءاذافد وتغيرت
  رائحته وطهل بالها مثله ربل الطريال القطعة العاليسة من الجدار والصخرة
  العظيمة المشرفة من الجبل وطرابسل الشأم صوامعها ويقال طربل بوله اذامده الى فوق
  ⁦( طرجهل)⁩ الطرجهالة كالفجانة معروفة ور بما قالواطرجهارة بالراء قال الاعشى
  ولقد شربت الحر أستق فى اناء الطرجهاده
  سل) ماء طيسل وأعم طيسل أى كثير والطيسل الغبار والطسل اضطراب السراب
  ⁦( طفل)⁩ الطفل المولود وولد كل وحشية أيضاطفسل والجمع أطفال وقد يكون الطفسل
  واحداوجعاصئل الجنب قال تعالى أو الطفل الذين لم يظهر وايقال منه أطفلت المرأة
  والمطفل الظبية معها طفلها وهى قريبة عهد بالنتاج وكذلك الفاقة والجمع مطافل
  ومطافيل قال أبوذؤيب
  وان حديثا منك لوتسذلينه • جى النحل فى ألبان عوذ مطافل
  مطافيل أبكارحديث نتاجها • تشاب بماء مثل ماء المفاصل
  والطفل بالفتح الناعم يقال جارية طفلة أى ناعمة وبنان طفسل وانماجاز أن يوصف البنان
  وهو جمع بالطضل وهو واخدلان كل بجع ليس بينه وبين واحده الاالهاءفانه يوحدويذ كر
  فلهذا قالى حيد
  فلما كشفن الليس عنه مسحنه • بالطراف طفل زان غيلا موشما
  أراد باطراف بنان طفل فيعله بدلاعنه وتطفيل الشمس ميلها لنغروب وقد طفل القيل اذال
  أقبل ظلامه والطة ز بالتحريك بعد العصراذاطفلت الشعس للغروب يقال أتيته طفلى
  والطفل أيضامطر وقال • لوهد جاده طفل النريا * وطفلت الابل تطفيلا وذلك اذا
  كان معها أولادها فرفقت به افى السيرحتى تلحقها الاطفال وطفسل بفتح الطاءاسم
  جبل قال الشاعر
  وهل أردن يومامياه مجنة • وهل يدون لى شامة وطفيل
  وقولهم طفيلى" للذى يدخل وليمة لم يدع اليها وقد تطفل قال يعسقوب هو ~نسوب الى طفيل
  رجل من أهل الكوفة من بى عبد اللّٰه بن غطفان وكان يأتى الولائم من غير أن يدعى اليها فكان
  يقال له طفيل الاعراس وطفيل العرائس وكان يقول وددت أن الكوفة بركة مصهرجة
  فلا يخفى علىّ منهاشى والعرب تسمى الطفيلى"الوارش لل لطل "أضعف المطر والجمع
  الطلال تقول منه طلت الارض وطلها الندى فهى مطلولة وطلة الرجل امر أنه قال عمرو
  ابن حسان بن هانى ين مسعودين قيس بن خالد
  أفى نابين نالهها اساف • تأوهطلق ماان تنام
  والغاب
