label: { ar: "موطأ مالك 952 — الأب والأبوة", en: "Muwatta Malik 952 — the father and fatherhood", ur: "موطأ مالک 952 — باپ اور والدیت", es: "Muwatta Malik 952 — el padre y la paternidad", fr: "Muwatta Malik 952 — le père et la paternité" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ مُحَمَّدِ بْنِ عَمْرِو بْنِ حَلْحَلَةَ الدِّيلِيِّ، عَنْ مُحَمَّدِ بْنِ عِمْرَانَ الأَنْصَارِيِّ، عَنْ أَبِيهِ، أَنَّهُ قَالَ عَدَلَ إِلَىَّ عَبْدُ اللَّهِ بْنُ عُمَرَ وَأَنَا نَازِلٌ، تَحْتَ سَرْحَةٍ بِطَرِيقِ مَكَّةَ فَقَالَ مَا أَنْزَلَكَ تَحْتَ هَذِهِ السَّرْحَةِ فَقُلْتُ أَرَدْتُ ظِلَّهَا. فَقَالَ هَلْ غَيْرُ ذَلِكَ فَقُلْتُ لاَ مَا أَنْزَلَنِي إِلاَّ ذَلِكَ. فَقَالَ عَبْدُ اللَّهِ بْنُ عُمَرَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 952، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 952 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 952، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 952 (Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 952 (Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
