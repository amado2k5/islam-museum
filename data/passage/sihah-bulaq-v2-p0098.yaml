text: |-
  ٤٨٩
  كثير لا يزجو وضحان -تى زجاأى انقطع ضحكه ⁦(زدا)⁩ زدا الصبىّ الجوز وبالجوز
  يزدوزدوا أى لعب ورى به فى الحفيرة وتلك الخفيرة مى المزداة يقال أبعد المدى وازده
  قال أبو عبيد الزدولغة فى السدو وهومد اليدنحوالشئ كماتسد والابل فى سيرها بأيديها
  ( رى زريت عليه بالفتح زراية وتززّيت عليه اذاعتبت عليه وقال
  يا أيها الزارى على عمر•قد قلت فيه غير ما تعلم
  وقال آخو
  وانى على ليلى زاروانى * على ذاكفيما يننا مستديها
  أى عاتب ساخط غير راض وقال أبوع ر والزارى على الانسان الذى لا يعده شأ وينكر عليه
  فعل والازراء التهاون بالشئ يقال أزديت به اذاقصرت به وازدريته أى حقرته ف
  الزفيان شدّة هبوب الرمح يقال زفته الريح زفياتا أى طردته قاله ابن السراج وفاقة زفيانf
  سريعة وقوس زفيان مريعة الارسال للسهم وزفيان اسم شاعرأ ولقبه وزفى الظليم زفيا
  اذا تشرجناحيه وعدا أبو عمروز فى السراب الشى يزفيه اذا رفعه مثل زهامزقا الزقو
  والزقى مصدر وقدزقا الصدى يزة وويرقى زقاء أى صاح وكل صائح زاق والزقية الصيحة
  وقوله-م هو أثقل من الزواقى هى الديول لانهم كانو ايسمرون فاذا صاحت الديكه تفرّقوا
  ⁦( زكا)⁩. ذكاة المال معروفة وذكى ماله تزكية أى أدى عنه زكانه وذكى نفسه تزكية
  مدحها وقوله تعالى وتز كيهم بها قالواتطهرهم جماوزكاه أيضااذا أخذز كاته وتزكى أى
  تصدّق وز كا الشفع يقال خسا أوز كاوزكا الزرع يزكوزكاء مدود أى نمى وأزكاه اللّٰه وهذا
  الامر لا يزكو يتملان أى لا يليق به وغلام ذكى أى زا وقدز كايز كوز كوا وزكاه عن
  الاخفس الاموى زكاالرجل يزكوذكوا اذاتنهم وكان فى خصب ⁦(زنى)⁩ الزنايد
  ويقصر فالقصر لاهل الحجاز قال تعالى ولا تقربوا الزنى والمدّلاهل نجد قال الفرزدق
  اباحلضر من يزن يعرف زناؤه • ومن يشرب الخرطوم يصبح مسكرا
  وقد زتى يرتى والنسبة الى المقصور زنوىّ والى الممدودزنلئت وزناه تزنية أى قال له بازانى
  وتسمى الردة زناءة وقولهم هو لزنية وزنية نقيض قولك هولرشدة ورشدة والمرأة تزانى مزاناة
  وزناء أى تساغى وا لزاوية واحدة الزوايا وزويت الشئ بمعته وقبضته وفى الحديث
  زويت لى الارض فأريت مشارة ها ومغار بها وانزوت الجلدة فى الشارأى اجتمعت وتقبضت
  والزى اللباس والهيئة وأصله ذوى تقول منه زييته والقياس زويتة وزوى الرجل مابين
  عينيه وقال الاعنى يزيديغض الطرف دونى كانما * زوى بين عينيه علىّ الماجم
  فلا ينبسط من بين عينيك ما انزوى • ولا تلى الاوأنّفك راغم
  وتقول زوى فلان المال عن وارثه زيا وزوّاسم جبل بالعراق قال الاصعى زوالمنيسة
  ما يحدث من هلالك المنية ويقال الزق القدر يقال قضى علينا وق دروحم وزىّ قال
  الناعر
  من ابن مامة كعب ثم عى به • زوالمنية الاحرّة وقدا
  الاصمعى بقال قد رزوزية وزوازية مثل علبطة وعلابطة للعظيمة التى تضم أعضاء الجزور
  والزاى حرف يمدّ ويقصر ولا يكتب الابياه بعد الالف تقول هى زاى فزيها قال زيد بن ثابت
  فى قوله تعالى كيف نتشزها هى زاى فزبها أى اقرأه بالزاى أبو عبيد الزوزاة مصدرة ولك
  P٢٣
