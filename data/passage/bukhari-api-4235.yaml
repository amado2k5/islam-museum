label: { ar: "صحيح البخاري 4235 — الأب والأبوة", en: "Sahih al-Bukhari 4235 — the father and fatherhood", ur: "صحیح بخاری 4235 — باپ اور والدیت", es: "Sahih al-Bukhari 4235 — El padre y la paternidad", fr: "Sahih al-Bukhari 4235 — Le père et la paternité", tr: "Sahih el-Buhari 4235 — Baba ve Babalık", id: "Sahih al-Bukhari 4235 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا سَعِيدُ بْنُ أَبِي مَرْيَمَ، أَخْبَرَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ أَخْبَرَنِي زَيْدٌ، عَنْ أَبِيهِ، أَنَّهُ سَمِعَ عُمَرَ بْنَ الْخَطَّابِ ـ يَقُولُ أَمَا وَالَّذِي نَفْسِي بِيَدِهِ، لَوْلاَ أَنْ أَتْرُكَ آخِرَ النَّاسِ بَبَّانًا لَيْسَ لَهُمْ شَىْءٌ، مَا فُتِحَتْ عَلَىَّ قَرْيَةٌ إِلاَّ قَسَمْتُهَا كَمَا قَسَمَ النَّبِيُّ خَيْبَرَ، وَلَكِنِّي أَتْرُكُهَا خِزَانَةً لَهُمْ يَقْتَسِمُونَهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 4235، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4235 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4235، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4235 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4235 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 4235 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4235, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
