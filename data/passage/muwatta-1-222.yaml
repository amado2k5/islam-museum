label: { ar: "الموطأ 222 — أبي بن كعب وسورة لم ينزل مثلها: الفاتحة السبع المثاني", en: "Muwatta 222" }
text: "هي هذه السورة، وهي السبع المثاني والقرآن العظيم الذي أعطيت"
summary:
  ar: "أول حديث في باب ما جاء في أم القرآن. يرويه يحيى عن مالك عن العلاء بن عبد الرحمن بن يعقوب أن أبا سعيد مولى عامر بن كريز أخبره مرسلاً: نادى النبي أبي بن كعب وهو يصلي، فلما فرغ لحقه فوضع يده على يده وهو يريد الخروج من باب المسجد وقال إنه يرجو ألا يخرج من المسجد حتى يعلم سورة ما أنزل الله في التوراة ولا الإنجيل ولا الفرقان مثلها، فجعل أبي يبطئ في المشي رجاء ذلك ثم ذكّره بالسورة التي وعده، فسأله كيف يقرأ إذا افتتح الصلاة، فقرأ عليه فاتحة الكتاب إلى آخرها، فقال النبي: هي هذه السورة، وهي السبع المثاني والقرآن العظيم الذي أُعطيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وزيد بن الحباب عند الطبري وسويد والقعنبي، وينقل عن ابن عبد البر أن الرواة عن مالك لم يختلفوا في إسناده، وأن جماعة خالفوه عن العلاء فرووه عن أبيه عن أبي هريرة مسنداً، وأن عبد الحميد بن جعفر رواه عن العلاء عن أبيه عن أبي هريرة عن أبي بن كعب وهو الأشبه عنده (التمهيد 20/218)؛ ويرى المحقق أن تفضيل ابن عبد البر لرواية عبد الحميد فيه نظر لتفرده وموافقة الجماعة على رواية أبي هريرة وتصحيح الترمذي لها، ويذكر أن الحديث مشهور من حديث أبي سعيد بن المعلى عند البخاري (4474، 4647، 4703). {cite:muwatta-maruf-1997 p.134} {cite:muwatta-maruf-1997 p.135}"
