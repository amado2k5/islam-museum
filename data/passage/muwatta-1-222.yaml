text: "هي هذه السورة، وهي السبع المثاني والقرآن العظيم الذي أعطيت"
summary:
  ar: "أول حديث في باب ما جاء في أم القرآن. يرويه يحيى عن مالك عن العلاء بن عبد الرحمن بن يعقوب أن أبا سعيد مولى عامر بن كريز أخبره مرسلاً: نادى النبي أبي بن كعب وهو يصلي، فلما فرغ لحقه فوضع يده على يده وهو يريد الخروج من باب المسجد وقال إنه يرجو ألا يخرج من المسجد حتى يعلم سورة ما أنزل الله في التوراة ولا الإنجيل ولا الفرقان مثلها، فجعل أبي يبطئ في المشي رجاء ذلك ثم ذكّره بالسورة التي وعده، فسأله كيف يقرأ إذا افتتح الصلاة، فقرأ عليه فاتحة الكتاب إلى آخرها، فقال النبي: هي هذه السورة، وهي السبع المثاني والقرآن العظيم الذي أُعطيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وزيد بن الحباب عند الطبري وسويد والقعنبي، وينقل عن ابن عبد البر أن الرواة عن مالك لم يختلفوا في إسناده، وأن جماعة خالفوه عن العلاء فرووه عن أبيه عن أبي هريرة مسنداً، وأن عبد الحميد بن جعفر رواه عن العلاء عن أبيه عن أبي هريرة عن أبي بن كعب وهو الأشبه عنده ⁦(التمهيد 20/218)⁩؛ ويرى المحقق أن تفضيل ابن عبد البر لرواية عبد الحميد فيه نظر لتفرده وموافقة الجماعة على رواية أبي هريرة وتصحيح الترمذي لها، ويذكر أن الحديث مشهور من حديث أبي سعيد بن المعلى عند البخاري ⁦(4474، 4647، 4703)⁩. {cite:muwatta-maruf-1997 p.134} {cite:muwatta-maruf-1997 p.135}"
  tr: "Kur'an'ın Annesi hakkında rivayet edilenler bölümündeki ilk hadis. Yahya, Malik'ten, o da Al-Ala' bin Abdülrahman bin Yakub'dan rivayet ettiğine göre, Emir bin Kurayz'ın azatlı kölesi Ebu Sa'id, mursal bir hadiste ona şöyle bildirmiştir: Peygamberimiz, Ubeyy bin Ka'b namaz kılarken ona seslendi. Namazı bitirdiğinde, mescidin kapısından çıkmak üzereyken ona yetişti ve elini eline koyarak, Allah'ın Tevrat'ta, İncil'de veya Kur'an'da vahyetmediği bir sureyi öğrenene kadar mescidi terk etmemesini umduğunu söyledi. Bunun üzerine Ubeyy, bu umutla adımlarını yavaşlattı. Sonra Peygamberimiz ona söz verdiği sureyi hatırlattı. Bunun üzerine Ubeyy'e namaza başlarken nasıl okuyacağını sordu. Peygamberimiz de ona Kitabın Başlangıcı'ndan sonuna kadar okudu. Peygamberimiz şöyle buyurmuştur: \"Bu sure, yedi defa tekrarlanan ayetlerden oluşan ve bana verilen büyük Kur'an'dır.\" Araştırmacı, bu surenin Malik'ten Ebu Mus'ab ve Zeyd ibn el-Hubab tarafından rivayet edildiğini, Taberi, Suveyd ve Kanabi tarafından da kaydedildiğini belirtmektedir. İbn Abdülberr'in, Malik'ten rivayet edenlerin isnad zincirinde ihtilaf etmediklerini, bir grubun ise el-Ala' konusunda ondan farklı bir görüşe sahip olduğunu, onu babasından, Ebu Hurayra'dan, tam bir isnad zinciriyle rivayet ettiklerini söylediğini aktarmaktadır. Ayrıca, Abdülhamid ibn Cafer'in de el-Ala'dan, babasından, Ebu Hurayra'dan, Ubeyy ibn Ka'b'dan rivayet ettiğini ve bunun en muhtemel rivayet olduğunu belirtmektedir (el-Temhid 20/218). Araştırmacı, İbn Abdülbarr'ın Abdülhamid rivayetini tercih etmesinin, tek rivayet olması, grubun Ebu Hurayra rivayeti üzerinde ittifak etmesi ve Tirmizi'nin bunu tasdik etmesi nedeniyle sorgulanabilir olduğunu düşünmektedir. Bu hadisin, Buhari'nin (4474, 4647, 4703) kaydettiği üzere Ebu Sa'id ibn el-Mu'alla'nın rivayetinden de bilindiğini belirtmektedir. {cite:muwatta-maruf-1997 s.134} {cite:muwatta-maruf-1997 s.135}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang telah diriwayatkan tentang Ibu Al-Qur'an. Diriwayatkan oleh Yahya dari Malik dari Al-Ala’ bin Abd Al-Rahman bin Ya’qub bahwa Abu Sa’id, budak yang dibebaskan oleh ‘Amir bin Kurayz, memberitahunya dalam sebuah hadits mursal: Nabi memanggil Ubayi bin Ka’b ketika ia sedang shalat. Setelah selesai, beliau menyusulnya dan meletakkan tangannya di atas tangannya ketika ia hendak keluar melalui pintu masjid dan berkata bahwa beliau berharap Ubayi tidak akan meninggalkan masjid sampai ia mengetahui sebuah surah yang belum pernah Allah turunkan dalam Taurat, Injil, atau Al-Qur'an. Maka Ubayi memperlambat langkahnya dengan harapan itu, lalu Nabi mengingatkannya tentang surah yang telah dijanjikannya. Maka Nabi bertanya kepadanya bagaimana cara membacanya ketika memulai shalat, lalu Nabi membacakan kepadanya Surah Pembukaan Kitab sampai akhir. Nabi Muhammad SAW bersabda: \"Inilah surah ini, dan inilah tujuh ayat yang sering diulang dan Al-Qur'an Agung yang telah diberikan kepadaku.\" Peneliti menyebutkan bahwa surah ini diriwayatkan dari Malik oleh Abu Mus'ab dan Zayd ibn al-Hubab, sebagaimana dicatat oleh al-Tabari, Suwayd, dan al-Qa'nabi. Ia mengutip Ibnu 'Abd al-Barr yang mengatakan bahwa para perawi dari Malik tidak berbeda dalam sanadnya, dan bahwa sekelompok orang berbeda pendapat dengannya mengenai surah al-'Ala', meriwayatkannya dari ayahnya, dari Abu Hurayrah, dengan sanad yang lengkap. Ia juga menyatakan bahwa 'Abd al-Hamid ibn Ja'far meriwayatkannya dari surah al-'Ala', dari ayahnya, dari Abu Hurayrah, dari Ubayy ibn Ka'b, yang menurutnya paling mungkin (al-Tamhid 20/218). Peneliti tersebut meyakini bahwa preferensi Ibnu 'Abd al-Barr terhadap riwayat 'Abd al-Hamid patut dipertanyakan karena riwayat tersebut merupakan satu-satunya riwayat, kesepakatan kelompok tersebut pada riwayat Abu Hurayrah, dan pengesahan riwayat tersebut oleh al-Tirmidhi. Ia menyebutkan bahwa hadits tersebut terkenal dari riwayat Abu Sa'id ibn al-Mu'alla, sebagaimana tercatat oleh al-Bukhari (4474, 4647, 4703). {cite:muwatta-maruf-1997 p.134} {cite:muwatta-maruf-1997 p.135}"
