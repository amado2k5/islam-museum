text: "… عَنْ رَسُولِ اللَّهِ قَالَ \" لاَ تَبِيعُوا الْقَيْنَاتِ وَلاَ تَشْتَرُوهُنَّ وَلاَ تُعَلِّمُوهُنَّ وَلاَ خَيْرَ فِي تِجَارَةٍ فِيهِنَّ وَثَمَنُهُنَّ حَرَامٌ فِي مِثْلِ هَذَا أُنْزِلَتْ هَذِهِ الآيَةُ : ( وَمِنَ النَّاسِ مَنْ يَشْتَرِي لَهْوَ الْحَدِيثِ لِيُضِلَّ عَنْ سَبِيلِ اللَّهِ ) إِلَى آخِرِ الآيَةِ \". قَالَ وَفِي الْبَابِ عَنْ عُمَرَ بْنِ الْخَطَّابِ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي أُمَامَةَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1282، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1282 (The Book on Business), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1282، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
