text: "… اتخذ منه ضمّاد مع الخلّ كان صالحاً لدهن أوساط العضل، ويضمّد للنقرس وأوجاع المفاصل، ويضمد وحده لالتواء العصب، وهو ضمّاد لشدخ الظفر والأذن ونحوه، ويضمّد به مع السويق. أعضاء الرأس : هو دواء للحزاز وقروح الرأس ويطلى على الشجاج' ج …"
summary:
