  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 392, qui mentionne la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 392'den bir bölüm; ağrı, hastalıkların isimleri, vücut organları, cerrahi, sünnet, atel ve ilaçlardan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 392, yang menyebutkan rasa sakit, nama-nama penyakit, organ tubuh, pembedahan, sunat, bidai, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
