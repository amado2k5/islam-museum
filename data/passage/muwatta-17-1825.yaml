label: { ar: "الموطأ 1825 — مالك عن عبد المجيد بن سهيل عن سعيد بن المسيب عن أبي سعيد الخدري وأبي هريرة: استعمل النبي رجلا على خيبر فجاءه بتمر جنيب، فأمره أن يبيع الجمع بالدراهم ثم يبتاع بها جنيبا", en: "Muwatta 1825", es: "Muwatta 1825", fr: "Muwatta 1825", ur: "موطا 1825", tr: "El-Muvatta 1825 — Malik, Abdülmecid ibn Suhayl'dan, o da Sa'id ibn el-Musayyab'dan, o da Ebu Sa'id el-Hudri ve Ebu Hurayra'dan rivayetle: Peygamber, Hayber'in başına bir adam atadı ve o adam ona bir miktar Cüneyb hurması getirdi. Bunun üzerine Peygamber, adama hurmaları dirhemle satmasını ve sonra o dirhemle Cüneyb hurması almasını emretti.", id: "Al-Muwatta 1825 — Malik, berdasarkan riwayat Abd al-Majid ibn Suhayl, berdasarkan riwayat Sa'id ibn al-Musayyab, berdasarkan riwayat Abu Sa'id al-Khudri dan Abu Hurayrah: Nabi menunjuk seorang pria untuk memimpin Khaybar, dan pria itu membawakan beberapa kurma Junayb kepadanya. Maka beliau memerintahkan pria itu untuk menjual kurma tersebut dengan dirham dan kemudian membeli kurma Junayb dengan uang hasil penjualan tersebut." }
summary:
  ar: "يروي مالك عن عبد الحميد، وصوابه عند المحقق عبد المجيد، بن سهيل عن سعيد بن المسيب عن أبي سعيد الخدري وأبي هريرة أن رسول الله استعمل رجلا على خيبر، فجاءه بتمر جنيب، فقال له: أكل تمر خيبر هكذا؟ قال: لا، والله يا رسول الله، إنا لنأخذ الصاع من هذا بالصاعين، والصاعين بالثلاثة. فقال رسول الله: لا تفعل، بع الجمع بالدراهم، ثم ابتع بالدراهم جنيبا. {cite:muwatta-maruf-1997 p.146} {cite:muwatta-maruf-1997 p.147}"
  tr: "Malik, Abdülhamid'den ve âlim Abdülmecid'den, Sa'id ibn el-Musayyab'dan, o da Ebu Sa'id el-Hudri ve Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü'nün Hayber hurmalarını denetlemek üzere bir adam görevlendirdiğini nakletmiştir. Adam ona kaliteli hurmalar getirmiş ve Peygamber ona, \"Hayber'in bütün hurmaları böyle midir?\" diye sormuştur. Adam, \"Hayır, Allah'a yemin ederim ki, ey Allah'ın Resulü, biz bunun bir sa'sını iki sa'ya, iki sa'sını da üç sa'ya alıyoruz.\" diye cevap vermiştir. Allah Resulü, \"Bunu yapmayın. Bu çeşit hurmaları dirhemle satın, sonra o dirhemle kaliteli hurmalar alın.\" demiştir. {cite:muwatta-maruf-1997 s.146} {cite:muwatta-maruf-1997 s.147}"
  id: "Malik meriwayatkan dari Abd al-Hamid, dan versi yang benar menurut ulama Abd al-Majid, dari Sa'id ibn al-Musayyab, dari Abu Sa'id al-Khudri dan Abu Hurayrah, bahwa Rasulullah SAW menunjuk seorang laki-laki untuk mengawasi kurma Khaybar. Laki-laki itu membawa beberapa kurma berkualitas tinggi, dan Nabi bertanya kepadanya, \"Apakah semua kurma Khaybar seperti ini?\" Ia menjawab, \"Tidak, demi Allah, wahai Rasulullah, kami mengambil satu sa' kurma ini dengan dua sa', dan dua sa' dengan tiga sa'.\" Rasulullah SAW bersabda, \"Jangan lakukan itu. Jual kurma jenis ini dengan dirham, lalu belilah kurma berkualitas tinggi dengan dirham tersebut.\" {cite:muwatta-maruf-1997 p.146} {cite:muwatta-maruf-1997 p.147}"
