label: { ar: "الموطأ 1825 — مالك عن عبد المجيد بن سهيل عن سعيد بن المسيب عن أبي سعيد الخدري وأبي هريرة: استعمل النبي رجلا على خيبر فجاءه بتمر جنيب، فأمره أن يبيع الجمع بالدراهم ثم يبتاع بها جنيبا", en: "Muwatta 1825" }
summary:
  ar: "يروي مالك عن عبد الحميد، وصوابه عند المحقق عبد المجيد، بن سهيل عن سعيد بن المسيب عن أبي سعيد الخدري وأبي هريرة أن رسول الله استعمل رجلا على خيبر، فجاءه بتمر جنيب، فقال له: أكل تمر خيبر هكذا؟ قال: لا، والله يا رسول الله، إنا لنأخذ الصاع من هذا بالصاعين، والصاعين بالثلاثة. فقال رسول الله: لا تفعل، بع الجمع بالدراهم، ثم ابتع بالدراهم جنيبا. {cite:muwatta-maruf-1997 p.146} {cite:muwatta-maruf-1997 p.147}"
