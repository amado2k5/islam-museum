summary:
  ar: "قول لمالك: الأمر المجتمع عليه عندنا في إجارة العبيد وخراجهم وكراء المساكن وكتابة المكاتب أنه لا تجب في شيء من ذلك الزكاة، قل أو كثر، حتى يحول عليه الحول من يوم يقبضه صاحبه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.338}"
