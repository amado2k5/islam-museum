label: { ar: "الموطأ 390 — عائشة: فرضت الصلاة ركعتين ركعتين فأقرت صلاة السفر وزيد في الحضر", en: "Muwatta 390", es: "Muwatta 390", fr: "Muwatta 390", ur: "موطا 390", tr: "Al-Muwatta 390 — Aişe: Namaz, bir seferde iki rekat olarak farz kılınmıştır ve yolculuk halindeyken kılınan namaz olduğu gibi bırakılmış, evdeyken ise sayısı artırılmıştır.", id: "Al-Muwatta 390 — Aisyah: Shalat dianjurkan dua rakaat sekaligus, dan shalat saat bepergian dibiarkan seperti biasa, tetapi ditambah lagi saat di rumah." }
text: "فرضت الصلاة ركعتين ركعتين في الحضر والسفر، فأقرت صلاة السفر وزيد في صلاة الحضر"
summary:
  ar: "يرويه مالك عن صالح بن كيسان عن عروة بن الزبير عن عائشة، في باب قصر الصلاة في السفر: فُرضت الصلاة ركعتين ركعتين في الحضر والسفر، فأُقرت صلاة السفر وزيد في صلاة الحضر. ويخرّجه المحقق عند البخاري (350) ومسلم (2/142) وأبي داود (1198) والنسائي (1/225) وابن حبان والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد (16/293). {cite:muwatta-maruf-1997 p.209} {cite:muwatta-maruf-1997 p.210}"
  tr: "Malik, Salih ibn Kaysan'dan, Urve ibn el-Zübeyr'den, o da Aişe'den rivayet ederek, yolculukta namazın kısaltılması bölümünde şöyle anlatmıştır: Namaz başlangıçta hem yerleşik halde hem de yolculukta iki rekat olarak farz kılınmıştır. Yolculuktaki namaz aynı kalırken, yerleşik haldeki namazın süresi artırılmıştır. Araştırmacı ayrıca bunu, Malik'in sahabelerinin rivayet zincirleri aracılığıyla Buhari (350), Müslim (2/142), Ebu Davud (1198), Nesai (1/225), İbn Hibban ve Tahavi'nin derlemelerine de dahil etmiş ve Temhid'e (16/293) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.209} {cite:muwatta-maruf-1997 s.210}"
  id: "Malik meriwayatkan hadits ini dari Salih ibn Kaysan, dari Urwah ibn al-Zubayr, dari Aisyah, dalam surah tentang mempersingkat salat saat bepergian: Salat pada awalnya diwajibkan dua rakaat, baik saat menetap maupun saat bepergian. Salat saat bepergian tetap demikian, sedangkan salat saat menetap diperpanjang. Peneliti juga memasukkannya dalam kumpulan hadits al-Bukhari (350), Muslim (2/142), Abu Dawud (1198), al-Nasa'i (1/225), Ibn Hibban, dan al-Tahawi, melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (16/293). {cite:muwatta-maruf-1997 p.209} {cite:muwatta-maruf-1997 p.210}"
