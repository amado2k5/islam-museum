text: "فرضت الصلاة ركعتين ركعتين في الحضر والسفر، فأقرت صلاة السفر وزيد في صلاة الحضر"
summary:
  ar: "يرويه مالك عن صالح بن كيسان عن عروة بن الزبير عن عائشة، في باب قصر الصلاة في السفر: فُرضت الصلاة ركعتين ركعتين في الحضر والسفر، فأُقرت صلاة السفر وزيد في صلاة الحضر. ويخرّجه المحقق عند البخاري (350) ومسلم (2/142) وأبي داود (1198) والنسائي (1/225) وابن حبان والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد (16/293). {cite:muwatta-maruf-1997 p.209} {cite:muwatta-maruf-1997 p.210}"
