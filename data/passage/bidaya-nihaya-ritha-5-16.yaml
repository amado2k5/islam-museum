text: "… فكتب الحجاج إلى عبد الملك يعزيه فيه فنعاه عبد الملك إلى الناس بمنى، وأمّر الحجاج مكانه عتاب بن ورقاء، وكتب إليه أن يطيع المهلب، فكره ذلك ولم يجد بداً من طاعة الحجاج، ولم يمكنه مراجعته، فسار إلى المهلب فجعل لا …"
summary:
  ar: "مقطع من البداية والنهاية، المجلد المصوَّر 5، ص 16، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Bidaya wa-l-Nihaya, scan volume 5, p. 16, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "البدایہ والنہایہ، اسکین جلد 5، ص 16 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
