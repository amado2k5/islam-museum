  es: "Un extracto de al-Bidaya wa-l-Nihaya, volumen escaneado 5, p. 16, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Başlangıç ve Son\" adlı resimli cilt 5'in 16. sayfasından, ölüm ilanını ve duyurusunu içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve ölüm ilanlarını tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Awal dan Akhir,\" Volume Bergambar 5, halaman 16, berisi obituari dan pengumuman kematian; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan obituari paling terkenal."
