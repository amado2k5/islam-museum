label: { ar: "صحيح البخاري 3504 — الأب والأبوة", en: "Sahih al-Bukhari 3504 — the father and fatherhood", ur: "صحیح بخاری 3504 — باپ اور والدیت", es: "Sahih al-Bukhari 3504 — El padre y la paternidad", fr: "Sahih al-Bukhari 3504 — le père et la paternité" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا سُفْيَانُ، عَنْ سَعْدٍ، ح قَالَ يَعْقُوبُ بْنُ إِبْرَاهِيمَ حَدَّثَنَا أَبِي، عَنْ أَبِيهِ، قَالَ حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ هُرْمُزَ الأَعْرَجُ، عَنْ أَبِي هُرَيْرَةَ ـ قَالَ رَسُولُ اللَّهِ \" قُرَيْشٌ وَالأَنْصَارُ وَجُهَيْنَةُ وَمُزَيْنَةُ وَأَسْلَمُ وَأَشْجَعُ وَغِفَارُ مَوَالِيَّ لَيْسَ لَهُمْ مَوْلًى، دُونَ اللَّهِ وَرَسُولِهِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3504، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3504 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3504، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3504 (Virtudes y méritos del Profeta y sus compañeros), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3504 (Vertus et Mérites du Prophète et de ses Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
