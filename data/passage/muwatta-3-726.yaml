label: { ar: "الموطأ 726 — مالك: لا يخرص من الثمار إلا النخيل والأعناب، تخرص حين يبدو صلاحها للتوسعة على الناس", en: "Muwatta 726", es: "Muwatta 726", fr: "Muwatta 726", ur: "موطا 726", tr: "Al-Muwatta 726 — Malik: Sadece hurma ve üzüm tahmine tabidir; tahmin, olgunlukları belli olduğunda, halkın rızkı için yapılır.", id: "Al-Muwatta 726 — Malik: Hanya kurma dan anggur yang dapat diestimasi; estimasi dilakukan ketika kematangannya terlihat jelas, untuk tujuan memberi rezeki kepada masyarakat." }
summary:
  ar: "قول لمالك: الأمر المجتمع عليه عندنا أنه لا يُخرص من الثمار إلا النخيل والأعناب، فإن ذلك يُخرص حين يبدو صلاحه ويحل بيعه، لأن ثمر النخيل والأعناب يؤكل رطباً وعنباً، فيُخرص على أهله للتوسعة على الناس ولئلا يكون على أحد في ذلك ضيق، ثم يُخلى بينهم وبينه يأكلونه كيف شاؤوا، ثم يؤدون منه الزكاة على ما خُرص عليهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسعيد بن عفير ويحيى بن بكير عند أبي عبيد في الأموال (1443). {cite:muwatta-maruf-1997 p.364} {cite:muwatta-maruf-1997 p.365}"
  tr: "Malik şöyle demiştir: Bizde yerleşik uygulama, sadece hurma ve üzümün veriminin tahmin edilmesidir. Bu, olgunlaştıklarında ve satılmaya uygun olduklarında yapılır, çünkü hurma ve üzüm meyvesi taze olarak ve üzüm gibi yenir. Tahmin, insanların faydası için ve kimsenin zor durumda kalmasını önlemek için yapılır. Sonra diledikleri gibi yiyebilirler ve ardından tahmin edilen verim üzerinden zekât verirler. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Sa'id ibn Ufair ve Yahya ibn Bukayr tarafından rivayet edildiğini ve Ebu Ubeyd'in el-Amwal'da (1443) kaydettiğini belirtmektedir."
  id: "Malik berkata: Kebiasaan yang berlaku di antara kami adalah hanya kurma dan anggur yang dikenakan estimasi hasil panennya. Estimasi ini dilakukan ketika buah-buahan tersebut tampak matang dan boleh dijual, karena buah kurma dan anggur dimakan segar dan seperti anggur. Estimasi dilakukan untuk kepentingan masyarakat dan untuk mencegah kesulitan bagi siapa pun. Kemudian mereka diperbolehkan memakannya sesuka hati, dan kemudian mereka membayar zakat atas hasil panen yang diestimasi. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab, Sa'id ibn 'Ufair, dan Yahya ibn Bukayr, sebagaimana dicatat oleh Abu 'Ubayd dalam al-Amwal (1443)."
