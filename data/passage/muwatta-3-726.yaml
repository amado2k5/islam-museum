label: { ar: "الموطأ 726 — مالك: لا يخرص من الثمار إلا النخيل والأعناب، تخرص حين يبدو صلاحها للتوسعة على الناس", en: "Muwatta 726" }
summary:
  ar: "قول لمالك: الأمر المجتمع عليه عندنا أنه لا يُخرص من الثمار إلا النخيل والأعناب، فإن ذلك يُخرص حين يبدو صلاحه ويحل بيعه، لأن ثمر النخيل والأعناب يؤكل رطباً وعنباً، فيُخرص على أهله للتوسعة على الناس ولئلا يكون على أحد في ذلك ضيق، ثم يُخلى بينهم وبينه يأكلونه كيف شاؤوا، ثم يؤدون منه الزكاة على ما خُرص عليهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسعيد بن عفير ويحيى بن بكير عند أبي عبيد في الأموال (1443). {cite:muwatta-maruf-1997 p.364} {cite:muwatta-maruf-1997 p.365}"
