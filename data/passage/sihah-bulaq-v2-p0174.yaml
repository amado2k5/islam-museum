text: |-
  •⁦(باب النون)⁩
  ٤١٣
  ومنفت الناقة حسرتها ورجل منين أى ضعيف كأنَ الدهر منه أى ذهب بنسه أى بقوّته
  والممين الحبل الضعيف والمنين الغبار الضعيف والمن القطع ويقال النقص ومنه قوله تعالى
  لهم أجر غير معنون قال لبيد
  لمعفرقهد تنازع شلوه • غيس كواسب لايمن طعامها
  ومن عليهمنا أنعم والمنان من أسماء اللّٰه تعالى والمنيني منه كالخصيصى ومن عليه منة أى
  امتن عليه يقسال المنة تهدم الهنيعة أبو عبيد رجل منونة كثير الامتنان والمنون الدهرقال
  الاعنى أأن رأت رجلا أعشو أضر به • ريب المنون ودهر متبل خبل
  والمئون المنية لانها تقطع المددوشنقص العدد قال الفراء والمنون مؤنية وتكون واحدة
  وجعا والمنّ المناوهور طلان والجمع أمنان وجع المناأمناء والمنّ شئ حلو كالطار نجبين وفى
  لحديت السكمأ ة من المن ومن اسم لر يصلح أن يخاطب وهومبه-م غير متمحكن وهوفى
  اللفظ واحدو يكون فى معنى الجهاعة كقوله تعالى ومن الشياطين من يغوصون له قال
  المتلس لسنا كن حلت اباد دارها • تكريت تنظرحبها أن يحصدا
  فأنث فعل من لانه حله على المعنى لا على اللفظ والبيت ردى لانه أبدل من قبل أن يتم الاسم
  واما أربعة مواضع الاسستهام تحومن عندك والخبر نحوراً يت من عندك والجزاءفحومن
  بكرمن أكرمه وتكون نكرة موصوفة نحو هررت بن محسن أى بانسان محسن قال الشاعر
  وكنى شافضلا على من غيرنا * حب النبى محمدايانا
  خفض غبراعلى الاتباع أن ويجوز فيه الرفع على أن تجعل من صله باضمارهو وتحسكى بها
  الاعلام والكنى والنسكرات فى لغة أهل الحجازاذا قال رأيت زيداقلت من زيدا واذاقال
  رأيت رجلاقلت منالانه ذكرة وان قال ياءنى رجل قلت منو وان قال مررت برجسل قات
  نى وان قال جاءثى رحلان قلت منانوان قال مررت برجلين قلت منين بتسكين النون فيهما
  وكذلك فى ابهع ان قال يانى رجال قلت منون ومنين فى النصب والجر ولا تحسكى بها غير ذلك
  ولو قال رأيت الرحسل قلت من الرجسل بالرفع لانه ليس بعلم وان قال حروت بالاميرقات من
  الاميروان قال رأيت ابن اخيك قلت من ابن اخيك بارفع لاغير وكذلت ان أدخلت حرف
  العطف على من رفعت لاغيرقات فن زيدومن زيدوان وصلت حسذقت الزيادات قلت من
  ياهذا وقدياءت الزيادة فى الشعر فى حال الوصل قال الشاءر
  أتوانارى فقلت منون أنتم • فقالوا الجنّقات عمواظلاما
  وتقول فى الم-رأمنه ومنتان ومنات كاء بالتسكين وان وصلت قلت منة ياهذا بالتفوين
  ومذات وأن قال رأيت رجلا وحاراقلت من وأيا-ذفت الزيادة من الاوّل لانك وصلته وان
  قال مررث بحمار ورجل قلت أى ومى فقس عليه وغير أهل الجازلايرون الحكاية فى شئ
  منه ويرفعون المعرفة بعد من اسما كان أوكنية أو غير ذلك والناس اليوم فى ذلك عسلى لغة
  اهل الجاز واذا جعات من امعامتم.كاشددته لائه على حرفين كقول الراجز
  حتى أنخناها الى منّ ومن • أى أبر ناها الى رجل وأى رجل يريد بذلك تعظيم شأنه
  ومن بالسكسر حوف خافض وهولا بتداء الغاية كقوات خرجت من بغداد الى السكوفة وقد
  ١٠٤
