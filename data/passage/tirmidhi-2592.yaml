label:
  ar: "الترمذي 2592 — أكل بعضي بعضا فجعل لها نفسين"
  en: "Tirmidhi 2592 — the Fire complains to its Lord and is given two breaths"
  ur: "ترمذی 2592 — أشتكت النار إلى ربها فجعل لها نفسين"
text: "اشتكت النار إلى ربها وقالت أكل بعضي بعضا فجعل لها نفسين نفسا في الشتاء ونفسا في الصيف فأما نفسها في الشتاء فزمهرير وأما نفسها في الصيف فسموم …"
summary:
  ar: "حديث قدسي في الترمذي، رقم 2592: أكل بعضي بعضا فجعل لها نفسين. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Tirmidhi, no. 2592: the Fire complains to its Lord and is given two breaths. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ترمذی میں حدیثِ قدسی، نمبر 2592: أشتكت النار إلى ربها فجعل لها نفسين۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
