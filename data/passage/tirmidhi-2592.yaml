label:
  ar: "الترمذي 2592 — أكل بعضي بعضا فجعل لها نفسين"
  en: "Tirmidhi 2592 — the Fire complains to its Lord and is given two breaths"
  ur: "ترمذی 2592 — أشتكت النار إلى ربها فجعل لها نفسين"
  es: "Tirmidhi 2592 — El fuego se queja a su Señor y recibe dos respiraciones."
  fr: "Tirmidhi 2592 — Le Feu se plaint à son Seigneur et reçoit deux respirations."
  tr: "Tirmizi 2592 — Bir kısmı kendinden bir kısmını yedi, bu yüzden Allah ona iki can verdi."
  id: "Tirmidhi 2592 — Sebagian darinya memakan sebagian dari dirinya sendiri, maka Dia memberinya dua jiwa"
text: "اشتكت النار إلى ربها وقالت أكل بعضي بعضا فجعل لها نفسين نفسا في الشتاء ونفسا في الصيف فأما نفسها في الشتاء فزمهرير وأما نفسها في الصيف فسموم …"
summary:
  ar: "حديث قدسي في الترمذي، رقم 2592: أكل بعضي بعضا فجعل لها نفسين. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Tirmidhi, no. 2592: the Fire complains to its Lord and is given two breaths. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ترمذی میں حدیثِ قدسی، نمبر 2592: أشتكت النار إلى ربها فجعل لها نفسين۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Tirmidhi, n.° 2592: el Fuego se queja ante su Señor y recibe dos respiraciones. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté par Tirmidhi (n° 2592) relate que le Feu se plaint à son Seigneur et reçoit deux respirations. Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Tirmidzi, no. 2592: “Sebagian dari-Ku memakan bagian lain, lalu Dia memberikannya dua jiwa.” Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkannya dari Tuhannya, dan mereka yang mempelajari hadits qudsi akan menemukan riwayatnya dalam enam kumpulan hadits kanonik dan dalam Muwatta."
