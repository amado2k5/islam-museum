label: { ar: "سنن النسائي 5474 — بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 5474 — dutifulness to the parents or disobedience to them", ur: "سنن نسائی 5474 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 5474 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan al-Nasa'i 5474 — le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan an-Nasa'i 5474 — Anne babaya iyilik mi, yoksa onlara itaatsizlik mi?", id: "Sunan an-Nasa'i 5474 — Berbakti kepada orang tua atau tidak taat kepada mereka" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ يَزِيدَ الْمُقْرِئُ، قَالَ حَدَّثَنَا حَيْوَةُ، عَنْ دَرَّاجٍ أَبِي السَّمْحِ، عَنْ أَبِي الْهَيْثَمِ، عَنْ أَبِي سَعِيدٍ، عَنِ النَّبِيِّ قَالَ \" أَعُوذُ بِاللَّهِ مِنَ الْكُفْرِ وَالدَّيْنِ \". فَقَالَ رَجُلٌ تَعْدِلُ الدَّيْنَ بِالْكُفْرِ قَالَ \" نَعَمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5474، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5474 (The Book of Seeking Refuge with Allah), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5474، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5474 (El Libro de la Búsqueda de Refugio en Alá), menciona la obediencia o desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5474 (Le Livre de la recherche de refuge auprès d'Allah), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 5474 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. \"İslam'da Ebeveynlik\" tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5474, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Peramban \"Kekeluargaan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
