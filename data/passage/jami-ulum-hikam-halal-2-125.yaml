text: "… وأنَّ محمداً رسول اللهِ، والصَّلاةُ، وصومُ رمضانَ. من ترك منهنَّ واحدةً، فهو بها كافرٌ، حلالُ الدَّمِ، وتجدُه كثير المال لم يحجَّ، فلا يزالُ بذلك كافراً، ولا يحلُّ دمه، وتجده كثيرَ المال فلا يزكِّي، فلا يزالُ بذلك كافراً ولا يحلُّ دَمُهُ …"
summary:
