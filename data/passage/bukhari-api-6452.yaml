label: { ar: "صحيح البخاري 6452 — ضحك وتبسم", en: "Sahih al-Bukhari 6452 — laughter and smiling", ur: "صحیح بخاری 6452 — ہنسی اور تبسم", fr: "Sahih al-Bukhari 6452 — rire et sourire", es: "Sahih al-Bujari 6452 — risa y sonrisa", tr: "Sahih el-Buhari 6452 — Kahkaha ve Gülümseme", id: "Sahih al-Bukhari 6452 — Tawa dan Senyum" }
text: "… إِلاَّ لِيُشْبِعَنِي، فَمَرَّ وَلَمْ يَفْعَلْ، ثُمَّ مَرَّ بِي عُمَرُ فَسَأَلْتُهُ عَنْ آيَةٍ مِنْ كِتَابِ اللَّهِ، مَا سَأَلْتُهُ إِلاَّ لِيُشْبِعَنِي، فَمَرَّ فَلَمْ يَفْعَلْ، ثُمَّ مَرَّ بِي أَبُو الْقَاسِمِ فَتَبَسَّمَ حِينَ رَآنِي وَعَرَفَ، مَا فِي نَفْسِي وَمَا فِي وَجْهِي ثُمَّ قَالَ أَبَا هِرٍّ . قُلْتُ لَبَّيْكَ يَا رَسُولَ اللَّهِ. قَالَ الْحَقْ . وَمَضَى فَتَبِعْتُهُ، فَدَخَلَ فَاسْتَأْذَنَ، فَأَذِنَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6452، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 6452, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 6452، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6452, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 6452, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 6452 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6452, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
