label: { ar: "الموطأ 2527 — ابن شهاب: مضت السنة أن العاقلة لا تحمل من دية العمد شيئا إلا برضاها", en: "Muwatta 2527", es: "Muwatta 2527", fr: "Muwatta 2527", ur: "موطا 2527", tr: "El-Muvatta 2527 — İbn Şihab: Kabile, ancak kendi rızasıyla kasten öldürme suçundan elde edilen kan parasından pay alırsa, bu sünnettir.", id: "Al-Muwatta 2527 — Ibn Shihab: Sudah menjadi Sunnah bahwa anggota keluarga tidak menanggung uang darah untuk pembunuhan yang disengaja kecuali dengan persetujuannya." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أنه قال: مضت السنة أن العاقلة لا تحمل شيئا من دية العمد، إلا أن يشاؤوا ذلك. {cite:muwatta-maruf-1997 p.435}"
  tr: "Yahya, İbn Şihab'dan rivayetle Malik'ten naklederek şöyle buyurduğunu aktarır: \"Yerleşik uygulama şudur ki, kabile, kendi isteğiyle başka bir şey seçmedikçe, kasten öldürme suçundan elde edilen kan parasından pay almaz.\" {cite:muwatta-maruf-1997 s.435}"
  id: "Yahya meriwayatkan dari Malik, dari Ibnu Shihab, bahwa beliau berkata: Kebiasaan yang sudah mapan adalah bahwa klan tidak menanggung uang darah untuk pembunuhan yang disengaja, kecuali jika mereka memilih demikian. {cite:muwatta-maruf-1997 p.435}"
