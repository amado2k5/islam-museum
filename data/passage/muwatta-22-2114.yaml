label: { ar: "الموطأ 2114 — مالك: مضت السنة في القضاء باليمين مع الشاهد الواحد، يحلف صاحب الحق مع شاهده ويستحق حقه، فإن نكل أحلف المطلوب، فإن حلف سقط الحق، وإن أبى ثبت عليه الحق", en: "Muwatta 2114", es: "Muwatta 2114", fr: "Muwatta 2114", ur: "موطا 2114", tr: "Al-Muwatta 2114 — Malik: Tek şahitli yeminli hüküm verme uygulamasında yerleşik kural şudur: Hak sahibi, şahidiyle birlikte yemin eder ve hakkını elde eder. Eğer yemin etmeyi reddederse, sanık yemin eder. Eğer sanık yemin ederse, hak düşer. Eğer yemin etmeyi reddederse, hak aleyhine tesis edilir.", id: "Al-Muwatta 2114 — Malik: Praktik yang telah mapan dalam pengambilan keputusan dengan sumpah dan saksi tunggal adalah bahwa pihak yang berhak bersumpah bersama saksinya dan berhak atas haknya. Jika ia menolak, tergugat bersumpah. Jika ia bersumpah, hak tersebut hilang. Jika ia menolak, hak tersebut ditetapkan terhadapnya." }
summary:
  ar: "قال مالك: مضت السنة في القضاء باليمين مع الشاهد الواحد، يحلف صاحب الحق مع شاهده، ويستحق حقه. فإن نكل وأبى أن يحلف، أحلف المطلوب، فإن حلف سقط عنه ذلك الحق. وإن أبى أن يحلف ثبت عليه الحق لصاحبه. {cite:muwatta-maruf-1997 p.264}"
  tr: "Malik şöyle dedi: Yerleşik uygulama, tek bir tanığın yeminine dayanarak karar vermektir. Davacı, tanığıyla birlikte yemin eder ve hakkını kullanır. Yemin etmeyi reddederse, davalı yemin ettirilir. Yemin ederse, hakkından feragat etmiş sayılır. Yemin etmeyi reddederse, hak davacıda kalır. {cite:muwatta-maruf-1997 s.264}"
  id: "Malik berkata: Praktik yang sudah mapan adalah memutuskan berdasarkan sumpah dengan satu saksi. Penggugat bersumpah bersama saksinya dan berhak atas haknya. Jika ia menolak untuk bersumpah, tergugat dipaksa untuk bersumpah. Jika ia bersumpah, hak tersebut dianggap hilang. Jika ia menolak untuk bersumpah, hak tersebut tetap berada pada penggugat. {cite:muwatta-maruf-1997 p.264}"
