  ar: "قال مالك: مضت السنة في القضاء باليمين مع الشاهد الواحد، يحلف صاحب الحق مع شاهده، ويستحق حقه. فإن نكل وأبى أن يحلف، أحلف المطلوب، فإن حلف سقط عنه ذلك الحق. وإن أبى أن يحلف ثبت عليه الحق لصاحبه. {cite:muwatta-maruf-1997 p.264}"
