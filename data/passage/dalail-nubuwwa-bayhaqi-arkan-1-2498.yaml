text: "… أن يُطاع فيما سوى ذلك مِمَّا تحاورُونَ من أعمالكم فاحذروا أيها الناس إني قد تركتُ فيكم ما أن اعتصمتم به فلن تضلُّوا أبداً : كتاب اللّه، وسنَّةَ نبيه، إِنَّ كل مسلم أخُوْ المسلم، المسلمون أخوةٌ، ولا يحل لا مرىء من …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2498، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 2498, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2498 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
