label: { ar: "الموطأ 2822 — عائشة ترسل إلى أهلها بعد العتمة: ألا تريحون الكتاب", en: "Muwatta 2822", es: "Muwatta 2822", fr: "Muwatta 2822", ur: "موطا 2822", tr: "Al-Muwatta 2822 — Aişe, akşam karanlığından sonra ailesine şu mesajı gönderiyor: Yazıcılara rahat vermeyecek misiniz?", id: "Al-Muwatta 2822 — Aisyah mengirim pesan kepada keluarganya setelah malam tiba: Tidakkah kalian akan memberi para juru tulis istirahat?" }
summary:
  ar: "بلغ مالكا أن عائشة زوج النبي كانت ترسل إلى بعض أهلها بعد العتمة تقول: ألا تريحون الكتاب؟ ويذكر المحقق أن بعض النسخ تزيد أن المقصود بالكتاب الحفظة من الملائكة. {cite:muwatta-maruf-1997 p.584}"
  tr: "Malik, Peygamberin eşi Ayşe'nin akşam karanlığından sonra ailesinden bazılarına \"Kâtiplere biraz rahatlık vermez misiniz?\" diye mesaj gönderdiğini rivayet etmiştir. Araştırmacı, bazı rivayetlerde kâtiplerin koruyucu melekler olduğunun eklendiğini belirtmektedir. {cite:muwatta-maruf-1997 s.584}"
  id: "Malik meriwayatkan bahwa Aisyah, istri Nabi, biasa mengirim pesan kepada beberapa anggota keluarganya setelah matahari terbenam, dengan mengatakan: \"Tidakkah kalian akan memberi para juru tulis istirahat?\" Peneliti mencatat bahwa beberapa versi menambahkan bahwa juru tulis yang dimaksud adalah malaikat penjaga. {cite:muwatta-maruf-1997 p.584}"
