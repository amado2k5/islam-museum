label: { ar: "الموطأ 2467 — ابن شهاب وسليمان وربيعة: أسنان دية الخطأ", en: "Muwatta 2467", es: "Muwatta 2467", fr: "Muwatta 2467", ur: "موطا 2467", tr: "El-Muvatta 2467 — İbn Şihab, Süleyman ve Rabi'ah: Kasıtsız öldürme için kan parasının dişleri", id: "Al-Muwatta 2467 — Ibn Shihab, Sulayman, dan Rabi’ah: Gigi taring uang darah untuk pembunuhan tidak disengaja" }
summary:
  ar: "يروي مالك عن ابن شهاب وسليمان بن يسار وربيعة بن أبي عبد الرحمن أنهم كانوا يقولون: دية الخطأ عشرون بنت مخاض، وعشرون بنت لبون، وعشرون ابن لبون ذكرا، وعشرون حقة، وعشرون جذعة. {cite:muwatta-maruf-1997 p.420}"
  tr: "Malik, İbn Şihab, Süleyman ibn Yasar ve Rabi'ah ibn Abi Abdülrahman'dan rivayetle, onların şöyle dediklerini aktarır: Kasıtsız öldürmenin kan parası, ikinci yaşındaki yirmi dişi deve, üçüncü yaşındaki yirmi dişi deve, üçüncü yaşındaki yirmi erkek deve, dördüncü yaşındaki yirmi dişi deve ve beşinci yaşındaki yirmi dişi devedir. {cite:muwatta-maruf-1997 s.420}"
  id: "Malik meriwayatkan dari Ibn Shihab, Sulayman ibn Yasar, dan Rabi'ah ibn Abi Abd al-Rahman bahwa mereka biasa mengatakan: Uang ganti rugi untuk pembunuhan yang tidak disengaja adalah dua puluh unta betina pada tahun kedua, dua puluh unta betina pada tahun ketiga, dua puluh unta jantan pada tahun ketiga, dua puluh unta betina pada tahun keempat, dan dua puluh unta betina pada tahun kelima. {cite:muwatta-maruf-1997 p.420}"
