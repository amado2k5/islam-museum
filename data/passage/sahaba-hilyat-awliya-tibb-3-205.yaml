text: "… يغزو بالنساء، وهل كان يضرب لهن بسهم، وهل كان يقتل الصبيان، ومتى ينقضى يتم اليتيم، وعن الخمس لمن هو أ فكتب الينه ابن عباس : كان رسول اللّٰه يغزو بالنساء فيداوين الجرحى فيستجدين من الغنيمة، فأما السهم فلم يضرب لهن، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 205، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 205, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 3، ص 205 کا اقتباس جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 3, pág. 205, que menciona el tratamiento de heridas, mujeres que atienden a los heridos, búsqueda de tratamiento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 3 scanné, p. 205, qui mentionne le traitement des blessures, les femmes soignant les blessés, la recherche de soins; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 3. cildinin 205. sayfasından, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedaviden bahseden bir pasaj; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 3, hlm. 205, yang menyebutkan pengobatan luka, wanita yang merawat orang terluka, dan perawatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
