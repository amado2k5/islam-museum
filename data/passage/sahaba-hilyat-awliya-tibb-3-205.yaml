text: "… يغزو بالنساء، وهل كان يضرب لهن بسهم، وهل كان يقتل الصبيان، ومتى ينقضى يتم اليتيم، وعن الخمس لمن هو أ فكتب الينه ابن عباس : كان رسول اللّٰه يغزو بالنساء فيداوين الجرحى فيستجدين من الغنيمة، فأما السهم فلم يضرب لهن، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 205، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 205, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
