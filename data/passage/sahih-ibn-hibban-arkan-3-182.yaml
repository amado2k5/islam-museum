text: "- كتاب: الإيمان باب، حديث - سَلَمة، عَنِ ثَابِتٍ عن أَنَسِ بن مالك: أن رَسُوْل اللّه لف الَ : ثَلاثٌ مَنْ كُنَّ فِيهِ وَجَدَ حَلاَوَةَ الإِيمانِ: مَنْ كانَ اللَّهُ وَرَسُولُهُ أحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا، والرَّجُلُ يُحِبُّ الْقَوْمَ لا يُحِبُّهُمْ إلَّا …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 182، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 182, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 182 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 182, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
