label: { ar: "جامع الترمذي 3802 — الأب والأبوة", en: "Jami' al-Tirmidhi 3802 — the father and fatherhood", ur: "جامع ترمذی 3802 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3802 — El padre y la paternidad" }
text: "… حَدَّثَنَا عِكْرِمَةُ بْنُ عَمَّارٍ، قَالَ حَدَّثَنِي أَبُو زُمَيْلٍ، هُوَ سِمَاكُ بْنُ الْوَلِيدِ الْحَنَفِيُّ عَنْ مَالِكِ بْنِ مَرْثَدٍ، عَنْ أَبِيهِ، عَنْ أَبِي ذَرٍّ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَا أَظَلَّتِ الْخَضْرَاءُ وَلاَ أَقَلَّتِ الْغَبْرَاءُ مِنْ ذِي لَهْجَةٍ أَصْدَقَ وَلاَ أَوْفَى مِنْ أَبِي ذَرٍّ شِبْهِ عِيسَى ابْنِ مَرْيَمَ \". فَقَالَ عُمَرُ بْنُ الْخَطَّابِ كَالْحَاسِدِ يَا رَسُولَ اللَّهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3802، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3802 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3802، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3802 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
