label: { ar: "سنن النسائي 1271 — الأب والأبوة", en: "Sunan al-Nasa'i 1271 — the father and fatherhood", ur: "سنن نسائی 1271 — باپ اور والدیت", es: "Sunan al-Nasa'i 1271 — El padre y la paternidad" }
text: "أَخْبَرَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَمَّارٍ الْمَوْصِلِيُّ، عَنِ الْمُعَافَى، عَنْ عِصَامِ بْنِ قُدَامَةَ، عَنْ مَالِكٍ، - وَهُوَ ابْنُ نُمَيْرٍ الْخُزَاعِيِّ - عَنْ أَبِيهِ، قَالَ رَأَيْتُ رَسُولَ اللَّهِ وَاضِعًا يَدَهُ الْيُمْنَى عَلَى فَخِذِهِ الْيُمْنَى فِي الصَّلاَةِ وَيُشِيرُ بِأُصْبُعِهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1271، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1271 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1271، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1271 (El Libro del Olvido (En la Oración)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
