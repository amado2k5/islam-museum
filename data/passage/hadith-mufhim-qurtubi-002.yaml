text: "لذنب، ويأخذ بالذنب، كذا في جميع نسخ مسلم، ولرواته فيه وهم، وفي كتاب البخاري: تسعى، مكان تبتغي. وهو وجه الكلام وصوابه . قلت: ولا خفاء بحسن رواية تسعى، ووضوحها، لكن لرواية (تبتغي) وجه واضح، فلا يغلط الرواة كلهم، وذلك أن"
