  tr: "Abdülrazzak el-Sanani'nin eserinin 1. cildinin 4595. sayfasından, merhum için yazılmış ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari karya Abd al-Razzaq al-San'ani, Volume 1, halaman 4595, berisi elegi dan pujian untuk almarhum; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
