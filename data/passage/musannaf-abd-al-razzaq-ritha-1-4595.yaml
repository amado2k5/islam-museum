text: "… تنفق نفقة تبتغي بها وجه اللّٰه إلا ازددت درجة ورفعة، ولعلك أَن تخلف حتى ينفع اللّٰه بك أَقواماً ويَضُرّ بك الآخرين، اللهم أَمض لأصحابي هجرتهم، ولا تردّهم على أَعقابهم، لكن البائس سعد بن خولة، رثى له رسول اللّٰه عليل له، …"
summary:
  ar: "مقطع من المصنف — عبد الرزاق الصنعاني، المجلد المصوَّر 1، ص 4595، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
