text: ". قزوة رسول اللّه الى حتبن وهى غزوة هوازن الحُنين على تعبئة وركب بغلته البيضاء دُلْدُل ولبس يِرْعَين والمِغفر والبيْضة، فاستقبلهم من هَوازن شيءٌ لم يَرَوْا مثله قطّ. من السواد والكثرة، وذلك فى غَبَش الصبح، وخرجت الكتائب من مضيق الوادى …"
