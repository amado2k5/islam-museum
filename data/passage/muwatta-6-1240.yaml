label: { ar: "الموطأ 1240 — عمر بن الخطاب يحكم في ظبي أصابه محرمان بعنز مع رجل يحكم معه، ثم يسأله عن قراءته لسورة المائدة", en: "Muwatta 1240", es: "Muwatta 1240", fr: "Muwatta 1240", ur: "موطا 1240", tr: "El-Muvatta 1240 — Ömer ibn el-Hattab, ihramlı iki kişi tarafından yakalanan bir ceylan davasında, hükmün keçi olması gerektiği yönünde olduğunu söyler; yanında da hüküm veren bir adam vardır. Daha sonra ona Maide Suresi'ni okuyuşu hakkında soru sorar." }
summary:
  ar: "يروي مالك عن عبد الملك بن قرير عن محمد بن سيرين أن رجلا جاء إلى عمر بن الخطاب يقول إنه وصاحبا له أصابا ظبيا ونحن محرمان، فحكم عليه عمر ورجل إلى جنبه بعنز. فلما سمع الرجل قول عمر قال إنه أمير المؤمنين لا يستطيع أن يحكم في ظبي، فسأله عمر إن كان يقرأ سورة المائدة، فلما قال لا، قال له عمر لو أخبرتني لأوجعتك ضربا، واستشهد بآية الحكم في سورة المائدة، ثم قال إن هذا عبد الرحمن بن عوف. {cite:muwatta-maruf-1997 p.553}"
  tr: "Malik, Abdülmalik ibn Kurayr'dan, o da Muhammed ibn Sirin'den rivayet ettiğine göre, bir adam Ömer ibn el-Hattab'a gelerek, kendisi ve yanındaki bir arkadaşının ihramlı haldeyken bir ceylan öldürdüklerini söyledi. Ömer, kendisinin ve yanındaki adamın bir keçi kurban etmeleri gerektiğine hükmetti. Adam Ömer'in hükmünü duyunca, \"O, Müminlerin Emiri, ama bir ceylan için hüküm veremiyor mu?\" dedi. Ömer ona Maide Suresi'ni (5. Bölüm) okuyup okuyamayacağını sordu. Adam hayır deyince, Ömer ona, \"Bana söyleseydin, seni fena döverdim\" dedi ve Maide Suresi'ndeki hüküm ayetini okudu. Sonra da, \"Bu, Abdülrahman ibn Avf'tır.\" dedi. {cite:muwatta-maruf-1997 s.553}"
  id: "Malik meriwayatkan dari Abd al-Malik ibn Qurayr, dari Muhammad ibn Sirin, bahwa seorang pria datang kepada Umar ibn al-Khattab dan mengatakan bahwa ia dan seorang sahabat telah membunuh seekor kijang ketika dalam keadaan ihram (suci ritual). Umar memutuskan bahwa ia dan seorang pria di sampingnya harus membayar seekor kambing. Ketika pria itu mendengar keputusan Umar, ia berkata, \"Beliau adalah Amirul Mukminin, namun beliau tidak dapat memutuskan tentang seekor kijang?\" Umar bertanya kepadanya apakah ia dapat membaca Surah al-Ma'idah (Bab 5). Ketika ia menjawab tidak, Umar berkata kepadanya, \"Jika kau memberitahuku, aku akan memukulmu dengan keras,\" dan ia mengutip ayat tentang keputusan dalam Surah al-Ma'idah. Kemudian ia berkata, \"Ini adalah Abd al-Rahman ibn Awf.\" {cite:muwatta-maruf-1997 p.553}"
