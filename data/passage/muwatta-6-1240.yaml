label: { ar: "الموطأ 1240 — عمر بن الخطاب يحكم في ظبي أصابه محرمان بعنز مع رجل يحكم معه، ثم يسأله عن قراءته لسورة المائدة", en: "Muwatta 1240" }
summary:
  ar: "يروي مالك عن عبد الملك بن قرير عن محمد بن سيرين أن رجلا جاء إلى عمر بن الخطاب يقول إنه وصاحبا له أصابا ظبيا ونحن محرمان، فحكم عليه عمر ورجل إلى جنبه بعنز. فلما سمع الرجل قول عمر قال إنه أمير المؤمنين لا يستطيع أن يحكم في ظبي، فسأله عمر إن كان يقرأ سورة المائدة، فلما قال لا، قال له عمر لو أخبرتني لأوجعتك ضربا، واستشهد بآية الحكم في سورة المائدة، ثم قال إن هذا عبد الرحمن بن عوف. {cite:muwatta-maruf-1997 p.553}"
