text: "… بدنة، فذبح سبعا من الغنم، أجزأه جرائر نساء أهل الكتاب وذبائحهم حلال للمسلمين ليس للمجوس كتاب، ولا تحل ذبائحهم، ولا نكاح نسائهم سائر الكفار غير أهل الكتاب تحرم نساؤهم وذبائحهم ذبيحة المرتد حرام، وإن كانت ردته إلى دين أهل الكتاب …"
summary:
