text: "… يُسْرًا قال أبو بكر بن العربى : إن الإنفاق ليس له تقدير شرعى، وإنما أحاله اللّٰه تعالى على العادة، وهى دليل أصولى، بنى اللّٰه تعالى عليه الأحكام، وربط به الحلال والحرام قال ابن قدامة: والصحيح رد الحقوق المطلقة فى الشرع …"
