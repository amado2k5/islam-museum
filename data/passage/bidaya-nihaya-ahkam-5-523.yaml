text: "سنة ه سلامة، فأما الواجب فالزهد في الحرام واجب، والزهد عن الشهوات الحلال مستحب، والزهد عن الشبهات سلامة. وكان هو وأصحابه يمنعون أنفسهم الحمام والماء البارد والحذاء ولا يجعلون في ملحهم أبزاراً، وكان إذا جلس على سفرة فيها طعام طيب …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 5، ص 523، يرد فيه ذكر الواجب، والمستحب، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 5, p. 523, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 5، ص 523 کا اقتباس جس میں واجب، مستحب، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Bidaya wa-l-Nihaya de Ibn Kathir, volume numérisé 5, p. 523, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen digitalizado 5, p. 523, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo prohibido (haram); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 5. cildinin 523. sayfasından, farz, müstehap ve haram fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz fiiller, itaat fiilleri, müstehap fiiller, mekruh fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Permulaan dan Akhir), Jilid 5, halaman 523, yang menyebutkan amalan wajib, anjuran, dan haram; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan haram, dan dosa-dosa kecil."
