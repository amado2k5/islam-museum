text: "… ولأبن الحسين كَاب فى قلم الثلث، ولابن الشيخ عز الدين بن عبد السلام مصنَّف فى قلم النسخ، وفى صناعة الهجاء المختصة بالقرءان الرائية للشاطبى، وفى خلال كتب النحو الجامعة كالتسهيل وغيره جملة من الهجاء، وقد أودعت فى هذا الكتاب ما …"
