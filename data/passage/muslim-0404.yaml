label:
  ar: "مسلم 404 — قال الله على لسان نبيه: سمع الله لمن حمده"
  en: "Muslim 404 — God said on the tongue of His prophet: God hears whoever praises Him"
  ur: "مسلم 404 — اللہ نے اپنے نبی کی زبان پر فرمایا: اللہ نے سن لی جس نے اس کی حمد کی"
text: "إذا صليتم فأقيموا صفوفكم ثم ليؤمكم أحدكم فإذا كبر فكبروا وإذا قال غير المغضوب عليهم ولا الضالين فقولوا آمين . يجبكم الله فإذا كبر وركع فكبروا واركعوا فإن الإمام يركع قبلكم ويرفع قبلكم . فقال رسول الله فتلك بتلك وإذا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 404: قال الله على لسان نبيه: سمع الله لمن حمده. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 404: God said on the tongue of His prophet: God hears whoever praises Him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 404: اللہ نے اپنے نبی کی زبان پر فرمایا: اللہ نے سن لی جس نے اس کی حمد کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
