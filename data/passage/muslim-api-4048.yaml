label: { ar: "صحيح مسلم 4048 — الحرام، ما حُرّم", en: "Sahih Muslim 4048 — the unlawful; what was made unlawful", ur: "صحیح مسلم 4048 — حرام، جو حرام کیا گیا", es: "Sahih Muslim 4048 — Lo ilícito; lo que se hizo ilícito", fr: "Sahih Muslim 4048 — l'illicite; ce qui a été rendu illicite" }
text: "… رَبَاحٍ عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ عَامَ الْفَتْحِ وَهُوَ بِمَكَّةَ \" إِنَّ اللَّهَ وَرَسُولَهُ حَرَّمَ بَيْعَ الْخَمْرِ وَالْمَيْتَةِ وَالْخِنْزِيرِ وَالأَصْنَامِ \". فَقِيلَ يَا رَسُولَ اللَّهِ أَرَأَيْتَ شُحُومَ الْمَيْتَةِ فَإِنَّهُ يُطْلَى بِهَا السُّفُنُ وَيُدْهَنُ بِهَا الْجُلُودُ وَيَسْتَصْبِحُ بِهَا النَّاسُ فَقَالَ \" لاَ هُوَ حَرَامٌ \". ثُمَّ قَالَ رَسُولُ اللَّهِ عِنْدَ ذَلِكَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4048، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 4048 (The Book of Musaqah), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 4048، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.° 4048 (El Libro de Musaqah), menciona lo ilícito y lo que fue declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 4048 (Le Livre de la Musaqah), mentionne ce qui est illicite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
