text: "ما بين بيتي ومنبري روضة من رياض الجنة"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن عباد بن تميم عن عبد الله بن زيد المازني، أن النبي قال إن ما بين بيته ومنبره روضة من رياض الجنة، دون الزيادة التي في حديث أبي هريرة عن الحوض. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي، والتنيسي عند البخاري (1195)، وقتيبة عند مسلم (4/123) والنسائي (2/35). {cite:muwatta-maruf-1997 p.273}"
