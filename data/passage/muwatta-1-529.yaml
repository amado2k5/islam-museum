label: { ar: "الموطأ 529 — عبد الله بن زيد المازني: ما بين بيتي ومنبري روضة من رياض الجنة", en: "Muwatta 529", es: "Muwatta 529", fr: "Muwatta 529", ur: "موطا 529", tr: "Al-Muwatta 529 — Abdullah bin Zaid Al-Mazini: Evim ile minberim arasında cennet bahçelerinden bir bahçe vardır.", id: "Al-Muwatta 529 — Abdullah bin Zaid Al-Mazini: Di antara rumahku dan mimbarku terdapat sebuah taman dari taman-taman Surga." }
text: "ما بين بيتي ومنبري روضة من رياض الجنة"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن عباد بن تميم عن عبد الله بن زيد المازني، أن النبي قال إن ما بين بيته ومنبره روضة من رياض الجنة، دون الزيادة التي في حديث أبي هريرة عن الحوض. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي، والتنيسي عند البخاري (1195)، وقتيبة عند مسلم (4/123) والنسائي (2/35). {cite:muwatta-maruf-1997 p.273}"
  tr: "Malik, Abdullah ibn Abi Bekr'den, o da Abbad ibn Tamim'den, o da Abdullah ibn Zeyd el-Mazini'den rivayetle, Peygamber'in, \"Evinin ve minberinin arasındaki alan, cennet bahçelerinden biridir\" dediğini nakletmiştir; bu hadiste Ebu Hurayra'nın hadisinde yer alan su kuyusuyla ilgili ekleme bulunmamaktadır. Editör, bu hadisin Buhari'de (1195) Ebu Musab, el-Ka'nebi ve el-Tunisi tarafından Malik'ten nakledildiğini, Müslim'de (4/123) ve el-Nesai'de (2/35) Kuteybe tarafından da rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.273}"
  id: "Malik meriwayatkannya dari Abdullah ibn Abi Bakr, dari Abbad ibn Tamim, dari Abdullah ibn Zayd al-Mazini, bahwa Nabi bersabda, “Area antara rumahnya dan mimbar adalah taman dari taman-taman Surga,” tanpa tambahan dalam hadits Abu Hurayrah tentang Telaga. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, al-Qa’nabi, dan al-Tunisi dalam al-Bukhari (1195), dan oleh Qutaybah dalam Muslim (4/123) dan al-Nasa’i (2/35). {cite:muwatta-maruf-1997 p.273}"
