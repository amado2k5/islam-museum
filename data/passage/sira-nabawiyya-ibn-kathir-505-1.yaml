text: "حمد رسول الله إلى قيصر صاحب الروم . فنخر ابن أخ له أحمر أزرق سبط ⁦(١)⁩ فقال : لا تقرأ الكتاب اليوم فإنه بدأ بنفسه وكتب : صاحب الروم ولم يكتب ملك الروم . قال : فقرئ الكتاب حتى فرغ منه"
