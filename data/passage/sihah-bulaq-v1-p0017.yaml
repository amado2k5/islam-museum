text: |-
  مؤوية تهب النهار كله ا•
  ويقال امتشع سيفه اذا استله
  بسرعة
  ٦٢٤
  أبوعبيد أن يكون التمزع:عنى التقطع وانمااستبعد المعدنى والمزعة بالضم قطعة لحم بقال
  ماعليه هزعة لحم وما في الاناهمزعة من الماء أى جرعة والمزعة بالكسرمن الريش والقطن
  مثل المزقة من الخرق ومنه قول الشاءر يصف ظليمنا
  مزع يطيره أزف خدوم
  أى سريع ( سع لاصعى يقال لريح الشمال مسع ونسع قال المتنخل الهذلى
  قد حال بين دريسيه مؤوبة • نسع لهابعضاه الارض تهزيز
  وقولهمؤؤية أى ري تجى ممع الليل شع لمشع الكسب والجمع ومشعت الغنم
  حلبتها وامتنعت ما فى الضرع اذ الم تدع فيه شيئًا ويقال امتشع من فلان ما مشع لك أى
  خذمنه ماوجدت قال ابن الاءرابى ا.تشع الرج-ل توب صاحبه اى اختلسه وذئب
  مشوع ٥ع مصعت الداية بذنبها حركته قال رؤية يمصن بالاذناب من لوح وإق
  والمصع الضرب بالسيف والمماصعة المجالدة فى الحرب ورجل مصع ومصعت ضرع الناقة
  الحلوية اذاضر بته بالماء البارد ومصعت الاتم بالولدرمت به ويقال مرّيمصع أى يسرع مثل
  يمزع وأنشد أبوعمرو
  ويصع فى قطعة طبلسان * مصما كصع ذكرالورلان
  ودصع البرق أى أومض وشئ ماصع أى براق قال ابن مقبل .
  فأفرغت من ما صع لونه • على قلص يتهين السجالا
  أبوع رومضع لبن الناقة مصوعا اذا ولى وذهب فهى ماصحة الدر وكل شئ ولى وذهب
  فقد ممع ويروى قول الشماخ يصف نبعة
  خصعها شهرين ماء حائها بالصادغير
  معجمة يقول رك عليها قشرها حتى جف علميه اليطها وأمصح القوم اى ذهبت ألبان ابلهم قال
  أبو عبيدة أمصح الرجل اذا ذهب ابن ابله ومصعت ابلهاذا ذهبت ألبانها قال ومصع البرد
  أى ذهب قال الفرّاء مصع الرجل فى الارض وامتصع أى ذهب قال الاغلب العجلى
  وهن يصعن امتصاع الاظب والمصعة مثال الهمزة طائر والمصعة أيضاءرة العومج والجمع
  مصع ظع مظعت الهوداذا قطعته رطبائم ركنه بلهائه ليتشرب ماءه لئلا يتشقق
  ويتصدع قال الشماخ بصف قوسا
  قطعها حوليز ماملائها * وينظرفيها أيها هوغامز
  وقال آخر
  نظعها حولين ماملمائها • تعالى على ظهر العريش وتنزل
  ( ⁦(]عع%)⁩. (المعمعة صوت الحر يق فى القصب ونحوه وصوت الابطال فى الحرب قال الشاءر
  كعب بن مالك من سرّة ضرب يرعبل بعضه • بعضا كعمعة الأباء المحرق
  والمعمعان شدّة الحريقال يوممعمعان و.همع القوم أى ساروا فى شدّة الحرّ والمعمع المرأة
  التق أمرها مجمع لا تعطى أحدا من مالهاشيئا وم ن كلام بعضه-م فى مفة النساءمنهن .عمع
  اهاشيتها أجمع والمعمعىّ الرجل الذى يكون مع من غلب ومع كلة تدل عسلى المصاحبة
  قال ممد بن السرى الذى يدل على أنّ مع اسم حركة آخره مع تحرك ماق له وقد يسكن وينون
  تقول جؤامعا قع قع فلان بسوأة أى رمح بها والمقع أشدّ الشرب والفصيل يمقع
  أمه اذارضعها قال الكسائى بة-ل امتقع لونه اذا تغيرم ن حزن أوفزع أوريبة قال وكذلك
  انتقع وابتنع وبالمسيم أجود اع لملخ السيز السريع الطفيف ويقمال ملعت الناقة
  فى سيرها
