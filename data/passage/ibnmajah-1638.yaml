label:
  ar: "ابن ماجه 1638 — الصوم لي وأنا أجزي به"
  en: "Ibn Majah 1638 — Fasting is Mine, and I reward it"
  ur: "ابن ماجہ 1638 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "كل عمل ابن آدم يضاعف الحسنة بعشر أمثالها إلى سبعمائة ضعف إلى ما شاء الله. يقول الله: إلا الصوم فإنه لي وأنا أجزي به. يدع شهوته وطعامه من أجلي. للصائم فرحتان: فرحة عند فطره وفرحة عند لقاء ربه. ولخلوف فم …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1638: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1638: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1638: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
