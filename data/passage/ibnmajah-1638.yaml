label:
  ar: "ابن ماجه 1638 — الصوم لي وأنا أجزي به"
  en: "Ibn Majah 1638 — Fasting is Mine, and I reward it"
  ur: "ابن ماجہ 1638 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
  es: "Ibn Majah 1638 — El ayuno es mío, y yo lo recompenso."
  fr: "Ibn Majah 1638 — Le jeûne m'appartient et je le récompense."
  tr: "İbn Majah 1638 — Oruç Benim içindir ve Ben onun karşılığını vereceğim."
  id: "Ibn Majah 1638 — Puasa itu untuk-Ku dan Aku akan memberi pahala kepadanya"
text: "كل عمل ابن آدم يضاعف الحسنة بعشر أمثالها إلى سبعمائة ضعف إلى ما شاء الله. يقول الله: إلا الصوم فإنه لي وأنا أجزي به. يدع شهوته وطعامه من أجلي. للصائم فرحتان: فرحة عند فطره وفرحة عند لقاء ربه. ولخلوف فم …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1638: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1638: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1638: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 1638: El ayuno es mío, y yo lo recompenso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 1638: « Le jeûne M’appartient et Je le récompense. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 1638: “Puasa itu untuk-Ku, dan Aku akan memberi pahala kepadanya.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
