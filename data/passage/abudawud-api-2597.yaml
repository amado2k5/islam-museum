label: { ar: "سنن أبي داود 2597 — اليتيم وفقد الأب", en: "Sunan Abi Dawud 2597 — the orphan and the father lost", ur: "سنن ابی داؤد 2597 — یتیم اور باپ کی موت", es: "Sunan Abi Dawud 2597 — El huérfano y el padre perdido", fr: "Sunan Abi Dawud 2597 — L'orphelin et le père perdus", tr: "Sunan Abi Davud 2597 — Yetim ve Babasının Kaybı", id: "Sunan Abi Dawud 2597 — Anak Yatim dan Kehilangan Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْمُهَلَّبِ بْنِ أَبِي صُفْرَةَ، قَالَ أَخْبَرَنِي مَنْ، سَمِعَ النَّبِيَّ يَقُولُ \" إِنْ بُيِّتُّمْ فَلْيَكُنْ شِعَارُكُمْ حم لاَ يُنْصَرُونَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2597، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2597 (Jihad (Kitab Al-Jihad)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2597، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2597 (Yihad (Kitab Al-Jihad)), menciona al huérfano y al padre desaparecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un hadith du Sunan Abi Dawud, n° 2597 (Jihad), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sünen Ebu Davud'da yer alan 2597 numaralı hadiste yetimler ve babasızlık konusu geçmektedir. Bu hadis, Kur'an, Sünnet, Peygamberimizin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinleri içeren \"İslam'da Babalık\" bölümü tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2597, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Hadits ini dikompilasi oleh bagian \"Kebapakan dalam Islam\", yang mencakup teks-teks terkait dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
