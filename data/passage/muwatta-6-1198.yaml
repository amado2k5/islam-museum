label: { ar: "الموطأ 1198 — زيد بن أسلم عن أبيه: عمر صلى بمكة ركعتين وقال أتموا صلاتكم، ثم صلى ركعتين بمنى", en: "Muwatta 1198" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن أبيه أن عمر بن الخطاب صلى للناس بمكة ركعتين، فلما انصرف قال يا أهل مكة أتموا صلاتكم فإنا قوم سفر. ثم صلى ركعتين بمنى، ولم يبلغ أنه قال لهم شيئا. {cite:muwatta-maruf-1997 p.539}"
