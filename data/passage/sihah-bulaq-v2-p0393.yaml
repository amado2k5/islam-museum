text: |-
  ١ ى نسمنة زيادة أب محمد
  وأول البين
  انّ لهافى العام ذى الفتوق
  قواء تصلّ فبعض النسمح تنهل"
  /ه
  ووصاون الصباان كنت فاطه
  قول والزلية يعنى بالكسر وهى
  البساط كافى التاموس ا*
  ١٩٤
  •⁦(زمل)⁩•
  سمطايربي ولدة زعايلا * والسمط الفقير غل ) الزفلة بالضم الدفعة من البول وغيره
  تقول أزغات الناقييولها أى رمت به وقطعته زغلة زغلة وأزعلت الطعنة بالدم مثل
  أوزغت وأزغسل الطائر فرخه اذازقه قال ابن أحر وذكر القطاة وفرخها وأنها .
  سقته مماشربت
  فأزغات فى حلقه زغلة • لم تظلم الجيد ولم تشفتر
  ويقال ازغل لى زغلة من سقائك أى صبت لى شيأ من لبن والزغلول الخفيف وهو الطفل أيضا
  ⁦( زفل )⁩ الازفلة الهاعة يقال جاؤا بازفلتهم أى مجماعتهم وقال
  انى لاعلم ماقوم بأزذ-لة • جاؤ الاخبر من ليلى بأكياس
  جأو الاخبر من ليلى فقلت لهم • ليلى من الجنّ أم إيلى من الناس
  وقال سيبويه أخذته ازفلة بكسر الهم زوتشديد اللام أى خفة والازفلى مثل الاجفلى
  كل) الزونكل القصير ال تقول زلات يافلات بالفخ تزل زليلااذازل فى
  طين أومنطق وقال الفراء زلت بالكسرتزل زللا والاسم الزلة والزليلى واستزله غيره
  وقول الراجز ١ * وزال النية والتصفيق • يعنى أنه يزل من موضع الى موضع لطاب
  الكلاوالنية الموضع الذي ينوون المسيراليه وزحلوفة زل أى زلق قال الراجز
  لمن زحاوفة زلة • جا العينان تحل
  وكذلك زحلوفة زلل قال الكميت ٣ وفى مقام الصباز حلونة زلل • وزات الدراهم تزل
  زلولا أى نقصت فى الوزن يقال درهم زال وزلزل اللّٰه الارش زلزلة وزلز الابالكسر فتزلزات
  هى والزلزال بالفتح الاسم والزلازل الشيدائد والزلزل الاثاث والمشاع على فعلل بفتح العين
  وكسر اللام والمزلة والمزلة بكسر الزاى وفتهحها المكان الدحض وهو موضع الزلل قال أبو عمرو
  الازل الخفيف الوركين وامأة زلا، أى رسحاء بينة الزال وقال • ولابزلا وألن ستهم *
  والسمع الازل الذئب الارمح يتولد بين الذتب والضبع وهذه الصفة لارمة له كما يقال الضبع
  العرجاء وفى المثل(وأسمع ص الذئب الازل" وما.زلال أى عذب وأزللت البهنعمة أى
  أسديتها وفى الحديث من أزات اليه نعمة فليشكرها وأزللت اليه من حقه شيا أى أعطيت
  والزلية واحدة الزلالى (زمل الازمل الصوت وأنتد الاخفش
  تضب لثات الخبل فى جراتها • وتسمع من تحت العجاج اما أزملا
  يريد أزملا فحذف الهمزة كما عالواويل آمّه ويقال أخذت الشئ بأزمله أى كله ويقال عيالات
  أزملة أى كثيرة أبوعر والازعولة بالضم المصوّت من الوعول وغيرهاوقال يصف وعلامسنا
  عودا أحمّ القراأزمولة وقلا • على زاث أبيه يتبع القذفا
  ويقال هوازمول وازمولة بكسر الالف وفتح الميم والازميسل شفرة الحذا، والزقل والزميل
  والزقال بعف وه والجبان الضعيف قال أحيحة
  فلاوأيك مايغنى غذائى • من الفتبان زقيل كسول.
  وقالت أم تأبط شرا وابشاه وابن الليل ليس بزقيل شروب للقيل يضرب بالزبل كقرب
  الخيل والزقيلالضعيفة والزاملة بعير يستظهر به الرجل يحمل متاعه وطعامه عليه
  والمزاملة
