text: |-
  ٣ ٢٠٩
  عنتا باطلا وظلما كما ، تعتر عن حجرة الربيض الظباء
  وعتر الرمح اضطرب واهتز يعتر عترا وعترانا (عنر المثرة الزلة وقد عنر فى توبه يعثر عشارا
  يقسال عسئريه فر-ه فسقط وعنر عليه أيضا يعنر عثرا وعثورا أى اطلع عليه وأعنره عليه غيره
  ومنه قوله تهالى وكذلك أعثرنا عليهم وتعنر لسانه تلعثم والعاتور حفرة تحفر للاسدوغيره ليصاد
  قال الشاعر وهل يدع الواشون افسادييننا * وحفر النا العاتور من حيث لاندِرى
  ويقال للرجل اذا تور ط قد وقع فى عانورشرّ وعافورشر قال الاصمعى لقيت منه عاذورا أى
  شذة ووقع القوم فى عاثور شرّ أى فى شدة قال رؤبة وبلدة مرهوية العاثور
  قال الخليل يعنى المتالف وقال ذوالرمة.
  ومرهوية العاثورتر مى بركيها * الى منله حرف بعيد مناهله
  والعثير يتسكين الثاء الغبارولا تقسل عثير لانه ليس فى الكلام فعيل يفتح الفاء إلاضهيذوهو
  مصنوع معناه الصلب الشديد والعيثر مثال الغيهب الاثرويقال مارأيت لهم أثرا ولاعيثرا
  ولا عثيرا عن يعتوب وعثر مخفف بلد باليمن وعثريا اتشديد هوضع قال الشاءر زهير
  ليت بعتر يصطاد الرجال اذا * ما الليث كذب عن أقراته صدقا
  والعنرى بالتحريك العذى وهوالزرع الذى لايسقيه الاماء المطر ⁦(عجر)⁩ العجرة بالضم
  العقدة فى الخشب أوفى عروق الجسد وكعب بن عجرة من الصمابة والعجرة بالكسر نوع من
  العمة يقال فلان حسن العجرة والعجر بالتحريك الجم والنتوّ يقال رجل أعجر بين العجرأى
  عظيم البطن وهميان أعجر أى ممتلئ والفحل الاعجر الضخم ووظيف عجروعجر بكسر الجيم
  وضمها أى غليظ وعجر الرجل بالسكسر بعجر عجرا أى غلظ وسمن وتهجر بطنه أى أعمكن والمعجر
  ما تشده المرأة على رأسها يقال اعتجرت المرأة والاعتجارأ يضالف الع-مامة على الرأس
  قال الراجز
  جاءت به معتجر اببرده * سفوا تردى بنسيج وحده
  وعجر الفرس أى مدذنبه نحو مجزه فى العدو ثم قيل مزالفرس يعجر عجرا اذا مز مزاسريعا
  وعجر عليه بالسيف أى شد عليه ابن السنكيت عجر عنقه يعجرها عجرا أى ثناها وبقال عجريه
  ميره عجرانا كانه أراد أن يركب به وجهافر جمع به قسل ألافه وآهله مثل عكريه وحكى
  حضهسم عنجر الرجل اذا مدشفتيه وقلبهما قال والعنجرة بالشفة والزغجرة بالاصبع والهجير
  العنين باراء والزاى جميعا و الذى لا يأتى النساه والعجورة غسلاف القارورة ( ذر
  الاعتذار من الذنب واعتذر رجل الى ابراهيم النخعى فقال له
  قد عذرتك غير معتذر * ان المعاذير بشوبها الكذب
  واعتذر بمعنى أعذر أى صارذاعذر قال لبيد
  الى الحول ثم اسم السلام عليكما * ومن يبك حولا كاملا فقداعتذر
  والاعتذار أيضا الدروس قال الشاعر
  أم كنت تعرف آيات فقد جعات • اطلال الفك بالود كاء تعتذر
  والاعتذار الاقتضاض وقولهم عذيرك من فلان أى هلم من يعذرك منه بل يلومه ولا
  لومك قال الشاهر ⁦( ١)⁩
  عذير الحىّ من عدوا ن كانواحية الارض
  قوله والعثير أى بوزن منبر اه
  ١ والاصبع العدوانى اه
