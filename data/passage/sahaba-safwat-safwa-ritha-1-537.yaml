text: "… نجيُّ الله، ومات داود خليفة الرحمن، ومات محمد في وعلى جميع الأنبياء، ومات أبو بكر خليفة رسول الله، ومات أخي وصديقي عمر بن الخطاب. فقلت له : يرحمك اللّٰه إن عمر لم يمت! قال: بلى؛ قد نعاه إلي ربي عز …"
summary:
