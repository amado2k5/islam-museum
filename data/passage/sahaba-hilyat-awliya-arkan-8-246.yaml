text: "… ورسله واليوم الآخر وبالقدر كله خيره وشره وآمن بالبعث والحساب والجنة والنار حتى كانه ينظر إلى ذلك وذلك، من النور الذى قذفه اللّٰه فى قلبه، فاذا آمن قلبه نطق لسانه مصدقا لما آمن به القلب وأقر بذلك وشهد أن لا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 246، يذكر الإيمان بالقدر، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 8, p. 246, that mentions belief in the decree, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 8، ص 246 کا اقتباس جس میں تقدیر پر ایمان، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 8, pág. 246, que menciona la creencia en el decreto y en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 8, page 246 (numérisé), mentionnant la croyance au décret et la croyance en la résurrection; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 8. resimli cildinin 246. sayfasında, kader inancı ve diriliş inancından bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 8, halaman 246, menyebutkan kepercayaan pada takdir dan kepercayaan pada kebangkitan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
