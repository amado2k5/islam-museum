text: "قريش رسول الله وَليه و عشيرَتُه الأقربونَ، وآلُه الذين تحرَمُ علَيهم الصَّدقَةُ، قالَ أهلُ العلم في تأْويلِ قَوْلِهِ وَ فيم لا تحِلُّ الصَّدَقَةُ لمحمدٍ ولا، وآلُ علِيٍّ، لآلِ محمدٍ، قالُوا : هم بنو هاشمٍ؛ آلُ العباسِ وآلُ عَقيلٍ، وآلُ جعفَرٍ، …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 4، ص 203، يذكر ما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 4, p. 203, that mentions what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 4، ص 203 کا اقتباس جس میں جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 4, pág. 203, que menciona lo que no es lícito y lo que fue declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab (tome 4, page 203), mentionnant ce qui est illicite et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "İbn Abdül-Barr'ın resimli eseri el-İsti'ab'ın 4. cildinin 203. sayfasından, haram ve izin verilmeyen şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 4, halaman 203, yang menyebutkan apa yang diperbolehkan dan apa yang diharamkan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
