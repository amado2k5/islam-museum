label: { ar: "صحيح البخاري 4825 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4825 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4825 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4825 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 4825 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا يَحْيَى، حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ مُسْلِمٍ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، قَالَ خَمْسٌ قَدْ مَضَيْنَ اللِّزَامُ وَالرُّومُ وَالْبَطْشَةُ وَالْقَمَرُ وَالدُّخَانُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4825، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4825 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4825، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4825 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 4825 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
