label: { ar: "الموطأ 2856 — لا تحل الصدقة لآل محمد إنما هي أوساخ الناس", en: "Muwatta 2856", es: "Muwatta 2856", fr: "Muwatta 2856", ur: "موطا 2856", tr: "El-Muvatta 2856 — Sadaka, Muhammed'in ailesi için caiz değildir; o, insanların pisliğidir.", id: "Al-Muwatta 2856 — Sedekah tidak diperbolehkan bagi keluarga Muhammad; itu hanyalah kotoran manusia." }
summary:
  ar: "بلغ مالكا أن رسول الله قال: لا تحل الصدقة لآل محمد، إنما هي أوساخ الناس. ويذكر المحقق قول ابن عبد البر أن الحديث يرويه مالك مسندا، وأن سعيد بن داود بن أبي زنبر وجويرية بن أسماء رويا عنه كذلك، وأنه في صحيح مسلم من طريق جويرية. {cite:muwatta-maruf-1997 p.600}"
  tr: "Malik, Resulullah'ın şöyle buyurduğunu rivayet etmiştir: \"Sadaka, Muhammed'in ailesi için caiz değildir; o, insanların pisliğidir.\" Araştırmacı, İbn Abdülberr'in, Malik'in bu hadisi bir isnad zinciriyle rivayet ettiğine, Sa'id ibn Davud ibn Ebu Zenber ve Cüveyriye ibn Esma'nın da ondan rivayet ettiğine ve Cüveyriye'nin isnadıyla Sahih Müslim'de bulunduğuna dair ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.600}"
  id: "Malik meriwayatkan bahwa Rasulullah SAW bersabda: \"Sedekah tidak diperbolehkan bagi keluarga Muhammad; itu hanyalah kotoran manusia.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa Malik meriwayatkan hadits tersebut dengan sanad yang benar, dan bahwa Sa'id ibn Dawud ibn Abi Zanbar dan Juwayriyah ibn Asma' juga meriwayatkannya darinya, dan bahwa hadits tersebut ditemukan dalam Sahih Muslim melalui sanad Juwayriyah. {cite:muwatta-maruf-1997 p.600}"
