text: |-
  *باب الواوواليام)*
  • ⁦(درا)⁩*
  ٤٧٧
  بين فوال وفعل قال الهجاج • يفاحم دووى حتى اعلنكسا• والدواية والدواية الجليدة التى !
  تعلو للبن والمرق وقد دوى اللبن تدوية اذاركبته الدواية وقد ادّويت أى اكات الدواية وهو
  افتعلت قال الشاعره كما كتت داء ابنها أمّ مدوى• وذلك أن خاطبة من الاعراب خطيت
  على ابنها جارية فجاءن أمها الى أمّ الغلام لتنظر اليه فدخل الغلام فقال أأذوى يا أتى
  فقالت الاتم اللجاممعلمق بعمود البيت أرادت بذلك كتمان زلة الابن وسوعادته ودوى
  |الريح حفيفها وكذلل" دوىّ النحل والطائرويقال دوى الفحل تدوية وذلك اذاسمعت اهديره
  دويا والمدوى أيضا السحاب ذوالرعد المرتجس قال الاصعى يقال دوّى الكاب
  فى الارس كما يقال دوم الطائر فى السماء اذادارفى طيرانه ولزم السعت فى ارتضاعه قال
  ولا يكون التدويم فى الارض ولا التدوية فى السماء وكان يعيب قول ذى الرمة
  حتى اذادوّمت فى الارض راجعه • كبر ولوشاء ني نفسه الهرب
  وبعضهم يقول همالغتان بمعنى يجول ومفه اشتقت دوّامة الصبىّ وذلك لا يكون الافى
  الارض والدواة بالفتح ما يكتب.:-ه والمع دوى مثل نواة ونوى ودوىّ أيضا على فعول
  جع الجمع مثل صفاة وصفاوصفى قال أبو ذؤيب
  عرفت الدياركر قم الدوىّ حبره السكاذب الجيرى
  وثلاث دويات الى العشر والدو والدوى المقازة وكذلك الدوية لانها مفازة مثلها فنسيت اليها
  وهو كولهم قعسر وقعسرى ودهردوارودوارى قال الشاعر
  ودوية قفرتشى نعامها * كمنى النصارى فى خفاف الارندج
  والدوأيضاموضع وهو أرض من أرض العرب ورعا قالواداوية قلبوا الوا والأولى الساكنة
  ألفالا نفتاح ما قبلها ولا يقاس عليه وقولهم ما بها دوى أى أحد ممن يسكن الدوّكمايقال ما
  بجادورىّ وطورى ابن السكيت الدواء ماء ولج به الفرس من تضمير وحنذ وماع ولجت به
  الجارية حتى تسهن وأنشدلسلامة بن جندل
  ليس بأسفى ولا أقى ولاسفل * يسقى دواء قى السكن مربوب
  يعن اللبن وانماجعله دواءلانهم كانوا يضمرون الخيل بشرب اللبن والحنذويقفون به الجارية
  وهى الققية لانها تؤثر به كما يوْثر الضيفت والصى" الاصمعىّ أرض دوية مخفف أى ذات
  أدواء هى الداهية الامى العظيم وداهى الدهر ما يصيب الناس من عظيم نوبه
  رحوادثه قال ابن السكيت دهته داهية دهياء ودهواء وهوتوكيدلها والدهى ساكفة الهاء
  النكروجودة الرأى يقال رجل داهية بين الدهى والدها ممدود والهمزة فيه منقلبة من
  اليساء لا من الواورهمادهياوان ومادهاكأى ما أصابك
  ⁦( صل الذال)⁩ ( أى أى الابل يذآها ويذؤهاذأ والمردها وساتها وذأى البقل
  يذأى ذأ والفة فى ذوى أى ذيل عن ابن السكيت (ذبى ذبيان وذبيان أيضابكسر
  لذال أبو قبيلة من قيس وهوذبيسان بن بغيض بن ريث بن غطفان بن سعدين قيس عيلات
  ⁦( ذرا)⁩ الاصمعى الذرا بالفتح كل ما استترتيه يقال أنا فى ف-ل فلان وفى ذراء أى
  فى كنفه وستره ود فشموذرا الشى بالضم أعاليه الواحدة دروة وذروة أيضا بالضم وشى أعلى
  151
  قوله نعامها فى تسنخة نعاجها
  والارندج جلد أسود قال أبو
  عبيد أملهبالفارسية رنده اه
  قاله المؤلف
