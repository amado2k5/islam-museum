text: "… تزوج الابن؛ لم تحل للأب، دخل بها أو لم يدخل، وإذا دخل الأب ؛ لم تَحلّ للابن دخل بها أو لم يدخل بها. - حدثنا حاتم بن وَرْدان عن بُرْد عن الزُّهري قال: من ملك عُقدة امرأة؛ فقد حَرُمت على …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 3771، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 3771, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
