  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 64, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
