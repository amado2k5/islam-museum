text: "… المائدة:. - واشتهر معلئه كذلك بالتوقف فيما لا يعلم تفسيره وتأويله من القرآن الكريم. عثمان بن عفان ملئضه: هو عثمان بن عفان بن أبي العاص الأموي، ذو النورين أمير المؤمنين، وفضائله في جمع الناس علىٰ المصحف الإمام مشهورة معلومة، وما …"
summary:
