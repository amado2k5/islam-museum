text: |-
  ٤٩٠
  •⁦(فصل الدين)⁩•
  و سبا).
  زوزى الرجل يزوزى وهوأن ينصب ظهره ويسرع ويقارب الخطو قال ويقال زوزيت به
  اذا طردته والزقالقرينان يقال جاءفلان زوًا اذاجاء*ووصاحبه ها الزهو البسر
  الملون يقال اذاظهرت المرة والصفرة فى النخل فقد ظهر فيسه الزهو وأهل الجازية ولون
  الزهو بالضم وقدزها النخل زهوا وأزهى أيضالغة حكاها أبوز يدولم يعرفها الاصمعى
  والزهو المنظر الحسن يقال زهى الشئ لعينيك أبوز يدزهت الشاة تزهوزهوا اذا أضرعت
  ودنا ولادها والزهو الكبر والفخر قال المشاعر
  متى ما أشأغيرزه والملوك • أجعلك رهطاعلى حيض
  وق_دزهي الرجل فه ومز هوّ أى تكبر وللعرب أحرف لا يشكلمون بها الا على سبيل المفعول
  به وان كان بعن الفاعل مثل قولهم زهى الرجل وعنى بالامر ونتجت الشاة والماقة وأشباهها
  فاذا أمرت منه قلت لتزه يا رجل وكذلك الاهر من كل فعل ثم يسمّ فاعله لانك اذا أمرت منه
  فانما تأمر فى التحصيل غير الذى تخاطبه أن يوقع به وأمر الغائبٍ لا يكون الاباللام كقولك
  ليقم زيدوفيسه لغة أخرى حكاها إبن دريد زهايزهوزهوا أى تكبرومنه قولهم ما أزهاه
  وليس هذا ن زهى لان مالم يسمّ فأعله لا يتعجب منه قال الشاعر
  لنا صاحب مواع باخلاف * كثير الخطاء قليل الصواب
  ألج لجاجامن الخنفاء • وأزهى اذا مامنى من غراب
  وقلت لاء رابى من بنى سليم ما معنى زهى الرجل قال أعجب بنفسه فقلت أتقول زها اذا
  افتخر قال أما نحن فلا تتكلم به الاصمعى زها السراب الشي يزهاه اذا رفعه بالالف لاغير
  وزهت الريح أى هبت قال عبيد
  ولنعم أيسار الجزوراذازهت * ريح الشتاء ومألف الجيران
  وزهاه وازدهاه استخفه وتهاون به قال عمروبن أب ربيعة المخزومى
  . فلماتواقفنا وسات أقبلت • وجوه زهاها الحسن أن تتقذعا
  ومنه قولهم فلان لا يزدهى بخديعة وزهت الابل زهوا اداسارت بعد الوردليلة أوا كثر
  حكاها أبو عبيد قال وزهوتها أنا يتعدى ولا يتعدّى وابل زاهسة اذا كانت لازهى الهضر
  حكاه ابن السكيت وقولهم هم زهاء مائة أى قدرمائة وحكى بعضهم الزهو الباطل والكذب
  وأنشد لاين أحر
  ولا تقوان زهو ما يخبرنا:ل لم يترك الشيب لى زهواولا الكبر
  وربما قالوازهت الريح الشجر تزهاه اذا هزته
  صل المين ) ( ا السأوالنية والطية وقال أبو عبيد الوطن وقال الخليل
  السأو بعد الهم والنزاع تقول انك لذوسأ وبعيد أى لبعيد الهم قال ذوالرمّة
  كانى من هوى خرقا مطرف • دامى الاظل بعيد السأومهيوم
  قال يعى همه الذى تنازعه نفسه اليه ويروى هذا البيت بالشين المعجمة من الشأووهو الغاية
  وساه قلب ساءه ويقال سأوته بمع فى سؤته (⁦(Üبا)⁩ السبى والسبا الاسروقد سبيت العدق
  سبيا وسباء اذا أسرته واستبيته مثله والمرأة نسبى قلب الرجل وسبيت الإرسبا« لاغير اذاحلتها
  من بلدالى بلدفهى سبية فاما اذا اشتريته التسر بها فبالهمز والسيبة المرأة نسبى وسباه الله
