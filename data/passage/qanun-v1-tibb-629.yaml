text: "… : ينفع من الماء الأصفر وبرد الكلى، وينفع أصحاب القولنج. والشربة منه مع بعض البزور الطيّبة الرائحة وماء العسل ثلاث أثولوسات. قالت الخوز : إنه يضمّ فم الرحم ضمًا شديداً حتى يمنع الأدوية المسقطة للجنين، قال : ويسهّل البلغم اللزج …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 629، يذكر التداوي بالعسل، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأطوار خلق الجنين، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 629, that mentions honey as a remedy, named diseases, the hospital and the medical craft, the stages of the embryo, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 629 کا اقتباس جس میں شہد سے علاج، بیماریوں کے نام، بیمارستان، جنین کے مراحل، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 629, que menciona la miel como remedio, nombra enfermedades, el hospital y el arte de la medicina, las etapas del embrión y el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 629, qui mentionne le miel comme remède, nomme les maladies, l'hôpital et l'art médical, les stades de l'embryon, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
