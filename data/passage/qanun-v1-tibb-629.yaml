text: "… : ينفع من الماء الأصفر وبرد الكلى، وينفع أصحاب القولنج. والشربة منه مع بعض البزور الطيّبة الرائحة وماء العسل ثلاث أثولوسات. قالت الخوز : إنه يضمّ فم الرحم ضمًا شديداً حتى يمنع الأدوية المسقطة للجنين، قال : ويسهّل البلغم اللزج …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 629، يذكر التداوي بالعسل، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأطوار خلق الجنين، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 629, that mentions honey as a remedy, named diseases, the hospital and the medical craft, the stages of the embryo, the drug; from the machine-read scan, quoted within forty words per the sources policy."
