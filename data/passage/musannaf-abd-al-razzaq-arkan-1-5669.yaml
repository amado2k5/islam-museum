text: "… المُلحف. - أَخبرنا عبد الرزاق عن معمر عن الزهري عن سالم عن ابن عمر أَنَّ رسول اللّٰه عليل مرّ برجل من الأَنصار وهو يعظ أَخاه من الحياء، فقال له رسول اللّٰه عليل : دعه فإنَّ الحياء من الإيمان. - أخبرنا …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 5669، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
