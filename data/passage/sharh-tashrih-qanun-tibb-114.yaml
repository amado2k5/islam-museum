text: "… أجزاء العضل وإنما لم يفعل ذلك لما عرف من كلامه في العضل كما قلناه. ونحن نبتدئ به في ذلك ها هنا، ونبسط الكلام في هذا وأشباهه في الكتاب الكبير الذي نعمله في الصناعة الطبية إن شاء اللّٰه تعالى. والله ولي …"
