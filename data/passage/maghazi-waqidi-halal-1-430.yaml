text: "… فراق أَهله. قالت : وكان أَحد الرجلَيْن أَلينَ قولاً من الآخر. قال أُسامة : يا رسول الله، هذا الباطل والكذب، ولا نعلم إلاَّا خيرًا، وإِنَّ بُرَيْرَة تصدُقك. وقال عَلٌّ : لم يُضيّق اللّٰه عليك، النساء كثيرٌ وقد أَحلّ اللّٰه لك …"
