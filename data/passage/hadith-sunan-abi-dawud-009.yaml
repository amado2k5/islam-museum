text: "تم، والإجماع مقدم على الاختلاف (خطابي) . (١) وأخرجه البخاري في كتاب تقصير الصلاة باب يقصر إذا خرج من موضعه، ومسلم في كتاب صلاة المسافرين باب صلاة المسافرين رقم ٦٨٥، والنسائي في الصلاة باب كيف فرضت الصلاة رقم ٤٥٦ ،٤٥٥"
