text: "… نكون أنصار اللّٰه مرتين، فقال: أما القتال فلا. - حدثنا أبو أسامة عن هشام بن عروة عن أبيه عن عبد اللّٰه بن الزبير قال : قلت لعثمان يوم الدار: اخرج فقاتلهم! فإن معك من قد نصر اللّه بأقل منه، واللّه …"
summary:
  ar: "مقطع من المصنف — ابن أبي شيبة، المجلد المصوَّر 1، ص 442، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Musannaf — Ibn Abi Shayba, scan volume 1, p. 442, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "المصنف ابن ابی شیبہ، اسکین جلد 1، ص 442 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Musannaf — Ibn Abi Shayba, volume numérisé 1, p. 442, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Musannaf - Ibn Abi Shayba, volumen escaneado 1, p. 442, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "İbn Abi Şeybe'nin eserinin 1. cildinin 442. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari karya Ibn Abi Shaybah, Jilid 1, halaman 442, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
