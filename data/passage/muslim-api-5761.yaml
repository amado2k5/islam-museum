label: { ar: "صحيح مسلم 5761 — اللدود والسعوط، المرض والمريض", en: "Sahih Muslim 5761 — medicine given by the mouth-side or the nose; illness and the sick", ur: "صحیح مسلم 5761 — لدود اور سعوط، بیماری اور بیمار", es: "Sahih Muslim 5761 — Medicina administrada por vía oral o nasal; enfermedad y enfermos", fr: "Sahih Muslim 5761 — Médecine administrée par voie orale ou nasale; maladie et malades", tr: "Sahih Muslim 5761 — Kurt ve enfiye, hastalık ve hasta", id: "Sahih Muslim 5761 — Cacing dan tembakau kunyah, penyakit dan pasien" }
text: "حَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ سُفْيَانَ، حَدَّثَنِي مُوسَى بْنُ أَبِي، عَائِشَةَ عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنْ عَائِشَةَ، قَالَتْ لَدَدْنَا رَسُولَ اللَّهِ فِي مَرَضِهِ فَأَشَارَ أَنْ لاَ تَلُدُّونِي. فَقُلْنَا كَرَاهِيَةُ الْمَرِيضِ لِلدَّوَاءِ. فَلَمَّا أَفَاقَ قَالَ \" لاَ يَبْقَى أَحَدٌ مِنْكُمْ إِلاَّ لُدَّ غَيْرُ الْعَبَّاسِ فَإِنَّهُ لَمْ يَشْهَدْكُمْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5761، يذكر اللدود والسعوط، والمرض والمريض، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5761 (The Book of Greetings), that mentions medicine given by the mouth-side or the nose, illness and the sick, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5761، جس میں لدود اور سعوط، بیماری اور بیمار، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5761 (El Libro de los Saludos), menciona la medicina administrada por vía oral o nasal, la enfermedad y los enfermos, y el medicamento. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5761 (Le Livre des Salutations), mentionne l'administration de médicaments par voie orale ou nasale, les maladies et les malades, ainsi que les médicaments. Le Répertoire des médicaments le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5761 numaralı hadis, solunum yoluyla alınan maddeler, burun damlaları, hastalık, hasta kişi ve ilaçtan bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5761, menyebutkan tentang inhalan, tetes hidung, penyakit, orang sakit, dan obat-obatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
