label: { ar: "صحيح مسلم 5761 — اللدود والسعوط، المرض والمريض", en: "Sahih Muslim 5761 — medicine given by the mouth-side or the nose; illness and the sick", ur: "صحیح مسلم 5761 — لدود اور سعوط، بیماری اور بیمار" }
text: "حَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ سُفْيَانَ، حَدَّثَنِي مُوسَى بْنُ أَبِي، عَائِشَةَ عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنْ عَائِشَةَ، قَالَتْ لَدَدْنَا رَسُولَ اللَّهِ فِي مَرَضِهِ فَأَشَارَ أَنْ لاَ تَلُدُّونِي. فَقُلْنَا كَرَاهِيَةُ الْمَرِيضِ لِلدَّوَاءِ. فَلَمَّا أَفَاقَ قَالَ \" لاَ يَبْقَى أَحَدٌ مِنْكُمْ إِلاَّ لُدَّ غَيْرُ الْعَبَّاسِ فَإِنَّهُ لَمْ يَشْهَدْكُمْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5761، يذكر اللدود والسعوط، والمرض والمريض، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5761 (The Book of Greetings), that mentions medicine given by the mouth-side or the nose, illness and the sick, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5761، جس میں لدود اور سعوط، بیماری اور بیمار، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
