text: "… القيم : الكباث بفتح الكاف والباء الموحدة المخففة والثاء المثلثة ثمر الأراك، وهو بأرض الحجاز، وطبعه حار يابس منافعه كمنافع الأراك، يقوي المعدة، ويجيد الهضم، ويجلو البلغم، وينفع من أوجاع الظهر، وكثير من الأدواء. وانظر الطب النبوي ص من تحقيقنا."
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2079، يذكر الطب والطبيب، والوجع، والبيمارستان وصناعة الطب، وأعضاء البدن، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
