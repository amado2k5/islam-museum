  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, volume 1 scanné, p. 2079, qui mentionne la médecine et le médecin, la douleur, l'hôpital et l'art médical, les organes du corps, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin resimli 1. cildinin 2079. sayfasından bir bölüm; tıp ve hekim, ağrı, hastane ve tıp mesleği, vücut organları ve hastalıktan bahsedilmektedir; metin, makineyle okunabilir resimli versiyondan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
