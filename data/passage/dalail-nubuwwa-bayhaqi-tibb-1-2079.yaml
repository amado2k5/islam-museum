text: "… القيم : الكباث بفتح الكاف والباء الموحدة المخففة والثاء المثلثة ثمر الأراك، وهو بأرض الحجاز، وطبعه حار يابس منافعه كمنافع الأراك، يقوي المعدة، ويجيد الهضم، ويجلو البلغم، وينفع من أوجاع الظهر، وكثير من الأدواء. وانظر الطب النبوي ص من تحقيقنا."
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2079، يذكر الطب والطبيب، والوجع، والبيمارستان وصناعة الطب، وأعضاء البدن، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 2079, that mentions medicine and the physician, pain, the hospital and the medical craft, the organs of the body, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2079 کا اقتباس جس میں طب اور طبیب، درد، بیمارستان، اعضائے بدن، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
