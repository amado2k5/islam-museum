text: |-
  ⁦(فصل الباء)⁩
  ٢٨٧
  خياطة الثوب قبل أن يكف وقولهم أريته لى إباضرا أى نظرابتهديق شديد ومخرجه مخرج
  رجل لابن وتامر أى ذولين وقرفعنى باصر أى ذوبصر وهو من أبصرت مئسل موت مائت
  وهو من أمت أى أريته أمر اشديدا بيصره والبتصر إصبع على الخنصر والهع البناصر
  والبصر بالضم الجانب والحرف من كل شئ وفى الحديث بصركل سيما ميرة كذا
  يريد غافاها وبصرى موضع بالشام قال الشاعر
  ولو أعطيت من بيلاد بصرى * وقنسرين من عرب وعم
  وتنسب اليها السيوف قال الشاعر و هو الحصين بن الحما
  صفائح بصرى أخلصته اقبونها • ومطردا من أسبج داود محكم
  ⁦( لعار)⁩ البطر الاشروه وشذة المرح وقد بطر بالكسر يطرواً بطره المال يقال بطرت
  عيشتك كما قالوارشدت أمرك وقد فسرناه والبطرأيضا الميرة والدهمر وأبطره أى أدهنه
  وأبطرت فلاناذر عماذا كافته أكثرو ن طوقه وبطرت الشئء أبطره بطراشة قته ومنه
  سمى البيطاروهو المبيطر قال الذابغة
  شك الفريسة بالمدرى فأنفذها • شك المبيطراذيش فى مر العضذ
  وربما قالوا يطر مثال هزبر وقال ١ ق البيطر مدرع الهمام وقال الطرماح
  بساقطها تترى بكل خيلة • كبزغ البيطر النقف رهص الكوادن
  ومعالجته البيعارة وذهب دمه بطرابا الكسر أى هدرا ظر البظرهنسة بين الاسكتين
  لم تخفض وحكذلك البظارة واحرأة بظراء ببنة البظر وبظارة الشاة هنسة فى طرف حياتها
  والبظارة أيضاهمة ناتقة فى الشفة العلماوهى الحثرمة مالم تطسل فاداطالت قليلا فارجسل
  حينمذأ بظرومنه قول على" رضى اللّٰه عنه اشريح فاتقول أنت أيها العبد الايظر وقد يظر
  الرجل بطرار بعر البعر من الا بلى بعنزلة الانسان من الناس يقدل للجمل بعير وللثاقة بعير
  وحكى عن بعض العرب صرعتنى بعيرى أى تاقى وشريت من لبن بعبرى واغمادة بال له بعسير
  اذا أجذع والجمع أبعرة وأباء روبعران والبعرة واحدة البعروالابعار وقد بع والبعير والشاة
  ع ربعرا (بعثر الفرّاء يقال بعثر الرجل تاعه وصره اذا فرقه وبدده وقاب بعض
  لى بعض ويقال بعثرت الشيء ويوثرته اذا استخرجته وكشفته وقال أيو عبيدة في قوله
  نعالى بعثرما فى القبور أثر وأخرج وقال وتول بعثرت حوضى أى ه_دمته وجعلت أسفله
  أعلاه غر يغرالفجم يغر يغورا أى سقط وهاج بالمطر يعدى بالنهم الثريا والبغرة
  الدفعة من المطار الشديد تقول منه بغرت الارض والبغر بالصريك داء وعطس قال الاصععى
  هوعطش يأخذ الابل قشرب فلاروى وتمرض عنه فقوت قال الشاءر
  فقات ماهوالا الشام نركبه • كانما الموت فى أجناده البغر
  تقول منه بغر بالكسر وعبر رجل من قريس فقيل له مات أبول بشماءماتت أمك بغرا ويقال
  تفرقت إبله شخر بغراذ اتفترّقت فى كل وجه ⁦(بغثر)⁩ يقال زكت القوم في يغثرة أى فى
  هيج واختلاط وتبغثرت نفسه عنت يقال أصبح ذلان متبغثرا أى متمقسا وربماجاءت بالعين
  غير معجمة ولا أرويه عن أحد قر البقرامم جنس والبقرة تقع على الذكر
  باتت تشق أدعج الظلام اه
