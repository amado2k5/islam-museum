label: { ar: "مسلم 1401 — فمن رغب عن سنتي فليس مني", en: "Muslim 1401 — Whoever turns away from my way is not of me" }
text: "قال أنس: سأل نفر من أصحاب النبي أزواجه عن عمله في السر فقال بعضهم لا أتزوج النساء وقال بعضهم لا آكل اللحم وقال بعضهم لا أنام على فراش، فقال النبي: ما بال أقوام قالوا كذا وكذا، لكني أصلي وأنام وأصوم وأفطر وأتزوج النساء، فمن رغب عن سنتي فليس مني"
summary:
  ar: "رواية أنس بن مالك في كتاب النكاح من صحيح مسلم؛ الحديث يرد على ظاهرة رهبانية القول لدى بعض الصحابة ويرسم خط السنة العملي؛ يليه رد النبي التبتل عن عثمان بن مظعون."
