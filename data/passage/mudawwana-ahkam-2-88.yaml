  tr: "Büyük Derleme, Resimli Cilt 2, sayfa 88'den bir alıntı; zorunlu görevleri ve sorumlu kişiden beklenenleri belirtiyor; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu görevler, itaat eylemleri, tavsiye edilen eylemler, hoş karşılanmayan eylemler, yasaklanmış eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kompendium Agung, Jilid Bergambar 2, halaman 88, yang menyebutkan kewajiban-kewajiban wajib dan apa yang dituntut dari orang yang bertanggung jawab; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk kewajiban-kewajiban wajib, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa-dosa kecil."
