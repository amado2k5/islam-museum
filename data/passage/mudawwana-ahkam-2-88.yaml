text: "… قال مالك نعم يحج من مكة ويجزئه عن حجة الاسلام. موقات ويكون متمتما ان كان قد اعتمر فى أشهر الحج قال نعم قلت به أرأيت ان قرن الحج والعمرة يريد بالعمرة عن المشى الذي وجب عليه وبالحج حجة الفريضة أيجزئه …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 2، ص 88، يرد فيه ذكر الفريضة والفرائض، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 2, p. 88, whose wording mentions the obligation (farida), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 2، ص 88 کا اقتباس جس میں فریضہ اور فرائض، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 2, p. 88, dont le texte mentionne l'obligation (farida), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
