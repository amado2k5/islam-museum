text: "… لي فيما بلغني يقول مُخَيْريق خيرُ يهود وقبضَ رسولُ اللّٰه وَلف أموالَه، فعامَّةُ صدقات رسول الله ول في ب المدينة منها. - حدَّثنا عمر بن محمد بن جعفر قال ثنا إبراهيم بن السندي قال ثنا النضر بن سلمة قال ثنا …"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، المجلد المصوَّر 1، ص 79، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, scan volume 1, p. 79, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "دلائل النبوۃ، ابو نعیم، اسکین جلد 1، ص 79 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de Abu Nu'aym, volumen 1, pág. 79, que menciona el lecho de muerte y las últimas horas, y lo que dejó tras de sí: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Un extrait du Dala'il al-Nubuwwa d'Abu Nu'aym (tome 1, p. 79) évoque un lit de mort et les dernières heures du défunt, ainsi que son héritage. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "Ebu Nuaym'ın \"Peygamberliğin Alametleri\" adlı eserinin 1. cildinin 79. sayfasından, ölüm anını, merhumun vefatını, geride bıraktığı mal varlığını ve mirasını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Abu Nu'aym, \"Tanda-Tanda Kenabian,\" Jilid 1, halaman 79, yang menyebutkan saat kematian dan wafatnya almarhum, serta harta dan warisan yang ditinggalkannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
