text: |-
  ٢٦
  ⁦(نوا)⁩
  ويقال ان لى عنك لمنتسأ أى منتأى وسعة ( شأ أنتأه القه خلقه والاسم النشأة
  والنشاءة بالمد عن أبى عمرو بن العلاء وأنشأ يفعل كذا أى اتدأ وفلان نشى الاحاديث
  أى يضعها والناشى الحدث الذى قدجاوزحد الصغر والجارية ناشئ أيضاوبمع النشآمثل
  طالب وطلب وكذلك النش.مثل صاحب وصحب والفسءأيضا ول ما ينشأ من السحاب
  ونشأت فى بى فلان نشأونشوءا اذا شبيت فيهم ونشئ وأنشئ عمنى وقرى أو من ينشا
  فى الحلية وناشئة الليل أوّل ساعاته وبقال ما ينشأفى الليل من الطاعات ونشات السحاية
  ارتفعت وأنشأها اللّٰه ابن السكيت الفشيئة أول ما يعمل من الحوض يقال هوبادى
  النشيئة اذاجف عنه الماء وظهرت أرضه قال الشاءر
  هرقناه فى يادى التشيئة داثر * قديم بعهد الماء بقع نصائبه
  وقال أبو عيبد هو جر يجعل أسفل الحوض وقوله تعالى وله الجوار المفشات فى البحر
  كالاعلام قال مجاه دهى السفن التى رفع قلعها قال واذا لم يرفع قلعها فليست بمنشات
  ابن السكيت الذئب بستنشئ الرخ بالهمز قال واغاهو من نشيت الريج غنبي
  مهمورأى شمعتها نصأ الكسائى نصأت الشى نصأرفعته وأبوعمر ومثلهوهى لغة فى
  نصصت أبوز يدنصأت الناقة زجرتها ( ت أ لنفأة واحدة النفأ وهى قطع من الثبت
  متفرّقة من عظم الكلاً مثال صبرة وصبر ⁦(نكأ)⁩ نكأت القرحة انكوهانكاً اذا
  قشر تها وقال متمم بن نويرة ولا تنكأى قرح الفواد فيجعا وقولهم هنئت ولا تنكاً أى
  هنأك اللّٰه عائلت ولا أصابك يوجع ويقال ولا تنكد مشل أراق وهراق ⁦(نها)⁩ نهى
  اللحم بنهأنهأونها "ونهأة ونهوءة اذ ا لم ينضح وفى المثل ما أبالى ما تهمى من ضبك ويقسال أيصا
  نهؤاللحم ذهو تهى على فعيل وأنهأته أنالإنهاء اذا لم تنضجه فهو منهاً ⁦(نوأ)⁩ نا ينوء
  نوانهض بجهدومشقة ونامسقط وهو من الاضداد ويقال ناء بالجمل اذا نهض به مثقلا
  وناءبه الال اذا أنقسله والمرأة تنوه بها عجيزتها أى تشتلها وهى تنوء بعجيزتها أى تنهض بها
  مثقلة وأناءه الحسل مثل أناعه أى أثقله وأماله كمايقال ذهب به وأذهبه بعسنى وقوله
  تعالى ما إنّ مفاتحه لتنو بالعصبة قال الفرّاء أى لتنىء العصبة تثقلها قال الشاعر
  انى وجدّك ما أقضى الغريم وان * حان القضاء ومارقت له كبدى
  الاعصا أرزن طارت برايتها * تنوضربتها بالكف والعضد
  أى تنقل ضريتها الكف والعضد والنوسة وط نجم من المنازل فى المغرب مع الفجر وطلوع
  رقيده من المشرق يقابله من ساعته فى كل ايلة الى ثلاثه عشر يوما وهكذا كل نحسم منها الى
  انقضاء السنة ما خلا الجيهة فان لها أربعة عشريوما قال أبو عسيدولم نسمع فى النومانه
  السقوط الافى هذا الموضع وكانت العرب تضيف الامطار وارياح والحرّ والبرد الى الساقط
  منها وقال الاصمعى" الى الطالع منها فى سلطانه فتقول مطرناننو، كذا والجممع أنوا« ونوآن
  أيضامثل عبد وعيدان وبطن ويطنان قال حسات بن بابت
  ويثرب تعلم أنابها * اذا ق القطرنوآنها
  وناوأت الرجل مناوأة ونوا عاديته يقال اذانا وأت الرجال قاص-برور بالم يه-.زوأصله
  الهمز
