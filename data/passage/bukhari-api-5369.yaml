label: { ar: "صحيح البخاري 5369 — الأب والأبوة", en: "Sahih al-Bukhari 5369 — the father and fatherhood", ur: "صحیح بخاری 5369 — باپ اور والدیت", es: "Sahih al-Bukhari 5369 — El padre y la paternidad", fr: "Sahih al-Bukhari 5369 — Le père et la paternité" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا وُهَيْبٌ، أَخْبَرَنَا هِشَامٌ، عَنْ أَبِيهِ، عَنْ زَيْنَبَ ابْنَةِ أَبِي سَلَمَةَ، عَنْ أُمِّ سَلَمَةَ، قُلْتُ يَا رَسُولَ اللَّهِ هَلْ لِي مِنْ أَجْرٍ فِي بَنِي أَبِي سَلَمَةَ أَنْ أُنْفِقَ عَلَيْهِمْ، وَلَسْتُ بِتَارِكَتِهِمْ هَكَذَا وَهَكَذَا، إِنَّمَا هُمْ بَنِيَّ. قَالَ \" نَعَمْ لَكِ أَجْرُ مَا أَنْفَقْتِ عَلَيْهِمْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5369، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5369 (Supporting the Family), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5369، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5369 (Apoyo a la Familia), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5369 (Soutenir la famille), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
