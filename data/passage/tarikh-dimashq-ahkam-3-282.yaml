text: "… الحديث بدمشق من الوليد بن مسلم، وبقية بن الوليد، و إسماعيل بن عياش وجماعة. وروي عنه أبو بكر الباغندي وجماعة وروى بسنده عن أنس أن رسول اللّٰه قال : طلب العلم فريضة على كل مسلم قال أبو محمد بن أبي …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 282، يرد فيه ذكر الفريضة والفرائض، وما وجب على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 3, p. 282, whose wording mentions the obligation (farida), a duty laid on every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 3، ص 282 کا اقتباس جس میں فریضہ اور فرائض، جو ہر مسلمان پر لازم ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de Damascus de Ibn 'Asakir, volume numérisé 3, p. 282, dont le texte mentionne l'obligation (farida), un devoir imposé à chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de Damascus de Ibn 'Asakir, volumen digitalizado 3, p. 282, cuyo texto menciona la obligación (farida), un deber impuesto a cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Asakir'in Şam Tarihi, 3. cilt, 282. sayfasından bir alıntı, farz olan görevleri ve her Müslümandan beklenenleri ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar hakkında bilgiler içermektedir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibnu Asakir, Jilid 3, halaman 282, menyebutkan kewajiban-kewajiban dan apa yang dituntut dari setiap Muslim. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini mencakup informasi tentang kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
