label: { ar: "صحيح البخاري 4658 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4658 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4658 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4658 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 4658 — mentions de nations, religions et peuples non musulmans", tr: "Sahih el-Buhari 4658 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih al-Bukhari 4658 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا يَحْيَى، حَدَّثَنَا إِسْمَاعِيلُ، حَدَّثَنَا زَيْدُ بْنُ وَهْبٍ، قَالَ كُنَّا عِنْدَ حُذَيْفَةَ فَقَالَ مَا بَقِيَ مِنْ أَصْحَابِ هَذِهِ الآيَةِ إِلاَّ ثَلاَثَةٌ، وَلاَ مِنَ الْمُنَافِقِينَ إِلاَّ أَرْبَعَةٌ. فَقَالَ أَعْرَابِيٌّ إِنَّكُمْ أَصْحَابَ مُحَمَّدٍ تُخْبِرُونَا فَلاَ نَدْرِي فَمَا بَالُ هَؤُلاَءِ الَّذِينَ يَبْقُرُونَ بُيُوتَنَا وَيَسْرِقُونَ أَعْلاَقَنَا. قَالَ أُولَئِكَ الْفُسَّاقُ، أَجَلْ لَمْ يَبْقَ مِنْهُمْ إِلاَّ أَرْبَعَةٌ. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4658، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4658 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4658، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4658 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 4658 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih el-Buhari'de 4658 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4658, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
