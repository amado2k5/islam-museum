text: |-
  *⁦(وله)⁩
  ٤٣٥
  الفرق بين فعال وفعل وانمازادوا النون من بين سائر الحروف لان فى الكامة نونا ( وه
  ناه الشئء توه ارتفع فى ونائه وتوهبه تنويها اذا رفعته وتوهت باسمه اذا رفعت ذكر
  وناهت نفسى أى قويت وناه النبات ارتفع
  صل الواد ه) يقال فلان لا يوبه له ولا يوبه به أى لا يبالى به ابن السكيت
  ما وبهت له وما وبهت له أى مافطنت له وأنت تيبه بكسر التاء مثل تيجل أى تبالى جه
  الوجه معروف والجمع الوجوه وحكى الفرائحىّ الوجوه وحى الاجوه قال ابن السكيت
  ويفعلون ذلك كثرانى الواو اذا انضمت والوجه والجهة بمعنى والهاءعوض من الواو
  ويقال هذاوجه الرأى أى هو الرأى نفسه والاسم الوجهة والوجهة بكسر الواووضمها
  والواوتثيت فى الامهاء كما قالوا ولدة وانما لاتجتمع مع الهاء فى المصادر والمواجهة المقابلة
  ويقال قعدت وجاهك ووجاهك أى قبالتك واتجه له رأى أى سنح وهوافتعل صارت الواو
  ياء لكسرة ما قبلها وأبدات منها التاء وأدخمت ثم بنى عليهولك قعدت نجاهك وتجاهك أى
  فلقاءكْ وتجهت اليك أتجه أى نوجهت لان أصمل التاءفيهماواو ووجهته فى حاجة
  ووجهت وجهى للّه سبهانه وتوجهت فحوك واليك وتوجه الشيخ اذا ولى وكبر وفى المثل
  أحق ما يتوجه أى لا يحسن أن يأتى الغائط وشئموجه اذا جعل على جهة واحدة
  لا يختلف وقدوجه الرجل بالضم أى صاروجيها أى ذاجاه وقدر وأوجهه اللّٰه أى صيره
  وجيها وأوجهته أى صادفته وجيها قال المساور بن هندين قيس بن زهير
  انّ الغوانى بعدما أوجهننى • أعرض عت قلن شيخ أءور
  ووجوه البلد أشرافه والوجبهة خرزة ويقال لالولداذا خرجت بداه من الرحم أوّلا وجيه واذا
  خرجت رجلاه أولايتن والوجيه اسم فرس قاله الاصمعى أبو عبيد التوجيه هو المرف
  الذى بين ألع التأسيس وبين القافيسة عن الخليل قال ولك أن تغيره بأى حوف شؤت كقول
  امرئ القيسر أنى أفرمع قوله صبرد قوله واليوم قرولذلك قيل لدوجيه وغيره يقول التوج.
  اسم حركاته اذا كان الروى مقيدا وآمانفس الحرف فيسمى الدخيل ⁦(وده )⁩ استودهت
  الابل واستيدهت اجتمعت وانساقت واستوده الخصم واستيده أى انفاد وغلب قال الخبل
  وردّصدور الجيل حتى تنهنهوا * الى ذى النهى واستيدهو اللمحلم
  يقول أاء والمن كان يأمرهم بالحلم ويروى واستيهوا من القاه وه والطاعة .⁦( ره)⁩.
  الوره الحق ويقال انفرق ورجل أوره وامرأة ورهاء وقدورهت توره وقال يصف طعنة
  كجيب الدفنس الورها • . ريعت وهى تستقلى
  وريح ورهاء فى هبو بها خرق وعجرفة فه الوافه قيم البيعة بلغة أهل الميرة وفى
  الحديث لايغير وافه عن وفهيته ولا قسيس عن قسيسيته ⁦( وقه)⁩. الوقه الطاعة مقلوب
  من القاه وقد وقهت وأيقهت واستيقهت أى اطعت ويروى واستيقهو اللمحلم ⁦(ولد)⁩
  الوله ذهاب العقل والتحير من شدّة الوجد ورجل واله وامرأة واله ووالهة قال الاعشى
  فأقبلت والهاشكلى على عمل • كل دهاها وكل عندها اجتمعا
  وقدوله يوله ولها وولها نا وتوّله واتله وه وافتعل فأدغم قال الشاعر• واتله الغيوره والتوليه
