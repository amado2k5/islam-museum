label: { ar: "سنن ابن ماجه 3529 — مرض النبي، الوجع", en: "Sunan Ibn Majah 3529 — the Prophet's illness; pain", ur: "سنن ابن ماجہ 3529 — نبی کی بیماری، درد", es: "Sunan Ibn Majah 3529 — La enfermedad del Profeta; dolor", fr: "Sunan Ibn Majah 3529 — La maladie du Prophète; la douleur", tr: "Sunan İbn Majah 3529 — Peygamberin hastalığı, acısı", id: "Sunan Ibn Majah 3529 — Penyakit dan penderitaan Nabi" }
text: "حَدَّثَنَا سَهْلُ بْنُ أَبِي سَهْلٍ، قَالَ حَدَّثَنَا مَعْنُ بْنُ عِيسَى، ح وَحَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، حَدَّثَنَا بِشْرُ بْنُ عُمَرَ، قَالاَ حَدَّثَنَا مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، أَنَّ النَّبِيَّ ـ كَانَ إِذَا اشْتَكَى يَقْرَأُ عَلَى نَفْسِهِ الْمُعَوِّذَاتِ وَيَنْفِثُ فَلَمَّا اشْتَدَّ وَجَعُهُ كُنْتُ أَقْرَأُ عَلَيْهِ وَأَمْسَحُ بِيَدِهِ رَجَاءَ بَرَكَتِهَا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3529، يذكر مرض النبي، والوجع، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3529 (Chapters on Medicine), that mentions the Prophet's illness, pain, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3529، جس میں نبی کی بیماری، درد، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3529 (Capítulos sobre Medicina), menciona la enfermedad y el dolor del Profeta, así como una queja sobre una dolencia. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un récit du Sunan Ibn Majah, n° 3529 (Chapitres sur la médecine), mentionne la maladie et les douleurs du Prophète, ainsi qu'une plainte relative à un malaise. Le navigateur de textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3529 numaralı hadiste, Peygamberimizin hastalığı, ağrısı ve şikayetlerinden bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3529, menyebutkan penyakit, rasa sakit, dan keluhan Nabi. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan perawatan."
