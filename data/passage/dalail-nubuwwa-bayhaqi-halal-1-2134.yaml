text: "… الفتح وهو بمكة. إن اللّه ورسوله حَرَّمَ بيع الخَمْرِ، والميتة، والخنزير والأصنام، فقيل : يا رسول اللّٰه ارأيت شحومَ الميتة فانه يُطلى به السفن، ويدهن بها الجلود، ويستصبح بها الناس، فقال : لا، هو حرامٌ، ثم قال : رسول اللّٰه …"
