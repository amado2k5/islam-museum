label:
  ar: "النسائي 2211 — الصوم لي وأنا أجزي به"
  en: "Nasa'i 2211 — Fasting is Mine, and I reward it"
  ur: "نسائی 2211 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
  es: "Nasa'i 2211 — El ayuno es mío, y yo lo recompenso."
  fr: "Nasa'i 2211 — Le jeûne m'appartient et je le récompense."
  tr: "Kadınlara Ait Hadis 2211 — Oruç Benim içindir ve Ben onun karşılığını vereceğim."
  id: "Hadits Wanita 2211 — Puasa adalah untuk-Ku dan Aku akan memberi pahala kepadanya"
text: "إن الله تبارك وتعالى يقول الصوم لي وأنا أجزي به وللصائم فرحتان حين يفطر وحين يلقى ربه والذي نفسي بيده لخلوف فم الصائم أطيب عند الله من ريح المسك ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 2211: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 2211: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 2211: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 2211: El ayuno es mío, y yo lo recompenso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan an-Nasa'i, n° 2211: « Le jeûne M’appartient et Je le récompense. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 2211: \"Puasa itu untuk-Ku, dan Aku akan memberi pahala kepadanya.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
