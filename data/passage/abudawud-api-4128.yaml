text: "أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَتَبَ إِلَى جُهَيْنَةَ قَبْلَ مَوْتِهِ بِشَهْرٍ أَنْ لاَ يَنْتَفِعُوا مِنَ الْمَيْتَةِ بِإِهَابٍ وَلاَ عَصَبٍ ‏.‏ قَالَ أَبُو دَاوُدَ فَإِذَا دُبِغَ لاَ يُقَالُ لَهُ إِهَابٌ إِنَّمَا يُسَمَّى شَنًّا وَقِرْبَةً قَالَ النَّضْرُ بْنُ شُمَيْلٍ يُسَمَّى إِهَابًا مَا لَمْ يُدْبَغْ ‏.‏"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
