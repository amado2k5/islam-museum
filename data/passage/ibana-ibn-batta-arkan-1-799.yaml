text: "… بن عمرو بن البختري الرزاز، قال: حدثنا الحسن بن سلام السواق، قال: حدثنا عبيدالله بن موسى، قال: حدثنا داود بن يزيد، عن عامر، عن جرير، قال: سمعت النبي عليفي يقول: بني الإسلام على خمس: شهادة أن لا إله إلا اللّٰه …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 799، يذكر ما بُني عليه الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 799, that mentions what Islam is built on; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 799 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe, de Ibn Batta, volumen 1, pág. 799, que menciona los fundamentos del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 1, page 799, qui expose les fondements de l'islam; extrait numérisé, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1), sayfa 799'dan, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 1 Bergambar, hlm. 799, yang menyebutkan dasar-dasar Islam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
