text: "… بن عمرو بن البختري الرزاز، قال: حدثنا الحسن بن سلام السواق، قال: حدثنا عبيدالله بن موسى، قال: حدثنا داود بن يزيد، عن عامر، عن جرير، قال: سمعت النبي عليفي يقول: بني الإسلام على خمس: شهادة أن لا إله إلا اللّٰه …"
summary:
