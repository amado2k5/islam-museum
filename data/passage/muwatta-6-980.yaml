label: { ar: "الموطأ 980 — ابن عمر: من اعتمر في أشهر الحج ثم أقام بمكة حتى يدركه الحج فهو متمتع، عليه ما استيسر من الهدي، فإن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع", en: "Muwatta 980" }
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أنه كان يقول: من اعتمر في أشهر الحج في شوال أو ذي القعدة أو ذي الحجة قبل الحج، ثم أقام بمكة حتى يدركه الحج، فهو متمتع إن حج، وعليه ما استيسر من الهدي، فإن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (519) والشافعي. {cite:muwatta-maruf-1997 p.462} {cite:muwatta-maruf-1997 p.463}"
