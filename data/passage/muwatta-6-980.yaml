label: { ar: "الموطأ 980 — ابن عمر: من اعتمر في أشهر الحج ثم أقام بمكة حتى يدركه الحج فهو متمتع، عليه ما استيسر من الهدي، فإن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع", en: "Muwatta 980", es: "Muwatta 980", fr: "Muwatta 980", ur: "موطا 980", tr: "İbn Ömer: El-Muvatta 980: Hac aylarında Umre yapan ve Hac vakti gelene kadar Mekke'de kalan kimse Tamattu' hacı sayılır. Kurbanlık hayvan olarak elinde ne varsa onu sunmalıdır. Eğer bulamazsa, Hac sırasında üç gün ve dönüşünde yedi gün oruç tutmalıdır.", id: "Al-Muwatta 980 — Ibn Umar: Barang siapa yang melaksanakan Umrah pada bulan-bulan Haji dan kemudian tinggal di Mekah hingga Haji tiba, maka ia dianggap sebagai jamaah Tamattu’. Ia wajib mempersembahkan hewan kurban apa pun yang tersedia. Jika ia tidak dapat menemukannya, ia wajib berpuasa tiga hari selama Haji dan tujuh hari setelah kembali." }
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أنه كان يقول: من اعتمر في أشهر الحج في شوال أو ذي القعدة أو ذي الحجة قبل الحج، ثم أقام بمكة حتى يدركه الحج، فهو متمتع إن حج، وعليه ما استيسر من الهدي، فإن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (519) والشافعي. {cite:muwatta-maruf-1997 p.462} {cite:muwatta-maruf-1997 p.463}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den rivayet ederek şöyle buyurmuştur: Hac aylarında, Şevval, Zilhicce veya Hac'dan önce Zilhicce aylarında Umre yapan ve Hac vakti gelinceye kadar Mekke'de kalan kimse, Hac yaparsa Mutamatti' (Tamattu' Hac yapan) sayılır. Gücü yettiği kadar kurban kesmelidir. Eğer kurban bulamazsa, Hac sırasında üç gün ve dönüşte yedi gün oruç tutmalıdır. Araştırmacı, Ebu Musab, Suveyd (519) ve Şafiî'nin bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.462} {cite:muwatta-maruf-1997 s.463}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Dinar, yang juga meriwayatkannya dari Abdullah ibn Umar, yang berkata: Barang siapa yang melaksanakan Umrah pada bulan-bulan Haji, yaitu bulan Syawal, Dzul Qi'dah, atau Dzul Hijjah sebelum Haji, dan kemudian tinggal di Mekah hingga tiba waktu Haji, maka ia dianggap sebagai Mutamatti' (orang yang melaksanakan Haji Tamattu') jika ia melaksanakan Haji. Ia wajib mempersembahkan hewan kurban apa pun yang mampu ia beli. Jika ia tidak dapat menemukan hewan kurban, ia wajib berpuasa tiga hari selama Haji dan tujuh hari setelah kembali. Peneliti menyebutkan bahwa Abu Mus'ab, Suwaid (519), dan al-Shafi'i meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.462} {cite:muwatta-maruf-1997 p.463}"
