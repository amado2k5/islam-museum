text: "… حرم الله واكل الربا واكل مال اليقيم والتولى يوم واستحلال الييت الحرام قبلتكم احياء واموانا عمير إن ودقة احد المؤلفة قلوبهم لم يبلغه رسول اللّه مائة من الابل من غنائم حنان لا هو ولا قيس بن فرمة ولا عباس إن …"
