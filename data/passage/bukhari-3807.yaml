label: { ar: "البخاري 3807 — خير دور الأنصار", en: "Bukhari 3807 — The best houses of the Ansar" }
text: "قال رسول الله: «خير دور الأنصار بنو النجار، ثم بنو عبد الأشهل، ثم بنو الحارث بن الخزرج، ثم بنو ساعدة، وفي كل دور الأنصار خير». فقال سعد بن عبادة وكان ذا قدم في الإسلام: أرى رسول الله فضل علينا. فقيل له: قد فضلكم على ناس كثير"
summary:
  ar: "في كتاب مناقب الأنصار؛ رواية أنس بن مالك عن أبي أسيد في ترتيب بيوتات الأنصار الأربع أفضلية — النجار فعبد الأشهل فالحارث بن الخزرج فساعدة — مع عموم الخير لكل دورهم، وتلقي سعد بن عبادة سيد الخزرج لها."
