label: { ar: "البخاري 3807 — خير دور الأنصار", en: "Bukhari 3807 — The best houses of the Ansar", es: "Bukhari 3807 — Las mejores casas de los Ansar", fr: "Bukhari 3807 — Les meilleures maisons des Ansar", ur: "بخاری 3807 - انصار کے بہترین گھر", tr: "Buhari 3807 — Ensar'ın en iyi rolü", id: "Al-Bukhari 3807 — Peran terbaik kaum Ansar" }
text: "قال رسول الله: «خير دور الأنصار بنو النجار، ثم بنو عبد الأشهل، ثم بنو الحارث بن الخزرج، ثم بنو ساعدة، وفي كل دور الأنصار خير». فقال سعد بن عبادة وكان ذا قدم في الإسلام: أرى رسول الله فضل علينا. فقيل له: قد فضلكم على ناس كثير"
summary:
  ar: "في كتاب مناقب الأنصار؛ رواية أنس بن مالك عن أبي أسيد في ترتيب بيوتات الأنصار الأربع أفضلية — النجار فعبد الأشهل فالحارث بن الخزرج فساعدة — مع عموم الخير لكل دورهم، وتلقي سعد بن عبادة سيد الخزرج لها."
  tr: "Ensarın faziletleri kitabında Enes bin Malik, Ebu Usayd'dan rivayetle, dört Ensar kabilesinin üstünlük sırasına göre şu şekilde sıralandığını nakletmiştir: Necarîr, sonra Ebû Eşhal, sonra Haris bin Hazrec, sonra Sa'ade. Tüm kabilelerin genel iyilikleri de belirtilmiş ve Hazrec kabilesinin lideri Sa'd bin Ubadade bu sıralamayı almıştır."
  id: "Dalam kitab tentang keutamaan kaum Ansar, Anas bin Malik meriwayatkan dari Abu Usaid urutan empat keluarga Ansar berdasarkan keunggulannya — Al-Najjar, kemudian Abd Al-Ashhal, kemudian Al-Harith bin Al-Khazraj, kemudian Sa’adah — dengan kebaikan umum dari semua keluarga mereka, dan Sa’d bin Ubadah, pemimpin Khazraj, menerimanya."
