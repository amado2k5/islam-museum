text: "… حيث يصلي المكتوبة التطوع يتيمم ثم يمر الماء هل يتوضأ ؟ وهل يتيمم للتطوع الرجل يسهو فيخلط المكتوبة بالتطوع السهو في سجدتي السهو في التطوع صلاة التطوع على الدابة وجوب الوتر هل شيء من التطوع واجب الرجل ينتهي إلى القوم …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 6411، يرد فيه ذكر الواجب، والوجوب، والتطوع، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 6411, whose wording mentions the obligatory (wajib), obligation (wujub), the voluntary act (tatawwu'), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 6411 کا اقتباس جس میں واجب، وجوب، تطوع ⁦(نفلی عمل)⁩، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de 'Abd al-Razzaq, volume numérisé 1, p. 6411, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), l'acte volontaire (tatawwu'), la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Musannaf de 'Abd al-Razzaq, volumen digitalizado 1, p. 6411, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), el acto voluntario (tatawwu'), la oración prescrita; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Musannaf Abd al-Razzaq, Resimli Cilt 1, s. 6411'den, farz olan ameller, görevler, gönüllü ameller ve farz namazlardan bahseden bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 6411, yang menyebutkan amalan wajib, kewajiban, amalan sunnah, dan salat yang diwajibkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
