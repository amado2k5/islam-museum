label: { ar: "صحيح البخاري 6863 — الحرام", en: "Sahih al-Bukhari 6863 — the unlawful", ur: "صحیح بخاری 6863 — حرام" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ يَعْقُوبَ، حَدَّثَنَا إِسْحَاقُ، سَمِعْتُ أَبِي يُحَدِّثُ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ إِنَّ مِنْ وَرْطَاتِ الأُمُورِ الَّتِي لاَ مَخْرَجَ لِمَنْ أَوْقَعَ نَفْسَهُ فِيهَا، سَفْكَ الدَّمِ الْحَرَامِ بِغَيْرِ حِلِّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6863، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6863 (Blood Money (Ad-Diyat)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6863، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
