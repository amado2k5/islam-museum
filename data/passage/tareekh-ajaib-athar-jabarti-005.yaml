text: "د ذلك وان ابا ١٢ ذلك ولم يأت فنحن ذاهبون اليه. فقالوا له: اكتب له جوابا. فقال: لا اكتب جوابا لانه لم يرسل معكم كتابا ولا جوابا. وكما ارسلكم بمجرد الكلام فعودوا اليه كذلك. فلما أصبح الصباح وقت انصرافهم فامر"
