text: "… ظلا واذ اظمى لم يجد ما يتروى به وانما سفر الدنيا منقطع وأكيس الناس من قام يتجهز لسفر لا ينقطع - يزيد بن سمرة انه سمع عطاء الحراسانى يقول مجالس الذكر هى مجالس الحلال والحرام - الاوزاعى قال حدثنى عطاء …"
