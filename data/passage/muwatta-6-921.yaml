label: { ar: "الموطأ 921 — أعرابي جاء إلى النبي بحنين وعليه قميص به أثر صفرة يقول: أهللت بعمرة، فقال: انزع قميصك، واغسل هذه الصفرة عنك، وافعل في عمرتك ما تفعل في حجك", en: "Muwatta 921", es: "Muwatta 921", fr: "Muwatta 921", ur: "موطا 921", tr: "El-Muvatta 921 — Huneyn'de Peygamberimize sarı lekeli bir gömlek giymiş bir bedevi geldi ve şöyle dedi: Umre için ihrama girdim. Peygamberimiz şöyle buyurdu: Gömleğini çıkar, bu sarı lekeyi yıka ve Umre'de Hac'ta yaptığın gibi yap.", id: "Al-Muwatta 921 — Seorang Badui datang kepada Nabi di Hunayn mengenakan baju yang bernoda kuning, seraya berkata: Aku telah memasuki keadaan ihram untuk Umrah. Beliau bersabda: Lepaskan bajumu, bersihkan noda kuning ini, dan lakukanlah dalam Umrahmu apa yang kamu lakukan dalam Hajimu." }
text: "انزع قميصك، واغسل هذه الصفرة عنك، وافعل في عمرتك ما تفعل في حجك"
summary:
  ar: "يرويه مالك عن حميد بن قيس عن عطاء بن أبي رباح، أن أعرابياً جاء إلى رسول الله وهو بحنين، وعليه قميص وبه أثر صفرة، فقال: يا رسول الله إني أهللت بعمرة فكيف تأمرني أن أصنع؟ فقال: انزع قميصك، واغسل هذه الصفرة عنك، وافعل في عمرتك ما تفعل في حجك. ويذكر المحقق أن ابن عبد البر قال إن الحديث مرسل عند جميع رواة الموطأ، لكنه يتصل من غير رواية مالك من طرق صحيحة عن عطاء، وأن الصواب فيه أنه عن صفوان بن يعلى عن أبيه يعلى بن أمية عن النبي، ويذكر المحقق أن الشيخين وأصحاب السنن رووه بذلك. {cite:muwatta-maruf-1997 p.442}"
  tr: "Malik, Humaid ibn Kays'tan, o da Ata ibn Ebu Rabe'den rivayet ettiğine göre, Huneyn'de iken, üzerinde sarı lekeler bulunan bir gömlek giymiş bir bedevi Allah Resulü'ne geldi. Bedevi, \"Ey Allah Resulü, Umre için ihrama girdim, bana ne yapmamı emredersiniz?\" dedi. Peygamberimiz, \"Gömleğini çıkar, bu sarı lekeyi yıka ve Umre'de Hac'ta yaptığın gibi yap\" dedi. Editör, İbn Abdül-Barr'ın, hadisin Muvatta'nın tüm ravilerine göre mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu, ancak Malik'in rivayetinden başka, Ata'dan gelen sağlam rivayet zincirleriyle bağlantılı olduğunu söylediğini belirtiyor. Doğru rivayet ise Safvan ibn Ya'la'dan, o da babası Ya'la ibn Umayya'dan, o da Peygamberimizden rivayet edilmiştir. Editör, iki şeyhin (Buhari ve Müslim) ve Sünen yazarlarının bunu bu şekilde rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.442}"
  id: "Malik meriwayatkannya dari Humaid ibn Qais, dari Ata ibn Abi Rabah, bahwa seorang Badui datang kepada Rasulullah ketika beliau berada di Hunayn, mengenakan baju yang terdapat noda kuning. Ia berkata, “Wahai Rasulullah, aku telah memasuki keadaan ihram untuk Umrah, jadi apa yang engkau perintahkan kepadaku?” Beliau menjawab, “Lepaskan bajumu, bersihkan noda kuning ini, dan lakukanlah dalam Umrahmu apa yang kamu lakukan dalam Hajimu.” Editor menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) menurut semua perawi al-Muwatta, tetapi hadits ini terhubung melalui riwayat selain Malik, melalui rantai periwayatan yang sahih dari Ata. Versi yang benar adalah bahwa hadits ini dari Safwan ibn Ya’la, dari ayahnya Ya’la ibn Umayya, dari Nabi. Editor menyebutkan bahwa kedua Syekh (al-Bukhari dan Muslim) dan para penulis Sunan meriwayatkan hadits ini dengan cara tersebut. {cite:muwatta-maruf-1997 p.442}"
