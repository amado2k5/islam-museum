label: { ar: "الموطأ 921 — أعرابي جاء إلى النبي بحنين وعليه قميص به أثر صفرة يقول: أهللت بعمرة، فقال: انزع قميصك، واغسل هذه الصفرة عنك، وافعل في عمرتك ما تفعل في حجك", en: "Muwatta 921" }
text: "انزع قميصك، واغسل هذه الصفرة عنك، وافعل في عمرتك ما تفعل في حجك"
summary:
  ar: "يرويه مالك عن حميد بن قيس عن عطاء بن أبي رباح، أن أعرابياً جاء إلى رسول الله وهو بحنين، وعليه قميص وبه أثر صفرة، فقال: يا رسول الله إني أهللت بعمرة فكيف تأمرني أن أصنع؟ فقال: انزع قميصك، واغسل هذه الصفرة عنك، وافعل في عمرتك ما تفعل في حجك. ويذكر المحقق أن ابن عبد البر قال إن الحديث مرسل عند جميع رواة الموطأ، لكنه يتصل من غير رواية مالك من طرق صحيحة عن عطاء، وأن الصواب فيه أنه عن صفوان بن يعلى عن أبيه يعلى بن أمية عن النبي، ويذكر المحقق أن الشيخين وأصحاب السنن رووه بذلك. {cite:muwatta-maruf-1997 p.442}"
