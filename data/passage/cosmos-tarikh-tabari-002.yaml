text: "قال ابن إسحاق كان أول ما خلق الله عز وجل النور والظلمة ثم ميز بينهما فجعل الظلمة ليلاً أسود مظلماً وجعل النور نهاراً مضيئاً مبصراً"
summary:
  ar: "يعرض الطبري قولاً لابن إسحاق بأن أول المخلوقات النور والظلمة، في مقابل قول ابن عباس بأن القلم أول ما خُلق، ويرجح قول ابن عباس."
  en: "Al-Tabari sets out Ibn Ishaq's view that light and darkness were the first things created, against the view of Ibn Abbas that it was the Pen, and states his preference for Ibn Abbas's report."
  es: "Al-Tabari expone la opinión de Ibn Ishaq de que la luz y la oscuridad fueron las primeras cosas creadas, en contraposición a la opinión de Ibn Abbas de que fue la Pluma, y manifiesta su preferencia por el relato de Ibn Abbas."
  fr: "Al-Tabari expose le point de vue d'Ibn Ishaq selon lequel la lumière et les ténèbres furent les premières choses créées, contre le point de vue d'Ibn Abbas selon lequel ce fut la Plume, et exprime sa préférence pour le récit d'Ibn Abbas."
  ur: "الطبری نے ابن اسحاق کے اس نظریے کو بیان کیا ہے کہ روشنی اور تاریکی سب سے پہلے پیدا کی گئی چیزیں تھیں، ابن عباس کے اس قول کے خلاف کہ یہ قلم تھا، اور ابن عباس کی رپورٹ پر اپنی ترجیح بیان کرتا ہے۔"
  tr: "Taberi, İbn İshak'ın ilk yaratılanların ışık ve karanlık olduğuna dair iddiasını, İbn Abbas'ın ilk yaratılanın kalem olduğuna dair iddiasıyla karşılaştırarak aktarır ve İbn Abbas'ın iddiasını tercih eder."
  id: "Al-Tabari menyajikan pernyataan Ibnu Ishaq bahwa ciptaan pertama adalah cahaya dan kegelapan, sebagai kontras dengan pernyataan Ibnu Abbas bahwa pena adalah benda pertama yang diciptakan, dan ia lebih menyukai pernyataan Ibnu Abbas."
