label: { ar: "الموطأ 1015 — الصعب بن جثامة أهدى لرسول الله حماراً وحشياً وهو بالأبواء أو بودان، فرده عليه، فلما رأى ما في وجهه قال: إنا لم نرده عليك إلا أنا حرم", en: "Muwatta 1015" }
text: "إنا لم نرده عليك إلا أنا حرم"
summary:
  ar: "أول حديث في باب ما لا يجوز للمحرم أكله من الصيد. يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن عبد الله بن عباس عن الصعب بن جثامة الليثي، أنه أهدى لرسول الله حماراً وحشياً وهو بالأبواء أو بودان، فرده عليه رسول الله. قال: فلما رأى رسول الله ما في وجهي قال: إنا لم نرده عليك إلا أنا حرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1146) وإسماعيل بن أبي أويس عند البخاري (2573) وسويد (571) وغيرهم. {cite:muwatta-maruf-1997 p.475} {cite:muwatta-maruf-1997 p.476}"
