label: { ar: "الموطأ 1015 — الصعب بن جثامة أهدى لرسول الله حماراً وحشياً وهو بالأبواء أو بودان، فرده عليه، فلما رأى ما في وجهه قال: إنا لم نرده عليك إلا أنا حرم", en: "Muwatta 1015", es: "Muwatta 1015", fr: "Muwatta 1015", ur: "موطا 1015", tr: "El-Muvatta 1015 — El-Sa'b ibn Jathama, Allah Resulü'ne El-Abwa' veya Waddan'da iken vahşi bir eşek hediye etti, ancak Resulullah onu geri verdi. Resulullah'ın yüzündeki ifadeyi görünce şöyle dedi: \"Biz onu size sadece ihram halinde olduğumuz için geri verdik.\"", id: "Al-Muwatta 1015 — Al-Sa’b ibn Jathama menghadiahkan seekor keledai liar kepada Rasulullah SAW ketika beliau berada di Al-Abwa’ atau Waddan, tetapi ia mengembalikannya. Ketika melihat raut wajah beliau, beliau berkata: Kami mengembalikannya kepadamu hanya karena kami sedang dalam keadaan ihram." }
text: "إنا لم نرده عليك إلا أنا حرم"
summary:
  ar: "أول حديث في باب ما لا يجوز للمحرم أكله من الصيد. يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن عبد الله بن عباس عن الصعب بن جثامة الليثي، أنه أهدى لرسول الله حماراً وحشياً وهو بالأبواء أو بودان، فرده عليه رسول الله. قال: فلما رأى رسول الله ما في وجهي قال: إنا لم نرده عليك إلا أنا حرم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1146) وإسماعيل بن أبي أويس عند البخاري (2573) وسويد (571) وغيرهم. {cite:muwatta-maruf-1997 p.475} {cite:muwatta-maruf-1997 p.476}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang tidak diperbolehkan dimakan oleh seorang jamaah haji yang sedang ihram, yaitu hewan buruan. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud, dari Abdullah ibn Abbas, dari al-Sa'b ibn Jathama al-Laythi, bahwa ia memberikan seekor keledai liar sebagai hadiah kepada Rasulullah shalla Allahu alaihi wa sallam ketika beliau berada di al-Abwa' atau Waddan, dan Rasulullah shalla Allahu alaihi wa sallam mengembalikannya kepadanya. Ia berkata: Ketika Rasulullah shalla Allahu alaihi wa sallam melihat ekspresi wajahku, beliau bersabda: Kami mengembalikannya kepadamu hanya karena aku sedang ihram. Redaksi menyebutkan meriwayatkan dari Malik karya Abu Mus'ab (1146) dan Isma'il bin Abi Uways dalam kumpulan al-Bukhari (2573), Suwayd (571), dan lain-lain. {kutip:muwatta-maruf-1997 hal.475} {kutip:muwatta-maruf-1997 hal.476}"
