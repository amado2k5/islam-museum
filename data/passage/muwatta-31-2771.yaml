summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أن رافع بن إسحاق مولى الشفاء أخبره، قال: دخلت أنا وعبد الله بن أبي طلحة على أبي سعيد الخدري نعوده، فقال لنا أبو سعيد: أخبرنا رسول الله أن الملائكة لا تدخل بيتا فيه تماثيل أو تصاوير. {cite:muwatta-maruf-1997 p.555}"
