label: { ar: "الموطأ 2771 — رافع بن إسحاق عن أبي سعيد الخدري: الملائكة لا تدخل بيتا فيه تماثيل أو تصاوير", en: "Muwatta 2771", es: "Muwatta 2771", fr: "Muwatta 2771", ur: "موطا 2771", tr: "El-Muvatta 2771 — Rafi' ibn İshak, Ebu Sa'id el-Hudri'den rivayetle: Melekler, içinde heykel veya resim bulunan bir eve girmezler.", id: "Al-Muwatta 2771 — Rafi’ ibn Ishaq berdasarkan riwayat Abu Sa’id al-Khudri: Malaikat tidak memasuki rumah yang di dalamnya terdapat patung atau gambar." }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أن رافع بن إسحاق مولى الشفاء أخبره، قال: دخلت أنا وعبد الله بن أبي طلحة على أبي سعيد الخدري نعوده، فقال لنا أبو سعيد: أخبرنا رسول الله أن الملائكة لا تدخل بيتا فيه تماثيل أو تصاوير. {cite:muwatta-maruf-1997 p.555}"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan rivayetle, Şifa'nın azatlı kölesi Rafi' ibn İshak'ın kendisine şöyle dediğini aktarır: \"Abdullah ibn Abi Talha ve ben, hasta olduğu sırada Ebu Sa'id el-Hudri'yi ziyaret etmek için evine girdik. Ebu Sa'id bize şöyle dedi: 'Allah'ın Resulü bize meleklerin içinde heykel veya resim bulunan bir eve girmediğini bildirdi.'\" {cite:muwatta-maruf-1997 s.555}"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha bahwa Rafi’ ibn Ishaq, budak yang dibebaskan oleh al-Shifa’, memberitahunya, katanya: “Abdullah ibn Abi Talha dan saya mengunjungi Abu Sa’id al-Khudri ketika beliau sakit. Abu Sa’id berkata kepada kami: ‘Rasulullah memberitahu kami bahwa malaikat tidak memasuki rumah yang di dalamnya terdapat patung atau gambar.’” {cite:muwatta-maruf-1997 p.555}"
