text: "الكتاب الرابع الفن الأوّل من الفنون السبعة: كلام كلّي في الحمّيات والبدن المستعدّ للجدري هو الحار الرطب، والكدر الرطوبة خاصة، والقليل إخراج الدم بالفصد، ومن الأغذية أغذية توقع في الجدري - سريعاً، وخصوصاً إذا لم تكن معتادة واستعمل عليها أدوية …"
