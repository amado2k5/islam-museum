text: "الكتاب الرابع الفن الأوّل من الفنون السبعة: كلام كلّي في الحمّيات والبدن المستعدّ للجدري هو الحار الرطب، والكدر الرطوبة خاصة، والقليل إخراج الدم بالفصد، ومن الأغذية أغذية توقع في الجدري - سريعاً، وخصوصاً إذا لم تكن معتادة واستعمل عليها أدوية …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 91، يذكر الحمى والوعك، وأسماء الأمراض، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 91, that mentions fever, named diseases, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 91 کا اقتباس جس میں بخار، بیماریوں کے نام، جراحت، ختنہ اور پٹیاں، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 91, que menciona la fiebre, enfermedades específicas, cirugía, circuncisión y férulas, el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 91, qui mentionne la fièvre, les maladies nommées, la chirurgie, la circoncision et les attelles, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 91. sayfasından, ateş ve halsizlik, hastalık isimleri, cerrahi, sünnet, atel ve ilaçlardan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 91, yang menyebutkan demam dan rasa tidak enak badan, nama-nama penyakit, pembedahan, sunat, bidai, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
