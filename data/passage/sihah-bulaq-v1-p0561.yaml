  يعنى المفصح بالتفصيل والساكت عنه للتقية وفى الحديث النيب تعرب عن نفسها أى تفصح
  والمعرب الذى له خيل عراب وقال الكسانى المعرب من الخيل الذى ليس فيهء رق هيين
  والاننى معربة وأعرب الرجل أى ولدله ولدعربى اللون والابل العراب وانلخيسل العراب
  خلاف البخاتى والبراذين وأعرب الرجل تكام بالفحس والاسم العرابة وأعرب سقى القوم
  اذا كان مرّة غبا ومرة خسائم قام على وحه واحد وعرّب عليه فعله أى قيح وفى الح-ديث
  عرّبوا عليه أى ردّوا عليه بالانكاروعرّب منطقه أى ه_ذبه من اللحن وعرّبت عن القوم أى
  تكامت عنه-م والتعريب قطع سعف النخسل وهو التشذيب وتعريب الاسم الاعج-مى
  أن تتفوّه به العرب على منهاجها تقول عربته العرب وأعر بته أيضا والعربة بالتحريك النهر
  الشديد الجرية والعربة ايضا النفس قال الشاعراين ميادة
  لما أتيتك أرجوفضل نائلكم * نفحتنى نفحة طابت لها العرب
  والعرب أيضافاد المعدة يقال عربت معدته بالكسر فهى عربة وعرب أيضا الجرح
  نكس وغفروما بالدار عريب أى مابها أحد والعروب من النساء المتحببة الى زوجها والجمع
  عرب ومنه قوله تعالءر باأترايا ويوم العروبة يوم الجمعة وهو من أسمائهسم القديمة
  وابن أبى العروية بالالف واللام وعسرابة بالفتح اسم رجسل من الانصار من الاوس قال
  الخطيئة
  اذا ماراية رفعت لمجد * تلقاهاءرابة باليمين
  والعرب بالكسر يبيس البهمى ⁦(عرتب)⁩ العرتبة لغة فى العرغمة وسألت عنه إعرابيامن بنى
  أسدفوضع إصبعه على طرف وترة أنفه ( عرطب العرطبة التق فى الحديث العودمن
  الملاهى ويقال الطبل ( عرقب العرقوب العصب الغليظ الموزفوق عب الانسان
  وعرقوب الداية فى رجلها بنزلة الركبة في يدها قال أبودواد
  حديد الطرف والمنكب • والعرقوب والقلب
  قال الاصمعى كل ذى أربع عرقوباه فى رجليه وركبتاه فى يديه وقدعرقبت الدابة قطعت
  عرقوما والعرقوب من الوادى موضع فيه انحناء شديد قال الفرّاء يقال ما أكثر
  عراقيب هذا الجبل وهى الطرق الضيقة فى متفه وتعرقبت اذا أخذت فى تلك الطرق
  وعرقوب القطاة ساقها قال الراجز ونبلى وفتاها* كعراقيب قطاطحل وعراقيب
  الاموروء راقيلها عظامها وضعابها' وعرقوب اسم رجل من العمالقة ضربت به العرب
  المثل فى الخلف فالوامواعيد عرقوب وذلك انه أناء أخ له يسأله شيئا فقالء رقوب اذا أطلع
  نخ-لى فلما أطلع قال اذا أبلح فلما أبلح قال اذا أزهى فم أزهى قال اذا أرطب فلما أرطب قال
  اذا صارة رافلما صارة راجده من الليل ولم يعطه شيئا قال الاشجعى
  وعدت وكان الخلف منك سجية * مواعيد عرقوب أخاه بيترب ٢
  ( عزب العزاب الذين لا أزواج له-م من الرجال والنساء قال الكسائى العزب الذى
