label: { ar: "سنن أبي داود 1933 — الأب والأبوة", en: "Sunan Abi Dawud 1933 — the father and fatherhood", ur: "سنن ابی داؤد 1933 — باپ اور والدیت", es: "Sunan Abi Dawud 1933 — el padre y la paternidad", fr: "Sunan Abi Dawud 1933 — le père et la paternité" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا أَبُو الأَحْوَصِ، حَدَّثَنَا أَشْعَثُ بْنُ سُلَيْمٍ، عَنْ أَبِيهِ، قَالَ أَقْبَلْتُ مَعَ ابْنِ عُمَرَ مِنْ عَرَفَاتٍ إِلَى الْمُزْدَلِفَةِ فَلَمْ يَكُنْ يَفْتُرُ مِنَ التَّكْبِيرِ وَالتَّهْلِيلِ حَتَّى أَتَيْنَا الْمُزْدَلِفَةَ فَأَذَّنَ وَأَقَامَ أَوْ أَمَرَ إِنْسَانًا فَأَذَّنَ وَأَقَامَ فَصَلَّى بِنَا الْمَغْرِبَ ثَلاَثَ رَكَعَاتٍ ثُمَّ الْتَفَتَ إِلَيْنَا فَقَالَ الصَّلاَةُ فَصَلَّى بِنَا الْعِشَاءَ رَكْعَتَيْنِ ثُمَّ دَعَا بِعَشَائِهِ. قَالَ وَأَخْبَرَنِي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1933، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1933 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1933، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1933 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud n° 1933 (Les Rites du Hajj [Kitab Al-Manasik Wa'l-Hajj]) mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
