label: { ar: "الموطأ 2473 — سعيد بن المسيب: المرأة تعاقل الرجل إلى ثلث الدية", en: "Muwatta 2473", es: "Muwatta 2473", fr: "Muwatta 2473", ur: "موطا 2473", tr: "El-Muvatta 2473 — Sa’id ibn al-Musayyab: Bir kadının bir erkek için ödeyeceği tazminat, kan parasının üçte biridir.", id: "Al-Muwatta 2473 — Sa’id ibn al-Musayyab: Ganti rugi seorang wanita untuk seorang pria adalah sepertiga dari uang darah." }
summary:
  ar: "حدث يحيى عن مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه كان يقول: تُعاقل المرأة الرجل إلى ثلث الدية؛ إصبعها كإصبعه، وسنها كسنه، وموضحتها كموضحته، ومنقلتها كمنقلته. {cite:muwatta-maruf-1997 p.422}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle şöyle buyurduğunu nakletmiştir: \"Bir kadının bir erkek için karşılığı, kan parasının üçte biridir; parmağı erkeğin parmağı gibidir, dişi erkeğin dişi gibidir, yarası erkeğin yarası gibidir ve çıkığı erkeğin çıkığı gibidir.\" {cite:muwatta-maruf-1997 s.422}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa ia biasa berkata: Ganti rugi seorang wanita untuk seorang pria adalah sepertiga dari uang darah; jarinya seperti jarinya, giginya seperti giginya, lukanya seperti lukanya, dan dislokasinya seperti dislokasinya. {cite:muwatta-maruf-1997 p.422}"
