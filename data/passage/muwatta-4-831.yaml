label: { ar: "الموطأ 831 — مالك: ليس لأحد وجب عليه صيام شهرين متتابعين في كتاب الله أن يفطر إلا من علة: مرض أو حيضة، ولا أن يسافر فيفطر", en: "Muwatta 831", es: "Muwatta 831", fr: "Muwatta 831", ur: "موطا 831", tr: "El-Muvatta 831 — Malik: Allah'ın Kitabına göre iki ay üst üste oruç tutmakla yükümlü olan hiç kimse, geçerli bir sebep (hastalık veya adet görme) dışında orucunu bozamaz; yolculuk halindeyken de orucunu bozamaz.", id: "Al-Muwatta 831 — Malik: Tidak seorang pun yang diwajibkan berpuasa dua bulan berturut-turut menurut Kitab Allah boleh membatalkan puasanya kecuali karena alasan yang sah: sakit atau haid, dan tidak boleh membatalkan puasanya saat bepergian." }
summary:
  ar: "قول لمالك يختم به المسألة: ليس لأحد وجب عليه صيام شهرين متتابعين في كتاب الله أن يفطر إلا من علة، مرض أو حيضة، وليس له أن يسافر فيفطر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (815). {cite:muwatta-maruf-1997 p.405}"
  tr: "Malik, konuyu şu ifadeyle sonlandırıyor: Allah'ın Kitabına göre iki ay üst üste oruç tutmakla yükümlü olan hiç kimse, hastalık veya adet görme gibi geçerli bir sebep olmadıkça orucunu bozamaz. Yolculuk halindeyken de orucunu bozamaz. Araştırmacı, bunun Malik'ten Ebu Mus'ab (815) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.405}"
  id: "Malik menyimpulkan masalah ini dengan pernyataan berikut: Tidak seorang pun yang diwajibkan berpuasa dua bulan berturut-turut menurut Kitab Allah boleh berbuka puasa kecuali karena alasan yang sah, seperti sakit atau haid. Mereka tidak boleh berbuka puasa saat bepergian. Peneliti menyebutkan bahwa Abu Mus'ab (815) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.405}"
