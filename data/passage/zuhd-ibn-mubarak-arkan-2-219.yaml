text: "… شعب الإيمان من طريق جعفر بن عون، عن عيسى بن أبي عيسى، به. رجاله ثقات. والحسن: هو البصري. وأخرجه ابن أبي شيبة عن يزيد بن هارون، عن سلام بن مسكين، به. الترسل: هو التمهُّل والتأنّي بالقراءة."
