label: { ar: "الموطأ 1547 — عبد الرحمن بن المجبر: وهب سالم بن عبد الله لابنه جارية، فقال لا تقربها، فإني قد أردتها فلم أنبسط إليها", en: "Muwatta 1547", es: "Muwatta 1547", fr: "Muwatta 1547", ur: "موطا 1547", tr: "El-Muvatta 1547 — Abdülrahman ibn el-Mücebbir: Salim ibn Abdullah oğluna bir cariye verdi ve şöyle dedi: \"Ona yaklaşma, çünkü onu arzuladım ama onunla rahat hissetmedim.\"", id: "Al-Muwatta 1547 — Abd al-Rahman ibn al-Mujabbir: Salim ibn Abdullah memberikan seorang budak perempuan kepada putranya, dan berkata, “Jangan mendekatinya, karena aku menginginkannya tetapi tidak merasa nyaman dengannya.”" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن المجبر أنه قال وهب سالم بن عبد الله لابنه جارية له، فقال لا تقربها، فإني قد أردتها، فلم أنبسط إليها. {cite:muwatta-maruf-1997 p.47}"
  tr: "Malik, Abdülrahman ibn el-Mücebbir'den rivayetle şöyle der: Salim ibn Abdullah, oğluna cariyesini verdi ve oğlu şöyle dedi: \"Ona yaklaşma, çünkü onu arzuladım ama onunla rahat edemedim.\" {cite:muwatta-maruf-1997 s.47}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Mujabbir bahwa ia berkata: Salim ibn Abdullah memberikan seorang budak perempuan kepada putranya, dan ia berkata: Jangan mendekatinya, karena aku menginginkannya, tetapi aku tidak merasa nyaman dengannya. {cite:muwatta-maruf-1997 p.47}"
