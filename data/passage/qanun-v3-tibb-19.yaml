text: "… ويختلف علاج حُمّ من تخمة ولانت طبيعته مجلسين ثلاثة، ثم افتصد قوي عليه الإسهال افل لا وربما صار كبدياً يدلّ عليه الخفقان، وسواد اللسان الامتلاء اليومية، أعراض الحمّى المطبقة فيحمرّ العينان والوجه جداً، ويكون التهاب شديد، ويعظم النبض ويسرع وتحمرّ …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 19، يذكر الحمى، وأسماء الأمراض، والبيمارستان وصناعة الطب، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 19, that mentions fever, named diseases, the hospital and the medical craft, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 19 کا اقتباس جس میں بخار، بیماریوں کے نام، بیمارستان، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 19, que menciona la fiebre, enfermedades específicas, el hospital y la práctica médica, la cirugía, la circuncisión y las férulas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 19, qui mentionne la fièvre, les maladies nommées, l'hôpital et l'art médical, la chirurgie, la circoncision et les attelles; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 19. sayfasından, ateş, hastalık isimleri, hastane ve tıp mesleği, cerrahi, sünnet ve atellerden bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 19, yang menyebutkan demam, nama-nama penyakit, rumah sakit dan profesi medis, pembedahan, sunat dan bidai; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
