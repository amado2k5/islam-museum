text: "… يا رسول اللّٰه ولا تخف من ذي العرش إقلالاً، فقال رسول اللّٰه علم : بهذا أَمرني ربي. - أخبرنا عبد الرزاق عن معمر عن قتادة أَنَّ عمر بن الخطاب حين طعن قال : أُوصي الخليفة من بعدي خيرًا، وأُوصيه بالمهاجرين …"
