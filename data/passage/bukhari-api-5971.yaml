label: { ar: "صحيح البخاري 5971 — الأب والأبوة", en: "Sahih al-Bukhari 5971 — the father and fatherhood", ur: "صحیح بخاری 5971 — باپ اور والدیت", es: "Sahih al-Bukhari 5971 — El padre y la paternidad" }
text: "… زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ ـ قَالَ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ فَقَالَ يَا رَسُولَ اللَّهِ مَنْ أَحَقُّ بِحُسْنِ صَحَابَتِي قَالَ \" أُمُّكَ \". قَالَ ثُمَّ مَنْ قَالَ \" أُمُّكَ \". قَالَ ثُمَّ مَنْ قَالَ \" أُمُّكَ \". قَالَ ثُمَّ مَنْ قَالَ \" ثُمَّ أَبُوكَ \". وَقَالَ ابْنُ شُبْرُمَةَ وَيَحْيَى بْنُ أَيُّوبَ حَدَّثَنَا أَبُو زُرْعَةَ مِثْلَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5971، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5971 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5971، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5971 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
