label: { ar: "جامع الترمذي 2539 — الأب والأبوة", en: "Jami' al-Tirmidhi 2539 — the father and fatherhood", ur: "جامع ترمذی 2539 — باپ اور والدیت" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، وَأَبُو هِشَامٍ الرِّفَاعِيُّ قَالاَ حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَامِرٍ الأَحْوَلِ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَهْلُ الْجَنَّةِ جُرْدٌ مُرْدٌ كُحْلٌ لاَ يَفْنَى شَبَابُهُمْ وَلاَ تَبْلَى ثِيَابُهُمْ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2539، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2539 (Chapters on the description of Paradise), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2539، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
