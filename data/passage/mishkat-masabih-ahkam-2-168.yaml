text: "… اللّٰه مَيّا : غُسلُ يومِ الجمعَةِ واجب على كلَّ محْتَكم. متفق عليه. وعى أبي هريرةَ، قال : قال رسولُ اللٰه وَيِاَ : حقٌ على كلّ مسلم. أنْ يفتسِلَ في كلٌ سبمةِ أيامٍ يوماً، يغسِلُ فيه رأسَه وجسدَه. متفق عليه. الفصل …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 168، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 2, p. 168, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 2، ص 168 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 2, p. 168, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
