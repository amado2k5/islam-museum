label: { ar: "سنن ابن ماجه 871 — الأب والأبوة", en: "Sunan Ibn Majah 871 — the father and fatherhood", ur: "سنن ابن ماجہ 871 — باپ اور والدیت", es: "Sunan Ibn Majah 871 — El padre y la paternidad", fr: "Sunan Ibn Majah 871 — le père et la paternité" }
text: "… شَيْبَةَ، حَدَّثَنَا مُلاَزِمُ بْنُ عَمْرٍو، عَنْ عَبْدِ اللَّهِ بْنِ بَدْرٍ، أَخْبَرَنِي عَبْدُ الرَّحْمَنِ بْنُ عَلِيِّ بْنِ شَيْبَانَ، عَنْ أَبِيهِ،. عَلِيِّ بْنِ شَيْبَانَ - وَكَانَ مِنَ الْوَفْدِ - قَالَ خَرَجْنَا حَتَّى قَدِمْنَا عَلَى رَسُولِ اللَّهِ ـ فَبَايَعْنَاهُ وَصَلَّيْنَا خَلْفَهُ فَلَمَحَ بِمُؤْخِرِ عَيْنِهِ رَجُلاً لاَ يُقِيمُ صَلاَتَهُ - يَعْنِي صُلْبَهُ - فِي الرُّكُوعِ وَالسُّجُودِ فَلَمَّا قَضَى النَّبِيُّ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 871، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 871 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 871، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 871 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 871 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
