text: "… عن الأعمش عن أبي إسحاق عن أبي الأحوص عن عبد اللّٰه قال: وددت أني صولحت على تسع سيئات وحسنة. - حدثنا وكيع عن سفيان عن المسعودي عن أبي حازم عن أبي عون قال: قال عبد اللّٰه: المؤمن مألف، ولا خير …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 105، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 105, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 105 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
