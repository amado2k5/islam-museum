  وضرمت النار وتضر" مت واضطرمت اذا التهيت واضر متها أنا وضر متهاشد للمبالغة
  وتضرّم عليه أى تغضب وفرس ضرم شديد العدو والضرم الجائع والضرم فرخ العقاب
  رزم الضرزمة شدّة العض والتصميم عليه وأضى ضرزم شديدة العض قال الراجز
  إقد سالم الحيات منه القدما • الافعوان والشجاع الشجعما* وذات قرنين ضموزاضر زما
