  سباق الاضاميم أى الجماعات والضمام بالكسر ما تضم" بهشيأ الى شى وأسد ضماضم أى
  يضم كل شى والضخضم مثله ورج-ل ضمضم أى غضبان وضمضم اسم رج-ل يم
