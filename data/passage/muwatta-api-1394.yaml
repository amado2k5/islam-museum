label: { ar: "موطأ مالك 1394 — الأب والأبوة", en: "Muwatta Malik 1394 — the father and fatherhood", ur: "موطأ مالک 1394 — باپ اور والدیت" }
text: "وَحَدَّثَنِي مَالِكٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يُكْرِي أَرْضَهُ بِالذَّهَبِ وَالْوَرِقِ. وَسُئِلَ مَالِكٌ عَنْ رَجُلٍ أَكْرَى مَزْرَعَتَهُ بِمِائَةِ صَاعٍ مِنْ تَمْرٍ أَوْ مِمَّا يَخْرُجُ مِنْهَا مِنَ الْحِنْطَةِ أَوْ مِنْ غَيْرِ مَا يَخْرُجُ مِنْهَا فَكَرِهَ ذَلِكَ."
summary:
  ar: "حديث في موطأ مالك، رقم 1394، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1394 (Renting Land), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1394، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
