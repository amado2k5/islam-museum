text: "… قَيْسِ بْنِ طَلْقِ بْنِ عَلِيٍّ، هُوَ الْحَنَفِيُّ عَنْ أَبِيهِ، عَنِ النَّبِيِّ قَالَ \" وَهَلْ هُوَ إِلاَّ مُضْغَةٌ مِنْهُ أَوْ بَضْعَةٌ مِنْهُ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي أُمَامَةَ. قَالَ أَبُو عِيسَى وَقَدْ رُوِيَ عَنْ غَيْرِ وَاحِدٍ مِنْ أَصْحَابِ النَّبِيِّ وَبَعْضِ التَّابِعِينَ أَنَّهُمْ لَمْ يَرَوُا الْوُضُوءَ مِنْ مَسِّ الذَّكَرِ وَهُوَ قَوْلُ أَهْلِ الْكُوفَةِ وَابْنِ الْمُبَارَكِ. وَهَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 85، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 85 (The Book on Purification), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 85، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
