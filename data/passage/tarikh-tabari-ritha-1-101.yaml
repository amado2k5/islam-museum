text: "… يدعوه فسلّم عليه بالخلافة فى الطريق فعقدوا له وبايعوا فامهل حتى اذا كان يوم الاربعاء لسبع خلون من صفر وقد عزم المتوكل على مكروه ان يناله به امر ايتاخ بأخذه وعذابه فبعث اليه ايتاخ فظن انّه نُعى به فركب بعد …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك، المجلد المصوَّر 1، ص 101، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Tarikh al-Rusul wa'l-Muluk (The History of Prophets and Kings), scan volume 1, p. 101, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "تاریخ الرسول و الملوک ⁦(تاریخ انبیاء و بادشاہ)⁩، اسکین جلد 1، ص 101 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Rusul wa'l-Muluk (L'Histoire des Prophètes et des Rois), volume numérisé 1, p. 101, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Tarikh al-Rusul wa'l-Muluk (Historia de los profetas y los reyes), volumen escaneado 1, p. 101, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "*Peygamberler ve Krallar Tarihi*, Resimli Cilt 1, sayfa 101'den bir alıntı; ölüm ilanı ve duyurusu içeriyor; makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıtlar ve ölüm ilanlarından derlenmiştir."
  id: "Cuplikan dari *Sejarah Para Nabi dan Raja*, Jilid Bergambar 1, halaman 101, berisi obituari dan pengumuman kematian; diambil dari edisi faksimili yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan elegi dan obituari paling terkenal."
