text: |-
  ٢٢٨
  شردمثل خادم وخسدم وغائب وغيب وجمع الترود شرد مثل زيوروزبر وأنشد أيو عبيدة
  عبدمناف ي ذال اك فى تنائدة . ثلا كاناردا جهالة الشردا ويروى الشردا
  وقافية شرود أى سائرة فى البلاد والتشريد الطرد وصنه قوله تعالى فشردبهم من خلفهم أى
  فرق ويدديعهم والشريد الطريد وينو الشريد بطن من سليم ⁦( شكد)⁩ الشكد بالضم
  العطاء وبالفتح الصدرتقول شكده يشكد مشكدا أى أعطاه ⁦(شهد)⁩ الشهادة خبر
  قاطع تقول منه شهد الرجل على كذا وربعما قا واشهد الرجل بكون الهاء للتخفف
  عن الاخفش وقولهم اشه_دبكذا أى احلف والمشاه-ة المعاية وشهد مشهودا أى حضره
  فهوشاهد وقوم شهود أى -ضوروهو فى الاصل مصدروشهد أيضامثل راكع وركع
  وشهدله بكذاشهادة أى أتى ماعندهمر الشهادة فهوشاهدوالجمع شهدمثل صاحب
  وصحب وسافروسف روبعضهم ينحكره وجع الشهد شه ود وأشهاد وا لشهيد الشاهد
  والجمع الشهداء وأشهدته على كذافشهد عليه أى صارشاهداعليه وامرأة مشهداذا
  حضر زوجها بلاهاه وامرأة مغيية اى غاب عنها زوجها وهذا بالهاء واستشهدت فلانا
  سألته أن يشهد وأشهدنى إملا كه أى أحضرنى والمشهد محضر الناس والشهيد القتيل
  في سبيل اللّٰه وقد استشهد فلان والامم الشهادة والتشهد فى الصلاة معروف والشاهد
  | الذى يخرج مع الولد كانه مخاط ويقال شهود الناقة آ نارء وضع منتجها من دم أوسلا
  إقال الشاءر فجاءت بمثل السابرى تعجبوا * له والتوى ماجف عنه شهودها
  والشاهد اللدان والشاهد الملك قال الأعشى
  فلا تحسبى كافر الك نعمة • على شاهدى باشاهد الله فاشهة
  والشهد والشهد العسل فى شمعها والشهدة أخص منها والجع شهاد وقال الشاعرامية
  الى ردح من الشيزى ملاه * لباب البريلبك باشهاد
  أى من لساب البر
  وأشهد الرجل أمذى والمذى عسيلة ( بد الشيد بالكسر كل شى طليت به الحائط من
  حص أوبلاط وبالفتح المصدرتقول شاده يشيد.شمداجصصه والمشيد المعمول بالش
  والمشيد بالتشديد المعاول وقال التسائى المشيد المواحد من قولد تعالى وقصر مشما
  والمشيد للجمع من قوله فى بروج مشيدة والاشادة رفع الصوت بالشى وأشاديذ كره أى رفع
  •ن قدره قال أبو عم ر وقال العبسى أشدت بالشى عترقته
  صل الصاد ) خد مخدته الشم تصخده صخدا أصابته فأحرقته وصخد الصرد
  أى صاح وصهذ النهار بالكسر يصخد صخدا اشتد -ره ويوم صخدان بالتحريك وصيخود
  شديد الحرّوصخرة صيخود أى شديدة وأصخر الحرباء تصلى بحرّ الشمس دد). صدّعنه
  بصد صدودا أعرض وصده عن الامر صدامنعه وصرفه عنه وأصدهاغة قال الشاعر
  اناس أصدوا الناس باليف عنهم • صدود ال-وافعن أنوف الموائم
  وصديصدويصد صديدا أى ضج والصددالقرب يقادارى صددداره أى قبالتها
  نصب على الظرف والصذاد بااضم والتشديددويبة وهمن جنس الجرذان قال أبوزيدهو
  فى حلام
