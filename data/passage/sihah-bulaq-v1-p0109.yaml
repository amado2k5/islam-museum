text: |-
  قوله عضضت باللقمة هذا تعصف
  قبه عليه م رفى غص وقال
  ان الجد تابعه على تصيفه
  فى ايراده فى العين المهملة والضاد
  وصوابه بالفين المعجمة والصاد
  المهملة نقله نصبر
  الحدوغيره طسة كانت أوخينة يقال فلان طيب العرض ومنتن العرض وسقاء
  فبيث العرض اذا كان منتناعن أبى عبيد والعرض أيضا الجدوفى صفة أهل الجنه
  اغماهوء رق بسيل من اءراضهم أى من أجسادهم والعرض أيضا النفسر يقال اكرمت عنه
  عرضى أى صنت عنه نفسى وفلان نقىّ العرض أى برىء من أن يئتم أوبعاب وقد قيل
  عرض الرجل حسبه والعرض أيضااسم واد باليمامة وكل وادفيه شجر فهوعرض
  قال الشاعر
  لعرض من الاءراض تمسى حامه • وتضجى على أفنانه الفين تهتف
  أحبّ الى قلبى من الديك رنة • وباب اذا مامال للغلق بصرف
  يقال أخصبت أعراض المدينسة والاعراض قرى بين الحجاز والمن والاعراض الاثل
  والاراك والحمض ( ريض ، قال الاصمعى العر باض من الابل الغليظ الشديد وكذلت
  العربض مثال الهزبر ⁦(عرمض)⁩ العرمض الطحلب وهوالاخضر الذى يخسرج من
  أسفل الماءحتى يعلوه ويسى أيضائور الماء عن أبى زيد يسال ماءمعرمض قال امر والقيس
  نهمت العين التى عند ضارح • يفعليها الظل عرمضهاطامى
  ⁦( عضض)⁩ ابن السكيت عضضت باللقمة فأنا أعض وقال أبو عبيدة عضضت بالفتح لغة
  فى الرباب يقال عضه وعض به وعض عليه وهما يتعاضان إذاعض كل واحدمنه-ما
  صاحبه وكذلك المعاضة والعضاض وأعضضته الشي فعضه وفى الحديث فأعضوم بهن أبيه
  ولا تكنوا قال الاعشى
  عض بما أبق المواسى ه • من أمه فى الزمن القابر
  ويقال أعضفته سيفى أى ضر بنه به وعض الرجل يساحبه يعض عضيضا أى زمه
  ومالنا فى هذا الامرمعض أى مستمسك وما عند ناعضوض وعضاض بالفتح أى ما يعض
  عليه فيؤكل وأنشد الفرّاه
  كأن تحق بازيا ركاضا • أخدرخ الم يذق عضاضا
  وفرس عضوض أى يعض والاسم منه العضاض بالكسر بقال برتت البلك من العضاض
  والعضيض أيضاعن يعة وب وفلان عضاض عيس أى صبور على الشدّة وعاض القوم
  العيس منذ العام قاشتدعضاضهم أى عيشهم وبترعض وض أى يعبدة القعرضيقة تستقى
  بالسانية ومياه بى عيم عضض وما كانت البترعض وضا ولقد أعضت وما كانت جروار ولقد
  أجرت وزمن عضوض أى كلب وفلان يعضض شفسه أى يعض و يكثر ذلك من الغض
  والتعضوض تمرأس ودشديد الحلاوة معدنه هجر والعض بالضم على أهل الامصار مثل
  الكسب والنوى المرضوخ نقول منه أعض القوم اذا أ كلت ابلهم العض ويعير عضاضى
  أى سمين كانه منسوب اليه والعض بالكسر الداهى من الرجال والبليغ المتكير المذكر وقد
  عضضت بإرجل أى صرتْ عضا قال القطاعى .
  أحاديت من أبنا عادوجرهم • يثورها العضان زيدودغفل
  ويقال آيضا انه لعض مال اذا كان شديد القمام عله وعض سف وأى قوى عليه وعلق عض
  لا يكاد ينفتح والعض أيضا الشرس وهو ماصغر من شهر الشوك كالشوم والحاج والشيرق
  واللصف
