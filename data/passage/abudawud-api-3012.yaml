label: { ar: "سنن أبي داود 3012 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 3012 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 3012 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 3012 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنَا حُسَيْنُ بْنُ عَلِيٍّ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ بُشَيْرِ بْنِ يَسَارٍ، مَوْلَى الأَنْصَارِ عَنْ رِجَالٍ، مِنْ أَصْحَابِ النَّبِيِّ أَنَّ رَسُولَ اللَّهِ لَمَّا ظَهَرَ عَلَى خَيْبَرَ قَسَمَهَا عَلَى سِتَّةٍ وَثَلاَثِينَ سَهْمًا جَمَعَ كُلُّ سَهْمٍ مِائَةَ سَهْمٍ فَكَانَ لِرَسُولِ اللَّهِ وَلِلْمُسْلِمِينَ النِّصْفُ مِنْ ذَلِكَ وَعَزَلَ النِّصْفَ الْبَاقِيَ لِمَنْ نَزَلَ بِهِ مِنَ الْوُفُودِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3012، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3012 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 3012، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3012 (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
