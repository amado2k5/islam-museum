label: { ar: "الموطأ 2226 — مالك: في المريض الذي يوصي فيستأذن ورثته في وصيته وهو مريض، ليس له من ماله إلا ثلثه، فيأذنون له أن يوصي لبعض ورثته بأكثر من ثلثه: ليس لهم أن يرجعوا في ذلك، ولو جاز لهم ذلك صنع كل وارث مثله", en: "Muwatta 2226", es: "Muwatta 2226", fr: "Muwatta 2226", ur: "موطا 2226", tr: "Al-Muwatta 2226 — Malik: Hasta bir kişi vasiyetname hazırlayıp mirasçılarından izin istediğinde ve mal varlığının yalnızca üçte biri kaldığında, mirasçıları ona mirasın üçte birinden fazlasını bazı mirasçılarına bırakmasına izin verirse: bu izni geri alma hakları yoktur. Eğer geri alsalardı, her mirasçı aynı şeyi yapardı.", id: "Al-Muwatta 2226 — Malik: Mengenai orang sakit yang membuat wasiat dan meminta izin kepada ahli warisnya, dan ia hanya memiliki sepertiga dari hartanya yang tersisa, dan mereka mengizinkannya untuk mewariskan lebih dari sepertiga kepada sebagian ahli warisnya: mereka tidak berhak untuk mencabut izin tersebut. Jika mereka melakukannya, setiap ahli waris akan melakukan hal yang sama." }
summary:
  ar: "قال: وسمعت مالكا يقول في المريض الذي يوصي فيستأذن ورثته في وصيته، وهو مريض، ليس له من ماله إلا ثلثه، فيأذنون له أن يوصي لبعض ورثته بأكثر من ثلثه: إنه ليس لهم أن يرجعوا في ذلك. ولو جاز ذلك لهم، صنع كل وارث ذلك، فإذا هلك الموصي أخذوا ذلك لأنفسهم، ومنعوه الوصية في ثلثه، وما أذن له به في ماله. {cite:muwatta-maruf-1997 p.315}"
  tr: "Şöyle dedi: Malik'in, hasta bir kişinin vasiyetname hazırlayıp, mal varlığının sadece üçte biri kalmışken mirasçılarından izin istemesi ve mirasçılarının da ona mal varlığının üçte birinden fazlasını bazı mirasçılarına bırakmasına izin vermesiyle ilgili olarak şöyle dediğini duydum: \"Bunu geri alma hakları yoktur. Eğer buna izin verilirse, her mirasçı bunu yapacaktır ve vasiyetçi öldüğünde, onu kendilerine alacaklar ve onun mal varlığının üçte birini veya kendisine izin verilen kısmını vasiyet etmesini engelleyeceklerdir.\" {cite:muwatta-maruf-1997 s.315}"
  id: "Dia berkata: Saya mendengar Malik berkata mengenai orang sakit yang membuat wasiat dan meminta izin dari ahli warisnya, sementara dia sakit dan hanya memiliki sepertiga dari hartanya yang tersisa, dan mereka mengizinkannya untuk mewariskan lebih dari sepertiga kepada beberapa ahli warisnya: mereka tidak berhak untuk menarik kembali hal itu. Jika mereka diizinkan untuk melakukannya, setiap ahli waris akan melakukannya, dan ketika pewaris meninggal, mereka akan mengambilnya untuk diri mereka sendiri dan mencegahnya mewariskan sepertiga atau apa yang diizinkan untuk diwariskan dari hartanya. {cite:muwatta-maruf-1997 p.315}"
