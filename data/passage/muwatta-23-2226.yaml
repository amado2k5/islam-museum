label: { ar: "الموطأ 2226 — مالك: في المريض الذي يوصي فيستأذن ورثته في وصيته وهو مريض، ليس له من ماله إلا ثلثه، فيأذنون له أن يوصي لبعض ورثته بأكثر من ثلثه: ليس لهم أن يرجعوا في ذلك، ولو جاز لهم ذلك صنع كل وارث مثله", en: "Muwatta 2226" }
summary:
  ar: "قال: وسمعت مالكا يقول في المريض الذي يوصي فيستأذن ورثته في وصيته، وهو مريض، ليس له من ماله إلا ثلثه، فيأذنون له أن يوصي لبعض ورثته بأكثر من ثلثه: إنه ليس لهم أن يرجعوا في ذلك. ولو جاز ذلك لهم، صنع كل وارث ذلك، فإذا هلك الموصي أخذوا ذلك لأنفسهم، ومنعوه الوصية في ثلثه، وما أذن له به في ماله. {cite:muwatta-maruf-1997 p.315}"
