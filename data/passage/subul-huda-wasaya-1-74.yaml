text: "… كان ديناً، خيراً، شغل بالعلم، وجمع. وقال السبكي في الطبقات الكبرى كان متعففاً، متصوفاً، ديناً، مجموعاً على طلب العلم، وذكر أن له تعاليق في الفقه والحديث، قلّ أن رأيت نظيره. توفي في شهر رمضان سنة أربع وستين وسبعمائة، ودفن بسفح …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 74، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 74, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
