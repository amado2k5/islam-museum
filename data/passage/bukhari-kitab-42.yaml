  en: "Sahih al-Bukhari, Book 42: Distribution of Water"
  ur: "صحیح بخاری، کتاب المساقاۃ"
  es: "Sahih al-Bukhari, Libro 42: Distribución del agua"
  fr: "Sahih al-Bukhari, Livre 42: La distribution de l'eau"
summary:
  ar: "القسم 42 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المساقاة»، ويضم فيها النصوص من 2351 إلى 2383 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 42 of Sahih al-Bukhari (Distribution of Water) in the division of the open hadith dataset the museum took its reports from: reports 2351 to 2383 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 42، عنوان «کتاب المساقاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2351 تا 2383۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 42 de Sahih al-Bukhari (Distribución del Agua) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2351 a 2383 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 42 du Sahih al-Bukhari (La Distribution de l'eau), dans la base de données ouverte: les hadiths 2351 à 2383 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
