label:
  ar: "النسائي 2087 — فيقال إنك لا تدري ما أحدثوا بعدك"
  en: "Nasai 2087 — and it will be said: you do not know what they did after you"
  ur: "نسائی 2087 — اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا"
text: "فيقال إنك لا تدري ما أحدثوا بعدك فأقول كما قال العبد الصالح وكنت عليهم شهيدا ما دمت فيهم …"
summary:
  ar: "حديث قدسي في النسائي، رقم 2087: فيقال إنك لا تدري ما أحدثوا بعدك. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Nasai, no. 2087: and it will be said: you do not know what they did after you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "نسائی میں حدیثِ قدسی، نمبر 2087: اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
