id: passage/nasai-2087
class: passage
unit: hadith
work: work/sunan-al-nasai
ref: "2087"
label:
  ar: "النسائي 2087 — فيقال إنك لا تدري ما أحدثوا بعدك"
  en: "Nasai 2087 — and it will be said: you do not know what they did after you"
  ur: "نسائی 2087 — اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا"
  es: "Nasai 2087 — y se dirá: no sabéis lo que hicieron después de vosotros."
  fr: "Nasai 2087 — et on dira: vous ne savez pas ce qu'ils ont fait après vous"
  tr: "Kadınlar 2087 — Denir ki, sizden sonra ne yaptıklarını bilmiyorsunuz."
  id: "Perempuan 2087 — Konon, kamu tidak tahu apa yang mereka lakukan setelahmu"
text: "فيقال إنك لا تدري ما أحدثوا بعدك فأقول كما قال العبد الصالح وكنت عليهم شهيدا ما دمت فيهم …"
summary:
  ar: "حديث قدسي في النسائي، رقم 2087: فيقال إنك لا تدري ما أحدثوا بعدك. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Nasai, no. 2087: and it will be said: you do not know what they did after you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "نسائی میں حدیثِ قدسی، نمبر 2087: اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Nasai, n.° 2087: y se dirá: no sabéis lo que hicieron después de vosotros. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Nasai, n° 2087: « Il vous sera dit: “Vous ne savez pas ce qu’ils ont fait après vous.” Le Prophète le rapporte de son Seigneur. » Le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  tr: "El-Nasa'i'de 2087 numaralı hadis-i kudsi şöyle rivayet edilmiştir: \"Senden sonra ne yaptıklarını bilmiyorsun.\" Peygamberimiz bunu Rabbinden rivayet etmiş, hadis-i kudsi derleyicisi de bu rivayetleri altı şeriat hadis külliyatında ve el-Muvatta'da toplamıştır."
  id: "Sebuah hadits qudsi dalam al-Nasa'i, no. 2087: Dikatakan bahwa kamu tidak mengetahui apa yang mereka lakukan setelahmu. Nabi meriwayatkannya dari Tuhannya, dan penyusun koleksi hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
