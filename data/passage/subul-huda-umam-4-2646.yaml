text: "… قُصورَها الحُمْرَ من مكنى الساعة. ثم ضَرَب الثالثة فقطع بقيةَ الحَجَر وبرق برقة من جهة فارسَ أَضاءت ما بين لابَتَىِ المدينة، فكَبَّر رسول اللّٰه وقال : أُعطِيتُ مفاتيح فارس، والله إلى لأُبصر قُصورَ الحِيرة ومدائنَ كسرى كأَنَّها أَنياب الكِلاب من …"
