label: { ar: "سنن أبي داود 4666 — وصية أو عهد أخير", en: "Sunan Abi Dawud 4666 — a testament or parting counsel", ur: "سنن ابی داؤد 4666 — وصیت یا آخری نصیحت", es: "Sunan Abi Dawud 4666 — un testamento o consejo de despedida", fr: "Sunan Abi Dawud 4666 — un testament ou un conseil d'adieu" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ الْهُذَلِيُّ، حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ يُونُسَ، عَنِ الْحَسَنِ، عَنْ قَيْسِ بْنِ عُبَادٍ، قَالَ قُلْتُ لِعَلِيٍّ أَخْبِرْنَا عَنْ مَسِيرِكَ هَذَا أَعَهْدٌ عَهِدَهُ إِلَيْكَ رَسُولُ اللَّهِ أَمْ رَأْىٌ رَأَيْتَهُ فَقَالَ مَا عَهِدَ إِلَىَّ رَسُولُ اللَّهِ بِشَىْءٍ وَلَكِنَّهُ رَأْىٌ رَأَيْتُهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4666، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4666 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4666، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4666 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4666 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
