label: { ar: "الموطأ 2271 — سعيد بن المسيب: ولاء ولد العبد من الحرة", en: "Muwatta 2271", es: "Muwatta 2271", fr: "Muwatta 2271", ur: "موطا 2271", tr: "El-Muvatta 2271 — Sa’id ibn al-Musayyab: Bir köle çocuğunun hür bir kadına olan bağlılığı", id: "Al-Muwatta 2271 — Sa’id ibn al-Musayyab: Kesetiaan seorang anak budak kepada seorang wanita merdeka" }
summary:
  ar: "بلغ مالكا أن سعيد بن المسيب سئل عن عبد له ولد من امرأة حرة، لمن ولاؤهم؟ فقال: إن مات أبوهم وهو عبد لم يعتق، فولاؤهم لموالي أمهم. {cite:muwatta-maruf-1997 p.337}"
  tr: "Malik, Sa'id ibn al-Musayyab'a, bir kölenin özgür bir kadınla çocuk sahibi olması durumunda, çocukların kime ait olacağı sorulduğunu rivayet etmiştir. Sa'id ibn al-Musayyab şöyle cevap vermiştir: \"Eğer babaları köle iken ölür ve azat edilmezse, çocukların bağlılığı annelerinin efendilerine aittir.\" {cite:muwatta-maruf-1997 s.337}"
  id: "Malik meriwayatkan bahwa Sa'id ibn al-Musayyab ditanya tentang seorang budak yang memiliki anak dengan seorang wanita merdeka, kepada siapa anak-anak itu menjadi milik? Beliau menjawab: Jika ayah mereka meninggal dunia saat masih menjadi budak dan belum dibebaskan, maka kesetiaan mereka menjadi milik majikan ibu mereka. {cite:muwatta-maruf-1997 p.337}"
