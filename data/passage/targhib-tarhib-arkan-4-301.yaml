text: "… اللّٰه وي و استغنوا عن الناس ولو بشوص السواك رواه البزار والطبرانى باسناد جيد والبيهقى - وروى عن أبى هريرة عن النبى مول لو قال لا يؤمن عبد حتى يأمن جاره بوائقه ومن كان يؤمن باللّه واليوم الآخر فليكرم ضيفه …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 4، ص 301، يذكر ما لا يتم الإيمان إلا به، وعمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 4, p. 301, that mentions what faith is not complete without, an act tied to belief in God and the Last Day; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 4، ص 301 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
