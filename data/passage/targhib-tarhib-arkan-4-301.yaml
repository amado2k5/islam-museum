text: "… اللّٰه وي و استغنوا عن الناس ولو بشوص السواك رواه البزار والطبرانى باسناد جيد والبيهقى - وروى عن أبى هريرة عن النبى مول لو قال لا يؤمن عبد حتى يأمن جاره بوائقه ومن كان يؤمن باللّه واليوم الآخر فليكرم ضيفه …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 4، ص 301، يذكر ما لا يتم الإيمان إلا به، وعمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 4, p. 301, that mentions what faith is not complete without, an act tied to belief in God and the Last Day; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 4، ص 301 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 4, pág. 301, que menciona lo que no está completo sin la fe: un acto vinculado a la creencia en Dios y el Último Día. El texto proviene de la lectura automática y se cita en un máximo de cuarenta palabras, según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Tarhib wa-l-Tarhib d'al-Mundhiri (tome 4, p. 301) mentionnant un acte indissociable de la foi, lié à la croyance en Dieu et au Jour dernier. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 4. cildinin 301. sayfasında, imanın eksik kalacağı ve amellerin Allah'a ve Ahiret Günü'ne olan inanca bağlı olduğu belirtilmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlandırılmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Dorongan dan Peringatan), Jilid 4, halaman 301, menyebutkan bahwa tanpanya iman tidak lengkap, dan amal perbuatan bergantung pada kepercayaan kepada Tuhan dan Hari Kiamat. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
