label:
  ar: "الترمذي 2427 — أعطيتك وخولتك وأنعمت عليك فماذا صنعت"
  en: "Tirmidhi 2427 — I gave you, granted you and blessed you: what did you do"
  ur: "ترمذی 2427 — میں نے تمہیں دیا، نوازا اور نعمت دی تو تم نے کیا کیا"
text: "يجاء بابن آدم يوم القيامة كأنه بذج فيوقف بين يدى الله فيقول الله له أعطيتك وخولتك وأنعمت عليك فماذا صنعت . فيقول يا رب جمعته وثمرته فتركته أكثر ما كان فارجعني آتك به . فيقول له أرني ما قدمت . …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2427: أعطيتك وخولتك وأنعمت عليك فماذا صنعت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2427: I gave you, granted you and blessed you: what did you do. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2427: میں نے تمہیں دیا، نوازا اور نعمت دی تو تم نے کیا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
