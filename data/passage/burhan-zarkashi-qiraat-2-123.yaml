label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 123 — جمع القرآن والمصاحف، رسم المصحف", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 123 — the collection of the Qur'an and the codices; the orthography of the mushaf", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 123 — جمعِ قرآن اور مصاحف، رسمِ مصحف", es: "Al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, escaneo del volumen 2, pág. 123 — la colección del Corán y los códices; la ortografía del mushaf", fr: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 123 — le recueil du Coran et des codex; l'orthographe du mushaf" }
text: "النوع السابع: في أسرار الفواتح والسور بعضها مفرد لا يخطر ببال غير ما هو عليه من مورده أمنت وقوع اللبس فيها وقد اتفقت في خط المصحف أشياء خارجة عن القياسات التي يبنى عليها علم الخط والهجاء ثم ما عاد ذلك …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 123، يذكر جمع القرآن والمصاحف، ورسم المصحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 123, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 123 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen 2, pág. 123, que menciona la colección del Corán y los códices, la ortografía del mushaf, los alfabetos y el arte de escribir; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre d'al-Zarkashi, *al-Burhan fi 'Ulum al-Qur'an*, volume 2, page 123, mentionnant la compilation du Coran et des codex, l'orthographe du mushaf, les écritures et l'art de la transcription; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
