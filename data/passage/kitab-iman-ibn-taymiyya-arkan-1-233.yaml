text: "أهل الشام عن أبيه أن النبي عليل قال له أسلم تسلم قال وما الاسلام؟قال أن تسلم قلبك لله ويسلم المسلمون من لسانك ويدك. قال فأي الإسلام أفضل؟ قال الايمان.قال وما الايمان؟ قال أن تؤمن بالله وملائكته وكتبه ورسله وبالبعث بعد …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 233، يذكر تعريف الإسلام بأعماله، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 233, that mentions Islam defined by its acts, belief in God, His angels, His books and His messengers, the question about faith and its answer, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 233 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 233, que menciona el Islam definido por sus actos, la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, la cuestión de la fe y su respuesta, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
