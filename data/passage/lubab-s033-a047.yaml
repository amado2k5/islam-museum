text: "وبشر المؤمنين الآية أخرج ابن جرير عن عكرمة والحسن البصري قالا لما نزلت ليغفر لك الله ما تقدم من ذنبك وما تأخر [الفتح: 2] قال رجال من المؤمنين هنيئا لك يا رسول الله قد علمنا ما يفعل بك فماذا يفعل بنا فأنزل الله ليدخل المؤمنين"
