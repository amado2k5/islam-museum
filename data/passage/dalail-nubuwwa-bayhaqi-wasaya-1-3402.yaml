text: "… : دخلت على عائشة، فأخرجت إلينا إزاراً غليظاً، مما يصنع باليمن وكساءاً من تلك التي تدعى الملبدة، فأقسمت بالله لقد قُبِضَ رسول اللّٰه وللي في هذين الثوبين. اخرجه البخاري في : - كتاب الجهاد، باب ما قبل في درع النبي، …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3402، يذكر ساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 3402, that mentions a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 3402 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 3402, que menciona un lecho de muerte y las últimas horas, una reliquia conservada tras su dueño; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Dala'il al-Nubuwwa d'al-Bayhaqi, volume 1, page 3402, mentionnant un lit de mort, les dernières heures et une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "El-Beyhakî'nin \"Dala'il al-Nubuwwah\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 3402. sayfasında ölüm ve vefat anından bahsedilir ve bu, korunmuş kutsal emanetlerden biridir; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi \"Dala'il al-Nubuwwah\" (Bukti Kenabian), Jilid 1, halaman 3402, menyebutkan saat kematian dan wafat, dan merupakan salah satu peninggalan yang terpelihara; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, peninggalan, dan makam suci."
