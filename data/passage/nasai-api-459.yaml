text: "… عَنْ قَتَادَةَ، عَنْ أَنَسٍ، قَالَ سَأَلَ رَجُلٌ رَسُولَ اللَّهِ فَقَالَ يَا رَسُولَ اللَّهِ كَمِ افْتَرَضَ اللَّهُ عَزَّ وَجَلَّ عَلَى عِبَادِهِ مِنَ الصَّلَوَاتِ قَالَ \" افْتَرَضَ اللَّهُ عَلَى عِبَادِهِ صَلَوَاتٍ خَمْسًا \". قَالَ يَا رَسُولَ اللَّهِ هَلْ قَبْلَهُنَّ أَوْ بَعْدَهُنَّ شَيْئًا قَالَ \" افْتَرَضَ اللَّهُ عَلَى عِبَادِهِ صَلَوَاتٍ خَمْسًا \". فَحَلَفَ الرَّجُلُ لاَ يَزِيدُ عَلَيْهِ شَيْئًا …"
summary:
  ar: "حديث في سنن النسائي، رقم 459، يرد فيه ذكر ما فرضه الله ورسوله. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 459 (The Book of Salah), whose wording mentions what God and His Messenger made obligatory. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 459، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 459, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 459, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de yer alan 459 numaralı hadis, Allah ve Resulü'nün neyi emrettiğini anlatmaktadır. Farz, itaat, tavsiye edilen, mekruh, haram ve küçük günahları kapsayan bu hadis, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinden rivayetlerle derlenmiştir. Yazar, metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 459, menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya. Hadits ini, yang mencakup amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, disusun dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Penulis menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
