text: |-
  ٤vo -
  فى أقل العدد أدل وهو أفعل قلبت الواويا لوقوعها طرفابعدضمة والكثيردلاء ودلىّ على
  فعول وقال الراجز
  آكت لا أعطى غلاما أبدا • دلانه الى أحب الاسودا
  يريديدلاته سجله ونصيبه من الودّ والاسوداسم ابنه والدلوبرج من بروج السماء والدلوسمة
  للابل وقولهم جاءفلان بالدلو أى بالداهية قال الراجز
  ٢ملن عنقاء وعنقفيرا • والدلو والديلم والزفيرا.
  والدالية التجئون تديرها البقروالنساعورة يديرها الماء ودلوت الدلونزعتها وأدليتها أرسلتها
  فى البئر لتمتلئ وقد ياء فى الشعر الدالى بمعنى المدلى وهو فى قول التجاج يصف ما
  يكشف عن جماته دلو الدال •يعنى الدلى ودلوت الناقة دلواسرته اسيرارويدا وقال الراجز
  لا تعجلا بالسيووادلواها • وقال آخر
  لا تقلواها وادلوا هادلوا • ان مع اليوم أخاه غدوا
  وادلولى أى أسرع وهو افعوعل ودلوت الرجل وداليته اذا رفقت به وداريتّه ودلاه بغ رور
  أى أوقعه فيما أراد من تغريره وهو من ادلاء الدلو ودلوت بغسلان اليسك أى استشفعت به
  اليك وقال عمر ا إاستسق بالعباس رضى اللّٰه عنهما اللهمّ انا نتقرب اليك بعمّ النبىّ صلى اللّٰه
  عليه وسلم وقفية آبانه وكبرر جالمدلونابه اليك مستشفعين وتدلى من الشجرة وقوة تعالى
  ثم دتاقتدني أي تدلل كقوه تعالى ثم ذهب الى أهل يرطى أى يتعط قال ابيد
  فن-دليت عليها قافلا • وعلى الارض غبايات الطفل
  وأدلى محجته أى احتج هاوهويدلى برحه أى يمت بها وأدلى بماه الى الحاكم دفعه اليه ومنه
  قوله تعالي وتدلوابها الي الحكام يعنى الرشوة ⁦(دما)⁩ الدم أصلدمو بالتحريك وانماقالوا
  دمي يدمي لجمال البكسرة التى قبل الياء كما قالوارضى يرضى وهو من الرضوان قال الشاعر
  فلوأناعلى حجرذجنا • جرى الدميان بانخبر البقين
  وبعض العرب يقول فى تثنيته دموان وقال سيبويه الدم أصل دمى على فعل بالتسكين لانه
  يجمع علي دجأء ودمى مثل ظبى وظباء وظبى" ودلوودلاء ودلى" قال ولو كان مئسل قفاوعصا
  لماجمع على ذلك وقال المبرد أصل فعل بالتحريك وان جامجعه مخالفا لنظائره والذاهب منه
  الباء والدليل عليها قواءم فى تتنيته دميان ألاترى أنّ الشاء رلما اضطر أخرجه على أصله
  فقال
  فلسنا علي الاعقاب تدمى كلومنا . ولكن على أقدامنا تقدار الدما
  فأخر جه على الاصل ولا يلزم علي هذا قولهم يديان وان اتفقوا على أنّ تقدير يدفعل ساكنة
  العين لانه اتجائي على لغة من يقول لديدا وهذا القول أصح وتصغير الدم دى والجمع دماء
  والتسية اليه دمي وان شبت دموى ويقال دمى النى يدمى دماودميافهودم مثل قرق
  يفرق فرقافهو فرق والمسدر متفق عليه أنه بالتحريك وانما اختلفموا في الاسم والدمية الصيتم
  والجمع الدمي وهي الصورة من الهاج ونحوه وقول الشباءر
  والبيض يرفان فى الدمى • والريطد والمذهب المصون
  يعى نيابافيها تهاو ير وساتى دما اسم جبل يقال سى يذلك لانه ليس من يوم الاويسفك عليه
  دم كأنهمااسمان جعلاواحدا وأنتدسيبويه
