label: { ar: "موطأ مالك 1548 — ما حُرّم", en: "Muwatta Malik 1548 — what was made unlawful", ur: "موطأ مالک 1548 — جو حرام کیا گیا", es: "Muwatta Malik 1548 — lo que se declaró ilegal", fr: "Muwatta Malik 1548 — ce qui fut déclaré illégal", tr: "Muwatta Malik 1548 — Yasak olan nedir?", id: "Muwatta Malik 1548 — Apa yang dilarang" }
text: "… الْعِنَبِ فَقَالَ ابْنُ عَبَّاسٍ أَهْدَى رَجُلٌ لِرَسُولِ اللَّهِ رَاوِيَةَ خَمْرٍ فَقَالَ لَهُ رَسُولُ اللَّهِ \" أَمَا عَلِمْتَ أَنَّ اللَّهَ حَرَّمَهَا \". قَالَ لاَ. فَسَارَّهُ رَجُلٌ إِلَى جَنْبِهِ. فَقَالَ لَهُ \" بِمَ سَارَرْتَهُ \". فَقَالَ أَمَرْتُهُ أَنْ يَبِيعَهَا. فَقَالَ لَهُ رَسُولُ اللَّهِ \" إِنَّ الَّذِي حَرَّمَ شُرْبَهَا حَرَّمَ بَيْعَهَا \". فَفَتَحَ الرَّجُلُ الْمَزَادَتَيْنِ حَتَّى ذَهَبَ مَا …"
summary:
  ar: "حديث في موطأ مالك، رقم 1548، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1548 (Drinks), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1548، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1548 (Bebidas), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Muwatta Malik, n° 1548 (Boissons), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Malik'in Muwatta'sında yer alan 1548 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 1548, menyebutkan apa yang diharamkan. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
