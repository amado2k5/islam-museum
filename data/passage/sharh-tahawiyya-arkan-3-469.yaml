text: "أسئلة العقيدة الطحاوية الإيمان؟ قال : الإيمان أنْ تُؤْمِنَ بِالله وَمَلاَئِكَتِهِ وَكٌبِهِ وَرُسُلِهِ وَاليَوْمِ الآخِر، وبِالْقَدَرِ خَيْرِهِ وَشَرَّهِ مِنَ اللّه تعالى، هذا الإيمان الواجب متوقّف على العلم، فهذا القَدْر المجمل في الإيمان بالله، وبالملائكة، وبالكتب، وبالرسل، واجب على كل أحد؛ …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 3، ص 469، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بالقدر، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 3, p. 469, that mentions belief in God, His angels, His books and His messengers, belief in the decree, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 3، ص 469 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، تقدیر پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 3, pág. 469, que menciona la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, la creencia en el decreto, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 3, p. 469) mentionnant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, ainsi que la croyance au décret divin, l'un des articles de foi. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
