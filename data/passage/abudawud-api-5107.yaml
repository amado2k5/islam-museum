label: { ar: "سنن أبي داود 5107 — الأب والأبوة", en: "Sunan Abi Dawud 5107 — the father and fatherhood", ur: "سنن ابی داؤد 5107 — باپ اور والدیت", es: "Sunan Abi Dawud 5107 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا إِبْرَاهِيمُ بْنُ أَبِي الْوَزِيرِ، حَدَّثَنَا دَاوُدُ بْنُ عَبْدِ الرَّحْمَنِ الْعَطَّارُ، عَنِ ابْنِ جُرَيْجٍ، عَنْ أَبِيهِ، عَنْ أُمِّ حُمَيْدٍ، عَنْ عَائِشَةَ،ا قَالَتْ قَالَ لِي رَسُولُ اللَّهِ \" هَلْ رُئِيَ - أَوْ كَلِمَةً غَيْرَهَا - فِيكُمُ الْمُغَرِّبُونَ \". قُلْتُ وَمَا الْمُغَرِّبُونَ قَالَ \" الَّذِينَ يَشْتَرِكُ فِيهِمُ الْجِنُّ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5107، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5107 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5107، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5107 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
