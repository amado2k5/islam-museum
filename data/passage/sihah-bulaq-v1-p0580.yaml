text: |-
  ⁦(فصل السين)⁩
  ٦١
  والمرأة نيكحها يب ، ابن السكيت الازيب على أفعل النشاط ويؤنث يقال.رقلان
  وله أزيب مسكرة اذامة راسر بعامن النشاط والازيب الدعى قال الشاءر
  - فأعطوهمنى النصف أوأضعفواله * وما كنت قلاقبل ذلك أزييا
  والأريب العداوة والازيب السكاء التى تجرى بين الصباوالجنوب قال أبو عمروفى قول
  الشاعر عن ثج البحر يجينن أزييه هو الماء الكثير أيوزيد أخذنى من فلان الازيب
  وهوالفزع
  ( نسل الحين (س أب بو عمروسأبت الرجل سأيا اذا خنقته -تى عوت والسأب
  أيضا الزق واجمع السؤْوب والمسأب مثله وهوسقاء الع-ل الاأنّ أباذؤيب زكهدمزه
  فى قوله بصف مسشتار العسل
  تأيط خافة فيها مساب * فأصبح يقترى مسد ابشيق
  أرادشيقابعدفقاب والشيق الجبل وسأيت السقاءوسعته ( بب السب الشتم
  وقدسبه يسبه وسبه أيضابعي قطعه وقولهم مارأيته منذسية أى مذز من من الدهركة ولك
  مندسنة ومضت سبة من الدهر والسبة الاست وسبه يسمه اذا طعنه فى السية وقإل
  فما كانذتب بى مالك • بأنسب منهم غلام فسب
  يعي معاقرة عالب وسحيم فولبسب شتم وسب عقر والنساب التشائم والتساب التقاطيع
  ورحل مسب بكسر المحيم كثير السباب ويقال صارهذا الامرسبة عليه بالضم أى عارا
  يسب به ورجل سبة أى يسببه الناس وسببة أى يب الناس قال أبو عبيد السب بالكبر
  المكثير السباب وسبك أيضا الذى يسابك قال الشاعر
  لا تبنى فلت بسى • ان سبي من الرجال الكريم
  والسب أيضا الجار وكذلك العمامة قال الخبل السعدى
  وأشهد من عوف حاولا كثيرة * يحجون سب الزبرقان المزعفرا
  والسب الحيل في لغة هذيل قال أبو ذؤيب
  تدلى عليها بين سب وخيطة * بجرداء مثل الوكف يكبو غرابها
  والسيوب الجبال قال ساعدة بن جؤية
  صب اللهيف لها السبوب بطغية * تني العقاب كمايلط المجنب
  والسب شقة كتان رقيقة والسبيبة مثله والجمع السبوب والسبائب قإل الراجز
  يبيرأويدى به الجدرنق • سباتبا يجيدها ويصفق
  وابل مسببة أى خيارلانه يقال اهاعند الاعجاب بها قاقلها اللّٰه ويقال بينه-م أسبوبة
  سابون بها والسبب الحبل والسبب أيضا كل شى يتوصل بة الى غيره والسدب اعتلاق
  قراية وأسباب السماء بواحيها في قول الإعشى
  ورقيت أسباب السماء بسلم واللّه
  سبب الاسباب ومنه التسبب والسبيب شعر الناصية والعرف والذنب والسبب
  المفازة مقال بلدسوسب وباد سياسب وقول النابغة
  رفاق النعال طيب حجزاتهم * يحيون بالريحان يوم السباسب
  صحاج
