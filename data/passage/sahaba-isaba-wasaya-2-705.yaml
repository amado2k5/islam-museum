text: "… وانهزم لقيط، وقُتل ممن كان معه عشرة آلاف؛ ذكره سيف.. وأما انتمائي إلى العرب فإن الروم سبتني صغيراً، فأخذت لسانهم. - صَيْفي بلفظ النسب ابن الأسلت، أبو قَيْس: يأتي في الكنى. ولما مات عمر أوصى أن يصلِّي عليه صُهيب، وأن …"
