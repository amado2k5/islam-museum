text: "كتب لى بذلك كتابا، قال : فكتب له ( بسم الله الرحمن الرحيم ، هذا كتاب من محمد رسول الله لتميم بن أوس الدارى أن له قرية جيرون وبيت عينون قريتهما كلهمسا ومحلهما وجبلهما وماؤهما وحرثهما وأنباطهما وبقرهما ولعقبه من"
