label: { ar: "مسلم 2565 — تفتح أبواب الجنة يوم الاثنين ويوم الخميس", en: "Muslim 2565 — The gates of Paradise open on Monday and Thursday" }
text: "قال رسول الله: «تفتح أبواب الجنة يوم الاثنين ويوم الخميس، فيغفر لكل عبد لا يشرك بالله شيئاً، إلا رجلاً كانت بينه وبين أخيه شحناء، فيقال: أنظروا هذين حتى يصطلحا»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ عرض الأعمال يومي الاثنين والخميس واستثناء المتشاحنين من الغفران — نص المصالحة بين المسلمين."
