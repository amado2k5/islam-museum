text: "حَدَّثَنَا عَلِيٌّ، حَدَّثَنَا سُفْيَانُ، قَالَ ذَهَبْتُ أَسْأَلُ الزُّهْرِيَّ عَنْ حَدِيثِ الْمَخْزُومِيَّةِ، فَصَاحَ بِي، قُلْتُ لِسُفْيَانَ فَلَمْ تَحْتَمِلْهُ عَنْ أَحَدٍ قَالَ وَجَدْتُهُ فِي كِتَابٍ كَانَ كَتَبَهُ أَيُّوبُ بْنُ مُوسَى عَنِ الزُّهْرِيِّ عَنْ عُرْوَةَ عَنْ عَائِشَةَا أَنَّ امْرَأَةً مِنْ بَنِي مَخْزُومٍ سَرَقَتْ، فَقَالُوا مَنْ يُكَلِّمُ فِيهَا النَّبِيَّ فَلَمْ يَجْتَرِئْ أَحَدٌ أَنْ يُكَلِّمَهُ، فَكَلَّمَهُ أُسَامَةُ بْنُ زَيْدٍ، فَقَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3733، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3733 (Companions of the Prophet), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3733، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 3733 (Compañeros del Profeta), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 3733 (Compagnons du Prophète), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
