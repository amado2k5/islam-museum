text: "… خَزَايَا وَلاَ نَدَامَى \". فَقَالُوا يَا رَسُولَ اللَّهِ إِنَّا حَىٌّ مِنْ رَبِيعَةَ وَبَيْنَنَا وَبَيْنَكَ مُضَرُ، وَإِنَّا لاَ نَصِلُ إِلَيْكَ إِلاَّ فِي الشَّهْرِ الْحَرَامِ، فَمُرْنَا بِأَمْرٍ فَصْلٍ نَدْخُلُ بِهِ الْجَنَّةَ، وَنَدْعُو بِهِ مَنْ وَرَاءَنَا. فَقَالَ \" أَرْبَعٌ وَأَرْبَعٌ أَقِيمُوا الصَّلاَةَ، وَآتُوا الزَّكَاةَ، وَصَوْمُ رَمَضَانَ، وَأَعْطُوا خُمُسَ مَا غَنِمْتُمْ، وَلاَ تَشْرَبُوا فِي الدُّبَّاءِ، وَالْحَنْتَمِ، وَالنَّقِيرِ، وَالْمُزَفَّتِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6176، يذكر الصلاة والزكاة والصوم والحج مجتمعة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6176 (Good Manners and Form (Al-Adab)), that mentions the prayer, the zakat, the fast and the pilgrimage named together. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6176، جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
