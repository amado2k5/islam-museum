text: "… قال مالك أيضاً والجمهور. فإن صاده أو صيد له فهو حرام، سواء، صيد له بإذنه أم بغير إذْنه. أما إن صاده حلاّل لنفسه ولم يقصد المحرم، ثم أهدى من لحمه للسحرم، أو باعه، لم يحرُم عليه. وعن عبد الرحمن بن …"
