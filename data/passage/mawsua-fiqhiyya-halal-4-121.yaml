text: "… يكون حلالاً، فإن كان محرما بحج أو عمرة لم يؤكل ما صاده، بل يكون ميتة كما سيأتى بيانه. - الشرط الثالث : أن يكون مسلما أو كتابيا، وهذا عند الحنفية والشافعية والحنابلة، وقال المالكية : لا يحل ما صاده الكتاب …"
