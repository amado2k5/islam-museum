text: "… الأول: الإيجاب، كإيجاب الصلاة والصيام والزكاة. الثاني: الندب، كندب ركعتين قبل الظهر وبعده. الثالث: التحريم، كتحريم الزنا وأكل أموال الناس بالباطل. الرابع: الكراهة، كالصلاة في مرابض الإبل. الخامس: الإباحة، كإباحة الأكل أو الشرب وغيرهما من كل ما خير الشارع فيه …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 459، يرد فيه ذكر الوجوب، والكراهة، والمباح، والتحريم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 459, whose wording mentions obligation (wujub), dislike (karaha), the permitted (mubah), forbidding (tahrim), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 459 کا اقتباس جس میں وجوب، کراہت، مباح، تحریم، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 459, dont le texte mentionne l'obligation (wujub), la réprobation (karaha), le permis (mubah), l'interdiction (tahrim), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 459, cuyo texto menciona la obligatoriedad (wujub), la reprobación (karaha), lo permitido (mubah), la prohibición (tahrim), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 459. sayfasından, yükümlülük, kınanabilirlik, izin verilebilirlik, yasaklama ve tavsiye konularını ele alan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Zorunlu fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, kınanabilir fiiller, yasaklanmış fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 459, yang membahas kewajiban, perbuatan tercela, perbuatan yang diperbolehkan, perbuatan yang dilarang, dan anjuran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan tercela, perbuatan yang dilarang, dan dosa-dosa kecil."
