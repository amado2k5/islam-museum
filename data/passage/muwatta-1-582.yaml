text: "اللهم اجعلني من أئمة المتقين"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن عبد الله بن عمر كان يقول في دعائه: اللهم اجعلني من أئمة المتقين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.300}"
  tr: "Malik, Abdullah ibn Umar'ın duasında şöyle dediğini duyduğunu bildirmiştir: \"Ey Allah'ım, beni takva sahiplerinin önderlerinden eyle.\" Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.300}"
  id: "Malik meriwayatkan bahwa ia mendengar Abdullah ibn Umar biasa mengucapkan dalam doanya: \"Ya Allah, jadikanlah aku salah satu pemimpin orang-orang yang bertakwa.\" Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.300}"
