text: "… قال: لأن أعطي درهمين في نائبة أحب إلي من أن أتصدق بخمسة. أخبرنا أبو عبدالله الحافظ ومحمد بن موسى قالا : حدثنا أبو العباس محمد بن راجع لتخريج هذا الحديث الباب الحادي والستين من شعب الإيمان. إسناده : ليس بالقوي …"
