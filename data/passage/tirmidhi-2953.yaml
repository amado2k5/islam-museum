label:
  ar: "الترمذي 2953 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Tirmidhi 2953 — I have divided the prayer between Myself and My servant in two halves"
  ur: "ترمذی 2953 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج فهي خداج غير تمام . قال قلت يا أبا هريرة إني أحيانا أكون وراء الإمام . قال يا ابن الفارسي فاقرأها في نفسك فإني سمعت رسول الله يقول قال الله …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2953: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2953: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2953: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
