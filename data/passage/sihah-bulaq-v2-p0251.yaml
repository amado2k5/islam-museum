text: |-
  ٣٣٦
  *⁦(فصل اللام)⁩•
  أراد ليبك فحذف الللام وكذلك لام أمر المواجه قال الشاعر
  قلت ابواب لديه دارها • تئذن فانى حؤهاوجارها
  أراد لتأذن فذف اللام وكسر التاء على اخة من يقول أنت تعلم وأمالام التوكيد فعلى خسة
  أضرب منها لام الابتداء كقولك لزيد أفضل من عمرو ومنها التى تدخل فى خبرات المشقدة
  والمخففة كقوله تعالى انّ ربك لدالرصاد وقوله سيحانه وان كانت لكبيرة ومنها التى تكون
  جوا بالموولولا كقوله تعالى لولا أنتم لكنامؤمنيز وقوله تعالى لوتز يلوالمذبنا الذين كفرا
  ومنها التى تبكون فى الفعل المستقبل المؤكد بالنون كقولد ليسينن وليكونا من الصاغرين
  ومنها الام جواب القسم وجميع لامات التوكيد تصلح أن تكون جوا باللقسم كة وه تعالى وان
  منكم لمن ليبطتن فاللام الاولى للتوكيد والثانية جواب لات التسم بحلد توصل بأخرى وهى
  المقسم عليه لتؤكد الشانية بالاولى وير بطون بين الهلتسين بحروف تسميها النويون جواب
  القسم وهى انَّ المكسورة المشدّدة واللام المعترض بهاوهما بمعن واحدكولكْ والقه انّ زيدا
  خير منت وواللّٰه لزيد خير منك وقولكْ واللّٰه ايقو من زيد اذا أدخاو الام القسم على فعل
  مستقبل أدخلوا فى آخره النون شديدة أوخفيفة لتأكيد الاستقبال واخراجه عن
  الحمال لابد من ذلف ومنها ان الخفيفة المكسورة وما وهما بعى كة ولان واللّه مافعات
  وواللّٰه ان فعلت بمعنى ومنها لاكة ولك واللّه لا أفعل لا يتصل الحلف بالمحلوف الابأحدهذه
  الحروف الحمسة وقد تحذف وهى مرادة وأقالام الاضافة فعلى عمانية أضرب منها لام الملات
  كقولت المال لزيد ومنهالام الاختصاص كتولك أخلز يدومنه الام الاستغائة كقول
  الشاعر
  بالأرجال ليوم الاربها أما * ينفك يحدث لى بعد النهمى طربا
  واللامان جميع اللجر واذكنهم قصوا الأولى وكسر واالثانية ليفرة وابين المستغاث به
  الليس بالعطف كول الشاعره باللرجال وللشبان للعجب• وقول الشاعر مهلهسل
  بالبكر أنشروالى كليبا • بالبكرأين أين الغرار
  استغائة وقال بعضهم أصله يا آل بكر فخفف بحذف الهمزة كما قال جرير
  ق_د كان حقا أن نقول لبارق • يا آل بارق فيم سب جرير
  ومنها لام التعجب مفتوحسة كقولك بالتعجب والمعنى ياعجب احضرفه-ذا أوانك ومنها لام
  العلة بعنى كى كة وه تعالى اشكونواشهداء على الناس وضربته ليتأذب أى لكى يتأذب
  ولاجل التأدب ومنهالام العافبة كقول الشاعر
  فلاموت تغذوالوالدات سخالها • كمالخراب الدهرتبى المساكن
  أى عاقبته ذلك ومنهالام الحد بعد ما كان ولم يكن ولا تححب الا النقى كقوله تعالى وما كان
  اللّٰه ايعذبهم أى لان يعذبهم ومنهالام الماريخ كولك كتبت اثلاث ليال خلون أى بعد
  ثلاث قال الراحى
  حتى وردن اتم خس بائص • جدّا تعاوره الرياح ويلا
  وأما اللامات الساكنسة فعلى ضر بين أحدههالام التعريف فلسكونما أدخلت عليها ألف
  الوصل
