text: "… قال : نحلف بالله لقد رأينا الأكابر من أصحاب رسول اللّٰه وَلي يسألون عائشة عن الفرائض. وعن عروة عن أبيه قال: ما رأيت أحداً من الناس أعلم بالقرآن ولا بفريضة ولا بحلال ولا بحرام ولا بشعر ولا بحديث العرب ولا …"
