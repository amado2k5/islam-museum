text: "… عُمَرَ قَدْ أَتَانِي فَقَالَ : إِنَّ الْقَتْلَ قَدِ اسْتَحَرَّ بِقُرَّاءِ الْقُرْآنِ يَوْمَ الْيَمَامَةِ، وإِنِّي لأخْشَى أنْ يَسْتَحِرَّ الْقَتْلُ بالقَرَّاءِ في المَوَاطِن كُلِّهَا فَيَذْهَبَ قُرآن كَثِيرٌ، وإِنِّي أَرَى أنْ تَأْمُرَ بِجَمْعِ الْقُرْآنِ. قَالَ أَبُو بَكْرٍ لِعُمَرَ : كَيْفَ أَفْعَلُ شَيْئًا لَمْ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 700، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 700, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
