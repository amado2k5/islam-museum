text: "ليعز المسلمين في مصائبهم، المصيبة بي"
summary:
  ar: "أول حديث في باب جامع الحسبة في المصيبة. يرويه مالك عن عبد الرحمن بن القاسم بن محمد بن أبي بكر الصديق مرسلاً، أن النبي قال: ليعزّ المسلمين في مصائبهم المصيبة بي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، ويحيل على التمهيد (19/322). {cite:muwatta-maruf-1997 p.323}"
