label: { ar: "الموطأ 634 — عبد الرحمن بن القاسم مرسلاً: ليعز المسلمين في مصائبهم المصيبة بي", en: "Muwatta 634", es: "Muwatta 634", fr: "Muwatta 634", ur: "موطا 634", tr: "El-Muvatta 634 — Abdülrahman ibn el-Kâsım, mursal: Müslümanları musibetlerinde teselli etmek için, musibet benimle birliktedir.", id: "Al-Muwatta 634 — Abd al-Rahman ibn al-Qasim, mursal: Untuk menghibur kaum Muslimin dalam musibah mereka, musibah itu ada padaku." }
text: "ليعز المسلمين في مصائبهم، المصيبة بي"
summary:
  ar: "أول حديث في باب جامع الحسبة في المصيبة. يرويه مالك عن عبد الرحمن بن القاسم بن محمد بن أبي بكر الصديق مرسلاً، أن النبي قال: ليعزّ المسلمين في مصائبهم المصيبة بي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، ويحيل على التمهيد (19/322). {cite:muwatta-maruf-1997 p.323}"
  tr: "Bu hadis, musibet zamanlarında iyiliği emretme ve kötülüğü yasaklama sorumluluğunun kapsamlılığı hakkındaki bölümdeki ilk hadistir. Malik, Abdülrahman ibn el-Kâsım ibn Muhammed ibn Ebu Bekr el-Siddik'ten rivayet ettiğine göre, mursal bir hadiste Peygamber şöyle buyurmuştur: \"Müslümanlar musibetlerinde teselli bulsunlar, çünkü teselli bulacak olan benim.\" Editör, bu hadisin Malik'ten Ebu Musab ve Suveyd tarafından rivayet edildiğini ve el-Temhid'e (19/322) atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.323}"
  id: "Hadits pertama dalam bab tentang tanggung jawab menyeluruh dalam menyeru kepada kebaikan dan melarang kejahatan di masa musibah. Diriwayatkan oleh Malik dari Abd al-Rahman ibn al-Qasim ibn Muhammad ibn Abi Bakr al-Siddiq, dalam hadits mursal, bahwa Nabi bersabda: “Hendaklah kaum Muslimin mendapat penghiburan dalam musibah mereka, karena akulah yang akan terhibur.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab dan Suwaid, dan merujuk pada al-Tamhid (19/322). {cite:muwatta-maruf-1997 p.323}"
