label: { ar: "سنن أبي داود 3987 — كتاب الحروف والقراءات، قراءات القرآن", en: "Sunan Abi Dawud 3987 — the Book of the Letters and the Readings; the readings of the Qur'an", ur: "سنن ابی داؤد 3987 — کتاب الحروف والقراءات، قرآن کی قراءتیں", es: "Sunan Abi Dawud 3987 — El Libro de las Letras y las Lecturas; las lecturas del Corán", fr: "Sunan Abi Dawud 3987 — le Livre des Lettres et des Lectures; les lectures du Coran" }
text: "… عَمْرٍو النَّمَرِيَّ - أَخْبَرَنَا هَارُونُ، أَخْبَرَنِي أَبَانُ بْنُ تَغْلِبَ، عَنْ عَطِيَّةَ الْعَوْفِيِّ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّ النَّبِيَّ قَالَ \" إِنَّ الرَّجُلَ مِنْ أَهْلِ عِلِّيِّينَ لَيُشْرِفُ عَلَى أَهْلِ الْجَنَّةِ فَتُضِيءُ الْجَنَّةُ لِوَجْهِهِ كَأَنَّهَا كَوْكَبٌ دُرِّيٌّ \". قَالَ وَهَكَذَا جَاءَ الْحَدِيثُ \" دُرِّيٌّ \". مَرْفُوعَةُ الدَّالِ لاَ تُهْمَزُ \" وَإِنَّ أَبَا بَكْرٍ وَعُمَرَ لَمِنْهُمْ وَأَنْعَمَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3987، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Abi Dawud, no. 3987 (Dialects and Readings of the Qur'an (Kitab Al-Huruf Wa Al-Qira'at)), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 3987، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3987 (Dialectos y lecturas del Corán (Kitab Al-Huruf Wa Al-Qira'at)), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Abi Dawud, n° 3987 (Dialectes et lectures du Coran (Kitab Al-Huruf Wa Al-Qira'at)), mentionne les différentes lectures du Coran. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
