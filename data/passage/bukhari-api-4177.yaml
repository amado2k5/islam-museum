label: { ar: "صحيح البخاري 4177 — أثر من الآثار المحفوظة", en: "Sahih al-Bukhari 4177 — a relic kept after its owner", ur: "صحیح بخاری 4177 — محفوظ آثار و تبرکات", es: "Sahih al-Bukhari 4177 — una reliquia conservada después de su dueño.", fr: "Sahih al-Bukhari 4177 — une relique conservée après son propriétaire", tr: "Sahih el-Buhari 4177 — Korunmuş bir gelenek", id: "Sahih al-Bukhari 4177 — Sebuah hadis yang terpelihara" }
text: "… كَانَ يَسِيرُ فِي بَعْضِ أَسْفَارِهِ، وَعُمَرُ بْنُ الْخَطَّابِ يَسِيرُ مَعَهُ لَيْلاً، فَسَأَلَهُ عُمَرُ بْنُ الْخَطَّابِ عَنْ شَىْءٍ فَلَمْ يُجِبْهُ رَسُولُ اللَّهِ ثُمَّ سَأَلَهُ فَلَمْ يُجِبْهُ، ثُمَّ سَأَلَهُ فَلَمْ يُجِبْهُ وَقَالَ عُمَرُ بْنُ الْخَطَّابِ ثَكِلَتْكَ أُمُّكَ يَا عُمَرُ، نَزَرْتَ رَسُولَ اللَّهِ ثَلاَثَ مَرَّاتٍ، كُلُّ ذَلِكَ لاَ يُجِيبُكَ. قَالَ عُمَرُ فَحَرَّكْتُ بَعِيرِي ثُمَّ تَقَدَّمْتُ أَمَامَ الْمُسْلِمِينَ، وَخَشِيتُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4177، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4177 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4177، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4177 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona una reliquia conservada tras la muerte de su propietario. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un récit du Sahih al-Bukhari, n° 4177 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 4177 numaralı hadiste, korunmuş bir kutsal emanetten bahsedilir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4177, menyebutkan sebuah relik yang terpelihara. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
