label: { ar: "موطأ مالك 311 — النافلة والنوافل", en: "Muwatta Malik 311 — the supererogatory (nafila)", ur: "موطأ مالک 311 — نفل اور نوافل", fr: "Muwatta de Malik 311 — le surérogatoire (nafila)", es: "Muwatta de Malik 311 — lo supererogatorio (nafila)", tr: "Muwatta Malik 311 — Nafile Dualar", id: "Muwatta Malik 311 — Doa Supererogatori" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ عُرْوَةَ بْنَ الزُّبَيْرِ، وَسَعِيدَ بْنَ الْمُسَيَّبِ، كَانَا يُصَلِّيَانِ النَّافِلَةَ وَهُمَا مُحْتَبِيَانِ."
summary:
  ar: "حديث في موطأ مالك، رقم 311، يرد فيه ذكر النافلة والنوافل. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 311 (Prayer in Congregation), whose wording mentions the supererogatory (nafila). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 311، جس کے الفاظ میں نفل اور نوافل کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 311, dont le texte mentionne le surérogatoire (nafila). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 311, cuyo texto menciona lo supererogatorio (nafila). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 311 numaralı hadiste, nafile ibadetlerden bahsedilir. Farz ibadetleri, görevleri, itaati, tavsiye edilen ibadetleri, mekruh edilen ibadetleri, haram ibadetleri ve küçük günahları derleyen bu eser, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 311, menyebutkan tentang ibadah-ibadah sunnah. Penyusun kitab tentang amalan-amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
