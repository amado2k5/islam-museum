text: "تمته أقفه عند كل آية وأسأله عنها» (١). وقال ابن مسعود: ((ما في كتاب الله آية إلا وأنا أعلم فيم أنزلت)) (٣). وقال الحسن البصري: ((ما أنزل الله آية إلا وهو يحب أن يعلم ما أراد بها» (٣) . ولهذا"
