text: "… الغِنَاءِ من غير فاحشة، فقال رسول اللّٰه عله : لا آذن لك ولا كرامة ولا نَعَمة عين، كذبت يا عدوّ الله! لقد رزقك اللّٰه حلالاً طيباً، فاخترت ما حرّم اللّٰه عليك، لو كنت تقدمتُ إليك لنكبت بك. ابن ماجه. أَخرجه …"
