label: { ar: "صحيح البخاري 3749 — تربية الأب ووصيته", en: "Sahih al-Bukhari 3749 — the father raising and counselling", ur: "صحیح بخاری 3749 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 3749 — El padre que cría y aconseja", fr: "Sahih al-Bukhari 3749 — l'éducation et les conseils du père" }
text: "حَدَّثَنَا حَجَّاجُ بْنُ الْمِنْهَالِ، حَدَّثَنَا شُعْبَةُ، قَالَ أَخْبَرَنِي عَدِيٌّ، قَالَ سَمِعْتُ الْبَرَاءَ ـ قَالَ رَأَيْتُ النَّبِيَّ وَالْحَسَنُ عَلَى عَاتِقِهِ يَقُولُ \" اللَّهُمَّ إِنِّي أُحِبُّهُ فَأَحِبَّهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3749، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3749 (Companions of the Prophet), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3749، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3749 (Compañeros del Profeta), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3749 (Compagnons du Prophète), mentionne le rôle du père dans l'éducation et le soutien des enfants. Le site « Paternité en Islam » le répertorie avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la figure paternelle."
