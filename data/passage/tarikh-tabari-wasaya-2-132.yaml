text: "… ريح الجنّة فعلق بشجرها وأوديتها وأمتلاً ما هنالك طيبا من ثم يُوتَى بالطيب من ريح المجنة وقالوا أنزل معد من طيب الجنّد وقال أنزل معد الحجرة الاسود وكان اشدّ بياضا من الثلج وعصا موسى وكانت من آس الجنة طولها عشرة …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 2، ص 132، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
