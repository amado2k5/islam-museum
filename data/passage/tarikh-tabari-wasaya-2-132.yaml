text: "… ريح الجنّة فعلق بشجرها وأوديتها وأمتلاً ما هنالك طيبا من ثم يُوتَى بالطيب من ريح المجنة وقالوا أنزل معد من طيب الجنّد وقال أنزل معد الحجرة الاسود وكان اشدّ بياضا من الثلج وعصا موسى وكانت من آس الجنة طولها عشرة …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 2، ص 132، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 2, p. 132, that mentions a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 2، ص 132 کا اقتباس جس میں محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Rusul wa-l-Muluk de al-Tabari, volumen 2, pág. 132, que menciona una reliquia conservada tras su propietario; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Rusul wa-l-Muluk d'al-Tabari, volume 2, page 132, mentionnant une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "Taberi'nin Peygamberler ve Krallar Tarihi, Resimli Cilt 2, s. 132'deki bir alıntıda, korunmuş bir eserden bahsedilmektedir; makineyle okunabilir tıpkıbasım baskısında, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Para Nabi dan Raja karya Al-Tabari, Jilid 2 Bergambar, hlm. 132, menyebutkan sebuah artefak yang terpelihara; dari edisi faksimili yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
