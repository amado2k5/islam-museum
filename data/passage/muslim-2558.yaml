label: { ar: "مسلم 2558 — إن لي قرابة أصلهم ويقطعوني", en: "Muslim 2558 — I have kin whom I keep and who sever me" }
text: "قال رجل: يا رسول الله إن لي قرابة أصلهم ويقطعوني وأحسن إليهم ويسيئون إلي وأحلم عنهم ويجهلون علي، فقال رسول الله: «لئن كنت كما قلت فكأنما تسفهم المل، ولا يزال معك من الله ظهير عليهم ما دمت على ذلك»"
summary:
  ar: "رواية أبي هريرة في باب صلة الرحم من صحيح مسلم؛ وصية النبي للواصل المسيء إليه: يكفيهم الرماد الحار ويظهره الله عليهم ما دام على صلته."
