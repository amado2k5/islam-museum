label: { ar: "مسلم 2558 — إن لي قرابة أصلهم ويقطعوني", en: "Muslim 2558 — I have kin whom I keep and who sever me", es: "Musulmán 2558 — Tengo parientes a quienes guardo y que me separan", fr: "Muslim 2558 — J'ai des proches que je garde et d'autres qui me rejettent", ur: "مسلم 2558 - میرے رشتہ دار ہیں جن کو میں رکھتا ہوں اور جو مجھے جدا کرتا ہوں۔", tr: "Müslim 2558 — Benim akrabalarım var ve onlarla bağımı sürdürüyorum, fakat onlar benimle bağlarını koparıyorlar.", id: "Muslim 2558 — Saya mempunyai kerabat yang tetap saya jalin hubungan baik dengannya, tetapi mereka memutuskan hubungan dengan saya." }
text: "قال رجل: يا رسول الله إن لي قرابة أصلهم ويقطعوني وأحسن إليهم ويسيئون إلي وأحلم عنهم ويجهلون علي، فقال رسول الله: «لئن كنت كما قلت فكأنما تسفهم المل، ولا يزال معك من الله ظهير عليهم ما دمت على ذلك»"
summary:
  ar: "رواية أبي هريرة في باب صلة الرحم من صحيح مسلم؛ وصية النبي للواصل المسيء إليه: يكفيهم الرماد الحار ويظهره الله عليهم ما دام على صلته."
  tr: "Sahih Müslim'de akrabalık bağlarını koruma bölümünde Ebu Hurayra'nın rivayetine göre, Peygamberimiz akrabalık bağlarını koruyan ancak bu bağ nedeniyle haksızlığa uğrayan kişiye şu nasihatte bulunmuştur: \"Kızarmış küller onlara yeter, Allah onları açığa çıkarır; yeter ki akrabalık bağlarını korusunlar.\""
  id: "Riwayat Abu Hurairah dalam bab tentang menjaga hubungan kekerabatan dalam Sahih Muslim; nasihat Nabi kepada orang yang menjaga hubungan kekerabatan tetapi dizalimi olehnya: “Abu panas sudah cukup bagi mereka, dan Allah akan menampakkannya selama dia menjaga hubungan kekerabatannya.”"
