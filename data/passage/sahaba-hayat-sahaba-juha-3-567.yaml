text: "… قال : إنى لا أقول إلا حقا. وأخرجه البخارى فى الأدب ص عن أبى هريرة مثله. وأخرج ابن عساكر وضعفه عن ابن عباسما أن رجلا سأله فقال: أكان رسول اللّٰه يمزح ؟ قال: نعم، فقال رجل: ما كان مزاحه؟ فقال …"
