label: { ar: "الموطأ 1500 — نافع: ابنة عبيد الله بن عمر كانت تحت ابن عبد الله بن عمر، فمات ولم يدخل بها ولم يسم لها صداقا، فقضى زيد بن ثابت أن لا صداق لها ولها الميراث", en: "Muwatta 1500" }
summary:
  ar: "يروي مالك عن نافع أن ابنة عبيد الله بن عمر، وأمها بنت زيد بن الخطاب، كانت تحت ابن لعبد الله بن عمر، فمات، ولم يدخل بها، ولم يسم لها صداقا. فابتغت أمها صداقها، فقال عبد الله بن عمر ليس لها صداق، ولو كان لها صداق لم نمسكه ولم نظلمها. فأبت أمها أن تقبل ذلك، فجعلوا بينهم زيد بن ثابت، فقضى أن لا صداق لها، ولها الميراث. {cite:muwatta-maruf-1997 p.31}"
