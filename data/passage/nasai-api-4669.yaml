label: { ar: "سنن النسائي 4669 — الحرام، ما حُرّم", en: "Sunan al-Nasa'i 4669 — the unlawful; what was made unlawful", ur: "سنن نسائی 4669 — حرام، جو حرام کیا گیا", es: "Sunan al-Nasa'i 4669 — lo ilícito; lo que se hizo ilícito", fr: "Sunan al-Nasa'i 4669 — l'illicite; ce qui a été rendu illicite", tr: "Sunan an-Nasa'i 4669 — Haram olan, yasaklanmış olan", id: "Sunan an-Nasa'i 4669 — Yang dilarang, apa yang diharamkan" }
text: "… رَبَاحٍ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ عَامَ الْفَتْحِ وَهُوَ بِمَكَّةَ \" إِنَّ اللَّهَ وَرَسُولَهُ حَرَّمَ بَيْعَ الْخَمْرِ وَالْمَيْتَةِ وَالْخِنْزِيرِ وَالأَصْنَامِ \". فَقِيلَ يَا رَسُولَ اللَّهِ أَرَأَيْتَ شُحُومَ الْمَيْتَةِ فَإِنَّهُ يُطْلَى بِهَا السُّفُنُ وَيُدَّهَنُ بِهَا الْجُلُودُ وَيَسْتَصْبِحُ بِهَا النَّاسُ. فَقَالَ \" لاَ هُوَ حَرَامٌ \". وَقَالَ رَسُولُ اللَّهِ عِنْدَ ذَلِكَ \" …"
summary:
  ar: "حديث في سنن النسائي، رقم 4669، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4669 (The Book of Financial Transactions), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4669، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4669 (El Libro de las Transacciones Financieras), menciona lo ilícito y lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4669 (Le Livre des Transactions Financières), mentionne ce qui est illicite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de yer alan 4669 numaralı hadis, helal ve haram olan şeyleri belirtmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4669, menyebutkan apa yang diharamkan dan apa yang telah diharamkan. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
