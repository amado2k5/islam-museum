text: "… والمحمولة إليه، وساقيها، وبائعها، وأكل ثمنها، المشتري لها، والمشتري له. رواه ابن ماجه والترمذي. وقال : حديث غريب. عن أبي هريرة أن رسول اللّٰه متطلع قال : لا يزني الزاني حين يزني وهو مؤَمن، ولا يسرق السارق حين يسرق وهو …"
