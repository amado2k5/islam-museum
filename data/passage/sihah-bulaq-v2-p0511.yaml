text: |-
  السعدى وبقة البيت
  يروح بأرطار عظام اللقائح
  إم مح عه
  •⁦(باب القاف)⁩.
  nلى-)*
  دع ذا وحبر منطقا محقفا * وثوب محقق اذا كان محكم النسيج قال الراجز
  تسربل جلد وجه أبيك انا • كفينان اطققة الرفاقا
  والحيقة خلاف الجاز والحقيقة ما يحق على الرجل أن يحميه وفلان سامى اخقيتة ويقال
  الحقيقة الراية قال عامى بن العافيل * أنا الذارس الحامى حقيقة جعفر* والأحق من
  اللخيل الذى لا يعرق أنتد أبو عمر وارجل من الانصار
  وأقدر مشرف الصهوات ساط * كبت لا أحق ولاشة.ت
  وقال الاصمعىّ فى تفسير هذا البيت الاقدر الذى يجوز حاذرارجليه حافرى يديه والشقيت
  الذى يقصر حفرارجليه عن حافرى بديه والا-ق الذى يطبق حافرار جايهحافرى يديه
  ومصدره الحقق والحقعقة أرفع السير وأتعبه للفاهر وفى الحديث ان مطرف بن عبد اللّه بن
  الشنهير قال لابنه لما اجتهد فى العبادة خير الامورأ وساطها والحسنة بين السيقتين وشر
  السير الحتهقة ويقال هوالسير فى أول الليل ونمى عن ذلك ( لق الحلقة بالتسكين
  الدروع وكذلك حلقة الباب وحلقة القوم والجمع الحلق على غير قياس وقال الاسمعىّ الجمع
  حلق ثل بدرة وبدروة صعة وقصع وحكى يونس عن أبى عمروبن العلاء حلقة فى الواحد
  بالتحريك والجع حلق وحلقات وقال ثعلب كاهم يجيزه على ضعفه وأنشد
  أرط وافقد أقلقتم حلقاتكم • عسى أنتفوزوا أن تكونوار طائطا
  قال أبو يوسف سمعت أباعمر والشيدانى" يقول ليس فى المكلام -لقة بالتحريك الافى قوله-م
  هؤلا قوم حلقة للذين يحلقون الشعرجع حالق والحاق الحلقوم والجمع الحاوق والحلق
  بالسكسر ناتم الملك قال الشاعر
  ففاز بحلق المنذر بن محرّق * فى منهم وخو النجاد كريم
  والحلق أيضا المال الكثير يقال جاءفلان بالحلق والاحراف وتحليق الطائرارتفاعه فى
  طيرانه وابل محلقسة وسمها الخلق ومنه قول الشاعر ١
  وذوحلق تقضى العواذير بينها • وقال الاخريخاطب لقيط بن زرارة
  وذكرت من ابن الحلق شربة * والخيل تعدوفى الصعيد بداد
  والحلق بكسر اللام اسم رجل من ولد أبى بكرين كلاب من بى عامر الذى قال فيسه الاعشى
  وبات على النار الندى والمحلق• وقال أيضا
  تروح على آل المحلق جفنة • كمبابية الشيخ العراقى تفهق
  وكسا محلق بكسر الميم اذا كان كأنه يحاق الشعر من خشونته قال الراجز
  يتقضن بالمشافر الهدالق * تفضت بالهاشئ المحالق
  والحالق الضرع الممتلئ كأن اللبن فيه الى حلقه ومنه قول لبيد
  -ت اذا يبست وأسصحق حالق • والمع حلق وحوالق قال الحطبئة
  اذا لم تكن الاالاً ماليس أصحت • لها حلق ضراته اشكرات
  أى ممتتة من اللبن والحالق من الكرم ما التونى منه وتعلق بالقضبان والحالق الجبل المرتفع
  ويقال باء من حالى أكامن.كان مشرف وقواهم لا تضعل ذاك أمك حالن أى أشكاها اللّه
  ~ى
