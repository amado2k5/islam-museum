text: "… عَنْ يَحْيَى بْنِ سَعِيدٍ، أَنَّهُ بَلَغَهُ أَنَّ مُعَاوِيَةَ بْنَ أَبِي سُفْيَانَ، كَتَبَ إِلَى زَيْدِ بْنِ ثَابِتٍ يَسْأَلُهُ عَنِ الْجَدِّ، فَكَتَبَ إِلَيْهِ زَيْدُ بْنُ ثَابِتٍ إِنَّكَ كَتَبْتَ إِلَىَّ تَسْأَلُنِي عَنِ الْجَدِّ، وَاللَّهُ، أَعْلَمُ وَذَلِكَ مِمَّا لَمْ يَكُنْ يَقْضِي فِيهِ إِلاَّ الأُمَرَاءُ - يَعْنِي الْخُلَفَاءَ - وَقَدْ حَضَرْتُ الْخَلِيفَتَيْنِ قَبْلَكَ يُعْطِيَانِهِ النِّصْفَ مَعَ الأَخِ الْوَاحِدِ وَالثُّلُثَ مَعَ الاِثْنَيْنِ فَإِنْ كَثُرَتِ الإِخْوَةُ لَم …"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Muwatta Malik; sending a letter or message to a party."
  ur: "موطأ مالک میں؛ کسی فریق کو خط یا پیغام بھیجنا."
