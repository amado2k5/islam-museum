label: { ar: "سنن النسائي 3641 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan al-Nasa'i 3641 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن نسائی 3641 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Sunan al-Nasa'i 3641 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia" }
text: "أَخْبَرَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ قَتَادَةَ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ غَنْمٍ، عَنْ عَمْرِو بْنِ خَارِجَةَ، قَالَ خَطَبَ رَسُولُ اللَّهِ فَقَالَ \" إِنَّ اللَّهَ قَدْ أَعْطَى كُلَّ ذِي حَقٍّ حَقَّهُ وَلاَ وَصِيَّةَ لِوَارِثٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3641، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3641 (The Book of Wills), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 3641، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3641 (El Libro de los Testamentos), menciona un testamento o consejo de despedida, y lo que se dejó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
