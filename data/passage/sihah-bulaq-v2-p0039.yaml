text: |-
  ٥٤٨
  •⁦(مضى)⁩.
  باا-كسرود تضم ومرى الفرس بيديه اذاحر كهما على الارض كالعابت والريح ترى
  السهاب وتمتريه أى تستدره ومراء حشه أى جهده وقرى قوله تعالى أفتمرونه على مايرى
  ومأريت الرجل أماريه هراء اذا جادلته والمرية الشك وقد تضم وقرى بم حاقوله تعالى فلاتك
  فى هرية منه قال تعلب هم الغتان وأمامرية الناقة فليس فيه الا الكسر والضم غلط والامتراه
  فى الشى الشك فيه وكذلك التمارى ومر واسم باد والنسبة اليهامروزى على غير قياس
  والنوب مروى على القياس والمروراة المفازة التى لاشئ فيها وهى فعوعلة واله-ع المرورى
  والمروريات والمرارى وفى المثل خذهبارلوبرطى مارية قال ابن السكيت هى مارية
  بذت أرقم بن ثعلبة بن عمرو بن جفنسة بن عوف بن عمسرو بن ربيعة بن حارثة بن ثعلبسة وهو
  العنقاء بن عمرومزيقياء بن عامر ماء السماء وابنها الحرث الاعرج الذى عناه حسان بقوله
  أولاد جفنة حول قبرأيهم • قبرابن مارية السكريم المفضل .
  والمارية بتشديد الياء القطاة اللمساء (مزا الزية الفضيلة يقال له عليه حزية ولاينى
  .نه فعل مسا المسامخلاف الصباح والامساءنقيض الاصباح وأمسى ممى وقال
  الحدلله ممانا ومصحنا * بانابر محناربى ومانا
  وهما مصدران و. وضعان أيضا قال إمر والقيس يصف جارية
  نضى الظلام بالعشاء كأنخا • منارة مسى راهب متبتل
  يريد صو معته حبث يمسى فيها والاسيم المسى والصبح وقال
  والمسى والصبحح لابقاء معه* ويقال أقينه لسى خاصة بالضم والكسرلغة وأتيته.يانا
  وهو تصغير مساء وأنيته أصبوحة كل يوم وأمسسية كل يوم وأتيته مسى أمس ومسى أمس
  أى أمدر عند الماء والمى اخراج النطفة من الرحم على مافسرناه فى المط يقال مساه
  يسيه وقال • يسطو على أمك سطوالماسى• ومسيث الناقسة اذ اسطوت عليها وأخرجت
  ولدها ( شا منى يمشى مشياومشى تمشية منله وأنشد الاخفش
  ودوية قفر تمنى نعامها • كنى النصارى فى خفاف الارندج
  وقال آخره ولا تمشى فى فضاء بعسداه ومشاه أيضا وأمشاه بمعفى وتمشت فيه حيا المكاس
  ومشت المرأة تمشى مشاء عدودااذا كترولدها وكذلك الماشية اذا كثرنسلها وقال
  والشاة لاتمنى مع الهملع • وناقة ماشية كثيرة الاولاد وشربت مشوا ومشياوهوالدواء
