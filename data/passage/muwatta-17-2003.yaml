label: { ar: "الموطأ 2003 — مالك: في الرجل يعطي الرجل السلعة يبيعها ويسمي له ثمنا، ويسمي له أجرا معلوما إذا باع، فلا بأس به، وإن لم يبع فلا شيء له", en: "Muwatta 2003" }
summary:
  ar: "قال مالك في الرجل يعطي الرجل السلعة يبيعها، وقد قومها صاحبها قيمة، فقال: إن بعتها بهذا الثمن الذي أمرتك به، فلك دينار، أو شيء يسميه له، يتراضيان عليه. وإن لم تبعها فليس لك شيء. قال مالك: إنه لا بأس بذلك إذا سمى ثمنا يبيعها به، وسمى أجرا معلوما، فإذا باع أخذه، وإن لم يبع فلا شيء له. {cite:muwatta-maruf-1997 p.219} {cite:muwatta-maruf-1997 p.220}"
