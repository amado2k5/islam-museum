label: { ar: "الموطأ 2003 — مالك: في الرجل يعطي الرجل السلعة يبيعها ويسمي له ثمنا، ويسمي له أجرا معلوما إذا باع، فلا بأس به، وإن لم يبع فلا شيء له", en: "Muwatta 2003", es: "Muwatta 2003", fr: "Muwatta 2003", ur: "موطا 2003", tr: "El-Muvatta 2003 — Malik: Bir kimse başka bir kimseye satması için mal verirse ve satması halinde belirli bir fiyat belirlerse, bunda bir sakınca yoktur. Ancak satmazsa, hiçbir şeye hakkı yoktur.", id: "Al-Muwatta 2003 — Malik: Jika seseorang memberikan barang kepada orang lain untuk dijual dan menetapkan harga untuknya, serta menetapkan biaya tetap jika ia menjual barang tersebut, maka tidak ada salahnya. Tetapi jika ia tidak menjual barang tersebut, maka ia tidak berhak atas apa pun." }
summary:
  ar: "قال مالك في الرجل يعطي الرجل السلعة يبيعها، وقد قومها صاحبها قيمة، فقال: إن بعتها بهذا الثمن الذي أمرتك به، فلك دينار، أو شيء يسميه له، يتراضيان عليه. وإن لم تبعها فليس لك شيء. قال مالك: إنه لا بأس بذلك إذا سمى ثمنا يبيعها به، وسمى أجرا معلوما، فإذا باع أخذه، وإن لم يبع فلا شيء له. {cite:muwatta-maruf-1997 p.219} {cite:muwatta-maruf-1997 p.220}"
  tr: "Malik, bir adamın başka bir adama satması için bir mal verdiğini ve mal sahibinin de değerini belirleyerek, \"Eğer bunu sana söylediğim fiyata satarsan, bir dinar veya karşılıklı olarak anlaştıkları başka bir şey alacaksın. Satmazsan, hiçbir şey almayacaksın\" dediğini aktardı. Malik şöyle dedi: \"Eğer satış için bir fiyat ve bilinen bir ücret belirtmişse, bunda bir sakınca yoktur. Satarsa alır, satmazsa hiçbir şey almaz.\" {cite:muwatta-maruf-1997 s.219} {cite:muwatta-maruf-1997 s.220}"
  id: "Malik berkata mengenai seorang pria yang memberikan barang dagangan kepada pria lain untuk dijual, dan pemiliknya telah menilai nilainya, dengan mengatakan, \"Jika kamu menjualnya dengan harga yang telah kukatakan kepadamu, kamu akan menerima satu dinar, atau sesuatu yang lain yang disepakati bersama. Jika kamu tidak menjualnya, kamu tidak akan menerima apa pun.\" Malik berkata: Tidak ada yang salah dengan itu jika dia menetapkan harga untuk menjualnya dan juga menetapkan biaya yang diketahui. Jika dia menjualnya, dia menerimanya, dan jika dia tidak menjualnya, dia tidak menerima apa pun. {cite:muwatta-maruf-1997 p.219} {cite:muwatta-maruf-1997 p.220}"
