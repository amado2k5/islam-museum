text: "… شعب الإيمان عن ابن عباس عيّهَا موقوفًا، قال الحاكم: صحيح الإسناد ولم يخرجاه، وتعقبه الذهبي بأن فيه عبد العزيز بن عمران وهو واه."
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 3، ص 438، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
