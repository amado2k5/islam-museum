label: { ar: "الموطأ 2358 — مالك: من دبر رقيقه جميعا في صحته أو في مرضه", en: "Muwatta 2358" }
summary:
  ar: "قال مالك في رجل دبر رقيقا له جميعا في صحته وليس له مال غيرهم: إن كان دبر بعضهم قبل بعض بُدئ بالأول فالأول حتى يبلغ الثلث. وإن دبرهم جميعا في مرضه، أو قال: فلان حر وفلان حر وفلان حر في كلام واحد، إن حدث بي حدث موت في مرضي هذا، أو دبرهم في كلمة واحدة، تحاصوا في الثلث ولم يبدأ أحد منهم قبل صاحبه، لأنها وصية، فيقسم الثلث بينهم بالحصص. {cite:muwatta-maruf-1997 p.372} {cite:muwatta-maruf-1997 p.373}"
