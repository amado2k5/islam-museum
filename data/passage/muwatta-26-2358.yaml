label: { ar: "الموطأ 2358 — مالك: من دبر رقيقه جميعا في صحته أو في مرضه", en: "Muwatta 2358", es: "Muwatta 2358", fr: "Muwatta 2358", ur: "موطا 2358", tr: "El-Muvatta 2358 — Malik: Sağlıklı olsun ya da olmasın, bütün kölelerini azat eden kimse", id: "Al-Muwatta 2358 — Malik: Barangsiapa membebaskan semua budaknya, baik dalam keadaan sehat maupun sakit" }
summary:
  ar: "قال مالك في رجل دبر رقيقا له جميعا في صحته وليس له مال غيرهم: إن كان دبر بعضهم قبل بعض بُدئ بالأول فالأول حتى يبلغ الثلث. وإن دبرهم جميعا في مرضه، أو قال: فلان حر وفلان حر وفلان حر في كلام واحد، إن حدث بي حدث موت في مرضي هذا، أو دبرهم في كلمة واحدة، تحاصوا في الثلث ولم يبدأ أحد منهم قبل صاحبه، لأنها وصية، فيقسم الثلث بينهم بالحصص. {cite:muwatta-maruf-1997 p.372} {cite:muwatta-maruf-1997 p.373}"
  tr: "Malik, sağlıklı iken tüm kölelerini azat eden ve başka hiçbir malı olmayan bir adam hakkında şöyle demiştir: Eğer kölelerinden bazılarını diğerlerinden önce azat ettiyse, azat edilen ilk kişiye öncelik verilir ve üçte birine ulaşılıncaya kadar bu böyle devam eder. Eğer hepsini hastalığı sırasında azat ettiyse veya tek bir cümleyle, \"Filanca azat edildi, filanca azat edildi, filanca azat edildi\" dediyse, \"Eğer bu hastalık sırasında ölürsem\" dediyse veya hepsini tek bir cümleyle azat ettiyse, üçte birini orantılı olarak paylaşırlar ve hiçbirinin diğerlerinden önceliği olmaz, çünkü bu bir vasiyettir. Üçte bir, paylarına göre aralarında paylaştırılır. {cite:muwatta-maruf-1997 s.372} {cite:muwatta-maruf-1997 s.373}"
  id: "Malik berkata mengenai seorang pria yang, dalam keadaan sehat, membebaskan semua budaknya dan tidak memiliki kekayaan lain: Jika ia membebaskan sebagian dari mereka sebelum yang lain, yang pertama dibebaskan diberi prioritas hingga sepertiga tercapai. Jika ia membebaskan mereka semua selama sakitnya, atau berkata, \"Si anu bebas, dan si anu bebas, dan si anu bebas,\" dalam satu pernyataan, \"Jika saya meninggal selama sakit ini,\" atau jika ia membebaskan mereka semua dalam satu pernyataan, mereka berbagi sepertiga secara proporsional, dan tidak ada satu pun dari mereka yang mendapat prioritas di atas yang lain, karena itu adalah wasiat. Sepertiga dibagi di antara mereka sesuai dengan bagian mereka. {cite:muwatta-maruf-1997 p.372} {cite:muwatta-maruf-1997 p.373}"
