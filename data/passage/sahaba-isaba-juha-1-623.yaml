text: "… في ركبته فلم يحُلْ عليه الحول حتى مات. ورويناه في المحامليّات من طريق حماد بن زيد، عن يزيد بن حازم، عن سليمان بن يسار أن جَهْجاه الغفاريّ... نحو الأول. وقال ابْنُ السَّكَنِ: مات بعد عثمان بأقل مِنْ سَنَةِ. - جَهْر، …"
