text: |-
  (١ ف نسخة زيادة الراجزو أقل
  البين
  كيف زاها والحداة نقبض
  ويبرى عهيادونها متلئبة
  عفت الديار ع لها نقامها
  ٤ ف نسخة زيادة الراجز رؤية
  وبقية البيت
  بنا حراجيعا
  من مرقب فى ذراخلقاء راسية
  ٢٢٤
  *⁦("-ل الغين)⁩•
  اذا سلخ فترك من اللحم ملتزقا بالاهاب وأغل الوادى اذا أنبت الغلان وأغل الرجل بصره
  اذا شدد النظرواستغل عبده أى كافه أن يفل عليه واستغلال المستغلات أخذ غلتها أبونصر
  قال سألت الاصمعى هل يجوز تغلات من الغالية فقال ان أردت أنك أدخلته فى لحيتك
  وشاريك فجائز وكذلك غلات بهالحيق تدد للكثرة ⁦(خمل)⁩ (نوات الجلد أغمله غملافهو
  غميل وهو أن تلف الاهاب وتدفنه ليسترخى ويسمح اذا جذب صوفه فان غذلت عنه ساعة
  فسد وهو غميل وغمين وكذلك التمراذافعلت به ذلك ليدرك ورجل مغمول أاقى عليه الشاب
  ليعرق وكذلك النبات اذاركب بعضه بعضا قال الراعى
  وعملى تصى بالمدان كأنها • ثعالب موتى جلد هاقد تزاءا
  والغمل موضع وقال ١ بالفعل ليلا والرحال تنغض • أى تحزل والغماول الوادى ذو
  الشجر والنيت الملتف وكذلك كل ما اجتمع من شجر أوغمام أوظلمة حتى تسمى الزاوية عملولا
  ول غاله الشى واغتال اذا أخذه من حيث لم يدر والغول التراب الكثير ومنه قول
  ابيديصف ثورا يحفررملافى أصل أرطاة ٢ يرى دونها غولا من الرمل غائلا* وأمّاقوله
  ٣ ب نى تأبدغولها فرجامها • فهما موضعان والغول بعد المفازة لانه يغتال من يمرّبه وقال
  ٤ به قطت غول كل ميله * وقوله تعالى لافيها غول ولاهم عنها ينزفون أى ليس فيها نغائلة
  الصداع لانه قال ء زوجلّ فى موضع آخر لا يصدعون عنها وقال أبو عبيدة الغول أن تغتّال
  عقراهم وأنشد
  ومازالت التكأس تغتالما • وتذهب بالأول الأول
  والغول بالضم من السعالى والمع أغوال وغيلان وكل ما اغتال الانسان فأهلكه فه وغول
  يقال غالته غول اذا وقع فى مهلمكة والفضب غول الحلم لانه يغتاله ويذهب به يقال
  أية غول أغول من الغضب وهذه أرض تغتال المشى أى لا يستبين فيها المشى من بع_دها
  وسعنها قال العجاج
  وبلدة بعيدة النباط ، مجهولة تغنال خطواتخاطى
  وقول زهير يصف عدة را ٥ يجن الخالب لا يغتاله الشبع* أى لا يذهب بقوته الشبع
  والتغوّل التلون يقال تغوّات المرأة اذا تلونت قال ذوالرمّة
  اذاذات أهوال شكول تغوّات * بها الربدفوضى والنعام السوارح
  والمغاولة المباداة قال جريريذ ك ررجلا أغارت عليه الخيل
  عايذت مشعلة الرعال كانها ، طيرتغاول فى شمام وكورا
  واغتاله قتله غيلة والاصل الواو والمغول سيف دقيق له قفا يكون غم_ده كااسوط ومغول
  اسم رجل والغولان بالفتح نبت من الهض عن أبى عبيد يل) الغيل بالكسر
  الاحة وموضع الاسدغيل مثل خيس ولا تدخلها الهاء والجمع غيول وقال
  جديدة سربال الشباب كأنها • سقية بردى غتهاغبولها
  مال الاصعى الغيل الشجر الملتف يقال منه تغيل الشجر والغيلة بالفتح المرأة السمينة واغتال
  الغلام أى غلظ وسمن والغيلة بالكسر الاغتيال يقال قتلد غيلة وهو أن يخدعه فيدهب به الى
  موضع فاذاصار اليه قتله ويقال أيضاأضرّت الغيسلة بولدفلان اذا أتيت أمّه وهى رضعه
  وكداف
