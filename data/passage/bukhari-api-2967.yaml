text: "… أَمْ ثَيِّبًا \". فَقُلْتُ تَزَوَّجْتُ ثَيِّبًا. فَقَالَ \" هَلاَّ تَزَوَّجْتَ بِكْرًا تُلاَعِبُهَا وَتُلاَعِبُكَ \". قُلْتُ يَا رَسُولَ اللَّهِ تُوُفِّيَ وَالِدِي ـ أَوِ اسْتُشْهِدَ ـ وَلِي أَخَوَاتٌ صِغَارٌ، فَكَرِهْتُ أَنْ أَتَزَوَّجَ مِثْلَهُنَّ، فَلاَ تُؤَدِّبُهُنَّ، وَلاَ تَقُومُ عَلَيْهِنَّ، فَتَزَوَّجْتُ ثَيِّبًا لِتَقُومَ عَلَيْهِنَّ وَتُؤَدِّبَهُنَّ. قَالَ فَلَمَّا قَدِمَ رَسُولُ اللَّهِ الْمَدِينَةَ غَدَوْتُ عَلَيْهِ بِالْبَعِيرِ، فَأَعْطَانِي ثَمَنَهُ، وَرَدَّهُ عَلَىَّ. قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2967، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2967 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2967، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2967 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
