text: "… عارٌ عليك أن تُهينني من أجل خمسة غروش كان مديناً لبقالٍ بثلاثةٍ وخمسين غرشاً، فيوماً كان الشيخ جالساً مع بعض أصدقائه في السوق، فمرَّ البقال من أمامه وأشار إليه بمعنى أنك إذا لم تُغطني حقِّي فإنّي أُهِيْتُك أمام أصدقائك، فانتقل …"
summary:
  ar: "كان على جحا لبقال ثلاثة وخمسون قرشًا فأهانه البقال في السوق؛ فعرض جحا أن يدفع ثمانية وعشرين غدًا وعشرين بعد غد، وسأل البقال ألا يخجل من إهانته من أجل خمسة قروش. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  en: "Juha owes a grocer fifty-three piastres and is shamed in the market by the grocer; Juha offers to pay twenty-eight tomorrow and twenty the next day, and asks the grocer whether he is not ashamed to shame him over five piastres. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  ur: "جحا پر ایک بقال کے تریپن قرش واجب تھے اور بقال نے بازار میں اسے رسوا کیا؛ جحا نے پیشکش کی کہ کل اٹھائیس اور پرسوں بیس دے دوں گا، اور بقال سے پوچھا کہ کیا تمہیں پانچ قرش کے لیے مجھے رسوا کرتے شرم نہیں آتی۔ {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  fr: "Juha doit cinquante-trois piastres à un épicier, qui l'humilie sur le marché; Juha propose de payer vingt-huit demain et vingt le surlendemain, et demande à l'épicier s'il n'a pas honte de l'humilier pour cinq piastres. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
  es: "Juha debe cincuenta y tres piastras a un tendero, que lo avergüenza en el mercado; Juha se ofrece a pagar veintiocho mañana y veinte pasado mañana, y le pregunta al tendero si no le da vergüenza humillarlo por cinco piastras. {cite:juha-nawadir-kubra-djuwaydi p. 90}"
