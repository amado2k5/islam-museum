text: |-
  TEA
  الهن?.
  ⁦(نحق)⁩ اللختوق شيق فى الارض كالوجار وفى الخديش انَ رجلا كان واقد امع التي
  صلى اللّٰه عليه وسلم فوقصت به ناقتعف أخاقيق يرذان قال الاصحىّ انساهو تفاقيق واحدها
  نظقوق وهى شوق فى الارض زق يه لا وقا والتزقبه أعلصق به وألزقهب غيره
  ويقال فلان لزقى وبلزقى ولزيق أى بجنبى واللازوق دواء للحرح يلزمه حتى يبرأ والممزف الشئ
  ليس بالحركم سق لسقبه ولصقيه والتسفيه والتسقبه وألسقه به غيره وألصقه به
  غيره وفلان لسق واصق رياسق وبلصق ولسيق واسيق أى بجنبى واللسق مد-ل اللصق
  وهولصوق الرئة بالجنب من العطشيقال لسق البعير ولصق ومنه قول رؤّية
  وبل برد الماء أعضاد السق * والملصق الدعى ل ق لعقت الشى بالكسر ألعقه
  لعقا أى لحسته ولعق فلان اصسبعه أى مات وهوكناية والملعقة واحدة الملاعق والمعقة
  بالضم اسم ما تأخذه الملعقة واللعقة بالمتح المرّة الواحدة يقال فى الارض لعنة من رسع
  ليس الافى الرطب يلعقها المال لعقا واللعوق اسم ما يلعق ورجل وعق لعق أى حريص وهو
  اتباع له ( فق لفقت الثوب ألفقه لفقا وهوأن تضمّشقة الى أخرى فتخيطهما واللفق
  بكسر اللام أحدلة فى الملاءة وتلافق للقوم أى تلاء مت أموره-م وأحاديت ملفقة أى
  أكاذيب جز خرفة ⁦(لقق)⁩ يقال لق عينه أى ضرج ابيده واللقلق اللسان وف
  الحديث من وقى شر لقلقه واللقلاق الصوت قال الراجز
  الى اذا مازيب الإشداق * وكثير اللحلاج والمقلاق
  ثبت الجمان حرحم وداق
  واللقلاق طائرأعجمى طويل العنق يأكل الحيات ور؟اقالوا المقلق والهع المقالق وصوته
  اللقلقة وكذلك كل صوت فى حركة واضطراب وفى حديث عمررضى اللّٰه عنه مالم يكن نقع
  ولا لقلقة قال أبو عبيد اللقلقة شدة الصوت والتلقلق مثل التقلقل مقلوب منه وكذلك
  لقلقت الشى اذا قلقلته وطرف ملقلق أى حديدلا يقسر مكانه ⁦(لمق)⁩ اللمق الحو قال
  يونس سمعت أعراسايذدرمصد قالهسم فقال لمقه بعدماغقه قال الاصمعى اق عينه
  بلمقه المقافال هوضرب العين بالسكف خاصة وأيوزيد-ثله ولقته بيصرى مثل رمقة
  وماذقت لماها أى شأهذا يصلح فى الا كل والشعرب وقال
  كيرق لاح يهجب من رآه * ولا يشفى الحواثم من لمداق
  وقال أبو العميثل ما تلمق بشئ أى ما تلج ق اللوقة بالضم الابدة عن السكسائ
  وقد لوّق طعامه اذا أصلهه بالزيد يقال لاا كل الامالوق لى أى لين لى حتى يصير كالزيد فى ليغه
  وقال ابن الكلبت هو الزبد بالرطب وفيه لغتان لوقة وألوقة حكاه عنه أبو عبيد قال وأفشدنى
  لرجل من عذرة
  والى لمن سالمتم لالوقة • واتى لمن عاديتم سم"أسود
  ويقال ماذقت لواما أى شيأ ⁦(لهق)⁩ اللهق بالتحرين الابيض وكذلك اللهاق
  واللهاق الثورالا يض وقال • لهاق تلالؤه كالهلال • واللهق مقصورمنه وأنشد
  الاصعنى لاسامة الهذلى
  والا
