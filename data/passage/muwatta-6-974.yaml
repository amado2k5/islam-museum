label: { ar: "الموطأ 974 — سعيد بن المسيب: استأذن عمر بن أبي سلمة عمر بن الخطاب أن يعتمر في شوال فأذن له، فاعتمر ثم قفل إلى أهله ولم يحج", en: "Muwatta 974", es: "Muwatta 974", fr: "Muwatta 974", ur: "موطا 974", tr: "El-Muvatta 974 — Sa’id ibn al-Musayyab: Ömer ibn Abi Salamah, Ömer ibn al-Khattab'dan Şevval ayında Umre yapma izni istedi ve o da izin verdi. Böylece Umre yaptı ve Hac yapmadan ailesinin yanına döndü.", id: "Al-Muwatta 974 — Sa’id ibn al-Musayyab: Umar ibn Abi Salamah meminta izin kepada Umar ibn al-Khattab untuk melaksanakan Umrah di bulan Syawal, dan beliau mengabulkannya. Maka ia melaksanakan Umrah dan kemudian kembali kepada keluarganya tanpa melaksanakan Haji." }
summary:
  ar: "أول حديث في باب قطع التلبية في العمرة، يسبقه أثر سعيد بن المسيب. يرويه مالك عن ابن شهاب عن سعيد بن المسيب، أن عمر بن أبي سلمة استأذن عمر بن الخطاب أن يعتمر في شوال، فأذن له، فاعتمر ثم قفل إلى أهله ولم يحج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1105)، وسويد، والشيباني (447). {cite:muwatta-maruf-1997 p.461}"
  tr: "Umre sırasında telbiyenin kesilmesiyle ilgili bölümdeki ilk hadis, Sa'id ibn al-Musayyab'dan rivayet edilen bir hadisle başlar. Malik, İbn Şihab'dan, Sa'id ibn al-Musayyab'dan rivayet ettiğine göre, Ömer ibn Abi Salamah, Şevval ayında Umre yapmak için Ömer ibn al-Khattab'dan izin istemiş ve o da izin vermiştir. Böylece Umre'yi yapmış ve Hac yapmadan ailesinin yanına dönmüştür. Editör, bu hadisin Malik'ten Ebu Mus'ab (1105), Suveyd ve el-Şeybani (447) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.461}"
  id: "Hadits pertama dalam bab tentang penghentian Talbiyah selama Umrah didahului oleh riwayat dari Sa'id ibn al-Musayyab. Malik meriwayatkannya dari Ibn Shihab, berdasarkan riwayat Sa'id ibn al-Musayyab, bahwa Umar ibn Abi Salamah meminta izin kepada Umar ibn al-Khattab untuk melaksanakan Umrah di bulan Syawal, dan beliau mengabulkannya. Maka beliau melaksanakan Umrah dan kemudian kembali kepada keluarganya tanpa melaksanakan Haji. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1105), Suwayd, dan al-Shaybani (447). {cite:muwatta-maruf-1997 p.461}"
