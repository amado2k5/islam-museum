label: { ar: "الموطأ 974 — سعيد بن المسيب: استأذن عمر بن أبي سلمة عمر بن الخطاب أن يعتمر في شوال فأذن له، فاعتمر ثم قفل إلى أهله ولم يحج", en: "Muwatta 974" }
summary:
  ar: "أول حديث في باب قطع التلبية في العمرة، يسبقه أثر سعيد بن المسيب. يرويه مالك عن ابن شهاب عن سعيد بن المسيب، أن عمر بن أبي سلمة استأذن عمر بن الخطاب أن يعتمر في شوال، فأذن له، فاعتمر ثم قفل إلى أهله ولم يحج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1105)، وسويد، والشيباني (447). {cite:muwatta-maruf-1997 p.461}"
