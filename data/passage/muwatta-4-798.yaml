text: "إن كان رسول الله ليقبّل بعض أزواجه وهو صائم"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين، أنها قالت: إن كان رسول الله ليقبّل بعض أزواجه وهو صائم، ثم ضحكت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند البخاري (1928) والجوهري والشافعي، ويحيل على التمهيد (22/139). {cite:muwatta-maruf-1997 p.393}"
