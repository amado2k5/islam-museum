label: { ar: "الموطأ 798 — عائشة: إن كان رسول الله ليقبّل بعض أزواجه وهو صائم ثم ضحكت", en: "Muwatta 798", es: "Muwatta 798", fr: "Muwatta 798", ur: "موطا 798", tr: "Al-Muwatta 798 — Aişe: Allah'ın Resulü oruçluyken bazı eşlerini öperdi, sonra onlar gülerlerdi.", id: "Al-Muwatta 798 — Aisyah: Rasulullah SAW biasa mencium beberapa istrinya ketika beliau sedang berpuasa, lalu istrinya tertawa." }
text: "إن كان رسول الله ليقبّل بعض أزواجه وهو صائم"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين، أنها قالت: إن كان رسول الله ليقبّل بعض أزواجه وهو صائم، ثم ضحكت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند البخاري (1928) والجوهري والشافعي، ويحيل على التمهيد (22/139). {cite:muwatta-maruf-1997 p.393}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Müminlerin Annesi Ayşe'den rivayet ettiğine göre, Ayşe şöyle buyurmuştur: \"Allah'ın Resulü oruçluyken eşlerinden bazılarını öperdi\" ve sonra gülerdi. Editör, bu hadisin Malik'ten Ebu Musab, Suveyd ve Kanabi tarafından Buhari (1928), Cevhari ve Şafiî'nin derlemelerinde nakledildiğini ve Temhid'e (22/139) atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.393}"
  id: "Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, Ummul Mukminin, bahwa ia berkata: “Rasulullah SAW biasa mencium sebagian istrinya ketika beliau sedang berpuasa,” lalu ia tertawa. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, dan al-Qa’nabi dalam kumpulan hadits al-Bukhari (1928), al-Jawhari, dan al-Shafi’i, dan ia merujuk pada al-Tamhid (22/139). {cite:muwatta-maruf-1997 p.393}"
