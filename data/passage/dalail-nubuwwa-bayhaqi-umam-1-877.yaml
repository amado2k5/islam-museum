text: "… الظاهر أن هذا الكتاب إنما هو الى النجاشي صاحب جعفر واصحابه، وذلك حين كتب الى ملوك الارض يدعوهم إلى اللّٰه قبيل الفتح كما كتب الى هرقل عظيم الروم قيصر الشام، وإلى كسرى ملك الفرس، وإلى صاحب مصر، وإلى النجاشي، قال …"
