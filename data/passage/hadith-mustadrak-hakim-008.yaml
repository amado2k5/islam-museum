text: "بن اليمان] فهرس الاجاديث والاثان • من عرض له قضاء فليقض بما في كتاب الله • من علق تميمة فلا أتم الله له • من علق فقد أشرك • من علق ودعة فلا ودع الله له • من علم أن"
