text: "… حتى استعملوها فى الأملة وإن لم توافت ذلك أازمان، فقالوا : رمضان لما أرمضت الأرض من شدة الحر، وشوال لما شالت الإبل بأذنابرا لطروق، وذو القعدة لما ذللوا القعدان الركوب، وذو الحجة لما حبوا، والحرم لما حرموا القتال والتجارة، وصفر …"
