text: "… حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ شُعْبَةَ، حَدَّثَنَا أَبُو التَّيَّاحِ، عَنْ مُطَرِّفٍ، عَنِ ابْنِ مُغَفَّلٍ، أَنَّ رَسُولَ اللَّهِ أَمَرَ بِقَتْلِ الْكِلاَبِ ثُمَّ قَالَ \" مَا لَهُمْ وَلَهَا \". فَرَخَّصَ فِي كَلْبِ الصَّيْدِ وَفِي كَلْبِ الْغَنَمِ وَقَالَ \" إِذَا وَلَغَ الْكَلْبُ فِي الإِنَاءِ فَاغْسِلُوهُ سَبْعَ مِرَارٍ وَالثَّامِنَةُ عَفِّرُوهُ بِالتُّرَابِ \". قَالَ أَبُو دَاوُدَ وَهَكَذَا قَالَ ابْنُ مُغَفَّلٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 74، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 74 (Purification (Kitab Al-Taharah)), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 74، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 74, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 74, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 74 numaralı hadiste bir muafiyetten bahsedilir. Farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahları derleyen bu eser, Kur'an, Sünnet, biyografi ve Sahabe ile Muhaliflerden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 74, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
