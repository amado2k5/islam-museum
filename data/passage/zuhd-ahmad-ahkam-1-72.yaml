text: "… على الناس، أو يصيبه بذلك العمل عجبٌ أو كِبْرٌ أو غير ذلك مما يجعل الأعمال التي تبدو للناس حسنات أقرب إلى السيئات، عيادًا بالله من ذلك ومن علامات صحته أنه إذا فاته ورده أو طاعة من الطاعات وجد لذلك حسرة …"
summary:
