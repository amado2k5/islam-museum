summary:
  ar: "القسم 33 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأدب»، ويضم فيها النصوص من 3657 إلى 3826 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 33 of Sunan Ibn Majah (Etiquette) in the division of the open hadith dataset the museum took its reports from: reports 3657 to 3826 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 33، عنوان «کتاب الادب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3657 تا 3826۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 33 de Sunan Ibn Majah (Etiqueta) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 3657 a 3826 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
