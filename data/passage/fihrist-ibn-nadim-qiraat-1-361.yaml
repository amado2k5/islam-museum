text: "كِتَابُ الفِهْرِست للنَّدِيم لتَعْلَب. كِتَابُ القِرَاءَات لا بن قُتَيْبَة. كِتَابُ القِرَاءَات الكبير لابن مُجَاهِد. كِتَابُ القِرَاءَات الصَّغير لا بن مُجَاهِد. كِتَابُ القِرَاءَات لهُشَيْم بن بَشِير. كِتَابُ القِرَاءَات لأبي الطَّيِّب بن أشْنَاس. كِتَابُ القِرَاءَات لعليّ بن عُمَر الدَّارَقُطْنِيِّ. كِتَابُ القِرَاءَات ليحيىٰ …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 361، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
