text: "القراءات لَقِي رسُولُ اللّه لَ يو الحجْرِيلَ، فَقَالَ: يَا بْريلُ، إِنّي بُعِنْتُ إِلَى أُمَّةٍ أُمِّيِّينَ، مِنْهُمُ العَجُوزُ، وَالشَّيْخُ الكَبِيرُ، وَالغُلامُ، وَالجَارِيَةُ، وَالرَّجُلُ الَّذِي لَمْ يَقْرَأْ كِتَاباً قَطُّ، قَالَ: يَا مُحَمَّدُ، إِنَّ القُرْآنَ أُنْزِلَ عَلَى سَبْعَةِ أَحْرُفٍ. صحيح. أحمد: بنحوه. وَفِي …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 1012، يذكر الأحرف السبعة، وقراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 1012, that mentions the seven ahruf, the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 1012 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 2, pág. 1012, que menciona los siete ahruf, las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Jami' al-Tirmidhi, volume 2, page 1012, mentionne les sept ahruf, les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le guide du musée sur la lecture et l'écriture du Coran."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 1012. sayfasından, Kur'an'ın yedi farklı okunuş şeklini ve tilaveti anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 1012, yang menyebutkan tujuh cara membaca dan bacaan Al-Quran; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
