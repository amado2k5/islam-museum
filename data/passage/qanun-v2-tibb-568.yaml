text: "الكتاب الثالث الفن الخامس عشر : في أحوال المرارة والطحال بالمطفئات. وإن كانت برودة، عالجتها بالترياق الأكبر خاصة، وبالأدوية المعلومة ل وإن كان السبب فيه البدن بكلّيته، فعلت أولاً ما يجب بالكبد لتنقية العروق، ثم البدن. وأما نفس اليرقان، فتعالجه …"
