text: "الكتاب الثالث الفن الخامس عشر : في أحوال المرارة والطحال بالمطفئات. وإن كانت برودة، عالجتها بالترياق الأكبر خاصة، وبالأدوية المعلومة ل وإن كان السبب فيه البدن بكلّيته، فعلت أولاً ما يجب بالكبد لتنقية العروق، ثم البدن. وأما نفس اليرقان، فتعالجه …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 568، يذكر أسماء الأمراض، وأعضاء البدن، والعروق، والدواء، والسم والترياق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 568, that mentions named diseases, the organs of the body, the vessels, the drug, poison and antidote; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 568 کا اقتباس جس میں بیماریوں کے نام، اعضائے بدن، رگیں، دوا، زہر اور تریاق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 568, que menciona enfermedades específicas, los órganos del cuerpo, los vasos sanguíneos, el medicamento, el veneno y el antídoto; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 568, qui mentionne les maladies nommées, les organes du corps, les vaisseaux, le médicament, le poison et l'antidote; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, s. 568'den bir bölüm; hastalıkların, vücut organlarının, damarların, ilaçların, zehirlerin ve panzehirlerin isimlerini içermektedir; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 568, yang menyebutkan nama-nama penyakit, organ tubuh, pembuluh darah, obat-obatan, racun, dan penawarnya; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
