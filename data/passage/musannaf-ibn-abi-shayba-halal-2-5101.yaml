text: "… محمد قال: كان شُريح مما يقول للخصم: يا عبد الله، والله إني لأقضي لك وإني لأظُنك ظالماً، ولكني لست أقضي بالظن، ولكن أقضي بما أحضرتني من بينتك، وإن قضائي لا يُحِلُّ لك ما حُرِّم عليك. - في القضاء وما جاء …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 5101، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 5101, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 5101 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
