text: "… وقولي له: يغيِّر عتبة بابه. فلما جاء إسماعيل كأنه آنسَ بشيء فقال: هال جاءَكم أَحد؟ قالت: نعم جاءِنا شيخ كذا وكذا، كالمستخفَّة بشأْنه، فسأَلنا عنك فأَخبرتُه وسأَلِنِي كيف عَيْشنا فأَخبرته أَنَّا في جَهْد وشدة فقال لها: هلِ أَوصاك بشيء؟ قالت …"
