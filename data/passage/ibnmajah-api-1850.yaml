label: { ar: "سنن ابن ماجه 1850 — الأب والأبوة", en: "Sunan Ibn Majah 1850 — the father and fatherhood", ur: "سنن ابن ماجہ 1850 — باپ اور والدیت" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، عَنْ شُعْبَةَ، عَنْ أَبِي قَزَعَةَ، عَنْ حَكِيمِ بْنِ مُعَاوِيَةَ، عَنْ أَبِيهِ، أَنَّ رَجُلاً، سَأَلَ النَّبِيَّ ـ مَا حَقُّ الْمَرْأَةِ عَلَى الزَّوْجِ قَالَ \" أَنْ يُطْعِمَهَا إِذَا طَعِمَ وَأَنْ يَكْسُوَهَا إِذَا اكْتَسَى وَلاَ يَضْرِبِ الْوَجْهَ وَلاَ يُقَبِّحْ وَلاَ يَهْجُرْ إِلاَّ فِي الْبَيْتِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1850، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1850 (The Chapters on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1850، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
