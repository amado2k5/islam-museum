label: { ar: "سنن ابن ماجه 2724 — ما خلّفه من تركة وميراث", en: "Sunan Ibn Majah 2724 — what was left behind: estate and inheritance", ur: "سنن ابن ماجہ 2724 — ترکہ اور میراث", es: "Sunan Ibn Majah 2724 — Lo que quedó: patrimonio y herencia", fr: "Sunan Ibn Majah 2724 — Ce qui a été laissé derrière: biens et héritage", tr: "Sunan İbn Majah 2724 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sunan Ibn Majah 2724 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… ابْنِ شِهَابٍ، عَنْ عُثْمَانَ بْنِ إِسْحَاقَ بْنِ خَرَشَةَ، عَنِ ابْنِ ذُؤَيْبٍ، قَالَ جَاءَتِ الْجَدَّةُ إِلَى أَبِي بَكْرٍ الصِّدِّيقِ تَسْأَلُهُ مِيرَاثَهَا فَقَالَ لَهَا أَبُو بَكْرٍ مَا لَكِ فِي كِتَابِ اللَّهِ شَىْءٌ وَمَا عَلِمْتُ لَكِ فِي سُنَّةِ رَسُولِ اللَّهِ شَيْئًا فَارْجِعِي حَتَّى أَسْأَلَ النَّاسَ. فَسَأَلَ النَّاسَ فَقَالَ الْمُغِيرَةُ بْنُ شُعْبَةَ حَضَرْتُ رَسُولَ اللَّهِ أَعْطَاهَا السُّدُسَ فَقَالَ أَبُو …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2724، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2724 (Chapters on Shares of Inheritance), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2724، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2724 (Capítulos sobre la herencia), menciona lo que quedó tras de sí: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 2724 (Chapitres sur le partage de l'héritage), mentionne ce qui a été laissé: les biens et l'héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "İbn Majah Sünen'inde yer alan 2724 numaralı hadiste, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, tarihi yerler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2724, menyebutkan apa yang ditinggalkannya berupa harta warisan. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, situs bersejarah, dan makam suci, beserta teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
