text: "… والإحسان، وسائر النوافل، والنكاح وغيرها مما تقدم في المندوب بالجزء، ولكن هذا الثاني إنما يكون واجباً كفاية إذا نُظر إليه كليّاً في الغالب، وقد يكون متحتماً جُزئياً؛ كالعدل بالنسبة للأمير نفسه، فهو مطلوب بإقامة العدل جُزئياً أيضاً طلباً حتماً ؛ …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 1، ص 252، يرد فيه ذكر فرض الكفاية، والواجب، والمندوب، والنافلة والنوافل، والحتم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 1, p. 252, whose wording mentions the communal obligation (fard kifaya), the obligatory (wajib), the recommended (mandub), the supererogatory (nafila), the binding (hatm); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 1، ص 252 کا اقتباس جس میں فرضِ کفایہ، واجب، مندوب، نفل اور نوافل، حتمی حکم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muwafaqat de al-Shatibi, volume numérisé 1, p. 252, dont le texte mentionne l'obligation collective (fard kifaya), l'obligatoire (wajib), le recommandé (mandub), le surérogatoire (nafila), le contraignant (hatm) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muwafaqat de al-Shatibi, volumen digitalizado 1, p. 252, cuyo texto menciona la obligación colectiva (fard kifaya), lo obligatorio (wajib), lo recomendado (mandub), lo supererogatorio (nafila), lo vinculante (hatm); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şatibi'nin El-Muvafakat adlı eserinin 1. cildinin 252. sayfasından, toplumsal yükümlülükler, görevler, tavsiye edilen ameller, nafile ameller ve farz ameller konularını ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 1, halaman 252, yang membahas kewajiban komunal, tugas, amalan yang dianjurkan, amalan sunnah, dan amalan wajib. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, tugas, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
