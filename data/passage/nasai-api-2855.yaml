label: { ar: "سنن النسائي 2855 — دفن وقبر ومرقد", en: "Sunan al-Nasa'i 2855 — a burial, grave or resting place", ur: "سنن نسائی 2855 — تدفین، قبر اور مرقد", es: "Sunan al-Nasa'i 2855 — un lugar de entierro, tumba o descanso.", fr: "Sunan al-Nasa'i 2855 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… قُتَيْبَةُ، قَالَ حَدَّثَنَا حَمَّادٌ، عَنْ أَيُّوبَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ بَيْنَا رَجُلٌ وَاقِفٌ بِعَرَفَةَ مَعَ رَسُولِ اللَّهِ إِذْ وَقَعَ مِنْ رَاحِلَتِهِ فَأَقْعَصَهُ - أَوْ قَالَ فَأَقْعَصَتْهُ - فَقَالَ رَسُولُ اللَّهِ \" اغْسِلُوهُ بِمَاءٍ وَسِدْرٍ وَكَفِّنُوهُ فِي ثَوْبَيْنِ وَلاَ تُحَنِّطُوهُ وَلاَ تُخَمِّرُوا رَأْسَهُ فَإِنَّ اللَّهَ عَزَّ وَجَلَّ يَبْعَثُهُ يَوْمَ الْقِيَامَةِ مُلَبِّيًا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2855، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2855 (The Book of Hajj), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2855، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2855 (El Libro del Hajj), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2855 (Le Livre du Hajj), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
