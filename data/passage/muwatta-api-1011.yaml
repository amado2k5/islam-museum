text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي حَبِيبَةَ، قَالَ قُلْتُ لِرَجُلٍ وَأَنَا حَدِيثُ السِّنِّ، مَا عَلَى الرَّجُلِ أَنْ يَقُولَ عَلَىَّ مَشْىٌ إِلَى بَيْتِ اللَّهِ وَلَمْ يَقُلْ عَلَىَّ نَذْرُ مَشْىٍ. فَقَالَ لِي رَجُلٌ هَلْ لَكَ أَنْ أُعْطِيَكَ هَذَا الْجِرْوَ - لِجِرْوِ قِثَّاءٍ فِي يَدِهِ - وَتَقُولُ عَلَىَّ مَشْىٌ إِلَى بَيْتِ اللَّهِ قَالَ فَقُلْتُ نَعَمْ فَقُلْتُهُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1011، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1011 (Vows and Oaths), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "موطأ مالک کی حدیث نمبر 1011، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
