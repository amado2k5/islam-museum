label: { ar: "صحيح البخاري 3950 — الأب والأبوة", en: "Sahih al-Bukhari 3950 — the father and fatherhood", ur: "صحیح بخاری 3950 — باپ اور والدیت", es: "Sahih al-Bukhari 3950 — El padre y la paternidad", fr: "Sahih al-Bukhari 3950 — Le père et la paternité", tr: "Sahih el-Buhari 3950 — Baba ve Babalık", id: "Sahih al-Bukhari 3950 — Ayah dan Peran Ayah" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ عُثْمَانَ، حَدَّثَنَا شُرَيْحُ بْنُ مَسْلَمَةَ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ يُوسُفَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، قَالَ حَدَّثَنِي عَمْرُو بْنُ مَيْمُونٍ، أَنَّهُ سَمِعَ عَبْدَ اللَّهِ بْنَ مَسْعُودٍ ـ حَدَّثَ عَنْ سَعْدِ بْنِ مُعَاذٍ، أَنَّهُ قَالَ كَانَ صَدِيقًا لأُمَيَّةَ بْنِ خَلَفٍ، وَكَانَ أُمَيَّةُ إِذَا مَرَّ بِالْمَدِينَةِ نَزَلَ عَلَى سَعْدٍ، وَكَانَ سَعْدٌ إِذَا مَرَّ بِمَكَّةَ نَزَلَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3950، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3950 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3950، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3950 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3950 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3950 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3950, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
