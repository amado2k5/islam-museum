text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، أَخْبَرَنَا الأَعْمَشُ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ لِي رَسُولُ اللَّهِ أَتَزَوَّجْتَ . قُلْتُ نَعَمْ. قَالَ بِكْرًا أَمْ ثَيِّبًا . فَقُلْتُ ثَيِّبًا. قَالَ أَفَلاَ بِكْرٌ تُلاَعِبُهَا وَتُلاَعِبُكَ ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2048، فيه مزاح ودعابة. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Abi Dawud, no. 2048, with jesting and playfulness. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابی داؤد کی حدیث نمبر 2048، جس میں مزاح اور خوش طبعی ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Abi Dawud, n° 2048, avec plaisanterie et badinage. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Abi Dawud, n.º 2048, con broma y jovialidad. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sünen Ebu Davud'da yer alan 2048 numaralı hadis, mizah ve fıkralar içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2048, berisi humor dan lelucon. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
