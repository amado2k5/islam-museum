text: "في بيان الكراهة خارجَ الصلاة ولا بأسَ بالبول فوقَ بيتٍ فيه مسجدٌ، ويكره أن يُغلَّقَ بابُ المسجدِ. ولا بأسَ بأن يُنقَشَ المسجدُ بالحصِّ، والسَّاج، وماءِ الذهب، وغير ذلك. ولا يبطلُ الاعتكافُ بالصعودِ إليه. ولا يَحِلُّ للجُنُب الوقوفُ عليه. قال: ولا …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 527، يرد فيه ذكر الكراهة، وما لا بأس به، وما لا يحل، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Marghinani's al-Hidaya, p. 527, whose wording mentions dislike (karaha), what is said to be no harm, what is not lawful, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ہدایہ، مرغینانی، ص 527 کا اقتباس جس میں کراہت، جس میں کوئی مضائقہ نہیں، جو حلال نہیں، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Hidaya de al-Marghinani, p. 527, dont le texte mentionne la réprobation (karaha), ce qui est dit sans inconvénient, ce qui n'est pas licite, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
