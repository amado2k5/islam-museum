  tr: "El-Marghinani'nin El-Hidaye adlı eserinin 527. sayfasından bir alıntı, mekruh, helal, haram ve mekruh olan şeyleri sıralamaktadır; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan, görevler, itaat gerektiren, tavsiye edilen, mekruh olan, haram olan ve küçük günahları derlemektedir."
  id: "Sebuah kutipan dari Al-Hidayah karya Al-Marghinani, halaman 527, menyebutkan apa yang tidak disukai, apa yang diperbolehkan, apa yang diharamkan, dan apa yang tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari mengenai amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang diharamkan, dan dosa-dosa kecil."
