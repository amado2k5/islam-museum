label: { ar: "صحيح البخاري 4173 — الأب والأبوة", en: "Sahih al-Bukhari 4173 — the father and fatherhood", ur: "صحیح بخاری 4173 — باپ اور والدیت", es: "Sahih al-Bukhari 4173 — El padre y la paternidad" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا أَبُو عَامِرٍ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ مَجْزَأَةَ بْنِ زَاهِرٍ الأَسْلَمِيِّ، عَنْ أَبِيهِ ـ وَكَانَ مِمَّنْ شَهِدَ الشَّجَرَةَ ـ قَالَ إِنِّي لأُوقِدُ تَحْتَ الْقِدْرِ بِلُحُومِ الْحُمُرِ إِذْ نَادَى مُنَادِي رَسُولِ اللَّهِ إِنَّ رَسُولَ اللَّهِ يَنْهَاكُمْ عَنْ لُحُومِ الْحُمُرِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4173، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4173 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4173، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4173 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
