label: { ar: "موطأ مالك 1716 — محو السيئات وحط الخطايا", en: "Muwatta Malik 1716 — bad deeds erased and sins shed", ur: "موطأ مالک 1716 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ يَزِيدَ بْنِ خُصَيْفَةَ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، أَنَّهُ قَالَ سَمِعْتُ عَائِشَةَ، زَوْجَ النَّبِيِّ تَقُولُ قَالَ رَسُولُ اللَّهِ \" لاَ يُصِيبُ الْمُؤْمِنَ مِنْ مُصِيبَةٍ حَتَّى الشَّوْكَةُ إِلاَّ قُصَّ بِهَا أَوْ كُفِّرَ بِهَا مِنْ خَطَايَاهُ \". لاَ يَدْرِي يَزِيدُ أَيَّهُمَا قَالَ عُرْوَةُ."
summary:
  ar: "حديث في موطأ مالك، رقم 1716، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 1716 (The Evil Eye), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 1716، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
