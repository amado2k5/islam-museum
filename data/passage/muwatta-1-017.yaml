label: { ar: "الموطأ 17 — بلاغ عن ابن عمر وزيد بن ثابت في إدراك الركعة", en: "Muwatta 17", es: "Muwatta 17", fr: "Muwatta 17", ur: "موطا 17", tr: "El-Muvatta 17 — İbn Ömer ve Zeyd ibn Sabit'ten rivayet edilen, rekatları telafi etme ile ilgili bir rapor.", id: "Al-Muwatta 17 — Sebuah riwayat dari Ibnu Umar dan Zayd ibn Thabit mengenai mengejar rakaat yang terlewat." }
summary:
  ar: "بلاغ في باب من أدرك ركعة من الصلاة: يروي مالك أنه بلغه أن عبد الله بن عمر وزيد بن ثابت كانا يقولان إن من أدرك الركعة فقد أدرك السجدة، أي أن إدراك الركوع مع الإمام إدراك للركعة كلها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.42}"
  en: "A mawquf report from two of the Successors that whoever catches the rak'a has caught the prayer."
  es: "Un informe mawquf de dos de los Sucesores dice que quien atrapa el rak'a ha atrapado la oración."
  fr: "Un rapport mawquf de deux des Successeurs selon lequel celui qui attrape la rak'a a attrapé la prière."
  ur: "دو جانشینوں سے موقوف روایت ہے کہ جس نے رکعت پکڑی اس نے نماز پکڑ لی۔"
  tr: "Namazın bir rekatı tutan kimseyle ilgili bir rivayet: Malik, Abdullah ibn Umar ve Zeyd ibn Sabit'in, namazın bir rekatı tutanın secdeye de katılmış sayıldığını, yani imamla birlikte rükûya katılmanın tüm rekatı tutmuş sayıldığını söylediklerini işittiğini rivayet eder. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtir. {cite:muwatta-maruf-1997 s.42}"
  id: "Sebuah riwayat mengenai orang yang mengikuti satu rakaat salat: Malik meriwayatkan bahwa ia mendengar Abdullah ibn Umar dan Zayd ibn Thabit biasa mengatakan bahwa siapa pun yang mengikuti satu rakaat salat telah mengikuti sujud, artinya mengikuti rukuk bersama imam dianggap mengikuti seluruh rakaat. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.42}"
