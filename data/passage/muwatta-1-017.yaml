label: { ar: "الموطأ 17 — بلاغ عن ابن عمر وزيد بن ثابت في إدراك الركعة", en: "Muwatta 17" }
summary:
  ar: "بلاغ في باب من أدرك ركعة من الصلاة: يروي مالك أنه بلغه أن عبد الله بن عمر وزيد بن ثابت كانا يقولان إن من أدرك الركعة فقد أدرك السجدة، أي أن إدراك الركوع مع الإمام إدراك للركعة كلها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.42}"
  en: "A mawquf report from two of the Successors that whoever catches the rak'a has caught the prayer."
