text: "… : نعم، قال : فإن كان الّذي أظن، فالله أشدّ نقمة، ولئن كان غيره لها أَيضاً، فصرفت عنه إِلى عمر، فلمَّا احتُضِرَ عمر فما أحِبُّ أَن يُقتل بي بريء. جعلها شورى بين ستة هو أحدهم، فلم يشك أنها لا تعدوه، …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 183، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
