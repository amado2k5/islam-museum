  fr: "Extrait du livre « al-Rawd al-Unuf » d'al-Suhayli (tome 3, p. 321) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le navigateur Testaments Browser."
  tr: "Suhayli'nin \"El-Ravd el-Enf\" adlı eserinin Resimli Cilt 3, sayfa 321'deki bir alıntısında bir mezar, bir türbe ve bir türbeden bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Rawd al-Anf karya Al-Suhayli, Jilid Bergambar 3, hlm. 321, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
