text: "… : لقد نزل لموت سَعْدِ بن مُعَاذٍ سيعون أَلْفَ مَلَكِ ما وطوًا الأرض قبلها، ويذكر أن قبرهَ وُجد منه رائحةُ المك، وقال: لو نجا أحد من ضَفْطَةِ القبر لنجامنها سعد، وفي كتاب الدِّلائل أن النى جلس على قبر سعد حين …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 321، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 321, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 321 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
