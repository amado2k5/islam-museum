label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2247 — جمع القرآن والمصاحف، نقط المصحف وشكله", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2247 — the collection of the Qur'an and the codices; the dotting and vowel marks of the mushaf", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2247 — جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب", es: "Al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, escaneo del volumen 3, pág. 2247: la colección del Corán y los códices; los puntos y las marcas vocálicas del mushaf.", fr: "al-Itqan fi 'Ulum al-Qur'an d'al-Suyuti, scan volume 3, p. 2247 — le recueil du Coran et des codex; les signes pointillés et vocaliques du mushaf", tr: "El-İtkan fi Ulumü'l-Kur'an, el-Suyuti, Resimli Cilt 3, s. 2247 — Kur'an'ın Derlenmesi ve Kodeksler, Aksan İşaretleri ve Kur'an'ın Sesli Harf Şekilleri", id: "Al-Itqan fi Ulum al-Qur'an karya al-Suyuti, Illustrated Volume 3, hal. 2247 — Kompilasi Al-Qur'an dan Naskah-naskah, Tanda Diakritik dan Bentuk Vokal Al-Qur'an" }
text: "… وخاتمةً سورة كذا. وقال مالك : لا بأس بالنَّقْط في المصاحف التي يتعلّم فيها الغلمان، أمَّا الأمهاتُ فلا. وقال الحَليمي : تكره كتابةُ الأعشارِ والأخماسِ وأسماءِ السور وعددِ في كتاب المصاحف برقم في إِسناده مغيرة بن مقسم، وهو مدلّس كما …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2247، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2247, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2247 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 2247, que menciona la colección del Corán y los códices, los puntos y las marcas vocálicas del mushaf, los alfabetos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de l'ouvrage d'al-Suyuti, al-Itqan fi 'Ulum al-Qur'an (tome 3, p. 2247), mentionne la compilation du Coran et des codex, la ponctuation et les signes vocaliques du mushaf, les écritures et l'art de l'écriture; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 3. cildinin 2247. sayfasından bir alıntı, Kur'an'ın derlenmesini ve el yazmalarını, diyakritik işaretleri ve biçimlerini, çeşitli yazı ve üslupları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 3, halaman 2247, membahas penyusunan Al-Qur'an dan manuskripnya, tanda diakritik dan bentuknya, serta berbagai aksara dan gaya penulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
