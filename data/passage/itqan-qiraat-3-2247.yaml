label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2247 — جمع القرآن والمصاحف، نقط المصحف وشكله", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2247 — the collection of the Qur'an and the codices; the dotting and vowel marks of the mushaf", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2247 — جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب" }
text: "… وخاتمةً سورة كذا. وقال مالك : لا بأس بالنَّقْط في المصاحف التي يتعلّم فيها الغلمان، أمَّا الأمهاتُ فلا. وقال الحَليمي : تكره كتابةُ الأعشارِ والأخماسِ وأسماءِ السور وعددِ في كتاب المصاحف برقم في إِسناده مغيرة بن مقسم، وهو مدلّس كما …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2247، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2247, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2247 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
