text: |-
  مادّة نخز ساقظة.ن جل التسخ
  كاترجم
  ٤٢٨
  (باب الزاى
  ⁦(تكز)⁩
  أ الرجل حاجته وتنجزها أى استجحها والناجز الحاضر يقال بعته ناجزا بنا جز كة ولك
  يدا بيد أى تعجيلا بتعجيل قال الشاءر
  واذا تياشرك الهمو • م فانه كال وناجز
  وفى الحديث لا تبيعوا الاحاضر ابناجز ⁦(نحز)⁩ النحز الدفع والنحس وقد غزته برجلى
  أى ركاته قال ذوالرمة
  والعيس من عاسج أو واسج خيبا • ينحزن فى جانبها وهى تنسلب
  والنحز الدق بالمتدازوه والهاون يقال الراكب يتحز بصدره واسطة الرحل أى يدق والنحاز
  داء يأخذ الابل فى رئاتها فتسعل سعالاشديد ايقال بعيرنا حزوبه نحاز قال الشاعر
  أكوبه إما أراد الكىّ معترضا * كى المطنى من التحز الطنى الطحلا
  والانحزان النحاز والقرح وهمادا آن يميبان الابل يقال احز القوم أى أصاب ابلهم النحاز
  والفاحز أيضا أن يصيب مرفق البعيركر كرته فيقال به ناحز أبوزيد نحزه فى صدره مشسل نحزه
  اذاضر به بالجمع والنحيزة الطبيعة والنحيتة والنهائز النحائت وأماقول الشماخ
  وعارضها فى بطن دورة مسعدا * على طرق كأنمن نحائر
  فيقال الحيزة شىء ينسبح أعرض من الحزام يخاط على طرف شقة البيت ويقال الحسيزة من
  الأرض كالطبة عمدودة فى بطان من الارض محوا من ميل أو أكثر ⁦(نخز)⁩ نخزت
  الرجل وغيره وجاته وجما بحد وبكلام أوجعته نزز النزوالنزما يحلب فى الارضمن
  الماء وقد أنزت الارض صارت ذات نزوالنز الرجل الخفيف الذكى الفؤاد حكاه أبوعبيد
  وظليم نزلا يستقرّفى مكان وناقة نزة خفيفة ونزالظبى ينزنويزا أى ع_دا وكذلك اذاصوّت عن
  أب انجراح حكاه الكسائى ⁦(نشز)⁩ التشزوالشز المكان الموتفع وجمع النشرنشوز
  وجمع النشز أنشاز ونشازمثل جبل وأجبال وجبال وأما النشاز بالفتح فهوالمكان المرتفع
  وهو واحد يقال اقعد على ذلك النشازابن السكيت يقال الرجل اذا أسن ولم ينقص فلان
  واللّٰه نشز من الرجال ونشز الرجل ينشز وينشز نشزا ارتفع فى المكان ومنه قوله تعالى
  واذا قيل انشزوا فانشزواو إنشازعظام الميت رفعها الى واضعها وتركيب بعضها على
  بعض ومنه قرأزيد بن نابت رضى اللّٰه عنه كيف تنشزها ونشزت المرأة تنشز وتنشز نشوزا
  و اذا استعصت على بعلها وأبغضته ونشز بعلها عليها اذاضربهاوجفاها ومنه قوله تعالى
  وان امرأة حافت من بعلها نشوزا (نفز الاصمعى تفزالظبي يتفزنفزانا أى وثب قال
  الراجز اراحة الجداية النفوز والمرأة تننزولدها أى ترقصه وأنفزت السهسم على
  ظفرى اذا أدرته وكذلك نقزته تنفيزا ( قز قز الغلي فى عدوه ينقزنقزاوثة زانا أى وثب
  والتنقيز التوثيب والنقازداء يأخذ الغنم قسنة زمنه -تى تموت مثل التزاء والنقز بالتحريك
  رذال المال وأنشد الاصمعى
  أخذت بكرانة زامن النقز * وناب سو-قزامن القمز
  والنة زبكسر النون مثله (نكز نكزت البتربائفح تنكز نكزا فنى ماؤها وفيه اغة
  أخرى نكزت بالكسر تنكز نكزاوأنكزها أصحابها فهى بترنا كزأى تليلة الما قال ذوالرمة
  على
