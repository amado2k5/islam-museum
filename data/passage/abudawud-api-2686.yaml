label: { ar: "سنن أبي داود 2686 — الأب والأبوة", en: "Sunan Abi Dawud 2686 — the father and fatherhood", ur: "سنن ابی داؤد 2686 — باپ اور والدیت", es: "Sunan Abi Dawud 2686 — El padre y la paternidad", fr: "Sunan Abi Dawud 2686 — Le père et la paternité" }
text: "… قَالَ أَرَادَ الضَّحَّاكُ بْنُ قَيْسٍ أَنْ يَسْتَعْمِلَ، مَسْرُوقًا فَقَالَ لَهُ عُمَارَةُ بْنُ عُقْبَةَ أَتَسْتَعْمِلُ رَجُلاً مِنْ بَقَايَا قَتَلَةِ عُثْمَانَ فَقَالَ لَهُ مَسْرُوقٌ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْعُودٍ - وَكَانَ فِي أَنْفُسِنَا مَوْثُوقَ الْحَدِيثِ - أَنَّ النَّبِيَّ لَمَّا أَرَادَ قَتْلَ أَبِيكَ قَالَ مَنْ لِلصِّبْيَةِ قَالَ \" النَّارُ \". فَقَدْ رَضِيتُ لَكَ مَا رَضِيَ لَكَ رَسُولُ اللَّهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2686، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2686 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2686، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2686 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2686 (Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
