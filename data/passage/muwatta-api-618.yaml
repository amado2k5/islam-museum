text: "… الصَّدَقَةِ فَقُلْتُ بَلْ مِنْ نَعَمِ الْجِزْيَةِ. فَقَالَ عُمَرُ أَرَدْتُمْ - وَاللَّهِ - أَكْلَهَا. فَقُلْتُ إِنَّ عَلَيْهَا وَسْمَ الْجِزْيَةِ. فَأَمَرَ بِهَا عُمَرُ فَنُحِرَتْ وَكَانَ عِنْدَهُ صِحَافٌ تِسْعٌ فَلاَ تَكُونُ فَاكِهَةٌ وَلاَ طُرَيْفَةٌ إِلاَّ جَعَلَ مِنْهَا فِي تِلْكَ الصِّحَافِ فَبَعَثَ بِهَا إِلَى أَزْوَاجِ النَّبِيِّ وَيَكُونُ الَّذِي يَبْعَثُ بِهِ إِلَى حَفْصَةَ ابْنَتِهِ مِنْ آخِرِ ذَلِكَ فَإِنْ كَانَ فِيهِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 618، يذكر السم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 618 (Zakat), that mentions poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 618، جس میں زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
