text: "حَدَّثَنَا يُوسُفُ بْنُ مُوسَى، حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، عَنْ إِسْرَائِيلَ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْبَرَاءِ، قَالَ بَعَثَ رَسُولُ اللَّهِ إِلَى أَبِي رَافِعٍ الْيَهُودِيِّ رِجَالاً مِنَ الأَنْصَارِ، فَأَمَّرَ عَلَيْهِمْ عَبْدَ اللَّهِ بْنَ عَتِيكٍ، وَكَانَ أَبُو رَافِعٍ يُؤْذِي رَسُولَ اللَّهِ وَيُعِينُ عَلَيْهِ، وَكَانَ فِي حِصْنٍ لَهُ بِأَرْضِ الْحِجَازِ، فَلَمَّا دَنَوْا مِنْهُ، وَقَدْ غَرَبَتِ الشَّمْسُ، وَرَاحَ النَّاسُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4039، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4039 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4039، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
