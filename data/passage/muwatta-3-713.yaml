label: { ar: "الموطأ 713 — مالك: الغنم تتوالد قبل مجيء المصدق بيوم فتبلغ النصاب بولادتها فعليه فيها الصدقة، لأن ولادة الغنم منها", en: "Muwatta 713" }
summary:
  ar: "قول لمالك في الرجل تكون له الغنم لا تجب فيها الصدقة فتوالد قبل أن يأتيها المصدق بيوم واحد فتبلغ النصاب بولادتها: إذا بلغت الغنم بأولادها ما تجب فيه الصدقة فعليه فيها الصدقة، لأن ولادة الغنم منها، وذلك مخالف لما أُفيد منها باشتراء أو هبة أو ميراث؛ ومثل ذلك العرض لا يبلغ ثمنه النصاب ثم يبيعه صاحبه فيبلغ بربحه النصاب فيصدّق ربحه مع رأس المال، ولو كان ربحه فائدة أو ميراثاً لم تجب فيه الصدقة حتى يحول عليه الحول. فغذاء الغنم منها كما ربح المال منه، غير أن ذلك يختلف في وجه آخر: أن من كان له من الذهب أو الورق نصاب ثم أفاد إليه مالاً ترك الفائدة حتى يحول عليها الحول، ولو كانت له ماشية فيها نصاب ثم أفاد إليها بعيراً أو بقرة أو شاة صدّقها مع صنفها حين يصدقه. ويقول مالك: وهذا أحسن ما سمعت في هذا كله. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.357} {cite:muwatta-maruf-1997 p.358}"
