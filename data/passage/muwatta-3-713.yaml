label: { ar: "الموطأ 713 — مالك: الغنم تتوالد قبل مجيء المصدق بيوم فتبلغ النصاب بولادتها فعليه فيها الصدقة، لأن ولادة الغنم منها", en: "Muwatta 713", es: "Muwatta 713", fr: "Muwatta 713", ur: "موطا 713", tr: "Al-Muwatta 713 — Malik: Koyunlar vergi tahsildarının gelişinden bir gün önce yavrularlar ve yavruları zekât için asgari eşiğe ulaşır; bu nedenle zekât onlara aittir, çünkü koyunların doğumu onlardan kaynaklanır.", id: "Al-Muwatta 713 — Malik: Domba melahirkan sehari sebelum kedatangan pemungut pajak, dan kelahiran mereka mencapai ambang batas minimum zakat, sehingga zakat wajib dibayarkan atas mereka, karena kelahiran domba berasal dari mereka." }
summary:
  ar: "قول لمالك في الرجل تكون له الغنم لا تجب فيها الصدقة فتوالد قبل أن يأتيها المصدق بيوم واحد فتبلغ النصاب بولادتها: إذا بلغت الغنم بأولادها ما تجب فيه الصدقة فعليه فيها الصدقة، لأن ولادة الغنم منها، وذلك مخالف لما أُفيد منها باشتراء أو هبة أو ميراث؛ ومثل ذلك العرض لا يبلغ ثمنه النصاب ثم يبيعه صاحبه فيبلغ بربحه النصاب فيصدّق ربحه مع رأس المال، ولو كان ربحه فائدة أو ميراثاً لم تجب فيه الصدقة حتى يحول عليه الحول. فغذاء الغنم منها كما ربح المال منه، غير أن ذلك يختلف في وجه آخر: أن من كان له من الذهب أو الورق نصاب ثم أفاد إليه مالاً ترك الفائدة حتى يحول عليها الحول، ولو كانت له ماشية فيها نصاب ثم أفاد إليها بعيراً أو بقرة أو شاة صدّقها مع صنفها حين يصدقه. ويقول مالك: وهذا أحسن ما سمعت في هذا كله. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.357} {cite:muwatta-maruf-1997 p.358}"
  tr: "Malik, zekâtı verilmeyen koyunları olan ve zekât toplayıcısının gelmesinden bir gün önce yavruları doğan ve yavrularının nisap (zekât için asgari eşik) değerine ulaşan bir adam hakkında şöyle demiştir: Koyunlar ve yavruları nisap değerine ulaşırsa, adam onlara zekât vermek zorundadır; çünkü yavrular koyunların bir parçasıdır ve bu, satın alma, bağış veya miras yoluyla elde ettiği şeyden farklıdır. Benzer şekilde, değeri nisap değerine ulaşmayan bir mal satılır ve kârı nisap değerine ulaşırsa, kâr anapara ile birlikte zekât olarak verilir. Kâr faiz veya mirastan elde edilmişse, zekât bir yıl geçene kadar verilmez. Koyunun yemi koyundan gelir, tıpkı sermayeden elde edilen kâr gibi. Ancak bu durum başka bir açıdan farklıdır: Bir kimse nisap değerine ulaşan altın veya gümüşe sahipse ve daha sonra daha fazla para kazanırsa, kârı bir yıl geçene kadar zekât olarak bırakır. Eğer nisab sınırına ulaşmış hayvanları varsa ve sonra bir deve, inek veya koyun edinirse, zekâtını diğer hayvanlarıyla birlikte verir. Malik şöyle demiştir: Bu konuda duyduğum en iyi görüş budur. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.357} {cite:muwatta-maruf-1997 s.358}"
  id: "Malik berkata tentang seorang pria yang memiliki domba yang belum wajib dizakati, dan domba-domba tersebut melahirkan anak sehari sebelum pemungut zakat datang, dan anak-anaknya mencapai nisab (batas minimum untuk zakat): Jika domba beserta anak-anaknya mencapai nisab, maka ia wajib membayar zakat atas mereka, karena anak-anak tersebut merupakan bagian dari domba, dan ini berbeda dengan apa yang ia peroleh dari mereka melalui pembelian, hadiah, atau warisan. Demikian pula, jika suatu barang yang nilainya belum mencapai nisab dijual dan keuntungannya mencapai nisab, maka keuntungan tersebut diberikan sebagai zakat bersama dengan pokoknya. Jika keuntungan tersebut berasal dari bunga atau warisan, zakat tidak wajib dibayarkan sampai satu tahun berlalu. Pakan domba berasal dari domba itu sendiri, begitu pula keuntungan dari modal. Namun, hal ini berbeda dalam aspek lain: Jika seseorang memiliki emas atau perak yang mencapai nisab dan kemudian memperoleh lebih banyak uang, ia membiarkan keuntungan tersebut sampai satu tahun berlalu. Jika ia memiliki ternak yang mencapai nisab dan kemudian memperoleh unta, sapi, atau domba, ia membayar zakat atasnya bersama dengan ternak lainnya ketika ia membayar zakat. Malik berkata: Ini adalah pendapat terbaik yang pernah saya dengar tentang semua ini. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.357} {cite:muwatta-maruf-1997 p.358}"
