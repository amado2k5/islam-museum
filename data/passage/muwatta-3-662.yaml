label: { ar: "الموطأ 662 — مالك: خمسة دنانير تجر فيها فبلغت النصاب قبل الحول بيوم أو بعده بيوم يزكيها", en: "Muwatta 662", es: "Muwatta 662", fr: "Muwatta 662", ur: "موطا 662", tr: "El-Muvatta 662 — Malik: Yıl bitimine bir gün kala veya bir gün sonra alınıp satılan ve asgari miktara (nisaba) ulaşan beş dinar için zekât ödenmesi gerekir.", id: "Al-Muwatta 662 — Malik: Lima dinar yang diperdagangkan dan mencapai jumlah minimum (nisab) sehari sebelum atau sehari setelah tahun berakhir, maka zakat wajib dibayarkan atasnya." }
summary:
  ar: "قول لمالك في رجل له خمسة دنانير من فائدة أو غيرها فتجر فيها فلم يأت الحول حتى بلغت ما تجب فيه الزكاة: أنه يزكيها وإن لم تتم إلا قبل أن يحول عليها الحول بيوم واحد أو بعده بيوم واحد، ثم لا زكاة فيها حتى يحول عليها الحول من يوم زُكيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.337}"
  tr: "Malik, faiz veya başka kaynaklardan elde ettiği beş dinarı yatırıma yatıran ve bir yıl geçmeden zekât tutarına ulaşan bir adam hakkında şöyle demiştir: Yıl dolmadan bir gün önce veya bir gün sonra bile zekâtını ödemesi gerekir. Ancak, zekâtın ödendiği günden itibaren bir yıl geçene kadar zekât gerekmez. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.337}"
  id: "Malik berkata tentang seseorang yang memiliki lima dinar hasil bunga atau sumber lain, yang diinvestasikannya, dan sebelum satu tahun berlalu, jumlahnya mencapai batas zakat: ia wajib membayar zakat atasnya meskipun hanya satu hari sebelum atau satu hari setelah satu tahun berlalu. Maka tidak ada zakat yang wajib dibayarkan hingga satu tahun berlalu sejak tanggal pembayaran. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.337}"
