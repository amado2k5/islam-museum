  اليه بيده ليأخذه قال الاصمعى أهويت بالشئ اذا أو. أت به وية ال أهوبت له بالسسيف
  والهوّة الوهدة العميقة والاهوية على أفعولة مثلها والهوى والمهواة مابين الجبلين وغحو
  ذلك وتهاوى القوم فى المهواة اذاسة طبعضهم فى اتربعض قال الشيبانىّ المهاواة الملاحة
  والمهاواة شذة السير وأنشد
  فلم تستطع ممهاواتنا السرى * ولاليل عيس فى البرين خواضع
  ومضى هوىّ من الليل على فعيل أى هزيع منه واستهواه الشيطان أى استهامه أبو عبيد
  الهوهاءة بالمدالاحق ويقال ما أدرى أى هىّ بن بت هو معناه أىّ اللحلق هو وهيان بن
  سان كما يقال طاهر بن طامر لم لا يعرف أبوه وهاوية اسم من أسماء الناروهى معرفة بغير
  ألف ولام قال تعالى فأته هاوية يقول مستر. ال.ار والهاوية المهواة وقال
  اعمرولونالتك أرماحنا * كنت كن تهوى به الهاويه
  .تقول هوت أمّه فهى هاوية أى ناكلة قال كعب بن سعد الغنوى برق أناه
  هوت أمه ما يبعث الصبح غاديا • وماذايؤدى الليل حيز يؤب
  والهواهى الباطل واللغومن القول قال ابن أحو
  أفى كل يوم تدعوان أطبة * الوما يجدون الا الهواهيا
  الكسائى يقال ياهىّ مالى لايه مزمعناه ياعجبا وما فى. وضع رفع
  صل الياء دى اليد أصلها يدى على فعل ساكنة العين لان بهعها أيدويدى
  وهذاجمع فعل مثل فلس وأفلس وفلوس ولا يجمع فعل على أفعل الافى حروف ييرة معدودة
  مشل زمن وأزمن وجبل وأجبل وعصارأعص وقد بجعت الايدى فى الشعر على أياد قال
  الشاعر» قطن سخام بأيادى غزل » وهو ججع الجمع مثل أكرع وأكارع وأماقول الشاعر
  فطوت بمفصل فى يعملات * دوامى الايد يخيطن السريحا .
  ذهولغة لبعض العرب يحذفون الياء من الاصل مع الالف واللام فية ولون فى المهتدى
  المهتدكايه ذفونها مع الاضافة فى مثل قول الشاعر
  كنواح ريش حامة تحدية * وسصت باللفتنعمف الاعمد
  أراد كنواحى فذف ال.الما أضاف كما كان يحذفهامع التنوين والذاهب منها الساءلان
  تصغير هائدية بالتشديد لاجتماع الياءين وبعض العرب يقول لليديدامثل رحا قال الراجز
  يارب ساربات ماتوسدا • الاذراع العفس أوكف اليدا
  وتثفيتها على هذه اللغة يديان مثل رحيان قال الشاءر
  يديان يضاوان عند عرق • قد يتفعانك منهما أن تهضها
  واليد القوّة وأيده أى قواه ومالى بفلان يدان أى طاقة قال تمالى والسماء بنيناها بايد وقوله
  تعالى حتى يعطوا الجزية عن يدأى عن ذلة واستسلام ويقال نقد الانسبئة واليد النعمة
  والاحسان تصطنعه وتجمع على يدى" ويدى مثل عدىّ وعصىّ قال الشاعر
  فان له عندى يديا و أنعما * وانافتح الإكراهة لتوالى السكسرات ولك أن تضمها وتجمع
