text: "… إذا فعل ذلك لأيُعَاد. ولا يُظَنَّ بكلِّ من كان فى الجاهلية أَنه كان كافراً، فقد كان جماعة تحنَّفُوا وتركوا ما كان عليه أَهل الشرك وتمسكوا بدِين إبراهيم وهو التوحيد، كزيد بن عمرو بن نُفَيْل وقُسَ بن ساعدة وورَقة بن نَوْفل، …"
