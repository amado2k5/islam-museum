label: { ar: "موطأ مالك 1615 — ما خلّفه من تركة وميراث", en: "Muwatta Malik 1615 — what was left behind: estate and inheritance", ur: "موطأ مالک 1615 — ترکہ اور میراث", es: "Muwatta Malik 1615 — lo que dejó: patrimonio y herencia", fr: "Muwatta Malik 1615 — Ce qui a été laissé derrière: domaine et héritage", tr: "Muwatta Malik 1615 — Geride bıraktığı miras ve vasiyetler", id: "Muwatta Malik 1615 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… يَجْتَمِعُ دِينَانِ فِي جَزِيرَةِ الْعَرَبِ \" فَأَجْلَى يَهُودَ خَيْبَرَ. قَالَ مَالِكٌ وَقَدْ أَجْلَى عُمَرُ بْنُ الْخَطَّابِ يَهُودَ نَجْرَانَ وَفَدَكَ فَأَمَّا يَهُودُ خَيْبَرَ فَخَرَجُوا مِنْهَا لَيْسَ لَهُمْ مِنَ الثَّمَرِ وَلاَ مِنَ الأَرْضِ شَىْءٌ وَأَمَّا يَهُودُ فَدَكَ فَكَانَ لَهُمْ نِصْفُ الثَّمَرِ وَنِصْفُ الأَرْضِ لأَنَّ رَسُولَ اللَّهِ كَانَ صَالَحَهُمْ عَلَى نِصْفِ الثَّمَرِ وَنِصْفِ الأَرْضِ فَأَقَامَ لَهُمْ عُمَرُ نِصْفَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1615، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1615 (Madina), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "موطأ مالک کی حدیث نمبر 1615، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Muwatta Malik, n.º 1615 (Medina), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un rapport du Muwatta Malik n° 1615 (Médine) mentionne les biens et l'héritage laissés après la mort. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
  tr: "Malik'in Muwatta'sında yer alan 1615 numaralı hadis, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi vermektedir. Bu hadis, vasiyetnameler, miras, tarihi yerler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1615, menyebutkan apa yang ditinggalkannya berupa harta warisan. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, situs bersejarah, dan makam suci, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
