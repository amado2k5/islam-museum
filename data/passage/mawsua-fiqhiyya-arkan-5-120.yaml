text: "… حج النقل من أفضل الأعمال، فعن أبي هريرة قال: سئل رسول اللّٰه وليق أي العمل أفضل؟ فقال : إيمان بالله ورسوله، قيل: ثم ماذا؟ قال : الجهاد في سبيل الله، قيل: ثم ماذا؟ قال : حج مبرور. وعن عائشةا قالت: …"
summary:
