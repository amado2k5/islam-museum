text: "… حج النقل من أفضل الأعمال، فعن أبي هريرة قال: سئل رسول اللّٰه وليق أي العمل أفضل؟ فقال : إيمان بالله ورسوله، قيل: ثم ماذا؟ قال : الجهاد في سبيل الله، قيل: ثم ماذا؟ قال : حج مبرور. وعن عائشةا قالت: …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 5، ص 120، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 5, p. 120, that mentions faith as the best of deeds, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 5، ص 120 کا اقتباس جس میں ایمان بہترین عمل، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 5, pág. 120, que menciona la fe como la mejor de las obras, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de l'Encyclopédie koweïtienne de Fiqh (tome 5, p. 120) mentionne la foi comme la meilleure des actions, un des articles de foi. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 5, sayfa 120'den bir alıntı, imanın en hayırlı amel ve imanın direği olduğunu belirtmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın direkleri, imanın direkleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 5 Bergambar, halaman 120, menyebutkan iman sebagai amal terbaik dan salah satu rukun iman; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
