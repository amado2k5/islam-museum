text: |-
  ٥٢4
  ابيض مؤخرها واسودسارها وعكت المرأشعرها اذالم زسله وري قالوا عكافلان على
  قومه أى عطف مثل قولهم على على قومه (علا% علافى المكان بعلوءاواوعلى فى
  الشرف بالكسريعلى علاويقال أيضاعلا بالفتح يعلا قال رؤية لما علا كعبك بى عليت
  فجمع بين اللغتسين وفلان من علية الناس وهوجع رجل ء-لىّ أى شريف رفيع مثل صبى
  وصبية وعلوت الرجل غلبته وعلوته بالسيف ضرشه وعلافى الارض تسكبرءاوا فى هذا كل
  وعلو الداروعلوها نقيض سفلها ويقال أتيته من عل الداربكسر اللام أى من عال قال
  امر ؤالقيس• كلمود صخر حطه السيل من عل * وأتيته من علا قال أبو النجم .
  باتت تنوش الحوض نوشا من علا • نوشابه تقطع أجواز القلا
  وأتيته من عل بضم اللام وأنشديعقوب لعدى بن زيد
  فى كاس ظاهرتستره • من عل الشفان هداب الفتن
  وأمَاقول أوس
  ذلك بالليط الذى تحت قشره • كفرقئ مض كنه القمض من علو
  فانّ الواوزائدة وهى لا طلاق القسافية ولا يجوز مثله فى الكلام وأتيته من عال وأنشديعة وب
  لدكين بن رجاء • طم أى النسامر تحت ريا من عال • يعنى أرسا وأتيته من معال بضم الميم
  قال ذوالرمّة * ونغضان الرحل من معال، وأماقول أعشى باهلة
  انى أتنى لان لا أسرّبها * من علولاعجب منها ولا منخر
  فيروى بضم الواووفتعها وكسرها أى أتانى خبر من أعلى تجد ويقال عال عن واعل عنى
  أى تنح عنى واعل عن الوسادة وعال علىّ أى احل وقول أمية بن أبى الصلت
  سلع ما ومثله عشرماء عائل ما وعالت البيقورا
  أى أن السنة الجدية أثقلت البقربماحات من السلع والعشر ويقال كن علاوة الريح
  وسفالها فعلاوتها أن تكون فوق الصيد وسفالتها أن تكون تحت الصيدلثلا يجد الوحسْ
  رائحتك والعلياه كل مكان مشرف والعلاء والعلاء الرفعة والشرف وكذلك المعلاة والمع
  المعالى والعلاة حجر يجعل على ه الاقط وقال الراجز
  لا تنفع الشاوى فيهاشاته • ولاحاراه ولاعلاته
  والعلاة السندان واجهع العلا وبقال للناقة علاة تن به بها فى صلابتها بقال ناقة علاة الحلق
  قال الشاءر • جاوزتها بعلاة الخلق عليدان • أى طويلة جسمة ويقال رجل عليان مثال
  عماشان وكذلك المرأة يستوى فيه المذكروالمؤنت وأنشد أيو على
  ومتلف بين موماة ومهلكة • جاوزته بعلاة الخلق عليان
  والعالية ما فوق نجد الى أرض تهامة والى ماوراءمكة وهى الجاز وما والاها والنسبة اليها
  عالىّ ويقال أيضاعلوى على غيرقياس ويقال عال الرجل وأعلى اذا أتى عالية قد والعلمة
  لغرفة والججع العلالىّ وهو فعيلة مثل مريقة وأصله عليوة فابدات الواوياء وأدغمت لان هذ.
  الواواذاسكر ماقبلها صحت كما يذسب الى الدلودلوى وهو من علوت وقال بعضهم هى
  العلية بالكسر على فعيلة وبعضهم يجعلها من المضاعف ووزنها فعلية قال وايس فى الكلام
  فعيلة وعالية الرمح مادخل فى السنان الى ثلمثه والمعلى مفتح اللام السابع من سهام الميسرحكاه
