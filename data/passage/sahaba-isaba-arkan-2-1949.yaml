text: "… السوية من الأرض إذ سألك إنما هي الدهناء مقيد الجمل وأخرجه ابن سعد من طريق ابن خثيم مطولاً. ومرعى الغنم ونساء بني تميم وأبناؤها وراء ذلك؛ فقال : وأخرجه أبن السَّكَنِ. أمسك يا غلام صدقت المسكينة المسلم أخو المسلم ووقع …"
