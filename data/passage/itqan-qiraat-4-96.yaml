text: "… وسلم سورا ً ولاء على أن ترتيبها كذلك. وحينئذ فلا يرد حديث قراءته النساء قبل آل عمران، لأن ترتيب ا لسور في القراء ليس بواجب، ولعله فعل ذلك لبيان الجواز. وأخرج ابن أشتة في كتاب المصاحف من طريق ابن وهب …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 4، ص 96، يذكر القراء، وجمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 4, p. 96, that mentions the readers, the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 4، ص 96 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 4, pág. 96, que menciona a los lectores, la colección del Corán y los códices, los sistemas de escritura y el arte de escribir; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 4, page 96, mentionnant les lecteurs, la compilation du Coran et les codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Suyuti'nin Al-Itqan fi Ulum al-Qur'an adlı eserinin 4. cildinin 96. sayfasından bir alıntı; Kur'an okunuşlarını, Kur'an'ın derlenmesini ve el yazmalarını, çeşitli yazı ve üslupları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 4, halaman 96, yang membahas bacaan Al-Qur'an, penyusunan Al-Qur'an dan manuskripnya, serta berbagai aksara dan gaya penulisan. Cuplikan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Cuplikan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
