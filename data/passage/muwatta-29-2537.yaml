label: { ar: "الموطأ 2537 — سعيد بن المسيب وسليمان بن يسار: تغليظ الدية في الشهر الحرام", en: "Muwatta 2537", es: "Muwatta 2537", fr: "Muwatta 2537", ur: "موطا 2537", tr: "Al-Muwatta 2537 — Sa'id ibn al-Musayyab ve Süleyman ibn Yesar: Haram ayda kan parasının arttırılması", id: "Al-Muwatta 2537 — Sa’id ibn al-Musayyab dan Sulayman ibn Yasar: Meningkatkan uang darah di bulan suci" }
summary:
  ar: "حدث مالك أنه بلغه أن سعيد بن المسيب وسليمان بن يسار سُئلا: أتغلظ الدية في الشهر الحرام؟ فقالا: لا، ولكن يُزاد فيها للحرمة. فقيل لسعيد: هل يزاد في الجراح كما يزاد في النفس؟ فقال: نعم. {cite:muwatta-maruf-1997 p.439}"
  tr: "Malik, Said ibn el-Musayyab ve Süleyman ibn Yasar'a şöyle sorulduğunu işittiğini rivayet etmiştir: \"Kutsal aylarda kan parası artar mı?\" Onlar da \"Hayır, ancak kutsallık nedeniyle artar\" diye cevap verdiler. Bunun üzerine Said'e, \"Can kaybı için olduğu gibi yaralanmalar için de kan parası artar mı?\" diye soruldu. O da \"Evet\" diye cevap verdi. {cite:muwatta-maruf-1997 s.439}"
  id: "Malik meriwayatkan bahwa ia mendengar Sa'id ibn al-Musayyab dan Sulayman ibn Yasar ditanya: Apakah uang ganti rugi darah dinaikkan selama bulan-bulan suci? Mereka menjawab: Tidak, tetapi dinaikkan karena kesuciannya. Sa'id kemudian ditanya: Apakah uang ganti rugi darah dinaikkan untuk luka seperti halnya untuk nyawa? Dia menjawab: Ya. {cite:muwatta-maruf-1997 p.439}"
