label: { ar: "سنن النسائي 5405 — الأب والأبوة", en: "Sunan al-Nasa'i 5405 — the father and fatherhood", ur: "سنن نسائی 5405 — باپ اور والدیت", es: "Sunan al-Nasa'i 5405 — El padre y la paternidad", fr: "Sunan al-Nasa'i 5405 — Le père et la paternité" }
text: "… حَدَّثَنَا يَحْيَى بْنُ مَعِينٍ، قَالَ حَدَّثَنَا هِشَامُ بْنُ يُوسُفَ، وَعَبْدُ الرَّزَّاقِ، عَنْ مَعْمَرٍ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، قَالَ بَعَثَ النَّبِيُّ خَالِدَ بْنَ الْوَلِيدِ إِلَى بَنِي جَذِيمَةَ فَدَعَاهُمْ إِلَى الإِسْلاَمِ فَلَمْ يُحْسِنُوا أَنْ يَقُولُوا أَسْلَمْنَا فَجَعَلُوا يَقُولُونَ صَبَأْنَا وَجَعَلَ خَالِدٌ قَتْلاً وَأَسْرًا - قَالَ - فَدَفَعَ إِلَى كُلِّ رَجُلٍ أَسِيرَهُ حَتَّى إِذَا أَصْبَحَ يَوْمُنَا …"
summary:
  ar: "حديث في سنن النسائي، رقم 5405، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5405 (The Book of the Etiquette of Judges), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5405، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5405 (El Libro de la Etiqueta de los Jueces), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5405 (Le Livre de l'Étiquette des Juges), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
