summary:
  ar: "القسم 76 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطب»، ويضم فيها النصوص من 5678 إلى 5782 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 76 of Sahih al-Bukhari (Medicine) in the division of the open hadith dataset the museum took its reports from: reports 5678 to 5782 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 76، عنوان «کتاب الطب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5678 تا 5782۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 76 de Sahih al-Bukhari (Medicina) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5678 al 5782, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
