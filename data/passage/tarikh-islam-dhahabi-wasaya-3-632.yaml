text: "… القوم قالوا : هو واللَّهِ أبو ذرّ. فقال رسول الَّه و فه يرحم اللَّه أبا ذَرّ، يَمْشِي وَحْدَه، ويموت وحدَه، ويُبعث وحده. فضرب الدهرُ من ضَرْبه، وسُيِّر أبو ذَرّ إلى الرَّبَذة، فلما حضره الموتُ أوْصى امرأته وغلامه: إذا متّ فاغسلاني …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 3، ص 632، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 3, p. 632, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 3، ص 632 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 3, pág. 632, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 3, page 632, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "El-Dhahabi'nin *İslam Tarihi* adlı eserinin 3. cildinin 632. sayfasından bir alıntı, vasiyetname veya son miras ve ölüm anından bahsetmektedir; makineyle okunabilir baskıdan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 3, halaman 632, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; diambil dari edisi yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
