label: { ar: "صحيح مسلم 4515 — ما لا يحل", en: "Sahih Muslim 4515 — what is not lawful", ur: "صحیح مسلم 4515 — جو حلال نہیں", es: "Sahih Muslim 4515 — lo que no es lícito", fr: "Sahih Muslim 4515 — ce qui n'est pas licite" }
text: "… الْمُثَنَّى، حَدَّثَنَا أَبُو بَكْرٍ، - يَعْنِي الْحَنَفِيَّ - حَدَّثَنَا عَبْدُ الْحَمِيدِ، بْنُ جَعْفَرٍ حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ، أَنَّهُ سَمِعَ أَبَا شُرَيْحٍ الْخُزَاعِيَّ، يَقُولُ سَمِعَتْ أُذُنَاىَ، وَبَصُرَ، عَيْنِي وَوَعَاهُ قَلْبِي حِينَ تَكَلَّمَ بِهِ رَسُولُ اللَّهِ. فَذَكَرَ بِمِثْلِ حَدِيثِ اللَّيْثِ وَذَكَرَ فِيهِ \" وَلاَ يَحِلُّ لأَحَدِكُمْ أَنْ يُقِيمَ عِنْدَ أَخِيهِ حَتَّى يُؤْثِمَهُ \". بِمِثْلِ مَا فِي حَدِيثِ وَكِيعٍ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4515، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 4515 (The Book of Lost Property), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 4515، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 4515 (El Libro de los Bienes Perdidos), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 4515 (Le Livre des objets perdus), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
