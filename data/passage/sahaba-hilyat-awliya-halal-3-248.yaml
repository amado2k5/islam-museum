text: "… مثل ما دخلت فيه ? وهل تراه ادخر لك خيراً منعوه ؟ أو علمك شيئا جهلوه أبل جهلت ما ابتليت به من حالك فى صدور العامة، وكلفهم بك أن صاروا يقتدون برأيك ويعملون بأمرك، إن أحللت أحلوا، وإن حرمت حرموا، …"
