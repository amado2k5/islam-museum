label: { ar: "الموطأ 1144 — رقية مولاة عمرة بنت عبد الرحمن: قصّت عمرة من شعرها يوم التروية، ثم ذبحت شاة يوم النحر", en: "Muwatta 1144", es: "Muwatta 1144", fr: "Muwatta 1144", ur: "موطا 1144", tr: "El-Muvatta 1144 — Umrah bint Abdülrahman'ın azatlı kölesi Rukayye: Umrah, Tarviye Günü'nde saçlarından bir kısmını kesti, sonra Kurban Günü'nde bir koyun kesti.", id: "Al-Muwatta 1144 — Ruqayyah, budak yang dibebaskan oleh Umrah binti Abd al-Rahman: Umrah memotong sebagian rambutnya pada Hari Tarwiyah, kemudian dia menyembelih seekor domba pada Hari Kurban." }
text: "فأخَذَتْ من قُرونِ رأسِها"
summary:
  ar: "تخبر رقية مولاة عمرة بنت عبد الرحمن أنها خرجت مع عمرة إلى مكة، فدخلت مكة يوم التروية، وطافت بالبيت وسعت بين الصفا والمروة، ثم طلبت مقصا فأخذت من قرون رأسها. فلما كان يوم النحر ذبحت شاة. {cite:muwatta-maruf-1997 p.519}"
  tr: "Umre bint Abdülrahman'ın azatlı kölesi Rukayye, Umre ile birlikte Mekke'ye gittiğini anlatır. Terviye Günü'nde (Zilhicce'nin 8. günü) Mekke'ye girdi, Kâbe'nin etrafında tavaf yaptı ve Safa ile Merve arasında sa'i çekti. Sonra makas istedi ve saçlarından biraz kesti. Kurban Günü'nde (Zilhicce'nin 19. günü) bir koyun kesti. {cite:muwatta-maruf-1997 s.519}"
  id: "Ruqayyah, budak yang dibebaskan oleh 'Umrah binti 'Abd al-Rahman, menceritakan bahwa ia pergi bersama 'Umrah ke Mekah. Ia memasuki Mekah pada Hari Tarwiyah (tanggal 8 Dzul-Hijjah), melakukan Tawaf mengelilingi Ka'bah, dan Sa'i antara Safa dan Marwa. Kemudian ia meminta gunting dan memotong sebagian rambutnya. Pada Hari Raya Kurban (tanggal 19 Dzul-Hijjah), ia menyembelih seekor domba. {cite:muwatta-maruf-1997 p.519}"
