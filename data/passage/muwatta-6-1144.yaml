label: { ar: "الموطأ 1144 — رقية مولاة عمرة بنت عبد الرحمن: قصّت عمرة من شعرها يوم التروية، ثم ذبحت شاة يوم النحر", en: "Muwatta 1144" }
text: "فأخَذَتْ من قُرونِ رأسِها"
summary:
  ar: "تخبر رقية مولاة عمرة بنت عبد الرحمن أنها خرجت مع عمرة إلى مكة، فدخلت مكة يوم التروية، وطافت بالبيت وسعت بين الصفا والمروة، ثم طلبت مقصا فأخذت من قرون رأسها. فلما كان يوم النحر ذبحت شاة. {cite:muwatta-maruf-1997 p.519}"
