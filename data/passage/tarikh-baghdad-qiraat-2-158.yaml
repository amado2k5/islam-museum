text: "- - عليه، ويغير ويزيد وينقص، فمن ههنا وقع الاختلاف بين النسختين. قال إن مجاهد ومممت ابن الجهم يقول: ما رأيت مع الفراء كتابا قط إلا كتاب يافع ويفعة. قال ابن مجاهد، وقال لنا تعلب : لما مات الفراه لم …"
