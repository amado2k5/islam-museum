text: "… وأتاهم عدوّهم من فوقهم ومن. أسفلَ منهم، حتى علنّ المؤمنون كل ظَنّ، وتَجَم التَّفَاق من بعض المنافقين، دحتى قال مُعَتِّب بن قُشير، أخو فتى حمرو بن عوف : كان ممد كيدنا أن نأكل، كنوز كسرى وقيصر، وأحدنا اليوم لا يأمن …"
