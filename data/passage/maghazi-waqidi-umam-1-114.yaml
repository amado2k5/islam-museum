text: "… شَدَّ الضُّحى، وفارق عبد اللّٰه زيدًا بالعَقيق، فجعل عبد اللّٰه يُنادى على راحلته : يا معشر الأَنصار، أَبشروا بسلامة رسول اللّٰه وقَتْل المشركين وأَسْرهم ! قُتل ابنا رَبيعة، وابنا الحجّاج، وأَبو جَهل، وقُتل زَمعة بن الأَسود.، وأُمَيّة بن خَلَف، وأُسر …"
summary:
