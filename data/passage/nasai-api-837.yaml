label: { ar: "سنن النسائي 837 — رفع الدرجات", en: "Sunan al-Nasa'i 837 — ranks raised", ur: "سنن نسائی 837 — درجات کی بلندی", es: "Sunan al-Nasa'i 837 - rangos elevados", fr: "Sunan al-Nasa'i 837 — rangs augmentés", tr: "Sunan an-Nasa'i 837 — Derecelerin Yükseltilmesi", id: "Sunan an-Nasa'i 837 — Menaikkan Derajat" }
text: "أَخْبَرَنَا قُتَيْبَةُ، عَنْ مَالِكٍ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" صَلاَةُ الْجَمَاعَةِ تَفْضُلُ عَلَى صَلاَةِ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً \"."
summary:
  ar: "حديث في سنن النسائي، رقم 837، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 837 (The Book of Leading the Prayer (Al-Imamah)), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 837، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 837 (El Libro de la Oración (Al-Imamah)), que habla de rangos elevados. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 837 (Le Livre de la prière (Al-Imamah)), évoque l'élévation des grades. Le registre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de yer alan 837 numaralı hadis, mertebelerin yükseltilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 837, menyebutkan tentang menaikkan derajat. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
