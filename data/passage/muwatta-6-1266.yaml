label: { ar: "الموطأ 1266 — ابن شهاب عن عيسى بن طلحة عن عبد الله بن عمرو: وقف النبي بمنى يسأله الناس، فقال لمن حلق قبل أن ينحر انحر ولا حرج", en: "Muwatta 1266" }
text: "انْحَرْ، ولا حَرَجَ"
summary:
  ar: "يروي مالك عن ابن شهاب عن عيسى بن طلحة عن عبد الله بن عمرو بن العاص أنه قال وقف رسول الله للناس بمنى، والناس يسألونه، فجاءه رجل قال حلقت قبل أن أنحر، فقال انحر ولا حرج. ثم جاءه آخر قال نحرت قبل أن أرمي، فقال ارم ولا حرج. فما سئل عن شيء قدم أو أخر إلا قال افعل ولا حرج. {cite:muwatta-maruf-1997 p.562}"
