label: { ar: "الموطأ 1266 — ابن شهاب عن عيسى بن طلحة عن عبد الله بن عمرو: وقف النبي بمنى يسأله الناس، فقال لمن حلق قبل أن ينحر انحر ولا حرج", en: "Muwatta 1266", es: "Muwatta 1266", fr: "Muwatta 1266", ur: "موطا 1266", tr: "El-Muvatta 1266 — İbn Şihab, İsa ibn Talha'dan, Abdullah ibn Amr'dan rivayetle: Peygamber Mina'da duruyordu ve insanlar ona sordular. Bunun üzerine, kurban kesmeden önce başını tıraş eden kişiye şöyle dedi: \"Kurban kes, bunda bir sakınca yoktur.\"", id: "Al-Muwatta 1266 — Ibn Shihab, berdasarkan riwayat Isa ibn Talha, berdasarkan riwayat Abdullah ibn Amr: Nabi berdiri di Mina dan orang-orang bertanya kepadanya, lalu beliau berkata kepada orang yang mencukur kepalanya sebelum bersembelih: “Bersembelihlah, tidak ada bahayanya.”" }
text: "انْحَرْ، ولا حَرَجَ"
summary:
  ar: "يروي مالك عن ابن شهاب عن عيسى بن طلحة عن عبد الله بن عمرو بن العاص أنه قال وقف رسول الله للناس بمنى، والناس يسألونه، فجاءه رجل قال حلقت قبل أن أنحر، فقال انحر ولا حرج. ثم جاءه آخر قال نحرت قبل أن أرمي، فقال ارم ولا حرج. فما سئل عن شيء قدم أو أخر إلا قال افعل ولا حرج. {cite:muwatta-maruf-1997 p.562}"
  tr: "Malik, İbn Şihab'dan, o da İsa ibn Talha'dan, o da Abdullah ibn Amr ibn el-As'tan rivayetle şöyle buyurmuştur: Allah Resulü Mina'da halkın önünde duruyordu ve insanlar ona sorular soruyorlardı. Bir adam yanına gelip, \"Kurban kesmeden önce saçımı tıraş ettim\" dedi. Resulullah, \"Kurban kes, bunda bir sakınca yok\" dedi. Sonra başka bir adam yanına gelip, \"Sütunları taşlamadan önce kurban kestim\" dedi. Resulullah, \"Sütunları taşla, bunda bir sakınca yok\" dedi. Ona, usulüne aykırı bir şey sorulmadı, sadece \"Yap, bunda bir sakınca yok\" dedi. {cite:muwatta-maruf-1997 s.562}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Isa bin Talha, dari Abdullah bin Amr bin al-As, bahwa beliau berkata: Rasulullah SAW berdiri di hadapan orang-orang di Mina, dan orang-orang bertanya kepadanya. Seorang laki-laki datang kepadanya dan berkata, \"Aku mencukur rambutku sebelum bersembelih.\" Beliau bersabda, \"Bersembelihlah, tidak ada salahnya.\" Kemudian seorang laki-laki lain datang kepadanya dan berkata, \"Aku bersembelih sebelum melempari tiang-tiang.\" Beliau bersabda, \"Lempari tiang-tiang, tidak ada salahnya.\" Beliau tidak ditanyai tentang sesuatu yang dilakukan secara tidak semestinya kecuali beliau bersabda, \"Lakukanlah, tidak ada salahnya.\" {cite:muwatta-maruf-1997 p.562}"
