label: { ar: "سنن ابن ماجه 2471 — الأب والأبوة", en: "Sunan Ibn Majah 2471 — the father and fatherhood", ur: "سنن ابن ماجہ 2471 — باپ اور والدیت", es: "Sunan Ibn Majah 2471 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، حَدَّثَنَا عَفَّانُ، حَدَّثَنَا حَمَّادٌ، حَدَّثَنَا ثَابِتٌ، عَنْ أَنَسِ بْنِ مَالِكٍ، وَهِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ النَّبِيَّ سَمِعَ أَصْوَاتًا. فَقَالَ \" مَا هَذَا الصَّوْتُ \". قَالُوا النَّخْلُ يُؤَبِّرُونَهُ فَقَالَ \" لَوْ لَمْ يَفْعَلُوا لَصَلَحَ \". فَلَمْ يُؤَبِّرُوا عَامَئِذٍ فَصَارَ شِيصًا فَذَكَرُوا لِلنَّبِيِّ فَقَالَ \" إِنْ كَانَ شَيْئًا مِنْ أَمْرِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2471، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2471 (The Chapters on Pawning), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2471، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2471 (Los capítulos sobre el empeño), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
