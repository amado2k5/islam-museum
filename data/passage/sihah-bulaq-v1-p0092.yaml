text: |-
  ٥٤٩
  ونهى عن الخليطين فى الاتبذة وهو أن يجمع بين صنفين تمر وزبيب أوعذب ورطب وخولط
  الرجَل فى عقله خلاطا (خط ائهط ضرب من الارالله حل يوكل وقرى ذوا أكل
  خطا بالاضافة والحط من اللبن الحامض وذكرأبوع بيدان اللبن اذاذهب عنه حلاوة الحلب
  ولم يتغير طعمه فهو سامط فان أخذشيئا من الريح فهو خامط وخيط وان أخذشيتامن العاهم
  فهو ممحل فاذا كان فيه طعم الحلاوة فهوقوهة وتخمط الفحل هدر وتحمط فلان أى نغضب
  وتكبر ومنه قول السكميت
  ت اذا ما تسامت للنخمط صمدها وتحمط الحراذا النط.
  وخطت الشاة أخطها خطا اذا نزعت جلدها وشويتها فهى خميط فان نزعت شعرها وشويتها
  فهى سميط واللهطة الهر التى قد أخذت ريح الادراك كرمح التفاح ولم تدرك بعد ويقال
  هى الحامضة ⁦(خوط)⁩ الخوط الفصن الناعم لسنة يقال خوط بان الواحدة خوطة
  ⁦( نبط)⁩ الخيط السلان وجمعه خبوط وخبوطة مشل فل وفول وحولة والخيط الابرة
  و ذلك انخباط ومنه قوله تعالى -قى يلج الجمل فى سم الخياط والخيط الاسود الغبجر
  المستطيل ويقال سواد الليل والخيط الابيض الفجر الممترض قال أبودواد الايادى
  فل أضادت لناسدفة • ولاح من الصبح خيط أنارا
  وخيط الرقبة نخاعها يقال جاحص فلان عن خيط رقبته أى دافع عن دمه وخيط باطل
  الذى يقال ه لعاب الشمس ومخباط الشيطان وكان مروان بن الحسكم يلقب بذلك لانه كان
  طو يلامضاريا قال الشاعر
  لما الله قوما ملكواخيط باطل * على الناس يعطى من يشاء ويمنع
  والخيط بالكسر التطيع من النعام وكذلاك الخيطى مثال سكرى ونعامة خيطاء بينة الخيط
  وهو طول عنقها وقد خطت الثوب خياطة فهو مخيوط ومخيط فن قال مخيوط أخرجه على
  التمام ومن قال مخيط بشاه على النقص لنقصان الياءفى خطت والماء فى مخيط هى واومفعول
  قليت ا.لكونها وا نكسار ما قبلها وانماح ل ماقبله السكونها وسكون الواددهد سقوط
  لياء وانما كسروا ليع-لم أن الساقط ياء وناس يقولون إن الياءفى مخيط ه الاصلية والدء
  -ذف واوم فعول لعرف الواومن الماتى والقول هو الاول لان الواومزيدة للبناءفلا
  بقبقى لها أن تحذف والاصلى أحق بالمذف لاجتماع الساكنين أوعلة توجب أن يحذف
  حرف وكذلات القول فى كل مفعول من ذوات الثلاثة اذا كان من بنات الياء فانه يحى
  بالنقصان والتمام فأما من بنات الواوفانه لم يجى على التمام الاحرفان سسلك مدووف وتوب
  مصوون فان هذين با آنادرين وفى النهو بين من يقيس على ذلك فية ول قول مقوول وفرس
  مقوودقياسامطردا والخيطة فى كلام هذيل الوتد قال أبوذويب
  تدلى عليها بين سب وخيطة • بجرداءمثل الوكف يكبو غرابها
  وقال أبو ع ووهو حبل لطيف يتخذ من السلب وخيط الشيب فى رأسه منل وخط قال
  الناعر
  آليت لا أنسى منيحة واحد * حتى تخيط بالبياض قرونى
