label: { ar: "مسلم 2553 — البر حسن الخلق والإثم ما حاك في صدرك", en: "Muslim 2553 — Piety is good character; sin is what stirs in your chest", es: "Musulmán 2553 — La piedad es el buen carácter; el pecado es lo que se agita en tu pecho.", fr: "Muslim 2553 — La piété est un bon caractère; le péché est ce qui s’agite dans votre cœur.", ur: "مسلم 2553 - تقویٰ اچھا کردار ہے۔ گناہ وہ ہے جو آپ کے سینے میں ہلتا ہے۔", tr: "Müslim 2553 — Doğruluk güzel ahlaktır, günah ise vicdanı rahatsız eden şeydir.", id: "Muslim 2553 — Kebajikan adalah akhlak yang baik, dan dosa adalah apa yang mengganggu hati nuranimu." }
text: "قال رسول الله: «البر حسن الخلق، والإثم ما حاك في صدرك وكرهت أن يطلع عليه الناس»"
summary:
  ar: "رواية النواس بن سمعان الأنصاري في باب البر والإثم من صحيح مسلم؛ يجعل البر حسنَ الخلق ويعرّف الإثم بما يحاك في الصدر ويُكره اطلاع الناس عليه — من جوامع التعريف النبوي."
  tr: "Sahih Müslim'in salihlik ve günah bölümünde Nevvas bin Sam'an el-Ensari'nin rivayetine göre, salihlik iyi ahlak olarak, günah ise kalpte gizli olan ve insanların bilmesinden hoşlanmadığı şey olarak tanımlanır; bu, Peygamberimizin kapsamlı tanımlarından biridir."
  id: "Riwayat Nawwas bin Sam'an al-Ansari dalam bab tentang kebaikan dan dosa dalam Sahih Muslim mendefinisikan kebaikan sebagai akhlak yang baik dan dosa sebagai sesuatu yang tersembunyi di dalam hati dan orang lain tidak menyukainya jika mengetahuinya — berdasarkan definisi-definisi Nabi yang komprehensif."
