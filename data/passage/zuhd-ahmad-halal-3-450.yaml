text: "… من الغنى وحتى يستقل الكثير من عمله ويستكثر القليل من عمل غيره وحتى يكون عيشه القوت ولا يتبرم في طلب الحوائج وحتى يكون الفقر إليه في الحلال أحب إليه من الغنى في الحرام وحتى يكون الفقر في طاعة اللّه أحب …"
