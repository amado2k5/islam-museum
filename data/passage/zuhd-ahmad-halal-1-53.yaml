text: "… بَيْنٌ وَالْحَرَامُ بَيِّنٌ وفي ألفاظه بعض الزيادة والنقص والمعنى واحد. قال ابن رجب مرخم اللَّكُه: فيه إشارة إلى أن صلاح حركات العبد بجرارحه واجتنابه للمحرمات واتقاءه للشبهات بحسب صلاح قلبه فإن كان قلبه سليمًا ليس فيه إلا محبة اللّٰه وخشية …"
