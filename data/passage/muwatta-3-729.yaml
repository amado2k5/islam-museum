label: { ar: "الموطأ 729 — مالك: قطع أموال متفرقة أو اشتراك في أموال لا يبلغ كل منها النصاب تجمع ويؤدى زكاتها", en: "Muwatta 729", es: "Muwatta 729", fr: "Muwatta 729", ur: "موطا 729", tr: "Al-Muwatta 729 — Malik: Her biri asgari eşik (nisap) seviyesine ulaşmayan ayrı fonlar veya ortak mülkiyetteki fonlar bir araya getirilir ve bunlar üzerinden zekât verilir.", id: "Al-Muwatta 729 — Malik: Dana terpisah atau kepemilikan bersama atas dana, yang masing-masing tidak mencapai ambang batas minimum (nisab), digabungkan dan zakat dibayarkan atasnya." }
summary:
  ar: "قول لمالك يختم به الباب: إذا كانت لرجل قطع أموال متفرقة أو اشتراك في أموال متفرقة لا يبلغ كل مال شريك منهم أو قطعه ما تجب فيه الزكاة، وكانت إذا جُمع بعضها إلى بعض تبلغ النصاب، فإنه يجمعها ويؤدي زكاتها. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.365} {cite:muwatta-maruf-1997 p.366}"
  tr: "Malik bu bölümü şu ifadeyle sonlandırıyor: Bir kimse ayrı ayrı mallara sahipse veya ayrı ayrı mallarda pay sahibiyse ve her ortağın bireysel malları zekât yükümlülüğünün asgari tutarına ulaşmıyorsa, ancak bir araya geldiklerinde nisaba (zekât için asgari eşik) ulaşıyorsa, o zaman bunları birleştirmeli ve zekâtını vermelidir. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.365} {cite:muwatta-maruf-1997 s.366}"
  id: "Malik menyimpulkan bab ini dengan pernyataan berikut: Jika seseorang memiliki aset terpisah atau saham dalam aset terpisah, dan aset masing-masing mitra tidak mencapai jumlah minimum yang wajib dikenakan zakat, tetapi jika digabungkan mencapai nisab (ambang batas minimum untuk zakat), maka ia harus menggabungkannya dan membayar zakat atasnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.365} {cite:muwatta-maruf-1997 p.366}"
