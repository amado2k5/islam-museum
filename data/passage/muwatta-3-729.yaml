label: { ar: "الموطأ 729 — مالك: قطع أموال متفرقة أو اشتراك في أموال لا يبلغ كل منها النصاب تجمع ويؤدى زكاتها", en: "Muwatta 729" }
summary:
  ar: "قول لمالك يختم به الباب: إذا كانت لرجل قطع أموال متفرقة أو اشتراك في أموال متفرقة لا يبلغ كل مال شريك منهم أو قطعه ما تجب فيه الزكاة، وكانت إذا جُمع بعضها إلى بعض تبلغ النصاب، فإنه يجمعها ويؤدي زكاتها. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.365} {cite:muwatta-maruf-1997 p.366}"
