text: "… مجمد بن اسحاق قال : ثنا قتيبة بن سعيد قال : ثنا الليث بن عقيل عن الزهرى عن سالم بن عبد اللّه عن أبيه. قال قال رسول اللّٰه : المسلم أخو المسلم لا يظلمه ولا يسلمه، ومن كان فى حاجة …"
