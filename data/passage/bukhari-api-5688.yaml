label: { ar: "صحيح البخاري 5688 — الحبة السوداء، الداء", en: "Sahih al-Bukhari 5688 — the black seed; the disease and its remedy", ur: "صحیح بخاری 5688 — کلونجی، بیماری", es: "Sahih al-Bukhari 5688 — La semilla negra; la enfermedad y su remedio", fr: "Sahih al-Bukhari 5688 — la graine noire; la maladie et son remède", tr: "Sahih el-Buhari 5688 — Çörek otu, hastalık", id: "Sahih al-Bukhari 5688 — Biji hitam, penyakitnya" }
text: "حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي أَبُو سَلَمَةَ، وَسَعِيدُ بْنُ الْمُسَيَّبِ، أَنَّ أَبَا هُرَيْرَةَ، أَخْبَرَهُمَا أَنَّهُ، سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" فِي الْحَبَّةِ السَّوْدَاءِ شِفَاءٌ مِنْ كُلِّ دَاءٍ إِلاَّ السَّامَ \". قَالَ ابْنُ شِهَابٍ وَالسَّامُ الْمَوْتُ، وَالْحَبَّةُ السَّوْدَاءُ الشُّونِيزُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5688، يذكر الحبة السوداء، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5688 (Medicine), that mentions the black seed, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5688، جس میں کلونجی، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5688 (Medicina), menciona la semilla negra, la enfermedad y su remedio, la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5688 (Médecine), mentionne la graine de nigelle, la maladie et son remède. Le navigateur de ressources médicales la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5688 numaralı hadis, çörek otu, hastalık ve tedavi konularından bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5688, menyebutkan biji jintan hitam, penyakit, dan pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
