text: "الجزء الثالث قال الشيخ أبو عمرو الدانى : وقد وردَتِ الكراهةُ بنقط المصاحف عن عبد اللّه أبن عمر، وقال بذلك جماعة من التابعين. وآعلم أن كَُّاب الدّيْونة لا يعرّجون على النقط والشكل بحال، وكّب الإنشاء منهم مَنْ منع ذلك محاشاة …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 4، ص 162، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 4, p. 162, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 4، ص 162 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen 4, pág. 162, que menciona la colección del Corán y los códices, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 4, p. 162) mentionne la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin Resimli Cilt 4, s. 162'sinden bir alıntı, Kur'an'ın derlenmesini ve el yazmalarını, ayrıca Kur'an'ın diyakritik işaretlerini ve biçimlendirmesini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Subh al-A'sha karya Al-Qalqashandi, Jilid 4 Bergambar, hlm. 162, membahas penyusunan Al-Qur'an dan manuskripnya, serta tanda diakritik dan format Al-Qur'an. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
