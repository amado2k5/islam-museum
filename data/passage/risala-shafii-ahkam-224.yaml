text: "… الله، لأن اللّٰه لم يَجْمَلْ لَآدِيِيّ بعدَهُ ما جَمَلَ له، بل فَرَضَ على خلقه اتّباعَه، فأزمهم أثْرَه، فالحلقُ كُلُّهم له تَبَعٌ، ولا يكونُ للتابع أن يُخالِفَ ما فُرِض عليه اتّباعُه، ومن وَجَبَ عليه اتّباعُ سنةِ رسول اللّٰه لم يكن له …"
