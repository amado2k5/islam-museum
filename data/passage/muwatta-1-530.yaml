text: "لا تمنعوا إماء الله مساجد الله"
summary:
  ar: "أول حديث في باب ما جاء في خروج النساء إلى المساجد. بلاغ يرويه مالك أنه بلغه عن عبد الله بن عمر أن النبي نهى أن تُمنع النساء من مساجد الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه متصل مرفوع في الصحيحين (البخاري 2/7، ومسلم 2/32) من حديث ابن عمر. {cite:muwatta-maruf-1997 p.273} {cite:muwatta-maruf-1997 p.274}"
