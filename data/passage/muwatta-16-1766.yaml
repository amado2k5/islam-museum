summary:
  ar: "يروي مالك عن ابن شهاب عن عمرو بن الشريد أن عبد الله بن عباس سئل عن رجل له امرأتان، فأرضعت إحداهما غلاما، وأرضعت الأخرى جارية، فقيل له: هل يتزوج الغلام الجارية؟ فقال: لا، اللقاح واحد. {cite:muwatta-maruf-1997 p.121}"
