label: { ar: "الموطأ 1766 — ابن شهاب عن عمرو بن الشريد: سئل ابن عباس عن امرأتين أرضعت إحداهما غلاما والأخرى جارية، فقال لا، اللقاح واحد", en: "Muwatta 1766", es: "Muwatta 1766", fr: "Muwatta 1766", ur: "موطا 1766", tr: "El-Muvatta 1766 — İbn Şihab, Amr ibn el-Şerid'den rivayetle: İbn Abbas'a, biri erkek çocuğu, diğeri kız çocuğu emziren iki kadın soruldu ve o şöyle dedi: Hayır, suni döllenme aynıdır.", id: "Al-Muwatta 1766 — Ibn Shihab meriwayatkan dari Amr ibn al-Sharid: Ibn Abbas ditanya tentang dua wanita, yang satu menyusui anak laki-laki dan yang lainnya anak perempuan, dan beliau menjawab: Tidak, pembuahan itu sama saja." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عمرو بن الشريد أن عبد الله بن عباس سئل عن رجل له امرأتان، فأرضعت إحداهما غلاما، وأرضعت الأخرى جارية، فقيل له: هل يتزوج الغلام الجارية؟ فقال: لا، اللقاح واحد. {cite:muwatta-maruf-1997 p.121}"
  tr: "Malik, İbn Şihab'dan, o da Amr ibn el-Şerid'den rivayet ettiğine göre, Abdullah ibn Abbas'a iki karısı olan bir adam sorulmuş; karısından biri erkek çocuğu, diğeri kız çocuğu emzirmiş. Ona, \"Erkek çocuk kız çocukla evlenebilir mi?\" diye sorulmuş. O da, \"Hayır, gebelik aynıdır.\" diye cevap vermiş. {cite:muwatta-maruf-1997 s.121}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Amr ibn al-Sharid, bahwa Abdullah ibn Abbas ditanya tentang seorang pria yang memiliki dua istri, salah satunya menyusui seorang anak laki-laki, dan yang lainnya menyusui seorang anak perempuan. Dia ditanya: Dapatkah anak laki-laki itu menikahi anak perempuan itu? Dia menjawab: Tidak, pembuahannya sama saja. {cite:muwatta-maruf-1997 p.121}"
