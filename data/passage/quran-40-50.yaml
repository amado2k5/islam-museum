text: "قَالُوٓا۟ أَوَلَمْ تَكُ تَأْتِيكُمْ رُسُلُكُم بِٱلْبَيِّنَـٰتِ ۖ قَالُوا۟ بَلَىٰ ۚ قَالُوا۟ فَٱدْعُوا۟ ۗ وَمَا دُعَـٰٓؤُا۟ ٱلْكَـٰفِرِينَ إِلَّا فِى ضَلَـٰلٍ"
text_search: "قالوا أولم تك تأتيكم رسلكم بالبينات ۖ قالوا بلى ۚ قالوا فادعوا ۗ وما دعاء الكافرين إلا في ضلال"
translations:
  en: { text: "They say: Came not your messengers unto you with clear proofs? They say: Yea, verily. They say: Then do ye pray, although the prayer of disbelievers is in vain.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "وہ کہیں گے کہ کیا تمہارے پاس تمہارے پیغمبر نشانیاں لے کر نہیں آئے تھے۔ وہ کہیں گے کیوں نہیں تو وہ کہیں گے کہ تم ہی دعا کرو۔ اور کافروں کی دعا (اس روز) بےکار ہوگی", translator: "Fateh Muhammad Jalandhari", license: PD }
