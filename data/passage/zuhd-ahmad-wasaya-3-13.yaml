text: "… كان يكون في مهنة أهله فإذا حضرت الصلاة خرج فصلى.: حدثنا عبداللّه حدثني أبي حدثنا أبو معاوية حدثنا الأعمش عن شقيق من مسروق عن عائشة قالت ما ترك رسول اللّٰه ماع ديناراً ولا درهماً ولا شاة ولا بعيراً ولا أوصى …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 3، ص 13، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 3, p. 13, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 3، ص 13 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 3, pág. 13, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal, volume 3, page 13, mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il est répertorié dans le Navigateur de Testaments."
  tr: "Ahmed ibn Hanbal'ın \"El-Zuhd\" (Zühd) adlı eserinin 3. cildinin 13. sayfasından, vasiyetnamesi, mal varlığı ve mirasıyla ilgili bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Kemelekatan) karya Ahmad ibn Hanbal, Jilid 3, halaman 13, yang menyebutkan wasiat terakhirnya serta harta warisannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh bagian \"Wasiat, Warisan, Barang Antik, dan Makam Suci\"."
