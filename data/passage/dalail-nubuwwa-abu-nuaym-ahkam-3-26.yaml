text: "… كذا وكذ! ولا اسمى حائط بنى فلان قال فقلت نعم فبأيعنى فاطلقت هميانى فاعطيته ثمانين مثقالا من ذهب فى تمر معلوم الى اجل كذا و كذا فاعطى الرجل وقال اعجل عليهم واغثهم بها قال زيد بن سعنة فلمم كان قبل …"
