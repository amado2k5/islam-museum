text: |-
  ٢٣.٦
  ⁦(باب الرام)⁩
  ⁦(سير)⁩
  ذهب وقد يكون جمع أساور قال تعالى يحاون فيها من أساور من ذهب وقال أبو حمرو
  ابن العلاء واحدها سواد وسوّرنه أى ألبته الوارفتوره ونؤرالحمائط تلفه
  وساراليه بسورسؤدراوئب قال الاخطل بصف خرا
  لما أتوها بصباح ومبزلهم * سارت اليهم سؤور الابجل الضارى
  وساوره أى واثبه ويقال ان لغضبه لسورة وهو سوار أى وناب معر بدوسورة الشراب
  وثو به فى الرأس وكذلك ءورة الحمسة وتوبها وسورة السلطان سطوته واعتداؤه والاسواد
  والاسوار الواحدص أساورة الفرس قال أبو عبيدهم الفرسان والهاءحوض من الياءوكانّ
  أص-له أسادير وكذلك الزنادقة أص-له زناديق عن الاخفش والاساورة أيضاقوممن العجم
  بالبصرة زلوهافديما كالاسامرة بالكوفة ⁦( هر)⁩ السهر الارق وقدسهر بالكسر
  يسهره وساهروس) وان وأسهره غيره ورجل سهرة مشال همزة أى كثير السهر عن
  بعقوب والساهور غلاف القمر فيما تز عمه العرب قال أمية بن أبى الصلت
  لانقص فيه غيرات جبينه * قروساهوريسل ويغمد
  ويقال الساهو رظل الساهرة وهى وجه الارض ومنه قوله تعالى فاذاهم بالساهرة قال
  أبو كبير الهسذلى يرتدن ساهرة كأن جيمها • وعميعها أسداف ليل مظلم
  والاسهران ءرقان فى المنخرين اذا اغتلم الهارسالاماء قال الشماخ
  وائل من مصك أنصبته • حوالب أسهريه بالذفين
  ⁦(سير)⁩ سار يسيرسيرا ومسيراوتسيارا يقال بارك اللّٰه للك فى مسيرك أى سيرك وهو شاذ
  لان قياس المصدر من فعل يفعل مفعل بالفخ وسارت الداية وسارها صاحبها
  يتعدى ولا يتعدّى قال الهذلى
  فلا تجز عن من سنة أنت سرتها * فأول راضى سنة من يسيرها
  يقول أنت جعلتها سائرة فى الناس وقواهم فى المثل سرعنك أى تغافل واحتمل وفيه اضمبار
  كأنه قال سرودع عنك المراء والشك والسيرة الطريقة بقال ساديهم سيرة خسنة
  والسعرة أيضا الميرة والاستيار الامتيار قال الراجز
  أشكو الى اللّٰه العزيز الغذار• ثم اليك اليوم بعد المستار
  ويقال المستار فى هذا البيت مفتعل من السير والتسيارتفعال من الستر وسايره
  أى جاراه فتسايراوبينهمامسيرة يوم وسيره من بلده أى أخرجه وأجلاه وسيرت الجسل عن
  ظهر الداية نزعته عنه والمسير من الثياب الذى فيه خطوط كالسيور والسيارة القافلة
  وقواهم أصح من عير أبى سيارة هوأيوسيارة العدوانى كان يدفع بالناس من جمع أربعين
  سنة على جماره قال الراجز
  خلوا الطريق عن أبى سياره * وعن واليسه بنى فسزاره
  حتى يجيز سالماسهاره * مستقبل القبلة يدعوجاره
  و والسيراه بكسر السين وفتح البامبرد فيه خطوط صفر قال النابغة
  صفراء كالسيراء أكمل خلقها • كالغصن فى غلوائه المتأوّد
  والير
