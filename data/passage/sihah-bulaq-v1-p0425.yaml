text: |-
  ⁦(١ )⁩ ب كسر الجيم اوقصها والهعزة
  والدال مفتوحاناه
  ٢١٦
  صل الجيم د) الجود الانسكاد مع العلم بقال جد محقه وبحقه جداوحودا
  والحجد أيضاقلة الخير و كذلك الجد بالضم وقال الشاءو
  لتن بعنت أم الجيدين مارا • لقد غنيت فى غير يؤس ولاجمد
  والحد بالتحريك مثله يقال نكد اله وبحد او حد الرجل بالكسر حجداف وججداذا كان
  ضيقا قليل انخيروأبحد مثله قال الفرزدق
  وبيضاء من أهل المدينة لم تذق * بتيساولم تتبع حولة مححد
  وعام بحد قليل المطروبحد الذيت اذاقل ولم يطل وبحادة اسم رجل جدد ) المد أبوالاب
  وأبوالام والجد الحظ والبنت والجمع الجدود تقول جددت يافلان أى صرت ذاجد فأنت
  جديد حظيظ ومجدود محفوظ وجدحظ وحدى"-ظىّ عن ابن السكيت وفى الدعاءولا
  يتقع ذا الجد منك الجد أى لا ينفع ذا الغى عندك غناه وانما ينفعه الععل بطاعتك ومنك
  معناه عندك وقوله تعالى جدربنا أى عظمة ربنا ويقال غناه وفى حديث أنس رضى اللّه
  عنه كان الرجل منا اذاة رأ البقرة وآل عمران جسة فينا أى عظم فى أعيننا والجدد الارض
  الصلبة وفى المشل من سلك الجدد أمن العثار وقد أجد القوم اذاصاروا الى الجدد وأجد
  الطريق صار جدداوالجادة معظم الطريق والبهع جواد والجد نقيض الهزل تقول.نه
  فااحالة ولمنة جدف الاميجدجد النت ويدا جدف الح لئ قال الاسا
  يقال ان فلا نالجات مجسد باللغنين بجيعا وقواهسم أجدبها أمرا أن أجد أمره بها نصب
  الامر على التمييزكة ولاقررت به عينا أى قترت عين به وجادّه فى الامر أى حاقه وفلان محسن
  جداولا نقسل جدا وهو على جد أمر أى عجلة أمر وقولهم فى هذا خطر جد عظيم أى عظيم
  جدا وقولهم أحدك واجدك ⁦(١)⁩؛عنى ولا يتكام به الامضافا قال الاصمعى معناه ابجد منك
  هذا ونصبهما على طارح الباء وقال أبو عمروم عناه مالك أجد امنك ونصبهما على المصدر قال
  شعلب ما أناك فى الشعر من قولك أجسدك فهو بالكسرفاذا أتاك بالواو وجدكفهومفتوح
  والحسد بالضم البتر التى تكون فى موضع كثير الكلاً قال الاعشى يفضل عامراعلى علمقعة
  ماجعل الجدّ الظنون الذى • جنب صوب اللجب الماطر
  مثل الفراتى اذا ماطعا • يقذف بالبوصى والما هر
  وجدة بلد على الساحل والجدة الخطة التى فى ظهر الحمارتخااف لونه والجدة الطريقة
  واله-ع جدد قال تعالى ومن الجبال جدد ييض وحرأى طرائق تخالف لون الجبل ومنه
  قولهم ركب فلان جدة من الامراذا رأى فيه رأبا وكساء مجدد فيه خاوط مختلفة والجداد
  الخلقان من الثياب وهو معرب كداد بالفارسية قال الاعشى يصف خارا
  أضاء مظلته بالسراج واللبسل غامر جدادها
  وكل شى تعقد بعضه فى بعض من الخيوط وأغصان الشهر فهو جداد قال الطرماح بصف
  لبية
  تجتنى نامر ج-داده • من فرادى برم أوتؤم
  ويقال انه صغار الشجر والجدحد بالضم صرار الليل وهوقفاز وفيه شبه من الإراد والجمع
  الجداجد
