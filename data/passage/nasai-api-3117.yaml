label: { ar: "سنن النسائي 3117 — ما حُرّم", en: "Sunan al-Nasa'i 3117 — what was made unlawful", ur: "سنن نسائی 3117 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 3117 — lo que se declaró ilícito", fr: "Sunan al-Nasa'i 3117 — ce qui a été déclaré illicite" }
text: "أَخْبَرَنَا عِصْمَةُ بْنُ الْفَضْلِ، قَالَ حَدَّثَنَا زَيْدُ بْنُ حُبَابٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ شُرَيْحٍ، قَالَ سَمِعْتُ مُحَمَّدَ بْنَ شُمَيْرٍ الرُّعَيْنِيَّ، يَقُولُ سَمِعْتُ أَبَا عَلِيٍّ التُّجِيبِيَّ، أَنَّهُ سَمِعَ أَبَا رَيْحَانَةَ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" حُرِّمَتْ عَيْنٌ عَلَى النَّارِ سَهِرَتْ فِي سَبِيلِ اللَّهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3117، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3117 (The Book of Jihad), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3117، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3117 (El Libro de la Yihad), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3117 (Le Livre du Jihad), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
