text: "الصفحة الموضوع قتل كعب بن الآشرف اليهودى. قتل ابى رافع اليهودى قتل ابن شيبة اليهردى غزوات بنى قينقاع وبى النضير وقريظة وما وقع من الانصار فى ذلك حديث بنى النضير حديث بنى قريظة فخر الأنصار بالعزة الدينية صبر الأنصار عن …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 648، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 2, p. 648, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 2، ص 648 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
