label: { ar: "صحيح مسلم 6203 — الأب والأبوة", en: "Sahih Muslim 6203 — the father and fatherhood", ur: "صحیح مسلم 6203 — باپ اور والدیت" }
text: "حَدَّثَنَا هَارُونُ بْنُ مَعْرُوفٍ، حَدَّثَنَا بِهِ عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ، أَخْبَرَنِي سُهَيْلٌ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ عُمَرَ بْنَ الْخَطَّابِ، جَاءَ إِلَى رَسُولِ اللَّهِ وَعِنْدَهُ نِسْوَةٌ قَدْ رَفَعْنَ أَصْوَاتَهُنَّ عَلَى رَسُولِ اللَّهِ فَلَمَّا اسْتَأْذَنَ عُمَرُ ابْتَدَرْنَ الْحِجَابَ. فَذَكَرَ نَحْوَ حَدِيثِ الزُّهْرِيِّ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6203، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6203 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6203، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
