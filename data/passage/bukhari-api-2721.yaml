label: { ar: "صحيح البخاري 2721 — استحلال الشيء", en: "Sahih al-Bukhari 2721 — treating a thing as lawful", ur: "صحیح بخاری 2721 — کسی چیز کو حلال ٹھہرانا", es: "Sahih al-Bukhari 2721 — tratar algo como lícito", fr: "Sahih al-Bukhari 2721 — considérer une chose comme licite" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، حَدَّثَنَا اللَّيْثُ، قَالَ حَدَّثَنِي يَزِيدُ بْنُ أَبِي حَبِيبٍ، عَنْ أَبِي الْخَيْرِ، عَنْ عُقْبَةَ بْنِ عَامِرٍ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" أَحَقُّ الشُّرُوطِ أَنْ تُوفُوا بِهِ مَا اسْتَحْلَلْتُمْ بِهِ الْفُرُوجَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2721، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 2721 (Conditions), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 2721، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2721 (Condiciones), menciona la consideración de algo como lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 2721 (Conditions), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
