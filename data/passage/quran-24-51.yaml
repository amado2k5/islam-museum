text: "إِنَّمَا كَانَ قَوْلَ ٱلْمُؤْمِنِينَ إِذَا دُعُوٓا۟ إِلَى ٱللَّهِ وَرَسُولِهِۦ لِيَحْكُمَ بَيْنَهُمْ أَن يَقُولُوا۟ سَمِعْنَا وَأَطَعْنَا ۚ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ"
text_search: "إنما كان قول المؤمنين إذا دعوا إلى الله ورسوله ليحكم بينهم أن يقولوا سمعنا وأطعنا ۚ وأولئك هم المفلحون"
translations:
  en: { text: "The saying of (all true) believers when they appeal unto Allah and His messenger to judge between them is only that they say: We hear and we obey. And such are the successful.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "مومنوں کی تو یہ بات ہے کہ جب خدا اور اس کے رسول کی طرف بلائے جائیں تاکہ وہ ان میں فیصلہ کریں تو کہیں کہ ہم نے (حکم) سن لیا اور مان لیا۔ اور یہی لوگ فلاح پانے والے ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
