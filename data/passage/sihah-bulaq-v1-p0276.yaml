text: |-
  ⁦(ف صل العن)⁩
  عصر)
  :٢٦٥
  يعنى بالسه-مين الرقيب والمعلى من~ هام المسر أى قد حزت القلب كله وبرمة اعشار
  اذا انكسرت قطعاقطعا وقلب أعشارجاء على بناء الجمع كما قالوارمح أقصاد والاعشارة
  قوادم ريش الطائر قال الشاعر
  ان تكن كالعقاب فى الجوّفالعة بان يهوى كواسر الاعشار
  وتعشار بكسر التاءموضع قال الشاعر
  لنا ابل لم يعرف الذعر بيتها ، بتعشار مرعاها قسافصرائمه
  شزر لعشنزر الشديد أنشد أبو مبيدة لابي الزحف الكليى
  ودون ليلى بلدسمهدر جذب المندى عن هوانا أزور ينضى المطاياخسه العشنزر
  لمندى حيث يرتع والاتى عشتزرة قال الهذلى فى صفة الضبع
  عشنزرة جواعرها تمان • فويق زماءها وشم ججول
  وصفها بكثرة الجعر كأن لها جواءر كثيرة كما يقال فلان بأكل فى سبعة امعاءران كان له
  معى واحدوهو مثل لكثرة أكاه صر العصر الدهروفيه لغتان أخريان عصر
  وعصر مثل عسر وعسر قال امى والقيس
  الاعم صباحا أيها الطلل البالى * وهل يعمن من كان فى العصر اذالى
  والجمع عصور قال العجاج والعصر قبل هذه العصور * مجرّسات غرّة الغرير
  والعصران الليل والنهار قال جيد ين تود
  ولن يلبث العصران يوم وليلة * اذا طلبا أن يدر كاماتيمما
  والعصران أيضا الغداة والعشى" ومنه سميت صلاة العصر قال الشاءر
  وأمطل العصرين حتى يبملنى • ويرضى بنصف الدين والانف راغم
  يقول اذا جاءنى أوّل النهاروعدته آخره قال الكسائى يقال جاءنى فلان عضر اأى بطيما
  ح-كاه عنه أبو عبيد والعصر بالتحريك الملجأ والمنجاة والعصر أيضا الغبدار وفى الحديث مرت
  امر أة متطيبة لذيلها عصر وبنو عصرأإضا من عبد القيس منهم مر جوم العصرى والعصرة
  بالضم الملجأ قال أيوزييد صاديايستغيث فيرحفات ولقد كان عصرة المنجود والعصرة
  أيضا الدنية بقال هؤلاءمو اليناعصرة أى دنية دون من سواهم واعتصرت بفلان وتعصرت
  أى التجأت اليه والمعتصر الذى يصيب من الشئ ويأخذمنه وقال ابر أحر
  وانما العيش بريانه • وأنت من افنانه تعتصر
  قال أبو عبيد ومنه قول طرفة
  لو كان فى أملا كاملك * يعصرفينا كالذى نعتصر
  وكذلك قوله تعالى فيه يغاث الناس وفيه يعصرون وقال أبو عبيدة يعصرون أى يتجون
  وهو من العصرة وهى المنجاة وقال أبو الغوث يستغلون وهومن عصر العنب واعتصرت ماله
  اذا استضرحته من يده وفى الحديث يعتصر الو الدعلى ولده فى ماله أى يمنعه اياه ويحبه عنه
  وعصرت الضب واهتصرته فانعصر وتعصر وقداعتصرت عصيرا أى اتخذته وقول
