label:
  ar: "مسلم 2372b — موسى وملك الموت: ارجع إلى عبدي"
  en: "Muslim 2372b — Musa and the Angel of Death: go back to My servant"
  ur: "مسلم 2372b — موسیٰ اور ملک الموت: میرے بندے کے پاس واپس جاؤ"
text: "جاء ملك الموت إلى موسى فقال له أجب ربك - قال - فلطم موسى عين ملك الموت ففقأها - قال - فرجع الملك إلى الله تعالى فقال إنك أرسلتني إلى عبد لك لا يريد الموت وقد فقأ عيني - قال …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2372b: موسى وملك الموت: ارجع إلى عبدي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2372b: Musa and the Angel of Death: go back to My servant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2372b: موسیٰ اور ملک الموت: میرے بندے کے پاس واپس جاؤ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
