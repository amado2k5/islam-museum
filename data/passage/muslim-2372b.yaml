label:
  ar: "مسلم 2372b — موسى وملك الموت: ارجع إلى عبدي"
  en: "Muslim 2372b — Musa and the Angel of Death: go back to My servant"
  ur: "مسلم 2372b — موسیٰ اور ملک الموت: میرے بندے کے پاس واپس جاؤ"
  es: "Muslim 2372b — Musa y el Ángel de la Muerte: volved a Mi siervo"
  fr: "Muslim 2372b — Moïse et l'Ange de la Mort: retournez vers Mon serviteur"
  tr: "Müslim 2372b — Musa ve Azrail: Kuluma geri dön"
  id: "Muslim 2372b — Musa dan Malaikat Maut: Kembalilah kepada hamba-Ku"
text: "جاء ملك الموت إلى موسى فقال له أجب ربك - قال - فلطم موسى عين ملك الموت ففقأها - قال - فرجع الملك إلى الله تعالى فقال إنك أرسلتني إلى عبد لك لا يريد الموت وقد فقأ عيني - قال …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2372b: موسى وملك الموت: ارجع إلى عبدي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2372b: Musa and the Angel of Death: go back to My servant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2372b: موسیٰ اور ملک الموت: میرے بندے کے پاس واپس جاؤ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2372b: Musa y el Ángel de la Muerte: «Vuelvan con mi siervo». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2372b: Moïse et l’Ange de la Mort: « Retournez vers Mon serviteur. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Muslim'de 2372b numaralı hadis-i kudsi şöyledir: Musa ve Azrail: Kuluma dön. Peygamberimiz bunu Rabbinden rivayet etmiş olup, hadis-i kudsi ise bu rivayetleri altı şeriat hadis külliyatında ve Muvatta'da derlemiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2372b: Musa dan Malaikat Maut: Kembalilah kepada hamba-Ku. Nabi meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
