text: "… بلده وحرمه كما دخله رسول اللّٰه واضعاً رأسه منحنياً على فرسه، حتى إن ذقنه تكاد أن تمس سرجه تواضعاً لربه تبارك وتعالى، وخضوعاً لعظمته، واستكانة لعزته أن أحل له حرمة بلده، ولم يحله لأحد قبله، ولا لأحد من عه، وليي …"
