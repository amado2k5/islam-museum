label: { ar: "الموطأ 674 — نافع: كان ابن عمر يحلي بناته وجواريه الذهب ثم لا يخرج من حليهن الزكاة", en: "Muwatta 674" }
summary:
  ar: "يرويه مالك عن نافع، أن عبد الله بن عمر كان يحلي بناته وجواريه الذهب ثم لا يخرج من حليهن الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي في مسنده ومن طريقه البيهقي، ومحمد بن الحسن الشيباني (330)، ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.341}"
