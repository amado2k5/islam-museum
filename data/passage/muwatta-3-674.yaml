label: { ar: "الموطأ 674 — نافع: كان ابن عمر يحلي بناته وجواريه الذهب ثم لا يخرج من حليهن الزكاة", en: "Muwatta 674", es: "Muwatta 674", fr: "Muwatta 674", ur: "موطا 674", tr: "El-Muvatta 674 — Nafi’: İbn Ömer kızlarını ve cariye kadınlarını altınla süslerdi, fakat mücevherlerinden zekât vermezdi.", id: "Al-Muwatta 674 — Nafi’: Ibnu Umar biasa menghiasi putri-putrinya dan budak-budak perempuannya dengan emas, tetapi ia tidak membayar zakat atas perhiasan mereka." }
summary:
  ar: "يرويه مالك عن نافع، أن عبد الله بن عمر كان يحلي بناته وجواريه الذهب ثم لا يخرج من حليهن الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي في مسنده ومن طريقه البيهقي، ومحمد بن الحسن الشيباني (330)، ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.341}"
  tr: "Malik, Nafi'den rivayet ettiğine göre, Abdullah ibn Umar kızlarını ve cariye kadınlarını altınla süslerdi, fakat mücevherlerinden zekât vermezdi. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab ve Şafiî tarafından Musned'inde, onun isnadından da Beyhaki, Muhammed ibn Hasan el-Şeybani (330) ve Beyhaki'ye göre Yahya ibn Bukayr tarafından nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.341}"
  id: "Malik meriwayatkannya dari Nafi’, bahwa Abdullah ibn Umar biasa menghiasi putri-putrinya dan budak-budak perempuannya dengan emas, namun ia tidak membayar zakat atas perhiasan mereka. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab dan al-Shafi’i dalam Musnadnya, dan dari sanadnya oleh al-Bayhaqi, Muhammad ibn al-Hasan al-Shaybani (330), dan Yahya ibn Bukayr, menurut al-Bayhaqi. {cite:muwatta-maruf-1997 p.341}"
