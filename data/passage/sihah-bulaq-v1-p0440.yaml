  ١ ى القادون اه وانقولى
  فكأن البطيخ حقيقة هو الاصفر
  الممعى بالفارسية خريز على وزن
  زبرج قاله نصر
  ٢ الهاذا الحقاء اه كدا
  فى بعض سخ
  كذا فى بعض نسخ الصجاح اه
