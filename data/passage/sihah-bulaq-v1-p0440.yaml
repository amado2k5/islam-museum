text: |-
  ⁦(تصل انحا.)⁩
  ٢٠٤
  صل ابا ننخ) مخ كلمة تقال عضد المدح والرضا بالشئ وتكرر للمبالغة
  فيقال مح مخ فان وصلت تخضت ونونت فقلت مح يخ وريماش ددت كالاسم وقد
  جعهما الشاعر فقال يصف بنا
  روافد أكرم الرافدات * مخ لليخ لبحرخضم
  ويخبخت الرحل اذاقات له ذلك قال الجاج لاعشى همدان فى قوله
  يين الاشح وبين قيس باذخ * بخبخ اوالده وللمولود
  واللّٰه لا بخبخت بعدها وتتحبخ الحرّسكن بعض فورته بقال بخيخواءنكم من الطه-يرة أى
  أبردوا وربعا قالواختجبوار(هو مقلوب منه و يخبخ البعيراذاه در وملات شقشقته فه فهو
  جل بخباخ الهدير خ) البذخ المكبر وقد بذخ بالسكسروتبذخ أى ته كبر وعلا وشرف
  باذخ أى عال والبوادخ -ن الجبال الشوامخ وامرأة بيذخ أى باد: ⁦(بريخ)⁩ البرامخ
  خزف الكنف توصل من السطح الى الارض رزخ البرزخ الحاجز وين الشيتين
  والبرزخ مابين الدنيا والا خرة من وقت الموت الى البعث فن مات فة-ددخسل البرزخ
  زخ) البزخ خروج الصدرود خول الظهر ورجسل أبزخ رامرأة بزخاء وكذلت الفرس
  ذا اطمانت قطاته وصلبه وتسازخت المرأة اذا أخرجت عحيزتها وثيازحُ فلان عن الاهر
  أى تقاعس وبزاخة موضع كانت يه وقعة لابي يكروضى اللّٰه عنه طخ) البطيضة
  واحدة البطيخ وأبطخ القوم كثرعندهم البليخ ١ والمبطغة بالفتح موضع البطيخ وضم
  الطاءفيه لغة خ بلخ الرجل بالكسر وتبلج أت كبرة، وأبلح بين البلخ ٢ وخ
  باخ الحر والنار والغضب والحى أى سكن وفتر قال رؤية حتى ييوخ الفضب الهيت
  وعداحق باخ أى أعيا وهم فى يوخ من أمرهم بالضم أى فى اختلاط
  صل التا ( خخ لتخ العيين الحامض وقد تخ تخوخا وأتخه صاحبه والتضعفة
  حكاية صوت
  (صل الثاه روخ ناخت قدمه بالوحل تنوخ وقنيخ خاضت وعابت فيه وقال
  المتخخل بصف سيفا
  أيض كالرجع رسوب اذا • ماناخ فى محتفل يختل
  وقال أبوذؤيب يصف فرسا
  قصر الصبوح امافشرح بلهها.بالتىّ فهى تشوخ فيها الاصبع
  صل الجيم خم خ بيوله رمى به ويججفت الرحل صرعنه وجخ ف لان وجفجخ
  وينجيم اذا اضطمع وقبكن واسترخى وقال الاغلب العجلى ان سرك العزجنهيخ بحشم
  ( جفخ حمخ فروتكبر مثل خف وحم فهوجفاخ وبهاحُ ودوحفخ ودوجخ وجافه
  وجامخه جلج) جلخ السيل الوادى يحلفه جلخا أى ملا"،فهوسيل جلاخ وأما الإلاح
  بالحاءغير مجهة فهوالجراف والجلواخ الوادى الواسع الممتلى ⁦(جوخ)⁩. تجوّخت البئر
  انهارت وجاخ السيل الوادى اقتلع أجرافه قال الشاعر فللصخر من جوخ السيول وجيب
  والجوخان الجرين بلغة أهل البصرة
  صسل الخاء خوخ الخوخة واحدة اندوخ والدوخة أيضا كوّة فى الجدار
  PA
