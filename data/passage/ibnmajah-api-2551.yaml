label: { ar: "سنن ابن ماجه 2551 — ما أُحل", en: "Sunan Ibn Majah 2551 — what was made lawful", ur: "سنن ابن ماجہ 2551 — جو حلال کیا گیا" }
text: "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ، حَدَّثَنَا خَالِدُ بْنُ الْحَارِثِ، أَنْبَأَنَا سَعِيدٌ، عَنْ قَتَادَةَ، عَنْ حَبِيبِ بْنِ سَالِمٍ، قَالَ أُتِيَ النُّعْمَانُ بْنُ بَشِيرٍ بِرَجُلٍ غَشَى جَارِيَةَ امْرَأَتِهِ فَقَالَ لاَ أَقْضِي فِيهَا إِلاَّ بِقَضَاءِ رَسُولِ اللَّهِ. قَالَ إِنْ كَانَتْ أَحَلَّتْهَا لَهُ جَلَدْتُهُ مِائَةً وَإِنْ لَمْ تَكُنْ أَذِنَتْ لَهُ رَجَمْتُهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2551، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2551 (The Chapters on Legal Punishments), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2551، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
