label: { ar: "سنن ابن ماجه 2551 — ما أُحل", en: "Sunan Ibn Majah 2551 — what was made lawful", ur: "سنن ابن ماجہ 2551 — جو حلال کیا گیا", es: "Sunan Ibn Majah 2551: lo que se hizo lícito", fr: "Sunan Ibn Majah 2551 — ce qui a été rendu licite", tr: "Sünen İbni Mace 2551 — İzin verilenler", id: "Sunan Ibnu Majah 2551 — Apa yang dibolehkan" }
text: "حَدَّثَنَا حُمَيْدُ بْنُ مَسْعَدَةَ، حَدَّثَنَا خَالِدُ بْنُ الْحَارِثِ، أَنْبَأَنَا سَعِيدٌ، عَنْ قَتَادَةَ، عَنْ حَبِيبِ بْنِ سَالِمٍ، قَالَ أُتِيَ النُّعْمَانُ بْنُ بَشِيرٍ بِرَجُلٍ غَشَى جَارِيَةَ امْرَأَتِهِ فَقَالَ لاَ أَقْضِي فِيهَا إِلاَّ بِقَضَاءِ رَسُولِ اللَّهِ. قَالَ إِنْ كَانَتْ أَحَلَّتْهَا لَهُ جَلَدْتُهُ مِائَةً وَإِنْ لَمْ تَكُنْ أَذِنَتْ لَهُ رَجَمْتُهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2551، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2551 (The Chapters on Legal Punishments), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2551، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2551 (Capítulos sobre castigos legales), menciona lo que se considera lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 2551 (Chapitres sur les peines légales), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde 2551 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, helal ve haram konusunda Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri bir araya getiren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 2551, menyebutkan apa yang diperbolehkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang menggabungkan ayat-ayat dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
