label: { ar: "سنن النسائي 134 — الأب والأبوة", en: "Sunan al-Nasa'i 134 — the father and fatherhood", ur: "سنن نسائی 134 — باپ اور والدیت", es: "Sunan al-Nasa'i 134 — El padre y la paternidad", fr: "Sunan al-Nasa'i 134 — le père et la paternité" }
text: "أَخْبَرَنَا إِسْمَاعِيلُ بْنُ مَسْعُودٍ، قَالَ حَدَّثَنَا خَالِدُ بْنُ الْحَارِثِ، عَنْ شُعْبَةَ، عَنْ مَنْصُورٍ، عَنْ مُجَاهِدٍ، عَنِ الْحَكَمِ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ كَانَ إِذَا تَوَضَّأَ أَخَذَ حَفْنَةً مِنْ مَاءٍ فَقَالَ بِهَا هَكَذَا - وَوَصَفَ شُعْبَةُ - نَضَحَ بِهِ فَرْجَهُ فَذَكَرْتُهُ لإِبْرَاهِيمَ فَأَعْجَبَهُ قَالَ الشَّيْخُ ابْنُ السُّنِّيِّ قَالَ أَبُو عَبْدِ الرَّحْمَنِ الْحَكَمُ هُوَ ابْنُ سُفْيَانَ الثَّقَفِيُّ."
summary:
  ar: "حديث في سنن النسائي، رقم 134، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 134 (The Book of Purification), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 134، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 134 (El Libro de la Purificación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 134 (Le Livre de la Purification), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
