text: "وتوابع ذلك اختلاف الناس في معنى التغني بالقرآن فصل : في هديه في عيادة المرضى الرقية والاسترقاء فصل: في هديه في الجنائز والصلاة عليها، واتِّباعها، ودفنها، وما كان يدعو به للميت في صلاة الجنازة وبعد الدفن وتوابع ذلك فصل الإسراع …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 1070، يذكر الرقية، والمرض والمريض، وعيادة المريض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1070, that mentions ruqya recited over the sick, illness and the sick, visiting the sick; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 1070 کا اقتباس جس میں رقیہ، بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 1070, que menciona la ruqya recitada sobre los enfermos, la enfermedad y los enfermos, y la visita a los enfermos; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 1070, qui mentionne la ruqya récitée sur les malades, la maladie et les malades, la visite aux malades; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 1070. sayfasından, büyü, hastalık ve hasta ziyareti konularından bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, halaman 1070, yang menyebutkan tentang mantra, penyakit dan orang sakit, serta mengunjungi orang sakit; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
