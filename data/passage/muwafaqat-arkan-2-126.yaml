text: "… ما يشهد لما قبلها شاهداً لها. غير أن ذلك فيها معتبر من جهة صفة العبودية وامتثال الأمر، لا من جهة أمر آخر. فسواء شعب الإيمان بسند صحيح عن عبد اللّه بن سلام قال: كان النبي ولف إذا نزلت بأهله شدة …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 2، ص 126، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 2, p. 126, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 2، ص 126 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Muwafaqat de al-Shatibi, volumen 2, pág. 126, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait des <i>Mulwafaqat</i> d'al-Shatibi, tome 2, page 126, mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "El-Şatibi'nin El-Muvefakat adlı eserinin 2. cildinin 126. sayfasından, inancın dallarını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 2, halaman 126, yang menyebutkan cabang-cabang iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
