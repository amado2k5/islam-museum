text: "… بأمرٍ فأتوا منه ما أستطعتُم، وإذا نَهيتُكم عن شيءٍ فاترُكوه فصَحَّ أن كُلَّ ما أمَرَ به النَّبيُّ لللم فلا يَحلُّ مُخالفَتُه، وكُلُّ ما نَهى عنه فلا يَحِلُّ موافقتُه، وكُلُّ ما لم ينْه عنه ولا أمَرَ به فمُباحٌ لا يَحلُ إيجابُه …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 429، يرد فيه ذكر الوجوب، والمباح، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 429, whose wording mentions obligation (wujub), the permitted (mubah), what is not lawful; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 429 کا اقتباس جس میں وجوب، مباح، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 429, dont le texte mentionne l'obligation (wujub), le permis (mubah), ce qui n'est pas licite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 429, cuyo texto menciona la obligatoriedad (wujub), lo permitido (mubah), lo que no es lícito; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 429. sayfasından, farz, helal ve haram fiilleri ele alan bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 429, yang membahas tentang amalan wajib, amalan yang diperbolehkan, dan amalan yang tidak diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
