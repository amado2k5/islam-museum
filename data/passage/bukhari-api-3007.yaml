label: { ar: "صحيح البخاري 3007 — النسب والانتساب", en: "Sahih al-Bukhari 3007 — paternity and lineage", ur: "صحیح بخاری 3007 — نسب اور انتساب", es: "Sahih al-Bukhari 3007 — paternidad y linaje", fr: "Sahih al-Bukhari 3007 — paternité et lignée" }
text: "… مِنْ أَنْفُسِهَا، وَكَانَ مَنْ مَعَكَ مِنَ الْمُهَاجِرِينَ لَهُمْ قَرَابَاتٌ بِمَكَّةَ، يَحْمُونَ بِهَا أَهْلِيهِمْ وَأَمْوَالَهُمْ، فَأَحْبَبْتُ إِذْ فَاتَنِي ذَلِكَ مِنَ النَّسَبِ فِيهِمْ أَنْ أَتَّخِذَ عِنْدَهُمْ يَدًا يَحْمُونَ بِهَا قَرَابَتِي، وَمَا فَعَلْتُ كُفْرًا وَلاَ ارْتِدَادًا وَلاَ رِضًا بِالْكُفْرِ بَعْدَ الإِسْلاَمِ. فَقَالَ رَسُولُ اللَّهِ \" لَقَدْ صَدَقَكُمْ \". قَالَ عُمَرُ يَا رَسُولَ اللَّهِ دَعْنِي أَضْرِبْ عُنُقَ هَذَا الْمُنَافِقِ. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3007، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3007 (Fighting for the Cause of Allah (Jihaad)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3007، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3007 (La lucha por la causa de Alá (Yihad)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3007 (Combat pour la cause d'Allah (Jihad)), mentionne la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
