text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَبِي الْمُتَوَكِّلِ، عَنْ أَبِي سَعِيدٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ إِنَّ أَخِي اسْتَطْلَقَ بَطْنُهُ. فَقَالَ \" اسْقِهِ عَسَلاً \". فَسَقَاهُ. فَقَالَ إِنِّي سَقَيْتُهُ فَلَمْ يَزِدْهُ إِلاَّ اسْتِطْلاَقًا. فَقَالَ \" صَدَقَ اللَّهُ وَكَذَبَ بَطْنُ أَخِيكَ \". تَابَعَهُ النَّضْرُ عَنْ شُعْبَةَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5716، يذكر التداوي بالعسل، وأسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5716 (Medicine), that mentions honey as a remedy, named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5716، جس میں شہد سے علاج، بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
