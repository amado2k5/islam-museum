label: { ar: "صحيح البخاري 5716 — التداوي بالعسل، أسماء الأمراض", en: "Sahih al-Bukhari 5716 — honey as a remedy; named diseases", ur: "صحیح بخاری 5716 — شہد سے علاج، بیماریوں کے نام", es: "Sahih al-Bukhari 5716 — La miel como remedio; enfermedades mencionadas", fr: "Sahih al-Bukhari 5716 — Le miel comme remède; maladies nommées", tr: "Sahih el-Buhari 5716 — Bal ile tedavi, hastalıkların isimleri", id: "Sahih al-Bukhari 5716 — Pengobatan dengan madu, nama-nama penyakit" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَبِي الْمُتَوَكِّلِ، عَنْ أَبِي سَعِيدٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ إِنَّ أَخِي اسْتَطْلَقَ بَطْنُهُ. فَقَالَ \" اسْقِهِ عَسَلاً \". فَسَقَاهُ. فَقَالَ إِنِّي سَقَيْتُهُ فَلَمْ يَزِدْهُ إِلاَّ اسْتِطْلاَقًا. فَقَالَ \" صَدَقَ اللَّهُ وَكَذَبَ بَطْنُ أَخِيكَ \". تَابَعَهُ النَّضْرُ عَنْ شُعْبَةَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5716، يذكر التداوي بالعسل، وأسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5716 (Medicine), that mentions honey as a remedy, named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5716، جس میں شہد سے علاج، بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 5716 (Medicina), menciona la miel como remedio y enumera enfermedades. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5716 (Médecine), mentionne le miel comme remède contre diverses maladies. Le navigateur de textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5716 numaralı hadis, bal ile tedavi yönteminden bahsetmekte ve hastalıkların isimlerini sıralamaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5716, menyebutkan pengobatan dengan madu dan mencantumkan nama-nama penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
