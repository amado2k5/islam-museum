text: "… رفعت امرأة صبيا لها فقالت: يارسول اللّه ألهذا حج؟ قال: نعم ولك أجر. فلوحج الصبي صح حجه وكان تطوعا، فإذا بلغ الصبي وجب عليه حجة الفريضة، بإجماع العلماء، لأنه أدى مالم يجب عليه، فلا يكفيه عن الحج الواجب بعد البلوغ، …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 3، ص 32، يرد فيه ذكر الفريضة والفرائض، والواجب، وما يجب على المكلف، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 3, p. 32, whose wording mentions the obligation (farida), the obligatory (wajib), what is binding on the person addressed, the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 3، ص 32 کا اقتباس جس میں فریضہ اور فرائض، واجب، جو مکلف پر واجب ہے، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 3, p. 32, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), ce qui s'impose à la personne responsable, l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 3, p. 32, cuyo texto menciona la obligación (farida), lo obligatorio (wajib), lo que obliga a la persona responsable, el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
