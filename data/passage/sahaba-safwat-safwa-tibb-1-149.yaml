text: "… شقي في بطن أمه، وإن السعيد من وُعِظ بغيره، ألا وإن قتال المسلم كفر، وسبابه فسوق، ولا يحل لمسلم أن يهجر أخاه فوق ثلاثة أيام حتى يسلم عليه إذا لقيه، ويجيبه إذا دعاه ويعوده إذا مرض، ألا وإن شر الروايا …"
