label:
  ar: "البخاري 7422 — إن رحمتي سبقت غضبي"
  en: "Bukhari 7422 — My mercy outstrips My anger"
  ur: "بخاری 7422 — میری رحمت میرے غضب پر سبقت لے گئی"
  es: "Bukhari 7422 — Mi misericordia supera mi ira"
  fr: "Bukhari 7422 — Ma miséricorde surpasse Ma colère"
  tr: "Buhari 7422 — Merhametim gazabımdan önce gelir."
  id: "Al-Bukhari 7422 — Rahmat-Ku mendahului murka-Ku"
text: "إن الله لما قضى الخلق كتب عنده فوق عرشه إن رحمتي سبقت غضبي ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7422: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7422: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7422: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7422: Mi misericordia supera mi ira. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 7422: « Ma miséricorde surpasse Ma colère. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 7422 numaralı hadis-i kudsi şöyledir: \"Rahmetim gazabımdan önce gelir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 7422: “Rahmat-Ku mendahului murka-Ku.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta."
