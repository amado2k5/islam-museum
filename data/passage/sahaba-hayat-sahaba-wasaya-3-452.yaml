text: "… ص من حكيم بن قيس بن عاصم أن أباه أوصى عند موته بنيه فقال : اقولة! وسودوا اكبركم! فان القوم إذا سودوا اكبرهم خلفوا اياهم وإذا سودوا اصغرهم ازرى بهم ذلك فى أكفائهم. وعليكم بالمال"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 3، ص 452، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 3, p. 452, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 3، ص 452 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 3, pág. 452, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 3, page 452, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "El-Kandhlawi'nin Peygamberin Sahabelerinin Biyografileri adlı eserinin resimli 3. cildinin 452. sayfasında, son vasiyetname ve ölüm saati belirtilmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi para Sahabat Nabi karya al-Kandhlawi, jilid 3 bergambar, halaman 452, menyebutkan wasiat terakhir dan saat kematian; dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
