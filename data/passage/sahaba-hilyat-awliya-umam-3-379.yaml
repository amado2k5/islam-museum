text: "… ثنا محمد بن اسحاق عن الزهرى عن سعيد بن المسيب عن أبى هريرة عن النبى مثله. ورواه مسلم بن خالد الزنجى عن عبد الرحن مقرونا بأبى سلمة حدثنا محمد بن ممر بن سلام ثنا مجمد بن عبد الله بن أبى …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 379، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 379, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 3، ص 379 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
