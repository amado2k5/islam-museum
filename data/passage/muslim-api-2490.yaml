text: "بَعَثَ إِلَىَّ رَسُولُ اللَّهِ صلى الله عليه وسلم بِشَاةٍ مِنَ الصَّدَقَةِ فَبَعَثْتُ إِلَى عَائِشَةَ مِنْهَا بِشَىْءٍ فَلَمَّا جَاءَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِلَى عَائِشَةَ قَالَ ‏\"‏ هَلْ عِنْدَكُمْ شَىْءٌ ‏\"‏ ‏.‏ قَالَتْ لاَ ‏.‏ إِلاَّ أَنَّ نُسَيْبَةَ بَعَثَتْ إِلَيْنَا مِنَ الشَّاةِ الَّتِي بَعَثْتُمْ بِهَا إِلَيْهَا قَالَ ‏\"‏ إِنَّهَا قَدْ بَلَغَتْ مَحِلَّهَا ‏\"‏ ‏.‏"
summary:
  ar: "في صحيح مسلم؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sahih Muslim; sending a letter or message to a party."
  ur: "صحیح مسلم میں؛ کسی فریق کو خط یا پیغام بھیجنا."
