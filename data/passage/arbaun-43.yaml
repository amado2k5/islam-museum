label: { ar: "الأربعون 43 — ألحقوا الفرائض بأهلها", en: "Arba'un 43 — give the fixed shares to their people" }
text: "ألحقوا الفرائض بأهلها فما أبقت الفرائض فلأولى رجل ذكر"
summary:
  ar: "حديث ابن عباس قال: قال رسول الله: «ألحقوا الفرائض بأهلها فما أبقت الفرائض فلأولى رجل ذكر» — أول الأحاديث الثمانية التي زادها ابن رجب على الأربعين النووية، ذاكراً أن بعض شراحها زعم أن النووي أغفله وهو المشتمل على أحكام المواريث والجامع لها؛ أخرجاه البخاري (6732، 6746) ومسلم (1615) من رواية وهيب وروح بن القاسم عن ابن طاوس عن أبيه عن ابن عباس، وخرجه مسلم أيضاً من رواية معمر ويحيى بن أيوب عن ابن طاوس، ورواه الثوري وابن عيينة وابن جريج وغيرهم عن ابن طاوس عن أبيه مرسلاً من غير ذكر ابن عباس ورجح النسائي إرساله؛ واختلف العلماء في معنى «ألحقوا الفرائض بأهلها» فذهب جماعة منهم الإمام أحمد وإسحاق بن راهويه إلى أن الفرائض الفروض المقدرة في كتاب الله وما بقي فلأقرب العصبات، وعلى هذا ذهب ابن عباس إلى أن الأخت مع البنت تأخذ الباقي بالتعصيب وكان يقر أن الناس كلهم على خلافه وتابعته الظاهرية، وذهب جمهور العلماء — عمر وعلي وعائشة وزيد وابن مسعود ومعاذ — إلى أن الأخت مع البنت عصبة لها ما فضل، وكان ابن الزبير ومسروق على قول ابن عباس ثم رجعا؛ واستدل بعضهم بقوله «فما بقي فلأولى رجل ذكر» على نفي ميراث ذوي الأرحام وأجاب المورثون لهم بأن الحديث دل على توريث العصبات لا على نفي توريث غيرهم، وأجاب ابن رجب عن إشكال «رجل ذكر» بأن الرجل قد يطلق ويراد به الشخص فجاء التقييد بالذكر إخلاصاً للمقصود؛ ورد على السهيلي كلاماً في الحديث فيه تكلف وتعسف (جامع العلوم والحكم ص 846–863)."
  en: "The hadith of Ibn Abbas that the Messenger of God said 'give the fixed shares to their people; whatever the shares leave over goes to the nearest male' — the first of the eight hadiths Ibn Rajab added beyond al-Nawawi's Forty, noting that some commentators claimed al-Nawawi had overlooked it though it comprises and gathers the rulings of inheritance; al-Bukhari (6732, 6746) and Muslim (1615) transmit it through Wahib and Ruh ibn al-Qasim from Ibn Tawus from his father from Ibn Abbas, Muslim also through Mu'ammar and Yahya ibn Ayyub from Ibn Tawus, while al-Thawri, Ibn Uyayna, Ibn Jurayj and others narrated it mursal from Ibn Tawus from his father without naming Ibn Abbas — al-Nasa'i preferring the mursal; scholars differed over 'give the shares to their people': a group including Ahmad and Ishaq ibn Rahuya held the shares are those fixed in God's Book and the remainder goes to the nearest agnate — on which Ibn Abbas held that the sister alongside the daughter takes the residue by agnation, admitting all others opposed him, the Zahiris joining him, while the majority — Umar, Ali, A'isha, Zayd, Ibn Masud, Mu'adh — held the sister is agnate-residuayer with the daughter, Ibn al-Zubayr and Masruq having held Ibn Abbas's view then retracted; some argued from 'to the nearest male' against the inheritance of distant kindred, answered by those who inherit them that the hadith establishes agnates without negating others; Ibn Rajab answered the puzzle of 'a male man' — rajul can denote a person, so 'male' restricts it as intended, and rejected al-Suhayli's strained treatment of the hadith (Jami' al-Ulum wal-Hikam pp. 846–863)."
