label: { ar: "الأربعون 43 — ألحقوا الفرائض بأهلها", en: "Arba'un 43 — give the fixed shares to their people", es: "Arba'un 43 — entreguen las acciones fijas a su pueblo", fr: "Arba'un 43 — donnez les parts fixes à leur peuple", ur: "اربعون 43 - مقررہ حصص ان کے لوگوں کو دیں۔" }
text: "ألحقوا الفرائض بأهلها فما أبقت الفرائض فلأولى رجل ذكر"
summary:
  ar: "حديث ابن عباس قال: قال رسول الله: «ألحقوا الفرائض بأهلها فما أبقت الفرائض فلأولى رجل ذكر» — أول الأحاديث الثمانية التي زادها ابن رجب على الأربعين النووية، ذاكراً أن بعض شراحها زعم أن النووي أغفله وهو المشتمل على أحكام المواريث والجامع لها؛ أخرجاه البخاري ⁦(6732، 6746)⁩ ومسلم (1615) من رواية وهيب وروح بن القاسم عن ابن طاوس عن أبيه عن ابن عباس، وخرجه مسلم أيضاً من رواية معمر ويحيى بن أيوب عن ابن طاوس، ورواه الثوري وابن عيينة وابن جريج وغيرهم عن ابن طاوس عن أبيه مرسلاً من غير ذكر ابن عباس ورجح النسائي إرساله؛ واختلف العلماء في معنى «ألحقوا الفرائض بأهلها» فذهب جماعة منهم الإمام أحمد وإسحاق بن راهويه إلى أن الفرائض الفروض المقدرة في كتاب الله وما بقي فلأقرب العصبات، وعلى هذا ذهب ابن عباس إلى أن الأخت مع البنت تأخذ الباقي بالتعصيب وكان يقر أن الناس كلهم على خلافه وتابعته الظاهرية، وذهب جمهور العلماء — عمر وعلي وعائشة وزيد وابن مسعود ومعاذ — إلى أن الأخت مع البنت عصبة لها ما فضل، وكان ابن الزبير ومسروق على قول ابن عباس ثم رجعا؛ واستدل بعضهم بقوله «فما بقي فلأولى رجل ذكر» على نفي ميراث ذوي الأرحام وأجاب المورثون لهم بأن الحديث دل على توريث العصبات لا على نفي توريث غيرهم، وأجاب ابن رجب عن إشكال «رجل ذكر» بأن الرجل قد يطلق ويراد به الشخص فجاء التقييد بالذكر إخلاصاً للمقصود؛ ورد على السهيلي كلاماً في الحديث فيه تكلف وتعسف ⁦(جامع العلوم والحكم ص 846–863)⁩."
  en: "The hadith of Ibn Abbas that the Messenger of God said 'give the fixed shares to their people; whatever the shares leave over goes to the nearest male' — the first of the eight hadiths Ibn Rajab added beyond al-Nawawi's Forty, noting that some commentators claimed al-Nawawi had overlooked it though it comprises and gathers the rulings of inheritance; al-Bukhari (6732, 6746) and Muslim (1615) transmit it through Wahib and Ruh ibn al-Qasim from Ibn Tawus from his father from Ibn Abbas, Muslim also through Mu'ammar and Yahya ibn Ayyub from Ibn Tawus, while al-Thawri, Ibn Uyayna, Ibn Jurayj and others narrated it mursal from Ibn Tawus from his father without naming Ibn Abbas — al-Nasa'i preferring the mursal; scholars differed over 'give the shares to their people': a group including Ahmad and Ishaq ibn Rahuya held the shares are those fixed in God's Book and the remainder goes to the nearest agnate — on which Ibn Abbas held that the sister alongside the daughter takes the residue by agnation, admitting all others opposed him, the Zahiris joining him, while the majority — Umar, Ali, A'isha, Zayd, Ibn Masud, Mu'adh — held the sister is agnate-residuayer with the daughter, Ibn al-Zubayr and Masruq having held Ibn Abbas's view then retracted; some argued from 'to the nearest male' against the inheritance of distant kindred, answered by those who inherit them that the hadith establishes agnates without negating others; Ibn Rajab answered the puzzle of 'a male man' — rajul can denote a person, so 'male' restricts it as intended, and rejected al-Suhayli's strained treatment of the hadith (Jami' al-Ulum wal-Hikam pp. 846–863)."
  es: "El hadiz de Ibn Abbas que el Mensajero de Dios dijo 'dad las partes fijas a su gente; lo que sobre de las partes va al varón más cercano' — el primero de los ocho hadices que Ibn Rajab añadió más allá de los Cuarenta de al-Nawawi, señalando que algunos comentaristas afirmaron que al-Nawawi lo había pasado por alto aunque comprende y reúne las normas de herencia; al-Bujari (6732, 6746) y Muslim (1615) lo transmiten a través de Wahib y Ruh ibn al-Qasim de Ibn Tawus de su padre de Ibn Abbas, Muslim también a través de Mu'ammar y Yahya ibn Ayyub de Ibn Tawus, mientras que al-Thawri, Ibn Uyayna, Ibn Jurayj y otros lo narraron mursal de Ibn Tawus de su padre sin nombrar a Ibn Abbas — al-Nasa'i prefirió el mursal; Los eruditos discreparon sobre \"dar las partes a su gente\": un grupo que incluía a Ahmad e Ishaq ibn Rahuya sostenía que las partes son las fijadas en el Libro de Dios y el resto va al agnado más cercano, sobre lo cual Ibn Abbas sostenía que la hermana junto con la hija toma el remanente por agnación, admitiendo que todos los demás se oponían a él, los Zahiris uniéndose a él, mientras que la mayoría — Umar, Ali, A'isha, Zayd, Ibn Masud, Mu'adh — sostenían que la hermana es agnada-residuayer con la hija, Ibn al-Zubayr y Masruq habían sostenido la opinión de Ibn Abbas y luego se retractaron; algunos argumentaban desde \"al varón más cercano\" contra la herencia de parientes lejanos, respondidos por aquellos que los heredan que el hadiz establece agnados sin negar a otros; Ibn Rajab resolvió el enigma de 'un hombre varón': rajul puede denotar a una persona, por lo que 'varón' lo restringe como se pretendía, y rechazó el tratamiento forzado que al-Suhayli hizo del hadiz (Jami' al-Ulum wal-Hikam pp. 846–863)."
  fr: "Le hadith d'Ibn Abbas selon lequel le Messager de Dieu a dit: « Donnez les parts fixes à leurs familles; le reste revient à l'homme le plus proche » — le premier des huit hadiths qu'Ibn Rajab a ajoutés aux quarante d'al-Nawawi, notant que certains commentateurs ont affirmé qu'al-Nawawi l'avait négligé bien qu'il comprenne et rassemble les règles d'héritage; al-Bukhari (6732, 6746) et Muslim (1615) le transmettent par Wahib et Ruh ibn al-Qasim d'Ibn Tawus de son père d'Ibn Abbas, Muslim également par Mu'ammar et Yahya ibn Ayyub d'Ibn Tawus, tandis qu'al-Thawri, Ibn Uyayna, Ibn Jurayj et d'autres l'ont rapporté mursal d'Ibn Tawus de son père sans nommer Ibn Abbas — al-Nasa'i préférant le mursal; Les savants divergeaient sur la question de la « distribution des parts à leurs proches »: un groupe comprenant Ahmad et Ishaq ibn Rahuya soutenait que les parts étaient celles fixées dans le Livre de Dieu et que le reste revenait au plus proche parent agnatique — Ibn Abbas, quant à lui, affirmait que la sœur, aux côtés de la fille, recevait le reliquat par filiation, reconnaissant que tous les autres s'y opposaient, les Zahirites se joignant à lui, tandis que la majorité — Umar, Ali, Aïcha, Zayd, Ibn Masoud, Mu'adh — soutenait que la sœur était l'héritière résiduelle agnatique avec la fille, Ibn al-Zubayr et Masruq ayant d'abord soutenu l'opinion d'Ibn Abbas avant de se rétracter; certains argumentaient en faveur de la transmission « au plus proche parent masculin » contre l'héritage des parents éloignés, ce à quoi ceux qui en héritaient répondaient que le hadith établissait les agnatiques sans en nier d'autres; Ibn Rajab a résolu l'énigme de « l'homme mâle » — rajul peut désigner une personne, donc « mâle » le restreint comme prévu, et a rejeté le traitement forcé du hadith par al-Suhayli (Jami' al-Ulum wal-Hikam pp. 846–863)."
  ur: "ابن عباس کی حدیث ہے کہ رسول اللہ نے فرمایا کہ ان کی قوم کو مقررہ حصہ دو۔ جو بھی حصہ چھوڑا جاتا ہے وہ قریب ترین مرد کے پاس جاتا ہے' - ابن رجب نے نووی کے چالیس سے آگے جو آٹھ احادیث شامل کی ہیں ان میں سے پہلی حدیث ہے، یہ نوٹ کرتے ہوئے کہ بعض مفسرین نے دعوی کیا ہے کہ النووی نے اسے نظر انداز کیا ہے حالانکہ یہ وراثت کے احکام پر مشتمل ہے اور جمع کرتی ہے۔ البخاری ⁦(6732، 6746)⁩ اور مسلم (1615) نے اسے وہیب اور روح بن القاسم نے ابن طاؤس سے اپنے والد سے ابن عباس سے، مسلم نے بھی معمر اور یحییٰ بن ایوب نے ابن طاؤس سے، جب کہ ثوری، ابن منار اور دیگر نے اسے روایت کیا ہے۔ ابن طاؤس نے اپنے والد سے ابن عباس کا نام لیے بغیر - النسائی نے مرسل کو ترجیح دی۔ اہل علم کا 'حصہ اپنے لوگوں کو دینے' میں اختلاف ہے: احمد اور اسحاق بن راہویہ سمیت ایک گروہ کا یہ خیال تھا کہ وہ حصص ہیں جو خدا کی کتاب میں مقرر ہیں اور بقیہ قریب ترین اجنبی کے پاس جاتا ہے - جس پر ابن عباس نے کہا کہ بیٹی کے ساتھ بہن باقیات کو اگنیشن کے ذریعہ لے جاتی ہے، یہ تسلیم کیا کہ باقی سب نے اس کی مخالفت کی، جبکہ عشر، عشر، عشرہ، عشرہ، عشرہ، عشرہ، عشرہ، عشرہ، وغیرہ نے اس کی مخالفت کی۔ زید، ابن مسعود، معاذ - نے بہن کو بیٹی کے ساتھ اگنیٹ بقایا ہے، ابن الزبیر اور مسروق نے ابن عباس کے قول کو مان لیا اور پھر پیچھے ہٹ گئے۔ کچھ نے دور کے رشتہ داروں کی وراثت کے خلاف 'قریب ترین مرد' سے استدلال کیا، ان لوگوں نے جواب دیا جو ان کے وارث ہیں کہ حدیث دوسروں کی نفی کیے بغیر اجناس قائم کرتی ہے۔ ابن رجب نے 'مرد مرد' کی پہیلی کا جواب دیا - رجول ایک شخص کو ظاہر کر سکتا ہے، لہذا 'مرد' نے اس پر پابندی لگا دی، اور سہیلی کی حدیث کے بارے میں سخت سلوک کو رد کر دیا ⁦(جامع العلوم والحکم صفحہ 846-863)⁩۔"
