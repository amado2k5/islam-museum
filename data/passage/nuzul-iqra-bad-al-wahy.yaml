label:
  ar: "بدء الوحي — اقرأ باسم ربك"
  en: "The beginning of revelation — "Read in the name of your Lord""
  fr: "Le début de la révélation — « Lis au nom de ton Seigneur »"
  es: "El comienzo de la revelación — «Lee en el nombre de tu Señor»"
  ur: "وحی کا آغاز — اپنے رب کے نام سے پڑھو"
