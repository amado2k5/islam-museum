  id: "Awal wahyu — «Bacalah dengan nama Tuhanmu»"
text: "قالت عائشة: أول ما بدئ به رسول الله من الوحي الرؤيا الصالحة في النوم، فجاءه الملك فقال: اقرأ باسم ربك الذي خلق، حتى فرغ من ما شاء الله"
summary:
  ar: "حديث عائشة في بدء الوحي: الرؤيا الصالحة ثم مجيء الملك إلى غار حراء بأول سورة العلق — أشهر واقعة في أسباب النزول، عند البخاري 3"
  en: "Aisha's hadith on how revelation began: the true dream, then the angel's coming to the cave of Hira with the opening of surat al-'Alaq — the most famous occasion of revelation, in Bukhari 3"
  es: "Hadiz de Aisha sobre el inicio de la revelación: el sueño verdadero y luego la llegada del ángel a la cueva de Hira con el comienzo de la sura al-'Alaq — la ocasión de revelación más famosa, en Bujari 3"
  fr: "Hadith d'Aisha sur le début de la révélation : le rêve véridique puis la venue de l'ange à la grotte de Hira avec le début de sourate al-'Alaq — la plus célèbre circonstance de révélation, chez Bukhari 3"
  ur: "عائشہ کی حدیث عن بدء الوحی: سچے خواب، پھر غار حراء میں فرشتے کا آنا اور سورہ علق کا آغاز — اسباب نزول میں سب سے مشہور واقعہ، بخاری 3"
  tr: "Aişe'nin vahyin başlangıcına dair hadisi: doğru rüya, ardından meleğin Hira mağarasına Alak suresinin başıyla gelmesi — en meşhur nüzul sebebi, Buhari 3"
  id: "Hadits Aisyah tentang permulaan wahyu: mimpi yang benar, lalu datangnya malaikat di gua Hira membawa pembuka surat al-'Alaq — sebab turun paling masyhur, dalam Bukhari 3"
