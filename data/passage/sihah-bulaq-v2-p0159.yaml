text: |-
  ٤٢٨
  *عض)،
  وجعل الاسهين اسما واحداويناه على الفتح مثل خمسة عشر
  صل الصاد ه صه كلمة بنيت على السكون و«واسم سمى بد الفعل ومعناه
  اسكت تقول الرجل اذا أسكته صه فان وصلت تونت فقلت مهصه وقال المبردفان قات صه
  يارجل بالتنوين فاغماتر يد الفرق بين التعريف والتنكير لان التنوين تنكير
  صل الدين) نه) المعتوه النساقص العقل وقد عته عنها والتعته التهنئ والرعونة
  يقال رجل معنوه بين العنه ذكره أبو عبيد فى المصادر التى لا تشتق منها الافعال قال رؤية
  بعد لهاج لا يكادينتهى • عن التصابى وعن التعنه .
  وقال الاخفسْ رجل عتاهية وهو الاحق وأبو العتاهية كنية عجه ، العنهى ذوالباو
  وقال الفراء يقال فلان ذو عنجهية وعنجهائيسة وهى الكبر والعظمة ويقال العنجهمة
  الجهل والحمق ويند
  عش عدْفلم يضرّ لابوك • انماعيش من رى بجدود
  ربذي اربة مقل من الما • ل وذى عنجهية مجدود
  ده العيده السيء الحلق من الابل وغيره قال روية * وخبط صهميم اليسدين عيده*
  وفى فلان عيده وعيدهية أى سوءخلق وكبر فهو عبده وعيداه وقال
  وانى على ما كان من عيدهيتى • ولوثة أعرابيتى لاريب .
  ( عزه رجل عزهاة وعزهاءة وعزهى منوّن لا يطرب لله و ويبعد عنه والجمع عزاه مثسل
  سعلاة وسعال وعزهون بالضم الكسائى رجل فيه عنزهوة أى كبر ⁦(عضه)⁩. العضاه كل
  شجر بعظم وله شول وهو على ضربين خالص وغير خااص فانلخالص العرفط والطلح والسلم
  والسدر والسمال والسمر واليقبوت والقتاد الاعظم والكنهبل والغ
  وغيرا نظا اأص الشوسط والنبع والشريان والسراه والشم والجيرم والنانب والقرف في
  تدهى عضاه القماس من القوس وماصغر من شجر الشولك فهو العض وقدذكرناه فى الضاد
  وماليس بعض ولاعضاه من شجر الشوك فالشكاعى والاوى والخاذ والكب والسلج
  وواحدة العضاء عضاهة وعضهة وعضة بهذف الهاء الاصلية كما حذفت من الشفة وقال
  اذامات منهم ميت سرق ابنه • ومن عضة ما ينبتن شكيرها
  اونقصانها الهاء لانها تجمع على عضاه مثل شفاء فتردّالهاو فى الجمع وتصغر على عضيهة ويذسب
  اليها فيقال بعير عضهى للذى برعاها وبعير عضاهىّ وابل عضاهية وبعضهم يقول نقصانها
  الواولانها تجمع على عضوات وينشد
  هذاطر يق يأزم الما زما • وعضوات تقطع اللهاذما
  ويقال بعير عضوىّ وابل عضوية بفتح العين على غير قياس وعضهت الابل بالكسر تعضه
  عضها اذارعت العضاه وبعيرعاضه وعضه وقال
  وتربوا كل جمالى عضه • قريبة ندوته من محمضة
  وجمال عواضه وناقة عاضه أيضا وأعضه القوم رعت ابلهم العضاه وأرض معضهة كثيرة
  العضاه والعضيهة البهيتة وهى الافك والبهنان تقول باللعضيهة بكسر اللام وهى استغاثة
  والتعضه
