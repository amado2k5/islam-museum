text: "راس النائبة عن البشرات الجاسية إلى غير ذلك مما ذكره جالينوس في كتاب (منافع الأعضاء)». فالواحد من البشر لا تقاوم قدرته قدرة واحد من الحيوانات العجم سيما المفترسة، فهو عاجز عن مدافعتها وحده بالجملة ولا تفي قدرته أيضا باستعمال الآلات"
