label: { ar: "الموطأ 2455 — إسحاق بن عبد الله بن أبي طلحة عن أنس: كسر الجرار حين حرمت الخمر", en: "Muwatta 2455" }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك أنه قال: كنت أسقي أبا عبيدة بن الجراح وأبا طلحة الأنصاري وأُبيّ بن كعب شرابا من الفضيخ والتمر، فجاءهم آت فقال: إن الخمر قد حُرمت. فقال أبو طلحة: يا أنس، قم إلى هذه الجرار فاكسرها، فكسرتها بأسفل المهراس. {cite:muwatta-maruf-1997 p.415}"
