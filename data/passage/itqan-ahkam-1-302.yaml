text: "… كالابل القماح قال اخبرني عن قوله في اعر مريج قال المريج الباطل اما سمعت قول الشاعر فراءت فانتقدت به حشاها فخر كأنه خوط مريج قال اخبرني عن قوله حتما مقضيا قال الحتم الواجب اما سمعت قول امية عبادك يخطيون وانت …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 302، يرد فيه ذكر الواجب، والحتم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 302, whose wording mentions the obligatory (wajib), the binding (hatm); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 302 کا اقتباس جس میں واجب، حتمی حکم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
