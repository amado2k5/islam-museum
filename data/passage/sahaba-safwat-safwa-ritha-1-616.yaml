text: "… صلة لأصحابه : هذا كان أمثل مما أردتم، لو شتمتموه لشتمكم. قال حماد بن سلمة: أنبأ ثابت أن أخاً لصلة بن أشيم مات فجاء رجل وهو يطعم. فقال: يا أبا الصهباء إن أخاك مات! فقال: هلم فكُل، قد نعي لنا، …"
