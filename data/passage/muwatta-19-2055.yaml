label: { ar: "الموطأ 2055 — مالك: كل مقارض أو مساق لا ينبغي له أن يستثني من المال ولا من النخل شيئا دون صاحبه، لأنه يصير أجيرا بذلك، وذلك الأمر عندنا", en: "Muwatta 2055", es: "Muwatta 2055", fr: "Muwatta 2055", ur: "موطا 2055", tr: "Al-Muwatta 2055 — Malik: Her ortakçı veya ortak çiftçi, ortağından paradan veya hurma ağaçlarından hiçbir şeyi esirgememelidir; çünkü bunu yaparak ücretli işçi haline gelir ve bizim durumumuz da böyledir.", id: "Al-Muwatta 2055 — Malik: Setiap petani penggarap atau petani penyewa tidak boleh mengecualikan apa pun dari uang atau pohon kurma dari rekannya, karena dengan melakukan itu ia menjadi buruh upahan, dan itulah masalahnya bagi kita." }
summary:
  ar: "قال مالك: وكل مقارض أو مساق فلا ينبغي له أن يستثني من المال، ولا من النخل شيئا دون صاحبه، وذلك أنه يصير أجيرا بذلك. يقول: أساقيك على أن تعمل لي في كذا وكذا نخلة، تسقيها وتأبرها، وأقارضك في كذا وكذا من المال، على أن تعمل لي بعشرة دنانير ليست مما أقارضك عليه. فإن ذلك لا ينبغي ولا يصلح. وذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.241}"
  tr: "Malik şöyle dedi: Her ortakçı veya ortak çiftçi, ortağından para veya hurma ağaçlarından hiçbir şeyi esirgememelidir; çünkü bunu yaparsa ücretli işçi olur. Şöyle diyebilir: \"Şu ve şu hurma ağaçlarında sulama ve tozlaştırma işlerinde çalışman şartıyla seninle ortakçılık yapacağım ve sana şu ve şu miktarda para vereceğim, karşılığında da sana verdiğim paranın dışında on dinar daha kazanman şartıyla.\" Bu caiz değildir ve kabul edilemez. Bu, aramızda yerleşik bir uygulamadır. {cite:muwatta-maruf-1997 s.241}"
  id: "Malik berkata: Setiap petani penggarap atau petani penggarap tidak boleh mengecualikan apa pun dari uang atau pohon kurma dari rekannya, karena dengan melakukan itu ia menjadi buruh upahan. Ia mungkin berkata, \"Saya akan bertani dengan Anda dengan syarat Anda bekerja untuk saya di pohon kurma tertentu, menyirami dan menyerbukinya, dan saya akan meminjamkan Anda sejumlah uang tertentu dengan syarat Anda bekerja untuk saya selama sepuluh dinar yang bukan bagian dari apa yang saya pinjamkan kepada Anda.\" Ini tidak diperbolehkan dan tidak dapat diterima. Ini adalah praktik yang sudah mapan di antara kita. {cite:muwatta-maruf-1997 p.241}"
