label: { ar: "الموطأ 2055 — مالك: كل مقارض أو مساق لا ينبغي له أن يستثني من المال ولا من النخل شيئا دون صاحبه، لأنه يصير أجيرا بذلك، وذلك الأمر عندنا", en: "Muwatta 2055" }
summary:
  ar: "قال مالك: وكل مقارض أو مساق فلا ينبغي له أن يستثني من المال، ولا من النخل شيئا دون صاحبه، وذلك أنه يصير أجيرا بذلك. يقول: أساقيك على أن تعمل لي في كذا وكذا نخلة، تسقيها وتأبرها، وأقارضك في كذا وكذا من المال، على أن تعمل لي بعشرة دنانير ليست مما أقارضك عليه. فإن ذلك لا ينبغي ولا يصلح. وذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.241}"
