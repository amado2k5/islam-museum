text: "… إليه ما دام عليه صاحبه. حدثنا مبدالله حدثنا أبي حدثنا زيد بن يحيى الدم شقي حادثنا خالد بن صبيح حدثنا يونس بن حليس قال قال أبو مسلم الحولاني ليس الزهادة في الدنيا بتحريم الحلال ولا إضاعة المال إنما الزهادة في …"
