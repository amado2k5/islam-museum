text: "يستحق عليه، وهذا إنما يطابقه من الأسماء التفضل، ومن ثم قال في خطاب الأزواج: طولا تنسوا لفضل بينكم) لان العينول من جهته غير مستحق عليه، فهو ضل لا عفو. ولا يقال: لعل الزوج تعجل المهل كاملا قبل الطلاق، وطلق، قيجب"
