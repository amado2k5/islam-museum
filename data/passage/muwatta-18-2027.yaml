label: { ar: "الموطأ 2027 — مالك: فيمن دفع إليه مالا قراضا فتعدى، فاشترى به سلعة وزاد في ثمنها من عنده: صاحب المال بالخيار، إن شاء أخذ السلعة وقضاه ما أسلفه فيها، وإن أبى كان المقارض شريكا له بحصته من الثمن في النماء والنقصان بحساب ما زاد العامل فيها من عنده", en: "Muwatta 2027", es: "Muwatta 2027", fr: "Muwatta 2027", ur: "موطا 2027", tr: "Al-Muwatta 2027 — Malik: Bir kimse bir başkasına borç para verirse ve o kişi bu parayla mal alıp kendi parasıyla fiyatını artırırsa, borç alanın seçeneği vardır; isterse malları alıp borcunu geri ödeyebilir. Eğer reddederse, borç alan kişi onunla ortak olur ve kendi parasıyla eklediği artış veya azalış oranına göre fiyattan pay alır.", id: "Al-Muwatta 2027 — Malik: Mengenai seseorang yang memberi uang kepada orang lain sebagai pinjaman, dan orang yang menerima pinjaman tersebut melanggar dengan membeli barang dengan uang itu dan menaikkan harganya dari dana pribadinya: pemilik uang memiliki pilihan; jika ia mau, ia dapat mengambil barang tersebut dan membayar kembali apa yang telah dipinjamkannya. Jika ia menolak, penerima pinjaman menjadi mitra dengannya, berbagi harga sesuai dengan bagian kenaikan atau penurunan yang proporsional dengan apa yang ditambahkan oleh pekerja dari dana pribadinya." }
summary:
  ar: "قال مالك في رجل دفع إليه مالا قراضا، فتعدى، فاشترى به سلعة، وزاد في ثمنها من عنده. قال مالك: صاحب المال بالخيار: إن بيعت السلعة بربح أو وضيعة أو لم تبع، إن شاء أن يأخذ السلعة أخذها وقضاه ما أسلفه فيها. وإن أبى، كان المقارض شريكا له بحصته من الثمن في النماء والنقصان، بحساب ما زاد العامل فيها من عنده. {cite:muwatta-maruf-1997 p.229}"
  tr: "Malik, birine kâr paylaşımı anlaşması için para veren ve bu kişinin parayı kötüye kullanarak kendi parasıyla mal satın alıp fiyatı artıran bir adam hakkında şunları söyledi: Malik şöyle dedi: Paranın sahibi, malların kârla veya zararla satılıp satılmaması fark etmeksizin, isterse malları geri alıp borç verene verdiği parayı iade etme seçeneğine sahiptir. Eğer bunu reddederse, borç veren onunla ortak olur ve kendi parasıyla eklediği miktara oranla kâr veya zarardan pay alır. {cite:muwatta-maruf-1997 s.229}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada seseorang untuk kesepakatan bagi hasil, dan pria itu menyalahgunakannya dengan membeli barang dan menambah harga dari dana pribadinya: Malik berkata: Pemilik uang memiliki pilihan: apakah barang tersebut dijual dengan untung atau rugi, atau tidak sama sekali, jika ia ingin mengambil kembali barang tersebut dan mengembalikan uang yang telah diberikannya kepada pemberi pinjaman. Jika ia menolak, pemberi pinjaman menjadi mitra dengannya, berbagi keuntungan atau kerugian sesuai dengan bagiannya dari harga, sebanding dengan jumlah yang ditambahkan pemberi pinjaman dari dana pribadinya. {cite:muwatta-maruf-1997 p.229}"
