label: { ar: "الموطأ 2027 — مالك: فيمن دفع إليه مالا قراضا فتعدى، فاشترى به سلعة وزاد في ثمنها من عنده: صاحب المال بالخيار، إن شاء أخذ السلعة وقضاه ما أسلفه فيها، وإن أبى كان المقارض شريكا له بحصته من الثمن في النماء والنقصان بحساب ما زاد العامل فيها من عنده", en: "Muwatta 2027" }
summary:
  ar: "قال مالك في رجل دفع إليه مالا قراضا، فتعدى، فاشترى به سلعة، وزاد في ثمنها من عنده. قال مالك: صاحب المال بالخيار: إن بيعت السلعة بربح أو وضيعة أو لم تبع، إن شاء أن يأخذ السلعة أخذها وقضاه ما أسلفه فيها. وإن أبى، كان المقارض شريكا له بحصته من الثمن في النماء والنقصان، بحساب ما زاد العامل فيها من عنده. {cite:muwatta-maruf-1997 p.229}"
