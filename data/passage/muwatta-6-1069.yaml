label: { ar: "الموطأ 1069 — مالك سئل: هل يجوز أن يتطوع الرجل بالطواف فيقرن بين أسبوعين أو أكثر ثم يركع ما عليه من ركوع تلك الأسابيع؟ قال: لا ينبغي ذلك، وإنما السنة أن يتبع كل سبع ركعتين", en: "Muwatta 1069", es: "Muwatta 1069", fr: "Muwatta 1069", ur: "موطا 1069", tr: "El-Muvatta 1069 — Malik'e soruldu: Bir erkeğin, iki veya daha fazla haftalık tavafı birleştirerek gönüllü tavaf yapması ve ardından bu haftalar için gerekli rekatları kılması caiz midir? O şöyle dedi: Bu uygun değildir. Aksine, sünnet, her yedi tavaftan sonra iki rekat namaz kılmaktır.", id: "Al-Muwatta 1069 — Malik ditanya: Apakah diperbolehkan bagi seorang laki-laki untuk melakukan tawaf sunnah dengan menggabungkan tawaf selama dua minggu atau lebih, kemudian melakukan rakaat wajib untuk minggu-minggu tersebut? Beliau menjawab: Itu tidak tepat. Sebaliknya, sunnahnya adalah mengikuti setiap tujuh kali tawaf dengan dua rakaat." }
summary:
  ar: "سئل مالك عن الطواف، إن كان أخف على الرجل أن يتطوع به، فيقرن بين الأسبوعين أو أكثر، ثم يركع ما عليه من ركوع تلك الأسابيع؟ فقال: لا ينبغي ذلك، وإنما السنة أن يُتبع كل سبع ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1292). {cite:muwatta-maruf-1997 p.494}"
  tr: "Malik'e tavaf hakkında soru soruldu: Bir erkeğin tavafı gönüllü olarak, iki veya daha fazla haftalık tavafı birleştirerek yapması ve ardından bu haftaların gerekli rekatlarını kılmasının daha kolay olup olmadığı sorulduğunda, Malik şöyle cevap verdi: Bu uygun değildir. Aksine, sünnet, her yedi rekatın ardından iki rekat namaz kılmaktır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1292) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.494}"
  id: "Malik ditanya tentang tawaf: apakah lebih mudah bagi seseorang untuk melakukannya secara sukarela, menggabungkan dua minggu atau lebih tawaf, dan kemudian mengerjakan rakaat-rakaat wajib dari minggu-minggu tersebut, beliau menjawab: Ini tidak tepat. Sebaliknya, sunnahnya adalah mengikuti setiap tujuh rakaat dengan dua rakaat. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1292). {cite:muwatta-maruf-1997 p.494}"
