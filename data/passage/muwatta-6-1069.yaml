label: { ar: "الموطأ 1069 — مالك سئل: هل يجوز أن يتطوع الرجل بالطواف فيقرن بين أسبوعين أو أكثر ثم يركع ما عليه من ركوع تلك الأسابيع؟ قال: لا ينبغي ذلك، وإنما السنة أن يتبع كل سبع ركعتين", en: "Muwatta 1069" }
summary:
  ar: "سئل مالك عن الطواف، إن كان أخف على الرجل أن يتطوع به، فيقرن بين الأسبوعين أو أكثر، ثم يركع ما عليه من ركوع تلك الأسابيع؟ فقال: لا ينبغي ذلك، وإنما السنة أن يُتبع كل سبع ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1292). {cite:muwatta-maruf-1997 p.494}"
