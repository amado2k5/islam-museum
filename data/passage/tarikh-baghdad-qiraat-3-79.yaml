text: "… حتى زوجته بوالدتك، وحضرت الاملاك، والعرس، والولادة، وتسليم المكتب، وتقلدت القضاء بالكوفة، وشهدت عند خليفتك. قال أبو اسحاق وسمعته يقول : أذنت فى مسجدى نيفا وصبعين سنة، وقال لى إن جدى أذن نيفا وسبعين سنة، وهو مسجد حمزة بن حبيب …"
