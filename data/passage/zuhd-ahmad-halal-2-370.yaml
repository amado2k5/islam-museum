text: "… يَمضي قُدُمًا؛ فلا يُعاتِبُ نَفْسَه!. - حدَّثنا عبدُ الله، قال: حدَّثني أَبي، قال: ثنا رَوْحٌ، قال: ثنا الرَّبيعُ، عنِ الحسنِ أَنَّه كان يقولُ: - أَقواما كانوا فيما أَحلَّ الله لهم أَزهدَ منكم فيما حرَّم عليكم، ولقد كانوا أَشْفَقَ مِن حسناتهم …"
