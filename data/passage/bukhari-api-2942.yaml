label: { ar: "صحيح البخاري 2942 — الأب والأبوة، النسب والانتساب", en: "Sahih al-Bukhari 2942 — the father and fatherhood; paternity and lineage", ur: "صحیح بخاری 2942 — باپ اور والدیت، نسب اور انتساب", es: "Sahih al-Bukhari 2942 — El padre y la paternidad; paternidad y linaje" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ الْقَعْنَبِيُّ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي حَازِمٍ، عَنْ أَبِيهِ، عَنْ سَهْلِ بْنِ سَعْد ـ سَمِعَ النَّبِيَّ يَقُولُ يَوْمَ خَيْبَرَ \" لأُعْطِيَنَّ الرَّايَةَ رَجُلاً يَفْتَحُ اللَّهُ عَلَى يَدَيْهِ \". فَقَامُوا يَرْجُونَ لِذَلِكَ أَيُّهُمْ يُعْطَى، فَغَدَوْا وَكُلُّهُمْ يَرْجُو أَنْ يُعْطَى فَقَالَ \" أَيْنَ عَلِيٌّ \". فَقِيلَ يَشْتَكِي عَيْنَيْهِ، فَأَمَرَ فَدُعِيَ لَهُ، فَبَصَقَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2942، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2942 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2942، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2942 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad, la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
