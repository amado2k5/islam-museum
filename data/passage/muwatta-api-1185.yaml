text: "… فَلَمْ يُنْكِرْ ذَلِكَ عَبْدُ اللَّهِ بْنُ عُمَرَ. قَالَ مَالِكٌ فِي الْمُفْتَدِيَةِ الَّتِي تَفْتَدِي مِنْ زَوْجِهَا أَنَّهُ إِذَا عُلِمَ أَنَّ زَوْجَهَا أَضَرَّ بِهَا وَضَيَّقَ عَلَيْهَا وَعُلِمَ أَنَّهُ ظَالِمٌ لَهَا مَضَى الطَّلاَقُ وَرَدَّ عَلَيْهَا مَالَهَا. قَالَ فَهَذَا الَّذِي كُنْتُ أَسْمَعُ وَالَّذِي عَلَيْهِ أَمْرُ النَّاسِ عِنْدَنَا. قَالَ مَالِكٌ لاَ بَأْسَ بِأَنْ تَفْتَدِيَ الْمَرْأَةُ مِنْ زَوْجِهَا بِأَكْثَرَ مِمَّا أَعْطَاهَا."
summary:
  ar: "حديث في موطأ مالك، رقم 1185، يرد فيه ذكر ما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1185 (Divorce), whose wording mentions what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1185، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1185, dont le texte mentionne ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1185, cuyo texto menciona lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
