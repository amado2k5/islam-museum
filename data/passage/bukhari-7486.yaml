label:
  ar: "البخاري 7486 — يتعاقبون فيكم ملائكة: كيف تركتم عبادي"
  en: "Bukhari 7486 — Angels take turns among you: how did you leave My servants"
  ur: "بخاری 7486 — فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا"
  es: "Bukhari 7486 — Los ángeles se turnan entre vosotros: ¿cómo dejasteis a mis siervos?"
  fr: "Bukhari 7486 — Les anges se relaient parmi vous: comment avez-vous abandonné Mes serviteurs ?"
  tr: "Buhari 7486 — Melekler sırayla seni ziyaret eder ve sorarlar: Kullarımı nasıl bıraktın?"
  id: "Al-Bukhari 7486 — Malaikat-malaikat bergantian mengunjungi kamu, bertanya: Bagaimana kamu meninggalkan hamba-hamba-Ku?"
text: "يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار، ويجتمعون في صلاة العصر وصلاة الفجر، ثم يعرج الذين باتوا فيكم فيسألهم وهو أعلم كيف تركتم عبادي فيقولون تركناهم وهم يصلون، وأتيناهم وهم يصلون ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7486: يتعاقبون فيكم ملائكة: كيف تركتم عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7486: Angels take turns among you: how did you leave My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7486: فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7486: Los ángeles se turnan entre vosotros: ¿cómo dejasteis a Mis siervos? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 7486: « Les anges se relaient parmi vous: comment avez-vous abandonné Mes serviteurs ? » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 7486 numaralı hadis-i kudsi şöyledir: Melekler sırayla seni ziyaret eder ve şöyle sorarlar: \"Kullarımı nasıl bıraktın?\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 7486: Malaikat bergantian mengunjungi kamu, bertanya: \"Bagaimana kamu meninggalkan hamba-hamba-Ku?\" Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam koleksi hadits kanonik dan al-Muwatta."
