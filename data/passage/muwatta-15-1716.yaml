label: { ar: "الموطأ 1716 — مالك: الذي قد مس امرأته ثم اعترض عنها، لم أسمع أنه يضرب له أجل ولا يفرق بينهما", en: "Muwatta 1716", es: "Muwatta 1716", fr: "Muwatta 1716", ur: "موطا 1716", tr: "El-Muvatta 1716 — Malik: Bir adam karısına dokunduktan sonra ondan uzaklaşırsa, onun için bir süre belirlendiğini ya da onların ayrıldığını duymadım.", id: "Al-Muwatta 1716 — Malik: Jika seorang pria menyentuh istrinya lalu berpaling darinya, aku belum pernah mendengar bahwa ada batas waktu yang ditetapkan untuknya atau bahwa mereka akan berpisah." }
summary:
  ar: "يقول مالك فأما الذي قد مس امرأته ثم اعترض عنها، فإني لم أسمع أنه يضرب له أجل، ولا يفرق بينهما. {cite:muwatta-maruf-1997 p.99}"
  tr: "Malik şöyle diyor: Karısıyla cinsel ilişkiye girdikten sonra ondan uzaklaşan adama gelince, onun için bir süre sınırı konulduğunu ya da ayrıldığını duymadım. {cite:muwatta-maruf-1997 s.99}"
  id: "Malik berkata: Adapun laki-laki yang telah bersetubuh dengan istrinya lalu berpaling darinya, saya belum pernah mendengar bahwa ada batas waktu yang ditetapkan untuknya, atau bahwa mereka berpisah. {cite:muwatta-maruf-1997 p.99}"
