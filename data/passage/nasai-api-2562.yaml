label: { ar: "سنن النسائي 2562 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 2562 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن نسائی 2562 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 2562 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sunan al-Nasa'i 2562 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan an-Nasa'i 2562 — Baba ve babalık, anne babaya saygı göstermek veya göstermemek", id: "Sunan an-Nasa'i 2562 — Ayah dan peran ayah, menghormati atau tidak menaati orang tua" }
text: "… عَلِيٍّ، قَالَ حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ حَدَّثَنَا عُمَرُ بْنُ مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ يَسَارٍ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثَةٌ لاَ يَنْظُرُ اللَّهُ عَزَّ وَجَلَّ إِلَيْهِمْ يَوْمَ الْقِيَامَةِ الْعَاقُّ لِوَالِدَيْهِ وَالْمَرْأَةُ الْمُتَرَجِّلَةُ وَالدَّيُّوثُ وَثَلاَثَةٌ لاَ يَدْخُلُونَ الْجَنَّةَ الْعَاقُّ لِوَالِدَيْهِ وَالْمُدْمِنُ عَلَى الْخَمْرِ وَالْمَنَّانُ بِمَا أَعْطَى \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2562، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2562 (The Book of Zakah), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2562، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2562 (El Libro del Zakat), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 2562 (Le Livre de la Zakat), évoque le père et la paternité, ainsi que le devoir envers les parents et la possibilité de leur désobéissance. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sunan-ı Nesai'de yer alan 2562 numaralı hadis, baba ve babalık kavramını, anne babaya saygı göstermeyi veya göstermemeyi ele almaktadır. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2562, menyebutkan tentang ayah dan peran ayah, serta menghormati atau tidak taat kepada orang tua. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
