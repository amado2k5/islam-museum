text: "… رجل أعطى أمامه صفقة بريد بها الدنيا فان أصابها وفى له وإن لم يصبها لم يف له، و رجل خرج بسلمقة بعد المصر يحلف باللّه لقد اعطى بها كذا وكذا فاشتريت لقوله، وسباب المؤمن فسوق وقتاله كفر، ولا يحل لك …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 454، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 454, that mentions what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 454 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
