label: { ar: "الموطأ 1178 — ابن عمر: إذا أفطر من رمضان وهو يريد الحج لم يأخذ من رأسه ولا لحيته شيئا حتى يحج", en: "Muwatta 1178", es: "Muwatta 1178", fr: "Muwatta 1178", ur: "موطا 1178", tr: "El-Muvatta 1178 — İbn Ömer: Ramazan ayında orucunu bozan ve Hac yapmaya niyetlenen kimse, Hac ibadetini yerine getirene kadar başından veya sakalından hiçbir şey kesmemelidir.", id: "Al-Muwatta 1178 — Ibn Umar: Jika seseorang berbuka puasa di bulan Ramadan dan berniat melaksanakan ibadah haji, maka ia tidak boleh memotong apa pun dari kepala atau janggutnya sampai ia melaksanakan ibadah haji." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان إذا أفطر من رمضان وهو يريد الحج، لم يأخذ من رأسه ولا من لحيته شيئا حتى يحج. قال مالك وليس ذلك على الناس. {cite:muwatta-maruf-1997 p.531}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın Ramazan ayında orucunu bozup Hac yapmaya niyetlendiğinde, Hac ibadetini yerine getirene kadar başından ve sakalından hiçbir şey kesmediğini söyler. Malik, \"Bu herkes için farz değildir\" demiştir. {cite:muwatta-maruf-1997 s.531}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar, ketika berbuka puasa di bulan Ramadan dan berniat menunaikan ibadah haji, tidak memotong rambut atau janggutnya sampai ia menunaikan ibadah haji. Malik berkata, “Ini tidak wajib bagi semua orang.” {cite:muwatta-maruf-1997 p.531}"
