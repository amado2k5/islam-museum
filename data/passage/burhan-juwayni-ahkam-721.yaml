text: "… الخبر الذي وافقه حكم القرينة ومثال ذلك الخبران المتعارضان في العمرة فيروى أن النبي قال الحج جهاد والعمرة تطوع وعارضه ما روى أنه قال الحج والعمرة نسكا ن فرضان لا يضرك بأيهما بدأت ثم خبر الفريضة وافق حكم القرآن في …"
summary:
  ar: "مقطع من البرهان للجويني، ص 721، يرد فيه ذكر الفريضة والفرائض، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Juwayni's al-Burhan, p. 721, whose wording mentions the obligation (farida), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البرہان، جوینی، ص 721 کا اقتباس جس میں فریضہ اور فرائض، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Burhan de al-Juwayni, p. 721, dont le texte mentionne l'obligation (farida), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Burhan de al-Juwayni, p. 721, cuyo texto menciona la obligación (farida), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Cüveyni'nin El-Burhan adlı eserinin 721. sayfasından, farz, görev ve gönüllülük esaslarını ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan karya Al-Juwayni, halaman 721, yang menyebutkan amalan wajib, kewajiban, dan amalan sunnah; dari versi pindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
