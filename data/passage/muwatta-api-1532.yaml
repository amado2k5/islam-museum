text: "… فِي حِرَابَةٍ وَلَمْ يَقْتُلُوا أَحَدًا فَأَرَادَ أَنْ يَقْطَعَ أَيْدِيَهُمْ أَوْ يَقْتُلَ فَكَتَبَ إِلَى عُمَرَ بْنِ عَبْدِ الْعَزِيزِ فِي ذَلِكَ فَكَتَبَ إِلَيْهِ عُمَرُ بْنُ عَبْدِ الْعَزِيزِ لَوْ أَخَذْتَ بِأَيْسَرِ ذَلِكَ ‏.‏ قَالَ يَحْيَى وَسَمِعْتُ مَالِكًا يَقُولُ الأَمْرُ عِنْدَنَا فِي الَّذِي يَسْرِقُ أَمْتِعَةَ النَّاسِ الَّتِي تَكُونُ مَوْضُوعَةً بِالأَسْوَاقِ مُحْرَزَةً قَدْ أَحْرَزَهَا أَهْلُهَا فِي أَوْعِيَتِهِمْ وَضَمُّوا بَعْضَهَا إِلَى بَعْضٍ إِنَّهُ مَنْ سَرَقَ مِن …"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Muwatta Malik; sending a letter or message to a party."
  ur: "موطأ مالک میں؛ کسی فریق کو خط یا پیغام بھیجنا."
