text: "… حدثف أبو بكر بن عبد اللّٰه بن أبى مريم الغسانى حدثنى عطية بن قيس : أن أناسا من أهل دمشق أتوا أبا مسلم الحولانى فى منزله - وكان غازيا بأرض الروم - فوجدوه قد احتفر فى فسطاطه حفرة ووضع فى …"
summary:
