text: "… يحرم غير البيع من العقود في الجمعة يصح أن يغل المحرم الحلال، والحلال المحرم المحرم يغسل بماء ومدر ولا يقرب طيبا، ويكفن فى ثوييه ولا يغطى رأسه ولا رجلاه شهر المخرم : الزكاة، كل من حرم عليه صدقة الفرض... يجوز …"
