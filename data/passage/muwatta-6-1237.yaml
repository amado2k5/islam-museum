summary:
  ar: "يقول مالك إن المرأة التي تحيض بمنى تقيم حتى تطوف بالبيت، لابد لها من ذلك، وإن كانت قد أفاضت فحاضت بعد الإفاضة فلتنصرف إلى بلدها، فقد بلغه في ذلك رخصة من رسول الله للمحائض. {cite:muwatta-maruf-1997 p.552}"
