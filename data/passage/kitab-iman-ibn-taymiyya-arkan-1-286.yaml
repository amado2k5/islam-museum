text: "… الطلمنكي إجماع أهل السنة على أن الإيمان قول وعمل ونية وإصابة السنة. وقال أبو طالب المكي: مباني الإسلام الخمسة: يعني الشهادتين، والصلوات الخمس، والزكاة، وصيام شهر رمضان، والحج، قال: وأركان الإيمان سبعة: يعني الخمسة المذكورة في حديث جبرائيل، والإيمان بالقدر، …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 286، يذكر أركان الإسلام، وأركان الإيمان، والإيمان بالقدر، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 286, that mentions the pillars of Islam, the pillars of faith, belief in the decree, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 286 کا اقتباس جس میں ارکانِ اسلام، ارکانِ ایمان، تقدیر پر ایمان، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 286, que menciona los pilares del Islam, los pilares de la fe, la creencia en el decreto, el aumento y la disminución de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 286) mentionnant les piliers de l'islam, les fondements de la foi, la croyance au décret divin, ainsi que les fluctuations de la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 286. sayfasından, İslam'ın temelleri, imanın esasları, kader inancı ve imanın artışı ve azalışı konularını ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 286, yang membahas rukun Islam, rukun iman, kepercayaan pada takdir, dan peningkatan serta penurunan iman. Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
