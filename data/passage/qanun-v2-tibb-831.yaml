text: "… دهن السوسن مقدار ما يكفي في إذابة الأدوية الرطبة، وشراب فائق القدر الذي يكفي في عجن الأدوية اليابسة، يخلط الجمعي، ويدعك ويستعمل. آخر: ينفع في الوقت من عرق النسا، وألم اليد، والرجل، ووجع سائر المفاصل. يؤخذ حلبة، يطرح في إناء …"
summary:
