text: "من هذا. قال ابن كثير رحمه الله ٣٧١/١: هذا الخطاب يعم أهل الكتاب من اليهود والنصارى ومن جرى مجراهم. في ((اللسان)) سنان الرمح: حديدته لصقالتها، وملاستها. القد: القطع المستأصل والشق طولا. الذؤابة : ذؤابة كل شيء أعلاه. يذبل: جيل في"
