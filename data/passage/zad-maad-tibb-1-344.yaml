text: "… شأن، وهذه النارُ تكون في محلها، وحرارتُها تؤثِّر في الجسم البعيد عنها، مع أنَّ الارتباط والتعلَّقَ الذي بَيْنَ الروحِ والبدنِ أقوى وأكملُ مِن ذلك وأتم، فشأنُ الروحَ أعلى من ذلك وألطف. فَقُلْ لِلْعُيُونِ الرُّمْدِ إِيَّاكِ أَنْ تَرَي سَنَا الشَّمْسِ فَاسْتَغْشِي …"
