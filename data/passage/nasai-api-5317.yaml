label: { ar: "سنن النسائي 5317 — الأب والأبوة", en: "Sunan al-Nasa'i 5317 — the father and fatherhood", ur: "سنن نسائی 5317 — باپ اور والدیت", es: "Sunan al-Nasa'i 5317 — El padre y la paternidad" }
text: "أَخْبَرَنِي حَاجِبُ بْنُ سُلَيْمَانَ، عَنِ ابْنِ أَبِي رَوَّادٍ، قَالَ حَدَّثَنَا ابْنُ جُرَيْجٍ، عَنِ ابْنِ طَاوُسٍ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، أَنَّهُ أَتَى النَّبِيَّ وَعَلَيْهِ ثَوْبَانِ مُعَصْفَرَانِ فَغَضِبَ النَّبِيُّ وَقَالَ \" اذْهَبْ فَاطْرَحْهُمَا عَنْكَ \". قَالَ أَيْنَ يَا رَسُولَ اللَّهِ قَالَ \" فِي النَّارِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5317، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5317 (The Book of Adornment), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5317، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5317 (El Libro de los Adornos), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
