text: "… بخيبر، الذي ورد في قضيته القسامة. المشركين، والله أَعلم أي جدَّيه أراد. - عبد اللّٰه بن أبي سَليط : كان أبوه - عبد اللّٰه بن الشِّخِّير بن عوف بن بدرياً، وفى صُحبةِ عبد اللّٰه نظر، وهو مدّنيّ، روى كعب ابن …"
