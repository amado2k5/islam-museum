text: "… على مُسَمَّى الإيمان. الإيمان له حقيقة، وحقيقته التي يقوم عليها هي أركانة، وليست شروطه. الشرط يسبق المشروط، أما الأركان فهي ما تقوم عليه حقيقة الشيء. فإذا لم تقم الأركان فما قامت حقيقة الإيمان. فالإيمان قول وعمل: قول اللسان، وتصديق الجنان، …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 3، ص 538، يذكر حلاوة الإيمان وكماله، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 3, p. 538, that mentions the sweetness and completeness of faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 3، ص 538 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
