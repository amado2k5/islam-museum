label: { ar: "نوادر جحا الكبرى، ص 16 — «ماذا تنفع الثياب في يوم الحشر»", en: "Nawadir Juha al-Kubra, p. 16 — 'What Use Are Clothes on the Day of Reckoning'", ur: "نوادر جحا الکبریٰ، ص 16 — «حشر کے دن کپڑوں کا کیا فائدہ»", fr: "Nawadir Juha al-Kubra, p. 16 — « À quoi servent les vêtements au jour du Jugement »", es: "Nawadir Juha al-Kubra, p. 16 — «Para qué sirven las ropas en el Día del Juicio»", tr: "Cuha'nın Büyük Fıkraları, s. 16 — “Kıyamet Gününde elbiselerin ne faydası var?”", id: "Anekdot-anekdot Hebat Juha, hlm. 16 — “Apa gunanya pakaian pada Hari Kiamat?”" }
text: "… ماذا تنفع الثياب في يوم الحشر كان يربي لمؤونة الشتاء خروفاً جميلاً، وكان يحبه ويبني عليه صروح الآمال فأراد أصحابه أن يلعبوا عليه، ويسلبوه خروفه، فلم ينجحوا، فاتَّفقوا على أن بحتالوا عليه، فجاءه أحدهم فقال له ؛ ماذا أنت صانع …"
summary:
  ar: "حاول أصدقاء جحا إقناعه بذبح خرافه زاعمين أن يوم الحشر قريب، فتركوه يشويها، فأحرق ثيابهم وسألهم ما نفع الثياب في يوم الحشر. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  en: "Juha's friends try to make him slaughter his sheep, claiming the Day of Judgement is near; they leave him to roast it, and Juha burns their clothes, asking what clothes are for on the Day of Judgement. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  ur: "جحا کے دوستوں نے یہ کہہ کر اسے بھیڑیں ذبح کرنے پر آمادہ کرنا چاہا کہ قیامت قریب ہے؛ وہ اسے بھوننے کے لیے چھوڑ گئے تو جحا نے ان کے کپڑے جلا دیے اور پوچھا کہ قیامت کے دن کپڑوں کا کیا کام۔ {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  fr: "Les amis de Juha tentent de lui faire égorger ses moutons en prétendant que le Jour du Jugement est proche ; ils le laissent les rôtir, et Juha brûle leurs vêtements en demandant à quoi servent les vêtements au Jour du Jugement. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  es: "Los amigos de Juha intentan que sacrifique sus ovejas alegando que el Día del Juicio está cerca; lo dejan asándolas, y Juha quema sus ropas preguntando para qué sirven las ropas en el Día del Juicio. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
  tr: "Juha'nın arkadaşları, Kıyamet Günü'nün yakın olduğunu söyleyerek onu koyunlarını kesmeye ikna etmeye çalıştılar ve bu yüzden onları kızartmalarına izin verdiler. Bunun üzerine Juha onların elbiselerini yaktı ve onlara Kıyamet Günü'nde hangi elbiselerin iyi olacağını sordu. {cite:juha-nawadir-kubra-djuwaydi s. 16}"
  id: "Teman-teman Juha mencoba membujuknya untuk menyembelih domba-dombanya, dengan alasan bahwa Hari Kiamat sudah dekat, jadi mereka membiarkannya memanggang domba-domba itu. Kemudian dia membakar pakaian mereka dan bertanya kepada mereka pakaian apa yang baik untuk dikenakan pada Hari Kiamat. {cite:juha-nawadir-kubra-djuwaydi p. 16}"
