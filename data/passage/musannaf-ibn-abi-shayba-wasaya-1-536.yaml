text: "… إلا راجعة، إني سمعت رسول اللّٰه الي قال لنا ذات يوم : كيف بإحداكن تنبح عليها كلاب الحوأب. - حدثنا أبو أسامة قال حدثنا إسماعيل عن قيس قال: قالت عائشة لما حضرتها الوفاة: ادفنوني مع أزواج النبي فإني كنت أحدثت …"
