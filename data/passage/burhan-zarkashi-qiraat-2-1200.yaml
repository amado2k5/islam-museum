label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 1200 — قراءات القرآن، جمع القرآن والمصاحف", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 1200 — the readings of the Qur'an; the collection of the Qur'an and the codices", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 1200 — قرآن کی قراءتیں، جمعِ قرآن اور مصاحف" }
text: "… النوع الحادي عشر: معرفة على كم لغة نزل معرفة على كم لغة نزل القول في القراءات السبع....... النوع الثانى عشر : فى كيفية إنزاله القرآن على عهد أبى بكر جمع القرآن على عهد أبى بكر. نسخ القرآن فى المصاحف... فائدة …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 1200، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 1200, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 1200 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
