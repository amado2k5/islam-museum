text: "… النوع الحادي عشر: معرفة على كم لغة نزل معرفة على كم لغة نزل القول في القراءات السبع....... النوع الثانى عشر : فى كيفية إنزاله القرآن على عهد أبى بكر جمع القرآن على عهد أبى بكر. نسخ القرآن فى المصاحف... فائدة …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 1200، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 1200, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 1200 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, volumen 2, pág. 1200, que menciona las lecturas del Corán, su recopilación y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre d'al-Zarkashi, *al-Burhan fi 'Ulum al-Qur'an*, volume 2, page 1200, mentionnant les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Zarkashi'nin \"Al-Burhan fi Ulum al-Qur'an\" adlı eserinin 2. cildinin 1200. sayfasından, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları hakkında bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 2, halaman 1200, membahas bacaan Al-Qur'an, penyusunan Al-Qur'an, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
