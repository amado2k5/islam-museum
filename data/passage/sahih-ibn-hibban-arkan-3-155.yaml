text: "… حَدَّثَنَا مُحَمَّدُ بنُ يَحْيَى بنُ أَبِي عمر العَدَني، حَدَّثَنَا سُفيانُ والدَّرَاوَرْديُّ، عَن هِشَام بنِ عُرْوة، عَن أبيه، عن أَبِي مُراوِح الغِفاري، عَن أَبِي ذَرِّ قَالَ : قُلْتُ: يا رَسُوْلَ اللَّه، أيُّ الْعَمَل أَفْضَلُ؟ قَالَ : إِيمَانٌ باللَّهِ، وَجِهادٌ في سَبِيله. …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 155، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 155, that mentions faith as the best of deeds, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 155 کا اقتباس جس میں ایمان بہترین عمل، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 155, que menciona la fe como la mejor de las obras, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sahih Ibn Hibban, volume 3, page 155, mentionnant la foi comme la meilleure des œuvres, un des articles de foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban, Resimli Cilt 3, sayfa 155'ten bir alıntı, imanın en hayırlı amel ve imanın direği olduğunu belirtmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın direkleri, imanın direkleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Jilid Bergambar 3, halaman 155, menyebutkan iman sebagai amal terbaik dan salah satu rukun iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
