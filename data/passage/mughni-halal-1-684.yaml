text: "… ذوات محارمه : كل من حرم عليه نكاحه على التابيد باب ما يحرم نكاحه، والجمع بينه، وغير ذلك إذا أسلم، ثم أحرم بحج أو عمرة، ثم أسلمن... ما سمى لها وهما كافران، فلم تقبضه وهو حرام، ثم أسلما، فلها عليه …"
