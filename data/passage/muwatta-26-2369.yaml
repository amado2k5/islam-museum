summary:
  ar: "بلغ مالكا أن عمر بن عبد العزيز قضى في المدبر إذا جرح، أن لسيده أن يسلم ما يملك منه إلى المجروح، فيختدمه المجروح ويقاصه بجراحه من ديته؛ فإن أدى قبل أن يهلك سيده رجع إلى سيده. {cite:muwatta-maruf-1997 p.375}"
