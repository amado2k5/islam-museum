label: { ar: "الموطأ 2369 — عمر بن عبد العزيز: جراح المدبر يسلمه السيد إلى المجروح", en: "Muwatta 2369", es: "Muwatta 2369", fr: "Muwatta 2369", ur: "موطا 2369", tr: "El-Muvatta 2369 — Ömer ibn Abdülaziz: Efendi, yaralı adamı, efendisinin ölümünden sonra özgürlüğüne kavuşacağı vaat edilen kişiye teslim eder.", id: "Al-Muwatta 2369 — Umar ibn Abd al-Aziz: Sang tuan menyerahkan orang yang terluka kepada orang yang telah dijanjikan kebebasan setelah kematian tuannya." }
summary:
  ar: "بلغ مالكا أن عمر بن عبد العزيز قضى في المدبر إذا جرح، أن لسيده أن يسلم ما يملك منه إلى المجروح، فيختدمه المجروح ويقاصه بجراحه من ديته؛ فإن أدى قبل أن يهلك سيده رجع إلى سيده. {cite:muwatta-maruf-1997 p.375}"
  tr: "Malik, Ömer ibn Abdülaziz'in, efendisinin ölümünden sonra özgürlüğüne kavuşacağı vaat edilen bir kölenin yaralanması durumunda, efendisinin ona ait malları yaralıya teslim etme hakkına sahip olduğunu, yaralının da onu çalıştırıp yaralarının bedelini kan parasından düşeceğini hükmettiğini rivayet etmiştir. Eğer efendisi ölmeden önce ödeme yaparsa, efendisine geri dönerdi. {cite:muwatta-maruf-1997 s.375}"
  id: "Malik meriwayatkan bahwa Umar ibn Abd al-Aziz memutuskan bahwa jika seorang budak yang telah dijanjikan kebebasan setelah kematian tuannya terluka, tuannya berhak menyerahkan apa yang menjadi miliknya kepada orang yang terluka tersebut, yang kemudian akan mempekerjakannya dan memotong kompensasi lukanya dari uang darahnya. Jika ia membayar sebelum tuannya meninggal, ia akan kembali kepada tuannya. {cite:muwatta-maruf-1997 p.375}"
