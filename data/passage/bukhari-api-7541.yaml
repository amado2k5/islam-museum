text: "أَبُو سُفْيَانَ بْنُ حَرْبٍ، أَنَّ هِرَقْلَ، دَعَا تَرْجُمَانَهُ، ثُمَّ دَعَا بِكِتَابِ النَّبِيِّ صلى الله عليه وسلم فَقَرَأَهُ ‏\"‏ بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ مِنْ مُحَمَّدٍ عَبْدِ اللَّهِ وَرَسُولِهِ إِلَى هِرَقْلَ، وَ‏{‏يَا أَهْلَ الْكِتَابِ تَعَالَوْا إِلَى كَلِمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ ‏}‏‏\"‏ الآيَةَ‏.‏"
summary:
  ar: "في صحيح البخاري؛ نص كتاب أو جوابه منسوب إلى مرسل."
  en: "In Sahih al-Bukhari; a letter text or reply attributed to a sender."
  ur: "صحیح بخاری میں؛ بھیجنے والے سے منسوب خط کا متن یا جواب."
