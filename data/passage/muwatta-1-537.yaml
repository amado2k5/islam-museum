label: { ar: "الموطأ 537 — عمر يقرأ القرآن على غير وضوء: من أفتاك بهذا؟ أمسيلمة؟", en: "Muwatta 537" }
text: "من أفتاك بهذا؟ أمسيلمة؟"
summary:
  ar: "الحديث الوحيد في باب الرخصة في قراءة القرآن على غير وضوء. يرويه مالك عن أيوب بن أبي تميمة السختياني عن محمد بن سيرين، أن عمر بن الخطاب كان في قوم يقرؤون القرآن، فذهب لحاجته ثم رجع وهو يقرأ، فقال له رجل: أتقرأ القرآن ولست على وضوء؟ فأنكر عليه عمر وسأله من أفتاه بذلك، أمسيلمة؟ ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.276}"
