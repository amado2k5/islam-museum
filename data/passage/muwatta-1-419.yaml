label: { ar: "الموطأ 419 — مليكة تدعو النبي لطعام فيصلي لهم على الحصير", en: "Muwatta 419" }
text: "قوموا فلأصلي لكم"
summary:
  ar: "أول حديث في باب جامع سبحة الضحى. يرويه يحيى عن مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك: دعت جدته مليكة النبي لطعام فأكل منه ثم قال: قوموا فلأصلي لكم. فقام أنس إلى حصير لهم قد اسودّ من طول ما لُبس فنضحه بماء، فقام عليه النبي وصف أنس واليتيم وراءه والعجوز من ورائهم، فصلى لهم ركعتين ثم انصرف. ويخرّجه المحقق عند البخاري (380، 860، 1164) ومسلم (2/127) وأبي داود (612) والترمذي (234) والنسائي (2/85) وابن حبان والدارمي وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (1/263). {cite:muwatta-maruf-1997 p.218} {cite:muwatta-maruf-1997 p.219}"
