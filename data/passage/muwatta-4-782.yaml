label: { ar: "الموطأ 782 — ابن عمر: الشهر تسع وعشرون، فلا تصوموا حتى تروا الهلال", en: "Muwatta 782" }
text: "الشهر تسع وعشرون، فلا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فاقدروا له"
summary:
  ar: "يرويه مالك عن عبد الله بن دينار عن عبد الله بن عمر، أن النبي قال: الشهر تسع وعشرون، فلا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فاقدروا له. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي وسويد والقعنبي عند البخاري (1907) والطحاوي وروح بن عبادة عند البيهقي، ويحيى بن يحيى النيسابوري عند مسلم. {cite:muwatta-maruf-1997 p.385}"
