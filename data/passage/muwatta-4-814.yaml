label: { ar: "الموطأ 814 — مالك: الرجل يقدم من سفره وهو مفطر وامرأته مفطرة حين طهرت من حيضها في رمضان، فله أن يصيبها إن شاء", en: "Muwatta 814", es: "Muwatta 814", fr: "Muwatta 814", ur: "موطا 814", tr: "El-Muvatta 814 — Malik: Bir adam oruç tutmadan yolculuktan döner ve karısı da Ramazan ayında adet gördüğü için temizlendiğinden oruç tutmaz. Dilerse onunla cinsel ilişkiye girebilir.", id: "Al-Muwatta 814 — Malik: Seorang pria kembali dari perjalanannya dalam keadaan tidak berpuasa, dan istrinya juga tidak berpuasa karena telah suci dari haidnya selama Ramadan. Ia boleh bersetubuh dengannya jika ia mau." }
summary:
  ar: "قول لمالك: في الرجل يقدم من سفره وهو مفطر، وامرأته مفطرة حين طهرت من حيضتها في رمضان: أن لزوجها أن يصيبها إن شاء. ويذكر المحقق أنه تكرر الفصل في هذا الباب. {cite:muwatta-maruf-1997 p.398}"
  tr: "Malik şöyle demiştir: Ramazan ayında oruç tutmadan yolculuktan dönen bir erkek ile adet dönemi bittikten sonra orucunu bozan karısı söz konusu olduğunda, kocası dilerse onunla cinsel ilişkiye girebilir. Araştırmacı, bu bölümün defalarca tartışıldığını belirtmektedir. {cite:muwatta-maruf-1997 s.398}"
  id: "Malik berkata: Mengenai seorang pria yang kembali dari perjalanannya dalam keadaan tidak berpuasa, dan istrinya yang berbuka puasa setelah haidnya berakhir selama Ramadan, suaminya boleh berhubungan intim dengannya jika ia mau. Peneliti mencatat bahwa bab ini telah dibahas berulang kali. {cite:muwatta-maruf-1997 p.398}"
