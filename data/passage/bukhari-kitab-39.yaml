summary:
  ar: "القسم 39 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الكفالة»، ويضم فيها النصوص من 2290 إلى 2298 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 39 of Sahih al-Bukhari (Kafalah) in the division of the open hadith dataset the museum took its reports from: reports 2290 to 2298 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 39، عنوان «کتاب الکفالۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2290 تا 2298۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 39 de Sahih al-Bukhari (Kafalah) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2290 al 2298 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 39 du Sahih al-Bukhari (Kafalah), correspondant aux hadiths 2290 à 2298 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 39. bölümü \"Garanti Kitabı\" başlığını taşımakta olup, 2290 ile 2298 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 39 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Jaminan\" dan berisi teks 2290 hingga 2298, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
