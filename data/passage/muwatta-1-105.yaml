label: { ar: "الموطأ 105 — ابن عمر يعيد صلاة الصبح في سفر لأنه مس فرجه ونسي", en: "Muwatta 105" }
summary:
  ar: "أثر يرويه مالك عن نافع عن سالم بن عبد الله، في باب الوضوء من مس الفرج: كان سالم مع أبيه عبد الله بن عمر في سفر فرآه بعد طلوع الشمس يتوضأ ثم يصلي، فقال له إن هذه صلاة لم يكن يصليها، فأخبره أنه مس فرجه بعد وضوئه لصلاة الصبح ثم نسي أن يتوضأ، فتوضأ وأعاد صلاته. ويذكر المحقق أن عبد الرزاق والطحاوي روياه من طريق الزهري عن سالم بذكر صلاة العصر، وابن أبي شيبة من طريق نافع بمعناه. {cite:muwatta-maruf-1997 p.87}"
