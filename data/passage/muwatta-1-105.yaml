label: { ar: "الموطأ 105 — ابن عمر يعيد صلاة الصبح في سفر لأنه مس فرجه ونسي", en: "Muwatta 105", es: "Muwatta 105", fr: "Muwatta 105", ur: "موطا 105", tr: "El-Muvatta 105 — İbn Ömer, yolculuk sırasında cinsel organına dokunup unuttuğu için sabah namazını tekrar kılıyor.", id: "Al-Muwatta 105 — Ibnu Umar mengulang salat Subuh ketika bepergian karena ia menyentuh kemaluannya dan lupa." }
summary:
  ar: "أثر يرويه مالك عن نافع عن سالم بن عبد الله، في باب الوضوء من مس الفرج: كان سالم مع أبيه عبد الله بن عمر في سفر فرآه بعد طلوع الشمس يتوضأ ثم يصلي، فقال له إن هذه صلاة لم يكن يصليها، فأخبره أنه مس فرجه بعد وضوئه لصلاة الصبح ثم نسي أن يتوضأ، فتوضأ وأعاد صلاته. ويذكر المحقق أن عبد الرزاق والطحاوي روياه من طريق الزهري عن سالم بذكر صلاة العصر، وابن أبي شيبة من طريق نافع بمعناه. {cite:muwatta-maruf-1997 p.87}"
  tr: "Malik'in Nafi'den, o da Salim ibn Abdullah'tan rivayet ettiği, mahrem yerlere dokunduktan sonra abdest alma bölümünde yer alan bir rivayette şöyle denmektedir: Salim, babası Abdullah ibn Umar ile bir yolculukta iken, güneş doğduktan sonra babasının abdest alıp namaz kıldığını görmüştür. Ona, \"Bu, genellikle kılmadığım bir namazdır\" demiştir. Babası, sabah namazı için abdest aldıktan sonra mahrem yerlerine dokunduğunu ve sonra tekrar abdest almayı unuttuğunu, bu yüzden abdest alıp namazını tekrarladığını açıklamıştır. Araştırmacı, Abdül-Razzak ve el-Tahavi'nin bunu Salim'den el-Zuhri aracılığıyla, ikindi namazı anlamında rivayet ettiğini ve İbn Abi Şeybe'nin de Nafi'den benzer bir anlamda rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.87}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’ dari Salim ibn Abdullah, dalam surah tentang wudhu setelah menyentuh kemaluan: Salim sedang bersama ayahnya, Abdullah ibn Umar, dalam suatu perjalanan dan melihatnya setelah matahari terbit berwudhu dan kemudian shalat. Ia berkata kepadanya, “Ini adalah shalat yang biasanya tidak kulakukan.” Ayahnya menjelaskan bahwa ia telah menyentuh kemaluannya setelah berwudhu untuk shalat subuh dan kemudian lupa berwudhu lagi, sehingga ia berwudhu dan mengulangi shalatnya. Peneliti menyebutkan bahwa Abd al-Razzaq dan al-Tahawi meriwayatkannya melalui al-Zuhri atas otoritas Salim, menyebutkan shalat asar, dan Ibn Abi Shaybah meriwayatkannya melalui Nafi’ dengan makna yang serupa. {cite:muwatta-maruf-1997 p.87}"
