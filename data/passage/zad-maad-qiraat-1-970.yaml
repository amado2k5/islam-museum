text: "… حيضتها، فتبرأ مِن عِدتها. فإن لم تَحِض، انتظرت تمام تسعة أشهر من يومٍ وفاته، وعنه رواية ثانية: كقول الجمهور، أنه تعتدَّ أربعة أشهر وعشراً، ولا تنتظِرُ حيضها. فصل من قال: إن القراء هي الحيض ومن ذلك اختلافُهم في الأقراء، هل …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 970، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 970, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 970 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
