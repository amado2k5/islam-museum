text: "… حيضتها، فتبرأ مِن عِدتها. فإن لم تَحِض، انتظرت تمام تسعة أشهر من يومٍ وفاته، وعنه رواية ثانية: كقول الجمهور، أنه تعتدَّ أربعة أشهر وعشراً، ولا تنتظِرُ حيضها. فصل من قال: إن القراء هي الحيض ومن ذلك اختلافُهم في الأقراء، هل …"
