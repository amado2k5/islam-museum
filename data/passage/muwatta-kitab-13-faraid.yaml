summary:
  ar: "كتاب الفرائض، الكتاب الثالث عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، وهو أول كتب المجلد الثاني: 40 نصاً (1449–1488) في خمسة عشر باباً، من الصفحة 5 إلى الصفحة 26 من ملف PDF المجلد الثاني. يبدأ بميراث الولد والزوجين والأبوين والإخوة والأجداد والجدات والكلالة، ثم ميراث العمة وولاية العصبة، ثم أهل الملل والمولى، ويختم بميراث المجهول أمره وولد الملاعنة. {cite:muwatta-maruf-1997 p.5} {cite:muwatta-maruf-1997 p.26}"
  en: "The Book of Inheritance Shares, thirteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), the first book of volume 2: 40 reports (1449–1488) in fifteen babs, PDF pp. 5–26 of volume 2, from the inheritance of children, spouses, parents, siblings, grandparents and the kalala, to the inheritance of those whose death order is unknown and of children of li'an and zina."
