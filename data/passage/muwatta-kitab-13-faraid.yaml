label: { ar: "الموطأ، كتاب الفرائض", en: "Muwatta, Book of Inheritance Shares (faraid)", es: "Muwatta, Libro de acciones de herencia (faraid)", fr: "Muwatta, Livre des parts d'héritage (faraid)", ur: "موطا، وراثت کی کتاب ⁦(فرائد)⁩", tr: "Al-Muwatta, Miras Kitabı", id: "Al-Muwatta, Kitab Warisan" }
summary:
  ar: "كتاب الفرائض، الكتاب الثالث عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، وهو أول كتب المجلد الثاني: 40 نصاً (1449–1488) في خمسة عشر باباً، من الصفحة 5 إلى الصفحة 26 من ملف PDF المجلد الثاني. يبدأ بميراث الولد والزوجين والأبوين والإخوة والأجداد والجدات والكلالة، ثم ميراث العمة وولاية العصبة، ثم أهل الملل والمولى، ويختم بميراث المجهول أمره وولد الملاعنة. {cite:muwatta-maruf-1997 p.5} {cite:muwatta-maruf-1997 p.26}"
  en: "The Book of Inheritance Shares, thirteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), the first book of volume 2: 40 reports (1449–1488) in fifteen babs, PDF pp. 5–26 of volume 2, from the inheritance of children, spouses, parents, siblings, grandparents and the kalala, to the inheritance of those whose death order is unknown and of children of li'an and zina."
  es: "El Libro de las Partes de la Herencia, decimotercer libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), primer libro del volumen 2: 40 informes (1449–1488) en quince babs, PDF pp. 5–26 del volumen 2, desde la herencia de hijos, cónyuges, padres, hermanos, abuelos y el kalala, hasta la herencia de aquellos cuyo orden de muerte se desconoce y de los hijos de li'an y zina."
  fr: "Le Livre des parts d'héritage, treizième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), premier livre du volume 2: 40 rapports (1449-1488) dans quinze babs, PDF pp. 5-26 du volume 2, de l'héritage des enfants, des conjoints, des parents, des frères et sœurs, des grands-parents et du kalala, à l'héritage de ceux dont l'ordre de décès est inconnu et des enfants de li'an et zina."
  ur: "وراثت کے حصص کی کتاب، یحییٰ بن یحییٰ کی تجدید میں موطا کی تیرھویں کتاب ⁦(ایڈیشن معارف 1997)⁩، پہلی کتاب جلد 2: 40 رپورٹس (1449–1488) پندرہ بابوں میں، پی ڈی ایف پی پی 5-26 والیم 2 میں، والدین کی طرف سے، اولاد کی طرف سے۔ دادا دادی اور کلالہ، ان لوگوں کی وراثت میں جن کی موت کا حکم معلوم نہیں ہے اور لعان اور زنا کی اولاد۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayetine göre Al-Muwatta'nın on üçüncü kitabı olan Miras Kitabı, Beşar Awad Maruf'un (1997) baskısında, İkinci Cilt'in ilk kitabıdır: İkinci Cilt'in PDF dosyasının 5. sayfasından 26. sayfasına kadar on beş bölümden oluşan 40 metin (1449–1488). Çocukların, eşlerin, ebeveynlerin, kardeşlerin, dedelerin ve ninelerin ve yan akrabaların miraslarıyla başlar, ardından baba tarafından teyzenin mirasları ve erkek akrabaların vesayeti, daha sonra farklı dinlerden kişilerin ve azat edilmiş kölelerin mirasları gelir ve bilinmeyenin ve zina ile suçlanan bir kadının çocuğunun miraslarıyla sona erer. {cite:muwatta-maruf-1997 s.5} {cite:muwatta-maruf-1997 s.26}"
  id: "Kitab Warisan, kitab ketiga belas dari Al-Muwatta' menurut riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), adalah kitab pertama dari Jilid Kedua: 40 teks (1449–1488) dalam lima belas bab, dari halaman 5 hingga halaman 26 dari file PDF Jilid Kedua. Kitab ini dimulai dengan warisan anak-anak, pasangan suami istri, orang tua, saudara kandung, kakek-nenek, dan kerabat sampingan, kemudian warisan bibi dari pihak ayah dan perwalian kerabat laki-laki, kemudian orang-orang dari agama yang berbeda dan budak yang dibebaskan, dan diakhiri dengan warisan orang yang tidak dikenal dan anak dari seorang wanita yang dituduh berzina. {cite:muwatta-maruf-1997 p.5} {cite:muwatta-maruf-1997 p.26}"
