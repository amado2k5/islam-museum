label: { ar: "مسلم 1829 — ألا كلكم راع وكلكم مسؤول عن رعيته", en: "Muslim 1829 — Each of you is a shepherd, each responsible for his flock" }
text: "قال عبد الله بن عمر عن النبي: ألا كلكم راع وكلكم مسؤول عن رعيته، فالأمير الذي على الناس راع وهو مسؤول عن رعيته، والرجل راع على أهل بيته وهو مسؤول عنهم، والمرأة راعية على بيت بعلها وولده وهي مسؤولة عنهم، والعبد راع على مال سيده وهو مسؤول عنه، ألا فكلكم راع وكلكم مسؤول عن رعيته"
summary:
  ar: "رواية عبد الله بن عمر في باب الولاة من كتاب الإمارة في صحيح مسلم؛ نظرية المسؤولية المتداخلة: كل امرئ راعٍ في مجاله ومسؤول عن رعيته."
