text: |-
  ⁦(ذار)⁩
  ٢٢٤
  والدارىّ العطاروه ومفوب الى دارين فرضة بالحرين فيها سوق كان يحمل اليهاصك
  من ناحية الهند وفى الحديث مشل الجليس الصالح مثل الدارى ان لم يجذك من عطره
  علقك من ريحه قال الشاعر
  اذا التاجر الدارة جاء بفأرة • من المسك راحت فى مفارهاتجرى
  والدارى أيضارب النعم سمى بذلك لانه مقيم فى داره قنسب اليها وقال الراجز
  لبت قلسلا يلحق الداريون «أهسل الجبار البدن المكفيون* سوف ترى إن لمة وامايبلون
  يقول هم أرباب المال واهتقامهم بابلهم أشدمن اهتمام الراعى الذى ليس بمالك لها والدائرة
  واحدة الدواتريقال فى الفرس غمانى عشرة دائرة والدائرة الهزيمة يقال عليهم دائرة
  السوء والمدارة جلد يدارويخرد على هيئة الدلوفيسقى بها قال الراجز
  لا يستقى فى النزح المضفوف • الأمدارات الغروب الجوف
  قول لاعكن أن يستقى من الماء القامل الابدلاء واسعة الاجواف قصيرة الجوائب
  تغمس فى الماءوان كان قليلا فتمتلئ منه ويقال هى من المداراة فى الامور فن قال هذا فاته
  بكسر التاء فى موضع النصب أى بعداراة الدلاء ويقول لابستقى على مالم يسم فاءله ودوار
  بالضم مسم وقديفتح وقال امر والقيس
  فعن لناسرب كأن نعاجه • عذارى دوارف ملا مذيل
  والدواراً يضا من دوار الرأس يقال ديربالرجل وأديربه ودير النصارى أصلد الواو والجمع
  أديار والديرانى صا-ب الدير وقال ابن الاعرابب بقال للرجل اذار أس أصحابه هورأس
  الدير ⁦(دهر)⁩ الدهر الزمان قال الشاعر
  ان دهرايلف شملى بجعل * زمان يهم بالاحسان
  ويجمع على دهو روية سال الدهر الابدوقوايم دهرداهر كة ولهم أبدأ بيد وقواهم دهردهارير
  أى شديد كواهم الدايلاءوخارأنر ويوم أيوم وساعسوعاء وأنشد أبوعرو
  ابن العلامرجل من أهل تجد
  وبينما المرء فى الاحيإمغتبط • اذاه و الرمس تعفوه الاعاصير ١
  حتى كان لم يكن الاتذكره • والده-رأ يتماسال دهارير
  ويقال لا آتبك دهر الداهرين أى أبداو فى الحديث لانسبوا الدهرفان الدهرهواقه لانهم
  كانوا يضيفون النوازل اليه فقيل لهم لانسبوا فاعل ذلكْ بكم فانّ ذلكْ هواللّه ته سالى ويقسال
  دهر بهم أمر أى نزل به-م وماذالبدهرى أى عادتى ومادهرى بكذا أى همتى قال متمم
  ابن تويرة لعمرى ومادهرى بتأبين هالك • ولاجزعاعما أصاب فأوجعا
  والدهرى بالضم المسن والدهرى بالفتح الهدقال ثعلب هما بميعامنسوبان الى الدهروهم
  ربما غيرواف النسب كما قالوا-ه لى بالضم للمذ-وب الى الارض السهلة ودهورت الشئ
  اذا جعته ثم قذفته فى مهواة بقال هو يدهور اللقم اذا كبرها
  صل الزال أر) أبو زيداذ أرت الرجل بصاحبه إذ آرا أى حرتشنه وأولعته
  يد وقدذ ترعايهسين أذأرته أى اجتر أعليه وفى الحديثذ"والناعلى أزواجمن
  صاح
  ١ ال ذا اليتمع القصيدة
  التى *و منهاقصة عجيبة مذ كورة
  فى درة الغواص ونقلها صاحب
