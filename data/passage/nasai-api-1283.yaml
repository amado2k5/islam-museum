text: "… قَالَ قَدِمَ عَلَيْنَا سُلَيْمَانُ مَوْلَى الْحَسَنِ بْنِ عَلِيٍّ زَمَنَ الْحَجَّاجِ فَحَدَّثَنَا عَنْ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ عَنْ أَبِيهِ أَنَّ رَسُولَ اللَّهِ جَاءَ ذَاتَ يَوْمٍ وَالْبُشْرَى فِي وَجْهِهِ فَقُلْنَا إِنَّا لَنَرَى الْبُشْرَى فِي وَجْهِكَ. فَقَالَ \" إِنَّهُ أَتَانِي الْمَلَكُ فَقَالَ يَا مُحَمَّدُ إِنَّ رَبَّكَ يَقُولُ أَمَا يُرْضِيكَ أَنَّهُ لاَ يُصَلِّي عَلَيْكَ أَحَدٌ إِلاَّ صَلَّيْتُ عَلَيْهِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1283، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1283 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1283، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1283 (El Libro del Olvido (En la Oración)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 1283 (Le Livre de l'oubli (dans la prière)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 1283 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, İslam'da babalık konusuna dair bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 1283, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
