text: "… رمضان سنة مان وسبعين وخمسمائة بالموصل، ودفن بمقبرة باب الميدان، تعالى. رجعنا إلى تتمة كلام أبي المحاسن ابن شداد : وسمعت عليه - يعني على الخطيب المذكور - كثيراً من مسموعاته، وأجاز لي جميع ما رواه في السادس والعشرين من …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 85، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
