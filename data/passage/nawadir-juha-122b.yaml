text: "… قطعت سعر الفوطة دخلٍ، يوماً، هو وتيمور لنك إلى الحمّام، فسأله تيمورلنك: لو كنْتُ عبداً فكم كنت أساوي؟ فقال له : خمسين درهماً. فصاح تيمور لنك بوجهه: يا قليل الإنصاف إن الفوطة التي بوسطي تساوي هذه القيمة. فأجابه الشيخ بسكون: …"
summary:
  ar: "تتمة الحكاية: قال جحا إنه لو كان عبدًا لساوى خمسين درهمًا، فقال تيمور إن فوطته وحدها أغلى من ذلك، فقال جحا إنه كان قد قدّر سعر الفوطة أيضًا. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  en: "Continued: Juha says he would be worth fifty dirhams as a slave; Timur says his own towel is worth more; Juha says he had also set a price on the towel. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  ur: "تتمہ: جحا نے کہا کہ غلام ہوتا تو پچاس درہم کا ہوتا؛ تیمور نے کہا کہ اس کا اپنا تولیہ اس سے زیادہ قیمتی ہے؛ جحا نے کہا کہ میں نے تولیے کی قیمت بھی لگا لی تھی۔ {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  fr: "Suite: Juha dit qu'il vaudrait cinquante dirhams comme esclave; Timur dit que sa propre serviette vaut davantage; Juha répond qu'il avait aussi fixé un prix pour la serviette. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  es: "Continuación: Juha dice que como esclavo valdría cincuenta dírhams; Timur dice que su propia toalla vale más; Juha responde que también había fijado un precio a la toalla. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
