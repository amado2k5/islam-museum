text: "… نا عَبد الرَّحمن بن أبي حَاتم، حَدثني أبُو بكر محمّد بن عباس المكي، قال: سَمعت الورْكاني - جَارُ أحمَد بن حَنبل - قال : أسْلم يَومَ مات أحمَد بن حَنبَل عشرون ألفاً من اليَهود وَالنصَارى وَالمَجوس. قال: وَسَمعت الوَركاني يَقُول …"
