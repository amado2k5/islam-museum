text: "الصلاة الوسطى صلاة الظهر"
summary:
  ar: "أثر يرويه مالك عن داود بن الحصين عن ابن يربوع المخزومي أنه سمع زيد بن ثابت يقول إن الصلاة الوسطى صلاة الظهر؛ وهو في باب الصلاة الوسطى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه روي مرفوعاً من حديث عروة عن زيد بن ثابت عند أحمد وأبي داود (411) والنسائي في الكبرى بإسناد صحيح. {cite:muwatta-maruf-1997 p.201}"
