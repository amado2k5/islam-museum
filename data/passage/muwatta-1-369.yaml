text: "الصلاة الوسطى صلاة الظهر"
summary:
  ar: "أثر يرويه مالك عن داود بن الحصين عن ابن يربوع المخزومي أنه سمع زيد بن ثابت يقول إن الصلاة الوسطى صلاة الظهر؛ وهو في باب الصلاة الوسطى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه روي مرفوعاً من حديث عروة عن زيد بن ثابت عند أحمد وأبي داود (411) والنسائي في الكبرى بإسناد صحيح. {cite:muwatta-maruf-1997 p.201}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Dawud ibn al-Husayn, atas otoritas Ibn Yarbu' al-Makhzumi, bahwa ia mendengar Zayd ibn Thabit mengatakan bahwa salat tengah adalah salat Zuhur; ini terdapat dalam bab tentang salat tengah. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab dan Suwayd, dan bahwa riwayat ini dinarasikan dengan sanad yang dapat ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) melalui 'Urwah, atas otoritas Zayd ibn Thabit, dalam kumpulan Ahmad, Abu Dawud (411), dan al-Nasa'i dalam al-Kubra dengan sanad yang sahih. {cite:muwatta-maruf-1997 p.201}"
