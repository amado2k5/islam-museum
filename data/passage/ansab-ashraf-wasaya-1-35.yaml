text: "… مُضر الحمراء. وهذا الخباء الأسود وفرسي الأدهم لربيعة. فسمي ربيعة الفرس. وهذه الجارية لإياد. وكانت شمطاء، فقيل إياد الشمطاء والبرقاء. وهذا الحمار لأنمار. فقيل أنمار الحمار. وفيه يقول الشاعر : نِزار كان أعلم إذ تولّى لأيّ بنيه أوصى بالحمار قال …"
