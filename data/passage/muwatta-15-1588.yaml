label: { ar: "الموطأ 1588 — القاسم بن محمد: رجل كانت تحته وليدة لقوم فقال لأهلها شأنكم بها، فرأى الناس أنها تطليقة واحدة", en: "Muwatta 1588", es: "Muwatta 1588", fr: "Muwatta 1588", ur: "موطا 1588", tr: "El-Muvatta 1588 — El-Kâsım ibn Muhammed: Bir adamın, bazı kişilere ait bir cariyesi vardı ve ailesine, \"Onunla istediğinizi yapabilirsiniz\" dedi. Bunun üzerine insanlar bunu bir boşanma olarak kabul ettiler.", id: "Al-Muwatta 1588 — Al-Qasim ibn Muhammad: Seorang pria mempunyai seorang budak perempuan milik sebagian orang, dan dia berkata kepada keluarganya, \"Kalian boleh melakukan apa pun yang kalian mau dengannya.\" Maka orang-orang menganggapnya sebagai satu kali perceraian." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن القاسم بن محمد أن رجلا كانت تحته وليدة لقوم، فقال لأهلها شأنكم بها، فرأى الناس أنها تطليقة واحدة. {cite:muwatta-maruf-1997 p.61}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayet eder ki, bir adamın bazı kişilere ait bir cariyesi vardı ve ailesine, \"Onunla istediğinizi yapabilirsiniz\" dedi. Halk bunu tek bir boşanma olarak kabul etti. {cite:muwatta-maruf-1997 s.61}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya bin Sa'id, dari al-Qasim bin Muhammad, bahwa seorang pria mempunyai seorang budak perempuan milik sebagian orang, dan dia berkata kepada keluarganya, \"Kalian boleh melakukan apa pun yang kalian mau dengannya.\" Orang-orang menganggap ini sebagai perceraian tunggal. {cite:muwatta-maruf-1997 p.61}"
