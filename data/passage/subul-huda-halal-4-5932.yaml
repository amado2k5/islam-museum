text: "… اللّٰه تعالى عنها قالت : سُئل رسولُ اللّٰه والين عن رجل زنى بامرأة فأراد أن يتزَّوجَها أو ابنتها قال : لا يُحَرِّمُ الحرامُ الحلالَ إنما يُحَرّم ما كان بِنِكَاح. زيادة من مسند الشافعى وسنن الدارقطنى لتحديد المراد باسم الصحابى. أخرجه …"
