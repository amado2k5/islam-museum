label: { ar: "الموطأ 1238 — مالك: إن حاضت المرأة بمنى قبل أن تفيض، فإن كريها يحبس عليها أكثر مما يحبس النساء الدم", en: "Muwatta 1238", es: "Muwatta 1238", fr: "Muwatta 1238", ur: "موطا 1238", tr: "El-Muvatta 1238 — Malik: Eğer bir kadın tavaf yapmadan önce Mina'da adet görürse, o zaman kadınlardan daha fazla kan kaybetmesine neden olan bir rahatsızlığı olan bir erkek...", id: "Al-Muwatta 1238 — Malik: Jika seorang wanita mengalami haid di Mina sebelum ia melaksanakan Tawaf, maka seorang pria yang menderita suatu penyakit yang menyebabkan wanita tersebut kehilangan lebih banyak darah daripada wanita lainnya." }
summary:
  ar: "يقول مالك إن حاضت المرأة بمنى قبل أن تفيض، فإن كريها، أي مكاري الدواب، يحبس عليها أكثر مما يحبس النساء الدم. {cite:muwatta-maruf-1997 p.553}"
  tr: "Malik, Mina'da bir kadın ritüeli tamamlamadan önce adet görürse, deve sürücüsünün kadının kendisinden daha fazla kanı tutacağını söylüyor. {cite:muwatta-maruf-1997 s.553}"
  id: "Malik mengatakan bahwa jika seorang wanita mengalami menstruasi di Mina sebelum menyelesaikan ritual, maka pengemudi unta akan menahan lebih banyak darah daripada wanita itu sendiri. {cite:muwatta-maruf-1997 p.553}"
