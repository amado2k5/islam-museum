text: "كانت السماء واحدة، ففَتِّقَ منها سبع سمواتٍ، وكانت الأرض واحدةً ففَتَقَ منها سبع أرضين."
summary:
  ar: "عند تفسير آية الرتق والفتق ينقل ابن كثير عن أبي صالح ومجاهد أن السماء كانت واحدة ففُتق منها سبع سماوات وأن الأرض كانت واحدة ففُتق منها سبع أرضين، ويذكر في الموضع نفسه أقوالاً أخرى: ابن عباس في المطر والنبات، وسعيد بن جبير في التصاقهما، والحسن وقتادة في انفصالهما بالهواء."
  en: "On the verse of the joined and split heavens and earth, Ibn Kathir relays from Abu Salih and Mujahid that the heaven was one and was split into seven heavens, and the earth was one and was split into seven earths. He sets beside it other readings: Ibn Abbas (sky and earth opened by rain and plants), Said ibn Jubayr (they were fused) and al-Hasan and Qatada (they were separated by the air)."
  es: "En el versículo sobre los cielos y la tierra unidos y divididos, Ibn Kathir relata, según Abu Salih y Mujahid, que el cielo era uno y se dividió en siete cielos, y la tierra era una y se dividió en siete tierras. Junto a esta versión, cita otras: Ibn Abbas (el cielo y la tierra se abrieron por la lluvia y las plantas), Said ibn Jubayr (se fusionaron) y al-Hasan y Qatada (se separaron por el aire)."
