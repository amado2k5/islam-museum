label: { ar: "الموطأ 73 — ابن عمر يأخذ الماء بأصبعيه لأذنيه", en: "Muwatta 73" }
summary:
  ar: "أول أثر في باب ما جاء في المسح بالرأس والأذنين. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان يأخذ الماء بأصبعيه فيمسح بهما أذنيه. ويذكر المحقق رواية عبد الرزاق عن معمر عن أيوب عن نافع بصفة أتم: كان ابن عمر يمسح مسحة واحدة على مقدم رأسه ثم يدخل أصبعيه في الماء ثم في أذنيه ويرد إبهاميه خلف أذنيه. {cite:muwatta-maruf-1997 p.74}"
