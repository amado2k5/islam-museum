label: { ar: "الموطأ 73 — ابن عمر يأخذ الماء بأصبعيه لأذنيه", en: "Muwatta 73", es: "Muwatta 73", fr: "Muwatta 73", ur: "موطا 73", tr: "El-Muvatta 73 — İbn Ömer parmaklarıyla kulaklarına su götürüyor", id: "Al-Muwatta 73 — Ibnu Umar mengambil air dengan jari-jarinya ke telinganya" }
summary:
  ar: "أول أثر في باب ما جاء في المسح بالرأس والأذنين. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان يأخذ الماء بأصبعيه فيمسح بهما أذنيه. ويذكر المحقق رواية عبد الرزاق عن معمر عن أيوب عن نافع بصفة أتم: كان ابن عمر يمسح مسحة واحدة على مقدم رأسه ثم يدخل أصبعيه في الماء ثم في أذنيه ويرد إبهاميه خلف أذنيه. {cite:muwatta-maruf-1997 p.74}"
  tr: "Baş ve kulak silme ile ilgili rivayetler bölümündeki ilk rivayet, Yahya'nın Malik'ten, o da Nafi'den naklettiğine göre Abdullah ibn Umar'ın iki parmağıyla su alıp kulaklarını sildiği şeklindedir. Araştırmacı, Abd al-Razzaq'ın Ma'mar'dan, o da Ayyub'dan, o da Nafi'den naklettiğine göre daha eksiksiz bir rivayetten bahsetmektedir: İbn Umar önce başının ön kısmını siler, sonra iki parmağını suya batırır, sonra kulaklarına sokar ve başparmaklarını kulaklarının arkasına sokardı. {cite:muwatta-maruf-1997 s.74}"
  id: "Riwayat pertama dalam bab ini mengenai apa yang telah dilaporkan tentang mengusap kepala dan telinga diriwayatkan oleh Yahya dari Malik dari Nafi’ bahwa Abdullah ibn Umar biasa mengambil air dengan dua jarinya dan mengusap telinganya dengan kedua jarinya tersebut. Peneliti menyebutkan riwayat yang lebih lengkap dari Abd al-Razzaq dari Ma’mar dari Ayyub dari Nafi’: Ibn Umar biasa mengusap bagian depan kepalanya sekali, kemudian mencelupkan dua jarinya ke dalam air, lalu ke telinganya, dan kemudian menyelipkan ibu jarinya di belakang telinganya. {cite:muwatta-maruf-1997 p.74}"
