  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 425, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
