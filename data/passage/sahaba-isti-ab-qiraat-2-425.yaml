text: "… بدار عبيد اللّٰه بن عبَّاس، فرأى فيها عَنَيْتُ أَبا العبَّاس ذا الفَضْل والنَّدى جماعة ينتابونها للطعام، فدخل على ابن الزُّبير، فقال له : أصبحت والله كما قال الشاعر البسيط : وقال أَبو عمرو بن العلاء : نظر الحُطيئة إلى ابن …"
summary:
