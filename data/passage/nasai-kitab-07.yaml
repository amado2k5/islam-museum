  ar: "سنن النسائي، كتاب الأذان"
  en: "Sunan al-Nasa'i, Book 7: The Book of the Adhan (The Call to Prayer)"
  ur: "سنن نسائی، کتاب الاذان"
  es: "Sunan al-Nasa'i, Libro 7: El Libro del Adhan (La Llamada a la Oración)"
summary:
  ar: "القسم 7 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأذان»، ويضم فيها النصوص من 626 إلى 687 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 7 of Sunan al-Nasa'i (The Book of the Adhan (The Call to Prayer)) in the division of the open hadith dataset the museum took its reports from: reports 626 to 687 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 7، عنوان «کتاب الاذان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 626 تا 687۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 7 de Sunan al-Nasa'i (El Libro del Adhan (La Llamada a la Oración)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 626 al 687, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
