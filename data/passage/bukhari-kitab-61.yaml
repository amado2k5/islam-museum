  ar: "صحيح البخاري، كتاب المناقب"
  en: "Sahih al-Bukhari, Book 61: Virtues and Merits of the Prophet (pbuh) and his Companions"
  ur: "صحیح بخاری، کتاب المناقب"
  es: "Sahih al-Bukhari, Libro 61: Virtudes y méritos del Profeta y sus Compañeros"
summary:
  ar: "القسم 61 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المناقب»، ويضم فيها النصوص من 3489 إلى 3648 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 61 of Sahih al-Bukhari (Virtues and Merits of the Prophet (pbuh) and his Companions) in the division of the open hadith dataset the museum took its reports from: reports 3489 to 3648 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 61، عنوان «کتاب المناقب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3489 تا 3648۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 61 de Sahih al-Bukhari (Virtudes y méritos del Profeta y sus compañeros) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3489 al 3648, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
