label: { ar: "الموطأ 2610 — أسلم مولى عمر: عمر يستحسن النبيذ ويعاتب عبد الله بن عياش على تفضيل مكة", en: "Muwatta 2610" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عبد الرحمن بن القاسم أن أسلم مولى عمر بن الخطاب أخبره أنه زار عبد الله بن عياش المخزومي فرأى عنده نبيذا وهو بطريق مكة، فقال له أسلم: إن هذا الشراب يحبه عمر بن الخطاب، فحمل عبد الله قدحا عظيما إلى عمر، فشرب منه وقال: إن هذا لشراب طيب. ثم ناداه عمر وسأله: أأنت القائل إن مكة خير من المدينة؟ فقال: هي حرم الله وأمنه وفيها بيته. فقال عمر: لا أقول في بيت الله ولا في حرمه شيئا، ثم انصرف. {cite:muwatta-maruf-1997 p.472}"
