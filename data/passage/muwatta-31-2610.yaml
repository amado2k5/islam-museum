label: { ar: "الموطأ 2610 — أسلم مولى عمر: عمر يستحسن النبيذ ويعاتب عبد الله بن عياش على تفضيل مكة", en: "Muwatta 2610", es: "Muwatta 2610", fr: "Muwatta 2610", ur: "موطا 2610", tr: "El-Muvatta 2610 — Ömer'in azatlı kölesi Aslam: Ömer şarabı onaylar ve Abdullah ibn Ayyash'ı Mekke'yi tercih ettiği için azarlar.", id: "Al-Muwatta 2610 — Aslam, budak Umar yang telah dibebaskan: Umar menyetujui anggur dan menegur Abdullah ibn Ayyash karena lebih menyukai Mekah." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عبد الرحمن بن القاسم أن أسلم مولى عمر بن الخطاب أخبره أنه زار عبد الله بن عياش المخزومي فرأى عنده نبيذا وهو بطريق مكة، فقال له أسلم: إن هذا الشراب يحبه عمر بن الخطاب، فحمل عبد الله قدحا عظيما إلى عمر، فشرب منه وقال: إن هذا لشراب طيب. ثم ناداه عمر وسأله: أأنت القائل إن مكة خير من المدينة؟ فقال: هي حرم الله وأمنه وفيها بيته. فقال عمر: لا أقول في بيت الله ولا في حرمه شيئا، ثم انصرف. {cite:muwatta-maruf-1997 p.472}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Abdülrahman ibn el-Kâsim'den rivayet ettiğine göre, Ömer ibn el-Hattab'ın azatlı kölesi Aslam, Mekke yolunda Abdullah ibn Ayyaş el-Makhzumi'yi ziyaret ettiğini ve onunla birlikte şarap gördüğünü anlatmıştır. Aslam ona, \"Ömer ibn el-Hattab bu içkiyi çok sever\" demiştir. Bunun üzerine Abdullah, Ömer'e büyük bir kadeh getirmiş, Ömer ondan içmiş ve \"Bu güzel bir içki\" demiştir. Ardından Ömer onu çağırmış ve \"Mekke'nin Medine'den daha iyi olduğunu söyleyen sen miydin?\" diye sormuştur. Aslam, \"Mekke Allah'ın kutsal mekanı ve güvenli yeridir, Kabe'si de oradadır\" diye cevap vermiştir. Ömer, \"Allah'ın Kabe'si veya kutsal mekanı hakkında hiçbir şey söylemeyeceğim\" demiş ve oradan ayrılmıştır. {cite:muwatta-maruf-1997 s.472}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abd al-Rahman ibn al-Qasim, bahwa Aslam, budak yang dibebaskan oleh Umar ibn al-Khattab, menceritakan kepadanya bahwa ia mengunjungi Abdullah ibn Ayyash al-Makhzumi dan melihat anggur bersamanya ketika dalam perjalanan ke Mekah. Aslam berkata kepadanya, \"Umar ibn al-Khattab menyukai minuman ini.\" Maka Abdullah membawakan sebuah cangkir besar kepada Umar, yang meminumnya dan berkata, \"Ini minuman yang enak.\" Kemudian Umar memanggilnya dan bertanya, \"Apakah engkau yang mengatakan bahwa Mekah lebih baik daripada Madinah?\" Ia menjawab, \"Mekah adalah tempat suci dan tempat perlindungan Allah, dan Rumah-Nya ada di sana.\" Umar berkata, \"Aku tidak akan mengatakan apa pun tentang Rumah Allah atau tempat suci-Nya,\" lalu ia pergi. {cite:muwatta-maruf-1997 p.472}"
