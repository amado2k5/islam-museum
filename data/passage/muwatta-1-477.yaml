label: { ar: "الموطأ 477 — رأى النبي مستلقياً في المسجد واضعاً إحدى رجليه على الأخرى", en: "Muwatta 477", es: "Muwatta 477", fr: "Muwatta 477", ur: "موطا 477", tr: "El-Muvatta 477 — Peygamberimiz mescittede bir bacağını diğerinin üzerine atmış halde uzanmış olarak görüldü.", id: "Al-Muwatta 477 — Nabi terlihat berbaring di masjid dengan satu kaki diletakkan di atas kaki lainnya." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن عباد بن تميم عن عمه عبد الله بن زيد المازني، في باب جامع الصلاة: رأى النبي مستلقياً في المسجد واضعاً إحدى رجليه على الأخرى. ويخرّجه المحقق عند البخاري (475) ومسلم (6/154) وأبي داود (4866) والنسائي (2/50) وأحمد ومحمد بن الحسن من طرق أصحاب مالك، ويحيل على التمهيد (9/203). {cite:muwatta-maruf-1997 p.245}"
  tr: "Malik, İbn Şihab'dan, o da Abbad ibn Tamim'den, o da amcası Abdullah ibn Zeyd el-Mazini'den rivayetle, tam namaz bölümünde şöyle anlatmıştır: Peygamber'i mescitte bir ayağını diğerinin üzerine koymuş halde yatarken görmüştür. Araştırmacı, bunu Buhari (475), Müslim (6/154), Ebu Davud (4866), Nesai (2/50), Ahmed ve Muhammed ibn Hasan'ın rivayetlerine, Malik'in sahabelerinin isnad zincirleri aracılığıyla dahil etmiş ve Tamhid'e (9/203) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.245}"
  id: "Diriwayatkan oleh Malik dari Ibnu Shihab, dari Abbas bin Tamim, dari pamannya Abdullah bin Zayd al-Mazini, dalam surah tentang shalat lengkap: Beliau melihat Nabi berbaring di masjid dengan satu kaki di atas kaki lainnya. Peneliti memasukkannya dalam kumpulan hadis al-Bukhari (475), Muslim (6/154), Abu Dawud (4866), al-Nasa'i (2/50), Ahmad, dan Muhammad bin al-Hasan, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (9/203). {cite:muwatta-maruf-1997 p.245}"
