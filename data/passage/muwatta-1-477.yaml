summary:
  ar: "يرويه مالك عن ابن شهاب عن عباد بن تميم عن عمه عبد الله بن زيد المازني، في باب جامع الصلاة: رأى النبي مستلقياً في المسجد واضعاً إحدى رجليه على الأخرى. ويخرّجه المحقق عند البخاري (475) ومسلم (6/154) وأبي داود (4866) والنسائي (2/50) وأحمد ومحمد بن الحسن من طرق أصحاب مالك، ويحيل على التمهيد (9/203). {cite:muwatta-maruf-1997 p.245}"
