text: "… ومالِه، فليس ذلك بمؤمنٍ، وليس بمؤمن من لم يأمنْ جارُه بوائقه. أتدري ما حقُّ الجار ؟ إذا استعانك أعنته، وإذا استقرضك أقرضته، وإذا افتقر عُدْتَ عليهِ، وإذا مَرِضَ عُدته، وإذا أصابه خير هنأته، وإذا أصابته مُصيبةٌ عزَّيته، وإذا ماتَ اتبعتَ …"
summary:
  ar: "مقطع من جامع العلوم والحكم، المجلد المصوَّر 2، ص 333، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Jami' al-Ulum wal-Hikam, scan volume 2, p. 333, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "جامع العلوم والحکم، اسکین جلد 2، ص 333 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Ulum wal-Hikam, volume numérisé 2, p. 333, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Jami' al-Ulum wal-Hikam, volumen escaneado 2, p. 333, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Cami' el-Ulum ve el-Hikam'ın 2. cildinin 333. sayfasından, felaket karşısında taziye, teselli ve sabır içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü mersiye ve övgü şiirlerinden derlenmiştir."
  id: "Cuplikan dari Jami' al-'Ulum wa al-Hikam, Volume 2, halaman 333, berisi ucapan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
