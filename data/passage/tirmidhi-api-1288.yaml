text: "حَدَّثَنَا أَبُو عَمَّارٍ الْحُسَيْنُ بْنُ حُرَيْثٍ الْخُزَاعِيُّ، حَدَّثَنَا الْفَضْلُ بْنُ مُوسَى، عَنْ صَالِحِ بْنِ أَبِي جُبَيْرٍ، عَنْ أَبِيهِ، عَنْ رَافِعِ بْنِ عَمْرٍو، قَالَ كُنْتُ أَرْمِي نَخْلَ الأَنْصَارِ فَأَخَذُونِي فَذَهَبُوا بِي إِلَى النَّبِيِّ فَقَالَ \" يَا رَافِعُ لِمَ تَرْمِي نَخْلَهُمْ \". قَالَ قُلْتُ يَا رَسُولَ اللَّهِ الْجُوعُ. قَالَ \" لاَ تَرْمِ وَكُلْ مَا وَقَعَ أَشْبَعَكَ اللَّهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1288، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1288 (The Book on Business), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1288، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
