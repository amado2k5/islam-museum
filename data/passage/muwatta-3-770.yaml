label: { ar: "الموطأ 770 — مالك: يؤدي الرجل زكاة الفطر عن كل من يضمن نفقته: مكاتبه ومدبره ورقيقه كلهم من كان منهم مسلماً", en: "Muwatta 770", es: "Muwatta 770", fr: "Muwatta 770", ur: "موطا 770", tr: "El-Muvatta 770 — Malik: Bir kimse, geçimini sağlamakla yükümlü olduğu herkes adına zekât-ı fitr öder: azat sözleşmesiyle kölesi olan, özgürlüğü efendisinin ölümüne bağlı olan kölesi olan ve Müslüman olmaları şartıyla tüm köleleri.", id: "Al-Muwatta 770 — Malik: Seorang pria membayar Zakat al-Fitr atas nama setiap orang yang menjadi tanggung jawabnya: budaknya yang terikat perjanjian pembebasan, budaknya yang kebebasannya bergantung pada kematian tuannya, dan semua budaknya, asalkan mereka beragama Islam." }
summary:
  ar: "يروي مالك أن أحسن ما سمع فيما يجب على الرجل من زكاة الفطر أن الرجل يؤدي ذلك عن كل من يضمن نفقته ولا بد له من أن ينفق عليه؛ ويؤدي عن مكاتبه ومدبره ورقيقه كلهم غائبهم وشاهدهم، من كان منهم مسلماً، ومن كان منهم لتجارة أو لغير تجارة، ومن لم يكن منهم مسلماً فلا زكاة عليه فيه. ويذكر المحقق أن في نسخة م «سمعت»، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.380}"
  tr: "Malik, bir erkeğin farz olan zekât (fitre) konusunda duyduğu en iyi görüşün, geçimini sağlamakla yükümlü olduğu ve bakmakla yükümlü olduğu herkes adına zekât vermesi gerektiği yönünde olduğunu rivayet eder. Bu zekâtı, köleleri, efendilerinin ölümünden sonra özgürlüklerini satın almakla sözleşme yaptığı köleleri ve ister mevcut olsun ister olmasın, ister Müslüman olsun ister ticaretle uğraşsın ister uğraşmasın, tüm köleleri adına vermelidir. Müslüman olmayanlar ise zekât vermekle yükümlü değildir. Editör, M el yazmasında \"Duydum\" ifadesinin geçtiğini ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.380}"
  id: "Malik meriwayatkan bahwa pendapat terbaik yang pernah ia dengar mengenai zakat fitrah wajib bagi seorang laki-laki adalah bahwa ia wajib membayarnya atas nama setiap orang yang menjadi tanggung jawabnya dan yang harus ia nafkahi. Ia wajib membayarnya atas nama budak-budaknya, mereka yang telah ia sepakati untuk dibebaskan setelah kematian tuannya, dan semua budaknya, baik yang hadir maupun tidak hadir, baik mereka Muslim, maupun yang berprofesi sebagai pedagang atau bukan. Mereka yang bukan Muslim tidak wajib membayar zakat atas diri mereka sendiri. Editor mencatat bahwa dalam manuskrip M, tertulis \"Saya dengar,\" dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.380}"
