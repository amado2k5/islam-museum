label: { ar: "الموطأ 770 — مالك: يؤدي الرجل زكاة الفطر عن كل من يضمن نفقته: مكاتبه ومدبره ورقيقه كلهم من كان منهم مسلماً", en: "Muwatta 770" }
summary:
  ar: "يروي مالك أن أحسن ما سمع فيما يجب على الرجل من زكاة الفطر أن الرجل يؤدي ذلك عن كل من يضمن نفقته ولا بد له من أن ينفق عليه؛ ويؤدي عن مكاتبه ومدبره ورقيقه كلهم غائبهم وشاهدهم، من كان منهم مسلماً، ومن كان منهم لتجارة أو لغير تجارة، ومن لم يكن منهم مسلماً فلا زكاة عليه فيه. ويذكر المحقق أن في نسخة م «سمعت»، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.380}"
