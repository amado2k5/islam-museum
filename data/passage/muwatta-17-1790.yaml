label: { ar: "الموطأ 1790 — يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم: أبان بن عثمان وهشام بن إسماعيل كانا يذكران في خطبتهما عهدة الرقيق في الأيام الثلاثة وعهدة السنة", en: "Muwatta 1790", es: "Muwatta 1790", fr: "Muwatta 1790", ur: "موطا 1790", tr: "El-Muvatta 1790 — Yahya, Malik'ten, o da Abdullah ibn Abi Bekr ibn Muhammed ibn Amr ibn Hazm'dan rivayetle: Aban ibn Osman ve Hişam ibn İsmail, vaazlarında üç günlük ve bir yıllık kölelik ahdinden bahsederlerdi.", id: "Al-Muwatta 1790 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm: Aban ibn Uthman dan Hisham ibn Ismail biasa menyebutkan dalam khutbah mereka perjanjian budak selama tiga hari dan perjanjian selama satu tahun" }
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم أن أبان بن عثمان وهشام بن إسماعيل كانا يذكران في خطبتهما عهدة الرقيق، في الأيام الثلاثة من حين يشترى العبد أو الوليدة، وعهدة السنة. {cite:muwatta-maruf-1997 p.134}"
  tr: "Yahya, Malik'ten, o da Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan rivayet ettiğine göre, Aban ibn Uthman ve Hişam ibn İsmail vaazlarında köleler için teminattan, köle veya genç kızın satın alındığı tarihten itibaren üç günlük süreden ve bir yıllık teminattan bahsederlerdi. {cite:muwatta-maruf-1997 s.134}"
  id: "Yahya meriwayatkan dari Malik, dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, bahwa Aban ibn Uthman dan Hisham ibn Ismail biasa menyebutkan dalam khutbah mereka tentang jaminan untuk budak, yaitu jangka waktu tiga hari sejak budak atau gadis muda dibeli, dan jaminan satu tahun. {cite:muwatta-maruf-1997 p.134}"
