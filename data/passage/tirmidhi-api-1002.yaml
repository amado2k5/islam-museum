label: { ar: "جامع الترمذي 1002 — الأب والأبوة", en: "Jami' al-Tirmidhi 1002 — the father and fatherhood", ur: "جامع ترمذی 1002 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1002 — El padre y la paternidad" }
text: "… بْنُ إِبْرَاهِيمَ بْنِ سَعْدٍ، حَدَّثَنَا أَبِي، عَنْ صَالِحِ بْنِ كَيْسَانَ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ، قَالَ قَالَ عُمَرُ بْنُ الْخَطَّابِ قَالَ رَسُولُ اللَّهِ \" الْمَيِّتُ يُعَذَّبُ بِبُكَاءِ أَهْلِهِ عَلَيْهِ \". وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَعِمْرَانَ بْنِ حُصَيْنٍ. قَالَ أَبُو عِيسَى حَدِيثُ عُمَرَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ كَرِهَ قَوْمٌ مِنْ أَهْلِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1002، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1002 (The Book on Jana''iz (Funerals)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1002، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1002 (El Libro de los Funerales), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
