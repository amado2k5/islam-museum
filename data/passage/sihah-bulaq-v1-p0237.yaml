  أندرمدرا أخبرنا بذلك يونس عن العرب وابن منادرشاء رفن متح الميم منه لم يصرفه ويقول
  . انه جمع منذر لانه محمد بن منذرين منذربن منذرومن ضمها صرفه وهم المناذرة يريد آل المنذر
  أوجماعة الحى مثل المهالبة والمسامعة وقولهم النذير العريان قال ابن السكيت هورجل
  من خنعم حل عليه يوم ذى انخاصة عوف بن عامر فقطع يده ويداحر أنه وتناذر القوم كذا
  أى خوّف بعضهم بعضا وقال النابغة يصف حية
  تناذرها الراقون من "و"سمها * تطلقه حينا وحينا تراجع
  ونذر القوم بالعدو بكسر الذال اذا عملوا (لزر% ⅜œ التزرالقليل التافه وقد نزر الشئ
  بالضم ينزرنزارة وعطاء منزور أى قليل وقواهم فلان لا يعطى حتى ينزر أى يلح عليه
  ويصغر من قدره والمزور المرأة القليلة الواد وقال
  بغاث الطيرأ كثرهافراحا • وأم الصة رمقلات نزور
  ونزاراً بوقبيلة وهو تزاربن معد بن عدنان يقال تنزر الرجل اذا تشبه بالنزارية أوأدخل نفسه
  فيهم ⁦(نسر )⁩ النسرطائروجع اللة أتسر والكثير نسور ويقسال النسر لا مخلب له
  واغماله ظفر كظفر الدجاجة والغراب والرخة ونسر صم كان لذى الكلاع بأرس حير
  وكان يغوث لمذحيج ويعوق لهمدان من أصنام قوم نوح عليه السلام قال اللّٰه تعالى ولا
  يغون وبعوق ونسراوقد تدخل فيه الالف واللام قان الشاعر
  أماودماه مائرات تخالها * على قنة العزى وبالنسر عقدما
  والفسر أيضالهة يابسة فى بطن المافر كانهانواة أوحصاة والناسور بالسين والصاد بجيعاعلة
  تحدث فى ما فى العين يسق فلا يتقطع وقد يحدث أيضا فى حوالى المقعدة وفى المثة وهو
  معرّب وفى النجوم النسر الطأروالنمر الواقع والنسرنتف البازى اللحسم بفسره وقد نسره
  نسره نسراو المنسر بكسر الميم اسباع الطير بعنزلة المتقار اغيرها والمنسر أيضاقطعة من الجدش
  تمرّقدام الجيش الكبير قال ابيديرى قتلى هوازن
  سمااهم ابن الجعد-تى أصابهم * يدى لحب كالطود ليس بمتسر
  والمنسمر بفتج الميم وكسر السين مثال الجلساغة فيه واستفسر البغاث اذا صار كالنسر وفى
  المثل ان البغاث بأرضنا يستفسر أى ان الضعيف يصيرة ويا والماسور العرق الغير الذى
  لا ينقطع والنسار بكسر النون ماعلبى عامر ومنه يوم التسارابنى أسدوذبيان على بنى جشم
