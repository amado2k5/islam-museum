text: "… حلية الأولياء وهذا واضح فى أن العبادات التى تثقل على النفوس الجاهلة التى لم تذق بعد حلاوة الإيمان تصير هى جنة المؤمنين التى ينقلون منها إلى جنة الآخرة كما قال شيخ الإسلام : إن فى الدنيا جنة من لم يدخلها …"
summary:
