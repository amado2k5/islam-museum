label: { ar: "مسلم 2276 — اصطفى الله كنانة من ولد إسماعيل", en: "Muslim 2276 — God chose Kinana from Ismail's line" }
text: "سمعت رسول الله يقول: «إن الله اصطفى كنانة من ولد إسماعيل، واصطفى قريشاً من كنانة، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم»"
summary:
  ar: "رواية واثلة بن الأسقع في كتاب الفضائل من صحيح مسلم؛ سلسلة الاصطفاء النبوية من إسماعيل إلى كنانة فقريش فبني هاشم فالنبي — النص الأشهر في نسب النبي وكرامة سلالته عند أهل السنة."
