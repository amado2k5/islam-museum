label: { ar: "مسلم 2276 — اصطفى الله كنانة من ولد إسماعيل", en: "Muslim 2276 — God chose Kinana from Ismail's line", es: "Muslim 2276 — Dios eligió a Kinana del linaje de Ismail.", fr: "Muslim 2276 — Dieu a choisi Kinana parmi les descendants d'Ismaïl.", ur: "مسلم 2276 - خدا نے کنانہ کو اسماعیل کی نسل سے منتخب کیا۔", tr: "Müslim 2276 — Allah, İsmail'in soyundan Kinanah'ı seçti.", id: "Muslim 2276 — Allah memilih Kinanah dari keturunan Ismail" }
text: "سمعت رسول الله يقول: «إن الله اصطفى كنانة من ولد إسماعيل، واصطفى قريشاً من كنانة، واصطفى من قريش بني هاشم، واصطفاني من بني هاشم»"
summary:
  ar: "رواية واثلة بن الأسقع في كتاب الفضائل من صحيح مسلم؛ سلسلة الاصطفاء النبوية من إسماعيل إلى كنانة فقريش فبني هاشم فالنبي — النص الأشهر في نسب النبي وكرامة سلالته عند أهل السنة."
  tr: "Sahih Müslim'deki Faziletler Kitabı'nda Vatila bin el-Aska'nın rivayeti; İsmail'den Kinana'ya, sonra Kureyş'e, sonra Beni Haşim'e ve nihayetinde Peygamber'e uzanan Peygamber soyu — Sünniler arasında Peygamber'in soyu ve soyundan gelenlerin şerefi hakkında en meşhur metin."
  id: "Riwayat Wathila bin Al-Asqa’ dalam Kitab Keutamaan dari Sahih Muslim; silsilah kenabian dari Ismail ke Kinana, kemudian Quraysh, kemudian Banu Hasyim, kemudian Nabi — teks paling terkenal tentang silsilah Nabi dan kehormatan keturunannya di kalangan Sunni."
