label:
  ar: "مسلم 1151e — الصوم لي وأنا أجزي به"
  en: "Muslim 1151e — Fasting is Mine, and I reward it"
  ur: "مسلم 1151e — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "كل عمل ابن آدم يضاعف الحسنة عشر أمثالها إلى سبعمائة ضعف قال الله عز وجل إلا الصوم فإنه لي وأنا أجزي به يدع شهوته وطعامه من أجلي للصائم فرحتان فرحة عند فطره وفرحة عند لقاء ربه . ولخلوف فيه أطيب …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1151e: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1151e: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1151e: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
