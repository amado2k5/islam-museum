text: "… إِنْكَى وهذا البيت في أرجوزة له. قال ابن إسحاق: وَجَلَسَ رَسُولُ اللّٰه وَلفي يوماً - فيما بلغني - مع الوليدِ بنِ المغيرةِ في المسجدِ؛ فجاء النَّضْرُ بن الحارث حَتَّى جَلَسَ معهم في المجلسِ، وفي المجلس غَيْرُ وَاحِدٍ مِنْ رِجَالِ قُرَيْشٍ، …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 166، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
