text: "… اللّه وأشهد أن محمدا عبده و رسوله، وأوصيكم بتقوى اللّٰه، فان أفضل ما توسل به العبد الإيمان والجهاد فى سعيله، وكلمة الإخلاص فانها الفطرة، وإقام الصلاة فانها الملة، وإيتاء الزكاة فانها من فريضتة. وصوم شهر رمضان فانه جنة من عذابه، …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 480، يذكر الصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 480, that mentions the prayer, the zakat, the fast and the pilgrimage named together; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 480 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 1, pág. 480, que menciona la oración, el zakat, el ayuno y la peregrinación en conjunto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi (tome 1, p. 480) mentionnant la prière, la zakat, le jeûne et le pèlerinage. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "Kandahlevi'nin \"Sahabelerin Hayatları\" adlı eserinin 1. cildinin 480. sayfasında namaz, zekât, oruç ve Hac birlikte anılmaktadır; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Kandahlawi, \"Kehidupan Para Sahabat,\" Jilid 1, halaman 480, menyebutkan salat, zakat, puasa, dan haji secara bersamaan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
