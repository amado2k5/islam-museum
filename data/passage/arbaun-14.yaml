label: { ar: "الأربعون 14 — لا يحل دم امرئ مسلم إلا بإحدى ثلاث", en: "Arba'un 14 — the sanctity of a Muslim's blood" }
text: "لا يحل دم امرئ مسلم إلا بإحدى ثلاث: الثيب الزاني، والنفس بالنفس، والتارك لدينه المفارق للجماعة"
summary:
  ar: "حديث عبد الله بن مسعود، وهو الحديث الرابع عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري (6878) ومسلم (1676) من رواية الأعمش عن عبد الله بن مرة عن مسروق عن ابن مسعود، وفي رواية لمسلم «التارك للإسلام» بدل «لدينه»؛ وللمعنى طرق عن عائشة عند مسلم، وعن عثمان عند الترمذي (2158) وقال حسن والنسائي وابن ماجه بلفظ «كفر بعد إسلامه، أو زنى بعد إحصانه، أو قتل نفساً بغير نفس»، وفي رواية للنسائي بيان الحكم في كل واحدة: الرجم والقود والقتل، وروي المعنى عن ابن عباس وأبي هريرة وأنس؛ يذكر ابن رجب أن هذه الخصال الثلاث هي حق الإسلام التي يستباح بها دم من شهد أن لا إله إلا الله وأن محمداً رسول الله، وأن القتل بكل واحدة منها متفق عليه بين المسلمين، وأجمع المسلمون على أن حد من زنى وهو ثيب الرجم حتى يموت، وقد رجم النبي ماعزاً والغامدية، وكان الرجم فيما نسخ لفظه من القرآن، واستنبطه ابن عباس من قوله تعالى في المائدة: «تخفون من الكتاب» فقال كان الرجم مما أخفوا (جامع العلوم والحكم ص 291–313)."
  en: "Abdullah ibn Masud's hadith, the fourteenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (6878) and Muslim (1676) through al-A'mash from Abdullah ibn Murra from Masruq from Ibn Masud, with a Muslim variant 'who abandons Islam' for 'who abandons his religion'; the same meaning comes from A'isha in Muslim and from Uthman in al-Tirmidhi (2158, graded hasan), al-Nasa'i and Ibn Majah in the wording 'disbelieves after his Islam, commits adultery after being chaste, or kills a soul without due cause', one of al-Nasa'i's versions spelling out the ruling in each case — stoning, retaliation and execution — and parallel reports exist from Ibn Abbas, Abu Hurayra and Anas; Ibn Rajab records that these three traits are the claim of Islam by which the blood of one who testifies that there is no god but God and that Muhammad is His messenger may lawfully be shed, that killing for each is agreed among Muslims, that Muslims agree the previously-married adulterer's hadd is stoning until death — the Prophet having stoned Ma'iz and the Ghamidiyya woman — that stoning stood in what was abrogated from the Quran's wording, and that Ibn Abbas derived it from al-Ma'ida's 'you used to hide of the scripture', saying stoning was among what they hid (Jami' al-Ulum wal-Hikam pp. 291–313)."
