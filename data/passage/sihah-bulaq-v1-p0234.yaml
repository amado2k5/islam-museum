text: |-
  ١٠٧
  ومنظورين سيار رجل عر ، النعرة مثل الهمزة ذباب ضخم أزرق العين أخضروله
  ابرة فى طرف ذنبه يلسع بهاذوات الحاذر خاصة قال ابنمقبل
  ترى النعرات الخضر حول لبانه * أحاد ومثنى أصعقتها صواهله
  وربماد خل فى أنف الحار فير كب رأسه ولا يرده شئ تقول منه نعر الحاربا لكسر
  يشعرنه رافهو حار نعر وأتان نعرة قال الشاءر
  فظل يرنح فى غيطل • كايستدير الجار النر
  وقال أبوعمر والنعر الذى لا يثبت فى مكان وأماقول العجاج والشدنيات يساقطن النعر
  فيريذيه الأجنة شبهه ابذلك الذباب بقال للمرأة ولكل أنى ماحات نعرة قط أى ماحات
  ملقوحاقال الاصمعى قولهم وانّ فى رأسه لنعرة أى كبرا وقال الاموى ان فى رأسه نعرة بالفتح
  أى أمرايهم به وحكى ذلك عنه أبو عبيد ونعر العرق يتعر بالفتح فيهما نعرا أى فارمنه الدم
  فهوءرق نعارونمور قال الشاعر
  صرت تعارة لوصادفت حوز دارع • غداوالعواصى من دم الجوف تنعر
  وقال الراجز ضرب دراك وطعان ينعر ويروى يتعروقال رؤية ومخ كل عاند نمور
  والنعرة دوت فى الخيدوم قال الراجز
  انى ورب الكغبة المستوره * والنعرات من أبى محذوره
  يعن أذانه وقد نع ر الرجسل ينعر نعسيرا يقال ما كانت فتمنة إلا تعر فيها فلان أى نهض فيها
  وان فلا نالنعار فى الفتزاذا كان سعاء فيها والناءوروا -د النواعير التى يستقى بهايديرها
  الماء ولها صوت ونعر فلان فى البلاد أى ذهب وفلان نعير الهم أى بعيده وأنعر الاراك أى
  أغروذلك اذاصار تره بعقدار النعرة ⁦(نغر)⁩ النغرة مثال الهسمزة واحدة النغر
  وهى طير كامصافيرحر المناقير. قال الراجز
  علق حوضى نهرمكب * اذا غقبلت غئلة يعب • وحرات شربهن غب
  وبتصغيره جاء الحديث يا أباعمي ما فعل النغير والجمع نغرانمثل صرد وصردان ونغر الرجسل
  بالكسرأى اغتاظ قال الاصمعى هو الذى يغلى جوفه من الغيظ وفى حديث على رضى اللّه عنه
  ان اهرأة جاءته فذكرت ان زوجها بأتى جاريتها فقال ان كنت صادقة رجناه وان كنت
  كاذية جلدناك فقالت ردّونى الى أهلى غيرى تفرة ونغرت القدر أيضاغلت ابن السكيت
  يقال ظل فلان يتفغر على فلان أى يتذحر عليه وأثغرت الشالغة فى أمغرت وشاة منغار
  مل ممغار نفر نفرت الداية تنفر وتنفر تقارا وتفورا يقال فى الداية نقار وهو
  اسم مثل الحران وتفر الحاج من منى نقراوتفر القوم فى الامورنفورا والنفير القوم الذين
  بتقسدّمون فيه يقال جاءت نفرة بنى فلان ونفيرهم أى بماعتهم الذين ينفرون فى الامر
  وأنشدأبو عرو
  -ان لها فوارسا وفرطا * ونفرة الحى ومرعى وسطا يحموزا من أن تسام الشططا
  والاتقار عن الشى والتنفير عنه والاستنفاركله بعف والاستنفار أيضا النفور وقال الشاعر
  ازجر جارلاانه مستنفر • في اثرأحرة عمدن لغرب
