label: { ar: "الموطأ 2570 — مالك: الرجل يعمد إلى امرأته فيفقأ عينها أو يكسر يدها يُقاد منه", en: "Muwatta 2570", es: "Muwatta 2570", fr: "Muwatta 2570", ur: "موطا 2570", tr: "El-Muvatta 2570 — Malik: Bir erkek kasten karısına saldırır, gözünü oyar veya elini kırarsa, idam edilir.", id: "Al-Muwatta 2570 — Malik: Jika seorang pria dengan sengaja menyerang istrinya dan mencungkil matanya atau mematahkan tangannya, maka dia akan dihukum mati." }
summary:
  ar: "قال مالك: وإذا عمد الرجل إلى امرأته ففقأ عينها، أو كسر يدها، أو قطع إصبعها، أو أشباه ذلك، متعمدا لذلك: فإنها تُقاد منه. وأما الرجل يضرب امرأته بالحبل أو بالسوط فيصيبها من ضربه ما لم يرد ولم يتعمد، فإنه يعقل ما أصاب منها على هذا الوجه، ولا يُقاد منه. {cite:muwatta-maruf-1997 p.448} {cite:muwatta-maruf-1997 p.449}"
  tr: "Malik şöyle dedi: Bir erkek, karısının gözünü oyarak, elini kırarak, parmağını keserek veya benzeri bir şey yaparak kasten ona zarar verirse, kadın misillemeye tabidir. Ancak, bir erkek karısına ip veya kırbaçla vurarak kasıtsız olarak zarar verirse, bu şekilde verilen zarardan dolayı tazminat ödemekle yükümlüdür, ancak misillemeye tabi değildir. {cite:muwatta-maruf-1997 s.448} {cite:muwatta-maruf-1997 s.449}"
  id: "Malik berkata: Jika seorang pria dengan sengaja melukai istrinya dengan mencungkil matanya, mematahkan tangannya, memotong jarinya, atau melakukan hal serupa, maka istrinya berhak mendapatkan pembalasan. Namun, jika seorang pria memukul istrinya dengan tali atau cambuk, yang menyebabkan luka padanya tanpa sengaja, ia wajib memberikan ganti rugi atas kerusakan yang disebabkan dengan cara ini, tetapi ia tidak berhak mendapatkan pembalasan. {cite:muwatta-maruf-1997 p.448} {cite:muwatta-maruf-1997 p.449}"
