label: { ar: "الموطأ 2570 — مالك: الرجل يعمد إلى امرأته فيفقأ عينها أو يكسر يدها يُقاد منه", en: "Muwatta 2570" }
summary:
  ar: "قال مالك: وإذا عمد الرجل إلى امرأته ففقأ عينها، أو كسر يدها، أو قطع إصبعها، أو أشباه ذلك، متعمدا لذلك: فإنها تُقاد منه. وأما الرجل يضرب امرأته بالحبل أو بالسوط فيصيبها من ضربه ما لم يرد ولم يتعمد، فإنه يعقل ما أصاب منها على هذا الوجه، ولا يُقاد منه. {cite:muwatta-maruf-1997 p.448} {cite:muwatta-maruf-1997 p.449}"
