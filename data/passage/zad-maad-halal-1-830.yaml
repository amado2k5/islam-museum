text: "… : هذا معارَض بمثله سواء معارضة القلب بأن يقال: تحريمُه يمنع ترتب أثره عليه كالنكاح، ويقال ثالثاً : ليس للظهار جهتانٍ: جهة حِلٌّ وجهة حرمة، بل كُلُّه حرام، فإنه منكر من القول وزور، فلا يُمْكِنُ أن ينقسِمَ إلى حلال جائز، …"
