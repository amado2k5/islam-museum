ref: "1.524"
label: { ar: "الموطأ 524 — أهل قباء في صلاة الصبح يستديرون إلى الكعبة", en: "Muwatta 524" }
text: "إن رسول الله قد أنزل عليه الليلة قرآن، وقد أمر أن يستقبل الكعبة فاستقبلوها"
summary:
  ar: "أول حديث في باب ما جاء في القبلة. يرويه يحيى عن مالك عن عبد الله بن دينار عن عبد الله بن عمر: بينما الناس بقباء في صلاة الصبح إذ جاءهم آت فقال إن النبي قد أُنزل عليه الليلة قرآن وقد أُمر أن يستقبل الكعبة فاستقبلوها، وكانت وجوههم إلى الشام فاستداروا إلى الكعبة. ويخرّجه المحقق عند البخاري (403، 4491، 4494، 7251) ومسلم (2/66) والنسائي وأحمد وابن حبان وابن خزيمة وأبي عوانة والشافعي ومحمد بن الحسن والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (17/45). {cite:muwatta-maruf-1997 p.271}"
