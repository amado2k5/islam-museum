label: { ar: "الموطأ 524 — أهل قباء في صلاة الصبح يستديرون إلى الكعبة", en: "Muwatta 524", es: "Muwatta 524", fr: "Muwatta 524", ur: "موطا 524", tr: "Al-Muwatta 524 — Kuba halkı sabah namazı sırasında Kâbe'ye yöneliyor.", id: "Al-Muwatta 524 — Penduduk Quba menghadap ke Ka'bah saat shalat subuh" }
text: "إن رسول الله قد أنزل عليه الليلة قرآن، وقد أمر أن يستقبل الكعبة فاستقبلوها"
summary:
  ar: "أول حديث في باب ما جاء في القبلة. يرويه يحيى عن مالك عن عبد الله بن دينار عن عبد الله بن عمر: بينما الناس بقباء في صلاة الصبح إذ جاءهم آت فقال إن النبي قد أُنزل عليه الليلة قرآن وقد أُمر أن يستقبل الكعبة فاستقبلوها، وكانت وجوههم إلى الشام فاستداروا إلى الكعبة. ويخرّجه المحقق عند البخاري ⁦(403، 4491، 4494، 7251)⁩ ومسلم (2/66) والنسائي وأحمد وابن حبان وابن خزيمة وأبي عوانة والشافعي ومحمد بن الحسن والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (17/45). {cite:muwatta-maruf-1997 p.271}"
  tr: "Namazın yönü (kıble) bölümündeki ilk hadis. Yahya, Malik'ten, o da Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den rivayet etmiştir: İnsanlar Kuba'da sabah namazını kılarken, birisi yanlarına gelip, \"Peygamber bu gece Kur'an'ı vahyetti ve Kâbe'ye yönelmesi emredildi, ona doğru dönün\" dedi. Yüzleri Suriye'ye dönüktü, bu yüzden Kâbe'ye döndüler. Hadis, Buhari (403, 4491, 4494, 7251), Müslim (2/66), Nesai, Ahmed, İbn Hibban, İbn Huzeyme, Ebu Evane, Şafiî, Muhammed ibn Hasan ve Beyhaki'nin hadis külliyatlarında, Malik'in sahabelerinin rivayet zincirleriyle bulunmaktadır. Yazar, Temhid'e (17/45) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.271}"
  id: "Hadits pertama dalam surah tentang arah kiblat. Diriwayatkan oleh Yahya dari Malik, dari Abdullah ibn Dinar, dari Abdullah ibn Umar: Ketika orang-orang sedang melaksanakan salat subuh di Quba, seseorang datang kepada mereka dan berkata, “Nabi telah menerima wahyu Al-Quran malam ini dan diperintahkan untuk menghadap Ka'bah, maka menghadaplah ke sana.” Wajah mereka tadinya menghadap ke Suriah, maka mereka menghadap ke Ka'bah. Hadits ini terdapat dalam kumpulan hadits al-Bukhari (403, 4491, 4494, 7251), Muslim (2/66), al-Nasa’i, Ahmad, Ibn Hibban, Ibn Khuzaymah, Abu Awanah, al-Shafi’i, Muhammad ibn al-Hasan, dan al-Bayhaqi, melalui sanad para sahabat Malik. Penulis merujuk pada al-Tamhid (17/45). {mengutip:muwatta-maruf-1997 hal.271}"
