text: "… أخرى، وكذا قال الإمام أحمد - - وغيره، والمعنى : أنَّه إذا كمَّل خصالَ الإيمان لبسه، فإذا نقصَ منها شيئاً نزعه، وكلُّ هذا إشارةٌ إلى الإيمان الكامل التَّام الذي لا يَنْقُصُ من واجباته شيء. والمقصودُ أنَّ من جملة خصال الإيمانِ …"
