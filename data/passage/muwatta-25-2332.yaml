label: { ar: "الموطأ 2332 — مالك: المكاتب لا يسافر ولا ينكح ولا يخرج إلا بإذن سيده", en: "Muwatta 2332", es: "Muwatta 2332", fr: "Muwatta 2332", ur: "موطا 2332", tr: "Al-Muwatta 2332 — Malik: Azat sözleşmesiyle kölelikten kurtulan bir kişi, efendisinin izni olmadan seyahat edemez, evlenemez veya evden ayrılamaz.", id: "Al-Muwatta 2332 — Malik: Seorang budak yang terikat perjanjian pembebasan tidak boleh bepergian, menikah, atau meninggalkan rumah kecuali dengan izin tuannya." }
summary:
  ar: "قال مالك في رجل يشترط على مكاتبه ألا يسافر ولا ينكح ولا يخرج من أرضه إلا بإذنه، وأنه إن فعل شيئا من ذلك بغير إذنه فمحو كتابته بيده: ليس محو الكتابة بيد السيد، وإنما يرفع السيد ذلك إلى السلطان. وليس للمكاتب أن ينكح أو يسافر أو يخرج من أرض سيده إلا بإذنه، اشترط ذلك أو لم يشترط، لأن المكاتب قد ينكح فيصدق صداقا يجحف بماله فيعجز، أو يسافر فتحل نجومه وهو غائب. {cite:muwatta-maruf-1997 p.360} {cite:muwatta-maruf-1997 p.361}"
  tr: "Malik, bir kölenin özgür bırakılması sözleşmesiyle, kölesinin izni olmadan seyahat edemeyeceğini, evlenemeyeceğini veya topraklarından ayrılamayacağını ve kölenin bu şeylerden herhangi birini izni olmadan yapması durumunda efendinin sözleşmeyi kendisinin iptal etmesi gerektiğini şart koşan bir adam hakkında şunları söyledi: Sözleşmenin iptali efendinin yetkisinde değildir; aksine, efendi konuyu yöneticiye bildirmelidir. Özgür bırakılması sözleşmesiyle köle, ister şart koşulmuş olsun ister olmasın, efendisinin izni olmadan evlenemez, seyahat edemez veya topraklarından ayrılamaz; çünkü özgür bırakılması sözleşmesiyle köle evlenebilir ve servetini zorlayacak bir çeyiz alabilir, bu da onu ödeme yapamaz hale getirebilir veya seyahat edebilir ve yokluğunda ödeme taksitleri vadesi gelebilir. {cite:muwatta-maruf-1997 s.360} {cite:muwatta-maruf-1997 s.361}"
  id: "Malik berkata mengenai seorang pria yang menetapkan bahwa budaknya yang terikat kontrak pembebasan tidak boleh bepergian, menikah, atau meninggalkan tanahnya tanpa izinnya, dan bahwa jika budak tersebut melakukan salah satu dari hal-hal tersebut tanpa izinnya, maka tuannya harus membatalkan kontrak tersebut sendiri: Pembatalan kontrak bukanlah wewenang tuannya; melainkan, tuannya harus menyerahkan masalah tersebut kepada penguasa. Budak yang terikat kontrak pembebasan tidak boleh menikah, bepergian, atau meninggalkan tanah tuannya tanpa izinnya, baik hal ini telah ditetapkan atau tidak, karena budak yang terikat kontrak pembebasan mungkin menikah dan menerima mas kawin yang membebani kekayaannya, sehingga ia tidak mampu membayar, atau ia mungkin bepergian dan cicilan pembayarannya jatuh tempo saat ia tidak ada. {cite:muwatta-maruf-1997 p.360} {cite:muwatta-maruf-1997 p.361}"
