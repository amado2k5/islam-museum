label: { ar: "الموطأ 2332 — مالك: المكاتب لا يسافر ولا ينكح ولا يخرج إلا بإذن سيده", en: "Muwatta 2332" }
summary:
  ar: "قال مالك في رجل يشترط على مكاتبه ألا يسافر ولا ينكح ولا يخرج من أرضه إلا بإذنه، وأنه إن فعل شيئا من ذلك بغير إذنه فمحو كتابته بيده: ليس محو الكتابة بيد السيد، وإنما يرفع السيد ذلك إلى السلطان. وليس للمكاتب أن ينكح أو يسافر أو يخرج من أرض سيده إلا بإذنه، اشترط ذلك أو لم يشترط، لأن المكاتب قد ينكح فيصدق صداقا يجحف بماله فيعجز، أو يسافر فتحل نجومه وهو غائب. {cite:muwatta-maruf-1997 p.360} {cite:muwatta-maruf-1997 p.361}"
