  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 8, page 272, mentionne les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
