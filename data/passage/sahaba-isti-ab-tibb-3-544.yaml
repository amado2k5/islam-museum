text: "… أَرْضِ الحبشةِ، ثم هاجر الهجرة الثَّانية إِلى المدينة، ولم يشهد بدراً لتخلفه على تمريض زوجته رقية، كأنت عليلة، فأمره رسول اللّٰه لَل يهِ بالتخلف عليها، هكذا ذكره ابن إسحاق. وقال غيره : بل كأن مريضاً به الجُدَري، فقال له رسول …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 544، يذكر الرقية، والمرض والمريض، وأسماء الأمراض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 544, that mentions ruqya recited over the sick, illness and the sick, named diseases; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 544 کا اقتباس جس میں رقیہ، بیماری اور بیمار، بیماریوں کے نام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 3, pág. 544, que menciona la ruqya recitada sobre los enfermos, la enfermedad y los enfermos, enfermedades nombradas; del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 3, p. 544, qui mentionne la ruqya récitée sur les malades, la maladie et les malades, les maladies nommées; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 3. cildinin 544. sayfasından, büyülerden, hastalıklardan ve hastalardan, ayrıca hastalıkların isimlerinden bahseden bir bölüm; makineyle okunabilir resimli versiyondan alınmıştır ve kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 3, hlm. 544, yang menyebutkan mantra, penyakit dan orang sakit, serta nama-nama penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
