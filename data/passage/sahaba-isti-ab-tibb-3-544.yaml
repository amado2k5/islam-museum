text: "… أَرْضِ الحبشةِ، ثم هاجر الهجرة الثَّانية إِلى المدينة، ولم يشهد بدراً لتخلفه على تمريض زوجته رقية، كأنت عليلة، فأمره رسول اللّٰه لَل يهِ بالتخلف عليها، هكذا ذكره ابن إسحاق. وقال غيره : بل كأن مريضاً به الجُدَري، فقال له رسول …"
