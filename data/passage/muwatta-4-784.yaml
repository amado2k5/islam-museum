label: { ar: "الموطأ 784 — بلاغ: رُئي الهلال في زمان عثمان بعشيّ فلم يفطر عثمان حتى أمسى وغابت الشمس", en: "Muwatta 784", es: "Muwatta 784", fr: "Muwatta 784", ur: "موطا 784", tr: "El-Muvatta 784 — Rapor: Osman zamanında hilal akşam vakti görüldü, fakat Osman orucunu akşama kadar, güneş batana kadar açmadı.", id: "Al-Muwatta 784 — Laporan: Bulan sabit terlihat pada waktu Utsman, tetapi Utsman tidak berbuka puasa sampai sore dan matahari terbenam." }
text: "رُئي الهلال في زمان عثمان بن عفان بعشيّ، فلم يفطر عثمان حتى أمسى وغابت الشمس"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن الهلال رُئي في زمان عثمان بن عفان بعشيّ، فلم يفطر عثمان حتى أمسى وغابت الشمس. ويذكر المحقق أنه رواه عن مالك أبو مصعب (765). {cite:muwatta-maruf-1997 p.387}"
  tr: "Malik, Osman ibn Affan döneminde hilalin akşam vakti görüldüğünü duyduğunu ve bu nedenle Osman'ın orucunu akşam ve gün batımına kadar açmadığını bildirmiştir. Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (765) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.387}"
  id: "Malik melaporkan bahwa ia mendengar bulan sabit terlihat pada waktu senja pada masa pemerintahan Utsman bin Affan, sehingga Utsman tidak berbuka puasa hingga senja dan matahari terbenam. Peneliti menyebutkan bahwa Abu Mus'ab (765) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.387}"
