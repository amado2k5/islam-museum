text: "… اللّٰه ل إنك لخير أرض الله، وأحب أرض اللّٰه إلى الله، وإني والله لم لو أُخرج منك ما خرجتُ، وإنها لم تِحَلّ لأحد كان قبلي. ولا تحلّ لأحد بعدي، وإنما أُحِلّت لي ساعة من النهار، وهي ساعتي هذه، حرام لا …"
