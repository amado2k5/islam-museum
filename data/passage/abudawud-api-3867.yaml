label: { ar: "سنن أبي داود 3867 — اللدود والسعوط", en: "Sunan Abi Dawud 3867 — medicine given by the mouth-side or the nose", ur: "سنن ابی داؤد 3867 — لدود اور سعوط", es: "Sunan Abi Dawud 3867 — medicamento administrado por vía oral o nasal", fr: "Sunan Abi Dawud 3867 — Médicaments administrés par voie orale ou nasale" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَحْمَدُ بْنُ إِسْحَاقَ، حَدَّثَنَا وُهَيْبٌ، عَنْ عَبْدِ اللَّهِ بْنِ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ اسْتَعَطَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3867، يذكر اللدود والسعوط. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3867 (Medicine (Kitab Al-Tibb)), that mentions medicine given by the mouth-side or the nose. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3867، جس میں لدود اور سعوط کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3867 (Medicina (Kitab Al-Tibb)), menciona la administración de medicamentos por vía oral o nasal. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3867 (Médecine (Kitab Al-Tibb)), mentionne l'administration de médicaments par voie orale ou nasale. Le Répertoire des textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
