label: { ar: "سنن أبي داود 3817 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 3817 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 3817 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 3817 — lo que fue lícito; lo que no es lícito", fr: "Sunan Abi Dawud 3817 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan Abi Davud 3817 — Neler caizdir, neler caiz değildir", id: "Sunan Abi Dawud 3817 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… عُقْبَةُ بْنُ وَهْبِ بْنِ عُقْبَةَ الْعَامِرِيُّ، قَالَ سَمِعْتُ أَبِي يُحَدِّثُ، عَنِ الْفُجَيْعِ الْعَامِرِيِّ، أَنَّهُ أَتَى رَسُولَ اللَّهِ فَقَالَ مَا يَحِلُّ لَنَا مِنَ الْمَيْتَةِ قَالَ \" مَا طَعَامُكُمْ \". قُلْنَا نَغْتَبِقُ وَنَصْطَبِحُ. قَالَ أَبُو نُعَيْمٍ فَسَّرَهُ لِي عُقْبَةُ قَدَحٌ غُدْوَةً وَقَدَحٌ عَشِيَّةً. قَالَ \" ذَاكَ - وَأَبِي - الْجُوعُ \". فَأَحَلَّ لَهُمُ الْمَيْتَةَ عَلَى هَذِهِ الْحَالِ. …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3817، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3817 (Foods (Kitab Al-At'imah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3817، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3817 (Alimentos (Kitab Al-At'imah)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3817 (Les Aliments), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sünen Ebu Davud'da yer alan 3817 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3817, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
