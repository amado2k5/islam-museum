label: { ar: "سنن أبي داود 3817 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 3817 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 3817 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… عُقْبَةُ بْنُ وَهْبِ بْنِ عُقْبَةَ الْعَامِرِيُّ، قَالَ سَمِعْتُ أَبِي يُحَدِّثُ، عَنِ الْفُجَيْعِ الْعَامِرِيِّ، أَنَّهُ أَتَى رَسُولَ اللَّهِ فَقَالَ مَا يَحِلُّ لَنَا مِنَ الْمَيْتَةِ قَالَ \" مَا طَعَامُكُمْ \". قُلْنَا نَغْتَبِقُ وَنَصْطَبِحُ. قَالَ أَبُو نُعَيْمٍ فَسَّرَهُ لِي عُقْبَةُ قَدَحٌ غُدْوَةً وَقَدَحٌ عَشِيَّةً. قَالَ \" ذَاكَ - وَأَبِي - الْجُوعُ \". فَأَحَلَّ لَهُمُ الْمَيْتَةَ عَلَى هَذِهِ الْحَالِ. …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3817، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3817 (Foods (Kitab Al-At'imah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3817، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
