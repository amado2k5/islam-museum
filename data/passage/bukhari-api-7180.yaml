label: { ar: "صحيح البخاري 7180 — الأب والأبوة", en: "Sahih al-Bukhari 7180 — the father and fatherhood", ur: "صحیح بخاری 7180 — باپ اور والدیت", es: "Sahih al-Bukhari 7180 — El padre y la paternidad", fr: "Sahih al-Bukhari 7180 — Le père et la paternité" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ أَنَّ هِنْدَ، قَالَتْ لِلنَّبِيِّ إِنَّ أَبَا سُفْيَانَ رَجُلٌ شَحِيحٌ، فَأَحْتَاجُ أَنْ آخُذَ مِنْ مَالِهِ. قَالَ \" خُذِي مَا يَكْفِيكِ وَوَلَدَكِ بِالْمَعْرُوفِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7180، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7180 (Judgments (Ahkaam)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7180، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7180 (Juicios (Ahkaam)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7180 (Jugements), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
