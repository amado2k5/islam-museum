label: { ar: "الموطأ 1908 — يحيى عن مالك عن نافع عن ابن عمر: نهى رسول الله عن بيع حبل الحبلة، وهو بيع كان أهل الجاهلية يتبايعونه، أن يبتاع الرجل الجزور إلى أن تنتج الناقة ثم تنتج التي في بطنها", en: "Muwatta 1908", es: "Muwatta 1908", fr: "Muwatta 1908", ur: "موطا 1908", tr: "El-Muvatta 1908 — Yahya, Malik'ten, o da Nafi'den, o da İbn Ömer'den rivayetle: Allah Resulü, doğmamış çocuğun yavrusunun satılmasını yasaklamıştır. Bu, İslam öncesi dönemde insanların yaptığı bir satıştı; bir erkek, dişi deve doğum yapana kadar deve satın alırdı ve sonra da karnındaki yavru doğururdu.", id: "Al-Muwatta 1908 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Ibn Umar: Rasulullah SAW melarang penjualan anak yang belum lahir, yaitu praktik penjualan yang dilakukan oleh orang-orang di zaman pra-Islam, di mana seorang pria membeli seekor unta hingga unta betina tersebut melahirkan, dan kemudian anak yang ada di dalam kandungannya akan melahirkan." }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن رسول الله نهى عن بيع حبل الحبلة، وكان بيعا يتبايعه أهل الجاهلية، كان الرجل يبتاع الجزور إلى أن تنتج الناقة، ثم تنتج التي في بطنها. {cite:muwatta-maruf-1997 p.182}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Allah Resulü'nün doğmamış hayvanın yavrusunun satılmasını yasakladığını nakletmiştir. Bu, İslam öncesi Arabistan halkı arasında yaygın bir uygulamaydı; bir adam bir deve satın alır ve dişi devenin doğum yapmasını, ardından da karnındaki yavrunun da doğmasını beklerdi. {cite:muwatta-maruf-1997 s.182}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi, dari Abdullah ibn Umar, bahwa Rasulullah SAW melarang penjualan anak hewan yang belum lahir. Ini adalah praktik yang umum di kalangan masyarakat Arab pra-Islam; seorang pria akan membeli unta dan menunggu sampai unta betina melahirkan, dan kemudian sampai anak yang ada di dalam kandungannya juga melahirkan. {cite:muwatta-maruf-1997 p.182}"
