label: { ar: "الموطأ 2076 — مالك: بلغه أن عبد الرحمن بن عوف تكارى أرضا فلم تزل في يديه بكراء حتى مات، فأمر ورثته بقضاء شيء كان عليه من كرائها، ذهب أو ورق", en: "Muwatta 2076", es: "Muwatta 2076", fr: "Muwatta 2076", ur: "موطا 2076", tr: "El-Muvatta 2076 — Malik: Abdurrahman ibn Avf'ın bir arazi kiraladığı ve bu arazinin, vefatına kadar kira bedeliyle birlikte kendisinde kaldığı kendisine bildirildi. Bunun üzerine, mirasçılarına, altın veya gümüş olsun, kendisine ait olan tüm kira bedelini ödemelerini emretti.", id: "Al-Muwatta 2076 — Malik: Dia diberitahu bahwa Abd al-Rahman ibn Awf telah menyewa sebidang tanah, dan tanah itu tetap berada dalam kepemilikannya beserta uang sewa hingga ia meninggal. Maka ia memerintahkan ahli warisnya untuk melunasi uang sewa yang terutang, baik dengan emas maupun perak." }
summary:
  ar: "قال مالك: وبلغه أن عبد الرحمن بن عوف تكارى أرضا، فلم تزل في يديه بكراء حتى مات. قال ابنه: فما كنت أراها إلا لنا، من طول ما مكثت في يديه، حتى ذكرها لنا عند موته، فأمرنا بقضاء شيء كان عليه من كرائها، ذهب أو ورق. {cite:muwatta-maruf-1997 p.250}"
  tr: "Malik şöyle dedi: Abdülrahman ibn Avf'ın bir arazi kiraladığını ve ölümüne kadar bu arazinin kira olarak elinde kaldığını duydum. Oğlu dedi ki: Uzun süre onun elinde kaldığı için, bize ait olduğunu sanıyordum. Ölüm döşeğinde bize bundan bahsetti ve bize altın veya gümüş olarak borcunun bir kısmını ödememizi emretti. {cite:muwatta-maruf-1997 s.250}"
  id: "Malik berkata: Ia mendengar bahwa Abd al-Rahman ibn Awf telah menyewa sebidang tanah, dan tanah itu tetap berada dalam penguasaannya sebagai sewa hingga ia meninggal. Putranya berkata: Saya mengira tanah itu milik kami, karena lamanya tanah itu berada dalam penguasaannya, hingga ia menyebutkannya kepada kami di ranjang kematiannya, dan ia memerintahkan kami untuk membayar sebagian dari uang sewa yang ia hutangkan, dalam emas atau perak. {cite:muwatta-maruf-1997 p.250}"
