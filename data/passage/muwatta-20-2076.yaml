summary:
  ar: "قال مالك: وبلغه أن عبد الرحمن بن عوف تكارى أرضا، فلم تزل في يديه بكراء حتى مات. قال ابنه: فما كنت أراها إلا لنا، من طول ما مكثت في يديه، حتى ذكرها لنا عند موته، فأمرنا بقضاء شيء كان عليه من كرائها، ذهب أو ورق. {cite:muwatta-maruf-1997 p.250}"
