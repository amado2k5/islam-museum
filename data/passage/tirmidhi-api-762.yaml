label: { ar: "جامع الترمذي 762 — مضاعفة الحسنة بعشر أمثالها", en: "Jami' al-Tirmidhi 762 — the good deed multiplied tenfold and beyond", ur: "جامع ترمذی 762 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "… \" مَنْ صَامَ مِنْ كُلِّ شَهْرٍ ثَلاَثَةَ أَيَّامٍ فَذَلِكَ صِيَامُ الدَّهْرِ \". فَأَنْزَلَ اللَّهُ عَزَّ وَجَلَّ تَصْدِيقَ ذَلِكَ فِي كِتَابِهِ : (مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا ). الْيَوْمُ بِعَشَرَةِ أَيَّامٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَقَدْ رَوَى شُعْبَةُ هَذَا الْحَدِيثَ عَنْ أَبِي شِمْرٍ وَأَبِي التَّيَّاحِ عَنْ أَبِي عُثْمَانَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 762، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 762 (The Book on Fasting), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 762، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
