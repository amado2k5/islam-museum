text: "في المدح والهجو والمجون والفُكاهات والمُلَحِ والخمر والمُعاقرة والنّدمان والقِيان... الخ جاريةٌ من الأنصار في حِجْري فزَفَفْتُها؛ فدخل رسول اللّٰه وَلِيظِيِ ولم يسمع غناء، فقال: يا عائشةُ، ألَا تبعثين معها مَنْ يُغَنِّي فإن هذا الحيَّ من الأنصار يحبّون الغناء. وعن …"
