text: "… كلَّ ما لا بأس به، وإنّما تركوا ما خشوًا أن يُفضي بهم إلى مكروه أو ممنوع. - ومنها: أنَّه قد يَترك المباحَ لأنَّه لم تحضره نيَّةٌ في تناوله؛ إمَّا للعَون به على طاعة الله، وإما لأنه يُحبُّ أنْ يكون عمله …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 1، ص 190، يرد فيه ذكر طاعة الله ورسوله، والمكروه، والمباح، وما لا بأس به، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 1, p. 190, whose wording mentions obedience to God and His Messenger, the disliked (makruh), the permitted (mubah), what is said to be no harm, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 1، ص 190 کا اقتباس جس میں اللہ اور اس کے رسول کی اطاعت، مکروہ، مباح، جس میں کوئی مضائقہ نہیں، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muwafaqat de al-Shatibi, volume numérisé 1, p. 190, dont le texte mentionne l'obéissance à Dieu et à Son Messager, le réprouvé (makruh), le permis (mubah), ce qui est dit sans inconvénient, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muwafaqat de al-Shatibi, volumen digitalizado 1, p. 190, cuyo texto menciona la obediencia a Dios y a Su Mensajero, lo reprobado (makruh), lo permitido (mubah), lo que se dice que no tiene inconveniente, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şatibi'nin El-Muvafakat adlı eserinin 1. cildinin 190. sayfasından, Allah'a ve Resulüne itaat, mekruh haller, helal haller, kabul edilebilir olanlar ve itaatin kendisi konularını ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh haller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 1, halaman 190, membahas ketaatan kepada Allah dan Rasul-Nya, perbuatan yang tidak disukai, perbuatan yang diperbolehkan, apa yang dapat diterima, dan ketaatan itu sendiri. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam perbuatan wajib, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
