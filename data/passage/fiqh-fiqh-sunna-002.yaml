text: "شاء عذبهم ، وإن شاء غفر لهم » رواه الترمذي وقال : حسن . استحباب كتابة الصلاة والسلام عليه كلما ذكر أسمه : استحب العلماء الصلاة والسلام عليه - صلوات الله وسلامه عليه - كلما كتب أسمه ، إلا أنه"
