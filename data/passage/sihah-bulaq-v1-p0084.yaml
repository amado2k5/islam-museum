text: |-
  ⁦(علط)⁩
  oo٧
  والجمع عبط قال ذؤيب فتخالسانفسيهما بنوافذ • كنوافذ العبط التى لا ترقع
  يعنى كشق الجيوب واطراف الاكمام والذيول لانها لا ترقع بعد العبط ومات فلان عيطة
  أى صحير اشابا قال أمية بن ألى الصلت
  من لم يت عبطة يمت هرما • للموت كأس فالمر ذائّقهنا
  يقال عبطته الداهيسة أى نالته وعبطت الناقة واعتبطتها اذا ذيجتها وليس بهاعلة فهى
  عبيطة ولحمها عبيط وعبط فلان اذا ألقى نفسه فى الحرب غير مكره والعبيط من الدم الخالص
  الطرى والعبط الكذب الصراح من غيرءذريقال اعتبط فلان على الكذب ⁦(عثلط)⁩.
  قال الاصمعى لبن عشلط وعجلط وعكلط أى تخين خاثر وأبو عمرومثله وأنشد
  كيف رأيت كشأتى عجلطه * وكنأة الخامط من عكلطة
  وهو قصر عشالط وعمالطوعكالط قال الراجز
  ولوبغى أعطاه تيساقافظا ولسقاه ابناعجالطا
  ذط العذيطة مصدر العذيوط وهوالذى يحدث عند الجهاع قالت امرأة
  انى بليت بعذيوط به بخر * يكاديقتل من ناجاهان كشرا والمرأة عذيوطة
  ⁦( عرفط)⁩ العرفط شجر من العضاه ينضح المغفور منه وبرمسه بيضاء مدحرجة
  عرقط العر يقطسة دويبة وهى العريقطان يقال للاتباع ونحوه-م ( ضرط .
  العضار بط الواحد عضرط وعضر وط وقولهم فلان أهلب العضرط بالفتح قال أبو عبيد
  هوالحجان مابين السه والمذا كير ⁦(عضرفط )⁩ العضر فوط العظاءة الذكر وتصغيره عضيرف
  وعضيريف(عطط عط الئوب يعطه عطا أى شقمط ولا وعطط م شدّد لاكثرة قال المتخذل
  الهذلى بضرب فى الجماجم ذى فصول • وطعن مثل تعطيط الرهاط
  والانعطاط الانشقاق قال أبو النجم
  كأن تحت درعها المنعط والعطعطة
  حسكاية صوت يقال عطعط القوم اذا قالوا عيط عيط قال الشيبانى المسطوط المغلوب
  والعطاط الاسد والشجاع وبنشد للمتنخل
  وذلك يقبل الفتيان شفعا • ويسلب حلة الليث العطاط
  عقط عفطت العنز تعقط عقطاحبقت والعفط والعفيط نثير الضأن تتسثر بانوفها
  (كما بنترالحماروهى العفطة أيضا وقولهم ماله عافطة ولانافطة قال أبو الدقيس العاقطة
  النعجة والنافطة العنزلانها تنفط بأنفها قال وه_ذاكة ولهم ماله ثاغية ولاراغية أى
  لاشاة تنغو ولاناقة ترغو. وعفط الراعى بغنمه اذا زجرها بصوت يشبه عفطها والعافطة
  والعفاطة الامة الراعية ⁦(علط )⁩ العلاطان صفقا العنق من الجانبين والعلاطسمة
  فى العنق بالعرض عن أب زيدقال والطاع بالطول يقال منه علط بعيره يعلطه علطا
  وعلطه أيضابشراذاذ كره بوه قال الهذلى
  فلا والله نادى الحى يف ه ابلمساءة والعلاط
  وعلط ابله شدد للاكثرة والعلاط أيضاحبل فى عنق البعير وقد علطه تعلي ماا أى نزع من عنقه
  العلاط قال الاصعى ناقة علط اى بلاخطام وقال الاحمر بلاسمة قال الشاعر
