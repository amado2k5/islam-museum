text: "… المذينة قال ابن هشام : واستعمل علي المدينة عبدَ اللّٰه بن عبد اللّه بن أَبَى بن سَاول الأنصارى. رجوع أبى سنفيات فى رباله..... قال ابن إسحاق : فأقام عليه ثمانى لمال ينتفار أباسُيفان، وخرج أبو سفيان فى أهل مكَّة حتى …"
