summary:
  ar: "القسم 10 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الكسوف»، ويضم فيها النصوص من 2089 إلى 2122 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 10 of Sahih Muslim (The Book of Prayer - Eclipses) in the division of the open hadith dataset the museum took its reports from: reports 2089 to 2122 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 10، عنوان «کتاب الکسوف»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2089 تا 2122۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 10 de Sahih Muslim (El Libro de la Oración - Eclipses) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2089 al 2122 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre de la prière – Éclipses), volume 10, dans la base de données ouverte: les hadiths 2089 à 2122. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
