text: "… الهدى والأمن، والفلاحُ والعزَّة، والكفاية والنصرة، والوِلاية والتأييدِ، وطيبُ العيش في الدنيا والآخرة، ولمخالفيه الذَّلةُ والصَّغار، والخوفُ والضلال، والخِذلان والشقاءُ في الدنيا والآخرة. وقد أقسم علم بأن لا يُؤْمِن أَحَدُكُم حَتَّى يَكُونَ هو أَحَبَّ إِلَيْهِ مِنْ وَلَدِهِ وَوَالِدِه وَالنَّاسِ أَجْمَعِينَ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 11، يذكر ما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 11, that mentions what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 11 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Zad al-Ma'ad de Ibn al-Qayyim, volumen 1, pág. 11, que menciona aquello sin lo cual la fe no está completa; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Zad al-Ma'ad d'Ibn al-Qayyim (tome 1, p. 11) mentionnant ce qui est indispensable à une foi complète; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 1. cildinin 11. sayfasından, tam bir iman için gerekli olan unsurlardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 1, halaman 11, yang menyebutkan hal-hal penting untuk keimanan yang sempurna; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
