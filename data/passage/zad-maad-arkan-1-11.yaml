text: "… الهدى والأمن، والفلاحُ والعزَّة، والكفاية والنصرة، والوِلاية والتأييدِ، وطيبُ العيش في الدنيا والآخرة، ولمخالفيه الذَّلةُ والصَّغار، والخوفُ والضلال، والخِذلان والشقاءُ في الدنيا والآخرة. وقد أقسم علم بأن لا يُؤْمِن أَحَدُكُم حَتَّى يَكُونَ هو أَحَبَّ إِلَيْهِ مِنْ وَلَدِهِ وَوَالِدِه وَالنَّاسِ أَجْمَعِينَ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 11، يذكر ما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 11, that mentions what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
