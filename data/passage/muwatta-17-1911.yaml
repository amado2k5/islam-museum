label: { ar: "الموطأ 1911 — مالك: إنما كره ذلك لأن البائع ينتفع بالثمن، ولا يدرى هل توجد تلك السلعة على ما رآها المبتاع أم لا، ولا بأس به إذا كان مضمونا موصوفا", en: "Muwatta 1911", es: "Muwatta 1911", fr: "Muwatta 1911", ur: "موطا 1911", tr: "El-Muvatta 1911 — Malik: Bunu hoş karşılamadı çünkü satıcı fiyattan fayda sağlıyor ve malın alıcının gördüğü gibi olup olmadığını bilmiyor; oysa garantili ve açıklanmış olmasında bir sakınca yok.", id: "Al-Muwatta 1911 — Malik: Dia tidak menyukai hal itu karena penjual mendapat keuntungan dari harga, dan dia tidak tahu apakah barang tersebut benar-benar ada seperti yang dilihat pembeli atau tidak, dan tidak ada yang salah dengan itu jika barang tersebut terjamin dan dijelaskan." }
summary:
  ar: "قال مالك: وإنما كره ذلك، لأن البائع ينتفع بالثمن، ولا يدرى هل توجد تلك السلعة على ما رآها المبتاع أم لا. فلذلك كره ذلك. ولا بأس به إذا كان مضمونا موصوفا. {cite:muwatta-maruf-1997 p.183}"
  tr: "Malik şöyle dedi: Bu durum hoş karşılanmıyor çünkü satıcı fiyattan fayda sağlıyor ve malların alıcının gördüğü gibi olup olmayacağı bilinmiyor. Bu nedenle bu durum hoş karşılanmıyor. Ancak, garantili ve açıklanmış olması durumunda bir sakınca yok. {cite:muwatta-maruf-1997 s.183}"
  id: "Malik berkata: Hal ini tidak disukai karena penjual mendapat keuntungan dari harga tersebut, dan tidak diketahui apakah barang yang diterima akan sesuai dengan yang dilihat pembeli atau tidak. Oleh karena itu, hal ini tidak disukai. Namun, tidak ada yang salah dengan hal itu jika dijamin dan dijelaskan. {cite:muwatta-maruf-1997 p.183}"
