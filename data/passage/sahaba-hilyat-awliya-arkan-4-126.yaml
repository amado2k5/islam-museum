text: "- وزائدة بن قدامة وأبو عوانة وأبو بكر بن عياش. حدثنا مخلد بن جمفر ثنا جعفر الفريابي قال ثنا منجاب بن الحارث قال ثنا على بن مسهر عن الاهمش عن خيثمة عن النعمان. قال قال رسول اللّٰه : المؤمنون كرجل …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 126، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 126, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 4، ص 126 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 4, pág. 126, que menciona la semejanza del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
