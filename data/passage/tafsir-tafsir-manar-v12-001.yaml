text: "ولا تركنوا إلى الذين ظلموا) ولا تميلوا، قال الشيخ رحمه الله هذا خطاب لاتباع الكفرة أي لا تركنوا إلى القادة والكبراء في ظلمهم وفيما يدعونكم إليه (فتمسكم النار) وقيل الركون إليهم الرضا بكفرهم، وقال قتادة: ولا تلحقوا. بالمشركين، وعن الموفق"
