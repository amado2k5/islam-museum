label: { ar: "الموطأ 115 — أبو موسى يسأل عائشة عن اختلاف الصحابة في الغسل", en: "Muwatta 115" }
text: "ما كنت سائلاً عنه أمك فسلني عنه"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب، في باب واجب الغسل إذا التقى الختانان: أتى أبو موسى الأشعري عائشة وقال إن اختلاف أصحاب النبي في أمر شقّ عليه وإنه يستعظم أن يسألها عنه، فقالت له: ما كنت سائلاً عنه أمك فسلني عنه. فسأل عن الرجل يصيب أهله ثم يكسل ولا ينزل، فأجابت بأن الغسل يجب إذا جاوز الختان الختان. فقال أبو موسى: لا أسأل عن هذا أحداً بعدك أبداً. ويذكر المحقق أن الحديث روي مرفوعاً من طريق أبي بردة عن أبي موسى عند مسلم (1/186) وابن خزيمة (227) وأبي عوانة والبيهقي، ومن طريق سعيد بن المسيب عن أبي موسى عند عبد الرزاق والطحاوي. {cite:muwatta-maruf-1997 p.91}"
