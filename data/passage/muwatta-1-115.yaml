label: { ar: "الموطأ 115 — أبو موسى يسأل عائشة عن اختلاف الصحابة في الغسل", en: "Muwatta 115", es: "Muwatta 115", fr: "Muwatta 115", ur: "موطا 115", tr: "El-Muvatta 115 — Ebu Musa, Aişe'ye Sahabeler arasında abdest konusunda görülen görüş ayrılıklarını soruyor.", id: "Al-Muwatta 115 — Abu Musa bertanya kepada Aisyah tentang perbedaan pendapat di antara para Sahabat mengenai wudhu." }
text: "ما كنت سائلاً عنه أمك فسلني عنه"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب، في باب واجب الغسل إذا التقى الختانان: أتى أبو موسى الأشعري عائشة وقال إن اختلاف أصحاب النبي في أمر شقّ عليه وإنه يستعظم أن يسألها عنه، فقالت له: ما كنت سائلاً عنه أمك فسلني عنه. فسأل عن الرجل يصيب أهله ثم يكسل ولا ينزل، فأجابت بأن الغسل يجب إذا جاوز الختان الختان. فقال أبو موسى: لا أسأل عن هذا أحداً بعدك أبداً. ويذكر المحقق أن الحديث روي مرفوعاً من طريق أبي بردة عن أبي موسى عند مسلم (1/186) وابن خزيمة (227) وأبي عوانة والبيهقي، ومن طريق سعيد بن المسيب عن أبي موسى عند عبد الرزاق والطحاوي. {cite:muwatta-maruf-1997 p.91}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, dalam surah tentang kewajiban ghusl (mandi ritual) ketika kedua bagian yang disunat bertemu: Abu Musa al-Ash'ari datang kepada Aisyah dan berkata bahwa perselisihan di antara para Sahabat Nabi (shalawat dan salam kepadanya) mengenai suatu masalah membuatnya gelisah, dan ia merasa terlalu malu untuk bertanya kepadanya tentang hal itu. Aisyah berkata kepadanya, \"Kamu tidak akan bertanya kepada ibumu tentang hal itu, jadi tanyakanlah kepadaku.\" Dia bertanya tentang seorang pria yang berhubungan intim dengan istrinya tetapi kemudian menjadi lesu dan tidak berejakulasi. Aisyah menjawab bahwa ghusl wajib dilakukan ketika kedua bagian yang disunat bertemu. Abu Musa berkata, \"Aku tidak akan pernah bertanya kepada siapa pun tentang hal ini setelahmu.\" Peneliti menyebutkan bahwa hadits tersebut diriwayatkan dengan sanad yang dapat ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) melalui Abu Burda atas otoritas Abu Musa dalam Muslim (1/186), Ibn Khuzayma (227), Abu 'Awana, dan al-Bayhaqi, dan melalui Sa'id ibn al-Musayyab atas otoritas Abu Musa dalam 'Abd al-Razzaq dan al-Tahawi. {cite:muwatta-maruf-1997 p.91}"
