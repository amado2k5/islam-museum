  tr: "Suyuti'nin \"Kur'an'ın Ulumu'nun İtkanı\" adlı eserinin 3. cildinin 1326. sayfasından bir alıntı, farz ve müstehaplı amellerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehaplı ameller, mekruh amelleri, haram amelleri ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 3, halaman 1326, menyebutkan amalan wajib dan amalan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
