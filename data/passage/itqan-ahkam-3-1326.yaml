text: "… تعالى : قَالُواسَلَمَّا قَالَ سَلَمٌ هود: ؛ فإِنَّ الأولَ مندوبٌ، والثاني واجبٌ، والنكتةُ في ذلك أنَّ الجملةَ الاسميةَ أثبتُ واكدُ من الفعليةِ. المحرر قرأ أبو عمر وابن عامر وحمزة وحفص بالنصب، وقرأ الباقون بالرفع. انظر: التيسير، النشر. البحر."
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 1326، يرد فيه ذكر الواجب، والمندوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 1326, whose wording mentions the obligatory (wajib), the recommended (mandub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
