label: { ar: "الموطأ 938 — جبريل أمر النبي أن يأمر أصحابه أن يرفعوا أصواتهم بالتلبية أو الإهلال", en: "Muwatta 938", es: "Muwatta 938", fr: "Muwatta 938", ur: "موطا 938", tr: "El-Muvatta 938 — Cebrail, Peygamber'e, sahabelerine ihram halindeyken seslerini yükseltmelerini emretmesini söyledi.", id: "Al-Muwatta 938 — Jibril memerintahkan Nabi untuk menyuruh para sahabatnya mengeraskan suara mereka dalam Talbiyah atau Ihram." }
text: "أتاني جبريل فأمرني أن آمر أصحابي، أو من معي، أن يرفعوا أصواتهم بالتلبية أو بالإهلال"
summary:
  ar: "أول حديث في باب رفع الصوت بالإهلال. يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن عبد الملك بن أبي بكر بن عبد الرحمن بن الحارث بن هشام عن خلاد بن السائب الأنصاري عن أبيه، أن رسول الله قال: أتاني جبريل فأمرني أن آمر أصحابي، أو من معي، أن يرفعوا أصواتهم بالتلبية أو بالإهلال. ويذكر المحقق أن الترمذي قال إن بعضهم رواه عن خلاد عن زيد بن خالد، ولا يصح، وأن الصحيح عن خلاد عن أبيه، وأن ابن عبد البر رجا أن تكون رواية مالك أصح. {cite:muwatta-maruf-1997 p.449} {cite:muwatta-maruf-1997 p.450}"
  id: "Hadits pertama dalam surah ini adalah tentang meninggikan suara dalam Talbiyah. Diriwayatkan oleh Malik dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, dari Abdul-Malik ibn Abi Bakr ibn Abdur-Rahman ibn Al-Harith ibn Hisham, dari Khallad ibn As-Sa'ib Al-Ansari, dari ayahnya, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: \"Jibril datang kepadaku dan memerintahkanku untuk menyuruh para sahabatku, atau orang-orang yang bersamaku, untuk meninggikan suara mereka dalam Talbiyah.\" Peneliti menyebutkan bahwa At-Tirmidhi mengatakan bahwa sebagian orang meriwayatkannya dari Khallad dari Zayd ibn Khalid, tetapi ini tidak sahih, dan bahwa riwayat yang benar adalah dari Khallad dari ayahnya. Ibnu Abd Al-Barr berharap narasi Malik lebih shahih. {kutip:muwatta-maruf-1997 hal.449} {kutip:muwatta-maruf-1997 hal.450}"
