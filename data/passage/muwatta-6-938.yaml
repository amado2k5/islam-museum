label: { ar: "الموطأ 938 — جبريل أمر النبي أن يأمر أصحابه أن يرفعوا أصواتهم بالتلبية أو الإهلال", en: "Muwatta 938" }
text: "أتاني جبريل فأمرني أن آمر أصحابي، أو من معي، أن يرفعوا أصواتهم بالتلبية أو بالإهلال"
summary:
  ar: "أول حديث في باب رفع الصوت بالإهلال. يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن عبد الملك بن أبي بكر بن عبد الرحمن بن الحارث بن هشام عن خلاد بن السائب الأنصاري عن أبيه، أن رسول الله قال: أتاني جبريل فأمرني أن آمر أصحابي، أو من معي، أن يرفعوا أصواتهم بالتلبية أو بالإهلال. ويذكر المحقق أن الترمذي قال إن بعضهم رواه عن خلاد عن زيد بن خالد، ولا يصح، وأن الصحيح عن خلاد عن أبيه، وأن ابن عبد البر رجا أن تكون رواية مالك أصح. {cite:muwatta-maruf-1997 p.449} {cite:muwatta-maruf-1997 p.450}"
