label: { ar: "الموطأ 136 — مالك: إمامة المتيمم للمتوضئين", en: "Muwatta 136", es: "Muwatta 136", fr: "Muwatta 136", ur: "موطا 136", tr: "El-Muvatta 136 — Malik: Abdest alanlar için teyemmüm yapanın imametliği", id: "Al-Muwatta 136 — Malik: Imamah orang yang telah bertahamum bagi orang yang telah berwudu" }
summary:
  ar: "فتوى لمالك في باب التيمم: سُئل عن رجل تيمم أيؤم أصحابه وهم على وضوء؟ فقال: أن يؤمهم غيره أحب إليه، ولو أمّهم هو لم ير بذلك بأساً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.100}"
  tr: "Malik'in teyemmüm konusuyla ilgili bir fetvası: Kendisine teyemmüm yapan bir adam hakkında soru soruldu; abdestli olan arkadaşlarına namaz kıldırmalı mıdır? Cevap verdi: Başkasının kıldırması daha iyidir, fakat kendisi kıldırırsa bunda bir sakınca görmez. Araştırmacı, bu fetvanın Ebu Mus'ab ve Suveyd tarafından Malik'ten rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.100}"
  id: "Fatwa Malik tentang topik tayammum: Beliau ditanya tentang seorang pria yang melakukan tayammum; apakah ia harus memimpin shalat bersama teman-temannya ketika mereka dalam keadaan berwudu? Beliau menjawab: Lebih baik jika orang lain yang memimpin mereka, tetapi jika ia sendiri yang memimpin, ia tidak melihat ada salahnya. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.100}"
