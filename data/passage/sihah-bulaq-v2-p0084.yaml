  وشواية الخيز أيضا القرص منه والشمان دم الاخوين وهو فعلان والشمان البعيد النظر
  والشوشاة مثل الموماة الناقة السمريعة السكسائّعي شيّ اتياع له وبعضهم يقول شوى
  وما أعياه وأشياه وأشواه وجاء بالعىّ والشىّ ⁦(شها)⁩ الشهوة معروفة وطعام شهىّ أى
  مشتهى ورجل شهوان للشى وشهيت الشئ بالكسرأشهامشهوة اذا اشتهيته وتشهيت
  عسلى فلان كذا وهذائى يشهى الطعام أى يحمل على اشتهائه ورجل شاهى البصر قلب
  شانه البصرأى حديد البصر
  الفرخ يصأى صنيا مثل صعى يصعى صعيا اذاصاح وكذلك الخنزير والفيل والفأر
  والبربوع قال
  مالى اذا أنزعها مأيت • أكبر غيرفى أم بيت
  وفى المشل جاء بماصأى وصمت اذاجا: بالمال الكثير أى بالناطق والصامت ويقال أيضا
  جاءبماصاء وصمت وهومقلوب من صأى قال الفراء والعقرب أيضانصى وفى المشل تلدغ
  العقرب وتصى والوا وللعال حكاه الاضمعى فى كتاب الفرق ⁦(صيا)⁩ الصبى الغلام والجمع
  صبية وصبيان وهومن الواوولم يقولوا أصبية استغناه بصبية كما لم بقولوا اغلمة استغناء بغملمة
  وتصغير صبية صية فى القياس وقدباه فى الشعر أصبيصة كأنه تصغير أصبية قال الشاءر
  ارحم أصيديتى الذين كانهم * جلى تدرّج فى الشربّة وقع
  ويقال صىّ بين الصبا والصباء اذا فتحت الصاد مددت واذا كسرت قصرت والجارية صبية
  وابمع صبا يإمثل مطية ومطايا والصبيانعلى فعيلان طرفا اللحيين قال أبوصدقة
  العجلىّ يصف فرسا
  عارمن اللحم صييا اللحيين * مؤال الاذن أسيل الخدين
  والصبا أيضامن الشوق بقال منه تصابى وصبا يصبوصبوة وصبوا أى مال الى الجهل
  والفموة وأصبته الجارية وصبى صبا مثال سمع مماعا أى لعب مع الصبيان وأصبت المرأة
  اذا كان لها صبىّ ووااذكرأ وأتى وامرأة مصبية بالهاء أى ذات صبية والصباريح ومهبها
  المستوى أن تهب من موضع مطلع الشمس اذا استوى الليل والنهارونيحتها الديورتة ول منه
  مبت تصبو صبوا وتزعم العرب أنّ الدبور تزعج السحاب وتشخصه فى الهواء ثم تسوقه فاذا.
  علا كشفت عنه واستقباته الصباذردت بعضه على بعض حتى يصير كسفا واحدا
  والجنوب تلحق روادفه به وتقدّه من المدد والشمال تزق السحاب والصابية النسكيباء التى
  تجرى بين الصبا والشمال وصابيت السيف اذا أدخلته فى غمده مقلوبا وصابيت الرمح
  قال الاصمفى لا أدرى من أى شئهو قال الاعشى
  بكأس وابريق كأن شرابه * اذاصبّ فى المصحاة خالط بقما
  وصحامن شكره صحوا والسكران صاح والصموأيضا ذهاب الغيم واليوم صناح
  وأصمت السماء أى انقشع عنها الغيم فهى مصحية وقال الكسائى فهى صحوولا تقل مصحما
  وأصحينا أى أصحت لنا السماء صدالصدى ذكر البوم قال العدبس الصدى هوهذا
