text: "العرب العاربة وهم قبائل كثيرة منهم عاد وثمود وجرهم وطسم وجديس وأميم ومدين وعملاق"
summary:
  ar: "يعدّ ابن كثير القبائل التي يسميها العرب العاربة، وهي الأمم القديمة التي سبقت إسماعيل، ومنها عاد وثمود وطسم وجديس وعملاق."
  en: "Ibn Kathir lists the tribes called the original Arabs, the ancient peoples who came before Ismail, among them Ad, Thamud, Tasm, Jadis and Amalek."
  es: "Ibn Kathir enumera las tribus llamadas árabes originales, los pueblos antiguos que precedieron a Ismael, entre ellos Ad, Thamud, Tasm, Jadis y Amalec."
  fr: "Ibn Kathir énumère les tribus appelées les Arabes originaux, les peuples anciens qui ont précédé Ismaël, parmi lesquels les Ad, les Thamud, les Tasm, les Jadis et les Amalek."
  ur: "ابن کثیر نے ان قبائل کی فہرست دی ہے جنہیں اصل عرب کہا جاتا ہے، قدیم قومیں جو اسماعیل سے پہلے آئیں، ان میں عاد، ثمود، تسم، جدی اور عمالیق۔"
  tr: "İbn Kathir, Arapların asıl kabileler olarak adlandırdığı, İsmail'den önce var olan eski milletleri, yani Ad, Semud, Tasm, Cedis ve Amalek kabilelerini sıralar."
  id: "Ibn Kathir mencantumkan suku-suku yang oleh orang Arab disebut sebagai suku asli, yaitu bangsa-bangsa kuno yang mendahului Ismael, termasuk Ad, Tsamud, Tasm, Jadis, dan Amalek."
