text: "… وهذا أدل دليل على بطلان من قال: إن المراد بالأحرف السبعة قراءات القراء السبعة، لأن الحق لا يختلف فيه، وقد روى سُوَيد بن غَفَلة عن عليّ بن أبي طالب أن عثمان قال: ما ترون في المصاحف؟ فإن الناس قد أختلفوا …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 53، يذكر الأحرف السبعة، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 53, that mentions the seven ahruf, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 53 کا اقتباس جس میں سبعہ احرف، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volumen 3, pág. 53, que menciona los siete ahruf, los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Coran d'al-Qurtubi (al-Jami' li-Ahkam al-Qur'an), volume 3, page 53, mentionnant les sept ahruf, les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Kur'an'ın yedi kıraat şeklini, okuyucularını ve Kur'an ile el yazmalarının derlenmesini anlatan, El-Kurtubi'nin El-Cami'li-Ahkam el-Kur'an adlı eserinin 3. cildinin 53. sayfasından bir alıntı; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an kıraatleri, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Qurtubi, Al-Jami' li-Ahkam al-Qur'an, Volume 3, halaman 53, yang menyebutkan tujuh cara pembacaan, para qari, dan penyusunan Al-Qur'an dan manuskripnya; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam pembacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
