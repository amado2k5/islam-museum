label: { ar: "البخاري 3681 — لبن الرؤيا يُؤول بالعلم", en: "Bukhari 3681 — The dream milk interpreted as knowledge" }
text: "بينا أنا نائم شربت — يعني اللبن — حتى أنظر إلى الري يجري في ظفري — أو في أظفاري — ثم ناولت عمر. فقالوا: فما أولته يا رسول الله؟ قال: «العلم»"
summary:
  ar: "في كتاب مناقب الأنصار؛ رؤيا النبي التي شرب فيها اللبن حتى سال الري في أظفاره ثم ناول عمر، فأوله بالعلم. من نصوص فضل عمر العلمية."
