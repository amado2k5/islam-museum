label: { ar: "سنن أبي داود 587 — الأب والأبوة", en: "Sunan Abi Dawud 587 — the father and fatherhood", ur: "سنن ابی داؤد 587 — باپ اور والدیت", es: "Sunan Abi Dawud 587 — El padre y la paternidad", fr: "Sunan Abi Dawud 587 — Le père et la paternité", tr: "Sunan Abi Davud 587 — Baba ve Babalık", id: "Sunan Abi Dawud 587 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا وَكِيعٌ، عَنْ مِسْعَرِ بْنِ حَبِيبٍ الْجَرْمِيِّ، حَدَّثَنَا عَمْرُو بْنُ سَلِمَةَ، عَنْ أَبِيهِ، أَنَّهُمْ وَفَدُوا إِلَى النَّبِيِّ فَلَمَّا أَرَادُوا أَنْ يَنْصَرِفُوا قَالُوا يَا رَسُولَ اللَّهِ مَنْ يَؤُمُّنَا قَالَ \" أَكْثَرُكُمْ جَمْعًا لِلْقُرْآنِ \". أَوْ \" أَخْذًا لِلْقُرْآنِ \". قَالَ فَلَمْ يَكُنْ أَحَدٌ مِنَ الْقَوْمِ جَمَعَ مَا جَمَعْتُهُ - قَالَ - فَقَدَّمُونِي وَأَنَا غُلاَمٌ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 587، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 587 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 587، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 587 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 587 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 587 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 587, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
