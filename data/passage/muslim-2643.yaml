label: { ar: "مسلم 2643 — كيفية الخلق الآدمي في بطن أمه", en: "Muslim 2643 — How the human is formed in the womb" }
text: "قال عبد الله بن مسعود: حدثنا رسول الله — وهو الصادق المصدوق —: «إن أحدكم يجمع خلقه في بطن أمه أربعين يوماً، ثم يكون في ذلك علقة مثل ذلك، ثم يكون في ذلك مضغة مثل ذلك، ثم يرسل الملك فينفخ فيه الروح، ويؤمر بأربع كلمات: بكتب رزقه وأجله وعمله وشقي أو سعيد»"
summary:
  ar: "رواية عبد الله بن مسعود في باب كيفية الخلق الآدمي في بطن أمه من كتاب القدر في صحيح مسلم؛ أطوار الجنين وكتابة الرزق والأجل والعمل والشقاوة والسعادة — نص جامع للخلق والقدر."
