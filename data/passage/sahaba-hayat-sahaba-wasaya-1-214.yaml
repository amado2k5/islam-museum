text: "… من مؤمن بنهاه ايمانه ولا من فاسق بين فسقه ولكنى اخاف عليها رجلا قد قرأ القرآن حتى ازلقه بلسانه ثم تأوله على غير تأويله. و أخرج الطبرانى فى الكبير عن عقبة بن عامر انه لما حضرته الوفاة قال : يا …"
