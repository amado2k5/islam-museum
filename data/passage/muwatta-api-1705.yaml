label: { ar: "موطأ مالك 1705 — الدواء", en: "Muwatta Malik 1705 — the drug", ur: "موطأ مالک 1705 — دوا", es: "Muwatta Malik 1705 — la droga", fr: "Muwatta Malik 1705 — la drogue", tr: "Muwatta Malik 1705 - Tıp", id: "Muwatta Malik 1705 — Kedokteran" }
text: "… مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ كَانَ لاَ يُؤْتَى أَبَدًا بِطَعَامٍ وَلاَ شَرَابٍ حَتَّى الدَّوَاءُ فَيَطْعَمَهُ أَوْ يَشْرَبَهُ إِلاَّ قَالَ الْحَمْدُ لِلَّهِ الَّذِي هَدَانَا وَأَطْعَمَنَا وَسَقَانَاوَنَعَّمَنَا اللَّهُ أَكْبَرُ اللَّهُمَّ أَلْفَتْنَا نِعْمَتُكَ بِكُلِّ شَرٍّ فَأَصْبَحْنَا مِنْهَا وَأَمْسَيْنَا بِكُلِّ خَيْرٍ نَسْأَلُكَ تَمَامَهَا وَشُكْرَهَا لاَ خَيْرَ إِلاَّ خَيْرُكَ وَلاَ إِلَهَ غَيْرُكَ إِلَهَ الصَّالِحِينَ وَرَبَّ الْعَالَمِينَ الْحَمْدُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1705، يذكر الدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1705 (The Description of the Prophet, may Allah Bless Him and Grant Him Peace), that mentions the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1705، جس میں دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1705 (Descripción del Profeta), menciona el medicamento. El Navegador de Medicamentos lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik, n° 1705 (Description du Prophète, que la paix et la bénédiction d'Allah soient sur lui), mentionne ce médicament. Le Répertoire des médicaments le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta adlı eserinde 1705 numaralı hadis, tıptan bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1705, menyebutkan tentang pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
