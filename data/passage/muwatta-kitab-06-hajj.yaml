summary:
  ar: "كتاب الحج، الكتاب السادس من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 385 نصاً (898–1282) في ثلاثة وثمانين باباً، من الصفحة 433 إلى الصفحة 570 من ملف PDF المجلد الأول. يبدأ بأحكام المحرم وما يُجتنب فيه، ثم الهدي وما يفعله من فاته الحج أو أصاب أهله، ثم الوقوف بعرفة والمزدلفة، والرمي والحلق والإفاضة، والمبيت بمنى، وفدية ما يُصاب في الإحرام، ويختم بحج المرأة بغير ذي محرم وصيام المتمتع. {cite:muwatta-maruf-1997 p.433} {cite:muwatta-maruf-1997 p.570}"
  en: "The Book of Pilgrimage, sixth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 385 reports (898–1282) in eighty-three babs, PDF pp. 433–570 of volume 1, from the rules of the state of ihram through the hady, the standing at Arafa and Muzdalifa, the stoning, the expiations, to the pilgrimage of a woman without a mahram and the fasting of the tamattu' pilgrim."
