text: "… هَارُونَ والسكينا طستْ من ذهب يُغسَل فيها قلوب الانبياء أعطاها اللّه موسى وفيها وضع الالواح وكانت الالواح فيما بلغنا من دُر وياقوت وزبرجد واما البقية فانها عصا موسى ورضاضة الالواح خاصبح. التابوت وما فيه فى دار طالوت فامنوا بنبوا شمعون …"
