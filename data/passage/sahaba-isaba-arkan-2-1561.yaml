text: "… وقال: لعله كان في الأصل: إن ابن وايصة. دخل رجل المسجد، قلما رآه النَّبي وَليم تزحزح له؛ - واثلة بن الأسقع بن كعب بن عامر: فقال: يا رسول الله! إن في المكان سعة؛ فقال: إِنَّ لِلِمُسلِمِ عَلَى المُسْلِمِ إِذَا رَآهُ …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1561، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
