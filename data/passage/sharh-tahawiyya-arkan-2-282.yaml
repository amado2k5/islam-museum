text: "… فلسين لحدَّثهم سبعين حديثا. وقد وصف النبى لك النساء بنقصان العقل والدين، وقال ذكا: لا يؤمن أحدكم حتى أكون أحب إليه من ولده ووالده والناس أجمعين والمراد نفى الكمال ونظائره كثيرة، وحديث شعب الإيمان وحديث الشفاعة وأنه يخرج من النار …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 2، ص 282، يذكر شعب الإيمان، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
