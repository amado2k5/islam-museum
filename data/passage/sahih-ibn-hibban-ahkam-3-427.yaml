text: "… لَ قَالَ: إِنَّ لِلَّهِ حَقًّا عَلَى كُلِّ مُسْلِمِ أَنْ يَغْتَسِلَ كُلَّ سَبْعَةِ أَيَّامٍ يَوْماً، فَإِنْ كَانَ لَهُ طِيبٌ مَسَّهُ. - ذكر خبر رابع يدل على أن الأمر بالاغتسال للجمعة أمر ندب لا حتم - أَخْبَرَنَا عَبْد اللَّهِ بن مُحَمَّد بن …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 427، يرد فيه ذكر ما وجب على كل مسلم، وحق على كل مسلم، والمندوب، والحتم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 427, whose wording mentions a duty laid on every Muslim, a right due from every Muslim, the recommended (mandub), the binding (hatm), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 427 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، ہر مسلمان پر حق، مندوب، حتمی حکم، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 3, p. 427, dont le texte mentionne un devoir imposé à chaque musulman, un droit dû par chaque musulman, le recommandé (mandub), le contraignant (hatm), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 3, p. 427, cuyo texto menciona un deber impuesto a cada musulmán, un derecho debido por cada musulmán, lo recomendado (mandub), lo vinculante (hatm), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, 3. Cilt, 427. sayfadan bir alıntı; her Müslüman için farz olan, her Müslüman için hak olan, tavsiye edilen, farz olan ve tavsiye edilen şeyleri sıralamaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid 3, halaman 427, yang menyebutkan apa yang wajib bagi setiap Muslim, apa yang menjadi hak setiap Muslim, apa yang dianjurkan, apa yang wajib, dan apa yang dianjurkan. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
