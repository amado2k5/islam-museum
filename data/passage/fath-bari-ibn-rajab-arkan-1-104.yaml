text: "… على قدرِ قُدرتِه عليكَ، واستحيي منه على قدرِ قربه منك وقد يتولدُ الحياءُ من اللهِ من مطالعةِ النعمِ فيستحيي العبدُ من اللهِ أن يستعينَ بنعمته على معاصيه، فهذا كله من أعلَى خصالِ الإيمانِ. الترمذي، وأحمد من طريق الصباح بن محمد، …"
