text: "قال رسول الله: لو كان لابن آدم واديان من مال لابتغى وادياً ثالثاً، ولا يملأ جوف ابن آدم إلا التراب، ويتوب الله على من تاب"
summary:
  ar: "رواية أنس بن مالك في باب لو أن لابن آدم واديين لابتغى ثالثاً من كتاب الزكاة في صحيح مسلم؛ الحرص الذي لا يملؤه إلا التراب، وختمها بقبول التوبة."
  tr: "Sahih Müslim'deki Zekat Kitabı'nın \"Âdemoğlunun iki vadisi olsa, üçüncüsünü de isterdi\" bölümünde Enes bin Malik'in rivayetinde; tozun bile dolduramayacağı bir açgözlülükten bahsedilmiş ve tövbenin kabulüyle sonlandırılmıştır."
  id: "Riwayat Anas bin Malik dalam surah “Jika anak Adam mempunyai dua lembah, ia akan mencari lembah ketiga” dari Kitab Zakat dalam Sahih Muslim; keserakahan yang tak dapat dipenuhi kecuali debu, dan beliau menyimpulkannya dengan menerima taubat."
