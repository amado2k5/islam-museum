  ⁦( امل)⁩ الامل الرجاء بقال امل خيره يأ-لهاملا وصكذلك التأميل وقولهم ما أطول
  امكته أى أمله وهو كالإجلسة والركبة وتأمات الشئ أى نظرت اليه مستبيناله والاميل
