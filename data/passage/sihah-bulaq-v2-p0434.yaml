  على انها كانت تأوّل حبها * تأوّل ربعى السقاب فأصحبا
  قال ابو عبيدة يعنى تأوّل حبها أى تفسيره ومر جعه اى انه كان صسغيرا في قلبه فلم يزل
  ينبت حتى أصحب فصارديما كهذا السقب الصغير لم يزل يشبّ حتى صار كبيرامثل أمه
  وصار له ابن يصحبه وآل الرجل اهله وعياله وآله أيضا اتباعه قال الاعشى
  مكذبوها بماقاات فصحهم * ذوآل حسانيزبى السم والسلمعا
  يعنى جيش تبع والال الشخص والآل الذى تراه فى أول النهار وآخره كأنه يرفع
