text: "… النكاح فلا يجوز أن يجمع بينهما الرابع عشر أن يكون هذا الناكح قد طلقها ثلاثا ً فهي لا تحل له ما لم يطأها زوج غيره في نكاح صحيح ا تحرم عليه الخامس عشر أن يكون الناكح قد لاعنها فإ أبدا …"
summary:
