text: "حَدَّثَنَا الْعَبَّاسُ بْنُ الْوَلِيدِ الدِّمَشْقِيُّ، حَدَّثَنَا عَلِيُّ بْنُ عَيَّاشٍ، حَدَّثَنَا سَعِيدُ بْنُ عُمَارَةَ، أَخْبَرَنِي الْحَارِثُ بْنُ النُّعْمَانِ، سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، يُحَدِّثُ عَنْ رَسُولِ اللَّهِ ـ صلى الله عليه وسلم ـ أَنَّهُ قَالَ ‏ \"‏ أَكْرِمُوا أَوْلاَدَكُمْ وَأَحْسِنُوا أَدَبَهُمْ ‏\"‏ ‏.‏"
summary:
  ar: "عن أنس: أكرموا أولادكم وأحسنوا أدبهم."
  en: "From Anas: «honor your children and make their discipline good.»"
  ur: "انس سے: «اپنی اولاد کا احترام کرو اور ان کی تربیت اچھی کرو۔»"
  es: "De Anas: «Honra a tus hijos y haz que sean disciplinados»."
