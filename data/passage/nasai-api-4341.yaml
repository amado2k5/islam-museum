label: { ar: "سنن النسائي 4341 — ما أُحل، ما لا يحل", en: "Sunan al-Nasa'i 4341 — what was made lawful; what is not lawful", ur: "سنن نسائی 4341 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan al-Nasa'i 4341 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sunan al-Nasa'i 4341 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan an-Nasa'i 4341 — Neler caizdir, neler caiz değildir", id: "Sunan an-Nasa'i 4341 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… بْنِ مَعْدَانَ، عَنْ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ، أَنَّهُ حَدَّثَهُمْ أَنَّهُمْ، غَزَوْا مَعَ رَسُولِ اللَّهِ إِلَى خَيْبَرَ وَالنَّاسُ جِيَاعٌ فَوَجَدُوا فِيهَا حُمُرًا مِنْ حُمُرِ الإِنْسِ فَذَبَحَ النَّاسُ مِنْهَا فَحُدِّثَ بِذَلِكَ النَّبِيُّ فَأَمَرَ عَبْدَ الرَّحْمَنِ بْنَ عَوْفٍ فَأَذَّنَ فِي النَّاسِ \" أَلاَ إِنَّ لُحُومَ الْحُمُرِ الإِنْسِ لاَ تَحِلُّ لِمَنْ يَشْهَدُ أَنِّي رَسُولُ اللَّهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4341، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4341 (The Book of Hunting and Slaughtering), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4341، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4341 (El Libro de la Caza y la Matanza), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4341 (Le Livre de la Chasse et de l'Abattage), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de yer alan 4341 numaralı hadis, helal ve haram olanı belirtir. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4341, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
