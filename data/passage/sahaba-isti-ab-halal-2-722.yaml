text: "… الخمس، وأحللتُ الحلال، ابن عمر، كُلّهم تَحتَ رايته، وهو أمير الجيش، ففتح الله عليه أصبهان، فلمّا أتى نهاوند، قال النُّعمان : وحرّمتُ الحرام أدخل الجنة؟ قال : نعم. رواه عنه جابر، ورواه عنه أيضاً أبو صالح، ولم يسمعه يا معشر …"
