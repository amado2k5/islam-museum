ref: "1824"
label: { ar: "صحيح البخاري 1824 — ما حُرّم", en: "Sahih al-Bukhari 1824 — what was made unlawful", ur: "صحیح بخاری 1824 — جو حرام کیا گیا", es: "Sahih al-Bukhari 1824 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 1824 — ce qui a été déclaré illicite" }
text: "… مَعَهُ فَصَرَفَ طَائِفَةً مِنْهُمْ، فِيهِمْ أَبُو قَتَادَةَ فَقَالَ خُذُوا سَاحِلَ الْبَحْرِ حَتَّى نَلْتَقِيَ. فَأَخَذُوا سَاحِلَ الْبَحْرِ، فَلَمَّا انْصَرَفُوا أَحْرَمُوا كُلُّهُمْ إِلاَّ أَبُو قَتَادَةَ لَمْ يُحْرِمْ، فَبَيْنَمَا هُمْ يَسِيرُونَ إِذْ رَأَوْا حُمُرَ وَحْشٍ، فَحَمَلَ أَبُو قَتَادَةَ عَلَى الْحُمُرِ، فَعَقَرَ مِنْهَا أَتَانًا، فَنَزَلُوا فَأَكَلُوا مِنْ لَحْمِهَا، وَقَالُوا أَنَأْكُلُ لَحْمَ صَيْدٍ وَنَحْنُ مُحْرِمُونَ فَحَمَلْنَا مَا بَقِيَ مِنْ لَحْمِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1824، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1824 (Penalty of Hunting while on Pilgrimage), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1824، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1824 (Castigo de la caza durante la peregrinación), menciona lo que se considera ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1824 (La peine pour avoir chassé en pèlerinage), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
