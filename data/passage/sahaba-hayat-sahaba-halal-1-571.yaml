text: "… احمر وما حوله حمرة وعليه ثياب من الحمرة، فدنونا منه فضحك فقال: ما عليكم لو جنتمونى بتحيتكم فيما بينكم؟ وإذا عنده رجل فصيح بالمربية كثير الكلام، فقلنا: ان تحيتنا فما بيننا لا تحل لك و تحيتك التى تحيا بها لا …"
