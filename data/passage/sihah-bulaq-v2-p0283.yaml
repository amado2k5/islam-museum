text: |-
  ٣٠ ٤
  • ⁦(فصل الصاد)⁩•
  *(صر م,,
  موضعان وصلة بن أشيم رجل من التابعين
  صل الصاد) م) عبدهتم بالتسكين وجدل صمّ ورجل صتم والجمع صنتم بالضم
  وحكى ابن السكيت عبد صتم بالتحريك أى غليظ شديد وحل صتم أيضاوناقة صتمة
  ولم يعرفه أعلب الابالتسكين قال وأنشدنا ابن الاعرابي
  ومنتظرى صتما فقال رأيته • نحيفا وقد أجزى عن الرجل الصم
  وألف صتم أى تام ومال صتم وأموال صتم عن الفراء والحروف الصتم ماعدا الذلق والتصتيم
  التكميل يقال ألف مصتم أى مكمل وشئ صتم أى محكم تام ( سم الاسم الاسود
  الذى يضرب الى الصفرة وقال يصف حارا: :
  أو احم حام حراميزه • حزابية حيدى بالدحال
  وأحمة اسم رجل وبلدة هماء مغبرة والعماء بقبلة واصحاتت البذلة اصفارت ⁦(صخم)⁩
  اصطخمت فأنا مصطخم اذا انتميت قائعما والمصطخم المنتسب القام (صدم صدمه
  صدماضر به بجسده وصادمه قتصادما واصطدما أبوزيد الصدمتان بكسر الدال جانبا
  الجبين وفى الحديب الصبر عند الصدمة الأولمعناه أنّ كل ذى مرزئة قصاراه الصبر ولكنه
  انما يحمد عند حدتها والصدام بالكسرداء باخذروس الدواب والعامة تضمه وهو القياس
  رم صرمت الشى صرما اذا قطعته وصرمت الرجل صر ما اذاقطعت كلامه والاسم
  الصرم وصرم النخل أى جده وأصرم التخل أى حان له أن يصرم واصطرام النخل اجترامه
  والانصرام الانقطاع والتصارم التقاطع والتصرم التقطع ونصرّ م أى تجلد وتصريم الحبال
  قطيعهاشدد للسكثرة وناقة مصرّمة وهوان يقطح طبياهاليببس الاحليل ولا يخرج اللبن
  اكون أقوى لها وكان أبو عمرو يقول وقدة ككون المصرّمة الاطباء من انقطاع اللبن وذلك
  أن يصيب الضرع شي فيكوى بالذارفلا يخرج منه لبن أبداوأصرم الرجل اقتقبر والصرم الجاد
  فارسى معرب والصرم بالكسرأيات من الناس مجتمعة والجمع أصرام وأصارم والصرمة
  القطعة من الابل نح و الثلاثين والصرمة القطعة من السحاب والجمع صرم قال النابعة
  تزحى مع الليل من صرّادهاصرما* والاصرمان الذئب والغراب قال إين السكيت لانهما
  انصرما من الناس أى انقطعا وأنشد للمرّار
  على صرماء فيها أصرماها * وخريت الفلاة بها مليل
  أى هو مليل والصرماء المفازة التى لاما فيها والصرام والصرام جداد النخل والصرام
  بالضم آخر اللبن بعد التغر يرّاذا احتاج اليه الرجل حلبه ضرورة قال بشر
  ألا أبلغ بنى سعدرسولا .* ومولاهم فقد حلبت صرام
  يقول بلغ العذر آخره وهومثل هذاقول أبى عبيدة وقال الاصمعى الصرام أسم من أسماء
  الحرب والداهية. وأنشد النحيانى للكميت
  ماشيرما كان الرخا حسافة * اذا الحرب سماها صرام الملقب
  والمصرم بالكسر منجل المغازلى والصادم السيف القاطع. ورجل صاريم أى جلد شجاع
  رقد صرم بالضم صرامة والصريم الليل المظلم قال النابغة * كالليل يخلط أصراما بأصرام
  والصرم
