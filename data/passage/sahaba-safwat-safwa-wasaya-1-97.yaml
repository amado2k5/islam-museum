text: "… إليك أن لا تكون مضيت؟ فقال أبو بكر: لم يكن لابن أبي قحافة أن يؤمّ رسول اللّٰه ول فيس. فقال للناس: إذا نابكم شيء في صلاتكم فليسبح الرجل، ولتصفح النساء أخرجاه في الصحيحين. وعن عائشة قالت: لما ثقل رسول اللّٰه …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 97، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 97, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 97 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
