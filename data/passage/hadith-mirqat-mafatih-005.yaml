text: "ا عني شيئا غير القرآن) (١) الحديث، فلا ينافي ذلك لأن الكلام في كتابه مخصوصة على صفة مخصوصة وقد كان القرآن كله كتب في عهد رسول الله والفي لكن غير مجموع في موضع واحد ولا مرتب السور، وقال الحارث: المحاسبي"
