label: { ar: "سنن أبي داود 4326 — ضحك وتبسم", en: "Sunan Abi Dawud 4326 — laughter and smiling", ur: "سنن ابی داؤد 4326 — ہنسی اور تبسم", fr: "Sunan Abi Dawud 4326 — rire et sourire", es: "Sunan Abi Dawud 4326 — risa y sonrisa", tr: "Sünen Ebi Davud 4326 — Kahkaha ve Gülümseme", id: "Sunan Abi Dawud 4326 — Tertawa dan Tersenyum" }
text: "… عَنْ فَاطِمَةَ بِنْتِ قَيْسٍ، قَالَتْ سَمِعْتُ مُنَادِيَ، رَسُولِ اللَّهِ يُنَادِي أَنَّ الصَّلاَةَ جَامِعَةٌ. فَخَرَجْتُ فَصَلَّيْتُ مَعَ رَسُولِ اللَّهِ فَلَمَّا قَضَى رَسُولُ اللَّهِ الصَّلاَةَ جَلَسَ عَلَى الْمِنْبَرِ وَهُوَ يَضْحَكُ قَالَ لِيَلْزَمْ كُلُّ إِنْسَانٍ مُصَلاَّهُ . ثُمَّ قَالَ هَلْ تَدْرُونَ لِمَ جَمَعْتُكُمْ . قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ إِنِّي مَا جَمَعْتُكُمْ لِرَهْبَةٍ وَلاَ رَغْبَةٍ وَلَكِنْ جَمَعْتُكُمْ أَنَّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4326، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Abi Dawud, no. 4326, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابی داؤد کی حدیث نمبر 4326، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Abi Dawud, n° 4326, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Abi Dawud, n.º 4326, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sünen Ebu Davud'da yer alan 4326 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4326, berisi tentang tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan Peramban Cerita Rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
