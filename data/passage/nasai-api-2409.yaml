label: { ar: "سنن النسائي 2409 — مضاعفة الحسنة بعشر أمثالها", en: "Sunan al-Nasa'i 2409 — the good deed multiplied tenfold and beyond", ur: "سنن نسائی 2409 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "أَخْبَرَنَا عَلِيُّ بْنُ الْحَسَنِ اللاَّنِيُّ، بِالْكُوفَةِ عَنْ عَبْدِ الرَّحِيمِ، - وَهُوَ ابْنُ سُلَيْمَانَ - عَنْ عَاصِمٍ الأَحْوَلِ، عَنْ أَبِي عُثْمَانَ، عَنْ أَبِي ذَرٍّ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ صَامَ ثَلاَثَةَ أَيَّامٍ مِنَ الشَّهْرِ فَقَدْ صَامَ الدَّهْرَ كُلَّهُ \". ثُمَّ قَالَ \" صَدَقَ اللَّهُ فِي كِتَابِهِ { مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا } \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2409، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2409 (The Book of Fasting), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2409، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
