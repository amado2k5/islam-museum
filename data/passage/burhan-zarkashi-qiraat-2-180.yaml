  fr: "Extrait du livre d'al-Zarkashi, *al-Burhan fi 'Ulum al-Qur'an*, volume 2, page 180, mentionnant les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
