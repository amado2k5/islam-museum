text: "… يَوْمًا بَارِزًا للنَّاسِ فَأَنَاهُ رَجُلٌ فَقَالَ: مَا الإيمَانُ؟ قَالَ: الإِيمَانُ أَنْ تُؤْمِنَ بِاللهِ وَمَلائِكَتْه وَبَلِقَائِهِ وَرُسُلِهِ وَتُؤْمِنَ بَالْبَعْثِ قَالَ: مَا الإِسْلَامُ؟ قَالَ: الإسْلَاَمُ أَنْ تَعْبُدَ اللّٰهَ وَلَا تُشْرِكَ بِهِ، وَتُقِيمَ الصَّلاةَ وَتُؤَدِّيَ الزَّكَاةَ الْمَفْرُوضَةَ وَتَصُومَ رَمَضَانَ قَالَ: مَا الإِحْسَانُ؟ قَالَ: …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 208، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 208, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, belief in God, His angels, His books and His messengers, the question about faith and its answer, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 208 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
