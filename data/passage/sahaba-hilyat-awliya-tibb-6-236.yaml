text: "… بنفسه فبكى وقال إما أبكى على تقصيرى. حدثنا أحمد ثنا جمفر ثنا إبراهيم حدثى أبو محمد الطيب بن اسماعيل القارى. قال: سمعتهم يذكرون بمبادان أنه قيل لعتبة فى مرضة مرضها ألا تتداوى فقال عتبة دائى هو دوائى، قال وسمعتهم أيضا …"
summary:
