text: "… : كيف نَزْهُنَك نساءَنَا وأنت أشَبُّ أَهْلِ يثرب وأعْطَرُهُمْ؟! قال: أترهنوني أبناءكم؟ قال ابن إسحاق: فحدثني ثَوْر بن زَيْدٍ، عن عِكْرِمَةَ، عن ابن عباس -ما - قال : مَشَى معهم رسولُ اللّٰه والَ إلى بَقِيعِ الْغَرْقَدِ، ثم وَجَهَهُمْ، فقال: انْطَلِقُوا …"
