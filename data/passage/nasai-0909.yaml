label:
  ar: "النسائي 909 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Nasa'i 909 — I have divided the prayer between Myself and My servant in two halves"
  ur: "نسائی 909 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج هي خداج هي خداج . غير تمام . فقلت يا أبا هريرة إني أحيانا أكون وراء الإمام . فغمز ذراعي وقال اقرأ بها يا فارسي في نفسك فإني سمعت رسول …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 909: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 909: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 909: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
