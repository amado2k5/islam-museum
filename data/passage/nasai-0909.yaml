label:
  ar: "النسائي 909 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Nasa'i 909 — I have divided the prayer between Myself and My servant in two halves"
  ur: "نسائی 909 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
  es: "Nasa'i 909 — He dividido la oración entre Mí y Mi siervo en dos partes."
  fr: "Nasa'i 909 — J'ai divisé la prière entre Moi et Mon serviteur en deux parties"
  tr: "Kadınlar 909 — Duayı kendim ve kulum arasında ikiye böldüm."
  id: "Wanita 909 — Aku telah membagi doa antara Diri-Ku dan hamba-Ku menjadi dua bagian"
text: "من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج هي خداج هي خداج . غير تمام . فقلت يا أبا هريرة إني أحيانا أكون وراء الإمام . فغمز ذراعي وقال اقرأ بها يا فارسي في نفسك فإني سمعت رسول …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 909: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 909: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 909: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 909: He dividido la oración entre Mí y Mi siervo en dos mitades. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sunan al-Nasa'i, n° 909: « J’ai divisé la prière en deux parties entre Moi et Mon serviteur. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 909: \"Aku telah membagi salat antara Diri-Ku dan hamba-Ku menjadi dua bagian.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta'."
