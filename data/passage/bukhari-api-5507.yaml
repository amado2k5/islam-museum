text: "حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدِ اللَّهِ، حَدَّثَنَا أُسَامَةُ بْنُ حَفْصٍ الْمَدَنِيُّ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ أَنَّ قَوْمًا، قَالُوا لِلنَّبِيِّ إِنَّ قَوْمًا يَأْتُونَا بِاللَّحْمِ لاَ نَدْرِي أَذُكِرَ اسْمُ اللَّهِ عَلَيْهِ أَمْ لاَ فَقَالَ \" سَمُّوا عَلَيْهِ أَنْتُمْ وَكُلُوهُ \". قَالَتْ وَكَانُوا حَدِيثِي عَهْدٍ بِالْكُفْرِ. تَابَعَهُ عَلِيٌّ عَنِ الدَّرَاوَرْدِيِّ. وَتَابَعَهُ أَبُو خَالِدٍ وَالطُّفَاوِيُّ."
summary:
  ar: "خبر في صحيح البخاري، رقم 5507، في اللحم الذي لا يُدرى أذُكر اسم الله عليه. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Sahih al-Bukhari, no. 5507, on meat of which it is not known whether God's name was said over it. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "صحیح بخاری کی روایت نمبر 5507: وہ گوشت جس پر اللہ کا نام لینے کا علم نہ ہو۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
