text: "… الثالثة قام قبل أن يجلس، فلما كان قبل أن يُسَلّم سجد سجدتين. - حدثنا معتمر عن بُرْد عن مكحول والزهري قالا: سجدتان قبل أن يسلم. - التسليم في سجدتي السهو - حدثنا أبو الأحوص وحفص عن عاصم عن أبي قلابة: …"
summary:
