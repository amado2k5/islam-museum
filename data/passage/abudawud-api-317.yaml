label: { ar: "سنن أبي داود 317 — الأب والأبوة", en: "Sunan Abi Dawud 317 — the father and fatherhood", ur: "سنن ابی داؤد 317 — باپ اور والدیت" }
text: "… مُعَاوِيَةَ، ح وَحَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، أَخْبَرَنَا عَبْدَةُ، - الْمَعْنَى وَاحِدٌ - عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ بَعَثَ رَسُولُ اللَّهِ أُسَيْدَ بْنَ حُضَيْرٍ وَأُنَاسًا مَعَهُ فِي طَلَبِ قِلاَدَةٍ أَضَلَّتْهَا عَائِشَةُ فَحَضَرَتِ الصَّلاَةُ فَصَلَّوْا بِغَيْرِ وُضُوءٍ فَأَتَوُا النَّبِيَّ فَذَكَرُوا ذَلِكَ لَهُ فَأُنْزِلَتْ آيَةُ التَّيَمُّمِ زَادَ ابْنُ نُفَيْلٍ فَقَالَ لَهَا أُسَيْدُ بْنُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 317، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 317 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 317، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
