label: { ar: "جامع الترمذي 2063 — الرقية", en: "Jami' al-Tirmidhi 2063 — ruqya recited over the sick", ur: "جامع ترمذی 2063 — رقیہ" }
text: "… اللَّهِ فِي سَرِيَّةٍ فَنَزَلْنَا بِقَوْمٍ فَسَأَلْنَاهُمُ الْقِرَى فَلَمْ يَقْرُونَا فَلُدِغَ سَيِّدُهُمْ فَأَتَوْنَا فَقَالُوا هَلْ فِيكُمْ مَنْ يَرْقِي مِنَ الْعَقْرَبِ قُلْتُ نَعَمْ أَنَا وَلَكِنْ لاَ أَرْقِيهِ حَتَّى تُعْطُونَا غَنَمًا. قَالُوا فَإِنَّا نُعْطِيكُمْ ثَلاَثِينَ شَاةً. فَقَبِلْنَا فَقَرَأْتُ عَلَيْهِ (الْحَمْدُ لِلَّهِ ) سَبْعَ مَرَّاتٍ فَبَرَأَ وَقَبَضْنَا الْغَنَمَ. قَالَ فَعَرَضَ فِي أَنْفُسِنَا مِنْهَا شَيْءٌ فَقُلْنَا لاَ تَعْجَلُوا حَتَّى تَأْتُوا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2063، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2063 (Chapters on Medicine), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2063، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
