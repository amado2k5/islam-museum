label: { ar: "الموطأ 2124 — يحيى عن مالك عن جميل بن عبد الرحمن المؤذن: كان يحضر عمر بن عبد العزيز وهو يقضي بين الناس، فإذا ادعى رجل على رجل حقا نظر، فإن كانت بينهما مخالطة أحلف المدعى عليه، وإلا لم يحلفه", en: "Muwatta 2124" }
summary:
  ar: "قال يحيى: قال مالك عن جميل بن عبد الرحمن المؤذن أنه كان يحضر عمر بن عبد العزيز وهو يقضي بين الناس، فإذا جاءه الرجل يدعي على الرجل حقا نظر، فإن كانت بينهما مخالطة أو ملابسة أحلف الذي ادعي عليه، وإن لم يكن شيء من ذلك لم يحلفه. {cite:muwatta-maruf-1997 p.268}"
