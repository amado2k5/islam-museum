label: { ar: "الموطأ 2124 — يحيى عن مالك عن جميل بن عبد الرحمن المؤذن: كان يحضر عمر بن عبد العزيز وهو يقضي بين الناس، فإذا ادعى رجل على رجل حقا نظر، فإن كانت بينهما مخالطة أحلف المدعى عليه، وإلا لم يحلفه", en: "Muwatta 2124", es: "Muwatta 2124", fr: "Muwatta 2124", ur: "موطا 2124", tr: "El-Muvatta 2124 — Yahya, Malik'ten, o da Cemil ibn Abdülrahman el-Mu'adhdhin'den rivayetle: Ömer ibn Abdülaziz, insanlar arasında hüküm verirken hazır bulunurdu. Bir adam başka bir adama karşı hak iddia ederse, bunu değerlendirirdi. Aralarında akrabalık varsa, davalıya yemin ettirirdi; aksi takdirde yemin ettirmezdi.", id: "Al-Muwatta 2124 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Jamil ibn Abd al-Rahman al-Mu'adhdhin: Umar ibn Abd al-Aziz biasa hadir ketika beliau mengadili perkara antara orang-orang. Jika seseorang mengklaim hak terhadap orang lain, beliau akan mempertimbangkannya. Jika ada hubungan kekerabatan di antara mereka, beliau akan meminta terdakwa untuk bersumpah; jika tidak, beliau tidak akan memintanya untuk bersumpah." }
summary:
  ar: "قال يحيى: قال مالك عن جميل بن عبد الرحمن المؤذن أنه كان يحضر عمر بن عبد العزيز وهو يقضي بين الناس، فإذا جاءه الرجل يدعي على الرجل حقا نظر، فإن كانت بينهما مخالطة أو ملابسة أحلف الذي ادعي عليه، وإن لم يكن شيء من ذلك لم يحلفه. {cite:muwatta-maruf-1997 p.268}"
  tr: "Yahya şöyle dedi: Malik, Cemil ibn Abdülrahman el-Mu'adhdhin'den rivayetle, Ömer ibn Abdülaziz'in insanlar arasında hüküm verdiği zamanlarda orada bulunduğunu söyledi. Bir adam başka bir adama karşı hak iddiasında bulunmak için ona geldiğinde, meseleyi değerlendirirdi. Aralarında herhangi bir etkileşim veya ilişki varsa, iddia edilen kişiye yemin ettirirdi. Böyle bir ilişki yoksa, yemin ettirmezdi. {cite:muwatta-maruf-1997 s.268}"
  id: "Yahya berkata: Malik berkata, berdasarkan riwayat Jamil ibn Abd al-Rahman al-Mu'adhdhin, bahwa ia biasa hadir ketika Umar ibn Abd al-Aziz sedang mengadili perkara antara orang-orang. Jika seseorang datang kepadanya mengklaim hak terhadap orang lain, ia akan mempertimbangkan masalah tersebut. Jika ada interaksi atau hubungan di antara mereka, ia akan meminta orang yang dituntut untuk bersumpah. Jika tidak ada hubungan seperti itu, ia tidak akan memintanya untuk bersumpah. {cite:muwatta-maruf-1997 p.268}"
