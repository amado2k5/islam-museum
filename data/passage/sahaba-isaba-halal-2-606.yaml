text: "… أُكَيمة عن أبيه عن جده قلتُ: هكذا استدركه مغلطاي، وحَرّف اسم والده، قال: أتينا رسول اللّٰه وَلغ، فقال: إِذَا لَمْ تُحِلُّوا حَرَاماً، وإنما هو خَلْدة، كما تقدّم في القسم الأول. وَلَمْ تُحَرِّمُوا حَلاَلاً وَأَصَبتُم الْمَعْنَى فَلاَ بَأْسَ."
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 606، يذكر الحلال، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 606, that mentions the lawful, what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 606 کا اقتباس جس میں حلال، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
