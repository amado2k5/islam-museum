label: { ar: "الموطأ 1980 — يحيى عن مالك عن يحيى بن سعيد عن أبي بكر بن محمد بن عمرو بن حزم عن عمر بن عبد العزيز عن أبي بكر بن عبد الرحمن عن أبي هريرة: أيما رجل أفلس فأدرك الرجل ماله بعينه فهو أحق به من غيره", en: "Muwatta 1980", es: "Muwatta 1980", fr: "Muwatta 1980", ur: "موطا 1980", tr: "El-Muvatta 1980 — Yahya, Malik'ten, o da Yahya bin Said'den, o da Ebu Bekir bin Muhammed bin Amr bin Hazm'dan, o da Ömer bin Abdül Aziz'den, o da Ebu Bekir bin Abdül Rahman'dan, o da Ebu Hurayra'dan rivayet etmiştir: Bir kimse iflas ederse ve başka bir kimse onun parasını aynı şekilde bulursa, o kişinin paraya diğer herkesten daha büyük hakkı vardır.", id: "Al-Muwatta 1980 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Yahya bin Saeed berdasarkan riwayat Abu Bakr bin Muhammad bin Amr bin Hazm berdasarkan riwayat Umar bin Abdul Aziz berdasarkan riwayat Abu Bakr bin Abdul Rahman berdasarkan riwayat Abu Hurairah: Jika seseorang bangkrut dan orang lain menemukan uangnya dalam bentuk aslinya, maka orang tersebut memiliki hak yang lebih besar atas uang itu daripada orang lain." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن أبي بكر بن محمد بن عمرو بن حزم عن عمر بن عبد العزيز عن أبي بكر بن عبد الرحمن بن الحارث بن هشام عن أبي هريرة أن رسول الله قال: أيما رجل أفلس، فأدرك الرجل ماله بعينه، فهو أحق به من غيره. {cite:muwatta-maruf-1997 p.211}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Ebu Bekir ibn Muhammed ibn Amr ibn Hazm'dan, o da Ömer ibn Abdülaziz'den, o da Ebu Bekir ibn Abdülrahman ibn Haris ibn Hişam'dan, o da Ebu Hurayra'dan rivayet eder ki, Allah Resulü şöyle buyurmuştur: \"Bir kimse iflas ederse ve başka bir kimse onun malını tam yerinde bulursa, o kimse o mala diğer herkesten daha fazla hak sahibidir.\" {cite:muwatta-maruf-1997 s.211}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya bin Sa'id, dari Abu Bakar bin Muhammad bin 'Amr bin Hazm, dari Umar bin 'Abd al-'Aziz, dari Abu Bakar bin 'Abd al-Rahman bin al-Harith bin Hisham, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Jika seseorang bangkrut, dan orang lain menemukan hartanya di tempat yang sama persis, maka orang tersebut memiliki hak yang lebih besar atas harta itu daripada orang lain.\" {cite:muwatta-maruf-1997 p.211}"
