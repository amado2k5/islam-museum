label: { ar: "الموطأ 799 — عاتكة بنت زيد امرأة عمر: كانت تقبّل رأس عمر بن الخطاب وهو صائم فلا ينهاها", en: "Muwatta 799", es: "Muwatta 799", fr: "Muwatta 799", ur: "موطا 799", tr: "Al-Muwatta 799 — Ömer'in karısı Atika bint Zayd: Ömer ibn al-Khattab oruçluyken onun başını öperdi ve Ömer de onu yasaklamazdı.", id: "Al-Muwatta 799 — Atika binti Zayd, istri Umar: Ia biasa mencium kepala Umar bin al-Khattab ketika beliau sedang berpuasa, dan beliau tidak melarangnya." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أن عاتكة بنت زيد بن عمرو بن نفيل امرأة عمر بن الخطاب كانت تقبّل رأس عمر بن الخطاب وهو صائم، فلا ينهاها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (353)، ويحيل على المسند الجامع. {cite:muwatta-maruf-1997 p.393} {cite:muwatta-maruf-1997 p.394}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ettiğine göre, Ömer ibn el-Hattab'ın karısı Atika bint Zeyd ibn Amr ibn Nufeyl, Ömer ibn el-Hattab oruçlu iken onun başını öperdi ve Ömer de bunu yasaklamazdı. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan el-Şeybani (353) tarafından rivayet edildiğini belirtiyor ve Musnad el-Cami'ye atıfta bulunuyor. {cite:muwatta-maruf-1997 s.393} {cite:muwatta-maruf-1997 s.394}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id bahwa 'Atika bint Zayd ibn 'Amr ibn Nufayl, istri 'Umar ibn al-Khattab, biasa mencium kepala 'Umar ibn al-Khattab ketika beliau sedang berpuasa, dan beliau tidak melarangnya. Editor menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan al-Shaybani (353), dan beliau merujuk pada Musnad al-Jami'. {cite:muwatta-maruf-1997 p.393} {cite:muwatta-maruf-1997 p.394}"
