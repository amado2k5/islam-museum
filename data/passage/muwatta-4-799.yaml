label: { ar: "الموطأ 799 — عاتكة بنت زيد امرأة عمر: كانت تقبّل رأس عمر بن الخطاب وهو صائم فلا ينهاها", en: "Muwatta 799" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أن عاتكة بنت زيد بن عمرو بن نفيل امرأة عمر بن الخطاب كانت تقبّل رأس عمر بن الخطاب وهو صائم، فلا ينهاها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (353)، ويحيل على المسند الجامع. {cite:muwatta-maruf-1997 p.393} {cite:muwatta-maruf-1997 p.394}"
