text: "… بن زُهْرة عمة عبد الرحمن بن عوف. وكان له من الولد ناقع وصعيد وأُمهما بَرزة بنت مالك بن عبيد اللّٰه بن شهاب بن عبد اللّٰه بن الحارث بن زُهْرة. وكان قديم الإسلام بمكَّة، وهاجر إلى أَرض الحبشة فى الهجرة الثانية …"
