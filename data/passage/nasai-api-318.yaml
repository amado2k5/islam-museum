label: { ar: "سنن النسائي 318 — الأب والأبوة", en: "Sunan al-Nasa'i 318 — the father and fatherhood", ur: "سنن نسائی 318 — باپ اور والدیت", es: "Sunan al-Nasa'i 318 — El padre y la paternidad", fr: "Sunan al-Nasa'i 318 — le père et la paternité" }
text: "أَخْبَرَنَا إِسْمَاعِيلُ بْنُ مَسْعُودٍ، أَنْبَأَنَا خَالِدٌ، أَنْبَأَنَا شُعْبَةُ، عَنِ الْحَكَمِ، سَمِعْتُ ذَرًّا، يُحَدِّثُ عَنِ ابْنِ أَبْزَى، عَنْ أَبِيهِ، قَالَ وَقَدْ سَمِعَهُ الْحَكَمُ، مِنِ ابْنِ عَبْدِ الرَّحْمَنِ قَالَ أَجْنَبَ رَجُلٌ فَأَتَى عُمَرَ - - فَقَالَ إِنِّي أَجْنَبْتُ فَلَمْ أَجِدْ مَاءً. قَالَ لاَ تُصَلِّ. قَالَ لَهُ عَمَّارٌ أَمَا تَذْكُرُ أَنَّا كُنَّا فِي سَرِيَّةٍ فَأَجْنَبْنَا فَلَمْ نَجِدْ مَاءً …"
summary:
  ar: "حديث في سنن النسائي، رقم 318، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 318 (The Book of Purification), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 318، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 318 (El Libro de la Purificación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 318 (Le Livre de la Purification), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
