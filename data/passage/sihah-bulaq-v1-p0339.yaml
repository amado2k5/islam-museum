text: |-
  ٣٠٢
  ⁦(باب الرا.)⁩
  ⁦(حر)⁩
  واحبنجرأى انتفخ من الغضب ⁦(حبكر )⁩ الحبوكررمل يضل فيه السالل والموكر
  الداهيسة وكذلات الحبوكرى وأم جبوكرهى أعظم الدواهى قال عرو بن أحر الباهلى
  فلما عسالي-لى وأيقنت أنها * هى الاربى جاءت بأم حبوكر
  ويقال جل حبوكرى والالف زائدة بنى الاسم عليها وايست لاتأنيث لانك تقول للانى
  حبوكراة وكل ألف للتأنيث لا يضح دخول هاء التأنيث عليها وليست أيض اللالحاق لانه ايس له
  مثال من الاصول فيطحق به ( حتر المتر بالكسر العطية اليسيرة وبالفتح المصدرتقول
  حترت له شيئا احترحترا قال الاصعمى فاذا قالوا أقل واحترّ قالوه بالالف قال الشنفرى
  وأم عيال قد شهدت تقوتهم • اذا أطعمتهم أحترت وأقلت
  وأحترت العقدة أحكمتها والحتار الكفاف وكل ما أحاط بالشئ واستداربه فهوحتاره
  وكفافه والجمع حتر يقال حترت البيت حترا وذلك اذا ارتفع أسفل الخباء عن الارض وقاص
  فوصات به مايكون سترا والحترة بالضم الوكيرة يقسال حترلنا أى وكرلنا وماحترت اليوم شيئًا
  أى ماذقت والحترة بالفتح الرضعة الواحدة حنر قال حنرت عينه بالكسر تحثراذاخرج
  فيها حب أحرودو بنريخرج فى الاجفان وحنر الدبس أيضاتحبب وحنرا بالدبتر قال الراجز
  رأيت شيخاحثر الملامج وهى ماحول الفم والحوثرة حشفة الانسان والحواثربطن من عبد
  القيس قال المتلس نعم المواثر اذتساق لمعبد وحثارة التبن لفسة فى الحثالة ويقال
  - أحتر النخل اذا تشقق طلعه وكان حبه كاءثرات الصفار قبل أن يصير خصلا ⁦(حجر)⁩ الحجر
  جمه فى القلة أحمار وفى الكترة حجار وجمارة كقولات بمل وبهالة وذكروذ كارة وهونادر
  وحجرأيضا اسم رجل ومنه أوس بن حجر الشاء ر والحجران الذهب والفضة والحجرسا كن مصدر
  قولك جر عليه القاضى محجر حجرا اذا منعه من التصرف فى ماله والجراً يضاقصبة اليمامة
  بذكرويونت وجر الانسان وجره بالفتح والسكسر والجمع حود والحجر الحرام بكسم
  ويضم ويفتح والكسر أفصح وقرئ به-ن وله تعالى وحرث حجر ويقول المشركون يوم
  القيامة اذارأواملئكة العذاب حجرامحجورا أى حراما محرّما يظنون أن ذلك ينفعهم كما كانوا
  يقولونه فى الدار الدنيا لن يخافونه فى الشهر الحرام وحجرة القوم ناحية دارهم وفى المئ-ل
  يربض حمرة ويرتعى وسطاوالجمع جرات وجرمثل جرة وجروجرات ويقال للرجل اذا
  كثر ماله انتشرت حجرته والعرب تقول عند الامر تنكره حجرابالضم أى دفعا وهواستعاذة
  من الامر قال الراجز قالت وفيها حيدة وذعر * عوذبربى منكم وحجر
  وحجرأيضااسم رجل وهو حجر الكندى الذى يقال له آكل المرار وحجر بن عدىّ الذى بقال
  له الادبرويجوز حجر مثل عسروسر قال حسان بن ثابت
  من يغر الدهر أويأمنه * من قتيل بعد عم رووحجر
  يعنى حجر بن نعمان بن الحرث بن أبى شهر الغسانى والجرة حظيرة الابل ومفسه حجرة الدار
  تقول احتجرت حجرة أى اتخذتها والمع حجر مثل غرفة وغرف وحجرات بنم الجسيم والحجر
  العقل قال اللّٰه تعالى هل فى ذلك قسم لذى حجر والمجرأ يضا حجر الكعبة وهوماحواه الحطيم
  المداربالبيت جانب الشمال وكل ماتجرته من حائط فهوجر والجر منازل تمود ناحية الشام
