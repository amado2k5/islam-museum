label: { ar: "سنن أبي داود 4963 — مغفرة ما تقدم من الذنب", en: "Sunan Abi Dawud 4963 — forgiveness of past sins", ur: "سنن ابی داؤد 4963 — پچھلے گناہوں کی مغفرت" }
text: "… عُمَرَ بْنَ الْخَطَّابِ، ضَرَبَ ابْنًا لَهُ تَكَنَّى أَبَا عِيسَى وَأَنَّ الْمُغِيرَةَ بْنَ شُعْبَةَ تَكَنَّى بِأَبِي عِيسَى فَقَالَ لَهُ عُمَرُ أَمَا يَكْفِيكَ أَنْ تُكَنَّى بِأَبِي عَبْدِ اللَّهِ فَقَالَ إِنَّ رَسُولَ اللَّهِ كَنَّانِي فَقَالَ إِنَّ رَسُولَ اللَّهِ قَدْ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ وَمَا تَأَخَّرَ وَإِنَّا فِي جَلْجَلَتِنَا فَلَمْ يَزَلْ يُكْنَى بِأَبِي عَبْدِ اللَّهِ حَتَّى هَلَكَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4963، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 4963 (General Behavior (Kitab Al-Adab)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 4963، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
