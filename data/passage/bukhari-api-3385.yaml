text: "… حَدَّثَنَا زَائِدَةُ، عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، عَنْ أَبِي بُرْدَةَ بْنِ أَبِي مُوسَى، عَنْ أَبِيهِ، قَالَ مَرِضَ النَّبِيُّ فَقَالَ \" مُرُوا أَبَا بَكْرٍ فَلْيُصَلِّ بِالنَّاسِ \". فَقَالَتْ إِنَّ أَبَا بَكْرٍ رَجُلٌ. فَقَالَ مِثْلَهُ فَقَالَتْ مِثْلَهُ. فَقَالَ \" مُرُوهُ فَإِنَّكُنَّ صَوَاحِبُ يُوسُفَ \". فَأَمَّ أَبُو بَكْرٍ فِي حَيَاةِ رَسُولِ اللَّهِ. فَقَالَ حُسَيْنٌ عَنْ زَائِدَةَ رَجُلٌ رَقِيقٌ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3385، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3385 (Prophets), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3385، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
