summary:
  ar: "القسم 71 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العقيقة»، ويضم فيها النصوص من 5467 إلى 5474 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 71 of Sahih al-Bukhari (Sacrifice on Occasion of Birth (`Aqiqa)) in the division of the open hadith dataset the museum took its reports from: reports 5467 to 5474 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 71، عنوان «کتاب العقیقۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5467 تا 5474۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 71 de Sahih al-Bukhari (Sacrificio con motivo del nacimiento (`Aqiqa)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5467 al 5474 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 71, Sacrifice à l'occasion de la naissance (`Aqiqa)), qui comprend les hadiths 5467 à 5474. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 71. bölümü \"Akika Kitabı\" başlığını taşımakta olup, sırasıyla 5467 ila 5474 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 71 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Aqiqah\" dan berisi teks 5467 hingga 5474, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
