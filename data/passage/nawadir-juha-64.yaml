text: "… رجلي اليسرى غير متوضئة توضاً ذاتَ يوم، وكان الماءُ قليلاً فبقِيَتْ رجلُهُ اليسرى بغيرِ غسل، فلمَّا وقفَ لِلصلاة رفعَها كما يرَفَعُ الأوزْ رجلَه، فقالوا له: ماذا تصنع؟ فقال: رجلي اليسرى غيرُ متوضئة!.. كيف أعرف جانبي الأيمن؟ جاءه ضيف ونامَ عندَهُ، …"
summary:
  ar: "غسل جحا بعض جسده فقط بقليل من الماء، وفي الصلاة رفع قدمه اليسرى كالإوزة وقال إن قدمه اليسرى غير متوضئة. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  en: "Juha washes only part of himself with a little water, and at prayer lifts his left foot like a goose, saying that his left foot is not washed. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  ur: "جحا نے تھوڑے سے پانی سے جسم کا صرف کچھ حصہ دھویا، اور نماز میں اپنا بایاں پاؤں قاز کی طرح اٹھائے رکھا اور کہا کہ میرا بایاں پاؤں دھلا نہیں ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  fr: "Juha ne lave qu'une partie de son corps avec peu d'eau, et à la prière lève le pied gauche comme une oie en disant que son pied gauche n'est pas lavé. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
  es: "Juha se lava solo una parte del cuerpo con poca agua y, en la oración, levanta el pie izquierdo como un ganso diciendo que su pie izquierdo no está lavado. {cite:juha-nawadir-kubra-djuwaydi p. 36}"
