label: { ar: "صحيح البخاري 3912 — الفرض", en: "Sahih al-Bukhari 3912 — the obligatory (fard)", ur: "صحیح بخاری 3912 — فرض", fr: "Sahih al-Bukhari 3912 — l'obligatoire (fard)", es: "Sahih al-Bujari 3912 — lo obligatorio (fard)" }
text: "… عَنِ ابْنِ جُرَيْجٍ، قَالَ أَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ عُمَرَ، عَنْ نَافِعٍ يَعْنِي، عَنِ ابْنِ عُمَرَ، عَنْ عُمَرَ بْنِ الْخَطَّابِ، قَالَ كَانَ فَرَضَ لِلْمُهَاجِرِينَ الأَوَّلِينَ أَرْبَعَةَ آلاَفٍ فِي أَرْبَعَةٍ، وَفَرَضَ لاِبْنِ عُمَرَ ثَلاَثَةَ آلاَفٍ وَخَمْسَمِائَةٍ فَقِيلَ لَهُ هُوَ مِنَ الْمُهَاجِرِينَ، فَلِمَ نَقَصْتَهُ مِنْ أَرْبَعَةِ آلاَفٍ فَقَالَ إِنَّمَا هَاجَرَ بِهِ أَبَوَاهُ. يَقُولُ لَيْسَ هُوَ كَمَنْ هَاجَرَ بِنَفْسِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3912، يرد فيه ذكر الفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 3912 (Merits of the Helpers in Madinah (Ansaar)), whose wording mentions the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 3912، جس کے الفاظ میں فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 3912, dont le texte mentionne l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 3912, cuyo texto menciona lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
