text: "… الضير، فشهد أحداً فقتل به، فقال النبى : مخيريق سابق يهود، وأوصى مخيريق بأمواله للنبى ومن طريق الواقدى بسنده عن عبد اللّه بن كعب قال قال مخيريق إن أصبت فأموالى لمحمد يضعها حيث أراه اللّٰه فهى عامة صدقة رسول اللّٰه، …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 234، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 234, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 234 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
