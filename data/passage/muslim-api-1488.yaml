label: { ar: "صحيح مسلم 1488 — عدد الحسنات، كتابة الحسنات", en: "Sahih Muslim 1488 — a stated number of good deeds; the writing of good deeds", ur: "صحیح مسلم 1488 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا", es: "Sahih Muslim 1488 — un número determinado de buenas obras; el registro de buenas obras", fr: "Sahih Muslim 1488 — un nombre énuméré de bonnes actions; la rédaction des bonnes actions", tr: "Sahih Muslim 1488 — İyi amellerin sayısı, iyi amellerin yazılması", id: "Sahih Muslim 1488 — Jumlah amal kebaikan, mencatat amal kebaikan" }
text: "… نَبِيِّكُمْ وَلَوْ تَرَكْتُمْ سُنَّةَ نَبِيِّكُمْ لَضَلَلْتُمْ وَمَا مِنْ رَجُلٍ يَتَطَهَّرُ فَيُحْسِنُ الطُّهُورَ ثُمَّ يَعْمِدُ إِلَى مَسْجِدٍ مِنْ هَذِهِ الْمَسَاجِدِ إِلاَّ كَتَبَ اللَّهُ لَهُ بِكُلِّ خَطْوَةٍ يَخْطُوهَا حَسَنَةً وَيَرْفَعُهُ بِهَا دَرَجَةً وَيَحُطُّ عَنْهُ بِهَا سَيِّئَةً وَلَقَدْ رَأَيْتُنَا وَمَا يَتَخَلَّفُ عَنْهَا إِلاَّ مُنَافِقٌ مَعْلُومُ النِّفَاقِ وَلَقَدْ كَانَ الرَّجُلُ يُؤْتَى بِهِ يُهَادَى بَيْنَ الرَّجُلَيْنِ حَتَّى يُقَامَ فِي الصَّفِّ."
summary:
  ar: "حديث في صحيح مسلم، رقم 1488، يذكر عدد الحسنات، وكتابة الحسنات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 1488 (The Book of Mosques and Places of Prayer), that speaks of a stated number of good deeds, the writing of good deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 1488، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 1488 (El Libro de las Mezquitas y Lugares de Oración), habla de un número determinado de buenas acciones, su registro, la eliminación de malas acciones y la purificación de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, registran, borran o valoran una acción."
  fr: "Un hadith du Sahih Muslim, n° 1488 (Livre des Mosquées et des Lieux de Prière), mentionne un nombre précis de bonnes actions, leur inscription, l'effacement des mauvaises actions et l'expiation des péchés. Le Hasanat and Sayyi'at Ledger le recense parmi les textes traitant du dénombrement, de l'inscription, de l'effacement ou de la pesée des actes."
  tr: "Sahih Müslim'de 1488 numaralı hadis, iyi amellerin sayısını, iyi amellerin kaydedilmesini, kötü amellerin silinmesini ve günahların kaldırılmasını anlatır. İyi ve kötü amellerin listesini ve amelleri sayan, kaydeden, silen veya tartan ayetleri içerir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 1488, menyebutkan tentang jumlah amal kebaikan, pencatatan amal kebaikan, penghapusan amal buruk, dan penghapusan dosa. Hadits ini memuat daftar amal baik dan buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan-perbuatan tersebut."
