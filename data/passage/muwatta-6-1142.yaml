label: { ar: "الموطأ 1142 — مالك: الشاة هي الهدي الذي يحكم به في الجزاء، وهو الذي لا خلاف فيه عنده", en: "Muwatta 1142" }
summary:
  ar: "يقول مالك إن الحكم في الجزاء بالهدي شاة، لأن الله سماها هديا في كتابه، وهذا عنده لا خلاف فيه. وكل ما لا يبلغ أن يحكم فيه ببعير أو بقرة فالحكم فيه بشاة، وما لا يبلغ شاة ففيه الكفارة من صيام أو إطعام مساكين. {cite:muwatta-maruf-1997 p.518}"
