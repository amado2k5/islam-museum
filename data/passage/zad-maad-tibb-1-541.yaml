  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 541, that mentions medicine and the physician, illness and the sick, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 541 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
