text: "… هذا التنكرَ والوحشة كانا لأهل النفاق أعظم، ولكن لموت قلوبهم لم يكونوا يشعرون به، وهكذا القلبُ إذا استحكم مرضُه، واشتد ألمُه بالذنوب والإجرام، لم يجد هذه الوحشة والتنكر، من عافية هذا المرض، وأعيا الأطباء شِفاؤه، والخوفُ والهمُّ مع الريبة، والأمنُ …"
