text: "باب مَا جَاءَ فِي طَلَبِ الْعِلْمِ حَدَّثَنِي عَنْ مَالِكٌ، أَنَّهُ بَلَغَهُ أَنَّ لُقْمَانَ الْحَكِيمَ، أَوْصَى ابْنَهُ فَقَالَ يَا بُنَىَّ جَالِسِ الْعُلَمَاءَ وَزَاحِمْهُمْ بِرُكْبَتَيْكَ فَإِنَّ اللَّهَ يُحْيِي الْقُلُوبَ بِنُورِ الْحِكْمَةِ كَمَا يُحْيِي اللَّهُ الأَرْضَ الْمَيْتَةَ بِوَابِلِ السَّمَاءِ"
summary:
  ar: "حديث في موطأ مالك، رقم 1856، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1856 (Knowledge), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "موطأ مالک کی حدیث نمبر 1856، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1856 (Conocimiento), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
