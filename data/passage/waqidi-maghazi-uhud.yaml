ref: "199"
label: { ar: "غزوة أحد — استشهاد حمزة وصفية بنت عبد المطلب", en: "Battle of Uhud — the martyrdom of Hamza and Safiyya bint Abd al-Muttalib" }
text: "لما أصيب حمزة جاءت صفية بنت عبد المطلب تطلبه، فحالت بينها وبينه الأنصار، فقال رسول الله: دعوها! فجلست عنده فجعلت إذا بكت بكى رسول الله، وإذا نشجت ينشج رسول الله"
summary:
  ar: "يفصّل الواقدي مشهد استشهاد حمزة يوم أحد، فمشى وحش إلى موضعه، ثم جاءت صفية بنت عبد المطلب — خالة النبي وزوجة الحمزة — تطلبه فأذنت لها أن تجلس عنده، وكانت تبكي فبكى النبي معها. ويذكر فصل غزوة حمراء الأسد في نفس الباب، حيث كانت صفية أيضاً فيمن خرج من المدينة."
  en: "Waqidi details Hamza's martyrdom at Uhud and the scene when Safiyya bint Abd al-Muttalib — the Prophet's aunt and Hamza's widow — came seeking his body; the Prophet let her sit by him as she wept, and he wept with her. The same chapter closes with the raid on Hamra' al-Asad."
