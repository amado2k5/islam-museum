label: { ar: "غزوة أحد — استشهاد حمزة وصفية بنت عبد المطلب", en: "Battle of Uhud — the martyrdom of Hamza and Safiyya bint Abd al-Muttalib", es: "Batalla de Uhud: el martirio de Hamza y Safiyya bint Abd al-Muttalib", fr: "Bataille d'Uhud - le martyre de Hamza et Safiyya bint Abd al-Muttalib", ur: "جنگ احد - حمزہ اور صفیہ بنت عبدالمطلب کی شہادت", tr: "Uhud Savaşı — Hamza ve Safiyya bint Abdülmuttalib'in Şehitliği", id: "Perang Uhud — Kemartiran Hamza dan Safiyya bint Abd al-Muttalib" }
text: "لما أصيب حمزة جاءت صفية بنت عبد المطلب تطلبه، فحالت بينها وبينه الأنصار، فقال رسول الله: دعوها! فجلست عنده فجعلت إذا بكت بكى رسول الله، وإذا نشجت ينشج رسول الله"
summary:
  ar: "يفصّل الواقدي مشهد استشهاد حمزة يوم أحد، فمشى وحش إلى موضعه، ثم جاءت صفية بنت عبد المطلب — خالة النبي وزوجة الحمزة — تطلبه فأذنت لها أن تجلس عنده، وكانت تبكي فبكى النبي معها. ويذكر فصل غزوة حمراء الأسد في نفس الباب، حيث كانت صفية أيضاً فيمن خرج من المدينة."
  en: "Waqidi details Hamza's martyrdom at Uhud and the scene when Safiyya bint Abd al-Muttalib — the Prophet's aunt and Hamza's widow — came seeking his body; the Prophet let her sit by him as she wept, and he wept with her. The same chapter closes with the raid on Hamra' al-Asad."
  es: "Waqidi detalla el martirio de Hamza en Uhud y la escena en la que Safiyya bint Abd al-Muttalib —tía del Profeta y viuda de Hamza— acudió en busca de su cuerpo; el Profeta la dejó sentarse a su lado mientras lloraba, y él lloró con ella. El mismo capítulo concluye con el ataque a Hamra' al-Asad."
  fr: "Waqidi relate le martyre d'Hamza à Uhud et la scène où Safiyya bint Abd al-Muttalib, la tante du Prophète et veuve d'Hamza, vint réclamer sa dépouille; le Prophète la laissa s'asseoir près de lui tandis qu'elle pleurait, et il pleura avec elle. Le même chapitre s'achève sur le raid contre Hamra' al-Asad."
  ur: "واقدی نے احد میں حمزہ کی شہادت اور اس منظر کی تفصیلات بیان کی ہیں جب صفیہ بنت عبدالمطلب - رسول اللہ کی خالہ اور حمزہ کی بیوہ - ان کی لاش ڈھونڈنے آئیں۔ نبی نے اسے اپنے پاس بٹھا دیا جب وہ رو رہی تھی اور وہ بھی اس کے ساتھ رونے لگے۔ اسی باب کا اختتام حمرہ الاسد پر چھاپے کے ساتھ ہوتا ہے۔"
  tr: "El-Vakidi, Hamza'nın Uhud Savaşı'ndaki şehit edilişini ayrıntılı olarak anlatır. Vahş onun yanına gitti, sonra Peygamberin teyzesi ve Hamza'nın eşi Safiyye bint Abdülmuttalib onu aramaya geldi. Peygamber onun yanına oturmasına izin verdi ve Safiyye ağlıyordu, bu yüzden Peygamber de onunla birlikte ağladı. Aynı bölümde, Safiyye'nin de Medine'den ayrılanlar arasında olduğu Hamra' el-Esad Savaşı'ndan da bahseder."
  id: "Al-Waqidi merinci peristiwa kemartiran Hamza pada Perang Uhud. Wahsh pergi ke tempatnya, kemudian Safiyya binti Abd al-Muttalib—bibi Nabi dan istri Hamza—datang mencarinya. Nabi mengizinkannya duduk bersamanya, dan ia menangis, sehingga Nabi ikut menangis bersamanya. Ia juga menyebutkan Perang Hamra' al-Asad dalam bab yang sama, di mana Safiyya juga termasuk di antara mereka yang meninggalkan Madinah."
