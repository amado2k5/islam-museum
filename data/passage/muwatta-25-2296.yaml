label: { ar: "الموطأ 2296 — مالك: مكاتبة نصيب الشريك في عبد مشترك", en: "Muwatta 2296", es: "Muwatta 2296", fr: "Muwatta 2296", ur: "موطا 2296", tr: "Al-Muwatta 2296 — Malik: Ortak mülkiyetteki bir kölenin ortak payının azat edilmesine ilişkin sözleşme", id: "Al-Muwatta 2296 — Malik: Perjanjian pembebasan bagian seorang mitra dalam budak yang dimiliki bersama" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في العبد يكون بين رجلين: إن أحدهما لا يكاتب نصيبه منه، أذن له شريكه أو لم يأذن، إلا أن يكاتباه جميعا، لأن ذلك يعقد له عتقا. فيصير إذا أدى ما كوتب عليه إلى أن يعتق نصفه، ولا يلزم الذي كاتب بعضه أن يتم عتقه، وذلك لحديث من أعتق شركا له في عبد. {cite:muwatta-maruf-1997 p.346}"
  tr: "Malik şöyle dedi: İki erkek arasında köle konusunda aramızdaki yerleşik uygulama şudur: Partneri izin verse de vermese de, tek başına kölenin kendi payı için bir azat sözleşmesi yapamaz; çünkü bu, her ikisi de böyle bir sözleşme yaparsa kölenin azat edilmesi sayılır. Dolayısıyla, eğer sözleşmede anlaştığı şartları yerine getirirse, kölenin yarısı azat edilmiş olur ve kölenin bir kısmı için sözleşme yapanın azatını tamamlaması gerekmez. Bu, şu hadise dayanmaktadır: \"Kim bir kölenin kendi payını azat ederse...\""
  id: "Malik berkata: Kebiasaan yang telah mapan di antara kita mengenai budak antara dua orang adalah bahwa salah satu dari mereka tidak dapat membuat perjanjian pembebasan untuk bagiannya dari budak tersebut, baik pasangannya mengizinkannya atau tidak, kecuali jika keduanya membuat perjanjian tersebut, karena itu merupakan pembebasan. Dengan demikian, jika ia memenuhi apa yang telah disepakati dalam perjanjian tersebut, setengah dari dirinya akan dibebaskan, dan orang yang membuat perjanjian untuk sebagian dari dirinya tidak berkewajiban untuk menyelesaikan pembebasannya. Hal ini berdasarkan hadits: “Barangsiapa membebaskan bagiannya dalam seorang budak"
