label: { ar: "الموطأ 2296 — مالك: مكاتبة نصيب الشريك في عبد مشترك", en: "Muwatta 2296" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في العبد يكون بين رجلين: إن أحدهما لا يكاتب نصيبه منه، أذن له شريكه أو لم يأذن، إلا أن يكاتباه جميعا، لأن ذلك يعقد له عتقا. فيصير إذا أدى ما كوتب عليه إلى أن يعتق نصفه، ولا يلزم الذي كاتب بعضه أن يتم عتقه، وذلك لحديث من أعتق شركا له في عبد. {cite:muwatta-maruf-1997 p.346}"
