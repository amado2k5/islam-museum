text: "… الإِنسان كما يذهب الكير من خبث الحديد. - أَخبرنا معمر عن الزهري عن ابن المسيِّب عن أَبي هريرة قال : قال رسول اللّٰه عليل : مثل المؤمن كمثل الزرع لا تزال الريح تفيئه، ولا يزال المؤمن يصيبه بلاؤه، ومثل المنافق …"
summary:
