label: { ar: "سنن النسائي 3795 — ما أُحل", en: "Sunan al-Nasa'i 3795 — what was made lawful", ur: "سنن نسائی 3795 — جو حلال کیا گیا", es: "Sunan al-Nasa'i 3795 — lo que se hizo lícito" }
text: "… عَلَى إِحْدَاهُمَا فَقَالَتْ ذَلِكَ لَهُ فَقَالَ \" لاَ بَلْ شَرِبْتُ عَسَلاً عِنْدَ زَيْنَبَ بِنْتِ جَحْشٍ وَلَنْ أَعُودَ لَهُ \". فَنَزَلَتْ { يَا أَيُّهَا النَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ } إِلَى { إِنْ تَتُوبَا إِلَى اللَّهِ } عَائِشَةُ وَحَفْصَةُ { وَإِذْ أَسَرَّ النَّبِيُّ إِلَى بَعْضِ أَزْوَاجِهِ حَدِيثًا } لِقَوْلِهِ \" بَلْ شَرِبْتُ عَسَلاً \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3795، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3795 (The Book of Agriculture), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3795، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3795 (El Libro de la Agricultura), menciona lo que se considera lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
