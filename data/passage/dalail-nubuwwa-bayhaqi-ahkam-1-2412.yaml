text: "… في حصن حصين قال ابن حجر : يعني أرض دوس. ومنعة بفتح النون وإسكانها، وهي العزة والامتناع. وقيل : منعة جمع مانع كظلمة وظالم أي جماعة يمنعوك ممن يقصدك بمكروه. فاجتووا المدينة معناه كرهوا المقام بها لضجر ونوع من سقم. …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2412، يرد فيه ذكر المكروه، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 2412, whose wording mentions the disliked (makruh), what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2412 کا اقتباس جس میں مکروہ، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Dala'il al-Nubuwwa de al-Bayhaqi, volume numérisé 1, p. 2412, dont le texte mentionne le réprouvé (makruh), ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen digitalizado 1, p. 2412, cuyo texto menciona lo reprobado (makruh), lo que los juristas reprobaron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"Delil el-Nübüvve\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 2412. sayfasından bir alıntı, mekruh sayılan, fıkıhçıların mekruh saydığı ve mekruh sayılan şeylerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu alıntı, farz olan ameller, itaat amelleri, tavsiye edilen ameller, mekruh sayılan ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi \"Dala'il al-Nubuwwah\" (Bukti Kenabian), Jilid 1, halaman 2412, menyebutkan apa yang tidak disukai, apa yang tidak disukai oleh para ahli fiqih, dan apa yang dianggap tidak disukai. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
