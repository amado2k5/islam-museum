text: "… والسلام علىٰ نبينا الأمين، محمد وآله وصحبه أجمعين. وبعد... فقد كان هدفنا في التعليق علىٰ القراءات في تفسير القرآن العظيم للإمام ابن كثير : بيان القراءات بأوجهها المختلفة معزوةً إلى من قرأ بها من القراء؛ فإذا أشار الإمام إلى وجه …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 107، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 107, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 107 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 1, pág. 107, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
