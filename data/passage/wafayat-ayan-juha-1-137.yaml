text: "وجمع كتاباً يحتوي على فنون الشعر على وضع الحماسة لأبي تمام الطائي، وسماه صفوة الأدب وديوان العرب وهو كثير الوجود بأيدي الناس، وهو عند أهل المغرب كالحماسة عند أهل المشرق. والمقصود من ذكر هذا الأديب أنه كانت له نوادر نادرة …"
