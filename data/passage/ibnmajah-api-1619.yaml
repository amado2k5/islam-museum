text: "… عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، قَالَتْ: كَانَ النَّبِيُّ ـ يَتَعَوَّذُ بِهَؤُلاَءِ الْكَلِمَاتِ \" أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ. وَاشْفِ أَنْتَ الشَّافِي لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ شِفَاءً لاَ يُغَادِرُ سَقَمًا \". فَلَمَّا ثَقُلَ النَّبِيُّ ـ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ أَخَذْتُ بِيَدِهِ فَجَعَلْتُ أَمْسَحُهُ وَأَقُولُهَا. فَنَزَعَ يَدَهُ مِنْ يَدِي ثُمَّ قَالَ: \" اللَّهُمَّ اغْفِرْ لِي وَأَلْحِقْنِي بِالرَّفِيقِ الأَعْلَى …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1619، يذكر مرض النبي، والمرض والمريض، والسقم، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1619 (Chapters Regarding Funerals), that mentions the Prophet's illness, illness and the sick, sickness, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1619، جس میں نبی کی بیماری، بیماری اور بیمار، سقم، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
