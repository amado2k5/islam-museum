label: { ar: "سنن ابن ماجه 1619 — مرض النبي، المرض والمريض", en: "Sunan Ibn Majah 1619 — the Prophet's illness; illness and the sick", ur: "سنن ابن ماجہ 1619 — نبی کی بیماری، بیماری اور بیمار", es: "Sunan Ibn Majah 1619 — La enfermedad del Profeta; la enfermedad y los enfermos", fr: "Sunan Ibn Majah 1619 — La maladie du Prophète; la maladie et les malades", tr: "Sunan İbn Majah 1619 — Peygamberin Hastalığı, Hastalık ve Hasta", id: "Sunan Ibn Majah 1619 — Penyakit Nabi, Penyakit dan Pasien" }
text: "… عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، قَالَتْ: كَانَ النَّبِيُّ ـ يَتَعَوَّذُ بِهَؤُلاَءِ الْكَلِمَاتِ \" أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ. وَاشْفِ أَنْتَ الشَّافِي لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ شِفَاءً لاَ يُغَادِرُ سَقَمًا \". فَلَمَّا ثَقُلَ النَّبِيُّ ـ فِي مَرَضِهِ الَّذِي مَاتَ فِيهِ أَخَذْتُ بِيَدِهِ فَجَعَلْتُ أَمْسَحُهُ وَأَقُولُهَا. فَنَزَعَ يَدَهُ مِنْ يَدِي ثُمَّ قَالَ: \" اللَّهُمَّ اغْفِرْ لِي وَأَلْحِقْنِي بِالرَّفِيقِ الأَعْلَى …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1619، يذكر مرض النبي، والمرض والمريض، والسقم، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1619 (Chapters Regarding Funerals), that mentions the Prophet's illness, illness and the sick, sickness, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1619، جس میں نبی کی بیماری، بیماری اور بیمار، سقم، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1619 (Capítulos sobre los funerales), menciona la enfermedad del Profeta, la enfermedad y los enfermos, la enfermedad y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 1619 (Chapitres relatifs aux funérailles), mentionne la maladie du Prophète, la maladie et les malades, ainsi que la guérison. Le Répertoire des ressources médicales le répertorie parmi les textes traitant de la médecine prophétique, de la médecine, de l'anatomie, de la chirurgie, des médicaments et des traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 1619 numaralı hadiste, Peygamberimizin hastalığı, hastalığı ve hastayı, rahatsızlığı ve iyileşmeyi konu alan hadisler anlatılmaktadır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1619, menyebutkan penyakit Nabi, penyakit dan pasiennya, sakit, dan kesembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
