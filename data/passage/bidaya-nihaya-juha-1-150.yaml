text: "… من الأعيان في هذه السنة من المشاهير. أبو القاسم علي بن الشيخ أبي الفرج بن الجوزي كان شيخاً لطيفاً ظريفاً، سمع الكثير وعمل صناعة الوعظ مدة، ثم ترك ذلك، وكان يحفظظ شيئا كثيراً من الأخبار والنوادر والأشعار، ولد سنة إحدى …"
