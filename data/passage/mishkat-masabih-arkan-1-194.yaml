summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 194، يذكر حلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
