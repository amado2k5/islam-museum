label: { ar: "الموطأ 866 — عائشة: كان رسول الله إذا اعتكف يدني إلي رأسه فأرجله، وكان لا يدخل البيت إلا لحاجة الإنسان", en: "Muwatta 866", es: "Muwatta 866", fr: "Muwatta 866", ur: "موطا 866", tr: "Al-Muwatta 866 — Aişe: Allah'ın Resulü tenha kaldığında, saçını taramam için başını bana yaklaştırırdı ve insani ihtiyaçlar dışında eve girmezdi.", id: "Al-Muwatta 866 — Aisyah: Ketika Rasulullah SAW sedang menyendiri, beliau mendekatkan kepalanya kepadaku agar aku bisa menyisir rambutnya, dan beliau tidak masuk rumah kecuali untuk keperluan buang air." }
text: "كان رسول الله إذا اعتكف يدني إلي رأسه فأرجله، وكان لا يدخل البيت إلا لحاجة الإنسان"
summary:
  ar: "أول حديث في كتاب الاعتكاف وفي باب ذكر الاعتكاف. يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عمرة بنت عبد الرحمن عن عائشة زوج النبي، أنها قالت: كان رسول الله إذا اعتكف يدني إلي رأسه فأرجله، وكان لا يدخل البيت إلا لحاجة الإنسان. ويذكر المحقق أنه رواه عن مالك أبو مصعب (860) وإسحاق الطباع وسويد وعامر بن صالح ويحيى بن يحيى النيسابوري عند مسلم، ويحيل على تعليقه على الترمذي (2/157). {cite:muwatta-maruf-1997 p.419}"
  id: "Hadits pertama dalam Kitab I'tikaf, dalam bab tentang penyebutan I'tikaf. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Amrah binti Abd al-Rahman, dari Aisyah, istri Nabi, bahwa dia berkata: Ketika Rasulullah shalla Allahu alaihi wa sallam sedang beritikaf, beliau mendekatkan kepalanya kepadaku agar aku dapat menyisir rambutnya, dan beliau tidak masuk rumah kecuali untuk keperluan buang air. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (860), Ishaq al-Tabba', Suwaid, Amir ibn Salih, dan Yahya ibn Yahya al-Naysaburi dalam kumpulan hadits Muslim, dan ia merujuk pada tafsirnya pada al-Tirmidhi (2/157). {cite:muwatta-maruf-1997 p.419}"
