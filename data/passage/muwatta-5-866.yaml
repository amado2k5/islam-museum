label: { ar: "الموطأ 866 — عائشة: كان رسول الله إذا اعتكف يدني إلي رأسه فأرجله، وكان لا يدخل البيت إلا لحاجة الإنسان", en: "Muwatta 866" }
text: "كان رسول الله إذا اعتكف يدني إلي رأسه فأرجله، وكان لا يدخل البيت إلا لحاجة الإنسان"
summary:
  ar: "أول حديث في كتاب الاعتكاف وفي باب ذكر الاعتكاف. يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عمرة بنت عبد الرحمن عن عائشة زوج النبي، أنها قالت: كان رسول الله إذا اعتكف يدني إلي رأسه فأرجله، وكان لا يدخل البيت إلا لحاجة الإنسان. ويذكر المحقق أنه رواه عن مالك أبو مصعب (860) وإسحاق الطباع وسويد وعامر بن صالح ويحيى بن يحيى النيسابوري عند مسلم، ويحيل على تعليقه على الترمذي (2/157). {cite:muwatta-maruf-1997 p.419}"
