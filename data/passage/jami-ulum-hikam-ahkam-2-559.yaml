text: "… عُضوٍ منه نعي اللهمَّ لا تجعلنا ممن يتقوَّى بنعمك على معصيتك. الدرجة الثانية من الشكر : الشكر المستحبُّ، وهو أنْ يعملَ العبدُ بعد أداءِ الفرائض، واجتنابِ المحارم بنوافل الطَّاعات، وهذه درجةُ السَّابقين المقرَّبين، وهي التي أرشد إليها النَّبيُّ وَلِيِ في …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 559، يرد فيه ذكر الفريضة والفرائض، والطاعات، والمستحب، والنافلة والنوافل، والمحارم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 559, whose wording mentions the obligation (farida), the acts of obedience, the recommended (mustahabb), the supererogatory (nafila), the forbidden things (maharim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 559 کا اقتباس جس میں فریضہ اور فرائض، طاعات، مستحب، نفل اور نوافل، محارم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volume numérisé 2, p. 559, dont le texte mentionne l'obligation (farida), les actes d'obéissance, le recommandé (mustahabb), le surérogatoire (nafila), les interdits (maharim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen digitalizado 2, p. 559, cuyo texto menciona la obligación (farida), los actos de obediencia, lo recomendado (mustahabb), lo supererogatorio (nafila), lo vedado (maharim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 559. sayfasından, farz olan ameller, itaat amelleri, müstehap olan ameller, nafile ameller ve haram olan ameller hakkında bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, müstehap olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 559, yang membahas amalan wajib, amalan ketaatan, amalan anjuran, amalan sunnah, dan amalan haram. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan haram, dan dosa-dosa kecil."
