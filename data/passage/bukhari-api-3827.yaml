text: "قَالَ مُوسَى حَدَّثَنِي سَالِمُ بْنُ عَبْدِ اللَّهِ، وَلاَ أَعْلَمُهُ إِلاَّ تُحُدِّثَ بِهِ عَنِ ابْنِ عُمَرَ أَنَّ زَيْدَ بْنَ عَمْرِو بْنِ نُفَيْلٍ خَرَجَ إِلَى الشَّأْمِ، يَسْأَلُ عَنِ الدِّينِ وَيَتْبَعُهُ فَلَقِيَ عَالِمًا مِنَ الْيَهُودِ، فَسَأَلَهُ عَنْ دِينِهِمْ، فَقَالَ إِنِّي لَعَلِّي أَنْ أَدِينَ دِينَكُمْ، فَأَخْبِرْنِي. فَقَالَ لاَ تَكُونُ عَلَى دِينِنَا حَتَّى تَأْخُذَ بِنَصِيبِكَ مِنْ غَضَبِ اللَّهِ. قَالَ زَيْدٌ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3827، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3827 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3827، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 3827 (Méritos de los Ayudantes en Medina (Ansar)), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
