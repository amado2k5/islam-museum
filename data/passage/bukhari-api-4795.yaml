label: { ar: "صحيح البخاري 4795 — الأب والأبوة", en: "Sahih al-Bukhari 4795 — the father and fatherhood", ur: "صحیح بخاری 4795 — باپ اور والدیت", es: "Sahih al-Bukhari 4795 — El padre y la paternidad", fr: "Sahih al-Bukhari 4795 — Le père et la paternité" }
text: "حَدَّثَنِي زَكَرِيَّاءُ بْنُ يَحْيَى، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ خَرَجَتْ سَوْدَةُ بَعْدَ مَا ضُرِبَ الْحِجَابُ لِحَاجَتِهَا، وَكَانَتِ امْرَأَةً جَسِيمَةً لاَ تَخْفَى عَلَى مَنْ يَعْرِفُهَا، فَرَآهَا عُمَرُ بْنُ الْخَطَّابِ فَقَالَ يَا سَوْدَةُ أَمَا وَاللَّهِ مَا تَخْفَيْنَ عَلَيْنَا، فَانْظُرِي كَيْفَ تَخْرُجِينَ، قَالَتْ فَانْكَفَأَتْ رَاجِعَةً، وَرَسُولُ اللَّهِ فِي بَيْتِي، وَإِنَّهُ لَيَتَعَشَّى. وَفِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4795، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4795 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4795، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4795 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4795 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
