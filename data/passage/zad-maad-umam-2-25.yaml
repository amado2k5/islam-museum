text: "… دِية أهل الذمة، فلم يرفعها فيما رَفَعَ مِن الدية. دية المعاهد وقد روى أهلُ السنن الأربعة عنه عِ : دِيَةُ المعَاهَدِ نِصْفُ دِيَةِ الحُرَّا. ولفظ ابن ماجه: قضى أن عقلَ أَهْلِ الكِتَابينِ نِصْفُ عَقْلِ المسلمين، وهم اليهود والنصارى. واختلف الفقهاء …"
