text: "… إذا صرفت بقري وعطَّلْتُ مزرعتي فأي رأس جبل أسكن فيه؟ أقام عليه أهلُ القرية دعوى، عند القاضي، فاستحضَرُه، وقال له : إن هؤلاء القرويين لا يريدونك فاختر لك وُجهةً. فأجاب الشيخ: أنا الذي لا أريد هؤلاء القرويين، فليذهبوا هم إلى …"
summary:
  ar: "رفع القرويون دعوى على جحا، فقال له القاضي أن يختار مكاناً آخر لأن القرويين لا يريدونه، فقال جحا إنه رجل واحد، ولو باع بقرته وترك مزرعته فعلى أي قمة جبل سيعيش. {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  en: "Villagers sue Juha in court, and the judge tells him to choose another place since the villagers do not want him. Juha says he alone is one man, and if he sold his cow and left his farm, on what mountaintop would he live? {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  ur: "گاؤں والے جحا کے خلاف عدالت میں مقدمہ کرتے ہیں تو قاضی اس سے کہتا ہے کہ کوئی اور جگہ چن لے کیونکہ گاؤں والے اسے نہیں چاہتے۔ جحا کہتا ہے کہ وہ تنہا ایک آدمی ہے، اور اگر وہ اپنی گائے بیچ کر اپنا کھیت چھوڑ دے تو کس پہاڑ کی چوٹی پر رہے گا؟ {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  fr: "Des villageois poursuivent Juha en justice, et le juge lui dit de choisir un autre endroit puisque les villageois ne veulent pas de lui. Juha dit qu'il n'est qu'un seul homme, et que s'il vendait sa vache et quittait sa ferme, sur quelle cime de montagne vivrait-il ? {cite:juha-nawadir-kubra-djuwaydi p. 145}"
  es: "Unos aldeanos demandan a Juha ante el tribunal, y el juez le dice que elija otro lugar pues los aldeanos no lo quieren. Juha dice que él solo es un hombre, y que si vendiera su vaca y dejara su finca, ¿en qué cima de montaña viviría? {cite:juha-nawadir-kubra-djuwaydi p. 145}"
