text: "… يعرف به أوضاع الأعضاء بعضها من بعض فلا يحدث عند البط ونحوه قطع شريان، أو عصب، ونحو ذلك. وكذلك لا يقطع ليف بعض العضلات في البط ونحوه. وذلك لأجل تعرفه مذاهب ألياف العضل. وأما انتفاع الطبيب بهذا الفن في الاستدلال، …"
summary:
  ar: "مقطع من شرح تشريح القانون لابن النفيس، ص 3، يذكر الطب والطبيب، وأعضاء البدن، وحسم الجرح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 3, that mentions medicine and the physician, the organs of the body, cauterising a wound; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "شرح تشریح القانون، ابن النفیس، ص 3 کا اقتباس جس میں طب اور طبیب، اعضائے بدن، زخم داغنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
