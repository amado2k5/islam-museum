label:
  ar: "البخاري 3223 — يتعاقبون فيكم ملائكة: كيف تركتم عبادي"
  en: "Bukhari 3223 — Angels take turns among you: how did you leave My servants"
  ur: "بخاری 3223 — فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا"
text: "الملائكة يتعاقبون، ملائكة بالليل وملائكة بالنهار، ويجتمعون في صلاة الفجر والعصر، ثم يعرج إليه الذين باتوا فيكم، فيسألهم وهو أعلم، فيقول كيف تركتم عبادي فيقولون تركناهم يصلون، وأتيناهم يصلون ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3223: يتعاقبون فيكم ملائكة: كيف تركتم عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3223: Angels take turns among you: how did you leave My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3223: فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
