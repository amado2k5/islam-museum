label: { ar: "الموطأ 882 — زياد عن مالك: المتطوع في الاعتكاف والذي عليه الاعتكاف أمرهما واحد فيما يحل لهما ويحرم عليهما؛ ولم يبلغه أن النبي كان اعتكافه إلا تطوعاً", en: "Muwatta 882", es: "Muwatta 882", fr: "Muwatta 882", ur: "موطا 882", tr: "El-Muvatta 882 — Ziyad, Malik'ten rivayetle: İtikafı gönüllü olarak yapan ile itikaf yapmakla yükümlü olanın helal ve haram yönleri aynıdır; ve Peygamberimizin itikafının hiçbir zaman gönüllü olduğuna dair bir rivayet ona ulaşmamıştır.", id: "Al-Muwatta 882 — Ziyad berdasarkan riwayat Malik: Orang yang melakukan i'tikaf secara sukarela dan orang yang diwajibkan melakukan i'tikaf adalah sama dalam hal apa yang diperbolehkan dan diharamkan bagi mereka; dan tidak sampai kepadanya bahwa i'tikaf Nabi pernah dilakukan secara sukarela." }
summary:
  ar: "يرويه زياد عن مالك أن المتطوع في الاعتكاف والذي عليه الاعتكاف أمرهما واحد فيما يحل لهما ويحرم عليهما، ولم يبلغه أن رسول الله كان اعتكافه إلا تطوعاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (878). {cite:muwatta-maruf-1997 p.425}"
  id: "Ziyad meriwayatkan dari Malik bahwa orang yang melakukan i'tikaf secara sukarela dan orang yang wajib melakukannya adalah sama dalam hal apa yang diperbolehkan dan diharamkan bagi mereka, dan dia tidak diberitahu bahwa Rasulullah shalla Allahu alaihi wa sallam pernah melakukan i'tikaf kecuali secara sukarela. Peneliti menyebutkan bahwa Abu Mus'ab (878) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.425}"
