label: { ar: "سنن النسائي 1014 — قراءات القرآن", en: "Sunan al-Nasa'i 1014 — the readings of the Qur'an", ur: "سنن نسائی 1014 — قرآن کی قراءتیں" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا عَبْدُ الرَّحْمَنِ، قَالَ حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنْ قَتَادَةَ، قَالَ سَأَلْتُ أَنَسًا كَيْفَ كَانَتْ قِرَاءَةُ رَسُولِ اللَّهِ قَالَ كَانَ يَمُدُّ صَوْتَهَ مَدًّا."
summary:
  ar: "حديث في سنن النسائي، رقم 1014، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan al-Nasa'i, no. 1014 (The Book of the Commencement of the Prayer), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن نسائی کی حدیث نمبر 1014، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
