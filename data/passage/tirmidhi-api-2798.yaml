label: { ar: "جامع الترمذي 2798 — الأب والأبوة", en: "Jami' al-Tirmidhi 2798 — the father and fatherhood", ur: "جامع ترمذی 2798 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2798 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 2798 — le père et la paternité" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ عَلِيٍّ الْخَلاَّلُ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ أَبِي الزِّنَادِ، أَخْبَرَنِي ابْنُ جَرْهَدٍ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ مَرَّ بِهِ وَهُوَ كَاشِفٌ عَنْ فَخِذِهِ فَقَالَ النَّبِيُّ \" غَطِّ فَخِذَكَ فَإِنَّهَا مِنَ الْعَوْرَةِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2798، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2798 (Chapters on Manners), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2798، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2798 (Capítulos sobre modales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2798 (Chapitres sur les bonnes manières), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
