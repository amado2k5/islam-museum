text: "… مسلمة الأنصاري، فلما خَرَجَ رسول اللّه وَلِ ضَرَبَ عسْكره على ثنيةِ الوَدَاعِ، ومعه زيادة على ثلاثين ألفاً من الناسِ، وضرب عبدِ اللّه بن أَبيّ عَدُوُّ اللّه على ذي حِدَةٍ عسْكَرَهُ أسفلَ منه، وما كان فيما يزعمون بأقل العسكرين، فلما سار …"
summary:
  ar: "مقطع من دلائل النبوة، المجلد المصوَّر 3، ص 229، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Dalail al-Nubuwwa, scan volume 3, p. 229, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "دلائل النبوۃ، اسکین جلد 3، ص 229 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Dalail al-Nubuwwa, volume numérisé 3, p. 229, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Dalail al-Nubuwwa, volumen escaneado 3, p. 229, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Peygamberliğin Alametleri, Resimli Cilt 3, sayfa 229'dan, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Tanda-Tanda Kenabian, Jilid Bergambar 3, halaman 229, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Islamic Folklore Browser."
