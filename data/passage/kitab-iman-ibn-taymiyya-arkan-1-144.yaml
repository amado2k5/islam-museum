text: "… باللّه واليوم الآخر، ودل قوله والله عليم بالمتقين على أن المتقين هم المؤمنون. ومن هذا الباب قوله علي لا يزني الزاني حين يزني وهو مؤمن ؛ وقوله لا يؤمن من لا يأمن جاره بوائقه وقوله لا تؤمنوا حتى تحابوا وقوله …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 144، يذكر ما لا يتم الإيمان إلا به، وما يرتفع معه الإيمان حين الفعل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 144, that mentions what faith is not complete without, what faith is lifted by at the moment of the act; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 144 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
