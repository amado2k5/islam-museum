text: "… داره على جهتين مختلفتين،... إذا قال : دارى لك عمرى. أو هى لك عمرك. فهى له ولورثته من بعده إذا تنازع صاحب الدار والساكن فى دفن فى الدار،... إن أراد الموصى له إجارة العبد أو الدار، فى المدة التى أوصى …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 1، ص 775، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
