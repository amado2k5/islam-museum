text: "… والخطمي. وأمّا السرطان، فيجب أن يداوى بالمراهم المسكّنة وبترطيب البدن، واستفراغ الدم من الباسليق دائماً، والصافن بعده في أحيان، وإسهال السوداء. ولمرهم الرسل خاصية عجيبة فيه، ويسكّن وجعه. وإذا اشتد الوجع، فصدت، وجرّبت في تسكين الوجع الأدوية الحارة والباردة معاً، …"
