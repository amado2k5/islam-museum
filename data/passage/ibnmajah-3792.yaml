label:
  ar: "ابن ماجه 3792 — أنا مع عبدي إذا ذكرني وتحركت بي شفتاه"
  en: "Ibn Majah 3792 — I am with My servant when he remembers Me and his lips move with My name"
  ur: "ابن ماجہ 3792 — میں اپنے بندے کے ساتھ ہوں جب وہ مجھے یاد کرے اور اس کے ہونٹ میرے ذکر سے ہلیں"
text: "إن الله عز وجل يقول أنا مع عبدي إذا هو ذكرني وتحركت بي شفتاه ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3792: أنا مع عبدي إذا ذكرني وتحركت بي شفتاه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3792: I am with My servant when he remembers Me and his lips move with My name. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3792: میں اپنے بندے کے ساتھ ہوں جب وہ مجھے یاد کرے اور اس کے ہونٹ میرے ذکر سے ہلیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
