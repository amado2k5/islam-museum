ref: "700"
label:
  ar: "الترمذي 700 — أحب عبادي إلي أعجلهم فطرا"
  en: "Tirmidhi 700 — The dearest of My servants to Me are the quickest to break the fast"
  ur: "ترمذی 700 — میرے بندوں میں مجھے سب سے پیارے وہ ہیں جو افطار میں سب سے جلدی کریں"
  es: "Tirmidhi 700 — Los más queridos de Mis siervos son los que rompen el ayuno más rápidamente."
  fr: "Tirmidhi 700 — Les plus chers de Mes serviteurs sont ceux qui rompent le jeûne le plus rapidement"
  tr: "Tirmizi 700 — Kullarımın en sevdiklerim, oruçlarını açmak için acele edenlerdir."
  id: "Tirmidzi 700 — Hamba-Ku yang paling Kucintai adalah mereka yang bersegera berbuka puasa"
text: "قال الله عز وجل أحب عبادي إلى أعجلهم فطرا ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 700: أحب عبادي إلي أعجلهم فطرا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 700: The dearest of My servants to Me are the quickest to break the fast. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 700: میرے بندوں میں مجھے سب سے پیارے وہ ہیں جو افطار میں سب سے جلدی کریں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 700: Los más queridos de Mis siervos son los que rompen el ayuno más rápidamente. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 700: « Les serviteurs les plus chers à Mes yeux sont ceux qui rompent le jeûne le plus rapidement. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Cami' el-Tirmizi'de 700 numaralı hadis-i kudsi şöyledir: \"Kullarımın en sevdiklerim, oruçlarını açmak için acele edenlerdir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 700: \"Hamba-Ku yang paling Aku cintai adalah orang-orang yang bersegera berbuka puasa.\" Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta'."
