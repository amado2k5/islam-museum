label:
  ar: "الترمذي 700 — أحب عبادي إلي أعجلهم فطرا"
  en: "Tirmidhi 700 — The dearest of My servants to Me are the quickest to break the fast"
  ur: "ترمذی 700 — میرے بندوں میں مجھے سب سے پیارے وہ ہیں جو افطار میں سب سے جلدی کریں"
text: "قال الله عز وجل أحب عبادي إلى أعجلهم فطرا ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 700: أحب عبادي إلي أعجلهم فطرا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 700: The dearest of My servants to Me are the quickest to break the fast. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 700: میرے بندوں میں مجھے سب سے پیارے وہ ہیں جو افطار میں سب سے جلدی کریں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
