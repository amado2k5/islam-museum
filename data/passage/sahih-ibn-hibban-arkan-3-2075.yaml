text: "… بكلب صيدٍ أو أيّما مسلم يشهد له أربعة بخير إلا أيّما مملوك كان بين شركاء فأعتق أحدهم الإيمان بالله إيمان بالله وجهاد في سبيل اللّٰه،،، إيمان بالله ورسوله إيمان بالله ورسوله وجهاد في سبيل اللّٰه،، الإِيمان بضع وستون شُعْبَة الإِيمان …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 2075، يذكر الإيمان بضع وسبعون شعبة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
