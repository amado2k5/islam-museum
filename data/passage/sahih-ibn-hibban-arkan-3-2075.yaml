text: "… بكلب صيدٍ أو أيّما مسلم يشهد له أربعة بخير إلا أيّما مملوك كان بين شركاء فأعتق أحدهم الإيمان بالله إيمان بالله وجهاد في سبيل اللّٰه،،، إيمان بالله ورسوله إيمان بالله ورسوله وجهاد في سبيل اللّٰه،، الإِيمان بضع وستون شُعْبَة الإِيمان …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 2075، يذكر الإيمان بضع وسبعون شعبة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 2075, that mentions faith as seventy-odd branches, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 2075 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 2075, que menciona la fe como setenta y tantos pilares, uno de los artículos de fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Pilares de la Fe lo incluye."
  fr: "Un extrait du Sahih Ibn Hibban, volume 3, page 2075, mentionne la foi comme étant composée d'une soixantaine de branches, un des articles de foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban'ın 3. cildinin 2075. sayfasından bir alıntı, yetmişten fazla inanç dalından ve inancın rükünlerinden birinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın rükünleri, inancın rükünleri, inanç dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Volume 3, halaman 2075, menyebutkan lebih dari tujuh puluh cabang iman dan salah satu rukun iman. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang iman, dan karakteristik seorang mukmin."
