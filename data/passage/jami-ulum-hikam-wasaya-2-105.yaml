  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 105. sayfasından, vasiyetnameye dair bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 105, yang menyebutkan wasiat terakhir; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
