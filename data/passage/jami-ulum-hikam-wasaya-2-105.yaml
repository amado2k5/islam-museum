text: "… ضعيف ؛ لضعف علي بن زيد بن جدعان.. ويُروى من وجهِ آخرَ مرسلا أخرجه : أحمد في الزهد من طريق سعيد بن يزيد، مُرسلاً.. ويُروى عن معاذٍ أنّ النَّبيَّ وَليه وصَّاه لما بعثه إلى اليمن، فقال : استحي مِنَ اللهِ …"
