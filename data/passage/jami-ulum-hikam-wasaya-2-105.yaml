text: "… ضعيف ؛ لضعف علي بن زيد بن جدعان.. ويُروى من وجهِ آخرَ مرسلا أخرجه : أحمد في الزهد من طريق سعيد بن يزيد، مُرسلاً.. ويُروى عن معاذٍ أنّ النَّبيَّ وَليه وصَّاه لما بعثه إلى اليمن، فقال : استحي مِنَ اللهِ …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 105، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 105, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 105 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
