text: "… سرح من أصاب من الفرنج والبربر، ببلاد إفريقية والأندلس، حميت الروم واجتمعت على قسطنطين ابن هرقل، وساروا إلى المسلمين في جمع لم ير مثله منذ كان الإسلام، خرجوا في خمسمائة مركب، وقصدوا عبد اللّٰه بن أبي سرح في أصحابه من …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 4، ص 156، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
