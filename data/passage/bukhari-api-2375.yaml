label: { ar: "صحيح البخاري 2375 — التحريم", en: "Sahih al-Bukhari 2375 — prohibition", ur: "صحیح بخاری 2375 — تحریم", es: "Sahih al-Bukhari 2375 - prohibición", fr: "Sahih al-Bukhari 2375 – interdiction", tr: "Sahih el-Buhari 2375 — Yasak", id: "Sahih al-Bukhari 2375 — Larangan" }
text: "… قَالَ قَدْ جَبَّ أَسْنِمَتَهُمَا فَذَهَبَ بِهَا. قَالَ ابْنُ شِهَابٍ قَالَ عَلِيٌّ ـ فَنَظَرْتُ إِلَى مَنْظَرٍ أَفْظَعَنِي فَأَتَيْتُ نَبِيَّ اللَّهِ وَعِنْدَهُ زَيْدُ بْنُ حَارِثَةَ فَأَخْبَرْتُهُ الْخَبَرَ فَخَرَجَ وَمَعَهُ زَيْدٌ، فَانْطَلَقْتُ مَعَهُ، فَدَخَلَ عَلَى حَمْزَةَ فَتَغَيَّظَ عَلَيْهِ فَرَفَعَ حَمْزَةُ بَصَرَهُ وَقَالَ هَلْ أَنْتُمْ إِلاَّ عَبِيدٌ لآبَائِي فَرَجَعَ رَسُولُ اللَّهِ يُقَهْقِرُ حَتَّى خَرَجَ عَنْهُمْ، وَذَلِكَ قَبْلَ تَحْرِيمِ الْخَمْرِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2375، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 2375 (Distribution of Water), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 2375، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2375 (Distribución del agua), menciona la prohibición. El Navegador Halal y Haram lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 2375 (La distribution de l'eau), mentionne une interdiction. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 2375 numaralı hadis, bu yasağı zikretmektedir. Helal ve Haram tarayıcısı, bunu Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki rivayetleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2375, menyebutkan larangan tersebut. Peramban Halal dan Haram menggabungkan ini dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
