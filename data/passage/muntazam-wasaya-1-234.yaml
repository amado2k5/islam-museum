text: "… توفى ابو اقاسم بن مميع ايلة الفطر فى سنة سبع عشرة وثلثمائة ودفن يوم الفطر وتد استكمل مائة سنة وثلاث سنين وشهرا. تال الخطيب ودفن فى مقبرة باب التبن قال المصنف ورأيت فى بعض الروايات انه مات وهو صحمح السمع …"
