label: { ar: "الموطأ 543 — عروة مرسلاً: نزلت سورة عبس في عبد الله بن أم مكتوم", en: "Muwatta 543" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً: نزلت أول سورة عبس [[passage/quran-80-1|عبس 1–2]] في عبد الله بن أم مكتوم، جاء إلى النبي يقول: يا محمد استدنني، وعند النبي رجل من عظماء المشركين، فجعل النبي يعرض عن ابن أم مكتوم ويقبل على الآخر ويسأله هل يرى بما يقول بأساً، فيجيب: لا والدماء، ما أرى بما تقول بأساً. فنزلت الآيتان. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وينقل عن ابن عبد البر (التمهيد 22/324) أن الرواة لم يختلفوا عن مالك في إرساله، وأنه يستند من حديث عائشة من رواية يحيى بن سعيد الأموي ويزيد بن سنان عن هشام بن عروة، ومالك أثبت منهما، وأن الترمذي (3331) استغرب الموصول ورجح المرسل. {cite:muwatta-maruf-1997 p.279} {cite:muwatta-maruf-1997 p.280}"
