label: { ar: "الموطأ 543 — عروة مرسلاً: نزلت سورة عبس في عبد الله بن أم مكتوم", en: "Muwatta 543", es: "Muwatta 543", fr: "Muwatta 543", ur: "موطا 543", tr: "Al-Muwatta 543 — Urve, mürsel: Absa Suresi Abdullah ibn Ümmü Mektum hakkında nazil oldu", id: "Al-Muwatta 543 — Urwah, mursal: Surat Abasa diturunkan tentang Abdullah bin Ummu Maktum" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً: نزلت أول سورة عبس [[passage/quran-80-1|عبس 1–2]] في عبد الله بن أم مكتوم، جاء إلى النبي يقول: يا محمد استدنني، وعند النبي رجل من عظماء المشركين، فجعل النبي يعرض عن ابن أم مكتوم ويقبل على الآخر ويسأله هل يرى بما يقول بأساً، فيجيب: لا والدماء، ما أرى بما تقول بأساً. فنزلت الآيتان. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وينقل عن ابن عبد البر ⁦(التمهيد 22/324)⁩ أن الرواة لم يختلفوا عن مالك في إرساله، وأنه يستند من حديث عائشة من رواية يحيى بن سعيد الأموي ويزيد بن سنان عن هشام بن عروة، ومالك أثبت منهما، وأن الترمذي (3331) استغرب الموصول ورجح المرسل. {cite:muwatta-maruf-1997 p.279} {cite:muwatta-maruf-1997 p.280}"
  id: "Malik meriwayatkannya atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, dalam hadits mursal: Ayat-ayat pertama Surah Abasa [80:1-2] diturunkan mengenai Abdullah ibn Umm Maktum. Ia datang kepada Nabi (shalawat dan salam kepadanya) seraya berkata, “Wahai Muhammad, suruhlah aku mendekat.” Seorang musyrik terkemuka berada bersama Nabi (shalawat dan salam kepadanya), maka Nabi berpaling dari Ibn Umm Maktum dan memfokuskan perhatiannya pada orang lain, bertanya kepadanya apakah ia melihat kesalahan dalam apa yang dikatakannya. Orang itu menjawab, “Tidak, demi pertumpahan darah! Aku tidak melihat kesalahan dalam apa yang engkau katakan.” Kemudian kedua ayat itu diturunkan. Peneliti menyebutkan bahwa Abu Musab meriwayatkannya atas otoritas Malik, dan mengutip Ibn Abd al-Barr (al-Tamhid 22/324) yang mengatakan bahwa para perawi tidak berbeda pendapat mengenai riwayat Malik dalam bentuk mursal. Ia juga menyatakan bahwa Malik mengandalkan hadits dari Aisyah, yang diriwayatkan oleh Yahya ibn Saeed al-Umawi dan Yazid ibn Sinan atas otoritas Hisham ibn Urwah, dan bahwa Malik lebih dapat diandalkan daripada keduanya. Lebih lanjut, al-Tirmidhi (3331) menganggap hadits yang terkait tidak lazim dan lebih menyukai hadits mursal. {cite:muwatta-maruf-1997 p.279} {cite:muwatta-maruf-1997 p.280}"
