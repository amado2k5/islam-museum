text: "… بْنِ أَبِي سَعِيدٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّهُ قَالَ لَمَّا فُتِحَتْ خَيْبَرُ أُهْدِيَتْ لِرَسُولِ اللَّهِ شَاةٌ فِيهَا سَمٌّ، فَقَالَ رَسُولُ اللَّهِ \" اجْمَعُوا لِي مَنْ كَانَ هَا هُنَا مِنَ الْيَهُودِ \". فَجُمِعُوا لَهُ فَقَالَ لَهُمْ رَسُولُ اللَّهِ \" إِنِّي سَائِلُكُمْ عَنْ شَىْءٍ فَهَلْ أَنْتُمْ صَادِقِيَّ عَنْهُ \". فَقَالُوا نَعَمْ يَا أَبَا الْقَاسِمِ. فَقَالَ لَهُمْ رَسُولُ اللَّهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5777، يذكر السم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5777 (Medicine), that mentions poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5777، جس میں زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
