text: |-
  قواد الراجز كذافى جميع النخ
  وكذلك قال فى ماذة روق
  والمناسب الشاعرفات الشعر
  المذكورايس رجزا واغاهو من
  المتسرح المنهوك وقال فى مادّ:
  فن وأنتداه معيه
  قولد الواحة من الغزوة الخ
  عبارة القاموس كل عروة دبقة
  إه مصصع
  (باب القاف
  ⁦(دوق)⁩
  قال الراجز
  يارب مهر حنعوق • مقيل أومغبوق
  من لبن الدهم الروق • حتى شتاكالذعلوق
  ⁦(ذاف)⁩ الذلق بالتحريك القلق وقدذلق بالكسر وأذلقته أنا يقال أذلقت الضب اذا
  سيبت فى حجره الماه ليخرج قال الفراء الذاق بالتسكين مجرى المهور فى البكرة وذلق كل
  شى أيضاحده وكذلك ذولقه وذواق اللسان طرفه وكذلك ذولق السنان وذلق اللسان
  بالكسر يذلق ذلقا أى ذرب وكذلك السنان فهوذاو واذلق وبقال أيضاذلق اللسان بالضم
  ذلقاف، وذليق بين الذلاقة و-كرابن الاعرابى لسان ذلق طلق وذليق طلبق وذاق طلق أرب-ح
  لغات فيها والحروف الذاق حروف طرف المسان والشفة الواحد أذلق وهنّ ستالاثة منه
  ذولقيسة وهى الراء واللام والذون وثلاثة شفوية وهى الفاء والباء والميم وانماسميت هذه
  الحروف ذلقالان الذلاقة فى المنطق انماهى بطرف أسلة المسان والشفتين وهما مدرجتا
  هذه الحروف السستة وخطيب ذلق وذليق والانى ذلقة وذليقة وكل محدّد الطرف مذاق
  ( ذوق ، ذقت الشى أذوق ذونا وذواقا ومذا قا ومذاقة وماذت ذوا قا أى شيأوذقت
  ماعند فلان أى خبرته وذقت القوس اذاجذبت وترها لتنظر ماشدتها وأذا قه اللّه وبال
  أمره قال طفيل
  فذوقوا كماذقناغداة محجر • من الغيظ فى أكبادنا والتصوب
  وتذوّقته أى ذقته شأ بعدنئ وأمر مستذاق أى مجزب معلوم قال الشاعر
  وعهد الغانيات كعهدقين • ونت عنه الجعائل مستذاق
  والذواق الملول
  صل الرا بق الربق بالكسر حبل فيه عدّة عرى تشديه البهم الواحدة
  من العروة ربقة وفى الحديث خلع ربقة الاسلام من عنقه والجمع ربق وأرياق ورباق وفى
  الحديث لكم العهدما لم تأكاوا الرياق والربق بالفتح مصدرقولك ربقت الجدى أربقه وأربه
  اذا جعلت رأ-ه فى الربقة فارتبق يقال ارقبق الظبى فى سبالتي أى علق والربيقة البهمة
  المربوقة فى الربق عن يعقوب وقولهم رحدت الضأن ذربق ربق أى هي الارياق فائم اتلمدعن
  قرب لانها تضرع على دأس الولد وليس كذلك المعزى فلذلك قالوافيها رنوّرتق بالفون وأمّ
  الربيق الداهية تق لرنق ضد الفتق ودرتقت الفتق أره فارتنق أى التأم ومنه
  قوله تعالى كانسارتقا فقتقناهما وارتو بالتحريك مصدر قولك امر أة رتقاه بينسة الرتق
  لا يستطاع بماعه الارتناق ذلك الموضع منها وانرتاق توبان يرتقان عحواشبهما ومنه قول
  الراجز • جادية بيضاءفى رتاق • حق) الرحيق صفوة اللهر زق الرزق
  ما ينتفع به والجم-ع الارزاق والرزق العطاءوهو مصدر قولت رزه الله والرزقة بالفتح ائرة
  الواحدة والهع الرزقات وهى أطماع الجند وارتزق الجندأى أخذوا أرزاهم وقول تعالى
  وتجعلون رزقكم أنكم تكذيون أى شكررزقكم وهذا كقوله واسئل القرية يعنى أهلها وقد
  يسمى المطر وزنا وذلك قوله عزوجلّ وما أنزل اللّٰه من السماء من رزق فأحيابه الارض
  وحال
