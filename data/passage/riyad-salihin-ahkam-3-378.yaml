text: "… الغنى الشاكر وهو من أخذ المال من وجهه وصرفه فى وجهه المأمور-بها. - باب ذكر الموت وقصر الأمل. - باب استحباب زيارة القبور للرجال وما يقوله الزائر. - باب كراهية تمنى الموت يسبب ضر نزل به ولا يأس به لخوف …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 378، يرد فيه ذكر المستحب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 378, whose wording mentions the recommended (mustahabb), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 378 کا اقتباس جس میں مستحب، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin de al-Nawawi, volume numérisé 3, p. 378, dont le texte mentionne le recommandé (mustahabb), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen digitalizado 3, p. 378, cuyo texto menciona lo recomendado (mustahabb), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin 3. cildinin 378. sayfasından, müstehaplı ve müstehaplı amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Zorunlu ameller, itaat amelleri, müstehaplı ameller, müstehaplı ameller, yasak ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Volume 3, halaman 378, yang menyebutkan amalan yang dianjurkan dan yang tidak disukai; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
