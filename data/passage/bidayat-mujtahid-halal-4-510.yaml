text: "… دُمْتُمْ حُرّمًا المائدة:، فإن اصطاد محرم فهل يحل ذلك الصيد للحلال أم هو ميتة لا يحل لأحد أصلاً؟ اختلف فيه الفقهاء، فذهب مالك إلى أنه ميتة، وذهب الشافعي وأبو حنيفة وأبو ثور إلى أنه يجوز لغير المحرم أكله. لا؟ وذلك …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 510، يذكر الحلال، وما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 510, that mentions the lawful, what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 510 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
