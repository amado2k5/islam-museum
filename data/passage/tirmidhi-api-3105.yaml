label: { ar: "جامع الترمذي 3105 — مضاعفة الأجر", en: "Jami' al-Tirmidhi 3105 — the reward doubled or multiplied", ur: "جامع ترمذی 3105 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ صُهَيْبٍ، عَنِ النَّبِيِّ فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّّ : (لِلََّذِينَ أَحْسَنُوا الْحُسْنَى وَزِيَادَةٌ ) قَالَ \" إِذَا دَخَلَ أَهْلُ الْجَنَّةِ الْجَنَّةَ نَادَى مُنَادٍ إِنَّ لَكُمْ عِنْدَ اللَّهِ مَوْعِدًا يُرِيدُ أَنْ يُنْجِزَكُمُوهُ قَالُوا أَلَمْ تُبَيِّضْ وُجُوهَنَا وَتُنَجِّنَا مِنَ النَّارِ وَتُدْخِلْنَا الْجَنَّةَ قَالَ فَيُكْشَفُ الْحِجَابُ. قَالَ فَوَاللَّهِ مَا أَعْطَاهُمُ اللَّهُ شَيْئًا أَحَبَّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3105، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3105 (Chapters on Tafsir), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3105، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
