text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا مَعْدِيُّ بْنُ سُلَيْمَانَ، حَدَّثَنَا ابْنُ عَجْلاَنَ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" أَلاَ هَلْ عَسَى أَحَدُكُمْ أَنْ يَتَّخِذَ الصُّبَّةَ مِنَ الْغَنَمِ عَلَى رَأْسِ مِيلٍ أَوْ مِيلَيْنِ، فَيَتَعَذَّرَ عَلَيْهِ الْكَلأُ، فَيَرْتَفِعَ. ثُمَّ تَجِيءُ الْجُمُعَةُ فَلاَ يَجِيءُ وَلاَ يَشْهَدُهَا وَتَجِيءُ الْجُمُعَةُ فَلاَ يَشْهَدُهَا. وَتَجِيءُ الْجُمُعَةُ فَلاَ يَشْهَدُهَا. …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1127، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1127 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1127، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
