text: "ه عله فى غزوة تبوك، فأخذه وأتى به إلى النبى للله فمن عليه، وكتب له كتاب عهد ولكنه خان العهد بعد ذلك، ولقد بقى الرعب فى فسه منذ يوم أسره خالد إلى جانب سمعته الشهيرة فى حروبه مع العرب والعجم،"
