label:
  ar: "النسائي 2078 — كذبني ابن آدم وشتمني"
  en: "Nasa'i 2078 — The son of Adam denied Me and reviled Me"
  ur: "نسائی 2078 — ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا"
text: "قال الله عز وجل كذبني ابن آدم ولم يكن ينبغي له أن يكذبني وشتمني ابن آدم ولم يكن ينبغي له أن يشتمني أما تكذيبه إياى فقوله إني لا أعيده كما بدأته وليس آخر الخلق بأعز على من أوله وأما شتمه …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 2078: كذبني ابن آدم وشتمني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 2078: The son of Adam denied Me and reviled Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 2078: ابن آدم نے مجھے جھٹلایا اور مجھے برا کہا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
