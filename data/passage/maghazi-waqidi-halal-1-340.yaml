text: "… قد أَرسل رجلاً من خُزاعة إلى رسول اللّٰه يُعلمه أَن قد انصرف أَبو سُفيان وأَصحابه خائفين وَجِلين. ثم أنصرف رسول اللّٰه إلى المدينة. سرية ألى ستلمة بن عبد الأسد إلى قطَن إلى بنى أسد فى المحرّم على رأس خمسة وثلاثين …"
