label: { ar: "مسلم 35 — الإيمان بضع وسبعون شعبة", en: "Muslim 35 — Faith has seventy-odd branches", es: "Musulmán 35 — La fe tiene setenta y tantos ramificaciones", fr: "Musulman 35 — La foi compte une soixantaine de branches", ur: "مسلم 35 - ایمان کی ستر شاخیں ہیں۔", tr: "Müslüman 35 — İnancın yetmişten fazla kolu vardır.", id: "Muslim 35 — Agama ini memiliki lebih dari tujuh puluh cabang" }
text: "قال رسول الله: «الإيمان بضع وسبعون أو بضع وستون شعبة، فأفضلها قول لا إله إلا الله، وأدناها إماطة الأذى عن الطريق، والحياء شعبة من الإيمان»"
summary:
  ar: "رواية أبي هريرة في باب شعب الإيمان من صحيح مسلم؛ مراتب الإيمان من الشهادة إلى إماطة الأذى عن الطريق والحياء — نص جامع أن الإيمان قول وعمل."
  tr: "Sahih Müslim'in \"İmanın Dalları\" bölümünde Ebu Hurayra'nın rivayeti; imanın derecelerini, şahitlikten yoldan zararlı şeyleri kaldırmaya ve iffete kadar ele alan kapsamlı bir metindir; imanın hem söz hem de amel olduğunu vurgular."
  id: "Riwayat Abu Hurairah dalam bab tentang cabang-cabang iman dalam Sahih Muslim; tingkatan iman dari syahadat hingga menjauhkan bahaya dari jalan dan kesopanan — sebuah teks komprehensif yang menyatakan bahwa iman adalah perkataan dan perbuatan."
