text: "… بن معاذ بن عثمان بن عمرو الرحمن بن معاوية أن رجلاً سأل رسول اللّٰه وَلِقيهِ فقال : يا ابن كعب بن سعد بن تيم بن مرة بن كعب القرشي رسول اللّٰه ما يحل لي وما يحرم علي... الحديث. التيمي ابن …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 826، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 826, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 826 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
