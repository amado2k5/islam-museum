  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 826. sayfasından bir alıntı, izin verilen, izin verilmeyen ve haram olan şeylerden bahsetmektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
