ref: '485'
label:
  ar: 'النسائي 485 — يتعاقبون فيكم ملائكة: كيف تركتم عبادي'
  en: 'Nasa''i 485 — Angels take turns among you: how did you leave My servants'
  ur: 'نسائی 485 — فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا'
  es: "Nasa'i 485 — Los ángeles se turnan entre vosotros: ¿cómo dejasteis a mis siervos?"
  fr: "Nasa'i 485 — Les anges se relaient parmi vous: comment avez-vous abandonné Mes serviteurs ?"
  tr: "Kadınlar 485 — Melekler sırayla sizi ziyaret ediyor: Kullarımı nasıl terk ettiniz?"
  id: "Perempuan 485 — Malaikat-malaikat bergantian mengunjungi kamu: Bagaimana kamu meninggalkan hamba-hamba-Ku?"
text: يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار ويجتمعون في صلاة الفجر وصلاة العصر ثم يعرج الذين باتوا فيكم فيسألهم وهو أعلم بهم كيف تركتم عبادي فيقولون تركناهم وهم يصلون وأتيناهم وهم يصلون .
summary:
  ar: 'حديث قدسي في سنن النسائي، رقم 485: يتعاقبون فيكم ملائكة: كيف تركتم عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ.'
  en: 'A hadith qudsi in Sunan al-Nasa''i, no. 485: Angels take turns among you: how did you leave My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta.'
  ur: 'سنن نسائی میں حدیثِ قدسی، نمبر 485: فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔'
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 485: Los ángeles se turnan entre vosotros: ¿cómo dejasteis a Mis siervos? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sunan al-Nasa'i, n° 485: « Les anges se relaient parmi vous: comment avez-vous abandonné Mes serviteurs ? » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sunan-ı Nesai'de 485 numaralı hadis-i kudsi şöyledir: Melekler sırayla seni ziyaret eder ve sorarlar: \"Kullarımı nasıl bıraktın?\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 485: Malaikat bergantian mengunjungi kamu, bertanya: \"Bagaimana kamu meninggalkan hamba-hamba-Ku?\" Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta."
