label:
  ar: "النسائي 485 — يتعاقبون فيكم ملائكة: كيف تركتم عبادي"
  en: "Nasa'i 485 — Angels take turns among you: how did you leave My servants"
  ur: "نسائی 485 — فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا"
text: "يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار ويجتمعون في صلاة الفجر وصلاة العصر ثم يعرج الذين باتوا فيكم فيسألهم وهو أعلم بهم كيف تركتم عبادي فيقولون تركناهم وهم يصلون وأتيناهم وهم يصلون ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 485: يتعاقبون فيكم ملائكة: كيف تركتم عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 485: Angels take turns among you: how did you leave My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 485: فرشتے تم میں باری باری آتے ہیں: تم نے میرے بندوں کو کس حال میں چھوڑا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
