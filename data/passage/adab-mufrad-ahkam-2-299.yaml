text: "… الصحابة، ح - باب الشعر حسنه كمسن الكلام، ومنه أبيح -. حدّثنا أبو عاصم، عن ابن جريج، عن زياد، عن الزهرى، عن أبى بكر، عن عبد الرحمن بن الأسود، عن أبيّ بن كعب، عن النبى مليالا قال من الشعر حكمة …"
