summary:
  ar: "القسم 23 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب البيوع»، ويضم فيها النصوص من 3326 إلى 3415 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 23 of Sunan Abi Dawud (Commercial Transactions (Kitab Al-Buyu)) in the division of the open hadith dataset the museum took its reports from: reports 3326 to 3415 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 23، عنوان «کتاب البیوع»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3326 تا 3415۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 23 de Sunan Abi Dawud (Transacciones comerciales (Kitab Al-Buyu)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3326 al 3415, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan Abi Dawud (Recueil de hadiths) sous le livre 23 (Traditions commerciales): les hadiths 3326 à 3415 de la numérotation de ce recueil. Le musée classe ses archives de ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 23. bölümü, açık hadis veri tabanında yer almakta olup \"Satış Kitabı\" başlığını taşımaktadır. Bu bölümde, sırasıyla 3326 ile 3415 arasında numaralandırılmış metinler bulunmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 23 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi basis data hadits terbuka dan diberi judul \"Kitab Penjualan\". Bagian ini berisi teks 3326 hingga 3415, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
