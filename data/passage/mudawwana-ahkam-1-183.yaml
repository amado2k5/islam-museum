  id: "Sebuah kutipan dari Kompendium Agung, Jilid Bergambar 1, halaman 183, menyebutkan apa yang tidak disukai, apa yang dulu tidak disukai, dan apa yang dulu tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban yang berisi tindakan wajib, kewajiban, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa-dosa kecil."
