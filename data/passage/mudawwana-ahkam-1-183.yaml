text: "… وكان يكره أن يدع الرجل البيتوتة بمنى مع الناسن ليلة عرفة قال نعم وقات كما كره أن يبات ليالى أيام منى اذا رجع من عرفات في غير منى قال ابن القاسم. كان يكرههما جميعا وليالي منى في الكراهية أشدُّ عنده …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 183، يرد فيه ذكر الكراهة، وما كان يُكره، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
