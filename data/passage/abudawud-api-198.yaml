label: { ar: "سنن أبي داود 198 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 198 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 198 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 198 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 198 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا أَبُو تَوْبَةَ الرَّبِيعُ بْنُ نَافِعٍ، حَدَّثَنَا ابْنُ الْمُبَارَكِ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، حَدَّثَنِي صَدَقَةُ بْنُ يَسَارٍ، عَنْ عَقِيلِ بْنِ جَابِرٍ، عَنْ جَابِرٍ، قَالَ خَرَجْنَا مَعَ رَسُولِ اللَّهِ - يَعْنِي فِي غَزْوَةِ ذَاتِ الرِّقَاعِ - فَأَصَابَ رَجُلٌ امْرَأَةَ رَجُلٍ مِنَ الْمُشْرِكِينَ فَحَلَفَ أَنْ لاَ أَنْتَهِي حَتَّى أُهَرِيقَ دَمًا فِي أَصْحَابِ مُحَمَّدٍ فَخَرَجَ يَتْبَعُ أَثَرَ النَّبِيِّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 198، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 198 (Purification (Kitab Al-Taharah)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 198، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 198 (Purificación (Kitab Al-Taharah)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 198 (Purification (Kitab Al-Taharah)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
