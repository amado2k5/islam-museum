label:
  ar: "مسلم 2788 — أنا الملك أين الجبارون أين المتكبرون"
  en: "Muslim 2788 — I am the King; where are the tyrants, where are the arrogant?"
  ur: "مسلم 2788 — میں بادشاہ ہوں، جابروں اور متکبروں کو کہاں ہیں"
text: "يطوي الله السماوات يوم القيامة ثم يأخذهن بيده اليمنى ثم يقول أنا الملك أين الجبارون أين المتكبرون ثم يطوي الأرضين بشماله …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2788: أنا الملك أين الجبارون أين المتكبرون. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2788: I am the King; where are the tyrants, where are the arrogant?. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2788: میں بادشاہ ہوں، جابروں اور متکبروں کو کہاں ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
