text: "… اللّٰه تعالى عنها كساء ملبدا، وإزارا غليظا، فقالت. قبض رسول اللّٰه فى هذين. وقال إنَّ اللهَ تَععَلَى يُحِبُّ المُتَدِّلَ الّذِى لا يُبَالِ مَاَلَبِسَ. وقال عمرو بن الأسود المنسى. لا ألبس مشهورا أبدا، ولا أنام بليل على دثار أبدا، ولا أركب …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 2، ص 137، يذكر ساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 137, that mentions a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 2، ص 137 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 2, pág. 137, que menciona un lecho de muerte y las últimas horas, una reliquia conservada tras su dueño; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre d'al-Ghazali, Ihya' 'Ulum al-Din, volume 2, page 137, mentionnant un lit de mort, les dernières heures et une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 2. cildinin 137. sayfasından alınan bir alıntı, ölüm ve vefat anından bahsetmekte olup, günümüze kadar korunmuş kutsal emanetlerden biridir; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 2, halaman 137, menyebutkan saat kematian dan wafatnya, dan merupakan salah satu peninggalan yang terpelihara; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, peninggalan, dan makam suci."
