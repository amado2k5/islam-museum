text: "… اللّٰه تعالى عنها كساء ملبدا، وإزارا غليظا، فقالت. قبض رسول اللّٰه فى هذين. وقال إنَّ اللهَ تَععَلَى يُحِبُّ المُتَدِّلَ الّذِى لا يُبَالِ مَاَلَبِسَ. وقال عمرو بن الأسود المنسى. لا ألبس مشهورا أبدا، ولا أنام بليل على دثار أبدا، ولا أركب …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 2، ص 137، يذكر ساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 137, that mentions a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
