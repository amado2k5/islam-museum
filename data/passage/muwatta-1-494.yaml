label: { ar: "الموطأ 494 — عمر يسأل أبا واقد الليثي: بم كان يقرأ النبي في الأضحى والفطر؟ بقاف والقمر", en: "Muwatta 494", es: "Muwatta 494", fr: "Muwatta 494", ur: "موطا 494", tr: "El-Muvatta 494 — Ömer, Ebu Vakid el-Layti'ye sorar: Peygamberimiz Kurban Bayramı ve Ramazan Bayramı namazlarında ne okurdu? O da şöyle cevap verir: Kaf Suresi ve Kamer Suresi.", id: "Al-Muwatta 494 — Umar bertanya kepada Abu Waqid al-Laythi: Apa yang dibaca Nabi dalam salat Idul Adha dan Idul Fitri? Beliau menjawab: Surah Qaf dan Surah al-Qamar." }
summary:
  ar: "أول حديث في باب ما جاء في التكبير والقراءة في صلاة العيدين. يرويه يحيى عن مالك عن ضمرة بن سعيد المازني عن عبيد الله بن عبد الله بن عتبة بن مسعود: سأل عمر بن الخطاب أبا واقد الليثي بم كان النبي يقرأ في الأضحى والفطر، فقال: بسورة ق وسورة القمر. ويخرّجه المحقق عند مسلم (3/21) وأبي داود (1154) والترمذي (534) والنسائي وأحمد وابن حبان وعبد الرزاق والشافعي ومحمد بن الحسن والبيهقي من طرق أصحاب مالك. وينقل عن ابن عبد البر أن بعض أهل الحديث زعم أنه منقطع لأن عبيد الله لم يلق عمر، وأن غيره عدّه متصلاً لأن لقاءه لأبي واقد غير مدفوع ⁦(التمهيد 16/328)⁩؛ ويقول المحقق إن أبا زرعة نص على عدم سماعه من عمر وتابعه ابن خزيمة والبيهقي والمزي، لكن رواية فليح بن سليمان عند مسلم «قال أبو واقد: سألني عمر» تدل على أنه رواه عن أبي واقد، وإن كان فليح ضعيفاً عند التفرد، ويختم بأن كلام ابن عبد البر هو الأصوب فالحديث حديث أبي واقد وقد صححه الترمذي بالصيغة التي رواها مالك. {cite:muwatta-maruf-1997 p.252} {cite:muwatta-maruf-1997 p.253} {cite:muwatta-maruf-1997 p.254}"
  tr: "Bu hadis, bayram namazlarında tekbir ve okuma ile ilgili rivayetler bölümündeki ilk hadistir. Yahya, Malik'ten, o da Damrah ibn Sa'id al-Mazini'den, o da Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud'dan rivayet etmiştir: Ömer ibn al-Khattab, Ebu Vakid al-Laythi'ye Peygamber'in Kurban Bayramı ve Ramazan Bayramı namazlarında ne okuduğunu sormuş ve o da \"Kaf Suresi ve Kamer Suresi\" demiştir. Bu hadis, araştırmacı tarafından Müslim (3/21), Ebu Davud (1154), Tirmizi (534), Nesai, Ahmed, İbn Hibban, Abdülrazzak, Şafiî, Muhammed ibn al-Hasan ve Beyhaki tarafından Malik'in sahabelerinin rivayet zincirleriyle nakledilmiştir. İbn Abdülberr'den rivayet edildiğine göre, bazı hadis âlimleri, Ubeydullah'ın Ömer ile görüşmediği gerekçesiyle hadisin kopuk olduğunu iddia ederken, diğerleri ise Ebu Vakid ile görüşmesinin tartışmasız olması nedeniyle hadisin bağlantılı olduğunu düşünmektedir (el-Temhid 16/328). Araştırmacı, Ebu Zura'nın bunu Ömer'den duymadığını açıkça belirttiğini ve İbn Huzeyme, el-Beyhaki ve el-Mizzi'nin de buna katıldığını ifade etmektedir. Bununla birlikte, Müslim'in hadis derlemesinde yer alan Fuleyh ibn Süleyman'ın \"Ebu Vakid dedi ki: Ömer bana sordu\" şeklindeki rivayeti, Fuleyh'in tek başına hareket ederken zayıf olduğu kabul edilse de, hadisi Ebu Vakid'den naklettiğini göstermektedir. Sonuç olarak, hadisin gerçekten Ebu Vakid'den geldiği ve Tirmizi'nin de Malik'in rivayet ettiği ifadeyi kullanarak sahih kabul ettiği için İbn Abdülberr'in ifadesinin en doğru olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.252} {cite:muwatta-maruf-1997 s.253} {cite:muwatta-maruf-1997 s.254}"
  id: "Hadits pertama dalam bab ini membahas tentang takbir dan bacaan dalam salat Id. Diriwayatkan oleh Yahya dari Malik, dari Damrah ibn Sa'id al-Mazini, dari Ubayd Allah ibn Abdullah ibn Utbah ibn Mas'ud: Umar ibn al-Khattab bertanya kepada Abu Waqid al-Laythi apa yang biasa dibaca Nabi dalam salat Idul Adha dan Idul Fitri, dan beliau menjawab: Surah Qaf dan Surah al-Qamar. Hadits ini dimasukkan oleh peneliti dalam Muslim (3/21), Abu Dawud (1154), al-Tirmidhi (534), al-Nasa'i, Ahmad, Ibn Hibban, Abd al-Razzaq, al-Shafi'i, Muhammad ibn al-Hasan, dan al-Bayhaqi melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa sebagian ulama hadits menyatakan hadits tersebut tidak berhubungan karena Ubayd Allah tidak bertemu dengan Umar, sementara yang lain menganggapnya berhubungan karena pertemuannya dengan Abu Waqid tidak diragukan (al-Tamhid 16/328). Peneliti menyatakan bahwa Abu Zur'ah secara eksplisit menyatakan bahwa ia tidak mendengarnya dari Umar, dan Ibnu Khuzaymah, al-Bayhaqi, dan al-Mizzi sepakat. Namun, riwayat Fulayh ibn Sulayman dalam kumpulan hadits Muslim, \"Abu Waqid berkata: Umar bertanya kepadaku,\" menunjukkan bahwa ia meriwayatkannya dari Abu Waqid, meskipun Fulayh dianggap lemah ketika bertindak sendiri. Ia menyimpulkan bahwa pernyataan Ibnu Abd al-Barr adalah yang paling akurat, karena hadits tersebut memang dari Abu Waqid, dan al-Tirmidhi mengesahkannya menggunakan redaksi yang diriwayatkan oleh Malik. {cite:muwatta-maruf-1997 hal.252} {cite:muwatta-maruf-1997 hal.253} {cite:muwatta-maruf-1997 hal.254}"
