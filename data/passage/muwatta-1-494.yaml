label: { ar: "الموطأ 494 — عمر يسأل أبا واقد الليثي: بم كان يقرأ النبي في الأضحى والفطر؟ بقاف والقمر", en: "Muwatta 494" }
summary:
  ar: "أول حديث في باب ما جاء في التكبير والقراءة في صلاة العيدين. يرويه يحيى عن مالك عن ضمرة بن سعيد المازني عن عبيد الله بن عبد الله بن عتبة بن مسعود: سأل عمر بن الخطاب أبا واقد الليثي بم كان النبي يقرأ في الأضحى والفطر، فقال: بسورة ق وسورة القمر. ويخرّجه المحقق عند مسلم (3/21) وأبي داود (1154) والترمذي (534) والنسائي وأحمد وابن حبان وعبد الرزاق والشافعي ومحمد بن الحسن والبيهقي من طرق أصحاب مالك. وينقل عن ابن عبد البر أن بعض أهل الحديث زعم أنه منقطع لأن عبيد الله لم يلق عمر، وأن غيره عدّه متصلاً لأن لقاءه لأبي واقد غير مدفوع (التمهيد 16/328)؛ ويقول المحقق إن أبا زرعة نص على عدم سماعه من عمر وتابعه ابن خزيمة والبيهقي والمزي، لكن رواية فليح بن سليمان عند مسلم «قال أبو واقد: سألني عمر» تدل على أنه رواه عن أبي واقد، وإن كان فليح ضعيفاً عند التفرد، ويختم بأن كلام ابن عبد البر هو الأصوب فالحديث حديث أبي واقد وقد صححه الترمذي بالصيغة التي رواها مالك. {cite:muwatta-maruf-1997 p.252} {cite:muwatta-maruf-1997 p.253} {cite:muwatta-maruf-1997 p.254}"
