  الاطلاع من اشراف الى انحدار وفى الحديث من هول المطلمع شبه ما أشرف عليه
  من أمر الاخرة بذلك وطليعة الجيش من يبعث ليطلع طلع العدو وطلاع الشئ ملؤه
  قال الشاعر يصف قوسا
