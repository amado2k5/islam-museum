  وقال الحسسن لان أعلم انى برءمن النفاق أحب الىّ من طلاع الارض ذهبا قال الاصعى
  طلاع الارس ملمؤها ونفس طلعة مثال همزة أى تكثر التطلع للشئء وكذلك امرأة
  طلعة قال الزبرقان ين بدرات أبغض كفائنى الى الطلعة الخبأة وطويلع ما لبنى تميم
  بالشاجنة ناحية الصمان وقال
  وأى فى ودّعت يوم طويلع * عشية سلناع ليه وسلا
