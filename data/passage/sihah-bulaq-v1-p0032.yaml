  ويقال فى التعجب طمع الرجل قلان بضم الميم أى صار كثير الطمع وخرجت المرأة فلانة اذا
  صارت كثيرة الخروج وقضو القاضى فلان وكذلكْ التعجب فى كل شئ الاما قالوا فى نعم ويقس
  رواية تروى عنه-م غير لازمة لقياس التعجب لان صور التعجب ثلاث ما أحسن زيداوأسمع به
  وكبرت كلة وقد شذعنها نعم وبئس والطمع رزق الجند يقال أمرلهم الاميرباطماعهم أى
  بأرزاقهم وامر أة مطماع تطامع ولا تمكن ( وع لان طوع يديك أى منقاد لك وقرس
  طوع العنان اذا كان -د اوالاستطاعة الاطاقة وربما قالوا اسطاع بستطيع يحذفون
  لتاء استثة الالهامع الطاء ويكرهون ادغام القاء فيها فتحرك السين وهى لا تحرّك أبدا وقرأ
  احزة فا اسطاعوا أن يظهروه بالادغام وجمع بين ساكنيز وذكر الاخفش ان بعض العرب
  ١٥٢
  ٢ قلت أى لا تكرثو الدفتمنعوا
  عن الاكل والشرب اه مخنار
