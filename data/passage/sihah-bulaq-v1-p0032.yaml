  وطبع السيف أى علاه الصدأ وقال الراجز
  انا اذاقات طخارير القزع * نفهلها البيض القليلات الطبع
  وطبعت السقاء وغيره تطبيها ملاته قتطبع أى امتلأ وناقة مطبعة أى مثقلة بالحه-ل قال
  الراجز وأين وسق الناقة المطبعه وبروى الجلنفعه ( لع طلعت الشمس
  والمكوكب طلوعا ومطلمعا ومطلعا والمطلع والمطلع أيضاموضع طلوء هاقال ابن السكيت
  طلعت على القوم اذا أتدتهم وقد طلعت عنهم اذا غبت عنهم وطلعت الجبل بالكسر أى علوته
  وفى الحديث لا يهيدنكم الطالع بعنى الفجر ااكاذب ؟ واطلعت على باطن أمره وهوافتعلات
  وطالعه بكتبه وطالعت الشئ أى اطلعت علميه وتطلعت الى ورود كتابك والطلعة الرؤية ٣
  والطلع طلع النخلة وأطلع النخل اذاخرج طلعه وأطلعتك على سرى ونخسلة مطلعة أيضا
  اذا طالت النخيل أى كانت أطول من سائرها وأطٰع الرامى أى جازسهمه من فوق الغرض
  وأطلع أى قاء والطلعاءمثال الغسلواء التىء واستطلعت رأى ذلان والطلع بالكسر الاسم
  من الاطلاع تقول منه اطلع طلع العدوّ ويقال أيضا كن بعالمع الوادى وطلع الوادى بالفتح
