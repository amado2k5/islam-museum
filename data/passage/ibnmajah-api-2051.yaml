label: { ar: "سنن ابن ماجه 2051 — الأب والأبوة", en: "Sunan Ibn Majah 2051 — the father and fatherhood", ur: "سنن ابن ماجہ 2051 — باپ اور والدیت", es: "Sunan Ibn Majah 2051 — El padre y la paternidad", fr: "Sunan Ibn Majah 2051 — le père et la paternité" }
text: "… عَنْ جَرِيرِ بْنِ حَازِمٍ، عَنِ الزُّبَيْرِ بْنِ سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَلِيِّ بْنِ يَزِيدَ بْنِ رُكَانَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّهُ طَلَّقَ امْرَأَتَهُ الْبَتَّةَ فَأَتَى رَسُولَ اللَّهِ ـ فَسَأَلَهُ فَقَالَ \" مَا أَرَدْتَ بِهَا \". قَالَ وَاحِدَةً. قَالَ \" آللَّهِ مَا أَرَدْتَ بِهَا إِلاَّ وَاحِدَةً قَالَ آللَّهِ مَا أَرَدْتُ بِهَا إِلاَّ وَاحِدَةً. قَالَ فَرَدَّهَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2051، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2051 (The Chapters on Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2051، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2051 (Los capítulos sobre el divorcio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2051 (Les chapitres sur le divorce), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
