text: "… البقرة:، وَلَقَدْ فَضَّلْنَا بَعْضَ النَّبِنَ عَلَى بَعْضِ الإسراء: وفي الحديث: المؤمنُ القَوي خيرٌ وأحَبُّ إلى اللَّهِ مِنَ المؤمنِ الضعيف. وفي كُلِّ خَيْرٌ. وحاصل هذا أن ترتيب أشخاص النوع الواحد بالنسبة إلى حقيقة النوع لا يمكن. وإنما يكون بالنسبة إلى ما …"
