label: { ar: "الموطأ 1169 — علي: نحر النبي بعض هديه بيده، ونحر غيره بعضه", en: "Muwatta 1169", es: "Muwatta 1169", fr: "Muwatta 1169", ur: "موطا 1169", tr: "Al-Muwatta 1169 — Ali: Peygamber kurbanlarının bir kısmını kendi eliyle kesti, bir kısmını da başkaları kesti.", id: "Al-Muwatta 1169 — Ali: Nabi menyembelih sebagian hewan kurbannya dengan tangannya sendiri, dan sebagian lainnya disembelih oleh orang lain." }
summary:
  ar: "يروي مالك عن جعفر بن محمد عن أبيه عن علي بن أبي طالب أن رسول الله نحر بعض هديه بيده، ونحر غيره بعضه. ويذكر المحقق أن ابن عبد البر قال إن الصحيح في إسناده جابر، وأن حديث علي إنما جاء من حديث عبد الرحمن بن أبي ليلى عنه. {cite:muwatta-maruf-1997 p.528}"
  tr: "Malik, Cafer ibn Muhammed'den, o da babasından, o da Ali ibn Abi Talib'den rivayetle, Allah Resulü'nün kurbanlarının bir kısmını kendi eliyle kestiğini, bir kısmını da başkalarının onun adına kestiğini nakletmiştir. Araştırmacı, İbn Abdül-Barr'ın, doğru rivayet zincirinin Cabir'i de içerdiğini ve Ali'nin hadisinin ancak onun rivayetiyle Abdül-Rahman ibn Abi Leyla'nın hadisinden geldiğini söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.528}"
  id: "Malik meriwayatkan dari Ja'far bin Muhammad, dari ayahnya, dari Ali bin Abi Talib, bahwa Rasulullah menyembelih sebagian hewan kurbannya dengan tangannya sendiri, dan sebagian lainnya disembelih atas namanya. Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa sanad yang benar mencakup Jabir, dan bahwa hadits Ali hanya datang melalui hadits Abd al-Rahman bin Abi Layla atas otoritasnya. {cite:muwatta-maruf-1997 p.528}"
