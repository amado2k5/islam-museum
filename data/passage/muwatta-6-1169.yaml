summary:
  ar: "يروي مالك عن جعفر بن محمد عن أبيه عن علي بن أبي طالب أن رسول الله نحر بعض هديه بيده، ونحر غيره بعضه. ويذكر المحقق أن ابن عبد البر قال إن الصحيح في إسناده جابر، وأن حديث علي إنما جاء من حديث عبد الرحمن بن أبي ليلى عنه. {cite:muwatta-maruf-1997 p.528}"
