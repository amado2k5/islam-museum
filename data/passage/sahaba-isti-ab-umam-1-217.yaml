text: "… عمكة وهاجر الى ارض الحبشة ثم قدم مع اهل السفينتين ورسول اللّٰه بخيبر قال الوافدى وناخالد ابن الباس عن ابى بكربن عبد اله بن الي الجهم وكان علامة نسابة قال ليس ابوموسى من مهاجرة الحبشة وليس له حلف فى قريش …"
