label: { ar: "الموطأ 235 — ابن عمر يعلّم صفة الجلوس والإشارة بالإصبع", en: "Muwatta 235" }
text: "كان إذا جلس في الصلاة وضع كفه اليمنى على فخذه اليمنى وقبض أصابعه كلها وأشار بإصبعه التي تلي الإبهام، ووضع كفه اليسرى على فخذه اليسرى"
summary:
  ar: "أول حديث في باب العمل في الجلوس في الصلاة. يرويه يحيى عن مالك عن مسلم بن أبي مريم عن علي بن عبد الرحمن المعاوي: رآه عبد الله بن عمر يعبث بالحصى في الصلاة فنهاه بعد انصرافه وأمره أن يصنع كما كان النبي يصنع، ووصف له أنه كان إذا جلس في الصلاة وضع كفه اليمنى على فخذه اليمنى وقبض أصابعه كلها وأشار بالسبابة، ووضع كفه اليسرى على فخذه اليسرى. ويخرّجه المحقق عند مسلم (2/90) وأبي داود (987) والنسائي وابن حبان (1942) وأحمد والشافعي من طرق أصحاب مالك، وعند الحميدي وأحمد ومسلم والنسائي من طريق ابن عيينة عن مسلم بن أبي مريم، ويحيل على التمهيد (13/193). {cite:muwatta-maruf-1997 p.142}"
