label: { ar: "الموطأ 235 — ابن عمر يعلّم صفة الجلوس والإشارة بالإصبع", en: "Muwatta 235", es: "Muwatta 235", fr: "Muwatta 235", ur: "موطا 235", tr: "El-Muvatta 235 — İbn Ömer oturma ve parmakla işaret etme şeklini öğretiyor.", id: "Al-Muwatta 235 — Ibnu Umar mengajarkan tata cara duduk dan menunjuk dengan jari." }
text: "كان إذا جلس في الصلاة وضع كفه اليمنى على فخذه اليمنى وقبض أصابعه كلها وأشار بإصبعه التي تلي الإبهام، ووضع كفه اليسرى على فخذه اليسرى"
summary:
  ar: "أول حديث في باب العمل في الجلوس في الصلاة. يرويه يحيى عن مالك عن مسلم بن أبي مريم عن علي بن عبد الرحمن المعاوي: رآه عبد الله بن عمر يعبث بالحصى في الصلاة فنهاه بعد انصرافه وأمره أن يصنع كما كان النبي يصنع، ووصف له أنه كان إذا جلس في الصلاة وضع كفه اليمنى على فخذه اليمنى وقبض أصابعه كلها وأشار بالسبابة، ووضع كفه اليسرى على فخذه اليسرى. ويخرّجه المحقق عند مسلم (2/90) وأبي داود (987) والنسائي وابن حبان (1942) وأحمد والشافعي من طرق أصحاب مالك، وعند الحميدي وأحمد ومسلم والنسائي من طريق ابن عيينة عن مسلم بن أبي مريم، ويحيل على التمهيد (13/193). {cite:muwatta-maruf-1997 p.142}"
  id: "Hadits pertama dalam surah tentang amalan-amalan saat shalat. Diriwayatkan oleh Yahya dari Malik, dari Muslim ibn Abi Maryam, dari Ali ibn Abd al-Rahman al-Mu'awi: Abdullah ibn Umar melihatnya bermain dengan kerikil saat shalat, lalu ia melarangnya setelah selesai shalat dan memerintahkannya untuk melakukan seperti yang biasa dilakukan Nabi (shalawat dan salam kepadanya). Ia menjelaskan kepadanya bahwa ketika Nabi (shalawat dan salam kepadanya) duduk shalat, beliau meletakkan tangan kanannya di paha kanannya, mengepalkan semua jarinya, dan menunjuk dengan jari telunjuknya, dan beliau meletakkan tangan kirinya di paha kirinya. Peneliti memasukkannya ke dalam koleksi Muslim (2/90), Abu Dawud (987), al-Nasa'i, Ibn Hibban (1942), Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik, dan ke dalam koleksi al-Humaydi, Ahmad, Muslim, dan al-Nasa'i melalui sanad Ibn Uyaynah berdasarkan riwayat Muslim ibn Abi Maryam. Ia merujuk pada al-Tamhid (13/193). {cite:muwatta-maruf-1997 p.142}"
