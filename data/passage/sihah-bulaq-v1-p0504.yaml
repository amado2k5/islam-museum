text: |-
  ١٣٧
  أرض مغشة ومغيوثه. هال ذو لرمة قاتل الله أمة بيى فسلان ما أهصمها قلت لهنا كيف كان
  المطر عندكم ذقسالت غننا ماشتنا ورى سمى السجاب والنبات بذلك
  صل النا * ف ت) الفت نبت يختبز حبه وإؤكل فى الجدب وتكون خيزته غليظة
  شيهة بخبزالملة قال الشاعر أ ودهبل
  حرمية لم تخبز أمها * فشاولم تستضرم العرفجا
  ( حث الفحث بكسر الحماءلغة فى حفت السكرش وهى القبة ذات الاطياق ⁦( ث )⁩
  الفرث السرجين مادام فى الكرش والجمع فروث ابن السكيت فرات للقوم جلة فأنا أفرنها
  وأفرثها اذاسْقة تها ثم نثرت مافيها قال وفرتت كبده أفرئها وأفرتها فرثا وفرّثتها تفرينااذا
  ضريته وهوسى فانفرنت كبده أى انتترت قال وأفوئت المكرش اذا شققتها وألقيت مافيها
  قال وأفرثت أصحابى اذاعرضتهم للائعمة الناس
  (ف صل القاف (قنث ياءفلان يقت مالا أى يجر (ق ث الكسائ نخل
  قريشاء وبسرريثاء مدود بغير تنو بن اضرب من التمروهو أطيب التمر بسراوقال أبو الجراح
  ترقر يثاغير ممدود والقرّيثلغة فى الجريث وهوضرب من السمك ⁦( عث)⁩ ابن السكيت
  أقعث الرجل فى ماله أى أسرف وأقسث له العطية أى أجزلها له قال رؤبة
  أقعثنى منه بيب مقعث والقعيث المطر الكثير والسيب الكثير وقال بمضهم
  مثن له قعية أى -فنت له -فنة اذا أعطته قللا فجعله من الاضداد قال الاصمعى ضربه
  فانقعث اذا قلعه من أصله وانقعث الحائط اذاسقط من أصله مثل انقعف
  صل الكاف كبث الكباث بالفتح النضيج من عر الاراك ومالم يونع فهوبرير
  وكيث اللحم بالكسر أى تغير وأروح ويقشد
  أصبح همارنشيطا أبنا • يأكل لهاباتناقد كبنا
  ( نت كت الشئ كتائة أى كثف ولحية كنة وكناء أيضا ورجل كث اللعية وقوم
  كُث مثل قولك رجل صدق اللقاء وقوم صدق والكشكت والكشكث فتات اخجارة والتراب
  مثل الاثلب والاثلب يقال بفيه الكنكث والمكنكث ⁦(ترث)⁩ الكتراث بقل وكرته
  الغم بكرثه بالضم أى اشتدعليه وبلغ منه المشقة وأك رنه مثله قال الاصعى لا يقال
  كرمه وانما يقال أكرته لى أن رؤية قد قاله .
  وقد تجلى الكرب والكوارث
  ويقال ما أكترت له أى ما أبالى به ( شث الكشوث نيت يتعلق بأغضان الشجر من
  غير أن يضرب بعرق فى الارض قال الشاعر
  هو الكشوث فلا أصل ولاورق * ولا نسيم ولاظل ولاعر
  صل الللام ث) اللبت واللباث المكت وقد لبت يلبث لبناع لى غير قياس لان
  المصدر من فعل بالكسرقياسه التحريك اذالم يتعدّمثل تعب تعبا وقدجاء فى الشعر على
  القياس قال جرير
  وقد أكون على الحاجات ذالبث • وأحوذيا ذا انضم الذعاليب
