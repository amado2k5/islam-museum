text: "… في مرضه الذى توفى فيه، ودخلت أَمْ بِشْر بنتِ البراء ين مَعْرور تَموده : يا أم بشر !، إن هذا الْأَرّانَ وجدتُ فِيه انقطاع أَيْهَرِي من الأكْلَة الى أكات مع أخيك يَخيبر. قال : فإن كان المسلمون كَيُروْن أنّ رسولَ …"
