text: "… لم أعثر على كلام الحسن وما وجدته عن أبي سليمان الداراني بلفظ : هانوا عليه فتركهم وعصوا، ولو كرموا عليه منعهم عنها. انظر : حلية الأولياء، وشعب الإيمان."
summary:
