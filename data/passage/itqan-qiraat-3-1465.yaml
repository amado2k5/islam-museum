text: "… تفسير أو دعاء قبل أن يأمر عثمان بحرق ما سوى المصحف الإمام. وقد اتفق أبيّ وجميع الأمّة على قبول مصحف عثمان، وأن ما انطوى عليه هو جميع القرآن الثابت في العرضة الأخيرة، وأن ما خالفه وزاد عليه فليس بقرآن، والأمّة …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 1465، يذكر قراءات القرآن، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 1465, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 1465 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 1465, que menciona las lecturas del Corán, la recopilación del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre « al-Itqan fi 'Ulum al-Qur'an » d'al-Suyuti (tome 3, p. 1465), numérisé, mentionnant les lectures du Coran, sa compilation et les codex, ainsi que l'orthographe du mushaf. Cet extrait est cité dans un exemplaire de la numérisation automatique, conformément à la politique relative aux sources (quarante mots maximum). Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 3. cildinin 1465. sayfasından, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları ile Kur'an'ın yazısını ele alan bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 3, halaman 1465, yang membahas bacaan Al-Qur'an, penyusunan Al-Qur'an dan manuskripnya, serta aksara Al-Qur'an; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan diakritik."
