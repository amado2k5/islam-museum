text: |-
  ٣٧٦
  •⁦(فصل الرام)⁩.
  •⁦(رزن)⁩•
  قال وقال كناز الجرمى *بها أفنها وبم ساذابها* بالباه وقال ءويف القواف
  نرد الكتيبة-غلولة • بها أفتها وبهاذامها
  بالميم ⁦(ذهن)⁩ الذهن الفطنة والحفظ والذهن بالحريك مثله والذهن القوّة وقال الشاعر
  أنوبرجل بهناذهتها * وأعيت بها أختها الغابره
  (فصل الراء (وتن الرتن انخلط ومفه الموتنة (دثن أبوزيد الرقان من
  المطر القطار المتتابعة بفصل بيتهن سكون يقال أرض مرثنة ترئينا ئعن
  الارثمنان الاسترخاه ⁦(رجن)⁩ دجن بالمكان يرجن رجونا أقام به والراجن الآلف
  مثل الداجن قال الفراء رجذت الابل ورجنت أيضا بالكسر وهى راجنة وقد رجنتها
  أنا وأرجنتها اذا حدتها لتعلفها ولم تسرحها ورجن فلان دابته رحنا حدها وأساء
  علفها حتى تهزل ورجنت هى ينفسها رجونا يتعدّى ولا يتعدّى فهى شاة راجن وارتجن على
  القوم أمرهم اختلط وارتجن الزبد طبخ فلم يصفة وفسد ⁦( ربهن)⁩ ارجحن الشئمال
  وفى المثل اذا ارحن شاصيا قارفع يدا أى اذا مال رافعارحليه يعنى اذاخضع لك فا كفف
  عنه وارجن الشاهتز قال الخليل ارجن اذا وقعبرّة وجيش مربهنّ ورحى مى عنة
  أى ثقيلة قال النابغة
  اذا رجفت فيه رحى مربحنة • تبعج تجاجاءزير الحوافل
  دن) الردن بالضم أصل الكتم يقال قيص واسع الردن وأردنت القميص وردّت
  تدينا جعات له ردنا والهع أردان وقال
  وعمرة من سروات النساء تنفح بالمسال أردانها
  ويقال هو الكم وما يليسه وأردنت الجمى مثل أردمت والمردن المظلم وقال الفراءردن
  جلده بالسكسريردن ردنا اذا تقبض وتشتج والردن بالتهريك الخزفال عدىّ بن زيد
  واقد ألهو يكرشادن • مسها ألين من مسّ الردن
  وقال الاعشى
  يشو الامورويجتابها • كشق الرارى ثوب الردن
  ويقال الردن الغزل والمردن المغزل ويقال الردن الغرس الدّى يخر ج مع الولد تقول العرب
  هذا مدرع الردن وردنت المتاع رد نانضدته والردن بالفتح وسكون الدال صوت وقع السلاح
  بعضه على بعض والاردن بالضم والتشديد الفعاس ولم يسمع منه فعل وقال الراجزاباق
  الدبيرى قد أخذتنى نعسة أردة * وموهب.بز بهامصن
  والاردن أيضا اسم نهروكورة بأعلى الشأم والقناة الردينية والرمح الردين زعموا أنه منسوب
  الى امرأة السمهرى تسهى ردينة وكاناية ومان القنابخط هجر وفى كلام بعضهم وخطية ردن
  ورماح لدن والرادن الزعفران ويفشد• وأخذت من رادن وكركم• ويقال للشئءاذا
  خالط حرته صفرة أحررادنى بقال بعيررادتى وناقة رادنية اذاخالطت~ رته صقرة كالورس
  والاردن ضرب من الخز الاحر زن الرنن المكان المرتفع وفيه طمأنينة عمسك الماء
  والمع وزون ورزان مثل فرخ وفروخ وفراخ قال سيد الارقط • أسقب ميفاء على الرزون
  أبو عبيدة الرزان مناقع الماء واحدته ارزنة بالكسر والرزانة الوقاد وقدرزن الرجل
