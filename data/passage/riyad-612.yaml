label:
  ar: "رياض الصالحين 612 — ما منعك أن تأكل بيمينك إلا الكبر"
  en: "Riyad al-Salihin 612 — Nothing kept him from eating with his right hand but pride"
  es: "Riyad al-Salihin 612 — Nada le impedía comer con la mano derecha salvo el orgullo."
  fr: "Riyad al-Salihin 612 — Rien ne l'empêchait de manger de la main droite, si ce n'est l'orgueil."
  ur: "ریاض الصالحین 612 - اسے دائیں ہاتھ سے کھانے سے کسی چیز نے نہیں روکا سوائے فخر کے"
  tr: "Riyad as-Salihin 612 — Sağ elinizle yemek yemenize engel olan tek şey gururdu."
  id: "Riyad as-Salihin 612 — Tidak ada yang menghalangimu untuk makan dengan tangan kanan kecuali kesombongan."
text: "أَنَّ رَجُلاً أَكَلَ عِنْدَ رَسُولِ اللَّهِ بِشِمَالِهِ فَقَالَ: «كُلْ بِيَمِينِكَ»، قَالَ: لاَ أَسْتَطِيعُ، قَالَ: «لاَ اسْتَطَعْتَ» مَا مَنَعَهُ إِلاَّ الْكِبْرُ، قَالَ فَمَا رَفَعَهَا إِلَى فِيهِ"
summary:
