label: { ar: "الموطأ 650 — عائشة تبعث بريرة خلف النبي ليلاً فيأتي البقيع: إني بعثت إلى أهل البقيع لأصلي عليهم", en: "Muwatta 650", es: "650 Muwatta", fr: "650 Muwatta", ur: "650 موطا", tr: "Muvatta 650 — Aişe, geceleyin Peygamber'in ardından Barirah'ı gönderir ve o da Bakî'nin yanına gelir: \"Bakî kavmine namaz kılmak için gönderildim.\"", id: "Al-Muwatta 650 — Aisyah mengutus Barirah menyusul Nabi di malam hari, dan dia sampai di Al-Baqi’: “Aku diutus kepada penduduk Al-Baqi’ untuk mendoakan mereka.”" }
text: "إني بعثت إلى أهل البقيع لأصلي عليهم"
summary:
  ar: "يرويه مالك عن علقمة بن أبي علقمة عن أمه، أنها سمعت عائشة تقول: قام النبي ذات ليلة فلبس ثيابه ثم خرج، فأمرت جاريتي بريرة أن تتبعه، فتبعته حتى جاء البقيع فوقف في أدناه ما شاء الله أن يقف ثم انصرف، فسبقته بريرة فأخبرتني، فلم أذكر له شيئاً حتى أصبح، ثم ذكرت ذلك له فقال إنه بُعث إلى أهل البقيع ليصلي عليهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وابن القاسم عند النسائي (4/93) وفي الكبرى (2165)، ويحيل على التمهيد (20/110). {cite:muwatta-maruf-1997 p.331}"
  tr: "Malik, Alkame ibn Abi Alkame'den, annesinin rivayetine dayanarak, Aişe'nin şöyle dediğini işittiğini aktarmıştır: “Peygamber bir gece kalktı, elbiselerini giydi ve dışarı çıktı. Hizmetçim Barirah'a onu takip etmesini emrettim. O da onu El-Baki mezarlığına kadar takip etti. Allah dilediği kadar mezarlığın kenarında durdu, sonra ayrıldı. Barirah ondan önce oraya vardı ve bana anlattı, ama ben sabaha kadar ona hiçbir şey söylemedim. Sonra ona anlattım ve o da El-Baki halkına namaz kılmak için gönderildiğini söyledi.” Editör, bunun Malik'ten Ebu Mus'ab, Suveyd, El-Ka'nebi ve İbn Al-Kâsim tarafından En-Nasa'i'de (4/93) ve El-Kübra'da (2165) rivayet edildiğini ve At-Tamhid'e (20/110) atıfta bulunduğunu belirtmektedir."
  id: "Malik meriwayatkan hadits ini dari Alqamah ibn Abi Alqamah, yang meriwayatkan dari ibunya, yang berkata bahwa ia mendengar Aisyah berkata: “Nabi bangun pada suatu malam, mengenakan pakaiannya, dan keluar. Aku memerintahkan pelayanku, Barirah, untuk mengikutinya. Ia mengikutinya sampai beliau sampai di pemakaman Al-Baqi’. Beliau berdiri di tepi pemakaman itu selama yang dikehendaki Allah, lalu beliau pergi. Barirah sampai di sana sebelum beliau dan memberitahuku, tetapi aku tidak menyebutkan apa pun kepadanya sampai pagi. Kemudian aku menceritakannya kepadanya, dan dia berkata bahwa dia telah diutus kepada penduduk Al-Baqi’ untuk mendoakan mereka.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, Al-Qa’nabi, dan Ibn Al-Qasim dalam An-Nasa’i (4/93) dan dalam Al-Kubra (2165), dan ia merujuk pada At-Tamhid (20/110)."
