label: { ar: "الموطأ 650 — عائشة تبعث بريرة خلف النبي ليلاً فيأتي البقيع: إني بعثت إلى أهل البقيع لأصلي عليهم", en: "Muwatta 650" }
text: "إني بعثت إلى أهل البقيع لأصلي عليهم"
summary:
  ar: "يرويه مالك عن علقمة بن أبي علقمة عن أمه، أنها سمعت عائشة تقول: قام النبي ذات ليلة فلبس ثيابه ثم خرج، فأمرت جاريتي بريرة أن تتبعه، فتبعته حتى جاء البقيع فوقف في أدناه ما شاء الله أن يقف ثم انصرف، فسبقته بريرة فأخبرتني، فلم أذكر له شيئاً حتى أصبح، ثم ذكرت ذلك له فقال إنه بُعث إلى أهل البقيع ليصلي عليهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وابن القاسم عند النسائي (4/93) وفي الكبرى (2165)، ويحيل على التمهيد (20/110). {cite:muwatta-maruf-1997 p.331}"
