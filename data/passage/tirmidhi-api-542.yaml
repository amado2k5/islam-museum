label: { ar: "جامع الترمذي 542 — الأب والأبوة", en: "Jami' al-Tirmidhi 542 — the father and fatherhood", ur: "جامع ترمذی 542 — باپ اور والدیت", es: "Jami' al-Tirmidhi 542 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 542 — le père et la paternité", tr: "Cami' el-Tirmizi 542 — Baba ve Babalık", id: "Jami' al-Tirmidhi 542 — Sang Ayah dan Peran Ayah" }
text: "… الْبَزَّارُ الْبَغْدَادِيُّ، حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، عَنْ ثَوَابِ بْنِ عُتْبَةَ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ كَانَ النَّبِيُّ لاَ يَخْرُجُ يَوْمَ الْفِطْرِ حَتَّى يَطْعَمَ وَلاَ يَطْعَمُ يَوْمَ الأَضْحَى حَتَّى يُصَلِّيَ. قَالَ وَفِي الْبَابِ عَنْ عَلِيٍّ وَأَنَسٍ. قَالَ أَبُو عِيسَى حَدِيثُ بُرَيْدَةَ بْنِ حُصَيْبٍ الأَسْلَمِيِّ حَدِيثٌ غَرِيبٌ. وَقَالَ مُحَمَّدٌ لاَ أَعْرِفُ لِثَوَابِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 542، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 542 (The Book on the Two Eids), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 542، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 542 (El Libro de las Dos Fiestas), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 542 (Le Livre des Deux Aïds), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 542 numaralı hadisinde baba ve babalık konusu ele alınmaktadır. Araştırmacı, bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 542, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
