text: "… محمد ثنا أبو زرعة ثنا عمرو بن خالد ثنا عيسى بن يونس عن عيسى بن سنان عن الضحاك بن عبد الرحمن بن عرزب قال : دعا أبو موسى الأشعرى فتيانه حين حضرته الوفاة، فقال : اذهبوا واحفروا وأوسعوا وأعمقوا فياؤا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 262، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 262, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
