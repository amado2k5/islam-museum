label: { ar: "موطأ مالك 558 — الأب والأبوة", en: "Muwatta Malik 558 — the father and fatherhood", ur: "موطأ مالک 558 — باپ اور والدیت", es: "Muwatta Malik 558 — El padre y la paternidad" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ مُحَمَّدِ بْنِ أَبِي بَكْرِ بْنِ عَمْرِو بْنِ حَزْمٍ، عَنْ أَبِيهِ، عَنْ أَبِي النَّضْرِ السَّلَمِيِّ، أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يَمُوتُ لأَحَدٍ مِنَ الْمُسْلِمِينَ ثَلاَثَةٌ مِنَ الْوَلَدِ فَيَحْتَسِبُهُمْ إِلاَّ كَانُوا جُنَّةً مِنَ النَّارِ \". فَقَالَتِ امْرَأَةٌ عِنْدَ رَسُولِ اللَّهِ يَا رَسُولَ اللَّهِ أَوِ اثْنَانِ قَالَ \" أَوِ اثْنَانِ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 558، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 558 (Burials), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 558، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "En el Muwatta Malik, n.º 558 (Entierros), se menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
