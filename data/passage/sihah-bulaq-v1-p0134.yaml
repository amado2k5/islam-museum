  الاسل فانه رهص والادمص الذى رق حاجبه من أخر وكثف من قدم أورق من رأسه
  مواضع وقل شعره والدومص بيضة الحديد ⁦(ديص)⁩ داص يديص ديصانا أى راغ
  وحاد قال الراجز ان الجواد قدرأى وبيصها • فاينماداصت يدص مديصها
  وداصت السلعة وهى الغدّة اذاحرّ كنها بيدك فجاءت وذهبت وربول دياص اذا كان لا يقدر
  عليه والدائص اللص والجمع الداصة مثل قائد وقادة وذاتدوذادة والاندياص انسلال الشئ
  من اليدويقسال انداص فلان علينا بشره وانه لمنداص بالشر
  سل الرا بص النربص الانتظار والمتربص المحتكرولى فى متاعى ويصة
  أى لى فيه زبص رخص الخص ضد الغلا وقد رخص السعر وأرخصه اللّٰه فهو
