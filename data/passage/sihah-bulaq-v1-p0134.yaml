  والدلامص البرّاق والداص مقصور منه والميم زائدة وكذلك الدمالص والدماص وانداص
  الشي من يدى أسسقط والدلوص مثال الخنوص الذى يداص قال الراجز
  بات يضوز الصليان ضوزا * ضوز العجوز لعصب الدلوما
