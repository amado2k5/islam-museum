text: "… ومنعوا بلادهم حتى صالحوا عليها. وليس عليهم. إلا ما صالحوا عليه، ولا أرى أن يُزاد عليهم ولا يؤخذ منهم إلا ما فرض عمر ابن الخطاب، لأن عمر خطب الناس، فقال : قد فرضت لكم الفرائض، وسُنَّت لكم السُنَن، وتُرِكْتم على …"
