label: { ar: "الموطأ 561 — من قال سبحان الله وبحمده في يوم مئة مرة حطت عنه خطاياه وإن كانت مثل زبد البحر", en: "Muwatta 561", es: "Muwatta 561", fr: "Muwatta 561", ur: "موطا 561", tr: "Al-Muwatta 561 — Kim bir günde yüz defa “Sübhanallah ve bihamdihi” (Allah'a hamd olsun) derse, günahları denizin köpüğü kadar çok olsa bile affedilir.", id: "Al-Muwatta 561 — Barang siapa mengucapkan “Subhan Allah wa bihamdihi” (Maha Suci Allah dan segala puji bagi-Nya) seratus kali dalam sehari, maka dosa-dosanya akan diampuni meskipun jumlahnya sebanyak buih di laut." }
text: "من قال: سبحان الله وبحمده في يوم مئة مرة، حطت عنه خطاياه وإن كانت مثل زبد البحر"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر عن أبي صالح السمان عن أبي هريرة، أن النبي أخبر أن من قال سبحان الله وبحمده في يوم مئة مرة حُطت عنه خطاياه وإن كانت مثل زبد البحر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والقعنبي عند البخاري (6405)، وعبد الرحمن المحاربي عند ابن ماجة (3812) والترمذي (3466)، ويحيى بن يحيى النيسابوري عند مسلم (8/69). {cite:muwatta-maruf-1997 p.288}"
  id: "Diriwayatkan oleh Malik dari Sumayy, budak yang dibebaskan oleh Abu Bakr, dari Abu Salih al-Samman, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) bersabda bahwa siapa pun yang mengucapkan \"Subhan Allah wa bihamdihi\" (Maha Suci Allah dan segala puji bagi-Nya) seratus kali sehari, dosa-dosanya akan diampuni meskipun jumlahnya sebanyak buih di laut. Peneliti menyebutkan bahwa diriwayatkan dari Malik oleh Abu Mus’ab, dan dari rantainya oleh Ibnu Hibban, al-Baghawi, al-Qa’nabi (sebagaimana dicatat oleh al-Bukhari, 6405), ‘Abd al-Rahman al-Muharibi (sebagaimana dicatat oleh Ibnu Majah, 3812), al-Tirmidzi (sebagaimana dicatat oleh al-Tirmidzi, 3466), dan Yahya ibn Yahya al-Naysaburi (HR Muslim, 8/69). {mengutip:muwatta-maruf-1997 hal.288}"
