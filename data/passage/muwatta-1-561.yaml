text: "من قال: سبحان الله وبحمده في يوم مئة مرة، حطت عنه خطاياه وإن كانت مثل زبد البحر"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر عن أبي صالح السمان عن أبي هريرة، أن النبي أخبر أن من قال سبحان الله وبحمده في يوم مئة مرة حُطت عنه خطاياه وإن كانت مثل زبد البحر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، والقعنبي عند البخاري (6405)، وعبد الرحمن المحاربي عند ابن ماجة (3812) والترمذي (3466)، ويحيى بن يحيى النيسابوري عند مسلم (8/69). {cite:muwatta-maruf-1997 p.288}"
