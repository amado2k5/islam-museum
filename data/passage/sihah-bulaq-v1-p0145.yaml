text: |-
  المردقوس بضم المسيم والدال
  والفاف اه مترجه
  ٤٩٦
  ( ⁦(باب الشين)⁩
  الفخمة الخاصرتين كرشاء والكرشا القدم التى كثرلحها واستوى أخصها وقصرت
  أصابعها كشش كشيش الافعى وتها من جلدها لا من فيها وقد كنت تمكس
  قال الراجز
  كأن صوت شخبها المرفض • كشيش أفعى أزمعت لعض • فهى تحل بعضها ببعض
  وكنكنت مثله وكشت البقرة صاحت وكشيش الشراب صوت غليانه وكشيش الزند
  صوت خوار تسمعه عند خروج الشاروكشكشة بنى أسد أبدال السين من كاف اللخطاب
  للمؤنث كواهم عليش وبش فى عليك وبك فى موضع التأنيث قال الاصمحى اذا بلغ الذكرمن
  الابل الهسديرفاً وه الكشيش وقد كش يكش قال رؤية ١ درت هدر اليس بالكشيش
  وبعير مكشاش قال العنيرى
  فى العنبر بين ذوى الارياش • يهدرهدراليس بالمسكشاش
  فاذا ارتفع قليلا قيل كت فاذا أفصح قيل هدرفاذاصفاصوته ورجع قيل رقر⁦(ك.س)⁩
  الكس الرجل السريع الماضى وقد كش بالضم كاشة فهوكش وكيس وكشته تكميث
  أهجلته وانكمس وتكم ش أسرع والكمشة الفاقة الصغيرة الضرع وفرس كش وكديس صغير
  لجردان وأكشت الناقة أى سنررت أخلافهااجمع
  صل الميم حس المعساحراف النار الجاد وقد محشت جلده أى أحرقته وفيه
  لغة أخرى أعحشته بالنار عن ابن السكيت وحكى هوءن أبى صاعد الكلابى أمحشه الحر
  أى أحره قال وحكى أبو عمر وهذه سنة قد أمحشت كل شئ اذا كانت جسدية والامتهاش
  الاحتراق يقال امهس الخبز وامتش فلان غضبا والعاش بالضم المحترق يقال خبز محاش
  وشوا محاش والمحناش بالفتح المتاع والاثاث حكاه أبوعبيد والمحاش بالكسر القوم
  يجتمعون من قبائل فيم الفون عمد الذاروهو فى قول النابغة
  جع محاشك بايزيد فاننى • أحددت يربوعالسكم وعيما
  ومحس الشئ صبه قال أبو عمروية ولون مرت ب غرارة فمنتف أى صيتى وقال
  الكلابى أقول مرت بى غرارة فشتى ⁦( مدس)⁩ المدش رخاوة عصب اليد وقلة لمها
  ورجل أمدش اليد وقد مدش مدشاوامرأة مدشاء اليد رش مرش كاتحدش قال
  ابن السكيت أصابه هرش وهى المروش والخ دوش والخروش والمرش أيضا الارض التى
  مرش المطروجهها يقال انتهينا الى مرش من الامراش والامتراش الانتزاع بقال
  امترشت الشيء من يده أى انتزعته ( حردقش قال ابن السكيت المردقوش
  المرزنجوش وأنتدلا بن مقبل
  يعلون بالمردقوش الورد ضاحية • على سعابيب ماء الضالة اللجز
  ويقال هو الزعفران وأنا أظنه معر با ومن خفض الورد جعله من نعته واللجز اللزج
  نش مشيده يمشها أى مسبهابنى ليتظافها بقال اعطنى منوشا أمن يديدى
  أى منديلا أوشينا أسسح بديدى وقال الاصمعى المسمسح اليد بالشئ الخشن
  يقلع الدسم وقال امر والقيس
