text: "قال رسول الله: «إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم»"
summary:
  ar: "رواية أبي هريرة في كتاب البر من صحيح مسلم؛ النظر الإلهي إلى القلوب والأعمال لا إلى الصور والأموال — من أجمع نصوص حقيقة القيمة الإنسانية."
  tr: "Sahih Müslim'deki Salihlik Kitabı'nda Ebu Hurayra'nın rivayetine göre; ilahi bakış, bedenler ve zenginlik üzerinde değil, kalpler ve ameller üzerindedir; bu, insan değerinin gerçekliği üzerine en kapsamlı metinlerden biridir."
  id: "Riwayat Abu Hurairah dalam Kitab Kebajikan dari Sahih Muslim; pandangan ilahi tertuju pada hati dan perbuatan, bukan pada gambar dan harta benda — salah satu teks terlengkap tentang hakikat nilai manusia."
