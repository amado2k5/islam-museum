label: { ar: "سنن أبي داود 3488 — ما حُرّم", en: "Sunan Abi Dawud 3488 — what was made unlawful", ur: "سنن ابی داؤد 3488 — جو حرام کیا گیا", es: "Sunan Abi Dawud 3488: lo que se declaró ilegal", fr: "Sunan Abi Dawud 3488 — ce qui a été rendu illégal" }
text: "… الرُّكْنِ - قَالَ - فَرَفَعَ بَصَرَهُ إِلَى السَّمَاءِ فَضَحِكَ فَقَالَ \" لَعَنَ اللَّهُ الْيَهُودَ \". ثَلاَثًا \" إِنَّ اللَّهَ حَرَّمَ عَلَيْهِمُ الشُّحُومَ فَبَاعُوهَا وَأَكَلُوا أَثْمَانَهَا وَإِنَّ اللَّهَ إِذَا حَرَّمَ عَلَى قَوْمٍ أَكْلَ شَىْءٍ حَرَّمَ عَلَيْهِمْ ثَمَنَهُ \". وَلَمْ يَقُلْ فِي حَدِيثِ خَالِدِ بْنِ عَبْدِ اللَّهِ الطَّحَّانِ \" رَأَيْتُ \". وَقَالَ \" قَاتَلَ اللَّهُ الْيَهُودَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3488، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3488 (Wages (Kitab Al-Ijarah)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3488، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3488 (Salarios (Kitab Al-Ijarah)), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3488 (Salaires (Kitab Al-Ijarah)), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
