label: { ar: "سنن أبي داود 2043 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 2043 — a burial, grave or resting place", ur: "سنن ابی داؤد 2043 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 2043 — un lugar de entierro, tumba o descanso", fr: "Sunan Abi Dawud 2043 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… عَنْ رَسُولِ اللَّهِ حَدِيثًا قَطُّ غَيْرَ حَدِيثٍ وَاحِدٍ. قَالَ قُلْتُ وَمَا هُوَ قَالَ خَرَجْنَا مَعَ رَسُولِ اللَّهِ يُرِيدُ قُبُورَ الشُّهَدَاءِ حَتَّى إِذَا أَشْرَفْنَا عَلَى حَرَّةِ وَاقِمٍ فَلَمَّا تَدَلَّيْنَا مِنْهَا وَإِذَا قُبُورٌ بِمَحْنِيَّةٍ قَالَ قُلْنَا يَا رَسُولَ اللَّهِ أَقُبُورُ إِخْوَانِنَا هَذِهِ قَالَ \" قُبُورُ أَصْحَابِنَا \". فَلَمَّا جِئْنَا قُبُورَ الشُّهَدَاءِ قَالَ \" هَذِهِ قُبُورُ إِخْوَانِنَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2043، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2043 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2043، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2043 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2043 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
