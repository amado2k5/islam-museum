label:
  ar: "مسلم 617 — أكل بعضي بعضا فأذن لها بنفسين"
  en: "Muslim 617 — the Fire complains to its Lord and is given two breaths"
  ur: "مسلم 617 — أشتكت النار إلى ربها فأذن لها بنفسين"
text: "اشتكت النار إلى ربها فقالت يا رب أكل بعضي بعضا فأذن لها بنفسين نفس في الشتاء ونفس في الصيف فهو أشد ما تجدون من الحر وأشد ما تجدون من الزمهرير …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 617: أكل بعضي بعضا فأذن لها بنفسين. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 617: the Fire complains to its Lord and is given two breaths. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 617: أشتكت النار إلى ربها فأذن لها بنفسين۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
