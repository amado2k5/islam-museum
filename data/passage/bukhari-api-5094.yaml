label: { ar: "صحيح البخاري 5094 — الأب والأبوة", en: "Sahih al-Bukhari 5094 — the father and fatherhood", ur: "صحیح بخاری 5094 — باپ اور والدیت", es: "Sahih al-Bukhari 5094 — El padre y la paternidad", fr: "Sahih al-Bukhari 5094 — Le père et la paternité" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ مِنْهَالٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا عُمَرُ بْنُ مُحَمَّدٍ الْعَسْقَلاَنِيُّ، عَنْ أَبِيهِ، عَنِ ابْنِ عُمَرَ، قَالَ ذَكَرُوا الشُّؤْمَ عِنْدَ النَّبِيِّ فَقَالَ النَّبِيُّ \" إِنْ كَانَ الشُّؤْمُ فِي شَىْءٍ فَفِي الدَّارِ وَالْمَرْأَةِ وَالْفَرَسِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5094، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5094 (Wedlock, Marriage (Nikaah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5094، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5094 (Matrimonio (Nikaah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5094 (Mariage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
