label: { ar: "جامع الترمذي 3136 — كتاب الأعمال والملائكة الكاتبون", en: "Jami' al-Tirmidhi 3136 — the record of deeds and the recording angels", ur: "جامع ترمذی 3136 — نامۂ اعمال اور لکھنے والے فرشتے" }
text: "… فِي قَوْلِ اللَّهِ : ( يَوْمَ نَدْعُو كُلَّ أُنَاسٍ بِإِمَامِهِمْ ) قَالَ \" يُدْعَى أَحَدُهُمْ فَيُعْطَى كِتَابَهُ بِيَمِينِهِ وَيُمَدُّ لَهُ فِي جِسْمِهِ سِتُّونَ ذِرَاعًا وَيُبَيَّضُ وَجْهُهُ وَيُجْعَلُ عَلَى رَأْسِهِ تَاجٌ مِنْ لُؤْلُؤٍ يَتَلأْلأُ فَيَنْطَلِقُ إِلَى أَصْحَابِهِ فَيَرَوْنَهُ مِنْ بَعِيدٍ فَيَقُولُونَ اللَّهُمَّ ائْتِنَا بِهَذَا وَبَارِكْ لَنَا فِي هَذَا حَتَّى يَأْتِيَهُمْ فَيَقُولُ أَبْشِرُوا لِكُلِّ رَجُلٍ مِنْكُمْ مِثْلُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3136، يذكر كتاب الأعمال والملائكة الكاتبون. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3136 (Chapters on Tafsir), that speaks of the record of deeds and the recording angels. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3136، جس میں نامۂ اعمال اور لکھنے والے فرشتے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
