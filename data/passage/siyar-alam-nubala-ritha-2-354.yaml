text: "… من سيوف اللّٰه، نعم فتى العشيرة. حيد بن هلال : عن أنس : نعى النبىّ أمراء يوم مؤتة فقال : أصيبوا جميعاً ثم أَخذ الراية بعد سيفٌ من سيوف اللّٰه خالد، وجعل بحدِّث الناس وعيناه تذرفان. إسماعيل بن أبى خالد …"
summary:
  ar: "مقطع من سير أعلام النبلاء، المجلد المصوَّر 2، ص 354، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Siyar A'lam al-Nubala', scan volume 2, p. 354, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "سیر اعلام النبلاء، اسکین جلد 2، ص 354 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Siyar A'lam al-Nubala', volume numérisé 2, p. 354, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Siyar A'lam al-Nubala', volumen escaneado 2, p. 354, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Siyar A'lam al-Nubala'nın Resimli Cilt 2, sayfa 354'ten bir alıntı; ölüm ilanı ve duyurusu; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve ölüm ilanlarını tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Siyar A'lam al-Nubala', Jilid Bergambar 2, hlm. 354, berisi obituari dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan obituari paling terkenal."
