label: { ar: "الموطأ 656 — قدامة بن مظعون: كان عثمان يسألني عند قبض عطائي هل عندك مال وجبت فيه الزكاة؟", en: "Muwatta 656", es: "Muwatta 656", fr: "Muwatta 656", ur: "موطا 656", tr: "El-Muvatta 656 — Kudame ibn Mazun: Osman, maaşımı alırken bana, “Zekât verilecek paran var mı?” diye sorardı.", id: "Al-Muwatta 656 — Qudamah ibn Maz’un: Uthman biasa bertanya kepadaku ketika menerima rezeki, “Apakah kamu memiliki uang yang wajib dizakati?”" }
summary:
  ar: "يرويه مالك عن عمر بن حسين عن عائشة بنت قدامة عن أبيها قدامة بن مظعون، قال: كنت إذا جئت عثمان بن عفان أقبض عطائي سألني: هل عندك من مال وجبت عليك فيه الزكاة؟ فإن قلت نعم أخذ من عطائي زكاة ذلك المال، وإن قلت لا دفع إلي عطائي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق (7029) والشافعي في مسنده ومحمد بن الحسن الشيباني (328). {cite:muwatta-maruf-1997 p.336}"
  tr: "Malik, Ömer ibn Hüseyin'den, o da Ayşe bint Kudame'den, o da babası Kudame ibn Maz'un'dan rivayet ederek şöyle buyurmuştur: \"Uthman ibn Affan'a maaşımı almaya gittiğimde bana şöyle sorardı: 'Zekât edilmesi gereken bir malın var mı?' Eğer evet dersem, o malın zekâtını maaşımdan keserdi. Eğer hayır dersem, maaşımı verirdi.\" Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, Abdülrazzak (7029), Şafiî'nin Musned'inde ve Muhammed ibn Hasan el-Şeybani'nin (328) de naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.336}"
  id: "Malik meriwayatkan hadits ini dari Umar bin Husayn, dari Aisyah binti Qudama, dari ayahnya, Qudama binti Maz'un, yang berkata: \"Setiap kali aku pergi ke Utsman bin Affan untuk mengambil uang saku, dia akan bertanya kepadaku: 'Apakah kamu memiliki harta yang wajib dizakati?' Jika aku menjawab ya, dia akan mengambil zakat untuk harta itu dari uang sakuku. Jika aku menjawab tidak, dia akan memberikan uang sakuku.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Abd al-Razzaq (7029), al-Shafi'i dalam Musnadnya, dan Muhammad bin al-Hasan al-Shaybani (328). {cite:muwatta-maruf-1997 p.336}"
