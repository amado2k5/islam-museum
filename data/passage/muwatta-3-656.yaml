label: { ar: "الموطأ 656 — قدامة بن مظعون: كان عثمان يسألني عند قبض عطائي هل عندك مال وجبت فيه الزكاة؟", en: "Muwatta 656" }
summary:
  ar: "يرويه مالك عن عمر بن حسين عن عائشة بنت قدامة عن أبيها قدامة بن مظعون، قال: كنت إذا جئت عثمان بن عفان أقبض عطائي سألني: هل عندك من مال وجبت عليك فيه الزكاة؟ فإن قلت نعم أخذ من عطائي زكاة ذلك المال، وإن قلت لا دفع إلي عطائي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق (7029) والشافعي في مسنده ومحمد بن الحسن الشيباني (328). {cite:muwatta-maruf-1997 p.336}"
