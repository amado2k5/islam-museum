text: "… بِأَبِى أَنْتَ وَأُمِّى، إِنَّكَ لَتَصْنَعُ بِهَذِهِ الْعَجُوزِ شَيئاً لَمْ تَصْنَعْهُ بِأَحَدٍ. وفى لفظِ : فَلَمَّا خَرَجَتْ، قُلْتُ : يَا رَسُولَ اللّٰه تُقْبِلُ عَلَى هَذِهِ الْعَجُوزِ هَذَا الإِقْبَالَ، فَقَالَ يَا عَائِشَةُ، إِنَّهَا كانَتْ تَأْتِينَا زَمَنَ خَدِيجةَ، وَإِنَّ حُسْنَ الْعَهْدِ مِنَ الإِيمَانِ. …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 7837، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 7837, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 7837 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 4, pág. 7837, que menciona lo que se considera parte de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Subul al-Huda wa-l-Rashad d'al-Salihi (tome 4, p. 7837) mentionnant ce qui est considéré comme faisant partie de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" (Hida ve Doğruluk Yolları) adlı eserinin 4. cildinin 7837. sayfasında, imanın bir parçası olarak kabul edilen unsurlardan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak yönergelerine uygun olarak, yaklaşık kırk kelimeden oluşan metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Salihi \"Subul al-Huda wa al-Rashad\" (Jalan-jalan Petunjuk dan Kebenaran), jilid 4 bergambar, halaman 7837, menyebutkan apa yang dianggap sebagai bagian dari iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
