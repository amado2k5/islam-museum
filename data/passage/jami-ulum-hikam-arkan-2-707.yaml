text: "… : الخلال في السنة، وكذا قال الأوزاعيُّ : مُرْ من ترى أنْ يقبلَ منك. وقوله وَلِيلةِ في الذي يُنكر بقلبه : وذلك أضعفُ الإيمان يدلُّ على أنَّ الأمر بالمعروف والنَّهي عن المنكرِ من خصال الإيمان، ويدلُّ على أنَّ من قدرَ …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 707، يذكر حلاوة الإيمان وكماله، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
