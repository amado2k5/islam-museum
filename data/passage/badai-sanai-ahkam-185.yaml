text: "… كان منهياً عنه من الجهة التي أمر به منها فيكون واجباً من حيث ثبتت كراهيته، ومكروهاً من حيث ثبت وجوبه وبالتالي في مثل هذه الحالة لا يمكن أن يجتمع المكروه والواجب لوجود القضاء بينهما، أما إذا كانت الكراهية من غير …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 185، يرد فيه ذكر الواجب، والوجوب، والمكروه، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 185, whose wording mentions the obligatory (wajib), obligation (wujub), the disliked (makruh), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 185 کا اقتباس جس میں واجب، وجوب، مکروہ، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 185, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le réprouvé (makruh), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
