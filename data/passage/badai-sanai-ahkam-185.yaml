  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 185. sayfasından, farz, gerekli, mekruh ve kınanacak fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz fiiller, itaat fiilleri, tavsiye edilen fiiller, mekruh, yasak fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 185, yang menyebutkan amalan wajib, yang diharuskan, yang tidak disukai, dan yang tercela; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
