label: { ar: "الموطأ 2710 — عروة عن النبي في بيت أم سلمة: صبي يبكي به العين فيقال استرقوا له", en: "Muwatta 2710", es: "Muwatta 2710", fr: "Muwatta 2710", ur: "موطا 2710", tr: "El-Muvatta 2710 — Urve, Peygamber'den rivayetle, Ümmü Seleme'nin evinde: Gözlerinden dolayı ağlayan bir çocuk vardı. Bunun üzerine, \"Ona şifa bulun\" denildi.", id: "Al-Muwatta 2710 — Urwah dari Nabi di rumah Umm Salamah: Seorang anak laki-laki menangis karena matanya, lalu dikatakan, “Carilah obat untuknya.”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار أن عروة بن الزبير حدثه أن رسول الله دخل بيت أم سلمة زوج النبي وفي البيت صبي يبكي، فذكروا له أن به العين، فقال: ألا تسترقون له من العين؟ {cite:muwatta-maruf-1997 p.528}"
  tr: "Malik, Yahya bin Said'den, o da Süleyman bin Yasar'dan rivayet ettiğine göre, Urva bin el-Zübeyr ona şöyle anlattı: Allah Resulü, Peygamberin eşi Ümmü Seleme'nin evine girdi ve evde ağlayan bir çocuk vardı. Ona, çocuğun nazardan etkilendiğini söylediler. Bunun üzerine Resulullah, \"Neden siz onun nazardan kurtulması için bir çare aramıyorsunuz?\" dedi. {cite:muwatta-maruf-1997 s.528}"
  id: "Malik meriwayatkan dari Yahya bin Saeed yang juga meriwayatkan dari Sulaiman bin Yasar bahwa Urwa bin Al-Zubayr menceritakan kepadanya bahwa Rasulullah SAW memasuki rumah Umm Salama, istri Nabi, dan di rumah itu ada seorang anak laki-laki yang menangis. Mereka menyebutkan kepadanya bahwa anak itu terkena siksa mata jahat, lalu beliau berkata: Mengapa kalian tidak mencarikan obat untuknya dari siksa mata jahat? {cite:muwatta-maruf-1997 p.528}"
