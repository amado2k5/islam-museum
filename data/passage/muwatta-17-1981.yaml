label: { ar: "الموطأ 1981 — مالك في رجل باع من رجل متاعا فأفلس المبتاع: إن البائع إذا وجد شيئا من متاعه بعينه أخذه، وإن فرق المبتاع بعضه فصاحب المتاع أحق به من الغرماء، وإن اقتضى من ثمن المبتاع شيئا فأحب رده وقبض ما وجد من متاعه، فذلك له", en: "Muwatta 1981", es: "Muwatta 1981", fr: "Muwatta 1981", ur: "موطا 1981", tr: "El-Muvatta 1981 — Malik, bir adama mal satan ve alıcının iflas etmesi durumunda şöyle demiştir: Satıcı mallarından herhangi birini bulursa, onu alabilir. Alıcı mallarının bir kısmını elden çıkarmışsa, mal sahibinin alacaklılardan daha büyük bir hakkı vardır. Alıcının bedelinin bir kısmını almış ve bunu iade edip bulduğu mallarını geri almak istiyorsa, bu onun hakkıdır.", id: "Al-Muwatta 1981 — Malik berkata tentang seorang pria yang menjual barang kepada pria lain, dan pembeli tersebut bangkrut: Jika penjual menemukan barang-barangnya, ia boleh mengambilnya. Jika pembeli telah menjual sebagian barang tersebut, pemilik barang memiliki hak yang lebih besar atas barang tersebut daripada para kreditur. Jika ia telah menerima sebagian dari harga jual dan ingin mengembalikannya serta mengambil kembali barang-barang yang ditemukannya, itu adalah haknya." }
summary:
  ar: "قال مالك في رجل باع من رجل متاعا فأفلس المبتاع: فإن البائع إذا وجد شيئا من متاعه بعينه، أخذه. وإن كان المشتري قد باع بعضه، وفرقه، فصاحب المتاع أحق به من الغرماء، لا يمنعه ما فرق المبتاع منه أن يأخذ ما وجد بعينه. فإن اقتضى من ثمن المبتاع شيئا، فأحب أن يرده ويقبض ما وجد من متاعه، ويكون فيما لم يجد أسوة الغرماء، فذلك له. {cite:muwatta-maruf-1997 p.211}"
  tr: "Malik, bir adama mal satan ve alıcının iflas ettiği bir durum hakkında şöyle demiştir: Satıcı mallarından herhangi birini bulursa, onu alabilir. Eğer alıcı malların bir kısmını satmış ve dağıtmışsa, malların sahibi alacaklılardan daha büyük bir hakka sahiptir. Alıcının malların bir kısmını dağıtmış olması, bulduğu malları almasına engel teşkil etmez. Eğer alıcının bedelinin bir kısmını zaten almışsa ve bunu iade edip bulduğu malların mülkiyetini almak ve bulamadığı mallar konusunda diğer alacaklılar gibi muamele görmek istiyorsa, bu onun hakkıdır. {cite:muwatta-maruf-1997 s.211}"
  id: "Malik berkata mengenai seorang pria yang menjual barang kepada pria lain, dan pembeli tersebut bangkrut: Jika penjual menemukan barang-barangnya, ia boleh mengambilnya. Jika pembeli menjual sebagian barang tersebut dan membagikannya, pemilik barang memiliki hak yang lebih besar atas barang tersebut daripada para kreditur. Fakta bahwa pembeli membagikan sebagian barang tersebut tidak menghalanginya untuk mengambil apa yang ia temukan. Jika ia telah menerima sebagian dari harga pembeli dan ingin mengembalikannya serta mengambil kembali barang-barangnya yang ia temukan, dan ingin diperlakukan seperti kreditur lain terkait barang yang tidak ia temukan, maka itu adalah haknya. {cite:muwatta-maruf-1997 p.211}"
