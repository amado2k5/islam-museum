label: { ar: "الموطأ 1981 — مالك في رجل باع من رجل متاعا فأفلس المبتاع: إن البائع إذا وجد شيئا من متاعه بعينه أخذه، وإن فرق المبتاع بعضه فصاحب المتاع أحق به من الغرماء، وإن اقتضى من ثمن المبتاع شيئا فأحب رده وقبض ما وجد من متاعه، فذلك له", en: "Muwatta 1981" }
summary:
  ar: "قال مالك في رجل باع من رجل متاعا فأفلس المبتاع: فإن البائع إذا وجد شيئا من متاعه بعينه، أخذه. وإن كان المشتري قد باع بعضه، وفرقه، فصاحب المتاع أحق به من الغرماء، لا يمنعه ما فرق المبتاع منه أن يأخذ ما وجد بعينه. فإن اقتضى من ثمن المبتاع شيئا، فأحب أن يرده ويقبض ما وجد من متاعه، ويكون فيما لم يجد أسوة الغرماء، فذلك له. {cite:muwatta-maruf-1997 p.211}"
