label: { ar: "سنن أبي داود 3016 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 3016 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 3016 — ترکہ اور میراث" }
text: "… - حَدَّثَنَا ابْنُ أَبِي زَائِدَةَ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنِ الزُّهْرِيِّ، وَعَبْدِ اللَّهِ بْنِ أَبِي بَكْرٍ، وَبَعْضِ، وَلَدِ مُحَمَّدِ بْنِ مَسْلَمَةَ قَالُوا بَقِيَتْ بَقِيَّةٌ مِنْ أَهْلِ خَيْبَرَ تَحَصَّنُوا فَسَأَلُوا رَسُولَ اللَّهِ أَنْ يَحْقِنَ دِمَاءَهُمْ وَيُسَيِّرَهُمْ فَفَعَلَ فَسَمِعَ بِذَلِكَ أَهْلُ فَدَكَ فَنَزَلُوا عَلَى مِثْلِ ذَلِكَ فَكَانَتْ لِرَسُولِ اللَّهِ خَاصَّةً لأَنَّهُ لَمْ يُوجِفْ عَلَيْهَا بِخَيْلٍ وَلاَ رِكَابٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3016، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3016 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3016، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
