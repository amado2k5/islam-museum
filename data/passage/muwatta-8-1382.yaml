label: { ar: "الموطأ 1382 — نافع عن ابن عمر: أدرك النبي عمر وهو يحلف بأبيه فقال إن الله ينهاكم أن تحلفوا بآبائكم، فليحلف بالله أو ليصمت", en: "Muwatta 1382", es: "Muwatta 1382", fr: "Muwatta 1382", ur: "موطا 1382", tr: "El-Muvatta 1382 — Nafi'nin İbn Ömer'den rivayet ettiğine göre: Peygamber, Ömer'in babası üzerine yemin ettiğini görünce, \"Allah babalarınız üzerine yemin etmenizi haram kılmıştır. Ya Allah üzerine yemin etsin ya da sussun.\" dedi.", id: "Al-Muwatta 1382 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Nabi melihat Umar bersumpah demi ayahnya, lalu beliau bersabda, “Allah melarang kalian bersumpah demi ayah kalian. Biarlah dia bersumpah demi Allah atau diam saja.”" }
text: "إنَّ اللهَ يَنْهَاكُمْ أَنْ تَحْلِفُوا بِآبَائكُمْ، فَمن كَانَ حَالفًا، فَلْيَحْلفْ بِاللهِ أوْ لِيَصْمُتْ"
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله أدرك عمر بن الخطاب وهو يسير في ركب، وهو يحلف بأبيه، فقال إن الله ينهاكم أن تحلفوا بآبائكم، فمن كان حالفا فليحلف بالله أو ليصمت. {cite:muwatta-maruf-1997 p.616}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet eder ki, Allah Resulü, Ömer ibn el-Hattab'ı bir grupla birlikte yolculuk ederken yakaladı ve Ömer babası üzerine yemin ediyordu. Bunun üzerine Resulullah, \"Allah babanız üzerine yemin etmenizi haram kılmıştır. Kim yemin edecekse, Allah üzerine yemin etsin veya sussun.\" dedi. {cite:muwatta-maruf-1997 s.616}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa Rasulullah SAW bertemu dengan Umar ibn al-Khattab ketika beliau sedang bepergian bersama sekelompok orang, dan beliau sedang bersumpah demi ayahnya. Maka beliau bersabda, “Allah melarang kalian bersumpah demi ayah kalian. Barang siapa bersumpah, hendaklah ia bersumpah demi Allah atau diam saja.” {cite:muwatta-maruf-1997 p.616}"
