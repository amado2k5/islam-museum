label: { ar: "الموطأ 1382 — نافع عن ابن عمر: أدرك النبي عمر وهو يحلف بأبيه فقال إن الله ينهاكم أن تحلفوا بآبائكم، فليحلف بالله أو ليصمت", en: "Muwatta 1382" }
text: "إنَّ اللهَ يَنْهَاكُمْ أَنْ تَحْلِفُوا بِآبَائكُمْ، فَمن كَانَ حَالفًا، فَلْيَحْلفْ بِاللهِ أوْ لِيَصْمُتْ"
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله أدرك عمر بن الخطاب وهو يسير في ركب، وهو يحلف بأبيه، فقال إن الله ينهاكم أن تحلفوا بآبائكم، فمن كان حالفا فليحلف بالله أو ليصمت. {cite:muwatta-maruf-1997 p.616}"
