label: { ar: "الموطأ 596 — عائشة: كُفن النبي في ثلاثة أثواب بيض سحولية ليس فيها قميص ولا عمامة", en: "Muwatta 596", es: "Muwatta 596", fr: "Muwatta 596", ur: "موطا 596", tr: "Al-Muwatta 596 — Aişe: Peygamber, Sahul'dan getirilmiş üç beyaz pamuklu giysiye sarınmıştı; üzerinde gömlek veya sarık yoktu.", id: "Al-Muwatta 596 — Aisyah: Nabi diselubungi tiga kain katun putih dari Sahul, tanpa kemeja atau sorban." }
text: "كفن في ثلاثة أثواب بيض سحولية، ليس فيها قميص ولا عمامة"
summary:
  ar: "أول حديث في باب ما جاء في كفن الميت. يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، أن النبي كُفن في ثلاثة أثواب بيض سحولية ليس فيها قميص ولا عمامة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (1273)، وسويد، والقعنبي، وابن وهب، وقتيبة عند النسائي (4/35)، والشافعي في المسند والأم، ويبين أن السحولية ثياب قطن تصنع باليمن. {cite:muwatta-maruf-1997 p.307}"
  tr: "Merhumun kefenine dair rivayetler bölümündeki ilk hadis, Malik'in Hişam ibn Urve'den, onun babasından, onun da Aişe'den rivayet ettiğine göre, Peygamberimiz Yemen'den getirilmiş üç beyaz pamuklu giysiyle, gömlek veya sarık olmadan kefenlenmiştir. Editör, bu hadisin Malik'ten Ebu Musab tarafından, onun isnadından da İbn Hibban, el-Baghawi, İsmail ibn Abi Uway'in Buhari'de (1273), Suwaid, el-Ka'nabi, İbn Wahb ve Kuteybe'nin Nesai'de (4/35) ve Şafiî'nin Müsned ve Ümmü'nde rivayet edildiğini belirtmektedir. Yemen'den getirilen pamuklu giysilerin Yemen'de üretildiğini açıklığa kavuşturmaktadır. {cite:muwatta-maruf-1997 s.307}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai kain kafan orang yang meninggal. Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, bahwa Nabi dikafani dengan tiga kain katun putih dari Yaman, tanpa baju atau sorban. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, dan dari sanadnya oleh Ibn Hibban, al-Baghawi, Ismail ibn Abi Uways dalam al-Bukhari (1273), Suwaid, al-Qa'nabi, Ibn Wahb, dan Qutaybah dalam al-Nasa'i (4/35), dan al-Shafi'i dalam al-Musnad dan al-Umm. Ia menjelaskan bahwa kain katun dari Yaman tersebut dibuat di Yaman. {cite:muwatta-maruf-1997 p.307}"
