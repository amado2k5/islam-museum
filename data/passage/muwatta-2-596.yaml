label: { ar: "الموطأ 596 — عائشة: كُفن النبي في ثلاثة أثواب بيض سحولية ليس فيها قميص ولا عمامة", en: "Muwatta 596" }
text: "كفن في ثلاثة أثواب بيض سحولية، ليس فيها قميص ولا عمامة"
summary:
  ar: "أول حديث في باب ما جاء في كفن الميت. يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، أن النبي كُفن في ثلاثة أثواب بيض سحولية ليس فيها قميص ولا عمامة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (1273)، وسويد، والقعنبي، وابن وهب، وقتيبة عند النسائي (4/35)، والشافعي في المسند والأم، ويبين أن السحولية ثياب قطن تصنع باليمن. {cite:muwatta-maruf-1997 p.307}"
