label: { ar: "الموطأ 1077 — مالك: من طاف بالبيت بعض أسبوعه ثم أقيمت صلاة الصبح أو العصر، فإنه يصلي مع الإمام ثم يبني على ما طاف حتى يكمل سبعاً، ثم لا يصلي حتى تطلع الشمس أو تغرب؛ وإن أخرهما حتى يصلي المغرب فلا بأس", en: "Muwatta 1077" }
summary:
  ar: "قول لمالك: من طاف بالبيت بعض أسبوعه ثم أقيمت صلاة الصبح أو صلاة العصر، فإنه يصلي مع الإمام ثم يبني على ما طاف حتى يكمل سبعاً، ثم لا يصلي حتى تطلع الشمس أو تغرب. وإن أخرهما حتى يصلي المغرب فلا بأس بذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1300). {cite:muwatta-maruf-1997 p.496}"
