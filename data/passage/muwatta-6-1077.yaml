label: { ar: "الموطأ 1077 — مالك: من طاف بالبيت بعض أسبوعه ثم أقيمت صلاة الصبح أو العصر، فإنه يصلي مع الإمام ثم يبني على ما طاف حتى يكمل سبعاً، ثم لا يصلي حتى تطلع الشمس أو تغرب؛ وإن أخرهما حتى يصلي المغرب فلا بأس", en: "Muwatta 1077", es: "Muwatta 1077", fr: "Muwatta 1077", ur: "موطا 1077", tr: "El-Muvatta 1077 — Malik: Haftasında Kâbe'nin etrafında tavaf yapan ve ardından sabah veya ikindi namazı vakti geldiğinde imamla birlikte namaz kılmalı ve kaldığı yerden devam ederek yedi tavaf tamamlamalıdır. Daha sonra güneş doğana veya batana kadar tekrar namaz kılmamalıdır. Eğer bunu akşam namazına kadar ertelerse, bunda bir sakınca yoktur.", id: "Al-Muwatta 1077 — Malik: Barang siapa yang melakukan Tawaf mengelilingi Ka'bah selama seminggu, kemudian dikumandangkan shalat Subuh atau Ashar, hendaklah ia shalat bersama Imam dan melanjutkan dari tempat ia berhenti hingga menyelesaikan tujuh putaran. Setelah itu, ia tidak boleh shalat lagi hingga matahari terbit atau terbenam. Jika ia menundanya hingga shalat Maghrib, tidak ada salahnya." }
summary:
  ar: "قول لمالك: من طاف بالبيت بعض أسبوعه ثم أقيمت صلاة الصبح أو صلاة العصر، فإنه يصلي مع الإمام ثم يبني على ما طاف حتى يكمل سبعاً، ثم لا يصلي حتى تطلع الشمس أو تغرب. وإن أخرهما حتى يصلي المغرب فلا بأس بذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1300). {cite:muwatta-maruf-1997 p.496}"
  tr: "Malik şöyle demiştir: Bir kimse hafta içinde Kâbe'nin etrafında tavaf yaptıktan sonra sabah veya ikindi namazı vakti gelirse, imamla birlikte namaz kılmalı ve kaldığı yerden devam ederek yedi tavaf tamamlamalıdır. Güneş doğana veya batana kadar tekrar namaz kılmamalıdır. Akşam namazından sonraya bırakırsa bunda bir sakınca yoktur. Araştırmacı, bu rivayetin Ebu Musab (ö. 1300) tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.496}"
  id: "Malik berkata: Jika seseorang melakukan Tawaf mengelilingi Ka'bah pada hari kerja dan kemudian seruan shalat Subuh atau Ashar datang, maka ia harus shalat bersama Imam dan melanjutkan dari tempat ia berhenti hingga menyelesaikan tujuh putaran. Ia tidak boleh shalat lagi hingga matahari terbit atau terbenam. Jika ia menundanya hingga setelah shalat Maghrib, tidak ada salahnya. Peneliti menyebutkan bahwa Abu Mus'ab (wafat 1300) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.496}"
