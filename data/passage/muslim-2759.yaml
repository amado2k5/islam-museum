label: { ar: "مسلم 2759 — يبسط يده بالليل ليتوب مسيء النهار", en: "Muslim 2759 — God stretches out His hand for sinners to repent", es: "Muslim 2759 — Dios extiende su mano para que los pecadores se arrepientan.", fr: "Muslim 2759 — Dieu tend la main aux pécheurs pour qu'ils se repentent", ur: "مسلم 2759 — خدا گنہگاروں کے لیے توبہ کے لیے اپنا ہاتھ پھیلاتا ہے۔", tr: "Müslim 2759 — Geceleyin elini uzatır ki, gündüz günahkârı tövbe etsin.", id: "Muslim 2759 — Dia mengulurkan tangan-Nya di malam hari agar orang yang berdosa di siang hari dapat bertaubat" }
text: "قال رسول الله: إن الله يبسط يده بالليل ليتوب مسيء النهار، ويبسط يده بالنهار ليتوب مسيء الليل، حتى تطلع الشمس من مغربها"
summary:
  ar: "رواية أبي موسى عن أبي عبيدة بن عبد الله في أول كتاب التوبة من صحيح مسلم؛ باب التوبة مفتوح إلى أن تطلع الشمس من مغربها."
  tr: "Sahih Müslim'deki Tövbe Kitabı'nın birinci bölümünde Ebu Musa'nın Ebu Ubeyde bin Abdullah'tan rivayet ettiği şöyledir: Tövbe bölümü, güneş batıdan doğana kadar açıktır."
  id: "Riwayat Abu Musa berdasarkan Abu Ubaidah bin Abdullah dalam bab pertama Kitab Taubat dalam Sahih Muslim: Bab tentang taubat terbuka hingga matahari terbit dari barat."
