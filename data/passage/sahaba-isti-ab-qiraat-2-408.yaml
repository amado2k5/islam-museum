text: "… غشرة في الجنة : أَبو بكر، وقال وَلِفي : أستَقْرِئُوا القرآنَ من أَرْبعة نَفَر، فبدأ بعبد الله بن مَسعود : وعمر، وعثمان، وعلي، وطلحة، والزُّبير، حدَّثنا سعيد بن نصر، حدَّثنا قاسم بنُ أصبغ، وعبدالرَّحمنِ بن عوف، وسعد بن مالكٍ، وسعيد …"
