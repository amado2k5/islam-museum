text: "… قالت: ما شعرت وأنا بأرض الحبشة الا برسول النجاشى جارية يقال لها أبرهةا، كانت تقوم علىّ ثيابه ودهنه فاستأذنت علىّ فأذنت لها فقالت : الثفال جلدة تبسط تحت رحا اليد ليقع عليها الدقيق ويسمى الحجر الأسفل ثقالابها. جعلت عصيدة وهى …"
