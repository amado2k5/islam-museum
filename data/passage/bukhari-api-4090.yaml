text: "… مَالِكٍ ـ أَنَّ رِعْلاً، وَذَكْوَانَ وَعُصَيَّةَ وَبَنِي لَحْيَانَ اسْتَمَدُّوا رَسُولَ اللَّهِ عَلَى عَدُوٍّ، فَأَمَدَّهُمْ بِسَبْعِينَ مِنَ الأَنْصَارِ، كُنَّا نُسَمِّيهِمُ الْقُرَّاءَ فِي زَمَانِهِمْ، كَانُوا يَحْتَطِبُونَ بِالنَّهَارِ وَيُصَلُّونَ بِاللَّيْلِ، حَتَّى كَانُوا بِبِئْرِ مَعُونَةَ قَتَلُوهُمْ، وَغَدَرُوا بِهِمْ، فَبَلَغَ النَّبِيَّ، فَقَنَتَ شَهْرًا يَدْعُو فِي الصُّبْحِ عَلَى أَحْيَاءٍ مِنْ أَحْيَاءِ الْعَرَبِ، عَلَى رِعْلٍ وَذَكْوَانَ وَعُصَيَّةَ وَبَنِي لَحْيَانَ. قَالَ أَنَسٌ فَقَرَأْنَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4090، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 4090 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 4090، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
