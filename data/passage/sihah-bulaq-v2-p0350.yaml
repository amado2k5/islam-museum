text: |-
  *⁦(باب اللام)⁩
  ليل).
  ٢٣٧
  الكملول نيت وهو بالفارسية برغست حكاء أبو تراب فى كتاب الاعتقاب ومن أضاف قال فلج
  نهرصغير ⁦( كهل )⁩ الكهل من الرجال الذى باوز الملاثين ووخطه الشيب
  وامرأة كهلة قال الراجز
  ولا أعرد بعدهاكريا • أمارس الكهلة والصيا
  وفى الحديث هل فى أهلك من كاهل قال أبو عبيد ويقال من كاهل أى من أ--ن وصار كهلا
  والكاهل الحاركك وهو ما بين السكتفين قال الذي تصلى اللّٰه عليه وسلم تيم كاهل مضر وعليها
  المجل وكاهل أبو قبيلم ن أسدوهو كاهل بن أ-د بن خزيمة وه-م قتلة أبى امرئ القيس
  واسكتهل أى صاركهلاوا كتهل النبدات أى تمّ طوله وظه رنوره وكنهل بالكسرامم
  مرام أللاس ك يس لمكهيل والكيوي ل يتخ الباوضها ضرب من الشعسر
  فأضحى يسمح الماء من كل فيقة • بكب على الاذقان دوح المكنهبل
  والنون زائدة كول) السكولان بالفتح نبت وهوالبردى وتسكول القوم على فلان
  تجمعواعليه ( كبل السكيل المكال والكيل مصدركات اللمعام كسلا ومكالا
  ومكيلا أيضًا وهو شاذلان الصدر من فعل يفعل مفعل يقال مافى برّك مكال وقد قيل
  مكيل عن الاخفش والاسم السكيلة بالكسر يقال انه لحسن السكيلة مثال الجلسة والركبة
  وف المشل أحتفا وسوء كيلة أى أتجمع أن تعطيني حشفا وأن تسى على الكيل ويقال
  كلته بمعنى كات له قال تعالى واذا كالوهم أى كالوالهم واسكتلت عليه أخذت منه يقال
  كال المعطى واكتال الآخذ وكيل الطعام على مالم يسم قاعلدوان شئت ضممت السكاف
  والطعام مكيل و.كبولمثل مخيط ومخيوط ومنهم من يقول كول الطعام وبوع واصطود
  الصيد واستوق ماله يقلب الياء واواحين ضم ماقبلها لات الياء السا كنة لا تكون بعد حرف
  مضموم وكايلته وتسكايلنا إذا كال لك وكات له فهو مكايل بلا همز وقولهم لا تسكايل بالدم أى
  لا يجوز أن تقدل الاثأرة ولا تعتبر فيه المساواة فى الفضل اذالم يكن غيره وكال الزند يكيل اذا
  لم يخرج نارا والكيول مؤخر الصفوف وفى الحديث ان رجلاأتى رسول اللّٰه صلى اللّٰه عليه
  وسلم وه ويقاتل العدوة-أله سبنا يقاتل به فقال له فلعلان أعطيتك أن تقوم فى الكيول
  فقال لافأعطاه سيفا فجعل بقماتل به وهوير تجزوية ول
  انى مرؤعاهدنى خليلى • أن لا أقوم الدهر فى المكبول • أضرب بسيف اللّه والرسول
  واتماسكن الباء فى أضرب لكثرة الحركات وتكلى الرجل أى قام فى الكيول والاصل تكيل
  وهو مقلوب منه
  صل الللام ) ( ل عل كلة شك وأصلها عل" واللام فى أولها زائدة قال الشاعر
  يقول ألاس عل مجنون عامى • يروم سلواقات انى لمابيا
  ويقال لعلى أفعل ولعلنى أفعل بمعنى ليل) الليل واحد يمعنى جمع وواحدته ليلة مثل تمرة
  وتمر وقد جمع على ليال فزاد وافيها الياء على غير قياس ونظيره أهل وأهال ويقال كان الاصل
  يجداح
  فوله أى من أسن فى القاموس
  أى تزقح قاله لرجل أراد الجهاد
  معه صلى اللّٰه عليه وسلم اه
  قولد والكبول بعى مشدد الياه
  كعبوق كافى القاموس اه
