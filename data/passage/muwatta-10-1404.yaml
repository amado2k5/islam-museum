label: { ar: "الموطأ 1404 — يحيى بن سعيد: عبد الله بن عياش المخزومي أمر غلامه أن يذبح، فقال سم الله، فقال قد سميت، فحلف أنه لا يطعمها أبدا", en: "Muwatta 1404", es: "Muwatta 1404", fr: "Muwatta 1404", ur: "موطا 1404", tr: "El-Muvatta 1404 — Yahya bin Said: Abdullah bin Ayyaş el-Makhzumi, hizmetçisine bir hayvan kesmesini emretti ve hizmetçi, “Bismillah de (Allah’ın adıyla)” dedi. Hizmetçi, “Dedim zaten” diye cevap verdi. Bunun üzerine bir daha asla o hayvanı yemeyeceğine yemin etti.", id: "Al-Muwatta 1404 — Yahya bin Saeed: Abdullah bin Ayyash Al-Makhzumi memerintahkan pelayannya untuk menyembelih hewan, dan pelayan itu berkata, “Ucapkan ‘Bismillah’ (Dengan nama Allah).” Pelayan itu menjawab, “Aku sudah mengucapkannya.” Maka ia bersumpah bahwa ia tidak akan pernah memakannya lagi." }
text: "وَاللهِ، لَا أطْعَمُها أبدًا"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عبد الله بن عياش بن أبي ربيعة المخزومي أمر غلاما له أن يذبح ذبيحة، فلما أراد أن يذبحها قال له سم الله، فقال الغلام قد سميت، فقال سم الله ويحك، قال قد سميت الله، فقال عبد الله بن عياش والله لا أطعمها أبدا. {cite:muwatta-maruf-1997 p.630}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Abdullah ibn Ayyash ibn Abi Rabi'ah al-Makhzumi'nin hizmetçisine bir hayvan kesmesini emrettiğini anlatır. Hizmetçi hayvanı kesmek üzereyken, Abdullah ibn Ayyash ona \"Bismillah\" (Allah'ın adıyla) demesini söyledi. Hizmetçi, \"Zaten söyledim\" diye cevap verdi. Abdullah ibn Ayyash, \"Bismillah de, sana yazıklar olsun!\" dedi. Hizmetçi yine, \"Zaten söyledim\" diye cevap verdi. Bunun üzerine Abdullah ibn Ayyash, \"Allah'a yemin ederim ki, bir daha asla yemeyeceğim\" dedi. {cite:muwatta-maruf-1997 s.630}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Abdullah ibn Ayyash ibn Abi Rabi'ah al-Makhzumi memerintahkan pelayannya untuk menyembelih seekor hewan. Ketika pelayan itu hendak menyembelihnya, Abdullah ibn Ayyash menyuruhnya mengucapkan \"Bismillah\" (Dengan nama Allah). Pelayan itu menjawab, \"Saya sudah mengucapkannya.\" Abdullah ibn Ayyash berkata, \"Ucapkan 'Bismillah', celakalah kamu!\" Pelayan itu menjawab, \"Saya sudah mengucapkannya.\" Abdullah ibn Ayyash kemudian berkata, \"Demi Allah, aku tidak akan pernah memakannya lagi.\" {cite:muwatta-maruf-1997 p.630}"
