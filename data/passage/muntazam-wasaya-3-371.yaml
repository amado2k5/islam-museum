text: "… السنة. وقال الصولى توفى بين الظهر والعصر يوم السبت ودفن فى دار بن عبد اللّه بن طاهر وهو ابن اثنتين وثلاثين سنة غير شهر وقيل ابن ثلاث وثلاثين ويوم وكانت خلافته ست سنين وستة اشهر وتسعة عشر يوما ولما احتضر …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 3، ص 371، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 3, p. 371, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 3، ص 371 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de al-Muntazam de Ibn al-Jawzi, volumen 3, pág. 371, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Muntazam d'Ibn al-Jawzi (tome 3, p. 371) mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin resimli 3. cildinin 371. sayfasından bir alıntı, ölüm ve ölüm anı, defin, mezar ve istirahat yerinden bahsetmektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, miraslar, eski eserler ve istirahat yerleri araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, jilid 3 bergambar, halaman 371, menyebutkan saat kematian dan proses sekarat, penguburan, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat peristirahatan."
