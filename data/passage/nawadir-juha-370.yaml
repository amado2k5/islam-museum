text: "… أيُّ ابن ملعون أخبركم؟ ملأَ جيبهُ خوخاً ومشى، فرأى بعض أصدقائه، فقال لهم : مَنْ يعلمُ ما في جيبي أعطيتُهُ أكبر خوخةٍ منه؟ فقالوا له: خوج. فاستغرب الشيخُ وقال لهم: أي ابن ملعونٍ أخبركم! → إلى المكان الذاهب إليه البغل …"
summary:
  ar: "ملأ جحا جيبه بالخوخ وطلب من أصدقائه أن يخمنوا ما فيه، ووعد بأكبر خوخة لمن يصيب، فخمنوا، فقال جحا «أي ابن ملعون أخبركم؟ لقد قلت لكم». {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  en: "Juha fills his pocket with plums and asks friends to guess what is in it, promising the biggest plum to whoever guesses; they guess; Juha says 'what a cursed son told you, I told you'. {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  ur: "جحا نے اپنی جیب آلوچوں سے بھر لی اور دوستوں سے کہا کہ اندازہ لگاؤ اس میں کیا ہے، اور وعدہ کیا کہ جو بوجھ لے گا اسے سب سے بڑا آلوچہ ملے گا، انہوں نے اندازہ لگایا، تو جحا نے کہا «کس کمبخت نے تمہیں بتایا؟ میں ہی نے تو تمہیں بتایا تھا»۔ {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  fr: "Juha remplit sa poche de prunes et demande à ses amis de deviner ce qu'elle contient, promettant la plus grosse prune à celui qui trouvera ; ils devinent ; Juha dit : « Quel maudit fils vous l'a dit ? C'est moi qui vous l'ai dit ». {cite:juha-nawadir-kubra-djuwaydi p. 183}"
  es: "Juha llena su bolsillo de ciruelas y pide a sus amigos que adivinen lo que contiene, prometiendo la ciruela más grande a quien acierte; ellos adivinan; Juha dice: «¿Qué maldito hijo se lo dijo? Yo se lo dije». {cite:juha-nawadir-kubra-djuwaydi p. 183}"
