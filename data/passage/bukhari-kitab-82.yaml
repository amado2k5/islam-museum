summary:
  ar: "القسم 82 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب القدر»، ويضم فيها النصوص من 6594 إلى 6620 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 82 of Sahih al-Bukhari (Divine Will (Al-Qadar)) in the division of the open hadith dataset the museum took its reports from: reports 6594 to 6620 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 82، عنوان «کتاب القدر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6594 تا 6620۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 82 de Sahih al-Bukhari (Voluntad Divina (Al-Qadar)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6594 al 6620, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
