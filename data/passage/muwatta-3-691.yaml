label: { ar: "الموطأ 691 — مالك: من زكى ماله ثم اشترى به عرضاً فباعه قبل الحول لم يزك حتى يحول الحول من يوم زكاه؛ وإن لم يبع سنين فزكاة واحدة", en: "Muwatta 691", es: "Muwatta 691", fr: "Muwatta 691", ur: "موطا 691", tr: "Al-Muwatta 691 — Malik: Kim malının zekâtını ödedikten sonra o malla mal alıp bir yıl geçmeden satarsa, zekâtını ödediği günden itibaren bir yıl geçinceye kadar zekât ödemez; eğer o malı yıllarca satmazsa, bir zekât borcu olur." }
summary:
  ar: "قول لمالك: الأمر عندنا فيما يدار من العروض للتجارات أن الرجل إذا زكى ماله ثم اشترى به عرضاً، بزاً أو رقيقاً أو ما أشبه ذلك، ثم باعه قبل أن يحول عليه الحول من يوم أخرج زكاته، فإنه لا يؤدي من ذلك المال زكاة حتى يحول عليه الحول من يوم زكاه؛ وإن لم يبع ذلك العرض سنين لم تجب عليه فيه زكاة وإن طال زمانه، فإذا باعه فليس عليه فيه إلا زكاة واحدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.347}"
  tr: "Malik şöyle demiştir: Ticarette kullanılan mallara ilişkin uygulamamız şöyledir: Bir kimse malı üzerinden zekât verdikten sonra bu parayla kumaş, köle veya benzeri mallar satın alır ve zekâtı verdikten bir yıl geçmeden bunları satarsa, zekâtı verdikten bir yıl geçene kadar bu paranın zekâtını ödemez. Eğer bu malları yıllarca satmazsa, ne kadar süre kalırsa kalsın zekât ödemekle yükümlü değildir. Eğer satarsa, sadece bir zekât ödemesi yapar. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.347}"
  id: "Malik berkata: Kebiasaan kami mengenai barang dagangan adalah jika seseorang membayar zakat atas hartanya dan kemudian menggunakannya untuk membeli barang dagangan, seperti kain, budak, atau sejenisnya, dan kemudian menjualnya sebelum genap satu tahun sejak ia membayar zakat, maka ia tidak membayar zakat atas uang tersebut sampai genap satu tahun sejak ia membayar zakat. Jika ia tidak menjual barang dagangan tersebut selama bertahun-tahun, maka ia tidak wajib membayar zakat atasnya, berapa pun lamanya barang tersebut tetap ada. Jika ia menjualnya, ia hanya wajib membayar zakat satu kali. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.347}"
