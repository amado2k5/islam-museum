label: { ar: "الموطأ 691 — مالك: من زكى ماله ثم اشترى به عرضاً فباعه قبل الحول لم يزك حتى يحول الحول من يوم زكاه؛ وإن لم يبع سنين فزكاة واحدة", en: "Muwatta 691" }
summary:
  ar: "قول لمالك: الأمر عندنا فيما يدار من العروض للتجارات أن الرجل إذا زكى ماله ثم اشترى به عرضاً، بزاً أو رقيقاً أو ما أشبه ذلك، ثم باعه قبل أن يحول عليه الحول من يوم أخرج زكاته، فإنه لا يؤدي من ذلك المال زكاة حتى يحول عليه الحول من يوم زكاه؛ وإن لم يبع ذلك العرض سنين لم تجب عليه فيه زكاة وإن طال زمانه، فإذا باعه فليس عليه فيه إلا زكاة واحدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.347}"
