label: { ar: "الموطأ 469 — عبد الله بن عمرو: لا تصل في عطن الإبل ولكن في مراح الغنم", en: "Muwatta 469" }
text: "لا، ولكن صل في مراح الغنم"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه عن رجل من المهاجرين لم ير به بأساً، في باب العمل في جامع الصلاة: سأل عبد الله بن عمرو بن العاص أيصلي في مبارك الإبل عند الماء، فقال: لا، ولكن صل في مراح الغنم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن الزرقاني أن يونس بن بكير رواه عن هشام مرفوعاً وأن يونس لا يُحتج به فيما خالف فيه مالكاً، وأن أحمد (2/178) رواه مرفوعاً من حديث ابن لهيعة بإسناد ضعيف، على أن متن الحديث صحيح من حديث البراء وعبد الله بن مغفل وجابر بن سمرة وغيرهم. {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.239}"
