label: { ar: "الموطأ 469 — عبد الله بن عمرو: لا تصل في عطن الإبل ولكن في مراح الغنم", en: "Muwatta 469", es: "Muwatta 469", fr: "Muwatta 469", ur: "موطا 469", tr: "Al-Muwatta 469 — Abdullah bin Amr: Deve ağılında değil, koyun ağılında namaz kılın.", id: "Al-Muwatta 469 — Abdullah bin Amr: Janganlah kalian shalat di kandang unta, melainkan di kandang domba." }
text: "لا، ولكن صل في مراح الغنم"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه عن رجل من المهاجرين لم ير به بأساً، في باب العمل في جامع الصلاة: سأل عبد الله بن عمرو بن العاص أيصلي في مبارك الإبل عند الماء، فقال: لا، ولكن صل في مراح الغنم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن الزرقاني أن يونس بن بكير رواه عن هشام مرفوعاً وأن يونس لا يُحتج به فيما خالف فيه مالكاً، وأن أحمد (2/178) رواه مرفوعاً من حديث ابن لهيعة بإسناد ضعيف، على أن متن الحديث صحيح من حديث البراء وعبد الله بن مغفل وجابر بن سمرة وغيرهم. {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.239}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, atas otoritas seorang pria dari kaum Muhajirin (imigran) yang tidak melihat adanya bahaya di dalamnya, dalam bab tentang amalan di masjid untuk salat: Abdullah ibn Amr ibn al-As bertanya, \"Apakah diperbolehkan salat di tempat istirahat unta dekat air?\" Beliau menjawab, \"Tidak, tetapi salatlah di kandang domba.\" Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik, dan mengutip al-Zarqani yang mengatakan bahwa Yunus ibn Bukayr meriwayatkannya atas otoritas Hisham sebagai hadits yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya), dan bahwa Yunus tidak dianggap dapat diandalkan dalam hal-hal di mana ia bertentangan dengan Malik. Ahmad (2/178) meriwayatkan hadits ini sebagai hadits yang berasal dari Nabi (shalawat dan salam kepadanya) berdasarkan riwayat Ibnu Lahi'ah dengan sanad yang lemah, meskipun teks hadits tersebut sahih menurut hadits al-Bara', Abdullah ibn Mughaffal, Jabir ibn Samurah, dan lainnya. {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.239}"
