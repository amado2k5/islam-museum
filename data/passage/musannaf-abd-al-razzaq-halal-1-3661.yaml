text: "… الحلال حراماً فهو في الحرام حرام. - عبد الرزاق عن الثوري عن عبد الرحمن الأَصبهاني قالٍ : أخبرني الثقة عن عبد اللّٰه بن معقل بن مقرن أَنه قال : هي محرَّم عليه في الحلال، فكيف لا تحرم عليه في الحرام. …"
summary:
