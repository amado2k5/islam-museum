  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 3661 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
