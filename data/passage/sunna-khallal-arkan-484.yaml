text: "… محمد بن حازم، أن إسحاق بن منصور حدَّثهم، قال: قلت لإسحاق: هل للإيمان مُنتهى حتى نستطيع أن نقول : المرء مستكمل الإيمان؟ قال: لا؛ لأن جميع الطاعة من الإيمان، فلا يمكن أن نشهد باستكمال الإيمان لأحدٍ إلا للأنبياء، أو من …"
summary:
