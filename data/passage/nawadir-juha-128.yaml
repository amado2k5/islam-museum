text: "… لو لم يكن ابني قالتْ لهُ أمرأته : خُذْ هذا الطفل، وشاغله قليلاً، لأعملَ أشغالي فحمله، وأخذَ يدور به، ويُسلِّيه، فبالَ عليه الطفل، فغضِبَ الشيخُ، وبال على الطفل، من رأسه إلى قدميه، فجاءتِ امرأتُهُ، وهي غضبى، وقالت: ماذا فعلْت؟ فأجابها …"
summary:
  ar: "طلبت زوجة جحا منه أن يُمسك الطفل وهي تعمل، فبلّله الطفل، فغضب جحا وقال إنه لو لم يكن ابنه لفعل به أشدّ من ذلك. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  en: "Asked to keep the child while his wife works, Juha is wet by the child, and he responds in fury, saying that were the child not his son he would have done worse. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  ur: "بیوی کام کر رہی تھی اور جحا سے کہا گیا کہ بچے کو سنبھالے؛ بچے نے اسے بھگو دیا تو وہ غصے میں بولا کہ اگر یہ میرا بیٹا نہ ہوتا تو میں اس کے ساتھ اس سے بھی برا کرتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  fr: "Chargé de garder l'enfant pendant que sa femme travaille, Juha est mouillé par l'enfant et répond avec fureur que, si l'enfant n'était pas son fils, il aurait fait pire. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  es: "Encargado de cuidar al niño mientras su mujer trabaja, Juha es mojado por el niño y responde furioso que, si no fuera su hijo, habría hecho algo peor. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  tr: "Juha'nın karısı çalışırken çocuğu tutmasını istedi, ancak çocuk onu ıslattı. Juha öfkelendi ve eğer çocuk kendi oğlu olmasaydı çok daha kötü şeyler yapacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 61}"
  id: "Istri Juha memintanya untuk menggendong anak itu sementara dia bekerja, tetapi anak itu mengompol. Juha menjadi marah dan berkata bahwa jika anak itu bukan anaknya, dia akan melakukan hal yang jauh lebih buruk. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
