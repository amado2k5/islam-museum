label: { ar: "صحيح البخاري 665 — مرض النبي، المرض والمريض", en: "Sahih al-Bukhari 665 — the Prophet's illness; illness and the sick", ur: "صحیح بخاری 665 — نبی کی بیماری، بیماری اور بیمار", es: "Sahih al-Bukhari 665 — La enfermedad del Profeta; la enfermedad y los enfermos", fr: "Sahih al-Bukhari 665 — La maladie du Prophète; la maladie et les malades", tr: "Sahih el-Buhari 665 — Peygamberin Hastalığı, Hastalık ve Hasta", id: "Sahih al-Bukhari 665 — Penyakit Nabi, Penyakit dan Pasien" }
text: "… مَعْمَرٍ، عَنِ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ، قَالَ قَالَتْ عَائِشَةُ لَمَّا ثَقُلَ النَّبِيُّ وَاشْتَدَّ وَجَعُهُ اسْتَأْذَنَ أَزْوَاجَهُ أَنْ يُمَرَّضَ فِي بَيْتِي فَأَذِنَّ لَهُ، فَخَرَجَ بَيْنَ رَجُلَيْنِ تَخُطُّ رِجْلاَهُ الأَرْضَ، وَكَانَ بَيْنَ الْعَبَّاسِ وَرَجُلٍ آخَرَ. قَالَ عُبَيْدُ اللَّهِ فَذَكَرْتُ ذَلِكَ لاِبْنِ عَبَّاسٍ مَا قَالَتْ عَائِشَةُ فَقَالَ لِي وَهَلْ تَدْرِي مَنِ الرَّجُلُ الَّذِي لَمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 665، يذكر مرض النبي، والمرض والمريض، والوجع. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 665 (Call to Prayers (Adhaan)), that mentions the Prophet's illness, illness and the sick, pain. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 665، جس میں نبی کی بیماری، بیماری اور بیمار، درد کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 665 (Llamada a la oración (Adhan)), menciona la enfermedad del Profeta, la enfermedad y los enfermos, y el dolor. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 665 (Appel à la prière (Adhan)), mentionne la maladie du Prophète, la souffrance des malades et la douleur. Le navigateur de textes médicaux le répertorie parmi les ouvrages traitant de la médecine prophétique, de la médecine, de l'anatomie, de la chirurgie, des médicaments et des traitements."
  tr: "Sahih el-Buhari'de 665 numaralı hadis, Peygamberimizin hastalığını, hastalığın kendisini, hastayı ve acıyı anlatır. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 665, menyebutkan penyakit Nabi, penyakit itu sendiri, pasien, dan rasa sakitnya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
