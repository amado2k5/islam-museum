text: "… ذلك إنما هو من طريق الأولى والاستحسان، ولئلًا يفتات الرعايا عليه في شيء من النظر في المصالح العامة، وقد يقول بالوجوب في ذلك مَن يقول بوجوب إقامة الجمعة، فيكون نصبُ الإمام لها عنده واجبًا."
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 216، يرد فيه ذكر الواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
