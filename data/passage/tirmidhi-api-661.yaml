label: { ar: "جامع الترمذي 661 — تربية الأب ووصيته", en: "Jami' al-Tirmidhi 661 — the father raising and counselling", ur: "جامع ترمذی 661 — باپ کی تربیت اور نصیحت", es: "Jami' al-Tirmidhi 661 — El padre que cría y aconseja", fr: "Jami' al-Tirmidhi 661 — l'éducation et les conseils du père", tr: "Cami' el-Tirmizi 661 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Jami' al-Tirmidhi 661 — Didikan dan Wasiat Sang Ayah" }
text: "… الطَّيِّبَ إِلاَّ أَخَذَهَا الرَّحْمَنُ بِيَمِينِهِ وَإِنْ كَانَتْ تَمْرَةً تَرْبُو فِي كَفِّ الرَّحْمَنِ حَتَّى تَكُونَ أَعْظَمَ مِنَ الْجَبَلِ كَمَا يُرَبِّي أَحَدُكُمْ فَلُوَّهُ أَوْ فَصِيلَهُ \". قَالَ وَفِي الْبَابِ عَنْ عَائِشَةَ وَعَدِيِّ بْنِ حَاتِمٍ وَأَنَسٍ وَعَبْدِ اللَّهِ بْنِ أَبِي أَوْفَى وَحَارِثَةَ بْنِ وَهْبٍ وَعَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ وَبُرَيْدَةَ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 661، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 661 (The Book on Zakat), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 661، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 661 (El Libro del Zakat), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 661 (Livre sur la Zakat), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site The Fatherhood in Islam Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Cami' el-Tirmizi'nin 661 numaralı hadisinde babanın yetiştirilmesi ve öğütlerinden bahsedilir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 661, menyebutkan tentang didikan dan nasihat seorang ayah. Bagian \"Peran Ayah dalam Islam\" mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
