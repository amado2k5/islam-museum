label: { ar: "الموطأ 2143 — يحيى عن مالك: فيمن استكرى دابة إلى مكان مسمى ثم تعدى وتقدم، فرب الدابة مخير: إن أحب أخذ كراء دابته إلى المكان الذي تعدى إليه أعطيه وقبض دابته، وإن أحب أخذ قيمتها من المكان الذي تعدى منه، وله الكراء الأول إن كان استكراها للبدء، وإن كان ذاهبا وراجعا فله نصف الكراء", en: "Muwatta 2143", es: "Muwatta 2143", fr: "Muwatta 2143", ur: "موطا 2143", tr: "El-Muvatta 2143 — Yahya, Malik'ten rivayetle: Bir hayvanı belirli bir yere kadar kiralayıp, oradan daha ileri bir yere giden kimse için hayvan sahibinin iki seçeneği vardır: Eğer hayvanının gittiği yere kadar olan kira bedelini almak isterse, hayvanı ona verip hayvanına geri dönebilir. Eğer gittiği yerden itibaren değerini almak isterse, hayvanı ilk kiralama amacı için kiralamışsa, ilk kira bedelini almaya hak kazanır. Gidip geri dönüyorsa, kira bedelinin yarısını almaya hak kazanır.", id: "Al-Muwatta 2143 — Yahya berdasarkan riwayat Malik: Mengenai orang yang menyewa hewan ke suatu tempat tertentu dan kemudian pergi melampaui tempat tersebut dan melakukan perjalanan lebih jauh, pemilik hewan memiliki pilihan: Jika ia ingin menerima biaya sewa hewannya hingga tempat yang ia lewati, ia dapat memberikannya dan mengambil kembali hewannya. Jika ia ingin menerima nilai hewannya dari tempat yang ia lewati, ia berhak atas biaya sewa awal jika ia menyewanya untuk tujuan awal. Jika ia pergi dan kembali, ia berhak atas setengah dari biaya sewa." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في الرجل يستكري الدابة إلى المكان المسمى، ثم يتعدى ذلك ويتقدم. قال: فإن رب الدابة مخير؛ فإن أحب أن يأخذ كراء دابته إلى المكان الذي تعدي بها إليه، أعطي ذلك ويقبض دابته، وله الكراء الأول. وإن أحب رب الدابة، فله قيمة دابته من المكان الذي تعدى منه المستكري، وله الكراء الأول، إن كان استكراه للبداءة. فإن كان استكراها ذاهبا وراجعا، ثم تعدى حين بلغ البلد الذي استكرى إليه، فإنما لرب الدابة نصف الكراء الأول، وذلك أن الكراء نصفه في البداءة ونصفه في الرجعة. فتعدى المتعدي بالدابة، فلم يجب عليه إلا نصف الكراء الأول. ولو أن الدابة هلكت حين بلغ بها البلد الذي استكرى إليه، لم يكن على المستكري ضمان، ولم يكن للمكري إلا نصف الكراء. {cite:muwatta-maruf-1997 p.276} {cite:muwatta-maruf-1997 p.277}"
  tr: "Yahya dedi ki: Malik'in şöyle dediğini duydum: Bizim görüşümüze göre, bir kişi bir hayvanı belirlenmiş bir yere kadar kiralarsa, sonra o yerden öteye giderse, hayvanın sahibi bir seçeneğe sahiptir. Eğer hayvanın kira bedelini, kiralayanın öteye gittiği yere kadar almak isterse, bunu yapabilir ve hayvanını geri alabilir; ayrıca asıl kira bedeline de hak kazanır. Eğer sahibi aksini tercih ederse, hayvanın değerinin, kiralayanın öteye gittiği yerden itibaren olan kısmını ve eğer kiralayan hayvanı ilk yolculuk için kiralamışsa, asıl kira bedelini almaya hak kazanır. Eğer hayvanı gidiş-dönüş için kiralamış ve belirlenmiş yerden öteye gitmişse, hayvanın sahibi sadece asıl kira bedelinin yarısını almaya hak kazanır, çünkü kira bedeli ilk ve dönüş yolculukları arasında eşit olarak bölünür. Kiralayan belirlenmiş yerden öteye gittiği için, sadece asıl kira bedelinin yarısını almaya hak kazanır. Eğer hayvan belirlenmiş yere ulaştığında ölürse, kiralayan sorumlu değildir ve sadece kira bedelinin yarısını almaya hak kazanır. {cite:muwatta-maruf-1997 s.276} {cite:muwatta-maruf-1997 s.277}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Menurut pandangan kami, jika seseorang menyewa hewan ke tempat yang ditentukan, kemudian melampaui tempat itu dan melakukan perjalanan lebih jauh, pemilik hewan memiliki pilihan. Jika ia ingin menerima biaya sewa hewan hingga tempat yang dilampaui penyewa, ia dapat melakukannya dan mengambil kembali hewannya, dan ia berhak atas biaya sewa awal. Jika pemilik lebih suka sebaliknya, ia berhak atas nilai hewannya dari tempat yang dilampaui penyewa, dan ia berhak atas biaya sewa awal, jika penyewa menyewa hewan untuk perjalanan awal. Jika ia menyewanya untuk perjalanan pulang pergi, dan kemudian melampaui tempat yang ditentukan, pemilik hewan hanya berhak atas setengah dari biaya sewa awal, karena biaya sewa dibagi rata antara perjalanan awal dan perjalanan pulang. Karena penyewa melampaui tempat yang ditentukan, ia hanya berhak atas setengah dari biaya sewa awal. Jika hewan tersebut mati setelah sampai di tempat yang ditentukan, penyewa tidak bertanggung jawab, dan penyewa hanya berhak atas setengah dari biaya sewa. {kutip:muwatta-maruf-1997 hal.276} {kutip:muwatta-maruf-1997 hal.277}"
