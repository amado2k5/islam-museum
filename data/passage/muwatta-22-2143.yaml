label: { ar: "الموطأ 2143 — يحيى عن مالك: فيمن استكرى دابة إلى مكان مسمى ثم تعدى وتقدم، فرب الدابة مخير: إن أحب أخذ كراء دابته إلى المكان الذي تعدى إليه أعطيه وقبض دابته، وإن أحب أخذ قيمتها من المكان الذي تعدى منه، وله الكراء الأول إن كان استكراها للبدء، وإن كان ذاهبا وراجعا فله نصف الكراء", en: "Muwatta 2143" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في الرجل يستكري الدابة إلى المكان المسمى، ثم يتعدى ذلك ويتقدم. قال: فإن رب الدابة مخير؛ فإن أحب أن يأخذ كراء دابته إلى المكان الذي تعدي بها إليه، أعطي ذلك ويقبض دابته، وله الكراء الأول. وإن أحب رب الدابة، فله قيمة دابته من المكان الذي تعدى منه المستكري، وله الكراء الأول، إن كان استكراه للبداءة. فإن كان استكراها ذاهبا وراجعا، ثم تعدى حين بلغ البلد الذي استكرى إليه، فإنما لرب الدابة نصف الكراء الأول، وذلك أن الكراء نصفه في البداءة ونصفه في الرجعة. فتعدى المتعدي بالدابة، فلم يجب عليه إلا نصف الكراء الأول. ولو أن الدابة هلكت حين بلغ بها البلد الذي استكرى إليه، لم يكن على المستكري ضمان، ولم يكن للمكري إلا نصف الكراء. {cite:muwatta-maruf-1997 p.276} {cite:muwatta-maruf-1997 p.277}"
