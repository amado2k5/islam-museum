text: "خلاص سره حين دعاه ربه، وجوز جعله ظرفا لقال) وليس الأمر وما في جوابه على حقيقتهما بل هو تمثيل والمعنى أخطر بياله الدلائل المؤيدة إلى المعرفة، واستدل بها وأذعن بمدلولاتها إلا أنه سبحانه وتعالى عبر عن ذلك بالقولين تصويرا لسرعة"
