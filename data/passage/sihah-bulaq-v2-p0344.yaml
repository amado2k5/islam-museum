text: |-
  • ⁦(باب اللام)⁩*
  • ⁦(ندل )⁩ *
  ٢٤٣
  ويذكر فن أنث أراد الصحيفة ومن ذكرأراد السكتاب (نحل الحل والحلة الدبريقع
  على الذكر والانثى حتى تقول يعسوب والنحل الناحل وقال ذوالرمة
  فياف يدعن الجلم تحلاقتالها * والنحل بالضم مصدرقوللا نحلته من العطية أنحله تحلا
  والنحلى العطية على فعلى ونحات المرأة مهرها عن طيب نفسر من غيرمطالبة أنحلها ويقال
  من غير أن تأخذع وضا يقال أعطاها مهرها لمحلة بالكسر وقال أبو عمروهى التسهية أن
  تقول غلتها كذا وكذافتصد الصداق وتينه والنحلة أيضا الدعوى والنحول الهزال
  وقد نحل جسمه ينحل وأنلد الهمّ ونحل جسهه أيضا بالكسر فح ولا والفتح أفصح وجمسل ناحل
  مهزول والتواحل السيوف التى رقت ظباها من كثرة الاستعمال ونحلته القول أنحل تلا
  بالفتح اذا أضفت اليه قولا قاله غيره وادّعيته عليه وانتحل فلان شعر غيره أو قول غيره اذا
  أذّعاه لنفسه قال الأعشى
  فكيف أفا وانتهالى القوافى بعد المشيب كنى ذالأعارا
  وتنحله مثله قال الفرزدق
  اذا ماقات قافية شرودا * تتحلها ابن حراء العجان
  وفلان ينتحل مذهب كذا وقبيلة كذا اذا اندسب اليه خل لنخل والنخيل ؟عنى
  والواحدة نخلة وقول الشاعر
  رأيت بها قضيافوق دعص * عليه النخل أبنع والكروم
  فالنخل قالواضرب من الحلىّ والكروم القلائد ونخل الدقيق غربلته والنخالة ما يخرج منه
  والمنخل ما ينخل به وهو أحد ماجاء من الادوات على مفعل بالضم والمنخل بفتح الخاءلغة فيه
  مثل المنصل والمنصل وانتخلت الشىء استة- يت أفضله وتنخلته تخيرته ورجل ناخل الصدرأى
  ناصح وبطر نخلة موضع بين مكة والطائف والمنخل بفتح الخاءمشذدا اسم شاءر يقال لا أفعله
  حتى يؤب المنخل كما يقال لا أفع له حتى يؤب الفارظ العنزى والمتنخر لقب شاءومن هذيل وهو
  مالك بن عويمر أخو إنى لحيان بن هذيل ⁦(ندل)⁩ الندل النقل والاختلاس يقال ندات
  الشى وندلت الدلواذا أخرجتها من البسأر والرحل مندل بكسر الميم وقال بصف ركبا
  ويمدح قوم دارين بالجود
  يمزون بالدهنا خفافا عيابه-م * ويخرجن من دارين بجر الحقائب
  على حين ألهى الناس جل أمورهم •. فند لازريق المدال ندل الثعالب
  يقول اندلى يازريق وهى قبيلة تدل الفعالب يريد السرعة والعرب تقول أكسب من ثعلب
  والمنديل معروف تقول منه تندات بالمنديل وتقدلت وأنكر الكساتى تن_دلت والمندلى
  عطر يذسب الى المندل وهى من بلاد الهند قال الشاعر
  إذا مامشت نادى بمافى ثيابها • ذكى الشذا والمندلى المطير
  والنيدلان يفتح الدال وقد تضم المكابوس تقول العرب انه لا يعترى الاجبانا والمودلان
  | المديان والمودل الشيخ المضطرب من الكبر وقد نودات خصياه أى استرختا الاصمعى مشى
  الرجلمنودلا أى مشى مسترخيا وأنشد • مفودل الخصمين رخو المشرج• واندال بطن
  الاذ- ان والدابة اذاسال ⁦( ذل)⁩ النذالة السفالة وقد نذل بالضم فهونذل ونذيل أى خسيمر
  قوله فياف يد عن رواه فى مادة
  قتل مها ويد عن اه
