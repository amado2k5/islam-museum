text: "… وقد فتح اللّٰه عليك مثل هذا الفتح ? قال : ومالى لا أبكى، والله لوددت أن بيننا وبينهم بحرا من نار، سمعت رسول اللّٰه يقول : إذا أقبلت رايات ولد العباس من عقاب خراسان جاؤا بنعى الاسلام، فن سار تحت …"
