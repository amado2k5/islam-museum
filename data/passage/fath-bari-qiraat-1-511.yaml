text: "… هذا ما يعارض حديث عبد اللّٰه بن عمرو استقرئوا القرآن من أربعة فذكر اثنين من الأربعة ولم يذكر اثنين ؛ لأنه إما أن يقال: لا يلزم من الأمر بأخذ القراءة عنهم أن يكونوا كلهم استظهروه جميعه، وإما أن لا يؤخذ …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 511، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 1, p. 511, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 1، ص 511 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 1, pág. 511, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de Fath al-Bari d'Ibn Hajar (tome 1, p. 511) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hacer'in Fethü'l-Bari adlı eserinin 1. resimli cildinin 511. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, jilid 1 bergambar, halaman 511, yang menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
