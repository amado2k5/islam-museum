label: { ar: "صحيح البخاري 3151 — الأب والأبوة", en: "Sahih al-Bukhari 3151 — the father and fatherhood", ur: "صحیح بخاری 3151 — باپ اور والدیت", es: "Sahih al-Bukhari 3151 — El padre y la paternidad", fr: "Sahih al-Bukhari 3151 — le père et la paternité", tr: "Sahih el-Buhari 3151 — Baba ve Babalık", id: "Sahih al-Bukhari 3151 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلاَنَ، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا هِشَامٌ، قَالَ أَخْبَرَنِي أَبِي، عَنْ أَسْمَاءَ ابْنَةِ أَبِي بَكْرٍما ـ قَالَتْ كُنْتُ أَنْقُلُ النَّوَى مِنْ أَرْضِ الزُّبَيْرِ الَّتِي أَقْطَعَهُ رَسُولُ اللَّهِ عَلَى رَأْسِي، وَهْىَ مِنِّي عَلَى ثُلُثَىْ فَرْسَخٍ. وَقَالَ أَبُو ضَمْرَةَ عَنْ هِشَامٍ عَنْ أَبِيهِ أَنَّ النَّبِيَّ أَقْطَعَ الزُّبَيْرَ أَرْضًا مِنْ أَمْوَالِ بَنِي النَّضِيرِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3151، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3151 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3151، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3151 (Una quinta parte del botín para la causa de Alá (Khumus)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3151 (Le cinquième du butin pour la cause d'Allah (Khumus)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3151 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3151, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
