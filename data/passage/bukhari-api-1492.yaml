label: { ar: "صحيح البخاري 1492 — ما حُرّم", en: "Sahih al-Bukhari 1492 — what was made unlawful", ur: "صحیح بخاری 1492 — جو حرام کیا گیا", es: "Sahih al-Bukhari 1492 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 1492 — ce qui a été déclaré illicite" }
text: "حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، حَدَّثَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبِّاسٍما ـ قَالَ وَجَدَ النَّبِيُّ شَاةً مَيِّتَةً أُعْطِيَتْهَا مَوْلاَةٌ لِمَيْمُونَةَ مِنَ الصَّدَقَةِ، قَالَ النَّبِيُّ \" هَلاَّ انْتَفَعْتُمْ بِجِلْدِهَا \". قَالُوا إِنَّهَا مَيْتَةٌ. قَالَ \" إِنَّمَا حَرُمَ أَكْلُهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1492، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1492 (Obligatory Charity Tax (Zakat)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1492، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Sahih al-Bukhari, n.° 1492 (Impuesto obligatorio sobre la caridad (Zakat)), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1492 (L'aumône obligatoire (Zakat)), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
