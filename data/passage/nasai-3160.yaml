label:
  ar: "النسائي 3160 — كيف وجدت منزلك: الشهيد يتمنى الرجوع"
  en: "Nasa'i 3160 — How did you find your dwelling: the martyr who wishes to return"
  ur: "نسائی 3160 — تم نے اپنا ٹھکانا کیسا پایا: شہید جو لوٹنے کی تمنا کرتا ہے"
text: "يؤتى بالرجل من أهل الجنة فيقول الله عز وجل يا ابن آدم كيف وجدت منزلك فيقول أى رب خير منزل . فيقول سل وتمن فيقول أسألك أن تردني إلى الدنيا فأقتل في سبيلك عشر مرات لما يرى من فضل الشهادة …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 3160: كيف وجدت منزلك: الشهيد يتمنى الرجوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 3160: How did you find your dwelling: the martyr who wishes to return. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 3160: تم نے اپنا ٹھکانا کیسا پایا: شہید جو لوٹنے کی تمنا کرتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
