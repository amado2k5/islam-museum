text: "… أعلم أحدا استقاء من طعام أكله غير أنى بكر فانه أتى بطعام فأكله ثم قيل له: جاء به النعمان، قال : فأطعمتمونى كهانة ابن النعمان ثم استقاء. وعند البغرى عن عبد الرحمن بن ابى ليلى عن أبى نعيمان وكان من …"
summary:
  ar: "مقطع من حياة الصحابية، المجلد المصوَّر 4، ص 610، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Hayat al-Sahaba, scan volume 4, p. 610, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "حیات الصحابہ، اسکین جلد 4، ص 610 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hayat al-Sahaba, volume numérisé 4, p. 610, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Hayat al-Sahaba, volumen escaneado 4, p. 610, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Resimli 4. cilt, 610. sayfada yer alan, zeki ve aptal insanları anlatan bir hikâyeden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari kisah hidup sahabat perempuan, jilid bergambar 4, halaman 610, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
