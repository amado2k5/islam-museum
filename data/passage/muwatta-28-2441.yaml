label: { ar: "الموطأ 2441 — السائب بن يزيد عن عمر: الرجل الذي وجد منه ريح شراب", en: "Muwatta 2441", es: "Muwatta 2441", fr: "Muwatta 2441", ur: "موطا 2441", tr: "El-Muvatta 2441 — El-Sa'ib bin Yazid, Ömer'den rivayetle: Alkol kokusu olduğu tespit edilen adam", id: "Al-Muwatta 2441 — Al-Sa’ib bin Yazid berdasarkan riwayat Umar: Orang yang tercium bau alkohol" }
summary:
  ar: "يروي مالك عن ابن شهاب عن السائب بن يزيد أن عمر بن الخطاب خرج عليهم فقال: إني وجدت من فلان ريح شراب، فزعم أنه شرب الطلاء، وأنا سائل عما شرب، فإن كان يسكر جلدته. فجلده عمر الحد تاما. {cite:muwatta-maruf-1997 p.409}"
  tr: "Malik, İbn Şihab'dan, o da Sa'ib ibn Yazid'den rivayet ettiğine göre, Ömer ibn el-Hattab yanlarına gelip şöyle dedi: \"Filancanın üzerinde alkol kokusu aldım ve şarap içtiğini iddia etti. Ona ne içtiğini soracağım ve eğer sarhoş ediciyse, onu cezalandıracağım.\" Bunun üzerine Ömer onu tam olarak öngörülen cezayla cezalandırdı. {cite:muwatta-maruf-1997 s.409}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari al-Sa'ib ibn Yazid, bahwa Umar ibn al-Khattab keluar kepada mereka dan berkata: \"Aku mencium bau alkohol pada si fulan, dan dia mengaku telah minum anggur. Aku akan bertanya kepadanya apa yang dia minum, dan jika itu memabukkan, aku akan menghukumnya.\" Maka Umar menghukumnya dengan hukuman yang telah ditetapkan sepenuhnya. {cite:muwatta-maruf-1997 p.409}"
