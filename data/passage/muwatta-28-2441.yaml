summary:
  ar: "يروي مالك عن ابن شهاب عن السائب بن يزيد أن عمر بن الخطاب خرج عليهم فقال: إني وجدت من فلان ريح شراب، فزعم أنه شرب الطلاء، وأنا سائل عما شرب، فإن كان يسكر جلدته. فجلده عمر الحد تاما. {cite:muwatta-maruf-1997 p.409}"
