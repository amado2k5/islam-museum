summary:
  ar: "القسم 17 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الشفعة»، ويضم فيها النصوص من 2492 إلى 2501 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 17 of Sunan Ibn Majah (The Chapters on Pre-emption) in the division of the open hadith dataset the museum took its reports from: reports 2492 to 2501 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 17، عنوان «کتاب الشفعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2492 تا 2501۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 17 de Sunan Ibn Majah (Los capítulos sobre la anticipación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2492 a 2501 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 17 du Sunan Ibn Majah (chapitres sur la préemption), qui comprend les hadiths 2492 à 2501 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
