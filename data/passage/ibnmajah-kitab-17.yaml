  en: "Sunan Ibn Majah, Book 17: The Chapters on Pre-emption"
  ur: "سنن ابن ماجہ، کتاب الشفعۃ"
  es: "Sunan Ibn Majah, Libro 17: Los capítulos sobre la preeminencia"
