text: "إِنِّي عُوتبْتُ اللَّيْلةَ في الْخَيْلِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رسول الله رئي وهو يمسح وجه فرسه بردائه، فسئل عن ذلك، فقال إني عوتبت الليلة في الخيل. ويذكر المحقق أن ابن عبد البر قال إن هذا الخبر روي عن مالك سندا عن يحيى بن سعيد عن أنس، ولا يصح. {cite:muwatta-maruf-1997 p.601}"
