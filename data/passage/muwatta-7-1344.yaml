label: { ar: "الموطأ 1344 — يحيى بن سعيد: رئي النبي يمسح وجه فرسه بردائه، فقال إني عوتبت الليلة في الخيل", en: "Muwatta 1344", es: "Muwatta 1344", fr: "Muwatta 1344", ur: "موطا 1344", tr: "El-Muvatta 1344 — Yahya bin Said: Peygamberimiz atının yüzünü cübbesiyle silerken görüldü ve şöyle buyurdu: \"Bu gece atlar konusunda azarlandım.\"", id: "Al-Muwatta 1344 — Yahya bin Saeed: Nabi terlihat mengusap wajah kudanya dengan jubahnya, lalu beliau berkata, “Aku ditegur malam ini mengenai kuda-kuda.”" }
text: "إِنِّي عُوتبْتُ اللَّيْلةَ في الْخَيْلِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رسول الله رئي وهو يمسح وجه فرسه بردائه، فسئل عن ذلك، فقال إني عوتبت الليلة في الخيل. ويذكر المحقق أن ابن عبد البر قال إن هذا الخبر روي عن مالك سندا عن يحيى بن سعيد عن أنس، ولا يصح. {cite:muwatta-maruf-1997 p.601}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Allah Resulü'nün atının yüzünü cübbesiyle sildiğini nakletmiştir. Bunun sebebi sorulduğunda, \"Dün gece atlar konusunda azarlandım\" demiştir. Araştırmacı, İbn Abdül-Barr'ın bu rivayetin Malik'ten, Yahya ibn Sa'id'den de Enes'ten rivayetle nakledildiğini söylediğini, ancak sahih olmadığını belirtmektedir. {cite:muwatta-maruf-1997 s.601}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Rasulullah SAW terlihat mengusap wajah kudanya dengan jubahnya. Ketika ditanya tentang hal itu, beliau berkata, \"Semalam aku ditegur karena masalah kuda.\" Peneliti menyebutkan bahwa Ibnu 'Abd al-Barr mengatakan bahwa riwayat ini dinarasikan dari Malik dengan sanad dari Yahya ibn Sa'id dari Anas, tetapi riwayat ini tidak sahih. {cite:muwatta-maruf-1997 p.601}"
