label: { ar: "صحيح البخاري 3573 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3573 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3573 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3573 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3573 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ أَنَّهُ قَالَ رَأَيْتُ رَسُولَ اللَّهِ وَحَانَتْ صَلاَةُ الْعَصْرِ، فَالْتُمِسَ الْوَضُوءُ فَلَمْ يَجِدُوهُ فَأُتِيَ رَسُولُ اللَّهِ بِوَضُوءٍ، فَوَضَعَ رَسُولُ اللَّهِ يَدَهُ فِي ذَلِكَ الإِنَاءِ، فَأَمَرَ النَّاسَ أَنْ يَتَوَضَّئُوا مِنْهُ، فَرَأَيْتُ الْمَاءَ يَنْبُعُ مِنْ تَحْتِ أَصَابِعِهِ، فَتَوَضَّأَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3573، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3573 (Virtues and Merits of the Prophet (pbuh) and his Companions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3573، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 3573 (Virtudes y méritos del Profeta y sus compañeros), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 3573 (Vertus et Mérites du Prophète et de ses Compagnons), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
