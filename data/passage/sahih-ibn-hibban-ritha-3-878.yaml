text: "… : إِنَّ الميتَ ليعذبُ ببكاءِ الحي قالتْ عَائِشَةُ: يغفرُ اللّهُ لأبي عبدِ الرَّحْمُنِ أما إِنهُ لَمْ يكذبْ ولكنهُ نَسي أو أخطأ إنما مرَّ رَسُولُ اللهِ وَلَاله على يهوديةِ يُبكى عليها فقالَ: إِنَّهم يَبْكُونَ عَلَيْها وإنَّها لتُعَذَّبُ في قَبْرِها. ط الحديث:، …"
summary:
  ar: "مقطع من صحيح ابن حبان ⁦(المسند الصحيح على التقاسيم والأنواع)⁩، المجلد المصوَّر 3، ص 878، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Sahih Ibn Hibban (al-Musnad al-Sahih 'ala al-Taqasim wa-al-Anwa'), scan volume 3, p. 878, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "صحیح ابن حبان ⁦(المسند الصحیح علی التقاسیم والانواع)⁩، اسکین جلد 3، ص 878 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
