label: { ar: "نوادر جحا الكبرى، ص 140 — «لقد أشكلت المسألة!»", en: "Nawadir Juha al-Kubra, p. 140 — 'The Matter Has Become Complicated'", ur: "نوادر جحا الکبریٰ، ص 140 — «معاملہ الجھ گیا»", fr: "Nawadir Juha al-Kubra, p. 140 — « L'affaire est devenue compliquée »", es: "Nawadir Juha al-Kubra, p. 140 — «¡El asunto se ha complicado!»" }
text: "… لقد أشكلت المسألة! جاءه رجلٌ عندما كان قاضياً : قائلاً : إن الثور الأحمر، وأظنُّه ثوركم قد نطح بقرتنا في بطنها فقتلها. فقال الشيخ: وما دخل صاحبه في الأمر، فهذه دعوى دمٍّ لا يطالب بها حيوانٌ. فقال الرجل : كلا …"
summary:
  ar: "سمع جحا قاضياً شكوى أن ثوراً أحمر نطح بقرة، فقال إن صاحب الثور لا يُسأل، فقال المدعي إن بطن البقرة نفسها هي التي نُطحت، فقال جحا إن المسألة أشكلت وطلب كتاباً مجلداً بالأسود. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  en: "As judge, Juha hears a complaint that a red bull gored a cow, and he says the owner of the bull cannot be held responsible. The complainant says it was the cow's own belly that was gored, and Juha says the case is complicated and asks for a black-bound book. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  ur: "قاضی کی حیثیت سے جحا یہ شکایت سنتا ہے کہ ایک سرخ سانڈ نے گائے کو سینگ مارا، تو وہ کہتا ہے کہ سانڈ کے مالک کو ذمہ دار نہیں ٹھہرایا جا سکتا۔ مدعی کہتا ہے کہ سینگ تو خود گائے کے پیٹ میں لگا ہے، تو جحا کہتا ہے کہ معاملہ الجھ گیا ہے اور سیاہ جلد والی کتاب مانگتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  fr: "En tant que juge, Juha entend une plainte selon laquelle un taureau rouge a encorné une vache, et il dit que le propriétaire du taureau ne peut être tenu pour responsable. Le plaignant dit que c'est le ventre de la vache elle-même qui a été encorné, et Juha dit que l'affaire est compliquée et demande un livre à reliure noire. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  es: "Como juez, Juha oye una queja de que un toro rojo corneó a una vaca, y dice que el dueño del toro no puede ser considerado responsable. El demandante dice que fue el propio vientre de la vaca el corneado, y Juha dice que el caso se complica y pide un libro encuadernado en negro. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
