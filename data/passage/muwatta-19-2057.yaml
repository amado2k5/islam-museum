label: { ar: "الموطأ 2057 — مالك: فأما إذا طاب الثمر وبدا صلاحه وحل بيعه، ثم قال رجل لرجل: اعمل لي بعض هذه الأعمال بنصف ثمر حائطي هذا، فلا بأس بذلك، وإنما استأجره بشيء معروف معلوم، فإن لم يكن للحائط ثمر أو قل أو فسد فليس له إلا ذلك، والإجارة لا تجوز إلا بشيء مسمى", en: "Muwatta 2057" }
summary:
  ar: "قال مالك: فأما إذا طاب الثمر وبدا صلاحه وحل بيعه، ثم قال رجل لرجل: اعمل لي بعض هذه الأعمال، لعمل يسميه له، بنصف ثمر حائطي هذا، فلا بأس بذلك، وإنما استأجره بشيء معروف معلوم قد رآه ورضيه. قال: فأما المساقاة، فإنه إن لم يكن للحائط ثمر، أو قل ثمره أو فسد، فليس له إلا ذلك. وأن الأجير لا يستأجر إلا بشيء مسمى، لا تجوز الإجارة إلا بذلك. وإنما الإجارة بيع من البيوع، إنما يشتري منه عمله، ولا يصلح ذلك إذا دخله الغرر، لأن رسول الله نهى عن بيع الغرر. {cite:muwatta-maruf-1997 p.242}"
