label: { ar: "الموطأ 2057 — مالك: فأما إذا طاب الثمر وبدا صلاحه وحل بيعه، ثم قال رجل لرجل: اعمل لي بعض هذه الأعمال بنصف ثمر حائطي هذا، فلا بأس بذلك، وإنما استأجره بشيء معروف معلوم، فإن لم يكن للحائط ثمر أو قل أو فسد فليس له إلا ذلك، والإجارة لا تجوز إلا بشيء مسمى", en: "Muwatta 2057", es: "Muwatta 2057", fr: "Muwatta 2057", ur: "موطا 2057", tr: "El-Muvatta 2057 — Malik: Meyve olgunlaşırsa ve olgunluğu belli olursa ve satılması caiz ise, bir kişi diğerine: \"Şu bahçemdeki meyvenin yarısı karşılığında şu işlerden bazılarını benim için yap\" derse, bunda bir sakınca yoktur. Sadece bilinen ve belirlenmiş bir miktar için onu işe almıştır. Eğer bahçede meyve yoksa, meyve azsa veya bozulmuşsa, o zaman sadece o miktara hak kazanır. Belirli bir miktar dışında kira sözleşmesi caiz değildir.", id: "Al-Muwatta 2057 — Malik: Jika buah sudah matang dan kematangannya terlihat jelas, dan boleh dijual, lalu seseorang berkata kepada orang lain: Kerjakan sebagian dari tugas-tugas ini untukku sebagai imbalan setengah dari buah kebunku ini, maka tidak ada salahnya. Ia hanya mempekerjakannya dengan jumlah yang diketahui dan ditentukan. Jika kebun itu tidak berbuah, atau buahnya sedikit, atau busuk, maka ia hanya berhak atas jumlah tersebut. Perjanjian sewa-menyewa tidak diperbolehkan kecuali untuk jumlah yang ditentukan." }
summary:
  ar: "قال مالك: فأما إذا طاب الثمر وبدا صلاحه وحل بيعه، ثم قال رجل لرجل: اعمل لي بعض هذه الأعمال، لعمل يسميه له، بنصف ثمر حائطي هذا، فلا بأس بذلك، وإنما استأجره بشيء معروف معلوم قد رآه ورضيه. قال: فأما المساقاة، فإنه إن لم يكن للحائط ثمر، أو قل ثمره أو فسد، فليس له إلا ذلك. وأن الأجير لا يستأجر إلا بشيء مسمى، لا تجوز الإجارة إلا بذلك. وإنما الإجارة بيع من البيوع، إنما يشتري منه عمله، ولا يصلح ذلك إذا دخله الغرر، لأن رسول الله نهى عن بيع الغرر. {cite:muwatta-maruf-1997 p.242}"
  id: "Malik berkata: Jika buah sudah matang dan kematangannya terlihat jelas, dan boleh dijual, lalu seseorang berkata kepada orang lain, \"Kerjakan beberapa tugas ini untukku,\" dengan menyebutkan tugasnya, \"dengan imbalan setengah dari buah kebun ini,\" maka tidak ada salahnya. Pada dasarnya ia mempekerjakannya dengan jumlah yang telah diketahui dan disepakati, yang telah dilihat dan diterimanya. Ia berkata: Adapun bagi hasil, jika kebun tidak berbuah, atau buahnya sedikit atau busuk, maka ia hanya berhak atas jumlah tersebut. Seorang pekerja hanya dipekerjakan dengan jumlah yang telah ditentukan; perjanjian sewa tidak sah tanpa itu. Perjanjian sewa hanyalah penjualan; pembeli hanya membeli tenaga kerja pekerja. Ini tidak diperbolehkan jika terdapat ketidakpastian (gharar), karena Rasulullah shalla Allahu alaihi wa sallam melarang penjualan yang melibatkan ketidakpastian. {kutipan:muwatta-maruf-1997 hlm. 242}"
