label: { ar: "صحيح مسلم 7279 — الأب والأبوة", en: "Sahih Muslim 7279 — the father and fatherhood", ur: "صحیح مسلم 7279 — باپ اور والدیت", es: "Sahih Muslim 7279 — El padre y la paternidad", fr: "Sahih Muslim 7279 — Le père et la paternité", tr: "Sahih Muslim 7279 — Baba ve Babalık", id: "Sahih Muslim 7279 — Ayah dan Peran Ayah" }
text: "… بْنُ شُعَيْبِ بْنِ اللَّيْثِ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي اللَّيْثُ، بْنُ سَعْدٍ حَدَّثَنِي مُوسَى بْنُ عُلَىٍّ، عَنْ أَبِيهِ، قَالَ قَالَ الْمُسْتَوْرِدُ الْقُرَشِيُّ عِنْدَ عَمْرِو بْنِ الْعَاصِ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" تَقُومُ السَّاعَةُ وَالرُّومُ أَكْثَرُ النَّاسِ \". فَقَالَ لَهُ عَمْرٌو أَبْصِرْ مَا تَقُولُ. قَالَ أَقُولُ مَا سَمِعْتُ مِنْ رَسُولِ اللَّهِ قَالَ لَئِنْ قُلْتَ ذَلِكَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 7279، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7279 (The Book of Tribulations and Portents of the Last Hour), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7279، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 7279 (El Libro de las Tribulaciones y Presagios de la Última Hora), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 7279 (Le Livre des tribulations et des présages de la fin des temps), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 7279 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 7279, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
