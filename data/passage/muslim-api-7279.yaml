text: "… بْنُ شُعَيْبِ بْنِ اللَّيْثِ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي اللَّيْثُ، بْنُ سَعْدٍ حَدَّثَنِي مُوسَى بْنُ عُلَىٍّ، عَنْ أَبِيهِ، قَالَ قَالَ الْمُسْتَوْرِدُ الْقُرَشِيُّ عِنْدَ عَمْرِو بْنِ الْعَاصِ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" تَقُومُ السَّاعَةُ وَالرُّومُ أَكْثَرُ النَّاسِ \". فَقَالَ لَهُ عَمْرٌو أَبْصِرْ مَا تَقُولُ. قَالَ أَقُولُ مَا سَمِعْتُ مِنْ رَسُولِ اللَّهِ قَالَ لَئِنْ قُلْتَ ذَلِكَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 7279، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7279 (The Book of Tribulations and Portents of the Last Hour), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7279، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
