label: { ar: "سنن أبي داود 1249 — الأب والأبوة", en: "Sunan Abi Dawud 1249 — the father and fatherhood", ur: "سنن ابی داؤد 1249 — باپ اور والدیت", es: "Sunan Abi Dawud 1249 — El padre y la paternidad", fr: "Sunan Abi Dawud 1249 — le père et la paternité", tr: "Sunan Abi Davud 1249 — Baba ve Babalık", id: "Sunan Abi Dawud 1249 — Sang Ayah dan Peran Ayah" }
text: "… حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ مُحَمَّدِ بْنِ جَعْفَرٍ، عَنِ ابْنِ عَبْدِ اللَّهِ بْنِ أُنَيْسٍ، عَنْ أَبِيهِ، قَالَ بَعَثَنِي رَسُولُ اللَّهِ إِلَى خَالِدِ بْنِ سُفْيَانَ الْهُذَلِيِّ - وَكَانَ نَحْوَ عُرَنَةَ وَعَرَفَاتٍ - فَقَالَ \" اذْهَبْ فَاقْتُلْهُ \". قَالَ فَرَأَيْتُهُ وَحَضَرَتْ صَلاَةُ الْعَصْرِ فَقُلْتُ إِنِّي لأَخَافُ أَنْ يَكُونَ بَيْنِي وَبَيْنَهُ مَا إِنْ أُؤَخِّرُ الصَّلاَةَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1249، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1249 (Prayer (Kitab Al-Salat): Detailed Rules of Law about the Prayer during Journey), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1249، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1249 (La oración (Kitab Al-Salat): Reglas detalladas sobre la oración durante el viaje), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1249 (La Prière (Kitab Al-Salat): Règles détaillées concernant la prière en voyage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1249 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1249, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
