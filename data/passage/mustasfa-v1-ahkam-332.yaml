text: "… رفع الحرج عن الفعل والترك، وذلك ثابت قبل السمع. فمعنى إباحة الشرع شيئاً : أنه تركه على ما كان عليه قبل ورود السمع، ولم يغير حكمه، وكأن ما لم يثبت تحريمه ولا وجوبه بقي على النفي الأصلي، فيعبر عنه بالمباح. …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 332، يرد فيه ذكر الوجوب، والمباح، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 332, whose wording mentions obligation (wujub), the permitted (mubah), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، جلد 1، ص 332 کا اقتباس جس میں وجوب، مباح، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
