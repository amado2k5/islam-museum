label: { ar: "الموطأ 2170 — مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن: أنها أخبرته أن رسول الله قال: لا يمنع نقع بئر", en: "Muwatta 2170", es: "Muwatta 2170", fr: "Muwatta 2170", ur: "موطا 2170", tr: "El-Muvatta 2170 — Malik, Ebu el-Rijal Muhammed ibn Abd el-Rahman'dan, annesi Amrah bint Abd el-Rahman'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu bildirmiştir: \"Kuyunun suyu hiçbir şeyi engellemez.\"", id: "Al-Muwatta 2170 — Malik, berdasarkan riwayat Abu al-Rijal Muhammad ibn Abd al-Rahman, berdasarkan riwayat ibunya, Amrah bint Abd al-Rahman: bahwa dia memberitahukan kepadanya bahwa Rasulullah SAW bersabda: “Air sumur tidak menghalangi" }
summary:
  ar: "يروي مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن أنها أخبرته أن رسول الله قال: لا يمنع نقع بئر. ويذكر المحقق أن الحديث مرسل عند جميع رواة الموطأ، وأن ابن عبد البر نقل إسناده الموصول من طريق أبي قرة عن مالك وضعفه. {cite:muwatta-maruf-1997 p.289}"
  tr: "Malik, Ebu el-Rijal Muhammed ibn Abd el-Rahman'dan, annesi Amrah bint Abd el-Rahman'dan rivayetle, Allah Resulü'nün \"Kuyunun suyu engellenemez\" dediğini aktarır. Araştırmacı, hadisin Muvatta'nın tüm ravilerine göre mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve İbn Abd el-Barr'ın, Malik'ten rivayetle Ebu Kurrah aracılığıyla, hadisin zincirini naklettiğini ve zayıf bulduğunu belirtir. {cite:muwatta-maruf-1997 s.289}"
  id: "Malik meriwayatkan dari Abu al-Rijal Muhammad ibn Abd al-Rahman, dari ibunya, Amrah bint Abd al-Rahman, bahwa ia memberitahukan kepadanya bahwa Rasulullah SAW bersabda: \"Air sumur tidak boleh dihalangi.\" Peneliti menyebutkan bahwa hadits ini mursal (hadits dengan rantai periwayatan yang hilang) menurut semua perawi al-Muwatta, dan bahwa Ibnu Abd al-Barr meriwayatkan rantai periwayatan yang terhubung melalui Abu Qurrah dari Malik dan menganggapnya lemah. {cite:muwatta-maruf-1997 p.289}"
