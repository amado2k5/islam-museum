summary:
  ar: "يروي مالك عن أبي الرجال محمد بن عبد الرحمن عن أمه عمرة بنت عبد الرحمن أنها أخبرته أن رسول الله قال: لا يمنع نقع بئر. ويذكر المحقق أن الحديث مرسل عند جميع رواة الموطأ، وأن ابن عبد البر نقل إسناده الموصول من طريق أبي قرة عن مالك وضعفه. {cite:muwatta-maruf-1997 p.289}"
