text: "قال شداد بن أوس: ثنتان حفظتهما عن رسول الله: «إن الله كتب الإحسان على كل شيء؛ فإذا قتلتم فأحسنوا القتلة، وإذا ذبحتم فأحسنوا الذبح، وليحد أحدكم شفرته فليرح ذبيحته»"
summary:
  ar: "رواية شداد بن أوس في باب الأمر بإحسان الذبح والقتل من صحيح مسلم؛ كتابة الإحسان على كل شيء حتى في القتل والذبح — نص جامع لمكانة الإحسان في الشريعة."
