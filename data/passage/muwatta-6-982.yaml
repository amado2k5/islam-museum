label: { ar: "الموطأ 982 — مالك عن رجل من غير أهل مكة دخل مكة بعمرة في أشهر الحج يريد الإقامة حتى ينشئ الحج: أمتمتع هو؟ نعم، هو متمتع وليس مثل أهل مكة", en: "Muwatta 982", es: "Muwatta 982", fr: "Muwatta 982", ur: "موطا 982", tr: "El-Muvatta 982 — Malik, Hac aylarında Umre için Mekke'ye giren ve Hac ibadetini yerine getirene kadar kalmayı amaçlayan Mekke dışından bir adamın rivayetine dayanarak şöyle diyor: \"O, Tamattu' yapıyor mu? Evet, Tamattu' yapıyor ve Mekke halkı gibi değil.\"", id: "Al-Muwatta 982 — Malik berdasarkan riwayat seorang pria dari luar Mekah yang memasuki Mekah untuk Umrah pada bulan-bulan Haji dengan niat untuk tinggal hingga ia menunaikan ibadah Haji: Apakah dia sedang melakukan Tamattu’? Ya, dia sedang melakukan Tamattu’ dan tidak seperti penduduk Mekah." }
summary:
  ar: "سئل مالك عن رجل من غير أهل مكة دخل مكة بعمرة في أشهر الحج، وهو يريد الإقامة بمكة حتى ينشئ الحج: أمتمتع هو؟ فقال: نعم، هو متمتع، وليس مثل أهل مكة، وإن أراد الإقامة، لأنه دخل مكة وليس من أهلها، وإنما الهدي أو الصيام على من لم يكن من أهل مكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1112). {cite:muwatta-maruf-1997 p.463}"
  tr: "Malik'e, Hac aylarında Umre için Mekke'ye giren ve Hac ibadetini yerine getirene kadar Mekke'de kalmayı amaçlayan, Mekke'li olmayan bir adam hakkında soru soruldu: Bu adam Tamattu' (bir tür Hac) mu yapıyor? Malik şöyle cevap verdi: Evet, Tamattu' yapıyor, ancak Mekke halkı gibi değil, kalmayı amaçlasa bile, çünkü Mekke'ye girdi ama Mekke sakinlerinden değil. Kurban veya oruç sadece Mekke'li olmayanlardan istenir. Araştırmacı, bunun Ebu Musab'ın (1112) Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.463}"
  id: "Malik ditanya tentang seorang pria yang bukan berasal dari Mekah dan memasuki Mekah untuk Umrah selama bulan-bulan Haji, dengan niat untuk tinggal di Mekah sampai ia melaksanakan Haji: Apakah ia melaksanakan Tamattu' (sejenis Haji)? Beliau menjawab: Ya, ia melaksanakan Tamattu', tetapi ia tidak seperti penduduk Mekah, meskipun ia berniat untuk tinggal, karena ia memasuki Mekah tetapi bukan penduduknya. Kurban atau puasa hanya diwajibkan bagi mereka yang bukan berasal dari Mekah. Peneliti menyebutkan bahwa Abu Mus'ab (1112) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.463}"
