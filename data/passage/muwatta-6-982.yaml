label: { ar: "الموطأ 982 — مالك عن رجل من غير أهل مكة دخل مكة بعمرة في أشهر الحج يريد الإقامة حتى ينشئ الحج: أمتمتع هو؟ نعم، هو متمتع وليس مثل أهل مكة", en: "Muwatta 982" }
summary:
  ar: "سئل مالك عن رجل من غير أهل مكة دخل مكة بعمرة في أشهر الحج، وهو يريد الإقامة بمكة حتى ينشئ الحج: أمتمتع هو؟ فقال: نعم، هو متمتع، وليس مثل أهل مكة، وإن أراد الإقامة، لأنه دخل مكة وليس من أهلها، وإنما الهدي أو الصيام على من لم يكن من أهل مكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1112). {cite:muwatta-maruf-1997 p.463}"
