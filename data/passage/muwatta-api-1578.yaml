label: { ar: "موطأ مالك 1578 — البرء من العلة، مداواة الجراح", en: "Muwatta Malik 1578 — recovery from an ailment; the treatment of wounds", ur: "موطأ مالک 1578 — بیماری سے شفایابی، زخموں کا علاج", es: "Muwatta Malik 1578 — recuperación de una dolencia; tratamiento de heridas", fr: "Muwatta Malik 1578 — guérison d'une maladie; traitement des plaies", tr: "Muwatta Malik 1578 — Hastalıktan iyileşme, yaraların tedavisi", id: "Muwatta Malik 1578 — Pemulihan dari penyakit, pengobatan luka" }
text: "… الأَرْبَعِ مِمَّا يُصَابُ بِهِ الْعَبْدُ مَا نَقَصَ مِنْ ثَمَنِهِ يُنْظَرُ فِي ذَلِكَ بَعْدَ مَا يَصِحُّ الْعَبْدُ وَيَبْرَأُ كَمْ بَيْنَ قِيمَةِ الْعَبْدِ بَعْدَ أَنْ أَصَابَهُ الْجُرْحُ وَقِيمَتِهِ صَحِيحًا قَبْلَ أَنْ يُصِيبَهُ هَذَا ثُمَّ يَغْرَمُ الَّذِي أَصَابَهُ مَا بَيْنَ الْقِيمَتَيْنِ. قَالَ مَالِكٌ فِي الْعَبْدِ إِذَا كُسِرَتْ يَدُهُ أَوْ رِجْلُهُ ثُمَّ صَحَّ كَسْرُهُ فَلَيْسَ عَلَى مَنْ أَصَابَهُ شَىْءٌ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1578، يذكر البرء من العلة، ومداواة الجراح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1578 (Blood-Money), that mentions recovery from an ailment, the treatment of wounds. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1578، جس میں بیماری سے شفایابی، زخموں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Muwatta Malik n.º 1578 (Dinero de sangre) menciona la recuperación de una dolencia y el tratamiento de heridas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik, n° 1578 (Prix du sang), mentionne la guérison d'une maladie et le traitement des plaies. Le Répertoire des ouvrages médicaux le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta adlı eserinde 1578 numaralı hadis, hastalıktan iyileşme ve yaraların tedavisine değinmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1578, menyebutkan tentang kesembuhan dari penyakit dan pengobatan luka. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
