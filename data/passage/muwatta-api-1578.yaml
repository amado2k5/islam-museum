label: { ar: "موطأ مالك 1578 — البرء من العلة، مداواة الجراح", en: "Muwatta Malik 1578 — recovery from an ailment; the treatment of wounds", ur: "موطأ مالک 1578 — بیماری سے شفایابی، زخموں کا علاج" }
text: "… الأَرْبَعِ مِمَّا يُصَابُ بِهِ الْعَبْدُ مَا نَقَصَ مِنْ ثَمَنِهِ يُنْظَرُ فِي ذَلِكَ بَعْدَ مَا يَصِحُّ الْعَبْدُ وَيَبْرَأُ كَمْ بَيْنَ قِيمَةِ الْعَبْدِ بَعْدَ أَنْ أَصَابَهُ الْجُرْحُ وَقِيمَتِهِ صَحِيحًا قَبْلَ أَنْ يُصِيبَهُ هَذَا ثُمَّ يَغْرَمُ الَّذِي أَصَابَهُ مَا بَيْنَ الْقِيمَتَيْنِ. قَالَ مَالِكٌ فِي الْعَبْدِ إِذَا كُسِرَتْ يَدُهُ أَوْ رِجْلُهُ ثُمَّ صَحَّ كَسْرُهُ فَلَيْسَ عَلَى مَنْ أَصَابَهُ شَىْءٌ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1578، يذكر البرء من العلة، ومداواة الجراح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1578 (Blood-Money), that mentions recovery from an ailment, the treatment of wounds. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1578، جس میں بیماری سے شفایابی، زخموں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
