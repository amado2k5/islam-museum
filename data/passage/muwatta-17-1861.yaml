label: { ar: "الموطأ 1861 — مالك: من راطل رجلا فأعطاه الذهب الجياد وجعل معها تبرا غير جيدة، وأخذ منه ذهبا كوفية مكروهة عند الناس، فلا يصلح، لأن صاحب الجياد أخذ فضل عيون ذهبه في التبر", en: "Muwatta 1861" }
summary:
  ar: "قال مالك في الرجل يراطل الرجل، ويعطيه الذهب العتق الجياد، ويجعل معها تبرا ذهبا غير جيدة، ويأخذ من صاحبه ذهبا كوفية قطعة، وتلك الكوفية مكروهة عند الناس، فيتبايعان ذلك مثلا بمثل: إن ذلك لا يصلح. وتفسير ما كره من ذلك، أن صاحب الذهب الجياد أخذ فضل عيون ذهبه في التبر الذي طرح مع ذهبه، ولولا فضل ذهبه على ذهب صاحبه، لم يراطله صاحبه بتبره ذلك إلى ذهبه الكوفية. {cite:muwatta-maruf-1997 p.165}"
