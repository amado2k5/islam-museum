label: { ar: "الموطأ 1861 — مالك: من راطل رجلا فأعطاه الذهب الجياد وجعل معها تبرا غير جيدة، وأخذ منه ذهبا كوفية مكروهة عند الناس، فلا يصلح، لأن صاحب الجياد أخذ فضل عيون ذهبه في التبر", en: "Muwatta 1861", es: "Muwatta 1861", fr: "Muwatta 1861", ur: "موطا 1861", tr: "El-Muvatta 1861 — Malik: Bir kimse bir adama iyi altın verip, onu kalitesiz altın külçeleriyle karıştırırsa ve ondan insanların hoşlanmadığı Kufi altını alırsa, bu caiz değildir; çünkü iyi altının sahibi, altın külçesi şeklinde en iyi altını almıştır.", id: "Al-Muwatta 1861 — Malik: Jika seseorang memberikan emas berkualitas baik kepada seseorang dan mencampurnya dengan emas batangan berkualitas rendah, lalu mengambil darinya emas Kufi yang tidak disukai orang, maka hal ini tidak diperbolehkan, karena pemilik emas berkualitas baik tersebut telah mengambil emas terbaiknya dalam bentuk batangan." }
summary:
  ar: "قال مالك في الرجل يراطل الرجل، ويعطيه الذهب العتق الجياد، ويجعل معها تبرا ذهبا غير جيدة، ويأخذ من صاحبه ذهبا كوفية قطعة، وتلك الكوفية مكروهة عند الناس، فيتبايعان ذلك مثلا بمثل: إن ذلك لا يصلح. وتفسير ما كره من ذلك، أن صاحب الذهب الجياد أخذ فضل عيون ذهبه في التبر الذي طرح مع ذهبه، ولولا فضل ذهبه على ذهب صاحبه، لم يراطله صاحبه بتبره ذلك إلى ذهبه الكوفية. {cite:muwatta-maruf-1997 p.165}"
  tr: "Malik, bir adamın bir başkasıyla takas anlaşması yapıp, ona saf, eski altın verip, buna biraz da kalitesiz altın külçesi eklemesi ve arkadaşından da Kufi altın (insanlar tarafından sevilmeyen bir tür Kufi altın) alması ve bu malları eşit miktarda takas etmeleri durumunda bunun caiz olmadığını söylemiştir. Bunun sevilmemesinin sebebi, saf altının sahibinin, altının kalitesine eklenen külçeye kendi altının üstün kalitesini de katmış olmasıdır. Eğer altının kalitesi arkadaşının altından üstün olmasaydı, arkadaşı Kufi altına o külçeyi ekleyerek takas anlaşması yapmazdı. {cite:muwatta-maruf-1997 s.165}"
  id: "Malik berkata mengenai seorang pria yang membuat perjanjian barter dengan orang lain, memberikan emas murni yang sudah tua dan menambahkan beberapa batangan emas berkualitas rendah, lalu mengambil dari temannya sepotong emas Kufi—jenis emas Kufi yang tidak disukai orang—dan mereka menukarkan barang-barang tersebut dengan jumlah yang sama: ini tidak diperbolehkan. Alasan mengapa hal itu tidak disukai adalah karena pemilik emas murni telah mengambil kualitas emasnya yang lebih unggul dalam batangan emas yang ditambahkan ke emasnya. Jika emasnya tidak lebih unggul dari emas temannya, temannya tidak akan membuat perjanjian barter dengan menambahkan batangan emas tersebut ke emas Kufinya. {cite:muwatta-maruf-1997 p.165}"
