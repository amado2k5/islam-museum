text: "… خمسا من المغنم فليس عطفا على قوله شهادة أن لا اله الا اللّٰه فانه يلزم منه أن يكون الاربع خمسا وانما هو عطف على قوله بأربع فيكون مضافا الى الأربع لا واحدا منها وان كان واحدا من مطلق شعب الايمان …"
