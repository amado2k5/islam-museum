label: { ar: "الموطأ 2148 — يحيى عن مالك: فيمن استهلك شيئا من الحيوان بغير إذن صاحبه، فعليه قيمته يوم استهلكه، وليس عليه أن يؤخذ بمثله من الحيوان، لأن القيمة أعدل في الحيوان والعروض", en: "Muwatta 2148", es: "Muwatta 2148", fr: "Muwatta 2148", ur: "موطا 2148", tr: "El-Muvatta 2148 — Yahya, Malik'ten rivayetle: Sahibinin izni olmadan hayvan tüketen kimse, tükettiği günkü bedelini ödemekle yükümlüdür ve hayvandan karşılığını almak zorunda değildir; çünkü hayvanlar ve mallar söz konusu olduğunda bedel daha adildir.", id: "Al-Muwatta 2148 — Yahya berdasarkan riwayat Malik: Mengenai orang yang memakan hewan tanpa izin pemiliknya, ia wajib membayar nilainya pada hari ia memakannya, dan ia tidak wajib mengambil bagian yang setara dari hewan tersebut, karena nilai lebih adil dalam kasus hewan dan barang." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا فيمن استهلك شيئا من الحيوان بغير إذن صاحبه: أن عليه قيمته يوم استهلكه، ليس عليه أن يؤخذ بمثله من الحيوان، ولا يكون له أن يعطي صاحبه فيما استهلك شيئا من الحيوان، ولكن عليه قيمته يوم استهلكه. القيمة أعدل ذلك فيما بينهما، في الحيوان والعروض. {cite:muwatta-maruf-1997 p.278}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Sahibinin izni olmadan bir hayvanı tüketen kimse hakkında hükmümüz şudur: Tükettiği günkü bedelini ödemek zorundadır. Başka bir hayvanla aynı miktarda bedel ödemek zorunda değildir, ne de sahibine tükettiği şeyin karşılığında bir şey vermekle yükümlüdür. Aksine, tükettiği günkü bedelini ödemek zorundadır. Hayvanlarda veya mallarda, değer daha adil olanıdır. {cite:muwatta-maruf-1997 s.278}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Hukum kami mengenai seseorang yang memakan hewan tanpa izin pemiliknya adalah bahwa ia harus membayar nilainya pada hari ia memakannya. Ia tidak wajib mengambil nilai setaranya dalam bentuk hewan lain, dan ia juga tidak berhak memberikan apa pun kepada pemiliknya sebagai imbalan atas apa yang telah ia konsumsi. Sebaliknya, ia harus membayar nilainya pada hari ia memakannya. Nilai adalah hal yang paling adil di antara kedua hal ini, baik dalam hal hewan maupun barang. {cite:muwatta-maruf-1997 p.278}"
