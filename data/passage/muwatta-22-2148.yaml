label: { ar: "الموطأ 2148 — يحيى عن مالك: فيمن استهلك شيئا من الحيوان بغير إذن صاحبه، فعليه قيمته يوم استهلكه، وليس عليه أن يؤخذ بمثله من الحيوان، لأن القيمة أعدل في الحيوان والعروض", en: "Muwatta 2148" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا فيمن استهلك شيئا من الحيوان بغير إذن صاحبه: أن عليه قيمته يوم استهلكه، ليس عليه أن يؤخذ بمثله من الحيوان، ولا يكون له أن يعطي صاحبه فيما استهلك شيئا من الحيوان، ولكن عليه قيمته يوم استهلكه. القيمة أعدل ذلك فيما بينهما، في الحيوان والعروض. {cite:muwatta-maruf-1997 p.278}"
