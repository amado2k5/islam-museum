text: |-
  • (با ب الواو والياء
  •ورى.
  ٥٦٠
  وخى أهذ أى سمتهم حيث ساروا وما أدرى أين وخى فلان أى أين وحه ووخت الناقة تخى
  وخيا أى سارت سير اقصدا وقال • يتبعن ونى عيمل نيساف • وواخاه لغة ضعيفة فى آخاه تبض
  على يواخى ووخيت مرضاتك أى تحريت وقصدت وتول استوخ لنابن فلان ما خبرهم أى
  تغيرهم وهذا الحرف هكذارواه أبو سعيدباظاء معجة ودى الودى بالتسكين ما يخرج
  بعد البول وكذلت الودى بالتشديد عن الاموى تقول منه ودى بغير ألف وودى الفرس يدى
  وديا اذا أدلى ليبول أوليضرب وقال اليزيدى ودى ايبول وأدلى لبضرب ولاتمل أودى
  والدية واحسدة الديات والهاءعوض من الواوتقول وديت القتيل أديه دية اذا أعطيت
  ديته واتديت أى أخذت ديته واذا أمرت.نه قلت دفلانا وللاثنين ديافلانا والمجماعة
  دوافلانا وأودى فلان أى هلك فهومود والودى على فعيل صغار الفسيل الوا-دودية
  والوادى مع روف ور بما ا تفوا بالكسرة عن الياءكما قال • قرقرقر الواد بالشاهق
  والجمع الاودية على مير قياس كانه جمع ودى" مثل سرى" وأسمرية للنهر وقول الشاعر
  فيهاسهام ينرب أوسهام الوادى • بعنى وادى القرى والتوادى اللخشبات التى نشد
  على خلف الناقة اذاصرت الواحدة تودية ⁦(وذا)⁩ يقال مابه وذية بالتسكيز أى عيب
  ابن السكيت ممعت غير واحد من الكلابيين يولون أصحت وليس بها وحصة وليس بها
  وذية أى برديعف البلاد والايام ورى) ورى القيح جوفه بريه وريا اكله وفى الحديث
  لأن يتلى جوف أحدكم فيحاحتى يريه وقال عبد بى الحسصاس
  وراهزّ ربى مثل ما قدور يذى • وأحى على أكبادهنّ المسكاويا
  وأنشد اليزيدىّ • قالت لهوريا اذاتهنح • تقول منسه ريارجل ور باللاثنين وللجماعة روا
  وللمرأة رى وهى ياء ضمير المؤنت مشل قومى واقعدى وللمرأتين ريا وللنسارين والاسم
  الورى باتصريك الفراءية ال سلط اللّٰه عليه الورى وحى خييرا والورى أيضا الخلق يقال
  ما أدرى أى الورى ه وأى أىّ الخلق هو قال ذوالرقة .
  وكاثن ذعرنا من مهاة ورامح • بلاد الورى لي-ت له بيلاد
  وورى الزند بالفتح يرى وريا اذا خرجت ناره وفيه لغة أخرى ورى الانديرى بالسكسر فيهما
  وأوريته أنا وكذلك وريته تورية وفلان يستورى زناد الخلالة ويقال أيضاودى المخ يرى اذ!
  اكتنزوناقة وارية أى سمينة وقال • يأكان من لحم السديف الوارى ولحم ورى على
  فعيل أى سمين ويقال ورى الجرح سابره تورية أصابه الورى قال العجاج
  عن قلب ضجم تورى من سبر •كأنه يعدى من عفامه ونفور النفس عنه وواريت الشئ أى
  أخضته وتوارى هو أى استر ووراء بمعى خاف وقد يكون ؟عنى قدام وهمن الاضداد
  قال الاخفس يقسال لقيته من وراء فترة حه على الغاية اذا كان غير مضاف تجعله امما وهو؛
  غيره تمكن كفولك من قبل ومن بعد وأنشد
  اذا أنا لم أو من عليك ولم يكن • لتاؤل الامن وراءورا.
  وقوله-م وراه لمه أوسع لك نسب بالفعل المقدروهو تأخروقوه تعالى وكان وراءهسم ملا أى
  أمامهم وتصغير هاور يثة بالهاءوهى شاذة والورالأيضا ولد الولدوتول وريت الخبرتورية
  ضاح
