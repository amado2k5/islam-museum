text: "… المؤذن يشهد له كل رطب ويابس سمعه المؤذن يُغفر له مد صوته ويصدقه من سمعه من رطب ويابس... المؤذنون أمناء المسلمين، والأئمة ضمناء... المؤمن لا ينجس المؤمن يوم الجمعة كهيئة المحرم لا يأخذ من شعره المؤمنون كرجل واحد إن اشتكى …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 3، ص 245، يذكر مَثَل المؤمن، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 3, p. 245, that mentions the likeness of the believer, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 3، ص 245 کا اقتباس جس میں مومن کی مثال، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 3, pág. 245, que menciona la semejanza del creyente y su descripción; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
