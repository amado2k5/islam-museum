label: { ar: "سنن النسائي 5028 — تعريف الإسلام بأعماله، الصلاة والزكاة والصوم والحج مجتمعة", en: "Sunan al-Nasa'i 5028 — Islam defined by its acts; the prayer, the zakat, the fast and the pilgrimage named together", ur: "سنن نسائی 5028 — اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Sunan al-Nasa'i 5028 — El Islam definido por sus actos; la oración, el zakat, el ayuno y la peregrinación mencionados juntos.", fr: "Sunan al-Nasa'i 5028 — L'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage sont cités ensemble.", tr: "Sunan an-Nasa'i 5028 — İslam'ı ibadetleriyle tanımlamak: namaz, zekât, oruç ve Hac bir arada.", id: "Sunan an-Nasa'i 5028 — Mendefinisikan Islam melalui amalan-amalannya: salat, zakat, puasa, dan haji secara gabungan." }
text: "… ثَائِرَ الرَّأْسِ يُسْمَعُ دَوِيُّ صَوْتِهِ وَلَا يُفْهَمُ مَا يَقُولُ حَتَّى دَنَا فَإِذَا هُوَ يَسْأَلُ عَنْ الْإِسْلَامِ قَالَ لَهُ رَسُولُ اللَّهِ خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ وَاللَّيْلَةِ قَالَ هَلْ عَلَيَّ غَيْرُهُنَّ قَالَ لَا إِلَّا أَنْ تَطَوَّعَ قَالَ رَسُولُ اللَّهِ وَصِيَامُ شَهْرِ رَمَضَانَ قَالَ هَلْ عَلَيَّ غَيْرُهُ قَالَ لَا إِلَّا أَنْ تَطَوَّعَ وَذَكَرَ لَهُ رَسُولُ اللَّهِ الزَّكَاةَ فَقَالَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 5028، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5028 (The Book Of Faith and its Signs), that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5028، جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5028 (El Libro de la Fe y sus Signos), menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5028 (Le Livre de la Foi et ses Signes), mentionne l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage. Le moteur de recherche « Piliers et Branches de la Foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sunan-ı Nesai'de yer alan 5028 numaralı hadis, namaz, zekât, oruç ve Hac gibi çeşitli ibadetler aracılığıyla İslam'ı tanımlar. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde bir araya getiren bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5028, mendefinisikan Islam melalui berbagai amalan, termasuk salat, zakat, puasa, dan haji. Hadits ini disusun oleh seorang peneliti yang mengumpulkan rukun Islam, pilar-pilar iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, semuanya dalam empat kategori ini."
