text: "… من الأخف إلى الأثقل، وكذلك رياضةُ اللسان في الكلام، وكذلك رياضة البصر، وكذلك رياضة المشي بالتدريج شيئاً فشيئاً. وأما ركوب الخيل، ورمي النشاب، والصراع، والمسابقة على الأقدام، فرياضة للبدن كله، وهي قالعة لأمراض مزمنة، كالجُذام والاستسقاء، والقولنج. رياضة النفوس ورياضة …"
