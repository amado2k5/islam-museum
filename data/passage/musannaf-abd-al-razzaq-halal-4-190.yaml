text: "… رَجُلًا سَأَلَ عُمَرَ عَنْ بَيْضِ النَّعَامِ يُصِيبُهُ الْمُحْرِمُ، فَقَالَ لَهُ عُمَرُ أَرَأَيْتَ عَلِيًّا فَاسْأَلْهُ، فَإِنَّا قَدْ أُمِرْنَا أَنْ نُشَاوِرَهُ. • عبد الرزاق، عَنْ هُشَيْمِ، عَنْ خَالِدٍ، عَنِ ابْنِ سِيرِينَ قَالَ : قَضَىٰ فِي حَرَامٍ أَشَارَ إِلَىٰ حَلَالٍ بِبَيْضِ نَعَامٍ، فَقَضَىٰ …"
