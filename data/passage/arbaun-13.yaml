text: "لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه"
summary:
  ar: "حديث أنس بن مالك، وهو الحديث الثالث عشر في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري (13) ومسلم (45) من رواية قتادة عن أنس، ولفظ مسلم «حتى يحب لجاره أو لأخيه» بالشك، وله طرق كثيرة عند أحمد وابن ماجه والترمذي والنسائي وابن حبان وغيرهم؛ وعند ابن حبان «لا يبلغ عبد حقيقة الإيمان حتى يحب للناس ما يحب لنفسه من الخير»، وهي تبين عند ابن رجب أن المراد بنفي الإيمان نفي بلوغ حقيقته ونهايته، فإن الإيمان يُنفى كثيراً لانتفاء بعض أركانه وواجباته كقوله «لا يزني الزاني حين يزني وهو مؤمن»؛ ويذكر ابن رجب أن العلماء اختلفوا في مرتكب الكبائر هل يسمى مؤمناً ناقص الإيمان أم مسلماً لا مؤمناً على قولين وهما روايتان عن أحمد، وأن مرتكب الصغائر لا يزول عنه اسم الإيمان بالكلية، وأن قول «مؤمن ناقص الإيمان» مروي عن جابر بن عبد الله وهو قول ابن المبارك وإسحاق وأبي عبيد، والقول الآخر مروي عن محمد بن علي وذكر بعضهم أنه المختار عند أهل السنة ⁦(جامع العلوم والحكم ص 282–290)⁩."
  en: "Anas ibn Malik's hadith, the thirteenth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (13) and Muslim (45) through Qatada from Anas, Muslim's wording running 'until he loves for his neighbour or his brother' with a narrator's doubt, with many further routes in Ahmad, Ibn Majah, al-Tirmidhi, al-Nasa'i, Ibn Hibban and others; Ibn Hibban's version 'no servant reaches the reality of iman until he loves for people what he loves for himself of good' shows, in Ibn Rajab's reading, that the negation of iman here means negation of attaining its reality and perfection — iman being often negated for the absence of some of its pillars and duties, as in 'the adulterer is not a believer while he commits adultery'; Ibn Rajab records the scholars' dispute over the grave-sinner — 'believer of deficient faith' or 'Muslim but not believer', both reported from Ahmad — while the name iman is never fully stripped for lesser sins, noting that 'believer of deficient faith' is reported from Jabir ibn Abdullah and is the position of Ibn al-Mubarak, Ishaq and Abu Ubayd, the alternative being reported from Muhammad ibn Ali and described by some as the choice of ahl al-sunna (Jami' al-Ulum wal-Hikam pp. 282–290)."
  es: "El hadiz de Anas ibn Malik, el decimotercero de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Bujari (13) y Muslim (45) a través de Qatada de Anas, la redacción de Muslim continúa 'hasta que ame para su prójimo o su hermano' con una duda del narrador, con muchas otras rutas en Ahmad, Ibn Majah, al-Tirmidhi, al-Nasa'i, Ibn Hibban y otros; la versión de Ibn Hibban 'ningún siervo alcanza la realidad del iman hasta que ama para la gente lo que ama para sí mismo del bien' muestra, en la lectura de Ibn Rajab, que la negación del iman aquí significa la negación de alcanzar su realidad y perfección; el iman a menudo se niega por la ausencia de algunos de sus pilares y deberes, como en 'el adúltero no es creyente mientras comete adulterio'; Ibn Rajab registra la disputa de los eruditos sobre el pecador grave: \"creyente de fe deficiente\" o \"musulmán pero no creyente\", ambos reportados por Ahmad, mientras que el nombre iman nunca se elimina por completo para pecados menores, señalando que \"creyente de fe deficiente\" se reporta en Jabir ibn Abdullah y es la posición de Ibn al-Mubarak, Ishaq y Abu Ubayd, siendo la alternativa reportada por Muhammad ibn Ali y descrita por algunos como la elección de ahl al-sunna (Jami' al-Ulum wal-Hikam pp. 282-290)."
  fr: "Le hadith d'Anas ibn Malik, le treizième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Bukhari (13) et Muslim (45) par Qatada d'Anas, la formulation de Muslim allant « jusqu'à ce qu'il aime pour son prochain ou son frère » avec un doute du narrateur, avec de nombreuses autres voies chez Ahmad, Ibn Majah, al-Tirmidhi, al-Nasa'i, Ibn Hibban et autres; la version d'Ibn Hibban « aucun serviteur n'atteint la réalité de l'iman tant qu'il n'aime pas pour les gens ce qu'il aime pour lui-même du bien » montre, dans la lecture d'Ibn Rajab, que la négation de l'iman ici signifie la négation d'atteindre sa réalité et sa perfection — l'iman étant souvent nié pour l'absence de certains de ses piliers et devoirs, comme dans « l'adultère n'est pas croyant tant qu'il commet l'adultère »; Ibn Rajab relate la dispute des savants au sujet du pécheur grave — « croyant à la foi déficiente » ou « musulman mais non croyant », deux expressions rapportées d'Ahmad — tandis que le terme iman n'est jamais complètement abandonné pour les péchés mineurs, notant que « croyant à la foi déficiente » est rapporté de Jabir ibn Abdullah et constitue la position d'Ibn al-Mubarak, d'Ishaq et d'Abu Ubayd, l'alternative étant rapportée de Muhammad ibn Ali et décrite par certains comme le choix des ahl al-sunna (Jami' al-Ulum wal-Hikam pp. 282–290)."
  ur: "انس بن مالک کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی تیرھویں؛ البخاری (13) اور مسلم (45) نے قتادہ کے ذریعے انس سے نقل کیا ہے، مسلم کا قول 'جب تک کہ وہ اپنے پڑوسی یا اپنے بھائی سے محبت نہ کرے' راوی کے شک کے ساتھ چل رہا ہے، احمد، ابن ماجہ، الترمذی، النسائی، ابن حبان اور دیگر میں بہت سے مزید راستوں کے ساتھ؛ ابن حبان کا قول 'کوئی بندہ اس وقت تک ایمان کی حقیقت تک نہیں پہنچ سکتا جب تک کہ وہ لوگوں کے لیے وہی پسند نہ کرے جو وہ اپنے لیے پسند کرتا ہے' ابن رجب کی تلاوت سے معلوم ہوتا ہے کہ یہاں ایمان کی نفی سے مراد اس کی حقیقت اور کمال تک پہنچنے کی نفی ہے - ایمان کے بعض ارکان اور فرائض کی عدم موجودگی کی وجہ سے اکثر اس کی نفی کی جاتی ہے جب کہ وہ زنا کا مرتکب نہیں ہوتا۔ ابن رجب نے علمائے کرام کا قبر گنہگار کے بارے میں تنازعہ درج کیا ہے - 'کم ایمان والا مومن' یا 'مسلمان لیکن مومن نہیں'، دونوں احمد سے روایت کرتے ہیں - جبکہ ایمان کا نام چھوٹے گناہوں کے لیے کبھی بھی مکمل طور پر ختم نہیں کیا جاتا ہے، یہ نوٹ کرتے ہوئے کہ 'کمزور ایمان والا' جابر بن عبداللہ سے روایت کیا گیا ہے اور ابن عباس اور ابن عباس اور ابن عباس کا متبادل ہے۔ محمد ابن علی سے اور بعض لوگوں نے اسے اہل السنہ کا انتخاب قرار دیا ہے ⁦(جامع العلوم والحکم صفحہ 282-290)⁩۔"
  tr: "Enes bin Malik hadisi, El-Arba'in el-Nawawiyyah'da on üçüncü hadis olup İbn Receb'in şerhinde de yer almaktadır; Buhari (13) ve Müslim (45) tarafından Katade'den, o da Enes'ten rivayet edilmiştir ve Müslim'in ifadesi \"komşusunu veya kardeşini sevinceye kadar\" şeklindedir, şüpheyle birlikte. Ahmed, İbn Mâce, Tirmizi, Nesai, İbn Hibban ve diğerleriyle birçok rivayet zinciri vardır; İbn Hibban'da ise \"Bir kul, kendisi için sevdiği iyiliği başkaları için de sevinceye kadar imanın gerçekliğine ulaşmış sayılmaz\" şeklindedir. İbn Receb'de ise imanın inkârından kastedilenin, imanın gerçekliğine ve amacına ulaşmanın inkârı olduğu belirtilmiştir; zira iman, çoğu zaman bazı şart ve yükümlülüklerinin yokluğundan dolayı inkâr edilir, örneğin \"Zina eden, mümin iken zina etmiş sayılmaz\" sözünde olduğu gibi. İbn Receb, büyük günah işleyenin, imanı eksik mümin mi yoksa mümin olup da mümin olmayan mı olarak nitelendirileceği konusunda, Ahmed'den rivayet edilen iki farklı görüşe dayanarak, âlimler arasında görüş ayrılığı olduğunu belirtir. Ayrıca, küçük günah işleyenin imanını tamamen kaybetmediğini ve \"imanı eksik mümin\" ifadesinin Cabir bin Abdullah'tan rivayet edildiğini ve bunun İbn Mübarek, İshak ve Ebu Ubeyd'in görüşü olduğunu ifade eder. Diğer görüş ise Muhammed bin Ali'den rivayet edilmiştir ve bazı kaynaklar bunun Sünniler arasında daha yaygın görüş olduğunu belirtmiştir (Cami' el-Ulum ve el-Hikam, s. 282-290)."
  id: "Hadits Anas bin Malik, yang merupakan hadits ketiga belas dalam Al-Arba’in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Al-Bukhari (13) dan Muslim (45) dari Qatadah dari Anas, dan redaksi Muslim adalah “sampai ia mencintai tetangganya atau saudaranya” dengan ragu-ragu, dan hadits ini memiliki banyak sanad dengan Ahmad, Ibn Majah, Al-Tirmidhi, Al-Nasa’i, Ibn Hibban dan lainnya; dan dengan Ibn Hibban disebutkan “Seorang hamba tidak mencapai hakikat iman sampai ia mencintai kebaikan untuk orang lain sebagaimana ia mencintai kebaikan untuk dirinya sendiri,” dan hal ini menunjukkan dalam Ibn Rajab bahwa yang dimaksud dengan negasi iman adalah negasi dari pencapaian hakikat dan tujuannya, karena iman seringkali dinegasi karena tidak adanya beberapa rukun dan kewajibannya, seperti dalam sabdanya, “Orang yang berzina tidak berzina ketika ia masih beriman.” Ibn Rajab menyebutkan bahwa para ulama berbeda pendapat mengenai apakah orang yang melakukan dosa besar disebut sebagai orang beriman dengan iman yang belum sempurna atau seorang Muslim tetapi bukan orang beriman, berdasarkan dua pendapat, yang merupakan dua riwayat dari Ahmad. Ia juga menyatakan bahwa orang yang melakukan dosa kecil tidak kehilangan nama iman sepenuhnya, dan bahwa pernyataan \"orang beriman dengan iman yang belum sempurna\" diriwayatkan dari Jabir bin Abdullah, dan itu adalah pendapat Ibn al-Mubarak, Ishaq, dan Abu Ubaid. Pendapat lain diriwayatkan dari Muhammad bin Ali, dan sebagian dari mereka menyebutkan bahwa itu adalah pendapat yang lebih disukai di kalangan Sunni (Jami’ al-‘Ulum wa al-Hikam, hlm. 282–290)."
