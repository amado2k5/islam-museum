text: "… بفتح للام على أن المراد اللوح واحد الألواح؛ سمى بذلك لأن المعانى تلوحُ بالكتَابة فيه ؛ ثم أختلفوا : فقرأ نافع برفع محفوظ على أنه نعت للقرءان بتقدير بل هو قرءان مجيد محفوظ فى لوحٍ، وصفه بالحفظ لحفظه عن التغيير …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 3، ص 472، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 3, p. 472, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 3، ص 472 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Subh al-A'sha de al-Qalqashandi, volumen 3, pág. 472, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 3, p. 472) mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin Resimli Cilt 3, s. 472'sinden, Kur'an okunuşlarını belirten bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Subh al-A'sha karya al-Qalqashandi, Jilid Bergambar 3, hlm. 472, yang menyebutkan bacaan Al-Quran; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
