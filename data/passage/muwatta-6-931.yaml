text: "أهل من الجعرانة بعمرة"
summary:
  ar: "بلاغ يرويه مالك أن رسول الله أهل من الجعرانة بعمرة. ويذكر المحقق أن ابن عبد البر قال إنه إنما يحفظ هذا مسنداً من حديث محرش الكعبي الخزاعي، وأن الحديث صحيح من رواية أهل مكة، وأن الترمذي (935) قال إنه حسن غريب. {cite:muwatta-maruf-1997 p.446}"
