  العقيلى يقال للرجل الكثير الشحم انه لباجل وكذلات الناقة والإل وشيخ بجال وبجيل أى
  جسيم وقال أبو عمر والبجال الرجل النيخ السيد قال زهيم
  الموت خير للفثى* فليهل كن وبه بقبه • من أثيرى الشيخ البها*ل يقاديم دى بالعشي
  جعل قوله يهدى الاليقاد كانه قال مهديا ولولاذلل لقال ويم دى بالواوو بجل الشئء أى
  كفاء ومنه قول الكميت• ومن عنده الصدر المبجل * والتجبيل التعظيم وبجل بمعنى حسب
  قال الاخفش هى ساكنة أبداية ولون يجلك كما يقولون قطسك الا أنه-م لاية ولون بجلنى كما
  يقولون قطنى وا-كن يقولون يجلى وبجلى أى حسبى قال لبيد
  فتى أهلك فلا أحفله • يجلى الان من العيشر بجل
  حدل بحدل اسم رجل ( حظل حظل الرجل بحظلة وهو أن يقفزقفزان اليربوع
  والفأرة والظاءمعجمة خل البخل والبخل بالفتح عن الكسائى والبخل بالتحريك كله؟نى
  وقد يخل الرجل بكذا فهو باخل وبخيل وأبخلته أى وجدته يخيلا وبخلته أى نسبته الى البغل
  ويقال الولد متخلة مجبنة والبخال الشديد البخل قال رؤية * فد اليخال أروز الارز•
  دل البديل البدل وبدل الشى غيره يقال بدل ويدل لغتان-ثل شبه وشبه ومثل ومثل
  ونكل ون-كل قال أيو عبيد ولم يسمع فى فعل وفعل غيرهذه الاربعة الإحرف والبدل وجع
  فى اليدين والرجلين وقد بدل بالكسر ييدل بدلا وأبدات الشئ بغسيره وبدله اللّٰه من اللحوف
  أمفا وتديل الشى أيضاتغييره وان لم يأت يدل واستبدل الشى بغيره وتبتله به اذا أخذه
  مكانه والمبادة التبادل والابدال قوم من الصالحين لا تخلو الدنيامنهم اذامات واحد آبدل
  اللّٰه مكانه با خر قال ابن دريد الواحد يديل بذل) بذلت الشى أبذله بذلا أى أعطية
  وجدت به والبذلة والمبذلة مايمتهن من الثياب يقال جاهنافلان فى مباذله أى فى ثساب بذلته
  واستذال الثوب وغيرء امتهانه والتبذل تزل التصاون ( رل البرائل عفرة الديك
  والحبارى وغيرهما وهوالريش الذى يستدير فى عنقه قال اراجز ١
  ولا يزال خرب مقنع * برائلام والجناح بلع
  وتقدبر أل الديك برألة اذا ئفش برائله طل البرطيل حجر طويل واجمع براطيل وقال
  ضبر براطيل الى جلامدا * والبرظل بالضم قانسوة ور بماشقد ⁦( برغل)⁩ البرغيل واحد
  البراغيل قال أبو عبيدهى البلاد التى بين الريف والبر مثل الانبار والقادسية ونحوها
  بزل ). يزل البعبر يبزل بز ولا فطرتابه أى اتشق فهو بازل ذكزا كان أو أننى وذلك فى السنه
  القاسعة وربمايزل فى السنة الشامنة والجمع بزل وبزل وبوازل والبازل أيضااسم (ل-ن التى
  طلعت وبزات الشراب وشيحة بازلة سال دمها وتيزل أى تشقق ومة. قول زهير ٣
  تبزل ما بين العشير الدم • وانيزل الطلع أى انشق وقواهسم ما بقيت لهم بازلة كمايقال
  ما بقيت اه-م ناغية ولا راغية أى واحدة قال يعقوب ماعنده بازلة أى ليس عندشئمر
  مال ولا ترل اللّٰه عنده يازلة ولم يعظهم بازلة أى شيأ وأمرذو بزل أى ذوشدّة قال عمروبن
  شاس يقلة ن رأس المكوكب الفخم بعدما • تدوررحى الالهاء فى الاحرذى اليزل
  والمبزل مليصفى به الشراب والبزلاء الرأى الجيدة قال الشاعر
  قوله وبرات الشراب سكذا
  فى جيع النسخ التى بأيدينا
  ومبارة القاموس وبزل الشراب
  صفاهاه-
  تداركما عب..اوذبيان بعدما اه
