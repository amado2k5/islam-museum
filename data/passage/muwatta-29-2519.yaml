summary:
  ar: "قال مالك في العبد إذا كُسرت يده أو رجله ثم صح كسره: فليس على من أصابه شيء، فإن أصاب كسره ذلك نقص أو عيب، كان على من أصابه قدر ما نقص من ثمن العبد. {cite:muwatta-maruf-1997 p.434}"
