label: { ar: "الموطأ 2519 — مالك: كسر يد العبد أو رجله إذا صح فلا شيء عليه إلا إن نقص", en: "Muwatta 2519", es: "Muwatta 2519", fr: "Muwatta 2519", ur: "موطا 2519", tr: "El-Muvatta 2519 — Malik: Bir kölenin eli veya ayağı kırılırsa ve kendisi sağlıklıysa, hasar görmedikçe ona bir ceza verilmez.", id: "Al-Muwatta 2519 — Malik: Jika tangan atau kaki seorang budak patah, dan dia sehat, maka tidak ada hukuman baginya kecuali jika bagian tersebut mengalami kerusakan." }
summary:
  ar: "قال مالك في العبد إذا كُسرت يده أو رجله ثم صح كسره: فليس على من أصابه شيء، فإن أصاب كسره ذلك نقص أو عيب، كان على من أصابه قدر ما نقص من ثمن العبد. {cite:muwatta-maruf-1997 p.434}"
  tr: "Malik, eli veya bacağı kırılan ve sonra iyileşen bir köle hakkında şunları söylemiştir: Yaralanmaya neden olan kişi hiçbir şeyden sorumlu değildir. Ancak, kırık bir kusura veya lekeye yol açmışsa, buna neden olan kişi kölenin değerindeki azalma miktarı kadar sorumludur. {cite:muwatta-maruf-1997 s.434}"
  id: "Malik berkata mengenai seorang budak yang tangan atau kakinya patah lalu sembuh: orang yang menyebabkan cedera tersebut tidak bertanggung jawab atas apa pun. Namun, jika patah tulang tersebut mengakibatkan cacat atau kerusakan, orang yang menyebabkannya bertanggung jawab atas penurunan nilai budak tersebut. {cite:muwatta-maruf-1997 p.434}"
