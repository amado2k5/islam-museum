label: { ar: "الموطأ 1309 — مالك في أم ولد رجل حازها المشركون ثم غنمها المسلمون وقسمت: لا تسترق، ويفتديها الإمام أو سيدها", en: "Muwatta 1309", es: "Muwatta 1309", fr: "Muwatta 1309", ur: "موطا 1309", tr: "El-Muvatta 1309 — Malik, müşrikler tarafından esir alınan ve Müslümanlar arasında paylaştırılan, bir erkekten doğmuş bir cariye hakkında şöyle demiştir: \"O cariye köleleştirilemez; ya imam ya da efendisi onu fidye karşılığında kurtarmalıdır.\"", id: "Al-Muwatta 1309 — Malik berkata mengenai seorang budak perempuan yang lahir dari seorang laki-laki kemudian ditangkap oleh kaum musyrik dan dibagi-bagikan di antara kaum Muslimin: Ia tidak boleh diperbudak, dan Imam atau tuannya harus menebusnya." }
summary:
  ar: "يقول مالك في أم ولد رجل من المسلمين، حازها المشركون، ثم غنمها المسلمون، فقسمت في المقاسم، ثم عرفها سيدها بعد القسم، إنها لا تسترق، ويرى أن يفتديها الإمام لسيدها، فإن لم يفعل فعلى سيدها أن يفتديها ولا يدعها. ولا يرى لمن صارت له أن يسترقها ويستحل فرجها، وإنما هي بمنزلة الحرة. {cite:muwatta-maruf-1997 p.584}"
  tr: "Malik, müşrikler tarafından esir alınan, daha sonra Müslümanlar tarafından savaş ganimeti olarak ele geçirilen ve ganimetler arasında paylaştırılan, ardından efendisi tarafından tanınan bir Müslüman erkeğin cariyesi hakkında, onun köleleştirilmemesi gerektiğini söyler. Ona göre İmam, efendisi için onu fidye ile kurtarmalıdır; eğer bunu yapmazsa, efendisi onu fidye ile kurtarmalı ve onu bırakmamalıdır. Ona sahip olanın onu köleleştirme ve onunla cinsel ilişkiye girme hakkına sahip olduğuna inanmaz; aksine, o özgür bir kadın olarak kabul edilir. {cite:muwatta-maruf-1997 s.584}"
  id: "Malik mengatakan mengenai seorang budak perempuan Muslim yang ditangkap oleh kaum politeis, kemudian direbut oleh kaum Muslim sebagai rampasan perang dan dibagi di antara rampasan tersebut, dan kemudian tuannya mengenalinya setelah pembagian itu, bahwa ia tidak boleh diperbudak. Ia percaya bahwa Imam harus menebusnya untuk tuannya, dan jika ia tidak melakukannya, maka tuannya harus menebusnya dan tidak meninggalkannya. Ia tidak percaya bahwa siapa pun yang memilikinya berhak untuk memperbudaknya dan melakukan hubungan seksual dengannya; sebaliknya, ia dianggap seperti wanita merdeka. {cite:muwatta-maruf-1997 p.584}"
