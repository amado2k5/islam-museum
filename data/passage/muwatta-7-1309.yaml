label: { ar: "الموطأ 1309 — مالك في أم ولد رجل حازها المشركون ثم غنمها المسلمون وقسمت: لا تسترق، ويفتديها الإمام أو سيدها", en: "Muwatta 1309" }
summary:
  ar: "يقول مالك في أم ولد رجل من المسلمين، حازها المشركون، ثم غنمها المسلمون، فقسمت في المقاسم، ثم عرفها سيدها بعد القسم، إنها لا تسترق، ويرى أن يفتديها الإمام لسيدها، فإن لم يفعل فعلى سيدها أن يفتديها ولا يدعها. ولا يرى لمن صارت له أن يسترقها ويستحل فرجها، وإنما هي بمنزلة الحرة. {cite:muwatta-maruf-1997 p.584}"
