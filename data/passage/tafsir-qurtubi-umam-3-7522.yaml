text: "… منْ أَهْل الكتاب يعني اليهود والنصارى. والمُشْرِكِينَ في موضع جر عطفا على أهل الكتاب. قال أبن عباس: أهلُ الكتابِ : اليهود الذين كانوا بيثرِب، وهم قُرَيظَة والنَّضِير وبنو قَيْنُقاع. والمشركون: الذين كانوا بمكة وحولها، والمدينة والذين حولها؛ وهم مشركو قريش. …"
