text: "… موت مالك بن دينار؟ قال: أنا كنت سببه، سألته عن رؤيا رأى فيها مسلم بن يسار؟ فقصها علي فانتفضتُ، فجعل يشهق ويضطرب حتى ظننت أن كبده قد تقطعت في جوفه، ثم هدأ فحملناه إلى بيته، فلم يزل مريضاً يعوده إخوانه …"
