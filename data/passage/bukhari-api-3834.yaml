label: { ar: "صحيح البخاري 3834 — ما لا يحل", en: "Sahih al-Bukhari 3834 — what is not lawful", ur: "صحیح بخاری 3834 — جو حلال نہیں", es: "Sahih al-Bukhari 3834 — lo que no es lícito", fr: "Sahih al-Bukhari 3834 — ce qui n'est pas licite", tr: "Sahih el-Buhari 3834 — İzin verilmeyen şeyler", id: "Sahih al-Bukhari 3834 — Apa yang tidak diperbolehkan" }
text: "… لَهَا زَيْنَبُ، فَرَآهَا لاَ تَكَلَّمُ، فَقَالَ مَا لَهَا لاَ تَكَلَّمُ قَالُوا حَجَّتْ مُصْمِتَةً. قَالَ لَهَا تَكَلَّمِي، فَإِنَّ هَذَا لاَ يَحِلُّ، هَذَا مِنْ عَمَلِ الْجَاهِلِيَّةِ. فَتَكَلَّمَتْ، فَقَالَتْ مَنْ أَنْتَ قَالَ امْرُؤٌ مِنَ الْمُهَاجِرِينَ. قَالَتْ أَىُّ الْمُهَاجِرِينَ قَالَ مِنْ قُرَيْشٍ. قَالَتْ مِنْ أَىِّ قُرَيْشٍ أَنْتَ قَالَ إِنَّكِ لَسَئُولٌ أَنَا أَبُو بَكْرٍ. قَالَتْ مَا بَقَاؤُنَا عَلَى هَذَا الأَمْرِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3834، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 3834 (Merits of the Helpers in Madinah (Ansaar)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 3834، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 3834 (Méritos de los Ayudantes en Medina (Ansar)), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 3834 (Mérites des Compagnons de Médine), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 3834 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3834, menyebutkan apa yang dilarang. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
