text: "… في كتاب الخندق: حدثني يحيى بن أبي معاوية بن خلف بن ربيعة، عن أبيه: حدثني الوليد بن سليمان، قال: كان أكدر علويًّا، وكان ذَا دِين وفضل وفِقه في الدين، وجالس الصحابة، وروى عنهم؛ وهو صاحبُ الفريضة التي تسمَّى الأكْدَرِيّة، وكان …"
