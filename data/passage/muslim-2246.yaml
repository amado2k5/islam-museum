ref: "2246"
label:
  ar: "مسلم 2246 — يؤذيني ابن آدم يسب الدهر وأنا الدهر"
  en: "Muslim 2246 — The son of Adam wrongs Me by cursing time, and I am time"
  ur: "مسلم 2246 — ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں"
  es: "Musulmán 2246 — El hijo de Adán me ofende maldiciendo al tiempo, y yo soy el tiempo."
  fr: "Muslim 2246 — Le fils d'Adam M'offense en maudissant le temps, et Je suis le temps"
text: "قال الله عز وجل يسب ابن آدم الدهر وأنا الدهر بيدي الليل والنهار ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2246: يؤذيني ابن آدم يسب الدهر وأنا الدهر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2246: The son of Adam wrongs Me by cursing time, and I am time. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2246: ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2246: El hijo de Adán me ofende maldiciendo al tiempo, y yo soy el tiempo. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2246: « Le fils d’Adam M’offense en maudissant le temps, alors que Je suis le temps. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
