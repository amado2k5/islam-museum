label: { ar: "صحيح البخاري 4409 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 4409 — what was left behind: estate and inheritance", ur: "صحیح بخاری 4409 — ترکہ اور میراث", es: "Sahih al-Bukhari 4409 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 4409 — Ce qui a été laissé derrière: biens et héritage" }
text: "… بِثُلُثَىْ مَالِي قَالَ \" لاَ \". قُلْتُ أَفَأَتَصَدَّقُ بِشَطْرِهِ قَالَ \" لاَ \". قُلْتُ فَالثُّلُثِ قَالَ \" وَالثُّلُثُ كَثِيرٌ، إِنَّكَ أَنْ تَذَرَ وَرَثَتَكَ أَغْنِيَاءَ خَيْرٌ مِنْ أَنْ تَذَرَهُمْ عَالَةً يَتَكَفَّفُونَ النَّاسَ، وَلَسْتَ تُنْفِقُ نَفَقَةً تَبْتَغِي بِهَا وَجْهَ اللَّهِ إِلاَّ أُجِرْتَ بِهَا، حَتَّى اللُّقْمَةَ تَجْعَلُهَا فِي فِي امْرَأَتِكَ \". قُلْتُ يَا رَسُولَ اللَّهِ آأُخَلَّفُ بَعْدَ أَصْحَابِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4409، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4409 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4409، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4409 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un récit du Sahih al-Bukhari, n° 4409 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
