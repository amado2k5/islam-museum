label: { ar: "الموطأ 318 — زيد بن خالد يرمق صلاة النبي بالليل: ثلاث عشرة ركعة", en: "Muwatta 318" }
text: "لأرمقن الليلة صلاة رسول الله"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن أبيه أن عبد الله بن قيس بن مخرمة أخبره عن زيد بن خالد الجهني، في باب صلاة النبي في الوتر: عزم زيد أن يرقب صلاة النبي ليلة فتوسد عتبته أو فسطاطه، فقام النبي فصلى ركعتين طويلتين، ثم ركعتين دون اللتين قبلهما، وهكذا خمس مرات كل ركعتين دون اللتين قبلهما، ثم أوتر، فتلك ثلاث عشرة ركعة. ويبين المحقق أن يحيى قال «طويلتين طويلتين» وأسقط ذكر الركعتين الخفيفتين اللتين كان يفتتح بهما، وأن سائر رواة الموطأ قالوا: فصلى ركعتين خفيفتين ثم صلى ركعتين طويلتين طويلتين طويلتين، وأن ابن عبد البر عدّ إسقاط يحيى خطأً واضحاً (التمهيد 17/287–288)؛ ويخرّجه عند مسلم (2/183) وأبي داود (1366) وابن ماجه (1362) والترمذي في الشمائل والنسائي وابن حبان من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.179} {cite:muwatta-maruf-1997 p.180}"
