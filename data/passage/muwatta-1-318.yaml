label: { ar: "الموطأ 318 — زيد بن خالد يرمق صلاة النبي بالليل: ثلاث عشرة ركعة", en: "Muwatta 318", es: "Muwatta 318", fr: "Muwatta 318", ur: "موطا 318", tr: "El-Muvatta 318 — Zeyd ibn Halid, Peygamberimizin gece namazını kılıyor: on üç rekat", id: "Al-Muwatta 318 — Zayd ibn Khalid melaksanakan salat malam Nabi: tiga belas rakaat" }
text: "لأرمقن الليلة صلاة رسول الله"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن أبيه أن عبد الله بن قيس بن مخرمة أخبره عن زيد بن خالد الجهني، في باب صلاة النبي في الوتر: عزم زيد أن يرقب صلاة النبي ليلة فتوسد عتبته أو فسطاطه، فقام النبي فصلى ركعتين طويلتين، ثم ركعتين دون اللتين قبلهما، وهكذا خمس مرات كل ركعتين دون اللتين قبلهما، ثم أوتر، فتلك ثلاث عشرة ركعة. ويبين المحقق أن يحيى قال «طويلتين طويلتين» وأسقط ذكر الركعتين الخفيفتين اللتين كان يفتتح بهما، وأن سائر رواة الموطأ قالوا: فصلى ركعتين خفيفتين ثم صلى ركعتين طويلتين طويلتين طويلتين، وأن ابن عبد البر عدّ إسقاط يحيى خطأً واضحاً ⁦(التمهيد 17/287–288)⁩؛ ويخرّجه عند مسلم (2/183) وأبي داود (1366) وابن ماجه (1362) والترمذي في الشمائل والنسائي وابن حبان من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.179} {cite:muwatta-maruf-1997 p.180}"
  tr: "Malik, Abdullah ibn Abi Bekr'den, o da babasından rivayet ettiğine göre, Abdullah ibn Kays ibn Makhrama, Zeyd ibn Halid el-Cuhani'den, Peygamberin Vitr namazı bölümünde şöyle anlatmıştır: Zeyd, bir gece Peygamberin namazını kılmaya karar verdi ve evinin eşiğinde veya çadırında oturdu. Peygamber ayağa kalktı ve iki uzun rekat, sonra iki kısa rekat namaz kıldı ve bunu beş defa, her seferinde iki kısa rekat olmak üzere tekrarladı, sonra Vitr namazını kıldı. Bu da on üç rekat eder. Araştırmacı, Yahya'nın \"iki uzun, uzun\" dediğini ve başlangıçta kıldığı iki kısa rekatı zikretmeyi atladığını, Muwatta'nın diğer tüm rivayetçilerinin ise \"İki kısa rekat kıldı, sonra iki uzun, uzun, uzun rekat kıldı\" dediğini ve İbn Abdül-Barr'ın Yahya'nın bu ihmalini açık bir hata olarak değerlendirdiğini (el-Tamhid 17/287–288) açıklıyor. Bu rivayet, Müslim (2/183), Ebu Davud (1366), İbn Majah (1362), Tirmizi (Şemail'de), Nesai ve İbn Hibban tarafından Malik'in sahabelerinin rivayetlerinden nakledilmiştir. {cite:muwatta-maruf-1997 s.179} {cite:muwatta-maruf-1997 s.180}"
  id: "Malik meriwayatkannya dari Abdullah ibn Abi Bakr, dari ayahnya, bahwa Abdullah ibn Qays ibn Makhrama memberitahukannya dari Zayd ibn Khalid al-Juhani, dalam surah tentang salat Witir Nabi: Zayd memutuskan untuk melaksanakan salat Nabi pada suatu malam, lalu ia duduk di ambang pintu atau di dalam tendanya. Nabi berdiri dan salat dua rakaat panjang, kemudian dua rakaat pendek, dan seterusnya sebanyak lima kali, setiap kali dua rakaat pendek, kemudian beliau salat Witir. Itu berjumlah tiga belas rakaat. Peneliti menjelaskan bahwa Yahya mengatakan \"dua rakaat panjang, panjang\" dan tidak menyebutkan dua rakaat pendek yang ia mulai, dan bahwa semua perawi Muwatta lainnya mengatakan: Ia shalat dua rakaat pendek, kemudian ia shalat dua rakaat panjang, panjang, panjang, dan bahwa Ibnu Abd al-Barr menganggap kelalaian Yahya sebagai kesalahan yang jelas (al-Tamhid 17/287–288). Diriwayatkan oleh Muslim (2/183), Abu Dawud (1366), Ibnu Majah (1362), Al-Tirmidhi dalam Al-Shama’il, Al-Nasa’i, dan Ibnu Hibban dari riwayat para sahabat Malik. {cite:muwatta-maruf-1997 hlm.179} {cite:muwatta-maruf-1997 hlm.180}"
