label: { ar: "صحيح البخاري 4024 — ساعة الاحتضار والوفاة", en: "Sahih al-Bukhari 4024 — a deathbed and last hours", ur: "صحیح بخاری 4024 — وقتِ وفات اور آخری لمحات", es: "Sahih al-Bukhari 4024 — un lecho de muerte y últimas horas" }
text: "… الْمُطْعِمُ بْنُ عَدِيٍّ حَيًّا ثُمَّ كَلَّمَنِي فِي هَؤُلاَءِ النَّتْنَى لَتَرَكْتُهُمْ لَهُ \". وَقَالَ اللَّيْثُ عَنْ يَحْيَى، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، وَقَعَتِ الْفِتْنَةُ الأُولَى ـ يَعْنِي مَقْتَلَ عُثْمَانَ ـ فَلَمْ تُبْقِ مِنْ أَصْحَابِ بَدْرٍ أَحَدًا، ثُمَّ وَقَعَتِ الْفِتْنَةُ الثَّانِيَةُ ـ يَعْنِي الْحَرَّةَ ـ فَلَمْ تُبْقِ مِنْ أَصْحَابِ الْحُدَيْبِيَةِ أَحَدًا ثُمَّ وَقَعَتِ الثَّالِثَةُ فَلَمْ تَرْتَفِعْ وَلِلنَّاسِ طَبَاخٌ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4024، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4024 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 4024، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4024 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
