text: "ت عال: (وما عند الله خير وأبقى) (القصص ٠[٦٠ قال الحاكم: ورد كتاب من مصر بأن يحج أبو محمد المغفلي بالناس، ويخطب بعرفة ومنى. فصلى بعرفة واتم الصلاة، فعج الناس، فصعد المنبر، فقال: أيها الناس، أنا مقيم وأنتم على سفر،"
