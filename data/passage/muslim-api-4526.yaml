label: { ar: "صحيح مسلم 4526 — الأب والأبوة", en: "Sahih Muslim 4526 — the father and fatherhood", ur: "صحیح مسلم 4526 — باپ اور والدیت", es: "Sahih Muslim 4526 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ شُعْبَةَ، عَنْ سَعِيدِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ بَعَثَهُ وَمُعَاذًا إِلَى الْيَمَنِ فَقَالَ \" يَسِّرَا وَلاَ تُعَسِّرَا وَبَشِّرَا وَلاَ تُنَفِّرَا وَتَطَاوَعَا وَلاَ تَخْتَلِفَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4526، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4526 (The Book of Jihad and Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4526، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4526 (El Libro de la Yihad y las Expediciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
