label: { ar: "الموطأ 2335 — مالك: ترك الدين من المكاتب ليس عتاقة، والولاء لمن عقد الكتابة", en: "Muwatta 2335" }
summary:
  ar: "قال مالك في مكاتب بين رجلين، فيترك أحدهما للمكاتب ما له عليه ويشح الآخر، ثم يموت المكاتب ويترك مالا: يقضي الذي لم يترك له شيئا ما بقي له عليه، ثم يقتسمان المال كهيئته لو مات عبدا، لأن ما صنعه ليس بعتاقة وإنما ترك ما كان له عليه. واستدل مالك على ذلك بأن ولاء المكاتب الموروث لا يثبت لمن أعتق نصيبه من الورثة، ولو كان عتقا لثبت الولاء للمعتِق، وبأن من أعتق نصيبه من مكاتب مشترك لا يقوم عليه ما بقي، ولو كان عتقا لقوم عليه. ويرى أن الولاء لمن عقد الكتابة، وأن ولاءه لولد سيد المكاتب الذكور أو عصبته من الرجال لا النساء. {cite:muwatta-maruf-1997 p.362} {cite:muwatta-maruf-1997 p.363}"
