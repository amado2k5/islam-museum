label: { ar: "الموطأ 2335 — مالك: ترك الدين من المكاتب ليس عتاقة، والولاء لمن عقد الكتابة", en: "Muwatta 2335", es: "Muwatta 2335", fr: "Muwatta 2335", ur: "موطا 2335", tr: "Al-Muwatta 2335 — Malik: Sözleşmeli bir kölenin borçtan kurtulması, kölenin azat edilmesi anlamına gelmez ve sadakat, sözleşmeyi yapan kişiye aittir.", id: "Al-Muwatta 2335 — Malik: Meninggalkan hutang oleh seorang budak yang terikat kontrak bukanlah pembebasan, dan kesetiaan adalah milik pihak yang membuat kontrak." }
summary:
  ar: "قال مالك في مكاتب بين رجلين، فيترك أحدهما للمكاتب ما له عليه ويشح الآخر، ثم يموت المكاتب ويترك مالا: يقضي الذي لم يترك له شيئا ما بقي له عليه، ثم يقتسمان المال كهيئته لو مات عبدا، لأن ما صنعه ليس بعتاقة وإنما ترك ما كان له عليه. واستدل مالك على ذلك بأن ولاء المكاتب الموروث لا يثبت لمن أعتق نصيبه من الورثة، ولو كان عتقا لثبت الولاء للمعتِق، وبأن من أعتق نصيبه من مكاتب مشترك لا يقوم عليه ما بقي، ولو كان عتقا لقوم عليه. ويرى أن الولاء لمن عقد الكتابة، وأن ولاءه لولد سيد المكاتب الذكور أو عصبته من الرجال لا النساء. {cite:muwatta-maruf-1997 p.362} {cite:muwatta-maruf-1997 p.363}"
  tr: "Malik, iki adam arasında yapılan bir köle azat sözleşmesi kapsamında bir kölenin durumunu ele alarak şöyle demiştir: Adamlardan biri köleye borcunu bırakırken diğeri cimri davranır ve köle ölür, geride bir miras bırakır: Hiçbir şey bırakmayan kişi, kendisine borçlu olunan miktarı ödemeli ve ardından miras, sanki köle olarak ölmüş gibi paylaşılmalıdır; çünkü yaptığı şey azat değil, kendisine borçlu olunan miktarı bırakmaktır. Malik, bir köle azat sözleşmesi kapsamındaki kölenin miras yoluyla edindiği bağlılığın, payını azat eden mirasçılara ait olmadığını, oysa azat söz konusu olsaydı bağlılığın azat edene ait olacağını savunmuştur. Ayrıca, bir köle azat sözleşmesi kapsamında ortak mülkiyete sahip bir kölenin payını azat eden kişinin, geriye kalanlardan sorumlu olmadığını, oysa azat söz konusu olsaydı sorumlu olacağını da savunmuştur. O, sadakatin kölelikten kurtulma sözleşmesini imzalayan kişiye ait olduğunu ve sadakatin kölenin efendisinin erkek çocuklarına veya erkek akrabalarına ait olduğunu, kadınlara ait olmadığını savunmaktadır."
  id: "Malik mengatakan mengenai kasus seorang budak yang terikat kontrak pembebasan antara dua orang, di mana salah satu meninggalkan apa yang menjadi hak budak sementara yang lain pelit, dan kemudian budak tersebut meninggal dunia meninggalkan harta warisan: orang yang tidak meninggalkan apa pun harus membayar sisa hutang kepadanya, dan kemudian mereka harus membagi harta warisan seolah-olah dia meninggal sebagai budak, karena apa yang dilakukannya bukanlah pembebasan, melainkan meninggalkan apa yang menjadi haknya. Malik berpendapat bahwa kesetiaan yang diwariskan dari seorang budak berdasarkan kontrak pembebasan tidak menjadi hak ahli waris yang membebaskan bagiannya, sedangkan jika itu adalah pembebasan, kesetiaan akan menjadi hak orang yang membebaskan. Dia juga berpendapat bahwa orang yang membebaskan bagiannya dari budak yang dimiliki bersama berdasarkan kontrak pembebasan tidak bertanggung jawab atas sisa hutang, sedangkan jika itu adalah pembebasan, maka akan bertanggung jawab. Dia mempertahankan bahwa kesetiaan menjadi hak orang yang membuat kontrak pembebasan, dan bahwa kesetiaan menjadi hak anak laki-laki dari majikan budak atau kerabat laki-lakinya, bukan anak perempuan."
