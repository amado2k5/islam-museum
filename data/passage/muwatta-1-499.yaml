summary:
  ar: "أول أثر في باب الرخصة في الصلاة قبل العيدين وبعدهما. يرويه يحيى عن مالك عن عبد الرحمن بن القاسم أن أباه القاسم بن محمد كان يصلي قبل أن يغدو إلى المصلى أربع ركعات. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.255}"
