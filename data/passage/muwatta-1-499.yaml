label: { ar: "الموطأ 499 — القاسم بن محمد يصلي أربع ركعات قبل أن يغدو إلى المصلى", en: "Muwatta 499", es: "Muwatta 499", fr: "Muwatta 499", ur: "موطا 499", tr: "El-Muvatta 499 — El-Kasım ibn Muhammed namaz kıldırmadan önce dört rekat namaz kılar.", id: "Al-Muwatta 499 — Al-Qasim bin Muhammad shalat empat rakaat sebelum pergi ke tempat shalat" }
summary:
  ar: "أول أثر في باب الرخصة في الصلاة قبل العيدين وبعدهما. يرويه يحيى عن مالك عن عبد الرحمن بن القاسم أن أباه القاسم بن محمد كان يصلي قبل أن يغدو إلى المصلى أربع ركعات. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.255}"
  tr: "İki bayramdan önce ve sonra namaz kılma zorunluluğuna ilişkin ilk rivayet, Yahya'nın Malik'ten, o da Abdülrahman ibn el-Kâsım'dan rivayet ettiğine göre, babası el-Kâsım ibn Muhammed'in namaz kılma yerine gitmeden önce dört rekat namaz kıldığı şeklindedir. Editör, bu rivayetin Malik'ten Ebu Musab, Suveyd ve Muhammed ibn el-Hasan tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.255}"
  id: "Riwayat pertama mengenai keringanan shalat sebelum dan sesudah dua hari raya Id diriwayatkan oleh Yahya dari Malik, dari Abd al-Rahman ibn al-Qasim, bahwa ayahnya, al-Qasim ibn Muhammad, biasa shalat empat rakaat sebelum pergi ke tempat shalat. Editor menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.255}"
