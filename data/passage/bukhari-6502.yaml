label:
  ar: "البخاري 6502 — من عادى لي وليا فقد آذنته بالحرب"
  en: "Bukhari 6502 — Whoever shows enmity to a friend of Mine, I declare war on him"
  ur: "بخاری 6502 — جس نے میرے کسی ولی سے دشمنی کی، میں اس سے اعلانِ جنگ کرتا ہوں"
text: "إن الله قال من عادى لي وليا فقد آذنته بالحرب، وما تقرب إلى عبدي بشىء أحب إلى مما افترضت عليه، وما يزال عبدي يتقرب إلى بالنوافل حتى أحبه، فإذا أحببته كنت سمعه الذي يسمع به، وبصره الذي يبصر به، ويده …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6502: من عادى لي وليا فقد آذنته بالحرب. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6502: Whoever shows enmity to a friend of Mine, I declare war on him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6502: جس نے میرے کسی ولی سے دشمنی کی، میں اس سے اعلانِ جنگ کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
