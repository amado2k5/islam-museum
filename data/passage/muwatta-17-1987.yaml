label: { ar: "الموطأ 1987 — مالك عن حميد بن قيس عن مجاهد: استسلف عبد الله بن عمر دراهم من رجل، ثم قضاه دراهم خيرا منها، فقال الرجل: هذه خير من دراهمي، فقال ابن عمر: قد علمت، ولكن نفسي بذلك طيبة", en: "Muwatta 1987", es: "Muwatta 1987", fr: "Muwatta 1987", ur: "موطا 1987", tr: "El-Muvatta 1987 — Malik, Humaid bin Kays'tan, o da Mücahid'den rivayetle: Abdullah bin Ömer bir adamdan bir miktar dirhem borç aldı, sonra ona daha iyi dirhemlerle geri ödedi. Adam dedi ki: Bunlar benim dirhemlerimden daha iyidir. İbn Ömer dedi ki: Biliyorum, ama ben bununla yetiniyorum.", id: "Al-Muwatta 1987 — Malik, berdasarkan riwayat Humaid bin Qais, berdasarkan riwayat Mujahid: Abdullah bin Umar meminjam beberapa dirham dari seorang pria, kemudian mengembalikannya dengan dirham yang lebih baik. Pria itu berkata: Ini lebih baik daripada dirham saya. Ibn Umar berkata: Saya tahu, tetapi saya puas dengan itu." }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي عن مجاهد أنه قال: استسلف عبد الله بن عمر دراهم من رجل، ثم قضاه دراهم خيرا منها. فقال الرجل: يا أبا عبد الرحمن، هذه خير من دراهمي التي أسلفتك. فقال عبد الله بن عمر: قد علمت، ولكن نفسي بذلك طيبة. {cite:muwatta-maruf-1997 p.213} {cite:muwatta-maruf-1997 p.214}"
  tr: "Malik, Humaid ibn Kays el-Mekki'den, o da Mücahid'den rivayet ettiğine göre şöyle demiştir: Abdullah ibn Ömer bir adamdan dirhem borç aldı, sonra ona daha iyi dirhemlerle geri ödedi. Adam dedi ki: Ey Ebu Abdül-Rahman, bunlar sana verdiğim dirhemlerden daha iyidir. Abdullah ibn Ömer dedi ki: Biliyorum, ama bununla yetiniyorum. {cite:muwatta-maruf-1997 s.213} {cite:muwatta-maruf-1997 s.214}"
  id: "Malik meriwayatkan dari Humaid ibn Qais al-Makki, dari Mujahid, bahwa ia berkata: Abdullah ibn Umar meminjam beberapa dirham dari seorang pria, kemudian mengembalikannya dengan dirham yang lebih baik. Pria itu berkata: Wahai Abu Abd al-Rahman, ini lebih baik daripada dirham yang kupinjamkan kepadamu. Abdullah ibn Umar berkata: Aku tahu, tetapi aku puas dengan itu. {cite:muwatta-maruf-1997 p.213} {cite:muwatta-maruf-1997 p.214}"
