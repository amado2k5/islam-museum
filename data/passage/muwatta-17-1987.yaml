label: { ar: "الموطأ 1987 — مالك عن حميد بن قيس عن مجاهد: استسلف عبد الله بن عمر دراهم من رجل، ثم قضاه دراهم خيرا منها، فقال الرجل: هذه خير من دراهمي، فقال ابن عمر: قد علمت، ولكن نفسي بذلك طيبة", en: "Muwatta 1987" }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي عن مجاهد أنه قال: استسلف عبد الله بن عمر دراهم من رجل، ثم قضاه دراهم خيرا منها. فقال الرجل: يا أبا عبد الرحمن، هذه خير من دراهمي التي أسلفتك. فقال عبد الله بن عمر: قد علمت، ولكن نفسي بذلك طيبة. {cite:muwatta-maruf-1997 p.213} {cite:muwatta-maruf-1997 p.214}"
