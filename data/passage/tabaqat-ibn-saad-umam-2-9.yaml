text: "… إلى المسجد، وقريش يتحدّثون بحديث الحجّاج بن مِلاط، فقال العبّاس : كلا والذى حلقتم به، لقد اقتنح رسول اللّٰه، صلّعم، خيبر وتُرِكَ عروساً على ابنة حُيَىّ بن أَخطب، فضرب أَعناق بنى أَبى الحُقيق البيض • الجمادِ الذين رأيتموهم سادة النضير …"
