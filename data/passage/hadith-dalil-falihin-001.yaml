text: "ناس)) (متفق عليه قال) أبو نصر إسماعيل بن (١) أخرجه البخاري في كتاب: صلاة الجماعة، باب: فضل من غدا إلى المسجد (١٢٤/٢) . وأخرجه مسلم في كتاب: المساجد ومواضع الصلاة باب: المشي إلى الصلاة تمحى به الخطايا وترفع به الدرجات."
