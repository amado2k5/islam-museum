label: { ar: "الموطأ 1599 — مالك: المملكة إذا ملكها زوجها أمرها ثم افترقا ولم تقبل شيئا، فليس بيدها شيء، وهو لها ما داما في مجلسهما", en: "Muwatta 1599", es: "Muwatta 1599", fr: "Muwatta 1599", ur: "موطا 1599", tr: "El-Muvatta 1599 — Malik: Eğer bir kadının kocası ona kendi üzerinde yetki verirse ve sonra ayrılırlarsa ve kadın hiçbir şeyi kabul etmezse, hiçbir şeye hakkı kalmaz ve birlikte oldukları sürece her şey ona ait kalır.", id: "Al-Muwatta 1599 — Malik: Jika suami seorang wanita memberikan kekuasaan kepadanya, lalu mereka berpisah dan wanita itu tidak menerima apa pun, maka dia tidak berhak atas apa pun, dan harta itu tetap menjadi miliknya selama mereka masih bersama." }
summary:
  ar: "يقول مالك في المملكة إذا ملكها زوجها أمرها، ثم افترقا، ولم تقبل من ذلك شيئا، فليس بيدها من ذلك شيء، وهو لها ما داما في مجلسهما. {cite:muwatta-maruf-1997 p.65}"
  tr: "Malik, bir krallıkta bir kadına kocası üzerinde yetki verilirse ve sonra ayrılırlarsa ve kadın kocasından hiçbir şey kabul etmezse, ondan hiçbir şeye hakkı olmadığını ve birlikte oldukları sürece her şeyin ona ait kaldığını söyler. {cite:muwatta-maruf-1997 s.65}"
  id: "Malik mengatakan bahwa jika seorang wanita di suatu kerajaan diberi wewenang atas suaminya, dan kemudian mereka berpisah, dan wanita itu tidak menerima apa pun dari suaminya, maka dia tidak berhak atas apa pun dari suaminya, dan hal itu tetap menjadi miliknya selama mereka masih bersama. {cite:muwatta-maruf-1997 p.65}"
