text: "… بديه، وأَخبرته خبرى، فدفع إلىّ عصاً فقال : تخصّرْ بهذه فى الجذّة. فإن المتخصّرين فى الجنّة قليل. فكانت عند عبد اللّه بن أُنَيس حتى إذا حضره الموتُ أَوصى أَهلَه أَن يُدرجوها فى كَفَنه. وكان قتْله فى المحرّم على رأس أَربعة …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 3، ص 127، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
