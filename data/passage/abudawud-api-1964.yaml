label: { ar: "سنن أبي داود 1964 — تربية الأب ووصيته", en: "Sunan Abi Dawud 1964 — the father raising and counselling", ur: "سنن ابی داؤد 1964 — باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 1964 — el padre que cría y aconseja" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، عَنْ أَيُّوبَ، عَنِ الزُّهْرِيِّ، أَنَّ عُثْمَانَ بْنَ عَفَّانَ، أَتَمَّ الصَّلاَةَ بِمِنًى مِنْ أَجْلِ الأَعْرَابِ لأَنَّهُمْ كَثُرُوا عَامَئِذٍ فَصَلَّى بِالنَّاسِ أَرْبَعًا لِيُعْلِمَهُمْ أَنَّ الصَّلاَةَ أَرْبَعٌ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1964، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1964 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1964، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1964 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
