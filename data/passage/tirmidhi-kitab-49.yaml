summary:
  ar: "القسم 49 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المناقب عن رسول الله»، ويضم فيها النصوص من 3605 إلى 3956 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 49 of Jami' al-Tirmidhi (Chapters on Virtues) in the division of the open hadith dataset the museum took its reports from: reports 3605 to 3956 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 49، عنوان «کتاب المناقب عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3605 تا 3956۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 49 de Jami' al-Tirmidhi (Capítulos sobre las virtudes) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3605 al 3956, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 49 de Jami' al-Tirmidhi (Chapitres sur les vertus), qui comprend les hadiths 3605 à 3956 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanında yer alan Cami' el-Tirmizi'nin 49. bölümü, \"Allah Resulü'nün Faziletleri Kitabı\" başlığını taşımakta olup, 3605 ile 3956 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 49 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Keutamaan Rasulullah\" dan berisi teks 3605 hingga 3956, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
