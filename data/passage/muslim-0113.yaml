label:
  ar: "مسلم 113 — بادرني عبدي بنفسه فحرمت عليه الجنة"
  en: "Muslim 113 — My servant hastened to Me with his own life"
  ur: "مسلم 113 — میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی"
text: "إن رجلا ممن كان قبلكم خرجت به قرحة فلما آذته انتزع سهما من كنانته فنكأها فلم يرقإ الدم حتى مات . قال ربكم قد حرمت عليه الجنة . ثم مد يده إلى المسجد فقال إي والله لقد حدثني بهذا الحديث …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 113: بادرني عبدي بنفسه فحرمت عليه الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 113: My servant hastened to Me with his own life. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 113: میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
