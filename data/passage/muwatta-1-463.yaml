label: { ar: "الموطأ 463 — اجعلوا من صلاتكم في بيوتكم", en: "Muwatta 463", es: "Muwatta 463", fr: "Muwatta 463", ur: "موطا 463", tr: "Al-Muwatta 463 — Namazlarınızı evlerinizde kılın", id: "Al-Muwatta 463 — Lakukan salat di rumah-rumahmu" }
text: "اجعلوا من صلاتكم في بيوتكم"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، في باب العمل في جامع الصلاة: أمر النبي أن يجعل الناس من صلاتهم في بيوتهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه مرسل في الموطأ عند جميعهم، وأن البخاري ومسلم (2/187) أخرجاه من حديث نافع عن ابن عمر مرفوعاً، ويحيل على التمهيد (22/332). {cite:muwatta-maruf-1997 p.238}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, mescitteki ameller bölümünde mursal bir hadis olarak nakletmiştir: Peygamberimiz, insanların namazlarının bir kısmını evlerinde kılmalarını emretmiştir. Editör, Ebu Mus'ab ve Suveyd'in de Malik'ten rivayet ederek bunu naklettiğini ve hepsinin görüşüne göre Muvatta'da mursal olduğunu belirtmektedir. Ayrıca, Buhari ve Müslim'in (2/187) bunu Nafi'den, o da İbn Ömer'den rivayet ederek merfu bir hadis olarak kaydettiğini ve Temhid'e (22/332) atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.238}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, yang juga meriwayatkan dari ayahnya, sebagai hadits mursal, dalam bab tentang amalan di masjid: Nabi memerintahkan agar manusia melaksanakan sebagian salat mereka di rumah masing-masing. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini dari Malik, dan menurut mereka semua hadits ini adalah mursal dalam kitab Muwatta'. Ia juga menyatakan bahwa al-Bukhari dan Muslim (2/187) memasukkannya dari Nafi', yang juga meriwayatkan dari Ibn Umar, sebagai hadits marfu', dan ia merujuk pada al-Tamhid (22/332). {cite:muwatta-maruf-1997 p.238}"
