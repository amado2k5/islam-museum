text: "اجعلوا من صلاتكم في بيوتكم"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، في باب العمل في جامع الصلاة: أمر النبي أن يجعل الناس من صلاتهم في بيوتهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه مرسل في الموطأ عند جميعهم، وأن البخاري ومسلم (2/187) أخرجاه من حديث نافع عن ابن عمر مرفوعاً، ويحيل على التمهيد (22/332). {cite:muwatta-maruf-1997 p.238}"
