text: "… عن عروة عن عائشة قالت : قال رسول اللّٰه عليل ا في مرضه الذي مات فيه : صُبُّوا عليَّ من سبع قَرَبٍ لم تُحْلَل أَوْكِيَتُهن فأَعهد إلى الناس، قالت عائشة: فأَجلسناه في مخضب لحفصة من نحاس، وسكبنا عليه الماءَ منهن …"
