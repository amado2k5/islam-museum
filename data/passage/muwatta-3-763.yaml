label: { ar: "الموطأ 763 — ابن عمر: كان عمر يأخذ من النبط من الحنطة والزيت نصف العشر ليكثر الحمل إلى المدينة، ومن القطنية العشر", en: "Muwatta 763" }
summary:
  ar: "أول حديث في باب عشور أهل الذمة. يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه، أن عمر بن الخطاب كان يأخذ من النبط من الحنطة والزيت نصف العشر، يريد بذلك أن يكثر الحمل إلى المدينة، ويأخذ من القطنية العشر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع وإسماعيل بن عمر وسعيد بن عفير وعبد الرحمن بن غزوان ويحيى بن بكير عند أبي عبيد في الأموال (1662)، ومحمد بن الحسن الشيباني (331). {cite:muwatta-maruf-1997 p.377} {cite:muwatta-maruf-1997 p.378}"
