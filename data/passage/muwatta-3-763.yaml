label: { ar: "الموطأ 763 — ابن عمر: كان عمر يأخذ من النبط من الحنطة والزيت نصف العشر ليكثر الحمل إلى المدينة، ومن القطنية العشر", en: "Muwatta 763", es: "Muwatta 763", fr: "Muwatta 763", ur: "موطا 763", tr: "El-Muvatta 763 — İbn Ömer: Ömer, Medine'ye taşınan miktarı artırmak için Nabateanlardan buğday ve yağdan zekâtın yarısını, pamuktan ise onda birini alırdı.", id: "Al-Muwatta 763 — Ibn Umar: Umar biasa mengambil setengah dari persepuluhan dari kaum Nabatea atas gandum dan minyak untuk meningkatkan jumlah yang diangkut ke Madinah, dan sepersepuluh atas kapas." }
summary:
  ar: "أول حديث في باب عشور أهل الذمة. يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه، أن عمر بن الخطاب كان يأخذ من النبط من الحنطة والزيت نصف العشر، يريد بذلك أن يكثر الحمل إلى المدينة، ويأخذ من القطنية العشر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع وإسماعيل بن عمر وسعيد بن عفير وعبد الرحمن بن غزوان ويحيى بن بكير عند أبي عبيد في الأموال (1662)، ومحمد بن الحسن الشيباني (331). {cite:muwatta-maruf-1997 p.377} {cite:muwatta-maruf-1997 p.378}"
  tr: "Ahd Ehli'nin zekâtı bölümündeki ilk hadis. Malik'in İbn Şihab'tan, o da Salim ibn Abdullah'tan, o da babasından rivayet ettiğine göre, Ömer ibn el-Hattab, Medine'ye taşınan miktarı artırmak amacıyla Nabateanlardan buğday ve yağdan yarım zekât alırdı ve pamuktan tam zekât alırdı. Editör, bu hadisin Malik'ten Ebu Musab, İshak el-Tabba', İsmail ibn Ömer, Sa'id ibn Ufayr, Abd el-Rahman ibn Gazvan ve Yahya ibn Bukayr tarafından rivayet edildiğini, Ebu Ubeyd'in el-Amwal'da (1662) ve Muhammed ibn el-Hasan el-Şeybani'nin (331) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.377} {cite:muwatta-maruf-1997 s.378}"
  id: "Hadits pertama dalam bab tentang persepuluhan kaum Ahlul Baitullah. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Salim ibn Abdullah, dari ayahnya, bahwa Umar ibn al-Khattab biasa mengambil setengah persepuluhan dari kaum Nabatea atas gandum dan minyak, dengan maksud untuk meningkatkan jumlah yang diangkut ke Madinah, dan ia mengambil persepuluhan penuh atas kapas. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Ishaq al-Tabba’, Ismail ibn Umar, Sa’id ibn Ufayr, Abd al-Rahman ibn Ghazwan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh Abu Ubayd dalam al-Amwal (1662), dan oleh Muhammad ibn al-Hasan al-Shaybani (331). {kutip:muwatta-maruf-1997 hal.377} {kutip:muwatta-maruf-1997 hal.378}"
