label: { ar: "صحيح البخاري 5119 — الأب والأبوة", en: "Sahih al-Bukhari 5119 — the father and fatherhood", ur: "صحیح بخاری 5119 — باپ اور والدیت", es: "Sahih al-Bukhari 5119 — El padre y la paternidad", fr: "Sahih al-Bukhari 5119 — Le père et la paternité", tr: "Sahih el-Buhari 5119 — Baba ve Babalık", id: "Sahih al-Bukhari 5119 — Ayah dan Peran Ayah" }
text: "وَقَالَ ابْنُ أَبِي ذِئْبٍ حَدَّثَنِي إِيَاسُ بْنُ سَلَمَةَ بْنِ الأَكْوَعِ، عَنْ أَبِيهِ، عَنْ رَسُولِ اللَّهِ \" أَيُّمَا رَجُلٍ وَامْرَأَةٍ تَوَافَقَا فَعِشْرَةُ مَا بَيْنَهُمَا ثَلاَثُ لَيَالٍ فَإِنْ أَحَبَّا أَنْ يَتَزَايَدَا أَوْ يَتَتَارَكَا تَتَارَكَا \". فَمَا أَدْرِي أَشَىْءٌ كَانَ لَنَا خَاصَّةً أَمْ لِلنَّاسِ عَامَّةً. قَالَ أَبُو عَبْدِ اللَّهِ وَبَيَّنَهُ عَلِيٌّ عَنِ النَّبِيِّ أَنَّهُ مَنْسُوخٌ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5119، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5119 (Wedlock, Marriage (Nikaah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5119، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5119 (Matrimonio (Nikaah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5119 (Mariage, Nikah), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 5119 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5119, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
