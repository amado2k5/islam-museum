label:
  ar: "ابن ماجه 1403 — فرضت على أمتك خمس صلوات وعهدت عندي عهدا"
  en: "Ibn Majah 1403 — I made five prayers obligatory on your community and made a covenant"
  ur: "ابن ماجہ 1403 — میں نے تمہاری امت پر پانچ نمازیں فرض کیں اور ایک عہد کیا"
  es: "Ibn Majah 1403 — Hice obligatorias cinco oraciones para tu comunidad e hice un pacto."
  fr: "Ibn Majah 1403 — J'ai rendu obligatoires les cinq prières pour votre communauté et j'ai conclu une alliance."
text: "قال الله عز وجل افترضت على أمتك خمس صلوات وعهدت عندي عهدا أنه من حافظ عليهن لوقتهن أدخلته الجنة ومن لم يحافظ عليهن فلا عهد له عندي ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1403: فرضت على أمتك خمس صلوات وعهدت عندي عهدا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1403: I made five prayers obligatory on your community and made a covenant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1403: میں نے تمہاری امت پر پانچ نمازیں فرض کیں اور ایک عہد کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 1403: Hice obligatorias cinco oraciones para tu comunidad e hice un pacto. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 1403: « J’ai prescrit cinq prières par jour à votre communauté et j’ai conclu une alliance. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
