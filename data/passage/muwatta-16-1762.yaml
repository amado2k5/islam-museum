label: { ar: "الموطأ 1762 — يحيى عن مالك عن عبد الله بن أبي بكر عن عمرة بنت عبد الرحمن: عائشة سمعت رجلا يستأذن في بيت حفصة، فقال النبي هو عم لحفصة من الرضاعة، وقال نعم إن الرضاعة تحرم ما تحرم الولادة", en: "Muwatta 1762", es: "Muwatta 1762", fr: "Muwatta 1762", ur: "موطا 1762", tr: "El-Muvatta 1762 — Yahya, Malik'ten, o da Abdullah bin Ebu Bekir'den, o da Amrah bint Abdülrahman'dan rivayetle: Aişe, bir adamın Hafsa'nın evine girmek için izin istediğini duydu. Peygamber, \"O, Hafsa'nın üvey amcasıdır\" dedi. Adam da, \"Evet, üvey olmak, öz doğanın haram kıldığı şeyi haram kılar\" dedi.", id: "Al-Muwatta 1762 — Yahya dari Malik dari Abdullah bin Abi Bakr dari Amrah bint Abd al-Rahman: Aisyah mendengar seorang pria meminta izin untuk masuk ke rumah Hafsa, lalu Nabi berkata, \"Dia adalah paman angkat Hafsa.\" Dan beliau berkata, \"Ya, hubungan angkat menjadikan haram apa yang haram karena hubungan kandung.\"" }
text: "إنَّ الرَّضَاعةَ تُحَرِّمُ مَا تُحَرِّمُ الْوِلَادةُ"
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر عن عمرة بنت عبد الرحمن أن عائشة أم المؤمنين أخبرتها أن رسول الله كان عندها، وأنها سمعت صوت رجل يستأذن في بيت حفصة. فقالت عائشة: يا رسول الله، هذا رجل يستأذن في بيتك. فقال النبي: أراه فلانا، لعم لحفصة من الرضاعة. فقالت عائشة: يا رسول الله، لو كان فلان حيا، لعمها من الرضاعة، دخل علي؟ فقال النبي: نعم، إن الرضاعة تحرم ما تحرم الولادة. وينبه المحقق إلى أن عم حفصة من الرضاعة كان أخا لعمر بن الخطاب من الرضاعة، أرضعتهما امرأة واحدة. {cite:muwatta-maruf-1997 p.119}"
  tr: "Yahya, Malik'ten, o da Abdullah ibn Abi Bekr'den, o da Amrah bint Abdülrahman'dan rivayet ettiğine göre, Müminlerin Annesi Aişe, kendisine Resulullah'ın yanında olduğunu ve bir adamın Hafsa'nın evine girmek için izin istediğini duyduğunu anlattı. Aişe, \"Ey Resulullah, bu adam senin evine girmek için izin istiyor\" dedi. Peygamber, \"Sanırım bu, Hafsa'nın üvey amcası filancadır\" dedi. Aişe, \"Ey Resulullah, eğer filanca, yani üvey amcası hayatta olsaydı, benim evime girer miydi?\" diye sordu. Peygamber, \"Evet, üveylik, doğumun haram kıldığı şeyi haram kılar\" dedi. Araştırmacı, Hafsa'nın üvey amcasının Ömer ibn el-Hattab'ın üvey kardeşi olduğunu ve ikisinin de aynı kadın tarafından emzirildiğini belirtiyor. {cite:muwatta-maruf-1997 s.119}"
  id: "Yahya meriwayatkan dari Malik, dari Abdullah ibn Abi Bakr, dari Amrah bint Abd al-Rahman, bahwa Aisyah, Ummul Mukminin, memberitahunya bahwa Rasulullah SAW bersamanya, dan bahwa ia mendengar suara seorang laki-laki meminta izin untuk memasuki rumah Hafsa. Aisyah berkata, \"Wahai Rasulullah, ini suara seorang laki-laki yang meminta izin untuk memasuki rumahmu.\" Nabi SAW bersabda, \"Aku kira itu si fulan, paman angkat Hafsa.\" Aisyah berkata, \"Wahai Rasulullah, jika si fulan, paman angkatnya, masih hidup, apakah ia akan masuk ke rumahku?\" Nabi SAW bersabda, \"Ya, hubungan asuh menjadikan haram apa yang haram karena kelahiran.\" Peneliti menunjukkan bahwa paman angkat Hafsa adalah saudara angkat Umar ibn al-Khattab, dan mereka berdua disusui oleh wanita yang sama. {cite:muwatta-maruf-1997 p.119}"
