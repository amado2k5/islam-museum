label: { ar: "الموطأ 1762 — يحيى عن مالك عن عبد الله بن أبي بكر عن عمرة بنت عبد الرحمن: عائشة سمعت رجلا يستأذن في بيت حفصة، فقال النبي هو عم لحفصة من الرضاعة، وقال نعم إن الرضاعة تحرم ما تحرم الولادة", en: "Muwatta 1762" }
text: "إنَّ الرَّضَاعةَ تُحَرِّمُ مَا تُحَرِّمُ الْوِلَادةُ"
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر عن عمرة بنت عبد الرحمن أن عائشة أم المؤمنين أخبرتها أن رسول الله كان عندها، وأنها سمعت صوت رجل يستأذن في بيت حفصة. فقالت عائشة: يا رسول الله، هذا رجل يستأذن في بيتك. فقال النبي: أراه فلانا، لعم لحفصة من الرضاعة. فقالت عائشة: يا رسول الله، لو كان فلان حيا، لعمها من الرضاعة، دخل علي؟ فقال النبي: نعم، إن الرضاعة تحرم ما تحرم الولادة. وينبه المحقق إلى أن عم حفصة من الرضاعة كان أخا لعمر بن الخطاب من الرضاعة، أرضعتهما امرأة واحدة. {cite:muwatta-maruf-1997 p.119}"
