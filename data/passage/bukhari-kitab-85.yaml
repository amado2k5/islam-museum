label:
  ar: "صحيح البخاري، كتاب الفرائض"
  en: "Sahih al-Bukhari, Book 85: Laws of Inheritance (Al-Faraa'id)"
  ur: "صحیح بخاری، کتاب الفرائض"
  es: "Sahih al-Bukhari, Libro 85: Leyes de la herencia (Al-Faraa'id)"
summary:
  ar: "القسم 85 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفرائض»، ويضم فيها النصوص من 6723 إلى 6771 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 85 of Sahih al-Bukhari (Laws of Inheritance (Al-Faraa'id)) in the division of the open hadith dataset the museum took its reports from: reports 6723 to 6771 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 85، عنوان «کتاب الفرائض»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6723 تا 6771۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 85 de Sahih al-Bukhari (Leyes de la herencia (Al-Faraa'id)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6723 al 6771, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
