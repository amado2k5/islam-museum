label: { ar: "سنن أبي داود 3870 — الدواء، التداوي بالمحرم", en: "Sunan Abi Dawud 3870 — the drug; treatment with what is forbidden", ur: "سنن ابی داؤد 3870 — دوا، حرام سے علاج", es: "Sunan Abi Dawud 3870 — la droga; tratamiento con lo prohibido", fr: "Sunan Abi Dawud 3870 — la drogue; le traitement par ce qui est interdit" }
text: "حَدَّثَنَا هَارُونُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا مُحَمَّدُ بْنُ بِشْرٍ، حَدَّثَنَا يُونُسُ بْنُ أَبِي إِسْحَاقَ، عَنْ مُجَاهِدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ نَهَى رَسُولُ اللَّهِ عَنِ الدَّوَاءِ الْخَبِيثِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3870، يذكر الدواء، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3870 (Medicine (Kitab Al-Tibb)), that mentions the drug, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3870، جس میں دوا، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3870 (Medicina (Kitab Al-Tibb)), menciona el medicamento y el tratamiento con lo que está prohibido. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, medicamentos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3870 (Médecine (Kitab Al-Tibb)), mentionne un médicament et un traitement interdits. Le Navigateur de Médecine le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
