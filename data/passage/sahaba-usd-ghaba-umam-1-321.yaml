text: "… قد حالف في الجاهلية نُفَيل بن عبد العزى، جَدّ عمر بن الخطاب،، فهو وولده حلفاء بني عَدِيّ. شهد خالد وإخوته بدراً، وبعثه النبي علله مع عبد الله بن جحش إلى عِيْر قُرَيش قَبْل بدر، في رهط من المهاجرين، فيهم: خالد …"
