text: "يا أهل مكة أتموا صلاتكم، فإنا قوم سفر"
summary:
  ar: "أول أثر في باب صلاة المسافر إذا كان إماماً أو كان وراء إمام. يرويه يحيى عن مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه: كان عمر بن الخطاب إذا قدم مكة صلى بأهلها ركعتين ثم يقول: يا أهل مكة أتموا صلاتكم فإنا قوم سفر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وروح بن عبادة وابن وهب عند الطحاوي وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.213}"
