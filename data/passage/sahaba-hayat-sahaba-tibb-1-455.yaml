text: "… وإبتاء الزكاة التى فرض رسول اه طبيبة بها انفسهم فلا يرون عليها بوا! فافهموا ما توعظون به فان الحرب من حرب دينه وإن السعيد من وعظ بغيره وإن الشقى من شق فى بطن أمه وإن شر الأمور مبتدعاتها، : إن …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 455، يذكر الطب والطبيب، وأطوار خلق الجنين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 455, that mentions medicine and the physician, the stages of the embryo; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 455 کا اقتباس جس میں طب اور طبیب، جنین کے مراحل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen escaneado 1, pág. 455, que menciona la medicina y al médico, las etapas del embrión; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 1 scanné, p. 455, qui mentionne la médecine et le médecin, les stades de l'embryon; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Kandhlawi'nin \"Sahabelerin Hayatları\" adlı eserinin resimli 1. cildinin 455. sayfasında tıp ve hekimden, ayrıca fetüsün gelişim aşamalarından bahsedilmektedir; bu alıntı, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah kutipan dari “Kehidupan Para Sahabat” karya Kandhlawi, jilid bergambar 1, hlm. 455, menyebutkan tentang kedokteran dan dokter, serta tahapan perkembangan janin; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
