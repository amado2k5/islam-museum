text: |-
  ٢٤٧
  قول أبى جهل أعمد من سيد قتله قومه والعرب تقبول أعمد من كيل محق أى ه-ل زاد على
  هذاوة ولهم حله على عمود بطمه أى على ظهره وعميد القوم وهمودهم سيدهم والعمدة ما يعتمد
  عليه واعتمدت على الشى اتكأت واعتمدت عليه فى كذا أى اتكلت عليه وعمد النرى
  بالكسر يعمد عم_دااذا بلله المطر وذلك اذا قيضت على شىء منه تعقد وا جتمع من ندوته
  قال الراعى يصف بقرة
  حتى غدت فى بياض الصبح طيبة • ريح المباءة قخدى والترى عد
  ويقال أيضا عمد البعيراذا انفضخ داخل سنامه من الركوب وظاهره صميم فهو بعير عمد
  قال ابيديصف مطرا أسال الاودية
  فيات السيل يركب جانبيه * من البقار كااحمد الثقال
  قال الاصحفى يعو ان السيل يركب جانبيه سحاب كالعمد أى أجاط بدسحاب من تواحبه
  بالمطر ⁦( مرد)⁩ العمرّد الطويل يقال فرس عرّدقال الشاعر
  ضرف سيدافى العنان ممردا وكذلك طريق عمردقال الراجز
  خطارة بالسبسب العمرد • أبوع-روشا وعم-رد
  وأنشدلعوف بن الاحوص
  ثأرت بهم قتلى حنيفة إذ أبت • بنسوتهم الا النجاء العمزدا
  ( عند عند عن الطريق يعند بالضم عنودا أى عدل فه وعنود والعنود أ يضامن النوق
  لتى ترفى ناحية والجمع عند وقول الراجز
  يتبعن ورفا كلون العوهق • لاحقة الرجل عنود المرفق
  يعنى بعيدته من الزوروعفد العرق أيضاسال ولم يرقأ وهوء رق عاند وأعند فى قينه أى أتبع
  بعضه بعضا والعند باتحريك الجانب يقال هو يمشى ومطالاعندا وعنديعند بالكسر
  نودا أى خالف ورد الحق وهو يعرذه فه وعنيد وعاند والجع عندوعند والماند البعير الذى
  يجور عن الطريق ويعدل عن القصد والهع عند مثل راكع وركع وأنشد أبو عسيدة
  اذاركبت فاجعلانى وسطا * انى كبيرلا أطبق العندا
  وجمع العنيد عند مثل رغيف ورغف والعاندان فى قول الراجز يصف نارا
  نظرت والعيز مبينة التهم * الى سناناروودها الرتم * شبت بأعلى عاندين من اضم
  يقمال هما واديان وعانده معاندة وعنادا وعانده أى عارضه قال أبوذؤيب
  وعانده طريق مهيع وطعن عند بالكسراذا كان عمنة وبسرة قال أبو عمر وأخف
  الطعن الولق والعاند مثله وأماعند فحضور الشى ودتوه وفيهاثلاث لغات عند وعند وعند
  وهى ظرف فى المكان والزمان تقول عند الليل وعند الحائط الا أنها ظرف غير متمسكن
  لاتة ول عندك واسع بالرفع وقد أدخلوا عليه من حروف الجر من وحدها كما أدخاوهاعلى
  لدن قال اللّٰه تعالى رحة من عندنا وقال من لدنا ولا يقالمضيت الى عندك ولا الى لدنك وقد
  يغرى بماتقول عندل زيدا أى خذه أبوزيد مالى منه عنددومعندد أى بد وماوجدت
  الى كذامعلندداأى سبيلا عود) عاداليه يعود عودة وه ودارجع وفى المثل
  العودأ حد وقال جزينابى شيبان أمس برضهم • وجتنا بمثل البده والعود أحد
