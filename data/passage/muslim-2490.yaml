label:
  ar: "مسلم 2490 — قد أرسلت عبدا يقول الحق: حسان وهجاء قريش"
  en: "Muslim 2490 — I have sent a servant who speaks the truth: Hassan and the satire on Quraysh"
  ur: "مسلم 2490 — میں نے ایک بندہ بھیجا جو حق کہتا ہے: حسان اور قریش کی ہجو"
  es: "Muslim 2490 — He enviado a un siervo que dice la verdad: Hassan y la sátira sobre los Quraysh"
  fr: "Muslim 2490 — J’ai envoyé un serviteur qui dit la vérité: Hassan et la satire des Quraysh"
  tr: "Müslim 2490 — Doğruyu söyleyen bir kul gönderdim: Hasan ve Kureyş'in hicvi"
  id: "Muslim 2490 — Aku telah mengutus seorang hamba yang berbicara jujur: Hasan dan satire terhadap kaum Quraisy"
text: "اهجوا قريشا فإنه أشد عليها من رشق بالنبل . فأرسل إلى ابن رواحة فقال اهجهم . فهجاهم فلم يرض فأرسل إلى كعب بن مالك ثم أرسل إلى حسان بن ثابت فلما دخل عليه قال حسان قد آن لكم أن ترسلوا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2490: قد أرسلت عبدا يقول الحق: حسان وهجاء قريش. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2490: I have sent a servant who speaks the truth: Hassan and the satire on Quraysh. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2490: میں نے ایک بندہ بھیجا جو حق کہتا ہے: حسان اور قریش کی ہجو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2490: He enviado a un siervo que dice la verdad: Hassan y la sátira sobre los Quraysh. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi dans Sahih Muslim, n° 2490: « J’ai envoyé un serviteur qui dit la vérité: Hassan et la satire des Quraysh. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations à travers les six livres et la Muwatta. »"
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2490: “Aku telah mengutus seorang hamba yang berbicara jujur: Hasan dan satire kaum Quraisy.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
