label:
  ar: "مسلم 2490 — قد أرسلت عبدا يقول الحق: حسان وهجاء قريش"
  en: "Muslim 2490 — I have sent a servant who speaks the truth: Hassan and the satire on Quraysh"
  ur: "مسلم 2490 — میں نے ایک بندہ بھیجا جو حق کہتا ہے: حسان اور قریش کی ہجو"
text: "اهجوا قريشا فإنه أشد عليها من رشق بالنبل . فأرسل إلى ابن رواحة فقال اهجهم . فهجاهم فلم يرض فأرسل إلى كعب بن مالك ثم أرسل إلى حسان بن ثابت فلما دخل عليه قال حسان قد آن لكم أن ترسلوا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2490: قد أرسلت عبدا يقول الحق: حسان وهجاء قريش. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2490: I have sent a servant who speaks the truth: Hassan and the satire on Quraysh. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2490: میں نے ایک بندہ بھیجا جو حق کہتا ہے: حسان اور قریش کی ہجو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
