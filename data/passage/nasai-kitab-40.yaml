summary:
  ar: "القسم 40 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العقيقة»، ويضم فيها النصوص من 4212 إلى 4221 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 40 of Sunan al-Nasa'i (The Book of al-'Aqiqah) in the division of the open hadith dataset the museum took its reports from: reports 4212 to 4221 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 40، عنوان «کتاب العقیقۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4212 تا 4221۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 40 de Sunan al-Nasa'i (El Libro de al-'Aqiqah) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 4212 a 4221 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre d'al-'Aqiqah), dans la partie ouverte de ce recueil (rapports 4212 à 4221). Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 40. bölümü \"Akika Kitabı\" başlığını taşımakta olup, 4212 ile 4221 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 40 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Aqiqah\" dan berisi teks 4212 hingga 4221, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
