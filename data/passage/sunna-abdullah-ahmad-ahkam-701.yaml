text: "مئل عن الخوارج ومن قال: هُم كلاب النار يَقرؤونَ القرآنَ لا يُجاوِزُ تَراقِيَهم، يَمرُقُونَ مِن الدِّينِ كما يَمرُقُ السَّهمُ مِن الرَّمِيَّةِ، قتَالهم حقٌّ على كلِّ مسلم. - ثني أبي، ثنا محمد بن أبي عَدِي أبو عَمرو دُكين - مِن الرِّجَالِ …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 701، يرد فيه ذكر ما وجب على كل مسلم، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 701, whose wording mentions a duty laid on every Muslim, a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 701 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 701, dont le texte mentionne un devoir imposé à chaque musulman, un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 701, cuyo texto menciona un deber impuesto a cada musulmán, un derecho debido por cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, her Müslümanın yükümlülüklerini ve haklarını anlatan 701. sayfadan bir alıntı; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Zorunlu fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram kılınan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 701, yang menyebutkan kewajiban dan hak setiap Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
