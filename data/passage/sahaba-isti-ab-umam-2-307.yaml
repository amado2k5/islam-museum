text: "… ابن بيضاء بمكَّة، وأخفى إسلامه، عنه حِين خرج من المدينة إِلى البصرة، ثم شهد مع عليّ صفين، وولاه على فارس، فأَخرجَه أهل فارس، فأخرجته قريش معهم إلى بدر، فأسر يومئذ مع فوجه عليٌّ زيادًا، فأَرضَوْه وصالحوه، وأدَّوا الخراج. المشركين، فشهد …"
