label: { ar: "الموطأ 2361 — مالك: من أعتق في مرضه بعد مدبر، والبدء بالمدبر", en: "Muwatta 2361" }
summary:
  ar: "قال مالك في رجل أعتق نصف عبد له وهو مريض فبت عتق نصفه، أو بت عتقه كله، وكان قد دبر عبدا له آخر قبل ذلك: يُبدأ بالمدبر قبل الذي أعتقه وهو مريض، لأنه ليس للرجل أن يرد ما دبر، ولا أن يتعقبه بأمر يرده به. فإذا عتق المدبر، فليكن ما بقي من الثلث في الذي أعتق شطره، حتى يستتم عتقه كله في ثلث مال الميت، فإن لم يبلغ ذلك فضل الثلث عتق منه ما بلغ الفضل. {cite:muwatta-maruf-1997 p.373}"
