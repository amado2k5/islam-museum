label: { ar: "الموطأ 2361 — مالك: من أعتق في مرضه بعد مدبر، والبدء بالمدبر", en: "Muwatta 2361", es: "Muwatta 2361", fr: "Muwatta 2361", ur: "موطا 2361" }
summary:
  ar: "قال مالك في رجل أعتق نصف عبد له وهو مريض فبت عتق نصفه، أو بت عتقه كله، وكان قد دبر عبدا له آخر قبل ذلك: يُبدأ بالمدبر قبل الذي أعتقه وهو مريض، لأنه ليس للرجل أن يرد ما دبر، ولا أن يتعقبه بأمر يرده به. فإذا عتق المدبر، فليكن ما بقي من الثلث في الذي أعتق شطره، حتى يستتم عتقه كله في ثلث مال الميت، فإن لم يبلغ ذلك فضل الثلث عتق منه ما بلغ الفضل. {cite:muwatta-maruf-1997 p.373}"
  tr: "Malik, hastayken kölesinin yarısını azat eden ve daha sonra kölesinin yarısının veya tamamının azat edilmesi kesinleşen, ayrıca daha önce başka bir kölesinin ölümü üzerine bir kölesine özgürlük vermiş olan bir adam hakkında şöyle demiştir: Başka bir kölenin ölümü üzerine özgürlüğü verilen köle, hastayken azat edilen köleden önce azat edilmelidir; çünkü adam verdiği sözü geri alamaz, onu geçersiz kılacak herhangi bir dava ile de takip edemez. Başka bir kölenin ölümü üzerine özgürlüğü verilen köle azat edilirse, mirasın üçte birinden geriye kalan kısım, ölen kişinin mirasının üçte birine kadar tam özgürlüğüne kavuşana kadar, kölenin yarısını azat eden kişiye verilmelidir. Bu, kalan üçte bire ulaşmazsa, kölenin kalan üçte birine ulaşan kısmı azat edilmelidir. {cite:muwatta-maruf-1997 s.373}"
  id: "Malik berkata mengenai seorang pria yang membebaskan setengah dari budaknya ketika sakit, dan kemudian pembebasan setengah atau seluruhnya diselesaikan, dan sebelumnya ia telah memberikan kebebasan kepada seorang budak setelah kematian budak lainnya: Budak yang dibebaskan setelah kematian budak lain harus dibebaskan sebelum budak yang dibebaskan ketika sakit, karena pria tersebut tidak dapat mencabut apa yang telah diberikannya, dan ia juga tidak dapat menuntutnya dengan tindakan apa pun yang akan membatalkannya. Jika budak yang dibebaskan setelah kematian budak lain dibebaskan, maka sisa sepertiga dari harta warisan harus diberikan kepada orang yang membebaskan setengah dari budak tersebut, sampai kebebasan penuhnya tercapai dalam sepertiga dari harta warisan almarhum. Jika itu tidak mencapai sepertiga yang tersisa, maka bagian budak yang mencapai sepertiga yang tersisa harus dibebaskan. {cite:muwatta-maruf-1997 p.373}"
