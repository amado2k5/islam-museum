ref: "1525"
label:
  ar: "النسائي 1525 — أصبح من عبادي مؤمن بي وكافر"
  en: "Nasa'i 1525 — Some of My servants have woken as believers in Me and some as deniers"
  ur: "نسائی 1525 — میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ"
text: "ألم تسمعوا ماذا قال ربكم الليلة قال ما أنعمت على عبادي من نعمة إلا أصبح طائفة منهم بها كافرين يقولون مطرنا بنوء كذا وكذا فأما من آمن بي وحمدني على سقياى فذلك الذي آمن بي وكفر بالكوكب ومن قال مطرنا …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 1525: أصبح من عبادي مؤمن بي وكافر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 1525: Some of My servants have woken as believers in Me and some as deniers. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 1525: میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
