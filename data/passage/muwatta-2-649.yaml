label: { ar: "الموطأ 649 — أبو النضر مرسلاً: لما مات عثمان بن مظعون ومر بجنازته: ذهبت ولم تلبس منها بشيء", en: "Muwatta 649" }
text: "ذهبت ولم تلبس منها بشيء"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله مرسلاً، أن النبي قال لما مات عثمان بن مظعون ومُر بجنازته: ذهبت ولم تلبّس منها بشيء، أي من الدنيا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 21/223–224) أنه مرسل عند جماعة الرواة، وأنه رواه متصلاً من وجه حسن من طريق يحيى بن سعيد عن القاسم عن عائشة، ويضيف أن الثوري روى عن عاصم بن عبيد الله عن القاسم عن عائشة أن النبي قبّل عثمان بن مظعون وهو ميت وهو يبكي، عند أبي داود (3163) والترمذي (989) وابن ماجة (1456) والحاكم، وقال الترمذي: حسن صحيح، مع أن في إسناده عاصم بن عبيد الله الذي قال فيه البخاري: منكر الحديث. {cite:muwatta-maruf-1997 p.331}"
