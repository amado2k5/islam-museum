label: { ar: "الموطأ 649 — أبو النضر مرسلاً: لما مات عثمان بن مظعون ومر بجنازته: ذهبت ولم تلبس منها بشيء", en: "Muwatta 649", es: "Muwatta 649", fr: "Muwatta 649", ur: "موطا 649", tr: "El-Muvatta 649 — Ebu el-Nadr, mursal: Osman ibn Maz'un öldüğünde ve cenaze alayı geçerken, o da gitti ve ondan hiçbir şey giymedi.", id: "Al-Muwatta 649 — Abu al-Nadr, mursal: Ketika Utsman bin Maz'un meninggal dan melewati iring-iringan jenazahnya: dia pergi dan tidak mengenakan apa pun dari iring-iringan tersebut" }
text: "ذهبت ولم تلبس منها بشيء"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله مرسلاً، أن النبي قال لما مات عثمان بن مظعون ومُر بجنازته: ذهبت ولم تلبّس منها بشيء، أي من الدنيا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر ⁦(التمهيد 21/223–224)⁩ أنه مرسل عند جماعة الرواة، وأنه رواه متصلاً من وجه حسن من طريق يحيى بن سعيد عن القاسم عن عائشة، ويضيف أن الثوري روى عن عاصم بن عبيد الله عن القاسم عن عائشة أن النبي قبّل عثمان بن مظعون وهو ميت وهو يبكي، عند أبي داود (3163) والترمذي (989) وابن ماجة (1456) والحاكم، وقال الترمذي: حسن صحيح، مع أن في إسناده عاصم بن عبيد الله الذي قال فيه البخاري: منكر الحديث. {cite:muwatta-maruf-1997 p.331}"
  tr: "Malik, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan rivayetle, Peygamberimizin Osman ibn Maz'un vefat edip cenaze alayı geçerken şöyle buyurduğunu mursal bir hadis olarak aktarır: \"O, bu dünyadan hiçbir şey elde etmeden ayrıldı.\" Yani dünyevi mallardan hiçbir şey elde edemeden gitti. Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtir ve İbn Abd el-Barr'ın (el-Tamhid 21/223-224) bunun bir grup ravi tarafından mursal olduğunu ve Yahya ibn Sa'id'den, el-Kâsım'dan, o da Aişe'den sahih bir isnad zinciriyle naklettiğini söylediğini aktarır. El-Seviri'nin, Asim ibn Ubeydullah'tan, o da el-Kasım'dan, o da Ayşe'den rivayetle, Peygamber'in Osman ibn Maz'un'u ölü ve ağlarken öptüğünü, bunun da Ebu Davud (3163), Tirmizi (989), İbn Mâce (1456) ve Hakim tarafından kaydedildiğini ekliyor. Tirmizi şöyle demiştir: \"Hasen sahihtir (iyi ve sahih)\", ancak isnad zincirinde Asim ibn Ubeydullah da yer almaktadır; El-Buhari ise onun hakkında \"Münker (reddedilmiş) bir ravi\" demiştir. {cite:muwatta-maruf-1997 s.331}"
  id: "Malik meriwayatkannya dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, sebagai hadits mursal, bahwa Nabi bersabda, ketika Utsman ibn Maz'un wafat dan iring-iringan jenazahnya lewat: \"Dia pergi tanpa memperoleh apa pun darinya,\" yang berarti harta duniawi. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan mengutip Ibnu Abd al-Barr (al-Tamhid 21/223-224) yang mengatakan bahwa hadits ini mursal menurut sekelompok perawi, dan bahwa ia meriwayatkannya dengan sanad yang sahih melalui Yahya ibn Sa'id, dari al-Qasim, dari Aisyah. Ia menambahkan bahwa al-Thawri meriwayatkan dari Asim ibn Ubayd Allah, dari al-Qasim, dari Aisyah, bahwa Nabi mencium Utsman ibn Maz'un ketika ia telah meninggal dan menangis, sebagaimana dicatat oleh Abu Dawud (3163), al-Tirmidhi (989), Ibn Majah (1456), dan al-Hakim. Al-Tirmidhi berkata: Hadits ini hasan sahih (baik dan sahih), meskipun sanadnya mencakup Asim ibn Ubayd Allah, yang tentangnya al-Bukhari berkata: Ia adalah perawi munkar (tertolak). {cite:muwatta-maruf-1997 p.331}"
