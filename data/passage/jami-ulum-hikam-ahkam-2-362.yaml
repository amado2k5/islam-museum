text: "… والصِّلةُ والإحسانُ إلى الضيف بقدر ما يحصل به قِراه على ما سبق ذكره. وتارةً يكونُ للندب كصدقةِ التطوعِ ونحوها. وهذا الحديثُ يدلُّ على وجوب الإحسانِ في كل شيء من الأعمال، لكن إحسانُ كُلِّ شيء بحسبه، فالإحسانُ في الإتيان بالواجبات الظاهرة …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 362، يرد فيه ذكر الواجب، والوجوب، والمندوب، والتطوع، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 362, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), the voluntary act (tatawwu'), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 362 کا اقتباس جس میں واجب، وجوب، مندوب، تطوع ⁦(نفلی عمل)⁩، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
