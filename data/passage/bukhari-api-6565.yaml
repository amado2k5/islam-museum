label: { ar: "صحيح البخاري 6565 — مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 6565 — forgiveness of past sins", ur: "صحیح بخاری 6565 — پچھلے گناہوں کی مغفرت" }
text: "… فَيَأْتُونَهُ فَيَقُولُ لَسْتُ هُنَاكُمْ، فَيَذْكُرُ خَطِيئَتَهُ ـ ائْتُوا عِيسَى فَيَأْتُونَهُ فَيَقُولُ لَسْتُ هُنَاكُمْ، ائْتُوا مُحَمَّدًا فَقَدْ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ وَمَا تَأَخَّرَ فَيَأْتُونِي فَأَسْتَأْذِنُ عَلَى رَبِّي، فَإِذَا رَأَيْتُهُ وَقَعْتُ سَاجِدًا، فَيَدَعُنِي مَا شَاءَ اللَّهُ، ثُمَّ يُقَالُ ارْفَعْ رَأْسَكَ، سَلْ تُعْطَهْ، وَقُلْ يُسْمَعْ، وَاشْفَعْ تُشَفَّعْ. فَأَرْفَعُ رَأْسِي، فَأَحْمَدُ رَبِّي بِتَحْمِيدٍ يُعَلِّمُنِي، ثُمَّ أَشْفَعُ فَيَحُدُّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6565، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 6565 (To make the Heart Tender (Ar-Riqaq)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 6565، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
