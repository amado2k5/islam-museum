text: "… فأبيح بعض محرماته فى وقت وبعضها فى وقت • والله أعلم • قال أصحابنا. ويحل بالتحلل الأول فى الحج اللبس والقلم وستر الرأس والحلق إن لم نجعله نسكا بلا خلاف، ولا يحل الجماع إلا بالتحللين بلا خلاف، والمستحب أن لا …"
summary:
  ar: "مقطع من المجموع للنووي، ص 211، يرد فيه ذكر المستحب، والمباح، وما لا يحل، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 211, whose wording mentions the recommended (mustahabb), the permitted (mubah), what is not lawful, the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 211 کا اقتباس جس میں مستحب، مباح، جو حلال نہیں، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 211, dont le texte mentionne le recommandé (mustahabb), le permis (mubah), ce qui n'est pas licite, les choses interdites ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
