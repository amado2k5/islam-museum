text: "… : إِنَّ عُمَرَ بنَ الخَطَّابِ قَدْ أَتَانِي فَقَالَ : إِنَّ القَتْلَ قَدِ اسْتَحَرَّ بِقُرَّاءٍ القُرْآنِ يَوْمَ اليَمَامَةِ، وَإِنِّي لأَخْشَى أَنْ يَسْتَجِرَّ القَتْلُ بِالقُرَّاءِ فِي المَوَاطِنِ كُلِّهَا، فَيَذْهَبَ قُرْآنٌ كَثِيرٌ، وَإِنِّي أَرَى أَنْ تَأْمُرَ بِجَمْعِ القُرْآنِ. قَالَ أَبُو بَكْرٍ لِعُمَرَ : …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 1056، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 1056, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 1056 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 2, pág. 1056, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Jami' al-Tirmidhi, volume 2, page 1056, mentionne les lecteurs, la collecte du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 1056. sayfasından, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 1056, yang menyebutkan para qari, penyusunan Al-Qur'an, dan manuskrip; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
