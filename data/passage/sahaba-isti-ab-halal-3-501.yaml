text: "… ويقالُ : الأزدي، والأكثر : الجهني، وهذا الأصح إِن شاء اللّٰه تعالى، يكنى أَبا مريم، أتى النَّبي وَليفِ فأسلم، وقال : آمنت كلِّ ما جئت به من حلال وحرام، وإن أرغم ذلك كثيراً من الأقوام... في حديث طويل ذكره. كان …"
