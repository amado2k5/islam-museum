text: "… وذكر شعب النفاق، وقال: من كانت فيه شعبة منهن كانت فيه شعبة من النفاق حتى يدعها وتلك الشعبة قد يكون معها كثير من شعب الإيمان، ولهذا قال: يخرج من النار من كان في قلبه مثقال ذرة من إيمان فعلم أن …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 263، يذكر شعب الإيمان، وتفاضل الإيمان في القلوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 263, that mentions the branches of faith, the degrees of faith in hearts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 263 کا اقتباس جس میں ایمان کی شاخیں، دلوں میں ایمان کے درجے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 1, pág. 263, que menciona las ramas de la fe y los grados de fe en los corazones; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 1, p. 263) évoquant les branches de la foi et les degrés de foi dans les cœurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Taymiyye'nin \"İman\" (İman) adlı eserinin 1. cildinin 263. sayfasından, imanın dalları ve kalplerdeki imanın farklı derecelerini ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 263, yang membahas cabang-cabang iman dan berbagai tingkatan iman dalam hati; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
