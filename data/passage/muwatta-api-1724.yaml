label: { ar: "موطأ مالك 1724 — الكي، الرقية", en: "Muwatta Malik 1724 — cautery; ruqya recited over the sick", ur: "موطأ مالک 1724 — داغنا، رقیہ", es: "Muwatta Malik 1724 — cauterización; ruqya recitada sobre el enfermo", fr: "Muwatta Malik 1724 — cautérisation; ruqya récitée sur les malades", tr: "Muwatta Malik 1724 - Dağlama, Ruqyah", id: "Muwatta Malik 1724 — Kauterisasi, Ruqyah" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ نَافِعٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، اكْتَوَى مِنَ اللَّقْوَةِ وَرُقِيَ مِنَ الْعَقْرَبِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1724، يذكر الكي، والرقية، وأسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1724 (The Evil Eye), that mentions cautery, ruqya recited over the sick, named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1724، جس میں داغنا، رقیہ، بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1724 (El mal de ojo), menciona la cauterización, la ruqya recitada sobre los enfermos y las enfermedades específicas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik n° 1724 (Le Mauvais Œil) mentionne la cautérisation, la roqya récitée sur les malades et nomme certaines maladies. Le Répertoire des ouvrages de médecine le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta'sında yer alan 1724 numaralı hadiste, dağlama, dualar ve hastalıkların isimlerinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1724, menyebutkan tentang kauterisasi, mantra, dan nama-nama penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
