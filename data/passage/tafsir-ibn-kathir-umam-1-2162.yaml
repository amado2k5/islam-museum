text: "… اللّٰه وسلامه عليه- وطاعته فيما أمرهم، فتحوا القلوب والأقاليم شرقًا وغربًا في المدة اليسيرة، مع قلَّة عَدَدهم بالنَّسبة إلىٰ جيوش سائر الأقاليم، من الرُّوم والفرس والتُّرك والصقالبة والبربر والحبُوش وأصناف السُّودان والقِبْط، وطوائف بني آدم، قهروا الجميع حتى عَلَتْ كلمة …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 2162، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 2162, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 2162 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
