label: { ar: "الموطأ 272 — مالك: من انتقض وضوؤه بعد غسل الجمعة فعليه الوضوء فقط", en: "Muwatta 272", es: "Muwatta 272", fr: "Muwatta 272", ur: "موطا 272", tr: "Al-Muwatta 272 — Malik: Cuma günü kılınan gusül abdestinden sonra abdesti bozulan kimsenin yeniden abdest alması yeterlidir.", id: "Al-Muwatta 272 — Malik: Barangsiapa yang wudhunya batal setelah mandi Jumat, maka ia hanya perlu berwudhu lagi." }
summary:
  ar: "قول لمالك في باب العمل في غسل يوم الجمعة: من اغتسل يوم الجمعة معجّلاً أو مؤخّراً ينوي به غسل الجمعة ثم أصابه ما ينقض وضوءه، فليس عليه إلا الوضوء وغسله ذلك مجزئ عنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.159}"
  tr: "Malik, Cuma günü yapılan gusül abdesti hakkındaki bölümde şöyle buyurmuştur: \"Cuma günü gusül abdesti almak niyetiyle, ister erken ister geç olsun, gusül abdesti alan kimse, abdestini bozan bir şey olursa, sadece yeniden abdest alması yeterlidir ve önceki gusül abdesti geçerlidir.\" Araştırmacı, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.159}"
  id: "Malik berkata dalam bab tentang wudhu Jumat: Barang siapa berwudhu pada hari Jumat, baik pagi maupun sore, dengan niat menjadikannya wudhu Jumat, lalu terjadi sesuatu yang membatalkan wudhunya, maka ia hanya perlu berwudhu lagi, dan wudhu sebelumnya sudah cukup. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.159}"
