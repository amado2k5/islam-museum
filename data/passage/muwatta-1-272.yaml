summary:
  ar: "قول لمالك في باب العمل في غسل يوم الجمعة: من اغتسل يوم الجمعة معجّلاً أو مؤخّراً ينوي به غسل الجمعة ثم أصابه ما ينقض وضوءه، فليس عليه إلا الوضوء وغسله ذلك مجزئ عنه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.159}"
