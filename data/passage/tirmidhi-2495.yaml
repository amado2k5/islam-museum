label:
  ar: "الترمذي 2495 — يا عبادي كلكم ضال إلا من هديت"
  en: "Tirmidhi 2495 — My servants, all of you are astray except those I guide"
  ur: "ترمذی 2495 — اے میرے بندو، تم سب گمراہ ہو سوائے اس کے جسے میں ہدایت دوں"
text: "يقول الله تعالى يا عبادي كلكم ضال إلا من هديته فسلوني الهدى أهدكم وكلكم فقير إلا من أغنيت فسلوني أرزقكم وكلكم مذنب إلا من عافيت فمن علم منكم أني ذو قدرة على المغفرة فاستغفرني غفرت له ولا أبالي ولو أن …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2495: يا عبادي كلكم ضال إلا من هديت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2495: My servants, all of you are astray except those I guide. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2495: اے میرے بندو، تم سب گمراہ ہو سوائے اس کے جسے میں ہدایت دوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
