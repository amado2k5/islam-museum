text: "مس، واجتناب(٢) الكبائر، كما ورد في الخبر، وكما قررنا حقيقته في كتاب التوبة، من كتاب إحياء علوم الدين (٣) . فإن قيل: لم لم تثبت عصمتهم بدليل العقل!، لأنهم لو لم يعصموا ، لنفرت قلوب الخلق عنهم. قلنا: لا يجب"
