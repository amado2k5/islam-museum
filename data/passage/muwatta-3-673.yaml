label: { ar: "الموطأ 673 — عائشة تلي بنات أخيها اليتامى ولهن الحلي فلا تخرج من حليهن الزكاة", en: "Muwatta 673" }
summary:
  ar: "أول حديث في باب ما لا زكاة فيه من الحلي والتبر والعنبر. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه، أن عائشة زوج النبي كانت تلي بنات أخيها يتامى في حجرها لهن الحلي، فلا تخرج من حليهن الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومن طريقه البيهقي، ومحمد بن الحسن الشيباني (329)، ويحيى بن بكير عند البيهقي (4/138). {cite:muwatta-maruf-1997 p.341}"
