label: { ar: "الموطأ 673 — عائشة تلي بنات أخيها اليتامى ولهن الحلي فلا تخرج من حليهن الزكاة", en: "Muwatta 673", es: "Muwatta 673", fr: "Muwatta 673", ur: "موطا 673", tr: "Al-Muwatta 673 — Ayşe, yetim yeğenlerinin vasisidir ve onların mücevherleri vardır; bu nedenle zekât, onların mücevherlerinden ödenmez.", id: "Al-Muwatta 673 — Aisyah adalah wali dari keponakan-keponakannya yang yatim piatu, dan mereka memiliki perhiasan, maka zakat tidak boleh dibayarkan dari perhiasan mereka." }
summary:
  ar: "أول حديث في باب ما لا زكاة فيه من الحلي والتبر والعنبر. يرويه مالك عن عبد الرحمن بن القاسم عن أبيه، أن عائشة زوج النبي كانت تلي بنات أخيها يتامى في حجرها لهن الحلي، فلا تخرج من حليهن الزكاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومن طريقه البيهقي، ومحمد بن الحسن الشيباني (329)، ويحيى بن بكير عند البيهقي (4/138). {cite:muwatta-maruf-1997 p.341}"
  tr: "Zekattan muaf olan şeylerle ilgili bölümdeki ilk hadis, mücevher, altın ve amber gibi şeylerdir. Malik, Abdülrahman ibn el-Kâsım'dan, o da babasından rivayet ettiğine göre, Peygamberimizin eşi Ayşe, mücevherleri olan yetim yeğenlerinin vasisiydi ve onların mücevherlerinden zekât verilmezdi. Editör, bu hadisin Malik'ten Ebu Musab, Suveyd ve Şafiî tarafından Musned'inde, onun isnadından da Beyhaki, Muhammed ibn el-Hasan el-Şeybani (329) ve Yahya ibn Bukayr tarafından Beyhaki'nin (4/138) kaydettiği şekilde rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.341}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang dikecualikan dari zakat, seperti perhiasan, emas, dan ambergris. Diriwayatkan oleh Malik dari Abd al-Rahman ibn al-Qasim, dari ayahnya, bahwa Aisyah, istri Nabi, adalah wali dari keponakan-keponakannya yang yatim piatu yang memiliki perhiasan, dan zakat tidak perlu dibayarkan atas perhiasan mereka. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, dan al-Shafi'i dalam Musnadnya, dan dari sanadnya oleh al-Bayhaqi, Muhammad ibn al-Hasan al-Shaybani (329), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (4/138). {cite:muwatta-maruf-1997 p.341}"
