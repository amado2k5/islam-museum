  tr: "Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Kralların ve Milletlerin Tarihindeki Düzenlilik), Resimli Cilt 1, s. 146'dan bir alıntı; ölen kişi için yazılmış bir ağıt ve övgü içeriyor; makineyle okunabilir tıpkıbasım baskısından. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgülerin bir tarayıcısı tarafından derlenmiştir."
