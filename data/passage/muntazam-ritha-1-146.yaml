text: "… بن على قال حدثنى عيد العزيز بن على - الازجى حدثنا بن احمد المفيد - قال سمعت ابا الحسن على بن ابراهيم الرازى يقول حكى لى ابو خلف الوزان عن يوسف بن الحسين انه رثى فى المنام فقيل له ما …"
summary:
