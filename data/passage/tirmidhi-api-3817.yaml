label: { ar: "جامع الترمذي 3817 — ساعة الاحتضار والوفاة", en: "Jami' al-Tirmidhi 3817 — a deathbed and last hours", ur: "جامع ترمذی 3817 — وقتِ وفات اور آخری لمحات", es: "Jami' al-Tirmidhi 3817 — lecho de muerte y últimas horas", fr: "Jami' al-Tirmidhi 3817 — un lit de mort et les dernières heures" }
text: "… بْنُ بُكَيْرٍ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، عَنْ سَعِيدِ بْنِ عُبَيْدِ بْنِ السَّبَّاقِ، عَنْ مُحَمَّدِ بْنِ أُسَامَةَ بْنِ زَيْدٍ، عَنْ أَبِيهِ، قَالَ لَمَّا ثَقُلَ رَسُولُ اللَّهِ هَبَطْتُ وَهَبَطَ النَّاسُ الْمَدِينَةَ فَدَخَلْتُ عَلَى رَسُولِ اللَّهِ وَقَدْ أُصْمِتَ فَلَمْ يَتَكَلَّمْ فَجَعَلَ رَسُولُ اللَّهِ يَضَعُ يَدَيْهِ عَلَىَّ وَيَرْفَعُهُمَا فَأَعْرِفُ أَنَّهُ يَدْعُو لِي. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3817، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3817 (Chapters on Virtues), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3817، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3817 (Capítulos sobre las virtudes), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un récit du Jami' al-Tirmidhi, n° 3817 (Chapitres sur les vertus), évoque un lit de mort et les dernières heures. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
