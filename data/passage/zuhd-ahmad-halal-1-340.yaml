text: "… وما ظلمهم اللّٰه وما اللّٰه بظلام للعبيد، ثم أتي على قوم بين أيديهم لحم من قدر نضيج ولحم آخر خبيث، فجعلوا يأكلون من الخبيث ويدعون النضيج الطيب فقال: يا جبريل من هؤلاء؟ فقال: هذا الرجل يقوم وعنده امرأة حلالًا طيبًا …"
