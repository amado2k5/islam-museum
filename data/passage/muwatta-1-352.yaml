label: { ar: "الموطأ 352 — أبو أيوب: من أعاد مع الإمام فله سهم جمع", en: "Muwatta 352", es: "Muwatta 352", fr: "Muwatta 352", ur: "موطا 352", tr: "El-Muvatta 352 — Ebu Eyyub: İmamla birlikte namazı tekrarlayan kimse cemaatten pay alır.", id: "Al-Muwatta 352 — Abu Ayyub: Barangsiapa mengulangi salat bersama Imam, ia akan mendapat bagian dari jamaah." }
text: "نعم فصل معه، فإن من صنع ذلك فإن له سهم جمع أو مثل سهم جمع"
summary:
  ar: "أثر يرويه مالك عن عفيف بن عمرو السهمي عن رجل من بني أسد، في باب إعادة الصلاة مع الإمام: سأل أبا أيوب الأنصاري أنه يصلي في بيته ثم يأتي المسجد فيجد الإمام يصلي أفيصلي معه، فقال: نعم فصل معه، فإن من صنع ذلك فله سهم جمع أو مثل سهم جمع، أي نصيب من أجر الجماعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.194}"
  tr: "Malik'in, Afif ibn Amr el-Sahmi'den, o da Beni Asad'dan bir adamdan rivayet ettiği, imamla birlikte namazı tekrarlama bölümünde yer alan bir rivayette şöyle denmektedir: Malik, Ebu Eyyub el-Ensari'ye evde namaz kıldıktan sonra mescide gidip imamı namaz kılarken görürse, onunla birlikte namaz kılıp kılmaması gerektiğini sormuştur. Ebu Eyyub el-Ensari şöyle cevap vermiştir: \"Evet, onunla birlikte namaz kıl, çünkü bunu yapan cemaat namazının sevabından bir pay veya ona benzer bir pay alır.\" Editör, bu rivayetin Malik'ten Ebu Musab, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.194}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Afif ibn Amr al-Sahmi, dari seorang laki-laki dari Banu Asad, dalam bab tentang mengulang salat bersama imam: Ia bertanya kepada Abu Ayyub al-Ansari apakah ia salat di rumah lalu pergi ke masjid dan mendapati imam sedang salat, dan apakah ia harus salat bersamanya. Ia menjawab: Ya, salatlah bersamanya, karena siapa pun yang melakukannya akan mendapatkan bagian dari pahala salat berjamaah, atau sesuatu yang mirip dengan bagian dari pahala salat berjamaah. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Musab, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.194}"
