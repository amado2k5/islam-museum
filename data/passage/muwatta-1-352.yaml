label: { ar: "الموطأ 352 — أبو أيوب: من أعاد مع الإمام فله سهم جمع", en: "Muwatta 352" }
text: "نعم فصل معه، فإن من صنع ذلك فإن له سهم جمع أو مثل سهم جمع"
summary:
  ar: "أثر يرويه مالك عن عفيف بن عمرو السهمي عن رجل من بني أسد، في باب إعادة الصلاة مع الإمام: سأل أبا أيوب الأنصاري أنه يصلي في بيته ثم يأتي المسجد فيجد الإمام يصلي أفيصلي معه، فقال: نعم فصل معه، فإن من صنع ذلك فله سهم جمع أو مثل سهم جمع، أي نصيب من أجر الجماعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.194}"
