label: { ar: "الموطأ 2507 — ربيعة عن سعيد بن المسيب: عقل أصابع المرأة", en: "Muwatta 2507", es: "Muwatta 2507", fr: "Muwatta 2507", ur: "موطا 2507", tr: "El-Muvatta 2507 — Rabi’ah, Sa’id ibn al-Musayyab’dan rivayetle: Bir kadının parmaklarının sebebi", id: "Al-Muwatta 2507 — Rabi’ah berdasarkan riwayat Sa’id ibn al-Musayyab: Alasan adanya jari-jari wanita" }
summary:
  ar: "يروي يحيى عن مالك عن ربيعة بن أبي عبد الرحمن أنه سأل سعيد بن المسيب: كم في إصبع المرأة؟ قال: عشر من الإبل. وكم في إصبعين؟ قال: عشرون. وكم في ثلاث؟ قال: ثلاثون. وكم في أربع؟ قال: عشرون. فقال ربيعة: حين عظم جرحها واشتدت مصيبتها نقص عقلها؟ فقال سعيد: أعراقي أنت؟ فقال ربيعة: بل عالم متثبت أو جاهل متعلم. فقال سعيد: هي السنة يا ابن أخي. {cite:muwatta-maruf-1997 p.430}"
  tr: "Yahya, Malik'ten, o da Rabi'ah ibn Abi Abd al-Rahman'dan rivayet ettiğine göre, Sa'id ibn al-Musayyab'a sordu: \"Bir kadının parmağı için ne kadar tazminat gerekir?\" Sa'id şöyle cevap verdi: \"On deve.\" \"İki parmak için ne kadar?\" Sa'id şöyle cevap verdi: \"Yirmi.\" \"Üç parmak için ne kadar?\" Sa'id şöyle cevap verdi: \"Otuz.\" \"Dört parmak için ne kadar?\" Sa'id şöyle cevap verdi: \"Yirmi.\" Rabi'ah daha sonra şöyle dedi: \"Yarası ağırlaştığında ve acısı şiddetlendiğinde aklı azaldı mı?\" Sa'id sordu: \"Sen Iraklı mısın?\" Rabi'ah şöyle cevap verdi: \"Daha ziyade, ben bilgili bir âlim veya cahil bir öğrenciyim.\" Sa'id dedi ki: \"Bu sünnettir, yeğenim.\" {cite:muwatta-maruf-1997 s.430}"
  id: "Yahya meriwayatkan dari Malik, dari Rabi'ah ibn Abi Abd al-Rahman, bahwa ia bertanya kepada Sa'id ibn al-Musayyab: \"Berapa ganti rugi untuk jari seorang wanita?\" Ia menjawab: \"Sepuluh unta.\" \"Dan berapa untuk dua jari?\" Ia menjawab: \"Dua puluh.\" \"Dan berapa untuk tiga?\" Ia menjawab: \"Tiga puluh.\" \"Dan berapa untuk empat?\" Ia menjawab: \"Dua puluh.\" Rabi'ah kemudian berkata: \"Ketika lukanya menjadi parah dan penderitaannya semakin berat, apakah kecerdasannya menurun?\" Sa'id bertanya: \"Apakah engkau orang Irak?\" Rabi'ah menjawab: \"Lebih tepatnya, aku seorang ulama yang berilmu atau seorang pelajar yang kurang berilmu.\" Sa'id berkata: \"Itulah Sunnah, wahai keponakanku.\" {cite:muwatta-maruf-1997 p.430}"
