label: { ar: "الموطأ 2507 — ربيعة عن سعيد بن المسيب: عقل أصابع المرأة", en: "Muwatta 2507" }
summary:
  ar: "يروي يحيى عن مالك عن ربيعة بن أبي عبد الرحمن أنه سأل سعيد بن المسيب: كم في إصبع المرأة؟ قال: عشر من الإبل. وكم في إصبعين؟ قال: عشرون. وكم في ثلاث؟ قال: ثلاثون. وكم في أربع؟ قال: عشرون. فقال ربيعة: حين عظم جرحها واشتدت مصيبتها نقص عقلها؟ فقال سعيد: أعراقي أنت؟ فقال ربيعة: بل عالم متثبت أو جاهل متعلم. فقال سعيد: هي السنة يا ابن أخي. {cite:muwatta-maruf-1997 p.430}"
