label: { ar: "مسلم 2486 — اهجهم وجبريل معك", en: "Muslim 2486 — Satirise them, and Jibril is with you" }
text: "سمعت رسول الله يقول لحسان بن ثابت: «اهجهم — أو هاجهم — وجبريل معك»؛ وفي رواية يوم قريظة: «اهج المشركين فإن جبريل معك»"
summary:
  ar: "رواية البراء بن عازب في باب فضائل حسان بن ثابت من صحيح مسلم؛ النبي يأذن لحسان بهجاء المشركين بتأييد جبريل — نص الشعر في نصرة الرسالة، ومنه منبر حسان في المسجد."
