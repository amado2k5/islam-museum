text: "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلاَنَ، حَدَّثَنَا أَبُو دَاوُدَ، عَنْ شُعْبَةَ، عَنْ أَبِي إِسْحَاقَ، عَنِ الأَسْوَدِ بْنِ يَزِيدَ، أَنَّ ابْنَ الزُّبَيْرِ، قَالَ لَهُ حَدِّثْنِي بِمَا، كَانَتْ تُفْضِي إِلَيْكَ أُمُّ الْمُؤْمِنِينَ يَعْنِي عَائِشَةَ فَقَالَ حَدَّثَتْنِي أَنَّ رَسُولَ اللَّهِ قَالَ لَهَا \" لَوْلاَ أَنَّ قَوْمَكِ حَدِيثُو عَهْدٍ بِالْجَاهِلِيَّةِ لَهَدَمْتُ الْكَعْبَةَ وَجَعَلْتُ لَهَا بَابَيْنِ \". قَالَ فَلَمَّا مَلَكَ ابْنُ الزُّبَيْرِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 875، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 875 (The Book on Hajj), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 875، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
