text: |-
  ١٠٦
  ⁦(ياب الرا.)⁩
  ترى السامح انحتذيذ منها كانما •. جرى بين ليقيه الى الخد أنضر
  والنضار الذهب وكذلك النضير قال الاعشى
  أذا جردت يوماحسبت خيصة • عليه اوجر يال النضير الدلامضا
  ويقال النضار الخالص من كل شئ هال الشاءر
  الخالطين نحبتهم بنضارهم * وذوى الغنى منهم بذى الفقر
  وقدح نضار يتخذ من أثل يكون بالغورورسى اللون يضاف ولا يضاف وبنو النضر حى من
  جود خيبروددخلوا فى العرب وهم على نسبهم الى هرون أخى موسى عليهما السلام
  والنضرة الحسسن والرواق وقد نضروجهه ينضر نضرة أى حسن ونضر اللّٰه وجهه يتعدى
  ولا يتعدى ويقال نضر بالضم نضارة وفيه لغة ثالثة نضر بالكسر حكاها أبو عبيد ويقسال
  نضر الله وجهه بااتشديد وأنضر اللّه وجهه بمعنى واذا قلت نضر اللّه امر أتعنى نعمه وفى
  لحديث نضر اللّه امر أسمع «قالتى ذوعادا وقواهم أخضر ناضرانفاهو كقواهم أصفر
  فاقع وأبيض ناصع والنضر أبوقريش وهو النضر بن كنانة بن خزيمة بن مدركة بن الياس بن
  مضر ( نطر الناطر والناط ور حافظ الكرم والجمع النواطيروالناطرون موضع
  بناحية الشام والقول فى اعرابه كالة ول فى نصييين وينشد هذا البيت بكسر النون
  ولهابا اناطرون اذا • أكل النمل الذى جعا
  طر) النظر تأمل الشى بالعين وكذلك النظران بالتحريك وقد نظرت الى الشى والنظر
  الانتظار ويقال حى حسلال ونظر أى متجاورون يرى بعضه-م يعضا ودارى تنظر الى دار
  فلان ودورنا تناظر أى تقابل واذا أخذت فى طريق كذافنظر اليك الجبل فخذع ن يعمينه
  أو يساره ونظر الدهر الى بنى فلان فأهلكهم والنظرة عين الجن ورجل فيه تظرة أى شهوب
  والناظر فى المقلة السواد الاصفر الذى فيه انسان العين ويقال للعين الناظرة والناظران
  عرقان فى مجرى الدمع على الانف من جانبيه عن يعقوب وأنشد لجرير
  وأشفى من تخلج كل جن * وأكوى الناظرين من الحنات
  وقال اخر
  قليلة لحم الناظربن يزينها • شباب ومخفوض من العيس بارد
  والناظر الحافظ والنظرة بكسر الظاء التأخير وأنظرته أى أخرته واستنظره أى استمهله
  وتنفاره أى انتظره فى مه-لة وقواهم نظار مثل قطام أى انتظوه وناظره من المناظرة والمنظرة
  المرقبة ويقال منظره خير من مخبره ورجل منظرانى مخبرانى واهرأة حسنة المنظر والمنظرة
  أيضاو النظارة القوم ينظرون الى شئ وبنو النظارة قوم من عكل وابل نظارية منسوبة
  اليهم قال الراجز يتبعن نظارية سعوما السعم ضرب من سير الابل وامرأة نظارنة سمعنة
  يفسر فى باب العين ونظير الشئ مثله و-كى أبو عبيدة النظر والنظير بعسنى واحد مثل
  الندوالنديد وأنتد
  ألاهل أتى تظرى مليكة انى • أنا الليث معد واعليه وعاديا
  قال الفراه يقال فلان نفارة قومه وتطورة قومه للذى ينظر اليه منه-م ويجمعان على نظائر
  وم فاور
