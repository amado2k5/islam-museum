label: { ar: "الموطأ 556 — مالك: إنما تجب السجدة على من يأتم بالقارئ، لا على من سمعها من غير إمامه", en: "Muwatta 556", es: "Muwatta 556", fr: "Muwatta 556", ur: "موطا 556", tr: "El-Muvatta 556 — Malik: Secde, ancak Kur'an okuyucusunun ardından okuyan için farzdır, imamından başkasından dinleyen için farz değildir.", id: "Al-Muwatta 556 — Malik: Sujud hanya wajib bagi orang yang mengikuti pembaca Al-Quran, bukan bagi orang yang mendengarnya dari selain imamnya." }
summary:
  ar: "يقول يحيى: سئل مالك عن امرأة قرأت سجدة ورجل معها يسمع، أعليه أن يسجد معها؟ فقال مالك: ليس عليه ذلك، إنما تجب السجدة على القوم الذين يكونون مع الرجل يأتمون به فيقرأ سجدة فيسجدون معه، وليس على من سمع سجدة من إنسان يقرؤها وليس له بإمام أن يسجد تلك السجدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، ويثبت فروقاً يسيرة بين النسخ في الألفاظ. {cite:muwatta-maruf-1997 p.285}"
  tr: "Yahya şöyle dedi: Malik'e, bir kadın secde gerektiren bir ayeti okurken bir erkeğin de dinlediği soruldu. Erkeğin onunla birlikte secde etmesi zorunlu mudur? Malik şöyle cevap verdi: Zorunlu değildir. Secde, ancak bir erkeğin arkasında namaz kılan ve o secde gerektiren bir ayeti okuduğunda onunla birlikte secde edenler için zorunludur. Başka birinden secde gerektiren bir ayet işiten ve namazda ona bağlı olmayan birinin o secdeyi yapması zorunlu değildir. Editör, bunun Ebu Mus'ab ve Suveyd tarafından Malik'ten rivayet edildiğini belirtiyor ve farklı rivayetler arasında kelime kullanımında küçük farklılıklar olduğunu kaydediyor. {cite:muwatta-maruf-1997 s.285}"
  id: "Yahya berkata: Malik ditanya tentang seorang wanita yang membaca ayat yang mewajibkan sujud sementara seorang pria mendengarkan. Apakah dia wajib sujud bersamanya? Malik menjawab: Dia tidak wajib melakukannya. Sujud hanya diwajibkan bagi mereka yang shalat di belakang seorang pria dan yang sujud bersamanya ketika dia membaca ayat yang mewajibkan sujud. Tidak wajib bagi seseorang yang mendengar ayat yang mewajibkan sujud dari orang lain, dan yang tidak mengikutinya dalam shalat, untuk melakukan sujud tersebut. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan ini dari Malik, dan mencatat sedikit perbedaan redaksi antara berbagai versi. {cite:muwatta-maruf-1997 p.285}"
