label: { ar: "الموطأ 556 — مالك: إنما تجب السجدة على من يأتم بالقارئ، لا على من سمعها من غير إمامه", en: "Muwatta 556" }
summary:
  ar: "يقول يحيى: سئل مالك عن امرأة قرأت سجدة ورجل معها يسمع، أعليه أن يسجد معها؟ فقال مالك: ليس عليه ذلك، إنما تجب السجدة على القوم الذين يكونون مع الرجل يأتمون به فيقرأ سجدة فيسجدون معه، وليس على من سمع سجدة من إنسان يقرؤها وليس له بإمام أن يسجد تلك السجدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، ويثبت فروقاً يسيرة بين النسخ في الألفاظ. {cite:muwatta-maruf-1997 p.285}"
