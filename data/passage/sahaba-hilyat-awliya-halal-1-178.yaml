text: "… وأمى حل لنا هؤلاء القوم حق نعرفهم، فوالذى بعثك بالحق إنى انخوف أن أكون منهم افقال : يا سالم أما إنهم كانوا يصومون ويصلون، ولسكنهم إذا عرض لهم شء من الحرام وثبوا عليه، فأدحض اللّٰه تعالى أعمالهم. فقال مالك بن …"
