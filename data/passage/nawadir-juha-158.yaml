label: { ar: "نوادر جحا الكبرى، ص 73 — «من يتشاجر على السطح يعلم»", en: "Nawadir Juha al-Kubra, p. 73 — 'Whoever Quarrels on the Roof Knows'", ur: "نوادر جحا الکبریٰ، ص 73 — «جو چھت پر جھگڑتا ہے وہ جانتا ہے»", fr: "Nawadir Juha al-Kubra, p. 73 — « Celui qui se dispute sur le toit sait »", es: "Nawadir Juha al-Kubra, p. 73 — «Quien riñe en el tejado lo sabe»", tr: "Cuha'nın Büyük Fıkraları, s. 73 — “Çatıda kavga eden öğrenir”", id: "Anekdot Hebat Juha, hlm. 73 — “Siapa yang bertengkar di atas atap, ia akan belajar”" }
text: "… مَن يتشاجر على السطح يعلم نام ذات ليلةٍ على السطح وعندما تمدَّد في الفراش أخذت امرأته بالحوار معه، حتى تشاجرا، فأغضبته، فقام يمشي ظانّاً نفسه في إحدى غرف البيت، وإذا به قد وقع مِنَ السطح على رؤوس جيرانه، فذعروا وأحاطوا …"
summary:
  ar: "نام جحا على السطح، وتشاجر مع زوجته، فنهض وسقط من السطح على رؤوس جيرانه؛ فلما طُلب منه التفسير قال إن من يتخاصم مع زوجته على السطح يعرف مصيبته. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  en: "Juha sleeps on the roof, quarrels with his wife, gets up, and falls off the roof onto his neighbours' heads; told to explain, he says whoever argues with his wife on the roof knows his misfortune. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  ur: "جحا چھت پر سو رہا تھا، بیوی سے جھگڑا ہوا، وہ اٹھا اور چھت سے پڑوسیوں کے سروں پر آ گرا؛ وضاحت مانگی گئی تو اس نے کہا کہ جو چھت پر بیوی سے جھگڑتا ہے وہ اپنی مصیبت جانتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  fr: "Juha dort sur le toit, se dispute avec sa femme, se lève et tombe du toit sur la tête de ses voisins; sommé de s'expliquer, il dit que celui qui se dispute avec sa femme sur le toit connaît son malheur. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  es: "Juha duerme en el tejado, riñe con su mujer, se levanta y cae del tejado sobre las cabezas de sus vecinos; al pedírsele una explicación, dice que quien discute con su mujer en el tejado conoce su desgracia. {cite:juha-nawadir-kubra-djuwaydi p. 73}"
  tr: "Juha çatıda uyudu ve karısıyla tartıştı. Kalktı ve çatıdan komşularının başlarına düştü. Açıklaması istendiğinde, \"Çatıda karısıyla tartışan kimse, başına gelecek felaketi bilir\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 73}"
  id: "Juha tidur di atap dan bertengkar dengan istrinya. Ia bangun dan jatuh dari atap menimpa kepala tetangganya. Ketika diminta menjelaskan, ia berkata, \"Siapa pun yang bertengkar dengan istrinya di atap, ia tahu kemalangannya.\" {cite:juha-nawadir-kubra-djuwaydi p. 73}"
