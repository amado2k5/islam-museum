summary:
  ar: "القسم 13 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العيدين»، ويضم فيها النصوص من 948 إلى 989 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 13 of Sahih al-Bukhari (The Two Festivals (Eids)) in the division of the open hadith dataset the museum took its reports from: reports 948 to 989 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 13، عنوان «کتاب العیدین»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 948 تا 989۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 13 de Sahih al-Bukhari (Las dos festividades (Eids)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 948 al 989, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 13 du Sahih al-Bukhari (Les Deux Fêtes (Aïds)), soit les hadiths 948 à 989 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 13. bölümü \"İki Bayramın Kitabı\" başlığını taşımakta olup, 948'den 989'a kadar olan metinleri içermektedir ve bu metinler sırasıyla numaralandırılmıştır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 13 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Dua Hari Raya\" dan berisi teks 948 hingga 989, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
