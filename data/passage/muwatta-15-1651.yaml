label: { ar: "الموطأ 1651 — مالك: الرجل يلاعن امرأته فينزع ويكذب نفسه بعد يمين أو يمينين، ما لم يلتعن في الخامسة، فإنه يجلد الحد ولا يفرق بينهما", en: "Muwatta 1651", es: "Muwatta 1651", fr: "Muwatta 1651", ur: "موطا 1651", tr: "El-Muvatta 1651 — Malik: Bir adam karısına lanet okuyabilir, sonra bir veya iki kez yemin ettikten sonra yeminini geri çekip inkâr edebilir; ancak beşinci kez lanet okursa, belirlenen cezaya göre kırbaçlanır ve birbirlerinden ayrılamazlar.", id: "Al-Muwatta 1651 — Malik: Seorang pria boleh mengucapkan kutukan kepada istrinya, kemudian menarik kembali dan mengingkari sumpahnya setelah satu atau dua kali sumpah, kecuali jika ia mengucapkan kutukan untuk kelima kalinya, dalam hal ini ia akan dicambuk sesuai dengan hukuman yang telah ditetapkan dan mereka tidak akan dipisahkan." }
summary:
  ar: "يقول مالك في الرجل يلاعن امرأته فينزع، ويكذب نفسه بعد يمين أو يمينين، ما لم يلتعن في الخامسة، إنه إذا نزع قبل أن يلتعن جلد الحد، ولم يفرق بينهما. {cite:muwatta-maruf-1997 p.80}"
  tr: "Malik, karısına lanet okuyan, sonra bir iki yemin ettikten sonra geri çekilen ve tövbe eden bir adam hakkında, beşinci kez lanet okumadığı sürece, eğer lanet okumadan önce geri çekilirse, öngörülen cezaya göre kırbaçlanması ve ayrılmamaları gerektiğini söyler. {cite:muwatta-maruf-1997 s.80}"
  id: "Malik mengatakan mengenai seorang pria yang mengucapkan kutukan kepada istrinya, kemudian menarik kembali ucapannya setelah satu atau dua sumpah, kecuali jika ia mengucapkan kutukan untuk kelima kalinya, bahwa jika ia menarik diri sebelum mengucapkan kutukan, ia harus dicambuk sesuai dengan hukuman yang telah ditentukan, dan mereka tidak boleh dipisahkan. {cite:muwatta-maruf-1997 p.80}"
