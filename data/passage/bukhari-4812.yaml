label:
  ar: "البخاري 4812 — أنا الملك أين ملوك الأرض"
  en: "Bukhari 4812 — I am the King; where are the kings of the earth?"
  ur: "بخاری 4812 — میں بادشاہ ہوں، زمین کے بادشاہ کہاں ہیں"
text: "يقبض الله الأرض ويطوي السماوات بيمينه ثم يقول أنا الملك أين ملوك الأرض …"
summary:
  ar: "حديث قدسي في البخاري، رقم 4812: أنا الملك أين ملوك الأرض. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Bukhari, no. 4812: I am the King; where are the kings of the earth?. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "بخاری میں حدیثِ قدسی، نمبر 4812: میں بادشاہ ہوں، زمین کے بادشاہ کہاں ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
