ref: "4812"
label:
  ar: "البخاري 4812 — أنا الملك أين ملوك الأرض"
  en: "Bukhari 4812 — I am the King; where are the kings of the earth?"
  ur: "بخاری 4812 — میں بادشاہ ہوں، زمین کے بادشاہ کہاں ہیں"
  es: "Bukhari 4812 — Yo soy el Rey; ¿dónde están los reyes de la tierra?"
  fr: "Bukhari 4812 — Je suis le Roi; où sont les rois de la terre ?"
  tr: "Buhari 4812 — Ben kralım, yeryüzünün kralları nerede?"
  id: "Bukhari 4812 — Akulah raja, di manakah raja-raja di bumi?"
text: "يقبض الله الأرض ويطوي السماوات بيمينه ثم يقول أنا الملك أين ملوك الأرض …"
summary:
  ar: "حديث قدسي في البخاري، رقم 4812: أنا الملك أين ملوك الأرض. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Bukhari, no. 4812: I am the King; where are the kings of the earth?. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "بخاری میں حدیثِ قدسی، نمبر 4812: میں بادشاہ ہوں، زمین کے بادشاہ کہاں ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Bukhari, n.° 4812: Yo soy el Rey; ¿dónde están los reyes de la tierra? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Bukhari, n° 4812: « Je suis le Roi; où sont les rois de la terre ? » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et du Muwatta."
  tr: "Buhari'de 4812 numaralı hadis-i kudsi şöyledir: \"Ben Kralım, yeryüzünün kralları nerede?\" Peygamberimiz bunu Rabbinden rivayet etmiş olup, hadis-i kudsi araştırmacıları bu rivayeti altı şeriat hadis külliyatında ve Muvatta'da derlemişlerdir."
  id: "Sebuah hadits qudsi dalam Bukhari, no. 4812: “Akulah Raja, di manakah raja-raja di bumi?” Nabi meriwayatkannya dari Tuhannya, dan para ahli hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kitab hadits kanonik dan Al-Muwatta."
