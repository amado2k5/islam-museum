text: |-
  ⁦(جادد)⁩
  ٢١٩
  وقالواهى الخر تكنى الطلا** كما الذئب يكنى أبا جعدة
  أى كنيته حسنة وعملد منكر والجعدة تيت على شاطى الانهاروجعدة أبوح من العرب
  وهم جعدة بن كعب بن ربيعة بن عامى بن صعصعة منهم النابغ: الجعدة وقديوصف زبد
  البعير بالجعودة اذا كان بعضه فوق بعض يقال حمد اللغام قال ذو الرمة
  تهجواذا جعات تدمى أخشتها • واعتم بالزبدالجعد الخراطيم
  وثرى جعد مثل تعداذا كان لينا وبعير جعد أى جعد الوبركثيرة (جلد الجلد واحد
  الجلود والجلدة أخص منه وأماقول الهذل
  اذا تجاوب نوح قامتامع • ضر باأليماببت بلعج الجادا
  فانما كسر اللام ضرورة لانّ للشاعر أن يحركالساكن فى القافية بحركة ما قبله كما قال
  علنا اخواتنا بنوعجل • شرب النبيذواء تقالا بالرجل
  وكان ابن الاعرابي يرويه بالفتح وية ول الجلد والجادمثل شبه وشبه ومثل ومثل وقال ابن
  السكيت وهذ الايعرف وتجليد الجزور مشل سلخ الشاة بقال جلد حزوره وقلما يقال سلخ
  وفرس مجلد اذا كان لا يجزع من الضرب وجاده الحت جلدا أى ضربه وأصاب جلده
  كقولك رأسه وبطنه والجلد قطعة من جلد تمكون فى يدا لنائحة تلعم به وجهها والجلد جلد
  حواريسلخ فيلبس حوارا آخر لتشمه أم المسلوخ فترأمه قال العجاج
  وقد أرانى للغوانى مصيدا * حلاوة كان فوقى جلدا
  والجلد الكبار من المنوق التى لا أولاداه اولا أليان الواحدة بالهاء والجلدأ يضا الارض
  الصلبة قال النابغة
  إلا الاوارى لاياما أبينها • والنوى كالجوض بالمظلومة الجلدا
  وكذلك الاجلد قال جرير
  أجالت عليه ن الرواممن بعدنا • دفاق الحصى من كل سهل وأجلدا
  والجمسع الاجلاد والاجالد والجدد الصلابة والجلادقولم:ه جاد الرجل بالضم فهوجلد
  وجليد بين الحلد والجلادة والجلودة والمجاود وهو مصدر مشل المحاوف والمعقول قال
  الشاعر واصبرفان أخا المجلود من صبرا ورعماقالوارجل جضد يجعلون اللام مع
  الجيم ضادا اذاسكذت وقوم حلد وحلداء وأحلاد والتحادكلف الملادة والمجالدة
  المبالطة وتجالد القوم بالسبوف واجتلدوا وأجلاد الرحل جسعه وبدنه وكذلك تجاليد.
  والحلدة بالتسكين واحدة الحلاد وهى أدسم الابل ابنا والمناد من النخل الكبار الصلاب
  قال الشاعرمويدين السامت
  أدين ومادين عليكم بغرم • ولكن على الشمّ الملاد القرا
  وشاة جلدة اذالم يكن لها لبن ولا ولد وفلان جاودى" بفتح الجيم قال الفرًا وهو منسوب الى
  جلود قرية من قرى افريقية ولا تقل الجلودى والجليد الضريب والقبط وهو ندى بسقط
  من السماء فيجمد على الارض تقول منه جلدت الارض فهى مج_لودة وجلندى بضم الجيم
  مقصوراسم- لك عمان ⁦(%جلذد)⁩ المجلفد المستلقى الذى قدر مى بنفه وامتد قال ابن أحر
