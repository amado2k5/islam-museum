  tr: "\"Al-Isabah fi Tamyiz al-Sahaba\" (Sahabeleri Ayırt Etme) adlı eserin 2. cildinin 954. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Al-Isabah fi Tamyiz al-Sahaba\" (Membedakan Para Sahabat), Jilid 2, halaman 954, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Islamic Folklore Browser."
