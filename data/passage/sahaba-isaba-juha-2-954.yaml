text: "… العبادلة، وقال: لا يعرف له صحبة. روى عنه - عبد اللّٰه بن النعمان: سليمان بن سليم. قيل : هو عبد اللّٰه الذي كان يقال له: حمار وينظر وأخرج حديثه أبو موسى في الذيل من طريق ابن أبي خبره من النعيمان …"
summary:
  ar: "مقطع من الإصابة في تمييز الصحابة، المجلد المصوَّر 2، ص 954، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Isaba fi Tamyiz al-Sahaba, scan volume 2, p. 954, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "الاصابہ فی تمیز الصحابہ، اسکین جلد 2، ص 954 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
