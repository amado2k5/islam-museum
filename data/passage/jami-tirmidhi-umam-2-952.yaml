text: "… فِي كَرَاهِيَةِ التَّسْلِيمِ عَلَى الذَّمِّيِّ حَدَّثَنَا قُتَيْبَةُ قَالَ : حَدَّثَنَا عَبْدُ العَزِيزِ بنُ مُحَمَّدٍ، عَنْ سُهَيْلِ بنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ أَنَّ رَسُولَ اللّٰه وَلِيهِ قَالَ : لا تَبْدَؤُوا اليَهُودَ وَالنَّصَارَى بِالسَّلامِ، وَإِذَا لَقِيتُمْ أَحَدَهُمْ فِي طَرِيقٍ، …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 952، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
