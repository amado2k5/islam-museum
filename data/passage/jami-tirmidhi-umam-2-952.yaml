  tr: "Cami' el-Tirmizi'nin 2. cildinin 952. sayfasından, gayrimüslim milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Gayrimüslim Milletler, Dinler, Mezhepler ve Halklar Tarayıcısı tarafından derlenmiştir."
