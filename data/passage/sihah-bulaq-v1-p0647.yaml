text: |-
  الوفيات لاين خلكان وقوات
  الوذرات متأخر عن ذيل الوفيات
  الذى "عاممؤافه العلامة
  الصغدى الوافى بالوفيات اه
  بهجة النفوص فى الحاكمة بين العصاح والقاموس آخذ اله من خطرط الشيخ عبد الباسط
  الملقى وسعدى أفندى وصكذلك الامام ان الطب الغاسى محذى القاموس قد
  انتصر لجوهرى على الجدوشهديانه خطيب المنبر الصرف وامام المحراب اللغوى وقال إن
  اللّٰه قد رزقه شهرة فاقجماكل من تقدمه ومن تأخرعنه ولم يصل شى من المسنفات اللغوية
  فى كثرة التداول والاعتماد على مافيه الى ما وصل اليه كتابه الصحاح وان فيهمن الفوائد
  المهمة التى أهملها فى القاموس حكثيرامن القواعد الصرفيه والشواهد المحتاج اليها
  فى العلوم الشرغية والادييه وكذلك محشته ابن برى قال ان الجوهرى أنى اللغويين اه
  ولقد أفرد للمماكمة بعض محق فى المغاربة كذا بأمستقلاسماه الوشاح وتنقيف الرماح فى رد
  توهيم الجد الدماح وقدطبع قريبا
  ⁦(الفائدة الثانيسة فى الصاح خصوها)⁩ وتربمسة مؤلقه ومن رواه عنه ومن عنى بكنابه من
  الافاضل الموتوق عذوطهم ومن كتب عليه أواختصره اوزبجه
  أمالفظ السماح :ق-دنقل المزار عن أب زتكر يا الخظيب المبريزى أنه يقال يكسر الصادوهو
  المشهو روهوجمع صحيح كظريف وظراف ويقال بالفتح وهونعت مفرد هثل صحيح وقد باه
  فعال يفح الفالغة فى فعيل كسح وصحاح ونهيح وشهاح وبرىء وبراء اه قال الامام
  الحقق ابن الطيب ما معناه حيث لم يردعن المؤاف فى تحسص أحدهما بالددالصميح ما يصار:
  اليه ولا يعدل عنه فكلا الضبطين صيح خلافا لمن أنذكر الفتح ولمن ربعه على السكسر اه
  وأماتر يحة مؤلفه وان لم أجددها فى الوفيات ولا فى فوات الوقيات فه والاسام أبونصر
  اسعميل بن تصر بن حاد الجوهرى الفارابى نسبة الى قاراب كساباط قيل انه اسم ناحية
  من بلاد الترلا وراء ثم رسيحون قال م روالعميح المشهورانه اسم مدينة يقال لها أتراو بالضم
  هى قاعدة بلاد الترك ونسب الى الجوهرابيعه أوطسن خطه أو انها أسبة للتشبيه أواغير ذلك
  قد أخذ الع-لم ءن خاله ابراهيم الفارابى واشتهرانه ابن أنت أبى نصر الفارابى صاحب
  ديوان الادب وأخذ أيضا عن أبى سعيد السيرا فى وارتحل فى طلب علوم اللغة وغيرها الى بلاد
  ربيعة ومضر فأقام بهامدة ثم عاد الى خراسان وأقام بنيسايور مدة فبرتزف اللغسة وحسن
  اتظط وغير هماحتى صار من أذ كياء العالم بل من أعاجيب الدنيا علماوذ كاء وخطا وصار
  إ يضرب بخطه المثل وقد ترجه أبو منصور المعالبى اللغوى فى كتابه يتمة الدهرق محاسن
  أهل العصر فقال صكان الجوهرى من أعاجيب الزمان وهوامام فى اللغة وله كتاب
  الصاح وفيسه يقول أبو محمد اسمعيل بن محمد بن عبدوس النيسابورى
  هذا كتاب الصحاح سيدما • صنف قبل المماح فى الادب
  تشمل أبوابه وتجمع ما • فرّق فى غيرء من الكتب
  قال ممشى القاموس ولماقال بعض الشعراء
  مذمة مجد الدين فى أيامه * من بعض أجر علاء القاموسا
  ذهبت صحاح الجوهرى كانها سموالمدائن حين ألقى موسا
  ردّ عليه أديب السام وصوفيه شيخ مشايخنا العلامة عبد الغى بن اممعيل ااكذانى المقدْمو
  المعروف بالدَا بدى قُدّ منَ سره كما أسمعناء يرواحد من أشياخنا الاعلام عنّه
