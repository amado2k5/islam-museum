text: "حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا ابْنُ نُمَيْرٍ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ لَمَّا رَجَعَ النَّبِيُّ مِنَ الْخَنْدَقِ وَوَضَعَ السِّلاَحَ وَاغْتَسَلَ، أَتَاهُ جِبْرِيلُ ـ فَقَالَ قَدْ وَضَعْتَ السِّلاَحَ وَاللَّهِ مَا وَضَعْنَاهُ، فَاخْرُجْ إِلَيْهِمْ. قَالَ \" فَإِلَى أَيْنَ \". قَالَ هَا هُنَا، وَأَشَارَ إِلَى بَنِي قُرَيْظَةَ، فَخَرَجَ النَّبِيُّ إِلَيْهِمْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4117، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4117 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4117، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
