text: "… ممن رجع من غزوة مؤتة من الطويل : وَزَيْدٌ وَعَبْدُ اللَّهِ فِي رَمْسِ أَقْبُرِ كَفَى حَزَناً أَنّْي رَجَعْتُ وَجَغْفَرْ قَضَوْا نَحْبَهُمْ لَمَا مَضَوْا لِسَبِيلِهِمْ وَخُلْفْتُ لِلْبَلْوَى مَعَ الْمُتَغَبْرِ ثَلاّثَةُ رَهْطِ قُدَّمُوا فَتَقَدَمُوا إِلَى وِرْدِ مَكْرُوهِ مِنَ الْمَوْتِ أَحْمَرٍ أسماء شهداء …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 537، يرد فيه ذكر المكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hisham's Sira, p. 537, whose wording mentions the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سیرت ابن ہشام، ص 537 کا اقتباس جس میں مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sira de Ibn Hisham, p. 537, dont le texte mentionne le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sira de Ibn Hisham, p. 537, cuyo texto menciona lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hişam'ın Peygamber biyografisinden bir alıntı, 537. sayfada, hoş görülmeyen fiillerden bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz fiiller, itaat fiilleri, tavsiye edilen fiiller, hoş görülmeyen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi Nabi karya Ibnu Hisham, halaman 537, menyebutkan perbuatan-perbuatan yang tidak disukai; ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
