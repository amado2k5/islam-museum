label: { ar: "الموطأ 2788 — امرأة تشكو الدار: دعوها ذميمة", en: "Muwatta 2788", es: "Muwatta 2788", fr: "Muwatta 2788", ur: "موطا 2788", tr: "Al-Muwatta 2788 — Bir kadın evden şikayet ediyor: Olduğu gibi bırakın.", id: "Al-Muwatta 2788 — Seorang wanita mengeluh tentang rumah: Biarkan saja seperti apa adanya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن امرأة جاءت النبي فقالت: يا رسول الله، دار سكناها، والعدد كثير والمال وافر، فقل العدد وذهب المال. فقال: دعوها ذميمة. ويذكر المحقق أن البخاري في الأدب المفرد وأبا داود أخرجاه مرفوعا من طريق إسحاق بن عبد الله بن أبي طلحة عن أنس، وأن إسناده صحيح. {cite:muwatta-maruf-1997 p.567}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, bir kadının Peygamberimize gelip, \"Ey Allah'ın Resulü, çok çocuklu ve bol mal mülke sahip bir evde yaşadım, fakat şimdi çocuklar azaldı ve mal mülk yok oldu\" dediğini aktarır. Peygamberimiz, \"Bunu bırak, çünkü bu kınanmaya değer bir şeydir\" diye cevap vermiştir. Araştırmacı, Buhari'nin el-Adab el-Mufrad'ında ve Ebu Davud'un da bu hadisi İshak ibn Abdullah ibn Abi Talha'dan Enes'ten rivayetle Peygamberimize dayandırdığı ve isnad zincirinin sahih olduğu belirtmektedir. {cite:muwatta-maruf-1997 s.567}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa seorang wanita datang kepada Nabi dan berkata, \"Wahai Rasulullah, aku tinggal di rumah dengan banyak anak dan harta yang melimpah, tetapi sekarang anak-anakku telah berkurang dan harta itu telah lenyap.\" Beliau menjawab, \"Tinggalkan saja, karena itu adalah perbuatan yang tercela.\" Peneliti menyebutkan bahwa al-Bukhari dalam al-Adab al-Mufrad dan Abu Dawud memasukkannya sebagai hadits yang ditelusuri kembali kepada Nabi melalui Ishaq ibn Abdullah ibn Abi Talha dari Anas, dan bahwa sanadnya sahih. {cite:muwatta-maruf-1997 p.567}"
