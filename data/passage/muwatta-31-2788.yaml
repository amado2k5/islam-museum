summary:
  ar: "يروي مالك عن يحيى بن سعيد أن امرأة جاءت النبي فقالت: يا رسول الله، دار سكناها، والعدد كثير والمال وافر، فقل العدد وذهب المال. فقال: دعوها ذميمة. ويذكر المحقق أن البخاري في الأدب المفرد وأبا داود أخرجاه مرفوعا من طريق إسحاق بن عبد الله بن أبي طلحة عن أنس، وأن إسناده صحيح. {cite:muwatta-maruf-1997 p.567}"
