label:
  ar: "مسلم 2829 — أحل عليكم رضواني فلا أسخط عليكم بعده أبدا"
  en: "Muslim 2829 — I grant you My good pleasure and shall never be displeased with you"
  ur: "مسلم 2829 — میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا"
text: "إن الله يقول لأهل الجنة يا أهل الجنة . فيقولون لبيك ربنا وسعديك والخير في يديك . فيقول هل رضيتم فيقولون وما لنا لا نرضى يا رب وقد أعطيتنا ما لم تعط أحدا من خلقك فيقول ألا أعطيكم أفضل من …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2829: أحل عليكم رضواني فلا أسخط عليكم بعده أبدا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2829: I grant you My good pleasure and shall never be displeased with you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2829: میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
