text: "… ودعته بعد أن أظهر الجزع لفراقي وربما لا نلتقي بعد هذا، فكان كما قال سكة الجلوديين بنيسابور الدارسة، وهذا الذي قاله الشيخ أبو عمرو يمكن فجاءنا نعيه إلى هراة وكانت وافته في العشر الأواخر من شوال سنة ثلاثين حمل كلام …"
summary:
  ar: "مقطع من المنهاج شرح صحيح مسلم بن الحجاج، المجلد المصوَّر 1، ص 18، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, scan volume 1, p. 18, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنہاج شرح صحیح مسلم بن الحجاج، اسکین جلد 1، ص 18 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, volume numérisé 1, p. 18, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, volumen escaneado 1, p. 18, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Sahih Muslim ibn al-Hajjaj tefsirinin 1. cildinin 18. sayfasından, bir ağıt ve ölüm ilanını içeren bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü ağıt ve övgülerden derlenmiştir."
  id: "Cuplikan dari komentar Sahih Muslim Ibnu al-Hajjaj, Volume 1, halaman 18, berisi eulogi dan pengumuman kematian; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
