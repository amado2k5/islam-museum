label: { ar: "الموطأ 2328 — مالك: ميراث كل معتَق لأقرب الناس ممن أعتقه", en: "Muwatta 2328", es: "Muwatta 2328", fr: "Muwatta 2328", ur: "موطا 2328", tr: "Al-Muwatta 2328 — Malik: Azat edilen her kölenin mirası, onu azat edenin en yakın akrabalarına geçer.", id: "Al-Muwatta 2328 — Malik: Warisan setiap budak yang dibebaskan jatuh kepada kerabat terdekat dari orang yang membebaskannya." }
summary:
  ar: "قال مالك: وهذا في كل من أُعتق، فإنما ميراثه لأقرب الناس ممن أعتقه من الرجال، من ولد أو عصبة، يوم يموت المعتَق بعد أن يعتق، ويصير موروثا بالولاء. {cite:muwatta-maruf-1997 p.359}"
  tr: "Malik şöyle dedi: Bu, azat edilen herkes için geçerlidir; azat edilen kişinin mirası, azat edildikten sonra öldüğü gün, ister oğlu ister erkek akrabası olsun, onu azat eden en yakın erkek akrabasına geçer ve azat edilme bağı gereği mirasçı olur. {cite:muwatta-maruf-1997 s.359}"
  id: "Malik berkata: Ini berlaku untuk setiap orang yang dibebaskan; warisannya jatuh kepada kerabat laki-laki terdekat yang membebaskannya, baik anak laki-laki maupun kerabat laki-laki lainnya, pada hari orang yang dibebaskan itu meninggal setelah dibebaskan, dan ia menjadi ahli waris berdasarkan ikatan pembebasan. {cite:muwatta-maruf-1997 p.359}"
