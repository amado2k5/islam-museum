text: "… عن مالك، عن سَعِيد بن عمرو بن شرحبيل بن سعيد بن سعد بن عُبَادة، عن أبيه، عن جده قال: خرج سعد بن عبادة مع النبي علاغ في بعض مغازية، فحضرت أُمَّه الوفاةُ بالمدينة، فقيل لها: أوصي. فقالت: فيم أوصي؟ المال …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1612، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1612, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1612 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 1612, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 1612), mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin resimli 1. cildinin 1612. sayfasından, vasiyetname veya son vasiyetten ve ölüm saatinden bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metinle, makine tarafından okunabilir tıpkıbasım baskısından alınmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 1 bergambar, halaman 1612, yang menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari edisi faksimili yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peramban wasiat, warisan, barang antik, dan tempat suci."
