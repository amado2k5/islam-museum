summary:
  ar: "كتاب الوصية، الكتاب الثالث والعشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 26 نصا (2214–2239) في عشرة أبواب، من الصفحة 309 إلى الصفحة 321 من ملف PDF المجلد الثاني. يبدأ بالأمر بالوصية وجواز وصية الصغير والضعيف، ويبين أن الوصية في الثلث لا تتعدى، وأمر الحامل والمريض والمقاتل، والوصية للوارث، والحيازة، والنحل، ويختم بما يجوز من النحل وما لا يجوز. {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.321}"
  en: "The Book of Bequests (wasiyya), twenty-third book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 26 reports (2214–2239) in ten babs, PDF pp. 309–321 of volume 2. It opens with the duty to write a bequest and the bequests of the weak and the young, sets the one-third limit, rules on bequests by a pregnant woman and a man at battle, bequests to heirs, and gifts (nuhl) to children."
