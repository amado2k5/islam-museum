label: { ar: "الموطأ، كتاب الوصية", en: "Muwatta, Book of Bequests (wasiyya)", es: "Muwatta, Libro de legados (wasiyya)", fr: "Muwatta, Livre des legs (wasiyya)", ur: "موطا، وصیت کی کتاب ⁦(وصیہ)⁩", tr: "El-Muvatta, Vasiyetler Kitabı", id: "Al-Muwatta, Kitab Wasiat" }
summary:
  ar: "كتاب الوصية، الكتاب الثالث والعشرون من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 26 نصا (2214–2239) في عشرة أبواب، من الصفحة 309 إلى الصفحة 321 من ملف PDF المجلد الثاني. يبدأ بالأمر بالوصية وجواز وصية الصغير والضعيف، ويبين أن الوصية في الثلث لا تتعدى، وأمر الحامل والمريض والمقاتل، والوصية للوارث، والحيازة، والنحل، ويختم بما يجوز من النحل وما لا يجوز. {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.321}"
  en: "The Book of Bequests (wasiyya), twenty-third book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 26 reports (2214–2239) in ten babs, PDF pp. 309–321 of volume 2. It opens with the duty to write a bequest and the bequests of the weak and the young, sets the one-third limit, rules on bequests by a pregnant woman and a man at battle, bequests to heirs, and gifts (nuhl) to children."
  es: "El Libro de los Legados (wasiyya), vigésimo tercer libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 26 informes (2214–2239) en diez babs, PDF pp. 309–321 del volumen 2. Comienza con el deber de escribir un legado y los legados de los débiles y los jóvenes, establece el límite de un tercio, establece reglas sobre los legados de una mujer embarazada y un hombre en batalla, los legados a los herederos y los regalos (nuhl) a los niños."
  fr: "Le Livre des legs (wasiyya), vingt-troisième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 26 rapports (2214–2239) en dix babs, PDF pp. 309–321 du volume 2. Il s'ouvre sur le devoir d'écrire un legs et les legs des faibles et des jeunes, fixe la limite d'un tiers, statue sur les legs d'une femme enceinte et d'un homme au combat, les legs aux héritiers et les dons (nuhl) aux enfants."
  ur: "وصیت کی کتاب ⁦(وصیّہ)⁩، یحییٰ بن یحییٰ کی تجدید میں موطا کی تئیسویں کتاب ⁦(موضوع 1997)⁩، جلد 2: 26 رپورٹس (2214-2239) دس باب میں، پی ڈی ایف صفحہ 309-321 کے ساتھ ضعیف تحریر کو ضعیف درج کرنے کے لیے جلد نمبر 2 کے ساتھ استفسار کیا جائے۔ اور جوان، ایک تہائی کی حد مقرر کرتا ہے، حاملہ عورت اور جنگ میں مرد کی وصیت، ورثاء کے لیے وصیت، اور بچوں کو تحفہ ⁦(نحل)⁩ کا حکم دیتا ہے۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği Al-Muwatta'nın yirmi üçüncü kitabı olan Vasiyetler Kitabı, Beşar Awad Maruf'un (1997) baskısında, İkinci Cilt: 26 metin (2214–2239), on bölüm halinde, İkinci Cilt PDF dosyasının 309. sayfasından 321. sayfasına kadar. Vasiyetname yapma emri ve küçük veya güçsüz bir kişinin vasiyetname yapmasının caizliği ile başlar ve vasiyetnamenin mal varlığının üçte biriyle sınırlı olduğunu açıklar. Ayrıca hamile bir kadın, hasta bir kişi ve bir savaşçı için emirleri, mirasçılara vasiyet, mülkiyet ve bağışları ele alır. Bağışlar açısından caiz ve caiz olmayanlarla sona erer. {cite:muwatta-maruf-1997 s.309} {cite:muwatta-maruf-1997 s.321}"
  id: "Kitab Wasiat, kitab ke-23 Al-Muwatta' dalam riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 26 teks (2214–2239) dalam sepuluh bab, dari halaman 309 hingga halaman 321 dari file PDF Jilid Dua. Kitab ini dimulai dengan perintah untuk membuat wasiat dan kebolehan wasiat oleh anak di bawah umur atau orang yang lemah, dan menjelaskan bahwa wasiat dibatasi hingga sepertiga dari harta warisan. Kitab ini juga membahas perintah bagi wanita hamil, orang sakit, dan kombatan, serta wasiat kepada ahli waris, harta benda, dan hadiah. Kitab ini diakhiri dengan apa yang diperbolehkan dan tidak diperbolehkan dalam hal hadiah. {cite:muwatta-maruf-1997 p.309} {cite:muwatta-maruf-1997 p.321}"
