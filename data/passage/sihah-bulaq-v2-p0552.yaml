  المال أيضاخياده والشارف المسنة من النوق والجمع الشرف مثل بازل وبزل وعائذ وعودّ
  ويقال سهم شارف اذا وصف بالعتق والقدم قال أوس بن جر
  يقلب سهما راشه بمنا كب • ظهارلؤام فهو أتيف شارف
  وتشرّف بكذا أى عده شرفا وتشرّفت المربأ وأشرفته أى علوته قال العجاج
  وعى بأعال إمن تشرّفا • أشرفته بلاشفا أوبشفا.
  ي وأشرفت علميه أى اطلعت عليه من فوق وذلك الموضع مشرف ومشارف الارض أعاليها
  والمشرفية سيوف قال أبو عبيدة نسبت الى مشارف وهى قرى من أرض العرب تدنومن
  الريف يقال سيف مشرفى ولا يقال مشارفىّ لان الجمع لا يذسب اليه أذا كان على هذا الوزن
  لا يقال مهالىّ ولا جعافرئ ولاءما قرى وشارقت الرجل أى فاخرته أبنا أشرف وشارفت
  الشئء أى أشرفت عليه والاشتراف الانتصاب وفرس مشترف أى مشرف الخاق
  خال جرب
  من كل مشترف وان بعد المدى * ضرم الرقاق مناقل الاجرال
  واستشرفت الشى اذار فعت بصرك تنظر اليه وبسطت كفك فوق حاجبك كالذى يست ظلّ
  من الشمس ومنه قول ابن مطير
  فياعجباللناس يستشرفونى * كان لم يروابعدى محبا ولا قبلى
  واس تشرفت ابلهم أى تعينتها والشرياف ورق الزرع اذاطال وكثر حتى يخاف فساده
  فيقطع يقال شريفت الزرع اذا قطعت شريافه والشريف مصغر ماء لبنى غير والشاروف
