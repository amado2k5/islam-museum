  مثل الشاسب عن يعقوب وقد شف البعيريسف شسوفا قال ابن مقبل
  اذا اضطغنت سلاحى عند مغرضها * ومرفق كرئاس السف اذشفا
  ولحم شسيف كاديببس ظف قال أبوز يد الشغف الضيق والشدة مثل الضفف
