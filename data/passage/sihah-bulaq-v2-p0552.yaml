  شرف بالضم فهو شريف اليوم وشارف عن قليل أى سيصير شر يقاذكره الفراء وشرّفه
  اللّٰه تشريفا ويقال شرقته أشرفه شرفا أى غلبته بالشرف فهو مشروف وفلان أشرف منه
