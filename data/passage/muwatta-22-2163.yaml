label: { ar: "الموطأ 2163 — يحيى عن مالك عن ابن شهاب عن سالم عن أبيه: قال عمر ما بال رجال يطؤون وليداتهم ثم يعزلونهن، لا تأتيني وليدة يعترف سيدها أنه قد ألم بها إلا ألحقت به ولدها، فاعزلوا بعد أو اتركوا", en: "Muwatta 2163" }
summary:
  ar: "قال يحيى: قال مالك عن ابن شهاب عن سالم بن عبد الله بن عمر عن أبيه أن عمر بن الخطاب قال: ما بال رجال يطؤون وليداتهم، ثم يعزلونهن؟ لا تأتيني وليدة يعترف سيدها أن قد ألم بها، إلا ألحقت به ولدها، فاعزلوا بعد، أو اتركوا. {cite:muwatta-maruf-1997 p.286}"
