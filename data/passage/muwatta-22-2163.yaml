label: { ar: "الموطأ 2163 — يحيى عن مالك عن ابن شهاب عن سالم عن أبيه: قال عمر ما بال رجال يطؤون وليداتهم ثم يعزلونهن، لا تأتيني وليدة يعترف سيدها أنه قد ألم بها إلا ألحقت به ولدها، فاعزلوا بعد أو اتركوا", en: "Muwatta 2163", es: "Muwatta 2163", fr: "Muwatta 2163", ur: "موطا 2163", tr: "El-Muvatta 2163 — Yahya, Malik'ten, o da İbn Şihab'tan, o da Salim'den, o da babasından rivayetle: Ömer dedi ki: “Cariyeleriyle cinsel ilişkiye girdikten sonra cinsel ilişkiyi yarıda kesen erkeklere ne oluyor? Efendisi kendisiyle cinsel ilişkiye girdiğini itiraf eden hiçbir cariye bana gelmez ki, çocuğunu ona isnat etmeyeyim. Öyleyse ya cinsel ilişkiyi yarıda kessinler ya da bıraksınlar.”", id: "Al-Muwatta 2163 — Yahya, dari Malik, dari Ibn Shihab, dari Salim, dari ayahnya: Umar berkata, “Apa masalahnya dengan laki-laki yang bersetubuh dengan budak perempuannya lalu melakukan coitus interruptus? Tidak ada budak perempuan yang akan datang kepadaku yang tuannya mengakui telah bersetubuh dengannya kecuali aku akan menisbatkan anaknya kepada tuannya. Maka lakukan coitus interruptus setelah itu, atau tinggalkan saja.”" }
summary:
  ar: "قال يحيى: قال مالك عن ابن شهاب عن سالم بن عبد الله بن عمر عن أبيه أن عمر بن الخطاب قال: ما بال رجال يطؤون وليداتهم، ثم يعزلونهن؟ لا تأتيني وليدة يعترف سيدها أن قد ألم بها، إلا ألحقت به ولدها، فاعزلوا بعد، أو اتركوا. {cite:muwatta-maruf-1997 p.286}"
  tr: "Yahya şöyle dedi: Malik, İbn Şihab'dan, o da Salim ibn Abdullah ibn Ömer'den, o da babasından rivayetle, Ömer ibn el-Hattab'ın şöyle dediğini aktardı: Genç kızlarıyla cinsel ilişkiye girdikten sonra cinsel ilişkiyi yarıda kesen erkeklerin sorunu nedir? Efendisi kendisiyle cinsel ilişkiye girdiğini itiraf eden hiçbir genç kız bana gelmez ki, çocuğunu ona isnat etmeyeyim. Öyleyse ya cinsel ilişkiyi yarıda kessin ya da bıraksın. {cite:muwatta-maruf-1997 s.286}"
  id: "Yahya berkata: Malik berkata, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Salim ibn Abdullah ibn Umar, berdasarkan riwayat ayahnya, bahwa Umar ibn al-Khattab berkata: Apa masalahnya dengan laki-laki yang bersetubuh dengan anak perempuan mereka yang masih muda kemudian melakukan coitus interruptus? Tidak ada anak perempuan yang akan datang kepadaku yang tuannya mengakui telah bersetubuh dengannya, kecuali aku akan mengaitkan anaknya kepada tuannya. Maka lakukan coitus interruptus setelah itu, atau tinggalkan saja. {kutipan:muwatta-maruf-1997 hlm.286}"
