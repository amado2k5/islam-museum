text: "… حال مخدومه من إيثاره إظهار نعمته علىٰ من هو فى خدمته أو إخفائها،. قلت : وهذا قد يخالف ما تقدّم : من أنه ينبغى أن يكون الكاتب بهِى المَلْبَس. وبالجملة ففصاحة اللسان، وقوّة البيان، والتقدَّمُ فى صناعة الكتابة هو الذى …"
