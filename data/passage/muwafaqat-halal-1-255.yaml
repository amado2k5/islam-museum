text: "… ؛ فهو مما عفا الله عنه، وكان يُسأل عن الشيء لم يحرم ؛ فيقول: عفوّ، وقيل له: ما تقول في أموان أهل الذمة؟ فقال: العفو يعني : لا يؤخذ منهم زكاة. وقال عبيد بن عمير: أحلَّ اللّه حلالًا، وحرَّم حراماً، …"
