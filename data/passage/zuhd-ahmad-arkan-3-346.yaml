text: "… سيار حدثنا هلآل بن حق حدثنا سعيد الجريري قال قلت للحسن يا أبا سعيد الرجل يلنب ثم يتوب ثم يذنب ثم يتوب ثم يذاب ثم يتوب ثم يذنب ثم يتوب حتى متى قال ما أعلم هذا إلا من أخلاق المؤمنين. …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 3، ص 346، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
