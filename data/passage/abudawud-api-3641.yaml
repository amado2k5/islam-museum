label: { ar: "سنن أبي داود 3641 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 3641 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 3641 — ترکہ اور میراث", es: "Sunan Abi Dawud 3641 — lo que quedó: patrimonio y herencia", fr: "Sunan Abi Dawud 3641 — Ce qui a été laissé derrière: biens et héritage", tr: "Sunan Abi Davud 3641 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sunan Abi Dawud 3641 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… مِنْ طُرُقِ الْجَنَّةِ وَإِنَّ الْمَلاَئِكَةَ لَتَضَعُ أَجْنِحَتَهَا رِضًا لِطَالِبِ الْعِلْمِ وَإِنَّ الْعَالِمَ لَيَسْتَغْفِرُ لَهُ مَنْ فِي السَّمَوَاتِ وَمَنْ فِي الأَرْضِ وَالْحِيتَانُ فِي جَوْفِ الْمَاءِ وَإِنَّ فَضْلَ الْعَالِمِ عَلَى الْعَابِدِ كَفَضْلِ الْقَمَرِ لَيْلَةَ الْبَدْرِ عَلَى سَائِرِ الْكَوَاكِبِ وَإِنَّ الْعُلَمَاءَ وَرَثَةُ الأَنْبِيَاءِ وَإِنَّ الأَنْبِيَاءَ لَمْ يُوَرِّثُوا دِينَارًا وَلاَ دِرْهَمًا وَرَّثُوا الْعِلْمَ فَمَنْ أَخَذَهُ أَخَذَ بِحَظٍّ وَافِرٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3641، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3641 (Knowledge (Kitab Al-Ilm)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3641، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3641 (El Conocimiento (Kitab Al-Ilm)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 3641 (Savoir (Kitab Al-Ilm)), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 3641 numaralı hadiste, Peygamber Efendimiz'in geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, tarihi yerler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3641, menyebutkan apa yang ditinggalkannya berupa harta warisan. Informasi ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, situs bersejarah, dan makam suci, beserta teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
