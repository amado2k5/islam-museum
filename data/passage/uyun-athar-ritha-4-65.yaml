text: "… أبو سفيان : ما رأيتُ من الناس أحداً يُحبُّ أحداً كحبّ أصحاب محمد محمداً. ثم قتلَه نَسْطاسُ ي. ورأيت في كتاب ذيل المذيَّل لأبي جعفر محمد بن جرير الطبري، لحسان بن ثابت يرثي أصحاب الرجيع الستة : وزيداً وما تُغني …"
summary:
  ar: "مقطع من عيون الأثر في فنون المغازي والشمائل والسير، المجلد المصوَّر 4، ص 65، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar, scan volume 4, p. 65, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "عیون الاثر فی فنون المغازی والشمائل والسیر، اسکین جلد 4، ص 65 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar, volume numérisé 4, p. 65, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Uyun al-Athar fi Funun al-Maghazi wa-l-Shama'il wa-l-Siyar, volumen escaneado 4, p. 65, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Askeri Seferlerin Sanatlarında, Özelliklerinde ve Biyografilerinde Geleneklerin Özü\" adlı eserin 4. resimli cildinin 65. sayfasından, ölen kişi için yazılmış bir ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Inti Tradisi dalam Seni Ekspedisi Militer, Karakteristik, dan Biografi,\" Volume Bergambar 4, hlm. 65, berisi elegi dan pujian untuk almarhum; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan pujian paling terkenal."
