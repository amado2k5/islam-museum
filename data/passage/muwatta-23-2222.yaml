label: { ar: "الموطأ 2222 — يحيى عن مالك: أحسن ما سمعت في وصية الحامل وقضاياها في مالها أن الحامل كالمريض، فإذا كان المرض الخفيف غير المخوف فصاحبه يصنع في ماله ما يشاء، وإذا كان المرض المخوف لم يجز لصاحبه شيء إلا في ثلثه، وأول الحمل بشر وسرور، فإذا مضت لها ستة أشهر لم يجز لها قضاء إلا في الثلث", en: "Muwatta 2222" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: أحسن ما سمعت في وصية الحامل، وفي قضاياها في مالها، وما يجوز لها: أن الحامل كالمريض. فإذا كان المرض الخفيف غير المخوف على صاحبه، فإن صاحبه يصنع في ماله ما يشاء. وإذا كان المرض المخوف عليه، لم يجز لصاحبه شيء إلا في ثلثه. قال: وكذلك المرأة الحامل، أول حملها بشر وسرور، وليس بمرض ولا خوف. فإذا أثقلت لم يجز لها قضاء إلا في ثلثها. فأول الإتمام ستة أشهر، فإذا مضت للحامل ستة أشهر من يوم حملت لم يجز لها قضاء في مالها، إلا في الثلث. {cite:muwatta-maruf-1997 p.313} {cite:muwatta-maruf-1997 p.314}"
