label: { ar: "الموطأ 2222 — يحيى عن مالك: أحسن ما سمعت في وصية الحامل وقضاياها في مالها أن الحامل كالمريض، فإذا كان المرض الخفيف غير المخوف فصاحبه يصنع في ماله ما يشاء، وإذا كان المرض المخوف لم يجز لصاحبه شيء إلا في ثلثه، وأول الحمل بشر وسرور، فإذا مضت لها ستة أشهر لم يجز لها قضاء إلا في الثلث", en: "Muwatta 2222", es: "Muwatta 2222", fr: "Muwatta 2222", ur: "موطا 2222", tr: "El-Muvatta 2222 — Yahya, Malik'ten rivayetle: Hamile bir kadının vasiyeti ve parasıyla ilgili olarak duyduğum en güzel şey şudur: Hamile bir kadın hasta bir insana benzer. Hastalık hafif ve tehlikeli değilse, kişi parasıyla dilediği gibi davranabilir. Hastalık tehlikeli ise, kişi mal varlığının üçte birinden başka bir şey yapamaz. Hamileliğin başlangıcı sevinç ve mutluluk zamanıdır, ancak altı aydan sonra mal varlığının üçte birinden başka bir şey yapamaz.", id: "Al-Muwatta 2222 — Yahya berdasarkan riwayat Malik: Hal terbaik yang pernah kudengar mengenai wasiat seorang wanita hamil dan urusannya dengan uangnya adalah bahwa seorang wanita hamil itu seperti orang sakit. Jika penyakitnya ringan dan tidak berbahaya, maka orang tersebut dapat melakukan apa pun dengan uangnya sesuai keinginannya. Jika penyakitnya berbahaya, maka orang tersebut tidak diperbolehkan melakukan apa pun kecuali dengan sepertiga dari hartanya. Awal kehamilan adalah masa penuh sukacita dan kebahagiaan, tetapi setelah enam bulan, dia tidak diperbolehkan melakukan apa pun kecuali dengan sepertiga dari hartanya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: أحسن ما سمعت في وصية الحامل، وفي قضاياها في مالها، وما يجوز لها: أن الحامل كالمريض. فإذا كان المرض الخفيف غير المخوف على صاحبه، فإن صاحبه يصنع في ماله ما يشاء. وإذا كان المرض المخوف عليه، لم يجز لصاحبه شيء إلا في ثلثه. قال: وكذلك المرأة الحامل، أول حملها بشر وسرور، وليس بمرض ولا خوف. فإذا أثقلت لم يجز لها قضاء إلا في ثلثها. فأول الإتمام ستة أشهر، فإذا مضت للحامل ستة أشهر من يوم حملت لم يجز لها قضاء في مالها، إلا في الثلث. {cite:muwatta-maruf-1997 p.313} {cite:muwatta-maruf-1997 p.314}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Hamile bir kadının iradesi, mal varlığıyla ilgili hakları ve ona neyin izin verildiği konusunda duyduğum en iyi şey şudur: Hamile bir kadın hasta bir insan gibidir. Hastalık hafif ve tehlikeli değilse, kişi mal varlığıyla dilediği gibi davranabilir. Ancak hastalık tehlikeli ise, kişi mal varlığının üçte birinden fazlasını alamaz. Şöyle dedi: Benzer şekilde, hamile bir kadının gebeliğinin ilk dönemi hastalık veya korku değil, sevinç ve mutluluk zamanıdır. Ancak durum zorlaşırsa, mal varlığının üçte birinden fazlasını alamaz. İlk tam gebelik süresi altı aydır. Dolayısıyla, gebeliğin başlangıcından itibaren altı ay geçmişse, hamile kadın mal varlığının üçte birinden fazlasını alamaz. {cite:muwatta-maruf-1997 s.313} {cite:muwatta-maruf-1997 s.314}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Hal terbaik yang saya dengar mengenai wasiat seorang wanita hamil, hak-haknya terkait harta miliknya, dan apa yang diperbolehkan baginya adalah bahwa seorang wanita hamil itu seperti orang sakit. Jika penyakitnya ringan dan tidak berbahaya, maka orang tersebut dapat melakukan apa pun dengan hartanya sesuai keinginannya. Tetapi jika penyakitnya berbahaya, maka orang tersebut tidak diperbolehkan melakukan apa pun kecuali hingga sepertiga dari hartanya. Beliau berkata: Demikian pula, kehamilan awal seorang wanita hamil adalah masa sukacita dan kebahagiaan, bukan masa sakit atau ketakutan. Tetapi jika menjadi lebih sulit, dia tidak diperbolehkan melakukan apa pun kecuali hingga sepertiga dari hartanya. Masa kehamilan penuh pertama adalah enam bulan. Jadi, jika enam bulan telah berlalu sejak hari pembuahan, wanita hamil tidak diperbolehkan melakukan apa pun kecuali hingga sepertiga dari hartanya. {cite:muwatta-maruf-1997 p.313} {cite:muwatta-maruf-1997 p.314}"
