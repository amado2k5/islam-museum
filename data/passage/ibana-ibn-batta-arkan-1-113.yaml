text: "… عين النفاق. - ومُعروف عن مذهب السلف الصالح أنهم يعدون الأعمال الصالحة من الإيمان، ولهذا كانت هذه الخصال السيئة السابقة من النفاق ولعل هذا هو ما جعل عبدالله بن عمر يقابل بين خصال المؤمن وخصال المنافق حيث يقول : وقد …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 113، يذكر ما عُدّ من الإيمان، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 113, that mentions what is counted as part of faith, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 113 کا اقتباس جس میں جو ایمان میں سے گنا گیا، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
