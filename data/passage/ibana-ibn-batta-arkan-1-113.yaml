text: "… عين النفاق. - ومُعروف عن مذهب السلف الصالح أنهم يعدون الأعمال الصالحة من الإيمان، ولهذا كانت هذه الخصال السيئة السابقة من النفاق ولعل هذا هو ما جعل عبدالله بن عمر يقابل بين خصال المؤمن وخصال المنافق حيث يقول : وقد …"
