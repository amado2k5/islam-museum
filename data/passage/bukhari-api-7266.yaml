label: { ar: "صحيح البخاري 7266 — الصلاة والزكاة والصوم والحج مجتمعة، الشهادة والصلاة والزكاة", en: "Sahih al-Bukhari 7266 — the prayer, the zakat, the fast and the pilgrimage named together; the testimony, the prayer and the zakat", ur: "صحیح بخاری 7266 — نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ", es: "Sahih al-Bukhari 7266 — la oración, el zakat, el ayuno y la peregrinación nombrados juntos; el testimonio, la oración y el zakat" }
text: "… قَالَ \" هَلْ تَدْرُونَ مَا الإِيمَانُ بِاللَّهِ \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" شَهَادَةُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامُ الصَّلاَةِ، وَإِيتَاءُ الزَّكَاةِ ـ وَأَظُنُّ فِيهِ ـ صِيَامُ رَمَضَانَ، وَتُؤْتُوا مِنَ الْمَغَانِمِ الْخُمُسَ \". وَنَهَاهُمْ عَنِ الدُّبَّاءِ، وَالْحَنْتَمِ، وَالْمُزَفَّتِ، وَالنَّقِيرِ، وَرُبَّمَا قَالَ الْمُقَيَّرِ. قَالَ \" احْفَظُوهُنَّ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7266، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 7266 (Accepting Information Given by a Truthful Person), that mentions the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 7266، جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 7266 (Aceptando la información dada por una persona veraz), que menciona la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat, uno de los artículos de fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
