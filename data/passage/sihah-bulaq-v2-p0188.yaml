text: |-
  ٣٩٩
  بالتشديد وقال أيو ع روهى البرالتق تحرث وايمع الفدادين مخفف⁦( فرت)⁩ الفرن الذى
  يخبز عليه الفرتى وهو خبزغليظ نسب الى موضعه وهو غير التنور قال الهذلى"
  نقائل جوعهم عكالات • من الفرنيرعبماالهيل
  ويروى نقابل بالباء وفى كلام بعض العرب فاذاهى مثل الفرننة الهراء ( رتن ، فرتنا
  مقصورامم امرأة والعرب تسمى الامة فرتناوفرتنا أيضا قصر بمرو الروذ كان أبو خازم قد
  حاصرفيه زهير ين ذويب العدوىّ الذى يقال له هزار مرد ⁦(فرجن)⁩ الفرجون المحسة
  وقد فرجنت الدابة أى حسستها( فرسن الفرسن من البعير بنزلة الحافر من الداية وريا
  ستعر فى الشاقار ابن السرّتاج المون زائدة لاتم امن فرست وقدد كرم فرعن ،فرعون
  قب الوليد ين صعب لك مصر وكل عات متمرد فرعون والعتاة الفراعنة وقدته رعن وهو
  ذوفرعمة أى دهاء ونكر وفى الحديث أخذنافرعون هذه الامة ظن) الفطنة كالفهم
  تقول فعلنت للشئ بالفتح ورحل فطن وفطر وقد فطن بالصكسر فطفة وفطائة وفطانيسة
  والمفاطئة مفاعلة منه فمكن التفكن التقدم على ماقات. ( نن الذنّ واحد الدمون
  وهى الانواع والافانين الاساليب وهى أجناس الكلام وطرقه ورجل متفنن أى ذوفون
  وافتنّ الرجل فى حدينه وفى خطبته اذاجاه بالافانين وه ومثل اشتق قال أبو ذؤيب
  فاقتن بعد تام الورد ناجية • مثل الهراوة بكرائنيج ا أيد
  والفن الطردتة ول فنذت الابل أى طردتها قان الاءنى
  ولبيض قد عنست وطال براؤها ونشأن فى فن وفى أذواد
  وقد فسرناه فى باب السين والفنن بجعه أفنان ثم افانين وهى الاغصان وقال الراجز يسف
  رى • اهازمام من أفانين الشجر * وشجرة فناء أى ذات أفنان وفنواء أيضا على غير قياس
  وقول الراجزه لاجعلن لابنة عثم فناه أى أمر اعجبا ويقال عنا أى آخذع ليها بالعناءحتى
  تهب لى مهرها والتغفين التخليطية..ل ثوب فيه تفنين اذا كانت فيه طرائق ليست من جنسه
  ورجل مفنّ يأتى بالهجائب واهر أة مفنة والفنان فى شعر الاعشى الهار الوحشى الذى يأتى
  فنون من العدور فلن ) ابن السرّاج فلان كتاية عن اسم سمى به المحدّث عنه خاص غالب
  ويقال فى المداءيافل فتهذف.نه الااف والنون اغير تخيم ولو كان زخيم القالوايافلا وربمال
  جاه ذلك فى غسير التداءضرورة قال أبو التجم• فى لحة أمسك فلانا عن فل• والليسة كثرة
  الاصوات ومعناه أمسك فلانا عن فلان ويقال فى غير الناس الفلان والفلانة بالالف واللام
  لكن الفياكون البردى وهوفيعلول يز الفينات الساعات يقال لقيته
  الفينة بعدا الهينة أى الحيز بعسد المين وان شقت -ذفت الالف واللام فقلت لقيتة فينة كما
  قالو القيته الذدرى وفى ندرى ورجل فينان الشعر أى حسن الشعرطو يله وهو فعلان
  صل القاف بن بن فى الارض قبونا ذهب وحارقبان دويبة ويقال هو فعال
  والوجه أن يكون نعلان كما ذ كرناه فى الياء والقبان القسطاس معرب وفلان قبان على فلان
  أى أمين عليه واقبأنَ تقبض منسل ا كأنّ ن تن الرجل بالضم يقتن قتانة صار قديل
  الطعم فهوفقين واهرأة قتين أيضاويسمى القرادقتينالة لة دمه قال الشماخ
