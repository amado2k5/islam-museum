text: "أَخْبَرَنَا إِسْمَاعِيلُ بْنُ مَسْعُودٍ، وَمُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، عَنْ خَالِدٍ، عَنْ شُعْبَةَ، عَنْ أَبِي إِسْحَاقَ، عَنِ الأَسْوَدِ، أَنَّ أُمَّ الْمُؤْمِنِينَ، قَالَتْ إِنَّ رَسُولَ اللَّهِ قَالَ \" لَوْلاَ أَنَّ قَوْمِي - وَفِي حَدِيثِ مُحَمَّدٍ قَوْمَكِ - حَدِيثُ عَهْدِ بِجَاهِلِيَّةٍ لَهَدَمْتُ الْكَعْبَةَ وَجَعَلْتُ لَهَا بَابَيْنِ \". فَلَمَّا مَلَكَ ابْنُ الزُّبَيْرِ جَعَلَ لَهَا بَابَيْنِ."
summary:
  ar: "حديث في سنن النسائي، رقم 2902، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2902 (The Book of Hajj), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 2902، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
