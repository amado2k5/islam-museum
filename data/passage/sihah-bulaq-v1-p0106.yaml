text: |-
  ٥٣٥
  لا تأوياللحوض أن يغبضا • ان تغرضا خيره ن أن تغيضا
  يقول ان قلا ا. خير من أن تنقصاء وقوله تعالى وما تغيض الارحام قال الاخفس أى وما
  تنقص وغيضت الدمع نقصته وحبسته ويتال غاض المكرام أى قلوا وفاض اللثام أى كنروا
  وقولهم أَعطاء تحيضاً من فيض أى قليلا من كثير والغيضة الاجمة وهى مغيض ماء يجتمع
  نينيت فيه الشهر والجمع غياض وأغياض وغيض الاسد أى أاف الغيضة
  صل اخاء ( رض لفرض الحز فى الشى يقال فرضت الزند والسوال وقرض
  الزندحيث يقدح منه وفرض القوس هو الحز الذى يقع فيسه الوتر والهع فراض والفراض
  أيضافوهة النهر قال ابيد
  تجرى خزائسه على من نابه جرى الفرات على فراض الجدول
  وقوله-م ماعليه فراض أى شى من لباس والفرض جنس من التمر قال الاصمعى أجودا
  تممجبان الفرض والبلعق قال شاعرهم
  اذا أكلت سمكاد فرضا * ذهبت طولاوذهبت عرضا
  والفرض ما أوجبه اللّٰه تعالى سمى يذِللْ لان له معالم وحدودا وقوه تعالى لأتخدْنْ من
  عبادك نصيبامة روضا أى مقتطعا محدودا والمفرض الحديدة التى يحز بما والفريض
  لسهسم المفروض فوقه والتفريض التحزيز وقرئ سورة أنزلناها وفرضناها بالتشديد قال
  أبو عمر وبن العلا فصلناها وفرضة النهرثلته التى منها بستق وفرضة البحر محط السفن وفرضة
  الدواة وضع المقس منها وفرضة الباب نجرانه والفرض الترس وأنشد أبوعبيد لصخراافى
  أرقت له مشل لمع البشير * قلب بالكف فرضاخفيفا
  ولا تقل قرصاخفيفاوا لفرض القدح قال عبيد بن الابرص يصف برقا
  فهو كنبراس النبيط أوالفر ض بكف اللاعب المس-ر
  لمسمر الذى دخل فى السمر والفرض العطية الموسومة يقال ما أصبت منه فرضا ولا قرضا
  وفرضت الرجل وأفرضته اذا أعطيته وقد فرضت له فى العطاء وفرضت له فى الديوان وفرضت
  لبقرة تفوض فروضا أى كبرت وطعنت فى السن ومنه قرله تعبالى لا فارض ولا بكر وكذلك
  فرضت البقرة تفرض بالضم فراضة والضارض والفرضى الذى يعرف الغرائض والفارض
  الضخم من كل شئ قال الاخفس يقال لحية فارضة اذا كانت عظيمة وأنشد
  شبب أصداغى فرأسى أبيض • محافل فيهارجال فرض
  وفرض اللّٰه علينا كذا وافترض أى أوجب والاسم الفريضة وبسمى العلم بقسعة المواريث
  فرائض وفى الحديث أفرضكم زيد والفريضة أيضامافرض فى الساعمة من الصدقة يقال
  أفرضت الماشية أى وجبت فيها القريضة وذلك اذا يلغت نسايا والغريضتات الجذعة من
  الغنم والحقة من الابل ⁦(فضض)⁩ الفض الكسر بالتفرقة وقد فضه يفضه وفضضت ختم
  المكتاب وفى الحمديت لا يفضصٍ اللّٰه فالك ولا تقل بكسر لا يفضض والمقضة ما يفض به المدر
  وفضاض الشى ما تفرّق منه عند كسرك اياه وانفض الشئ أى انكسر وفضفت القوم
  فانفضوا أى فرّقتهم فتفرّقوا وكل شئ تفرّق ذهو فضص وفى الحديث أنت فضص من اعنة اللّٰه
  قوله محط السفن وفى سنخة
  حرفأالفن اه مر
