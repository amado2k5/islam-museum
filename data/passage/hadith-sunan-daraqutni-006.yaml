text: "تلفظ به، لا إلى نفس العقيقة، والله أعلم، وقد ألفت في هذا الباب رسالة مستقلة : سميتها بالأقوال الصحيحة في أحكام النسيكة، وهي رسالة جامعة في هذا الباب، وبالله التوفيق. (١) قوله: (عن جابر عن عكرمة). جابر هو الجعفي، وهو"
