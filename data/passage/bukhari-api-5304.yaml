label: { ar: "صحيح البخاري 5304 — الأب والأبوة، اليتيم وفقد الأب", en: "Sahih al-Bukhari 5304 — the father and fatherhood; the orphan and the father lost", ur: "صحیح بخاری 5304 — باپ اور والدیت، یتیم اور باپ کی موت", es: "Sahih al-Bukhari 5304 — El padre y la paternidad; el huérfano y el padre perdido", fr: "Sahih al-Bukhari 5304 — Le père et la paternité; l’orphelin et le père perdu" }
text: "حَدَّثَنَا عَمْرُو بْنُ زُرَارَةَ، أَخْبَرَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي حَازِمٍ، عَنْ أَبِيهِ، عَنْ سَهْلٍ، قَالَ رَسُولُ اللَّهِ \" أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا \". وَأَشَارَ بِالسَّبَّابَةِ وَالْوُسْطَى، وَفَرَّجَ بَيْنَهُمَا شَيْئًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 5304، يذكر الأب والأبوة، واليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5304 (Divorce), that mentions the father and fatherhood, the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5304، جس میں باپ اور والدیت، یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5304 (Divorcio), menciona al padre y la paternidad, al huérfano y al padre ausente. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5304 (Divorce), évoque le père et la paternité, l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
