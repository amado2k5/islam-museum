label: { ar: "الموطأ 2421 — مالك: من سرق المتاع المحرز في الأسواق بلغ قيمته ما يجب فيه القطع", en: "Muwatta 2421" }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: الأمر عندنا في الذي يسرق أمتعة الناس الموضوعة بالأسواق محرزة، قد أحرزها أهلها في أوعيتهم وضم بعضها إلى بعض: إنه من سرق من ذلك شيئا من حرزه، فبلغ قيمته ما يجب فيه القطع، فعليه القطع، كان صاحب المتاع عند متاعه أو لم يكن، ليلا أو نهارا. {cite:muwatta-maruf-1997 p.400}"
