text: "… بن عبد العزى. ابن قصى وبتو عبد بن قصى، فقال ابو لهب : هذه بنو عبد مناف عندك فقل. فقال رسول اللّٰه : ان اللّه امرنى ان أنذر عشيرتى الأقربين و أنتم الأقربون من قريش وإنى لا املك لكم من …"
