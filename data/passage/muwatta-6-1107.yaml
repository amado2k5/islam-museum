label: { ar: "الموطأ 1107 — عبد الله بن دينار: كان ابن عمر يهدي في الحج بدنتين بدنتين، وفي العمرة بدنة بدنة، ورآه ينحر بدنة في العمرة وهي قائمة في دار خالد بن أسيد، وطعن في لبة بدنته حتى خرجت الحربة من تحت كتفها", en: "Muwatta 1107" }
summary:
  ar: "يرويه مالك عن عبد الله بن دينار أن عبد الله بن عمر كان يهدي في الحج بدنتين بدنتين، وفي العمرة بدنة بدنة. قال: ورأيته في العمرة ينحر بدنة، وهي قائمة في دار خالد بن أسيد، وكان فيها منزله، ولقد رأيته طعن في لبة بدنته حتى خرجت الحربة من تحت كتفها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1200) وسويد (523). {cite:muwatta-maruf-1997 p.509}"
