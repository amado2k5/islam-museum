text: "… بعد الفيل بثلاث سنين. وهو أول خليفة كان في الإسلام، وأول من حج أميراً في الإسلام، فإن رسول اللّٰه مل فتح مكة سنة ثمان، وسَيَّر أبا بكر يحج بالناس أميراً سنة تسع، وهو أول من جمع القرآن، وقيل: علي بن …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 713، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 713, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 713 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 713, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 713), mentionne la collecte du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin resimli 1. cildinin 713. sayfasında, Kur'an'ın derlenmesi ve el yazmaları hakkında bilgi verilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 1 bergambar, halaman 713, menyebutkan penyusunan Al-Qur'an dan manuskrip-manuskripnya; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
