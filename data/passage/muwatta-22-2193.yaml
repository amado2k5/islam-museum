label: { ar: "الموطأ 2193 — مالك: من أعطى عطية ثم نكل المعطي، فجاء الذي أعطيها بشاهد يشهد له أنه أعطاه، أحلف الذي أعطي مع شهادة شاهده، فإن أبى حلف المعطي، فإن أبى أيضا أدى إلى المعطى ما ادعى إذا كان له شاهد واحد", en: "Muwatta 2193", es: "Muwatta 2193", fr: "Muwatta 2193", ur: "موطا 2193", tr: "El-Muvatta 2193 — Malik: Bir kimse bir hediye verirse ve sonra veren sözünden dönerse ve alan da hediyeyi kendisine verdiğine dair şahitlik edecek bir tanık getirirse, alan da şahidinin ifadesiyle birlikte yemin eder. Eğer yemin etmeyi reddederse, veren yemin eder. Eğer o da yemin etmeyi reddederse, sadece bir şahidi varsa, alan kişiye iddia ettiği şeyi ödemek zorundadır.", id: "Al-Muwatta 2193 — Malik: Jika seseorang memberi hadiah dan kemudian pemberi mengingkari janjinya, dan penerima membawa saksi untuk bersaksi bahwa dialah yang memberikannya, maka penerima wajib bersumpah bersama dengan kesaksian saksinya. Jika ia menolak, maka pemberi bersumpah. Jika ia juga menolak, maka pemberi harus membayar kepada penerima apa yang telah diklaimnya jika ia hanya memiliki satu saksi." }
summary:
  ar: "قال مالك: ومن أعطى عطية ثم نكل الذي أعطاها، فجاء الذي أعطيها بشاهد يشهد له أنه أعطاه ذلك، عرضا كان أو ذهبا أو ورقا أو حيوانا، أحلف الذي أعطي مع شهادة شاهده. فإن أبى الذي أعطي أن يحلف، حلف المعطي. وإن أبى أن يحلف أيضا، أدى إلى المعطى ما ادعى عليه، إذا كان له شاهد واحد. فإن لم يكن له شاهد، فلا شيء له. {cite:muwatta-maruf-1997 p.300}"
  tr: "Malik şöyle demiştir: Eğer birisi bir hediye verirse ve alan kişi onu almayı reddederse ve alan kişi, ister mal, ister altın, ister gümüş, ister hayvan olsun, hediyeyi kendisinin verdiğine dair şahitlik edecek bir tanık getirirse, alan kişi de tanığın ifadesiyle birlikte yemin etmek zorundadır. Eğer alan kişi yemin etmeyi reddederse, veren kişi yemin eder. Eğer o da yemin etmeyi reddederse, bir şahidi varsa, alan kişiye talep ettiği şeyi ödemek zorundadır. Eğer şahidi yoksa, hiçbir şeye hakkı yoktur. {cite:muwatta-maruf-1997 s.300}"
  id: "Malik berkata: Jika seseorang memberi hadiah dan kemudian penerima menolak untuk menerimanya, dan penerima membawa saksi untuk bersaksi bahwa dialah yang memberikannya, baik itu barang, emas, perak, atau hewan, penerima wajib bersumpah bersama dengan kesaksian saksi. Jika penerima menolak untuk bersumpah, pemberi harus bersumpah. Jika ia juga menolak untuk bersumpah, ia harus membayar kepada penerima apa yang diklaimnya, jika ia memiliki satu saksi. Jika ia tidak memiliki saksi, ia tidak berhak atas apa pun. {cite:muwatta-maruf-1997 p.300}"
