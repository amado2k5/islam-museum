label: { ar: "الموطأ 2193 — مالك: من أعطى عطية ثم نكل المعطي، فجاء الذي أعطيها بشاهد يشهد له أنه أعطاه، أحلف الذي أعطي مع شهادة شاهده، فإن أبى حلف المعطي، فإن أبى أيضا أدى إلى المعطى ما ادعى إذا كان له شاهد واحد", en: "Muwatta 2193" }
summary:
  ar: "قال مالك: ومن أعطى عطية ثم نكل الذي أعطاها، فجاء الذي أعطيها بشاهد يشهد له أنه أعطاه ذلك، عرضا كان أو ذهبا أو ورقا أو حيوانا، أحلف الذي أعطي مع شهادة شاهده. فإن أبى الذي أعطي أن يحلف، حلف المعطي. وإن أبى أن يحلف أيضا، أدى إلى المعطى ما ادعى عليه، إذا كان له شاهد واحد. فإن لم يكن له شاهد، فلا شيء له. {cite:muwatta-maruf-1997 p.300}"
