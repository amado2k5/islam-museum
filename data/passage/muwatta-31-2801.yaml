label:
  ar: 'الموطأ 2801 — عمرو بن شعيب عن أبيه عن جده: الراكب شيطان والراكبان شيطانان'
  en: Muwatta 2801
  es: "Muwatta 2801"
  fr: "Muwatta 2801"
  ur: "موطا 2801"
  tr: "El-Muvatta 2801 — Amr ibn Şuayb, babasından, o da dedesinden rivayetle: Tek süvari şeytandır, iki süvari iki şeytandır."
  id: "Al-Muwatta 2801 — Amr ibn Shu’ayb, berdasarkan riwayat ayahnya, berdasarkan riwayat kakeknya: Satu penunggang kuda adalah setan, dan dua penunggang kuda adalah dua setan."
summary:
  ar: 'يروي مالك عن عبد الرحمن بن حرملة، عن عمرو بن شعيب، عن أبيه، عن جده، أن النبي قال: الراكب شيطان، والراكبان شيطانان، والثلاثة ركب. {cite:muwatta-maruf-1997 p.574}'
  tr: "Malik, Abdülrahman ibn Harmalah'tan, o da Amr ibn Şuayb'dan, o da babasından, o da dedesinden rivayetle, Peygamberimizin şöyle buyurduğunu nakletmiştir: \"Tek süvari şeytandır, iki süvari iki şeytandır, üç süvari ise bir gruptur.\" {cite:muwatta-maruf-1997 s.574}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn Harmalah, dari Amr ibn Shu'ayb, dari ayahnya, dari kakeknya, bahwa Nabi bersabda: \"Satu penunggang adalah setan, dua penunggang adalah dua setan, dan tiga adalah sekelompok setan.\" {cite:muwatta-maruf-1997 p.574}"
