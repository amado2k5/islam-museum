label: { ar: "الموطأ 2198 — يحيى عن مالك: فيمن نحل ولده نحلا أو أعطاه عطاء ليس بصدقة، إن له أن يعتصر ذلك ما لم يستحدث الولد دينا يداينه الناس به، ويأمنونه عليه من أجل ذلك العطاء، فليس لأبيه أن يعتصر شيئا بعد أن تكون عليه الديون", en: "Muwatta 2198", es: "Muwatta 2198", fr: "Muwatta 2198", ur: "موطا 2198", tr: "El-Muvatta 2198 — Yahya, Malik'ten rivayetle: Bir kimse, oğluna sadaka olmayan bir hediye veya armağan verdiğinde, oğlu bu hediye nedeniyle kendisine borç vermediği ve kendisine emanet edilmediği sürece, babanın onu geri alma hakkı vardır. Borç oluştuktan sonra babanın hiçbir şeyi geri alma hakkı yoktur.", id: "Al-Muwatta 2198 — Yahya berdasarkan riwayat Malik: Mengenai orang yang memberikan hadiah atau pemberian kepada anaknya yang bukan merupakan sedekah, ia berhak untuk menuntutnya kembali selama anaknya tidak berhutang kepada orang lain karena hadiah tersebut. Ayahnya tidak berhak menuntut kembali apa pun setelah hutang tersebut timbul." }
summary:
  ar: "قال: وسمعت مالكا يقول: الأمر المجتمع عليه عندنا فيمن نحل ولده نحلا، أو أعطاه عطاء ليس بصدقة: إن له أن يعتصر ذلك، ما لم يستحدث الولد دينا يداينه الناس به، ويأمنونه عليه من أجل ذلك العطاء الذي أعطاه أبوه، فليس لأبيه أن يعتصر من ذلك شيئا، بعد أن تكون عليه الديون. {cite:muwatta-maruf-1997 p.301}"
  tr: "Şöyle dedi: Malik'in şöyle dediğini duydum: Aramızdaki görüş birliği şudur ki, eğer bir kimse oğluna sadaka olmayan bir hediye verirse, bunu geri alma hakkına sahiptir; ancak oğul, babasının verdiği bu hediye nedeniyle kendisine borç veren ve borçlarını ödemesini bekleyen kişilerden borç alırsa durum değişir. Bu durumda, borçlar oluştuktan sonra babanın bundan hiçbir şey geri alma hakkı yoktur. {cite:muwatta-maruf-1997 s.301}"
  id: "Dia berkata: Saya mendengar Malik berkata: Konsensus di antara kita adalah bahwa jika seseorang memberi anaknya hadiah, atau memberinya pemberian yang bukan sedekah, dia berhak untuk mengambilnya kembali, kecuali jika anak tersebut berhutang yang dipinjam orang darinya dan orang tersebut mempercayainya untuk membayarnya kembali karena hadiah yang diberikan ayahnya. Dalam hal itu, ayahnya tidak berhak untuk mengambil kembali apa pun setelah hutang tersebut terjadi. {cite:muwatta-maruf-1997 p.301}"
