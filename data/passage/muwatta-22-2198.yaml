label: { ar: "الموطأ 2198 — يحيى عن مالك: فيمن نحل ولده نحلا أو أعطاه عطاء ليس بصدقة، إن له أن يعتصر ذلك ما لم يستحدث الولد دينا يداينه الناس به، ويأمنونه عليه من أجل ذلك العطاء، فليس لأبيه أن يعتصر شيئا بعد أن تكون عليه الديون", en: "Muwatta 2198" }
summary:
  ar: "قال: وسمعت مالكا يقول: الأمر المجتمع عليه عندنا فيمن نحل ولده نحلا، أو أعطاه عطاء ليس بصدقة: إن له أن يعتصر ذلك، ما لم يستحدث الولد دينا يداينه الناس به، ويأمنونه عليه من أجل ذلك العطاء الذي أعطاه أبوه، فليس لأبيه أن يعتصر من ذلك شيئا، بعد أن تكون عليه الديون. {cite:muwatta-maruf-1997 p.301}"
