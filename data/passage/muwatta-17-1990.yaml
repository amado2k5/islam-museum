label: { ar: "الموطأ 1990 — مالك: بلغه أن رجلا أتى عبد الله بن عمر فقال: إني أسلفت رجلا سلفا، واشترطت عليه أفضل مما أسلفته، فقال ابن عمر: فذلك الربا. وقال: السلف على ثلاثة وجوه: سلف تريد به وجه الله، وسلف تريد به وجه صاحبك، وسلف تسلفه لتأخذ خبيثا بطيب فذلك الربا", en: "Muwatta 1990", es: "Muwatta 1990", fr: "Muwatta 1990", ur: "موطا 1990", tr: "El-Muvatta 1990 — Malik: Abdullah ibn Umar'a bir adamın gelip şöyle dediği rivayet edilir: \"Bir adama borç verdim ve ondan borç verdiğimden daha fazlasını geri ödemesini istedim.\" İbn Umar şöyle dedi: \"Bu faizdir.\" Ayrıca şöyle buyurdu: \"Borçlar üç çeşittir: Allah rızası için alınan borç, dost rızası için alınan borç ve iyi bir şey karşılığında kötü bir şey almak için alınan borç; işte bu faizdir.\"", id: "Al-Muwatta 1990 — Malik: Sampai kepadanya bahwa seorang pria datang kepada Abdullah ibn Umar dan berkata: “Saya memberi pinjaman kepada seseorang, dan saya menetapkan syarat agar dia mengembalikan lebih dari yang saya pinjamkan.” Ibn Umar berkata: “Itu adalah riba.” Beliau juga berkata: “Pinjaman ada tiga macam: pinjaman yang dilakukan karena Allah, pinjaman yang dilakukan karena temanmu, dan pinjaman yang dilakukan untuk mengambil sesuatu yang buruk sebagai ganti sesuatu yang baik—itu adalah riba.”" }
summary:
  ar: "قال مالك: بلغه أن رجلا أتى عبد الله بن عمر، فقال: يا أبا عبد الرحمن، إني أسلفت رجلا سلفا، واشترطت عليه أفضل مما أسلفته. فقال عبد الله بن عمر: فذلك الربا. قال: فكيف تأمرني يا أبا عبد الرحمن؟ فقال عبد الله: السلف على ثلاثة وجوه: سلف تسلفه تريد به وجه الله، فلك وجه الله. وسلف تسلفه تريد به وجه صاحبك، فلك وجه صاحبك. وسلف تسلفه لتأخذ خبيثا بطيب، فذلك الربا. قال: فكيف تأمرني؟ قال: أرى أن تشق الصحيفة، فإن أعطاك مثل الذي أسلفته قبلته، وإن أعطاك دون الذي أسلفته فأخذته أجرت، وإن أعطاك أفضل مما أسلفته طيبة به نفسه، فذلك شكر شكره لك، ولك أجر ما أنظرته. {cite:muwatta-maruf-1997 p.214} {cite:muwatta-maruf-1997 p.215}"
  tr: "Malik şöyle dedi: Abdullah ibn Umar'a bir adamın gelip, \"Ey Ebu Abdül-Rahman, bir adama borç verdim ve ondan borç verdiğimden daha fazlasını geri ödemesini istedim\" dediği rivayet edildi. Abdullah ibn Umar, \"Bu faizdir\" dedi. Adam, \"Öyleyse bana ne yapmamı tavsiye edersiniz, ey Ebu Abdül-Rahman?\" diye sordu. Abdullah şöyle cevap verdi: \"Borçlar üç çeşittir: Allah'ın rızasını umarak verdiğiniz borç, Allah'ın rızasını kazanırsınız; borç verenin rızasını umarak verdiğiniz borç, borç verenin rızasını kazanırsınız; ve bir iyilik karşılığında kötülük almak için verdiğiniz borç, bu faizdir.\" Adam, \"Öyleyse bana ne yapmamı tavsiye edersiniz?\" diye sordu. Abdullah şöyle dedi: “Size tavsiyem, belgeyi yırtmanızdır. Eğer size borç verdiğiniz miktarın aynısını verirse, kabul edin. Borç verdiğinizden daha azını verirse, alın ve mükafatlandırılacaksınız. Borç verdiğinizden daha fazlasını gönüllü olarak verirse, bu size olan minnettarlığıdır ve size ayırdığı zaman için mükafatlandırılacaksınız.”"
  id: "Malik berkata: Sampai kepadanya seorang pria datang kepada Abdullah ibn Umar dan berkata, “Wahai Abu Abd al-Rahman, saya telah memberi pinjaman kepada seseorang dan mensyaratkan agar ia mengembalikan lebih dari yang saya pinjamkan.” Abdullah ibn Umar berkata, “Itu adalah riba.” Pria itu bertanya, “Jadi, apa yang engkau sarankan kepadaku, wahai Abu Abd al-Rahman?” Abdullah menjawab, “Pinjaman ada tiga macam: pinjaman yang kamu berikan untuk mencari ridha Allah, dalam hal ini kamu akan menerima ridha Allah; pinjaman yang kamu berikan untuk mencari ridha pemberi pinjaman, dalam hal ini kamu akan menerima ridha pemberi pinjaman; dan pinjaman yang kamu berikan untuk mengambil sesuatu yang buruk sebagai ganti sesuatu yang baik, dalam hal ini itu adalah riba.” Pria itu bertanya, “Jadi, apa yang engkau sarankan kepadaku?” Abdullah berkata, “Saya menyarankan Anda untuk merobek dokumen itu. Jika dia mengembalikan jumlah yang sama dengan yang Anda pinjamkan, terimalah. Jika dia mengembalikan kurang dari yang Anda pinjamkan, terimalah, dan Anda akan mendapat pahala. Jika dia mengembalikan lebih dari yang Anda pinjamkan, dengan sukarela, itu adalah rasa terima kasihnya kepada Anda, dan Anda akan mendapat pahala atas waktu yang telah dia berikan kepada Anda.”"
