label: { ar: "الموطأ 1990 — مالك: بلغه أن رجلا أتى عبد الله بن عمر فقال: إني أسلفت رجلا سلفا، واشترطت عليه أفضل مما أسلفته، فقال ابن عمر: فذلك الربا. وقال: السلف على ثلاثة وجوه: سلف تريد به وجه الله، وسلف تريد به وجه صاحبك، وسلف تسلفه لتأخذ خبيثا بطيب فذلك الربا", en: "Muwatta 1990" }
summary:
  ar: "قال مالك: بلغه أن رجلا أتى عبد الله بن عمر، فقال: يا أبا عبد الرحمن، إني أسلفت رجلا سلفا، واشترطت عليه أفضل مما أسلفته. فقال عبد الله بن عمر: فذلك الربا. قال: فكيف تأمرني يا أبا عبد الرحمن؟ فقال عبد الله: السلف على ثلاثة وجوه: سلف تسلفه تريد به وجه الله، فلك وجه الله. وسلف تسلفه تريد به وجه صاحبك، فلك وجه صاحبك. وسلف تسلفه لتأخذ خبيثا بطيب، فذلك الربا. قال: فكيف تأمرني؟ قال: أرى أن تشق الصحيفة، فإن أعطاك مثل الذي أسلفته قبلته، وإن أعطاك دون الذي أسلفته فأخذته أجرت، وإن أعطاك أفضل مما أسلفته طيبة به نفسه، فذلك شكر شكره لك، ولك أجر ما أنظرته. {cite:muwatta-maruf-1997 p.214} {cite:muwatta-maruf-1997 p.215}"
