text: "وَإِذَا جَآءَتْهُمْ ءَايَةٌ قَالُوا۟ لَن نُّؤْمِنَ حَتَّىٰ نُؤْتَىٰ مِثْلَ مَآ أُوتِىَ رُسُلُ ٱللَّهِ ۘ ٱللَّهُ أَعْلَمُ حَيْثُ يَجْعَلُ رِسَالَتَهُۥ ۗ سَيُصِيبُ ٱلَّذِينَ أَجْرَمُوا۟ صَغَارٌ عِندَ ٱللَّهِ وَعَذَابٌ شَدِيدٌۢ بِمَا كَانُوا۟ يَمْكُرُونَ"
text_search: "وإذا جاءتهم آية قالوا لن نؤمن حتى نؤتى مثل ما أوتي رسل الله ۘ الله أعلم حيث يجعل رسالته ۗ سيصيب الذين أجرموا صغار عند الله وعذاب شديد بما كانوا يمكرون"
translations:
  en: { text: "And when a token cometh unto them, they say: We will not believe till we are given that which Allah's messengers are given. Allah knoweth best with whom to place His message. Humiliation from Allah and heavy punishment will smite the guilty for their scheming.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور جب ان کے پاس کوئی آیت آتی ہے تو کہتے ہیں کہ جس طرح کی رسالت خدا کے پیغمبروں کو ملی ہے جب تک اسی طرح کی رسالت ہم کو نہ ملے ہم ہرگز ایمان نہیں لائیں گے اس کو خدا ہی خوب جانتا ہے کہ (رسالت کا کون سا محل ہے اور) وہ اپنی پیغمبری کسے عنایت فرمائے جو لوگ جرم کرتے ہیں ان کو خدا کے ہاں ذلّت اور عذابِ شدید ہوگا اس لیے کہ مکّاریاں کرتے تھے", translator: "Fateh Muhammad Jalandhari", license: PD }
