  en: "A report in Sahih al-Bukhari, no. 3918 (Merits of the Helpers in Madinah (Ansaar)), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
