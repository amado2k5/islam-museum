text: "قَالَ الْبَرَاءُ فَدَخَلْتُ مَعَ أَبِي بَكْرٍ عَلَى أَهْلِهِ، فَإِذَا عَائِشَةُ ابْنَتُهُ مُضْطَجِعَةٌ، قَدْ أَصَابَتْهَا حُمَّى، فَرَأَيْتُ أَبَاهَا فَقَبَّلَ خَدَّهَا، وَقَالَ كَيْفَ أَنْتِ يَا بُنَيَّةُ"
summary:
