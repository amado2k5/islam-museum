label: { ar: "صحيح البخاري 3918 — الحمى", en: "Sahih al-Bukhari 3918 — fever", ur: "صحیح بخاری 3918 — بخار", es: "Sahih al-Bukhari 3918 - fiebre", fr: "Sahih al-Bukhari 3918 – fièvre", tr: "Sahih el-Buhari 3918 — Ateş", id: "Sahih al-Bukhari 3918 — Demam" }
text: "قَالَ الْبَرَاءُ فَدَخَلْتُ مَعَ أَبِي بَكْرٍ عَلَى أَهْلِهِ، فَإِذَا عَائِشَةُ ابْنَتُهُ مُضْطَجِعَةٌ، قَدْ أَصَابَتْهَا حُمَّى، فَرَأَيْتُ أَبَاهَا فَقَبَّلَ خَدَّهَا، وَقَالَ كَيْفَ أَنْتِ يَا بُنَيَّةُ"
summary:
  ar: "حديث في صحيح البخاري، رقم 3918، يذكر الحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3918 (Merits of the Helpers in Madinah (Ansaar)), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3918، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3918 (Méritos de los Ayudantes en Medina (Ansar)), menciona la fiebre. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 3918 (Mérites des Compagnons de Médine (Ansar)), mentionne la fièvre. Le navigateur de textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 3918 numaralı hadis, ateşten bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3918, menyebutkan tentang demam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
