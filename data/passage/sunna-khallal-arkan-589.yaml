text: "… بن مُرَّةَ الأنصاري: أن رجلًا ذُكِرَ عند النبي ول بحياءٍ، فقال رسول اللّٰه كله: إن الإيمان ذو شعبٍ، وإن الحياء شُعبة مِن الإيمان. - حدثنا أبو عبد الله، قال: سمعت وكيعًا يقول: الإيمان يزيد وينقص. قال: وكذا كان سُفيان يقول. …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 589، يذكر شعب الإيمان، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 589, that mentions the branches of faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 589 کا اقتباس جس میں ایمان کی شاخیں، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 589, que menciona las ramas de la fe, su aumento y disminución; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 589, évoquant les branches de la foi, la croissance et la diminution de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 589. sayfasından, imanın dalları ile imanın artışı ve azalışını ele alan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari buku Al-Khallal \"Al-Sunnah,\" halaman 589, yang membahas cabang-cabang iman dan peningkatan serta penurunan iman; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
