ref: "1.9"
label: { ar: "الموطأ 9 — أبو هريرة يبين أوقات الصلاة بالظل", en: "Muwatta 9" }
text: "صل الظهر إذا كان ظلك مثلك، والعصر إذا كان ظلك مثليك، والمغرب إذا غربت الشمس، والعشاء ما بينك وبين ثلث الليل، وصل الصبح بغبش"
summary:
  ar: "أثر يرويه مالك عن يزيد بن زياد عن عبد الله بن رافع مولى أم سلمة، في باب وقوت الصلاة: سأل أبا هريرة عن وقت الصلاة فبيّنه له بالظل: الظهر إذا صار ظل المرء مثله، والعصر إذا صار مثليه، والمغرب عند الغروب، والعشاء إلى ثلث الليل، والصبح في بقية ظلمة الليل، وفسر الراوي الغبش بالغلس. وينقل المحقق عن ابن عبد البر أنه موقوف في الموطأ عند جماعة رواته، وأن «المواقيت لا تؤخذ بالرأي ولا تدرك إلا بالتوقيف» (التمهيد 23/86). {cite:muwatta-maruf-1997 p.38}"
  en: "Abu Hurayra explains to his questioner the times of the five prayers, among them noon when a person's shadow becomes twice his height, and the dawn prayer in the last darkness."
