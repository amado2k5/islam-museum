label: { ar: "الموطأ 9 — أبو هريرة يبين أوقات الصلاة بالظل", en: "Muwatta 9", es: "Muwatta 9", fr: "Muwatta 9", ur: "موطا 9", tr: "Al-Muwatta 9 — Ebu Hureyre gölgeyi kullanarak namaz vakitlerini açıklıyor", id: "Al-Muwatta 9 — Abu Hurairah menjelaskan waktu sholat dengan menggunakan naungan" }
text: "صل الظهر إذا كان ظلك مثلك، والعصر إذا كان ظلك مثليك، والمغرب إذا غربت الشمس، والعشاء ما بينك وبين ثلث الليل، وصل الصبح بغبش"
summary:
  ar: "أثر يرويه مالك عن يزيد بن زياد عن عبد الله بن رافع مولى أم سلمة، في باب وقوت الصلاة: سأل أبا هريرة عن وقت الصلاة فبيّنه له بالظل: الظهر إذا صار ظل المرء مثله، والعصر إذا صار مثليه، والمغرب عند الغروب، والعشاء إلى ثلث الليل، والصبح في بقية ظلمة الليل، وفسر الراوي الغبش بالغلس. وينقل المحقق عن ابن عبد البر أنه موقوف في الموطأ عند جماعة رواته، وأن «المواقيت لا تؤخذ بالرأي ولا تدرك إلا بالتوقيف» ⁦(التمهيد 23/86)⁩. {cite:muwatta-maruf-1997 p.38}"
  en: "Abu Hurayra explains to his questioner the times of the five prayers, among them noon when a person's shadow becomes twice his height, and the dawn prayer in the last darkness."
  es: "Abu Hurayra explica a quien le pregunta los horarios de las cinco oraciones, entre ellas la del mediodía, cuando la sombra de una persona alcanza el doble de su altura, y la oración del amanecer, en la última oscuridad."
  fr: "Abou Hourayra explique à son interlocuteur les horaires des cinq prières, parmi lesquelles celle de midi, lorsque l'ombre d'une personne atteint deux fois sa hauteur, et la prière de l'aube, dans l'obscurité des dernières nuits."
  ur: "ابوہریرہ اپنے سائل کو پانچوں نمازوں کے اوقات بتاتے ہیں، ان میں سے ظہر کے وقت جب آدمی کا سایہ اس سے دوگنا ہو جاتا ہے اور آخری اندھیرے میں فجر کی نماز۔"
  tr: "Malik'in, Yezid ibn Ziyad'dan, o da Ümmü Seleme'nin azatlı kölesi Abdullah ibn Rafi'den rivayet ettiği, namaz vakitleri bölümündeki bir rivayette şöyle denmektedir: Ebu Hurayra'ya namaz vakitlerini sormuş ve o da ona gölgeyle açıklamıştır: Öğle namazı, kişinin gölgesi boyuna eşit olduğunda; ikindi namazı, boyunun iki katı olduğunda; akşam namazı, güneş battığında; yatsı namazı, gecenin üçte biri geçene kadar; sabah namazı ise gecenin kalan karanlığında kılınır. Rivayet eden kişi \"alacakaranlık\" kelimesini \"karanlık\" olarak yorumlamıştır. Editör, İbn Abdül-Barr'ın, bunun el-Muvatta'da bir grup râviye atfedilen bir ifade olduğunu ve \"namaz vakitlerinin görüşe bağlı olmadığını, yalnızca ilahi talimatla bilindiğini\" söylediğini aktarmaktadır (el-Temhid 23/86). {cite:muwatta-maruf-1997 s.38}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yazid ibn Ziyad, atas otoritas Abdullah ibn Rafi, budak yang dibebaskan oleh Umm Salamah, dalam surah tentang waktu-waktu shalat: Dia bertanya kepada Abu Hurayrah tentang waktu-waktu shalat, dan dia menjelaskannya kepadanya dengan bayangan: Dzuhur ketika bayangan seseorang sama panjangnya dengan tinggi badannya, Ashar ketika bayangannya dua kali panjangnya, Maghrib saat matahari terbenam, Isya hingga sepertiga malam berlalu, dan Subuh di sisa kegelapan malam. Perawi menafsirkan \"senja\" sebagai \"kegelapan.\" Editor mengutip Ibn Abd al-Barr yang mengatakan bahwa itu adalah pernyataan yang dinisbahkan kepada sekelompok perawi dalam al-Muwatta, dan bahwa \"waktu-waktu shalat tidak ditentukan oleh pendapat dan hanya diketahui melalui petunjuk ilahi\" (al-Tamhid 23/86). {cite:muwatta-maruf-1997 p.38}"
