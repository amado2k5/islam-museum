label: { ar: "سنن ابن ماجه 282 — محو السيئات وحط الخطايا", en: "Sunan Ibn Majah 282 — bad deeds erased and sins shed", ur: "سنن ابن ماجہ 282 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sunan Ibn Majah 282 — Las malas acciones son borradas y los pecados son perdonados", fr: "Sunan Ibn Majah 282 — Les mauvaises actions sont effacées et les péchés pardonnés", tr: "Sunan İbn Majah 282 — Günahları silmek ve suçları ortadan kaldırmak", id: "Sunan Ibn Majah 282 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "… بْنِ يَسَارٍ، عَنْ عَبْدِ اللَّهِ الصُّنَابِحِيِّ، عَنْ رَسُولِ اللَّهِ ـ قَالَ \" مَنْ تَوَضَّأَ فَمَضْمَضَ وَاسْتَنْشَقَ خَرَجَتْ خَطَايَاهُ مِنْ فَمِهِ وَأَنْفِهِ فَإِذَا غَسَلَ وَجْهَهُ خَرَجَتْ خَطَايَاهُ مِنْ وَجْهِهِ حَتَّى تَخْرُجَ مِنْ تَحْتِ أَشْفَارِ عَيْنَيْهِ فَإِذَا غَسَلَ يَدَيْهِ خَرَجَتْ خَطَايَاهُ مِنْ يَدَيْهِ فَإِذَا مَسَحَ رَأْسَهُ خَرَجَتْ خَطَايَاهُ مِنْ رَأْسِهِ حَتَّى تَخْرُجَ مِنْ أُذُنَيْهِ فَإِذَا غَسَلَ رِجْلَيْهِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 282، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 282 (The Book of Purification and its Sunnah), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 282، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 282 (El Libro de la Purificación y su Sunnah), que habla de malas acciones borradas y pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 282 (Le Livre de la Purification et sa Sunna), évoque l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 282 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 282, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
