text: "… أنَّ النبي علله كتبه لوائل بن حُجْر، وغريبه. التِّيعَة: الأربعون من الغنم، وهي أقل ما يجب فيه الزكاة منها، وقيل: هو اسم لأدنى ما تجب فيه الزكاة من كُلّ الحيوان. والتِّيمَة لصاحبها: هي الشاة الزائدة على الأربعين حتى تبلغَ الفريضة …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 579، يرد فيه ذكر الفريضة والفرائض، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
