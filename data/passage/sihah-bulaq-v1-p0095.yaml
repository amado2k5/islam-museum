text: |-
  ٤٦م
  ⁦(باب الطاء)⁩
  وقد احبنطيت قان حة رت فأنت بالخياران شئت حذفت المون وأبدات من الالف ياء وقلت
  حبيط بكسرالطاهمنونالان الااف ليست للتأنيث فتفتح ما قبلها كما يفتح فى تصغير حبلى
  و يشرى وان شئت بقيت الذون وحذفت الالقب وقات حبينط وكذلك كل اسم فيه زيادتان
  للالحاق فاحذف أيته-ماشئت وان شئت أيضاعوضت من المهذوف فى الموضعين وان شئت
  لم تعوّض فان عوّضت فى الأول قلت حبيط بتسديد الياء والطاءمكسورة وقلت فى الشانى
  حبينيط وكذلك القول فى عفرنى ( طط حط الرحل والسرج والقوس وحط أى نزل
  والعط المنزل واتحط السعروغيره وتقول استطى فلان من التمن شيئا والحطيطة كذاوكذا
  من التمن وقوله تعالى حطة أى حط عنا أوزارنا ويقال هى كلمة أمر بها بذو اسرائيل لوقالوها
  لعات أوزارهم وحطه أى حدده والحعاوط الحدور والحطوط النههيبة السريعة وجارية
  محطوطة المتنين أى ممدودة مستوية قال الشاعر
  بيضاء محطوطة المتنين بهكنة * ريا الروادف لم تذل بأولاد
  وحط البعيرفى السيرحطاطا اعتقمد فى زمامه قال الشماخ.
  وان ضربت على العلات حطت • اليك حطاط هادية شنون
  ورجل حطائط بالضم أى صغير وحطائط بن يعفر أخو الاسود قان أبو عمر وافحطت النساقة
  فى سيرها أى أسرعت والحطاط بالفتح شبيه بالبفوريكون حول الحوق وأنشد الاصححى
  قام الى عذراء بالغطاط • يمشى بعثل هائم الفسطاط • بمكفهر اللون ذى حظاط
  الواحدة حطاطة وربما كانت فى الوجه ومنه قول الهذلى
  ووجه قد جلون أ.يم صاف كفرن الشمس ليس بذى حطاط
  والحطاط أيضاز بد اللبن والحط بالكسر الذى يوشم به ويقال هوالحديدة التى تسكون مع
  الخرازين بنقدون بعا الاديم قال الشاعر
  كأن محطا فى يدى حارثية * صناع علت مى به الجلد من على
  وعمران بن حطان بكسر الماء وهو فعلان ⁦( حقط)⁩ الحية طان ذكر الدراج قال الطرماح
  من الهوذ كدراء السراة ولونها * خصيف كاون الحيقطان المسجج
  ⁦( حلط)⁩ الاحتلاط الغضب والضجر وفى كلام علقمة بعلاثة ان أول الى الاحتلاط
  وأ-وأ القول الافراط وأحلط الرجل فى المين اذا اجتهد وأنشد الاصمعى لابن أحر
  وكنارهم كابنى سبات تفزفا • سوى ثم كانا مفداوتهاميا
  فألقى التهامى منه-ما بلطاته • واحلط هذالا اريم مكانيا
  لطاته ثقله يقول اذا كانت هذه حالهما فلا يجتعان أيدا والسبات الدهر ⁦(حط)⁩ الحاط يبيس
  الافانى تألفه الحيات بقال شيطان جاط كمانقول ذهب غضى وتيس حلب قال الراجز
  وقد شبه المرأة صية له عرف • عنيرد تحلف حين احلف* كثل شطان الماط اعرف
  الواحدة حاطة وقواء-م أصبت حاطة قله أى حبة قلبه والحماطة أيضاحرقة وخشونة
  يجدها الرحل فى حلقه حكا. أبو عبيد وغيره ⁦(حنط)⁩ الحنطة البرّ والبمع حنط وياتعه حناط
  والحنوط ذويرة وقد تحنط به الرجل وحنط الميت تحنيطا والمناطة حرفة الحفاط وحنطم
  إلاديم
