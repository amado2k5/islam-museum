label: { ar: "سنن أبي داود 4542 — وصية أو عهد أخير", en: "Sunan Abi Dawud 4542 — a testament or parting counsel", ur: "سنن ابی داؤد 4542 — وصیت یا آخری نصیحت", es: "Sunan Abi Dawud 4542 — un testamento o consejo de despedida", fr: "Sunan Abi Dawud 4542 — un testament ou un conseil d'adieu" }
text: "… دِينَارٍ أَوْ ثَمَانِيَةَ آلاَفِ دِرْهَمٍ وَدِيَةُ أَهْلِ الْكِتَابِ يَوْمَئِذٍ النِّصْفُ مِنْ دِيَةِ الْمُسْلِمِينَ قَالَ فَكَانَ ذَلِكَ كَذَلِكَ حَتَّى اسْتُخْلِفَ عُمَرُ فَقَامَ خَطِيبًا فَقَالَ أَلاَ إِنَّ الإِبِلَ قَدْ غَلَتْ. قَالَ فَفَرَضَهَا عُمَرُ عَلَى أَهْلِ الذَّهَبِ أَلْفَ دِينَارٍ وَعَلَى أَهْلِ الْوَرِقِ اثْنَىْ عَشَرَ أَلْفًا وَعَلَى أَهْلِ الْبَقَرِ مِائَتَىْ بَقَرَةٍ وَعَلَى أَهْلِ الشَّاءِ أَلْفَىْ شَاةٍ وَعَلَى أَهْلِ الْحُلَلِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4542، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4542 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4542، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4542 (Tipos de Sabiduría (Kitab Al-Diyat)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4542 (Types de testament – Kitab Al-Diyat), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
