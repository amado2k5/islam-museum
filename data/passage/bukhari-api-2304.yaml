text: "… إِسْحَاقُ بْنُ إِبْرَاهِيمَ، سَمِعَ الْمُعْتَمِرَ، أَنْبَأَنَا عُبَيْدُ اللَّهِ، عَنْ نَافِعٍ، أَنَّهُ سَمِعَ ابْنَ كَعْبِ بْنِ مَالِكٍ، يُحَدِّثُ عَنْ أَبِيهِ، أَنَّهُ كَانَتْ لَهُمْ غَنَمٌ تَرْعَى بِسَلْعٍ، فَأَبْصَرَتْ جَارِيَةٌ لَنَا بِشَاةٍ مِنْ غَنَمِنَا مَوْتًا، فَكَسَرَتْ حَجَرًا فَذَبَحَتْهَا بِهِ، فَقَالَ لَهُمْ لاَ تَأْكُلُوا حَتَّى أَسْأَلَ النَّبِيَّ، أَوْ أُرْسِلَ إِلَى النَّبِيِّ مَنْ يَسْأَلُهُ. وَأَنَّهُ سَأَلَ النَّبِيَّ عَنْ ذَاكَ، أَوْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2304، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2304 (Representation, Authorization, Business by Proxy), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2304، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2304 (Representación, Autorización, Negocios por Poder), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
