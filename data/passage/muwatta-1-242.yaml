label: { ar: "الموطأ 242 — تشهد عائشة من رواية القاسم", en: "Muwatta 242" }
text: "التحيات الطيبات الصلوات الزاكيات لله، أشهد أن لا إله إلا الله وحده لا شريك له، وأن محمداً عبده ورسوله"
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة زوج النبي، في باب التشهد في الصلاة: كانت تتشهد بصيغة تبدأ بالتحيات الطيبات الصلوات الزاكيات لله، ثم الشهادتان، ثم السلام على النبي وعلى عباد الله الصالحين، ثم السلام عليكم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.145}"
