label: { ar: "الموطأ 242 — تشهد عائشة من رواية القاسم", en: "Muwatta 242", es: "Muwatta 242", fr: "Muwatta 242", ur: "موطا 242", tr: "Al-Muwatta 242 — Aişe, Al-Qasim'in rivayetine göre şahitlik eder.", id: "Al-Muwatta 242 — Aisyah bersaksi, menurut riwayat Al-Qasim" }
text: "التحيات الطيبات الصلوات الزاكيات لله، أشهد أن لا إله إلا الله وحده لا شريك له، وأن محمداً عبده ورسوله"
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة زوج النبي، في باب التشهد في الصلاة: كانت تتشهد بصيغة تبدأ بالتحيات الطيبات الصلوات الزاكيات لله، ثم الشهادتان، ثم السلام على النبي وعلى عباد الله الصالحين، ثم السلام عليكم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.145}"
  tr: "Malik'in, Abdülrahman ibn el-Kâsım'dan, onun babasından, onun da Peygamberimizin eşi Ayşe'den rivayet ettiği bir hadiste namazda teşehhüd ile ilgili şöyle denmektedir: Ayşe, teşehhüdü \"Bütün güzel selamlar, temiz dualar ve salavatlar Allah içindir\" diye başlayan bir formülle okur, ardından iki şahitlik, sonra Peygamberimize ve Allah'ın salih kullarına salat ve selam olsun, sonra da size salat ve selam olsun derdi. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.145}"
  id: "Sebuah riwayat yang dinabikan oleh Malik dari Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Aisyah, istri Nabi, mengenai Tasyahhud dalam salat: Ia biasa membaca Tasyahhud dengan formula yang dimulai dengan \"Segala salam yang baik, salat yang murni, dan salam puji syukur adalah milik Allah,\" kemudian dua syahadat, kemudian salam sejahtera atas Nabi dan atas hamba-hamba Allah yang saleh, kemudian salam sejahtera atasmu. Editor menyebutkan bahwa riwayat ini dinabikan dari Malik oleh Abu Mus'ab, Suwaid, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.145}"
