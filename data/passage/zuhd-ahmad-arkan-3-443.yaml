text: "مثلك أصلي العشاء ثم أقوم أصلي فأنا حين أصلي الفيجر أنشط مني أول ما بدأت. حدثنا عبد الله حدثني من سمع جريراً عن منصور من الحكم قال قال ابن عمر ولن يصيب رجل حقيقة الايمان حتى يترك المراء وهو يعام …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 3، ص 443، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
