  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal (tome 3, p. 443) évoquant la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
