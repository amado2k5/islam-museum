label: { ar: "سنن النسائي 4936 — الأب والأبوة", en: "Sunan al-Nasa'i 4936 — the father and fatherhood", ur: "سنن نسائی 4936 — باپ اور والدیت", es: "Sunan al-Nasa'i 4936 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4936 — Le père et la paternité" }
text: "أَخْبَرَنِي أَحْمَدُ بْنُ عَمْرِو بْنِ السَّرْحِ، قَالَ حَدَّثَنَا ابْنُ وَهْبٍ، قَالَ أَخْبَرَنِي مَخْرَمَةُ، عَنْ أَبِيهِ، عَنْ سُلَيْمَانَ بْنِ يَسَارٍ، عَنْ عَمْرَةَ، عَنْ عَائِشَةَ، أَنَّهَا سَمِعَتْ رَسُولَ اللَّهِ يَقُولُ \" لاَ تُقْطَعُ يَدُ السَّارِقِ إِلاَّ فِي رُبُعِ دِينَارٍ فَصَاعِدًا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4936، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4936 (The Book of Cutting off the Hand of the Thief), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4936، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4936 (El Libro de la Perdición del Ladrón), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4936 (Le Livre de la Main Coupée du Voleur), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
