label: { ar: "الموطأ 1629 — سعيد بن المسيب: أيما رجل تزوج امرأة وبه جنون أو ضرر، فإنها تخير، فإن شاءت قرت وإن شاءت فارقت", en: "Muwatta 1629", es: "Muwatta 1629", fr: "Muwatta 1629", ur: "موطا 1629", tr: "El-Muvatta 1629 — Sa’id ibn al-Musayyab: Bir erkek bir kadınla evlenir ve akıl hastası veya başka bir şekilde ehliyetsiz ise, kadına seçim hakkı verilir; isterse kalabilir, isterse gidebilir.", id: "Al-Muwatta 1629 — Sa’id ibn al-Musayyab: Jika seorang pria menikahi seorang wanita dan dia gila atau cacat karena alasan lain, wanita itu diberi pilihan; jika dia mau, dia boleh tetap tinggal, dan jika dia mau, dia boleh pergi." }
summary:
  ar: "يروي مالك أنه بلغه عن سعيد بن المسيب أنه قال أيما رجل تزوج امرأة وبه جنون أو ضرر، فإنها تخير، فإن شاءت قرت، وإن شاءت فارقت. {cite:muwatta-maruf-1997 p.73}"
  tr: "Malik, Sa'id ibn al-Musayyab'dan şöyle bir rivayette bulunduğunu aktarır: \"Bir erkek bir kadınla evlenir ve akıl hastası veya başka bir şekilde engelli ise, kadının seçme hakkı vardır; isterse kalabilir, isterse gidebilir.\" {cite:muwatta-maruf-1997 s.73}"
  id: "Malik meriwayatkan bahwa ia mendengar dari Sa'id ibn al-Musayyab bahwa ia berkata: Jika seorang pria menikahi seorang wanita dan ia gila atau cacat karena sebab lain, wanita itu memiliki pilihan; jika ia mau, ia boleh tetap tinggal, dan jika ia mau, ia boleh pergi. {cite:muwatta-maruf-1997 p.73}"
