label: { ar: "صحيح البخاري 4040 — الأب والأبوة", en: "Sahih al-Bukhari 4040 — the father and fatherhood", ur: "صحیح بخاری 4040 — باپ اور والدیت", es: "Sahih al-Bukhari 4040 — El padre y la paternidad" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عُثْمَانَ، حَدَّثَنَا شُرَيْحٌ ـ هُوَ ابْنُ مَسْلَمَةَ ـ حَدَّثَنَا إِبْرَاهِيمُ بْنُ يُوسُفَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، قَالَ سَمِعْتُ الْبَرَاءَ ـ قَالَ بَعَثَ رَسُولُ اللَّهِ إِلَى أَبِي رَافِعٍ عَبْدَ اللَّهِ بْنَ عَتِيكٍ وَعَبْدَ اللَّهِ بْنَ عُتْبَةَ فِي نَاسٍ مَعَهُمْ، فَانْطَلَقُوا حَتَّى دَنَوْا مِنَ الْحِصْنِ، فَقَالَ لَهُمْ عَبْدُ اللَّهِ بْنُ عَتِيكٍ امْكُثُوا أَنْتُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4040، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4040 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4040، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4040 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
