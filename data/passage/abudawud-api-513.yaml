label: { ar: "سنن أبي داود 513 — الأب والأبوة", en: "Sunan Abi Dawud 513 — the father and fatherhood", ur: "سنن ابی داؤد 513 — باپ اور والدیت" }
text: "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عُمَرَ الْقَوَارِيرِيُّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، - شَيْخٌ مِنْ أَهْلِ الْمَدِينَةِ مِنَ الأَنْصَارِ - قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ مُحَمَّدٍ قَالَ كَانَ جَدِّي عَبْدُ اللَّهِ بْنُ زَيْدٍ يُحَدِّثُ بِهَذَا الْخَبَرِ قَالَ فَأَقَامَ جَدِّي."
summary:
  ar: "حديث في سنن أبي داود، رقم 513، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 513 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 513، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
