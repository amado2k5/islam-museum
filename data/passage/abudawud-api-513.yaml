label: { ar: "سنن أبي داود 513 — الأب والأبوة", en: "Sunan Abi Dawud 513 — the father and fatherhood", ur: "سنن ابی داؤد 513 — باپ اور والدیت", es: "Sunan Abi Dawud 513 — El padre y la paternidad", fr: "Sunan Abi Dawud 513 — le père et la paternité", tr: "Sunan Abi Davud 513 — Baba ve Babalık", id: "Sunan Abi Dawud 513 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عُمَرَ الْقَوَارِيرِيُّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، - شَيْخٌ مِنْ أَهْلِ الْمَدِينَةِ مِنَ الأَنْصَارِ - قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ مُحَمَّدٍ قَالَ كَانَ جَدِّي عَبْدُ اللَّهِ بْنُ زَيْدٍ يُحَدِّثُ بِهَذَا الْخَبَرِ قَالَ فَأَقَامَ جَدِّي."
summary:
  ar: "حديث في سنن أبي داود، رقم 513، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 513 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 513، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 513 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 513 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 513 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 513, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
