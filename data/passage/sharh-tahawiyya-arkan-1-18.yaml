text: "… السنة والجماعة -: الإيمان بالله وملائكته وكتبه ورسله.... ففسر الاعتقاد بالإيمان بالله وملائكته وكتبه ورسله... إلخ. وكذلك العقيدة أي: الشيء المعتقَد فعيلة بمعنى مفعولة، فتقول هذا اعتقاد أهل السنة والجماعة، يقول الإمام الطحاوي: على مذهب فقهاء الملة أبي حنيفة النعمان …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 18، يذكر الإيمان بالله وملائكته وكتبه ورسله، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 18, that mentions belief in God, His angels, His books and His messengers, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 18 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 1, pág. 18, que menciona la creencia en Dios, sus ángeles, sus libros y sus mensajeros, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 1, p. 18) mentionnant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, un des articles de foi. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi üzerine tefsirinin 1. cildinin 18. sayfasından, Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inancı ve imanın rükünlerinden birini ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-Izz tentang Akidah al-Tahawi, Jilid 1, halaman 18, yang membahas tentang kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya, serta salah satu rukun iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
