label: { ar: "نوادر جحا الكبرى، ص 112 — «هل يدفأ الإنسان من قنديل على مسافة فرسخ؟»", en: "Nawadir Juha al-Kubra, p. 112 — 'Can a Person Be Warmed by a Lamp a League Away?'", ur: "نوادر جحا الکبریٰ، ص 112 — «کیا آدمی ایک فرسخ دور چراغ سے گرم ہو سکتا ہے؟»", fr: "Nawadir Juha al-Kubra, p. 112 — « Peut-on se réchauffer à une lampe à une lieue de distance ? »", es: "Nawadir Juha al-Kubra, p. 112 — «¿Puede uno calentarse con una lámpara a una legua de distancia?»" }
text: "نوادر جحا الكبرى فقام أحدُهم قائلاً : لِلَّهِ درْك من بطلٍ، أفتكز في المسألةِ جيداً، فالقبرُ وراءها وأخشى أنْ تموتَ بَرْداً، فإنْ كانَتْ لك وصيةٌ، أو دَينّ، أو دراهمُ، طمرتَها، فقُلْ لنا عنها وأخبِرْنا لكي نقومَ بالوصيَّة. فقال الشيخ: أنا …"
summary:
  ar: "راهن جيران جحا على أنه لا يستطيع البقاء ليلة كاملة في ساحة البلدة دون أي أثر للنار، وإن فعل فسيستضيفونه، فانتظر قرب قنديل وقال إنه رأى قنديلاً على بعد فرسخ، فقالوا إنه استدفأ به فعليه لهم عشاء، فاستضافهم وتركهم ينتظرون ثم وجدوه يطبخ قدراً معلقة في شجرة فوق قنديل صغير. {cite:juha-nawadir-kubra-djuwaydi p. 112}"
  en: "Neighbours bet that Juha cannot stay in the town square all night without any sign of fire, and say they will host him if he does. He waits by a lamp and says he saw a lamp a farsakh away. They say he warmed himself and so owes them a dinner. He hosts them, leaves them waiting, and then they find him cooking a pot hung in a tree over a small lamp. {cite:juha-nawadir-kubra-djuwaydi p. 112}"
  ur: "پڑوسی جحا سے شرط لگاتے ہیں کہ وہ پوری رات شہر کے چوک میں آگ کے کسی نشان کے بغیر نہیں رہ سکتا، اور اگر رہا تو وہ اس کی ضیافت کریں گے۔ وہ ایک چراغ کے پاس انتظار کرتا ہے اور کہتا ہے کہ اس نے ایک فرسخ دور ایک چراغ دیکھا۔ وہ کہتے ہیں کہ اس نے اس سے تپش لی ہے، لہٰذا اس پر ان کا ایک عشائیہ واجب ہے۔ وہ انہیں مدعو کرتا ہے اور انتظار کرواتا ہے، پھر وہ اسے ایک درخت پر لٹکی دیگ ایک چھوٹے چراغ کے اوپر پکاتے ہوئے پاتے ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 112}"
  fr: "Des voisins parient que Juha ne peut pas passer toute la nuit sur la place de la ville sans le moindre signe de feu, et disent qu'ils l'hébergeront s'il y parvient. Il attend près d'une lampe et dit qu'il a vu une lampe à une farsakh de là. Ils disent qu'il s'est réchauffé et qu'il leur doit donc un dîner. Il les invite, les fait attendre, puis ils le trouvent en train de cuire une marmite suspendue à un arbre au-dessus d'une petite lampe. {cite:juha-nawadir-kubra-djuwaydi p. 112}"
  es: "Unos vecinos apuestan a que Juha no puede pasar toda la noche en la plaza del pueblo sin ninguna señal de fuego, y dicen que lo hospedarán si lo logra. Espera junto a una lámpara y dice que vio una lámpara a una farsaja de distancia. Ellos dicen que se calentó con ella y que por tanto les debe una cena. Los invita, los hace esperar, y luego lo encuentran cocinando una olla colgada de un árbol sobre una lámpara pequeña. {cite:juha-nawadir-kubra-djuwaydi p. 112}"
