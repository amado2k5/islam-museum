label: { ar: "الموطأ 2365 — مالك: لا يجوز بيع المدبر إلا أن يشتري نفسه", en: "Muwatta 2365" }
summary:
  ar: "قال مالك: لا يجوز بيع المدبر، ولا يجوز لأحد أن يشتريه، إلا أن يشتري المدبر نفسه من سيده، فيكون ذلك جائزا له، أو يعطي أحد سيد المدبر مالا ويعتقه سيده الذي دبره، فذلك يجوز أيضا. وولاؤه لسيده الذي دبره. {cite:muwatta-maruf-1997 p.374}"
