label: { ar: "الموطأ 2365 — مالك: لا يجوز بيع المدبر إلا أن يشتري نفسه", en: "Muwatta 2365", es: "Muwatta 2365", fr: "Muwatta 2365", ur: "موطا 2365", tr: "El-Muvatta 2365 — Malik: Efendisinin ölümüne bağlı özgürlüğü olan bir köleyi, kendisini geri satın almadıkça satmak caiz değildir." }
summary:
  ar: "قال مالك: لا يجوز بيع المدبر، ولا يجوز لأحد أن يشتريه، إلا أن يشتري المدبر نفسه من سيده، فيكون ذلك جائزا له، أو يعطي أحد سيد المدبر مالا ويعتقه سيده الذي دبره، فذلك يجوز أيضا. وولاؤه لسيده الذي دبره. {cite:muwatta-maruf-1997 p.374}"
  tr: "Malik şöyle demiştir: Bir müdabberi (özgürlüğü efendisinin ölümüne bağlı olan köleyi) satmak caiz değildir, onu satın almak da caiz değildir; ancak müdabber efendisinden kendini geri satın alırsa, o zaman caizdir. Ya da birisi müdabberin efendisine para verirse ve onu müdabber eden efendi onu azat ederse, bu da caizdir. Onun bağlılığı, onu müdabber eden efendisine kalır. {cite:muwatta-maruf-1997 s.374}"
  id: "Malik berkata: Tidak diperbolehkan menjual seorang mudabbar (budak yang kebebasannya bergantung pada kematian tuannya), dan tidak diperbolehkan pula bagi siapa pun untuk membelinya, kecuali jika mudabbar tersebut membeli dirinya kembali dari tuannya, dalam hal ini diperbolehkan baginya. Atau, jika seseorang memberi uang kepada tuan mudabbar tersebut dan tuan yang menjadikannya mudabbar kemudian membebaskannya, maka itu juga diperbolehkan. Kesetiaannya tetap kepada tuan yang menjadikannya mudabbar. {cite:muwatta-maruf-1997 p.374}"
