label: { ar: "سنن ابن ماجه 1451 — المقاصة بالحسنات والسيئات", en: "Sunan Ibn Majah 1451 — deeds settled between people", ur: "سنن ابن ماجہ 1451 — نیکیوں اور برائیوں سے بدلہ چکانا", es: "Sunan Ibn Majah 1451 - escrituras arregladas entre personas", fr: "Sunan Ibn Majah 1451 - actes réglés entre les gens", tr: "Sunan İbn Majah 1451 — İyi ve kötü amelleri dengelemek", id: "Sunan Ibn Majah 1451 — Menyeimbangkan amal baik dan amal buruk" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، حَدَّثَنَا الأَوْزَاعِيُّ، عَنْ عَطَاءٍ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ ـ دَخَلَ عَلَيْهَا وَعِنْدَهَا حَمِيمٌ لَهَا يَخْنُقُهُ الْمَوْتُ فَلَمَّا رَأَى النَّبِيُّ ـ مَا بِهَا قَالَ لَهَا \" لاَ تَبْتَئِسِي عَلَى حَمِيمِكِ فَإِنَّ ذَلِكَ مِنْ حَسَنَاتِهِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1451، يذكر المقاصة بالحسنات والسيئات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1451 (Chapters Regarding Funerals), that speaks of deeds settled between people. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1451، جس میں نیکیوں اور برائیوں سے بدلہ چکانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1451 (Capítulos sobre los funerales), que habla de los acuerdos entre particulares. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan un acuerdo."
  fr: "Un hadith du Sunan Ibn Majah, n° 1451 (Chapitres relatifs aux funérailles), évoque les actes conclus entre personnes. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent de la comptabilisation, de l'inscription, de la suppression ou de la pesée d'un acte."
  tr: "İbn Majah'ın Sünen'inde yer alan 1451 numaralı hadis, iyi ve kötü amellerin dengelenmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1451, menyebutkan tentang penyeimbangan amal baik dan amal buruk. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
