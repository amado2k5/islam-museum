label: { ar: "سنن ابن ماجه 1451 — المقاصة بالحسنات والسيئات", en: "Sunan Ibn Majah 1451 — deeds settled between people", ur: "سنن ابن ماجہ 1451 — نیکیوں اور برائیوں سے بدلہ چکانا" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، حَدَّثَنَا الأَوْزَاعِيُّ، عَنْ عَطَاءٍ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ ـ دَخَلَ عَلَيْهَا وَعِنْدَهَا حَمِيمٌ لَهَا يَخْنُقُهُ الْمَوْتُ فَلَمَّا رَأَى النَّبِيُّ ـ مَا بِهَا قَالَ لَهَا \" لاَ تَبْتَئِسِي عَلَى حَمِيمِكِ فَإِنَّ ذَلِكَ مِنْ حَسَنَاتِهِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1451، يذكر المقاصة بالحسنات والسيئات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1451 (Chapters Regarding Funerals), that speaks of deeds settled between people. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1451، جس میں نیکیوں اور برائیوں سے بدلہ چکانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
