text: "وهذا يشمل الملائِكَةَ، والجنَّ والإنسَ وسائرَ الحيواناتِ، على اختلافِ أشكالهم وألوانهم ولغَاتِهِم، وطباعِهِم وأجناسهم وأنواعِهِم، وقد فرقهم في أرجاء أقطار الأرض والسَّموات"
summary:
  ar: "في تفسير آية بثّ الدواب في السماوات والأرض يفسّر ابن كثير الدابة تفسيراً شاملاً للملائكة والجن والإنس وسائر الحيوانات على اختلاف أشكالها وألوانها ولغاتها، ويقول إن الله فرّقهم في أرجاء أقطار الأرض والسماوات ثم يجمعهم يوم القيامة."
  en: "On the verse about creatures scattered through the heavens and the earth, Ibn Kathir reads 'creature' as covering angels, jinn, humans and all animals of every form, colour and language, whom God has dispersed through the regions of the earth and the heavens and will gather on the Day of Resurrection."
  es: "En el versículo sobre las criaturas dispersas por los cielos y la tierra, Ibn Kathir interpreta \"criatura\" como un término que abarca a los ángeles, los genios, los seres humanos y todos los animales de toda forma, color y lengua, a quienes Dios ha dispersado por las regiones de la tierra y los cielos y que reunirá el Día de la Resurrección."
  fr: "Concernant le verset relatif aux créatures dispersées à travers les cieux et la terre, Ibn Kathir interprète le terme « créature » comme englobant les anges, les djinns, les humains et tous les animaux de toute forme, couleur et langue, que Dieu a dispersés à travers les régions de la terre et des cieux et qu'il rassemblera le Jour de la Résurrection."
