label: { ar: "صحيح البخاري 7083 — الأب والأبوة", en: "Sahih al-Bukhari 7083 — the father and fatherhood", ur: "صحیح بخاری 7083 — باپ اور والدیت", es: "Sahih al-Bukhari 7083 — El padre y la paternidad", fr: "Sahih al-Bukhari 7083 — Le père et la paternité", tr: "Sahih el-Buhari 7083 — Baba ve Babalık", id: "Sahih al-Bukhari 7083 — Ayah dan Peran Ayah" }
text: "… مُؤَمَّلٌ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، حَدَّثَنَا أَيُّوبُ، وَيُونُسُ، وَهِشَامٌ، وَمُعَلَّى بْنُ زِيَادٍ، عَنِ الْحَسَنِ، عَنِ الأَحْنَفِ، عَنْ أَبِي بَكْرَةَ، عَنِ النَّبِيِّ. وَرَوَاهُ مَعْمَرٌ عَنْ أَيُّوبَ. وَرَوَاهُ بَكَّارُ بْنُ عَبْدِ الْعَزِيزِ عَنْ أَبِيهِ عَنْ أَبِي بَكْرَةَ. وَقَالَ غُنْدَرٌ حَدَّثَنَا شُعْبَةُ، عَنْ مَنْصُورٍ، عَنْ رِبْعِيِّ بْنِ حِرَاشٍ، عَنْ أَبِي بَكْرَةَ، عَنِ النَّبِيِّ. وَلَمْ يَرْفَعْهُ سُفْيَانُ عَنْ مَنْصُورٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7083، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7083 (Afflictions and the End of the World), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7083، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7083 (Aflicciones y el fin del mundo), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7083 (Les Afflictions et la Fin du Monde), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 7083 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7083, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
