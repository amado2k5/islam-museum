text: |-
  ٤٠٩
  أى ايسوابعدك فى شى قال العجاج
  دافعت عنهم تقيرموتق والنقير أصل خشبة
  بنة رفينبذفيه فيشتدنبيذه وهو الذى ورد النهى عنه وقولهم حقير نقيرا تساع له وفلان كريم
  الفقير أى الاصل والنقرة مثال الهمزة داه يأخذالشاء فى حقويها وقد نقرت الشاة
  بالكسعر تنقرنة رافهى نقرة وبه انقر قان المزار العدوى
  وحشوت الغيظ فى أضلاعه • ذهويمشى حظلانا كالنقر
  ويقال النقر الغضبان وقد نقر نقرا والمنة ربضم الميم والقاف بترصغيرة ضيقة الرأس تكون
  فى نجفة صلبة لثلاتتهنم وابهع المناقر والمنر بكسر الميم المعول قال ذوالرمة
  تفض الحصى عن مجمرات وقيعة • كارحا رد زلمتها المناقر
  ومنة وأيضا أبو حىّ من تميم وهو منقر بن عبيدبن الحرث بن عمروبن سكعب بن سعدبن
  زيدمناة بن تيم ومنقسار الطائر والنجار وابمع المشاقير والتذقير عن الاحر البحث عنه والسقير
  مثل الصغير قال الراجز ونقرى ماشئت أن تنقرى وأنقرعنه أى كف ومنه
  قول الشاعز
  لعمرى ماونيت فى وتّطي * وما أناعن أعدا قومى بعنقر
  وقال ابن عباس رضى اللّٰه عنه ما كان اللّٰه لينة ر عن قاتل المؤمن أى ما كان اللّٰه ايكف عيه
  حتى يهاكه وأنرة موضع فيها قلعة للروم و«وأيضاجمع نقير مغسل رغيف وأرغفة وهو حفرة
  فى الارض قال الاسودين بعفر ١
  نزلوا بأنرة يسيل عليهم * ماء الفرات يحمن الطواد
  ⁦(نكر)⁩ النكرة ضدًا العرفة وقد نكرت الرجل بالكسر نكرا ونكورا وأنسكرته واستنكرته
  كله بعنى قال الاعشى وأنكرتى وما كان التى نكرت * من الحوادث الا الشيب والصلعا
  وقد فكره قتنكر أى غيره فة غير الى مجهول والمذكر واحد المناكر والذكير والانكار تغيير
  المنكرومنكروذكير سماملكين ورجل نكرونكر ى داه منكروكذلك الذى يشكر
  المنكر وجعهما نكار مثل عضد وأعضاد وكبدوأ كباد وانكر المنكر قال اللّٰه تعالى اقد
  جمت شيئا نكراوقد يحزك مثل عسر وعسر قال الشاعر وكانوا أتونى بشى نكر
  والذكراء مثله والشكارة الدهاء وكذلك النكر بالضم يقال للرجل اذا كان فطنا مشكرا
  ما أشد نكره ونكره أيضا بالفتح وقدنكر الامر بالضم أى صعب واشتد والانكار الجود
  وناكره أى قاتله قال أيو مفيان انّ مح-د الم يشاكر أح_دا الاكانت معه الاهوال والتذاكر
  التجاهل وطريق يشكور على غير قصد ر لنمرسبع والجمع غور وقدجاء فى الشعر
  غمردهوشاذ ولعله مقصور منه وقال فيها تماثيل أسود وغر• والاتى نمرة وغرأبوقبيلة وهو
  نمر بن قاسط بن هنب بن أفصى بن دعمى بن جديلة بن أسدين ربيعة والنسبة اليهم غرى بفح
  الميم استيحاشالتوالى المكسرات لان فيه حرفاواحد اغير مكسور وغر بكسر النون اسم
  رجل وقال تعيدنى نمربن سعدوقد أرى • ونمربن سعدلى مطيع ومهطع
  وغير أبوقبيلة من قيس وهو غير بن عامر بن صعصعة بن معاوية بن بكر بن هوازن وسححاب أغمر
  وقد غر السحاب بالكسر يمرغرا أى صار على لون المرترى فى خلله نقاطا وقواه-م أرنيها.
  غرة أركها مطرة قال الاخفش هذاكقوله تعالى فأخر جذامنه خض راير يد الاخضر والانمر
  .١٠٢
  ضاح
  ١ ل تنس ما تقدّم ان الاسود
  ابن يعفر اذاقرى بضم الياء
  يكون مصروفا اه قاله نصر
  قوله التى نكرت كذا فى النسمخ
  واعل الصواب الذى قالد نصر
  ٢ أ ى بكسر الكاف وضعها
  كم أشار اليه بعده اه
