text: "الجامع لشعب الإيمان البصري، حدثنا أبو أحمد محمد بن عبدالوهاب، أخبرنا جعفر بن عون، أخبرنا عبدالرحمن بن عبد الله المسعودي، عن أبي حازم، عن عون بن عبدالله قال: قال ابن مسعود: المؤمن مألف، ولا خير فيمن لا يألف ولا يؤلف. …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 443، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 443, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 443 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Shu'ab al-Iman de al-Bayhaqi, vol. 10, pág. 443, que menciona una descripción del creyente; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 10, page 443, contenant une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 443. sayfasından, mümini anlatan bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, iman dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi \"Cabang-Cabang Iman,\" Jilid 10, halaman 443, yang menjelaskan tentang orang beriman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
