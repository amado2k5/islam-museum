  fr: "Extrait du traité al-Adab al-Mufrad d'al-Bukhari (tome 2, p. 49), mentionnant un acte lié à la croyance en Dieu et au Jour dernier; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le répertoire « Piliers et branches de la foi »."
  tr: "Buhari'nin Resimli Cilt 2'sinde yer alan \"El-Adab El-Mufrad\" adlı eserinin 49. sayfasında, Allah'a ve Ahiret Günü'ne olan imanla ilgili bir eylemden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 2 Bergambar, hlm. 49, menyebutkan suatu perbuatan yang berkaitan dengan iman kepada Tuhan dan Hari Kiamat; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
