text: "… هريرة - حدّثنا صدَقةُ قال : أخبرنا ابن عيينة، عن عمرو، عن نافع بن جبير، عن أبى شريح الخزاعى، عن النبى وتي قال د من كان يؤمز باللّه واليوم الآخر فلُيحسن إلى جارِه. ومن كان يؤمن باللّه واليوم الآخر فلُيُكْرِم …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 49، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
