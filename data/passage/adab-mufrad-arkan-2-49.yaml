text: "… هريرة - حدّثنا صدَقةُ قال : أخبرنا ابن عيينة، عن عمرو، عن نافع بن جبير، عن أبى شريح الخزاعى، عن النبى وتي قال د من كان يؤمز باللّه واليوم الآخر فلُيحسن إلى جارِه. ومن كان يؤمن باللّه واليوم الآخر فلُيُكْرِم …"
