text: "… مَحْض الإِيمان. وقال حمَّاد بن أبي سلمة تعالى: الناظر إِلى الكعبة كالمجتهد في العبادة في غيرها. وقال يونس بن خبَّاب تعالى: النظر إلى الكعبة عبادة فيما سواها من الأَرض عبادة الصائم القائم الدائم القانت. وقال مجاهد تعالى: النظر إلى الكعبة …"
