label: { ar: "الموطأ، كتاب الصيام", en: "Muwatta, Book of Fasting", es: "Muwatta, Libro del Ayuno", fr: "Muwatta, Livre du jeûne", ur: "موطا، روزے کی کتاب", tr: "El-Muvatta, Oruç Kitabı", id: "Al-Muwatta, Kitab Puasa" }
summary:
  ar: "كتاب الصيام، الكتاب الرابع من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 85 نصاً (781–865) في سبعة وعشرين باباً، من الصفحة 385 إلى الصفحة 417 من ملف PDF المجلد الأول. يبدأ برؤية هلال رمضان وتعجيل الفطر وصيام الجنب والقبلة للصائم وصيام السفر والكفارة والحجامة وعاشوراء والوصال وقضاء رمضان والفدية وقضاء التطوع، ويختم بفضل الصيام وآدابه. {cite:muwatta-maruf-1997 p.385} {cite:muwatta-maruf-1997 p.417}"
  en: "The Book of Fasting, fourth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 85 reports (781–865) in twenty-seven babs, PDF pp. 385–417 of volume 1, from sighting the moon and breaking the fast through travel, expiation, Ashura, making up missed fasts and fidya."
  es: "El Libro del Ayuno, cuarto libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 85 informes (781–865) en veintisiete babs, PDF pp. 385–417 del volumen 1, desde la observación de la luna y la ruptura del ayuno hasta los viajes, la expiación, Ashura, la recuperación de los ayunos perdidos y la fidya."
  fr: "Le Livre du Jeûne, quatrième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 85 rapports (781–865) dans vingt-sept babs, PDF pp. 385–417 du volume 1, depuis l'observation de la lune et la rupture du jeûne par le voyage, l'expiation, Ashura, le rattrapage des jeûnes manqués et fidya."
  ur: "روزے کی کتاب، یحییٰ بن یحییٰ کی تجدید میں موطا کی چوتھی کتاب ⁦(ایڈ. معارف 1997)⁩: ستائیس بابوں میں 85 رپورٹیں (781–865)، جلد 1 کی پی ڈی ایف صفحہ 385–417، چاند دیکھنے سے لے کر، روزہ افطار کرنا، روزہ افطار کرنا، روزہ افطار کرنا۔ فدیہ"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği Al-Muwatta'nın dördüncü kitabı olan Oruç Kitabı, Beşar Awad Maruf'un (1997) baskısında, yirmi yedi bölümden oluşan 85 metin (781-865), Birinci Cilt PDF dosyasının 385. sayfasından 417. sayfasına kadar uzanmaktadır. Ramazan hilalinin görülmesiyle başlar, orucun açılmasını hızlandırır, ritüel kirlilik halindeyken oruç tutar, oruçluyken kıbleye döner, yolculukta oruç tutar, kefaret, hacamat, Aşura, sürekli oruç, kaçırılan Ramazan oruçlarının kaza edilmesi, kefaret ve gönüllü oruçların kaza edilmesi konularını ele alır ve orucun faziletleri ve adabıyla sona erer. {cite:muwatta-maruf-1997 s.385} {cite:muwatta-maruf-1997 s.417}"
  id: "Kitab Puasa, kitab keempat Al-Muwatta' menurut riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997): 85 teks (781–865) dalam dua puluh tujuh bab, dari halaman 385 hingga halaman 417 dari file PDF Volume Satu. Dimulai dengan penampakan hilal Ramadhan, mempercepat berbuka puasa, berpuasa dalam keadaan najis, menghadap kiblat saat berpuasa, berpuasa saat bepergian, penebusan dosa, bekam, Asyura, puasa terus-menerus, mengganti puasa Ramadhan yang terlewat, penebusan dosa, dan mengganti puasa sunnah, dan diakhiri dengan keutamaan dan adab berpuasa. {cite:muwatta-maruf-1997 p.385} {cite:muwatta-maruf-1997 p.417}"
