text: "… فم الصاعم أطيب عند اللّٰه من ريح المسك. فلما عزم على الذهاب استخلف على شعب بنى إسرائيل أخاه هارون، المحبب المبجل الجليل، وهو ابن أمه وأبيه، ووزيره فى الدعوة إلى مصطفيه، فوصاه، وأمره وليس فى هذا لعلو منزلته فى نبوته …"
summary:
