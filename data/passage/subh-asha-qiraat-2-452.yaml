text: "… فى تَعاطِى العربية، والنَّسَفى، فى الحَدَل، وجَرِير الشاعر، فى الهجاء الحبيث، وتَجَّاد الراوية، فى شعر العرب، والاحتف بن قيس، فى الحِلْمِ، والمأمون، فى حُبّ العفو، والوليد، فى شُرب الحمر، وعطاء السُّلمىّ، فى الخوف من اللّٰه تعالى، وآبن البوّاب، فى الكتابة، …"
summary:
