summary:
  ar: "يقول مالك إن الأمر الذي لا اختلاف فيه عندهم أن أحدا لا يحلق رأسه ولا يأخذ من شعره حتى ينحر هديا إن كان معه، ولا يحل من شيء حرم عليه حتى يحل بمنى يوم النحر، ويستدل بآية الهدي في سورة البقرة. {cite:muwatta-maruf-1997 p.531}"
