label: { ar: "الموطأ 1177 — مالك: الأمر الذي لا اختلاف فيه أن أحدا لا يحلق رأسه حتى ينحر هديه، ولا يحل من شيء حرم عليه حتى يحل بمنى يوم النحر", en: "Muwatta 1177", es: "Muwatta 1177", fr: "Muwatta 1177", ur: "موطا 1177", tr: "El-Muvatta 1177 — Malik: Kurban kesilmeden önce kimsenin başını tıraş etmemesi gerektiği konusunda ihtilaf yoktur; aynı şekilde, Kurban Bayramı günü Mina'da ibadetlerini tamamlamadan önce kendisine yasaklanmış olan hiçbir şeyden muaf tutulmaması gerektiği konusunda da ihtilaf yoktur.", id: "Al-Muwatta 1177 — Malik: Tidak ada perbedaan pendapat bahwa seseorang tidak boleh mencukur kepalanya sampai ia menyembelih hewan kurbannya, dan tidak pula ia boleh dibebaskan dari sesuatu yang diharamkan baginya sampai ia menyelesaikan ritualnya di Mina pada Hari Raya Kurban." }
summary:
  ar: "يقول مالك إن الأمر الذي لا اختلاف فيه عندهم أن أحدا لا يحلق رأسه ولا يأخذ من شعره حتى ينحر هديا إن كان معه، ولا يحل من شيء حرم عليه حتى يحل بمنى يوم النحر، ويستدل بآية الهدي في سورة البقرة. {cite:muwatta-maruf-1997 p.531}"
  tr: "Malik, aralarında, yanında kurbanlık hayvanı olan kimsenin kurban kesene kadar başını tıraş etmemesi veya saçını kesmemesi gerektiği ve Kurban Bayramı günü Mina'dan çıkana kadar kendisine haram kılınan hiçbir şeyden muaf tutulmaması gerektiği konusunda bir görüş ayrılığı olmadığını söylüyor. Delil olarak Bakara Suresi'ndeki kurbanlık hayvanlarla ilgili ayeti gösteriyor. {cite:muwatta-maruf-1997 s.531}"
  id: "Malik mengatakan bahwa tidak ada perbedaan pendapat di antara mereka bahwa seseorang tidak boleh mencukur kepalanya atau memotong rambutnya sampai ia menyembelih hewan kurban jika ia memilikinya, dan ia tidak boleh dibebaskan dari sesuatu yang diharamkan baginya sampai ia keluar dari Mina pada Hari Kurban. Ia mengutip ayat tentang hewan kurban dalam Surah Al-Baqarah sebagai bukti. {cite:muwatta-maruf-1997 p.531}"
