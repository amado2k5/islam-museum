text: "… : اختلف القراء فى قراءة قوله مبينة فقراً بعضهم : مُبِيّنَةٍ بفتح الياء بمعنى أنه قد بُيِّنت لكم وأعلنت وأظهرت. وقرأه بعضهم : مُبَيِّنة بكسر الياء بمعنى أنها ظاهرة بينة للناس أنها فاحشة. وهما قراءتان مستفيضتان لقراء أمصار الإسلام. فبأيتهما …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 1، ص 50، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 1, p. 50, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 1، ص 50 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
