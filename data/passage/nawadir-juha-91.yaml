text: "… لعله خرج أضاع جحا خاتمَه في داخلِ بيتهِ فبحث عنه فلم يجده فخرج من البيت، وجعل ينظر أمام الباب، فسأله جاره: ماذا تصنع؟ فقال: أضغتُ خاتمي في البيت، فقال: ولماذا لا تفتشُ عليه في البيت؟ فأجابه: الظلامُ حالِكٌ في الداخل …"
summary:
  ar: "أضاع جحا خاتمًا داخل البيت لكنه بحث عنه في الخارج لأن الداخل شديد الظلمة، وقال إن الخاتم ربما خرج. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  en: "Juha loses a ring inside the house but searches outside, because the inside is too dark, so he says the ring may have come out. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  ur: "جحا کی انگوٹھی گھر کے اندر کھو گئی مگر وہ اسے باہر ڈھونڈتا رہا کیونکہ اندر بہت اندھیرا تھا، اور اس نے کہا کہ انگوٹھی شاید باہر نکل آئی ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  fr: "Juha perd une bague dans la maison mais la cherche dehors, parce que l'intérieur est trop sombre ; il dit que la bague est peut-être sortie. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  es: "Juha pierde un anillo dentro de la casa pero lo busca fuera, porque dentro está demasiado oscuro, y dice que el anillo quizá haya salido. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  tr: "Juha evde bir yüzüğünü kaybetti, ancak içerisi çok karanlık olduğu için dışarıda aramaya başladı ve yüzüğün dışarı çıkmış olabileceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 46}"
  id: "Juha kehilangan cincin di dalam rumah, tetapi dia mencarinya di luar karena di dalam sangat gelap, dan dia mengatakan bahwa cincin itu mungkin telah jatuh ke luar. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
