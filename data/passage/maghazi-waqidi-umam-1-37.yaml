text: "… عامِر، وأُمَيّة بن خَلَف. وعُتبة وشَيبة ابنا رَبيعة. وحَكيم بن حِزام. وأَبو البَخْتَرىّ، وعَلى بن أُمَيّة ابن خَلف، والعاص بن مُنَبِّه. حتى بكَّتهم أَبو جَهل بالجُبن - وأَعانه عُقبة بن أَبى مُعَيط.. والنَّضْر بن الحارث بن كَلَدَة - فى الخروج، …"
