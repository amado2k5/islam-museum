label: { ar: "صحيح البخاري 3866 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3866 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3866 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3866 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3866 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا يَحْيَى بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنِي ابْنُ وَهْبٍ، قَالَ حَدَّثَنِي عُمَرُ، أَنَّ سَالِمًا، حَدَّثَهُ عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ مَا سَمِعْتُ عُمَرَ، لِشَىْءٍ قَطُّ يَقُولُ إِنِّي لأَظُنُّهُ كَذَا. إِلاَّ كَانَ كَمَا يَظُنُّ، بَيْنَمَا عُمَرُ جَالِسٌ إِذْ مَرَّ بِهِ رَجُلٌ جَمِيلٌ فَقَالَ لَقَدْ أَخْطَأَ ظَنِّي، أَوْ إِنَّ هَذَا عَلَى دِينِهِ فِي الْجَاهِلِيَّةِ، أَوْ لَقَدْ كَانَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3866، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3866 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3866، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 3866 (Méritos de los Ayudantes en Medina (Ansar)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 3866 (Mérites des Compagnons de Médine (Ansar)), mentionne des nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
