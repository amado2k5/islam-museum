summary:
  ar: "القسم 18 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوصايا»، ويضم فيها النصوص من 2862 إلى 2884 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 18 of Sunan Abi Dawud (Wills (Kitab Al-Wasaya)) in the division of the open hadith dataset the museum took its reports from: reports 2862 to 2884 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 18، عنوان «کتاب الوصایا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2862 تا 2884۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 18 de Sunan Abi Dawud (Testamentos (Kitab Al-Wasaya)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2862 a 2884 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan Abi Dawud (Testaments, livre 18): il s’agit des hadiths 2862 à 2884, selon la numérotation de ce recueil. Le musée conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 18. bölümü, açık hadis veri tabanında yer almakta olup \"Vasiyet Kitabı\" başlığını taşımaktadır. Bu bölümde 2862 ile 2884 arasında numaralandırılmış metinler bulunmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 18 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi basis data hadits terbuka dan diberi judul \"Kitab Wasiat\". Bagian ini berisi teks 2862 hingga 2884, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
