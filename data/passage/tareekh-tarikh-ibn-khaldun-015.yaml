text: "اجبه محمد بن أبي عمرو بأن يخاطبه في ذلك بالتوبيخ واللائمة، فكتب له كتابا أبدع فيه وقفني عليه الحاجب ببجاية أيام كوني معه، فقضيت العجب من فصوله وأغراضه، ولما قرأه أبو الحجاج دس إلى كبيرهما أبي الفضل باللحاق بالطاغية، وكانت"
