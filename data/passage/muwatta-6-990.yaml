label: { ar: "الموطأ 990 — بلغ مالكاً أن عثمان بن عفان كان إذا اعتمر لم يحط عن راحلته حتى يرجع", en: "Muwatta 990", es: "Muwatta 990", fr: "Muwatta 990", ur: "موطا 990", tr: "El-Muvatta 990 — Malik'e rivayet edildiğine göre, Osman ibn Affan Umre yaptığında, geri dönene kadar bineğinden inmezdi.", id: "Al-Muwatta 990 — Diriwayatkan kepada Malik bahwa ketika Utsman bin Affan melaksanakan Umrah, ia tidak turun dari kendaraannya sampai ia kembali." }
summary:
  ar: "بلاغ يرويه مالك أن عثمان بن عفان كان إذا اعتمر ربما لم يحط عن راحلته حتى يرجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1128). {cite:muwatta-maruf-1997 p.466}"
  tr: "Malik'in rivayet ettiği bir hadiste, Osman ibn Affan'ın Umre yaparken bazen dönene kadar bineğinden inmediği belirtilmektedir. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab (1128) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.466}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik menyatakan bahwa Utsman bin Affan, ketika melaksanakan Umrah, terkadang tidak turun dari kendaraannya sampai ia kembali. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab (1128). {cite:muwatta-maruf-1997 p.466}"
