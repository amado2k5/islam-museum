label: { ar: "الموطأ 1828 — مالك عن داود بن الحصين عن أبي سفيان مولى ابن أبي أحمد عن أبي سعيد الخدري: نهى رسول الله عن المزابنة والمحاقلة، والمزابنة شراء التمر بالتمر في رءوس النخل، والمحاقلة كراء الأرض بالحنطة", en: "Muwatta 1828", es: "Muwatta 1828", fr: "Muwatta 1828", ur: "موطا 1828", tr: "El-Muvatta 1828 — Malik, Davud ibn el-Hüseynin'den, o da İbn Ebi Ahmed'in azatlı kölesi Ebu Sufyan'dan, o da Ebu Sa'id el-Hudri'den rivayetle: Allah'ın Resulü, el-Muzabana ve el-Muhaqala'yı yasakladı. El-Muzabana, hurma ağaçlarından hurma almak; el-Muhaqala ise buğday için arazi kiralamaktır.", id: "Al-Muwatta 1828 — Malik, berdasarkan riwayat Dawud ibn al-Husayn, berdasarkan riwayat Abu Sufyan, budak yang dibebaskan oleh Ibn Abi Ahmad, berdasarkan riwayat Abu Sa'id al-Khudri: Rasulullah melarang al-Muzabana dan al-Muhaqala. Al-Muzabana membeli kurma dengan cara memetik kurma di pohon kurma, dan al-Muhaqala menyewa lahan untuk menanam gandum." }
summary:
  ar: "يروي مالك عن داود بن الحصين عن أبي سفيان مولى ابن أبي أحمد عن أبي سعيد الخدري أن رسول الله نهى عن المزابنة والمحاقلة، والمزابنة شراء التمر بالتمر في رءوس النخل، والمحاقلة كراء الأرض بالحنطة. {cite:muwatta-maruf-1997 p.149}"
  tr: "Malik, Davud ibn el-Hüseynin'den, o da İbn Ebi Ahmed'in azatlı kölesi Ebu Sufyan'dan, o da Ebu Sa'id el-Hudri'den rivayetle, Allah Resulü'nün el-Muzabana ve el-Muhaqala'yı yasakladığını nakletmiştir. El-Muzabana, henüz hurma ağacında bulunan hurmaları satın almak; el-Muhaqala ise buğday için arazi kiralamaktır. {cite:muwatta-maruf-1997 s.149}"
  id: "Malik meriwayatkan dari Dawud ibn al-Husayn, dari Abu Sufyan, budak yang dibebaskan oleh Ibn Abi Ahmad, dari Abu Sa'id al-Khudri, bahwa Rasulullah SAW melarang al-Muzabana dan al-Muhaqala. Al-Muzabana adalah pembelian kurma yang masih berada di pohonnya, dan al-Muhaqala adalah penyewaan lahan untuk menanam gandum. {cite:muwatta-maruf-1997 p.149}"
