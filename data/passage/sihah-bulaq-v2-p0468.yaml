  والا التعام وحفانه • وطغيامع اللهق الناشبط
  ولهق الشهلهقا أى ابيضّ" وسكذلك لهق بالكسراهافهواهق ولهذا اذا كان شد!
  لبيساض مثل يقق ويقق قال القطاميصف ابلا .
  واذاشفن الى الطريق رأينه • لهقا كشاكلة الحصان الابلق
  قال الفرّاه الله وقة كل مالم ييالغ فيه من كلام أوعمل تقول قدلهوق كذا وقد تلهوق فيه وقال
  أبو الغوث الله وقة أن تتحسن بالذى وأن تظهر شيأ باطنك على خلافه فحو أن يظهر الرجل
  من السخاء ماليس عليه سجيته قال السكميت عدح مخادين يزيدبن المهلب
  أجزيهم يدمخلد وجزاؤها • عندى بلاصلف ولا يتلهوق
  ⁦( ليق)⁩ لاقت الدواة تليق أى اصقت ولقتها أنا يتعدى ولا يتعدى فهى مليقة اذا أصلعت
  مدادها وألقتها الاقاغة فيه قللة والاسم منه الليقة ويقال اللمرأة اذالم تحظ عندزوجها
  ماعاقت عند زوجها ولالاقت أى مالصقت بقلبه ولاق به فلان أى لاذبه ولاقبه الثوب
  أى ليقبه وهذا الامر لا يليقيك أى لا يعلق بك وفلان ما يليق درهما من جوده أى ما يمسكه
  ولا يلصق به قال الشاعر
  . كفاه كف مأتلبق درهما • جودا وأخرى تعطبالسيف دما
  وما بالارض لياف أى مرفع وألاقوه بأنفسهم أى ألزقوه واستلاطوه قال الشاعر
  وهل كنت الا - ونكيا ألاقه • ينو عمه حتى بقى وتجبرا
  صل أبسم ٠ ف المأقة بالتحريك شبه الفواق يأخذ الانسان عند البكاء
  والنشيج كأنه نفس يقلعه من صدره وقد. مق الصبى يماق مأقاوامتأق مثله ومسه قول أم
  تأبط شرتاولا أبتهمثا وفى المثل أنت تقق وأنامثق فكيف نتفق قال رؤية
  كأغاعولته ا بعد التأق • عولة تكاى ولولت بعد المأق
  وأمأق الرجل اذادخل فى الماقة وفى الحديت مالم تضمروا الاماف يعنى الغيظ والبكاءعما
  يلزمكم من الصدقة ويقال أراديه الخدر والنسكث وموق العين طرفها عما يلى الانف واللحاظ
  طرفها الذى يلى الاذن وابمع آماق وأما ق أيضامشل آياروأيا ر ومأقى العين لغة فى مؤق
  العين وهو فعلى وليسريمة -عل لاث الميم من نفس المكامة وانمازيد فى آخره الياء للالحاق فسلم.
  يجدواله نظيرا يلحقونه به لان فعلى بكسر اللام نادرلا أخت لهافاً لحق بمفعل فلهذاجعوه
  على ماق على التوهم كماجعوامسيل الماء أصلة ومسلانا وبجعوا المصيرمصراناتشبيها
  لهما يفعيل على الترهم وقال ابن السكيت ليس فى ذوات الاربعة مفعل بكسر العين
  الاحرفان مأقي العسين ومأوى الابل قال الفرّاءمعتهما والكلام كاه مفعل بالفتح نحورميته
  مرمى ودعوته مسدعى وغسزوته مغزى وظاهرهذا القول ان لم يتأوّل عسلى ماذكرناه غلط
  ⁦(محق)⁩ محقه يممه محقا أى أبطالدومحساه وتحق الشى وامتحق والمحاق من الشهرثلاث
  ليال من آخره ونصل محيق أى مرقق محدد وهو فعيل من محقه قال الشاهر
  قلب صعدة جرداء فيها • نقيع السم أوقرن محيو
  وأماقول ان دريدانه مفعول فبعيد ومحقه الجرّأى أحرقه ويوم ماحق أى شديد الحرّأى
