text: |-
  ٢٦٨
  رباب الدال)
  ⁦(هند)⁩
  -روالوذد ذروة الجبل من الريل المشرف والوافدان اللذان فى شعر الاعشى هما الناشزان
  من الخدين عند المضغ فاذاهرم الانسان غاب رافداه واستوفد الرحسل فى قعدته لغة
  فى استوفز والاوفادقوم من العرب وقال
  فلوكتمْ منا أخدتم بأخذنا • ولكنما الاوقاداسفل سافل
  ⁦( وقد)⁩ وقدت النار تقد وقودا بالضم ووقدا وقدة ووقدا ووقدانا أى توقدت
  وأَوقدتها أنا واستوقدتها أيضا والاتقادمثل التوقد والوة ود بالفتح الحطب وبالضم الاتقاد
  قال يعة وب وقرئ النارذات الوقود والموضع موقد مثال مجلس والنارم وقدة والوقدة أشد
  الحرّوهى عشرة أيام أونصف شهر وكد وكدت العهد والسرج نو كيداوا كدته
  تأكيدابمعنى وبالوا وأفصح وكذلك أوكده را كده ايكادافيهما أى شدهوتو كد الامر
  وتأكد بعنى وقواهم وكدوكده أى قصد قسده والو كادحبل يشديد البقر عند الحاب
  ⁦( ولد )⁩ الولد قد يكون واحدا وجعا وكذلك الولد بالضم ومن أمثال بنى أس_دولدك من
  دمى عقبيك وقد يكون الولدجع الولد مثل أسدوأسد والولد بالكسرلغسة فى الولد ويقال
  ما أدرى أى ولد الرجل هو أى أىّ الناس هو والوايد الصىّ والعبد والجمع ولدان وولدة
  والوايدة الصبية والامة والمع الولائدوولدت المرأة تلدولاداوولادة وأولدت حان ولادها
  وقواهم هم فى امرلاية ادى وليده يقال أصله من جرى الخيل لان الفرس اذا حكان
  جوادا أعطى من غير أن يصاح به لاستزادته كما قال النابغة الجعدى يصف فرسا
  امام هوى لا ينادى وليده • وشدوأمر بالعنان ليرسلا
  ثم قيل ذلك لكل أمر عظسيم ولسكل شئ كثير ويو الدوا أى كنروا وولدبعضهسم بعضا والوالد
  الاب والوالدة الام وهما الوالدان وشاة والدأى حامل عن ابن السكيت وتولد الشئ
  من الشئ وميلاد الرجل اسم للوقت الذى ولدفيه والمولد الموضع الذى ولدفيه ويقال ولد
  الرجل غنمه نوليدا كما يقال نتج ابله نتجاوعر بية. ولدة ورجل مولداذا كان عربياغير
  محض ولدة الرجل تربه والهاءعوض من الوا والذاهبة من أوّله لانه من الولادة وه-مالدان
  والجمع لدات ولدون ( مد الومد والومدة بالتحريك شدّحرّ الليل وقدومدت ليلتنا
  بالكسر وومد الرجل أيضالغة فى ويدأى غضب وحئ ⁦( وهد)⁩. الاصمعى الوهدة المكان
  المطمئن والجمع وهدووهاذ
  صل الما٠ بد لهبيدحب الحنظل والتهبدأخذه وكسره يقال للظليم هو
  يتهبداذا استخرج ذلك ليأكله والاهتباد أن تأخذحب الحنظل وهو يابس وتجعله
  فى موضع وتصب عليه الماء وتدلكه ثم تصب عليه الماء وتفعل ذلك أيا ماحتى تذهب مرارته
  ثم يدق ويطبخ وهبود بتشديد الباءاسم موضع بيلادبنى غير ⁦( هجد)⁩. هجدوتهجد أى نام
  ليلا وهجد وتهجد أى سهروهو من الاضداد ومنه قيسل لصلاة الليل التهجد والتهجيد
  التنويم قال لبيد
  قال هيدنى فقد طال السمرى • وقدرناان خنا الدهر غفل
  أى تومى ابن السكيت أحجد البعيراذا ألتى جرانه بالارض دد ، هد البناءيه ده هدا
