text: "لَمَّا أَرَادَ النَّبِيُّ صلى الله عليه وسلم أَنْ يَكْتُبَ إِلَى الرُّومِ قِيلَ لَهُ إِنَّهُمْ لَنْ يَقْرَءُوا كِتَابَكَ إِذَا لَمْ يَكُنْ مَخْتُومًا‏.‏ فَاتَّخَذَ خَاتَمًا مِنْ فِضَّةٍ، وَنَقْشُهُ مُحَمَّدٌ رَسُولُ اللَّهِ‏.‏ فَكَأَنَّمَا أَنْظُرُ إِلَى بَيَاضِهِ فِي يَدِهِ‏.‏"
summary:
  ar: "في صحيح البخاري؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sahih al-Bukhari; sending a letter or message to a party."
  ur: "صحیح بخاری میں؛ کسی فریق کو خط یا پیغام بھیجنا."
