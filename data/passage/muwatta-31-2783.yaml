label: { ar: "الموطأ 2783 — بلاغ مالك: ما من نبي إلا رعى غنما وأنا كذلك", en: "Muwatta 2783", es: "Muwatta 2783", fr: "Muwatta 2783", ur: "موطا 2783", tr: "El-Muvatta 2783 — Malik şöyle rivayet etmiştir: Koyun gütmeyen hiçbir peygamber yoktur, ben de onlardan biriyim.", id: "Al-Muwatta 2783 — Malik meriwayatkan: Tidak ada seorang nabi pun yang tidak menggembalakan domba, dan aku pun demikian." }
summary:
  ar: "بلغ مالكا أن النبي قال: ما من نبي إلا وقد رعى غنما، فقيل له: وأنت يا رسول الله؟ فقال: وأنا. ويذكر المحقق أن الحديث في الصحيحين من حديث أبي سلمة عن جابر، ومن حديث عمرو بن يحيى بن سعيد عن جده عن أبي هريرة. {cite:muwatta-maruf-1997 p.564}"
  tr: "Malik, Peygamberin şöyle buyurduğunu rivayet etmiştir: “Koyun gütmeyen hiçbir peygamber yoktur.” Ona, “Ey Allah’ın Resulü, ya siz?” diye soruldu. O da, “Ben de,” diye cevap verdi. Araştırmacı, bu hadisin iki Sahih hadiste (Buhari ve Müslim) bulunduğunu, Ebu Seleme’nin Cabir’den, Amr ibn Yahya ibn Said’in dedesinden, onun da Ebu Hurayra’dan rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.564}"
  id: "Malik meriwayatkan bahwa Nabi bersabda: “Tidak ada seorang nabi pun yang tidak menggembalakan domba.” Beliau ditanya: “Dan engkau, wahai Rasulullah?” Beliau menjawab: “Dan aku.” Peneliti menyebutkan bahwa hadits ini terdapat dalam dua kitab Sahih (Bukhari dan Muslim), diriwayatkan oleh Abu Salama dari Jabir, dan oleh Amr ibn Yahya ibn Saeed dari kakeknya dari Abu Hurairah. {cite:muwatta-maruf-1997 p.564}"
