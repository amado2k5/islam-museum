label: { ar: "الموطأ 2783 — بلاغ مالك: ما من نبي إلا رعى غنما وأنا كذلك", en: "Muwatta 2783" }
summary:
  ar: "بلغ مالكا أن النبي قال: ما من نبي إلا وقد رعى غنما، فقيل له: وأنت يا رسول الله؟ فقال: وأنا. ويذكر المحقق أن الحديث في الصحيحين من حديث أبي سلمة عن جابر، ومن حديث عمرو بن يحيى بن سعيد عن جده عن أبي هريرة. {cite:muwatta-maruf-1997 p.564}"
