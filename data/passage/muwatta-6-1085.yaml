label: { ar: "الموطأ 1085 — أبو معيز الأسلمي عن ابن عمر: امرأة سألته، أهراقت دماً عند باب المسجد ثلاث مرات، فقال: إنما ذلك ركضة من الشيطان، فاغتسلي ثم استثفري بثوب ثم طوفي", en: "Muwatta 1085", es: "Muwatta 1085", fr: "Muwatta 1085", ur: "موطا 1085", tr: "El-Muvatta 1085 — Ebu Muayz el-Aslami, İbn Ömer'den rivayetle: Bir kadın ona, \"Cami kapısında üç defa kan döktüm\" dedi. O da, \"Bu şeytanın dokunuşuydu. Öyleyse gusül abdesti al, sonra kanı bir bezle sil, ardından da Kâbe tavafı yap\" dedi.", id: "Al-Muwatta 1085 — Abu Mu’ayz al-Aslami meriwayatkan dari Ibnu Umar: Seorang wanita bertanya kepadanya, “Aku menumpahkan darah di pintu masjid tiga kali.” Beliau menjawab, “Itu adalah sentuhan setan. Maka lakukan ghusl (mandi ritual), kemudian gunakan kain untuk menyerap darah, lalu lakukan tawaf (mengelilingi Ka'bah).”" }
summary:
  ar: "يرويه مالك عن أبي الزبير المكي أن أبا معيز الأسلمي، عبد الله بن سفيان، أخبره أنه كان جالساً مع عبد الله بن عمر، فجاءته امرأة تستفتيه، فقالت: إني أقبلت أريد أن أطوف بالبيت، حتى إذا كنت ببابه المسجد أهرقت الدماء، فرجعت حتى ذهب ذلك عني، ثم أقبلت فهرقت الدماء ثلاث مرات. فقال عبد الله بن عمر: إنما ذلك ركضة من الشيطان، فاغتسلي ثم استثفري بثوب ثم طوفي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1305) وسويد (549) وغيرهم. {cite:muwatta-maruf-1997 p.498} {cite:muwatta-maruf-1997 p.499}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den rivayet ettiğine göre, Ebu Muayz el-Aslami, Abdullah ibn Sufyan, kendisine Abdullah ibn Ömer ile otururken bir kadının dini bir hüküm istemek için yanına geldiğini anlatmıştır. Kadın, \"Kâbe'nin etrafında tavaf yapmak niyetiyle geldim, ancak mescidin kapısına vardığımda kanama yaşadım. Kanama geçene kadar geri döndüm, sonra tekrar geldim ve üç kez kanama yaşadım.\" demiştir. Abdullah ibn Ömer, \"Bu şeytanın dokunuşuydu. Gusül al, sonra kanı bir bezle emdir ve sonra tavaf yap.\" demiştir. Editör, bu rivayetin Malik'ten Ebu Musab (1305), Suveyd (549) ve diğerleri tarafından da nakledildiğini belirtmektedir."
  id: "Malik meriwayatkan hadits ini dari Abu al-Zubayr al-Makki, yang mengatakan bahwa Abu Mu'ayz al-Aslami, Abdullah ibn Sufyan, menceritakan kepadanya bahwa ia sedang duduk bersama Abdullah ibn Umar ketika seorang wanita datang kepadanya untuk meminta fatwa. Wanita itu berkata, \"Saya datang dengan niat untuk melakukan Tawaf mengelilingi Ka'bah, tetapi ketika saya sampai di pintu masjid, saya mengalami pendarahan. Saya kembali sampai pendarahannya berhenti, kemudian saya datang lagi dan mengalami pendarahan tiga kali.\" Abdullah ibn Umar berkata, \"Itu adalah sentuhan setan. Lakukan Ghusl (mandi ritual), kemudian gunakan kain untuk menyerap darah, dan kemudian lakukan Tawaf.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1305), Suwaid (549), dan lainnya."
