label: { ar: "الموطأ 1085 — أبو معيز الأسلمي عن ابن عمر: امرأة سألته، أهراقت دماً عند باب المسجد ثلاث مرات، فقال: إنما ذلك ركضة من الشيطان، فاغتسلي ثم استثفري بثوب ثم طوفي", en: "Muwatta 1085" }
summary:
  ar: "يرويه مالك عن أبي الزبير المكي أن أبا معيز الأسلمي، عبد الله بن سفيان، أخبره أنه كان جالساً مع عبد الله بن عمر، فجاءته امرأة تستفتيه، فقالت: إني أقبلت أريد أن أطوف بالبيت، حتى إذا كنت ببابه المسجد أهرقت الدماء، فرجعت حتى ذهب ذلك عني، ثم أقبلت فهرقت الدماء ثلاث مرات. فقال عبد الله بن عمر: إنما ذلك ركضة من الشيطان، فاغتسلي ثم استثفري بثوب ثم طوفي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1305) وسويد (549) وغيرهم. {cite:muwatta-maruf-1997 p.498} {cite:muwatta-maruf-1997 p.499}"
