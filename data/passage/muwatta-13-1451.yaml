label: { ar: "الموطأ 1451 — مالك: ميراث الأب من ابنه السدس فريضة إذا ترك المتوفى ولدا، وميراث الأم الثلث أو السدس بحسب الإخوة والأبوين", en: "Muwatta 1451" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن ميراث الأب من ابنه أو ابنته، إن ترك المتوفى ولدا أو ولد ابن ذكرا، فإنه يفرض للأب السدس فريضة. وإن لم يترك المتوفى ولدا ولا ولد ابن ذكرا، يبدأ بمن شرك الأب من أهل الفرائض، فإن فضل بعدهم السدس فما فوقه كان للأب. وميراث الأم من ولدها، إذا ترك الميت ولدا أو ولد ابن، أو ترك اثنين فصاعدا من الإخوة، فالسدس لها، وإن لم يترك ذلك فالثلث كاملا، إلا في فريضتين ذكرهما مالك. {cite:muwatta-maruf-1997 p.7}"
