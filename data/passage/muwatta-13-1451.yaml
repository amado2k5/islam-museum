label: { ar: "الموطأ 1451 — مالك: ميراث الأب من ابنه السدس فريضة إذا ترك المتوفى ولدا، وميراث الأم الثلث أو السدس بحسب الإخوة والأبوين", en: "Muwatta 1451", es: "Muwatta 1451", fr: "Muwatta 1451", ur: "موطا 1451", tr: "El-Muvatta 1451 — Malik: Ölen kişinin oğlu varsa, babanın oğlundan alacağı miras payı, belirlenmiş pay olarak altıda birdir; annenin miras payı ise kardeşlere ve ebeveynlere göre üçte bir veya altıda birdir.", id: "Al-Muwatta 1451 — Malik: Warisan ayah dari anaknya adalah seperenam sebagai bagian yang ditentukan jika almarhum meninggalkan seorang anak laki-laki, dan warisan ibu adalah sepertiga atau seperenam menurut saudara kandung dan orang tua." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن ميراث الأب من ابنه أو ابنته، إن ترك المتوفى ولدا أو ولد ابن ذكرا، فإنه يفرض للأب السدس فريضة. وإن لم يترك المتوفى ولدا ولا ولد ابن ذكرا، يبدأ بمن شرك الأب من أهل الفرائض، فإن فضل بعدهم السدس فما فوقه كان للأب. وميراث الأم من ولدها، إذا ترك الميت ولدا أو ولد ابن، أو ترك اثنين فصاعدا من الإخوة، فالسدس لها، وإن لم يترك ذلك فالثلث كاملا، إلا في فريضتين ذكرهما مالك. {cite:muwatta-maruf-1997 p.7}"
  tr: "Malik, aralarındaki yerleşik uygulamanın, ölen kişinin bir oğlu veya torunu varsa, babanın oğlundan veya kızından alacağı mirasın sabit bir pay olarak altıda bir olduğunu belirtir. Ölen kişinin ne oğlu ne de torunu yoksa, miras, babanın sabit payından pay alanlarla başlar. Altıda bir veya daha fazla bir kalan varsa, bu babaya gider. Annenin çocuğundan alacağı mirasa gelince, ölen kişinin bir oğlu veya torunu ya da iki veya daha fazla kardeşi varsa, anne altıda bir pay alır. Bunlardan hiçbiri yoksa, Malik'in belirttiği iki özel durum dışında, anne tam üçte bir pay alır. {cite:muwatta-maruf-1997 s.7}"
  id: "Malik menyatakan bahwa praktik yang berlaku di antara mereka adalah bahwa warisan ayah dari putra atau putrinya, jika almarhum meninggalkan seorang putra atau cucu, adalah seperenam sebagai bagian tetap. Jika almarhum tidak meninggalkan seorang putra maupun cucu, warisan dimulai dengan mereka yang berbagi bagian tetap ayah. Jika ada sisa seperenam atau lebih, maka sisa tersebut diberikan kepada ayah. Adapun warisan ibu dari anaknya, jika almarhum meninggalkan seorang putra atau cucu, atau dua saudara kandung atau lebih, ia menerima seperenam. Jika ia tidak meninggalkan salah satu dari mereka, ia menerima sepertiga penuh, kecuali dalam dua kasus khusus yang disebutkan oleh Malik. {cite:muwatta-maruf-1997 p.7}"
