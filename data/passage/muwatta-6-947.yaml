label: { ar: "الموطأ 947 — مالك: الأمر عندنا أن من قرن الحج والعمرة لم يأخذ من شعره شيئاً، ولم يحل من شيء حتى ينحر هدياً إن كان معه، ويحل بمنى يوم النحر", en: "Muwatta 947", es: "Muwatta 947", fr: "Muwatta 947", ur: "موطا 947", tr: "El-Muvatta 947 — Malik: Bizde hüküm şudur ki, Hac ve Umreyi birleştiren kimse saçından kesmemeli, yanında kurbanlık hayvanı varsa kesene kadar ihramdan çıkmamalı ve Kurban Bayramı günü Mina'da ihramdan çıkmalıdır.", id: "Al-Muwatta 947 — Malik: Hukum di pihak kami adalah bahwa siapa pun yang menggabungkan haji dan umrah tidak boleh memotong rambutnya, dan tidak boleh keluar dari keadaan ihram sampai ia menyembelih hewan kurban jika ia memilikinya, dan ia keluar dari keadaan ihram di Mina pada Hari Raya Kurban." }
summary:
  ar: "قول لمالك: الأمر عندنا أن من قرن الحج والعمرة لم يأخذ من شعره شيئاً، ولم يحل من شيء حتى ينحر هدياً إن كان معه، ويحل بمنى يوم النحر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1077). {cite:muwatta-maruf-1997 p.452}"
  tr: "Malik şöyle demiştir: Bizde yerleşik uygulama şudur ki, Hac ve Umreyi birleştiren kimse, yanında kurbanlık hayvanı varsa kesene kadar saçını kesmez ve ihramdan çıkmaz; ihramdan ise kurban günü Mina'da çıkar. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1077) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.452}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kami adalah bahwa orang yang menggabungkan haji dan umrah tidak boleh memotong rambutnya, dan tidak boleh keluar dari keadaan ihram sampai ia menyembelih hewan kurban jika ia memilikinya, dan keluar dari keadaan ihram di Mina pada Hari Raya Kurban. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1077). {cite:muwatta-maruf-1997 p.452}"
