text: "الله، عن راشد بن سعد، عن حمرة بن عبد كلال، قال: سار عمربن لخطاب إلى الشام بعد مسيره الأول، كان إليها، حتى إذا شارفها بلغه ومن معه أن الطاعون فأش فيها، فقال له أصحابه، ارجع ولا تقحم عليه، فلو نزلتها"
