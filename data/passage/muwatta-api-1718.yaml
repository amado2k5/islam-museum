label: { ar: "موطأ مالك 1718 — محو السيئات وحط الخطايا", en: "Muwatta Malik 1718 — bad deeds erased and sins shed", ur: "موطأ مالک 1718 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Muwatta Malik 1718 — malas acciones borradas y pecados perdonados", fr: "Muwatta Malik 1718 — les mauvaises actions effacées et les péchés pardonnés", tr: "Muwatta Malik 1718 — Günahları silmek ve suçları ortadan kaldırmak", id: "Muwatta Malik 1718 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، أَنَّ رَجُلاً، جَاءَهُ الْمَوْتُ فِي زَمَانِ رَسُولِ اللَّهِ فَقَالَ رَجُلٌ هَنِيئًا لَهُ مَاتَ وَلَمْ يُبْتَلَ بِمَرَضٍ. فَقَالَ رَسُولُ اللَّهِ \" وَيْحَكَ وَمَا يُدْرِيكَ لَوْ أَنَّ اللَّهَ ابْتَلاَهُ بِمَرَضٍ يُكَفِّرُ بِهِ مِنْ سَيِّئَاتِهِ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 1718، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 1718 (The Evil Eye), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 1718، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1718 (El Mal de Ojo), que habla de malas acciones borradas y pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un rapport du Muwatta Malik, n° 1718 (Le Mauvais Œil), évoque l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Malik'in Muvatta'sında yer alan 1718 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1718, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
