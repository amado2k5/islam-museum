label: { ar: "صحيح مسلم — أبر البر أن يصل الرجل ود أبيه", en: "Sahih Muslim — The truest kindness: a man keeping his father's bond", ur: "صحیح مسلم — سچی نیکی: آدمی کا باپ کے رشتے کو جوڑنا" }
text: "حَدَّثَنِي أَبُو الطَّاهِرِ، أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي حَيْوَةُ بْنُ شُرَيْحٍ، عَنِ ابْنِ، الْهَادِ عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ أَبَرُّ الْبِرِّ أَنْ يَصِلَ الرَّجُلُ وُدَّ أَبِيهِ ‏\"‏ ‏.‏"
summary:
  ar: "لفظ آخر: أبر البر أن يصل الرجل ود أبيه."
  en: "Another wording: the truest kindness is a man's upholding the bond of his father."
  ur: "دوسرے الفاظ: سب سے سچی نیکی آدمی کا اپنے باپ کا رشتہ جوڑنا ہے۔"
