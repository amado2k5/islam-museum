text: |-
  ضرفت الهوى عنهنّ من خشية الرد
  ٢ فى نصخة زيادة النابغة
  الجمى ه
  /% ١٥2
  .لصل الخاء) .
  انّ جسمى بعد خالى نال والخل النوب البالى قال أبو عيدمافلان يجل ولاخرأى
  لاخيرفيه ولاشرّ وأنشد للمر بن تولب؟ :ذا
  هلا سأات بعادياء وبيته * واللخلّ والجرالتى لم تنع
  ويروى الذى لم يمنع وائخلة اخصلة وانلخلة الحاجة والفقر والخلد ابن مخاض عن الاصمحى
  ويقال أناهم بقرص كأنه فرسن خلة والانى خلة أيضا ويقال للميت اللهم اسدد خلته أى
  الثلة التى ترك والخلة الحر الحامضة قال أبوذؤيب
  عقاركماء التى "ليست يخمطة ولاخلة يكوى الشروب شهابها
  يقول هى فى لون ماء اللحم النىء وايست كاجمة التى لم تدرك بعد ولا كاخلة التى جاوزت القدر
  حتى كادت تصير خلاوانلة بالضم ماحلا من النبت يقال الجلة خبزالا بل والهض فاكهتها
  ويقال جها واذاذبت البهاقلت بعير خلى وابل خلية عن يعقوب قال وأرض مخلة كثيرة
  انه_لة ليس بم احض واتخلة انخليل يستوى فيه المذكر والمؤنت لانه فى الاصل مصدرة ولك
  خليل فين اللحلة والحاولة وقال
  ألا أبلغاخلتى جابرا • بأن خليلكك لم يقتل
  وقد مع على خلال مثل قلة وقلال وانخلة بالسكسر واحدة خلل السيوف وهى بطائن كانت
  تغشى بما أجفان السيوف منة وشة بالذهب وغيره وهى أبضاسيور تلبس ظهورسيتى القوس
  والخلة أيضاما يبق بين الاسنان والخل الود والصديق وانخلل بالتحريك الفرجة بين الشيتين
  وابمع الخلال مثل جبل وجبال وقرئ به-ما جميعا قوله تعالى فترى الودق يخرج من خسلاله
  وخلله وهى فرج فى السحاب يخرج منها المطر والخلل أيضافساد فى الامر والخلال العود
  الذى يتخلل به وما يخل به الثوب أيضا والجمع الاخلة وفى الحديث أذا الخلال نسابع واخلال
  أيضا الخالة والمصادقة ومنه قول امرئ القيس ١ • ولست بمقلىّ الخلال ولا قالى*
  والخلال بالفتج البلج والخليل الصديق والانثى خليلة وانخليل الفقير المختل الحال قال زهير
  وان أناء خليل يوم مسغبة * يقول لاغائب مالى ولاحرم.
  والخلالة بالضم ما يقع من التخال يقال فلان بأكل خلالته وخلله وخلله أى ما يخرجه من بين
  أسنانه اذا تخال وهو مثل وانخلالة والخلالة وانلخلالة الصداقة والمودة وقال ٢
  وكيف تواصل من أصبحت • خسلالته كابى مرحب
  وأبو هر حب كنية الظل ويقال هو كنية عرقوب الذى قيل فيهمواعددء رقوب قال
  المكسائى خل حه يخل خلاوخاولا أى قلّ وغف وذكر اللحيانى فى نوادره عم فلان فى
  دمائه وخلٌ وخلل أى خص ومنه قول الشاعر* أبلخ كللباوخلل فى سراتمم* وقال أوس
  فقربت حرجوجا ومجدت معشرا • تخيرتهم فيما أطوف وأسأل
  بنى مالك أعنى بسعد بن مالك • أعمّ بخيرص الح وأخلل
  وخلمات لسان الفصيل أخله اذالشققته لثلايرتضع ولا يقدر على المص قال امر ؤالقيس
  ذكرّ اليه ببَراته * كماخل ظهر اللسان المجر
  وفصيل مخلول أى مهزول وفى الحديث انّ مصدّها أتاه بفصيل مخلول ويقال أصله انهم
  كانوا
