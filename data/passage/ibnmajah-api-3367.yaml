label: { ar: "سنن ابن ماجه 3367 — الحلال، ما أُحل", en: "Sunan Ibn Majah 3367 — the lawful; what was made lawful", ur: "سنن ابن ماجہ 3367 — حلال، جو حلال کیا گیا", es: "Sunan Ibn Majah 3367 — lo lícito; lo que fue hecho lícito", fr: "Sunan Ibn Majah 3367 — le licite; ce qui a été rendu licite" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ مُوسَى السُّدِّيُّ، حَدَّثَنَا سَيْفُ بْنُ هَارُونَ، عَنْ سُلَيْمَانَ التَّيْمِيِّ، عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ، عَنْ سَلْمَانَ الْفَارِسِيِّ، قَالَ سُئِلَ رَسُولُ اللَّهِ ـ عَنِ السَّمْنِ وَالْجُبْنِ وَالْفِرَاءِ قَالَ \" الْحَلاَلُ مَا أَحَلَّ اللَّهُ فِي كِتَابِهِ وَالْحَرَامُ مَا حَرَّمَ اللَّهُ فِي كِتَابِهِ وَمَا سَكَتَ عَنْهُ فَهُوَ مِمَّا عَفَا عَنْهُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3367، يذكر الحلال، وما أُحل، والحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 3367 (Chapters on Food), that mentions the lawful, what was made lawful, the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3367، جس میں حلال، جو حلال کیا گیا، حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3367 (Capítulos sobre la comida), menciona lo lícito, lo que fue lícito, lo ilícito y lo que fue ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 3367 (Chapitres sur l'alimentation), mentionne ce qui est licite, ce qui a été rendu licite, ce qui est illicite et ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
