label: { ar: "صحيح البخاري 4478 — الكمأة، الشفاء", en: "Sahih al-Bukhari 4478 — truffles and their water for the eye; healing", ur: "صحیح بخاری 4478 — کھمبی، شفا" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ الْمَلِكِ، عَنْ عَمْرِو بْنِ حُرَيْثٍ، عَنْ سَعِيدِ بْنِ زَيْدٍ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" الْكَمْأَةُ مِنَ الْمَنِّ، وَمَاؤُهَا شِفَاءٌ لِلْعَيْنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4478، يذكر الكمأة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4478 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions truffles and their water for the eye, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4478، جس میں کھمبی، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
