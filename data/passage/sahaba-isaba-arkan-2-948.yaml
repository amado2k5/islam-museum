text: "تراجم الرجال حرف العين المهملة من فعلهن، فقد ذاق طعم الإيمان من طريق عبد اللّٰه وقُتِل عبد اللّٰه بن مطيع يومئذ، وحملت رأسه مع رأس عبد اللّٰه بن الزبير. وحده الحديث. قال أبو حاتم الرازي وابن حِبَّان: له صحبة. فقال …"
