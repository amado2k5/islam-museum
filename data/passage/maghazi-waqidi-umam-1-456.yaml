text: "… كتب رسول اللّٰه بينهم فشقَّه حُيَىّ، فلمًا شقَّه حُيَىّ علم أنَّ الأَمر قد لَحَم وفَسَد، فخرج على بنى قُرَيْظَة وهم حِدَقٌ حول منزل كعب بن أَسَد، فخبّرهم الخبر. يقول الزّبير بن باطا : وَاهَلاكَ اليهود ! تُولّى قُريْش وغَطَنمان أحفظ …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 456، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 456, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
