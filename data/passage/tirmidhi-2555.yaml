ref: "2555"
label:
  ar: "الترمذي 2555 — أحل عليكم رضواني فلا أسخط عليكم بعده أبدا"
  en: "Tirmidhi 2555 — I grant you My good pleasure and shall never be displeased with you"
  ur: "ترمذی 2555 — میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا"
  es: "Tirmidhi 2555 — Te concedo mi beneplácito y jamás estaré disgustado contigo."
  fr: "Tirmidhi 2555 — Je vous accorde Ma bonne volonté et ne serai jamais mécontent de vous."
  tr: "Tirmizi 2555 — Ben size rızamı bahşettim ve bundan sonra sizden asla hoşnutsuz olmayacağım."
  id: "Tirmidhi 2555 — Aku telah menganugerahkan keridhaan-Ku kepadamu, dan Aku tidak akan pernah murka kepadamu setelah itu."
text: "إن الله يقول لأهل الجنة يا أهل الجنة . فيقولون لبيك ربنا وسعديك . فيقول هل رضيتم فيقولون ما لنا لا نرضى وقد أعطيتنا ما لم تعط أحدا من خلقك . فيقول أنا أعطيكم أفضل من ذلك . قالوا وأى …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2555: أحل عليكم رضواني فلا أسخط عليكم بعده أبدا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2555: I grant you My good pleasure and shall never be displeased with you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2555: میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 2555: Os concedo Mi beneplácito y jamás estaré disgustado con vosotros. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 2555: « Je vous accorde Ma satisfaction et ne serai jamais mécontent de vous. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 2555: \"Aku telah menganugerahkan keridhaan-Ku kepadamu, dan Aku tidak akan pernah murka kepadamu lagi.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
