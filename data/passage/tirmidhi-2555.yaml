label:
  ar: "الترمذي 2555 — أحل عليكم رضواني فلا أسخط عليكم بعده أبدا"
  en: "Tirmidhi 2555 — I grant you My good pleasure and shall never be displeased with you"
  ur: "ترمذی 2555 — میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا"
text: "إن الله يقول لأهل الجنة يا أهل الجنة . فيقولون لبيك ربنا وسعديك . فيقول هل رضيتم فيقولون ما لنا لا نرضى وقد أعطيتنا ما لم تعط أحدا من خلقك . فيقول أنا أعطيكم أفضل من ذلك . قالوا وأى …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2555: أحل عليكم رضواني فلا أسخط عليكم بعده أبدا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2555: I grant you My good pleasure and shall never be displeased with you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2555: میں تم پر اپنی رضا اتارتا ہوں اور اس کے بعد کبھی ناراض نہ ہوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
