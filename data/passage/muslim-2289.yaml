label:
  ar: "مسلم 2289 — من ورد شرب ومن شرب لم يظمأ أبدا"
  en: "Muslim 2289 — whoever reaches it drinks, and whoever drinks never thirsts again"
  ur: "مسلم 2289 — جو بھی وہاں پہنچے پی لے گا اور جو پی لے گا کبھی پیاسا نہ ہوگا"
text: "أنا فرطكم على الحوض من ورد شرب ومن شرب لم يظمأ أبدا وليردن على أقوام أعرفهم ويعرفوني ثم يحال بيني وبينهم …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2289: من ورد شرب ومن شرب لم يظمأ أبدا. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2289: whoever reaches it drinks, and whoever drinks never thirsts again. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2289: جو بھی وہاں پہنچے پی لے گا اور جو پی لے گا کبھی پیاسا نہ ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
