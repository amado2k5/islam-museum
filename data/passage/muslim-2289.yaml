ref: "2289"
label:
  ar: "مسلم 2289 — من ورد شرب ومن شرب لم يظمأ أبدا"
  en: "Muslim 2289 — whoever reaches it drinks, and whoever drinks never thirsts again"
  ur: "مسلم 2289 — جو بھی وہاں پہنچے پی لے گا اور جو پی لے گا کبھی پیاسا نہ ہوگا"
  es: "Musulmán 2289 — Quien llega a ella bebe, y quien bebe no vuelve a tener sed jamás."
  fr: "Muslim 2289 — Celui qui atteint cette source boit, et celui qui boit n'aura plus jamais soif."
  tr: "Müslim 2289 — Ondan içen bir daha asla susamaz."
  id: "Muslim 2289 — Barang siapa minum darinya, ia tidak akan pernah haus lagi."
text: "أنا فرطكم على الحوض من ورد شرب ومن شرب لم يظمأ أبدا وليردن على أقوام أعرفهم ويعرفوني ثم يحال بيني وبينهم …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2289: من ورد شرب ومن شرب لم يظمأ أبدا. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2289: whoever reaches it drinks, and whoever drinks never thirsts again. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2289: جو بھی وہاں پہنچے پی لے گا اور جو پی لے گا کبھی پیاسا نہ ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2289: quien llega a él bebe, y quien bebe no vuelve a tener sed jamás. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2289: quiconque atteint cette source boit, et quiconque boit n’aura plus jamais soif. Le Prophète l’a rapporté de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Müslim'de 2289 numaralı hadis-i kudsi şöyledir: \"Suya yaklaşan herkes içer ve içen bir daha asla susamaz.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsiyi inceleyenler, bu hadisin rivayetlerini altı şeriat hadis külliyatında ve Muvatta'da bulabilirler."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, nomor 2289: \"Siapa pun yang datang ke air akan minum, dan siapa pun yang minum tidak akan pernah haus lagi.\" Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan mereka yang mempelajari hadits qudsi dapat menemukan riwayatnya dalam enam kumpulan hadits kanonik dan dalam Al-Muwatta."
