label: { ar: "الموطأ 1248 — زيد بن أسلم: رجل قال لعمر بن الخطاب إنه أصاب جرادات بسوطه وهو محرم، فقال أطعم قبضة من طعام", en: "Muwatta 1248", es: "Muwatta 1248", fr: "Muwatta 1248", ur: "موطا 1248", tr: "El-Muvatta 1248 — Zeyd ibn Aslam: Bir adam Ömer ibn el-Hattab'a ihramlı haldeyken kamçısıyla çekirge yakaladığını söyledi. Bunun üzerine Ömer şöyle dedi: \"Bir avuç yiyecek ver ona.\"", id: "Al-Muwatta 1248 — Zayd ibn Aslam: Seorang pria memberi tahu Umar ibn al-Khattab bahwa dia telah menangkap belalang dengan cambuknya ketika dalam keadaan ihram, lalu beliau berkata: Beri makan segenggam makanan" }
text: "أَطْعِمْ قَبضَةً من طَعَامٍ"
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رجلا جاء إلى عمر بن الخطاب فقال يا أمير المؤمنين إني أصبت جرادات بسوطي وأنا محرم، فقال له عمر أطعم قبضة من طعام. {cite:muwatta-maruf-1997 p.555}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Ömer ibn el-Hattab'a bir adamın gelip, \"Ey Müminlerin Emiri, ihramlı haldeyken kamçımla çekirge yakaladım\" dediğini aktarır. Ömer ona, \"Bir avuç yiyecek ver\" der. {cite:muwatta-maruf-1997 s.555}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa seorang pria datang kepada Umar ibn al-Khattab dan berkata, \"Wahai Amirul Mukminin, aku menangkap belalang dengan cambukku ketika aku sedang dalam keadaan ihram.\" Umar berkata kepadanya, \"Berikan segenggam makanan.\" {cite:muwatta-maruf-1997 p.555}"
