text: "في (وقالوا لن يدخل الجنة إلا من كان هودا أو نصرى) : لأهل الكتاب من اليهود والنصارى؛ أي: وقالت اليهود: لن يدخل الجنة إلا من كان هودا، وقالت النصارى: لن يدخل الجنة إلا من كان نصارى، فلف بين القولين ؛"
