label: { ar: "الموطأ 1962 — مالك: الأمر عندنا في الرجل يشتري السلعة من الرجل فيختلفان في الثمن، فيقول البائع بعتكها بعشرة دنانير، ويقول المبتاع ابتعتها بخمسة دنانير: يقال للبائع: إن شئت فأعطها بما قال، وإن شئت فاحلف ما بعت إلا بما قلت، ثم يقال للمشتري مثل ذلك", en: "Muwatta 1962" }
summary:
  ar: "قال مالك: الأمر عندنا في الرجل يشتري السلعة من الرجل، فيختلفان في الثمن، فيقول البائع: بعتكها بعشرة دنانير، ويقول المبتاع: ابتعتها منك بخمسة دنانير: إنه يقال للبائع: إن شئت فأعطها للمشتري بما قال، وإن شئت فاحلف بالله ما بعت سلعتك إلا بما قلت. فإن حلف قيل للمشتري: إما أن تأخذ السلعة بما قال البائع، وإما أن تحلف بالله ما اشتريتها إلا بما قلت. فإن حلف برئ منها، وذلك أن كل واحد منهما مدع على صاحبه. {cite:muwatta-maruf-1997 p.203}"
