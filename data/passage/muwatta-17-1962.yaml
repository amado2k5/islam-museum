label: { ar: "الموطأ 1962 — مالك: الأمر عندنا في الرجل يشتري السلعة من الرجل فيختلفان في الثمن، فيقول البائع بعتكها بعشرة دنانير، ويقول المبتاع ابتعتها بخمسة دنانير: يقال للبائع: إن شئت فأعطها بما قال، وإن شئت فاحلف ما بعت إلا بما قلت، ثم يقال للمشتري مثل ذلك", en: "Muwatta 1962", es: "Muwatta 1962", fr: "Muwatta 1962", ur: "موطا 1962", tr: "El-Muvatta 1962 — Malik: Hükmümüz şudur ki, bir adam başka bir adamdan bir mal satın alırken fiyat konusunda anlaşmazlığa düşerlerse, satıcı \"Sana on dinara sattım\" derken, alıcı \"Beş dinara aldım\" derse, satıcıya şöyle denir: \"İstersen onun dediği fiyata ver, istersen de söylediğinden başka bir fiyata satmadığına yemin et.\" Sonra aynı şey alıcıya da söylenir.", id: "Al-Muwatta 1962 — Malik: Hukum kami adalah jika seseorang membeli barang dari orang lain dan mereka berselisih harga, dengan penjual berkata, \"Saya menjualnya kepada Anda seharga sepuluh dinar,\" dan pembeli berkata, \"Saya membelinya seharga lima dinar,\" maka penjual diberitahu: \"Jika Anda mau, berikan kepada saya sesuai dengan yang dikatakan pembeli, dan jika Anda mau, bersumpahlah bahwa Anda tidak menjualnya dengan harga selain yang Anda katakan.\" Kemudian hal yang sama dikatakan kepada pembeli." }
summary:
  ar: "قال مالك: الأمر عندنا في الرجل يشتري السلعة من الرجل، فيختلفان في الثمن، فيقول البائع: بعتكها بعشرة دنانير، ويقول المبتاع: ابتعتها منك بخمسة دنانير: إنه يقال للبائع: إن شئت فأعطها للمشتري بما قال، وإن شئت فاحلف بالله ما بعت سلعتك إلا بما قلت. فإن حلف قيل للمشتري: إما أن تأخذ السلعة بما قال البائع، وإما أن تحلف بالله ما اشتريتها إلا بما قلت. فإن حلف برئ منها، وذلك أن كل واحد منهما مدع على صاحبه. {cite:muwatta-maruf-1997 p.203}"
  tr: "Malik şöyle dedi: Bizim uygulamamız şudur: Bir adam başka bir adamdan mal satın alır ve fiyat konusunda anlaşamazlarsa, satıcı \"Sana on dinara sattım\" derken, alıcı \"Senden beş dinara aldım\" derse, satıcıya şöyle denir: İstersen malları alıcıya söylediği fiyattan ver, istersen Allah'a yemin ederek mallarını başka bir fiyata satmadığına dair söz ver. Eğer yemin ederse, alıcıya şöyle denir: Ya malları satıcının söylediği fiyattan al, ya da Allah'a yemin ederek başka bir fiyata almadığına dair söz ver. Eğer yemin ederse, iddiasından kurtulur, çünkü her ikisi de diğerine karşı bir hak iddiasında bulunmaktadır. {cite:muwatta-maruf-1997 s.203}"
  id: "Malik berkata: Kebiasaan kita adalah jika seseorang membeli barang dari orang lain, dan mereka berselisih soal harga, dengan penjual berkata, \"Saya menjualnya kepada Anda seharga sepuluh dinar,\" dan pembeli berkata, \"Saya membelinya dari Anda seharga lima dinar,\" maka penjual diberitahu: Jika Anda mau, berikan barang itu kepada pembeli dengan harga yang telah dikatakannya, atau jika Anda mau, bersumpahlah demi Allah bahwa Anda menjual barang Anda dengan harga yang sama. Jika ia bersumpah, pembeli diberitahu: Ambillah barang itu dengan harga yang telah dikatakan penjual, atau bersumpahlah demi Allah bahwa Anda membelinya dengan harga yang sama. Jika ia bersumpah, ia dibebaskan dari tuntutan, karena masing-masing pihak mengajukan tuntutan terhadap pihak lain. {cite:muwatta-maruf-1997 p.203}"
