text: "… السجود، ولا محلَّ الإيمان. وتلك مصلحة ظاهرة. وأيضاً فإنما تأخذهم على قدر أعمالهم، وأعمالُهم لم تتمحضر للشر خاصة، فلا تأخذهم النار أخذَ مَن لا خير في عمله على حال. وهذا كاف في حصول المصلحة الناشئة من الإيمان والأعمال الصالحة. ثم …"
