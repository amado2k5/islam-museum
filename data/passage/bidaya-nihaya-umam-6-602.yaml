text: "… ابتدروا وضوءه، ولا يبصق بصاقاً إلا ابتدروه ولا بسقط من شعره شىء إلا أخذوه، فرجع إلى قريش فقال : يا معشر قريش إنى قد جئت كسرى فى ملكه وقيصر فى ملكه والنجاشى في ملكه، وإنى والله ما رأيت ملكا فى …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 6، ص 602، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 6, p. 602, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 6، ص 602 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
