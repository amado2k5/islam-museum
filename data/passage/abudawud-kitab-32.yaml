summary:
  ar: "القسم 32 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحروف والقراءات»، ويضم فيها النصوص من 3969 إلى 4008 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 32 of Sunan Abi Dawud (Dialects and Readings of the Qur'an (Kitab Al-Huruf Wa Al-Qira'at)) in the division of the open hadith dataset the museum took its reports from: reports 3969 to 4008 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 32، عنوان «کتاب الحروف والقراءات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3969 تا 4008۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 32 de Sunan Abi Dawud (Dialectos y lecturas del Corán (Kitab Al-Huruf Wa Al-Qira'at)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3969 al 4008, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
