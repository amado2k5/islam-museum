label:
  ar: "ابن ماجه 4295 — إن رحمتي سبقت غضبي"
  en: "Ibn Majah 4295 — My mercy outstrips My anger"
  ur: "ابن ماجہ 4295 — میری رحمت میرے غضب پر سبقت لے گئی"
  es: "Ibn Majah 4295 — Mi misericordia supera mi ira"
  fr: "Ibn Majah 4295 — Ma miséricorde surpasse Ma colère"
  tr: "İbn Majah 4295 — Merhametim gazabımdan önce gelir."
  id: "Ibn Majah 4295 — Rahmat-Ku mendahului murka-Ku"
text: "إن الله عز وجل لما خلق الخلق كتب بيده على نفسه إن رحمتي تغلب غضبي ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4295: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4295: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4295: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 4295: Mi misericordia supera mi ira. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 4295: « Ma miséricorde surpasse Ma colère. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "İbn Majah'ın Süneni'nde 4295 numaralı hadis-i kudsi hadis şöyledir: \"Rahmetim gazabımdan önce gelir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 4295: “Rahmat-Ku mendahului murka-Ku.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
