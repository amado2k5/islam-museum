label: { ar: "الموطأ 1768 — نافع عن سالم بن عبد الله: أرسلت عائشة سالما وهو يرضع إلى أختها أم كلثوم ليرضعته عشر رضعات حتى يدخل عليها، فأرضعته ثلاثا ثم مرضت، فلم تتم العشر", en: "Muwatta 1768" }
summary:
  ar: "يروي مالك عن نافع أن سالم بن عبد الله بن عمر أخبره أن عائشة أم المؤمنين أرسلت به وهو يرضع إلى أختها أم كلثوم بنت أبي بكر، فقالت: أرضعيه عشر رضعات حتى يدخل علي. قال سالم: فأرضعتني أم كلثوم ثلاث رضعات، ثم مرضت، فلم ترضعني غير ثلاث مرات. فلم أكن أدخل على عائشة من أجل أن أم كلثوم لم تتم لي عشر رضعات. {cite:muwatta-maruf-1997 p.121}"
