label: { ar: "الموطأ 1768 — نافع عن سالم بن عبد الله: أرسلت عائشة سالما وهو يرضع إلى أختها أم كلثوم ليرضعته عشر رضعات حتى يدخل عليها، فأرضعته ثلاثا ثم مرضت، فلم تتم العشر", en: "Muwatta 1768", es: "Muwatta 1768", fr: "Muwatta 1768", ur: "موطا 1768", tr: "El-Muvatta 1768 — Nafi’nin Salim bin Abdullah’tan rivayetine göre: Ayşe, henüz emzirmekte olan Salim’i, onunla çiftleşebilmesi için on defa emzirmesi amacıyla kız kardeşi Ümmü Kulsum’a gönderdi. Ümmü Kulsum onu üç defa emzirdi, sonra hastalandı ve on emzirmeyi tamamlayamadı.", id: "Al-Muwatta 1768 — Diriwayatkan oleh Nafi’ dari Salim bin Abdullah: Aisyah mengutus Salim, yang masih menyusui, kepada saudara perempuannya, Umm Kulthum, untuk menyusuinya sepuluh kali agar ia dapat masuk ke dalam ruangan. Umm Kulthum menyusuinya tiga kali, kemudian ia jatuh sakit, dan tidak menyelesaikan sepuluh kali menyusui tersebut." }
summary:
  ar: "يروي مالك عن نافع أن سالم بن عبد الله بن عمر أخبره أن عائشة أم المؤمنين أرسلت به وهو يرضع إلى أختها أم كلثوم بنت أبي بكر، فقالت: أرضعيه عشر رضعات حتى يدخل علي. قال سالم: فأرضعتني أم كلثوم ثلاث رضعات، ثم مرضت، فلم ترضعني غير ثلاث مرات. فلم أكن أدخل على عائشة من أجل أن أم كلثوم لم تتم لي عشر رضعات. {cite:muwatta-maruf-1997 p.121}"
  tr: "Malik, Nafi'den rivayetle, Salim ibn Abdullah ibn Umar'ın kendisine, Müminlerin Annesi Aişe'nin, henüz emzirme dönemindeyken onu kız kardeşi Ümmü Kulsum bint Ebu Bekir'e göndererek, \"Onu on defa emzir ki bana girebilsin\" dediğini anlattığını aktarır. Salim şöyle dedi: \"Ümmü Kulsum beni üç defa emzirdi, sonra hastalandı ve sadece üç defa daha emzirdi. Ümmü Kulsum on defa emzirmeyi tamamlamadığı için Aişe'ye giremedim.\" {cite:muwatta-maruf-1997 s.121}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Salim bin Abdullah bin Umar memberitahunya bahwa Aisyah, Ibu Kaum Beriman, mengutusnya, ketika ia masih menyusui, kepada saudara perempuannya, Umm Kulthum binti Abi Bakr, seraya berkata: “Susuilah dia sepuluh kali agar dia dapat menemuiku.” Salim berkata: “Umm Kulthum menyusuiku tiga kali, kemudian ia jatuh sakit dan hanya menyusuiku tiga kali lagi. Aku tidak dapat menemui Aisyah karena Umm Kulthum belum menyelesaikan sepuluh kali menyusui untukku.” {cite:muwatta-maruf-1997 p.121}"
