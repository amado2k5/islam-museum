label: { ar: "الموطأ 1073 — مالك: أما السعي بين الصفا والمروة فإنه لا يقطعه ما أصابه من انتقاض وضوئه، ولا يدخل السعي إلا وهو طاهر بوضوء", en: "Muwatta 1073", es: "Muwatta 1073", fr: "Muwatta 1073", ur: "موطا 1073", tr: "El-Muvatta 1073 — Malik: Safa ile Merve arasındaki Sa'i'ye gelince, abdestinin bozulmasıyla kesintiye uğramaz ve kişi ancak abdesti temiz olduğunda Sa'i'ye girer.", id: "Al-Muwatta 1073 — Malik: Adapun Sa'i antara Safa dan Marwa, Sa'i tersebut tidak terganggu oleh batalnya wudhu, dan dia tidak memasuki Sa'i kecuali dalam keadaan suci karena wudhu." }
summary:
  ar: "قول لمالك: أما السعي بين الصفا والمروة فإنه لا يقطع ذلك عليه ما أصابه من انتقاض وضوئه، ولا يدخل السعي إلا وهو طاهر بوضوء. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1296). {cite:muwatta-maruf-1997 p.495}"
  tr: "Malik şöyle demiştir: Safa ile Merve arasında yapılan Sa'i (ritüel yürüyüş) abdestin bozulmasıyla geçersiz olmaz ve kişi abdest aldıktan sonra ritüel temizlik halinde olmadıkça Sa'i'ye girmemelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1296) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.495}"
  id: "Malik berkata: Adapun Sa'i (berjalan ritual) antara Safa dan Marwa, tidak batal karena batalnya wudhu, dan seseorang tidak boleh memasuki Sa'i kecuali dalam keadaan suci (setelah berwudhu). Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1296). {cite:muwatta-maruf-1997 p.495}"
