label: { ar: "سنن أبي داود 4282 — الأب والأبوة", en: "Sunan Abi Dawud 4282 — the father and fatherhood", ur: "سنن ابی داؤد 4282 — باپ اور والدیت", es: "Sunan Abi Dawud 4282 — El padre y la paternidad", fr: "Sunan Abi Dawud 4282 — Le père et la paternité", tr: "Sunan Abi Dawud 4282 — Baba ve Babalık", id: "Sunan Abi Dawud 4282 — Sang Ayah dan Peran Ayah" }
text: "… ثُمَّ اتَّفَقُوا \" حَتَّى يَبْعَثَ فِيهِ رَجُلاً مِنِّي \". أَوْ \" مِنْ أَهْلِ بَيْتِي يُوَاطِئُ اسْمُهُ اسْمِي وَاسْمُ أَبِيهِ اسْمَ أَبِي \". زَادَ فِي حَدِيثِ فِطْرٍ \" يَمْلأُ الأَرْضَ قِسْطًا وَعَدْلاً كَمَا مُلِئَتْ ظُلْمًا وَجَوْرًا \". وَقَالَ فِي حَدِيثِ سُفْيَانَ \" لاَ تَذْهَبُ أَوْ لاَ تَنْقَضِي الدُّنْيَا حَتَّى يَمْلِكَ الْعَرَبَ رَجُلٌ مِنْ أَهْلِ بَيْتِي يُوَاطِئُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4282، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4282 (The Promised Deliverer (Kitab Al-Mahdi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4282، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4282 (El Libertador Prometido (Kitab Al-Mahdi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4282 (Le Libérateur Promis (Kitab Al-Mahdi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4282 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4282, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
