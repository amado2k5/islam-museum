text: "… شعب الإيمان. وحُرمَة الودِّ ما لي مِنكُم عِوَضُ ولَيسَ لي في سِواكُم سَادتي غَرَضُ وقَدْ شَرَطْتُ على قومِ صَحِبتُهُم بأنَّ قلبي لَكُمْ من دُونِهم فرضُوا ومِنْ حديثي بكُم قالوا : به مَرَضٌ فقُلْتُ : لا زالَ عنِّي ذلك المَرَضُ المحبون …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 937، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 937, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 937 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
