text: "وَحَدَّثَنَاهُ أَبُو كُرَيْبٍ، حَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا هِشَامٌ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ سَعْدٍ، أَنَّحَدَّثَاهُ - أَوْ، أَحَدُهُمَا - عَنْ أَبِيهِ، كَعْبِ بْنِ مَالِكٍ عَنِ النَّبِيِّ بِمِثْلِهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5299، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5299 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5299، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
