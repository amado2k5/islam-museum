text: "في المدح والهجو والمجون والفُكاهات والمُلَح والخمر والمُعاقرة والنّدمان والقِيان... الخ ومن مُزاحاته: أنه أهدى إلى رسول اللّٰه وَلِقِ جرّةَ عسل اشتراها من أعرابيّ، وأتى بالأعرابيِّ إلى باب النبي وَلِفِ، فقال: خذ الثّمن مِن هاهنا، فلما قسمها النبيّ وَلِلِمِ نادى …"
