ref: "1.32"
label: { ar: "الموطأ 32 — عبد الله بن زيد يصف وضوء النبي", en: "Muwatta 32" }
text: "ثم مسح رأسه بيديه فأقبل بهما وأدبر؛ بدأ بمقدم رأسه ثم ذهب بهما إلى قفاه ثم ردهما حتى رجع إلى المكان الذي بدأ منه"
summary:
  ar: "أول حديث في باب العمل في الوضوء، وهو في الموطأ من كتاب الصلاة؛ ويذكر المحقق أن إحدى النسخ تضع قبله عنوان «كتاب الطهارة» وليس ذلك في النسخ العتيقة. يرويه يحيى عن مالك عن عمرو بن يحيى المازني عن أبيه، أنه سأل عبد الله بن زيد بن عاصم، وكان من أصحاب رسول الله، أن يريه كيف كان النبي يتوضأ، فدعا بماء فغسل يديه مرتين مرتين، ثم تمضمض واستنثر ثلاثاً، ثم غسل وجهه ثلاثاً، ثم يديه إلى المرفقين مرتين مرتين، ثم مسح رأسه بيديه مقبلاً بهما من مقدم رأسه إلى قفاه ثم مدبراً إلى حيث بدأ، ثم غسل رجليه. ويخرّجه المحقق عند البخاري (185) ومسلم (1/145) وأبي داود (118) والترمذي (32) والنسائي وابن ماجه (434) من طرق أصحاب مالك، وينقل عن ابن عبد البر أن مالكاً انفرد بقوله إن عبد الله بن زيد جد عمرو بن يحيى وإن كان جده فلأمه (التمهيد 20/114)، ويذكر أن المزي صرّح بأنه جده لأمه فزال الإشكال. {cite:muwatta-maruf-1997 p.50} {cite:muwatta-maruf-1997 p.51}"
