ref: "1.32"
label: { ar: "الموطأ 32 — عبد الله بن زيد يصف وضوء النبي", en: "Muwatta 32", es: "Muwatta 32", fr: "Muwatta 32", ur: "موطا 32", tr: "Al-Muwatta 32 — Abdullah bin Zeyd, Peygamber'in abdestini anlatıyor", id: "Al-Muwatta 32 — Abdullah bin Zaid menjelaskan tentang wudhu Nabi" }
text: "ثم مسح رأسه بيديه فأقبل بهما وأدبر؛ بدأ بمقدم رأسه ثم ذهب بهما إلى قفاه ثم ردهما حتى رجع إلى المكان الذي بدأ منه"
summary:
  ar: "أول حديث في باب العمل في الوضوء، وهو في الموطأ من كتاب الصلاة؛ ويذكر المحقق أن إحدى النسخ تضع قبله عنوان «كتاب الطهارة» وليس ذلك في النسخ العتيقة. يرويه يحيى عن مالك عن عمرو بن يحيى المازني عن أبيه، أنه سأل عبد الله بن زيد بن عاصم، وكان من أصحاب رسول الله، أن يريه كيف كان النبي يتوضأ، فدعا بماء فغسل يديه مرتين مرتين، ثم تمضمض واستنثر ثلاثاً، ثم غسل وجهه ثلاثاً، ثم يديه إلى المرفقين مرتين مرتين، ثم مسح رأسه بيديه مقبلاً بهما من مقدم رأسه إلى قفاه ثم مدبراً إلى حيث بدأ، ثم غسل رجليه. ويخرّجه المحقق عند البخاري (185) ومسلم (1/145) وأبي داود (118) والترمذي (32) والنسائي وابن ماجه (434) من طرق أصحاب مالك، وينقل عن ابن عبد البر أن مالكاً انفرد بقوله إن عبد الله بن زيد جد عمرو بن يحيى وإن كان جده فلأمه ⁦(التمهيد 20/114)⁩، ويذكر أن المزي صرّح بأنه جده لأمه فزال الإشكال. {cite:muwatta-maruf-1997 p.50} {cite:muwatta-maruf-1997 p.51}"
  tr: "Abdest alma amelleri bölümündeki ilk hadis, Muvatta'da, Namaz Kitabı'nda yer almaktadır. Editör, bir el yazmasında hadisin başına \"Temizlik Kitabı\" başlığının eklendiğini, ancak bunun daha eski el yazmalarında bulunmadığını belirtmektedir. Yahya, Malik'ten, o da Amr ibn Yahya el-Mazini'den, o da babasından rivayet ettiğine göre, Allah Resulü'nün sahabelerinden Abdullah ibn Zeyd ibn Asim'den Peygamber'in abdest alma şeklini kendisine göstermesini istemiştir. Bunun üzerine Abdullah ibn Zeyd ibn Asim su getirmiş, ellerini ikişer defa yıkamış, sonra ağzını ve burnunu üçer defa çalkalamış, sonra yüzünü üç defa yıkamış, sonra dirseklerine kadar ellerini ikişer defa yıkamış, sonra başını elleriyle silmiş, ellerini başının önünden ensesine doğru hareket ettirmiş ve sonra başladığı yere geri getirmiş, ardından ayaklarını yıkamıştır. Araştırmacı, bunu Buhari (185), Müslim (1/145), Ebu Davud (118), Tirmizi (32), Nesai ve İbn Mâce'de (434) Malik'in sahabelerinin rivayet zincirleri aracılığıyla aktarıyor. İbn Abdülberr'in, Malik'in Abdullah ibn Zeyd'in Amr ibn Yahya'nın dedesi olduğunu ve eğer öyleyse bunun annesi aracılığıyla olduğunu belirtmede eşsiz olduğunu söylediğini aktarıyor (el-Temhid 20/114). El-Mizzi'nin açıkça onun anne tarafından dedesi olduğunu belirttiğini ve böylece belirsizliği giderdiğini belirtiyor. {cite:muwatta-maruf-1997 s.50} {cite:muwatta-maruf-1997 s.51}"
  id: "Hadits pertama dalam bab tentang tata cara wudhu terdapat dalam Muwatta, dalam Kitab Shalat. Editor mencatat bahwa satu manuskrip menempatkan judul \"Kitab Penyucian\" di depannya, tetapi ini tidak ditemukan dalam manuskrip yang lebih tua. Diriwayatkan oleh Yahya, dari Malik, dari Amr ibn Yahya al-Mazini, dari ayahnya, yang berkata bahwa ia meminta Abdullah ibn Zayd ibn Asim, salah seorang Sahabat Rasulullah, untuk menunjukkan kepadanya bagaimana Nabi berwudhu. Maka beliau meminta air dan mencuci kedua tangannya dua kali, kemudian berkumur dan membersihkan hidungnya tiga kali, kemudian mencuci wajahnya tiga kali, kemudian mencuci kedua tangannya sampai siku dua kali, kemudian mengusap kepalanya dengan kedua tangannya, menggerakkannya dari depan kepala ke belakang leher dan kemudian kembali ke tempat semula, kemudian mencuci kakinya. Peneliti menyertakannya dalam al-Bukhari (185), Muslim (1/145), Abu Dawud (118), al-Tirmidhi (32), al-Nasa'i, dan Ibn Majah (434) melalui sanad para sahabat Malik. Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa Malik unik dalam menyatakan bahwa 'Abdullah ibn Zayd adalah kakek dari 'Amr ibn Yahya, dan jika memang demikian, itu melalui ibunya (al-Tamhid 20/114). Ia menyebutkan bahwa al-Mizzi secara eksplisit menyatakan bahwa ia adalah kakek dari pihak ibunya, sehingga menyelesaikan ambiguitas tersebut. {cite:muwatta-maruf-1997 p.50} {cite:muwatta-maruf-1997 p.51}"
