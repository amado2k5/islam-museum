text: "… فرائض كالحج. والزكاة، أو كانت كلها واجبات كالكفارات والنذر، وصدقة الفطر، أو كانت. كلها تطوعات: كحج التطوع والصدقة على الفقراء يبدأ بما بدأ به الموصي. وإن جمعت ما ذكر كحجة الإِسلام والكفارات والنذر وصدقة التطوع على الفقراء فيبدأ بالفرض، ثم …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 2، ص 239، يرد فيه ذكر الفريضة والفرائض، والفرض، والواجب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 2, p. 239, whose wording mentions the obligation (farida), the obligatory (fard), the obligatory (wajib), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 2، ص 239 کا اقتباس جس میں فریضہ اور فرائض، فرض، واجب، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
