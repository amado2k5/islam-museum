text: "وإن سنام المجد من آل هاشم بنو بنت مخزوم ووالدك العبد"
summary:
  ar: "بيت من أبيات «لقد علم الأقوام» في هجاء أبي سفيان بن الحارث، كما في شرح البرقوقي لديوان حسان {{cite:sharh-diwan-hassan-barquqi-1929 p.159}}."
  en: "Verse 3 of verses against Abu Sufyan ibn al-Harith ('The peoples know'), as in al-Barquqi's commentary on Hassan's diwan."
  es: "Versículo 3 de versos contra Abu Sufyan ibn al-Harith ('Los pueblos saben'), como en el comentario de al-Barquqi sobre el diwan de Hassan."
  fr: "Verset 3 des versets contre Abu Sufyan ibn al-Harith (« Les peuples savent »), comme dans le commentaire d'al-Barquqi sur le diwan de Hassan."
  ur: "ابو سفیان بن حارث ⁦('لوگ جانتے ہیں')⁩ کے خلاف آیات کی 3، جیسا کہ حسن کے دیوان کی تفسیر البرقی میں ہے۔"
  tr: "El-Barquqi'nin Hasan'ın Divanı üzerine yaptığı tefsirde yer alan, Ebu Sufyan ibn el-Harith'i hicveden \"İnsanlar Öğrendi\" şiirinden bir dize {{cite:sharh-diwan-hassan-barquqi-1929 s.159}}."
  id: "Sebuah bait dari puisi “Orang-orang telah belajar” dalam satire Abu Sufyan ibn al-Harith, sebagaimana terdapat dalam komentar al-Barquqi tentang Diwan Hassan {{cite:sharh-diwan-hassan-barquqi-1929 p.159}}."
translations:
  en:
    text: "The summit of glory among the house of Hashim belongs to the sons of the daughter of Makhzum, while your father is the slave."
