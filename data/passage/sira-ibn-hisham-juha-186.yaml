  en: "An excerpt from The Sira of Ibn Ishaq in Ibn Hisham's recension, p. 186, with laughter and smiling; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "ابن ہشام کی تجدید میں ابن اسحاق کی سیرت، ص 186 کا اقتباس جس میں ہنسی اور تبسم ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
