text: "السيرة لابن هشام ذكْرُ الإسْرَاء وَالْمعْرَاج هُوَ المدئر: قال: فَلَمّا دَخَلَ بي قال: مَنْ هذا يا جبريلُ؟ قال: محمد، قال: أوَقدْ بُعِثَ؟ قال: نعم، قال: فَدَعا لي بخير وقاله. البيهقي في دلائل النبوة -. عدم ضحك خادم النار للرسول وَلِيِ …"
summary:
