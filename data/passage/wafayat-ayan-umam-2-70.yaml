text: "… وجلست على سرير مابس بالذهب ودخل اليها السلطار فقبل العجم على على عصره الارض بيزيديها ولم يكشف البرقع عن وجهها فى ذلك الوقت وقدم لها تحفايقص الوصف،ن ثم اتى بلا الروم وقرأ لى ضبطها وقبل الارض وخدم وانصرف وظهر عليه …"
