label: { ar: "صحيح مسلم 3583 — ما أُحل، ما لا يحل", en: "Sahih Muslim 3583 — what was made lawful; what is not lawful", ur: "صحیح مسلم 3583 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih Muslim 3583 — lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih Muslim 3583 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih Müslim 3583 — Neler caizdir, neler caiz değildir", id: "Sahih Muslim 3583 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "وَحَدَّثَنَا هَدَّابُ بْنُ خَالِدٍ، حَدَّثَنَا هَمَّامٌ، حَدَّثَنَا قَتَادَةُ، عَنْ جَابِرِ بْنِ زَيْدٍ، عَنِ ابْنِ، عَبَّاسٍ أَنَّ النَّبِيَّ أُرِيدَ عَلَى ابْنَةِ حَمْزَةَ فَقَالَ \" إِنَّهَا لاَ تَحِلُّ لِي إِنَّهَا ابْنَةُ أَخِي مِنَ الرَّضَاعَةِ وَيَحْرُمُ مِنَ الرَّضَاعَةِ مَا يَحْرُمُ مِنَ الرَّحِمِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 3583، يذكر ما أُحل، وما لا يحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3583 (The Book of Suckling), that mentions what was made lawful, what is not lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3583، جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 3583 (El Libro de la Lactancia), menciona lo que es lícito, lo que no lo es y lo que es ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3583 (Le Livre de l'allaitement), mentionne ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 3583 numaralı hadis, helal, haram ve haramdan bahsetmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3583, menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dan dilarang. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan dilarang."
