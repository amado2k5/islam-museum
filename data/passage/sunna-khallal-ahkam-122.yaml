text: "… الثلث ولا غير الثلث؛ لكن إن أحبوا هم أن يبذلوا ذلك ويتركوا القتال فلهم ذلك، وليس بواجب عليهم، إلّا أن يكونوا عاجزين عن القتال، فحينئذ يصالحونهم بما أمكن، ولا يقاتلون قتالًا تذهب فيه أنفسهم وأموالهم. وأما الوجوب: فلا يجب عليهم …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 122، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 122, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed, what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، خلال، ص 122 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de al-Khallal, p. 122, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable, ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de al-Khallal, p. 122, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo que obliga a la persona responsable, lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 122. sayfasından bir alıntı, farz olan amelleri, yasal olarak sorumlu bir kişiden beklenenleri ve farz olmayan amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal, \"Al-Sunnah,\" halaman 122, membahas tentang amalan-amalan wajib, apa yang dituntut dari orang yang bertanggung jawab secara hukum, dan apa yang tidak wajib. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan-amalan wajib, amalan-amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil."
