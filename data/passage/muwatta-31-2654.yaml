label: { ar: "الموطأ 2654 — عبد الله بن دينار عن ابن عمر: الذي يجر ثوبه خيلاء لا ينظر الله إليه", en: "Muwatta 2654", es: "Muwatta 2654", fr: "Muwatta 2654", ur: "موطا 2654", tr: "El-Muvatta 2654 — Abdullah bin Dinar, İbn Ömer'den rivayetle: \"Gururdan elbisesini sürükleyen kimseye Allah bakmaz.\"", id: "Al-Muwatta 2654 — Abdullah bin Dinar berdasarkan riwayat Ibnu Umar: “Barang siapa yang menyeret-nyeret pakaiannya karena kesombongan, Allah tidak akan memandanginya.”" }
summary:
  ar: "يروي مالك عن عبد الله بن دينار عن عبد الله بن عمر أن رسول الله قال: الذي يجر ثوبه خيلاء لا ينظر الله إليه يوم القيامة. {cite:muwatta-maruf-1997 p.500}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Kim kibirden elbisesini sürüklerse, Allah kıyamet günü ona bakmaz.\" {cite:muwatta-maruf-1997 s.500}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: “Barang siapa yang menarik-narik pakaiannya karena kesombongan, maka Allah tidak akan memandanginya pada Hari Kiamat.” {cite:muwatta-maruf-1997 p.500}"
