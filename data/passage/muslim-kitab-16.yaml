summary:
  ar: "القسم 16 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النكاح»، ويضم فيها النصوص من 388 إلى 3567 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 16 of Sahih Muslim (The Book of Marriage) in the division of the open hadith dataset the museum took its reports from: reports 388 to 3567 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 16، عنوان «کتاب النکاح»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 388 تا 3567۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 16 de Sahih Muslim (El Libro del Matrimonio) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 388 al 3567, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre du mariage), volume 16, dans la base de données ouverte: les hadiths 388 à 3567. Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 16. bölümü \"Nikah Kitabı\" başlığını taşımakta olup, 388'den 3567'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 16 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pernikahan\" dan berisi teks 388 hingga 3567, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
