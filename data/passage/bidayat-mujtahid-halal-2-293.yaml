text: "… البقرة آية. انظر المجموع وما بعدها لمذهب الشافعي، ومذهب مالك. واشترط أصحاب أحمد أن يكون الوطء حلالاً، فإن وطئها في حيض أو نفاس، أو إحرام من أحدهما، أو منها، أو أحدهما صائم فرضاً، لم تحل، لأنه وطء حرام لحق اللّٰه …"
