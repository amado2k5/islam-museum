text: "… وأمية والعاص يساومون النبي وَلِه واعترض رسول اللّٰه وَلِفِ وهو يَطُوفُ بِالْكَعْبَةِ، فيما بلغني، الأسودُ بن المطلب بن أسد بن عبد الْعُزَّى، والوليدُ بن المغيرة، وأمَيَّةُ بن خلف، والعاصُ بن وائل السَّهمي، وكانوا ذوي أسنان في قومهم؛ فَقَالُوا : يَا …"
summary:
