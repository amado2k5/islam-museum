text: "… رِفاعة فدفع إلى النبىّ كتابه الذى كتب معه، فلمّا قرأً كتابه استخبرهم فأَخبروه بما صنع زيد بن حارثة. فقال : كيف أَصنعُ بالقتلى؟ فقال رفاعة : يا رسول اللّٰه أَنت أَعلم، لا تُحرّم علينا حلالاً ولا تُحِلّ لنا حراماً. قال …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 3، ص 153، يذكر الحلال، وما أُحل، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 3, p. 153, that mentions the lawful, what was made lawful, what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 3، ص 153 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
