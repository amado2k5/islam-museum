text: |-
  ١ لت قولة تعالى وأغ-روا
  ينكم بعروف لبأمر بعضكم
  بعضا بالمعروف اه مختار
  قوله الفرأئق بالضم ويقال ه
  البريدلاته يصيح قدام الاسدينذر
  به ولا يكون إلا بأرض الحبنة ام
  وابنه يسمى الفزر وبنته الفزرة
  كما فى القاموس قاله نصر
  ⁦(بثد)⁩
  مجرّب ويقال أيضافى وجه المال تعرف امرته أى غماه وكثرته ونفقته والتأميرنولية
  الامارة يقال هوأمير ؤمر وتاتر عليه-م أى تسلط وآمرته فى أمرى مؤامرة اذا شاورته
  والعامة تقول واهرته وائتمر الامر أى ا.تثله قال امر ؤالقيس
  أحاد بن عمر وكانى خر * ويعد و على المرءما يأتمر
  أى ما تاهر به نفسه فيرى أنه رشدفر بما كان هلا كه فى ذلك ويقال اتتمروابه اذا هموابه
  وتشاوروافيه والائتمار والاستثمار المشاورة وكذلك التاهر على وزن التفاعل ١ أما
  قول الشاعر (ه و ابن شبل الاءرابى ويا مر وأخيه مؤتر * ومعلل ومطفى الهر
  فهمايومان من أيام العجوز كان الاول منهما بأمر الناس بالحذر والآخر يشاورهم فى الظعن
  أو المقام قال الاصمعى الامار والامارة الوقت والعلامة وأنشد الى امار وامارمدتى
  والامر بالتحريك بجع امرة وهى العلم الصغير من أعلام المضارز من الحجارة وقال أبوزييد
  ان ان عثمان أمسى فوقه أمى
  ورجل إمّر وإقرة أى ضعيف الرأى باترا.كل
  أحد مفال إمع وامّعة وقال اهر والقيس
  واست بذى رئسة إمر • اذا قيد. ستكرها أصحبا
  والامرأيضا الصغير من ولد الضأن والاتى إقريقال ماله إمّر ولا إمرة أى شئء قال الساجع
  اذاطلعت الشعرى سفرا ) فلا تغذون إمّرة ولا إمّرا
  ⁦( أود)⁩ الاوار بائضم حرارة النار والشمس وحرارة العطس أيضا قال الراجز
  والنارقد تش فى.ن الاوار والذارههنا السمات وأوارة اسم ماء ⁦(أهر)⁩ الاهرة
  بالتحريك متاع البيت والجمع أهرواهرات قال الراجز
  كأغار بصخرازا • أحسن بيت أهرادبزا
  ير) جمع الايرآير على أفعل وأيوروايا ر قال الشاعر
  يا أضبعاأ كات آياراً حرة • ففى البطون وقد راحت قراقير
  ورواه أبوزيديا ضبعا على واحدة والايارى العظيم الذكر وآرها يميرها جامعه أوقال
  ولاغروان كان الاعيرج آرها * وما الناس الاآيرومئير
  الفرّاء يقال للشمال إيرواير وهير وهير وأنشديعقوب
  وانا مساميح اذاهبت الصبا • وانا لا يساراذا الايرهيت
  ويقال الايرريح حارة من الاوارواغماصارت واو. ياءلكسرة ما قبلها
  صل البساء ب لبنرجعها فى القسلة أبؤروايا ربهمزة بعد الباء ومن العرب
  من يقلب اله-هزة فيقول آبارماذا كثرت فهى البقار وقد بأرت بتراوالبؤرة الحفرة أبوزيد
  بأرت أباربأ راحفرت بؤرة يطبخ فيها وهى الارة والبثيرة على فعيلة الذخيرة وقدبأرت الشئ
  وابتأرته اذا ادخرته ⁦(لبر%)⁩ الببروا-د الببور وهوالفرائق الذى يعادى الاسد
  ⁦( بتر)⁩ بترت الشئ بتراقطعته قبل الاتمام والانبتار الانقطاع والباتر السيف القاطع
  والابتر المقطوع الذقب تقول منسه بتر بالمكسر يبتر بترا وفى الحديث ماهذه البتيراء والابتر
  الذى لاعة ب له إو كل أمرانة طع من اظخير أثره فه وأبتروخطب زياد خطيته البتراهلانه لم يحخد
