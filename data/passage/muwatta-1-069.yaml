label: { ar: "الموطأ 69 — أبو هريرة: المشي إلى الصلاة صلاة، وأعظمكم أجراً أبعدكم داراً", en: "Muwatta 69" }
text: "فإذا سمع أحدكم الإقامة فلا يسع، فإن أعظمكم أجراً أبعدكم داراً"
summary:
  ar: "أثر يرويه مالك عن نعيم بن عبد الله المجمر أنه سمع أبا هريرة يقول، في باب جامع الوضوء: من توضأ فأحسن وضوءه ثم خرج قاصداً الصلاة فهو في صلاة ما دام قاصداً لها، ويُكتب له بإحدى خطوتيه حسنة وتُمحى عنه بالأخرى سيئة، ومن سمع الإقامة فلا يسرع، فإن أعظم الناس أجراً أبعدهم داراً لكثرة الخطا. وينقل المحقق عن ابن عبد البر أنه موقوف في الموطأ لم يتجاوز به أبا هريرة، وأن معناه يتصل إلى النبي من طرق صحاح من حديث أبي سعيد الخدري وغيره، ومثله لا يقال بالرأي (التمهيد 16/201–202). {cite:muwatta-maruf-1997 p.71} {cite:muwatta-maruf-1997 p.72}"
