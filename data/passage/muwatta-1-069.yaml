label: { ar: "الموطأ 69 — أبو هريرة: المشي إلى الصلاة صلاة، وأعظمكم أجراً أبعدكم داراً", en: "Muwatta 69", es: "Muwatta 69", fr: "Muwatta 69", ur: "موطا 69", tr: "El-Muvatta 69 — Ebu Hurayra: Namaza yürüyerek gitmek de bir namazdır ve daha uzakta yaşayan daha büyük sevap kazanır.", id: "Al-Muwatta 69 — Abu Hurairah: Berjalan menuju tempat salat itu sendiri adalah salat, dan orang yang tinggal lebih jauh akan mendapatkan pahala yang terbesar." }
text: "فإذا سمع أحدكم الإقامة فلا يسع، فإن أعظمكم أجراً أبعدكم داراً"
summary:
  ar: "أثر يرويه مالك عن نعيم بن عبد الله المجمر أنه سمع أبا هريرة يقول، في باب جامع الوضوء: من توضأ فأحسن وضوءه ثم خرج قاصداً الصلاة فهو في صلاة ما دام قاصداً لها، ويُكتب له بإحدى خطوتيه حسنة وتُمحى عنه بالأخرى سيئة، ومن سمع الإقامة فلا يسرع، فإن أعظم الناس أجراً أبعدهم داراً لكثرة الخطا. وينقل المحقق عن ابن عبد البر أنه موقوف في الموطأ لم يتجاوز به أبا هريرة، وأن معناه يتصل إلى النبي من طرق صحاح من حديث أبي سعيد الخدري وغيره، ومثله لا يقال بالرأي ⁦(التمهيد 16/201–202)⁩. {cite:muwatta-maruf-1997 p.71} {cite:muwatta-maruf-1997 p.72}"
  tr: "Malik'in, Nu'aym ibn Abdullah el-Mücmir'den rivayet ettiği bir hadiste, Ebu Hurayra'nın abdestin kapsamlı hükümleri bölümünde şöyle dediğini aktarır: \"Kim abdestini hakkıyla alıp namaz kılmak niyetiyle dışarı çıkarsa, namaz kılmaya niyetli olduğu sürece namazda sayılır. Bir adım atması ona sevap kazandırır, diğer adım atması ise günahını siler. İmame'yi duyan kimse acele etmesin, çünkü daha uzakta oturanlar daha fazla adım attıkları için daha büyük sevap kazanırlar.\" Araştırmacı, İbn Abd el-Barr'ın bu hadisin Ebu Hurayra'ya atfedilen bir söz olduğunu ve anlamının Ebu Sa'id el-Hudri ve diğerlerinden gelen sahih rivayet zincirleriyle Peygamberimize kadar uzandığını söylediğini aktarır. Böyle bir ifade kişisel görüşe dayandırılamaz (el-Tamhid 16/201-202). {cite:muwatta-maruf-1997 s.71} {cite:muwatta-maruf-1997 s.72}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nu'aym ibn 'Abdullah al-Mujmir, yang mendengar Abu Hurayrah berkata, dalam bab tentang hukum-hukum wudhu yang komprehensif: \"Barangsiapa berwudhu dengan benar dan kemudian keluar dengan niat shalat, maka ia dianggap telah shalat selama ia berniat shalat. Satu langkah dicatat untuknya sebagai amal kebaikan, dan satu langkah dihapuskan. Barangsiapa mendengar iqamah hendaknya tidak terburu-buru, karena orang-orang yang tinggal lebih jauh akan menerima pahala terbesar karena jumlah langkah yang diambil lebih banyak.\" Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa riwayat ini adalah pernyataan yang dinisbahkan kepada Abu Hurayrah dalam al-Muwatta', dan maknanya dapat ditelusuri kembali kepada Nabi melalui sanad-sana riwayat yang sahih dari Abu Sa'id al-Khudri dan lainnya. Pernyataan seperti itu tidak mungkin berdasarkan pendapat pribadi (al-Tamhid 16/201–202). {kutip:muwatta-maruf-1997 hal.71} {kutip:muwatta-maruf-1997 hal.72}"
