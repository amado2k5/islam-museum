  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 777, that mentions the lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 777 کا اقتباس جس میں حلال، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
