text: "… ضَحِيَ لم يجد ظلاً، وإذا ظَمِيَ لم يجد ماء يتروّى به، وإنما سفر الدنيا منقطع، وأكيس الناس من قام يتجهز لسفر لا ينقطع. عن يزيد بن سمرة: أنه سمع عطاء الخراساني يقول: مجالس الذكر هي مجالس الحلال والحرام. عن الأوزاعي …"
summary:
