label: { ar: "الموطأ 1349 — مالك: لا بأس أن يدفن الرجلان والثلاثة في قبر واحد من ضرورة، ويجعل الأكبر مما يلي القبلة", en: "Muwatta 1349", es: "Muwatta 1349", fr: "Muwatta 1349", ur: "موطا 1349", tr: "El-Muvatta 1349 — Malik: Zorunluluk halinde iki veya üç kişiyi aynı mezara gömmekte bir sakınca yoktur ve en yaşlı olan kıbleye en yakın tarafa yerleştirilmelidir.", id: "Al-Muwatta 1349 — Malik: Tidak ada salahnya menguburkan dua atau tiga orang laki-laki dalam satu kuburan karena kebutuhan, dan yang tertua sebaiknya ditempatkan di sisi yang paling dekat dengan kiblat." }
text: "لا بَأْسَ أنْ يُدْفنَ الرَّجُلانِ وَالثَّلاثةُ في قَبْرٍ وَاحدٍ، مِن ضَرُورَةٍ"
summary:
  ar: "يقول مالك إنه لا بأس أن يدفن الرجلان والثلاثة في قبر واحد من ضرورة، ويجعل الأكبر مما يلي القبلة. {cite:muwatta-maruf-1997 p.604}"
  tr: "Malik, zorunluluk halinde bir mezara iki veya üç kişinin gömülmesinin caiz olduğunu ve en iri olanın kıbleye en yakın yere konulması gerektiğini söyler. {cite:muwatta-maruf-1997 s.604}"
  id: "Malik mengatakan bahwa diperbolehkan menguburkan dua atau tiga orang dalam satu kuburan karena keadaan darurat, dan kuburan yang paling besar sebaiknya diletakkan paling dekat dengan kiblat. {cite:muwatta-maruf-1997 p.604}"
