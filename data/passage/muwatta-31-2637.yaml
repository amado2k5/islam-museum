label: { ar: "الموطأ 2637 — أبو هريرة: ليس الشديد بالصرعة إنما الشديد الذي يملك نفسه عند الغضب", en: "Muwatta 2637", es: "Muwatta 2637", fr: "Muwatta 2637", ur: "موطا 2637", tr: "El-Muvatta 2637 — Ebu Hurayra: Güçlü olan, başkalarına üstünlük sağlayan değil, öfkelendiğinde kendini kontrol edebilen kişidir.", id: "Al-Muwatta 2637 — Abu Hurairah: Orang yang kuat bukanlah orang yang mengalahkan orang lain, tetapi orang yang kuat adalah orang yang mampu mengendalikan diri saat marah." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة أن رسول الله قال: ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب. ويذكر المحقق قول ابن عبد البر أن الحديث في الموطأ مرسل عند جمهور الرواة عن مالك، وأن الصحيح فيه الإيصال كما رواه أصحاب ابن شهاب. {cite:muwatta-maruf-1997 p.492} {cite:muwatta-maruf-1997 p.493}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Güçlü olan, başkalarına üstün gelen değil, öfkelendiğinde kendini kontrol edebilen kimsedir.\" Araştırmacı, İbn Abd el-Barr'ın, el-Muvatta'daki hadisin, Malik'ten rivayet eden ravilerin çoğunluğuna göre mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu ve doğru versiyonun, İbn Şihab'ın sahabeleri tarafından rivayet edildiği gibi, tam bir rivayet zincirine sahip olan hadis olduğunu belirttiğini aktarmaktadır. {cite:muwatta-maruf-1997 s.492} {cite:muwatta-maruf-1997 s.493}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Sa'id ibn al-Musayyab, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Orang yang kuat bukanlah orang yang menindas orang lain, tetapi orang yang kuat adalah orang yang mampu mengendalikan diri ketika marah.\" Peneliti menyebutkan pernyataan Ibn 'Abd al-Barr bahwa hadits dalam al-Muwatta' adalah mursal (hadits dengan rantai periwayatan yang hilang) menurut mayoritas perawi dari Malik, dan bahwa versi yang benar adalah yang memiliki rantai periwayatan lengkap, sebagaimana diriwayatkan oleh para sahabat Ibn Shihab. {cite:muwatta-maruf-1997 p.492} {cite:muwatta-maruf-1997 p.493}"
