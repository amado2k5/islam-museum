label: { ar: "الموطأ 2637 — أبو هريرة: ليس الشديد بالصرعة إنما الشديد الذي يملك نفسه عند الغضب", en: "Muwatta 2637" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة أن رسول الله قال: ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب. ويذكر المحقق قول ابن عبد البر أن الحديث في الموطأ مرسل عند جمهور الرواة عن مالك، وأن الصحيح فيه الإيصال كما رواه أصحاب ابن شهاب. {cite:muwatta-maruf-1997 p.492} {cite:muwatta-maruf-1997 p.493}"
