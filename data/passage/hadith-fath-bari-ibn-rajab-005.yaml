text: "افلة . وبنو النجار كانوا أخوال النبي الق. وقد ذكرنا سبب ذلك في كتاب ((الإيمان) في باب ((الصلاة من الإيمان)) . وكان مقصود النبي وللف أن ينتقل من العوالي إلى وسط المدينة وأن يتخذ بها مسكنا يسكنه . وفي إردافه"
