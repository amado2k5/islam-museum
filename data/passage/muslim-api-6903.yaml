label: { ar: "صحيح مسلم 6903 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 6903 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 6903 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 6903 — Menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 6903 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ دِينَارٍ، حَدَّثَنَا أَبُو قَطَنٍ، عَمْرُو بْنُ الْهَيْثَمِ الْقُطَعِيُّ عَنْ عَبْدِ الْعَزِيزِ، بْنِ عَبْدِ اللَّهِ بْنِ أَبِي سَلَمَةَ الْمَاجِشُونِ عَنْ قُدَامَةَ بْنِ مُوسَى، عَنْ أَبِي صَالِحٍ السَّمَّانِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ كَانَ رَسُولُ اللَّهِ يَقُولُ \" اللَّهُمَّ أَصْلِحْ لِي دِينِيَ الَّذِي هُوَ عِصْمَةُ أَمْرِي وَأَصْلِحْ لِي دُنْيَاىَ الَّتِي فِيهَا مَعَاشِي وَأَصْلِحْ لِي آخِرَتِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6903، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6903 (The Book Pertaining to the Remembrance of Allah, Supplication, Repentance and Seeking Forgiveness), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 6903، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 6903 (El Libro sobre el Recuerdo de Alá, la Súplica, el Arrepentimiento y la Búsqueda del Perdón), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih Muslim, n° 6903 (Livre relatif à l'invocation d'Allah, aux supplications, au repentir et à la demande de pardon), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages concernant les nations, les religions, les sectes et les peuples non musulmans."
