text: "… إِسْرَاءِيلَ إِلَّا مَا حَرَّمَ إِسْرَءِيلُ عَلَىٰ نَفْسِهِ آل عمران:، قال: إنَّ يعقوبَ أخَذَه وجعُ عِرْقِ النَّسَا، فجَعَلَ لله عليه وأقسَمَ أن لا يأكلَ من الدَّوابِّ العُروقَ كلَّها، قال: فتَتبَّعُ لذلك بَنُوه العُروقَ. - حدَّثنا الحسينُ بن الحسنِ، أخبرنا عبدُ اللّٰه …"
