text: "… فليس منهم رواه الطبرانى من رواية عبد اللّه بن ابى جعفر وعن انس عن النى. قال.لا يؤمن أحدكم حتى يحب لاخيه ما يحب لنفسه رواء البخارى ومسلم وغيرهما. ورواه ابن حبان في محيحه ولفظه لا يبلغ العبد حقيقة الايمان حتى …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 2، ص 29، يذكر حلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 2, p. 29, that mentions the sweetness and completeness of faith, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 2، ص 29 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 2, pág. 29, que menciona la dulzura y la plenitud de la fe, aquello sin lo cual la fe no está completa; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
