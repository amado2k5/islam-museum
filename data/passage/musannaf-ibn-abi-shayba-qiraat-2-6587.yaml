text: "… عن النبي الفه إن جبريل لقنه فقال: مرهم فليقرؤوه على سبعة أحرف. - ممن يُؤخذ القرآن؟ - حدثنا أبو معاوية عن الأعمش عن شقيق عن مسروق عن عبدالله بن عمرو قال: قال رسول اللّٰه وَلِيقه: خذوا القرآن من أربعة من …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 6587، يذكر الأحرف السبعة، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 6587, that mentions the seven ahruf, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
