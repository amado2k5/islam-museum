label: { ar: "موطأ مالك 1721 — الرقية، الشكوى من العلة", en: "Muwatta Malik 1721 — ruqya recited over the sick; a complaint of an ailment", ur: "موطأ مالک 1721 — رقیہ، بیماری کی شکایت", es: "Muwatta Malik 1721 — ruqya recitada sobre los enfermos; queja de una dolencia", fr: "Muwatta Malik 1721 — ruqya récitée sur les malades; une plainte relative à une affection" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ عَمْرَةَ بِنْتِ عَبْدِ الرَّحْمَنِ، أَنَّ أَبَا بَكْرٍ الصِّدِّيقَ، دَخَلَ عَلَى عَائِشَةَ وَهِيَ تَشْتَكِي وَيَهُودِيَّةٌ تَرْقِيهَا فَقَالَ أَبُو بَكْرٍ ارْقِيهَا بِكِتَابِ اللَّهِ."
summary:
  ar: "حديث في موطأ مالك، رقم 1721، يذكر الرقية، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1721 (The Evil Eye), that mentions ruqya recited over the sick, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1721، جس میں رقیہ، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1721 (El Mal de Ojo), menciona la ruqya recitada sobre los enfermos, una queja sobre una dolencia. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik n° 1721 (Le mauvais œil) mentionne la récitation de la roqya sur les malades, en lien avec une affection. Le Répertoire des ouvrages médicaux le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
