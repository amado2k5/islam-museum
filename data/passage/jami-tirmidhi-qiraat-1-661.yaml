text: "… عَلَيْهِ الْقِرَاءَةَ الّتِي سَمِعْتُ، فَقَالَ النَّبِيُّ هُكَذَا أُنْزِلَتْ. ثُمَّ قَالَ لِي النَّبِيُّ لِعِ: اقرَأْ يَا عُمَرُ. فَقَرَأْتُ القِرَاءَةَ الَّتِي أَقْرَأَنِي النَّبِيُّ عَطِيهِ، فَقَالَ النَّبِيُّ في هُكَذَا أُنْزِلَتْ، ثُمَّ قَالَ النَّبِيُّ اله : إنَّ هُذَا القُرْآنَ أُنْزِلَ عَلَى سَبْعَةٍ أَحْرُفٍ فَاقْرَأُوا …"
summary:
