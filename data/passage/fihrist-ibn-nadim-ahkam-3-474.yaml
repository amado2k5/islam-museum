text: "… الفطنة. والفرائض العشر : ترك عبادة الاصنام، ترك الكذب، ترك البخل، ترك القتل، ترك الزنا، ترك السرقة، وتعليم العلل والسحر، والقيام بهمتين، وهو الشك فى الدين والاسترخاء والتوافي فى العمل وفرض صلوات أربع أو سبع وهو أن يقوم الرجل فيمسح …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 3، ص 474، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
