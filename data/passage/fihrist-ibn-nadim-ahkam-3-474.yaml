  tr: "İbn el-Nadim'in Fihrist adlı eserinin 3. cildinin 474. sayfasından, farz olan görevleri, insanlar için farz kılınanları ve farz fiilin kendisini anlatan bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram amelleri ve küçük günahları tarayan bir kişi tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Jilid 3, halaman 474, yang menyebutkan kewajiban-kewajiban wajib dan apa yang dianjurkan bagi manusia, serta perbuatan wajib itu sendiri; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi kewajiban-kewajiban wajib, perbuatan-perbuatan ketaatan, perbuatan-perbuatan yang dianjurkan, perbuatan-perbuatan yang tidak disukai, perbuatan-perbuatan yang dilarang, dan dosa-dosa kecil."
