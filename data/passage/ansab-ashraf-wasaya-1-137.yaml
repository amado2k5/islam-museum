text: "… يدا أبي لهب. - ورُوي أن أفلح بن النضر السلمي كان سادنَ العزى. فدخل عليه أبو لهب يعوده وقد احتضر، فقال له: ياأبا عتبة، أظنّ العزّى ستضيع بعدي. فقال أبو لهب: كلًا، أنا أقوم عليها؛ فإن يظهر محمد - ولن …"
