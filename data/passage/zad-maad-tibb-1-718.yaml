text: "… في صناعة الأرواح العطرية فقط. والأمراض البلغمية، وأوجاع المعدة الباردة، والرياح الغليظة، ومن السدد إذا شرب، أو طلي به من خارج، وإذا تُبُخّر به، نفع من الزُّكَام والصداع، والشقيقة الباردة. مود: العود الهندي نوعان، أحدهما : يُستعمل في الأدوية وهو …"
