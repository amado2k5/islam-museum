text: "… سنة تسع وعشرين ومائتين وله من الكتب... ابن مجاهد آخر من انتهت اليه الرياسة بمدينة السلام فى عصر أبو بكر أحمد ابن موسى. ابن العباس بن مجاهد وكان واحد عصره غير مدافع وكان مع فضله وعلمه وديانته. ومعرفته بالقراءات وعلوم …"
