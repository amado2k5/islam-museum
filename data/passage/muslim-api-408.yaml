label: { ar: "صحيح مسلم 408 — ما فُرض على الناس", en: "Sahih Muslim 408 — what was made obligatory on people", ur: "صحیح مسلم 408 — جو لوگوں پر فرض کیا گیا", fr: "Sahih Muslim 408 — ce qui a été imposé aux gens", es: "Sahih Muslim 408 — lo que se impuso a la gente", tr: "Sahih Müslim 408 — İnsanlara zorla dayatılan şeyler", id: "Sahih Muslim 408 — Apa yang dipaksakan kepada manusia" }
text: "وَحَدَّثَنِي مُحَمَّدُ بْنُ رَافِعٍ حَدَّثَنَا عَبْدُ الرَّزَّاقِ أَخْبَرَنَا مَعْمَرٌ عَنِ الزُّهْرِيِّ بِهَذَا الإِسْنَادِ نَحْوَ حَدِيثِ يُونُسَ وَقَالَ فَأَنْزَلَ اللَّهُ تَبَارَكَ وَتَعَالَى { يَا أَيُّهَا الْمُدَّثِّرُ} إِلَى قَوْلِهِ { وَالرُّجْزَ فَاهْجُرْ} قَبْلَ أَنْ تُفْرَضَ الصَّلاَةُ - وَهِيَ الأَوْثَانُ - وَقَالَ \" فَجُثِثْتُ مِنْهُ \". كَمَا قَالَ عُقَيْلٌ"
summary:
  ar: "حديث في صحيح مسلم، رقم 408، يرد فيه ذكر ما فُرض على الناس. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 408 (The Book of Faith), whose wording mentions what was made obligatory on people. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 408، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 408, dont le texte mentionne ce qui a été imposé aux gens. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 408, cuyo texto menciona lo que se impuso a la gente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 408 numaralı hadis, insanların farz olan şeylerden bahsetmektedir. Bu hadis, diğer farz, tavsiye edilen, mekruh edilen, haram olan ve küçük günahlarla birlikte, araştırmacı tarafından derlenmiş olup Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin bu konulardaki rivayetlerinden metinler içermektedir. Araştırmacı metnin içeriğini açıklamaktadır ancak buna dayanarak dini bir hüküm vermemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 408, menyebutkan apa yang wajib dilakukan oleh manusia. Hadits ini, bersama dengan dosa-dosa wajib, anjuran, najis, dan dosa-dosa kecil lainnya, dikumpulkan oleh peneliti dan mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini. Peneliti menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
