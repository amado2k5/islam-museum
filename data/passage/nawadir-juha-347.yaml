label: { ar: "نوادر جحا الكبرى، ص 172 — «جحا والعميان»", en: "Nawadir Juha al-Kubra, p. 172 — 'Juha and the Blind Men'", ur: "نوادر جحا الکبریٰ، ص 172 — «جحا اور نابینا»", fr: "Nawadir Juha al-Kubra, p. 172 — « Juha et les aveugles »", es: "Nawadir Juha al-Kubra, p. 172 — «Juha y los ciegos»" }
text: "… جحا والعميان كان جماعة مِنَ العميان جالسين في قهوة، فمرَّ بهم الشيخ، وأخرج كيس دراهم وحرَّكه ليسمعوا صوتَ الرنين، ثُمَّ قال لهم: خُذُوا هذه الدراهم وتقاسموا ينكم. ولم يُعطهم شيئاً، وجلس بعيداً عنهم ينظر إليهم. راتعين : يرتاحون منعمين. احتجاب …"
summary:
  ar: "هزّ جحا كيس نقود أمام جماعة من العميان في مقهى وقال لهم أن يقتسموه، ولم يعطهم شيئاً، فتقاتلوا بالعصي وهو يضحك. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  en: "Juha shakes a purse of coins before a group of blind men in a coffee house and tells them to share it; he gives none; they fight each other with sticks while he laughs. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  ur: "جحا نے ایک قہوہ خانے میں نابیناؤں کی ایک جماعت کے سامنے سکوں کی تھیلی ہلائی اور کہا کہ اسے آپس میں بانٹ لو، مگر اس نے انہیں کچھ نہ دیا، تو وہ لاٹھیوں سے آپس میں لڑ پڑے اور وہ ہنستا رہا۔ {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  fr: "Juha secoue une bourse de pièces devant un groupe d'aveugles dans un café et leur dit de se la partager ; il ne leur donne rien ; ils se battent à coups de bâton pendant qu'il rit. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
  es: "Juha agita una bolsa de monedas ante un grupo de ciegos en un café y les dice que se la repartan; no les da nada; ellos se pelean a palos mientras él ríe. {cite:juha-nawadir-kubra-djuwaydi p. 172}"
