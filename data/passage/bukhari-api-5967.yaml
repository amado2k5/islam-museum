text: "… \" يَا مُعَاذُ \". قُلْتُ لَبَّيْكَ رَسُولَ اللَّهِ وَسَعْدَيْكَ. قَالَ \" هَلْ تَدْرِي مَا حَقُّ اللَّهِ عَلَى عِبَادِهِ \". قُلْتُ اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" حَقُّ اللَّهِ عَلَى عِبَادِهِ أَنْ يَعْبُدُوهُ وَلاَ يُشْرِكُوا بِهِ شَيْئًا \". ثُمَّ سَارَ سَاعَةً ثُمَّ قَالَ \" يَا مُعَاذُ بْنَ جَبَلٍ \". قُلْتُ لَبَّيْكَ رَسُولَ اللَّهِ وَسَعْدَيْكَ. فَقَالَ \" هَلْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5967، يرد فيه ذكر حق على كل مسلم. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 5967 (Dress), whose wording mentions a right due from every Muslim. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 5967، جس کے الفاظ میں ہر مسلمان پر حق کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 5967, dont le texte mentionne un droit dû par chaque musulman. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 5967, cuyo texto menciona un derecho debido por cada musulmán. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
