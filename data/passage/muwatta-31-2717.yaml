label: { ar: "الموطأ 2717 — عمرة بنت عبد الرحمن: أبو بكر يأمر اليهودية أن ترقي عائشة بكتاب الله", en: "Muwatta 2717", es: "Muwatta 2717", fr: "Muwatta 2717", ur: "موطا 2717", tr: "El-Muvatta 2717 — Umre bint Abdülrahman: Ebu Bekir, Yahudi kadına Ayşe'nin üzerine Allah'ın Kitabını okumasını emreder.", id: "Al-Muwatta 2717 — Umrah binti Abd al-Rahman: Abu Bakr memerintahkan wanita Yahudi itu untuk membacakan Kitab Allah kepada Aisyah" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن أن أبا بكر الصديق دخل على عائشة وهي تشتكي، واليهودية ترقيها، فقال أبو بكر: ارقيها بكتاب الله. {cite:muwatta-maruf-1997 p.532}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Amrah bint Abdülrahman'dan rivayet ettiğine göre, Ebu Bekir es-Siddik, Aişe şikayet ederken onun yanına girdi ve bir Yahudi kadın onun üzerine büyüler okuyordu. Ebu Bekir, \"Onun üzerine Allah'ın Kitabı'nı kullanarak büyüler okuyun\" dedi. {cite:muwatta-maruf-1997 s.532}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari 'Amrah bint 'Abd al-Rahman, bahwa Abu Bakr al-Siddiq masuk menemui 'Aisyah ketika ia sedang mengeluh, dan seorang wanita Yahudi sedang membacakan mantra untuknya. Abu Bakr berkata: \"Bacakan mantra untuknya dengan menggunakan Kitab Allah.\" {cite:muwatta-maruf-1997 p.532}"
