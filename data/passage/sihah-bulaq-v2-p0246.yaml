text: |-
  • ⁦(ياب الميم)⁩,،
  ٣٤١
  وانتم اللّه منه أى عاقبه والاسم منه النقمة والجمع نملت ونقم مثل كلة وكلمات وكلم وان شئت
  كنت القاف ونقلت ركتها الى النون فقات نقمة وابمع نقم مثل نعمة ونعهم وفلان ميمون"
  انقيمة وهوابدال النقيبة وناقم لقب عامر بن سعدين عدىً بن حدّان بن جديلة والناقية
  هى رقاش بنت عامر قال سعد بن زيدمناة بن تميم
  لقد كنت أهوى الناقية حقبة * فقد جعلت آسان وصل تقطع
  غ م م الحديث يفه وينفه غااى قته والاسم الثميمة والرجل ثمّ وغام أى قتات والتمام
  بت طيب الرائعة والخيمة أيضا الهمس والحركة ومنه قولهم أسكت اللّٰه نامته أى ما يتم
  عليه من وكتموقديه مز فيجعل من النقيم وقول أبى ذؤيب
  وغيمسة من قانص متلبب • فى كفه جسْ.أجس وأقطع
  قال الإصمعى أراديه صوت وتر أوريحا استروحته الجر وأنكروهماهما من قائص قال لاته
  أشت ختلا فى القنيص من أن يهمهم للوحشىّ ألاترى الى قول رؤية
  فى الزرب لويضغ شريا مابصق • وغنم الشى غيمسة أى رقشه وزخرفه وثوب منهم أى موشى
  ومنه قيل للبياض الذى يكون على أظفار الاحداث غمة بالكسر والنمى بالضم الفلس
  بالرومية وقال أبو عبيدهو الدرهم الذى فيه وصاص أونحاس قال النابغة يصدف فرسا
  وقاروت وهي لم تجرب وباع لها • من الفصافص بالمى فسير
  الواحدة غية ومابهاغى أى مابها أحد ⁦(نوم)⁩ النوم معروف وقدنام ينام فهوظائم
  والجمع يسام وجمع النائم نوم على الأصل ونيم على اللفظ وتقول غت وأصله نومت بكسر الواو
  فل اسكنت سقطت لاجتماع الساكنين ونقلت حوكتها الى ما قبلها وكان حق النون أن تضم
  اتدل على الواوالساقطسة كماذءمت القياف فى قلت الاأنه-م كسر وهاللفرق بين المضموم
  والمفتوح وأما كلت فانما كسر وها لتدلة على الياء الساقطة وأما على مذهب المكسائة
  فالقياس مستمرلانه يقول أصل قال قول بضم الواووأصل كال سكيل بكسر الياء والامر
  مه تم بفتح النون بناء على المستقبل لانّ الواوالمنقلية ألفاسة طت لاحتماع الساكنين ويقإل
  يا نومان للكثير النوم ولا ققل رجل نومان لانه يختص بالنداه وأغته ونومته بمعق وأخذه نوام
  بالضم اذا جعل النوم يعتريه وتناوم أرى من نفسه أنه نائم وليس به ونت الرجل بالضم اذك
  فليت مبالنوم لانك تقول ناومه فنامه ينومه وزامت السوق كسدت ونام الثوب أخلق
  واستنام اليه أى سكن اليه واطمأنّ ورحل نومة بالضم ساكنة الواوأى لايوْبه له ورجل
  نومة بفتح الواوأى نوْم وهو إلمكثير النوم وانه لحن النيمة بالكسر والمنامة ثوبه
  ينام فيه وهو القطيقة قال الكميت
  عليه المنامة ذات الفضول • من الوهن والقرطف الخمل
  وقال آخر• لكل منامة هدب أصير • أى متقارب ور بماسموا الدكان مناعة وليل ناتم
  أى ينام فيه كقواهم يوم عاصف وهم ناصب وهوفاعل بمعسى مقعول فيه ( م
  النهمة بلوغ الهمة في الشى وقدم-م بكذافهو منهوم أى مولع به وفى الحديث منهومان
  لا يشبعان منهوم بالمال ومنهوم بالعلم ونهم ينهم بالمكسرنهي الغة فى نحم ينحم أى زحِر
  A٦
