label: { ar: "نوادر جحا الكبرى، ص 35 — «البغلة عسراوية»", en: "Nawadir Juha al-Kubra, p. 35 — 'The Mule Is Left-Handed'", ur: "نوادر جحا الکبریٰ، ص 35 — «خچر بائیں ہاتھ والی ہے»", fr: "Nawadir Juha al-Kubra, p. 35 — « La mule est gauchère »", es: "Nawadir Juha al-Kubra, p. 35 — «La mula es zurda»" }
text: "… البغلة عسراوية ان مسافرا مَعَ جماعةٍ، ونزلوا للراحةِ في مكان، ثمَّ أرادوا استئناف لسفر، فطلبَ بغلتَهُ فأحْضِرَتْ لَهُ، فوضعَ رجلَهُ اليمنى في الركاب وقفز فجاء ركوبُهُ مقلوباً، فضحِكَ مَنْ رآه، فقال لهم: أنا لم أركب بالمقلوب ولكنَّ البغلةَ عسراوية."
summary:
  ar: "ركب جحا البغلة من جانبها الخطأ فضحك الناس، فقال إنه لم يركب معكوسًا وإن البغلة عسراء فحسب. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  en: "Juha mounts the mule from the wrong side and, laughed at, says that he did not ride backwards; the mule is simply left-handed. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  ur: "جحا غلط طرف سے خچر پر سوار ہوا اور لوگ ہنسے، تو اس نے کہا کہ میں الٹا سوار نہیں ہوا، خچر ہی بائیں ہاتھ والی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  fr: "Juha monte la mule du mauvais côté et, comme on se moque de lui, dit qu'il n'a pas monté à l'envers : la mule est simplement gauchère. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  es: "Juha monta la mula por el lado equivocado y, ante las risas, dice que no montó al revés; la mula es simplemente zurda. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
