  tr: "İbn el-Nadim'in Fihrist adlı eserinin 2. cildinin 510. sayfasından, farz olan amelleri ve görevleri anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikası gereği yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Jilid 2, halaman 510, yang menyebutkan amalan dan kewajiban wajib; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
