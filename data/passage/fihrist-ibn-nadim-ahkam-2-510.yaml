text: "… وتعالى وبناء العالم والحروب التى كانت بين النور والظلمة ابتداء التناسل على مذهب ماتى • صفة أرض النور وأرض الظلمة كيف ينبغى للانسان أن يدخل فى الدين العريعة التى جاء بها مانى والفرائض التى فرضها اختلاف المانوية فى الامامة بعد …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 2، ص 510، يرد فيه ذكر الفريضة والفرائض، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 2, p. 510, whose wording mentions the obligation (farida), the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 2، ص 510 کا اقتباس جس میں فریضہ اور فرائض، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
