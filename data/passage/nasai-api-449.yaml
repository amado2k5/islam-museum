label: { ar: "سنن النسائي 449 — ما فرضه الله ورسوله، ما فُرض على الناس", en: "Sunan al-Nasa'i 449 — what God and His Messenger made obligatory; what was made obligatory on people", ur: "سنن نسائی 449 — جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا", fr: "Sunan al-Nasa'i 449 — ce que Dieu et Son Messager ont rendu obligatoire ; ce qui a été imposé aux gens", es: "Sunan al-Nasa'i 449 — lo que Dios y Su Mensajero hicieron obligatorio; lo que se impuso a la gente", tr: "Sunan an-Nasa'i 449 — Allah ve Resulü'nün farz kıldığı, insanlar için farz kılınan şey.", id: "Sunan an-Nasa'i 449 — Apa yang telah ditetapkan oleh Allah dan Rasul-Nya, apa yang telah ditetapkan untuk manusia." }
text: "… يُونُسُ، عَنِ ابْنِ شِهَابٍ، قَالَ أَنَسُ بْنُ مَالِكٍ وَابْنُ حَزْمٍ قَالَ رَسُولُ اللَّهِ \" فَرَضَ اللَّهُ عَزَّ وَجَلَّ عَلَى أُمَّتِي خَمْسِينَ صَلاَةً فَرَجَعْتُ بِذَلِكَ حَتَّى أَمُرَّ بِمُوسَى فَقَالَ مَا فَرَضَ رَبُّكَ عَلَى أُمَّتِكَ قُلْتُ فَرَضَ عَلَيْهِمْ خَمْسِينَ صَلاَةً. قَالَ لِي مُوسَى فَرَاجِعْ رَبَّكَ عَزَّ وَجَلَّ فَإِنَّ أُمَّتَكَ لاَ تُطِيقُ ذَلِكَ. فَرَاجَعْتُ رَبِّي عَزَّ وَجَلَّ فَوَضَعَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 449، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 449 (The Book of Salah), whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 449، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 449, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 449, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de yer alan 449 numaralı hadis, Allah ve Resulü'nün farz kıldığı ve insanların farz kıldığı şeylerden bahsetmektedir. Yazar bu hadisi, Kur'an, Sünnet, Peygamber'in biyografisi, Sahabeler ve onların haleflerinden rivayetler ve diğer ilgili metinlerle birlikte derlemiştir. Yazar hadisin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 449, menyebutkan apa yang telah diwajibkan oleh Allah dan Rasul-Nya, dan apa yang diwajibkan bagi manusia. Penulis menyusun hadits ini, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, serta teks-teks relevan lainnya. Penulis menjelaskan isi hadits tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan hadits tersebut."
