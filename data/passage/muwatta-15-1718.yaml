label: { ar: "الموطأ 1718 — ابن شهاب عن سعيد وحميد وعبيد الله وسليمان، عن أبي هريرة عن عمر بن الخطاب: المرأة التي طلقها زوجها تطليقة أو تطليقتين، ثم تنكح زوجا غيره ثم يطلقها أو يموت عنها، ثم ينكحها الأول، تكون عنده على ما بقي من طلاقها", en: "Muwatta 1718" }
summary:
  ar: "يروي مالك عن ابن شهاب أنه قال سمعت سعيد بن المسيب وحميد بن عبد الرحمن بن عوف وعبيد الله بن عبد الله بن عتبة وسليمان بن يسار، كلهم يقول سمعت أبا هريرة يقول سمعت عمر بن الخطاب يقول أيما امرأة طلقها زوجها تطليقة أو تطليقتين، ثم تركها حتى تحل وتنكح زوجا غيره، فيموت عنها أو يطلقها، ثم ينكحها زوجها الأول، فإنها تكون عنده على ما بقي من طلاقها. قال مالك وعلى ذلك السنة عندنا التي لا اختلاف فيها. {cite:muwatta-maruf-1997 p.101}"
