label: { ar: "الموطأ 1718 — ابن شهاب عن سعيد وحميد وعبيد الله وسليمان، عن أبي هريرة عن عمر بن الخطاب: المرأة التي طلقها زوجها تطليقة أو تطليقتين، ثم تنكح زوجا غيره ثم يطلقها أو يموت عنها، ثم ينكحها الأول، تكون عنده على ما بقي من طلاقها", en: "Muwatta 1718", es: "Muwatta 1718", fr: "Muwatta 1718", ur: "موطا 1718", tr: "El-Muvatta 1718 — İbn Şihab, Said, Hamid, Ubeydullah ve Süleyman'dan, onlar da Ebu Hurayra'dan, onlar da Ömer ibn el-Hattab'dan rivayetle: Kocası tarafından bir veya iki kez boşanan, sonra başka bir adamla evlenen, o adam da boşanan veya ölen, daha sonra ilk kocasıyla tekrar evlenen kadın, kalan boşanmalarla birlikte onunla kalır.", id: "Al-Muwatta 1718 — Ibn Shihab, berdasarkan riwayat Saeed, Hameed, Ubaidullah, dan Sulaiman, berdasarkan riwayat Abu Hurairah, berdasarkan riwayat Umar ibn al-Khattab: Seorang wanita yang suaminya menceraikannya satu atau dua kali, kemudian ia menikah dengan pria lain yang kemudian menceraikannya atau meninggal, lalu suami pertamanya menikahinya lagi, dan tetap bersamanya dengan sisa perceraian tersebut." }
summary:
  ar: "يروي مالك عن ابن شهاب أنه قال سمعت سعيد بن المسيب وحميد بن عبد الرحمن بن عوف وعبيد الله بن عبد الله بن عتبة وسليمان بن يسار، كلهم يقول سمعت أبا هريرة يقول سمعت عمر بن الخطاب يقول أيما امرأة طلقها زوجها تطليقة أو تطليقتين، ثم تركها حتى تحل وتنكح زوجا غيره، فيموت عنها أو يطلقها، ثم ينكحها زوجها الأول، فإنها تكون عنده على ما بقي من طلاقها. قال مالك وعلى ذلك السنة عندنا التي لا اختلاف فيها. {cite:muwatta-maruf-1997 p.101}"
  tr: "Malik, İbn Şihab'dan rivayetle şöyle buyurduğunu aktarır: \"Sa'id ibn al-Musayyab, Humayd ibn 'Abd al-Rahman ibn 'Awf, 'Ubayd Allah ibn 'Abd Allah ibn 'Utbah ve Sulayman ibn Yasar'ın hepsinin şöyle dediğini işittim: Ebu Hurayra'nın şöyle dediğini işittim: Ömer ibn al-Hattab'ın şöyle dediğini işittim: Bir kadın kocası tarafından bir veya iki kez boşandıktan sonra, kocası onu yeniden evlenmeye uygun hale gelene kadar terk eder ve başka bir adamla evlenirse, sonra ölür veya boşarsa ve daha sonra ilk kocası onunla tekrar evlenirse, kadın kalan boşanmalarla birlikte onunla kalır.\" Malik dedi ki: \"Bu, aramızda yerleşik sünnettir ve bu konuda hiçbir ihtilaf yoktur.\" {cite:muwatta-maruf-1997 s.101}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia berkata: Aku mendengar Sa'id ibn al-Musayyab, Humayd ibn 'Abd al-Rahman ibn 'Awf, 'Ubayd Allah ibn 'Abd Allah ibn 'Utbah, dan Sulayman ibn Yasar, semuanya berkata: Aku mendengar Abu Hurayrah berkata: Aku mendengar Umar ibn al-Khattab berkata: Jika seorang wanita diceraikan oleh suaminya sekali atau dua kali, kemudian suaminya meninggalkannya sampai ia layak menikah lagi dan menikah dengan pria lain, lalu ia meninggal atau menceraikannya, kemudian suami pertamanya menikahinya lagi, maka ia tetap bersamanya dengan sisa perceraian yang masih berlaku. Malik berkata: Ini adalah Sunnah yang telah ditetapkan di antara kami, yang tidak ada perselisihan tentangnya. {cite:muwatta-maruf-1997 p.101}"
