label: { ar: "سنن أبي داود 4027 — أثر من الآثار المحفوظة", en: "Sunan Abi Dawud 4027 — a relic kept after its owner", ur: "سنن ابی داؤد 4027 — محفوظ آثار و تبرکات", es: "Sunan Abi Dawud 4027 — una reliquia conservada después de su dueño.", fr: "Sunan Abi Dawud 4027 — une relique conservée après son propriétaire", tr: "Sünen Ebi Davud 4027 — Korunmuş bir hadis", id: "Sunan Abi Dawud 4027 — Sebuah hadits yang dilestarikan" }
text: "حَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ الْحَنْظَلِيُّ، حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، عَنْ أَبِيهِ، عَنْ بُدَيْلِ بْنِ مَيْسَرَةَ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَسْمَاءَ بِنْتِ يَزِيدَ، قَالَتْ كَانَتْ يَدُ كُمِّ قَمِيصِ رَسُولِ اللَّهِ إِلَى الرُّصْغِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4027، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4027 (Clothing (Kitab Al-Libas)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4027، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4027 (Vestimenta (Kitab Al-Libas)), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4027 (Vêtements (Kitab Al-Libas)), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 4027 numaralı hadiste, günümüze kadar korunmuş bir rivayetten bahsedilmektedir. Bu hadis, vasiyetnameler, miras, gelenekler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4027, menyebutkan sebuah tradisi yang lestari. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, tradisi, dan makam suci, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
