text: |-
  * ⁦(باب اللام)⁩
  ١٤٩
  عصلحة الابل وفلان من آبل الناس أى من أشدهم تأنقافى رعية الابل وأعلمهم بها ورجنى
  ابلىّ بفتح الباء أى صاحب ابل وأبل الرجل أى اتخذ ابلا واقتناها وقال حيد بن ثور
  فأبل واسترخى به الخطب بعدما • أساف ولولا معينا لم يؤبل
  وأبلت الابل أى اقتنيت فهى مأبولة وفلان لا يأتبل أى لا يثبت على الابل اذاركبها وكذلك
  اذ الم يقسم عليها فيما يصلحها عن أبى عبيد والابلة بالتحريك الوخامة والثقل من الطعام وفى
  لحديث كل مال أديت ز كانه فقد ذهبت أبلته وأصب له وبلته من الوبال فابدل بالوا و الالف
  كقواهم أحد وأصله وحد والابالة بالسكسر الحزمة من الحطب وفى المذل ضغث على ابالة أى
  بلية على آخرى كانت قبلها ولا تقل ايسالة لانّ الاسم اذا كان على فعالة بالها لا يسدل من
  أخدر فى تضعيفه ياء مثل صنارة ودنامة وانما يبدل اذا كان بلاها مشل دينار وقيراط
  وبعضهم يقول ابالة مخففا وينشد ( ٢
  لى كل يوم من ذواله * ضغت يزيد على اباله
  والابلة بالضم وتشديد اللام الفدرة من التمر وأنشدابن السكيت ٣
  فيأ كل مارس من زادنا * ويأب الابلة لم ترضض
  والابلة أيضامديبة الى جنب البصرة والابيل راهب النصارى قال عدى بن زيد
  انى واللّه فاقبل حلقى ، بأبيل كلما هلى جأر
  وكانوايسمون عيسى عليه السلام أبيل الابيلين قان الشاعر ٤
  أماودماء مائرات تخالها * على قنة العزى وبالنسر عندما.
  وماسبح الرهبان فى كل بيعة * أبيل الابيلين المسيح بن مريا
  لقد ذاق منا عامر يوم لعلع • حساما اذا ماهزبالسكف صمما
  أ ل تل الرجل يأتل اتلانا اذا مشى وقارب خطوه كانه غضبات وأنشد الفرّاء
  أرانى لا آتيك الاكأنما • أسأت والا أنت غضبان تأقل
  نل الاثل شجر وهو نوع من الطرفاء الواحدة أثلة وابهع أثلات وفى كلام بيهس
  الملقب بنعامة ل-كن بالاثلات لحم لا يظلل يعنى لحم اخوته القتلى ومنه قيل للاصل أثلة
  يقال فلان يندت أثلثنا اذا قال فى حسبه قبيها قال الاعشى
  ألست منتهياعن نحت أثلتنا • واست ضارهاما أطت الابل
  والتأثيل التأصيل يقال مجدم ؤثل وأثيل قال امر والقيس
  ولكنما أسعى لجد مؤثل وقديدرك المجد المؤثل أهثالى
  ومال.ؤثل والتأثل اتخاذ أصل مال وفى الحديث فى وحىّ اليتيم انه يأكل من ماله غير
  متأثل مالا والاثال بالفتح المجد وأثال بالضم اسم جبسل ومنه سحى الرجل أثالا وربما قالوا
  تأثلت بثرا أى حخرتها قال أبوذؤيب
  وقد أرسلوا فراطهم فتأثلوا • قليباسفاها كالاماء البقواعد
  جل لاجل مدّة الذى ويقال فعلت ذاك من اجلك ومن اجلك بفتح الهمزة وكسرها
  ومن أجلال أى من جراك والاجل أيضا بالكسر القطيع من بقر الوحبْر والجمع الآجال
  ٢٨
  مصاح
  نى
  قوله خيد بن تورف بعض الفسخ
  يدله طفيل وليحزر اه
  ٢ فسخة زيادة لاسماء بن
  خارجة اه
  الملم ا
  ٤ ى تسخة زيادة خيدين
  نور ١
  قوله -فاها السفا التراب والهاء
  للتليب قاله المؤنف
