work: work/kitab-al-maghazi
ref: "633"
label: { ar: "غزوة خيبر — مرافقة النساء مع الجيش", en: "Battle of Khaybar — the women who accompanied the army" }
text: "خرج مع رسول الله من المدينة عشرون امرأة: أم سلمة زوجته، وصفية بنت عبد المطلب، وأم أيمن"
summary:
  ar: "في غزوة خيبر، يذكر الواقدي خروج عشرين امرأة مع الجيش، على رأسهن أم سلمة زوج النبي وصفية بنت عبد المطلب خالة النبي وأم أيمن مولاة النبي، وامرأة عاصم بن عدي، وأم عمارة نسيبة بنت كعب. وتروي الصفحة استشهاد أسماء بنت عميس زوجة جعفر بن أبي طالب، وخبر صفية وعلي في باب فتح خيبر."
  en: "At Khaybar Waqidi lists twenty women who went out with the army, led by Umm Salama, Safiyya bint Abd al-Muttalib (the Prophet's aunt) and Umm Ayman his freedwoman, among them Asma' bint Umays the wife of Ja'far ibn Abi Talib and Umm 'Umara Nusayba bint Ka'b. The same chapter reports Asma' bint Umays's martyrdom and Safiyya's and Ali's role in taking Khaybar."
