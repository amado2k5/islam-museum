label: { ar: "غزوة خيبر — مرافقة النساء مع الجيش", en: "Battle of Khaybar — the women who accompanied the army", es: "Batalla de Khaybar: las mujeres que acompañaron al ejército.", fr: "Bataille de Khaybar — les femmes qui accompagnaient l'armée", ur: "خیبر کی جنگ - وہ خواتین جو فوج کے ساتھ تھیں۔", tr: "Hayber Muharebesi — Orduya eşlik eden kadınlar", id: "Pertempuran Khaybar — Wanita yang menyertai pasukan" }
text: "خرج مع رسول الله من المدينة عشرون امرأة: أم سلمة زوجته، وصفية بنت عبد المطلب، وأم أيمن"
summary:
  ar: "في غزوة خيبر، يذكر الواقدي خروج عشرين امرأة مع الجيش، على رأسهن أم سلمة زوج النبي وصفية بنت عبد المطلب خالة النبي وأم أيمن مولاة النبي، وامرأة عاصم بن عدي، وأم عمارة نسيبة بنت كعب. وتروي الصفحة استشهاد أسماء بنت عميس زوجة جعفر بن أبي طالب، وخبر صفية وعلي في باب فتح خيبر."
  en: "At Khaybar Waqidi lists twenty women who went out with the army, led by Umm Salama, Safiyya bint Abd al-Muttalib (the Prophet's aunt) and Umm Ayman his freedwoman, among them Asma' bint Umays the wife of Ja'far ibn Abi Talib and Umm 'Umara Nusayba bint Ka'b. The same chapter reports Asma' bint Umays's martyrdom and Safiyya's and Ali's role in taking Khaybar."
  es: "En Khaybar, Waqidi enumera a veinte mujeres que salieron con el ejército, lideradas por Umm Salama, Safiyya bint Abd al-Muttalib (la tía del Profeta) y Umm Ayman, su mujer liberada; entre ellas se encontraban Asma' bint Umays, esposa de Ja'far ibn Abi Talib, y Umm 'Umara Nusayba bint Ka'b. El mismo capítulo relata el martirio de Asma' bint Umays y el papel de Safiyya y Ali en la toma de Khaybar."
  fr: "À Khaybar, Waqidi mentionne vingt femmes qui accompagnèrent l'armée, menées par Umm Salama, Safiyya bint Abd al-Muttalib (la tante du Prophète) et Umm Ayman, son affranchie. Parmi elles figuraient Asma' bint Umays, épouse de Ja'far ibn Abi Talib, et Umm 'Umara Nusayba bint Ka'b. Le même chapitre relate le martyre d'Asma' bint Umays ainsi que le rôle de Safiyya et d'Ali dans la prise de Khaybar."
  ur: "خیبر واقدی میں بیس عورتوں کی فہرست ہے جو ام سلمہ کی قیادت میں لشکر کے ساتھ نکلیں، صفیہ بنت عبدالمطلب ⁦(نبی کی خالہ)⁩ اور ام ایمن ان کی آزاد عورت، ان میں اسماء بنت عمیس زوجہ جعفر بن ابی طالب اور ام عمارہ کعبہ ا ہیں۔ اسی باب میں اسماء بنت عمیس کی شہادت اور خیبر پر قبضہ کرنے میں صفیہ اور علی کے کردار کی خبر دی گئی ہے۔"
  tr: "Hayber Muharebesi anlatımında el-Vakidi, orduya yirmi kadının eşlik ettiğini belirtir; bunlar arasında Peygamberin eşi Ümmü Seleme; Peygamberin teyzesi Safiyye bint Abdülmuttalib; Peygamberin azatlı kölesi Ümmü Ayman; Asim ibn Adi'nin eşi ve Ümmü Ammara, Nusayba bint Ka'b bulunur. Sayfada ayrıca Cafer ibn Ebu Talib'in eşi Asma bint Umays'ın şehadeti ve Hayber'in fethi bölümünde Safiyye ve Ali'nin hikayesi de anlatılır."
  id: "Dalam catatan tentang Pertempuran Khaybar, al-Waqidi menyebutkan bahwa dua puluh wanita menyertai pasukan, termasuk Umm Salama, istri Nabi; Safiyya bint Abd al-Muttalib, bibi Nabi; Umm Ayman, budak Nabi yang dibebaskan; istri Asim ibn Adi; dan Umm Ammara, Nusayba bint Ka'b. Halaman tersebut juga menceritakan kemartiran Asma bint Umays, istri Ja'far ibn Abi Talib, dan kisah Safiyya dan Ali dalam bab tentang penaklukan Khaybar."
