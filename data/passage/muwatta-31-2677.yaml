label: { ar: "الموطأ 2677 — أبو المثنى الجهني: مروان يسأل أبا سعيد عن النهي عن النفخ في الشراب", en: "Muwatta 2677" }
summary:
  ar: "يروي مالك عن أيوب بن حبيب مولى سعد بن أبي وقاص عن أبي المثنى الجهني أنه كان عند مروان بن الحكم، فدخل عليه أبو سعيد الخدري، فقال له مروان: أسمعت من رسول الله أنه نهى عن النفخ في الشراب؟ فقال أبو سعيد: نعم. فقال رجل: يا رسول الله، إني لا أروى من نفس واحد. فقال له النبي: فأبن القدح عن فيك ثم تنفس. قال: فإني أرى القذاة فيه. قال: فأهرقها. {cite:muwatta-maruf-1997 p.512} {cite:muwatta-maruf-1997 p.513}"
