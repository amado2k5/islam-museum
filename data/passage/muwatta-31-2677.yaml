label: { ar: "الموطأ 2677 — أبو المثنى الجهني: مروان يسأل أبا سعيد عن النهي عن النفخ في الشراب", en: "Muwatta 2677", es: "Muwatta 2677", fr: "Muwatta 2677", ur: "موطا 2677", tr: "Al-Muwatta 2677 — Abu al-Muthanna al-Juhani: Mervan, Ebu Saeed'e içeceklere üflemenin yasağını soruyor", id: "Al-Muwatta 2677 — Abu al-Muthanna al-Juhani: Marwan bertanya kepada Abu Saeed tentang larangan meniup minuman" }
summary:
  ar: "يروي مالك عن أيوب بن حبيب مولى سعد بن أبي وقاص عن أبي المثنى الجهني أنه كان عند مروان بن الحكم، فدخل عليه أبو سعيد الخدري، فقال له مروان: أسمعت من رسول الله أنه نهى عن النفخ في الشراب؟ فقال أبو سعيد: نعم. فقال رجل: يا رسول الله، إني لا أروى من نفس واحد. فقال له النبي: فأبن القدح عن فيك ثم تنفس. قال: فإني أرى القذاة فيه. قال: فأهرقها. {cite:muwatta-maruf-1997 p.512} {cite:muwatta-maruf-1997 p.513}"
  tr: "Malik, Sa'd ibn Abi Waqqas'ın azatlı kölesi Ayyub ibn Habib'den, o da Ebu el-Muthanna el-Cuhani'den rivayet ettiğine göre, Mervan ibn el-Hakam ile birlikteyken Ebu Sa'id el-Hudri içeri girdi. Mervan ona, \"Allah'ın Resulü'nden içeceklere üflemeyi yasakladığını duydun mu?\" diye sordu. Ebu Sa'id, \"Evet\" diye cevap verdi. Bir adam, \"Ey Allah'ın Resulü, tek bir nefesle susuzluğumu gideremem\" dedi. Peygamber ona, \"Öyleyse bardağı ağzından kaldır ve üfle\" dedi. Adam, \"Ama içinde bir toz zerresi görüyorum\" dedi. Peygamber, \"Öyleyse dök\" dedi. {cite:muwatta-maruf-1997 s.512} {cite:muwatta-maruf-1997 s.513}"
  id: "Malik meriwayatkan dari Ayyub ibn Habib, budak yang dibebaskan oleh Sa'd ibn Abi Waqqas, dari Abu al-Muthanna al-Juhani, bahwa ia bersama Marwan ibn al-Hakam ketika Abu Sa'id al-Khudri masuk. Marwan bertanya kepadanya, \"Apakah kamu mendengar dari Rasulullah bahwa beliau melarang meniup minuman?\" Abu Sa'id menjawab, \"Ya.\" Seorang pria berkata, \"Wahai Rasulullah, aku tidak dapat menghilangkan dahagaku hanya dengan satu hembusan napas.\" Nabi berkata kepadanya, \"Kalau begitu, angkat cangkir dari mulutmu dan hembuskan napas.\" Pria itu berkata, \"Tapi aku melihat setitik debu di dalamnya.\" Nabi berkata, \"Kalau begitu, tuangkanlah.\" {cite:muwatta-maruf-1997 p.512} {cite:muwatta-maruf-1997 p.513}"
