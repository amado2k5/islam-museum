text: "… بكتابه، وَبَيِّنَ كيفَ هُو على لسان نبيهِ. مثلُ عدد الصلاة والزكاة ووقتها، وغيرِ ذلك من فرائضه التى أَنْزَلَ من كتابه. - ومنه : ماسَنّ رسولُ الله مما ليس الله فيه نَص حكمٍ، وقد فرضَ اللّٰه فى كتابه طاعةَ رسولِه والاتهاء …"
summary:
