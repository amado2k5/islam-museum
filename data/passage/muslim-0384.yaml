label: { ar: "مسلم 384 — من صلى علي صلاة صلى الله عليه بها عشراً وسألوا لي الوسيلة", en: "Muslim 384 — Whoever sends one prayer on me, God sends ten; ask for me the wasila" }
text: "قال رسول الله: «إذا سمعتم المؤذن فقولوا مثل ما يقول، ثم صلوا علي؛ فإنه من صلى علي صلاة صلى الله عليه بها عشراً، ثم سلوا الله لي الوسيلة؛ فإنها منزلة في الجنة لا تنبغي إلا لعبد من عباد الله، وأرجو أن أكون أنا هو»"
summary:
  ar: "رواية عبد الله بن عمرو بن العاص في باب النداء إلى الصلاة من صحيح مسلم؛ يجمع الرد على المؤذن والصلاة على النبي وسؤال الوسيلة — أصل دعاء ما بعد الأذان."
