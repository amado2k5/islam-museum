text: "مَا عَهِدَ إِلَىَّ رَسُولُ اللَّهِ صلى الله عليه وسلم عَهْدًا لَمْ يَعْهَدْهُ إِلَى النَّاسِ غَيْرَ أَنَّ فِي قِرَابِ سَيْفِي صَحِيفَةً فَإِذَا فِيهَا ‏ \"‏ الْمُؤْمِنُونَ تَتَكَافَأُ دِمَاؤُهُمْ يَسْعَى بِذِمَّتِهِمْ أَدْنَاهُمْ لاَ يُقْتَلُ مُؤْمِنٌ بِكَافِرٍ وَلاَ ذُو عَهْدٍ فِي عَهْدِهِ ‏\"‏ ‏.‏ مُخْتَصَرٌ ‏.‏"
summary:
  ar: "في السنن النسائي؛ ذكر كتابة كتاب أو إرساله."
  en: "In Sunan al-Nasa'i; mention of writing or dispatching a letter."
  ur: "سنن النسائی میں؛ خط لکھنے یا بھیجنے کا ذکر."
