text: "وَكَذَٰلِكَ جَعَلْنَا فِى كُلِّ قَرْيَةٍ أَكَـٰبِرَ مُجْرِمِيهَا لِيَمْكُرُوا۟ فِيهَا ۖ وَمَا يَمْكُرُونَ إِلَّا بِأَنفُسِهِمْ وَمَا يَشْعُرُونَ"
text_search: "وكذلك جعلنا في كل قرية أكابر مجرميها ليمكروا فيها ۖ وما يمكرون إلا بأنفسهم وما يشعرون"
translations:
  en: { text: "And thus have We made in every city great ones of its wicked ones, that they should plot therein. They do but plot against themselves, though they perceive not.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور اسی طرح ہم نے ہر بستی میں بڑے بڑے مجرم پیدا کئے کہ ان میں مکاریاں کرتے رہیں اور جو مکاریاں یہ کرتے ہیں ان کا نقصان انہیں کو ہے اور (اس سے) بےخبر ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
