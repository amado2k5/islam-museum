text: "… امرأته من حج الفريضة، لأنها عبادة وجبت عليها، ولا طاعة لمخلوق في معصية الخالق ولها أن تعجل به لتبرىء ذمتها، كما لها أن تصلي أول الوقت، وليس له منعها، ويليق به الحج المنذور، لأنه واجب عليها كحجة الإسلام. وأما حج …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 640، يرد فيه ذكر الفريضة والفرائض، والواجب، وما يجب على المكلف، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 640, whose wording mentions the obligation (farida), the obligatory (wajib), what is binding on the person addressed, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 640 کا اقتباس جس میں فریضہ اور فرائض، واجب، جو مکلف پر واجب ہے، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 4, p. 640, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), ce qui s'impose à la personne responsable, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 4, p. 640, cuyo texto menciona la obligación (farida), lo obligatorio (wajib), lo que obliga a la persona responsable, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 4. cildinin 640. sayfasından bir alıntı, farz olan fiilleri, görevleri, yasal olarak sorumlu bir kişiden beklenenleri ve itaat amellerini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat amelleri, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 4, halaman 640, membahas tentang amalan wajib, kewajiban, apa yang dituntut dari orang yang bertanggung jawab secara hukum, dan amalan ketaatan. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus mengoleksi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
