label: { ar: "الموطأ 1904 — مالك: الأمر المجتمع عليه أن الجمل بالجمل مثله وزيادة دراهم جائز يدا بيد، والجمل بالجمل والدراهم إلى أجل، لا خير في الدراهم إلى أجل مع الجمل نقدا", en: "Muwatta 1904" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أنه لا بأس بالجمل بالجمل مثله، وزيادة دراهم، يدا بيد. ولا بأس بالجمل بالجمل مثله، وزيادة دراهم، الجمل بالجمل يدا بيد، والدراهم إلى أجل. قال: ولا خير في الجمل بالجمل مثله، وزيادة دراهم، الدراهم نقدا والجمل إلى أجل. وإن أخرت الجمل والدراهم، فلا خير في ذلك أيضا. {cite:muwatta-maruf-1997 p.181}"
