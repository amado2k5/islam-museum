text: "… فيما أقبل من بدن جعفر ما بين منكبيه تسعين ضربة ما بين طعنة برمح وضربة بسيف. وعن أنس بن مالك أن الني واي نعى جعفراً وزيداً. نعاهما قبل أن يجيء خيرهما وعيناه تذرفان أخرجه أحمد فى المسند،. أخرجه ابن ماجه، …"
