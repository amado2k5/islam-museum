text: "… الأرْبَعَة الأقلام من القَلَمِ الجَليل وهو أبو الأقْلام. ومن غَيْرْ خَطًّا ابْن ثَوَابَة لم يَزَل النَّاسُ يَكْتُبُون على مِثَالِ الخَطَّ القَدِيم الذي ذَكَرْنَاهُ إلى أوَّلِ الدَّوْلَةِ العَبَّاسيَّة، فحين ظَهَرَ الهاشِمِيُون اخْتَصَّت المَصَاحِفُ بهذه الخُطُوط وحَدَثَ خَطٌّ يُسَمَّى العِرَاقِي وهو المُحَقَّقُ …"
summary:
