label: { ar: "الموطأ 1724 — سعيد بن المسيب: إذا لم يجد الرجل ما ينفق على امرأته فرق بينهما، وعلى ذلك أدرك أهل العلم ببلدنا", en: "Muwatta 1724", es: "Muwatta 1724", fr: "Muwatta 1724", ur: "موطا 1724", tr: "El-Muvatta 1724 — Sa'id ibn el-Musayyab: Eğer bir erkek karısının geçimini sağlayacak kadar para bulamıyorsa, ayrılmalıdırlar. Ülkemizdeki âlimler bu sonuca varmışlardır.", id: "Al-Muwatta 1724 — Sa’id ibn al-Musayyab: Jika seorang pria tidak mampu mencukupi kebutuhan istrinya, maka mereka harus berpisah. Inilah kesimpulan para ulama di negeri kita." }
summary:
  ar: "يروي مالك أنه بلغه أن سعيد بن المسيب كان يقول إذا لم يجد الرجل ما ينفق على امرأته فرق بينهما. قال مالك وعلى ذلك أدركت أهل العلم ببلدنا. {cite:muwatta-maruf-1997 p.104}"
  tr: "Malik, Sa'id ibn al-Musayyab'ın \"Eğer bir erkek karısının geçimini sağlayamıyorsa, ayrılmalıdırlar\" dediğini duyduğunu aktarır. Malik sözlerine şöyle devam eder: \"Ve ülkemizin âlimlerinin de aynı şeyi söylediğini gördüm.\" {cite:muwatta-maruf-1997 s.104}"
  id: "Malik menceritakan bahwa ia mendengar Sa'id ibn al-Musayyab pernah berkata, \"Jika seorang pria tidak mampu menafkahi istrinya, mereka harus dipisahkan.\" Malik menambahkan, \"Dan inilah yang saya temukan dikatakan oleh para ulama di negeri kita.\" {cite:muwatta-maruf-1997 p.104}"
