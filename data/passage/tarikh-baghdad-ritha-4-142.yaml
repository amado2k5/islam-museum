text: "… من قرابته. أخبرنا عبد الواحد بن الحسين الحذاء اخبرنا اسماعيل بن سعيد حدثنا أبو بكر بن الانبارى قال حدثنى أبى حدثنا الحسن بن عبد الرحمن الربعى حدثنا محمد بن موسى الحنفى عن أبى كعب انلخزاعى قال : رثى سلم الحاسر …"
summary:
  ar: "مقطع من تاريخ بغداد أو مدينة السلام، المجلد المصوَّر 4، ص 142، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Tarikh Baghdad aw Madinat al-Salam, scan volume 4, p. 142, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "تاریخ بغداد او مدینۃ السلام، اسکین جلد 4، ص 142 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh Bagdad aw Madinat al-Salam, volume numérisé 4, p. 142, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Tarikh Bagdad aw Madinat al-Salam, volumen escaneado 4, p. 142, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Bağdat Tarihi veya Barış Şehri, Resimli Cilt 4, sayfa 142'den bir alıntı; ölen kişi için yazılmış bir ağıt ve övgü içeriyor; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Baghdad, atau Kota Perdamaian, Jilid 4 Bergambar, halaman 142, berisi elegi dan eulogi untuk almarhum; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
