label: { ar: "سنن أبي داود 3543 — الأب والأبوة", en: "Sunan Abi Dawud 3543 — the father and fatherhood", ur: "سنن ابی داؤد 3543 — باپ اور والدیت", es: "Sunan Abi Dawud 3543 — El padre y la paternidad", fr: "Sunan Abi Dawud 3543 — le père et la paternité" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَرِيرٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، حَدَّثَنِي النُّعْمَانُ بْنُ بَشِيرٍ، قَالَ أَعْطَاهُ أَبُوهُ غُلاَمًا فَقَالَ لَهُ رَسُولُ اللَّهِ \" مَا هَذَا الْغُلاَمُ \". قَالَ غُلاَمِي أَعْطَانِيهِ أَبِي. قَالَ \" فَكُلَّ إِخْوَتِكَ أَعْطَى كَمَا أَعْطَاكَ \". قَالَ لاَ. قَالَ \" فَارْدُدْهُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3543، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3543 (Wages (Kitab Al-Ijarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3543، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3543 (Salarios (Kitab Al-Ijarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3543 (Salaires (Kitab Al-Ijarah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
