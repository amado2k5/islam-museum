label: { ar: "الموطأ 1639 — بلغ مالكا أن سعيد بن المسيب وسليمان بن يسار وابن شهاب كانوا يقولون عدة المختلعة مثل عدة المطلقة ثلاثة قروء", en: "Muwatta 1639", es: "Muwatta 1639", fr: "Muwatta 1639", ur: "موطا 1639", tr: "El-Muvatta 1639 — Malik'e, Said bin el-Musayyab, Süleyman bin Yasar ve İbn Şihab'ın, hulü' boşanma alan bir kadının bekleme süresinin, boşanmış bir kadının bekleme süresi gibi, üç adet adet döngüsü kadar olduğunu söyledikleri rivayet edilmiştir.", id: "Al-Muwatta 1639 — Sampai kepada Malik bahwa Saeed bin Al-Musayyab, Sulayman bin Yasar, dan Ibn Shihab biasa mengatakan bahwa masa iddah bagi wanita yang memperoleh khul’ (perceraian) adalah seperti masa iddah bagi wanita yang bercerai: tiga siklus menstruasi." }
summary:
  ar: "يروي مالك أنه بلغه أن سعيد بن المسيب وسليمان بن يسار وابن شهاب كانوا يقولون عدة المختلعة مثل عدة المطلقة: ثلاثة قروء. {cite:muwatta-maruf-1997 p.76}"
  tr: "Malik, Sa'id ibn al-Musayyab, Sulayman ibn Yasar ve İbn Şihab'ın, hulü' boşanma alan bir kadının bekleme süresinin, boşanmış bir kadının bekleme süresiyle aynı olduğunu, yani üç adet adet döngüsü olduğunu söylediklerini duyduğunu bildirir. {cite:muwatta-maruf-1997 s.76}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa Sa'id ibn al-Musayyab, Sulayman ibn Yasar, dan Ibn Shihab biasa mengatakan bahwa masa iddah bagi wanita yang memperoleh khul' cerai sama dengan masa iddah bagi wanita yang bercerai: tiga siklus menstruasi. {cite:muwatta-maruf-1997 p.76}"
