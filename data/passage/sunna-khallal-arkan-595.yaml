text: "… أبو بكر، قال: ثنا أبو عبد الله، قال: ثنا وكيع، قال: ثنا سفيان، عن سُهيلٍ بن أبي صالح، عن عبد اللّٰه بن دينارٍ، عن أبي صالح، عن أبي هريرة مرن، قال: قال النبي ي الإيمان بضعٌ وسبعُون بابًا، فأدناه: إماطَةُ …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 595، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 595, that mentions faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 595 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 595, que menciona la fe como setenta y tantas ramas; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 595, qui décrit la foi comme étant composée d'une soixantaine de branches; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 595. sayfasından bir alıntı, yetmişten fazla inanç dalından bahsetmektedir; bu, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, inancın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal \"Al-Sunnah,\" halaman 595, menyebutkan lebih dari tujuh puluh cabang keimanan; ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang keimanan, dan karakteristik seorang mukmin."
