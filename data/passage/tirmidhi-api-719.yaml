text: "… عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثٌ لاَ يُفْطِرْنَ الصَّائِمَ الْحِجَامَةُ وَالْقَىْءُ وَالاِحْتِلاَمُ \". قَالَ أَبُو عِيسَى حَدِيثُ أَبِي سَعِيدٍ الْخُدْرِيِّ حَدِيثٌ غَيْرُ مَحْفُوظٍ. وَقَدْ رَوَى عَبْدُ اللَّهِ بْنُ زَيْدِ بْنِ أَسْلَمَ وَعَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ وَغَيْرُ وَاحِدٍ هَذَا الْحَدِيثَ عَنْ زَيْدِ بْنِ أَسْلَمَ مُرْسَلاً. وَلَمْ يَذْكُرُوا فِيهِ عَنْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 719، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 719 (The Book on Fasting), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 719، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
