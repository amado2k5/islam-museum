label: { ar: "الموطأ 1193 — أبو أيوب الأنصاري: صلى مع النبي في حجة الوداع المغرب والعشاء بالمزدلفة جميعا", en: "Muwatta 1193", es: "Muwatta 1193", fr: "Muwatta 1193", ur: "موطا 1193", tr: "El-Muvatta 1193 — Ebu Eyyub el-Ensari: Veda Hacında, Muzdalifa'da hem akşam hem de yatsı namazlarında Peygamberimizle birlikte namaz kıldı.", id: "Al-Muwatta 1193 — Abu Ayyub al-Ansari: Dia shalat bersama Nabi selama Haji Perpisahan, baik shalat Maghrib maupun Isya di Muzdalifah." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن عدي بن ثابت الأنصاري أن عبد الله بن يزيد الخطمي أخبره أن أبا أيوب الأنصاري أخبره أنه صلى مع رسول الله في حجة الوداع المغرب والعشاء بالمزدلفة جميعا. {cite:muwatta-maruf-1997 p.537}"
  tr: "Malik, Yahya ibn Sa'id'den, o da 'Adi ibn Sabit el-Ensari'den rivayet ettiğine göre, Abdullah ibn Yazid el-Hatmi kendisine, Ebu Eyyub el-Ensari'nin kendisine, Veda Hacında Allah Resulü ile birlikte namaz kıldığını, Muzdalifa'da akşam ve yatsı namazlarını birleştirdiğini söylediğini aktarmıştır. {cite:muwatta-maruf-1997 s.537}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari 'Adi ibn Thabit al-Ansari, bahwa 'Abdullah ibn Yazid al-Khatmi memberitahunya bahwa Abu Ayyub al-Ansari mengatakan kepadanya bahwa ia shalat bersama Rasulullah SAW selama Haji Perpisahan, menggabungkan shalat Maghrib dan Isya di Muzdalifah. {cite:muwatta-maruf-1997 p.537}"
