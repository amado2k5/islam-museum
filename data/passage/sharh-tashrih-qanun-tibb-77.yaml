text: "تشريح عضل الحلقوم الحلق قال الشيخ الرئيس رحمة اللّٰه عليه فأما الحلقوم جملة... إلى آخر الفصل الشرح لفظ الحلقوم يقال عند الأطباء على قصبة الرئة، وليس ذلك المراد ها هنا، فإن العضل المذكور ها هنا ليس هو عضل قصبة الرئة. …"
