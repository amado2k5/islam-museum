text: "… الرِّمْسَ مِنَ الْأَوْثَٰنِ وَاجْتَنِبُواْ قَوْلَ الزُّورِ الحج:. - قال: وحدثنا أبو بكر، قال: ثنا أبو عبد اللّٰه قال: ثنا حجاج، قال: ثنا شريك، عن عاصِمٍ، عن أبي وائل، عن ابن مسعود ضهنه قال: الرِّبا بضعّ وستُّون بابًا، وَالشِّركُ نحوّ مِن …"
