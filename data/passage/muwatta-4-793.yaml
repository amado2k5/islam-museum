label: { ar: "الموطأ 793 — عائشة وأم سلمة: رجل يسأل النبي وهو على الباب: أصبح جنباً وأريد الصيام، فيقول النبي: فأغتسل وأصوم", en: "Muwatta 793" }
text: "فأغتسل وأصوم"
summary:
  ar: "أول حديث في باب ما جاء في صيام الذي يصبح جنباً. يرويه مالك عن عبد الله بن عبد الرحمن بن معمر الأنصاري عن أبي يونس مولى عائشة عن عائشة، أن رجلاً قال للنبي وهو واقف على الباب: إني أصبح جنباً وأنا أريد الصيام. فقال النبي: وأنا أصبح جنباً وأنا أريد الصيام، فأغتسل وأصوم. فقال الرجل: إنك لست مثلنا، قد غفر الله لك ما تقدم من ذنبك وما تأخر، فغضب النبي وقال: والله إني لأرجو أن أكون أخشاكم لله وأعلمكم بما أتقي. ويذكر المحقق أن عبارة «زوج النبي» ليست في م، وأن الحديث رواه عن مالك أبو مصعب وإسماعيل بن عمر ورُوح بن عبادة وسويد والقعنبي عند أبي داود (2389)، ويحيى بن بكير وغيرهم. {cite:muwatta-maruf-1997 p.390}"
