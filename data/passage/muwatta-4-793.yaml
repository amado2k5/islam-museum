label: { ar: "الموطأ 793 — عائشة وأم سلمة: رجل يسأل النبي وهو على الباب: أصبح جنباً وأريد الصيام، فيقول النبي: فأغتسل وأصوم", en: "Muwatta 793", es: "Muwatta 793", fr: "Muwatta 793", ur: "موطا 793", tr: "El-Muvatta 793 — Aişe ve Ümmü Seleme: Bir adam, Peygamberimiz kapıda iken ona sordu: \"Ritüel kirlilik halinde uyandım ve oruç tutmak istiyorum.\" Peygamberimiz şöyle buyurdu: \"Öyleyse ben de gusül abdesti alıp oruç tutayım.\"", id: "Al-Muwatta 793 — Aisyah dan Umm Salama: Seorang pria bertanya kepada Nabi ketika beliau berada di pintu: Saya bangun dalam keadaan najis dan saya ingin berpuasa. Nabi berkata: Kalau begitu, saya akan mandi wajib (ghusl) dan berpuasa." }
text: "فأغتسل وأصوم"
summary:
  ar: "أول حديث في باب ما جاء في صيام الذي يصبح جنباً. يرويه مالك عن عبد الله بن عبد الرحمن بن معمر الأنصاري عن أبي يونس مولى عائشة عن عائشة، أن رجلاً قال للنبي وهو واقف على الباب: إني أصبح جنباً وأنا أريد الصيام. فقال النبي: وأنا أصبح جنباً وأنا أريد الصيام، فأغتسل وأصوم. فقال الرجل: إنك لست مثلنا، قد غفر الله لك ما تقدم من ذنبك وما تأخر، فغضب النبي وقال: والله إني لأرجو أن أكون أخشاكم لله وأعلمكم بما أتقي. ويذكر المحقق أن عبارة «زوج النبي» ليست في م، وأن الحديث رواه عن مالك أبو مصعب وإسماعيل بن عمر ورُوح بن عبادة وسويد والقعنبي عند أبي داود (2389)، ويحيى بن بكير وغيرهم. {cite:muwatta-maruf-1997 p.390}"
  tr: "Rivayetler bölümündeki ilk hadis, cünüp halde uyanan kimsenin orucu hakkındadır. Malik, Abdullah ibn Abdurrahman ibn Mu'ammar el-Ensari'den, o da Aişe'nin azatlı kölesi Ebu Yunus'tan, o da Aişe'den rivayet etmiştir ki, bir adam Peygamberimize kapıda dururken şöyle dedi: \"Cünüp halde uyanıyorum ve oruç tutmak istiyorum.\" Peygamberimiz şöyle buyurdu: \"Ben de cünüp halde uyanıyorum ve oruç tutmak istiyorum, bu yüzden gusül abdesti alıp oruç tutuyorum.\" Adam şöyle dedi: \"Sen bizim gibi değilsin; Allah senin geçmiş ve gelecek günahlarını bağışladı.\" Peygamberimiz öfkelenerek şöyle buyurdu: \"Allah'a yemin ederim ki, umarım aranızda en çok Allah'tan korkan ve neyden sakınılması gerektiğini en iyi bilen benimdir.\" Editör, \"Peygamberin eşi\" ifadesinin el yazmasında bulunmadığını ve hadisin Malik'ten Ebu Mus'ab, İsmail ibn Ömer, Ruh ibn Ubadah, Suwaid ve el-Ka'nabi tarafından Ebu Davud'da (2389), Yahya ibn Bukayr ve diğerleri tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.390}"
  id: "Hadits pertama dalam surah ini membahas tentang puasa orang yang bangun tidur dalam keadaan junub. Diriwayatkan oleh Malik dari Abdullah ibn Abdur-Rahman ibn Mu'ammar al-Ansari, dari Abu Yunus, budak yang dibebaskan oleh Aisyah, dari Aisyah, bahwa seorang laki-laki berkata kepada Nabi, ketika beliau berdiri di depan pintu: \"Aku bangun tidur dalam keadaan junub dan aku ingin berpuasa.\" Nabi berkata: \"Aku juga bangun tidur dalam keadaan junub dan aku ingin berpuasa, maka aku mandi wajib (ghusl) dan berpuasa.\" Laki-laki itu berkata: \"Engkau tidak seperti kami; Allah telah mengampuni dosa-dosamu di masa lalu dan masa depan.\" Nabi menjadi marah dan berkata: \"Demi Allah, aku berharap aku adalah orang yang paling takut kepada Allah di antara kalian dan yang paling mengetahui apa yang harus diwaspadai.\" Penyunting mencatat bahwa frasa \"istri Nabi\" tidak ada dalam manuskrip, dan bahwa hadits tersebut diriwayatkan dari Malik oleh Abu Mus'ab, Ismail ibn Umar, Ruh ibn Ubadah, Suwaid, dan al-Qa'nabi dalam Abu Dawud (2389), Yahya ibn Bukayr, dan lainnya. {cite:muwatta-maruf-1997 p.390}"
