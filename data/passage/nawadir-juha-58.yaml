text: "… ابن أبيه سأل بعضهم ابناً لجحا: ما هو الباذنجان؟ فقال: هو فرخ الجاموس الذي لم يفتح عينيهِ بعدُ، فسمِعَهُ أبوه فقال متعجباً : هو ابن أبيه، فواللَّهِ لم يُعَلِّمْهُ ذلك أحدّ."
summary:
  ar: "سأل أحدهم ابن جحا ما الباذنجان، فقال إنه عجل جاموس لم تنفتح عيناه بعد، فقال جحا إنه ابن أبيه. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  en: "Asked by someone what an aubergine is, Juha's son says it is a buffalo calf whose eyes are not yet open; Juha says that he is his father's son. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  ur: "کسی نے جحا کے بیٹے سے پوچھا کہ بینگن کیا ہے، تو اس نے کہا کہ یہ بھینس کا بچھڑا ہے جس کی آنکھیں ابھی نہیں کھلیں؛ جحا نے کہا کہ یہ اپنے باپ کا بیٹا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  fr: "Quand quelqu'un lui demande ce qu'est une aubergine, le fils de Juha dit que c'est un veau de buffle qui n'a pas encore ouvert les yeux ; Juha dit qu'il est bien le fils de son père. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  es: "Cuando alguien le pregunta qué es una berenjena, el hijo de Juha dice que es un ternero de búfalo que aún no ha abierto los ojos; Juha dice que es hijo de su padre. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
