text: "… : فخرح فى العرب يجمعها، وهو يقول : يا بنى عبد مَناةَ الرُّزّامْ أَنتم حُماةٌ وأَبوكُمْ حامْ لا تعِدونى نَصْرَكُم بَعْدَ العامْ لا تُسْلِمونى لا يَحِلّ إسلامْ قال : وخرج معه النَّفَر فأَلِّبوا العرب وجمعوها،وبلغوا ثَقيفاً فأُوعبوا. فلمًا أَجمعوا المسير …"
