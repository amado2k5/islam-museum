label: { ar: "صحيح مسلم 378 — الأب والأبوة", en: "Sahih Muslim 378 — the father and fatherhood", ur: "صحیح مسلم 378 — باپ اور والدیت", es: "Sahih Muslim 378 — El padre y la paternidad", fr: "Sahih Muslim 378 — Le père et la paternité", tr: "Sahih Muslim 378 — Baba ve Babalık", id: "Sahih Muslim 378 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ عَامِرِ بْنِ سَعْدٍ، عَنْ أَبِيهِ، قَالَ قَسَمَ رَسُولُ اللَّهِ قَسْمًا فَقُلْتُ يَا رَسُولَ اللَّهِ أَعْطِ فُلاَنًا فَإِنَّهُ مُؤْمِنٌ. فَقَالَ النَّبِيُّ \" أَوْ مُسْلِمٌ \" أَقُولُهَا ثَلاَثًا. وَيُرَدِّدُهَا عَلَىَّ ثَلاَثًا \" أَوْ مُسْلِمٌ \" ثُمَّ قَالَ \" إِنِّي لأُعْطِي الرَّجُلَ وَغَيْرُهُ أَحَبُّ إِلَىَّ مِنْهُ مَخَافَةَ أَنْ يَكُبَّهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 378، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 378 (The Book of Faith), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 378، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 378 (El Libro de la Fe), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 378 (Le Livre de la Foi), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 378 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 378, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
