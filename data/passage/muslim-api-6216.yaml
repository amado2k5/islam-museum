label: { ar: "صحيح مسلم 6216 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 6216 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 6216 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 6216 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 6216 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا حَسَنُ بْنُ عَلِيٍّ الْحُلْوَانِيُّ، وَأَبُو بَكْرِ بْنُ إِسْحَاقَ قَالاَ حَدَّثَنَا سَعِيدُ بْنُ أَبِي، مَرْيَمَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرِ بْنِ أَبِي كَثِيرٍ، أَخْبَرَنِي شَرِيكُ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ سَعِيدِ، بْنِ الْمُسَيَّبِ عَنْ أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ خَرَجَ رَسُولُ اللَّهِ يَوْمًا إِلَى حَائِطٍ بِالْمَدِينَةِ لِحَاجَتِهِ فَخَرَجْتُ فِي إِثْرِهِ. وَاقْتَصَّ الْحَدِيثَ بِمَعْنَى حَدِيثِ سُلَيْمَانَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6216، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6216 (The Book of the Merits of the Companions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 6216، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 6216 (El Libro de los Méritos de los Compañeros), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih Muslim, n° 6216 (Livre des mérites des Compagnons), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
