text: "… ما بحت بسِرّي سألوه يوماً : هل تعرف أحداً يحفظ الأسرار في البلدة؟ فأجابهم: حيث أنِّي علمت بأنَّ صدور الخلق ليست بمستودعٍ، فلم أبح بسِرّي لأحدٍ حتى الآن. لم أكمّل بَوْلي بعد دخل يوماً عند العشاء إلى مرحاض أحد الجوامع …"
summary:
  ar: "سُئل جحا هل يعرف أحدًا في البلدة يكتم الأسرار، فقال إن القلوب ليست خزائن، ولذلك لم يُطلع أحدًا على سره. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  en: "Asked whether he knows anyone who keeps secrets in the town, Juha says that since hearts are not vaults he has told no one his secret. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  ur: "جحا سے پوچھا گیا کہ کیا شہر میں کوئی راز چھپانے والا جانتے ہو، تو اس نے کہا کہ دل تجوریاں نہیں ہوتے، اس لیے میں نے کسی کو اپنا راز نہیں بتایا۔ {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  fr: "On demande à Juha s'il connaît quelqu'un qui garde les secrets dans la ville; il dit que, les cœurs n'étant pas des coffres, il n'a confié son secret à personne. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  es: "Le preguntan a Juha si conoce a alguien que guarde secretos en la ciudad; él dice que, como los corazones no son cajas fuertes, no le ha contado su secreto a nadie. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  tr: "Juha'ya kasabada sır saklayabilecek birini tanıyıp tanımadığı soruldu ve o da kalplerin hazine sandığı olmadığını, bu yüzden sırrını kimseye açıklamadığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 76}"
  id: "Juha ditanya apakah dia mengenal seseorang di kota yang bisa menyimpan rahasia, dan dia menjawab bahwa hati bukanlah peti harta karun, dan karena itu dia belum mengungkapkan rahasianya kepada siapa pun. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
