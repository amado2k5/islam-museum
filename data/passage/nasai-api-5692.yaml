label: { ar: "سنن النسائي 5692 — الشهادة والصلاة والزكاة، ركن من أركان الإيمان", en: "Sunan al-Nasa'i 5692 — the testimony, the prayer and the zakat; one of the articles of faith", ur: "سنن نسائی 5692 — شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن", es: "Sunan al-Nasa'i 5692 — el testimonio, la oración y el zakat; uno de los artículos de fe", fr: "Sunan al-Nasa'i 5692 — le témoignage, la prière et la zakat; un des articles de foi" }
text: "… بِهِ دَخَلْنَا الْجَنَّةَ وَنَدْعُو بِهِ مَنْ وَرَاءَنَا. قَالَ \" آمُرُكُمْ بِثَلاَثٍ وَأَنْهَاكُمْ عَنْ أَرْبَعٍ آمُرُكُمْ بِالإِيمَانِ بِاللَّهِ وَهَلْ تَدْرُونَ مَا الإِيمَانُ بِاللَّهِ \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" شَهَادَةُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَإِقَامُ الصَّلاَةِ وَإِيتَاءُ الزَّكَاةِ وَأَنْ تُعْطُوا مِنَ الْمَغَانِمِ الْخُمُسَ وَأَنْهَاكُمْ عَنْ أَرْبَعٍ عَمَّا يُنْبَذُ فِي الدُّبَّاءِ وَالنَّقِيرِ وَالْحَنْتَمِ وَالْمُزَفَّتِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5692، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5692 (The Book of Drinks), that mentions the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5692، جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5692 (El Libro de las Bebidas), menciona el testimonio, la oración y el zakat, uno de los artículos de fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5692 (Le Livre des Boissons), mentionne le témoignage, la prière et la zakat, l'un des piliers de la foi. Le navigateur « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
