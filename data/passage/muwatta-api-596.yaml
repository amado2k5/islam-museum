text: "… حَتَّى يَحُولَ عَلَيْهِ الْحَوْلُ مِنْ يَوْمَ صَدَّقَهُ وَأَنَّهُ إِنْ لَمْ يَبِعْ ذَلِكَ الْعَرْضَ سِنِينَ لَمْ يَجِبْ عَلَيْهِ فِي شَىْءٍ مِنْ ذَلِكَ الْعَرْضِ زَكَاةٌ وَإِنْ طَالَ زَمَانُهُ فَإِذَا بَاعَهُ فَلَيْسَ فِيهِ إِلاَّ زَكَاةٌ وَاحِدَةٌ. قَالَ مَالِكٌ الأَمْرُ عِنْدَنَا فِي الرَّجُلِ يَشْتَرِي بِالذَّهَبِ أَوِ الْوَرِقِ حِنْطَةً أَوْ تَمْرًا أَوْ غَيْرَهُمَا لِلتِّجَارَةِ ثُمَّ يُمْسِكُهَا حَتَّى يَحُولَ عَلَيْهَا الْحَوْلُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 596، يرد فيه ذكر ما يجب على المكلف. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 596 (Zakat), whose wording mentions what is binding on the person addressed. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 596، جس کے الفاظ میں جو مکلف پر واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 596, dont le texte mentionne ce qui s'impose à la personne responsable. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 596, cuyo texto menciona lo que obliga a la persona responsable. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 596 numaralı hadis, sorumlu bir kişi için farz olan şeylerden bahsetmektedir. Farz görevleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları derleyen kişi, bunları Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle bir araya getirmiştir. Derleyici, metinde yer alanları açıklamış ancak buna dayanarak fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 596, menyebutkan apa yang wajib bagi orang yang bertanggung jawab. Penyusun kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil mengumpulkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
