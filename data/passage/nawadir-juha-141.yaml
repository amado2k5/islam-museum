label: { ar: "نوادر جحا الكبرى، ص 65 — «أنا من الخارج وأنت من الداخل»", en: "Nawadir Juha al-Kubra, p. 65 — 'I Am Outside and You Are Inside'", ur: "نوادر جحا الکبریٰ، ص 65 — «میں باہر ہوں اور تم اندر»", fr: "Nawadir Juha al-Kubra, p. 65 — « Moi dehors et toi dedans »", es: "Nawadir Juha al-Kubra, p. 65 — «Yo por fuera y tú por dentro»", tr: "Juha'nın Büyük Fıkraları, s. 65 — “Ben dışarıdanım, siz içeridensiniz”", id: "Anekdot Hebat Juha, hlm. 65 — “Aku dari luar dan kamu dari dalam”" }
text: "… أنا من الخارج وأنتِ من الداخل أخذ حماره إلى السوق، وأعطاهُ إلى الدلال ليبيعه، فأخذَ الدلال يدور به،"
summary:
  ar: "اشترى جحا في السوق حمارًا مدحه الدلّال باسم إشكين، ولم يتضح هل هو اسم أم نوع؛ وفي البيت اعترفت زوجته بأنها خدعت بائع القشدة بوضع أساورها الذهبية في الميزان؛ فقال جحا إنه في الخارج وهي في الداخل، والبيت عامر. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  en: "At the market Juha buys a donkey praised as 'Ishkin' by the broker, a name or breed that is unclear; at home his wife admits she tricked a cream seller by putting her gold bracelets on the scale; Juha says 'I am outside and you are inside, and the house is prospering'. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  ur: "بازار میں جحا نے ایک گدھا خریدا جس کی دلال نے «اشکین» کہہ کر تعریف کی، اور یہ واضح نہیں کہ یہ نام ہے یا نسل؛ گھر میں اس کی بیوی نے مانا کہ اس نے ملائی بیچنے والے کو ترازو میں اپنے سونے کے کنگن رکھ کر دھوکا دیا؛ جحا نے کہا کہ میں باہر ہوں اور تم اندر، اور گھر خوب پھل پھول رہا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  fr: "Au marché, Juha achète un âne que le courtier vante sous le nom d'«Ishkin», sans qu'on sache s'il s'agit d'un nom ou d'une race; à la maison, sa femme avoue avoir trompé un vendeur de crème en posant ses bracelets d'or sur la balance; Juha dit: «Moi dehors et toi dedans, et la maison prospère.» {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  es: "En el mercado, Juha compra un burro que el corredor alaba como «Ishkin», sin que quede claro si es un nombre o una raza; en casa, su mujer confiesa que engañó a un vendedor de nata poniendo sus brazaletes de oro en la balanza; Juha dice: «Yo por fuera y tú por dentro, y la casa prospera». {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  tr: "Juha pazardan bir eşek satın aldı; aracı, eşeği \"İşkin\" diye övdü, ancak bunun bir isim mi yoksa bir cins mi olduğu belli değildi. Evde karısı, altın bileziklerini terazinin üzerine koyarak krema satıcısını kandırdığını itiraf etti. Juha, karısı içerideyken kendisinin dışarıda olduğunu ve evin kalabalık olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 65}"
  id: "Juha membeli seekor keledai di pasar, yang dipuji oleh makelar dengan menyebutnya \"Ishkin,\" meskipun tidak jelas apakah itu nama atau jenis keledai. Di rumah, istrinya mengaku telah menipu penjual krim dengan meletakkan gelang emasnya di timbangan. Juha menjawab bahwa dia berada di luar sementara istrinya di dalam, dan rumah itu ramai. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
