text: "… عدوهم ذياداً بسهم في سبيل اللّٰه قبلي فما يعتد رامٍ من معدّ وسب هذه الأبيات أن رسول اللّٰه بعثه إِلى رابغ، فلقي عيراً لقريش فيهم أبو سفيان، فخرج إلى المسلمين من المشركين يومئذ المقداد بن عمر و حليف بني زهرة، …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 104، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 3, p. 104, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 3، ص 104 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
