text: "… منه على المشهور من مذهب مالك، وقيل: مردود حتى يجيزه الزوج. وللزوج رد الجميع إن تبرعت بزائد عن الثلث، ولو كان الزائد يسيرا، معاملة لها بنقيض قصدها، أو لأنها كمن جمع بين حلال وحرام. وللزوج إمضاء الجميع، وله رد الزائد …"
