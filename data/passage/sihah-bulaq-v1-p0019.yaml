text: |-
  ٦٢٢
  والتشديد الرجل الحاضر الجواب والتقع لوبْه أى ذهب وتغير عن اللحيانى مثل امتقع
  (⁦(كع)⁩ لكع عليه الومخ لكعااذا الصقبه ولزمه عن الاصمعى ورجل لكع أى لئيم
  ويقال العبد الذليل النفس وامر ألكاع ممل قطام وقال ا لحطيئ ة
  أطوف ما أطوف ثم آوى • الى بيت قعيدتها-كاع
  وتقول فى النداء بالكع وللاثنين ياذوى لكع وقد لكع للكاعة فهوالكع وامرأة لكعا.
  ولا يصرف لكع فى المعرفة لانه معسدول من ألكع وقال أبو عبيدة يقال لله رس الذكر
  لكع والاثى اكعة فهذا يتصرف فى المعرفة لانه ايس ذلك المعدول الذى يقال للمونت منه
  - كاع وانماهو مثل صردونغر ويقال للمجحش لكع وللعبى الصغير أيضاوفى حديث أبى
  هريرة أثمّ لكع بعنى الحسن أوالحسين رضى اللّٰه عنهما واللسكيعة الامة الشيمة وبنو اللكيعة
  قوم قال علىّ" بن عبد اللّٰه بن عباس رضى اللّٰه عنهم
  هم حفظواذ مارى يوم جاءت * كتائب مسرف وبنو اللكبعه
  واللكع ساكن اللسع ومنهقول الشاءر ذ ى الاصبع العدوانى اذامس دبره ل-كعا
  يعنى نصل السهم واللكع أيضا النهز فى الرضاع (ل ع ع البرق لمعنا ولمعانا أى أضاء
  والتمع مثله ويقال للسراب يلع ويشبه به الكذوب قال الشاعر
  اذا ماشكوت الحب كيماتثيبى * بودى قالت اغما أنت يلع
  واللماعة الفلاة ومنه قول ابن أحر كم دون إلى من تنوفية * لماعة تنذرفيها النذر
  واللماءة أيضا العقاب واللمعة بالضم قطعة من النبت اذا أخذت فى اليبس قال ابن السكيت
  بقال هذه لمعة قد أحشت أى قد أمكنت لأن تحش وذلك اذا يبست واللمعة من الخلىّ وهو
  نبت ولا يقال لها لمعة حتى تبيض قال ويقال هذه بلادقد ألمعت وهى ملعة والاعى الذكى
  المتوقد قال أوس بن حجر
  الالمعىّ الذى يظنّلك الظلن كأن قدر أى وقد -معا
  نصب الاامى :فعل متقدم وكذلك اليلعى وأنشد الاصمعى
  وكانن ترى من يلعمحظرب * وليس له عند العزائم جول
  وألمع الفرس والاتان وأطياء اللبؤة اذا أشرقت ضروعها للحمل واسودت حلمتاها أبوعرو
  ألمءت بالشئ ولتمعت الشى اختاسته ويقال التمع لونه أى ذهب وتغير والملح من اخيل
  الذى يكون فى حسده بقع تذالف سائرلونه فاذا كان فيه إستطالة فهو مواح ⁦(لوع)⁩ لوعة
  الحبّ حرقته وقد لاعه الحب يلوعه والتاع فؤاده أى احترق من الشوق, قال أنان لاعة
  الفؤاد الى حشها قال الاصمعى أى لائعة الفؤاد وهى التى كأنها ولهى من الفسزع
  وانتد للاعنى
  ملع لاعة الفؤاد الى حش فلامعنها فبئس الفالى
  ورجل هاع لاع أى جبان جزوع وقد لاع يليع وحكى ابن السكيت لعت ألاع وهمت أهاع
  وامرأة هاعة لاعة ورجل دائع لائع ⁦(لهع )⁩ لهيعة اسم رجل
  صل الميم تع تع النها ريمتع أى ارتفع وطال والماتع الطويل من كل شئ
  وقد مقع الشئء ومتعه غيره قال لبيديصف نخلا
  مصحق يمتعها الصفاوسر به * عم نواعم بينهنّ كروم
  وقول
