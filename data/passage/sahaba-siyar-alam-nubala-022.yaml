text: "ل: جاء رجل من اليهود إلى عمر، ، فقال: يا أمير المؤمنين، آية في كتابكم تقرؤونها لو علينا معشر اليهود نزلت لا تخذنا ذلك اليوم عيدا. قال: أي آية؟ قال: (اليوم أحملت لكم دينكم، وأتممت عليكم نعمتي، ورضيت لكم الإسلام"
