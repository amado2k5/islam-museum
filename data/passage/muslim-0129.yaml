label:
  ar: "مسلم 129 — إن الله كتب الحسنات والسيئات"
  en: "Muslim 129 — God has written good deeds and bad deeds"
  ur: "مسلم 129 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
text: "قال الله عز وجل إذا تحدث عبدي بأن يعمل حسنة فأنا أكتبها له حسنة ما لم يعمل فإذا عملها فأنا أكتبها بعشر أمثالها وإذا تحدث بأن يعمل سيئة فأنا أغفرها له ما لم يعملها فإذا عملها فأنا أكتبها له بمثلها …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 129: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 129: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 129: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
