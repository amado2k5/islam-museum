text: "إلى الذين ظلموا ) ولا تميلوا. قال الشيخ (٥) - رحمه الله-: هذا خطاب لأتباع الكفرة أى لا تركنوا إلى القادة والكبراء فى ظلمهم وفيما يدعونكم إليه (فتمسكم النار} وقيل الركون إليهم الرضا بكفرهم، وقال قتادة : ولا تلحقوا بالمشركين"
