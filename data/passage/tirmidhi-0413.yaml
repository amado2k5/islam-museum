label:
  ar: "الترمذي 413 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Tirmidhi 413 — The first thing a servant is reckoned for is his prayer"
  ur: "ترمذی 413 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
  es: "Tirmidhi 413 — Lo primero por lo que se cuenta de un siervo es su oración."
  fr: "Tirmidhi 413 — La première chose dont un serviteur est tenu compte, c'est sa prière."
  tr: "Tirmizi 413 — Bir kulun hesaba çekileceği ilk şey namazıdır: Kulumun gönüllü namazı olup olmadığına bakın."
  id: "Tirmidzi 413 — Hal pertama yang akan dipertanggungjawabkan kepada seorang hamba adalah doanya: Perhatikanlah apakah hamba-Ku mempunyai doa sunnah."
text: "إن أول ما يحاسب به العبد يوم القيامة من عمله صلاته فإن صلحت فقد أفلح وأنجح وإن فسدت فقد خاب وخسر فإن انتقص من فريضته شيء قال الرب عز وجل انظروا هل لعبدي من تطوع فيكمل بها ما انتقص من …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 413: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 413: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 413: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 413: Lo primero por lo que se cuenta a un siervo es su oración. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 413: La première chose dont un serviteur est tenu compte est sa prière. Le Prophète le rapporte de son Seigneur; le dictionnaire Qudsi Browser rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Cami' el-Tirmizi'de 413 numaralı hadis-i kudsi şöyledir: Bir kulun hesaba çekileceği ilk şey namazıdır: \"Bakın bakalım, kulumun gönüllü namazları var mı?\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 413: Hal pertama yang akan dipertanggungjawabkan kepada seorang hamba adalah salatnya: \"Lihatlah apakah hamba-Ku mempunyai salat sunnah.\" Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta'."
