label:
  ar: "الترمذي 413 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Tirmidhi 413 — The first thing a servant is reckoned for is his prayer"
  ur: "ترمذی 413 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
text: "إن أول ما يحاسب به العبد يوم القيامة من عمله صلاته فإن صلحت فقد أفلح وأنجح وإن فسدت فقد خاب وخسر فإن انتقص من فريضته شيء قال الرب عز وجل انظروا هل لعبدي من تطوع فيكمل بها ما انتقص من …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 413: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 413: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 413: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
