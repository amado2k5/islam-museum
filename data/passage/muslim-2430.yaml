label: { ar: "مسلم 2430 — كمل من النساء مريم وآسية وفضل عائشة كفضل الثريد", en: "Muslim 2430 — Maryam and Asiya perfected; Aisha as tharid over other food", es: "Muslim 2430 — Maryam y Asiya perfeccionaron su fe; Aisha como tharid sobre otros alimentos.", fr: "Muslim 2430 — Maryam et Asiya perfectionnées; Aisha comme tharid sur les autres aliments", ur: "مسلم 2430 - مریم اور آسیہ کامل ہوئیں۔ عائشہ کو دوسرے کھانے پر ثرید", tr: "Müslim 2430 — Kadınların en mükemmelleri Meryem ve Aişe'dir; Aişe'nin fazileti ise tarid (bir çeşit ekmek çorbası) fazileti gibidir.", id: "Muslim 2430 — Wanita yang paling sempurna adalah Maryam dan Aisyah, dan keutamaan Aisyah seperti keutamaan tharid (sejenis sup roti)." }
text: "قال رسول الله: «كمل من الرجال كثير ولم يكمل من النساء غير مريم بنت عمران وآسية امرأة فرعون، وإن فضل عائشة على النساء كفضل الثريد على سائر الطعام»"
summary:
  ar: "رواية أبي موسى الأشعري في صحيح مسلم؛ حديث الكمال النسوي وفضل عائشة — من أشهر نصوص فضائل النساء في الدواوين."
  tr: "Sahih Muslim'de yer alan Ebu Musa el-Eş'ari'nin rivayeti; kadınların mükemmelliği ve Ayşe'nin faziletine dair hadis, hadis külliyatındaki kadınların faziletleri hakkındaki en ünlü metinlerden biridir."
  id: "Riwayat Abu Musa al-Ash’ari dalam Sahih Muslim; hadits tentang kesempurnaan wanita dan keutamaan Aisyah — adalah salah satu teks paling terkenal tentang keutamaan wanita dalam kumpulan hadits."
