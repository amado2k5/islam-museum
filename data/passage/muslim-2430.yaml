label: { ar: "مسلم 2430 — كمل من النساء مريم وآسية وفضل عائشة كفضل الثريد", en: "Muslim 2430 — Maryam and Asiya perfected; Aisha as tharid over other food" }
text: "قال رسول الله: «كمل من الرجال كثير ولم يكمل من النساء غير مريم بنت عمران وآسية امرأة فرعون، وإن فضل عائشة على النساء كفضل الثريد على سائر الطعام»"
summary:
  ar: "رواية أبي موسى الأشعري في صحيح مسلم؛ حديث الكمال النسوي وفضل عائشة — من أشهر نصوص فضائل النساء في الدواوين."
