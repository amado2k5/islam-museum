label: { ar: "سنن النسائي 4820 — أطوار خلق الجنين", en: "Sunan al-Nasa'i 4820 — the stages of the embryo", ur: "سنن نسائی 4820 — جنین کے مراحل" }
text: "… أَسْمَعُ، عَنِ ابْنِ الْقَاسِمِ، قَالَ حَدَّثَنِي مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، أَنَّ رَسُولَ اللَّهِ قَضَى فِي الْجَنِينِ يُقْتَلُ فِي بَطْنِ أُمِّهِ بِغُرَّةٍ عَبْدٍ أَوْ وَلِيدَةٍ فَقَالَ الَّذِي قَضَى عَلَيْهِ كَيْفَ أُغَرَّمُ مَنْ لاَ شَرِبَ وَلاَ أَكَلَ وَلاَ اسْتَهَلّ وَلاَ نَطَقَ فَمِثْلُ ذَلِكَ يُطَلّ فَقَالَ رَسُولُ اللَّهِ \" إِنَّمَا هَذَا مِنَ الْكُهَّانِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4820، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 4820 (The Book of Oaths (qasamah), Retaliation and Blood Money), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 4820، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
