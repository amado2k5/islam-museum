label: { ar: "سنن النسائي 4820 — أطوار خلق الجنين", en: "Sunan al-Nasa'i 4820 — the stages of the embryo", ur: "سنن نسائی 4820 — جنین کے مراحل", es: "Sunan al-Nasa'i 4820 — Las etapas del embrión", fr: "Sunan al-Nasa'i 4820 — Les stades de l'embryon", tr: "Sunan an-Nasa'i 4820 — Fetal gelişim evreleri", id: "Sunan an-Nasa'i 4820 — Tahapan perkembangan janin" }
text: "… أَسْمَعُ، عَنِ ابْنِ الْقَاسِمِ، قَالَ حَدَّثَنِي مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، أَنَّ رَسُولَ اللَّهِ قَضَى فِي الْجَنِينِ يُقْتَلُ فِي بَطْنِ أُمِّهِ بِغُرَّةٍ عَبْدٍ أَوْ وَلِيدَةٍ فَقَالَ الَّذِي قَضَى عَلَيْهِ كَيْفَ أُغَرَّمُ مَنْ لاَ شَرِبَ وَلاَ أَكَلَ وَلاَ اسْتَهَلّ وَلاَ نَطَقَ فَمِثْلُ ذَلِكَ يُطَلّ فَقَالَ رَسُولُ اللَّهِ \" إِنَّمَا هَذَا مِنَ الْكُهَّانِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4820، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 4820 (The Book of Oaths (qasamah), Retaliation and Blood Money), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 4820، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4820 (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Daños Sangrientos), menciona las etapas del embrión. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4820 (Le Livre des Serments (qasamah), de la vengeance et du prix du sang), mentionne les stades de développement de l'embryon. Le Répertoire des ressources médicales le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan-ı Nesai'de yer alan 4820 numaralı hadis, fetüsün gelişim aşamalarından bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4820, menyebutkan tahapan perkembangan janin. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
