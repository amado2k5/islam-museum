text: "بتغوا لأنفسكم، فخرجوا يطلبون ويسيرون في الأرض يلتمسون أهل الكتاب من اليهود والنصارى والملل كلها، يتبعون الحنيفية دين إبراهيم، فأما ورقة فتنصر، ولم يكن منهم أعدل شأنا من زيد بن عمرو، اعتزل الأوثان وفارق الأديان إلا دين إبراهيم. وقال الباغندي:"
