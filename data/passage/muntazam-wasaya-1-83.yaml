text: "… ودقن فى دار ع بن عبد اللّه بن طاهر وهو ابن اثنتين وثلاثين سنة غير شهر وقيل ابن ثلاث وثلاثين ويوم وكانت خلافته ست سنين وستة اشهر وتسعة عشر يوما ولما احتضر قال له وزيره ادع بالف الف دينار ففرتها …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 1، ص 83، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 1, p. 83, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 1، ص 83 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de al-Muntazam de Ibn al-Jawzi, volumen 1, pág. 83, que menciona un lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Muntazam d'Ibn al-Jawzi (tome 1, p. 83) évoquant un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin 1. cildinin 83. sayfasından, ölüm anı ve ölüme dair bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, Volume 1, halaman 83, yang menyebutkan saat kematian dan proses sekarat; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
