label: { ar: "صحيح البخاري 5152 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 5152 — what was made lawful; what is not lawful", ur: "صحیح بخاری 5152 — جو حلال کیا گیا، جو حلال نہیں" }
text: "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى، عَنْ زَكَرِيَّاءَ ـ هُوَ ابْنُ أَبِي زَائِدَةَ ـ عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ ـ عَنِ النَّبِيِّ قَالَ \" لاَ يَحِلُّ لاِمْرَأَةٍ تَسْأَلُ طَلاَقَ أُخْتِهَا لِتَسْتَفْرِغَ صَحْفَتَهَا، فَإِنَّمَا لَهَا مَا قُدِّرَ لَهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5152، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5152 (Wedlock, Marriage (Nikaah)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5152، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
