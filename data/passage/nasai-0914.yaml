ref: "914"
label:
  ar: "النسائي 914 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Nasa'i 914 — I have divided the prayer between Myself and My servant in two halves"
  ur: "نسائی 914 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
  es: "Nasa'i 914 — He dividido la oración entre Mí y Mi siervo en dos partes."
  fr: "Nasa'i 914 — J'ai divisé la prière entre Moi et Mon serviteur en deux moitiés"
  tr: "Nisaî 914 — Namazı kendimle kulum arasında ikiye böldüm."
  id: "An-Nisa’i 914 — Aku telah membagi salat antara Diri-Ku dan hamba-Ku menjadi dua bagian."
text: "ما أنزل الله عز وجل في التوراة ولا في الإنجيل مثل أم القرآن وهي السبع المثاني وهي مقسومة بيني وبين عبدي ولعبدي ما سأل ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 914: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 914: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 914: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 914: He dividido la oración entre Mí y Mi siervo en dos mitades. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sunan al-Nasa'i, n° 914: « J’ai divisé la prière en deux parties entre Moi et Mon serviteur. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sunan-ı Nesai'de 914 numaralı hadis-i kudsi şöyledir: \"Namazı kendimle kulum arasında ikiye böldüm.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 914: \"Aku telah membagi salat antara Diri-Ku dan hamba-Ku menjadi dua bagian.\" Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan al-Muwatta."
