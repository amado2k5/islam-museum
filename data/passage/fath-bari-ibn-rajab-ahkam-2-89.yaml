text: "… نَزَلَ فَاسْتَقْبَلَ الْقِبْلَةَ. محمدُ بنُ عبدِ الرحمنِ هو ابنُ ثوبان. والمرادُ من هذا الحديث هاهنا : أنَّ النَّبَّ وَل عِ ليم يكنْ يُصَلِّي المكتوبةَ إلا على الأرضِ مستقبلَ القبلة. فأمَّا صلاةُ الفريضةِ على الأرضِ فواجبٌ لا يسقطُ إلا في صلاةِ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 2، ص 89، يرد فيه ذكر الفريضة والفرائض، والواجب، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 2, p. 89, whose wording mentions the obligation (farida), the obligatory (wajib), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 2، ص 89 کا اقتباس جس میں فریضہ اور فرائض، واجب، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Rajab, volume numérisé 2, p. 89, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
