text: "… قَالَتْ أُصِيبَ سَعْدٌ يَوْمَ الْخَنْدَقِ، رَمَاهُ رَجُلٌ مِنْ قُرَيْشٍ يُقَالُ لَهُ حِبَّانُ ابْنُ الْعَرِقَةِ، رَمَاهُ فِي الأَكْحَلِ، فَضَرَبَ النَّبِيُّ خَيْمَةً فِي الْمَسْجِدِ لِيَعُودَهُ مِنْ قَرِيبٍ، فَلَمَّا رَجَعَ رَسُولُ اللَّهِ مِنَ الْخَنْدَقِ وَضَعَ السِّلاَحَ وَاغْتَسَلَ، فَأَتَاهُ جِبْرِيلُ ـ وَهْوَ يَنْفُضُ رَأْسَهُ مِنَ الْغُبَارِ فَقَالَ قَدْ وَضَعْتَ السِّلاَحَ وَاللَّهِ مَا وَضَعْتُهُ، اخْرُجْ إِلَيْهِمْ. قَالَ النَّبِيُّ \" فَأَيْنَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4122، يذكر عيادة المريض، وأعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4122 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions visiting the sick, the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4122، جس میں بیمار کی عیادت، اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
