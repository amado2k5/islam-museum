label: { ar: "سنن أبي داود 388 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 388 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 388 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 388 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى بْنِ فَارِسٍ، حَدَّثَنَا أَبُو مَعْمَرٍ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَتْنَا أُمُّ يُونُسَ بِنْتُ شَدَّادٍ، قَالَتْ حَدَّثَتْنِي حَمَاتِي أُمُّ جَحْدَرٍ الْعَامِرِيَّةُ، أَنَّهَا سَأَلَتْ عَائِشَةَ عَنْ دَمِ الْحَيْضِ يُصِيبُ الثَّوْبَ فَقَالَتْ كُنْتُ مَعَ رَسُولِ اللَّهِ وَعَلَيْنَا شِعَارُنَا وَقَدْ أَلْقَيْنَا فَوْقَهُ كِسَاءً فَلَمَّا أَصْبَحَ رَسُولُ اللَّهِ أَخَذَ الْكِسَاءَ فَلَبِسَهُ ثُمَّ خَرَجَ فَصَلَّى الْغَدَاةَ ثُمَّ جَلَسَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 388، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 388 (Purification (Kitab Al-Taharah)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 388، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 388 (Purificación (Kitab Al-Taharah)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
