text: "… ويأتي يومّ يجتمعان به، ولكن قد لا أكون أنا موجوداً. أما كفاه حمله؟ حمَّل يوماً حمارَهُ حطباً، وركب مرتفعاً بعد أن أخرج رجليه من الركاب. فشاهده صبيان الأزقة. فأخذوا يضحكون من عمله. ثم قال له واحد منهم : لماذا لا …"
summary:
  ar: "سُئل جحا لماذا لا يكون عنده دقيق وسمن معاً، فقال ربما يجمعهما القدر يوماً ما لكنه قد لا يكون موجوداً. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  en: "Asked why he cannot have flour and ghee together, Juha says that perhaps fate will bring them together one day, but he may not be there. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  ur: "جحا سے پوچھا جاتا ہے کہ اس کے پاس آٹا اور گھی ایک ساتھ کیوں نہیں ہوتے، تو وہ کہتا ہے کہ شاید تقدیر کسی دن انہیں اکٹھا کر دے، مگر ہو سکتا ہے وہ خود اس وقت موجود نہ ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  fr: "Interrogé sur la raison pour laquelle il n'a jamais farine et beurre clarifié ensemble, Juha dit que peut-être le destin les réunira un jour, mais qu'il ne sera peut-être pas là. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
  es: "Al preguntarle por qué no tiene harina y mantequilla clarificada juntas, Juha dice que quizá el destino las reúna algún día, pero que tal vez él no esté. {cite:juha-nawadir-kubra-djuwaydi p. 105}"
