label:
  ar: "الترمذي 3233 — يا محمد هل تدري فيم يختصم الملأ الأعلى"
  en: "Tirmidhi 3233 — O Muhammad, do you know what the Highest Assembly disputes about"
  ur: "ترمذی 3233 — یا محمدکا کیا تم جانتے ہو کہ ملائے اعلیٰ کن امور میں جھگڑتا ہے"
text: "أتاني الليلة ربي تبارك وتعالى في أحسن صورة قال أحسبه قال في المنام فقال يا محمد هل تدري فيم يختصم الملأ الأعلى قال قلت لا قال فوضع يده بين كتفي …"
summary:
  ar: "حديث قدسي في الترمذي، رقم 3233: يا محمد هل تدري فيم يختصم الملأ الأعلى. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Tirmidhi, no. 3233: O Muhammad, do you know what the Highest Assembly disputes about. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ترمذی میں حدیثِ قدسی، نمبر 3233: یا محمدکا کیا تم جانتے ہو کہ ملائے اعلیٰ کن امور میں جھگڑتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
