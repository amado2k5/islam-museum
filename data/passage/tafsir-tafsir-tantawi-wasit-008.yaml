text: "ارث فأسلم فحسن إسلامه وعن الحسن البصرى أنه قال : إنهم أهل الكتاب من اليهود والنصارى، رأوا نعت النبى في ف كتابهم وأقروا به، وشهدوا أنه حق، فلما بعث من غيرهم حسدوا العرب على ذلك فأنكروه وكفروا بعد إقرارهم حسدا"
