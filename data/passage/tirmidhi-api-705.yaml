label: { ar: "جامع الترمذي 705 — ما حُرّم", en: "Jami' al-Tirmidhi 705 — what was made unlawful", ur: "جامع ترمذی 705 — جو حرام کیا گیا", es: "Jami' al-Tirmidhi 705 — lo que se declaró ilícito", fr: "Jami' al-Tirmidhi 705 — ce qui a été déclaré illicite" }
text: "… السَّاطِعُ الْمُصْعِدُ وَكُلُوا وَاشْرَبُوا حَتَّى يَعْتَرِضَ لَكُمُ الأَحْمَرُ \". قَالَ وَفِي الْبَابِ عَنْ عَدِيِّ بْنِ حَاتِمٍ وَأَبِي ذَرٍّ وَسَمُرَةَ. قَالَ أَبُو عِيسَى حَدِيثُ طَلْقِ بْنِ عَلِيٍّ حَدِيثٌ حَسَنٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ أَنَّهُ لاَ يَحْرُمُ عَلَى الصَّائِمِ الأَكْلُ وَالشُّرْبُ حَتَّى يَكُونَ الْفَجْرُ الأَحْمَرُ الْمُعْتَرِضُ. وَبِهِ يَقُولُ عَامَّةُ أَهْلِ الْعِلْمِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 705، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 705 (The Book on Fasting), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 705، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 705 (El Libro del Ayuno), menciona lo que se ha prohibido. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 705 (Le Livre du jeûne), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
