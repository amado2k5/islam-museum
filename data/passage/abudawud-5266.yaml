label:
  ar: "أبو داود 5266 — نبي قرصته نملة: فهلا نملة واحدة"
  en: "Abu Dawud 5266 — A prophet stung by an ant: why not just the one ant"
  ur: "ابو داود 5266 — ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں"
text: "إن نملة قرصت نبيا من الأنبياء فأمر بقرية النمل فأحرقت فأوحى الله إليه في أن قرصتك نملة أهلكت أمة من الأمم تسبح ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 5266: نبي قرصته نملة: فهلا نملة واحدة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 5266: A prophet stung by an ant: why not just the one ant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 5266: ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
