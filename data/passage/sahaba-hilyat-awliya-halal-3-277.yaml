  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 3. resimli cildinin 277. sayfasından, helal ve haram olan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
