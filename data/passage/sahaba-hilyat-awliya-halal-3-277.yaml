text: "… اللّٰه ليلا فوجدثه قائمًا يصلى فاطال الصلاة، ثم قال : أوتيت الليلة خمسا لم يؤتها نبى قبلى؛ أرسلت إلى الأحمر والأسود، ونصرت بالرعب فيرعب العدو وهو بمسيرة شهر، وجعلت لى الارض مسجداً وطهورا، وأحلت لى الغنائم ولم تحل لأحد قبلى، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 277، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 277, that mentions what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 3، ص 277 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
