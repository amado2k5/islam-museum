text: "… اس القيم : الكبات بفتح الكاف والباء الموحدة المخففة والثاء المثلثة ثمر الأراك، وهو بأرض الحجاز، وطبعه حار ياس منامعه كمنافع الأراك، يقوي المعدة، ويحيد الهضم، ويجلو الملعم، ويفع من أوجاع الظهر، وكثير من الأدواء وانطر الطب النبوي ص من …"
