  fr: "Un extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation du volume 2, p. 318) mentionne les devoirs d'un croyant envers un autre; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
