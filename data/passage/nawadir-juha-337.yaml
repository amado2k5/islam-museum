label: { ar: "نوادر جحا الكبرى، ص 165 — «سأريكم كيف أعيد رجل كل منكم إلى صاحبها»", en: "Nawadir Juha al-Kubra, p. 165 — 'I Will Show You How I Return Each of You His Own Legs'", ur: "نوادر جحا الکبریٰ، ص 165 — «میں تمہیں دکھاتا ہوں کہ تم میں سے ہر ایک کی ٹانگ اس کے مالک کو کیسے لوٹاتا ہوں»", fr: "Nawadir Juha al-Kubra, p. 165 — « Je vais vous montrer comment je rends à chacun ses jambes »", es: "Nawadir Juha al-Kubra, p. 165 — «Les mostraré cómo devuelvo a cada uno sus piernas»" }
text: "… سأريكم كيف أعيد رجل كل منكم إلى صاحبها كان جمع من الأطفال جالسين على شاطىء نهر وقد أَدلَوْا أرجلهم في الماء، وهم يقولون، فيما بينهم أين أرجلنا؟ وأحدهم يقول: هذه رِجل حسين. وأخذوا يتجادلون، ويضجون، فمرّ جحا بهم، وسمِعَ صارخهم، …"
summary:
  ar: "كان أطفال يدلّون أرجلهم في نهر ويتجادلون في أي الأرجل لمن، فضرب جحا أقدامهم بعصا، فسحب كل واحد رجله. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  en: "Children dangle their legs in a river and argue whose feet are whose; Juha uses a stick to strike their feet; each withdraws his own leg. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  ur: "کچھ بچے دریا میں ٹانگیں لٹکائے بیٹھے تھے اور جھگڑ رہے تھے کہ کون سا پاؤں کس کا ہے، تو جحا نے ایک لاٹھی سے ان کے پاؤں پر ضرب لگائی، اور ہر ایک نے اپنی ٹانگ کھینچ لی۔ {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  fr: "Des enfants laissent pendre leurs jambes dans une rivière et se disputent pour savoir à qui sont quels pieds ; Juha frappe leurs pieds avec un bâton ; chacun retire sa propre jambe. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  es: "Unos niños dejan colgar las piernas en un río y discuten de quién son los pies; Juha golpea sus pies con un palo; cada uno retira su propia pierna. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
