label: { ar: "جامع الترمذي 3642 — ضحك وتبسم", en: "Jami' al-Tirmidhi 3642 — laughter and smiling", ur: "جامع ترمذی 3642 — ہنسی اور تبسم", fr: "Jami' al-Tirmidhi 3642 — rire et sourire", es: "Jami' al-Tirmidhi 3642 — risa y sonrisa", tr: "Cami' el-Tirmizi 3642 — Kahkaha ve Gülümseme", id: "Jami' al-Tirmidhi 3642 — Tawa dan Senyum" }
text: "… مِثْلُ هَذَا. حَدَّثَنَا بِذَلِكَ، أَحْمَدُ بْنُ خَالِدٍ الْخَلاَّلُ حَدَّثَنَا يَحْيَى بْنُ إِسْحَاقَ السَّيْلَحَانِيُّ، حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ عَبْدِ اللَّهِ بْنِ الْحَارِثِ بْنِ جَزْءٍ، قَالَ مَا كَانَ ضَحِكُ رَسُولِ اللَّهِ إِلاَّ تَبَسُّمًا. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ غَرِيبٌ لاَ نَعْرِفُهُ مِنْ حَدِيثِ لَيْثِ بْنِ سَعْدٍ إِلاَّ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3642، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 3642, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 3642، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 3642, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 3642, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Cami' el-Tirmizi'de yer alan 3642 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3642, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
