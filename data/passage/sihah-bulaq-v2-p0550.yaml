text: |-
  ٣٧
  ( شنخف رجل شخف مثال جرد حل أى طويل وفى الجديث انك من قوم شنخقين
  وف شفت الشى -لوته ودينار مشوف أى مجلو قال عنترة
  ولقد شربت من المدامة بعدما * ركد الهواجر بالمشوف المعلم
  وتشوّفت الجارية أى تزيذت وشيفت تشاف شوفا أى زيات واشتاف الرجل أى نطاول
  ونظر يقال اشتاف البرق أى شامه ومنه قول العجاج
  . حين دمى محاجبيه الشرقاً * واشتاف من نحوسهيل برقًا
  وتشوّفت الى الشى أى تطلعت اليه يقال النساء يتشوّفن من السطوح أى ينظرن ويتطاولن
  وشيفة القوم طليعتهم الذى يشتاف اهم وأشاف على الذى أى أشرف عليه وهو قاب
  أشقى عليه
  سل الصاد حف) الصحفة كالقصعة والجمع صحاف قال الكسائى أعظم
  القصاع احقنة ثم القصعة تليها تشع العشرة ثم الصحفة تشبع الجمسة ثم المشكلة تشبع الرجلين
  والثلاثة ثم الصحيفة تشع الرجل والصحيفة الكتاب والجمع صحف وصحائف والمصحف
  والمصحف قال الفراء وقد استثقلت العرب الضمسة فى حروف فكسر واميها وأصلها الضم
  من ذلك مصف ومخدع ومطرف ومغزل ومجسدلانا فى المعنى مأخوذة من أصف أى
  بمعت فيه الصدف وأطرف أى جعل فى طرفيه علمان وأجسد ألصوّ بالجسد وكذلاك المغزل
  اغماهو أدير وفتل والتصحيف انخط أ فى الصحيفة دف صدف عنى أى أعرض
  ويقال امرأة ص-دوف للتى تعرض وجههاعلك تم تصدف وأصدفى عنه كذا وكذا أى
  أمالى وصدف الدرّة غشاؤها الواحدة صدفة وفرس أصدف بين الصدف اذا كان متدانى
  الفغذين متباعد الحافرين فى التواءمن الرسغين وقال أيويوسف الصدف ميل فى الحافر
  الى الشق الوحشى" وقال الاصمعى" الصدف أن يميل خف البعير من اليد أو الرجل الى
  الجانب الوحشى" قال فان مال الى الانسى فهو أقفد والصدف والصدف منقطع الجبل
  المرتفع وقرى به ما قوله تعالى بين الصدفين وقال الاصمعىّ الصدف كل شئ مى تفسع مثل
  الهدف وصادفت فلانا وجدته والصوادف الابل التى تجد الابل على الحوض فتقف
  عند أعجازها تنتظرانصراف الشاربة لتدخل هى ومنه قول الراجز
  الناظرات العقب الصوادف، ⁦( صرف )⁩ الصرف التوبة يقال لا يقبل منه
  صرف ولا عدل قال يونس فااصرف الحيلة ومنه قواهم انه ليتدرّف فى الاموروقال تعالى
  فايستطيعون صرفاولانصرا وصرف الدهرحد ثانه ونوابه والصرفان الليل والنهار
  والصرفة منزل من منازل القمر وهو نجم واحد نبربتلقاء الزبرة يقال انه قلب الاسد وسمى
  صرفة لا نصراف البرد واقبال الحر والصرفة أيضاخرزة من الحرز الذى يذكر فى الأخذ
  والصرف بالمكسر صبغ أحر يصبغ به شرك التعال ومنه قول الشاعر.
  كميت غير محلفة ولكن • كلون الصرف علّ به الاديم
  وشراب صرف أى يحت غبير بمزوج وصريف البكرصوتهاعند الاستقاء وقد صرفت
  تصرف صريقا وك ذلك صريف الباب وصريف ناب البعيرية ال ناقة صروف بينة
  مححاح
  قوله وسمى الخ عبارة القاموس
  والصرفة منزل للقمر نجم واحد
  فير يتلو الزبرة سمى لانصراف
  البرد بطلوءها اهكتبه الممحح
