label: { ar: "صحيح البخاري 5422 — الأب والأبوة، النسب والانتساب", en: "Sahih al-Bukhari 5422 — the father and fatherhood; paternity and lineage", ur: "صحیح بخاری 5422 — باپ اور والدیت، نسب اور انتساب", es: "Sahih al-Bukhari 5422 — El padre y la paternidad; paternidad y linaje", fr: "Sahih al-Bukhari 5422 — le père et la paternité; la paternité et la lignée", tr: "Sahih el-Buhari 5422 — Baba ve babalık, soy ve bağlılık", id: "Sahih al-Bukhari 5422 — Ayah dan kebapaan, garis keturunan dan afiliasi" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ مُقَاتِلٍ، أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ جَعْفَرِ بْنِ عَمْرِو بْنِ أُمَيَّةَ الضَّمْرِيِّ، عَنْ أَبِيهِ، قَالَ رَأَيْتُ رَسُولَ اللَّهِ يَحْتَزُّ مِنْ كَتِفِ شَاةٍ، فَأَكَلَ مِنْهَا، فَدُعِيَ إِلَى الصَّلاَةِ، فَقَامَ فَطَرَحَ السِّكِّينَ فَصَلَّى، وَلَمْ يَتَوَضَّأْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5422، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5422 (Food, Meals), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5422، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5422 (Comida, Comidas), menciona al padre y la paternidad, la linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5422 (Nourriture, Repas), mentionne le père, la paternité et la lignée. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sahih el-Buhari'de 5422 numaralı hadis, babalık, soy ve atalık kavramlarından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5422, menyebutkan tentang ayah, garis keturunan, dan leluhur. Peramban \"Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
