text: "بكى صبابة إلى رسول الله واليه فبعث مكانه عبد الله بن جحش، وكتب له كتابا، وأمره ألا يقرأه إلا بمكان كذا وكذا، وقال: ((لا تكرهن أحدا من أصحابك على المسير معك))، فلما صار إلى المكان، قرأ الكتاب واسترجع، وقال: سمعا"
