text: |-
  ⁦(فصل الواو)⁩
  ١٩٩
  مجه يقال نقهت العظم وانتعته بمعنى وتنقح شحم النساقة أى قلّ.⁦(نكع)⁩ النكاح الوط.
  وقد يكون العقد تقول نكهتهاونكمحت هى أى تزوّجت وهى ناكح فى بنى فلان أى هى
  ذات زوج منهم وقال
  لصاصلة اللعام برأس طرف • أحب الىّ من أن تنكحينى
  واستنكحها بعنى نكحها وأنكهها أى زوّجها ورجل نكمة كثير النكاح والنكح والنكح
  لغتان وهى كلة كانت العرب تتزوّج بهاوكان يقال لاتم خارجة عند انلخطبة خطب فتقول
  نكح -تق قالوا أسرع من تكاح أتم خارجة ن ح التناوح التقابل يقال الجبلان
  يتناوحان ومنه سميت النوائح لان بعضهنّ يقابل بعضًا وكذلك الرياح اذا تقابلت فى المهب
  لان بعضها يشاوح بعضا ويناسج وكل ريح استطالت أثرافهبت عليسه رجح ط ولافهى نيخته
  فان اعترضته فهى نسيجته وناحت المرأة تنوح نوحاونيا سا والاسم النياحة ونسامنوح
  وأنواح ونوح ونوائح ونائحات يقال كتافى مناسة فلان وتنوح الشئ تنوّحا اذا تحترّك
  وهو متدل ونوح ينصرف مع الجيهة والتعريف وكذلك كل اسم على ثلاثة أحرف أوسط
  ساكن مثل لوط لان خقته عادات أحد التقلين
  صل الداد ) ( تح ى وتح ووتح أى قليل تافه وقد وتح بالضم يومح وتاحة وشى موتح
  وعراتباع له أى نزرورجل وتح بكسر التا. أى خسيس وأوتح فلان عطيته أى أقلها وكذلك
  التوتيح وتونحت من الشراب شريت شيتاقليلا ح لوجاح والوجاح والوجاح الستر
  قال القطامى لم يدع التلج له-م وجاحا وربماقلبوا الوا وألفافة الوا أجاح واباح واجاح
  ويقال لاماء فى أسفل الحوض اذا كان مقدار ما يستره وجاح ويقال اقيته أدنى وجاح
  لا ول شيءيرى وأوجمه البول ضيق عليه ومنه توب موجح أى صفيق متيز ووجيح أيضاوباب
  موجوح أى مر دود وأوجحت النسارأى وضحت وبدت وأوج لنبا الطريق ويقال حفر حستى
  أومح اذا باخ الصفا (وح الوحوحة صوت معه بجع بقال وحوح الرحسل فى يده اذا نفخ
  فيها من شدة البرد قال الاصمعى رجل وحواح أى خفيف قال وأنشد
  فاتسقت راجر وحواح وكذلك الوسوح قال الجعدى برتى آخاه
  ومن قبله ماقدرزنت بوحوح • وكان ابن أمى والخليل المصافيا
  دح) الكساف أودحت الابل سمنت وحسنت حألها أبوع روأودح الرجل اذعن
  وخضع وأنشد أودح لما أن رأى الجدحكم وربمافالوا أودح الكبش اذا
  توقف ولم ينز ⁦( وذح)⁩ الوذح ما يتعلق فى أذناب الشاء وأرفاغها من أبعارها وأبوالها
  حف عليها الواحدة ودحة والجع ودح مثل يدنة وبدن قال جرر
  التغلبية فى أفواه عورتها * وذح كثيروفى أكتافها الوضر
  تقول منه وذحت الثاة توذح وتيذح وذحا (لشحu لوشاح فى ينسمج من أديم عريضا
  ويرصع بالجواهر وتشده المرأة بين عاتقيها وكشحيها يقال وشاح واشاح ووشاح وأشاح وابهع
  الوشح والاوثصة ووشحتها توشيحافتوشحت هى أى لبسته وربعما قالوا توّشمح الرحل بئوبه
  ويسيفه والوشحا من العنز الموشحة ببياض وقول الراجر
