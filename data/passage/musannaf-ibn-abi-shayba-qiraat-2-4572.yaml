text: "… سفيان عن ابن أبي ليلى عن أبيه عيسى عن أبيه عبد الرحمن بن أبي ليلى: أنه كتب له نصرانيّ مصحفاً - من أهل الحيرة- بتسعين درهماً. - حدثنا حفص بن غياث عن الأعمش عن إبراهيم: أنه كره كتاب المصاحف بالأجر، …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 4572، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 4572, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 4572 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 4572, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 4572, mentionnant la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 4572. sayfasından alınan bu alıntı, Kur'an'ın derlenmesi ve el yazmalarının yanı sıra hat sanatı ve yazı konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmış olup, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Volume 2, halaman 4572, membahas penyusunan Al-Qur'an dan manuskripnya, serta kaligrafi dan penulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
