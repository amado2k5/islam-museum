label: { ar: "الموطأ 1306 — يحيى: بلغه أن عبدا لعبد الله بن عمر أبق وأن فرسا له عار فأصابهما المشركون ثم غنمهما المسلمون فردا عليه", en: "Muwatta 1306", es: "Muwatta 1306", fr: "Muwatta 1306", ur: "موطا 1306", tr: "El-Muvatta 1306 — Yahya: Abdullah bin Ömer'in bir kölesinin kaçtığı ve atının da sakatlandığı kendisine bildirildi. Müşrikler onları yakaladı, sonra Müslümanlar onları geri alıp kendisine iade ettiler.", id: "Al-Muwatta 1306 — Yahya: Dia diberitahu bahwa seorang budak Abdullah bin Umar telah melarikan diri dan kudanya telah rusak. Kaum musyrik menangkap mereka, kemudian kaum Muslim menangkap mereka dan mengembalikannya kepadanya." }
summary:
  ar: "يروي يحيى بن يحيى أن مالكا بلغه أن عبدا لعبد الله بن عمر أبق، وأن فرسا له عار، فأصابهما المشركون ثم غنمهما المسلمون، فردا على عبد الله بن عمر، وذلك قبل أن تصيبهما المقاسم. ويذكر المحقق أن البخاري وصل هذا البلاغ بروايات عن نافع. {cite:muwatta-maruf-1997 p.583}"
  tr: "Yahya ibn Yahya, Malik'in Abdullah ibn Umar'a ait bir kölenin kaçtığını ve atının da kötü durumda bulunduğunu duyduğunu rivayet eder. Müşrikler onları ele geçirmiş, daha sonra Müslümanlar onları savaş ganimeti olarak ele geçirip Abdullah ibn Umar'a iade etmiş ve savaş ganimetleri arasında paylaştırmışlardır. Araştırmacı, Buhari'nin bu rivayeti Nafi'den gelen rivayetlerle ilişkilendirdiğini belirtmektedir. {cite:muwatta-maruf-1997 s.583}"
  id: "Yahya bin Yahya meriwayatkan bahwa Malik mendengar bahwa seorang budak milik Abdullah bin Umar telah melarikan diri, dan seekor kudanya ditemukan dalam keadaan hina. Kaum musyrik menangkap mereka, kemudian kaum Muslim menangkap mereka sebagai rampasan perang dan mengembalikannya kepada Abdullah bin Umar, sebelum mereka dibagi-bagi di antara rampasan perang. Peneliti mencatat bahwa al-Bukhari menghubungkan riwayat ini dengan riwayat dari Nafi'. {cite:muwatta-maruf-1997 p.583}"
