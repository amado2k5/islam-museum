summary:
  ar: "يروي يحيى بن يحيى أن مالكا بلغه أن عبدا لعبد الله بن عمر أبق، وأن فرسا له عار، فأصابهما المشركون ثم غنمهما المسلمون، فردا على عبد الله بن عمر، وذلك قبل أن تصيبهما المقاسم. ويذكر المحقق أن البخاري وصل هذا البلاغ بروايات عن نافع. {cite:muwatta-maruf-1997 p.583}"
