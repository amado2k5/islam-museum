text: "و((الإحكام)) ١٠٢:١، وينظر أيضا كتابه ((الفصل)) ٢١٩:٢. (٤) في كتابيه المذكورين، وحاصل جوابه: أن الأئمة الثلاثة المذكورين لم يتناولوا الحديث بحثا وتقعيدا له، إنما وردت كلمة: تواتر، ومتواتر، في ثنايا كلامهم. وفيه: أن ابن حزم تناول بحث المتواتر في كتابه"
