text: "… عليهم، فقتل أصحابه، ونجا هو وحده جريحاً. ومنها سريّة أبي عُبيدة بن الجرّاح إلى ذي القَصّة، في ربيع الآخر في أربعين رجلًا، فهرب أهله منهم وأصابوا نَعَماً، ورجلًا واحداً أسلم فتركه رسول الله، وت في ه سيرة ابن هشام، الطبري …"
summary:
