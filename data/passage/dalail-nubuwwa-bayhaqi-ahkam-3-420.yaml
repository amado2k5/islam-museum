text: "… وفي كل عشر من الإبل شاتان، وهي كل أربعين من البقر بقرة، وفي كل ثلاثين من البقر تبيع جذع أو جذعة، وفي كل أربعين من الغنم سائمة وحدها شاة. وإنها فريضة اللّٰه التي فرض على المؤمنين في الصدقة، لمن زاد …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 3، ص 420، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 3, p. 420, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 3، ص 420 کا اقتباس جس میں فریضہ اور فرائض، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Dala'il al-Nubuwwa de al-Bayhaqi, volume numérisé 3, p. 420, dont le texte mentionne l'obligation (farida), ce qui a été imposé aux gens, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
