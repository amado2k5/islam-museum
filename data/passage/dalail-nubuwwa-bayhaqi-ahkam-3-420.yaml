  tr: "El-Beyhakî'nin \"Delil el-Nübüvve\" (Peygamberliğin Delilleri) adlı eserinin 3. cildinin 420. sayfasından, farz olan görevleri ve insanlar için farz kılınan şeyleri anlatan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Dala'il al-Nubuwwah\" (Bukti Kenabian) karya Al-Bayhaqi, Jilid 3, halaman 420, yang menyebutkan kewajiban-kewajiban dan apa yang dianjurkan bagi manusia. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
