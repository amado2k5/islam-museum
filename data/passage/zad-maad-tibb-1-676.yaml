text: "… الشرب وفي هذا الشرب حكم جمة، وفوائد مهمة، وقد نبه ف على مجامعها بقوله : إنه أروى وأمرأ وأبرأ فأروى: أشدُّ ريًّا، وأبلغه وأنفعُه، وأبرأ : أفعل من البرء، وهو الشفاء، أي يُبرىء من شدة العطش ودائه لتردده على المعدة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 676، يذكر البرء من العلة، وأعضاء البدن، والداء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 676, that mentions recovery from an ailment, the organs of the body, the disease and its remedy, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 676 کا اقتباس جس میں بیماری سے شفایابی، اعضائے بدن، بیماری، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 676, que menciona la recuperación de una dolencia, los órganos del cuerpo, la enfermedad y su remedio, la curación; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 676, qui mentionne la guérison d'une maladie, les organes du corps, la maladie et son remède, la guérison; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 676. sayfasından, hastalıktan iyileşme, vücut parçaları, hastalık ve şifadan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 676, yang menyebutkan pemulihan dari penyakit, bagian tubuh, penyakit, dan penyembuhan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
