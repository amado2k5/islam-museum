text: "… لليفي فى صلاة الليل أن يسلم من كل ركعتين كان معقولا فى الخبر عنه، أنه أراد - والله أعلم - الفرق بين الفريضة والنافلة. ولا تختلف النافلة فى الليل والنهار، كما لا تختلف المكتوبة فى الليل والنهار ؛ لأنها موصولة …"
summary:
  ar: "مقطع من الأم للشافعي، ص 329، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Umm, p. 329, whose wording mentions the obligation (farida), the supererogatory (nafila), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الام، شافعی، ص 329 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
