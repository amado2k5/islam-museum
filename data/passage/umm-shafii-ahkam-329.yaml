text: "… لليفي فى صلاة الليل أن يسلم من كل ركعتين كان معقولا فى الخبر عنه، أنه أراد - والله أعلم - الفرق بين الفريضة والنافلة. ولا تختلف النافلة فى الليل والنهار، كما لا تختلف المكتوبة فى الليل والنهار ؛ لأنها موصولة …"
summary:
  ar: "مقطع من الأم للشافعي، ص 329، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Umm, p. 329, whose wording mentions the obligation (farida), the supererogatory (nafila), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الام، شافعی، ص 329 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Umm de al-Shafi'i, p. 329, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila), la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Umm de al-Shafi'i, p. 329, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila), la oración prescrita; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin El-Umm adlı eserinin 329. sayfasından, farz olan ameller ve çoğulları, nafile ameller ve çoğulları ile farz namazlardan bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelime olarak alıntılanmıştır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Umm karya Al-Shafi'i, halaman 329, yang menyebutkan amalan wajib dan bentuk jamaknya, amalan sunnah dan bentuk jamaknya, serta salat yang diwajibkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
