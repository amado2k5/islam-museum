label: { ar: "الموطأ 2244 — مالك عن يحيى بن سعيد وعن غير واحد عن الحسن البصري وابن سيرين: أن رجلا في زمان رسول الله أعتق عبيدا له ستة عند موته، فأسهم رسول الله بينهم، فأعتق ثلث تلك العبيد. قال مالك: وبلغني أنه لم يكن لذلك الرجل مال غيرهم", en: "Muwatta 2244" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد وعن غير واحد، عن الحسن بن أبي الحسن البصري، وعن محمد بن سيرين، أن رجلا في زمان رسول الله أعتق عبيدا له ستة عند موته، فأسهم رسول الله بينهم، فأعتق ثلث تلك العبيد. قال مالك: وبلغني أنه لم يكن لذلك الرجل مال غيرهم. ويذكر المحقق أن الحديث يتصل من حديث الحسن وابن سيرين عن عمران بن حصين عن النبي، وهو ثابت صحيح. {cite:muwatta-maruf-1997 p.325}"
