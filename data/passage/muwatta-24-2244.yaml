label: { ar: "الموطأ 2244 — مالك عن يحيى بن سعيد وعن غير واحد عن الحسن البصري وابن سيرين: أن رجلا في زمان رسول الله أعتق عبيدا له ستة عند موته، فأسهم رسول الله بينهم، فأعتق ثلث تلك العبيد. قال مالك: وبلغني أنه لم يكن لذلك الرجل مال غيرهم", en: "Muwatta 2244", es: "Muwatta 2244", fr: "Muwatta 2244", ur: "موطا 2244", tr: "El-Muvatta 2244 — Malik, Yahya ibn Sa'id'den ve Hasan el-Basri ile İbn Sirin'den rivayetle, Allah Resulü zamanında bir adamın ölümünden önce altı kölesini azat ettiğini, bunun üzerine Allah Resulü'nün köleler arasından kura çektiğini ve üçte birini azat ettiğini söyledi. Malik dedi ki: Bana ulaşana göre bu adamın kölelerinden başka hiçbir malı yoktu.", id: "Al-Muwatta 2244 — Malik, berdasarkan riwayat Yahya ibn Sa’id dan beberapa lainnya, berdasarkan riwayat al-Hasan al-Basri dan Ibn Sirin: bahwa seorang laki-laki pada zaman Rasulullah membebaskan enam budaknya sebelum wafatnya, lalu Rasulullah mengundi di antara mereka, dan membebaskan sepertiga dari budak-budak tersebut. Malik berkata: Dan telah sampai kepadaku bahwa orang ini tidak mempunyai harta lain selain mereka." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد وعن غير واحد، عن الحسن بن أبي الحسن البصري، وعن محمد بن سيرين، أن رجلا في زمان رسول الله أعتق عبيدا له ستة عند موته، فأسهم رسول الله بينهم، فأعتق ثلث تلك العبيد. قال مالك: وبلغني أنه لم يكن لذلك الرجل مال غيرهم. ويذكر المحقق أن الحديث يتصل من حديث الحسن وابن سيرين عن عمران بن حصين عن النبي، وهو ثابت صحيح. {cite:muwatta-maruf-1997 p.325}"
  tr: "Malik, Yahya ibn Sa'id ve diğerlerinden, Hasan ibn Abi el-Hasan el-Basri ve Muhammed ibn Sirin'den rivayetle, Allah Resulü zamanında bir adamın vefat ettiğinde altı kölesini azat ettiğini nakletmiştir. Allah Resulü daha sonra ganimetleri aralarında paylaştırmış ve kölelerin üçte birini azat etmiştir. Malik şöyle demiştir: \"Bana ulaşan bilgilere göre, bu adamın onlardan başka hiçbir malı yoktu.\" Araştırmacı, hadisin Hasan ve İbn Sirin'den İmran ibn Hüseyin'den, oradan da Peygamber'den rivayetle nakledildiğini ve sahih ve sağlam olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.325}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id dan lainnya, dari al-Hasan ibn Abi al-Hasan al-Basri dan Muhammad ibn Sirin, bahwa seorang pria pada zaman Rasulullah membebaskan enam budaknya sebelum kematiannya. Rasulullah kemudian membagi rampasan perang di antara mereka, membebaskan sepertiga dari budak-budak tersebut. Malik berkata: \"Telah sampai kepadaku bahwa orang ini tidak memiliki harta lain selain mereka.\" Peneliti menyebutkan bahwa hadits ini terhubung melalui riwayat al-Hasan dan Ibn Sirin dari 'Imran ibn Husayn dari Nabi, dan hadits ini sahih dan valid. {cite:muwatta-maruf-1997 p.325}"
