text: "الكتاب الأول الفن الثاني: في ذكر الأمراض والأسباب والأعراض الكلية فيه السوداء لأن الصيف يرمّد والخريف يبرّد. وأوّل الخريف موافق للمشايخ موافقة ما وآخره يضرّهم مضرّة شديدة. وأمراض الخريف هي الجرب المتقشر والقوابي والسرطانات وأوجاع المفاصل والحيّات المختلطة وحميّات الربع …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 121، يذكر المرض والمريض، والوجع، والحمى والوعك، وأسماء الأمراض، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
