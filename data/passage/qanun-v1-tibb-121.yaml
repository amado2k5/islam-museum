text: "الكتاب الأول الفن الثاني: في ذكر الأمراض والأسباب والأعراض الكلية فيه السوداء لأن الصيف يرمّد والخريف يبرّد. وأوّل الخريف موافق للمشايخ موافقة ما وآخره يضرّهم مضرّة شديدة. وأمراض الخريف هي الجرب المتقشر والقوابي والسرطانات وأوجاع المفاصل والحيّات المختلطة وحميّات الربع …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 121، يذكر المرض والمريض، والوجع، والحمى والوعك، وأسماء الأمراض، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 121, that mentions illness and the sick, pain, fever, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 121 کا اقتباس جس میں بیماری اور بیمار، درد، بخار، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 121, que menciona la enfermedad y los enfermos, el dolor, la fiebre, enfermedades específicas y los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 121, qui mentionne la maladie et les malades, la douleur, la fièvre, les maladies nommées, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
