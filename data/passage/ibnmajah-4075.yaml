label:
  ar: "ابن ماجه 4075 — أوحى الله إلى عيسى: حرز عبادي إلى الطور"
  en: "Ibn Majah 4075 — God revealed to Isa: take My servants to safety on the Mount"
  ur: "ابن ماجہ 4075 — اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ"
text: "ما شأنكم . فقلنا يا رسول الله ذكرت الدجال الغداة فخفضت فيه ثم رفعت حتى ظننا أنه في طائفة النخل . قال غير الدجال أخوفني عليكم إن يخرج وأنا فيكم فأنا حجيجه دونكم وإن يخرج ولست فيكم فامرؤ حجيج نفسه …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4075: أوحى الله إلى عيسى: حرز عبادي إلى الطور. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4075: God revealed to Isa: take My servants to safety on the Mount. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4075: اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
