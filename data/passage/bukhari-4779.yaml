label:
  ar: "البخاري 4779 — أعددت لعبادي الصالحين ما لا عين رأت"
  en: "Bukhari 4779 — I have prepared for My righteous servants what no eye has seen"
  ur: "بخاری 4779 — میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا"
  es: "Bujari 4779 — He preparado para mis siervos justos lo que ningún ojo ha visto"
  fr: "Bukhari 4779 — J’ai préparé pour Mes serviteurs vertueux ce qu’aucun œil n’a vu"
  tr: "Buhari 4779 — Ben, salih kullarım için hiçbir gözün görmediği şeyler hazırladım."
  id: "Al-Bukhari 4779 — Aku telah menyiapkan bagi hamba-hamba-Ku yang saleh apa yang belum pernah dilihat mata."
text: "قال الله تبارك وتعالى أعددت لعبادي الصالحين ما لا عين رأت، ولا أذن سمعت، ولا خطر على قلب بشر . قال أبو هريرة اقرءوا إن شئتم فلا تعلم نفس ما أخفي لهم من قرة أعين. وحدثنا سفيان حدثنا أبو الزناد …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4779: أعددت لعبادي الصالحين ما لا عين رأت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4779: I have prepared for My righteous servants what no eye has seen. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4779: میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 4779: He preparado para Mis siervos justos lo que ningún ojo ha visto. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 4779: « J’ai préparé pour Mes serviteurs vertueux ce qu’aucun œil n’a vu. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 4779: “Aku telah menyiapkan bagi hamba-hamba-Ku yang saleh apa yang belum pernah dilihat mata.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
