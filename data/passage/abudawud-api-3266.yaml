label: { ar: "سنن أبي داود 3266 — الأب والأبوة", en: "Sunan Abi Dawud 3266 — the father and fatherhood", ur: "سنن ابی داؤد 3266 — باپ اور والدیت", es: "Sunan Abi Dawud 3266 — El padre y la paternidad", fr: "Sunan Abi Dawud 3266 — Le père et la paternité" }
text: "… عَيَّاشٍ السَّمَعِيُّ الأَنْصَارِيُّ، عَنْ دَلْهَمِ بْنِ الأَسْوَدِ بْنِ عَبْدِ اللَّهِ بْنِ حَاجِبِ بْنِ عَامِرِ بْنِ الْمُنْتَفِقِ الْعُقَيْلِيِّ، عَنْ أَبِيهِ، عَنْ عَمِّهِ، لَقِيطِ بْنِ عَامِرٍ قَالَ دَلْهَمٌ وَحَدَّثَنِيهِ أَيْضًا الأَسْوَدُ بْنُ عَبْدِ اللَّهِ، عَنْ عَاصِمِ بْنِ لَقِيطٍ، : أَنَّ لَقِيطَ بْنَ عَامِرٍ، خَرَجَ وَافِدًا إِلَى النَّبِيِّ قَالَ لَقِيطٌ : فَقَدِمْنَا عَلَى رَسُولِ اللَّهِ فَذَكَرَ حَدِيثًا فِيهِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3266، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3266 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3266، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3266 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3266 (Serments et Vœux), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
