label: { ar: "الموطأ 977 — مالك عن الرجل يعتمر من بعض المواقيت: المهل من المواقيت يقطع التلبية إذا انتهى إلى الحرم، وبلغه أن ابن عمر كان يصنع ذلك", en: "Muwatta 977", es: "Muwatta 977", fr: "Muwatta 977", ur: "موطا 977", tr: "El-Muvatta 977 — Malik, belirlenmiş Mikat noktalarından birinden Umre yapan bir adamın rivayetine dayanarak şöyle diyor: Mikat noktalarından ayrılan kişi Haram'a ulaştığında Telbiye okumayı bırakır ve İbn Ömer'in de böyle yaptığı kendisine bildirilmiştir.", id: "Al-Muwatta 977 — Malik berdasarkan riwayat seorang laki-laki yang melaksanakan Umrah dari salah satu titik Miqat yang telah ditentukan: Orang yang meninggalkan titik-titik Miqat berhenti membaca Talbiyah ketika sampai di Haram, dan sampai kepadanya bahwa Ibnu Umar biasa melakukan hal itu." }
summary:
  ar: "سئل مالك عن الرجل يعتمر من بعض المواقيت، من أهل المدينة أو غيرهم، متى يقطع التلبية؟ فقال: أما المهل من المواقيت فإنه يقطع التلبية إذا انتهى إلى الحرم، وبلغه أن عبد الله بن عمر كان يصنع ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1124). {cite:muwatta-maruf-1997 p.461}"
  tr: "Malik'e, Medine'den veya başka bir yerden, belirlenmiş Mikat noktalarından birinden Umre yapan bir adamın Telbiye'yi ne zaman bırakması gerektiği soruldu. O şöyle cevap verdi: Mikat noktalarına ulaşan kişi, Haram'a (kutsal yere) vardığında Telbiye'yi bırakır. Abdullah ibn Ömer'in de böyle yaptığı kendisine bildirildi. Araştırmacı, bunu Malik'ten Ebu Musab'ın (1124) rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.461}"
  id: "Malik ditanya tentang seorang pria yang melaksanakan Umrah dari salah satu titik Miqat yang telah ditentukan, baik dia dari Madinah atau dari tempat lain: kapan dia harus berhenti membaca Talbiyah? Dia menjawab: Adapun orang yang telah sampai di titik-titik Miqat, dia berhenti membaca Talbiyah ketika dia sampai di Haram (tempat suci). Dia diberitahu bahwa Abdullah ibn Umar biasa melakukan hal ini. Peneliti menyebutkan bahwa Abu Musab (1124) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.461}"
