label: { ar: "الموطأ 977 — مالك عن الرجل يعتمر من بعض المواقيت: المهل من المواقيت يقطع التلبية إذا انتهى إلى الحرم، وبلغه أن ابن عمر كان يصنع ذلك", en: "Muwatta 977" }
summary:
  ar: "سئل مالك عن الرجل يعتمر من بعض المواقيت، من أهل المدينة أو غيرهم، متى يقطع التلبية؟ فقال: أما المهل من المواقيت فإنه يقطع التلبية إذا انتهى إلى الحرم، وبلغه أن عبد الله بن عمر كان يصنع ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1124). {cite:muwatta-maruf-1997 p.461}"
