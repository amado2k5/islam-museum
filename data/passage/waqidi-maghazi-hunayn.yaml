label: { ar: "غزوة حنين — ثابتو المائة وأهل البيت", en: "Battle of Hunayn — the steadfast hundred and the household", es: "Batalla de Hunayn: el centenar inquebrantable y la casa", fr: "Bataille de Hunayn — la centaine inébranlable et la famille", ur: "حنین کی جنگ - ثابت قدم سو اور گھریلو", tr: "Huneyn Muharebesi — Yüz Sadık Asker ve Hanedanın Halkı", id: "Pertempuran Hunayn — Seratus Orang yang Teguh dan Rakyat dari Rumah" }
text: "بقي رسول الله في نفر من المهاجرين والأنصار وأهل بيته، العباس، وعلي، والفضل بن عباس، وأبو سفيان بن الحارث، وربيعة بن الحارث، وأيمن بن عبيد، وأسامة بن زيد، وأبو بكر، وعمر"
summary:
  ar: "في غزوة حنين، لما انكشف الناس عن النبي بقي في نفر من المهاجرين والأنصار وأهل بيته: العباس وعلي والفضل بن عباس وأبو سفيان بن الحارث وربيعة بن الحارث وأيمن بن عبيد وأسامة بن زيد وأبو بكر وعمر، يقال ثلاثون رجلا وأربعون في رواية أخرى. ويذكر الواقدي في نفس الباب مقتل الحارث بن هشام وخطبة أعرابي للنبي عند الفتح، ثم غزوة الجعرانة ووفد هوازن ومنهم جرير بن عبد الله."
  en: "At Hunayn, when the rout began the Prophet was left with a handful of Emigrants, Helpers and his household: al-Abbas, Ali, al-Fadl ibn al-Abbas, Abu Sufyan ibn al-Harith, Rabi'a ibn al-Harith, Ayman ibn Ubayd, Usama ibn Zayd, Abu Bakr and Umar — thirty or forty men in the rival reports. The same chapter covers the Ja'rana division and the Hawazin delegation."
  es: "En Hunayn, cuando comenzó la derrota, el Profeta se quedó con un puñado de emigrantes, ayudantes y su familia: al-Abbas, Ali, al-Fadl ibn al-Abbas, Abu Sufyan ibn al-Harith, Rabi'a ibn al-Harith, Ayman ibn Ubayd, Usama ibn Zayd, Abu Bakr y Umar; treinta o cuarenta hombres según los relatos contradictorios. El mismo capítulo abarca la división de Ja'rana y la delegación de Hawazin."
  fr: "À Hunayn, au début de la déroute, le Prophète se retrouva avec une poignée d'émigrants, d'alliés et les membres de sa famille: al-Abbas, Ali, al-Fadl ibn al-Abbas, Abu Sufyan ibn al-Harith, Rabi'a ibn al-Harith, Ayman ibn Ubayd, Usama ibn Zayd, Abu Bakr et Umar – une trentaine ou une quarantaine d'hommes selon les sources. Le même chapitre traite de la division de Ja'rana et de la délégation des Hawazin."
  ur: "حنین میں جب غضب کا آغاز ہوا تو نبی کے پاس مٹھی بھر مہاجرین، مددگار اور آپ کے گھر والے رہ گئے: عباس، علی، الفضل بن العباس، ابو سفیان بن حارث، ربیعہ بن الحارث، ایمن بن عبید، اسامہ، ابوذر یا ابو بکر۔ حریف کی رپورٹ اسی باب میں جعرانہ ڈویژن اور ہوازن وفد کا احاطہ کیا گیا ہے۔"
  tr: "Huneyn Muharebesi'nde düşman Peygamber'den dağıldığında, geriye sadece küçük bir grup Muhacir, Ensar ve ailesinden kişiler kaldı: Abbas, Ali, Fedl ibn Abbas, Ebu Sufyan ibn Harith, Rabi'ah ibn Harith, Ayman ibn Ubayd, Usame ibn Zeyd, Ebu Bekir ve Ömer. Bir rivayete göre otuz kişi, başka bir rivayete göre ise kırk kişiydiler. Vakidi aynı bölümde Harith ibn Hişam'ın öldürülmesinden, Mekke'nin fethinde bir Bedevi'nin Peygamber'e yaptığı konuşmadan, Ci'ranah Muharebesi'nden ve aralarında Cerir ibn Abdullah'ın da bulunduğu Havazin heyetinden de bahseder."
  id: "Pada Perang Hunayn, ketika musuh bubar dari Nabi, hanya sekelompok kecil Muhajirin, Ansar, dan anggota keluarganya yang tersisa: Al-Abbas, Ali, Al-Fadl ibn Abbas, Abu Sufyan ibn Al-Harith, Rabi'ah ibn Al-Harith, Ayman ibn Ubayd, Usamah ibn Zayd, Abu Bakr, dan Umar. Dikatakan bahwa ada tiga puluh orang, dan empat puluh menurut riwayat lain. Al-Waqidi juga menyebutkan dalam bab yang sama pembunuhan Al-Harith ibn Hisham, pidato seorang Badui kepada Nabi pada penaklukan Mekah, Perang Al-Ji'ranah, dan delegasi Hawazin, di antaranya adalah Jarir ibn Abdullah."
