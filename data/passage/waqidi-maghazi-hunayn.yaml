ref: "885"
label: { ar: "غزوة حنين — ثابتو المائة وأهل البيت", en: "Battle of Hunayn — the steadfast hundred and the household" }
text: "بقي رسول الله في نفر من المهاجرين والأنصار وأهل بيته، العباس، وعلي، والفضل بن عباس، وأبو سفيان بن الحارث، وربيعة بن الحارث، وأيمن بن عبيد، وأسامة بن زيد، وأبو بكر، وعمر"
summary:
  ar: "في غزوة حنين، لما انكشف الناس عن النبي بقي في نفر من المهاجرين والأنصار وأهل بيته: العباس وعلي والفضل بن عباس وأبو سفيان بن الحارث وربيعة بن الحارث وأيمن بن عبيد وأسامة بن زيد وأبو بكر وعمر، يقال ثلاثون رجلا وأربعون في رواية أخرى. ويذكر الواقدي في نفس الباب مقتل الحارث بن هشام وخطبة أعرابي للنبي عند الفتح، ثم غزوة الجعرانة ووفد هوازن ومنهم جرير بن عبد الله."
  en: "At Hunayn, when the rout began the Prophet was left with a handful of Emigrants, Helpers and his household: al-Abbas, Ali, al-Fadl ibn al-Abbas, Abu Sufyan ibn al-Harith, Rabi'a ibn al-Harith, Ayman ibn Ubayd, Usama ibn Zayd, Abu Bakr and Umar — thirty or forty men in the rival reports. The same chapter covers the Ja'rana division and the Hawazin delegation."
