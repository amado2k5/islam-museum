label: { ar: "الموطأ 1727 — هشام بن عروة عن أبيه عن المسور بن مخرمة: نفست سبيعة الأسلمية بعد وفاة زوجها بليال، فقال لها النبي قد حللت فانكحي من شئت", en: "Muwatta 1727", es: "Muwatta 1727", fr: "Muwatta 1727", ur: "موطا 1727", tr: "El-Muvatta 1727 — Hişam ibn Urve, babasından, o da El-Misver ibn Makhrame'den rivayetle: Subey'ah el-Aslamiyye, kocasının ölümünden birkaç gece sonra doğum yaptı. Bunun üzerine Peygamber ona, \"Artık dilediğinle evlenebilirsin\" dedi.", id: "Al-Muwatta 1727 — Hisham ibn Urwah, berdasarkan riwayat ayahnya, berdasarkan riwayat Al-Miswar ibn Makhramah: Subay'ah Al-Aslamiyyah melahirkan beberapa malam setelah kematian suaminya, lalu Nabi bersabda kepadanya, “Sekarang engkau bebas menikahi siapa pun yang engkau kehendaki.”" }
text: "قَدْ حَللْتِ فَانْكِحي مَن شِئْتِ"
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن المسور بن مخرمة أنه أخبره أن سبيعة الأسلمية نفست بعد وفاة زوجها بليال، فقال لها رسول الله قد حللت فانكحي من شئت. {cite:muwatta-maruf-1997 p.105}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından, o da el-Misver ibn Makhrama'dan rivayetle, Subey'ah el-Aslamiyye'nin kocasının ölümünden birkaç gece sonra bir çocuk doğurduğunu ve Allah Resulü'nün ona, \"Artık dilediğinle evlenebilirsin\" dediğini bildirmiştir. {cite:muwatta-maruf-1997 s.105}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari al-Miswar ibn Makhrama, bahwa ia diberitahu bahwa Subay'ah al-Aslamiyyah melahirkan beberapa malam setelah kematian suaminya, dan Rasulullah SAW bersabda kepadanya, \"Sekarang engkau bebas menikahi siapa pun yang engkau kehendaki.\" {cite:muwatta-maruf-1997 p.105}"
