text: "يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار، ويجتمعون في صلاة العصر وصلاة الفجر"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب جامع الصلاة: أخبر النبي أن ملائكة بالليل وملائكة بالنهار يتعاقبون في الناس ويجتمعون في صلاة العصر وصلاة الفجر، ثم يعرج الذين باتوا فيهم فيسألهم الله وهو أعلم بهم كيف تركوا عباده، فيقولون: تركناهم يصلون وأتيناهم وهم يصلون. ويخرّجه المحقق عند البخاري ⁦(555، 7429، 7486)⁩ ومسلم (2/113) والنسائي (1/240) وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (19/50). {cite:muwatta-maruf-1997 p.241} {cite:muwatta-maruf-1997 p.242}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Komple Namaz bölümünde şöyle nakletmiştir: Peygamberimiz bize, gece meleklerinin ve gündüz meleklerinin insanlar arasında sırayla dolaştığını ve ikindi ve sabah namazlarında bir araya geldiklerini bildirmiştir. Sonra geceyi aralarında geçirenler siper olurlar ve Allah, en iyi bilen, onlara kullarını nasıl bıraktıklarını sorar. Onlar da, \"Onları namaz kılarken bıraktık ve namaz kılarken yanlarına geldik\" diye cevap verirler. Bu hadis, Malik'in sahabelerinin rivayet zincirleriyle Buhari (555, 7429, 7486), Müslim (2/113), Nesai (1/240) ve Ahmed'in hadis külliyatlarında da bulunmaktadır ve Malik, Temhid'e (19/50) atıfta bulunur."
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surat Shalat Lengkap: Nabi memberitahukan kepada kita bahwa malaikat malam dan malaikat siang bergantian di antara manusia dan bertemu pada shalat Ashar dan Subuh. Kemudian orang-orang yang bermalam di antara mereka naik ke surga, dan Allah Yang Maha Mengetahui bertanya kepada mereka bagaimana mereka meninggalkan hamba-hamba-Nya. Mereka menjawab, \"Kami meninggalkan mereka dalam keadaan shalat, dan kami datang kepada mereka ketika mereka sedang shalat.\" Hadits ini juga terdapat dalam kumpulan hadits al-Bukhari (555, 7429, 7486), Muslim (2/113), al-Nasa'i (1/240), dan Ahmad, melalui sanad para sahabat Malik, dan beliau merujuk pada al-Tamhid (19/50)."
