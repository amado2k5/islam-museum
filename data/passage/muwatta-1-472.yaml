label: { ar: "الموطأ 472 — يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار", en: "Muwatta 472" }
text: "يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار، ويجتمعون في صلاة العصر وصلاة الفجر"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب جامع الصلاة: أخبر النبي أن ملائكة بالليل وملائكة بالنهار يتعاقبون في الناس ويجتمعون في صلاة العصر وصلاة الفجر، ثم يعرج الذين باتوا فيهم فيسألهم الله وهو أعلم بهم كيف تركوا عباده، فيقولون: تركناهم يصلون وأتيناهم وهم يصلون. ويخرّجه المحقق عند البخاري (555، 7429، 7486) ومسلم (2/113) والنسائي (1/240) وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (19/50). {cite:muwatta-maruf-1997 p.241} {cite:muwatta-maruf-1997 p.242}"
