text: "… وبالله التوفيق. ذكرُ أحكام رسولِ اللّٰه يع في الطلاق ذكر حكمه لية في طلاق الهازل، وزائل العقل، والمكرَه والتطليق في نفسه في السنن : من حديث أبي هريرة، ثَلاثٌ جِدُّهُنَّ جِدٌّ، وهَزْلُهُنَّ جِدٌّ: النَّكَاحُ، والطَّلاَقُ، والرَّجْعَةُ. أخرجه أبو داود في …"
