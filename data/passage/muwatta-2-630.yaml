label: { ar: "الموطأ 630 — عائشة تصحح قول ابن عمر «إن الميت ليعذب ببكاء الحي»: إنما مر النبي بيهودية يبكي عليها أهلها", en: "Muwatta 630", es: "Muwatta 630", fr: "Muwatta 630", ur: "موطا 630", tr: "El-Muvatta 630 — Aişe, İbn Ömer'in \"Ölen kişi, yaşayanların ağlamasıyla cezalandırılır\" sözünü düzeltiyor: Peygamberimiz, ailesi onun için ağlayan bir Yahudi kadının yanından geçti.", id: "Al-Muwatta 630 — Aisyah mengoreksi pernyataan Ibnu Umar, “Orang yang meninggal dihukum dengan tangisan orang yang masih hidup”: Nabi hanya melewati seorang wanita Yahudi yang keluarganya menangisinya." }
text: "إنكم لتبكون عليها، وإنها لتعذب في قبرها"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن أبيه عن عمرة بنت عبد الرحمن، أنها سمعت عائشة، وذُكر لها أن عبد الله بن عمر يقول إن الميت ليُعذب ببكاء الحي، فقالت: يغفر الله لأبي عبد الرحمن، أما إنه لم يكذب ولكنه نسي أو أخطأ، إنما مر النبي بيهودية يبكي عليها أهلها فقال إنهم ليبكون عليها وإنها لتُعذب في قبرها. ويذكر المحقق أنه رواه عن مالك إسحاق الطباع عند أحمد (6/107)، وسويد، والقعنبي، والتنيسي عند البخاري (1289)، وقتيبة عند مسلم (3/44) والترمذي (1006) والنسائي (4/17)، والشافعي، ومحمد بن الحسن الشيباني (320)، وأن أبا مصعب (997) وعثمان بن عمر روياه عن مالك عن عبد الله بن أبي بكر عن عمرة من غير ذكر «عن أبيه»، وكلتا الروايتين صحيحة لأن عبد الله بن أبي بكر يروي عن أبيه عن عمرة ويروي عن عمرة مباشرة، ويتعجب من أن ابن عبد البر لم يشر إلى هذا الاختلاف. {cite:muwatta-maruf-1997 p.321} {cite:muwatta-maruf-1997 p.322}"
  tr: "Malik, Abdullah bin Ebu Bekir'den, o da babasından, o da Amrah bint Abdülrahman'dan rivayet ettiğine göre, Aişe'nin şöyle dediğini işittiğini ve kendisine Abdullah bin Ömer'in, ölülerin dirilerin ağlamasıyla cezalandırıldığını söylediğinin aktarıldığını anlattı. Bunun üzerine Aişe, \"Allah Ebu Abdülrahman'ı affetsin, ama o yalan söylemedi, sadece unuttu veya hata yaptı\" dedi. Peygamberimiz, ailesi onun için ağlayan bir Yahudi kadının yanından geçerken, \"Onlar onun için ağlıyorlar ve o da kabrinde cezalandırılıyor\" dedi. Araştırmacı, bu hadisin Ahmed'in (6/107) derlemesinde İshak el-Tabba' tarafından Malik'ten, Buhari'nin (1289) derlemesinde Suveyd, el-Ka'nebi ve el-Tunisi tarafından, Müslim'in (3/44), Tirmizi'nin (1006), Nesai'nin (4/17), Şafiî'nin ve Muhammed ibn el-Hasan el-Şeybani'nin (320) derlemelerinde Kuteybe tarafından rivayet edildiğini belirtiyor. Ayrıca, Ebu Musab (997) ve Osman ibn Ömer'in de bu hadisi Malik'ten, Abdullah ibn Ebu Bekir'den, Amre'den rivayet ettiğini, ancak \"babasından rivayetle\" diye belirtmediklerini kaydediyor. Her iki rivayet de sahih kabul ediliyor çünkü Abdullah ibn Ebu Bekir, babasından, Amre'den ve ayrıca doğrudan Amre'den rivayet ediyor. Araştırmacı, İbn Abdülbarr'ın bu tutarsızlıktan bahsetmemesine şaşırdığını ifade ediyor. {cite:muwatta-maruf-1997 s.321} {cite:muwatta-maruf-1997 s.322}"
  id: "Malik meriwayatkannya dari Abdullah bin Abi Bakr, dari ayahnya, dari Amrah binti Abd al-Rahman, bahwa ia mendengar Aisyah, dan disebutkan kepadanya bahwa Abdullah bin Umar berkata bahwa orang mati dihukum oleh tangisan orang hidup, lalu ia berkata: Semoga Allah mengampuni Abu Abd al-Rahman, tetapi ia tidak berbohong, tetapi ia lupa atau melakukan kesalahan. Nabi melewati seorang wanita Yahudi yang keluarganya menangisinya, dan beliau berkata bahwa mereka menangisinya dan bahwa ia sedang dihukum di kuburnya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Ishaq al-Tabba’ dalam kumpulan hadits Ahmad (6/107), dan oleh Suwaid, al-Qa’nabi, dan al-Tunisi dalam kumpulan hadits al-Bukhari (1289), dan oleh Qutaybah dalam kumpulan hadits Muslim (3/44), al-Tirmidhi (1006), al-Nasa’i (4/17), al-Shafi’i, dan Muhammad ibn al-Hasan al-Shaybani (320). Ia juga mencatat bahwa Abu Mus’ab (997) dan Uthman ibn Umar meriwayatkan hadits ini dari Malik, berdasarkan riwayat Abdullah ibn Abi Bakr, berdasarkan riwayat Amrah, tanpa menyebutkan “berdasarkan riwayat ayahnya.” Kedua riwayat tersebut dianggap sahih karena Abdullah ibn Abi Bakr meriwayatkan berdasarkan riwayat ayahnya, berdasarkan riwayat Amrah, dan juga langsung berdasarkan riwayat Amrah. Penyidik menyatakan keheranannya bahwa Ibnu Abd al-Barr tidak menyebutkan perbedaan ini. {cite:muwatta-maruf-1997 p.321} {cite:muwatta-maruf-1997 p.322}"
