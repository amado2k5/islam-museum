label: { ar: "الموطأ 630 — عائشة تصحح قول ابن عمر «إن الميت ليعذب ببكاء الحي»: إنما مر النبي بيهودية يبكي عليها أهلها", en: "Muwatta 630" }
text: "إنكم لتبكون عليها، وإنها لتعذب في قبرها"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر عن أبيه عن عمرة بنت عبد الرحمن، أنها سمعت عائشة، وذُكر لها أن عبد الله بن عمر يقول إن الميت ليُعذب ببكاء الحي، فقالت: يغفر الله لأبي عبد الرحمن، أما إنه لم يكذب ولكنه نسي أو أخطأ، إنما مر النبي بيهودية يبكي عليها أهلها فقال إنهم ليبكون عليها وإنها لتُعذب في قبرها. ويذكر المحقق أنه رواه عن مالك إسحاق الطباع عند أحمد (6/107)، وسويد، والقعنبي، والتنيسي عند البخاري (1289)، وقتيبة عند مسلم (3/44) والترمذي (1006) والنسائي (4/17)، والشافعي، ومحمد بن الحسن الشيباني (320)، وأن أبا مصعب (997) وعثمان بن عمر روياه عن مالك عن عبد الله بن أبي بكر عن عمرة من غير ذكر «عن أبيه»، وكلتا الروايتين صحيحة لأن عبد الله بن أبي بكر يروي عن أبيه عن عمرة ويروي عن عمرة مباشرة، ويتعجب من أن ابن عبد البر لم يشر إلى هذا الاختلاف. {cite:muwatta-maruf-1997 p.321} {cite:muwatta-maruf-1997 p.322}"
