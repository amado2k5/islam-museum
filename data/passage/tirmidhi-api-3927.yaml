text: "… وَأَحْمَدُ بْنُ مَنِيعٍ، وَغَيْرُ، وَاحِدٍ، قَالُوا حَدَّثَنَا أَبُو بَدْرٍ، شُجَاعُ ابْنُ الْوَلِيدِ عَنْ قَابُوسِ بْنِ أَبِي ظَبْيَانَ، عَنْ أَبِيهِ، عَنْ سَلْمَانَ، قَالَ قَالَ لِي رَسُولُ اللَّهِ \" يَا سَلْمَانُ لاَ تُبْغِضْنِي فَتُفَارِقَ دِينَكَ \". قُلْتُ يَا رَسُولَ اللَّهِ كَيْفَ أُبْغِضُكَ وَبِكَ هَدَانَا اللَّهُ قَالَ \" تُبْغِضُ الْعَرَبَ فَتُبْغِضُنِي \". هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3927، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3927 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3927، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
