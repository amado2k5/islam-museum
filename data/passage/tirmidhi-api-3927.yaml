label: { ar: "جامع الترمذي 3927 — الأب والأبوة", en: "Jami' al-Tirmidhi 3927 — the father and fatherhood", ur: "جامع ترمذی 3927 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3927 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3927 — le père et la paternité", tr: "Cami' el-Tirmizi 3927 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3927 — Ayah dan Peran Ayah" }
text: "… وَأَحْمَدُ بْنُ مَنِيعٍ، وَغَيْرُ، وَاحِدٍ، قَالُوا حَدَّثَنَا أَبُو بَدْرٍ، شُجَاعُ ابْنُ الْوَلِيدِ عَنْ قَابُوسِ بْنِ أَبِي ظَبْيَانَ، عَنْ أَبِيهِ، عَنْ سَلْمَانَ، قَالَ قَالَ لِي رَسُولُ اللَّهِ \" يَا سَلْمَانُ لاَ تُبْغِضْنِي فَتُفَارِقَ دِينَكَ \". قُلْتُ يَا رَسُولَ اللَّهِ كَيْفَ أُبْغِضُكَ وَبِكَ هَدَانَا اللَّهُ قَالَ \" تُبْغِضُ الْعَرَبَ فَتُبْغِضُنِي \". هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3927، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3927 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3927، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3927 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3927 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de yer alan 3927 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bunu Kur'an, Sünnet, biyografi ve konuyla ilgili diğer kitaplardan alınan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3927, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hal ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang subjek tersebut."
