label: { ar: "جامع الترمذي 3087 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 3087 — what was made lawful; what is not lawful", ur: "جامع ترمذی 3087 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 3087 — lo que se ha hecho lícito; lo que no es lícito" }
text: "… أَحْرَمُ \". قَالَ فَقَالَ النَّاسُ يَوْمُ الْحَجِّ الأَكْبَرِ يَا رَسُولَ اللَّهِ. قَالَ \" فَإِنَّ دِمَاءَكُمْ وَأَمْوَالَكُمْ وَأَعْرَاضَكُمْ عَلَيْكُمْ حَرَامٌ كَحُرْمَةِ يَوْمِكُمْ هَذَا فِي بَلَدِكُمْ هَذَا فِي شَهْرِكُمْ هَذَا أَلاَ لاَ يَجْنِي جَانٍ إِلاَّ عَلَى نَفْسِهِ وَلاَ يَجْنِي وَالِدٌ عَلَى وَلَدِهِ وَلاَ وَلَدٌ عَلَى وَالِدِهِ أَلاَ إِنَّ الْمُسْلِمَ أَخُو الْمُسْلِمِ فَلَيْسَ يَحِلُّ لِمُسْلِمٍ مِنْ أَخِيهِ شَيْءٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3087، يذكر ما أُحل، وما لا يحل، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3087 (Chapters on Tafsir), that mentions what was made lawful, what is not lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3087، جس میں جو حلال کیا گیا، جو حلال نہیں، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3087 (Capítulos sobre Tafsir), menciona lo que es lícito, lo que no lo es y lo que es ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
