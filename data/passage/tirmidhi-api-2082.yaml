text: "… عَنْ قَتَادَةَ، عَنْ أَبِي الْمُتَوَكِّلِ، عَنْ أَبِي سَعِيدٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ إِنَّ أَخِي اسْتُطْلِقَ بَطْنُهُ. فَقَالَ \" اسْقِهِ عَسَلاً \". فَسَقَاهُ ثُمَّ جَاءَ فَقَالَ يَا رَسُولَ اللَّهِ قَدْ سَقَيْتُهُ عَسَلاً فَلَمْ يَزِدْهُ إِلاَّ اسْتِطْلاَقًا. فَقَالَ رَسُولُ اللَّهِ \" اسْقِهِ عَسَلاً \". فَسَقَاهُ ثُمَّ جَاءَهُ فَقَالَ يَا رَسُولَ اللَّهِ قَدْ سَقَيْتُهُ عَسَلاً فَلَمْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2082، يذكر التداوي بالعسل، وأسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2082 (Chapters on Medicine), that mentions honey as a remedy, named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2082، جس میں شہد سے علاج، بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
