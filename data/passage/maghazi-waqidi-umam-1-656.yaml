text: "… كتاب لا يُدْرَى ما هو حتى قرأَه يهوديٌّ من يهود تَيماء فإذا فيه : يَذقْه يَعْطَبْ هذا سَيْفُ مَرْحَبْ مَنْ حدّثنى محمد بن الفَضل، عن أَبيه، عن جابر.، وحدّثنى زَكَريّا بن زيد، عن عبد الله بن أَبى سُفيان، عن أَبيه، …"
summary:
