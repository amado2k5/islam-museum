text: |-
  ٣٩٨
  *⁦(فصل الفا )⁩
  به ذلك ليدرك ⁦(غنن)⁩ الغنة صوت والخيشوم والاغن لذى يتكلم من قبل خياشيمه يقال
  ظى أغنّ وواد أغن أى كثير العشب لانه اذا كان كذلك ألفه الذيان وفى أصواتها غنة ومنه
  قبل للة ريذ الكثيرة الاهل والعشب فناء وأماة ولهم وادمغن فهوالذى صارفيه صوث
  الذيان ولا يكون الذبان الا فى واد مخصب معشب وأغن السقاءاذا امتلا وأغن الوادى
  فهوم عنّ (⁦( غين)⁩ الغين العماش تقول منه غنت أغين وغانت الابل مثل غامت والغين لغسة
  فى الغيم قال يصف قرسا
  كأنى بين خافيتي عقاب • أصاب حامة فى يوم غبن
  وغين على كذا أى غطى عليه ومنه الحديث انه ليغان على قاه وأنان الفين السماه
  أى البسها قال روية
  أمسى بلال كاربيع المدجن • أمطرفى أكتاف غيم مغين
  فأخرجه على الاصل والغين رف من حروف المعجم والغينة بالكسر ماسال من الجيفة
  وغانت نفسسه تغين غنت أبو عبيدة الاغين الاخضر الى السواد وشجرة غينا أى خضرا.
  كثيرة الورق ملتفة الاغصان والمع غين والغينة الشجراء مثل الغيضة قال أبو العميثل
  الفينة الاشصار الملتفة بلاماء فاذا كانت بماءفهى غيضة
  أدخلته الناراتنظر ماجودته ودينارمفتون قال اللّٰه تعالى انّ الذين فتنوا المؤمنين ويسمى
  الصائغ الفتان وكذلك الشيطان وفى الحديث المؤمن أخو المؤمن يسعهما الماء والشحجر
  ويتعاونان على الفئان يروى بفتح الفاء وضمها فن رواه بالفتح فهو واحد ومن رواه بالضم فهو
  جع وقال انطليل الفتن الاحراق قال اللّٰه تعالى يوم هم على الناريفتنون وورق فمين أى فضة
  محرقة ويقال للحرّة فتين كأن جمارتها محرقة وافتتن الرجل وقتنذ، ومفتون اذا أصابته فتنة
  فذهب ماله أوعة له وكذلك اذا اختبر قال تعالى وفتناك فتونا والفتون أيضا الاقتتان يتعدّى
  ولا يتعدّى ومنه قواهم قلب قاتن أى مفتتن قال الشاعر
  رخيم الكلام قطيع القيام أمسى فؤادى بهافاتنا
  وقتنته المرأة اذا دلهته واقتنته أيضا وأنشدأ بو عبيدة لاعشى همدان
  لتن فتنتنى فهى بالامس أفتذت * سعيدافأمسى قد قلا كل مسلم
  وأنكر الاصمعى أفتذت بالالف والفاتن المضلّ ءن الحق قال الفراء أهل الجازية ولون ما أنتم
  عليه بقاتنين وأهل تعديقولون بمفة:ين من أفتنت وأما فوله تعالى بأيكم المفتون فالباء زائدة
  كأزيدت فقوله تعالى كفى باللّه شهيدا والمفتون الفتنة وهومصدر كالمعقول والجلود
  والهلوف ويكون أيكم مبتدأ والمفتون خبره وقال المازنى المفتون رفع بالابتداء وماقيله
  خبره كقوله-م؟ن مرورك وعلى أيهم نزولت لان الاول فى معنى الظرف وفتنته تفمينا فهو
  مفتن أى مفتون جدا والفتان بكسر الفاءغشاء للرحل من أدم قال لبيد
  تنيت كفى والفتان وغرقى • ومكانهنّ الكور والنسعان
  مجن) الفيجن السذاب ⁦( دن)⁩ الفدن القصر والفدان آلة الثورين للحرث وهو فعال
