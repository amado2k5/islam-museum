text: "… على أسفل مرقاة من المنبر وثاب الناس إليه فحمد االله وأثنى عليه وقال أيها الناس إنه ب لغني أنكم تخافون على الموت كأنه استنكار منكم للموت وما تنكرون من موت نبيكم ألم أنع إليكم وتنعى إليكم أنفسكم هل خلد نبي …"
summary:
  ar: "مقطع من إحياء علوم الدين، المجلد المصوَّر 4، ص 8592، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 4, p. 8592, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 4، ص 8592 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din, volume numérisé 4, p. 8592, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Ihya' 'Ulum al-Din, volumen escaneado 4, p. 8592, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "İhya Ulum el-Din'in 4. cildinin 8592. sayfasından, bir ağıt ve ölüm ilanını içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Ihya Ulum al-Din, Volume 4, halaman 8592, berisi eulogi dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
