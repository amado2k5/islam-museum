label: { ar: "مسلم 1631 — إذا مات الإنسان انقطع عمله إلا من ثلاث", en: "Muslim 1631 — When a person dies their work ends except through three" }
text: "قال رسول الله: «إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة: إلا من صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له»"
summary:
  ar: "رواية أبي هريرة في باب ما يلحق الإنسان من الثواب بعد وفاته من كتاب الوصية في صحيح مسلم؛ الصدقة الجارية والعلم النافع والولد الصالح أبواب الثواب التي تبقى بعد الموت."
