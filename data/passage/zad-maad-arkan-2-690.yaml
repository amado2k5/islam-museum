text: "… تابت؟ فإن قيل: فما تقولون في كسب الزانية إذا قبضته، ثم تابت، هل يجبُ عليها ردُّ ما قبضته إلى أربابه، أم يطيبُ لها، أم تصدَّق به؟ قيل: هذا ينبني على قاعدة عظيمة مِن قواعد الإسلام، وهي أن مَن قبض ما …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 690، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 690, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 2، ص 690 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Zad al-Ma'ad de Ibn al-Qayyim, volumen 2, pág. 690, que menciona los pilares del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Zad al-Ma'ad d'Ibn al-Qayyim (tome 2, p. 690) mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 2. cildinin 690. sayfasından, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 2, halaman 690, yang menyebutkan rukun Islam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
