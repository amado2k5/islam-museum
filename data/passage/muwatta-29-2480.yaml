label: { ar: "الموطأ 2480 — ربيعة: الغرة تقوم خمسين دينارا أو ست مئة درهم، وعشر دية الحرة", en: "Muwatta 2480", es: "Muwatta 2480", fr: "Muwatta 2480", ur: "موطا 2480", tr: "El-Muvatta 2480 — Rabi’ah: Tazminat, elli dinar veya altı yüz dirhemdir ve özgür bir kadın için kan parasının onda biridir.", id: "Al-Muwatta 2480 — Rabi’ah: Kompensasinya adalah lima puluh dinar atau enam ratus dirham, dan sepersepuluh dari uang darah untuk wanita merdeka." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أنه كان يقول: الغرة تُقوَّم خمسين دينارا أو ست مئة درهم، ودية المرأة الحرة المسلمة خمس مئة دينار أو ستة آلاف درهم. قال مالك: فدية جنين الحرة عشر ديتها، والعشر خمسون دينارا أو ست مئة درهم. {cite:muwatta-maruf-1997 p.424} {cite:muwatta-maruf-1997 p.425}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle şöyle der: Bir kadının kan parası elli dinar veya altı yüz dirhemdir; hür bir Müslüman kadının kan parası ise beş yüz dinar veya altı bin dirhemdir. Malik şöyle dedi: Hür bir kadının cenininin kan parası, kan parasının onda biridir ve onda biri elli dinar veya altı yüz dirhemdir. {cite:muwatta-maruf-1997 s.424} {cite:muwatta-maruf-1997 s.425}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa beliau biasa berkata: Ganti rugi darah seorang wanita adalah lima puluh dinar atau enam ratus dirham, dan ganti rugi darah untuk wanita Muslim merdeka adalah lima ratus dinar atau enam ribu dirham. Malik berkata: Ganti rugi darah untuk janin wanita merdeka adalah sepersepuluh dari ganti rugi darahnya, dan sepersepuluh itu adalah lima puluh dinar atau enam ratus dirham. {cite:muwatta-maruf-1997 p.424} {cite:muwatta-maruf-1997 p.425}"
