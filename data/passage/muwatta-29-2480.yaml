summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أنه كان يقول: الغرة تُقوَّم خمسين دينارا أو ست مئة درهم، ودية المرأة الحرة المسلمة خمس مئة دينار أو ستة آلاف درهم. قال مالك: فدية جنين الحرة عشر ديتها، والعشر خمسون دينارا أو ست مئة درهم. {cite:muwatta-maruf-1997 p.424} {cite:muwatta-maruf-1997 p.425}"
