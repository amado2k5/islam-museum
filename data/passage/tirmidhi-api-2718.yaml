text: "لَمَّا أَرَادَ نَبِيُّ اللَّهِ صلى الله عليه وسلم أَنْ يَكْتُبَ إِلَى الْعَجَمِ قِيلَ لَهُ إِنَّ الْعَجَمَ لاَ يَقْبَلُونَ إِلاَّ كِتَابًا عَلَيْهِ خَاتَمٌ فَاصْطَنَعَ خَاتَمًا ‏.‏ قَالَ فَكَأَنِّي أَنْظُرُ إِلَى بَيَاضِهِ فِي كَفِّهِ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ ‏.‏"
summary:
  ar: "في جامع الترمذي؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Jami' al-Tirmidhi; sending a letter or message to a party."
  ur: "جامع ترمذی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
