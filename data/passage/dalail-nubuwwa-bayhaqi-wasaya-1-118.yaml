text: "… وسبعين سنة. وقال الذهبي أيضاً : حضر في أواخر عمره من بيهق إلى نيسابور، وحدث كتبه، ثم حضره الأجل في عاشر جمادى الأولى من سنة ثمان وخمسين وأربعمائة، فنقل في تابوت، فدفن ببيهق. رثاؤه : قال أبو القاسم الزرهي البيهقي …"
summary:
