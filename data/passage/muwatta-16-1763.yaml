label: { ar: "الموطأ 1763 — هشام بن عروة عن أبيه عن عائشة: عمها من الرضاعة استأذن عليها، فسألت النبي فقال إنه عمك فأذني له، وقالت عائشة يحرم من الرضاعة ما يحرم من الولادة", en: "Muwatta 1763", es: "Muwatta 1763", fr: "Muwatta 1763", ur: "موطا 1763", tr: "El-Muvatta 1763 — Hişam ibn Urve, babasından, o da Aişe'den rivayetle: Üvey amcası onunla birlikte olmak için izin istedi. Aişe, Peygamber'e sordu ve Peygamber, \"O senin üvey amcan, ona izin ver\" dedi. Aişe, \"Doğumla haram olan, evlatlıkla da haramdır\" dedi.", id: "Al-Muwatta 1763 — Hisham ibn Urwah, berdasarkan riwayat ayahnya, dari Aisyah: Paman angkatnya meminta izin untuk berhubungan intim dengannya, lalu ia meminta izin kepada Nabi, dan beliau bersabda, “Dia adalah paman angkatmu, maka izinkanlah dia.” Aisyah berkata, “Apa yang dilarang sejak lahir juga dilarang karena hubungan dengan orang tua angkat.”" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين أنها قالت: جاء عمي من الرضاعة يستأذن علي، فأبيت أن آذن له حتى أسأل رسول الله. فجاء رسول الله فسألته، فقال: إنه عمك فأذني له. فقالت: يا رسول الله، إنما أرضعتني المرأة ولم يرضعني الرجل. فقال: إنه عمك فليلج عليك. وقالت عائشة: وذلك بعد ما ضرب علينا الحجاب. وقالت: يحرم من الرضاعة ما يحرم من الولادة. {cite:muwatta-maruf-1997 p.119} {cite:muwatta-maruf-1997 p.120}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Müminlerin Annesi Aişe'den rivayet ettiğine göre, Aişe şöyle demiştir: \"Süt amcam benimle birlikte olmak için izin istemeye geldi, fakat ben Allah'ın Resulü'ne sormadan önce ona izin vermeyi reddettim. Bunun üzerine Allah'ın Resulü geldi, ben ona sordum ve o da: 'O senin amcan, ona izin ver' dedi. Aişe dedi ki: 'Ey Allah'ın Resulü, beni emziren kadındı, erkek değil.' O da: 'O senin amcan, ona izin ver' dedi.\" Aişe dedi ki: \"Bu, hicap ayeti nazil olduktan sonra oldu.\" Ayrıca şöyle dedi: \"Doğumla haram olan, süt yoluyla da haramdır.\""
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, Ummul Mukminin, bahwa dia berkata: Paman angkatku datang meminta izin untuk berhubungan intim denganku, tetapi aku menolak untuk mengizinkannya sampai aku meminta izin kepada Rasulullah. Maka Rasulullah datang, dan aku bertanya kepadanya, dan beliau berkata: Dia adalah pamanmu, maka izinkanlah dia. Dia berkata: Wahai Rasulullah, perempuanlah yang menyusuiku, bukan laki-laki. Beliau berkata: Dia adalah pamanmu, maka izinkanlah dia untuk berhubungan intim denganmu. Aisyah berkata: Ini terjadi setelah ayat hijab diturunkan. Dia juga berkata: Apa yang diharamkan sejak lahir juga diharamkan sejak lahir."
