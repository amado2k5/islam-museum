label: { ar: "الموطأ 1763 — هشام بن عروة عن أبيه عن عائشة: عمها من الرضاعة استأذن عليها، فسألت النبي فقال إنه عمك فأذني له، وقالت عائشة يحرم من الرضاعة ما يحرم من الولادة", en: "Muwatta 1763" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة أم المؤمنين أنها قالت: جاء عمي من الرضاعة يستأذن علي، فأبيت أن آذن له حتى أسأل رسول الله. فجاء رسول الله فسألته، فقال: إنه عمك فأذني له. فقالت: يا رسول الله، إنما أرضعتني المرأة ولم يرضعني الرجل. فقال: إنه عمك فليلج عليك. وقالت عائشة: وذلك بعد ما ضرب علينا الحجاب. وقالت: يحرم من الرضاعة ما يحرم من الولادة. {cite:muwatta-maruf-1997 p.119} {cite:muwatta-maruf-1997 p.120}"
