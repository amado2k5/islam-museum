text: |-
  والدخنة من الالوان كالكدرة فى سوادوكبس أدخن وشاة دخفاء ينسة الدخن وليله
  دخنانة ⁦(ددن)⁩ الددن اللهو واللعب قال عدى
  أيها القلب نعلل بددن • ان همى فى مهاع وأذن
  والددان الرجل لاغناء عنده والددان السيف الكهام لايضى ولم توجدالفاء والعين من
  جنس واحد بلا فاصلة بينهما وهه أمحرّ كتان الافى هانين الكلمتين والديدن الدأب والعادة
  وكذلك الديدان وقال الراجز
  ولا يزال عندهم حفانه • ديدانمم ذاك وذاديدانه
  والديديون اللهو رن) الدرن الوسخ وقددون الثوب بالمكسر فهودرن وأدونه
  صاحبه ودارين اسم فرضة بالبحرين ينسب اليها المسال بقال مسك دارين والنسبة
  اليهادارى قال الفرزدق
  كأن زيكة من ما مزن • ودارى الذكىّ من المدام
  والدرين حطام الموعى اذادم وهوما بلى من الحشيش وقلماتنتفع به الابل
  وقال عمروبن
  كلنوم
  ونحن الحابسون بذى أراط • تسف الجلة الخور الدرينا
  ويقال للأرض المجدبة أم درين قال الشاعر
  تعالى نسمطحب عدد ونغتدى • سوامين والمرعى بأمّ درين
  تقول تعالى نلزم حبناوان ضاق العيش ودرناء وضع وقال الاعشى
  حلأهلى مابين درنافبادولى وحلت علوية بالسخال
  والرجل درنوالمرأندرنينة وقال
  وان طحنت دونية لعيالها * تطبطب ثدياها فطار طحيتها
  ( (رين. الدرابنة البوّابون فارسى معرب قال المثقب يصف نافته
  فأبق باطلى والجسة منها • كد كان الدراينة المطين
  (درخن: الدرخين الداهية بوزن شرحبيل قال الراجز
  أنعت من حيات تحل كشهين * صلّ صقاداهية درخين
  فن دقنت النى فهو مدفون ودفين وادّفن الشعلى افتعل واندفن بمعسى وداه
  دفين لايعلم به وركية دفين ودقان اذا اندفن بعضهاوركايادفن قال لبيد
  سدما قليس لاعهده بأنيسه • من بين أصفرنامع ودفان
  والادّفان أيضا اباق العبد قال أبوزيد الادفان أن يروغ. ن مواليه اليوم واليومين يقال
  عبددفون اذا كان فعو لا لذلات وكان أبو عبيدة يقول هوأن لا يغيب من المصرفى غيبته وناقة
  دفون اذا كان من عادتها أن ت-كون فى وسط الابل والتدافن التكاتم يقال فى الحديث
  لو تكاشقتم لما تداقنتم أى لو يكشف غيب بعضكم لبعض وبقرة دافنة الجذم وهى التى
  انسحقت أضراسها من الهرم والمدفان الستاء البالى واندفى بالتريك ضرب من
  الشياب الحفططة ⁦(دكن)⁩ الدكسة لون يضرب الى السواد وقددكن التوب يدكن
  دكنا وقال الراجز روية • سات عرضائويه لم يدكن• والشئ أدكن قال لبيد
  أغلى
