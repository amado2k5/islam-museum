label: { ar: "الموطأ 210 — قراءة ابن عمر إذا صلى وحده: الفاتحة وسورة في كل ركعة", en: "Muwatta 210", es: "Muwatta 210", fr: "Muwatta 210", ur: "موطا 210", tr: "El-Muvatta 210 — İbn Ömer'in yalnız başına namaz kılarken okuduğu sureler: Her rekatta Fatiha ve bir sure.", id: "Al-Muwatta 210 — Bacaan Ibnu Umar ketika shalat sendirian: Al-Fatihah dan satu surah dalam setiap rakaat" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب القراءة في المغرب والعشاء: كان عبد الله بن عمر إذا صلى وحده قرأ في الركعات الأربع جميعاً في كل ركعة بفاتحة الكتاب وسورة، وكان يقرأ أحياناً بالسورتين والثلاث في الركعة الواحدة من الفريضة، ويقرأ في الركعتين الأوليين من المغرب بالفاتحة وسورة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن عبد الرزاق وابن أبي شيبة والطحاوي رووه من طرق أخرى عن نافع مختصراً. {cite:muwatta-maruf-1997 p.129}"
  tr: "Malik'in Nafi'den rivayet ettiği, akşam ve yatsı namazlarındaki okuma ile ilgili bir rivayet şöyledir: Abdullah ibn Umar, tek başına namaz kılarken, dört rekatın her birinde Fatiha suresini ve bir sureyi okurdu. Bazen farz namazın tek bir rekatında iki veya üç sure okurdu. Akşam namazının ilk iki rekatında ise Fatiha suresini ve bir sureyi okurdu. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini ve Abd el-Razzaq, İbn Abi Şeybe ve el-Tahavi'nin de Nafi'den başka rivayet zincirleriyle kısaltılmış bir biçimde naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.129}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, mengenai bacaan dalam shalat Maghrib dan Isya: Abdullah ibn Umar, ketika shalat sendirian, biasa membaca Al-Fatihah dan satu surah dalam setiap empat rakaat. Terkadang beliau membaca dua atau tiga surah dalam satu rakaat shalat wajib. Pada dua rakaat pertama Maghrib, beliau membaca Al-Fatihah dan satu surah. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan, dan bahwa Abd al-Razzaq, Ibn Abi Shaybah, dan al-Tahawi meriwayatkannya atas otoritas Nafi’ melalui rantai periwayatan lainnya, dalam bentuk yang diringkas. {cite:muwatta-maruf-1997 p.129}"
