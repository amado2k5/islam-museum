label: { ar: "الموطأ 210 — قراءة ابن عمر إذا صلى وحده: الفاتحة وسورة في كل ركعة", en: "Muwatta 210" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب القراءة في المغرب والعشاء: كان عبد الله بن عمر إذا صلى وحده قرأ في الركعات الأربع جميعاً في كل ركعة بفاتحة الكتاب وسورة، وكان يقرأ أحياناً بالسورتين والثلاث في الركعة الواحدة من الفريضة، ويقرأ في الركعتين الأوليين من المغرب بالفاتحة وسورة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن عبد الرزاق وابن أبي شيبة والطحاوي رووه من طرق أخرى عن نافع مختصراً. {cite:muwatta-maruf-1997 p.129}"
