text: "… والصِّيام، والحجُّ. وقوله : ألا أدلُّكَ على أبواب الخير لمَّا رتَّبَ دخولَ الجنَّة على واجبات الإسلام، دلَّه بعد ذلك على أبواب الخيرِ مِنَ النَّوافِل، فإنَّ أفضلَ أولياءِ اللّٰه هُمُ المقرَّبون، الذين يتقرَّبون إليه بالنَّوافل بعدَ أداءِ الفرائض. وقوله : الصومُ …"
summary:
