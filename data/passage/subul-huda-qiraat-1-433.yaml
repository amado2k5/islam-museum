text: "… كما قال أَوْسُ بْنُ حُجْرٍ : أخرجه الترمذي وانظر الشفا، الدرر المنثور أخرجه مسلم كتاب الفضائل -، وأحمد في المسند. هو أوس بن حجر بن عتاب قال أبو عمرو بن العلاء: كان أوس فحل مضر حتى نشأ النابغة وزهير فأخملاه. …"
