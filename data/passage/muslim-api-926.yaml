label: { ar: "صحيح مسلم 926 — الشكوى من العلة، عيادة المريض", en: "Sahih Muslim 926 — a complaint of an ailment; visiting the sick", ur: "صحیح مسلم 926 — بیماری کی شکایت، بیمار کی عیادت", es: "Sahih Muslim 926 — quejarse de una dolencia; visitar a los enfermos", fr: "Sahih Muslim 926 — une plainte concernant un mal; la visite aux malades", tr: "Sahih Muslim 926 — Hastalıktan şikayet etmek, hasta ziyaretinde bulunmak", id: "Sahih Muslim 926 — Mengeluh tentang penyakit, mengunjungi orang sakit" }
text: "… أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدَةُ بْنُ سُلَيْمَانَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتِ اشْتَكَى رَسُولُ اللَّهِ فَدَخَلَ عَلَيْهِ نَاسٌ مِنْ أَصْحَابِهِ يَعُودُونَهُ فَصَلَّى رَسُولُ اللَّهِ جَالِسًا فَصَلَّوْا بِصَلاَتِهِ قِيَامًا فَأَشَارَ إِلَيْهِمْ أَنِ اجْلِسُوا. فَجَلَسُوا فَلَمَّا انْصَرَفَ قَالَ \" إِنَّمَا جُعِلَ الإِمَامُ لِيُؤْتَمَّ بِهِ فَإِذَا رَكَعَ فَارْكَعُوا وَإِذَا رَفَعَ فَارْفَعُوا وَإِذَا صَلَّى جَالِسًا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 926، يذكر الشكوى من العلة، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 926 (The Book of Prayers), that mentions a complaint of an ailment, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 926، جس میں بیماری کی شکایت، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 926 (El Libro de las Oraciones), menciona una queja sobre una dolencia y la visita a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 926 (Le Livre des prières), mentionne une plainte concernant une maladie et la visite aux malades. Le dictionnaire médical le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 926 numaralı hadis, hastalıktan şikayet etmeyi ve hasta ziyaretinde bulunmayı konu edinmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 926, menyebutkan tentang mengeluh sakit dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
