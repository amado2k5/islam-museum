label: { ar: "صحيح مسلم 7215 — الأب والأبوة", en: "Sahih Muslim 7215 — the father and fatherhood", ur: "صحیح مسلم 7215 — باپ اور والدیت" }
text: "… أَبِي جُحَيْفَةَ، ح وَحَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، وَمُحَمَّدُ بْنُ الْمُثَنَّى، وَابْنُ، بَشَّارٍ جَمِيعًا عَنْ يَحْيَى الْقَطَّانِ، - وَاللَّفْظُ لِزُهَيْرٍ - حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنِي عَوْنُ، بْنُ أَبِي جُحَيْفَةَ عَنْ أَبِيهِ، عَنِ الْبَرَاءِ، عَنْ أَبِي أَيُّوبَ، قَالَ خَرَجَ رَسُولُ اللَّهِ بَعْدَ مَا غَرَبَتِ الشَّمْسُ فَسَمِعَ صَوْتًا فَقَالَ \" يَهُودُ تُعَذَّبُ فِي قُبُورِهَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7215، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 7215 (The Book of Paradise, its Description, its Bounties and its Inhabitants), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 7215، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
