text: "… عَنِ النَّبِيِّ قَالَ \" حُرْمَةُ نِسَاءِ الْمُجَاهِدِينَ عَلَى الْقَاعِدِينَ فِي الْحُرْمَةِ كَأُمَّهَاتِهِمْ وَمَا مِنْ رَجُلٍ مِنَ الْقَاعِدِينَ يَخْلُفُ رَجُلاً مِنَ الْمُجَاهِدِينَ فِي أَهْلِهِ إِلاَّ نُصِبَ لَهُ يَوْمَ الْقِيَامَةِ فَيُقَالُ يَا فُلاَنُ هَذَا فُلاَنٌ فَخُذْ مِنْ حَسَنَاتِهِ مَا شِئْتَ \". ثُمَّ الْتَفَتَ النَّبِيُّ إِلَى أَصْحَابِهِ فَقَالَ \" مَا ظَنُّكُمْ تُرَوْنَ يَدَعُ لَهُ مِنْ حَسَنَاتِهِ شَيْئًا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3191، يذكر المقاصة بالحسنات والسيئات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3191 (The Book of Jihad), that speaks of deeds settled between people. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3191، جس میں نیکیوں اور برائیوں سے بدلہ چکانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
