text: "حَدَّثَنَا بُنْدَارٌ قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ عَدِيِّ بْنِ ثَابِتٍ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ، أَنَّهُ سَمِعَ النَّبِيَّ أَوْ قَالَ قَالَ النَّبِيُّ فِي الأَنْصَارِ \" لاَ يُحِبُّهُمْ إِلاَّ مُؤْمِنٌ وَلاَ يَبْغَضُهُمْ إِلاَّ مُنَافِقٌ مَنْ أَحَبَّهُمْ فَأَحَبَّهُ اللَّهُ وَمَنْ أَبْغَضَهُمْ فَأَبْغَضَهُ اللَّهُ \". فَقُلْتُ لَهُ أَأَنْتَ سَمِعْتَهُ مِنَ الْبَرَاءِ فَقَالَ إِيَّاىَ حَدَّثَ. هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3900، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3900 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3900، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
