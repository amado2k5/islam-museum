text: "… في الصحيحين و غيرهما بلفظ ه الايمان بضع وستون أو بضع وسبعون شعبة اعلاها أو فأرفعها أو فأفضلها على اختلاف الروايات قول لا اله الا اللّٰه وادناها اماطة الاذى عن الطريق والحياء شعبة من الايمان فذ كر سبعا وسبعين شعبة …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 3، ص 270، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 3, p. 270, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 3، ص 270 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Muwafaqat de al-Shatibi, volumen 3, pág. 270, que menciona las ramas de la fe, entendida como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait des <i>Mulwafaqat</i> d'al-Shatibi (tome 3, p. 270) mentionnant les piliers de la foi, la foi étant définie comme une soixantaine de branches. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Şatibi'nin El-Muvefakat adlı eserinin 3. cildinin 270. sayfasında, imanın dallarından bahsedilmekte ve imanın yetmişten fazla dalı olduğu belirtilmektedir. Bu, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 3, halaman 270, menyebutkan cabang-cabang iman, dan bahwa iman memiliki lebih dari tujuh puluh cabang. Ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
