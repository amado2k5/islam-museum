text: "… مَعَهُ فَأَمَرَهُ النَّبِيُّ أَنْ يَتَخَيَّرَ أَرْبَعًا مِنْهُنَّ. قَالَ أَبُو عِيسَى هَكَذَا رَوَاهُ مَعْمَرٌ عَنِ الزُّهْرِيِّ عَنْ سَالِمٍ عَنْ أَبِيهِ. قَالَ وَسَمِعْتُ مُحَمَّدَ بْنَ إِسْمَاعِيلَ يَقُولُ هَذَا حَدِيثٌ غَيْرُ مَحْفُوظٍ وَالصَّحِيحُ مَا رَوَى شُعَيْبُ بْنُ أَبِي حَمْزَةَ وَغَيْرُهُ عَنِ الزُّهْرِيِّ قَالَ حُدِّثْتُ عَنْ مُحَمَّدِ بْنِ سُوَيْدٍ الثَّقَفِيِّ أَنَّ غَيْلاَنَ بْنَ سَلَمَةَ أَسْلَمَ وَعِنْدَهُ عَشْرُ نِسْوَةٍ. قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1128، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1128 (The Book on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1128، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
