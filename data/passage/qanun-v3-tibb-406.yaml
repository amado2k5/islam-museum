text: "… بعسل منزوع الرغوة بقدر الكفاية، والشربة مثقال بماء حار، وقيل إن من الأطباء من جعل مكان المرّ قسطاً مرًّا، وحكى صهاريخت أنه وجد في نسخة زيادة من الزعفران جزء، هذا ترياق الأربعة الأدوية، ينفع من لسع العقارب والعناكب، ومن الأمراض …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 406، يذكر التداوي بالعسل، والطب والطبيب، والمرض والمريض، والدواء، والسم والترياق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 406, that mentions honey as a remedy, medicine and the physician, illness and the sick, the drug, poison and antidote; from the machine-read scan, quoted within forty words per the sources policy."
