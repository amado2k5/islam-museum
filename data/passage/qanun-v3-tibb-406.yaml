text: "… بعسل منزوع الرغوة بقدر الكفاية، والشربة مثقال بماء حار، وقيل إن من الأطباء من جعل مكان المرّ قسطاً مرًّا، وحكى صهاريخت أنه وجد في نسخة زيادة من الزعفران جزء، هذا ترياق الأربعة الأدوية، ينفع من لسع العقارب والعناكب، ومن الأمراض …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 406، يذكر التداوي بالعسل، والطب والطبيب، والمرض والمريض، والدواء، والسم والترياق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 406, that mentions honey as a remedy, medicine and the physician, illness and the sick, the drug, poison and antidote; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 406 کا اقتباس جس میں شہد سے علاج، طب اور طبیب، بیماری اور بیمار، دوا، زہر اور تریاق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 406, que menciona la miel como remedio, la medicina y el médico, la enfermedad y el enfermo, el fármaco, el veneno y el antídoto; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 406, qui mentionne le miel comme remède, médicament et médecin, maladie et malades, drogue, poison et antidote; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Bölümünün 406. sayfasından, bal ile tedavi, ilaç ve hekim, hastalık ve hasta, ilaç, zehir ve panzehirden bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 3, hlm. 406, yang menyebutkan pengobatan dengan madu, obat-obatan dan dokter, penyakit dan pasien, obat-obatan, racun dan penawarnya; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
