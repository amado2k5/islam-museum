label:
  ar: "مسلم 1560 — تجاوزوا عن عبدي: الذي كان ييسر على المعسر"
  en: "Muslim 1560 — Pass over My servant: the one who was lenient with debtors"
  ur: "مسلم 1560 — میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا"
text: "تلقت الملائكة روح رجل ممن كان قبلكم فقالوا أعملت من الخير شيئا قال لا . قالوا تذكر . قال كنت أداين الناس فآمر فتياني أن ينظروا المعسر ويتجوزوا عن الموسر - قال - قال الله عز وجل تجوزوا عنه ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 1560: تجاوزوا عن عبدي: الذي كان ييسر على المعسر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 1560: Pass over My servant: the one who was lenient with debtors. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 1560: میرے بندے سے درگزر کرو: جو تنگ دست پر آسانی کرتا تھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
