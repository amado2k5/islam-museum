label: { ar: "الموطأ 2478 — أبو هريرة: امرأتان من هذيل رمت إحداهما الأخرى فأسقطت جنينها فقضى النبي بغرة", en: "Muwatta 2478", es: "Muwatta 2478", fr: "Muwatta 2478", ur: "موطا 2478", tr: "El-Muvatta 2478 — Ebu Hurayra: Hudeyl'den iki kadın birbirlerine taş attılar ve birinin düşük yapmasına sebep oldu. Peygamberimiz para cezası ödenmesi gerektiğine hükmetti.", id: "Al-Muwatta 2478 — Abu Hurairah: Dua wanita dari Hudhayl saling melempar batu, menyebabkan salah satu dari mereka mengalami keguguran. Nabi memutuskan bahwa denda harus dibayarkan." }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف عن أبي هريرة أن امرأتين من هذيل رمت إحداهما الأخرى فطرحت جنينها، فقضى فيه رسول الله بغرة: عبد أو وليدة. {cite:muwatta-maruf-1997 p.423} {cite:muwatta-maruf-1997 p.424}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Selama ibn Abdülrahman ibn Avf'tan, o da Ebu Hurayra'dan rivayet eder ki, Hudeyl kabilesinden iki kadın onlardan birine taş atmış ve bu yüzden kadın düşük yapmıştır. Allah Resulü bunun cezasının erkek veya kadın bir köle olduğunu hükmetmiştir. {cite:muwatta-maruf-1997 s.423} {cite:muwatta-maruf-1997 s.424}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Abu Salama ibn Abd al-Rahman ibn Awf, dari Abu Hurayra, bahwa dua wanita dari suku Hudhayl melempari salah seorang dari mereka dengan batu, menyebabkan wanita tersebut mengalami keguguran. Rasulullah SAW menetapkan bahwa ganti ruginya adalah seorang budak, laki-laki atau perempuan. {cite:muwatta-maruf-1997 p.423} {cite:muwatta-maruf-1997 p.424}"
