text: "… أُبشِّرُكُمْ بأنثاه كان في جيش تيمورلنك كثيرٌ من الفيَلة، فبعث بواحد منها إلى قرية الشيخ يرعى هناك، فلم يُبْقِ في مزروعاتِ القرية، ولم يذرْ، فاجتمع القرويون بالشيخ ورجوا منه أن يرفع عنهم هذه النازلة. فأخذهم وتوجَّه بهم لمقابلة تيمورلنك، ولمَّا …"
summary:
  ar: "رعى فيلٌ من جيش تيمور لنك في زروع قرية جحا وأفسدها، فطلب الأهالي من جحا أن يتوسط لهم، فذهب بهم إلى تيمور وقال إن الفيل مشتاق إلى أنثاه وطلب له أنثى، فأعطى تيمور هدايا وأرسل فيلة إلى القرية، فقال جحا للأهالي إنهم نالوا أنثى أيضاً. {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  en: "An elephant from Timur's army grazes and ruins the crops of Juha's village, and the villagers ask Juha to intercede. Juha takes them to Timur, says the elephant misses its mate, and asks for a female for it. Timur gives gifts and sends elephants to the village, and Juha tells the villagers that they have been granted a female too. {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  ur: "تیمور لنگ کی فوج کا ایک ہاتھی جحا کے گاؤں کی فصلیں چر کر خراب کر دیتا ہے اور گاؤں والے جحا سے سفارش کرنے کو کہتے ہیں۔ جحا انہیں تیمور کے پاس لے جاتا ہے، کہتا ہے کہ ہاتھی کو اپنی ساتھی یاد آتی ہے، اور اس کے لیے ایک مادہ مانگتا ہے۔ تیمور تحفے دیتا ہے اور گاؤں میں ہاتھی بھیج دیتا ہے، تو جحا گاؤں والوں سے کہتا ہے کہ انہیں بھی ایک مادہ عطا ہوئی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  fr: "Un éléphant de l'armée de Timur broute et ravage les cultures du village de Juha, et les villageois demandent à Juha d'intercéder. Juha les conduit chez Timur, dit que l'éléphant regrette sa compagne et demande une femelle pour lui. Timur offre des cadeaux et envoie des éléphants au village, et Juha déclare aux villageois qu'on leur a accordé une femelle à eux aussi. {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  es: "Un elefante del ejército de Timur pasta y arruina los cultivos del pueblo de Juha, y los aldeanos piden a Juha que interceda. Juha los lleva ante Timur, dice que el elefante añora a su pareja y pide una hembra para él. Timur da regalos y envía elefantes al pueblo, y Juha dice a los aldeanos que a ellos también se les ha concedido una hembra. {cite:juha-nawadir-kubra-djuwaydi p. 91}"
