text: "… أراد أن يقوم من الديوان قطع رءوس الأقلام حتّى لا يراها أحد. وقال إسحاق بن حَمّاد : لاحذْقَ لغير مميز لصنوف البِرَاية. ورأىٰ إبراهيم بن المحبس رجلا يأخذ علىٰ جاريةٍ قَلَمَ الثلث، فقال : أعلمتها البِرَاية؟ قال : لا، قال …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 3، ص 446، يذكر الخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 3, p. 446, that mentions the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 3، ص 446 کا اقتباس جس میں خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Subh al-A'sha de al-Qalqashandi, volumen 3, pág. 446, que menciona los alfabetos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 3, p. 446) évoque les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin resimli 3. cildinin 446. sayfasından bir alıntı, yazı ve alfabelerden bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Kur'an okunuşları, yazı, alfabeler ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Subh al-A'sha karya Al-Qalqashandi, jilid bergambar 3, halaman 446, menyebutkan tentang aksara dan tulisan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, dan tanda diakritik."
