text: "… إنكَ لنْ خلفَ بَعدي فتعملَ عملاً تريدُ بهِ وجهَ اللّهِ إلا ازددتَ بهِ درجةً ورفعةً، ولعلكَ أنْ تخلَّفَ بعدي، فينفعَ اللَّهُ بكَ أقواماً ويضرَّ بكَ آخرينَ، اللهمَّ امضٍ لأصحابي هجرتَهم، ولا ترُدَّهم على أعقابهمْ لكنَّ البائسَ سعدُ بن خولة، رثى …"
summary:
