label: { ar: "الموطأ 49 — أم سلمة: الذيل الطويل يطهره ما بعده", en: "Muwatta 49", es: "Muwatta 49", fr: "Muwatta 49", ur: "موطا 49", tr: "Al-Muwatta 49 — Umm Salamah: Uzun kuyruk, onu takip eden şeyle temizlenir.", id: "Al-Muwatta 49 — Umm Salamah: Ekor yang panjang disucikan oleh apa yang mengikutinya" }
text: "يطهره ما بعده"
summary:
  ar: "أول حديث في باب ما لا يجب منه الوضوء. يرويه يحيى عن مالك عن محمد بن عمارة عن محمد بن إبراهيم التيمي عن أم ولد لإبراهيم بن عبد الرحمن بن عوف، أنها سألت أم سلمة زوج النبي عن ذيل ثوبها الطويل تمشي به في المكان القذر، فأخبرتها أن النبي قال إن ما بعده من الأرض الطاهرة يطهره. ويذكر المحقق أن أم الولد اسمها حميدة وأنها مجهولة تفرد بالرواية عنها محمد بن إبراهيم وحكم الذهبي بجهالتها، ويخرّج الحديث عند أبي داود (383) والترمذي (143) وابن ماجه (531) والدارمي، ويذكر له شاهداً صحيحاً من حديث امرأة من بني عبد الأشهل عند أحمد وأبي داود (384) وابن ماجه (533) يتقوى به حديث أم سلمة. {cite:muwatta-maruf-1997 p.59}"
  tr: "Abdest gerektirmeyen şeyler bölümündeki ilk hadis. Yahya, Malik'ten, o da Muhammed ibn Ammarah'tan, o da Muhammed ibn İbrahim el-Taymi'den, o da İbrahim ibn Abdurrahman ibn Avf'ın cariyesinden rivayet etmiştir. Cariye, Peygamberimizin eşi Ümmü Seleme'ye, kirli yerlerde yürürken elbisesinin uzun eteği hakkında sormuş. Ümmü Seleme, Peygamberimizin, \"Onun ötesindeki temiz toprak onu temizler\" dediğini aktarmıştır. Editör, cariyenin adının Hamidah olduğunu ve bilinmediğini belirtmektedir. Sadece Muhammed ibn İbrahim ondan rivayet etmiş ve Zehebi onun bilinmediğine hükmetmiştir. Hadis, Ebu Davud (383), Tirmizi (143), İbn Majah (531) ve Darimi'nin hadis külliyatlarında bulunmaktadır. Ahmed, Ebu Davud (384) ve İbn Majah'ın (533) derlemelerinde bulunan, Beni Abdüleşhal kabilesinden bir kadından rivayet edilen sağlam bir destekleyici rivayet, Ümmü Seleme hadisini güçlendirmektedir. {cite:muwatta-maruf-1997 s.59}"
  id: "Hadits pertama dalam bab tentang hal-hal yang tidak memerlukan wudhu. Diriwayatkan oleh Yahya dari Malik, dari Muhammad ibn 'Ammarah, dari Muhammad ibn Ibrahim al-Taymi, dari seorang selir Ibrahim ibn 'Abd al-Rahman ibn 'Awf, bahwa ia bertanya kepada Umm Salamah, istri Nabi, tentang ujung pakaiannya yang panjang ketika ia berjalan di tempat-tempat yang najis. Umm Salamah memberitahunya bahwa Nabi bersabda bahwa tanah yang bersih di baliknya akan menyucikannya. Editor menyebutkan bahwa nama selir tersebut adalah Hamidah dan bahwa ia tidak dikenal. Muhammad ibn Ibrahim adalah satu-satunya yang meriwayatkan darinya, dan al-Dhahabi menyatakan bahwa ia tidak dikenal. Hadits ini ditemukan dalam kumpulan Abu Dawud (383), al-Tirmidhi (143), Ibn Majah (531), dan al-Darimi. Riwayat pendukung yang sahih disebutkan dari seorang wanita dari Banu 'Abd al-Ashhal, yang terdapat dalam kumpulan hadits Ahmad, Abu Dawud (384), dan Ibn Majah (533), yang memperkuat hadits Umm Salamah. {cite:muwatta-maruf-1997 p.59}"
