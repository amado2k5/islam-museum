label: { ar: "الموطأ 49 — أم سلمة: الذيل الطويل يطهره ما بعده", en: "Muwatta 49" }
text: "يطهره ما بعده"
summary:
  ar: "أول حديث في باب ما لا يجب منه الوضوء. يرويه يحيى عن مالك عن محمد بن عمارة عن محمد بن إبراهيم التيمي عن أم ولد لإبراهيم بن عبد الرحمن بن عوف، أنها سألت أم سلمة زوج النبي عن ذيل ثوبها الطويل تمشي به في المكان القذر، فأخبرتها أن النبي قال إن ما بعده من الأرض الطاهرة يطهره. ويذكر المحقق أن أم الولد اسمها حميدة وأنها مجهولة تفرد بالرواية عنها محمد بن إبراهيم وحكم الذهبي بجهالتها، ويخرّج الحديث عند أبي داود (383) والترمذي (143) وابن ماجه (531) والدارمي، ويذكر له شاهداً صحيحاً من حديث امرأة من بني عبد الأشهل عند أحمد وأبي داود (384) وابن ماجه (533) يتقوى به حديث أم سلمة. {cite:muwatta-maruf-1997 p.59}"
