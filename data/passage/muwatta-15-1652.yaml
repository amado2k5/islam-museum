label: { ar: "الموطأ 1652 — مالك: الرجل يطلق امرأته، فإذا مضت الثلاثة الأشهر قالت المرأة أنا حامل، فإن أنكر زوجها حملها لاعنها", en: "Muwatta 1652", es: "Muwatta 1652", fr: "Muwatta 1652", ur: "موطا 1652", tr: "El-Muvatta 1652 — Malik: Bir adam karısını boşadığında, üç ay geçtikten sonra kadın, “Hamileyim” derse ve kocası hamileliği inkar ederse, ona lanet okumalıdır.", id: "Al-Muwatta 1652 — Malik: Seorang pria menceraikan istrinya, dan jika tiga bulan berlalu dan wanita itu berkata, “Aku hamil,” maka jika suaminya menyangkal kehamilannya, maka ia harus mengutuknya." }
summary:
  ar: "يقول مالك في الرجل يطلق امرأته، فإذا مضت الثلاثة الأشهر قالت المرأة أنا حامل، إن أنكر زوجها حملها لاعنها. {cite:muwatta-maruf-1997 p.80}"
  tr: "Malik, karısından boşanan bir adam hakkında şöyle der: Üç ay geçtikten sonra kadın \"Hamileyim\" derse, eğer kocası hamileliği inkar ederse, adam ona lanet okumalıdır. {cite:muwatta-maruf-1997 s.80}"
  id: "Malik berkata mengenai seorang pria yang menceraikan istrinya, lalu tiga bulan berlalu dan wanita itu berkata, \"Saya hamil,\" jika suaminya menyangkal kehamilannya, maka ia harus mengutuk istrinya. {cite:muwatta-maruf-1997 p.80}"
