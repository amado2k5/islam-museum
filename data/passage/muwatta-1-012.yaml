label: { ar: "الموطأ 12 — القاسم بن محمد: أدركت الناس يصلون الظهر بعشي", en: "Muwatta 12" }
text: "ما أدركت الناس إلا وهم يصلون الظهر بعشي"
summary:
  ar: "أثر يرويه مالك عن ربيعة بن أبي عبد الرحمن عن القاسم بن محمد، يختم به باب وقوت الصلاة: لم يدرك القاسم أهل المدينة إلا وهم يصلون الظهر بعد الزوال حين يميل النهار إلى العشي، أي أنهم كانوا يبردون بها. ويذكر المحقق أنه رواه عن مالك أبو مصعب الزهري وسويد بن سعيد. {cite:muwatta-maruf-1997 p.40}"
  en: "Al-Qasim ibn Muhammad reports what he found the people doing about the times of the noon and afternoon prayers (a mawquf report)."
