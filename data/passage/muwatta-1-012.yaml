label: { ar: "الموطأ 12 — القاسم بن محمد: أدركت الناس يصلون الظهر بعشي", en: "Muwatta 12", es: "Muwatta 12", fr: "Muwatta 12", ur: "موطا 12", tr: "El-Muvatta 12 — El-Kâsım ibn Muhammed: Akşam vakti öğle namazı kılan insanları gördüm.", id: "Al-Muwatta 12 — Al-Qasim ibn Muhammad: Aku melihat orang-orang melaksanakan salat Zuhur di waktu malam." }
text: "ما أدركت الناس إلا وهم يصلون الظهر بعشي"
summary:
  ar: "أثر يرويه مالك عن ربيعة بن أبي عبد الرحمن عن القاسم بن محمد، يختم به باب وقوت الصلاة: لم يدرك القاسم أهل المدينة إلا وهم يصلون الظهر بعد الزوال حين يميل النهار إلى العشي، أي أنهم كانوا يبردون بها. ويذكر المحقق أنه رواه عن مالك أبو مصعب الزهري وسويد بن سعيد. {cite:muwatta-maruf-1997 p.40}"
  en: "Al-Qasim ibn Muhammad reports what he found the people doing about the times of the noon and afternoon prayers (a mawquf report)."
  es: "Al-Qasim ibn Muhammad relata lo que encontró que hacía la gente con respecto a los horarios de las oraciones del mediodía y de la tarde (un informe mawquf)."
  fr: "Al-Qasim ibn Muhammad rapporte ce qu'il a trouvé que les gens faisaient aux heures des prières de midi et de l'après-midi (un rapport mawquf)."
  ur: "القاسم بن محمد بیان کرتے ہیں کہ انہوں نے لوگوں کو ظہر اور عصر کی نمازوں کے اوقات میں کیا کرتے پایا ⁦(ایک موقوف رپورٹ)⁩۔"
  tr: "Malik'in, Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da al-Qasim ibn Muhammad'dan rivayet ettiği ve namaz vakitleri bölümünü sonlandıran bir hadiste şöyle denmektedir: Al-Qasim, Medine halkının öğle vaktinden sonra, günün akşama doğru dönmeye başladığı saatlerde öğle namazını kılmadığını görmüştür; bu da serinlemek için kıldıkları anlamına gelmektedir. Editör, bu hadisin Malik'ten Ebu Mus'ab al-Zuhri ve Suwayd ibn Sa'id tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.40}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Rabi'ah ibn Abi 'Abd al-Rahman atas otoritas al-Qasim ibn Muhammad, yang mengakhiri bab tentang waktu shalat: Al-Qasim tidak mendapati penduduk Madinah mengerjakan shalat Zuhur setelah tengah hari, ketika hari mulai menjelang senja, artinya mereka mengerjakannya untuk mendinginkan suasana. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab al-Zuhri dan Suwayd ibn Sa'id. {cite:muwatta-maruf-1997 p.40}"
