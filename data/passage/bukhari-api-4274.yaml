text: "… وَلَمْ أَكُنْ مِنْ أَنْفُسِهَا ـ وَكَانَ مَنْ مَعَكَ مِنَ الْمُهَاجِرِينَ مَنْ لَهُمْ قَرَابَاتٌ، يَحْمُونَ أَهْلِيهِمْ وَأَمْوَالَهُمْ، فَأَحْبَبْتُ إِذْ فَاتَنِي ذَلِكَ مِنَ النَّسَبِ فِيهِمْ أَنْ أَتَّخِذَ عِنْدَهُمْ يَدًا يَحْمُونَ قَرَابَتِي، وَلَمْ أَفْعَلْهُ ارْتِدَادًا عَنْ دِينِي، وَلاَ رِضًا بِالْكُفْرِ بَعْدَ الإِسْلاَمِ. فَقَالَ رَسُولُ اللَّهِ \" أَمَا إِنَّهُ قَدْ صَدَقَكُمْ \". فَقَالَ عُمَرُ يَا رَسُولَ اللَّهِ دَعْنِي أَضْرِبْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4274، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4274 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4274، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4274 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
