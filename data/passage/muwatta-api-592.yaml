label: { ar: "موطأ مالك 592 — اليتيم وفقد الأب", en: "Muwatta Malik 592 — the orphan and the father lost", ur: "موطأ مالک 592 — یتیم اور باپ کی موت" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، أَنَّهُ اشْتَرَى لِبَنِي أَخِيهِ - يَتَامَى فِي حَجْرِهِ - مَالاً فَبِيعَ ذَلِكَ الْمَالُ بَعْدُ بِمَالٍ كَثِيرٍ. قَالَ مَالِكٌ لاَ بَأْسَ بِالتِّجَارَةِ فِي أَمْوَالِ الْيَتَامَى لَهُمْ إِذَا كَانَ الْوَلِيُّ مَأْذُونًا فَلاَ أَرَى عَلَيْهِ ضَمَانًا."
summary:
  ar: "حديث في موطأ مالك، رقم 592، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 592 (Zakat), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 592، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
