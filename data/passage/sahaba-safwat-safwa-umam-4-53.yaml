text: "… : اللهم عليك الملأ من قريش، اللهم عليك بعتبة بن ربيعة، اللهم عليك بشيبة بن ربيعة، اللهم عليك بأبي جهل ابن هشام، اللهم عليك بعقبة بن أبي معيط، اللهم عليك بأبي بن خلف أو أمية بن خلف. قال عبد الله: …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 53، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
