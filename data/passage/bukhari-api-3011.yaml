label: { ar: "صحيح البخاري 3011 — مضاعفة الأجر، الأجران", en: "Sahih al-Bukhari 3011 — the reward doubled or multiplied; the double reward", ur: "صحیح بخاری 3011 — اجر کا دوگنا یا کئی گنا ہونا، دوہرا اجر" }
text: "… قَالَ سَمِعْتُ الشَّعْبِيَّ، يَقُولُ حَدَّثَنِي أَبُو بُرْدَةَ، أَنَّهُ سَمِعَ أَبَاهُ، عَنِ النَّبِيِّ قَالَ \" ثَلاَثَةٌ يُؤْتَوْنَ أَجْرَهُمْ مَرَّتَيْنِ الرَّجُلُ تَكُونُ لَهُ الأَمَةُ فَيُعَلِّمُهَا فَيُحْسِنُ تَعْلِيمَهَا، وَيُؤَدِّبُهَا فَيُحْسِنُ أَدَبَهَا، ثُمَّ يُعْتِقُهَا فَيَتَزَوَّجُهَا، فَلَهُ أَجْرَانِ، وَمُؤْمِنُ أَهْلِ الْكِتَابِ الَّذِي كَانَ مُؤْمِنًا، ثُمَّ آمَنَ بِالنَّبِيِّ فَلَهُ أَجْرَانِ، وَالْعَبْدُ الَّذِي يُؤَدِّي حَقَّ اللَّهِ وَيَنْصَحُ لِسَيِّدِهِ \". ثُمَّ قَالَ الشَّعْبِيُّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3011، يذكر مضاعفة الأجر، والأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 3011 (Fighting for the Cause of Allah (Jihaad)), that speaks of the reward doubled or multiplied, the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 3011، جس میں اجر کا دوگنا یا کئی گنا ہونا، دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
