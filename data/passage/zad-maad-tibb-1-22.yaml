text: "… وعادت موارِدُ شفائه وهي معاطبه لكثرة المنحرفين والمحرِّفين، فليس له مُعَوَّل إلَّا عِلى الصبرِ الجميل، وما له ناصر ولا معين إلَّا اللَّه وحده وهو حسبُنا ونعم الوكيل. المتعقدة في الجسد، والبجر : العروق المتعقدة في البطن خاصة. وكسرهما : إذا …"
