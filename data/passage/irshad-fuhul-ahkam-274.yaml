text: "… فيه الرخص من زال العلماء وما احتج به كل منهم. فقلت مصنف هذا زنديق فقال لم تسح هذه الأحاديث على مارويت ولكن من أباح المسكر لم يبح المتمة ومن أباح المتعة لم يبح الغناء والمسكر وما من عالم إلا وله …"
summary:
  ar: "مقطع من إرشاد الفحول للشوكاني، ص 274، يرد فيه ذكر المباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shawkani's Irshad al-Fuhul, p. 274, whose wording mentions the permitted (mubah), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ارشاد الفحول، شوکانی، ص 274 کا اقتباس جس میں مباح، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Irshad al-Fuhul de al-Shawkani, p. 274, dont le texte mentionne le permis (mubah), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Irshad al-Fuhul de al-Shawkani, p. 274, cuyo texto menciona lo permitido (mubah), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şavani'nin *İrshad el-Fuhul* adlı eserinin 274. sayfasından, caiz ve caiz olmayan fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Zorunlu, tavsiye edilen, mekruh edilen, yasaklanan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Irshad al-Fuhul* karya Al-Shawkani, halaman 274, yang menyebutkan amalan yang diperbolehkan dan yang dapat dihindari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk dosa-dosa wajib, anjuran, yang tidak disukai, yang dilarang, dan dosa-dosa kecil."
