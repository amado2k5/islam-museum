text: "لا تقوم الساعة حتى يمر الرجل بقبر الرجل فيقول: يا ليتني مكانه"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي أخبر أن الساعة لا تقوم حتى يمر الرجل بقبر الرجل فيتمنى أن يكون مكانه. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (6707)، وإسماعيل بن أبي أويس عند البخاري (7115)، وسويد، والقعنبي، وابن مهدي عند أحمد، وقتيبة عند مسلم (8/182). {cite:muwatta-maruf-1997 p.330}"
