text: "… تفتن في دينها. ثم ذكر صهرًا له من بني عبد شمس فأثنى عليه في مصاهرته إياه، فأحسن، قال : حدِّثني نصدقني، ووعدني فوفى لي، وإني لست أحرم حلالاً، ولا أحل حرامًا ولكن والله لا تجتمع بنت رسول اللّٰه وبنتُ عدو …"
