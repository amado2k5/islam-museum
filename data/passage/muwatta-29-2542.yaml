summary:
  ar: "قال مالك: القائد والسائق والراكب كلهم ضامن لما أصابت الدابة، إلا أن ترمح الدابة من غير أن يُفعل بها شيء ترمح له. وقد قضى عمر بن الخطاب في الذي أجرى فرسه بالعقل. قال مالك: فالقائد والراكب والسائق أحرى أن يغرموا من الذي أجرى فرسه. {cite:muwatta-maruf-1997 p.441}"
