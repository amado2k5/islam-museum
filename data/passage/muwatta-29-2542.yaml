label: { ar: "الموطأ 2542 — مالك: القائد والسائق والراكب ضامنون لما أصابت الدابة", en: "Muwatta 2542", es: "Muwatta 2542", fr: "Muwatta 2542", ur: "موطا 2542", tr: "Al-Muwatta 2542 — Malik: Hayvanın neden olduğu her türlü zarardan önder, sürücü ve binici sorumludur.", id: "Al-Muwatta 2542 — Malik: Pemimpin, pengemudi, dan penunggang bertanggung jawab atas segala kerusakan yang disebabkan oleh hewan tersebut." }
summary:
  ar: "قال مالك: القائد والسائق والراكب كلهم ضامن لما أصابت الدابة، إلا أن ترمح الدابة من غير أن يُفعل بها شيء ترمح له. وقد قضى عمر بن الخطاب في الذي أجرى فرسه بالعقل. قال مالك: فالقائد والراكب والسائق أحرى أن يغرموا من الذي أجرى فرسه. {cite:muwatta-maruf-1997 p.441}"
  tr: "Malik şöyle dedi: Hayvanın sebepsiz yere tekme atması durumu hariç, hayvanın neden olduğu her türlü zarardan lider, sürücü ve binici sorumludur. Ömer ibn el-Hattab, atını koşturan kişinin kan parası ödemesi gerektiğine hükmetti. Malik şöyle dedi: Lider, binici ve sürücünün sorumluluğu, atını koşturan kişiden daha fazladır. {cite:muwatta-maruf-1997 s.441}"
  id: "Malik berkata: Pemimpin, pengemudi, dan penunggang semuanya bertanggung jawab atas segala kerugian yang disebabkan oleh hewan tersebut, kecuali jika hewan tersebut menendang tanpa provokasi. Umar ibn al-Khattab memutuskan bahwa orang yang menyebabkan kudanya lari harus membayar uang darah. Malik berkata: Pemimpin, penunggang, dan pengemudi lebih mungkin bertanggung jawab daripada orang yang menyebabkan kudanya lari. {cite:muwatta-maruf-1997 p.441}"
