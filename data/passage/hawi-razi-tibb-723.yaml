text: "أمراض الرئة الفرق بين ذات الجنب وورم الكبد وورم الرئة والحجاب من كتاب مداواة الأسقام المنسوب إلى ج: قال: يحرق الكرنب ويخلط رماده بشحم الحمار ويضمد به الجنب الوجع فإنه يسكن الوجع سريعاً. أغلوقن : ذات الجنب إذا كانت قوية …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 723، يذكر المرض والمريض، والسقم، والوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 723, that mentions illness and the sick, sickness, pain, named diseases, the organs of the body, surgery, circumcision and splints, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 723 کا اقتباس جس میں بیماری اور بیمار، سقم، درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
