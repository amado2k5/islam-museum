  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 723. sayfasından bir bölüm; hastalık ve hasta, rahatsızlık, ağrı, hastalıkların isimleri, vücut parçaları, ameliyat, sünnet, atel ve tedaviden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
