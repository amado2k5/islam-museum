summary:
  ar: "القسم 73 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأضاحي»، ويضم فيها النصوص من 5545 إلى 5574 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 73 of Sahih al-Bukhari (Al-Adha Festival Sacrifice (Adaahi)) in the division of the open hadith dataset the museum took its reports from: reports 5545 to 5574 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 73، عنوان «کتاب الاضاحی»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5545 تا 5574۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 73 de Sahih al-Bukhari (Sacrificio de la Fiesta de Al-Adha (Adaahi)) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5545 al 5574 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih al-Bukhari (Livre 73, Sacrifice de la fête d'Al-Adha): il s'agit des hadiths 5545 à 5574, selon la numérotation de ce recueil. Le musée classe ses archives relatives à ces hadiths dans ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 73. bölümü \"Kurbanlar Kitabı\" başlığını taşımakta olup, 5545 ile 5574 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 73 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Kurban\" dan berisi teks 5545 hingga 5574, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
