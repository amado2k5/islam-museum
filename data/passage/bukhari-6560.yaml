label:
  ar: "البخاري 6560 — أخرجوا من النار من كان في قلبه مثقال حبة من خردل من إيمان"
  en: "Bukhari 6560 — Bring out of the Fire whoever has a mustard seed's weight of faith"
  ur: "بخاری 6560 — آگ سے اسے نکالو جس کے دل میں رائی کے دانے برابر ایمان ہو"
text: "إذا دخل أهل الجنة الجنة، وأهل النار النار يقول الله من كان في قلبه مثقال حبة من خردل من إيمان فأخرجوه. فيخرجون قد امتحشوا وعادوا حمما، فيلقون في نهر الحياة، فينبتون كما تنبت الحبة في حميل السيل أو قال حمية …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6560: أخرجوا من النار من كان في قلبه مثقال حبة من خردل من إيمان. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6560: Bring out of the Fire whoever has a mustard seed's weight of faith. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6560: آگ سے اسے نکالو جس کے دل میں رائی کے دانے برابر ایمان ہو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
