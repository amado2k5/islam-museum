text: "… بنوعِ كذا وكذا. - حدثني أبي، ثنا بهزّ، ثنا شُعبة، حدثني عبد اللّٰه بن عبد اللّٰه بن جَبرٍ الأنصاري، قال: سمعت أنس بن مالك صيته يقول: قال رسول الله لَا يهة آيةُ النفاقِ : بُغضُ الأنصَارِ، وآيةُ الإيمانِ: حُبُّ الأنصار. …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 391، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 391, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 391 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de Abd Allah ibn Ahmad, pág. 391, que menciona la dulzura y la plenitud de la fe; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'Abd Allah ibn Ahmad, p. 391, évoquant la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, imanın tatlılığı ve mükemmelliğinden bahseden 391. sayfadan bir alıntı; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 391, yang menyebutkan manisnya dan kesempurnaan iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
