text: "… بنوعِ كذا وكذا. - حدثني أبي، ثنا بهزّ، ثنا شُعبة، حدثني عبد اللّٰه بن عبد اللّٰه بن جَبرٍ الأنصاري، قال: سمعت أنس بن مالك صيته يقول: قال رسول الله لَا يهة آيةُ النفاقِ : بُغضُ الأنصَارِ، وآيةُ الإيمانِ: حُبُّ الأنصار. …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 391، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 391, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 391 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
