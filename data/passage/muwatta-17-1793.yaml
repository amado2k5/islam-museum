label: { ar: "الموطأ 1793 — يحيى عن مالك عن يحيى بن سعيد عن سالم بن عبد الله: باع عبد الله بن عمر غلاما له بثمانمائة درهم بالبراءة، فادعى المشتري عيبا، فحكم عثمان بن عفان أن يحلف ابن عمر، فأبى، فارتجع العبد فصح عنده، فباعه بألف وخمسمائة", en: "Muwatta 1793" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سالم بن عبد الله أن عبد الله بن عمر باع غلاما له بثمانمائة درهم، وباعه بالبراءة. فقال الذي ابتاعه لعبد الله بن عمر: بالغلام داء لم تسمه لي. فاختصما إلى عثمان بن عفان، فقال الرجل: باعني عبدا وبه داء لم يسمه لي. وقال عبد الله: بعته بالبراءة. فقضى عثمان على عبد الله بن عمر أن يحلف له لقد باعه العبد وما به داء يعلمه. فأبى عبد الله أن يحلف، وارتجع العبد، فصح عنده، فباعه عبد الله بعد ذلك بألف وخمسمائة درهم. ويذكر المحقق أن أبا مصعب وسويدا رويا الحديث عن مالك عن زيد بن أسلم. {cite:muwatta-maruf-1997 p.134} {cite:muwatta-maruf-1997 p.135}"
