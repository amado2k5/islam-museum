label: { ar: "الموطأ 1793 — يحيى عن مالك عن يحيى بن سعيد عن سالم بن عبد الله: باع عبد الله بن عمر غلاما له بثمانمائة درهم بالبراءة، فادعى المشتري عيبا، فحكم عثمان بن عفان أن يحلف ابن عمر، فأبى، فارتجع العبد فصح عنده، فباعه بألف وخمسمائة", en: "Muwatta 1793", es: "Muwatta 1793", fr: "Muwatta 1793", ur: "موطا 1793", tr: "El-Muvatta 1793 — Yahya, Malik'ten, o da Yahya ibn Said'den, o da Salim ibn Abdullah'tan rivayetle: Abdullah ibn Ömer, kölesini sekiz yüz dirheme, kusursuz olduğuna dair garanti vererek sattı. Alıcı bir kusur olduğunu iddia etti, bunun üzerine Osman ibn Affan, İbn Ömer'in yemin etmesini emretti, ancak o reddetti. Bunun üzerine köle geri verildi ve sağlam olduğu anlaşıldı, İbn Ömer onu bin beş yüz dirheme sattı.", id: "Al-Muwatta 1793 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Yahya ibn Saeed, berdasarkan riwayat Salim ibn Abdullah: Abdullah ibn Umar menjual budaknya seharga delapan ratus dirham dengan jaminan bebas dari cacat. Pembeli mengklaim adanya cacat, sehingga Uthman ibn Affan memutuskan bahwa Ibn Umar harus bersumpah, tetapi ia menolak. Maka budak itu dikembalikan dan ternyata sehat, lalu ia menjualnya seharga seribu lima ratus dirham." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سالم بن عبد الله أن عبد الله بن عمر باع غلاما له بثمانمائة درهم، وباعه بالبراءة. فقال الذي ابتاعه لعبد الله بن عمر: بالغلام داء لم تسمه لي. فاختصما إلى عثمان بن عفان، فقال الرجل: باعني عبدا وبه داء لم يسمه لي. وقال عبد الله: بعته بالبراءة. فقضى عثمان على عبد الله بن عمر أن يحلف له لقد باعه العبد وما به داء يعلمه. فأبى عبد الله أن يحلف، وارتجع العبد، فصح عنده، فباعه عبد الله بعد ذلك بألف وخمسمائة درهم. ويذكر المحقق أن أبا مصعب وسويدا رويا الحديث عن مالك عن زيد بن أسلم. {cite:muwatta-maruf-1997 p.134} {cite:muwatta-maruf-1997 p.135}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Salim ibn Abdullah'tan rivayet eder ki, Abdullah ibn Umar kölesini sekiz yüz dirheme sattı ve onu kusursuz olduğuna dair bir garantiyle sattı. Köleyi satın alan adam Abdullah ibn Umar'a şöyle dedi: \"Kölenin bana söylemediğin bir hastalığı var.\" Bunun üzerine ihtilaflarını Osman ibn Affan'a götürdüler. Adam şöyle dedi: \"Bana söylemediği bir hastalığı olan bir köle sattı.\" Abdullah şöyle dedi: \"Onu kusursuz olduğuna dair bir garantiyle sattım.\" Osman, Abdullah ibn Umar'ın köleyi sattığı ve herhangi bir hastalığı olmadığını bildiğine dair yemin etmesini emretti. Ancak Abdullah yemin etmeyi reddetti ve köle ona geri verildi. Kölenin sağlıklı olduğu anlaşıldı, bu yüzden Abdullah onu daha sonra bin beş yüz dirheme sattı. Araştırmacı, bu hadisin Ebu Mus'ab ve Suveyd tarafından Malik'ten, o da Zeyd ibn Aslam'dan rivayet edildiğini belirtiyor."
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari Salim ibn Abdullah, bahwa Abdullah ibn Umar menjual budaknya seharga delapan ratus dirham, dan ia menjualnya dengan jaminan bebas dari cacat. Orang yang membelinya berkata kepada Abdullah ibn Umar: \"Budak itu memiliki penyakit yang tidak Anda beritahukan kepada saya.\" Maka mereka membawa perselisihan mereka kepada Utsman ibn Affan. Orang itu berkata: \"Dia menjual kepada saya seorang budak yang memiliki penyakit yang tidak dia beritahukan kepada saya.\" Abdullah berkata: \"Saya menjualnya dengan jaminan bebas dari cacat.\" Utsman memutuskan bahwa Abdullah ibn Umar harus bersumpah kepadanya bahwa dia telah menjual budak itu dan bahwa dia tidak mengetahui adanya penyakit yang dideritanya. Tetapi Abdullah menolak untuk bersumpah, dan budak itu dikembalikan kepadanya. Ternyata budak itu sehat, sehingga Abdullah menjualnya setelah itu seharga seribu lima ratus dirham. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits tersebut dari Malik, dari Zayd ibn Aslam."
