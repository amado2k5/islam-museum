text: "لولا أن أشق على أمتي لأمرتهم بالسواك"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب ما جاء في السواك: قال النبي إنه لولا خشية المشقة على أمته لأمرهم بالسواك أمر إيجاب. ويخرّجه المحقق عند البخاري (887) والنسائي (1/12) والبيهقي من طرق أصحاب مالك، وعند مسلم (1/151) وأبي داود (46) وابن خزيمة من طريق سفيان بنحوه، ويحيل على التمهيد (18/299). {cite:muwatta-maruf-1997 p.111} {cite:muwatta-maruf-1997 p.112}"
  tr: "Malik, misvakla ilgili rivayetler bölümünde, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan naklettiği hadisi şöyle aktarmıştır: Peygamberimiz şöyle buyurmuştur: \"Ümmeti için bir zorluktan korkmasaydım, onlara misvak kullanmayı farz kılardım.\" Editör ayrıca, Malik'in sahabelerinin rivayet zinciriyle Buhari (887), Nesai (1/12) ve Beyhaki'de, benzer bir ifadeyle Sufyan'ın rivayet zinciriyle de Müslim (1/151), Ebu Davud (46) ve İbn Huzeyme'de de bu hadisi aktarmıştır. Ayrıca el-Tamhid'e (18/299) de atıfta bulunmuştur."
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surah tentang apa yang diriwayatkan mengenai siwak: Nabi bersabda, \"Sekiranya bukan karena khawatir akan kesulitan yang menimpa umatnya, niscaya aku akan memerintahkan mereka untuk menggunakan siwak sebagai kewajiban.\" Editor juga menyertakannya dalam al-Bukhari (887), al-Nasa'i (1/12), dan al-Bayhaqi melalui sanad para sahabat Malik, dan dalam Muslim (1/151), Abu Dawud (46), dan Ibn Khuzaymah melalui sanad Sufyan dengan redaksi yang serupa. Ia merujuk pada al-Tamhid (18/299)."
