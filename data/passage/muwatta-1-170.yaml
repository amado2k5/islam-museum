summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب ما جاء في السواك: قال النبي إنه لولا خشية المشقة على أمته لأمرهم بالسواك أمر إيجاب. ويخرّجه المحقق عند البخاري (887) والنسائي (1/12) والبيهقي من طرق أصحاب مالك، وعند مسلم (1/151) وأبي داود (46) وابن خزيمة من طريق سفيان بنحوه، ويحيل على التمهيد (18/299). {cite:muwatta-maruf-1997 p.111} {cite:muwatta-maruf-1997 p.112}"
