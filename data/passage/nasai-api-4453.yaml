label: { ar: "سنن النسائي 4453 — الحلال، الحرام", en: "Sunan al-Nasa'i 4453 — the lawful; the unlawful", ur: "سنن نسائی 4453 — حلال، حرام", es: "Sunan al-Nasa'i 4453 — lo lícito; lo ilícito", fr: "Sunan al-Nasa'i 4453 — le licite; l'illicite", tr: "Sunen an-Nesa'i 4453 — Helal, Haram", id: "Sunan an-Nasa'i 4453 — Halal, Haram" }
text: "… قَالَ سَمِعْتُ رَسُولَ اللَّهِ - فَوَاللَّهِ لاَ أَسْمَعُ بَعْدَهُ أَحَدًا يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ - يَقُولُ \" إِنَّ الْحَلاَلَ بَيِّنٌ وَإِنَّ الْحَرَامَ بَيِّنٌ وَإِنَّ بَيْنَ ذَلِكَ أُمُورًا مُشْتَبِهَاتٍ \". وَرُبَّمَا قَالَ \" وَإِنَّ بَيْنَ ذَلِكَ أُمُورًا مُشْتَبِهَةً \". قَالَ \" وَسَأَضْرِبُ لَكُمْ فِي ذَلِكَ مَثَلاً إِنَّ اللَّهَ عَزَّ وَجَلَّ حَمَى حِمًى وَإِنَّ حِمَى اللَّهِ عَزَّ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4453، يذكر الحلال، والحرام، والشبهات. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4453 (The Book of Financial Transactions), that mentions the lawful, the unlawful, the doubtful matters. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4453، جس میں حلال، حرام، مشتبہ امور کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4453 (El Libro de las Transacciones Financieras), que menciona lo lícito, lo ilícito y lo dudoso. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Sunan al-Nasa'i, n° 4453 (Le Livre des transactions financières), mentionne ce qui est licite, illicite et douteux. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de yer alan 4453 numaralı hadis, helal, haram ve şüpheli olan hususları ele almaktadır. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan hususlar hakkında Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4453, menyebutkan apa yang diperbolehkan, diharamkan, dan diragukan. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
