text: |-
  قوله-م أدرب القوم اذادخلوا أرض العدومن بلاد الروم دعب). الدعابة المزاح
  وقد دعب فهودعاب لعاب والمداعية الممازحة والدعبوب الطريق الموطوء والدعبوب
  الضعيف ( ا دلب شجر الواحدة دلبة وأرض مدلبة ذات داب والدولاب واحد
  الدواليب فارسى معرب ⁦(دنب)⁩ الفراء الدنابة بتشديد النون القصير وكذلك الدنبة
  مقصورسنه
  صل الذال أب) الذئب يهمزولا يهمز وأصله الهمز والاتى ذئبة وجمع
  القليل أذؤب وال.كثير ذئاب وذؤبان وذؤيان العرب أيضاصعاليكها الذين يتلصصون وأرض
  مذأية أى ذات ذئاب ابو عمر والدئبان الشعر على عنق البعير ومشفره وقال الفرّاء الذئبان
  بقمة الو برقال وهو واحد والذتبة فرجة ما بيزدقتى السرج والرحل تحت ملتق الحموين
  وهو يقع على المنسج، وذأبه أى طرده وحره وذأبت الابل ذأياسقتها وأذأب الرجل فزع
  قال الشاءر فسقطت نخوته وأذأبا أبوزيد ذؤب الرجل بالضم يذؤب ذآبة صار كالذئب
  خبثا ودهاء وذئب الرجل على فعل فهو مذؤوب أى وقع الذئب فى غنه وتذأبت الريح
  وتذاءبت بعى أى اختلفت وجاءت مرّة كذاومرّة كذا قال الاصهىّ أخذمن فعل الذئب
  لانه يأتى كذلك وتذاءبت الناقة عسلى تفاعلت أى ظأرتها على ولذها وذلك أن يلبس
  اهالباسايتشبه بالذئب ويهوّل لهالتكون أرآم عليه والذوابة من الشعر والجم-ع الذوائب
  وكان الاصل ذآئب لان الالف التى فى ذؤاية كالالف التى فى رسالة حقها أن سدل منهاه_مزة
  فى الجمع ولكنه-م استثقلوا أن تقع ألف الجمع بين الهسمزتين فأبدلوامن الاولى واوا
  والذوابة أيضا الإلمدة التى تعلق ء-لى أخرة الرحل يقال غبيط مذأب وغلام مذأب له ذؤابة
  قال البيد
  فكلفتها شمفا بت رزية * طليها كالواح الغبيط المذأب
  ⁦( ذيب )⁩. الذب المنع والدفع وقد ذيبت عنه وذبب أى أكثر الذب يقال طعان غيرتذبيب
  اذابواخ فيه وذيبناليلتنا أى أتعبذا فى السيرولا ينالون الماءالابقرب مذبب أى مسرع
  قال الشاعر
  مذيبة أضرّبها بكورى • وتهجيرى اذا البعفور قالا
  وجاءنارا كب مذبب وهوالعجل المنهرد وظمء.ذبب أى طويل يسار الى الماءمن بعد
  فيعجل بالسير والذباب معروف الواحدة ذبابة ولا تقل ذبانة ١ وجمع القلة أذية والمكثير
  ذيان شل غراب وأغربة وغربان قال النابغة ضرّابة بالمشرالاذبه أبو عبيد أرض
  مذية ذات ذباب وبعير مذيوب اذا أصابه الذباب قاله فى باب أمراض الابل وقال الفترّاء
  أرض مذبوية كما يقالموحوشة من الوحش والمذبة مايذب به الذياب وذباب أسنان الابل
  حدّها قال الشاءر وتسمع للذياب اذاتغى * كتغريد الحام على الغصون
  وذياب السيف طرفه الذى يضرب به وذباب العيز انسانها والذبابة البقية من الدين ونحوه
  قال الراجز
  أويقضى اللّٰه ذيابات الدين وذب النهارا الم بق منه الابقمة وقال
  واتجاب النهارفذما والتذيذب التحرّك والذيذية نوس الشئء المعلق فى الهواء والذيذب
  الذكر وفى الحديث من وقى شرّ ذبذبه والذباذب أيضا أشاء تعلق فى الهودج والمذبذب
  المتردّدبين أمرين قال اللّٰه تبارك وتعالى مذبذبين بيزذلك والذب الثور الوحشى وسمى ذب
  الرياد لانه يرود أى يجىء ويذهب ولايئيت فى موضع واحد وقال الساءر النابغة
  الصحاح فلا تغتريه وقدنيه عليه
  المترجم الواهم اه
