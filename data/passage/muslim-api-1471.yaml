label: { ar: "صحيح مسلم 1471 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 1471 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 1471 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 1471 — Menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 1471 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنِي أَبُو غَسَّانَ الْمِسْمَعِيُّ، حَدَّثَنَا مُعَاذٌ، - وَهْوَ ابْنُ هِشَامٍ - حَدَّثَنِي أَبِي، عَنْ مَطَرٍ، عَنْ أَبِي الْعَالِيَةِ الْبَرَّاءِ، قَالَ قُلْتُ لِعَبْدِ اللَّهِ بْنِ الصَّامِتِ نُصَلِّي يَوْمَ الْجُمُعَةِ خَلْفَ أُمَرَاءَ فَيُؤَخِّرُونَ الصَّلاَةَ - قَالَ - فَضَرَبَ فَخِذِي ضَرْبَةً أَوْجَعَتْنِي وَقَالَ سَأَلْتُ أَبَا ذَرٍّ عَنْ ذَلِكَ فَضَرَبَ فَخِذِي وَقَالَ سَأَلْتُ رَسُولَ اللَّهِ عَنْ ذَلِكَ فَقَالَ \" …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1471، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1471 (The Book of Mosques and Places of Prayer), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 1471، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 1471 (El Libro de las Mezquitas y Lugares de Oración), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih Muslim, n° 1471 (Le Livre des Mosquées et des Lieux de Prière), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
