label: { ar: "سنن ابن ماجه 3491 — الحجامة، الكي", en: "Sunan Ibn Majah 3491 — cupping; cautery", ur: "سنن ابن ماجہ 3491 — حجامہ، داغنا", es: "Sunan Ibn Majah 3491 - ventosas; cauterización", fr: "Sunan Ibn Majah 3491 — ventouses; cautère", tr: "Sunan İbn Majah 3491 — Hacamat, Dağlama", id: "Sunan Ibnu Majah 3491 — Bekam, Kauterisasi" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ مَنِيعٍ، حَدَّثَنَا مَرْوَانُ بْنُ شُجَاعٍ، حَدَّثَنَا سَالِمٌ الأَفْطَسُ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ \" الشِّفَاءُ فِي ثَلاَثٍ شَرْبَةِ عَسَلٍ وَشَرْطَةِ مِحْجَمٍ وَكَيَّةٍ بِنَارٍ وَأَنْهَى أُمَّتِي عَنِ الْكَىِّ \". رَفَعَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3491، يذكر الحجامة، والكي، والتداوي بالعسل، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3491 (Chapters on Medicine), that mentions cupping, cautery, honey as a remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3491، جس میں حجامہ، داغنا، شہد سے علاج، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3491 (Capítulos sobre Medicina), menciona la ventosaterapia, la cauterización, la miel como remedio y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3491 (Chapitres sur la médecine), mentionne la ventousothérapie, la cautérisation et le miel comme remèdes. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 3491 numaralı hadiste, hacamat, yakma, bal ile tedavi ve iyileşmeden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3491, menyebutkan tentang bekam, kauterisasi, pengobatan dengan madu, dan penyembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
