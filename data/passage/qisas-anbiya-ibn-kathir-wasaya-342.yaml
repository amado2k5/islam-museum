  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 342. sayfasından bir alıntı, son bir vasiyet veya antlaşmadan bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
