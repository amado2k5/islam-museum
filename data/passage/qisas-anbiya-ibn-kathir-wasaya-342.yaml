text: "… سنة، وقيل أنه عاش أكثر من ذلك. وقد روى ليث عن مجاهد ما معناه : إن الله يحتج يوم القيامة بسليمان على الأغنياء، ويوسف على الأرقاء، وبأيوب على أهل البلاء. رواه ابن عساكر بمعناه. وأنه أوصى إلى ولده حومل، وقام …"
summary:
