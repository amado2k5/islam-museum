label: { ar: "سنن النسائي 1941 — قيراط الأجر", en: "Sunan al-Nasa'i 1941 — the qirat of reward", ur: "سنن نسائی 1941 — اجر کا قیراط", es: "Sunan al-Nasa'i 1941 — el qirat de la recompensa", fr: "Sunan al-Nasa'i 1941 — la qirat de la récompense", tr: "Sunan an-Nasa'i 1941 — Sevabı kırat kadardır.", id: "Sunan an-Nasa'i 1941 — Pahalanya sama dengan satu qiraat" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ حَدَّثَنَا خَالِدٌ، قَالَ حَدَّثَنَا أَشْعَثُ، عَنِ الْحَسَنِ، عَنْ عَبْدِ اللَّهِ بْنِ الْمُغَفَّلِ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ تَبِعَ جَنَازَةً حَتَّى يُفْرَغَ مِنْهَا فَلَهُ قِيرَاطَانِ فَإِنْ رَجَعَ قَبْلَ أَنْ يُفْرَغَ مِنْهَا فَلَهُ قِيرَاطٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1941، يذكر قيراط الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 1941 (The Book of Funerals), that speaks of the qirat of reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 1941، جس میں اجر کا قیراط کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Sunan al-Nasa'i, n.° 1941 (El Libro de los Funerales), habla del qirat de recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un rapport du Sunan al-Nasa'i, n° 1941 (Le Livre des funérailles), évoque le calcul de la récompense. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de yer alan 1941 numaralı hadiste, sevabın kıratı (değerinin ölçülmesi) anlatılmaktadır. Bu hadis, iyi ve kötü ameller listesiyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 1941, menyebutkan qirat pahala. Qirat ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
