text: "… الجلال، ولكن بقي هذا لم يباشر السبكي في المحراب. واشتهر عن العوام كلام كثير، وتوعدوا السبكي بالسفاهة عليه إن خطب، وضاق بذلك ذرعاً، ونهوا عن ذلك فلم ينتهوا، وقيل لهم ولكثير منهم : الواجب عليكم السمع والطاعة لأول الأمر، ولو …"
