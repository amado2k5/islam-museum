label: { ar: "جامع الترمذي 3163 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 3163 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 3163 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 3163 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 3163 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلاَنَ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، أَخْبَرَنَا صَالِحُ بْنُ أَبِي الأَخْضَرِ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ لَمَّا قَفَلَ رَسُولُ اللَّهِ مِنْ خَيْبَرَ أَسْرَى لَيْلَةً حَتَّى أَدْرَكَهُ الْكَرَى أَنَاخَ فَعَرَّسَ ثُمَّ قَالَ \" يَا بِلاَلُ اكْلأْ لَنَا اللَّيْلَةَ \". قَالَ فَصَلَّى بِلاَلٌ ثُمَّ تَسَانَدَ إِلَى رَاحِلَتِهِ مُسْتَقْبَلَ الْفَجْرِ فَغَلَبَتْهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3163، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3163 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3163، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3163 (Capítulos sobre Tafsir), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport figurant dans Jami' al-Tirmidhi, n° 3163 (Chapitres sur le Tafsir), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
