text: "… الْخُذْرِي يَقُول: كَانَ رسول اللَّه لَ أشَدْ حَيَاءً مِنَ الْعَذْرَاءِ فِي خِدْرِهَا، وَكَانَ إِذَا كَرِهَ شَيْئاً عَرَفْنَاهُ فِي وَجْهِهِ. أخرجه البخاري:،،. يجعل للبكر في جنب البيت ومعنى عرفنا الكراهة في وجهه أي: لا يتكلم شعب الإيمان وهو خير كله ولا …"
summary:
