text: "… ولا على الصبيان قال: وكان عمر يختم أهل الجزية في أعناقهم. - حدثنا وكيع قال: حدثنا فُضَيل بن عِياض عن ليث عن مجاهد قال: يقاتل أهل الأوثان على الإسلام، ويقاتل أهل الكتاب على الجزية. - حدثنا أبو معاوية عن الأعمش …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 7193، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
