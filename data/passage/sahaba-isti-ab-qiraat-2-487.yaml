text: "… الرِّبا، وأكلُ مال اليتيم، والتولِّي يوم عمير بن سعد هذا على حمص قبل سعيد بن عامرٍ الزَّحف، وقذفُ المحصناتِ، وعقوق الوالدَيْن ابن خذيم، أَو بعده، وزعم أهل الكوفة أنَّ أبا زيدَ المسلمينِ، واستحلالُ البيت الحرام قبلتكُم أحياءً الَّذي جمع القرآن …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 487، يذكر جمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 487, that mentions the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 487 کا اقتباس جس میں جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 2, pág. 487, que menciona la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab (tome 2, p. 487), mentionne la collecte du Coran et des codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Abdülbarr'ın resimli 2. cildi olan el-İsti'ab'ın 487. sayfasından bir alıntı, Kur'an'ın ve el yazmalarının derlenmesinden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 2 bergambar, halaman 487, menyebutkan penyusunan Al-Qur'an dan manuskrip-manuskripnya; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
