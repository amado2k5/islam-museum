label: { ar: "سنن النسائي 2790 — الحلال", en: "Sunan al-Nasa'i 2790 — the lawful", ur: "سنن نسائی 2790 — حلال", es: "Sunan al-Nasa'i 2790 - lo lícito" }
text: "… الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، قَالَ حَدَّثَنِي أَبِي، عَنْ مُحَمَّدِ بْنِ جُحَادَةَ، ح وَأَنْبَأَنَا عَبْدُ الْوَارِثِ بْنُ عَبْدِ الصَّمَدِ بْنِ عَبْدِ الْوَارِثِ، قَالَ حَدَّثَنِي أَبُو مَعْمَرٍ، قَالَ حَدَّثَنَا عَبْدُ الْوَارِثِ، قَالَ أَنْبَأَنَا مُحَمَّدُ بْنُ جُحَادَةَ، عَنِ الْحَكَمِ، عَنْ إِبْرَاهِيمَ، عَنِ الأَسْوَدِ، عَنْ عَائِشَةَ، قَالَتْ كُنَّا نُقَلِّدُ الشَّاةَ فَيُرْسِلُ بِهَا رَسُولُ اللَّهِ حَلاَلاً لَمْ يُحْرِمْ مِنْ شَىْءٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 2790، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2790 (The Book of Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2790، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2790 (El Libro del Hajj), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
