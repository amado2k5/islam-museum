text: "… عن عبدالرحمن بن القاسم عن أبيه عن عائشة، وعن العُمَريّ عن نافعٍ عن ابن عمر: أن النبيَّ وَلِيِ أوصى أن يُلْحدَ له. - حدثنا أبو أُسامة عن مجالد عن عامر قال: قال المغيرة بن شعبة: لحدنا للنبيّ وَاليه. - حدثنا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 2911، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
