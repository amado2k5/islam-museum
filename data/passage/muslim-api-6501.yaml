label: { ar: "صحيح مسلم — أمك ثم أمك ثم أمك ثم أبوك ثم أدناك", en: "Sahih Muslim — Mother three times, then father, then the nearest", ur: "صحیح مسلم — ماں تین بار، پھر باپ، پھر قریب تر" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، مُحَمَّدُ بْنُ الْعَلاَءِ الْهَمْدَانِيُّ حَدَّثَنَا ابْنُ فُضَيْلٍ، عَنْ أَبِيهِ، عَنْ عُمَارَةَ، بْنِ الْقَعْقَاعِ عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَجُلٌ يَا رَسُولَ اللَّهِ مَنْ أَحَقُّ بِحُسْنِ الصُّحْبَةِ قَالَ ‏ \"‏ أُمُّكَ ثُمَّ أُمُّكَ ثُمَّ أُمُّكَ ثُمَّ أَبُوكَ ثُمَّ أَدْنَاكَ أَدْنَاكَ ‏\"‏ ‏.‏"
summary:
  ar: "لفظ مسلم: أمك ثم أمك ثم أمك ثم أبوك ثم أدناك أدناك."
  en: "In Muslim's wording: your mother three times, then your father, then the nearest and the nearest."
  ur: "صحیح مسلم کے الفاظ: تیری ماں تین بار، پھر تیرا باپ، پھر قریب تر قریب تر۔"
