text: "… المُدبَّرَةُ دونَ اللهِ تَعالىٰ أو مَعَهُ فَهوَ كافِرٌ. وحُبُّ الأنْصارِ فَرضٌ، وكَذلكَ بِرُّهُمْ. ومَن وَلِيَ منْ أمورِ النّاسِ شَيئًا فَفَرضٌ عَليهِ الإحسانُ إلى مُحينِهم والتَّجاوزُ عنْ مُسيئِهم ما لم يَكُنْ حَدَّا وَاجبًا. والجِهادُ أفْضَلُ الأغمالِ بَعدَ الفَرائضِ. ومُباحٌ أنْ يقولَ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 350، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض، والواجب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 350, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard), the obligatory (wajib), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 350 کا اقتباس جس میں فریضہ اور فرائض، جو لوگوں پر فرض کیا گیا، فرض، واجب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 350, dont le texte mentionne l'obligation (farida), ce qui a été imposé aux gens, l'obligatoire (fard), l'obligatoire (wajib), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 350, cuyo texto menciona la obligación (farida), lo que se impuso a la gente, lo obligatorio (fard), lo obligatorio (wajib), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 350. sayfasından, farz olan fiiller ve görevler, insanlar için farz kılınanlar, farz olan, gerekli olan ve caiz olan şeyler hakkında bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 350, yang membahas tentang amalan dan kewajiban yang wajib, apa yang dianjurkan bagi manusia, dan apa yang wajib, diharuskan, dan diperbolehkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
