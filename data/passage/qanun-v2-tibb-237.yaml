text: "… كان الإنفجار عن شبكة عروق الدماغ وشرايينه، وهو غير قابل في الأكثر للعلاج. وأكثره يكون عقيب حدوث صداع والتهاب ومرض لا محالة، وربما كان لبخارات حارة متصعدة. والذي يكون عن الشرايين يتميز عن الذي يكون عن الأوردة لرقّته وحمرته وحرارته، …"
summary:
