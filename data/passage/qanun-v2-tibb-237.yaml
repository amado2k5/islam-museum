text: "… كان الإنفجار عن شبكة عروق الدماغ وشرايينه، وهو غير قابل في الأكثر للعلاج. وأكثره يكون عقيب حدوث صداع والتهاب ومرض لا محالة، وربما كان لبخارات حارة متصعدة. والذي يكون عن الشرايين يتميز عن الذي يكون عن الأوردة لرقّته وحمرته وحرارته، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 237، يذكر المرض والمريض، وأسماء الأمراض، والعلاج، وأعضاء البدن، والعروق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 237, that mentions illness and the sick, named diseases, treatment, the organs of the body, the vessels; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 237 کا اقتباس جس میں بیماری اور بیمار، بیماریوں کے نام، علاج، اعضائے بدن، رگیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 237, que menciona la enfermedad y a los enfermos, nombra las enfermedades, el tratamiento, los órganos del cuerpo y los vasos sanguíneos; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 237, qui mentionne la maladie et les malades, les maladies nommées, le traitement, les organes du corps, les vaisseaux; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, s. 237'sinden bir bölüm; hastalık ve hasta, hastalıkların isimleri, tedavi, vücut organları ve damarlar; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 237, yang menyebutkan penyakit dan pasien, nama-nama penyakit, pengobatan, organ tubuh, dan pembuluh darah; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
