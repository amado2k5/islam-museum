  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 3, p. 229, that mentions the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 3، ص 229 کا اقتباس جس میں خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
