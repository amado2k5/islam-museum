text: "… صاحبهن جواد مقتصد: فرائض اللّٰه يقيمها ثلاث ليس عندي فيهن أناة: الضيف إذا نزل بي ثلاث من كن فيه وجد بهن حلاوة الإيمان ثلاث مئة ضربة بالسيف ثلاثة يضحك اللّٰه إليهم، ويتبشبش اللّٰه لهم جاء أبو موسى يعود الحسن بن …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 2، ص 525، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 2, p. 525, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 2، ص 525 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
