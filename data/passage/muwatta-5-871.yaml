label: { ar: "الموطأ 871 — مالك: الأمر عندنا أنه لا يكره الاعتكاف في كل مسجد يُجمع فيه، ولا في المساجد التي لا تُجمع فيها إلا كراهية أن يخرج المعتكف من مسجده إلى الجمعة", en: "Muwatta 871" }
summary:
  ar: "قول لمالك: الأمر عندنا الذي لا اختلاف فيه أنه لا يكره الاعتكاف في كل مسجد يُجمع فيه، ولا يرى أنه كُره الاعتكاف في المساجد التي لا تُجمع فيها إلا كراهية أن يخرج المعتكف من مسجده إلى الجمعة أو يدعها. فإن كان المسجد لا تُجمع فيه الجمعة ولا يجب على صاحبه إتيان الجمعة في مسجد سواه، فلا بأس بالاعتكاف فيه، لقول الله تعالى: وأنتم عاكفون في المسجد [[passage/quran-2-187|البقرة 187]]، فعم الله المساجد كلها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (862) وسويد والشيباني (379). {cite:muwatta-maruf-1997 p.420} {cite:muwatta-maruf-1997 p.421}"
