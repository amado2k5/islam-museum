label: { ar: "الموطأ 871 — مالك: الأمر عندنا أنه لا يكره الاعتكاف في كل مسجد يُجمع فيه، ولا في المساجد التي لا تُجمع فيها إلا كراهية أن يخرج المعتكف من مسجده إلى الجمعة", en: "Muwatta 871", es: "Muwatta 871", fr: "Muwatta 871", ur: "موطا 871", tr: "El-Muvatta 871 — Malik: Bizim açımızdan mesele şudur ki, itikafın cuma namazı kılınan her camide veya cuma namazı kılınmayan her camide yapılması mekruh değildir; ancak itikaf yapanın cuma namazı için camiden ayrılması mekruhtur.", id: "Al-Muwatta 871 — Malik: Masalahnya di antara kami adalah bahwa tidaklah makruh melakukan i'tikaf di setiap masjid yang melaksanakan salat Jumat, dan juga tidak makruh di masjid-masjid yang tidak melaksanakan salat Jumat, kecuali jika orang yang melakukan i'tikaf meninggalkan masjidnya untuk salat Jumat." }
summary:
  ar: "قول لمالك: الأمر عندنا الذي لا اختلاف فيه أنه لا يكره الاعتكاف في كل مسجد يُجمع فيه، ولا يرى أنه كُره الاعتكاف في المساجد التي لا تُجمع فيها إلا كراهية أن يخرج المعتكف من مسجده إلى الجمعة أو يدعها. فإن كان المسجد لا تُجمع فيه الجمعة ولا يجب على صاحبه إتيان الجمعة في مسجد سواه، فلا بأس بالاعتكاف فيه، لقول الله تعالى: وأنتم عاكفون في المسجد [[passage/quran-2-187|البقرة 187]]، فعم الله المساجد كلها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (862) وسويد والشيباني (379). {cite:muwatta-maruf-1997 p.420} {cite:muwatta-maruf-1997 p.421}"
  tr: "Malik şöyle demiştir: Aramızda görüş birliği olan ve ihtilaf bulunmayan görüş şudur ki, Cuma namazının kılındığı herhangi bir camide itikaf yapmak mekruh değildir. Cuma namazının kılınmadığı camilerde itikaf yapmayı mekruh saymamıştır; ancak itikaf yapan kişinin Cuma namazı için camiden ayrılması veya namazı tamamen kaçırması endişesi vardır. Eğer camide Cuma namazı kılınmıyorsa ve cami sahibi başka bir camide Cuma namazına katılmakla yükümlü değilse, Allah'ın şu sözüne dayanarak orada itikaf yapmanın bir sakıncası yoktur: \"Siz mescitte iken\" [Bakara 2:187]. Allah'ın bu sözü tüm mescitleri kapsar. Araştırmacı, bunun Malik'ten Ebu Mus'ab (862), Suveyd ve Şeybani (379) tarafından rivayet edildiğini belirtmektedir."
  id: "Malik berkata: Pandangan yang telah mapan di antara kami, yang tidak ada perbedaan pendapat, adalah bahwa tidak buruk melakukan i'tikaf (berdiam diri untuk beribadah) di masjid mana pun yang melaksanakan salat Jumat. Beliau tidak menganggap buruk melakukan i'tikaf di masjid yang tidak melaksanakan salat Jumat, kecuali karena khawatir orang yang melakukan i'tikaf mungkin meninggalkan masjidnya untuk salat Jumat atau melewatkannya sama sekali. Jika masjid tersebut tidak melaksanakan salat Jumat dan pemiliknya tidak wajib menghadiri salat Jumat di masjid lain, maka tidak ada salahnya melakukan i'tikaf di sana, berdasarkan firman Allah SWT: \"Sebagaimana kamu berdiam diri di dalam masjid\" [Al-Baqarah 2:187]. Firman Allah mencakup semua masjid. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (862), Suwaid, dan Al-Shaybani (379)."
