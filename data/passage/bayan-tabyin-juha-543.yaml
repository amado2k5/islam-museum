text: "… العلّة. وقال الجمّاز : الحِمية إحدى العلّتين. وقال العَمّىُّ : مَن احتمى فهو على يقينٍ مِن تعجيل المكروه، وفى شكٍّ مما يأمُل من دوام الصحَّة. وذكر أعرابى رجلا فقال : حُمَّى المُعافَى، حَنُوطُ المُبتَلَى. وقال عمر اعتبر عزْمَه بحِمَيَتِه، وحَزْمَه …"
