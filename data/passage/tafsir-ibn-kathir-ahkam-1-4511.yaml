text: "… كَانَ أي: المحتضر، مِنَ الْمُقَرَّبِينَ، وهم الذين فعلوا الواجبات والمستحبات، وتركوا المحرمات والمكروهات وبعض المباحات، فَرَوْحٌ وَرَيْمَانٌ وَجَنَّتُ نَعِيمٍ أي: فلهم روحُ وريحانٌ، وتبشرهم الملائكة بذلك عند الموت، كما تقدم في حديث البراء: أن ملائكة الرحمة تقول: أَيَنُهَا الرُّوحُ الطَّيَّبَةُ …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 4511، يرد فيه ذكر الواجب، والمستحب، والمكروه، والمباح، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 4511, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the disliked (makruh), the permitted (mubah), the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 4511 کا اقتباس جس میں واجب، مستحب، مکروہ، مباح، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
