text: "… كَانَ أي: المحتضر، مِنَ الْمُقَرَّبِينَ، وهم الذين فعلوا الواجبات والمستحبات، وتركوا المحرمات والمكروهات وبعض المباحات، فَرَوْحٌ وَرَيْمَانٌ وَجَنَّتُ نَعِيمٍ أي: فلهم روحُ وريحانٌ، وتبشرهم الملائكة بذلك عند الموت، كما تقدم في حديث البراء: أن ملائكة الرحمة تقول: أَيَنُهَا الرُّوحُ الطَّيَّبَةُ …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 4511، يرد فيه ذكر الواجب، والمستحب، والمكروه، والمباح، والمحرمات ومحارم الله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 4511, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the disliked (makruh), the permitted (mubah), the forbidden things; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 4511 کا اقتباس جس میں واجب، مستحب، مکروہ، مباح، محرمات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tafsir de Ibn Kathir, volume numérisé 1, p. 4511, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), le réprouvé (makruh), le permis (mubah), les choses interdites ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tafsir de Ibn Kathir, volumen digitalizado 1, p. 4511, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo reprobado (makruh), lo permitido (mubah), las cosas prohibidas; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 4511. sayfasından, farz, tavsiye edilen, mekruh edilen, caiz olan ve haram olan fiilleri, Allah tarafından haram kılınanlar da dahil olmak üzere ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz fiiller, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Tafsir Ibn Kathir, Jilid 1, halaman 4511, yang membahas tentang amalan wajib, anjuran, makruh, halal, dan haram, termasuk amalan yang dilarang oleh Allah. Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
