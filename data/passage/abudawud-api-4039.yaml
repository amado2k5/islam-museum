label: { ar: "سنن أبي داود 4039 — استحلال الشيء", en: "Sunan Abi Dawud 4039 — treating a thing as lawful", ur: "سنن ابی داؤد 4039 — کسی چیز کو حلال ٹھہرانا", es: "Sunan Abi Dawud 4039 — tratar algo como lícito", fr: "Sunan Abi Dawud 4039 — considérer une chose comme licite" }
text: "… أَوْ أَبُو مَالِكٍ - وَاللَّهِ يَمِينٌ أُخْرَى مَا كَذَبَنِي - أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" لَيَكُونَنَّ مِنْ أُمَّتِي أَقْوَامٌ يَسْتَحِلُّونَ الْخَزَّ وَالْحَرِيرَ \". وَذَكَرَ كَلاَمًا قَالَ \" يُمْسَخُ مِنْهُمْ آخَرُونَ قِرَدَةً وَخَنَازِيرَ إِلَى يَوْمِ الْقِيَامَةِ \". قَالَ أَبُو دَاوُدَ وَعِشْرُونَ نَفْسًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ أَوْ أَكْثَرُ لَبِسُوا الْخَزَّ مِنْهُمْ أَنَسٌ وَالْبَرَاءُ بْنُ عَازِبٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4039، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4039 (Clothing (Kitab Al-Libas)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4039، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4039 (Vestimenta (Kitab Al-Libas)), menciona que se considera algo lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4039 (Vêtements (Kitab Al-Libas)), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
