label: { ar: "نوادر جحا الكبرى، ص 48 — «نعوذ بالله»", en: "Nawadir Juha al-Kubra, p. 48 — 'We Seek Refuge in God'", ur: "نوادر جحا الکبریٰ، ص 48 — «ہم اللہ کی پناہ مانگتے ہیں»", fr: "Nawadir Juha al-Kubra, p. 48 — « Nous cherchons refuge auprès de Dieu »", es: "Nawadir Juha al-Kubra, p. 48 — «Buscamos refugio en Dios»", tr: "Juha'nın Büyük Öyküleri, s. 48 — “Tanrı'ya sığınırız”", id: "Anekdot-anekdot Hebat Juha, hlm. 48 — “Kita mencari perlindungan kepada Tuhan”" }
text: "… نعوذ باللَّه سأله تيمور لنك يوماً قائلاً : تعلمٍ يا نصر الدين أنَّ خُلفاءَ بني العباس، كان لكل منهم لقبْ أختصَّ به فمنهم الموفّق باللَّه و المتوكل على اللَّه و المعتصم باللَّه وما شابَهَ ذلك، فلو كنْتُ أنا واحداً منهم …"
summary:
  ar: "سأل تيمور لنك جحا أي لقب ملكي على الطراز العباسي يختار، فقال جحا إن اللقب الذي سيُنادى به هو «نعوذ بالله». {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  en: "Timur Lenk asks Juha which Abbasid-style royal title he would choose, and Juha says that the one he would be called is 'We seek refuge in God'. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  ur: "تیمور لنگ نے جحا سے پوچھا کہ وہ عباسی طرز کا کون سا شاہی لقب چنے گا، تو جحا نے کہا کہ جس لقب سے مجھے پکارا جائے گا وہ «ہم اللہ کی پناہ مانگتے ہیں» ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  fr: "Timur Lenk demande à Juha quel titre royal de style abbasside il choisirait, et Juha répond que celui par lequel on l'appellerait serait «Nous cherchons refuge auprès de Dieu». {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  es: "Timur Lenk pregunta a Juha qué título real de estilo abasí elegiría, y Juha responde que aquel por el que lo llamarían sería «Buscamos refugio en Dios». {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  tr: "Timur Lenk, Cuha'ya Abbasi tarzında hangi kraliyet unvanını seçeceğini sordu ve Cuha, kendisine hitap edilirken kullanılacak unvanın \"Allah'a sığınırız\" olacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 48}"
  id: "Timur Lenk bertanya kepada Juha gelar kerajaan mana dalam gaya Abbasiyah yang akan dipilihnya, dan Juha menjawab bahwa gelar yang akan digunakan untuk menyebut dirinya adalah \"Kami berlindung kepada Tuhan.\" {cite:juha-nawadir-kubra-djuwaydi p. 48}"
