text: "… تكلم الرجل عذبة سوطه وشراك نعله وتخبره فخذه بما حدث في أهله بعده. - حدثنا وكيع عن إسماعيل عن قيس قال أخبرت أن الساعة لا تقوم حتى تقول الحجر والشجر: يا مؤمن! هذا يهودي، هذا نصراني، فاقتله. - حدثنا ابن …"
summary:
