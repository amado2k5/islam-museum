text: "… حدثنا أبي حدثنا أبو الأشهب قال سمعت الحسن يدعو بهذا الدعاء اللهم آت نفسي تقواها وزكها أنت خير من زكاها أنت وليها ومولاها، وقال الأشهب عن الحسن قال كانوا يقولون أفضل أخلاق المؤمنين العفو. وحدثنا أبو الأشهب عن الحسن قال …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 3، ص 353، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 3, p. 353, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 3، ص 353 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 3, pág. 353, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal (tome 3, p. 353) mentionnant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 353. sayfasından, müminin niteliklerinden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 3, halaman 353, yang menyebutkan sifat-sifat seorang mukmin; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
