text: "… حدثنا أبي حدثنا أبو الأشهب قال سمعت الحسن يدعو بهذا الدعاء اللهم آت نفسي تقواها وزكها أنت خير من زكاها أنت وليها ومولاها، وقال الأشهب عن الحسن قال كانوا يقولون أفضل أخلاق المؤمنين العفو. وحدثنا أبو الأشهب عن الحسن قال …"
summary:
