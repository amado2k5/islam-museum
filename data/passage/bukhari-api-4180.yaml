label: { ar: "صحيح البخاري 4180 — الأب والأبوة", en: "Sahih al-Bukhari 4180 — the father and fatherhood", ur: "صحیح بخاری 4180 — باپ اور والدیت", es: "Sahih al-Bukhari 4180 — El padre y la paternidad", fr: "Sahih al-Bukhari 4180 — Le père et la paternité" }
text: "… يُقَاضِيَ رَسُولَ اللَّهِ إِلاَّ عَلَى ذَلِكَ، كَاتَبَهُ رَسُولُ اللَّهِ، فَرَدَّ رَسُولُ اللَّهِ أَبَا جَنْدَلِ بْنَ سُهَيْلٍ يَوْمَئِذٍ إِلَى أَبِيهِ سُهَيْلِ بْنِ عَمْرٍو، وَلَمْ يَأْتِ رَسُولَ اللَّهِ أَحَدٌ مِنَ الرِّجَالِ إِلاَّ رَدَّهُ فِي تِلْكَ الْمُدَّةِ، وَإِنْ كَانَ مُسْلِمًا، وَجَاءَتِ الْمُؤْمِنَاتُ مُهَاجِرَاتٍ، فَكَانَتْ أُمُّ كُلْثُومٍ بِنْتُ عُقْبَةَ بْنِ مُعَيْطٍ مِمَّنْ خَرَجَ إِلَى رَسُولِ اللَّهِ وَهْىَ عَاتِقٌ، فَجَاءَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4180، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4180, that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4180، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4180, menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Le Sahih al-Bukhari, n° 4180, mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
