label: { ar: "سنن ابن ماجه 1568 — دفن وقبر ومرقد", en: "Sunan Ibn Majah 1568 — a burial, grave or resting place", ur: "سنن ابن ماجہ 1568 — تدفین، قبر اور مرقد", es: "Sunan Ibn Majah 1568 — un lugar de entierro, tumba o descanso.", fr: "Sunan Ibn Majah 1568 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… رَسُولَ اللَّهِ \". فَقُلْتُ يَا رَسُولَ اللَّهِ مَا أَنْقِمُ عَلَى اللَّهِ شَيْئًا كُلُّ خَيْرٍ قَدْ أَتَانِيهِ اللَّهُ. فَمَرَّ عَلَى مَقَابِرِ الْمُسْلِمِينَ فَقَالَ \" أَدْرَكَ هَؤُلاَءِ خَيْرًا كَثِيرًا \". ثُمَّ مَرَّ عَلَى مَقَابِرِ الْمُشْرِكِينَ فَقَالَ \" سَبَقَ هَؤُلاَءِ خَيْرٌ كَثِيرٌ \". قَالَ فَالْتَفَتَ فَرَأَى رَجُلاً يَمْشِي بَيْنَ الْمَقَابِرِ فِي نَعْلَيْهِ فَقَالَ \" يَا صَاحِبَ السِّبْتِيَّتَيْنِ أَلْقِهِمَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1568، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1568 (Chapters Regarding Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1568، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1568 (Capítulos sobre los funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 1568 (Chapitres relatifs aux funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
