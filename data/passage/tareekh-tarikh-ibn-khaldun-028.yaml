text: "كانت أربعة أنهار تجري تحت سريره، ذكره أبو القاسم بن خرداذبه في كتاب المسالك والممالك قال: وكان طولها اثني عشر ميلا، وكانت جباية مصر تسعين الف ألف دينار مكررة مرتين بالدينار الفرعوني وهو ثلاثة مثاقيل. وإنما سميت مصر بمصر بن"
