text: "… اللّٰه أحله لى لأني مضطر ولكن لم أكن لأشمتك بدين الإسلام. ولأن إباحة الأكل رخصة فلا تجب عليه، كسائر الرخص، ولأن له غرضا في اجتناب النجاسة والأخذ بالعزيمة، وربما لم تطب نفسه بتناول الميتة، وفارق الحلال فى الأصل من هذه …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 4، ص 201، يذكر الحلال، والمباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 4, p. 201, that mentions the lawful, the permissible, the concession; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 4، ص 201 کا اقتباس جس میں حلال، مباح، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 4, pág. 201, que menciona lo lícito, lo permisible y la concesión; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation, volume 4, p. 201) mentionnant le licite, le permis et la concession; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 4, sayfa 201'den, helal, mübah ve ruksah konularını ele alan bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 4 Bergambar, halaman 201, yang membahas tentang apa yang diperbolehkan (halal), diizinkan (mubah), dan keringanan (rukhsah); diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
