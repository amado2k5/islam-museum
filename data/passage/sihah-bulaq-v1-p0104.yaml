text: |-
  ⁦(فصل القاف)⁩
  oTY
  تمسك بالشى ثم لا يلبث أن يدعه ويرفضه وراع قبضة اذا كان منقبض الا يتفسح فى رعى غنمه
  وتقبض عنه أى اشم_أزوة قبضت الجلدة فى الداراذا انزوت وقبضت الشى تقبيضا جعته
  وزويتسه وتقبيض المال اعطاؤه لمن يأخذه وقبض فلان أى مات فه ومقبوض والقبض
  الاسراع ومنه قوله تعالى أولم يروا الى الطير فوقهم صافات ويقيضن ورجل قابض وقبيض
  بين القباضة اذا كان منكمشاسر بعاقال الراجز
  يعجل ذا القباضة الوخيا * أن يرفع المتزر عنه شيا
  وفرس قبيض الشدة أى سريع نقسل القوام والقبض الوق السريع يقال هذا؟
  حادقابض قال الراجز
  كيف تراها والحداة تقبض • بالغمل إيلار الرحال تنفض
  وحاد قياض وقباضة قال روّبة قباضة بين العنيف واللبق
  والقنبضة من النساء
  القصيرة والنون زائدة قال الفرزدق
  اذا القنبضات السود طوفن بالنهى • رقدن علين الجال المسجف
  والرجل قنبض(قرض قرضت الشى أقرضه بالكسر قر ضاقطعته يقال جاءفلان
  وقد رض رباطه والفأرة تقرض الثوب والقرض أيضاقول الشه رخاصة يقال قرضت
  الشعرأقرضه انه اقلته والشعرقريض ومنه قول عبيد بن الابرص
  حال الجريض دون القريض والقريض أيضامايرده البعير من جرّته وكذلك المروض
  وبعضهم يحمل قول عبيد على هذا والقراضة ماسقط بالقرض ومنهة راضة الذهب
  والمتراض واحد المقاريض وقرض فلان أى مات وانقرض القوم درجوا ولم يبق منهم
  أحمدوقوله تعالى واذا غربت ترضهم ذات الشمال قال أبو عبيدة أى تخلقهم شمالا
  وتجاو زهم وتقطعهم وتتركهم عن شمالها ويقول الرجل لصاحبه هل مررت بمكان كذا
  وكذافية ول المئول قرضته ذات اليمين ليلا وأنشدلذى الرمة
  الى ظعن يقرضن أجواز مشرف * شمالاوعن أيمانهنّ الفوارس
  ومشرف والفوارس موضعان يقول نظرت الى ظعن يقرضن أى يجزِن بين هذين الموضعين
  والقرض ما تعطيه من المال لتقضاه والقرض بالكسرلفة فيه حكاها الكسائى واستقرضت
  من فلان أى طلبت منه القرض فأقرضى واقترضت منه أى أخذت منه القرض والقرض
  أيضا ماسلقت من احسان ومن اداءة وهو على التشبيه قال الشاعر
  كل امرئ سوف يجزى قرضه حسنا * أوسيدًا ومد ينا-فل مادانا
  وقال اللّٰه تعالى وأقرضوا اللّٰه قرضاحسذا وقرضته قرضا وقارضته أى جازيته والتّة ريض
  مثل التقريظ يقال فلان يقرض صاحبه اذا مدحه أوذمه وهما يتقارضان الفير والشر قال
  الثاعر
  انَ الغى أخو الغى وانما • يتقارضان ولا أحا للمقتر
  والقرنان يتقارضان النظراذا تطر كل واحدمنهما الى صاحبه شزرا والمقارضة المضارية
  وقد قارضت فلانا قراضا اى دفعت اليه مالا يتجرفيه ويكون الرمح بينكما على ما تشسترطان
  والوضيعة على المال وابن مقرض دويبة بقال لها بالفارسية دله وهوقتال الحام ⁦( قضض )⁩
  ١٢٥
  هداح
  قول قتال المام صيغة مبالغة
