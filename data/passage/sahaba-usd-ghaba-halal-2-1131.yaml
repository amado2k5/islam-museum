text: "… بن عوف. وقيل: صهراً له من بني عبد شمس، فأثنى عليه في مصاهرته اسمها الشِّفاء. إياه فأحسن، قال: حدّثني فصدقني وَوَعدني فَوَفَى ولد بمكة بعد الهجرة بسنتين، وكان فقيهاً من أهل لي، وإني لست أُحرّم حلالاً، ولا أُحلل حراماً، العلم …"
