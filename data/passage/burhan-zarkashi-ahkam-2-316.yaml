text: "… يستحب استيفاء كل حرف أثبته قارئ. قال الحليمي: هذا ليكون القارئ قد أتى على جميع ما هو قرآن فتكون ختمة أصح من ختمة، إذا ترخص بحذف حرف أو كلمة قرئ بهما ألا ترى أن صلاة كل من استوفى كل فعل …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 316، يرد فيه ذكر المستحب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 316, whose wording mentions the recommended (mustahabb), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 316 کا اقتباس جس میں مستحب، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volume numérisé 2, p. 316, dont le texte mentionne le recommandé (mustahabb), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volumen digitalizado 2, p. 316, cuyo texto menciona lo recomendado (mustahabb), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Zarkashi'nin \"El-Burhan fi Ulum el-Kur'an\" adlı eserinin 2. cildinin 316. sayfasından, müstehaplı ve caiz olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz olan ameller, itaat amelleri, müstehaplı ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 2, halaman 316, yang menyebutkan amalan yang dianjurkan dan amalan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
