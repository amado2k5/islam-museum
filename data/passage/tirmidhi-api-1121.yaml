label: { ar: "جامع الترمذي 1121 — التحريم، الرخصة", en: "Jami' al-Tirmidhi 1121 — prohibition; the concession", ur: "جامع ترمذی 1121 — تحریم، رخصت", es: "Jami' al-Tirmidhi 1121 — prohibición; la concesión", fr: "Jami' al-Tirmidhi 1121 — interdiction; la concession", tr: "Cami' el-Tirmizi 1121 — Yasaklama, İzin", id: "Jami' al-Tirmidhi 1121 — Larangan, Izin" }
text: "… سَبْرَةَ الْجُهَنِيِّ وَأَبِي هُرَيْرَةَ. قَالَ أَبُو عِيسَى حَدِيثُ عَلِيٍّ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ وَإِنَّمَا رُوِيَ عَنِ ابْنِ عَبَّاسٍ شَيْءٌ مِنَ الرُّخْصَةِ فِي الْمُتْعَةِ ثُمَّ رَجَعَ عَنْ قَوْلِهِ حَيْثُ أُخْبِرَ عَنِ النَّبِيِّ وَأَمْرُ أَكْثَرِ أَهْلِ الْعِلْمِ عَلَى تَحْرِيمِ الْمُتْعَةِ وَهُوَ قَوْلُ الثَّوْرِيِّ وَابْنِ الْمُبَارَكِ وَالشَّافِعِيِّ وَأَحْمَدَ وَإِسْحَاقَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1121، يذكر التحريم، والرخصة. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1121 (The Book on Marriage), that mentions prohibition, the concession. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1121، جس میں تحریم، رخصت کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 1121 (El Libro del Matrimonio), menciona la prohibición y la concesión. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1121 (Le Livre du Mariage), mentionne l'interdiction et la permission. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'nin 1121 numaralı hadisinde, helal ve haram olan şeyler belirtilmiştir. Bu hadis, helal ve haram bölümü tarafından derlenmiş olup, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin helal ve haram hakkındaki sözlerinden metinler içermektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1121, menyebutkan apa yang diharamkan dan apa yang diperbolehkan. Hadits ini dikompilasi oleh bagian Halal dan Haram, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
