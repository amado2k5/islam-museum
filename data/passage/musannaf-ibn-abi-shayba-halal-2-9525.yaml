text: "… الصّغر لا يحرّم الحرام الحلال لا يحرّم الرّضاع إلاّ ما أنبت اللّحم والدّم لا يحرّم الماء شيء لا يحرّم مسلم كافراً لا يحرّم من الرّضاع إلاّ ما فتق الأمعاء لا يحرّم من الرّضاع إلا ما كان في الحولين لا يحرّمها …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 9525، يذكر الحلال، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 9525, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 9525 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
