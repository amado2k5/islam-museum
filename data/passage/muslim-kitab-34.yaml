summary:
  ar: "القسم 34 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصيد والذبائح وما يؤكل من الحيوان»، ويضم فيها النصوص من 4972 إلى 5063 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 34 of Sahih Muslim (The Book of Hunting, Slaughter, and what may be Eaten) in the division of the open hadith dataset the museum took its reports from: reports 4972 to 5063 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 34، عنوان «کتاب الصید والذبائح وما یؤکل من الحیوان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4972 تا 5063۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 34 del Sahih Muslim (El Libro de la Caza, la Matanza y lo que se Puede Comer) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4972 al 5063 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
