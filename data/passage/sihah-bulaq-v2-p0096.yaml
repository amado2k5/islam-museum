text: |-
  •مضا)•
  ٤٩٥٠
  بسبيه سبيا أى غرّ به وأبعده كما تقول لعنه اللّٰه وقولهم ذهبوا أيدى سباوأيادى سباأى
  متفرّقين وهما اسمان جعلا اسما واحدا مثل معد يكرب وهو مصروف لانه لا يقع الاحالا
  أضفت أولم تضف والسابيا، المشيمة التى تخرج مع الولد والسابياه أيضا النتاج واذا كثر
  نسل الغنم فهى السابياء وينوفلان تروح عليهم سابياء من مالهم وفى الحديث تسعة أعشمراء
  البركة فى التجارة وعشر فى السابياء والجمع السنوابي وأسابة الدماء طرائها واحدتها
  اسباءة عن أبى عبيدة قال سلامة بن جندل يذكر الخيل
  والعاديات أسابي الدماهبها • كأت أعناقها أنصاب ترجيب
  قوله أنساب يحتمل أن ير يدبه بمع النصب الذى كانوا يعبدونه ويرجبون له العتائر ويحتمل
  أن يريدبه مانصب من العود والنخلة الرجبية ⁦(ستا)⁩ الستالغة فى سدا الثوب قال الراجز
  ربة خليل لى مليح رديته+ عليه سربال شديد صفرته•ستاه قزوو يرلحمته
  أبوزيدستاة الذوب وسداة الثوب بعسنى وأستيت التوب مثل أسديته قال أبو عبيدة
  سستاتت الناقة استيتاء اذا استرخت من الضبعة ( ما السحية الخلق والطبيعة وقد
  سجا الشى سج وسجواسكن ودام وقوله تعالى والليل اذاسجا أى اذا دام وسكن وايلة
  ساجية وساكفة وساكرة بمعنى ومنه البهر الساجى قال الاعشى
  خاذنبنا أن جاش بحرابن عمكم • وبحرك ساج لايوارى الدعامصا
  وطرف ساج أى ساكن وسجيت الميت تسحبية اذا مددت عليسه ثو يا⁦(-ها )⁩ السصا
  نلفاش الواحدة محاة مفتوحان مقصوران عن النضر بن شميل وفصاة كل شى أيضاقشره
  والجمع مها والسحاة أيضا الساحة بقال لا أرينك بسعسحى وهداتى وسحاء الكتاب مكسور
  عدود الواحدة محاءة والجمع أسحية وحوت القرطاس وسحيته أيضا أسحاه اذا قشرته
  وكذلك محوت الطين عن وجه الارض وسحيته اذا جرفته وأنا أسها وأسحو وأسحى ثلاث
  لغمات وسحوت الكتاب وسحيته اذا شددته بالسعاء وأسحى الرجل كترت عنده الاسحية
  ووجل أمحوان بالضم كثير الاكل والساحية المعارة الشديدة الوقع التى تقشروجه
  الارض والسصاء أيضانبت تأكل منه انصل فيطيب عسلى إعليه والمسحاة كالجرفة الا أنها
  من حديد وأما قول أبى زبيد
  كأن أوب مساحى القوم فوقهسم • طير تعيف على جون من احيف
  شبه رجع أيدى القوم بالمساحى المعوجة التى يقال لها بالفارسبية كنند فى حفر قبرعثمان
  رضى اللّٰه عنه بطير تعيف على جون مزاحيف ويقال ضب ساح برعى السحاء ويقال أيضا
  ما فى السماء مهاة من مصاب ( سضنا السخارة والسخاه الموديقسال منه مذا يسخو وسخى
  يسخى مثله قال عمروبن كادوم
  مشعشعة كان الحص فيها * اذا ما الماءخالطها سخينا
  أى جدنا باموالناوقول من قال سخينامن السخونة نصب على الحال فليس بشئ وميخيت
  نفسى عن الشى اذاتركته وسخو الرجل يسخو منخاوة أى صار-نحيا وسنخوت النار أسخوها
  سذوا وذلك اذا أو قددت فاجتمع الجر وارمادفة رجته وفيه لغة أخرى حكاهما جيعا
  قونه أعشراء البركة دواه فى مادة
  عشر أعشراء الرزق قال
  والعشر الجز من أجزاه العشرة
  وكذلك العشير وجع العشير
  أعشراء مثسل نصيب وانصباء
  وفى الحديث الخ اه
