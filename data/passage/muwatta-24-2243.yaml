label: { ar: "الموطأ 2243 — مالك: من أعتق عبدا له فبت عتقه، حتى تجوز شهادته وتتم حرمته ويثبت ميراثه، فليس لسيده أن يشترط عليه مثل ما يشترط على عبده من مال أو خدمة، ولا يحمل عليه شيئا من الرق، لأن النبي قال: من أعتق شركا له في عبد قوم عليه قيمة العدل", en: "Muwatta 2243", es: "Muwatta 2243", fr: "Muwatta 2243", ur: "موطا 2243", tr: "El-Muvatta 2243 — Malik: Kim kölesini azat eder ve azat işlemi kesinleşirse, şahitliği geçerli olur, kutsallığı tesis edilir ve mirası ispatlanırsa, efendisi ona kölesine koyduğu aynı şartları, para veya hizmet açısından, koyamaz; ona herhangi bir kölelik biçimi dayatamaz. Çünkü Peygamber şöyle buyurmuştur: \"Kim bir köledeki payını azat ederse, kölenin değeri hakkaniyetle belirlenir.\"", id: "Al-Muwatta 2243 — Malik: Barangsiapa membebaskan budaknya dan pembebasan itu bersifat final, sehingga kesaksiannya sah, kesuciannya ditegakkan, dan warisannya terbukti, maka tuannya tidak dapat menetapkan syarat yang sama kepada budaknya seperti yang ia tetapkan kepada budaknya dalam hal uang atau jasa, dan tidak pula dapat memaksakan bentuk perbudakan apa pun kepadanya, karena Nabi bersabda: Barangsiapa membebaskan bagiannya dalam seorang budak, maka nilai budak itu harus ditentukan dengan adil." }
summary:
  ar: "قال مالك: من أعتق عبدا له فبت عتقه، حتى تجوز شهادته وتتم حرمته ويثبت ميراثه، فليس لسيده أن يشترط عليه مثل ما يشترط على عبده من مال أو خدمة، ولا يحمل عليه شيئا من الرق. لأن رسول الله قال: من أعتق شركا له في عبد، قوم عليه قيمة العدل، فأعطى شركاءه حصصهم، وعتق عليه العبد. قال مالك: فهو إذا كان له العبد خالصا، أحق باستكمال عتاقته، ولا يخلطها بشيء من الرق. {cite:muwatta-maruf-1997 p.324} {cite:muwatta-maruf-1997 p.325}"
  id: "Malik berkata: Jika seseorang membebaskan budaknya dan pembebasannya bersifat final, sehingga kesaksiannya dapat diterima, hak-haknya ditegakkan, dan warisannya dikonfirmasi, maka tuannya tidak dapat menetapkan syarat yang sama seperti yang ditetapkan untuk budaknya sendiri, seperti uang atau jasa, dan juga tidak dapat memaksakan bentuk perbudakan apa pun kepadanya. Ini karena Rasulullah shalla Allahu alaihi wa sallam bersabda: Barang siapa membebaskan bagiannya dalam seorang budak, maka nilai budak tersebut dinilai secara adil, dan para mitranya diberikan bagian mereka, dan budak tersebut kemudian dibebaskan. Malik berkata: Jika budak itu adalah satu-satunya miliknya, maka ia berhak untuk menyelesaikan pembebasannya dan tidak mencampurnya dengan bentuk perbudakan apa pun. {cite:muwatta-maruf-1997 p.324} {cite:muwatta-maruf-1997 p.325}"
