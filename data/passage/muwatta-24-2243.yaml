label: { ar: "الموطأ 2243 — مالك: من أعتق عبدا له فبت عتقه، حتى تجوز شهادته وتتم حرمته ويثبت ميراثه، فليس لسيده أن يشترط عليه مثل ما يشترط على عبده من مال أو خدمة، ولا يحمل عليه شيئا من الرق، لأن النبي قال: من أعتق شركا له في عبد قوم عليه قيمة العدل", en: "Muwatta 2243" }
summary:
  ar: "قال مالك: من أعتق عبدا له فبت عتقه، حتى تجوز شهادته وتتم حرمته ويثبت ميراثه، فليس لسيده أن يشترط عليه مثل ما يشترط على عبده من مال أو خدمة، ولا يحمل عليه شيئا من الرق. لأن رسول الله قال: من أعتق شركا له في عبد، قوم عليه قيمة العدل، فأعطى شركاءه حصصهم، وعتق عليه العبد. قال مالك: فهو إذا كان له العبد خالصا، أحق باستكمال عتاقته، ولا يخلطها بشيء من الرق. {cite:muwatta-maruf-1997 p.324} {cite:muwatta-maruf-1997 p.325}"
