text: "… يرجى أن ينحل في صدره من الفضول. واعلم أن من الأمراض أمراضاً تنتقل إلى أمراض أخرى وتقلع هي ويكون فيها خيرة، فيكون مرض واحد شفاء من أمراض أخرى مثل الربع، فإنه كثيراً ما يشفي من الصرع والنقرس والدوالي وأوجاع المفاصل …"
