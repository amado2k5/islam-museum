text: "الاستيعاب في معرفة الأصحاب عديِّ بن كعبٍ، القُرشِيَّة العدَوِيَّة، امرأَة عامرِ بن في مغازيه تداوي الجرحى، وتقوم على المرضى، حديثها : أنّ النَّبيَّ وَلي يه قال لعائِشة : هذا ربيعةَ، هاجَرتِ الهجرتين، وصَلَّتِ القبلتين. روتْ عنها الشّفاء، ويقالُ : إِنَّها …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 936، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
