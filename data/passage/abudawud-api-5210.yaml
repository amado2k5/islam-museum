label: { ar: "سنن أبي داود 5210 — الأب والأبوة", en: "Sunan Abi Dawud 5210 — the father and fatherhood", ur: "سنن ابی داؤد 5210 — باپ اور والدیت", es: "Sunan Abi Dawud 5210 — El padre y la paternidad" }
text: "… عَلِيٍّ، حَدَّثَنَا عَبْدُ الْمَلِكِ بْنُ إِبْرَاهِيمَ الْجُدِّيُّ، حَدَّثَنَا سَعِيدُ بْنُ خَالِدٍ الْخُزَاعِيُّ، قَالَ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ الْمُفَضَّلِ، حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ أَبِي رَافِعٍ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، - قَالَ أَبُو دَاوُدَ رَفَعَهُ الْحَسَنُ بْنُ عَلِيٍّ - قَالَ \" يُجْزِئُ عَنِ الْجَمَاعَةِ، إِذَا مَرُّوا أَنْ يُسَلِّمَ، أَحَدُهُمْ وَيُجْزِئُ عَنِ الْجُلُوسِ أَنْ يَرُدَّ أَحَدُهُمْ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5210، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5210 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5210، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5210 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
