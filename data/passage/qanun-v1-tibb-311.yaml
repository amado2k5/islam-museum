  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 311, that mentions illness and the sick, pain, named diseases, treatment, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
