text: "… نبدأ بعلاج المرض، إلا أن يغلبه العرض، فحينئذ نقصد فصد العرض ولا نلتفت إلى المرض، كما نسقي المخدّرات في القولنج الشديد الوجع إذا صعب، وإن كان يضرّ نفس القولنج، وكذلك ربما أخرنا الواجب من الفصد لضعف المعدة أو لإسهال متقدّم …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 311، يذكر المرض والمريض، والوجع، وأسماء الأمراض، والعلاج، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 311, that mentions illness and the sick, pain, named diseases, treatment, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 311 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، علاج، اعضائے بدن، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 311, que menciona la enfermedad y los enfermos, el dolor, enfermedades específicas, el tratamiento, los órganos del cuerpo, la cirugía, la circuncisión y las férulas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 311, qui mentionne la maladie et les malades, la douleur, les maladies nommées, le traitement, les organes du corps, la chirurgie, la circoncision et les attelles; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 311'den bir bölüm; hastalık, hasta, ağrı, hastalıkların isimleri, tedavi, vücut parçaları, ameliyat, sünnet ve atellerden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 311, yang menyebutkan penyakit, pasien, rasa sakit, nama-nama penyakit, pengobatan, bagian tubuh, pembedahan, sunat, dan bidai; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
