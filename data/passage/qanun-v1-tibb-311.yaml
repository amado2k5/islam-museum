text: "… نبدأ بعلاج المرض، إلا أن يغلبه العرض، فحينئذ نقصد فصد العرض ولا نلتفت إلى المرض، كما نسقي المخدّرات في القولنج الشديد الوجع إذا صعب، وإن كان يضرّ نفس القولنج، وكذلك ربما أخرنا الواجب من الفصد لضعف المعدة أو لإسهال متقدّم …"
summary:
