label: { ar: "الموطأ 2166 — يحيى عن مالك عن هشام بن عروة عن أبيه: قال رسول الله من أحيا أرضا ميتة فهي له، وليس لعرق ظالم حق، وذكر مالك أن العرق الظالم كل ما احتفر أو أخذ أو غرس بغير حق", en: "Muwatta 2166", es: "Muwatta 2166", fr: "Muwatta 2166", ur: "موطا 2166", tr: "El-Muvatta 2166 — Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayetle: Allah Resulü şöyle buyurdu: \"Ölü toprağı canlandıran kimsenin toprağı ona aittir ve haksız kimsenin ona hakkı yoktur.\" Malik, haksız kimsenin, izinsiz kazıp, alıp veya eken kişi olduğunu belirtti.", id: "Al-Muwatta 2166 — Yahya, dari Malik, dari Hisham ibn Urwah, dari ayahnya: Rasulullah SAW bersabda, “Barangsiapa yang menghidupkan kembali tanah yang mati, maka tanah itu menjadi miliknya, dan orang yang zalim tidak berhak atasnya.” Malik menyebutkan bahwa orang yang zalim adalah siapa pun yang menggali, mengambil, atau menanam tanpa hak." }
summary:
  ar: "قال يحيى: حدثني مالك عن هشام بن عروة عن أبيه أن رسول الله قال: من أحيا أرضا ميتة فهي له، وليس لعرق ظالم حق. قال مالك: والعرق الظالم كل ما احتفر أو أخذ أو غرس بغير حق. ويذكر المحقق أن الحديث مرسل عند جماعة رواة مالك، وأن ما روي عن هشام موصولا من طرق لا يصح عنده إلا بالنظر في كل طريق. {cite:muwatta-maruf-1997 p.287} {cite:muwatta-maruf-1997 p.288}"
  tr: "Yahya şöyle dedi: Malik bana Hişam ibn Urvah'tan, o da babasından rivayet ederek, Allah Resulü'nün şöyle buyurduğunu nakletti: \"Ölü toprağı dirilten kimsenin toprağı ona aittir ve haksız kimsenin ona hakkı yoktur.\" Malik dedi ki: \"Haksız kimse, hakkı olmadan kazıp alan, alan veya eken kimsedir.\" Araştırmacı, hadisin Malik'in ravilerinden bir gruba göre mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve Hişam'dan rivayet edilen, birbirine bağlı isnad zincirleriyle anlatılan hadislerin, her bir isnad zinciri incelenmedikçe sahih sayılmadığını belirtiyor. {cite:muwatta-maruf-1997 s.287} {cite:muwatta-maruf-1997 s.288}"
  id: "Yahya berkata: Malik meriwayatkan kepadaku dari Hisham ibn Urwah, dari ayahnya, bahwa Rasulullah SAW bersabda: “Barangsiapa menghidupkan kembali tanah yang mati, maka tanah itu menjadi miliknya, dan orang yang zalim tidak berhak atasnya.” Malik berkata: “Orang yang zalim adalah siapa pun yang menggali, mengambil, atau menanam tanpa hak.” Peneliti menyebutkan bahwa hadits tersebut mursal (hadits dengan rantai periwayatan yang hilang) menurut sekelompok perawi Malik, dan bahwa apa yang diriwayatkan dari Hisham dengan rantai periwayatan yang terhubung tidak dianggap sahih olehnya kecuali dengan memeriksa setiap rantai periwayatan. {cite:muwatta-maruf-1997 p.287} {cite:muwatta-maruf-1997 p.288}"
