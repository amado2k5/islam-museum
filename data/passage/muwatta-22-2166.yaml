label: { ar: "الموطأ 2166 — يحيى عن مالك عن هشام بن عروة عن أبيه: قال رسول الله من أحيا أرضا ميتة فهي له، وليس لعرق ظالم حق، وذكر مالك أن العرق الظالم كل ما احتفر أو أخذ أو غرس بغير حق", en: "Muwatta 2166" }
summary:
  ar: "قال يحيى: حدثني مالك عن هشام بن عروة عن أبيه أن رسول الله قال: من أحيا أرضا ميتة فهي له، وليس لعرق ظالم حق. قال مالك: والعرق الظالم كل ما احتفر أو أخذ أو غرس بغير حق. ويذكر المحقق أن الحديث مرسل عند جماعة رواة مالك، وأن ما روي عن هشام موصولا من طرق لا يصح عنده إلا بالنظر في كل طريق. {cite:muwatta-maruf-1997 p.287} {cite:muwatta-maruf-1997 p.288}"
