text: |-
  ٢١٠
  فيقولون مافعلت الاحد عشر الالف درهم وتقول لا أحد فى الدار ولا تقل فيها أحدويوم
  الاحديجمع على آحاد وأ ما قولهم ما فى الدار أحد فهواسم ان يصلح أن يخاطب يستوى فيه
  الواحد والجم-ع والمؤنث وقال تعالى لستز كأحد من النساء وقال فامنكم من أحد
  عنه حاجزين واستأحد الرجل انفردوباؤا أحاد أحاد غير مصر وفين لانهما معدولان فى الافظ
  والمعنى جميعا وأحد جبل بالمدينة وحكى الفراءعن بعض الاعراب معى عشرة فأحدهن
  أى صيرهن أحد عشر وفى الحديث انه قال لرجل أشار بسبابتيه فى التشهد أحد أحد
  دد اتت الناقسة تؤذأذا اذارجعت الحنين فى جوفها والاديد الحلبة وشديد أديد
  اتداع نه والاذبالكسر والادّة الداهمة والامر الفظيع ومنه قوله تعالى لقد جيم شيما إذا
  وكذلك الا تمثل فاعل وجمع الادة أدد وأدت فلان دهية تؤده أذا بالفتح والاد أيضا القوّة
  قال الراجز
  نضوت عى شرّة وأذا • من بعدما كنت صعلانهدا
  وأذ أبو قبيلة بالضم وهوأدّين طابخة بن الياس بن مضر وأدد أ بوقبيلة من اليمن وهو أددين
  زيدين كهلان بن سبأبن حيروالعرب تصرف أدداجملوه بنزلة ثقب ولم يجعلوه بمنزلة عمر
  ⁦( أزد )⁩. أزد أبوحىّ من اليمسن وهو أزدين غوث بن نبت بن مالك بن كهلان بن سبأوهو
  بالسين أفصح يقال أزد شنوة وازد عمان وأزد السراة قال الشاعر النجاشى ق س بن عمر
  وكنت كذى رجلين رجل صحيحة * ورجل بم اريب من الحدثان
  فأما التى صحت فأزد شنوءة • وأما التى شلت فازد عمان
  ⁦( سد )⁩ الاسد بمعه أسودوأسدمقصور حثقل منه وأسد مخفف وآسد وآساد مثل أجبل
  وأَجبال قال أبوزيد الانثى أسدة وأسدأ بوقبيلة من مضر وهو أسدين خزيمة بن مدركة
  ابن الياس بن مضر وأسدأيضاقبيلة من ربيعة وهو أسدبن ربيعة بن نزار وأرض مأسدة
  أذات أسد وأسد الرجل بالكسراذارأى الاسدفدهش من الخوف وأسد أيضاصار كالاسد
  فى أخلاقه وفى المديث اذاد خسل فهدواذاخرج أسدواستأسد عليه اجترأ واستأسد
  النبت قوى والتف قال أبوخراش الهذلى له عرمض مستأسدونجيل وآسدت
  الكلب وأوسدته أغريته بالصيد والواومنقلبة عن الالف وآسدت بين القوم أفسدت
  والاسداغة فى الازديقال هم الاسد أسدشنوءة والاسدى ضرب من النياب وهوفى شعر
  الحطيئة والاسادة لغة فى الوسادة ( صد الأهدة بالضم قيص يليس تحت الذوب
  قال الشاءر ومرهق سال امتاعا بأصدته * لم يستحن وحوامى الموت تغشاه
  وتلبسه أيضاصذارالجوارى تقول أصدته تأصيدا قال كثير
  وقددرء وهاوهى ذات مؤصد * مجوب ولما يلبس الدرع ريدها
  والاصيدلغة فى الوصيدوهوالفناء والاصيدة كالحظيرة لغة فى الوصيدة وآصدت الباب لغة
  فى أوصدته اذا أغاقته ومنه قرأ أبو عم روانه اعليهم مؤصدة بالهمزوكان مجرى داحس
  والغبراء من ذات الاصادوهوموضع وكانت الغاية مائة غلوة والاصادهى ردهة بين أجيل
  ⁦( أند)⁩ افد الرجل بالكسريافدأفدا أى عجل فهوأفدعلى فعل أى مستعجل وأفد الترحل
  أدناوأزف ⁦(اكد )⁩ التأكيداغة فى التوكيد وقد أكدت الشئ ووكدته
  ⁦(امد )⁩
