text: "… حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يَزِيدَ، حَدَّثَنِي رَبِيعَةُ بْنُ يَزِيدَ، وَعَطِيَّةُ بْنُ قَيْسٍ، عَنْ عَطِيَّةَ السَّعْدِيِّ، وَكَانَ، مِنْ أَصْحَابِ النَّبِيِّ قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يَبْلُغُ الْعَبْدُ أَنْ يَكُونَ مِنَ الْمُتَّقِينَ حَتَّى يَدَعَ مَا لاَ بَأْسَ بِهِ حَذَرًا لِمَا بِهِ الْبَأْسُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "خبر في جامع الترمذي، رقم 2451، في ترك ما لا بأس به حذرا مما به بأس. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Jami' al-Tirmidhi, no. 2451, on leaving what is harmless out of caution for what is harmful. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "جامع ترمذی کی روایت نمبر 2451: جس میں حرج ہے اس کے ڈر سے بے حرج چیز چھوڑ دینا۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2451, sobre la importancia de evitar lo inofensivo por precaución ante lo perjudicial. No utiliza las palabras halal ni haram; el buscador de textos sobre lo lícito y lo ilícito lo incluye junto con los relatos sobre el escrúpulo y la búsqueda de lo lícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2451, traite de la prudence face au danger et de l'abstention de ce qui est inoffensif. Il n'emploie pas les termes halal ou haram; le Halal and Haram Browser le classe parmi les hadiths relatifs à la conscience morale et à la recherche du licite."
