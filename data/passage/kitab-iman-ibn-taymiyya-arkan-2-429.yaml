text: "… وجوب الإيمان بالقيامة والمحاسبة... الخ. لحديث عمر - وهو حديث جبريل لما سأل الرسول عن الإسلام والإيمان والإحسان. وقد ورد فيه ذكر الإيمان باليوم الآخر وأنه من أركان الإيمان. وقد تقدم في أول الكتاب. ثم ذكر حديث أبن عمر في …"
