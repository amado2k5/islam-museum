label: { ar: "الموطأ 1196 — هشام بن عروة عن أبيه: صلى النبي وأبو بكر وعمر وعثمان بمنى ركعتين", en: "Muwatta 1196", es: "Muwatta 1196", fr: "Muwatta 1196", ur: "موطا 1196", tr: "El-Muvatta 1196 — Hişam ibn Urve, babasının rivayetine göre: Peygamber, Ebu Bekir, Ömer ve Osman Mina'da iki rekat namaz kıldılar.", id: "Al-Muwatta 1196 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Nabi, Abu Bakar, Umar, dan Utsman shalat dua rakaat di Mina" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن رسول الله صلى بمنى ركعتين، وأن أبا بكر وعمر وعثمان صلوها بمنى ركعتين، وأن عثمان صلاها شطر إمارته ثم أتمها بعد. {cite:muwatta-maruf-1997 p.538}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ettiğine göre, Allah Resulü Mina'da iki rekat namaz kılmıştır; Ebu Bekir, Ömer ve Osman da Mina'da iki rekat namaz kılmış ve Osman halifeliğinin yarısında bu namazları kılmış, daha sonra da tamamlamıştır. {cite:muwatta-maruf-1997 s.538}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, yang juga meriwayatkan dari ayahnya, bahwa Rasulullah SAW shalat dua rakaat di Mina, dan bahwa Abu Bakar, Umar, dan Utsman shalat dua rakaat di Mina, dan Utsman melaksanakannya selama setengah masa kekhalifahannya dan kemudian menyelesaikannya setelah itu. {cite:muwatta-maruf-1997 p.538}"
