label: { ar: "الموطأ 692 — مالك: من اشترى حنطة أو تمراً للتجارة وأمسكها حولاً ثم باعها فعليه الزكاة حين يبيعها", en: "Muwatta 692", es: "Muwatta 692", fr: "Muwatta 692", ur: "موطا 692", tr: "El-Muvatta 692 — Malik: Ticaret için buğday veya hurma satın alıp bir yıl beklettikten sonra satan kimse, sattığı zaman zekâtını ödemek zorundadır.", id: "Al-Muwatta 692 — Malik: Barang siapa membeli gandum atau kurma untuk diperdagangkan dan menyimpannya selama setahun, kemudian menjualnya, maka ia wajib membayar zakat ketika menjualnya." }
summary:
  ar: "قول لمالك: الأمر عندنا في الرجل يشتري بالذهب أو الورق حنطة أو تمراً للتجارة ثم يمسكها حتى يحول عليها الحول ثم يبيعها: أن عليه فيها الزكاة حين يبيعها إذا بلغ ثمنها ما تجب فيه الزكاة، وليس ذلك مثل الحصاد يحصده الرجل من أرضه ولا مثل الجداد. ويذكر المحقق أن زيادة «أو غيرهما» في نسخة م لا أصل لها في النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.347}"
  tr: "Malik şöyle dedi: Hükmümüz şudur ki, bir kimse altın veya gümüşle ticaret için buğday veya hurma alır, bir yıl bekletir ve sonra satarsa, fiyatı zekât eşiğine ulaştığında sattığı zaman zekât vermekle yükümlüdür. Bu, bir insanın tarlasından biçtiği hasada veya tahıl hasadına benzemez. Editör, M el yazmasında \"veya diğer\" ifadesinin eklenmiş olmasının el yazmalarında bir dayanağı olmadığını ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.347}"
  id: "Malik berkata: Hukum kami adalah jika seseorang membeli gandum atau kurma untuk diperdagangkan dengan emas atau perak, menyimpannya hingga satu tahun berlalu, dan kemudian menjualnya, ia wajib membayar zakat atas barang tersebut ketika ia menjualnya jika harganya mencapai ambang batas zakat. Ini tidak seperti panen yang dipetik seseorang dari tanahnya, dan tidak seperti panen biji-bijian. Editor mencatat bahwa penambahan \"atau lainnya\" dalam manuskrip M tidak memiliki dasar dalam manuskrip, dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.347}"
