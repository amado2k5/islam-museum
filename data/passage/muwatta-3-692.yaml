label: { ar: "الموطأ 692 — مالك: من اشترى حنطة أو تمراً للتجارة وأمسكها حولاً ثم باعها فعليه الزكاة حين يبيعها", en: "Muwatta 692" }
summary:
  ar: "قول لمالك: الأمر عندنا في الرجل يشتري بالذهب أو الورق حنطة أو تمراً للتجارة ثم يمسكها حتى يحول عليها الحول ثم يبيعها: أن عليه فيها الزكاة حين يبيعها إذا بلغ ثمنها ما تجب فيه الزكاة، وليس ذلك مثل الحصاد يحصده الرجل من أرضه ولا مثل الجداد. ويذكر المحقق أن زيادة «أو غيرهما» في نسخة م لا أصل لها في النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.347}"
