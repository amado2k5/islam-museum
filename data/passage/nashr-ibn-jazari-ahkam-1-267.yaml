  tr: "İbn el-Cezeri'nin \"On Okuma\" adlı eserinin 1. cildinin 267. sayfasından bir alıntı, farz, müstehap, arzu edilen ve müstehap olan amellerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, itaat amelleri, müstehap olan amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Jazari, \"Sepuluh Bacaan,\" Jilid 1, halaman 267, menyebutkan amalan wajib, anjuran, yang diinginkan, dan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
