text: "… ما ذكر فيها في مسائل الاولى ذهب الجمهور الى ان الاستعاذة مستحبة في القراءة بكل حال. في الصلاة وخارج الصلاة وحملوا الإمر في ذلك على الندب وذهب داود بن علي واصحابه الى وجوبها حملا للامر على الوجوب كما هو الاصل …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 267، يرد فيه ذكر الوجوب، والمستحب، والمندوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
