text: "… \". فَبَلَغَ ذَلِكَ عَلِيًّا فَقَالَ صَدَقَ ابْنُ عَبَّاسٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ حَسَنٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ فِي الْمُرْتَدِّ. وَاخْتَلَفُوا فِي الْمَرْأَةِ إِذَا ارْتَدَّتْ عَنِ الإِسْلاَمِ فَقَالَتْ طَائِفَةٌ مِنْ أَهْلِ الْعِلْمِ تُقْتَلُ وَهُوَ قَوْلُ الأَوْزَاعِيِّ وَأَحْمَدَ وَإِسْحَاقَ. وَقَالَتْ طَائِفَةٌ مِنْهُمْ تُحْبَسُ وَلاَ تُقْتَلُ وَهُوَ قَوْلُ سُفْيَانَ الثَّوْرِيِّ وَغَيْرِهِ مِنْ أَهْلِ الْكُوفَةِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1458، يذكر تعريف الإسلام بأعماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 1458 (The Book on Legal Punishments (Al-Hudud)), that mentions Islam defined by its acts. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 1458، جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1458 (El Libro de los Castigos Legales (Al-Hudud)), menciona el Islam definido por sus actos. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los informes de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1458 (Le Livre des peines légales (Al-Hudud)), mentionne que l'islam est défini par ses actes. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
