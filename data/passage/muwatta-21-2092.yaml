label: { ar: "الموطأ 2092 — مالك: فيمن اشترى شقصا في دار أو أرض وحيوانا وعروضا في صفقة واحدة، فطلب الشفيع شفعته في الدار أو الأرض، فيأخذ الشفيع شفعته في الدار أو الأرض بحصتها من الثمن، ولا يأخذ من الحيوان والعروض شيئا إلا أن يشاء", en: "Muwatta 2092" }
summary:
  ar: "قال مالك: من اشترى شقصا في دار أو أرض وحيوانا وعروضا في صفقة واحدة، فطلب الشفيع شفعته في الدار أو الأرض، فقال المشتري: خذ ما اشتريت جميعا، فإني إنما اشتريته جميعا. قال مالك: بل يأخذ الشفيع شفعته في الدار أو الأرض، بحصتها من ذلك الثمن، يقام كل شيء اشتراه على حدته، على الثمن الذي اشتراه به، ثم يأخذ الشفيع شفعته بالذي يصيبها من القيمة من رأس الثمن، ولا يأخذ من الحيوان والعروض شيئا، إلا أن يشاء ذلك. {cite:muwatta-maruf-1997 p.255} {cite:muwatta-maruf-1997 p.256}"
