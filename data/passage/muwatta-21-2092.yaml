label: { ar: "الموطأ 2092 — مالك: فيمن اشترى شقصا في دار أو أرض وحيوانا وعروضا في صفقة واحدة، فطلب الشفيع شفعته في الدار أو الأرض، فيأخذ الشفيع شفعته في الدار أو الأرض بحصتها من الثمن، ولا يأخذ من الحيوان والعروض شيئا إلا أن يشاء", en: "Muwatta 2092", es: "Muwatta 2092", fr: "Muwatta 2092", ur: "موطا 2092", tr: "Al-Muwatta 2092 — Malik: Bir kimse, tek bir işlemde bir ev veya arsanın bir kısmını, hayvan ve mallarla birlikte satın alırsa ve ön alım hakkı sahibi ev veya arsa üzerindeki ön alım hakkını ileri sürerse, ön alım hakkı sahibi, evin veya arsanın bedelinin kendi payına düşen kısmını alır ve dilerse hayvanlardan ve mallardan hiçbir şey almaz.", id: "Al-Muwatta 2092 — Malik: Mengenai seseorang yang membeli sebagian rumah atau tanah, beserta hewan dan barang-barang, dalam satu transaksi, dan pemegang hak prioritas menuntut hak prioritasnya atas rumah atau tanah tersebut, maka pemegang hak prioritas tersebut mengambil hak prioritasnya atas rumah atau tanah tersebut sesuai dengan bagiannya dari harga, dan ia tidak mengambil apa pun dari hewan dan barang-barang tersebut kecuali jika ia menginginkannya." }
summary:
  ar: "قال مالك: من اشترى شقصا في دار أو أرض وحيوانا وعروضا في صفقة واحدة، فطلب الشفيع شفعته في الدار أو الأرض، فقال المشتري: خذ ما اشتريت جميعا، فإني إنما اشتريته جميعا. قال مالك: بل يأخذ الشفيع شفعته في الدار أو الأرض، بحصتها من ذلك الثمن، يقام كل شيء اشتراه على حدته، على الثمن الذي اشتراه به، ثم يأخذ الشفيع شفعته بالذي يصيبها من القيمة من رأس الثمن، ولا يأخذ من الحيوان والعروض شيئا، إلا أن يشاء ذلك. {cite:muwatta-maruf-1997 p.255} {cite:muwatta-maruf-1997 p.256}"
  tr: "Malik şöyle dedi: Eğer birisi tek bir işlemde bir ev veya arazinin bir kısmını, hayvanlar ve mallarla birlikte satın alırsa ve ön alım hakkı sahibi ev veya arazi üzerindeki ön alım hakkını kullanmak isterse ve alıcı, \"Aldığınız her şeyi alın, çünkü hepsini birlikte aldım\" derse, Malik şöyle dedi: Bunun yerine, ön alım hakkı sahibi, evin veya arazinin fiyatındaki orantılı payına göre ön alım hakkını kullanır. Satın alınan her bir eşya, satın alındığı fiyattan ayrı ayrı değerlendirilir ve daha sonra ön alım hakkı sahibi, orijinal fiyatın o kısmına karşılık gelen değer oranına göre hakkını kullanır. Hayvanlardan veya mallardan, kendileri istemedikçe hiçbir şey almazlar. {cite:muwatta-maruf-1997 s.255} {cite:muwatta-maruf-1997 s.256}"
  id: "Malik berkata: Jika seseorang membeli sebagian rumah atau tanah, beserta hewan dan barang-barang, dalam satu transaksi, dan pemegang hak prioritas ingin menggunakan hak prioritasnya atas rumah atau tanah tersebut, dan pembeli berkata, \"Ambil semua yang Anda beli, karena saya hanya membeli semuanya sekaligus,\" Malik berkata: Sebaliknya, pemegang hak prioritas mengambil hak prioritasnya atas rumah atau tanah tersebut, berdasarkan bagian proporsionalnya dari harga. Setiap barang yang dibeli dinilai secara terpisah dengan harga pembeliannya, dan kemudian pemegang hak prioritas mengambil haknya berdasarkan proporsi nilai yang sesuai dengan bagian harga asli tersebut. Mereka tidak mengambil apa pun dari hewan atau barang-barang tersebut kecuali jika mereka memilih demikian. {cite:muwatta-maruf-1997 p.255} {cite:muwatta-maruf-1997 p.256}"
