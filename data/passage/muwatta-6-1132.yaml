label: { ar: "الموطأ 1132 — مالك: ليس على المرأة التي يصيبها زوجها وهي محرمة مراراً في الحج أو العمرة، وهي له في ذلك مطاوعة، إلا الهدي وحج قابل إن أصابها في الحج، وإن أصابها في العمرة فعليها قضاء العمرة والهدي", en: "Muwatta 1132", es: "Muwatta 1132", fr: "Muwatta 1132", ur: "موطا 1132", tr: "El-Muvatta 1132 — Malik: Hac veya Umre sırasında ihramlı haldeyken kocası tarafından defalarca cinsel saldırıya uğrayan ve buna rıza gösteren bir kadının, eğer kocası Hac sırasında ona saldırırsa, sadece bir kurban kesmesi ve ertesi yıl Hac yapması gerekir. Eğer kocası Umre sırasında ona saldırırsa, tekrar Umre yapması ve bir kurban kesmesi gerekir.", id: "Al-Muwatta 1132 — Malik: Seorang wanita yang berulang kali dilecehkan secara seksual oleh suaminya ketika dalam keadaan ihram selama haji atau umrah, dan dia menyetujuinya, hanya diwajibkan untuk mempersembahkan hewan kurban dan melaksanakan haji pada tahun berikutnya jika suaminya melecehkannya selama haji. Jika suaminya melecehkannya selama umrah, dia harus melaksanakan umrah lagi dan mempersembahkan hewan kurban." }
summary:
  ar: "قول لمالك: ليس على المرأة التي يصيبها زوجها وهي محرمة مراراً في الحج أو العمرة، وهي له في ذلك مطاوعة، إلا الهدي وحج قابل إن أصابها في الحج. وإن أصابها في العمرة فإنما عليها قضاء العمرة التي أفسدت، والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1236). {cite:muwatta-maruf-1997 p.515}"
  tr: "Malik şöyle demiştir: Hac veya Umre sırasında ihramlı haldeyken kocası tarafından defalarca cinsel saldırıya uğrayan ve buna rıza gösteren bir kadının, saldırı Hac sırasında gerçekleşirse sadece bir kurban kesmesi ve ertesi yıl Hac yapması gerekir. Saldırı Umre sırasında gerçekleşirse, sadece geçersiz sayılan Umreyi kaza etmesi ve bir kurban kesmesi gerekir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1236) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.515}"
  id: "Malik berkata: Seorang wanita yang berulang kali dilecehkan secara seksual oleh suaminya ketika dalam keadaan ihram selama Haji atau Umrah, dan yang menyetujui hal tersebut, hanya diwajibkan untuk mempersembahkan hewan kurban dan melaksanakan Haji tahun berikutnya jika pelecehan terjadi selama Haji. Jika pelecehan terjadi selama Umrah, ia hanya diwajibkan untuk mengganti Umrah yang batal dan mempersembahkan hewan kurban. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1236). {cite:muwatta-maruf-1997 p.515}"
