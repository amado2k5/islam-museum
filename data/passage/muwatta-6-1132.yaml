label: { ar: "الموطأ 1132 — مالك: ليس على المرأة التي يصيبها زوجها وهي محرمة مراراً في الحج أو العمرة، وهي له في ذلك مطاوعة، إلا الهدي وحج قابل إن أصابها في الحج، وإن أصابها في العمرة فعليها قضاء العمرة والهدي", en: "Muwatta 1132" }
summary:
  ar: "قول لمالك: ليس على المرأة التي يصيبها زوجها وهي محرمة مراراً في الحج أو العمرة، وهي له في ذلك مطاوعة، إلا الهدي وحج قابل إن أصابها في الحج. وإن أصابها في العمرة فإنما عليها قضاء العمرة التي أفسدت، والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1236). {cite:muwatta-maruf-1997 p.515}"
