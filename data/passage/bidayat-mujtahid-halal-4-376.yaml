text: "… قول ابن عباس، وعلي، وابن عمر، وبه قال الثوري. وقال مالك: ما لم يصد من أجل المحرم، أو من أجل قوم محرمين فهو حلال، وما صيد من أجل محرم، فهو حرام على المحرم. وسبب اختلافهم تعارض الآثار في ذلك، فأحدها …"
summary:
