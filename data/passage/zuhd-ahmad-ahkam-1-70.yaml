text: "… صاحبه إلى الخدمة ويشتاق إليها أكثر من حنين الجائع إلى الطعام والشراب ؛ فإن العبد إذا ذاق حلاوة معاملة اللّٰه وقيل بالمداومة على الطاعات أحب الطاعة، فلا يستغنى عنها بحال، فإذا وجد نفسه معطلًا في غير طاعة اللّٰه تعلل ضاق …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 70، يرد فيه ذكر الطاعات، وطاعة الله ورسوله، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 70, whose wording mentions the acts of obedience, obedience to God and His Messenger, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 70 کا اقتباس جس میں طاعات، اللہ اور اس کے رسول کی اطاعت، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ahmad ibn Hanbal, volume numérisé 1, p. 70, dont le texte mentionne les actes d'obéissance, l'obéissance à Dieu et à Son Messager, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Zuhd de Ahmad ibn Hanbal, volumen digitalizado 1, p. 70, cuyo texto menciona los actos de obediencia, la obediencia a Dios y a Su Mensajero, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zühd) adlı eserinin 1. cildinin 70. sayfasından, itaat amelleri, Allah'a ve Resulüne itaat ve genel itaat konularından bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 1, halaman 70, yang menyebutkan amalan ketaatan, ketaatan kepada Allah dan Rasul-Nya, serta ketaatan secara umum. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
