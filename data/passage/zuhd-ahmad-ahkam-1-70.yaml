text: "… صاحبه إلى الخدمة ويشتاق إليها أكثر من حنين الجائع إلى الطعام والشراب ؛ فإن العبد إذا ذاق حلاوة معاملة اللّٰه وقيل بالمداومة على الطاعات أحب الطاعة، فلا يستغنى عنها بحال، فإذا وجد نفسه معطلًا في غير طاعة اللّٰه تعلل ضاق …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 70، يرد فيه ذكر الطاعات، وطاعة الله ورسوله، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
