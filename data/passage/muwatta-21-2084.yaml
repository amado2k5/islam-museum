label: { ar: "الموطأ 2084 — مالك: من وهب هبة في دار أو أرض مشتركة، فلم يثب منها، ولم يطلبها، فأراد شريكه أن يأخذها بقيمتها فليس ذلك له ما لم يثب عليها، فإن أثيب فهو للشفيع بقيمة الثواب", en: "Muwatta 2084", es: "Muwatta 2084", fr: "Muwatta 2084", ur: "موطا 2084", tr: "Al-Muwatta 2084 — Malik: Bir kimse bir evi veya ortak mülkiyeti bağışlar ve bundan pay almazsa, ya da talep etmezse ve ortağı bunu değeri üzerinden almak isterse, pay almadığı sürece buna hakkı yoktur. Eğer pay alırsa, o zaman payın değeri üzerinden öncelik hakkına sahip olana aittir.", id: "Al-Muwatta 2084 — Malik: Jika seseorang memberikan hadiah berupa rumah atau tanah yang dibagi, dan tidak menerima bagian darinya, dan juga tidak menuntutnya, dan rekannya ingin mengambilnya sesuai nilainya, maka ia tidak berhak atas hal itu kecuali jika ia menerima bagian darinya. Jika ia menerima bagian, maka bagian itu menjadi milik pihak yang berhak membeli sesuai nilai bagian tersebut." }
summary:
  ar: "قال مالك: من وهب هبة في دار أو أرض مشتركة، فلم يثب منها، ولم يطلبها، فأراد شريكه أن يأخذها بقيمتها، فليس ذلك له، ما لم يثب عليها. فإن أثيب، فهو للشفيع بقيمة الثواب. {cite:muwatta-maruf-1997 p.253}"
  tr: "Malik şöyle demiştir: Eğer birisi bir ev veya ortak araziyi hediye olarak verirse ve alıcı bunun için ödeme almazsa veya sahiplenmezse ve ortağı bunu değeri üzerinden almak isterse, ödeme almadıkça bunu yapamaz. Eğer ödeme alırsa, o zaman ödeme tutarı üzerinden öncelikli alım hakkı sahibine ait olur. {cite:muwatta-maruf-1997 s.253}"
  id: "Malik berkata: Jika seseorang memberikan hadiah berupa rumah atau tanah yang dibagi, dan penerima tidak menerima pembayaran untuk itu, juga tidak mengklaimnya, dan pasangannya ingin mengambilnya sesuai nilainya, ia tidak dapat melakukannya kecuali ia menerima pembayaran untuk itu. Jika ia menerima pembayaran, maka itu menjadi milik pemegang hak prioritas sesuai nilai pembayaran tersebut. {cite:muwatta-maruf-1997 p.253}"
