text: "… إلى واجب ومندوب ومباح، وخلاف الأولى كما فعل تاج الدين ابن السبكي في جمع الجوامع - مع حاشية العطار. خ. المحققون على أنه لا تطلق العزيمة إلا فيما كانت فيه الرخصة مقابلة لها، أما ما لا رخصة فيه بحال؛ فلا …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 1، ص 464، يرد فيه ذكر الواجب، والمندوب، والمباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
