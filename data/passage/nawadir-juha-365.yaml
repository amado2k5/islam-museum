text: "… أين ملحي وبهاري صاد كثيراً من السماني نوع من الطير، ونظفها جيّداً، وجعلها في قِذْرٍ"
summary:
  ar: "اصطاد جحا سمانى وتركها تُطبخ ثم ذهب ليدعو أصدقاءه، فأطلق صديق سمانى حية في القدر، فلما اجتمعوا رفع جحا الغطاء فطارت السمانى، فسأل أين ملحي وبهاراتي. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  en: "Juha catches quails and leaves them to cook while he goes to call friends; a friend releases live quails into the pot; when all gather, Juha lifts the lid and the quails fly away; he asks where his salt and spices are. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  ur: "جحا نے بٹیریں پکڑیں اور انہیں پکنے کے لیے چھوڑ کر دوستوں کو بلانے چلا گیا، ایک دوست نے ہانڈی میں زندہ بٹیریں چھوڑ دیں، جب سب جمع ہوئے تو جحا نے ڈھکن اٹھایا اور بٹیریں اڑ گئیں، تو اس نے پوچھا کہ اس کا نمک اور مصالحے کہاں ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  fr: "Juha attrape des cailles et les laisse cuire pendant qu'il va appeler ses amis ; un ami lâche des cailles vivantes dans la marmite ; quand tous sont réunis, Juha soulève le couvercle et les cailles s'envolent ; il demande où sont son sel et ses épices. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  es: "Juha atrapa codornices y las deja cocinándose mientras va a llamar a sus amigos; un amigo suelta codornices vivas en la olla; cuando todos se reúnen, Juha levanta la tapa y las codornices salen volando; pregunta dónde están su sal y sus especias. {cite:juha-nawadir-kubra-djuwaydi p. 180}"
  tr: "Juha bir bıldırcın yakaladı ve pişmesi için bıraktı. Sonra arkadaşlarını davet etmeye gitti. Bıldırcının bir arkadaşı tencereye bir yılan bıraktı. Hepsi toplandığında, Juha kapağı kaldırdı ve bıldırcın uçup gitti. Sonra, \"Tuzum ve baharatlarım nerede?\" diye sordu. {cite:juha-nawadir-kubra-djuwaydi s. 180}"
  id: "Juha menangkap seekor burung puyuh dan membiarkannya matang. Kemudian dia pergi mengundang teman-temannya. Seorang teman burung puyuh itu melepaskan seekor ular ke dalam panci. Ketika mereka semua berkumpul, Juha mengangkat tutupnya, dan burung puyuh itu terbang pergi. Kemudian dia bertanya, \"Di mana garam dan rempah-rempahku?\" {cite:juha-nawadir-kubra-djuwaydi p. 180}"
