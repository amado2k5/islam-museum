text: |-
  (ا هذه الجملة ساقطة من أكثر
  النسخ وقد تعقبها عاصم اه
  قاله نصر
  ⁦(باب البام)⁩
  الصوب نزول المطر والصيب السحاب دون الصوب وصاب أى نزل قال الشاعر
  فلست لانسى ولكن لملألْ • تنزل من جوّ السماء يصوب
  والتصوب مثله وصوّبت الفرس اذا أرسلته فى الجرى وقال امر والقيس
  فصوّيته كانه صوب غبية • على الامعز الضاحى اذاسيط أحضرا
  ويقال صابه المطرأى مطر وصاب السهم يصوب صيبوبة أى قصدولم يجر وصاب السهم
  .القرطاس يصيبه صيبالغة فى أصاب وفى المشل مع اللخواطئ مهم صائب وقولهم دعنى
  وعلى خطأى وصوب أى صواب قال الشاعر
  دعين انماخطأى وصوب • على وان ما أهلكت مال
  قول مال بالرفع أى وان الذى أهلكت اغماه ومال وأصابد أى وجده وأصابسه مصيبة
  أى أخذته فهومصاب والمصاب قسب السكر وأصاب فى قوه وأصاب القرطاس
  والمصاب الاصابة وقال الشاعر
  أسليم إنّ. صابكم رجلا • أهدى السلام تحية ظلم
  ورجل. ساب وف علدصابة أى فيه طرف من الجنون والصواب نقيض الخطأ وصوّبه
  أى قال له أصبت واستصوب فعله واستصاب فعله بمعنى وصوب رأسه أى خفضه قال ابن
  السكيت وأهل الفلج يسمون الجرين الصوبة وهو موضع التمر وتول دخلت على فلان فاذا
  الدنانيرصوية بيزيديه أى مهيلة والمصيبة واحسدة المصائب والمصوية بضم الصادم:-ل
  المصيبة وأجعت العرب على همز المصائب وأصله الواو كأنهم شبهوا الاصلى بالزاتد ويجمع
  أيضا على مصاوب وهو الاصل وقوم صباب أى خيار وقال
  من معشر كملت باللؤم أعينهم * قفد الاكف لمام غير صباب
  قال الفرّاه هوف صيابة ومه وصوّاية قومه أى فى صميم قومه والصيابة الخيار من كل شئ
  قال ذوارقة مستنججات بالفراف كانها • مناكيل من صيابة النوب نوح
  والصاب عصارة :جرمرا قال الهذلى
  انى أرقت قبت الليل مستبرا • كأنعيف فيها الصاب مذبوح
  ⁦(صهب)⁩ السهبة الشقرة فى شعر الرأس وهى السهوية والرجل أصهب والصهباوانلهر
  محيت بذلك للونها والاصهب من الابل الذى يخالط بياضه حرة وهوأن يحمرّأ على الوبر
  وفيض أجوافه وجل صهابَ أى أصهب اللون ويقال هو منسوب الى صهاب اسم غل
  أوموضع وقال الامعى يقال للاعداءصهب السبال وسود الاكباد وان لم يكونواصهب
  السبال فكذلك يقال لهم قال ابن قيس الرقيات
  فظلال السيوف شين رأسى ٢ واعتناق ف القوم صهب السبال
  ويقال أصاء ندروم لات الدووية فيهم وهم أعداء العرب وصهعاسم فرس للخر والمصهب
  مضيف الشواء والوحش المختلط ١ .
  صل الضاد) بب اصل الذب الشوق الارض وضب الماء والدم يضب
  بااكسر ضيا أى سال وأضيته أنا وتذن يضب فاقته بالضم أى يحلبها مخمر أصابع
  قال
