summary:
  ar: "قال يحيى: قال مالك في الرجل يُقتل عمدا: إذا قام عصبة المقتول أو مواليه فقالوا: نحن نحلف ونستحق دم صاحبنا، فذلك لهم. قال مالك: فإن أراد النساء أن يعفون عنه فليس ذلك لهن؛ فالعصبة والموالي أولى بذلك منهن، لأنهم هم الذين استحقوا الدم وحلفوا عليه. وإن عفت العصبة أو الموالي بعد أن يستحقوا الدم، وأبى النساء وقلن: لا ندع قاتل صاحبنا، فهن أحق وأولى بذلك؛ لأن من أخذ القود أحق ممن تركه، إذا ثبت الدم ووجب القتل. {cite:muwatta-maruf-1997 p.456}"
