label: { ar: "الموطأ 2582 — مالك: العصبة والموالي أولى بالعفو والقود من النساء", en: "Muwatta 2582", es: "Muwatta 2582", fr: "Muwatta 2582", ur: "موطا 2582", tr: "El-Muvatta 2582 — Malik: Erkek akrabaların ve azat edilmiş kölelerin, kadınlardan daha fazla af ve intikam hakkı vardır.", id: "Al-Muwatta 2582 — Malik: Kerabat laki-laki dan budak yang telah dibebaskan memiliki hak lebih besar untuk mendapatkan pengampunan dan pembalasan daripada perempuan." }
summary:
  ar: "قال يحيى: قال مالك في الرجل يُقتل عمدا: إذا قام عصبة المقتول أو مواليه فقالوا: نحن نحلف ونستحق دم صاحبنا، فذلك لهم. قال مالك: فإن أراد النساء أن يعفون عنه فليس ذلك لهن؛ فالعصبة والموالي أولى بذلك منهن، لأنهم هم الذين استحقوا الدم وحلفوا عليه. وإن عفت العصبة أو الموالي بعد أن يستحقوا الدم، وأبى النساء وقلن: لا ندع قاتل صاحبنا، فهن أحق وأولى بذلك؛ لأن من أخذ القود أحق ممن تركه، إذا ثبت الدم ووجب القتل. {cite:muwatta-maruf-1997 p.456}"
  tr: "Yahya şöyle dedi: Malik, kasten öldürülen bir adam hakkında şöyle dedi: Eğer kurbanın erkek akrabaları veya azat edilmiş köleleri ayağa kalkıp, \"Yemin ederiz ve akrabamızın kanını talep ederiz\" derlerse, bu onların hakkıdır. Malik şöyle dedi: Eğer kadınlar onu affetmek isterlerse, bu onların hakkı değildir; erkek akrabalar ve azat edilmiş kölelerin bunu yapma hakkı onlardan daha büyüktür, çünkü kanı talep eden ve yemin edenler onlardır. Eğer erkek akrabalar veya azat edilmiş köleler kanı talep ettikten sonra onu affederlerse ve kadınlar reddedip, \"Akrabamızın katilinin cezasız kalmasına izin vermeyeceğiz\" derlerse, o zaman onların bunu yapma hakkı ve daha güçlü bir iddiası vardır; çünkü kan parası belirlendikten ve öldürme hakkı doğduktan sonra, kan parasını alan kişinin, almayan kişiden daha büyük bir hakkı vardır. {cite:muwatta-maruf-1997 s.456}"
  id: "Yahya berkata: Malik berkata mengenai seorang pria yang sengaja dibunuh: Jika kerabat laki-laki korban atau budak yang telah dibebaskan berdiri dan berkata, \"Kami bersumpah dan menuntut darah kerabat kami,\" maka itu adalah hak mereka. Malik berkata: Jika para wanita ingin memaafkannya, itu bukan hak mereka; kerabat laki-laki dan budak yang telah dibebaskan memiliki hak yang lebih besar untuk melakukannya daripada mereka, karena merekalah yang telah menuntut darah dan bersumpah untuk itu. Jika kerabat laki-laki atau budak yang telah dibebaskan memaafkannya setelah menuntut darah, dan para wanita menolak dan berkata, \"Kami tidak akan membiarkan pembunuh kerabat kami lolos tanpa hukuman,\" maka mereka memiliki hak yang lebih besar dan klaim yang lebih kuat untuk melakukannya; karena siapa pun yang menerima uang darah memiliki hak yang lebih besar daripada siapa pun yang meninggalkannya, setelah uang darah ditetapkan dan pembunuhan itu terjadi. {cite:muwatta-maruf-1997 p.456}"
