label: { ar: "سنن ابن ماجه 71 — الشهادة والصلاة والزكاة", en: "Sunan Ibn Majah 71 — the testimony, the prayer and the zakat", ur: "سنن ابن ماجہ 71 — شہادت، نماز اور زکوٰۃ", es: "Sunan Ibn Majah 71 – el testimonio, la oración y el zakat", fr: "Sunan Ibn Majah 71 — le témoignage, la prière et la zakat" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ الأَزْهَرِ، حَدَّثَنَا أَبُو النَّضْرِ، حَدَّثَنَا أَبُو جَعْفَرٍ، عَنْ يُونُسَ، عَنِ الْحَسَنِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنِّي رَسُولُ اللَّهِ وَيُقِيمُوا الصَّلاَةَ وَيُؤْتُوا الزَّكَاةَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 71، يذكر الشهادة والصلاة والزكاة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 71 (The Book of the Sunnah), that mentions the testimony, the prayer and the zakat. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 71، جس میں شہادت، نماز اور زکوٰۃ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 71 (El Libro de la Sunnah), menciona el testimonio, la oración y el zakat. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 71 (Le Livre de la Sunna), mentionne le témoignage, la prière et la zakat. Le navigateur « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
