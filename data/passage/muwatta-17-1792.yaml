summary:
  ar: "قال مالك: ومن باع عبدا أو وليدة من أهل الميراث أو غيرهم بالبراءة، فقد برئ من كل عيب، ولا عهدة عليه، إلا أن يكون علم عيبا فكتمه، فإن كان علم عيبا فكتمه لم تنفعه البراءة، وكان ذلك البيع مردودا، ولا عهدة عندنا إلا في الرقيق. {cite:muwatta-maruf-1997 p.134}"
