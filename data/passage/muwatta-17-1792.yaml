label: { ar: "الموطأ 1792 — مالك: من باع عبدا أو وليدة بالبراءة فقد برئ من كل عيب، ولا عهدة عليه إلا أن يكون علم عيبا فكتمه، ولا عهدة عند مالك إلا في الرقيق", en: "Muwatta 1792", es: "Muwatta 1792", fr: "Muwatta 1792", ur: "موطا 1792", tr: "El-Muvatta 1792 — Malik: Kim bir köleyi veya bir kadın köleyi sorumluluktan muafiyet belgesiyle satarsa, tüm kusurlardan kurtulmuş olur ve bir kusuru bilip gizlemediği sürece ona karşı hiçbir sorumluluk yoktur. Malik'e göre sorumluluk, köleler hariç hiçbir durumda söz konusu değildir.", id: "Al-Muwatta 1792 — Malik: Barang siapa menjual seorang budak laki-laki atau budak perempuan dengan pembebasan dari tanggung jawab, maka ia terbebas dari segala kekurangan, dan tidak ada tanggung jawab atas dirinya kecuali jika ia mengetahui adanya kekurangan tersebut dan menyembunyikannya. Dan menurut Malik, tidak ada tanggung jawab kecuali dalam kasus budak." }
summary:
  ar: "قال مالك: ومن باع عبدا أو وليدة من أهل الميراث أو غيرهم بالبراءة، فقد برئ من كل عيب، ولا عهدة عليه، إلا أن يكون علم عيبا فكتمه، فإن كان علم عيبا فكتمه لم تنفعه البراءة، وكان ذلك البيع مردودا، ولا عهدة عندنا إلا في الرقيق. {cite:muwatta-maruf-1997 p.134}"
  tr: "Malik şöyle dedi: Mirasçı olsun ya da olmasın, erkek veya kadın bir köleyi sorumluluktan feragat beyanıyla satan kimse, kusurlardan muaftır ve hiçbir sorumluluk taşımaz, ancak bir kusuru bilip gizlemişse durum farklıdır. Eğer bir kusuru bilip gizlemişse, sorumluluktan feragat beyanı onun için hiçbir fayda sağlamaz ve bu satış geçersizdir. Köleler dışında hiçbir sorumluluğumuz yoktur. {cite:muwatta-maruf-1997 s.134}"
  id: "Malik berkata: Barang siapa menjual budak laki-laki atau perempuan, baik ahli waris maupun bukan, dengan klausul pelepasan tanggung jawab, maka ia dibebaskan dari segala kekurangan dan tidak bertanggung jawab, kecuali jika ia mengetahui adanya kekurangan dan menyembunyikannya. Jika ia mengetahui adanya kekurangan dan menyembunyikannya, maka klausul pelepasan tanggung jawab tersebut tidak bermanfaat baginya, dan penjualan itu batal. Kami tidak bertanggung jawab kecuali dalam kasus budak. {cite:muwatta-maruf-1997 p.134}"
