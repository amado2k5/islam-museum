text: "… كصفوف الملائكة، وجعلت لنا الأرض كلها مسجدا، وجعلت تربتها لنا طُهورا إذا لم نجد الماء وراجع أيضا : • كشف الغمة. لأنه فتح باب المودة وتأليف للقلوب مؤد لكمال الإيمان وفى مسلم عن أبى هريرة مرفوعا : لا تدخلوا الجنة …"
