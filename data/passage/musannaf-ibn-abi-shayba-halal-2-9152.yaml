text: "حرف الباء طرف الحديث أو الأثر البائن ثلاث لا تحل له حتى البأساء: البؤس، والضراء تفسير البأساء.... البائس أراد أن يسرق فأعجلتموه البادئ بالسلام يربي على صاحبه في الأجر البادي الذي يجيء من الحجّ البحر طهور ماؤه الحلال ميتته البدن …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 9152، يذكر الحلال، وما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 9152, that mentions the lawful, what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 9152 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 9152, que menciona lo lícito, lo que se hizo lícito y lo que no lo es; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
