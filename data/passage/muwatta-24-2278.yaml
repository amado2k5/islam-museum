label: { ar: "الموطأ 2278 — عبد الله بن أبي بكر بن حزم: قضاء أبان في ولاء موالي امرأة من جهينة", en: "Muwatta 2278", es: "Muwatta 2278", fr: "Muwatta 2278", ur: "موطا 2278", tr: "Al-Muwatta 2278 - Abdullah ibn Ebu Bekir ibn Hazm: Cüheyneli bir kadının azatlı kölelerinin biatına ilişkin Aban'ın hükmü", id: "Al-Muwatta 2278 — Abdullah ibn Abi Bakar ibn Hazm: Keputusan Aban tentang kesetiaan budak yang dibebaskan seorang wanita dari Juhayna" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه أنه كان عند أبان بن عثمان، فاختصم إليه قوم من جهينة وقوم من بني الحارث بن الخزرج في ولاء موالي امرأة من جهينة توفيت عن مال وموال، ورثها ابنها وزوجها، ثم مات ابنها. فقضى أبان بولاء الموالي لجهينة. {cite:muwatta-maruf-1997 p.339} {cite:muwatta-maruf-1997 p.340}"
  tr: "Malik, Abdullah ibn Abi Bakr ibn Hazm'dan, o da babasından rivayet ettiğine göre, Aban ibn Uthman ile birlikteyken, Cuhayna'dan bir grup ve Beni el-Harith ibn el-Khazraj'dan bir grup, geride mal ve azatlı köleler bırakarak ölen bir Cuhayna kadının azatlı kölelerinin biati konusunda onun huzurunda ihtilafa düştüklerini anlatır. Kadının oğlu ve kocası ondan miras almış, daha sonra oğlu ölmüştür. Aban, azatlı kölelerin biatının Cuhayna'ya ait olduğuna hükmetmiştir. {cite:muwatta-maruf-1997 s.339} {cite:muwatta-maruf-1997 s.340}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Hazm, dari ayahnya, bahwa ia bersama Aban ibn Uthman ketika sekelompok orang dari Juhayna dan sekelompok orang dari Banu al-Harith ibn al-Khazraj berdebat di hadapannya mengenai baiat para budak yang dibebaskan dari seorang wanita Juhayna yang meninggal dunia dan meninggalkan harta benda serta budak yang dibebaskan. Putra dan suaminya mewarisi hartanya, dan kemudian putranya meninggal dunia. Aban memutuskan bahwa baiat para budak yang dibebaskan itu menjadi milik Juhayna. {cite:muwatta-maruf-1997 p.339} {cite:muwatta-maruf-1997 p.340}"
