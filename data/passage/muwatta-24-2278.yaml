label: { ar: "الموطأ 2278 — عبد الله بن أبي بكر بن حزم: قضاء أبان في ولاء موالي امرأة من جهينة", en: "Muwatta 2278" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه أنه كان عند أبان بن عثمان، فاختصم إليه قوم من جهينة وقوم من بني الحارث بن الخزرج في ولاء موالي امرأة من جهينة توفيت عن مال وموال، ورثها ابنها وزوجها، ثم مات ابنها. فقضى أبان بولاء الموالي لجهينة. {cite:muwatta-maruf-1997 p.339} {cite:muwatta-maruf-1997 p.340}"
