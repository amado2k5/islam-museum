label: { ar: "صحيح مسلم 5631 — النسب والانتساب", en: "Sahih Muslim 5631 — paternity and lineage", ur: "صحیح مسلم 5631 — نسب اور انتساب", es: "Sahih Muslim 5631 — paternidad y linaje" }
text: "… لَهُ. فَدُعِيَ لَهُ فَقَالَ مَا حَمَلَكَ عَلَى مَا صَنَعْتَ قَالَ إِنَّا كُنَّا نُؤْمَرُ بِهَذَا. قَالَ لَتُقِيمَنَّ عَلَى هَذَا بَيِّنَةً أَوْ لأَفْعَلَنَّ. فَخَرَجَ فَانْطَلَقَ إِلَى مَجْلِسٍ مِنَ الأَنْصَارِ فَقَالُوا لاَ يَشْهَدُ لَكَ عَلَى هَذَا إِلاَّ أَصْغَرُنَا. فَقَامَ أَبُو سَعِيدٍ فَقَالَ كُنَّا نُؤْمَرُ بِهَذَا. فَقَالَ عُمَرُ خَفِيَ عَلَىَّ هَذَا مِنْ أَمْرِ رَسُولِ اللَّهِ أَلْهَانِي عَنْهُ الصَّفْقُ بِالأَسْوَاقِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5631، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5631 (The Book of Manners and Etiquette), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5631، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 5631 (El Libro de las Buenas Maneras y la Etiqueta), menciona la paternidad y el linaje. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
