label: { ar: "صحيح البخاري 4892 — بكاء على ميت أو نياحة وحدودها", en: "Sahih al-Bukhari 4892 — weeping over the dead, or wailing and its limits", ur: "صحیح البخاری 4892 — میت پر رونا، یا نوحہ اور اس کی حدود", fr: "Sahih al-Bukhari 4892 — des pleurs sur un défunt, ou la lamentation et ses limites", es: "Sahih al-Bukhari 4892 — llanto por un difunto, o el lamento y sus límites" }
text: "حَدَّثَنَا أَبُو مَعْمَرٍ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا أَيُّوبُ، عَنْ حَفْصَةَ بِنْتِ سِيرِينَ، عَنْ أُمِّ عَطِيَّةَا ـ قَالَتْ بَايَعْنَا رَسُولَ اللَّهِ فَقَرَأَ عَلَيْنَا {أَنْ لاَ يُشْرِكْنَ بِاللَّهِ شَيْئًا} وَنَهَانَا عَنِ النِّيَاحَةِ، فَقَبَضَتِ امْرَأَةٌ يَدَهَا فَقَالَتْ أَسْعَدَتْنِي فُلاَنَةُ أُرِيدُ أَنْ أَجْزِيَهَا. فَمَا قَالَ لَهَا النَّبِيُّ شَيْئًا فَانْطَلَقَتْ وَرَجَعَتْ فَبَايَعَهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 4892، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4892 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح البخاری کی حدیث نمبر 4892، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih al-Bukhari, n° 4892, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih al-Bukhari, n.º 4892, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
