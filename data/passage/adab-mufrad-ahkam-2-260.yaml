text: "… نُعيم قال : حدثنا سفيان، عن منصور، عن الشعبيّ، عن المقدام أبى كريمة السامى قال : قال النى متفات ليلةُ الضيف حقّ واجب على كل مسلم. فمن أصبح بفِناته فهو دَين عليه، فان شاء اقتضاه، وإن شاء تركد، أبو داود …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 260، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 2, p. 260, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 2، ص 260 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Adab al-Mufrad de al-Bukhari, volume numérisé 2, p. 260, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Adab al-Mufrad de al-Bukhari, volumen digitalizado 2, p. 260, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), un derecho debido por cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
