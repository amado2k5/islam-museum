text: "… نصر التمار، ثنا حماد بن سَلَمَة، عَن يُوْنُس بن عبيد وحميد وذكر الصوفي آخر معهما، عَن أَنَس بن مالك: أن رَسُول اللَّه لَ في قَلَ : المُؤْمِنُ مَنْ أمِنَهُ الناس، والمُسْلِمُ مَنْ سِلَمَ المُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، والمُهَاجِرُ مَنْ هَاجَرَ …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 253، يذكر وصف المؤمن، ووصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 253, that mentions a description of the believer, a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 253 کا اقتباس جس میں مومن کا وصف، مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 253, que menciona una descripción del creyente y del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait du Sahih Ibn Hibban, volume 3, page 253, qui décrit le croyant et le musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban, 3. cilt, 253. sayfadan, mümin ve Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid 3, halaman 253, yang menjelaskan tentang orang beriman dan seorang Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
