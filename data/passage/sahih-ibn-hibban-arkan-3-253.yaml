text: "… نصر التمار، ثنا حماد بن سَلَمَة، عَن يُوْنُس بن عبيد وحميد وذكر الصوفي آخر معهما، عَن أَنَس بن مالك: أن رَسُول اللَّه لَ في قَلَ : المُؤْمِنُ مَنْ أمِنَهُ الناس، والمُسْلِمُ مَنْ سِلَمَ المُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ، والمُهَاجِرُ مَنْ هَاجَرَ …"
summary:
