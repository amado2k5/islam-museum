text: "… تفسيره للآية من سورة الأحزاب. قوله:... وهذا أمر بعد الحظر، والصحيح الذي يثبت على السَّبْر: أنه يَرُدُّ الحكم إلىٰ ما كان عليه قبل النهي، فإن كان واجبًا رده واجبًا، وإن كان مستحبّا فمستحب، أو مباحًا فمباح، وذلك عند تفسير قوله …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 33، يرد فيه ذكر الواجب، والمستحب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 33, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 33 کا اقتباس جس میں واجب، مستحب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tafsir de Ibn Kathir, volume numérisé 1, p. 33, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tafsir de Ibn Kathir, volumen digitalizado 1, p. 33, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 33. sayfasından, farz, müstehap ve caiz olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehap ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari Tafsir Ibnu Katsir, Jilid 1, halaman 33, yang menyebutkan amalan wajib, anjuran, dan halal; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
