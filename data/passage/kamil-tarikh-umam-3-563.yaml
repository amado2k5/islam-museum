text: "… الحارث بن علقمة بن كلدة بن عبد مناف بن عبد الدار، يكنى أبا قائد، وكان أشد قريش في تكذيب النبي عَبّة، والأذى له ولأصحابه. وكان ينظر في كتب الفرس ويخالط اليهود والنصارى، وسمع بذكر رسول اللّٰه عرية، وقرب مبعثه، فقال: …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 563، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 3, p. 563, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 3، ص 563 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
