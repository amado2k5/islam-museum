text: "… لى لا أرى عليكم يا أهل المدينة حلاوة الإيمان، والذى نفسى بيده لو أن دبَّ الغابة طَعِمَ الإيمان لَرْثى عليه حلاوة الإيمان، قال محمد بن مسلم وبلغني عن أبى الدرداء أنه قال : ما أَمِنَ أحد على إيمانه إلا صليه. …"
summary:
