text: "… والابتداء، وعلم مرسوم الخط، ومعرفة فضائله، ومعرفة خواصه، هل فى القرآن شىء أفضل من شىء، فى آداب تلاوته، فى أنه هل يجوز فى التصانيف والرسائل والخطب استعمال بعض آيات القرآن. معرفة الأمثال الكائنة فيه، ومعرفة أحكامه، ومعرفة جدله، ومعرفة ناسخا …"
