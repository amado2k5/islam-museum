text: "وإنما أدخل ذكر بدر اعتراضاً في أثنائها، فإنه سبحانه الأنصار على باب العريش، يحمون رسولَ اللَّه ل. قرأ ابن كثير وأبو عمرو، وعاصم، وابن عامر، وحمزة، والكسائي مردِفين بكسر الدال، وقرأ نافع وأبو بكر عن له، وتضرَّعُوا إليهِ، فَأَوْحَى اللَّهُ …"
