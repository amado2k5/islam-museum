label: { ar: "سنن أبي داود 4144 — الأب والأبوة", en: "Sunan Abi Dawud 4144 — the father and fatherhood", ur: "سنن ابی داؤد 4144 — باپ اور والدیت" }
text: "حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ، عَنْ وَكِيعٍ، عَنْ إِسْحَاقَ بْنِ سَعِيدِ بْنِ عَمْرٍو الْقُرَشِيِّ، عَنْ أَبِيهِ، عَنِ ابْنِ عُمَرَ، أَنَّهُ رَأَى رُفْقَةً مِنْ أَهْلِ الْيَمَنِ رِحَالُهُمُ الأَدَمُ فَقَالَ مَنْ أَحَبَّ أَنْ يَنْظُرَ إِلَى أَشْبَهِ رُفْقَةٍ كَانُوا بِأَصْحَابِ النَّبِيِّ فَلْيَنْظُرْ إِلَى هَؤُلاَءِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4144، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4144 (Clothing (Kitab Al-Libas)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4144، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
