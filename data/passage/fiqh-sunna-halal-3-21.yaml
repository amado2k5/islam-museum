text: "… لوجوب بذل طعامه للمضطر. وإن قتله الآخر فعليه القصاص. وقال ابن حزم : من اضطر إلى شيء من الحرمات ولم يجد مال مسلم ولا ذمي فله أن يأكل حتى يشبع ويتزود حتى يحد حلالاً فإذا وجده عاد ذلك الحرم حرامًا …"
