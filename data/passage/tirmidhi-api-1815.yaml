label: { ar: "جامع الترمذي 1815 — الأب والأبوة", en: "Jami' al-Tirmidhi 1815 — the father and fatherhood", ur: "جامع ترمذی 1815 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1815 — El padre y la paternidad" }
text: "… اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ، قَالاَ حَدَّثَنَا يَحْيَى بْنُ حَسَّانَ، حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ قَالَ \" بَيْتٌ لاَ تَمْرَ فِيهِ جِيَاعٌ أَهْلُهُ \". قَالَ وَفِي الْبَابِ عَنْ سَلْمَى امْرَأَةِ أَبِي رَافِعٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لاَ نَعْرِفُهُ مِنْ حَدِيثِ هِشَامِ بْنِ عُرْوَةَ إِلاَّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1815، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1815 (The Book on Food), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1815، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1815 (El Libro de la Alimentación), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
