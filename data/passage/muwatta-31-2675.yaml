label: { ar: "الموطأ 2675 — سهيل بن أبي صالح عن أبيه: الضيف الكافر يشرب حلاب سبع شياه ثم يسلم", en: "Muwatta 2675" }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله ضافه ضيف كافر، فأمر له بشاة فحُلبت فشرب حلابها، ثم أخرى فشرب، ثم أخرى فشرب، حتى شرب حلاب سبع شياه. ثم أصبح فأسلم، فأمر له بشاة فحُلبت فشرب حلابها، ثم أمر له بأخرى فلم يستتمها، فقال رسول الله: المؤمن يشرب في معى واحد، والكافر يشرب في سبعة أمعاء. {cite:muwatta-maruf-1997 p.512}"
