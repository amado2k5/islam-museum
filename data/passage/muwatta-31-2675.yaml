label: { ar: "الموطأ 2675 — سهيل بن أبي صالح عن أبيه: الضيف الكافر يشرب حلاب سبع شياه ثم يسلم", en: "Muwatta 2675", es: "Muwatta 2675", fr: "Muwatta 2675", ur: "موطا 2675", tr: "El-Muvatta 2675 — Suhayl ibn Abi Salih, babasından rivayetle: Gayrimüslim bir misafir yedi koyunun sütünü içtikten sonra İslam'ı kabul eder.", id: "Al-Muwatta 2675 — Suhayl ibn Abi Salih, berdasarkan riwayat ayahnya: Seorang tamu non-Muslim meminum susu tujuh ekor domba dan kemudian memeluk Islam" }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله ضافه ضيف كافر، فأمر له بشاة فحُلبت فشرب حلابها، ثم أخرى فشرب، ثم أخرى فشرب، حتى شرب حلاب سبع شياه. ثم أصبح فأسلم، فأمر له بشاة فحُلبت فشرب حلابها، ثم أمر له بأخرى فلم يستتمها، فقال رسول الله: المؤمن يشرب في معى واحد، والكافر يشرب في سبعة أمعاء. {cite:muwatta-maruf-1997 p.512}"
  id: "Malik meriwayatkan dari Suhayl ibn Abi Salih, dari ayahnya, dari Abu Hurayrah, bahwa Rasulullah shalla Allahu alaihi wa sallam pernah kedatangan seorang tamu kafir. Beliau memerintahkan agar seekor domba diperah susunya untuk tamu tersebut, dan beliau meminum susunya. Kemudian seekor domba lain diperah susunya untuk tamu tersebut, dan beliau meminumnya, dan seterusnya, hingga beliau meminum susu dari tujuh ekor domba. Kemudian keesokan paginya tamu tersebut memeluk Islam, lalu beliau memerintahkan agar seekor domba diperah susunya untuk tamu tersebut, dan beliau meminum susunya. Kemudian beliau memerintahkan seekor domba lagi untuk tamu tersebut, tetapi beliau tidak menghabiskannya. Rasulullah shalla Allahu alaihi wa sallam bersabda: “Orang beriman minum dengan satu perut, sedangkan orang kafir minum dengan tujuh perut.” {cite:muwatta-maruf-1997 p.512}"
