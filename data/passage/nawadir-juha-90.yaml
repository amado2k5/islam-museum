label: { ar: "نوادر جحا الكبرى، ص 46 — «اختبأت خجلاً منك»", en: "Nawadir Juha al-Kubra, p. 46 — 'I Hid in Shame Before You'", ur: "نوادر جحا الکبریٰ، ص 46 — «میں تم سے شرم کے مارے چھپ گیا»", fr: "Nawadir Juha al-Kubra, p. 46 — « Je me suis caché de honte devant toi »", es: "Nawadir Juha al-Kubra, p. 46 — «Me escondí de vergüenza ante ti»", tr: "Juha'nın Büyük Fıkraları, s. 46 — “Senden utandığım için saklandım”", id: "Anekdot Hebat Juha, hlm. 46 — “Aku bersembunyi karena malu darimu”" }
text: "… اختبأْتُ خَجَلاً منك شعر جحا بوجودِ لِصِّ في دارِه ليلاً، فقام إلى خزانة الفراش، واختبأَ بها، وبحث اللصُّ عن شيءٍ يسرقُهُ فلم يجِذْ، فرأى الخزانة فقال: لعلَّ فيها شيئاً، ففتحّها وإذا بالشيخ فيها، فاختلج اللص ولكنَّه تشجَّع وقال: ماذا تفعلُ …"
summary:
  ar: "اختبأ جحا في صندوق الفراش حين دخل لص، ففتحه اللص ووجده، فقال جحا إنه عرف أن اللص لن يجد شيئًا فاختبأ خجلًا. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  en: "Juha hides in the bedding chest when a thief enters; the thief opens it and finds him; Juha says he knew the thief would find nothing and so hid in shame. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  ur: "جب ایک چور گھر میں گھسا تو جحا بستروں کے صندوق میں چھپ گیا؛ چور نے اسے کھولا اور جحا کو پا لیا؛ جحا نے کہا کہ مجھے معلوم تھا کہ چور کو کچھ نہیں ملے گا، اس لیے میں شرم کے مارے چھپ گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  fr: "Juha se cache dans le coffre à literie quand un voleur entre ; le voleur l'ouvre et le trouve ; Juha dit qu'il savait que le voleur ne trouverait rien et qu'il s'est donc caché de honte. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  es: "Juha se esconde en el arcón de la ropa de cama cuando entra un ladrón; el ladrón lo abre y lo encuentra; Juha dice que sabía que el ladrón no hallaría nada y por eso se escondió de vergüenza. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  tr: "Hırsız içeri girdiğinde Juha şilte sandığına saklandı. Hırsız sandığı açtı ve onu buldu. Juha, hırsızın hiçbir şey bulamayacağını bildiği için utançtan saklandığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 46}"
  id: "Juha bersembunyi di dalam peti kasur ketika seorang pencuri masuk. Pencuri itu membukanya dan menemukannya. Juha berkata bahwa dia tahu pencuri itu tidak akan menemukan apa pun, jadi dia bersembunyi karena malu. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
