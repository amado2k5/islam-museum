label: { ar: "سنن ابن ماجه 499 — الأب والأبوة", en: "Sunan Ibn Majah 499 — the father and fatherhood", ur: "سنن ابن ماجہ 499 — باپ اور والدیت", es: "Sunan Ibn Majah 499 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ، عَنْ مُوسَى بْنِ يَعْقُوبَ، حَدَّثَنِي أَبُو عُبَيْدَةَ بْنُ عَبْدِ اللَّهِ بْنِ زَمْعَةَ، عَنْ أَبِيهِ، عَنْ أُمِّ سَلَمَةَ، زَوْجِ النَّبِيِّ ـ قَالَتْ قَالَ رَسُولُ اللَّهِ ـ \" إِذَا شَرِبْتُمُ اللَّبَنَ فَمَضْمِضُوا فَإِنَّ لَهُ دَسَمًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 499، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 499 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 499، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 499 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
