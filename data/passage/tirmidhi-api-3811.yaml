text: "… الْخَيْرَ وَأَطْلُبُهُ. قَالَ أَلَيْسَ فِيكُمْ سَعْدُ بْنُ مَالِكٍ مُجَابُ الدَّعْوَةِ وَابْنُ مَسْعُودٍ صَاحِبُ طَهُورِ رَسُولِ اللَّهِ وَنَعْلَيْهِ وَحُذَيْفَةُ صَاحِبُ سِرِّ رَسُولِ اللَّهِ وَعَمَّارُ الَّذِي أَجَارَهُ اللَّهُ مِنَ الشَّيْطَانِ عَلَى لِسَانِ نَبِيِّهِ وَسَلْمَانُ صَاحِبُ الْكِتَابَيْنِ. قَالَ قَتَادَةُ وَالْكِتَابَانِ الإِنْجِيلُ وَالْقُرْآنُ. هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ. وَخَيْثَمَةُ هُوَ ابْنُ عَبْدِ الرَّحْمَنِ بْنِ أَبِي سَبْرَةَ نُسِبَ إِلَى جَدِّهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3811، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3811 (Chapters on Virtues), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3811، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
