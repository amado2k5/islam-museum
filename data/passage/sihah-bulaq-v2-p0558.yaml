text: |-
  * (فصل الزاى
  *⁦(زهف)⁩*
  ٢٩
  والصبىّ يزحن على الارض قب-ل أن يمشى والبعيراذا أعيا فجرّرسنه يقال هو يزحف
  وهى ابل زواحف الواحدة زاحفة قال الفرزدق
  مستقبلين شمال الشام تضرينا * بجاصب كنديف القطن منفور
  سلى عمائنا تلق وأرحلنا • عسلى زواحف تزجها محاس
  وكذلك أزحف البعير فهو مزخ واذا كان دلك عادته فهو مزحاف قال أبوز سد الطائىَ
  كأنّ أوب مساحى القوم فوقهم • طير تعيف على جون هزاحيف
  وأزحف الرجل اذا أعيا بعيره أودابته ومزاحف الحياتمواضع مدبها قال الهذلىّ
  كانّ مزاحف الحيات فيها • قبيل الصبح آنار السياط
  وتزحف اليسه أى تمشى والزحوف من النوق التى تجترر جليها اذا مشت ونار الزحفتين
  نار الشيح والألاء لانه يسرع الاشتعال فيهما فيزحف عنهما وقيل لامرأة من العرب مالنا
  نراكنّ رسها ذقالت أرسحتنانا ر الزحفتين ( حلف قال الاصبعى" الزحلوفة آثار
  تزيج الصبيان من فوق التلّ الى أسفله وهى لغة أهل العالية وغيم تقوله بالقاف والمع زحالف
  وزحاليف وقال ابن الاعرابى الزحلوفة مكان متحدر مماس لانهم يستزحلفون فيه
  وأنشدلاوس
  يقلب قيدود اكأن سراتها • صفامدهن قد زلته الزحالف
  والمدهن نقرة فى الجبل بستنقع فيها الماء وقال آخر • ثادوأوشال حتها الزحالف* قال
  والزحلفة كالد حرجة والدفع يقال زحلفته فتزحلف قال العجاج.
  والشمس قد كادت تكون دنفا • أدفعها باراح كى تزحلفا
  ( زخرف. الزخرف الذهب ثم يشبه به كل عموّه من ود والمزخرف المزين وزخارف الما.
  طراققه .⁦( زرف)⁩ أزرف فى المشى أى أسرع وناقة زروف ومزراف أى مريعة وقد
  زرفت وأزرفتها أنا أى -شنتها ومنه قول الراجز• يزرفها الاغراه أى زرف» وزرف الجوح
  بالكسر يزرف زرفا أى غفروانتض بعد البره والزرافة بالفتح الهاعة من الناس وكان
  القذانى" يقوله بتشد يد الفاء والزرافات الجهاعات والزرافة والزرافة بفتح الزاى وضمها مخففة
  الفاهدابة يقال له بالفارسية اشتر كاويلنك ⁦(زعف)⁩ زعفه زعفا أى قتله مكانه وكذلك
  أزعفه اذاقتل قتسلاسريعا وسم زعاف وموت زعاف وذواف أيضا بالهمزمن-ل زعاف
  والزعنفة بالكسر القصير وأصل الزعائف أطراف الاديم وأكارعه قال أوس بن جر
  فازال يقرى البيدحتى كاغا • قوائمه فى جانبه الزعائف
  أى كانها معلقة لاتمس الارض من سرعته ( ز غف زغفة تسكن وتحرل وهى الدرع
  اللينة وقال الشيبانى هى الواسعة والجمع زغف وزغف قال الاصمحى يقال رغف فى حديثه
  أى زاد ورجل مزغف نهم رغيب قف) الزف بالكسر صغارريش النعام والطائر
  يقال هيق أزف بين الزقف أى ذوزف ملتّف وزقفت العروس الى زوجها أزف بالضم
  زفا وزفافا وأزففتها وازدففتها بعنى والمزفسة المحفة التى تزف فيها العروس حكى ذلك عن
  انحليل والزفيف السريع مثل الذفيف يقال زف الظليم والبعير يزف بالتكسرزفيضا أى
