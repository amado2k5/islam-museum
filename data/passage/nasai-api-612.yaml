label: { ar: "سنن النسائي 612 — الأب والأبوة", en: "Sunan al-Nasa'i 612 — the father and fatherhood", ur: "سنن نسائی 612 — باپ اور والدیت" }
text: "… حَكِيمٍ، وَعَمْرُو بْنُ يَزِيدَ، قَالاَ حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ إِبْرَاهِيمَ بْنِ مُحَمَّدِ بْنِ الْمُنْتَشِرِ، عَنْ أَبِيهِ، أَنَّهُ كَانَ فِي مَسْجِدِ عَمْرِو بْنِ شُرَحْبِيلَ فَأُقِيمَتِ الصَّلاَةُ فَجَعَلُوا يَنْتَظِرُونَهُ فَقَالَ إِنِّي كُنْتُ أُوتِرُ. قَالَ وَسُئِلَ عَبْدُ اللَّهِ هَلْ بَعْدَ الأَذَانِ وِتْرٌ قَالَ نَعَمْ وَبَعْدَ الإِقَامَةِ وَحَدَّثَ عَنِ النَّبِيِّ أَنَّهُ نَامَ عَنِ الصَّلاَةِ حَتَّى طَلَعَتِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 612، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 612 (The Book of the Times (of Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 612، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
