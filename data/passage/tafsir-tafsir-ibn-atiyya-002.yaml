text: "صة أبونا عليه السلام، اصطفاه الله تعالى بعضهم. بالإيجاد والرسالة إلى بنيه والنبوة (وآل عمران) أيضا يحتمل من والتكليم، حسبما ورد في الحديث، التأويل ما تقدم في (آل إبراهيم) ؛ وحكى الزجاج عن قوم أن الله وعمران هو رجل من"
