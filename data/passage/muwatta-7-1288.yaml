label: { ar: "الموطأ 1288 — زيد بن أسلم: كتب أبو عبيدة إلى عمر يذكر جموع الروم، فكتب إليه عمر أن العسر لن يغلب يسرين", en: "Muwatta 1288" }
text: "إنَّهُ لَنْ يَغْلبَ عُسْرٌ يُسْرَيْنِ"
summary:
  ar: "يروي مالك عن زيد بن أسلم أن أبا عبيدة بن الجراح كتب إلى عمر بن الخطاب يذكر له جموعا من الروم وما يتخوف منهم، فكتب إليه عمر أنه مهما ينزل بعبد مؤمن من منزل شدة يجعل الله بعدها فرجا، وأنه لن يغلب عسر يسرين، واستشهد بآية في سورة آل عمران على الصبر والمصابرة والرباط والتقوى. {cite:muwatta-maruf-1997 p.574}"
