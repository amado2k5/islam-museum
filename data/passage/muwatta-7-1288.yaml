label: { ar: "الموطأ 1288 — زيد بن أسلم: كتب أبو عبيدة إلى عمر يذكر جموع الروم، فكتب إليه عمر أن العسر لن يغلب يسرين", en: "Muwatta 1288", es: "Muwatta 1288", fr: "Muwatta 1288", ur: "موطا 1288", tr: "El-Muvatta 1288 — Zeyd ibn Aslam: Ebu Ubeyde, Ömer'e Roma ordularından bahseden bir mektup yazdı; Ömer de ona, zorluğun iki kolaylığın üstesinden gelemeyeceğini yazdı.", id: "Al-Muwatta 1288 — Zayd ibn Aslam: Abu Ubaydah menulis surat kepada Umar yang menyebutkan pasukan Romawi, lalu Umar membalas suratnya bahwa kesulitan tidak akan mampu mengatasi dua kemudahan." }
text: "إنَّهُ لَنْ يَغْلبَ عُسْرٌ يُسْرَيْنِ"
summary:
  ar: "يروي مالك عن زيد بن أسلم أن أبا عبيدة بن الجراح كتب إلى عمر بن الخطاب يذكر له جموعا من الروم وما يتخوف منهم، فكتب إليه عمر أنه مهما ينزل بعبد مؤمن من منزل شدة يجعل الله بعدها فرجا، وأنه لن يغلب عسر يسرين، واستشهد بآية في سورة آل عمران على الصبر والمصابرة والرباط والتقوى. {cite:muwatta-maruf-1997 p.574}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Ebu Ubeyde ibn el-Cerrah'ın Ömer ibn el-Hattab'a yazdığı mektupta, büyük Roma ordusundan ve onlardan duyduğu korkudan bahsettiğini aktarır. Ömer ona cevaben, mümin bir kulun başına gelen her zorluğun ardından Allah'ın ona kolaylık vereceğini ve bir zorluğun iki kolaylığın üstüne çıkamayacağını yazmıştır. Sabır, azim, sebat ve takva ile ilgili olarak Al-İmran Suresi'nden bir ayet zikretmiştir. {cite:muwatta-maruf-1997 s.574}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa Abu Ubaydah ibn al-Jarrah menulis surat kepada Umar ibn al-Khattab, menyebutkan besarnya pasukan Romawi dan kekhawatirannya terhadap mereka. Umar membalas suratnya, mengatakan bahwa kesulitan apa pun yang menimpa seorang hamba yang beriman, Allah akan memberikan kelegaan setelahnya, dan bahwa satu kesulitan tidak akan pernah mengalahkan dua kemudahan. Ia mengutip sebuah ayat dari Surah Al Imran tentang kesabaran, ketekunan, keteguhan hati, dan ketakwaan. {cite:muwatta-maruf-1997 p.574}"
