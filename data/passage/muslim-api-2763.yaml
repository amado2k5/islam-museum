label: { ar: "صحيح مسلم 2763 — الأب والأبوة", en: "Sahih Muslim 2763 — the father and fatherhood", ur: "صحیح مسلم 2763 — باپ اور والدیت", es: "Sahih Muslim 2763 — El padre y la paternidad" }
text: "وَحَدَّثَنِي عَمْرٌو النَّاقِدُ، وَزُهَيْرُ بْنُ حَرْبٍ، قَالَ زُهَيْرٌ حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، - - قَالَ رَأَى رَجُلٌ أَنَّ لَيْلَةَ الْقَدْرِ لَيْلَةُ سَبْعٍ وَعِشْرِينَ. فَقَالَ النَّبِيُّ \" أَرَى رُؤْيَاكُمْ فِي الْعَشْرِ الأَوَاخِرِ فَاطْلُبُوهَا فِي الْوِتْرِ مِنْهَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2763، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2763 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2763، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2763 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
