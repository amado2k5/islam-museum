text: |-
  ⁦(فصل التام)⁩
  ٢٩١
  ⁦(تجر)⁩ تجر يتجر تجرا وتجارة وكذلك اتجر يتجروهوافتعل فهو تاجر والجمع تجرمفال
  صاحب وصحب وتجار وتجاروالعرب تسمى بائع الهرتاجرا قال الاسود بن يعفر
  والقد أروح على التجار مرجلا • مذلاب إلى لينا أجيادى
  أى ماثلاعنقى من السكر ويقال ناقة تاجرة للنافقة وأخرى كاسدة وحكى أبو عبيدة ناقة تاجر
  أى نافنتة فى التجارة والسوق وأرض متجرة يتجرفيها ⁦(ترد)⁩. ترّت الذواة من مرضاحها
  نتر وقترّ أى ندرت وضرب يده بالس-ف فأترها أى قطعها وأندرها والغلام بترّ القلد بالمقلا.
  وترّفلان عن بلده ساعد وأترّهالقضاء أبعده والتر بالضم خط يمد على البناء يقول الرجل
  اصاحبه عند الغضب لا قيمتك على الترّ والترارة السمن والبضاضة تقول منه تررت بالكسر
  أى صرت تارًا وهو الممتلئ وقال الشاءر
  ونصبح بالغداة أزتشئ • وغسى بالعشطلنفهينا
  والترترة التحريك وفى الحديث ترتروه ومزمزوه والتراتر الا. ورالعظام وقول زيد الفوارس
  ألم تعلى انى اذا الدهرمسنى • بنائبة زات ولم أتترتز »
  ى لم أتززل ولم أتقلقل والاترور غلام الشرطى لا يلدس السواد قالت الدهنا امرأة العجاح
  والله ولا خشية الاسيع • وخنية الشرطى والازور
  لحلت بالشيخ من البقير • كمبولان صعبة عسير
  الفاء الذقرة التى فى وسط الشفه العليا ⁦(تمر)⁩ التمراسم جنسر الواحدة منهاترة وبجعها
  ترات باتهريك وجمع التمرة ور وتران بالضم ويرادبه الانواع لانّ الجنس لا يجمع فى الحقيقة
  والتامر الذى عنده التمر يقال رجل تاهر ولا بن أى ذوتمر ولين وقد يكون من قولك تمرتهم.
  فأنا تامر أى أطعمتهم القر والتمار الذى يبيعه والتمرى الذى يحبه والمتمر الكثير التمريقسال أغمر
  الرجل اذا كثرعنده التمر والمتمور المزوّد تمراوالتامورة الصومعة وقوله-م فلان أسد
  فى تامورته أى فى عر بنه والتامورة غلاف القلب والتامورة الابريق قال الاعشى يصف
  خارة
  فاذالها تامورة مرفوعة لشرابها وما بالدارتامور أى أحدغير مهموز
  والتامور الدم ويقال النفس قال أوس
  أنبنت أن بن -صيم أدخلوا * أبياتهم تامورنفس المنذر
  قال الاصمحى يعن مهجة نفسه وكانوا قتاوه وقال آخر و عمروبن قعاس المرادى
  وتامورهرقت وليس خرا • وحبة غير طاحنة لطحيت
  وأكلنا جزرة وهى الشاة السبينة فاتر كامنها تامورا أى شيئا وأ كل الذئب الشاة خاترك
  منها تامورا وما فى الركية تاء ورأى شئ من ماء وما بالدار تومرى بغير*.زوبلاد خلاءليس بها
  تومرى أى أحدوما رأيت تومريا أحسن منها للمرأة الجميلة أى لم أرخلقا ومارأيت تومريا
  أحسن منه وتتمير اللحم والتمرتجفيفهما وقال الشاءر يصف فرخة عقاب تسمى غية
  لها أشارير من لحم تره * من الثعالى ووخز من أرانيها .
  يقول انها تصبد الارانب والثعالب فأيدل من الباءفيهماياء أر اتمأر الشئ طال
  قوله تجر يتجرأى من باب نصرا
  كمافى المختارود عوى الوانى عسلى
  المختار هنا خلاف ذلك غير صحيحة
  واعلهامبنية عسلى نسخة محرفة
  وقعت له قاله نصر
  ٢ ذا لايسافى قول م ر فى
  أرنب لايجوزأُرانى فى جمعه الا
  فى الشعر عندسيبويه وأنشدلاني
  كاهل البشكرى يسبه ناقته
  بمقاب
  كأن رحلى على شغواه حادرة
  ظعياء قديل من ظل خوافيها
  اها اشارير الح قاله نصي
