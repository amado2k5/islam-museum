text: "يَوْمَ تَرَى ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَـٰتِ يَسْعَىٰ نُورُهُم بَيْنَ أَيْدِيهِمْ وَبِأَيْمَـٰنِهِم بُشْرَىٰكُمُ ٱلْيَوْمَ جَنَّـٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا ۚ ذَٰلِكَ هُوَ ٱلْفَوْزُ ٱلْعَظِيمُ"
text_search: "يوم ترى المؤمنين والمؤمنات يسعى نورهم بين أيديهم وبأيمانهم بشراكم اليوم جنات تجري من تحتها الأنهار خالدين فيها ۚ ذلك هو الفوز العظيم"
translations:
  en: { text: "On the day when thou (Muhammad) wilt see the believers, men and women, their light shining forth before them and on their right hands, (and wilt hear it said unto them): Glad news for you this day: Gardens underneath which rivers flow, wherein ye are immortal. That is the supreme triumph.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "جس دن تم مومن مردوں اور مومن عورتوں کو دیکھو گے کہ ان (کے ایمان) کا نور ان کے آگے آگے اور داہنی طرف چل رہا ہے (تو ان سے کہا جائے گا کہ) تم کو بشارت ہو (کہ آج تمہارے لئے) باغ ہیں جن کے تلے نہریں بہہ رہی ہیں ان میں ہمیشہ رہو گے۔ یہی بڑی کامیابی ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
