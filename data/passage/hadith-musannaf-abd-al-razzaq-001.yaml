text: "الله عليل ته ، فقرأه ، فإذا فيه : (بسم الله الرحمن الرحيم ، من محمد رسول الله ، إلى هرقل عظيم الروم ، سلام على من اتبع الهدى ، أما بعد ! فإني أدعوك بدعاية الإسلام ، أسلم تسلم،"
