label: { ar: "الموطأ 321 — ابن عمر: كان رسول الله يوتر على البعير", en: "Muwatta 321", es: "Muwatta 321", fr: "Muwatta 321", ur: "موطا 321", tr: "El-Muvatta 321 — İbn Ömer: Allah'ın Resulü vitir namazını deveye binerek kılardı.", id: "Al-Muwatta 321 — Ibn Umar: Rasulullah SAW biasa melaksanakan salat witr sambil menunggang unta." }
text: "أليس لك في رسول الله أسوة؟ فقلت: بلى والله. فقال: إن رسول الله كان يوتر على البعير"
summary:
  ar: "يرويه مالك عن أبي بكر بن عمر عن سعيد بن يسار، في باب الأمر بالوتر: كان سعيد يسير مع عبد الله بن عمر بطريق مكة فلما خشي الصبح نزل فأوتر ثم أدركه، فسأله ابن عمر أين كان، فلما أخبره قال له: أليس لك في رسول الله أسوة؟ فإن رسول الله كان يوتر على البعير. ويخرّجه المحقق عند البخاري (999) ومسلم (2/149) والترمذي (472) وابن ماجه (1200) والنسائي (3/232) والدارمي وابن حبان وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (24/137). {cite:muwatta-maruf-1997 p.182} {cite:muwatta-maruf-1997 p.183}"
  tr: "Malik, Ebu Bekir ibn Ömer'den, o da Sa'id ibn Yasar'dan rivayet ederek, Vitr namazının kılınması emri bölümünde şöyle anlatmıştır: Sa'id, Abdullah ibn Ömer ile Mekke yolunda seyahat ediyordu. Şafaktan korktuğunda, devesinden inip Vitr namazını kıldı, sonra ona yetişti. İbn Ömer ona nerede olduğunu sordu ve Sa'id ona şöyle dedi: \"Allah'ın Resulü'nde bir örnek görmüyor musun? Çünkü Allah'ın Resulü devesine binerek Vitr namazı kılardı.\" Araştırmacı ayrıca bunu, Malik'in sahabelerinin rivayet zincirleriyle Buhari (999), Müslim (2/149), Tirmizi (472), İbn Majah (1200), Nesai (3/232), Darimi, İbn Hibban ve Ahmed'in derlemelerine de dahil etmiş ve Temhid'e (24/137) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.182} {cite:muwatta-maruf-1997 s.183}"
  id: "Malik meriwayatkan hadits ini dari Abu Bakar bin Umar, yang juga dari Sa'id bin Yasar, dalam surah tentang perintah melaksanakan salat Witir: Sa'id sedang bepergian bersama Abdullah bin Umar dalam perjalanan ke Mekah. Ketika ia khawatir akan fajar, ia turun dari untanya dan melaksanakan salat Witir, kemudian menyusulnya. Ibnu Umar bertanya kepadanya di mana ia berada, dan ketika ia memberitahunya, Ibnu Umar berkata kepadanya: \"Tidakkah engkau mempunyai contoh pada Rasulullah? Karena Rasulullah biasa melaksanakan salat Witir sambil menunggang unta.\" Peneliti juga memasukkannya dalam kumpulan hadits al-Bukhari (999), Muslim (2/149), al-Tirmidhi (472), Ibnu Majah (1200), al-Nasa'i (3/232), al-Darimi, Ibnu Hibban, dan Ahmad, melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (24/137). {kutip:muwatta-maruf-1997 hal.182} {kutip:muwatta-maruf-1997 hal.183}"
