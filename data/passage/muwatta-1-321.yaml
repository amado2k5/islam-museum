label: { ar: "الموطأ 321 — ابن عمر: كان رسول الله يوتر على البعير", en: "Muwatta 321" }
text: "أليس لك في رسول الله أسوة؟ فقلت: بلى والله. فقال: إن رسول الله كان يوتر على البعير"
summary:
  ar: "يرويه مالك عن أبي بكر بن عمر عن سعيد بن يسار، في باب الأمر بالوتر: كان سعيد يسير مع عبد الله بن عمر بطريق مكة فلما خشي الصبح نزل فأوتر ثم أدركه، فسأله ابن عمر أين كان، فلما أخبره قال له: أليس لك في رسول الله أسوة؟ فإن رسول الله كان يوتر على البعير. ويخرّجه المحقق عند البخاري (999) ومسلم (2/149) والترمذي (472) وابن ماجه (1200) والنسائي (3/232) والدارمي وابن حبان وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (24/137). {cite:muwatta-maruf-1997 p.182} {cite:muwatta-maruf-1997 p.183}"
