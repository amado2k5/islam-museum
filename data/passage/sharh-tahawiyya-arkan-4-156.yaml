text: "… يضر مع الإسلام ذنب لمن عمله الأمن والاياس ينقلان من الملة الايمان هو الاقرار باللسان والتصديق بالجنان الايمان واحد وأهله سواء والتفاضل في التقوى زيادة الايمان ونقصانه المؤمنون كلهم أولياء الرحمن أكرم المؤمنين أطوعهم لله والايمان بالله وملائكته ورسله الايمان …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 4، ص 156، يذكر الإيمان بالله وملائكته وكتبه ورسله، وركن من أركان الإيمان، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 4, p. 156, that mentions belief in God, His angels, His books and His messengers, one of the articles of faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 4، ص 156 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کا ایک رکن، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 4, pág. 156, que menciona la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, uno de los artículos de fe, y el aumento y la disminución de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 4, p. 156) mentionnant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, un des articles de foi, et la possibilité que la foi augmente ou diminue. Extrait du scan automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le répertoire « Piliers et branches de la foi »."
