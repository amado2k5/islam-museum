text: "… المراعاة باتفاق. وإذا كانت كذلك صارت. الأعمال الخارجة عن الحظ دائرة على الأمور العامة. وقد تقدم أن غير الواجب بالجزء يصير واجباً بالكل، وهذا عامل بالكل فيما هو مندوب بالجزء أو مباح يختار النظام باختلاله. فقد صار عاملا بالوجوب. فأما …"
