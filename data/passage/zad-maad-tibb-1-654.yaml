text: "… الحديدُ يدخُل في أدوية عِدَّة طبيعية ذكرها الأطباء، فهذا الذي طُفىء به نارية العائن، لا يُستنكر أن يدخل في دواء يناسب هذا الداء. وبالجملة : فطب الطبائعية وعلاجُهم بالنسبة إلى العلاج النبوي، كطبِّ القُلرقية بالنسبة إلى طبهم، بل أقل، فإن …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 654، يذكر الطب والطبيب، والعلاج، والدواء، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 654, that mentions medicine and the physician, treatment, the drug, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 654 کا اقتباس جس میں طب اور طبیب، علاج، دوا، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 654, que menciona la medicina y el médico, el tratamiento, el medicamento, la enfermedad y su remedio; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 654, qui mentionne la médecine et le médecin, le traitement, le médicament, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 654. sayfasından, tıp, hekim, tedavi, ilaç ve hastalıktan bahseden bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 654, yang menyebutkan tentang kedokteran, dokter, pengobatan, obat-obatan, dan penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
