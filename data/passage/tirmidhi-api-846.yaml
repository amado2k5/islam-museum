text: "… عَمْرِو بْنِ أَبِي عَمْرٍو، عَنِ الْمُطَّلِبِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، عَنِ النَّبِيِّ قَالَ \" صَيْدُ الْبَرِّ لَكُمْ حَلاَلٌ وَأَنْتُمْ حُرُمٌ مَا لَمْ تَصِيدُوهُ أَوْ يُصَدْ لَكُمْ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي قَتَادَةَ وَطَلْحَةَ. قَالَ أَبُو عِيسَى حَدِيثُ جَابِرٍ حَدِيثٌ مُفَسَّرٌ. وَالْمُطَّلِبُ لاَ نَعْرِفُ لَهُ سَمَاعًا مِنْ جَابِرٍ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 846، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 846 (The Book on Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 846، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
