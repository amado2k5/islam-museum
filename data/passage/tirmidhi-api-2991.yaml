text: "… أُمَيَّةَ، أَنَّهَا سَأَلَتْ عَائِشَةَ عَنْ قَوْلِ اللَّهِ تَعَالَى : (إِنْ تُبْدُوا مَا فِي أَنْفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُمْ بِهِ اللَّهُ) وَعَنْ قَوْلِهِ : (مَنْ يَعْمَلْ سُوءًا يُجْزَ بِهِ ) فَقَالَتْ مَا سَأَلَنِي عَنْهَا أَحَدٌ مُنْذُ سَأَلْتُ رَسُولَ اللَّهِ فَقَالَ \" هَذِهِ مُعَاتَبَةُ اللَّهِ الْعَبْدَ فِيمَا يُصِيبُهُ مِنَ الْحُمَّى وَالنَّكْبَةِ حَتَّى الْبِضَاعَةُ يَضَعُهَا فِي كُمِّ قَمِيصِهِ فَيَفْقِدُهَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2991، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2991 (Chapters on Tafsir), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2991، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
