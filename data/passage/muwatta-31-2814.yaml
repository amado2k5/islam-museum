  ar: "يروي مالك عن عبد الله بن دينار، عن عبد الله بن عمر أن النبي قال: من قال لأخيه كافر فقد باء بها أحدهما. ويذكر المحقق أن لفظ «يا كافر» ثابت في روايات أخرى لكنه ليس في رواية يحيى الليثي. {cite:muwatta-maruf-1997 p.579} {cite:muwatta-maruf-1997 p.580}"
