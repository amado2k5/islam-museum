text: "… يعلمون من عِتْقٍ نسبِه، وصدقِه واجتهادِه في دينهم يومئذ، حتى إذا أمكن الحفر، واشتد عَليه الأذى، نَذَرَ إِن وَفَى له عشرة من الولد أن ينحر أَحدَهُم. ثم حفّر حتى أدرك سيوفاً دفنت في زمزمَ حيث دفنت. فلما رأت قريش أنه …"
summary:
