text: "… يعلمون من عِتْقٍ نسبِه، وصدقِه واجتهادِه في دينهم يومئذ، حتى إذا أمكن الحفر، واشتد عَليه الأذى، نَذَرَ إِن وَفَى له عشرة من الولد أن ينحر أَحدَهُم. ثم حفّر حتى أدرك سيوفاً دفنت في زمزمَ حيث دفنت. فلما رأت قريش أنه …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 257، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 257, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 257 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
