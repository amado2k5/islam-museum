label: { ar: "سنن النسائي 2959 — الأب والأبوة", en: "Sunan al-Nasa'i 2959 — the father and fatherhood", ur: "سنن نسائی 2959 — باپ اور والدیت", es: "Sunan al-Nasa'i 2959 — El padre y la paternidad" }
text: "أَخْبَرَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، عَنْ يَحْيَى، عَنِ ابْنِ جُرَيْجٍ، عَنْ كَثِيرِ بْنِ كَثِيرٍ، عَنْ أَبِيهِ، عَنِ الْمُطَّلِبِ بْنِ أَبِي وَدَاعَةَ، قَالَ رَأَيْتُ النَّبِيَّ حِينَ فَرَغَ مِنْ سُبُعِهِ جَاءَ حَاشِيَةَ الْمَطَافِ فَصَلَّى رَكْعَتَيْنِ وَلَيْسَ بَيْنَهُ وَبَيْنَ الطَّوَّافِينَ أَحَدٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 2959، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2959 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2959، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2959 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
