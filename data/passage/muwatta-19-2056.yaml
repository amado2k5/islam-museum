label: { ar: "الموطأ 2056 — مالك: السنة في المساقاة التي يجوز لرب الحائط أن يشترطها على المساقي منها شد الحظار، وخم العين، وسرو الشرب، وإبار النخل، وقطع الجريد، وجد الثمر، على أن للمساقي شطر الثمر أو أقل أو أكثر إذا تراضيا، ولا يشترط صاحب الأصل ابتداء عمل جديد، كالبئر والعين والغراس وما يعظم فيه النفقة", en: "Muwatta 2056", es: "Muwatta 2056", fr: "Muwatta 2056", ur: "موطا 2056", tr: "El-Muvatta 2056 — Malik: Meyve bahçesi sahibinin ortakçıya şart koşabileceği ortakçılıkla ilgili sünnet, çiti sıkılaştırmayı, pınarı doldurmayı, sulama sağlamayı, hurma ağaçlarını tozlaştırmayı, yaprakları kesmeyi ve meyveleri hasat etmeyi içerir; ancak ortakçı meyvenin yarısını, daha azını veya her ikisinin de anlaştığı takdirde daha fazlasını alır. Meyve bahçesi sahibi, kuyu kazmak, pınarı doldurmak, ağaç dikmek veya önemli masraflara yol açacak herhangi bir yeni işin başlatılmasını şart koşmaz.", id: "Al-Muwatta 2056 — Malik: Sunnah mengenai bagi hasil yang dapat ditetapkan oleh pemilik kebun kepada penggarapnya meliputi memperketat pagar, mengisi mata air, menyediakan irigasi, penyerbukan pohon kurma, memotong pelepah, dan memanen buah, dengan syarat penggarap menerima setengah dari buah, atau kurang, atau lebih jika keduanya setuju. Pemilik kebun tidak menetapkan dimulainya pekerjaan baru, seperti menggali sumur, mengisi mata air, menanam pohon, atau hal-hal lain yang akan menimbulkan biaya besar." }
summary:
  ar: "قال مالك: والسنة في المساقاة التي يجوز لرب الحائط أن يشترطها على المساقي منها: شد الحظار، وخم العين، وسرو الشرب، وإبار النخل، وقطع الجريد، وجد الثمر. هذا وأشباهه، على أن للمساقي شطر الثمر، أو أقل من ذلك، أو أكثر إذا تراضيا عليه. غير أن صاحب الأصل لا يشترط ابتداء عمل جديد يحدثه العامل فيها، من بئر يحفرها، أو عين يرفع رأسها، أو غراس يغرسه فيها يأتي بأصل ذلك من عنده، أو ضفيرة يبنيها، تعظم فيها نفقته. وإنما ذلك بمنزلة أن يقول رب الحائط لرجل من الناس: ابن لي هاهنا بيتا، أو احفر لي بئرا، أو أجر لي عينا، أو اعمل لي عملا، بنصف ثمر حائطي هذا، قبل أن يطيب ثمر الحائط، ويحل بيعه، فهذا بيع الثمر قبل أن يبدو صلاحه، وقد نهى رسول الله عن بيع الثمار حتى يبدو صلاحها. {cite:muwatta-maruf-1997 p.241} {cite:muwatta-maruf-1997 p.242}"
  id: "Malik berkata: Sunnah mengenai bagi hasil yang dapat ditetapkan oleh pemilik kebun kepada penggarapnya meliputi: memperkuat pagar, mengisi sumur, menyediakan irigasi, penyerbukan pohon kurma, memotong pelepah, dan memanen buah. Ketentuan ini dan ketentuan serupa diperbolehkan, dengan penggarap berhak atas setengah buah, atau kurang, atau lebih jika keduanya setuju. Namun, pemilik kebun tidak menetapkan bahwa penggarap harus melakukan pekerjaan baru di lahan tersebut, seperti menggali sumur, meninggikan sumber mata air, menanam pohon (menyediakan bahan yang diperlukan), atau membangun teralis yang akan menimbulkan biaya yang signifikan. Ini analog dengan pemilik kebun berkata kepada seseorang: \"Bangunkan rumah untukku di sini, atau gali sumur, atau sewakan mata air, atau lakukan pekerjaan lain untukku, sebagai imbalan setengah buah dari kebun ini,\" sebelum buah tersebut matang dan siap dijual. Ini termasuk menjual buah sebelum matang, dan Rasulullah shalla Allahu alaihi wa sallam melarang menjual buah sebelum matang. {cite:muwatta-maruf-1997 p.241} {cite:muwatta-maruf-1997 p.242}"
