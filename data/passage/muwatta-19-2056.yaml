label: { ar: "الموطأ 2056 — مالك: السنة في المساقاة التي يجوز لرب الحائط أن يشترطها على المساقي منها شد الحظار، وخم العين، وسرو الشرب، وإبار النخل، وقطع الجريد، وجد الثمر، على أن للمساقي شطر الثمر أو أقل أو أكثر إذا تراضيا، ولا يشترط صاحب الأصل ابتداء عمل جديد، كالبئر والعين والغراس وما يعظم فيه النفقة", en: "Muwatta 2056" }
summary:
  ar: "قال مالك: والسنة في المساقاة التي يجوز لرب الحائط أن يشترطها على المساقي منها: شد الحظار، وخم العين، وسرو الشرب، وإبار النخل، وقطع الجريد، وجد الثمر. هذا وأشباهه، على أن للمساقي شطر الثمر، أو أقل من ذلك، أو أكثر إذا تراضيا عليه. غير أن صاحب الأصل لا يشترط ابتداء عمل جديد يحدثه العامل فيها، من بئر يحفرها، أو عين يرفع رأسها، أو غراس يغرسه فيها يأتي بأصل ذلك من عنده، أو ضفيرة يبنيها، تعظم فيها نفقته. وإنما ذلك بمنزلة أن يقول رب الحائط لرجل من الناس: ابن لي هاهنا بيتا، أو احفر لي بئرا، أو أجر لي عينا، أو اعمل لي عملا، بنصف ثمر حائطي هذا، قبل أن يطيب ثمر الحائط، ويحل بيعه، فهذا بيع الثمر قبل أن يبدو صلاحه، وقد نهى رسول الله عن بيع الثمار حتى يبدو صلاحها. {cite:muwatta-maruf-1997 p.241} {cite:muwatta-maruf-1997 p.242}"
