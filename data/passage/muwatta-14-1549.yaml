label: { ar: "الموطأ 1549 — إبراهيم بن أبي عبلة عن عبد الملك بن مروان: وهب لصاحب له جارية ثم أراد أن يهبها لابنه، فقال عبد الملك مروان كان أورع منك", en: "Muwatta 1549" }
summary:
  ar: "يروي مالك عن إبراهيم بن أبي عبلة عن عبد الملك بن مروان أنه وهب لصاحب له جارية، ثم سأله عنها، فقال قد هممت أن أهبها لابني فيفعل بها كذا وكذا. فقال عبد الملك مروان كان أورع منك، وهب لابنه جارية، ثم قال لا تقربها، فإني قد رأيت ساقها منكشفة. {cite:muwatta-maruf-1997 p.47}"
