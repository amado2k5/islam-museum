label: { ar: "الموطأ 1549 — إبراهيم بن أبي عبلة عن عبد الملك بن مروان: وهب لصاحب له جارية ثم أراد أن يهبها لابنه، فقال عبد الملك مروان كان أورع منك", en: "Muwatta 1549", es: "Muwatta 1549", fr: "Muwatta 1549", ur: "موطا 1549", tr: "El-Muvatta 1549 — İbrahim ibn Abi Ablah, Abdülmalik ibn Mervan'dan rivayetle: Bir cariyeyi bir arkadaşına verdi, sonra onu oğluna vermek istedi. Bunun üzerine Abdülmalik Mervan şöyle dedi: \"O senden daha takvalıydı.\"", id: "Al-Muwatta 1549 — Ibrahim ibn Abi Ablah, berdasarkan riwayat Abd al-Malik ibn Marwan: Dia memberikan seorang budak perempuan kepada seorang temannya, kemudian ingin memberikannya kepada putranya, lalu Abd al-Malik Marwan berkata: Dia lebih saleh daripada kamu." }
summary:
  ar: "يروي مالك عن إبراهيم بن أبي عبلة عن عبد الملك بن مروان أنه وهب لصاحب له جارية، ثم سأله عنها، فقال قد هممت أن أهبها لابني فيفعل بها كذا وكذا. فقال عبد الملك مروان كان أورع منك، وهب لابنه جارية، ثم قال لا تقربها، فإني قد رأيت ساقها منكشفة. {cite:muwatta-maruf-1997 p.47}"
  tr: "Malik, İbrahim ibn Abi Ablah'tan, o da Abdülmalik ibn Mervan'dan rivayet ettiğine göre, bir cariyeyi bir arkadaşına vermiş, sonra da ona sormuş. Arkadaşı, \"Onu oğluma vermek niyetindeydim ki, onunla şöyle şöyle yapsın\" diye cevap vermiş. Abdülmalik, \"Mervan senden daha takvalıydı. Oğluna bir cariye verdi, sonra da 'Ona yaklaşma, çünkü bacağını açıkta gördüm' dedi.\" demiştir. {cite:muwatta-maruf-1997 s.47}"
  id: "Malik meriwayatkan dari Ibrahim ibn Abi Ablah, dari Abd al-Malik ibn Marwan, bahwa ia memberikan seorang budak perempuan kepada seorang temannya, lalu bertanya kepadanya tentang budak tersebut. Temannya menjawab, \"Aku bermaksud memberikannya kepada putraku agar ia dapat melakukan hal ini dan itu dengannya.\" Abd al-Malik berkata, \"Marwan lebih saleh daripada kamu. Ia memberikan seorang budak perempuan kepada putranya, lalu berkata, 'Jangan mendekatinya, karena aku telah melihat kakinya terbuka.'\" {cite:muwatta-maruf-1997 p.47}"
