text: "… بن أبي طلحة، عن ابن عبَّاس: هذا في الرجل يَحْضُره الموت، فيَسْمَعُه الرجل يوصي بوصية تَضُرُّ بورثته، فأمر اللّٰه تعالىٰ الذي يسمعه أن يَتَّقِي الله، ويُوَفِّقَه ويُسَدِّدَه للصَّواب، ولينظر لورثته كما كان يُحِبُّ أَن يَصْنَع بوَرَثَتِهِ إذا خَشِيَ عليهم الضَّيْعَةَ. …"
summary:
