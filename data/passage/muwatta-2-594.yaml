label: { ar: "الموطأ 594 — مالك عن أهل العلم: المرأة تموت وليس معها نساء ولا محرم ولا زوج تُيمم؛ وكذلك الرجل مع النساء", en: "Muwatta 594", es: "Muwatta 594", fr: "Muwatta 594", ur: "موطا 594", tr: "El-Muvatta 594 — Malik, âlimlerden rivayetle: Bir kadın ölürse ve yanında kadın, erkek vasi veya koca yoksa, teyemmüm (kuru abdest) almalıdır; aynı durum kadınlarla birlikte olan erkekler için de geçerlidir." }
summary:
  ar: "يروي مالك أنه سمع أهل العلم يقولون: إذا ماتت المرأة وليس معها نساء يغسلنها ولا أحد من ذوي المحرم يلي ذلك منها ولا زوج، يُممت فيُمسح بوجهها وكفيها من الصعيد. ويضيف مالك: وإذا هلك الرجل وليس معه إلا نساء يممنه أيضاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.306} {cite:muwatta-maruf-1997 p.307}"
  tr: "Malik, âlimlerin şöyle dediğini rivayet eder: Bir kadın ölürse ve onu yıkayacak kadın, ona bakacak erkek akraba ve kocası yoksa, ona teyemmüm (kuru abdest) verilmeli ve yüzü ve elleri temiz toprakla silinmelidir. Malik şöyle ekler: Bir erkek ölürse ve sadece kadınlar varsa, ona da teyemmüm verilmelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtir. {cite:muwatta-maruf-1997 s.306} {cite:muwatta-maruf-1997 s.307}"
  id: "Malik meriwayatkan bahwa ia mendengar para ulama berkata: Jika seorang wanita meninggal dan tidak ada wanita yang memandikannya, tidak ada kerabat laki-laki yang mengurusnya, dan tidak ada suami, maka ia harus diberi tayammum (wudhu kering), dan wajah serta tangannya harus diusap dengan tanah yang bersih. Malik menambahkan: Jika seorang laki-laki meninggal dan hanya ada wanita yang hadir, maka mereka juga harus memberinya tayammum. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.306} {cite:muwatta-maruf-1997 p.307}"
