label: { ar: "الموطأ 594 — مالك عن أهل العلم: المرأة تموت وليس معها نساء ولا محرم ولا زوج تُيمم؛ وكذلك الرجل مع النساء", en: "Muwatta 594" }
summary:
  ar: "يروي مالك أنه سمع أهل العلم يقولون: إذا ماتت المرأة وليس معها نساء يغسلنها ولا أحد من ذوي المحرم يلي ذلك منها ولا زوج، يُممت فيُمسح بوجهها وكفيها من الصعيد. ويضيف مالك: وإذا هلك الرجل وليس معه إلا نساء يممنه أيضاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.306} {cite:muwatta-maruf-1997 p.307}"
