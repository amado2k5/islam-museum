label: { ar: "صحيح البخاري 6516 — رثاء وثناء على ميت", en: "Sahih al-Bukhari 6516 — an elegy or praise of the dead", ur: "صحیح البخاری 6516 — مرثیہ یا میت کی تعریف", fr: "Sahih al-Bukhari 6516 — une élégie ou un éloge du défunt", es: "Sahih al-Bukhari 6516 — una elegía o elogio del difunto", tr: "Sahih el-Buhari 6516 — Merhum için övgü ve methiye", id: "Sahih al-Bukhari 6516 — Pujian dan sanjungan untuk orang yang telah meninggal" }
text: "حَدَّثَنَا عَلِيُّ بْنُ الْجَعْدِ، أَخْبَرَنَا شُعْبَةُ، عَنِ الأَعْمَشِ، عَنْ مُجَاهِدٍ، عَنْ عَائِشَةَ، قَالَتْ قَالَ النَّبِيُّ \" لاَ تَسُبُّوا الأَمْوَاتَ، فَإِنَّهُمْ قَدْ أَفْضَوْا إِلَى مَا قَدَّمُوا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6516، فيه رثاء وثناء على ميت. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6516 (To make the Heart Tender (Ar-Riqaq)), that carries an elegy or praise of the dead. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح البخاری کی حدیث نمبر 6516، جس میں مرثیہ یا میت کی تعریف ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih al-Bukhari, n° 6516, qui contient une élégie ou un éloge du défunt. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih al-Bukhari, n.º 6516, que contiene una elegía o elogio del difunto. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sahih el-Buhari'de 6516 numaralı hadis, vefat edenler için övgü ve ağıtlar içermektedir. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü ağıt ve övgülerden bazılarını içermektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6516, berisi pujian dan sanjungan untuk orang yang telah meninggal. Kompilasi ini mencakup beberapa elegi dan pujian yang paling terkenal, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
