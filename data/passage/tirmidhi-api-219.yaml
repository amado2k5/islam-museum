text: "حَدَّثَنَا أَحْمَدُ بْنُ مَنِيعٍ، حَدَّثَنَا هُشَيْمٌ، أَخْبَرَنَا يَعْلَى بْنُ عَطَاءٍ، حَدَّثَنَا جَابِرُ بْنُ يَزِيدَ بْنِ الأَسْوَدِ الْعَامِرِيُّ، عَنْ أَبِيهِ، قَالَ شَهِدْتُ مَعَ النَّبِيِّ حَجَّتَهُ فَصَلَّيْتُ مَعَهُ صَلاَةَ الصُّبْحِ فِي مَسْجِدِ الْخَيْفِ. قَالَ فَلَمَّا قَضَى صَلاَتَهُ وَانْحَرَفَ إِذَا هُوَ بِرَجُلَيْنِ فِي أُخْرَى الْقَوْمِ لَمْ يُصَلِّيَا مَعَهُ فَقَالَ \" عَلَىَّ بِهِمَا \". فَجِيءَ بِهِمَا تُرْعَدُ فَرَائِصُهُمَا فَقَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 219، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 219 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 219، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 219 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
