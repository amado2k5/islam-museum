text: "… قال رسول اللَّه مِيغِ: «مَنْ قَرَأَ حَرْفًا مِنْ كِتَابِ اللَّهِ، فَلَهُ بِهِ حَسَنَةٌ، وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا ، لَا أَقُولُ الم حَرْفٌ، وَلَكِنْ أَلِف حَرْفٌ، وَلَامٌ حَرْفٌ، وَمِيمٌ حَرْفُ . رواه الترمذي. وصححه [الترمذي: ٢٩١٢]. قالوا : ولأن عثمان بن عفان …"
