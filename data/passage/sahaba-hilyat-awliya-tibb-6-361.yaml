text: "… بن أحد نا محمد. ابن عبد اللّٰه الحضرمى ثنا أحمد بن راشد البجلى ثنا يحي بن يمان قال سمعت. سفيان الثورى يقول : العالم طبيب الدين، والدرهم داء الدين، فاذا جذب. الطبيب الداء إلى نفسه فتى يداوى غيره حدثنا القاضى …"
summary:
