text: "… بن أحد نا محمد. ابن عبد اللّٰه الحضرمى ثنا أحمد بن راشد البجلى ثنا يحي بن يمان قال سمعت. سفيان الثورى يقول : العالم طبيب الدين، والدرهم داء الدين، فاذا جذب. الطبيب الداء إلى نفسه فتى يداوى غيره حدثنا القاضى …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 6، ص 361، يذكر الطب والطبيب، والداء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 6, p. 361, that mentions medicine and the physician, the disease and its remedy, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 6، ص 361 کا اقتباس جس میں طب اور طبیب، بیماری، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 6, pág. 361, que menciona la medicina y el médico, la enfermedad y su remedio, la búsqueda de tratamiento; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 6, p. 361, qui mentionne la médecine et le médecin, la maladie et son remède, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 6. cildinin 361. sayfasından, tıp, hekim, hastalık ve tedaviye dair bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 6, hlm. 361, yang menyebutkan tentang kedokteran, dokter, penyakit, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
