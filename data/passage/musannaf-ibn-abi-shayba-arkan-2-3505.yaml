text: "… ثم قال له الثالثة: أدنو منك يا رسول الله؟ قال: نعم حتى الزق ركبتيه بركبة رسول اللّٰه وَالي قال: يا رسول الله، ما الإسلام؟ قال: قال رسول اللّٰه وَليفي : تقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتَحُجُّ البيت، وتغتسل من …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 3505، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
