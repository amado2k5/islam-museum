text: |-
  ٧٧
  غدرولانص عهدوطيبة على وزن شيبة اسم مدينة الرسول صلى اللّٰه عليه وسلم والطوب
  الآجرّ بلغة أهل مصروة واهم طبت به نفسا أى طابت نفسى به
  ف صل الظاء ⁦( أب)⁩ أبوزيد الظأب مهم وزسلف الرجل تقول ظأبه وظأمه
  وقسدظاء بنى مظابة وظاء مى مظاءمة اذا تزوجت أنت امرأة وتزوج«وأختمها والظأب
  أيضا الصوت والجلبة قال الشاء ريصف تيسا
  يصوع عنوقها أحوى زنيم * له ظأب كماصخب الغريم
  بظب) يقال مابه ظبظاب كما يقال مابه قلبة أى شئء من وجع قال رؤية
  كأنّ بى سلا ومابى ظبظاب وظباظب الغسم لبالبها وهى أصواتها وجلبتها
  ⁦( ظرب )⁩ الظرب بكسراراء واحد الطراب وفى الروامي الصغاد ومنه سمى عامى بن الظرب
  العدواتى أحدفرسان العرب قال الشاعر معديكرب يرثى أخاء شر حبيل
  ان جنى عن الفراش اماب * كتجافى الاسرّفوق الظراب ( ١
  والاظراب أسناخ الاسنان قال عامر بن الطفيل
  ومقطع -لق الرحالة سامح * بادنواجذه عن الاظراب
  والظربان مثال القطران دويبسة كالهرّة منتنة الريح تزعم الاعراب أنهانفسوفى توب
  أحدهم اذاصادها فلا تذهب رائحته حتى يبلى الذوب وفى المثل فسابيننا الظربان
  وذلك اذا تقاطع القوم قال الشاءر
  بداللّه بن حجاج الزيدى التغلبى اهمر
  ألا أبلغاقيا وخندف انى * ضربت كثير امضرب الظربان
  يعسى كشير بن شهاب وكذلك الظربي على وزن فعلى وهوجع مثل حجلى جح-ع حجل ) قال|
  الفرزدق وماجعل الظربى القصارأنوفها * الى الطمّ من موج البجار الخضارم
  وربماجمع على ظرابي مثل حرباء وحرابي كانه جمع ظرباء وقال!
  وهل أنتم الاظرابى مذج * تفاسى وتستنشى بانفها الطقيم
  ورجل ظرب مثال عتل القصير النهيم وقال
  يا أحسن الناس مناط عقد • لا تعدليى بظرب جعد
  نب الظنبوب العظم اليابس من قدم الساق ٣ ق ل يصف ظليما
  عارى الظنا بيب منحص قوادمه * يرمدحق ترى فى رأسه صتعا أى التواء
  وأماقول سلامة بن جندل
  كنااذا ما أتانا صارخ فزع • كان الصراخ له قرع الظنابيب
  فيقال عنى به سرعة الاجابة وجعل قرع السوط عسلى ساق انلحف فى زبر الفرس قرعا
  للظنبوب
  صل العين) بب ، العب شرب المناءمن غيرمص وفى الحديث السكباد من
  العب والحام يشرب الماءعبا كماتعب الدواب وقواهم لاعباب أى لا تعب فى الماء والعبعب
  كساء من صوف والعبعب أيضا التيس من الظباء والعبعب أيضائعمة الشباب قال العجاج
  بعد الجل والشباب الععب
  وعب النيت أى طال والمبعاب الجمل الطويل
  ١ لأسر هو البعير الذى فة
  كركرته دبرة اه حى تضى
  وزنهما اه
  ٣ دم بضمتين أى مقدّم ام
