text: |-
  ١ لأوّل بضم الظاء والشانى
  بنتهها والحاء على كل مضمومة اه
  ٤٤٠
  كل فعل كان ماضه مكورافات مستقبله يأتى مفتوح العين نحو علم يعلم الا آر بعسة أحرف
  جاءت توادر فالوا حسب يحسب ويجسب وبدس يبأس ويبنس وينس بيأس ويبنس ونعم ينعم
  وينعم فانها جاءت من السالم بالمكسر والفتح ومن المعتل ماجاء ماضيه ومستقبله جميعا بالسكسر
  نحو ومقي-ق ووفق يفق ووثق يثق وورع يرع وورم يرم وورثيرث وورى الزنديرى
  وولى إلى شب ، الحوشب موصل الوظيف فى رسغ الداية وقال الاصممىّ الموشب
  عظيم صغير كالسلامى فى طرف الوظيف بيزرأس الوظيف ومسترّ الحافر يدخل فى الجبة
  وأنشد للهجاج فى رسغ لا يتشكى الموشبا * مستبطنا مع الصميم عصبا
  والحوشب المنتفحّ الجنبين قال الشاعر
  وتجر مجرية لها * لحى الى أجرحواشب
  (خب الحصباء الحصى وأرض حصبة ومحصبة بالفتح ذات حصباء وحصبت المسحا
  عصيبا اذا فرشته بها والحصب• وضع الجار بمنى وحصبت الرجل أحصبه بالكسر أى
  رميته بالحصباء وحصب فى الارض ذهب فيها والحاصب الريح الشديدة التى تئير الحصباء
  وكذلك الحصبة قال لبيد جرّت عليها ان خوت من أهلها * أذيالها كل عصوف حصبه
  وأحصب الفرس أثار الحصياء فى عدوه والحصبة بئر يخرج بالحسد وقد يحرّك تقول منه
  حصب جلده بالكسر يحصب والحمصب ما يحصب به فى النارأى يرمى قال أبو عبيدة فى قوله
  تباركك وتعالى حصب جهتم كل ما ألقيته فى النار فقد حصبتها يه ويحصب بالكسرحى من
  اليمن واذانسبت قلت يحسى فتفتح الصاد مثل تغلب وتغلبىّ (حضب الحضب بالكسر
  صوت القوس والجمع أحضاب والحضب أيضا الذكرمن الحيات قال أبو سعيد هو بالضادمعمة
  وأنشدارؤية وقد تطويت ائطوال: الحضب والحضب لغسة فى الحصب و.نهرأابن
  عباس حضب جهتم قال الفراءير يد الحصب قال وذكرلنا أن الحضب فى اغة أهل اليمن
  لحطب قال وكل ماهيجت به النار وأوقدتها به فهو حضب والمحضب المعر قال الاعنى
  فلاتك فى حربنا محضبا * تجعل قومك شتى شعوبا
  طب الحطب معروف تقول منه حطبت واحتطبت اذ اجعته وبقال لن يتكلم
  بالغث والسهين حاطب ليل لانه لا يبصر ما يجمع فى حبله وحطب-ى فلان اذا أتاك بالحطب
  خب جووز واذاجاع بكى * لاحطب القوم ولاالقوم سقى
  والمطابة الذين يحتطبون وأحطب الكرم حان أن يقطح منه الحطب وناقة محاطبة تأكل
  الشوك اليابس ومكان خطيب كثير الحطب والحطب الرجل الشديد الهزال والاحطب
  مثله وقواهم صفقة لم يشهدها حاطب هو حاطب بن أبى بلتعة وكان حازما ⁦( حظب)⁩
  حظب حظو با هن يقال اً عال تحطب أى اشرب مرة بعدمرة تسمن الاصمعى الحنظب
  والحنظب ١ الذكر من الجراد وقان الخليل المناظب الخفافس الواحدحنظب
  وحنظباء قال الطماحى يصف كابا أسود
  أعددت للذئب وليل الحارس * مصدرا أتلع مثل الفارس
  يستقبل الريح بأنف خانس * فى مثل جلد الحنظبا اليَابس
  وقال
