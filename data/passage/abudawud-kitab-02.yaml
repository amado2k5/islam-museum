  ar: "سنن أبي داود، كتاب الصلاة"
  en: "Sunan Abi Dawud, Book 2: Prayer (Kitab Al-Salat)"
  ur: "سنن ابی داؤد، کتاب الصلاۃ"
  es: "Sunan Abi Dawud, Libro 2: Oración (Kitab Al-Salat)"
