summary:
  ar: "القسم 2 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصلاة»، ويضم فيها النصوص من 391 إلى 1160 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 2 of Sunan Abi Dawud (Prayer (Kitab Al-Salat)) in the division of the open hadith dataset the museum took its reports from: reports 391 to 1160 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 2، عنوان «کتاب الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 391 تا 1160۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 2 de Sunan Abi Dawud (Oración (Kitab Al-Salat)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 391 al 1160, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Abi Dawud (Livre 2), intitulé « Prière » (Kitab Al-Salat), dans la base de données ouverte: les hadiths 391 à 1160 de cette base de données sont classés dans ce livre. Les éditions imprimées présentent une classification et une numérotation différentes."
