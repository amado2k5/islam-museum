text: "… تكسف لموت أحد ولا لحياته. قالوا : لما قبض رسول اللّه، كان أبو بكر ينفق على مارية خلافته، ثم كان عمر يتفق عليها إلى أن توفيت. وكانت وفاتها فى سنة ست عشرة. وصلى عليها عمر. ودُفنت بالبقيع. وأمر عمر، فجمع …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 2، ص 453، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 2, p. 453, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 2، ص 453 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ansab al-Ashraf de al-Baladhuri, volumen 2, pág. 453, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre Ansab al-Ashraf d'al-Baladhuri (tome 2, p. 453), mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "El-Baladhuri'nin \"Ansab al-Ashraf\" (Soyluların Şecereleri) adlı eserinin 2. cildinin 453. sayfasından alınan bir alıntıda, ölüm ve vefat zamanı, defin, mezar ve türbeden bahsedilmektedir; bu alıntı, makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari \"Ansab al-Ashraf\" (Silsilah Para Bangsawan) karya Al-Baladhuri, Jilid 2, halaman 453, menyebutkan saat kematian dan wafat, penguburan, kuburan, dan makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
