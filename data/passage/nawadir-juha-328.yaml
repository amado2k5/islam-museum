text: "… ما هو طريق الموت؟ سألوه يوماً : كيف طريق موت ابن آدم؟ فقال: عندما يقول العارفون، فليسمعِ السامعون بآذانِ قلبهم، وإذا كان القائل سامِعاً فليع أيضاً الكلام بأذُن نفسِه. أين الحق؟ قالوا لجحا: أين مكان الحقّ؟ فقال: هل من مكان …"
summary:
  ar: "سُئل جحا كيف يموت الإنسان، فقال إن العارفين يتكلمون وعلى السامع أن يسمع بقلبه. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  en: "Asked how a man dies, Juha says those who know speak, and the listener must hear with the heart. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  ur: "جحا سے پوچھا گیا کہ انسان کیسے مرتا ہے، تو اس نے کہا کہ جاننے والے بولتے ہیں اور سننے والے کو دل سے سننا چاہیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  fr: "Interrogé sur la manière dont un homme meurt, Juha répond que ceux qui savent parlent, et que l'auditeur doit entendre avec le cœur. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  es: "Al preguntarle cómo muere una persona, Juha dice que los que saben hablan, y que el oyente debe escuchar con el corazón. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  tr: "Juha'ya bir insanın nasıl öldüğü soruldu ve o da bilenlerin konuştuğunu, dinleyenin ise yüreğiyle dinlemesi gerektiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 162}"
  id: "Juha ditanya bagaimana seseorang meninggal, dan dia menjawab bahwa mereka yang tahu akan berbicara, dan pendengar harus mendengarkan dengan hatinya. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
