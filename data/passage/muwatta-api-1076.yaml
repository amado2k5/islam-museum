text: "… الذَّكَرِ وَمَعَ ابْنِ الاِبْنِ الذَّكَرِ السُّدُسُ فَرِيضَةً وَهُوَ فِيمَا سِوَى ذَلِكَ مَا لَمْ يَتْرُكِ الْمُتَوَفَّى أَخًا أَوْ أُخْتًا لأَبِيهِ يُبَدَّأُ بِأَحَدٍ إِنْ شَرَّكَهُ بِفَرِيضَةٍ مُسَمَّاةٍ فَيُعْطَوْنَ فَرَائِضَهُمْ فَإِنْ فَضَلَ مِنَ الْمَالِ السُّدُسُ فَمَا فَوْقَهُ فُرِضَ لِلْجَدِّ السُّدُسُ فَرِيضَةً. قَالَ مَالِكٌ وَالْجَدُّ وَالإِخْوَةُ لِلأَبِ وَالأُمِّ إِذَا شَرَّكَهُمْ أَحَدٌ بِفَرِيضَةٍ مُسَمَّاةٍ يُبَدَّأُ بِمَنْ شَرَّكَهُمْ مِنْ أَهْلِ الْفَرَائِضِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1076، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1076 (Fara'id), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1076، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1076 (Fara'id), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 1076 (Fara'id), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Malik'in Muwatta'sında yer alan 1076 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1076, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
