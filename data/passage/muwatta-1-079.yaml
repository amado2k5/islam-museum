label: { ar: "الموطأ 79 — وضوء النبي في غزوة تبوك ومسحه على الخفين", en: "Muwatta 79" }
text: "فجاء وعبد الرحمن بن عوف يؤمهم وقد صلى بهم ركعة، فصلى رسول الله الركعة التي بقيت عليهم"
summary:
  ar: "أول حديث في باب ما جاء في المسح على الخفين. يرويه يحيى عن مالك عن ابن شهاب عن عباد بن زياد عن المغيرة بن شعبة: ذهب النبي لحاجته في غزوة تبوك وذهب معه المغيرة بماء، فصبّ عليه فغسل وجهه، ثم أراد أن يخرج يديه من كمي جبته فضاقا فأخرجهما من تحتها، فغسل يديه ومسح برأسه ومسح على الخفين، ثم جاء فوجد عبد الرحمن بن عوف يؤم الناس وقد صلى بهم ركعة، فصلى معهم الركعة الباقية، ففزع الناس، فلما قضى صلاته قال لهم: أحسنتم. ويبين المحقق أن قول مالك إن عباد بن زياد «من ولد المغيرة» خطأ نص عليه مصعب الزبيري وابن عبد البر، وأن قول يحيى «عن أبيه المغيرة» زيادة لم يقلها غيره من رواة الموطأ وإن تابعه فيها ابن مهدي، وينقل عن ابن عبد البر أن إسناد مالك هنا «ليس بالقائم» وأن روايته مقطوعة لأن عباداً لم ير المغيرة، وإنما يرويه ابن شهاب عن عباد عن عروة أو حمزة ابني المغيرة عن أبيهما (التمهيد 11/120–121)؛ ويذكر أن الحديث في الصحيحين من طريق عروة بن المغيرة عن أبيه. {cite:muwatta-maruf-1997 p.75} {cite:muwatta-maruf-1997 p.76} {cite:muwatta-maruf-1997 p.77}"
