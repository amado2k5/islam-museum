label: { ar: "الموطأ 79 — وضوء النبي في غزوة تبوك ومسحه على الخفين", en: "Muwatta 79", es: "Muwatta 79", fr: "Muwatta 79", ur: "موطا 79", tr: "El-Muvatta 79 — Tebük Savaşı sırasında Peygamberin abdest alması ve çoraplarıyla silinmesi", id: "Al-Muwatta 79 — Wudhu Nabi saat Perang Tabuk dan cara beliau mengusap kaus kakinya" }
text: "فجاء وعبد الرحمن بن عوف يؤمهم وقد صلى بهم ركعة، فصلى رسول الله الركعة التي بقيت عليهم"
summary:
  ar: "أول حديث في باب ما جاء في المسح على الخفين. يرويه يحيى عن مالك عن ابن شهاب عن عباد بن زياد عن المغيرة بن شعبة: ذهب النبي لحاجته في غزوة تبوك وذهب معه المغيرة بماء، فصبّ عليه فغسل وجهه، ثم أراد أن يخرج يديه من كمي جبته فضاقا فأخرجهما من تحتها، فغسل يديه ومسح برأسه ومسح على الخفين، ثم جاء فوجد عبد الرحمن بن عوف يؤم الناس وقد صلى بهم ركعة، فصلى معهم الركعة الباقية، ففزع الناس، فلما قضى صلاته قال لهم: أحسنتم. ويبين المحقق أن قول مالك إن عباد بن زياد «من ولد المغيرة» خطأ نص عليه مصعب الزبيري وابن عبد البر، وأن قول يحيى «عن أبيه المغيرة» زيادة لم يقلها غيره من رواة الموطأ وإن تابعه فيها ابن مهدي، وينقل عن ابن عبد البر أن إسناد مالك هنا «ليس بالقائم» وأن روايته مقطوعة لأن عباداً لم ير المغيرة، وإنما يرويه ابن شهاب عن عباد عن عروة أو حمزة ابني المغيرة عن أبيهما ⁦(التمهيد 11/120–121)⁩؛ ويذكر أن الحديث في الصحيحين من طريق عروة بن المغيرة عن أبيه. {cite:muwatta-maruf-1997 p.75} {cite:muwatta-maruf-1997 p.76} {cite:muwatta-maruf-1997 p.77}"
  tr: "Çorapların üzerinden silme hakkında rivayet edilen hadisler bölümündeki ilk hadis, Yahya'nın Malik'ten, onun da İbn Şihab'tan, onun da Abbad bin Ziyad'dan, onun da El-Muğire bin Şube'den rivayet ettiği hadistir: Peygamberimiz Tebük Savaşı sırasında tuvalete gitti ve El-Muğire de onunla birlikte su ile gitti. El-Muğire suyu Peygamberimizin üzerine döktü ve Peygamberimiz yüzünü yıkadı. Sonra ellerini cübbesinin kollarının altından çıkarmak istedi, ancak kollar çok dardı, bu yüzden ellerini altından çıkardı. Ellerini yıkadı, başını sildi ve çoraplarının üzerinden sildi. Sonra geri döndü ve Abdurrahman bin Avf'ın insanlara namaz kıldırdığını gördü. Abdurrahman bin Avf onlarla bir rekat kılmıştı, bu yüzden kalan rekatı onlarla birlikte kıldı. İnsanlar endişelendi, bu yüzden namazı bitirdiğinde onlara şöyle dedi: \"İyi yaptınız.\" Araştırmacı, Malik'in 'Abbad ibn Ziyad'ın \"el-Mughirah'ın soyundan\" olduğu yönündeki ifadesinin, Mus'ab el-Zubeyri ve İbn Abd el-Barr tarafından açıkça belirtildiği gibi bir hata olduğunu açıklığa kavuşturmaktadır. Ayrıca, Yahya'nın \"babası el-Mughirah'tan\" ifadesinin, İbn Mehdi'nin onu takip etmesine rağmen, Muwatta'nın diğer hiçbir ravisi tarafından belirtilmeyen bir ekleme olduğunu belirtmektedir. İbn Abd el-Barr'ın, Malik'in buradaki rivayet zincirinin \"sağlam olmadığını\" ve rivayetinin kopuk olduğunu, çünkü 'Abbad'ın el-Mughirah'ı görmediğini söylediğini aktarmaktadır. Aksine, İbn Şihab bunu 'Abbad'dan, el-Mughirah'ın oğulları 'Urve veya Hamza'dan, babalarından rivayet etmektedir (el-Tamhid 11/120-121). Ayrıca hadisin, Urve ibn el-Muğire'nin babasından rivayet zinciri yoluyla iki Sahih'te (Buhari ve Müslim) bulunduğunu da belirtiyor. {cite:muwatta-maruf-1997 s.75} {cite:muwatta-maruf-1997 s.76} {cite:muwatta-maruf-1997 s.77}"
  id: "Hadits pertama dalam bab ini tentang apa yang diriwayatkan mengenai mengusap kaus kaki. Diriwayatkan oleh Yahya dari Malik dari Ibn Shihab dari Abbas bin Ziyad dari Al-Mughirah bin Shu’bah: Nabi pergi ke toilet selama Perang Tabuk dan Al-Mughirah ikut bersamanya membawa air, lalu beliau menuangkan air itu ke wajah Nabi dan beliau membasuh wajahnya. Kemudian beliau ingin mengeluarkan tangannya dari bawah lengan jubahnya, tetapi jubahnya terlalu ketat, jadi beliau mengeluarkannya. Beliau membasuh tangannya dan mengusap kepalanya serta mengusap kaus kakinya. Kemudian beliau datang dan mendapati Abdur-Rahman bin Awf sedang memimpin shalat berjamaah dan beliau telah shalat satu rakaat bersama mereka, lalu beliau shalat rakaat yang tersisa bersama mereka. Orang-orang terkejut, lalu setelah beliau selesai shalat, beliau berkata kepada mereka: Kalian telah berbuat baik. Peneliti mengklarifikasi bahwa pernyataan Malik bahwa 'Abbad ibn Ziyad \"berasal dari keturunan al-Mughirah\" adalah sebuah kesalahan, sebagaimana dinyatakan secara eksplisit oleh Mus'ab al-Zubayri dan Ibn 'Abd al-Barr. Ia lebih lanjut menyatakan bahwa pernyataan Yahya, \"dari ayahnya al-Mughirah,\" adalah tambahan yang tidak disebutkan oleh perawi Muwatta lainnya, meskipun Ibn Mahdi mengikutinya dalam hal ini. Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa rantai periwayatan Malik di sini \"tidak sahih\" dan bahwa riwayatnya terputus karena 'Abbad tidak melihat al-Mughirah. Sebaliknya, Ibn Shihab meriwayatkannya dari 'Abbad, dari 'Urwah atau Hamzah, putra-putra al-Mughirah, dari ayah mereka (al-Tamhid 11/120-121). Ia juga menyebutkan bahwa hadits tersebut terdapat dalam dua kitab Sahih (Bukhari dan Muslim) melalui sanad 'Urwah ibn al-Mughirah dari ayahnya. {cite:muwatta-maruf-1997 p.75} {cite:muwatta-maruf-1997 p.76} {cite:muwatta-maruf-1997 p.77}"
