text: "… بقراءة هذه السورة، إنها لآخِرُ ما سمعتُ من رسول اللَّه ليفي يقرأ بها في المغرب البخاري:، ومسلم:. فهذا في آخر الأمر. وأيضاً فإن قوله: وكانت صلاته بعدُ غايةً قد حذف ما هي مضافة إليه، فلا يجوز إضمارُ ما لا يدل …"
