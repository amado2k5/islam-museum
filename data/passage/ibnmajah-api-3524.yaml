label: { ar: "سنن ابن ماجه 3524 — الرقية، عيادة المريض", en: "Sunan Ibn Majah 3524 — ruqya recited over the sick; visiting the sick", ur: "سنن ابن ماجہ 3524 — رقیہ، بیمار کی عیادت" }
text: "… عَنْ عَاصِمِ بْنِ عُبَيْدِ اللَّهِ، عَنْ زِيَادِ بْنِ ثُوَيْبٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ جَاءَ النَّبِيُّ ـ يَعُودُنِي فَقَالَ لِي \" أَلاَ أَرْقِيكَ بِرُقْيَةٍ جَاءَنِي بِهَا جِبْرَائِيلُ \". قُلْتُ بِأَبِي وَأُمِّي بَلَى يَا رَسُولَ اللَّهِ. قَالَ \" بِسْمِ اللَّهِ أَرْقِيكَ وَاللَّهُ يَشْفِيكَ مِنْ كُلِّ دَاءٍ فِيكَ مِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3524، يذكر الرقية، وعيادة المريض، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3524 (Chapters on Medicine), that mentions ruqya recited over the sick, visiting the sick, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3524، جس میں رقیہ، بیمار کی عیادت، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
