label: { ar: "سنن ابن ماجه 3524 — الرقية، عيادة المريض", en: "Sunan Ibn Majah 3524 — ruqya recited over the sick; visiting the sick", ur: "سنن ابن ماجہ 3524 — رقیہ، بیمار کی عیادت", es: "Sunan Ibn Majah 3524 — ruqya recitada sobre los enfermos; visita a los enfermos", fr: "Sunan Ibn Majah 3524 — la ruqya récitée sur les malades; la visite aux malades", tr: "Sunan İbn Majah 3524 — Ruqyah, Hastaları Ziyaret Etmek", id: "Sunan Ibnu Majah 3524 — Ruqyah, Menjenguk Orang Sakit" }
text: "… عَنْ عَاصِمِ بْنِ عُبَيْدِ اللَّهِ، عَنْ زِيَادِ بْنِ ثُوَيْبٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ جَاءَ النَّبِيُّ ـ يَعُودُنِي فَقَالَ لِي \" أَلاَ أَرْقِيكَ بِرُقْيَةٍ جَاءَنِي بِهَا جِبْرَائِيلُ \". قُلْتُ بِأَبِي وَأُمِّي بَلَى يَا رَسُولَ اللَّهِ. قَالَ \" بِسْمِ اللَّهِ أَرْقِيكَ وَاللَّهُ يَشْفِيكَ مِنْ كُلِّ دَاءٍ فِيكَ مِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3524، يذكر الرقية، وعيادة المريض، والداء، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3524 (Chapters on Medicine), that mentions ruqya recited over the sick, visiting the sick, the disease and its remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3524، جس میں رقیہ، بیمار کی عیادت، بیماری، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3524 (Capítulos sobre Medicina), menciona la ruqya recitada sobre los enfermos, las visitas a los enfermos, la enfermedad y su remedio, y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3524 (Chapitres sur la médecine), mentionne la roqya récitée sur les malades, les visites aux malades, la maladie et son remède, ainsi que la guérison. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 3524 numaralı hadiste rukye (manevi şifa), hasta ziyareti, hastalık ve iyileşmeden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3524, menyebutkan ruqyah (penyembuhan spiritual), mengunjungi orang sakit, penyakit, dan kesembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
