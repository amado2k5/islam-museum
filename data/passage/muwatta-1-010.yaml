label: { ar: "الموطأ 10 — أنس: نصلي العصر ثم يُدرك المصلي بني عمرو بن عوف", en: "Muwatta 10" }
text: "كنا نصلي العصر ثم يخرج الإنسان إلى بني عمرو بن عوف فيجدهم يصلون العصر"
summary:
  ar: "يرويه مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك، في باب وقوت الصلاة: كانوا يصلون العصر في المدينة ثم يخرج الرجل إلى بني عمرو بن عوف في قباء فيجدهم لم يصلوها بعد، دلالةً على تبكير النبي بالعصر وسعة وقتها. ويخرّجه المحقق عند البخاري (548) ومسلم (2/109) من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه يدخل في المسند، وأن عبد الله بن المبارك وعتيق بن يعقوب روياه عن مالك مسنداً بذكر الصلاة مع رسول الله (التمهيد 1/295). {cite:muwatta-maruf-1997 p.38} {cite:muwatta-maruf-1997 p.39}"
  en: "Anas ibn Malik: they used to pray the afternoon prayer, then a man could set out for Quba and find its people still praying it."
