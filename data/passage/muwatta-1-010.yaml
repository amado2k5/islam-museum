ref: "1.10"
label: { ar: "الموطأ 10 — أنس: نصلي العصر ثم يُدرك المصلي بني عمرو بن عوف", en: "Muwatta 10", es: "Muwatta 10", fr: "Muwatta 10", ur: "موطا 10", tr: "El-Muvatta 10 — Enes: İkindi namazını kıldıktan sonra, namaz kılan kişi Beni Amr ibn Awf kabilesine yetişir.", id: "Al-Muwatta 10 — Anas: Kami shalat Asar, kemudian orang yang beribadah menyusul Bani Amr bin Awf" }
text: "كنا نصلي العصر ثم يخرج الإنسان إلى بني عمرو بن عوف فيجدهم يصلون العصر"
summary:
  ar: "يرويه مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك، في باب وقوت الصلاة: كانوا يصلون العصر في المدينة ثم يخرج الرجل إلى بني عمرو بن عوف في قباء فيجدهم لم يصلوها بعد، دلالةً على تبكير النبي بالعصر وسعة وقتها. ويخرّجه المحقق عند البخاري (548) ومسلم (2/109) من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه يدخل في المسند، وأن عبد الله بن المبارك وعتيق بن يعقوب روياه عن مالك مسنداً بذكر الصلاة مع رسول الله ⁦(التمهيد 1/295)⁩. {cite:muwatta-maruf-1997 p.38} {cite:muwatta-maruf-1997 p.39}"
  en: "Anas ibn Malik: they used to pray the afternoon prayer, then a man could set out for Quba and find its people still praying it."
  es: "Anas ibn Malik: solían rezar la oración de la tarde, y entonces un hombre podía partir hacia Quba y encontrar a su gente todavía rezándola."
  fr: "Anas ibn Malik: ils avaient l'habitude de faire la prière de l'après-midi, puis un homme pouvait partir pour Quba et trouver ses habitants en train de la prier encore."
  ur: "انس بن مالک کہتے ہیں کہ وہ عصر کی نماز پڑھتے تھے، پھر ایک آدمی قبا کی طرف روانہ ہوتا اور وہاں کے لوگوں کو ابھی تک نماز پڑھتے پاتا۔"
  tr: "Malik, namaz vakitleri bölümünde, İshak ibn Abdullah ibn Abi Talha'dan, o da Enes ibn Malik'ten rivayet ederek şöyle anlatmıştır: Medine'de ikindi namazını kılarlardı, sonra bir adam Kuba'daki Beni Amr ibn Awf'a gider ve onların henüz namazı kılmadıklarını görürdü. Bu, Peygamber'in ikindi namazını erken kıldığını ve namaz için bolca vakit olduğunu gösterir. Buhari (548) ve Müslim (2/109)'un editörü, bunu Malik'in sahabelerinin rivayet zincirleriyle dahil etmiş ve İbn Abdülberr'in bunun Musned'de yer aldığını ve Abdullah ibn Mübarek ile Atık ibn Yakub'un bunu Malik'ten rivayet ettiğini, Allah Resulü ile namazdan bahseden bir rivayet zinciriyle naklettiklerini belirtmiştir (el-Temhid 1/295). {cite:muwatta-maruf-1997 s.38} {cite:muwatta-maruf-1997 s.39}"
  id: "Malik meriwayatkan hadits ini dari Ishaq ibn Abdullah ibn Abi Talha, yang juga dari Anas ibn Malik, dalam surah tentang waktu shalat: Mereka biasa mengerjakan shalat Ashar di Madinah, kemudian seorang pria pergi ke Bani Amr ibn Awf di Quba dan mendapati bahwa mereka belum mengerjakannya, yang menunjukkan bahwa Nabi biasa mengerjakan shalat Ashar lebih awal dan memiliki cukup waktu untuk itu. Editor al-Bukhari (548) dan Muslim (2/109) memasukkannya melalui sanad para sahabat Malik, dan ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa hadits ini termasuk dalam Musnad, dan bahwa Abdullah ibn al-Mubarak dan Atiq ibn Yaqub meriwayatkannya dari Malik dengan sanad yang menyebutkan shalat bersama Rasulullah (al-Tamhid 1/295). {kutip:muwatta-maruf-1997 hal.38} {kutip:muwatta-maruf-1997 hal.39}"
