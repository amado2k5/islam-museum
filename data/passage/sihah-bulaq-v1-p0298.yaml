text: |-
  ⁦(فدل الشين)⁩
  ٣٤٣
  "عدلايق ( ت ذ يو عبيد الشميذر البعير السريع قال والنساقة شميذرة شنر
  الشنار العيب والعار قال القطامى يدح الامراء
  وضمن رعية وهم رعاة • ولولارعيهم شنع الشنار
  ور شار البه باليدأ ومأوأشار عليه بالرأى وشرت العسل واشترتها أى اجتنيتها
  وأشرت لغة وأنشدأبوعمرو
  وسماع يأذن الشيخله * وحديث مثل ماذى مشار
  وأنكرها الاصمى وكان يروى هذا البيت مثل ماذي مشار بالاضافة وفتح الميم قال والمشار
  الخلية يشتار منها والمشاور الحايض الواحدمشوروهوءود يكون مع مشتار العسل
  ابن السكيت التوار متاع البيت ومتاع الرحل بالحاء قال والشوار فرج المرأة والرجل قال
  ومنسه قيل شور يه أى كأنه أيدى عورنه ويقال أيدى اللّٰه شواره أى عورته والشوار
  والشارة المبساس والهيئة قال زهير
  مقورة تتبارى لاشواراها * الا القطوع على الاجواز والورل
  والمشارة الدبرة التى فى المزرعة وشرت الدابة شوراعر ضتها على البيع أقبلت بها وأدبرت
  والمكان الذى تعرض فيه الدواب مشوار يقال اياك وانخطب فإنها مشوار كثير العثار
  والقعقاع بن شودرحِل من بني عروبر شيبان بن ذهل بن تعلبة واشتارت الابل اذاسنت
  بعض السمن يقال ياءت الابل شيارا أى سمانا حسانا وقد شار الفرس أي سمن وحسن
  وفرس شيروخيل شيار مثل جيدو جياد قال عمروين معدى كربه
  أعباس لو كانت شياراجيادظ * يتثليث ماناصات بعدى الاحامسا
  وكانت العرب تسمى يوم السيت شيارا والمشورة الشورى وكذلاث المشورة بضم الشين تقول
  منمشاورته فى الامر واستشرته بحفى أيو عمر والمستشير السمين وقد استشار البعير مثل
  اشتارأى سمن وأماقول الراجز أفزعنها كل مستشير • وكل بكرداءرمتشير
  فان الاموى يقول المستشير الفحل الذى يعرف الحائل من غيرها وشورت الرجل قتشوّر أى
  أخعلته نفححل وشوّر اليه بيده أى أشارعن ابمه السكيت ورحل حسن الصورة والشورة وأنه
  لصير شير أى حسن الصورة والشارة وهى الهيئة عن الغراء وفلان خير شيرأى يصلح للمشاورة
  ( شهر الشهر واحد الشهور وقد أشهرنا أى أتى علينا شهر قال الشاعر
  مازات مذأشهر السفار أنظرهم • مثل انتظار المضى راعى الغتم
  ابن السحكت أشهرنافي هذا الممكان أقنافيه شهرا وقال ثعاب أشهر ناد خلنا فى الشهر
  والمشاهرة من الشهر كالمعاومة من العام والشهرة وضوح الامرتقول منه شهرت الامر
  أشهرمشهراوشهرة قاشتة رأى وضح وكذلك شهرته تشهيرا ولفلان فضيلة اشتهرها الناس
  وشهرسيفه يشهرم شهر أى له ⁦(شهبر)⁩ الشهبرة مثل الشهرية وهى العجوز الكبيرة
  قال الراجز رب محوز من غير شهبره • علتها الانفاض بعد القرقرم
  والجمع الشها بروقال جهت منهم عشباشهابرا ⁦( هدر)⁩ رج-ل شهدارة أى قاحش
  بالدال والذال جيعا
  فى بعض نسخ تأخيرشهرعن
  شهيدام
