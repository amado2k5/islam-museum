text: "… جَدِّهِ، رِيَاحِ بْنِ الْحَارِثِ سَمِعَ جَدَّهُ، سَعِيدَ بْنَ زَيْدِ بْنِ عَمْرِو بْنِ نُفَيْلٍ يَقُولُ كَانَ رَسُولُ اللَّهِ ـ عَاشِرَ عَشَرَةٍ فَقَالَ \" أَبُو بَكْرٍ فِي الْجَنَّةِ وَعُمَرُ فِي الْجَنَّةِ وَعُثْمَانُ فِي الْجَنَّةِ وَعَلِيٌّ فِي الْجَنَّةِ وَطَلْحَةُ فِي الْجَنَّةِ وَالزُّبَيْرُ فِي الْجَنَّةِ وَسَعْدٌ فِي الْجَنَّةِ وَعَبْدُ الرَّحْمَنِ فِي الْجَنَّةِ \". فَقِيلَ لَهُ مَنِ التَّاسِعُ قَالَ أَنَا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 133، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 133 (The Book of the Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 133، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
