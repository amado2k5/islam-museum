label: { ar: "الموطأ 464 — ابن عمر: المريض الذي لا يستطيع السجود يومئ برأسه", en: "Muwatta 464", es: "Muwatta 464", fr: "Muwatta 464", ur: "موطا 464", tr: "El-Muvatta 464 — İbn Ömer: Secde edemeyen hasta kişi başını hafifçe sallamalıdır.", id: "Al-Muwatta 464 — Ibn Umar: Orang sakit yang tidak dapat sujud hendaknya menganggukkan kepalanya" }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول إن المريض إذا لم يستطع السجود أومأ برأسه إيماءً ولم يرفع إلى جبهته شيئاً يسجد عليه؛ وهو في باب العمل في جامع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.238} {cite:muwatta-maruf-1997 p.239}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Abdullah ibn Umar'ın, hasta bir kişi secdeye yetişemiyorsa başını hafifçe sallaması ve secde etmek için alnına hiçbir şey koymaması gerektiğini söylediği belirtilmiştir. Bu, namaz külliyatının ameller bölümünde yer almaktadır. Editör, bunun Malik'ten Ebu Mus'ab ve Suwaid tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.238} {cite:muwatta-maruf-1997 s.239}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’ menyatakan bahwa Abdullah ibn Umar biasa mengatakan bahwa jika orang sakit tidak mampu sujud, ia hendaknya menganggukkan kepalanya dan tidak menggunakan sesuatu pun sebagai alas sujud. Hal ini terdapat dalam bab tentang amalan dalam kumpulan doa. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab dan Suwaid. {cite:muwatta-maruf-1997 p.238} {cite:muwatta-maruf-1997 p.239}"
