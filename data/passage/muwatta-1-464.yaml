  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول إن المريض إذا لم يستطع السجود أومأ برأسه إيماءً ولم يرفع إلى جبهته شيئاً يسجد عليه؛ وهو في باب العمل في جامع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.238} {cite:muwatta-maruf-1997 p.239}"
