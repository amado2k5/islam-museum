label: { ar: "الموطأ 2734 — مالك: صبغ الشعر بالسواد لم يثبت فيه شيء معلوم وغيره أحب إليه", en: "Muwatta 2734", es: "Muwatta 2734", fr: "Muwatta 2734", ur: "موطا 2734", tr: "El-Muvatta 2734 — Malik: Saçı siyaha boyamanın kesin bir hükmü yoktur ve o diğer renkleri tercih eder.", id: "Al-Muwatta 2734 — Malik: Mewarnai rambut menjadi hitam tidak memiliki hukum yang baku, dan dia lebih menyukai warna lain." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في صبغ الشعر بالسواد: لم أسمع في ذلك شيئا معلوما، وغير ذلك من الصبغ أحب إليّ. {cite:muwatta-maruf-1997 p.539}"
  tr: "Yahya şöyle dedi: Malik'in saçı siyaha boyama konusunda şöyle dediğini duydum: Bu konuda kesin bir şey duymadım ve ben diğer boyama yöntemlerini tercih ederim. {cite:muwatta-maruf-1997 s.539}"
  id: "Yahya berkata: Saya mendengar Malik mengatakan mengenai pewarnaan rambut hitam: Saya belum mendengar sesuatu yang pasti tentang itu, dan saya lebih menyukai jenis pewarnaan lain. {cite:muwatta-maruf-1997 p.539}"
