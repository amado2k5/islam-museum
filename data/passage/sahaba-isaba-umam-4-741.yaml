text: "أزواج النبى لِعِ ٬،، أشراف بنى أسد،،،، أشراف أهل العراق،،،،،، أشراف أهل الكوفة أشراف الكوفة،،،، أشراف ثقيف أسارى بدر،، أشراف جذام أسارى بنى قريظة، أشراف الصحابة أسارى بنى قينقاع أشراف عبد القيس، أسارى المسلمين أشراف العرب أساورة كسرى أشراف قريش،،،، …"
