text: "أزواج النبى لِعِ ٬،، أشراف بنى أسد،،،، أشراف أهل العراق،،،،،، أشراف أهل الكوفة أشراف الكوفة،،،، أشراف ثقيف أسارى بدر،، أشراف جذام أسارى بنى قريظة، أشراف الصحابة أسارى بنى قينقاع أشراف عبد القيس، أسارى المسلمين أشراف العرب أساورة كسرى أشراف قريش،،،، …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 4، ص 741، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
