text: "حَدَّثَنَا عَلِيٌّ، حَدَّثَنَا يَحْيَى، وَزَادَ، قَالَتْ عَائِشَةُ لَدَدْنَاهُ فِي مَرَضِهِ فَجَعَلَ يُشِيرُ إِلَيْنَا أَنْ لاَ تَلُدُّونِي فَقُلْنَا كَرَاهِيَةُ الْمَرِيضِ لِلدَّوَاءِ. فَلَمَّا أَفَاقَ قَالَ \" أَلَمْ أَنْهَكُمْ أَنْ تَلُدُّونِي \". قُلْنَا كَرَاهِيَةَ الْمَرِيضِ لِلدَّوَاءِ. فَقَالَ \" لاَ يَبْقَى أَحَدٌ فِي الْبَيْتِ إِلاَّ لُدَّ ـ وَأَنَا أَنْظُرُ ـ إِلاَّ الْعَبَّاسَ، فَإِنَّهُ لَمْ يَشْهَدْكُمْ \". رَوَاهُ ابْنُ أَبِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4458، يذكر اللدود والسعوط، والمرض والمريض، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4458 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions medicine given by the mouth-side or the nose, illness and the sick, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4458، جس میں لدود اور سعوط، بیماری اور بیمار، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
