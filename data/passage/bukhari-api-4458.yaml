label: { ar: "صحيح البخاري 4458 — اللدود والسعوط، المرض والمريض", en: "Sahih al-Bukhari 4458 — medicine given by the mouth-side or the nose; illness and the sick", ur: "صحیح بخاری 4458 — لدود اور سعوط، بیماری اور بیمار", es: "Sahih al-Bukhari 4458 — Medicina administrada por vía oral o nasal; enfermedad y enfermos", fr: "Sahih al-Bukhari 4458 — Médecine administrée par voie orale ou nasale; maladie et malades", tr: "Sahih el-Buhari 4458 — Kurt ve enfiye, hastalık ve hasta", id: "Sahih al-Bukhari 4458 — Cacing dan tembakau kunyah, penyakit dan pasien" }
text: "حَدَّثَنَا عَلِيٌّ، حَدَّثَنَا يَحْيَى، وَزَادَ، قَالَتْ عَائِشَةُ لَدَدْنَاهُ فِي مَرَضِهِ فَجَعَلَ يُشِيرُ إِلَيْنَا أَنْ لاَ تَلُدُّونِي فَقُلْنَا كَرَاهِيَةُ الْمَرِيضِ لِلدَّوَاءِ. فَلَمَّا أَفَاقَ قَالَ \" أَلَمْ أَنْهَكُمْ أَنْ تَلُدُّونِي \". قُلْنَا كَرَاهِيَةَ الْمَرِيضِ لِلدَّوَاءِ. فَقَالَ \" لاَ يَبْقَى أَحَدٌ فِي الْبَيْتِ إِلاَّ لُدَّ ـ وَأَنَا أَنْظُرُ ـ إِلاَّ الْعَبَّاسَ، فَإِنَّهُ لَمْ يَشْهَدْكُمْ \". رَوَاهُ ابْنُ أَبِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4458، يذكر اللدود والسعوط، والمرض والمريض، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4458 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions medicine given by the mouth-side or the nose, illness and the sick, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4458، جس میں لدود اور سعوط، بیماری اور بیمار، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4458 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona la medicina administrada por vía oral o nasal, la enfermedad y los enfermos, y el medicamento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4458 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne l'administration de médicaments par voie orale ou nasale, les maladies et les malades, ainsi que les médicaments. Le navigateur de données médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4458 numaralı hadis, infüzyonlardan, burun damlalarından, hastalıktan, hasta kişiden ve ilaçtan bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4458, menyebutkan tentang infus, tetes hidung, penyakit, orang sakit, dan obat-obatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
