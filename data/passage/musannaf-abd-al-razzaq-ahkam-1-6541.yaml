text: "… من يجب عليه شهود الجمعة ما يجب على الذي يسلم من يجب عليه التكفير العبد وما يجب في ذلك يوجب ما يوجب الغسل الطهور وغيره أوجب ما أوجب الانصات يوم الجمعة واجب وجوب من نذر أن ينحر في موضع ونهى …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 6541، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 6541, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed, what must be done; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 6541 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے، جو واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de 'Abd al-Razzaq, volume numérisé 1, p. 6541, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable, ce qui doit être fait ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
