  tr: "Musannaf Abd al-Razzaq'ın Resimli Cilt 1, s. 6541'inden bir alıntı; farz olan fiilleri, görevleri ve sorumlu kişiden beklenenleri belirtmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf Abd al-Razzaq, Jilid Bergambar 1, hlm. 6541, yang menyebutkan amalan wajib, kewajiban, dan apa yang dituntut dari orang yang bertanggung jawab. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
