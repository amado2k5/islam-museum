label: { ar: "الموطأ 225 — عروة يقرأ خلف الإمام فيما لا يجهر فيه", en: "Muwatta 225", es: "Muwatta 225", fr: "Muwatta 225", ur: "موطا 225", tr: "El-Muvatta 225 — Urve, imamın sesli okumadığı namazlarda imamın arkasından okur.", id: "Al-Muwatta 225 — Urwah membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras." }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة أن أباه عروة كان يقرأ خلف الإمام فيما لا يجهر فيه الإمام بالقراءة؛ وهو في باب القراءة خلف الإمام فيما لا يجهر فيه بالقراءة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.138}"
  tr: "Malik'in Hişam ibn Urve'den rivayet ettiği bir hadiste, babası Urve'nin imamın sesli okumadığı namazlarda imamın arkasından okuduğu belirtilmektedir; bu, imamın sesli okumadığı namazlarda imamın arkasından okuma konusuna girmektedir. Editör, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.138}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah menyatakan bahwa ayahnya, Urwah, biasa membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras; ini termasuk dalam bab tentang membaca di belakang imam dalam salat di mana imam tidak membaca dengan suara keras. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.138}"
