label: { ar: "صحيح البخاري 1390.2 — دفن وقبر ومرقد", en: "Sahih al-Bukhari 1390.2 — a burial, grave or resting place", ur: "صحیح بخاری 1390.2 — تدفین، قبر اور مرقد" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ مُقَاتِلٍ، أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ سُفْيَانَ التَّمَّارِ، أَنَّهُ حَدَّثَهُ أَنَّهُ، رَأَى قَبْرَ النَّبِيِّ مُسَنَّمًا."
summary:
  ar: "حديث في صحيح البخاري، رقم 1390.2، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1390.2 (Funerals (Al-Janaa'iz)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 1390.2، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
