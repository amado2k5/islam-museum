label: { ar: "صحيح مسلم 4011 — الحجامة", en: "Sahih Muslim 4011 — cupping", ur: "صحیح مسلم 4011 — حجامہ", es: "Sahih Muslim 4011 — Ventosaterapia", fr: "Sahih Muslim 4011 — la ventousothérapie", tr: "Sahih Muslim 4011 — Hacamat", id: "Sahih Muslim 4011 — Bekam" }
text: "وَحَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ الْقَطَّانُ، عَنْ مُحَمَّدِ بْنِ يُوسُفَ، قَالَ سَمِعْتُ السَّائِبَ بْنَ يَزِيدَ، يُحَدِّثُ عَنْ رَافِعِ بْنِ خَدِيجٍ، قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ \" شَرُّ الْكَسْبِ مَهْرُ الْبَغِيِّ وَثَمَنُ الْكَلْبِ وَكَسْبُ الْحَجَّامِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4011، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 4011 (The Book of Musaqah), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 4011، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 4011 (El Libro de Musaqah), menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 4011 (Livre de Musaqah), mentionne la pratique des ventouses. Le dictionnaire en ligne Medicine Browser le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 4011 numaralı hadiste hacamat uygulamasından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4011, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
