text: "فَلَمْ يَكُ يَنفَعُهُمْ إِيمَـٰنُهُمْ لَمَّا رَأَوْا۟ بَأْسَنَا ۖ سُنَّتَ ٱللَّهِ ٱلَّتِى قَدْ خَلَتْ فِى عِبَادِهِۦ ۖ وَخَسِرَ هُنَالِكَ ٱلْكَـٰفِرُونَ"
text_search: "فلم يك ينفعهم إيمانهم لما رأوا بأسنا ۖ سنت الله التي قد خلت في عباده ۖ وخسر هنالك الكافرون"
translations:
  en: { text: "But their faith could not avail them when they saw Our doom. This is Allah's law which hath ever taken course for His bondmen. And then the disbelievers will be ruined.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "لیکن جب وہ ہمارا عذاب دیکھ چکے (اس وقت) ان کے ایمان نے ان کو کچھ بھی فائدہ نہ دیا۔ (یہ) خدا کی عادت (ہے) جو اس کے بندوں (کے بارے) میں چلی آتی ہے۔ اور وہاں کافر گھاٹے میں پڑ گئے", translator: "Fateh Muhammad Jalandhari", license: PD }
