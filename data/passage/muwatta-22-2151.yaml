label: { ar: "الموطأ 2151 — يحيى عن مالك عن زيد بن أسلم: قال رسول الله من غير دينه فاضربوا عنقه، ويرى مالك أن المقصود بذلك من خرج من الإسلام إلى غيره ممن يظهر ذلك، فيستتاب، فإن تاب وإلا قتل، ومن أسر الكفر وأعلن الإسلام لا تقبل توبته", en: "Muwatta 2151", es: "Muwatta 2151", fr: "Muwatta 2151", ur: "موطا 2151", tr: "El-Muvatta 2151 — Yahya, Malik'ten, o da Zeyd ibn Aslam'dan rivayetle: Allah'ın Resulü şöyle buyurdu: \"Kim dinini değiştirirse, boynunu vurun.\" Malik, bunun İslam'ı terk edip başka bir dine geçen ve bunu açıkça belli eden kimse için geçerli olduğuna inanır. Ona tövbe etme fırsatı verilir ve tövbe ederse bağışlanır; aksi takdirde öldürülür. Küfürünü gizleyip sonra İslam'ı ilan eden kimsenin tövbesi kabul edilmez.", id: "Al-Muwatta 2151 — Yahya, dari Malik, dari Zayd ibn Aslam: Rasulullah SAW bersabda, “Barangsiapa yang mengubah agamanya, penggallah lehernya.” Malik berpendapat bahwa ini merujuk kepada orang yang meninggalkan Islam untuk memeluk agama lain dan menyatakannya secara terang-terangan. Ia diberi kesempatan untuk bertaubat, dan jika ia bertaubat, ia akan diselamatkan; jika tidak, ia akan dibunuh. Sedangkan orang yang menyembunyikan kekafirannya dan kemudian menyatakan Islam, taubatnya tidak diterima." }
summary:
  ar: "قال يحيى: حدثنا مالك عن زيد بن أسلم أن رسول الله قال: من غير دينه فاضربوا عنقه. ويذكر المحقق أن جماعة رواة الموطأ رووه مرسلا، وأن ابن عبد البر رأى أن رواية موصولة عن نافع عن ابن عمر منكرة، وأن الحديث ثابت من حديث ابن عباس. وقال مالك في معناه: أن من خرج من الإسلام إلى غيره مثل الزنادقة ونحوهم، إذا ظهر عليهم قتلوا ولم يستتابوا، لأنه لا تعرف توبتهم، وأما من خرج من الإسلام إلى غيره وأظهر ذلك فإنه يستتاب، فإن تاب وإلا قتل. {cite:muwatta-maruf-1997 p.279} {cite:muwatta-maruf-1997 p.280}"
  tr: "Yahya şöyle dedi: Malik, Zeyd ibn Aslam'dan rivayetle bize, Allah Resulü'nün şöyle buyurduğunu nakletti: \"Kim dinini değiştirirse, boynunu vurun.\" Araştırmacı, Muvatta'nın bir grup ravisinin bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak naklettiğini, İbn Abdülberr'in ise İbn Ömer'den rivayet edilen bağlantılı Nafi'nin rivayetini münker (reddedilmiş) saydığını ve hadisin İbn Abbas'ın rivayetinden sahih olduğunu belirtiyor. Malik, anlamı hakkında şöyle dedi: \"Kim İslam'ı terk edip başka bir dine geçerse, örneğin sapkınlar ve benzerleri gibi, eğer açığa çıkarsa öldürülür ve tövbe etme fırsatı verilmez, çünkü tövbesi bilinmez. Ama İslam'ı terk edip başka bir dine geçen ve bunu kamuoyuna açıklayana tövbe etme fırsatı verilir. Eğer tövbe ederse her şey yolundadır; aksi takdirde öldürülür.\" {cite:muwatta-maruf-1997 s.279} {cite:muwatta-maruf-1997 s.280}"
  id: "Yahya berkata: Malik meriwayatkan kepada kami dari Zaid bin Aslam bahwa Rasulullah SAW bersabda: “Barangsiapa yang mengubah agamanya, penggal lehernya.” Peneliti menyebutkan bahwa sekelompok perawi Muwatta’ meriwayatkan hadits ini sebagai mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa Ibnu Abd al-Barr menganggap riwayat yang terkait dari Nafi’ dari Ibnu Umar sebagai munkar (ditolak), dan bahwa hadits ini sahih menurut riwayat Ibnu Abbas. Malik berkata mengenai maknanya: “Barangsiapa yang meninggalkan Islam untuk memeluk agama lain, seperti kaum bid'ah dan sejenisnya, jika mereka ketahuan, mereka akan dibunuh dan tidak diberi kesempatan untuk bertaubat, karena taubat mereka tidak diketahui. Adapun orang yang meninggalkan Islam untuk memeluk agama lain dan mengumumkannya, ia diberi kesempatan untuk bertaubat. Jika ia bertaubat, maka semuanya baik-baik saja; jika tidak, ia akan dibunuh.” {kutip:muwatta-maruf-1997 hal.279} {kutip:muwatta-maruf-1997 hal.280}"
