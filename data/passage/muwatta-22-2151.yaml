label: { ar: "الموطأ 2151 — يحيى عن مالك عن زيد بن أسلم: قال رسول الله من غير دينه فاضربوا عنقه، ويرى مالك أن المقصود بذلك من خرج من الإسلام إلى غيره ممن يظهر ذلك، فيستتاب، فإن تاب وإلا قتل، ومن أسر الكفر وأعلن الإسلام لا تقبل توبته", en: "Muwatta 2151" }
summary:
  ar: "قال يحيى: حدثنا مالك عن زيد بن أسلم أن رسول الله قال: من غير دينه فاضربوا عنقه. ويذكر المحقق أن جماعة رواة الموطأ رووه مرسلا، وأن ابن عبد البر رأى أن رواية موصولة عن نافع عن ابن عمر منكرة، وأن الحديث ثابت من حديث ابن عباس. وقال مالك في معناه: أن من خرج من الإسلام إلى غيره مثل الزنادقة ونحوهم، إذا ظهر عليهم قتلوا ولم يستتابوا، لأنه لا تعرف توبتهم، وأما من خرج من الإسلام إلى غيره وأظهر ذلك فإنه يستتاب، فإن تاب وإلا قتل. {cite:muwatta-maruf-1997 p.279} {cite:muwatta-maruf-1997 p.280}"
