  سائرها قال ومن انحيل التى ابيض ظهرهالاغير والرحالة سرج من جلودليس فيه خشب
  كانوا يتخذونه للركض الشديد والجمع الرحائل قال عامى بن الطفيل
  الاظراب أسناخ الاسنان قاله
  ومقطع حلق الرحالة ساجج • بادنوا جذه عن الاظراب
  وقال عنترة اذلا أزال على رحالة سابح * نمدتعاوره الكماة مكلم
  المؤلف اه
  واذا عجل الرجل الى صاحبه بالشر قيل استقدمت رحالتك وأما ذول امرئ القيم يخاطب
  الحرج خشب يشتبعضه الى
  احرأة
  فاماترين فى رحالة جابر *على مرج كالقرّتخفق أكفانى
  بعض يحمل فيه الموتى عن
  فيقال اغما أراديه الحرج وليس ثمّ رحالة فى الحقيقة وهذا كمايقال جاءفلان على ناقة الحذاه
  الاصمعى" وهو المراد فى هذا البيت
  يعذون به النعل وجابراسم رجل غجار والمرحلة واحدة المراحل يقال بيني وبين كذامر حلة
  والمقز قال أبو عبيدهومى كب
  أو مرحلمتان خل لرخل بكسرانخاء الاننى من أولاد الضأن والذكرحل والجمع رخال
  للرجال بين الرحل والسرج وقال
  ورخال أيضا بالضم وقول الكميت ٢ مادعدع المترخل «يريد صاحب الرخال الذى
  غيره القرّاله ودج قاله المؤلف اه
  بريبها ( ذل لرذل الدون الخسيس وقد رذل فلات بالضم يرذل رذالة ورذولة فهورذل
  ورذال بالضم من قوم رذول وأرذال ورذلاء عن يعقوب وأرذله غسيره ورذله أيضافهو
  وَلَوولى الهوج السوائح بالذى
  مرذول. ورذال كل شرديثه سل ) شعررسل أى مسترسل وبعيررسل أى سهل
  السيروناقة رسلة وقولهم افعل كذا وكذا على رسلك بالكسر أى انتدفيه كما يقال على هيفتك
  ولينابه الخ اه
  ومنه الحديث الامن أعطى فى نجد تها ورساها ريد الشدة والرخاء يقول يعطى وهى معان
  حسان يشتد على مالكها اخراجها فتلك نجدتها ويعطى فى رسلها وهى مهازيل مقاربة
  والرسل أيضا اللبن وقد أرسل القوم أى صاراهم اللين من مواشبهم والرسل بالتحريك القطيع
  من الابل والغنم قال الراجز
  أقول للذالد خوّص برسل • انى أخاف النائبات بالأول
  والجمع الارسال قال الراجز
  ياذائديها خوصا بأرسال • ولاتذوداهاذياد الضلال
  ويقال جاءت انخيل أرسالا أى قطبعاقط .عا وراسله هراسلة فهو مر اسل ورسيل وامرأة
  مراسل وهى التي يموت زوجها أوأحست منه أنه يريد تطليقها فهى تزين لا خروتراسله
  ومنه قول جررٍ
  يمشي هبيرة بعد مقتل شيخه * مشى المراسل أوذنت بطلاق
  يقول ليس يطلب بدم أبيه وأرسلت فلانا فى رسالة فهومرسل ورسول والجمع رسل ورسل
  والمرسلات الرياح ويقال الملائكة والرسول أيضا الرسالة وقال
  ألا أبلغ أباعمرورسولا • بأنى عن فتاحسكم غنى
  ومنه قول كثير لقد كذب الواشون مايحت عندهم • بسرّ ولا أرسلتهم برسول
  وقوله تعالى انارسول رب العالمين ولم يقل رسل رب العالمين لان فعولا وفعيلا يسستوى فيمما.
  المذكر والمؤنث والواحد والجمع مثل عد ووصديق والمرسال سهم قصير والمرسال الشاقة
  السهلة السيروابل مراسيل ورسيل الرجل الذى يراله فى نضال أوغيره وقوام البعيروسال
  واسترسل الشعرأى صارسبطا واحتر سل اليه أى اجسط واستأذس ورسل فى قراءته أى اتأد
