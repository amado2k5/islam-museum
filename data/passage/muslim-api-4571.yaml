label: { ar: "صحيح مسلم 4571 — الأب والأبوة", en: "Sahih Muslim 4571 — the father and fatherhood", ur: "صحیح مسلم 4571 — باپ اور والدیت", es: "Sahih Muslim 4571 — El padre y la paternidad" }
text: "… بْنُ حَرْبٍ، حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، حَدَّثَنَا صَفْوَانُ بْنُ عَمْرٍو، عَنْ عَبْدِ، الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ عَنْ أَبِيهِ، عَنْ عَوْفِ بْنِ مَالِكٍ الأَشْجَعِيِّ، قَالَ خَرَجْتُ مَعَ مَنْ خَرَجَ مَعَ زَيْدِ بْنِ حَارِثَةَ فِي غَزْوَةِ مُؤْتَةَ وَرَافَقَنِي مَدَدِيٌّ مِنَ الْيَمَنِ. وَسَاقَ الْحَدِيثَ عَنِ النَّبِيِّ. بِنَحْوِهِ غَيْرَ أَنَّهُ قَالَ فِي الْحَدِيثِ قَالَ عَوْفٌ فَقُلْتُ يَا خَالِدُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4571، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4571 (The Book of Jihad and Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4571، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4571 (El Libro de la Yihad y las Expediciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
