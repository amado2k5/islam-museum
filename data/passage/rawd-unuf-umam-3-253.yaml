text: "… بن سَلَام، أنه قال : لمد وَحَدْتُ. صِفَهَا فى كتاب يَهُودَ بن يَعْقُوبَ الذى لم يدخل تبديلٌ، وأنه يقتل فيهاء قومٌ صالحون بجيثون يوم القيامة وسلاحُهم على عَوَاتِقِهم، وذكر الحديث.. وعُرُفَتْ حَرَّة زُهْرَةَ بَقَربةٍ كانت لِبَنى زُهْرَةَ قوم من اليهود، …"
