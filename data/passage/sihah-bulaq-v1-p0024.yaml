text: |-
  ٦١٧
  عليها ولما ببلغا كل جهدها • وقد أشعراها فى أظل ومد.ع
  الالات خشبات تبنى عليها الخيمة وتؤبن أى تنهم وتزن قول هزات فكأ نهاضرب عليها
  بالقداح فرج المعلى والرقيب فأخذ الهذا كله ثم قال ولم يلغا كل جهدها أى وفيها بقية وقوله
  وقد اشعراها أى وهذان القدحان قدائصل علهما بالاظل حتى دمى وبالعين-قدمعت من
  الاعياء ويقال قعقع فى الارض أى ذهب والق.اقع تنابع أصوات الرعد والقعاقع
  مواضع من بلادقيس والقعقاع طريق ياخذمن اليمامة الى الكوفة وطريق قعقاع لايلل
  الابمشقة ومنه قسل قرب قمقاع لانهم يجدّون فى السبروت رقعقاع أى يابس وقعقاع اسم
  رجل والقعقاع الحى النافض:ة.قع الاضراس قال مزرّد
  اذاذكرت سلى على الأى عادنى • نوائب قعقاع من الورد مردم
  وتقعقت ع_دهم أى ارة لوا قال برير تقعقع ضوأرضكم عمادى وفى المثل من
  يجتمع يتقعقع عمد٬كما يقال اذا ئم أمردنانقصه وقعيعان جبسل بمكة وهو اسم معرفة
  وبالاهوازجبل بقال له قصيقعان ومنه فحنت أساطين مسجد البصرة والقعقع بالضم طائر
  أبلق ضخم من طير البرّطويل المنقار والقعاع ماءمر غليظ بقال اقسع القوم اقعاعا اذا
  ١ مياه اللاسات كله اقعاع
  أنبداوه ١ فع . القنعة شئ شبيه بالزبي-ل بلاءروة يعمل من خوص ليس بالسكبير
  ١• كذا فى نسخة بالاصل
  رف الحديث ليت عند نامنه قفعة أوقفعتين يعتى من الجراد والقفعا شجر وأذن قفهاه كانها
  قوله وفى الحسديث الخ هومن
  أصابتها نار فانزوت والرجل القفع! التى ارتدت أصابعها الى القدم يقال وجل أقفع
  وامر أة قفعاء بينا القفع وقوم قفع الاص- بع ورج-لمقفع السدين والقلفع مثال اخنصر
  كلام سيدنا ع ررذى اللّه عنه آيي
  ما يتقلع ويتشقق من الطين اذا يبس واللام رائدة قال لراجز قلفع وروض شرب الدثانا
  ⁦( قلع)⁩ قلعت الشى واقتلعته فتقلع وانقلع والمقلوع الامير المعزول ودائرة القالع تسكون
  تحت اللبد وتكره والقلع شبه الكنف يكون فيه زاد الراعى وتواديه وأصرته قال الراجز
  باليت انى وتئ امانلتقى * وهوعلى ظهر البعير الاورق • وأنا فوق ذات غرب خيفق
  ثم اتقى وأى عَصر يبْقى • بعلبه وقلعه المعلق
  أى وأى زمان يتق وفى المثل شهمتى فى قامى والاقلاع عن الامر الكف عنه يقال أقاع
  فلان عما كان عليه وأقلعت عنه الحى ويقال تركت فلانا فى قلع وقلع من حاه يسكن ويحرك
  أى فى اقلاع من حاه والقاهان من بي غير صلاءة وشريح ابناه روبن -و يلفة بن عبدالله
  ابن الحرث بن غير قال
  رغبناءردماءبني قريع * الى القٰمين انهما اللباب
  واللمع أيضا اسمم دن ينسب اليه الرصاص الجيدوالقلعة الحصن على الجبل ومرج القلعة
  بالتحريك. وضع بال.ادية والقلعى سيف مذ- وب اليه قال الراجز
  محارف بالشاء والاباعر * مبارك بالقلعى الباتر
  والقلعة أبضا القطعة العظيمة من السهاب والمع قلع قال ابن أجر
  تاتأفوقه القلع السوارى • وجن الخازبازبه جنونا
  والقاح أيضاءصدرة ولك رحل قلع القدم بالكسراذا كانت قدمه لا تثبت عمد الصراع فهو
  جاح
