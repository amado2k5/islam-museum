label: { ar: "صحيح البخاري 3219 — الأحرف السبعة", en: "Sahih al-Bukhari 3219 — the seven ahruf", ur: "صحیح بخاری 3219 — سبعہ احرف", es: "Sahih al-Bukhari 3219 — los siete ahruf", fr: "Sahih al-Bukhari 3219 — les sept ahruf", tr: "Sahih el-Buhari 3219 — Yedi Harf", id: "Sahih al-Bukhari 3219 — Tujuh Huruf" }
text: "حَدَّثَنَا إِسْمَاعِيلُ، قَالَ حَدَّثَنِي سُلَيْمَانُ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ بْنِ مَسْعُودٍ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّ رَسُولَ اللَّهِ قَالَ \" أَقْرَأَنِي جِبْرِيلُ عَلَى حَرْفٍ، فَلَمْ أَزَلْ أَسْتَزِيدُهُ حَتَّى انْتَهَى إِلَى سَبْعَةِ أَحْرُفٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3219، يذكر الأحرف السبعة. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 3219 (Beginning of Creation), that mentions the seven ahruf. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 3219، جس میں سبعہ احرف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3219 (El comienzo de la creación), menciona los siete ahruf. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sahih al-Bukhari, n° 3219 (Commençon de la Création), mentionne les sept ahruf. Le catalogue du musée consacré à la lecture et à l'écriture du Coran les répertorie avec les textes du Coran, la Sunna, la Sira et les ouvrages traitant de ce sujet."
  tr: "Sahih el-Buhari'de 3219 numaralı hadis, Kur'an okumasının yedi farklı şeklinden bahsetmektedir. Bu derleme, Kur'an okumaları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okuma ve yazma üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3219, menyebutkan tujuh cara membaca Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, tulisan, kaligrafi, dan tanda diakritik, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
