label: { ar: "صحيح البخاري 5727 — ألبان الإبل وأبوالها", en: "Sahih al-Bukhari 5727 — camel milk and urine as treatment", ur: "صحیح بخاری 5727 — اونٹنی کا دودھ اور پیشاب" }
text: "… ضَرْعٍ، وَلَمْ نَكُنْ أَهْلَ رِيفٍ، وَاسْتَوْخَمُوا الْمَدِينَةَ فَأَمَرَ لَهُمْ رَسُولُ اللَّهِ بِذَوْدٍ وَبِرَاعٍ وَأَمَرَهُمْ، أَنْ يَخْرُجُوا فِيهِ فَيَشْرَبُوا مِنْ أَلْبَانِهَا وَأَبْوَالِهَا، فَانْطَلَقُوا حَتَّى كَانُوا نَاحِيَةَ الْحَرَّةِ، كَفَرُوا بَعْدَ إِسْلاَمِهِمْ، وَقَتَلُوا رَاعِيَ رَسُولِ اللَّهِ وَاسْتَاقُوا الذَّوْدَ فَبَلَغَ النَّبِيَّ فَبَعَثَ الطَّلَبَ فِي آثَارِهِمْ، وَأَمَرَ بِهِمْ فَسَمَرُوا أَعْيُنَهُمْ وَقَطَعُوا أَيْدِيَهُمْ وَتُرِكُوا فِي نَاحِيَةِ الْحَرَّةِ حَتَّى مَاتُوا عَلَى حَالِهِمْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5727، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5727 (Medicine), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5727، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
