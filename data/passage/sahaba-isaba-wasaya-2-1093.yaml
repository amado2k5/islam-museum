text: "تراجم الرجال حرف العين المهملة جويرية، قال: والله ما ترك رسول اللٰه للفيه عند موته ديناراً مَأْزُورَاتٍ. ولا درهماً... الحديث. أخرجه البُخَارِيّ وغيره. قلت: وهذا الحديث معروف من رواية. وروى عمرو أيضاً عن أخته جويرية، وعن ابن - عمرو بن …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1093، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 1093, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 1093 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Isaba de Ibn Hajar, volumen 2, pág. 1093, que menciona el lecho de muerte y las últimas horas, y lo que dejó tras de sí: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 2, p. 1093), évoquant un lit de mort et les dernières heures du défunt, ainsi que les biens et l'héritage laissés. Ce passage, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 1093. sayfasından bir alıntı, ölen kişinin ölüm zamanını ve vefatını, ayrıca mal varlığını ve mirasını ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak politikası gereği metin yaklaşık kırk kelimeyle sınırlıdır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 2, halaman 1093, menyebutkan waktu kematian dan wafatnya almarhum, serta harta warisan dan harta pusakanya. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan sumber. Kutipan ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
