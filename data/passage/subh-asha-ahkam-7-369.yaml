text: "… تجعل فى الحَبْل وتكون فى عُنُق البهيمة أو يَدِها تُمْسِكها، والمراد هنا نَقْضُ العهد واستعار الأكلَ لذلك، لأن البهيمة إذا أكلتِ الِّبقةَ خلَصَتْ من الشدّ. و الرِبوة بكسر الراء الزيادة، والمرادهنا الزيادة فى الفريضةِ الواجبةِ عليه كالعقوبةِ له. الزيادة من …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 7، ص 369، يرد فيه ذكر الفريضة والفرائض، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 7, p. 369, whose wording mentions the obligation (farida), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 7، ص 369 کا اقتباس جس میں فریضہ اور فرائض، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subh al-A'sha de al-Qalqashandi, volume numérisé 7, p. 369, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen digitalizado 7, p. 369, cuyo texto menciona la obligación (farida), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kalkaşandi'nin Subh el-A'şa adlı eserinin 7. resimli cildinin 369. sayfasından, farz olan amelleri ve görevleri anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Subh al-A'sha karya al-Qalqashandi, jilid bergambar 7, halaman 369, yang menyebutkan amalan dan kewajiban wajib; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
