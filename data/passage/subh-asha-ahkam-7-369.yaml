text: "… تجعل فى الحَبْل وتكون فى عُنُق البهيمة أو يَدِها تُمْسِكها، والمراد هنا نَقْضُ العهد واستعار الأكلَ لذلك، لأن البهيمة إذا أكلتِ الِّبقةَ خلَصَتْ من الشدّ. و الرِبوة بكسر الراء الزيادة، والمرادهنا الزيادة فى الفريضةِ الواجبةِ عليه كالعقوبةِ له. الزيادة من …"
