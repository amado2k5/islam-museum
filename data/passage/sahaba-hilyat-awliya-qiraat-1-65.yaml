text: "… جناح القاضى ثنا اسحاق بن محمد بن مروان ثنا أبى ثنا عباس بن عبيد اللّٰه ثنا غالب بن عثمان الهمدانى - أبو مالك - عن عبيدة من شقيق عن عبد اللّٰه بن مسعود. قال : إن القرآن أنزل على سبعة …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 65، يذكر الأحرف السبعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 65, that mentions the seven ahruf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 65 کا اقتباس جس میں سبعہ احرف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 1, pág. 65, que menciona los siete ahruf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Hilyat al-Awliya' d'Abu Nu'aym, volume 1, page 65, mentionne les sept ahruf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le guide du musée sur la lecture et l'écriture du Coran."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 1. resimli cildinin 65. sayfasından, yedi harften bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid 1 bergambar, halaman 65, yang menyebutkan tujuh huruf; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
