text: "… سليمان. كتاب أبى على الجبائى. كتاب أبى الهذيل العلاف الكتب المؤلفة فى هجاء المصاحف كتاب يحي بن الحارث. كتاب ابن شبيب. كتاب أحمد بن ابراهيم الوراق الكتب المؤلفة فى مقطوع القرآن وموصوله كتاب الكسانى. كتاب حمزة بن حبيب كتاب عبداللّه …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 2، ص 67، يذكر القراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 2, p. 67, that mentions the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 2، ص 67 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 2, pág. 67, que menciona a los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Fihrist d'Ibn al-Nadim (tome 2, p. 67) mentionnant les lecteurs, la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Nadim'in Fihrist adlı eserinin resimli 2. cildinin 67. sayfasından, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını, ayrıca Kur'an'ın yazımını ele alan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazımı, alfabesi ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, jilid 2 bergambar, halaman 67, yang menyebutkan para qari, penyusunan Al-Qur'an dan manuskripnya, serta ortografi Al-Qur'an; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, ortografi, aksara, dan diakritik."
