text: "… بْنِ رَجَاءٍ، قَالَ سَمِعْتُ أَوْسَ بْنَ ضَمْعَجٍ، قَالَ سَمِعْتُ أَبَا مَسْعُودٍ، يَقُولُ قَالَ رَسُولُ اللَّهِ ـ \" يَؤُمُّ الْقَوْمَ أَقْرَؤُهُمْ لِكِتَابِ اللَّهِ، فَإِنْ كَانَتْ قِرَاءَتُهُمْ سَوَاءً، فَلْيَؤُمَّهُمْ أَقْدَمُهُمْ هِجْرَةً، فَإِنْ كَانَتِ الْهِجْرَةُ سَوَاءً، فَلْيَؤُمَّهُمْ أَكْبَرُهُمْ سِنًّا، وَلاَ يُؤَمَّ الرَّجُلُ فِي أَهْلِهِ وَلاَ فِي سُلْطَانِهِ، وَلاَ يُجْلَسْ عَلَى تَكْرِمَتِهِ فِي بَيْتِهِ، إِلاَّ بِإِذْنٍ، أَوْ بِإِذْنِهِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 980، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Ibn Majah, no. 980 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 980، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 980 (Establecimiento de la oración y la Sunnah al respecto), menciona a los lectores. El explorador del museo sobre cómo se leía y escribía el Corán lo enumera junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sunan Ibn Majah, n° 980 (Établissement de la prière et de la Sunna à leur sujet), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce texte avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "İbn Majah'ın Sünen'inde yer alan 980 numaralı hadiste, Kur'an okuyucularından bahsedilir. Bu hadis, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 980, menyebutkan para pembaca Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, tulisan, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
