label:
  ar: "مسلم 2684 — إذا أحب عبدي لقائي أحببت لقاءه"
  en: "Muslim 2684 — When My servant loves to meet Me, I love to meet him"
  ur: "مسلم 2684 — جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں"
text: "من أحب لقاء الله أحب الله لقاءه ومن كره لقاء الله كره الله لقاءه . فقلت يا نبي الله أكراهية الموت فكلنا نكره الموت فقال ليس كذلك ولكن المؤمن إذا بشر برحمة الله ورضوانه وجنته أحب لقاء الله فأحب الله …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2684: إذا أحب عبدي لقائي أحببت لقاءه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2684: When My servant loves to meet Me, I love to meet him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2684: جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
