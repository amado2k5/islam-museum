ref: "2684"
label:
  ar: "مسلم 2684 — إذا أحب عبدي لقائي أحببت لقاءه"
  en: "Muslim 2684 — When My servant loves to meet Me, I love to meet him"
  ur: "مسلم 2684 — جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں"
  es: "Musulmán 2684 — Cuando mi siervo desea encontrarse conmigo, yo también deseo encontrarme con él."
  fr: "Muslim 2684 — Quand Mon serviteur aime Me rencontrer, J'aime le rencontrer."
  tr: "Müslim 2684 — Eğer kulum benimle buluşmayı arzu ederse, ben de onunla buluşmayı arzu ederim."
  id: "Muslim 2684 — Jika seorang hamba-Ku senang bertemu dengan-Ku, maka Aku pun senang bertemu dengannya."
text: "من أحب لقاء الله أحب الله لقاءه ومن كره لقاء الله كره الله لقاءه . فقلت يا نبي الله أكراهية الموت فكلنا نكره الموت فقال ليس كذلك ولكن المؤمن إذا بشر برحمة الله ورضوانه وجنته أحب لقاء الله فأحب الله …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2684: إذا أحب عبدي لقائي أحببت لقاءه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2684: When My servant loves to meet Me, I love to meet him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2684: جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2684: Cuando Mi siervo desea encontrarse conmigo, Yo deseo encontrarme con él. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2684: « Quand Mon serviteur désire Me rencontrer, Je désire le rencontrer. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Müslim'de 2684 numaralı hadis-i kudsi şöyledir: \"Kulum benimle buluşmayı isterse, ben de onunla buluşmayı isterim.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2684: “Jika seorang hamba-Ku mencintai untuk bertemu dengan-Ku, maka Aku pun mencintai untuk bertemu dengannya.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan Al-Muwatta."
