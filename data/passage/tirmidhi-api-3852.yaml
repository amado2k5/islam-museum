text: "… فَبَاعَ بَعِيرَهُ مِنَ النَّبِيِّ وَاشْتَرَطَ ظَهْرَهُ إِلَى الْمَدِينَةِ يَقُولُ جَابِرٌ لَيْلَةَ بِعْتُ مِنَ النَّبِيِّ الْبَعِيرَ اسْتَغْفَرَ لِي خَمْسًا وَعِشْرِينَ مَرَّةً وَكَانَ جَابِرٌ قَدْ قُتِلَ أَبُوهُ عَبْدُ اللَّهِ بْنُ عَمْرِو بْنِ حَرَامٍ يَوْمَ أُحُدٍ وَتَرَكَ بَنَاتٍ فَكَانَ جَابِرٌ يَعُولُهُنَّ وَيُنْفِقُ عَلَيْهِنَّ وَكَانَ النَّبِيُّ يَبَرُّ جَابِرًا وَيَرْحَمُهُ لِسَبَبِ ذَلِكَ هَكَذَا رُوِيَ فِي حَدِيثٍ عَنْ جَابِرٍ نَحْوُ هَذَا."
summary:
  ar: "حديث في جامع الترمذي، رقم 3852، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3852 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3852، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3852 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3852 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
