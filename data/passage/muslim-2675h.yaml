label:
  ar: "مسلم 2675h — أنا عند ظن عبدي بي وأنا معه إذا ذكرني"
  en: "Muslim 2675h — I am as My servant thinks of Me, and I am with him when he remembers Me"
  ur: "مسلم 2675h — میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں"
text: "قال الله عز وجل أنا عند ظن عبدي بي وأنا معه حيث يذكرني والله لله أفرح بتوبة عبده من أحدكم يجد ضالته بالفلاة ومن تقرب إلى شبرا تقربت إليه ذراعا ومن تقرب إلى ذراعا تقربت إليه باعا وإذا أقبل إلى …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2675h: أنا عند ظن عبدي بي وأنا معه إذا ذكرني. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2675h: I am as My servant thinks of Me, and I am with him when he remembers Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2675h: میں اپنے بندے کے گمان کے ساتھ ہوں اور جب وہ مجھے یاد کرے میں اس کے ساتھ ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
