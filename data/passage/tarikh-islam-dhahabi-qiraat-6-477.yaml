text: "اختلفتُم أنتم وزيد في عربيّةٍ فاكتُبُوها بلسان قريش، فإنّ القرآنَ إنّما نزل بلسانهم. ففعلوا حتّى كُتِبَت المصاحف، ثمّ ردّ عثمان الصُّحُف إلى حَفْصَة، وأرسل إلى كل جُنْدٍ من أجناد المسلمين بمُصْحَفٍ، وأمرهم أن يحرقوا كلّ مُصْحَفٍ يخالف المُصْحف الذي أرسل …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 477، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 477, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 477 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 6, pág. 477, que menciona la colección del Corán y los códices, la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 6, page 477, mentionne la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
