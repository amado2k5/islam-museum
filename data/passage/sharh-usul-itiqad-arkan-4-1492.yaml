text: "… باللَّه وجهاد في سبيل اللَّه... جواب لسؤال إيمان باللَّه ورسوله وجهاد في سبيل اللَّه... جواب لسؤال الإيمان باللَّه ورسوله... جواب لسؤال الإيمان بضع وسبعون أفضلها الإيمان بضع وستون أو... الإيمان بضع وستون أو... الإيمان بضع وستون شعبة الإيمان ثلاثمائة وثلاث …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 1492، يذكر الإيمان بضع وسبعون شعبة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 4, p. 1492, that mentions faith as seventy-odd branches, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 4، ص 1492 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 4, pág. 1492, que menciona la fe como setenta y tantos pilares, uno de los artículos de fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 4, p. 1492), mentionnant la foi comme une soixantaine de branches, un des articles de foi. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 4. cildinin 1492. sayfasından bir alıntı, yetmişten fazla inanç dalından ve inancın rükünlerinden birinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın rükünleri, inancın rükünleri, inanç dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 4, halaman 1492, menyebutkan lebih dari tujuh puluh cabang iman dan salah satu rukun iman. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
