label: { ar: "الموطأ 1052 — مالك في رجل قدم معتمراً في أشهر الحج حتى إذا قضى عمرته أهل بالحج من مكة، ثم كسر أو أصابه أمر لا يقدر على حضور الموقف: يقيم حتى إذا برئ خرج إلى الحل ثم رجع فطاف وسعى ثم حل، وعليه حج قابل والهدي", en: "Muwatta 1052" }
summary:
  ar: "قال مالك في رجل قدم معتمراً في أشهر الحج، حتى إذا قضى عمرته أهل بالحج من مكة، ثم كُسر أو أصابه أمر لا يقدر معه على حضور الموقف مع الناس: أرى أن يقيم حتى إذا برئ خرج إلى الحل، ثم يرجع إلى مكة فيطوف بالبيت ويسعى بين الصفا والمروة، ثم يحل، وعليه حج قابل والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1170). {cite:muwatta-maruf-1997 p.487}"
