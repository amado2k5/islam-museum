label: { ar: "الموطأ 1052 — مالك في رجل قدم معتمراً في أشهر الحج حتى إذا قضى عمرته أهل بالحج من مكة، ثم كسر أو أصابه أمر لا يقدر على حضور الموقف: يقيم حتى إذا برئ خرج إلى الحل ثم رجع فطاف وسعى ثم حل، وعليه حج قابل والهدي", en: "Muwatta 1052", es: "Muwatta 1052", fr: "Muwatta 1052", ur: "موطا 1052", tr: "El-Muvatta 1052 — Malik, Hac aylarında Umre yapmak için Mekke'ye gelen ve Umresini tamamladıktan sonra Hac için Mekke'den ihrama giren, sonra bacağı kırılan veya Arafat'ta nöbet tutmasına engel olan bir şey olan bir adam hakkında şöyle demiştir: İyileşene kadar orada kalır, sonra Haram sınırının dışındaki bölgeye gider, sonra geri döner ve Tavaf ve Sa'i yapar, sonra ihramdan çıkar ve ertesi yıl Hac yapmalı ve kurban kesmelidir." }
summary:
  ar: "قال مالك في رجل قدم معتمراً في أشهر الحج، حتى إذا قضى عمرته أهل بالحج من مكة، ثم كُسر أو أصابه أمر لا يقدر معه على حضور الموقف مع الناس: أرى أن يقيم حتى إذا برئ خرج إلى الحل، ثم يرجع إلى مكة فيطوف بالبيت ويسعى بين الصفا والمروة، ثم يحل، وعليه حج قابل والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1170). {cite:muwatta-maruf-1997 p.487}"
  tr: "Malik, Hac aylarında Umre için Mekke'ye gelen ve Umresini tamamladıktan sonra Hac için Mekke'den ihrama giren, ancak Arafat'ta insanlarla birlikte bulunmasını engelleyen bir sakatlık veya başka bir olay yaşayan bir adam hakkında şöyle demiştir: \"İyileşene kadar orada kalmalı, sonra Haram sınırının dışına çıkmalı, ardından Mekke'ye dönmeli ve Kâbe etrafında tavaf ve Safa ile Merve arasında Sa'i yapmalı, sonra ihramdan çıkmalıdır. Ertesi yıl Hac yapması ve kurban kesmesi zorunludur.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1170) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.487}"
  id: "Malik berkata mengenai seorang pria yang datang ke Mekah untuk Umrah selama bulan-bulan Haji, dan setelah menyelesaikan Umrahnya ia memasuki Ihram untuk Haji dari Mekah, kemudian mengalami cedera atau sesuatu yang mencegahnya hadir di Arafat bersama orang-orang: Saya percaya dia harus tinggal sampai sembuh, kemudian keluar dari batas Haram, kemudian kembali ke Mekah dan melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa, kemudian keluar dari Ihram. Dia wajib melaksanakan Haji tahun berikutnya dan mempersembahkan hewan kurban. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1170). {cite:muwatta-maruf-1997 p.487}"
