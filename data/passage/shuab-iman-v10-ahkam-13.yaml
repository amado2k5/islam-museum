text: "… أن ترفع السلاح على إمامك. قال الحليمي : والإمام العادل طاعته واجبة، ومخالفته حرام، والثبات على عهده وعقده فرض، وأما الجائر فمن قال: إن الفسق لا يناقض الإمامة، احتج بظواهر هذه الأخبار، وقال : إنها نطقت بإيجاب الطاعة للعادل والجائر، …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 13، يرد فيه ذكر الفرض، والواجب، والوجوب، والحرام، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 13, whose wording mentions the obligatory (fard), the obligatory (wajib), obligation (wujub), the forbidden (haram), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
