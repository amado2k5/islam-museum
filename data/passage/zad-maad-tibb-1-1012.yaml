  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1012, that mentions kohl for the eye, a complaint of an ailment, named diseases, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
