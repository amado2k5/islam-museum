text: |-
  •⁦(فصل الرام)⁩,,
  رفف)
  ٢٧
  فى الجاهلية والردافة أن يجلس الملك ويجلس الردف عن يمينه فاذ اشرب الملك شرب الردف
  قبل الناس واذا غزا الملك قعد الردف فى موضعه وكان خليفقه عسلى الناس حتى يتصرف
  واذا عادت كتيبة الملك أخذ الردف المرباع وكانت الردافة فى الجاهلية لبنى يربوع لائه
  لم يكن فى العرب أحدأ كثرغارة على م-لوك الحيرة من بنى يربوع فصالحوهم على أن جعلوا
  اهم الردافة ويكفواعن أهل العراق الغارة قال جريروه ومن بن يريوع
  وبعذا ورادفنا الملوك فظللوا * وطاب الاحاليب النمام المنزعا
  وطاب جع وطب اللبن والردف الكفل والعجز والرديف المرتدف والجمع رداف والرديف
  نجم قريب من النسر الواقع والرديف النجم الذى ينوءمن المشرق اذا غاب رقيبه فى المغرب
  وردفه بالكسر أى تبعه يقال كان نزل بهم أمر فردف لهم آخر أعظم منه قال تعالى تتبعها
  الرادفة والروادف رواكيب النخلة والردافى على فعالى بالضم الحداة والاعوان لانه اذا
  أعيا أحدهم خلفه الآخر قال لبيد
  عذافرة تقمص بالردافى • تخوّخا نزولى وارتحالى
  وأردفه أمرلغة فى ردفه مثل تبعه وأتبعه بمعنى قال خزيمة بن مالك بن نهد
  اذا الجوزا أردفت النريا • ظنفت بال فاطمة الظنونا
  يعنى فاطمسة بنت يذكر بن عنزة أحد القارظين وأردفت النجوم أى توالت ومرادفة
  لجرادر كوب الذكر الانثى والشالث عليه-ما ويقال هذه دابة لاترادف أى لا تحم-ل رديفا
  والارتداف الاستدبار يقال أتينا فلا نافار تدفناه اى أخذناه من ورائه أخذا عن السكسائى
  واستردفه أى سأله أن يردفه والترادف التتابع قال الاصمعىّ تعاونوا عليه وترادفوابمعنى
  ⁦( رسف)⁩ الرسفان.شى المقيد وقدرسف يرسف ورسف رسفاورسفانا وحكى أبوزيد
  أرسفت الابل أى لطردتها مقيدة شف الرشف المص وقد رشفه يرشفه ويرشقه
  وارتشفه أى امتصه وفى المثل الرشف أنقع أى اذا ترشفت الماه قليلا قليلا كان أسكن
  للعطش والرشوف المرأة الطيبة الفم صف ، الرصفة بالتحريك واحدة الرصف وهى
  حجارة مر صوف:«ضها الى بعض قال العجاج* من رصف نازع س-يلارصفا * يقول مزج
  اذا الشراب من ماء رصف نازع رصفا آخرلانه أصفى له وأرق مخذف الماء وهويريده
  فجعل مسيله من رصف الى رصف منازعة منه اياه والرصفة أيضا واحدة الرصاف وهى العقب
  الذى بلوى فوق الرعظ والرصف بالتسكين المصدر منهما جيها تقول رصفت الجارة فى البناه
  أرصفها رصفا اذاضممت بعضها الى عض ورصفت السهم رصفا اذاشددت على رعظه عتبا
  ومنه قول الراجز *وأربى سنخه مرصوف * ويقال هذا أمر لايرصف بك أى لا يليق
  ورصف قدميه أى ضم احداهما الى الاخرى وتراصف القوم فى الصف أى قام بعضهم الى
  لزق بعض والرصوف المرأة الضيقة الفرج وعمل رصيف وحواب رصيف أى محكم وصين
  ورصافتموضع ⁦(رضف)⁩ الرضف الحجارة المحماة يوغر بها اللبن واحدتهارضفة وفى
  المثل خذمن الرضفة ماعليها ورضفه يرضفه بالكسرأى كواه بالرضفة والرضيف اللبن يغلى
  بالرضفة وشواء مرضوف يشوى على الرضف والمرضوفة القدر أنضجت بالرجف
