label: { ar: "البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 166 — قراءات القرآن، جمع القرآن والمصاحف", en: "al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 166 — the readings of the Qur'an; the collection of the Qur'an and the codices", ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 166 — قرآن کی قراءتیں، جمعِ قرآن اور مصاحف", es: "Al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, escaneo del volumen 2, pág. 166 — las lecturas del Corán; la colección del Corán y los códices" }
text: "… قال القاضى أبو بكر فى الانتصار لم يقصد عثمان قصد أبى بكر فى جمع نفس القرآن بين لوحين وإنما قصد جمعهم على القراءات الثابتة المعروفة عن النبى عَلي وإلغاء ما ليس كذلك، وأخذهم بمصحف لا تقديم فيه ولا تأخير ولا …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 166، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 166, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 166 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, volumen 2, pág. 166, que menciona las lecturas del Corán, su recopilación y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
