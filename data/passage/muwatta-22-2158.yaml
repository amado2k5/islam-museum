label: { ar: "الموطأ 2158 — مالك عن يزيد بن عبد الله بن الهاد عن سليمان بن يسار عن عبد الله بن أبي أمية: امرأة توفي عنها زوجها فتزوجت بعد عدتها، فولدت لأقل من ستة أشهر، فدعا عمر نسوة من نساء الجاهلية فأخبرته إحداهن أن الولد لأول الزوجين", en: "Muwatta 2158" }
summary:
  ar: "يروي مالك عن يزيد بن عبد الله بن الهاد عن محمد بن إبراهيم بن الحارث التيمي عن سليمان بن يسار عن عبد الله بن أبي أمية أن امرأة هلك عنها زوجها، فاعتدت أربعة أشهر وعشرا، ثم تزوجت حين حلت، فمكثت عند زوجها أربعة أشهر ونصف شهر، ثم ولدت ولدا تاما، فجاء زوجها إلى عمر بن الخطاب فذكر ذلك له. فدعا عمر نسوة من نساء الجاهلية قدماء، فسألهن عن ذلك، فقالت امرأة منهن: أنا أخبرك عن هذه المرأة، هلك عنها زوجها حين حملت منه، فأهريقت عليه الدماء، فحش ولدها في بطنها، فلما أصابها زوجها الذي نكحها، وأصاب الولد الماء، تحرك الولد في بطنها وكبر. فصدقها عمر بن الخطاب، وفرق بينهما، وقال: أما إنه لم يبلغني عنكما إلا خير، وألحق الولد بالأول. {cite:muwatta-maruf-1997 p.283} {cite:muwatta-maruf-1997 p.284}"
