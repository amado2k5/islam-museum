label: { ar: "الموطأ 2158 — مالك عن يزيد بن عبد الله بن الهاد عن سليمان بن يسار عن عبد الله بن أبي أمية: امرأة توفي عنها زوجها فتزوجت بعد عدتها، فولدت لأقل من ستة أشهر، فدعا عمر نسوة من نساء الجاهلية فأخبرته إحداهن أن الولد لأول الزوجين", en: "Muwatta 2158", es: "Muwatta 2158", fr: "Muwatta 2158", ur: "موطا 2158", tr: "El-Muvatta 2158 — Malik, Yezid ibn Abdullah ibn el-Had'dan, o da Süleyman ibn Yasar'dan, o da Abdullah ibn Abi Umayya'dan rivayet eder: Kocası ölen bir kadın, bekleme süresinden sonra yeniden evlendi ve altı aydan kısa bir süre içinde bir çocuk doğurdu. Ömer, İslam öncesi dönemden bazı kadınları çağırdı ve onlardan biri çocuğun ilk kocasından olduğunu söyledi.", id: "Al-Muwatta 2158 — Malik, berdasarkan riwayat Yazid ibn Abdullah ibn al-Had, berdasarkan riwayat Sulayman ibn Yasar, berdasarkan riwayat Abdullah ibn Abi Umayya: Seorang wanita yang suaminya meninggal menikah lagi setelah masa iddahnya, dan melahirkan dalam waktu kurang dari enam bulan. Umar memanggil beberapa wanita dari zaman pra-Islam, dan salah seorang dari mereka mengatakan kepadanya bahwa anak itu adalah anak dari suami pertama." }
summary:
  ar: "يروي مالك عن يزيد بن عبد الله بن الهاد عن محمد بن إبراهيم بن الحارث التيمي عن سليمان بن يسار عن عبد الله بن أبي أمية أن امرأة هلك عنها زوجها، فاعتدت أربعة أشهر وعشرا، ثم تزوجت حين حلت، فمكثت عند زوجها أربعة أشهر ونصف شهر، ثم ولدت ولدا تاما، فجاء زوجها إلى عمر بن الخطاب فذكر ذلك له. فدعا عمر نسوة من نساء الجاهلية قدماء، فسألهن عن ذلك، فقالت امرأة منهن: أنا أخبرك عن هذه المرأة، هلك عنها زوجها حين حملت منه، فأهريقت عليه الدماء، فحش ولدها في بطنها، فلما أصابها زوجها الذي نكحها، وأصاب الولد الماء، تحرك الولد في بطنها وكبر. فصدقها عمر بن الخطاب، وفرق بينهما، وقال: أما إنه لم يبلغني عنكما إلا خير، وألحق الولد بالأول. {cite:muwatta-maruf-1997 p.283} {cite:muwatta-maruf-1997 p.284}"
  tr: "Malik, Yezid ibn Abdullah ibn el-Had'dan, o da Muhammed ibn İbrahim ibn el-Harith el-Taymi'den, o da Süleyman ibn Yasar'dan, o da Abdullah ibn Abi Umayya'dan rivayet eder ki, bir kadının kocası öldü ve kadın dört ay on gün bekleme süresi tuttu. Bekleme süresi sona erdiğinde yeniden evlendi ve kocasıyla dört buçuk ay birlikte kaldı. Sonra tam zamanında bir çocuk doğurdu. Kocası Ömer ibn el-Hattab'a gidip durumu anlattı. Ömer, İslam öncesi dönemden bazı kadınları çağırdı ve onlara bu konuda sorular sordu. Onlardan biri şöyle dedi: \"Size bu kadından bahsedeceğim. Kocası hamile iken öldü ve ona kan kurbanı verildi. Çocuğu rahminde şişti. Yeni kocası onunla cinsel ilişkiye girdiğinde ve çocuk amniyotik sıvıyla temas ettiğinde, çocuk rahminde hareket etti ve büyüdü.\" Ömer ibn el-Hattab ona inandı ve onları ayırarak, \"İkiniz hakkında da hayırdan başka bir şey duymadım\" dedi ve çocuğu ilk kocaya nispet etti. {cite:muwatta-maruf-1997 s.283} {cite:muwatta-maruf-1997 s.284}"
  id: "Malik meriwayatkan dari Yazid ibn Abdullah ibn al-Had, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, dari Sulayman ibn Yasar, dari Abdullah ibn Abi Umayya, bahwa seorang wanita meninggal dunia karena suaminya, sehingga ia berhasrat selama empat bulan sepuluh hari. Kemudian, setelah masa hasratnya berakhir, ia menikah lagi dan tinggal bersama suaminya selama empat setengah bulan. Kemudian ia melahirkan seorang anak yang sehat. Suaminya pergi kepada Umar ibn al-Khattab dan menceritakan hal itu kepadanya. Umar memanggil beberapa wanita dari zaman pra-Islam dan bertanya kepada mereka tentang hal itu. Salah seorang dari mereka berkata, \"Aku akan menceritakan tentang wanita ini. Suaminya meninggal ketika ia sedang mengandung anaknya, dan ia disembelih dengan darah. Anaknya tumbuh di dalam rahimnya. Ketika suami barunya berhubungan intim dengannya, dan anak itu bersentuhan dengan cairan ketuban, anak itu bergerak di dalam rahimnya dan tumbuh.\" Umar ibn al-Khattab mempercayainya dan memisahkan mereka, seraya berkata, \"Aku tidak mendengar apa pun selain kebaikan tentang kalian berdua,\" dan ia menisbatkan anak itu kepada suami pertama. {cite:muwatta-maruf-1997 p.283} {cite:muwatta-maruf-1997 p.284}"
