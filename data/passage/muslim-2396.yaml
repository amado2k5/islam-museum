label: { ar: "مسلم 2396 — ما لقيك الشيطان سالكاً فجاً إلا سلك فجاً غير فجك", en: "Muslim 2396 — Satan never meets you on a path but takes another", es: "Musulmán 2396 — Satanás nunca te encuentra en un camino, sino que toma otro", fr: "Muslim 2396 — Satan ne vous croise jamais sur un chemin, mais en emprunte un autre.", ur: "مسلم 2396 — شیطان تم سے کبھی کسی راستے پر نہیں ملتا بلکہ دوسرے راستے پر لے جاتا ہے۔", tr: "Müslim 2396 — Şeytan, sizin yürüdüğünüz yoldan asla sapmadan sizi başka bir yoldan yürürken bulamaz.", id: "Muslim 2396 — Setan tidak akan pernah menemukanmu berjalan di suatu jalan tanpa mengambil jalan yang berbeda dari jalanmu." }
text: "قال رسول الله لعمر: «والذي نفسي بيده، ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك»"
summary:
  ar: "رواية سعد بن أبي وقاص في باب فضائل عمر من صحيح مسلم؛ في سياق قصة استئذان عمر والنساء يبتدرن الحجاب — من أشهر نصوص مناقب عمر عند أهل السنة."
  tr: "Sahih Müslim'de Ömer'in faziletleri bölümünde, Ömer'in izin istemesi ve kadınların aceleyle hicap giymesi hikayesi bağlamında Sa'd ibn Abi Waqqas'ın rivayeti, Sünniler arasında Ömer'in faziletlerine dair en meşhur metinlerden biridir."
  id: "Riwayat Sa'd ibn Abi Waqqas dalam bab tentang keutamaan Umar dalam Sahih Muslim; dalam konteks kisah Umar meminta izin dan para wanita bergegas mengenakan hijab — adalah salah satu teks paling terkenal tentang keutamaan Umar di kalangan Sunni."
