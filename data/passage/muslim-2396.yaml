text: "قال رسول الله لعمر: «والذي نفسي بيده، ما لقيك الشيطان قط سالكاً فجاً إلا سلك فجاً غير فجك»"
summary:
  ar: "رواية سعد بن أبي وقاص في باب فضائل عمر من صحيح مسلم؛ في سياق قصة استئذان عمر والنساء يبتدرن الحجاب — من أشهر نصوص مناقب عمر عند أهل السنة."
