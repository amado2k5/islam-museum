text: "… قولُ حسان وكعب في الجاهلية، وشاعر أهل اليمن في الإسلام، وهو شاعر أهل القرى. أشدِّ القول عليهم، فَلما أسلموا وفقهوا، كان أشدّ القول عليهم قول عبد اللّٰه بن رواحة. وعن أَبي عبيدة وأَبي عمرو بن العلاء أنهما قالا : حسّان …"
