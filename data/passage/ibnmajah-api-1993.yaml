label: { ar: "سنن ابن ماجه 1993 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Ibn Majah 1993 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابن ماجہ 1993 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Ibn Majah 1993 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Ibn Majah 1993 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَيَّاشٍ، حَدَّثَنِي سُلَيْمَانُ بْنُ سُلَيْمٍ الْكَلْبِيُّ، عَنْ يَحْيَى بْنِ جَابِرٍ، عَنْ حَكِيمِ بْنِ مُعَاوِيَةَ، عَنْ عَمِّهِ، مِخْمَرِ بْنِ مُعَاوِيَةَ قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" لاَ شُؤْمَ وَقَدْ يَكُونُ الْيُمْنُ فِي ثَلاَثَةٍ فِي الْمَرْأَةِ وَالْفَرَسِ وَالدَّارِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1993، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1993 (The Chapters on Marriage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1993، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Ibn Majah, n.° 1993 (Los capítulos sobre el matrimonio), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Ibn Majah, n° 1993 (Les chapitres sur le mariage), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, religions, sectes et peuples non musulmans."
