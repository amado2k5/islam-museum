text: |-
  ٥٧٠
  •⁦(فصل الياء)⁩
  تكن لك، فى قوى يد يشكرونمها • وأيدى الندى فى الصالحين قروض
  اليزيدى يدى ذلان من يده أى ذهبت يده و يدست يقال ماله يدى من يده وه ودعاء عليه كما
  بقال ماله تربت يداء ويديت الرحل أصبت يده فهوميدى فان أردت أنك اتخذت عنده يدا
  قلت أيديت عنده يدافأنامود وهوم ودى الميه ويديت لغة قال الشاءر
  يديت على ابحسماس بن وهب • يأسفل ذى الجذاة يد الكريم
  وتقول اذا وقع الغلبى فى الحيالة أميدى أم مرجول أى أوقعت يده فى الحبالة أم رجله
  وياديت فلانا جازيتسهيدا بيدوأعطيته مياداة أى من يدى الى يده الاصعى أعطيته
  مالاعن ظهريديعسنى تفض لاليس من ييع ولا قرض ولامكافأة واستعت الغم باليدين
  أى يتمنين مختلفيز يعضهاء من وبعضها ؛ نمن آخر ويقال ان بين يدى الساءة أهو الا أى
  قدامها وهذا ما قتمت يداك وهو تأكيدكما بقال هذا ما جنت يداك أى جميته أنت
  الا أنك تؤ كدبها أبوزيدية ال لقيته أول ذات يدين ومعناه أول شى قال الاخفس
  ويقال سقط فى يديه وأسقط أى ندم ومنه قوفهتعالى ولماسقط فى أيديهم أى ندموا وقولهم
  ذهبوا أيدى سباد أيادى سبا أى متفرقين وهما اسمان جعلا واحدا وتقول لا أفعله
  يد الدهرأى أبدا قال الاعشى * يد الدهر حق تلاقى الخيارا وقول لبيد
  حتى اذا ألقت يدا فى كافر • يعن بدأت الشمس فى المغيب وهذا الشئ فى يدى أى فى ملكى
  والنسبة اليهايدى" وان شقت يدوى" وامرأف يدية أى صناع وما أيدى فلانة ورجل يدى
  وهذانوب يدى وأدى أى واسع قال الهجاج
  فى الداراذئوب الصبايدى • واذزمان الناس دعفل
  الاصعىّ يد الثوب مافضل منه اذا تعطفت به والتحفت يقال ثوب قسير اليد قال الفراه
  وبعضهم يقول لذى الشدية ذواليدية وهوالمقتول بنهروان وذ واليدين رجل من الحمابة
  يقال سمى بذلك لانه كان يعمل بديه جيعا وهو الذى قال للنو عليه الصلاة والسلام
  أقصرت الصلاة أم نسيت
  ٥٠
  ٦: ⁦( ب ب الالف اللقية)⁩
  لان الالف على ضر بين اينسة ومتصركة فاللبنة تسمى ألفا والمتحركة تسمى همزة وقد
  ذكرنا الهعزة وذكرنا أيضاما كانت الالف فيه منقلبة من الواووالياء وهذا الباب مبى
  على ألضات غيره: قلبات من شى فلهذا أفردناه ⁦(آ)⁩ آحرف هياء مقصورة موقوفة فات
  جعلتها اسمامددتم اوهى تؤنت مالم تسم حرفا واذاصغرت آية قلت أيبة وذلك اذا كانت
  صغيرة فى الخط وكذلك الهول فيما أشبهها من الحروف والالف من حروف المدواللين
  والزيادات وحروف الزيادات عشرة يجمعها قولك اليوم تنساء وقد تكون الالف فى الافعال
  ضهير الاثتين تحو فعلاو يفعلان وتكون فى الاسماء علامة للاثنين ودليلا على الرفع نحو
  رجلان فاذا نحر كت فهى همزة وقد تزاد فى الكلام للاستفهام تقول أزيد عندك أم عرو
  فأن اجتمعت همزتان فصلت بينهما بألف قال ذو الرقة
