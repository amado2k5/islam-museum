  tr: "Al-Khatib Al-Baghdadi'nin Bağdat Tarihi, Resimli Cilt 1, sayfa 258'den bir alıntı, bir mezar, bir türbe ve bir türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
