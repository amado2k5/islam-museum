text: "… بن معروف حدثنا الحسين بن فهم. قال : شجاع بن مخلد من أبناء أهل خراسان، من النفس وهو ثقة ثبت، وتوفى ببغداد لعشر خلون من صفر سنة خمس وثلاثين ومائتين، وحضره بشر كثير، ودفن فى مقبرة باب التين. شجاع بن …"
summary:
