label: { ar: "الموطأ 511 — عبد الله بن زيد المازني: خرج النبي إلى المصلى فاستسقى وحول رداءه", en: "Muwatta 511", es: "Muwatta 511", fr: "Muwatta 511", ur: "موطا 511", tr: "El-Muvatta 511 — Abdullah bin Zeyd el-Mazini: Peygamber namaz kılınacak yere çıktı, su istedi ve cübbesini çevirdi.", id: "Al-Muwatta 511 — Abdullah bin Zaid Al-Mazini: Nabi pergi ke tempat shalat dan meminta air, lalu beliau membalikkan jubahnya" }
text: "خرج رسول الله إلى المصلى فاستسقى، وحول رداءه حين استقبل القبلة"
summary:
  ar: "أول حديث في باب العمل في الاستسقاء. يرويه يحيى عن مالك عن عبد الله بن أبي بكر بن عمرو بن حزم أنه سمع عباد بن تميم يقول: سمعت عبد الله بن زيد المازني يقول: خرج النبي إلى المصلى فاستسقى وحول رداءه حين استقبل القبلة. ويخرّجه المحقق عند مسلم (3/23) وأبي داود (1167) والنسائي (3/157) وأحمد والشافعي والطحاوي ومحمد بن الحسن والبيهقي من طرق أصحاب مالك. وينقل عن ابن عبد البر أن مالكاً لم يذكر فيه الصلاة ولم يختلف رواة الموطأ في ذلك، إلا أن إسحاق بن عيسى الطباع زاد عنه أن النبي بدأ في الاستسقاء بالصلاة قبل الخطبة، وأن سفيان بن عيينة عن عبد الله بن أبي بكر، وأبا بكر بن حزم عن عباد، وابن شهاب الزهري عن عباد بن تميم كلهم ذكروا فيه الصلاة ⁦(التمهيد 17/167–168)⁩. {cite:muwatta-maruf-1997 p.264}"
  tr: "Yağmur duası sırasında yapılan amellerle ilgili bölümdeki ilk hadis. Yahya, Malik'ten, Abdullah ibn Abi Bakr ibn Amr ibn Hazm'dan rivayet etmiştir. Abdullah ibn Abi Bakr ibn Amr ibn Hazm, Abbad ibn Tamim'den şöyle rivayet etmiştir: Abdullah ibn Zayd al-Mazini'den şöyle rivayet edildiğini işittim: Peygamber namaz kılınacak yere çıktı ve yağmur duası etti, kıbleye döndüğünde de cübbesini çevirdi. Bu hadis ayrıca Sahih Muslim (3/23), Sahih Davud (1167), Sahih al-Nasa'i (3/157), Sahih Ahmed, Sahih al-Şafi'i, Sahih al-Tahavi, Sahih Muhammed ibn al-Hasan ve Sahih al-Beyhaki'de de Malik'in sahabelerinin rivayet zincirleriyle bulunmaktadır. İbn Abd al-Barr'dan rivayet edildiğine göre Malik bu hadiste namazdan bahsetmemiştir ve el-Muvatta'nın ravileri bu konuda ihtilaf etmemişlerdir. Ancak İshak ibn İsa el-Tabba', Peygamberin hutbeden önce yağmur duasına başladığını ve Sufyan ibn Uyayna'nın Abdullah ibn Abi Bekr'den, Ebu Bekr ibn Hazm'ın Abbad'dan ve İbn Şihab el-Zuhri'nin Abbad ibn Tamim'den rivayet ederek bu hadiste duadan bahsettiklerini eklemiştir (el-Tamhid 17/167–168). {cite:muwatta-maruf-1997 s.264}"
  id: "Hadits pertama dalam surah tentang amalan-amalan saat shalat memohon hujan. Diriwayatkan oleh Yahya dari Malik, dari Abdullah ibn Abi Bakr ibn Amr ibn Hazm, yang mendengar Abbad ibn Tamim berkata: Aku mendengar Abdullah ibn Zayd al-Mazini berkata: Nabi pergi ke tempat shalat dan berdoa memohon hujan, lalu beliau membalikkan jubahnya ketika menghadap kiblat. Hadits ini juga terdapat dalam Sahih Muslim (3/23), Sahih Dawud (1167), Sahih al-Nasa'i (3/157), Sahih Ahmad, Sahih al-Shafi'i, Sahih al-Tahawi, Sahih Muhammad ibn al-Hasan, dan Sahih al-Bayhaqi melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa Malik tidak menyebutkan salat dalam hadits ini, dan para perawi al-Muwatta' tidak berbeda pendapat mengenai hal ini. Namun, Ishaq ibn Isa al-Tabba' menambahkan bahwa Nabi memulai salat memohon hujan sebelum khutbah, dan bahwa Sufyan ibn Uyayna, berdasarkan riwayat Abdullah ibn Abi Bakr, Abu Bakr ibn Hazm, berdasarkan riwayat Abbad, dan Ibnu Shihab al-Zuhri, berdasarkan riwayat Abbad ibn Tamim, semuanya menyebutkan salat dalam hadits ini (al-Tamhid 17/167–168). {cite:muwatta-maruf-1997 p.264}"
