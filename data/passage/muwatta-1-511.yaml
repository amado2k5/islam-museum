label: { ar: "الموطأ 511 — عبد الله بن زيد المازني: خرج النبي إلى المصلى فاستسقى وحول رداءه", en: "Muwatta 511" }
text: "خرج رسول الله إلى المصلى فاستسقى، وحول رداءه حين استقبل القبلة"
summary:
  ar: "أول حديث في باب العمل في الاستسقاء. يرويه يحيى عن مالك عن عبد الله بن أبي بكر بن عمرو بن حزم أنه سمع عباد بن تميم يقول: سمعت عبد الله بن زيد المازني يقول: خرج النبي إلى المصلى فاستسقى وحول رداءه حين استقبل القبلة. ويخرّجه المحقق عند مسلم (3/23) وأبي داود (1167) والنسائي (3/157) وأحمد والشافعي والطحاوي ومحمد بن الحسن والبيهقي من طرق أصحاب مالك. وينقل عن ابن عبد البر أن مالكاً لم يذكر فيه الصلاة ولم يختلف رواة الموطأ في ذلك، إلا أن إسحاق بن عيسى الطباع زاد عنه أن النبي بدأ في الاستسقاء بالصلاة قبل الخطبة، وأن سفيان بن عيينة عن عبد الله بن أبي بكر، وأبا بكر بن حزم عن عباد، وابن شهاب الزهري عن عباد بن تميم كلهم ذكروا فيه الصلاة (التمهيد 17/167–168). {cite:muwatta-maruf-1997 p.264}"
