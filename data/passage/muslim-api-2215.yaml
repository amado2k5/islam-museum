label: { ar: "صحيح مسلم 2215 — دفن وقبر ومرقد", en: "Sahih Muslim 2215 — a burial, grave or resting place", ur: "صحیح مسلم 2215 — تدفین، قبر اور مرقد", es: "Sahih Muslim 2215 — un lugar de entierro, tumba o descanso", fr: "Sahih Muslim 2215 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sahih Muslim 2215 — Defin, mezar ve istirahat yeri", id: "Sahih Muslim 2215 — Pemakaman, kuburan, dan tempat peristirahatan" }
text: "… شَابًّا - فَفَقَدَهَا رَسُولُ اللَّهِ فَسَأَلَ عَنْهَا - أَوْ عَنْهُ - فَقَالُوا مَاتَ. قَالَ \" أَفَلاَ كُنْتُمْ آذَنْتُمُونِي \". قَالَ فَكَأَنَّهُمْ صَغَّرُوا أَمْرَهَا - أَوْ أَمْرَهُ - فَقَالَ \" دُلُّونِي عَلَى قَبْرِهِ \". فَدَلُّوهُ فَصَلَّى عَلَيْهَا ثُمَّ قَالَ \" إِنَّ هَذِهِ الْقُبُورَ مَمْلُوءَةٌ ظُلْمَةً عَلَى أَهْلِهَا وَإِنَّ اللَّهَ عَزَّ وَجَلَّ يُنَوِّرُهَا لَهُمْ بِصَلاَتِي عَلَيْهِمْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 2215، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2215 (The Book of Prayer - Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 2215، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2215 (El Libro de la Oración - Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 2215 (Le Livre de la prière – Funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih Müslim'de 2215 numaralı hadis, defin, mezar ve türbeden bahsetmektedir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler üzerine araştırmalar yapan bir uzman tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2215, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
