label: { ar: "سنن النسائي 1096 — الأب والأبوة", en: "Sunan al-Nasa'i 1096 — the father and fatherhood", ur: "سنن نسائی 1096 — باپ اور والدیت", es: "Sunan al-Nasa'i 1096 — El padre y la paternidad" }
text: "… السَّرْحِ، وَيُونُسُ بْنُ عَبْدِ الأَعْلَى، وَالْحَارِثُ بْنُ مِسْكِينٍ، قِرَاءَةً عَلَيْهِ وَأَنَا أَسْمَعُ، - وَاللَّفْظُ لَهُ - عَنِ ابْنِ وَهْبٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ عَبْدِ اللَّهِ بْنِ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ قَالَ \" أُمِرْتُ أَنْ أَسْجُدَ عَلَى سَبْعَةٍ - لاَ أَكُفَّ الشَّعْرَ وَلاَ الثِّيَابَ - الْجَبْهَةِ وَالأَنْفِ وَالْيَدَيْنِ وَالرُّكْبَتَيْنِ وَالْقَدَمَيْنِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1096، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1096 (The Book of The At-Tatbiq (Clasping One's Hands Together)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1096، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1096 (El Libro del At-Tatbiq (Junto de las Manos)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
