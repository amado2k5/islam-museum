label: { ar: "سنن النسائي 4303 — الأب والأبوة", en: "Sunan al-Nasa'i 4303 — the father and fatherhood", ur: "سنن نسائی 4303 — باپ اور والدیت", es: "Sunan al-Nasa'i 4303 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4303 — le père et la paternité" }
text: "أَخْبَرَنِي أَحْمَدُ بْنُ خَالِدٍ الْخَلاَّلُ، قَالَ حَدَّثَنَا مَعْنٌ، قَالَ أَنْبَأَنَا مُعَاوِيَةُ، - وَهُوَ ابْنُ صَالِحٍ - عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، عَنْ أَبِي ثَعْلَبَةَ، عَنِ النَّبِيِّ فِي الَّذِي يُدْرِكُ صَيْدَهُ بَعْدَ ثَلاَثٍ فَلْيَأْكُلْهُ إِلاَّ أَنْ يُنْتِنَ."
summary:
  ar: "حديث في سنن النسائي، رقم 4303، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4303 (The Book of Hunting and Slaughtering), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4303، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4303 (El Libro de la Caza y la Matanza), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4303 (Le Livre de la Chasse et de l'Abattage), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
