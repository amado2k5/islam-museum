text: "… إلخ. -إرشاد الألبّاءِ إلى معرفةِ الأُدَباء: مجلداتٌ للشَّيخ ياقوت بنِ عبد اللّٰه الحَمَويِّ البغدادي، المتوفَّى سنةَ ستٌّ وعشرين وست مئة، ذكرَ فيه من أخبار النُّحاةِ واللُّغويينَ والقُرّاءِ وعلماءِ الأخبارِ والأنسابِ والكُتّاب، وكلِّ مَن صنَّف في الأدب. ذكره ابنُ خَلِّكان. تقدمت …"
