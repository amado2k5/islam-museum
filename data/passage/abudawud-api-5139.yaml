text: "… قَالَ قُلْتُ يَا رَسُولَ اللَّهِ مَنْ أَبَرُّ قَالَ \" أُمَّكَ ثُمَّ أُمَّكَ ثُمَّ أُمَّكَ ثُمَّ أَبَاكَ ثُمَّ الأَقْرَبَ فَالأَقْرَبَ \". وَقَالَ رَسُولُ اللَّهِ \" لاَ يَسْأَلُ رَجُلٌ مَوْلاَهُ مِنْ فَضْلٍ هُوَ عِنْدَهُ فَيَمْنَعُهُ إِيَّاهُ إِلاَّ دُعِيَ لَهُ يَوْمَ الْقِيَامَةِ فَضْلُهُ الَّذِي مَنَعَهُ شُجَاعًا أَقْرَعَ \". قَالَ أَبُو دَاوُدَ الأَقْرَعُ الَّذِي ذَهَبَ شَعْرُ رَأْسِهِ مِنَ السُّمِّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 5139، يذكر السم والترياق. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 5139 (General Behavior (Kitab Al-Adab)), that mentions poison and antidote. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 5139، جس میں زہر اور تریاق کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
