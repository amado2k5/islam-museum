text: "كتَابُ السُنَةُ للجَلال - قال: حدثنا أبو عبد الله، قال وكيع، وعبد الرحمن، عن سفيان، عن زُبيدٍ، عن إبراهيم، عن مسروق، عن عبد اللّٰه صينه قال: الرِّبا بضعٌ وسبعونَ بابًا، والشِّركُ نحو ذلك. - قال: حدثنا أبو عبد الله، قال: …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 675، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
