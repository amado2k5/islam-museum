text: "… عليه فى كل حال نصب عينيه. وليكن بما فى يدالله أوثق منه بما فى بديه. وفيها أن من قدم شيئاً على طاعة اللّٰه والانفاق فى سبيله عذب به وربما سلب منه معاملة له بنقيض قصده. وفيها أن الواجب قبول نصيحة …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 2، ص 468، يرد فيه ذكر طاعة الله ورسوله، والواجب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
