text: "… - قات أرأيت ان وهبت له كفارته أو تصدق بها عليه أو اشتراها أكان مالك يكره له ذلك قال ما سمعت من مالك فيه شيئاً ولكنّ مالكا كان يكره للرجل أن يشترى صدقة التطوع فهذا أشد كراهية وذلك رأي قلت …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 2، ص 131، يرد فيه ذكر التطوع، وما كان يُكره، وما كرهه الفقهاء، والكراهة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 2, p. 131, whose wording mentions the voluntary act (tatawwu'), what used to be disliked, what the jurists disliked, dislike (karaha), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
