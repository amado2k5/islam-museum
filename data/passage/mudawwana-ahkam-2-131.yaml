text: "… - قات أرأيت ان وهبت له كفارته أو تصدق بها عليه أو اشتراها أكان مالك يكره له ذلك قال ما سمعت من مالك فيه شيئاً ولكنّ مالكا كان يكره للرجل أن يشترى صدقة التطوع فهذا أشد كراهية وذلك رأي قلت …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 2، ص 131، يرد فيه ذكر التطوع، وما كان يُكره، وما كرهه الفقهاء، والكراهة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 2, p. 131, whose wording mentions the voluntary act (tatawwu'), what used to be disliked, what the jurists disliked, dislike (karaha), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 2، ص 131 کا اقتباس جس میں تطوع ⁦(نفلی عمل)⁩، جو ناپسند کیا جاتا تھا، جسے فقہاء نے مکروہ کہا، کراہت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 2, p. 131, dont le texte mentionne l'acte volontaire (tatawwu'), ce qui était réprouvé, ce que les juristes ont réprouvé, la réprobation (karaha), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mudawwana al-Kubra, volumen digitalizado 2, p. 131, cuyo texto menciona el acto voluntario (tatawwu'), lo que se reprobaba, lo que los juristas reprobaron, la reprobación (karaha), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Büyük Derleme, Resimli Cilt 2, sayfa 131'den bir alıntı, gönüllü eylemleri, hoş karşılanmayanları, hukukçuların hoş karşılamadıklarını ve hoş karşılanmadığı düşünülenleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Zorunlu eylemler, görevler, itaat eylemleri, tavsiye edilen eylemler, hoş karşılanmayan eylemler, yasaklanmış eylemler ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Kompendium Agung, Jilid Ilustrasi 2, halaman 131, membahas tentang tindakan sukarela, apa yang tidak disukai, apa yang tidak disukai oleh para ahli hukum, dan apa yang dianggap tidak disukai. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun berdasarkan kumpulan tindakan wajib, kewajiban, tindakan ketaatan, tindakan yang dianjurkan, tindakan yang tidak disukai, tindakan yang dilarang, dan dosa-dosa kecil."
