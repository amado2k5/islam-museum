text: "أنكت في بلاد الفرنج أكثر، وسمعنا أنها وصلت إلى خلاط، وجاءني كتاب من الشام فيه: (كادت لها الأرض تسيرا سيرا والجبال تمور مورا، وما ظننا إلا أنها زلزلة الساعة، وأتت دفعتين الأولى مقدار ساعة أو أزيد، والثانية دون ذلك لكن"
