label: { ar: "الموطأ 2656 — نافع وعبد الله بن دينار وزيد بن أسلم عن ابن عمر: لا ينظر الله إلى من يجر ثوبه خيلاء", en: "Muwatta 2656", es: "Muwatta 2656", fr: "Muwatta 2656", ur: "موطا 2656", tr: "El-Muvatta 2656 — İbn Ömer'den rivayet edildiğine göre Nafi', Abdullah bin Dinar ve Zeyd bin Aslam şöyle buyurmuştur: Allah, gururdan elbisesini sürükleyen kimseye bakmaz.", id: "Al-Muwatta 2656 — Diriwayatkan oleh Nafi’, Abdullah bin Dinar, dan Zaid bin Aslam dari Ibnu Umar: Allah tidak memandang orang yang menyeret-nyeret pakaiannya karena kesombongan." }
summary:
  ar: "يروي مالك عن نافع وعبد الله بن دينار وزيد بن أسلم، كلهم يخبره عن عبد الله بن عمر أن رسول الله قال: لا ينظر الله يوم القيامة إلى من يجر ثوبه خيلاء. {cite:muwatta-maruf-1997 p.501}"
  tr: "Malik, Nafi', Abdullah ibn Dinar ve Zeyd ibn Aslam'dan rivayetle, hepsi de Abdullah ibn Ömer'den naklettiği üzere, Allah Resulü'nün şöyle buyurduğunu aktarır: \"Allah, kıyamet gününde kibrinden elbisesini sürükleyen kimseye bakmayacaktır.\" {cite:muwatta-maruf-1997 s.501}"
  id: "Malik meriwayatkan dari Nafi', Abdullah ibn Dinar, dan Zayd ibn Aslam, yang semuanya memberitahunya dari Abdullah ibn Umar bahwa Rasulullah SAW bersabda: \"Allah tidak akan memandang orang yang menyeret-nyeret pakaiannya karena kesombongan pada Hari Kiamat.\" {cite:muwatta-maruf-1997 p.501}"
