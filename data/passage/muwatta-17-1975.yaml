summary:
  ar: "قال مالك: الأمر عندنا أنه لا بأس بالشرك والتولية والإقالة في الطعام وغيره، قبض ذلك أو لم يقبض، إذا كان ذلك بالنقد، ولم يكن فيه ربح ولا وضيعة ولا تأخير. فإن دخل ذلك ربح أو وضيعة أو تأخير من واحد منهما، صار بيعا يحله ما يحل البيع، ويحرمه ما يحرم البيع، وليس بشرك ولا تولية ولا إقالة. {cite:muwatta-maruf-1997 p.208}"
