label: { ar: "الموطأ 1975 — مالك: الأمر عندنا أنه لا بأس بالشرك والتولية والإقالة في الطعام وغيره، قبض ذلك أو لم يقبض، إذا كان ذلك بالنقد، ولم يكن فيه ربح ولا وضيعة ولا تأخير، فإن دخل ربح أو وضيعة أو تأخير صار بيعا", en: "Muwatta 1975", es: "Muwatta 1975", fr: "Muwatta 1975", ur: "موطا 1975", tr: "Al-Muwatta 1975 — Malik: Bizim meselemiz şudur ki, gıda ve diğer şeylerde ortaklık, acentelik ve iptal işlemlerinde, ister alınsın ister alınmasın, nakit olarak yapılması ve kâr, zarar veya gecikme olmaması şartıyla, bir sakınca yoktur. Eğer kâr, zarar veya gecikme varsa, o zaman satış olur.", id: "Al-Muwatta 1975 — Malik: Masalahnya di antara kita adalah tidak ada masalah dengan kemitraan, keagenan, dan pembatalan dalam hal makanan dan barang-barang lainnya, baik diterima atau tidak, jika dilakukan secara tunai, dan tidak ada keuntungan, kerugian, atau keterlambatan yang terlibat. Jika ada keuntungan, kerugian, atau keterlambatan yang terlibat, maka itu menjadi penjualan." }
summary:
  ar: "قال مالك: الأمر عندنا أنه لا بأس بالشرك والتولية والإقالة في الطعام وغيره، قبض ذلك أو لم يقبض، إذا كان ذلك بالنقد، ولم يكن فيه ربح ولا وضيعة ولا تأخير. فإن دخل ذلك ربح أو وضيعة أو تأخير من واحد منهما، صار بيعا يحله ما يحل البيع، ويحرمه ما يحرم البيع، وليس بشرك ولا تولية ولا إقالة. {cite:muwatta-maruf-1997 p.208}"
  tr: "Malik şöyle dedi: Bizim düşünce ekolümüze göre, gıda veya diğer mallarla ilgili bir satışta ortaklık, temsilcilik veya satışın iptalinde, malların teslim alınmış olup olmamasına bakılmaksızın, nakit olarak yapılması ve kâr, zarar veya gecikme söz konusu olmaması koşuluyla, bir sakınca yoktur. Ancak, taraflardan herhangi biri için kâr, zarar veya gecikme söz konusu ise, bu, diğer satışlarla aynı koşullar altında izin verilen ve aynı koşullar altında yasaklanan bir satış haline gelir. Bu, ortaklık, temsilcilik veya iptal olarak kabul edilmez. {cite:muwatta-maruf-1997 s.208}"
  id: "Malik berkata: Menurut aliran pemikiran kami, tidak ada yang salah dengan kemitraan, keagenan, atau pembatalan penjualan yang melibatkan makanan atau barang lainnya, baik barang tersebut telah diterima atau belum, asalkan dilakukan secara tunai dan tidak ada keuntungan, kerugian, atau keterlambatan yang terlibat. Namun, jika ada keuntungan, kerugian, atau keterlambatan yang terlibat bagi salah satu pihak, maka itu menjadi penjualan, yang diperbolehkan dalam kondisi yang sama seperti penjualan lainnya dan dilarang dalam kondisi yang sama. Itu tidak dianggap sebagai kemitraan, keagenan, atau pembatalan. {cite:muwatta-maruf-1997 p.208}"
