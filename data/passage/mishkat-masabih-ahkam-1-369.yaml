text: "… يصح غسل الجمعة قبل الصبح، والأمر للندب. على كلّ مُحتلم: أي بالغ؛ لأن الصبي غير مأمور. خط ذهب أكثر الفقهاء إلى أنه غير واجب، وتأولوا الحديث على معنى الترغيب فيه، حتى يكون كالواجب على معنى التمثيل والتشبيه. حس أراد وجوب …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 369، يرد فيه ذكر الواجب، والوجوب، والمندوب، وما ليس بواجب، والترغيب في العمل، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 369, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), what is said not to be obligatory, encouragement to an act, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
