text: "… المعصية، فلا يكون مباحاً لهم إلا إذا استعانوا بها على الطاعات، فيلزم من انتفاء السيئات أنهم لا يفعلون إلا الحسنات، ولهذا كان من ترك المعاصي كلها فلا بد أن يشتغل بطاعة اللّٰه. وفي الحديث الصحيح، كل الناس يغدو فبائع نفسه …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 49، يرد فيه ذكر الطاعات، وطاعة الله ورسوله، والمباح، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 49, whose wording mentions the acts of obedience, obedience to God and His Messenger, the permitted (mubah), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
