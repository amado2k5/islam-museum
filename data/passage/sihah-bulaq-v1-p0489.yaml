text: |-
  أعليه دباجود تسير بل تحته الخ
  ١٥٢
  {باب الجيم)
  قد بكرت محوة بالعجاج • فدترت بقية الرجاج
  ونعجة رجاجة أى مهزولة والرجاج أيضا الضعفاءمن الناس والابل وأنشد الاصمعى
  أقبان من نيرومن سواج * بالقوم قد.لوامن الادلاج * فهم رجاج وعلى رجاج
  أى ضعفوا من السفروضعفت رواحلهم ⁦(ردج)⁩ الردج بالحريك ما يخرج من بعن
  السخلة أو المهرقبل أن يأ كل وهو بنزلة العقى من الصبى واليرندج والارندج جلد أسود
  قال أبو عبدد أصله بالفارسمة رنده وأنشدللاعشى أرندج اسكاف يخالط عظلا ١
  قال ابن السكيت ولا يقال الرندج ⁦( رعيج)⁩ الارتعاج كلارتعاد ورعج البرق وأرعج اذا
  تتابع لمعائه قال العجاج سما أهاضيب وبرقامر عجا ابن السكيت بقال للرجل اذا
  ثرماله وعدده قد ارتعج مله وارتعج عدده وارتعج الوادى امتلا فج الرافج
  لجوز الهندى وما أظنه عربيا ⁦( روج)⁩ راج الشى يروج رواجانفق وروّجت السلعة
  والدارهم وفلان مروّج هج لرهج الغبار وأرهج الغبارأى أثاره والرهوجة ضرب
  من السير قال العجاج.
  مباسة تيح مشيارهوجا ويشبه أن يكون فارسامعبا
  صل الزاى) برج بالمكسر الزبنة من وشى أوجوهر أوضوذلك يقال زبرج
  مزبرج أى عزين ويقال الزبرج الذهب وينشد يغلى الدماغ به كغلى الزبرج
  والزبرج أيضا السحاب الرقيق فيه حرة قال العجاج
  سفر الشعال الزبرج المزبرجا
  ⁦( زج)⁩ الزج طرف المرفق والرج أيضا الحديدة التى فى أسفل الرمح والجع زججة وزياج
  ولا تقل أزحة ابن السكيت أزجعت الرمح فهو مزج اذا عملت له زجا قال وزججت الرج-ل
  أزجه زجافه ومن جوج اذا طعنته بالرج والمزج بكسر الميم رمح قصير ضكا المزراق والربج
  دقة فى الحاجبين وطول والرجل أزج وزججت المرأة حاجبها دقفته وطوّلته وقول الشاعر
  اذاما الغانيات خرجن يوما • وزججن الحواجب والعيونا
  يعنى وكحلن العيون كما قال
  علفتهانينا وماء باردا • -تى شتب همالة عبناها
  أى وسقيتها ما بارد اوظليم أزج بعيد انخط وونعامة زجاء وقال يصف ناقة
  جمالية حرف سناديشلها * وظيف أزج الخطوظما ن سهوق
  الزباجة معروفة والجمع زجاج وزجاج وزياج وجمع زج الرمح زجاج بالكسر لاغير (زيج
  أزعجه أى أقلقه وقلعه من مكانه وانزعج بنفسه والمزعاج المرأة التى لا تستقرفى مكان
  ( لج كان زج وزلج أيضا بالتحريك أى نطق والتزلج التزلق و- ريزلج بالكسر زلجاوزايجا
  اذاخف على الارض وسهم زالج يتزلج عن القوس وعطاء مزلج أى وتح قليسل والمزلج أيضا
  الملزق بالقوم وليس منهم والمزلاج المغلاق الاأنه ينتح باليد والمفلاق لا يفتح الابالمفتاح تقول
  منه أزيرت البساب اذا أغلتته والمزلاج من النساء الرسحاء ⁦(زيح)⁩ الاصهى زمجت القربة
  ملاتها قال والزمح بالتحريك الغضب وقد زمج با الكسر قال و"معت رحسلا من أشجع يقول
  مالى أرا حزمهدا أى غضبان والزمجى أصل ذنب الطارمثل الزمكى والزمج مثال الجرذاسم
  طائريقمال له بالفارسبة د. برادران وجاءنى القوم بزاً مجه-م مهموزا أى بأجعهم وأخذن
  الشئ
