summary:
  ar: "القسم 35 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الشهادات عن رسول الله»، ويضم فيها النصوص من 2295 إلى 2303 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 35 of Jami' al-Tirmidhi (Chapters On Witnesses) in the division of the open hadith dataset the museum took its reports from: reports 2295 to 2303 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 35، عنوان «کتاب الشہادات عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2295 تا 2303۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 35 de Jami' al-Tirmidhi (Capítulos sobre los testigos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2295 al 2303, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 35 de Jami' al-Tirmidhi (Chapitres sur les témoins), dans la partie du recueil ouvert de hadiths dont il est issu: les hadiths 2295 à 2303 de cette numérotation. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanında yer alan Cami' el-Tirmizi'nin 35. bölümü, \"Allah'ın Elçisi Hakkında Şahitlikler Kitabı\" başlığını taşımakta olup, 2295 ile 2303 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 35 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Kesaksian tentang Rasulullah\" dan berisi teks 2295 hingga 2303, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
