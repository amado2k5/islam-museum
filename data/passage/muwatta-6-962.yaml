label: { ar: "الموطأ 962 — مالك: سُئل عمن أهل بالحج من أهل المدينة أو غيرهم من مكة لهلال ذي الحجة، كيف يصنع بالطواف؟ الواجب يؤخره، ويطوف ما بدا له ويصلي ركعتين لكل سبع", en: "Muwatta 962" }
summary:
  ar: "سئل مالك عمن أهل بالحج من أهل المدينة أو غيرهم من مكة لهلال ذي الحجة، كيف يصنع بالطواف؟ فقال: أما الطواف الواجب فليؤخره، وهو الذي يصل بينه وبين السعي بين الصفا والمروة، وليطف ما بدا له، وليصل ركعتين كلما طاف سبعاً. وقد فعل ذلك أصحاب رسول الله الذين أهلوا بالحج من مكة فأخروا الطواف والسعي حتى رجعوا من منى، وفعله عبد الله بن عمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1087). {cite:muwatta-maruf-1997 p.457}"
