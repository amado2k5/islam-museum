label: { ar: "الموطأ 962 — مالك: سُئل عمن أهل بالحج من أهل المدينة أو غيرهم من مكة لهلال ذي الحجة، كيف يصنع بالطواف؟ الواجب يؤخره، ويطوف ما بدا له ويصلي ركعتين لكل سبع", en: "Muwatta 962", es: "Muwatta 962", fr: "Muwatta 962", ur: "موطا 962", tr: "El-Muvatta 962 — Malik: Ona, Zilhicce ayının başında Medine veya Mekke halkından Hac için ihrama giren birinin tavafını nasıl yapması gerektiği soruldu. Farz tavafını ertelemeli, dilediği kadar tavaf yapmalı ve her yedi tur için iki rekat namaz kılmalıdır.", id: "Al-Muwatta 962 — Malik: Ia ditanya tentang seseorang yang memasuki keadaan ihram untuk haji dari penduduk Madinah atau penduduk Mekah lainnya pada awal bulan Dzul-Hijjah, bagaimana seharusnya ia melakukan Tawaf? Ia harus menunda Tawaf wajib, melakukan Tawaf sebanyak yang ia inginkan, dan shalat dua rakaat untuk setiap tujuh putaran." }
summary:
  ar: "سئل مالك عمن أهل بالحج من أهل المدينة أو غيرهم من مكة لهلال ذي الحجة، كيف يصنع بالطواف؟ فقال: أما الطواف الواجب فليؤخره، وهو الذي يصل بينه وبين السعي بين الصفا والمروة، وليطف ما بدا له، وليصل ركعتين كلما طاف سبعاً. وقد فعل ذلك أصحاب رسول الله الذين أهلوا بالحج من مكة فأخروا الطواف والسعي حتى رجعوا من منى، وفعله عبد الله بن عمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1087). {cite:muwatta-maruf-1997 p.457}"
  id: "Malik ditanya tentang seseorang yang memasuki keadaan ihram untuk haji dari Madinah atau tempat lain di Mekah pada awal bulan Dzul-Hijjah: bagaimana seharusnya ia melakukan Tawaf? Beliau menjawab: “Adapun Tawaf wajib, ia harus menundanya. Ini adalah Tawaf yang menghubungkan dengan Sa'i antara Safa dan Marwa. Ia harus melakukan Tawaf sebanyak yang diinginkannya dan shalat dua rakaat setelah setiap tujuh Tawaf. Hal ini dilakukan oleh para Sahabat Rasulullah shalla Allahu alaihi wa sallam yang memasuki keadaan ihram untuk haji dari Mekah; mereka menunda Tawaf dan Sa'i hingga mereka kembali dari Mina. Abdullah bin Umar juga melakukan hal ini.” Peneliti menyebutkan bahwa Abu Mus'ab (1087) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.457}"
