text: "… : إِذَا جَاءَكَ المُنَافِقُونَ ؛ تصديقاً لزيد، فلمّا نزلت أخذ رسولُ الله، وَلِيفِ، بأذُن زيد وقال: هذا الذي أوفى اللّٰه بأذُنه. وبلغ عبدَ اللّه بن عبد اللّه بن أبَيّ بن سَلول ما كان من أمر أبيه، فأتى النبيّ، الَلِ فقال: …"
summary:
