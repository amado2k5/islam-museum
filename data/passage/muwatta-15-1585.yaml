label: { ar: "الموطأ 1585 — عمر بن الخطاب: كتب إليه من العراق أن رجلا قال لامرأته حبلك على غاربك، فأمر بإحضاره بمكة، فقال أردت الفراق", en: "Muwatta 1585" }
summary:
  ar: "بلغ مالكا أنه كتب إلى عمر بن الخطاب من العراق أن رجلا قال لامرأته حبلك على غاربك، فكتب عمر إلى عامله أن مره يوافني بمكة في الموسم. فبينما عمر يطوف بالبيت، لقيه الرجل فسلم عليه، فقال عمر من أنت؟ فقال أنا الذي أمرت أن أجلب عليك. فقال عمر أسألك برب هذه البنية، ما أردت بقولك حبلك على غاربك؟ فقال لو استخلفتني في غير هذا المكان ما صدقتك، أردت بذلك الفراق. فقال عمر هو ما أردت. {cite:muwatta-maruf-1997 p.60}"
