label: { ar: "الموطأ 1585 — عمر بن الخطاب: كتب إليه من العراق أن رجلا قال لامرأته حبلك على غاربك، فأمر بإحضاره بمكة، فقال أردت الفراق", en: "Muwatta 1585", es: "Muwatta 1585", fr: "Muwatta 1585", ur: "موطا 1585", tr: "El-Muvatta 1585 — Ömer ibn el-Hattab: Irak'tan kendisine bir mektup yazılmıştı; mektupta bir adamın karısına, \"Boynunda ip var,\" dediği, bunun üzerine Ömer'in onu Mekke'ye getirmesini emrettiği ve adamın da \"Boşanmak istiyorum\" dediği belirtiliyordu.", id: "Al-Muwatta 1585 — Umar ibn al-Khattab: Sebuah surat ditulis kepadanya dari Irak bahwa seorang pria berkata kepada istrinya, \"Talimu ada di lehermu,\" lalu ia memerintahkan agar pria itu dibawa ke Mekah, dan pria itu berkata, \"Aku ingin bercerai.\"" }
summary:
  ar: "بلغ مالكا أنه كتب إلى عمر بن الخطاب من العراق أن رجلا قال لامرأته حبلك على غاربك، فكتب عمر إلى عامله أن مره يوافني بمكة في الموسم. فبينما عمر يطوف بالبيت، لقيه الرجل فسلم عليه، فقال عمر من أنت؟ فقال أنا الذي أمرت أن أجلب عليك. فقال عمر أسألك برب هذه البنية، ما أردت بقولك حبلك على غاربك؟ فقال لو استخلفتني في غير هذا المكان ما صدقتك، أردت بذلك الفراق. فقال عمر هو ما أردت. {cite:muwatta-maruf-1997 p.60}"
  tr: "Malik, Irak'tan Ömer ibn el-Hattab'a yazdığı mektupta, bir adamın karısına \"Boynunda ip var\" dediğini aktardı. Ömer, valisine mektup yazarak, Hac mevsiminde adamı Mekke'ye getirmesini emretti. Ömer Kâbe'yi tavaf ederken, adam ona yaklaştı ve selam verdi. Ömer, \"Sen kimsin?\" diye sordu. Adam, \"Ben, sana getirmen emredilen kişiyim\" diye cevap verdi. Ömer, \"Bu evin Rabbi adına yemin ederim ki, 'Boynunda ip var' derken ne demek istedin?\" dedi. Adam, \"Beni başka bir göreve atamış olsaydın, sana inanmazdım. Ayrılığı kastetmiştim\" diye cevap verdi. Ömer, \"Öyle demek istedin\" dedi. {cite:muwatta-maruf-1997 s.60}"
  id: "Malik meriwayatkan bahwa ia menulis surat kepada Umar ibn al-Khattab dari Irak bahwa seorang pria telah berkata kepada istrinya, \"Talimu ada di lehermu.\" Umar menulis surat kepada gubernurnya, memerintahkannya untuk membawa pria itu kepadanya di Mekah selama musim haji. Ketika Umar sedang melakukan tawaf di Ka'bah, pria itu mendekatinya dan menyapanya. Umar bertanya, \"Siapakah kamu?\" Pria itu menjawab, \"Saya adalah orang yang diperintahkan untuk Anda bawa kepada Anda.\" Umar berkata, \"Demi Tuhan pemilik rumah ini, apa maksudmu dengan mengatakan, 'Talimu ada di lehermu'?\" Pria itu menjawab, \"Jika Anda menunjuk saya ke posisi yang berbeda, saya tidak akan mempercayai Anda. Yang saya maksud dengan pemisahan itu adalah.\" Umar berkata, \"Itulah yang kamu maksud.\" {cite:muwatta-maruf-1997 p.60}"
