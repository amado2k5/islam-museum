text: "… فيقولون إن الشيلئا الكبير ينفع من الجنون و الأمراض الباردة السوداوية، والبلغمية والفالج، والصرع، والسكتة، واللقوة الي اليبل والوسواس، وحديث النفس، الصداع وبرد الدماغ، والرعشة والخفقان، ويحفظ الجنين وينفع من الإسقاط، وينفع من تقطير البول وأوجاع الرحم ورياحها، واسترخاء اللسان، …"
