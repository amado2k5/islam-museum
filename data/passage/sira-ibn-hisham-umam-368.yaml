text: "… مائتيْ راكبٍ من قريشٍ ليُبِرَّ يمينه، فسلك النَّجْدِيَّةَ حتى نزل بِصَذْرِ قَنَاةٍ إلى جبلٍ يقال له: ثَيْبٌ، من المدينة على بَرِيدٍ أو نحوه، ثم خرج من الليل حتى أتى بني النَّضِيرِ تحت الليل، فأتى حُيَيَّ بن أَخْطَبَ، فَضَرَب عليه بابه، …"
