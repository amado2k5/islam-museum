text: "سرية مؤتة وهى بادنى البلقا الأسلَمى، حدثنى أبو بكر بن عبد اللّه بن أبى سَبْرَةَ عن إسحاق بن عبد اللّٰه بن أَبى فَرْوَة عن عمر بن الحَكَم قال : بعث رسول اللّٰه، صلّعم، شجاع ابن وَهب فى أَربعة وعشرين رجلًا …"
