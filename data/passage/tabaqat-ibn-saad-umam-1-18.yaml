  tr: "İbn Sa'd'ın *El-Tabakat el-Kübra* adlı eserinin 1. cildinin 18. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
