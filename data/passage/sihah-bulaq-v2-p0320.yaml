text: |-
  ٢٦٧
  وتيم فى قريش رهط أبى بكر الصدّيق رضى اللّٰه عنه وهو تيم بن مرة بن كمعب بن اوىّ بن غالب
  (أبن فهر بن مالك بن النضر وتيم بن غالب بن فهو أيضا من قريس وهم بنو الادرم وتيم بن عبد
  مناة بن أدبن طابخسة بن الياس بن مضر وتيم بن قيس بن تعلبسة بن عكابة وتيم بن شيبان بن
  يعلبة بن عكاية فى بكو وتيم بن ضبة وتيم اللات أيضا في ضبة وتيم اللات أيضا فى الخزرج
  من الانصاروهم تيم اللات بن تعلبة واسمه التحار وأماقول امرى القيس
  نوتيم مصابيح الظلام • فهم بنوتيم بن ثعلسة من طي والتيمة بالكسر الشاة التى يحلبها
  الرجل فى منزله واييت بائمة وفى الجديث التيمة لاهلها تقول منه اتام الرجل يتام
  اتياما اذاذيح تمته وهوافتعل قال الحطيئة
  فاتنام جارة آل لأى * ولكن يضمنون لها قراه!
  والتيماه الفلاة وتيماء اسم موضع
  اذاكنرودام يقال أثجمت السماء أبإماثم أنجمت ثزم الثرم بالتصريك سقوط
  النقية تقول منه ثرم الرجل باللكسر فهو أثرم وثرمته أنا بالنتح ترما اذا ضربته على فيه قتدم
  ويقال أيضائر مت تنيته فانترمت وأترمه اللّٰه سيحإنه أى جعله أقرم ⁦( تم)⁩ الثرتم بالضم
  مافضل فى الافاع من طعام أو أدم وقالم
  لا تحسين لمعان قيس بالقنا * وضرامم بالبيض حبو الترتم
  تعمت الشى تزعته وتتعمتنى أرض فلان أى أعبتى ورواه أبو زيد بالنون
  غم) النغام بالفتح ندت يكون فى الجبل يبيض اذاييس يقال له بالفارسية
  درمنه اسبيذويشبه به الشيب الواحدة ثغامة قال الشاءر يخاطب نفسه
  أعلاقة أم الوليد بعدما * أفتان رأسك كالنغام المخلس
  والثغم الضارى من الكلاب كم ثكم الطريق بالتحريك وسطه والنكم أيضا
  مصدرثكم بالمكان بالكسراذا أقاميه وشكمت الطريق أيضا اذالزمته (تلم الثلة
  اخلل فى الحاتط وغيره وقد ثلته أثله بالكسر ثلما يقال فى السيف ثلم وفي الاناه ثلم أذا انكسم
  من شفته شئ وثلم الوادى بالتهريك وهو أن ينشلم حوفه وثلت الشى فانثلم وتمسلم وثلم الشى
  بالكسر يثلم فهو أ ثلم بين التلم وثلته أيضاشة د للكثرة والمثلم اسم موضع ( ت م لتمام نبت
  ضعيف لهخوص أوشبيه بانلجوص وربماحشى به وسديه خصاص البيوت الواحدة عجامة
  وبه سعى الرجل ثمامة وعمت الشى ألّه بالضم عا اذا أصلحته ورممته بالتمام ومنه قبل عمت
  أمورى اذا أصلحتها ورممتها قال الشاعر
  عمت حواعجى ووذأت بشرا * فبئس معرّس الركب السغاب
  ومنه قواهم كنا أهل عه ورمه وتمت الشاة النبت بقيهما أى قلعته فهى شاة عوم وعُمت
  السى جعته يقال هو ينمه ويقمه أى يكنيه ويجمع الجيد والردىء ورجل مثمّ ومقم
  بكسر الميم اذا كان كذلك ومنمة ومقمة أيضا الها اللمبالغة وقال اعرابية جعجع به الذهر عن
  تمسه وره أى عن قلي-له وكثيرم وثُمت يدى بالارض أى مسحت بالحشيش وانتمّ عليه أى
