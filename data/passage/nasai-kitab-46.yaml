label:
  ar: "سنن النسائي، كتاب قطع السارق"
  en: "Sunan al-Nasa'i, Book 46: The Book of Cutting off the Hand of the Thief"
  ur: "سنن نسائی، کتاب قطع السارق"
  es: "Sunan al-Nasa'i, Libro 46: El Libro de Cortar la Mano del Ladrón"
summary:
  ar: "القسم 46 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب قطع السارق»، ويضم فيها النصوص من 4870 إلى 4984 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 46 of Sunan al-Nasa'i (The Book of Cutting off the Hand of the Thief) in the division of the open hadith dataset the museum took its reports from: reports 4870 to 4984 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 46، عنوان «کتاب قطع السارق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4870 تا 4984۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 46 de Sunan al-Nasa'i (El Libro de la Perdición del Ladrón) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4870 al 4984 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
