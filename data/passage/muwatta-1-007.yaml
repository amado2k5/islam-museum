label: { ar: "الموطأ 7 — كتاب عمر إلى أبي موسى في المواقيت", en: "Muwatta 7" }
text: "وأخر العشاء ما لم تنم، وصل الصبح والنجوم بادية مشتبكة، واقرأ فيها بسورتين طويلتين من المفصل"
summary:
  ar: "أثر يرويه مالك عن عمه أبي سهيل نافع بن مالك عن أبيه مالك بن أبي عامر، في باب وقوت الصلاة: كتب عمر بن الخطاب إلى أبي موسى الأشعري يأمره أن يصلي الظهر إذا زالت الشمس، والعصر والشمس بيضاء نقية قبل أن تدخلها صفرة، والمغرب عند الغروب، وأن يؤخر العشاء ما لم يغلبه النوم، وأن يصلي الصبح والنجوم بادية مشتبكة ويقرأ فيها بسورتين طويلتين من المفصل. ويذكر المحقق أنه رواه عن مالك أبو مصعب الزهري وسويد بن سعيد وعبد الرزاق. {cite:muwatta-maruf-1997 p.37} {cite:muwatta-maruf-1997 p.38}"
  en: "Umar's letter to Abu Musa al-Ash'ari on the times of the prayers, including delaying the evening prayer as long as the people have not gone to sleep."
