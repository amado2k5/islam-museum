label: { ar: "الموطأ 7 — كتاب عمر إلى أبي موسى في المواقيت", en: "Muwatta 7", es: "Muwatta 7", fr: "Muwatta 7", ur: "موطا 7", tr: "El-Muvatta 7 — Ömer'in Ebu Musa'ya namaz vakitleri hakkında yazdığı mektup", id: "Al-Muwatta 7 — Surat Umar kepada Abu Musa mengenai waktu shalat" }
text: "وأخر العشاء ما لم تنم، وصل الصبح والنجوم بادية مشتبكة، واقرأ فيها بسورتين طويلتين من المفصل"
summary:
  ar: "أثر يرويه مالك عن عمه أبي سهيل نافع بن مالك عن أبيه مالك بن أبي عامر، في باب وقوت الصلاة: كتب عمر بن الخطاب إلى أبي موسى الأشعري يأمره أن يصلي الظهر إذا زالت الشمس، والعصر والشمس بيضاء نقية قبل أن تدخلها صفرة، والمغرب عند الغروب، وأن يؤخر العشاء ما لم يغلبه النوم، وأن يصلي الصبح والنجوم بادية مشتبكة ويقرأ فيها بسورتين طويلتين من المفصل. ويذكر المحقق أنه رواه عن مالك أبو مصعب الزهري وسويد بن سعيد وعبد الرزاق. {cite:muwatta-maruf-1997 p.37} {cite:muwatta-maruf-1997 p.38}"
  en: "Umar's letter to Abu Musa al-Ash'ari on the times of the prayers, including delaying the evening prayer as long as the people have not gone to sleep."
  es: "Carta de Umar a Abu Musa al-Ash'ari sobre los horarios de las oraciones, incluyendo el aplazamiento de la oración vespertina mientras la gente no se haya ido a dormir."
  fr: "Lettre d'Umar à Abu Musa al-Ash'ari concernant les horaires des prières, notamment le report de la prière du soir tant que les gens ne se sont pas endormis."
  ur: "عمر کا خط ابو موسیٰ اشعری کو نماز کے اوقات کے بارے میں جس میں شام کی نماز میں تاخیر کرنا بھی شامل ہے جب تک کہ لوگ سو نہیں رہے ہیں۔"
  tr: "Malik'in, amcası Ebu Suhayl Nafi' ibn Malik'ten, o da babası Malik ibn Abi 'Amir'den rivayet ettiği, namaz vakitleriyle ilgili bir rivayet: Ömer ibn el-Hattab, Ebu Musa el-Eş'ari'ye yazdığı mektupta, öğle namazını güneş en yüksek noktasına ulaştıktan sonra, ikindi namazını güneş henüz parlak ve açıkken, sararmaya başlamadan önce, akşam namazını gün batımında kılmasını, yatsı namazını uyku gelene kadar ertelemesini ve sabah namazını yıldızlar görünür ve iç içe geçmiş haldeyken, Kur'an'ın son bölümü olan Mufessal'dan iki uzun sure okuyarak kılmasını öğütlemiştir. Editör, bu rivayetin Malik'ten Ebu Mus'ab el-Zuhri, Suveyd ibn Sa'id ve Abd el-Razzaq tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.37} {cite:muwatta-maruf-1997 s.38}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas pamannya Abu Suhayl Nafi' ibn Malik, atas otoritas ayahnya Malik ibn Abi 'Amir, mengenai waktu shalat: Umar ibn al-Khattab menulis kepada Abu Musa al-Ash'ari yang menginstruksikan kepadanya untuk shalat Zuhur ketika matahari telah melewati puncaknya, Asar ketika matahari masih terang dan jernih sebelum mulai menguning, Maghrib saat matahari terbenam, menunda Isya hingga ia mengantuk, dan shalat Subuh ketika bintang-bintang masih terlihat dan saling bertautan, dengan membaca dua surah panjang dari Mufassal (bagian terakhir Al-Quran) di dalamnya. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab al-Zuhri, Suwayd ibn Sa'id, dan 'Abd al-Razzaq. {kutip:muwatta-maruf-1997 hal.37} {kutip:muwatta-maruf-1997 hal.38}"
