label: { ar: "الموطأ 2518 — مالك: جراح العبد بحسب ثمنه، وما سوى الخصال الأربع يُقدَّر بالنقص", en: "Muwatta 2518" }
summary:
  ar: "قال مالك: الأمر عندنا أن في موضحة العبد نصف عشر ثمنه، وفي منقلته العشر ونصف العشر من ثمنه، وفي مأمومته وجائفته في كل واحد منهما ثلث ثمنه. وفيما سوى هذه الخصال الأربع مما يصاب به العبد، ما نقص من ثمنه، ينظر في ذلك بعد ما يصح العبد ويبرأ، كم بين قيمته بعد الجرح وقيمته صحيحا قبله، ثم يغرم الذي أصابه ما بين القيمتين. {cite:muwatta-maruf-1997 p.433} {cite:muwatta-maruf-1997 p.434}"
