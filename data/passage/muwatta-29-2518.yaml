label: { ar: "الموطأ 2518 — مالك: جراح العبد بحسب ثمنه، وما سوى الخصال الأربع يُقدَّر بالنقص", en: "Muwatta 2518", es: "Muwatta 2518", fr: "Muwatta 2518", ur: "موطا 2518", tr: "El-Muvatta 2518 — Malik: Bir kölenin yaralanmalarının tazminatı, onun fiyatına göre belirlenir ve yukarıda belirtilen dört durum dışında kalan her şey, aradaki farka göre değerlendirilir.", id: "Al-Muwatta 2518 — Malik: Ganti rugi atas luka yang diderita seorang budak didasarkan pada harganya, dan segala sesuatu selain keempat hal yang disebutkan di atas dinilai berdasarkan selisihnya." }
summary:
  ar: "قال مالك: الأمر عندنا أن في موضحة العبد نصف عشر ثمنه، وفي منقلته العشر ونصف العشر من ثمنه، وفي مأمومته وجائفته في كل واحد منهما ثلث ثمنه. وفيما سوى هذه الخصال الأربع مما يصاب به العبد، ما نقص من ثمنه، ينظر في ذلك بعد ما يصح العبد ويبرأ، كم بين قيمته بعد الجرح وقيمته صحيحا قبله، ثم يغرم الذي أصابه ما بين القيمتين. {cite:muwatta-maruf-1997 p.433} {cite:muwatta-maruf-1997 p.434}"
  tr: "Malik şöyle dedi: Bizim uygulamamız şudur: Kölede kemiği açığa çıkaran bir yara için tazminat, fiyatının onda birinin yarısıdır; uzuv çıkığına neden olan bir yara için, fiyatının onda birinin yarısı; ve başa veya delici bir yara için, her biri için fiyatının üçte biri ödenir. Bu dört yara dışında köleye verilen diğer herhangi bir yaralanma için, köle iyileştikten sonra fiyatındaki azalma için tazminat belirlenir. Yaralanmadan sonraki değeri ile yaralanmadan önceki değeri arasındaki fark hesaplanır ve yaralanmaya neden olan kişi, iki değer arasındaki farktan sorumludur. {cite:muwatta-maruf-1997 s.433} {cite:muwatta-maruf-1997 s.434}"
  id: "Malik berkata: Praktik kami adalah bahwa untuk luka yang memperlihatkan tulang pada seorang budak, kompensasinya adalah setengah dari sepersepuluh harganya; untuk luka yang menyebabkan dislokasi anggota tubuhnya, sepersepuluh setengah dari harganya; dan untuk luka di kepala atau luka tembus, sepertiga dari harganya harus dibayarkan untuk masing-masing luka. Untuk cedera lain pada seorang budak selain keempat jenis luka tersebut, kompensasi atas penurunan harganya ditentukan setelah budak tersebut pulih dan sembuh. Selisih antara nilainya setelah cedera dan nilainya sebelum cedera dihitung, dan orang yang menyebabkan cedera tersebut bertanggung jawab atas selisih antara kedua nilai tersebut. {cite:muwatta-maruf-1997 p.433} {cite:muwatta-maruf-1997 p.434}"
