text: "سول الله م ، وأمر فقرىء فإذا فيه: «بسم الله الرحمن الرحيم. من محمد بن عبد الله، ورسوله إلى هرقل عظيم الروم: سلام على من اتبع الهدى. أما بعد، فإني أدعوك بدعاية الإسلام، أسلم تسلم، وأسلم يؤتك الله أجرك مرتين."
