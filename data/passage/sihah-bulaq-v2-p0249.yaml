text: |-
  ٢٣٨٠
  وصوته ويقال أيضاناتته يتشديد الميم فيجعل من المصاعف والنثيم صوت فيه ضعف كالانين
  يقال نأم يلتُم ونأمت القوس نتسما وسبعت تئيم الاسد ⁦(نجم)⁩ فحم الشيء ينهم بالضم فحوما
  ظهر وطلع يقال نحيم السسنّ والقرن والنيت ونجم الخارجىّ ونجمت ناسحة بموضع كذا أى
  نبغت وفلان منجم اليامال والضلالة بالفتح أى معدنه والمنهم يكسر اليم الحديدة المعترضة فى
  المبزات التي فيها المسان والنهم ألوقت المضروب ومنه سمى المهجم ويقال نجمت المال اذا
  أديتمنجوما قال زهير ينجمها قوم لقوم غرامة * ولم يهريق وابينهم حل ممحجم
  والنجم من النباث مالم يكن على ساق قال تعالى واليجم والشعر يسجدان والنجم المكوكب
  والنجم النرياوهواسم لهاعلم مثل زيد وعمرو فاذا قالوا طلع النجم يريدون التريا وان أخرجت
  منه الالف واللام تذكر والنجمة ضرب من النبت قال الشاءر
  أخدي جارظل بكدم نجمة • أيو كل بارات وجاركك سالم.
  وقولهم ليس اهذا الحديث فجم أى ليس له أصلى وأتجمت إلسماء ؟قبعت يقال أيجمت أياما
  ثم أنجمت وأنجم البرد وأنجم المطر أقلع وقال
  أنجمت قزة الشماء وكانت •. قد أقامت بكابة وقطار
  ه لهيم الزجير والتنمح وقد غم الرجل ينهم بالكسر فهو نحام قال طرفة
  أرى قبرغام بخيل بعماله • كقبرغوى فى البطالة مفد
  والنهام أيضاطائرأحر على خلقة الاوز وقال له بالفارسية سرخ آوي والنهام أيضا إمم
  فرس سليك بن السلكة العدى عن الاصمعى فى كتاب الفرس ⁦( خم)⁩ النخامة بالضم
  النخاعة يقال تنضم الرحل اذا نخع ( تدم.ندم على مافعل ندما وندامة وتندّم مثله وفى
  الحديث الندم توية وأندمه الله فقدم ورجل ندمان أى نادم ويقال المين حنث أومندمة
  قال ليدد •ولم يتق هذا الدهرفى العيش منسدما• ونادمنى فلان على الشراب فهوندي
  وندمانى قال الشاعر
  فان كنت ندمانى فبالا كبراسقف. • ولا تسقنى بإلاصغر المتئلم
  وجع النديم ندام وجع الندمان ندامى وامر أة ندماتة والنساء ندامى أيضاو يقال المنادمة
  مقلوية من المدامنة لانه يد من شرب الشراب مع نديمه لان القلب فى كلامهم كنير كالقسى
  من القؤس وحذب وجبذوما أطيبه وأيطبه وخنز اللحم وخزن وواحدوحاد ⁦( سم)⁩
  النسيم الروح الطيبة بقال منه نسمت الريح نسيما ونسمانا وذم الرمح أوله احين تقبل بلبن
  قبل أن تشتدومنه الحديث بعنت فى نسم الساعة أى حين أبتدأت وأقبلت أوائلها والنسم
  أيضاجع نتهة وهى النفر والربو وفى الحديث تنكبوا الغبارفذه تكون النسمة والنسمة
  الانسان وتنسم أى تنفس وفى الحديث لما تنسمواروح الحمياة أى وجد وانسيمها وناسمه
  أى شاقه والمنسيم يكسر الين خف البعير قال الكساق هو مشتق من الفعل يقال نسم به
  بنسم نسعا وقال الاصمعى" قالوا منسم النعامة كما قالوامنسم اليعير ويقال أيضا من أين منستهك
  أى من أين وجهتكِ شم) نتم اللهم تنشيما اذا تغيروايتدأت فيعرائحة كريهة يقال
  يدى من الجبن وغحوه تشعة ونقم القوم فى الاحى أيضا إذا أخذوافيه ولا يكون الافى الشهر
