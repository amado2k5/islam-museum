text: "حَدَّثَنَا أَحْمَدُ بْنُ مَنِيعٍ، حَدَّثَنَا قُرَّانُ بْنُ تَمَّامٍ الأَسَدِيُّ، وَمَرْوَانُ بْنُ مُعَاوِيَةَ، وَيَزِيدُ بْنُ هَارُونَ، عَنْ سَعِيدِ بْنِ عُبَيْدٍ الطَّائِيِّ، عَنْ عَلِيِّ بْنِ رَبِيعَةَ الأَسَدِيِّ، قَالَ مَاتَ رَجُلٌ مِنَ الأَنْصَارِ يُقَالُ لَهُ قَرَظَةُ بْنُ كَعْبٍ فَنِيحَ عَلَيْهِ فَجَاءَ الْمُغِيرَةُ بْنُ شُعْبَةُ فَصَعِدَ الْمِنْبَرَ فَحَمِدَ اللَّهَ وَأَثْنَى عَلَيْهِ وَقَالَ مَا بَالُ النَّوْحِ فِي الإِسْلاَمِ أَمَا إِنِّي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1000، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1000 (The Book on Jana''iz (Funerals)), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "جامع الترمذی۔ کی حدیث نمبر 1000، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Jami' al-Tirmidhi, n° 1000, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Jami' al-Tirmidhi, n.º 1000, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Cami' el-Tirmizi'nin 1000 numaralı hadisinde, ölen kişi için ağlamak veya ağıt yakmak ve bunun sınırları ele alınmaktadır. Bu derleme, ağıt ve yas tutma üzerine en meşhur sözleri, Kur'an'dan, Sünnet'ten, Peygamberimizin hayatından, Sahabeler ve onların haleflerinden rivayetlerden ve diğer ilgili kitaplardan metinlerle birlikte bir araya getirmektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1000, membahas tentang menangisi orang yang meninggal atau meratap dan batas-batasnya. Kitab ini mengumpulkan ucapan-ucapan paling terkenal tentang elegi dan ratapan, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, riwayat dari para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
