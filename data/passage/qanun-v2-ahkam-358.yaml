text: "… الباب الذي قبله، ويخرج حتى يتغير لونه، فإنه يدلّ على أن المؤذي من الدم قد استفرغ. واعلم أن أشدّ دم البدن سواداً ما كان قريباً من مثل هذا الورم. على أن مراعاة القوة في ذلك واجبة، فربما لم ترخص القوة …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 358، يرد فيه ذكر الواجب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 358, whose wording mentions the obligatory (wajib), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج2، ص 358 کا اقتباس جس میں واجب، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Canon de Medicine, vol. 2 de Ibn Sina, p. 358, dont le texte mentionne l'obligatoire (wajib), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Canon de Medicine, vol. 2 de Ibn Sina, p. 358, cuyo texto menciona lo obligatorio (wajib), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
