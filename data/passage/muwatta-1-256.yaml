label: { ar: "الموطأ 256 — ابن بحينة: قام من الركعتين فلم يجلس وسجد قبل السلام", en: "Muwatta 256", es: "256 copias", fr: "256 exemplaires", ur: "256 کاپیاں", tr: "El-Muvatta 256 — İbn Buhayna: İki rekat namazdan sonra oturmadan ayağa kalktı ve selam vermeden önce secde etti.", id: "Al-Muwatta 256 — Ibnu Buhaina: Dia berdiri setelah dua rakaat tanpa duduk dan bersujud sebelum taslim." }
text: "صلى لنا رسول الله ركعتين ثم قام فلم يجلس، فقام الناس معه، فلما قضى صلاته ونظرنا تسليمه كبر ثم سجد سجدتين وهو جالس قبل التسليم ثم سلم"
summary:
  ar: "أول حديث في باب من قام بعد الإتمام أو في الركعتين. يرويه يحيى عن مالك عن ابن شهاب عن الأعرج عن عبد الله بن بحينة: صلى بهم النبي ركعتين ثم قام فلم يجلس للتشهد فقام الناس معه، فلما قضى صلاته وانتظروا تسليمه كبّر فسجد سجدتين وهو جالس قبل التسليم ثم سلم. ويخرّجه المحقق عند البخاري (1224) وأبي داود (1034) والنسائي (3/19) وأحمد والدارمي والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (10/183). {cite:muwatta-maruf-1997 p.152}"
  id: "Hadits pertama dalam surah ini tentang orang yang berdiri setelah menyelesaikan salat atau selama dua rakaat pertama. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari al-A'raj, dari Abdullah ibn Buhaynah: Nabi (shalawat dan salam kepadanya) memimpin mereka dalam dua rakaat, kemudian berdiri tanpa duduk untuk tasyahhud. Orang-orang pun berdiri bersamanya. Ketika beliau selesai salat dan mereka menunggu taslimnya, beliau mengucapkan takbir dan melakukan dua sujud sambil duduk sebelum taslim, kemudian beliau memberikan taslim. Editor memasukkannya dalam kumpulan al-Bukhari (1224), Abu Dawud (1034), al-Nasa'i (3/19), Ahmad, al-Darimi, dan al-Shafi'i melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (10/183). {mengutip:muwatta-maruf-1997 hal.152}"
