label: { ar: "الموطأ 256 — ابن بحينة: قام من الركعتين فلم يجلس وسجد قبل السلام", en: "Muwatta 256" }
text: "صلى لنا رسول الله ركعتين ثم قام فلم يجلس، فقام الناس معه، فلما قضى صلاته ونظرنا تسليمه كبر ثم سجد سجدتين وهو جالس قبل التسليم ثم سلم"
summary:
  ar: "أول حديث في باب من قام بعد الإتمام أو في الركعتين. يرويه يحيى عن مالك عن ابن شهاب عن الأعرج عن عبد الله بن بحينة: صلى بهم النبي ركعتين ثم قام فلم يجلس للتشهد فقام الناس معه، فلما قضى صلاته وانتظروا تسليمه كبّر فسجد سجدتين وهو جالس قبل التسليم ثم سلم. ويخرّجه المحقق عند البخاري (1224) وأبي داود (1034) والنسائي (3/19) وأحمد والدارمي والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (10/183). {cite:muwatta-maruf-1997 p.152}"
