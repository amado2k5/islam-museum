label: { ar: "سنن أبي داود 2898 — الأب والأبوة", en: "Sunan Abi Dawud 2898 — the father and fatherhood", ur: "سنن ابی داؤد 2898 — باپ اور والدیت" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ صَالِحٍ، وَمَخْلَدُ بْنُ خَالِدٍ، - وَهَذَا حَدِيثُ مَخْلَدٍ وَهُوَ الأَشْبَعُ - قَالَ حَدَّثَنَا عَبْدُ الرَّزَّاقِ حَدَّثَنَا مَعْمَرٌ عَنِ ابْنِ طَاوُسٍ عَنْ أَبِيهِ عَنِ ابْنِ عَبَّاسٍ قَالَ قَالَ رَسُولُ اللَّهِ \" اقْسِمِ الْمَالَ بَيْنَ أَهْلِ الْفَرَائِضِ عَلَى كِتَابِ اللَّهِ فَمَا تَرَكَتِ الْفَرَائِضُ فَلأَوْلَى ذَكَرٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2898، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2898 (Shares of Inheritance (Kitab Al-Fara'id)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2898، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
