text: "… منسوب إِلى العرب وهم خلاف العجم. والعرب أَقسام: عاربة وعرب وهم الخُلَّص، وهم تسع قبائل من ولد إِرَم ومن ولد سام بن نوح عليه وعلى نبينا الصلاة والسلام وهي: عاد وثمود وأُمّيْم وعبيد وطَسْم، بطاء مفتوحة فسين ساكنة مهملتين، وجَدِيس، …"
