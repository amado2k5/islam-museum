text: "… الاستسقاء لبرد المثانة. وأمراض المثانة تكثر في الشتاء، وقد تعالج أيضاً بمثل ما يعالج به الكلية، وبأدوية أقوى وأنقى تكون مشروبة ومزرقة، ومرّوخات، وضمّادات يضمّد بها الحالبان، وتحت السرّة، وفي الدرزين الفردين، وأوجاع المثانة، وتكثر في الأهوية، والرياح، والبلدان الشمالية، …"
summary:
