text: |-
  •⁦(قعا)⁩,
  ٥٣٥
  صيت أظفارى بالتشديد بعى قصصت وقال الكسائى أظنه أراد أخذت من أقاصها قال
  وقالت امر أة لا خرى ان ولدلك ابن فقصى أذنيه أى احذ فى منهما ويقال فلان بالمكان الاقصى
  والناحية القصوى والقصي بالضم فيهما ونزلنا منز لالا يقصيه البصرأى لا يبلغ قصاه
  واستقصى فلان فى المسئلة وتقصى بمعنى وقصى مصغراسم رجل والنسبة اليه قصوى
  تحذف احدى الياءين وتقلب الاخرى ألفائم تقلب واواكما قلبت فى عدوىّ وأموى
  ضى القضاء الحكم وأصلد قضاى لانه من قضيت الاأنّ اليا ء اءت بعد الالف همزت
  والجمع الاقضية والقضية مثله والمع القضايا على فعالى وأصله فعائل وقضى أى حكم ومنه
  قوله تعالى وقضى ريك ألا تعيدوا الااياه وقد يكون بعنى الفراغ تقول قضيت حاجتى وضريه
  فتضى عليسه أى قتله كأنه فرغ منه وسمّ قاض أى قاتل وقضى نحبه قضاء أى مات وقد
  يكون؟دنى الاداه والانهاء نقول قضيت دين ومنه قوله تعالى وقضينا الى بنى اسراتيل فى
  الكتاب وقوله تعالى وقضينا اليه ذلل الامر أى أنهيناه البسه وأبلغناه ذلك وقال الفراء فى
  قوله تع-لى ثم اقضوا الى يعنى امضوا الىّ كما يقال قضى فلان أى مات رمضى وقد يكون
  بعنى الصنع والتقدبر قال أبوذؤيب
  وعليهما مسرودتان قضاهما • داودأ وصنع السوابع نبع
  قال قضاء آى صسنعه وقدره وصنه قوله تعالى فقضاهن سبع "عوات فى يومين ومن-
  القضاء والقدرويقال استقضى ذلان أى صير قاضيا وقضى الامير قاضيا كما نقول أمّرأميزا
  وانقضى الشىء وتقضى بمعنى واقتضى دينموتقاضاه بمعنى وقضوا ينه-م منايا يالتشديد أى
  أذغذوها وقضى اللبانة أيضا بالتشديد وقضاها بالتخفيف يمعنى والقضاء من الدروع المحكمة
  ويقال الصلبة قال النابغة• ونسج سليم كل قضاء ذائل» وتقضى البازى أى انقض*
  وأصله تقضض فما كثرت الضادات أبدات من احداهنّ ياء قال العجاج .
  نقضى إلمازى اذا البازى كسر* والقضة مخففة نبت يذبت فى السهل وهى مفقوصة قال:
  أبو عبيد هى من الحض والهاءعوض وقضة أيضا موضع كانت به وقعة تح_لاق اللعم ويجمع
  على قضاة وقضين ( قطا القطاجع قطاقوقطوات قال الكسائىّ وربمافالواقطيات
  ولهيات فى جمع لهاة الانسان لان فعلت منهماليس بكثير فيجعلون الالف التى أصلها وا وياء
  قلتها فى الفعل قال ولا يقولون فى غزوات غزيات لان غزوت أغزوكثير معروف فى الكلام وفى
  المثل ليس قطامثل قطى أى ليس الاكابر كالاصاغرورياض القطاموضع وقال
  فاروضة من رياض القطا * ألث جم اعارض عمطر
  والقطاة مقعد الردف وهو الرديف قال امر والقيس * كأنّ مكان الردف منهعلى رأل
  يصفه باشراف القطاة والرأل فرخ النعام والقطو مقادية الخطومع النشاط يقال منه قطافى
  شيته يقطوواقطوطى مثله فهو قطوان بالتحريك وقطوطى أيضاء-لى فعوعل لانه ليس
  فى الكلام ف« ولى وفيه فعوعل مثل عثوثل وكساء قطوانى" وقطوان موضع بالكوفة⁦( قعا)⁩.
  أقعى السكلب اذا جلس على استه مفترشا رجليه وناصبايديه وقدجاء النهى عن الاقعاءفى
  الص_لاة وهو أن يضع أليتيه على عقبيه بين السيجدتين وهذا تفسير الفقهاه فأمّا أهل اللغة
