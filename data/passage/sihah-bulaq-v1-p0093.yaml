text: |-
  الجزة بالتحر بك بمع حاجز أى
  مائع اه مترجه
  ٥٤٨
  ⁦( باب الطاء)⁩
  قال أعشى باهلة لا تأمن البازل الكوما ضربته • بالمشر فى اذا ما اجرقط السفر
  خطط الخط واحد انخطوط وانخط أيضاموضع باليماءة وهوخط هجرتنسب اليه
  الرماح الظطية لانها تحمل من بلاد الهندفتة وم به والخط خط الزاجر وه و أن يخط بأصسيها
  فى الرمسل ويزجروخط بالقلم أى كتب وكساء مخطط فيه خطوط والخطوط بفتح انلحاء البو
  الوحشى الذى يخط الارض بأطراف أظلافه وانططة بالسكسر الارض يختطها الرجل لنف)
  وهو أن يعلم عليه ما علامة بانظط ليعلم أنه قد احتازها ليبنيهادارا ومنه خطط الكوفة والبصرة
  واختط الغلام أى نبت هذاره والحخط بالكسر عود يخفا به والحخطاطعوديسوّى عليه انططوط
  وانخطسة بالضم الاهر والقضة قال تأبطشرا
  هما خطتا إمّا اسارومنة • وإمادم والقتل بالحر أجدر
  أراده_ ما خطتان فحذف النون استخفا فا يقال جاءوفى رأسه خطة أى جاء وفى نفسه حاجة
  قد عزم عليها والعامة تقول خطية وفى حديث قيلة أيلام ابن هسذه أن يفصل الخطة ويقتصر
  من وراه الجزة أى انه اذا نزل به أمر ملإس من-كل لا يهتدى له انه لا يعيابه والكنه يفصه
  -ي يبرمه ويرج منه وقوله -م خطة ناقية أى مة صد بعيدوة ولهم خذخطة أى خذخطة
  الانتصاف ومعناه انتصف وقوله-م قيح اللّٰه معزى خيرها خطة قال الاصمعى خطة اسم عنز
  وكانت عنزسو وانخطة أيضااسم من انخط كالنة طة من النقط وقولهم ماخط غياره أى
  ماشه والخطيطة الارض التى لم غطر بين أرضين مطورتين والمع الخطائط وأنشدأبو عبيدة
  على قلاص تختطى الظطائطا ومنه قول ابن عباس رضى اللّه عنه حين سئل عن وجل
  جعل أمى احر أنه بيدها فطلقته ثلا ناخط اللّٰه نوأها ألا طلقت نفسها ثلا ثا ويروى أيضاخطاً
  اللّٰه نوأها بالهمزأى أخطاها المطر (خلط، خلطت الشى يغسيره خلطا فا ختلطا وخااطه
  مخالطة وخلاطاواختلط فلان أى فسدعة له والتخليط فى الاهر الافسادفيه وقواهم
  وقعواف الخليطى مثال السميهى أى اختلط عليهم أمره-م والخليط المخالط كالنديم المنادم
  والجليس الجااس وهو داحد وججع وقال
  ان انخليط أجدوا البين فانصرموا وقد
  يجمع على خلطاء وخلط قال وعلة الجرمى
  سائل مجادر جوم هل جنيت لهم • حرباتقزق بين الجبرة انخاط
  وانما كثر ذلك فى أشعارهم لانهم كانوا ينتجعون أيام الكلافيجتمع منهم قبائل شق فى مكان
  واحدفتقع بينهم ألفة فاذا اقترقواورجعوا الى أوطانهم سامهم ذلك وأما الحديث لاخلاط
  ولا وراط فيقال هو كة ولد لا يجمع بين مته رق ولاية رق بين مجتمع خشبة الصدقة
  قال أبو عبيدة تنازع العجاج وحيد الارقط أرجوزتينءلى الطاءفقال حيد الحلاط
  يا أبا الشعنا. فقال العجاج الفجاج أوسع من ذُلكيا ابن أخى أى لا تخاط أرجوزن بأرجوزتك
  والخاطة بالضم المشركة وإظخاطة بالصك سر العشرة والخلط أيضاواحد أخلاط الطيب
  وانخلط أيضا السهسم الذرنت ءوده على عوج فلايزال يتعوج وان قوم ورجسل مخاط
  كسرالميم يخبالط الامورية سال فلان مخلط مزيل كمايقال هوراتق فاتق واستخاط
  البعير أى قعا وأخلطه صاحبه اذا جعل تضيبه فى الحياء والجليط من العلف قت وتبن
