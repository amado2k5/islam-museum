text: "ما بينهما من رفع وخفض، إن ما أنبأتك لحق، ما فيه من أمض (١)، فلما فرغ من مسألتهما جهز بنيه وأهل بيته إلى العراق، وكتب لهما إلى ملك فارس (٢)، وهو شابور (٣) فأسكنهم الحيرة. (١) أمض : شك، بلغة حمير، وقال"
