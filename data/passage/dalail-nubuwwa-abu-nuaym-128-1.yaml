  ur: "ابو نعیم کی دلائل النبوۃ سے ایک اقتباس، چوسرو کے ساتھ خط و کتابت میں، اخذ کردہ کاپی سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "Kisra'nın yazışmalarında yer alan Ebu Nuaym'ın Peygamberliğin Alametleri adlı eserinden, kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanan bir bölüm."
