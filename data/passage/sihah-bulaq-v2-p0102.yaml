text: |-
  •ركام،
  ٤A0
  ⁦( رغا)⁩ الرغاءصوت ذوات الخفة وقدرغا البعيرير غورغاء اذاضيج وفى الثل كفى برغاتها
  مناديا آى ان رعا بميره يقوم مقام ندانه فى التعرّض للضافة والقرى وقدرعى اللين رغية
  أى أزبدومنه قواهم كلام مرغ اذالم يفصم عن معناه ويقال أيضا أمست ابلهم ترغى وتنشف
  أى لها تشافة ورغوة حكاء يعقوب والمرغاة فى تؤخذيه الرغوة والرغوة فيهاثلاث لغات
  رغوة ورغوة ورغوة وحكى السكسر فيها الكحيانى وغيره وهو زيد اللبن والج-ع رغا وكذلك
  رغاية اللميز بالضم والياءورغادة الابن بالمكسمر والواو وممع آبو المهدىّ الواوفى الضم واليا.
  ف المكسر وارتغيت شربت الرغوة وفى المثل يسة حسسوا فى ارتغاء يضرب لمن يظاهر أمر
  ويريد غيره قال الشعبى لمن سأله عن رجل قبل أتم امر أته يسرّ حسوا فى ارتفاء وقد حرمت
  عليه امر أنه وناقة رغوّ على فعول أى كثيرة الرغاء وأرغبته أنا حلته على الرغاء قال الشاءر
  أبيغى آل شداد علينا • ومارغى لشداد فصيل
  يقول هم أشهاهلا يفتّقون بين الفصيل وأه بنحرولاهبة وتراغوا اذارغا واحد ههنا وواحد
  ههنا وفى الحديث اتهم واللّٰه تراغوا عليه فقتاوه وقولهم ماله ثاغية ولا راغية أى مالدشاة
  ولا ناقة ويقال أيضا أتتسمفا أثخى ولا أرغى أى لم يعط شاة ولاناقة كماية سال ما أحشى ولا
  أجل ⁦(رفا)⁩ رفوت التوب أرفوميممز ولايهمزورفوت الرجل سكنته من
  ارعب قال ابو خراش الهذلى واسمه خويلد
  رفونى وقالوايا خويادلم تزع • فقلت وأنكرت الوجوه هموهمو
  والمرافاة الاتفاق والاتتحام قال الشاءر
  ولما أن رأيت أبارويم • يرافيق ويكره أن يلاما
  والرفاه الالتهام والاتفاق ويقال رفيته ترفية اذاقات للمتزقح بالرفاء والبنين قال ابن
  السكيت وان شئت كان معناه بالسكون والطمأنينة من قواهم رقوت الرجسل اذا سكنته
  ( رقى رقيت فى السلم بالكسر وقيا ورقيا اذا صعدت وارتقيت مثله والمرقاة بالفتح الدرجة
  ومن كسرها نبهها بالاكة التى يعمل بها و من فتح قال هذاء وضع يفعل فيه فجعله بفتح الميم
  مخالفاعن يعقوب ورقى عليه كلاما ترقية اذ ارفع وترقى فى العلم أى رقى فيه درجة درجة
  والرقوة دعص من رمل وقولهم ارق على ظلعك أى امش واصعد بقدر ما تطيق ولا تحعل
  ء-لى نفسسك مالا تطيقه والرقية معروفة والجمع وقى:قول منه استرقيته فرقانى رقية فهو!
  راق وقول الراجز
  لقدعات والاجلّ الباقى • أن لإتردَ القدر الرواقى
  كانه جمع امرأة راقية أورجلا راقية بالهاء للمبالغة ورقية اسم احر أة وعبد اللّٰه بن قيس
  الرقيات انما أضيف قيس اليهن لانه تزوج عدّة نسوة وافق أسماوهنّ كامن رقسة قدب
  اليهنْ هذا قول الاصمعى" وقال غيره انه كانت له عسدة جدّات أسما وهنّ كلهن رقية فلهذا
  قيل قديمر ابن الرقيات ويق ال انما أضيف اليهن لانه كان يشبب بعدّة نساه يسمين رقية والرقىّ
  موضع ⁦(ركا)⁩ الركية البئروجعهاركى وركايا والركوة التى اللاء والجمع ركاء وركوات
  بالتحريك وفى المئسل صارت الوس ركوة يضرب فى الادبار وانقلاب الامور والركاء بالتتح
  M٢S
