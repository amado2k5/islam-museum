text: "… مُتْ مِنْ لَيْلَتِكَ، مُتَ عَلَى بِنْتَ أَبِي سَلَمَةَ؟. قَالَتْ: نَعَمْ، قال رَسُولُ اللَّهِ :. بَنْتَ أُمَّ سَلْمَةَ؟. قُلْتُ: نَعَمْ، قال: بَنْتُ عَمْرِوه أوْ أخْتُ عَمْرِو، فَقَالَ: بَنْو عَبْدٍ الأشْهَل. قَالُوا: بُنيّ الإسْلامُ عَلَى خَمْس، شَهَادَةٍ أنْ لا إلَهَ إلا اللَّهُ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 1846، يذكر ما بُني عليه الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 1846, that mentions what Islam is built on; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
