  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Jilid 1, halaman 446, yang membahas amalan wajib, amalan yang diperbolehkan, dan amalan yang dilarang; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
