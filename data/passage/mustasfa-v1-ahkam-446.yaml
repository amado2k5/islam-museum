text: "… ذلك. مسألة: ما لا يتم الواجب إلا به، هل هو واجب والخلاف في ذلك. عنهما، لكن الحرام الأجنبية، والمنكوحة حلال. رد الغزالي على ذلك. مسألة: الزيادة على أقل الواجب، هل توصف بالوجوب. - مسألة: الواجب يباين الجواز والإباحة. مسألة: الجائز …"
summary:
  ar: "مقطع من المستصفى للغزالي، الجزء الأول، ص 446، يرد فيه ذكر الواجب، والوجوب، والمباح، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, vol. 1, p. 446, whose wording mentions the obligatory (wajib), obligation (wujub), the permitted (mubah), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
