label: { ar: "الموطأ 740 — مالك: أربعة أوسق من التمر وأربعة من الزبيب وأربعة من الحنطة وأربعة من القطنية لا يجمع بعضها إلى بعض", en: "Muwatta 740" }
summary:
  ar: "أول نص في باب ما لا زكاة فيه من الثمار. يقول مالك: إن الرجل إذا كان له ما يجذ منه أربعة أوسق من التمر وما يقطف منه أربعة أوسق من الزبيب وما يحصد منه أربعة أوسق من الحنطة وأربعة أوسق من القطنية، فإنه لا يُجمع عليه بعض ذلك إلى بعض، وليس عليه في شيء من ذلك زكاة حتى يبلغ الصنف الواحد منه خمسة أوسق بصاع النبي، كما قال النبي إنه لا صدقة فيما دون خمسة أوسق من التمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.368} {cite:muwatta-maruf-1997 p.369}"
