label: { ar: "الموطأ 740 — مالك: أربعة أوسق من التمر وأربعة من الزبيب وأربعة من الحنطة وأربعة من القطنية لا يجمع بعضها إلى بعض", en: "Muwatta 740", es: "Muwatta 740", fr: "Muwatta 740", ur: "موطا 740", tr: "Al-Muwatta 740 — Malik: Dört ölçek hurma, dört ölçek kuru üzüm, dört ölçek buğday ve dört ölçek baklagiller; bunların hiçbiri birbirine karıştırılmamalıdır.", id: "Al-Muwatta 740 — Malik: Empat wasq kurma, empat wasq kismis, empat wasq gandum, dan empat wasq kacang-kacangan, yang tidak boleh dicampur satu sama lain." }
summary:
  ar: "أول نص في باب ما لا زكاة فيه من الثمار. يقول مالك: إن الرجل إذا كان له ما يجذ منه أربعة أوسق من التمر وما يقطف منه أربعة أوسق من الزبيب وما يحصد منه أربعة أوسق من الحنطة وأربعة أوسق من القطنية، فإنه لا يُجمع عليه بعض ذلك إلى بعض، وليس عليه في شيء من ذلك زكاة حتى يبلغ الصنف الواحد منه خمسة أوسق بصاع النبي، كما قال النبي إنه لا صدقة فيما دون خمسة أوسق من التمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.368} {cite:muwatta-maruf-1997 p.369}"
  tr: "Zekât verilmeyen meyveler bölümündeki ilk metin şöyledir: Malik şöyle der: Bir kimse dört vask verecek kadar hurma, dört vask verecek kadar kuru üzüm, dört vask verecek kadar buğday ve dört vask verecek kadar baklagil üretirse, bunları birleştirmemeli ve her bir tür beş vask'a ulaşana kadar hiçbirinden zekât ödemekle yükümlü değildir. Peygamberimiz beş vask'tan az hurmadan zekât alınamayacağını buyurmuştur. Editör, bunu Ebu Musab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.368} {cite:muwatta-maruf-1997 s.369}"
  id: "Teks pertama dalam bab tentang buah-buahan yang tidak dikenakan zakat. Malik berkata: Jika seseorang memiliki cukup kurma untuk menghasilkan empat wasq, kismis untuk menghasilkan empat wasq, gandum untuk menghasilkan empat wasq, dan kacang-kacangan untuk menghasilkan empat wasq, maka ia tidak boleh menggabungkan semuanya, dan ia tidak wajib membayar zakat atas salah satu dari semuanya, sampai setiap jenis mencapai lima wasq, diukur dengan sa' Nabi, sebagaimana Nabi bersabda bahwa tidak ada zakat atas kurma yang kurang dari lima wasq. Editor menyebutkan bahwa Abu Mus'ab meriwayatkan ini dari Malik. {cite:muwatta-maruf-1997 p.368} {cite:muwatta-maruf-1997 p.369}"
