text: "… عَنِ ابْنِ شِهَابٍ، عَنْ قَبِيصَةَ بْنِ ذُؤَيْبٍ، أَنَّ رَجُلاً، سَأَلَ عُثْمَانَ بْنَ عَفَّانَ عَنِ الأُخْتَيْنِ، مِنْ مِلْكِ الْيَمِينِ هَلْ يُجْمَعُ بَيْنَهُمَا فَقَالَ عُثْمَانُ أَحَلَّتْهُمَا آيَةٌ وَحَرَّمَتْهُمَا آيَةٌ فَأَمَّا أَنَا فَلاَ أُحِبُّ أَنْ أَصْنَعَ ذَلِكَ. قَالَ فَخَرَجَ مِنْ عِنْدِهِ فَلَقِيَ رَجُلاً مِنْ أَصْحَابِ رَسُولِ اللَّهِ فَسَأَلَهُ عَنْ ذَلِكَ فَقَالَ لَوْ كَانَ لِي مِنَ الأَمْرِ شَىْءٌ ثُمَّ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1125، يذكر كتاب الأعمال والملائكة الكاتبون. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 1125 (Marriage), that speaks of the record of deeds and the recording angels. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 1125، جس میں نامۂ اعمال اور لکھنے والے فرشتے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
