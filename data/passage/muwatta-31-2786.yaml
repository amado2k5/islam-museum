summary:
  ar: "يروي مالك عن أبي حازم بن دينار، عن سهل بن سعد الساعدي أن النبي قال: إن كان في شيء شؤم ففي الفرس والمرأة والمسكن. {cite:muwatta-maruf-1997 p.566}"
  tr: "Malik, Ebu Hazim ibn Dinar'dan, o da Sahl ibn Sa'd el-Sa'idi'den rivayetle, Peygamberimizin şöyle buyurduğunu nakletmiştir: \"Eğer bir şeyde uğursuzluk varsa, o da atta, kadında ve evdedir.\" {cite:muwatta-maruf-1997 s.566}"
  id: "Malik meriwayatkan dari Abu Hazim ibn Dinar, dari Sahl ibn Sa'd al-Sa'idi, bahwa Nabi bersabda: \"Jika ada pertanda buruk pada sesuatu, maka itu ada pada kuda, wanita, dan tempat tinggal.\" {cite:muwatta-maruf-1997 p.566}"
