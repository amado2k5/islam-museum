label: { ar: "سنن ابن ماجه 3431 — كتابة الحسنات", en: "Sunan Ibn Majah 3431 — the writing of good deeds", ur: "سنن ابن ماجہ 3431 — نیکیوں کا لکھا جانا", es: "Sunan Ibn Majah 3431 — El registro de las buenas obras", fr: "Sunan Ibn Majah 3431 — la rédaction des bonnes actions", tr: "Sunan İbn Majah 3431 — İyi amelleri yazmak", id: "Sunan Ibn Majah 3431 — Mencatat amal kebaikan" }
text: "… كَمَا يَلَغُ الْكَلْبُ وَلاَ يَشْرَبْ بِالْيَدِ الْوَاحِدَةِ كَمَا يَشْرَبُ الْقَوْمُ الَّذِينَ سَخِطَ اللَّهُ عَلَيْهِمْ وَلاَ يَشْرَبْ بِاللَّيْلِ مِنْ إِنَاءٍ حَتَّى يُحَرِّكَهُ إِلاَّ أَنْ يَكُونَ إِنَاءً مُخَمَّرًا وَمَنْ شَرِبَ بِيَدِهِ وَهُوَ يَقْدِرُ عَلَى إِنَاءٍ يُرِيدُ التَّوَاضُعَ كَتَبَ اللَّهُ لَهُ بِعَدَدِ أَصَابِعِهِ حَسَنَاتٍ وَهُوَ إِنَاءُ عِيسَى ابْنِ مَرْيَمَ إِذْ طَرَحَ الْقَدَحَ فَقَالَ أُفٍّ هَذَا مَعَ الدُّنْيَا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3431، يذكر كتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3431 (Chapters on Drinks), that speaks of the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3431، جس میں نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3431 (Capítulos sobre las bebidas), que habla de la escritura de las buenas acciones. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3431 (Chapitres sur les boissons), mentionne la consignation des bonnes actions. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui recensent, inscrivent, effacent ou pèsent une action."
  tr: "İbn Majah'ın Sünen'inde yer alan 3431 numaralı hadiste, iyi amellerin kaydedilmesinden bahsedilir. Bu hadis, iyi ve kötü amellerin listesini ve bu amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3431, menyebutkan pencatatan amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
