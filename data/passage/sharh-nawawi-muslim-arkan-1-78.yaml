  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 78. sayfasından bir alıntı, İslam'ı namaz, zekât, oruç ve Hac gibi ibadetlerle, ayrıca iman ikrarı, namaz ve zekâtla tanımlar. Bu alıntı, kaynak yönergelerine uygun olarak yaklaşık kırk kelime alıntılanarak, makine tarafından okunabilir baskıdan alınmıştır. İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 1, halaman 78, mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat. Kutipan ini diambil dari edisi yang dapat dibaca mesin, dengan sekitar empat puluh kata yang dikutip sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
