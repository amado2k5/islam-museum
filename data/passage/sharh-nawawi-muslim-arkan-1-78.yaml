text: "… آخر كلام أبن بطال. وقال الشيخ الإمام أبو عمرو بن الصلاح: قوله : الإسلام أن تشهد أن لا إله إلا اللّٰه وأن محمداً رسول اللّٰه ل وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت إن استطعت إليه سبيلا. والإيمان أن …"
