label: { ar: "صحيح البخاري 1699 — ما حُرّم", en: "Sahih al-Bukhari 1699 — what was made unlawful", ur: "صحیح بخاری 1699 — جو حرام کیا گیا" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، حَدَّثَنَا أَفْلَحُ بْنُ حُمَيْدٍ، عَنِ الْقَاسِمِ، عَنْ عَائِشَةَا ـ قَالَتْ فَتَلْتُ قَلاَئِدَ هَدْىِ النَّبِيِّ ثُمَّ أَشْعَرَهَا وَقَلَّدَهَا ـ أَوْ قَلَّدْتُهَا ـ ثُمَّ بَعَثَ بِهَا إِلَى الْبَيْتِ، وَأَقَامَ بِالْمَدِينَةِ، فَمَا حَرُمَ عَلَيْهِ شَىْءٌ كَانَ لَهُ حِلٌّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1699، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1699 (Hajj (Pilgrimage)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1699، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
