label: { ar: "مسلم 2560 — لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال", en: "Muslim 2560 — A Muslim may not forsake his brother beyond three nights", es: "Muslim 2560 — Un musulmán no puede abandonar a su hermano más de tres noches.", fr: "Muslim 2560 — Un musulman ne peut abandonner son frère plus de trois nuits.", ur: "مسلم 2560 - مسلمان اپنے بھائی کو تین راتوں سے زیادہ نہیں چھوڑ سکتا", tr: "Müslim 2560 — Bir Müslümanın kardeşini üç geceden fazla terk etmesi caiz değildir.", id: "Muslim 2560 — Tidak diperbolehkan bagi seorang Muslim untuk meninggalkan saudaranya lebih dari tiga malam" }
text: "قال رسول الله: «لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام»"
summary:
  ar: "رواية أبي أيوب الأنصاري في باب تحريم الهجر فوق ثلاث بلا عذر من صحيح مسلم؛ يحدد غاية الهجر المشروع ويجعل بادئ السلام خير المتلاقيين."
  tr: "Sahih Müslim'de mazeretsiz olarak üç günden fazla süreyle görüşmeyi bırakmanın yasaklanması bölümünde Ebu Eyyub el-Ensari'nin rivayeti, görüşmeyi başlatanın, görüşenler arasında en hayırlısı olduğunu belirler."
  id: "Riwayat Abu Ayyub al-Ansari dalam bab tentang larangan berlama-lama lebih dari tiga hari tanpa alasan yang sah dalam Sahih Muslim menetapkan batasan berlama-lama yang diperbolehkan dan menjadikan orang yang memulai salam sebagai orang terbaik di antara mereka yang bertemu."
