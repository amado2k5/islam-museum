label: { ar: "مسلم 2560 — لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال", en: "Muslim 2560 — A Muslim may not forsake his brother beyond three nights" }
text: "قال رسول الله: «لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام»"
summary:
  ar: "رواية أبي أيوب الأنصاري في باب تحريم الهجر فوق ثلاث بلا عذر من صحيح مسلم؛ يحدد غاية الهجر المشروع ويجعل بادئ السلام خير المتلاقيين."
