label: { ar: "مسلم 2347 — صفة خلقه ومبعثه وسنه عند الوفاة", en: "Muslim 2347 — His appearance, mission age, and age at death" }
text: "قال أنس: كان رسول الله ليس بالطويل البائن ولا بالقصير، وليس بالأبيض الأمهق ولا بالآدم، ولا بالجعد القطط ولا بالسبط؛ بعثه الله على رأس أربعين سنة، فأقام بمكة عشر سنين وبالمدينة عشر سنين، وتوفاه الله على رأس ستين سنة، وليس في رأسه ولحيته عشرون شعرة بيضاء"
summary:
  ar: "رواية أنس بن مالك في باب صفة النبي ومبعثه وسنه من كتاب الفضائل في صحيح مسلم؛ الوصف الجسدي الكامل مع مبعثه على رأس الأربعين وإقامته بمكة والمدينة عشراً عشراً ووفاته على رأس الستين — النص الجامع للشمائل والسيرة."
