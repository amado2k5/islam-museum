text: "قال أنس: كان رسول الله ليس بالطويل البائن ولا بالقصير، وليس بالأبيض الأمهق ولا بالآدم، ولا بالجعد القطط ولا بالسبط؛ بعثه الله على رأس أربعين سنة، فأقام بمكة عشر سنين وبالمدينة عشر سنين، وتوفاه الله على رأس ستين سنة، وليس في رأسه ولحيته عشرون شعرة بيضاء"
summary:
  ar: "رواية أنس بن مالك في باب صفة النبي ومبعثه وسنه من كتاب الفضائل في صحيح مسلم؛ الوصف الجسدي الكامل مع مبعثه على رأس الأربعين وإقامته بمكة والمدينة عشراً عشراً ووفاته على رأس الستين — النص الجامع للشمائل والسيرة."
  tr: "Sahih Müslim'in Faziletler Kitabı'ndaki Peygamberin tasviri, görevi ve yaşı bölümünde Enes bin Malik'in rivayeti; kırk yaşında tebliğ edilmesi, Mekke ve Medine'de onar yıl kalması ve altmış yaşında vefat etmesiyle birlikte eksiksiz fiziksel tasviri; özelliklerinin ve biyografisinin kapsamlı metni."
  id: "Riwayat Anas bin Malik dalam bab tentang deskripsi, misi, dan usia Nabi dari Kitab Keutamaan dalam Sahih Muslim; deskripsi fisik lengkap dengan misi beliau pada usia empat puluh tahun, masa tinggal beliau di Mekah dan Madinah selama sepuluh tahun berturut-turut, dan wafat beliau pada usia enam puluh tahun — teks komprehensif tentang karakteristik dan biografi beliau."
