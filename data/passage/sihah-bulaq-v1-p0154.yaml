text: |-
  ⁦(فصل الم١)⁩
  ⁦(حشس)⁩
  ٤٨٧
  يش ياشت الة_درتجيش أى غلت وجاشت نفسى أى غنت ويقال دارت للغنيان
  فان أردت أنها ارتفعت من حزن أوفزع قلت جشات وجاش الوادى زخر واممة
  جدا والجيس واحد الجيوش يقال جيش فلان أى يمع الجيوش واستجاشه أى طلب
  منه جينا
  صل احاء يش لحيش والجبشة جنس من الودان والجمع الحيسانمثل
  حل وحلان وأحبتت المرأة بولدها اذاجاءت به حبشى اللون ويقال حبش قومه تحييشا
  أى جعهم والحباشة بالضم الجماعة من الناس ليسوا من قبيلة واحدة وكذلك
  الاحبوش والاحابيش قال العجاج
  كأَنّ صيران المها الاخلاط • بالرمل أحبوش من الأنساط
  والتحبس التجمع وحبشت له حباشة اذا جمعت له شيئا والتحيش مثله قال رؤية
  لولاحباشات من التحبيش • لصية كافرخ العشوش
  وحبيش طائر معروف بامصغرامثل المكميت والكعيت وحبشى جبل بأسفل مكة بقال
  ،نمسمى أحابيش قريش وذلك ان بن المصطلق وبنى الهوت بن خزيمة اجتمعواعنده فى الفوا
  قربشا وتحالفوا بالله اظاليد على غيرنا ماسه اليسل ووضح نهاروما أرسى حبسى مكانه فسموا
  حاييش قريش باسم الجبل ( ترش الحتروش القصيروة ولهم ما أحسن حتارش الصبى
  أحركاته وسمعت للمجراد حترشة اذاسمعت صوت أكله وتحترش القوم حشدوا ،⁦(حوش)⁩
  حرش الضب يحرشه حرشاماده فهو حارش للضباب وهو أن يحرك يده على حجره ليظنه حية
  فيخرج ذنبه ليضر بها فيأخذه وحية حرشاء بيئة الحرش اذا كانت خشنة الجلد قال الشاعر
  بحرشا مطحان كأن فحمتها • اذا فزعت ماءهريق على جر
  والجريسْ نوع من الحيات أرقط ودينار أحرش أى فيه حشونة والضب أحرش ونقبسة
  حرشاء رهي الباقرة التى لم تطل قال المشاعر
  و-تى كأنى يتقى بى معبد * به نقبة حرشاه لم تلق طاليا
  والإحرشاء أيضاضرب من النبات قال أبو النجم
  وانحت من حرشاء فلج خردله • وأقبل النمل قطاراتنقله
  والتحريشْ الاغراء بين القوم وكذلك بين الكلاب والحرش الاثر وابهع حراش ومنه ربغى بن
  حراش ولا تقل خراش وحرشه بالحاء والخامجميعاحرشاأى خدشه قال العجاج
  كأن أصوات كلاب تهترش • هاحت بولوال ونخت فى حرش
  فركد للضرورة والحرشون حسكة صغيرة صلبة تتعلق بصوف المشاة قال الشاعر
  كما تطايرهندوف الحراشين وحريش قبيلة من بنى عامى والحريش داية لهامخالب كذالب
  الاسدوله اقرن واحد فى هامتها يسميم الناس الكركدن ⁦(حرفس)⁩ الاسمعى احرتفش
  اذاتهيأللغضب والشر حكاه عنه أبوعبيد وربماجاء بالحةً والخاجبعا ⁦(حشش)⁩
  حششت النار أحشهاحشا أوقدتها والحش والحشر البستان والجمع الحشان منل ضيف
  وضيفان والحش والحش أيضا المخرج لانهسم كانوا يقضون حوايجهم فى البساتين والجمع
