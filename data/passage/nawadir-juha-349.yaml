text: "… أخاف أن تدركه رقة فيسجد سافر جحا، ذات يوم إلى إحدى المدن، ونزل في أحد خاناتها ففي اليوم التالي قال لقيِّم الخان : يا أخي، إنِّي أسمع، طوال الليلِ، قرقعةً في سقف الغرفة التي نِمْتُ فيها فيا ليتك تأتي بنجارٍ …"
summary:
  ar: "سمع جحا صريراً في السقف فطلب من مدير الخان أن يستدعي نجاراً، فقال المدير إن الصوت هو تسبيح السقف لله، فقال جحا إنه يخاف أن يؤدي التسبيح بالسقف إلى أن يسجد. {cite:juha-nawadir-kubra-djuwaydi p. 173}"
  en: "Juha hears creaking in the roof and asks the inn manager to send for a carpenter; the manager says the noise is the roof praising God; Juha says he fears that God's praise will make the roof prostrate itself. {cite:juha-nawadir-kubra-djuwaydi p. 173}"
  ur: "جحا نے چھت میں چرچراہٹ سنی اور سرائے کے منتظم سے کہا کہ بڑھئی بلوائے، منتظم نے کہا کہ یہ آواز چھت کی اللہ کی تسبیح ہے، تو جحا نے کہا کہ اسے ڈر ہے کہ یہ تسبیح چھت کو سجدے میں گرا دے گی۔ {cite:juha-nawadir-kubra-djuwaydi p. 173}"
  fr: "Juha entend craquer le toit et demande au gérant de l'auberge de faire venir un charpentier ; le gérant dit que ce bruit est la louange de Dieu par le toit ; Juha dit qu'il craint que cette louange ne pousse le toit à se prosterner. {cite:juha-nawadir-kubra-djuwaydi p. 173}"
  es: "Juha oye crujir el techo y pide al encargado de la posada que llame a un carpintero; el encargado dice que el ruido es la alabanza del techo a Dios; Juha dice que teme que esa alabanza haga que el techo se postre. {cite:juha-nawadir-kubra-djuwaydi p. 173}"
