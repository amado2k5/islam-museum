text: |-
  ٣٨٠
  ⁦(باب الرام)⁩
  سقاهم يقال اللهمّ غرنا بخير وغرنا يخير قال الفترّاء قد غار الغيث الارض يغيرها أى سقاها قال
  وغارنا اللّٰه بخير كة ولك أعطاناخيرا قال أبو ذؤيب
  وماحل البخق عام غياره • عليه الوسوق برّها وشغيرها
  وأرض مغيرة بفتح الميم ومغيورة أى مسقية وغايرت الرح-ل مغايرة أى عارضته بالبيع
  وبادلته وتغايرت الاشياء اختلفت والغيار البدال قال الشاءر الاعشى
  فلا تحبن لكم كافرا ولا تحسبى أريد الغيارا
  وقواه-م نزل القوم يغيرون أى يصلهون الرحال وغير بمعنى سوى والجمع أغياروهى كلمة
  يوصف بها ويستثنى فان وصفت بها أتبعتها اعراب ما قبلها وان استئنيت بها أعر بتها
  بالاعراب الذى يجب للاسم الواقع بعد الاوذلك أن أصل غسيرصفة والاستثناوعارض قال
  الفرّا بعض بنى أسد وقضاعة ينصبون غيرا اذا كان فى معسنى إلا تم السكلام قبلها أو لم يتم"
  يقولون ماجاءنى غيرك وماجاءنى أحدغيرك وقد تكون غير بمعنى لافتنصبها على المال
  كقوله تعالى فن اضطرغيرباغ ولاعاد كأنه قال فن اضطرجائعالا يا غيا وكذلك قوله غير
  ناظرين إناه وقوله غير محلى السيد
  صل الفاء أر الفأرمهموزبجع فأرة ومكان فثر كثير الفأروأرض مفأرة
  ذات فأر والفأرة ريح تجتمع فى رسغ البعيرفاذامست انفشت وقارة المسك غيرمهموزة
  النافجة وفأرة الابل أن تفوح منها رائحسة طيبة وذلك اذارعت العشب وزهره ثم شربت
  وصدرت عن الماهنديت جلودها ففاحت منهارائحة طيبة فيقال لتلك فأرة الابل عن
  يعقوب قال الراعى يصف ابلا لها فأرة ذفراه كل عشية • كمافتق المكافور بالمسلك فاتقه
  تر) الفترة الانكسار والضعف وقد فتر الحرّوغيره يفترفتوراوفتره اللّٰه تفتيرا والفسترة
  ما بين الرسولين من رسل اللّٰه عز وجلّ وطرف فاتراذ الم يكن حديدا والفترما بين طرف
  السبابة والاجمام اذاقحتهما وأماقول الشاعر أصرمت حبل الودّمن قتر فهواسم امرأة
  تكر قواهم لقيت منه الفتكرين والفتكرين بكسر الفاء وضمها والتاء مفتوحة
  والنون للجمع وهى الشدائد والدواهى (فث%€ %لفاتور انحوان يتخذمن الرحام ونحوه قال
  الاغلب العجلى اذا انجلى فاتورعين الشمس • يقال هم على فاتور واحد أى على مائدة
  واحدة ومنزلة واحدة وفاثور الذى فى شعر لبيداسم موضع ⁦(فجر)⁩ فجرت الماء أفجره بالضم
  فجرافا نفجر أى يجسته فانيجس وفجرته شدد للكثرة فتفجر والفجرة بالضم موضع تفتح الماء
  ومفاجر الوادى مرافضه حيث يرفض اليه السيل ومنفجر الرمل طريق يكون فيه والفجر
  فى آخر الليل كالشغق فى أوله وقد أفجرنا كما تقول أصبحنا من الصبح وفى كلام بعضهم
  كنت أحل إذا أسحرت وأرحل اذا أفجرت والفجار يوم من أيام العرب وهى أربعة
  أفجرة كانت بين قريش ومن معها من كتانة وبين قيس عيلان فى الجاهلية وكانت الديرة على
  قيس وانما-عمت قريس هذه الحرب فج ار الانها كانت فى الاشهر الحرم فلما قاتلوا فيها قالواقد
  فجر نافسميت فجاراوفجر فجورا أى فسق وفي رأى كذب وأصله الميسل والفاجر المائل
  قال لبدد يخاطب عمه أبامالك
  مقلت
