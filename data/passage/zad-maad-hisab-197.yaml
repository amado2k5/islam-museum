text: "… استحبابُ صومه وهذا بعيد، فإن النبي في حتّهم على صيامه، وأخبر أن صومه يُكفر السنة الماضية [مسلم: ٢٧٤٤]، واستمر الصحابةُ على صِيامه إلى حين وفاته، ولم يُرْوَ عنه حرف واحد بالنهى عنه وكراهة صومه، فعُلِمَ أن الذي تُرِكَ وجوبُه لا …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 197، يذكر مغفرة الذنب؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 197, that speaks of forgiveness of sins; from the extracted copy, quoted within forty words per the sources policy."
