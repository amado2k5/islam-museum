label: { ar: "الموطأ 347 — عمر يفقد سليمان بن أبي حثمة في الصبح: لأن أشهد الصبح أحب إلي من قيام ليلة", en: "Muwatta 347" }
text: "لأن أشهد صلاة الصبح في الجماعة أحب إلي من أن أقوم ليلة"
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن أبي بكر بن سليمان بن أبي حثمة، في باب ما جاء في العتمة والصبح: فقد عمر بن الخطاب سليمان بن أبي حثمة في صلاة الصبح، فغدا إلى السوق، ومسكن سليمان بين السوق والمسجد النبوي، فمرّ على أمه الشفاء فسألها، فأخبرته أنه بات يصلي فغلبته عيناه، فقال عمر إن شهود صلاة الصبح في الجماعة أحب إليه من أن يقوم ليلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.191} {cite:muwatta-maruf-1997 p.192}"
