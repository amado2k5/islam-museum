label: { ar: "الموطأ 347 — عمر يفقد سليمان بن أبي حثمة في الصبح: لأن أشهد الصبح أحب إلي من قيام ليلة", en: "Muwatta 347", es: "Muwatta 347", fr: "Muwatta 347", ur: "موطا 347", tr: "El-Muvatta 347 — Ömer, sabah namazında Süleyman ibn Abi Hatme'yi özlüyor: \"Sabah namazına şahit olmak, bütün gece namaz kılmaktan daha değerlidir benim için.\"", id: "Al-Muwatta 347 — Umar merindukan Sulayman ibn Abi Hathma saat subuh: “Menyaksikan salat subuh lebih kusukai daripada berdiri salat sepanjang malam.”" }
text: "لأن أشهد صلاة الصبح في الجماعة أحب إلي من أن أقوم ليلة"
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن أبي بكر بن سليمان بن أبي حثمة، في باب ما جاء في العتمة والصبح: فقد عمر بن الخطاب سليمان بن أبي حثمة في صلاة الصبح، فغدا إلى السوق، ومسكن سليمان بين السوق والمسجد النبوي، فمرّ على أمه الشفاء فسألها، فأخبرته أنه بات يصلي فغلبته عيناه، فقال عمر إن شهود صلاة الصبح في الجماعة أحب إليه من أن يقوم ليلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.191} {cite:muwatta-maruf-1997 p.192}"
  tr: "Malik'in, İbn Şihab'dan, Ebu Bekir ibn Süleyman ibn Ebu Hatme'den rivayet ettiği, gece namazı ve sabah namazı hakkında rivayet edilenler bölümünde yer alan bir rivayet: Ömer ibn el-Hattab, sabah namazında Süleyman ibn Ebu Hatme'yi özledi ve ertesi sabah çarşıya gitti. Süleyman'ın evi çarşı ile Mescid-i Haram arasındaydı. Annesi Şifa'nın yanından geçerken ona Süleyman'ı sordu. Annesi, Süleyman'ın gece namaz kıldığını ve uyuyakaldığını söyledi. Ömer, cemaatle sabah namazı kılmanın, gece namazı kılmaktan daha çok sevdiğini söyledi. Editör, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.191} {cite:muwatta-maruf-1997 s.192}"
  id: "Sebuah riwayat yang diceritakan oleh Malik, berdasarkan riwayat Ibn Shihab, dari Abu Bakr ibn Sulayman ibn Abi Hathmah, dalam bab tentang apa yang diriwayatkan mengenai salat malam dan salat subuh: Umar ibn al-Khattab merindukan Sulayman ibn Abi Hathmah pada salat subuh, sehingga ia pergi ke pasar keesokan paginya. Tempat tinggal Sulayman berada di antara pasar dan Masjid Nabi. Ia melewati ibunya, al-Shifa', dan menanyakan kabarnya. Ibunya mengatakan bahwa Sulayman telah menghabiskan malam dengan salat dan tertidur. Umar berkata bahwa menghadiri salat subuh berjamaah lebih dicintainya daripada salat sepanjang malam. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya berdasarkan riwayat Malik. {cite:muwatta-maruf-1997 p.191} {cite:muwatta-maruf-1997 p.192}"
