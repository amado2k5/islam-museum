label: { ar: "الموطأ، كتاب الصلاة", en: "Muwatta, Book of Prayer", es: "Muwatta, Libro de Oración", fr: "Muwatta, Livre de prières", ur: "موطا، دعا کی کتاب", tr: "El-Muvatta, Dua Kitabı", id: "Al-Muwatta, Kitab Doa" }
summary:
  ar: "كتاب الصلاة، أول كتب الموطأ في رواية يحيى بن يحيى الليثي عن مالك، في طبعة بشار عواد معروف (1997): 590 نصاً في 139 باباً، من الصفحة 33 إلى الصفحة 303 من ملف PDF المجلد الأول. يبدأ بمواقيت الصلاة، ثم أبواب الطهارة والوضوء والغسل والتيمم والحيض، ثم النداء وافتتاح الصلاة والقراءة والتشهد والسهو، ثم الجمعة وصلاة الليل والوتر والجماعة والقصر والجمع، ثم العيدان وصلاة الخوف والكسوف والاستسقاء والقبلة ومسجد النبي وخروج النساء إلى المساجد، ثم أبواب القرآن وسجود التلاوة والذكر والدعاء، ويختم بالنهي عن الصلاة بعد الصبح وبعد العصر. {cite:muwatta-maruf-1997 p.33} {cite:muwatta-maruf-1997 p.303}"
  en: "The Book of Prayer, first book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 590 reports in 139 babs, PDF pp. 33–303 of volume 1, from prayer times and purity through recitation, Friday, night prayer, travel, the two Eids, the qibla, the Qur'an, dhikr and du'a."
  es: "El Libro de la Oración, primer libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 590 informes en 139 babs, PDF pp. 33–303 del volumen 1, desde los horarios de oración y la pureza hasta la recitación, el viernes, la oración nocturna, los viajes, los dos Eids, la qibla, el Corán, el dhikr y la du'a."
  fr: "Le Livre de la Prière, premier livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 590 rapports dans 139 babs, PDF pp. 33–303 du volume 1, des heures de prière et de la pureté à la récitation, le vendredi, la prière de nuit, les voyages, les deux Aïds, la qibla, le Coran, le dhikr et la du'a."
  ur: "نماز کی کتاب، یحییٰ بن یحییٰ کی تجدید میں موطا کی پہلی کتاب ⁦(ایڈ. معرف 1997)⁩: 139 باب میں 590 رپورٹیں، پی ڈی ایف صفحہ 33-303 جلد 1، نماز کے اوقات اور تلاوت کے ذریعے طہارت، جمعہ، رات کی نماز، سفر، دو عیدیں، دعائیں اور دعائیں۔"
  tr: "Yahya ibn Yahya al-Laythi'nin Malik'ten rivayet ettiği Al-Muwatta'nın ilk kitabı olan Dua Kitabı, Beşar Awad Maruf'un (1997) baskısında yer almaktadır: 139 bölümde 590 metin, 1. Cilt PDF dosyasının 33. sayfasından 303. sayfasına kadar. Namaz vakitleriyle başlar, ardından temizlik, abdest, gusül abdesti, kuru abdest ve adet dönemi bölümleri gelir, sonra ezan, namazın başlangıcı, kıraat, iman şahadeti ve unutkanlık, ardından Cuma namazı, gece namazı, vitr namazı, cemaat namazı, namazların kısaltılması ve birleştirilmesi, ardından iki bayram namazı, korku namazı, tutulma namazı, yağmur namazı, kıble, Peygamber Mescidi ve kadınların mescide gitmesi bölümleri gelir, ardından Kur'an, secde, Allah'ı anma ve dua bölümleri gelir. Fecir ve ikindi namazından sonra kılınmasının yasaklanmasıyla sona eriyor. {cite:muwatta-maruf-1997 s.33} {cite:muwatta-maruf-1997 s.303}"
  id: "Kitab Shalat, kitab pertama Al-Muwatta' menurut riwayat Yahya ibn Yahya al-Laythi dari Malik, dalam edisi Bashar Awad Maruf (1997): 590 teks dalam 139 bab, dari halaman 33 hingga halaman 303 dari file PDF Volume 1. Dimulai dengan waktu-waktu shalat, kemudian bab-bab tentang penyucian, wudhu, mandi ritual, wudhu kering, dan haid, kemudian azan, pembukaan shalat, bacaan Al-Quran, syahadat, dan lupa, kemudian shalat Jumat, shalat Idul Adha, shalat Witir, shalat berjamaah, mempersingkat dan menggabungkan shalat, kemudian dua shalat Id, shalat ketakutan, shalat gerhana, shalat memohon hujan, arah kiblat, Masjid Nabi, dan wanita yang pergi ke masjid, kemudian bab-bab tentang Al-Quran, sujud membaca Al-Quran, zikir kepada Allah, dan doa, dan diakhiri dengan larangan shalat setelah Subuh dan setelah Asar. {kutip:muwatta-maruf-1997 hal.33} {kutip:muwatta-maruf-1997 hal.303}"
