summary:
  ar: "كتاب الصلاة، أول كتب الموطأ في رواية يحيى بن يحيى الليثي عن مالك، في طبعة بشار عواد معروف (1997): 590 نصاً في 139 باباً، من الصفحة 33 إلى الصفحة 303 من ملف PDF المجلد الأول. يبدأ بمواقيت الصلاة، ثم أبواب الطهارة والوضوء والغسل والتيمم والحيض، ثم النداء وافتتاح الصلاة والقراءة والتشهد والسهو، ثم الجمعة وصلاة الليل والوتر والجماعة والقصر والجمع، ثم العيدان وصلاة الخوف والكسوف والاستسقاء والقبلة ومسجد النبي وخروج النساء إلى المساجد، ثم أبواب القرآن وسجود التلاوة والذكر والدعاء، ويختم بالنهي عن الصلاة بعد الصبح وبعد العصر. {cite:muwatta-maruf-1997 p.33} {cite:muwatta-maruf-1997 p.303}"
  en: "The Book of Prayer, first book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 590 reports in 139 babs, PDF pp. 33–303 of volume 1, from prayer times and purity through recitation, Friday, night prayer, travel, the two Eids, the qibla, the Qur'an, dhikr and du'a."
