label: { ar: "مسلم 1349 — العمرة إلى العمرة كفارة لما بينهما والحج المبرور ليس له جزاء إلا الجنة", en: "Muslim 1349 — Umrah to umrah expiates between them; accepted hajj's only reward is Paradise", es: "Muslim 1349 — La Umrah a la Umrah expía entre ellas; la única recompensa del Hajj aceptado es el Paraíso.", fr: "Muslim 1349 — L'accomplissement d'une umra expie entre elles; la seule récompense du hajj accepté est le Paradis", ur: "مسلم 1349 - عمرہ تا عمرہ ان دونوں کے درمیان کفارہ ہے۔ قبول حج کا واحد بدلہ جنت ہے۔", tr: "Müslim 1349 — Umre üstüne umre yapmak, aralarındaki günahların kefaretidir ve kabul edilen haccın mükafatı cennetten başka bir şey değildir.", id: "Muslim 1349 — Melaksanakan Umrah setelah Umrah adalah penebusan atas dosa-dosa yang terjadi di antara keduanya, dan tidak ada pahala bagi haji yang diterima kecuali surga." }
text: "قال رسول الله: «العمرة إلى العمرة كفارة لما بينهما، والحج المبرور ليس له جزاء إلا الجنة»"
summary:
  ar: "رواية أبي هريرة في كتاب الحج من صحيح مسلم؛ وفي إسناد الباب «الغازي في سبيل الله والحاج والمعتمر وفد الله؛ دعاهم فأجابوه وسألوه فأعطاهم»."
  tr: "Sahih Müslim'deki Hac Kitabı'nda Ebu Hurayra tarafından rivayet edilmiştir; ve ilgili bölümün rivayet zincirinde şöyle geçmektedir: \"Allah yolunda savaşan, hacı olan ve umre yapan kişi Allah'ın misafirleridir; Allah onları çağırdı, onlar da O'na cevap verdiler, O'ndan istediler, O da onlara verdi.\""
  id: "Riwayat Abu Hurairah dalam Kitab Haji dari Sahih Muslim; dan dalam rantai periwayatan surah: “Pahlawan di jalan Allah, orang yang berziarah, dan orang yang melaksanakan umrah adalah tamu-tamu Allah; Dia memanggil mereka dan mereka menjawab-Nya, dan mereka meminta kepada-Nya dan Dia memberi mereka.”"
