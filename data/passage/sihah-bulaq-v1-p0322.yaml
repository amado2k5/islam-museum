text: |-
  ⁦(دعثر)⁩
  ٣١٩
  سلام الاله وريجانه ورحته وسماءدرر
  غمام ينزل رزق العبا دفأ حيا البلادوطاب الشجر
  أى ذات درروسماء مدرار أى تدرويقال ه_ماءلى دررواحد بالفتح أى على قصدواحد
  ونحن على دررالطريق أى على قصده ودرر الريمح أيضامهبها ودر الضرع باللبن يدردرورا
  ودرت حلوبة المسلمين أى فيتهم وأدرت الناقة فهى مدر اذادرابنها والريح تدر
  المصاب وتستدره أى تستعلبه وقال
  بفريض سارية أدرته الصبا • من ما أ-جرطيب المستنقع
  ومنه قواه م بين عينيهء رق يدره الغضب ويقسال يحترّكه قال أبو محمد الاموى استدرت المعزى
  أرادت الفحل ويقال أيضا استذرت المعزى استذراء من المعتل بالذال المعجمة والدودو
  مغارز أسنان الصىّ وفى المشل أعييننى بأشرفكيف بدردر والجمع الدرادر ودردر
  السبي البسرة لاكها والدرد ارضرب من الشجر والدردور الماء الذى يدور ويخاف فيسه
  الغرق وقولهم ده درّين وسعد القين من أسماء الكذب والباطل ويقال أصله ان سعد القين
  كان رحلا من العجم يدور فى مخاليف اليمن يعمل لهم فاذا كسد عمل قال بالفارسية ده بدرور
  كأنه يودّع القرية أى أنا خارج غداوانما يقول ذلات ليستعمل فعر بته العرب وضربوابه
  المثل فى السكذب وقالوا اذاسمعت بسرى القين فانه مصبح ⁦(دسر)⁩ الدسار واحد الدسر
  وهى خيوط تشتبها ألواح السفينة ويقال هى المامير وقوله تعالى على ذات ألواح
  ودسرود سرأيضا مثل عسر وعسر قال بشر
  معبدة السقائف ذات دسر * مضبرة جوانبهارداح
  والدسر الدفع قال ابن عباس رضى اللّٰه عنهما فى العنبر انما هوشئ يدسره البدرد سرا أى يدفعه
  ودسره بالرمح ورجل مدسر والدوسر الجمل الضخم والانثى دوصرة قال عدى
  واقد عديت دوسرة • كعلاة القين مذكارا .
  وجسل دوسرى كأنه منسوب اليه ودوسرانى أيضًا ودوسراسم كتيبة كانت
  لمنعمان بن المنذر قال الشاعر
  ضربت دوسرفيهم ضرية • أثبتت أوتادملك فاستقر
  ⁦( دعو )⁩ الدعر بالتحريك الفاد والدعرأ يضا مصدرقولك دعر العود بالمكسر يدعر
  دعرافهوعود دعر أى ردى، كثير الدخان ومنه أخذت الدعارة وهى الفسق والجبث يقال
  هو خبيث داءر بين الدءر والدعارة والمرأة داعرة عن أبى عمرو وداء رأيضا اسم فحل منجب
  تذسب اليه الداعرية من الابل وحكى الغنوى عوددعر مثال صرد وأنشد
  يحمان فحماجيد اغيردءر • أسود صلالا كاعبان البقر
  والزند الادءر الذى قدح به مرارافاحترق طرفه فسارلايورى عثر الدعثرة الهدم
  والمدعثر المهدوم وفى الحديث لا تقتلوا أولادكم سرّا انه ليدرك الفارس فيد عنره أى يهدمه
  ويطحطهه يعنى بعد ما صاررجلا والدعنور الحوض المنثلم وقال الشاعر
  وقان على الفردوس أول مشرب • أجل جيران كانت أبيحت دعائره
