label: { ar: "الموطأ 1694 — نافع عن ابن عمر: بنت سعيد بن زيد كانت تحت عبد الله بن عمرو بن عثمان، فطلقها البتة فانتقلت، فأنكر ذلك عليها عبد الله بن عمر", en: "Muwatta 1694", es: "Muwatta 1694", fr: "Muwatta 1694", ur: "موطا 1694", tr: "El-Muvatta 1694 — Nafi'nin İbn Ömer'den rivayet ettiğine göre: Sa'id ibn Zayd'ın kızı Abdullah ibn Amr ibn Uthman ile evliydi, ancak Abdullah ibn Amr onu geri dönülmez bir şekilde boşadı ve kız başka bir yere gitti. Abdullah ibn Umar bunu onaylamadı.", id: "Al-Muwatta 1694 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Putri Sa’id ibn Zayd menikah dengan Abdullah ibn Amr ibn Uthman, yang menceraikannya tanpa dapat ditarik kembali, sehingga ia pindah. Abdullah ibn Umar tidak menyetujui hal ini." }
summary:
  ar: "يروي مالك عن نافع أن بنت سعيد بن زيد بن عمرو بن نفيل كانت تحت عبد الله بن عمرو بن عثمان بن عفان، فطلقها البتة، فانتقلت، فأنكر ذلك عليها عبد الله بن عمر. {cite:muwatta-maruf-1997 p.93}"
  tr: "Malik, Nafi’den rivayetle, Sa’id ibn Zayd ibn ‘Amr ibn Nufayl’ın kızının ‘Abdullah ibn ‘Amr ibn ‘Uthman ibn ‘Affan’la evlendiğini, ancak ‘Abdullah ibn ‘Amr’ın onu geri dönülmez bir şekilde boşadığını ve bunun üzerine başka bir yere taşındığını, ‘Abdullah ibn ‘Umar’ın ise bunu onaylamadığını anlatır. {cite:muwatta-maruf-1997 s.93}"
  id: "Malik meriwayatkan dari Nafi’ bahwa putri Sa’id ibn Zayd ibn ‘Amr ibn Nufayl menikah dengan ‘Abdullah ibn ‘Amr ibn ‘Uthman ibn ‘Affan, yang kemudian menceraikannya tanpa dapat ditarik kembali. Ia kemudian pindah, dan ‘Abdullah ibn ‘Umar tidak menyetujui hal ini. {cite:muwatta-maruf-1997 p.93}"
