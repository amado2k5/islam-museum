label: { ar: "الموطأ 2390 — ابن شهاب عن أبي هريرة وزيد بن خالد: الأمة إذا زنت ولم تحصن", en: "Muwatta 2390" }
summary:
  ar: "حدث مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن أبي هريرة وزيد بن خالد الجهني أن النبي سئل عن الأمة إذا زنت ولم تحصن، فقال: إن زنت فاجلدوها، ثم إن زنت فاجلدوها، ثم بيعوها ولو بحبل. قال ابن شهاب: لا أدري أبعد الثالثة أو الرابعة. قال يحيى: سمعت مالكا يقول: والضفير الحبل. {cite:muwatta-maruf-1997 p.388} {cite:muwatta-maruf-1997 p.389}"
