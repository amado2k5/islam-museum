label: { ar: "الموطأ 2390 — ابن شهاب عن أبي هريرة وزيد بن خالد: الأمة إذا زنت ولم تحصن", en: "Muwatta 2390", es: "Muwatta 2390", fr: "Muwatta 2390", ur: "موطا 2390", tr: "El-Muvatta 2390 — İbn Şihab, Ebu Hurayra ve Zeyd ibn Halid'den rivayetle: Eğer bir cariye zina ederse ve evli değilse", id: "Al-Muwatta 2390 — Ibn Shihab berdasarkan riwayat Abu Hurayrah dan Zayd ibn Khalid: Jika seorang budak perempuan berzina dan belum menikah" }
summary:
  ar: "حدث مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن أبي هريرة وزيد بن خالد الجهني أن النبي سئل عن الأمة إذا زنت ولم تحصن، فقال: إن زنت فاجلدوها، ثم إن زنت فاجلدوها، ثم بيعوها ولو بحبل. قال ابن شهاب: لا أدري أبعد الثالثة أو الرابعة. قال يحيى: سمعت مالكا يقول: والضفير الحبل. {cite:muwatta-maruf-1997 p.388} {cite:muwatta-maruf-1997 p.389}"
  tr: "Malik, İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe'den, o da Ebu Hurayra ve Zeyd ibn Halid el-Cuhani'den rivayet ettiğine göre, Peygamberimize zina eden ve evli olmayan bir cariye hakkında soru soruldu. Peygamberimiz şöyle buyurdu: “Zina ederse, onu kırbaçlayın. Sonra tekrar zina ederse, onu kırbaçlayın. Sonra onu, bir ip karşılığında bile olsa, satın.” İbn Şihab dedi ki: “Üçüncü mü yoksa dördüncü seferden sonra mı olduğunu bilmiyorum.” Yahya dedi ki: “Malik'in şöyle dediğini işittim: ‘Ve o ipe deffir denir.’”"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Ubayd Allah ibn Abdullah ibn Utbah, dari Abu Hurayrah dan Zayd ibn Khalid al-Juhani, bahwa Nabi ditanya tentang seorang budak perempuan yang berzina dan belum menikah. Beliau bersabda: “Jika dia berzina, cambuklah dia. Kemudian jika dia berzina lagi, cambuklah dia. Kemudian juallah dia, bahkan hanya untuk seutas tali.” Ibn Shihab berkata: “Aku tidak tahu apakah itu setelah kali ketiga atau keempat.” Yahya berkata: “Aku mendengar Malik berkata: ‘Dan tali itu disebut daffir.’”"
