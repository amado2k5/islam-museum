text: "… الآتي ذكره في ثم ساق بإسناد غريب عن الحميري بن الحارث بن الكنى. عبد شمس عن أبيه أنه خرج إلى النبي ول فيه وكتب له - الحارث بن عبد عمرو بن معاذ بن يزيد بن كتاباً وأباحه وأصحابه من بلاد …"
summary:
