text: "… أو سَكَتَ عن إيجابِهِ فجمَعَهم ليُوجبوهُ، وفي هذا الوَجْهِ يَدخُلُ كُلُّ تَحريمٍ في دَمٍ أو إباحَتِهِ وكُلُّ تَحريمٍ في بُسرَةٍ أو إباحَتِها، وكُلُّ تَحريمٍ في فَرجٍ أو إباحَتِهِ، وكُلُّ تَحريمٍ في مالٍ أو إباحَتِهِ، وكُلُّ إيجابٍ حَدٍّ أو إسْقاطِهِ، وكُلُّ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 393، يرد فيه ذكر الوجوب، والمباح، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 393, whose wording mentions obligation (wujub), the permitted (mubah), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 393 کا اقتباس جس میں وجوب، مباح، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 393, dont le texte mentionne l'obligation (wujub), le permis (mubah), l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 393, cuyo texto menciona la obligatoriedad (wujub), lo permitido (mubah), la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 393. sayfasından, yükümlülük, izin verilebilirlik ve yasak konularını ele alan bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, yasak olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, hlm. 393, yang membahas kewajiban, hal yang diperbolehkan, dan hal yang dilarang; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
