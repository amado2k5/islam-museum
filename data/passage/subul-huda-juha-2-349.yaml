text: "… الديوان. فى الخشى وهاد به نال الهدى كل مهتد. رفيقَيْن قالا خَيْمَتَىْ أُمِّ مَعْبَدِ فأفلح من أَمْسَى رفيقَ مُحَمَّدٍ به من فَعالِ. لا تُجَارَى وسُودَدِ وَمْقَعدها للمؤمنين بِمَرْصَدِ فَإِنَّكُمُ إِن تسأَلوا الشاةَ تَشْهَدِ له بصريحِ ضَرَّةُ الشَّاةِ مُزْبِدِ يُردِّدُها فى …"
