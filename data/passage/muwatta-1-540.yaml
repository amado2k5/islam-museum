label: { ar: "الموطأ 540 — عمر وهشام بن حكيم في سورة الفرقان: إن هذا القرآن أنزل على سبعة أحرف", en: "Muwatta 540" }
text: "هكذا أنزلت؛ إن هذا القرآن أنزل على سبعة أحرف، فاقرؤوا ما تيسر منه"
summary:
  ar: "أول حديث في باب ما جاء في القرآن. يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عبد الرحمن بن عبد القاري، أنه سمع عمر بن الخطاب يقول: سمعت هشام بن حكيم بن حزام يقرأ سورة الفرقان [[passage/quran-25-1|الفرقان]] على غير ما أقرأنيها النبي، فكدت أن أعجل عليه ثم أمهلته حتى انصرف، ثم أخذته بردائه وجئت به النبي وأخبرته. فطلب النبي من هشام أن يقرأ فقرأ، فقال: هكذا أنزلت، ثم طلب من عمر أن يقرأ فقرأ، فقال: هكذا أنزلت، وأخبر أن القرآن أنزل على سبعة أحرف فليقرؤوا ما تيسر منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند أبي داود (1475)، والتنيسي عند البخاري (2419)، ويحيى بن يحيى النيسابوري عند مسلم (2/202)، والشافعي في الرسالة (752). {cite:muwatta-maruf-1997 p.277} {cite:muwatta-maruf-1997 p.278}"
