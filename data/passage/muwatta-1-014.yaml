label: { ar: "الموطأ 14 — عثمان يصلي الجمعة بالمدينة والعصر بملل", en: "Muwatta 14", es: "Muwatta 14", fr: "Muwatta 14", ur: "موطا 14", tr: "Al-Muwatta 14 — Osman, Medine'de Cuma namazını ve Malal'da ikindi namazını kılıyor.", id: "Al-Muwatta 14 — Uthman melaksanakan salat Jumat di Madinah dan salat Asar di Malal" }
summary:
  ar: "أثر يرويه مالك عن عمرو بن يحيى المازني عن ابن أبي سليط، في باب وقت الجمعة: صلى عثمان بن عفان الجمعة بالمدينة ثم صلى العصر بملل، وهو موضع على سبعة عشر ميلاً من المدينة في طريق مكة كما يبين المحقق. ويعلق مالك بأن ذلك كان لتبكيره بالجمعة في الهاجرة وسرعة سيره. {cite:muwatta-maruf-1997 p.41}"
  en: "Uthman ibn Affan prayed the Friday prayer at the earliest part of its time; Malik said that was because of the midday heat and to hasten the walk."
  es: "Uthman ibn Affan rezaba la oración del viernes en la primera parte de su horario; Malik dijo que eso se debía al calor del mediodía y a la necesidad de apresurar la caminata."
  fr: "Uthman ibn Affan a prié le vendredi au plus tôt de son heure; Malik a dit que c'était à cause de la chaleur de midi et pour hâter la marche."
  ur: "عثمان بن عفان نے جمعہ کی نماز اپنے وقت کے ابتدائی حصے میں پڑھی۔ ملک نے کہا کہ یہ دوپہر کی گرمی کی وجہ سے تھا اور پیدل میں جلدی کرنا تھا۔"
  tr: "Malik'in, Amr ibn Yahya al-Mazini'den, o da İbn Abi Sulayt'tan rivayet ettiği, Cuma namazının vakti bölümündeki bir rivayete göre: Osman ibn Affan, Cuma namazını Medine'de kıldıktan sonra, Mekke yolunda Medine'den on yedi mil uzaklıktaki Malal'da ikindi namazını kılmıştır. Araştırmacının açıkladığı gibi, Malik bunun sebebinin, öğle sıcağında Cuma namazını erken kılması ve hızlı yolculuğu olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.41}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Amr ibn Yahya al-Mazini atas otoritas Ibn Abi Sulayt, dalam bab tentang waktu shalat Jumat: Utsman ibn Affan melaksanakan shalat Jumat di Madinah, kemudian melaksanakan shalat Ashar di Malal, sebuah tempat yang berjarak tujuh belas mil dari Madinah di jalan menuju Mekah, sebagaimana dijelaskan oleh peneliti. Malik berkomentar bahwa hal ini disebabkan oleh pelaksanaan shalat Jumatnya yang lebih awal di tengah terik matahari dan perjalanannya yang cepat. {cite:muwatta-maruf-1997 p.41}"
