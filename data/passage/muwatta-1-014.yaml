label: { ar: "الموطأ 14 — عثمان يصلي الجمعة بالمدينة والعصر بملل", en: "Muwatta 14" }
summary:
  ar: "أثر يرويه مالك عن عمرو بن يحيى المازني عن ابن أبي سليط، في باب وقت الجمعة: صلى عثمان بن عفان الجمعة بالمدينة ثم صلى العصر بملل، وهو موضع على سبعة عشر ميلاً من المدينة في طريق مكة كما يبين المحقق. ويعلق مالك بأن ذلك كان لتبكيره بالجمعة في الهاجرة وسرعة سيره. {cite:muwatta-maruf-1997 p.41}"
  en: "Uthman ibn Affan prayed the Friday prayer at the earliest part of its time; Malik said that was because of the midday heat and to hasten the walk."
