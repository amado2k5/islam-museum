label: { ar: "الموطأ 2325 — مالك: المكاتب المريض يدفع نجومه كلها إلى سيده", en: "Muwatta 2325" }
summary:
  ar: "قال مالك في مكاتب مرض مرضا شديدا فأراد أن يدفع نجومه كلها إلى سيده ليرثه ورثة له أحرار، وليس معه في كتابته ولد: ذلك جائز له، لأنه تتم بذلك حرمته، وتجوز شهادته واعترافه بما عليه من ديون الناس ووصيته. وليس لسيده أن يأبى ذلك بأن يقول: فر مني بماله. {cite:muwatta-maruf-1997 p.358} {cite:muwatta-maruf-1997 p.359}"
