label: { ar: "الموطأ 2325 — مالك: المكاتب المريض يدفع نجومه كلها إلى سيده", en: "Muwatta 2325", es: "Muwatta 2325", fr: "Muwatta 2325", ur: "موطا 2325", tr: "Al-Muwatta 2325 — Malik: Hasta köle bütün yıldızlarını efendisine öder", id: "Al-Muwatta 2325 — Malik: Hamba yang sakit membayarkan seluruh bintangnya kepada tuannya" }
summary:
  ar: "قال مالك في مكاتب مرض مرضا شديدا فأراد أن يدفع نجومه كلها إلى سيده ليرثه ورثة له أحرار، وليس معه في كتابته ولد: ذلك جائز له، لأنه تتم بذلك حرمته، وتجوز شهادته واعترافه بما عليه من ديون الناس ووصيته. وليس لسيده أن يأبى ذلك بأن يقول: فر مني بماله. {cite:muwatta-maruf-1997 p.358} {cite:muwatta-maruf-1997 p.359}"
  tr: "Malik, ağır hastalanan ve tüm kazancını efendisine vermek isteyen, böylece özgür mirasçıları ondan miras alabilecek olan ve yanında çocuğu bulunmayan bir köle hakkında şöyle demiştir: Bu onun için caizdir, çünkü bu onun korunmasını tamamlar ve insanlara olan borçlarını itiraf etmesi ve vasiyeti geçerlidir. Efendisinin de, \"Parasıyla benden kaçtı\" diyerek bunu reddetme hakkı yoktur. {cite:muwatta-maruf-1997 s.358} {cite:muwatta-maruf-1997 s.359}"
  id: "Malik berkata mengenai seorang budak yang sakit parah dan ingin memberikan seluruh penghasilannya kepada tuannya agar ahli warisnya yang merdeka dapat mewarisi hartanya, dan ia tidak mempunyai anak bersamanya dalam hartanya: Hal ini diperbolehkan baginya, karena hal itu melengkapi perlindungannya, dan kesaksian serta pengakuannya atas hutang-hutangnya kepada orang lain dan wasiatnya sah. Dan tuannya tidak berhak menolak hal ini dengan mengatakan: Ia melarikan diri dariku dengan uangnya. {cite:muwatta-maruf-1997 p.358} {cite:muwatta-maruf-1997 p.359}"
