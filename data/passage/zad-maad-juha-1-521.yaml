text: "… قال ابن سعد: وهم رجلاً، وكان عبدُ اللَّهِ بنُ أبيّ ابن مَلول قد عسكر على ثنية الوَداع في حُلفائه مِن اليهود والمنافقين، فكان يقال: ليس مسكره بأقلّ العسكرين. واستخلف رسول اللَّه على المدينة محمد بن مسلمة الأنصاري. وقال ابن هشام: …"
