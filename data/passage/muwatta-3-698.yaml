label: { ar: "الموطأ 698 — معاذ بن جبل يأخذ من ثلاثين بقرة تبيعاً ومن أربعين مسنة ويأبى ما دون ذلك حتى يسأل النبي", en: "Muwatta 698", es: "Muwatta 698", fr: "Muwatta 698", ur: "موطا 698", tr: "El-Muvatta 698 — Mu'az ibn Cebel, otuz inekten bir yaşındaki bir ineği, kırk inekten de iki yaşındaki bir ineği alır ve Peygamber'den rica edene kadar bundan daha azını kabul etmez.", id: "Al-Muwatta 698 — Mu'adz bin Jabal mengambil seekor sapi berumur satu tahun dari tiga puluh ekor sapi dan seekor sapi berumur dua tahun dari empat puluh ekor sapi, dan dia menolak apa pun yang kurang dari itu sampai dia meminta kepada Nabi." }
text: "لم أسمع من رسول الله فيه شيئاً، حتى ألقاه فأسأله"
summary:
  ar: "الحديث الوحيد في باب ما جاء في صدقة البقر. يرويه مالك عن حميد بن قيس المكي عن طاووس اليماني، أن معاذ بن جبل الأنصاري أخذ من ثلاثين بقرة تبيعاً ومن أربعين بقرة مسنة، وأُتي بما دون ذلك فأبى أن يأخذ منه شيئاً وقال إنه لم يسمع من النبي فيه شيئاً حتى يلقاه فيسأله، فتوفي النبي قبل أن يقدم معاذ. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، والقعنبي عند أبي داود في المراسيل (108)، وعبد الرزاق (6856)، والشافعي، ومحمد بن الحسن الشيباني (340)، وينقل عن ابن عبد البر ⁦(التمهيد 2/273)⁩ أن ظاهره الوقف على معاذ، إلا أن قوله إنه لم يسمع فيما دون الثلاثين والأربعين دليل واضح على أنه سمع في الثلاثين والأربعين، ومثله لا يكون رأياً وإنما هو توقيف. {cite:muwatta-maruf-1997 p.350} {cite:muwatta-maruf-1997 p.351}"
  id: "Satu-satunya hadits tentang hewan ternak sebagai zakat diriwayatkan oleh Malik dari Humaid ibn Qays al-Makki, dari Tawus al-Yamani, bahwa Mu'adh ibn Jabal al-Ansari mengambil seekor sapi berumur satu tahun dari tiga puluh ekor sapi dan seekor sapi berumur dua tahun dari empat puluh ekor sapi. Ketika ia ditawari kurang dari itu, ia menolak untuk mengambil apa pun, dengan mengatakan bahwa ia belum pernah mendengar tentang hal itu dari Nabi (shalawat dan salam kepadanya) sampai ia bertemu beliau dan bertanya kepadanya. Nabi (shalawat dan salam kepadanya) wafat sebelum Mu'adh tiba. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan dari sanadnya oleh al-Baghawi dan al-Qa'nabi dalam al-Marasil karya Abu Dawud (108), dan oleh 'Abd al-Razzaq (6856), al-Shafi'i, dan Muhammad ibn al-Hasan al-Shaybani (340). Ia mengutip Ibn 'Abd al-Barr (al-Tamhid 2/273) yang mengatakan bahwa hadits ini tampak seperti pernyataan Mu'adh, tetapi pernyataannya bahwa ia belum pernah mendengar tentang kurang dari tiga puluh dan empat puluh merupakan bukti yang jelas bahwa ia telah mendengar tentang tiga puluh dan empat puluh, dan pernyataan seperti itu tidak dapat dianggap sebagai pendapat tetapi lebih sebagai teks yang diwahyukan secara ilahi. {cite:muwatta-maruf-1997 p.350} {cite:muwatta-maruf-1997 p.351}"
