label: { ar: "الموطأ 698 — معاذ بن جبل يأخذ من ثلاثين بقرة تبيعاً ومن أربعين مسنة ويأبى ما دون ذلك حتى يسأل النبي", en: "Muwatta 698" }
text: "لم أسمع من رسول الله فيه شيئاً، حتى ألقاه فأسأله"
summary:
  ar: "الحديث الوحيد في باب ما جاء في صدقة البقر. يرويه مالك عن حميد بن قيس المكي عن طاووس اليماني، أن معاذ بن جبل الأنصاري أخذ من ثلاثين بقرة تبيعاً ومن أربعين بقرة مسنة، وأُتي بما دون ذلك فأبى أن يأخذ منه شيئاً وقال إنه لم يسمع من النبي فيه شيئاً حتى يلقاه فيسأله، فتوفي النبي قبل أن يقدم معاذ. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، والقعنبي عند أبي داود في المراسيل (108)، وعبد الرزاق (6856)، والشافعي، ومحمد بن الحسن الشيباني (340)، وينقل عن ابن عبد البر (التمهيد 2/273) أن ظاهره الوقف على معاذ، إلا أن قوله إنه لم يسمع فيما دون الثلاثين والأربعين دليل واضح على أنه سمع في الثلاثين والأربعين، ومثله لا يكون رأياً وإنما هو توقيف. {cite:muwatta-maruf-1997 p.350} {cite:muwatta-maruf-1997 p.351}"
