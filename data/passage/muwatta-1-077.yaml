label: { ar: "الموطأ 77 — مالك: لا مسح على العمامة ولا الخمار", en: "Muwatta 77", es: "Muwatta 77", fr: "Muwatta 77", ur: "موطا 77", tr: "Al-Muwatta 77 — Malik: Sarık veya başörtüsünün üzerinden silme işlemi yapılmaz.", id: "Al-Muwatta 77 — Malik: Tidak ada usapan pada sorban atau jilbab." }
summary:
  ar: "فتوى لمالك في باب ما جاء في المسح بالرأس والأذنين: سُئل عن المسح على العمامة والخمار فقال إنه لا ينبغي للرجل ولا للمرأة أن يمسحا على عمامة أو خمار، وليمسحا على رأسيهما. ويذكر المحقق حديث المغيرة بن شعبة أن النبي مسح على العمامة عند مسلم (1/159) وأبي داود (150) والترمذي (100) الذي قال فيه: حسن صحيح، وينقل عن الترمذي أن المسح على العمامة قول أبي بكر وعمر وأنس وبه قال الأوزاعي وأحمد وإسحاق، وأن غير واحد من الصحابة والتابعين قالوا: لا يمسح على العمامة إلا مع الرأس، وهو قول سفيان الثوري ومالك وابن المبارك والشافعي. {cite:muwatta-maruf-1997 p.75}"
  tr: "Malik'in baş ve kulak silme bölümündeki fetvası: Kendisine sarık ve başörtüsü üzerinden silme hakkında soru sorulmuş ve o da, ne erkeklerin ne de kadınların sarık veya başörtüsü üzerinden silmemeleri, bunun yerine başlarının üzerinden silmeleri gerektiğini söylemiştir. Araştırmacı, Müslim (1/159), Ebu Davud (150) ve Tirmizi (100) tarafından rivayet edilen ve sahih ve doğru olduğunu söyleyen el-Muğire ibn Şube hadisinden, Peygamber'in sarığı üzerinden sildiği rivayetini zikretmektedir. Tirmizi'nin, sarık üzerinden silmenin Ebu Bekir, Ömer ve Enes'in görüşü olduğunu ve el-Evzai, Ahmed ve İshak'ın da bu görüşü benimsediğini söylediğini aktarmaktadır. Ayrıca, bazı Sahabe ve Muhaliflerin, sarık üzerinden değil, baş ile birlikte silmenin gerektiğini söylediklerini ve bunun Sufyan el-Seviri, Malik, İbn el-Mübarek ve Şafiî'nin görüşü olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.75}"
  id: "Fatwa Malik dalam bab tentang mengusap kepala dan telinga: Beliau ditanya tentang mengusap sorban dan jilbab, dan beliau mengatakan bahwa baik laki-laki maupun perempuan tidak boleh mengusap sorban atau jilbab, melainkan mereka harus mengusap kepala mereka. Peneliti menyebutkan hadits al-Mughirah ibn Shu'bah bahwa Nabi mengusap sorbannya, sebagaimana diriwayatkan oleh Muslim (1/159), Abu Dawud (150), dan al-Tirmidhi (100), yang mengatakan hadits tersebut sahih dan autentik. Beliau mengutip al-Tirmidhi yang mengatakan bahwa mengusap sorban adalah pendapat Abu Bakar, Umar, dan Anas, dan bahwa al-Awza'i, Ahmad, dan Ishaq berpendapat demikian. Beliau juga menyatakan bahwa beberapa Sahabat dan Pengikut mengatakan bahwa seseorang tidak boleh mengusap sorban kecuali bersamaan dengan kepala, dan ini adalah pendapat Sufyan al-Thawri, Malik, Ibn al-Mubarak, dan al-Shafi'i. {mengutip:muwatta-maruf-1997 hal.75}"
