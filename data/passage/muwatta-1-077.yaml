label: { ar: "الموطأ 77 — مالك: لا مسح على العمامة ولا الخمار", en: "Muwatta 77" }
summary:
  ar: "فتوى لمالك في باب ما جاء في المسح بالرأس والأذنين: سُئل عن المسح على العمامة والخمار فقال إنه لا ينبغي للرجل ولا للمرأة أن يمسحا على عمامة أو خمار، وليمسحا على رأسيهما. ويذكر المحقق حديث المغيرة بن شعبة أن النبي مسح على العمامة عند مسلم (1/159) وأبي داود (150) والترمذي (100) الذي قال فيه: حسن صحيح، وينقل عن الترمذي أن المسح على العمامة قول أبي بكر وعمر وأنس وبه قال الأوزاعي وأحمد وإسحاق، وأن غير واحد من الصحابة والتابعين قالوا: لا يمسح على العمامة إلا مع الرأس، وهو قول سفيان الثوري ومالك وابن المبارك والشافعي. {cite:muwatta-maruf-1997 p.75}"
