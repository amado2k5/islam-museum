text: "… مَن يعلم الحقيقة فليقلها إكراماً للَّه كانت امرأتُهُ تتركُهُ كلَّ ليلةِ وحده، يحفظ البيت، وتذهب للسهر عند الجيران. فحضرت إلى البيت، ذات ليلةٍ، وطرقت الباب حتى كادت تكسرهُ، فلم يفتح لها، ونادتهُ راجية مستعطفة أن يفتحه، فلم يفعلْ، فقالت له: …"
summary:
  ar: "تركت زوجة جحا زوجها وحده ليلاً لتزور الجيران، ثم عادت وطرقت الباب وهددت بإلقاء نفسها في البئر، ثم أقفلت عليه الباب ووبخته أمام الجيران، فقال جحا مهاناً: من يعلم الحقيقة فليقلها إكراماً لله. {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  en: "Juha's wife leaves him alone at night to visit neighbours. She returns, knocks, threatens to throw herself into the well, then locks him out and scolds him before the neighbours. Juha, humiliated, says, 'Whoever knows the truth, let him say it for God's sake.' {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  ur: "جحا کی بیوی رات کو اسے اکیلا چھوڑ کر پڑوسیوں کے ہاں چلی جاتی ہے۔ وہ لوٹ کر دروازہ کھٹکھٹاتی ہے، کنویں میں کود جانے کی دھمکی دیتی ہے، پھر اسے باہر بند کر دیتی ہے اور پڑوسیوں کے سامنے اسے ڈانٹتی ہے۔ جحا شرمندہ ہو کر کہتا ہے: جو حقیقت جانتا ہے وہ اللہ کے لیے کہہ دے۔ {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  fr: "La femme de Juha le laisse seul la nuit pour rendre visite à des voisins. Elle revient, frappe, menace de se jeter dans le puits, puis l'enferme dehors et le réprimande devant les voisins. Juha, humilié, dit : « Que celui qui connaît la vérité la dise pour l'amour de Dieu. » {cite:juha-nawadir-kubra-djuwaydi p. 123}"
  es: "La esposa de Juha lo deja solo de noche para visitar a los vecinos. Regresa, llama a la puerta, amenaza con arrojarse al pozo, luego lo deja fuera y lo regaña ante los vecinos. Juha, humillado, dice: «Quien conozca la verdad, que la diga por Dios». {cite:juha-nawadir-kubra-djuwaydi p. 123}"
