text: "… ابْنُ جُرَيْجٍ، أَخْبَرَنِي أَبُو الزُّبَيْرِ أَنَّهُ سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ سَمِعْتُ النَّبِيَّ يَقُولُ \" لاَ عَدْوَى وَلاَ صَفَرَ وَلاَ غُولَ \". وَسَمِعْتُ أَبَا الزُّبَيْرِ يَذْكُرُ أَنَّ جَابِرًا فَسَّرَ لَهُمْ قَوْلَهُ \" وَلاَ صَفَرَ \". فَقَالَ أَبُو الزُّبَيْرِ الصَّفَرُ الْبَطْنُ. فَقِيلَ لِجَابِرٍ كَيْفَ قَالَ كَانَ يُقَالُ دَوَابُّ الْبَطْنِ. قَالَ وَلَمْ يُفَسِّرِ الْغُولَ. قَالَ أَبُو …"
summary:
