label: { ar: "سنن ابن ماجه 708 — أعضاء البدن", en: "Sunan Ibn Majah 708 — the organs of the body", ur: "سنن ابن ماجہ 708 — اعضائے بدن", es: "Sunan Ibn Majah 708 - los órganos del cuerpo", fr: "Sunan Ibn Majah 708 – les organes du corps", tr: "Sünen İbni Mace 708 — Vücut Parçaları", id: "Sunan Ibnu Majah 708 — Bagian Tubuh" }
text: "… ثُمَّ وَضَعَ يَدَهُ عَلَى نَاصِيَةِ أَبِي مَحْذُورَةَ ثُمَّ أَمَرَّهَا عَلَى وَجْهِهِ مِنْ بَيْنِ يَدَيْهِ ثُمَّ عَلَى كَبِدِهِ ثُمَّ بَلَغَتْ يَدُ رَسُولِ اللَّهِ ـ سُرَّةَ أَبِي مَحْذُورَةَ ثُمَّ قَالَ رَسُولُ اللَّهِ ـ \" بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ \". فَقُلْتُ يَا رَسُولَ اللَّهِ أَمَرْتَنِي بِالتَّأْذِينِ بِمَكَّةَ قَالَ \" نَعَمْ قَدْ أَمَرْتُكَ \". فَذَهَبَ كُلُّ شَىْءٍ كَانَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 708، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 708 (The Book of the Adhan and the Sunnah Regarding It), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 708، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 708 (El Libro del Adhan y la Sunnah al respecto), menciona los órganos del cuerpo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 708 (Le Livre de l'Adhan et la Sunna s'y rapportant), mentionne les organes du corps. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 708 numaralı hadiste vücut organlarından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine yazılmış metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 708, menyebutkan organ-organ tubuh. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
