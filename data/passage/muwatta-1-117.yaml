label: { ar: "الموطأ 117 — ابن عمر: إذا جاوز الختان الختان وجب الغسل", en: "Muwatta 117" }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: إذا جاوز الختان الختان فقد وجب الغسل؛ وهو في باب واجب الغسل إذا التقى الختانان. ويذكر المحقق أن عبد الرزاق رواه عن ابن جريج وعن عبد الله بن عمر العمري، وابن أبي شيبة عن عبيد الله بن عمر، كلهم عن نافع. {cite:muwatta-maruf-1997 p.92}"
