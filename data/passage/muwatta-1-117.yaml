label: { ar: "الموطأ 117 — ابن عمر: إذا جاوز الختان الختان وجب الغسل", en: "Muwatta 117", es: "Muwatta 117", fr: "Muwatta 117", ur: "موطا 117", tr: "El-Muvatta 117 — İbn Ömer: Sünnetli kısım sünnetli kısımdan fazla ise gusül (tıbbi banyo) farzdır.", id: "Al-Muwatta 117 — Ibn Umar: Jika bagian yang disunat melebihi bagian yang disunat, maka ghusl (mandi ritual) wajib dilakukan." }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: إذا جاوز الختان الختان فقد وجب الغسل؛ وهو في باب واجب الغسل إذا التقى الختانان. ويذكر المحقق أن عبد الرزاق رواه عن ابن جريج وعن عبد الله بن عمر العمري، وابن أبي شيبة عن عبيد الله بن عمر، كلهم عن نافع. {cite:muwatta-maruf-1997 p.92}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Abdullah ibn Umar'ın şöyle dediği belirtilir: \"Sünnetli kısım sünnetli kısımla birleşirse, gusül abdesti farzdır.\" Bu, iki sünnetli kısmın birleştiği durumlarda gusül abdestinin farz olduğu bölümü kapsamına girer. Araştırmacı, Abd al-Razzaq'ın bunu İbn Jurayj ve Abdullah ibn Umar al-Umari'den, İbn Abi Shaybah'ın ise Ubaydullah ibn Umar'dan rivayet ettiğini, hepsinin de Nafi'den naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.92}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’ menyatakan bahwa Abdullah ibn Umar biasa berkata: “Jika bagian yang disunat bertemu dengan bagian yang disunat lainnya, maka wajiblah bersuci (ghusl).” Hal ini termasuk dalam bab tentang kewajiban bersuci ketika kedua bagian yang disunat bertemu. Peneliti menyebutkan bahwa Abd al-Razzaq meriwayatkannya dari Ibn Jurayj dan Abdullah ibn Umar al-Umari, dan Ibn Abi Shaybah dari Ubaydullah ibn Umar, semuanya dari Nafi’. {cite:muwatta-maruf-1997 p.92}"
