label: { ar: "الموطأ 1329 — أبو النضر مولى عمر بن عبيد الله: قال النبي لشهداء أحد هؤلاء أشهد عليهم، فقال أبو بكر أ لسنا بإخوانهم", en: "Muwatta 1329", es: "Muwatta 1329", fr: "Muwatta 1329", ur: "موطا 1329", tr: "El-Muvatta 1329 — Ömer ibn Ubeyd'in azatlı kölesi Ebu el-Nadr: Allah: Peygamber, Uhud şehitlerine şöyle buyurdu: \"Bunlara şahitlik ederim.\" Ebu Bekir dedi ki: \"Biz onların kardeşleri değil miyiz?\"", id: "Al-Muwatta 1329 — Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah: Nabi bersabda kepada para syuhada Uhud, “Aku menjadi saksi atas mereka.” Abu Bakr berkata, “Bukankah kita saudara mereka?”" }
text: "بَلى . وَلَكنْ لاَ أدْري مَا تُحْدثُونَ بَعْدي"
summary:
  ar: "يروي مالك أنه بلغه عن أبي النضر مولى عمر بن عبيد الله أن رسول الله قال لشهداء أحد هؤلاء أشهد عليهم، فقال أبو بكر الصديق ألسنا يا رسول الله بإخوانهم؟ أسلمنا كما أسلموا، وجاهدنا كما جاهدوا؟ فقال رسول الله بلى، ولكن لا أدري ما تحدثون بعدي. فبكى أبو بكر، ثم بكى، ثم قال أئنا لكائنون بعدك. ويذكر المحقق أن ابن عبد البر قال إنه مرسل عند جميع رواة الموطأ، وإن معناه يستند من وجوه صحاح كثيرة. {cite:muwatta-maruf-1997 p.594}"
  tr: "Malik, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, Allah Resulü'nün Uhud şehitlerine, \"Bunlar onların şahitleridir\" dediğini işittiğini rivayet eder. Ebu Bekir el-Siddik, \"Ey Allah Resulü, biz onların kardeşleri değil miyiz? Onlar gibi İslam'ı kabul ettik ve onlar gibi savaştık\" dedi. Allah Resulü, \"Evet, ama benden sonra ne yapacağınızı bilmiyorum\" dedi. Ebu Bekir ağladı, sonra tekrar ağladı ve \"Senden sonra hâlâ var olacak mıyız?\" dedi. Araştırmacı, İbn Abd el-Barr'ın, Muvatta'nın tüm ravilerine göre bunun mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve anlamının birçok sahih rivayet zinciriyle desteklendiğini söylediğini belirtir. {cite:muwatta-maruf-1997 s.594}"
  id: "Malik meriwayatkan bahwa ia mendengar dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, bahwa Rasulullah SAW bersabda kepada para syuhada Uhud, \"Mereka adalah saksi atas mereka.\" Abu Bakr al-Siddiq berkata, \"Bukankah kami saudara mereka, wahai Rasulullah? Kami memeluk Islam seperti mereka, dan kami berperang seperti mereka berperang.\" Rasulullah SAW bersabda, \"Ya, tetapi aku tidak tahu apa yang akan kalian lakukan setelahku.\" Abu Bakr menangis, lalu menangis lagi, kemudian berkata, \"Apakah kami akan tetap ada setelahmu?\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) menurut semua perawi al-Muwatta, dan maknanya didukung oleh banyak sanad yang sahih. {cite:muwatta-maruf-1997 p.594}"
