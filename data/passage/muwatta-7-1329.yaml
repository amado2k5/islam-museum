label: { ar: "الموطأ 1329 — أبو النضر مولى عمر بن عبيد الله: قال النبي لشهداء أحد هؤلاء أشهد عليهم، فقال أبو بكر أ لسنا بإخوانهم", en: "Muwatta 1329" }
text: "بَلى . وَلَكنْ لاَ أدْري مَا تُحْدثُونَ بَعْدي"
summary:
  ar: "يروي مالك أنه بلغه عن أبي النضر مولى عمر بن عبيد الله أن رسول الله قال لشهداء أحد هؤلاء أشهد عليهم، فقال أبو بكر الصديق ألسنا يا رسول الله بإخوانهم؟ أسلمنا كما أسلموا، وجاهدنا كما جاهدوا؟ فقال رسول الله بلى، ولكن لا أدري ما تحدثون بعدي. فبكى أبو بكر، ثم بكى، ثم قال أئنا لكائنون بعدك. ويذكر المحقق أن ابن عبد البر قال إنه مرسل عند جميع رواة الموطأ، وإن معناه يستند من وجوه صحاح كثيرة. {cite:muwatta-maruf-1997 p.594}"
