label:
  ar: "صحيح مسلم، كتاب الأضاحى"
  en: "Sahih Muslim, Book 35: The Book of Sacrifices"
  ur: "صحیح مسلم، کتاب الاضاحیٰ"
  es: "Sahih Muslim, Libro 35: El Libro de los Sacrificios"
  fr: "Sahih Muslim, Livre 35: Le Livre des Sacrifices"
summary:
  ar: "القسم 35 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأضاحى»، ويضم فيها النصوص من 5064 إلى 5126 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 35 of Sahih Muslim (The Book of Sacrifices) in the division of the open hadith dataset the museum took its reports from: reports 5064 to 5126 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 35، عنوان «کتاب الاضاحیٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5064 تا 5126۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 35 del Sahih Muslim (El Libro de los Sacrificios) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5064 al 5126, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre des sacrifices), volume 35, dans la base de données ouverte: les hadiths 5064 à 5126. Le musée classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
