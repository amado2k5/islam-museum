label: { ar: "الأربعون 30 — فرض فرائض وحد حدوداً وسكت عن أشياء", en: "Arba'un 30 — obligations, limits, and what He was silent about" }
text: "إن الله فرض فرائض فلا تضيعوها، وحد حدوداً فلا تعتدوها، وحرم أشياء فلا تنتهكوها، وسكت عن أشياء رحمة لكم غير نسيان فلا تبحثوا عنها"
summary:
  ar: "حديث أبي ثعلبة الخشني عن النبي قال: «إن الله فرض فرائض فلا تضيعوها وحد حدوداً فلا تعتدوها وحرم أشياء فلا تنتهكوها وسكت عن أشياء رحمة لكم غير نسيان فلا تبحثوا عنها» — وهو الحديث الثلاثون في الأربعين النووية وفي شرح ابن رجب، وقال النووي حديث حسن رواه الدارقطني (4350) وغيره وكذلك حسنه قبله الحافظ أبو بكر بن السمعاني في أماليه؛ والحديث من رواية مكحول عن أبي ثعلبة وله علتان: إحداهما أن مكحولاً لم يصح له السماع من أبي ثعلبة كذلك قال أبو مسهر الدمشقي وأبو نعيم الحافظ وغيرهما، والثانية أنه اختلف في رفعه ووقفه على أبي ثعلبة ورواه بعضهم عن مكحول من قوله لكن قال الدارقطني الأشبه بالصواب المرفوع وهو أشهر؛ وروي معناه مرفوعاً من وجوه أخر فخرجه البزار والحاكم من حديث أبي الدرداء «ما أحل الله في كتابه فهو حلال وما حرم فهو حرام وما سكت عنه فهو عفو فاقبلوا من الله عافيته فإن الله لم يكن لينسى شيئاً» ثم تلا «وما كان ربك نسياً» [مريم 64] وقال الحاكم صحيح الإسناد وقال البزار إسناده صالح، وخرجه الطبراني والدارقطني من وجه آخر عن أبي الدرداء بمثله وفي آخره «رحمة من الله فاقبلوها» لكن إسناده ضعيف، وخرج الترمذي وابن ماجه من رواية سيف بن هارون عن سليمان التيمي عن أبي عثمان عن سلمان أنه سئل عن السمن والجبن والفراء فقال «الحلال ما أحل الله في كتابه والحرام ما حرم الله في كتابه وما سكت عنه فهو مما عفا عنه» ورواه سفيان بن عيينة موقوفاً عن سليمان من قوله وكأنه أصح، وقال البخاري في المرفوع ما أراه محفوظاً وقال أحمد هو منكر وأنكره ابن معين وقال أبو حاتم الرازي هو خطأ رواه الثقات عن التيمي عن أبي عثمان عن النبي مرسلاً ليس فيه سلمان، وعند ابن رجب قد روي عن سلمان من قوله من وجوه أخر (جامع العلوم والحكم ص 617–638)."
  en: "The hadith of Abu Tha'laba al-Khushani that the Prophet said 'God has laid down obligations, so do not neglect them; set bounds, so do not transgress them; forbidden things, so do not violate them; and was silent about things out of mercy for you, not forgetfulness, so do not search for them' — the thirtieth of al-Nawawi's Forty and of Ibn Rajab's commentary, called a hasan hadith by al-Nawawi, transmitted by al-Daraqutni (4350) and others, and likewise graded hasan before him by al-Hafiz Abu Bakr ibn al-Sam'ani in his Amali; it comes through Makhul from Abu Tha'laba with two defects: Makhul's hearing from Abu Tha'laba is unproven — so Abu Mashar al-Dimashqi, al-Hafiz Abu Nu'aym and others — and its elevation to the Prophet versus halting at Abu Tha'laba is disputed, some narrating it as Makhul's own saying, though al-Daraqutni judges the marfu' closer to correct and the better known; the meaning is carried marfu' through other routes — al-Bazzar and al-Hakim from Abu al-Darda', 'what God made lawful in His Book is lawful, what He forbade is forbidden, and what He was silent about is pardon, so accept God's pardon, for God was never one to forget anything', followed by 'your Lord was never forgetful' (Maryam 64), graded sahih in chain by al-Hakim and salih by al-Bazzar — and al-Tabarani and al-Daraqutni from another Abu al-Darda' route ending 'a mercy from God, so accept it', though its chain is weak; al-Tirmidhi and Ibn Majah carry through Sayf ibn Harun from Sulayman al-Taymi from Abu Uthman from Salman that the Prophet was asked about clarified butter, cheese and furs and answered 'the lawful is what God made lawful in His Book, the unlawful what He forbade, and what He was silent about is among what He pardoned', while Sufyan ibn Uyayna narrated it halted as al-Taymi's saying and that seems sounder — al-Bukhari held the marfu' version un-preserved, Ahmad called it rejected, Ibn Ma'in denied it, and Abu Hatim al-Razi declared it an error: the trustworthy narrate it mursal from Abu Uthman without Salman — Ibn Rajab adding that it is nonetheless related from Salman as his own saying through other routes (Jami' al-Ulum wal-Hikam pp. 617–638)."
