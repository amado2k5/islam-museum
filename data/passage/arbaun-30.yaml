label: { ar: "الأربعون 30 — فرض فرائض وحد حدوداً وسكت عن أشياء", en: "Arba'un 30 — obligations, limits, and what He was silent about", es: "Arba'un 30 — obligaciones, límites y aquello sobre lo que guardó silencio", fr: "Arba'un 30 — obligations, limites et ce sur quoi Il a gardé le silence", ur: "اربعون 30 - ذمہ داریاں، حدود، اور جس کے بارے میں وہ خاموش تھا۔", tr: "Kırk (30) — Yükümlülükler belirledi, sınırlar koydu ve diğer konularda sessiz kaldı.", id: "Empat puluh (30) — Dia menetapkan kewajiban, menetapkan batasan, dan diam mengenai hal-hal lainnya." }
text: "إن الله فرض فرائض فلا تضيعوها، وحد حدوداً فلا تعتدوها، وحرم أشياء فلا تنتهكوها، وسكت عن أشياء رحمة لكم غير نسيان فلا تبحثوا عنها"
summary:
  ar: "حديث أبي ثعلبة الخشني عن النبي قال: «إن الله فرض فرائض فلا تضيعوها وحد حدوداً فلا تعتدوها وحرم أشياء فلا تنتهكوها وسكت عن أشياء رحمة لكم غير نسيان فلا تبحثوا عنها» — وهو الحديث الثلاثون في الأربعين النووية وفي شرح ابن رجب، وقال النووي حديث حسن رواه الدارقطني (4350) وغيره وكذلك حسنه قبله الحافظ أبو بكر بن السمعاني في أماليه؛ والحديث من رواية مكحول عن أبي ثعلبة وله علتان: إحداهما أن مكحولاً لم يصح له السماع من أبي ثعلبة كذلك قال أبو مسهر الدمشقي وأبو نعيم الحافظ وغيرهما، والثانية أنه اختلف في رفعه ووقفه على أبي ثعلبة ورواه بعضهم عن مكحول من قوله لكن قال الدارقطني الأشبه بالصواب المرفوع وهو أشهر؛ وروي معناه مرفوعاً من وجوه أخر فخرجه البزار والحاكم من حديث أبي الدرداء «ما أحل الله في كتابه فهو حلال وما حرم فهو حرام وما سكت عنه فهو عفو فاقبلوا من الله عافيته فإن الله لم يكن لينسى شيئاً» ثم تلا «وما كان ربك نسياً» [مريم 64] وقال الحاكم صحيح الإسناد وقال البزار إسناده صالح، وخرجه الطبراني والدارقطني من وجه آخر عن أبي الدرداء بمثله وفي آخره «رحمة من الله فاقبلوها» لكن إسناده ضعيف، وخرج الترمذي وابن ماجه من رواية سيف بن هارون عن سليمان التيمي عن أبي عثمان عن سلمان أنه سئل عن السمن والجبن والفراء فقال «الحلال ما أحل الله في كتابه والحرام ما حرم الله في كتابه وما سكت عنه فهو مما عفا عنه» ورواه سفيان بن عيينة موقوفاً عن سليمان من قوله وكأنه أصح، وقال البخاري في المرفوع ما أراه محفوظاً وقال أحمد هو منكر وأنكره ابن معين وقال أبو حاتم الرازي هو خطأ رواه الثقات عن التيمي عن أبي عثمان عن النبي مرسلاً ليس فيه سلمان، وعند ابن رجب قد روي عن سلمان من قوله من وجوه أخر ⁦(جامع العلوم والحكم ص 617–638)⁩."
  en: "The hadith of Abu Tha'laba al-Khushani that the Prophet said 'God has laid down obligations, so do not neglect them; set bounds, so do not transgress them; forbidden things, so do not violate them; and was silent about things out of mercy for you, not forgetfulness, so do not search for them' — the thirtieth of al-Nawawi's Forty and of Ibn Rajab's commentary, called a hasan hadith by al-Nawawi, transmitted by al-Daraqutni (4350) and others, and likewise graded hasan before him by al-Hafiz Abu Bakr ibn al-Sam'ani in his Amali; it comes through Makhul from Abu Tha'laba with two defects: Makhul's hearing from Abu Tha'laba is unproven — so Abu Mashar al-Dimashqi, al-Hafiz Abu Nu'aym and others — and its elevation to the Prophet versus halting at Abu Tha'laba is disputed, some narrating it as Makhul's own saying, though al-Daraqutni judges the marfu' closer to correct and the better known; the meaning is carried marfu' through other routes — al-Bazzar and al-Hakim from Abu al-Darda', 'what God made lawful in His Book is lawful, what He forbade is forbidden, and what He was silent about is pardon, so accept God's pardon, for God was never one to forget anything', followed by 'your Lord was never forgetful' (Maryam 64), graded sahih in chain by al-Hakim and salih by al-Bazzar — and al-Tabarani and al-Daraqutni from another Abu al-Darda' route ending 'a mercy from God, so accept it', though its chain is weak; al-Tirmidhi and Ibn Majah carry through Sayf ibn Harun from Sulayman al-Taymi from Abu Uthman from Salman that the Prophet was asked about clarified butter, cheese and furs and answered 'the lawful is what God made lawful in His Book, the unlawful what He forbade, and what He was silent about is among what He pardoned', while Sufyan ibn Uyayna narrated it halted as al-Taymi's saying and that seems sounder — al-Bukhari held the marfu' version un-preserved, Ahmad called it rejected, Ibn Ma'in denied it, and Abu Hatim al-Razi declared it an error: the trustworthy narrate it mursal from Abu Uthman without Salman — Ibn Rajab adding that it is nonetheless related from Salman as his own saying through other routes (Jami' al-Ulum wal-Hikam pp. 617–638)."
  es: "El hadiz de Abu Tha'laba al-Khushani que dice que el Profeta dijo: \"Dios ha establecido obligaciones, así que no las descuidéis; ha establecido límites, así que no los transgredáis; ha prohibido cosas, así que no las violáis; y guardó silencio sobre cosas por misericordia para vosotros, no por olvido, así que no las busquéis\" —el trigésimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, llamado hadiz hasan por al-Nawawi, transmitido por al-Daraqutni (4350) y otros, y también clasificado hasan antes que él por al-Hafiz Abu Bakr ibn al-Sam'ani en su Amali; Llega a través de Makhul de Abu Tha'laba con dos defectos: no está probado que Makhul lo haya escuchado de Abu Tha'laba —así lo afirman Abu Mashar al-Dimashqi, al-Hafiz Abu Nu'aym y otros— y su elevación al Profeta en lugar de detenerse en Abu Tha'laba es discutida, algunos la narran como dicho por el propio Makhul, aunque al-Daraqutni considera que el marfu' está más cerca de la verdad y es el más conocido; el significado se transmite marfu' a través de otras rutas: al-Bazzar y al-Hakim de Abu al-Darda', 'lo que Dios hizo lícito en Su Libro es lícito, lo que Él prohibió es prohibido, y sobre lo que Él guardó silencio es perdón, así que acepta el perdón de Dios, porque Dios nunca fue uno de los que olvidan nada', seguido de 'tu Señor nunca fue olvidadizo' (Maryam 64), clasificado sahih en cadena por al-Hakim y salih por al-Bazzar, y al-Tabarani y al-Daraqutni de otra ruta de Abu al-Darda' que termina 'una misericordia de Dios, así que acéptala', aunque su cadena es débil; Al-Tirmidhi e Ibn Majah transmiten a través de Sayf ibn Harun de Sulayman al-Taymi de Abu Uthman de Salman que se le preguntó al Profeta acerca de la mantequilla clarificada, el queso y las pieles y respondió: \"Lo lícito es lo que Dios hizo lícito en Su Libro, lo ilícito lo que Él prohibió, y aquello sobre lo que guardó silencio está entre lo que perdonó\", mientras que Sufyan ibn Uyayna lo narró interrumpido como dicho de al-Taymi y eso parece más sólido: al-Bujari sostuvo que la versión marfu' no se conservó, Ahmad la llamó rechazada, Ibn Ma'in la negó y Abu Hatim al-Razi la declaró un error: los fidedignos la narran mursal de Abu Uthman sin Salman; Ibn Rajab agrega que, no obstante, se transmite de Salman como dicho suyo a través de otras rutas (Jami' al-Ulum wal-Hikam pp. 617-638)."
  fr: "Le hadith d'Abu Tha'laba al-Khushani selon lequel le Prophète a dit: « Dieu a établi des obligations, ne les négligez donc pas; a fixé des limites, ne les transgressez donc pas; des choses interdites, ne les violez donc pas; et a gardé le silence sur certaines choses par miséricorde envers vous, et non par oubli, ne les recherchez donc pas » — le trentième des quarante d'al-Nawawi et du commentaire d'Ibn Rajab, qualifié de hadith hasan par al-Nawawi, transmis par al-Daraqutni (4350) et d'autres, et également classé hasan avant lui par al-Hafiz Abu Bakr ibn al-Sam'ani dans son Amali; elle nous parvient par l'intermédiaire de Makhul d'après Abu Tha'laba avec deux défauts: l'authenticité de la parole de Makhul d'après Abu Tha'laba n'est pas prouvée — de même qu'Abu Mashar al-Dimashqi, al-Hafiz Abu Nu'aym et d'autres — et son élévation au Prophète par rapport à son arrêt à Abu Tha'laba est contestée, certains la rapportant comme une parole de Makhul lui-même, bien qu'al-Daraqutni juge que la version marfu' est plus proche de la vérité et la mieux connue; le sens est transmis marfu' par d'autres voies — al-Bazzar et al-Hakim d'après Abu al-Darda', « ce que Dieu a rendu licite dans Son Livre est licite, ce qu'Il a interdit est interdit, et ce sur quoi Il est resté silencieux est pardon, alors acceptez le pardon de Dieu, car Dieu n'a jamais rien oublié », suivi de « votre Seigneur n'a jamais oublié » (Maryam 64), classé sahih dans la chaîne par al-Hakim et salih par al-Bazzar — et al-Tabarani et al-Daraqutni d'une autre voie d'Abu al-Darda' se terminant par « une miséricorde de Dieu, alors acceptez-la », bien que sa chaîne soit faible; Al-Tirmidhi et Ibn Majah rapportent, par l'intermédiaire de Sayf ibn Harun, d'après Sulayman al-Taymi, d'après Abu Uthman, d'après Salman, que le Prophète fut interrogé sur le beurre clarifié, le fromage et les fourrures et répondit: « Le licite est ce que Dieu a rendu licite dans Son Livre, l'illicite est ce qu'Il a interdit, et ce sur quoi Il est resté silencieux est parmi ce qu'Il a pardonné. » Sufyan ibn Uyayna, quant à lui, rapporte cette parole comme étant celle d'al-Taymi, ce qui semble plus authentique. Al-Bukhari considère la version marfu' comme non conservée, Ahmad la qualifie de rejetée, Ibn Ma'in la nie et Abu Hatim al-Razi la déclare erronée. Les sources dignes de foi la rapportent mursal d'après Abu Uthman, sans mentionner Salman. Ibn Rajab ajoute qu'elle est néanmoins rapportée de Salman comme étant sa propre parole par d'autres voies (Jami' al-Ulum wal-Hikam, p. 617-638)."
  ur: "ابو ثعلبہ خشنی کی حدیث ہے کہ نبی نے فرمایا کہ اللہ تعالیٰ نے فرائض مقرر کیے ہیں، لہٰذا ان میں کوتاہی نہ کرو۔ حدیں مقرر کرو، پس ان سے تجاوز نہ کرو۔ حرام چیزیں، اس لیے ان کی خلاف ورزی نہ کرو۔ اور ان چیزوں کے بارے میں خاموش رہا جو آپ کے لیے رحمت کی بنا پر تھا، نہ بھولنے کے لیے، لہٰذا ان کی تلاش نہ کرو\" - النووی کی چالیسویں اور ابن رجب کی تفسیر کی تیسویں، جسے النووی کی ایک حدیث حسن کہا جاتا ہے، جسے الدارقطنی (4350) اور دیگر نے روایت کیا ہے، اور اسی طرح ابوسفیان حسن نے اسے ابوسفیان میں درج کیا ہے۔ اس کی امالی؛ یہ ابو ثعلبہ سے مکول کے ذریعے دو عیبوں کے ساتھ آتا ہے: ابو ثعلبہ سے مکول کا سماع غیر ثابت ہے - لہذا ابو مشار الدمشقی، حافظ ابو نعیم وغیرہ - اور اس کا نبی تک بلند ہونا بمقابلہ ابو ثعلبہ کا رکنا اختلاف ہے، بعض نے اسے مخل الثعلبہ کے نزدیک صحیح قرار دیا ہے اور مرقوع کا قول ہے، بہتر جانا جاتا ہے؛ معنی مارفو کو دوسرے راستوں سے لے جایا جاتا ہے — البزار اور الحاکم ابو الدرداء سے، 'اللہ نے اپنی کتاب میں جس چیز کو حلال کیا ہے وہ حلال ہے، جس چیز کو حرام کیا ہے وہ حرام ہے، اور جس کے بارے میں وہ خاموش رہا ہے وہ معافی ہے، اس لیے اللہ کی معافی کو قبول کرو، کیونکہ اللہ کبھی کسی چیز کو بھولنے والا نہیں تھا'، اس کے بعد 'تمہارا رب کبھی بھولنے والا نہیں تھا'۔ حکیم و صالح از البزار - اور الطبرانی اور الدارقطنی ایک اور ابو الدرداء کے راستے سے 'خدا کی طرف سے رحمت ہے، لہذا اسے قبول کرو'، اگرچہ اس کا سلسلہ کمزور ہے۔ ترمذی اور ابن ماجہ نے سیف بن ہارون سے سلیمان تیمی سے ابو عثمان سے سلمان بن سلمان سے نقل کیا ہے کہ رسول اللہ سے مکھن، پنیر اور کھال کے بارے میں پوچھا گیا تو آپ نے فرمایا: حلال وہ ہے جسے اللہ نے اپنی کتاب میں حلال کیا، جس کو حرام قرار دیا اور جس چیز کے بارے میں آپ خاموش رہے وہ صوفیہ میں سے ہے۔ التیمی کے قول کے مطابق روک دیا اور یہ صحیح معلوم ہوتا ہے - البخاری نے مرفوع نسخہ کو غیر محفوظ رکھا، احمد نے اسے رد کہا، ابن معین نے اس کی تردید کی، اور ابو حاتم الرازی نے اسے غلط قرار دیا: ثقہ نے اسے ابو عثمان سے مرسل روایت کیا ہے، بغیر سلمان کے - ابن رجب نے اس کے علاوہ کسی اور روایت کو سلمان کے ذریعہ روایت کیا ہے، اس کے علاوہ کوئی اور روایت نہیں ہے ⁦(جامع العلوم والحکم صفحہ 617-638)⁩۔"
  id: "Hadits Abu Tha’labah al-Khushani dari Nabi, yang bersabda: “Allah telah menetapkan kewajiban, maka janganlah kalian mengabaikannya; Dia telah menetapkan batasan, maka janganlah kalian melanggarnya; Dia telah melarang sesuatu, maka janganlah kalian melanggarnya; dan Dia telah berdiam diri tentang hal-hal tertentu karena rahmat-Nya kepada kalian, bukan karena lupa, maka janganlah kalian menanyakannya.” — Ini adalah hadits ke-30 dalam Empat Puluh Hadits karya al-Nawawi dan dalam tafsir Ibn Rajab. Al-Nawawi mengatakan bahwa hadits ini adalah hadits baik yang diriwayatkan oleh al-Daraqutni (4350) dan lainnya. Al-Hafiz Abu Bakr ibn al-Sam’ani juga menyatakan hadits ini baik sebelum beliau dalam kitab Amali-nya. Hadits ini diriwayatkan oleh Makhul atas otoritas Abu Tha’labah, dan memiliki dua kekurangan: pertama, Makhul tidak mendapat pendengaran yang sah dari Abu Tha’labah, sebagaimana dikatakan oleh Abu Mushir al-Dimashqi, Abu Nu’aym al-Hafiz, dan lainnya. Kedua, terdapat perbedaan pendapat mengenai apakah hadits ini ditujukan kepada Nabi atau dihentikan atas otoritas Abu Tha’labah. Sebagian dari mereka meriwayatkannya atas otoritas Makhul sebagai pernyataannya sendiri, tetapi al-Daraqutni mengatakan bahwa hadits yang ditujukan kepada Nabi lebih mungkin benar dan lebih terkenal. Maknanya diriwayatkan dalam rantai periwayatan yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) melalui rantai periwayatan lainnya. Al-Bazzar dan Al-Hakim meriwayatkannya dari Abu Ad-Darda’: “Apa yang Allah izinkan dalam Kitab-Nya adalah halal, apa yang Dia haramkan adalah haram, dan apa yang Dia diamkan adalah diampuni. Maka terimalah ampunan dari Allah, karena Allah tidak melupakan sesuatu pun.” Kemudian beliau membaca, “Dan Tuhanmu tidak pernah lupa” [Maryam 64]. Al-Hakim mengatakan sanadnya sahih, dan Al-Bazzar mengatakan sanadnya dapat diterima. At-Tabarani dan Ad-Daraqutni meriwayatkannya dari sanad lain dari Abu Ad-Darda’ dengan redaksi yang serupa, diakhiri dengan, “Rahasia dari Allah, maka terimalah.” Namun, sanadnya lemah. At-Tirmidhi dan Ibn Majah meriwayatkannya dari Sayf ibn Harun, dari Sulayman At-Taymi, dari Abu Uthman, dari Salman, yang ditanya tentang ghee, keju, dan bulu binatang. Dia berkata, “Apa yang Allah izinkan dalam Kitab-Nya adalah halal, apa yang Allah haramkan dalam Kitab-Nya adalah haram, dan apa yang Dia diamkan adalah dimaafkan.” Sufyan ibn Uyaynah meriwayatkannya sebagai pernyataan Sulaiman, dan ini tampaknya lebih sahih. Al-Bukhari berkata mengenai sanad yang ditelusuri kembali kepada Nabi, “Saya tidak menganggapnya sahih.” Ahmad berkata itu ditolak, dan Ibn Ma’in menolaknya. Abu Hatim berkata… Al-Razi adalah sebuah kekeliruan yang diriwayatkan oleh orang-orang terpercaya atas otoritas Al-Taymi atas otoritas Abu Uthman atas otoritas Nabi, dalam sanad yang tidak termasuk Salman. Menurut Ibn Rajab, itu telah diriwayatkan atas otoritas Salman dari ucapannya di bidang lain (Jami’ al-‘Ulum wa al-Hikam, hlm. 617–638)."
