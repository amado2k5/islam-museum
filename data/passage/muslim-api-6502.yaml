label: { ar: "صحيح مسلم 6502 — الأب والأبوة", en: "Sahih Muslim 6502 — the father and fatherhood", ur: "صحیح مسلم 6502 — باپ اور والدیت", es: "Sahih Muslim 6502 — El padre y la paternidad", fr: "Sahih Muslim 6502 — Le père et la paternité" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا شَرِيكٌ، عَنْ عُمَارَةَ، وَابْنِ، شُبْرُمَةَ عَنْ أَبِي، زُرْعَةَ عَنْ أَبِي هُرَيْرَةَ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ. فَذَكَرَ بِمِثْلِ حَدِيثِ جَرِيرٍ وَزَادَ فَقَالَ \" نَعَمْ وَأَبِيكَ لَتُنَبَّأَنَّ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6502، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6502 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6502، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 6502 (El Libro de la Virtud, que ordena las buenas costumbres y fortalece los lazos de parentesco), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6502 (Le Livre de la Vertu, l'Exhortation aux bonnes mœurs et le Rassemblement des liens de parenté), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
