label: { ar: "مسلم 49 — من رأى منكم منكراً فليغيره بيده", en: "Muslim 49 — Whoever sees an evil must change it with his hand" }
text: "قال رسول الله: «من رأى منكم منكراً فليغيره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان»"
summary:
  ar: "رواية أبي سعيد الخدري عبر طارق بن شهاب في كتاب الإيمان من صحيح مسلم، في قصة مروان حين قدّم الخطبة على الصلاة يوم العيد؛ مرتب إنكار المنكر على اليد ثم اللسان ثم القلب."
