text: |-
  • ⁦(باب الواد والياء)⁩.
  ٢٩غ
  تقول زيدير ميك برفع الياء ويغزولك برفع الواو وهذا قاضى بالتنوين مع اليساءفتجرى الحرف
  لمعتل مجرى الحرف الصحيح من جيع الوجوه فى الاسماء والافعال ججيعالائه الاصل
  واستأنت الناقة استفتاء مهمور أى ضبعث وأرادت الفصل والاتاء البركة والتماء وحل
  النخل تقول منه أنت النخله تأتوأناء وأنشدابن السكيت
  هنالك لا أبالى نخل بعل • ولاسق وان عظم الاتاء
  والميتاء والمبداء جمدودان آخر الغاية حيث ينتهى اليهجرى الخيل والمتاء الطريق العامر
  ومجتمع الطريق أيضاميناء وميداه يقال بنى القوم بيوتهم على ميتاء واحدوميداه واحد
  ودارى بميتا دارفلان وميداء دارفلان أى تلقاء داره ومحاذية لها نا أنابه يأتوبه
  ريأتى أيضا اثاوة واثاية أى وشى به ومنه قول الشاعره ذانيرب آث• ⁦(أنا )⁩ الاخ أصله
  أخوبالتحريك لانه يمع عسلى آخاء مثسل آباء والذاهب منه واولانك تقول فى التثنية أخوان
  وبعض العرب يقول أخان على النقص ويجمع أيضاعلى اخوان مشل خرب وخربان وع-لى
  خوة وأخوة عن الفراء وقد يتسع فيه فيرادبه الاثنان كقوله تعالى فان كان له اخوة وه_ذا
  كقولك انا فعلنا ونحن فعلنا وانتما ابنان وأكثرما يستعمل الاخوان فى الاصدقاء
  والاخوة فى الولادة وقد جع بالواو والنون قال الشاعر
  وكان بنوفزارة شرقوم • وكنتاهم كشرّبن الاخينا
  ولا يقال أخوولا أبو الامضافاتقول هذا أبوك وأخوك ومررت بايك وأخيك ورايت اباك
  وأخاذ وكذلك حوك وهذوك وفوك وذومال فهذمستة أسماء لاتكون موحدة الامضافة
  واعر ابها فى الواو دالياء والالم لان الواوفيها وان كانت من نفس الكلمة ففيها دليل عسلى
  الرفع وفى الياءدليل على الخفض وفى الالف دايسل على النصب ويقال ما كنت أخاولقد
  أخرت تأخو أخوة ويقال أحت بيئة الاخوة أيضا وانما قالوا أخت بالضم لدل على أن
  لذاهب منه واو وصبح ذلاك فيهادون الاخ لاجل التاء التى ئبتت فى الوصل والوقف كالامم
  الثلاثى" والفسبة الى الاخ أخوى وكذلك الى الاخت لانك تقول أخوات وكان يونريقوز
  أختى وليس بقياس وآخاه مؤاخاة واخاه والعامة تقول واخاه وتقول لا أخالك بذلان أى
  ليس هولك يأخ وتاخيا على تفاعلا وتأخبت أخا أى اتخسذت أجا وتأخيت الشئ أيضا
  مثل تحريتسه والآخية بالمد والقشديد واحدة الاواجى قال ابن السكيت وهو أن يدفن
  طر فاقطعة من الحبل فى الارض وفيه عصية أو حغير فيظهر منممثل عروة تشد اليه الداية
  وقد أخيت للدابة تأخية والاخية أيضا الحرمة والذمة تقول لفلان أواخىّ وأسباب ترعى
  ⁦( ادا)⁩ الاداة الالة وابهع الادوات وآداه على كذا يؤديه ايداه اذا قواه عليه وأعانه
  ومن يؤدين على فلان أى من يعيننى عليه وآدى الرحل أيضا أى قوى من الاداة فهو
  موديالهمزأى شاك فى السلاح وأمامودبلاه مزفهو من أودى أى هلك وأهل الجاز
  يقولون آديته على أفعلته أى أعنته وية ولون استاديت الامبر على فلان فادانى جابسه بمعنى
  ستعديته فأعدانى عليه وآديت للسفرفأنا مؤدله اذا كنت متهيأله حكاه بعق وب
  ونا دى أى أخذ للهر أداته قال الاسودين بعفر .
