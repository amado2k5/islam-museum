label: { ar: "الموطأ 141 — ابن عمر يتيمم إلى المرفقين", en: "Muwatta 141", es: "Muwatta 141", fr: "Muwatta 141", ur: "موطا 141", tr: "El-Muvatta 141 — İbn Ömer dirseklerine kadar teyemmüm yapar.", id: "Al-Muwatta 141 — Ibnu Umar melakukan tayammum hingga siku" }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يتيمم إلى المرفقين؛ وهو في باب العمل في التيمم. ويذكر المحقق أنه رواه عن مالك أحمد بن إسماعيل السهمي عند الدارقطني وأبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأنه روي عن ابن عمر مرفوعاً أن التيمم ضربتان: ضربة للوجه وضربة لليدين إلى المرفقين، عند الدارقطني والحاكم، وأن الدارقطني قال إن وقفه هو الصواب. {cite:muwatta-maruf-1997 p.101}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’ menyatakan bahwa Abdullah ibn Umar melakukan tayammum hingga siku; ini terdapat dalam bab tentang praktik tayammum. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Ahmad ibn Ismail al-Sahmi dalam koleksi al-Daraqutni, dan oleh Abu Mus’ab, Suwaid, dan Yahya ibn Bukayr dalam koleksi al-Bayhaqi. Riwayat ini juga dinarasikan dari Ibn Umar, yang dinisbahkan kepada Nabi (shalawat dan salam kepadanya), bahwa tayammum terdiri dari dua pukulan: satu untuk wajah dan satu untuk tangan hingga siku, sebagaimana dicatat oleh al-Daraqutni dan al-Hakim. Al-Daraqutni menyatakan bahwa penaksiran pernyataan ini kepada Ibn Umar adalah yang benar. {cite:muwatta-maruf-1997 p.101}"
