label: { ar: "الموطأ 141 — ابن عمر يتيمم إلى المرفقين", en: "Muwatta 141" }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يتيمم إلى المرفقين؛ وهو في باب العمل في التيمم. ويذكر المحقق أنه رواه عن مالك أحمد بن إسماعيل السهمي عند الدارقطني وأبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأنه روي عن ابن عمر مرفوعاً أن التيمم ضربتان: ضربة للوجه وضربة لليدين إلى المرفقين، عند الدارقطني والحاكم، وأن الدارقطني قال إن وقفه هو الصواب. {cite:muwatta-maruf-1997 p.101}"
