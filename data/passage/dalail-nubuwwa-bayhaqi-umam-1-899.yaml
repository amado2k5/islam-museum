text: "… الفزاري، عن سُفْيان الثَّوْري، عن حَبيب بن أبي عَمْرَة، عن سعيد بن جبير، عن ابن عباس، قال : كَانَ المسلمون يحبون أن يظهر الرُّومُ على فارِسَ لأنَّهمْ أَهْلَ الكتاب، وكانَ المشركون يحبون أن يظهر فارس على الروم لأنهم أهل الأوثان، …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 899، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 899, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 899 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
