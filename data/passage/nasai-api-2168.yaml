label: { ar: "سنن النسائي 2168 — ما أُحل، ما لا يحل", en: "Sunan al-Nasa'i 2168 — what was made lawful; what is not lawful", ur: "سنن نسائی 2168 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan al-Nasa'i 2168 — Lo que se ha hecho lícito; lo que no lo es" }
text: "… حَدَّثَنَا زُهَيْرٌ، قَالَ حَدَّثَنَا أَبُو إِسْحَاقَ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ، أَنَّ أَحَدَهُمْ، كَانَ إِذَا نَامَ قَبْلَ أَنْ يَتَعَشَّى لَمْ يَحِلَّ لَهُ أَنْ يَأْكُلَ شَيْئًا وَلاَ يَشْرَبَ لَيْلَتَهُ وَيَوْمَهُ مِنَ الْغَدِ حَتَّى تَغْرُبَ الشَّمْسُ حَتَّى نَزَلَتْ هَذِهِ الآيَةُ { وَكُلُوا وَاشْرَبُوا } إِلَى { الْخَيْطِ الأَسْوَدِ } قَالَ وَنَزَلَتْ فِي أَبِي قَيْسِ بْنِ عَمْرٍو أَتَى أَهْلَهُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2168، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2168 (The Book of Fasting), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2168، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2168 (El Libro del Ayuno), que menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
