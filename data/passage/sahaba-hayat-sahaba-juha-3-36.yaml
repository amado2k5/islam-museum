text: "… هذا عنك إلا شرّ. قال: شر، أنى لا ادرى الى من اجعل هذا الامر بعدى. ثم التفت الىّ فقال : لعلك ترى صاحبك لها اهلا. قلت: انه لأهل ذلك فى سابقته وفضله. كال: انه لكما قلت ولكنه امرو فيه دعابة …"
