text: "حديث الصبر نصف الإيمان أخرجه أبو نعيم والخطيب من حديث ابن مسعود وتقدم في الصوم حديث من أقل ما أوتيتم اليقين وعزيمة الصبر الحديث بطوله تقدم في العلم مختصرا ولم أجده هكذا بطول حديث جابر سئل عن الإيمان فقال الصبر …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 6547، يذكر السؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 6547, that mentions the question about faith and its answer, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 6547 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 6547, que menciona la cuestión de la fe y su respuesta: la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 4, p. 6547), évoquant la question de la foi et sa réponse, ainsi que la douceur et la plénitude de la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Gazali'nin İhya Ulum el-Din (Dinî İlimlerin Yeniden Canlandırılması) adlı eserinin 4. cildinin 6547. sayfasından bir alıntı, imanla ilgili soru ve cevabı, imanın tatlılığını ve mükemmelliğini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din (Kebangkitan Ilmu-ilmu Agama) karya Al-Ghazali, Jilid 4, halaman 6547, membahas pertanyaan dan jawaban mengenai iman, serta keindahan dan kesempurnaan iman. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
