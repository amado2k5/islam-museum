text: |-
  ٤٠٢
  *⁦(فصل القاف)⁩• .
  • ⁦(قين)⁩•
  كأن مجرى دمعها المستن • قطنة من أجود القطن
  فاغماشدده ضرورة ولا يجوزمثله فى المكلام ويجوزقطن وقطن مثل عسر وعسر وقول لبيد
  فتكنسواقطنا تصر خيامها ء أراديه ثياب القطن والمقطقة التى تزرع فيها الاقطان والقطنية
  بالمكسر واحدة القطانى كالعدص وشبهه واليقطين مالاساقله من النبات كشجر القرع
  ونحوم واليقطينة القرعة الرطبة والقيطون المخدع بلغة أهل مصر ويقال للكرم اذابدت
  زمعاته قد قطن تقطينا ⁦( قعن)⁩ قعين بطن من يو أسد والقيعون نبت (قفن القفينة
  الشاة تذيح من قفاها وقدقفنههاقفنا وه ومنهسى عنه وفى حديث ابراهيم النخمى فيمن ذجح
  فأبان الرأس فقال تلك القفينة لا بأس بم اوية ال الذون زائدة لاتها القفيسة ويقال القفن
  فى موضع التفانتزاد فيه نون منددة قال الراجز
  أحب منك موضع الوحن * وموضع الازاروالفن
  وقول همر رضى اللّٰه عنه انى استعمل الرجل الفابر لاستعير بقوّته نم أكون على قفانه بعى على
  ففاه أى على تتبع أمره والنون زائدة وقال أبو عبيدهو معرب قبان الذى يوزن به (⁦(قن )⁩
  يقال أنت قن أن تفعل كذا بالتهريك أى خليق وجدير لا يثنى ولا يجمع ولا يؤنت قان كسرت
  الميم أوقلت قين ثنيت وجعت وأننت وهذا الامرمقمنة لذاك أى مخلقة له ومجدرة وتقمنت
  فى هذا الامر موافقتك أى نوخيتها ⁦(قنن)⁩ القن العبداذا ملكْ هو وأبواه ويستوى فيه
  الاثنان والمع والمؤنث وربماقالوا عبيد أقنان ثم يجمع على أقنة ويتشدلحري
  أولادقوم خلة وا أقه • وقن القميص وقنانه بالضم كه والقنان أيضاريح الابط أشد
  ما تكون أبو عبيد القنة بالكسرقوة من قوى حبل الليف وجعهاقنن والقنة أيضاضرب
  من الادوية وهو بالفارسية بيرزذ والقنة بالضم أعلى الجبل مثل القلة قال
  أماودماء مائرات تخالها • على قنة العزى وبالنسر عندما
  والجمع قنان مثل برمة وبرام وقتن وقنات واقتنّ الوعل اذا انتصب على القنة وأنشد
  الاصحى * والرحل يقتىّ اقتفان الاعصم • والقنان جبل لبنى أسد قال زهر
  أوكم بالقنان من محل ومحرم• والقفة ن بالكسر ضرب من الجرذان والقنقن أيضا الدليل
  الهادى والبصير بالماء فى حفر القنى وكذان القفاقن بالضم والجمع القفاقن بالفتح والقنينة
  بالكسر والتشديد ما يجول فيسه التمراب والمع القنانى" والوانين الاصول الواحد قانون
  وليس بعربة ين القين المداد وابمع القيون ابن السكيت بقسال للمدادما كان قين
  واقد قان يقين قينا يقال قن اناءل عذا عند القين وقذت الشئ أقيفه فينا لممته واصلحت
  وأنشد ولى 5.دمجروحة دبداجها • صدوع الهوى لوكان قين يقينها
  وفى المثل اذا -معت بسرى القين قانه مصبح وهوسعد القين صار مثلافى الكذب والساطل
  يقال دهدرين سعد القين وبسات قيزا-م موضع كانت يه وقعة فى زمان عبد الملك بن
  حروان قال عويف القواف
  محناهم غداة بشات فين * مللمة اه الجب لطهونا
  وية ال ابى التين من يتي أسد بلقين كما قالوا بلحرث وبلهيهم وهو من شواذ التخفيفَ واذا
