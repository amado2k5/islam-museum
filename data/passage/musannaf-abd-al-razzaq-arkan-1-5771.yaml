text: "… الشيطان في صدورنا، لأَن بخرّ أَحدنا من الثريا أَحبّ إليه من أَن يبوح به. قال النبي عليل : أَو قد وجدتم ذلك ؟ إِنَّ الشيطان يريد العبد فيما دون ذلك، فإِذا عُصم منه أَلقاه فيما هنالك، وذلك صريح الإيمان. - …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 5771، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 5771, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
