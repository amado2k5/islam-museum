label: { ar: "الموطأ 2836 — عمر بن عبد العزيز: الله لا يعذب العامة بذنب الخاصة إذا لم يعمل المنكر جهارا", en: "Muwatta 2836", es: "Muwatta 2836", fr: "Muwatta 2836", ur: "موطا 2836", tr: "El-Muvatta 2836 — Ömer ibn Abdülaziz: Allah, eğer kötülük açıkça işlenmediyse, seçkinlerin günahlarından dolayı genel halkı cezalandırmaz.", id: "Al-Muwatta 2836 — Umar ibn Abd al-Aziz: Allah tidak menghukum masyarakat umum atas dosa-dosa kaum elit jika kesalahan tersebut tidak dilakukan secara terang-terangan." }
summary:
  ar: "يروي مالك عن إسماعيل بن أبي حكيم أنه سمع عمر بن عبد العزيز يقول: كان يقال إن الله تبارك وتعالى لا يعذب العامة بذنب الخاصة، ولكن إذا عمل المنكر جهارا استحقوا العقوبة كلهم. {cite:muwatta-maruf-1997 p.591}"
  tr: "Malik, İsmail ibn Abi Hakim'den rivayetle Ömer ibn Abdülaziz'in şöyle dediğini işittiğini aktarır: \"Denirdi ki, Allah, mübarek ve yüce olan, seçkinlerin günahlarından dolayı genel halkı cezalandırmaz; fakat kötülük açıkça işlenirse, hepsi cezayı hak eder.\" {cite:muwatta-maruf-1997 s.591}"
  id: "Malik meriwayatkan dari Ismail ibn Abi Hakim bahwa ia mendengar Umar ibn Abd al-Aziz berkata: Dahulu dikatakan bahwa Allah, Maha Berkah dan Maha Agung, tidak menghukum masyarakat umum atas dosa-dosa kaum elit, tetapi jika kesalahan dilakukan secara terang-terangan, mereka semua pantas mendapatkan hukuman. {cite:muwatta-maruf-1997 p.591}"
