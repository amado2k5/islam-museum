text: "… في القواعد: البدعة منقسمة إلى واجبة وإلى محرمة ومندوبة ومكروهة ومباحة. قال: والطريق في ذلك أَن نَعْرض البدْعة على قواعد الشَّرْع، فإذا دخلت في قواعد الإِيجابِ فهي واجبة، أَو في قواعد التحريم فهي محرَمة، أَو الندب فمندوبة، أَو المكروه فمكروهة …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 370، يرد فيه ذكر الواجب، والوجوب، والمندوب، والمكروه، والمباح، والتحريم، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 370, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), the disliked (makruh), the permitted (mubah), forbidding (tahrim), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
