text: "جالس أهل الكلام؟ قال: نعم، مرتين، ولم أعد إليها، قال: ولِمَ؟ فقال: أمّا أوّل مجلسٍ حضرتُهُ فرأيت مجلساً قد جمع الفِرَق من السُّنَّة والبَدَعَة والكُفّار واليهود والنَّصارى والدَّهْريّة والمَجُوسِ، ولكّل فرقة رئيس يتكِلّم ويحاول عن مذهبه، فإذا جاء رئيس قاموا …"
