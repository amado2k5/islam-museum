text: |-
  ١٣٧
  بن ربع الهذلى
  حتى اذا أسلكوهم فى قتائدة • ثلا كماتطرد البهالة الشردا
  والساك ولد الجل والانى-لمكة والجمع سلكان مثل صرد وصردان وسليك اسم دجل وهو
  -لميك السعدى" وهو من المدائين كان بقال له سليك المقانب قال الشاعر
  على الهول أمضى من سلميك المقانب* واسم أته سلكة والطعنة السلكى المستقيمة تلقا.
  وجهه قال احر والقيس نطعنهم سلكى ومخلوجة * كرلالامين على نابل
  ويروى كزكلامين (سمك سمك اللّٰه السماء-مكارفعها وسمك الشئ سموكاارتفع وسنام
  سامك تامك أى عال والمسموكات السموات ويقال اسملا فى الريم أى اصعد فى الدرجة
  وسمك البيت ستفه والمسم الأعود يكون فى الخباء يسمك به البيت قال ذوالرمة
  كأن رجليه مسها كان من عشر • صقبان لم يتقشر عنهما النجب
  وصقبان بدل من مسها كين والسهاكان كوكان نيران السمال الاعزل وهومن مشازل
  القمر والسماك الرامح وليس من المنازل ويقال انممارجلا الاسد والسهكمن خلق الماء
  الواحدة سحكة وجمع السمك سمالك وسموك والسميكاء الحساس⁦(€لجهك)⁩ السيهذ والسيهول
  الربح الشديدة مثل السيهج والسيهوج قال المر بن تولب
  وبوارح الارواح كل عشبة • هيف تروح وسيهك تجرى
  وسهكت الربح أى مرّت مواشديدا بقال سهكت الريح الارض اذا أطارت تزابها وذلك
  التراب سيهك قال الكميت • رمادا أطارته السواهك رمددا* والمسهك محمز الرجح
  قال أبو كبير الهذلى بمعابل ضلع الظباة كأنها * جر عهكة يشب لمصحالى
  وسهكت الدابة أى جرت جريا خفيفا وفرس مسهل أى سريع الجرى والسهك بالتريك
  ريح السمل وصدا الحديد يقال يدى من السعل ومن صدا الحديد سهكة كمابقال يدى من
  اللبن والزبدوضرة ومن اللحم غمرة وتقول بعينه ساهك أى رمدوحكة وسهوكته قدسهوك
  أى أدبروهلك وسهكه يسهكه سهكاافة فى -صقه ⁦(-وك)⁩ السواك المسواك قال أبوزيد
  السوالذيجمع على سوك مثل كتاب وكتب قال الشاءر
  أغر الثنايا أحمّ اللمات تنحم سو الاسصل
  ومول فاه تسويكا واذاقلت استال أوتسوّلا لم تذكرالفم ويقال ياءت الابل تساولك أى
  تمايل من الضعف فى مشيها قال عبيد الله بن الحرّ الجعفىّ
  الى اللّٰه نشكومانرى بجيادنا • تساوك هزلى مخهن قليل
  صل الشين بك لشبك انظلط والتداخل ومنه تشبيك الاصابع والشباكة
  واحدة الشبابيك وهى المشبكة من الخديد والرحم مشتبكة وبين الرجلين شبكة ذسب أى قرابة
  والشبكة التى يصادبها والجع شبالوربما سموا الا بارشبا كااذاكثرت فى الارض
  وتقاربت واشتبك الظلام أى اختاط ⁦(شرك)⁩ الشريك يجمع على شركاء وأشبر النمشل
  شريف وشرفاء وأشراف والمرأة شريكة والنساء شرائك وشاركت فلا ناصرت شريكه
  واشتركتاوتشاركنا فى كذاوشركته فى البيع والميرات أشركد شركة والاسم الشرل
  ٢٥
  صاح
  قول بعينه ساهل هو كصاحب
  كمافى القاموس !م
