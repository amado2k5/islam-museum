  وطائف القوس مابين السية والابهز والطائفة ص الشى قطعة منه وقوله تعالى
  وليشهد عذابه-ماطائفة من المؤمنين قال ابن عباس رضى اللّٰه عنهما الواحد فافوه
  والطوفان المطر الغالب والماء الغالب يغشى كل شئ قال تعالى فأخذهم الطوفان وهم
  ظالمون قال الاخفش واحدها فى القياس طوقانة وانشد
  غير الجدة من آياتها * خرق الريح وطوفان المطر
  قال الخليل بن أحد وقد شبه العجاج ظلام الليل بذلك فقال
  -تى اذا مايومها تصبصبا • وعمّ طوفان الظلام الاثأبا
  ويقال أخذه بلموف رقبته وبطاف رقبته مثل صوف رقبته وتطوّف الرجل أى طاف
  وطوّف أى أكثر التطواف وأطاف به أى ألتم به وقاربه قال بشر
  أبو صبية شعث يطيف بشخصه * كوالح أمثال البعاسيب ضمر
