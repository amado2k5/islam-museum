text: |-
  ⁦(١)⁩ يقال تنوّق فى الامرتانق
  أى أعمل فكره فيه وجوّده اه فاسى
  ⁦(باب الباء)⁩
  برهرهة رأدة رخصة • كخرعوبة البانة المنفطر
  وجل خرعوب أى طويل فى حسن خلق (خزب خزبت الناقة بالكسر تخزب خزبا اذا
  ورم ضرعها وضاقت احاليلها وكذلك الشاة يقال لحم خزب اذا كان رخصا وكل لهة رخصة
  خزية والحزلبة القطع السريع شب جمع الخشبة خشب وخشب وخشب وخشبان
  وخشبت الشئ بالشئ خلطته به قال الاعشى يصف فرسا لامقرف ولا مخشوب والخشيب
  السيف الذى بدئ طبعه والخشيب أيضا الصقيل وهو من الاضداد قال الاحر قال لى
  أعراتى قلت اصيقل (هل فرغت من سيفى قال نعم الا أنى لم أخشبه قال وانخشب أن يضع
  عليه سناناء ريضا أملس فيدلكه به فان كان فيه شعث أوشة وق أوحدب ذهب واملس
  وقول صخر ومرهف أخلصت خشيته أى طبيعته والخشيب السهم حين يبرى البرى الأوّل
  وجمل خشيب أى غليظ ابن السكيت خشيت الشعراذاقلته كمايجئ نم تتنوّق فيه ١
  والاخشب الجبل الخشن العظيم قال الشاءر تحسب فوق الشول منه أخشبا
  والاخشبان جبلامكة وفى الحديث لا تزول مكة حتى يزول أخشباها وجبهة خشباء
  أى كريهة يابسة وأكمة خشباء قال رؤبة بكل خشباء وكل سفح وظليم ختب أى خشن
  وقداخشوشب أى صارخشباوه والخشن وقال أبو عبيد كل شئ غليظ خشن فهو أخشب
  وخشب وفى حديث عمررضى اللّه عنه اخشوشبوا قاله والغلظ وابتذال النفس
  فى العسمل والاحتفاء فى المشى ليغلظ الجسد وتخشبت الابل اذا أكات اليبيس من المرعى
  ورجل قشب خشب اذا كان لاخير فيه وخشب إتساع له وبنورزام بن مالك بن حنظلة يقال
  لهم الخشاب قال جرير أنعلية الفوارس أورياحا * عدلت بهم طهية والخشابا
  ⁦( خصب)⁩ الخصب بالكسر نقيض الجدب يقال بلدخصب وبلد أخداب كما فالوايلد
  سبسب وبادسباسب ورمح أقصادوبرمة أعشار ونوب أمعال وأخلاق فيكون الواحد
  يراديه الجمع كأنهسم جعلوه أجزاء وقد أخصبت الارض ومكان مخصب وخصيب وأخصب
  القوم آى صاروا الى اخصب وأخصب جناب القوم وهو ماحولهم وفلان خصيب الجناب
  أى خصيب الناحيمة والخصاب النخل الكثير الحل الواحدة خصبة بالفتح وقال الاعشى
  كأنّ على انسائها عذق خصبة • تدلى من الكافور غير.كمم أ ى غير مستود
  ( ضب الخضاب ما يختضب به وقد خضيت الشئ أخضبه خضبا واختضب بالحناء
  ونحوه وكف خضيب والكف الخحضيب نجم والخضبة مثال الهمزة المرأة الحكثيرة
  الاختضاب وبنان خضيب مخضب شدد للمبالغة والمخضب المركن وخضب النخل اذا اخضر
  والخاضب الظليم الذى أكل الربيع واحرّ ظانبوباه أواصفرا قال أبودواد
  له ساقاظليم خاضب فوجى بالرعب ولا يقال ذلك الاللظليم دون النعامة⁦(خطب )⁩ انططب
  سبب الامر تقول ما خطيك وخطبت على المنبر خطبسة بالضم وخاطبه بالكلام مخاطبة
  وخطابا وخطبت المرأة خطبة بالسكسر واختطب أيضافيهما وانخطيب الحاطب وانخطيبي
  الخطبة قال عدى بن زيديذ كرقصد جذيمة الابرس نخطية الزباء
  نظطيبى التى غ_دوت وخانت * وهنّ ذوات نمائلة لحينا
  والخطب
