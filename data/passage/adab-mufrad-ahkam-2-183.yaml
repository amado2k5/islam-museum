text: "… قتادة - قدّثنا مالك بن إسماعيل قال : حدثنا أَبو عوانة، عن عمر بن أَبى سلمة عن أَبيه، عن أَبى هريرة، عن النى وَةِ قال ثلاث كاهن حق على كل مسلم : عيادة المريض، وشهود الجنازة، وتشميت العاطس إذا حمد …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 183، يرد فيه ذكر ما وجب على كل مسلم، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 2, p. 183, whose wording mentions a duty laid on every Muslim, a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 2، ص 183 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Adab al-Mufrad de al-Bukhari, volume numérisé 2, p. 183, dont le texte mentionne un devoir imposé à chaque musulman, un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Adab al-Mufrad de al-Bukhari, volumen digitalizado 2, p. 183, cuyo texto menciona un deber impuesto a cada musulmán, un derecho debido por cada musulmán; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 2. cildinin 183. sayfasından, her Müslümanın yükümlülüklerini ve haklarını anlatan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bölümde farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar ele alınmaktadır."
  id: "Kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 2, halaman 183, yang menyebutkan kewajiban dan hak setiap Muslim. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Bagian ini mencakup bagian tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
