label: { ar: "الموطأ 943 — القاسم عن عائشة: أن رسول الله أفرد الحج", en: "Muwatta 943", es: "Muwatta 943", fr: "Muwatta 943", ur: "موطا 943", tr: "El-Muvatta 943 — El-Kasım, Aişe'den rivayetle: Allah Resulü Hac ibadetini ayrı olarak yerine getirmiştir.", id: "Al-Muwatta 943 — Al-Qasim berdasarkan riwayat Aisyah: bahwa Rasulullah SAW melaksanakan ibadah haji secara terpisah" }
text: "أن رسول الله أفرد الحج"
summary:
  ar: "يرويه مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة أم المؤمنين، أن رسول الله أفرد الحج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1076) وإسماعيل بن أبي أويس عند مسلم والجوهري والبيهقي وغيرهم كثيرون. {cite:muwatta-maruf-1997 p.451}"
  tr: "Malik'in, Abdülrahman ibn el-Kâsım'dan, onun babasından, onun da Müminlerin Annesi Ayşe'den rivayet ettiğine göre, Allah Resulü Hac ibadetini ayrı olarak yerine getirmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1076) ve İsmail ibn Ebu Uveys tarafından rivayet edildiğini, Müslim, Cevhari, Beyhaki ve daha birçok kişi tarafından da kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.451}"
  id: "Diriwayatkan oleh Malik dari Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Aisyah, Ummul Mukminin, bahwa Rasulullah SAW melaksanakan ibadah haji secara terpisah. Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus'ab (1076) dan Ismail ibn Abi Uways, sebagaimana dicatat oleh Muslim, al-Jawhari, al-Bayhaqi, dan banyak lainnya. {cite:muwatta-maruf-1997 p.451}"
