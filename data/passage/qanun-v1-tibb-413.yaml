text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف الباء وماء الحمّاض. وثفل البول يجعل على الحمرة فينفع، وينفع طلاء من الجرب والسعفة والقروح المدوّدة، وقروح القدم يبال عليها ويترك حتى يبرأ. آلات المفاصل : ينفع من الأوجاع العصبية …"
summary:
