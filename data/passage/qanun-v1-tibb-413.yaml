text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف الباء وماء الحمّاض. وثفل البول يجعل على الحمرة فينفع، وينفع طلاء من الجرب والسعفة والقروح المدوّدة، وقروح القدم يبال عليها ويترك حتى يبرأ. آلات المفاصل : ينفع من الأوجاع العصبية …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 413، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 413, that mentions pain, named diseases, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 413 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 413, que menciona el dolor, las enfermedades, los órganos del cuerpo, el medicamento, los medicamentos y la farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 413, qui mentionne la douleur, les maladies nommées, les organes du corps, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 413'ten bir bölüm; ağrı, hastalıkların isimleri, vücut organları, tıp, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 413, yang menyebutkan rasa sakit, nama-nama penyakit, organ tubuh, obat-obatan, narkoba, dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
