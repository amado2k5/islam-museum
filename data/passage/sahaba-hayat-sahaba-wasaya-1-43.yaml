text: "… يكون الدجال قد طرق، قال الحاكم: هذا حديث صحيح على شرط الشيخين ولم يخرجاه ووافقه الذهبي. الإيمان بما هو كائن فى القبر والبرزخ اخرج احمد فى الزهد عن عبادة بن نسى قال : لما حضرت ابا بكر الوفاة قال لعائشةا: …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 43، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 43, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 43 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
