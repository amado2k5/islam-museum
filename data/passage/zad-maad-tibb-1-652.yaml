text: "… في سنته عن سهل بن حنيفٍ، قال: مررنا بسيل، فدخلتُ، فاغتسلت فيه، فخرجتُ محموماً، فنُمِيَ ذلك إلى رسول اللَّه الله فقال: مُرُوا أَبا ثَابتٍ يَتَعَوَّذُ، قال : فقلت: يا سيدي! والرقى صالحة؟ فقال: لا رُقْيةَ إلَّا في نَفْسٍ، أَو حُمَةٍ …"
