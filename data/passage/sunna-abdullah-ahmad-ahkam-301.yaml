text: "… لله، وبمنزلة القدرية وهم يقولون بخلاف القدر، ولو أن رجلًا ينكر أرضًا لسُمي : أرضيًّا. - قال إسحاق بن راهويه نخمالله: غلت المرجئة حتى صار من قولهم : إن قومًا يقولون: من ترك المكتوبات، وصوم رمضان، والزكاة، والحج، وعامة الفرائض …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 301، يرد فيه ذكر الفريضة والفرائض، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 301, whose wording mentions the obligation (farida), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 301 کا اقتباس جس میں فریضہ اور فرائض، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 301, dont le texte mentionne l'obligation (farida), la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 301, cuyo texto menciona la obligación (farida), la oración prescrita; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, farz olan amelleri ve farz namazları anlatan 301. sayfadan bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 301, yang menyebutkan amalan wajib dan shalat yang dianjurkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
