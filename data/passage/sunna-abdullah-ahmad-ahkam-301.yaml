text: "… لله، وبمنزلة القدرية وهم يقولون بخلاف القدر، ولو أن رجلًا ينكر أرضًا لسُمي : أرضيًّا. - قال إسحاق بن راهويه نخمالله: غلت المرجئة حتى صار من قولهم : إن قومًا يقولون: من ترك المكتوبات، وصوم رمضان، والزكاة، والحج، وعامة الفرائض …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 301، يرد فيه ذكر الفريضة والفرائض، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
