text: "… وكان في مرضه تسلم عليه الملائكة، فاكتوى ففقد أَعِددت لهذا اليوم؟ قال: شهادة أن لا إله إِلا الله، التسليم، ثمّ عادت إِليه، وكان به استسقاءً فطال به وأن محمداً رسول اللّه، وقال : سنين كثيرة، وهو صابر عليه، وشُقَّ بطنه، …"
