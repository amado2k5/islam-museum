text: "… ذكر ابْنُ إسْحَاقَ أن أسقف نَجْرَان لم يسلم. وقد قيل: إن أسقف نجران هذا اسمه الحارث بن علقمة، من بني بكر بن وائل. والأسقف نعت من نعوت أكابر النصارى.، أبو سلمى. قال ابن منده: استشهد بخَيْبَر، ثم ساق حديث - …"
