label: { ar: "صحيح مسلم 281 — الأب والأبوة", en: "Sahih Muslim 281 — the father and fatherhood", ur: "صحیح مسلم 281 — باپ اور والدیت", es: "Sahih Muslim 281 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَابْنُ، نُمَيْرٍ قَالاَ حَدَّثَنَا مُصْعَبٌ، - وَهُوَ ابْنُ الْمِقْدَامِ - حَدَّثَنَا عِكْرِمَةُ بْنُ عَمَّارٍ، عَنْ إِيَاسِ بْنِ سَلَمَةَ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ قَالَ \" مَنْ سَلَّ عَلَيْنَا السَّيْفَ فَلَيْسَ مِنَّا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 281، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 281 (The Book of Faith), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 281، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 281 (El Libro de la Fe), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
