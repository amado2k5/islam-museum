text: "كِتَابُ الفِهْرِسْت للنَّدِيم نُزُولِ القُرْآن في مُصْحَفٍ عبد اللّٰه بن مَسْعُود وفي مُصْحَفٍ أُتيّ بن كَعْب من كتاب القِرَاءَات للفَضْلِ بن شَاذَان، :، كما أخَذَ بَعْضَ تَرَاجِم القُرَّاء من كتابي الطَّبَقَات الكبرى لابن سَعْد و المَعَارِف لابن قُتَيْبَة. واسْتَخْدَمَ النَّدِيمُ …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 99، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 1, p. 99, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 1، ص 99 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
