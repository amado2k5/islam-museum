summary:
  ar: "القسم 45 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب ثواب القرآن عن رسول الله»، ويضم فيها النصوص من 2875 إلى 2926 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 45 of Jami' al-Tirmidhi (Chapters on The Virtues of the Qur'an) in the division of the open hadith dataset the museum took its reports from: reports 2875 to 2926 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 45، عنوان «کتاب ثواب القرآن عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2875 تا 2926۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 45 de Jami' al-Tirmidhi (Capítulos sobre las virtudes del Corán) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2875 al 2926, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 45 de Jami' al-Tirmidhi (Chapitres sur les vertus du Coran), qui correspond aux hadiths 2875 à 2926 de la numérotation de ce recueil. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 45. bölümü, \"Allah Resulü'nün rivayetine göre Kur'an'ın sevabı kitabı\" başlığını taşımakta olup, 2875 ile 2926 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 45 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pahala Al-Qur'an dari Rasulullah,\" dan berisi teks 2875 hingga 2926, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
