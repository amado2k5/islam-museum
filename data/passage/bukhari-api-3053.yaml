text: "… يَنْبَغِي عِنْدَ نَبِيٍّ تَنَازُعٌ فَقَالُوا هَجَرَ رَسُولُ اللَّهِ. قَالَ \" دَعُونِي فَالَّذِي أَنَا فِيهِ خَيْرٌ مِمَّا تَدْعُونِي إِلَيْهِ \". وَأَوْصَى عِنْدَ مَوْتِهِ بِثَلاَثٍ \" أَخْرِجُوا الْمُشْرِكِينَ مِنْ جَزِيرَةِ الْعَرَبِ، وَأَجِيزُوا الْوَفْدَ بِنَحْوِ مَا كُنْتُ أُجِيزُهُمْ \". وَنَسِيتُ الثَّالِثَةَ. وَقَالَ يَعْقُوبُ بْنُ مُحَمَّدٍ سَأَلْتُ الْمُغِيرَةَ بْنَ عَبْدِ الرَّحْمَنِ عَنْ جَزِيرَةِ الْعَرَبِ. فَقَالَ مَكَّةُ وَالْمَدِينَةُ وَالْيَمَامَةُ وَالْيَمَنُ. …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3053، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3053 (Fighting for the Cause of Allah (Jihaad)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3053، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
