label: { ar: "نوادر جحا الكبرى، ص 154 — «قلبوا البئر حتى يجف»", en: "Nawadir Juha al-Kubra, p. 154 — 'They Turned the Well Over Until It Dried'", ur: "نوادر جحا الکبریٰ، ص 154 — «انہوں نے کنویں کو الٹ دیا یہاں تک کہ وہ سوکھ گیا»", fr: "Nawadir Juha al-Kubra, p. 154 — « Ils ont retourné le puits jusqu'à ce qu'il soit sec »", es: "Nawadir Juha al-Kubra, p. 154 — «Dieron la vuelta al pozo hasta que se secó»" }
text: "… قلبوا البئر حتى يجفَّ كان يوماً في مدينة أفيون قره حصار وكان قد حضرٍ إليها رجل إيرانيٌّ فاجتمعَ به ورافقه في تجوالِهِ وفي أثناءِ الصحبةِ، رأى الإيرانيُّ تلَّةً سوداء مرتفعة عنِ البلد، فأراها للشيخ وسأله: ما هذا؟ فأجابه الشيخ: هذا …"
summary:
  ar: "في مدينة أفيون قره حصار رأى فارسي كان يسافر مع جحا تلة داكنة وسأل ما هي، فقال جحا إنها بئر البستان، فسأله كيف تكون البئر فوق الأرض، فقال إنهم نظفوها وقلبوا باطنها إلى الخارج حتى جفت. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  en: "In the city of Afyon Karahisar, a Persian travelling with Juha sees a dark hill and asks what it is; Juha says it is the orchard's well; asked how a well can be above ground, he says they cleaned it and turned its inside out until it dried. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  ur: "افیون قرہ حصار شہر میں جحا کے ساتھ سفر کرنے والے ایک ایرانی نے ایک سیاہ ٹیلا دیکھا اور پوچھا کہ یہ کیا ہے، جحا نے کہا کہ یہ باغ کا کنواں ہے، اس نے پوچھا کہ کنواں زمین کے اوپر کیسے ہو سکتا ہے، تو جحا نے کہا کہ انہوں نے اسے صاف کیا اور اس کا اندر باہر الٹ دیا یہاں تک کہ وہ سوکھ گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  fr: "Dans la ville d'Afyon Karahisar, un Persan qui voyage avec Juha voit une colline sombre et demande ce que c'est ; Juha dit que c'est le puits du verger ; interrogé sur la façon dont un puits peut se trouver au-dessus du sol, il répond qu'on l'a nettoyé et retourné de l'intérieur vers l'extérieur jusqu'à ce qu'il soit sec. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  es: "En la ciudad de Afyon Karahisar, un persa que viaja con Juha ve una colina oscura y pregunta qué es; Juha dice que es el pozo del huerto; al preguntarle cómo puede un pozo estar sobre la tierra, responde que lo limpiaron y le dieron la vuelta de dentro afuera hasta que se secó. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
