text: "… الى الدرجاه للة تُغطيى الى سطوح دار العامّة وخرائن السلاح نصب لهم سلاليم على سطحة المجلس الذى يجلس فيه محمّد ابن عبد الله والفتح بن سهل فاشرف المستعين على الناس وعليه سواد وفرق السواد برده النبىّ صلعم ومعه القصيب فكلّم …"
