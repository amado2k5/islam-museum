label: { ar: "سنن أبي داود 2635 — الأب والأبوة", en: "Sunan Abi Dawud 2635 — the father and fatherhood", ur: "سنن ابی داؤد 2635 — باپ اور والدیت", es: "Sunan Abi Dawud 2635 — El padre y la paternidad" }
text: "حَدَّثَنَا سَعِيدُ بْنُ مَنْصُورٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ عَبْدِ الْمَلِكِ بْنِ نَوْفَلِ بْنِ مُسَاحِقٍ، عَنِ ابْنِ عِصَامٍ الْمُزَنِيِّ، عَنْ أَبِيهِ، قَالَ بَعَثَنَا رَسُولُ اللَّهِ فِي سَرِيَّةٍ فَقَالَ \" إِذَا رَأَيْتُمْ مَسْجِدًا أَوْ سَمِعْتُمْ مُؤَذِّنًا فَلاَ تَقْتُلُوا أَحَدًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2635، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2635 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2635، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2635 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
