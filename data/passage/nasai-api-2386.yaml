label: { ar: "سنن النسائي 2386 — عمل يعدل عملا أعظم منه", en: "Sunan al-Nasa'i 2386 — a deed that equals a greater one", ur: "سنن نسائی 2386 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sunan al-Nasa'i 2386 — una acción que equivale a una mayor", fr: "Sunan al-Nasa'i 2386 — une action qui en vaut une plus grande", tr: "Sunan an-Nasa'i 2386 — Daha büyük bir eyleme denk bir eylem", id: "Sunan an-Nasa'i 2386 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… عَمْرِو بْنِ شُرَحْبِيلَ، قَالَ أَتَى رَسُولَ اللَّهِ رَجُلٌ فَقَالَ يَا رَسُولَ اللَّهِ مَا تَقُولُ فِي رَجُلٍ صَامَ الدَّهْرَ كُلَّهُ فَقَالَ رَسُولُ اللَّهِ \" وَدِدْتُ أَنَّهُ لَمْ يَطْعَمِ الدَّهْرَ شَيْئًا \". قَالَ فَثُلُثَيْهِ قَالَ \" أَكْثَرَ \". قَالَ فَنِصْفَهُ قَالَ \" أَكْثَرَ \". قَالَ \" أَفَلاَ أُخْبِرُكُمْ بِمَا يُذْهِبُ وَحَرَ الصَّدْرِ \". قَالُوا بَلَى. قَالَ \" …"
summary:
  ar: "حديث في سنن النسائي، رقم 2386، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2386 (The Book of Fasting), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2386، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2386 (El Libro del Ayuno), habla de una acción que equivale a otra mayor. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2386 (Le Livre du jeûne), évoque une action qui en vaut une autre, plus grande encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, écrivent, effacent ou évaluent une action."
  tr: "Sunan-ı Nesai'de yer alan 2386 numaralı hadiste, daha büyük bir ameli sayan bir amelden bahsedilir. Bu amel, iyi ve kötü ameller listeleriyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 2386, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
