text: "… عَمْرِو بْنِ شُرَحْبِيلَ، قَالَ أَتَى رَسُولَ اللَّهِ رَجُلٌ فَقَالَ يَا رَسُولَ اللَّهِ مَا تَقُولُ فِي رَجُلٍ صَامَ الدَّهْرَ كُلَّهُ فَقَالَ رَسُولُ اللَّهِ \" وَدِدْتُ أَنَّهُ لَمْ يَطْعَمِ الدَّهْرَ شَيْئًا \". قَالَ فَثُلُثَيْهِ قَالَ \" أَكْثَرَ \". قَالَ فَنِصْفَهُ قَالَ \" أَكْثَرَ \". قَالَ \" أَفَلاَ أُخْبِرُكُمْ بِمَا يُذْهِبُ وَحَرَ الصَّدْرِ \". قَالُوا بَلَى. قَالَ \" …"
summary:
  ar: "حديث في سنن النسائي، رقم 2386، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2386 (The Book of Fasting), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2386، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
