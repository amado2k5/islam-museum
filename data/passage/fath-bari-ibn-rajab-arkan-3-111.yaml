text: "… والملحفة نطعم الطعام وتقرأ السلام تعبد اللّٰه، ولا تشرك به شيئًا تعجَّب ربك من راعي غنم في شظية بجبل يؤذن للصلاة ويصلي... تعجيل الصلاة في اليوم الدخن حقيقة الإيمان عجيل الصلاة في يوم الغيم من الإيمان تعشى ابن عمر وهو …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 3، ص 111، يذكر ما عُدّ من الإيمان، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 3, p. 111, that mentions what is counted as part of faith, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 3، ص 111 کا اقتباس جس میں جو ایمان میں سے گنا گیا، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
