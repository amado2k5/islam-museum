text: "… والملحفة نطعم الطعام وتقرأ السلام تعبد اللّٰه، ولا تشرك به شيئًا تعجَّب ربك من راعي غنم في شظية بجبل يؤذن للصلاة ويصلي... تعجيل الصلاة في اليوم الدخن حقيقة الإيمان عجيل الصلاة في يوم الغيم من الإيمان تعشى ابن عمر وهو …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 3، ص 111، يذكر ما عُدّ من الإيمان، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 3, p. 111, that mentions what is counted as part of faith, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 3، ص 111 کا اقتباس جس میں جو ایمان میں سے گنا گیا، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 3, pág. 111, que menciona lo que se considera parte de la fe, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 3, p. 111) évoquant ce qui constitue la foi, sa douceur et sa plénitude. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 3. resimli cildinin 111. sayfasından, imanın özünü, tatlılığını ve mükemmelliğini anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, jilid bergambar 3, halaman 111, yang menyebutkan apa yang membentuk iman, kemanisannya, dan kesempurnaannya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
