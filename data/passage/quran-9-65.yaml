text: "وَلَئِن سَأَلْتَهُمْ لَيَقُولُنَّ إِنَّمَا كُنَّا نَخُوضُ وَنَلْعَبُ ۚ قُلْ أَبِٱللَّهِ وَءَايَـٰتِهِۦ وَرَسُولِهِۦ كُنتُمْ تَسْتَهْزِءُونَ"
text_search: "ولئن سألتهم ليقولن إنما كنا نخوض ونلعب ۚ قل أبالله وآياته ورسوله كنتم تستهزئون"
translations:
  en: { text: "And if thou ask them (O Muhammad) they will say: We did but talk and jest. Say: Was it at Allah and His revelations and His messenger that ye did scoff?", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور اگر تم ان سے (اس بارے میں) دریافت کرو تو کہیں گے ہم تو یوں ہی بات چیت اور دل لگی کرتے تھے۔ کہو کیا تم خدا اور اس کی آیتوں اور اس کے رسول سے ہنسی کرتے تھے", translator: "Fateh Muhammad Jalandhari", license: PD }
