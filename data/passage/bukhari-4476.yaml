label:
  ar: "البخاري 4476 — حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع"
  en: "Bukhari 4476 — The great intercession: raise your head, intercede and it will be granted"
  ur: "بخاری 4476 — بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی"
text: "يجتمع المؤمنون يوم القيامة فيقولون لو استشفعنا إلى ربنا فيأتون آدم فيقولون أنت أبو الناس، خلقك الله بيده وأسجد لك ملائكته، وعلمك أسماء كل شىء، فاشفع لنا عند ربك حتى يريحنا من مكاننا هذا. فيقول لست هناكم ويذكر ذنبه فيستحي …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4476: حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4476: The great intercession: raise your head, intercede and it will be granted. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4476: بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
