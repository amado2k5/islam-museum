label: { ar: "صحيح البخاري 4007 — الأب والأبوة", en: "Sahih al-Bukhari 4007 — the father and fatherhood", ur: "صحیح بخاری 4007 — باپ اور والدیت", es: "Sahih al-Bukhari 4007 — El padre y la paternidad", fr: "Sahih al-Bukhari 4007 — Le père et la paternité" }
text: "… عُرْوَةَ بْنَ الزُّبَيْرِ، يُحَدِّثُ عُمَرَ بْنَ عَبْدِ الْعَزِيزِ فِي إِمَارَتِهِ أَخَّرَ الْمُغِيرَةُ بْنُ شُعْبَةَ الْعَصْرَ وَهْوَ أَمِيرُ الْكُوفَةِ، فَدَخَلَ أَبُو مَسْعُودٍ عُقْبَةُ بْنُ عَمْرٍو الأَنْصَارِيُّ جَدُّ زَيْدِ بْنِ حَسَنٍ شَهِدَ بَدْرًا فَقَالَ لَقَدْ عَلِمْتَ نَزَلَ جِبْرِيلُ فَصَلَّى فَصَلَّى رَسُولُ اللَّهِ خَمْسَ صَلَوَاتٍ ثُمَّ قَالَ هَكَذَا أُمِرْتَ. كَذَلِكَ كَانَ بَشِيرُ بْنُ أَبِي مَسْعُودٍ يُحَدِّثُ عَنْ أَبِيهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4007، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4007 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4007، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4007 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4007 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
