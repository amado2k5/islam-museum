label: { ar: "الموطأ 2256 — مالك: لا تُشترى الرقبة الواجبة بشرط عتقها", en: "Muwatta 2256", es: "Muwatta 2256", fr: "Muwatta 2256", ur: "موطا 2256", tr: "El-Muvatta 2256 — Malik: Azat edilmesi gereken köle, azat edilmesi şartıyla satın alınamaz.", id: "Al-Muwatta 2256 — Malik: Budak yang harus dibebaskan tidak dapat dibeli dengan syarat pembebasannya." }
summary:
  ar: "يرى مالك أن أحسن ما يُعمل به في الرقبة الواجبة ألا يشتريها من يعتقها بشرط العتق، لأنها لا تكون حينئذ رقبة تامة، إذ يُنقص من ثمنها بقدر ما اشترط من العتق. {cite:muwatta-maruf-1997 p.331}"
  tr: "Malik, köle azat etme zorunluluğu konusunda en iyi yolun, köleyi azat edecek kişinin onu azat etme şartıyla satın almaması olduğuna inanmaktadır; çünkü bu durumda kölenin fiyatı azat etme şartıyla belirlenen miktar kadar düşürüldüğü için, azat etme işlemi tam anlamıyla gerçekleşmiş olmaz. {cite:muwatta-maruf-1997 s.331}"
  id: "Malik berpendapat bahwa tindakan terbaik terkait kewajiban membebaskan seorang budak adalah agar orang yang akan membebaskannya tidak membelinya dengan syarat pembebasan, karena dengan demikian itu bukanlah tindakan pembebasan budak yang lengkap, karena harganya dikurangi dengan jumlah yang ditetapkan dalam syarat pembebasan. {cite:muwatta-maruf-1997 p.331}"
