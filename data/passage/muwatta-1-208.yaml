label: { ar: "الموطأ 208 — أم الفضل: آخر ما سمعته يقرأ به في المغرب سورة المرسلات", en: "Muwatta 208" }
text: "يا بني لقد ذكرتني بقراءتك هذه السورة، إنها لآخر ما سمعت رسول الله يقرأ بها في المغرب"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن عبد الله بن عباس، في باب القراءة في المغرب والعشاء: سمعته أمه أم الفضل بنت الحارث يقرأ سورة المرسلات، فقالت له إنه ذكّرها بقراءته هذه السورة، وإنها آخر ما سمعت النبي يقرأ به في المغرب. ويخرّجه المحقق عند البخاري (763) ومسلم (2/40) وأبي داود (810) وابن حبان وأحمد (6/340) والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (9/22). {cite:muwatta-maruf-1997 p.128} {cite:muwatta-maruf-1997 p.129}"
