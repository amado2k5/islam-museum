text: "يا بني لقد ذكرتني بقراءتك هذه السورة، إنها لآخر ما سمعت رسول الله يقرأ بها في المغرب"
summary:
  ar: "يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن عبد الله بن عباس، في باب القراءة في المغرب والعشاء: سمعته أمه أم الفضل بنت الحارث يقرأ سورة المرسلات، فقالت له إنه ذكّرها بقراءته هذه السورة، وإنها آخر ما سمعت النبي يقرأ به في المغرب. ويخرّجه المحقق عند البخاري (763) ومسلم (2/40) وأبي داود (810) وابن حبان وأحمد (6/340) والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (9/22). {cite:muwatta-maruf-1997 p.128} {cite:muwatta-maruf-1997 p.129}"
  tr: "Malik, İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe'den, o da Abdullah ibn Abbas'tan rivayetle, akşam ve yatsı namazlarında okunan sureler bölümünde şöyle nakletmiştir: Annesi Ümmü'l-Fadl bint el-Harith, Peygamberimizin Mursalat Suresi'ni okuduğunu işitmiş ve ona, bu sureyi okumasını hatırlattığını ve bunun Peygamberimizin akşam namazında okuduğu son sure olduğunu söylemiştir. Araştırmacı, bu rivayeti Buhari (763), Müslim (2/40), Ebu Davud (810), İbn Hibban, Ahmed (6/340) ve Şafiî'nin derlemelerine, Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil etmiş ve Temhid'e (9/22) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.128} {cite:muwatta-maruf-1997 s.129}"
  id: "Diriwayatkan oleh Malik dari Ibnu Shihab, dari Ubayd Allah ibn Abdullah ibn Utbah, dari Abdullah ibn Abbas, dalam surah tentang bacaan shalat Maghrib dan Isya: Ibunya, Umm al-Fadl bint al-Harith, mendengar beliau membaca Surah al-Mursalat, dan beliau berkata kepadanya bahwa beliau telah mengingatkannya akan bacaan surah ini, dan bahwa itu adalah surah terakhir yang beliau dengar Nabi bacakan dalam shalat Maghrib. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (763), Muslim (2/40), Abu Dawud (810), Ibnu Hibban, Ahmad (6/340), dan al-Shafi'i, melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (9/22). {kutip:muwatta-maruf-1997 hal.128} {kutip:muwatta-maruf-1997 hal.129}"
