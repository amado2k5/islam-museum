text: "رات الأول. وهي يومئذ (4) من أفضل أيامي قريش. فلما أنزل الله في كتابه في زيد بن حارثة ما أنزل. فقال ، ادعوهم لا بائهم هو اقط عند الله. فان لم تعلموا آباءهم فاخوانكم في الدين ومواليكم رد كل واحد"
