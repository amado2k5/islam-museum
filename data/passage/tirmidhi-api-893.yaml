label: { ar: "جامع الترمذي 893 — الرخصة", en: "Jami' al-Tirmidhi 893 — the concession (rukhsa)", ur: "جامع ترمذی 893 — رخصت", fr: "Jami' al-Tirmidhi 893 — la dispense (rukhsa)", es: "Yami' al-Tirmidhi 893 — la dispensa (rukhsa)", tr: "Cami' el-Tirmizi 893 — Ruhsat", id: "Jami' al-Tirmidhi 893 — Lisensi" }
text: "… إِلَى مِنًى. وَقَالَ أَكْثَرُ أَهْلِ الْعِلْمِ بِحَدِيثِ النَّبِيِّ أَنَّهُمْ لاَ يَرْمُونَ حَتَّى تَطْلُعَ الشَّمْسُ. وَرَخَّصَ بَعْضُ أَهْلِ الْعِلْمِ فِي أَنْ يَرْمُوا بِلَيْلٍ. وَالْعَمَلُ عَلَى حَدِيثِ النَّبِيِّ أَنَّهُمْ لاَ يَرْمُونَ. وَهُوَ قَوْلُ الثَّوْرِيِّ وَالشَّافِعِيِّ.. قَالَ أَبُو عِيسَى حَدِيثُ ابْنِ عَبَّاسٍ بَعَثَنِي رَسُولُ اللَّهِ فِي ثَقَلٍ حَدِيثٌ صَحِيحٌ رُوِيَ عَنْهُ مِنْ غَيْرِ وَجْهٍ. وَرَوَى شُعْبَةُ هَذَا الْحَدِيثَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 893، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 893 (The Book on Hajj), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 893، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 893, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 893, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 893 numaralı hadiste bir istisnadan bahsedilir. Farzları, görevleri, itaat edilmesi gerekenleri, tavsiye edilenleri, mekruh edilenleri, haram olanları ve küçük günahları, Kur'an, Sünnet, biyografi ve Sahabe ve Muhaliflerden gelen rivayetlerle birlikte derleyen bu kişi, metinde yer alanları anlatır ancak buna dayanarak bir fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 893, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
