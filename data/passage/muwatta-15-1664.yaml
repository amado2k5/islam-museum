label: { ar: "الموطأ 1664 — يحيى بن سعيد عن محمد بن يحيى بن حبان: كانت عند جده حبان امرأتان هاشمية وأنصارية، طلق الأنصارية وهي ترضع، فحكم لها عثمان بالميراث، وقال هذا عمل ابن عمك", en: "Muwatta 1664", es: "Muwatta 1664", fr: "Muwatta 1664", ur: "موطا 1664", tr: "El-Muvatta 1664 — Yahya ibn Sa’id, Muhammed ibn Yahya ibn Hibban’dan rivayetle: Dedesi Hibban’ın iki karısı vardı, biri Haşimî, diğeri Ensari. Ensari kadını emzirme dönemindeyken boşadı, bu yüzden Osman onun mirasçı olması gerektiğine hükmetti ve “Bu, kuzeninizin yaptığı bir şeydir” dedi.", id: "Al-Muwatta 1664 — Yahya ibn Sa’id berdasarkan riwayat Muhammad ibn Yahya ibn Hibban: Kakeknya, Hibban, mempunyai dua istri, satu dari kaum Hasyim dan satu dari kaum Ansar. Ia menceraikan istri dari kaum Ansar tersebut saat masih menyusui, sehingga Utsman memutuskan bahwa istri dari kaum Ansar itu berhak mewarisi, dan berkata, “Ini adalah perbuatan sepupumu.”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان أنه قال كانت عند جدي حبان امرأتان: هاشمية وأنصارية، فطلق الأنصارية وهي ترضع، فمرت بها سنة، ثم هلك عنها ولم تحض. فقالت أنا أرثه لم أحض، فاختصمتا إلى عثمان بن عفان، فقضى لها بالميراث، فلامت الهاشمية عثمان، فقال عثمان هذا عمل ابن عمك، هو أشار علينا بهذا، يعني علي بن أبي طالب. {cite:muwatta-maruf-1997 p.84}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn Yahya ibn Hibban'dan rivayet ettiğine göre şöyle demiştir: Dedem Hibban'ın iki karısı vardı: biri Haşimî, diğeri Ensari. Ensari olan karısını emzirme dönemindeyken boşadı. Bir yıl geçti, sonra öldü ve kadın henüz adet görmemişti. \"Adet görmemiş olsam bile ondan miras alacağım\" dedi. Bunun üzerine anlaşmazlıklarını Osman ibn Affan'a götürdüler ve Osman miras konusunda kadının lehine hüküm verdi. Haşimî Osman'ı suçladı ve Osman, \"Bu, kuzeninizin işidir; bize bunu yapmamızı o tavsiye etti\" dedi, yani Ali ibn Abi Talib'i kastediyordu. {cite:muwatta-maruf-1997 s.84}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Muhammad ibn Yahya ibn Hibban, bahwa ia berkata: Kakekku Hibban mempunyai dua istri: satu dari suku Hasyim dan satu dari suku Ansar. Ia menceraikan istri Ansarnya ketika ia masih menyusui. Setahun berlalu, kemudian ia meninggal, dan istri Ansarnya belum haid. Ia berkata, \"Aku mewarisi hartanya, meskipun aku belum haid.\" Maka mereka membawa perselisihan mereka kepada Utsman ibn Affan, yang memutuskan untuk memihak istri Ansarnya mengenai warisan tersebut. Istri Hasyim menyalahkan Utsman, dan Utsman berkata, \"Ini adalah perbuatan sepupumu; dia menasihati kami untuk melakukan ini,\" yang dimaksud adalah Ali ibn Abi Talib. {cite:muwatta-maruf-1997 p.84}"
