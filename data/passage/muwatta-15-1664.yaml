label: { ar: "الموطأ 1664 — يحيى بن سعيد عن محمد بن يحيى بن حبان: كانت عند جده حبان امرأتان هاشمية وأنصارية، طلق الأنصارية وهي ترضع، فحكم لها عثمان بالميراث، وقال هذا عمل ابن عمك", en: "Muwatta 1664" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان أنه قال كانت عند جدي حبان امرأتان: هاشمية وأنصارية، فطلق الأنصارية وهي ترضع، فمرت بها سنة، ثم هلك عنها ولم تحض. فقالت أنا أرثه لم أحض، فاختصمتا إلى عثمان بن عفان، فقضى لها بالميراث، فلامت الهاشمية عثمان، فقال عثمان هذا عمل ابن عمك، هو أشار علينا بهذا، يعني علي بن أبي طالب. {cite:muwatta-maruf-1997 p.84}"
