text: "… اللَّهِ، قال: الْمُؤْمِنُ أخُو الْمُؤْمِنِ، فَلا يَجِلُّ لِلْمُؤْمِنِ أنْ. الْمُؤْمِنُ الْقَويُ خَيْرٌ وَأَحَبُ إلَى اللَّهِ مِنَ. الْمُؤْمِنُ لِلْمُؤْمِنِ كَالُبُنْيَانِ، يَشُدُ بَعْضُهُ، الْمُؤْمِنُ يَأْكُلُ فِي مِعَّى وَاحِدٍ وَالْكَافِرُ يَأْكُلُ... الْمُؤْمِنُ يَشْرَبُ فِي مِعْى وَاحِدٍ وَالْكَافِرُ يَشْرَبُ فِي الْمُؤْمِنُ يَغَارُ، وَاللَّهُ أشدُّ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 1978، يذكر مَثَل المؤمن، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 1978, that mentions the likeness of the believer, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 1978 کا اقتباس جس میں مومن کی مثال، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 1978, que menciona la semejanza del creyente y su descripción; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
