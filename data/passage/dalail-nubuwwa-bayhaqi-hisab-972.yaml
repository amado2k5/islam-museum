text: "… آخره : قال فقيل له اصبر على خمس فإنهم يجزين عنك بخمس كل خمس بعشر أمثالها ، قال : فكان موسى أشد عليهم حين مرَّ بِهِ وخيرهم حين رجع إليه ١٣١ . ١٢٩ في ح : خواتم . ١٣٠ في …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 972، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 972, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 972 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 972, que habla de la buena acción multiplicada; de la copia extraída, citada dentro de cuarenta palabras según la política de fuentes."
