  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 972. sayfasında, iyi amellerin çoğaltılmasından bahseden bir pasaj; alıntılanan versiyondan ve kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian”, hlm. 972, yang menyebutkan tentang penggandaan amal kebaikan; dari versi yang diekstrak, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
