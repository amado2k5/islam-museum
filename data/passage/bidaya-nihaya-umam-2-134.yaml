text: "… لس أنه قبر هود عليه اللام واللّه أعلم فقته صدم بنى عود هليه السلدم وهم قبيلة مشهورة يقال تمود باسم جدهم تمود أخى جديس وهما اينا عابر بن ارم بن سام بن نوح وكانوا عرباً من المارية يسكنون الحجر الذى …"
summary:
