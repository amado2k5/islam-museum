text: "… يقولوا فلان عفيف حتى تقلد فلان وذكر رجلا لا أحب أن أسميه - فقلت الرجل من هو؟ فا متنع فألمحت عليه فأوما الى ابى عمر. توفى ابو خازم فى هذه السنة وذكر بعض علماء النقل انه دفن بالكوفة -. - …"
