text: "… النثر أو أكثر من ذلك بلفظ الأقل من غير زيادة ولا نقصان، أو بتغيير لفظ يسير، وهذا هو الذى يسميه أهل هذه الصناعة وقوع الحافر علىٰ الحافر. وقد سئل أبو عمرو بن العلاء عن الشاعرين يتفقان على لفظ واحد ومعنى، …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 3، ص 284، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 3, p. 284, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 3، ص 284 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen 3, pág. 284, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 3, p. 284) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin Resimli Cilt 3, sayfa 284'teki bir alıntısında Kur'an okuyucularından bahsedilmektedir; makine tarafından okunabilir taranmış versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Subh al-A'sha karya Al-Qalqashandi, Jilid Bergambar 3, hlm. 284, menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
