text: "… النثر أو أكثر من ذلك بلفظ الأقل من غير زيادة ولا نقصان، أو بتغيير لفظ يسير، وهذا هو الذى يسميه أهل هذه الصناعة وقوع الحافر علىٰ الحافر. وقد سئل أبو عمرو بن العلاء عن الشاعرين يتفقان على لفظ واحد ومعنى، …"
