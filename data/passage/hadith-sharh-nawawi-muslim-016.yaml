text: "جميع الأسفار المباحة التي يجوز فيها القصر، وقد سبقت المسألة في كتاب في صلاتي الظهر والعصر بعرفات والله أعلم. ٤٩ - باب استحباب تقديم دقع الضعفة من النساء وغيرهن من مزدلفة إلى منى لغيرهم حتى يصلوا الصبح بمزدلفة. حدثنا أفلح"
summary:
