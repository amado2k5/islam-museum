text: "… الفاء والراء الخفيفة، وقد سبق شرحه في صفة النبي، وفيه دليل على أنه واليفي كان يوافق أهل الكتاب إذا خالفوا عبدة الأوثان أخذًا بأخف الأمرين، فلما فتحت مكة ودخل عباد الأوثان في الإسلام رجع إلى مخالفة باقي الكفار وهم أهل …"
