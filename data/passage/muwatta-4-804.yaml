label: { ar: "الموطأ 804 — عطاء بن يسار: سُئل ابن عباس عن القبلة للصائم فأرخص فيها للشيخ وكرهها للشاب", en: "Muwatta 804", es: "Muwatta 804", fr: "Muwatta 804", ur: "موطا 804", tr: "El-Muvatta 804 — Ata’ ibn Yasar: İbn Abbas'a oruçluyken öpüşme hakkında soru soruldu ve o, yaşlılar için buna izin verirken, gençler için bunu hoş karşılamadı.", id: "Al-Muwatta 804 — Ata’ ibn Yasar: Ibnu Abbas ditanya tentang berciuman saat berpuasa, dan beliau memperbolehkannya bagi orang tua tetapi tidak menyukainya bagi anak muda." }
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار، أن عبد الله بن عباس سُئل عن القبلة للصائم، فأرخص فيها للشيخ وكرهها للشاب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي والشافعي. {cite:muwatta-maruf-1997 p.395}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiğine göre, Abdullah ibn Abbas'a oruçluyken öpüşme hakkında soru sorulmuş ve yaşlı bir kişi için buna izin vermiş, ancak genç bir kişi için bunu hoş karşılamamıştır. Araştırmacı, bunu Malik'ten rivayet edenlerin Ebu Musab, Suveyd ve İbn Vahb olduğunu, bunun da Tahavi ve Şafiî tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.395}"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, dari Ata ibn Yasar, bahwa Abdullah ibn Abbas ditanya tentang berciuman saat berpuasa, dan beliau memperbolehkannya untuk orang tua tetapi tidak menyukainya untuk orang muda. Peneliti menyebutkan bahwa Abu Musab, Suwayd, dan Ibn Wahb meriwayatkannya dari Malik, sebagaimana dicatat oleh al-Tahawi dan al-Shafi'i. {cite:muwatta-maruf-1997 p.395}"
