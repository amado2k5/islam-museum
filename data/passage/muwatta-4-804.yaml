summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار، أن عبد الله بن عباس سُئل عن القبلة للصائم، فأرخص فيها للشيخ وكرهها للشاب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي والشافعي. {cite:muwatta-maruf-1997 p.395}"
