text: |-
  ⁦(ف صل الكاف)⁩
  كاذيا وكذيتهاذا قلت له كذيت قال الكسائى أكذبته اذا أخبرت أنه جاء بالكذب وروا.
  وكذبته إذا أخبرت أنه كاذب وقال يُعلب أكذيه وكذيه بمع.ى وقد يكون أكذيه ؟عنى بين
  كذيه وقد يكوت يمعنى حله على الكذب وبمعنى وحده كاذيا وقوله تعالى وكذيوابا ياتنا
  كدابارهو أحد مصادر المنتدلان مصدره قد يحى على تفعيل صثل التكليم وعلى فعال مثل
  كذاب وعلى تفعله مثل توصية وعلى مفعل مثل وهز قناهم كل عمزق وقوله تبارك وته الى ليس
  لوقعتها كاذية هو اسم يوضع موضع الم-دركالعاقية والعافية والياقية وقال فهل ترى
  لهم من باقية أى بتاء وقواهم إنّ بى فلان اي لحتهم مكذوية أى كذب وكذب قد يكون
  يمعنى وحب وفى الحديث ثلاثة أسة اركذ بن عليكم ١ ال ابن السكيت كأن كذب ههنا
  اغراه أى عليكم يه وهى كلمة نادرة يأءت على غير القياس وياء عن أمير المؤمنين عمرين انخطاب
  رضى اللّٰه عنه كذب عليكم الجيح أى وجب قال الاخفسْ فالحح مرفوع يكذب ومعماء تصب
  لانه ريد أن يامر بالخيح فايفال أمكنك الصدريدارمه قال الشاءر
  كذب العميق ومامش بارد * ان كنت سائلتى غبوقافاذهبى
  يتقول عليك العتيق وتول ما كذب فلان أن فهل كذا أى مالبث وتكذب ذلان اذا
  نسكلف الكذب وية ال حل فلان فهاكذب يا تشديد أى ماجين وحل ثم كذب أى لم يصدف
  المملة قال الشاعر
  ليتبعثر يصطاد الربال اذا • ما الليث كذب عن أقرانه مدقا
  وكذب لعن الناقة أى ذهب ⁦( رب)⁩ الكرية بالضم التم الذى يأخذ بالنفس وكذالاك
  الكوب على-ثال الضرب تقول منه كريد الغم اذا استد عليه والكرائب الشدائد الواحدة
  كرية وقال فيال رزام رشعوابى مقدما • الى الموت خواضا اليه الكرانيا
  وكريت القيد اذاضيقته على المقيد وقال
  ازجر +ارك لايرتع بروضتنا * اذن يردوقيد العبر مكروب
  وكرب أن يفعل كذا أى كاد يفعل وكربت الارض اذا قلبته اللحرث وفى المثسل السكراب علي
  البقروبقال الكلاب على البروكرب الشى أى دناو إناء كربان اذاكرب أن يمتلى وكربت
  الشمس أي دنت للغروب بقال كريت حياة النارأى قرب انطفاؤها وقال
  . أبن ان أباك كارب يومه • فاذا دعيت الى المكارم فاعجل
  وكريت الناقة أوقرتها وكرب النخل أصول السسعن ⁦(٣)⁩ أ مثال السكتف وفى المثل متى كان
  حكم اللّٰه فى كرب النخل⁦(٤)⁩ والسكرب الحبل الذى يشد فى وسط العراقى تم يينى ويثلث ليكون
  هو الذى إلى المنه فلا يعفن الجبل المكبير تقول منه أكربت الدلوفهى مكربة والكرية
  أيضاواحدة الكراب وهى مجارى الماء قال أبوذؤيب يصف نجلا
  جوارهاتأوى الشعوف دوائبا * وتنصب ألها بامصيفاكرابها
  والمصيف المعوج من صاف السهم وأيوكرب اليمانى بكسرالراء أحد التبابعة وأسمه أسعد
  ابن مانك الجيرى ومعدى كرب فيه ثلاث لغات معدى كرب برفع الباء لا يصرف ومتهم مر
  يقول معدى كرب يضيف ويصرف كريا ومنهم من يقولمهدى كرب يضيف ولا يصرف
  ٢٥
  1١ قبله كذب عليكم الحج
  كذب علميكم العمرة كذب علكم
  ٢ وعنترة يقول لزوجته عبلة
  عليك بأكل العتيق وهو انتمر
  اليابس وشرب الماء الباردولا
  تتعرذى لغبوق اللبن وهو شريه،
  عشالانى خصصت به مهرى
  الذى يسلنى وإياك اه مرتضى
  ثم قال وعلى هذا فسر واحديث
  كذب النسابون أى وجب
  الرجوع الى قواهم ١•
  كرنافة اه
  ٤ بل هذا يضرب فيمن يضع
  نفسه حيث لا يستاه-ل قاله
  أبو عبيدة اه وانولى اسكن فى
  مرتضى يان أصل هذا المثل
  وانه عجزبيت لجرير قاله لما بلغه
  أن الصلان العبدى فضل
