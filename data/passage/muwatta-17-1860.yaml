label: { ar: "الموطأ 1860 — مالك: من راطل ذهبا بذهب فكان بين الذهبين فضل مثقال، فأعطى صاحبه قيمته من الورق، فلا يأخذه، لأنه قبيح وذريعة إلى الربا", en: "Muwatta 1860", es: "Muwatta 1860", fr: "Muwatta 1860", ur: "موطا 1860", tr: "El-Muvatta 1860 — Malik: Bir kimse altınla altın takas eder ve ikisi arasında bir miskal fark varsa ve ortağına bu farkın karşılığını gümüş olarak verirse, ortağı bunu almamalıdır; çünkü bu kınanacak bir davranıştır ve faizciliğe vesile olur.", id: "Al-Muwatta 1860 — Malik: Jika seseorang menukar emas dengan emas dan terdapat selisih satu mithqal di antara keduanya, dan dia memberikan nilai selisih tersebut kepada rekannya dalam bentuk perak, maka rekannya tidak boleh menerimanya, karena hal itu tercela dan merupakan sarana riba." }
summary:
  ar: "قال مالك: من راطل ذهبا بذهب، أو ورقا بورق، فكان بين الذهبين فضل مثقال، فأعطى صاحبه قيمته من الورق أو من غيرها، فلا يأخذه، فإن ذلك قبيح وذريعة إلى الربا، لأنه إذا جاز له أن يأخذ المثقال بقيمته حتى كأنه اشتراه على حدته، جاز له أن يأخذ المثقال بقيمته مرارا، لأن يجيز ذلك البيع بينه وبين صاحبه. قال مالك: ولو أنه باعه ذلك المثقال مفردا ليس معه غيره، لم يأخذه بعشر الثمن الذي أخذه به، لأن يجوز له البيع، فذلك الذريعة إلى إحلال الحرام والأمر المنهي عنه. {cite:muwatta-maruf-1997 p.164} {cite:muwatta-maruf-1997 p.165}"
  tr: "Malik şöyle dedi: Bir kimse altını altınla veya gümüşü gümüşle değiştirirse ve ikisi arasında bir mitikal fark varsa ve ortağına bunun değerini gümüş veya başka bir şeyle verirse, bunu almamalıdır. Bu kınanacak bir davranıştır ve faize yol açar. Zira eğer mitikali ayrı olarak satın almış gibi değerinden alması caiz ise, o zaman mitikali tekrar tekrar değerinden alması da caiz olur, çünkü bu, kendisi ile ortağı arasındaki satışı meşrulaştırır. Malik şöyle dedi: Hatta o mitikali başka bir para birimi olmadan tek başına satmış olsa bile, ödediği fiyatın onda birine geri almamalıdır, çünkü onu satması caiz olur. Bu, haram olanı ve yasak olanı meşrulaştırmaya yol açar. {cite:muwatta-maruf-1997 s.164} {cite:muwatta-maruf-1997 s.165}"
  id: "Malik berkata: Jika seseorang menukar emas dengan emas, atau perak dengan perak, dan terdapat selisih satu mithqal di antara keduanya, dan ia memberikan nilai mithqal tersebut kepada rekannya dalam bentuk perak atau sesuatu yang lain, maka ia tidak boleh menerimanya. Ini adalah perbuatan tercela dan merupakan jalan menuju riba. Karena jika diperbolehkan baginya untuk menerima mithqal tersebut sesuai nilainya, seolah-olah ia membelinya secara terpisah, maka diperbolehkan pula baginya untuk menerima mithqal tersebut sesuai nilainya berulang kali, karena hal ini akan melegitimasi penjualan antara dirinya dan rekannya. Malik berkata: Bahkan jika ia menjual mithqal tersebut saja, tanpa mata uang lain, ia tidak boleh menerimanya kembali dengan harga sepersepuluh dari harga yang dibayarkannya, karena diperbolehkan baginya untuk menjualnya. Ini adalah jalan menuju melegalkan apa yang dilarang dan apa yang diharamkan. {cite:muwatta-maruf-1997 p.164} {cite:muwatta-maruf-1997 p.165}"
