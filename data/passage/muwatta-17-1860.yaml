summary:
  ar: "قال مالك: من راطل ذهبا بذهب، أو ورقا بورق، فكان بين الذهبين فضل مثقال، فأعطى صاحبه قيمته من الورق أو من غيرها، فلا يأخذه، فإن ذلك قبيح وذريعة إلى الربا، لأنه إذا جاز له أن يأخذ المثقال بقيمته حتى كأنه اشتراه على حدته، جاز له أن يأخذ المثقال بقيمته مرارا، لأن يجيز ذلك البيع بينه وبين صاحبه. قال مالك: ولو أنه باعه ذلك المثقال مفردا ليس معه غيره، لم يأخذه بعشر الثمن الذي أخذه به، لأن يجوز له البيع، فذلك الذريعة إلى إحلال الحرام والأمر المنهي عنه. {cite:muwatta-maruf-1997 p.164} {cite:muwatta-maruf-1997 p.165}"
