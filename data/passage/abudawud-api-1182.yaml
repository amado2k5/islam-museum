label: { ar: "سنن أبي داود 1182 — الأب والأبوة", en: "Sunan Abi Dawud 1182 — the father and fatherhood", ur: "سنن ابی داؤد 1182 — باپ اور والدیت", es: "Sunan Abi Dawud 1182 — El padre y la paternidad", fr: "Sunan Abi Dawud 1182 — Le père et la paternité", tr: "Sunan Abi Davud 1182 — Baba ve Babalık", id: "Sunan Abi Dawud 1182 — Sang Ayah dan Peran Ayah" }
text: "… أَحْمَدُ بْنُ الْفُرَاتِ بْنِ خَالِدٍ أَبُو مَسْعُودٍ الرَّازِيُّ، أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي جَعْفَرٍ الرَّازِيُّ، عَنْ أَبِيهِ، عَنْ أَبِي جَعْفَرٍ الرَّازِيِّ، قَالَ أَبُو دَاوُدَ وَحُدِّثْتُ عَنْ عُمَرَ بْنِ شَقِيقٍ، حَدَّثَنَا أَبُو جَعْفَرٍ الرَّازِيُّ، - وَهَذَا لَفْظُهُ وَهُوَ أَتَمُّ - عَنِ الرَّبِيعِ بْنِ أَنَسٍ، عَنْ أَبِي الْعَالِيَةِ، عَنْ أُبَىِّ بْنِ كَعْبٍ، قَالَ انْكَسَفَتِ الشَّمْسُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1182، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1182 (The Book Of The Prayer For Rain (Kitab al-Istisqa')), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1182، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1182 (El Libro de la Oración para la Lluvia (Kitab al-Istisqa')), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1182 (Le Livre de la prière pour la pluie (Kitab al-Istisqa')), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1182 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1182, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
