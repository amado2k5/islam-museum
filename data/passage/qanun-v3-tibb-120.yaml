text: "… إلى سبات، وتواتر شديد من النبض، وتقدم سهر مؤذ. وما كان بسبب إسهال تجد الإسهال قد تقدّم، وأفرط. وما كان من جوع تجد ذلك حادثاً بتدريج لا دُفعة، ومما يؤكد أنّه من المرض فقدان تلك الأسباب، وشدّة حدّة الحمّى وإحساس …"
