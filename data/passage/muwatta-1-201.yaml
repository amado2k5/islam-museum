label: { ar: "الموطأ 201 — ابن عمر يرفع يديه عند الافتتاح وعند الرفع من الركوع دون ذلك", en: "Muwatta 201", es: "Muwatta 201", fr: "Muwatta 201", ur: "موطا 201", tr: "El-Muvatta 201 — İbn Ömer namazın başında ve rükûdan kalkarken ellerini kaldırır, ama o sırada kaldırmaz.", id: "Al-Muwatta 201 — Ibnu Umar mengangkat kedua tangannya di awal salat dan ketika bangkit dari rukuk, tetapi tidak pada saat itu." }
summary:
  ar: "أثر يرويه يحيى عن مالك عن نافع، في باب افتتاح الصلاة: كان عبد الله بن عمر إذا افتتح الصلاة رفع يديه حذو منكبيه، وإذا رفع رأسه من الركوع رفعهما دون ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.126}"
  tr: "Yahya'nın, Malik'ten, o da Nafi'den rivayet ettiği, namazın başlangıcıyla ilgili bir rivayet: Abdullah ibn Umar namaza başlarken ellerini omuz hizasına kadar kaldırır, rükûdan başını kaldırdığında ise biraz daha aşağı indirirdi. Araştırmacı, bu rivayetin Malik'ten, Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.126}"
  id: "Sebuah riwayat dari Yahya, berdasarkan Malik, berdasarkan Nafi', mengenai pembukaan salat: Ketika Abdullah ibn Umar memulai salat, beliau mengangkat kedua tangannya setinggi bahu, dan ketika beliau mengangkat kepala dari rukuk, beliau mengangkat kedua tangannya sedikit lebih rendah. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.126}"
