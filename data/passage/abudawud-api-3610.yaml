label: { ar: "سنن أبي داود 3610 — الأب والأبوة", en: "Sunan Abi Dawud 3610 — the father and fatherhood", ur: "سنن ابی داؤد 3610 — باپ اور والدیت", es: "Sunan Abi Dawud 3610 — El padre y la paternidad", fr: "Sunan Abi Dawud 3610 — le père et la paternité" }
text: "… بَكْرٍ أَبُو مُصْعَبٍ الزُّهْرِيُّ، حَدَّثَنَا الدَّرَاوَرْدِيُّ، عَنْ رَبِيعَةَ بْنِ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ قَضَى بِالْيَمِينِ مَعَ الشَّاهِدِ. قَالَ أَبُو دَاوُدَ وَزَادَنِي الرَّبِيعُ بْنُ سُلَيْمَانَ الْمُؤَذِّنُ فِي هَذَا الْحَدِيثِ قَالَ أَخْبَرَنِي الشَّافِعِيُّ عَنْ عَبْدِ الْعَزِيزِ قَالَ فَذَكَرْتُ ذَلِكَ لِسُهَيْلٍ فَقَالَ أَخْبَرَنِي رَبِيعَةُ - وَهُوَ عِنْدِي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3610، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3610 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3610، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3610 (El Libro del Juez (Kitab Al-Aqdiyah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3610 (Le Bureau du Juge (Kitab Al-Aqdiyah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
