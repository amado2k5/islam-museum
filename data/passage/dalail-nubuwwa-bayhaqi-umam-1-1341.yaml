text: "… اللّٰه وَالف بني النضير، وأقر قريظة، ومَنَّ عليهم حتى حاربت قريظة بعد ذلك، فقتل رجالهم، وقسم نساءهم وأولادهم وأموالهم بين المسلمين، إلا بعضهم لحقوا برسول اللّٰه الظي، فأمنهم وأسلموا وأجلى رسول اللّٰه ولي يهود المدينة بني قينقاع وهم قوم عبد …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1341، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 1341, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 1341 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
