text: "… اللّٰه وَالف بني النضير، وأقر قريظة، ومَنَّ عليهم حتى حاربت قريظة بعد ذلك، فقتل رجالهم، وقسم نساءهم وأولادهم وأموالهم بين المسلمين، إلا بعضهم لحقوا برسول اللّٰه الظي، فأمنهم وأسلموا وأجلى رسول اللّٰه ولي يهود المدينة بني قينقاع وهم قوم عبد …"
