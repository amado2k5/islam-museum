  tr: "Al-Khatib Al-Baghdadi'nin Bağdat Tarihi, Resimli Cilt 1, sayfa 189'dan bir alıntı, bir mezar ve bir türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Baghdad karya Al-Khatib Al-Baghdadi, Jilid 1 Bergambar, halaman 189, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah tempat suci; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
