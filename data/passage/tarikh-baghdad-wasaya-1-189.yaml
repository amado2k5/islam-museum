text: "… اللّٰه من كثرة ما أسأله ذلك، فرجع فتوفى فى السنة الداخلة. وقال ابن سعد قال الواقدى : أخبرتى سفيان أنه ولد سنة سبع ومائة، ومات يوم السبت أول يوم من رجب سنة ثمان وتسعين ومائة، ودفن بالحجون. أخبرنا محمد بن …"
