  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 1، ص 189 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
