summary:
  ar: "القسم 38 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الآداب»، ويضم فيها النصوص من 5586 إلى 5645 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 38 of Sahih Muslim (The Book of Manners and Etiquette) in the division of the open hadith dataset the museum took its reports from: reports 5586 to 5645 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 38، عنوان «کتاب الآداب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5586 تا 5645۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 38 de Sahih Muslim (El Libro de las Buenas Maneras y la Etiqueta) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5586 al 5645, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
