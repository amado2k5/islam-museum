summary:
  ar: "بلاغ في باب الرخصة في الصلاة في الثوب الواحد: يروي مالك أنه بلغه أن جابر بن عبد الله كان يصلي في الثوب الواحد. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.203}"
  tr: "Tek elbise ile namaz kılmanın caizliğine dair bir rivayet: Malik, Cabir ibn Abdullah'ın tek elbise ile namaz kıldığını duyduğunu nakletmiştir. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.203}"
  id: "Sebuah riwayat mengenai kebolehan shalat dengan mengenakan sehelai pakaian: Malik meriwayatkan bahwa ia mendengar bahwa Jabir bin Abdullah biasa shalat dengan mengenakan sehelai pakaian. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.203}"
