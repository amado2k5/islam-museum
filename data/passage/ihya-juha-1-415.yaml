text: "… هند الني فقال كيف عقله ؟.. الحديث أخرجه داود بن المحيرف كتاب المعل وهو ضعيف وتقدم فى العلم حديث أبى الدرداء : كان إذا بلنه عن رجل شدة عبادة، سأل عن عقله.. المديث. أخرجه الترمذى الحكيم قى النوادر وابن عدى …"
