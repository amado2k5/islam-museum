text: |-
  ١ وله جعل الخخن والحده
  ٢١ قلت قال الازهرى
  الضبعة عند الحاضرة التخل
  والكرم والارض والعسرب
  لا تعرف الضيعة الا الحرفة اه
  تحتار
  قوله وكذلك الطباع أى انه
  مقرد قال الحشى وهذا قولمن
  لا تحتيق عنده والمشهورالذى
  علهالجهورات الطباع جمع
  ظبع اه ورأيت الفخر فى تفسيد.
  وأظفه فى سورة الرعد أو
  ماجاورها جرى على انه
  مغردواستغر شه قبل
  الاطلاع على الصماح ثم رأيت
  الم-مودى نقل عن أبى ماتم
  جواز كرنه واحدامذ كرابعنى
  الطبع أومونتا بمعنى الطبيعة
  وجواز كونه جمع طبع منل
  كاب وكلاب فأله نصر
  ٠٦٠٨
  فان ضلعها معها يضرب للرج-ل يخاصم آخر فيقول اجعل بين وبينك فلانالرجل
  يهوى هواه ويقال خاصت فلانافعك ان ضلعك على أى ملك والضلع بالتحريك
  الاعوجاج خلقسة وقال
  وقد يحمل السيف المجرّب ربه * على ضلع فى منذه وه وقاطخ
  تقول منه ضلع بالكسر يضع ضاعا وهو ضلع والضلع أيضافى قول سويدبن ابي كاهل ١
  سعة الاخلاق فينا والضلع * القوة واحتمال الثقيل قاله الاصممى والضلاعة القوة وشدة
  الاضلاع تقول منه ضلع الرجل بالضم فه وضلبع قال ابن السكيت الفرس الضليع التام
  انظلمق الجف والقايظ الالواح المكثير العصب وتضلع الرجل أى امتلا شبعا وريا والاضلاع
  الامالة تقول م:محل مضلع أى منقسل ومنه قول الاعشى وح-ل لمفلع الاثقال
  قال ويقار فلان ضلع بهذا الامرأى قوى عليه وهومفتعل من الضلاعة قال ولا تقل
  معالع بالادغام وقال أبو نصرأحدبن حاتم يقال هو مضطلع بهذا الامر ومطلع له قالا ضطلاع
  من الضلاعة وهى القوّة والاطلاع من العلو من قولهم اطلعت الثنية اى علوتها أى ه وعال
  لذلك الاحر مالت له وتضليع التوب جعل وشيه على هيئة الاضلاع ضوع ضاعه
  بضوعه ضوعا أى حركه وأقله وافزعه ومنه قول الشاعر يضوع فؤادها منه بغام
  وانضاع الفرخ أى تضوّر قال الهذلى ⁦(أبوذؤيب)⁩
  فريخان يتضاعان فى الفجركما • أحسادوى الريع أوصوت ناعب
  والضوع طارمن طير الليل من جنس الهام وقال المفضل هودْ كر اليوم وجمعه أضواع
  وضيعان والضواع صوته وضاع المسك وتضوّع وتضع أى تحرّك واتشرت رابحته قال
  الفيرى
  تضوع مسكابطان نعمان أن مشت • به زيْبَ فى أسوة عطرات
  ويروى خفرات ⁦(ضبع)⁩ ضاع الشى يضبع ضيعة وضباعا بالفتح أى حك ومنه قولهم
  فلان بدار مضيعمثال معيشة قال يعقوب قواهم فى المثسل الصيف ضيعت التبن مكسورة
  التاء اذا خوطب يه المذكر والمؤتت أوالاثنان اوالجع لان المثل فى الاصل خوطبت بهاحرأة
  كانت تحت رجسل موسرة -كرهته اسكبره فطلمها فتزوجه ارجسل مملتق فبعثت الى زوجها
  الاوّل تستميحه فقال لها هذا واليف منصوب على الظرف ورجل مضياع للمال أى
  مضبع والاضاءة والتضيع بعنى والضيعة ٢ العتار والجمع ضياع وضبع أيضاممل بدرة
  وبدر وأضاع الجمل ادافئت ضاعه وكثرت فهو مضع وتصغير الضعة ضيعة ولا نقل
  ضويعة وقولهم قلان ياكل فى معاضائع أى جائع وقيل لابنة الحس ما أحتشئ قالت نابه
  جائع :لمقى فى محاضائع وتضيع المسك اغة فى تصوّع أى فاح.
  صل الطا بع الطبع السحية التى جبل عليها الانسان وهو فى الاصل مصدر
  والطبيعة مشله وكذلك الطباع والطبع الظستم وهو التأثير فى الطين وجهوه والطابع بالفتح
  الخماتم والطابع بالكسراغة فيه وطبعت على الكتاب أى ختمت وطبعت الدرهم والسيف
  أى عملت وطبعت من الطين جرة والطباع الذى يعملها والطبع بالسكسر النهر والجع
  أطباع عن الاصمعى ويقال هو اسم نهر بعينه قال لبيد
  قتولوا
