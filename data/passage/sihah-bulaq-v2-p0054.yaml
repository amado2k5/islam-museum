text: |-
  •⁦(باب الواو واليا.)⁩
  * إقرأ)•
  ٥٣٣
  أقدى طعام فلان أى ما أطيب طعمه ورائحته وقدى الفرس يقدى قديانا أى أسرع ومز
  فلان يقدوبه فرسه وهذاقدى رمح بكسر القاف أى قد ررمح وقال
  وانى اذا ما الموت لم يك دونه • قدى الكبرأحى الانف أن أنأخرا
  ويقال خذ فى هديتك وقديتك أى فيما كنت فيه وأتتنا قادية من الناس أى جماعة قليلة
  وهم أول من يطر أعليك وجعهاقواد تقول منه قدت تقدى قديا قال أيو عبيد المحفوظ
  ندنا بالدال غير معجمة وقال أبو عمروهى بالذال معجمة ⁦(قذى)⁩ القذى فى العيز
  وفى الشراب ما يسقط فيسه وقذيت عينه تقذى قذى فهو رجل قذى العين على فعسل اذا
  سقطت فى عمنه قذاة الاصحعى قذت عينه تقذى قذيارمت بالقذى وأقسذيت عينه جعلت
  فيها القذى وقذيتها تقذية أخرحت منها القذى وقذت الشاة أى ألت بياضامن رحها
  يقال كل ذكريمذى وكل أنى تقذى وقاذيته جازيته قال الشاءر.
  فسوف أقاذى القوم ان عشت سالما • مقاذاة -رلا يقسرّء-لى الذل
  وأما القاذية من الناس فذكرأبوعمر وأنها بالذال معجمسة فتكون من هذا الباب ⁦(قرا)⁩
  القروقدح من خشب والقروميلغ السكاب والقروة الميلغسة والقر وأسفل النخلة ينقرفينبذ
  فيه والقرو والقروة أن يعظم جلد البيضتين لريح فيه أوماء أولنزول الامعاء والرحل
  قروانى وقول المكمت
  فاشتك حضنيه ايغالا ينافذة • كانما فجرت من روعصار
  يعنى المعصرة والقروحوض طويل مثل النهر ترده الابل ويقال تركت الارض قروا واحدا
  اذاطبقها المطرورأيت القوم على قروواحد أى على طريقة واحدة والقرا الظهر والقرية
  معروفة والهع القرى على غيرقياس لانّ ما كان على فعلة بفتح الفاءمن المعتل فجمعه ممسدود
  مثل ركوة وركاه وظبية وظباء وجاء القرى مخالفا لبابه لايقاس عليه ويقال قرية لغة يمانيسة
  ولعلها جمعت على ذلك ممل ذروة وذرى ولمية ولحى والنسبة البها قروة والقريتين فى قوله
  تعالى على رجل من القريتين عظيم مكة والطائف والقرى عسلى فعيل مجرى الماء فى الروض
  وابهع أقرية وقريان والقرية على فعيلة خشبان فيها فرض يجعل فيهار أس عمود البيت عن
  ابن السكيت والمقرى اناه يقرى فيه الضيف والجفنة مقراة والمقراة المسيل وهو الموضع
  الذى يجتمع فيه ماء المطر من كل جانب أبو عبيد القارية هذا الطائرالقصير ارجل الطويل
  المتقار الاخضر الظهر تحبه الاعراب وتتمن به ويشبهون الرجل السخّبه وهى مخففة
  قال الشاعر
  أمن ترجيع قارية تركتم • سباياكم وأيتم بالعناق
  والبمع القوارى قال يعقوب والعامّة تقول قارية بالتشديد الاصمعى يقال الناس قوارى
  اللّٰه فى الارض أى شهداء اللّه أخذ من أنهم يقرون الناس أى يتبعونهم فينظرون الى
  أعمالهم حكاه أبو عبيد فى المصنف قال والقارية من السفان أعلاه وحدّه وكذلكحدّ
  السيف ونوه وقروت البلاد قروا وقريتها واقتريتها واستقريّتها اذا تتبعتها تخرج من
  أرض الى أرض وجاءنى كل قار وباد أى الذى ينزل القرية والبادية وأقريت الجلّ على ظهر
  الفرس أى ألزمته اياه وقريت الضيف قرى مشال قليته قلى وقراه أحسنت اليسه اذا
  ١٢٤
  صداح
