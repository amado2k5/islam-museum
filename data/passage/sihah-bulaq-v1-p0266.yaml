text: |-
  (غرد
  ٣٧٠
  فقلّ ماطارد حتى أغدرا * وسط الغبارخر بامجوّرا
  والغدر أيضا الموضع الظلف الكثير المجارة قال العجاج
  سنابك الخيل يصدّ عن الاير * من الصفا القاسى ويدعسن الغدر
  ورجسل ثبت الغدر أى ثابت فى قتال اوكلام ابن السكيت يقسال ما أثبت غدره أى ما أجته
  فى الغدر والغدر الخرة واللفاقيق من الارض المتعادية قال يقال ذلك للفرس وللرجل اذا
  كان لسانه يثبت فى موضع الزلل والخصومة والمغادرة الترك والغدير القطعة من الماء
  يغادرها السيل وهو فعيل بمعنى مفاعل من غادره أو مفعل من أغدره ويقال هو فعيل بمعنق
  فاعل لانه يغدربأ هله أى ينقطع عندشدة الحاجة اليه قال الكميت
  ومن غدره نبزالاولون اذ • لقبوء الغدير الغديرا
  الغذهرة الغضب وكثرة الصخب والصماح والزجر مثل الزمجرة يقال ععت لفلان غسذمر:
  وكذلك التغذمر وفلان ذوغذامير قال الراعى
  تبصرتهم حتى اذاحال دونهم • ركام وحادذ وغذامبرصيذح
  ولغدمرة ثل الغشمرة ومنه قيل للرئس الذى يسوس عشيرته بماشاءمن عدل أوظلم
  مغذمر قال لبيد ومقسم يعطى العشرة حقها * ومغذمر لطقوقها هضامها
  والغذمرة لغة فى الغذرمة وهوبيع الشئ جزافا والغذامرلغة فى الغذارم وهو السكثير من
  الماءحكاهما أبو عبيد ( رر لغرور مكاسر الجلد قال أبو التجم
  -تى اذا ماطار من خييرها * عن جدد صفروءن غرورها
  الواحد غر بالفتح قال الراجز كأن غرمتنه اذنجنبه • سيرصناع فى خرير تكابه
  ومنه قرلهم طويت الثوب على غرّه أى كسره الاوّل قال الاصمعى وحدّثى رجل عن رؤية
  أنه عرض عليه ثوب فنظر اليه وقلبه ثم قال اطوه على غرّه والغرّة بالضم بياض فى جبهة
  الفرس فوق الدرهم يقال فرس أغرّ والاغرّ الابيض وقوم غرّان قال امر والقيس
  شياب بف عوف طهارى نقية • وأوجههم بيض المسافرغزان
  ورجل أغرأى شريف وفلان غرة قومه أى سيدهم وهسم غررة ومهم وغرّة كل شئ أوّله
  وأكرم-ه والغررثلاث ليال من أوّل الشهر الغرّة العبد أ والامة وفى الحديث قضى
  رسول اللّه صلى اللّٰه عليه وسلم فى الجنين بعرّة كانه عبر عن الحسم كله بالغرة ورجل عرّ باللكسم
  رغر يرأى غير محزب وجارية غرّة وغريرة وغرأيضابينة الغرارة بالفتح وجمع الغرّآغراروبهع
  الغرير أغراء وقد غرية ر بالكسر غرارة والاسم الغرّة يقال كان ذلك فى غرارتى وحدائتى أى فى
  غرّتى وعيش غريراذا كان لا يفزع أهله والغرة الغفلة والغار الغافل تقول منه اعتررت
  يارجل واغتره أى أناه على غرة منه وأعتر بالشى خدع به وة واهم أناغر يرك من فلان قال
  أبو نصر فى كتاب الاجناس أى لن يأتيك منه ما تغترّ به والغر يرالحلق الحسن بقسال
  الرجل اذا شاخ أدبر غريره وأقبل (ريره أى قدسا خلة-ه والغرر انخطر ونهى رسول اللّٰه
  صلى اللّٰه عليه وسلم عن ييع الغرد وهومثل بيع السمك فى الماء والطير فى الهواء ابن السكبت
  ⁦(١)⁩ تقسيم لبالى الشهرثلاثا
  ثلاثا كمافى حاشية القاموس
  الثسلاث الاولى غرد ثم نفسل ثم
  تسمع ثم عشر ثم البيض ثم درع
  ثم ظسلم ثم حتادس ثم دآدى ثم
  محاف يتثليت الميم اه
