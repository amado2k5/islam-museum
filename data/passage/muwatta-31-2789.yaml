label: { ar: "الموطأ 2789 — اللقحة تحلب: الذي يكره اسمه فيأمره النبي بالجلوس ثم يحلب من اسمه يعيش", en: "Muwatta 2789", es: "Muwatta 2789", fr: "Muwatta 2789", ur: "موطا 2789", tr: "Muvatta 2789 — Dişi deve sağılır: Adı sevilmeyen deveyi Peygamber oturtur, sonra sağar. O adı taşıyan kimse yaşar.", id: "Al-Muwatta 2789 — Unta betina diperah: Unta yang namanya dibenci, Nabi menyuruhnya duduk, lalu memerah susunya. Barangsiapa yang memiliki nama itu, ia akan hidup." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن النبي قال للقحة تحلب: من يحلب هذه؟ فقام رجل فسأله عن اسمه فقال: مرة، فقال له: اجلس. ثم قام آخر فقال: حرب، فأمره بالجلوس. ثم قام ثالث فقال: يعيش، فقال له: احلب. ويذكر المحقق أن البخاري في الأدب المفرد أخرجه مرفوعا من طريق إسحاق بن عبد الله بن أبي طلحة عن أنس بإسناد يرى المحقق صحته. {cite:muwatta-maruf-1997 p.567} {cite:muwatta-maruf-1997 p.568}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Peygamber'in sağılan bir dişi deveye, \"Bunu kim sağacak?\" dediğini aktarır. Bir adam ayağa kalktı ve Peygamber ona adını sordu. Adam, \"Murrah\" diye cevap verdi. Peygamber ona oturmasını söyledi. Sonra başka bir adam ayağa kalktı ve \"Harb\" dedi. Peygamber ona oturmasını emretti. Sonra üçüncü bir adam ayağa kalktı ve \"Ya'iş\" dedi. Peygamber ona kendisini sağmasını söyledi. Editör, Buhari'nin \"el-Adab el-Mufrad\" adlı kitabında, bu hadisi, İshak ibn Abdullah ibn Abi Talha aracılığıyla Enes'ten rivayet edilen ve editörün sahih kabul ettiği bir isnad zinciriyle birlikte Peygamber'e dayandırdığını belirtmektedir. {cite:muwatta-maruf-1997 s.567} {cite:muwatta-maruf-1997 s.568}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Nabi berkata kepada seekor unta betina yang sedang diperah susunya: \"Siapa yang akan memerah susunya?\" Seorang laki-laki berdiri, dan Nabi bertanya kepadanya namanya. Ia menjawab, \"Murrah.\" Nabi menyuruhnya duduk. Kemudian seorang laki-laki lain berdiri dan berkata, \"Harb.\" Nabi menyuruhnya duduk. Kemudian seorang laki-laki ketiga berdiri dan berkata, \"Ya'ish.\" Nabi menyuruhnya memerah susunya. Editor mencatat bahwa al-Bukhari, dalam kitabnya al-Adab al-Mufrad, memasukkan hadits ini dengan sanad yang ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) melalui Ishaq ibn Abdullah ibn Abi Talhah, dari Anas, dengan sanad yang menurut editor sahih. {cite:muwatta-maruf-1997 p.567} {cite:muwatta-maruf-1997 p.568}"
