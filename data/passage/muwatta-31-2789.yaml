label: { ar: "الموطأ 2789 — اللقحة تحلب: الذي يكره اسمه فيأمره النبي بالجلوس ثم يحلب من اسمه يعيش", en: "Muwatta 2789" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن النبي قال للقحة تحلب: من يحلب هذه؟ فقام رجل فسأله عن اسمه فقال: مرة، فقال له: اجلس. ثم قام آخر فقال: حرب، فأمره بالجلوس. ثم قام ثالث فقال: يعيش، فقال له: احلب. ويذكر المحقق أن البخاري في الأدب المفرد أخرجه مرفوعا من طريق إسحاق بن عبد الله بن أبي طلحة عن أنس بإسناد يرى المحقق صحته. {cite:muwatta-maruf-1997 p.567} {cite:muwatta-maruf-1997 p.568}"
