label: { ar: "موطأ مالك 489 — عدد الحسنات، كتابة الحسنات", en: "Muwatta Malik 489 — a stated number of good deeds; the writing of good deeds", ur: "موطأ مالک 489 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَىْءٍ قَدِيرٌ فِي يَوْمٍ مِائَةَ مَرَّةٍ كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ وَكُتِبَتْ لَهُ مِائَةُ حَسَنَةٍ وَمُحِيَتْ عَنْهُ مِائَةُ سَيِّئَةٍ وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ يَوْمَهُ ذَلِكَ حَتَّى يُمْسِيَ وَلَمْ يَأْتِ أَحَدٌ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلاَّ أَحَدٌ عَمِلَ أَكْثَرَ مِنْ ذَلِكَ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 489، يذكر عدد الحسنات، وكتابة الحسنات، وعمل يعدل عملا أعظم منه، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 489 (The Qur'an), that speaks of a stated number of good deeds, the writing of good deeds, a deed that equals a greater one, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 489، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، ایک عمل جو بڑے عمل کے برابر ہے، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
