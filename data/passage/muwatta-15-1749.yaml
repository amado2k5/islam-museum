label: { ar: "الموطأ 1749 — زينب بنت أبي سلمة عن أم سلمة: امرأة سألت النبي عن كحل ابنتها المتوفى عنها زوجها، فقال لا، إنما هي أربعة أشهر وعشرا", en: "Muwatta 1749" }
text: "إنَّما هِي أرْبَعةَ أشهُرٍ وَعَشْرًا"
summary:
  ar: "قالت زينب: سمعت أمي أم سلمة، زوج النبي، تقول: جاءت امرأة إلى رسول الله، فقالت إن ابنتي توفي عنها زوجها وقد اشتكت عينيها، أفنكحلهما؟ فقال رسول الله: لا، مرتين أو ثلاثا، كل ذلك يقول لا، ثم قال: إنما هي أربعة أشهر وعشرا، وقد كانت إحداكن في الجاهلية ترمي بالبعرة على رأس الحول. وشرح حميد بن نافع لزينب ذلك: إذا توفي زوجها دخلت حفشا ولبست شر ثيابها، ولم تمس طيبا حتى تمر بها سنة، ثم تؤتى بدابة فتفتض بها فقلما تفتض بشيء إلا مات، ثم تخرج فتعطى بعرة فترمي بها، ثم تراجع ما شاءت من طيب أو غيره. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
