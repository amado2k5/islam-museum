label: { ar: "الموطأ 1749 — زينب بنت أبي سلمة عن أم سلمة: امرأة سألت النبي عن كحل ابنتها المتوفى عنها زوجها، فقال لا، إنما هي أربعة أشهر وعشرا", en: "Muwatta 1749", es: "Muwatta 1749", fr: "Muwatta 1749", ur: "موطا 1749", tr: "El-Muvatta 1749 — Zeyneb bint Ebu Seleme, Ümmü Seleme'den rivayetle: Bir kadın Peygamberimize, kocası vefat etmiş kızına sürme sürmek hakkında sordu. Peygamberimiz buyurdu ki: \"Hayır, sadece dört ay on gündür.\"", id: "Al-Muwatta 1749 — Zaynab bint Abi Salamah berdasarkan riwayat Umm Salamah: Seorang wanita bertanya kepada Nabi tentang penggunaan celak pada putrinya yang suaminya telah meninggal, dan beliau menjawab tidak, itu hanya empat bulan dan sepuluh hari." }
text: "إنَّما هِي أرْبَعةَ أشهُرٍ وَعَشْرًا"
summary:
  ar: "قالت زينب: سمعت أمي أم سلمة، زوج النبي، تقول: جاءت امرأة إلى رسول الله، فقالت إن ابنتي توفي عنها زوجها وقد اشتكت عينيها، أفنكحلهما؟ فقال رسول الله: لا، مرتين أو ثلاثا، كل ذلك يقول لا، ثم قال: إنما هي أربعة أشهر وعشرا، وقد كانت إحداكن في الجاهلية ترمي بالبعرة على رأس الحول. وشرح حميد بن نافع لزينب ذلك: إذا توفي زوجها دخلت حفشا ولبست شر ثيابها، ولم تمس طيبا حتى تمر بها سنة، ثم تؤتى بدابة فتفتض بها فقلما تفتض بشيء إلا مات، ثم تخرج فتعطى بعرة فترمي بها، ثم تراجع ما شاءت من طيب أو غيره. {cite:muwatta-maruf-1997 p.113} {cite:muwatta-maruf-1997 p.114}"
  tr: "Zeynep şöyle dedi: Annem Ümmü Seleme'nin, Peygamberimizin eşinin, şöyle dediğini işittim: Bir kadın Resulullah'a geldi ve dedi ki: \"Kızımın kocası öldü ve kızım göz rahatsızlığı çekiyor. Onlara sürme sürebilir miyim?\" Resulullah iki üç kez \"Hayır\" dedi, her seferinde \"hayır\" dedi. Sonra şöyle dedi: \"Sadece dört ay on gün. İslam öncesi dönemde, yıl sonunda sizden biri bir parça gübre atardı.\" Humayd ibn Nafi' bunu Zeynep'e şöyle açıkladı: Kocası öldüğünde, tenha bir yere gider, en kötü elbiselerini giyer ve bir yıl geçene kadar parfüm kullanmaz. Sonra ona bir hayvan getirilir ve onunla cinsel ilişkiye girer. Cinsel ilişkiye girdiği hiçbir şeyin ölmemesi nadirdir. Sonra dışarı çıkar ve kendisine bir parça gübre verilir, onu atar. Sonra dilediği parfümü veya diğer şeyleri kullanmaya devam edebilir."
  id: "Zaynab berkata: Aku mendengar ibuku, Umm Salamah, istri Nabi, berkata: Seorang wanita datang kepada Rasulullah dan berkata, \"Suami putriku telah meninggal, dan dia menderita penyakit mata. Bolehkah aku mengoleskan celak pada matanya?\" Rasulullah berkata, \"Tidak,\" dua atau tiga kali, setiap kali mengatakan tidak. Kemudian beliau berkata, \"Hanya empat bulan dan sepuluh hari. Di zaman pra-Islam, salah seorang dari kalian akan membuang sepotong kotoran hewan di akhir tahun.\" Humayd ibn Nafi' menjelaskan hal ini kepada Zaynab: Ketika suaminya meninggal, dia memasuki tempat terpencil dan mengenakan pakaian terburuknya, dan dia tidak menggunakan parfum sampai setahun berlalu. Kemudian seekor hewan dibawa kepadanya, dan dia dinodai olehnya. Jarang sekali sesuatu yang dinodainya tidak mati. Kemudian dia keluar dan diberi sepotong kotoran hewan, yang kemudian dibuangnya. Kemudian dia boleh melanjutkan menggunakan parfum atau hal-hal lain yang diinginkannya."
