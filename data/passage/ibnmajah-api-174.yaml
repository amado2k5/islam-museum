text: "… عَمَّارٍ، حَدَّثَنَا يَحْيَى بْنُ حَمْزَةَ، حَدَّثَنَا الأَوْزَاعِيُّ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ ـ قَالَ \" يَنْشَأُ نَشْءٌ يَقْرَءُونَ الْقُرْآنَ لاَ يُجَاوِزُ تَرَاقِيَهُمْ كُلَّمَا خَرَجَ قَرْنٌ قُطِعَ \". قَالَ ابْنُ عُمَرَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" كُلَّمَا خَرَجَ قَرْنٌ قُطِعَ \". أَكْثَرَ مِنْ عِشْرِينَ مَرَّةً \" حَتَّى يَخْرُجَ فِي عِرَاضِهِمُ الدَّجَّالُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 174، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 174 (The Book of the Sunnah), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 174، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 174 (El Libro de la Sunnah), menciona la crianza y el consejo paterno. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 174 (Le Livre de la Sunna), mentionne le rôle du père dans l'éducation et les conseils des enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "İbn Majah'ın Sünen'inde yer alan 174 numaralı hadiste, babanın çocuk yetiştirmedeki rolü ve tavsiyeleri anlatılmaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 174, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini dikumpulkan oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
