label: { ar: "الموطأ 1423 — مالك: سمع بعض أهل العلم في البازي والعقاب والصقر أنها إذا كانت معلمة فلا بأس بأكل ما قتلت إذا ذكر اسم الله على إرسالها", en: "Muwatta 1423", es: "Muwatta 1423", fr: "Muwatta 1423", ur: "موطا 1423", tr: "El-Muvatta 1423 — Malik: Bazı âlimler, bir şahin, kartal veya atmaca eğitilirse, avladığı hayvanı yemenin, serbest bırakılırken Allah'ın adı anılması şartıyla, sakıncası olmadığını duymuşlardır.", id: "Al-Muwatta 1423 — Malik: Sebagian ulama mendengar bahwa jika seekor elang, rajawali, atau burung hantu dilatih, maka tidak ada salahnya memakan apa yang dibunuhnya jika nama Allah disebut ketika melepaskannya." }
summary:
  ar: "يروي مالك أنه سمع بعض أهل العلم يقولون في البازي والعقاب والصقر وما أشبه ذلك، إذا كان معلما يفقه كما تفقه الكلاب المعلمة، فلا بأس بأكل ما قتلت مما صادت، إذا ذكر اسم الله على إرسالها. {cite:muwatta-maruf-1997 p.637}"
  tr: "Malik, şahinler, kartallar ve benzeri kuşlar hakkında bazı âlimlerin şöyle dediğini duyduğunu aktarıyor: Eğer eğitilirlerse ve eğitilmiş köpekler gibi dili anlarlarsa, avlarından öldürdüklerini yemelerinde bir sakınca yoktur; yeter ki onları serbest bırakırken Allah'ın adı anılsın. {cite:muwatta-maruf-1997 s.637}"
  id: "Malik menceritakan bahwa ia mendengar beberapa ulama mengatakan mengenai burung elang, rajawali, dan burung sejenisnya, jika mereka dilatih dan memahami bahasa seperti anjing terlatih, maka tidak ada salahnya memakan apa yang mereka buru dari mangsanya, asalkan nama Tuhan disebut ketika melepaskan mereka. {cite:muwatta-maruf-1997 p.637}"
