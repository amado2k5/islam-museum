text: "انيهم فى البحر لقصا إياس، ونزوله بالعمق لقربه من البحر . فورد عليه كتاب نائب اللاذقية بوصول الفرنج إلى بيروت، وأنهم نزلوا إلى البر، وملكوا برض أبراجها . فأدركهم العسكر الشام فى طائفة من رجالة الأكراد ، وقاتلوهم، فأيد الله"
