text: "… يُلِمّ وذلك كثير شهير في الكتاب والسنة. وهو كاف في طلب ترك المباح؛ لأَنه أمر دنيويّ. لا يتعلق بالآخرة من حيث هو مباح. ومنها : ما فيه من التعرّض لطول الحساب في الآخرة. وقد جاء أن حلالها حساب، وحرامها عذاب. …"
