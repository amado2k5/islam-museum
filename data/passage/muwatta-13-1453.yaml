label: { ar: "الموطأ 1453 — مالك: الإخوة للأب والأم لا يرثون مع الولد الذكر ولا مع ولد الابن الذكر ولا مع الأب، ويرثون مع البنات ويبدأ بأهل الفرائض", en: "Muwatta 1453", es: "Muwatta 1453", fr: "Muwatta 1453", ur: "موطا 1453", tr: "Al-Muwatta 1453 — Malik: Aynı anne ve babadan olan kardeşler, erkek çocuk, erkek torun veya baba ile mirasçı olmazlar; ancak kız çocuklarıyla mirasçı olurlar ve miras, belirli paylara hak kazananlardan başlar.", id: "Al-Muwatta 1453 — Malik: Saudara laki-laki dari ayah dan ibu yang sama tidak mewarisi bersama anak laki-laki, tidak pula bersama cucu laki-laki, dan tidak pula bersama ayah, tetapi mereka mewarisi bersama anak perempuan, dan warisan dimulai dari mereka yang berhak atas bagian tetap." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الإخوة للأب والأم لا يرثون مع الولد الذكر شيئا، ولا مع ولد الابن الذكر، ولا مع الأب شيئا، وهم يرثون مع البنات وبنات الابن، ويبدأ بأهل الفرائض فيعطون فرائضهم، فما بقي فللإخوة يقتسمونه على كتاب الله، للذكر مثل حظ الأنثيين. وإن لم يترك الميت أبا ولا جدا ولا ولدا، فالأخت الواحدة النصف، والأختان فما فوق الثلثان، فإن كان معهن أخ ذكر فلا فريضة لأحد من الأخوات. وفي فريضة واحدة يشترك فيها الإخوة لأب وأم مع بني الأم في ثلثهم، وذكر مالك تفصيلها وعلتها. {cite:muwatta-maruf-1997 p.9}"
  tr: "Malik, aralarındaki yerleşik uygulamanın, öz kardeşlerin (aynı anne ve babadan olan kardeşler) erkek çocuklarından, erkek torunlarından veya babalarından miras almadıkları yönünde olduğunu belirtir. Ancak kız ve torunlarından miras alırlar. Dağıtım, sabit paylara hak kazananlarla başlar ve kalan kısım, Allah'ın Kitabına göre kardeşler arasında paylaştırılır; erkek kardeş, kız kardeşin payının iki katını alır. Eğer ölen kişinin babası, dedesi veya oğlu yoksa, bir kız kardeş yarısını, iki veya daha fazla kız kardeş ise üçte ikisini alır. Eğer yanlarında bir erkek kardeş varsa, kız kardeşlerden hiçbiri sabit pay almaz. Belirli bir durumda, öz kardeşler anne tarafından torunlarıyla üçte bir paylarını paylaşırlar. Malik bunu ayrıntılı olarak anlatır ve gerekçesini açıklar. {cite:muwatta-maruf-1997 s.9}"
  id: "Malik menyatakan bahwa praktik yang berlaku di antara mereka adalah bahwa saudara kandung (saudara laki-laki dari ayah dan ibu yang sama) tidak mewarisi apa pun dengan anak laki-laki, cucu laki-laki, atau ayah. Mereka mewarisi dengan anak perempuan dan cucu perempuan. Pembagian dimulai dengan mereka yang berhak atas bagian tetap, dan sisanya dibagi di antara saudara-saudara sesuai dengan Kitab Allah, dengan laki-laki menerima dua kali bagian dari perempuan. Jika almarhum tidak meninggalkan ayah, kakek, atau anak laki-laki, satu saudara perempuan menerima setengah, dan dua atau lebih saudara perempuan menerima dua pertiga. Jika ada saudara laki-laki bersama mereka, tidak ada saudara perempuan yang menerima bagian tetap. Dalam satu kasus khusus, saudara kandung berbagi sepertiga bagian mereka dengan cucu dari pihak ibu. Malik merinci hal ini dan menjelaskan alasannya. {cite:muwatta-maruf-1997 p.9}"
