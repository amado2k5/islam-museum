label: { ar: "الموطأ 1453 — مالك: الإخوة للأب والأم لا يرثون مع الولد الذكر ولا مع ولد الابن الذكر ولا مع الأب، ويرثون مع البنات ويبدأ بأهل الفرائض", en: "Muwatta 1453" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الإخوة للأب والأم لا يرثون مع الولد الذكر شيئا، ولا مع ولد الابن الذكر، ولا مع الأب شيئا، وهم يرثون مع البنات وبنات الابن، ويبدأ بأهل الفرائض فيعطون فرائضهم، فما بقي فللإخوة يقتسمونه على كتاب الله، للذكر مثل حظ الأنثيين. وإن لم يترك الميت أبا ولا جدا ولا ولدا، فالأخت الواحدة النصف، والأختان فما فوق الثلثان، فإن كان معهن أخ ذكر فلا فريضة لأحد من الأخوات. وفي فريضة واحدة يشترك فيها الإخوة لأب وأم مع بني الأم في ثلثهم، وذكر مالك تفصيلها وعلتها. {cite:muwatta-maruf-1997 p.9}"
