text: "… بن عوف عمن حدثه عن عثمان بن مظعون أنه لما رجع من الهجرة الأولى إلى الحبشة دخل مكة في جوار الوليد بن المغيرة، فلما رأى المشركين يؤذون المسلمين وهو آمن رد على الوليد جواره، فبينما هو في مجلس لقريش وقد …"
