text: "- - شعر هند بعد عودتها من أُحد وكالت عِنْد بنت عُتبة، حين انصرف المشركون عن أُحُد : وجمتُ وفى نَفْسِى بَلابَلُ سَمَّةٌ وقد فاتنى بعضُ الذى كانَ مَطْلِقِ مِن أمحابٍ بدرٍ من قريش وغيرهم بى هاشم منهم ومن أهل …"
