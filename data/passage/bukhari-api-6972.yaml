label: { ar: "صحيح البخاري 6972 — التداوي بالعسل", en: "Sahih al-Bukhari 6972 — honey as a remedy", ur: "صحیح بخاری 6972 — شہد سے علاج", es: "Sahih al-Bukhari 6972 — La miel como remedio", fr: "Sahih al-Bukhari 6972 — Le miel comme remède", tr: "Sahih el-Buhari 6972 — Bal ile tedavi", id: "Sahih al-Bukhari 6972 — Pengobatan dengan madu" }
text: "… فَاحْتَبَسَ عِنْدَهَا أَكْثَرَ مِمَّا كَانَ يَحْتَبِسُ، فَسَأَلْتُ عَنْ ذَلِكَ فَقِيلَ لِي أَهْدَتِ امْرَأَةٌ مِنْ قَوْمِهَا عُكَّةَ عَسَلٍ، فَسَقَتْ رَسُولَ اللَّهِ مِنْهُ شَرْبَةً. فَقُلْتُ أَمَا وَاللَّهِ لَنَحْتَالَنَّ لَهُ. فَذَكَرْتُ ذَلِكَ لِسَوْدَةَ قُلْتُ إِذَا دَخَلَ عَلَيْكِ فَإِنَّهُ سَيَدْنُو مِنْكِ فَقُولِي لَهُ يَا رَسُولَ اللَّهِ أَكَلْتَ مَغَافِيرَ فَإِنَّهُ سَيَقُولُ لاَ. فَقُولِي لَهُ مَا هَذِهِ الرِّيحُ وَكَانَ رَسُولُ اللَّهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6972، يذكر التداوي بالعسل. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6972 (Tricks), that mentions honey as a remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6972، جس میں شہد سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "En el Sahih al-Bukhari, n.º 6972 (Trucos), se menciona la miel como remedio. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 6972 (Ruses), mentionne le miel comme remède. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 6972 numaralı hadis, balın tıbbi amaçlarla kullanımından bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6972, menyebutkan penggunaan madu untuk tujuan pengobatan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
