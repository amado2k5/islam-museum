text: "ما يزال المؤمن يصاب في ولده وحامته، حتى يلقى الله وليست له خطيئة"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه عن أبي الحباب سعيد بن يسار عن أبي هريرة، أن النبي قال إن المؤمن لا يزال يُصاب في ولده وحامته، أي خاصته وأهله، حتى يلقى الله وليست له خطيئة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي، ويحيل على التمهيد (24/180). {cite:muwatta-maruf-1997 p.323}"
