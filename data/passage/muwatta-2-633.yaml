label: { ar: "الموطأ 633 — بلاغ عن أبي هريرة: ما يزال المؤمن يصاب في ولده وحامته حتى يلقى الله وليست له خطيئة", en: "Muwatta 633", es: "Muwatta 633", fr: "Muwatta 633", ur: "موطا 633", tr: "El-Muvatta 633 — Ebu Hurayra'dan rivayet edildiğine göre: Bir mümin, günah işlemeden Allah'a kavuşıncaya kadar çocuklarında ve akrabalarında sıkıntılar çekmeye devam edecektir.", id: "Al-Muwatta 633 — Sebuah riwayat dari Abu Hurairah: Seorang mukmin akan terus menderita musibah yang menimpa anak-anak dan kerabatnya hingga ia bertemu dengan Allah tanpa melakukan dosa apa pun." }
text: "ما يزال المؤمن يصاب في ولده وحامته، حتى يلقى الله وليست له خطيئة"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه عن أبي الحباب سعيد بن يسار عن أبي هريرة، أن النبي قال إن المؤمن لا يزال يُصاب في ولده وحامته، أي خاصته وأهله، حتى يلقى الله وليست له خطيئة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي، ويحيل على التمهيد (24/180). {cite:muwatta-maruf-1997 p.323}"
  tr: "Malik'in rivayet ettiği bir hadiste, Ebu Hurayra'dan nakledilen Ebu el-Habab Sa'id ibn Yasar'dan Peygamber'in şöyle buyurduğunu duyduğu belirtilir: \"Mümin, günahsız olarak Allah'a kavuşıncaya kadar çocukları ve yakın akrabaları, yani ailesi ve sevdikleri aracılığıyla sıkıntı çekmeye devam edecektir.\" Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve el-Ka'nabi tarafından nakledildiğini ve el-Tamhid'e (24/180) atıfta bulunduğunu belirtir. {cite:muwatta-maruf-1997 s.323}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik menyatakan bahwa ia mendengarnya dari Abu al-Habab Sa'id ibn Yasar, dari Abu Hurayrah, bahwa Nabi bersabda: \"Seorang mukmin akan terus menderita musibah melalui anak-anaknya dan kerabat dekatnya, yaitu keluarga dan orang-orang terkasihnya, hingga ia bertemu Allah tanpa dosa.\" Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, dan al-Qa'nabi, dan merujuk pada al-Tamhid (24/180). {cite:muwatta-maruf-1997 p.323}"
