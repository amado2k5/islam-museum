summary:
  ar: "القسم 14 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب البيوع عن رسول الله»، ويضم فيها النصوص من 1205 إلى 1321 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 14 of Jami' al-Tirmidhi (The Book on Business) in the division of the open hadith dataset the museum took its reports from: reports 1205 to 1321 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 14، عنوان «کتاب البیوع عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1205 تا 1321۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 14 de Jami' al-Tirmidhi (El Libro de los Negocios) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1205 al 1321, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
