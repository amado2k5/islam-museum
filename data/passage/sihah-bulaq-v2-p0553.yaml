text: |-
  ١ نسخة زيادة حيد اه
  ٢٤
  اذا كان فى فلاة أخذ التراب فشمه ليعلم أعلى قصدهو أم على جور قال رؤية
  اذا الدليل استاف أخلاق الطرق * ثم كثراستعمالهم لهذه الكلمة حتى سموا البعد مسافة
  والساف كل عرق من الحائط والسافة أرض بين الرمل والجلد والسائفة الرملة الرقيقة
  قال ذوارمة يصف فراخ النعامة
  كأن أعناقها كتران سائفة • طارت لفاتفه أوهيشرسلب
  والاسوافم وضع بالمدينة عن أبى عبيد والسواف مرض المال وهلاكه يقال وقع فى المال
  سواف أى موت قال ابن السكيت سمعت هشاما المكفوف ية ول لابى عمروات الاصمعى
  يقول السواف بالضم ويقول الادواء كاهاتجى بالضم نحو النحاز والدكاع والقلاب والجال
  فقال أبوعمر ولاهوالسواف بالفتح وكذللك قال عمارة بن عقسل بن بلال بن جرير قال
  سيبويه سوف كامة تنفيس فيما لم يكن بعدألاترى أنك تقول سوّقته اذا قلت له مرّة بعد
  مرّة سوف أفعل ولا يفصل بينها وبين الفعل لانها بمنزلة السين فى سيفعل وقولهم فلان
  يقتات السوف أى بعيش بالامانىّ والتسويف المطل وساف يسوف أى هلك وأساف
  الرجل أى هلكْ ماله يقال أساف حتى ما يشتكى السواف هذا اذا تعوّدا لحوادث ومنه
  فيالهما من مرسلين بحاجة * أسافامن المال التلاد وأعدما
  وحكى أبوزيد سوّفت الرجل أمرى اذا ملكنه أهرك وحكمته فيه يصنع ماشاء ⁦(سيف)⁩
  السيف بجعه أسياف وسيوف قال الكسائىّ رجل سيفان أى طويل مشوق ضامر البطن
  وامر أة سيفانة وسافه يسيفه ضريه بالسيف يقال سفته فأناسائف ورجل سائف أى
  ذوسيف وسياف أى صاحب سيف والجمع سيافة والمسبف الذى عليه السيف والمسايفة
  المجالدة وتسايفواتضار بوا بالسف وأسفت الخرزأى خرمته قال الراعى
  مزائدخرقاء اليدين مسيفة * أخبة بهن المخلفان وأحفدا
  والسيف بالكسر ساحل البحر والجمع أسياف والسيف أيضاما كان ملتزقا بأصول
  السعف كالليف وليس به وهذا الحرف نقلته من كاب من غير سماع ويذشد
  نخل جوائى نيل من أرطابها والسيف والليف على هدابها
  صل الشمن شأف الشأفة قرحة تخرج فى أسفل القدم فتكوى فتذهر
  يقال فى المثل استأصل اللّه مافته أى أذهبه اللّٰه كما أذهب ثلا القرحة بالكى تقول مفه
  شتفت رجله شأفا مثال تعب تعبا اذاخرجت به الشأفة وشتفت فلاناشأ فابالتسكين أى
  ابغضته ⁦(شدف )⁩ الشدف بالتحريك الشخص والجع شدوف وهذا الحرف فى كتاب
  العين بالسين غير معجة قال ابن دريده وتصحيف ( رف . لشرف العلوّ والمكان العالى
  قال الشاعر
  آتى الندى فلا يترّب مجلسى * وأقود للشرف الرفيع حارى
  يقول انى خرفت فلا يتتفع برأيي وكبرت فلا أستطيع أن أركب من الارض جارى الامن
  -كان عال وجمل مشرف عاز ورجل شريف والهع شرفاء وأشراف مثل يتيم وأيتام وقد
  شرف
