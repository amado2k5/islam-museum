text: "وغربها فى عهد ابراهيم نمرود هوه الصتحاك وليس الامر فى ذلك عند أهل العلم بالاخبارة الاوائسل والمعرفة بالامور السوالف كالذى ظن لان نسب نمرود فى النبط معروف ونسب الضحّاك فى عجم الفرس مشهور ولكن ذوى العلم بأخبار الماضين وأهل ة …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 2، ص 330، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 2, p. 330, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 2، ص 330 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
