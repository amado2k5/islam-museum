label:
  ar: "رياض الصالحين 16 — الله يبسط يده بالليل ليتوب مسيء النهار"
  en: "Riyad al-Salihin 16 — God spreads His hand at night for the penitent of the day"
  es: "Riyad al-Salihin 16 — Dios extiende su mano por la noche para el penitente del día."
  fr: "Riyad al-Salihin 16 — Dieu étend Sa main la nuit pour le pénitent du jour"
  ur: "ریاض الصالحین 16 - خدا دن کے توبہ کے لیے رات کو اپنا ہاتھ پھیلاتا ہے۔"
  tr: "Riyad es-Salihin 16 — Allah geceleyin elini uzatır ki, gündüz günahkârı tövbe etsin."
  id: "Riyad as-Salihin 16 — Allah mengulurkan tangan-Nya di malam hari agar orang berdosa di siang hari dapat bertaubat"
text: "عَنِ النَّبِيِّ قَالَ: «إِنَّ اللَّهَ ﷻ يَبْسُطُ يَدَهُ بِاللَّيْلِ لِيَتُوبَ مُسِيءُ النَّهَارِ، وَيَبْسُطُ يَدَهُ بِالنَّهَارِ لِيَتُوبَ مُسِيءُ اللَّيْلِ, حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا»."
summary:
  ar: "حديث في رياض الصالحين للنووي، في باب «باب التوبة»، من نسخة hadithunlocked المستخرجة؛ النص مقتبس بحدود أربعين كلمة."
  en: "A hadith in al-Nawawi's Riyad al-Salihin, in the chapter «باب التوبة», excerpted within forty words."
  es: "Un hadiz en Riyad al-Salihin de al-Nawawi, en el capítulo «Бاب توبة», extraído en cuarenta palabras."
  fr: "Un hadith du Riyad al-Salihin d'al-Nawawi, dans le chapitre «Бاب توبة», extrait en quarante mots."
  ur: "النووی کی ریاض الصالحین میں ایک حدیث، باب «باب توبة» میں، چالیس الفاظ میں نقل کی گئی ہے۔"
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinde, \"Tövbe\" bölümünde yer alan hadisin hadisin orijinal metninden alıntı yapılmıştır; metin yaklaşık kırk kelimeden oluşmaktadır."
  id: "Sebuah hadits dalam kitab Riyad as-Salihin karya an-Nawawi, dalam bab “Tobat”, dari versi hadits yang telah diekstrak; teksnya dikutip sekitar empat puluh kata."
