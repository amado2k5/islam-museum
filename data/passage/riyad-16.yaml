text: "عَنِ النَّبِيِّ قَالَ: «إِنَّ اللَّهَ ﷻ يَبْسُطُ يَدَهُ بِاللَّيْلِ لِيَتُوبَ مُسِيءُ النَّهَارِ، وَيَبْسُطُ يَدَهُ بِالنَّهَارِ لِيَتُوبَ مُسِيءُ اللَّيْلِ, حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا»."
