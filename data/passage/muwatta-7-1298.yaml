label: { ar: "الموطأ 1298 — مالك: من أوجب على نفسه الغزو فمنعه أبواه لا يكابرهما، ويؤخر الجهاز إلى عام آخر، ويبيعه إن خشي فساده", en: "Muwatta 1298", es: "Muwatta 1298", fr: "Muwatta 1298", ur: "موطا 1298", tr: "El-Muvatta 1298 — Malik: Kim cihat etmeye kendini mecbur ederse, fakat anne babası ona engel olursa, onlara karşı gelmemeli, hazırlıklarını bir sonraki yıla ertelemeli ve bozulacağından korkarsa satmalıdır.", id: "Al-Muwatta 1298 — Malik: Barang siapa yang mewajibkan dirinya untuk ikut berjihad, tetapi orang tuanya melarangnya, maka ia tidak boleh menentang mereka, dan ia harus menunda persiapannya hingga tahun berikutnya, dan menjualnya jika ia khawatir akan rusak." }
summary:
  ar: "سئل مالك عن رجل أوجب على نفسه الغزو فتجهز، حتى إذا أراد أن يخرج منعه أبواه أو أحدهما، فقال لا أرى أن يكابرهما، ولكن يؤخر ذلك إلى عام آخر. أما الجهاز فيرى أن يرفعه حتى يخرج به، فإن خشي أن يفسد باعه وأمسك ثمنه حتى يشتري به ما يصلحه للغزو، فإن كان موسرا يجد مثل جهازه إذا خرج فليصنع بجهازه ما شاء. {cite:muwatta-maruf-1997 p.579}"
  tr: "Malik'e, askeri bir sefere katılmayı taahhüt etmiş ve bunun için hazırlık yapmış, ancak ayrılmak istediğinde anne babası veya onlardan biri onu engellemiş bir adam hakkında soru soruldu. Malik şöyle dedi: \"Bence onlara karşı gelmemeli, aksine bunu bir yıl daha ertelemeli. Teçhizata gelince, onu yola çıkana kadar saklamalı. Bozulacağından korkuyorsa, satıp elde ettiği parayı sefer için ihtiyaç duyduğu şeyleri alana kadar saklamalı. Ayrılırken benzer teçhizatı alabilecek kadar zenginse, teçhizatıyla dilediği gibi davranabilir.\" {cite:muwatta-maruf-1997 s.579}"
  id: "Malik ditanya tentang seorang pria yang telah mengikat dirinya untuk berpartisipasi dalam kampanye militer dan telah mempersiapkannya, tetapi ketika ia ingin berangkat, orang tuanya, atau salah satu dari mereka, mencegahnya. Malik berkata, \"Saya rasa dia tidak seharusnya menentang mereka, tetapi lebih baik menundanya sampai tahun berikutnya. Adapun perlengkapannya, dia harus menyimpannya sampai dia berangkat dengannya. Jika dia khawatir akan rusak, dia harus menjualnya dan menyimpan hasilnya sampai dia membeli apa yang dia butuhkan untuk kampanye tersebut. Jika dia cukup kaya untuk membeli perlengkapan serupa ketika dia berangkat, maka dia dapat melakukan apa pun yang dia inginkan dengan perlengkapannya.\" {cite:muwatta-maruf-1997 p.579}"
