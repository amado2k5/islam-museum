label: { ar: "الموطأ 1298 — مالك: من أوجب على نفسه الغزو فمنعه أبواه لا يكابرهما، ويؤخر الجهاز إلى عام آخر، ويبيعه إن خشي فساده", en: "Muwatta 1298" }
summary:
  ar: "سئل مالك عن رجل أوجب على نفسه الغزو فتجهز، حتى إذا أراد أن يخرج منعه أبواه أو أحدهما، فقال لا أرى أن يكابرهما، ولكن يؤخر ذلك إلى عام آخر. أما الجهاز فيرى أن يرفعه حتى يخرج به، فإن خشي أن يفسد باعه وأمسك ثمنه حتى يشتري به ما يصلحه للغزو، فإن كان موسرا يجد مثل جهازه إذا خرج فليصنع بجهازه ما شاء. {cite:muwatta-maruf-1997 p.579}"
