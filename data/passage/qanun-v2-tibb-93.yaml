text: "… ويكون الدخول في الاستغراق فيه متدرّجاً، ويبتدئ بنوم ثقيل إلا أن يكون سببه برداً يصيب دفعة، أو دواء علاج السبات والنوم الثقيل الكائن في الحمّيات : أما السبات الذي هو عرض مرض في بعض الأعضاء ال لا، فطريق علاجه فصد …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 93، يذكر المرض والمريض، والحمى والوعك، والعلاج، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 93, that mentions illness and the sick, fever, treatment, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 93 کا اقتباس جس میں بیماری اور بیمار، بخار، علاج، جراحت، ختنہ اور پٹیاں، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 93, que menciona la enfermedad y los enfermos, la fiebre, el tratamiento, la cirugía, la circuncisión y las férulas, el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 93, qui mentionne la maladie et les malades, la fièvre, le traitement, la chirurgie, la circoncision et les attelles, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 93. sayfasından bir bölüm; hastalık ve hasta, ateş ve halsizlik, tedavi, cerrahi, sünnet, atel ve ilaçtan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 93, yang menyebutkan penyakit dan pasien, demam dan rasa tidak enak badan, pengobatan, pembedahan, sunat, bidai, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
