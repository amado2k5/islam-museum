label: { ar: "صحيح مسلم 3069 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 3069 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 3069 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 3069 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 3069 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا خَلَفُ بْنُ هِشَامٍ، وَالْمُقَدَّمِيُّ، وَأَبُو كَامِلٍ وَقُتَيْبَةُ بْنُ سَعِيدٍ كُلُّهُمْ عَنْ حَمَّادٍ، - قَالَ خَلَفٌ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، - عَنْ عَاصِمٍ الأَحْوَلِ، عَنْ عَبْدِ اللَّهِ بْنِ سَرْجِسَ، قَالَ رَأَيْتُ الأَصْلَعَ - يَعْنِي عُمَرَ بْنَ الْخَطَّابِ - يُقَبِّلُ الْحَجَرَ وَيَقُولُ وَاللَّهِ إِنِّي لأُقَبِّلُكَ وَإِنِّي أَعْلَمُ أَنَّكَ حَجَرٌ وَأَنَّكَ لاَ تَضُرُّ وَلاَ تَنْفَعُ وَلَوْلاَ أَنِّي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3069، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3069 (The Book of Pilgrimage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 3069، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 3069 (El Libro de la Peregrinación), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih Muslim, n° 3069 (Le Livre du Pèlerinage), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
