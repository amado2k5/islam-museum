text: "أَخْبَرَنَا يَحْيَى بْنُ حَكِيمٍ، قَالَ حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ إِبْرَاهِيمَ بْنِ مُحَمَّدِ بْنِ الْمُنْتَشِرِ، عَنْ أَبِيهِ، أَنَّهُ كَانَ فِي مَسْجِدِ عَمْرِو بْنِ شُرَحْبِيلَ فَأُقِيمَتِ الصَّلاَةُ فَجَعَلُوا يَنْتَظِرُونَهُ فَجَاءَ فَقَالَ إِنِّي كُنْتُ أُوتِرُ. قَالَ وَسُئِلَ عَبْدُ اللَّهِ هَلْ بَعْدَ الأَذَانِ وَتْرٌ قَالَ نَعَمْ وَبَعْدَ الإِقَامَةِ. وَحَدَّثَ عَنِ النَّبِيِّ أَنَّهُ نَامَ عَنِ الصَّلاَةِ حَتَّى …"
summary:
  ar: "حديث في سنن النسائي، رقم 1685، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1685 (The Book of Qiyam Al-Lail (The Night Prayer) and Voluntary Prayers During the Day), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1685، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
