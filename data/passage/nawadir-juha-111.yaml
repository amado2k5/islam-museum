label: { ar: "نوادر جحا الكبرى، ص 53 — «الخبز بالثلج»", en: "Nawadir Juha al-Kubra, p. 53 — 'Bread with Snow'", ur: "نوادر جحا الکبریٰ، ص 53 — «برف کے ساتھ روٹی»", fr: "Nawadir Juha al-Kubra, p. 53 — « Du pain avec de la neige »", es: "Nawadir Juha al-Kubra, p. 53 — «Pan con nieve»" }
text: "… الخبز بالثلج قال يوماً: قد اخترعت أكل الخبز بالثلج، ولكنه لم يَرُقْ لي أنا أيضاً. ازرعوني فأُخرج ثمراً رأى يوماً مزارعين يزرعون كَزْماً فسألهم؟ ماذا تصنعون؟ نقالوا : نزرع كرمةً تحملُ عنباً، عناقيدَ عناقيدَ. فتأمَّلَ الشيخُ قليلاً، وقال : ازرعوني …"
summary:
  ar: "زعم جحا أنه أول من ابتكر أكل الخبز بالثلج، لكنه قال إنه هو نفسه لم يستسغه. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  en: "Juha claims to have invented eating bread with snow, but says he did not like it either. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  ur: "جحا نے دعویٰ کیا کہ برف کے ساتھ روٹی کھانے کا طریقہ اسی نے ایجاد کیا، مگر کہا کہ اسے خود بھی یہ پسند نہیں آیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  fr: "Juha prétend avoir inventé l'habitude de manger du pain avec de la neige, mais dit que lui non plus ne l'a pas aimée. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  es: "Juha afirma haber inventado la costumbre de comer pan con nieve, pero dice que a él tampoco le gustó. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
