text: "… ودخل إليها من ناحية القابون قادما من حلب، وتلقاه الجيش بكماله، وعليه خلعة النيابة، واحتفل الناس له وأشعلوا الشموع، وخرج أهل الذمة من اليهود والنصارى يدعون له ومعهم الشموع، وكان يوماً مشهوداً، وصليّ يوم الجمعة بالمقصورة، من الجامع الأموي، ومعه …"
summary:
