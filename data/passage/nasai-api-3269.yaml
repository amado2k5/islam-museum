label: { ar: "سنن النسائي 3269 — الأب والأبوة", en: "Sunan al-Nasa'i 3269 — the father and fatherhood", ur: "سنن نسائی 3269 — باپ اور والدیت", es: "Sunan al-Nasa'i 3269 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3269 — Le père et la paternité", tr: "Sunan an-Nasa'i 3269 — Baba ve Babalık", id: "Sunan an-Nasa'i 3269 — Sang Ayah dan Peran Ayah" }
text: "… عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ عَائِشَةَ، أَنَّ فَتَاةً، دَخَلَتْ عَلَيْهَا فَقَالَتْ إِنَّ أَبِي زَوَّجَنِي ابْنَ أَخِيهِ لِيَرْفَعَ بِي خَسِيسَتَهُ وَأَنَا كَارِهَةٌ. قَالَتِ اجْلِسِي حَتَّى يَأْتِيَ النَّبِيُّ فَجَاءَ رَسُولُ اللَّهِ فَأَخْبَرَتْهُ فَأَرْسَلَ إِلَى أَبِيهَا فَدَعَاهُ فَجَعَلَ الأَمْرَ إِلَيْهَا فَقَالَتْ يَا رَسُولَ اللَّهِ قَدْ أَجَزْتُ مَا صَنَعَ أَبِي وَلَكِنْ أَرَدْتُ أَنْ أَعْلَمَ أَلِلنِّسَاءِ مِنَ الأَمْرِ شَىْءٌ"
summary:
  ar: "حديث في سنن النسائي، رقم 3269، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3269 (The Book of Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3269، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3269 (El Libro del Matrimonio), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3269 (Le Livre du Mariage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 3269 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3269, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
