label: { ar: "صحيح مسلم 5743 — الحجامة، الشكوى من العلة", en: "Sahih Muslim 5743 — cupping; a complaint of an ailment", ur: "صحیح مسلم 5743 — حجامہ، بیماری کی شکایت" }
text: "… سُلَيْمَانَ، عَنْ عَاصِمِ بْنِ عُمَرَ بْنِ قَتَادَةَ، قَالَ جَاءَنَا جَابِرُ بْنُ عَبْدِ اللَّهِ فِي أَهْلِنَا وَرَجُلٌ يَشْتَكِي خُرَاجًا بِهِ أَوْ جِرَاحًا فَقَالَ مَا تَشْتَكِي قَالَ خُرَاجٌ بِي قَدْ شَقَّ عَلَىَّ. فَقَالَ يَا غُلاَمُ ائْتِنِي بِحَجَّامٍ. فَقَالَ لَهُ مَا تَصْنَعُ بِالْحَجَّامِ يَا أَبَا عَبْدِ اللَّهِ قَالَ أُرِيدُ أَنْ أُعَلِّقَ فِيهِ مِحْجَمًا. قَالَ وَاللَّهِ إِنَّ الذُّبَابَ لَيُصِيبُنِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5743، يذكر الحجامة، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5743 (The Book of Greetings), that mentions cupping, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5743، جس میں حجامہ، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
