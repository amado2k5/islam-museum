label: { ar: "صحيح مسلم 5743 — الحجامة، الشكوى من العلة", en: "Sahih Muslim 5743 — cupping; a complaint of an ailment", ur: "صحیح مسلم 5743 — حجامہ، بیماری کی شکایت", es: "Sahih Muslim 5743 — ventosas; queja de una dolencia", fr: "Sahih Muslim 5743 — ventouses; une plainte relative à un mal", tr: "Sahih Muslim 5743 — Hacamat, Hastalıktan Şikayet Etme", id: "Sahih Muslim 5743 — Bekam, Mengeluh Sakit" }
text: "… سُلَيْمَانَ، عَنْ عَاصِمِ بْنِ عُمَرَ بْنِ قَتَادَةَ، قَالَ جَاءَنَا جَابِرُ بْنُ عَبْدِ اللَّهِ فِي أَهْلِنَا وَرَجُلٌ يَشْتَكِي خُرَاجًا بِهِ أَوْ جِرَاحًا فَقَالَ مَا تَشْتَكِي قَالَ خُرَاجٌ بِي قَدْ شَقَّ عَلَىَّ. فَقَالَ يَا غُلاَمُ ائْتِنِي بِحَجَّامٍ. فَقَالَ لَهُ مَا تَصْنَعُ بِالْحَجَّامِ يَا أَبَا عَبْدِ اللَّهِ قَالَ أُرِيدُ أَنْ أُعَلِّقَ فِيهِ مِحْجَمًا. قَالَ وَاللَّهِ إِنَّ الذُّبَابَ لَيُصِيبُنِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5743، يذكر الحجامة، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5743 (The Book of Greetings), that mentions cupping, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5743، جس میں حجامہ، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5743 (El Libro de los Saludos), menciona la ventosaterapia como tratamiento para una dolencia. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5743 (Le Livre des Salutations), mentionne la ventousothérapie comme traitement d'une affection. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5743 numaralı hadis, hacamat ve hastalık şikayetlerinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5743, menyebutkan tentang bekam dan pengobatan penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
