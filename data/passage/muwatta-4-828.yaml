label: { ar: "الموطأ 828 — أبو هريرة: إياكم والوصال، فقالوا: إنك تواصل؟ فقال: إني لست كهيئتكم، إني أبيت يطعمني ربي ويسقيني", en: "Muwatta 828", es: "Muwatta 828", fr: "Muwatta 828", ur: "موطا 828", tr: "El-Muvatta 828 — Ebu Hurayra: Sürekli oruç tutmaktan sakının. Dediler ki: Ama sen sürekli oruç tutuyorsun? O dedi ki: Ben sizin gibi değilim. Ben geceyi Rabbimin yanında geçiriyorum, o bana rızık veriyor ve su içiriyor.", id: "Al-Muwatta 828 — Abu Hurairah: Waspadalah terhadap puasa terus-menerus. Mereka berkata: Tetapi engkau berpuasa terus-menerus? Dia menjawab: Aku tidak seperti kalian. Aku menghabiskan malam bersama Tuhanku, Dia memberiku makan dan minum." }
text: "إياكم والوصال، إياكم والوصال. إني لست كهيئتكم، إني أبيت يطعمني ربي ويسقيني"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله قال: إياكم والوصال، إياكم والوصال. قالوا: فإنك تواصل يا رسول الله؟ فقال: إني لست كهيئتكم، إني أبيت يطعمني ربي ويسقيني. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند أبي داود وعبد الرحمن بن القاسم وغيرهم. {cite:muwatta-maruf-1997 p.404} {cite:muwatta-maruf-1997 p.405}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Sürekli oruç tutmaktan sakının, sürekli oruç tutmaktan sakının.\" Sahabeler: \"Ama siz sürekli oruç tutuyorsunuz, ey Allah Resulü?\" dediler. O da: \"Ben sizin gibi değilim. Geceyi Rabbimle geçiriyorum, O bana yemek yediriyor ve su veriyor.\" dedi. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, el-Ka'nebi, Ebu Davud, Abdurrahman ibn el-Kâsım ve diğerleri tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.404} {cite:muwatta-maruf-1997 s.405}"
  id: "Malik meriwayatkannya dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Hati-hati dengan puasa terus-menerus, hati-hati dengan puasa terus-menerus.\" Mereka bertanya: \"Tetapi engkau berpuasa terus-menerus, wahai Rasulullah?\" Beliau menjawab: \"Aku tidak seperti kalian. Aku menghabiskan malam bersama Tuhanku, Dia memberiku makan dan minum.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, al-Qa'nabi, Abu Dawud, Abd al-Rahman ibn al-Qasim, dan lainnya. {cite:muwatta-maruf-1997 p.404} {cite:muwatta-maruf-1997 p.405}"
