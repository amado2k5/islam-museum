text: "إياكم والوصال، إياكم والوصال. إني لست كهيئتكم، إني أبيت يطعمني ربي ويسقيني"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله قال: إياكم والوصال، إياكم والوصال. قالوا: فإنك تواصل يا رسول الله؟ فقال: إني لست كهيئتكم، إني أبيت يطعمني ربي ويسقيني. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند أبي داود وعبد الرحمن بن القاسم وغيرهم. {cite:muwatta-maruf-1997 p.404} {cite:muwatta-maruf-1997 p.405}"
