label: { ar: "مسلم 2705 — اللهم اغسل خطاياي بماء الثلج والبرد", en: "Muslim 2705 — Wash my sins with water, snow and hail", es: "Musulmán 2705 — Lava mis pecados con agua, nieve y granizo.", fr: "Muslim 2705 — Lave mes péchés avec de l'eau, de la neige et de la grêle", ur: "مسلم 2705 - میرے گناہوں کو پانی، برف اور اولوں سے دھو دو", tr: "Müslim 2705 — Ey Allah'ım, günahlarımı su, kar ve dolu ile yıka.", id: "Muslim 2705 — Ya Allah, hapuskanlah dosa-dosaku dengan air, salju, dan hujan es." }
text: "قالت عائشة: كان رسول الله يدعو بهؤلاء الدعوات: اللهم إني أعوذ بك من فتنة النار وعذاب النار وفتنة القبر وعذاب القبر ومن شر فتنة الغنى ومن شر فتنة الفقر وأعوذ بك من شر فتنة المسيح الدجال، اللهم اغسل خطاياي بماء الثلج والبرد، وباعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب"
summary:
  ar: "رواية عائشة في باب الدعاء في الصلاة من كتاب الذكر والدعاء في صحيح مسلم؛ الاستعاذة الجامعة من فتن النار والقبر والغنى والفقر والدجال، وسؤال غسل الخطايا بماء الثلج والبرد."
  tr: "Sahih Müslim'deki Dua ve Anma Kitabı'nın dua bölümünde Ayşe'nin rivayeti; cehennem azabından, kabirden, zenginlikten, fakirlikten ve Deccal'den korunmak için yapılan kapsamlı dua ve günahların kar ve buzlu suyla yıkanması isteği."
  id: "Riwayat Aisyah dalam bab tentang permohonan dalam salat dari Kitab Zikir dan Doa dalam Sahih Muslim; permohonan yang komprehensif untuk perlindungan dari cobaan api neraka, kubur, harta benda, kemiskinan, dan Antikristus, serta permohonan untuk menghapus dosa dengan salju dan air es."
