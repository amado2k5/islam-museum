label: { ar: "مسلم 2705 — اللهم اغسل خطاياي بماء الثلج والبرد", en: "Muslim 2705 — Wash my sins with water, snow and hail" }
text: "قالت عائشة: كان رسول الله يدعو بهؤلاء الدعوات: اللهم إني أعوذ بك من فتنة النار وعذاب النار وفتنة القبر وعذاب القبر ومن شر فتنة الغنى ومن شر فتنة الفقر وأعوذ بك من شر فتنة المسيح الدجال، اللهم اغسل خطاياي بماء الثلج والبرد، وباعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب"
summary:
  ar: "رواية عائشة في باب الدعاء في الصلاة من كتاب الذكر والدعاء في صحيح مسلم؛ الاستعاذة الجامعة من فتن النار والقبر والغنى والفقر والدجال، وسؤال غسل الخطايا بماء الثلج والبرد."
