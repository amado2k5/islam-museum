text: "… أفضل الصلاة والسلام وأما الخائفون فان لهم الرفيق الأطلى لا يشار كون فيه فانظر كيف أفردهم بمرافقة الرقيق الأصلى وذلك لأنهم العلماء والعلماء لهم رتبة مرافقة الأنبياء لأنهم ورثة الأنبياء ومرافقة الرفيق الأعلى للأنياء ومن يلحق بهم ولذلك لما خير …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 3، ص 157، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 3, p. 157, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 3، ص 157 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
