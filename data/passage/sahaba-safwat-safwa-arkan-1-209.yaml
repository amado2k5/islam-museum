text: "… ولا تغترَّ. وعن مجاهد عن ابن عمر قال قال رسول اللّٰه لليهِ أحبَّ في الله، وأبغض في الله، وعادٍ في اللّٰه، فإنك لن تنال ولاية اللّٰه إلا بذلك، ولا يجد رجل طعم الايمان وإن كثرت صلاته وصيامه حتى يكون كذلك، …"
