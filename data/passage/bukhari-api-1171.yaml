text: "… عِنْدَ الْبَابِ قَائِمًا فَقُلْتُ يَا بِلاَلُ، صَلَّى رَسُولُ اللَّهِ فِي الْكَعْبَةِ قَالَ نَعَمْ. قُلْتُ فَأَيْنَ قَالَ بَيْنَ هَاتَيْنِ الأُسْطُوَانَتَيْنِ. ثُمَّ خَرَجَ فَصَلَّى رَكْعَتَيْنِ فِي وَجْهِ الْكَعْبَةِ. قَالَ أَبُو عَبْدِ اللَّهِ قَالَ أَبُو هُرَيْرَةَ ـ أَوْصَانِي النَّبِيُّ بِرَكْعَتَىِ الضُّحَى. وَقَالَ عِتْبَانُ غَدَا عَلَىَّ رَسُولُ اللَّهِ وَأَبُو بَكْرٍ ـ بَعْدَ مَا امْتَدَّ النَّهَارُ وَصَفَفْنَا وَرَاءَهُ فَرَكَعَ رَكْعَتَيْنِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 1171، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1171 (Prayer at Night (Tahajjud)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 1171، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
