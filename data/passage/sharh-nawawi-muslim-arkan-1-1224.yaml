text: "الدَّارِمِيّ، حَدَّثَنَا أَبُو الْوَلِيدِ الطَّيَالِسِي، حَدْثَنَا لَيْثَ يَعْنِي النى شعب الإيمان كما سبق في الحليث. عَنْ سَلْمَانَ، قال: سَمِعْتُ رسول اللَّه يَقُولُ: رِبّاطٌ والمبطون والغرق وصاحب الهدم وصاحب ذات الجنب والحرق والمرأة يَوْمٍ وَلَيْلَةٍ خَيْرٌ مِنْ صيَّامٍ شَهْرٍ وَقِيَامِهِ، وَإِنْ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 1224، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 1224, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 1224 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
