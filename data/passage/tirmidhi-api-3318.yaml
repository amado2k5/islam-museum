text: "… قَالَتْ نَعَمْ وَتَهْجُرُهُ إِحْدَانَا الْيَوْمَ إِلَى اللَّيْلِ. فَقُلْتُ قَدْ خَابَتْ مَنْ فَعَلَتْ ذَلِكَ مِنْكُنَّ وَخَسِرَتْ أَتَأْمَنُ إِحْدَاكُنَّ أَنْ يَغْضَبَ اللَّهُ عَلَيْهَا لِغَضَبِ رَسُولِهِ فَإِذَا هِيَ قَدْ هَلَكَتْ فَتَبَسَّمَ النَّبِيُّ. قَالَ فَقُلْتُ لِحَفْصَةَ لاَ تُرَاجِعِي رَسُولَ اللَّهِ وَلاَ تَسْأَلِيهِ شَيْئًا وَسَلِينِي مَا بَدَا لَكِ وَلاَ يَغُرَّنَّكِ أَنْ كَانَتْ صَاحِبَتُكِ أَوْسَمَ مِنْكِ وَأَحَبَّ إِلَى رَسُولِ اللَّهِ. قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3318، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 3318, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 3318، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 3318, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 3318, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
