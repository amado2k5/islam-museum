label: { ar: "سنن أبي داود 3640 — الأب والأبوة", en: "Sunan Abi Dawud 3640 — the father and fatherhood", ur: "سنن ابی داؤد 3640 — باپ اور والدیت", es: "Sunan Abi Dawud 3640 — El padre y la paternidad" }
text: "… خَالِدٍ، أَنَّ مُحَمَّدَ بْنَ عُثْمَانَ، حَدَّثَهُمْ حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ، عَنْ أَبِي طُوَالَةَ، وَعَمْرِو بْنِ يَحْيَى، عَنْ أَبِيهِ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ اخْتَصَمَ إِلَى رَسُولِ اللَّهِ رَجُلاَنِ فِي حَرِيمِ نَخْلَةٍ - فِي حَدِيثِ أَحَدِهِمَا فَأَمَرَ بِهَا فَذُرِعَتْ فَوُجِدَتْ سَبْعَةَ أَذْرُعٍ وَفِي حَدِيثِ الآخَرِ - فَوُجِدَتْ خَمْسَةَ أَذْرُعٍ فَقَضَى بِذَاكَ. قَالَ عَبْدُ الْعَزِيزِ فَأَمَرَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3640، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3640 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3640، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3640 (El Libro del Juez (Kitab Al-Aqdiyah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
