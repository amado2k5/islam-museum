label: { ar: "نوادر جحا الكبرى، ص 85 — «ألا تعرفين السباحة قليلاً؟»", en: "Nawadir Juha al-Kubra, p. 85 — 'Don't You Know a Little Swimming?'", ur: "نوادر جحا الکبریٰ، ص 85 — «کیا تمہیں تھوڑی سی تیراکی نہیں آتی؟»", fr: "Nawadir Juha al-Kubra, p. 85 — « Ne sais-tu pas nager un peu ? »", es: "Nawadir Juha al-Kubra, p. 85 — «¿No sabes nadar un poco?»", tr: "Juha'nın Muhteşem Fıkraları, s. 85 — “Biraz yüzmeyi bilmiyor musun?”", id: "Anekdot Hebat Juha, hlm. 85 — “Apakah kamu tidak tahu cara berenang sedikit?”" }
text: "… ألا تعرفين السباحة قليلاً؟ كان للشيخ امرأتانِ، ففي ذاتٍ يوم جاءتا إليهِ، وقالت إحداهما: أتحبُّني أنا أكثر أم تلك؟ وقالت الثانية مثل ذلك وتعلَّقتا به، فحار الشيخ، وأجاب أجوبةً مبهمةً كقولِهِ أحبُّكما سواءً ولكن لم تقنعا، وضايقتاه، حتى إنَّ الصغرى …"
summary:
  ar: "كان لجحا زوجتان، فسُئل أيتهما أحب إليه فأجاب بأجوبة مبهمة؛ فسألته الصغرى من ينقذ أولًا لو غرقتا في بحيرة آق شهر وهو واقف على الشاطئ؛ فاضطرب وسأل الكبرى هل تعرف السباحة قليلًا. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  en: "Juha has two wives; asked whom he loves more, he gives vague answers; the younger asks whom he would save first if they drowned in the Akshehir lake while he stood on the shore; he is flustered and asks the older wife whether she knows a little swimming. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  ur: "جحا کی دو بیویاں تھیں؛ پوچھا گیا کہ کس سے زیادہ محبت ہے تو اس نے مبہم جواب دیے؛ چھوٹی نے پوچھا کہ اگر ہم آق شہر کی جھیل میں ڈوبنے لگیں اور تم کنارے پر ہو تو پہلے کسے بچاؤ گے؛ وہ گھبرا گیا اور بڑی بیوی سے پوچھا کہ کیا تمہیں تھوڑی سی تیراکی آتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  fr: "Juha a deux épouses; interrogé sur celle qu'il aime le plus, il donne des réponses vagues; la plus jeune demande qui il sauverait en premier si elles se noyaient dans le lac d'Akşehir pendant qu'il se tenait sur la rive; troublé, il demande à l'aînée si elle sait un peu nager. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  es: "Juha tiene dos esposas; preguntado a cuál ama más, da respuestas vagas; la más joven le pregunta a quién salvaría primero si se ahogaran en el lago de Akşehir mientras él está en la orilla; desconcertado, le pregunta a la mayor si sabe nadar un poco. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  tr: "Juha'nın iki karısı vardı. Hangisini daha çok sevdiği sorulduğunda, belirsiz cevaplar verdi. Genç karısı daha sonra, ikisi de Akşehir Gölü'nde boğulursa ve o kıyıda durursa, önce hangisini kurtaracağını sordu. Telaşa kapılan Juha, büyük karısına biraz bile yüzme bilip bilmediğini sordu. {cite:juha-nawadir-kubra-djuwaydi s. 85}"
  id: "Juha mempunyai dua istri. Ketika ditanya siapa yang paling dicintainya, ia memberikan jawaban yang samar. Istri mudanya kemudian bertanya kepadanya siapa yang akan ia selamatkan terlebih dahulu jika mereka berdua tenggelam di Danau Aqshehir sementara ia berdiri di tepi pantai. Ia menjadi bingung dan bertanya kepada istri yang lebih tua apakah ia tahu berenang meskipun hanya sedikit. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
