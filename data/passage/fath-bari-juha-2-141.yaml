text: "… تزوَّجتَ بكرًا أم ثيِّبًا؟ فقلتُ: تزوَّجتُ ثيِّبًا. فقالَ: هلا تزوَّجتَ بكرًا تُلاعبُها وتُلاعبُكَ؟ قلتُ: يا رسولَ الله، تُوفي والدي -أو استُشهدَ- ولي أخواتٌ صغارٌ، فكرهتُ أن أتزوَّج مثلهُنَّ فلا تؤدبُهنَّ ولا تقومُ عليهنَّ، فتزوَّجتُ ثيبًا لتقُومَ عليهنَّ وتؤدِّبهنَّ. قال : …"
