text: "… يطالب بملك اليمن ويستنجد قيصر الروم النعمان يشفع لسيف عند كسرى انتصار سيف شعر سيف بن ذي يزن في هذه القصة شعر أبي الصلت.. عدي بن زيد يذكر الأحباش وجلاءهم عن اليمن. ذِكْرُ مَا انْتَهَىٰ إِلَيْهِ أَمْرُ الفُرْسِ بِاليَمَنِ مدة …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 679، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
