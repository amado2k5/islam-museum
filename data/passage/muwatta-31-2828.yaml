label: { ar: "الموطأ 2828 — صفوان بن سليم: رجل يسأل النبي أأكذب على امرأتي فيقول لا خير في الكذب", en: "Muwatta 2828" }
summary:
  ar: "يروي مالك عن صفوان بن سليم أن رجلا قال للنبي: أكذب امرأتي يا رسول الله؟ فقال: لا خير في الكذب. فقال الرجل: أعدها وأقول لها؟ فقال: لا جناح عليك. ويذكر المحقق قول ابن عبد البر أنه لا يحفظ هذا اللفظ مسندا عن النبي بهذه الصيغة. {cite:muwatta-maruf-1997 p.588}"
