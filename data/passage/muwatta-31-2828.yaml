label: { ar: "الموطأ 2828 — صفوان بن سليم: رجل يسأل النبي أأكذب على امرأتي فيقول لا خير في الكذب", en: "Muwatta 2828", es: "Muwatta 2828", fr: "Muwatta 2828", ur: "موطا 2828", tr: "El-Muvatta 2828 — Safvan bin Salim: Bir adam Peygamberimize, “Eşime yalan söyleyebilir miyim?” diye sorar. Peygamberimiz, “Yalan söylemenin bir faydası yoktur” diye cevap verir.", id: "Al-Muwatta 2828 — Safwan bin Salim: Seorang pria bertanya kepada Nabi, “Bolehkah aku berbohong kepada istriku?” Beliau menjawab, “Tidak ada kebaikan dalam berbohong.”" }
summary:
  ar: "يروي مالك عن صفوان بن سليم أن رجلا قال للنبي: أكذب امرأتي يا رسول الله؟ فقال: لا خير في الكذب. فقال الرجل: أعدها وأقول لها؟ فقال: لا جناح عليك. ويذكر المحقق قول ابن عبد البر أنه لا يحفظ هذا اللفظ مسندا عن النبي بهذه الصيغة. {cite:muwatta-maruf-1997 p.588}"
  tr: "Malik, Safvan ibn Salim'den rivayetle, bir adamın Peygamberimize şöyle dediğini aktarır: \"Ey Allah'ın Resulü, karıma yalan söylemeli miyim?\" Peygamberimiz şöyle cevap verdi: \"Yalan söylemenin bir faydası yoktur.\" Adam tekrar sordu: \"Bunu ona tekrar etmeli miyim?\" Peygamberimiz şöyle cevap verdi: \"Sana bir sakınca yoktur.\" Araştırmacı, İbn Abdül-Barr'ın bu sözün tam olarak bu şekilde Peygamberimizden nakledildiğini hatırlamadığını belirttiğini aktarıyor. {cite:muwatta-maruf-1997 s.588}"
  id: "Malik meriwayatkan dari Safwan ibn Salim bahwa seorang pria berkata kepada Nabi: \"Haruskah aku berbohong kepada istriku, wahai Rasulullah?\" Beliau menjawab: \"Tidak ada kebaikan dalam berbohong.\" Pria itu kemudian berkata: \"Haruskah aku mengulanginya kepadanya?\" Beliau menjawab: \"Tidak ada celaan atasmu.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa ia tidak ingat riwayat ini disampaikan dari Nabi dalam bentuk yang persis sama. {cite:muwatta-maruf-1997 p.588}"
