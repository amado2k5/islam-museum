label: { ar: "الموطأ 712 — سفيان بن عبد الله مصدقاً لعمر: تعد عليهم بالسخلة ولا تأخذها، ولا الأكولة ولا الربى ولا الماخض ولا فحل الغنم", en: "Muwatta 712" }
text: "نعم، تعد عليهم بالسخلة، يحملها الراعي، ولا تأخذها، ولا تأخذ الأكولة ولا الربى ولا الماخض ولا فحل الغنم"
summary:
  ar: "الحديث الأول في باب ما يُعتد به من السخل في الصدقة. يرويه مالك عن ثور بن زيد الديلي عن ابن لعبد الله بن سفيان الثقفي عن جده سفيان بن عبد الله، أن عمر بن الخطاب بعثه مصدقاً فكان يعد على الناس بالسخل، فقالوا: أتعد علينا بالسخل ولا تأخذ منه شيئاً؟ فلما قدم على عمر ذكر له ذلك، فقال عمر: نعم، تعد عليهم بالسخلة يحملها الراعي ولا تأخذها، ولا تأخذ الأكولة ولا الربى ولا الماخض ولا فحل الغنم، وتأخذ الجذعة والثنية، وذلك عدل بين غذاء الغنم وخياره. ويفسر مالك: السخلة الصغيرة حين تُنتج، والربى التي وضعت فهي تربي ولدها، والماخض الحامل، والأكولة شاة اللحم التي تُسمن لتؤكل. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي (4/100). {cite:muwatta-maruf-1997 p.356} {cite:muwatta-maruf-1997 p.357}"
