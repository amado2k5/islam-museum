label: { ar: "الموطأ 712 — سفيان بن عبد الله مصدقاً لعمر: تعد عليهم بالسخلة ولا تأخذها، ولا الأكولة ولا الربى ولا الماخض ولا فحل الغنم", en: "Muwatta 712", es: "Muwatta 712", fr: "Muwatta 712", ur: "موطا 712", tr: "El-Muvatta 712 — Sufyan ibn Abdullah, Ömer'i doğrulayarak: Onları kuzu olarak sayabilirsiniz, fakat onları almayın; ne yiyeni, ne faizciyi, ne gebe olanı, ne de koyunların koçunu.", id: "Al-Muwatta 712 — Sufyan ibn Abdullah, membenarkan Umar: Kalian boleh menganggap mereka sebagai anak domba, tetapi jangan mengambilnya, demikian pula yang makan, yang berriba, yang sedang bunting, dan domba jantan." }
text: "نعم، تعد عليهم بالسخلة، يحملها الراعي، ولا تأخذها، ولا تأخذ الأكولة ولا الربى ولا الماخض ولا فحل الغنم"
summary:
  ar: "الحديث الأول في باب ما يُعتد به من السخل في الصدقة. يرويه مالك عن ثور بن زيد الديلي عن ابن لعبد الله بن سفيان الثقفي عن جده سفيان بن عبد الله، أن عمر بن الخطاب بعثه مصدقاً فكان يعد على الناس بالسخل، فقالوا: أتعد علينا بالسخل ولا تأخذ منه شيئاً؟ فلما قدم على عمر ذكر له ذلك، فقال عمر: نعم، تعد عليهم بالسخلة يحملها الراعي ولا تأخذها، ولا تأخذ الأكولة ولا الربى ولا الماخض ولا فحل الغنم، وتأخذ الجذعة والثنية، وذلك عدل بين غذاء الغنم وخياره. ويفسر مالك: السخلة الصغيرة حين تُنتج، والربى التي وضعت فهي تربي ولدها، والماخض الحامل، والأكولة شاة اللحم التي تُسمن لتؤكل. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي (4/100). {cite:muwatta-maruf-1997 p.356} {cite:muwatta-maruf-1997 p.357}"
  tr: "Zekât için kabul edilebilir kuzu sayılmasıyla ilgili bölümdeki ilk hadis, Malik tarafından Sevr ibn Zeyd el-Dili'den, o da İbn Abdullah ibn Sufyan el-Sakkafi'den, o da dedesi Sufyan ibn Abdullah'tan rivayet edilmiştir. Ömer ibn el-Hattab onu zekât toplayıcısı olarak göndermiştir. Halk arasında kuzuları sayarmış ve halk, \"Bizim aramızda kuzuları sayıyorsun ama hiçbirini almıyorsun?\" demişlerdir. Ömer'e döndüğünde bunu ona anlatmış ve Ömer, \"Evet, çobanın taşıdığı kuzuları say, ama onları alma. Genç kuzuları, emziren kuzuları, gebe kuzuları veya koçları alma. Genç koyunları ve iki yaşındaki koyunları al. Bu, koyunların en iyisini vermenin adaletidir.\" demiştir. Malik şöyle açıklıyor: Genç kuzu, yeni doğum yapmış olan kuzudur; emziren kuzu, doğum yapmış ve yavrusunu büyüten kuzudur; gebe kuzu ise hamile olan kuzudur. Ve besili koyun, et için besiye çekilen koyundur. Editör, Ebu Mus'ab ve Yahya ibn Bukayr'ın bunu Malik'ten el-Bayhaqi'de (4/100) rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.356} {cite:muwatta-maruf-1997 s.357}"
  id: "Hadits pertama dalam bab tentang apa yang dianggap sebagai domba yang dapat diterima untuk zakat diriwayatkan oleh Malik dari Thawr ibn Zayd al-Dili, dari Ibn Abdullah ibn Sufyan al-Thaqafi, dari kakeknya Sufyan ibn Abdullah, bahwa Umar ibn al-Khattab mengutusnya sebagai pengumpul zakat. Ia menghitung domba-domba di antara orang-orang, dan mereka berkata, \"Engkau menghitung domba-domba di antara kami tetapi tidak mengambil satu pun?\" Ketika ia kembali kepada Umar, ia menceritakan hal ini kepadanya, dan Umar berkata, \"Ya, hitunglah domba-domba yang dibawa gembala, tetapi jangan mengambilnya. Jangan mengambil domba-domba muda, domba-domba yang sedang menyusu, domba-domba yang sedang hamil, atau domba jantan. Ambillah domba-domba muda dan domba-domba berumur dua tahun. Inilah keadilan dalam memberikan domba-domba terbaik.\" Malik menjelaskan: domba muda adalah domba yang baru saja melahirkan; domba yang sedang menyusu adalah domba yang telah melahirkan dan sedang membesarkan anaknya; Anak domba yang bunting adalah anak domba yang sedang hamil; dan domba yang digemukkan adalah domba yang digemukkan untuk diambil dagingnya. Editor menyebutkan bahwa Abu Mus'ab dan Yahya ibn Bukayr meriwayatkannya dari Malik dalam al-Bayhaqi (4/100). {cite:muwatta-maruf-1997 p.356} {cite:muwatta-maruf-1997 p.357}"
