text: "… لا حظ في الاسلام لأَحد ترك الصلاة - عبد الرزاق عن معمر عن الثوري عن أَبي إِسحاق عن صلة بن زائر عن حذيفة قال : بُنيَ الاسلام على ثمانية أَسهم، شهادة أَن لا إله إلا اللّه، وأَن محمدًا رسول اللّٰه، …"
