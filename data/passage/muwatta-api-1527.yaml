text: "أَنَّ الْعَبْدَ الآبِقَ إِذَا سَرَقَ لَمْ تُقْطَعْ يَدُهُ وَأَنَّ اللَّهَ تَبَارَكَ وَتَعَالَى يَقُولُ فِي كِتَابِهِ ‏{‏وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءً بِمَا كَسَبَا نَكَالاً مِنَ اللَّهِ وَاللَّهُ عَزِيزٌ حَكِيمٌ‏}‏ ‏.‏ فَإِنْ بَلَغَتْ سَرِقَتُهُ رُبُعَ دِينَارٍ فَصَاعِدًا فَاقْطَعْ يَدَهُ ‏.‏ وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ الْقَاسِمَ بْنَ مُحَمَّدٍ، وَسَالِمَ بْنَ عَبْدِ اللَّهِ، وَعُرْوَةَ بْنَ الزُّبَيْرِ، كَانُوا …"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Muwatta Malik; sending a letter or message to a party."
  ur: "موطأ مالک میں؛ کسی فریق کو خط یا پیغام بھیجنا."
