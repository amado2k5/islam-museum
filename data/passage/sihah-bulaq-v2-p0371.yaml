text: |-
  ٢١٦
  الرجل من المال والأدب فهو عطل وعطل مشل عسر وعسر وقوس عطل أيضالا وتر عليها
  والاعطال من الابل التى لا أرسات عليها وفاقة عطلة بالكسر ونوق علات أى حسان وتعطل
  الرجل اذا بق لاعمل له والاسم العطلة والاعطال الرجال الذين لاسلاح معهسم والتعطيل
  لتغريغ وبترم عطالة لبيود أهلها وفى الحديث عن عائشة رضو اللّٰه عنها فى امرأة توفيت
  فقالت عطلوها أى انزعواحليها والمعطل الموات من الارض وابل معطالة لاراعى لها
  وعطالة جبل لبنى قيم والعيطل من الفساء الطويلة العفق وكذلك من النوق والفرص وقال
  عمروين كلنوم
  ذراعى عيطل أدماه بكر • وأمافول الراجز
  بات يارى شمشهات ذبلا• فهى تسمى بيرما وعيطلا• وقد حد وناها جيد وهلا
  فهما اسعات لناقة واحدة ⁦(عطيل)⁩ العطبول من النساء الحسنة التامة وقال
  ان من أعوب العجائب عندى • قتل يضائحزة عطبول
  وابهع العطابيل والعطابل وأنشدأ بوعمروه مثل العذارى الحسر المطابل• ظل )
  عاظلت المكلاب مه ظلة وعظ الا وتغاظلت اذالزم بعضها بعضا فى السفاد وكذلا الجراد وكل
  ما يغشب وجراد عاظل وعظلى قال أبوز حف الكابى
  غمشى الكاب دفاللكلبة • يغى العظال معدرا بالسوأة
  ويوم العظالى يوم للعرب سى بذق لان الناس ركب بعضهم بعضافيه ويقال لانه ركب
  الاثنان والثلاثة الدابة الواحدة قال الشاعر
  فان تك في يوم العظالى ملامة • فيوم الغبيط كان أخزى وألوما
  وتعظل القوم على فلان اجتمعواعليه والعظال فى القوافى التضمين يقال فلان لا يعاظل
  بين القوافى عفل العفل محس الشاة يين رجليها اذا أردت أن تعرف سمنها من هزالمسا
  قال بشر يهجورجلا
  جزيز التفاشبعان يريض حجرة • حديث اللخصاء وارم العفل معبر
  والعفل والعفلة باتحريل فيه-ماشئ يخرح -ن قبل النساء وحياء الناقة شبيه بالادرة التى
  ا ال والمرأة عفلاء فشل) ا عفشليل الرجل الحافى الثقيل وهيوز عفشليل مسترخية
  اللعم وقال الجرى العليل الكساءلجاى قل لعقل الجر والنهى وجل عل
  وعقول وقد عقل يعقل عقلا ومعة ولا أيضاوهو مصدر وقال سيبويه هوصفة وكان يقول
  ان المصدر لا يأتى على وزن مفعول البتة ويتأول المعقول فية ول كأنه عقل له شى أى حبس
  وأيدوشدد قال ويستغنفى بهذا عن المفعل الذى بكون مصدرا والعقل الدية قال الاصمعى
  واغماءو.ت بذلك لان الابل كانت تعقل بفناء ولى المقنول ثم كثراستعمالهم(هذا الحرف
  حتى قالواعقلت المقتول اذا أعطيت ديته دراهم أود قانير والعقل ثوب أ-ر قال علمة
  عقلاورقاتكاد الطير تخطفه * كانه من دم الاجواف مدموم
