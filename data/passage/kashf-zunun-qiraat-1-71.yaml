text: "النوع الثاني ما دونه الفلاسفة لتحقيق الأشياء كما هي وكيفية العمل على وفق عقولهم. انتهى. وذكر في عُلوم المُتَشَرِّعة: عِلْمَ القراءة، وعِلْمَ الحديث وعِلْمَ أُصوله، وعِلْمَ التَّفْسير، وعِلْمَ الكلام، وعِلْمَ الفقه وعِلْمَ أُصوله، وعِلْمَ الأدب، وقال: هذا هو المشهور عند …"
