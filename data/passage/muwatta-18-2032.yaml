label: { ar: "الموطأ 2032 — مالك: فيمن دفع إلى رجل مالا قراضا، فخرج به وبمال نفسه: يجعل النفقة من القراض ومن ماله، على قدر حصص المال", en: "Muwatta 2032", es: "Muwatta 2032", fr: "Muwatta 2032", ur: "موطا 2032", tr: "Al-Muwatta 2032 — Malik: Bir kimseye borç para veren ve o kişinin de bu parayı ve kendi parasını alması durumunda, borç paranın payına göre masrafları ve kendi parasından karşılaması gerekir.", id: "Al-Muwatta 2032 — Malik: Mengenai orang yang memberi uang kepada seseorang sebagai pinjaman, dan orang tersebut mengambil uang itu dan uangnya sendiri: maka ia harus menanggung pengeluaran tersebut dari pinjaman dan uangnya sendiri, sesuai dengan bagian uang tersebut." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فخرج به وبمال نفسه، قال: يجعل النفقة من القراض ومن ماله، على قدر حصص المال. {cite:muwatta-maruf-1997 p.231}"
  tr: "Malik, bir adamın bir başka adama kâr paylaşımı anlaşması için para vermesi ve ardından ikinci adamın hem parayı hem de kendi parasını alıp gitmesi durumunda şunları söylemiştir: İkinci adam, pay oranlarına göre, masrafları hem kâr paylaşımından elde ettiği paradan hem de kendi parasından karşılamalıdır. {cite:muwatta-maruf-1997 s.231}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain untuk kesepakatan bagi hasil, dan kemudian pria kedua itu pergi dengan membawa uang tersebut dan uangnya sendiri: Ia harus menanggung pengeluaran tersebut dari kesepakatan bagi hasil dan dari uangnya sendiri, sesuai dengan proporsi bagiannya. {cite:muwatta-maruf-1997 p.231}"
