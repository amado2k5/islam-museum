label: { ar: "الموطأ 2043 — مالك: فيمن دفع إلى رجل مالا قراضا فعمل فيه، فجاءه فقال: هذه حصتك من الربح، وقد أخذت لنفسي مثله، ورأس مال مالك وافر عندي: لا يحب ذلك حتى يحضر المال كله فيحاسبه حتى يحصل رأس المال، ثم يقتسمان الربح، ثم يرد إليه المال إن شاء أو يحبسه، ومخافة أن يكون العامل قد نقص فيه يجب حضور المال", en: "Muwatta 2043", es: "Muwatta 2043", fr: "Muwatta 2043", ur: "موطا 2043", tr: "El-Muvatta 2043 — Malik: Bir kimse, bir adama kâr paylaşımı ortaklığı (kırad) için para verir ve adam bu parayı yatırıma yatırır. Sonra yatırımcı gelir ve, “Bu senin kâr payın, ben de aynı miktarı kendime aldım, senin sermayen ise bende kaldı” derse: Malik, yatırımcının sermayesini geri alana kadar tüm paranın getirilmesi ve hesapların kapatılması şartıyla bunu onaylamaz. Sonra kârı paylaşırlar ve yatırımcı isterse parayı iade edebilir, isterse de vermeyebilir. Yatırımcının zarar görmüş olabileceği korkusuyla, paranın getirilmesi gerekir.", id: "Al-Muwatta 2043 — Malik: Mengenai seseorang yang memberikan uang kepada seorang pria untuk kemitraan bagi hasil (qirad), dan pria itu menginvestasikannya, kemudian investor datang dan berkata, “Ini bagianmu dari keuntungan, dan aku telah mengambil jumlah yang sama untuk diriku sendiri, dan modalmu masih ada padaku”: Malik tidak menyetujui hal ini sampai semua uang tersebut dibawa ke depan sehingga investor dapat menyelesaikan perhitungan sampai modalnya kembali. Kemudian mereka membagi keuntungan, dan kemudian investor dapat mengembalikan uang tersebut jika ia mau, atau ia dapat menahannya. Karena khawatir investor mungkin mengalami kerugian, uang tersebut harus dibawa ke depan." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فعمل فيه، فجاءه فقال: هذه حصتك من الربح، وقد أخذت لنفسي مثله، ورأس مالك وافر عندي. قال مالك: لا أحب ذلك، حتى يحضر المال كله، فيحاسبه حتى يحصل رأس المال، ويعلم أنه وافر، ويصل إليه، ثم يقتسمان الربح بينهما على شرطهم. ثم يرد إليه المال إن شاء، أو يحبسه. وإنما يجب حضور المال، مخافة أن يكون العامل قد نقص فيه، فهو يحب أن لا ينزع منه، وأن يقره في يده. {cite:muwatta-maruf-1997 p.234} {cite:muwatta-maruf-1997 p.235}"
  tr: "Malik, bir adamın bir başkasına kâr paylaşımı (kırad) için para verdiğini, o adamın da bu parayı yatırım yaptığını ve ikinci adamın yanına gelip, \"Bu senin kâr payın, ben de aynı miktarı kendime aldım ve sermayem hala yeterli\" dediğini anlattı. Malik, \"Bunu beğenmiyorum. Paranın tamamı getirilmeli ve sermayenin mevcut, yeterli ve kendisine ait olduğundan emin olmak için hesap yapılmalıdır. Sonra anlaşmalarına göre kârı aralarında paylaşmalıdırlar. Daha sonra isterse parayı kendisine iade edebilir, isterse de saklayabilir. Para getirilmelidir çünkü işçinin paranın bir kısmını kaybetmiş olabileceğinden korkulmaktadır ve paranın elinden alınmasını değil, kendisinde kalmasını tercih eder.\" dedi."
  id: "Malik berkata tentang seorang pria yang memberikan uang kepada pria lain untuk perjanjian bagi hasil (qirad), yang kemudian diinvestasikan, dan pria kedua itu datang kepadanya dan berkata, \"Ini bagianmu dari keuntungan, dan aku telah mengambil jumlah yang sama untuk diriku sendiri, dan modalku masih cukup.\" Malik berkata, \"Aku tidak menyukai itu. Seluruh jumlah uang harus dibawa, dan perhitungan harus diselesaikan untuk memastikan modalnya ada dan cukup serta tersedia baginya. Kemudian mereka harus membagi keuntungan di antara mereka sesuai dengan kesepakatan mereka. Kemudian uang itu dapat dikembalikan kepadanya jika dia mau, atau dia dapat menyimpannya. Uang itu harus dibawa karena ada kekhawatiran bahwa pekerja mungkin telah kehilangan sebagian darinya, dan dia lebih suka agar uang itu tidak diambil darinya dan tetap berada dalam kepemilikannya.\""
