label: { ar: "الموطأ 2043 — مالك: فيمن دفع إلى رجل مالا قراضا فعمل فيه، فجاءه فقال: هذه حصتك من الربح، وقد أخذت لنفسي مثله، ورأس مال مالك وافر عندي: لا يحب ذلك حتى يحضر المال كله فيحاسبه حتى يحصل رأس المال، ثم يقتسمان الربح، ثم يرد إليه المال إن شاء أو يحبسه، ومخافة أن يكون العامل قد نقص فيه يجب حضور المال", en: "Muwatta 2043" }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فعمل فيه، فجاءه فقال: هذه حصتك من الربح، وقد أخذت لنفسي مثله، ورأس مالك وافر عندي. قال مالك: لا أحب ذلك، حتى يحضر المال كله، فيحاسبه حتى يحصل رأس المال، ويعلم أنه وافر، ويصل إليه، ثم يقتسمان الربح بينهما على شرطهم. ثم يرد إليه المال إن شاء، أو يحبسه. وإنما يجب حضور المال، مخافة أن يكون العامل قد نقص فيه، فهو يحب أن لا ينزع منه، وأن يقره في يده. {cite:muwatta-maruf-1997 p.234} {cite:muwatta-maruf-1997 p.235}"
