text: "… كان جبريل ينزل مجسداً يراه المسلمون كما حصل في حديث أركان الإيمان والإسلام والإحسان، وأشراط الساعة، الذي روي عن عمر بن الخطاب - - وفي ختامه : هذا جبريل أتاكم يعلمكم دينكم. وحين يدعي إنسان أنه يتصل بالله ويحمل منه …"
summary:
