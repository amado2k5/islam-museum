label: { ar: "الموطأ 584 — الصنابحي: إن الشمس تطلع ومعها قرن الشيطان… ونهى عن الصلاة في تلك الساعات", en: "Muwatta 584" }
text: "إن الشمس تطلع ومعها قرن الشيطان، فإذا ارتفعت فارقها، ثم إذا استوت قارنها، فإذا زالت فارقها، فإذا دنت للغروب قارنها، فإذا غربت فارقها"
summary:
  ar: "أول حديث في باب النهي عن الصلاة بعد الصبح وبعد العصر. يرويه مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله الصنابحي، أن النبي أخبر أن الشمس تطلع ومعها قرن الشيطان، فإذا ارتفعت فارقها، ثم إذا استوت قارنها، فإذا زالت فارقها، فإذا دنت للغروب قارنها، فإذا غربت فارقها، ونهى عن الصلاة في تلك الساعات. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع وابن مهدي عند أحمد (4/349)، وسويد، والقعنبي ومن طريقه الجوهري والبيهقي، وعتبة بن عبد الله وقتيبة عند النسائي (1/74)، والشافعي في الرسالة (874) والأم، ومحمد بن الحسن الشيباني (181)، ويحيل على كلام أحمد شاكر في تعليقه على الرسالة وعلى تعليقه هو على الحديث (66) من هذا الكتاب في شأن الصنابحي. {cite:muwatta-maruf-1997 p.301}"
