label: { ar: "الموطأ 584 — الصنابحي: إن الشمس تطلع ومعها قرن الشيطان… ونهى عن الصلاة في تلك الساعات", en: "Muwatta 584", es: "Muwatta 584", fr: "Muwatta 584", ur: "موطا 584", tr: "Al-Muwatta 584 — Al-Sanabihi: Güneş şeytanın boynuzuyla doğar… ve o zamanlarda namazı haram kılmıştır.", id: "Al-Muwatta 584 — Al-Sanabihi: Matahari terbit dengan tanduk setan… dan dia melarang salat pada waktu-waktu itu" }
text: "إن الشمس تطلع ومعها قرن الشيطان، فإذا ارتفعت فارقها، ثم إذا استوت قارنها، فإذا زالت فارقها، فإذا دنت للغروب قارنها، فإذا غربت فارقها"
summary:
  ar: "أول حديث في باب النهي عن الصلاة بعد الصبح وبعد العصر. يرويه مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله الصنابحي، أن النبي أخبر أن الشمس تطلع ومعها قرن الشيطان، فإذا ارتفعت فارقها، ثم إذا استوت قارنها، فإذا زالت فارقها، فإذا دنت للغروب قارنها، فإذا غربت فارقها، ونهى عن الصلاة في تلك الساعات. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع وابن مهدي عند أحمد (4/349)، وسويد، والقعنبي ومن طريقه الجوهري والبيهقي، وعتبة بن عبد الله وقتيبة عند النسائي (1/74)، والشافعي في الرسالة (874) والأم، ومحمد بن الحسن الشيباني (181)، ويحيل على كلام أحمد شاكر في تعليقه على الرسالة وعلى تعليقه هو على الحديث (66) من هذا الكتاب في شأن الصنابحي. {cite:muwatta-maruf-1997 p.301}"
  id: "Hadits pertama dalam surah ini membahas tentang larangan salat setelah salat Subuh dan Ashar. Diriwayatkan oleh Malik dari Zaid bin Aslam, dari Ata bin Yasar, dari Abdullah al-Sunabihi, bahwa Nabi (shalawat dan salam kepadanya) bersabda bahwa matahari terbit dengan tanduk setan. Ketika terbit tinggi, ia meninggalkannya. Kemudian, ketika mencapai puncaknya, ia menyertainya. Ketika terbenam, ia meninggalkannya. Ketika mendekati matahari terbenam, ia menyertainya. Ketika terbenam, ia meninggalkannya. Beliau melarang salat pada waktu-waktu tersebut. Penyunting menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, dan dari sanadnya oleh al-Baghawi, Ishaq al-Tabba’, dan Ibn Mahdi dalam Musnad Ahmad (4/349), Suwayd, al-Qa’nabi, dan dari sanadnya oleh al-Jawhari dan al-Bayhaqi, Utbah ibn Abdullah dan Qutaybah dalam Musnad al-Nasa’i (1/74), al-Shafi’i dalam al-Risalah (874) dan al-Umm, dan Muhammad ibn al-Hasan al-Shaybani (181). Ia merujuk pada perkataan Ahmad Shakir dalam komentarnya tentang al-Risalah dan pada komentarnya sendiri tentang hadits (66) dalam buku ini mengenai al-Sunabihi. {cite:muwatta-maruf-1997 p.301}"
