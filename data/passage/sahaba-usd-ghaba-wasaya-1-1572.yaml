text: "… : قَيلة، والأوّل أصح. تزوجها رسول اللّٰه ملع سنة عشر ثم اشتكى، وقبض ولم تكن قدمت عليه ولا رآها ولا دخل بها. قيل إنه تزوّجها قبل وفاته بشهر. وقيل إن الني علية أوصى أن تخير، فإن شاءت ضَرَب عليها الحجاب …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1572، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1572, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1572 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 1572, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 1572), mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin resimli 1. cildinin 1572. sayfasından, vasiyetname veya son vasiyetten ve ölüm saatinden bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 1 bergambar, halaman 1572, yang menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari edisi faksimili yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
