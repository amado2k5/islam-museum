label: { ar: "جامع الترمذي 3419 — الأب والأبوة", en: "Jami' al-Tirmidhi 3419 — the father and fatherhood", ur: "جامع ترمذی 3419 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3419 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3419 — le père et la paternité", tr: "Cami' el-Tirmizi 3419 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3419 — Ayah dan Peran Ayah" }
text: "… لَيْلَى، حَدَّثَنِي أَبِي، حَدَّثَنِي ابْنُ أَبِي لَيْلَى، عَنْ دَاوُدَ بْنِ عَلِيٍّ، هُوَ ابْنُ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ عَنْ أَبِيهِ، عَنْ جَدِّهِ ابْنِ عَبَّاسٍ، قَالَ سَمِعْتُ نَبِيَّ اللَّهِ يَقُولُ لَيْلَةً حِينَ فَرَغَ مِنْ صَلاَتِهِ \" اللَّهُمَّ إِنِّي أَسْأَلُكَ رَحْمَةً مِنْ عِنْدِكَ تَهْدِي بِهَا قَلْبِي وَتَجْمَعُ بِهَا أَمْرِي وَتَلُمُّ بِهَا شَعَثِي وَتُصْلِحُ بِهَا غَائِبِي وَتَرْفَعُ بِهَا شَاهِدِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3419، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3419 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3419، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3419 (Capítulos sobre la súplica), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3419 (Chapitres sur l'invocation), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de 3419 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3419, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
