label: { ar: "صحيح البخاري 1410 — الأب والأبوة، تربية الأب ووصيته", en: "Sahih al-Bukhari 1410 — the father and fatherhood; the father raising and counselling", ur: "صحیح بخاری 1410 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 1410 — El padre y la paternidad; la crianza y el consejo paternos", fr: "Sahih al-Bukhari 1410 — Le père et la paternité; l'éducation et les conseils du père", tr: "Sahih el-Buhari 1410 — Baba ve Babalık, Babanın Yetiştirilmesi ve İradesi", id: "Sahih al-Bukhari 1410 — Ayah dan Peran Ayah, Didikan Ayah dan Wasiatnya" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُنِيرٍ، سَمِعَ أَبَا النَّضْرِ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ ـ هُوَ ابْنُ عَبْدِ اللَّهِ بْنِ دِينَارٍ ـ عَنْ أَبِيهِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ تَصَدَّقَ بِعَدْلِ تَمْرَةٍ مِنْ كَسْبٍ طَيِّبٍ ـ وَلاَ يَقْبَلُ اللَّهُ إِلاَّ الطَّيِّبَ ـ وَإِنَّ اللَّهَ يَتَقَبَّلُهَا بِيَمِينِهِ، ثُمَّ يُرَبِّيهَا لِصَاحِبِهِ كَمَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1410، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1410 (Obligatory Charity Tax (Zakat)), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1410، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1410 (Impuesto obligatorio sobre la caridad (Zakat)), menciona al padre y la paternidad, así como la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1410 (L'aumône obligatoire (Zakat)), évoque le père et la paternité, l'éducation et le rôle du père dans le soutien et l'accompagnement de ses enfants. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'nin 1410 numaralı hadisinde baba, babalık, babanın yetiştirilmesi ve vasiyeti ele alınmaktadır. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1410, menyebutkan tentang ayah, peran ayah, pendidikan ayah, dan wasiatnya. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
