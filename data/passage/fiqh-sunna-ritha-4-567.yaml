text: "… كل مصيبة وخَلفاً من كل هالك، ودَرَكا من كل فائت، فبالله فثقوا وإياه فارجوا، فإن المصاب من حرم الثواب. وإسناده ضعيف. قال العلماء فإن عزَّى مسلماً بمسلم قال : أعظم اللّٰه أجرك وأحسن عزاءك، وغفر لميتك. وإن عزَّى مسلماً بكافر …"
summary:
  ar: "مقطع من فقه السنة — سعيد رمضان البوطي، المجلد المصوَّر 4، ص 567، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
