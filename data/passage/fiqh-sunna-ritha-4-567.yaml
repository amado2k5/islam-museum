  tr: "Sa'id Ramadan al-Buti'nin *Fıkıhü'l-Sünne* adlı eserinin 4. cildinin 567. sayfasından, musibet karşısında taziye, teselli ve sabır içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü mersiye ve övgülerden derlenmiştir."
  id: "Cuplikan dari *Fiqh al-Sunnah* karya Sa'id Ramadan al-Buti, Volume 4, halaman 567, berisi ucapan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
