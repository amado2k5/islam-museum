text: "… عنديدِك إذا قَسَمتَ، قُومُوا عنِّي. - حدَّثنا الحسينُ، أخبرنا محمَّدُ بن أبي عَديٍّ، حدَّثنا حُمَيدٌ الطَّويلُ، عن مُورّقٍ العِجليِّ، عن بعضِ أصحابِه ممَّن أدرَكَ سلمانَ، قال: دخلنا على سلمانَ في وَجَعِه الّذي ماتَ فيه، فبكى، فقلنا: ما يُبكيكَ يا أبا …"
