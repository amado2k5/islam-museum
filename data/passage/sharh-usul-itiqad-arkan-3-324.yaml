text: "… ثُم وضعَ يدَه على رُكْبتي رسول اللٰه ه، فقال: يا محمدُ: ما الإسلامُ؟ - الحديث، إلى أنْ قال: ما الإيمانُ؟ قال: الإيمانُ: أَنْ تُؤْمِنَ بالله، ومَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَتُؤْمِنَ بِالجَنَّةِ وَالنَّارِ وَالمِيزَانِ، وَتُؤْمِنَ بِالبَعْث بَعْدَ الموْتِ، وَبِالقَدَرِ خَيرهِ وَشَرِّهِ، فَإِذَا …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 324، يذكر الإيمان بالقدر، والسؤال عن الإيمان وجوابه، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 324, that mentions belief in the decree, the question about faith and its answer, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 324 کا اقتباس جس میں تقدیر پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 3, pág. 324, que menciona la creencia en el decreto, la cuestión de la fe y su respuesta, y la creencia en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 3, p. 324) évoquant la croyance au décret, la question de la foi et sa réponse, ainsi que la croyance en la résurrection. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 3. cildinin 324. sayfasından, kader inancı, iman sorusu ve cevabı ile diriliş inancını ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 3, halaman 324, yang membahas kepercayaan pada takdir, pertanyaan tentang iman dan jawabannya, serta kepercayaan pada kebangkitan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
