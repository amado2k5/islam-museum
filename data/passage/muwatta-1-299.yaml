label: { ar: "الموطأ 299 — صلى بالناس ليالي في رمضان ثم امتنع خشية أن تفرض", en: "Muwatta 299" }
text: "قد رأيت الذي صنعتم، ولم يمنعني من الخروج إليكم إلا أني خشيت أن تفرض عليكم"
summary:
  ar: "أول حديث في باب الترغيب في الصلاة في رمضان. يرويه يحيى عن مالك عن ابن شهاب عن عروة بن الزبير عن عائشة: صلى النبي في المسجد ذات ليلة فصلى بصلاته ناس، ثم صلى الليلة التالية فكثر الناس، ثم اجتمعوا الليلة الثالثة أو الرابعة فلم يخرج إليهم، فلما أصبح أخبرهم أنه رأى ما صنعوا وأنه لم يمنعه من الخروج إلا خشية أن تُفرض عليهم، وذلك في رمضان. ويخرّجه المحقق عند البخاري (1129، 2011) ومسلم (2/177) وأبي داود (1373) والنسائي (2/202) وابن حبان وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (8/108). {cite:muwatta-maruf-1997 p.169} {cite:muwatta-maruf-1997 p.170}"
