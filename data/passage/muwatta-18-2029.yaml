label: { ar: "الموطأ 2029 — مالك: فيمن تعدى فتسلف مما في يديه من مال القراض، فابتاع به سلعة لنفسه: إن ربح فالربح على شرطهما في القراض، وإن نقص فهو ضامن للنقصان", en: "Muwatta 2029", es: "Muwatta 2029", fr: "Muwatta 2029", ur: "موطا 2029", tr: "El-Muvatta 2029 — Malik: Ortaklık anlaşmasının sermayesinden borç alıp kendi malına harcayan kimse hakkında: Eğer kâr ederse, kârı ortaklık anlaşmasında kararlaştırılan miktardadır; eğer zarar ederse, zarardan sorumludur.", id: "Al-Muwatta 2029 — Malik: Mengenai orang yang melanggar dan meminjam dari modal perjanjian bagi hasil dan menggunakannya untuk membeli barang untuk dirinya sendiri: Jika ia mendapat keuntungan, keuntungannya sesuai dengan kesepakatan mereka dalam perjanjian bagi hasil, dan jika ia mengalami kerugian, ia bertanggung jawab atas kerugian tersebut." }
summary:
  ar: "قال مالك في رجل تعدى فتسلف مما في يديه من المال القراض مالا، فابتاع به سلعة لنفسه، قال مالك: إن ربح فالربح على شرطهما في القراض، وإن نقص فهو ضامن للنقصان. {cite:muwatta-maruf-1997 p.229} {cite:muwatta-maruf-1997 p.230}"
  tr: "Malik, kâr paylaşımı anlaşması için sahip olduğu sermayeden borç alıp, sonra da kendine mal satın alan bir adam hakkında şöyle demiştir: Malik dedi ki: Eğer kâr varsa, kâr paylaşım anlaşmasındaki anlaşmaya göre olur; eğer zarar varsa, zarardan sorumludur. {cite:muwatta-maruf-1997 s.229} {cite:muwatta-maruf-1997 s.230}"
  id: "Malik berkata mengenai seorang pria yang melanggar dengan meminjam uang dari modal yang dimilikinya untuk perjanjian bagi hasil, dan kemudian membeli barang untuk dirinya sendiri: Malik berkata: Jika ada keuntungan, maka keuntungan itu sesuai dengan kesepakatan mereka dalam perjanjian bagi hasil, dan jika ada kerugian, maka dia bertanggung jawab atas kerugian tersebut. {cite:muwatta-maruf-1997 p.229} {cite:muwatta-maruf-1997 p.230}"
