text: "… رَجُلٌ مُزَمَّلٌ بَيْنَ ظَهْرَانَيْهِمْ فَقُلْتُ مَنْ هَذَا فَقَالُوا هَذَا سَعْدُ بْنُ عُبَادَةَ. فَقُلْتُ مَا لَهُ قَالُوا يُوعَكُ. فَلَمَّا جَلَسْنَا قَلِيلاً تَشَهَّدَ خَطِيبُهُمْ، فَأَثْنَى عَلَى اللَّهِ بِمَا هُوَ أَهْلُهُ ثُمَّ قَالَ أَمَّا بَعْدُ فَنَحْنُ أَنْصَارُ اللَّهِ وَكَتِيبَةُ الإِسْلاَمِ، وَأَنْتُمْ مَعْشَرَ الْمُهَاجِرِينَ رَهْطٌ، وَقَدْ دَفَّتْ دَافَّةٌ مِنْ قَوْمِكُمْ، فَإِذَا هُمْ يُرِيدُونَ أَنْ يَخْتَزِلُونَا مِنْ أَصْلِنَا وَأَنْ يَحْضُنُونَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6830، يذكر الحمى والوعك. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6830 (Limits and Punishments set by Allah (Hudood)), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6830، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
