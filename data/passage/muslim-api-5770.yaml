text: "… قَتَادَةَ، عَنْ أَبِي الْمُتَوَكِّلِ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ إِنَّ أَخِي اسْتَطْلَقَ بَطْنُهُ. فَقَالَ رَسُولُ اللَّهِ \" اسْقِهِ عَسَلاً \". فَسَقَاهُ ثُمَّ جَاءَهُ فَقَالَ إِنِّي سَقَيْت��هُ عَسَلاً فَلَمْ يَزِدْهُ إِلاَّ اسْتِطْلاَقًا. فَقَالَ لَهُ ثَلاَثَ مَرَّاتٍ ثُمَّ جَاءَ الرَّابِعَةَ فَقَالَ \" اسْقِهِ عَسَلاً \". فَقَالَ لَقَدْ سَقَيْتُهُ فَلَمْ يَزِدْهُ إِلاَّ اسْتِطْلاَقًا. …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5770، يذكر التداوي بالعسل، وأسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5770 (The Book of Greetings), that mentions honey as a remedy, named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5770، جس میں شہد سے علاج، بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
