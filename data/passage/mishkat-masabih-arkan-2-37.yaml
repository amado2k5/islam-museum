text: "… يقلبها الرياحُ ظهراً لبطن. رواه أحمد. - وعن علي، قال: قال رسول اللّه وَيُّم : لا يؤمنُ عبدٌ حتى يؤمن بأربع : بشهد أن لا إِله إلا الله وأني رسول اللّٰه بعثني بالحق، ويؤمن بالموت، والبعث بعد الموت، ويؤمن بالقدر. …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 37، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 2, p. 37, that mentions belief in the decree, what faith is not complete without, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 2، ص 37 کا اقتباس جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 2, pág. 37, que menciona la creencia en el decreto, sin el cual la fe no está completa, la creencia en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 2, page 37, mentionnant la croyance au décret, élément essentiel de la foi, et la croyance en la résurrection; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 2, sayfa 37'den bir alıntı, kader inancından, onsuz imanın eksik kalacağından ve kıyamet inancından bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 2, halaman 37, menyebutkan kepercayaan pada takdir, sesuatu yang tanpanya iman tidak lengkap, dan kepercayaan pada Kebangkitan. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
