text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا ابْنُ جُرَيْجٍ، عَنْ عَطَاءٍ، عَنْ صَفْوَانَ بْنِ يَعْلَى، عَنْ أَبِيهِ ـ قَالَ غَزَوْتُ مَعَ رَسُولِ اللَّهِ غَزْوَةَ تَبُوكَ، فَحَمَلْتُ عَلَى بَكْرٍ، فَهْوَ أَوْثَقُ أَعْمَالِي فِي نَفْسِي، فَاسْتَأْجَرْتُ أَجِيرًا، فَقَاتَلَ رَجُلاً، فَعَضَّ أَحَدُهُمَا الآخَرَ فَانْتَزَعَ يَدَهُ مِنْ فِيهِ، وَنَزَعَ ثَنِيَّتَهُ، فَأَتَى النَّبِيَّ فَأَهْدَرَهَا فَقَالَ \" أَيَدْفَعُ يَدَهُ إِلَيْكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2973، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2973 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2973، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2973 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
