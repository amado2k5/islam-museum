  وعض زمان بابن هروان لم يدع ,،, من المال الامسحتا أومجلف
  قال آبو الغوث المحت المهلات والمجاف الذى بقيت منسه بقسة يريد الامسحنا أو هو مجاف
  والجلف أيضا الرجل الذى جلفته السنون أى ذهبت بأمواله يقال جلفت كل وقولهم
  أعراتي جلف أى جاف وأصله من أجلاف الشاة وهى المسلوخة بلار أس ولا قوائم ولا بطن
  وقال أبو عبيدة أصل الحاف الدن الفارغ قال والمسلوخ اذا أخرج بطنه جلف أيضاوقال
  أبو عمر والجلف كل ظرف ووعاء وجعه جلوف نف) الجنف الميل وقد جنف
  بالسكسر يجنف جنفا ومنهة وله تعالى ذن خاف من موص جنفا قال الشاعر
  هم المولى وان جنفواعلينا • وانامن لقاتهسم لزور
  قال أبو عبيد المولى ههنا فى موضع الموالى أى بن العمّ كفوله تعالى ثم نخرحكم طف_لا
  ويقال أجنف الرجل أى جاء بالجنف كما يقال ألام أى أنى بما يلام عليه وأخسّ أى أتى
  بخسيس قال أبو كبير
  واقد نقيم اذا الخصوم تنافدوا • أسلامهم صعرالخصيم الجذف
  ويروى تناقدوا. وتجانف لاثم أى مال ورجل أجنف أى متحنى الظهر وجنتى على فعلى
  بضم الفاءوفتح العين اسم موضع عن ابن السكيت وف الجوف المطمتن من
  الارض وجوف الانسان بطنه والاجوفان البطن والفرج والجائفة الطعنة التى تبلغ
  الجوف قال أبو عبيد وقد تكون التى تخالط الجوف والتى تنفذ أيضا وأجفته الطعنة وجفته
  بها حكاه عن الكائىّ فى باب أفعلت الشئ وفعلت به واجقت الباب أى رددته قال
  أبو عبيدة المجوف الرحل الضخم الجوف قال الاعشى بصف ناقته
  هى الصاحب الادنى وبدنى وبينها * مجوف علاقى وقطع وغرق
  يعنى هى الصاجب الذى يصحبى واستجاف المشئ واستجوف أى انسع قال أبو دواد
  فهى شوهاه كالجوالق فوها * مستجاف بضل فيه الشكيم
  والجواف بالضم ضرب من السحك والجوفىّ مثله قال الراجز أنشدتيه أبو الغوث
  اذاتعنوا بصلاوخلا • وكنعداوجوف اقدصلا
  بانوايساون الفسامسلا • سلّ النبيط القصب المبتلا
  واغاخفقه للة رورة والجوف بالتحريك مصدرة ولك شى أجوف ودلاء جوف أى واسعة
  وشجرة جوفاء أى ذات جوف وشى محوّف أى أجوف رفيه تجر يف والمجوّف من الدواب
  الذى يصعد البلق حتى يبلغ البطن عن الاصمعىّ وأنشد اطفيل
  شميط الذناب جوفت وهى جونة *بنقبة ديباج وريط مقطع
  واحتافه وتجوّفه بمعنى أى دخل حوفه وشئ جوفىّ أى واسع الجوف قال العجاج بصف
  كناس ثور
  فهواذا ما اجتافه جوفى * كالخص اذجاله البارى"
  وتجوّفت الخوصة العرفج وذلك قب-ل أن نخرج وهى فى جوفه وقواهم أخلى من جوف هو
