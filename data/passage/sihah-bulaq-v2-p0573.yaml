  قوله جلفت كل قال المجد وجلفت
  كل تجلبفا أى استأصلت السنة
  الاموال ويصرف و ينع ١ه
  كتيه المصحيح
  قولميه عد البلق -تى الخ عبارة
  القاموس بصود البلق منه حتى
  الخ اه كتبه الصحيج
