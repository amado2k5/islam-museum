label: { ar: "جامع الترمذي 3955 — الأب والأبوة", en: "Jami' al-Tirmidhi 3955 — the father and fatherhood", ur: "جامع ترمذی 3955 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3955 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3955 — le père et la paternité" }
text: "… بْنُ سَعْدٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" لَيَنْتَهِيَنَّ أَقْوَامٌ يَفْتَخِرُونَ بِآبَائِهِمُ الَّذِينَ مَاتُوا إِنَّمَا هُمْ فَحْمُ جَهَنَّمَ أَوْ لَيَكُونَنَّ أَهْوَنَ عَلَى اللَّهِ مِنَ الْجُعَلِ الَّذِي يُدَهْدِهُ الْخِرَاءَ بِأَنْفِهِ إِنَّ اللَّهَ قَدْ أَذْهَبَ عَنْكُمْ عُبِّيَّةَ الْجَاهِلِيَّةِ إِنَّمَا هُوَ مُؤْمِنٌ تَقِيٌّ وَفَاجِرٌ شَقِيٌّ النَّاسُ كُلُّهُمْ بَنُو آدَمَ وَآدَمُ خُلِقَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3955، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3955 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3955، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3955 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3955 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
