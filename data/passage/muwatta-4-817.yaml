label: { ar: "الموطأ 817 — مالك: لا كفارة على من أفطر يوماً من قضاء رمضان بإصابة أهله نهاراً، وإنما عليه قضاء ذلك اليوم", en: "Muwatta 817" }
summary:
  ar: "قول لمالك: سمعت أهل العلم يقولون: ليس على من أفطر يوماً من قضاء رمضان بإصابة أهله نهاراً أو غير ذلك الكفارة التي تُذكر عن رسول الله فيمن أصاب أهله نهاراً في رمضان، وإنما عليه قضاء ذلك اليوم. ويقول مالك: وهذا أحب ما سمعت إلي فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (806). {cite:muwatta-maruf-1997 p.400} {cite:muwatta-maruf-1997 p.401}"
