label: { ar: "الموطأ 101 — سعد يأمر ابنه مصعباً بالوضوء من مس الذكر", en: "Muwatta 101" }
text: "لعلك مسست ذكرك؟ قال: فقلت: نعم. فقال: قم فتوضأ"
summary:
  ar: "أثر يرويه مالك عن إسماعيل بن محمد بن سعد عن مصعب بن سعد بن أبي وقاص، في باب الوضوء من مس الفرج: كان مصعب يمسك المصحف على أبيه سعد فاحتك، فسأله سعد أمسّ ذكره، فلما أجاب بنعم أمره أن يقوم فيتوضأ، فتوضأ ورجع. ويذكر المحقق أنه رواه من غير طريق مالك عبد الرزاق وابن أبي شيبة والطحاوي، وأن للطحاوي رواية أخرى بالقصة أمره فيها أبوه أن يغمس يده في التراب ولم يأمره بالوضوء، ورواية بلفظ: أمرني بغسل يدي. {cite:muwatta-maruf-1997 p.85} {cite:muwatta-maruf-1997 p.86}"
