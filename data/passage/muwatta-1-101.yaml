label: { ar: "الموطأ 101 — سعد يأمر ابنه مصعباً بالوضوء من مس الذكر", en: "Muwatta 101", es: "Muwatta 101", fr: "Muwatta 101", ur: "موطا 101", tr: "El-Muvatta 101 — Sa'd, oğlu Mus'ab'a cinsel organlarına dokunduktan sonra abdest almasını emreder.", id: "Al-Muwatta 101 — Sa'd memerintahkan putranya, Mus'ab, untuk berwudhu setelah menyentuh kemaluannya." }
text: "لعلك مسست ذكرك؟ قال: فقلت: نعم. فقال: قم فتوضأ"
summary:
  ar: "أثر يرويه مالك عن إسماعيل بن محمد بن سعد عن مصعب بن سعد بن أبي وقاص، في باب الوضوء من مس الفرج: كان مصعب يمسك المصحف على أبيه سعد فاحتك، فسأله سعد أمسّ ذكره، فلما أجاب بنعم أمره أن يقوم فيتوضأ، فتوضأ ورجع. ويذكر المحقق أنه رواه من غير طريق مالك عبد الرزاق وابن أبي شيبة والطحاوي، وأن للطحاوي رواية أخرى بالقصة أمره فيها أبوه أن يغمس يده في التراب ولم يأمره بالوضوء، ورواية بلفظ: أمرني بغسل يدي. {cite:muwatta-maruf-1997 p.85} {cite:muwatta-maruf-1997 p.86}"
  tr: "Malik'in İsmail ibn Muhammed ibn Sa'd'dan, o da Mus'ab ibn Sa'd ibn Abi Vakkas'tan rivayet ettiği, mahrem yerlere dokunduktan sonra abdest alma bölümünde yer alan bir hadiste şöyle bir olay anlatılır: Mus'ab, babası Sa'd için Kur'an'ı tutarken ona dokunmuştur. Sa'd ona mahrem yerlerine dokunup dokunmadığını sormuş, Mus'ab evet cevabını verince kalkıp abdest almasını emretmiştir. Mus'ab abdest alıp geri dönmüştür. Araştırmacı, bu hadisin Malik'inkinden farklı isnadlarla Abdülrazzak, İbn Abi Şeybe ve Tahavi tarafından da rivayet edildiğini ve Tahavi'nin, babasının ona elini toprağa batırmasını emrettiği ancak abdest almasını emretmediği bir başka rivayeti ve \"Elimi yıkamamı emretti\" şeklinde bir başka rivayeti olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.85} {cite:muwatta-maruf-1997 s.86}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Isma'il ibn Muhammad ibn Sa'd atas otoritas Mus'ab ibn Sa'd ibn Abi Waqqas, dalam surah tentang wudhu setelah menyentuh kemaluan: Mus'ab sedang memegang Al-Qur'an untuk ayahnya, Sa'd, ketika ia menyentuhnya. Sa'd bertanya kepadanya apakah ia telah menyentuh kemaluannya, dan ketika ia menjawab ya, ia menyuruhnya untuk bangun dan berwudhu. Maka ia berwudhu dan kembali. Peneliti menyebutkan bahwa riwayat ini dinarasikan oleh 'Abd al-Razzaq, Ibn Abi Shaybah, dan al-Tahawi melalui sanad selain Malik, dan bahwa al-Tahawi memiliki versi lain dari kisah tersebut di mana ayahnya menyuruhnya untuk mencelupkan tangannya ke dalam debu dan tidak menyuruhnya untuk berwudhu, dan versi lain dengan redaksi: Ia menyuruhku untuk mencuci tanganku. {kutip:muwatta-maruf-1997 hal.85} {kutip:muwatta-maruf-1997 hal.86}"
