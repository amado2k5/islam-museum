label: { ar: "الموطأ 1582 — عبد الله بن مسعود: رجل طلق امرأته ثماني تطليقات فقيل له إنها بانت منه، فقال صدقوا، ومن لبس على نفسه لبسا جعلنا لبسه به", en: "Muwatta 1582", es: "Muwatta 1582", fr: "Muwatta 1582", ur: "موطا 1582", tr: "El-Muvatta 1582 — Abdullah bin Mesud: Bir adam karısını sekiz defa boşadı ve ona karısının ondan boşandığı söylendi. O da, “Onlar haklılar. Kim kendini aldatırsa, biz onu kendi aldatmasıyla aldatırız” dedi.", id: "Al-Muwatta 1582 — Abdullah bin Masoud: Seorang pria menceraikan istrinya delapan kali, dan dikatakan kepadanya bahwa istrinya telah diceraikan darinya. Dia berkata, “Mereka benar. Barangsiapa menipu dirinya sendiri, Kami akan membuatnya tertipu oleh tipu dayanya sendiri.”" }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن رجلا جاء إلى عبد الله بن مسعود فقال إني طلقت امرأتي ثماني تطليقات. فقال ابن مسعود فماذا قيل لك؟ قال قيل إنها قد بانت مني. فقال ابن مسعود صدقوا، من طلق كما أمره الله فقد بين الله له، ومن لبس على نفسه لبسا جعلنا لبسه به، لا تلبسوا على أنفسكم ونتحمله عنكم، هو كما يقولون. {cite:muwatta-maruf-1997 p.59}"
  tr: "Yahya, Malik'ten rivayetle, Abdullah ibn Mes'ud'a bir adamın gelip, \"Eşimi sekiz defa boşadım\" dediğini işittiğini anlatır. İbn Mes'ud, \"Sana ne söylendi?\" diye sordu. Adam, \"Dediler ki, o artık benden geri dönülmez bir şekilde boşanmıştır.\" diye cevap verdi. İbn Mes'ud, \"Onlar haklılar. Allah'ın emrettiği gibi boşayan kimseye Allah bunu açıkça bildirmiştir. Kim de kendini karıştırırsa, biz onun karışıklığının sonuçlarını ona yükleriz. Kendinizi karıştırmayın ve sonra da bunun yükünü kendiniz çekmeyin. Dedikleri gibi.\" diye karşılık verdi. {cite:muwatta-maruf-1997 s.59}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar seorang pria datang kepada Abdullah ibn Mas'ud dan berkata, \"Aku telah menceraikan istriku delapan kali.\" Ibn Mas'ud bertanya, \"Apa yang dikatakan kepadamu?\" Pria itu menjawab, \"Mereka mengatakan bahwa dia sekarang telah diceraikan secara mutlak dariku.\" Ibn Mas'ud menjawab, \"Mereka benar. Siapa pun yang bercerai sebagaimana yang diperintahkan Allah, Allah telah menjelaskannya kepadanya. Dan siapa pun yang membingungkan dirinya sendiri, Kami akan membuatnya menanggung akibat dari kebingungannya. Jangan membingungkan diri kalian dan kemudian menanggung beban untuk kalian. Itu seperti yang mereka katakan.\" {cite:muwatta-maruf-1997 p.59}"
