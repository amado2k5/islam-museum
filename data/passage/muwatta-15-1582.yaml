label: { ar: "الموطأ 1582 — عبد الله بن مسعود: رجل طلق امرأته ثماني تطليقات فقيل له إنها بانت منه، فقال صدقوا، ومن لبس على نفسه لبسا جعلنا لبسه به", en: "Muwatta 1582" }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن رجلا جاء إلى عبد الله بن مسعود فقال إني طلقت امرأتي ثماني تطليقات. فقال ابن مسعود فماذا قيل لك؟ قال قيل إنها قد بانت مني. فقال ابن مسعود صدقوا، من طلق كما أمره الله فقد بين الله له، ومن لبس على نفسه لبسا جعلنا لبسه به، لا تلبسوا على أنفسكم ونتحمله عنكم، هو كما يقولون. {cite:muwatta-maruf-1997 p.59}"
