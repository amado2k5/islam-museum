label: { ar: "صحيح البخاري 1283 — تعزية ومواساة وصبر عند المصيبة", en: "Sahih al-Bukhari 1283 — condolence, consolation and patience at a loss", ur: "صحیح البخاری 1283 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Sahih al-Bukhari 1283 — des condoléances, une consolation et la patience devant la perte", es: "Sahih al-Bukhari 1283 — condolencias, consuelo y paciencia ante la pérdida" }
text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا ثَابِتٌ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ قَالَ مَرَّ النَّبِيُّ بِامْرَأَةٍ تَبْكِي عِنْدَ قَبْرٍ فَقَالَ \" اتَّقِي اللَّهَ وَاصْبِرِي \". قَالَتْ إِلَيْكَ عَنِّي، فَإِنَّكَ لَمْ تُصَبْ بِمُصِيبَتِي، وَلَمْ تَعْرِفْهُ. فَقِيلَ لَهَا إِنَّهُ النَّبِيُّ. فَأَتَتْ باب النَّبِيِّ فَلَمْ تَجِدْ عِنْدَهُ بَوَّابِينَ فَقَالَتْ لَمْ أَعْرِفْكَ. فَقَالَ \" إِنَّمَا الصَّبْرُ عِنْدَ الصَّدْمَةِ الأُولَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1283، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1283 (Funerals (Al-Janaa'iz)), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح البخاری کی حدیث نمبر 1283، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih al-Bukhari, n° 1283, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih al-Bukhari, n.º 1283, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
