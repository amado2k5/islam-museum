text: "… باب ما جاء في أمره بالغسل للمعين وما ظهر فيه من الشفاء...... - باب ما جاء في أمره الرجل الذي شكا إليه استطلاق بطن أخيه بسقي العسل وما جعل اللّٰه - تعالى - فيه من الشفاء وليس ذلك من الطب …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3115، يذكر التداوي بالعسل، والطب والطبيب، والشكوى من العلة، وأسماء الأمراض، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 3115, that mentions honey as a remedy, medicine and the physician, a complaint of an ailment, named diseases, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 3115 کا اقتباس جس میں شہد سے علاج، طب اور طبیب، بیماری کی شکایت، بیماریوں کے نام، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen escaneado 1, pág. 3115, que menciona la miel como remedio, medicina y el médico, una queja de una dolencia, enfermedades llamadas, curación; del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Dala'il al-Nubuwwa d'al-Bayhaqi, volume 1 scanné, p. 3115, qui mentionne le miel comme remède, médicament et le médecin, une plainte d'un mal, des maladies nommées, la guérison; d'après le scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhaki'nin \"Peygamberliğin Delilleri\" adlı eserinin resimli 1. cildinin 3115. sayfasından bir alıntıda, bal ile tedavi, ilaç ve doktor, hastalıktan şikayet etme, hastalıkların isimleri ve şifadan bahsedilmektedir; bu alıntı, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian,” jilid 1 bergambar, halaman 3115, menyebutkan pengobatan dengan madu, obat-obatan dan dokter, keluhan penyakit, nama-nama penyakit, dan penyembuhan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
