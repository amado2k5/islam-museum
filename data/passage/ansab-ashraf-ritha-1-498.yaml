  tr: "Ansab al-Ashraf, 1. Cilt, 498. sayfadan, merhum için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Ansab al-Ashraf, Volume 1, halaman 498, berisi elegi dan pujian untuk almarhum; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
