text: "… في أنه إنما أحِلّ له سفكَ دم حلال في غير الحرم في تلك الساعة خاصة، إذ لو كان حلالا في كل وقت، لم يختصَّ بتلك الساعة، وهذا صريحٌ في أن الدم الحلالَ في غيرها حرامٍ فيها، فيما عدا تلك الساعة، …"
