text: "في قصة إهلاك أصحاب الفيل نصارى قريباً من عشرين أَلفاً فنجا منهم دَوْس ذو ثلعبان، فذهِب فاستغاث بقيصر ملكِ الروم وكان نصرانيا فكتب له إلى النجاشي ملك الحبشة لكونه أقرب إليهم، فبعث معه آميرين: أرياط وأبرهة بن الصباح أبا يَكسوم …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 215، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
