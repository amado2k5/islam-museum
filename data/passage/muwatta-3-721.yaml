label: { ar: "الموطأ 721 — عمر يشرب لبناً من نعم الصدقة فيدخل يده فيستقيئه", en: "Muwatta 721" }
summary:
  ar: "يرويه مالك عن زيد بن أسلم، قال: شرب عمر بن الخطاب لبناً فأعجبه، فسأل الذي سقاه من أين هذا اللبن، فأخبره أنه ورد على ماء سماه فإذا نعم من نعم الصدقة وهم يسقون، فحلبوا له من ألبانها فجعله في سقائه، فأدخل عمر يده فاستقاءه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.362}"
