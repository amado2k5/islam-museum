label: { ar: "الموطأ 721 — عمر يشرب لبناً من نعم الصدقة فيدخل يده فيستقيئه", en: "Muwatta 721", es: "Muwatta 721", fr: "Muwatta 721", ur: "موطا 721", tr: "El-Muvatta 721 — Ömer sadaka olarak verilen develerden süt içti, sonra elini içine sokup kustu.", id: "Al-Muwatta 721 — Umar meminum susu dari unta sedekah, lalu memasukkan tangannya ke dalam susu dan memuntahkannya." }
summary:
  ar: "يرويه مالك عن زيد بن أسلم، قال: شرب عمر بن الخطاب لبناً فأعجبه، فسأل الذي سقاه من أين هذا اللبن، فأخبره أنه ورد على ماء سماه فإذا نعم من نعم الصدقة وهم يسقون، فحلبوا له من ألبانها فجعله في سقائه، فأدخل عمر يده فاستقاءه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.362}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayet ettiğine göre, Ömer ibn el-Hattab biraz süt içti ve beğendi. Sütü kendisine ikram edene nereden geldiğini sordu. Adam ona, bir sulama yerine gittiğini ve sadaka sürüsünden bazı hayvanların sulandığını gördüğünü söyledi. Hayvanlardan bazılarını sağdılar ve sütü tulumuna koydular. Ömer daha sonra elini içine soktu ve kustu. Editör, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.362}"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, yang berkata: Umar ibn al-Khattab minum susu dan menyukainya. Dia bertanya kepada orang yang menyajikannya dari mana susu itu berasal. Orang itu memberitahunya bahwa dia telah datang ke tempat minum dan menemukan beberapa ternak dari kawanan amal sedang diberi minum. Mereka memerah susu beberapa hewan untuknya dan menaruh susu itu ke dalam kantung airnya. Umar kemudian memasukkan tangannya ke dalam kantung air itu dan memuntahkannya. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.362}"
