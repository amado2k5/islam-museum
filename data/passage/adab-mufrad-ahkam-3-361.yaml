text: "… الليل بالقدر، مع أنَّ هذه الصلاة نافلة، ومع احتمال أن يكون معذوراً في تلك الساعة، فكيف يكون رده مل على هؤلاء الفساق والمصرين على ترك الفرائض، وارتكابهم الموبقات إذا احتجوا بالقدر ؟ لا شك أنَّهم يكونون قد شابهوا الكفار في …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 3، ص 361، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 3, p. 361, whose wording mentions the obligation (farida), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 3، ص 361 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Adab al-Mufrad de al-Bukhari, volume numérisé 3, p. 361, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Adab al-Mufrad de al-Bukhari, volumen digitalizado 3, p. 361, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 3. cildinin 361. sayfasından, farz ve nafile amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 3, halaman 361, yang menyebutkan amalan wajib dan amalan sunnah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
