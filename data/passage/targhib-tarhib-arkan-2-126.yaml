text: "… في معى واحد والكافر في سبعة أمعاء رواه مالك والبخارى ومسلم وابن ماجه وغيرم.وفي روايللبخارى أن رجلا كان يأكل أكلا كثيرا فاسلم فكان يأ كل أكلاقد لا فذكر ذلك لوسول اللّٰه فقال إن المؤمن يأكل في معى واحد وان الكافر. …"
