text: "ذكر ذُرِّيَّة إبراهيم عليه الصلاة والسلام تمهيد قد قدمنا قصته مع قومه وما كان من أمرهم، وما آل إليه أمره عليه الصلاة والسلام والتحية والإكرام. وذكرنا ما وقع في زمانه من قصة قوم لوط، وأتبعنا ذلك بقصة مدين قوم شعيب، …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 279، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
