text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا حَاتِمُ بْنُ إِسْمَاعِيلَ، عَنْ أُنَيْسِ بْنِ أَبِي يَحْيَى، عَنْ أَبِيهِ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، قَالَ امْتَرَى رَجُلٌ مِنْ بَنِي خُدْرَةَ وَرَجُلٌ مِنْ بَنِي عَمْرِو بْنِ عَوْفٍ فِي الْمَسْجِدِ الَّذِي أُسِّسَ عَلَى التَّقْوَى فَقَالَ الْخُدْرِيُّ هُوَ مَسْجِدُ رَسُولِ اللَّهِ. وَقَالَ الآخَرُ هُوَ مَسْجِدُ قُبَاءٍ. فَأَتَيَا رَسُولَ اللَّهِ فِي ذَلِكَ فَقَالَ \" هُوَ هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 323، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 323 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 323، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 323 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
