text: "… ما يستحب للمعتكف وما يكره له يستحب للمعتكف أن يكثر من نوافل العبادات، ويشغل نفسه بالصلاة وتلاوة القرآن والتسبيح والتحميد والتهليل والتكبير والاستغفار والصلاة والسلام على النبي صلوات اللّٰه وسلامه عليه والدعاء، ونحو ذلك من الطاعات التي تقرب إلى اللّٰه …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 484، يرد فيه ذكر الطاعات، والمستحب، والنافلة والنوافل، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 484, whose wording mentions the acts of obedience, the recommended (mustahabb), the supererogatory (nafila), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 484 کا اقتباس جس میں طاعات، مستحب، نفل اور نوافل، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fiqh al-Sunna de Sayyid Sabiq, volume numérisé 4, p. 484, dont le texte mentionne les actes d'obéissance, le recommandé (mustahabb), le surérogatoire (nafila), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen digitalizado 4, p. 484, cuyo texto menciona los actos de obediencia, lo recomendado (mustahabb), lo supererogatorio (nafila), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 4. cildinin 484. sayfasından, farz olan ameller, müstehap olan ameller, nafile ameller ve mekruh olan ameller konusunu ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, müstehap olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 4, halaman 484, yang membahas tentang amalan ketaatan, amalan anjuran, amalan sunnah, dan amalan makruh; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
