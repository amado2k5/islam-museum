label: { ar: "الموطأ 360 — في مرضه يجلس إلى جنب أبي بكر والناس يصلون بصلاة أبي بكر", en: "Muwatta 360" }
text: "فكان أبو بكر يصلي بصلاة رسول الله، وكان الناس يصلون بصلاة أبي بكر"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، في باب صلاة الإمام وهو جالس: خرج النبي في مرضه فوجد أبا بكر قائماً يصلي بالناس، فاستأخر أبو بكر فأشار إليه النبي أن يبقى كما هو، فجلس النبي إلى جنب أبي بكر، فكان أبو بكر يصلي بصلاة النبي والناس يصلون بصلاة أبي بكر. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي في الرسالة، وينقل عن ابن عبد البر أنه لم يُختلف عن مالك في إرساله وأن حماد بن سلمة وابن نمير وأبا أسامة أسندوه عن هشام عن أبيه عن عائشة (التمهيد 22/315)، ويذكر ما قاله ابن حجر في الفتح عن وصل البخاري له، ويرى أن الثابت من رواية مالك إرساله وأنه روي من غير طريقه موصولاً. {cite:muwatta-maruf-1997 p.197}"
