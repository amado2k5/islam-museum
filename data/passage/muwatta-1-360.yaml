label: { ar: "الموطأ 360 — في مرضه يجلس إلى جنب أبي بكر والناس يصلون بصلاة أبي بكر", en: "Muwatta 360", es: "360 grados", fr: "360 degrés", ur: "360 ڈگری", tr: "El-Muvatta 360 — Hastalığı sırasında Ebu Bekir'in yanına oturdu ve insanlar Ebu Bekir'in namazından sonra namaz kıldılar.", id: "Al-Muwatta 360 — Selama sakitnya, dia duduk di sebelah Abu Bakr, dan orang-orang shalat mengikuti shalat Abu Bakr." }
text: "فكان أبو بكر يصلي بصلاة رسول الله، وكان الناس يصلون بصلاة أبي بكر"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه مرسلاً، في باب صلاة الإمام وهو جالس: خرج النبي في مرضه فوجد أبا بكر قائماً يصلي بالناس، فاستأخر أبو بكر فأشار إليه النبي أن يبقى كما هو، فجلس النبي إلى جنب أبي بكر، فكان أبو بكر يصلي بصلاة النبي والناس يصلون بصلاة أبي بكر. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي في الرسالة، وينقل عن ابن عبد البر أنه لم يُختلف عن مالك في إرساله وأن حماد بن سلمة وابن نمير وأبا أسامة أسندوه عن هشام عن أبيه عن عائشة ⁦(التمهيد 22/315)⁩، ويذكر ما قاله ابن حجر في الفتح عن وصل البخاري له، ويرى أن الثابت من رواية مالك إرساله وأنه روي من غير طريقه موصولاً. {cite:muwatta-maruf-1997 p.197}"
  tr: "Malik, imamın oturarak namaz kılması bölümünde, Hişam ibn Urve'den, o da babasından rivayetle, mursal bir hadis olarak şöyle nakletmiştir: Peygamberimiz hastalığı sırasında dışarı çıktı ve Ebu Bekir'i ayakta namaz kıldırırken buldu. Ebu Bekir geriye çekildi, ancak Peygamberimiz ona olduğu yerde kalmasını işaret etti. Bunun üzerine Peygamberimiz Ebu Bekir'in yanına oturdu ve Ebu Bekir, Peygamberimizin namazından sonra namaz kıldırdı; cemaat de Ebu Bekir'in namazını kıldı. Araştırmacı, Ebu Mus'ab ve Şafiî'nin bunu Malik'ten Risalah'ta naklettiğini belirtiyor. İbn Abdül-Barr'ın, Malik'in mursal rivayeti konusunda ihtilaf olmadığını ve Hammad ibn Seleme, İbn Numeyr ve Ebu Usame'nin bunu Hişam'dan, o da babasından, o da Aişe'den rivayetle naklettiğini söylediğini aktarıyor (el-Temhid 22/315). İbn Hacer'in el-Feth'te el-Buhari'nin bunu ilişkilendirmesi hakkında söylediklerinden bahseder ve Malik'ten gelen nakledilen rivayetin mursal olduğuna ve başka isnad zincirleriyle de rivayet edildiğine inanır. {cite:muwatta-maruf-1997 s.197}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, dari ayahnya, sebagai hadits mursal, dalam surah tentang imam yang salat sambil duduk: Nabi keluar saat sakit dan mendapati Abu Bakr berdiri dan memimpin salat orang-orang. Abu Bakr mundur, tetapi Nabi memberi isyarat kepadanya untuk tetap di tempatnya. Kemudian Nabi duduk di samping Abu Bakr, dan Abu Bakr memimpin salat setelah salat Nabi, sementara orang-orang mengikuti salat Abu Bakr. Peneliti menyebutkan bahwa Abu Mus'ab dan al-Shafi'i meriwayatkannya dari Malik dalam al-Risalah. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa tidak ada perbedaan pendapat mengenai riwayat mursal Malik, dan bahwa Hammad ibn Salamah, Ibnu Numayr, dan Abu Usamah meriwayatkannya dengan sanad dari Hisham, dari ayahnya, dari Aisyah (al-Tamhid 22/315). Ia menyebutkan apa yang dikatakan Ibnu Hajar dalam al-Fath tentang al-Bukhari yang menghubungkannya, dan ia meyakini bahwa riwayat yang sahih dari Malik adalah bahwa riwayat tersebut mursal, dan diriwayatkan dengan sanad pada sanad-sana lainnya. {cite:muwatta-maruf-1997 p.197}"
