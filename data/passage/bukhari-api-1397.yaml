label: { ar: "صحيح البخاري 1397 — الصلاة والزكاة والصوم والحج مجتمعة", en: "Sahih al-Bukhari 1397 — the prayer, the zakat, the fast and the pilgrimage named together", ur: "صحیح بخاری 1397 — نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Sahih al-Bukhari 1397 — la oración, el zakat, el ayuno y la peregrinación mencionados juntos" }
text: "… عَلَى عَمَلٍ إِذَا عَمِلْتُهُ دَخَلْتُ الْجَنَّةَ. قَالَ \" تَعْبُدُ اللَّهَ لاَ تُشْرِكُ بِهِ شَيْئًا، وَتُقِيمُ الصَّلاَةَ الْمَكْتُوبَةَ، وَتُؤَدِّي الزَّكَاةَ الْمَفْرُوضَةَ، وَتَصُومُ رَمَضَانَ \". قَالَ وَالَّذِي نَفْسِي بِيَدِهِ لاَ أَزِيدُ عَلَى هَذَا. فَلَمَّا وَلَّى قَالَ النَّبِيُّ \" مَنْ سَرَّهُ أَنْ يَنْظُرَ إِلَى رَجُلٍ مِنْ أَهْلِ الْجَنَّةِ فَلْيَنْظُرْ إِلَى هَذَا \". حَدَّثَنَا مُسَدَّدٌ، عَنْ يَحْيَى، عَنْ أَبِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1397، يذكر الصلاة والزكاة والصوم والحج مجتمعة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 1397 (Obligatory Charity Tax (Zakat)), that mentions the prayer, the zakat, the fast and the pilgrimage named together. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 1397، جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1397 (Impuesto obligatorio sobre la caridad (Zakat)), menciona la oración, el zakat, el ayuno y la peregrinación en conjunto. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
