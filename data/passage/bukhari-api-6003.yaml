text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا عَارِمٌ، حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، يُحَدِّثُ عَنْ أَبِيهِ، قَالَ سَمِعْتُ أَبَا تَمِيمَةَ، يُحَدِّثُ عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ، يُحَدِّثُهُ أَبُو عُثْمَانَ عَنْ أُسَامَةَ بْنِ زَيْدٍما كَانَ رَسُولُ اللَّهِ يَأْخُذُنِي فَيُقْعِدُنِي عَلَى فَخِذِهِ، وَيُقْعِدُ الْحَسَنَ عَلَى فَخِذِهِ الأُخْرَى، ثُمَّ يَضُمُّهُمَا ثُمَّ يَقُولُ \" اللَّهُمَّ ارْحَمْهُمَا فَإِنِّي أَرْحَمُهُمَا \". وَعَنْ عَلِيٍّ، قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6003، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6003 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6003، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
