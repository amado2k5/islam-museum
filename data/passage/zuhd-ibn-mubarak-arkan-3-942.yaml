text: "… لا يشبع المؤمن دون جاره عباية بن رافع أو قال الرجل دون جاره لا يغرن الرجل من نفسه الحسن كثرة الناس حوله • لا يؤمن عبد حتى يأمن أبو هريرة جاره بوائقه لا يهلك قوم - أو نحو هذا أبو …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 942، يذكر ما لا يتم الإيمان إلا به، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 942, that mentions what faith is not complete without, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 942 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ibn al-Mubarak, volumen 3, pág. 942, que menciona lo que le falta a la fe: una descripción del creyente. El texto, extraído de la lectura automática, se cita con un máximo de cuarenta palabras, según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye en su lista."
  fr: "Un extrait du Kitab al-Zuhd d'Ibn al-Mubarak (tome 3, p. 942) mentionne ce qui est indispensable à la foi: une description du croyant. Ce passage, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 942. sayfasından bir alıntı, tam bir iman için gerekli olan unsurları ve müminin özelliklerini anlatmaktadır. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Mubarak, \"Al-Zuhd\" (Asketisme), Jilid 3, halaman 942, menyebutkan apa yang penting untuk keimanan yang sempurna dan menggambarkan seorang mukmin. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
