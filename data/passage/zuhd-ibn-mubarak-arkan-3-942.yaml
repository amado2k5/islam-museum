text: "… لا يشبع المؤمن دون جاره عباية بن رافع أو قال الرجل دون جاره لا يغرن الرجل من نفسه الحسن كثرة الناس حوله • لا يؤمن عبد حتى يأمن أبو هريرة جاره بوائقه لا يهلك قوم - أو نحو هذا أبو …"
