label: { ar: "الموطأ 157 — فاطمة بنت أبي حبيش: إنما ذلك عرق وليست بالحيضة", en: "Muwatta 157", es: "Muwatta 157", fr: "Muwatta 157", ur: "موطا 157", tr: "El-Muvatta 157 — Fatıma bint Ebi Hubeyş: Bu sadece bir damardır, hayız değil", id: "Al-Muwatta 157 — Fathimah binti Abi Hubaysh: Itu hanyalah urat nadi dan bukan haid" }
text: "إنما ذلك عرق وليست بالحيضة، فإذا أقبلت الحيضة فاتركي الصلاة، فإذا ذهب قدرها فاغسلي الدم عنك وصلي"
summary:
  ar: "أول حديث في باب المستحاضة. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة: شكت فاطمة بنت أبي حبيش إلى النبي أنها لا تطهر وسألته أتدع الصلاة، فأخبرها أن ذلك دم عرق لا حيض، وأمرها أن تترك الصلاة إذا أقبلت الحيضة، فإذا مضى قدرها غسلت الدم وصلت. ويخرّجه المحقق عند البخاري (306) وأبي داود (283) والنسائي (1/124) وابن حبان (1350) والدارقطني والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (22/102). {cite:muwatta-maruf-1997 p.106} {cite:muwatta-maruf-1997 p.107}"
  tr: "Düzensiz kanama bölümündeki ilk hadis. Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından, o da Aişe'den rivayet etmiştir: Fatıma bint Ebu Hubeyş, Peygamberimize temizlenmediğinden şikayet etmiş ve namazı bırakıp bırakmaması gerektiğini sormuştur. Peygamberimiz ona bunun adet kanaması değil, damardan gelen kan olduğunu söylemiş ve adetinin başladığı zaman namazı bırakmasını, adetinin bittiği zaman ise kanı yıkayıp namaz kılmasını tavsiye etmiştir. Araştırmacı, bu hadisi Buhari (306), Ebu Davud (283), Nesai (1/124), İbn Hibban (1350), Darakunni ve Şafiî'nin hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiş ve Temhid'e (22/102) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.106} {cite:muwatta-maruf-1997 s.107}"
  id: "Hadits pertama dalam bab tentang pendarahan tidak teratur. Diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya, dari Aisyah: Fatimah binti Abi Hubaysh mengeluh kepada Nabi bahwa ia tidak kunjung suci dan bertanya apakah ia harus berhenti shalat. Beliau memberitahunya bahwa itu adalah darah dari pembuluh darah, bukan haid, dan menyuruhnya untuk berhenti shalat ketika haidnya dimulai, dan setelah masa haidnya berakhir, untuk membersihkan darah tersebut dan shalat. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (306), Abu Dawud (283), al-Nasa'i (1/124), Ibn Hibban (1350), al-Daraqutni, dan al-Shafi'i melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/102). {kutip:muwatta-maruf-1997 hal.106} {kutip:muwatta-maruf-1997 hal.107}"
