label: { ar: "الموطأ 157 — فاطمة بنت أبي حبيش: إنما ذلك عرق وليست بالحيضة", en: "Muwatta 157" }
text: "إنما ذلك عرق وليست بالحيضة، فإذا أقبلت الحيضة فاتركي الصلاة، فإذا ذهب قدرها فاغسلي الدم عنك وصلي"
summary:
  ar: "أول حديث في باب المستحاضة. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة: شكت فاطمة بنت أبي حبيش إلى النبي أنها لا تطهر وسألته أتدع الصلاة، فأخبرها أن ذلك دم عرق لا حيض، وأمرها أن تترك الصلاة إذا أقبلت الحيضة، فإذا مضى قدرها غسلت الدم وصلت. ويخرّجه المحقق عند البخاري (306) وأبي داود (283) والنسائي (1/124) وابن حبان (1350) والدارقطني والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (22/102). {cite:muwatta-maruf-1997 p.106} {cite:muwatta-maruf-1997 p.107}"
