text: "… حكماء العرب، ومن كبار خطبائهم، في الجاهلية. كان أسقف نجران، ويقال: إنه أول عربى خطب متوكهاً على سيف أو عصا، وأول من قال في كلامه أما بعد. وكاز يقد على قيصر الروم، زائراً، فيكرمه ويعظمه. وهو معدود في المعمرين، طالت …"
