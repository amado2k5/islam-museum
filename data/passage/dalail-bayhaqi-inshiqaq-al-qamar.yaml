ref: "p. 262"
label: { ar: "دلائل النبوة للبيهيقي — انشقاق القمر", en: "Bayhaqi's Dala'il al-Nubuwwa — the moon's splitting", ur: "بیہقی کی دلائل نبوت — چاند کا شق ہونا" }
text: "إن أهل مكة سألوا رسول الله أن يريهم آية فأراهم انشقاق القمر مرتين"
summary:
  ar: "يفتتح البيهيقي باب معجزات مكة بسؤال المشركين أن يريهم آية، فيروي بإسناد متصل عن أنس بن مالك أن أهل مكة سألوا النبي أن يريهم آية فأراهم انشقاق القمر مرتين، ويذكر أن البخاري أخرجه في كتاب المناقب عن عبد الله بن محمد، ومسلم عن زهير بن حرب، كلاهما عن يونس بن محمد، ويعقب بأسانيد أخرى منها رواية عبد الله بن مسعود: «انشق القمر على عهد رسول الله فرقتين فقال: اشهدوا». ويضع المؤلف هذه الآية في صدر دلالات النبوة على صدق الرسالة."
  en: "Al-Bayhaqi opens his Meccan proofs with the polytheists' demand for a sign: on the authority of Anas ibn Malik the people of Mecca asked the Prophet to show them a sign and he showed them the moon splitting in two, twice. He notes that al-Bukhari and Muslim both transmit it through Yunus ibn Muhammad, adds the Ibn Mas'ud report that the moon split in two in the Prophet's time, and frames the verse on the moon's splitting as a standing proof of the mission."
  ur: "بیہقی اپنی کتاب کے مکی دلائل کی شروعات اس واقعے سے کرتا ہے کہ کفار نے ایک نشانی طلب کی: انس بن مالک سے روایت ہے کہ مکہ والوں نے نبی سے کہا کہ ہمیں کوئی نشانی دکھاؤ تو اس نے چاند کو دو بار دو ٹکڑوں میں منقسم دکھایا۔ وہ بتاتا ہے کہ بخاری نے کتاب المناقب میں اور مسلم نے یونس بن محمد کے راستے سے اسے روایت کیا، اور ابن مسعود کی روایت بھی دیتا ہے کہ اس زمانے میں چاند دو حصوں میں تقسیم ہو گیا۔"
