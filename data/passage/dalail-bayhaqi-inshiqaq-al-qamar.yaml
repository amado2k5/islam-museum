label: { ar: "دلائل النبوة للبيهيقي — انشقاق القمر", en: "Bayhaqi's Dala'il al-Nubuwwa — the moon's splitting", ur: "بیہقی کی دلائل نبوت — چاند کا شق ہونا", es: "Dala'il al-Nubuwwa de Bayhaqi: la luna se parte", fr: "Dala'il al-Nubuwwa de Bayhaqi - la division de la lune", tr: "El-Beyhakî'nin Peygamberlik Alametleri - Ayın Yarılması", id: "Tanda-Tanda Kenabian oleh Al-Bayhaqi — Terbelahnya Bulan" }
text: "إن أهل مكة سألوا رسول الله أن يريهم آية فأراهم انشقاق القمر مرتين"
summary:
  ar: "يفتتح البيهيقي باب معجزات مكة بسؤال المشركين أن يريهم آية، فيروي بإسناد متصل عن أنس بن مالك أن أهل مكة سألوا النبي أن يريهم آية فأراهم انشقاق القمر مرتين، ويذكر أن البخاري أخرجه في كتاب المناقب عن عبد الله بن محمد، ومسلم عن زهير بن حرب، كلاهما عن يونس بن محمد، ويعقب بأسانيد أخرى منها رواية عبد الله بن مسعود: «انشق القمر على عهد رسول الله فرقتين فقال: اشهدوا». ويضع المؤلف هذه الآية في صدر دلالات النبوة على صدق الرسالة."
  en: "Al-Bayhaqi opens his Meccan proofs with the polytheists' demand for a sign: on the authority of Anas ibn Malik the people of Mecca asked the Prophet to show them a sign and he showed them the moon splitting in two, twice. He notes that al-Bukhari and Muslim both transmit it through Yunus ibn Muhammad, adds the Ibn Mas'ud report that the moon split in two in the Prophet's time, and frames the verse on the moon's splitting as a standing proof of the mission."
  ur: "بیہقی اپنی کتاب کے مکی دلائل کی شروعات اس واقعے سے کرتا ہے کہ کفار نے ایک نشانی طلب کی: انس بن مالک سے روایت ہے کہ مکہ والوں نے نبی سے کہا کہ ہمیں کوئی نشانی دکھاؤ تو اس نے چاند کو دو بار دو ٹکڑوں میں منقسم دکھایا۔ وہ بتاتا ہے کہ بخاری نے کتاب المناقب میں اور مسلم نے یونس بن محمد کے راستے سے اسے روایت کیا، اور ابن مسعود کی روایت بھی دیتا ہے کہ اس زمانے میں چاند دو حصوں میں تقسیم ہو گیا۔"
  es: "Al-Bayhaqi inicia sus pruebas de La Meca con la petición de los politeístas de una señal: según Anas ibn Malik, los habitantes de La Meca pidieron al Profeta que les mostrara una señal, y él les mostró la luna partiéndose en dos, dos veces. Señala que tanto al-Bujari como Muslim la transmiten a través de Yunus ibn Muhammad, añade el relato de Ibn Mas'ud que afirma que la luna se partió en dos en tiempos del Profeta, y presenta el versículo sobre la división de la luna como una prueba irrefutable de la misión."
  fr: "Al-Bayhaqi ouvre son exposé des preuves mecquoises par la demande d'un signe formulée par les polythéistes: selon Anas ibn Malik, les habitants de La Mecque demandèrent au Prophète de leur montrer un signe, et celui-ci leur montra la lune se fendant en deux, à deux reprises. Il note qu'al-Bukhari et Muslim rapportent tous deux cet événement par l'intermédiaire de Yunus ibn Muhammad, ajoute le récit d'Ibn Mas'ud selon lequel la lune se fendit en deux du temps du Prophète, et présente le verset relatif à la division de la lune comme une preuve irréfutable de la mission."
  tr: "El-Beyhaki, Mekke mucizeleri bölümüne, müşriklerin bir işaret istemesiyle başlar. Enes ibn Malik'ten, kesintisiz bir rivayet zinciriyle, Mekke halkının Peygamber'den kendilerine bir işaret göstermesini istediğini ve bunun üzerine Peygamber'in onlara ayın ikiye yarıldığını gösterdiğini nakleder. Buhari'nin bunu Abdullah ibn Muhammed'den, Müslim'in ise Zuhair ibn Harb'dan, her ikisinin de Yunus ibn Muhammed'den rivayetle faziletler kitabına dahil ettiğini belirtir. Daha sonra, Abdullah ibn Mes'ud'un rivayeti de dahil olmak üzere diğer rivayet zincirlerini aktarır: \"Ay, Allah'ın Resulü zamanında ikiye ayrıldı ve o şöyle dedi: 'Şahit olun.'\" Yazar, bu işareti peygamberliğin ve mesajın doğruluğunun delillerinin en ön safına yerleştirir."
  id: "Al-Bayhaqi membuka bab tentang mukjizat Mekah dengan menceritakan permintaan kaum musyrik untuk sebuah tanda. Ia meriwayatkan, dengan rantai periwayatan yang berkesinambungan, dari Anas ibn Malik bahwa penduduk Mekah meminta Nabi untuk menunjukkan kepada mereka sebuah tanda, lalu beliau menunjukkan kepada mereka terbelahnya bulan dua kali. Ia menyebutkan bahwa al-Bukhari memasukkannya dalam kitab keutamaannya berdasarkan riwayat Abdullah ibn Muhammad, dan Muslim berdasarkan riwayat Zuhair ibn Harb, keduanya berdasarkan riwayat Yunus ibn Muhammad. Kemudian ia melanjutkan dengan rantai periwayatan lainnya, termasuk riwayat Abdullah ibn Mas'ud: \"Bulan terbelah menjadi dua pada masa Rasulullah, dan beliau bersabda: 'Bersaksilah.'\" Penulis menempatkan tanda ini di garis depan bukti kenabian dan kebenaran risalah."
