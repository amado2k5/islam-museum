label: { ar: "مسلم 186 — آخر أهل النار خروجاً منها", en: "Muslim 186 — The last to come out of the Fire" }
text: "قال عبد الله بن مسعود: قال رسول الله: إني لأعلم آخر أهل النار خروجاً منها وآخر أهل الجنة دخولاً الجنة، رجل يخرج من النار حبواً... فيقول الله له: اذهب فادخل الجنة فإن لك مثل الدنيا وعشرة أمثالها، فيقول: أتسخر بي وأنت الملك؟ قال: لقد رأيت رسول الله ضحك حتى بدت نواجذه، وكان يقال: ذاك أدنى أهل الجنة منزلة"
summary:
  ar: "رواية عبد الله بن مسعود في باب الشفاعة وإخراج الموحدين من النار من كتاب الإيمان في صحيح مسلم؛ وصف آخر الداخلين الجنة ومنزلته — عشرة أمثال الدنيا."
