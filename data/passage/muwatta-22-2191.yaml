label: { ar: "الموطأ 2191 — يحيى عن مالك: الأمر عندنا فيمن أعطى أحدا عطية لا يريد ثوابها فأشهد عليها، فإنها ثابتة للذي أعطيها، إلا أن يموت المعطي قبل أن يقبضها الذي أعطيها", en: "Muwatta 2191", es: "Muwatta 2191", fr: "Muwatta 2191", ur: "موطا 2191", tr: "El-Muvatta 2191 — Yahya, Malik'ten rivayetle: Hükmümüz şudur ki, bir kimse bir başkasına karşılığında herhangi bir ödül beklemeksizin bir hediye verirse ve şahitler varsa, hediye alan kişi hediyeyi almadan önce verenin ölmesi durumu hariç, hediye alan kişi için geçerlidir.", id: "Al-Muwatta 2191 — Yahya berdasarkan riwayat Malik: Hukum kami adalah jika seseorang memberi hadiah kepada orang lain tanpa mengharapkan imbalan apa pun, dan ada saksi, maka hadiah itu sah bagi penerima, kecuali jika pemberi meninggal sebelum penerima menerimanya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا فيمن أعطى أحدا عطية لا يريد ثوابها، فأشهد عليها، فإنها ثابتة للذي أعطيها، إلا أن يموت المعطي قبل أن يقبضها الذي أعطيها. {cite:muwatta-maruf-1997 p.299}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Hükmümüz şudur ki, bir kimse karşılık beklemeden bir başkasına hediye verirse ve şahitler varsa, veren kişi hediyeyi alan kişi almadan önce ölmedikçe, hediye alan kişi için geçerlidir. {cite:muwatta-maruf-1997 s.299}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Hukum kami adalah jika seseorang memberi hadiah kepada orang lain tanpa mengharapkan imbalan apa pun, dan ada saksi yang hadir, maka hadiah itu sah bagi penerima, kecuali jika pemberi meninggal sebelum penerima menerima hadiah tersebut. {cite:muwatta-maruf-1997 p.299}"
