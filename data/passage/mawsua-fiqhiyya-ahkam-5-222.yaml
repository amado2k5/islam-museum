text: "… ترك النكاح، وهو قول أصحاب الظواهر، لأن الاشتغال بالفرض والواجب كيف ما كان أولى من الاشتغال بالتطوع. ومن قال منهم: إنه مندوب ومستحب، فإنه يرجحه على النوافل من وجوه أخر. أحدها: أنه سنة، قال النبي الي: النكاح من سنتي، والسنن …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 5، ص 222، يرد فيه ذكر الفرض، والواجب، والمستحب، والمندوب، والنافلة والنوافل، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 5, p. 222, whose wording mentions the obligatory (fard), the obligatory (wajib), the recommended (mustahabb), the recommended (mandub), the supererogatory (nafila), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 5، ص 222 کا اقتباس جس میں فرض، واجب، مستحب، مندوب، نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 5, p. 222, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), le recommandé (mustahabb), le recommandé (mandub), le surérogatoire (nafila), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 5, p. 222, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), lo recomendado (mustahabb), lo recomendado (mandub), lo supererogatorio (nafila), el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 5, sayfa 222'den bir alıntı, farz, tavsiye edilen, müstehap, nafile ve gönüllü ibadetlerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz, tavsiye edilen ve müstehap ibadetlerin yanı sıra mekruh edilen, haram ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 5 Bergambar, halaman 222, menyebutkan ibadah wajib, anjuran, yang diinginkan, sunnah, dan sukarela. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk ibadah wajib, anjuran, dan yang diinginkan, serta dosa yang tidak disukai, dilarang, dan dosa kecil."
