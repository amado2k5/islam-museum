text: "… سلامة المسلمين من لسان العبد ويده واجبة، فإن أذى المسلم حرام باللسان وباليد، فأذى اليد: الفعل، وأذى اللسان: القول. والظاهر : أن النبي إنما وصف بهذا في هذا الحديث لأن السائل كان مسلمًا قد أتى بأركان الإسلام الواجبة لله ع، …"
summary:
