summary:
  ar: "القسم 38 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب قسم الفىء»، ويضم فيها النصوص من 4133 إلى 4148 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 38 of Sunan al-Nasa'i (The Book of Distribution of Al-Fay') in the division of the open hadith dataset the museum took its reports from: reports 4133 to 4148 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 38، عنوان «کتاب قسم الفیٰء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4133 تا 4148۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 38 de Sunan al-Nasa'i (El Libro de la Distribución de Al-Fay') corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4133 al 4148, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan al-Nasa'i (Livre de la distribution d'Al-Fay'), dans le recueil ouvert de hadiths (rapports 4133 à 4148). Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanında yer alan Sunan al-Nasa'i'nin 38. bölümü \"Savaş Ganimetleri Bölümü Kitabı\" başlığını taşımakta olup, 4133 ile 4148 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 38 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Bagian tentang Rampasan Perang\" dan berisi teks 4133 hingga 4148, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
