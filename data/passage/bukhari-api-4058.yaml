label: { ar: "صحيح البخاري 4058 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 4058 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 4058 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 4058 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sahih al-Bukhari 4058 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا مِسْعَرٌ، عَنْ سَعْدٍ، عَنِ ابْنِ شَدَّادٍ، قَالَ سَمِعْتُ عَلِيًّا ـ يَقُولُ مَا سَمِعْتُ النَّبِيَّ يَجْمَعُ أَبَوَيْهِ لأَحَدٍ غَيْرَ سَعْدٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4058، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4058 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4058، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4058 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4058 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), évoque le père et la paternité, ainsi que le devoir envers les parents et la possibilité de leur désobéissance. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
