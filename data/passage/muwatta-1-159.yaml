label: { ar: "الموطأ 159 — زينب امرأة عبد الرحمن بن عوف تستحاض فتغتسل وتصلي", en: "Muwatta 159" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة، في باب المستحاضة: رأت زينب بنت جحش التي كانت زوجة عبد الرحمن بن عوف، وكانت تستحاض، تغتسل وتصلي. والمسماة هنا هي أخت أم المؤمنين زينب بنت جحش لا أم المؤمنين، إذ تذكرها الرواية زوجةً لعبد الرحمن بن عوف. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأن ابن أبي شيبة أخرجه عن عبدة بن سليمان عن هشام. {cite:muwatta-maruf-1997 p.108}"
