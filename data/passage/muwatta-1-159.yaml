label: { ar: "الموطأ 159 — زينب امرأة عبد الرحمن بن عوف تستحاض فتغتسل وتصلي", en: "Muwatta 159", es: "Muwatta 159", fr: "Muwatta 159", ur: "موطا 159", tr: "El-Muvatta 159 — Abdülrahman ibn Avf'ın karısı Zeyneb, uzun süren kanamadan muzdarip olduğu için gusül abdesti alıp namaz kılıyor.", id: "Al-Muwatta 159 — Zainab, istri Abd al-Rahman ibn Awf, mengalami pendarahan yang berkepanjangan, sehingga ia melakukan ghusl (mandi ritual) dan shalat." }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة، في باب المستحاضة: رأت زينب بنت جحش التي كانت زوجة عبد الرحمن بن عوف، وكانت تستحاض، تغتسل وتصلي. والمسماة هنا هي أخت أم المؤمنين زينب بنت جحش لا أم المؤمنين، إذ تذكرها الرواية زوجةً لعبد الرحمن بن عوف. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأن ابن أبي شيبة أخرجه عن عبدة بن سليمان عن هشام. {cite:muwatta-maruf-1997 p.108}"
  tr: "Malik'in, Hişam ibn Urvah'tan, onun babasından, onun da Zeynep bint Ebu Seleme'den rivayet ettiği, uzun süren kanaması olan kadınlar bölümündeki bir rivayette şöyle denmektedir: Abdülrahman ibn Avf'ın karısı olan ve uzun süren kanaması olan Zeynep bint Cahş, gusül abdesti aldı ve namaz kıldı. Burada adı geçen kadın, Müminlerin Annesi'nin kız kardeşi Zeynep bint Cahş'tır, Müminlerin Annesi'nin kendisi değil; zira rivayette kendisi Abdülrahman ibn Avf'ın karısı olarak geçmektedir. Editör, Ebu Mus'ab'ın bunu Malik'ten, İbn Ebi Şeybe'nin ise Abdah ibn Süleyman'dan, onun da Hişam'dan rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.108}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, atas otoritas Zaynab bint Abi Salamah, dalam bab tentang wanita yang mengalami pendarahan berkepanjangan: Zaynab bint Jahsh, yang merupakan istri Abd al-Rahman ibn Awf dan menderita pendarahan berkepanjangan, melakukan ghusl (mandi ritual) dan shalat. Wanita yang disebutkan di sini adalah saudara perempuan Ummul Mukminin, Zaynab bint Jahsh, bukan Ummul Mukminin sendiri, karena riwayat tersebut menyebutkannya sebagai istri Abd al-Rahman ibn Awf. Editor mencatat bahwa Abu Mus'ab meriwayatkannya dari Malik, dan bahwa Ibn Abi Shaybah meriwayatkannya atas otoritas Abdah ibn Sulayman, atas otoritas Hisham. {cite:muwatta-maruf-1997 p.108}"
