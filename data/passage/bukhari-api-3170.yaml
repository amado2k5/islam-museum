label: { ar: "صحيح البخاري 3170 — القراء", en: "Sahih al-Bukhari 3170 — the readers", ur: "صحیح بخاری 3170 — قراء", es: "Sahih al-Bukhari 3170 — los lectores", fr: "Sahih al-Bukhari 3170 — les lecteurs" }
text: "… أَنَّكَ قُلْتَ بَعْدَ الرُّكُوعِ، فَقَالَ كَذَبَ. ثُمَّ حَدَّثَنَا عَنِ النَّبِيِّ أَنَّهُ قَنَتَ شَهْرًا بَعْدَ الرُّكُوعِ يَدْعُو عَلَى أَحْيَاءٍ مِنْ بَنِي سُلَيْمٍ ـ قَالَ ـ بَعَثَ أَرْبَعِينَ أَوْ سَبْعِينَ ـ يَشُكُّ فِيهِ ـ مِنَ الْقُرَّاءِ إِلَى أُنَاسٍ مِنَ الْمُشْرِكِينَ، فَعَرَضَ لَهُمْ هَؤُلاَءِ فَقَتَلُوهُمْ، وَكَانَ بَيْنَهُمْ وَبَيْنَ النَّبِيِّ عَهْدٌ، فَمَا رَأَيْتُهُ وَجَدَ عَلَى أَحَدٍ مَا وَجَدَ عَلَيْهِمْ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3170، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 3170 (Jizyah and Mawaada'ah), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 3170، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3170 (Jizyah y Mawaada'ah), menciona a los lectores. El catálogo del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sahih al-Bukhari, n° 3170 (Jizya et Mawaada'ah), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran le répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
