text: "… تغير المعاصي عن مواضعها فلا ينبغي أن يفهم الجاهل ذلك من عمومٍ قوله ل إِنَّمَا الأَعْمَالُ بِالنَّيَّاتِ فيظن أن المعصية تصير طاعة بالنية، فإذن قوله : إِنَّمَا الأَعْمَالُ بِالنَّيَّاتِ يخص من أقسام العمل الثلاثة الطاعات والمباحات دون المعاصي، إذ الطاعة …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 22، يرد فيه ذكر الطاعات، والمباح، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 22, whose wording mentions the acts of obedience, the permitted (mubah), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 22 کا اقتباس جس میں طاعات، مباح، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ahmad ibn Hanbal, volume numérisé 1, p. 22, dont le texte mentionne les actes d'obéissance, le permis (mubah), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Zuhd de Ahmad ibn Hanbal, volumen digitalizado 1, p. 22, cuyo texto menciona los actos de obediencia, lo permitido (mubah), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zühd) adlı eserinin 1. cildinin 22. sayfasından, itaat, helal ve ibadetlerden bahseden bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu bölüm, farz, görevler, ibadetler, tavsiye edilenler, mekruh edilenler, haram kılınanlar ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 1, halaman 22, yang menyebutkan amalan ketaatan, amalan yang diperbolehkan, dan amalan ibadah. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
