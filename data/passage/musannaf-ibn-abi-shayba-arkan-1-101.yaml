text: "… أن تدركوا مثلهن : لا يرج عبد إلا ربه، ولا يخف إلا ذنبه، ولا يستحيي من لا يعلم أن يتعلم، ولا يستحيي عالم إذا سئل عمالا يعلم أن يقول: اللّٰه أعلم، واعلموا أن منزلة الصبر من الايمان كمنزلة الرأس من …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 101، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 101, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 101 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 1, pág. 101, que menciona lo que se considera parte de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 1, page 101, mentionnant ce qui est considéré comme faisant partie de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 1. cildinin 101. sayfasından, imanın ne anlama geldiğini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 1, halaman 101, yang menyebutkan apa yang membentuk iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
