text: "… انحطاط رتبتها عن رواتب الفرائض. وقال ابن خزيمة في صحيحه بإثر الحديث: هذا اللفظ من أمر المباح، إذ لو لم يكن من أمر المباح، لكان أقل الأمر أن يكون سنة إن لم يكن فرضاً، ولكنه أمر إباحة، وقد كنت أعلمت …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 1، ص 458، يرد فيه ذكر الفريضة والفرائض، والفرض، والسنن المؤكدة والرواتب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 1, p. 458, whose wording mentions the obligation (farida), the obligatory (fard), the emphasised and regular sunnas, the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 1، ص 458 کا اقتباس جس میں فریضہ اور فرائض، فرض، سننِ مؤکدہ اور رواتب، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 1, p. 458, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), les sunnas appuyées et régulières, le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 1, p. 458, cuyo texto menciona la obligación (farida), lo obligatorio (fard), las sunnas enfatizadas y regulares, lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, 1. Cilt, 458. sayfadan, farz olan, tavsiye edilen, nafile olan ve caiz olan amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid 1, halaman 458, yang menyebutkan amalan wajib, amalan anjuran, amalan sunnah, dan amalan yang diperbolehkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
