label: { ar: "نوادر جحا الكبرى، ص 79 — «من يسمع كلام زوجته يستحم حاراً وبارداً»", en: "Nawadir Juha al-Kubra, p. 79 — 'Whoever Obeys His Wife Bathes Hot and Cold'", ur: "نوادر جحا الکبریٰ، ص 79 — «جو بیوی کی بات مانے وہ گرم اور ٹھنڈے دونوں سے نہاتا ہے»", fr: "Nawadir Juha al-Kubra, p. 79 — « Qui écoute sa femme se baigne chaud et froid »", es: "Nawadir Juha al-Kubra, p. 79 — «Quien escucha a su mujer se baña en caliente y en frío»" }
text: "… مَن يسمع كلام زوجته يستحمُّ حاراً وبارداً حضر يوماً إلى البيت ليتوضأ لصلاة العصر، وفيما هو مستعجل ليلحق الجماعةَ، شغلَتْهُ امرأتُهُ بأشياء تافهةٍ، ثمّ قالت له: أرى ثيابك وسخةً، فالأولى أن نستحمَّ. فوافقها. ولمَّا أراد الذهاب إلى الحمام، قالت له: …"
summary:
  ar: "أُرسل جحا إلى الحمام قبل صلاة العصر، فقالت زوجته إن عليه أن يسرع إلى عقد قران أختها؛ وفي المطر خلع عباءته ووصل عاريًا؛ فسأله الضيوف، فقال إن من يطيع زوجته يستحم حارًا وباردًا. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  en: "Juha is sent to a bathhouse before the afternoon prayer; his wife says he must hurry to her sister's wedding contract; in the rain he takes off his robe, and arrives naked; the guests ask, and he says whoever obeys his wife bathes hot and cold. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  ur: "جحا کو عصر کی نماز سے پہلے حمام بھیجا گیا؛ بیوی نے کہا کہ جلدی کرو، میری بہن کا نکاح ہے؛ بارش میں اس نے اپنا جبہ اتار دیا اور برہنہ پہنچا؛ مہمانوں نے پوچھا تو اس نے کہا کہ جو بیوی کی مانتا ہے وہ گرم اور ٹھنڈے دونوں سے نہاتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  fr: "On envoie Juha au bain avant la prière de l'après-midi; sa femme dit qu'il doit se hâter pour le contrat de mariage de sa sœur; sous la pluie, il ôte sa robe et arrive nu; les invités l'interrogent, et il dit que celui qui obéit à sa femme se baigne chaud et froid. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
  es: "Envían a Juha al baño antes de la oración de la tarde; su mujer dice que debe darse prisa para el contrato de boda de su hermana; bajo la lluvia se quita la túnica y llega desnudo; los invitados le preguntan, y él dice que quien obedece a su mujer se baña en caliente y en frío. {cite:juha-nawadir-kubra-djuwaydi p. 79}"
