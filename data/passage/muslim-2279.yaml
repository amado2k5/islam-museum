label: { ar: "مسلم 2279 — نبع الماء من بين أصابع النبي", en: "Muslim 2279 — Water flowing from between the Prophet's fingers", es: "Muslim 2279 — Agua que brota entre los dedos del Profeta", fr: "Muslim 2279 — L'eau qui coule entre les doigts du Prophète", ur: "مسلم 2279 - نبی کی انگلیوں کے درمیان سے بہتا ہوا پانی", tr: "Müslim 2279 — Peygamberin parmaklarının arasından su fışkırdı.", id: "Muslim 2279 — Air menyembur keluar dari sela-sela jari Nabi" }
text: "أتي رسول الله بوضوء فوضع في ذلك الإناء يده وأمر الناس أن يتوضؤوا منه؛ قال أنس: فرأيت الماء ينبع من تحت أصابعه فتوضأ الناس حتى توضئوا من عند آخرهم"
summary:
  ar: "رواية أنس بن مالك في باب معجزات النبي من كتاب الفضائل بصحيح مسلم؛ نبع الماء من بين أصابع النبي حتى توضأ منه القوم — من أشهر نصوص المعجزات المحسوسة في الدواوين."
  tr: "Sahih Müslim'in Faziletler Kitabı'ndaki Peygamberin Mucizeleri bölümünde Enes bin Malik'in rivayetine göre; Peygamberin parmaklarının arasından su fışkırmış ve insanlar bu suyla abdest almışlardır. Bu, Divanlardaki en ünlü somut mucizelerden biridir."
  id: "Riwayat Anas bin Malik dalam bab tentang mukjizat Nabi dari Kitab Keutamaan dalam Sahih Muslim; air menyembur dari antara jari-jari Nabi hingga orang-orang berwudhu dengannya — salah satu teks mukjizat nyata yang paling terkenal dalam kitab-kitab suci."
