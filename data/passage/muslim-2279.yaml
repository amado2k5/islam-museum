text: "أتي رسول الله بوضوء فوضع في ذلك الإناء يده وأمر الناس أن يتوضؤوا منه؛ قال أنس: فرأيت الماء ينبع من تحت أصابعه فتوضأ الناس حتى توضئوا من عند آخرهم"
summary:
