text: "… ظننت أنك أنا اجتمع يوماً بشخص، لم تسبق له به معرفة، فأخذ يُحادِثُهُ جحا، كأنهما صديقان قديمان. ولما همَّ الرجل بالانصراف سأله جحا : عفواً يا سيِّدي إني لم أعرف حضرتك، فمن أنت؟ قال الرجل: وكيف تُحدِّثُني بدون تكلَّفٍ كأنَّ …"
summary:
  ar: "خاطب جحا غريبًا كأنه صديق قديم لأن عمامته وقفطانه بدوَا له مثل عمامته وقفطانه. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  en: "Juha talks to a stranger as if to an old friend, because the stranger's turban and kaftan look like his own. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  ur: "جحا نے ایک اجنبی سے یوں بات کی جیسے وہ پرانا دوست ہو، کیونکہ اجنبی کی پگڑی اور قبا اسے اپنی پگڑی اور قبا جیسی لگی۔ {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  fr: "Juha s'adresse à un inconnu comme à un vieil ami parce que le turban et le caftan de l'inconnu ressemblent aux siens. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
  es: "Juha habla con un desconocido como con un viejo amigo porque el turbante y el caftán del desconocido se parecen a los suyos. {cite:juha-nawadir-kubra-djuwaydi p. 18}"
