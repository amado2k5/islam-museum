text: "إليه كيف، وهو أمي لا يقرأ، قال: فعلمها رسول الله 98، فقال: هذا كتاب من رب العالمين بأسماء أهل الجنة، وأسماء قبائلهم لا يزاد منهم، ولا ينقص منهم، وقال: (فريق في الجنة، وفريق في السعير) فرغ ربكم من أعمال العباد»."
