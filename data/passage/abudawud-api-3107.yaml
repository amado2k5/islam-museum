label: { ar: "سنن أبي داود 3107 — المرض والمريض، عيادة المريض", en: "Sunan Abi Dawud 3107 — illness and the sick; visiting the sick", ur: "سنن ابی داؤد 3107 — بیماری اور بیمار، بیمار کی عیادت", es: "Sunan Abi Dawud 3107 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sunan Abi Dawud 3107 — la maladie et les malades; la visite aux malades", tr: "Sunan Abi Dawud 3107 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sunan Abi Dawud 3107 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "حَدَّثَنَا يَزِيدُ بْنُ خَالِدٍ الرَّمْلِيُّ، حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ حُيَىِّ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ الْحُبُلِيِّ، عَنِ ابْنِ عَمْرٍو، قَالَ قَالَ النَّبِيُّ \" إِذَا جَاءَ الرَّجُلُ يَعُودُ مَرِيضًا فَلْيَقُلِ اللَّهُمَّ اشْفِ عَبْدَكَ يَنْكَأُ لَكَ عَدُوًّا أَوْ يَمْشِي لَكَ إِلَى جَنَازَةٍ \". قَالَ أَبُو دَاوُدَ وَقَالَ ابْنُ السَّرْحِ \" إِلَى صَلاَةٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3107، يذكر المرض والمريض، وعيادة المريض، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3107 (Funerals (Kitab Al-Jana'iz)), that mentions illness and the sick, visiting the sick, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3107، جس میں بیماری اور بیمار، بیمار کی عیادت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3107 (Funerales (Kitab Al-Jana'iz)), menciona la enfermedad y los enfermos, la visita a los enfermos y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3107 (Les Funérailles), évoque la maladie, les malades, les visites aux malades et la guérison. Le Répertoire des textes médicaux le classe parmi les ouvrages traitant de médecine prophétique, de médecine, d'anatomie, de chirurgie, de médicaments et de traitements."
  tr: "Sunan Ebu Davud'da yer alan 3107 numaralı hadiste hastalık, hasta, hasta ziyareti ve iyileşmeden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3107, menyebutkan tentang penyakit, orang sakit, mengunjungi orang sakit, dan kesembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
