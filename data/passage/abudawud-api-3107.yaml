label: { ar: "سنن أبي داود 3107 — المرض والمريض، عيادة المريض", en: "Sunan Abi Dawud 3107 — illness and the sick; visiting the sick", ur: "سنن ابی داؤد 3107 — بیماری اور بیمار، بیمار کی عیادت" }
text: "حَدَّثَنَا يَزِيدُ بْنُ خَالِدٍ الرَّمْلِيُّ، حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ حُيَىِّ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ الْحُبُلِيِّ، عَنِ ابْنِ عَمْرٍو، قَالَ قَالَ النَّبِيُّ \" إِذَا جَاءَ الرَّجُلُ يَعُودُ مَرِيضًا فَلْيَقُلِ اللَّهُمَّ اشْفِ عَبْدَكَ يَنْكَأُ لَكَ عَدُوًّا أَوْ يَمْشِي لَكَ إِلَى جَنَازَةٍ \". قَالَ أَبُو دَاوُدَ وَقَالَ ابْنُ السَّرْحِ \" إِلَى صَلاَةٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3107، يذكر المرض والمريض، وعيادة المريض، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3107 (Funerals (Kitab Al-Jana'iz)), that mentions illness and the sick, visiting the sick, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3107، جس میں بیماری اور بیمار، بیمار کی عیادت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
