text: "… أبو عمرو بألف بعد الشين لفظاً حالة الوصل، وقرأ الباقون بحذفها في الموضعين واتفقوا على الحذف وقفاً اتباعاً لرسم المصحف. انظر: الإقناع، النشر قرأ نافع وأبو جعفر وابن كثير وأبو عمرو الْكَفِرُ على التوحيد، وقرأ الباقون الْكُفَّرُ على الجمع. انظر: …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2231، يذكر قراءات القرآن، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2231, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2231 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 3, pág. 2231, que menciona las lecturas del Corán, la recopilación del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
