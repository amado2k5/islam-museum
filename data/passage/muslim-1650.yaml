label: { ar: "مسلم 1650 — لا تسأل الإمارة وكفّر عن يمينك", en: "Muslim 1650 — Do not ask for authority; expiate your oath", es: "Musulmán 1650 — No pidas autoridad; expía tu juramento.", fr: "Muslim 1650 — Ne réclamez pas d'autorité; expiez votre serment", ur: "مسلم 1650 - اختیار نہ مانگو۔ اپنی قسم کا کفارہ کرو", tr: "Müslim 1650 — Emirliği istemeyin ve yemininizi bozun.", id: "Muslim 1650 — Jangan meminta emirat dan tebuslah sumpahmu" }
text: "قال عبد الرحمن بن سمرة: قال لي رسول الله: يا عبد الرحمن بن سمرة لا تسأل الإمارة، فإنك إن أعطيتها عن مسألة وكلت إليها وإن أعطيتها عن غير مسألة أعنت عليها، وإذا حلفت على يمين فرأيت غيرها خيراً منها فكفر عن يمينك وأت الذي هو خير"
summary:
  ar: "رواية عبد الرحمن بن سمرة في باب استحباب التكفير عن اليمين وفعل الخير منها من كتاب الأيمان في صحيح مسلم؛ وصيتان مشهورتان: ترك طلب الإمارة والإتيان بالخير من اليمين مع الكفارة."
  tr: "Sahih Müslim'deki Yeminler Kitabı'nda, yeminin kefaretini ödemenin ve ondan dolayı iyi ameller işlemenin müstehap olduğu bölümünde Abdurrahman ibn Samura'nın rivayetine göre, iki meşhur tavsiye vardır: Liderlik talebinden vazgeçmek ve kefaretle birlikte yeminden dolayı iyi ameller işlemek."
  id: "Riwayat Abd al-Rahman ibn Samura dalam bab tentang anjuran menebus sumpah dan melakukan amal saleh darinya, dari Kitab Sumpah dalam Sahih Muslim; dua anjuran terkenal: meninggalkan permintaan kepemimpinan dan melakukan amal saleh dari sumpah bersamaan dengan penebusan."
