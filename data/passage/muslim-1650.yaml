label: { ar: "مسلم 1650 — لا تسأل الإمارة وكفّر عن يمينك", en: "Muslim 1650 — Do not ask for authority; expiate your oath" }
text: "قال عبد الرحمن بن سمرة: قال لي رسول الله: يا عبد الرحمن بن سمرة لا تسأل الإمارة، فإنك إن أعطيتها عن مسألة وكلت إليها وإن أعطيتها عن غير مسألة أعنت عليها، وإذا حلفت على يمين فرأيت غيرها خيراً منها فكفر عن يمينك وأت الذي هو خير"
summary:
  ar: "رواية عبد الرحمن بن سمرة في باب استحباب التكفير عن اليمين وفعل الخير منها من كتاب الأيمان في صحيح مسلم؛ وصيتان مشهورتان: ترك طلب الإمارة والإتيان بالخير من اليمين مع الكفارة."
