text: |-
  ٤٠٨
  عنى عند الحدث ورجل لعنة يلعن الناس كشيرا ولعنة بالتسكين يلعنه الناس ⁦(لغن )⁩
  للغنون لغة فى اللغدود والمسع اللغانين وبعض بن قيم يقول لغذك بمعنى لعلد قال الفرزدو
  قفايا صاحى بنااغنا • نرى العرصات أو أثز الخيام
  ( ن لقنت الكلام بالكسرفهمته لقنا وتلقنته أخذته لقانية والتطقين كالتفهيم وغلام
  لقن سريع الفه-م والاسم اللقانة ⁦(لكن)⁩ اللكنة عجمة فى الدان وعىّ يقال رجل
  ألكن بين اللكن والكن خفيفة وثقيلة حرف عطف للاستدراك والتحقيق يوجبيم ابعد
  أفى الا أن الثقيلة تعمل عمل ان تنصب الاسم وترفع الخبر ويستدرك بهابعد النوى والايجاب
  تقول ماجاءنى زيدامكن عمر اقد باء وما تسكلم زيدلكنّ عمراقد تكلم واتخفيفة لا تعمل لانها
  تقع على الاسماء والافعال وتقع أيضابعد النقى اذا اتدأت بمابه-دها تقول جاءنى القوم
  لكن عمرولم يجىّ فترفع ولا يجوز أن تقول لكن عمر ووتسكت حق تأن يجملة تامة فاما ان
  كانت عاطفة اسماء فرداعلى اسم مفردلم يجز أن تقع الابعددننى وتلزم الشانى مثل اعراب
  الأول تقول مارأيت زيد الكن عمراوماجانى زيدالكن عمرو وأماقول الشاءر
  فلت باتيه ولا استطيعه * ولالك اسة نى ان كان ماؤكْ ذافضل
  فانه أراد واكن فحذف النون ضرورة وهوقبيح وبعض النحوبين يقول أملدان واللام
  والكاف زائدتان يدل على ذلك أنّ العرب تدخل اللام فى خبرها وأنشدالفراء
  ولكنفم ن حبها الكميد *وقوله تعالى لكاهو اللّه ربى يقال أصله لكن أنا فحذفت الالف
  فالتت نونان تجاء لتشديد لذلك ن ان حرف لنفى الاستقبال وتنسب به تقول لن
  تقوم ⁦(لون)⁩ اللون هبئة كالسواد والحرة وونته فتلون واللون النوع وفلان متلون
  اذا كان لا يثبت على خلق واحد ولون البسرتلو بنا اذابدا فيه أثر النضيج واللون الدقل
  و«وضرب من النخل قال الاخفسْ هو جاعة واحدتم الينة ولكن لما انكسر ماقبلها
  انقلبت الواوياء ومنه قوله تعالى ما قطعتم من اينة وتمرها سمين يسمى الهجوة والمع لين ويجع
  اللين لسان مغل ذتب وذقاب قال امر والقيس
  وسالفة كسموق الليان أضرم فيها الغوى السعر
  ن اللهنة بالضم السلفة وهوما يتعلل به الانسان قبل ادراه الطعام تة ول لهنته
  تله ينافتاهن أى سلفته ويقال ألهنته اذا أهدبت له شيأ عندة دومه من سهره وقولهم لهذك
  يفتح اللام وكسرالهاءكلمة تستعمل عند التوكيد وأصاه الانك فأبدلت الهمزها.
  كما قالوا فى اياك هياد وانما جاز أن يجمع بين اللام وان وكلاهما للتوكيد لانه لما أبدلت الهمزة
  ها زال لفظ ان فصار كانهاشئ آخر قال الشاءر
  لهنك من عبسية لوسيمة • على كاذب من وعدهاضوء صادق
  اللام الاولى للتوكيدوالمانية لام ان وقال أبو عبيد أنشدنا السكسائى
  لهنك من عيسية لوسمة • على هنوات كاذب من ية ولها
  رقال أراد اللّٰه اتك من عبسية فحذف اللام الأولى من للّه والالف من انك كما قال الاخر
  لاه اين عمك والنوى تغدو* أراد لله ابن عمك أى واللّٰه والقول الأول أصح (لين اللين ضدّ
