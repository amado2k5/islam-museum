label:
  ar: "الترمذي 2401 — من ابتليته بحبيبتيه فصبر عوضته الجنة"
  en: "Tirmidhi 2401 — Whoever I try with the loss of his eyes and is patient, I give him Paradise"
  ur: "ترمذی 2401 — جس کی دونوں آنکھیں لے کر میں آزماؤں اور وہ صبر کرے، اسے جنت دیتا ہوں"
text: "يقول الله عز وجل من أذهبت حبيبتيه فصبر واحتسب لم أرض له ثوابا دون الجنة . وفي الباب عن عرباض بن سارية . قال أبو عيسى هذا حديث حسن صحيح ."
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2401: من ابتليته بحبيبتيه فصبر عوضته الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2401: Whoever I try with the loss of his eyes and is patient, I give him Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2401: جس کی دونوں آنکھیں لے کر میں آزماؤں اور وہ صبر کرے، اسے جنت دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
