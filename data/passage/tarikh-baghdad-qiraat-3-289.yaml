text: "… قد قضى من آخر الليل، وذلك لأربع خاون من جمادى الآخرة سنة سبع وثلاثائة. كتب عنه الحفاظ ووثقوه، واستحبوا الاكثار منه، وكان مع ذلك من قراء القرآن على قراءة حمزة الزيات. ذكر من أسمه عوف - - عوف بن مالك …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 3، ص 289، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 3, p. 289, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 3، ص 289 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh Baghdad de al-Khatib al-Baghdadi, volumen 3, pág. 289, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh Baghdad d'al-Khatib al-Baghdadi (tome 3, p. 289) mentionne les lectures du Coran et les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "El-Hatib el-Bağdadi'nin *Bağdat Tarihi* adlı eserinin 3. cildinin 289. sayfasından alınan bir alıntı, Kur'an okunuşlarını ve okuyucularını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Baghdad* karya Al-Khatib Al-Baghdadi, Jilid 3, halaman 289, menyebutkan bacaan dan para qari Al-Quran; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
