text: "… قد قضى من آخر الليل، وذلك لأربع خاون من جمادى الآخرة سنة سبع وثلاثائة. كتب عنه الحفاظ ووثقوه، واستحبوا الاكثار منه، وكان مع ذلك من قراء القرآن على قراءة حمزة الزيات. ذكر من أسمه عوف - - عوف بن مالك …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 3، ص 289، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
