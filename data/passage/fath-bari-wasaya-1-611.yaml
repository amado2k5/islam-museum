text: "… عِمْرَانَ آل عمران: أن آل عمران هم آل أبي طالب، وأن اسم أبي طالب عمران واشتهر بكنيته. وكان شقيق عبد اللّٰه والدرسول الله بَلِ قِيه ولذلك أوصى به عبد المطلب عند موته فكفله إلى أن كبر، واستمر على نصره بعد …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 611، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
