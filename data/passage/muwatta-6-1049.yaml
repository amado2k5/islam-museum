label: { ar: "الموطأ 1049 — مالك: عمر بن الخطاب أمر أبا أيوب الأنصاري وهبار بن الأسود، حين فاتهما الحج وأتيا يوم النحر، أن يحلا بعمرة ثم يرجعا حلالاً، ثم يحجان عاماً قابلاً ويهديان؛ فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع", en: "Muwatta 1049" }
summary:
  ar: "قول لمالك: أمر عمر بن الخطاب أبا أيوب الأنصاري وهبار بن الأسود، حين فاتهما الحج، وأتيا يوم النحر، أن يحلا بعمرة ثم يرجعا حلالاً، ثم يحجان عاماً قابلاً ويهديان، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1167). {cite:muwatta-maruf-1997 p.486} {cite:muwatta-maruf-1997 p.487}"
