label: { ar: "الموطأ 1049 — مالك: عمر بن الخطاب أمر أبا أيوب الأنصاري وهبار بن الأسود، حين فاتهما الحج وأتيا يوم النحر، أن يحلا بعمرة ثم يرجعا حلالاً، ثم يحجان عاماً قابلاً ويهديان؛ فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع", en: "Muwatta 1049", es: "Muwatta 1049", fr: "Muwatta 1049", ur: "موطا 1049", tr: "El-Muvatta 1049 — Malik: Ömer ibn el-Hattab, Hac ibadetini kaçırıp kurban gününe denk gelen Ebu Eyyub el-Ensari ve Hibber ibn el-Esved'e, Umre yapıp sonra ihramlı olarak geri dönmelerini, ertesi yıl Hac yapmalarını ve kurban kesmelerini emretti; kurban bulamayan ise Hac sırasında üç gün, dönüşte ise yedi gün oruç tutsun.", id: "Al-Muwatta 1049 — Malik: Umar ibn al-Khattab memerintahkan Abu Ayyub al-Ansari dan Hibbar ibn al-Aswad, ketika mereka melewatkan ibadah haji dan tiba pada Hari Raya Kurban, untuk melaksanakan umrah dan kemudian kembali dalam keadaan ihram, lalu melaksanakan haji pada tahun berikutnya dan mempersembahkan kurban; dan barangsiapa yang tidak dapat menemukan kurban, hendaknya berpuasa tiga hari selama haji dan tujuh hari setelah kembali." }
summary:
  ar: "قول لمالك: أمر عمر بن الخطاب أبا أيوب الأنصاري وهبار بن الأسود، حين فاتهما الحج، وأتيا يوم النحر، أن يحلا بعمرة ثم يرجعا حلالاً، ثم يحجان عاماً قابلاً ويهديان، فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1167). {cite:muwatta-maruf-1997 p.486} {cite:muwatta-maruf-1997 p.487}"
  tr: "Malik şöyle demiştir: Ömer ibn el-Hattab, Hac ibadetini kaçırıp kurban günü gelen Ebu Eyyub el-Ensari ve Hibber ibn el-Esved'e, Umre yapmalarını, sonra ihramlı olarak geri dönmelerini, ertesi yıl Hac yapmalarını ve kurban kesmelerini emretmiştir. Kurban kesmeye gücü yetmeyenler ise Hac sırasında üç gün, dönüşte de yedi gün oruç tutmalıdır. Araştırmacı, bunu Ebu Musab'ın (1167) Malik'ten rivayet ettiğini belirtmektedir."
  id: "Malik berkata: Umar bin al-Khattab memerintahkan Abu Ayyub al-Ansari dan Hibbar bin al-Aswad, ketika mereka ketinggalan haji dan tiba pada Hari Raya Kurban, untuk melaksanakan umrah, kemudian kembali dalam keadaan ihram, lalu melaksanakan haji tahun berikutnya dan mempersembahkan kurban. Barangsiapa yang tidak mampu mempersembahkan kurban hendaknya berpuasa tiga hari selama haji dan tujuh hari setelah kembali. Peneliti menyebutkan bahwa Abu Mus'ab (1167) meriwayatkannya dari Malik."
