text: "… ألبسها بالعافية كان في سيوري حصار بلدة الشيخ قاض سكّيرٌ فَسَكِرَ يوماً في المزرعة ونام وقد خلع جبّته، وقاووقه، ورماهما جانبا، وخرج الشيخ للتنزه هو وتلميذه حمّاد، فرأى القاضي وحالته فأخذ الجبّة ولبسها وذهب. ولما انتبه القاضي ولم يجد الجبّة …"
summary:
  ar: "في سيوري حصار نام قاضٍ سكران في حقل، فأخذ جحا، وكان يتمشى مع تلميذه حماد، عباءة القاضي ولبسها؛ فأرسل القاضي في طلبه؛ فادعى جحا أن عباءة السكران له أن يأخذها، فقال القاضي أن يُلبسوه إياها بالقوة. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  en: "In Siwri Hisar a drunken judge sleeps in a field, and Juha, out walking with his pupil Hammad, takes the judge's robe and wears it; the judge sends for him; Juha claims a drunk man's robe was his to take, and the judge says to dress him in it by force. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  ur: "سیوری حصار میں ایک نشے میں دھت قاضی کھیت میں سو گیا، اور جحا نے، جو اپنے شاگرد حماد کے ساتھ ٹہل رہا تھا، قاضی کا جبہ لے کر پہن لیا؛ قاضی نے اسے بلوایا؛ جحا نے دعویٰ کیا کہ نشئی کا جبہ لینا اس کا حق تھا، تو قاضی نے کہا کہ اسے یہ جبہ زبردستی پہنا دو۔ {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  fr: "À Siwri Hisar, un cadi ivre dort dans un champ, et Juha, qui se promène avec son élève Hammad, prend la robe du cadi et la revêt; le cadi le fait appeler; Juha soutient que la robe d'un homme ivre lui revenait, et le cadi dit de l'en habiller de force. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  es: "En Siwri Hisar, un juez borracho duerme en un campo, y Juha, que pasea con su discípulo Hammad, toma la túnica del juez y se la pone; el juez lo manda llamar; Juha sostiene que la túnica de un borracho le correspondía, y el juez dice que se la pongan a la fuerza. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
  tr: "Siuri'de bir yargıç sarhoş halde bir tarlada uyuyordu. Öğrencisi Hammad ile birlikte yürüyen Juha, yargıcın cübbesini alıp giydi. Yargıç onu çağırdı, ancak Juha sarhoşun cübbesinin kendisine ait olduğunu iddia etti. Bunun üzerine yargıç, cübbenin zorla kendisine verilmesini emretti. {cite:juha-nawadir-kubra-djuwaydi s. 78}"
  id: "Di Siuri, seorang hakim mabuk dan tidur di ladang. Juha, yang sedang berjalan bersama muridnya, Hammad, mengambil jubah hakim dan memakainya. Hakim memanggilnya, tetapi Juha mengklaim bahwa jubah si pemabuk itu adalah miliknya. Hakim kemudian memerintahkan agar jubah itu diberikan kepadanya secara paksa. {cite:juha-nawadir-kubra-djuwaydi p. 78}"
