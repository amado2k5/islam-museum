text: "… من أئمة اللغة، وقد رجح أنه الطهر، وقال أبو عبيد: القرء يصلحُ للطهر والحيض، وقال الزجاج: أخبرني من أثق به، عن يونس، أن القرء عنده يصلحُ للطهر والحيض، وقال أبو عمرو بن العلاء: القرء الوقت، وهو يصلُح للحيض، ويصلح للطهر، …"
