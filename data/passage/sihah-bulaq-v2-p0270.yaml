  والعام السنة بقال سنون عوم وهونوكيد للاوّل كماتقول بينهم شغل شاغل قال العجاج
  من مرّأعوام السنين العوم• وهو فى التعددير جحع عائثم الا أنه لا يفرد بالذكر لانه ليس باسم
  وانماهوتو كيد ونيت عامى أى يابس أتى عليه عام وعائم منم كان لهم وعاومت النفلة أى
