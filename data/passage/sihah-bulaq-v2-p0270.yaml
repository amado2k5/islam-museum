  فه ذا يدل على أنه نبت لادود وبئان معتم أى مخضوب ( وم . لعوم السباحة يقال
  العوم لا ينسى وسير الابل والسفينة عوم أيضا والعومة بالضم دويبة صغيرة تسبح فى المه
