  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 3775. sayfasından, helal, haram ve yasak olan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
