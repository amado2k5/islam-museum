text: "… الحافظ وأبو أحمد الحاكم وأخرج الحافظ وأبو يعلي من طريقه عن أنس مرفوعًا قال : قال رسول اللّٰه: أخوف ما أخاف على أُمتي تصديق بالنجوم، وتكذيب بالقدر، لا يؤمن عبد بالله جتى. يؤمن بالقدر خيره وشره وحلوه ومره، وأخذ أنس …"
