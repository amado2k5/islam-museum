label: { ar: "الموطأ 1332 — يحيى بن سعيد عن عمر بن الخطاب: كرم المؤمن تقواه، والشهيد من احتسب نفسه على الله", en: "Muwatta 1332" }
text: "وَالشَّهيدُ مَن احْتَسبَ نَفْسهُ على اللهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب قال كرم المؤمن تقواه، ودينه حسبه، ومروءته خلقه، والجرأة والجبن غرائز يضعها الله حيث يشاء، فالجبان يفر عن أبيه وأمه، والجريء يقاتل عما لا يؤوب به إلى رحله، والقتل حتف من الحتوف، والشهيد من احتسب نفسه على الله. {cite:muwatta-maruf-1997 p.595}"
