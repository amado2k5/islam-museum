label: { ar: "الموطأ 1332 — يحيى بن سعيد عن عمر بن الخطاب: كرم المؤمن تقواه، والشهيد من احتسب نفسه على الله", en: "Muwatta 1332", es: "Muwatta 1332", fr: "Muwatta 1332", ur: "موطا 1332", tr: "El-Muvatta 1332 — Yahya bin Said, Ömer bin El-Hattab'dan rivayetle: Müminin şerefi takvasıdır, şehit ise kendini Allah'a emanet edendir.", id: "Al-Muwatta 1332 — Yahya bin Saeed berdasarkan riwayat Umar bin Al-Khattab: Kemuliaan seorang mukmin adalah ketakwaannya, dan syahid adalah orang yang menyerahkan dirinya kepada Allah." }
text: "وَالشَّهيدُ مَن احْتَسبَ نَفْسهُ على اللهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب قال كرم المؤمن تقواه، ودينه حسبه، ومروءته خلقه، والجرأة والجبن غرائز يضعها الله حيث يشاء، فالجبان يفر عن أبيه وأمه، والجريء يقاتل عما لا يؤوب به إلى رحله، والقتل حتف من الحتوف، والشهيد من احتسب نفسه على الله. {cite:muwatta-maruf-1997 p.595}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle Ömer ibn el-Hattab'ın şöyle dediğini aktarır: \"Bir müminin şerefi takvasında, dini soy ağacında, şövalyeliği ise karakterindedir. Cesaret ve korkaklık, Allah'ın dilediği yere yerleştirdiği içgüdülerdir. Korkak anne ve babasından kaçar, cesur ise evine geri götüremeyeceği şeyler için savaşır. Ölüm kaçınılmaz sonlardan biridir ve şehit, hayatını Allah'a emanet eden kimsedir.\" {cite:muwatta-maruf-1997 s.595}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Umar ibn al-Khattab berkata: \"Kemuliaan seorang mukmin terletak pada ketakwaannya, agamanya pada keturunannya, dan kesatriaannya pada akhlaknya. Keberanian dan rasa takut adalah naluri yang Allah tempatkan di tempat yang Dia kehendaki. Orang pengecut melarikan diri dari ayah dan ibunya, sedangkan orang pemberani berjuang untuk apa yang tidak dapat dibawanya kembali ke rumahnya. Kematian adalah salah satu akhir yang tak terhindarkan, dan syahid adalah orang yang mempercayakan hidupnya kepada Allah.\" {cite:muwatta-maruf-1997 p.595}"
