text: "… قُبِضَ رَسُولَ اللهِ وَلي اخْتَلَفُوا في دَفْنِهِ، فَقَالَ أَبُو بَكْرٍ : سَمِعْتُ مِنْ رَسُولِ اللهِ وَيِقِ شَيْئًا مَا نَسِيتُهُ قَالَ : مَا قَبَضَ اللهُ نَبَِّا إلَّا في المَوْضِعِ الَّذِي يُحِبُّ أَنْ يُدْفَنَ فِيهِ، فَدَفَنُوهُ فِي مَوْضِعٍ فِرَاشِهِ. التحفة - الجنائز …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 246، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 246, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 246 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 1, pág. 246, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Jami' al-Tirmidhi, volume 1, page 246, mentionnant un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "Cami' el-Tirmizi'nin 1. cildinin 246. sayfasından, ölüm ve vefat anı, defin, mezar ve istirahat yeri konularını ele alan bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetler, miraslar, antikalar ve istirahat yerleri araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 1, halaman 246, yang menyebutkan saat kematian dan wafat, pemakaman, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat peristirahatan."
