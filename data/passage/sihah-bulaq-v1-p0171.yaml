  الصبان فى باب التصغير قال
  ومقاعس بفح الميم ججمع المقعنس بعد حذف الزيادات الذون والسين الاخيرة وانما
  شيخنا يعف المدابقى انظر هل
  لم تحذف اليم وان كانت زائدة لانهادخلت لمعنى اسم الفاعل وأنت فى التعويض بانلخيار
  يأق هنا خلاف المبرد المتقدم
