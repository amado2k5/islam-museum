  قعيسيس بزيادة ياء بين السينين
  أقعس وقعس ومتقاعس وفرس أقعس اذا اطمأنّ صلبه من صهوته وارتفعت قطاته ومن
  على لغة التعويض وفى بعض
  الابل التى مال رأسها وعنهافحوظهرها ومنه قولهم ابن خس عشاء خلفات قعس أمكث
  تخ حذف الميم والسين الاخيرة
  الهلال لجس خلون من الشهر الى أن يغيب مكث هذه الموامل فى عشائها وليل أقمس كانه
  فبقول قعيس وعلى هذه ظاهر
  لا يبرح وعزة عساء أى ثابتة ورجل أقعس أى منيع والاقعس جبل والاقعسان الاقعس
  تسخ القاموس ومترجه ان لم يكن
  وهبيرة ابناضخضم والتعوس الشيح الكبير الهرم وتقعوس الشيخ أى كبر وتقعوس البيت
  التحريف من التاسخ بحذف الدين
  أى تهدم وتقاعس الرجل عن الامر أى تأخر ولم يتقدّم فيه ومنه قول الكميت
