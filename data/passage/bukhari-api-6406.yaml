label: { ar: "صحيح البخاري 6406 — عمل يعدل عملا أعظم منه، الميزان", en: "Sahih al-Bukhari 6406 — a deed that equals a greater one; the Scale", ur: "صحیح بخاری 6406 — ایک عمل جو بڑے عمل کے برابر ہے، میزان" }
text: "حَدَّثَنَا زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا ابْنُ فُضَيْلٍ، عَنْ عُمَارَةَ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ، سُبْحَانَ اللَّهِ الْعَظِيمِ، سُبْحَانَ اللَّهِ وَبِحَمْدِهِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6406، يذكر عمل يعدل عملا أعظم منه، والميزان. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 6406 (Invocations), that speaks of a deed that equals a greater one, the Scale. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 6406، جس میں ایک عمل جو بڑے عمل کے برابر ہے، میزان کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
