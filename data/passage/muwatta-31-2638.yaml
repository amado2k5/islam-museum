summary:
  ar: "يروي مالك عن ابن شهاب عن عطاء بن يزيد الليثي عن أبي أيوب الأنصاري أن رسول الله قال: لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام. ويذكر المحقق أن يحيى روى «يهاجر»، وأن سائر الرواة للموطأ قالوا «يهجر». {cite:muwatta-maruf-1997 p.493}"
