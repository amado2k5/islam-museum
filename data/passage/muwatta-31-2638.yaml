label: { ar: "الموطأ 2638 — عطاء بن يزيد الليثي عن أبي أيوب: لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال", en: "Muwatta 2638", es: "Muwatta 2638", fr: "Muwatta 2638", ur: "موطا 2638", tr: "El-Muvatta 2638 — Ata’ ibn Yazid el-Laythi, Ebu Eyyub'dan rivayetle: Bir Müslümanın kardeşini üç geceden fazla terk etmesi caiz değildir.", id: "Al-Muwatta 2638 — Ata’ ibn Yazid al-Laythi berdasarkan riwayat Abu Ayyub: Tidak diperbolehkan bagi seorang Muslim untuk meninggalkan saudaranya lebih dari tiga malam" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عطاء بن يزيد الليثي عن أبي أيوب الأنصاري أن رسول الله قال: لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام. ويذكر المحقق أن يحيى روى «يهاجر»، وأن سائر الرواة للموطأ قالوا «يهجر». {cite:muwatta-maruf-1997 p.493}"
  tr: "Malik, İbn Şihab'dan, Ata ibn Yazid el-Laythi'den, Ebu Eyyub el-Ensari'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Bir Müslümanın kardeşini üç geceden fazla terk etmesi, görüşüp sonra yüz çevirmesi caiz değildir. İkisinden daha hayırlı olan, selamı ilk verendir.\" Araştırmacı, Yahya'nın \"terk etme\" şeklinde naklettiğini, Muvatta'nın diğer ravîlerinin ise \"terk etme\" dediğini belirtmektedir. {cite:muwatta-maruf-1997 s.493}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Ata ibn Yazid al-Laythi, dari Abu Ayyub al-Ansari, bahwa Rasulullah SAW bersabda: “Tidak diperbolehkan bagi seorang Muslim untuk meninggalkan saudaranya lebih dari tiga malam, bertemu dan berpisah. Lebih baik di antara keduanya adalah orang yang memulai salam.” Peneliti menyebutkan bahwa Yahya meriwayatkan “meninggalkan,” sedangkan perawi Muwatta lainnya mengatakan “meninggalkan.” {cite:muwatta-maruf-1997 p.493}"
