label: { ar: "صحيح البخاري 876 — ما فُرض على الناس، الفرض", en: "Sahih al-Bukhari 876 — what was made obligatory on people; the obligatory (fard)", ur: "صحیح بخاری 876 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Sahih al-Bukhari 876 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Sahih al-Bujari 876 — lo que se impuso a la gente; lo obligatorio (fard)", tr: "Sahih el-Buhari 876 — İnsanlar üzerine farz olan şey, yükümlülüktür.", id: "Sahih al-Bukhari 876 — Apa yang wajib bagi manusia, kewajiban" }
text: "… أَبُو الزِّنَادِ، أَنَّ عَبْدَ الرَّحْمَنِ بْنَ هُرْمُزَ الأَعْرَجَ، مَوْلَى رَبِيعَةَ بْنِ الْحَارِثِ حَدَّثَهُ أَنَّهُ، سَمِعَ أَبَا هُرَيْرَةَ ـ أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" نَحْنُ الآخِرُونَ السَّابِقُونَ يَوْمَ الْقِيَامَةِ، بَيْدَ أَنَّهُمْ أُوتُوا الْكِتَابَ مِنْ قَبْلِنَا، ثُمَّ هَذَا يَوْمُهُمُ الَّذِي فُرِضَ عَلَيْهِمْ فَاخْتَلَفُوا فِيهِ، فَهَدَانَا اللَّهُ، فَالنَّاسُ لَنَا فِيهِ تَبَعٌ، الْيَهُودُ غَدًا وَالنَّصَارَى بَعْدَ غَدٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 876، يرد فيه ذكر ما فُرض على الناس، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 876 (Friday Prayer), whose wording mentions what was made obligatory on people, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 876، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 876, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 876, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 876 numaralı hadis, insanların farz olan işlerini ve farz kavramını ele almaktadır. Bu hadis, farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile onların haleflerinden rivayetlerle birlikte derleyen bir araştırmacı tarafından derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 876, menyebutkan apa yang wajib dilakukan oleh manusia, dan konsep kewajiban. Hadits ini disusun oleh seorang peneliti yang mengumpulkan amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
