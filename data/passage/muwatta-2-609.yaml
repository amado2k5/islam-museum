label: { ar: "الموطأ 609 — أبو هريرة يصف صلاته على الجنازة: اللهم عبدك وابن عبدك وابن أمتك… لا تحرمنا أجره ولا تفتنا بعده", en: "Muwatta 609", es: "Muwatta 609", fr: "Muwatta 609", ur: "موطا 609", tr: "El-Muvatta 609 — Ebu Hurayra cenaze namazını şöyle anlatır: Ey Allah'ım, kulun, kulunun oğlu ve cariyenin oğlu... Bizi onun mükafatından mahrum etme, ne de onun ardından imtihanlara düşmemize izin verme.", id: "Al-Muwatta 609 — Abu Hurairah menggambarkan doa pemakamannya: Ya Allah, hamba-Mu, putra hamba-Mu, dan putra hamba perempuan-Mu… Janganlah Engkau ambil pahalanya dari kami, dan janganlah Engkau cobai kami setelahnya." }
text: "اللهم إن كان محسناً، فزد في إحسانه، وإن كان مسيئاً، فتجاوز عنه سيئاته. اللهم لا تحرمنا أجره، ولا تفتنا بعده"
summary:
  ar: "أول حديث في باب ما يقول المصلي على الجنازة. يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبيه، أنه سأل أبا هريرة كيف يصلي على الجنازة، فقال: أنا لعمر الله أخبرك: أتبعها من أهلها، فإذا وُضعت كبرت وحمدت الله وصليت على نبيه، ثم أقول: اللهم عبدك وابن عبدك وابن أمتك، كان يشهد أن لا إله إلا أنت وأن محمداً عبدك ورسولك وأنت أعلم به، اللهم إن كان محسناً فزد في إحسانه وإن كان مسيئاً فتجاوز عنه سيئاته، اللهم لا تحرمنا أجره ولا تفتنا بعده. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق (6425). {cite:muwatta-maruf-1997 p.313}"
  tr: "Cenaze namazında ne söylenmesi gerektiği bölümündeki ilk hadis. Malik, Said ibn Ebu Said el-Makburi'den, o da babasından rivayet ederek, Ebu Hurayra'ya cenaze namazının nasıl kılınacağını sorduğunu nakletmiştir. O şöyle cevap verdi: \"Allah'a yemin ederim ki, merhumun ailesiyle birlikte cenazeyi takip ederim. Cenaze yere konulduğunda 'Allahu Ekber' (Allah en büyüktür) derim, Allah'a hamd eder ve Peygamberine salavat getiririm. Sonra şöyle derim: 'Ey Allah'ım, kulun, kulunun oğlu ve cariyenin oğlu şahitlik ettiler ki, Senden başka ilah yoktur ve Muhammed Senin kulun ve elçindir ve Sen onu en iyi bilirsin. Ey Allah'ım, eğer o iyi bir insansa, iyiliklerini artır; eğer o bir günahkârsa, günahlarını bağışla. Ey Allah'ım, bizi onun mükafatından mahrum etme ve bizi onun ardından imtihan etmeye bırakma.'\" Editör, bunun Malik'ten rivayetle Ebu Mus'ab, Suveyd ve Abdül-Razzak (6425) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.313}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang harus diucapkan dalam salat jenazah. Diriwayatkan oleh Malik dari Sa'id ibn Abi Sa'id al-Maqburi, dari ayahnya, bahwa ia bertanya kepada Abu Hurayrah tentang cara melaksanakan salat jenazah. Dia menjawab: \"Demi Allah, aku akan memberitahumu: Aku mengikuti arak-arakan bersama keluarga orang yang meninggal. Ketika jenazah diletakkan, aku mengucapkan 'Allahu Akbar' (Allah Maha Besar), memuji Allah, dan mengirimkan shalawat kepada Nabi-Nya. Kemudian aku berkata: 'Ya Allah, hamba-Mu, putra hamba-Mu, dan putra hamba perempuan-Mu, telah bersaksi bahwa tiada Tuhan selain Engkau dan bahwa Muhammad adalah hamba dan Rasul-Mu, dan Engkau lebih mengetahuinya. Ya Allah, jika dia adalah orang yang berbuat baik, maka tambahkanlah amal kebaikannya, dan jika dia adalah orang yang berbuat zalim, maka ampunilah dosa-dosanya. Ya Allah, janganlah Engkau ambil pahalanya dari kami, dan janganlah Engkau coba-coba setelahnya.'\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, dan 'Abd al-Razzaq (6425). {cite:muwatta-maruf-1997 p.313}"
