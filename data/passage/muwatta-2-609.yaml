label: { ar: "الموطأ 609 — أبو هريرة يصف صلاته على الجنازة: اللهم عبدك وابن عبدك وابن أمتك… لا تحرمنا أجره ولا تفتنا بعده", en: "Muwatta 609" }
text: "اللهم إن كان محسناً، فزد في إحسانه، وإن كان مسيئاً، فتجاوز عنه سيئاته. اللهم لا تحرمنا أجره، ولا تفتنا بعده"
summary:
  ar: "أول حديث في باب ما يقول المصلي على الجنازة. يرويه مالك عن سعيد بن أبي سعيد المقبري عن أبيه، أنه سأل أبا هريرة كيف يصلي على الجنازة، فقال: أنا لعمر الله أخبرك: أتبعها من أهلها، فإذا وُضعت كبرت وحمدت الله وصليت على نبيه، ثم أقول: اللهم عبدك وابن عبدك وابن أمتك، كان يشهد أن لا إله إلا أنت وأن محمداً عبدك ورسولك وأنت أعلم به، اللهم إن كان محسناً فزد في إحسانه وإن كان مسيئاً فتجاوز عنه سيئاته، اللهم لا تحرمنا أجره ولا تفتنا بعده. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق (6425). {cite:muwatta-maruf-1997 p.313}"
