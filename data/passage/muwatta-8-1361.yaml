label: { ar: "الموطأ 1361 — مالك فيمن حلف بنذور مسماة مشيا إلى بيت الله ألا يكلم أخاه بشيء لا يقوى عليه: يكفيه الوفاء بما جعل على نفسه بقدر ما يستطيع", en: "Muwatta 1361", es: "Muwatta 1361", fr: "Muwatta 1361", ur: "موطا 1361", tr: "El-Muvatta 1361 — Malik, Allah'ın Evi'ne (Kâbe'ye) yürüyerek gitmeye ve yapamayacağı hiçbir şeyi kardeşine anlatmamaya yemin eden kimse hakkında şöyle demiştir: Kendi gücü yettiği ölçüde, kendine verdiği sözü yerine getirmesi yeterlidir.", id: "Al-Muwatta 1361 — Malik berkata tentang seseorang yang bersumpah untuk berjalan ke Rumah Allah (Ka'bah) dan tidak berbicara kepada saudaranya tentang hal-hal yang tidak mampu dilakukannya: Cukuplah baginya untuk memenuhi apa yang telah ia nazarkan kepada dirinya sendiri sejauh kemampuannya." }
summary:
  ar: "سئل مالك عن الرجل يحلف بنذور مسماة مشيا إلى بيت الله، ألا يكلم أخاه أو أباه بكذا وكذا، نذرا لشيء لا يقوى عليه، ولو تكلف ذلك كل عام لعرف أنه لا يبلغ عمره ما جعل على نفسه. فقال ما أعلمه يجزئه من ذلك إلا الوفاء بما جعل على نفسه، فليمش ما قدر عليه من الزمان، وليتقرب إلى الله بما استطاع من الخير. {cite:muwatta-maruf-1997 p.608}"
  tr: "Malik'e, Allah'ın Evi'ne (Kâbe'ye) yürüyeceğine ve bu konuda kardeşine veya babasına hiçbir şey söylemeyeceğine dair yemin eden, ancak bu yemini yerine getiremeyecek bir adam hakkında soru soruldu. Bu yemini her yıl tekrarlasa bile, verdiği sözü yerine getirecek kadar uzun yaşayamayacağını bilirdi. Malik şöyle cevap verdi: \"Onu tatmin edecek hiçbir şey bilmiyorum, ancak verdiği sözü yerine getirmesi gerekir. Elinden geldiğince yürüsün ve yapabildiği tüm iyi amellerle Allah'a daha da yaklaşsın.\" {cite:muwatta-maruf-1997 s.608}"
  id: "Malik ditanya tentang seorang pria yang bernazar untuk berjalan kaki ke Rumah Allah (Ka'bah), berjanji untuk tidak membicarakan hal ini dan itu kepada saudara atau ayahnya, sebuah nazar yang tidak dapat ia penuhi. Sekalipun ia melakukannya setiap tahun, ia tahu bahwa ia tidak akan hidup cukup lama untuk memenuhi nazarnya. Malik menjawab, \"Aku tidak tahu apa pun yang akan memuaskannya kecuali memenuhi nazarnya. Biarlah ia berjalan selama ia mampu, dan biarlah ia mendekatkan diri kepada Allah melalui amal kebaikan apa pun yang dapat ia lakukan.\" {cite:muwatta-maruf-1997 p.608}"
