label: { ar: "الموطأ 1361 — مالك فيمن حلف بنذور مسماة مشيا إلى بيت الله ألا يكلم أخاه بشيء لا يقوى عليه: يكفيه الوفاء بما جعل على نفسه بقدر ما يستطيع", en: "Muwatta 1361" }
summary:
  ar: "سئل مالك عن الرجل يحلف بنذور مسماة مشيا إلى بيت الله، ألا يكلم أخاه أو أباه بكذا وكذا، نذرا لشيء لا يقوى عليه، ولو تكلف ذلك كل عام لعرف أنه لا يبلغ عمره ما جعل على نفسه. فقال ما أعلمه يجزئه من ذلك إلا الوفاء بما جعل على نفسه، فليمش ما قدر عليه من الزمان، وليتقرب إلى الله بما استطاع من الخير. {cite:muwatta-maruf-1997 p.608}"
