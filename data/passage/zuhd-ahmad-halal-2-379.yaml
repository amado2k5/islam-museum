text: "… : والكراهة المطلقةُ في لسانِ المتقدمين لا يَكادُ يُرادُ بها إِلَّا التَّحريمَ. وقال الحافظ ابن حجر في فتح الباري : وكأَنَّ المرادَ بالفتنةِ ما يقعُ مِنَ الحروبِ بين المسلمين؛ لأَنَّ في بيعِه -إذ ذاك- إِعانةٌ من اشتراهُ، وهذا محلُّه إِذا …"
