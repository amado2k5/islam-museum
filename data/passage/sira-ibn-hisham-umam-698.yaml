  tr: "İbn Hişam'ın Peygamber biyografisinden, 698. sayfada yer alan, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Müslüman olmayan milletler, dinler, mezhepler ve halklar için tarayıcı tarafından derlenmiştir."
