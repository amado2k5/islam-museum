text: "… وَل فِ لذلك وفد نصارى نجران وذكر المباهلة معنى العاقب والسيد والأسقف منزلة أبي حارثة عند ملوك الروم.. سبب إسلام كوز بن علقمة.... رؤساء نجران وإسلام أحدهم صلاتهم إلى المشرق.. ما نزل من القرآن فيما أحدث اليهود والنصارى ما نزل …"
summary:
