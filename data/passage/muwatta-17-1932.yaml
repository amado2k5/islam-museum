label: { ar: "الموطأ 1932 — مالك: ما اشتريت من هذه الأصناف كلها فلا بأس أن تبيعه قبل أن تقبضه من غير صاحبه، إذا قبضت ثمنه، إذا اشتريته كيلا أو وزنا، فإن اشتريته جزافا فبعه من غير الذي اشتريته منه بنقد أو إلى أجل، لأن ضمانه منك إذا اشتريته جزافا", en: "Muwatta 1932", es: "Muwatta 1932", fr: "Muwatta 1932", ur: "موطا 1932", tr: "El-Muvatta 1932 — Malik: Bu malların hepsinden ne alırsanız alın, eğer bedelini aldıysanız ve ölçü veya ağırlıkla aldıysanız, sahibinden başka birinden teslim almadan önce satmanızda bir sakınca yoktur. Ancak eğer toplu olarak aldıysanız, onu satın aldığınız kişiden başka birine nakit veya krediyle satın; çünkü toplu olarak aldıysanız kefalet sizin sorumluluğunuzdadır.", id: "Al-Muwatta 1932 — Malik: Apa pun yang kamu beli dari semua barang ini, tidak ada salahnya menjualnya sebelum kamu memilikinya dari orang lain selain pemiliknya, jika kamu telah menerima harganya, jika kamu membelinya dengan takaran atau berat. Tetapi jika kamu membelinya dalam jumlah besar, maka juallah kepada orang lain selain dari orang yang menjualnya kepadamu, secara tunai atau kredit, karena jaminannya ada padamu jika kamu membelinya dalam jumlah besar." }
summary:
  ar: "قال مالك: وما اشتريت من هذه الأصناف كلها، فلا بأس بأن تبيعه قبل أن تقبضه من غير صاحبه الذي اشتريته منه، إذا قبضت ثمنه، إذا كنت اشتريته كيلا أو وزنا. فإن اشتريته جزافا، فبعه من غير الذي اشتريته منه بنقد، أو إلى أجل. وذلك أن ضمانه منك إذا اشتريته جزافا، ولا يكون ضمانه منك إذا اشتريته وزنا حتى تزنه وتستوفيه. {cite:muwatta-maruf-1997 p.191}"
  tr: "Malik şöyle dedi: Bu mallardan ne alırsanız alın, eğer ölçü veya ağırlıkla aldıysanız ve ödemeyi aldıysanız, asıl satıcıdan başka birine satmanızda bir sakınca yoktur. Eğer toplu olarak aldıysanız, nakit veya krediyle asıl satıcıdan başka birine satabilirsiniz. Çünkü toplu olarak aldıysanız sorumluluk size aittir, ancak ağırlıkla aldıysanız, tartıp teslim alana kadar sorumluluk size ait değildir. {cite:muwatta-maruf-1997 s.191}"
  id: "Malik berkata: Apa pun yang Anda beli dari barang-barang ini, tidak ada salahnya menjualnya sebelum Anda memilikinya kepada orang lain selain penjual aslinya, asalkan Anda telah menerima pembayaran, jika Anda membelinya berdasarkan ukuran atau berat. Jika Anda membelinya dalam jumlah besar, maka juallah kepada orang lain selain penjual aslinya secara tunai atau kredit. Ini karena Anda bertanggung jawab atas barang tersebut jika Anda membelinya dalam jumlah besar, tetapi Anda tidak bertanggung jawab jika Anda membelinya berdasarkan berat sampai Anda menimbangnya dan memilikinya. {cite:muwatta-maruf-1997 p.191}"
