label: { ar: "الموطأ 1932 — مالك: ما اشتريت من هذه الأصناف كلها فلا بأس أن تبيعه قبل أن تقبضه من غير صاحبه، إذا قبضت ثمنه، إذا اشتريته كيلا أو وزنا، فإن اشتريته جزافا فبعه من غير الذي اشتريته منه بنقد أو إلى أجل، لأن ضمانه منك إذا اشتريته جزافا", en: "Muwatta 1932" }
summary:
  ar: "قال مالك: وما اشتريت من هذه الأصناف كلها، فلا بأس بأن تبيعه قبل أن تقبضه من غير صاحبه الذي اشتريته منه، إذا قبضت ثمنه، إذا كنت اشتريته كيلا أو وزنا. فإن اشتريته جزافا، فبعه من غير الذي اشتريته منه بنقد، أو إلى أجل. وذلك أن ضمانه منك إذا اشتريته جزافا، ولا يكون ضمانه منك إذا اشتريته وزنا حتى تزنه وتستوفيه. {cite:muwatta-maruf-1997 p.191}"
