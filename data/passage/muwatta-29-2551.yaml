label: { ar: "الموطأ 2551 — مالك: الجماعة المقتتلة إذا وُجد بينها قتيل لا يُدرى قاتله", en: "Muwatta 2551", es: "Muwatta 2551", fr: "Muwatta 2551", ur: "موطا 2551", tr: "El-Muvatta 2551 — Malik: Eğer bir grup insan kavga ediyorsa ve aralarında katili bilinmeyen bir kişi bulunursa, o zaman...", id: "Al-Muwatta 2551 — Malik: Jika sekelompok orang sedang berperang dan ditemukan seseorang di antara mereka yang pembunuhnya tidak diketahui, maka..." }
summary:
  ar: "قال مالك في جماعة من الناس اقتتلوا فانكشفوا وبينهم قتيل أو جريح لا يُدرى من فعل ذلك به: إن أحسن ما سُمع في ذلك أن عقله على القوم الذين نازعوه، وإن كان الجريح أو القتيل من غير الفريقين فعقله على الفريقين جميعا. {cite:muwatta-maruf-1997 p.443}"
  tr: "Malik, savaşan ve dağılan, aralarında ölü veya yaralı bir kişi bırakan ve saldırganı bilinmeyen bir grup insan hakkında şöyle demiştir: Bu konuda en iyi hüküm, kan parasının onunla birlikte savaşan grup tarafından ödenmesidir. Ancak, yaralı veya ölü kişi iki gruptan da değilse, kan parası her iki grup tarafından da ödenir. {cite:muwatta-maruf-1997 s.443}"
  id: "Malik berkata mengenai sekelompok orang yang berperang dan kemudian tercerai-berai, meninggalkan di antara mereka seorang yang tewas atau terluka yang penyerangnya tidak diketahui: Hukum terbaik dalam hal ini adalah uang darah harus dibayarkan oleh kelompok yang berperang dengannya. Namun, jika orang yang terluka atau tewas tersebut bukan dari salah satu dari kedua kelompok tersebut, maka uang darah harus dibayarkan oleh kedua kelompok. {cite:muwatta-maruf-1997 p.443}"
