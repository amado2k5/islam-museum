summary:
  ar: "قال مالك في جماعة من الناس اقتتلوا فانكشفوا وبينهم قتيل أو جريح لا يُدرى من فعل ذلك به: إن أحسن ما سُمع في ذلك أن عقله على القوم الذين نازعوه، وإن كان الجريح أو القتيل من غير الفريقين فعقله على الفريقين جميعا. {cite:muwatta-maruf-1997 p.443}"
