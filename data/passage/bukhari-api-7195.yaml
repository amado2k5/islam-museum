text: "وَقَالَ خَارِجَةُ بْنُ زَيْدِ بْنِ ثَابِتٍ عَنْ زَيْدِ بْنِ ثَابِتٍ، أَنَّ النَّبِيَّ أَمَرَهُ أَنْ يَتَعَلَّمَ كِتَابَ الْيَهُودِ، حَتَّى كَتَبْتُ لِلنَّبِيِّ كُتُبَهُ، وَأَقْرَأْتُهُ كُتُبَهُمْ إِذَا كَتَبُوا إِلَيْهِ، وَقَالَ عُمَرُ وَعِنْدَهُ عَلِيٌّ وَعَبْدُ الرَّحْمَنِ وَعُثْمَانُ مَاذَا تَقُولُ هَذِهِ قَالَ عَبْدُ الرَّحْمَنِ بْنُ حَاطِبٍ فَقُلْتُ تُخْبِرُكَ بِصَاحِبِهِمَا الَّذِي صَنَعَ بِهِمَا. وَقَالَ أَبُو جَمْرَةَ كُنْتُ أُتَرْجِمُ بَيْنَ ابْنِ عَبَّاسٍ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7195، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7195 (Judgments (Ahkaam)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 7195، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
