text: "حَرَامّ بِحَرام اللهِ، لم تَحِل لِأَحَدٍ كَانَ قَبْلِي، ولن تَحِلَّ لِأَحَدٍ كَائن بَعْدِي، لَمْ تَحِلَّ لى إلَّ سَاعةً مِنْ نَهَار يُقَصَّرُهَا - - بيدَه هَكذا - ولا يُنَفَّرُ صَيْدُهَا، ولا يُعْضَدُ عضاهها، ولا تَحِلّ لُقَطَتهَا إِلا لمُنْشِد، ولا يُخْتَلَى خَلاَها …"
