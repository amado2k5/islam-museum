label: { ar: "نوادر جحا الكبرى، ص 98 — «ربطت شغلك في جميزة»", en: "Nawadir Juha al-Kubra, p. 98 — 'You Tied Your Business to a Sycamore'", ur: "نوادر جحا الکبریٰ، ص 98 — «تم نے اپنا کاروبار گولر کے درخت سے باندھ دیا»", fr: "Nawadir Juha al-Kubra, p. 98 — « Tu as attaché ton affaire à un sycomore »", es: "Nawadir Juha al-Kubra, p. 98 — «Atase tu negocio a un sicomoro»", tr: "Juha'nın Büyük Fıkraları, s. 98 — “Eserinizi bir çınar ağacına bağladım”", id: "Anekdot Hebat Juha, hlm. 98 — “Aku mengikat pekerjaanmu ke pohon ara”" }
text: "… ربطت شغلك في جميزةٍ! له الأجرة ولك الصوت عندما كان الشيخ في قونية ذهب إلى الحاكم وطلب منه أن يعيِّنه قاضياً. ولما لم يكن في مناصب القضاء مكان خالٍ اعتذر إليه الحاكم، ووعده. وعاد الشيخ بعد أيام يطلبُ وظيفة أُخرى، …"
summary:
  ar: "جاء دائن يطالب جحا بدينه، فأرسل جحا زوجته إلى الباب، فقالت إنهم وجدوا طريقة جديدة للكسب من صوف الغنم المارة ليسددوا به، فضحك الدائن، فصاح جحا بأنه ربط شغله في جميزة. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  en: "A creditor comes for his debt, and Juha sends his wife to the door. She says they have found a new way to earn, from the wool of passing sheep, to pay him, and the creditor laughs. Juha calls out that the creditor has tied his business to a sycamore. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  ur: "ایک قرض خواہ اپنا قرض لینے آتا ہے تو جحا بیوی کو دروازے پر بھیج دیتا ہے۔ وہ کہتی ہے کہ انہیں گزرتی بھیڑوں کے اون سے کمانے کا نیا طریقہ مل گیا ہے جس سے وہ ادا کریں گے، تو قرض خواہ ہنس پڑتا ہے۔ جحا آواز دے کر کہتا ہے کہ قرض خواہ نے اپنا کاروبار گولر کے درخت سے باندھ لیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  fr: "Un créancier vient réclamer sa dette, et Juha envoie sa femme à la porte. Elle dit qu'ils ont trouvé une nouvelle façon de gagner de l'argent, avec la laine des moutons qui passent, pour le payer, et le créancier rit. Juha crie que le créancier a attaché son affaire à un sycomore. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  es: "Un acreedor viene a cobrar su deuda y Juha envía a su esposa a la puerta. Ella dice que han encontrado una nueva forma de ganar dinero, con la lana de las ovejas que pasan, para pagarle, y el acreedor se ríe. Juha grita que el acreedor ha atado su negocio a un sicomoro. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  tr: "Bir alacaklı Juha'dan ödeme talep etmeye geldi, bu yüzden Juha karısını kapıya gönderdi. Karısı, borcu ödemek için geçen koyunlardan yün toplayarak para kazanmanın yeni bir yolunu bulduklarını söyledi. Alacaklı güldü ve Juha, işini bir çınar ağacına bağladığını bağırdı. {cite:juha-nawadir-kubra-djuwaydi s. 98}"
  id: "Seorang penagih utang datang menuntut pembayaran dari Juha, jadi Juha menyuruh istrinya ke pintu. Istrinya berkata bahwa mereka telah menemukan cara baru untuk mendapatkan uang dengan mengumpulkan wol dari domba yang lewat untuk melunasi utang. Penagih utang itu tertawa, dan Juha berteriak bahwa dia telah mengikat pekerjaannya ke pohon ara. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
