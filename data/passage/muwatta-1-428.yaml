text: "لا يقطع الصلاة شيء مما يمر بين يدي المصلي"
summary:
  ar: "بلاغ في باب الرخصة في المرور بين يدي المصلي: يروي مالك أنه بلغه أن علي بن أبي طالب قال إنه لا يقطع الصلاة شيء مما يمر بين يدي المصلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق والطحاوي وصلاه من طرق عن أبي إسحاق السبيعي عن الحارث عن علي، وابن أبي شيبة من طريق قتادة عن سعيد بن المسيب عن علي وعثمان بنحوه. {cite:muwatta-maruf-1997 p.222}"
