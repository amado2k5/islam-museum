label: { ar: "الموطأ 428 — بلاغ عن علي: لا يقطع الصلاة شيء مما يمر بين يدي المصلي", en: "Muwatta 428", es: "Muwatta 428", fr: "Muwatta 428", ur: "موطا 428", tr: "Al-Muwatta 428 — Ali'nin rivayetine göre: Namaz kılanın önünden geçen hiçbir şey namazı bozmaz.", id: "Al-Muwatta 428 — Diriwayatkan dari Ali: Tidak ada sesuatu pun yang lewat di depan orang yang sedang shalat yang dapat membatalkan shalatnya." }
text: "لا يقطع الصلاة شيء مما يمر بين يدي المصلي"
summary:
  ar: "بلاغ في باب الرخصة في المرور بين يدي المصلي: يروي مالك أنه بلغه أن علي بن أبي طالب قال إنه لا يقطع الصلاة شيء مما يمر بين يدي المصلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق والطحاوي وصلاه من طرق عن أبي إسحاق السبيعي عن الحارث عن علي، وابن أبي شيبة من طريق قتادة عن سعيد بن المسيب عن علي وعثمان بنحوه. {cite:muwatta-maruf-1997 p.222}"
  tr: "Namaz kılan bir kişinin önünden geçmenin caiz olup olmadığına dair bir rivayet: Malik, Ali ibn Abi Talib'in, namaz kılan bir kişinin önünden geçmenin namazı geçersiz kılmadığını söylediğini işittiğini aktarır. Araştırmacı, bunu Malik'ten Ebu Mus'ab ve Suveyd'in rivayet ettiğini ve Abdül-Razzak ve el-Tahavi'nin de benzer bir ifadeyle, Ebu İshak el-Subey'i'den, el-Harith'ten, Ali'den ve İbn Abi Şeybe'den Katade aracılığıyla, Sa'id ibn el-Musayyab'dan, Ali ve Osman'dan çeşitli rivayet zincirleriyle naklettiğini belirtir. {cite:muwatta-maruf-1997 s.222}"
  id: "Sebuah riwayat mengenai kebolehan melewati orang yang sedang shalat: Malik meriwayatkan bahwa ia mendengar Ali ibn Abi Talib berkata bahwa tidak ada sesuatu pun yang melewati orang yang sedang shalat yang dapat membatalkan shalatnya. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik, dan bahwa Abd al-Razzaq dan al-Tahawi meriwayatkannya melalui berbagai sanad dari Abu Ishaq al-Subay'i, dari al-Harith, dari Ali, dan Ibn Abi Shaybah melalui Qatadah, dari Sa'id ibn al-Musayyab, dari Ali dan Uthman, dengan redaksi yang serupa. {cite:muwatta-maruf-1997 p.222}"
