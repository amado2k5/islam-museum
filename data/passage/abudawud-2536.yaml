label:
  ar: "أبو داود 2536 — عجب ربنا من رجل رجع إلى القتال رغبة فيما عندي"
  en: "Abu Dawud 2536 — Our Lord delights in a man who turned back to fight out of longing for what is with Me"
  ur: "ابو داود 2536 — ہمارا رب اس آدمی پر خوش ہوتا ہے جو میرے پاس والی چیز کی رغبت میں لوٹ آیا"
text: "عجب ربنا من رجل غزا في سبيل الله فانهزم . يعني أصحابه : فعلم ما عليه فرجع حتى أهريق دمه، فيقول الله تعالى لملائكته : انظروا إلى عبدي رجع رغبة فيما عندي وشفقة مما عندي حتى أهريق دمه ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 2536: عجب ربنا من رجل رجع إلى القتال رغبة فيما عندي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 2536: Our Lord delights in a man who turned back to fight out of longing for what is with Me. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 2536: ہمارا رب اس آدمی پر خوش ہوتا ہے جو میرے پاس والی چیز کی رغبت میں لوٹ آیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
