text: "… وعلمهم إياه، وكان الصحابى لا ينكر على أخيه قراءة تتخالف هى وقراءته لقوله -- أنزل القرآن على سبعة أحرف، ولما تفرق الصحابة فى الأمصار اختلفت القراءة، وأصبح هناك سبب للتأليف فى القراءات من ذلك كتاب السبعة فى القراءات. لابن مجاهد …"
summary:
