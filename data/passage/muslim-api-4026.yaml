label: { ar: "صحيح مسلم 4026 — نقص قيراط من الأجر كل يوم", en: "Sahih Muslim 4026 — a qirat lost from the reward each day", ur: "صحیح مسلم 4026 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sahih Muslim 4026 — una qirat perdida de la recompensa cada día", fr: "Sahih Muslim 4026 — une qirat perdue pour la récompense chaque jour", tr: "Sahih Müslim 4026 — Her gün sevaptan bir kırat düşülür.", id: "Sahih Muslim 4026 — Satu qirat dikurangi dari pahala setiap hari" }
text: "… حُجْرٍ قَالَ يَحْيَى أَخْبَرَنَا وَقَالَ الآخَرُونَ، حَدَّثَنَا إِسْمَاعِيلُ، عَنْ مُحَمَّدٍ، - وَهُوَ ابْنُ أَبِي حَرْمَلَةَ - عَنْ سَالِمِ بْنِ عَبْدِ، اللَّهِ عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" مَنِ اقْتَنَى كَلْبًا إِلاَّ كَلْبَ مَاشِيَةٍ أَوْ كَلْبَ صَيْدٍ نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطٌ \". قَالَ عَبْدُ اللَّهِ وَقَالَ أَبُو هُرَيْرَةَ \" أَوْ كَلْبَ حَرْثٍ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4026، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4026 (The Book of Musaqah), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4026، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih Muslim, n.° 4026 (El Libro de Musaqah), habla de una qirat que se pierde de la recompensa cada día. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 4026 (Le Livre de la Musaqah), mentionne une qirat (consigne) perdue chaque jour et donc déduite de la récompense. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "Sahih Müslim'de 4026 numaralı hadis, her gün sevabın bir kırat (bir ağırlık birimi) azaldığından bahseder. Bu, iyi ve kötü ameller listesinde, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte yer alır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4026, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
