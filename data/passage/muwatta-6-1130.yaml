label: { ar: "الموطأ 1130 — مالك: ويوجب ذلك أيضاً الماء الدافق إذا كان من مباشرة، فأما من ذكر شيئاً حتى خرج منه ماء دافق فلا أرى عليه شيئاً", en: "Muwatta 1130", es: "Muwatta 1130", fr: "Muwatta 1130", ur: "موطا 1130", tr: "El-Muvatta 1130 — Malik: Bu, doğrudan temas sonucu oluşan su boşalması için de geçerlidir. Su boşalması gerçekleşene kadar bir şeyden bahseden kimse için ise, ondan istenen bir şey görmüyorum.", id: "Al-Muwatta 1130 — Malik: Ini juga berlaku untuk keluarnya air mani jika terjadi kontak langsung. Adapun orang yang menyebutkan sesuatu hingga keluarnya air mani, saya tidak melihat ada kewajiban yang harus dipenuhi kepadanya." }
summary:
  ar: "قول لمالك: ويوجب ذلك أيضاً الماء الدافق إذا كان من مباشرة، فأما من ذكر شيئاً حتى خرج منه ماء دافق فلا أرى عليه شيئاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1237). {cite:muwatta-maruf-1997 p.515}"
  tr: "Malik şöyle demiştir: Bu, doğrudan temas sonucu oluşan su boşalması için de geçerlidir. Ancak, bir kimse bir şeyden bahseder ve su boşalırsa, onun üzerinde herhangi bir yükümlülük görmüyorum. Araştırmacı, bunu Ebu Mus'ab'ın (1237) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.515}"
  id: "Malik berkata: Hal ini juga berlaku untuk keluarnya air mani jika terjadi akibat kontak langsung. Namun, jika seseorang menyebutkan sesuatu dan mengeluarkan air mani, saya tidak melihat adanya kewajiban baginya. Peneliti menyebutkan bahwa Abu Mus'ab (1237) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.515}"
