label: { ar: "مسلم 2401 — رجل تستحي منه الملائكة", en: "Muslim 2401 — A man of whom the angels are shy" }
text: "دخل أبو بكر فلم يهتش له ولم يبال، ثم دخل عمر فلم يهتش له ولم يبال، ثم دخل عثمان فجلس وسوى ثيابه؛ فقالت عائشة: ما لي لم أرك فزعت لأبي بكر وعمر كما فزعت لعثمان؟ قال: «ألا أستحي من رجل تستحي منه الملائكة؟»"
summary:
  ar: "رواية عائشة في باب فضائل عثمان من صحيح مسلم؛ جلس النبي لدخول عثمان وسوّى ثيابه وقال «ألا أستحي من رجل تستحي منه الملائكة» — أشهر نص في حياء عثمان عند أهل السنة."
