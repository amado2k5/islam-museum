text: "دخل أبو بكر فلم يهتش له ولم يبال، ثم دخل عمر فلم يهتش له ولم يبال، ثم دخل عثمان فجلس وسوى ثيابه؛ فقالت عائشة: ما لي لم أرك فزعت لأبي بكر وعمر كما فزعت لعثمان؟ قال: «ألا أستحي من رجل تستحي منه الملائكة؟»"
summary:
  ar: "رواية عائشة في باب فضائل عثمان من صحيح مسلم؛ جلس النبي لدخول عثمان وسوّى ثيابه وقال «ألا أستحي من رجل تستحي منه الملائكة» — أشهر نص في حياء عثمان عند أهل السنة."
  tr: "Sahih Müslim'de Osman'ın faziletleri bölümünde Aişe'nin rivayeti şöyledir: Peygamberimiz Osman'ın içeri girmesi için oturdu, elbisesini düzeltti ve şöyle dedi: \"Meleklerin bile utandığı bir adamdan ben de utanmamalı mıyım?\" — Bu, Sünniler arasında Osman'ın utangaçlığı hakkında en meşhur rivayettir."
  id: "Riwayat Aisyah dalam bab tentang keutamaan Utsman dalam Sahih Muslim: Nabi duduk untuk mempersilakan Utsman masuk dan merapikan pakaiannya lalu berkata, “Bukankah seharusnya aku merasa malu kepada seorang laki-laki yang bahkan para malaikat pun merasa malu kepadanya?” — teks paling terkenal tentang rasa malu Utsman di kalangan Sunni."
