text: "… أركان الدين لا يجد حلاوة الدين من لا يجد الشح به في قلبه. والله أعلم وهذا هو الأمر الذي يشهد العقل بصحته لأن من اعتقد ديناً ثم لم يكن في نهاية الشح به والإشفاق عليه كان ذلك دلالة على أنه …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 237، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 237, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 237 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Shu'ab al-Iman de al-Bayhaqi, vol. 2, pág. 237, que menciona los pilares del Islam; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 2, page 237, mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İmanın Dalları\" adlı eserinin 2. cildinin 237. sayfasından, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 237, yang menyebutkan rukun Islam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
