text: "وما يعمر من معمر إلى الهرم ، ولا ينقص آخر من عمر الهرم إلا في كتاب ، أي : بقضاء الله قاله الضحاك ، واختاره النحاس . قال : وهو أشبهها بظاهر التنزيل ، والأولى أن يقال ظاهر النظم القرآني"
