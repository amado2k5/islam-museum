text: "… مِنْ أَرْبَعِ: مِنْ عَذَابٍ جَهَنَّمْ. ومِنْ عَذَابِ الْقَبْرِ وَمِنْ فِتْنَةِ المَحْيَا وَالمَمَاتِ. وَمِنْ شَرِّ المسِيحِ الدَّجَّالِ. ومنها الأحاديث في سؤال القبر: كحديث قَتَادَةً عَنْ أَنَسِ بُنِ مَالِكِ أَنَّ رَسُولَ اللهَ قَالَ: إِنَّ الْعَبْدَ إِذَا وُضِعَ فِي قَبْرِهِ، وَتَوَلَّى عَنْهُ أَصْحَابُهُ، …"
