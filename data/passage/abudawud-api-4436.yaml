label: { ar: "سنن أبي داود 4436 — الأب والأبوة", en: "Sunan Abi Dawud 4436 — the father and fatherhood", ur: "سنن ابی داؤد 4436 — باپ اور والدیت", es: "Sunan Abi Dawud 4436 — El padre y la paternidad", fr: "Sunan Abi Dawud 4436 — Le père et la paternité", tr: "Sunan Abi Davud 4436 — Baba ve Babalık", id: "Sunan Abi Dawud 4436 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا صَدَقَةُ بْنُ خَالِدٍ، ح وَحَدَّثَنَا نَصْرُ بْنُ عَاصِمٍ الأَنْطَاكِيُّ، حَدَّثَنَا الْوَلِيدُ، جَمِيعًا قَالاَ حَدَّثَنَا مُحَمَّدٌ، - قَالَ هِشَامٌ مُحَمَّدُ بْنُ عَبْدِ اللَّهِ الشُّعَيْثِيُّ - عَنْ مَسْلَمَةَ بْنِ عَبْدِ اللَّهِ الْجُهَنِيِّ، عَنْ خَالِدِ بْنِ اللَّجْلاَجِ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ بِبَعْضِ هَذَا الْحَدِيثِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4436، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4436 (Prescribed Punishments (Kitab Al-Hudud)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4436، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4436 (Castigos Prescritos (Kitab Al-Hudud)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4436 (Kitab Al-Hudud), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4436 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4436, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
