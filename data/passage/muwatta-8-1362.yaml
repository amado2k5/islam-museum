label: { ar: "الموطأ 1362 — يحيى بن سعيد: أحسن ما سمع مالك من أهل العلم في الحالف بالمشي إلى بيت الله فيحنث", en: "Muwatta 1362" }
summary:
  ar: "يقول يحيى إن أحسن ما سمع مالك من أهل العلم في الرجل يحلف بالمشي إلى بيت الله، أو المرأة، فيحنث، أنه إن مشى الحانث منهما في عمرة، فإنه يمشي حتى يسعى بين الصفا والمروة، فإذا سعى فقد فرغ. وإن جعل على نفسه مشيا في الحج، فإنه يمشي حتى يأتي مكة، ثم يمشي حتى يفرغ من المناسك كلها، ولا يزال ماشيا حتى يفيض. ويقول مالك لا يكون مشي إلا في حج أو عمرة. {cite:muwatta-maruf-1997 p.609}"
