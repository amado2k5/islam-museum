label: { ar: "الموطأ 1362 — يحيى بن سعيد: أحسن ما سمع مالك من أهل العلم في الحالف بالمشي إلى بيت الله فيحنث", en: "Muwatta 1362", es: "Muwatta 1362", fr: "Muwatta 1362", ur: "موطا 1362", tr: "El-Muvatta 1362 — Yahya ibn Said: Malik'in, Allah'ın Evi'ne yürüyerek gideceğine yemin edip sonra yeminini bozan kişi hakkında âlimlerden duyduğu en iyi şey.", id: "Al-Muwatta 1362 — Yahya ibn Saeed: Hal terbaik yang Malik dengar dari para ulama mengenai seseorang yang bersumpah untuk berjalan ke Baitullah lalu mengingkari sumpahnya." }
summary:
  ar: "يقول يحيى إن أحسن ما سمع مالك من أهل العلم في الرجل يحلف بالمشي إلى بيت الله، أو المرأة، فيحنث، أنه إن مشى الحانث منهما في عمرة، فإنه يمشي حتى يسعى بين الصفا والمروة، فإذا سعى فقد فرغ. وإن جعل على نفسه مشيا في الحج، فإنه يمشي حتى يأتي مكة، ثم يمشي حتى يفرغ من المناسك كلها، ولا يزال ماشيا حتى يفيض. ويقول مالك لا يكون مشي إلا في حج أو عمرة. {cite:muwatta-maruf-1997 p.609}"
  tr: "Yahya, Malik'in, Allah'ın Evi'ne (Kâbe'ye) yürüyerek gitmeye yemin eden ve sonra yeminini bozan bir erkek veya kadın hakkında alimlerden duyduğu en iyi görüşün şu olduğunu söylüyor: Eğer yemini bozan kişi Umre sırasında yürürse, Safa ile Merve arasında Sa'i yapana kadar yürümelidir. Sa'i yaptıktan sonra yeminini tamamlamış olur. Eğer Hac sırasında yürümeye yemin ederse, Mekke'ye ulaşana kadar yürümeli, sonra tüm ritüelleri tamamlayana kadar yürümeye devam etmeli ve Mekke'den ayrılana kadar yürümeye devam etmelidir. Malik, yürümenin sadece Hac veya Umre sırasında caiz olduğunu söylüyor. {cite:muwatta-maruf-1997 s.609}"
  id: "Yahya mengatakan bahwa pendapat terbaik yang didengar Malik dari para ulama mengenai seorang pria atau wanita yang bersumpah untuk berjalan kaki ke Baitullah (Ka'bah) dan kemudian mengingkari sumpahnya adalah bahwa jika orang yang mengingkari sumpah tersebut berjalan kaki selama Umrah, mereka harus berjalan kaki hingga melakukan Sa'i antara Safa dan Marwa. Setelah melakukan Sa'i, mereka telah menyelesaikan sumpah mereka. Jika mereka bersumpah untuk berjalan kaki selama Haji, mereka harus berjalan kaki hingga mencapai Mekah, kemudian terus berjalan kaki hingga menyelesaikan semua ritual, dan mereka harus terus berjalan kaki hingga meninggalkan Mekah. Malik mengatakan bahwa berjalan kaki hanya diperbolehkan selama Haji atau Umrah. {cite:muwatta-maruf-1997 p.609}"
