label: { ar: "جامع الترمذي 3143 — الأب والأبوة", en: "Jami' al-Tirmidhi 3143 — the father and fatherhood", ur: "جامع ترمذی 3143 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3143 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3143 — le père et la paternité" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ مَنِيعٍ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا بَهْزُ بْنُ حَكِيمٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّكُمْ مَحْشُورُونَ رِجَالاً وَرُكْبَانًا وَيُجَرُّونَ عَلَى وُجُوهِكُمْ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3143، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3143 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3143، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3143 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3143 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
