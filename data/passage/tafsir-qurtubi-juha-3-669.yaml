text: "… للّعن؛ فإذا تاب منها وأقلع وطهّره الحدّ فلا لعنة تتوجّه عليه. وبيّن هذا قولُه ل: إذا زَنَّت أَمَة أحدِكم فليجلدها الحدّ ولا يُثَرِّب. راجع نعيمان: هو أبن عمرو بن رفاعة، شهد العقبة وبدراً والمشاهد بعدها، وكان كثير المزاح، يضحك النبيّ …"
