label:
  ar: "سنن النسائي، كتاب التطبيق"
  en: "Sunan al-Nasa'i, Book 12: The Book of The At-Tatbiq (Clasping One's Hands Together)"
  ur: "سنن نسائی، کتاب التطبیق"
  es: "Sunan al-Nasa'i, Libro 12: El Libro del At-Tatbiq (Juntar las manos)"
  fr: "Sunan al-Nasa'i, Livre 12: Le Livre de l'At-Tatbiq (Joindre ses mains)"
  tr: "Sunan an-Nasa'i, Uygulama Kitabı"
  id: "Sunan an-Nasa'i, Kitab Penerapan"
summary:
  ar: "القسم 12 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التطبيق»، ويضم فيها النصوص من 1029 إلى 1178 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 12 of Sunan al-Nasa'i (The Book of The At-Tatbiq (Clasping One's Hands Together)) in the division of the open hadith dataset the museum took its reports from: reports 1029 to 1178 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 12، عنوان «کتاب التطبیق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1029 تا 1178۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 12 de Sunan al-Nasa'i (El Libro del At-Tatbiq (Junto de las Manos)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1029 al 1178 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 12 du Sunan al-Nasa'i (Le Livre de l'At-Tatbiq, ou l'acte de joindre les mains) correspond aux hadiths 1029 à 1178, selon la numérotation du recueil ouvert utilisé par le musée. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanı bölümünde yer alan Sunan al-Nasa'i'nin 12. bölümü \"Uygulama Kitabı\" başlığını taşımakta olup, 1029'dan 1178'e kadar olan metinleri sırasıyla numaralandırarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 12 dari Sunan al-Nasa'i, dalam bagian tentang basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Penerapan\" dan berisi teks-teks dari tahun 1029 hingga 1178, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
