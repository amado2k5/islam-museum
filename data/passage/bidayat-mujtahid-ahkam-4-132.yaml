text: "… من الباب الثاني: حكم الأذان اختلف العلماء في حكم الأذان هل هو واجب أو سنة مؤكدة؟ وإن كان واجباً فهل هو من فروض الأعيان، أو من فروض الكفاية؟ فقيل عن مالك: إن الأذان هو فرض على مساجد الجماعات، وقيل: سنة …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 132، يرد فيه ذكر ما فُرض على الناس، والفرض، وفرض العين، وفرض الكفاية، والواجب، والسنن المؤكدة والرواتب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 132, whose wording mentions what was made obligatory on people, the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya), the obligatory (wajib), the emphasised and regular sunnas; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 132 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، فرضِ عین، فرضِ کفایہ، واجب، سننِ مؤکدہ اور رواتب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 132, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), l'obligatoire (wajib), les sunnas appuyées et régulières ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 132, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), lo obligatorio (wajib), las sunnas enfatizadas y regulares; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Rüşd'ün *Bidayat al-Mujtahid* adlı eserinin 4. cildinin 132. sayfasından bir alıntı, farz olan fiiller, bireysel yükümlülükler, toplu yükümlülükler, görevler, tasdik sünnetler ve düzenli namazlar da dahil olmak üzere insanlar üzerine farz olan şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Bidayat al-Mujtahid* karya Ibnu Rushd, Jilid 4, halaman 132, membahas tentang apa yang wajib dilakukan oleh manusia, termasuk amalan wajib, kewajiban individu, kewajiban kolektif, tugas, Sunnah yang telah dikonfirmasi, dan shalat rutin. Kutipan ini berasal dari edisi yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, tugas, perbuatan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
