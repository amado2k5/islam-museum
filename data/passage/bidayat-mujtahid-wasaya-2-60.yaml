text: "… في الموطأ عن أبي سعيد الخدري في قصة قدومه من السفر، قيل له : إن رسول اللّٰه علالع قال نهيتكم عن لحوم الأضحى بعد ثلاث فكلوا، وتصدقوا، وادخروا، ونهيتكم عن الانتباذ. فانتبذوا، وكل مسكر حرام، ونهيتكم عن زيارة القبور، فزوروها، …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 60، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 60, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 60 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de Bidayat al-Mujtahid de Ibn Rushd, volumen 2, pág. 60, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Bidayat al-Mujtahid d'Ibn Rushd (tome 2, p. 60), mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 2. cildinin 60. sayfasından bir alıntıda, mezar, türbe ve kutsal mekandan bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve kutsal mekanlar araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 2, halaman 60, menyebutkan tentang pemakaman, kuburan, dan makam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
