text: "… أخبرني عن الإسلام. قال: الإسلام: أن تشهد أن لا إله إلا اللّٰه وأن محمدًا رسول الله، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت إن استطعت إليه سيلا. قال: صلقت؛ فعجبنا له يسأله ويصدقه! قال: فأخبرني عن الإيمان. قال: أن …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 4، ص 13، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 4, p. 13, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 4، ص 13 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 4, pág. 13, que menciona el Islam definido por sus actos, la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 4, page 13, qui définit l'islam par ses actes: la prière, la zakat, le jeûne et le pèlerinage (mentionnés ensemble), le témoignage, la prière et la zakat, la question de la foi et sa réponse. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Resimli Mişkat el-Masabih'in 4. cildinin 13. sayfasından bir alıntı, İslam'ı namaz, zekât, oruç ve Hac gibi ibadetlerle, ayrıca iman ikrarı, namaz ve zekâtla tanımlamakta ve imanla ilgili soruları ve cevaplarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 4, halaman 13, mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat, dan membahas pertanyaan-pertanyaan tentang iman dan jawabannya. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
