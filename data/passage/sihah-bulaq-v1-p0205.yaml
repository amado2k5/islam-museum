text: |-
  مادة اعز ساقطة من جل النسخ
  كالترجم
  ١٤٣٦
  أباب الزاى»
  )من)
  خبطا بأخفاف نقال اللبز ز لتزت الشى لتزامثل ركزته ركزا لجز اللجز مقلوب
  اللزج قاله ابن السكيت فى كتاب القلب والابدال وأنشدلابن مقبل
  يعلون بالمردقوش الورد ضاحية * على سغابيب مأء الضالة اللجز
  ( لحز اللحز البخيل الضبق انخلق والملاحز المضايق وتلاحزااقوم فى القول اذا تعا وصوا
  ( لزز (ه يلزه لزاولززا أى شده وألصقه وكزلزا تساع له ورجل ملزشديد الخصومة لروملما
  طالب قال رؤية
  ولا إمرؤد وجدل ملز انماخفض مازاعلى الجوار ويقال فلان
  لزازخصم ومنه لزاز الباب واللزائر الجناجن قال الراجز
  ذى مى قويان عن اللزائر
  والملز المجتمع الخلق الشديد الاسر وقد لرزه اللّٰه ولاززته لاصقته ⁦(لعز)⁩ لعز المرأة وطئها
  والناقة فصياه الطعته (اغز ألغزفى كلا مع اذا عمى مراده والاسم النغز يقسال اغر
  ولغز والمع الالغاز مثل رطب وأرطاب وأصل اللغز جر لليربوع بين القاصعاء والنافقاء يحفو
  مستقيما الى أسفل ثم يعدل عن يمينه وشماله عروضا يعترضهافيخقى مكانه بتالان الالغاز
  واللغيزى بتشديد الفين مثل اللغز والياءليست للتصغيرلان ي( التصغير لاتسكون رابعة وانما
  هى بنزلة خضارى للزرع وشقارنبت لكز أبو عبيدة اللكز الضرب بالجمسع على
  الصدروقال أبوز يدفى جميع الجسدوواهم فى المثل يحمل شن ويفدّى لكيزهما ابنا أفصى
  ابن عبد القيسبن أنصى بن دعمى" بن جديلة ⁦(لمز)⁩ اللمزالعيب وأصل الاشارة بالعين
  ونحوها وقدازه يلزه ويلزملمزا وقرى بح ماقوله تعالى ومنهم من يلزل فى الصدفات ورجل
  لمازوازة أى عباب ويقال أيضالمزه يلزم لمزا اذاضر به ودفعه ل ز لهزت القوم أى
  خالطتهم ودخلت بينهم ولهزه القتيرأى خالطهِ الشيب فهوملهوزثم هوأشمط ثم أشبب واللهز
  الضرب بجمع اليد فى الصدر منل المكز عن أبى عبيدة وقال أيوزيد هو بابمع فى اللهازم
  والرقبة والرجلملهز بكسر الميم قال الراجز
  أكل يوم لك شاطنان * على از البيرملهزان * اذا يقوت الضرب يحذفان
  واهزه بالرمح طعنه فى صدره واهز الفصيل ضرع أمه اذاضربه برأسه عند الرضاع
  ودائرة اللاهزالتى تكون على اللهزمة وتكره ⁦(لوز)⁩ الاوزة واحدة الاوز وأرض
  ملازة فيها أشجار اللوز
  سل الم) رز ) مرره غيرزه مر زا أى قرصه بأطراف أصابعه قرصارفيقا
  ليس بالاظفار واذا أوجع المرزفهو حينندّرص عن أبى عبيد يقال امرزلى من هذا
  العجيز مرزة أى اقطع لى منه قطعة وامترزت عرض فلان أى تلت منه عزز) عزه يزه
  مزاومزازة أى مصه والمزة المرة الواحدة وفى الحسديث لا تحتزم المزة ولا المزنان بعنى
  فى الرضاع والتمزز تصص الشراب قليسلا قليلا مثل التمزر وشراب مزورمان من بين الحاو
  والحامض والمزة بالضم الجر التى فيهاطعم ٣وضة ولاخير فيها والمزة بالفتج انلهر اللذيذة الطعم
  سميت بذلكْ للذعها اللسان قال إلاعشى
  نازعتهم قصب الريحان متكنا وقهوة مزة راووقها حضل
  ولا يقال مزة بالكسر والمزاء بالضم ضرب من الاشربة وهوفعسلاء بفتح العيز فأدغم لان
  فعلاء
