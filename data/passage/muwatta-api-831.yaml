label: { ar: "موطأ مالك 831 — اليتيم وفقد الأب", en: "Muwatta Malik 831 — the orphan and the father lost", ur: "موطأ مالک 831 — یتیم اور باپ کی موت", es: "Muwatta Malik 831 — el huérfano y el padre perdido", fr: "Muwatta Malik 831 — l'orphelin et le père perdus", tr: "Muwatta Malik 831 — Yetim ve Babanın Kaybı", id: "Muwatta Malik 831 — Anak Yatim dan Kehilangan Ayah" }
text: "… وَالْهَدْىُ. وَسُئِلَ مَالِكٌ عَنِ الرَّجُلِ يَلْقَاهُ الرَّجُلُ بَيْنَ الصَّفَا وَالْمَرْوَةِ فَيَقِفُ مَعَهُ يُحَدِّثُهُ فَقَالَ لاَ أُحِبُّ لَهُ ذَلِكَ. قَالَ مَالِكٌ وَمَنْ نَسِيَ مِنْ طَوَافِهِ شَيْئًا أَوْ شَكَّ فِيهِ فَلَمْ يَذْكُرْ إِلاَّ وَهُوَ يَسْعَى بَيْنَ الصَّفَا وَالْمَرْوَةِ فَإِنَّهُ يَقْطَعُ سَعْيَهُ ثُمَّ يُتِمُّ طَوَافَهُ بِالْبَيْتِ عَلَى مَا يَسْتَيْقِنُ وَيَرْكَعُ رَكْعَتَىِ الطَّوَافِ ثُمَّ يَبْتَدِئُ سَعْيَهُ بَيْنَ الصَّفَا وَالْمَرْوَةِ."
summary:
  ar: "حديث في موطأ مالك، رقم 831، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 831 (Hajj), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 831، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 831 (Hajj), menciona al huérfano y al padre desaparecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un récit du Muwatta Malik, n° 831 (Hajj), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce récit avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Malik'in Muwatta adlı eserinde 831 numaralı hadis, yetimlerden ve babasızlık durumundan bahsetmektedir. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 831, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Hadits ini dikumpulkan oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
