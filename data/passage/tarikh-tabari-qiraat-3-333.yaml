text: ". سنة الجُوزجان وبث الغارات وذلك ان لحارث بن سيج اخبره انه لا نهوض بأسد وانه لملا يبق معه كبير، جند فقال ا البغْترى. ابن مجاهد مولى بنى شيبان أبل بث الخيول حتّى تنزل و الجوزجان فلما بث الخيل قال …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 3، ص 333، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 3, p. 333, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 3، ص 333 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Rusul wa-l-Muluk de al-Tabari, volumen 3, pág. 333, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Tarikh al-Rusul wa-l-Muluk d'al-Tabari, volume 3, page 333, mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Taberi'nin Peygamberler ve Krallar Tarihi, Resimli Cilt 3, sayfa 333'ten bir alıntıda Kur'an okuyucularından bahsedilmektedir; makine tarafından okunabilir taranmış versiyonda, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Para Nabi dan Raja karya Al-Tabari, Jilid 3 Bergambar, hlm. 333, menyebutkan para pembaca; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
