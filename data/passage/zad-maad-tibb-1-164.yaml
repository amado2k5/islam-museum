  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 164, that mentions ruqya recited over the sick, illness and the sick, visiting the sick; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 164 کا اقتباس جس میں رقیہ، بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
