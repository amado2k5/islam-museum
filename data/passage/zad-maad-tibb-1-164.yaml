text: "يَسْتَرْقُونَ البخاري:، ومسلم:. فقوله في الأوقات، بل شرع لامته عيادة المرضى ليلاً ونهاراً، الحديث: لا يرقون غلط من الراوي، سمعت شيخ وفي سائر الأوقات. وفي المسند عنه: إِذا عَادَ وكان يدنو من المريض، ويجلِسُ عند رأسه، م ويسألُه عن حاله، …"
summary:
