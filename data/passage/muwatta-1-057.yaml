label: { ar: "الموطأ 57 — عثمان يأكل خبزاً ولحماً ثم يصلي ولا يتوضأ", en: "Muwatta 57", es: "Muwatta 57", fr: "Muwatta 57", ur: "موطا 57", tr: "Al-Muwatta 57 — Osman ekmek ve et yedikten sonra abdest almadan namaz kılıyor.", id: "Al-Muwatta 57 — Uthman makan roti dan daging, lalu shalat tanpa berwudhu." }
summary:
  ar: "أثر يرويه مالك عن ضمرة بن سعيد المازني عن أبان بن عثمان، في باب ترك الوضوء مما مست النار: أكل عثمان بن عفان خبزاً ولحماً ثم مضمض وغسل يديه ومسح بهما وجهه ثم صلى ولم يتوضأ. ويذكر المحقق أنه روي بمعناه مرفوعاً من حديث سعيد بن المسيب عن عثمان بإسناد حسن عند عبد الرزاق وأحمد (1/70) والبزار. {cite:muwatta-maruf-1997 p.62}"
  tr: "Malik'in Damrah ibn Sa'id al-Mazini'den, o da Aban ibn Uthman'dan rivayet ettiği, ateşte pişirilmiş yemek yedikten sonra abdest almamak bölümünde yer alan bir rivayete göre: Uthman ibn Affan ekmek ve et yedikten sonra ağzını çalkaladı, ellerini yıkadı, yüzünü elleriyle sildi ve abdest almadan namaz kıldı. Editör, benzer bir rivayetin, Sa'id ibn al-Musayyab'dan, o da Uthman'dan rivayet edilen ve sağlam bir isnad zinciriyle Peygamberimize kadar uzanan bir rivayet zinciriyle Abd al-Razzaq, Ahmed (1/70) ve al-Bazzar tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.62}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Damrah ibn Sa'id al-Mazini atas otoritas Aban ibn Uthman, dalam surah tentang tidak berwudhu setelah makan makanan yang dimasak di atas api: Uthman ibn Affan makan roti dan daging, kemudian berkumur, mencuci tangannya, mengusap wajahnya dengan kedua tangannya, lalu shalat tanpa berwudhu. Editor menyebutkan bahwa riwayat serupa dinarasikan dengan sanad yang dapat ditelusuri kembali kepada Nabi (shalawat dan salam kepadanya) atas otoritas Sa'id ibn al-Musayyab atas otoritas Uthman, dengan sanad yang sahih, oleh Abd al-Razzaq, Ahmad (1/70), dan al-Bazzar. {cite:muwatta-maruf-1997 p.62}"
