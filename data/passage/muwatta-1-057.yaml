label: { ar: "الموطأ 57 — عثمان يأكل خبزاً ولحماً ثم يصلي ولا يتوضأ", en: "Muwatta 57" }
summary:
  ar: "أثر يرويه مالك عن ضمرة بن سعيد المازني عن أبان بن عثمان، في باب ترك الوضوء مما مست النار: أكل عثمان بن عفان خبزاً ولحماً ثم مضمض وغسل يديه ومسح بهما وجهه ثم صلى ولم يتوضأ. ويذكر المحقق أنه روي بمعناه مرفوعاً من حديث سعيد بن المسيب عن عثمان بإسناد حسن عند عبد الرزاق وأحمد (1/70) والبزار. {cite:muwatta-maruf-1997 p.62}"
