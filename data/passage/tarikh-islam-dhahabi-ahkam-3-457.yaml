text: "… اللّٰه وأطيعوا الرسول الخ. وصحيح مسلم كتاب الإمارة، باب وجوب طاعة الامراء في غير معصية الخ. صحيح البخاري : كتاب الأحكام ؛ باب السمع والطاعة للإمام ما لم تكن معصية وصحيح مسلم كتاب الإمارة باب وجوب طاعة الأمراء :"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 3، ص 457، يرد فيه ذكر من أطاع الله ورسوله، والوجوب، والسمع والطاعة، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 3, p. 457, whose wording mentions whoever obeys God and His Messenger, obligation (wujub), hearing and obeying, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 3، ص 457 کا اقتباس جس میں جس نے اللہ اور اس کے رسول کی اطاعت کی، وجوب، سننا اور ماننا، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam de al-Dhahabi, volume numérisé 3, p. 457, dont le texte mentionne celui qui obéit à Dieu et à Son Messager, l'obligation (wujub), écouter et obéir, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen digitalizado 3, p. 457, cuyo texto menciona quien obedece a Dios y a Su Mensajero, la obligatoriedad (wujub), oír y obedecer, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Dhahabi'nin *İslam Tarihi* adlı eserinin 3. cildinin 457. sayfasından bir alıntı, Allah'a ve Resulüne itaat edenlerden, itaatin yükümlülüğünden ve işitme ve itaat kavramlarından bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu metin, farz olan fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 3, halaman 457, menyebutkan tentang orang-orang yang taat kepada Allah dan Rasul-Nya, kewajiban ketaatan, dan konsep mendengar dan menaati. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
