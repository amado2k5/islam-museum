label: { ar: "الموطأ 2748 — أبو هريرة: النبي يسأل أصحابه عن الرؤيا بعد صلاة الغداة وليس بعده من النبوة إلا الرؤيا الصالحة", en: "Muwatta 2748", ur: "موطأ 2748 — ابو ہریرہ: نبی فجر کے بعد خواب پوچھتے", es: "Muwatta 2748", fr: "Muwatta 2748", tr: "El-Muvatta 2748 — Ebu Hurayra: Peygamber, sabah namazından sonra sahabelerine rüyalar hakkında sorar ve bundan sonra salih rüyalar dışında peygamberlik olmaz.", id: "Al-Muwatta 2748 — Abu Hurairah: Nabi bertanya kepada para sahabatnya tentang mimpi setelah shalat subuh, dan tidak ada kenabian setelah itu kecuali mimpi-mimpi yang saleh." }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن زفر بن صعصعة بن مالك عن أبيه عن أبي هريرة أن رسول الله كان إذا انصرف من صلاة الغداة يقول: هل رأى أحد منكم الليلة رؤيا؟ ويقول: ليس يبقى بعدي من النبوة إلا الرؤيا الصالحة. {cite:muwatta-maruf-1997 p.546}"
  ur: "موطأ میں حدیث، نمبر 2748: ابو ہریرہ سے کہ نبی فجر کی نماز کے بعد پوچھتے تھے: «کیا تم میں سے کسی نے آج رات خواب دیکھا؟» اور کہتے تھے: «میرے بعد نبوت میں سے کچھ نہیں رہے گا سوائے نیک خواب کے»۔"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan, o da Züfer ibn Sa'sa'a ibn Malik'ten, o da babasından, o da Ebu Hurayra'dan rivayet eder ki, Allah Resulü sabah namazını bitirdiğinde şöyle derdi: \"Aranızdan dün gece rüya gören oldu mu?\" Ve şöyle derdi: \"Benden sonra peygamberlikten geriye salih rüyalardan başka bir şey kalmayacak.\" {cite:muwatta-maruf-1997 s.546}"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha, dari Zufar ibn Sa'sa'a ibn Malik, dari ayahnya, dari Abu Hurayra, bahwa ketika Rasulullah SAW selesai shalat subuh, beliau berkata: \"Apakah ada di antara kalian yang bermimpi tadi malam?\" Dan beliau menjawab: \"Tidak ada sisa kenabian setelahku kecuali mimpi-mimpi yang baik.\" {cite:muwatta-maruf-1997 p.546}"
