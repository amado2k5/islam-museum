label: { ar: "الموطأ 1728 — يحيى بن سعيد عن سليمان بن يسار: اختلف عبد الله بن عباس وأبو سلمة في المرأة تنفس بعد وفاة زوجها بليال، فأرسلوا كريبا إلى أم سلمة، فأخبر أنها قالت إن سبيعة وضعت بليال، فقال النبي قد حللت", en: "Muwatta 1728" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار أن عبد الله بن عباس وأبا سلمة بن عبد الرحمن بن عوف اختلفا في المرأة تنفس بعد وفاة زوجها بليال. فقال أبو سلمة إذا وضعت ما في بطنها فقد حلت، وقال ابن عباس آخر الأجلين. فجاء أبو هريرة فقال أنا مع ابن أخي، يعني أبا سلمة. فبعثوا كريبا مولى عبد الله بن عباس إلى أم سلمة زوج النبي يسألها، فجاءهم فأخبرهم أنها قالت وضعت سبيعة الأسلمية بعد وفاة زوجها بليال، فذكرت ذلك لرسول الله فقال قد حللت فانكحي من شئت. قال مالك وهذا الأمر الذي لم يزل عليه أهل العلم عندنا. {cite:muwatta-maruf-1997 p.105}"
