label: { ar: "الموطأ 1728 — يحيى بن سعيد عن سليمان بن يسار: اختلف عبد الله بن عباس وأبو سلمة في المرأة تنفس بعد وفاة زوجها بليال، فأرسلوا كريبا إلى أم سلمة، فأخبر أنها قالت إن سبيعة وضعت بليال، فقال النبي قد حللت", en: "Muwatta 1728", es: "Muwatta 1728", fr: "Muwatta 1728", ur: "موطا 1728", tr: "El-Muvatta 1728 — Yahya ibn Sa’id, Süleyman ibn Yasar’dan rivayetle: Abdullah ibn Abbas ve Ebu Seleme, kocasının ölümünden birkaç gece sonra doğum yapan bir kadın hakkında ihtilafa düştüler. Bunun üzerine Kurayb’ı Ümmü Seleme’ye gönderdiler ve o da Ümmü Seleme’nin “Subay’ah birkaç gece önce doğum yaptı” dediğini bildirdi. Peygamberimiz şöyle buyurdu: “O artık özgürdür.”", id: "Al-Muwatta 1728 — Yahya ibn Sa’id berdasarkan riwayat Sulayman ibn Yasar: Abdullah ibn Abbas dan Abu Salama berselisih pendapat mengenai seorang wanita yang melahirkan beberapa malam setelah kematian suaminya. Maka mereka mengutus Kurayb kepada Umm Salama, dan ia melaporkan bahwa Umm Salama berkata bahwa Subay’ah telah melahirkan beberapa malam yang lalu. Nabi bersabda, “Dia sekarang bebas.”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار أن عبد الله بن عباس وأبا سلمة بن عبد الرحمن بن عوف اختلفا في المرأة تنفس بعد وفاة زوجها بليال. فقال أبو سلمة إذا وضعت ما في بطنها فقد حلت، وقال ابن عباس آخر الأجلين. فجاء أبو هريرة فقال أنا مع ابن أخي، يعني أبا سلمة. فبعثوا كريبا مولى عبد الله بن عباس إلى أم سلمة زوج النبي يسألها، فجاءهم فأخبرهم أنها قالت وضعت سبيعة الأسلمية بعد وفاة زوجها بليال، فذكرت ذلك لرسول الله فقال قد حللت فانكحي من شئت. قال مالك وهذا الأمر الذي لم يزل عليه أهل العلم عندنا. {cite:muwatta-maruf-1997 p.105}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Abdullah ibn Abbas ile Ebu Selama ibn Abdülrahman ibn Avf, kocasının ölümünden birkaç gece sonra doğum yapan bir kadın hakkında ihtilafa düştüler. Ebu Selama, kadının çocuğunu doğurduktan sonra yeniden evlenmekte serbest olduğunu söyledi. İbn Abbas ise iki bekleme süresinden daha geç olanının geçerli olduğunu söyledi. Sonra Ebu Hurayra geldi ve \"Yeğenime katılıyorum\" dedi, yani Ebu Selama'ya. Bunun üzerine Abdullah ibn Abbas'ın azatlı kölesi Kurayb'ı, Peygamberin eşi Ümmü Selama'ya sorması için gönderdiler. Kurayb geldi ve Ümmü Selama'nın şöyle dediğini bildirdi: \"Subey'a el-Aslamiyya, kocasının ölümünden birkaç gece sonra doğum yaptı. Bunu Allah'ın Resulü'ne anlattım ve o da 'Yeniden evlenmekte serbestsin, dilediğinle evlen' dedi.\" Malik dedi ki: \"Bu, aramızdaki âlimlerin her zaman savunduğu hükümdür.\""
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa Abdullah ibn Abbas dan Abu Salama ibn Abd al-Rahman ibn Awf berbeda pendapat mengenai seorang wanita yang melahirkan beberapa malam setelah kematian suaminya. Abu Salama berkata bahwa setelah melahirkan anaknya, ia bebas untuk menikah lagi. Ibnu Abbas berkata bahwa masa iddah yang lebih akhir dari dua masa iddah tersebut yang berlaku. Kemudian Abu Hurayra datang dan berkata, \"Aku setuju dengan keponakanku,\" maksudnya Abu Salama. Maka mereka mengutus Kurayb, budak yang dibebaskan oleh Abdullah ibn Abbas, kepada Umm Salama, istri Nabi, untuk bertanya kepadanya. Kurayb datang dan memberi tahu mereka bahwa Umm Salama berkata, \"Subay'a al-Aslamiyya melahirkan beberapa malam setelah kematian suaminya. Aku menyampaikan hal ini kepada Rasulullah, dan beliau bersabda, 'Kamu bebas untuk menikah lagi, maka menikahlah dengan siapa pun yang kamu inginkan.'\" Malik berkata, \"Inilah hukum yang selalu dipegang oleh para ulama di antara kita.\""
