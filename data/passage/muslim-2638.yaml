label: { ar: "مسلم 2638 — الأرواح جنود مجندة", en: "Muslim 2638 — Souls are conscripted soldiers", es: "Musulmán 2638 — Las almas son soldados reclutados", fr: "Muslim 2638 — Les âmes sont des soldats enrôlés de force", ur: "مسلم 2638 - روحیں بھرتی سپاہی ہیں۔", tr: "Müslim 2638 — Ruhlar, askere alınmış askerler gibidir.", id: "Muslim 2638 — Jiwa itu seperti tentara yang direkrut" }
text: "قال رسول الله: الأرواح جنود مجندة، فما تعارف منها ائتلف، وما تناكر منها اختلف"
summary:
  ar: "رواية أبي هريرة في باب الأرواح جنود مجندة من كتاب البر والصلة والآداب في صحيح مسلم؛ وفي رواية أخرى يسبقها «الناس معادن كمعادن الفضة والذهب، خيارهم في الجاهلية خيارهم في الإسلام إذا فقهوا»."
  tr: "Ebu Hurayra'nın Sahih Müslim'deki Salihlik, Akrabalık ve Ahlak Kitabı'nda ruhların askere alınmış askerlere benzetilmesiyle ilgili rivayeti; ve \"İnsanlar gümüş ve altın madenleri gibidir; İslam öncesi dönemdeki en iyileri, anladıkları takdirde İslam'da da en iyileridir.\" ifadesiyle başlayan başka bir rivayet."
  id: "Riwayat Abu Hurairah dalam bab tentang jiwa yang seperti tentara rekrutan dari Kitab Kebajikan, Kekerabatan, dan Adab dalam Sahih Muslim; dan dalam riwayat lain yang diawali dengan \"Manusia itu seperti tambang perak dan emas, orang-orang terbaik di zaman pra-Islam adalah orang-orang terbaik di zaman Islam jika mereka mengerti.\""
