label: { ar: "صحيح البخاري 5256 — الأب والأبوة", en: "Sahih al-Bukhari 5256 — the father and fatherhood", ur: "صحیح بخاری 5256 — باپ اور والدیت", es: "Sahih al-Bukhari 5256 — El padre y la paternidad" }
text: "وَقَالَ الْحُسَيْنُ بْنُ الْوَلِيدِ النَّيْسَابُورِيُّ عَنْ عَبْدِ الرَّحْمَنِ، عَنْ عَبَّاسِ بْنِ سَهْلٍ، عَنْ أَبِيهِ، وَأَبِي، أُسَيْدٍ قَالاَ تَزَوَّجَ النَّبِيُّ أُمَيْمَةَ بِنْتَ شَرَاحِيلَ، فَلَمَّا أُدْخِلَتْ عَلَيْهِ بَسَطَ يَدَهُ إِلَيْهَا فَكَأَنَّهَا كَرِهَتْ ذَلِكَ فَأَمَرَ أَبَا أُسَيْدٍ أَنْ يُجَهِّزَهَا وَيَكْسُوَهَا ثَوْبَيْنِ رَازِقِيَّيْنِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5256، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5256 (Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5256، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5256 (Divorcio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
