label: { ar: "الموطأ 379 — أم سلمة: تصلي المرأة في الخمار والدرع السابغ", en: "Muwatta 379", es: "Muwatta 379", fr: "Muwatta 379", ur: "موطا 379", tr: "Al-Muwatta 379 — Umm Salamah: Bir kadın başörtüsü ve uzun bir elbise ile namaz kılabilir.", id: "Al-Muwatta 379 — Umm Salamah: Seorang wanita boleh shalat dengan mengenakan jilbab dan pakaian panjang." }
text: "تصلي في الخمار والدرع السابغ إذا غيب ظهور قدميها"
summary:
  ar: "أثر يرويه مالك عن محمد بن زيد بن قنفذ عن أمه، في باب الرخصة في صلاة المرأة في الدرع والخمار: سألت أم سلمة زوج النبي عما تصلي فيه المرأة من الثياب، فقالت: تصلي في الخمار والدرع السابغ إذا غطى ظهور قدميها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند أبي داود (639)، وأن عبد الرحمن بن عبد الله بن دينار رفعه إلى النبي عند أبي داود (640) وهي رواية مرجوحة لضعفه وتفرده، إذ وقفه مالك وبكر بن مضر وحفص بن غياث وإسماعيل بن جعفر وابن أبي ذئب وابن إسحاق على أم سلمة كما قال أبو داود. {cite:muwatta-maruf-1997 p.204}"
  tr: "Malik'in, Muhammed ibn Zeyd ibn Kunfudh'dan, onun annesinden rivayet ettiği, bir kadının uzun elbise ve başörtüsüyle namaz kılmasına ilişkin bölümde yer alan bir rivayete göre: Peygamberimizin eşi Ümmü Seleme'ye, bir kadının namaz kılarken giymesi gereken kıyafet sorulmuş. O da şöyle cevap vermiş: \"Başörtüsü ve ayaklarının üstünü örten uzun bir elbiseyle namaz kılabilir.\" Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve el-Ka'nebi tarafından Ebu Davud'da (639) nakledildiğini ve Abdurrahman ibn Abdullah ibn Dinar'ın da Ebu Davud'da (640) bunu Peygamberimize dayandırdığını belirtiyor. Malik, Bekr ibn Mudar, Hafs ibn Gıyas, İsmail ibn Cafer, İbn Ebî Zîb ve İbn İshak'ın, Ebû Dâvûd'un belirttiği gibi, Ümmü Seleme'ye isnat ettikleri gibi bu, zayıflığı ve müstakil bir rivayet olması sebebiyle zayıf bir rivayettir. {cite:muwatta-maruf-1997 s.204}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Muhammad ibn Zayd ibn Qunfudh, atas otoritas ibunya, dalam surah tentang keringanan bagi wanita untuk shalat dengan mengenakan pakaian panjang dan jilbab: Umm Salamah, istri Nabi, ditanya tentang pakaian yang harus dikenakan wanita ketika shalat. Dia menjawab: “Dia boleh shalat dengan mengenakan jilbab dan pakaian panjang yang menutupi bagian atas kakinya.” Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwayd, dan al-Qa’nabi dalam Abu Dawud (639), dan bahwa ‘Abd al-Rahman ibn ‘Abd Allah ibn Dinar menelusurinya kembali kepada Nabi dalam Abu Dawud (640). Ini adalah riwayat yang lemah karena kelemahannya dan merupakan riwayat yang tersendiri, sebagaimana Malik, Bakr ibn Mudar, Hafs ibn Ghiyath, Isma’il ibn Ja’far, Ibnu Abi Dhi’b, dan Ibnu Ishaq menghubungkannya dengan Ummu Salamah, sebagaimana dinyatakan oleh Abu Dawud. {mengutip:muwatta-maruf-1997 hal.204}"
