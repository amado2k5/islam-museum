label: { ar: "الموطأ 379 — أم سلمة: تصلي المرأة في الخمار والدرع السابغ", en: "Muwatta 379" }
text: "تصلي في الخمار والدرع السابغ إذا غيب ظهور قدميها"
summary:
  ar: "أثر يرويه مالك عن محمد بن زيد بن قنفذ عن أمه، في باب الرخصة في صلاة المرأة في الدرع والخمار: سألت أم سلمة زوج النبي عما تصلي فيه المرأة من الثياب، فقالت: تصلي في الخمار والدرع السابغ إذا غطى ظهور قدميها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند أبي داود (639)، وأن عبد الرحمن بن عبد الله بن دينار رفعه إلى النبي عند أبي داود (640) وهي رواية مرجوحة لضعفه وتفرده، إذ وقفه مالك وبكر بن مضر وحفص بن غياث وإسماعيل بن جعفر وابن أبي ذئب وابن إسحاق على أم سلمة كما قال أبو داود. {cite:muwatta-maruf-1997 p.204}"
