text: "… أن اكتوى، وكان يأتيه آتٍ يُنبههُ أي أمر بالجمع بينهما. وقد كان يسلّم علي حتى اكتويت، ثم تركت الكي فعاد معنى الحديث ان عمران بن الحصين - - كانت به بواسير، فكان يصبر على ألمها، وكانت الملائكة تسلم عليه، فاكتوى، …"
