text: "… مع الغرور، وهو المنذر بن النعمان، وقد كان رسول اللّه، وَلِلفِ بعث العلاء بن الحضرميّ قبل الفتح إلى المنذر بن ساوي العبد، فأسلم وحسُن إسلامه، ثمّ هلك بعد وفاة رسول اللّٰه، الي، وقبل ردّة أهل البحرين، والعلاء أمير لرسول اللّٰه …"
summary:
