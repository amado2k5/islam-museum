label: { ar: "الموطأ 1304 — مالك: الإبل والبقر والغنم بمنزلة الطعام يأكل منها المسلمون في أرض العدو، ولا يدخر أحد منها شيئا يرجع به إلى أهله", en: "Muwatta 1304", es: "Muwatta 1304", fr: "Muwatta 1304", ur: "موطا 1304", tr: "El-Muvatta 1304 — Malik: Develer, sığırlar ve koyunlar yiyecek gibidir; Müslümanlar düşman topraklarında bunlardan yiyebilirler ve hiç kimse bunlardan herhangi birini ailesine götürmek üzere saklamamalıdır.", id: "Al-Muwatta 1304 — Malik: Unta, sapi, dan domba adalah seperti makanan; Muslim boleh memakan hewan-hewan itu di wilayah musuh, dan tidak seorang pun boleh menyimpan salah satu dari hewan-hewan itu untuk dibawa kembali kepada keluarganya." }
summary:
  ar: "يقول مالك إنه يرى الإبل والبقر والغنم بمنزلة الطعام، يأكل منه المسلمون إذا دخلوا أرض العدو، ولا يرى بأسا بما أكل منها على وجه المعروف والحاجة إليها، ولا يرى أن يدخر أحد من ذلك شيئا يرجع به إلى أهله. {cite:muwatta-maruf-1997 p.582}"
  tr: "Malik, develeri, sığırları ve koyunları, Müslümanların düşman topraklarına girdiklerinde yiyebilecekleri yiyecekler gibi gördüğünü söylüyor. Gereklilik halinde ve emredildiği gibi bunlardan yemenin bir sakıncası olmadığını ve kimsenin bunlardan herhangi birini ailesine götürmek üzere saklaması gerektiğine inanmadığını belirtiyor. {cite:muwatta-maruf-1997 s.582}"
  id: "Malik mengatakan bahwa ia menganggap unta, sapi, dan domba sebagai makanan yang boleh dimakan oleh umat Islam jika mereka memasuki wilayah musuh. Ia tidak melihat adanya bahaya dalam memakan sebagian dari hewan-hewan tersebut karena kebutuhan dan sesuai dengan apa yang dipersyaratkan, dan ia tidak percaya bahwa siapa pun harus menyimpan sebagian darinya untuk dibawa kembali kepada keluarganya. {cite:muwatta-maruf-1997 p.582}"
