label: { ar: "الموطأ 1304 — مالك: الإبل والبقر والغنم بمنزلة الطعام يأكل منها المسلمون في أرض العدو، ولا يدخر أحد منها شيئا يرجع به إلى أهله", en: "Muwatta 1304" }
summary:
  ar: "يقول مالك إنه يرى الإبل والبقر والغنم بمنزلة الطعام، يأكل منه المسلمون إذا دخلوا أرض العدو، ولا يرى بأسا بما أكل منها على وجه المعروف والحاجة إليها، ولا يرى أن يدخر أحد من ذلك شيئا يرجع به إلى أهله. {cite:muwatta-maruf-1997 p.582}"
