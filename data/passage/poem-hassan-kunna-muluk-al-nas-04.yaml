text: وإن حاربوا أو سالموا لم يُشبّهوا فحربُهم حتفٌ وسلمُهم سهدُ
summary:
  ar: بيت من القصيدة اللامية لحسان في فخر الأنصار، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.394}}. ينسب ابن هشام إلى غير ابن إسحاق بيتاً من هذه القصيدة، وهو مذكور في موضعه من السيرة.
  en: 'Hassan describes the Ansar in war and in peace: they are not ambiguous, and their war and their peace are both firm.'
translations:
  en:
    text: 'Whether they go to war or make peace, they are never mistaken for others: in war they are death, in peace they are watchful.'
