label: { ar: "الموطأ 2602 — زيد بن ثابت يطلق طائرا أُخذ من يد الراوي بالأسواف", en: "Muwatta 2602", es: "Muwatta 2602", fr: "Muwatta 2602", ur: "موطا 2602", tr: "El-Muvatta 2602 — Zeyd ibn Sabit, ravinin elinden kılıçla alınan bir kuşu serbest bırakır.", id: "Al-Muwatta 2602 — Zayd ibn Thabit melepaskan seekor burung yang diambil dari tangan perawi dengan pedang" }
summary:
  ar: "حدثني يحيى عن مالك عن رجل قال: دخل عليّ زيد بن ثابت وأنا بالأسواف، وقد اصطدت طائرا من النوع المسمى النهس، فأخذه من يدي فأرسله. {cite:muwatta-maruf-1997 p.468}"
  tr: "Yahya bana, Malik'ten, o da bir adamdan rivayetle şöyle anlattı: \"Zayd ibn Sabit, Aswaf'tayken yanıma geldi. Nahs denen türden bir kuş yakalamıştım. Kuşu elimden aldı ve serbest bıraktı.\" {cite:muwatta-maruf-1997 s.468}"
  id: "Yahya memberitahuku, berdasarkan riwayat Malik, berdasarkan riwayat seorang pria yang berkata: Zayd ibn Thabit datang kepadaku ketika aku berada di Aswaf, dan aku telah menangkap seekor burung jenis Nahs. Dia mengambilnya dari tanganku dan melepaskannya. {cite:muwatta-maruf-1997 p.468}"
