label: { ar: "الموطأ 2714 — يحيى بن سعيد: الرجل الذي مات ولم يُبتل بمرض فقال عنه الرجل هنيئا له", en: "Muwatta 2714" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رجلا جاءه الموت في زمان رسول الله، فقال رجل: هنيئا له، مات ولم يُبتل بمرض. فقال رسول الله: ويحك، وما يدريك لو أن الله ابتلاه بمرض يكفّر به من سيئاته. ويذكر المحقق قول ابن عبد البر أنه لا يعلم هذا اللفظ مسندا عن النبي من وجه محفوظ. {cite:muwatta-maruf-1997 p.530}"
