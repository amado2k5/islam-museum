label: { ar: "الموطأ 2714 — يحيى بن سعيد: الرجل الذي مات ولم يُبتل بمرض فقال عنه الرجل هنيئا له", en: "Muwatta 2714", es: "Muwatta 2714", fr: "Muwatta 2714", ur: "موطا 2714", tr: "El-Muvatta 2714 — Yahya bin Said: Hiçbir hastalığa yakalanmadan ölen adam hakkında, “Ona tebrikler!” denildi.", id: "Al-Muwatta 2714 — Yahya bin Saeed: Seorang pria yang meninggal tanpa pernah terserang penyakit, dan seorang pria berkata tentangnya, “Selamat kepadanya.”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رجلا جاءه الموت في زمان رسول الله، فقال رجل: هنيئا له، مات ولم يُبتل بمرض. فقال رسول الله: ويحك، وما يدريك لو أن الله ابتلاه بمرض يكفّر به من سيئاته. ويذكر المحقق قول ابن عبد البر أنه لا يعلم هذا اللفظ مسندا عن النبي من وجه محفوظ. {cite:muwatta-maruf-1997 p.530}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Allah Resulü zamanında bir adamın öldüğünü ve başka bir adamın, \"Ona ne mutlu, hiçbir hastalık geçirmeden öldü\" dediğini aktarır. Allah Resulü, \"Yazık sana! Allah'ın onun günahlarını affetmek için ona bir hastalık vermediğini nereden biliyorsun?\" diye buyurmuştur. Araştırmacı, İbn Abdül-Barr'ın bu sözün Peygamberimizden güvenilir bir rivayet zinciriyle nakledildiğini bilmediği yönündeki ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.530}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa seorang pria meninggal pada zaman Rasulullah, dan seorang pria lain berkata, \"Selamat kepadanya, dia meninggal tanpa ditimpa penyakit apa pun.\" Rasulullah bersabda, \"Celakalah kalian! Bagaimana kalian tahu bahwa Allah tidak menimpakannya penyakit untuk menebus dosa-dosanya?\" Peneliti menyebutkan pernyataan Ibn 'Abd al-Barr bahwa dia tidak mengetahui adanya riwayat hadis ini dari Nabi melalui rantai perawi yang terpercaya. {cite:muwatta-maruf-1997 p.530}"
