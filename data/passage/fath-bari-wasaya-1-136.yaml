text: "… والعشرون والسابع والعشرون والثامن والعشرون : أحاديث أبي سعيد وحذيفة وأبي هريرة في قصة الذي أوصى بأن يحرمه إذا مات، أورده من طرق، وتقدم في الترجمة من وجه آخر، وسأذكر جميع فوائده هنا إن شاء اللّٰه تعالى. قوله: عن عقبة …"
