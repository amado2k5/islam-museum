label: { ar: "سنن أبي داود 4243 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 4243 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 4243 — ترکہ اور میراث", es: "Sunan Abi Dawud 4243 — lo que quedó: patrimonio y herencia", fr: "Sunan Abi Dawud 4243 — Ce qui a été laissé derrière: biens et héritage", tr: "Sunan Abi Davud 4243 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sunan Abi Dawud 4243 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… ابْنُ أَبِي مَرْيَمَ، أَخْبَرَنَا ابْنُ فَرُّوخَ، أَخْبَرَنِي أُسَامَةُ بْنُ زَيْدٍ، أَخْبَرَنِي ابْنٌ لِقَبِيصَةَ بْنِ ذُؤَيْبٍ، عَنْ أَبِيهِ، قَالَ قَالَ حُذَيْفَةُ بْنُ الْيَمَانِ وَاللَّهِ مَا أَدْرِي أَنَسِيَ أَصْحَابِي أَمْ تَنَاسَوْا وَاللَّهِ مَا تَرَكَ رَسُولُ اللَّهِ مِنْ قَائِدِ فِتْنَةٍ إِلَى أَنْ تَنْقَضِيَ الدُّنْيَا يَبْلُغُ مَنْ مَعَهُ ثَلاَثَمِائَةٍ فَصَاعِدًا إِلاَّ قَدْ سَمَّاهُ لَنَا بِاسْمِهِ وَاسْمِ أَبِيهِ وَاسْمِ قَبِيلَتِهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4243، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4243 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4243، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4243 (Pruebas y batallas feroces (Kitab Al-Fitan Wa Al-Malahim)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4243 (Épreuves et Combats acharnés (Kitab Al-Fitan Wa Al-Malahim)), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 4243 numaralı hadis, Peygamber Efendimiz'in geride bıraktığı mal varlığı ve miras hakkında bilgi vermektedir. Bu derleme, vasiyetnameler, miras, tarihi yerler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4243, menyebutkan apa yang ditinggalkan beliau berupa harta warisan. Informasi ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, situs bersejarah, dan makam suci, beserta teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
