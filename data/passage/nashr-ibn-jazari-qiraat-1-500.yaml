text: "… او اخت من أم ومذاهب الفقهاء إفي هذه المسألة على كم معنى تشتمل هذه الاحرف السبعة هل هذه الاحرف السبعة متفرقة في القرآن ام لا اشتمال المصاحن العثمانية على الاحرف السبعة سبب تجريد الصحابة المصاحف من النقط والشكل هل القرآآت …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 500، يذكر الأحرف السبعة، وقراءات القرآن، وجمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 500, that mentions the seven ahruf, the readings of the Qur'an, the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 500 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Nashr fi al-Qira'at al-'Ashr de Ibn al-Jazari, volumen 1, pág. 500, que menciona los siete ahruf, las lecturas del Corán, la colección del Corán y los códices, y las marcas de puntos y vocales del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du livre d'Ibn al-Jazari, al-Nashr fi al-Qira'at al-'Ashr (tome 1, p. 500), mentionnant les sept ahruf, les lectures du Coran, sa compilation et les codex, ainsi que la ponctuation et les signes vocaliques du mushaf. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Cezeri'nin \"On Okuma\" adlı eserinin 1. cildinin 500. sayfasından bir alıntı; yedi okuma şekli, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları ile Kur'an'ın diyakritik işaretleri ve biçimlendirilmesi konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jazari, \"Sepuluh Bacaan,\" Jilid 1, halaman 500, yang membahas tujuh cara pembacaan, bacaan Al-Quran, penyusunan Al-Quran dan manuskripnya, serta tanda diakritik dan format Al-Quran. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
