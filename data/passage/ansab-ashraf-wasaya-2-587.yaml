text: "… لما استخلف عثمان، دخل العباس على على، فقال : ما قدّ متك قط إلا تأخرت. قلتُ لك وقد احتضر النبى : تعال، فاسأله عن هذا الأمر لمن هو بعده، فقلت : أكره أن لا يقول لكم، فلا نستخلف أبدا. ثم …"
