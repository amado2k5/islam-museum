text: "المروي عن ابن عباس أنه قال في كل أرض من الخلق مثل ما في هذه حتى آدم كآدمكم وإبراهيم كإبراهيمكم"
summary:
  ar: "ينقل ابن كثير أثراً عن ابن عباس بأن في كل أرض خلقاً مثل أهل هذه الأرض، ثم يرى أنه إن صح عنه فمحمول على أنه من الإسرائيليات."
  en: "Ibn Kathir reports a statement ascribed to Ibn Abbas that every earth holds creatures like those of this one, and judges that, if it is sound as his, it was taken from Israelite lore."
  es: "Ibn Kathir recoge una afirmación atribuida a Ibn Abbas según la cual toda tierra alberga criaturas como esta, y juzga que, si es tan válida como la suya, fue tomada de la tradición israelita."
  fr: "Ibn Kathir rapporte une déclaration attribuée à Ibn Abbas selon laquelle chaque terre abrite des créatures semblables à celles de celle-ci, et estime que, si elle est aussi authentique que la sienne, elle provient du savoir israélite."
  ur: "ابن کثیر نے ابن عباس سے منسوب ایک قول نقل کیا ہے کہ ہر زمین اس جیسی مخلوقات کو رکھتی ہے اور یہ فیصلہ کرتی ہے کہ اگر وہ صحیح ہے تو یہ اسرائیلی روایت سے لی گئی ہے۔"
  tr: "İbn Kathir, İbn Abbas'tan rivayet edilen bir hadisi aktararak, her ülkede bu ülkenin insanlarına benzeyen yaratıklar olduğunu belirtir ve eğer bu hadis ondan sahih ise, İsrailoğullarından geldiği şeklinde yorumlanır."
  id: "Ibn Kathir mengutip sebuah riwayat dari Ibn Abbas yang menyatakan bahwa di setiap negeri terdapat makhluk seperti penduduk negeri ini, kemudian ia berpendapat bahwa jika riwayat tersebut sahih dari Ibn Abbas, maka dapat dianggap sebagai bagian dari Bani Israel."
