ref: "1.346"
label: { ar: "الموطأ 346 — ثلاثة أحاديث في واحد: غصن الشوك، والشهداء خمسة، والنداء والصف الأول", en: "Muwatta 346" }
text: "بينما رجل يمشي بطريق إذ وجد غصن شوك على الطريق فأخره، فشكر الله له فغفر له"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر عن أبي صالح عن أبي هريرة، في باب ما جاء في العتمة والصبح، ثلاثة أحاديث في سياق واحد: أن رجلاً أخّر غصن شوك عن الطريق فشكر الله له فغفر له؛ وأن الشهداء خمسة: المطعون والمبطون والغرق وصاحب الهدم والشهيد في سبيل الله؛ وأن الناس لو علموا ما في النداء والصف الأول لاستهموا عليه، ولو علموا ما في التهجير لاستبقوا إليه، ولو علموا ما في العشاء والصبح لأتوهما ولو حبواً. ويذكر المحقق أن القسم الثالث تقدم برقم 174 وأن ابن عبد البر عدّها ثلاثة أحاديث في واحد، ويخرّج حديث غصن الشوك عند البخاري (2472) والترمذي (1958) وابن حبان، وحديث الشهداء عند البخاري (2829، 5733) ومسلم (6/51) والترمذي (1063) والنسائي، وأن البخاري (720، 721) والجوهري اقتصرا على قطعتين. {cite:muwatta-maruf-1997 p.190} {cite:muwatta-maruf-1997 p.191}"
