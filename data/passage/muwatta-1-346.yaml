label: { ar: "الموطأ 346 — ثلاثة أحاديث في واحد: غصن الشوك، والشهداء خمسة، والنداء والصف الأول", en: "Muwatta 346", es: "Muwatta 346", fr: "Muwatta 346", ur: "موطا 346", tr: "El-Muvatta 346 — Tek hadiste üç hadis: Dikenli dal, beş şehit, ezan ve ilk saf", id: "Al-Muwatta 346 — Tiga hadits dalam satu: Ranting berduri, lima syuhada, seruan shalat, dan barisan pertama" }
text: "بينما رجل يمشي بطريق إذ وجد غصن شوك على الطريق فأخره، فشكر الله له فغفر له"
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر عن أبي صالح عن أبي هريرة، في باب ما جاء في العتمة والصبح، ثلاثة أحاديث في سياق واحد: أن رجلاً أخّر غصن شوك عن الطريق فشكر الله له فغفر له؛ وأن الشهداء خمسة: المطعون والمبطون والغرق وصاحب الهدم والشهيد في سبيل الله؛ وأن الناس لو علموا ما في النداء والصف الأول لاستهموا عليه، ولو علموا ما في التهجير لاستبقوا إليه، ولو علموا ما في العشاء والصبح لأتوهما ولو حبواً. ويذكر المحقق أن القسم الثالث تقدم برقم 174 وأن ابن عبد البر عدّها ثلاثة أحاديث في واحد، ويخرّج حديث غصن الشوك عند البخاري (2472) والترمذي (1958) وابن حبان، وحديث الشهداء عند البخاري ⁦(2829، 5733)⁩ ومسلم (6/51) والترمذي (1063) والنسائي، وأن البخاري ⁦(720، 721)⁩ والجوهري اقتصرا على قطعتين. {cite:muwatta-maruf-1997 p.190} {cite:muwatta-maruf-1997 p.191}"
  tr: "Malik, Ebu Bekir'in azatlı kölesi Sümey'den, o da Ebu Salih'ten, o da Ebu Hurayra'dan, İşa ve Fecr namazları hakkında rivayet edilenler bölümünde bunu nakletmiştir. Bu bölümde tek bir bağlamda üç hadis bulunmaktadır: Bir adam yoldan dikenli bir dalı kaldırmış ve Allah ona bunun için şükretmiş ve onu bağışlamıştır; şehitlerin beş çeşidi vardır: vebadan ölenler, karın hastalığından ölenler, boğulanlar, çöken bir binanın altında kalanlar ve Allah yolunda şehit olanlar; ve eğer insanlar ezan okumanın ve ilk saf tutmanın sevabını bilselerdi, kura çekerlerdi; eğer camiye koşmanın sevabını bilselerdi, camiye koşarlardı; ve eğer İşa ve Fecr namazlarının sevabını bilselerdi, sürünerek bile olsa namaza gelirlerdi. Editör, üçüncü bölümün daha önce 174 numara altında zikredildiğini ve İbn Abdülberr'in bunu üç hadisin birleşimi olarak değerlendirdiğini belirtiyor. Ayrıca, dikenli dal hakkındaki hadisi Buhari (2472), Tirmizi (1958) ve İbn Hibban'da, şehitler hakkındaki hadisi ise Buhari (2829, 5733), Müslim (6/51), Tirmizi (1063) ve Nesai'de zikrediyor. Buhari (720, 721) ve Cevheri'nin ise bunun sadece iki bölümünü içerdiğini ekliyor. {cite:muwatta-maruf-1997 s.190} {cite:muwatta-maruf-1997 s.191}"
  id: "Malik meriwayatkan hadits ini dari Sumayy, budak yang dibebaskan oleh Abu Bakr, dari Abu Salih, dari Abu Hurayrah, dalam bab tentang apa yang telah diriwayatkan mengenai salat Isya dan Subuh. Hadits ini memuat tiga hadits dalam satu konteks: bahwa seorang pria menyingkirkan ranting berduri dari jalan, dan Allah berterima kasih kepadanya dan mengampuninya; bahwa ada lima jenis syuhada: mereka yang meninggal karena wabah, mereka yang meninggal karena sakit perut, mereka yang tenggelam, mereka yang meninggal karena tertimpa bangunan yang runtuh, dan mereka yang syahid di jalan Allah; dan bahwa jika orang-orang mengetahui pahala azan dan salat salat baris pertama, mereka akan mengundinya; jika mereka mengetahui pahala bergegas ke masjid, mereka akan berlomba ke sana; dan jika mereka mengetahui pahala salat Isya dan Subuh, mereka akan datang meskipun harus merangkak. Penyunting mencatat bahwa bagian ketiga telah disebutkan sebelumnya di bawah nomor 174, dan bahwa Ibnu Abd al-Barr menganggapnya sebagai tiga hadits dalam satu. Ia juga mengutip hadits tentang ranting berduri dalam al-Bukhari (2472), al-Tirmidhi (1958), dan Ibnu Hibban, dan hadits tentang para syuhada dalam al-Bukhari (2829, 5733), Muslim (6/51), al-Tirmidhi (1063), dan al-Nasa'i. Ia menambahkan bahwa al-Bukhari (720, 721) dan al-Jawhari hanya memasukkan dua bagiannya. {cite:muwatta-maruf-1997 p.190} {cite:muwatta-maruf-1997 p.191}"
