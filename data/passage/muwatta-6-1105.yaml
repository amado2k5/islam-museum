label: { ar: "الموطأ 1105 — عبد الله بن أبي بكر بن محمد بن عمرو بن حزم: أن رسول الله أهدى جملاً كان لأبي جهل بن هشام في حج أو عمرة", en: "Muwatta 1105" }
text: "أهدى جملاً كان لأبي جهل بن هشام في حج أو عمرة"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم، أن رسول الله أهدى جملاً كان لأبي جهل بن هشام في حج أو عمرة. ويذكر المحقق أن يحيى ذكر «عن نافع» في الإسناد، وهو غلط بيّن عند ابن عبد البر، وأن ابن عبد البر (التمهيد 17/413–414) قال إن سويداً وهم بالإسناد عن الزهري عن أنس. ويذكر أنه رواه عن مالك أبو مصعب (1199) وسويد (522) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.507}"
