label: { ar: "مسلم 2965 — إن الله يحب العبد التقي الغني الخفي", en: "Muslim 2965 — God loves the pious, self-sufficient, unassuming servant", es: "Muslim 2965 — Dios ama al siervo piadoso, autosuficiente y humilde.", fr: "Muslim 2965 — Dieu aime le serviteur pieux, autonome et humble", ur: "مسلم 2965 — خدا پرہیزگار، خوددار، بے نیاز بندے سے محبت کرتا ہے۔", tr: "Müslim 2965 — Allah takva sahibi, zengin ve akıllı kulları sever.", id: "Muslim 2965 — Allah mencintai hamba yang saleh, kaya, dan bijaksana" }
text: "قال سعد بن أبي وقاص حين عاتبه ابنه عمر على انفراده بالإبل: اسكت، سمعت رسول الله يقول: إن الله يحب العبد التقي الغني الخفي"
summary:
  ar: "رواية سعد بن أبي وقاص في باب إن الله يحب العبد التقي الخفي الغني من كتاب الزهد والرقائق في صحيح مسلم؛ سياقها رد سعد على ابنه الذي عاتبه على ترك الناس يتنازعون الملك."
  tr: "Sahih Müslim'in \"İhtişam ve Kalpleri Yumuşatma Kitabı\"nda yer alan \"Allah takva sahibi, gizli ve zengin kulunu sever\" bölümünde Sa'd ibn Abi Waqqas'ın rivayeti; bağlamı, insanların krallık için kavga etmesine izin verdiği için kendisini azarlayan oğluna Sa'd'ın verdiği cevaptır."
  id: "Riwayat Sa'd ibn Abi Waqqas dalam bab \"Allah mencintai hamba yang saleh, tersembunyi, dan kaya\" dari Kitab Asketis dan Pelunakan Hati dalam Sahih Muslim; konteksnya adalah tanggapan Sa'd kepada putranya yang menegurnya karena membiarkan orang-orang bert争 memperebutkan kerajaan."
