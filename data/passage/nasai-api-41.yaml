label: { ar: "سنن النسائي 41 — خبر من أخبار الظرفاء والمغفلين", en: "Sunan al-Nasa'i 41 — a report of the wits and the fools", ur: "سنن نسائی 41 — ظریفوں اور مغفلوں کی ایک خبر", fr: "Sunan al-Nasa'i 41 — un récit des beaux esprits et des sots", es: "Sunan al-Nasa'i 41 — un relato de ingeniosos y necios" }
text: "أَخْبَرَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَنْبَأَنَا أَبُو مُعَاوِيَةَ، قَالَ حَدَّثَنَا الأَعْمَشُ، عَنْ إِبْرَاهِيمَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ، عَنْ سَلْمَانَ، قَالَ قَالَ لَهُ رَجُلٌ إِنَّ صَاحِبَكُمْ لَيُعَلِّمُكُمْ حَتَّى الْخِرَاءَةَ. قَالَ أَجَلْ نَهَانَا أَنْ نَسْتَقْبِلَ الْقِبْلَةَ بِغَائِطٍ أَوْ بَوْلٍ أَوْ نَسْتَنْجِيَ بِأَيْمَانِنَا أَوْ نَكْتَفِيَ بِأَقَلَّ مِنْ ثَلاَثَةِ أَحْجَارٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 41، فيه خبر من أخبار الظرفاء والمغفلين. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan al-Nasa'i, no. 41, with a report of the wits and the fools. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن نسائی کی حدیث نمبر 41، جس میں ظریفوں اور مغفلوں کی ایک خبر ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 41, avec un récit des beaux esprits et des sots. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan al-Nasa'i, n.º 41, con un relato de ingeniosos y necios. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
