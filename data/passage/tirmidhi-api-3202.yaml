label: { ar: "جامع الترمذي 3202 — الأب والأبوة", en: "Jami' al-Tirmidhi 3202 — the father and fatherhood", ur: "جامع ترمذی 3202 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3202 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3202 — le père et la paternité", tr: "Cami' el-Tirmizi 3202 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3202 — Ayah dan Peran Ayah" }
text: "… بْنُ عَاصِمٍ، عَنْ إِسْحَاقَ بْنِ يَحْيَى بْنِ طَلْحَةَ، عَنْ مُوسَى بْنِ طَلْحَةَ، قَالَ دَخَلْتُ عَلَى مُعَاوِيَةَ فَقَالَ أَلاَ أُبَشِّرُكَ قُلْتُ بَلَى. قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" طَلْحَةُ مِمَّنْ قَضَى نَحْبَهُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ مِنْ حَدِيثَ مُعَاوِيَةَ إِلاَّ مِنْ هَذَا الْوَجْهِ وَإِنَّمَا رُوِيَ عَنْ مُوسَى بْنِ طَلْحَةَ عَنْ أَبِيهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3202، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3202 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3202، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3202 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3202 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le navigateur « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Cami' el-Tirmizi'de 3202 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bunu Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3202, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hal ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
