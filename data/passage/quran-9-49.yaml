text: "وَمِنْهُم مَّن يَقُولُ ٱئْذَن لِّى وَلَا تَفْتِنِّىٓ ۚ أَلَا فِى ٱلْفِتْنَةِ سَقَطُوا۟ ۗ وَإِنَّ جَهَنَّمَ لَمُحِيطَةٌۢ بِٱلْكَـٰفِرِينَ"
text_search: "ومنهم من يقول ائذن لي ولا تفتني ۚ ألا في الفتنة سقطوا ۗ وإن جهنم لمحيطة بالكافرين"
translations:
  en: { text: "Of them is he who saith: Grant me leave (to stay at home) and tempt me not. Surely it is into temptation that they (thus) have fallen. Lo! hell verily is all around the disbelievers.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور ان میں کوئی ایسا بھی ہے جو کہتا ہے کہ مجھے تو اجازت ہی دیجئے اور آفت میں نہ ڈالئے۔ دیکھو یہ آفت میں پڑگئے ہیں اور دوزخ سب کافروں کو گھیرے ہوئے ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
