text: "… الحرام في الأرضِ ثلاثةُ أَماكِن : حرم اللّٰه من دَخَله كان آمناً، والمدِينةُ حرمي، والكُوفّةُ حرم عليِّ بن أبي طالب، قال : ولما أسلمت على يدي النّبي يو وعلمني من فاتحة الكتاب إلى : إذا زلزلت الأرض، مسح رأسي بيده …"
