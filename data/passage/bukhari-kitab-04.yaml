summary:
  ar: "القسم 4 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوضوء»، ويضم فيها النصوص من 135 إلى 247 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 4 of Sahih al-Bukhari (Ablutions (Wudu')) in the division of the open hadith dataset the museum took its reports from: reports 135 to 247 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 4، عنوان «کتاب الوضوء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 135 تا 247۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 4 de Sahih al-Bukhari (Abluciones (Wudu')) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 135 al 247, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 4, chapitre 135 à 247) dans la base de données ouverte: il s'agit des hadiths 135 à 247. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 4. bölümü \"Abdest Kitabı\" başlığını taşımakta olup, 135 ila 247 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 4 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Wudhu\" dan berisi teks 135 hingga 247, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
