summary:
  ar: "قال مالك في الكبير والصغير إذا قتلا رجلا جميعا عمدا: أن على الكبير أن يُقتل، وعلى الصغير نصف الدية. {cite:muwatta-maruf-1997 p.419}"
  tr: "Malik, bir yetişkin ve bir çocuğun kasten bir adamı öldürmesi durumunda şunları söylemiştir: Yetişkin öldürülmeli, çocuk ise kan parasının yarısını ödemelidir. {cite:muwatta-maruf-1997 s.419}"
  id: "Malik berkata mengenai orang dewasa dan anak di bawah umur yang dengan sengaja membunuh seseorang: orang dewasa harus dihukum mati, dan anak di bawah umur harus membayar setengah dari uang darah tersebut. {cite:muwatta-maruf-1997 p.419}"
