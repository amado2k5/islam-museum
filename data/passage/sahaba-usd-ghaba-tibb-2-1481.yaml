text: "… قالت: جنتُ قال أبو عمر : جعل العقيلي هذا الحديث لأميمة بنت رسول اللّٰه عليل في نسوة من غفار فقلنا : إنا نريد أن النجار الأنصارية، قال: وأنا أظنه لأُميمة بنت رُقَيقة، نخرج معك في وجهك هذا فنداوي الجرحى، ونعين …"
