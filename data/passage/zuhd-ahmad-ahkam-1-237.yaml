text: "… وهؤلاء أهل اللعب واللهو والزينة، وإن كانوا يؤمنون بالآخرة إيمانًا مجملًا فهم لم يعرفوا المقصود من الدنيا ولا أنها منزلة يتزود فيها لما بعدها من دار الإقامة. والمقتصد من أخذ الدنيا من وجهها المباح وأدى واجبها وأمسك لنفسه الزائد على …"
summary:
