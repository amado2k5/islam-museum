  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 542, that mentions medicine and the physician, pain, named diseases, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 542 کا اقتباس جس میں طب اور طبیب، درد، بیماریوں کے نام، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen escaneado 1, pág. 542, que menciona la medicina y al médico, el dolor, las enfermedades específicas y el medicamento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Sifat al-Safwa d'Ibn al-Jawzi, volume 1 scanné, p. 542, qui mentionne la médecine et le médecin, la douleur, les maladies nommées, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin resimli 1. cildinin 542. sayfasından, tıp, hekim, ağrı, hastalıkların isimleri ve ilaçlardan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari kitab “Sifat al-Safwa” karya Ibn al-Jawzi, jilid 1 bergambar, halaman 542, yang menyebutkan tentang kedokteran, dokter, rasa sakit, nama-nama penyakit, dan obat-obatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
