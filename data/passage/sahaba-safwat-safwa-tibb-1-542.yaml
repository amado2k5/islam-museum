text: "… في ذنوب الناس وأمِنوه على ذنوبهم. وقيل له حين أصابه الفالج: لو تداويت؟ فقال: لقد عرفت أن الدواء حق، ولكني ذكرت عاداً وثمود وقروناً بين ذلك كثيراً كانت فيهم الأوجاع وكان لهم الأطباء، فما بقي المداوي ولا المداوَىٰ. أبو حيان، …"
