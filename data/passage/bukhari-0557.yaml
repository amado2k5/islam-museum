label:
  ar: "البخاري 557 — هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها"
  en: "Bukhari 557 — Have I wronged you in your wage: this community and those before it"
  ur: "بخاری 557 — کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں"
text: "إنما بقاؤكم فيما سلف قبلكم من الأمم كما بين صلاة العصر إلى غروب الشمس، أوتي أهل التوراة التوراة فعملوا حتى إذا انتصف النهار عجزوا، فأعطوا قيراطا قيراطا، ثم أوتي أهل الإنجيل الإنجيل فعملوا إلى صلاة العصر، ثم عجزوا، فأعطوا قيراطا …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 557: هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 557: Have I wronged you in your wage: this community and those before it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 557: کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
