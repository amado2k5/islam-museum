label:
  ar: "البخاري 557 — هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها"
  en: "Bukhari 557 — Have I wronged you in your wage: this community and those before it"
  ur: "بخاری 557 — کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں"
  es: "Bujari 557 — ¿Os he perjudicado en vuestro salario?: esta comunidad y las que la precedieron."
  fr: "Bukhari 557 — Vous ai-je lésés dans votre salaire, vous, cette communauté et celles qui l'ont précédée ?"
  tr: "Buhari 557 — Ben size sevap konusunda herhangi bir haksızlık mı ettim? Bu ümmet ve ondan önceki ümmetler gibi."
  id: "Al-Bukhari 557 — Apakah aku telah berbuat salah kepadamu terkait pahalamu? Seperti umat ini dan umat-umat sebelum mereka."
text: "إنما بقاؤكم فيما سلف قبلكم من الأمم كما بين صلاة العصر إلى غروب الشمس، أوتي أهل التوراة التوراة فعملوا حتى إذا انتصف النهار عجزوا، فأعطوا قيراطا قيراطا، ثم أوتي أهل الإنجيل الإنجيل فعملوا إلى صلاة العصر، ثم عجزوا، فأعطوا قيراطا …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 557: هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 557: Have I wronged you in your wage: this community and those before it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 557: کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 557: ¿Os he perjudicado en vuestra remuneración?: esta comunidad y las anteriores. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 557: « Vous ai-je lésés dans votre salaire ? » (à cette communauté et à celles qui l’ont précédée). Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 557: “Apakah Aku telah berbuat zalim terhadap kalian, baik mengenai pahala kalian? Umat ini dan umat sebelum mereka.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta."
