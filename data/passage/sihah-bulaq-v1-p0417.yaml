text: |-
  ⁦(١)⁩ صتره
  اليك أبيت اللعن كان كلالها
  ٢ لت المحمدة ذكرها
  الزمخشرى فى مصادر المفصل
  بكسر الميم الثانية وذكر صاحب
  الديوان أن المحمدة والمحمدة
  والمذمة والمذمة لغتان فيهه
  اه مختار
  ٠٢٢٤
  ⁦(ياب الدال)⁩
  ⁦(حُضد)⁩
  عليه يحقد حقدا وحقدءاءه بالكسر -قد الغة وأحقد مغيره ورجل حة ودوأحقد القوم
  اذا طلبوامن المعدن شيتا فلم يجدوا وهذا الحرف نقلته من كتاب ولم أ-معه ⁦(-قلد )⁩
  ابن الاعرابى الحقلد الضيق البخيل ( د لحد نقيض الذمّ تقول حدت الرجل أحده
  جداومحم_دة فهوحيد ومحمود والتحميد أبلغ من الحد والهدأعمّ من المشكر والمحمد الذى
  كثرت خصاله المحمودة قال الشاعر الاعشى ١ الى الماجد القرم الجواد المحد
  والمحمدة خلاف المذمة ⁦(٢)⁩ وأحد الرحل صار أمره الى الحد وأحدته وجدته محمودا
  قول أتيت مؤضع كذا فأحدته أى صادقته محمودا موافقا وذلك اذارضيت سكاه
  أومرعاء وقولهم فى المثل العود أحد أى أكثر حدا قال الشاعر
  فلم تجر إلاجنت فى الخيرسابقا * ولاعدت الاأنت فى المودأحد
  وقولهم جاداذلان أى حد اله وشكرا وانمابنى على السكسرلانه معدول عن المصدروفلان
  يتعمد علىّ أى عن يقال من أنفق ماله على نفسه فلا يتهمد به على الناس ورجل حدة مثال
  همزة يكنر حد الاشياء ويقول فيها أكثر عمافيها وحدة النار بالتحريك صوت التهابها واحتمد
  الحرّقلب احتدم وقولهم حاد اك أن تفعل كذا أى قصار اك وغايتك ويحمد بطن من الازد
  ومجموداسم الفيل المذكور فى القرآن ( يد حاد عن الشى يحيد حيوداوجيدة
  وحيدودة مال عنه وعدل وأصله حيدودة يتحريك الساءفسكنت لانه ليس فى الكلام
  فعلول غير صعفوق وقواهسم حيدى حياد هو كقوله-م فيحى فياح وحايده محايدة وحيادا
  جانبه وحار حيدى أى يحيد عن ظله انشاطه ويقال كثير الحيود عن الشى ولم يجى فى نعوت
  لمذكرشئ على فعلى غيره قال أسيسة بن أبى عائد الهذلى
  وأصحم حام جراميزه حزابية حيدى بالدحال
  والحيد بالتسكين حرف شاخص يخرج من الجبل يقال جبل ذوحيود وأحياد اذا كانت
  لهحروف نانئة فى اعراضه لافى أعاليه والحيدة العقدة فى قرن الوعل والجمسع حيود وكل نتوّ
  فى القرن والجبل وغيرهما حيد قال العجاج يصف جلا
  فى شعشعان عنق يمخور * حابى الحيود قارض الحيجور
  وحيد أيضامثل بدرة وبدر قال الهذلى
  تالله يبقى على الايام ذوحيد • بمشمخربه الظيان والآس
  أى لا ييق
  والحيدان ماحاد من الحصى عن قوائم الداية فى السير .
  صل الخاء دد الخدّفى الوجهوهماخدان والمخذة بالكسر لانها توضع
  تحت الخد والمخدة أيضاحديدة نخذبما الارض أى تشق والاخدود شق فى الارض مستطيل
  وخد الارض يختها وضربة أخدود أى خدت فى الجلد والخدة بالضم الحفرة قال الفرزدق
  وترى بم اخد دابكل مجال والخداد ميسم فى الحدّ والبعير مخدود والمتخدد المهزول وقد
  خدد لهه وتخدد أى تشتج خرد الخريدة من النساء الحيية والجمع خرائد وخر دوخرّد
  وربما قالواجارية خرود أى خفرة ابن الاعرابى لؤاؤة خريدة لم تشقب قال وكل عسذراء خريدة
  ⁦( خضد)⁩ خضدت العودفا نخضد أى ثنيته فائاى من غير كسر والحضد الا كل الشديد
  قال
