text: "… واسباغه ا عن ابن عمرما عن الذبى في سؤال جبرائيل اياه عن الاسلام فقال الاسلام أن تشهد أن لا اله الا اللّٰه وأن محمدا رسول اللّه وأن تقيم الصلاة وتؤتى الزكاة وتحج وتعتمر وتفتسل من الجنابة وأن تتم الوضوء وتصوم …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 4، ص 96، يذكر تعريف الإسلام بأعماله، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 4, p. 96, that mentions Islam defined by its acts, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
