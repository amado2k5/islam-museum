text: "… واسباغه ا عن ابن عمرما عن الذبى في سؤال جبرائيل اياه عن الاسلام فقال الاسلام أن تشهد أن لا اله الا اللّٰه وأن محمدا رسول اللّه وأن تقيم الصلاة وتؤتى الزكاة وتحج وتعتمر وتفتسل من الجنابة وأن تتم الوضوء وتصوم …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 4، ص 96، يذكر تعريف الإسلام بأعماله، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 4, p. 96, that mentions Islam defined by its acts, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 4، ص 96 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 4, pág. 96, que menciona el Islam definido por sus actos, el testimonio, la oración y el zakat; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Tarhib wa-l-Tarhib d'al-Mundhiri (tome 4, page 96) qui définit l'islam par ses actes, le témoignage, la prière et la zakat. Ce passage, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 4. cildinin 96. sayfasından bir alıntı, İslam'ı ameller, iman ikrarı, namaz ve zekât üzerinden tanımlamaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Dorongan dan Peringatan), Jilid 4, halaman 96, mendefinisikan Islam melalui amalan-amalannya, yaitu pengakuan iman, salat, dan zakat. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
