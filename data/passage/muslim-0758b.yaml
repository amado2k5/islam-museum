ref: "758b"
label:
  ar: "مسلم 758b — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Muslim 758b — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "مسلم 758b — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
  es: "Muslim 758b — Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda?"
  fr: "Muslim 758b — Notre Seigneur descend dans le dernier tiers de la nuit: qui M’invoquera, afin que Je réponde ?"
  tr: "Müslim 758b — Rabbimiz gecenin son üçte birinde iner: “Kim bana dua ederse, ona icabet edeyim?”"
  id: "Muslim 758b — Tuhan kita turun pada sepertiga malam terakhir: “Siapakah yang memohon kepada-Ku, maka Aku akan mengabulkannya?”"
text: "ينزل الله إلى السماء الدنيا كل ليلة حين يمضي ثلث الليل الأول فيقول أنا الملك أنا الملك من ذا الذي يدعوني فأستجيب له من ذا الذي يسألني فأعطيه من ذا الذي يستغفرني فأغفر له فلا يزال كذلك حتى يضيء الفجر …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 758b: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 758b: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 758b: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 758b: Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 758b: Notre Seigneur descend au cours du dernier tiers de la nuit: qui M’invoquera afin que Je réponde ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Müslim'de 758b numaralı hadis-i kudsi şöyledir: Rabbimiz gecenin son üçte birinde iner ve şöyle buyurur: \"Kim bana dua edecek de icabet edeyim?\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı şeriat hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 758b: Tuhan kita turun pada sepertiga malam terakhir, firman-Nya: “Siapa yang mau memohon kepada-Ku, maka Aku akan mengabulkannya?” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kitab hadits kanonik dan dalam Al-Muwatta."
