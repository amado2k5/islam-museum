label: { ar: "صحيح البخاري 5696 — الحجامة، القسط والعود الهندي", en: "Sahih al-Bukhari 5696 — cupping; costus (Indian aloeswood)", ur: "صحیح بخاری 5696 — حجامہ، قسط ہندی", es: "Sahih al-Bukhari 5696 — ventosas; costus (madera de aloe india)", fr: "Sahih al-Bukhari 5696 — ventouses; costus (bois d'aloès indien)", tr: "Sahih el-Buhari 5696 - Kupa, Costus ve Hint Udu", id: "Sahih al-Bukhari 5696 — Bekam, Costus dan Oud India" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ مُقَاتِلٍ، أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا حُمَيْدٌ الطَّوِيلُ، عَنْ أَنَسٍ ـ أَنَّهُ سُئِلَ عَنْ أَجْرِ الْحَجَّامِ، فَقَالَ احْتَجَمَ رَسُولُ اللَّهِ حَجَمَهُ أَبُو طَيْبَةَ، وَأَعْطَاهُ صَاعَيْنِ مِنْ طَعَامٍ، وَكَلَّمَ مَوَالِيَهُ فَخَفَّفُوا عَنْهُ، وَقَالَ \" إِنَّ أَمْثَلَ مَا تَدَاوَيْتُمْ بِهِ الْحِجَامَةُ وَالْقُسْطُ الْبَحْرِيُّ \". وَقَالَ \" لاَ تُعَذِّبُوا صِبْيَانَكُمْ بِالْغَمْزِ مِنَ الْعُذْرَةِ، وَعَلَيْكُمْ بِالْقُسْطِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5696، يذكر الحجامة، والقسط والعود الهندي، والقسط، وعلاج العذرة، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5696 (Medicine), that mentions cupping, costus (Indian aloeswood), costus, treating the throat ailment (al-udhra), seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5696، جس میں حجامہ، قسط ہندی، قسط، گلے کی بیماری عذرہ کا علاج، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 5696 (Medicina), menciona la ventosaterapia, el costus (madera de aloe indio), el tratamiento de la afección de garganta (al-udhra) y la búsqueda de tratamiento. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5696 (Médecine), mentionne la ventousothérapie, le costus (bois d'aloès indien), le traitement des maux de gorge (al-udhra) et la recherche de soins. Le navigateur de textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5696 numaralı hadiste, hacamat, kostus kökü, Hint öd ağacı, kostus kökü, bademcik iltihabı tedavisi ve diğer şifa yöntemlerinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve farmakoloji metinleriyle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5696, menyebutkan bekam, akar costus, kayu gaharu India, pengobatan radang amandel, dan bentuk-bentuk penyembuhan lainnya. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan farmakologi."
