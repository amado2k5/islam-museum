label: { ar: "الموطأ 685 — عثمان: هذا شهر زكاتكم، فمن كان عليه دين فليؤد دينه حتى تحصل أموالكم فتؤدون منها الزكاة", en: "Muwatta 685", es: "Muwatta 685", fr: "Muwatta 685", ur: "موطا 685", tr: "El-Muvatta 685 — Osman: Bu ay zekât ayıdır. Borcu olan herkes borcunu ödesin ki, siz de paranızı toplayıp zekâtınızı verebilesiniz.", id: "Al-Muwatta 685 — Uthman: Ini adalah bulan untuk zakat kalian. Barangsiapa mempunyai hutang, hendaklah ia melunasinya agar kalian dapat mengambil uang kalian dan membayar zakat darinya." }
text: "هذا شهر زكاتكم، فمن كان عليه دين فليؤد دينه، حتى تحصل أموالكم، فتؤدون منها الزكاة"
summary:
  ar: "أول حديث في باب الزكاة في الدين. يرويه مالك عن ابن شهاب عن السائب بن يزيد، أن عثمان بن عفان كان يقول: هذا شهر زكاتكم، فمن كان عليه دين فليؤد دينه حتى تحصل أموالكم فتؤدون منها الزكاة. ويذكر المحقق أن في نسخة م «منه»، وأنه رواه عن مالك أبو مصعب والشافعي ومحمد بن الحسن الشيباني (323)، وأن أبا عبيد في الأموال (1247) والبيهقي أخرجاه من طريق إبراهيم بن سعد وشعيب عن الزهري. {cite:muwatta-maruf-1997 p.344}"
  tr: "Zekatın borç üzerine konulması konusundaki ilk hadis. Malik, İbn Şihab'dan, o da Sa'ib ibn Yezid'den rivayet ettiğine göre, Osman ibn Affan şöyle derdi: \"Bu ay zekât ayıdır. Borcu olan herkes borcunu ödesin ki, zekâtını ondan toplayabilesiniz.\" Editör, M el yazmasında bunun \"ondan\" geldiğini ve Malik'ten Ebu Mus'ab, Şafiî ve Muhammed ibn Hasan el-Şeybani (323) tarafından rivayet edildiğini, Ebu Ubeyd'in el-Amwal'da (1247) ve el-Beyhaki'nin ise İbrahim ibn Sa'd ve Şuayb'ın Zühri'den rivayet ettiği nakil zinciriyle bunu dahil ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.344}"
  id: "Hadits pertama tentang zakat atas hutang. Diriwayatkan oleh Malik dari Ibnu Shihab dari al-Sa'ib ibn Yazid, bahwa Utsman ibn Affan biasa berkata: \"Ini adalah bulan untuk zakat kalian. Barangsiapa mempunyai hutang hendaknya melunasinya agar kalian dapat memungut zakat darinya.\" Editor mencatat bahwa dalam manuskrip M tertulis \"darinya,\" dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, al-Shafi'i, dan Muhammad ibn al-Hasan al-Shaybani (323), dan bahwa Abu Ubayd dalam al-Amwal (1247) dan al-Bayhaqi memasukkannya melalui sanad Ibrahim ibn Sa'd dan Shu'ayb dari al-Zuhri. {cite:muwatta-maruf-1997 p.344}"
