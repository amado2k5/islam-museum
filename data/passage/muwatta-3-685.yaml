text: "هذا شهر زكاتكم، فمن كان عليه دين فليؤد دينه، حتى تحصل أموالكم، فتؤدون منها الزكاة"
summary:
  ar: "أول حديث في باب الزكاة في الدين. يرويه مالك عن ابن شهاب عن السائب بن يزيد، أن عثمان بن عفان كان يقول: هذا شهر زكاتكم، فمن كان عليه دين فليؤد دينه حتى تحصل أموالكم فتؤدون منها الزكاة. ويذكر المحقق أن في نسخة م «منه»، وأنه رواه عن مالك أبو مصعب والشافعي ومحمد بن الحسن الشيباني (323)، وأن أبا عبيد في الأموال (1247) والبيهقي أخرجاه من طريق إبراهيم بن سعد وشعيب عن الزهري. {cite:muwatta-maruf-1997 p.344}"
