text: "وإن لنا نصف الأرض، ولكن قريشا قوم يعتدون . فكتب إليه: ((من محمد رسول الله إلى مسيلمة الكذاب. سلام على من اتبع الهدى، أما بعد، فإن الأرض لله يورثها من يشاء من عباده، والعاقبة [١٢٦ أ] للمتقين)) . * *"
