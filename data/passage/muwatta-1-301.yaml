label: { ar: "الموطأ 301 — عمر يجمع الناس على أبي بن كعب: نعمت البدعة هذه", en: "Muwatta 301", es: "Muwatta 301", fr: "Muwatta 301", ur: "موطا 301", tr: "El-Muvatta 301 — Ömer, Ubeyy ibn Ka'b'ın etrafına insanları toplar: Ne güzel bir yenilik bu!", id: "Al-Muwatta 301 — Umar mengumpulkan orang-orang di sekitar Ubayy ibn Ka'b: Betapa bagusnya inovasi ini!" }
text: "نعمت البدعة هذه، والتي تنامون عنها أفضل من التي تقومون"
summary:
  ar: "أول حديث في باب ما جاء في قيام رمضان. يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عبد الرحمن بن عبد القاري: خرج مع عمر بن الخطاب في رمضان إلى المسجد فإذا الناس متفرقون يصلي الرجل لنفسه ويصلي الرجل فيصلي بصلاته الرهط، فرأى عمر أن جمعهم على قارئ واحد أمثل، فجمعهم على أبي بن كعب. ثم خرج معه ليلة أخرى والناس يصلون بصلاة قارئهم فقال عمر: نعمت البدعة هذه، والتي تنامون عنها أفضل من التي تقومون، يعني آخر الليل، وكان الناس يقومون أوله. ويخرّجه المحقق عند البخاري (2010) والبيهقي من طرق أصحاب مالك، وعبد الرزاق عن معمر عن الزهري. {cite:muwatta-maruf-1997 p.171}"
  tr: "Ramazan gecesi namazları hakkında rivayet edilenler bölümündeki ilk hadis, Malik tarafından İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Abdurrahman ibn Abdurkari'den rivayet edilmiştir: Ramazan ayında Ömer ibn el-Hattab ile birlikte mescide gitti ve insanların dağınık olduğunu, bazılarının tek başına, bazılarının da imamın arkasında küçük gruplar halinde namaz kıldığını gördü. Ömer, onları tek bir okuyucunun arkasında toplamanın daha iyi olduğunu gördü ve onları Ubeyy ibn Ka'b'ın arkasında topladı. Sonra başka bir gece onunla birlikte dışarı çıktı ve insanlar okuyucularının arkasında namaz kılıyorlardı. Ömer şöyle dedi: \"Ne güzel bir bidat bu! Uyuyarak kılınan namaz, kılınan namazdan daha faziletlidir,\" yani insanların gecenin başında kıldıkları gibi gecenin sonunda kılınan namazdan bahsediyordu. Bu hadis, Malik'in sahabelerinin rivayet zincirleriyle Sahih el-Buhari (2010) ve Sahih el-Beyhaki'de de bulunmakta olup, Abd el-Razzaq da Ma'mar'dan, o da el-Zuhri'den rivayet etmiştir. {cite:muwatta-maruf-1997 s.171}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang telah diriwayatkan mengenai salat malam di bulan Ramadhan. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Abd al-Rahman ibn Abd al-Qari: Beliau pergi bersama Umar ibn al-Khattab ke masjid di bulan Ramadhan dan mendapati orang-orang tersebar, sebagian salat sendiri-sendiri dan sebagian lagi salat dalam kelompok-kelompok kecil di belakang seorang imam. Umar melihat bahwa lebih baik mengumpulkan mereka di belakang satu qari, maka beliau mengumpulkan mereka di belakang Ubayy ibn Ka'b. Kemudian beliau pergi bersamanya di malam lain dan orang-orang salat di belakang qari mereka. Umar berkata: \"Sungguh suatu inovasi yang baik! Salat yang kalian tiduri lebih baik daripada salat yang kalian laksanakan,\" maksudnya salat di akhir malam, sebagaimana orang-orang biasa salat di awal malam. Hadits ini juga terdapat dalam Sahih al-Bukhari (2010) dan Sahih al-Bayhaqi melalui sanad para sahabat Malik, dan Abd al-Razzaq berdasarkan riwayat Ma'mar berdasarkan riwayat al-Zuhri. {cite:muwatta-maruf-1997 p.171}"
