label: { ar: "الموطأ 301 — عمر يجمع الناس على أبي بن كعب: نعمت البدعة هذه", en: "Muwatta 301" }
text: "نعمت البدعة هذه، والتي تنامون عنها أفضل من التي تقومون"
summary:
  ar: "أول حديث في باب ما جاء في قيام رمضان. يرويه مالك عن ابن شهاب عن عروة بن الزبير عن عبد الرحمن بن عبد القاري: خرج مع عمر بن الخطاب في رمضان إلى المسجد فإذا الناس متفرقون يصلي الرجل لنفسه ويصلي الرجل فيصلي بصلاته الرهط، فرأى عمر أن جمعهم على قارئ واحد أمثل، فجمعهم على أبي بن كعب. ثم خرج معه ليلة أخرى والناس يصلون بصلاة قارئهم فقال عمر: نعمت البدعة هذه، والتي تنامون عنها أفضل من التي تقومون، يعني آخر الليل، وكان الناس يقومون أوله. ويخرّجه المحقق عند البخاري (2010) والبيهقي من طرق أصحاب مالك، وعبد الرزاق عن معمر عن الزهري. {cite:muwatta-maruf-1997 p.171}"
