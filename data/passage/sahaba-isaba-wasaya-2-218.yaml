text: "… بأنه أسلم قبل وفاة النبي ول الم إلى المدينة بوقعة اليرموك. وذكره سَيْف في عدة أماكن. بأربعين يوماً وهو غلط، ففي الصحيحين عنه أن استدركه ابن فَتْحُون، وابن الأثير، وفي التجريد قيل النبي عليفي قال له: اسْتَنْصِتِ الناس في حِجَّةِ …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 218، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 218, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 218 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 2, pág. 218, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 2, p. 218), mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 218. sayfasından bir alıntı, vasiyetname veya son vasiyetten ve ölüm saatinden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 2, halaman 218, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
