label: { ar: "سنن أبي داود 3510 — الأب والأبوة", en: "Sunan Abi Dawud 3510 — the father and fatherhood", ur: "سنن ابی داؤد 3510 — باپ اور والدیت", es: "Sunan Abi Dawud 3510 — El padre y la paternidad", fr: "Sunan Abi Dawud 3510 — le père et la paternité", tr: "Sunan Abi Davud 3510 — Baba ve Babalık", id: "Sunan Abi Dawud 3510 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ مَرْوَانَ، حَدَّثَنَا أَبِي، حَدَّثَنَا مُسْلِمُ بْنُ خَالِدٍ الزَّنْجِيُّ، حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ،ا أَنَّ رَجُلاً، ابْتَاعَ غُلاَمًا فَأَقَامَ عِنْدَهُ مَا شَاءَ اللَّهُ أَنْ يُقِيمَ ثُمَّ وَجَدَ بِهِ عَيْبًا فَخَاصَمَهُ إِلَى النَّبِيِّ فَرَدَّهُ عَلَيْهِ فَقَالَ الرَّجُلُ يَا رَسُولَ اللَّهِ قَدِ اسْتَغَلَّ غُلاَمِي. فَقَالَ رَسُولُ اللَّهِ \" الْخَرَاجُ بِالضَّمَانِ \". قَالَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3510، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3510 (Wages (Kitab Al-Ijarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3510، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3510 (Salarios (Kitab Al-Ijarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3510 (Salaires (Kitab Al-Ijarah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 3510 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3510, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
