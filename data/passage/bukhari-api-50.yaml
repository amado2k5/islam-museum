label: { ar: "صحيح البخاري 50 — تعريف الإسلام بأعماله، الصلاة والزكاة والصوم والحج مجتمعة", en: "Sahih al-Bukhari 50 — Islam defined by its acts; the prayer, the zakat, the fast and the pilgrimage named together", ur: "صحیح بخاری 50 — اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Sahih al-Bukhari 50 — El Islam definido por sus actos; la oración, el zakat, el ayuno y la peregrinación mencionados juntos.", fr: "Sahih al-Bukhari 50 — L'islam défini par ses actes; la prière, la zakat, le jeûne et le pèlerinage sont cités ensemble.", tr: "Sahih el-Buhari 50 — İslam'ı ibadetleriyle tanımlamak: namaz, zekât, oruç ve Hac bir arada.", id: "Sahih al-Bukhari 50 — Mendefinisikan Islam melalui amalan-amalannya: salat, zakat, puasa, dan haji secara gabungan." }
text: "… أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ كَانَ النَّبِيُّ بَارِزًا يَوْمًا لِلنَّاسِ، فَأَتَاهُ جِبْرِيلُ فَقَالَ مَا الإِيمَانُ قَالَ \" الإِيمَانُ أَنْ تُؤْمِنَ بِاللَّهِ وَمَلاَئِكَتِهِ وَبِلِقَائِهِ وَرُسُلِهِ، وَتُؤْمِنَ بِالْبَعْثِ \". قَالَ مَا الإِسْلاَمُ قَالَ \" الإِسْلاَمُ أَنْ تَعْبُدَ اللَّهَ وَلاَ تُشْرِكَ بِهِ، وَتُقِيمَ الصَّلاَةَ، وَتُؤَدِّيَ الزَّكَاةَ الْمَفْرُوضَةَ، وَتَصُومَ رَمَضَانَ \". قَالَ مَا الإِحْسَانُ قَالَ \" أَنْ تَعْبُدَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 50، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه، والإيمان بالبعث. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 50 (Belief), that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, belief in God, His angels, His books and His messengers, the question about faith and its answer, belief in the resurrection. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 50، جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 50 (Creencia), menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, la creencia en Dios, sus ángeles, sus libros y sus mensajeros, la cuestión de la fe y su respuesta, y la creencia en la resurrección. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 50 (La Foi), mentionne l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage, la croyance en Dieu, Ses anges, Ses livres et Ses messagers, la question de la foi et sa réponse, ainsi que la croyance en la résurrection. Le guide « Piliers et branches de la foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih Buhari'nin 50. hadisi, İslam'ı namaz, zekât, oruç ve hac gibi ibadetlerle, ayrıca Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inançla tanımlar. Ayrıca imanla ilgili soruları ve cevaplarını, kıyamete olan inancı da ele alır. Bu hadis, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 50, mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta kepercayaan kepada Allah, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya. Hadits ini juga membahas pertanyaan-pertanyaan tentang iman dan jawabannya, serta kepercayaan akan kebangkitan. Hadits ini disusun oleh seorang peneliti yang meneliti rukun-rukun Islam, rukun-rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, semuanya dalam empat kategori ini."
