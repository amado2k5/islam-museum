text: "… بين الدنيا وبين ما عند اللّٰه.. أدعي لي يا أبا بكر فلأكتب له. إنّه ليس من الناس أحد أمنّ عليّ بنفسه وماله من أبي بكر إنّ رسول اللّٰه خرج من مرضه الذي مات فيه عاصباً رأسه. إنّ النبيّ غسّله عليّ …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 613، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 5, p. 613, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 5، ص 613 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 5, pág. 613, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 5, page 613, mentionnant un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 5. cildinin 613. sayfasından alınan bir alıntıda, ölüm ve vefat anı, defin, mezar ve türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 5, halaman 613, menyebutkan saat kematian dan wafat, penguburan, kuburan, dan makam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
