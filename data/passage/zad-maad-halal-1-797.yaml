text: "… يحل له، لأنه ليس بولده، وإن أخذه مملوكاً يستخدِمُه لم يَحَلَّ له لأنه قد شرك فيه لكون الماء يزيدَ في الولد. وفي هذا دلالة ظاهرةٌ على تحريم نكاح الحامِل، سواء كان حملُها مِن زوج أو سيِّدٍ أو شُبهة أو زنى، …"
