text: "… الريب من لا يعرف معروفا ولا ينسكر منكراً حدثنا حبيب بن الحسن ثنا عمر بن حفص ثنا عاصم بن على ثنا المسعودى عن القاسم. قال قال رجل لعبد اللّٰه : أوصى يا أبا عبد الرحمن ! قال : ليسعك بيتك، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 135، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
