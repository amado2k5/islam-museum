text: "… به من وجهين. أحدهما : أنه نفى الحرج في تركه، ولو كان فرضاً لكان في تركه حرج. والثاني: أنه قال: مَنْ فَعَلَ فَقَدْ أَحْسَنَ، وَمَنْ لاَ فَلاَ حَرَجَ، ومثل هذا لا يقال في المفروض، وإنما يقال في المندوب إليه، والمستحب، …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 183، يرد فيه ذكر الفرض، والمستحب، والمندوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 183, whose wording mentions the obligatory (fard), the recommended (mustahabb), the recommended (mandub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 183 کا اقتباس جس میں فرض، مستحب، مندوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 183, dont le texte mentionne l'obligatoire (fard), le recommandé (mustahabb), le recommandé (mandub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
