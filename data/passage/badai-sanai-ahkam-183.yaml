  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 183. sayfasından, farz, tavsiye edilen ve müstehap olan amelleri sıralayan bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz, gerekli, zorunlu, tavsiye edilen, mekruh edilen, yasaklanan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 183, yang menyebutkan amalan wajib, anjuran, dan yang diinginkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, yang diwajibkan, yang dianjurkan, yang tidak disukai, yang dilarang, dan dosa-dosa kecil."
