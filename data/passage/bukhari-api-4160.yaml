label: { ar: "صحيح البخاري 4160 — الأب والأبوة", en: "Sahih al-Bukhari 4160 — the father and fatherhood", ur: "صحیح بخاری 4160 — باپ اور والدیت", es: "Sahih al-Bukhari 4160 — El padre y la paternidad" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي مَالِكٌ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، قَالَ خَرَجْتُ مَعَ عُمَرَ بْنِ الْخَطَّابِ ـ إِلَى السُّوقِ، فَلَحِقَتْ عُمَرَ امْرَأَةٌ شَابَّةٌ فَقَالَتْ يَا أَمِيرَ الْمُؤْمِنِينَ هَلَكَ زَوْجِي وَتَرَكَ صِبْيَةً صِغَارًا، وَاللَّهِ مَا يُنْضِجُونَ كُرَاعًا، وَلاَ لَهُمْ زَرْعٌ وَلاَ ضَرْعٌ، وَخَشِيتُ أَنْ تَأْكُلَهُمُ الضَّبُعُ، وَأَنَا بِنْتُ خُفَافِ بْنِ إِيمَاءَ الْغِفَارِيِّ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4160، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4160, that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4160، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4160, menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
