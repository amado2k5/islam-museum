label: { ar: "نوادر جحا الكبرى، ص 92 — «أصلح الله القاضي»", en: "Nawadir Juha al-Kubra, p. 92 — 'May God Set the Judge Right'", ur: "نوادر جحا الکبریٰ، ص 92 — «اللہ قاضی کی اصلاح کرے»", fr: "Nawadir Juha al-Kubra, p. 92 — « Que Dieu redresse le juge »", es: "Nawadir Juha al-Kubra, p. 92 — «Que Dios enmiende al juez»", tr: "Juha'nın Büyük Fıkraları, s. 92 — “Allah hakime yol göstersin”", id: "Anekdot-anekdot Hebat Juha, hlm. 92 — “Semoga Tuhan membimbing hakim”" }
text: "… أصلح اللَّه القاضي كان في عهد الشيخ بمدينة قونية قاضي مشهورٌ بالارتشاء، وكان للشيخ إعلامٌ يريد تصديقه من القاضي، وقد اتَّخذ كُلَّ الوسائلِ فما أمكنه أن يصدِّقه إلّا أن حضر بالذات إلى قونيةً، وقدم جرَّة عسل كبيرةً للقاضي، فعندما رآها …"
summary:
  ar: "عُرف في قونية قاضٍ مرتشٍ، فذهب جحا إلى قونية ومعه جرة كبيرة من العسل ليختم له القاضي شهادته، فختمها القاضي وأخذ الجرة. وبعد يومين وجد القاضي في الجرة طيناً فقط، فطلب تصحيح الشهادة، فقال جحا إن العيب ليس في الشهادة بل في عقل القاضي، ثم غادر البلدة. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  en: "In Konya a corrupt judge is well known. Juha goes to Konya with a large jar of honey to have his certificate sealed, and the judge seals it and keeps the jar. Two days later the judge finds only clay in the jar and asks for the certificate to be corrected. Juha says nothing is wrong with the certificate but with the judge's mind, and leaves town. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  ur: "قونیہ میں ایک رشوت خور قاضی مشہور ہے۔ جحا اپنی سند پر مہر لگوانے کے لیے شہد کا ایک بڑا مٹکا لے کر قونیہ جاتا ہے، قاضی مہر لگا دیتا ہے اور مٹکا رکھ لیتا ہے۔ دو دن بعد قاضی کو مٹکے میں صرف مٹی ملتی ہے اور وہ سند درست کرانے کو کہتا ہے۔ جحا کہتا ہے کہ خرابی سند میں نہیں بلکہ قاضی کی عقل میں ہے، اور شہر سے چلا جاتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  fr: "À Konya, un juge corrompu est bien connu. Juha s'y rend avec une grande jarre de miel pour faire sceller son certificat, et le juge le scelle et garde la jarre. Deux jours plus tard, le juge ne trouve que de l'argile dans la jarre et demande que le certificat soit corrigé. Juha dit que ce n'est pas le certificat qui est en défaut mais l'esprit du juge, et quitte la ville. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  es: "En Konya es conocido un juez corrupto. Juha va a Konya con una gran jarra de miel para que le sellen su certificado, y el juez lo sella y se queda con la jarra. Dos días después el juez solo encuentra arcilla en la jarra y pide que se corrija el certificado. Juha dice que lo que falla no es el certificado sino la mente del juez, y abandona la ciudad. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  tr: "Konya'da yozlaşmış bir hakim biliniyordu, bu yüzden Juha, hakimin ifadesini onaylaması için büyük bir bal kavanozuyla Konya'ya gitti. Hakim ifadeyi onayladı ve Juha kavanozu aldı. İki gün sonra hakim kavanozda sadece çamur buldu ve ifadenin düzeltilmesini istedi. Juha, hatanın ifadede değil, hakimin zihninde olduğunu söyledi ve sonra şehri terk etti. {cite:juha-nawadir-kubra-djuwaydi s. 92}"
  id: "Di Konya dikenal seorang hakim yang korup, jadi Juha pergi ke Konya dengan membawa sebuah guci besar berisi madu agar hakim tersebut membubuhkan cap pada kesaksiannya. Hakim membubuhkan cap tersebut dan Juha mengambil guci itu. Dua hari kemudian, hakim hanya menemukan lumpur di dalam guci dan menuntut agar kesaksian tersebut dikoreksi. Juha menjawab bahwa kesalahannya bukan pada kesaksian tetapi pada pikiran hakim, lalu ia meninggalkan kota itu. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
