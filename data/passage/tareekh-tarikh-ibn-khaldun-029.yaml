text: "بكي؟ قالت: عليك! قال: إن الله رفعني ولم يصبني إلا خير وهذا وفي كتاب يعقوب بن يوسف النجار حذرا من أن يكتب وأمرهم بتبليغ رسالته في النواحي، كما عين لهم من قبل. وعند كما أمر أوغسطس في بعض أيامه فاجاءها"
