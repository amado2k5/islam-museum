text: |-
  ٥٢٦
  ..ذى).
  البعير يبوله تغذية اذاقطعه والتغذية أيضا التربية را الغراء الذى يلصق به الشئ
  يكون من السمك اذا قعت الفين قصرت وان كسرت مددت تقول منه غروت الجلد
  أى الصقته بالغراء وقوص مغروة ومغرية أيضاحكاء ابن السكيت ومش-ل للعرب أدركنى
  ولو بأحد المغرقين أى بأحد السهمين وقال ثعلب أدركنى بسهم أوبرمح والغريان وهما
  ناآن طويلان يقال هما قبر مالك وعيسل ندعمى جذيمة الابرش وسمياغر ين لانّ النعمان
  ابن المنذركان يغريم مابدم من يقتله اذا خوج في يوم بؤسه قال الراجز
  أهل عرفت الدار بالغريين • وصاليات ككما يؤثفين
  وأغريت الكلب بالصيد وأغريت بينهم والاسم الغراة وغرى به بالكسرأى أواع به
  والاسم الغراءبالفتح والمدّ وحسكى أبو عبيد عن خالدين كانوم غاريت بين السيثين غراءاذا!
  واليت ومنه قول كثير
  اذاقلت أسلوفاضت العين بالبكا • غراء ومدتم امدامع حفل
  قال وقال أبو عبيدة هى فاعات من غريت بالشئ أغرى به وغرى فلان اذ ا تمادى فى غضبه
  وهو من الواو والغرى الحسن ورجل غرى والغر والعجب وغروت أى عمبت بقال لاغر وأى
  اليس بعجب غزا غزوت العدوغزوا والاسم الغزاة والنسبة الى الغزوغزوى ورجل
  غازوابهع غنزاة مشل قاض وقضاة وغزامثل سابق وسبق وغزى مثل حاج وجميج وقاطز
  وقطين وغزاء مثل فاسق وفساق قال تأبطشرا
  نيومابغزاءويومابسرية • ويومايشخاس من الرجل هضل
  وأغزيت فلانا أى جهزته للمغزو والمغزية المرأة التى غزازوجها وأغزت الناقة اذاعه.
  لقاحها قال الاموى المغزية من النوق التى جازت السنة ولم تلدمثل المدراج وأتان مغزية
  متأخرة النتاج ثم تنتج وأغزيت الرجل أمهلته وأخرت مالى عليه من الدين ومغزى الكلام
  مقصده وعرفت ما يغزى من هذا الكلام أى مايراد وغزية قبيلة قال دريد بن الصمة
  وهل أنا الامن غزية ان غوت • غويت وان ترشدغزية أرشد
  وغزوان ا-م رجل سا غسا الليل يغسوغسوا وغى بغسى وأغسى يفسى اذا
  أظلم قال ابن أحر
  فلما غساليلى وأيقنت أنما • هى الأربى جاءت بأم حبوكرى
  ⁦( غشا)⁩ الفشاء الغطاء وجعل على بصره غشوة وغشوة وغشوة وغشارة أى غطاءومنه
  قوله تعالى فأغشيناهم فهم لا يبصرون والغاشبة القيامة لانها نغشى بافزاعها الاصحى
  يقال رماه القه بغاشية وهى داء يأخذ فى الجوف والغاشية الجدية التى فوق المؤخرة
  والغاشية فاشية السرج والاغشى من الخيل وغيرها ما ابيض رأسه كاه من بين جسده مثل
  الارخم وعنزغشواه بينسة الفشاوتول غشيت الشئ تفشية اذاغطيته وغشيت الرجل
  بالسوط ضربته وغشيه غشيانا أى باءه وأغداد اياه غيره وغشيها غشيانا بامعها وغشى
  عليه غشية وغشيا وغشيانافهو مغشى عليه واستغشى بتوبه وتغنى بثوبه أى تغطى به
  ⁦(غضى)⁩ الغضى شجر ومنه قواهم ذتب غضى وأرض غضيا ء كثيرة الغذى وبعيرعاض
  إذا
