text: |-
  *⁦(أصل الراء)⁩*
  •⁦(رتا)⁩..
  امتلات وحسذت وتقول للمرأة أنت ترين وللجماعة أنتن ترين لان الفعل للواحد والجماعة
  سواء فى المواجهة فى خبر المرأة من بنات الياء الا أنّ الذون التى فى الواحدة علامة الرفع والتى
  فى الجمع انماهى نون الهاعة وتقول أنت تريذى وان شئت أدغمت وقلت تربى بتشديد
  النون كمانة ول تضربى وسامرًا المديتسة التى بناها المعتصم وفيها لغات سرّ من رأى وسرّ من
  رأى وساء من رأى وسامرًا عن أحسدين يحي ثعلب وابن الانسارى والمرآة بكسر الميم التى
  بتغلرفيها وثلاث مراء والمكثير مرايا قال أبوزيدرأيت الرجل ترئيسة اذا أمسكت له المرآة
  لينظارفيها والمرآة على مفعلة بالفتح المنظر الحسن يقال امرأة حسنة المرآة والرأى كما
  يقال حسنة المنظرة والمنظر وفلان ح-ن فى مر آة العين أى فى المنظر وفى المثل تخبرئ
  مجه وله مرآنه أى ظاهره يدل على باطنه والرواء بالضم ح--ن المنظر وبقال رامى فلان
  النأس برائيهم مراآة ورايأهم مرايأة على القلب بمعنى ورأى فى منامه رؤيا على فعلى بلا
  تنوين وبجع الرؤيارؤى بالتنوين مثال رعى وفلان من بمرأى ومسمسع أى حيث أراه وأسمع
  وربوت الرابيةء_لوتها وكذلك الربوة بالضم وفيها أربع لغات ربوة وربوة وربوة وربادة
  والر بوالنفس العالى يقال رباريوريوا اذا أخذه الريو وربالفرس اذا انتفخمر
  عدوأوفزع قال بشر بن آبى خازم
  كانّ -قيف منخره اذاما * كتمن الريوكير مستعار
  قال الفراء فى قوله تعالى فأخذهم أخذة رابية أى زائدة كولات أربيت اذا أخذت أكثر؟ما
  أعطيت وربوت فى بنى فلان وريات أى نشأت فيهم وينشده ثلاثة أملالدر بوافى حجورنا
  در بيمه ترية وتربيته أى غذوته هذ الكل ما بنمى كالولد والزرع ونحوه ويقال زنجبيل مربي
  ومريب ايض اآى عمول بالرب ابن دريد افلان على فلان رباء بالفتح والمدأى طول والرباقى
  البيع ويثى ربوان وربيان وقد أربى الرجل والربية مخففة لغة فى الرياوفى الحديت فى صلح
  أسقط عنهسم كل دم كانوا يطلبون به وكل رباكان عليهم الارؤسأموالهسم فانهسم يردونها
  والاربية بالضم والقشديد أصل الفخذ وأصله أربوّة قاستثة لوا التشديد على الواو وهه
  أرستان ويقال أيضاجاء فلان فى أر بية قومه أى فى أهل ستهمنبني الاعمام ونحوه-.
  ولا تكون الاربية من غيرهم وقال.
  وانى وسط ثعلبة بن عمرو * بلا أرية نبتت فروعا
  والاربيان بكسر الهسعزة ضرب من المعك بيض كالد وديكون بالبصيرة أبو ساتم الربية
  ضرب من الحشرات وبمعمربى ( رتا الرتوة اللخطوة وقدرتوت أرتو أى خطوت
  وفى حديث معاذرضى اللّٰه عنه أنه يتقدّم العلماء يوم القيامة بربوة أى يخطوة ويقال بدرجة
  ورتاء يرتوه أى أرخاه وأوهاه قال الحرث يد كرجيلا وارتفاءه
  مكفهرا على الحوادث لا * يرتو للدهر مؤيدحماءِ
