label: { ar: "سنن أبي داود 2159 — عمل معلَّق بالإيمان بالله واليوم الآخر", en: "Sunan Abi Dawud 2159 — an act tied to belief in God and the Last Day", ur: "سنن ابی داؤد 2159 — اللہ اور یومِ آخرت پر ایمان سے جڑا عمل", es: "Sunan Abi Dawud 2159 — un acto vinculado a la creencia en Dios y el Último Día", fr: "Sunan Abi Dawud 2159 — un acte lié à la croyance en Dieu et au Jour dernier", tr: "Sunan Abi Davud 2159 — Allah'a ve Son Güne imana bağlı bir eylem", id: "Sunan Abi Dawud 2159 — Suatu perbuatan yang bergantung pada iman kepada Tuhan dan Hari Kiamat" }
text: "… وَهُوَ وَهَمٌ مِنْ أَبِي مُعَاوِيَةَ، وَهُوَ صَحِيحٌ فِي حَدِيثِ أَبِي سَعِيدٍ زَادَ } \" وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يَرْكَبْ دَابَّةً مِنْ فَىْءِ الْمُسْلِمِينَ حَتَّى إِذَا أَعْجَفَهَا رَدَّهَا فِيهِ وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلاَ يَلْبَسْ ثَوْبًا مِنْ فَىْءِ الْمُسْلِمِينَ حَتَّى إِذَا أَخْلَقَهُ رَدَّهُ فِيهِ \". قَالَ أَبُو دَاوُدَ الْحَيْضَةُ لَيْسَتْ بِمَحْفُوظَةٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2159، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 2159 (Marriage (Kitab Al-Nikah)), that mentions an act tied to belief in God and the Last Day. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 2159، جس میں اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 2159 (Matrimonio (Kitab Al-Nikah)), menciona un acto vinculado a la creencia en Dios y el Último Día. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Abi Dawud, n° 2159 (Le Mariage), mentionne un acte lié à la croyance en Dieu et au Jour dernier. Le Guide des Piliers et des Branches de la Foi le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'Islam, les branches de la foi et les qualités du croyant."
  tr: "Sünen Ebu Davud'da yer alan 2159 numaralı hadis, Allah'a ve Ahiret Günü'ne olan imanla bağlantılı bir eylemden bahsetmektedir. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2159, menyebutkan suatu perbuatan yang terkait dengan iman kepada Allah dan Hari Kiamat. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
