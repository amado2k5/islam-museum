text: "ابورهم التفاري وثم يزل بعد وفاة رسول اللّٰه، صلّعم، مقيما بالمدينة حتى فُتحت البصرة ومصّرَتْ فتحوّل إليها واختط، بها، ثمّ خسرج منها غازياً إلى خرأسان فمات بمَرْو فى خلافة يزيد بن معاوية، وبقى ولده يها، وقدم منهم قوم فنزلوا. بغداه …"
