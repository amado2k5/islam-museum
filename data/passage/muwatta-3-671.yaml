text: "في الركاز الخمس"
summary:
  ar: "أول حديث في باب زكاة الركاز. يرويه مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن، كلاهما عن أبي هريرة، أن النبي قال: في الركاز الخمس. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (6005) والبغوي، وإسحاق الطباع عند مسلم (5/128)، وخالد بن مخلد عند ابن خزيمة، وابن وهب عند الطحاوي والدارقطني، والتنيسي عند البخاري (1499)، وقتيبة عند النسائي (5/45)، ومحمد بن الحسن الشيباني (677)، ويحيى بن بكير عند أبي عبيد في الأموال (858)، ويحيل على الترمذي (642 و1377) وعلى الحديث (2541) من هذا الكتاب. {cite:muwatta-maruf-1997 p.340}"
