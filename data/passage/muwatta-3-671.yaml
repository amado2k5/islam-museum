text: "في الركاز الخمس"
summary:
  ar: "أول حديث في باب زكاة الركاز. يرويه مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن، كلاهما عن أبي هريرة، أن النبي قال: في الركاز الخمس. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (6005) والبغوي، وإسحاق الطباع عند مسلم (5/128)، وخالد بن مخلد عند ابن خزيمة، وابن وهب عند الطحاوي والدارقطني، والتنيسي عند البخاري (1499)، وقتيبة عند النسائي (5/45)، ومحمد بن الحسن الشيباني (677)، ويحيى بن بكير عند أبي عبيد في الأموال (858)، ويحيل على الترمذي ⁦(642 و1377)⁩ وعلى الحديث (2541) من هذا الكتاب. {cite:muwatta-maruf-1997 p.340}"
  tr: "Gömülü hazine zekâtı bölümündeki ilk hadis. Malik, İbn Şihab'tan, o da Sa'id ibn al-Musayyab ve Ebu Seleme ibn Abd al-Rahman'dan, her ikisi de Ebu Hurayra'dan rivayet ettiğine göre, Peygamberimiz şöyle buyurmuştur: \"Gömülü hazine zekâtının beşte biri verilir.\" Editör, bunun Ebu Mus'ab tarafından Malik'ten, İbn Hibban (6005), el-Beğavi, Müslim'de İshak el-Tabba' (5/128), İbn Huzeyme'de Halid ibn Mahlad, et-Tahavi'de İbn Vehb ve ed-Darakutni, el-Buhari'de (1499), Kuteybe tarafından rivayet edildiğini belirtmektedir. el-Nesa'i (5/45), Muhammed ibn el-Hasan el-Şeybani (677) ve Yahya ibn Bükayr, Ebu 'Ubeyd, el-Emwal'de (858). Bu kitabında Tirmizî'ye (642 ve 1377) ve hadislere (2541) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.340}"
  id: "Hadits pertama dalam surah tentang zakat harta karun. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Sa'id ibn al-Musayyab dan Abu Salamah ibn 'Abd al-Rahman, keduanya dari Abu Hurayrah, bahwa Nabi bersabda: \"Seperlima wajib dizakati atas harta karun.\" Redaksi menyebutkan bahwa diriwayatkan dari Malik oleh Abu Mus’ab, dan dari rantainya oleh Ibnu Hibban (6005), al-Baghawi, Ishaq al-Tabba’ dalam Muslim (5/128), Khalid ibn Makhlad dalam Ibnu Khuzaymah, Ibnu Wahb dalam al-Tahawi dan al-Daraqutni, al-Tunisi dalam al-Bukhari (1499), Qutaybah dalam al-Nasa'i (5/45), Muhammad ibn al-Hasan al-Shaybani (677), dan Yahya ibn Bukayr dalam Abu 'Ubayd dalam al-Amwal (858). Dia mengacu pada al-Tirmidzi (642 dan 1377) dan hadits (2541) dalam buku ini. {mengutip:muwatta-maruf-1997 hal.340}"
