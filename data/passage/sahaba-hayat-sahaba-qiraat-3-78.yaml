text: "… مختصرا، وزاد : جردوا القرآن، وأقلوا الرواية عن محمد و أنا شريككم، وكان يقص من عماله، وإذا شكى اليه عامل له جمع بينه وبين من شكاه، فان صح عليه هو التركى من الخيل خلاف العراب اى الخيز الحوارى وفى الطيرى …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 3، ص 78، يذكر نقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 3, p. 78, that mentions the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 3، ص 78 کا اقتباس جس میں مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 3, pág. 78, que menciona los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 3, page 78, mentionne la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation automatique, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Kandahlawi'nin \"Hayat al-Sahaba\" (Sahabelerin Hayatları) adlı eserinin 3. resimli cildinin 78. sayfasında, Kur'an'ın diyakritik işaretleri ve biçiminden bahsediliyor; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Hayat al-Sahaba\" (Kehidupan Para Sahabat) karya Al-Kandahlawi, jilid 3 bergambar, halaman 78, menyebutkan tanda diakritik dan bentuk Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
