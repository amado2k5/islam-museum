label: { ar: "البخاري 4450 — أين أنا غداً والموت في بيت عائشة", en: "Bukhari 4450 — Where am I tomorrow; the death in Aisha's room", es: "Bujari 4450 — ¿Dónde estaré mañana?; la muerte en la habitación de Aisha", fr: "Bukhari 4450 — Où serai-je demain ? La mort dans la chambre d’Aïcha", ur: "بخاری 4450 — میں کل کہاں ہوں؟ عائشہ کے کمرے میں موت", tr: "Buhari 4450 — Yarın ben nerede olacağım ve ölüm Ayşe'nin evinde mi olacak?", id: "Bukhari 4450 — Di manakah aku akan berada besok, dan kematian akan berada di rumah Aisyah?" }
text: "أن رسول الله كان يسأل في مرضه الذي مات فيه يقول: «أين أنا غداً؟ أين أنا غداً؟» يريد يوم عائشة، فأذن له أزواجه يكون حيث شاء، فكان في بيت عائشة حتى مات عندها… ودخل عبد الرحمن بن أبي بكر ومعه سواك فقضمته ومضغته فأعطيته رسول الله فاستن به وهو مسند إلى صدري"
summary:
  ar: "في كتاب المغازي؛ رواية عائشة في دور النبي على نسائه في مرضه وإذنهن له بالمقام عندها، وموته بين سحرها ونحرها، وسواك عبد الرحمن بن أبي بكر الذي لانت له وهي آخر ما دخل فمه. من أنفص نصوص الوفاة تفصيلاً."
  tr: "Maghazi kitabında, Aişe'nin Peygamber'in hastalığı sırasında eşlerini ziyaretleri, eşlerinin onunla kalmasına izin vermeleri, onun göğsü ve boynu arasında vefat etmesi ve Abdurrahman ibn Ebu Bekr'in misvakının (diş temizleme çubuğu) onun için yumuşaması ve ağzına giren son şey olmasıyla ilgili anlatımı yer almaktadır. Bu, onun ölümüne dair en ayrıntılı anlatımlardan biridir."
  id: "Dalam kitab Maghazi, terdapat catatan Aisyah tentang kunjungan Nabi kepada istri-istrinya selama sakit, izin mereka agar beliau tinggal bersamanya, wafatnya di antara dada dan lehernya, dan siwak (tongkat pembersih gigi) milik Abdullah bin Abi Bakr yang melunak untuk beliau dan menjadi hal terakhir yang masuk ke mulut beliau. Ini adalah salah satu catatan paling rinci tentang wafatnya."
