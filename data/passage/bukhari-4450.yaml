label: { ar: "البخاري 4450 — أين أنا غداً والموت في بيت عائشة", en: "Bukhari 4450 — Where am I tomorrow; the death in Aisha's room" }
text: "أن رسول الله كان يسأل في مرضه الذي مات فيه يقول: «أين أنا غداً؟ أين أنا غداً؟» يريد يوم عائشة، فأذن له أزواجه يكون حيث شاء، فكان في بيت عائشة حتى مات عندها… ودخل عبد الرحمن بن أبي بكر ومعه سواك فقضمته ومضغته فأعطيته رسول الله فاستن به وهو مسند إلى صدري"
summary:
  ar: "في كتاب المغازي؛ رواية عائشة في دور النبي على نسائه في مرضه وإذنهن له بالمقام عندها، وموته بين سحرها ونحرها، وسواك عبد الرحمن بن أبي بكر الذي لانت له وهي آخر ما دخل فمه. من أنفص نصوص الوفاة تفصيلاً."
