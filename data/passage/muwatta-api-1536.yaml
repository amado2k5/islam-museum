label: { ar: "موطأ مالك 1536 — الحرام", en: "Muwatta Malik 1536 — the unlawful", ur: "موطأ مالک 1536 — حرام", es: "Muwatta Malik 1536: lo ilegal", fr: "Muwatta Malik 1536 — l'illégal", tr: "Muwatta Malik 1536 — Mescid-i Haram", id: "Muwatta Malik 1536 — Al-Haram" }
text: "… كَمَثَلِ رَجُلٍ وَضَعَ بَيْنَ يَدَيْهِ خَمْرًا لِيَشْرَبَهَا فَلَمْ يَفْعَلْ فَلَيْسَ عَلَيْهِ حَدٌّ وَمِثْلُ ذَلِكَ رَجُلٌ جَلَسَ مِنِ امْرَأَةٍ مَجْلِسًا وَهُوَ يُرِيدُ أَنْ يُصِيبَهَا حَرَامًا فَلَمْ يَفْعَلْ وَلَمْ يَبْلُغْ ذَلِكَ مِنْهَا فَلَيْسَ عَلَيْهِ أَيْضًا فِي ذَلِكَ حَدٌّ. قَالَ مَالِكٌ الأَمْرُ الْمُجْتَمَعُ عَلَيْهِ عِنْدَنَا أَنَّهُ لَيْسَ فِي الْخُلْسَةِ قَطْعٌ بَلَغَ ثَمَنُهَا مَا يُقْطَعُ فِيهِ أَوْ لَمْ يَبْلُغْ."
summary:
  ar: "حديث في موطأ مالك، رقم 1536، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1536 (Hudud), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1536، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1536 (Hudud), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 1536 (Hudud), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Malik'in Muwatta'sında yer alan 1536 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1536, menyebutkan apa yang diharamkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
