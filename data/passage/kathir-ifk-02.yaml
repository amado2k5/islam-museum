text: "فقلص (١) دمعى حتى ما أحس منه شيئاً ، وانتظرت أبوى أن يجيبا عنى رسولَ اللّٰه صلى اللّٰه عليه وسلم فلم يتكلما . قالت : وايم اللّٰه لأنا كنت أَحْقَر فى نفسى وأصغر شأنًا من أن يُنزل اللّٰه فىّ قرآنًا…"
