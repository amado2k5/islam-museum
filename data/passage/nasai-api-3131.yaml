label: { ar: "سنن النسائي 3131 — رفع الدرجات", en: "Sunan al-Nasa'i 3131 — ranks raised", ur: "سنن نسائی 3131 — درجات کی بلندی" }
text: "… وَجَبَتْ لَهُ الْجَنَّةُ \". قَالَ فَعَجِبَ لَهَا أَبُو سَعِيدٍ قَالَ أَعِدْهَا عَلَىَّ يَا رَسُولَ اللَّهِ. فَفَعَلَ ثُمَّ قَالَ رَسُولُ اللَّهِ \" وَأُخْرَى يُرْفَعُ بِهَا الْعَبْدُ مِائَةَ دَرَجَةٍ فِي الْجَنَّةِ مَا بَيْنَ كُلِّ دَرَجَتَيْنِ كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ \". قَالَ وَمَا هِيَ يَا رَسُولَ اللَّهِ قَالَ \" الْجِهَادُ فِي سَبِيلِ اللَّهِ الْجِهَادُ فِي سَبِيلِ اللَّهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3131، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3131 (The Book of Jihad), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3131، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
