label: { ar: "سنن النسائي 3131 — رفع الدرجات", en: "Sunan al-Nasa'i 3131 — ranks raised", ur: "سنن نسائی 3131 — درجات کی بلندی", es: "Sunan al-Nasa'i 3131 - filas elevadas", fr: "Sunan al-Nasa'i 3131 — rangs augmentés", tr: "Sunan an-Nasa'i 3131 — Derecelerin Yükseltilmesi", id: "Sunan an-Nasa'i 3131 — Menaikkan Derajat" }
text: "… وَجَبَتْ لَهُ الْجَنَّةُ \". قَالَ فَعَجِبَ لَهَا أَبُو سَعِيدٍ قَالَ أَعِدْهَا عَلَىَّ يَا رَسُولَ اللَّهِ. فَفَعَلَ ثُمَّ قَالَ رَسُولُ اللَّهِ \" وَأُخْرَى يُرْفَعُ بِهَا الْعَبْدُ مِائَةَ دَرَجَةٍ فِي الْجَنَّةِ مَا بَيْنَ كُلِّ دَرَجَتَيْنِ كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ \". قَالَ وَمَا هِيَ يَا رَسُولَ اللَّهِ قَالَ \" الْجِهَادُ فِي سَبِيلِ اللَّهِ الْجِهَادُ فِي سَبِيلِ اللَّهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3131، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3131 (The Book of Jihad), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3131، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3131 (El Libro de la Yihad), habla de ascensos de rango. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3131 (Le Livre du Jihad), évoque l'élévation de grade. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou évaluent un acte."
  tr: "Sunan-ı Nesai'de 3131 numaralı hadis, mertebelerin yükseltilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3131, menyebutkan tentang menaikkan derajat. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
