label: { ar: "جامع الترمذي 797 — الأب والأبوة", en: "Jami' al-Tirmidhi 797 — the father and fatherhood", ur: "جامع ترمذی 797 — باپ اور والدیت", es: "Jami' al-Tirmidhi 797 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 797 — le père et la paternité", tr: "Cami' el-Tirmizi 797 — Baba ve Babalık", id: "Jami' al-Tirmidhi 797 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي إِسْحَاقَ، عَنْ نُمَيْرِ بْنِ عَرِيبٍ، عَنْ عَامِرِ بْنِ مَسْعُودٍ، عَنِ النَّبِيِّ قَالَ \" الْغَنِيمَةُ الْبَارِدَةُ الصَّوْمُ فِي الشِّتَاءِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ مُرْسَلٌ. عَامِرُ بْنُ مَسْعُودٍ لَمْ يُدْرِكِ النَّبِيَّ وَهُوَ وَالِدُ إِبْرَاهِيمَ بْنِ عَامِرٍ الْقُرَشِيِّ الَّذِي رَوَى عَنْهُ شُعْبَةُ وَالثَّوْرِيُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 797، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 797 (The Book on Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 797، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 797 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 797 (Le Livre du jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 797 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı bunu Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 797, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hal ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
