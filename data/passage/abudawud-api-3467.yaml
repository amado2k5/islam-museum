label: { ar: "سنن أبي داود 3467 — استحلال الشيء", en: "Sunan Abi Dawud 3467 — treating a thing as lawful", ur: "سنن ابی داؤد 3467 — کسی چیز کو حلال ٹھہرانا", es: "Sunan Abi Dawud 3467 — tratar algo como lícito", fr: "Sunan Abi Dawud 3467 — considérer une chose comme licite", tr: "Sünen Ebi Davud 3467 — Bir şeyi mubah kılmak", id: "Sunan Abi Dawud 3467 — Menghalalkan sesuatu" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ أَبِي إِسْحَاقَ، عَنْ رَجُلٍ، نَجْرَانِيٍّ عَنِ ابْنِ عُمَرَ، أَنَّ رَجُلاً، أَسْلَفَ رَجُلاً فِي نَخْلٍ فَلَمْ تُخْرِجْ تِلْكَ السَّنَةَ شَيْئًا فَاخْتَصَمَا إِلَى النَّبِيِّ فَقَالَ \" بِمَ تَسْتَحِلُّ مَالَهُ ارْدُدْ عَلَيْهِ مَالَهُ \". ثُمَّ قَالَ \" لاَ تُسْلِفُوا فِي النَّخْلِ حَتَّى يَبْدُوَ صَلاَحُهُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3467، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3467 (Wages (Kitab Al-Ijarah)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3467، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3467 (Salarios (Kitab Al-Ijarah)), menciona el hecho de considerar algo como lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3467 (Salaires (Kitab Al-Ijarah)), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 3467 numaralı hadis, bir şeyin helal olup olmadığını anlatmaktadır. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile haleflerinin sözlerini içeren metinleri derleyen Helal ve Haram bölümü tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3467, menyebutkan tentang kebolehan sesuatu. Hadits ini dikompilasi oleh bagian Halal dan Haram, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
