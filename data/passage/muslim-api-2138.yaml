label: { ar: "صحيح مسلم 2138 — عيادة المريض", en: "Sahih Muslim 2138 — visiting the sick", ur: "صحیح مسلم 2138 — بیمار کی عیادت" }
text: "… فَقَالَ رَسُولُ اللَّهِ \" يَا أَخَا الأَنْصَارِ كَيْفَ أَخِي سَعْدُ بْنُ عُبَادَةَ \". فَقَالَ صَالِحٌ. فَقَالَ رَسُولُ اللَّهِ \" مَنْ يَعُودُهُ مِنْكُمْ \". فَقَامَ وَقُمْنَا مَعَهُ وَنَحْنُ بِضْعَةَ عَشَرَ مَا عَلَيْنَا نِعَالٌ وَلاَ خِفَافٌ وَلاَ قَلاَنِسُ وَلاَ قُمُصٌ نَمْشِي فِي تِلْكَ السِّبَاخِ حَتَّى جِئْنَاهُ فَاسْتَأْخَرَ قَوْمُهُ مِنْ حَوْلِهِ حَتَّى دَنَا رَسُولُ اللَّهِ وَأَصْحَابُهُ الَّذِينَ مَعَهُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2138، يذكر عيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2138 (The Book of Prayer - Funerals), that mentions visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2138، جس میں بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
