summary:
  ar: "لا تجزئ في الرقاب الواجبة رقبة من نصراني أو يهودي، ولا مكاتب أو مدبر أو أم ولد أو معتق إلى أجل، ولا أعمى. ويجوز عتق الكتابي والمجوسي تطوعا، واستدل مالك بآية سورة محمد على أن المنّ هو العتاقة. {cite:muwatta-maruf-1997 p.331}"
