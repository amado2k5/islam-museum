label: { ar: "الموطأ 2258 — مالك: من لا يجزئ عتقه في الرقاب الواجبة", en: "Muwatta 2258", es: "Muwatta 2258", fr: "Muwatta 2258", ur: "موطا 2258", tr: "Al-Muwatta 2258 — Malik: Kölelerin özgür bırakılması için gerekli olan azat etme şartına uymayan kimse.", id: "Al-Muwatta 2258 — Malik: Orang yang pembebasannya tidak cukup untuk membebaskan budak secara wajib" }
summary:
  ar: "لا تجزئ في الرقاب الواجبة رقبة من نصراني أو يهودي، ولا مكاتب أو مدبر أو أم ولد أو معتق إلى أجل، ولا أعمى. ويجوز عتق الكتابي والمجوسي تطوعا، واستدل مالك بآية سورة محمد على أن المنّ هو العتاقة. {cite:muwatta-maruf-1997 p.331}"
  tr: "Hristiyan veya Yahudi olan, mükatab (azat sözleşmesi yapmış köle), müdabbar (azat edilmesi efendisinin ölümüne bağlı köle), umm velad (efendisinden çocuk doğurmuş köle), belirli bir süre için krediyle azat edilmiş köle veya kör olan bir köleyi azat etmek caiz değildir. Hristiyan veya Mecusi bir köleyi gönüllü olarak azat etmek caizdir. Malik, azat etmenin \"el-manna\" (azat etme eylemi) olarak tanımlandığına dair delil olarak Muhammed Suresi'nden bir ayet zikretmiştir. {cite:muwatta-maruf-1997 s.331}"
