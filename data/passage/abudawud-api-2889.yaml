label: { ar: "سنن أبي داود 2889 — الأب والأبوة", en: "Sunan Abi Dawud 2889 — the father and fatherhood", ur: "سنن ابی داؤد 2889 — باپ اور والدیت" }
text: "حَدَّثَنَا مَنْصُورُ بْنُ أَبِي مُزَاحِمٍ، حَدَّثَنَا أَبُو بَكْرٍ، عَنْ أَبِي إِسْحَاقَ، عَنِ الْبَرَاءِ بْنِ عَازِبٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ فَقَالَ يَا رَسُولَ اللَّهِ يَسْتَفْتُونَكَ فِي الْكَلاَلَةِ فَمَا الْكَلاَلَةُ قَالَ \" تُجْزِيكَ آيَةُ الصَّيْفِ \". فَقُلْتُ لأَبِي إِسْحَاقَ هُوَ مَنْ مَاتَ وَلَمْ يَدَعْ وَلَدًا وَلاَ وَالِدًا قَالَ كَذَلِكَ ظَنُّوا أَنَّهُ كَذَلِكَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2889، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2889 (Shares of Inheritance (Kitab Al-Fara'id)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2889، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
