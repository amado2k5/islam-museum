label: { ar: "سنن النسائي 4141 — ما خلّفه من تركة وميراث", en: "Sunan al-Nasa'i 4141 — what was left behind: estate and inheritance", ur: "سنن نسائی 4141 — ترکہ اور میراث", es: "Sunan al-Nasa'i 4141 — Lo que quedó: patrimonio y herencia" }
text: "… مَحْبُوبٌ، - يَعْنِي ابْنَ مُوسَى - قَالَ أَنْبَأَنَا أَبُو إِسْحَاقَ، - هُوَ الْفَزَارِيُّ - عَنْ شُعَيْبِ بْنِ أَبِي حَمْزَةَ، عَنِ الزُّهْرِيِّ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، عَنْ عَائِشَةَ، أَنَّ فَاطِمَةَ، أَرْسَلَتْ إِلَى أَبِي بَكْرٍ تَسْأَلُهُ مِيرَاثَهَا مِنَ النَّبِيِّ مِنْ صَدَقَتِهِ وَمِمَّا تَرَكَ مِنْ خُمُسِ خَيْبَرَ قَالَ أَبُو بَكْرٍ إِنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4141، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4141 (The Book of Distribution of Al-Fay'), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 4141، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4141 (El Libro de la Distribución de Al-Fay'), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
