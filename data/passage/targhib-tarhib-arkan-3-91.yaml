text: "… عتل أى شديد غليظا ومن صفة المؤمن اللين والسهولة وشيطان اشتقاقه من الشطن وهو البعد من الخير وهو اسم المارد الخيث من الجن والانس والحكم هو الحاكم الذى لا يرد حكمه وهذه الصفة لا تليق الا بالله تعالى ومن أسمائه …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 3، ص 91، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 3, p. 91, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 3، ص 91 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 3, pág. 91, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Tarhib wa-l-Tarhib d'al-Mundhiri (tome 3, page 91) mentionnant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 3. cildinin 91. sayfasından, müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. İslam'ın Temelleri, İmanın Temelleri, İmanın Dalları ve Müminin Özellikleri başlığı altında derlenmiştir."
  id: "Kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Dorongan dan Peringatan), Jilid 3, halaman 91, yang menyebutkan ciri-ciri seorang mukmin; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Kitab ini disusun berdasarkan Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Ciri-ciri Seorang Mukmin."
