text: |-
  ⁦(فصل الصاد)⁩
  ضرك)
  ١٢٩
  على مستظلات العيون سواهم • شويكية يكسوبراهالغامها
  وشوّك الرأس بعد الحلق أى بات شعره وشوّكْ الفرخ أنبت وشوّكت المائط أى جعلت عليه
  الشوك عن الاصمعىّ وبردة شوكا أى خشنة المسر لانها جديد وقد أشوكت النخل أى كثر
  شوكهاوشجرة مشوكة وأرض مشوكة أى كشيرة الشوك فيها السحاء والقتاد والهراس
  وشوكة العقرب ابرتها وشوكة الحائك التى يسوّى بها السداة واللحمة وهى الصيصية .
  صل الصاد أل) أبوزيد يقال صئك ارجل يه ألصأ كااذاعرق فها جت منه
  ريح منتنة من ذفرأ وغير ذلك (صعلك السعلول الفقير وصعاليك العرب ذؤياه اوكان
  عروة بن الورد يسمى عروة الصعاليك لانه دان يجمع الفقراء في حظيرة فيرزقهم ممايغنفه
  والتصعل الفقر قال الشاعر • غنيناز مانا بالتصعلك والغنى:أى عننازمانا ويقال
  تصعلكت الابل اذاطرحت أوبارهصكك. مكه أى فربه قال الراجز
  يا كروانا صك فاكبأنا* ومنه قوله تعالى فصكت وجهها وصككت الباب اذا أطبقته
  ورجل أصك بين الصكان وقد مككت يارجل وهو أن تصطك ركبتاه وظليم أصك لانه أرح
  طويل الرحلين وربما أصاب لتقارب ركبتيه بعضه بعضا اذا مشى وجل مصك وحار مصك
  أى قوى شديد والانى مصكة وأنشديعقوب
  ترى المصك بعارد العواشيا • جلتها والاخر الحواشيا
  والصك كتاب وهوفارى معزب واجمع أصف وصكالن وصكوك والمكة أشد الهابرة حرًّا
  بقال لقيته صكة عمى وهواسم رجل ويقال «وتصغير أعمى مرخا مك الصمكول
  والصمكيك من الرجال الفليظ المافى قال ابن السكيت لبن صمكين وممكوك وهو اللزج
  والصمكمك القوى" واصمأن اللبن بالهمز أى ختر جدا -تى يصير كالجبن واصمأن الرجل أيضا
  أى غضب عن أبى زيد ول ولهم لقيه أول صوك وبول أى أول شئ يك
  صالبه الطيب يصيك أى لصق به ومنه قول الاعشى* وصاكك العبير بأجلادها *
  صل الضاد برك رحل وجل ضبر الهأى ضخم وكذلك الضبارك قال الراجز
  أعددت فيه ا باز لاضباركا • يقصر يشى ويطول باركا
  والجمع الضبارك بالفتح حك) ضحل يضول ضحكا وضكا وضحكا وضحكا أربع لفات
  والضحكة المرة الواحدة ومنه قول كثير * غلقت لضحكته رقاب المال • وضحكت به ومنه
  ععنى وتضاحك الرجل واستضحك بمعنى وأضحكه اللّه ورجل ضحكة أى كثير الضمن وضحكه
  بالتسكيز يضحك منه والاضحوكة ما يضحك منسه وامرأة مضاك كثيرة الضحك قال ابن
  الاعرابىّ الضاحك من السحاب مثل العارض الا أنه اذا برق قيل ضحك والضاحكة السنّ التى
  بين الانياب والاضراس وهى أربع ضواحك والضهوك الطريق الواسع والضحك الطلع
  حين ينشق قال أبوذؤيب• فجاء؟ زج لم برالناس منله • هوالضحك الا انه عمل النحل
  قال أبو عمر وشبه بساض العسل يبياضه ويقال القرد يضحك اذاصوت.( رك قال
  الاصمعىّ الضريك الضرير وهوالبائس الفقير ولا يصر ف له فعل لايقولون ضركه فى معنى
  ضرّه والمع ضرائك وضركاء قال الكميت يمدح مسلة بن هشام
  قوله وهواسم رجل فى القا.وس
  هو من العمالفسة أغارعلى قوم
  فى ظهيرة فاجتاحهم اه وقوله
  الصحكوك كلزون والصمكيسك
  يعنى محتركة كما فى القاموس اه
