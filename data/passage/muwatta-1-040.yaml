label: { ar: "الموطأ 40 — غسل اليد عند الاستيقاظ قبل إدخالها في الإناء", en: "Muwatta 40" }
text: "إذا استيقظ أحدكم من نومه فليغسل يده قبل أن يدخلها في وضوئه، فإن أحدكم لا يدري أين باتت يده"
summary:
  ar: "أول حديث في باب وضوء النائم إذا قام إلى الصلاة. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: أمر النبي المستيقظ من نومه أن يغسل يده قبل أن يدخلها في ماء وضوئه، لأنه لا يدري أين باتت يده. ويخرّجه المحقق عند البخاري (162) وابن حبان (1063) وأحمد (2/465) والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (18/227). {cite:muwatta-maruf-1997 p.54}"
