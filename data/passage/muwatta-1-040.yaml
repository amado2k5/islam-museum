label: { ar: "الموطأ 40 — غسل اليد عند الاستيقاظ قبل إدخالها في الإناء", en: "Muwatta 40", es: "40 Muwatta", fr: "40 Muwatta", ur: "40 موطا", tr: "Al-Muwatta 40 — Uyandıktan sonra elleri yıkamak ve ardından kaba koymak.", id: "Al-Muwatta 40 — Mencuci tangan setelah bangun tidur sebelum memasukkannya ke dalam wadah" }
text: "إذا استيقظ أحدكم من نومه فليغسل يده قبل أن يدخلها في وضوئه، فإن أحدكم لا يدري أين باتت يده"
summary:
  ar: "أول حديث في باب وضوء النائم إذا قام إلى الصلاة. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: أمر النبي المستيقظ من نومه أن يغسل يده قبل أن يدخلها في ماء وضوئه، لأنه لا يدري أين باتت يده. ويخرّجه المحقق عند البخاري (162) وابن حبان (1063) وأحمد (2/465) والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (18/227). {cite:muwatta-maruf-1997 p.54}"
  id: "Hadits pertama dalam surah ini membahas tentang wudhu orang yang telah tidur dan kemudian bangun untuk shalat. Diriwayatkan oleh Yahya dari Malik, dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah: Nabi (shalawat dan salam kepadanya) memerintahkan orang yang bangun tidur untuk mencuci tangannya sebelum memasukkannya ke dalam air untuk wudhu, karena ia tidak tahu di mana tangannya berada selama malam. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (162), Ibn Hibban (1063), Ahmad (2/465), al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (18/227). {cite:muwatta-maruf-1997 p.54}"
