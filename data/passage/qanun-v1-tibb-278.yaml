text: "… هو مستعص على القيء، كالسوداء، ومنها ما له حال وحال كالبلغم. والمحموم إسهاله أصوب من تقيئه، ومن كان خلطه نازلاً مثل أصحاب زلق الأمعاء، فتقيؤه محال. وشرّ الأدوية المسهّلة ما هو مركّب من أدوية شديدة الاختلاف في زمن الإسهال فيضطرب …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 278، يذكر الحمى والوعك، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 278, that mentions fever, named diseases, the hospital and the medical craft, the organs of the body, the drug; from the machine-read scan, quoted within forty words per the sources policy."
