text: "… هو مستعص على القيء، كالسوداء، ومنها ما له حال وحال كالبلغم. والمحموم إسهاله أصوب من تقيئه، ومن كان خلطه نازلاً مثل أصحاب زلق الأمعاء، فتقيؤه محال. وشرّ الأدوية المسهّلة ما هو مركّب من أدوية شديدة الاختلاف في زمن الإسهال فيضطرب …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 278، يذكر الحمى والوعك، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 278, that mentions fever, named diseases, the hospital and the medical craft, the organs of the body, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 278 کا اقتباس جس میں بخار، بیماریوں کے نام، بیمارستان، اعضائے بدن، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 278, que menciona la fiebre, enfermedades específicas, el hospital y la práctica médica, los órganos del cuerpo y los medicamentos; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 278, qui mentionne la fièvre, les maladies nommées, l'hôpital et l'art médical, les organes du corps, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 278'den bir bölüm; ateş ve hastalık, hastalıkların isimleri, hastane ve tıp mesleği, vücut organları ve ilaçtan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 278, yang menyebutkan demam dan penyakit, nama-nama penyakit, rumah sakit dan profesi medis, organ-organ tubuh, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
