  ذ ابن السكيت الحشرج الحسى يكون فحصى وأنشد لعمر بن أبي ربيعة
  فلتمت فاها آخذا برونها * شرب النزيف ببردماء الحشرج
  ⁦(حضج)⁩ الحضج بالكسر مأيبقى فى حياض الابل من الماء وقال
  فأسأرت فى الحوض حضجاحاضجا والجمع أحضاج وحضجت به الارض أى ضربت به
  وحضحت النارأ وقدتها واضذج الرجل التهب غضبا وفى الحديث من شاء أن يتحضج
  فلينهذج أى يتقدمن الغيظ ويندق قلج لحفلج بتنديد اللام الافجج لج
  حلج القطن يحلمه ويجلحه فهو حلاج والقطن حليح ومحرلوج والخلج والمحلجة ما يحلج عام
  رالمحلاج ما يحلج به وحلج القوم املتهم أى ساروها يقال بيننا ويينهم حلجة بعيدة قال
  أبو صاءد الحايجة عصارة نحى أولين أنقع فيه تمر وقال أبوم هدى وغنية هى السمن على
  المحض (حج حج الرجل عينه تحميه ايتشف النظر اذاصغرها قال ذوالاصبع
  إنى رأيت بن أبيتك محمجين الى تشوسا
  وتحميج العين أيضاغؤورها وقال أبو عبيدة التهميج شدة النظر ( لج حلج الحبل أى
  قتله فتلاسديداقال الراجز
  قلت ندود كاءب عطبول • مياسة كالفبية الخذول
  ترنوبعينى شادن كيل * هل لك فى محملج مفتول
  والمملاح منفاخ الصائسغ ⁦(حنج)⁩ حنجه وأحن. أى أماله وأحنج كلامه أى لواهكما
  يلويه المخنث والحج بالكسر الاصل يقال عاد الى حنجه وبتجه ⁦(حوج)⁩ الحاجة
  معروفة والجمع حاج وحاجات وسوج وحوائج على غير قياس كأنهم بهع وأحائجة وكان
  الاصمعى ينكره ويقول هوم ولد وانما أتكره لخروجه عن القياس والافه وكثير فى
  كلام العرب وينشد
  نهار المر أمثل حين يقضى • -وائجه من الليل الطوبل
  والحوجا الحاجسة يقال ما فى صدرى به حوجاء ولالوجاء ولاشك ولامرية بعى واحد
  ويقال ليس فى أمرك -ويجاء ولالويجاء ولارويغة قال اللعيانىّ مالى فيه حوجاء ولالوجاء
  ولا حويجاء ولا لويجاء قال قيس بن رفاعة
  من كان فى نفسه حرجاء يطلبها * عدى فانى لدرهن باصحار
  أقيم نخوته ان كان ذاعوج * كمايقوم قدح النبعة البارى
  أى كلة قبيحة ولا حسنة وحاج يحوج حوجا أى احتاج قال الكميت
  عنيت فلم أرددكم عندبغية • وحجت ذلم أ كددكم بالاصابع
  وأحوجه اليه غيره وأحوج أيضاعهنى احتاج والحاج ضرب من النول والحاج
  جمع حاجة قال الشاعر
  وأرضع حاجة بلبان أخرى * كذاث الحاج زضع باللبان
  صل الخار خيج خيجه بالعصاضربه بهاوخيج بهاحبق خبرج) الخبرنجة
