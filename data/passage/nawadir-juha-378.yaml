text: "… لستم بأعلم من صاحبها لبس فروة ثعلب مقلوباً شعرها إلى الخارج، فقيل له ما هذا؟ فقال: ما أنتم بأعلم من صاحبها الثعلب، ولولا أنَّ لبسها هكذا أصلحُ لما لبسها كما ترون. أصلبوه فإنَّه أروحُ له من ظلمة القبر مات عمُّه، …"
summary:
  ar: "لبس جحا معطفاً من جلد الثعلب وفروه إلى الخارج، فسُئل عن السبب، فقال إنهم ليسوا بأعلم من الثعلب، وهكذا يُلبس على أفضل وجه. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  en: "Juha wears a fox-skin coat fur-side out; asked why, he says they do not know better than the fox, and this is how it is best worn. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  ur: "جحا نے لومڑی کی کھال کا کوٹ پوشم باہر کی طرف کر کے پہنا، وجہ پوچھی گئی تو اس نے کہا کہ آپ لومڑی سے زیادہ نہیں جانتے، اور اسے اسی طرح پہننا سب سے بہتر ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  fr: "Juha porte un manteau en peau de renard, la fourrure à l'extérieur ; interrogé sur la raison, il dit qu'ils n'en savent pas plus que le renard, et que c'est ainsi qu'on le porte le mieux. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  es: "Juha lleva un abrigo de piel de zorro con el pelo hacia fuera; al preguntarle por qué, dice que ellos no saben más que el zorro, y que así es como mejor se lleva. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
  tr: "Juha, kürkü dışa dönük şekilde tilki derisinden yapılmış bir palto giymişti. Nedenini sorduklarında, tilkiden daha akıllı olmadıklarını ve bunun en iyi giyim şekli olduğunu söylemişti. {cite:juha-nawadir-kubra-djuwaydi s. 186}"
  id: "Juha mengenakan mantel yang terbuat dari kulit rubah dengan bulu menghadap ke luar. Ketika ditanya mengapa, dia menjawab bahwa mereka tidak lebih bijak daripada rubah, dan bahwa ini adalah cara terbaik untuk berpakaian. {cite:juha-nawadir-kubra-djuwaydi p. 186}"
