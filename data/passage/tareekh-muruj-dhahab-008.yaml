text: "هر، فلما رجع إلى خراسان أخرجه إلى خاصته، وقال لهم: والله ما هذا كتاب مضعوف، ولكنه كتاب مخذول . ولم يكن فيمن سلف من الخلفاء إلى وقتنا هذا - وهو سنة اثنتين وثلاثين وثلاثمائة - من أبوه وأمه من بني"
