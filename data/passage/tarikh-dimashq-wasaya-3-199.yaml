text: "… شيئًا قط قبله، فلم أزل معه حتى حضرته الوفاة، فقات : يا فلان قد حضرت ما ترى من أمر الله وإِني والله ما أحببت شيئًا قط حبك فماذا تأمرني ? وَإِلى من توصي بي ?فتمال لي : اى بني والله …"
summary:
