text: |-
  ١٩١
  ⁦( مح)⁩ القمح البرّ والقمح مصدرقحت السويق وغيره بالكسراذا استففته وكذلك
  الاقتماح والقميعة اسم لما يقسمح من الجوارش وغيره كأنه فعبلة من القمح وهو البر
  والقمعة بالضم مل الفم منه والقمحان بالتسديد الورس والقمدان أيضاشى :ع-اوالجر
  كالذريرة وقح البعيروا اذارفع رأسه عند الحوض وا-تنع من الشرب فهو بعير قامح
  والجمع قح بالتتديد يقال شرب فتقمح وانقمح بعنى اذارفع رأسه وتزل الشرب ريا وقد
  قامحت ابلك اذا وردت ولم تشرب ورفعت رأسها من داء يكون بما أوبرد وهى ابل مقامحة
  وبعير مقامح وناقة مقامح أيضا ولمع قاح على غير قياس قال بشمر يصف سفينة
  ونحن عسلى جوانبها قعود * نفض العارف كالابل القماح
  والاقاح رفع الرأس وغض البصر يقال أقحه الغل اذا ترك رأسه هر فوعامن ضيقه وشهرا
  قاح (١ شتما يكونمن البرد سميا بذلك لان الابل اذا وردت آذاها برد الما فقامحت
  نح قهت الشى قنها اذا عطفته كالمحجن والقناحة بالضم مشددة مفتاح معوج
  طويل وقنحت الباب اذا أصلحت ذلك عليه ⁦(فيح)⁩ القيح المدة لا يخالطهادم تقول
  منسه قاح الجوح يقيح وقيح الجرح وتقيح وقاحة الدارساحتها
  صل الكاف ( كبح كبحت الداية اذاجذبتها اليك باللجام لكى تقف ولا تجرى
  يقال أكمتها وأ كفمتها وكيحتها هذه وحدها بلا ألف عن الاصمعى ( نخ
  كهه كنها اذارمى جسمه بما أترفيه والطعام اذا أ كل منه حتى شبع (لشع%%، أبو عمرو
  عربة كج وعربية كماغة فى قح وححة وأم كمة امر أة تزات فى شأنها الفرائض والكسكمح
  العجوز الهرمة والناقة الهرمة ⁦( كدح)⁩ الكدح العمل والسعى والحدس والكسب
  قال هويكدح فى كذا أى يكذوقوله تعالى انك كادح الى ربك كدحا أى تسمى وأصاي
  فكدح وجهه وبه كدح وكدوح أى خدوش وقيل الكدح أكثر من الخدش وفى
  الحديث فى وجهه كدوح أى خدوش وهويكدح اعياله ويكتدح أى يكتسب لهم قال الاغلب
  العجلى أبو عمال يكدح المكادا والتكديمح التخديش يقال ماره كتح قد
  عضضته الهروتكدح الادتخدش ⁦(كردح)⁩ الكردحة عد والقصيرية رمط وبسرع
  وكذلك الكرتحة والمكر محة قال أبوعمر وكرمحنا فى آثار القوم عدوناعد والمتفاقل قال
  الاصمعى سقط من السطح فتكردح أى تدحرج ( كسح سعت البيت كفسته والمكسعة
  ما يكنس به النلج وغيره وكسهت الريح الارض قشرت عنها التراب وأغار واعليهم
  فاكتسحوهم أى أخذوامالهم كله والسكاحة مشل الكناسة والا كسح الاعرج والمقعد
  أيضاقال الاعنى
  بين مغلوب بنيل جده * وخذول الرجل من غير كسح
  وفى الحديث الصدقة مال الكسحان والعوران ) ( كشح الكشح مابين الخاصرة
  الى الضلع الخلف وطوى فلان عنى كشحه اذا قطعك وطويت كشيى على الامر اذا أضمرته
  سترته والكشح بالتحريك داء يصيب الانسان فى كشعه فيكوى وقد كشح الرجل
  شحااذا كوى.مه ومنه سمى المكشوح المرادى والكشاح سمة فى الكنم والكاتج
  لذى يضرلك العداوة بقال كشح له بالعداوة وكاشحه بممنى وكشح القوم عن الماء
  قوله من ضبقه ومنهة وله تعالى
  فهم حقمحون وقوله عليه السلام
  لسيدنا على ستقدم على اللّه أنت
  وشيعتك راضين مرضيين ويقدم
  عليه عدوّك غضا بامقممين ثم
  بجع يده الى عنفه بريهسم كيف
  الاقاح اه نة-له عاصم أفندى
  عن البصائر والنهاية
  ١ بوزن كتاب وغسراب اه
  قاموس وقد غلط وانغولى هنا
  فجعله إقاح بوزن افعال قاله نصر
  قوله كتح الخ هذه المادة موجودة
  فى مختصر الصاح وفى ترجة
  وانقولى ولسكنها ساقطة من عدّة
  نخ واهذا كتبها القاموس
  بالاحر على عادته فيمايز يده على
  الصاح فاله نصر
