text: |-
  ٣٩٤
  nœكفر)
  وقال أبوزيدالكرير الحشرجة عند الموت وكزرت الشئ تكريرا وتكرارا قال أبو سعيبد
  الضريرقلت لابى عمروما الفرق بين تفعال وتفعال فقال تفعال بالسكسراسم وتفعال بالفتح
  مصدر وتكر كر الرجل فى أمره أى تردّد والسكركرة فى الضحل مثل القرقرة والكركرة
  تصر يف الريح السحاب اذا بمعته بعد تفرف وقال •باتت تكركر. الجنوب• وأصله تكترره
  من التكر يروكركوت بالدجاحة صحت بها وكركرته عنى أى دفعته ورددته (كزبر الكزبرة
  من الابازيريضم الباءود تفتح وأظه معربا ⁦(كسر)⁩ كسرت الشى فانكسر وتكسم
  وكسرته شدد للتكثير والمبالغة وفاقة كنسيركما قالوا كف خضيب ويقال كسر الدائراذا
  غم جنا يه حين ينقض قال الهجاج تقضى الباذى اذا اليازى كسر والسكاسر العقاب
  والكسفر فالكسر أسفل شقة لبيت التى قلى الارض من حمث يكسر جانياه من عن يميند
  ويسارك عن ابن الكيت قال ومنه قبل فلان.كا.رى أى جارى كسربة← الى يانب
  كسربيتي والكسر أيضاعظم ليس عليه كنير لحم والجمع كسور قال الشاءر
  الابكرت عرى بليل تلومن • وفى كفها كسرايح ردوم
  ولا يكون كذا الاوهومكسورويقال أيضالعظم الساعد مما يلى النصف منه الى المرفق
  كسرقيم فو كنتاعرا كنت ميرمذلة . ولو كنت كسرا كنت كسر قيج
  والفتع فى هؤلاء الثلاثه لغة والكسرة القطعة من الذئ المكسور والجمع كسرمذن فطعة وقطع
  وعود صلب المكسر يكسر السين اذاء رفت جودته بكسره ويقالدفلان طيب المكسراذا
  كان مهو داعند اخبرة وأرض ذات. ك. ور أى ذات صعودوهبوط ورجدل ذوكسرات
  وهزرات اذا كان يغين فى كل شىء وكسار الحطب دقاقه وشئ كندير أى مكسوروابهع كسرى
  مثل مريض ومرضى وكسرى لقب ملوك الفرس بفتح السكاف وكسرها وهو معرب خسرو
  والنسبة اليه كسروىّ وان شقت كسرى مثل جرمى عن أبى عمرو وجع كسرى أكاسرة
  على غدير قياس لانّ فياسه كسرون بفتح الراهمثل عيسون وموسون بفتح السين ⁦( كشر)⁩
  كشر البعير عن نابه أى كشف عنها ابن السكيت الكشر التبسم يقال كشر الرجل وإذكل
  وافتروا بتسم كل ذلك تيدومنه الاسنان ⁦(كظر)⁩ الكظر فسية القوس هو الفرض
  الذى فيه الوتر والكظر أيضاما بين الترقوتين هذا الحرف نقلته من كتاب من غير مماع
  ( كعر الاصمعى اذا حل الفصيل فى سنامه شه ماقيل أكعر فهو مكعر أى مجذ
  والكنهرة الناقة العظيمة وبجعها كناءر حكا. أبو عبيد عن أبى زيد(كعبر السكعبرة واحدة
  الكعابر وهوشى يخرج من الضعام إذانقى غليظ الرأس مجتمع ومنهسميت رؤس العظام
  الكعابر وبقال كعبره بالسيف أى قطعه ومنهسمى المكعبر الغى "لانه ضرب قوما
  بالسيف كفر) الكفر ضدّالايمان وقد كفربالله كفرا وجع الكافر كفاروكفرة وكفار
  أيضامثل جائع وجياع ونائم ونيام وجمع الكافرة الكوافر والكهر أيضابدود النعممة
  وهوضدّ الشكررقد كفره كفورا وكفرانا وقوله تعالى انا بكل. كافرون أى باحدون وقوله
  ،زوجل فأبى الظالمون الاكفورا قال الاخفش هوجمع الكر مثل بردوبرود والسكفر بالقح
  المتعدالية
