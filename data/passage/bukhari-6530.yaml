label:
  ar: "البخاري 6530 — يا آدم أخرج بعث النار"
  en: "Bukhari 6530 — Adam, bring out the party of the Fire"
  ur: "بخاری 6530 — اے آدم، آگ والوں کا حصہ نکالو"
text: "يقول الله يا آدم. فيقول لبيك وسعديك والخير في يديك. قال يقول أخرج بعث النار. قال وما بعث النار قال من كل ألف تسعمائة وتسعة وتسعين. فذاك حين يشيب الصغير، وتضع كل ذات حمل حملها، وترى الناس سكرى وما هم …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6530: يا آدم أخرج بعث النار. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6530: Adam, bring out the party of the Fire. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6530: اے آدم، آگ والوں کا حصہ نکالو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
