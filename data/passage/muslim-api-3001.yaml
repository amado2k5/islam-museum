label: { ar: "صحيح مسلم 3001 — ما لا يحل", en: "Sahih Muslim 3001 — what is not lawful", ur: "صحیح مسلم 3001 — جو حلال نہیں", es: "Sahih Muslim 3001 — lo que no es lícito", fr: "Sahih Muslim 3001 — ce qui n'est pas licite" }
text: "… سَلْ لِي عُرْوَةَ بْنَ الزُّبَيْرِ عَنْ رَجُلٍ يُهِلُّ بِالْحَجِّ فَإِذَا طَافَ بِالْبَيْتِ أَيَحِلُّ أَمْ لاَ فَإِنْ قَالَ لَكَ لاَ يَحِلُّ. فَقُلْ لَهُ إِنَّ رَجُلاً يَقُولُ ذَلِكَ - قَالَ - فَسَأَلْتُهُ فَقَالَ لاَ يَحِلُّ مَنْ أَهَلَّ بِالْحَجِّ إِلاَّ بِالْحَجِّ. قُلْتُ فَإِنَّ رَجُلاً كَانَ يَقُولُ ذَلِكَ. قَالَ بِئْسَ مَا قَالَ فَتَصَدَّانِي الرَّجُلُ فَسَأَلَنِي فَحَدَّثْتُهُ فَقَالَ فَقُلْ لَهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3001، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3001 (The Book of Pilgrimage), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3001، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 3001 (El Libro de la Peregrinación), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3001 (Le Livre du Pèlerinage), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
