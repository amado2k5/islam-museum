label: { ar: "سنن النسائي 1308 — الأب والأبوة", en: "Sunan al-Nasa'i 1308 — the father and fatherhood", ur: "سنن نسائی 1308 — باپ اور والدیت", es: "Sunan al-Nasa'i 1308 — El padre y la paternidad" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ بَشَّارٍ، عَنْ مُحَمَّدٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ أَشْعَثَ، عَنْ أَبِيهِ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، -ا - قَالَتْ سَأَلْتُ رَسُولَ اللَّهِ عَنْ عَذَابِ الْقَبْرِ فَقَالَ \" نَعَمْ عَذَابُ الْقَبْرِ حَقٌّ \". قَالَتْ عَائِشَةُ فَمَا رَأَيْتُ رَسُولَ اللَّهِ يُصَلِّي صَلاَةً بَعْدُ إِلاَّ تَعَوَّذَ مِنْ عَذَابِ الْقَبْرِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1308، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1308 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1308، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1308 (El Libro del Olvido (En la Oración)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
