text: "… خذ هذا اللاشيء مثل بين يدي الحاكم شخصان وادَّعيا ما يأتي : قال المدعي: يا سيدي، إنَّ هذا الرجل كان حامِلاً على عاتقه حطباً فزلقت رجله ووقع، وتبدَّد الحطب، فناداني وطلب مني أن أُساعده، فقلت له : ما تعطيني أُجرةً …"
summary:
  ar: "طلب حمّال ألا يأخذ أجراً، فساعده رجل مجاناً، ثم طالب المساعد بلا شيء، فقال له جحا أن يرفع السجادة التي يجلس عليها ويأخذ ما تحتها، وهو لا شيء. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  en: "A porter asks for nothing as his wages, and a man helps him for nothing. The helper then claims his 'nothing', and Juha tells him to lift the carpet on his seat and take what is beneath, which is nothing. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  ur: "ایک مزدور اجرت میں کچھ نہیں مانگتا اور ایک آدمی اس کی مفت مدد کرتا ہے۔ پھر مددگار اپنا کچھ نہیں مانگتا ہے تو جحا اس سے کہتا ہے کہ اپنی نشست کا قالین اٹھاؤ اور جو اس کے نیچے ہے لے لو، اور وہ کچھ نہیں ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  fr: "Un porteur ne demande rien comme salaire, et un homme l'aide pour rien. L'aide réclame ensuite son « rien », et Juha lui dit de soulever le tapis de son siège et de prendre ce qui se trouve dessous, c'est-à-dire rien. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  es: "Un porteador no pide nada como paga, y un hombre lo ayuda por nada. El ayudante reclama entonces su «nada», y Juha le dice que levante la alfombra de su asiento y tome lo que hay debajo, que es nada. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  tr: "Hamal ücret istemediği için bir adam ona ücretsiz yardım etti. Hamal yardımının karşılığını isteyince Juha ona oturduğu kilimi kaldırmasını ve altındakini almasını söyledi; altında hiçbir şey yoktu. {cite:juha-nawadir-kubra-djuwaydi s. 100}"
  id: "Seorang porter meminta untuk tidak dibayar, jadi seorang pria membantunya secara cuma-cuma. Kemudian porter itu menuntut bayaran atas bantuannya, jadi Juha menyuruhnya mengangkat karpet yang sedang dia duduki dan mengambil apa yang ada di bawahnya, yang ternyata tidak ada apa-apa. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
