text: "لا تنتقب المرأة المحرمة، ولا تلبس القفازين"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: لا تنتقب المرأة المحرمة، ولا تلبس القفازين. ويذكر المحقق أن البخاري علّقه عن مالك، وأن الليث بن سعد رواه عن نافع عن ابن عمر عن النبي، وأن البخاري ذكر متابعات موسى بن عقبة وإسماعيل بن إبراهيم وجويرية وابن إسحاق في النقاب والقفازين. {cite:muwatta-maruf-1997 p.440} {cite:muwatta-maruf-1997 p.441}"
