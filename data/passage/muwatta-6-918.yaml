label: { ar: "الموطأ 918 — ابن عمر: لا تنتقب المرأة المحرمة، ولا تلبس القفازين", en: "Muwatta 918", es: "Muwatta 918", fr: "Muwatta 918", ur: "موطا 918", tr: "El-Muvatta 918 — İbn Ömer: İhramlı bir kadın peçe veya eldiven giymemelidir.", id: "Al-Muwatta 918 — Ibn Umar: Wanita yang sedang ihram tidak boleh memakai niqab atau sarung tangan" }
text: "لا تنتقب المرأة المحرمة، ولا تلبس القفازين"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يقول: لا تنتقب المرأة المحرمة، ولا تلبس القفازين. ويذكر المحقق أن البخاري علّقه عن مالك، وأن الليث بن سعد رواه عن نافع عن ابن عمر عن النبي، وأن البخاري ذكر متابعات موسى بن عقبة وإسماعيل بن إبراهيم وجويرية وابن إسحاق في النقاب والقفازين. {cite:muwatta-maruf-1997 p.440} {cite:muwatta-maruf-1997 p.441}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın şöyle dediğini aktarmıştır: \"İhramlı bir kadın peçe veya eldiven giymemelidir.\" Araştırmacı, bu rivayetin Buhari'nin Sahih'inde Malik'ten rivayetle yer aldığını ve el-Layth ibn Sa'd'ın da Nafi'den, onun da İbn Umar'dan, onun da Peygamberimizden rivayetle bunu naklettiğini belirtmektedir. Buhari ayrıca peçe ve eldivenle ilgili olarak Musa ibn Uqba, İsmail ibn İbrahim, Cüveyriye ve İbn İshak'ın da doğrulayıcı rivayetlerini zikretmektedir. {cite:muwatta-maruf-1997 s.440} {cite:muwatta-maruf-1997 s.441}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: “Seorang wanita yang sedang ihram tidak boleh mengenakan niqab atau sarung tangan.” Peneliti menyebutkan bahwa al-Bukhari memasukkannya dalam Shahihnya dari Malik, dan bahwa al-Layth ibn Sa’d meriwayatkannya dari Nafi’ dari Ibn Umar dari Nabi. Al-Bukhari juga menyebutkan riwayat-riwayat yang menguatkan dari Musa ibn Uqba, Ismail ibn Ibrahim, Juwayriya, dan Ibn Ishaq mengenai niqab dan sarung tangan. {cite:muwatta-maruf-1997 p.440} {cite:muwatta-maruf-1997 p.441}"
