text: "… أدوار، بل كأنّه يتبع الامتلاء، وتكون علامات بواسير الرحم وربما كان الباسوري قطرة قطرة. وكثيراً ما يصحب البواسير في الرحم صداع، وثقل رأس، ووجع في الأحشاء والكبد والطحال، وإذا سال الدم من تلك البواسير فصل: في علاج نزف الدم نذكر …"
