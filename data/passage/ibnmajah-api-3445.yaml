label: { ar: "سنن ابن ماجه 3445 — السقم، الحمى والوعك", en: "Sunan Ibn Majah 3445 — sickness; fever", ur: "سنن ابن ماجہ 3445 — سقم، بخار", es: "Sunan Ibn Majah 3445 – enfermedad; fiebre", fr: "Sunan Ibn Majah 3445 — maladie; fièvre", tr: "Sünen İbn Mace 3445 - Hastalık, Ateş ve Rahatsızlık", id: "Sunan Ibnu Majah 3445 — Penyakit, Demam dan Gangguan" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، حَدَّثَنَا إِسْمَاعِيلُ ابْنُ عُلَيَّةَ، حَدَّثَنَا مُحَمَّدُ بْنُ السَّائِبِ بْنِ بَرَكَةَ، عَنْ أُمِّهِ، عَنْ عَائِشَةَ، قَالَتْ كَانَ رَسُولُ اللَّهِ ـ إِذَا أَخَذَ أَهْلَهُ الْوَعْكُ أَمَرَ بِالْحَسَاءِ. قَالَتْ وَكَانَ يَقُولُ \" إِنَّهُ لَيَرْتُو فُؤَادَ الْحَزِينِ وَيَسْرُو عَنْ فُؤَادِ السَّقِيمِ كَمَا تَسْرُو إِحْدَاكُنَّ الْوَسَخَ عَنْ وَجْهِهَا بِالْمَاءِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3445، يذكر السقم، والحمى والوعك. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3445 (Chapters on Medicine), that mentions sickness, fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3445، جس میں سقم، بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3445 (Capítulos sobre Medicina), menciona la enfermedad y la fiebre. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3445 (Chapitres sur la médecine), mentionne la maladie et la fièvre. Le Répertoire des ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3445 numaralı hadiste hastalık, ateş ve rahatsızlıktan bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3445, menyebutkan tentang penyakit, demam, dan sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
