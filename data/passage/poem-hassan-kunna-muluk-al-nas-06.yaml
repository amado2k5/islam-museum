summary:
  ar: البيت الأخير من القصيدة كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.395}}. يذكر ابن هشام قبله أن بيتاً في القصيدة عن غير ابن إسحاق (ص. 394، السطر 3).
  en: The last line of the poem as Ibn Hisham gives it, naming two men of the Ansar. Ibn Hisham's note on the earlier line 'and he gave him a name' (p. 394, line 3) says it comes from a source other than Ibn Ishaq; this line carries no such note.
