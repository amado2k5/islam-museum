label:
  ar: حسان، القصيدة اللامية ⁦(البيت 11)⁩
  en: Hassan's lam-rhymed poem, line 11
  es: "Poema de Hassan con rima lam, línea 11"
  fr: "Poème rimé de Hassan, vers 11"
  ur: "حسن کی لام سے بھری نظم، سطر 11"
text: ومنّا أمينُ المسلمين حياتُه ومن غسلته من جنابته الرسلُ
summary:
  ar: البيت الأخير من القصيدة كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.395}}. يذكر ابن هشام قبله أن بيتاً في القصيدة عن غير ابن إسحاق ⁦(ص. 394، السطر 3)⁩.
  en: The last line of the poem as Ibn Hisham gives it, naming two men of the Ansar. Ibn Hisham's note on the earlier line 'and he gave him a name' (p. 394, line 3) says it comes from a source other than Ibn Ishaq; this line carries no such note.
  es: "El último verso del poema, según lo presenta Ibn Hisham, menciona a dos hombres de los Ansar. La nota de Ibn Hisham sobre el verso anterior «y le dio un nombre» (p. 394, verso 3) indica que proviene de una fuente distinta a Ibn Ishaq; este verso no lleva tal nota."
  fr: "Le dernier vers du poème, tel que rapporté par Ibn Hisham, nomme deux hommes des Ansar. La note d'Ibn Hisham sur le vers précédent « et il lui donna un nom » (p. 394, vers 3) précise qu'il provient d'une autre source qu'Ibn Ishaq; ce vers-ci ne comporte pas une telle note."
  ur: "نظم کی آخری سطر جیسا کہ ابن ہشام نے دیا ہے، انصار کے دو آدمیوں کے نام۔ پہلے والی سطر پر ابن ہشام کا نوٹ 'اور اس نے اسے ایک نام دیا' ⁦(صفحہ 394، لائن 3)⁩ کہتا ہے کہ یہ ابن اسحاق کے علاوہ کسی اور ذریعہ سے آیا ہے۔ اس لائن میں ایسا کوئی نوٹ نہیں ہے۔"
translations:
  en:
    text: Among us was the trusted one of the Muslims while he lived, and the one whom the messengers washed of his impurity.
