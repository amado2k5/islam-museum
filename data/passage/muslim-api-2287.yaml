label: { ar: "صحيح مسلم 2287 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 2287 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 2287 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 2287 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 2287 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنِي عَمْرٌو النَّاقِدُ، حَدَّثَنَا حَاتِمُ بْنُ إِسْمَاعِيلَ، عَنِ ابْنِ عَجْلاَنَ، عَنْ عِيَاضِ، بْنِ عَبْدِ اللَّهِ بْنِ أَبِي سَرْحٍ عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّ مُعَاوِيَةَ، لَمَّا جَعَلَ نِصْفَ الصَّاعِ مِنَ الْحِنْطَةِ عِدْلَ صَاعٍ مِنْ تَمْرٍ أَنْكَرَ ذَلِكَ أَبُو سَعِيدٍ وَقَالَ لاَ أُخْرِجُ فِيهَا إِلاَّ الَّذِي كُنْتُ أُخْرِجُ فِي عَهْدِ رَسُولِ اللَّهِ صَاعًا مِنْ تَمْرٍ أَوْ صَاعًا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2287، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2287 (The Book of Zakat), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 2287، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 2287 (El Libro del Zakat), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih Muslim, n° 2287 (Le Livre de la Zakat), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
