label: { ar: "جامع الترمذي 759 — عمل يعدل عملا أعظم منه", en: "Jami' al-Tirmidhi 759 — a deed that equals a greater one", ur: "جامع ترمذی 759 — ایک عمل جو بڑے عمل کے برابر ہے" }
text: "… عَنْ أَبِي أَيُّوبَ، قَالَ قَالَ النَّبِيُّ \" مَنْ صَامَ رَمَضَانَ ثُمَّ أَتْبَعَهُ سِتًّا مِنْ شَوَّالٍ فَذَلِكَ صِيَامُ الدَّهْرِ \". وَفِي الْبَابِ عَنْ جَابِرٍ وَأَبِي هُرَيْرَةَ وَثَوْبَانَ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي أَيُّوبَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدِ اسْتَحَبَّ قَوْمٌ صِيَامَ سِتَّةِ أَيَّامٍ مِنْ شَوَّالٍ بِهَذَا الْحَدِيثِ. قَالَ ابْنُ الْمُبَارَكِ هُوَ حَسَنٌ هُوَ مِثْلُ صِيَامِ ثَلاَثَةِ أَيَّامٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 759، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 759 (The Book on Fasting), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 759، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
