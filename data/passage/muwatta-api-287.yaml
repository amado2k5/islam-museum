label: { ar: "موطأ مالك 287 — رفع الدرجات", en: "Muwatta Malik 287 — ranks raised", ur: "موطأ مالک 287 — درجات کی بلندی", es: "Muwatta Malik 287 - rangos elevados", fr: "Muwatta Malik 287 — rangs relevés", tr: "Muwatta Malik 287 — Dereceleri Yükseltmek", id: "Muwatta Malik 287 — Menaikkan Derajat" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" صَلاَةُ الْجَمَاعَةِ تَفْضُلُ صَلاَةَ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً \"."
summary:
  ar: "حديث في موطأ مالك، رقم 287، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 287 (Prayer in Congregation), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 287، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 287 (Oración en congregación), que habla de rangos elevados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un rapport du Muwatta Malik, n° 287 (Prière en congrégation), évoque l'élévation de grade. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou pèsent un acte."
  tr: "Malik'in Muvatta'sında yer alan 287 numaralı hadis, mertebelerin yükseltilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 287, menyebutkan tentang menaikkan derajat. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
