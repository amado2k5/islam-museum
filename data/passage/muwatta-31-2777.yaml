label: { ar: "الموطأ 2777 — سفيان بن أبي زهير: من اقتنى كلبا نقص من عمله كل يوم قيراط", en: "Muwatta 2777" }
summary:
  ar: "يروي مالك عن يزيد بن خصيفة أن السائب بن يزيد أخبره أنه سمع سفيان بن أبي زهير، وهو رجل من أزد شنوءة من أصحاب النبي، يحدث الناس عند باب المسجد بأن النبي قال: من اقتنى كلبا لا يغني عنه زرعا ولا ضرعا نقص من عمله كل يوم قيراط. فسأله السائب: أأنت سمعت هذا من رسول الله؟ فأقسم أنه سمعه. {cite:muwatta-maruf-1997 p.561}"
