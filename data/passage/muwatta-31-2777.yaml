label: { ar: "الموطأ 2777 — سفيان بن أبي زهير: من اقتنى كلبا نقص من عمله كل يوم قيراط", en: "Muwatta 2777", es: "Muwatta 2777", fr: "Muwatta 2777", ur: "موطا 2777", tr: "El-Muvatta 2777 — Sufyan ibn Abi Zuhair: Kim köpek beslerse, her gün onun iyi amellerinden bir kırat (bir ağırlık birimi) düşülür.", id: "Al-Muwatta 2777 — Sufyan ibn Abi Zuhair: Barang siapa memelihara anjing, maka satu qirat (satuan berat) akan dikurangi dari amal kebaikannya setiap hari." }
summary:
  ar: "يروي مالك عن يزيد بن خصيفة أن السائب بن يزيد أخبره أنه سمع سفيان بن أبي زهير، وهو رجل من أزد شنوءة من أصحاب النبي، يحدث الناس عند باب المسجد بأن النبي قال: من اقتنى كلبا لا يغني عنه زرعا ولا ضرعا نقص من عمله كل يوم قيراط. فسأله السائب: أأنت سمعت هذا من رسول الله؟ فأقسم أنه سمعه. {cite:muwatta-maruf-1997 p.561}"
  tr: "Malik, Yezid ibn Husayfah'tan rivayetle, el-Sa'ib ibn Yezid'in kendisine, Azd Şanu'ah kabilesinden ve Peygamber'in sahabelerinden Sufyan ibn Abi Zuhayr'ın mescit kapısında insanlara Peygamber'in şöyle buyurduğunu anlattığını aktarmıştır: \"Kim kendisine ekin ve hayvan yetiştiriciliğinde yardımcı olmayan bir köpek beslerse, her gün amellerinden bir kırat (bir ağırlık birimi) düşülür.\" El-Sa'ib ona, \"Bunu Allah'ın Resulü'nden mi duydun?\" diye sormuş ve o da duyduğuna yemin etmiştir. {cite:muwatta-maruf-1997 s.561}"
  id: "Malik meriwayatkan dari Yazid ibn Khusayfah bahwa al-Sa'ib ibn Yazid mengatakan kepadanya bahwa ia mendengar Sufyan ibn Abi Zuhayr, seorang pria dari suku Azd Shanu'ah dan salah satu sahabat Nabi, menceritakan kepada orang-orang di pintu masjid bahwa Nabi bersabda: \"Barangsiapa memelihara anjing yang tidak membantunya dalam bercocok tanam atau beternak, maka amal kebaikannya akan dikurangi satu qirat (satuan berat) setiap hari.\" Al-Sa'ib bertanya kepadanya: \"Apakah kamu mendengar ini dari Rasulullah?\" Ia bersumpah bahwa ia telah mendengarnya. {cite:muwatta-maruf-1997 p.561}"
