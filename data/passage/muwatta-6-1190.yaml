label: { ar: "الموطأ 1190 — مالك: إمام الحاج إذا وافق يوم الجمعة يوم عرفة أو النحر أو أيام التشريق فلا يجمع في شيء منها", en: "Muwatta 1190", es: "Muwatta 1190", fr: "Muwatta 1190", ur: "موطا 1190", tr: "El-Muvatta 1190 — Malik: Hac imamı, Cuma günü Arafat Günü, Kurban Günü veya Teşrik Günleri ile aynı güne denk gelirse, bu günlerin hiçbirinde namazları birleştirmez.", id: "Al-Muwatta 1190 — Malik: Imam Haji, jika hari Jumat bertepatan dengan Hari Arafah, Hari Kurban, atau Hari Tasyriq, tidak menggabungkan salat pada salah satu dari hari-hari tersebut." }
summary:
  ar: "يقول مالك في إمام الحاج إذا وافق يوم الجمعة يوم عرفة، أو يوم النحر، أو بعض أيام التشريق، إنه لا يجمع في شيء من تلك الأيام. {cite:muwatta-maruf-1997 p.535}"
  tr: "Malik, Hac imamı hakkında şöyle der: Eğer Cuma günü Arafat Günü, Kurban Günü veya Teşrik Günlerinden biriyle aynı güne denk gelirse, o günlerde namazları birleştirmemelidir. {cite:muwatta-maruf-1997 s.535}"
  id: "Malik berkata mengenai Imam Haji: Jika hari Jumat bertepatan dengan Hari Arafah, Hari Kurban, atau salah satu Hari Tasyriq, maka ia tidak boleh menggabungkan salat pada hari-hari tersebut. {cite:muwatta-maruf-1997 p.535}"
