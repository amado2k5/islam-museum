label: { ar: "البخاري 2539 — وفد هوازن يختار السبي", en: "Bukhari 2539 — Hawazin's deputation chooses the captives", es: "Bujari 2539 — La delegación de Hawazin elige a los cautivos.", fr: "Bukhari 2539 — La délégation d'Hawazin choisit les captifs", ur: "بخاری 2539 — ہوازن کا وفد اسیروں کا انتخاب کرتا ہے۔", tr: "Buhari 2539 — Hawazin heyeti esareti seçti", id: "Al-Bukhari 2539 — Delegasi Hawazin memilih menjadi tawanan" }
text: "أن النبي قام حين جاءه وفد هوازن فسألوه أن يرد إليهم أموالهم وسبيهم، فقال: «إن معي من ترون، وأحب الحديث إلي أصدقه، فاختاروا إحدى الطائفتين: إما المال وإما السبي، وقد كنت استأنيت بهم»"
summary:
  ar: "في كتاب فرض الخمس؛ أثر عروة عن مروان والمسور بن مخرمة أن وفد هوازن سأل النبي رد الأموال أو السبي فخيرهم فاختاروا سبيهم، ثم سأل الناس التطييب فأذنوا وردّهم. وكان النبي قد انتظرهم بضع عشرة ليلة حين قفل من الطائف."
  tr: "Beşinci (humus) yükümlülüğü hakkındaki kitapta, Urve'nin Mervan ve El-Misver bin Makhrama'dan rivayet ettiğine göre, Hawazin heyeti Peygamber'den paralarını mı yoksa esirlerini mi geri vermesini istedi. Bunun üzerine Peygamber onlara seçim hakkı verdi ve onlar esirlerini seçtiler. Daha sonra Peygamber halktan izin istedi ve halk izin verdi. Bunun üzerine Peygamber onları geri gönderdi. Peygamber, Taif'ten döndüğünde birkaç gece onları beklemişti."
  id: "Dalam kitab tentang kewajiban khums (sedekah), diriwayatkan oleh Urwah dari Marwan dan Al-Miswar bin Makhrama bahwa delegasi Hawazin meminta Nabi untuk mengembalikan uang mereka atau tawanan mereka, lalu beliau memberi mereka pilihan dan mereka memilih tawanan mereka. Kemudian beliau meminta izin kepada orang-orang dan mereka mengizinkan, lalu beliau memulangkan mereka. Nabi menunggu mereka selama beberapa malam ketika beliau kembali dari Ta'if."
