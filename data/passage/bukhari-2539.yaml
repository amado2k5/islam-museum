label: { ar: "البخاري 2539 — وفد هوازن يختار السبي", en: "Bukhari 2539 — Hawazin's deputation chooses the captives" }
text: "أن النبي قام حين جاءه وفد هوازن فسألوه أن يرد إليهم أموالهم وسبيهم، فقال: «إن معي من ترون، وأحب الحديث إلي أصدقه، فاختاروا إحدى الطائفتين: إما المال وإما السبي، وقد كنت استأنيت بهم»"
summary:
  ar: "في كتاب فرض الخمس؛ أثر عروة عن مروان والمسور بن مخرمة أن وفد هوازن سأل النبي رد الأموال أو السبي فخيرهم فاختاروا سبيهم، ثم سأل الناس التطييب فأذنوا وردّهم. وكان النبي قد انتظرهم بضع عشرة ليلة حين قفل من الطائف."
