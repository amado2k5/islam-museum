text: |-
  ٣٢٨
  وأما المقام والمقام فقد يكون كل واحدمنهما بمعنى الاقامة وقد يكون بعنى موض-ع القيام
  لانك اذا جعلته من قام يقوم ففتوح وان جعلته من أقام يقيم فضوم لات الفعل اذا جاوز
  الثلاثة فالموضع مضموم الميم لانه مشبه ببذات الإربعة نحود حرج وهذامد حرجناوقوله تعالى
  لا مقام الكم أى لاموضع لسكم وقرئ لامام لكم بالضم أى لا اقامة لسكم وحسذت صتقترًا
  ومقاما أى موضعا وقول ابيد * عفت الديار محلها فتامها * يعسنى الأقامة والقيمة واحدة
  القيم وأصله الواولانه يقوم. قام الشبقال قومت السلعة وأهل مكة ية ولون استقمت
  السلعة وهما؟عى والاستقامة الاعتدال يقال استقام له الامر وقوله تعالى فاستقيوا
  اليه أى فى التوجه اليه دون الا لهة وقومت الشئ فهوقو يم أى مستقيم وقولهم ما أقرمه
  شاذ وقوله تعمالى وذلك دين القيمة اما أنفه لاته أراد الله الحنيفية والقوام العدل قال
  تعالى وكان بين ذلك قواما وقوام الرجل أيضاقامته وحسن طوله والقومية مثله وقال
  أيام حكنت حسن القوميه * وقوام الامر بالكسر نظامه وعماده يتان فلان قوام
  أهل بيته وقيام أهل ببته وهو الذى يقيم شأنهم ومنه قوله تعالى ولا تزنوا السفهاء أموال-كم
  التى جعل اللّٰه لكم قياما وقوام الامر أيضاملا كه الذى يقوم به قال لبيد.
  خذلت وهادية الصوارة وامها * وقد يفتح والقامة البكرة بأداتها وقال
  لما رأيت أنم الاقامه • وأننى موف على السامه • نزءت نزعاز عزع الدعامه
  والبمع قيم مثل تارة وتير وقامة الانسان قدّه وتجمع على قامات وقيم مبل تارات وتيروهو
  محورقيام ولحته التغمير لاجل حرف العلة وفارق رحبة ورحاباحيث لم يقولوارحب كما
  قالواقيم وتير وقائم السبف وقاتمته مقبضه والقاعمة واحدة قوائم الدواب والمقوم الخشبة
  التى يمسكها الحراث ابن السكيت مافع-ل قوام كان يعترى هذه الداية بالضم اذا كان يقوم
  فلا ينبعث السكسائى القوام داه يأخذ الشاة فى قوائهاتقوم منه والقيوم اسم من أسماء
  اللّٰه تعالى وقرأ عررضى اللّٰه عند الحىّ القيام وهواغة ويوم القيامة معروف هم) أقهم
  الرجل عن الطعام اذالم يشتهه مثل أقهى وأقهم الرجل عنك اذا كرهك وأفهمت السماء
  اذا انقشع الغسيم عنها
  صل الكاف ( كتم كتمت الشى كنماوكتمانا واكتتمته أيضا ومصاب مكتتم
  لا رعدفيه وسرّ كانم أى مكنوم ومكتم بالتشديدبوالغ فى كتمائه واستكتته سرى سألتنه
