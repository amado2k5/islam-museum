label: { ar: "سنن ابن ماجه 3515 — الرقية", en: "Sunan Ibn Majah 3515 — ruqya recited over the sick", ur: "سنن ابن ماجہ 3515 — رقیہ" }
text: "… عَنْ جَابِرٍ، قَالَ كَانَ أَهْلُ بَيْتٍ مِنَ الأَنْصَارِ يُقَالُ لَهُمْ آلُ عَمْرِو بْنِ حَزْمٍ يَرْقُونَ مِنَ الْحُمَةِ وَكَانَ رَسُولُ اللَّهِ ـ قَدْ نَهَى عَنِ الرُّقَى فَأَتَوْهُ فَقَالُوا يَا رَسُولَ اللَّهِ إِنَّكَ قَدْ نَهَيْتَ عَنِ الرُّقَى وَإِنَّا نَرْقِي مِنَ الْحُمَةِ. فَقَالَ لَهُمُ \" اعْرِضُوا عَلَىَّ \". فَعَرَضُوهَا عَلَيْهِ فَقَالَ \" لاَ بَأْسَ بِهَذِهِ هَذِهِ مَوَاثِيقُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3515، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3515 (Chapters on Medicine), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3515، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
