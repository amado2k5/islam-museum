text: "… الدين يؤخذ عن جميعهم، وإنما كان ذلك مختصًّا بالحاملين للقرآن العارفين بناسخه ومنسوخه ومتشابهه ومُحكمه وسائر دلالاته بما تلقّوه من النبي وَالِيِ أو ممَّن سمعه منهم من عليتهم، وكانوا يُسمُّون لذلك القُرَّاء، أي: الذين يقرؤون الكتاب لأن العرب كانوا أمَّة …"
summary:
