  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1099, that mentions medicine and the physician, illness and the sick, contagion, leprosy and vitiligo, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 1099 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، چھوت، جذام اور برص، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
