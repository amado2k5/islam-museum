  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 1099, qui mentionne la médecine et le médecin, la maladie et les malades, la contagion, la lèpre et le vitiligo, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 1099. sayfasından, tıp ve hekim, hastalık ve hasta, bulaşıcı hastalıklar, cüzzam ve vitiligo ile ilgili konulardan bir alıntı; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 1099, yang menyebutkan tentang kedokteran dan dokter, penyakit dan pasien, penularan, kusta dan vitiligo, serta penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
