text: "… الطبيب إذا اجتمعت أمراض نصل: في هديه في التحرز من الأدواء المعدية بطبعها وإرشاده الأصحاء إلى مجانبة أهلها ما هو الجذام سبب تسمية الجذام بداء الأسد علة الابتعاد عن المجذوم والمسلول التوفيق بين الأحاديث السابقة وبين نفي العدوى والأكل مع …"
summary:
