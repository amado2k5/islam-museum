label: { ar: "الموطأ 206 — مالك: الإمام ينسى تكبيرة الافتتاح يعيد ويعيد من خلفه", en: "Muwatta 206", es: "Muwatta 206", fr: "Muwatta 206", ur: "موطا 206", tr: "El-Muvatta 206 — Malik: İmam açılış tekbirini unutursa, onu tekrar etmeli ve arkasındakiler de tekrar etmelidir.", id: "Al-Muwatta 206 — Malik: Jika imam lupa takbir pembuka, dia harus mengulanginya, dan orang-orang di belakangnya juga harus mengulanginya." }
summary:
  ar: "قول لمالك في باب افتتاح الصلاة: الإمام الذي ينسى تكبيرة الافتتاح حتى يفرغ من صلاته يعيد، ويعيد من خلفه الصلاة وإن كانوا قد كبّروا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيل على تعليقه على الترمذي. {cite:muwatta-maruf-1997 p.127} {cite:muwatta-maruf-1997 p.128}"
  tr: "Malik, namazın başlangıcı bölümünde şöyle buyurmuştur: “İmam namazı bitirene kadar tekbiri unutursa, onu tekrar etmelidir ve arkasından namaz kılanlar da, tekbiri daha önce söylemiş olsalar bile, namazı tekrar etmelidirler.” Editör, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini ve Tirmizi tefsirine atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.127} {cite:muwatta-maruf-1997 s.128}"
  id: "Malik berkata dalam bab tentang pembukaan salat: “Jika seorang imam lupa takbir pembuka hingga ia selesai salatnya, ia harus mengulanginya, dan orang-orang yang salat di belakangnya juga harus mengulangi salatnya, meskipun mereka telah mengucapkan takbir.” Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus’ab dan Suwaid, dan merujuk pada komentarnya tentang al-Tirmidhi. {cite:muwatta-maruf-1997 p.127} {cite:muwatta-maruf-1997 p.128}"
