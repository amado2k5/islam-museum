label: { ar: "جامع الترمذي 2426 — كتاب الأعمال والملائكة الكاتبون، الحساب", en: "Jami' al-Tirmidhi 2426 — the record of deeds and the recording angels; the reckoning", ur: "جامع ترمذی 2426 — نامۂ اعمال اور لکھنے والے فرشتے، حساب" }
text: "… عُثْمَانَ بْنِ الأَسْوَدِ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ، قَالَتْ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ نُوقِشَ الْحِسَابَ هَلَكَ \". قُلْتُ يَا رَسُولَ اللَّهِ إِنَّ اللَّهَ تَعَالَى يَقُولَُ: (فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ * فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا ) قَالَ \" ذَلِكَ الْعَرْضُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ حَسَنٌ وَرَوَاهُ أَيُّوبُ أَيْضًا عَنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2426، يذكر كتاب الأعمال والملائكة الكاتبون، والحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2426 (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara'), that speaks of the record of deeds and the recording angels, the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2426، جس میں نامۂ اعمال اور لکھنے والے فرشتے، حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
