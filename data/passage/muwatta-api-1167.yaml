label: { ar: "موطأ مالك 1167 — الأب والأبوة", en: "Muwatta Malik 1167 — the father and fatherhood", ur: "موطأ مالک 1167 — باپ اور والدیت" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ جَعْفَرِ بْنِ مُحَمَّدٍ، عَنْ أَبِيهِ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، أَنَّهُ كَانَ يَقُولُ إِذَا آلَى الرَّجُلُ مِنِ امْرَأَتِهِ لَمْ يَقَعْ عَلَيْهِ طَلاَقٌ وَإِنْ مَضَتِ الأَرْبَعَةُ الأَشْهُرِ حَتَّى يُوقَفَ فَإِمَّا أَنْ يُطَلِّقَ وَإِمَّا أَنْ يَفِيءَ. قَالَ مَالِكٌ وَذَلِكَ الأَمْرُ عِنْدَنَا."
summary:
  ar: "حديث في موطأ مالك، رقم 1167، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1167 (Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1167، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
