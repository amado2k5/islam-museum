text: |-
  ( ٢ تسخة زيادة رجل من بنى
  عيد القيس
  ١٨٢
  (خيل الخيال والخيالة الشخص والطيف أيضا قال الشاعر
  ولست بنازل الاألمت • بر-لى أوخالتها الكذوب
  والخيمال خشبة عليها ئساب سود تنصب للطير والبهائم قنظنه انسانا وقال
  أخى لا أخالى بعده غير أننى * كراعى خيال يستطيف بلافكر
  والخيال أرض لبنى تغلب قال الشاعر
  لمن طال تضهنه أنال • فسرحة فاارانة فالخيال
  والخيل الفرسان ومنه قوله تعالى وأجاب عليم-م يخيلك ورجل أى بفرسائك ورجالتك
  والحيل أيضا الخيول ومنه قوله تعالى والخيل والبغال والميراتر كبوها والخيالة أصحاب
  الحيول وانظال الذى يكون فى الجسدويجمع على خيسلان وانلفال أخوالام يجمع على
  • أخوال ورجل أخيل أى كثير الفيلان وكذلك مخيل ومخيول مثلمكيل ومكيول ويقال
  أيضامخول مثل مقول وتصغير الحال خييل فيمن قال مخيل ومخيول وخويل فيمن قال مخول
  والخال والخملاء واظيلاء الكبرتقول منه اختال فهوذ وخيلاء وذوخال وذو مخيلة أى ذو
  كبر قال العجاج* والخال ثوب من ثياب الجهال* وقد خال الرجل فهو خائل أى مختال
  قال الشاعر ⁦(٢)⁩ فان كنت سد ناسدتا • وان كنت لغال قادهب فخل
  رجمع الحائل خانة مثل بائع وباعة وكذلاك رجل أخائل أى مختال كما قالوا أباتر وأدابر والحال
  اسم جبل تلقاء الدثينة قال الشاءر
  أهاجك بالخال الهول الدوافع * وأنت اه واهامن الارض نازع
  وإلجال الغسيم وقد أخالت السحساب وأخبات وخايات اذا كانت ترجى المطروقد أخلت
  السحابة وأخيلتها اذارأ بتها مخيلة لتمطر يقال ما أحسر مخيلتهاء خالها أى خلاقته اللمطر
  وفلان مخيل للخيرأى خليق له وتخيلت السماء أى تغيمت وتهيأت للمسطرووحدت أرض
  متغيلة ومتخايلة اذا بلغ نبتها المدى وخرج زهرها ومنه قول ابن هرمة
  سرى ثو به عنك الصبا المتخابل • وقال آخر
  تازرفيه المنت حتى تخابات * رياء و-ق ماترى الشاءنوما
  وأخلت فيه خالامن الخير وتخوّان فيه خالا أى رأيت فيه مخيلته عن يعقوب وخات الشى
  خيلا وخيلة ومخيلة وخيلولة أى ظنفته وفى المثل من يسمع يخل وهومن باب ظننت وأخواتها
  التى تدخل على المبتدا والخبر فان ابتدأت بها أعملت وان وسطتها أو أخرت فأنت بالحيار بين
  الاعمال والالغاء قال الشاءر فى الااغاء
  أبالاراجيزيا ابن اللؤم توعدنى * وفى الاراجيزخات اللوم وانلحور
  وتقول فى مستقبله اخال بكسر الااف وهو الافصج وبنوأسدتقول أخال بالفتح وهوا القباس
  وأخال الشئ أى اشتبه يقال هذا أمر لا يخيل وخيلت للناقة وأخيك أيضا اذا وضعت قرب
  ولدها خي الاليفزع منه الذئب فلا يقربه وفلان يمضى على الخيل أى على ماخيلت أى شبهت
  يعنى على غررمن غير يقين وخيل اليه أنه كذا على مالم يسمّفاعله من التخييل والوهم قال
  أبو زيد يقال خيات على الرجل اذا وجهت التهمة اليه قال وخيلت علينا السماء اذارعدت
  وبرقت
