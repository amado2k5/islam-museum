text: "… اللّٰه يومَ الرَّوْعِ والباسِ لا تقتلي النفسَ إذ حانتْ منيته فذاقَ يومئذٍ من كاس شمَّاس قد كان حمزةٌ ليث اللّٰه فاصطبري. وذكر أبو عمر البيتين الأول والأخير من هذه الأبيات الثلاثة، ونسبها لحسان، يُعزِّي أختَ شماس فيه، وهو شماس بن …"
summary:
