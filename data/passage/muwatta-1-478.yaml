label: { ar: "الموطأ 478 — عمر وعثمان كانا يستلقيان في المسجد كذلك", en: "Muwatta 478" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب أن عمر بن الخطاب وعثمان بن عفان كانا يفعلان ذلك، أي الاستلقاء في المسجد ووضع إحدى الرجلين على الأخرى؛ وهو في باب جامع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن، وأنه منقطع لأن سعيد بن المسيب لم يدرك عمر. {cite:muwatta-maruf-1997 p.245} {cite:muwatta-maruf-1997 p.246}"
