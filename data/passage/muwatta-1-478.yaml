label: { ar: "الموطأ 478 — عمر وعثمان كانا يستلقيان في المسجد كذلك", en: "Muwatta 478", es: "Muwatta 478", fr: "Muwatta 478", ur: "موطا 478", tr: "El-Muvatta 478 — Ömer ve Osman da camide yatarak vakit geçirirlerdi.", id: "Al-Muwatta 478 — Umar dan Uthman juga biasa berbaring di masjid" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب أن عمر بن الخطاب وعثمان بن عفان كانا يفعلان ذلك، أي الاستلقاء في المسجد ووضع إحدى الرجلين على الأخرى؛ وهو في باب جامع الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن، وأنه منقطع لأن سعيد بن المسيب لم يدرك عمر. {cite:muwatta-maruf-1997 p.245} {cite:muwatta-maruf-1997 p.246}"
  tr: "Malik'in İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet ettiği bir hadiste, Ömer ibn el-Hattab ve Osman ibn Affan'ın camide bunu, yani bir bacağını diğerinin üzerine atarak uzanmayı yaptıkları belirtilmektedir; bu, tam namaz bölümünde yer almaktadır. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Muhammed ibn el-Hasan tarafından rivayet edildiğini ve isnad zincirinin Sa'id ibn el-Musayyab'ın Ömer ile görüşmemesi nedeniyle koptuğunu belirtmektedir. {cite:muwatta-maruf-1997 s.245} {cite:muwatta-maruf-1997 s.246}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Ibn Shihab atas otoritas Sa'id ibn al-Musayyab menyatakan bahwa Umar ibn al-Khattab dan Uthman ibn Affan biasa melakukan hal ini, yaitu, bersandar di masjid dengan satu kaki disilangkan di atas kaki lainnya; ini terdapat dalam surah tentang shalat lengkap. Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab dan Muhammad ibn al-Hasan, dan bahwa sanadnya terputus karena Sa'id ibn al-Musayyab tidak bertemu dengan Umar. {cite:muwatta-maruf-1997 p.245} {cite:muwatta-maruf-1997 p.246}"
