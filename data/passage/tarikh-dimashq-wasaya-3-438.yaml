text: "… قلت : أول، فقال صفوان: قد علمت أن لا، قال صاحبة السرير هذه، أحبها ماتت عام الميت لا يتكلم فمن أين هذا الصوت وكان صفوان يدفن أباه لما مات فأتاه خبر مقتل عثمان فقال : والله ما أدري أي المصيبتين …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 438، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
