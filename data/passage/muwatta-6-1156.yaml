label: { ar: "الموطأ 1156 — ابن عمر: من لم يقف بعرفة من ليلة المزدلفة قبل طلوع الفجر فقد فاته الحج", en: "Muwatta 1156", es: "Muwatta 1156", fr: "Muwatta 1156", ur: "موطا 1156", tr: "El-Muvatta 1156 — İbn Ömer: Muzdalifa gecesinden sonra şafak sökmeden önce Arafat'ta bulunmayan kimse Hac ibadetini yerine getirmemiştir.", id: "Al-Muwatta 1156 — Ibn Umar: Barang siapa yang tidak berdiri di Arafat sejak malam Muzdalifah sebelum fajar, maka ia telah gagal dalam ibadah haji." }
text: "فقد فاتَهُ الحَجُ"
summary:
  ar: "يقول عبد الله بن عمر إن من لم يقف بعرفة من ليلة المزدلفة قبل أن يطلع الفجر فقد فاته الحج، ومن وقف بعرفة في تلك الليلة قبل الفجر فقد أدرك الحج. {cite:muwatta-maruf-1997 p.523}"
  tr: "Abdullah ibn Umar şöyle demiştir: \"Muzdalifa gecesi şafak sökmeden önce Arafat'ta bulunmayan kimse Hac ibadetini yerine getirmemiş sayılır; o gece şafak sökmeden önce Arafat'ta bulunan kimse ise Hac ibadetini yerine getirmiş sayılır.\" {cite:muwatta-maruf-1997 s.523}"
  id: "Abdullah ibn Umar berkata bahwa siapa pun yang tidak berdiri di Arafat pada malam Muzdalifah sebelum subuh telah gagal melaksanakan ibadah haji, dan siapa pun yang berdiri di Arafat pada malam itu sebelum subuh telah melaksanakan ibadah haji. {cite:muwatta-maruf-1997 p.523}"
