label: { ar: "الموطأ 1514 — سعيد بن المسيب: سئل عن المرأة تشترط على زوجها أن لا يخرج بها من بلدها، فقال يخرج بها إن شاء", en: "Muwatta 1514", es: "Muwatta 1514", fr: "Muwatta 1514", ur: "موطا 1514", tr: "El-Muvatta 1514 — Sa’id ibn al-Musayyab: Kocasına kendisini kasabadan dışarı çıkarmamasını şart koşan bir kadın hakkında kendisine soruldu ve şöyle dedi: Dilerse onu götürebilir.", id: "Al-Muwatta 1514 — Sa’id ibn al-Musayyab: Ia ditanya tentang seorang wanita yang bersyarat kepada suaminya agar tidak membawanya keluar dari kotanya, dan ia berkata: Suaminya boleh membawanya jika ia mau." }
summary:
  ar: "يروي مالك أنه بلغه أن سعيد بن المسيب سئل عن المرأة تشترط على زوجها أنه لا يخرج بها من بلدها، فقال سعيد بن المسيب يخرج بها إن شاء. {cite:muwatta-maruf-1997 p.36}"
  tr: "Malik, Sa'id ibn al-Musayyab'a, kocasına kendisini kasabadan dışarı çıkarmamasını şart koşan bir kadın hakkında soru sorulduğunu ve Sa'id ibn al-Musayyab'ın, \"Dilerse onu götürebilir\" dediğini duyduğunu aktarır. {cite:muwatta-maruf-1997 s.36}"
  id: "Malik menceritakan bahwa ia mendengar Sa'id ibn al-Musayyab ditanya tentang seorang wanita yang bersyarat kepada suaminya agar tidak membawanya keluar dari kotanya, dan Sa'id ibn al-Musayyab berkata, \"Dia boleh membawanya jika dia mau.\" {cite:muwatta-maruf-1997 p.36}"
