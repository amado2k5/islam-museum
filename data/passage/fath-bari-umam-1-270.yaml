text: "… واحد إلى أن خالط المملكة الديلم، ثم كان الملوك السامانية من الترك أيضًا فملكوا بلاد العجم، ثم غلب على تلك الممالك آل سبكتكين ثم آل سلجوق وامتدت مملكتهم إلى العراق والشام والروم، ثم كان بقايا أتباعهم بالشام وهم آل زنكي …"
