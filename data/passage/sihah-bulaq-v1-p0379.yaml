text: |-
  ١ قلت ومته قولة تعالى
  وهد بناه النجدين أى الطر يقين
  ظريق الخير وطريق الشر اه
  مختار
  قوله فهو نجد ونجد أى ككتف
  درجل اه
  عاصم سيخ حفص وشعبة والده
  أبو النجود يفتح النون وأمه
  بهدلة وقد ينسب اليهما بتقديم
  الاب فيقال ابن أبى النجودا بن
  بع دلة كما صنع القاموس هنا
  فتقبت أاف ابن لان بهدلة أمه
  زوجسة أبي النجود وله نظائر
  ذكرناها فى المطالع النصيرية اه
  فانظر ها صفحة ٤١٧٦
  ٢٦٠٢٠
  ⁦(تجد)⁩
  وهو المتعطى المسؤل ومنه المائدة وهى خوان عليه طعام فادالم يكن عله طعام فليس
  بمائدة وانماهو خوان قال أبو عبيدة مائدة فاعلة يمعنى مفعولة مثل عيشة راضية بمعم
  حرضية ومائد فى شعر أبى ذوْيب
  بمانية أ-.الهامظ مائد • وآل قراس صوب أرمية كل
  اسم جبل وميداغة فى يدبعنى غيروفى الحديث أما فصح العرب صدأنى من قريس ونشأت
  فى بنى سعدبن بكر وفسره بعضهم من أجل أنى
  ( لصل النون تأد الندوالدى الداهبة قال السكميت
  فاياكم وداهية نادى • أظلتكم بعلرضها المخيل
  ⁦( نجد )⁩ النجدما ارتفع من الارض وابلمع نجادونجود وأنجد ومنه قواهم قلان طلاع
  أنجد وطلاع الثنايااذا كان ساميا لمعالى الامور قال الشاء وحيد بن أبى شحاذ الضى
  وقديصر القلى الفتدون *.ه • وقد كلن لولا القل طلاع أفجد
  وقال آخر (ز يلد بن منقذ
  يغدواً مامهم فى كل حريأة • طلاع أنجدة فى كشحه هضم
  وهو جع نجود بمع الجمع والنجد الطريق المرتفع ( ١ قال الشاء رامر والقدس
  غداة غدوافسالك بعان نخلة • وآخرمنهم جازع نجد كبكب
  والتهدما ينج-ديه البيت من المتاع أى يزين والجمع نجود عن أبى عبيد والتنحيد التزيين
  قال ذْوالرمة حتى كان رياض القف ألبسها * من وشى عبقر تحليل وقحيد
  والنجاد الذى يعالج الفرش والوسادة ويخيطه-ما ورحل منجذ بالذال والدال جيعا أى مجرب
  قد نجده الدهر أى جرّب وعرف ونجد من بلاد العرب وهوخسلاف الغور والفور تهامة
  وكل ما ارتفع من تهامة الى أرض العراق فهو نجد وهومذكر وأنشدثعلب
  ذرانى من نجدفات سنينه • لعين يناشيا وشيبننا عردا
  وتقول أنجدنا أى أخذنا فى بلاد فجدوفى المثل أنجد من رأى حضنا وذلكاذاعلا من الغور
  وحضن اسم جبلى وأنجد فلان الدعوة واستجدنى فأنجدته أى استعان بى فأعنته واستجد
  فلان قوى بعد ضعف واستجد على فلان اذا اجترأ عليه بعد هيبة ويقال ايضارجلى نجد
  فى الحاجة اذا كان ناجيافيها اى سريعا والنجدة الشجاعة تقول منه نجد الرجل بالضم فهو
  نحدونجد ونجيد وبجع نجد أنجاد مثل يقظ وايقاظ وجمع نجيد تحد وغجداه ورحسلى ذونجدة
  أى ذو بأس ولا قى فلان نجدة أى شدّة أبو عبيدة نجدت الرحل أنجده غلبته وأنجدنه أعنته
  وناجدته منا جدة مثله ورجل منا جد أى مقاتل الاصمعى نجد الرجل بالكسر ينجد نجدا أى
  عرق من حمل أوكرب والنجد العرق قال النابغة
  يظلّ من خوفه الملاح معتصما • بالخيزراتة بعد الابن والتجد
  والمنحود المكروب وقد يجد نجد افهو منحود ونحدد قال والنحود من حر الوحس التى لا تحمل
  ويقال هى الطويلة المشرفة والجم نجد وعاصم بن أبى النجود من القراء والنجاد جائل
  السيف والذاجود كل اناء يجع-ل فيه الشراب من جفنة وغيرها والنجدات صف من
  الغوادج
