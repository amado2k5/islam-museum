label: { ar: "الموطأ 1128 — مالك في رجل وقع بامرأته في الحج، ما بينه وبين أن يدفع من عرفة ويرمي الجمرة: يجب عليه الهدي وحج قابل؛ فإن كانت إصابته بعد رمي الجمرة فإنما عليه أن يعتمر ويهدي، وليس عليه حج قابل", en: "Muwatta 1128" }
summary:
  ar: "قول لمالك في رجل وقع بامرأته في الحج، ما بينه وبين أن يدفع من عرفة ويرمي الجمرة: إنه يجب عليه الهدي وحج قابل. فإن كانت إصابته أهله بعد رمي الجمرة، فإنما عليه أن يعتمر ويهدي، وليس عليه حج قابل. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1233) و(1242) وسويد (530). {cite:muwatta-maruf-1997 p.514}"
