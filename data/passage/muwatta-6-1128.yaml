label: { ar: "الموطأ 1128 — مالك في رجل وقع بامرأته في الحج، ما بينه وبين أن يدفع من عرفة ويرمي الجمرة: يجب عليه الهدي وحج قابل؛ فإن كانت إصابته بعد رمي الجمرة فإنما عليه أن يعتمر ويهدي، وليس عليه حج قابل", en: "Muwatta 1128", es: "Muwatta 1128", fr: "Muwatta 1128", ur: "موطا 1128", tr: "El-Muvatta 1128 — Malik, Hac sırasında Arafat'tan ayrılışı ile Cemarat taşlarının vurulması arasında karısıyla cinsel ilişkiye giren bir adam hakkında şöyle demiştir: Bir kurban kesmeli ve ertesi yıl Hac yapmalıdır. Eğer cinsel ilişki Cemarat taşlarının vurulmasından sonra gerçekleşmişse, sadece Umre yapmalı ve bir kurban kesmelidir; ertesi yıl Hac yapması zorunlu değildir.", id: "Al-Muwatta 1128 — Malik berkata tentang seorang laki-laki yang bersetubuh dengan istrinya selama ibadah haji, antara keberangkatannya dari Arafat dan pelemparan Jamarat: Ia wajib mempersembahkan hewan kurban dan melaksanakan ibadah haji tahun berikutnya. Jika persetubuhan terjadi setelah pelemparan Jamarat, maka ia hanya perlu melaksanakan ibadah umrah dan mempersembahkan hewan kurban, dan ia tidak wajib melaksanakan ibadah haji tahun berikutnya." }
summary:
  ar: "قول لمالك في رجل وقع بامرأته في الحج، ما بينه وبين أن يدفع من عرفة ويرمي الجمرة: إنه يجب عليه الهدي وحج قابل. فإن كانت إصابته أهله بعد رمي الجمرة، فإنما عليه أن يعتمر ويهدي، وليس عليه حج قابل. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1233) و(1242) وسويد (530). {cite:muwatta-maruf-1997 p.514}"
  tr: "Malik, Hac sırasında Arafat'tan ayrılıp Cemarat'a taş atmadan önce karısıyla cinsel ilişkiye giren bir adam hakkında şöyle demiştir: Bu adam kurban kesmeli ve ertesi yıl Hac yapmalıdır. Eğer Cemarat'a taş attıktan sonra karısıyla cinsel ilişkiye girerse, sadece Umre yapması ve kurban kesmesi yeterlidir ve ertesi yıl Hac yapması zorunlu değildir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1233) ve (1242) ve Suveyd (530) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.514}"
  id: "Malik berkata mengenai seorang pria yang bersetubuh dengan istrinya selama ibadah haji, antara meninggalkan Arafat dan melempar batu di Jamarat: ia wajib mempersembahkan hewan kurban dan melaksanakan haji tahun berikutnya. Jika ia bersetubuh dengan istrinya setelah melempar batu di Jamarat, ia hanya perlu melaksanakan umrah dan mempersembahkan hewan kurban, dan ia tidak wajib melaksanakan haji tahun berikutnya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1233) dan (1242) dan Suwaid (530). {cite:muwatta-maruf-1997 p.514}"
