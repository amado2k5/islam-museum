label: { ar: "الموطأ 1327 — زيد بن أسلم: كان عمر بن الخطاب يقول اللهم لا تجعل قتلي بيد رجل صلى لك سجدة واحدة", en: "Muwatta 1327" }
text: "اللّهُمَّ لَا تَجْعلْ قَتْلي بِيَدِ رَجُلٍ صَلَّى لَكَ سَجْدةً وَاحِدةً"
summary:
  ar: "يروي مالك عن زيد بن أسلم أن عمر بن الخطاب كان يقول اللهم لا تجعل قتلي بيد رجل صلى لك سجدة واحدة، يحاجني بها عندك يوم القيامة. ويذكر المحقق أن الحديث منقطع، وأن الليث رواه عن هشام عن زيد بن أسلم عن أبيه عن عمر. {cite:muwatta-maruf-1997 p.593}"
