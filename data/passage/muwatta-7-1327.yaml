label: { ar: "الموطأ 1327 — زيد بن أسلم: كان عمر بن الخطاب يقول اللهم لا تجعل قتلي بيد رجل صلى لك سجدة واحدة", en: "Muwatta 1327", es: "Muwatta 1327", fr: "Muwatta 1327", ur: "موطا 1327", tr: "El-Muvatta 1327 — Zeyd ibn Aslam: Ömer ibn el-Hattab şöyle derdi: “Ey Allah’ım, bana bir kere bile sana dua etmiş bir adamın beni öldürmesine izin verme.”", id: "Al-Muwatta 1327 — Zayd ibn Aslam: Umar ibn al-Khattab biasa berkata, “Ya Allah, jangan biarkan aku dibunuh oleh seorang laki-laki yang telah berdoa kepada-Mu meskipun hanya sekali.”" }
text: "اللّهُمَّ لَا تَجْعلْ قَتْلي بِيَدِ رَجُلٍ صَلَّى لَكَ سَجْدةً وَاحِدةً"
summary:
  ar: "يروي مالك عن زيد بن أسلم أن عمر بن الخطاب كان يقول اللهم لا تجعل قتلي بيد رجل صلى لك سجدة واحدة، يحاجني بها عندك يوم القيامة. ويذكر المحقق أن الحديث منقطع، وأن الليث رواه عن هشام عن زيد بن أسلم عن أبيه عن عمر. {cite:muwatta-maruf-1997 p.593}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle Ömer ibn el-Hattab'ın şöyle dediğini aktarır: \"Ey Allah'ım, sana bir kere dua eden, bir kere secde eden bir adamın beni öldürmesine izin verme ve kıyamet gününde bunu sana karşı delil olarak kullanmasına izin verme.\" Araştırmacı, rivayet zincirinin kopuk olduğunu ve el-Layth'ın bunu Hişam'dan, o da Zeyd ibn Aslam'dan, o da babasından, o da Ömer'den rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.593}"
  id: "Malik meriwayatkan dari Zaid bin Aslam bahwa Umar bin al-Khattab biasa berkata, \"Ya Allah, jangan biarkan aku dibunuh oleh seorang laki-laki yang hanya sekali berdoa kepada-Mu, sekali bersujud kepada-Mu, lalu Engkau jadikan itu sebagai alasan untuk menghukumku di hadapan-Mu pada Hari Kiamat.\" Peneliti mencatat bahwa rantai periwayatan terputus, dan bahwa al-Layth meriwayatkannya dari Hisham, dari Zaid bin Aslam, dari ayahnya, dari Umar. {cite:muwatta-maruf-1997 p.593}"
