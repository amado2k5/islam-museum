label: { ar: "الموطأ 639 — عائشة: سمعت النبي قبل أن يموت وهو مستند إلى صدرها يقول: اللهم اغفر لي وارحمني وألحقني بالرفيق الأعلى", en: "Muwatta 639", es: "Muwatta 639", fr: "Muwatta 639", ur: "موطا 639", tr: "Muvatta 639 — Aişe: Peygamberimiz vefat etmeden önce, göğsüme yaslanmış halde şöyle dediğini işittim: Ey Allah'ım, beni bağışla, bana rahmet et ve beni en yüce sahabelerle bir araya getir.", id: "Al-Muwatta 639 — Aisyah: Aku mendengar Nabi sebelum wafat, sambil bersandar di dadanya, berkata: Ya Allah, ampunilah aku, kasihanilah aku, dan gabungkanlah aku dengan para sahabat yang paling mulia." }
text: "اللهم اغفر لي، وارحمني، وألحقني بالرفيق الأعلى"
summary:
  ar: "أول حديث في باب جامع الجنائز. يرويه مالك عن هشام بن عروة عن عباد بن عبد الله بن الزبير، أن عائشة أخبرته أنها سمعت النبي قبل أن يموت وهو مستند إلى صدرها، وأصغت إليه، يقول: اللهم اغفر لي وارحمني وألحقني بالرفيق الأعلى. ويذكر المحقق أن في بعض النسخ «مستسند»، وأنه رواه عن مالك أبو مصعب وسويد والقعنبي وقتيبة عند مسلم (7/137)، وأنه عند البخاري ⁦(6/13 و7/157)⁩ والترمذي (3496) وابن حبان من غير طريق مالك عن هشام، وعند مسلم (7/15) من طريق مسروق عن عائشة. {cite:muwatta-maruf-1997 p.326} {cite:muwatta-maruf-1997 p.327}"
  tr: "Cenaze töreni bölümündeki ilk hadis. Malik, Hişam ibn Urve'den, o da Abbad ibn Abdullah ibn el-Zübeyr'den rivayet ettiğine göre, Aişe ona, Peygamberimiz'in vefat etmeden önce göğsüne yaslandığını ve şöyle dediğini işittiğini anlatmıştır: \"Ey Allah'ım, beni bağışla, bana rahmet et ve beni en yüce toplulukla bir araya getir.\" Editör, bazı rivayetlerde \"mustasanad\" olduğunu ve Malik'ten Ebu Musab, Süveyd, el-Ka'nebi ve Kuteybe tarafından Müslim'de (7/137) nakledildiğini, ayrıca Buhari'de (6/13 ve 7/157), Tirmizi'de (3496) ve İbn Hibban'da, Malik'inkinden farklı zincirlerle Hişam'dan ve Müslim'de (7/15) Masruk'un zinciriyle Aişe'den rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.326} {cite:muwatta-maruf-1997 s.327}"
  id: "Hadits pertama dalam bab tentang pemakaman. Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari Abbad ibn Abdullah ibn al-Zubayr, bahwa Aisyah menceritakan kepadanya bahwa ia mendengar Nabi, sebelum wafat, bersandar di dadanya, dan ia mendengarkan beliau berkata: “Ya Allah, ampunilah aku, kasihanilah aku, dan masukkanlah aku ke dalam golongan orang-orang yang paling tinggi.” Editor mencatat bahwa dalam beberapa versi hadits ini “mustasanad,” dan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, al-Qa’nabi, dan Qutaybah dalam Muslim (7/137), dan juga ditemukan dalam al-Bukhari (6/13 dan 7/157), al-Tirmidhi (3496), dan Ibn Hibban melalui sanad selain Malik dari Hisham, dan dalam Muslim (7/15) melalui sanad Masruq dari Aisyah. {kutip:muwatta-maruf-1997 hal.326} {kutip:muwatta-maruf-1997 hal.327}"
