label: { ar: "الموطأ 639 — عائشة: سمعت النبي قبل أن يموت وهو مستند إلى صدرها يقول: اللهم اغفر لي وارحمني وألحقني بالرفيق الأعلى", en: "Muwatta 639" }
text: "اللهم اغفر لي، وارحمني، وألحقني بالرفيق الأعلى"
summary:
  ar: "أول حديث في باب جامع الجنائز. يرويه مالك عن هشام بن عروة عن عباد بن عبد الله بن الزبير، أن عائشة أخبرته أنها سمعت النبي قبل أن يموت وهو مستند إلى صدرها، وأصغت إليه، يقول: اللهم اغفر لي وارحمني وألحقني بالرفيق الأعلى. ويذكر المحقق أن في بعض النسخ «مستسند»، وأنه رواه عن مالك أبو مصعب وسويد والقعنبي وقتيبة عند مسلم (7/137)، وأنه عند البخاري (6/13 و7/157) والترمذي (3496) وابن حبان من غير طريق مالك عن هشام، وعند مسلم (7/15) من طريق مسروق عن عائشة. {cite:muwatta-maruf-1997 p.326} {cite:muwatta-maruf-1997 p.327}"
