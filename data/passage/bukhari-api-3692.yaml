label: { ar: "صحيح البخاري 3692 — ساعة الاحتضار والوفاة", en: "Sahih al-Bukhari 3692 — a deathbed and last hours", ur: "صحیح بخاری 3692 — وقتِ وفات اور آخری لمحات", es: "Sahih al-Bukhari 3692 — un lecho de muerte y últimas horas", fr: "Sahih al-Bukhari 3692 — Un lit de mort et les dernières heures" }
text: "… الصَّلْتُ بْنُ مُحَمَّدٍ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا أَيُّوبُ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنِ الْمِسْوَرِ بْنِ مَخْرَمَةَ، قَالَ لَمَّا طُعِنَ عُمَرُ جَعَلَ يَأْلَمُ، فَقَالَ لَهُ ابْنُ عَبَّاسٍ ـ وَكَأَنَّهُ يُجَزِّعُهُ ـ يَا أَمِيرَ الْمُؤْمِنِينَ، وَلَئِنْ كَانَ ذَاكَ لَقَدْ صَحِبْتَ رَسُولَ اللَّهِ فَأَحْسَنْتَ صُحْبَتَهُ، ثُمَّ فَارَقْتَهُ وَهْوَ عَنْكَ رَاضٍ، ثُمَّ صَحِبْتَ أَبَا بَكْرٍ فَأَحْسَنْتَ صُحْبَتَهُ، ثُمَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3692، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3692 (Companions of the Prophet), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3692، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3692 (Compañeros del Profeta), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 3692 (Compagnons du Prophète), évoque un lit de mort et les dernières heures. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
