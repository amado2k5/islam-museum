text: "… أَنْفُسِهَا وَكَانَ مَنْ مَعَكَ مِنَ الْمُهَاجِرِينَ لَهُمْ قَرَابَاتٌ يَحْمُونَ بِهَا أَهْلِيهِمْ وَأَمْوَالَهُمْ بِمَكَّةَ فَأَحْبَبْتُ إِذْ فَاتَنِي ذَلِكَ مِنْ نَسَبٍ فِيهِمْ أَنْ أَتَّخِذَ فِيهِمْ يَدًا يَحْمُونَ بِهَا قَرَابَتِي وَمَا فَعَلْتُ ذَلِكَ كُفْرًا وَلاَ ارْتِدَادًا عَنْ دِينِي وَلاَ رِضًا بِالْكُفْرِ بَعْدَ الإِسْلاَمِ. فَقَالَ النَّبِيُّ \" صَدَقَ \". فَقَالَ عُمَرُ بْنُ الْخَطَّابِ دَعْنِي يَا رَسُولَ اللَّهِ أَضْرِبْ عُنُقَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3305، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3305 (Chapters on Tafsir), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3305، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3305 (Capítulos sobre Tafsir), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
