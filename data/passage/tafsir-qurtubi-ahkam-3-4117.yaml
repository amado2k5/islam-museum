text: "… تطوعاً بعد فريضة؛ كما قالت عائشة، على ما يأتي مبيَّناً في سورة. المُزَّمِّل إن شاء اللّٰه تعالى. وعلى هذا يكون الأمر بالتنفل على جهة الندب ويكون الخطاب للنبيّ وَلِيِ؛ لأنه مغفور له. فهو إذا تطوّع لما ليس بواجب عليه كان …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 4117، يرد فيه ذكر الفريضة والفرائض، والواجب، والنافلة والنوافل، والتطوع، وما ليس بواجب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 4117, whose wording mentions the obligation (farida), the obligatory (wajib), the supererogatory (nafila), the voluntary act (tatawwu'), what is said not to be obligatory, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 4117 کا اقتباس جس میں فریضہ اور فرائض، واجب، نفل اور نوافل، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volume numérisé 3, p. 4117, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), le surérogatoire (nafila), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volumen digitalizado 3, p. 4117, cuyo texto menciona la obligación (farida), lo obligatorio (wajib), lo supererogatorio (nafila), el acto voluntario (tatawwu'), lo que se dice que no es obligatorio, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin 3. cildinin 4117. sayfasından bir alıntı, farz olan ameller, nafile ameller, gönüllü ameller, farz olmayan ameller ve müstehap olan ameller konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, müstehap olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Qurtubi, Al-Jami' li-Ahkam al-Qur'an, Volume 3, halaman 4117, membahas tentang amalan wajib, amalan sunnah, amalan sukarela, amalan yang tidak wajib, dan amalan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
