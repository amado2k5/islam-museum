text: "… قال ثنا أبوحرة قال ثنا محميد بن مديرين عن أبى سعيد الخدرى. أنه خرج فى سربة فأصابتهم مجاعة فأتوا على حى فأتتهم جارية فقالت : إن رجالنا خلوف وإن سيد الحي سليم فهل فيسكم من راق، هذهبت وقرأت عليه بأم …"
