label: { ar: "الموطأ 598 — أبو بكر في مرضه: الحي أحوج إلى الجديد من الميت، وإنما هذا للمهلة", en: "Muwatta 598" }
text: "الحي أحوج إلى الجديد من الميت، وإنما هذا للمهلة"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه بلغه أن أبا بكر الصديق سأل عائشة وهو مريض: في كم كُفن النبي؟ فقالت: في ثلاثة أثواب بيض سحولية. فأمر أن يؤخذ ثوب عليه قد أصابه مشق أو زعفران فيُغسل ثم يُكفن فيه مع ثوبين آخرين، فقالت عائشة: وما هذا؟ فقال: الحي أحوج إلى الجديد من الميت، وإنما هذا للمهلة، أي لما يسيل من الميت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، ويحيل على التمهيد (24/90). {cite:muwatta-maruf-1997 p.308}"
