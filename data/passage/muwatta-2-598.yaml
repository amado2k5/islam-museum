label: { ar: "الموطأ 598 — أبو بكر في مرضه: الحي أحوج إلى الجديد من الميت، وإنما هذا للمهلة", en: "Muwatta 598", es: "Muwatta 598", fr: "Muwatta 598", ur: "موطا 598", tr: "El-Muvatta 598 — Ebu Bekir hastalığı sırasında: Dirilerin yeniye ölülerden daha çok ihtiyacı vardır ve bu sadece bir nefes alma fırsatı içindir.", id: "Al-Muwatta 598 — Abu Bakr saat sakit: Orang yang hidup lebih membutuhkan yang baru daripada yang mati, dan ini hanya untuk memberi jeda." }
text: "الحي أحوج إلى الجديد من الميت، وإنما هذا للمهلة"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه بلغه أن أبا بكر الصديق سأل عائشة وهو مريض: في كم كُفن النبي؟ فقالت: في ثلاثة أثواب بيض سحولية. فأمر أن يؤخذ ثوب عليه قد أصابه مشق أو زعفران فيُغسل ثم يُكفن فيه مع ثوبين آخرين، فقالت عائشة: وما هذا؟ فقال: الحي أحوج إلى الجديد من الميت، وإنما هذا للمهلة، أي لما يسيل من الميت. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، ويحيل على التمهيد (24/90). {cite:muwatta-maruf-1997 p.308}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ebu Bekir es-Siddik'in hasta iken Aişe'ye, \"Peygamber kaç elbiseyle kefenlenmişti?\" diye sorduğunu işittiğini aktarır. Aişe, \"Sahul'dan üç beyaz pamuklu kumaşla\" diye cevap verdi. Bunun üzerine Ebu Bekir es-Siddik, safran veya başka boyalarla lekelenmiş bir elbisenin alınmasını, yıkanmasını ve diğer iki elbiseyle birlikte kefenlenmesini emretti. Aişe, \"Bu nedir?\" diye sordu. Ebu Bekir es-Siddik, \"Yaşayanların yeni giysilere ölülerden daha çok ihtiyacı vardır. Bu sadece geçici bir süre içindir,\" yani ölenden akan şey içindir diye cevap verdi. Editör, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve At-Tamhid'e (24/90) atıfta bulunduğunu belirtir. {cite:muwatta-maruf-1997 s.308}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia mendengar Abu Bakr as-Siddiq bertanya kepada Aisyah, ketika ia sakit: \"Dengan berapa banyak kain kafan Nabi?\" Aisyah menjawab: \"Dengan tiga kain katun putih dari Sahul.\" Maka ia memerintahkan agar diambil sehelai kain yang telah ternoda kunyit atau pewarna lain dari Nabi, dicuci, dan kemudian digunakan untuk mengkafaninya bersama dengan dua kain lainnya. Aisyah bertanya: \"Apa ini?\" Ia menjawab: \"Orang yang hidup lebih membutuhkan pakaian baru daripada orang yang mati. Ini hanya untuk jangka waktu tertentu,\" maksudnya untuk apa yang mengalir dari orang yang meninggal. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik, dan merujuk pada At-Tamhid (24/90). {cite:muwatta-maruf-1997 p.308}"
