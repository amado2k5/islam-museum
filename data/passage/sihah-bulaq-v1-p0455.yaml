text: |-
  ١ و جهود المفسرين على انّ
  المراد من الطلح فى القرآن الموز
  اه مختار
  ⁦(٢)⁩ بضمتيناه
  ٦٨٦
  (باب الحاءح
  وكذلك طرمح بناءه والميم زائدة وقال يصف ابلاملا هاشحماعشب أرض نبت بنوء الاسد
  طرمح أفطارها أحوى لوالدة * صحماء والفحل للضرغام يتسب
  ومنهمى الطرمّاح بن حكيم ⁦(طفح)⁩ طفح الاناءطفوحا اذا امتلاً حتى يفيض وأطفيت
  أنا وطغعته تطفيحا والطفاحة ماطفح فوق الشئ كز بد القدر وٱطفحت القدر على افتعات اذا
  أخذت طفاحتها وطفح السكران فهو طافح اذاملاه الشراب وطفحت الريح القطنة
  وضحوها اذاسطعت بها ويقال اطفح ءنى أى اذهب لح) الطلح شجر عظام من شجر
  العضاه وكذلك الطلاح الواحدة طلهة يقال ابل طلاحية للتى ترعى الطلاح وطلاحية أيضا
  بالضم على عيرة اس قال الراجر
  كيف ترى.رطلاحياتها * والغضويات على علاته-
  والطلح لغة فى الطلع ١ وطلح البعيراً عيافه وطليح وأطلحته أنا وطلمته حسرته وناقة
  طليح أسفار اذا جهدها السير وهزلها وابل طلح وطلائح والطلح بالكسر المعي من الابل
  وغبرها يستوى فيه الذكر والاتى والججمع أطلاح قال الحطيقة وذكرابلاوراعيها
  اذا نام طنح أشعث الرأس خلفها • هداهلها أنفاسها وزفيرها
  يقول انها قد بطنت فهى تزفر فيسمع الراعى أصوات أجوافها فيجى اليها وربماقيل
  للقراد طلح وطليح وطلهت الابل بالكسراذا اشتكت بطونها من أكل الطلح فهى طلحة وابل
  طلان مما من الطة ي لوج مينع واللع التغ اى ن الار با
  الاعشى
  كم رأينا من ملوك هلكوا • ورأينا الملاك عمرابطلح
  ويقمال طلح موضع والطلاح ضد الصلاح والطالح ضد الصالح والطليحتان طابحة بن خويلد
  الاسدى وأخوه ( لفح الطلنفح انالى الجوف ويقال المعى التعب وقال رجل
  من بنى الحرماز
  ونصبح بالغداة أترشئ • ونمسى بالعشى طلنفحينا
  ط مح مح بصره الى الشئ أرتفع وكل مر تفع طاح ورجل طماح أى شرة قال اليزيذى
  الطط.اح مثل الهاح يقال فرس فيه طماح وطمحت المرأة مثل جمعت فهى طامح أى تطمح
  الى الربال وأطمح فلان بصره رفعه وقال بعضهم طمح أى أبعد فى الطلب والطماح اسم
  رجل من بنى أسد يعثوه الى قيصر فحل بامرئ القيس عنده حق سم قال الكميت
  ونحن طمحنالا مرئ القيس بعدما * رجا لللك بالطماح:-كباعلى نكب
  وطمحات الدهرشدائده وطمح بيوله اذارماه فى الهواء وأبو الطمحان القيسى شاعر
  ( طوح طاح يطوح ويطيح هلك وسقط وكذلك اذاتاه فى الارض وطوّحه أى توهه
  وذهب به ههنا وه هنا فتطوّح فى البلاداذارمى بنفسه ههنا وههنا وتطاوحت بهم النوى أى
  ترامت والمطاوح المقاذف رطوحته الطوائح قذقته القواذف ولا يقال المطوّحات وهومن
  الموادركة وله تعالى وأرسلنا الرياح لواقح على أحد التأويلين
  صل الفار ) ( تح تحت الباب فانفتح وقتحت الابواب شدد للكثرة فتفتحت هى
  وباب فتح ٢ ى واسع مفتوح وقارورة فتح أى واسعة الرأس قال الكسائى- ايساها
  دعام
