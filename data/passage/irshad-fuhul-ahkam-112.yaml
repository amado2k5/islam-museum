text: "… فتلزمه وهو لا يقتضى التحريم. وأجيب بمنع ذلك بلى السابق الى الفهم عند التجرد هو التحريم وقيل العشرة نعم ان أتبعه باسقثناء مشترك بين التحريم والكراهة فلا يتعين أحدهما إلا بدليل وإلا كان جعله لأحدهما ترجيمها من آخر صح كقوله …"
summary:
  ar: "مقطع من إرشاد الفحول للشوكاني، ص 112، يرد فيه ذكر الكراهة، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shawkani's Irshad al-Fuhul, p. 112, whose wording mentions dislike (karaha), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ارشاد الفحول، شوکانی، ص 112 کا اقتباس جس میں کراہت، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Irshad al-Fuhul de al-Shawkani, p. 112, dont le texte mentionne la réprobation (karaha), l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Irshad al-Fuhul de al-Shawkani, p. 112, cuyo texto menciona la reprobación (karaha), la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Şavani'nin *İrshad el-Fuhul* adlı eserinin 112. sayfasından bir alıntı, kınanacak ve yasaklanmış fiillerden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz fiiller, itaat fiilleri, tavsiye edilen fiiller, kınanacak fiiller, yasaklanmış fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Irshad al-Fuhul* karya Al-Shawkani, halaman 112, menyebutkan perbuatan tercela dan haram; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan tercela, perbuatan haram, dan dosa-dosa kecil."
