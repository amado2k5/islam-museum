text: "إذا أنشأت بحرية ثم تشاءمت فتلك عين غديقة"
summary:
  ar: "بلاغ في باب الاستمطار بالنجوم: يروي مالك أنه بلغه أن النبي كان يقول: إذا أنشأت بحرية ثم تشاءمت فتلك عين غديقة. ويفسر المحقق «أنشأت بحرية» بأن تظهر سحابة من ناحية البحر وترتفع، و«تشاءمت» بأن تأخذ نحو الشام، والشام من المدينة في ناحية الشمال؛ ويذكر أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أنه لا يعرفه بوجه من الوجوه في غير الموطأ إلا ما ذكره الشافعي في كتاب الاستسقاء عن إبراهيم بن محمد بن أبي يحيى عن إسحاق بن عبد الله بنحوه، وابن أبي يحيى مطعون عليه متروك، وبلاغ مالك خير من حديثه ⁦(التمهيد 24/377)⁩. {cite:muwatta-maruf-1997 p.267}"
  id: "Sebuah riwayat mengenai turunnya hujan berdasarkan bintang-bintang: Malik meriwayatkan bahwa ia mendengar Nabi (shalawat dan salam kepadanya) bersabda: “Jika awan muncul dari laut dan kemudian bergerak ke arah utara, itu adalah tanda akan turunnya hujan yang melimpah.” Peneliti menjelaskan “muncul dari laut” sebagai awan yang muncul dari laut dan naik, dan “bergerak ke arah utara” sebagai awan yang bergerak ke arah Suriah, yang terletak di utara Madinah. Ia menyebutkan bahwa Abu Mus’ab dan Suwaid meriwayatkannya dari Malik, dan mengutip Ibnu Abd al-Barr yang mengatakan bahwa ia tidak mengetahuinya dalam bentuk lain selain dalam al-Muwatta’ kecuali apa yang disebutkan oleh al-Shafi’i dalam Kitab Mencari Hujan atas otoritas Ibrahim ibn Muhammad ibn Abi Yahya atas otoritas Ishaq ibn Abdullah, dengan redaksi yang serupa. Ibnu Abi Yahya dianggap tidak dapat diandalkan dan riwayatnya ditolak, dan riwayat Malik lebih baik daripada haditsnya (al-Tamhid 24/377). {mengutip:muwatta-maruf-1997 hal.267}"
