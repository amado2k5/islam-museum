text: "إذا أنشأت بحرية ثم تشاءمت فتلك عين غديقة"
summary:
  ar: "بلاغ في باب الاستمطار بالنجوم: يروي مالك أنه بلغه أن النبي كان يقول: إذا أنشأت بحرية ثم تشاءمت فتلك عين غديقة. ويفسر المحقق «أنشأت بحرية» بأن تظهر سحابة من ناحية البحر وترتفع، و«تشاءمت» بأن تأخذ نحو الشام، والشام من المدينة في ناحية الشمال؛ ويذكر أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أنه لا يعرفه بوجه من الوجوه في غير الموطأ إلا ما ذكره الشافعي في كتاب الاستسقاء عن إبراهيم بن محمد بن أبي يحيى عن إسحاق بن عبد الله بنحوه، وابن أبي يحيى مطعون عليه متروك، وبلاغ مالك خير من حديثه (التمهيد 24/377). {cite:muwatta-maruf-1997 p.267}"
