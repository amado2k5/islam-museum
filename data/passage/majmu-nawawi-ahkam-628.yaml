text: "… نائبه والحجيج إلى منى في اليوم الثامن من ذى الحجة إن كان يوم التروية يوم جمعة استحب الخروج قبل الفجر لكراهة السعر يوم الجمعة بعد الفجر وقبل الزوال وحيث لا تصلى الجمعة فالسفر حرام فى أصح القولين والثانى مكروه قال …"
summary:
  ar: "مقطع من المجموع للنووي، ص 628، يرد فيه ذكر المستحب، والمكروه، والحرام، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 628, whose wording mentions the recommended (mustahabb), the disliked (makruh), the forbidden (haram), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 628 کا اقتباس جس میں مستحب، مکروہ، حرام، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 628, dont le texte mentionne le recommandé (mustahabb), le réprouvé (makruh), l'interdit (haram), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 628, cuyo texto menciona lo recomendado (mustahabb), lo reprobado (makruh), lo prohibido (haram), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Mecmu' adlı eserinin 628. sayfasından, müstehaplı, mekruhlu, haram ve kınanacak fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz fiiller, itaat fiilleri, müstehaplı fiiller, mekruhlu fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Majmu' karya al-Nawawi, halaman 628, yang menyebutkan amalan yang dianjurkan, tidak disukai, dilarang, dan tercela; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
