text: "… نائبه والحجيج إلى منى في اليوم الثامن من ذى الحجة إن كان يوم التروية يوم جمعة استحب الخروج قبل الفجر لكراهة السعر يوم الجمعة بعد الفجر وقبل الزوال وحيث لا تصلى الجمعة فالسفر حرام فى أصح القولين والثانى مكروه قال …"
summary:
  ar: "مقطع من المجموع للنووي، ص 628، يرد فيه ذكر المستحب، والمكروه، والحرام، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 628, whose wording mentions the recommended (mustahabb), the disliked (makruh), the forbidden (haram), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
