label: { ar: "الموطأ 1135 — مالك: من قرن الحج والعمرة ثم فاته الحج، فعليه أن يحج قابلاً، ويقرن بين الحج والعمرة، ويهدي هديين: هدياً لقرانه الحج مع العمرة، وهدياً لما فاته من الحج", en: "Muwatta 1135", es: "Muwatta 1135", fr: "Muwatta 1135", ur: "موطا 1135", tr: "El-Muvatta 1135 — Malik: Hac ve Umreyi birleştiren ve sonra Hac'ı kaçıran kimse, ertesi yıl Hac ve Umreyi birleştirerek Hac yapmalı ve iki kurban kesmelidir: biri Hac ve Umreyi birleştirdiği için, diğeri ise kaçırdığı Hac için.", id: "Al-Muwatta 1135 — Malik: Barangsiapa menggabungkan haji dan umrah, lalu melewatkan haji, maka wajib melaksanakan haji pada tahun berikutnya, menggabungkan haji dan umrah, dan mempersembahkan dua kurban: satu untuk menggabungkan haji dan umrah, dan satu lagi untuk haji yang terlewatkan." }
summary:
  ar: "قول لمالك: من قرن الحج والعمرة ثم فاته الحج، فعليه أن يحج قابلاً، ويقرن بين الحج والعمرة، ويهدي هديين: هدياً لقرانه الحج مع العمرة، وهدياً لما فاته من الحج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1431) وسويد (532). {cite:muwatta-maruf-1997 p.516}"
  tr: "Malik şöyle demiştir: Hac ve Umreyi birleştiren ve sonra Hac'ı kaçıran kimse, ertesi yıl Hac ve Umreyi birleştirerek Hac yapmalı ve iki kurban kesmelidir: biri Hac ve Umreyi birleştirdiği için, diğeri ise kaçırdığı Hac için. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1431) ve Suveyd (532) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.516}"
  id: "Malik berkata: Barang siapa menggabungkan haji dan umrah, lalu melewatkan haji, maka ia harus melaksanakan haji pada tahun berikutnya, menggabungkan haji dan umrah, dan mempersembahkan dua kurban: satu untuk menggabungkan haji dan umrah, dan satu lagi untuk haji yang terlewatkan. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1431) dan Suwaid (532). {cite:muwatta-maruf-1997 p.516}"
