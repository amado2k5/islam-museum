summary:
  ar: "قول لمالك: من قرن الحج والعمرة ثم فاته الحج، فعليه أن يحج قابلاً، ويقرن بين الحج والعمرة، ويهدي هديين: هدياً لقرانه الحج مع العمرة، وهدياً لما فاته من الحج. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1431) وسويد (532). {cite:muwatta-maruf-1997 p.516}"
