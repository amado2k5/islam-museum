label: { ar: "الموطأ 2070 — يحيى عن مالك: أحسن ما سمع في عمال الرقيق في المساقاة أن يشترطهم المساقي على صاحب الأصل، لأنهم عمال المال، فلا بأس بذلك، وعلى ذلك الأمر عندنا", en: "Muwatta 2070", es: "Muwatta 2070", fr: "Muwatta 2070", ur: "موطا 2070", tr: "El-Muvatta 2070 — Yahya, Malik'ten rivayetle: Ortakçılıkta köle işçilerle ilgili duyduğum en iyi şey, ortakçının onları toprak sahibine şart koşmasıdır; çünkü onlar paranın işçileridir, dolayısıyla bunda bir sakınca yoktur ve bizde de uygulama böyledir.", id: "Al-Muwatta 2070 — Yahya berdasarkan riwayat Malik: Hal terbaik yang saya dengar mengenai pekerja paksa dalam sistem bagi hasil adalah bahwa petani menetapkan mereka kepada pemilik tanah, karena mereka adalah pekerja yang mencari uang, jadi tidak ada yang salah dengan itu, dan itulah praktik yang berlaku di antara kita." }
summary:
  ar: "قال يحيى: قال مالك: إن أحسن ما سمع في عمال الرقيق في المساقاة، أن يشترطهم المساقي على صاحب الأصل، إنه لا بأس بذلك. لأنهم عمال المال، فهم بمنزلة المال، لا منفعة فيهم للداخل إلا أنه تخف عنه بهم المؤونة، وإن لم يكونوا في المال اشتدت مؤونته. وإنما ذلك بمنزلة المساقاة في العين والنضح. ولن تجد أحدا يساقي في أرضين سواء في الأصل والمنفعة، إحداهما بعين واثنة غزيرة، والأخرى بنضح على شيء واحد، لخفة مؤونة العين، وشدة مؤونة النضح. قال: وعلى ذلك الأمر عندنا. قال: والواثنة الثابت ماؤها، التي لا تغور ولا تنقطع. {cite:muwatta-maruf-1997 p.246} {cite:muwatta-maruf-1997 p.247}"
  tr: "Yahya dedi ki: Malik dedi ki: Ortakçılıkta köle işçilerle ilgili duyduğum en iyi şey, ortakçının onları toprak sahibiyle kararlaştırabileceği ve bunda bir sakınca olmadığıdır. Çünkü onlar sermayenin işçileridir, sermayenin kendisi gibidirler. Ortakçıya hiçbir faydaları yoktur, sadece varlıkları giderlerini azaltır; oysa sermayenin bir parçası olmasalardı, giderleri artardı. Bu, hem kaynak hem de sulama açısından ortakçılığa benzer. Biri bol su kaynağına sahip, diğeri sulama imkanına sahip, kaynak maliyetinin düşük, sulama maliyetinin yüksek olması nedeniyle, aynı kaynaktan ve faydadan iki araziyi paylaşan kimseyi bulamazsınız. Dedi ki: Bizim durumumuzda da böyle yapılır. Dedi ki: Bol su kaynağı, suyu sürekli olan, ne azalan ne de kuruyan kaynaktır."
  id: "Yahya berkata: Malik berkata: Hal terbaik yang pernah kudengar mengenai pekerja budak dalam sistem bagi hasil adalah bahwa petani bagi hasil dapat menyepakati hal itu dengan pemilik tanah, dan tidak ada yang salah dengan itu. Karena mereka adalah pekerja modal, mereka seperti modal itu sendiri. Mereka tidak memberi manfaat kepada petani bagi hasil kecuali bahwa kehadiran mereka mengurangi pengeluarannya, sedangkan jika mereka bukan bagian dari modal, pengeluarannya akan meningkat. Ini mirip dengan sistem bagi hasil dalam hal sumber dan irigasi. Anda tidak akan menemukan siapa pun yang membagi dua lahan yang sama asal dan manfaatnya, satu dengan mata air yang melimpah dan yang lain dengan irigasi, karena biaya mata air yang lebih rendah dan biaya irigasi yang lebih tinggi. Dia berkata: Beginilah cara kerjanya dalam kasus kita. Dia berkata: Mata air yang melimpah adalah mata air yang airnya konstan, tidak berkurang atau mengering."
