label: { ar: "الموطأ 2070 — يحيى عن مالك: أحسن ما سمع في عمال الرقيق في المساقاة أن يشترطهم المساقي على صاحب الأصل، لأنهم عمال المال، فلا بأس بذلك، وعلى ذلك الأمر عندنا", en: "Muwatta 2070" }
summary:
  ar: "قال يحيى: قال مالك: إن أحسن ما سمع في عمال الرقيق في المساقاة، أن يشترطهم المساقي على صاحب الأصل، إنه لا بأس بذلك. لأنهم عمال المال، فهم بمنزلة المال، لا منفعة فيهم للداخل إلا أنه تخف عنه بهم المؤونة، وإن لم يكونوا في المال اشتدت مؤونته. وإنما ذلك بمنزلة المساقاة في العين والنضح. ولن تجد أحدا يساقي في أرضين سواء في الأصل والمنفعة، إحداهما بعين واثنة غزيرة، والأخرى بنضح على شيء واحد، لخفة مؤونة العين، وشدة مؤونة النضح. قال: وعلى ذلك الأمر عندنا. قال: والواثنة الثابت ماؤها، التي لا تغور ولا تنقطع. {cite:muwatta-maruf-1997 p.246} {cite:muwatta-maruf-1997 p.247}"
