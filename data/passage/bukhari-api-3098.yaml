label: { ar: "صحيح البخاري 3098 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 3098 — what was left behind: estate and inheritance", ur: "صحیح بخاری 3098 — ترکہ اور میراث" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ سُفْيَانَ، قَالَ حَدَّثَنِي أَبُو إِسْحَاقَ، قَالَ سَمِعْتُ عَمْرَو بْنَ الْحَارِثِ، قَالَ مَا تَرَكَ النَّبِيُّ إِلاَّ سِلاَحَهُ وَبَغْلَتَهُ الْبَيْضَاءَ، وَأَرْضًا تَرَكَهَا صَدَقَةً."
summary:
  ar: "حديث في صحيح البخاري، رقم 3098، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3098 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3098، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
