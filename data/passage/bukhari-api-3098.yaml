label: { ar: "صحيح البخاري 3098 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 3098 — what was left behind: estate and inheritance", ur: "صحیح بخاری 3098 — ترکہ اور میراث", es: "Sahih al-Bukhari 3098 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 3098 — Ce qui a été laissé derrière: biens et héritage", tr: "Sahih el-Buhari 3098 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sahih al-Bukhari 3098 — Apa yang ditinggalkan olehnya berupa warisan dan peninggalan" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ سُفْيَانَ، قَالَ حَدَّثَنِي أَبُو إِسْحَاقَ، قَالَ سَمِعْتُ عَمْرَو بْنَ الْحَارِثِ، قَالَ مَا تَرَكَ النَّبِيُّ إِلاَّ سِلاَحَهُ وَبَغْلَتَهُ الْبَيْضَاءَ، وَأَرْضًا تَرَكَهَا صَدَقَةً."
summary:
  ar: "حديث في صحيح البخاري، رقم 3098، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3098 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 3098، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3098 (Una quinta parte del botín para la causa de Alá (Khumus)), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 3098 (Le cinquième du butin pour la cause d'Allah (Khumus)), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 3098 numaralı hadis, geride bıraktığı mal varlığı ve miras hakkında bilgi vermektedir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3098, menyebutkan apa yang ditinggalkan beliau berupa harta warisan. Hadits ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, peninggalan, dan makam suci, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
