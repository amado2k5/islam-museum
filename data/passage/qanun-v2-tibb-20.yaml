text: "… السرسام الحار، وهو مرض معروف. وهو التهاب الدماغ. ليثرغس: حالة دوار وفقدان للإحساس والقوة أو النسيان. فرانيطس: هو قرانيطس، أو السرسام الحار. المبرسمة: من أصيبت بداء البرسام. وهو حمّى يلازمها صداع وثقل رأس."
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 20، يذكر المرض والمريض، والحمى، وأسماء الأمراض، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 20, that mentions illness and the sick, fever, named diseases, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 20 کا اقتباس جس میں بیماری اور بیمار، بخار، بیماریوں کے نام، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
