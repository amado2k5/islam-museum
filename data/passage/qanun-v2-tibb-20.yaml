text: "… السرسام الحار، وهو مرض معروف. وهو التهاب الدماغ. ليثرغس: حالة دوار وفقدان للإحساس والقوة أو النسيان. فرانيطس: هو قرانيطس، أو السرسام الحار. المبرسمة: من أصيبت بداء البرسام. وهو حمّى يلازمها صداع وثقل رأس."
