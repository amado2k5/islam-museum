  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 20, qui mentionne la maladie et les malades, la fièvre, les maladies nommées, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Bölümünün 20. sayfasından, hastalık, hasta, ateş, hastalıkların isimleri ve rahatsızlıktan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 20, yang menyebutkan penyakit, pasien, demam, nama-nama penyakit, dan keluhan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
