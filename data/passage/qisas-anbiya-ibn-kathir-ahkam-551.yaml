text: "… ما عنده من العلم الذي اختصه اللّٰه به دونه، فلو كان غير نبي، لم يكن معصوما، ولم تكن لموسى — وهو نبي عظيم ورسول كريم واجب العصمة — كبير رغبة ولا عظيم طلبة في علم ولى غير واجب العصمة، ولما …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 551، يرد فيه ذكر الواجب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 551, whose wording mentions the obligatory (wajib), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 551 کا اقتباس جس میں واجب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Qisas al-Anbiya' de Ibn Kathir, p. 551, dont le texte mentionne l'obligatoire (wajib), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Qisas al-Anbiya' de Ibn Kathir, p. 551, cuyo texto menciona lo obligatorio (wajib), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 551. sayfasından bir alıntı, farz olan ve olmayan şeyleri sıralamaktadır; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 551, menyebutkan apa yang wajib dan apa yang tidak wajib; dari versi yang dipindai dan dapat dibaca mesin. Teks tersebut merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
