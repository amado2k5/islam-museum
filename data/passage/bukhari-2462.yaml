text: "حين توفي الله نبيه إن الأنصار اجتمعوا في سقيفة بني ساعدة، فقلت لأبي بكر: انطلق بنا إلى إخواننا من الأنصار… فجئناهم في سقيفة بني ساعدة"
summary:
  ar: "في كتاب فضائل أصحاب النبي؛ حديث عمر الطويل المعروف بحديث السقيفة، يرويه ابن عباس عنه حين اعتل المنبر في آخر خلافته: اجتماع الأنصار بسعد بن عبادة في السقيفة، وذهاب أبي بكر وعمر وأبي عبيدة إليهم، وخطابا عمر وأبي بكر «لسنا بالأمراء وأنتم الوزراء» و«أمير منا ووزير منكم»، وخطبة الحباب بن المنذر، ورد سعد، وأخذ عمر يد أبي بكر فبايعه ثم بشير بن سعد، وبيعة العامة في الغد بالمسجد. النص الأساس في الحديث لوقائع السقيفة كلها."
  tr: "\"Peygamberin Sahabelerinin Faziletleri\" adlı kitapta, İbn Abbas'ın halifeliğinin sonlarında minbere çıktığı sırada rivayet ettiği, Sakife hadisi olarak bilinen uzun bir Ömer hadisi bulunmaktadır: Ensar'ın Sa'd ibn Ubede ile Sakife'de toplanması, Ebu Bekir, Ömer ve Ebu Ubede'nin onlara gelmesi, Ömer ve Ebu Bekir'in \"Biz yöneticiler değiliz, siz vezirlersiniz\" ve \"Bizden bir yönetici, sizden bir vezir\" sözleri, el-Hubab ibn el-Mundhir'in konuşması, Sa'd'ın cevabı, Ömer'in Ebu Bekir'in elini tutarak biat etmesi, ardından Beşir ibn Sa'd'ın biat etmesi ve ertesi gün camide halkın biat etmesi. Bu, Sakife'deki tüm olayların ana hadis metnidir."
  id: "Dalam kitab \"Keutamaan Para Sahabat Nabi,\" terdapat hadits panjang Umar, yang dikenal sebagai hadits Saqifa, diriwayatkan oleh Ibnu Abbas atas otoritasnya ketika beliau naik mimbar di akhir kekhalifahannya: pertemuan kaum Ansar dengan Sa'd ibn Ubadah di Saqifa, kedatangan Abu Bakar, Umar, dan Abu Ubaydah kepada mereka, pidato Umar dan Abu Bakar, \"Kami bukanlah penguasa dan kalian adalah menteri\" dan \"Seorang penguasa dari kalangan kami dan seorang menteri dari kalangan kalian,\" pidato al-Hubab ibn al-Mundhir, tanggapan Sa'd, Umar memegang tangan Abu Bakar dan berbaiat kepadanya, kemudian Bashir ibn Sa'd, dan baiat masyarakat umum pada hari berikutnya di masjid. Ini adalah teks utama hadits untuk semua peristiwa Saqifa."
