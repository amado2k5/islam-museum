text: "حين توفي الله نبيه إن الأنصار اجتمعوا في سقيفة بني ساعدة، فقلت لأبي بكر: انطلق بنا إلى إخواننا من الأنصار… فجئناهم في سقيفة بني ساعدة"
summary:
  ar: "في كتاب فضائل أصحاب النبي؛ حديث عمر الطويل المعروف بحديث السقيفة، يرويه ابن عباس عنه حين اعتل المنبر في آخر خلافته: اجتماع الأنصار بسعد بن عبادة في السقيفة، وذهاب أبي بكر وعمر وأبي عبيدة إليهم، وخطابا عمر وأبي بكر «لسنا بالأمراء وأنتم الوزراء» و«أمير منا ووزير منكم»، وخطبة الحباب بن المنذر، ورد سعد، وأخذ عمر يد أبي بكر فبايعه ثم بشير بن سعد، وبيعة العامة في الغد بالمسجد. النص الأساس في الحديث لوقائع السقيفة كلها."
