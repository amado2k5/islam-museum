label: { ar: "سنن أبي داود 757 — الأب والأبوة", en: "Sunan Abi Dawud 757 — the father and fatherhood", ur: "سنن ابی داؤد 757 — باپ اور والدیت" }
text: "… مُحَمَّدُ بْنُ قُدَامَةَ، - يَعْنِي ابْنَ أَعْيَنَ - عَنْ أَبِي بَدْرٍ، عَنْ أَبِي طَالُوتَ عَبْدِ السَّلاَمِ، عَنِ ابْنِ جَرِيرٍ الضَّبِّيِّ، عَنْ أَبِيهِ، قَالَ رَأَيْتُ عَلِيًّا - - يُمْسِكُ شِمَالَهُ بِيَمِينِهِ عَلَى الرُّسْغِ فَوْقَ السُّرَّةِ. قَالَ أَبُو دَاوُدَ وَرُوِيَ عَنْ سَعِيدِ بْنِ جُبَيْرٍ فَوْقَ السُّرَّةِ. وَقَالَ أَبُو مِجْلَزٍ تَحْتَ السُّرَّةِ. وَرُوِيَ عَنْ أَبِي هُرَيْرَةَ وَلَيْسَ بِالْقَوِيِّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 757، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 757 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 757، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
