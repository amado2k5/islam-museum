text: "… هل حيوانات هذه الطاحون كبيرة بنسبتها؟ كان جحا ماراً في أحد أزقَّةٍ قونية، فرأى داراً مرتفعة عظيمة، فأخذ يُطِيلُ النظرَ إليها، ويحارُ في عظمةِ بنائها ورونقها. فقال له الخادم الواقف أمامها: لماذا تنظر إلى الدار باهتمامٍ؟ فأجابه جحا: أتفكِّرُ في …"
summary:
  ar: "وقف جحا بملابس ممزقة يتأمل بيتاً كبيراً في قونية، فسأله الخادم عن سبب ذلك، فسأله جحا هل حيوانات هذه الطاحون كبيرة بنسبتها، فقال الخادم إنه ليس طاحوناً بل بيت. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  en: "Juha, in ragged clothes, stands looking at a large house in Konya, and the servant asks why. Juha asks whether the mill's animals are large relative to it, and the servant says it is not a mill but a house. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  ur: "جحا پھٹے پرانے کپڑوں میں قونیہ کے ایک بڑے گھر کو دیکھ رہا ہوتا ہے تو نوکر وجہ پوچھتا ہے۔ جحا پوچھتا ہے کہ کیا اس چکی کے جانور اس کے مقابلے میں بڑے ہیں، تو نوکر کہتا ہے کہ یہ چکی نہیں گھر ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  fr: "Juha, en haillons, regarde une grande maison à Konya, et le serviteur lui demande pourquoi. Juha demande si les bêtes du moulin sont grandes par rapport à lui, et le serviteur répond que ce n'est pas un moulin mais une maison. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  es: "Juha, con ropa harapienta, mira una gran casa en Konya, y el sirviente le pregunta por qué. Juha pregunta si los animales del molino son grandes en proporción, y el sirviente dice que no es un molino sino una casa. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
  tr: "Yırtık pırtık giysiler içindeki Juha, Konya'daki büyük bir eve bakakalmıştı. Hizmetçi nedenini sordu ve Juha, değirmendeki hayvanların da orantılı olarak büyük olup olmadığını sordu. Hizmetçi, bunun bir değirmen değil, bir ev olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 100}"
  id: "Juha, dengan pakaian compang-camping, berdiri memandang sebuah rumah besar di Konya. Pelayan bertanya kepadanya mengapa, dan Juha bertanya apakah hewan-hewan di penggilingan itu berukuran besar. Pelayan menjawab bahwa itu bukan penggilingan, melainkan rumah. {cite:juha-nawadir-kubra-djuwaydi p. 100}"
