text: "… قَالَ حَدَّثَنَا أَحْمَدُ بْنُ خَالِدٍ الْحِمْصِيُّ، قَالَ حَدَّثَنَا مُحَمَّدُ ابْنُ إِسْحَاقَ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ الْمَقْبُرِيِّ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ أَهْدَى رَجُلٌ مِنْ بَنِي فَزَارَةَ إِلَى النَّبِيِّ نَاقَةً مِنْ إِبِلِهِ الَّتِي كَانُوا أَصَابُوا بِالْغَابَةِ فَعَوَّضَهُ مِنْهَا بَعْضَ الْعِوَضِ فَتَسَخَّطَهُ فَسَمِعْتُ رَسُولَ اللَّهِ عَلَى هَذَا الْمِنْبَرِ يَقُولُ \" إِنَّ رِجَالاً مِنَ الْعَرَبِ يُهْدِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3946، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3946 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3946، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3946 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
