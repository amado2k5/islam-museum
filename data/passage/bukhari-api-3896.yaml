label: { ar: "صحيح البخاري 3896 — الأب والأبوة", en: "Sahih al-Bukhari 3896 — the father and fatherhood", ur: "صحیح بخاری 3896 — باپ اور والدیت" }
text: "حَدَّثَنِي عُبَيْدُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، قَالَ تُوُفِّيَتْ خَدِيجَةُ قَبْلَ مَخْرَجِ النَّبِيِّ إِلَى الْمَدِينَةِ بِثَلاَثِ سِنِينَ، فَلَبِثَ سَنَتَيْنِ أَوْ قَرِيبًا مِنْ ذَلِكَ، وَنَكَحَ عَائِشَةَ وَهْىَ بِنْتُ سِتِّ سِنِينَ، ثُمَّ بَنَى بِهَا وَهْىَ بِنْتُ تِسْعِ سِنِينَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3896، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3896 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3896، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
