label: { ar: "الموطأ 248 — ذو اليدين في صلاة العصر: كل ذلك لم يكن", en: "Muwatta 248", es: "Muwatta 248", fr: "Muwatta 248", ur: "موطا 248", tr: "Al-Muwatta 248 — Öğle namazında iki eliyle namaz kılan: Bütün bunlar değildi", id: "Al-Muwatta 248 — Orang yang memiliki dua tangan dalam salat Ashar: Semua itu tidak" }
text: "كل ذلك لم يكن. فقال: قد كان بعض ذلك يا رسول الله"
summary:
  ar: "يرويه مالك عن داود بن الحصين عن أبي سفيان مولى ابن أبي أحمد عن أبي هريرة، في باب ما يفعل من سلم من ركعتين ساهياً: صلى النبي العصر فسلم في ركعتين، فقام ذو اليدين وسأله أقصرت الصلاة أم نسي، فقال: كل ذلك لم يكن، فقال ذو اليدين: قد كان بعض ذلك، فأقبل النبي على الناس وسألهم أصدق ذو اليدين، فقالوا نعم، فأتم ما بقي من الصلاة ثم سجد سجدتين بعد التسليم وهو جالس. ويخرّجه المحقق عند مسلم (2/87) والنسائي (3/22) وابن خزيمة (1037) وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (2/311). {cite:muwatta-maruf-1997 p.148}"
  id: "Diriwayatkan oleh Malik dari Dawud ibn al-Husayn, dari Abu Sufyan, budak yang dibebaskan oleh Ibn Abi Ahmad, dari Abu Hurayrah, dalam surah tentang apa yang harus dilakukan jika seseorang keliru mengucapkan salam setelah dua rakaat: Nabi (shalawat dan salam kepadanya) mengerjakan salat Asar dan mengucapkan salam setelah dua rakaat. Dhu al-Yadayn berdiri dan bertanya kepadanya, \"Apakah salatnya dipersingkat, atau apakah beliau lupa?\" Beliau menjawab, \"Tidak satu pun dari hal itu terjadi.\" Dhu al-Yadayn berkata, \"Sebagiannya memang terjadi.\" Maka Nabi berpaling kepada orang-orang dan bertanya kepada mereka, \"Apakah Dhu al-Yadayn mengatakan yang benar?\" Mereka menjawab, \"Ya.\" Maka beliau menyelesaikan sisa salat dan kemudian melakukan dua sujud karena lupa setelah mengucapkan salam sambil duduk. Penyunting menyertakannya dalam Muslim (2/87), al-Nasa'i (3/22), Ibn Khuzaymah (1037), Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (2/311)."
