label: { ar: "الموطأ 248 — ذو اليدين في صلاة العصر: كل ذلك لم يكن", en: "Muwatta 248" }
text: "كل ذلك لم يكن. فقال: قد كان بعض ذلك يا رسول الله"
summary:
  ar: "يرويه مالك عن داود بن الحصين عن أبي سفيان مولى ابن أبي أحمد عن أبي هريرة، في باب ما يفعل من سلم من ركعتين ساهياً: صلى النبي العصر فسلم في ركعتين، فقام ذو اليدين وسأله أقصرت الصلاة أم نسي، فقال: كل ذلك لم يكن، فقال ذو اليدين: قد كان بعض ذلك، فأقبل النبي على الناس وسألهم أصدق ذو اليدين، فقالوا نعم، فأتم ما بقي من الصلاة ثم سجد سجدتين بعد التسليم وهو جالس. ويخرّجه المحقق عند مسلم (2/87) والنسائي (3/22) وابن خزيمة (1037) وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (2/311). {cite:muwatta-maruf-1997 p.148}"
