  en: "An excerpt from al-Nawawi's al-Majmu', p. 442, whose wording mentions the obligation (farida), the obligatory (fard), the obligatory (wajib), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
