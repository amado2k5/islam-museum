text: "… فلو أفردت الصفة بالنذر وكان الأصل واجبا شرعا كتطويل القراءة والركوع والسجود فى الفرائض، أو أن يقرأ فى الصبح مثل سورة كذا، أو أن يصلى الفرض فى جماعة، وجهان أصحهما. ازومها لأنها طاعة والثانى لا، لئلا تغير مما وضعها الشرع …"
summary:
