text: "… فلو أفردت الصفة بالنذر وكان الأصل واجبا شرعا كتطويل القراءة والركوع والسجود فى الفرائض، أو أن يقرأ فى الصبح مثل سورة كذا، أو أن يصلى الفرض فى جماعة، وجهان أصحهما. ازومها لأنها طاعة والثانى لا، لئلا تغير مما وضعها الشرع …"
summary:
  ar: "مقطع من المجموع للنووي، ص 442، يرد فيه ذكر الفريضة والفرائض، والفرض، والواجب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 442, whose wording mentions the obligation (farida), the obligatory (fard), the obligatory (wajib), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 442 کا اقتباس جس میں فریضہ اور فرائض، فرض، واجب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 442, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligatoire (wajib), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
