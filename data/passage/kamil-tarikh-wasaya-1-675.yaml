text: "ثمّ مضى، وإذا على يمينه قبور سبعة أو ثمانية، فقال عليٌّ : ما هذه؟ فقيل: يا أمير المؤمنينِ، إنّ خبّاب بن الأرت توفي بعد مخرجك، وأوصى بأن يُدفن في الظّهر، وكان الناس إنّما يُدْفنون في دُورهم وأفنيتهم، وكان أوّل من …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 675، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 675, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 675 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
