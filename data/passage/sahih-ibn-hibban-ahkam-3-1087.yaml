text: "… قال أَبُو حاتم: قوله وليفي: فاجعل هذه نفسك أراد به الإعلام بنفي جواز الحج عن الغير إذا لم يحج عن نفسه وقوله: ثم احجُجْ عن شُبْرُمَة أمر إباحة لا حتم. - ذكر الأمر بالحج عن من وجب عليه فريضة اللّٰه …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 1087، يرد فيه ذكر الفريضة والفرائض، وما يجب على المكلف، والمباح، والحتم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 1087, whose wording mentions the obligation (farida), what is binding on the person addressed, the permitted (mubah), the binding (hatm); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 1087 کا اقتباس جس میں فریضہ اور فرائض، جو مکلف پر واجب ہے، مباح، حتمی حکم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 3, p. 1087, dont le texte mentionne l'obligation (farida), ce qui s'impose à la personne responsable, le permis (mubah), le contraignant (hatm) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 3, p. 1087, cuyo texto menciona la obligación (farida), lo que obliga a la persona responsable, lo permitido (mubah), lo vinculante (hatm); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, Cilt 3, sayfa 1087'den, farz olan fiiller, görevler, sorumlu bir kişiden beklenenler, izin verilen fiiller ve zorunlu fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid 3, halaman 1087, yang menyebutkan amalan wajib, kewajiban, apa yang dituntut dari orang yang bertanggung jawab, amalan yang diperbolehkan, dan amalan yang wajib dibaca; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
