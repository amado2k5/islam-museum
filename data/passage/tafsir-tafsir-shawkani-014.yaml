text: "ظلمهم حرج لمخالفتهم لنا في ديننا، وادعوا لعنهم الله أن ذلك في كتابهم، فرد الله سبحانه عليهم بقوله: (ويقولون على الله الكذب وهم يعلمون* بلى) أي: بلى عليهم سبيل لكذبهم، واستحلالهم أموال العرب، فقوله: وبلى إثبات لما نفوه من السبيل."
