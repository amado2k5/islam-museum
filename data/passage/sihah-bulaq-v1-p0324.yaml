text: |-
  ⁦(دز)⁩
  ٣١٧
  بأبيض من أبكار مزت سحابة • وأرى دبورشاره النحسل عاسل
  ويقال أيض اللزنا بيردبرومنه قيل لعاصم بن ثابت الانصارى حىّ الدبر وذلك ان المشركين
  لما قتلوه أرادوا أن يمثلوا به فسلط اللّٰه عليهم الزنابير الكار تأبر الدراع فارتدء واعنه حتى
  أخذه المسلون فدفنوه ويقال جعلت كلامه دبر أذنى أى أغضيت عنه وتصائمت والدبرة
  والدبارة المشارة فى المزرعة وهى بالفادسية كرد والمع دبرودباروذات الدبراسم ثنية قال ابن
  الاعرابى وقد صحفه الاصمعى فقال ذات الدير والدبر والدبر الظهر قال اللّٰه تعالى ويولون
  الدبر جعله للجماعة كما قال لايرتذ اليهم طرفهم والدبر والدبرخلاف القبل ودبر الامر ودبره
  آخره قال المكميت
  أعهدك من أولى الشبيبة نطلب • على دبرهيهات شأومغرب
  ودبير قبيلة من بنى أسد والدبر بالكسر المال الكثير واحده وجعه سواء يقال مال دبر
  ومالّان دبروأ- وال دبر ورجل ذودبركثير الضيعة والمال -كاه أبو عبيد عن أبى زيدوالدبرة
  خلاف القبلة يقال فلان ماله قبلة ولا دبرة اذالم يهتدلجهة أمره وليس لهذا الامرقيلة
  ولا دبرة اذا لم يعرف وجهه والدبرة بالتحريك واحدة الدبر والادبار مثل شجرة وشي روأشجار
  تقول منسه دبر البعير بالكسر وأدبره القتب والدبرة بالاسكان والتحريك أيضا الهزعة
  فى القتال وهواسم من الادبار وبقال أيضاشر الرأى الدبرى" وهوالذى يسنخ أخير اعند
  فوت الحاجة قال أبوزيد يقال فلان لايصلى الصلاة الادبريا بالفتح أى فى آخروقتها
  والمهدّثون يقولون دبريا بالضم والدبران خسة كواكب من النوريقال انه سنامه وهو
  من منازل القمر وقال الشيدانىّ الدابرة آخر الرمل ودابرة الانسان ءرقوبه ودابرة الطائر
  التى يضرب بم اوهى كالاصمع فى ماطن رجله ودابرة الحافر ماحادى وحر الرسغ والدابرة
  نرب من الشغزبية فى الصراع والدابر التابع والدابر من السهام الذى يخرج من الهدف
  والدابر من القداح خلاف الفانزوصاحبه مدابر قال صخر الغى الهذلى بصف ماء ورده
  فضخفت صفنى فى جه • خياض المدابرقد حاعطوفا
  وقطع القه دابرهم أى آخر من بى منهم ويقال رجل أدابر اللذى يقطع رحه ممل أبائر وقال
  أبو عبددة لا يقبل قول أحدولا يلوى على شى والدبيرما أدبرت به المرأة من غزاهاحين تفتله
  وقال يعقوب القبيل ما أقبلت به الى صدركْ والدبيرما أدبرت به عن صدرك يقال فلان
  ما يعرف قبيلا من دبيروفلان مقابل ومدابراذا كان محضا من أبويه قال الاصمعى وأصله
  من الاقبالة والادبارة وه وشق فى الاذن ثم يفمسل ذلك فاذا أقبل به فهو الاقبالة واذا أدبربه
  فهو الاديارة والملمدة المعلقة من الاذن هى الاقبالة والادبارة كأنهازغة والشاة مدابرة
  ومقابلة وقد دابرتها وقابلتها وناقة ذات اقبالة وادبارة ودبار بالضم اسم يوم الاربعاء
  من أسمائهم القديمة والدبار بالفتح الهلاك مثل الدماروا لدبار يالكسرجع دبارة وهى المشارة
  قال بشر
  تحدّرماء المزن عن جرشية *على جربة تعلو الدبار غروبها
  وفلان يأتى الصلاة دبارا أى بعدماذهب وقبها والدبورالريح التى تقابل الصماودبر السه-م
  يدبرد بورا أى خرج من الهدف ودبربالشئ ذهب به ودبر النهار وأدبر بيعى ويقال هيهات
  ٨٠
  صحاح
