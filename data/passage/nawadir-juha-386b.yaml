label: { ar: "نوادر جحا الكبرى، ص 189 — «هل كل الليالي جمعة؟»", en: "Nawadir Juha al-Kubra, p. 189 — 'Is Every Night a Friday?'", ur: "نوادر جحا الکبریٰ، ص 189 — «کیا ہر رات جمعہ ہے؟»", fr: "Nawadir Juha al-Kubra, p. 189 — « Toutes les nuits sont-elles des vendredis ? »", es: "Nawadir Juha al-Kubra, p. 189 — «¿Todas las noches son viernes?»" }
text: "… هل كُلُّ الليالي جمعة؟ خلّصيني جعلني اللَّهُ فداك؟ قالت: في الموت؟ قال: إذاً لا، فقد كنت أظنُّ أنَّ في الأجل فسحة.. قال: نعم، أقومُ وأبوِّلُ، ثم أرجعُ إلى فراشي. الليلة. من الجمعة، أو خلصي الجمعة منّي. النزع: لحظات الموت الأخيرة. …"
summary:
  ar: "سُئل جحا هل يحافظ على صلاة الليل، فقال إنه يطلب من زوجته أن تقلب الوسادة ليلة الجمعة علامةً، فهي تقلبها كل ليلة، فسألها هل كل الليالي جمعة، وطلب منها أن تتركه، إلا إن كانت تريد أن يكون فداءها في الموت. {cite:juha-nawadir-kubra-djuwaydi p. 189}"
  en: "Asked whether he keeps night prayers, Juha says he asks his wife to turn the pillow on Friday nights as a sign; she turns it every night; he asks whether every night is Friday, and asks her to let him go, unless she wishes him to be her ransom in death. {cite:juha-nawadir-kubra-djuwaydi p. 189}"
  ur: "جحا سے پوچھا گیا کہ کیا وہ رات کی نماز کا اہتمام کرتا ہے، تو اس نے کہا کہ وہ اپنی بیوی سے جمعے کی راتوں میں تکیہ پلٹنے کو کہتا ہے بطور نشانی، مگر وہ ہر رات اسے پلٹ دیتی ہے، اس نے اس سے پوچھا کہ کیا ہر رات جمعہ ہے، اور کہا کہ مجھے چھوڑ دو، الا یہ کہ تم چاہو کہ میں موت میں تمہارا فدیہ بنوں۔ {cite:juha-nawadir-kubra-djuwaydi p. 189}"
  fr: "Interrogé pour savoir s'il observe les prières de la nuit, Juha dit qu'il demande à sa femme de retourner l'oreiller les nuits de vendredi en guise de signe ; elle le retourne chaque nuit ; il lui demande si toutes les nuits sont des vendredis et la prie de le laisser, à moins qu'elle ne souhaite qu'il soit sa rançon dans la mort. {cite:juha-nawadir-kubra-djuwaydi p. 189}"
  es: "Al preguntarle si guarda las oraciones nocturnas, Juha dice que pide a su esposa que le dé la vuelta a la almohada las noches de viernes como señal; ella se la da cada noche; él le pregunta si todas las noches son viernes y le pide que lo deje, a menos que quiera que él sea su rescate en la muerte. {cite:juha-nawadir-kubra-djuwaydi p. 189}"
