text: "… هق على ظهر خنميه. أخرجه هق : من طريق ابن مهدي عن الثوري ومن رواية شعبة أيضاً. روى ش عن الشعبي كلا الأمرين مفرقين في روايتين ص. يعي عبد الرزاق. في الأصل دون الإعجام. أي ابن الأعراني الراوي عن الدبري."
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 220، يذكر قراءات القرآن، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 220, that mentions the readings of the Qur'an, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 220 کا اقتباس جس میں قرآن کی قراءتیں، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 1, pág. 220, que menciona las lecturas del Corán, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 1, page 220, mentionnant les lectures du Coran, la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Abdülrazzak'ın Resimli Musannaf adlı eserinin 1. cildinin 220. sayfasından, Kur'an okunuşlarını, Kur'an'ın diyakritik işaretlerini ve yazısını ele alan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, halaman 220, yang menyebutkan bacaan Al-Qur'an, tanda diakritik Al-Qur'an, dan aksaranya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
