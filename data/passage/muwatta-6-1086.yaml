label: { ar: "الموطأ 1086 — بلغ مالكاً أن سعد بن أبي وقاص كان إذا دخل مكة مراهقاً خرج إلى عرفة قبل أن يطوف بالبيت وبين الصفا والمروة، ثم يطوف بعد أن يرجع؛ قال مالك: وذلك واسع إن شاء الله", en: "Muwatta 1086" }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن سعد بن أبي وقاص كان إذا دخل مكة مراهقاً خرج إلى عرفة قبل أن يطوف بالبيت وبين الصفا والمروة، ثم يطوف بعد أن يرجع. قال مالك: وذلك واسع إن شاء الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1306) وسويد (549). {cite:muwatta-maruf-1997 p.499}"
