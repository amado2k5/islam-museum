label: { ar: "الموطأ 1086 — بلغ مالكاً أن سعد بن أبي وقاص كان إذا دخل مكة مراهقاً خرج إلى عرفة قبل أن يطوف بالبيت وبين الصفا والمروة، ثم يطوف بعد أن يرجع؛ قال مالك: وذلك واسع إن شاء الله", en: "Muwatta 1086", es: "Muwatta 1086", fr: "Muwatta 1086", ur: "موطا 1086", tr: "El-Muvatta 1086 — Malik'e şöyle bir rivayet ulaştı: Sa'd ibn Abi Vakkas genç yaşta Mekke'ye girdiğinde, Kâbe'nin etrafında tavaf yapmadan önce Arafat'a gider, Safa ile Merve arasında sa'ayn tutar, sonra da geri döner ve tavaf yapardı. Malik şöyle dedi: Bu, Allah'ın izniyle caizdir.", id: "Al-Muwatta 1086 — Sampai kepada Malik bahwa ketika Sa'd ibn Abi Waqqas memasuki Mekah sebagai seorang pemuda, ia biasa pergi ke Arafat sebelum melakukan Tawaf mengelilingi Ka'bah dan Sa'ayn antara Safa dan Marwa, kemudian melakukan Tawaf setelah kembali. Malik berkata: Itu diperbolehkan, insya Allah." }
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن سعد بن أبي وقاص كان إذا دخل مكة مراهقاً خرج إلى عرفة قبل أن يطوف بالبيت وبين الصفا والمروة، ثم يطوف بعد أن يرجع. قال مالك: وذلك واسع إن شاء الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1306) وسويد (549). {cite:muwatta-maruf-1997 p.499}"
  tr: "Malik, Sa'd ibn Abi Waqqas'ın genç yaşta Mekke'ye girdiğinde, Kâbe'nin etrafında tavaf yapmadan önce Arafat'a gittiğini, Safa ve Merve arasında Sa'i yaptığını ve döndükten sonra da tavaf yaptığını duyduğunu bildirmiştir. Malik, \"Bu, Allah'ın izniyle caizdir\" demiştir. Editör, bunun Malik'ten Ebu Mus'ab (1306) ve Suwaid (549) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.499}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa Sa'd ibn Abi Waqqas, ketika memasuki Mekah sebagai seorang pemuda, akan pergi ke Arafat sebelum melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa, kemudian melakukan Tawaf setelah kembali. Malik berkata: \"Itu diperbolehkan, insya Allah.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1306) dan Suwaid (549). {cite:muwatta-maruf-1997 p.499}"
