text: "… ثنا يَسَرَة بن صَفْوان، عن نافع، عن ابن أبي مُلَيْكَة مُرْسَلًا، وهو أشبه. وقال عِكْرِمَة، عن ابن عبّاس، إنّ رسول اللّه وَيِعِ خرج من مرضه الذي مات فيه عاصباً رأسَه بعصابةٍ دَسْمَاءَ مُلْتَحِفاً بملْحَفَةٍ على مَنْكِبَيْه، فجلس على المنبر وأوصى …"
