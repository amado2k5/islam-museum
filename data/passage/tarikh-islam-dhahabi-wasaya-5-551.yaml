text: "… ثنا يَسَرَة بن صَفْوان، عن نافع، عن ابن أبي مُلَيْكَة مُرْسَلًا، وهو أشبه. وقال عِكْرِمَة، عن ابن عبّاس، إنّ رسول اللّه وَيِعِ خرج من مرضه الذي مات فيه عاصباً رأسَه بعصابةٍ دَسْمَاءَ مُلْتَحِفاً بملْحَفَةٍ على مَنْكِبَيْه، فجلس على المنبر وأوصى …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 551، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 5, p. 551, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 5، ص 551 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
