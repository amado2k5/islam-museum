label: { ar: "دلائل النبوة للبيهقي ص 2851 — كتابة الحسنات، رفع الدرجات", en: "al-Bayhaqi's Dala'il al-Nubuwwa, p. 2851 — the writing of good deeds; ranks raised", ur: "دلائل النبوۃ، بیہقی ص 2851 — نیکیوں کا لکھا جانا، درجات کی بلندی", es: "Dala'il al-Nubuwwa de al-Bayhaqi, pág. 2851 — la escritura de buenas obras; rangos elevados", fr: "Dala'il al-Nubuwwa d'al-Bayhaqi, p. 2851 — l'écriture des bonnes actions; les rangs élevés", tr: "El-Beyhakî'nin Peygamberliğin Alametleri adlı eserinden, s. 2851 — İyi amellerin kaydedilmesi, derecelerin yükseltilmesi", id: "Tanda-tanda Kenabian oleh Al-Bayhaqi, hlm. 2851 — Mencatat amal kebaikan, menaikkan derajat" }
text: "… . فقال : وأما طوافك في البيت فإنك لا تضع رجلًا ولا ترفعُها إلا كتب اللّٰه لك بها حسنة ومحا عنك بها خطيئة ويرفع لك بها درجةً . وأما ركعتاك بعد الطواف فإنها كعتق رقبة من بني إسماعيل وأما طوافك …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 2851، يذكر كتابة الحسنات، ورفع الدرجات، وعمل يعدل عملا أعظم، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 2851, that speaks of the writing of good deeds, ranks raised, a deed that equals a greater one, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 2851 کا اقتباس جس میں نیکیوں کا لکھا جانا، درجات کی بلندی، ایک عمل جو بڑے عمل کے برابر ہے، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 2851, que habla de la escritura de buenas obras, rangos elevados, una obra que iguala a otra mayor, malas obras borradas y pecados perdonados; del texto extraído, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, p. 2851, qui parle de l'écriture des bonnes actions, des rangs élevés, d'une action qui en vaut une plus grande, des mauvaises actions effacées et des péchés expiés; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 2851. sayfasında, iyi amellerin yazılması, derecelerin yükseltilmesi, daha büyük bir ameli andıran bir eylem, kötü amellerin silinmesi ve günahların kaldırılması gibi konular geçmektedir; alıntılanan metin, kaynakların politikasına göre yaklaşık kırk kelimeyle aktarılmıştır."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian,” hlm. 2851, menyebutkan tentang pencatatan amal kebaikan, kenaikan derajat, suatu perbuatan yang setara dengan perbuatan yang lebih besar, penghapusan perbuatan jahat dan penghapusan dosa; dari salinan yang diambil, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
