text: "… . فقال : وأما طوافك في البيت فإنك لا تضع رجلًا ولا ترفعُها إلا كتب اللّٰه لك بها حسنة ومحا عنك بها خطيئة ويرفع لك بها درجةً . وأما ركعتاك بعد الطواف فإنها كعتق رقبة من بني إسماعيل وأما طوافك …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 2851، يذكر كتابة الحسنات، ورفع الدرجات، وعمل يعدل عملا أعظم، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 2851, that speaks of the writing of good deeds, ranks raised, a deed that equals a greater one, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 2851 کا اقتباس جس میں نیکیوں کا لکھا جانا، درجات کی بلندی، ایک عمل جو بڑے عمل کے برابر ہے، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
