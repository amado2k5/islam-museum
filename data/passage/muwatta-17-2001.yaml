label: { ar: "الموطأ 2001 — مالك عن يحيى بن سعيد: سمع محمد بن المنكدر يقول: أحب الله عبدا سمحا إن باع، سمحا إن ابتاع، سمحا إن قضى، سمحا إن اقتضى", en: "Muwatta 2001", es: "Muwatta 2001", fr: "Muwatta 2001", ur: "موطا 2001", tr: "El-Muvatta 2001 — Malik, Yahya ibn Sa’id’den rivayetle, Muhammed ibn el-Munkadir’in şöyle dediğini işitti: Allah, satarken de, alırken de, öderken de, ödeme isterken de yumuşak huylu olan kulunu sever.", id: "Al-Muwatta 2001 — Malik, berdasarkan riwayat Yahya ibn Sa’id: Dia mendengar Muhammad ibn al-Munkadir berkata: Allah mencintai seorang hamba yang bersikap lunak ketika berjual beli, lunak ketika membeli, lunak ketika membayar, dan lunak ketika meminta pembayaran." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه سمع محمد بن المنكدر يقول: أحب الله عبدا سمحا، إن باع، سمحا إن ابتاع، سمحا إن قضى، سمحا إن اقتضى. {cite:muwatta-maruf-1997 p.219}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Muhammed ibn al-Munkadir'in şöyle dediğini işittiğini aktarır: \"Allah, satarken de, alırken de, öderken de, ödeme isterken de yumuşak huylu olan kulunu sever.\" {cite:muwatta-maruf-1997 s.219}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia mendengar Muhammad ibn al-Munkadir berkata: Allah mencintai seorang hamba yang bersikap lunak ketika berjual beli, lunak ketika membeli, lunak ketika membayar, dan lunak ketika meminta pembayaran. {cite:muwatta-maruf-1997 p.219}"
