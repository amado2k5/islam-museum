  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin 3. cildinin 545. sayfasından bir alıntı, bir vasiyetname veya son miras belgesinden ve miras olarak bıraktığı mal ve mal varlığından bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler için tarayıcı tarafından derlenmiştir."
