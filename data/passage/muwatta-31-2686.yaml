label: { ar: "الموطأ 2686 — جابر بن عبد الله: أغلقوا الباب وأوكوا السقاء وأطفئوا المصباح فإن الفويسقة تضرم البيت", en: "Muwatta 2686", es: "Muwatta 2686", fr: "Muwatta 2686", ur: "موطا 2686", tr: "El-Muvatta 2686 — Cabir ibn Abdullah: Kapıyı kapatın, su tulumunu bağlayın ve lambayı söndürün, çünkü o küçük yaratık evi ateşe verecektir.", id: "Al-Muwatta 2686 — Jabir ibn Abdullah: Tutup pintu, ikat kantung air, dan padamkan lampu, karena makhluk kecil itu akan membakar rumah." }
summary:
  ar: "يروي مالك عن أبي الزبير المكي عن جابر بن عبد الله أن رسول الله قال: أغلقوا الباب، وأوكوا السقاء، وأكفئوا الإناء أو خمّروا الإناء، وأطفئوا المصباح؛ فإن الشيطان لا يفتح غلقا، ولا يحل وكاء، ولا يكشف إناء، وإن الفويسقة ⁦(الفأرة)⁩ تضرم على الناس بيتهم. {cite:muwatta-maruf-1997 p.517}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den, o da Cabir ibn Abdullah'tan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: “Kapıyı kapatın, su tulumunu bağlayın, kabı ters çevirin veya örtün ve lambayı söndürün; çünkü şeytan kapalı bir kapıyı açamaz, bağlı bir su tulumunu çözemez veya bir kabın üzerini örtemez, hatta küçük bir fare bile insanların evlerini ateşe verebilir.” {cite:muwatta-maruf-1997 s.517}"
  id: "Malik meriwayatkan dari Abu al-Zubayr al-Makki, dari Jabir ibn Abdullah, bahwa Rasulullah SAW bersabda: “Tutuplah pintu, ikatlah kantung air, balikkanlah wadah atau tutuplah, dan padamkanlah lampu; karena setan tidak dapat membuka pintu yang tertutup, melepaskan ikatan kantung air, atau membuka wadah, dan bahkan tikus kecil pun dapat membakar rumah manusia.” {cite:muwatta-maruf-1997 p.517}"
