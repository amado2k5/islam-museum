label: { ar: "الموطأ 2686 — جابر بن عبد الله: أغلقوا الباب وأوكوا السقاء وأطفئوا المصباح فإن الفويسقة تضرم البيت", en: "Muwatta 2686" }
summary:
  ar: "يروي مالك عن أبي الزبير المكي عن جابر بن عبد الله أن رسول الله قال: أغلقوا الباب، وأوكوا السقاء، وأكفئوا الإناء أو خمّروا الإناء، وأطفئوا المصباح؛ فإن الشيطان لا يفتح غلقا، ولا يحل وكاء، ولا يكشف إناء، وإن الفويسقة (الفأرة) تضرم على الناس بيتهم. {cite:muwatta-maruf-1997 p.517}"
