text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا يَحْيَى، عَنِ الأَجْلَحِ، عَنِ الشَّعْبِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي الْخَلِيلِ، عَنْ زَيْدِ بْنِ أَرْقَمَ، قَالَ كُنْتُ عِنْدَ النَّبِيِّ وَعَلِيٌّ يَوْمَئِذٍ بِالْيَمَنِ فَأَتَاهُ رَجُلٌ فَقَالَ شَهِدْتُ عَلِيًّا أُتِيَ فِي ثَلاَثَةِ نَفَرٍ ادَّعَوْا وَلَدَ امْرَأَةٍ فَقَالَ عَلِيٌّ لأَحَدِهِمْ تَدَعُهُ لِهَذَا. فَأَبَى وَقَالَ لِهَذَا تَدَعُهُ لِهَذَا. فَأَبَى وَقَالَ لِهَذَا تَدَعُهُ لِهَذَا. …"
summary:
  ar: "حديث في سنن النسائي، رقم 3490، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3490 (The Book of Divorce), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 3490، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan al-Nasa'i, n.º 3490 (El Libro del Divorcio), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
