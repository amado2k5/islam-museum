text: "… بالسقف والحائط مسالة: ولا يقتل الصيد ولا يصيده ولا يشير إليه ولا بدل عليه حلالاً ولا حراماً فصل لا يحل للمحرم الإعانة على الصيد بشيء فصل يضمن المحرم الصيد بالدلالة فصل المحرم يدل محرماً على الصيد فصل المحرم يعير قاتل …"
summary:
