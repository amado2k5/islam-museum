label: { ar: "موطأ مالك 800 — المرض والمريض، الدواء", en: "Muwatta Malik 800 — illness and the sick; the drug", ur: "موطأ مالک 800 — بیماری اور بیمار، دوا" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّهُ قَالَ الْمُحْصَرُ بِمَرَضٍ لاَ يَحِلُّ حَتَّى يَطُوفَ بِالْبَيْتِ وَيَسْعَى بَيْنَ الصَّفَا وَالْمَرْوَةِ فَإِذَا اضْطُرَّ إِلَى لُبْسِ شَىْءٍ مِنَ الثِّيَابِ الَّتِي لاَ بُدَّ لَهُ مِنْهَا أَوِ الدَّوَاءِ صَنَعَ ذَلِكَ وَافْتَدَى."
summary:
  ar: "حديث في موطأ مالك، رقم 800، يذكر المرض والمريض، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 800 (Hajj), that mentions illness and the sick, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 800، جس میں بیماری اور بیمار، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
