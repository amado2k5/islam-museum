text: "… كما تدين تُدان أصاب الشيخ من أحد جيرانه ما أصاب قاضي قونية منه، فقد أوصى ذات يوم جاراً له على مقدارٍ من الزيت، فأخذ الرجل الزجاجة ووضع فيها بَولاً وجعل فوقه قليلاً من الزيت وبعث بها إلى الشيخ. وكانت امرأته …"
summary:
  ar: "أرسل جار إلى جحا قارورة قال إنها زيت وفيها بول، فقلت زوجة جحا بها الباذنجان فنتنت رائحته. ثم بدّل جحا علبتي نشوق وأعطى جاره نشوقاً من براز مجفف، فعطس الجار، فقال جحا: كما تدين تدان. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  en: "A neighbour sends Juha a bottle said to be oil but containing urine, and Juha's wife fries aubergines with it, which then stink. Later Juha swaps two snuff boxes and gives the neighbour a snuff made of dried dung. The neighbour sneezes, and Juha says, 'As you owe, so you are owed.' {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  ur: "ایک پڑوسی جحا کو ایک بوتل بھیجتا ہے جسے تیل بتایا جاتا ہے مگر اس میں پیشاب ہوتا ہے، اور جحا کی بیوی اس میں بینگن تل دیتی ہے تو بدبو آنے لگتی ہے۔ بعد میں جحا نسوار کی دو ڈبیاں بدل کر پڑوسی کو سوکھے فضلے کی نسوار دے دیتا ہے۔ پڑوسی چھینکتا ہے تو جحا کہتا ہے: جیسا کرو گے ویسا بھرو گے۔ {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  fr: "Un voisin envoie à Juha une bouteille censée contenir de l'huile mais pleine d'urine, et la femme de Juha y fait frire des aubergines, qui sentent mauvais. Plus tard, Juha échange deux tabatières et donne au voisin un tabac à priser fait d'excréments séchés. Le voisin éternue, et Juha dit : « Comme tu dois, on te doit. » {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  es: "Un vecino envía a Juha una botella que dice ser de aceite pero que contiene orina, y la esposa de Juha fríe berenjenas con ella, que huelen mal. Más tarde Juha cambia dos cajas de rapé y da al vecino un rapé hecho de excremento seco. El vecino estornuda, y Juha dice: «Como debes, así se te debe». {cite:juha-nawadir-kubra-djuwaydi p. 93}"
