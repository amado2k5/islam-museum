label: { ar: "سنن أبي داود 3210 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 3210 — a burial, grave or resting place", ur: "سنن ابی داؤد 3210 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 3210 — un lugar de entierro, tumba o descanso." }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الصَّبَّاحِ، أَخْبَرَنَا سُفْيَانُ، عَنِ ابْنِ خَالِدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي مُرَحَّبٍ، أَنَّ عَبْدَ الرَّحْمَنِ بْنَ عَوْفٍ، نَزَلَ فِي قَبْرِ النَّبِيِّ قَالَ كَأَنِّي أَنْظُرُ إِلَيْهِمْ أَرْبَعَةً."
summary:
  ar: "حديث في سنن أبي داود، رقم 3210، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3210 (Funerals (Kitab Al-Jana'iz)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3210، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3210 (Funerales (Kitab Al-Jana'iz)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
