text: |-
  قوله المريات يَصح أن بكون
  عو-دتيز وأن يكون بموحد
  وتحشية فالاولى المعمولة بالرب
  يضم الراء والشانية من التربية
  كما نقدّم فى صفحة ٥٤ يقال
  ذتيل مريب ومربى اه
  ١٦٤
  ⁦(باب الجيم)⁩
  للعجمة وان شئت حذفتها مشبج مشجت بينه-مامشجاخاطت والشئ مشيج والجمع
  امشاج مثل يتيم وابتام ويقال نطفة أمشاج لماء الرجل يختاط بماء المرأة ودمها قال زهم
  ابن حرام
  كأنّ النصل والفوقن منها خلال الريسْ سط به المسي
  ⁦( معبج)⁩ المعبج سرعة السير يقال معبج المار والرجح وفرس معوج على فعول وقد مزيمعج
  أى يمرّمراسهلا ومعج الفصيل ضرع أمه اذالهزه وقاب فأه فى نواحيه ليستمكن منه
  لج) الملج تناول الثدى بأدنى الفم يقال مل بىّ أمه أى رضعها وامتلج الفصيل
  مافى الضرع امتصه والاملاج الارضاع وفى الحديث لا تحزّم الاملاجة ولا الاملاجتان
  ومغه قيل للرجل ملجان ومصان أى أنه من لؤْمه يرضع الابل والمالج الذى يطين به قارسى
  معرّب وج ماج البحريموج موجا اضطر بت أمواجسه وكذلك الناس يوجون
  ⁦( مهج)⁩ المهجة الدم وحكى عن اعرابى أنه قال دقنت مهجته أى دمه ويقال المهح
  دم القلب خاصة ويقال خرجت مهجته اذاخرجت روحه وشهحم أمهج بالضم أى رقيق
  والامهجان بالضم اللبن الرقيق ولبن ماهيج اذا رق
  صل النون (ن ج أج فى الارض يناج ووجاذهب ونأجت الريح تنأج نتيها
  تحرّكت فهى نووج ولها تتيج أى مرّسربع مع صوت قال العجاج
  واتخذته النائحات منأجا تقول منه نتج القوم قال الراجز
  وتنأج الركبان كل منأج * به نتيج كل ريح سيهج
  ونأج الى اللّٰه تعالى فى الدعاء أى تضرّع ونائجات الهام صوائحها ( يج النباح الشديد
  الصوت وقال
  بأستاهنياجين شنج السواء-د ويقال أبص اللضخم الصوت من
  الكلاب إنه لتباج والنباجة الاست يق ل كذبت تاجتك اذا حبق والنداج بالضم الردام
  ونباج الكاب ونبيجه لغة فى النباح والنييح ركاب نباجى بالضم ضخ-م الصوت ءن اللحيانى
  والنباج باللكسر قرية بالبادية أحياهاء:-داللّٰه بن عامر والانيجات بكسر البا المربيات
  من الادوية وأظنه معر باومنيج اسم موضع قاذ انسبت اليه فتحت الباءقات كساء منيجانى
  أخرجوه تخرج مخبرانى ومنظر انى وعجين أنبجان أى مدرك منتفخ ولم يأت على ه-ذا البناء
  الاحرفان يوم أرونان وعمين أنيجان وهذا الحرف فى بعض السكتب بالها معمة وسماعى بالجيم
  عن أبى سعيد وأبى الغوث وغيرهما ن ج) تتجت النسافة على عالم يسم فاءلدتنتج نتاجاوقد
  تجها أهلهاتها قال الكميت
  وقال المدمر الساتجين • •قى ذمّرتبلى الارج-ل
  وأنتهجت الفرس اذاحان نتاجها وقال يعوب اذا اسبان جلها وكذلك الناقة فهى نتوج
  ولا يقال منتج وأنت الناقة على منتجها أى الوقت الذى تنتج فيه وهو مفعل بكسر العين
  ويقال للساتين اذا كاساسنا واحدة هما نتيجة وغنم ذلان نتائج أى فى سنّ واحدة ⁦( جج )⁩
  نحت القرحة تنج بالكسر نجيه إسالت بافيها قال جرير
  فان تك قرحة خبقت وتجت • قان اللّٰه يشقى من يشاء
