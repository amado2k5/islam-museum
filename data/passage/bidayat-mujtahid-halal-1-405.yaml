text: "… مَنْ كَانَ فَرْضُهُ الْإِطْعَامَ، فَلَيْسَ يَحْرُمُ عَلَيْهِ الْمَسِيسُ و قَبْلَ الْإِطْعَامِ، وَإِنَّمَا يَحْرُمُ الْمَسِيسُ عَلَى مَنْ كَانَ فَرْضُهُ الْعِتْقَ أَوِ الصِّيَامَ. تَمَّ كِتَابُ الظَّهَارِ، وَالْحَمْدُ للهِ. ينظر : المحلى بالآثار، وفيه: ولا يحل له أن يطأها، ولا أن يمسه بشيء …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 405، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 1, p. 405, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 1، ص 405 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
