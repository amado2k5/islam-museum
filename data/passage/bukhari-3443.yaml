label: { ar: "البخاري 3443 — أولى الناس بعيسى", en: "Bukhari 3443 — nearest to Isa", es: "Bukhari 3443 — más cercano a Isa", fr: "Bukhari 3443 — le plus proche d'Isa", ur: "بخاری 3443 - عیسیٰ کے قریب ترین", tr: "Buhari 3443 — İsa'ya en layık olan insanlar", id: "Al-Bukhari 3443 — Orang-orang yang paling layak menerima Yesus" }
text: "أنا أولى الناس بعيسى بن مريم في الدنيا والآخرة، والأنبياء إخوة لعلات، أمهاتهم شتى ودينهم واحد"
summary:
  ar: "في كتاب أحاديث الأنبياء باب أخبار عيسى؛ صياغة صلة النبي بعيسى: الأخوة النبوية على دين واحد مع اختلاف الأمهات — متن التواصل النبوي الذي يقوم عليه باب «قصص الأنبياء»."
  tr: "“Peygamberlerin Sözleri” kitabındaki İsa’nın kıssaları bölümünde; Peygamberin İsa ile olan bağlantısının formülasyonu: Farklı annelerden gelen tek bir dine mensup peygamber kardeşliği — “Peygamberlerin Kıssaları” bölümünün dayandığı peygamberlik mesajının metni."
  id: "Dalam buku “Ucapan Para Nabi,” bab tentang kisah-kisah Yesus; rumusan hubungan para Nabi dengan Yesus: persaudaraan kenabian dalam satu agama dengan ibu yang berbeda — teks komunikasi kenabian yang menjadi dasar bab “Kisah Para Nabi”."
