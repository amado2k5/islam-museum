label: { ar: "صحيح مسلم 4591 — الأب والأبوة", en: "Sahih Muslim 4591 — the father and fatherhood", ur: "صحیح مسلم 4591 — باپ اور والدیت" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أَبِي، هُرَيْرَةَ أَنَّهُ قَالَ بَيْنَا نَحْنُ فِي الْمَسْجِدِ إِذْ خَرَجَ إِلَيْنَا رَسُولُ اللَّهِ فَقَالَ \" انْطَلِقُوا إِلَى يَهُودَ \". فَخَرَجْنَا مَعَهُ حَتَّى جِئْنَاهُمْ فَقَامَ رَسُولُ اللَّهِ فَنَادَاهُمْ فَقَالَ \" يَا مَعْشَرَ يَهُودَ أَسْلِمُوا تَسْلَمُوا \". فَقَالُوا قَدْ بَلَّغْتَ يَا أَبَا الْقَاسِمِ. …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4591، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4591 (The Book of Jihad and Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4591، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
