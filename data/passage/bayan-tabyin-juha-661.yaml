text: "… الصِّبيان والمحرَّمِين من الأعراب، ونوادرَ كثيرةً من كلام المجانين وأهل المِرَّة من الموَسْوِسين، ومن كلام أهل الغفلةِ من النَّوْكَى، وأصحاب التكلّف من الحمقَى، فجعلنا بعضَها فى باب الاتعاظ والاعتبار، وبعضَها فى باب الهَزْل والفكاهة. ولكل جنسٍ من هذا موضع يصلح …"
