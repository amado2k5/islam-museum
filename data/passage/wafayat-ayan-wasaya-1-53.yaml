text: "بحلب ؛ وتوفي بها في سحر الخامس والعشرين! من جمادى الأولى سنة ثلاث وأربعين وستمائة، ودفن من يومه بتربته بالمقام المنسوب إلى إبراهيم الخليل، صلوات اللّٰه عليه وسلامه، و تعالى. يموت بن المزرَّع أبو بكر يموت بن المزرّع بن يموت …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 53، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
