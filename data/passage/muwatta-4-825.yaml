text: "نهى عن صيام يومين: يوم الفطر، ويوم الأضحى"
summary:
  ar: "أول حديث في باب صيام يوم الفطر والأضحى والدهر. يرويه مالك عن محمد بن يحيى بن حبان عن الأعرج عن أبي هريرة، أن النبي نهى عن صيام يومين: يوم الفطر ويوم الأضحى. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه أبو أحمد الحاكم، وروح بن عبادة عند أحمد، وسويد، والقعنبي، وابن وهب، وابن القاسم عند النسائي، ويحيى بن يحيى النيسابوري عند مسلم، وأنه سيأتي برقم (1103). {cite:muwatta-maruf-1997 p.403}"
  id: "Hadits pertama dalam bab tentang puasa pada hari raya Idul Fitri dan Idul Adha, dan sepanjang tahun. Diriwayatkan oleh Malik dari Muhammad ibn Yahya ibn Hibban, dari al-A'raj, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) melarang puasa pada dua hari: hari raya Idul Fitri dan hari raya Idul Adha. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Abu Ahmad al-Hakim, Rawh ibn 'Ubadah menurut Ahmad, Suwayd, al-Qa'nabi, Ibn Wahb, dan Ibn al-Qasim menurut al-Nasa'i, dan Yahya ibn Yahya al-Naysaburi menurut Muslim, dan akan muncul di bawah nomor (1103). {cite:muwatta-maruf-1997 p.403}"
