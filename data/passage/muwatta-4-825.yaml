text: "نهى عن صيام يومين: يوم الفطر، ويوم الأضحى"
summary:
  ar: "أول حديث في باب صيام يوم الفطر والأضحى والدهر. يرويه مالك عن محمد بن يحيى بن حبان عن الأعرج عن أبي هريرة، أن النبي نهى عن صيام يومين: يوم الفطر ويوم الأضحى. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه أبو أحمد الحاكم، وروح بن عبادة عند أحمد، وسويد، والقعنبي، وابن وهب، وابن القاسم عند النسائي، ويحيى بن يحيى النيسابوري عند مسلم، وأنه سيأتي برقم (1103). {cite:muwatta-maruf-1997 p.403}"
