text: "… • مممت ظفر بن أحد يقول حدثنى الحسن بن على قال حدتى أحد الوراق ثنا عبد الرحن بن حمد حدنى د بن عباس الشكتى قال سمعت الوركانى يقول أسلم يوم مات أحد بن حنبل مشرة آلاف من اليهود والنصارى والمجوس. …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 8، ص 180، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 8, p. 180, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
