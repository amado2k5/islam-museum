label: { ar: "سنن النسائي 838 — رفع الدرجات", en: "Sunan al-Nasa'i 838 — ranks raised", ur: "سنن نسائی 838 — درجات کی بلندی", es: "Sunan al-Nasa'i 838 - rangos elevados", fr: "Sunan al-Nasa'i 838 — rangs augmentés", tr: "Sunan an-Nasa'i 838 — Dereceleri Yükseltmek", id: "Sunan an-Nasa'i 838 — Menaikkan Derajat" }
text: "أَخْبَرَنَا قُتَيْبَةُ، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" صَلاَةُ الْجَمَاعَةِ أَفْضَلُ مِنْ صَلاَةِ أَحَدِكُمْ وَحْدَهُ خَمْسًا وَعِشْرِينَ جُزْءًا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 838، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 838 (The Book of Leading the Prayer (Al-Imamah)), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 838، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 838 (El Libro de la Oración (Al-Imamah)), que habla de rangos elevados. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 838 (Le Livre de la prière (Al-Imamah)), évoque l'élévation des grades. Le registre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de yer alan 838 numaralı hadis, mertebelerin yükseltilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 838, menyebutkan tentang menaikkan derajat. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
