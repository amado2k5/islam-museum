text: "… الجنازة كالجالس في بيته الراكب والردف سواء ما وطئا الراكب يسير خلف الجنازة الربا العجلان الربا بضع وسبعون باباً الربا سبعون حوباً أيسرها نكاح الربح بينهما ولا يلتفت إلى ضمانه الرقم الراوي القائل ابن مغفل ابن عمر الحسن عبد اللّٰه …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 9245، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 9245, that mentions faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 9245 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 9245, que menciona la fe como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 9245, qui décrit la foi comme une soixantaine de branches; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 9245. sayfasından bir alıntı, yetmişten fazla inanç dalından bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, inanç dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 2, halaman 9245, menyebutkan lebih dari tujuh puluh cabang iman; dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
