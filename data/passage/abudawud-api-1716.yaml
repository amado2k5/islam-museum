label: { ar: "سنن أبي داود 1716 — الحلال", en: "Sunan Abi Dawud 1716 — the lawful", ur: "سنن ابی داؤد 1716 — حلال", es: "Sunan Abi Dawud 1716 - lo lícito", fr: "Sunan Abi Dawud 1716 — le licite" }
text: "… فَجَاءَ بِهِ فَعَجَنَتْ وَنَصَبَتْ وَخَبَزَتْ وَأَرْسَلَتْ إِلَى أَبِيهَا فَجَاءَهُمْ فَقَالَتْ يَا رَسُولَ اللَّهِ أَذْكُرُ لَكَ فَإِنْ رَأَيْتَهُ لَنَا حَلاَلاً أَكَلْنَاهُ وَأَكَلْتَ مَعَنَا مِنْ شَأْنِهِ كَذَا وَكَذَا. فَقَالَ \" كُلُوا بِاسْمِ اللَّهِ \". فَأَكَلُوا فَبَيْنَمَا هُمْ مَكَانَهُمْ إِذَا غُلاَمٌ يَنْشُدُ اللَّهَ وَالإِسْلاَمَ الدِّينَارَ فَأَمَرَ رَسُولُ اللَّهِ فَدُعِيَ لَهُ فَسَأَلَهُ. فَقَالَ سَقَطَ مِنِّي فِي السُّوقِ. فَقَالَ النَّبِيُّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1716، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1716 (The Book of Lost and Found Items), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1716، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 1716 (El Libro de los Objetos Perdidos y Encontrados), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 1716 (Le Livre des objets trouvés et perdus), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
