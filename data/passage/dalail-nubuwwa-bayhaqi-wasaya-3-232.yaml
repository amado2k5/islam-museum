text: "… : يا رسول اللّٰه هو والله أبو ذرَّ، فقال رسول اللّٰه : يرحم اللّه أبا ذرَّ يمشي وحده، ويموتُ وحده، ويُبعث وحده. فضربَ الدهر من ضَرْبِه، وَسُيَّرَ أبو ذرَّ إلى الرَّبذّة، فلما حضره الموت أوصى إمرأته وغلامَهُ إذا مُت فاغسلاني …"
summary:
