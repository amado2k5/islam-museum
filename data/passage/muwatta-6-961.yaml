label: { ar: "الموطأ 961 — مالك: من أهل بالحج من مكة فليؤخر الطواف بالبيت والسعي بين الصفا والمروة حتى يرجع من منى، وكذلك صنع عبد الله بن عمر", en: "Muwatta 961", es: "Muwatta 961", fr: "Muwatta 961", ur: "موطا 961", tr: "El-Muvatta 961 — Malik: Mekke'den Hac için ihrama giren kimse, Kâbe tavafını ve Safa ile Merve arasındaki Sa'i'yi Mina'dan döndükten sonraya ertelemelidir. Abdullah ibn Ömer de aynı şekilde yapmıştır.", id: "Al-Muwatta 961 — Malik: Barang siapa memasuki keadaan ihram untuk haji dari Mekah, hendaklah ia menunda tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa hingga ia kembali dari Mina. Abdullah bin Umar pun melakukan hal yang sama." }
summary:
  ar: "قول يرويه يحيى عن مالك: من أهل بالحج من مكة فليؤخر الطواف بالبيت والسعي بين الصفا والمروة حتى يرجع من منى، وكذلك صنع عبد الله بن عمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1086) وسويد (500). {cite:muwatta-maruf-1997 p.457}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Mekke'den Hac için ihrama giren kimse, Kâbe tavafını ve Safa ile Merve arasındaki Sa'i'yi Mina'dan döndükten sonraya ertelemelidir. Abdullah ibn Ömer de aynı şekilde yapmıştır. Editör, bunun Malik'ten rivayetle Ebu Mus'ab (1086) ve Suveyd (500) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.457}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Barang siapa memasuki keadaan ihram untuk haji dari Mekah hendaknya menunda tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa hingga ia kembali dari Mina. Abdullah ibn Umar pun melakukan hal yang sama. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1086) dan Suwaid (500). {cite:muwatta-maruf-1997 p.457}"
