ref: "1982"
label: { ar: "سنن ابن ماجه 1982 — الأب والأبوة", en: "Sunan Ibn Majah 1982 — the father and fatherhood", ur: "سنن ابن ماجہ 1982 — باپ اور والدیت", es: "Sunan Ibn Majah 1982 — El padre y la paternidad", fr: "Sunan Ibn Majah 1982 — le père et la paternité", tr: "Sunan İbn Majah 1982 — Baba ve Babalık", id: "Sunan Ibn Majah 1982 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا حَفْصُ بْنُ عَمْرٍو، حَدَّثَنَا عُمَرُ بْنُ حَبِيبٍ الْقَاضِي، قَالَ حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ كُنْتُ أَلْعَبُ بِالْبَنَاتِ وَأَنَا عِنْدَ، رَسُولِ اللَّهِ ـ فَكَانَ يُسَرِّبُ إِلَىَّ صَوَاحِبَاتِي يُلاَعِبْنَنِي."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1982، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1982 (The Chapters on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1982، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1982 (Los capítulos sobre el matrimonio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1982 (Les chapitres sur le mariage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 1982 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1982, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
