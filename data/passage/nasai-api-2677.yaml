label: { ar: "سنن النسائي 2677 — ما حُرّم", en: "Sunan al-Nasa'i 2677 — what was made unlawful", ur: "سنن نسائی 2677 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 2677 — lo que se declaró ilícito" }
text: "… زُرَيْعٍ، قَالَ حَدَّثَنَا ابْنُ عَوْنٍ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ نَادَى النَّبِيَّ رَجُلٌ فَقَالَ مَا نَلْبَسُ إِذَا أَحْرَمْنَا قَالَ \" لاَ تَلْبَسِ الْقَمِيصَ وَلاَ الْعَمَائِمَ وَلاَ الْبَرَانِسَ وَلاَ السَّرَاوِيلاَتِ وَلاَ الْخِفَافَ إِلاَّ أَنْ لاَ يَكُونَ نِعَالٌ فَإِنْ لَمْ يَكُنْ نِعَالٌ فَخُفَّيْنِ دُونَ الْكَعْبَيْنِ وَلاَ ثَوْبًا مَصْبُوغًا بِوَرْسٍ أَوْ زَعْفَرَانٍ أَوْ مَسَّهُ وَرْسٌ أَوْ زَعْفَرَانٌ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2677، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2677 (The Book of Hajj), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2677، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2677 (El Libro del Hajj), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
