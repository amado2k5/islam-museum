text: "… وزهده فى الدنيا والكافر وحرصه عليها. فيما يتعلق بمعى، زاد فى المصباح : وقصره أشهر من المد. هذا وقد أورد الجوهرى فى الصحاح شرحاً جيداً هذا الحديث وهو أنه مثل، لأن المؤمن لا يأكل إلا من الحلال ويتوف الحرام والشبهة، …"
summary:
