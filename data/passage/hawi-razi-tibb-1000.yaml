text: "… بارد مفرد أو من بلغم لاصق بطبقاتها، قال: وإن كان البطن يختلف اختلافات رديئة بعقب أمراض وباء أو غيرها فلا تحبسه بالقوية جداً لأن حبسه بالقوية حميات وورماً في الكبد خاصة وفي سائر الأحشاء. الأعضاء، الأقربادين الكبير؛ صفة دواء المعجون …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1000، يذكر المرض والمريض، والحمى والوعك، والطاعون والوباء، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1000, that mentions illness and the sick, fever, plague and epidemic, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1000 کا اقتباس جس میں بیماری اور بیمار، بخار، طاعون اور وبا، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
