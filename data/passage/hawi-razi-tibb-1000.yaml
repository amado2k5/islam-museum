text: "… بارد مفرد أو من بلغم لاصق بطبقاتها، قال: وإن كان البطن يختلف اختلافات رديئة بعقب أمراض وباء أو غيرها فلا تحبسه بالقوية جداً لأن حبسه بالقوية حميات وورماً في الكبد خاصة وفي سائر الأحشاء. الأعضاء، الأقربادين الكبير؛ صفة دواء المعجون …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1000، يذكر المرض والمريض، والحمى والوعك، والطاعون والوباء، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1000, that mentions illness and the sick, fever, plague and epidemic, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1000 کا اقتباس جس میں بیماری اور بیمار، بخار، طاعون اور وبا، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 1000, que menciona la enfermedad y los enfermos, la fiebre, la peste y la epidemia, los órganos del cuerpo, el medicamento, los medicamentos y la farmacia; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 1000, qui mentionne la maladie et les malades, la fièvre, la peste et l'épidémie, les organes du corps, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 1000. sayfasından bir bölüm; hastalık ve hasta, ateş ve halsizlik, veba ve salgın, vücut parçaları, tıp, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 1000, yang menyebutkan penyakit dan pasien, demam dan rasa tidak enak badan, wabah dan epidemi, bagian tubuh, obat-obatan, narkoba dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
