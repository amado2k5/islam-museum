label: { ar: "صحيح البخاري 4638 — الأب والأبوة", en: "Sahih al-Bukhari 4638 — the father and fatherhood", ur: "صحیح بخاری 4638 — باپ اور والدیت", es: "Sahih al-Bukhari 4638 — El padre y la paternidad", fr: "Sahih al-Bukhari 4638 — Le père et la paternité", tr: "Sahih el-Buhari 4638 — Baba ve Babalık", id: "Sahih al-Bukhari 4638 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يُوسُفَ، حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرِو بْنِ يَحْيَى الْمَازِنِيِّ، عَنْ أَبِيهِ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ ـ قَالَ جَاءَ رَجُلٌ مِنَ الْيَهُودِ إِلَى النَّبِيِّ قَدْ لُطِمَ وَجْهُهُ وَقَالَ يَا مُحَمَّدُ إِنَّ رَجُلاً مِنْ أَصْحَابِكَ مِنَ الأَنْصَارِ لَطَمَ وَجْهِي. قَالَ \" ادْعُوهُ \". فَدَعَوْهُ قَالَ \" لِمَ لَطَمْتَ وَجْهَهُ \". قَالَ يَا رَسُولَ اللَّهِ، إِنِّي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4638، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4638 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4638، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4638 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4638 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 4638 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4638, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
