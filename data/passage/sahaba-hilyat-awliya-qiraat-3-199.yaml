text: "- - وأيوب السختيانى، وأبان بن لغلب، وأبو عمرو بن العلاء، ويزيد بن عبد اللّٰه ابن الهاد. وحدث عنه من الأئمة والأعلام : مالك بن أنس، وشعبة بن الحجاج، وسفيان الثودى، وابن جريج، وعبد اللّٰه بن ممر، وروح بن القاسم، …"
