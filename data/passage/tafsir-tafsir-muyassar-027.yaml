text: "ك على الحق وهم على الباطل، إنك حينئذ لمن الظالمين لأنفسهم. وهذا خطاب لجميع الأمة، وهو تهديد ووعيد لمن يتبع أهواء المخالفين لشريعة الإسلام. الجزء الثاني « سيقول ٱلسفهآء من ٱلناس ماولىهم عن قبلتهم ٱلتي كانا عليها قل لله ٱلمشرق"
