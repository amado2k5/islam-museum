text: "إن الله ورسوله حرم بيع الخمر والميتة والخنزير والأصنام"
summary:
  ar: "حديث جابر بن عبد الله أنه سمع رسول الله يقول عام الفتح وهو بمكة: «إن الله ورسوله حرم بيع الخمر والميتة والخنزير والأصنام» فقيل يا رسول الله أرأيت شحوم الميتة فإنه يطلى بها السفن ويدهن بها الجلود ويستصبح بها الناس قال لا هو حرام ثم قال عند ذلك «قاتل الله اليهود إن الله حرم عليهم الشحوم فأجملوه ثم باعوه فأكلوا ثمنه» — ثالث الأحاديث التي زادها ابن رجب؛ أخرجاه البخاري ⁦(2236، 4296، 4633)⁩ ومسلم (1581) من حديث يزيد بن أبي حبيب عن عطاء عن جابر وفي رواية لمسلم أن يزيد قال كتب إلي عطاء؛ ونقل ابن رجب عن ابن حجر أن وقوع «حرم» في الصحيحين بإسناد الفعل إلى ضمير الواحد أوجب للقرطبي أن يحمله على لطف الأدب إذ لم يجمع بين النبي واسم الله في ضمير الاثنين لأنه من نوع ما رد به على الخطيب في «ومن يعصهما» مع أن الرواة لم يتفقوا على ذلك — ففي بعض طرقه «إن الله حرم» بلا «ورسوله» وفي رواية ابن مردويه «إن الله ورسوله حرما» وصح عن أنس في النهي عن أكل الحمر الأهلية «إن الله ورسوله ينهيانكم» وفي رواية النسائي «ينهاكم» — والتحقيق عند ابن حجر جواز الإفراد لأن أمر النبي نشأ عن أمر الله كقوله تعالى «والله ورسوله أحق أن يرضوه» ⁦(جامع العلوم والحكم ص 871–880)⁩."
  en: "The hadith of Jabir ibn Abdullah that he heard the Messenger of God say in the year of the conquest at Mecca: 'God and His Messenger have forbidden the sale of wine, carrion, swine and idols' — and when asked about carrion fat used for greasing ships, oiling hides and giving people light, he said 'no, it is forbidden', then said 'God fight the Jews: God had forbidden them the fat, so they melted it, sold it and ate its price' — the third of Ibn Rajab's added hadiths, transmitted by al-Bukhari (2236, 4296, 4633) and Muslim (1581) through Yazid ibn Abi Habib from Ata' from Jabir, one of Muslim's routes having Yazid say 'Ata' wrote to me'; Ibn Rajab relays Ibn Hajar's note that 'forbade' (singular) occurs in the two Sahihs with the verb referred to a single pronoun, which al-Qurtubi carried on subtle courtesy — not coupling the Prophet with God's name in a dual pronoun, being of the kind by which the Khatib's 'whoever disobeys them' was answered — though the transmitters did not all agree: some routes read 'God forbade' without 'and His Messenger', Ibn Mardawayh's route reads the dual 'forbade both', Anas's sound report on domestic donkeys has 'God and His Messenger forbid you', and al-Nasa'i's route reads 'forbids you' — Ibn Hajar's conclusion being that the singular is permitted because the Prophet's command arises from God's command, as in His saying 'God and His Messenger are worthier that they please Him' (Jami' al-Ulum wal-Hikam pp. 871–880)."
  es: "El hadiz de Jabir ibn Abdullah que oyó al Mensajero de Dios decir en el año de la conquista de La Meca: 'Dios y Su Mensajero han prohibido la venta de vino, carroña, cerdos e ídolos', y cuando se le preguntó acerca de la grasa de carroña utilizada para engrasar barcos, aceitar pieles y dar luz a la gente, dijo 'no, está prohibido', luego dijo 'Dios luche contra los judíos: Dios les había prohibido la grasa, así que la fundieron, la vendieron y comieron su precio', el tercero de los hadices añadidos por Ibn Rajab, transmitido por al-Bukhari (2236, 4296, 4633) y Muslim (1581) a través de Yazid ibn Abi Habib de Ata' de Jabir, una de las rutas de Muslim tiene a Yazid diciendo 'Ata' me escribió'; Ibn Rajab transmite la nota de Ibn Hajar de que «prohibió» (singular) aparece en los dos Sahihs con el verbo referido a un pronombre único, que al-Qurtubi mantuvo por sutil cortesía —no vinculando al Profeta con el nombre de Dios en un pronombre dual, del tipo con el que se respondió al Khatib «quien los desobedezca»— aunque no todos los transmisores coincidieron: algunas rutas leen «Dios prohibió» sin «y Su Mensajero», la ruta de Ibn Mardawayh lee el dual «prohibió a ambos», el informe fiable de Anas sobre los asnos domésticos tiene «Dios y Su Mensajero os lo prohíben», y la ruta de al-Nasa'i lee «os lo prohíbe» —la conclusión de Ibn Hajar es que el singular está permitido porque el mandato del Profeta surge del mandato de Dios, como en Su dicho «Dios y Su Mensajero son más dignos que Él» (Jami' al-Ulum). wal-Hikam, págs. 871–880)."
  fr: "Le hadith de Jabir ibn Abdullah selon lequel il a entendu le Messager de Dieu dire l'année de la conquête de La Mecque: « Dieu et Son Messager ont interdit la vente de vin, de charogne, de porcs et d'idoles » — et lorsqu'on l'a interrogé sur la graisse de charogne utilisée pour graisser les navires, huiler les peaux et éclairer les gens, il a dit « non, c'est interdit », puis a dit « Dieu combat les Juifs: Dieu leur avait interdit la graisse, alors ils l'ont fondue, l'ont vendue et en ont mangé le prix » — le troisième des hadiths ajoutés par Ibn Rajab, transmis par al-Bukhari (2236, 4296, 4633) et Muslim (1581) par l'intermédiaire de Yazid ibn Abi Habib d'Ata' de Jabir, l'une des voies de Muslim faisant dire à Yazid « Ata' m'a écrit »; Ibn Rajab rapporte la note d'Ibn Hajar selon laquelle le verbe « interdire » (au singulier) apparaît dans les deux Sahihs avec un seul pronom, une formulation qu'al-Qurtubi a conservée par subtilité, n'associant pas le Prophète au nom de Dieu par un pronom duel. Cette formulation est similaire à celle employée pour répondre à l'interdiction du Khatib: « Quiconque leur désobéit ». Cependant, les transmetteurs ne sont pas tous d'accord: certaines versions portent « Dieu a interdit » sans « et Son Messager », la version d'Ibn Mardawayh porte le duel « il a interdit à tous deux », le hadith authentique d'Anas concernant les ânes domestiques dit « Dieu et Son Messager vous en interdisent », et la version d'al-Nasa'i porte « vous interdit ». Ibn Hajar conclut que le singulier est permis car le commandement du Prophète découle du commandement de Dieu, comme dans Sa parole: « Dieu et Son Messager sont plus dignes qu'ils Lui plaisent » (Jami' al-Ulum). wal-Hikam pp. 871–880)."
