label: { ar: "الأربعون 45 — حرم بيع الخمر والميتة والخنزير والأصنام", en: "Arba'un 45 — the sale of wine, carrion, swine and idols forbidden" }
text: "إن الله ورسوله حرم بيع الخمر والميتة والخنزير والأصنام"
summary:
  ar: "حديث جابر بن عبد الله أنه سمع رسول الله يقول عام الفتح وهو بمكة: «إن الله ورسوله حرم بيع الخمر والميتة والخنزير والأصنام» فقيل يا رسول الله أرأيت شحوم الميتة فإنه يطلى بها السفن ويدهن بها الجلود ويستصبح بها الناس قال لا هو حرام ثم قال عند ذلك «قاتل الله اليهود إن الله حرم عليهم الشحوم فأجملوه ثم باعوه فأكلوا ثمنه» — ثالث الأحاديث التي زادها ابن رجب؛ أخرجاه البخاري (2236، 4296، 4633) ومسلم (1581) من حديث يزيد بن أبي حبيب عن عطاء عن جابر وفي رواية لمسلم أن يزيد قال كتب إلي عطاء؛ ونقل ابن رجب عن ابن حجر أن وقوع «حرم» في الصحيحين بإسناد الفعل إلى ضمير الواحد أوجب للقرطبي أن يحمله على لطف الأدب إذ لم يجمع بين النبي واسم الله في ضمير الاثنين لأنه من نوع ما رد به على الخطيب في «ومن يعصهما» مع أن الرواة لم يتفقوا على ذلك — ففي بعض طرقه «إن الله حرم» بلا «ورسوله» وفي رواية ابن مردويه «إن الله ورسوله حرما» وصح عن أنس في النهي عن أكل الحمر الأهلية «إن الله ورسوله ينهيانكم» وفي رواية النسائي «ينهاكم» — والتحقيق عند ابن حجر جواز الإفراد لأن أمر النبي نشأ عن أمر الله كقوله تعالى «والله ورسوله أحق أن يرضوه» (جامع العلوم والحكم ص 871–880)."
  en: "The hadith of Jabir ibn Abdullah that he heard the Messenger of God say in the year of the conquest at Mecca: 'God and His Messenger have forbidden the sale of wine, carrion, swine and idols' — and when asked about carrion fat used for greasing ships, oiling hides and giving people light, he said 'no, it is forbidden', then said 'God fight the Jews: God had forbidden them the fat, so they melted it, sold it and ate its price' — the third of Ibn Rajab's added hadiths, transmitted by al-Bukhari (2236, 4296, 4633) and Muslim (1581) through Yazid ibn Abi Habib from Ata' from Jabir, one of Muslim's routes having Yazid say 'Ata' wrote to me'; Ibn Rajab relays Ibn Hajar's note that 'forbade' (singular) occurs in the two Sahihs with the verb referred to a single pronoun, which al-Qurtubi carried on subtle courtesy — not coupling the Prophet with God's name in a dual pronoun, being of the kind by which the Khatib's 'whoever disobeys them' was answered — though the transmitters did not all agree: some routes read 'God forbade' without 'and His Messenger', Ibn Mardawayh's route reads the dual 'forbade both', Anas's sound report on domestic donkeys has 'God and His Messenger forbid you', and al-Nasa'i's route reads 'forbids you' — Ibn Hajar's conclusion being that the singular is permitted because the Prophet's command arises from God's command, as in His saying 'God and His Messenger are worthier that they please Him' (Jami' al-Ulum wal-Hikam pp. 871–880)."
