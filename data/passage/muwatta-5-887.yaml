label: { ar: "الموطأ 887 — مالك: والمرأة المعتكفة أيضاً تُنكح نكاح الخطبة ما لم يكن المسيس", en: "Muwatta 887", es: "Muwatta 887", fr: "Muwatta 887", ur: "موطا 887", tr: "Al-Muwatta 887 — Malik: Tecrit halindeki bir kadın da, evliliğin henüz gerçekleşmemiş olması şartıyla, nişan yoluyla da evlendirilebilir.", id: "Al-Muwatta 887 — Malik: Seorang wanita yang hidup dalam pengasingan juga dapat dinikahkan melalui pertunangan, dengan syarat pernikahan tersebut belum disempurnakan." }
summary:
  ar: "قول لمالك: والمرأة المعتكفة أيضاً تُنكح نكاح الخطبة، ما لم يكن المسيس. ويذكر المحقق أنه رواه عن مالك أبو مصعب (884). {cite:muwatta-maruf-1997 p.426}"
  tr: "Malik şöyle demiştir: Tecrit halindeki bir kadın da, cinsel birleşme olmaması şartıyla, nişan yoluyla evlenebilir. Araştırmacı, bunu Ebu Mus'ab'ın (884) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.426}"
  id: "Malik berkata: Seorang wanita yang hidup dalam pengasingan juga dapat dinikahi melalui pertunangan, asalkan tidak terjadi hubungan suami istri. Peneliti menyebutkan bahwa Abu Mus'ab (884) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.426}"
