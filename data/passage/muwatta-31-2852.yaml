label: { ar: "الموطأ 2852 — عمر يرد عطاء النبي فيقول النبي إنما ذلك عن المسألة", en: "Muwatta 2852" }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن عطاء بن يسار أن رسول الله أرسل إلى عمر بن الخطاب بعطاء فرده عمر، فسأله النبي: لم رددته؟ فقال عمر: ألم تخبرنا أن خيرا لأحدنا ألا يأخذ من أحد شيئا؟ فقال النبي: إنما ذلك عن المسألة، فأما ما كان من غير مسألة فإنما هو رزق يرزقكه الله. فقال عمر: أما والذي نفسي بيده، لا أسأل أحدا شيئا، ولا يأتيني شيء من غير مسألة إلا أخذته. ويذكر المحقق قول ابن عبد البر أنه لا خلاف بين رواة الموطأ في إرسال الحديث، وأنه يتصل من وجوه ثابتة عن عمر. {cite:muwatta-maruf-1997 p.598}"
