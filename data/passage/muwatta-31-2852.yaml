label: { ar: "الموطأ 2852 — عمر يرد عطاء النبي فيقول النبي إنما ذلك عن المسألة", en: "Muwatta 2852", es: "Muwatta 2852", fr: "Muwatta 2852", ur: "موطا 2852", tr: "El-Muvatta 2852 — Ömer, Peygamber'in hediyesini reddeder ve Peygamber, \"Bu sadece isteğe karşılıktı\" der.", id: "Al-Muwatta 2852 — Umar menolak hadiah Nabi, dan Nabi berkata, \"Itu hanya sebagai tanggapan atas permintaan.\"" }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن عطاء بن يسار أن رسول الله أرسل إلى عمر بن الخطاب بعطاء فرده عمر، فسأله النبي: لم رددته؟ فقال عمر: ألم تخبرنا أن خيرا لأحدنا ألا يأخذ من أحد شيئا؟ فقال النبي: إنما ذلك عن المسألة، فأما ما كان من غير مسألة فإنما هو رزق يرزقكه الله. فقال عمر: أما والذي نفسي بيده، لا أسأل أحدا شيئا، ولا يأتيني شيء من غير مسألة إلا أخذته. ويذكر المحقق قول ابن عبد البر أنه لا خلاف بين رواة الموطأ في إرسال الحديث، وأنه يتصل من وجوه ثابتة عن عمر. {cite:muwatta-maruf-1997 p.598}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiğine göre, Allah Resulü Ömer ibn el-Hattab'a bir hediye gönderdi, fakat Ömer onu geri verdi. Peygamber ona, \"Neden geri verdin?\" diye sordu. Ömer, \"Bize, bir kimseden hiçbir şey almamak daha iyidir dememiş miydin?\" diye cevap verdi. Peygamber, \"Bu sadece istemek için geçerlidir. İstemeden gelen ise Allah'ın rızıklandırdığı bir şeydir.\" dedi. Ömer, \"Canım elinde olan Allah'a yemin ederim ki, kimseden hiçbir şey istemeyeceğim ve istemeden bana gelen hiçbir şeyi almayacağım.\" dedi. Araştırmacı, İbn Abd el-Barr'ın, Muvatta hadisinin mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğu ve Ömer'den gelen sahih rivayet zincirleriyle bağlantılı olduğu konusunda Muvatta ravileri arasında bir ihtilaf bulunmadığı yönündeki ifadesini aktarıyor. {cite:muwatta-maruf-1997 s.598}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, yang juga dari Ata ibn Yasar, bahwa Rasulullah mengirimkan hadiah kepada Umar ibn al-Khattab, tetapi Umar mengembalikannya. Nabi bertanya kepadanya, \"Mengapa kamu mengembalikannya?\" Umar menjawab, \"Bukankah engkau telah mengatakan kepada kami bahwa lebih baik bagi salah seorang dari kami untuk tidak mengambil apa pun dari siapa pun?\" Nabi bersabda, \"Itu hanya berlaku untuk meminta. Adapun apa yang datang tanpa meminta, itu adalah rezeki yang Allah berikan.\" Umar berkata, \"Demi Dia yang jiwaku berada di tangan-Nya, aku tidak akan meminta apa pun kepada siapa pun, dan tidak ada sesuatu pun yang akan datang kepadaku tanpa memintanya kecuali aku akan menerimanya.\" Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa tidak ada perbedaan pendapat di antara para perawi Muwatta mengenai hadits mursal (hadits dengan mata rantai yang hilang dalam periwayatan), dan bahwa hadits tersebut terhubung melalui rantai periwayatan yang sahih dari Umar. {mengutip:muwatta-maruf-1997 hal.598}"
