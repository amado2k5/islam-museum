label: { ar: "جامع الترمذي 2965 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 2965 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 2965 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 2965 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 2965 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، قَالَ سَمِعْتُ الزُّهْرِيَّ، يُحَدِّثُ عَنْ عُرْوَةَ، قَالَ قُلْتُ لِعَائِشَةَ مَا أَرَى عَلَى أَحَدٍ لَمْ يَطُفْ بَيْنَ الصَّفَا وَالْمَرْوَةِ شَيْئًا وَمَا أُبَالِي أَنْ لاَ أَطَّوَّفَ بَيْنَهُمَا. فَقَالَتْ بِئْسَمَا قُلْتَ يَا ابْنَ أُخْتِي طَافَ رَسُولُ اللَّهِ وَطَافَ الْمُسْلِمُونَ وَإِنَّمَا كَانَ مَنْ أَهَلَّ لِمَنَاةَ الطَّاغِيَةِ الَّتِي بِالْمُشَلَّلِ لاَ يَطُوفُونَ بَيْنَ الصَّفَا وَالْمَرْوَةِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2965، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2965 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 2965، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2965 (Capítulos sobre Tafsir), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2965 (Chapitres sur le Tafsir), mentionne les nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, religions, sectes et peuples non musulmans."
