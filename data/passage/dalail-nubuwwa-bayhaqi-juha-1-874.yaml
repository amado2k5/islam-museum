text: "… يردوا عليَّ مالي فكان أول ما خبر من صلابة حكمه وعدله أن قال لَتَرُدُنَّ عليه ماله أو لَيُجْعَلَنَّ غلامه يده في يده فليذهبن به حيث شاء فقالوا بل نعطيه ماله محمق : الذي يلد الحمقى. مرج : قلق واضطرب. من …"
