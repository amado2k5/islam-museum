text: "… إذا أخفيت الصوت فماذا تفعل بالرائحة؟ كان أحدهم جالساً عند الشيخ، فخرج من الرجل صوت فخجل وأخذ يضرب الخشب برجله لكي يُخفي الصوت. فقال له الشيخ: إذ أخفيت الصوت فماذا تفعل بالرائحة؟ أُبشِّرُكُمْ بأنثاه كان في جيش تيمورلنك كثيرٌ من …"
summary:
  ar: "أخرج رجل ريحًا وأخفى صوتها بنقر قدمه على الخشب؛ فقال جحا إنه إن أخفى الصوت فماذا يفعل بالرائحة. {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  en: "A man breaks wind and hides the noise by tapping his foot on wood; Juha says if you hide the sound, what will you do about the smell? {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  ur: "ایک آدمی نے ہوا خارج کی اور پاؤں سے لکڑی پر ٹھک ٹھک کر کے آواز چھپانے کی کوشش کی؛ جحا نے کہا کہ اگر تم نے آواز چھپا لی تو بو کا کیا کرو گے؟ {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  fr: "Un homme lâche un vent et masque le bruit en tapant du pied sur du bois; Juha dit que si l'on cache le son, que fera-t-on de l'odeur ? {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  es: "Un hombre se tira un pedo y disimula el ruido golpeando el pie sobre madera; Juha dice que, si ocultas el sonido, qué harás con el olor. {cite:juha-nawadir-kubra-djuwaydi p. 91}"
  tr: "Bir adam osurdu ve sesi gizlemek için ayağını tahtaya vurdu. Juha, sesi gizleyebiliyorsa kokuyu nasıl gizleyeceğini sordu. {cite:juha-nawadir-kubra-djuwaydi s. 91}"
  id: "Seorang pria kentut dan mencoba menyembunyikan suaranya dengan mengetuk-ngetuk kakinya di kayu. Juha berkomentar bahwa jika dia bisa menyembunyikan suaranya, apa yang akan dia lakukan dengan baunya? {cite:juha-nawadir-kubra-djuwaydi p. 91}"
