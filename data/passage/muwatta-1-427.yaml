summary:
  ar: "بلاغ في باب الرخصة في المرور بين يدي المصلي: يروي مالك أنه بلغه أن سعد بن أبي وقاص كان يمر بين يدي بعض الصفوف والصلاة قائمة؛ ويقول مالك إنه يرى ذلك واسعاً إذا أقيمت الصلاة وبعد أن يُحرم الإمام ولم يجد المرء مدخلاً إلى المسجد إلا بين الصفوف. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.222}"
