label: { ar: "الموطأ 427 — بلاغ: سعد يمر بين يدي بعض الصفوف والصلاة قائمة، ومالك يراه واسعاً", en: "Muwatta 427", es: "Muwatta 427", fr: "Muwatta 427", ur: "موطا 427", tr: "El-Muvatta 427 — Rivayet: Sa'd, namaz kılınırken bazı safların önünden geçti ve Malik orayı geniş buldu.", id: "Al-Muwatta 427 — Riwayat: Sa'd lewat di depan beberapa barisan ketika salat sedang berlangsung, dan Malik menganggap tempat itu lapang." }
summary:
  ar: "بلاغ في باب الرخصة في المرور بين يدي المصلي: يروي مالك أنه بلغه أن سعد بن أبي وقاص كان يمر بين يدي بعض الصفوف والصلاة قائمة؛ ويقول مالك إنه يرى ذلك واسعاً إذا أقيمت الصلاة وبعد أن يُحرم الإمام ولم يجد المرء مدخلاً إلى المسجد إلا بين الصفوف. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.222}"
  tr: "Namaz kılan birinin önünden geçmenin caiz olup olmadığına dair bir rivayet: Malik, Sa'd ibn Abi Waqqas'ın namaz kılınırken bazı cemaat saflarının önünden geçtiğini duyduğunu rivayet eder. Malik, namaz başlamış ve imam namaza başlamışsa ve camiye girmenin saflar arasından geçmekten başka bir yolu yoksa bunun caiz olduğunu söyler. Araştırmacı, bunu Malik'ten Ebu Mus'ab ve Suwaid'in rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.222}"
  id: "Sebuah riwayat mengenai kebolehan melewati di depan orang yang sedang shalat: Malik meriwayatkan bahwa ia mendengar bahwa Sa'd ibn Abi Waqqas biasa melewati di depan beberapa barisan jamaah ketika shalat sedang berlangsung. Malik mengatakan bahwa ia menganggap hal ini diperbolehkan jika shalat telah dimulai dan imam telah memulai shalat, dan jika seseorang tidak menemukan jalan lain untuk memasuki masjid kecuali di antara barisan jamaah. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.222}"
