text: "… أبو بكر أبن عَيَّاش عن ألى سعيد البَقال من عكرمة عن أبن عبّاس عن النبى صلعم مثلة ه م وقد روى عن النبى صلعم أن الله خلق الجبال يرم الاحد والشجر يوم الاثنين وخلق المكروه يوم الثلثاء والنور يوم الاربعاء، …"
summary:
  ar: "مقطع من تاريخ الطبري، المجلد المصوَّر 2، ص 58، يرد فيه ذكر المكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Tabari's History, scan volume 2, p. 58, whose wording mentions the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ طبری، اسکین جلد 2، ص 58 کا اقتباس جس میں مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de al-Tabari, volume numérisé 2, p. 58, dont le texte mentionne le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de al-Tabari, volumen digitalizado 2, p. 58, cuyo texto menciona lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Taberi'nin Resimli Tarih adlı eserinin 2. cildinin 58. sayfasından bir alıntı, hoş karşılanmayan fiillerden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, hoş karşılanmayan fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sejarah Al-Tabari, Jilid 2 Bergambar, halaman 58, menyebutkan perbuatan yang tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks tersebut disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
