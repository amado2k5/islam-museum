text: "… هذا رأس حماري سُرِق مقودُ حماره المزينُ بالودع، فقبض على أذُنَيْ الحمار وذهب به إلى البيت، وبعد يومين رأى نفس ذلك المقود برأس حمارٍ كبيرٍ فعجب من ذلك، وقال: هذا الرأس رأس حماري، ولكن كيف تبدّل جسمه؟ أنت لا تسألني …"
summary:
  ar: "سُرق رسن حمار جحا، ثم رأى الرسن نفسه على رأس حمار أكبر، فقال إن الرأس لحماره، لكن كيف تغيّر الجسم. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  en: "Juha's donkey's halter is stolen; he later sees the same halter on the head of a larger donkey and says 'this head is my donkey's, but how did its body change?' {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  ur: "جحا کے گدھے کی لگام چوری ہو گئی؛ بعد میں اس نے وہی لگام ایک بڑے گدھے کے سر پر دیکھی اور کہا کہ یہ سر تو میرے گدھے کا ہے، مگر اس کا جسم کیسے بدل گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  fr: "Le licou de l'âne de Juha est volé; plus tard, il voit le même licou sur la tête d'un âne plus grand et dit: «Cette tête est celle de mon âne, mais comment son corps a-t-il changé ?» {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  es: "Le roban el cabestro al burro de Juha; más tarde ve el mismo cabestro en la cabeza de un burro más grande y dice: «Esta cabeza es la de mi burro, pero ¿cómo cambió su cuerpo?» {cite:juha-nawadir-kubra-djuwaydi p. 83}"
