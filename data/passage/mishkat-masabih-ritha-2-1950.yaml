  id: "Cuplikan dari Mishkat al-Masabih, Jilid Bergambar 2, hlm. 1950, berisi obituari dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan obituari paling terkenal."
