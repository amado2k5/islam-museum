text: "… نزل الحجر الأسود من الجنة نزل جبريل فأمني، فصليت معه نزل القرآن على خمسة أوجه نصب المنجنيق على أهل الطائف نصرت بالصبا وأهلكت عاد بالدبور. نضر اللّٰه أمرءأ سمع منا شيئا فبلفه - نضر اللّٰه عبداً سمع مقالتي فحفظم نعى …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 1950، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Mishkat al-Masabih, scan volume 2, p. 1950, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "مشکوٰۃ المصابیح، اسکین جلد 2، ص 1950 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
