text: "إذا اختلفتم أنتم وزيد بن ثابت في شيء من القرآن فاكتبوه بلسان قريش فإنما نزل بلسانهم، ففعلوا حتى إذا نسخوا الصحف في المصاحف رد عثمان الصحف إلى حفصة وأرسل إلى كل أفق بمصحف مما نسخوا وأمر بما سواه من القرآن في كل صحيفة أو مصحف أن يحرق"
summary:
  ar: "في كتاب فضائل القرآن؛ إنذار حذيفة من أذربيجان، واستعارة صحف حفصة، ولجنة الأربعة، وأمر قريش بلسانها، وإرسال المصاحف إلى الأمصار وإحراق ما سواها — نص توحيد المصحف كاملاً."
  tr: "\"Kur'an'ın Faziletleri\" adlı kitapta, Hudeyfe'nin Azerbaycan'dan uyarısı, Hafsa'nın el yazmalarının ödünç alınması, Dörtlü Komite, Kureyş'in kendi dilindeki emri, Kur'anların şehirlere gönderilmesi ve diğerlerinin yakılması - Kur'an'ın birleştirilmesinin tam metni yer almaktadır."
  id: "Dalam buku Keutamaan Al-Qur'an: Peringatan Hudhayfah dari Azerbaijan, meminjam gulungan Hafsa, Komite Empat, perintah Quraisy dalam bahasa mereka, mengirim Al-Qur'an ke kota-kota dan membakar semua yang lain — teks lengkap penyatuan Al-Qur'an."
