label: { ar: "البخاري 4987 — نسخ المصاحف في خلافة عثمان", en: "Bukhari 4987 — Uthman's standard copies" }
text: "إذا اختلفتم أنتم وزيد بن ثابت في شيء من القرآن فاكتبوه بلسان قريش فإنما نزل بلسانهم، ففعلوا حتى إذا نسخوا الصحف في المصاحف رد عثمان الصحف إلى حفصة وأرسل إلى كل أفق بمصحف مما نسخوا وأمر بما سواه من القرآن في كل صحيفة أو مصحف أن يحرق"
summary:
  ar: "في كتاب فضائل القرآن؛ إنذار حذيفة من أذربيجان، واستعارة صحف حفصة، ولجنة الأربعة، وأمر قريش بلسانها، وإرسال المصاحف إلى الأمصار وإحراق ما سواها — نص توحيد المصحف كاملاً."
