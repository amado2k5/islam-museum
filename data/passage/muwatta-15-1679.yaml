label: { ar: "الموطأ 1679 — سعيد بن المسيب عن عمر بن الخطاب: أيما امرأة فقدت زوجها فلم تدر أين هو، تنتظر أربع سنين، ثم تعتد أربعة أشهر وعشرا، ثم تحل", en: "Muwatta 1679", es: "Muwatta 1679", fr: "Muwatta 1679", ur: "موطا 1679", tr: "El-Muvatta 1679 — Sa’id ibn al-Musayyab, Ömer ibn al-Khattab'dan rivayetle: Kocasını kaybeden ve nerede olduğunu bilmeyen bir kadın, dört yıl bekler, sonra dört ay on gün daha bekler, ardından yeniden evlenmekte özgürdür.", id: "Al-Muwatta 1679 — Sa’id ibn al-Musayyab berdasarkan riwayat Umar ibn al-Khattab: Wanita mana pun yang kehilangan suaminya dan tidak mengetahui keberadaannya, menunggu selama empat tahun, kemudian menjalani masa iddah selama empat bulan sepuluh hari, setelah itu ia bebas untuk menikah lagi." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سعيد بن المسيب أن عمر بن الخطاب قال أيما امرأة فقدت زوجها فلم تدر أين هو، فإنها تنتظر أربع سنين، ثم تعتد أربعة أشهر وعشرا، ثم تحل. {cite:muwatta-maruf-1997 p.88}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle Ömer ibn al-Khattab'ın şöyle dediğini nakletmiştir: \"Kocasını kaybeden ve nerede olduğunu bilmeyen kadın dört yıl beklemeli, sonra dört ay on gün daha beklemelidir; ondan sonra yeniden evlenebilir.\" {cite:muwatta-maruf-1997 s.88}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa Umar ibn al-Khattab berkata: \"Wanita mana pun yang kehilangan suaminya dan tidak mengetahui di mana suaminya berada, ia harus menunggu empat tahun, kemudian menjalani masa iddah selama empat bulan sepuluh hari, setelah itu ia bebas untuk menikah lagi.\" {cite:muwatta-maruf-1997 p.88}"
