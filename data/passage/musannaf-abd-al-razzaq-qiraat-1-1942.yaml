text: "… قال : نعم، إذا وضعت زكاتك في صنف واحد، أَو صنفين، أَو ثلاثة، ولو كانت كثيرة أَمرته أَن يجعلها فيهن كلهن. - عبد الرزاق عن ابن مجاهد عن أَبيه عن ابن عباس قال : إذا وضعتها في صنف واحد من …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 1942، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 1942, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 1942 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Abd al-Razzaq, volumen 1, pág. 1942, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Musannaf d'Abd al-Razzaq (tome 1, p. 1942) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Abdülrazzak'ın Resimli Musannaf adlı eserinin 1. cildinin 1942. sayfasındaki bir alıntıda Kur'an okuyucularından bahsedilmektedir; makine tarafından okunabilir taranmış versiyonda, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, hlm. 1942, menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
