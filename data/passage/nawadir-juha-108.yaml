text: "… مسافة تسعة أشهر بخمسة أيام وُلِدَ له مولودٌ في اليوم الخامس مِنْ زواجهِ، ففي اليوم التالي أحضرَ جزءَ ألف باء وأدواتِ الكتابةِ، ووضعَ هذه الأشياء عند رأس الطفلِ جِذاء اللفافة. فقالوا : ما هذا ؟ فأجابهم : إِنّ مَنْ يقطعُ …"
summary:
  ar: "وُلد ابن جحا في اليوم الخامس من زواجه، فأتى الرضيع بالأبجدية وأدوات الكتابة وقال إن من يقطع تسعة أشهر في خمسة أيام سيذهب إلى المدرسة قريبًا. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  en: "Juha's son is born on the fifth day of his marriage; Juha brings the alphabet and writing tools to the baby, saying that one who covers nine months in five days will go to school soon. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  ur: "جحا کے شادی کے پانچویں دن اس کا بیٹا پیدا ہوا؛ جحا نے نومولود کے پاس حروف تہجی اور لکھنے کا سامان لا رکھا اور کہا کہ جو نو مہینے پانچ دن میں طے کر لے وہ جلد مدرسے جائے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  fr: "Le fils de Juha naît le cinquième jour de son mariage ; Juha apporte au bébé l'alphabet et du matériel d'écriture, disant que celui qui parcourt neuf mois en cinq jours ira bientôt à l'école. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
  es: "El hijo de Juha nace el quinto día de su matrimonio; Juha le lleva al bebé el alfabeto y útiles de escritura, diciendo que quien recorre nueve meses en cinco días irá pronto a la escuela. {cite:juha-nawadir-kubra-djuwaydi p. 52}"
