label: { ar: "الموطأ 2364 — مالك: لا يباع المدبر، ولا يحول عن موضعه، والدين لا يبيعه في حياة السيد", en: "Muwatta 2364" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في المدبر أن صاحبه لا يبيعه، ولا يحوله عن موضعه الذي وضعه فيه. وإن أرهق سيده دين، فإن غرماءه لا يقدرون على بيعه ما عاش سيده. فإن مات سيده ولا دين عليه فهو في ثلثه، لأنه استثنى عمله ما عاش، فليس له أن يخدمه حياته ثم يعتقه على ورثته من رأس ماله. {cite:muwatta-maruf-1997 p.374}"
