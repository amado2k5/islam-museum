label: { ar: "الموطأ 2364 — مالك: لا يباع المدبر، ولا يحول عن موضعه، والدين لا يبيعه في حياة السيد", en: "Muwatta 2364", es: "Muwatta 2364", fr: "Muwatta 2364", ur: "موطا 2364", tr: "El-Muvatta 2364 — Malik: Efendisinin ölümünden sonra özgürlüğüne kavuşacağı vaat edilen köle satılamaz, yerinden oynatılamaz ve efendisi hayatta olduğu sürece borç satılamaz.", id: "Al-Muwatta 2364 — Malik: Seorang budak yang telah dijanjikan kebebasan setelah kematian tuannya tidak dapat dijual, tidak dapat dipindahkan dari tempatnya, dan hutang tidak dapat dijual selama tuannya masih hidup." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في المدبر أن صاحبه لا يبيعه، ولا يحوله عن موضعه الذي وضعه فيه. وإن أرهق سيده دين، فإن غرماءه لا يقدرون على بيعه ما عاش سيده. فإن مات سيده ولا دين عليه فهو في ثلثه، لأنه استثنى عمله ما عاش، فليس له أن يخدمه حياته ثم يعتقه على ورثته من رأس ماله. {cite:muwatta-maruf-1997 p.374}"
  tr: "Malik şöyle dedi: Bizde mudabbar (özgürlüğü efendisinin ölümüne bağlı olan köle) ile ilgili yerleşik uygulama şudur: Sahibi onu satamaz, bulunduğu yerden de başka bir yere taşıyamaz. Efendisi borçluysa, efendisi yaşadığı sürece alacaklıları onu satamaz. Efendisi borçsuz ölürse, köle mirasın üçte birine dahil edilir, çünkü efendi kölenin hizmetlerinin ömrü boyunca devam edeceğine dair şart koşmuştur. Bu nedenle, efendi kölenin hizmetlerinden ömrü boyunca yararlanıp sonra onu mirasçılarına mirasından pay olarak veremez. {cite:muwatta-maruf-1997 s.374}"
  id: "Malik berkata: Praktik yang berlaku di antara kita mengenai seorang mudabbar (budak yang kebebasannya bergantung pada kematian tuannya) adalah bahwa pemiliknya tidak dapat menjualnya, atau memindahkannya dari tempat ia ditempatkan. Jika tuannya terbebani hutang, para kreditornya tidak dapat menjualnya selama tuannya masih hidup. Jika tuannya meninggal tanpa hutang, budak tersebut termasuk dalam sepertiga harta warisannya, karena ia menetapkan bahwa jasa budak tersebut akan berlanjut seumur hidupnya. Oleh karena itu, ia tidak dapat menggunakan jasa budak tersebut seumur hidupnya dan kemudian membebaskannya untuk ahli warisnya dari harta warisannya. {cite:muwatta-maruf-1997 p.374}"
