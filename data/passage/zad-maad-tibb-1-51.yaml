text: "… : كان إذا عرّس بالليل، توسد يمينه، وإذا عرَّس قبيل الصبح، نصب ساعده. وأظن هذا وهماً، والصواب حديث الترمذي. وقال أبو حاتم: والتعريس إنما يكون قُبيل الصبح. وكان نومه أعدلَ النوم، وهو أنفع ما يكون من النوم، والأطباء يقولون: هو …"
