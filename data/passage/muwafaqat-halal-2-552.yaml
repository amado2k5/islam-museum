text: "… في المأمورات، ومنها ما يكون من المحرمات أو من المكروهات في المنهيات. لكنها وُكِلت إلى أنظار المكلفين ليجتهدوا في نحو هذه الأمور. كان الناس من السلف الصالح يتوقفون عن الجزم بالتحريم، ويتحرجون عن أن يقولوا : حلال أو حرام، هكذا …"
