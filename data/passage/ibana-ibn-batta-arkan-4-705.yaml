text: "… يده في فيه - حتى يؤمن بالقدر، ويعلم أنه ميت وأنه مبعوث. - حدثنا أحمد بن القاسم، قال: حدثنا الدبري، قال: حدثنا عبدالرزاق، عن معمر، عن قتادة، عن ابن مسعود مل قال: ثلاثٌ من كنَّ فيه يجد بهنَّ حلاوة الإيمان: …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 4، ص 705، يذكر الإيمان بالقدر، وحلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 4, p. 705, that mentions belief in the decree, the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 4، ص 705 کا اقتباس جس میں تقدیر پر ایمان، ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe de Ibn Batta, volumen 4, pág. 705, que menciona la creencia en el decreto, la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, caracterizan la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Livre de la Foi), volume 4, page 705, mentionnant la croyance au décret, la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı), Resimli Cilt 4, sayfa 705'ten, kader inancı, imanın tatlılığı ve mükemmelliği ile iman sahibi olanların niteliklerini ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 4 Bergambar, hlm. 705, yang membahas tentang kepercayaan pada takdir, kemanisan dan kesempurnaan iman, dan sifat-sifat orang yang memilikinya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
