label: { ar: "الموطأ 746 — مالك: النخل بين رجلين يجذان منها ثمانية أوسق لا صدقة عليهما، والصدقة على من بلغ نصيبه خمسة أوسق", en: "Muwatta 746", es: "Muwatta 746", fr: "Muwatta 746", ur: "موطا 746", tr: "El-Muvatta 746 — Malik: İki adam bir hurma ağacını paylaşır ve sekiz vask (kuru ölçü birimi) hasat ederlerse, onlardan zekât düşmez. Kimin payı beş vaska ulaşırsa ondan zekât düşer.", id: "Al-Muwatta 746 — Malik: Dua orang berbagi pohon kurma dan memanen delapan wasq (satuan ukuran kering) darinya, dan tidak ada zakat yang wajib dibayarkan oleh mereka. Zakat wajib dibayarkan oleh siapa pun yang bagiannya mencapai lima wasq." }
summary:
  ar: "قول لمالك في النخل يكون بين الرجلين فيجذان منها ثمانية أوسق من التمر: أنه لا صدقة عليهما فيها؛ وإن كان لأحدهما ما يجذ منه خمسة أوسق وللآخر ما يجذ أربعة أوسق أو أقل في أرض واحدة، كانت الصدقة على صاحب الخمسة الأوسق وليس على صاحب الأربعة صدقة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.370} {cite:muwatta-maruf-1997 p.371}"
  tr: "Malik, iki adamın ortak mülkiyetinde olan ve sekiz vask hurma hasat ettikleri bir hurma ağacı hakkında şöyle demiştir: \"Bu ağaçtan zekât ödemekle yükümlü değillerdir. Ancak, aynı arazide birisi beş vask, diğeri dört vask veya daha az hurma hasat ederse, zekât beş vask hasat edenden alınır, dört vask hasat edenden değil.\" Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.370} {cite:muwatta-maruf-1997 s.371}"
  id: "Malik berkata mengenai pohon kurma yang dimiliki bersama oleh dua orang, yang darinya mereka memanen delapan wasq kurma: Mereka tidak wajib membayar zakat atasnya. Namun, jika salah satu dari mereka memanen lima wasq dan yang lain memanen empat wasq atau kurang di lahan yang sama, maka zakat wajib dibayarkan oleh yang memanen lima wasq, bukan yang memanen empat wasq. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.370} {cite:muwatta-maruf-1997 p.371}"
