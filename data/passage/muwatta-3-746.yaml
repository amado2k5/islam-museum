label: { ar: "الموطأ 746 — مالك: النخل بين رجلين يجذان منها ثمانية أوسق لا صدقة عليهما، والصدقة على من بلغ نصيبه خمسة أوسق", en: "Muwatta 746" }
summary:
  ar: "قول لمالك في النخل يكون بين الرجلين فيجذان منها ثمانية أوسق من التمر: أنه لا صدقة عليهما فيها؛ وإن كان لأحدهما ما يجذ منه خمسة أوسق وللآخر ما يجذ أربعة أوسق أو أقل في أرض واحدة، كانت الصدقة على صاحب الخمسة الأوسق وليس على صاحب الأربعة صدقة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.370} {cite:muwatta-maruf-1997 p.371}"
