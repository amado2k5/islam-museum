label: { ar: "صحيح مسلم 5218 — الحرام", en: "Sahih Muslim 5218 — the unlawful", ur: "صحیح مسلم 5218 — حرام", es: "Sahih Muslim 5218 — lo ilícito", fr: "Sahih Muslim 5218 — l'illicite", tr: "Sahih Müslim 5218 — Mescid-i Haram", id: "Sahih Muslim 5218 — Al-Haram" }
text: "حَدَّثَنَا أَبُو الرَّبِيعِ الْعَتَكِيُّ، وَأَبُو كَامِلٍ قَالاَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، حَدَّثَنَا أَيُّوبُ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ \" كُلُّ مُسْكِرٍ خَمْرٌ وَكُلُّ مُسْكِرٍ حَرَامٌ وَمَنْ شَرِبَ الْخَمْرَ فِي الدُّنْيَا فَمَاتَ وَهُوَ يُدْمِنُهَا لَمْ يَتُبْ لَمْ يَشْرَبْهَا فِي الآخِرَةِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5218، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 5218 (The Book of Drinks), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 5218، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 5218 (El Libro de las Bebidas), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 5218 (Le Livre des Boissons), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 5218 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve haram sözlüğünün bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alınan metinleri bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5218, menyebutkan apa yang diharamkan. Bagian kamus halal dan haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
