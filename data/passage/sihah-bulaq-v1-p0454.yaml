text: |-
  (فصل الفاء
  ١٨٧
  صمام ولا غلاف وهو فعل بعنى مفعول واستفتحت الذى وافتتحته والاستفتاح الاستنصار
  والمفتاح مفتاح الباب وكل.ستغلق والجمع مفاقيح و. فاتح أيضا قال الاخفس هو مشل
  قولهم أمانى وأمانى يخفف ويشددوالفتح النصر والفتح الماءيجرى من عين أوغيرها وفاتحة
  الشئ أوّله والفتاح الحاكم وققول افتح بيننا أى احكم والفتاحة بالضم الحسكم والفتوح مز
  النوق الواسعة الاحليل تقول منه قتحت الناقة وأفتحت فعل وأفعل بمدن فح
  فيح الافعى صوتها من فيها والكشيس صوتها من جادها وقد فحت الافعى تفح وتضح فييها
  وكل ما كان م ن المضاءف لازما فالمستقبل منه يجى على يفعل بالكسر الاسبعة أحرف جاءت
  بالضم والكسر وهويعل ويشبج ويحدّ فى الاهر ويصد أى يضح ويجم من الجمام والافعى تفح
  والفرس يشب وما كان متعديا فالمستقبل يجى بالضم الاخسسة أحرف جاءت بالضم
  والكسر وهى يشذه ويعله ويبت الشئويم لحديث ورم الشيرمه والفحفاح اسم نه-ر
  فى الجنة ⁦(فدح)⁩ فدحه الدين أثقله وفى حديث ابن جريج انّ رسول اللّٰه صلى اللّه
  عليه وسلم قال وعلى المسلين أن لا يتركوامفدوحافى فداء أو عقل وفى، حديث غيره. فرحابالرا.
  وأمرفادح اذا عاله وبهظه ولم يسمع أذدحه الدين عمن يوثق بعربيبته ⁦(فرح )⁩ فرح به سر
  والفرح أيضا البطرومنه قوله تعالى انّ اللّٰه لا يحب الفرحين وأفرحمسرّه يقال ما يسرّنى
  بهذا الامر مفرح ومفروح به ولا تقسل مفروح والتفريح مثل الافراح أبو عمرو أفر-ه
  الدين أثقله وأنشد
  إذا أنت لم تبرح تؤدّى أمانة • وتحمل أخرى أفرحتك الودائع
  وفى الحديث لا يترك فى الاسلام مفرح وقال الزهرى كان فى الكتاب الذى كتبه رسول اللّٰه
  صلى اللّٰه عليه وس-لم بين المهاجرين والانصار أن لا يتركوامفرحاحتى يعينوه على ما كان من
  عقل أوفداء قال الزهرى المفرح المفدوح وكذلك الاصمحى قال هوالذى قد أثقله الدين يقول
  بقضى عنه ديته من بيت المال ولا يترك مدينا وأنكرقولهم. فرج بالجيم وتقول لك
  عندى فرحة ان بشرتى وفرحة ( ١ والمفراح الذى بفرح كلماسره الدهر والمفرّح دواء
  معروف(فرشح الفرشاح من الموافر المنبطح قال الراجز
  ليس بصطرولاف رشاح وفرشحت الباقة اذا تفحجت العلب وفرشح الرجل اذاجاس
  وفح بين رجليه وهى الفرشحة والفرشطة قال الكسائى فرشح الرجل فى صلاته وهو أن يفحي
  بين رجليه جداوه وقائم وكان ابن عم رلا يفرشم رجليه فى الصلاة ولا يلصقه-ما ول.كن بين
  ذلك (فرطح رأسمفرطح أى عريض قال الشاعر
  كالة رص فرطح من طحين شعير سمح النسيجة السعة ومكان قبيح ومجلس فسع
  على فعل أى واسع وفسح له فى المجلس أى ومع له وانفسح صدره انشرح وتفسنحوا فى الجلس
  وتفاسبحوا أى توسعوا والفسحم الواسع الصدر والميم زائدة ( شح فشيعت الناقة
  تفاحت لتبول وانفشحت اذا بقيت كذلك لوجع قال حسات
  انك لوصاحبتنا مذحت * وحكك الحنوان فانفشحت
  (فصح. رجل فصيح وكلام فصيح أى بليغ ولسان فصيح أى طلق ويقال كل ناطق فصيح
  ⁦(١)⁩ بالضم اه
