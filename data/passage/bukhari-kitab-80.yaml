summary:
  ar: "القسم 80 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الدعوات»، ويضم فيها النصوص من 6304 إلى 6411 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 80 of Sahih al-Bukhari (Invocations) in the division of the open hadith dataset the museum took its reports from: reports 6304 to 6411 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 80، عنوان «کتاب الدعوات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6304 تا 6411۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 80 de Sahih al-Bukhari (Invocaciones) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6304 al 6411 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 80 du Sahih al-Bukhari (Invocations), dans la section 6304 à 6411 de la base de données ouverte. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
