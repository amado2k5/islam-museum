text: "۞ أَوَلَمْ يَسِيرُوا۟ فِى ٱلْأَرْضِ فَيَنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلَّذِينَ كَانُوا۟ مِن قَبْلِهِمْ ۚ كَانُوا۟ هُمْ أَشَدَّ مِنْهُمْ قُوَّةً وَءَاثَارًا فِى ٱلْأَرْضِ فَأَخَذَهُمُ ٱللَّهُ بِذُنُوبِهِمْ وَمَا كَانَ لَهُم مِّنَ ٱللَّهِ مِن وَاقٍ"
text_search: "۞ أولم يسيروا في الأرض فينظروا كيف كان عاقبة الذين كانوا من قبلهم ۚ كانوا هم أشد منهم قوة وآثارا في الأرض فأخذهم الله بذنوبهم وما كان لهم من الله من واق"
translations:
  en: { text: "Have they not travelled in the land to see the nature of the consequence for those who disbelieved before them? They were mightier than these in power and (in the) traces (which they left behind them) in the earth. Yet Allah seized them for their sins, and they had no protector from Allah.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کیا انہوں نے زمین میں سیر نہیں کی تاکہ دیکھ لیتے کہ جو لوگ ان سے پہلے تھے ان کا انجام کیسا ہوا۔ وہ ان سے زور اور زمین میں نشانات (بنانے) کے لحاظ سے کہیں بڑھ کر تھے تو خدا نے ان کو ان کے گناہوں کے سبب پکڑ لیا۔ اور ان کو خدا (کے عذاب) سے کوئی بھی بچانے والا نہ تھا", translator: "Fateh Muhammad Jalandhari", license: PD }
