text: "الحديث الإمام أمين الإمام ضامن الإيمان اثنان وسبعون بابا الإيمان أربعة وسبعون بابا الإيمان أن تؤمن بالله الإيمان بضع وسبعون شعبة الإيمان بضع وستون شعبة الإيمان تسعة وسبعون شعبة الإيمان سبعة وسبعون شعبة الإيمان سبعون بابا الإيمان كالقميص يلبسه الإنسان …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 3، ص 105، يذكر الإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 3, p. 105, that mentions faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 3، ص 105 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 3, pág. 105, que menciona la fe como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 3, p. 105) qui décrit la foi comme étant composée d'une soixantaine de branches; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 3. cildinin 105. sayfasından bir alıntı, yetmişten fazla inanç dalından bahsetmektedir; bu, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, inanç dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 3, halaman 105, menyebutkan lebih dari tujuh puluh cabang iman; ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
