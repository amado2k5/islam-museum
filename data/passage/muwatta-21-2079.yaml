label: { ar: "الموطأ 2079 — يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن: قضى رسول الله بالشفعة فيما لم يقسم بين الشركاء، فإذا وقعت الحدود فلا شفعة فيه", en: "Muwatta 2079", es: "Muwatta 2079", fr: "Muwatta 2079", ur: "موطا 2079", tr: "El-Muvatta 2079 — Yahya, Malik'ten, İbn Şihab'dan, Said bin el-Musayyab'dan ve Ebu Seleme bin Abdül-Rahman'dan rivayetle: Allah Resulü, ortaklar arasında paylaştırılmamış mallarda öncelik hakkı olduğunu, ancak sınırları belirlenmiş mallarda öncelik hakkı olmadığını hükmetmiştir.", id: "Al-Muwatta 2079 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab, dan berdasarkan riwayat Abu Salama bin Abd Al-Rahman: Rasulullah SAW menetapkan bahwa ada hak prioritas atas harta yang belum dibagi antara para mitra, tetapi jika batas-batasnya telah ditetapkan, maka tidak ada hak prioritas di dalamnya." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن بن عوف أن رسول الله قضى بالشفعة فيما لم يقسم بين الشركاء، فإذا وقعت الحدود بينهم فلا شفعة فيه. ويذكر المحقق أن أكثر رواة الموطأ رووه مرسلا، وأن جملة من أصحاب مالك رووه متصلا من حديث أبي هريرة. {cite:muwatta-maruf-1997 p.251}"
  tr: "Yahya, Malik'ten, İbn Şihab'dan, Sa'id ibn el-Musayyab'dan ve Ebu Seleme ibn Abd el-Rahman ibn Awf'tan rivayetle, Allah Resulü'nün, ortaklar arasında paylaştırılmamış mallar için öncelik hakkının geçerli olduğunu, ancak ortaklar arasında sınırlar belirlenmişse öncelik hakkının olmadığını hükmettiğini aktarır. Araştırmacı, Muwatta'nın ravilerinin çoğunun bunu mursal hadis olarak, Malik'in bazı sahabelerinin ise Ebu Hurayra'dan muttal hadis olarak naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.251}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, dari Sa'id ibn al-Musayyab, dan dari Abu Salamah ibn Abd al-Rahman ibn Awf, bahwa Rasulullah SAW menetapkan bahwa hak prioritas berlaku untuk apa yang belum dibagi antara para mitra, tetapi jika batas-batas telah ditetapkan di antara mereka, maka tidak ada hak prioritas. Peneliti menyebutkan bahwa sebagian besar perawi Muwatta meriwayatkannya sebagai hadits mursal, sedangkan sejumlah sahabat Malik meriwayatkannya sebagai hadits muttal dari Abu Hurayrah. {cite:muwatta-maruf-1997 p.251}"
