label: { ar: "الموطأ 2079 — يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن: قضى رسول الله بالشفعة فيما لم يقسم بين الشركاء، فإذا وقعت الحدود فلا شفعة فيه", en: "Muwatta 2079" }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وعن أبي سلمة بن عبد الرحمن بن عوف أن رسول الله قضى بالشفعة فيما لم يقسم بين الشركاء، فإذا وقعت الحدود بينهم فلا شفعة فيه. ويذكر المحقق أن أكثر رواة الموطأ رووه مرسلا، وأن جملة من أصحاب مالك رووه متصلا من حديث أبي هريرة. {cite:muwatta-maruf-1997 p.251}"
