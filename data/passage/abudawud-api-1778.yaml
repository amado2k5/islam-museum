label: { ar: "سنن أبي داود 1778 — الأب والأبوة", en: "Sunan Abi Dawud 1778 — the father and fatherhood", ur: "سنن ابی داؤد 1778 — باپ اور والدیت", es: "Sunan Abi Dawud 1778 — El padre y la paternidad" }
text: "… مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ يَعْنِي ابْنَ سَلَمَةَ، ح وَحَدَّثَنَا مُوسَى، حَدَّثَنَا وُهَيْبٌ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّهَا قَالَتْ خَرَجْنَا مَعَ رَسُولِ اللَّهِ مُوَافِينَ هِلاَلَ ذِي الْحِجَّةِ فَلَمَّا كَانَ بِذِي الْحُلَيْفَةِ قَالَ \" مَنْ شَاءَ أَنْ يُهِلَّ بِحَجٍّ فَلْيُهِلَّ وَمَنْ شَاءَ أَنْ يُهِلَّ بِعُمْرَةٍ فَلْيُهِلَّ بِعُمْرَةٍ \". قَالَ مُوسَى فِي حَدِيثِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1778، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1778 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1778، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1778 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
