  وفلان يراوحن فلانا على أمر كذا أى يداريهلدخله فيه
  صل الشين رض) جل شروا أى ضخم مثل جرواض وابمع شراويض
  صل المين رض عرض له أمى كذابع رض أى ظهر وعرضت عليه أمر كذا
  وعرضت له الشى أى أظهرته ف وأبردّته اليه يقال عرضت له توبامكان حقه وفى المشل
