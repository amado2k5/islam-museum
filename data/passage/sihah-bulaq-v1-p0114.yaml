text: |-
  ٥٢٧
  بالازمنة التى وقعت فيها فوافق هذا الشهر أيام ومض الحرّ فسمى بذلك ( وض
  الروضة من البقل والعشب والجمع روض ورياض صارت الواويا، لكسرة ماقباهاوالروض
  نحو من نصف القربة ماء وفى الحوض روضة من ماء اذاغطى أسفله وأنشد أبوعمرو
  وروضة سقيت عنها نضوتى ورضت المهر أروضه رياضاور ياضة فهو مروض وناقة
  حروضة وة دار تاضت وكذلك روضته رويضاشدد للمبالغسة وقوم روّاض وراضة وناقة
  ريض أول ما ريضت وهى صعبة بعد وكذلكْ العروض والعسيروا لقضيب من الابل كله
  بعنى الاننى والذكرفيه سواء وكذلك غلام ريض وأحله ريوض فقلبت الواوياء وأدغمت
  وروّصت الراح جعلتها روضة قال يعقوب قد أراض هذا المكان وأروض اذا سكثرت
  رياضه وأراض الوادى واستراض أى استنقع فيه الماء وكدلك أراض الحوض ومنه قولهم
  نربوا -تى أراضوا أى رووافنعوابالرى وأنانا باناء يريض كذاو كذانفسا واستراض!
  المكان أى اتسع ومنه قولهم افعل ذالئ مادامت النفس مستريضة أى متسعة طيبة قال
  لاغلب العجلى (١
