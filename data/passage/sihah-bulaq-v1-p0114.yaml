  على البعيروءرضت الجارية على البيع وعرضت الكتاب وعرضت الجندء رضس العين اذا
  أمررتهم عليك وتظرت ماحالهم وقدعرض العارض الجند واعترضهم ويقال اعترضت
  على الدابة اذا كنت وقت العرض راكبا وعرضه عارض من الحى ونحوها وعرضتهم على
  السيف قتلا ومرض العود على الاناء والسيف على نفذه يعرضه ويعرضه أيضافهذه
