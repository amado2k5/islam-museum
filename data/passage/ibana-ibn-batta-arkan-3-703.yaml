text: "… عن ربعي بن حِرَاش، عن رجل، عن عليِّ ين، قال: قال رسول اللّٰه وَتَيخ: لا يؤمن عبدٌ حتى يؤمن بأربع: يشهد أن لا إله إلَّا الله، وأني رسول اللّٰه بعثني بالحقِّ، ويؤمن بالقدر، ويؤمن بالبعث بعد الموت. رواه أحمد، والترمذي، …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 3، ص 703، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 3, p. 703, that mentions belief in the decree, what faith is not complete without, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 3، ص 703 کا اقتباس جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra de Ibn Batta, el Libro de la Fe, volumen 3, pág. 703, que menciona la creencia en el decreto, sin el cual la fe no está completa, la creencia en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
