text: "… الصحابة وهم يعلمون تحريمه، فقد كان ينكر بعضهم على بعض ما هو أخف من هذا. هذا الحكم بالنسبة للرجال : إباحة الحرير للنساء وعند الاعذار واليسير منه : أما النساء فإنه يحل لهن لبس الحرير وافتراشه. كما يحل للرجال عند …"
summary:
