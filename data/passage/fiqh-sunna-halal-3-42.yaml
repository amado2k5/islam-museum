  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 42, that mentions what was made lawful, prohibition, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
