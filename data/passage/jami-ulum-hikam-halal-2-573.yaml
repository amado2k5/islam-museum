text: "… في صفة الرسول وَيُحِلُّ لَهُمُ الطِّيِّبَتِ وَيُحَرِّمُ عَلَيْهِمُ الْخَبَيِثَ الأعراف :، وأخبر أنَّ قلوب المؤمنين تطمئنُّ بذكره، فالقلبُ الذي دخله نورُ الإيمان، وانشرح به وانفسح، يسكن للحقِّ، ويطمئن به ويقبله، وينفر عن الباطل ويكرهه ولا يقبله. قال معاذ بن جبل …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 573، يذكر ما أُحل، وما حُرّم، والخبائث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 573, that mentions what was made lawful, what was made unlawful, the foul things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 573 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا، خبیث چیزیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
