  fr: "Extrait du Jami' al-'Ulum wa-l-Hikam d'Ibn Rajab, volume 2, page 573, mentionnant ce qui a été déclaré licite, ce qui a été déclaré illicite et les choses impures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 573. sayfasından, helal, haram ve hayıf olan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
