label: { ar: "موطأ مالك 246 — ما فُرض على الناس، ما تُرك خشية أن يُفرض", en: "Muwatta Malik 246 — what was made obligatory on people; what was left for fear it would be made obligatory", ur: "موطأ مالک 246 — جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا", fr: "Muwatta de Malik 246 — ce qui a été imposé aux gens ; ce qui fut délaissé de crainte qu'il ne devienne obligatoire", es: "Muwatta de Malik 246 — lo que se impuso a la gente; lo que se dejó por temor a que se hiciera obligatorio", tr: "Muwatta Malik 246 — İnsanlara dayatılan şey, dayatılma korkusuyla bırakılmaz.", id: "Muwatta Malik 246 — Apa yang dipaksakan kepada manusia tidak dibiarkan karena takut akan dipaksakan" }
text: "… عَائِشَةَ، زَوْجِ النَّبِيِّ أَنَّ رَسُولَ اللَّهِ صَلَّى فِي الْمَسْجِدِ ذَاتَ لَيْلَةٍ فَصَلَّى بِصَلاَتِهِ نَاسٌ ثُمَّ صَلَّى اللَّيْلَةَ الْقَابِلَةَ فَكَثُرَ النَّاسُ ثُمَّ اجْتَمَعُوا مِنَ اللَّيْلَةِ الثَّالِثَةِ أَوِ الرَّابِعَةِ فَلَمْ يَخْرُجْ إِلَيْهِمْ رَسُولُ اللَّهِ فَلَمَّا أَصْبَحَ قَالَ \" قَدْ رَأَيْتُ الَّذِي صَنَعْتُمْ وَلَمْ يَمْنَعْنِي مِنَ الْخُرُوجِ إِلَيْكُمْ إِلاَّ أَنِّي خَشِيتُ أَنْ تُفْرَضَ عَلَيْكُمْ \". وَذَلِكَ فِي رَمَضَانَ."
summary:
  ar: "حديث في موطأ مالك، رقم 246، يرد فيه ذكر ما فُرض على الناس، وما تُرك خشية أن يُفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 246 (Prayer in Ramadan), whose wording mentions what was made obligatory on people, what was left for fear it would be made obligatory. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 246، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 246, dont le texte mentionne ce qui a été imposé aux gens, ce qui fut délaissé de crainte qu'il ne devienne obligatoire. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 246, cuyo texto menciona lo que se impuso a la gente, lo que se dejó por temor a que se hiciera obligatorio. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 246 numaralı hadis, insanların farz olan ve farz olma korkusuyla yapılmayan şeyleri sıralamaktadır. Bu hadis, farz, görev, itaat, tavsiye edilen, mekruh edilen, haram kılınan ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 246, menyebutkan apa yang wajib bagi manusia dan apa yang sebaiknya dihindari karena dikhawatirkan akan menjadi wajib. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
