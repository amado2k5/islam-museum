text: "تأخرت القرونُ ساء الظن بالمراسيل، ولم يشهد بها مات، ثم تَخْرجُ، فتُعطى بعرة، فترمي بها، ثم تُراجع يا رسول الله: إن بنتي توفي عنها زوجها، وقد زوجَها تُوفي، وكانت تشتكي عينيها فتكتحِلُ بالجَلاء والعصب: نوع من البرود يعصب غَزْلَهُ، ثم …"
