label: { ar: "جامع الترمذي 724 — ضحك وتبسم", en: "Jami' al-Tirmidhi 724 — laughter and smiling", ur: "جامع ترمذی 724 — ہنسی اور تبسم", fr: "Jami' al-Tirmidhi 724 — rire et sourire", es: "Jami' al-Tirmidhi 724 — risa y sonrisa" }
text: "… قَالَ لاَ. قَالَ اجْلِسْ . فَجَلَسَ فَأُتِيَ النَّبِيُّ بِعَرَقٍ فِيهِ تَمْرٌ - وَالْعَرَقُ الْمِكْتَلُ الضَّخْمُ قَالَ تَصَدَّقْ بِهِ . فَقَالَ مَا بَيْنَ لاَبَتَيْهَا أَحَدٌ أَفْقَرَ مِنَّا. قَالَ فَضَحِكَ النَّبِيُّ حَتَّى بَدَتْ أَنْيَابُهُ. قَالَ فَخُذْهُ فَأَطْعِمْهُ أَهْلَكَ . قَالَ وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَعَائِشَةَ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 724، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 724, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 724، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 724, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 724, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
