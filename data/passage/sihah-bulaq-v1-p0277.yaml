text: |-
  ٣٦٤
  ⁦(باب الراء)⁩
  .. ⁦( عشر )⁩
  الا اثني عشرفان العن لا تسكن اسكون الالف والماء وقال الاخفس انماسكنوا العن لما
  طال الاسم وكثرت حركاته وتقول احدى عشرة امرأة بكسر الشين وان شئت سكنت الى
  تسع عشرة والمكسر لاهل نجد والتسكين لاهل الحجاز وللمذ كرأحد عشر لاغير وعشرون اسم
  موضوع اه-ذا العدد وليس بجمع لعشرة لانه لادليل على ذلك فاذا أضفت أسقطت النون
  قلت هذه عشرول وعشرى تقلب الواويا للتق بعدها فسدغم والعشر الجزء من أجزا.
  العشرة وكذلك العشير وجع العشير أعشراء مثل نصيب وأنصباء وفى الحديث تسعة
  أعشراء الرزق فى التحارة ومعشار الشى عشره ولاية ولون هذا فى شئسوى العشر وعشرت
  القوم أعشرهم بالضم عشرامضومة اذا آخذت منهم عشر أموالهم ومنه العاشر والعشار
  وعشرت القوم أعشرهم بالكسر عشرا بالفتح أى صرت عاشرهم والعشر بالمكسر ما بين
  الوردين وهوثمانية أيام لانها ترداليوم العاشروكذلك الاظما،كلها بالكسر وليس لها
  بعد العشراسم الافى العشرين فاذا وردت يوم العشرين قيسل ظمؤها عشران وهوعمانية
  عشريومافاذاجاوزت العشرين فليس لها تسمية واناهى جوازئ وأعشر الرجل اذاوردت
  ابله عشراوهذه ابل عواشر وأعشر القوم صار واعشرة والمعاشرة المخااطة وكذلك التعاشر
  والاسم العشرة والعشربضم أوّل شجرله صمغ وهومن العضاه وتمرته نفاخة كنفاخة القتاد
  الاصفر الواحدة عشرة والجمع عشروعشرات ويقال أيض الثلاث ليال من ليالى الشهر عشر
  وهى بعد التسع وكان أبو عبيدة يبطل التسع والعشر الاأشياء منه معروفة حكى
  ذلك عنه أبوعبيد ويوم عاشوراء وعشورا، أيضاممدودان والمعاشرجماعات الناس
  الواحد معشر والعشير القسلة وسعد العشيرة آبوقبيلة من اليمن وهو سعدين مذج والعشم
  المعاشر وفى الحديث انكن تكثرن اللعن وتكفرن العشير يعنى الزوج لانه يعاشرها
  وتعاشره وقال اللّٰه تعالى لبئس المولى ولبئس العشير رعشار بالضم معدول من عشرة
  تقول جاء القوم عشار عشار أى عشرة عشيرة قال أبو عبيدولم يسمع أكثر من أحادوثناء
  وثلاث ورباع الافى قول الكميت
  ولم يسترينوك حق رميت * فوق الرجال خصالاعشارا
  والعشارى ما يقع طوله عشرة أذرع والعشار بالكسر جمع عشراء وهى الناقة التى أنت
  عليها من يوم أرسل فيها الفحسل عشرة أشهروزال عنها اسم المخاض تم لا يزال ذلك اسمها
  حتى تضع وبعدما تضع أيضايقال ناقتان عشراوان ونوق عشار وعشراوات ييدلون من
  همزة التأنيث واواو قد عشرت الناقة تعشيرا أى صارت عشراء وبنو عشرا. أيضاقوم
  من بنى فزارة وتعشير المصاحف جعل المواشر فيها وتعشير المارنهيقه عشرة أصوات
  فى طلق واحد قال الشاهر روة بن الور
  لعمرى اتن عشرت من خيفة الردى * نهاق الحميرانى الجزوع
  وذلك انمم كانوا اذاخافوا من وباء بلدعشروا كتعشير الهار قبل أن يدخلوها وكاتوار عمون
  ان ذلك يتفعهم واعشار الجزور الانصباء قال احر والقيس .
  وماذرفت عيناك الالتضربه • بسهميك فى أعشارقلب مقتل
  يعى
