text: "… أَصحابه : إنك تداعبنا يا رسول اللّٰه، قال : إِلى لا أقول إلا حقاً. وروى الإمام أَحمد والطبراني والضياء فى صحيحه عن أَبى أُمَامَة أَن رسول اللّه قال : لَيَدْخُلَنَّ الجَنَّة بشفاعة رجل مثل الْحَيَّيْن أَومثل أَحد الحيَّيْن ربيعة ومُضَر. …"
