label: { ar: "الموطأ 45 — ماء البحر: هو الطهور ماؤه الحل ميتته", en: "Muwatta 45" }
text: "هو الطهور ماؤه، الحل ميتته"
summary:
  ar: "أول حديث في باب الطهور للوضوء. يرويه يحيى عن مالك عن صفوان بن سليم عن سعيد بن سلمة من آل بني الأزرق عن المغيرة بن أبي بردة من بني عبد الدار أنه سمع أبا هريرة يقول: سأل رجل النبي عن الوضوء بماء البحر لأنهم يركبونه ويحملون القليل من الماء فإن توضؤوا به عطشوا، فأجابه بأن البحر طهور ماؤه حلال ميتته. ويخرّجه المحقق عند أبي داود (83) والترمذي (69) والنسائي وابن ماجه (386) وابن خزيمة (111) وابن حبان (1243) والحاكم من طرق أصحاب مالك، ويرى أنه حديث صحيح رجاله ثقات، إذ وثّق النسائي سعيداً والمغيرة وصححه البخاري والترمذي، ويذكر أن ابن عبد البر ضعّف إسناده بجهالتهما وبالاختلاف فيه مع تصحيحه متنه لتلقي العلماء له بالقبول، وينقل عن الدارقطني في العلل أن أشبه الروايات بالصواب رواية مالك ومن تابعه عن صفوان. {cite:muwatta-maruf-1997 p.55} {cite:muwatta-maruf-1997 p.56}"
