label: { ar: "الموطأ 45 — ماء البحر: هو الطهور ماؤه الحل ميتته", en: "Muwatta 45", es: "Muwatta 45", fr: "Muwatta 45", ur: "موطا 45", tr: "Al-Muwatta 45 — Deniz suyu: Suyu temizdir ve ölü hayvanları yemek caizdir.", id: "Al-Muwatta 45 — Air laut: Airnya suci dan bangkai (hewan) di dalamnya boleh dimakan." }
text: "هو الطهور ماؤه، الحل ميتته"
summary:
  ar: "أول حديث في باب الطهور للوضوء. يرويه يحيى عن مالك عن صفوان بن سليم عن سعيد بن سلمة من آل بني الأزرق عن المغيرة بن أبي بردة من بني عبد الدار أنه سمع أبا هريرة يقول: سأل رجل النبي عن الوضوء بماء البحر لأنهم يركبونه ويحملون القليل من الماء فإن توضؤوا به عطشوا، فأجابه بأن البحر طهور ماؤه حلال ميتته. ويخرّجه المحقق عند أبي داود (83) والترمذي (69) والنسائي وابن ماجه (386) وابن خزيمة (111) وابن حبان (1243) والحاكم من طرق أصحاب مالك، ويرى أنه حديث صحيح رجاله ثقات، إذ وثّق النسائي سعيداً والمغيرة وصححه البخاري والترمذي، ويذكر أن ابن عبد البر ضعّف إسناده بجهالتهما وبالاختلاف فيه مع تصحيحه متنه لتلقي العلماء له بالقبول، وينقل عن الدارقطني في العلل أن أشبه الروايات بالصواب رواية مالك ومن تابعه عن صفوان. {cite:muwatta-maruf-1997 p.55} {cite:muwatta-maruf-1997 p.56}"
  tr: "Abdest temizliği bölümündeki ilk hadis. Yahya, Malik'ten, Safvan ibn Salim'den, Sa'id ibn Salame'den (Banu el-Azrak kabilesinden), Muğire ibn Ebu Burde'den (Banu Abd el-Dar kabilesinden) rivayet etmiştir. Muğire, Ebu Hurayra'nın şöyle dediğini işitmiştir: Bir adam Peygamberimize deniz suyuyla abdest almanın ne anlama geldiğini sordu; çünkü denizde yolculuk ediyorlar ve yanlarında az su taşıyorlar, eğer deniz suyuyla abdest alırlarsa susayacaklarmış. Peygamberimiz şöyle cevap verdi: Deniz temizdir, suyu temizdir ve ölüleri yenmeye helaldir. Araştırmacı, bu hadisi Ebu Davud (83), Tirmizi (69), Nesai, İbn Majah (386), İbn Huzeyme (111), İbn Hibban (1243) ve Hakim'in hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil etmiştir. O, hadisi güvenilir ravilere sahip sahih bir hadis olarak kabul eder; zira el-Nasa'i, Sa'id ve el-Muğire'yi güvenilir bulmuş, el-Buhari ve el-Tirmizi de onu sahih olarak tasdik etmiştir. İbn Abd el-Barr'ın, rivayet zincirindeki tutarsızlıklar ve bilinmeyen statüleri nedeniyle hadisin isnadını zayıflattığını, ancak âlimler tarafından kabul görmesi nedeniyle metnini sahih olarak tasdik ettiğini belirtir. El-Daraqutni'nin el-İlal'de, en doğru olma ihtimali olan rivayetin, Safvan'dan rivayetle Malik ve onu takip edenlerin rivayeti olduğunu söylediğini aktarır. {cite:muwatta-maruf-1997 s.55} {cite:muwatta-maruf-1997 s.56}"
  id: "Hadits pertama dalam surah tentang penyucian untuk wudhu. Diriwayatkan oleh Yahya dari Malik, dari Safwan ibn Salim, dari Sa'id ibn Salamah dari Bani al-Azraq, dari al-Mughirah ibn Abi Burdah dari Bani Abd al-Dar, yang mendengar Abu Hurayrah berkata: Seorang laki-laki bertanya kepada Nabi tentang berwudhu dengan air laut karena mereka bepergian di atasnya dan hanya membawa sedikit air, dan jika mereka berwudhu dengan air laut, mereka akan haus. Beliau menjawab bahwa laut itu suci, airnya suci, dan bangkai hewan di dalamnya boleh dimakan. Peneliti memasukkannya dalam koleksi Abu Dawud (83), al-Tirmidhi (69), al-Nasa'i, Ibn Majah (386), Ibn Khuzaymah (111), Ibn Hibban (1243), dan al-Hakim melalui sanad para sahabat Malik. Ia menganggapnya sebagai hadits sahih dengan perawi yang terpercaya, sebagaimana al-Nasa'i menganggap Sa'id dan al-Mughirah dapat diandalkan, dan al-Bukhari serta al-Tirmidhi mengesahkannya. Ia menyebutkan bahwa Ibnu Abd al-Barr melemahkan sanadnya karena status mereka yang tidak diketahui dan perbedaan dalam riwayatnya, sementara ia mengesahkan teksnya karena diterima oleh para ulama. Ia mengutip al-Daraqutni dalam al-`Ilal yang mengatakan bahwa riwayat yang paling mungkin benar adalah riwayat Malik dan para pengikutnya atas otoritas Safwan. {cite:muwatta-maruf-1997 p.55} {cite:muwatta-maruf-1997 p.56}"
