text: "نوادر جحا الكبرى فقال القاضي : اسألُوُه ما أسمُ امرأتِهِ وما آسمُ والدِها؟ فقال جحا: لا أعلم! فقال القاضي : منذُ كَمْ سنةً تزوجتَ؟ قال: منذُ بضع سنين. ولكنَّني لم أسامرها في حديثٍ ولم تَكُنْ بيني وبينها ساعةُ صداقةِ لأسألَهاَ …"
summary:
  ar: "اقترب لصوص ليلًا فثغت خروف جحا، فاقترح أحد اللصوص أن يقتلوا جحا ويأكلوا الخروف. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  en: "Thieves approach at night; Juha's sheep bleats, and a thief proposes killing Juha and eating the sheep. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  ur: "چور رات کو قریب آئے تو جحا کی بھیڑ ممیائی، اور ایک چور نے تجویز دی کہ جحا کو مار ڈالیں اور بھیڑ کھا لیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  fr: "Des voleurs approchent de nuit ; le mouton de Juha bêle, et l'un des voleurs propose de tuer Juha et de manger le mouton. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
  es: "Unos ladrones se acercan de noche; la oveja de Juha bala, y uno de los ladrones propone matar a Juha y comerse la oveja. {cite:juha-nawadir-kubra-djuwaydi p. 49}"
