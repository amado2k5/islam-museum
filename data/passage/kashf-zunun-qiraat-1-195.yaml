text: "… يحيى اليمنيِّ، ألَّفهُ لما أنْكَرَ أبو بكر الوَعِلي الحيلةَ في الطَّلاق والرِّبا، وأنشأ قصيدةً فيهما، فرَدَّ عليه لكونه مخالفًا للفقه. والوَعِل : بفتح الواو وكسر العين من قرى أصبهان. -احتجاج القُرّاء في القراءة: للشيخ شمس الدِّين محمد بن السَّرِي المعروف …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 195، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 195, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 195 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen 1, pág. 195, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Kashf al-Zunun de Hajji Khalifa (tome 1, p. 195) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l’écriture du Coran."
  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin resimli 1. cildinin 195. sayfasında okuyuculardan bahsedilmektedir; makine tarafından okunabilir taranmış versiyondan, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Kashf al-Zunun karya Haji Khalifa, jilid 1 bergambar, halaman 195, menyebutkan para pembaca; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
