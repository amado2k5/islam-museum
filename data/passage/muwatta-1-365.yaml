label: { ar: "الموطأ 365 — عائشة: كان يصلي جالساً فإذا بقي ثلاثون أو أربعون آية قام", en: "Muwatta 365", es: "Muwatta 365", fr: "Muwatta 365", ur: "موطا 365", tr: "Al-Muwatta 365 — Aişe: O, oturarak namaz kılardı ve otuz kırk ayet kalınca ayağa kalkardı.", id: "Al-Muwatta 365 — Aisyah: Beliau biasa shalat sambil duduk, dan ketika tersisa tiga puluh atau empat puluh ayat, beliau akan berdiri." }
summary:
  ar: "يرويه مالك عن عبد الله بن يزيد المدني وعن أبي النضر، كلاهما عن أبي سلمة بن عبد الرحمن عن عائشة، في باب ما جاء في صلاة القاعد في النافلة: كان النبي يصلي جالساً فيقرأ وهو جالس، فإذا بقي من قراءته قدر ثلاثين أو أربعين آية قام فقرأ وهو قائم ثم ركع وسجد، ثم صنع في الركعة الثانية مثل ذلك. ويخرّجه المحقق عند البخاري (1119) ومسلم (2/163) وأبي داود (954) والنسائي (3/220) وأحمد والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد ⁦(19/169، 21/165)⁩. {cite:muwatta-maruf-1997 p.200}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Yazid al-Madani dan Abu al-Nadr, keduanya dari Abu Salamah ibn Abd al-Rahman dari Aisyah, dalam surah tentang apa yang diriwayatkan mengenai shalat orang yang duduk saat shalat sunnah: Nabi (shalawat dan salam kepadanya) biasa shalat sambil duduk, membaca Al-Qur'an sambil duduk. Ketika tersisa tiga puluh atau empat puluh ayat bacaannya, beliau berdiri dan membaca Al-Qur'an sambil berdiri, kemudian beliau rukuk dan sujud. Beliau melakukan hal yang sama pada rakaat kedua. Editor juga memasukkannya dalam kumpulan hadits al-Bukhari (1119), Muslim (2/163), Abu Dawud (954), al-Nasa'i (3/220), Ahmad, dan al-Tahawi, melalui sanad para sahabat Malik, dan beliau merujuk pada al-Tamhid (19/169, 21/165). {mengutip:muwatta-maruf-1997 hal.200}"
