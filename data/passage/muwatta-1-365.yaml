label: { ar: "الموطأ 365 — عائشة: كان يصلي جالساً فإذا بقي ثلاثون أو أربعون آية قام", en: "Muwatta 365" }
summary:
  ar: "يرويه مالك عن عبد الله بن يزيد المدني وعن أبي النضر، كلاهما عن أبي سلمة بن عبد الرحمن عن عائشة، في باب ما جاء في صلاة القاعد في النافلة: كان النبي يصلي جالساً فيقرأ وهو جالس، فإذا بقي من قراءته قدر ثلاثين أو أربعين آية قام فقرأ وهو قائم ثم ركع وسجد، ثم صنع في الركعة الثانية مثل ذلك. ويخرّجه المحقق عند البخاري (1119) ومسلم (2/163) وأبي داود (954) والنسائي (3/220) وأحمد والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد (19/169، 21/165). {cite:muwatta-maruf-1997 p.200}"
