text: "… فأخذت بيد الرجل الذى كان إلى جنبى، فقلت : من أنت ؟ قال:.. فلان بن فلان. أبوّ سفيَان ينادقى بالرحيل ثم قال أبو سفيان : يامعشر قريش، إنكم والله ما أسْبَحتم بدار مُقام،. لقد هَلك الكراع والف، وأخلفتنا بنُو قريطة، …"
