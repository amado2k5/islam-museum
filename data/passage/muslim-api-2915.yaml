label: { ar: "صحيح مسلم 2915 — الأب والأبوة", en: "Sahih Muslim 2915 — the father and fatherhood", ur: "صحیح مسلم 2915 — باپ اور والدیت", es: "Sahih Muslim 2915 — El padre y la paternidad", fr: "Sahih Muslim 2915 — Le père et la paternité", tr: "Sahih Muslim 2915 — Baba ve Babalık", id: "Sahih Muslim 2915 — Ayah dan Peran Ayah" }
text: "وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - قَالَتْ خَرَجْنَا مُوَافِينَ مَعَ رَسُولِ اللَّهِ لِهِلاَلِ ذِي الْحِجَّةِ لاَ نَرَى إِلاَّ الْحَجَّ فَقَالَ رَسُولُ اللَّهِ \" مَنْ أَحَبَّ مِنْكُمْ أَنْ يُهِلَّ بِعُمْرَةٍ فَلْيُهِلَّ بِعُمْرَةٍ \". وَسَاقَ الْحَدِيثَ بِمِثْلِ حَدِيثِ عَبْدَةَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2915، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2915 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2915، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2915 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2915 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 2915 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2915, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
