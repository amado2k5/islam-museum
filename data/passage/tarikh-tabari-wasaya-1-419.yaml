text: "… علّته الة مات فيها قروحا اصابته فى ٪ حلقة ورأسه فذبحته وذكر أن القروح للة كانت فى حلقه ورأسه: كانت تدخل فيها الفتائل فلما ا مات تنازع الصلاة عليه اخوه عبيد الله وابنه طاهر فصلّى عليه ابنه وكان اوصى بذلك …"
