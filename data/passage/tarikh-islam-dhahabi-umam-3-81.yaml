text: "… أصحاب النّبيّ وي فجعلوا يسألونه: أين أبو سفيان ؟ فيقول : والله مالي بشيءٍ من أمره عِلْم، ولكنْ هذه قُرَيش قد جاءت، فيهم أبو جَهْل، وعُتّبة، وشَيْبة ابنا ربيعة، وأُميَّة بن خَلَف. قال: فإذا قال لهم ذلك ضربوه. فيقول: دَعُوني …"
