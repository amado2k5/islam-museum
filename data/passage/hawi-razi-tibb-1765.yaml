  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1765, that mentions pain, named diseases, treatment, the organs of the body, surgery, circumcision and splints, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
