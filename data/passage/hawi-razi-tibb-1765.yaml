text: "… زفت وكبريت يدق كالكحل واجمعه واطله على الورك وألزق فوقه قرطاساً واتركه إلى أن يسقط من قبل نفسه. ضماد للنقرس ووجع النسا والمفاصل؛ عالج عرق النسا بهذا العلاج فإنه ينفع من ساعته: تؤخذ حلبة فتطبخِ بخل خمر ممزوج بالماء حتى …"
summary:
