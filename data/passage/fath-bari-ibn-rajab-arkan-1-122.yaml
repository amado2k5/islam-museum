text: "… في الإيمانِ. وأما حديثُ أبي هريرةَ: فهو يدلُّ على أَنَّ الإيمانَ باللهِ ورسولِهِ عملٌ لأنه جَعَله أفضلَ الأعمالِ، والإيمانُ باللهِ ورسولِهِ الظاهرُ أنَّه إنَّما يُرَاد بهِ الشهادتانِ مع التَّصديقِ بِهما؛ ولهذا وردَ في حديثِ: بُنيَ الإسلامُ على خمسٍ: شهادةُ أَنْ …"
