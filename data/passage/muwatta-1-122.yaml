label: { ar: "الموطأ 122 — عمر يجد أنه احتلم وصلى فيغتسل ويعيد بالجرف", en: "Muwatta 122" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن زييد بن الصلت، في باب إعادة الجنب الصلاة: خرج زييد مع عمر بن الخطاب إلى الجرف، فنظر عمر فوجد أنه قد احتلم وصلى ولم يغتسل، فأقسم أنه لا يرى إلا أنه احتلم وما شعر وصلى وما اغتسل، فاغتسل وغسل ما رأى في ثوبه ونضح ما لم ير، وأذّن أو أقام، ثم صلى بعد ارتفاع الضحى متمكناً. ويعرّف المحقق الجرف بأنه موضع على ثلاثة أميال من المدينة من جهة الشام، ويذكر أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.94}"
