label: { ar: "الموطأ 122 — عمر يجد أنه احتلم وصلى فيغتسل ويعيد بالجرف", en: "Muwatta 122", es: "Muwatta 122", fr: "Muwatta 122", ur: "موطا 122" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن زييد بن الصلت، في باب إعادة الجنب الصلاة: خرج زييد مع عمر بن الخطاب إلى الجرف، فنظر عمر فوجد أنه قد احتلم وصلى ولم يغتسل، فأقسم أنه لا يرى إلا أنه احتلم وما شعر وصلى وما اغتسل، فاغتسل وغسل ما رأى في ثوبه ونضح ما لم ير، وأذّن أو أقام، ثم صلى بعد ارتفاع الضحى متمكناً. ويعرّف المحقق الجرف بأنه موضع على ثلاثة أميال من المدينة من جهة الشام، ويذكر أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.94}"
  tr: "Malik'in Hişam ibn Urve'den, o da Zeyd ibn el-Tuz'dan rivayet ettiği, ritüel kirlilik halinde olan bir kişinin namazı tekrar etmesi bölümündeki bir rivayet şöyledir: Zeyd, Ömer ibn el-Hattab ile birlikte el-Juruf'a gitti. Ömer baktı ve Zeyd'in ıslak bir rüya gördüğünü ve gusül abdesti almadan namaz kıldığını gördü. Zeyd, farkında olmadan ıslak bir rüya gördüğüne ve gusül abdesti almadan namaz kıldığına yemin etti. Bunun üzerine gusül abdesti aldı, elbisesinde görebildiği yerleri yıkadı ve göremediği yerlere su serpti. Sonra ezan veya ikamet okudu ve güneş iyice yükseldikten sonra, hazır bir halde namaz kıldı. Araştırmacı, el-Juruf'u Medine'ye üç mil uzaklıkta, Suriye tarafında bir yer olarak tanımlıyor ve bu yerin, Malik'ten rivayetle Ebu Mus'ab ve İbn Vahb tarafından, el-Tahavi, Suveyd ve Abdül-Razzak tarafından da kaydedildiği şeklinde aktarılıyor. {cite:muwatta-maruf-1997 s.94}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah dari otoritas Zayd ibn al-Salt, dalam surah tentang seseorang yang dalam keadaan najis mengulang salat: Zayd pergi bersama Umar ibn al-Khattab ke al-Juruf. Umar melihat dan mendapati bahwa ia mengalami mimpi basah dan salat tanpa melakukan ghusl (mandi wajib). Zayd bersumpah bahwa ia hanya percaya bahwa ia mengalami mimpi basah tanpa menyadarinya, dan bahwa ia telah salat tanpa melakukan ghusl. Maka ia melakukan ghusl, mencuci bagian yang terlihat pada pakaiannya, dan memercikkan air pada bagian yang tidak terlihat. Kemudian ia mengumandangkan adzan atau iqamah, dan salat setelah matahari terbit tinggi, dalam keadaan siap. Peneliti mengidentifikasi al-Juruf sebagai tempat yang berjarak tiga mil dari Madinah di sisi Suriah, dan menyebutkan bahwa tempat itu diriwayatkan atas otoritas Malik oleh Abu Mus'ab dan Ibn Wahb, sebagaimana dicatat oleh al-Tahawi, Suwayd, dan Abd al-Razzaq. {cite:muwatta-maruf-1997 p.94}"
