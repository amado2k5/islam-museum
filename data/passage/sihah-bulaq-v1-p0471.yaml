text: |-
  قوله وأم بريح الخ عبارة القاموس
  وابن بريح كأمير الغراب
  ١١.٧٠
  بدح مشل قدال وقدل وبدحسة الدارساحتها والبدح بالسكسر النضا الواسع وجمعه بداح
  وبدح الرجل عن حمالته والبعير عن حله يبدح بدحاعجز اعنهما وبدحنى الامر مشل فدحن
  بذح) البذح الشق وبذحت لسان الفصيل شققته لملار تضع وفى رجل فلان يذوح
  أى شقوق برح قيت منه برحابارحا أى شدّة وأذى قال الشاعر
  أجدّن هذا عمرك اللّٰه كلما دعال الهوى برح لمينيك بارح
  ولقيت منه بنات برح وبنى برح واقيت منه البرحير والبرحين بكسر الباء وضمها أى الشدائد
  والدواهى ويقال هذه برحة من البرح بالضم للناقة اذا كانت من خيار الابل والبارح الريح
  لخارة قال أبوزيا البوارح الشمال الحارة فى الصف واليارحة أقرب ليلة مضت تقول
  لقيته البارحة واقيته ال إرحة الاولى وهومن برح أى زال وبرحاء الحى وغيرهاشدة الاذى
  قول منه برح به الامر تبر يحا أى جهده وضر به ضر بامبرحا وتباريح الشوق توهجه وهذا
  الامر أبرح من هذا أى أشد وقتلوهم أبرح قتل وابر-ه أى أعجبه بقال ما أبرح هذا الاحر
  فال الاعشى أقول اهاحين جد الرحيل * أبرحت ربا وأبرحت جارا
  أى أعجبت وبالغت وأبرحه أيضا بمعى أكرمه وعظمه والبراح بالفتح المنسع من الارض
  لازرع فيه ولا شجر وجاءنا بالامربراحا أى بينا والبراح مصدرقولك برحمكانه
  أى زال عنه وصارفى البراح وفواهم لابراح منصوب كمانصب قولهم لاريب ويجوز
  رفعه قتكون لا بمنزلة ليس كما قال سعدين مالك
  من فسر ءن نيرانها + فانا ابنقيس لابراح
  والقصيدة مر فوعة الروىً وبرح انلخفا أى وضح الامر كانه ذهب السرّ وزال ولا أبرح أفعل
  ذاك أى لا أزال أفعله وبراح.ثل قطام"سم للشمس وأنشد قطرب
  هذا مقام قد مى رياح * ذيب -تى دلكت براح
  ورواه الفرّا. بكسر الراء وهو ججع راحة وهى الكف وبرح الغلبى بالنتح بروحا اذا ولاك
  ماسره عرّ من ممامنك الى مماسرك والعرب تتطسير بالبارح وتتفامل بالسائح لانه لا يمكنك
  أن ترمه حتى تتحرف وفى الممل انماهو كبارح الاروى لانّ مساكنها فى الجبال فى قنانم-
  لا يكادا انام يرونها ساضحة و(بارحة الافى الدهورهرة وأمّ بريح اسم للغراب وبرحى على فعلى
  كلمة تقال عند انخطأ فى الرمى ومر حى عند الاصابة ( بطلح بطحه أى ألقاه على
  وجهه فانبطح والابطح مسيل واسع فيه دقاق الحصى والجمع الاباطح والبطاح أيضاعلى غير
  القياس قال الادهي يقال بطاح بطح كما يقال أعوام عوم-كاه أبو مبيدوالبطيحة والبطها،
  مثل الابطح ومن. بطحاء مكة وبطائح النبط بين العراقين وتبطح السيل أى اتسع فى البطيعاء
  ( بلح البلح قبل البسر لانّ اول التمرطلع ثم خلال ثم بلح ثم بسر ثم رطب ثم تر الواحدة بلهة
  وقد أبلح النخل أى صار ماعليه بلهاو بلح الثرى يبس وبلح الرجل بلوحا أى أعيا قال الاعشى
  واشتكى الاوصال منه وبلح ويلح تبليها مثله بلدح بلدح الرجل اذاضرب
  بنفسه الارض ور بما قالوا بلطح وبلدح موضع ومن أمشالهم فى التحزن بالاقارب لكن على
  بلدح قوم عج- فى قاله بيهس الملقب بنعامة لمارأى قوما فى خصب وأهل فى شدّة وابلندح
  المصكان
