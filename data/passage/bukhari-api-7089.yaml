label: { ar: "صحيح البخاري 7089 — الأب والأبوة، تربية الأب ووصيته", en: "Sahih al-Bukhari 7089 — the father and fatherhood; the father raising and counselling", ur: "صحیح بخاری 7089 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 7089 — El padre y la paternidad; la crianza y el consejo paternos", fr: "Sahih al-Bukhari 7089 — Le père et la paternité; l’éducation et les conseils du père", tr: "Sahih el-Buhari 7089 — Baba ve Babalık, Babanın Yetiştirilmesi ve İradesi", id: "Sahih al-Bukhari 7089 — Ayah dan Peran Ayah, Didikan dan Wasiat Ayah" }
text: "… فَجَعَلْتُ أَنْظُرُ يَمِينًا وَشِمَالاً، فَإِذَا كُلُّ رَجُلٍ رَأْسُهُ فِي ثَوْبِهِ يَبْكِي، فَأَنْشَأَ رَجُلٌ كَانَ إِذَا لاَحَى يُدْعَى إِلَى غَيْرِ أَبِيهِ فَقَالَ يَا نَبِيَّ اللَّهِ مَنْ أَبِي فَقَالَ \" أَبُوكَ حُذَافَةُ \". ثُمَّ أَنْشَأَ عُمَرُ فَقَالَ رَضِينَا بِاللَّهِ رَبًّا، وَبِالإِسْلاَمِ دِينًا، وَبِمُحَمَّدٍ رَسُولاً، نَعُوذُ بِاللَّهِ مِنْ سُوءِ الْفِتَنِ. فَقَالَ النَّبِيُّ \" مَا رَأَيْتُ فِي الْخَيْرِ وَالشَّرِّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7089، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7089 (Afflictions and the End of the World), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7089، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7089 (Aflicciones y el fin del mundo), menciona al padre y la paternidad, así como la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7089 (Les Afflictions et la Fin du Monde), évoque le père et la paternité, l'éducation et le rôle du père dans l'éducation de ses enfants. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
  tr: "Sahih el-Buhari'de 7089 numaralı hadis, baba ve babalık kavramından, babanın çocuk yetiştirmedeki rolünden ve tavsiyelerinden bahsetmektedir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7089, menyebutkan tentang ayah dan peran ayah, peran ayah dalam membesarkan anak, dan nasihatnya. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
