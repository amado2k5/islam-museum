label: { ar: "سنن أبي داود 3960 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 3960 — a burial, grave or resting place", ur: "سنن ابی داؤد 3960 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 3960 — un lugar de entierro, tumba o descanso.", fr: "Sunan Abi Dawud 3960 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sunan Abi Dawud 3960 - Defin, Mezar ve Türbe", id: "Sunan Abi Dawud 3960 — Pemakaman, Kuburan, dan Tempat Suci" }
text: "حَدَّثَنَا وَهْبُ بْنُ بَقِيَّةَ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، - هُوَ الطَّحَّانُ - عَنْ خَالِدٍ، عَنْ أَبِي قِلاَبَةَ، عَنْ أَبِي زَيْدٍ، أَنَّ رَجُلاً، مِنَ الأَنْصَارِ بِمَعْنَاهُ وَقَالَ - يَعْنِي النَّبِيَّ - \" لَوْ شَهِدْتُهُ قَبْلَ أَنْ يُدْفَنَ لَمْ يُدْفَنْ فِي مَقَابِرِ الْمُسْلِمِينَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3960، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3960 (The Book of Manumission of Slaves), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3960، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3960 (El Libro de la Manumisión de los Esclavos), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 3960 (Livre de l'affranchissement des esclaves), mentionne un lieu de sépulture. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sunan Ebu Davud'da yer alan 3960 numaralı hadiste, defin, mezar ve türbeden bahsedilmektedir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3960, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
