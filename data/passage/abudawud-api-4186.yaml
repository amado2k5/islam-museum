label: { ar: "سنن أبي داود 4186 — أثر من الآثار المحفوظة", en: "Sunan Abi Dawud 4186 — a relic kept after its owner", ur: "سنن ابی داؤد 4186 — محفوظ آثار و تبرکات", es: "Sunan Abi Dawud 4186 — una reliquia conservada después de su dueño.", fr: "Sunan Abi Dawud 4186 — une relique conservée après son propriétaire", tr: "Sünen Ebi Davud 4186 — Korunmuş bir hadis", id: "Sunan Abi Dawud 4186 — Sebuah hadits yang dilestarikan" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا إِسْمَاعِيلُ، أَخْبَرَنَا حُمَيْدٌ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَ شَعْرُ رَسُولِ اللَّهِ إِلَى أَنْصَافِ أُذُنَيْهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4186، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4186 (Combing the Hair (Kitab Al-Tarajjul)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4186، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4186 (El peinado (Kitab Al-Tarajjul)), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4186 (Le Peigne des Cheveux (Kitab Al-Tarajjul)), mentionne une relique conservée après son propriétaire. Le Navigateur des Testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da 4186 numaralı hadis, günümüze kadar ulaşmış bir rivayeti zikretmektedir. Bu hadis, vasiyetnameler, miras, gelenekler ve türbeler üzerine çalışan araştırmacılar tarafından Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4186, menyebutkan sebuah tradisi yang lestari. Hadits ini dikumpulkan oleh para peneliti wasiat, warisan, tradisi, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
