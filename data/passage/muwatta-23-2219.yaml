label: { ar: "الموطأ 2219 — مالك عن ابن شهاب عن عامر بن سعد بن أبي وقاص عن أبيه: جاءه رسول الله يعوده عام حجة الوداع من وجع اشتد به، فقال: أفأتصدق بثلثي مالي؟ قال: لا. فالشطر؟ قال: لا. قال: الثلث، والثلث كثير، إن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكففون الناس", en: "Muwatta 2219", es: "Muwatta 2219", fr: "Muwatta 2219", ur: "موطا 2219", tr: "El-Muvatta 2219 — Malik, İbn Şihab'dan, o da Emir ibn Sa'd ibn Abi Vakkas'tan, o da babasından rivayet eder: Allah Resulü, Veda Hac yılında, ağır bir hastalık geçirdiği sırada onu ziyaret etti. \"Servetimin üçte ikisini sadaka olarak vereyim mi?\" dedi. \"Hayır.\" dedi. \"Yarısını?\" \"Hayır.\" dedi. \"Üçte birini, ki üçte bir çoktur. Mirasçılarını zengin bırakmak, onları fakir ve insanlardan dilenen halde bırakmaktan daha iyidir.\" dedi.", id: "Al-Muwatta 2219 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat 'Amir ibn Sa'd ibn Abi Waqqas, berdasarkan riwayat ayahnya: Rasulullah SAW datang mengunjunginya pada tahun Haji Perpisahan ketika ia sedang sakit parah. Beliau bertanya, \"Haruskah aku memberikan dua pertiga hartaku sebagai sedekah?\" Beliau menjawab, \"Tidak.\" \"Setengah?\" Beliau menjawab, \"Tidak.\" Beliau bersabda, \"Sepertiga, dan sepertiga itu banyak. Lebih baik meninggalkan ahli warismu dalam keadaan kaya daripada meninggalkan mereka dalam keadaan miskin, mengemis kepada orang lain.\"" }
text: "الثُّلُثُ، وَالثُّلُثُ كَثيرٌ"
summary:
  ar: "يروي مالك عن ابن شهاب عن عامر بن سعد بن أبي وقاص عن أبيه أنه قال: جاءني رسول الله يعودني عام حجة الوداع، من وجع اشتد بي، فقلت: يا رسول الله، قد بلغ بي من الوجع ما ترى، وأنا ذو مال، ولا يرثني إلا ابنة لي، أفأتصدق بثلثي مالي؟ قال: لا. فقلت: فالشطر؟ قال: لا. ثم قال رسول الله: الثلث، والثلث كثير، إنك أن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكففون الناس، وإنك لن تنفق نفقة تبتغي بها وجه الله إلا أجرت بها، حتى ما تجعل في في امرأتك. قال: فقلت: يا رسول الله، أأخلف بعد أصحابي؟ فقال رسول الله: إنك لن تخلف، فتعمل عملا صالحا إلا ازددت به درجة ورفعة، ولعلك أن تخلف حتى ينتفع بك أقوام ويضر بك آخرون. اللهم أمض لأصحابي هجرتهم، ولا ترهم على أعقابهم، لكن البائس سعد بن خولة. {cite:muwatta-maruf-1997 p.311} {cite:muwatta-maruf-1997 p.312}"
  tr: "Malik, İbn Şihab'dan, o da Emir ibn Sa'd ibn Abi Vakkas'tan, o da babasından rivayet ederek şöyle dedi: \"Allah'ın Resulü, Veda Hacında beni ziyaret etti. O sırada ağır bir hastalığım vardı. Dedim ki: 'Ey Allah'ın Resulü, hastalığım gördüğünüz noktaya geldi ve zenginim, fakat tek varisim kızım. Servetimin üçte ikisini sadaka olarak verebilir miyim?' 'Hayır' dedi. Dedim ki: 'O halde yarısı?' Dedim ki: 'Hayır'. Bunun üzerine Allah'ın Resulü şöyle dedi: 'Üçte biri, ki üçte biri çoktur. Mirasçılarınızı zengin bırakmanız, onları fakir ve insanlardan dilenmeye mahkum bırakmaktan daha iyidir. Allah'ın rızasını kazanmak için harcadığınız her şeyin karşılığını mutlaka alacaksınız, hatta karınızın ağzına koyduğunuz lokma bile.' Dedim ki: 'Ey Allah'ın Resulü, ben arkadaşlarımdan sonra yaşayacak mıyım?'\" Allah'ın Resulü şöyle buyurdu: \"Saldırgan bir amel işleyecek kadar uzun yaşamazsanız, dereceniz ve makamınız yükselir. Belki de bazıları sizden faydalanır, bazıları ise sizden zarar görür. Ey Allah'ım, arkadaşlarıma hicretlerinin sevabını ver ve onları geri dönmeye bırakma. Fakat Sa'd ibn Khawla ne kadar da zavallıdır!\" {cite:muwatta-maruf-1997 s.311} {cite:muwatta-maruf-1997 s.312}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Amir bin Sa'd bin Abi Waqqas, dari ayahnya, yang berkata: Rasulullah SAW datang mengunjungi saya pada saat Haji Perpisahan, ketika saya sedang sakit parah. Saya berkata, \"Wahai Rasulullah, penyakit saya sudah mencapai titik yang engkau lihat, dan saya kaya, tetapi satu-satunya ahli waris saya adalah seorang putri. Bolehkah saya memberikan dua pertiga harta saya untuk sedekah?\" Beliau menjawab, \"Tidak.\" Saya berkata, \"Lalu setengahnya?\" Beliau menjawab, \"Tidak.\" Kemudian Rasulullah SAW bersabda, \"Sepertiga, dan sepertiga itu banyak. Lebih baik bagimu meninggalkan ahli warismu dalam keadaan kaya daripada meninggalkan mereka dalam keadaan miskin, mengemis kepada manusia. Kamu tidak akan mengeluarkan apa pun untuk mencari ridha Allah kecuali kamu akan diberi pahala, bahkan suapan yang kamu berikan kepada istrimu.\" Saya berkata, \"Wahai Rasulullah, akankah saya hidup setelah para sahabat saya?\" Rasulullah SAW bersabda, \"Kalian tidak akan hidup cukup lama untuk melakukan amal saleh kecuali kalian akan bertambah besar kedudukan dan statusnya. Mungkin kalian akan hidup cukup lama sehingga sebagian orang mendapat manfaat dari kalian dan sebagian lainnya dirugikan oleh kalian. Ya Allah, berilah pahala kepada para sahabatku atas hijrah mereka, dan jangan biarkan mereka kembali ke jalan yang salah. Tetapi celakalah Sa'd bin Khawla.\" {cite:muwatta-maruf-1997 p.311} {cite:muwatta-maruf-1997 p.312}"
