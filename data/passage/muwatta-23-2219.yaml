label: { ar: "الموطأ 2219 — مالك عن ابن شهاب عن عامر بن سعد بن أبي وقاص عن أبيه: جاءه رسول الله يعوده عام حجة الوداع من وجع اشتد به، فقال: أفأتصدق بثلثي مالي؟ قال: لا. فالشطر؟ قال: لا. قال: الثلث، والثلث كثير، إن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكففون الناس", en: "Muwatta 2219" }
text: "الثُّلُثُ، وَالثُّلُثُ كَثيرٌ"
summary:
  ar: "يروي مالك عن ابن شهاب عن عامر بن سعد بن أبي وقاص عن أبيه أنه قال: جاءني رسول الله يعودني عام حجة الوداع، من وجع اشتد بي، فقلت: يا رسول الله، قد بلغ بي من الوجع ما ترى، وأنا ذو مال، ولا يرثني إلا ابنة لي، أفأتصدق بثلثي مالي؟ قال: لا. فقلت: فالشطر؟ قال: لا. ثم قال رسول الله: الثلث، والثلث كثير، إنك أن تذر ورثتك أغنياء خير من أن تذرهم عالة يتكففون الناس، وإنك لن تنفق نفقة تبتغي بها وجه الله إلا أجرت بها، حتى ما تجعل في في امرأتك. قال: فقلت: يا رسول الله، أأخلف بعد أصحابي؟ فقال رسول الله: إنك لن تخلف، فتعمل عملا صالحا إلا ازددت به درجة ورفعة، ولعلك أن تخلف حتى ينتفع بك أقوام ويضر بك آخرون. اللهم أمض لأصحابي هجرتهم، ولا ترهم على أعقابهم، لكن البائس سعد بن خولة. {cite:muwatta-maruf-1997 p.311} {cite:muwatta-maruf-1997 p.312}"
