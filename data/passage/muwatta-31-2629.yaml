label: { ar: "الموطأ 2629 — عائشة: بئس ابن العشيرة ثم ضحك النبي معه، فإن من شر الناس من اتقاه الناس لشره", en: "Muwatta 2629", es: "Muwatta 2629", fr: "Muwatta 2629", ur: "موطا 2629", tr: "Al-Muwatta 2629 — Aişe: Ne kötü bir evlat! Bunun üzerine Peygamber onunla birlikte güldü; çünkü insanların kötülüklerinden korktukları kişiler, en kötü insanlar arasındadır.", id: "Al-Muwatta 2629 — Aisyah: Betapa buruknya anak suku ini! Kemudian Nabi tertawa bersamanya, karena di antara manusia yang paling buruk adalah mereka yang ditakuti orang karena kejahatan mereka." }
summary:
  ar: "يروي مالك أنه بلغه عن عائشة أنها قالت: استأذن رجل على رسول الله وأنا معه في البيت، فقال: بئس ابن العشيرة، ثم أذن له، فلم أنشب أن سمعت ضحك رسول الله معه. فلما خرج الرجل قلت: يا رسول الله، قلت فيه ما قلت ثم ضحكت معه؟ فقال: إن من شر الناس من اتقاه الناس لشره. ويذكر المحقق أن الحديث صحيح من رواية محمد بن المنكدر عن عروة عن عائشة في الصحيحين، وأن رواية مالك فيه بلاغ. {cite:muwatta-maruf-1997 p.488}"
  tr: "Malik, Aişe'den şöyle bir rivayette bulunduğunu aktarır: \"Bir adam, ben Resulullah'ın evinde onunla birlikteyken, onun yanına girmek için izin istedi. 'Ne kötü bir kabile üyesi!' dedi. Sonra ona izin verdi ve kısa bir süre sonra Resulullah'ın onunla güldüğünü duydum. Adam ayrıldıktan sonra, 'Ey Resulullah, onun hakkında bunları söyledikten sonra onunla güldünüz mü?' dedim. O da, 'İnsanların en kötüleri arasında, kötülükleri yüzünden insanların uzak durduğu kimseler de vardır' diye cevap verdi.\" Araştırmacı, hadisin, iki Sahih'te de yer alan Muhammed ibn el-Munkadir'in Urve'den, Aişe'den rivayetine göre sahih olduğunu ve Malik'in rivayetinin ise bir rivayet olduğunu belirtir. {cite:muwatta-maruf-1997 s.488}"
  id: "Malik meriwayatkan bahwa ia mendengar dari Aisyah bahwa ia berkata: Seorang laki-laki meminta izin untuk masuk menemui Rasulullah ketika aku bersamanya di rumah. Ia berkata, \"Betapa buruknya anggota sukunya!\" Kemudian beliau mengabulkannya, dan tak lama kemudian, aku mendengar Rasulullah tertawa bersamanya. Ketika laki-laki itu pergi, aku berkata, \"Wahai Rasulullah, engkau mengatakan apa yang engkau katakan tentangnya, dan kemudian engkau tertawa bersamanya?\" Beliau menjawab, \"Di antara orang-orang yang paling buruk adalah orang-orang yang dijauhi karena kejahatannya.\" Peneliti menyebutkan bahwa hadits ini sahih menurut riwayat Muhammad ibn al-Munkadir dari Urwah dari Aisyah dalam dua kitab Sahih, dan bahwa riwayat Malik adalah sebuah laporan. {cite:muwatta-maruf-1997 p.488}"
