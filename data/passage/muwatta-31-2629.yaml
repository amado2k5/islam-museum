label: { ar: "الموطأ 2629 — عائشة: بئس ابن العشيرة ثم ضحك النبي معه، فإن من شر الناس من اتقاه الناس لشره", en: "Muwatta 2629" }
summary:
  ar: "يروي مالك أنه بلغه عن عائشة أنها قالت: استأذن رجل على رسول الله وأنا معه في البيت، فقال: بئس ابن العشيرة، ثم أذن له، فلم أنشب أن سمعت ضحك رسول الله معه. فلما خرج الرجل قلت: يا رسول الله، قلت فيه ما قلت ثم ضحكت معه؟ فقال: إن من شر الناس من اتقاه الناس لشره. ويذكر المحقق أن الحديث صحيح من رواية محمد بن المنكدر عن عروة عن عائشة في الصحيحين، وأن رواية مالك فيه بلاغ. {cite:muwatta-maruf-1997 p.488}"
