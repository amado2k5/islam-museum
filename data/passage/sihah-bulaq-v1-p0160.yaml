text: |-
  " ⁦(ف صل الواو)⁩
  ٤٨١
  فيجعل أعلاء أسفل والنكس أيضا الرجل الضعيف ( س ناموس الرحل
  صاحب سرّه الذى يطلعه على باطن أمره ويخصه بمايستره عن غيره وأهل السكتاب يسمون
  جبريل عليه السلام الناموس وفى الحديث أنّ ورقة بن نوفل قال نلحديجة رضى اللّٰه عنها
  وهوابن عمها وكان نصرانيا لتن كان ما تقولين حقا انه ليأتيه الناموس الذى كان يأتى موسى
  عليه السلام والناموس قترة الصائد وغست السرّ أنمسه غساكتمته وغست الرجل ونامسته
  اذا ساررته قال الكميت
  فأبلغ يزيدا ان عرضت ومنذرا • وعميهما والمستسر المنامسا
  ويقال المنامس الداخل فى الناموس والناموس أيضا ما يمس الرجل به من الاحتيال
  واغمس الرجل بتشديد المنون أى استنروهوانفعل والنمس بالكسردوييةء ريضة كأنها
  قطعة قديد تكون بأرض مصر تقتل التعبان والنمس بالتحريك فاد السمن وقد غس
  السمن باليكسر أى قسد وس لنوس تذيذب الشئ وقدناس ينوس وأناسه غيره وفى
  حديث أم زرع أناس من حلى أذنى ونست الايل أنوسهانوساسقتها وذونواس من اذواء
  ليمن سمى بذلك لذوا بتين كاتبا تنوسان على ظهره ورجل نوّاس بالتشديداذا اضطرب
  واسترخى والناس قديكون من الانس ومن الجن وأصله أناس نفخفف ولم يجعلوا الالف
  واللام فيه عوضامن الهمزة المحذوفة لانه لو كان كذلك لما اجتمع مع المعوّض منه فى قول
  الشاعر ان المنايا يطلعن على الاناس الامنينا والناس اسم قيس عيلان وهو الناس
  ابن مضر بن نزار وأخوه الياس بن مضر بالياء هس ، هس اللحم أخذه بقدم الاسنان
  يقال نم-ت اللحم وانتهسه بعض ونهس الحية أيضانهشه قال الراجز
  وذات قرنين طمون الضرس • تنهس لوتمكنت من نهس • تديرعينا كشهاب القبس
  والمنهوس القليل اللعم من الرجال والنهس ١ يضاضرب من الطير
  سل الواد جس الوجس الصوت الخنى وفى حديت الحسن فى الرجل
  يجامع المرأة والاخرى تسمع قال كانوا يكرهون الوجس والوجس أبضافزعة القلب
  والواجس الهاجس وأوجس فى نفسه خيفة أى أضمر وكذلك التوجس والتوجس أيضا
  تسمع الى الصوت الخفى قال ذوالرمة يصف صائدا
  اذا نوجس ركزا من -نابكها • أوكان صاحب أرض أوبه الموم
  والاوجس الدهر ويقال لا أفعله سييس الاوحس والاوجس أيضابضم الجيم عن يعقوب
  أى أبداقال الاموى يقال ماذقت عنده أوجس أى شيئا من الطعام دس
  الودس أول نبات الارض يقال ما أحسسن ودسها وأودست الارض وتوتست بحنى أى
  أتيتت ما غطى وجهها ويقال ودس على الشئودسا أى خقى وأين ودست به أى أين خبأته
  وما أدرى أين ودس أى أين ذهب رس الورس نبت أصفر يكون باليمن يتخذعفه
  الغمرة الموجه تقول منه أورس المكان وأورس الرمث أى اصفرّورقه بعبدالادر الن فصار
  عليه مثل الملاء المفرفه ووارس ولا يقال مورس وهومن النوادر وورست الثوب
  توريساصبغته بالورس وملفة وريسة صبغت بالورس ⁦( لسوس)⁩ الو-وسة حديث
  مصاح
