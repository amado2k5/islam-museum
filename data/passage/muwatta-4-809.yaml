label: { ar: "الموطأ 809 — حمزة بن عمرو الأسلمي: أصوم في السفر؟ قال: إن شئت فصم وإن شئت فأفطر", en: "Muwatta 809" }
text: "إن شئت فصم، وإن شئت فأفطر"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن حمزة بن عمرو الأسلمي قال للنبي: يا رسول الله، إني رجل أصوم، أفأصوم في السفر؟ فقال له النبي: إن شئت فصم، وإن شئت فأفطر. ويذكر المحقق أن يحيى رواه هكذا عن هشام عن أبيه عن حمزة، وأن سائر أصحاب مالك رووه عن هشام عن أبيه عن عائشة أن حمزة قال ذلك، وأن الحديث محفوظ عن هشام عن أبيه عن عائشة، كما رواه جماعة منهم ابن عيينة وحماد بن سلمة وابن عجلان ووكيع والليث، وأن ابن عبد البر (التمهيد 22/146–147) رأى أن رواية يحيى ليست خطأ محضاً لأن سليمان بن يسار رواه عن حمزة نفسه، وأن عروة قد يكون سمعه من عائشة ومن أبي مراوح عن حمزة. {cite:muwatta-maruf-1997 p.397}"
