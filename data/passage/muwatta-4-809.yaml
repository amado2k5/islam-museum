label: { ar: "الموطأ 809 — حمزة بن عمرو الأسلمي: أصوم في السفر؟ قال: إن شئت فصم وإن شئت فأفطر", en: "Muwatta 809", es: "Muwatta 809", fr: "Muwatta 809", ur: "موطا 809", tr: "El-Muvatta 809 — Hamza bin Amr el-Aslami: Yolculuk sırasında oruç tutmalı mıyım? Dedi ki: Dilersen oruç tut, dilerse orucunu boz.", id: "Al-Muwatta 809 — Hamza bin Amr Al-Aslami: Apakah saya boleh berpuasa saat bepergian? Beliau menjawab: Jika kamu mau, berpuasalah, dan jika kamu mau, berbukalah." }
text: "إن شئت فصم، وإن شئت فأفطر"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن حمزة بن عمرو الأسلمي قال للنبي: يا رسول الله، إني رجل أصوم، أفأصوم في السفر؟ فقال له النبي: إن شئت فصم، وإن شئت فأفطر. ويذكر المحقق أن يحيى رواه هكذا عن هشام عن أبيه عن حمزة، وأن سائر أصحاب مالك رووه عن هشام عن أبيه عن عائشة أن حمزة قال ذلك، وأن الحديث محفوظ عن هشام عن أبيه عن عائشة، كما رواه جماعة منهم ابن عيينة وحماد بن سلمة وابن عجلان ووكيع والليث، وأن ابن عبد البر ⁦(التمهيد 22/146–147)⁩ رأى أن رواية يحيى ليست خطأ محضاً لأن سليمان بن يسار رواه عن حمزة نفسه، وأن عروة قد يكون سمعه من عائشة ومن أبي مراوح عن حمزة. {cite:muwatta-maruf-1997 p.397}"
  tr: "Malik, Hişam ibn Urvah'tan, onun babasından rivayetle, Hamza ibn Amr el-Aslami'nin Peygamberimize şöyle dediğini nakletmiştir: \"Ey Allah'ın Resulü, ben oruç tutan biriyim. Yolculukta oruç tutabilir miyim?\" Peygamberimiz şöyle cevap vermiştir: \"Dilersen oruç tut; istersen orucunu boz.\" Araştırmacı, Yahya'nın bunu Hişam'dan, onun babasından, onun da Hamza'dan rivayetle bu şekilde naklettiğini ve Malik'in tüm sahabelerinin de bunu Hişam'dan, onun babasından, onun da Aişe'den rivayetle, Hamza'nın böyle söylediğini naklettiğini belirtmektedir. Hadis, Hişam'dan, onun babasından, onun da Aişe'den rivayetle, İbn Uyaynah, Hammad ibn Salamah, İbn Eclan, Vaki' ve el-Layth'in de aralarında bulunduğu bir grup tarafından nakledildiği şekliyle korunmuştur. İbn Abdül-Barr (el-Tamhid 22/146–147), Yahya'nın rivayetinin tamamen yanlış olmadığını düşünmüştür; çünkü Süleyman ibn Yasar bunu bizzat Hamza'dan rivayet etmiş, Urve ise bunu Ayşe'den ve Ebu Merve'den, Hamza'dan duymuş olabilir. {cite:muwatta-maruf-1997 s.397}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa Hamzah ibn Amr al-Aslami berkata kepada Nabi: “Wahai Rasulullah, saya seorang laki-laki yang berpuasa. Bolehkah saya berpuasa ketika bepergian?” Nabi menjawab: “Jika kamu mau, berpuasalah; jika kamu mau, berbukalah.” Peneliti menyebutkan bahwa Yahya meriwayatkannya dengan cara ini, dari Hisham, dari ayahnya, dari Hamzah, dan bahwa semua sahabat Malik meriwayatkannya dari Hisham, dari ayahnya, dari Aisyah, bahwa Hamzah berkata demikian. Hadits ini terpelihara dari Hisham, dari ayahnya, dari Aisyah, sebagaimana diriwayatkan oleh sekelompok orang termasuk Ibn Uyaynah, Hammad ibn Salamah, Ibn Ajlan, Waki’, dan al-Layth. Ibn Abd al-Barr (al-Tamhid 22/146–147) menganggap riwayat Yahya tidak sepenuhnya salah karena Sulayman ibn Yasar meriwayatkannya dari Hamzah sendiri, dan Urwah mungkin mendengarnya dari Aisyah dan dari Abu Marwah dari Hamzah. {cite:muwatta-maruf-1997 p.397}"
