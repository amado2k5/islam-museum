label: { ar: "الموطأ 1510 — مالك: أرى ذلك في المسيس، إذا دخل عليها في بيتها فقالت قد مسني وقال لم أمسها صدق عليها، وإن دخلت عليه في بيته فصدقت عليه", en: "Muwatta 1510", es: "Muwatta 1510", fr: "Muwatta 1510", ur: "موطا 1510", tr: "El-Muvatta 1510 — Malik: Cinsel ilişki konusunda, eğer erkek kadının evine girer ve kadın, “Bana dokundu” derse ve erkek de, “Ona dokunmadım” derse, kadın hakkında erkeğe inanılır. Kadın erkeğin evine girerse, erkek hakkında kadına inanılır." }
summary:
  ar: "يقول مالك أرى ذلك في المسيس، إذا دخل عليها في بيتها فقالت قد مسني، وقال لم أمسها، صدق عليها، فإن دخلت عليه في بيته، فقال لم أمسها، وقالت قد مسني، صدقت عليه. {cite:muwatta-maruf-1997 p.34}"
  tr: "Malik şöyle diyor: Cinsel ilişki durumunda, eğer erkek kadının evine girer ve kadın “Bana dokundu” derse, erkek de “Ona dokunmadım” derse, erkeğe inanılmalıdır. Fakat kadın erkeğin evine girer ve erkek “Ona dokunmadım” derse, kadın da “Bana dokundu” derse, erkeğe inanılmalıdır. {cite:muwatta-maruf-1997 s.34}"
  id: "Malik berkata: Saya melihat bahwa dalam kasus hubungan seksual, jika dia masuk ke rumah wanita itu dan wanita itu berkata, “Dia menyentuh saya,” dan dia berkata, “Saya tidak menyentuhnya,” maka perkataannya harus dipercaya. Tetapi jika wanita itu masuk ke rumah pria itu dan pria itu berkata, “Saya tidak menyentuhnya,” dan wanita itu berkata, “Dia menyentuh saya,” maka perkataannya harus dipercaya. {cite:muwatta-maruf-1997 p.34}"
