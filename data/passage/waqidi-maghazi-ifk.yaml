label: { ar: "ذكر عائشة وأصحاب الإفك — تلاوة براءتها على المنبر", en: "The slander affair — the exoneration of Aisha read from the pulpit", es: "El caso de la difamación: la exoneración de Aisha leída desde el púlpito.", fr: "L'affaire de la diffamation — l'acquittement d'Aïcha lu en chaire", ur: "غیبت کا معاملہ - منبر سے پڑھی گئی عائشہ کی معافی", tr: "Ayşe'den ve iftiracılardan bahsedilmesi - minberden onun masumiyetinin dile getirilmesi", id: "Penyebutan Aisha dan orang-orang yang memfitnahnya — membacakan pembelaan atas ketidakbersalahannya dari mimbar." }
text: "فخرج رسول الله إلى الناس مسرورا فصعد على المنبر فحمد الله وأثنى عليه بما هو أهله، ثم تلا عليهم بما نزل عليه في براءة عائشة"
summary:
  ar: "يفصّل الواقدي قصة الإفك كاملة: اتهام المشركين والمنافقين لعائشة، وتنزيل البراءة، وخرج النبي مسرورا فصعد المنبر وتلا ما نزل عليه في براءتها. وتروي الصفحة براءة زينب بنت جحش من اتهام آخر ونزول آية الحجاب التي كانت في هذا الباب، وهو أول الخلوة بالنساء. وتذكر أم سلمة قولها «كنت أول من علم براءة عائشة»."
  en: "Waqidi narrates the whole slander affair: the accusation against Aisha, the revelation of her exoneration, and the Prophet ascending the pulpit in joy to recite it. The same chapter reports Zaynab bint Jahsh's exoneration and the descent of the hijab verse, and Umm Salama's remark that she was the first to know of Aisha's innocence."
  es: "Waqidi narra todo el asunto de la calumnia: la acusación contra Aisha, la revelación de su exoneración y el Profeta subiendo al púlpito con alegría para recitarla. El mismo capítulo relata la exoneración de Zaynab bint Jahsh y la revelación del versículo del hiyab, así como el comentario de Umm Salama de que ella fue la primera en saber de la inocencia de Aisha."
  fr: "Waqidi relate toute l'affaire de la calomnie: l'accusation portée contre Aïcha, la révélation de son innocence et le Prophète montant en chaire, joyeux, pour la proclamer. Le même chapitre relate l'acquittement de Zaynab bint Jahsh et la révélation du verset sur le hijab, ainsi que la remarque d'Umm Salama, qui se dit la première à avoir eu connaissance de l'innocence d'Aïcha."
  ur: "واقدی نے تمام تہمت کے معاملے کو بیان کیا: عائشہ پر الزام، ان کی معافی کا انکشاف، اور نبی اس کی تلاوت کرنے کے لئے خوشی میں منبر پر چڑھتے ہیں۔ اسی باب میں زینب بنت جحش کی بے گناہی اور حجاب کی آیت کے نزول اور ام سلمہ کے اس قول کی خبر دی گئی ہے کہ عائشہ کی بے گناہی کے بارے میں سب سے پہلے وہ جانتی تھیں۔"
  tr: "El-Vakidi, iftiranın tüm öyküsünü ayrıntılarıyla anlatır: Aişe'ye müşrikler ve münafıklar tarafından yöneltilen suçlamalar, masumiyetinin ortaya çıkması ve Peygamber'in onu aklayan ayetleri okumak için minbere sevinçle çıkışı. Sayfa ayrıca Zeynep bint Cahş'ın başka bir suçlamadan aklanmasını ve bu konuyla ilgili olan hicap ayetinin vahyedilmesini, kadınlarla ilk kez yalnız kalma örneğini de anlatır. Ümmü Seleme'nin, \"Aişe'nin masumiyetini ilk öğrenen bendim\" dediği aktarılır."
  id: "Al-Waqidi merinci seluruh kisah fitnah tersebut: tuduhan yang dilayangkan terhadap Aisyah oleh kaum musyrik dan munafik, terungkapnya ketidakbersalahannya, dan kegembiran Nabi yang naik ke mimbar untuk membacakan ayat-ayat yang membebaskannya. Halaman itu juga menceritakan pembebasan Zaynab bint Jahsh dari tuduhan lain dan terungkapnya ayat tentang hijab, yang berkaitan dengan masalah ini, menandai contoh pertama pengasingan diri bersama wanita. Umm Salama dikutip mengatakan, \"Saya adalah orang pertama yang mengetahui tentang ketidakbersalahan Aisyah.\""
