label: { ar: "الموطأ 1495 — مالك: بلغه أن القاسم بن محمد وسالم بن عبد الله كانا ينكحان بناتهما الأبكار ولا يستأمرانهن", en: "Muwatta 1495", es: "Muwatta 1495", fr: "Muwatta 1495", ur: "موطا 1495", tr: "El-Muvatta 1495 — Malik: Kendisine, El-Kâsım bin Muhammed ve Salim bin Abdullah'ın bakire kızlarını onlara danışmadan evlendirdikleri bildirildi.", id: "Al-Muwatta 1495 — Malik: Dia diberitahu bahwa Al-Qasim bin Muhammad dan Salim bin Abdullah biasa menikahkan putri-putri mereka yang masih perawan tanpa berkonsultasi dengan mereka." }
summary:
  ar: "يروي مالك أنه بلغه أن القاسم بن محمد وسالم بن عبد الله كانا ينكحان بناتهما الأبكار ولا يستأمرانهن، ويقول مالك وذلك الأمر عندنا في نكاح الأبكار. {cite:muwatta-maruf-1997 p.29}"
  tr: "Malik, el-Kâsım ibn Muhammed ve Salim ibn Abdullah'ın bakire kızlarını onlara danışmadan evlendirdiklerini duyduğunu aktarıyor ve Malik, bakirelerin evliliği konusunda bizde de böyle bir uygulamanın olduğunu söylüyor. {cite:muwatta-maruf-1997 s.29}"
  id: "Malik menceritakan bahwa ia mendengar bahwa al-Qasim ibn Muhammad dan Salim ibn Abdullah biasa menikahkan putri-putri mereka yang masih perawan tanpa berkonsultasi dengan mereka, dan Malik mengatakan bahwa ini adalah praktik di antara kita mengenai pernikahan gadis perawan. {cite:muwatta-maruf-1997 p.29}"
