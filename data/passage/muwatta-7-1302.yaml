label: { ar: "الموطأ 1302 — مالك فيمن وجد من العدو على ساحل بلاد المسلمين يزعم أنه تاجر، فالأمر للإمام يرى فيهم رأيه", en: "Muwatta 1302" }
summary:
  ar: "يقول مالك فيمن وجد من العدو على ساحل البحر بأرض المسلمين، فزعموا أنهم تجار وأن البحر لفظهم، إن المسلمين لا يعرفون صدق ذلك إلا أن مراكبهم تكسرت أو عطشوا فنزلوا بغير إذن المسلمين. يرى مالك أن ذلك للإمام، يرى فيهم رأيه، ولا يرى لمن أخذهم فيهم خمسا. {cite:muwatta-maruf-1997 p.581}"
