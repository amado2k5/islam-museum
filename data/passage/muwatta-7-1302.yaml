label: { ar: "الموطأ 1302 — مالك فيمن وجد من العدو على ساحل بلاد المسلمين يزعم أنه تاجر، فالأمر للإمام يرى فيهم رأيه", en: "Muwatta 1302", es: "Muwatta 1302", fr: "Muwatta 1302", ur: "موطا 1302", tr: "El-Muvatta 1302 — Malik, Müslüman topraklarının kıyısında düşmanlar arasında bulunan ve tüccar olduğunu iddia eden bir kişi hakkında şöyle demiştir: Bu mesele imamın kararına kalmıştır.", id: "Al-Muwatta 1302 — Malik berkata mengenai seseorang yang ditemukan di antara musuh di pesisir negeri Muslim dan mengaku sebagai pedagang: masalah itu terserah kepada Imam untuk memutuskan." }
summary:
  ar: "يقول مالك فيمن وجد من العدو على ساحل البحر بأرض المسلمين، فزعموا أنهم تجار وأن البحر لفظهم، إن المسلمين لا يعرفون صدق ذلك إلا أن مراكبهم تكسرت أو عطشوا فنزلوا بغير إذن المسلمين. يرى مالك أن ذلك للإمام، يرى فيهم رأيه، ولا يرى لمن أخذهم فيهم خمسا. {cite:muwatta-maruf-1997 p.581}"
  tr: "Malik, Müslüman kıyılarında bulunan ve tüccar olduklarını iddia eden, denizin onları karaya attığını söyleyen düşman savaşçıları hakkında, Müslümanların bunu ancak gemilerinin batmış olması veya susamış olup Müslümanların izni olmadan karaya çıkmış olmaları ihtimaliyle doğrulayabileceğini söyler. Malik, meselenin, kaderlerine karar verme yetkisine sahip olan İmam'a ait olduğuna inanır ve onları ele geçirenin ganimetin beşte birine hak sahibi olduğunu düşünmez. {cite:muwatta-maruf-1997 s.581}"
  id: "Malik mengatakan mengenai para pejuang musuh yang ditemukan di pantai Muslim yang mengaku sebagai pedagang dan bahwa laut telah membawa mereka ke darat, bahwa kaum Muslim tidak dapat memverifikasi hal ini kecuali dengan kemungkinan bahwa kapal mereka karam atau mereka kehausan dan mendarat tanpa izin kaum Muslim. Malik percaya bahwa masalah ini berada di tangan Imam, yang memiliki wewenang untuk memutuskan nasib mereka, dan dia tidak menganggap orang yang menangkap mereka berhak atas seperlima (dari rampasan perang). {cite:muwatta-maruf-1997 p.581}"
