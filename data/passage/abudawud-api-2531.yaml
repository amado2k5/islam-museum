label: { ar: "سنن أبي داود 2531 — مداواة الجراح، مداواة النساء للجرحى", en: "Sunan Abi Dawud 2531 — the treatment of wounds; women treating the wounded", ur: "سنن ابی داؤد 2531 — زخموں کا علاج، خواتین کا زخمیوں کا علاج", es: "Sunan Abi Dawud 2531 — El tratamiento de las heridas; mujeres que tratan a los heridos", fr: "Sunan Abi Dawud 2531 — Le traitement des plaies; les femmes soignant les blessés", tr: "Sunan Abi Davud 2531 — Yaraları tedavi eden kadınlar, yaralıları tedavi ediyor", id: "Sunan Abi Dawud 2531 — Mengobati luka, wanita mengobati orang yang terluka" }
text: "حَدَّثَنَا عَبْدُ السَّلاَمِ بْنُ مُطَهِّرٍ، حَدَّثَنَا جَعْفَرُ بْنُ سُلَيْمَانَ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ، قَالَ : كَانَ رَسُولُ اللَّهِ يَغْزُو بِأُمِّ سُلَيْمٍ وَنِسْوَةٍ مِنَ الأَنْصَارِ لِيَسْقِينَ الْمَاءَ وَيُدَاوِينَ الْجَرْحَى."
summary:
  ar: "حديث في سنن أبي داود، رقم 2531، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 2531 (Jihad (Kitab Al-Jihad)), that mentions the treatment of wounds, women treating the wounded, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 2531، جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2531 (Yihad (Kitab Al-Jihad)), menciona el tratamiento de heridas, a las mujeres que atienden a los heridos y la búsqueda de atención médica. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 2531 (Jihad), mentionne le traitement des blessures, notamment les soins prodigués par les femmes aux blessés, et la recherche de soins. Le Répertoire des médicaments le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 2531 numaralı hadis, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve genel olarak tıbbi tedaviden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2531, menyebutkan tentang pengobatan luka, wanita yang merawat orang terluka, dan pengobatan medis secara umum. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
