text: "… الطَّيَالِسِيُّ حَدَّثَنَا شُعْبَةُ، أَخْبَرَنَا سَعْدُ بْنُ إِبْرَاهِيمَ، قَالَ سَمِعْتُ أَبَا عُبَيْدَةَ بْنَ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، يُحَدِّثُ عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ إِذَا جَلَسَ فِي الرَّكْعَتَيْنِ الأُولَيَيْنِ كَأَنَّهُ عَلَى الرَّضْفِ. قَالَ شُعْبَةُ ثُمَّ حَرَّكَ سَعْدٌ شَفَتَيْهِ بِشَيْءٍ فَأَقُولُ حَتَّى يَقُومَ فَيَقُولُ حَتَّى يَقُومَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ إِلاَّ أَنَّ أَبَا عُبَيْدَةَ لَمْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 366، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 366 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 366، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 366 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 366 (Le Livre de la Salat (Prière)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
