text: "… ومن البزور الحلبة، وبزر الكرفس، والخطمي. وربما نفع وضع المحاجم على المعدة في الأوجاع الباردة منفعة شديدة. واعلم أن تسخين الأطراف يؤدي إلى تسخين المعدة عن قريب، وأنت تعلم ذلك. فصل : في علاج سوء المزاج الرطب للمعدة يعالج بالناشفات، …"
