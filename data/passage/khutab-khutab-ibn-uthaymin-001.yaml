text: "أصابهم من المصائب إلى أسبابه الحقيقية الشرعية، التي بينتها في كتابك وعلى لسان رسولك محمد الف اللهم ارزق الأمة الإسلامية وولاتها رجوعا إليك، رجوعا حقيقيا في الظاهر والباطن، في القول والفعل، حتى تصلح الأمة. لأن صلاح الولاة صلاح الأمة، أي"
