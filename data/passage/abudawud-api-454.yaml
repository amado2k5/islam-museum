text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَ مَوْضِعُ الْمَسْجِدِ حَائِطًا لِبَنِي النَّجَّارِ فِيهِ حَرْثٌ وَنَخْلٌ وَقُبُورُ الْمُشْرِكِينَ فَقَالَ رَسُولُ اللَّهِ \" ثَامِنُونِي بِهِ \". فَقَالُوا لاَ نَبْغِي بِهِ ثَمَنًا. فَقُطِعَ النَّخْلُ وَسُوِّيَ الْحَرْثُ وَنُبِشَ قُبُورُ الْمُشْرِكِينَ وَسَاقَ الْحَدِيثَ وَقَالَ \" فَاغْفِرْ \". مَكَانَ \" فَانْصُرْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 454، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 454 (Prayer (Kitab Al-Salat)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 454، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 454 (Oración (Kitab Al-Salat)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
