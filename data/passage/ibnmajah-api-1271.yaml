label: { ar: "سنن ابن ماجه 1271 — الأب والأبوة", en: "Sunan Ibn Majah 1271 — the father and fatherhood", ur: "سنن ابن ماجہ 1271 — باپ اور والدیت", es: "Sunan Ibn Majah 1271 — El padre y la paternidad", fr: "Sunan Ibn Majah 1271 — le père et la paternité" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَفَّانُ، حَدَّثَنَا مُعْتَمِرٌ، عَنْ أَبِيهِ، عَنْ بَرَكَةَ، عَنْ بَشِيرِ بْنِ نَهِيكٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ـ اسْتَسْقَى حَتَّى رَأَيْتُ - أَوْ رُؤِيَ - بَيَاضُ إِبْطَيْهِ. قَالَ مُعْتَمِرٌ أُرَاهُ فِي الاِسْتِسْقَاءِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1271، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1271 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1271، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1271 (Establecimiento de la oración y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1271 (L'établissement de la prière et la Sunna à leur sujet), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
