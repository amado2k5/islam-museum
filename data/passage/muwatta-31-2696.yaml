label: { ar: "الموطأ 2696 — عبد الله بن عمر: عمر يتمنى قفعة يأكل منها الجراد", en: "Muwatta 2696", es: "Muwatta 2696", fr: "Muwatta 2696", ur: "موطا 2696", tr: "El-Muvatta 2696 — Abdullah bin Ömer: Ömer, çekirgelerin yiyebileceği bir kase diledi.", id: "Al-Muwatta 2696 — Abdullah bin Umar: Umar menginginkan sebuah mangkuk yang dapat dimakan oleh belalang." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار عن عبد الله بن عمر أنه قال: سُئل عمر بن الخطاب عن الجراد فقال: وددت أن عندي قفعة نأكل منه. {cite:muwatta-maruf-1997 p.522}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den rivayet ettiğine göre, Ömer ibn el-Hattab'a çekirgeler sorulduğunda şöyle demiştir: \"Keşke bir kase dolusu çekirgem olsa da, hepsini yiyebilsek.\" {cite:muwatta-maruf-1997 s.522}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, dari Abdullah ibn Umar, bahwa ia berkata: Umar ibn al-Khattab ditanya tentang belalang, dan dia berkata: Aku berharap aku punya semangkuk belalang agar kita bisa memakannya. {cite:muwatta-maruf-1997 p.522}"
