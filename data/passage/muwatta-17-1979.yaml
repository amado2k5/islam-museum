label: { ar: "الموطأ 1979 — يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام: أيما رجل باع متاعا فأفلس الذي ابتاعه، ولم يقبض من ثمنه شيئا فوجده بعينه فهو أحق به", en: "Muwatta 1979", es: "Muwatta 1979", fr: "Muwatta 1979", ur: "موطا 1979", tr: "El-Muvatta 1979 — Yahya, Malik'ten, o da İbn Şihab'dan, o da Ebu Bekr ibn Abdülrahman ibn Haris ibn Hişam'dan rivayetle: Bir kimse mal satar ve alıcı iflas ederse ve bedelinin hiçbirini almamışsa, daha sonra malları asıl hallerinde bulursa, mallar üzerinde daha büyük hakka sahiptir.", id: "Al-Muwatta 1979 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Ibn Shihab berdasarkan riwayat Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham: Jika seseorang menjual barang dan pembeli bangkrut, dan dia belum menerima sebagian pun dari harga jual, lalu menemukan barang tersebut dalam kondisi semula, maka dia memiliki hak yang lebih besar atas barang tersebut." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام أن رسول الله قال: أيما رجل باع متاعا، فأفلس الذي ابتاعه منه، ولم يقبض الذي باعه من ثمنه شيئا، فوجده بعينه، فهو أحق به. وإن مات الذي ابتاعه، فصاحب المتاع فيه أسوة الغرماء. ويذكر المحقق أن ابن عبد البر قال إن الحديث في جميع الموطآت مرسل عند مالك، وأن عبد الرزاق رواه عن مالك مسندا إلى أبي هريرة. {cite:muwatta-maruf-1997 p.209} {cite:muwatta-maruf-1997 p.210}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, dari Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: “Jika seseorang menjual barang, dan pembeli barang tersebut bangkrut, dan penjual belum menerima sebagian pun dari harga jual, lalu menemukan barang tersebut dalam keadaan semula, maka ia berhak atas barang tersebut. Dan jika pembeli meninggal dunia, maka pemilik barang tersebut memiliki hak yang sama seperti kreditur lainnya.” Peneliti menyebutkan bahwa Ibn Abd al-Barr mengatakan bahwa hadits ini mursal (hadits dengan rantai periwayatan yang hilang) dalam semua koleksi Muwatta menurut Malik, dan bahwa Abd al-Razzaq meriwayatkannya dari Malik dengan rantai periwayatan yang kembali kepada Abu Hurayrah. {kutip:muwatta-maruf-1997 hal.209} {kutip:muwatta-maruf-1997 hal.210}"
