label: { ar: "الموطأ 1979 — يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام: أيما رجل باع متاعا فأفلس الذي ابتاعه، ولم يقبض من ثمنه شيئا فوجده بعينه فهو أحق به", en: "Muwatta 1979" }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن أبي بكر بن عبد الرحمن بن الحارث بن هشام أن رسول الله قال: أيما رجل باع متاعا، فأفلس الذي ابتاعه منه، ولم يقبض الذي باعه من ثمنه شيئا، فوجده بعينه، فهو أحق به. وإن مات الذي ابتاعه، فصاحب المتاع فيه أسوة الغرماء. ويذكر المحقق أن ابن عبد البر قال إن الحديث في جميع الموطآت مرسل عند مالك، وأن عبد الرزاق رواه عن مالك مسندا إلى أبي هريرة. {cite:muwatta-maruf-1997 p.209} {cite:muwatta-maruf-1997 p.210}"
