text: "… ما في الحديث من قوله: كالرَّاتِعِ حَوْلَ الحِمَىٰ يُوشِكُ أَن يَقَعَ فيه و الحديث: لَعَنَ اللَّهُ السارقَ يسرِقُ البَيضَةَ فتُقْطعُ يدُه، ويسرقُ الحبلَ فتُقطعُ يدُه. وقول من قال: إني لأجعل بيني وبين الحرام سترةً من الحلال ولا أحرِّمها. وهو أصلٌ …"
