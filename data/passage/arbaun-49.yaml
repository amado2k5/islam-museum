label: { ar: "الأربعون 49 — لو أنكم توكلون على الله حق توكله لرزقكم", en: "Arba'un 49 — were you to trust in God as He deserves", es: "Arba'un 49 — si confiaras en Dios como Él se merece", fr: "Arba'un 49 — si vous aviez confiance en Dieu comme Il le mérite", ur: "اربعون 49 - کیا آپ خدا پر بھروسہ کریں جیسا کہ وہ مستحق ہے۔" }
text: "لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير تغدو خماصاً وتروح بطاناً"
summary:
  ar: "حديث عمر بن الخطاب عن النبي قال: «لو أنكم توكلون على الله حق توكله لرزقكم كما يرزق الطير تغدو خماصاً وتروح بطاناً» — سابع الأحاديث التي زادها ابن رجب؛ أخرجه أحمد 1/30 و52 والترمذي (2344) وقال حسن صحيح والنسائي وابن ماجه (4164) وابن حبان (730) والحاكم 4/318 كلهم من رواية عبد الله بن هبيرة سمع أبا تميم الجيشاني سمع عمر يحدثه عن النبي، وأبو تميم وعبد الله بن هبيرة خرج لهما مسلم ووثقهما غير واحد — أبو تميم ولد في حياة النبي وهاجر إلى المدينة في زمن عمر، وأبو هبيرة ذكره ابن حبان في الثقات ووثقه أحمد؛ وروي من حديث ابن عمر في تاريخ أصبهان لأبي نعيم لكن في إسناده من لا يعرف حاله — قال أبو حاتم الرازي فيه سعيد بن إسحاق بن الحمار مجهول لا أعرفه ⁦(جامع العلوم والحكم ص 914–926)⁩."
  en: "The hadith of Umar ibn al-Khattab from the Prophet: 'were you to put your trust in God as He deserves, He would provide for you as He provides for the birds — they set out hungry in the morning and return full in the evening' — the seventh of Ibn Rajab's added hadiths, transmitted by Ahmad (1/30, 52), al-Tirmidhi (2344, hasan sahih), al-Nasa'i, Ibn Majah (4164), Ibn Hibban (730) and al-Hakim (4/318), all through Abdullah ibn Hubayra who heard Abu Tamim al-Jayshani narrate Umar's report from the Prophet — both Abu Tamim and Ibn Hubayra used by Muslim and declared trustworthy by many, Abu Tamim having been born in the Prophet's lifetime and emigrated to Medina under Umar, Ibn Hubayra listed in Ibn Hibban's Thiqat and authenticated by Ahmad; a route through Ibn Umar exists in Abu Nu'aym's Tarikh Asbahan but contains narrators of unknown standing — Abu Hatim al-Razi naming Sa'id ibn Ishaq ibn al-Himmar as unknown (Jami' al-Ulum wal-Hikam pp. 914–926)."
  es: "El hadiz de Umar ibn al-Khattab del Profeta: 'Si confiaras en Dios como Él merece, Él te proveería como provee a los pájaros: salen hambrientos por la mañana y regresan saciados por la tarde'. El séptimo de los hadices añadidos por Ibn Rajab, transmitido por Ahmad (1/30, 52), al-Tirmidhi (2344, hasan sahih), al-Nasa'i, Ibn Majah (4164), Ibn Hibban (730) y al-Hakim (4/318), todos a través de Abdullah ibn Hubayra, quien escuchó a Abu Tamim al-Jayshani narrar el informe de Umar del Profeta. Tanto Abu Tamim como Ibn Hubayra fueron utilizados por Muslim y declarados dignos de confianza por muchos. Abu Tamim nació en vida del Profeta y emigró a Medina bajo el mandato de Umar. Ibn Hubayra figura en el Thiqat de Ibn Hibban. autenticado por Ahmad; Existe una ruta a través de Ibn Umar en Tarikh Asbahan de Abu Nu'aym, pero contiene narradores de reputación desconocida: Abu Hatim al-Razi nombra a Sa'id ibn Ishaq ibn al-Himmar como desconocido (Jami' al-Ulum wal-Hikam págs. 914-926)."
  fr: "Le hadith d'Umar ibn al-Khattab du Prophète: « Si vous placiez votre confiance en Dieu comme Il le mérite, Il pourvoirait à vos besoins comme Il pourvoit aux besoins des oiseaux — ils partent affamés le matin et reviennent rassasiés le soir » — le septième des hadiths ajoutés par Ibn Rajab, transmis par Ahmad (1/30, 52), al-Tirmidhi (2344, hasan sahih), al-Nasa'i, Ibn Majah (4164), Ibn Hibban (730) et al-Hakim (4/318), tous transmis par Abdullah ibn Hubayra qui a entendu Abu Tamim al-Jayshani rapporter le hadith d'Umar du Prophète — Abu Tamim et Ibn Hubayra ont tous deux été utilisés par Muslim et déclarés dignes de confiance par beaucoup, Abu Tamim étant né du vivant du Prophète et ayant émigré à Médine sous Umar, Ibn Hubayra étant répertorié dans le Thiqat d'Ibn Hibban et authentifié par Ahmad; une route passant par Ibn Umar existe dans le Tarikh Asbahan d'Abu Nu'aym mais contient des narrateurs de statut inconnu - Abu Hatim al-Razi nommant Sa'id ibn Ishaq ibn al-Himmar comme inconnu (Jami' al-Ulum wal-Hikam pp. 914-926)."
  ur: "عمر بن الخطاب کی حدیث: 'اگر تم اللہ پر بھروسہ کرو جیسا کہ اس کا حق ہے تو وہ تمہیں رزق دے گا جیسا کہ پرندوں کو فراہم کرتا ہے - وہ صبح کو بھوکے نکلتے ہیں اور شام کو پیٹ بھر کر لوٹتے ہیں' - ابن رجب کی اضافی احادیث میں سے ساتویں، احمد ⁦(1/30، ص 53، 53)⁩، الاحادیث نے روایت کی ہے۔ النسائی، ابن ماجہ (4164)، ابن حبان (730) اور الحکیم (4/318)، تمام عبداللہ بن حبیرہ کے ذریعے جنہوں نے ابو تمیم الجیشانی کو عمر کی روایت رسول اللہ سے بیان کرتے ہوئے سنا - ابو تمیم اور ابن ہبیرہ دونوں ہی مسلم کے ذریعہ استعمال کیے گئے تھے اور بہت سے ابو تمیم کو تاحیات ثقہ قرار دیا گیا تھا۔ عمر کے تحت مدینہ ہجرت کی، ابن ہبیرہ ابن حبان کی تصنیف میں درج ہے اور احمد نے اس کی تصدیق کی ہے۔ ابو نعیم کی تاریخ اصبہان میں ابن عمر سے گزرنے کا راستہ موجود ہے لیکن اس میں نامعلوم راویوں پر مشتمل ہے - ابو حاتم الرازی نے سعید ابن اسحاق ابن الحمر کو نامعلوم قرار دیا ہے ⁦(جامع العلوم والحکم صفحہ 914-926)⁩۔"
