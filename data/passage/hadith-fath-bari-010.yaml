text: "العاص الأصغر هو ابن عم أم خالد المذكورة، وسيأتي شرح الحديث في كتاب اللباس (٢) إن شاء الله تعالى . الحديث الرابع: حديث عبد الله وهو ابن مسعود، وسليمان في الإسناد هو الأعمش . قوله: (فلما رجعنا من عند النجاشي)"
