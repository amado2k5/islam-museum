label: { ar: "الموطأ 1957 — مالك: في الرجل يقدم له أصناف من البز، ويحضره السوام، فيقرأ عليهم برنامجه، فيشترون الأغدال على ما وصف لهم، ثم يفتحونها فيستغلونها ويندمون: ذلك لازم لهم إذا كان موافقا للبرنامج الذي باعهم عليه", en: "Muwatta 1957", es: "Muwatta 1957", fr: "Muwatta 1957", ur: "موطا 1957", tr: "El-Muvatta 1957 — Malik: Bir adama çeşitli kumaşlar sunulur, hayvanlar getirilir ve o da onlara programını okur; onlar da onun anlattığına göre kumaşları satın alırlar, sonra onları açıp kullanırlar ve pişman olurlar: Eğer bu, adamın sattığı programa uygunsa, onlar için bağlayıcıdır.", id: "Al-Muwatta 1957 — Malik: Mengenai seorang pria yang dipersembahkan berbagai jenis kain, dan ternak dibawa kepadanya, lalu dia membacakan rencananya kepada mereka, dan mereka membeli kain sesuai dengan apa yang dia jelaskan kepada mereka, kemudian mereka membukanya dan menggunakannya dan menyesalinya: itu mengikat mereka jika sesuai dengan rencana yang dia tawarkan saat menjualnya." }
summary:
  ar: "قال مالك في الرجل يقدم له أصناف من البز، ويحضره السوام، ويقرأ عليهم برنامجه، ويقول: في كل عدل كذا وكذا ملحفة بصرية، وكذا وكذا ريطة سابرية، ذرعها كذا وكذا، ويسمي لهم أصنافا من البز بأجناسه، ويقول: اشتروا مني على هذه الصفة. فيشترون الأغدال على ما وصف لهم، ثم يفتحونها فيستغلونها ويندمون. قال مالك: ذلك لازم لهم، إذا كان موافقا للبرنامج الذي باعهم عليه. قال مالك: وهذا الأمر الذي لم يزل عليه الناس عندنا، يجيزونه بينهم، إذا كان المتاع موافقا للبرنامج، ولم يكن مخالفا له. {cite:muwatta-maruf-1997 p.200} {cite:muwatta-maruf-1997 p.201}"
  tr: "Malik, bir adamın alıcıya çeşitli kumaş türleri sunması ve alıcının da onlara listesini okuyarak, “Her demette şu kadar Basra pelerini ve şu kadar Sabari pelerini var, uzunlukları şu kadar” demesi ve kumaşların çeşitlerini isimlendirerek, “Bu özelliklere göre benden satın alın” demesi üzerine, alıcıların demetleri tarif ettiği gibi satın alıp, açıp kullandıklarında pişman olmaları üzerine Malik şöyle demiştir: “Eğer sattığı mallar listedeki özelliklere uygunsa, bu onlar için bağlayıcıdır.” Malik şöyle devam etmiştir: “Bu, aramızda her zaman uygulanan bir gelenektir; mallar listedeki özelliklere uygunsa ve listeye aykırı değilse, insanlar bunu kendi aralarında da kabul ederler.” {cite:muwatta-maruf-1997 s.200} {cite:muwatta-maruf-1997 s.201}"
  id: "Malik berkata tentang seorang pria yang menawarkan berbagai jenis kain kepada pembeli, dan pembeli membacakan daftarnya kepada mereka, sambil berkata: “Dalam setiap bundel terdapat sekian banyak jubah Basra, dan sekian banyak jubah Sabari, dengan panjang sekian dan sekian,” dan ia menyebutkan berbagai jenis kain tersebut kepada mereka, sambil berkata: “Belilah dari saya sesuai dengan spesifikasi ini.” Maka mereka membeli bundel-bundel tersebut sesuai dengan deskripsinya, kemudian mereka membukanya, menggunakan barang-barang tersebut, dan menyesalinya. Malik berkata: Ini mengikat mereka, jika sesuai dengan daftar yang ia berikan saat menjualnya. Malik berkata: Ini adalah kebiasaan yang selalu diikuti orang-orang di antara kita; mereka memperbolehkannya di antara mereka sendiri, jika barang-barang tersebut sesuai dengan daftar dan tidak bertentangan dengannya. {cite:muwatta-maruf-1997 p.200} {cite:muwatta-maruf-1997 p.201}"
