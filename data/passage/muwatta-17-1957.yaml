label: { ar: "الموطأ 1957 — مالك: في الرجل يقدم له أصناف من البز، ويحضره السوام، فيقرأ عليهم برنامجه، فيشترون الأغدال على ما وصف لهم، ثم يفتحونها فيستغلونها ويندمون: ذلك لازم لهم إذا كان موافقا للبرنامج الذي باعهم عليه", en: "Muwatta 1957" }
summary:
  ar: "قال مالك في الرجل يقدم له أصناف من البز، ويحضره السوام، ويقرأ عليهم برنامجه، ويقول: في كل عدل كذا وكذا ملحفة بصرية، وكذا وكذا ريطة سابرية، ذرعها كذا وكذا، ويسمي لهم أصنافا من البز بأجناسه، ويقول: اشتروا مني على هذه الصفة. فيشترون الأغدال على ما وصف لهم، ثم يفتحونها فيستغلونها ويندمون. قال مالك: ذلك لازم لهم، إذا كان موافقا للبرنامج الذي باعهم عليه. قال مالك: وهذا الأمر الذي لم يزل عليه الناس عندنا، يجيزونه بينهم، إذا كان المتاع موافقا للبرنامج، ولم يكن مخالفا له. {cite:muwatta-maruf-1997 p.200} {cite:muwatta-maruf-1997 p.201}"
