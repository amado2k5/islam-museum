text: "… وسيأتي بيان ذلك وبرهانه في المثار الثاني للشبهة وهي شبهة الخلط فقد اتضح من هذا حكم حلال شك في طريان محرم عليه أو ظن وحكم حرام شك في طريان محلل عليه أو ظن وبان الفرق بين ظن يستند إلى علامة …"
summary:
