label: { ar: "الموطأ 663 — مالك: عشرة دنانير تجر فيها فحال الحول وقد بلغت عشرين يزكيها مكانها", en: "Muwatta 663" }
summary:
  ar: "قول لمالك في رجل له عشرة دنانير فتجر فيها فحال عليها الحول وقد بلغت عشرين ديناراً: أنه يزكيها مكانها ولا ينتظر بها حولاً من يوم بلغت النصاب، لأن الحول قد حال عليها وهي عنده عشرون ديناراً، ثم لا زكاة فيها حتى يحول عليها الحول من يوم زُكيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.337} {cite:muwatta-maruf-1997 p.338}"
