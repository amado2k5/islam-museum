label: { ar: "الموطأ 663 — مالك: عشرة دنانير تجر فيها فحال الحول وقد بلغت عشرين يزكيها مكانها", en: "Muwatta 663", es: "Muwatta 663", fr: "Muwatta 663", ur: "موطا 663", tr: "El-Muvatta 663 — Malik: On dinar alınıp satıldı, bir yıl geçti ve yirmiye ulaştı. Bu yüzden zekât onların yerine ödenir.", id: "Al-Muwatta 663 — Malik: Sepuluh dinar diperdagangkan, dan setahun berlalu dan jumlahnya menjadi dua puluh, maka zakat dibayarkan sebagai penggantinya." }
summary:
  ar: "قول لمالك في رجل له عشرة دنانير فتجر فيها فحال عليها الحول وقد بلغت عشرين ديناراً: أنه يزكيها مكانها ولا ينتظر بها حولاً من يوم بلغت النصاب، لأن الحول قد حال عليها وهي عنده عشرون ديناراً، ثم لا زكاة فيها حتى يحول عليها الحول من يوم زُكيت. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.337} {cite:muwatta-maruf-1997 p.338}"
  tr: "Malik, on dinarı olan ve bir yıl geçtikten sonra yirmi dinara ulaşan bir adam hakkında şöyle demiştir: Bu adam, nisaba (minimum değere) ulaştığı günden itibaren bir yıl beklemeden hemen zekâtını vermelidir; çünkü yirmi dinar değerindeyken bir yıl geçmiştir. Dolayısıyla, zekât verildiği günden itibaren bir yıl geçene kadar zekât ödenmesi gerekmez. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.337} {cite:muwatta-maruf-1997 s.338}"
  id: "Malik berkata tentang seorang pria yang memiliki sepuluh dinar dan memperdagangkannya hingga setahun berlalu dan nilainya mencapai dua puluh dinar: dia harus segera membayar zakat atasnya dan tidak menunggu setahun sejak hari nilainya mencapai nisab (ambang batas minimum), karena setahun telah berlalu saat nilainya dua puluh dinar berada di tangannya. Maka tidak ada zakat yang wajib dibayar hingga setahun berlalu sejak zakat tersebut dibayarkan. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.337} {cite:muwatta-maruf-1997 p.338}"
