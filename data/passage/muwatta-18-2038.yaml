label: { ar: "الموطأ 2038 — مالك: فيمن دفع إلى رجل مالا قراضا، فأخبره أنه قد اجتمع عنده، وسأله أن يكتبه عليه سلفا: لا يحب ذلك حتى يقبض منه ماله، مخافة أن يكون قد نقص فيه، فهو يحب أن يؤخره عنه على أن يزيده فيه ما نقص، فذلك مكروه لا يجوز", en: "Muwatta 2038" }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فأخبره أنه قد اجتمع عنده، وسأله أن يكتبه عليه سلفا. قال: لا أحب ذلك، حتى يقبض منه ماله، ثم يسلفه إياه إن شاء، أو يمسكه. وإنما ذلك مخافة أن يكون قد نقص فيه، فهو يحب أن يؤخره عنه على أن يزيده فيه ما نقص منه، فذلك مكروه، ولا يجوز ولا يصلح. {cite:muwatta-maruf-1997 p.233}"
