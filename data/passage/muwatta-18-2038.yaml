label: { ar: "الموطأ 2038 — مالك: فيمن دفع إلى رجل مالا قراضا، فأخبره أنه قد اجتمع عنده، وسأله أن يكتبه عليه سلفا: لا يحب ذلك حتى يقبض منه ماله، مخافة أن يكون قد نقص فيه، فهو يحب أن يؤخره عنه على أن يزيده فيه ما نقص، فذلك مكروه لا يجوز", en: "Muwatta 2038", es: "Muwatta 2038", fr: "Muwatta 2038", ur: "موطا 2038", tr: "El-Muvatta 2038 — Malik: Bir kimse bir adama borç para verirse ve adam parayı aldığını bildirip borç olarak yazmasını isterse: Bu kişi, paranın azalmış olabileceğinden korkarak, parayı geri alana kadar bunu hoş karşılamaz. Eksik olanı tamamlamak için parayı geciktirmek ister. Bu hoş karşılanmayan ve caiz olmayan bir durumdur.", id: "Al-Muwatta 2038 — Malik: Mengenai seseorang yang memberikan uang kepada seorang pria sebagai pinjaman, dan pria itu memberitahunya bahwa ia telah menerima uang tersebut dan memintanya untuk mencatatnya sebagai pinjaman: Ia tidak menyukai hal itu sampai ia menerima uangnya kembali dari pria tersebut, karena khawatir uangnya telah berkurang. Ia ingin menunda penerimaan uang tersebut agar ia dapat menambahkan apa yang kurang. Hal itu tidak disukai dan tidak diperbolehkan." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فأخبره أنه قد اجتمع عنده، وسأله أن يكتبه عليه سلفا. قال: لا أحب ذلك، حتى يقبض منه ماله، ثم يسلفه إياه إن شاء، أو يمسكه. وإنما ذلك مخافة أن يكون قد نقص فيه، فهو يحب أن يؤخره عنه على أن يزيده فيه ما نقص منه، فذلك مكروه، ولا يجوز ولا يصلح. {cite:muwatta-maruf-1997 p.233}"
  tr: "Malik, bir adama borç para verip, parayı geri aldığını bildirdikten sonra bunu borç olarak yazmasını isteyen bir adam hakkında şunları söyledi: “Bunu beğenmiyorum. Parayı geri alana kadar elinde tutmamalı, sonra isterse başkasına borç verebilir, isterse de kendine saklayabilir. Bunu sadece paranın miktarında bir azalma olabileceğinden korktuğu ve kaybettiğini artırmak için geri ödemeyi geciktirmek istediği için yapıyor. Bu hoş karşılanmayan, caiz olmayan ve kabul edilemez bir davranıştır.” {cite:muwatta-maruf-1997 s.233}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain sebagai pinjaman, lalu memberitahunya bahwa ia telah mengambil uang tersebut dan memintanya untuk mencatatnya sebagai pinjaman: “Saya tidak menyukai hal itu. Ia seharusnya tidak mengambil uangnya sampai ia menerimanya kembali, kemudian ia boleh meminjamkannya jika ia mau, atau ia boleh menyimpannya. Ini hanya karena ia khawatir jumlahnya mungkin berkurang, dan ia ingin menunda pembayaran untuk meningkatkan kerugian yang telah terjadi. Hal ini tidak disukai, tidak diperbolehkan, dan tidak dapat diterima.” {cite:muwatta-maruf-1997 p.233}"
