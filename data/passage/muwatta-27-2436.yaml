ref: "2436"
label: { ar: "الموطأ 2436 — مالك: اعتراف العبيد جائز في الحد والعقوبة على أبدانهم لا في الغرم على السيد", en: "Muwatta 2436", es: "Muwatta 2436", fr: "Muwatta 2436", ur: "موطا 2436", tr: "El-Muvatta 2436 — Malik: Kölelerin itirafı, bedenlerine uygulanan cezalar ve yaptırımlar söz konusu olduğunda caizdir, ancak efendiye uygulanan maddi cezalar söz konusu olduğunda caiz değildir.", id: "Al-Muwatta 2436 — Malik: Pengakuan seorang budak diperbolehkan dalam kasus hukuman dan sanksi yang dikenakan pada tubuh mereka, tetapi tidak dalam kasus sanksi finansial yang dikenakan pada majikan." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في اعتراف العبيد: أن من اعترف منهم على نفسه بشيء يقع فيه الحد والعقوبة في جسده، فإن اعترافه جائز عليه، ولا يُتهم بأن يوقع على نفسه هذا. وأما من اعترف منهم بأمر يكون غرما على سيده، فإن اعترافه غير جائز على سيده. {cite:muwatta-maruf-1997 p.405} {cite:muwatta-maruf-1997 p.406}"
  tr: "Malik şöyle dedi: Kölelerin itirafları konusunda aramızdaki yerleşik uygulama şudur: Eğer bir köle, önceden belirlenmiş bir cezayı ve fiziksel yaptırımı gerektiren bir şeyi itiraf ederse, itirafı kendisine karşı geçerlidir ve bu durumu kendi başına getirmekle suçlanmaz. Ancak, eğer bir köle, efendisine mali bir yük getirecek bir şeyi itiraf ederse, itirafı efendisine karşı geçerli değildir. {cite:muwatta-maruf-1997 s.405} {cite:muwatta-maruf-1997 s.406}"
  id: "Malik berkata: Praktik yang berlaku di antara kita mengenai pengakuan budak adalah jika salah satu dari mereka mengaku melakukan sesuatu yang pantas mendapatkan hukuman dan sanksi fisik yang telah ditentukan, maka pengakuannya sah terhadap dirinya, dan ia tidak dituduh telah mendatangkan hal itu pada dirinya sendiri. Namun, jika salah satu dari mereka mengaku melakukan sesuatu yang akan menimbulkan beban keuangan bagi tuannya, maka pengakuannya tidak sah terhadap tuannya. {cite:muwatta-maruf-1997 p.405} {cite:muwatta-maruf-1997 p.406}"
