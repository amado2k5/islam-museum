label: { ar: "الموطأ 2436 — مالك: اعتراف العبيد جائز في الحد والعقوبة على أبدانهم لا في الغرم على السيد", en: "Muwatta 2436" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في اعتراف العبيد: أن من اعترف منهم على نفسه بشيء يقع فيه الحد والعقوبة في جسده، فإن اعترافه جائز عليه، ولا يُتهم بأن يوقع على نفسه هذا. وأما من اعترف منهم بأمر يكون غرما على سيده، فإن اعترافه غير جائز على سيده. {cite:muwatta-maruf-1997 p.405} {cite:muwatta-maruf-1997 p.406}"
