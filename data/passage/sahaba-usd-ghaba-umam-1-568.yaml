text: "… مات. وكان أحد أشراف قريش في الجاهلية، وكان أحد المُطْعِمين، فكان يقال له : سِدَاد البطحاء، وكان من أفصح قريش، قيل: لم يجتمع لقوم أن يكون منهم مطعمون خمسة إلا لعمرو بن عبدالله بن صفوان بن أمية بن خلف، أطعم …"
