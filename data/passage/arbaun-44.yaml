label: { ar: "الأربعون 44 — الرضاعة تحرم ما تحرم الولادة", en: "Arba'un 44 — suckling prohibits what birth prohibits" }
text: "الرضاعة تحرم ما تحرم الولادة"
summary:
  ar: "حديث عائشة عن النبي قال: «الرضاعة تحرم ما تحرم الولادة» — ثاني الأحاديث التي زادها ابن رجب؛ أخرجه البخاري (2646، 3105، 5099) ومسلم (1444) من رواية عمرة عن عائشة، وخرج مسلم أيضاً من رواية عروة عن عائشة بلفظ «يحرم من الرضاعة ما يحرم من النسب»، وخرجاه من قول عائشة ومن حديث ابن عباس وخرج الترمذي وعبد الرزاق وأحمد من حديث علي؛ قال ابن رجب: أجمع العلماء على العمل بهذه الأحاديث في الجملة وأن الرضاع يحرم ما يحرمه النسب، ثم استقصى المحرمات من النسب كلها ليعلم بذلك ما يحرم من الرضاع: فالولادة والنسب يؤثران التحريم في النكاح على قسمين — تحريم مؤبد على الانفراد (أصوله وفروعه وفروع أصله الأدنى وفروع أصوله البعيدة) وغير ذلك من أقسام الاجتماع والمصاهرة — فيحرم نظائرها كلها بالرضاعة (جامع العلوم والحكم ص 864–870)."
  en: "The hadith of A'isha from the Prophet: 'suckling prohibits what birth prohibits' — the second of Ibn Rajab's added hadiths, transmitted by al-Bukhari (2646, 3105, 5099) and Muslim (1444) through Umra from A'isha, Muslim also through Urwa from A'isha in the wording 'what lineage prohibits is prohibited by suckling', both also from A'isha's own word and from Ibn Abbas's hadith, with al-Tirmidhi, Abd al-Razzaq and Ahmad carrying Ali's route; Ibn Rajab records the scholars' consensus on acting upon these reports in sum — that suckling prohibits what lineage prohibits — then exhaustively enumerates those prohibited through lineage so the parallel prohibitions through milk may be known: birth and lineage effect prohibition in marriage in two kinds, an everlasting prohibition individually (his ascendants however high, his descendants however low, the descendants of his nearest ascendant, and the descendants of his remoter ascendants excluding their own descendants) and the further kinds through combination and affinity — all of whose counterparts are prohibited through suckling (Jami' al-Ulum wal-Hikam pp. 864–870)."
