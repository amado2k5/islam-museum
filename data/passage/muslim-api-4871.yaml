label: { ar: "صحيح مسلم 4871 — أثر من الآثار المحفوظة", en: "Sahih Muslim 4871 — a relic kept after its owner", ur: "صحیح مسلم 4871 — محفوظ آثار و تبرکات", es: "Sahih Muslim 4871 — una reliquia conservada después de su dueño.", fr: "Sahih Muslim 4871 — une relique conservée après son propriétaire" }
text: "… بْنُ سَلاَّمٍ، عَنْ زَيْدِ بْنِ سَلاَّمٍ، أَنَّهُ سَمِعَ أَبَا سَلاَّمٍ، قَالَ حَدَّثَنِي النُّعْمَانُ بْنُ بَشِيرٍ، قَالَ كُنْتُ عِنْدَ مِنْبَرِ رَسُولِ اللَّهِ فَقَالَ رَجُلٌ مَا أُبَالِي أَنْ لاَ أَعْمَلَ عَمَلاً بَعْدَ الإِسْلاَمِ إِلاَّ أَنْ أُسْقِيَ الْحَاجَّ. وَقَالَ آخَرُ مَا أُبَالِي أَنْ لاَ أَعْمَلَ عَمَلاً بَعْدَ الإِسْلاَمِ إِلاَّ أَنْ أَعْمُرَ الْمَسْجِدَ الْحَرَامَ. وَقَالَ آخَرُ الْجِهَادُ فِي سَبِيلِ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4871، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4871 (The Book on Government), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 4871، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 4871 (El Libro del Gobierno), menciona una reliquia conservada tras la muerte de su propietario. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 4871 (Livre du gouvernement), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
