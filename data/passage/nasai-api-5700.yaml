label: { ar: "سنن النسائي 5700 — الحرام، ما حُرّم", en: "Sunan al-Nasa'i 5700 — the unlawful; what was made unlawful", ur: "سنن نسائی 5700 — حرام، جو حرام کیا گیا", es: "Sunan al-Nasa'i 5700 — lo ilícito; lo que se hizo ilícito", fr: "Sunan al-Nasa'i 5700 — l'illicite; ce qui a été rendu illicite", tr: "Sunan an-Nasa'i 5700 — Haram olan, yasaklanmış olan", id: "Sunan an-Nasa'i 5700 — Yang terlarang, apa yang dilarang" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ حَدَّثَنَا الْمُعْتَمِرُ، قَالَ سَمِعْتُ شَبِيبًا، - وَهُوَ ابْنُ عَبْدِ الْمَلِكِ - يَقُولُ حَدَّثَنِي مُقَاتِلُ بْنُ حَيَّانَ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ، عَنْ رَسُولِ اللَّهِ قَالَ \" حَرَّمَ اللَّهُ الْخَمْرَ وَكُلُّ مُسْكِرٍ حَرَامٌ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5700، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 5700 (The Book of Drinks), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 5700، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5700 (El Libro de las Bebidas), menciona lo ilícito y lo que fue declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 5700 (Le Livre des Boissons), mentionne ce qui est illicite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de 5700 numaralı hadis, helal ve haram olan şeyleri belirtmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5700, menyebutkan apa yang diharamkan dan apa yang telah diharamkan. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
