text: |-
  ٢٥٠
  • افصل الوااو)•
  ⁦( وصل)⁩ وصلت الشى وصلا وصلة ووصل اليه وص ولا أى بلغ وأوصله غيره ووصل بمحنى
  اتصل أى دعاد= وى الجاهلية وهوأن يقول بالفلان قال تعالى الا الذين يصلون الى قوم أى
  بتصلون والوصل ضد الهجران والوصل وصل التوب والخف ويقال (هذا وص-ل هذا أى
  مثله وبينهما وصلة أى اتصال وذريعة وكلّ شئ اتصل بنذابينهما وصلة والهمع وصل
  والاوصال المفاصل والوصلة التى كانت فى الجاهلية هى الشاة تلدسبعة أبطن عناقر
  ناقين فان ولدت فى الشامنة جدياذ بهوه لا" لهتهم وان ولدت جديا وعناقا قالواوصل
  أخاها فلايذيحون أخاها من أجلها ولا يشرب لبنها النساء وكان للرجال وجرت مجرى
  السائبة والوصيلد العمارة والخصب والوصيلة الارض الواسعة والوصائل ئياب مخططة
  يمانية وفى الحديث لعن اللّٰه الواصلة والمستوصلة فالواصلة التى تصل الشعر والمستوصلة
  و التى يفعل بها ذلك وتوصل اليه أى تلطف فى الوصول اليه والتواصل ضد التصارم ووصله
  توصيلا اذا أكثر من الوصل وواصله مواصلة ووصالا ومنه المواصلة فى الصوم وغيره
  وموصل البعيرما بين عجزه وفخذه والموصل مايوصل من الحبل قال المتنجل الهذلة
  ليس لميت يوصيل وقد • علق فيه طرف الموصل
  دعا لرجل أى لا وصل هذا الحى بهذا الليت أى لامات معه ثم قال وقد علق فيه طرف
  الموصل على أنه سيتصل به أى قد علق فى الحى المسبب الذى يصيريه الى ما صار البه الميت
  والموصل بلد وقول الشاعر
  وبصرة الازدمنا والعراق لنا • والموصلان ومنا المصر والحرم
  يريد الموصل والجزيرة وواصل اسم دجل وابمع أواصل تقلب الواوهمزة كراهية اجتماع
  الواوين ⁦(وعسل)⁩ الوع-ل الاروى والجع الوعول والاوعال وفى الحديث تظهر
  التحوت على الوعول أى يغلب الضعفامن الناس أقوياءهم وأماقول الراجز
  وأمّ أوعال كها أوأقر با• فهى هضبة ويقال هم عليه وعل واحد بالتسكين أى ضلع واحد
  الاصمعىّ الوعل الملجأ وأنشداذى الرمّة
  حتى اذالم يجدوعلا ونجنجها • مخافة الرمى حتى كلهاهيم
  وقال انخليل معناه لم يجدبدا يقال مالى عن ذلك وعل ووعى أى مالى منه بد وقال الفراء مالى
  عنه وغل بالغين معجة أى لجأوأنشدهذا البيت المتقدم وتوعلت الجبل علوه مثل توقات
  ووعلة اسم شاعر من جرم ⁦(وغل)⁩. وغل الرجل يغل وغولا أى دخل فى الشجرونوارت
  فيه ويقال أيضاوغل يغل وغلا اذادخل ءسلى القوم فى شرابهم فشرب معهم من غير أن يدعى
  اليهو الواغل فى الشراب مثل الوارش فى الطعام قال امر والقيس
  فاليوم فاشرب غير مستحتب • اغامن اللّٰه ولا واغل
  أبوهرو الوغل أيضالشراب الذى يشريه الواغل وأنشدق ول عمروبن قئة
  ان ألك مسكيرافلا أشرب الشوغل ولا يسلم مى البعير
  والوغل أيضا النذل من الرجال وأنشد
  وساجب كردسه فى الحبل • مناغلام كان غيروغل • حتى اقتدى منا بمال جبل
  الذراء
