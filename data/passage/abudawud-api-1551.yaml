label: { ar: "سنن أبي داود 1551 — الأب والأبوة", en: "Sunan Abi Dawud 1551 — the father and fatherhood", ur: "سنن ابی داؤد 1551 — باپ اور والدیت", es: "Sunan Abi Dawud 1551 — El padre y la paternidad" }
text: "… أَحْمَدُ، حَدَّثَنَا وَكِيعٌ، - الْمَعْنَى - عَنْ سَعْدِ بْنِ أَوْسٍ، عَنْ بِلاَلٍ الْعَبْسِيِّ، عَنْ شُتَيْرِ بْنِ شَكَلٍ، عَنْ أَبِيهِ، فِي حَدِيثِ أَبِي أَحْمَدَ شَكَلِ بْنِ حُمَيْدٍ - قَالَ - قُلْتُ يَا رَسُولَ اللَّهِ عَلِّمْنِي دُعَاءً قَالَ \" قُلِ اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ سَمْعِي وَمِنْ شَرِّ بَصَرِي وَمِنْ شَرِّ لِسَانِي وَمِنْ شَرِّ قَلْبِي وَمِنْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1551، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1551 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1551، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1551 (Oración (Kitab Al-Salat): Preceptos detallados sobre el Witr), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
