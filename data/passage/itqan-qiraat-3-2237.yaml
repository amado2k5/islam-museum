label: { ar: "الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2237 — قراءات القرآن، جمع القرآن والمصاحف", en: "al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2237 — the readings of the Qur'an; the collection of the Qur'an and the codices", ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2237 — قرآن کی قراءتیں، جمعِ قرآن اور مصاحف" }
text: "… يذكر هذه القراءة مع مثيلاتها في القاعدة السابقة؛ لأن رسم المصحف جاء على قراءة يعقوب المتواترة. انظر: غاية الاختصار، النشر قرأ مجاهد وابن سيرين بضم الهاء من غير ألف عَلَيْهُم، وهي قراءة شاذة. انظر: مختصر ابن خالويه، والقراءة المتواترة بإثبات …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 3، ص 2237، يذكر قراءات القرآن، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 3, p. 2237, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 3، ص 2237 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
