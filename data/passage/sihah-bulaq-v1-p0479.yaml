text: |-
  ⁦(لهج)⁩
  باركة كااضروب بالارض قال أبو ذؤ يب
  كان ثقال المزن بين تضارع • وشابة برك من جذام ليج
  ⁦(لجج)⁩ لحبت بالكسرتلج لحاجاوبحاجة فهو لجوج ولجوجة الهاء للمبالغة ولجحت بالفتح
  تلج لغة والملاجة التمادى فى الخصومة قال الفراءرجل لججة مثال همزة أى لجوجو يللج
  المضغة فى فه أى يردّدها فيه للمضغ والمجلجة والتلملج التردد فى اللام يقال الحق أبلج
  والباطل لملج أى يردّد من غير أن ينفذ وسمعت لجة الناس بالفتح أى أصواته-م وضحتهم
  قال أبو النجم
  فى لحة أمسك فلاناءن ذل والتحت الاصوات أى اختلعات وبلمحة الماء
  بالضم معظمه وكذلك اللج ومنه محرلجى" واللج أيضا السيف ولحجت السفينة أى خاضت
  اللحة والتج البحراتجايا ويلنجوج عود يتبخر به وكذلك بلنحيج وألنجيج وهو يفنعل وأفنعل
  قال حيد بن نور لا تصطلى النار الامجمرا أرجا • قد كسرت مر يلنجوج له وقصا
  حبج لحج السيف وغيره بالكسر يلحج لحجا أى نشب فى الغمد فلا يخرج مثل لصب
  ومكان لحج أى ضيق والملاج المضابق قال الاصمعى الملتحج الملهأ مثل الملتحد وأنشد
  ساعدة
  حب الضربكتلاد المال رزمه * فقرولم يتخذى الناس ملتحجا
  وقد التحجه الى ذلك الامر أى ألجأه والتحصه اليه ولجت عليه الخبر تهيا اذاخلطته
  وو الا تمزج أخريه ويقال مام والليب ذاص اي العد ثازج وتات
  رأسه أيضااذاغسله لم ينق وسخه عن يعقوب وقلزج النبات تلجن قال العجاج
  وفرغا من رمى ماتازجا لان النبات اذا أخذ فى اليبس غنظ ماؤه قصار كاعاب اخطعى
  ( ل ج عجه الضرب أى المه وأحرق جلده قال الهذلى ضربا ألمابسيت يلعج الملدا
  ويقال حوى لاعيج لحرقة الفؤاد من الحب" ⁦(لفيج)⁩ ألفيح الرحل أى أفلس قال رؤية
  احسابكم فى العسروالاافاج * شيت بعدب طيب المزاج
  نهو ملفج بقفتح الفاء مثل أحسن فهو محصن وأسهب فهومسهب فهذه الثلاثة جاءت بالفتح
  نوادر وقال جارية شبت شبايا عسلوا * فى حجر من لم يك عنها ملفجا
  ⁦(لج)⁩ اللمج الاكل باطراف القم قال ابيد
  يلمج البارض نجافى الندى * من مرابيع رياض ورجل
  والملامج الملاغم وهو ماحول الفم قال الراجز رأته شيخاحنر الملامج أبو ح روالتلمج مثل
  التلظ ورأيتسه يتلمج بالطعام أى يتلظ والاصعى مثله وقوله-م ماذقت شماجا ولالماجا
  وما تلمجت عنده يلاج وهو أدنى مايو كل أى ماذقت شيئا قال الراجز
  أعملى خللى نعجة هملاجا • رجاجسة انّ لهرجاجا
  لا يجد اراعى بها الماجا لا تسبق الشيخ اذا أفاجا
  ومالجواضيهم يشىّ أى مالهنواوشى سمج لج وسمج لمج وسميج ليج وهواتباع حكاء أبو عبيدة
  ⁦(لهج)⁩ اللهج بالدى الولوع به وقد لهج به بالكسريلهج اهجاادا أغرى به فشابر عليه وألهج
  الرجل أى لهجت فصاله برضاع أمهاتهافبعهل عندذلك أخلة يشدها فى الاخلاف لئلا
  برتضع
