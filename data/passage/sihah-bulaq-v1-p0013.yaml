text: |-
  ٦٢٨
  ⁦(باب العين)⁩
  انالنضرب بالسيوف رؤسهم * ضرب القدام نقيعة القدام
  قال أيو عبيدية ال القدّام القادمون من سفرويقال الملاك ويقال كل بزود بزرتها
  الت ارجيل تهسم تومارتول مياليتة رأكم أكييزرا أ كالمن وف كلام ولعونه
  ويقال الناس نقائع الموت أى يجزرهم كما يجزرالجزار النقيعة وحكى أبوهروعن المسلمى
  النقيعة طعام الرجل ايلة علك ونقعت بالماء رويت يقال شرب حتى نقع أى شفى غلي له وماء
  ناقع وهو كالماجع ومارأيت شرية أنقع منها ومنه وما فقعت يخير فلان،، وعاأى ماعجت
  بكلامه ولم أصدّقه قال الاصيعى نقعت باتخبر وبالشراب اذا اشتفيت منه وتقع الماء فى الموضع
  واستنقع وأنقعنى الماء أى أروانى وفى المنسل حتام تكرع ولا تنقع وأنقعت الشئ فى الماء
  ويقال طال انقاع الماء واستنقاعه-تى اصفر وحكى أبو عبيد أنقعت له شرّارهو
  استعارة وسم منقع أى مرتي قال الشاعر
  فيها ذراريخ وسم منقع
  يى
  فى كأس الموت وحكى النترا تقع الصارخ بصوته وأنقع صوته اذا تابعه ومته قول عمررضى اللّٰه
  عنه مالم يكن نقع ولا لقلقة وانتقع القوم نقيعة أى ذيحوا من الغنيمة شيماقبل القسم وانتقع
  لونه فهو متتقع لغة فى امتقع واستنقعت فى الغدير أى نزات فيه واغتسات كانك ئيت
  فيه لتتبرد والموضع مستنقع واستنقع الماءفى الغديراى اجتمع وثبت واستنقع الشئ فى الماء
  على مالم يسم فاعله كع نكمه عن الامر أى أعجله عنه ويقال رجل هكعة ذكعة
  للاحق ونكعة الطرتوث بالتحريك رأسه وهومن أعلاه الى قدر إصبع عليه قشرة حراء
  ورجل أنمع بين النكع وهو الاحر الذى يتقشر أنفه وع النوع أخص من الجنس
  وقد تنوّع الشى أنواعا والنوع بالضم إتباع للجوع والنائع اتباع للجائع يقال رجل جائع
  نائع واذادء واعليه قالواجوعانوعا وقوم جباع نيساع وزعم بعضهسم انّ النوع العطش
  والنائع العطشان ويقال رماه اللّٰه بالجوع والنوع قال دريد بن الصمة
  لعمربن شهاب ما أقاموا * صدور الخيل والاسل النياعا
  يعنى الرماح العطاش والاستفاعة التقدّم فى السير قال القطامى يصف ناقته
  وكانت ضرية من شدقىّ • اذا ما استنت الابل استناعا
  (نهع نصع نهوعا أى تهوع وهو التقيؤ
  صيل الاد بع لو باعة الاست يقال كذيت وباعتك ووباغتك وتباعتك
  ونساغتك بالعيز والغين كله يمعنى اى ردم جع) الوجع المرض والمع أوجاع ووجاع
  مث.ل جبل وأجدال وجبال وقد وجع فلان يوجع ويجع وياجع فهو وجمع وقوم وجعون
  ووجعى مثل مرضى ونسوة وجاعى أيضا ووجعان وينو أسدية ولون يبجع بكسر الياء
  وهم لا يقولون يعلم استثقالا للكسرة على الياءفلما اجتمعت اليا آن ويتا واحة مامالم
  تحتمله المفردة وينشد لمتمم بن نويرة على هذه اللغة
  قعبدك ألاتسممينى ملامة * ولا تنكاى قرح الفؤاد فييجعا
  وفلان يوجع رأسه نصبت الرأس فان جنت بألها ء رفعت فقلت يوجعه رأسه وأنا أيجع رأسى
  ديوجع
