text: "… حَدَّثَنَا هُشَيْمٌ، أَخْبَرَنَا أَبُو بَلْجٍ، عَنْ مُحَمَّدِ بْنِ حَاطِبٍ الْجُمَحِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ \" فَصْلُ مَا بَيْنَ الْحَرَامِ وَالْحَلاَلِ الدُّفُّ وَالصَّوْتُ \". قَالَ وَفِي الْبَابِ عَنْ عَائِشَةَ وَجَابِرٍ وَالرُّبَيِّعِ بِنْتِ مُعَوِّذٍ. قَالَ أَبُو عِيسَى حَدِيثُ مُحَمَّدِ بْنِ حَاطِبٍ حَدِيثٌ حَسَنٌ. وَأَبُو بَلْجٍ اسْمُهُ يَحْيَى بْنُ أَبِي سُلَيْمٍ وَيُقَالُ ابْنُ سُلَيْمٍ أَيْضًا. وَمُحَمَّدُ بْنُ حَاطِبٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1088، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1088 (The Book on Marriage), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1088، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
