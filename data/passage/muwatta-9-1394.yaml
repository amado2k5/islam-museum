label: { ar: "الموطأ 1394 — ربيعة بن أبي عبد الرحمن عن أبي سعيد الخدري: قدم من سفر فقدم إليه أهله لحما، فقال أنهيتم عن لحوم الأضحى", en: "Muwatta 1394" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن أبي سعيد الخدري أنه قدم من سفر، فقدم إليه أهله لحما، فقال انظروا أن يكون هذا من لحوم الأضحى، فقالوا هو منها، فقال أبو سعيد ألم يكن رسول الله نهى عنها؟ فقالوا إنه كان فيها من رسول الله بعدك أمر، فخرج أبو سعيد فسأل، فأخبر أن رسول الله قال نهيتكم عن لحوم الأضحى بعد ثلاث، فكلوا وتصدقوا وادخروا، ونهيتكم عن الانتباذ فانتبذوا، وكل مسكر حرام، ونهيتكم عن زيارة القبور فزوروها، ولا تقولوا هجرا. ويذكر المحقق أن ابن عبد البر قال إن ربيعة لم يسمع من أبي سعيد، وأن الشخص الذي سأله أبو سعيد هو قتادة بن النعمان أخوه لأمه. {cite:muwatta-maruf-1997 p.623}"
