label: { ar: "الموطأ 1394 — ربيعة بن أبي عبد الرحمن عن أبي سعيد الخدري: قدم من سفر فقدم إليه أهله لحما، فقال أنهيتم عن لحوم الأضحى", en: "Muwatta 1394", es: "Muwatta 1394", fr: "Muwatta 1394", ur: "موطا 1394", tr: "El-Muvatta 1394 — Rabi’ah ibn Abi Abd al-Rahman, Ebu Sa’id al-Khudri’den rivayetle: Bir yolculuktan döndü ve ailesi ona et ikram etti. “Size kurban eti yemek yasaklandı mı?” dedi.", id: "Al-Muwatta 1394 — Rabi’ah ibn Abi Abd al-Rahman, berdasarkan riwayat Abu Sa’id al-Khudri: Ia kembali dari perjalanan dan keluarganya memberinya daging. Ia bertanya, “Apakah kalian dilarang memakan daging kurban?”" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن أبي سعيد الخدري أنه قدم من سفر، فقدم إليه أهله لحما، فقال انظروا أن يكون هذا من لحوم الأضحى، فقالوا هو منها، فقال أبو سعيد ألم يكن رسول الله نهى عنها؟ فقالوا إنه كان فيها من رسول الله بعدك أمر، فخرج أبو سعيد فسأل، فأخبر أن رسول الله قال نهيتكم عن لحوم الأضحى بعد ثلاث، فكلوا وتصدقوا وادخروا، ونهيتكم عن الانتباذ فانتبذوا، وكل مسكر حرام، ونهيتكم عن زيارة القبور فزوروها، ولا تقولوا هجرا. ويذكر المحقق أن ابن عبد البر قال إن ربيعة لم يسمع من أبي سعيد، وأن الشخص الذي سأله أبو سعيد هو قتادة بن النعمان أخوه لأمه. {cite:muwatta-maruf-1997 p.623}"
  tr: "Malik, Rabi'ah ibn Abi Abdülrahman'dan, o da Ebu Sa'id el-Hudri'den rivayet eder ki, Rabi'ah bir yolculuktan döndüğünde ailesi ona et ikram etmiş. \"Bakın, bu kurban etinden mi?\" demiş. Ailesi \"Evet\" demiş. Ebu Sa'id, \"Allah'ın Resulü bunu yasaklamamış mıydı?\" diye sormuş. Ailesi, \"Senin gidişinden sonra Allah'ın Resulü'nden bununla ilgili bir emir geldi\" demiş. Bunun üzerine Ebu Sa'id dışarı çıkıp sormuş ve Allah'ın Resulü'nün şöyle buyurduğunu öğrenmiş: \"Üç günden sonra kurban etini yemenizi yasakladım, yiyin, sadaka verin ve bir kısmını saklayın. Nebid (fermente içki) yapmanızı yasakladım, yapın. Bütün sarhoş edici maddeler haramdır. Kabirleri ziyaret etmenizi yasakladım, ziyaret edin, fakat yalan söylemeyin.\" Araştırmacı, İbn Abdülbarr'ın Rabi'ah'ın Ebu Sa'id'den haber almadığını ve Ebu Sa'id'in sorduğu kişinin annesinin üvey kardeşi Katade ibn el-Nu'man olduğunu söylediğini belirtiyor. {cite:muwatta-maruf-1997 s.623}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi 'Abd al-Rahman, dari Abu Sa'id al-Khudri, bahwa ia kembali dari suatu perjalanan, dan keluarganya memberinya daging. Ia berkata, \"Lihatlah apakah ini daging kurban.\" Mereka berkata, \"Ya.\" Abu Sa'id berkata, \"Bukankah Rasulullah melarangnya?\" Mereka berkata, \"Ada perintah dari Rasulullah tentang hal itu setelah kepergianmu.\" Maka Abu Sa'id pergi dan bertanya, dan diberitahu bahwa Rasulullah telah bersabda, \"Aku melarang kalian memakan daging kurban setelah tiga hari, maka makanlah, berikanlah sedekah, dan simpanlah sebagian. Aku melarang kalian membuat nabidh (minuman fermentasi), maka buatlah. Semua minuman keras diharamkan. Aku melarang kalian mengunjungi kuburan, maka kunjungilah, tetapi jangan mengucapkan kebohongan.\" Peneliti menyebutkan bahwa Ibnu 'Abd al-Barr mengatakan bahwa Rabi'ah tidak mendengar kabar dari Abu Sa'id, dan bahwa orang yang ditanyai Abu Sa'id adalah Qatadah ibn al-Nu'man, saudara tirinya dari pihak ibu. {cite:muwatta-maruf-1997 p.623}"
