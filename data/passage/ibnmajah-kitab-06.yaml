summary:
  ar: "القسم 6 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجنائز»، ويضم فيها النصوص من 1433 إلى 1637 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 6 of Sunan Ibn Majah (Chapters Regarding Funerals) in the division of the open hadith dataset the museum took its reports from: reports 1433 to 1637 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 6، عنوان «کتاب الجنائز»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1433 تا 1637۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 6 de Sunan Ibn Majah (Capítulos sobre los funerales) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1433 al 1637, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 6 du Sunan Ibn Majah (chapitres relatifs aux funérailles), soit les hadiths 1433 à 1637 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan İbn Majah'ın 6. bölümü \"Cenaze Kitabı\" başlığını taşımakta olup 1433 ile 1637 yılları arasında numaralandırılmış metinler içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 6 dari Sunan Ibn Majah, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pemakaman\" dan berisi teks-teks bernomor 1433 hingga 1637. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
