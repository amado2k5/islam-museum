label: { ar: "سنن ابن ماجه 774 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Sunan Ibn Majah 774 — ranks raised; bad deeds erased and sins shed", ur: "سنن ابن ماجہ 774 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sunan Ibn Majah 774 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Sunan Ibn Majah 774 — les rangs sont élevés; les mauvaises actions sont effacées et les péchés sont pardonnés", tr: "Sunan İbn Majah 774 — Rütbeleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Sunan Ibn Majah 774 — Meningkatkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "… الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" إِذَا تَوَضَّأَ أَحَدُكُمْ فَأَحْسَنَ الْوُضُوءَ ثُمَّ أَتَى الْمَسْجِدَ لاَ يَنْهَزُهُ إِلاَّ الصَّلاَةُ لاَ يُرِيدُ إِلاَّ الصَّلاَةَ لَمْ يَخْطُ خَطْوَةً إِلاَّ رَفَعَهُ اللَّهُ بِهَا دَرَجَةً وَحَطَّ عَنْهُ بِهَا خَطِيئَةً حَتَّى يَدْخُلَ الْمَسْجِدَ فَإِذَا دَخَلَ الْمَسْجِدَ كَانَ فِي صَلاَةٍ مَا كَانَتِ الصَّلاَةُ تَحْبِسُهُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 774، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 774 (The Book On The Mosques And The Congregations), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 774، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 774 (El Libro de las Mezquitas y las Congregaciones), habla de ascensos de rango, borrado de malas acciones y perdón de pecados. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 774 (Le Livre des Mosquées et des Congrégations), évoque l'élévation de grade, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "İbn Majah'ın Sünen'inde yer alan 774 numaralı hadis, derecelerin yükseltilmesinden, günahların silinmesinden ve zulümlerin kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 774, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
