text: "… رسول اللّٰه لاع، وإن عَلَيَّ ديناً فاقضٍ عني ديني، واستوص بأخواتك خيراً. قال: فأصبحنا فكان أول قتيل، جدَعُوا أنّفَه وأُذنيه. ودفن هو وعمرو بن الجَمُوح في قبر واحد، قال النبي عية : أدفنوهما في قبر واحد، فإنهما كانا متصافيين متصادقين …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 719، يذكر ما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
