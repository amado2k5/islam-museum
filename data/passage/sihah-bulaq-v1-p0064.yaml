text: |-
  ⁦(فصل الباء)⁩
  ٥٢٧
  أمها البضاع قال الاصمعى البضبع الجزيرة فى البحرقال والبضبع اللحم يتمال دابة كثيرة
  البضيع ورجل خاظى البضيع قال ويقال جبهته تبضع أى تسيل عرفا وأنشدلابي ذؤيب
  تأبى بدرحااذا ما استكرهت * الاالهيم فانه يتبضع
  قال وكان أبو ذويب لا يجيد وصف الخيل ففن أن هذا عما توصفبه والبضيع العرق والبضيع
  مصغرااسم موضع وهو فى شعر حسان بن ثابت وبتر بضاعة التى فى الحديث تسكسروتضيم
  (بعع البعاع الجهاز والمتاع وبعاع السحاب ثقل بالمطرومنه قول امرئ القيس
  والتى بعصراء الغبيط بعاءه • نزول اليمانى بالعياب المثقل
  ع لبقعة من الارض واحدة البقاع والباقعة الداهية تقول منه بقع الرجل
  اذارمى بكلام قبيح أويبهتان وقولهم ما أدرى أين بقع أى ذهب كانه قال الى أى بقعة من
  بقاع الارض ذهب والبقيع موضع فيه أروم الشجر من ضر وبشق وبه سمبقيع الغرقد
  وهى مقبرة بالمدينة والغراب الابقع الذى فيه سواد وبياض والبقمع بالهريك فى الطير
  والكلاب بنزلة البلق فى الدواب وبقعان الشأم الذى فى الحديث خدمه-م وعبيدهم
  لبياضهم وحرتهم اوسوادهم لانهم من الروم ومن بلاد السودان وسنة بقعاء أى مجدية
  ويقال فيها خسب وحدب وبقعاءاسم بلد ١ ) ( كع بكعه بكعا اى استقبله
  بمايكره وبكنه والبكع أيضا الضرب الشديد المتتابع فى مواضع منفرقة.ن جسسده وتميم
  نقول ما أدرى أين يكعب؛عنى أين بقع ع بلعت الشئء بالكسروا بتلعته بمعنى وأبلعته
  غيرى وسعد بلع من مشازل القمروهما كوكبان متقاريان زعموا أنه طلع لما قال اللّٰه تعالى
  للأرض ياأرض ابلعى ماك والبلع أيضا الثقب فى قائمة البكرة وبلع الشيب فى رأسه تبلبعا
  أول ما يظهر والبالوعة ثقب فى وسط الدار وكذلك البلوعة والجمع البلاليع وباماءاسم رجل
  لتع ) قال الاصمعى المتبلتع الذى يتفلرف ويتكيس وهوالبلتعانى أيضاوقال
  أبو الدقيس الاعرابى هو الذى يتبلتع فى كلامه أى يتظرف ويتحذاق وليس عندمشئ قال
  هدية بن الخشرم
  فلا تنكمى ان فرق الدهر بيننا * أغم القفا والوجه ليس بأنزعا
  ولاقرزلاوسط الرجال جنادفا * اذا مامنى أوقال قولاتلتعا
  وأبويلتعة كنية رجل قع لباقع والبلقعة الارض القفرالتى لاشئ بها يقال -نزل
  بلقع ودار يلقع بغيرهاء اذا كان نعتافان كان اسماقلت انتهينا الى بلقعة ملساء ويقال
  اليمين الفاجرة تذر الديار بلاقع ⁦(بوع )⁩ الباع قدرمة اليدين وبعت الحبل أبوعه بوعا
  اذا مددت باعك به كما تقول شيرته من الشبرورعاعير بالباع عن الشرف والكرم
  قال العجاج اذا الكرام ابتدروا الباع بدر وقال حجربن خالد
  نذهدق يضع اللحم للباع والندى * وبعضهم تغلى يذم مناقعه
  وباع الفرس فى جريه أى أبعد الخطوو كذلك الناقة ومنه قول الشاءر
  قدع هنداوسل النفس عنها • مجرف قد تغيراذا تبوع
  ( يع بعت الذى شريته أيعه بيعاومبيعا وهوشاذوياسه مباعاوإمته أيضا اشتريته
  وهومن الاضداد قَال القَرزدق
