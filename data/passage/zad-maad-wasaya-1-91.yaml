text: "… حتى فارق الدنيا. ولما صار القنوتُ في لِسان الفقهاء وأكثرِ الناس، هو هذا الدعاء المعروف: اللهم اهدني فيمن هديت... إلى آخره، وسمعوا أنه لم يزل يقنُت في الفجر حتى فارق الدنيا، وكذلك الخلفاءُ الراشدون الأخير، تركه يحيى القطان. الصحابة على …"
