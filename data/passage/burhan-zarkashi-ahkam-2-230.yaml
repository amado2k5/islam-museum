text: "… وتمهد في الأصول، فما لم يوجد فيه ذلك ما عدا العشرة فممنوع من القراءة به منع تحريم لا منع كراهة، في الصلاة وخارج الصلاة، وممنوع منه ممن عرف المصادر والمعانى ومن لم يعرف ذلك، وواجب على من قدر على الأمر …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 230، يرد فيه ذكر الواجب، والتحريم، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 230, whose wording mentions the obligatory (wajib), forbidding (tahrim), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 230 کا اقتباس جس میں واجب، تحریم، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Burhan fi 'Ulum al-Qur'an de al-Zarkashi, volume numérisé 2, p. 230, dont le texte mentionne l'obligatoire (wajib), l'interdiction (tahrim), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
