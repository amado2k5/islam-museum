  tr: "El-Zarkashi'nin \"El-Burhan fi Ulum al-Qur'an\" adlı eserinin 2. cildinin 230. sayfasından, farz, haram ve mekruh halleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz haller, itaat gerektiren haller, tavsiye edilen haller, mekruh haller, haram haller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 2, halaman 230, yang menyebutkan amalan wajib, haram, dan makruh; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang makruh, amalan yang dilarang, dan dosa-dosa kecil."
