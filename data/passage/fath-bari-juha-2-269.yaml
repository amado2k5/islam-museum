text: "الحديث ابن سعد من حديث ابن عيينة أن ميراثه قسم على أربعين ألف ألف، وهكذا أخرجه الحميدى فى النوادر عن سفيان عن هشام بن عروة، وفى المجالسة للدينورى من طريق محمد بن عبيد عن أبى أسامة أن الزبير ترك من …"
