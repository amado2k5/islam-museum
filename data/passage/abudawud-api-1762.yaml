label: { ar: "سنن أبي داود 1762 — الأب والأبوة", en: "Sunan Abi Dawud 1762 — the father and fatherhood", ur: "سنن ابی داؤد 1762 — باپ اور والدیت", es: "Sunan Abi Dawud 1762 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ نَاجِيَةَ الأَسْلَمِيِّ، أَنَّ رَسُولَ اللَّهِ بَعَثَ مَعَهُ بِهَدْىٍ فَقَالَ \" إِنْ عَطِبَ مِنْهَا شَىْءٌ فَانْحَرْهُ ثُمَّ اصْبَغْ نَعْلَهُ فِي دَمِهِ ثُمَّ خَلِّ بَيْنَهُ وَبَيْنَ النَّاسِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1762، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1762 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1762، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1762 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
