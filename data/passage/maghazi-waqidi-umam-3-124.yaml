text: "فهو فى مَقبرة بنى قُرَيْظَة اليوم. حدّثنا الواقدى قال : حدّثنى إبراهيم بن جعفر، عن أَبيه، قال : لمّا قُتلت بنو قُرَيْظَة، قدم حُسَيل بن نُوَيرة الأشجَعىّ خَيْبَر، قد سار يومين، ويهود بنى النَّضير- سَلاَّمِ بن مِشْكَم، وكِنانة بن الرَّبيع …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 3، ص 124، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 3, p. 124, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 3، ص 124 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento del Maghazi de al-Waqidi, volumen 3, pág. 124, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Maghazi d'al-Waqidi, volume 3, page 124, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "El-Vakidi'nin Maghazi adlı eserinin 3. cildinin 124. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
