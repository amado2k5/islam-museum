label: { ar: "الموطأ 1761 — مالك عن أم سلمة: كانت تقول تجمع الحاد رأسها بالسدر والزيت، وينبه المحقق إلى أن الحديث الطويل عن أم سلمة اختصره مالك وأرسله", en: "Muwatta 1761" }
summary:
  ar: "يروي مالك أنه بلغه أن أم سلمة، زوج النبي، كانت تقول: تجمع الحاد رأسها بالسدر والزيت. ويذكر المحقق قول ابن عبد البر إن هذا الحديث معروف عن أم سلمة من حديث بكير بن الأشج، وإنه حديث طويل اختصره مالك وأرسله، ويرى أن إسناد الحديث المرفوع عند أبي داود والنسائي ضعيف. {cite:muwatta-maruf-1997 p.117}"
