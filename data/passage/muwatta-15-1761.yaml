label: { ar: "الموطأ 1761 — مالك عن أم سلمة: كانت تقول تجمع الحاد رأسها بالسدر والزيت، وينبه المحقق إلى أن الحديث الطويل عن أم سلمة اختصره مالك وأرسله", en: "Muwatta 1761", es: "Muwatta 1761", fr: "Muwatta 1761", ur: "موطا 1761", tr: "El-Muvatta 1761 — Malik, Ümmü Seleme'den rivayetle: \"O şöyle derdi: 'Başındaki saçlar lotus yaprakları ve yağ ile örtülmelidir.'\" Araştırmacı, Malik'in Ümmü Seleme'den rivayetle uzun hadisi kısaltarak aktardığını belirtiyor.", id: "Al-Muwatta 1761 — Malik, berdasarkan riwayat Umm Salamah: Beliau biasa berkata, “Rambut di kepalanya hendaknya ditutupi dengan daun teratai dan minyak.” Peneliti mencatat bahwa Malik mempersingkat dan meriwayatkan hadits panjang tersebut berdasarkan riwayat Umm Salamah." }
summary:
  ar: "يروي مالك أنه بلغه أن أم سلمة، زوج النبي، كانت تقول: تجمع الحاد رأسها بالسدر والزيت. ويذكر المحقق قول ابن عبد البر إن هذا الحديث معروف عن أم سلمة من حديث بكير بن الأشج، وإنه حديث طويل اختصره مالك وأرسله، ويرى أن إسناد الحديث المرفوع عند أبي داود والنسائي ضعيف. {cite:muwatta-maruf-1997 p.117}"
  tr: "Malik, Peygamberin eşi Ümmü Seleme'nin şöyle dediğini duyduğunu aktarır: \"Yas tutan bir kadın saçlarını lotus yaprakları ve yağ ile toplamalıdır.\" Araştırmacı, İbn Abdül-Barr'ın bu hadisin Ümmü Seleme'den Bukayr ibn el-Aşajj'ın rivayetiyle bilindiği ve Malik'in kısaltıp isnad zinciri olmadan naklettiği uzun bir hadis olduğu yönündeki ifadesini aktarır. Ebu Davud ve el-Nesai'de Peygambere atfedilen hadisin isnad zincirini zayıf olarak değerlendirir. {cite:muwatta-maruf-1997 s.117}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa Umm Salamah, istri Nabi, biasa berkata: \"Seorang wanita yang sedang berduka hendaknya mengikat rambutnya dengan daun teratai dan minyak.\" Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits ini dikenal dari Umm Salamah melalui riwayat Bukayir ibn al-Ashajj, dan bahwa itu adalah hadits panjang yang dipersingkat oleh Malik dan diriwayatkan tanpa sanad perawi. Ia menganggap sanad hadits yang dinisbahkan kepada Nabi dalam riwayat Abu Dawud dan al-Nasa'i lemah. {cite:muwatta-maruf-1997 p.117}"
