label: { ar: "سنن أبي داود — حديث 4892", en: "Sunan Abi Dawud 4892 — General Behavior (Kitab Al-Adab)", ur: "سنن ابی داؤد — حدیث 4892" }
text: "… مَرْيَمَ، أَخْبَرَنَا اللَّيْثُ، قَالَ حَدَّثَنِي إِبْرَاهِيمُ بْنُ نَشِيطٍ، عَنْ كَعْبِ بْنِ عَلْقَمَةَ، أَنَّهُ سَمِعَ أَبَا الْهَيْثَمِ، يَذْكُرُ أَنَّهُ سَمِعَ دُخَيْنًا، كَاتِبَ عُقْبَةَ بْنِ عَامِرٍ قَالَ كَانَ لَنَا جِيرَانٌ يَشْرَبُونَ الْخَمْرَ فَنَهَيْتُهُمْ فَلَمْ يَنْتَهُوا فَقُلْتُ لِعُقْبَةَ بْنِ عَامِرٍ إِنَّ جِيرَانَنَا هَؤُلاَءِ يَشْرَبُونَ الْخَمْرَ وَإِنِّي نَهَيْتُهُمْ فَلَمْ يَنْتَهُوا فَأَنَا دَاعٍ لَهُمُ الشُّرَطَ ‏.‏ فَقَالَ دَعْهُمْ ‏.‏ ثُمَّ رَجَعْتُ إِلَى عُقْبَةَ مَرَّةً أُخْرَى …"
summary:
  ar: "في سنن أبي داود؛ ذكر كتابة كتاب أو إرساله."
