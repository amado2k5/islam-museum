label: { ar: "الموطأ 606 — نعى النبي النجاشي للناس في اليوم الذي مات فيه وصلى عليه بالمصلى أربع تكبيرات", en: "Muwatta 606", es: "Muwatta 606", fr: "Muwatta 606", ur: "موطا 606", tr: "El-Muvatta 606 — Peygamberimiz, Negus'un vefat ettiği gün, onun ölümünü insanlara duyurdu ve namaz yerinde dört tekbirle namaz kıldı.", id: "Al-Muwatta 606 — Nabi mengumumkan kematian Negus kepada orang-orang pada hari kematiannya dan mendoakannya di tempat shalat dengan empat takbir." }
summary:
  ar: "أول حديث في باب التكبير على الجنائز. يرويه مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة، أن النبي نعى النجاشي للناس في اليوم الذي مات فيه، وخرج بهم إلى المصلى فصف بهم وكبر أربع تكبيرات. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (1245)، وابن المبارك عند النسائي، والقعنبي عند أبي داود (3204)، والتنيسي عند البخاري (1334)، وقتيبة عند النسائي، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم (3/54)، وأن الحديث محفوظ أيضاً من حديث الزهري عن سعيد وأبي سلمة معاً كما في الصحيحين، وأن رواية مالك في جميع الموطآت عن سعيد وحده. {cite:muwatta-maruf-1997 p.311} {cite:muwatta-maruf-1997 p.312}"
  id: "Hadits pertama tentang topik membaca takbir (Allahu Akbar) pada pemakaman. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) mengumumkan kematian Negus kepada orang-orang pada hari kematiannya. Beliau mengajak mereka ke tempat shalat, mengatur mereka dalam barisan, dan membaca empat takbir. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Ibn Hibban dan al-Baghawi, dan oleh Isma'il ibn Abi Uways dalam al-Bukhari (1245), Ibn al-Mubarak dalam al-Nasa'i, al-Qa'nabi dalam Abu Dawud (3204), al-Tunisi dalam al-Bukhari (1334), Qutaybah dalam al-Nasa'i, al-Shafi'i, dan Yahya ibn Yahya al-Naysaburi dalam Muslim (3/54). Hadits ini juga terpelihara dari riwayat al-Zuhri atas otoritas Sa'id dan Abu Salamah, sebagaimana terdapat dalam dua kitab Sahih (al-Bukhari dan Muslim). Riwayat Malik dalam semua kitab Muwatta hanya berdasarkan otoritas Sa'id saja. {kutip:muwatta-maruf-1997 hal.311} {kutip:muwatta-maruf-1997 hal.312}"
