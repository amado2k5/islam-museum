label: { ar: "الموطأ 606 — نعى النبي النجاشي للناس في اليوم الذي مات فيه وصلى عليه بالمصلى أربع تكبيرات", en: "Muwatta 606" }
summary:
  ar: "أول حديث في باب التكبير على الجنائز. يرويه مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة، أن النبي نعى النجاشي للناس في اليوم الذي مات فيه، وخرج بهم إلى المصلى فصف بهم وكبر أربع تكبيرات. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وإسماعيل بن أبي أويس عند البخاري (1245)، وابن المبارك عند النسائي، والقعنبي عند أبي داود (3204)، والتنيسي عند البخاري (1334)، وقتيبة عند النسائي، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم (3/54)، وأن الحديث محفوظ أيضاً من حديث الزهري عن سعيد وأبي سلمة معاً كما في الصحيحين، وأن رواية مالك في جميع الموطآت عن سعيد وحده. {cite:muwatta-maruf-1997 p.311} {cite:muwatta-maruf-1997 p.312}"
