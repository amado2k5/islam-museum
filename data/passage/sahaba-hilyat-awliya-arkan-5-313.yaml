text: "… البدل، ولا تذهبن الى سلعة قد بارت على من كان قبلك ترجو أن تجوز عنك، فاتق اللّٰه يا أمير المؤمنين فافتح الابواب، وسهل الحجاب، وانصر المظلوم، ورد الظالم. ثلاث من كن فيه استكمل الايمان بالله، من اذا رضى لم يدخله …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 5، ص 313، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 5, p. 313, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 5، ص 313 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
