summary:
  ar: "قول يرويه يحيى عن مالك: سمع أهل العلم يقولون: من أهل بحج مفرد ثم بدا له أن يهل بعده بعمرة فليس له ذلك. ويقول مالك: وذلك الذي أدركت عليه أهل العلم ببلدنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (1080). {cite:muwatta-maruf-1997 p.452}"
