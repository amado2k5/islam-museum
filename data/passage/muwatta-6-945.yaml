label: { ar: "الموطأ 945 — مالك: من أهل بحج مفرد ثم بدا له أن يهل بعده بعمرة فليس له ذلك؛ وذلك ما أدرك عليه أهل العلم ببلدنا", en: "Muwatta 945", es: "Muwatta 945", fr: "Muwatta 945", ur: "موطا 945", tr: "El-Muvatta 945 — Malik: Bir Hac için ihrama giren ve daha sonra Umre için de ihrama girmeye karar veren kimsenin bunu yapması caiz değildir; bu, ülkemizin âlimlerinin vardığı sonuçtur.", id: "Al-Muwatta 945 — Malik: Barang siapa yang memasuki ihram untuk satu kali ibadah haji dan kemudian memutuskan untuk memasuki ihram untuk ibadah umrah setelahnya, maka ia tidak diperbolehkan melakukannya; dan itulah kesimpulan para ulama di negeri kita." }
summary:
  ar: "قول يرويه يحيى عن مالك: سمع أهل العلم يقولون: من أهل بحج مفرد ثم بدا له أن يهل بعده بعمرة فليس له ذلك. ويقول مالك: وذلك الذي أدركت عليه أهل العلم ببلدنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (1080). {cite:muwatta-maruf-1997 p.452}"
  tr: "Yahya'nın Malik'ten rivayet ettiği bir hadis şöyledir: Alimler şöyle demişlerdir: \"Kim tek bir Hac için ihrama girer ve sonra Umre için ihrama girmeye karar verirse, bu caiz değildir.\" Malik şöyle demiştir: \"Ülkemizdeki alimlerin böyle yaptığını gördüm.\" Editör, bu hadisin Malik'ten Ebu Mus'ab ve Muhammed ibn el-Hasan el-Şeybani (ö. 1080 Hicri) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.452}"
  id: "Sebuah pernyataan yang diriwayatkan oleh Yahya dari Malik: Para ulama berkata: Barang siapa memasuki keadaan ihram untuk satu kali haji dan kemudian memutuskan untuk memasuki keadaan ihram untuk umrah setelahnya, maka tidak diperbolehkan melakukannya. Malik berkata: Inilah yang saya temukan dilakukan oleh para ulama di negeri kita. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Muhammad ibn al-Hasan al-Shaybani (wafat 1080 H). {cite:muwatta-maruf-1997 p.452}"
