text: "… بيدهِ وينكُص على عقبيهِ فأتوهُ فقالوا: ما لَك يا أبا الحكمِ؟! قالَ : إِنَّ بيني وبينهُ لخندقاً مِنْ نارٍ وهولاً وأجنحةً قالَ أَبُو المعتمر : العلق: إلى آخره فأنزلَ اللَّهُ جلَّ وعلا: أَرَيْتَ الَّذِي يَنْعَىّ العلق: عَبْدًا إِذَا صَلَّى فَلْدْعُ …"
summary:
