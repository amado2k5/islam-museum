text: "… ينفقون وأنفقوا مما رزقناكم ونحوذلك، قالوا : اإنه منسوخ بآية الزكاة، وليس كذلك هوباق، أما الأولى فإ خبر في معرض الثناء عليهم بالإنفاق، وذلك يصلح أن يفسر بالزكاة على الأهل وبالإنفاق في الأمور المندوبة كالإعانة ا نفقة واجبة غير الزكاة، …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 4، ص 332، يرد فيه ذكر الواجب، والمندوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 4, p. 332, whose wording mentions the obligatory (wajib), the recommended (mandub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 4، ص 332 کا اقتباس جس میں واجب، مندوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, volume numérisé 4, p. 332, dont le texte mentionne l'obligatoire (wajib), le recommandé (mandub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
