text: "… ينفقون وأنفقوا مما رزقناكم ونحوذلك، قالوا : اإنه منسوخ بآية الزكاة، وليس كذلك هوباق، أما الأولى فإ خبر في معرض الثناء عليهم بالإنفاق، وذلك يصلح أن يفسر بالزكاة على الأهل وبالإنفاق في الأمور المندوبة كالإعانة ا نفقة واجبة غير الزكاة، …"
