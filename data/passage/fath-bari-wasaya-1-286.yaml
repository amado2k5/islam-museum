text: "… يَحْيَى عَنْ إِسْمَاعِيْلَ حَدَّثَنَا قَيْسٌ عَنْ خَبَّابِ بْنِ الأرَتِّ قَالَ : شَكَوْنَا إِلَى رَسُولِ اللّهِ له وَهُوَ مُتَوَسِّدٌ بُرْدَةً لَهُ فِي ظِلِّ الْكَعْبَةِ، قُلْنَا لَهُ: أَلا تَسْتَنْصِرُ لَنَا؟ أَلَا تَدْعُو اللَّهَ لَنَا؟ قَالَ: كَانَ الرَّجُلُ فِيمَنْ قَبْلَكُمْ يُحْفَرُ لَهُ فِي …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 286، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 1, p. 286, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 1، ص 286 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de Fath al-Bari de Ibn Hajar, volumen 1, pág. 286, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fath al-Bari d'Ibn Hajar (tome 1, p. 286) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "İbn Hajar'ın Fath al-Bari adlı eserinin resimli 1. cildinin 286. sayfasında, mezar, türbe ve kutsal mekandan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetler, Miras, Antik Eserler ve Kutsal Mekanlar Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, jilid bergambar 1, halaman 286, menyebutkan penguburan, kuburan, dan tempat suci; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritance, Antiquities, and Shrines Browser."
