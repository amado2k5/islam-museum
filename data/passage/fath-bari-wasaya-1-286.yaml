text: "… يَحْيَى عَنْ إِسْمَاعِيْلَ حَدَّثَنَا قَيْسٌ عَنْ خَبَّابِ بْنِ الأرَتِّ قَالَ : شَكَوْنَا إِلَى رَسُولِ اللّهِ له وَهُوَ مُتَوَسِّدٌ بُرْدَةً لَهُ فِي ظِلِّ الْكَعْبَةِ، قُلْنَا لَهُ: أَلا تَسْتَنْصِرُ لَنَا؟ أَلَا تَدْعُو اللَّهَ لَنَا؟ قَالَ: كَانَ الرَّجُلُ فِيمَنْ قَبْلَكُمْ يُحْفَرُ لَهُ فِي …"
