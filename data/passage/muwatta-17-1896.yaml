label: { ar: "الموطأ 1896 — مالك: لا بأس أن يضع الرجل عند الرجل درهما، ثم يأخذ منه برعب أو بثلث أو بكسر معلوم سلعة معلومة، فإذا لم يكن في ذلك سعر معلوم فهو غرر لا يحل", en: "Muwatta 1896", es: "Muwatta 1896", fr: "Muwatta 1896", ur: "موطا 1896", tr: "El-Muvatta 1896 — Malik: Bir kimsenin başka bir kimseye bir dirhem yatırmasında, sonra ondan bilinen bir malı bilinen bir fiyattan, ya da üçte birini, ya da bilinen bir kısmını almasında bir sakınca yoktur. Eğer bunun için bilinen bir fiyat yoksa, o zaman bu belirsizliktir ve caiz değildir.", id: "Al-Muwatta 1896 — Malik: Tidak ada salahnya seseorang menitipkan satu dirham kepada orang lain, kemudian mengambil darinya barang yang harganya sudah diketahui, atau sepertiganya, atau sebagiannya. Jika harganya tidak diketahui, maka itu adalah ketidakpastian dan tidak diperbolehkan." }
summary:
  ar: "قال مالك: ولا بأس بأن يضع الرجل عند الرجل درهما، ثم يأخذ منه بربع أو بثلث أو بكسر معلوم سلعة معلومة. فإذا لم يكن في ذلك سعر معلوم، وقال الرجل: آخذ منك بسعر كل يوم، فهذا لا يحل، لأنه غرر، يقل مرة ويكثر مرة، ولم يفترقا على بيع معلوم. {cite:muwatta-maruf-1997 p.179}"
  tr: "Malik şöyle dedi: Bir adamın başka bir adama bir dirhem yatırmasında ve sonra ondan bilinen bir malı çeyrek, üçte bir veya bilinen bir kesir karşılığında almasında bir sakınca yoktur. Ancak, bilinen bir fiyat yoksa ve adam, \"Her gün senden aynı fiyattan alacağım\" derse, bu caiz değildir, çünkü bu belirsizliktir; fiyat bir gün daha düşük, ertesi gün daha yüksek olabilir ve bilinen bir satış üzerinden ayrılmamışlardır. {cite:muwatta-maruf-1997 s.179}"
  id: "Malik berkata: Tidak ada salahnya jika seseorang menitipkan satu dirham kepada orang lain, kemudian mengambil barang yang harganya diketahui dari orang tersebut dengan harga seperempat, sepertiga, atau sebagian kecil yang diketahui. Namun, jika tidak ada harga yang diketahui, dan orang tersebut berkata, \"Saya akan mengambil dari Anda dengan harga setiap hari,\" maka hal ini tidak diperbolehkan, karena ada ketidakpastian, karena harga bisa lebih rendah pada suatu hari dan lebih tinggi pada hari berikutnya, dan mereka tidak berpisah berdasarkan penjualan yang diketahui. {cite:muwatta-maruf-1997 p.179}"
