summary:
  ar: "قال مالك: ولا بأس بأن يضع الرجل عند الرجل درهما، ثم يأخذ منه بربع أو بثلث أو بكسر معلوم سلعة معلومة. فإذا لم يكن في ذلك سعر معلوم، وقال الرجل: آخذ منك بسعر كل يوم، فهذا لا يحل، لأنه غرر، يقل مرة ويكثر مرة، ولم يفترقا على بيع معلوم. {cite:muwatta-maruf-1997 p.179}"
