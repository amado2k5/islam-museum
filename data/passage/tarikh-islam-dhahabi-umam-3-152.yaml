text: "… الحقيق بخَيْبر ومعهم آنية كثيرة من فضّة، فرآها النّبيّ لام والمسلمون. وعمد حُيَيُّ بنُ أَخْطب حتى قدِم مكةً على قُريشن، فاستغواهم على رسول اللّٰه لي. وبيَّن اللّٰه لرسوله حديثَ أهل النّفاق، وما بينهم وَبين اليهود، وكانوا ب قد عيَّروا المسلمين …"
