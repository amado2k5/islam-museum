text: "… كرمان فبلدة مشهورة من بلاد العجم أيضًا بين خراسان وبحر الهند، ورواه عضهم خور كرمان براء مهملة وبالإضافة والإشكال باق، ويمكن أن يجاب بأن هذا الحديث غير حديث قتال الترك، ويجتمع منهما الإنذار بخروج الطائفتين، وقد تقدم من الإشارة إلى …"
