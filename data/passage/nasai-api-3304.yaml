label: { ar: "سنن النسائي 3304 — ما أُحل، ما لا يحل", en: "Sunan al-Nasa'i 3304 — what was made lawful; what is not lawful", ur: "سنن نسائی 3304 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan al-Nasa'i 3304 — Lo que se ha hecho lícito; lo que no lo es", fr: "Sunan al-Nasa'i 3304 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sunan an-Nasa'i 3304 — Neler caizdir, neler caiz değildir", id: "Sunan an-Nasa'i 3304 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "أَخْبَرَنَا هَنَّادُ بْنُ السَّرِيِّ، عَنْ أَبِي مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ سَعْدِ بْنِ عُبَيْدَةَ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ السُّلَمِيِّ، عَنْ عَلِيٍّ، قَالَ قُلْتُ يَا رَسُولَ اللَّهِ مَا لَكَ تَنَوَّقُ فِي قُرَيْشٍ وَتَدَعُنَا قَالَ \" وَعِنْدَكَ أَحَدٌ \". قُلْتُ نَعَمْ بِنْتُ حَمْزَةَ. قَالَ رَسُولُ اللَّهِ \" إِنَّهَا لاَ تَحِلُّ لِي إِنَّهَا ابْنَةُ أَخِي مِنَ الرَّضَاعَةِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3304، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3304 (The Book of Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3304، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3304 (El Libro del Matrimonio), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3304 (Le Livre du Mariage), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sunan-ı Nesai'de yer alan 3304 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3304, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
