text: "… قال: أطاعوهم فيما أمروهم به من تحريم حلال وتحليل حرام، فعبدوهم بذلك. - حدثنا أبو أسامة قال أخبرني مسعر عن أبي العنبس، قال: قال أبو البختري : لأن أكون في قوم أعلم مني أحب إليَّ من أن أكون في قوم …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 156، يذكر الحلال، والحرام، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 156, that mentions the lawful, the unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
