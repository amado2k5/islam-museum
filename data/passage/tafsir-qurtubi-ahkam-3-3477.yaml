text: "… فرض على الكفاية، ومن الناس من قال: إنها واجبة في القرى حيث لا طعام ولا مأوى، بخلاف الحواضر فإنها مشحونة بالمأْوَاة والأقوات؛ ولا شك أن الضّيف كريم، والضيافة كرامة؛ فإن كان غريباً فهي فريضة. الرابعة - قال أبن العربيّ قال …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 3477، يرد فيه ذكر الفريضة والفرائض، وما فُرض على الناس، والفرض، وفرض الكفاية، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 3477, whose wording mentions the obligation (farida), what was made obligatory on people, the obligatory (fard), the communal obligation (fard kifaya), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
