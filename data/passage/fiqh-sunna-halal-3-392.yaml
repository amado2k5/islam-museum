text: "… مجانين، وتورث من مهانة آكلها ودناءة نفسه وغير ذلك ما لا تورث الخمر. ففيها من المفاسد ما ليس في الحمر. فهي بالتحريم أولى. وقد أجمع المسلمون على أن السكر منها حرام. ومن استحل ذلك وزعم أنه حلال فإنه يُسْتَتَاب فإن …"
summary:
