text: |-
  ٥٧٦
  (باب المين
  الجعدى يصف خشفا
  وخدّ كبرقوع الفتاة ملع * وروقين لما يعدوان تقشرا
  يقال برقعه فتبرقع أى ألبسه البرة-ع ذابسه والمبرقعة الشاة البيضا الرأس والمبرقعة بكسر
  القاف غرة الفرس اذا أخذت جميع وجهه غيرأنه يظرفى سواد بقال غرة مبرقعة وبرقع
  بالكسراسم السماء السابعة لا ينصرف قال أمية بن أبى الصلت
  فكان برقع والملائك حوله * سدرتوا كله القوائم أجرب
  قوله سدر أى بحروأجرب صفة البحر المشبه به السماء فكأنه وصف البر بالجرب لما يحصل
  فيه من الموج أولانه ترى فيه الكواكب كماترى فى السماء فهى كالجرب له وأماسماء
  الدنيافهى الرقيع ( كع . البركعة القيام عسلى أربع وبركعه قتبركع اى صرعه فوقع
  على استه قال الراجز
  ومن همزناعزه تبركعا * على استه زوبعة أوزوبعا
  ( بزع البزيع الظريف ولا يوصف به الا الاحداث وكذلك البزاع بالضم حكاءأبو عبيدة
  عن يونس بن حبيب الضى النحوى تقول منه بزع بالضم بزاعة وتبزع انغلام أى ظرف وقبزع
  الشرّأى تفاقم وقال آبو الغوث غلام بزيع أى مسكام لايستي والبزاعة معما يحمدبه
  الانسان والمرأة بزيعة وبوزع اسم رملة من رمال بنى سعد وبوزع فى شعر جريراسم امرأة
  شع ى يشع أى كريه الطعم بأخذبا لحلق بين البشاعة ورجل بشع بين البشع اذا
  أكله فبشع منه واستبنع الشى أى عد. يشعا صع لبصع المع معته من بعض
  النحويين ولا أدرى ماصحته ويقال مضى بصع من اللسل بالكسر أى جوش منه وأبصع
  كلة يؤكد بها وبعضهم يقوله بالضاء المعجمة وليس بالعالى نقول أخذت حفي أبحع أبصع
  والاتى بجعاء بصعاء وياء القوم أجمعون أبصعون ورأيت النسوة جمع بصع وهو تأ كيد مرتب
  الا يقدم على أج-ع ضع لبضاعة طائعة من مالك تبعنها للتجارة تقول أيضعت الشئ
  واستبضعته أى جعلته بضاءة وفى المثل كمستبضع تمرالى هجر وذلك ان هجر معدن التمر
  والباضعة النهجة التى نقطع الجلد وتشق اللعم وتدمى الا أنه لا يسيل الدم فان سال قهو
  الدامية والباضعة أيضا الفرق من الغنم قال الاصمعى سيف ياضع اذامر بشى يضعه أى
  قطع منه بضعة وبضع فى العدد بكسر الباء وبعض العرب يقتصها وهومابين الثلاث الى التسع
  تقول بضع سنين ويضعة عشر رجلا وبضع عشرة امرأة فاذاجاوزت لفظ العشر ذهب
  البضع لا تقول بضع وعشرون والبضعة القطعة من اللحم (هذه بالفتح واخواتها بالكسر مثل
  القطعة والفلذة والفدرة والكسفة والخرفة والجذوة ومالايحصى والجع بضع مثل ترة وتمر
  قال زهير وما عند -عر تحجل الطيرحوله • ويضع لحام فى إهاب مقدد
  وبعضهم يقول بجعها بضع كبدرة ويدروبضعت اللحم بضعا بالفتح قطعته وبضعت الجرح
  شققته والمبضع ما ييضع به العرق والاديم وبضعت من الماه بضعارويت وفى الم-ل حتى منى
  تكرع ولا تبضع وربما هالوابضعت من فلان اذاسثمت منه وه وعلى التشيه وأبضعى الماه
  أروانى وربما قالواسألى فلان عن مسئله فأيضعته اذا شفيته والبضع بالضم النكاح عن ابن
  السكيت قال يقال ملك فلان بضع فلانة والمباضعة المجامعة وهى البضاع وفى المثل كمعلمة
  امها
