text: "… الباطن، ليَأْمنَ الفَرِيقين، وهؤلاء هم المنافقون، فعَاملَ كُلَّ طائفة من هذه الطوائِف بما أَمره ربُّه تبارك وتَعالى؛ فصالح يهودَ المدينة وكتب بينه وبينهم كتابَ أَمن، وكانوا ثلاث طوائف حول المدينة : بنى قَيْنُقاع وبنِ النَّضِير وبَنِى قُريْظَة، فنَقضَ العَهدَ الجميعُ، …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 2140، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
