text: "… جيراننا يشمون من الماليخوليا اشتهى يوماً الحساء الشوربا وقال لو كان عندي حساءً عليه النعناع والبهارات لكنت آكله بشهوة. وإذا بالباب يطرق وقد أتى ولد من الجيران، وبيدِهِ وعاء، فدخل. وقال: والدتي مريضة، وتريد شيئاً من الحساء. فقال الشيخ: جيراننا …"
summary:
  ar: "اشتهى جحا حساء بالنعناع والتوابل، فجاء ولد الجار يطلب حساء لأمه المريضة، فقال جحا: جيراننا يشمون من الماليخوليا؟ {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  en: "Juha craves a soup with mint and spices, and a neighbour's boy comes asking for soup for his sick mother. Juha says, 'Our neighbours smell melancholy?' {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  ur: "جحا کا پودینے اور مسالوں والے شوربے کو جی چاہتا ہے کہ ایک پڑوسی کا لڑکا اپنی بیمار ماں کے لیے شوربہ مانگنے آ جاتا ہے۔ جحا کہتا ہے: کیا ہمارے پڑوسی مالیخولیا سونگھتے ہیں؟ {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  fr: "Juha a envie d'une soupe à la menthe et aux épices, et le fils d'un voisin vient demander de la soupe pour sa mère malade. Juha dit : « Nos voisins flairent la mélancolie ? » {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  es: "A Juha le apetece una sopa con menta y especias, y el hijo de un vecino viene a pedir sopa para su madre enferma. Juha dice: «¿Nuestros vecinos huelen la melancolía?». {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  tr: "Juha nane ve baharatlı çorba istiyordu ve komşunun oğlu hasta annesi için çorba istemeye geldi. Juha, \"Komşularımız melankoli mi kokuyor?\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 127}"
  id: "Juha mendambakan sup mint dan rempah-rempah, dan putra tetangga datang meminta sup untuk ibunya yang sakit. Juha berkata: \"Apakah tetangga kita berbau melankolis?\" {cite:juha-nawadir-kubra-djuwaydi p. 127}"
