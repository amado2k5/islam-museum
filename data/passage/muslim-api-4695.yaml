label: { ar: "صحيح مسلم 4695 — الأب والأبوة", en: "Sahih Muslim 4695 — the father and fatherhood", ur: "صحیح مسلم 4695 — باپ اور والدیت", es: "Sahih Muslim 4695 — El padre y la paternidad", fr: "Sahih Muslim 4695 — Le père et la paternité", tr: "Sahih Muslim 4695 — Baba ve Babalık", id: "Sahih Muslim 4695 — Ayah dan Peran Ayah" }
text: "… أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا زَيْدُ بْنُ الْحُبَابِ، ح وَحَدَّثَنَا سَعِيدُ بْنُ مُحَمَّدٍ، الْجَرْمِيُّ حَدَّثَنَا أَبُو تُمَيْلَةَ، قَالاَ جَمِيعًا حَدَّثَنَا حُسَيْنُ بْنُ وَاقِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ،. قَالَ غَزَا رَسُولُ اللَّهِ تِسْعَ عَشْرَةَ غَزْوَةً قَاتَلَ فِي ثَمَانٍ مِنْهُنَّ. وَلَمْ يَقُلْ أَبُو بَكْرٍ مِنْهُنَّ. وَقَالَ فِي حَدِيثِهِ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4695، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4695 (The Book of Jihad and Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4695، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4695 (El Libro de la Yihad y las Expediciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 4695 (Livre du Jihad et des Expéditions), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 4695 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4695, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
