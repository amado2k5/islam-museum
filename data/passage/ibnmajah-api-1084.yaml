label: { ar: "سنن ابن ماجه 1084 — الحرام", en: "Sunan Ibn Majah 1084 — the unlawful", ur: "سنن ابن ماجہ 1084 — حرام", es: "Sunan Ibn Majah 1084 - lo ilegal", fr: "Sunan Ibn Majah 1084 — l'illégal", tr: "Sünen İbni Mace 1084 — Haram", id: "Sunan Ibnu Majah 1084 — Al-Haram" }
text: "… فِيهِ خَمْسُ خِلاَلٍ. خَلَقَ اللَّهُ فِيهِ آدَمَ. وَأَهْبَطَ اللَّهُ فِيهِ آدَمَ إِلَى الأَرْضِ. وَفِيهِ تَوَفَّى اللَّهُ آدَمَ. وَفِيهِ سَاعَةٌ لاَ يَسْأَلُ اللَّهَ فِيهَا الْعَبْدُ شَيْئًا إِلاَّ أَعْطَاهُ. مَا لَمْ يَسْأَلْ حَرَامًا. وَفِيهِ تَقُومُ السَّاعَةُ. مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلاَ سَمَاءٍ وَلاَ أَرْضٍ وَلاَ رِيَاحٍ وَلاَ جِبَالٍ وَلاَ بَحْرٍ إِلاَّ وَهُنَّ يُشْفِقْنَ مِنْ يَوْمِ الْجُمُعَةِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1084، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 1084 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1084، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1084 (Establecimiento de la oración y la Sunnah al respecto), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 1084 (L'établissement de la prière et la Sunna à ce sujet), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde 1084 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" kitabının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 1084, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
