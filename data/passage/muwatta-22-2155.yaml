label: { ar: "الموطأ 2155 — يحيى عن مالك عن ابن شهاب عن سنين أبي جميلة رجل من بني سليم: وجد منبوذا في زمان عمر بن الخطاب، فجاء به إلى عمر، فسأله عمر، فقال: وجدته ضائعة فأخذته، فقال عريفه: إنه رجل صالح، فقال عمر: اذهب فهو حر، وله ولاؤه، وعلينا نفقته", en: "Muwatta 2155", es: "Muwatta 2155", fr: "Muwatta 2155", ur: "موطا 2155", tr: "El-Muvatta 2155 — Yahya, Malik'ten, o da İbn Şihab'tan, o da Beni Süleym kabilesinden Sinin Ebu Cemila'dan rivayet eder: Ömer ibn el-Hattab zamanında terk edilmiş halde bulunmuş, bu yüzden Ömer'e getirilmiştir. Ömer ona sormuş, o da: \"Onu kaybolmuş halde buldum ve yanıma aldım\" demiştir. Velisi: \"O salih bir adamdır\" demiştir. Ömer: \"Git, o serbesttir, biatı ona aittir ve masraflarını biz karşılarız\" demiştir.", id: "Al-Muwatta 2155 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Sinin Abi Jamila, seorang pria dari Banu Sulaym: Ia ditemukan terlantar pada masa Umar ibn al-Khattab, lalu dibawa kepada Umar. Umar bertanya kepadanya, dan ia berkata: Aku menemukannya tersesat dan membawanya masuk. Walinya berkata: Ia adalah orang yang saleh. Umar berkata: Pergilah, ia bebas, dan kesetiaannya adalah kepada Umar, dan kita bertanggung jawab atas biaya hidupnya." }
summary:
  ar: "قال يحيى: قال مالك عن ابن شهاب عن سنين أبي جميلة، رجل من بني سليم، أنه وجد منبوذا في زمان عمر بن الخطاب، قال: فجئت به إلى عمر بن الخطاب، فقال: ما حملك على أخذ هذه النسمة؟ فقال: وجدتها ضائعة فأخذتها. فقال له عريفه: يا أمير المؤمنين، إنه رجل صالح. فقال له عمر: أكذلك؟ قال: نعم. فقال عمر بن الخطاب: اذهب فهو حر، ولك ولاؤه، وعلينا نفقته. {cite:muwatta-maruf-1997 p.282}"
  tr: "Yahya şöyle dedi: Malik, İbn Şihab'dan, o da Beni Süleym kabilesinden Sinin Ebu Cemila'dan rivayet ettiğine göre, Ömer ibn el-Hattab zamanında terk edilmiş bir çocuk bulmuş. Şöyle demiş: \"Onu Ömer ibn el-Hattab'a getirdim. Ömer, 'Bu canı neden aldın?' diye sordu. Adam, 'Kaybolmuş halde buldum, bu yüzden aldım.' dedi. Çocuğun vasisi ona, 'Ey Müminlerin Emiri, o salih bir adamdır.' dedi. Ömer ona, 'Öyle mi?' diye sordu. Adam, 'Evet.' dedi. Ömer ibn el-Hattab, 'Git, o özgürdür, sana biat etmiştir, biz ona rızık vereceğiz.' dedi.\" {cite:muwatta-maruf-1997 s.282}"
  id: "Yahya berkata: Malik meriwayatkan dari Ibnu Shihab, dari Sinin Abi Jamila, seorang pria dari Bani Sulaym, bahwa ia menemukan seorang anak terlantar pada masa Umar ibn al-Khattab. Ia berkata: Maka aku membawanya kepada Umar ibn al-Khattab, dan beliau bertanya: Apa yang membuatmu mengambil jiwa ini? Ia menjawab: Aku menemukannya tersesat, maka aku membawanya. Walinya berkata kepadanya: Wahai Amirul Mukminin, dia adalah orang yang saleh. Umar bertanya kepadanya: Benarkah begitu? Ia menjawab: Ya. Umar ibn al-Khattab berkata: Pergilah, dia bebas, dan kesetiaannya kepadamu, dan kami akan menafkahinya. {kutipan:muwatta-maruf-1997 hlm. 282}"
