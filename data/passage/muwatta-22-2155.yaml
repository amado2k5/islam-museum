label: { ar: "الموطأ 2155 — يحيى عن مالك عن ابن شهاب عن سنين أبي جميلة رجل من بني سليم: وجد منبوذا في زمان عمر بن الخطاب، فجاء به إلى عمر، فسأله عمر، فقال: وجدته ضائعة فأخذته، فقال عريفه: إنه رجل صالح، فقال عمر: اذهب فهو حر، وله ولاؤه، وعلينا نفقته", en: "Muwatta 2155" }
summary:
  ar: "قال يحيى: قال مالك عن ابن شهاب عن سنين أبي جميلة، رجل من بني سليم، أنه وجد منبوذا في زمان عمر بن الخطاب، قال: فجئت به إلى عمر بن الخطاب، فقال: ما حملك على أخذ هذه النسمة؟ فقال: وجدتها ضائعة فأخذتها. فقال له عريفه: يا أمير المؤمنين، إنه رجل صالح. فقال له عمر: أكذلك؟ قال: نعم. فقال عمر بن الخطاب: اذهب فهو حر، ولك ولاؤه، وعلينا نفقته. {cite:muwatta-maruf-1997 p.282}"
