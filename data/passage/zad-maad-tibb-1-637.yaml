text: "… فإن الطبيعة نقالة. إخبار احد الأطباء لمصنف بقصتين عن نقل العرض برؤية المريض وأخبرني بعض حُذَّاق الأطباء، قال: كان لي ابْن أخت حَذِق في الكحل، فجلس كحالاً، فكان إذا فتح عينَ الرجل، ورأى الرمد وكحِّله، رَمِدَ هو، وتكرر ذلك منه، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 637، يذكر الكحل، والطب والطبيب، والمرض والمريض، وأسماء الأمراض، والبيمارستان وصناعة الطب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 637, that mentions kohl for the eye, medicine and the physician, illness and the sick, named diseases, the hospital and the medical craft; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 637 کا اقتباس جس میں سرمہ، طب اور طبیب، بیماری اور بیمار، بیماریوں کے نام، بیمارستان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 637, que menciona el kohl para los ojos, la medicina y el médico, la enfermedad y los enfermos, enfermedades específicas, el hospital y la práctica médica; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 637, qui mentionne le khôl pour l'œil, la médecine et le médecin, la maladie et les malades, les maladies nommées, l'hôpital et l'art médical; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 637. sayfasında, sürme, tıp ve hekim, hastalık ve hasta, hastalıkların isimleri, hastane ve tıp mesleğinden bahsedilmektedir; bu metin, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 637, menyebutkan kohl, obat-obatan dan dokter, penyakit dan pasien, nama-nama penyakit, rumah sakit dan profesi medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
