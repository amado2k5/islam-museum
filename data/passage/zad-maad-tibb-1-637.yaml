text: "… فإن الطبيعة نقالة. إخبار احد الأطباء لمصنف بقصتين عن نقل العرض برؤية المريض وأخبرني بعض حُذَّاق الأطباء، قال: كان لي ابْن أخت حَذِق في الكحل، فجلس كحالاً، فكان إذا فتح عينَ الرجل، ورأى الرمد وكحِّله، رَمِدَ هو، وتكرر ذلك منه، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 637، يذكر الكحل، والطب والطبيب، والمرض والمريض، وأسماء الأمراض، والبيمارستان وصناعة الطب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
