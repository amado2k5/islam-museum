label: { ar: "الموطأ 2028 — مالك: فيمن أخذ من رجل مالا قراضا ثم دفعه إلى رجل آخر فعمل فيه قراضا بغير إذن صاحبه: إنه ضامن للمال، إن نقص فعليه النقصان، وإن ربح فلصاحب المال شرطه من الربح، ثم يكون للذي عمل شرطه بما بقي", en: "Muwatta 2028", es: "Muwatta 2028", fr: "Muwatta 2028", ur: "موطا 2028", tr: "Al-Muwatta 2028 — Malik: Bir kimseden borç alıp, sahibinin izni olmadan başka birine borç olarak verip, o kişinin de bunu yatırım yapmasına izin veren kimse, paradan sorumludur. Eğer para azalırsa, zararı o karşılar. Eğer para artarsa, paranın sahibi kârın kendi payına düşen kısmını almaya hak kazanır, daha sonra yatırım yapan kişi de kalan kısmın kendi payına düşen kısmını almaya hak kazanır.", id: "Al-Muwatta 2028 — Malik: Mengenai orang yang mengambil uang dari seseorang sebagai pinjaman dan kemudian memberikannya kepada orang lain yang menginvestasikannya sebagai pinjaman tanpa izin pemiliknya: dia bertanggung jawab atas uang tersebut. Jika nilainya berkurang, dia menanggung kerugiannya. Jika nilainya bertambah, pemilik uang berhak atas bagian keuntungannya, dan kemudian orang yang menginvestasikannya berhak atas bagian sisanya." }
summary:
  ar: "قال مالك في رجل أخذ من رجل مالا قراضا، ثم دفعه إلى رجل آخر، فعمل فيه قراضا بغير إذن صاحبه: إنه ضامن للمال، إن نقص فعليه النقصان، وإن ربح فلصاحب المال شرطه من الربح، ثم يكون للذي عمل شرطه بما بقي من المال. {cite:muwatta-maruf-1997 p.229}"
  tr: "Malik, birinden borç para alan, sonra da bu parayı sahibinin izni olmadan başka birine borç olarak veren ve o kişinin de parayı yatırıma yönlendiren bir adam hakkında şöyle demiştir: \"Paradan sorumludur; eğer para azalırsa, zararı o karşılar, eğer artarsa, paranın sahibi kârın kendi payına düşen kısmını almaya hak kazanır ve daha sonra parayı yatırıma yönlendiren kişi de paranın kalan kısmının kendi payına düşen kısmını almaya hak kazanır.\" {cite:muwatta-maruf-1997 s.229}"
  id: "Malik berkata mengenai seorang pria yang mengambil uang dari seseorang sebagai pinjaman, kemudian memberikannya kepada pria lain yang menginvestasikannya sebagai pinjaman tanpa izin pemiliknya: Ia bertanggung jawab atas uang tersebut; jika nilainya berkurang, ia menanggung kerugian, dan jika nilainya bertambah, pemilik uang berhak atas bagian keuntungannya, dan kemudian orang yang menginvestasikannya berhak atas bagian sisa uang tersebut. {cite:muwatta-maruf-1997 p.229}"
