label: { ar: "الموطأ 437 — سهل بن سعد: كان الناس يؤمرون أن يضع الرجل اليمنى على ذراعه اليسرى", en: "Muwatta 437", es: "Muwatta 437", fr: "Muwatta 437", ur: "موطا 437", tr: "El-Muvatta 437 — Sahl ibn Saad: İnsanlara sağ ellerini sol önkollarının üzerine koymaları emredildi.", id: "Al-Muwatta 437 — Sahl ibn Saad: Orang-orang diperintahkan untuk meletakkan tangan kanan mereka di lengan kiri mereka." }
text: "كان الناس يؤمرون أن يضع الرجل اليد اليمنى على ذراعه اليسرى في الصلاة"
summary:
  ar: "يرويه مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي، في باب وضع اليدين إحداهما على الأخرى في الصلاة: كان الناس يؤمرون أن يضع الرجل يده اليمنى على ذراعه اليسرى في الصلاة؛ وقال أبو حازم إنه لا يعلم إلا أنه ينمي ذلك، أي يرفعه إلى النبي. ويخرّجه المحقق عند البخاري (740) وأحمد (5/336) والبيهقي والجوهري من طرق أصحاب مالك، ويحيل على التمهيد (21/96). {cite:muwatta-maruf-1997 p.226}"
  tr: "Malik, namazda bir elin diğerinin üzerine konulması bölümünde, Ebu Hazim ibn Dinar'dan, o da Sahl ibn Sa'd el-Sa'idi'den rivayet ederek şöyle nakletmiştir: İnsanlara namazda sağ ellerini sol önkollarının üzerine koymaları emredilmiştir. Ebu Hazim, bunu sadece rivayet yoluyla bildiğini, yani Peygamber'e kadar izini sürdüğünü söylemiştir. Editör, bunu Malik'in sahabelerinin rivayet zincirleriyle Buhari (740), Ahmed (5/336), Beyhaki ve Cevhari'nin derlemelerine dahil etmiş ve Temhid'e (21/96) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.226}"
  id: "Malik meriwayatkan hadits ini dari Abu Hazim ibn Dinar, yang juga dari Sahl ibn Sa'd al-Sa'idi, dalam surah tentang meletakkan satu tangan di atas tangan lainnya saat shalat: Orang-orang diperintahkan untuk meletakkan tangan kanan mereka di atas lengan kiri mereka saat shalat. Abu Hazim mengatakan bahwa ia hanya mengetahuinya melalui riwayat, artinya ia menelusurinya kembali kepada Nabi. Editor memasukkannya dalam kumpulan hadits al-Bukhari (740), Ahmad (5/336), al-Bayhaqi, dan al-Jawhari melalui rantai periwayatan para sahabat Malik, dan merujuk pada al-Tamhid (21/96). {cite:muwatta-maruf-1997 p.226}"
