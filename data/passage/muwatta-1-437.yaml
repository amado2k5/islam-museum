label: { ar: "الموطأ 437 — سهل بن سعد: كان الناس يؤمرون أن يضع الرجل اليمنى على ذراعه اليسرى", en: "Muwatta 437" }
text: "كان الناس يؤمرون أن يضع الرجل اليد اليمنى على ذراعه اليسرى في الصلاة"
summary:
  ar: "يرويه مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي، في باب وضع اليدين إحداهما على الأخرى في الصلاة: كان الناس يؤمرون أن يضع الرجل يده اليمنى على ذراعه اليسرى في الصلاة؛ وقال أبو حازم إنه لا يعلم إلا أنه ينمي ذلك، أي يرفعه إلى النبي. ويخرّجه المحقق عند البخاري (740) وأحمد (5/336) والبيهقي والجوهري من طرق أصحاب مالك، ويحيل على التمهيد (21/96). {cite:muwatta-maruf-1997 p.226}"
