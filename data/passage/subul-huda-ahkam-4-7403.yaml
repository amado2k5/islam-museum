text: "… الجنازة فى حقه عم فرض عين. كَمَا يُوْخَذُ مِنْ قَوْلٍ بَعْضِ الحَنَفِيَّةِ أنّ فِي عَهْدِهِ لُ لا يَسْقُطُ فَرْضُ الجَنازَة إلَّا بِصَلَاتِهِ. الخمسون وبوجوبٍ حِفْظِ أمْوَالِ المُسْلِمِينَ. قالهُ أبُو سَعِيد النِّسَابُورِى فِى الشُرَفِ. النوع الثانى من الواجبات فيما يتعلق بالنكاح. …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 7403، يرد فيه ذكر الفرض، وفرض العين، والواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 7403, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the obligatory (wajib), obligation (wujub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 7403 کا اقتباس جس میں فرض، فرضِ عین، واجب، وجوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
