label: { ar: "الموطأ 2135 — مالك: وفرق بين الثمر وبين ولد الجارية، أن رسول الله قال: من باع نخلا قد أبرت فثمرها للبائع، إلا أن يشترطه المبتاع", en: "Muwatta 2135", es: "Muwatta 2135", fr: "Muwatta 2135", ur: "موطا 2135", tr: "El-Muvatta 2135 — Malik: Meyve ile cariyenin yavrusu arasında fark vardır. Allah'ın Resulü şöyle buyurmuştur: Döllenmiş bir hurma ağacını satan kimsenin meyvesi, alıcı aksini şart koşmadıkça, satıcıya aittir.", id: "Al-Muwatta 2135 — Malik: Ada perbedaan antara buah dan anak perempuan seorang budak. Rasulullah SAW bersabda: Barang siapa menjual pohon kurma yang telah diserbuki, maka buahnya menjadi milik penjual, kecuali jika pembeli menetapkan sebaliknya." }
summary:
  ar: "قال مالك: وفرق بين الثمر وبين ولد الجارية، أن رسول الله قال: من باع نخلا قد أبرت فثمرها للبائع، إلا أن يشترطه المبتاع. {cite:muwatta-maruf-1997 p.272}"
  tr: "Malik şöyle dedi: Bir cariyenin meyvesi ile cariyenin çocuğu arasında fark vardır, çünkü Allah'ın Resulü şöyle buyurmuştur: \"Kim döllenmiş bir hurma satarsa, alıcı aksini şart koşmadıkça, meyvesi satıcıya aittir.\" {cite:muwatta-maruf-1997 s.272}"
  id: "Malik berkata: Ada perbedaan antara buah dan anak seorang budak perempuan, karena Rasulullah SAW bersabda: Barang siapa menjual pohon kurma yang telah diserbuki, buahnya menjadi milik penjual, kecuali jika pembeli menetapkan sebaliknya. {cite:muwatta-maruf-1997 p.272}"
