text: |-
  قوله من ديباج هو الاطلس كما
  فى وانقولى فالعطف بعده عام
  الجدومترجه فى فيه اه
  واعل أظه-روجها ولم يتعرّمس
  للمعارضة محشبه ولااحد
  المترجين قاله نصعر
  ٥٤٤٢١
  ⁦(باب الرام)⁩
  ⁦(وجر%)⁩
  واقد جنيتكا كؤا وعساقلا • ولقدنهيتك عن بنات الاوبر
  أى جنيت لك كما قال اللّٰه تعالى واذا كالوهم أو وزنوهم يخسرون ويقال وبرت الارنب
  توبيرا أى مشت فى المزونة قال أبوزيدانمايو برس الدواب الارنب وشئ آخر لم يحفظه
  أبو عبيد وقال أبو حاتم هو الوبرة لانها اذا طلبت نظرت الى موضع حزن فوئبت عليه لثلا
  يتبين أثرها فيه لسلابته ووبر الرجل أيضافى منزله اذا أقام حين الايبرح ⁦( ز)⁩ الوزر
  بالكسر الفرد والوتر بالفتح الذحل هذه لغة أهل العالية فأمالغة أهل الجازفبالضدمنهم وأما
  غيم فبالمكسر فيهما والوتر بالتحريك واحد أوتارالقوس والوترة العرق الذى فى بامان الكمرة
  وهو جايدة ووزة الانف حجاب مابين المنخرين وكذلت الوتبرة ووزة كل شئ خياره والوتيرة
  الطريقة بقال مازال على وتبرة واحدة والوتيرة أيضا الفترة يقال مافى عمله وتيرة وسيرايست
  فيه وتيرة أى قتور والوتيرة من الارض الطريقة قال الهذلى يصف ضيعا نبشت قبرا
  فذاحت بالوتاترثم بدت * يديها عند جابه تهيل
  وقال آبوعر والوتارما بين آصابع الضبع قوله ذاحت أى مشت والموتور الذى قتل له قتيل
  نلم يدرك بدمه تقول منه وتره يتره وتراوزة وكذلك وزه حقه أى نقص، وقوبه تعالى ولز
  يترحكم أعمالكم أى ان يتنقصكم فى أعمالكم كما تقول دخلت البيت وأنت تريد
  دخلت فى البيت والوتيرة حلقة من عقب يتعلم فيها الطعن وهى الدريثة أيضا وقال يصف فرسا
  تبارى قرحة مثل السوتيرة لم تكن مغدا وأوثره أى أفذه يقال أوترهلاته وأوترقوسه
  ووترهابعنى وفى المشل إنياض بغير توتير والمواترة المتابعة ولا تكون الموائرة بين الاشياء
  الااذا وقعت ينهما قتبرة والافهى مداركة ومواصلة وموائرة الصوم أن تصوم يوما وتفطر
  يوما أويومين وتأتى به وتراوترا ولا يراديه المواصلة لان أصله من الوتروكذلك واترت السكتب
  فتواترت أى جاءت بعضها فى إثر بعض وتراوترا من غير أن تنقطع وناقة متواترة نضع احدى
  ركبتيها أولا فى البرول ثم تضع الاخرى ولا تضعهمامعافيشق على الراكب وتترى فيهالغتان
  تنوّن ولا تنون مثل علقى فن ترك صرفها فى المعرفة جل ألفها ألف التأنيت وهو أجود
  وأصلها وترمن الوتروهو الفرد قال اللّٰه تعالى ثم أرسلنارسا: اتترى أى واحد ابعدواحد
  ومن تونها جع-ل ألفها محقة ( ŸÜثز⅜⅜% الوثير الفراش الوطءركذلك الوث بالكسريقال
  ما تحته وثر ووثار وامرأة وثيرة كشيرة اللحم ووثر الشى بالضم وثارة أى وطؤقال أبوزيد
  الوثارة كثرة الشحم والوناجة كثرة اللحم قال القطامى
  وكانا اشتمل الضجيع بريطة • لابل تزيد وثارة وليانا
  والوثر بالفتح ماء الفحل يجتمع فى رحم النساقة ثم لا تلقح يقال وثرها الفحل يثرها وثرا اذا أكثر
  ضرابها ولم تلقح واسوثرت من الشئء أى استكثرت منه مثل استونات واستويجت وميثرة
  النبرس لبدنه غسيرمه-موذوالجمع ميائروم واثر قال أبو عبيدوأما الميائر الحرالنى جاءفيها
  النهى فانها كانت من مراكب العجم من ديباح أو حير ⁦(وجر)⁩ الوجور الدواء يوجر فى وسط
  القم تقول منه وجرث الصى وأوجرته بعنى وأوجرته الرمح لاغيراذ اطعنته به فى صدره
  والميجر كالمسعط بوجربه الدواء واتجرأى تداوى بالوجور وأصله اوتجرووجرت منه بالكسم
  اى
