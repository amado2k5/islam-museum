label: { ar: "الموطأ 2112 — مالك عن أبي الزناد: كتب عمر بن عبد العزيز إلى عبد الحميد بن عبد الرحمن بن زيد بن الخطاب، وهو عامل على الكوفة، أن اقض باليمين مع الشاهد", en: "Muwatta 2112", es: "Muwatta 2112", fr: "Muwatta 2112", ur: "موطا 2112", tr: "El-Muvatta 2112 — Malik, Ebu el-Zinad'dan rivayetle: Ömer ibn Abdülaziz, Kufa valisi Abdülhamid ibn Abdülrahman ibn Zeyd ibn el-Hattab'a, yemin ve şahit esasına göre yönetmesi talimatını veren bir mektup yazdı.", id: "Al-Muwatta 2112 — Malik berdasarkan riwayat Abu al-Zinad: Umar ibn Abd al-Aziz menulis surat kepada Abd al-Hamid ibn Abd al-Rahman ibn Zayd ibn al-Khattab, yang merupakan gubernur Kufa, memerintahkannya untuk memerintah berdasarkan sumpah dan saksi." }
summary:
  ar: "يروي مالك عن أبي الزناد أن عمر بن عبد العزيز كتب إلى عبد الحميد بن عبد الرحمن بن زيد بن الخطاب، وهو عامل على الكوفة: أن اقض باليمين مع الشاهد. {cite:muwatta-maruf-1997 p.263}"
  tr: "Malik, Ebu el-Zinad'dan rivayetle, Ömer ibn Abdülaziz'in Kufa valisi Abdülhamid ibn Abdülrahman ibn Zeyd ibn el-Hattab'a şöyle yazdığını aktarır: \"Yemin ve şahit esasına göre hüküm ver.\" {cite:muwatta-maruf-1997 s.263}"
  id: "Malik meriwayatkan dari Abu al-Zinad bahwa Umar ibn Abd al-Aziz menulis kepada Abd al-Hamid ibn Abd al-Rahman ibn Zayd ibn al-Khattab, yang merupakan gubernur Kufa: \"Hakimilah berdasarkan sumpah dan saksi.\" {cite:muwatta-maruf-1997 p.263}"
