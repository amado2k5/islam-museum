text: |-
  • ⁦(ف صل الحاء)⁩,
  • ⁦( حق)⁩ .٥
  ٢٢
  فالعين بعدهم كأنّ حداقها * ممات بشوك فهى عود تدمسع
  والتحديق شدة النظر والحديقة الروضة ذات الشجر وقال تعالى وحدائن غليا ويقال
  الحديقة كل بستان عليه حائط وحدة وابالرجل وأحدة وابه أى أحاطوابه والحند قوق نيت
  وهو الذرق نبطىّ معزب ولا تقل الحندقوما والحدلقة بزيادة اللام مثل التحديو وقد حداق
  الرجل اذا أدار حدقته فى النظر والحدلقة مثال الهد بد الحدقة الكبيرة ويقال أكل الذقب
  من الشاة الحداقسة قال أبو عبيدهوشئ من بسدها ولا أدرى ماهو وقال أبو الحسن
  اللعياتى هو العين ⁦( حذق )⁩ حذق الصى" القرآن والعمل يحذق حدقا وحذ قارحذاقة
  وحذا ها اذا مهرفيه وحذق بالكسر حد فالغة فيه ويقال لليوم الذى يختم فيه الترآن هذا
  يوم حذاقه وفلان فى صنعه حادق باذق وه واتباع له وخذقت الحبل أحذه خذ قاقطعته
  والحاذق القاطع قال أبوذويب
  يرى ناصمافيما يدا فاذاخلا • فذلك سكين على الحلتى حاذق
  وحذق الخل يحذق حذوفا أى حض وحذق فاء الملّ حذما أى حزه والحذيق المقطوع
  ومنه قول الشاعر
  وحبل الوصل منتذث حذيق • قال والحذاقة الفصيح الدان البين اللهية
  قال طرفة
  اتى كفانى من أمرهممت به * جارك اوالهذاقى الذى اتصفا
  بعنى أبادواد الايادى الشاعر وكان أبو د واد جارر كعب بن مامة ويقال -ذاق الرجل بزيادة
  اللام وتحذاق اذا أظهرالحذق وإدعى أكثرء اعنده ⁦( رق)⁩ الحرق بالتحريك الناريقال
  فى حرق اللّٰه والحرق أيضا احتراق يصيب الثوب من الدق وقديكن وأحرقه بالنار وحزقه
  شدد للكثرة وكان عمروين هنديلة ب بالمحرّق لانه - رق مائة من بن تيم تسعة وتسعون من بن
  دارم وواحمدم ن البراجم ومحزق أيضالقب الحر بن عمرو. لك الشأممن آل جفنة وانما
  -عى بذلك لانه أول م-ن حرّق العرب فى ديارهم فهسم يدءون آل محرق وأماقول أسود
  ابن يعفر
  ماذا أومل بعد آل محرّق • تركوامنازلهم وبعداياد
  فاناعى بدامرأ القيس بن عمروين عدى اللخمى لانه أيضايدعى محزفا وتحترق الشى بالنار
  واحسترق والاسم الحرقة والمريق وحرقت الشئ حرقابردته وحككت بعضه يعض ومنه
  قولهم حرق نابه يحرقه ويحرة. أى سحقه حتى سمع له صريف وفلان يحرق عليك الارم غيظا
  قال الشاعر
  نبئت أحمامسلمى انما • بانواغضا با يحرقون الارما
  وقرأ على عليه السلام انحرقنه أى لنبردنه وحرق شعره بالكسر أى تقطع ونسل فه وحرق
  الشعر والجناح ومنه قول أبى كبير
  ذهبت بشاشته فاصبح واضحا • حرق المفارق كالبراه الاعضر
