text: "… بنهم أي أفد. قوله لليف ملم به لم، ويقال طائف وهو واحد قال أبو عبيدة فى قوله اذا مسهم طائف ى لمم انتهى. واللهم يطلق على ضرب من الجنون وعلى صناد الذنوب، واختلف القراء فنهم من قرأ طاأفه رمنهم من …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 301، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 3, p. 301, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 3، ص 301 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
