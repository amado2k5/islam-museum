text: "… ذُو الْعَيْنَيْنِ فَنَمَّاهَا إِلَىٰ عُمَرَ، فَوَاللَّهِ مَا شَعُرْتُ إِلَّا وَهُوَ مُقْبِلٌ عَلَىٰ صَاحِبِي بِالدِّرَّةِ صُفُوقًا، ثُمَّ قَالَ : قَاتَلَكَ اللَّهُ أَتَعَدَّىٰ الْفُتْيَا، وَتَقْتُلُ الْحَرَامَ؟ قَالَ : ثُمَّ أَقْبَلَ إِلَيَّ، فَقُلْتُ : يَا أَمِيرَ الْمُؤْمِنِينَ، لَا أُحِلُّ لَكَ شَيْئًا حَرَّمَهُ اللَّهُ …"
