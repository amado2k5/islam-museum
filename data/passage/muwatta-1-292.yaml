label: { ar: "الموطأ 292 — بلاغ: ما على أحدكم لو اتخذ ثوبين لجمعته سوى ثوبي مهنته", en: "Muwatta 292" }
summary:
  ar: "أول حديث في باب الهيئة وتخطي الرقاب واستقبال الإمام يوم الجمعة. يرويه يحيى عن مالك عن يحيى بن سعيد بلاغاً: قال النبي ما على أحدكم لو اتخذ ثوبين لجمعته سوى ثوبي مهنته، أي ثوبي عمله. وينقل المحقق عن ابن عبد البر أن الحديث يتصل من وجوه حسان من حديث عائشة وغيرها، وأن ابن حجر تعقبه في فتح الباري بأن في إسناده عن عمرة عن عائشة نظراً، فقد روي مرسلاً عن يحيى بن حبان، ووصله أبو داود (1078) وابن ماجه (1095) من وجه آخر عن عبد الله بن سلام؛ ويرى المحقق أن هذه الطرق كلها ضعيفة كما بينه في تعليقه على ابن ماجه، فالحديث مضطرب عنده. {cite:muwatta-maruf-1997 p.166} {cite:muwatta-maruf-1997 p.167}"
