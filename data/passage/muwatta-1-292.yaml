label: { ar: "الموطأ 292 — بلاغ: ما على أحدكم لو اتخذ ثوبين لجمعته سوى ثوبي مهنته", en: "Muwatta 292", es: "Muwatta 292", fr: "Muwatta 292", ur: "موطا 292", tr: "Al-Muwatta 292 — Rivayet: İşinizde giydiğiniz iki elbisenin yanı sıra, Cuma namazı için iki elbise daha giymenizde ne sakınca var?", id: "Al-Muwatta 292 — Laporan: Apa salahnya jika salah seorang dari kalian memiliki dua pakaian untuk salat Jumat selain dua pakaian yang kalian kenakan untuk bekerja?" }
summary:
  ar: "أول حديث في باب الهيئة وتخطي الرقاب واستقبال الإمام يوم الجمعة. يرويه يحيى عن مالك عن يحيى بن سعيد بلاغاً: قال النبي ما على أحدكم لو اتخذ ثوبين لجمعته سوى ثوبي مهنته، أي ثوبي عمله. وينقل المحقق عن ابن عبد البر أن الحديث يتصل من وجوه حسان من حديث عائشة وغيرها، وأن ابن حجر تعقبه في فتح الباري بأن في إسناده عن عمرة عن عائشة نظراً، فقد روي مرسلاً عن يحيى بن حبان، ووصله أبو داود (1078) وابن ماجه (1095) من وجه آخر عن عبد الله بن سلام؛ ويرى المحقق أن هذه الطرق كلها ضعيفة كما بينه في تعليقه على ابن ماجه، فالحديث مضطرب عنده. {cite:muwatta-maruf-1997 p.166} {cite:muwatta-maruf-1997 p.167}"
  tr: "Cuma namazında duruş, insanların boyunlarına basmak ve imama doğru dönmek konusuyla ilgili ilk hadis, Yahya'nın Malik'ten, o da Yahya ibn Sa'id'den rivayet ettiği bir hadistir: Peygamberimiz şöyle buyurmuştur: \"İş için giydiğiniz iki elbisenin dışında, Cuma namazı için iki elbise giymenize ne engel olur?\" Editör, İbn Abdül-Barr'ın hadisin Aişe ve diğerlerinden birçok sahih rivayet zinciriyle nakledildiğini söylediğini aktarmıştır. Ancak İbn Hacer, Fethü'l-Bari'de bu konuda şöyle yorum yapmıştır: Aişe'den Amre'den gelen rivayet zincirinde bir sorun vardır, çünkü bu hadis Yahya ibn Hibban'dan mursal bir hadis olarak rivayet edilmiş ve Ebu Davud (1078) ve İbn Majah (1095) tarafından Abdullah ibn Salam'dan başka bir rivayet zinciriyle nakledilmiştir. Editör, İbn Majah hakkındaki tefsirinde açıkladığı gibi, bu rivayet zincirlerinin hepsini zayıf olarak değerlendiriyor ve bu nedenle hadis güvenilmez kabul ediliyor."
  id: "Hadits pertama tentang postur tubuh, melangkahi leher orang, dan menghadap imam pada hari Jumat. Diriwayatkan oleh Yahya dari Malik dari Yahya ibn Sa'id, sebagai sebuah laporan: Nabi bersabda, \"Apa yang menghalangi kalian untuk mengenakan dua pakaian untuk shalat Jumat selain dua pakaian yang kalian kenakan untuk bekerja?\" Editor mengutip Ibn 'Abd al-Barr yang mengatakan bahwa hadits ini terhubung melalui beberapa sanad yang baik dari Aisyah dan lainnya. Namun, Ibn Hajar mengomentari hal ini dalam Fath al-Bari, menyatakan bahwa ada masalah dengan sanadnya dari Amrah dari Aisyah, karena diriwayatkan sebagai hadits mursal dari Yahya ibn Hibban, dan dihubungkan oleh Abu Dawud (1078) dan Ibn Majah (1095) melalui sanad lain dari Abdullah ibn Salam. Penyunting menganggap semua rantai periwayatan ini lemah, sebagaimana dijelaskannya dalam komentarnya tentang Ibnu Majah, sehingga hadits tersebut dianggap tidak dapat diandalkan."
