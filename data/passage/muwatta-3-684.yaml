label: { ar: "الموطأ 684 — مالك: لا تجب على وارث في مال ورثه الزكاة حتى يحول عليه الحول", en: "Muwatta 684", es: "Muwatta 684", fr: "Muwatta 684", ur: "موطا 684", tr: "Al-Muwatta 684 — Malik: Bir mirasçının miras yoluyla edindiği malın zekâtı, bir yıl geçmeden farz değildir.", id: "Al-Muwatta 684 — Malik: Zakat tidak diwajibkan atas harta warisan seorang ahli waris sampai setahun berlalu." }
summary:
  ar: "قول لمالك: السنة عندنا أنه لا تجب على وارث في مال ورثه الزكاة حتى يحول عليه الحول. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.343}"
  tr: "Malik şöyle demiştir: Bizim mezhebimize göre, mirasçı, miras yoluyla edindiği malın zekâtını bir yıl geçmeden ödemekle yükümlü değildir. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.343}"
  id: "Malik berkata: Menurut mazhab kami, ahli waris tidak wajib membayar zakat atas harta warisan sampai setahun berlalu. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.343}"
