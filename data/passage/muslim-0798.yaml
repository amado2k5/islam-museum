label: { ar: "مسلم 798 — الماهر بالقرآن مع السفرة الكرام البررة", en: "Muslim 798 — The skilled reciter is with the noble obedient envoys", es: "Muslim 798 — El recitador experto está con los nobles y obedientes enviados.", fr: "Muslim 798 — Le récitateur habile est avec les nobles envoyés obéissants", ur: "مسلم 798 - ہنر مند قاری اعلیٰ فرمانبردار قاصدوں کے ساتھ ہوتا ہے۔", tr: "Müslim 798 — Kur'an konusunda bilgili olan, soylu ve salih kâtiplerle birlikte olan kişi.", id: "Muslim 798 — Orang yang mahir dalam Al-Quran di antara para ahli Taurat yang mulia dan saleh" }
text: "قال رسول الله: «الماهر بالقرآن مع السفرة الكرام البررة، والذي يقرأ القرآن ويتتعتع فيه وهو عليه شاق له أجران»"
summary:
  ar: "رواية عائشة عن سعد بن هشام في باب فضل الماهر بالقرآن والذي يتتعتع فيه من كتاب صلاة المسافرين في صحيح مسلم؛ يرتب الماهر في رفقة الملائكة ويضاعف أجر من يجهد نفسه في التلاوة."
  tr: "Aişe'nin Sa'd ibn Hişam'dan rivayet ettiğine göre, Sahih Müslim'deki yolculuk duaları kitabında Kur'an'ı iyi okuyan ve okurken kekeleyen kimsenin fazileti bölümünde şöyle buyurulmuştur: İyi okuyan meleklerin huzuruna yerleştirilir ve okumada gayret gösterenin sevabı kat kat artırılır."
  id: "Riwayat Aisyah berdasarkan Sa'd ibn Hisham dalam surah tentang keutamaan orang yang mahir membaca Al-Qur'an dan orang yang gagap dalam membacanya, dari kitab doa musafir dalam Sahih Muslim; orang yang mahir akan ditempatkan bersama para malaikat dan pahala orang yang berusaha keras dalam membaca Al-Qur'an akan dilipatgandakan."
