label: { ar: "مسلم 798 — الماهر بالقرآن مع السفرة الكرام البررة", en: "Muslim 798 — The skilled reciter is with the noble obedient envoys" }
text: "قال رسول الله: «الماهر بالقرآن مع السفرة الكرام البررة، والذي يقرأ القرآن ويتتعتع فيه وهو عليه شاق له أجران»"
summary:
  ar: "رواية عائشة عن سعد بن هشام في باب فضل الماهر بالقرآن والذي يتتعتع فيه من كتاب صلاة المسافرين في صحيح مسلم؛ يرتب الماهر في رفقة الملائكة ويضاعف أجر من يجهد نفسه في التلاوة."
