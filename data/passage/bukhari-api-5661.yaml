label: { ar: "صحيح البخاري 5661 — المرض والمريض، الحمى والوعك", en: "Sahih al-Bukhari 5661 — illness and the sick; fever", ur: "صحیح بخاری 5661 — بیماری اور بیمار، بخار", es: "Sahih al-Bukhari 5661 — La enfermedad y los enfermos; fiebre", fr: "Sahih al-Bukhari 5661 — maladie et malades; fièvre", tr: "Sahih el-Buhari 5661 — Hastalık ve hasta, ateş ve halsizlik", id: "Sahih al-Bukhari 5661 — Penyakit dan orang sakit, demam dan rasa tidak enak badan" }
text: "حَدَّثَنَا قَبِيصَةُ، حَدَّثَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ التَّيْمِيِّ، عَنِ الْحَارِثِ بْنِ سُوَيْدٍ، عَنْ عَبْدِ اللَّهِ ـ قَالَ أَتَيْتُ النَّبِيَّ فِي مَرَضِهِ فَمَسِسْتُهُ وَهْوَ يُوعَكُ وَعْكًا شَدِيدًا فَقُلْتُ إِنَّكَ لَتُوعَكُ وَعْكًا شَدِيدًا، وَذَلِكَ أَنَّ لَكَ أَجْرَيْنِ. قَالَ \" أَجَلْ، وَمَا مِنْ مُسْلِمٍ يُصِيبُهُ أَذًى إِلاَّ حَاتَّتْ عَنْهُ خَطَايَاهُ كَمَا تَحَاتُّ وَرَقُ الشَّجَرِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5661، يذكر المرض والمريض، والحمى والوعك. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5661 (Patients), that mentions illness and the sick, fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5661، جس میں بیماری اور بیمار، بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5661 (Pacientes), menciona la enfermedad y a los enfermos, así como la fiebre. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5661 (Patients), mentionne la maladie, les malades et la fièvre. Le navigateur de textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5661 numaralı hadis, hastalık, hasta kişi, ateş ve halsizlikten bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5661, menyebutkan penyakit, orang sakit, demam, dan rasa tidak enak badan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
