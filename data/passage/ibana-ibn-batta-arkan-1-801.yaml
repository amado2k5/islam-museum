text: "أصبته، قال: يا رسول اللّٰه علمني ما الإيمان؟ قال: تشهد أن لا إله إلا اللّٰه وأن محمداً رسول اللّٰه وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت. قال: قد أنذرت. - حدثنا إسحاق الكاذي، قال: حدثنا عبدالله بن أحمد، قال: …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 801، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 801, that mentions the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 801 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
