label: { ar: "الموطأ 480 — أول ما يُنظر فيه من عمل العبد الصلاة", en: "Muwatta 480" }
summary:
  ar: "بلاغ يرويه مالك عن يحيى بن سعيد أنه بلغه أن أول ما يُنظر فيه من عمل العبد الصلاة، فإن قُبلت نُظر فيما بقي من عمله، وإن لم تُقبل لم يُنظر في شيء من عمله؛ وهو في باب جامع الصلاة. وينقل المحقق عن ابن عبد البر أن مثله لا يكون رأياً وإنما هو توقيف، وأنه روي مسنداً من وجوه صحاح من حديث تميم الداري وأبي هريرة (التمهيد 24/79–80)؛ ويرى المحقق أن حديث تميم عند أحمد والدارمي وأبي داود (866) وابن ماجه (1426) والحاكم إسناده صحيح، وأن حديث أبي هريرة، وإن حسّنه الترمذي (413)، ضعيف مضطرب كما بيّن الدارقطني في العلل، وينقل قول المزي في تهذيب الكمال إنه حديث مضطرب. {cite:muwatta-maruf-1997 p.246} {cite:muwatta-maruf-1997 p.247}"
