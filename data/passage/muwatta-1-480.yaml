label: { ar: "الموطأ 480 — أول ما يُنظر فيه من عمل العبد الصلاة", en: "Muwatta 480", es: "Muwatta 480", fr: "Muwatta 480", ur: "موطا 480", tr: "Al-Muwatta 480 — Bir kulun işinde dikkate alması gereken ilk şey namazdır.", id: "Al-Muwatta 480 — Hal pertama yang harus dipertimbangkan dalam pekerjaan seorang hamba adalah salat." }
summary:
  ar: "بلاغ يرويه مالك عن يحيى بن سعيد أنه بلغه أن أول ما يُنظر فيه من عمل العبد الصلاة، فإن قُبلت نُظر فيما بقي من عمله، وإن لم تُقبل لم يُنظر في شيء من عمله؛ وهو في باب جامع الصلاة. وينقل المحقق عن ابن عبد البر أن مثله لا يكون رأياً وإنما هو توقيف، وأنه روي مسنداً من وجوه صحاح من حديث تميم الداري وأبي هريرة ⁦(التمهيد 24/79–80)⁩؛ ويرى المحقق أن حديث تميم عند أحمد والدارمي وأبي داود (866) وابن ماجه (1426) والحاكم إسناده صحيح، وأن حديث أبي هريرة، وإن حسّنه الترمذي (413)، ضعيف مضطرب كما بيّن الدارقطني في العلل، وينقل قول المزي في تهذيب الكمال إنه حديث مضطرب. {cite:muwatta-maruf-1997 p.246} {cite:muwatta-maruf-1997 p.247}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği bir hadiste, bir kulun öncelikle namazı üzerinden yargılanacağı, namazının kabul edilmesi halinde diğer amellerinin de değerlendirileceği, namazının kabul edilmemesi halinde ise hiçbir amelinin değerlendirilmeyeceği belirtilmiştir. Bu hadis, namazla ilgili kapsamlı hükümler bölümünde yer almaktadır. Editör, İbn Abdülberr'in bu ifadenin görüş meselesi değil, ilahi bir hüküm olduğunu ve Tamim el-Dari ve Ebu Hurayra'dan (el-Tamhid 24/79-80) sahih rivayet zincirleriyle nakledildiğini söylediğini aktarmaktadır. Editör, Ahmed, el-Darimi, Ebu Davud (866), İbn Majah (1426) ve el-Hakim'de bulunan Tamim hadisinin sağlam bir rivayet zincirine sahip olduğuna inanmaktadır. Ayrıca, Tirmizi (413) tarafından makbul sayılan Ebu Hurayra hadisinin, Daraktü'nün İlal'de açıkladığı gibi zayıf ve güvenilmez olduğuna inanmaktadır. Tahdhib el-Kamal'da Mizzi'nin bu hadisin güvenilmez olduğunu söylediğini aktarmaktadır. {cite:muwatta-maruf-1997 s.246} {cite:muwatta-maruf-1997 s.247}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Yahya ibn Sa'id menyatakan bahwa ia mendengar bahwa hal pertama yang akan dinilai dari seorang hamba adalah salat. Jika diterima, maka amal perbuatannya yang lain akan dipertimbangkan. Jika tidak diterima, maka tidak ada amal perbuatannya yang akan dipertimbangkan. Hal ini terdapat dalam bab tentang hukum-hukum komprehensif mengenai salat. Editor mengutip Ibn 'Abd al-Barr yang mengatakan bahwa pernyataan tersebut bukanlah masalah pendapat tetapi merupakan hukum yang diwahyukan secara ilahi, dan bahwa hal itu diriwayatkan dengan sanad yang sahih dari Tamim al-Dari dan Abu Hurayrah (al-Tamhid 24/79-80). Editor meyakini bahwa hadits Tamim, sebagaimana terdapat dalam Ahmad, al-Darimi, Abu Dawud (866), Ibn Majah (1426), dan al-Hakim, memiliki sanad yang sahih. Ia juga meyakini bahwa hadits Abu Hurayrah, meskipun dianggap dapat diterima oleh al-Tirmidhi (413), lemah dan tidak dapat diandalkan, sebagaimana dijelaskan oleh al-Daraqutni dalam al-'Ilal. Ia mengutip al-Mizzi dalam Tahdhib al-Kamal yang mengatakan bahwa itu adalah hadits yang tidak dapat diandalkan. {cite:muwatta-maruf-1997 p.246} {cite:muwatta-maruf-1997 p.247}"
