  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 4, page 561, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Seyyid Sabiq'in *Fıkıh el-Sünne* adlı eserinin 4. cildinin 561. sayfasında, vasiyet veya son ahit, defin, mezar ve türbe konularından bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Vasiyetler, Miras, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
