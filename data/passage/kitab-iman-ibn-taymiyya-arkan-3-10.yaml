text: "… الصحيحة بأنه جعل الأعمال الظاهرة من الإيمان، كقوله: الإيمان بضع وسبعون شعبة، أعلاها قول لا إله إلا اللّه، وأدناها إماطة الأذى عن الطريق، وقوله لوفد عبد القيس: آمركم بالإيمان بالله وحده، أتدرون ما الإيمان بالله وحده؟ شهادة أن لا إله …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 3، ص 10، يذكر السؤال عن الإيمان وجوابه، والإيمان بضع وسبعون شعبة، وما عُدّ من الإيمان، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 3, p. 10, that mentions the question about faith and its answer, faith as seventy-odd branches, what is counted as part of faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 3، ص 10 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی ستر سے کچھ اوپر شاخیں، جو ایمان میں سے گنا گیا، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Iman de Ibn Taymiyya, volumen 3, pág. 10, que menciona la cuestión de la fe y su respuesta, la fe como setenta y tantos brazos, qué se considera parte de la fe, uno de los artículos de fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Iman d'Ibn Taymiyya (tome 3, p. 10) abordant la question de la foi et sa réponse, la foi comme une soixantaine de branches, ce qui en fait partie, et l'un des articles de foi. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 3. cildinin 10. sayfasından bir alıntı, iman, imanın yetmişten fazla dalı, imanın ne olduğu ve imanın rükünlerinden biri hakkındaki soru ve cevabı ele almaktadır. Bu alıntı, makine tarafından okunabilir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlıdır. İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 3, halaman 10, membahas pertanyaan dan jawaban mengenai iman, tujuh puluh lebih cabang iman, apa yang membentuk iman, dan salah satu rukun iman. Kutipan ini diambil dari edisi yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang iman, dan karakteristik seorang mukmin."
