text: |-
  ٤١٩
  •مرن).
  بضنه به روقها وتنسين القوس بالعقب والسقاء بالرب شذه واصلاحه بذاك تن
  المناتة موضع البول ومثنته أمثنه بالضم مثنافهو عنون اذا أصبت مثانته ويقال معز
  الرجل بالكسر فهو ا مثن ببن المثن اذا كان لا يستمسك بوله والمرأة مثناء قال الكاق يقال
  رجل مئن وممنون للذى يشتكى مثانته وفى حسديث عمار أنه صلى فى تبان وقال انى عمثون
  ⁦(مجن)⁩ الجون أن لا يسالى الانسان ماصنع وقد مجن بالقنح يمجن مجونا ومجانة فهوماجن
  والجم المجان وقواهم أخذه مجمانا أى بلابدل وهو فعال لانه يتصرف والمماجن من النوق
  التى ينزوطيه اغير واحد من الفحولة فلاتكاد تلقح وطريق مجن آى ٢دود مجن
  المجذون الدولاب التى يستق عليها قال ابن السكيت هى الممالة التى بسنى عليها وهى مؤثنة
  على فعللول والميم من نفس الحرف كما قلناه فى منجنيق لانه يجمع على مذا جين وأنشد
  الاصمعى • ومتجنون كالاتان القارق • ويروى ومنجنين وهمابعق ⁦(من)⁩
  محنت البتر محنا اذا أخرجت ترابهاوطينها والمحنة واحدة الهن التى يمتهن بها الاذسان
  من بلية ومحنته وامتحنته أى اختبرته والاسم المحنة ومحنه عشرين سوطا أى ضربه وأتيت
  فلانا نا محنض شيأأى ما أعطانى ⁦(فحن)⁩ الخن الرجل الطويل والخن البكاء والخن
  التزع من البئر قال الراجز:
  قد حكم القاضى بأمر عدل • أن يمخنوها بتمانى أدل
  دن مدن بالمسكان أقاميه ومنه مهيت المدينة وهى فعيلة وتجمع على مداثن بالهمز
  وتجمع أيضاعلى مدن ومدن بالتنفيف والتنقي-ل وفيه قول آخرانها مفعلة من دنت أى
  ملكت وفلان مذن المدائن كما بقال مصر الامصار وسأات أبا على الفسوى عن همزمدائن
  فقال فيه قولان من جعلد فعيلة من قولك مدن باا-كان أى أقام به همزه ومن جعله مفعلة من
  قولاك دين أى. لك لم يهمزه كما لا يم مزمعايس واذا نسبت الى مدينة الرسول صلى اللّٰه علي
  وسلم قلت حدنى والى مدينة المنصور مدينّ والى مداثن كسرى مدائنى للفرق بين القسب ائلا
  يختلط ومدين قرية شعيب عليه السلام {مرن) هرن الشئيمون مرونا اذا لان مثل
  جرن ومرن على الشى يمرن هر ونا ومرانه تعوده واستز عليه يقال مرنت يده على العمل!
  اذاصلبت قال الراجز
  قد أ كنيتيد البعداللين • وبعدد هن البان والمضنون • وهمتا بالصبر والمرون
  ومرن وجه فلان على هذا الامر وانه لممرّن الوجه أى صاب الوجه قال روية
  زاؤخصم معل ممزن • والمون بكسرالراه الحال والخلق يقال مازال ذلات مرنى أى حالى
  ويقال القوم هم على مرن واحدوذاد اذا لستوت أخلاقهم والمرن ساكن الفراءفى قول
  الخر • كأن جلودهنّ ثياب مرن • وامران الذراع عصب يكون فيها ومرن بعبره يرنه
  مرنااذادهن أسفل قواعه من حقى به والمرانة اللين ومرانة موضع قال ابيد
  لمن طلسل تضمف← انال • قسرحة فالمرانة قانلحيان
  ومر انة اسم ناقة ابن مقبل قال
  يادارسلى خلاملا أ كلفها • الاالمراتة حتى تعرف الدنا
  وينال
