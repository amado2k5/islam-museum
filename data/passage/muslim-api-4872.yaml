label: { ar: "صحيح مسلم 4872 — أثر من الآثار المحفوظة", en: "Sahih Muslim 4872 — a relic kept after its owner", ur: "صحیح مسلم 4872 — محفوظ آثار و تبرکات" }
text: "وَحَدَّثَنِيهِ عَبْدُ اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ الدَّارِمِيُّ، حَدَّثَنَا يَحْيَى بْنُ حَسَّانَ، حَدَّثَنَا مُعَاوِيَةُ، أَخْبَرَنِي زَيْدٌ، أَنَّهُ سَمِعَ أَبَا سَلاَّمٍ، قَالَ حَدَّثَنِي النُّعْمَانُ بْنُ بَشِيرٍ، قَالَ كُنْتُ عِنْدَ مِنْبَرِ رَسُولِ اللَّهِ. بِمِثْلِ حَدِيثِ أَبِي تَوْبَةَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4872، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4872 (The Book on Government), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 4872، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
