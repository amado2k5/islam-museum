label: { ar: "سنن النسائي 4954 — اليتيم وفقد الأب", en: "Sunan al-Nasa'i 4954 — the orphan and the father lost", ur: "سنن نسائی 4954 — یتیم اور باپ کی موت", es: "Sunan al-Nasa'i 4954 — El huérfano y el padre perdido", fr: "Sunan al-Nasa'i 4954 — L'orphelin et le père perdus", tr: "Sunan an-Nasa'i 4954 — Yetim ve Babasının Kaybı", id: "Sunan an-Nasa'i 4954 — Anak Yatim dan Kehilangan Ayah" }
text: "… الزُّبَيْرِ - وَقَالَ خَالِدٌ فِي حَدِيثِهِ مَوْلَى الزُّبَيْرِ - عَنْ تُبَيْعٍ عَنْ كَعْبٍ قَالَ مَنْ تَوَضَّأَ فَأَحْسَنَ الْوُضُوءَ ثُمَّ صَلَّى - وَقَالَ عَبْدُ الرَّحْمَنِ فَصَلَّى الْعِشَاءَ الآخِرَةَ - ثُمَّ صَلَّى بَعْدَهَا أَرْبَعَ رَكَعَاتٍ فَأَتَمَّ - وَقَالَ سَوَّارٌ يُتِمُّ - رُكُوعَهُنَّ وَسُجُودَهُنَّ وَيَعْلَمُ مَا يَقْتَرِئُ - وَقَالَ سَوَّارٌ يَقْرَأُ - فِيهِنَّ كُنَّ لَهُ بِمَنْزِلَةِ لَيْلَةِ الْقَدْرِ."
summary:
  ar: "حديث في سنن النسائي، رقم 4954، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4954 (The Book of Cutting off the Hand of the Thief), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4954، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4954 (El Libro de la Perdición del Ladrón), menciona al huérfano y al padre desaparecido. El navegador \"La Paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4954 (Le Livre de la Main Coupée du Voleur), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 4954 numaralı hadis, yetimlerden ve babasızlık durumundan bahsetmektedir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberimizin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4954, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
