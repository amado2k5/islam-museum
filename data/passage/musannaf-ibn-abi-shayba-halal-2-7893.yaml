text: "… حوت حرمه اللّٰه عليهم في يوم وأحله لهم في سوى ذلك، فكان يأتيهم في اليوم الذي حرم عليهم كأنه المخاض، ما يمتنع من أحد، فجعلوا يهمون ويمسكون حتى أخذوه فأكلوا - والله - بها أوخم أكلة أكلها قوم لوط أبقى …"
