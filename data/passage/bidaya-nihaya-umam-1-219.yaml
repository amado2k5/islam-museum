text: "… راجعون. وكذلك في المساجد والجوامع والربط، ولم ينج منهم أحد سوى أهل الذمة من اليهود والنصارى ومن التجا إليهم وإلى دار الوزير ابن العلقمي الرافضي وطائفة من التجار أخذوا لهم أماناً، بذلوا عليه أموالاً جزيلة حتى سلموا وسلمت أموالهم. وعادت …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 1، ص 219، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 1, p. 219, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 1، ص 219 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
