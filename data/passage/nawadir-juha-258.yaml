text: "… إذا كان فيك عقلٌ أسرِع للبحيرة حمَّل حماره، ذات يوم، هشيماً وقال في نفسه لأنظر هل يلتهبُ، وأخذ ناراً فقرَّبها إليه، وكان الهواء شديداً، فعلقت النارُ به، واندلع لسان اللهب. فكان الحمار المسكين يقوم، ويقعد، وينهق، ويلبط لشدَّةِ الحرارة، فلما …"
summary:
  ar: "أحرق جحا حطباً على الحمار ليجرب هل يحترق، فنشرت الريح النار، وفر الحمار، فصاح جحا بأنه إن كان فيه عقل فليسرع إلى البحيرة. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  en: "Juha burns brushwood on the donkey to test whether it burns, and the wind spreads the fire. The donkey bolts, and Juha shouts that if the donkey has sense it should run to the lake. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  ur: "جحا یہ آزمانے کے لیے کہ گدھا جلتا ہے یا نہیں اس پر جھاڑیاں جلاتا ہے تو ہوا آگ پھیلا دیتی ہے۔ گدھا بھاگ نکلتا ہے اور جحا چلا کر کہتا ہے کہ اگر گدھے میں عقل ہے تو جھیل کی طرف دوڑے۔ {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  fr: "Juha brûle des broussailles sur l'âne pour voir s'il brûle, et le vent propage le feu. L'âne s'enfuit, et Juha crie que, s'il a du bon sens, il devrait courir au lac. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
  es: "Juha quema matorral sobre el burro para probar si arde, y el viento extiende el fuego. El burro sale disparado, y Juha grita que, si tiene juicio, debería correr al lago. {cite:juha-nawadir-kubra-djuwaydi p. 126}"
