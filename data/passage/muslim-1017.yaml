label: { ar: "مسلم 1017 — من سن في الإسلام سنة حسنة", en: "Muslim 1017 — Whoever sets a good precedent in Islam" }
text: "قال رسول الله حين جاءه المضريون حفاة عراة فنادى بالصدقة حتى رأى كومين من طعام وثياب: من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده من غير أن ينقص من أجورهم شيء، ومن سن في الإسلام سنة سيئة كان عليه وزرها ووزر من عمل بها من بعده"
summary:
  ar: "رواية جرير بن عبد الله البجلي في باب الحث على الصدقة وأجر من سن فيها سنة من كتاب الزكاة في صحيح مسلم؛ سياقها خطبة النبي حين جاءه قوم من مضر حفاة فتتابع الناس بالصدقة."
