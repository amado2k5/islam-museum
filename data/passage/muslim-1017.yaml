label: { ar: "مسلم 1017 — من سن في الإسلام سنة حسنة", en: "Muslim 1017 — Whoever sets a good precedent in Islam", es: "Musulmán 1017 — Quien sienta un buen precedente en el Islam", fr: "Muslim 1017 — Quiconque donne un bon exemple en Islam", ur: "مسلم 1017 - جو بھی اسلام میں اچھی مثال قائم کرتا ہے۔", tr: "Müslim 1017 — İslam'da güzel bir uygulamayı başlatan kimse", id: "Muslim 1017 — Siapa pun yang menegakkan amalan baik dalam Islam" }
text: "قال رسول الله حين جاءه المضريون حفاة عراة فنادى بالصدقة حتى رأى كومين من طعام وثياب: من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده من غير أن ينقص من أجورهم شيء، ومن سن في الإسلام سنة سيئة كان عليه وزرها ووزر من عمل بها من بعده"
summary:
  ar: "رواية جرير بن عبد الله البجلي في باب الحث على الصدقة وأجر من سن فيها سنة من كتاب الزكاة في صحيح مسلم؛ سياقها خطبة النبي حين جاءه قوم من مضر حفاة فتتابع الناس بالصدقة."
  tr: "Sahih Müslim'deki Zekat Kitabı'nın, sadaka vermeye teşvik ve sadakayı düzenli olarak uygulayanların sevabı bölümünde Cerir bin Abdullah el-Bajali'nin rivayeti; bağlamı, Mudar'dan bir grup insanın yalınayak Peygamberimize gelmesi ve halkın da onlara sadaka vermesi üzerine Peygamberimizin hutbesidir."
  id: "Riwayat Jarir bin Abdullah Al-Bajali dalam bab tentang anjuran sedekah dan pahala bagi siapa pun yang mendirikan amalan tersebut dari Kitab Zakat dalam Sahih Muslim; konteksnya adalah khutbah Nabi ketika sekelompok orang dari Mudar datang kepadanya tanpa alas kaki, dan orang-orang pun mengikuti jejak mereka dengan memberikan sedekah."
