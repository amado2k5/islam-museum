label: { ar: "سنن أبي داود 4014 — الأب والأبوة", en: "Sunan Abi Dawud 4014 — the father and fatherhood", ur: "سنن ابی داؤد 4014 — باپ اور والدیت", es: "Sunan Abi Dawud 4014 — El padre y la paternidad", fr: "Sunan Abi Dawud 4014 — le père et la paternité" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ أَبِي النَّضْرِ، عَنْ زُرْعَةَ بْنِ عَبْدِ الرَّحْمَنِ بْنِ جَرْهَدٍ، عَنْ أَبِيهِ، - قَالَ كَانَ جَرْهَدٌ هَذَا مِنْ أَصْحَابِ الصُّفَّةِ - قَالَ جَلَسَ رَسُولُ اللَّهِ عِنْدَنَا وَفَخِذِي مُنْكَشِفَةٌ فَقَالَ \" أَمَا عَلِمْتَ أَنَّ الْفَخِذَ عَوْرَةٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4014، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4014 (Hot Baths (Kitab Al-Hammam)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4014، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4014 (Baños Calientes (Kitab Al-Hammam)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4014 (Bains chauds (Kitab Al-Hammam)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
