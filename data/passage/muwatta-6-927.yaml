label: { ar: "الموطأ 927 — ابن عمر عن النبي: يهل أهل المدينة من ذي الحليفة، وأهل الشام من الجحفة، وأهل نجد من قرن، وبلغه أن أهل اليمن من يلملم", en: "Muwatta 927", es: "Muwatta 927", fr: "Muwatta 927", ur: "موطا 927", tr: "El-Muvatta 927 — İbn Ömer, Peygamber'den rivayetle: Medine halkı Zül-Huleyfe'den, Suriye halkı Cühfe'den, Necd halkı ise Karn'dan ihrama girer. Yemen halkının ise Yalamlam'dan ihrama girdiği rivayet edilmiştir.", id: "Al-Muwatta 927 — Ibnu Umar berdasarkan riwayat Nabi: Penduduk Madinah memasuki ihram dari Dzul-Hulayfah, penduduk Suriah dari Al-Juhfah, dan penduduk Najd dari Qarn. Dan sampai kepadanya bahwa penduduk Yaman memasuki ihram dari Yalamlam." }
text: "يهل أهل المدينة من ذي الحليفة، ويهل أهل الشام من الجحفة، ويهل أهل نجد من قرن"
summary:
  ar: "أول حديث في باب مواقيت الإهلال. يرويه مالك عن نافع عن عبد الله بن عمر، أن رسول الله قال: يهل أهل المدينة من ذي الحليفة، ويهل أهل الشام من الجحفة، ويهل أهل نجد من قرن. قال ابن عمر: وبلغني أن رسول الله قال: ويهل أهل اليمن من يلملم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1060)، وأن ابن عبد البر ⁦(التمهيد 15/137)⁩ قال إن ابن عمر لم يسمع من النبي قوله في يلملم، وإن مرسل الصحابي عن الصحابي حجة. {cite:muwatta-maruf-1997 p.444} {cite:muwatta-maruf-1997 p.445}"
  id: "Hadits pertama dalam bab ini adalah tentang waktu-waktu memasuki ihram. Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: “Penduduk Madinah memasuki ihram dari Dzul-Hulayfah, penduduk Suriah memasuki ihram dari al-Juhfah, dan penduduk Najd memasuki ihram dari Qarn.” Ibn Umar berkata: “Dan telah sampai kepadaku bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: ‘Dan penduduk Yaman memasuki ihram dari Yalamlam.’” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1060), dan bahwa Ibn Abd al-Barr (al-Tamhid 15/137) mengatakan bahwa Ibn Umar tidak mendengar pernyataan Nabi tentang Yalamlam, dan bahwa hadits mursal dari satu Sahabat kepada Sahabat lainnya dianggap sahih. {kutip:muwatta-maruf-1997 hal.444} {kutip:muwatta-maruf-1997 hal.445}"
