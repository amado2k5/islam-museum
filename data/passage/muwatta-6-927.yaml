label: { ar: "الموطأ 927 — ابن عمر عن النبي: يهل أهل المدينة من ذي الحليفة، وأهل الشام من الجحفة، وأهل نجد من قرن، وبلغه أن أهل اليمن من يلملم", en: "Muwatta 927" }
text: "يهل أهل المدينة من ذي الحليفة، ويهل أهل الشام من الجحفة، ويهل أهل نجد من قرن"
summary:
  ar: "أول حديث في باب مواقيت الإهلال. يرويه مالك عن نافع عن عبد الله بن عمر، أن رسول الله قال: يهل أهل المدينة من ذي الحليفة، ويهل أهل الشام من الجحفة، ويهل أهل نجد من قرن. قال ابن عمر: وبلغني أن رسول الله قال: ويهل أهل اليمن من يلملم. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1060)، وأن ابن عبد البر (التمهيد 15/137) قال إن ابن عمر لم يسمع من النبي قوله في يلملم، وإن مرسل الصحابي عن الصحابي حجة. {cite:muwatta-maruf-1997 p.444} {cite:muwatta-maruf-1997 p.445}"
