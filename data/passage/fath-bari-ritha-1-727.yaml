  tr: "Sahih el-Buhari Tefsiri, Fath el-Bari'den, 1. cilt, 727. sayfadan, vefat eden kişi için ağıt ve övgü içeren bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü ağıt ve övgülerin bir derlemesinden derlenmiştir."
  id: "Cuplikan dari Fath al-Bari, Tafsir Sahih al-Bukhari, Jilid 1, halaman 727, berisi elegi dan pujian untuk orang yang telah meninggal; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan pujian yang paling terkenal."
