text: "… أن الزيادة في صلاة الحضر كانت بعد قدوم النبي عالفي المدينة بشهر واحد، قال : وزعم أنه لا خلاف بين أهل الحجاز في ذلك. - باب قَوْلِ النَّبِيِّ وَلفس اللَّهُمَّ أَمْضِ لأصْحَابِي هِجْرَتَهُمْ، وَمَرْثِيَتِهِ لِمَنْ مَاتَ بِمَكَّةَ - حَدَّثَنَا يَحْيَى …"
summary:
  ar: "مقطع من فتح الباري شرح صحيح البخاري، المجلد المصوَّر 1، ص 727، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
