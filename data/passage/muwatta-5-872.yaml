label: { ar: "الموطأ 872 — مالك: لا يبيت المعتكف إلا في المسجد الذي اعتكف فيه، إلا أن يكون خباؤه في رحبة من رحاب المسجد؛ ولا يعتكف فوق ظهر المسجد ولا في المنارة", en: "Muwatta 872", es: "Muwatta 872", fr: "Muwatta 872", ur: "موطا 872", tr: "El-Muvatta 872 — Malik: İtikaf yapan kişi, çadırı caminin açık alanında olmadığı sürece, itikaf yaptığı mescit dışında geceyi geçirmemelidir; ayrıca caminin çatısında veya minaresinde itikaf yapmamalıdır.", id: "Al-Muwatta 872 — Malik: Orang yang sedang beritikaf tidak boleh bermalam kecuali di masjid tempat ia beritikaf, kecuali jika tendanya berada di area terbuka masjid; dan ia tidak boleh beritikaf di atap masjid atau di menara." }
summary:
  ar: "قول لمالك: لا يبيت المعتكف إلا في المسجد الذي اعتكف فيه، إلا أن يكون خباؤه في رحبة من رحاب المسجد. ولم يسمع أن المعتكف يضرب بناء يبيت فيه إلا في المسجد أو في رحبة من رحابه، وذلك يدل على قول عائشة: كان رسول الله إذا اعتكف لا يدخل البيت إلا لحاجة الإنسان. ويقول مالك: ولا يعتكف فوق ظهر المسجد ولا في المنار، يعني الصومعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (871) و(872). {cite:muwatta-maruf-1997 p.421}"
  tr: "Malik şöyle demiştir: İtikaf yapan kişi, çadırı caminin avlusunda olmadığı sürece, geceyi itikaf yaptığı mescit dışında geçirmemelidir. İtikaf yapan bir kişinin, mescit veya avlularından biri dışında geceyi geçirmek için bir yapı kurduğuna dair bir rivayet duyulmamıştır. Bu, Aişe'nin şu sözüyle de desteklenmektedir: \"Allah'ın Resulü itikaf yaptığında, insani bir ihtiyaç dışında eve girmezdi.\" Malik ayrıca şöyle demiştir: İtikaf, mescidin çatısında veya minarede yapılmamalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (871) ve (872) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.421}"
  id: "Malik berkata: Orang yang sedang beritikaf tidak boleh bermalam kecuali di masjid tempat ia beritikaf, kecuali jika tendanya berada di halaman dalam masjid. Belum pernah terdengar bahwa seseorang yang sedang beritikaf mendirikan bangunan untuk bermalam kecuali di dalam masjid atau di salah satu halamannya. Hal ini didukung oleh pernyataan Aisyah: \"Ketika Rasulullah SAW beritikaf, beliau tidak masuk rumah kecuali untuk keperluan buang air.\" Malik juga berkata: Seseorang tidak boleh beritikaf di atap masjid atau di menara, maksudnya menara. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (871) dan (872). {cite:muwatta-maruf-1997 p.421}"
