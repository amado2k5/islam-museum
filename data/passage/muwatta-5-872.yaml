label: { ar: "الموطأ 872 — مالك: لا يبيت المعتكف إلا في المسجد الذي اعتكف فيه، إلا أن يكون خباؤه في رحبة من رحاب المسجد؛ ولا يعتكف فوق ظهر المسجد ولا في المنارة", en: "Muwatta 872" }
summary:
  ar: "قول لمالك: لا يبيت المعتكف إلا في المسجد الذي اعتكف فيه، إلا أن يكون خباؤه في رحبة من رحاب المسجد. ولم يسمع أن المعتكف يضرب بناء يبيت فيه إلا في المسجد أو في رحبة من رحابه، وذلك يدل على قول عائشة: كان رسول الله إذا اعتكف لا يدخل البيت إلا لحاجة الإنسان. ويقول مالك: ولا يعتكف فوق ظهر المسجد ولا في المنار، يعني الصومعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (871) و(872). {cite:muwatta-maruf-1997 p.421}"
