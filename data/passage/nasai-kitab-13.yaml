  ar: "سنن النسائي، كتاب السهو"
  en: "Sunan al-Nasa'i, Book 13: The Book of Forgetfulness (In Prayer)"
  ur: "سنن نسائی، کتاب السہو"
  es: "Sunan al-Nasa'i, Libro 13: El Libro del Olvido (En la Oración)"
  fr: "Sunan al-Nasa'i, Livre 13: Le Livre de l'Oubli (Dans la Prière)"
summary:
  ar: "القسم 13 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب السهو»، ويضم فيها النصوص من 1179 إلى 1366 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 13 of Sunan al-Nasa'i (The Book of Forgetfulness (In Prayer)) in the division of the open hadith dataset the museum took its reports from: reports 1179 to 1366 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 13، عنوان «کتاب السہو»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1179 تا 1366۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 13 de Sunan al-Nasa'i (El Libro del Olvido (En la Oración)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1179 al 1366 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de l'oubli en prière), dans la section 1179 à 1366 de la base de données ouverte: le livre 13 correspond aux hadiths de cette section. Le musée classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
