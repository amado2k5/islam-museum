label: { ar: "الموطأ 190 — ابن عمر في السفر: الإقامة وحدها إلا في الصبح", en: "Muwatta 190" }
text: "إنما الأذان للإمام الذي يجتمع الناس إليه"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب النداء في السفر وعلى غير وضوء: كان عبد الله بن عمر لا يزيد على الإقامة في السفر إلا في الصبح فإنه كان يؤذن لها ويقيم، وكان يقول إن الأذان للإمام الذي يجتمع الناس إليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند البيهقي، وأن عبد الرزاق وابن أبي شيبة روياه من طرق أخرى عن نافع وأيوب بنحوه. {cite:muwatta-maruf-1997 p.121}"
