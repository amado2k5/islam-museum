text: "… سليمان ابى داود، من جلة المجدثين وفقهاأهم ثقة ومولده... وتوفى سنة ست عشرة وثلمائة وله من الكتب : كتاب التفسير عمله لما عمل أبو جعفر الطبرى كتابه وأكبر كتاب ابن أبي داود حديث، كتاب المصابيح فى الحديث، كتاب المصاحف، كتاب …"
