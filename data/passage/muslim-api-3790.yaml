label: { ar: "صحيح مسلم 3790 — ما أُحل، ما لا يحل", en: "Sahih Muslim 3790 — what was made lawful; what is not lawful", ur: "صحیح مسلم 3790 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih Muslim 3790 — lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih Muslim 3790 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih Muslim 3790 — Neler caizdir, neler caiz değildir", id: "Sahih Muslim 3790 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "وَحَدَّثَنِي مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا ابْنُ جُرَيْجٍ، أَخْبَرَنِي أَبُو الزُّبَيْرِ، أَنَّهُ سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ كَتَبَ النَّبِيُّ عَلَى كُلِّ بَطْنٍ عُقُولَهُ ثُمَّ كَتَبَ \" أَنَّهُ لاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَتَوَالَى مَوْلَى رَجُلٍ مُسْلِمٍ بِغَيْرِ إِذْنِهِ \". ثُمَّ أُخْبِرْتُ أَنَّهُ لَعَنَ فِي صَحِيفَتِهِ مَنْ فَعَلَ ذَلِكَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3790، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3790 (The Book of Emancipating Slaves), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3790، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 3790 (El Libro de la Emancipación de los Esclavos), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3790 (Le Livre de l'affranchissement des esclaves), mentionne ce qui a été rendu licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sahih Müslim'de 3790 numaralı hadis, helal ve haram olanı belirtir. Bu helal ve haram rehberi, bu hadisi Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3790, menyebutkan apa yang diperbolehkan dan apa yang tidak. Panduan halal dan haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
