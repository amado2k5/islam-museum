text: "… عُيَيْنَةُ بْنُ حِصْنٍ وَالأَقْرَعُ بْنُ حَابِسٍ فَسَأَلاَهُ فَأَمَرَ لَهُمَا بِمَا سَأَلاَ وَأَمَرَ مُعَاوِيَةَ فَكَتَبَ لَهُمَا بِمَا سَأَلاَ فَأَمَّا الأَقْرَعُ فَأَخَذَ كِتَابَهُ فَلَفَّهُ فِي عِمَامَتِهِ وَانْطَلَقَ وَأَمَّا عُيَيْنَةُ فَأَخَذَ كِتَابَهُ وَأَتَى النَّبِيَّ صلى الله عليه وسلم مَكَانَهُ فَقَالَ يَا مُحَمَّدُ أَتَرَانِي حَامِلاً إِلَى قَوْمِي كِتَابًا لاَ أَدْرِي مَا فِيهِ كَصَحِيفَةِ الْمُتَلَمِّسِ ‏.‏ فَأَخْبَرَ مُعَاوِيَةُ بِقَوْلِهِ رَسُولَ اللَّهِ صلى الله عليه وسلم …"
summary:
  ar: "في سنن أبي داود؛ ذكر كتابة كتاب أو إرساله."
  en: "In Sunan Abi Dawud; mention of writing or dispatching a letter."
  ur: "سنن ابی داؤد میں؛ خط لکھنے یا بھیجنے کا ذکر."
