text: "الجملة الأولى والأغذية الإنسانية : نبات وحيوان. فأما الحيوان الذي يُغْتذى به، فمنه حلال في الشرع، ومنه حرام، وهذا منه بَرِّيّ ومنه بجريَ. والمحرمة منها ما تكون محرمة لعينها، ومنها ما تكون لسبب وارد عليها. وكل هذا منها ما اتفقوا …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 39، يذكر الحلال، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 39, that mentions the lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 39 کا اقتباس جس میں حلال، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
