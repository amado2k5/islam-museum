label: { ar: "الموطأ 1268 — كريب مولى ابن عباس: مر النبي بامرأة في محفتها، فسألته ألهذا حج، فقال نعم ولك أجر", en: "Muwatta 1268" }
text: "نَعَمْ . ولَكِ أجْرٌ"
summary:
  ar: "يروي مالك عن إبراهيم بن عقبة عن كريب مولى عبد الله بن عباس أن رسول الله مر بامرأة في محفتها، فقيل لها هذا رسول الله، فأخذت بضبعي صبي كان معها، فقالت ألهذا حج؟ فقال نعم، ولك أجر. ويذكر المحقق أن الحديث مرسل عند أكثر رواة الموطأ، وقد أسنده عن مالك جماعة. {cite:muwatta-maruf-1997 p.563}"
