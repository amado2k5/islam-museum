ref: "1268"
label: { ar: "الموطأ 1268 — كريب مولى ابن عباس: مر النبي بامرأة في محفتها، فسألته ألهذا حج، فقال نعم ولك أجر", en: "Muwatta 1268", es: "Muwatta 1268", fr: "Muwatta 1268", ur: "موطا 1268", tr: "El-Muvatta 1268 — İbn Abbas'ın azatlı kölesi Kurayb: Peygamberimiz sedyesinde bir kadının yanından geçerken kadın ona, \"Bu kişi Hac yapıyor mu?\" diye sordu. Peygamberimiz şöyle cevap verdi: \"Evet, ve sen de sevap kazanacaksın.\"" }
text: "نَعَمْ . ولَكِ أجْرٌ"
summary:
  ar: "يروي مالك عن إبراهيم بن عقبة عن كريب مولى عبد الله بن عباس أن رسول الله مر بامرأة في محفتها، فقيل لها هذا رسول الله، فأخذت بضبعي صبي كان معها، فقالت ألهذا حج؟ فقال نعم، ولك أجر. ويذكر المحقق أن الحديث مرسل عند أكثر رواة الموطأ، وقد أسنده عن مالك جماعة. {cite:muwatta-maruf-1997 p.563}"
  tr: "Malik, İbrahim ibn Ukba'dan, o da Abdullah ibn Abbas'ın azatlı kölesi Kurayb'dan rivayet ettiğine göre, Allah Resulü sedyesinde bir kadının yanından geçti. Kadına, \"Bu Allah Resulü'dür\" denildi. Bunun üzerine kadın, yanındaki bir çocuğun kollarından tutarak, \"Bu çocuk için Hac var mı?\" diye sordu. Resulullah, \"Evet, ve sen de sevap kazanacaksın\" diye cevap verdi. Editör, bu hadisin Muvatta'nın çoğu ravisine göre mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu, ancak bir grup âlimin Malik'ten rivayetle bu hadisi naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.563}"
  id: "Malik meriwayatkan dari Ibrahim ibn Uqba, dari Kurayb, budak yang dibebaskan oleh Abdullah ibn Abbas, bahwa Rasulullah SAW melewati seorang wanita di tandunya. Wanita itu diberitahu, \"Ini adalah Rasulullah SAW.\" Kemudian wanita itu memegang lengan seorang anak yang bersamanya dan bertanya, \"Apakah ada haji untuk anak ini?\" Anak itu menjawab, \"Ya, dan kamu akan mendapat pahala.\" Editor mencatat bahwa hadits ini mursal (hadits dengan rantai periwayatan yang hilang) menurut sebagian besar perawi al-Muwatta, tetapi sekelompok ulama telah meriwayatkannya dengan rantai periwayatan dari Malik. {cite:muwatta-maruf-1997 p.563}"
