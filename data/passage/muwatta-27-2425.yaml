label: { ar: "الموطأ 2425 — مالك: العبد الذي ليس من خدم السيد لا قطع عليه في سرقة متاع سيده", en: "Muwatta 2425", es: "Muwatta 2425", fr: "Muwatta 2425", ur: "موطا 2425", tr: "El-Muvatta 2425 — Malik: Efendisinin ailesinden olmayan bir köle, efendisinin malını çalmaktan dolayı hadd cezasına tabi değildir.", id: "Al-Muwatta 2425 — Malik: Seorang budak yang bukan bagian dari rumah tangga tuannya tidak dikenai hukuman hadd karena mencuri barang milik tuannya." }
summary:
  ar: "قال مالك: الأمر عندنا في العبد يسرق من متاع سيده: إن كان ليس من خدمه ولا ممن يؤمن على بيته، ثم دخل سرا فسرق من متاع سيده ما يجب فيه القطع، فلا قطع عليه. وكذلك الأمة إذا سرقت من متاع سيدها، لا قطع عليها. {cite:muwatta-maruf-1997 p.401} {cite:muwatta-maruf-1997 p.402}"
  tr: "Malik şöyle dedi: Efendisinin malından çalan köle hakkındaki hükmümüz şudur: Eğer o, efendisinin hizmetkarları arasında değilse veya ev işleriyle görevlendirilmiş biri değilse ve gizlice efendisinin malından, uzuv kesmeyi gerektirecek bir şey çalarsa, uzuv kesme cezasına tabi değildir. Benzer şekilde, bir kadın köle efendisinin malından çalarsa, o da uzuv kesme cezasına tabi değildir. {cite:muwatta-maruf-1997 s.401} {cite:muwatta-maruf-1997 s.402}"
  id: "Malik berkata: Hukum kami mengenai seorang budak yang mencuri dari harta milik tuannya adalah sebagai berikut: jika ia bukan termasuk pelayan atau orang yang dipercayakan dengan rumah tangga tuannya, lalu masuk secara diam-diam dan mencuri sesuatu dari harta milik tuannya yang layak dihukum amputasi, maka ia tidak dikenakan hukuman amputasi. Demikian pula, jika seorang budak perempuan mencuri dari harta milik tuannya, ia tidak dikenakan hukuman amputasi. {cite:muwatta-maruf-1997 p.401} {cite:muwatta-maruf-1997 p.402}"
