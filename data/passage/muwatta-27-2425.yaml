label: { ar: "الموطأ 2425 — مالك: العبد الذي ليس من خدم السيد لا قطع عليه في سرقة متاع سيده", en: "Muwatta 2425" }
summary:
  ar: "قال مالك: الأمر عندنا في العبد يسرق من متاع سيده: إن كان ليس من خدمه ولا ممن يؤمن على بيته، ثم دخل سرا فسرق من متاع سيده ما يجب فيه القطع، فلا قطع عليه. وكذلك الأمة إذا سرقت من متاع سيدها، لا قطع عليها. {cite:muwatta-maruf-1997 p.401} {cite:muwatta-maruf-1997 p.402}"
