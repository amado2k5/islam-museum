label: { ar: "صحيح مسلم 7225 — الحساب", en: "Sahih Muslim 7225 — the reckoning", ur: "صحیح مسلم 7225 — حساب" }
text: "… إِسْمَاعِيلَ، قَالَ أَبُو بَكْرٍ حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ أَيُّوبَ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" مَنْ حُوسِبَ يَوْمَ الْقِيَامَةِ عُذِّبَ \". فَقُلْتُ أَلَيْسَ قَدْ قَالَ اللَّهُ عَزَّ وَجَلَّ { فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا} فَقَالَ \" لَيْسَ ذَاكِ الْحِسَابُ إِنَّمَا ذَاكِ الْعَرْضُ مَنْ نُوقِشَ الْحِسَابَ يَوْمَ الْقِيَامَةِ عُذِّبَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7225، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 7225 (The Book of Paradise, its Description, its Bounties and its Inhabitants), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 7225، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
