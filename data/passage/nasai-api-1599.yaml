label: { ar: "سنن النسائي 1599 — ما كُتب على المؤمنين، ما تُرك خشية أن يُفرض", en: "Sunan al-Nasa'i 1599 — what was prescribed for the believers; what was left for fear it would be made obligatory", ur: "سنن نسائی 1599 — جو مومنوں پر لکھ دیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا", fr: "Sunan al-Nasa'i 1599 — ce qui a été prescrit aux croyants ; ce qui fut délaissé de crainte qu'il ne devienne obligatoire", es: "Sunan al-Nasa'i 1599 — lo que se prescribió a los creyentes; lo que se dejó por temor a que se hiciera obligatorio" }
text: "… رَسُولُ اللَّهِ فِيهَا لَيَالِيَ حَتَّى اجْتَمَعَ إِلَيْهِ النَّاسُ ثُمَّ فَقَدُوا صَوْتَهُ لَيْلَةً فَظَنُّوا أَنَّهُ نَائِمٌ فَجَعَلَ بَعْضُهُمْ يَتَنَحْنَحُ لِيَخْرُجَ إِلَيْهِمْ فَقَالَ \" مَا زَالَ بِكُمُ الَّذِي رَأَيْتُ مِنْ صُنْعِكُمْ حَتَّى خَشِيتُ أَنْ يُكْتَبَ عَلَيْكُمْ وَلَوْ كُتِبَ عَلَيْكُمْ مَا قُمْتُمْ بِهِ فَصَلُّوا أَيُّهَا النَّاسُ فِي بُيُوتِكُمْ فَإِنَّ أَفْضَلَ صَلاَةِ الْمَرْءِ فِي بَيْتِهِ إِلاَّ الصَّلاَةَ الْمَكْتُوبَةَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1599، يرد فيه ذكر ما كُتب على المؤمنين، وما تُرك خشية أن يُفرض، والصلاة المكتوبة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 1599 (The Book of Qiyam Al-Lail (The Night Prayer) and Voluntary Prayers During the Day), whose wording mentions what was prescribed for the believers, what was left for fear it would be made obligatory, the prescribed prayer. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 1599، جس کے الفاظ میں جو مومنوں پر لکھ دیا گیا، جو فرض ہو جانے کے اندیشے سے چھوڑا گیا، فرض نماز کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 1599, dont le texte mentionne ce qui a été prescrit aux croyants, ce qui fut délaissé de crainte qu'il ne devienne obligatoire, la prière prescrite. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 1599, cuyo texto menciona lo que se prescribió a los creyentes, lo que se dejó por temor a que se hiciera obligatorio, la oración prescrita. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
