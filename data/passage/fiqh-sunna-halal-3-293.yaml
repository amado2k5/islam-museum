text: "… أو يريد الطلاق بلفظ التحريم غير قاصد لمعنى اللفظ، بل قصد التسريح : ففي الحالة الأولى، لا يقع الطلاق، لما أخرجه الترمذي حلالاً.. عن عائشة،ا، قالت : آلى رسول اللّٰه ماع من نسائه، فجعل الحرام وجعل في اليين كفارة. وفي …"
