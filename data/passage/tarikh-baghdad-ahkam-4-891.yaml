text: "… الواحد.ابن على الاسدى. قال قال لى محمد بن أبى الفوارس روى ابن بطة عن البغوى عن مصعب بن عبد الله عن مالك عن الزهرى عن أنس عن النبى. قال: طلب العلم فريضة على كل مسلم. • قلت : وهذا الحديث …"
