label: { ar: "الموطأ 1300 — يحيى بن سعيد عن سعيد بن المسيب: كان الناس في الغزو يعدلون البعير بعشر شياه عند القسمة", en: "Muwatta 1300" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول إن الناس في الغزو، إذا اقتسموا غنائمهم، كانوا يعدلون البعير بعشر شياه. ويذكر المحقق أن تعديل عشرة من الغنم ببعير ثابت من فعل النبي من حديث رافع بن خديج في الصحيحين. {cite:muwatta-maruf-1997 p.581}"
