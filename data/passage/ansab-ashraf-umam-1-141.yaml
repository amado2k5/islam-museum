text: "… وكان الذين تنتهي عداوة رسول اللّٰه وَلِيِ إليهم : أبو جهل، وأبو لهب، وعقبة. وكان أبو سفيان بن حرب، وعتبة وشيبة ابنا ربيعة ذوي عداوة للنبي وَلِي، ولكنهم لم يكونوا يفعلون كما فعل هؤلاء، وكانوا كجهلة قريش. أمر أبي جهل …"
