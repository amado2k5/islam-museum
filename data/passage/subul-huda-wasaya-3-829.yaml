  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 3. cildinin 829. sayfasında, vasiyet veya son anlaşma, ölüm saati, defin, mezar ve istirahat yeri gibi konular ele alınmaktadır; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Metin, \"Vasiyetler, Miraslar, Antikalar ve İstirahat Yerleri\" bölümü tarafından derlenmiştir."
