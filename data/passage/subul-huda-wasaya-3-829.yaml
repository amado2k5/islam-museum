text: "… المعلى بن جابر بن مسلم، عن أبيه عن عديسة بنت أهبان بن صيفى : أن أباها لما حضرته الوفاة أوصى أن يكفن ف ثوبين فكفنوه في ثلاثة فأسبحوا فوجدوا الثوب الثالث على السرير."
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 3، ص 829، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 3, p. 829, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 3، ص 829 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
