label: { ar: "سنن النسائي 1264 — الأب والأبوة", en: "Sunan al-Nasa'i 1264 — the father and fatherhood", ur: "سنن نسائی 1264 — باپ اور والدیت", es: "Sunan al-Nasa'i 1264 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1264 — le père et la paternité" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ عَلِيِّ بْنِ مَيْمُونٍ الرَّقِّيُّ، قَالَ حَدَّثَنَا مُحَمَّدٌ، - وَهُوَ ابْنُ يُوسُفَ الْفِرْيَابِيُّ - قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ أَبِيهِ، عَنْ وَائِلِ بْنِ حُجْرٍ، أَنَّهُ رَأَى النَّبِيَّ جَلَسَ فِي الصَّلاَةِ فَافْتَرَشَ رِجْلَهُ الْيُسْرَى وَوَضَعَ ذِرَاعَيْهِ عَلَى فَخِذَيْهِ وَأَشَارَ بِالسَّبَّابَةِ يَدْعُو بِهَا."
summary:
  ar: "حديث في سنن النسائي، رقم 1264، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1264 (The Book of Forgetfulness (In Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1264، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1264 (El Libro del Olvido (En la Oración)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 1264 (Le Livre de l'oubli (dans la prière)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
