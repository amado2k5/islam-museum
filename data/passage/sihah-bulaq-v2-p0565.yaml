text: |-
  ٢٢
  كل بجمع بنى على صورة الواحدساغ فيه توهم الواحد كقول الشاعر
  مشل الفراخ نتقت حواصله * لان الفراخ ليس فيه علامة الجع وهو على صورة الواحد
  كالكتاب والحجاب ويقال الهاء ترجع الى النهض وهو موضع فى كتف البعير فأستعاره للقطا
  والخلف أقصر أضلاع الجنب والمع خلاف ومنه قول طرفة بن العبد
  وطى محال كالخنى خلوفه • وأجرنة لزت بدأى منضد
  ويقال ورأء بيتك خلف جيد وهو المريد وفاس دات خلفين أى لها رأسان وانلخلف والخاف
  ماجاء من بعد يقال«وخلف سوءمن أبيه وخلف صدق من أيه بالتحر يك اذا قاممماءه
  قال الاخفس هماسوا منهم من يحرك ومنهم من يسكن فيهما جميعا اذا أضاف
  ومنهم من يقول خلف صدق بالتحريك ويسكن الاخر ويريد بذلك العرق بينهسما
  قال الراجز
  انا وجدنا خلفابئس الخلف • عبدا اذا ماناه بالحمل خضف
  ويعير أخلئ بين الخلف اذا كان ما تلاعلى شق حكاه أبو عميد والخلف أيضاما استخلفته من شئ
  والخلف بالضم الاسم من الاخلاف وهو فى المستقبل كالكذب فى الماضى والخلف بالسكسر
  حلمة ضرع الناقة القادمان والا خران ويقال أيضاهن يمشين خلفة أى تذهب هذه وتجى.
  هذه ومنه قول زهير
  بها العين والارآم يمشين خلفة * وأللاؤها ينهضن من كل مجثم
  ويقال أيضا القوم خلفة أى مختلفون حكاء أبوزيد وأنشد * دلواى خلفان وساقياهما*
  وبنوفلان خلفة أى شطرة نصف ذكور ونصف اناث والخلفة اختلاف الليل والنهار
  ومنه قوله تعالى وهوالذى جعل الليل والنهارخلفة ويقال أخسذته خلفة اذا اختلف الى
  المتوضا ويقال من أين خلفسكم أى من أين تستقون والخلفة نبت ينبت بعد النبات الذى
  يتهشم وخلفة الشجرغر يخرج بعد الثمر الكثير وقال أبو عبيد الخلفة مانبت فى الصيف
  والخلف بكسر اللام المخماض وهى الحواصل من النوق الواحدة خلفة والمخلف من الابل
  الذى جاوز البازل الذكر والانثى فيه سواء بقال مخلف عام ومخلف عامين قال الجعدىّ
  أيد الكاهل جلدبازل • أخلف البازل عاما أوبزل
  وكان أبو زيدية ول النساقة لا تكون بازلا ولكن اذا أتى عليها حول بعد البزول فهى بزول الى
  أن تنيب قتدعى عند ذلكنابا والمخلفة من النوق هى الراجع التى ظهرلهم أنها اقمت ثم لم تكن
  كذلك ورجل مخلاف أى كثير الاخلاف لوعده والمخلاف أيضالاهل اليمن واحد الخاليف
  وهى كورها واكل مخلاف منها اسم يعرف به ورجل خالفة أى كثير الحلاف ويقال
  ما أدرى أى خالفة هو أى أىّ الناس هو غسير مصروف لذتأنيث والتعر يف ألاتزى أنك
  فسرته بالناس وفلان خالفة أهل بيته وخالف أهل بيته أيضااذا كان لاخيرفيه والخالفة
  عمود من أعمدة الحباء والمع الخوالف وقوله تعالى رضوا بأن يكونوامع الحو الف أى مع
  النساء وانخالف المستقى والخليفى بتشديد اللام الخلافة قال عمر بن الخطاب رضى الله
  عنه لو أطيق الاذان مع الخليفى لاذنت والخايف الطريق بين الجبلين قال الشاءر
