text: "ن يبعث إليه من رجالاتهم من يخرج به إلى أحيائهم، وكان حامل الكتاب من اليهود مضطغنا على هرقانوس، لأنه قتل أخاه وسلب ماله، فوضع الكتاب في يد هيردوس، فلما قرأه رده إليه وقال: أبلغه إلى ملك العرب وأرجع الجواب إلي"
