label: { ar: "الموطأ 1733 — نافع عن ابن عمر: لا تبيت المتوفى عنها زوجها ولا المبتوتة إلا في بيتها", en: "Muwatta 1733", es: "Muwatta 1733", fr: "Muwatta 1733", ur: "موطا 1733", tr: "El-Muvatta 1733 — İbn Ömer'den rivayet edildiğine göre Nafi': Kocası ölmüş veya geri dönülmez şekilde boşanmış bir kadın, geceyi kendi evinden başka bir yerde geçirmemelidir." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يقول: لا تبيت المتوفى عنها زوجها، ولا المبتوتة، إلا في بيتها. {cite:muwatta-maruf-1997 p.108}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan naklederek şöyle der: \"Kocası ölmüş veya geri dönülmez şekilde boşanmış bir kadın, geceyi kendi evinden başka bir yerde geçirmemelidir.\" {cite:muwatta-maruf-1997 s.108}"
  id: "Malik meriwayatkan dari Nafi’ yang berasal dari Abdullah ibn Umar bahwa beliau biasa berkata: “Seorang wanita yang suaminya telah meninggal dunia, atau yang telah dicerai secara tidak dapat dibatalkan, sebaiknya tidak bermalam di tempat lain selain di rumahnya sendiri.” {cite:muwatta-maruf-1997 p.108}"
