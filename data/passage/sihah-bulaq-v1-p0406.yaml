text: |-
  (فصل الحينn
  ٢٢٠
  وفى المثل بكل واد بنو سعد قاله الاضبط بن قريع العدى تلباتوّل عن قومه وانتقل فى
  القبائل فلمالم يحمدهم رجع الى قومه وقال بكل واد بنو -عديه فسعد ين زيدمناة بن تيم وأما
  سعدين يكرفهم أظا رر-ول اللّٰه صلى اللّٰه عليه وسلم وهو سعدين بكر بن هوازن وبنو أسعد
  إطن من العرب وهوتذ كير -عدى وقواهم فى المثل أسعدأم سعيد اذا مثل عن الشأهومما
  بحب أويكره يقال أملهأنهما ابناضبة بن أذخر بافرجع سعد وفقد سعيد فسارمما يتشاهم به
  والسعيدية من برود اليمن والسعدان نبت وهومن أفضل مراعى الابل وفى المنل حرعى ولا
  كالسعدان والنون زائدة لانه ليس فى الكلام فعلال غير خز عال وقهة ار الامن المضاعف
  ولهذا النبت شول بقال له حك السعدان وتشبه به حلة المدى يقال له سعدانة
  الشندوة والسعدانة كركرة البعير وأسفل الهجاية هنات كأنها الاظفار تسمى السعدانات
  والسعدانة أيضاعقدة الشسع التى تلى الارض وكذلك العقد التى فى أسفل كفة الميزان
  وساعدا الانسان عضداء وساءدا الطائرجناحاه وساعدة ن أمماء الاسدواسم رجل
  والسواء-دمجارى الماء الى النهرأ والبحر ومجارى المخ فى العظم والسعد بالضم من الطيب
  والسعادى مثله وبنوساعدة قوم من الخزرج ولهسم سقيفة بى ساعدة وهى ينزلة دارلهم
  وآماقول الشاءر وهل سعد الاصخرة بتنوفة • من الارض لا يدعواعى ولارشد
  فهواسم صنم كان لبنى مالك بن كانة ⁦(سفد)⁩ السفادنز والذكر على الانى وقد سفد
  بالكسر يسقد سفاداية سال ذلك فى التيمر والبعبر والتور والسباع والطير وسفد بالفتح لغة
  فيه حكاها أبو عبيدة وأسفده غيره وتسافدت السباع والسه ود بالتشديد الحديدة التى يشوى
  بها اللحم لغد لساغد الاحق ويقال الذئب قال الكميت يهجو بعض الولاة
  ولابة سلفد ألف كانه • من الرحق الخلوط بالنوك أثول
  يقول كانه من حقه وما يتناوله من الهرئيس محنون مد مد سمر دارفع رأسه تكبيرا
  وكل رافع رأسه نهوسامد وقال الراجز رؤية . سوامد الليل خفاف الازواد
  يقول ليس فى بطونها علف وقال ابن الاعرابت سمدت سمود اعلوت وسعدت الابل فى سيرها
  جدّت والسمود اللهو والسامد اللاهى والمغنى والسامد القائم والساكت والسامد الحزين
  اللخاشع يقال للقينة أسمد يشا أى ألهينا بالغناء وغنينا وتسميد الارض أن يجع-ل فيما السماد
  وهو سرجين ورماد وتسميد الرأس استئصال شعره لغة فى التسبيد واسمأد الرجل بالهمز
  اسمتدادا أى ورم غضبا ( مفد لمسمقد الوارم بالغيز معجة ويقال امهفدت أناحله
  اذا بورمت واسمغد الرجل أى امتلا غضبا ند ) السندماقابلك من الجبل وعلاعن
  السفح وفلان سندأى معتمد وسندت الى السئ أسندسنودا واستندت بمعنى وأسندت
  غيرى والاسناد ف الحسديث رفع ه الى قائله وخشب مسندة شدد للكثرة وتسائدت اليه
  استندت وخرج القوم متساندين أى على رايات شتى ولم يكونوا تحت راية أميرواحد
  والمند الدهر والمسند الدعىّ والمندخط لحمير مخالف خطناهذا والسناد الناقة
  الشديدة انخاق قال الشاءرذ والرمة
  جمالية حرف سناديشلها • وظيف أزج الخطوظما ن سهوق
