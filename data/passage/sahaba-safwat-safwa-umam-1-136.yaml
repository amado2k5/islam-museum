text: "… يسير في القوم، فقال رسول اللّٰه يَسَخ : يا علي نادِ لي حمزة وكان أقربهم من المشركين : من صاحب الجمل الأحمر؟ وماذا يقول لهم؟ فجاء حمزة فقال: هو عتبة بن ربيعة وهو ينهى عن القتال. قال: فبرز عتبة وشيبة …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 136، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
