text: |-
  ابن القرية اسعه أيوب بن يزيد
  واسم أمه بحاعة بنت جشم كما
  فى القاموس وله واقعة عميبة
  مع لجاج ذكرت بطولها فى ترجته
  من لوفيات
  ⁦(باب الرا)⁩
  مثل الشييخ المقذ حرّ الباذى • أوفى على دبادة يباذى
  (قرر القرار المستقر من الارض والقرارى الخياط قال الاعشى
  بشق الامورويجناجا * كشق القرارى ثوب الردن
  الاصمعى القرار والقرارة النقد وهوضرب من الغنم قصار الارجل قباح الوجوه والقرارة
  القاع المستدير قال أبو عبيد القرّمر كب للرجال بين الرحل والسرج وقال غيره القز
  الهودج وأنتد* كالقرناست فوقه الجزاجز* وقال امر والقيس
  فاماتربن فى رحالة جابر على حرج كالقترتخفق أكفانى
  والقرّ الفروجة قال ابن أحر كالقز بين قوادم ذءر» ويوم القزاليوم الذى بعديوم النحر
  لان الناس يقرون فى منازلهم والرّتان الغداة والعشى- قال لبيد
  وجوارن بيض وكل طعرة * يعد وعليها التترّتين غلام
  الجوارن الدروع ويوم قرّوليدلة قرّة أى باردة والقرّ بالضم البرد والر أيضا القرار ومنه
  قواهم عند شدّة تصيهم صابت بقرّأى صارت الشّدّة فى قرارها وربما قالوا وقعت بقر" قال
  عدى بن زيد
  ترجيها وقد وقعت بقرّ * كماترجوأصاغرها عتيب
  والقرارة ما يصب فى القدر من الماء بعد العلبخ لئلاتحسترق وأماما يلتزق بأسفل بالقدرهى
  القرورة بضم القاف والراء عن أبى عبيدة وكان الفراه يفتح الراء والة-رقور السفينة الطويلة
  وقراقر على فعالل بضم القاف اسم ماء ومنه غزاة قراقر قال الشاءر
  وهم ضربوابالحنو حنوقراقر * مقدمة الهامرزحتى نولت
  وحاد راقر وقراقرى اذا كان جيد المسوت من القرقرة قال الراجز
  أصبح صوت عامر صييا • من بعدما كان قراقر يا * أن يتادى بعدك المطيا
  وقران اسم رجل وقران فى شعر أبى ذؤيب اسم واد والقرة بالكسر البرديقال أشد العطس
  حرّة على قرة وربما قالوا أجدحرّة تحت قرة ويقسال أيضاذهبت قرتما أى الوقت الذى يأتى
  فيه المرض والهاء للعلة والقرية الحوصلة مثل الجرية وأيوب بن القرية أحد الفصماء
  والقارورة واحدة القوار يرمن الزجاج والقارور الماه البارد يغتسل به والقرة والقاع
  الاملس والقرقرة نوع من الضحك والقرقرة لة ب سعد الذى كان يضحن منه النعمان
  ابن المنذر وقر قرت الحسامة قرقرة وقرقريرا قال
  وماذات طوق فوق عوداراكة • اذارقرت هاج الهوى قرريرها
  وقرقر بطنه أى صوت والقرقرة الهدير والهع القراقر قال شظاظ
  رب عجوز من غيرسهبره • علها الانقاض بعد القرقره
  قال قرقر البعمراذاصفاصوته ورجع و يعيرر قار اله-ديراذا كان صافى الصوت فى هدير
  وقرقرى على فعللى موضع وقوله-م قرقار بنى على الكسر وهو معدول ولم يسمع العسدل من
  الرباعى الافى عرعار وقر قار قال الراجز أبو النجم
  قالت لدريح الصباة رقار * واختلط المعروف بالانكار
  يريد قالت له قرقر بالرعد كانه يأمر السصاب بذلك وقررت القدر أقرها قرا اذا صيبت فيها
  الترارة
