label: { ar: "صحيح البخاري 4738 — ما كُتب على المؤمنين", en: "Sahih al-Bukhari 4738 — what was prescribed for the believers", ur: "صحیح بخاری 4738 — جو مومنوں پر لکھ دیا گیا", fr: "Sahih al-Bukhari 4738 — ce qui a été prescrit aux croyants", es: "Sahih al-Bujari 4738 — lo que se prescribió a los creyentes" }
text: "… أَبِي هُرَيْرَةَ ـ عَنِ النَّبِيِّ قَالَ \" حَاجَّ مُوسَى آدَمَ، فَقَالَ لَهُ أَنْتَ الَّذِي أَخْرَجْتَ النَّاسَ مِنَ الْجَنَّةِ بِذَنْبِكَ وَأَشْقَيْتَهُمْ. قَالَ قَالَ آدَمُ يَا مُوسَى أَنْتَ الَّذِي اصْطَفَاكَ اللَّهُ بِرِسَالَتِهِ وَبِكَلاَمِهِ أَتَلُومُنِي عَلَى أَمْرٍ كَتَبَهُ اللَّهُ عَلَىَّ قَبْلَ أَنْ يَخْلُقَنِي أَوْ قَدَّرَهُ عَلَىَّ قَبْلَ أَنْ يَخْلُقَنِي \". قَالَ رَسُولُ اللَّهِ \" فَحَجَّ آدَمُ مُوسَى \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4738، يرد فيه ذكر ما كُتب على المؤمنين. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 4738 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), whose wording mentions what was prescribed for the believers. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 4738، جس کے الفاظ میں جو مومنوں پر لکھ دیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 4738, dont le texte mentionne ce qui a été prescrit aux croyants. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 4738, cuyo texto menciona lo que se prescribió a los creyentes. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
