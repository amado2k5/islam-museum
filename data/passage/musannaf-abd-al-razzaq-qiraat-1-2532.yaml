text: "… ومعرفة لحَقِّه، كتب له بها حسنة، ومُحي عنه بها سيّئة. ومن جاءَه زائرًا له، نعظيماً له، ومعرفة له، تحاتَّتْ ذنوبه، حين ينظر إليه، كما يتحات الورق عن الشجر. - قال عبد الرزاق عن ابن مجاهد عن عطاع ومجاهد قالا : …"
