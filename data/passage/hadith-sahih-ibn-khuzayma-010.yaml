text: "وفي كل ذلك نظر. أما الأول : فلم يلتزم ابن خزيمة وابن حبان في كتابيهما أن يخرجا الصحيح الذي اجتمعت فيه الشروط التي ذكرها المؤلف ، لأنهما ممن لا يرى التفرقة بين الصحيح والحسن، بل عندهما أن الحسن قسم من"
