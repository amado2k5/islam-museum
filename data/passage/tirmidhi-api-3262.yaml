label: { ar: "جامع الترمذي 3262 — الأب والأبوة", en: "Jami' al-Tirmidhi 3262 — the father and fatherhood", ur: "جامع ترمذی 3262 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3262 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3262 — le père et la paternité" }
text: "… مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا مُحَمَّدُ بْنُ خَالِدِ بْنِ عَثْمَةَ، حَدَّثَنَا مَالِكُ بْنُ أَنَسٍ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ عُمَرَ بْنَ الْخَطَّابِ، يَقُولُ كُنَّا مَعَ رَسُولِ اللَّهِ فِي بَعْضِ أَسْفَارِهِ فَكَلَّمْتُ رَسُولَ اللَّهِ فَسَكَتَ ثُمَّ كَلَّمْتُهُ فَسَكَتَ ثُمَّ كَلَّمْتُهُ فَسَكَتَ فَحَرَّكْتُ رَاحِلَتِي فَتَنَحَّيْتُ وَقُلْتُ ثَكِلَتْكَ أُمُّكَ يَا ابْنَ الْخَطَّابِ نَزَرْتَ رَسُولَ اللَّهِ ثَلاَثَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3262، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3262 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3262، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3262 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3262 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
