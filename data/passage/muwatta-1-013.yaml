ref: "1.13"
label: { ar: "الموطأ 13 — طنفسة عقيل وخروج عمر إلى الجمعة", en: "Muwatta 13" }
text: "فإذا غشي الطنفسة كلها ظل الجدار خرج عمر بن الخطاب وصلى الجمعة"
summary:
  ar: "أول أثر في باب وقت الجمعة. يرويه يحيى عن مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر: كان يرى بساطاً لعقيل بن أبي طالب يُطرح يوم الجمعة إلى الجدار الغربي للمسجد، فإذا غطى ظل الجدار البساط كله خرج عمر بن الخطاب فصلى الجمعة، أي بعد الزوال بقليل، ثم كانوا يرجعون بعد الصلاة فيقيلون قيلولة شدة النهار. ويفسر المحقق الطنفسة بالبساط ذي الخمل الرقيق، والضَّحاء بالمد باشتداد النهار، ويذكر أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.40} {cite:muwatta-maruf-1997 p.41}"
  en: "Sa'id ibn al-Musayyab: the people's midday nap after the Friday prayer, and the description of the rug that used to be laid out on the mosque's western wall."
