label: { ar: "الموطأ 13 — طنفسة عقيل وخروج عمر إلى الجمعة", en: "Muwatta 13", es: "Muwatta 13", fr: "Muwatta 13", ur: "موطا 13", tr: "Al-Muwatta 13 — Akil'in halısı ve Ömer'in Cuma namazına çıkışı", id: "Al-Muwatta 13 — Karpet Aqil dan Umar pergi shalat Jumat" }
text: "فإذا غشي الطنفسة كلها ظل الجدار خرج عمر بن الخطاب وصلى الجمعة"
summary:
  ar: "أول أثر في باب وقت الجمعة. يرويه يحيى عن مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر: كان يرى بساطاً لعقيل بن أبي طالب يُطرح يوم الجمعة إلى الجدار الغربي للمسجد، فإذا غطى ظل الجدار البساط كله خرج عمر بن الخطاب فصلى الجمعة، أي بعد الزوال بقليل، ثم كانوا يرجعون بعد الصلاة فيقيلون قيلولة شدة النهار. ويفسر المحقق الطنفسة بالبساط ذي الخمل الرقيق، والضَّحاء بالمد باشتداد النهار، ويذكر أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.40} {cite:muwatta-maruf-1997 p.41}"
  en: "Sa'id ibn al-Musayyab: the people's midday nap after the Friday prayer, and the description of the rug that used to be laid out on the mosque's western wall."
  es: "Sa'id ibn al-Musayyab: la siesta del mediodía que la gente tomaba después de la oración del viernes, y la descripción de la alfombra que solía extenderse en la pared occidental de la mezquita."
  fr: "Sa'id ibn al-Musayyab: la sieste de midi des gens après la prière du vendredi, et la description du tapis qui était autrefois disposé sur le mur ouest de la mosquée."
  ur: "سعید بن المسیب: نماز جمعہ کے بعد لوگوں کا دوپہر کا سونا، اور اس قالین کی تفصیل جو مسجد کی مغربی دیوار پر بچھائی جاتی تھی۔"
  tr: "Cuma namazının vaktiyle ilgili ilk rivayet, Yahya'nın Malik'ten, onun amcası Ebu Suhayl ibn Malik'ten, onun babası Malik ibn Abi Amir'den rivayet ettiğine göre şöyledir: Cuma günleri mescidin batı duvarına serilmiş, Akil ibn Abi Talib'e ait bir halı görürdü. Duvarın gölgesi halının tamamını kapladığında, Ömer ibn el-Hattab dışarı çıkar ve cuma namazını kılardı, yani öğleden kısa bir süre sonra. Sonra namazdan sonra geri döner ve öğle uykusu çekerlerdi. Araştırmacı, halının ince, yumuşak bir halı olduğunu ve öğle uykusunun günün en sıcak zamanı olduğunu açıklıyor. Bunun Malik'ten Ebu Musab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.40} {cite:muwatta-maruf-1997 s.41}"
  id: "Riwayat pertama mengenai waktu shalat Jumat. Diriwayatkan oleh Yahya dari Malik, dari pamannya Abu Suhayl ibn Malik, dari ayahnya Malik ibn Abi Amir: Ia biasa melihat sajadah milik Aqil ibn Abi Talib terbentang di dinding barat masjid pada hari Jumat. Ketika bayangan dinding menutupi seluruh sajadah, Umar ibn al-Khattab akan keluar dan melaksanakan shalat Jumat, yaitu sesaat setelah tengah hari. Kemudian mereka akan kembali setelah shalat dan tidur siang. Peneliti menjelaskan bahwa sajadah tersebut tipis dan lembut, dan tidur siang adalah puncak hari. Ia menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Musab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.40} {cite:muwatta-maruf-1997 p.41}"
