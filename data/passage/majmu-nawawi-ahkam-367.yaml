  en: "An excerpt from al-Nawawi's al-Majmu', p. 367, whose wording mentions the obligatory (wajib), the voluntary act (tatawwu'), the disliked (makruh), dislike (karaha), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
