text: "… مكروه كراهة تنزيه حتى يضحى، وقال مالك وأبو حنيفة لا يكره، وقال سعيد بن المسيب وربيعة وأحمد وإسحاق وداود : يحرم، وعن مالك أنه يكره، وحكى عنه الدارمى : يحرم فى التطوع ولا يحرم فى الواجب. واحتج القائلون بالتحريم بحديث …"
summary:
