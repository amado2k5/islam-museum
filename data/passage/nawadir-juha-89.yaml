label: { ar: "نوادر جحا الكبرى، ص 46 — «الحمد لله أخرجت المسكين من البئر»", en: "Nawadir Juha al-Kubra, p. 46 — 'Praise God, I Pulled the Poor Thing Out of the Well'", ur: "نوادر جحا الکبریٰ، ص 46 — «شکر ہے، میں نے بیچارے کو کنویں سے نکال لیا»", fr: "Nawadir Juha al-Kubra, p. 46 — « Dieu soit loué, j'ai sorti le pauvre du puits »", es: "Nawadir Juha al-Kubra, p. 46 — «Gracias a Dios, saqué al pobre del pozo»" }
text: "… الحمدُ للَّهِ أخرجْتُ المِسكينَ من البئر نظر ليلةً إلى البئر فرأى خيال القمر في الماء فقال: مسكينٌ هذا القمرُ كيف سقطَ في البئر. وحاول إخراجَهُ فجعلَ يحرِّكُ الدلو في الماء ليصعَد القمرُ به، فعَلِق جانبُ الدلو بحجرِ فشدَّهُ جحا واعتقدَ …"
summary:
  ar: "رأى جحا القمر في بئر فأنزل دلوًا ليرفعه، فعلق الحبل بحجر وسقط جحا على ظهره، فرأى القمر في السماء وحمد الله على إنقاذه القمر المسكين. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  en: "Juha sees the moon in a well and lowers a bucket to raise it; the rope catches on a stone and he falls on his back; he sees the moon in the sky and thanks God for saving the poor moon. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  ur: "جحا نے کنویں میں چاند دیکھا اور اسے نکالنے کے لیے ڈول ڈالا؛ رسی ایک پتھر میں اٹک گئی اور وہ پیٹھ کے بل گر پڑا؛ اس نے آسمان میں چاند دیکھا اور اللہ کا شکر ادا کیا کہ بیچارے چاند کو بچا لیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  fr: "Juha voit la lune dans un puits et descend un seau pour la remonter ; la corde s'accroche à une pierre et il tombe sur le dos ; il voit la lune dans le ciel et remercie Dieu d'avoir sauvé la pauvre lune. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
  es: "Juha ve la luna en un pozo y baja un cubo para sacarla; la soga se engancha en una piedra y cae de espaldas; ve la luna en el cielo y da gracias a Dios por haber salvado a la pobre luna. {cite:juha-nawadir-kubra-djuwaydi p. 46}"
