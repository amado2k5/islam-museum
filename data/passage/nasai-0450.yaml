ref: "450"
label:
  ar: "النسائي 450 — المعراج وفرض الصلوات: أمضيت فريضتي وخففت عن عبادي"
  en: "Nasa'i 450 — The Ascension and the prayers: I have upheld My command and lightened it for My servants"
  ur: "نسائی 450 — معراج اور نمازوں کی فرضیت: میں نے اپنا فریضہ نافذ کیا اور بندوں پر تخفیف کی"
text: "أتيت بدابة فوق الحمار ودون البغل خطوها عند منتهى طرفها فركبت ومعي جبريل فسرت فقال انزل فصل . ففعلت فقال أتدري أين صليت صليت بطيبة وإليها المهاجر ثم قال انزل فصل . فصليت فقال أتدري أين صليت صليت بطور سيناء …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 450: المعراج وفرض الصلوات: أمضيت فريضتي وخففت عن عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 450: The Ascension and the prayers: I have upheld My command and lightened it for My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 450: معراج اور نمازوں کی فرضیت: میں نے اپنا فریضہ نافذ کیا اور بندوں پر تخفیف کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
