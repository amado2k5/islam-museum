text: "… الدَّينُ واصباً ؛ قال أَبو إسحق قيل في معناه : دائِباً أَي طاعتُه دائعةٌ واجبةٌ أَبداً قال ويجوز، والله أَعلم، أَن يكون: ولَهُ الدينُ واصِباً أَي لهِ الدينُ والطاعة ؛ رَضْيَ العبدُ بما يُؤمر به أَو لم يَرْض به، سَهُلَ …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 4، ص 797، يرد فيه ذكر الواجب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 4, p. 797, whose wording mentions the obligatory (wajib), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 4، ص 797 کا اقتباس جس میں واجب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Lisan al-'Arab de Ibn Manzur, volume numérisé 4, p. 797, dont le texte mentionne l'obligatoire (wajib), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen digitalizado 4, p. 797, cuyo texto menciona lo obligatorio (wajib), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Manzur'un Lisan al-Arab adlı eserinin 4. cildinin 797. sayfasından, farz olan amelleri ve itaati anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Lisan al-Arab karya Ibn Manzur, Volume 4, halaman 797, yang menyebutkan amalan wajib dan ketaatan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
