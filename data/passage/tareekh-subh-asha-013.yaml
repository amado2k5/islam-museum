text: "تصدق بما يتفوه به هذا الإنشاء؛ وهو : بسم الله الرحمن الرحيم هذا كتاب مبارك تحاسدت وماح الحط وأقلام الط على تحريره، وتنفست مطالع الوار ومشاوق الأنوار على نظم سطوره؛ فأضاء نووه بالحلالة وأشرق، وهطل نوءه بالإحساف فأغدق، وتتاسبت فيه"
