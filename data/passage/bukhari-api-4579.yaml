label: { ar: "صحيح البخاري 4579 — ما أُحل، ما لا يحل", en: "Sahih al-Bukhari 4579 — what was made lawful; what is not lawful", ur: "صحیح بخاری 4579 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih al-Bukhari 4579 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih al-Bukhari 4579 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih el-Buhari 4579 — Neler caizdir, neler caiz değildir", id: "Sahih al-Bukhari 4579 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… عَبَّاسٍ،. قَالَ الشَّيْبَانِيُّ وَذَكَرَهُ أَبُو الْحَسَنِ السُّوَائِيُّ وَلاَ أَظُنُّهُ ذَكَرَهُ إِلاَّ عَنِ ابْنِ عَبَّاسٍ، {يَا أَيُّهَا الَّذِينَ آمَنُوا لاَ يَحِلُّ لَكُمْ أَنْ تَرِثُوا النِّسَاءَ كَرْهًا وَلاَ تَعْضُلُوهُنَّ لِتَذْهَبُوا بِبَعْضِ مَا آتَيْتُمُوهُنَّ} قَالَ كَانُوا إِذَا مَاتَ الرَّجُلُ كَانَ أَوْلِيَاؤُهُ أَحَقَّ بِامْرَأَتِهِ، إِنْ شَاءَ بَعْضُهُمْ تَزَوَّجَهَا، وَإِنْ شَاءُوا زَوَّجُوهَا، وَإِنْ شَاءُوا لَمْ يُزَوِّجُوهَا، فَهُمْ أَحَقُّ بِهَا مِنْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4579، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4579 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4579، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4579 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4579 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne ce qui a été rendu licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Sahih el-Buhari'de 4579 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4579, menyebutkan apa yang diperbolehkan dan apa yang tidak diperbolehkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
