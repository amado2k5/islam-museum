label: { ar: "صحيح البخاري 2785 — كتابة الحسنات", en: "Sahih al-Bukhari 2785 — the writing of good deeds", ur: "صحیح بخاری 2785 — نیکیوں کا لکھا جانا", es: "Sahih al-Bukhari 2785 — El registro de las buenas obras", fr: "Sahih al-Bukhari 2785 — la rédaction des bonnes actions", tr: "Sahih el-Buhari 2785 — İyi amelleri yazmak", id: "Sahih al-Bukhari 2785 — Mencatat amal kebaikan" }
text: "… أَنَّ أَبَا هُرَيْرَةَ ـ حَدَّثَهُ قَالَ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ فَقَالَ دُلَّنِي عَلَى عَمَلٍ يَعْدِلُ الْجِهَادَ. قَالَ \" لاَ أَجِدُهُ ـ قَالَ ـ هَلْ تَسْتَطِيعُ إِذَا خَرَجَ الْمُجَاهِدُ أَنْ تَدْخُلَ مَسْجِدَكَ فَتَقُومَ وَلاَ تَفْتُرَ وَتَصُومَ وَلاَ تُفْطِرَ \". قَالَ وَمَنْ يَسْتَطِيعُ ذَلِكَ قَالَ أَبُو هُرَيْرَةَ إِنَّ فَرَسَ الْمُجَاهِدِ لَيَسْتَنُّ فِي طِوَلِهِ فَيُكْتَبُ لَهُ حَسَنَاتٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2785، يذكر كتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 2785 (Fighting for the Cause of Allah (Jihaad)), that speaks of the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 2785، جس میں نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2785 (La lucha por la causa de Alá (Yihad)), que habla sobre la escritura de las buenas obras. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o valoran una obra."
  fr: "Un hadith du Sahih al-Bukhari, n° 2785 (Combat pour la cause d'Allah (Jihad)), mentionne la consignation des bonnes actions. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui recensent, inscrivent, effacent ou pèsent une action."
  tr: "Sahih el-Buhari'de 2785 numaralı hadis, iyi amellerin kaydedilmesinden bahseder. Bu hadis, iyi ve kötü amellerin bir listesini ve bu amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2785, menyebutkan pencatatan amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
