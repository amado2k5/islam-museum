text: "… الحلاوى نعم، فاخذ الشبلى رقاقة وأدخل يده فى الطنجير والعصيدة تغلى فاخذ منها بكفه وطرحها على الرقاقة. ومشى الشبلى إلى أن جاء إلى مسجد أبى بكر بن مجاهد، فدخل على أبى بكر فقام اليه أبو بكر، فتحدث أصحاب ابن مجاهد …"
