label: { ar: "نوادر جحا الكبرى، ص 39 — «ولماذا أنزلتني أنت؟»", en: "Nawadir Juha al-Kubra, p. 39 — 'And Why Did You Bring Me Down?'", ur: "نوادر جحا الکبریٰ، ص 39 — «اور تم نے مجھے نیچے کیوں اتارا؟»", fr: "Nawadir Juha al-Kubra, p. 39 — « Et pourquoi m'as-tu fait descendre ? »", es: "Nawadir Juha al-Kubra, p. 39 — «¿Y por qué me hiciste bajar tú?»", tr: "Juha'nın Büyük Fıkraları, s. 39 — “Peki neden beni aşağı çektin?”", id: "Anekdot Hebat Juha, hlm. 39 — “Dan mengapa kau menjatuhkanku?”" }
text: "… ولماذا أنزلتني أنت؟ كان في الغرفة العُلْيا من منزلِه، فطُرِقَ بابُهُ، فَأطَلَّ من النافذة فرأى رجلاً، فقال: ماذا تريد؟ قال: انزِلْ إلى تحت لأكلّمَكَ. فنزلَ، فقال الرجل : أنا فقير الحال أُريدُ حسنةً يا سيدي. فأغتاظ جحا منه ولكنه كَظَمَ …"
summary:
  ar: "وقف متسول عند باب جحا فطُلب منه أن ينزل، ثم جعله جحا يصعد إلى الطابق الأعلى، فسأل المتسول لماذا، فقال جحا إنه هو أيضًا أنزله، وطلب منه أن يمضي مع الله. {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  en: "A beggar at Juha's door is asked to come down; Juha then makes him climb to the top floor; the beggar asks why, and Juha replies that the beggar brought him down too, and tells him to go with God. {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  ur: "جحا کے دروازے پر ایک فقیر آیا اور اس سے کہا گیا کہ نیچے آؤ؛ پھر جحا نے اسے اوپر کی منزل تک چڑھایا؛ فقیر نے پوچھا کیوں، تو جحا نے جواب دیا کہ تم نے بھی تو مجھے نیچے اتارا تھا، اور اس سے کہا کہ اللہ کے سپرد جاؤ۔ {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  fr: "Un mendiant se présente à la porte de Juha et on lui demande de descendre ; Juha le fait alors monter jusqu'à l'étage le plus haut ; le mendiant demande pourquoi, et Juha répond que le mendiant l'a lui aussi fait descendre, puis lui dit d'aller avec Dieu. {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  es: "A un mendigo que está en la puerta de Juha se le pide que baje; Juha lo hace entonces subir hasta el piso más alto; el mendigo pregunta por qué, y Juha responde que el mendigo también lo hizo bajar a él, y le dice que se vaya con Dios. {cite:juha-nawadir-kubra-djuwaydi p. 39}"
  tr: "Bir dilenci Juha'nın kapısında duruyordu ve aşağı inmesi istendi. Bunun üzerine Juha onu yukarı çıkardı. Dilenci nedenini sordu ve Juha, kendisinin de onu aşağı indirdiğini ve Tanrı'yla birlikte gitmesini söylediğini belirtti. {cite:juha-nawadir-kubra-djuwaydi s. 39}"
  id: "Seorang pengemis berdiri di depan pintu Juha dan diminta turun. Kemudian Juha menyuruhnya naik ke atas. Pengemis itu bertanya mengapa, dan Juha menjawab bahwa dia juga telah menyuruhnya turun, dan menyuruhnya pergi bersama Tuhan. {cite:juha-nawadir-kubra-djuwaydi p. 39}"
