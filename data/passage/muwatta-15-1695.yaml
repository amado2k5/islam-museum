label: { ar: "الموطأ 1695 — نافع عن ابن عمر: طلق امرأة له في مسكن حفصة، فكان يسلك الطريق الأخرى من أدبار البيوت حتى راجعها", en: "Muwatta 1695", es: "Muwatta 1695", fr: "Muwatta 1695", ur: "موطا 1695", tr: "El-Muvatta 1695 — Nafi'nin İbn Ömer'den rivayet ettiğine göre: Karısı Hafsa'nın evindeyken ondan boşandı, bu yüzden onu geri alana kadar evlerin arkasından başka bir yoldan gidiyordu.", id: "Al-Muwatta 1695 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Dia menceraikan istrinya ketika istrinya berada di rumah Hafsa, lalu dia mengambil jalan lain di belakang rumah-rumah itu sampai dia menjemput istrinya kembali." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر طلق امرأة له في مسكن حفصة زوج النبي، وكان طريقه إلى المسجد، فكان يسلك الطريق الأخرى من أدبار البيوت، كراهية أن يستأذن عليها، حتى راجعها. {cite:muwatta-maruf-1997 p.93}"
  tr: "Malik, Nafi'den rivayetle, Abdullah ibn Umar'ın, eşi Hafsa (Peygamberin eşi) evinde yaşarken ondan boşandığını anlatır. Camiye gidiş yolu o evin içinden geçtiği için, içeri girmek için izin istemek zorunda kalmaktan hoşlanmadığı için, eşini geri alana kadar evlerin arkasından başka bir yoldan giderdi. {cite:muwatta-maruf-1997 s.93}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar menceraikan istrinya ketika istrinya tinggal di rumah Hafsa, istri Nabi. Rutenya ke masjid melewati rumah itu, jadi dia mengambil jalan lain di belakang rumah-rumah tersebut, karena tidak suka harus meminta izin untuk masuk, sampai akhirnya dia membawa istrinya kembali. {cite:muwatta-maruf-1997 p.93}"
