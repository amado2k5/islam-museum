text: "… سواه، لست أتوكل إلا عليه ولا أعبد إلا إياه. وهذا وحده برهان قاطع على أن هوداً عبد اللّٰه ورسوله، وأنهم على جهل وضلال فى عبادتهم غير اللّٰه، لأنهم لم يصلوا إليه بسوء ولا نالوا منه مكروهاً. فدل على صدقه فيما …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 132، يرد فيه ذكر المكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
