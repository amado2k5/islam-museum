  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 132. sayfasından bir alıntı, hoş karşılanmayan fiillerden bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz fiiller, itaat fiilleri, tavsiye edilen fiiller, hoş karşılanmayan fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 132, menyebutkan perbuatan-perbuatan yang tidak disukai; ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
