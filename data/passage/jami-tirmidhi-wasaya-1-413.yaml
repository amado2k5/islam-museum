text: "… وَلِلفِ بْلَ وَفَاتِهِ بِشَهْرَيْنِ. قَالَ: وسَمِعْتُ أَحْمَدَ بْنَ الْحَسَنِ يَقُولُ: كانَ أَحْمَدُ بْنُ حَنُبَلٍ يَذْهَبُ إِلَى هَذَا الْحَدِيثِ لِمَا ذُكِرَ فِيهِ قَبْلَ وَفَاتِهِ بِشَهْرَيْنِ وكانَ يَقُولُ كَانَ هَذَا آخِرَ أَمْرِ النَّبِيِّ وَلِ ا مَّ تَرَكَ أَحْمَدُ بْنُ حَنْبُلٍ هَذَا الحَدِيثَ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 413، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 413, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 413 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 1, pág. 413, que menciona el lecho de muerte y las últimas horas, y lo que dejó: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Jami' al-Tirmidhi, volume 1, page 413, évoquant un lit de mort et les dernières heures du défunt, ainsi que son héritage. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "Cami' el-Tirmizi'nin 1. cildinin 413. sayfasından, ölüm saati ve merhumun vefatı ile geride bıraktığı mal ve mirası anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 1, halaman 413, yang menyebutkan saat kematian dan wafatnya almarhum, serta harta dan warisan yang ditinggalkannya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
