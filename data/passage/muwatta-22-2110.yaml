label: { ar: "الموطأ 2110 — مالك: الأمر عندنا أن الذي يجلد الحد ثم تاب وأصلح تجوز شهادته، وهو أحب ما سمعت إلي، لقول الله في قاذف المحصنات، ويستشهد مالك بآية في سورة النور في ذلك", en: "Muwatta 2110" }
summary:
  ar: "قال مالك: وذلك الأمر عندنا، وذلك لقول الله تبارك وتعالى في الذين يرمون المحصنات ثم لم يأتوا بأربعة شهداء فاجلدوهم ثمانين جلدة ولا تقبلوا لهم شهادة أبدا، إلا الذين تابوا من بعد ذلك وأصلحوا. قال مالك: فالأمر الذي لا اختلاف فيه عندنا أن الذي يجلد الحد ثم تاب وأصلح تجوز شهادته، وهو أحب ما سمعت إلي في ذلك. {cite:muwatta-maruf-1997 p.262} {cite:muwatta-maruf-1997 p.263}"
