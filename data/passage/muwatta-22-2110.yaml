label: { ar: "الموطأ 2110 — مالك: الأمر عندنا أن الذي يجلد الحد ثم تاب وأصلح تجوز شهادته، وهو أحب ما سمعت إلي، لقول الله في قاذف المحصنات، ويستشهد مالك بآية في سورة النور في ذلك", en: "Muwatta 2110", es: "Muwatta 2110", fr: "Muwatta 2110", ur: "موطا 2110", tr: "El-Muvatta 2110 — Malik: Bizde yerleşik uygulama şudur ki, belirlenen ceza için kırbaçlanan ve sonra tövbe edip ıslah olan kimsenin şahitliği geçerlidir. Bu, iffetli kadınları iftiraya uğratan kişi hakkında Allah'ın sözüne dayanarak duyduğum en tercih edilebilir görüştür. Malik, bunu desteklemek için Nur Suresi'nden bir ayet zikreder.", id: "Al-Muwatta 2110 — Malik: Kebiasaan yang telah mapan di antara kita adalah bahwa orang yang dicambuk sebagai hukuman yang telah ditentukan, kemudian bertaubat dan memperbaiki diri, maka kesaksiannya sah. Ini adalah pendapat yang paling utama yang pernah saya dengar, berdasarkan firman Allah mengenai orang yang menuduh wanita suci secara palsu. Malik mengutip sebuah ayat dalam Surat An-Nur sebagai pendukung pendapat ini." }
summary:
  ar: "قال مالك: وذلك الأمر عندنا، وذلك لقول الله تبارك وتعالى في الذين يرمون المحصنات ثم لم يأتوا بأربعة شهداء فاجلدوهم ثمانين جلدة ولا تقبلوا لهم شهادة أبدا، إلا الذين تابوا من بعد ذلك وأصلحوا. قال مالك: فالأمر الذي لا اختلاف فيه عندنا أن الذي يجلد الحد ثم تاب وأصلح تجوز شهادته، وهو أحب ما سمعت إلي في ذلك. {cite:muwatta-maruf-1997 p.262} {cite:muwatta-maruf-1997 p.263}"
  tr: "Malik şöyle dedi: Bu, Allah'ın (Allah'ın mübarek ve yüce olan) iffetli kadınları suçlayan ve sonra dört şahit getiremeyenler hakkındaki şu sözüne dayanarak aramızda yerleşik uygulamadır: \"Onları seksen kırbaçlayın ve şahitliklerini asla kabul etmeyin, ancak sonradan tövbe edip ıslah olanlar müstesna.\" Malik şöyle dedi: Aramızda ihtilaf olmayan konu şudur ki, belirlenen cezayı çekmek üzere kırbaçlanan ve sonradan tövbe edip ıslah olanın şahitliği geçerlidir ve bu, bu konuda duyduğum en tercih edilebilir görüştür. {cite:muwatta-maruf-1997 s.262} {cite:muwatta-maruf-1997 s.263}"
  id: "Malik berkata: Ini adalah praktik yang telah mapan di antara kita, berdasarkan firman Allah, Maha Mulia dan Maha Tinggi, mengenai orang-orang yang menuduh wanita-wanita suci dan kemudian gagal menghadirkan empat saksi: “Cambuklah mereka delapan puluh kali dan jangan pernah menerima kesaksian mereka, kecuali bagi mereka yang kemudian bertobat dan memperbaiki diri.” Malik berkata: Hal yang tidak ada perbedaan pendapat di antara kita adalah bahwa kesaksian orang yang dicambuk sebagai hukuman yang telah ditentukan dan kemudian bertobat dan memperbaiki diri dapat diterima, dan ini adalah pendapat yang paling baik yang pernah saya dengar mengenai masalah ini. {cite:muwatta-maruf-1997 p.262} {cite:muwatta-maruf-1997 p.263}"
