label: { ar: "الموطأ 192 — مالك: لا بأس بالأذان راكباً", en: "Muwatta 192", es: "Muwatta 192", fr: "Muwatta 192", ur: "موطا 192", tr: "Al-Muwatta 192 — Malik: Binek üzerinde ezan okumakta bir sakınca yoktur.", id: "Al-Muwatta 192 — Malik: Tidak ada salahnya mengumandangkan azan sambil berkendara" }
summary:
  ar: "قول لمالك يرويه يحيى سماعاً في باب النداء في السفر وعلى غير وضوء: لا بأس أن يؤذن الرجل وهو راكب. ويذكر المحقق أن أبا مصعب رواه عن مالك، ويحيل على ابن أبي شيبة والبيهقي في أذان الراكب. {cite:muwatta-maruf-1997 p.122}"
  tr: "Yahya'nın Malik'ten rivayet ettiği, Malik'e atfedilen bir ifade, yolculuk halindeyken ve abdest almadan ezan okuma bölümünde yer almaktadır: Bir erkeğin binek üzerindeyken ezan okuması caizdir. Editör, bu ifadenin Ebu Mus'ab tarafından Malik'ten rivayet edildiğini belirtmekte ve binek ezanıyla ilgili olarak İbn Abi Şeybe ve el-Beyhaki'ye atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.122}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dari Malik, dalam bab tentang mengumandangkan azan saat bepergian dan tanpa wudhu: Diperbolehkan bagi seorang laki-laki untuk mengumandangkan azan saat berkendara. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan merujuk kepada Ibn Abi Shaybah dan al-Bayhaqi mengenai azan pengendara. {cite:muwatta-maruf-1997 p.122}"
