text: "… عَلَيْهِ حَتَّى يُمْسِىَ، وَإِنْ مَاتَ في ذَلِكَ الْيَوْمِ مَاتَ شَهِيدًا، وَمَنْ قَالَهَا حِينَ يُمْسِى كانَ بِتلكَ المَنْزِلَةِ. قَالَ أَبُو عِيسَى : هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ لَا نَعْرِفُهُ إِلَّا مِنْ هَذَا الْوَجْهِ. المعجم - باب ما جاء كيف كانت قراءة النبي …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 657، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 657, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 657 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 1, pág. 657, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Jami' al-Tirmidhi, volume 1, page 657, mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Cami' el-Tirmizi'nin 1. cildinin 657. sayfasından, Kur'an'ın farklı okunuşlarını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 1, halaman 657, yang menyebutkan berbagai macam bacaan Al-Quran; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
