text: "في المدح والهجو والمجون والفُكاهات والمُلَح والخمر والمُعاقرة والنّدمان والقِيان... الخ فاستدعاه المنصورُ وقال: أين حُبِستَ يا أبا دُلامة؟ قال: مع الدَّجاج، قال: فما كنتَ تصنعُ؟ وقال: أُقوقى معهم إلى الصّباح، فضحك وخلّى سبيلَه وأمر له بجائزة. فلما خرج قال …"
