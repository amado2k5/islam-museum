text: "… بين الناس وليس بغريب. وبالجملة فقد خرجنا عن المقصود، لكن الكلام اتصل بعضه ببعض فانتشر. وتوفي ابن صابر المذكور في ليلة الثامن والعشرين من صفر من سنة ست وعشرين وستمائة ببغدادا، ودفن يوم الجمعة غربيها بالمقبرة الجديدة، بباب المشهد المعروف …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 44، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 44, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 44 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de Wafayat al-A'yan de Ibn Khallikan, volumen 1, pág. 44, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de la Wafayat al-A'yan d'Ibn Khallikan (tome 1, p. 44) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "İbn Hallikan'ın *Vafayat el-A'yan* adlı eserinin resimli 1. cildinin 44. sayfasında bir defin, bir mezar ve bir türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Wafayat al-A'yan* karya Ibn Khallikan, jilid 1 bergambar, halaman 44, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
