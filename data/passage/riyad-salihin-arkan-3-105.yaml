text: "… النى الِمِ قال : ثَلاثُ مَنْ كُنَّ فيه وَجَدَ بهنَّ حَلاوَةَ الإِيَمَانِ : أَنْ يَكُونَ اللَّهُ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِسمًّا، سواهُما، وأَنْ يُحِبَّ المَرْءَ لَا يُحِبْدَ إِلاَّ للَّهِ، وَأَنَّ يَكْرَه أَنْ يَعُودَ فى الكُفْرِ بَعْدَ أَنْ أَنقَدَةُ اللَّهُ مِنْهُ، كَمَا …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 105، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 105, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 105 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
