label: { ar: "الموطأ 62 — أنس يتوضأ مما مست النار فيُنكر عليه: أعراقية؟", en: "Muwatta 62", es: "Muwatta 62", fr: "Muwatta 62", ur: "موطا 62", tr: "El-Muvatta 62 — Enes, ateşe değmiş bir yiyecek yedikten sonra abdest alıyor ve kendisine: \"Bu Irak malı mı?\" diye soruluyor.", id: "Al-Muwatta 62 — Anas berwudhu setelah makan makanan yang telah disentuh api, dan dia ditanya: Apakah itu makanan Irak?" }
text: "ما هذا يا أنس؟ أعراقية؟ فقال أنس: ليتني لم أفعل"
summary:
  ar: "يرويه مالك عن موسى بن عقبة عن عبد الرحمن بن زيد الأنصاري، في باب ترك الوضوء مما مست النار: قدم أنس بن مالك من العراق فدخل عليه أبو طلحة وأبي بن كعب فقرّب لهما طعاماً مسته النار فأكلوا، فقام أنس يتوضأ، فأنكرا عليه وسألاه أهي عادة عراقية، فقال: ليتني لم أفعل، وقاما فصليا ولم يتوضآ. ويبين المحقق أن اسم الراوي في بعض النسخ «عبد الرحمن بن يزيد» وأن الصواب «زيد» كما في روايات الموطأ الأخرى وتعجيل المنفعة، وأن أحمد أخرجه مرفوعاً بإسناد صحيح من طريق ابن المبارك عن موسى بن عقبة وفيه زيادة قولهما: أتتوضأ من الطيبات؟ لم يتوضأ منه من هو خير منك. {cite:muwatta-maruf-1997 p.64}"
  tr: "Malik, Musa ibn Ukba'dan, o da Abdülrahman ibn Zeyd el-Ensari'den rivayetle, ateşte pişirilmiş yemek yedikten sonra abdest almamak bölümünde şöyle anlatmaktadır: Enes ibn Malik Irak'tan geldi ve Ebu Talha ile Ubeyy ibn Ka'b onu ziyaret etti. Onlara ateşte pişirilmiş yemek ikram etti ve yediler. Enes abdest almak için ayağa kalktı, ancak onlar bunu onaylamadılar ve bunun Irak'ta bir gelenek olup olmadığını sordular. Enes, \"Keşke bunu yapmasaydım\" diye cevap verdi. Bunun üzerine onlar da ayağa kalkıp abdest almadan namaz kıldılar. Editör, bazı rivayetlerde ravi adının \"Abdülrahman ibn Yazid\" olduğunu, ancak doğru ismin, el-Muvatta' ve Ta'jil el-Manfa'a'nın diğer rivayetlerinde olduğu gibi \"Zeyd\" olduğunu açıklığa kavuşturmaktadır. Ahmed de bunu İbn el-Mübarek'ten Musa ibn Ukba'dan sahih bir rivayet zinciriyle aktarmış ve şu ifadeyi de eklemiştir: \"Güzel şeyler yedikten sonra abdest alıyor musunuz? Sizden daha hayırlı kimse güzel şeyler yedikten sonra abdest almamıştır.\" {cite:muwatta-maruf-1997 s.64}"
  id: "Diriwayatkan oleh Malik dari Musa ibn Uqba dari Abd al-Rahman ibn Zayd al-Ansari, dalam bab tentang tidak berwudhu setelah makan makanan yang dimasak di atas api: Anas ibn Malik datang dari Irak, dan Abu Talha dan Ubayy ibn Ka'b mengunjunginya. Ia menawarkan mereka makanan yang dimasak di atas api, dan mereka makan. Anas kemudian berdiri untuk berwudhu, tetapi mereka tidak menyetujuinya dan bertanya apakah itu kebiasaan Irak. Ia menjawab, \"Seandainya aku tidak melakukan itu.\" Kemudian mereka berdiri dan shalat tanpa berwudhu. Editor mengklarifikasi bahwa nama perawi dalam beberapa versi adalah \"Abd al-Rahman ibn Yazid,\" tetapi nama yang benar adalah \"Zayd,\" seperti dalam riwayat lain dari al-Muwatta' dan Ta'jil al-Manfa'a. Ahmad juga meriwayatkan hadits ini dengan sanad yang sahih dari Ibnu al-Mubarak atas otoritas Musa bin Uqba, dan hadits ini menambahkan pernyataan mereka: \"Apakah kamu berwudhu setelah makan makanan yang enak? Tidak ada seorang pun yang lebih baik darimu berwudhu setelah makan makanan tersebut.\" {cite:muwatta-maruf-1997 p.64}"
