label: { ar: "الموطأ 62 — أنس يتوضأ مما مست النار فيُنكر عليه: أعراقية؟", en: "Muwatta 62" }
text: "ما هذا يا أنس؟ أعراقية؟ فقال أنس: ليتني لم أفعل"
summary:
  ar: "يرويه مالك عن موسى بن عقبة عن عبد الرحمن بن زيد الأنصاري، في باب ترك الوضوء مما مست النار: قدم أنس بن مالك من العراق فدخل عليه أبو طلحة وأبي بن كعب فقرّب لهما طعاماً مسته النار فأكلوا، فقام أنس يتوضأ، فأنكرا عليه وسألاه أهي عادة عراقية، فقال: ليتني لم أفعل، وقاما فصليا ولم يتوضآ. ويبين المحقق أن اسم الراوي في بعض النسخ «عبد الرحمن بن يزيد» وأن الصواب «زيد» كما في روايات الموطأ الأخرى وتعجيل المنفعة، وأن أحمد أخرجه مرفوعاً بإسناد صحيح من طريق ابن المبارك عن موسى بن عقبة وفيه زيادة قولهما: أتتوضأ من الطيبات؟ لم يتوضأ منه من هو خير منك. {cite:muwatta-maruf-1997 p.64}"
