text: "… الهندي، وأسود خفيف وهو الصيني، وأحمر رزين. هو شجر كالعود، وقد ورد ذكره في الحديث النبوي الشريف: خير ما تداويتم به الحجامة، والقُسْط البحري، وقوله وَلِفِ: عليكم بهذا العود الهندي فإن فيه سبعة أشفية، منها ذات الجنب. التداوي بالأعشاب والنباتات …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 46، يذكر الحجامة، والقسط والعود الهندي، والقسط، وأسماء الأمراض، والتداوي، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 46, that mentions cupping, costus (Indian aloeswood), costus, named diseases, seeking treatment, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 46 کا اقتباس جس میں حجامہ، قسط ہندی، قسط، بیماریوں کے نام، علاج کرانا، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 46, que menciona la ventosaterapia, el costus (árbol de aloe indio), el costus, enfermedades específicas, la búsqueda de tratamiento y la curación; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 46, qui mentionne la ventousothérapie, le costus (bois d'aloès indien), le costus, les maladies nommées, la recherche de traitement, la guérison; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 46. sayfasından bir bölüm; hacamat, kostus, Hint öd ağacı, kostus, hastalık isimleri, tedavi ve iyileşmeden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 46, yang menyebutkan bekam, costus, kayu gaharu India, costus, nama-nama penyakit, pengobatan, dan penyembuhan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
