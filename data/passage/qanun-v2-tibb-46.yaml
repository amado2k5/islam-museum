text: "… الهندي، وأسود خفيف وهو الصيني، وأحمر رزين. هو شجر كالعود، وقد ورد ذكره في الحديث النبوي الشريف: خير ما تداويتم به الحجامة، والقُسْط البحري، وقوله وَلِفِ: عليكم بهذا العود الهندي فإن فيه سبعة أشفية، منها ذات الجنب. التداوي بالأعشاب والنباتات …"
summary:
