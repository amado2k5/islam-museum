text: "… من ذلك. وقال ديمقراطيس: إنه قد يشفى بهذا العلاج جميع الأدواء التي تحتاج لها إلى الأدوية المحمرة أعني ضماد الخردل والتافسيا ونحوه وهو يزعم أنه قد أبرأ به الصداع العتيق. أرخيجانس يذكره للطحال وقد ذكرناه. قال في العلل والأعراض: إن …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1835، يذكر أسماء الأمراض، والبيمارستان وصناعة الطب، والعلاج، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والداء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1835, that mentions named diseases, the hospital and the medical craft, treatment, the organs of the body, surgery, circumcision and splints, the drug, the disease and its remedy, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1835 کا اقتباس جس میں بیماریوں کے نام، بیمارستان، علاج، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، بیماری، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 1835, que menciona enfermedades específicas, el hospital y la práctica médica, el tratamiento, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el medicamento, la enfermedad y su remedio, la curación; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 1835, qui mentionne les maladies nommées, l'hôpital et l'art médical, le traitement, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament, la maladie et son remède, la guérison; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinden, s. 1835'te yer alan, hastalıkların, hastanenin, tıp mesleğinin, tedavinin, vücut parçalarının, ameliyatın, sünnetin, atellerin, tıbbın, hastalığın ve iyileşmenin adlarını içeren bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 1835, yang menyebutkan nama-nama penyakit, rumah sakit, profesi medis, pengobatan, bagian tubuh, pembedahan, sunat, bidai, obat-obatan, penyakit, dan penyembuhan; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
