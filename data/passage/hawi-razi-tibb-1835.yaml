text: "… من ذلك. وقال ديمقراطيس: إنه قد يشفى بهذا العلاج جميع الأدواء التي تحتاج لها إلى الأدوية المحمرة أعني ضماد الخردل والتافسيا ونحوه وهو يزعم أنه قد أبرأ به الصداع العتيق. أرخيجانس يذكره للطحال وقد ذكرناه. قال في العلل والأعراض: إن …"
summary:
