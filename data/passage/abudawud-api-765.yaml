label: { ar: "سنن أبي داود 765 — الأب والأبوة", en: "Sunan Abi Dawud 765 — the father and fatherhood", ur: "سنن ابی داؤد 765 — باپ اور والدیت" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ مِسْعَرٍ، عَنْ عَمْرِو بْنِ مُرَّةَ، عَنْ رَجُلٍ، عَنْ نَافِعِ بْنِ جُبَيْرٍ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ فِي التَّطَوُّعِ ذَكَرَ نَحْوَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 765، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 765 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 765، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
