label: { ar: "صحيح البخاري 4369 — الشهادة والصلاة والزكاة، ركن من أركان الإيمان", en: "Sahih al-Bukhari 4369 — the testimony, the prayer and the zakat; one of the articles of faith", ur: "صحیح بخاری 4369 — شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن" }
text: "… بَيْنَنَا وَبَيْنَكَ كُفَّارُ مُضَرَ، فَلَسْنَا نَخْلُصُ إِلَيْكَ إِلاَّ فِي شَهْرٍ حَرَامٍ، فَمُرْنَا بِأَشْيَاءَ نَأْخُذُ بِهَا وَنَدْعُو إِلَيْهَا مَنْ وَرَاءَنَا. قَالَ \" آمُرُكُمْ بِأَرْبَعٍ وَأَنْهَاكُمْ عَنْ أَرْبَعٍ، الإِيمَانِ بِاللَّهِ شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ ـ وَعَقَدَ وَاحِدَةً ـ وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ، وَأَنْ تُؤَدُّوا لِلَّهِ خُمْسَ مَا غَنِمْتُمْ، وَأَنْهَاكُمْ عَنِ الدُّبَّاءِ، وَالنَّقِيرِ وَالْحَنْتَمِ وَالْمُزَفَّتِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4369، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 4369 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 4369، جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
