label: { ar: "الموطأ 2835 — أم سلمة تسأل: أنهلك وفينا الصالحون؟ فيقول النبي نعم إذا كثر الخبث", en: "Muwatta 2835" }
summary:
  ar: "بلغ مالكا أن أم سلمة زوج النبي قالت: يا رسول الله، أنهلك وفينا الصالحون؟ فقال رسول الله: نعم، إذا كثر الخبث. ويذكر المحقق قول ابن عبد البر أن هذا اللفظ لا يعرف لأم سلمة بهذه الصيغة إلا من وجه ليس بالقوي، وأنه معروف محفوظ لزينب بنت جحش عن النبي. {cite:muwatta-maruf-1997 p.590}"
