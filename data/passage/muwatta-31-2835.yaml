label: { ar: "الموطأ 2835 — أم سلمة تسأل: أنهلك وفينا الصالحون؟ فيقول النبي نعم إذا كثر الخبث", en: "Muwatta 2835", es: "Muwatta 2835", fr: "Muwatta 2835", ur: "موطا 2835", tr: "El-Muvatta 2835 — Ümmü Seleme soruyor: Aramızda salih insanlar olsa bile helak olur muyuz? Peygamber şöyle buyuruyor: Evet, kötülük yaygınlaşırsa.", id: "Al-Muwatta 2835 — Umm Salamah bertanya: Akankah kita binasa meskipun ada orang-orang saleh di antara kita? Nabi menjawab: Ya, jika kejahatan meluas." }
summary:
  ar: "بلغ مالكا أن أم سلمة زوج النبي قالت: يا رسول الله، أنهلك وفينا الصالحون؟ فقال رسول الله: نعم، إذا كثر الخبث. ويذكر المحقق قول ابن عبد البر أن هذا اللفظ لا يعرف لأم سلمة بهذه الصيغة إلا من وجه ليس بالقوي، وأنه معروف محفوظ لزينب بنت جحش عن النبي. {cite:muwatta-maruf-1997 p.590}"
  tr: "Malik, Peygamberin eşi Ümmü Seleme'nin şöyle dediğini rivayet etmiştir: \"Ey Allah'ın Resulü, aramızda salih insanlar varken helak mi olacağız?\" Allah'ın Resulü şöyle cevap verdi: \"Evet, kötülük yaygınlaştığı zaman.\" Araştırmacı, İbn Abdül-Barr'ın bu sözün tam olarak bu şekilde Ümmü Seleme tarafından bu isnadla söylendiğinin, ancak zayıf bir rivayet zinciriyle bilindiğini ve bunun Peygamberden rivayet edilen Zeynep bint Cahş'ın bir sözü olarak bilindiğini ve korunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.590}"
  id: "Malik meriwayatkan bahwa Umm Salamah, istri Nabi, berkata: \"Wahai Rasulullah, akankah kita binasa sementara masih ada orang-orang saleh di antara kita?\" Rasulullah menjawab: \"Ya, ketika kejahatan merajalela.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa redaksi ini tidak diketahui diriwayatkan oleh Umm Salamah dalam bentuk persis seperti ini kecuali melalui sanad yang lemah, dan bahwa itu dikenal luas dan terpelihara sebagai ucapan Zaynab bint Jahsh atas otoritas Nabi. {cite:muwatta-maruf-1997 p.590}"
