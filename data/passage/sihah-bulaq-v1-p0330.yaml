text: |-
  ختعر)
  ٢١١
  وقول الكميت عملت الى ممورتها-ين غرغرا يريد بيساض زبدالقدرويقال -ور
  عين بعيرك أى عجر -وامابكى وحوّر انلخبزة اذاهيأها وأدراها ليضعها فى الملة والمحورعود
  الخبازوالمحور العود الذى تدور عليه البكرة وربما كانمن حسديد والحوارولد الساقة
  ولا يزال حوارا-تى :قصل فاذافصل عن أمّه فهو فصيل وثلاثة أحورة والكشير حيرار
  وحوران أيضاوحوران بالفتح. وضع بالشام والحاورة الجاوية والتحاور التجاوب ويقال
  كلتمفا أحارالى جوابا ومارجع الىّ حويراولا حويرة ولامحورة ولا حوارا أى ماردّ جوابا
  واستهاره أى استنطقه (حير حاريحارحيرة وحيرا أى تحير فى أمره فهو حيران وقوم
  حيارى وحيرته أنا فتحير وغحير الماء اجتمع ودار والحائر مجتمع الماه وجعه حيران وحوران
  ورجل ساتربانوا ذا الم ينجه لشئ واستهير الشراب أسيغ قال العجاج
  تسمع للجرع اذا استحيرا • للمابى أجوافها خريرا
  وتعير المكان بالماء واستهاراذا امتلاً ومنه قول أبى ذؤْيب
  نقضى شيابى واستهار شبابها أى زدد فيها واجتمع والمخبر مبحاب ثقبل متردد لبره
  ريح نسوقه قال الشاعر يمدح رجلا
  كان أصحابد بالتفر عطرهم • من مستعير غزيرصويه ديم
  والحيريالفع شبه الحظيرة أوالحى ومنه الحير بكر بلاء والحيرة بالكسر مدينة بقرب الكوفة
  والنسبة اليهاحيرى" وسارى أيضاعلى غير قياس كاً نه-م قلبوا اليا ألفاويقال لا آميك
  حبرى دهر أى أبدا
  سل الخاء ب الخبر المزادة العظيمة والمع خبور وقشبه بها الناقة فى غزرها
  فتسمى خبراء والخير بالتصريك واحد الاخبار وأخبرنه بكذا وخبرته بمعنى والاستخبار السؤال
  عن الحبر وكذلاك التغير والمخبر خلاف المنظر وكذلات الخبرة والمخبرة أيضابضم البساء وهو نقيض
  المرآة وانلخبراه القاع ينيت السدر والجم-ع الخبارى والخبارى مشل العصارى والصحارى
  والخبراوات بقال خبر الموضع بالسكسر فهوخبر وأرض خبرة وخبراء والخبار الارض الرخوة
  ذات ايجرة ويقال أيضا من أين خيرت هذا الامر أى من أين علمت والاسم الخبر بالضم وهو
  العلم بالشىْ والخبيرااعالم والخبير الاكار ومنه الخابرة وهى المزارعسة ببعض ما يخرج من
  الارض وهو الخير أيضا بالكسر والخبير التبات وفى الحسديث فستغلب الخبير أى نقطع
  الثبات ونأكله والخبسير الوبر قال أبو النيم
  حق اذا ماطال من خبيرها وقال
  أبو عبيد الخبيرز يدافواه الابل وقوله-م لاخبرن خبرك أى لاعلنّ علمك تقول منه خبرته
  خبره خبرا بالضم وخيرة بالسكسر اذا بلوته واختبرته يقال ص-دق انخير انخير وأماقول
  أبى الدرداء وجدت الناس اخير تقلهم فيريد أنك اذا خبرتهم قليتهم فأخرج الكلام على لفظ
  الامرومعناه انلخبر وانلخابورموضع بناحية الشام وخييرموضع بالجاز يقال عليه الديرى
  وحى خييرا والخبرة بالضم النصيب تأخذه من سمك أ ولحم حكلء أبو عبيد يقال تخبرواخبرة
  اذا اشترواشاة فذبوها واقتسموالهها ⁦(ختر)⁩ انختر الغسدرية ال ختره فه وختار
  ( ختعر انفيتعور كل شيء لا يدوم على حلة واحدة ويضمصل كالسراب وكالذى ينزل من
  الذى فى الجامع الصغيرا :بر تقله
  وقال بعض شراحه الهاءللسكته
  وليست ضميرا قاله نصر
