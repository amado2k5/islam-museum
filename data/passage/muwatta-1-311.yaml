text: "الصلاة، الصلاة"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن أبيه أسلم مولى عمر، في باب ما جاء في صلاة الليل: كان عمر بن الخطاب يصلي من الليل ما شاء الله، حتى إذا كان آخر الليل أيقظ أهله للصلاة يقول لهم: الصلاة الصلاة، ثم يتلو الآية 132 من سورة طه التي تأمر النبي أن يأمر أهله بالصلاة ويصطبر عليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن، وأن الطبري أخرجه في تفسيره من طريق هشام بن سعد عن زيد بن أسلم. {cite:muwatta-maruf-1997 p.175}"
