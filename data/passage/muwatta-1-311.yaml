text: "الصلاة، الصلاة"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن أبيه أسلم مولى عمر، في باب ما جاء في صلاة الليل: كان عمر بن الخطاب يصلي من الليل ما شاء الله، حتى إذا كان آخر الليل أيقظ أهله للصلاة يقول لهم: الصلاة الصلاة، ثم يتلو الآية 132 من سورة طه التي تأمر النبي أن يأمر أهله بالصلاة ويصطبر عليها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن، وأن الطبري أخرجه في تفسيره من طريق هشام بن سعد عن زيد بن أسلم. {cite:muwatta-maruf-1997 p.175}"
  tr: "Malik'in, Ömer'in azatlı kölesi Aslam'dan rivayet ettiği, gece namazı hakkında rivayet edilenler bölümünde yer alan bir rivayete göre: Ömer ibn el-Hattab, Allah'ın dilediği kadar gece namazı kılardı; gecenin sonuna doğru ise ailesini namaz için uyandırır, onlara \"Namaz! Namaz!\" derdi. Sonra da Peygamber'e ailesine namaz kılmalarını ve namazda sebat etmelerini emreden Ta-Ha Suresi'nin 132. ayetini okurdu. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd, Abdül-Razzak ve Muhammed ibn el-Hasan tarafından nakledildiğini ve Taberi'nin de Hişam ibn Sa'd'dan, o da Zeyd ibn Aslam'dan rivayet ettiğine dayanarak tefsirinde yer aldığını belirtmektedir. {cite:muwatta-maruf-1997 s.175}"
  id: "Sebuah riwayat yang dinabikan oleh Malik atas otoritas Zayd ibn Aslam, atas otoritas ayahnya Aslam, budak yang dibebaskan oleh Umar, dalam bab tentang apa yang telah diriwayatkan mengenai salat malam: Umar ibn al-Khattab biasa salat malam sebanyak yang dikehendaki Allah, hingga menjelang akhir malam, ia membangunkan keluarganya untuk salat, seraya berkata kepada mereka, \"Salat! Salat!\" Kemudian ia membaca ayat 132 Surah Ta-Ha, yang memerintahkan Nabi untuk memerintahkan keluarganya untuk salat dan tekun dalam melaksanakannya. Peneliti menyebutkan bahwa riwayat ini dinabikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, Abd al-Razzaq, dan Muhammad ibn al-Hasan, dan bahwa al-Tabari memasukkannya dalam komentarnya atas otoritas Hisham ibn Sa'd, atas otoritas Zayd ibn Aslam. {cite:muwatta-maruf-1997 p.175}"
