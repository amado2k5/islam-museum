text: "… المبارك، أخبرنا أحمد بن بالمدينة وكبّر عليه أربعاً البخاري، مسلم علي الخزاز الكوفي، أخبرنا محمد بن عمران بن أبي، أحمد ؛ وأصحمة اسمه، والنجاشي ليلى، حدّثنا سعيد بن عبيدالله بن الوليد الرصافي، لقب له ولملوك الحبشة، مثل كسرى للفرس، وقيصر …"
