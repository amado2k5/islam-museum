text: "… من الدنيا إلا كزاد الراكب ورأي خدماً فقال لمن هذا الخدم ؟ فقالوا خدمك وخدم امرأتك. فقال : ما بهذا أوصانى خليلى، أوصانى خايلى أن لا أمسك إلا ما أنكح، أو أنكح، فإن فعلت فبغين كان على مثل أوزارهن من …"
summary:
