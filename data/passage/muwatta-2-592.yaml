label: { ar: "الموطأ 592 — أم عطية في غسل ابنة النبي: اغسلنها ثلاثاً أو خمساً أو أكثر بماء وسدر", en: "Muwatta 592" }
text: "اغسلنها ثلاثاً، أو خمساً أو أكثر من ذلك، بماء وسدر، واجعلن في الآخرة كافوراً، أو شيئاً من كافور، فإذا فرغتن فآذنني"
summary:
  ar: "يرويه مالك عن أيوب بن أبي تميمة السختياني عن محمد بن سيرين عن أم عطية الأنصارية، قالت: دخل علينا النبي حين توفيت ابنته، فأمرنا أن نغسلها ثلاثاً أو خمساً أو أكثر بماء وسدر، وأن نجعل في الغسلة الأخيرة كافوراً أو شيئاً منه، وأن نؤذنه إذا فرغنا. قالت: فلما فرغنا آذناه، فأعطانا حقوه، أي إزاره، وقال: أشعرنها إياه. ويذكر المحقق أن عبارة «إن رأيتن ذلك» التي في نسخة م وغيرها لا تصح في رواية يحيى، نقلاً عن ابن عبد البر (التمهيد 1/372) أن كل من روى الحديث عن مالك يقولها وسقطت ليحيى، وأنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسماعيل بن أبي أويس عند البخاري (1253)، والقعنبي عند أبي داود (3142)، وقتيبة عند مسلم (3/47)، والشافعي. {cite:muwatta-maruf-1997 p.305} {cite:muwatta-maruf-1997 p.306}"
