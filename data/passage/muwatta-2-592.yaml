label: { ar: "الموطأ 592 — أم عطية في غسل ابنة النبي: اغسلنها ثلاثاً أو خمساً أو أكثر بماء وسدر", en: "Muwatta 592", es: "Muwatta 592", fr: "Muwatta 592", ur: "موطا 592", tr: "El-Muvatta 592 — Ümmü Atiyye, Peygamberin kızının yıkanması hakkında: Onu üç, beş veya daha fazla defa su ve lotus yapraklarıyla yıkayın.", id: "Al-Muwatta 592 — Umm Atiyyah tentang memandikan putri Nabi: Mandikan dia tiga, lima, atau lebih kali dengan air dan daun teratai." }
text: "اغسلنها ثلاثاً، أو خمساً أو أكثر من ذلك، بماء وسدر، واجعلن في الآخرة كافوراً، أو شيئاً من كافور، فإذا فرغتن فآذنني"
summary:
  ar: "يرويه مالك عن أيوب بن أبي تميمة السختياني عن محمد بن سيرين عن أم عطية الأنصارية، قالت: دخل علينا النبي حين توفيت ابنته، فأمرنا أن نغسلها ثلاثاً أو خمساً أو أكثر بماء وسدر، وأن نجعل في الغسلة الأخيرة كافوراً أو شيئاً منه، وأن نؤذنه إذا فرغنا. قالت: فلما فرغنا آذناه، فأعطانا حقوه، أي إزاره، وقال: أشعرنها إياه. ويذكر المحقق أن عبارة «إن رأيتن ذلك» التي في نسخة م وغيرها لا تصح في رواية يحيى، نقلاً عن ابن عبد البر ⁦(التمهيد 1/372)⁩ أن كل من روى الحديث عن مالك يقولها وسقطت ليحيى، وأنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسماعيل بن أبي أويس عند البخاري (1253)، والقعنبي عند أبي داود (3142)، وقتيبة عند مسلم (3/47)، والشافعي. {cite:muwatta-maruf-1997 p.305} {cite:muwatta-maruf-1997 p.306}"
  tr: "Malik, Ayyub ibn Abi Tamimah al-Sakhtiyani'den, o da Muhammed ibn Sirin'den, o da Ümmü Atiyye al-Ansariyye'den rivayetle şöyle nakletmiştir: “Peygamberimiz kızı vefat ettiğinde yanımıza geldi ve bize onu üç, beş veya daha fazla defa su ve lotus yapraklarıyla yıkamamızı, son yıkamaya kafur veya benzeri bir şey eklememizi ve işimiz bittiğinde kendisine haber vermemizi emretti.” Ümmü Atiyye şöyle dedi: “İşimiz bittiğinde ona haber verdik ve bize bel örtüsünü verdi ve ‘Onu bununla kefenleyin’ dedi.” Editör, M el yazmasında ve diğerlerinde bulunan “uygun görürseniz” ifadesinin, İbn Abd al-Barr'ın (al-Tamhid 1/372) Malik'ten hadis rivayet eden herkesin bu ifadeyi kullandığını, Yahya'nın ise bunu atladığını belirterek, Yahya'nın rivayetinde doğru olmadığını belirtmektedir. Ayrıca Ebu Mus'ab tarafından Malik'ten, el-Beğavî tarafından da onun isnadından, el-Buhari'de (1253) İsmail ibn Ebi Uveys, Ebu Davud'da (3142) el-Ka'nabi, Müslim'de Kuteybe (3/47) ve el-Şafi'i tarafından rivayet edilmiştir. {cite:muwatta-maruf-1997 s.305} {cite:muwatta-maruf-1997 s.306}"
  id: "Malik meriwayatkannya dari Ayyub ibn Abi Tamimah al-Sakhtiyani, dari Muhammad ibn Sirin, dari Umm Atiyyah al-Ansariyyah, yang berkata: “Nabi datang kepada kami ketika putrinya meninggal, dan beliau memerintahkan kami untuk memandikannya tiga, lima, atau lebih kali dengan air dan daun teratai, dan menambahkan kapur barus atau sesuatu darinya pada pencucian terakhir, dan memberitahukan kepada beliau ketika kami telah selesai.” Dia berkata: “Ketika kami selesai, kami memberitahukan kepada beliau, dan beliau memberi kami kain pinggangnya, dan berkata: ‘Kafani dia dengan itu.’” Editor menyebutkan bahwa frasa “jika Anda merasa perlu” yang ada dalam manuskrip M dan lainnya tidak tepat dalam riwayat Yahya, berdasarkan pernyataan Ibn Abd al-Barr (al-Tamhid 1/372) bahwa setiap orang yang meriwayatkan hadits dari Malik memasukkannya, dan dihilangkan oleh Yahya. Diriwayatkan pula dari Malik oleh Abu Mus’ab, dan dari rantainya oleh al-Baghawi, Ismail bin Abi Uways dalam al-Bukhari (1253), al-Qa’nabi dalam Abu Dawud (3142), Qutaybah dalam Muslim (3/47), dan al-Syafi’i. {kutip:muwatta-maruf-1997 hal.305} {kutip:muwatta-maruf-1997 hal.306}"
