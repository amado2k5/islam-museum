label: { ar: "نوادر جحا الكبرى، ص 140 — «أنا أعلم أنك جئت من بيت العرس»", en: "Nawadir Juha al-Kubra, p. 140 — 'I Know You Came from the Wedding House'", ur: "نوادر جحا الکبریٰ، ص 140 — «میں جانتا ہوں تم شادی کے گھر سے آئی ہو»", fr: "Nawadir Juha al-Kubra, p. 140 — « Je sais que tu viens de la maison de noces »", es: "Nawadir Juha al-Kubra, p. 140 — «Sé que vienes de la casa de la boda»" }
text: "… أنا أعلم أنك جئت من بيت العرس جاء الشيخ مساء يوم إلى داره تعباً وذهنه مضطرب، فرأى امرأته مقطّبة الوجه بينما كان آتياً لينسى همومه، فقال لها: ماذا جرى؟ هل تكافئينني على اجتهادي من الصباح إلى المساء لتدبير أمورٍ معيشتنا …"
summary:
  ar: "عاد جحا إلى البيت منهكاً وبدت زوجته عابسة، فقالت إن طفل صديقة ماتت وإنها ذهبت لتعزيها، فقال جحا إنه يعلم أنها جاءت من بيت عرس. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  en: "Juha comes home worn out and his wife looks sour. She says a friend's child has died and she has been to comfort her, and Juha says he knows she came from a wedding. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  ur: "جحا تھکا ہارا گھر لوٹتا ہے اور اس کی بیوی کا چہرہ بجھا ہوا ہوتا ہے۔ وہ کہتی ہے کہ ایک سہیلی کا بچہ مر گیا ہے اور وہ اس کی تعزیت کو گئی تھی، تو جحا کہتا ہے کہ وہ جانتا ہے کہ وہ شادی کے گھر سے آئی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  fr: "Juha rentre chez lui épuisé et sa femme a l'air aigre. Elle dit que l'enfant d'une amie est mort et qu'elle est allée la consoler, et Juha dit qu'il sait qu'elle vient d'une noce. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
  es: "Juha vuelve a casa agotado y su esposa parece de mal humor. Ella dice que ha muerto el hijo de una amiga y que fue a consolarla, y Juha dice que sabe que viene de una boda. {cite:juha-nawadir-kubra-djuwaydi p. 140}"
