text: "… بعد الموت، والإيمان بالقدر خيره وشره، فالإيمان بهذه الأصول إجمالًا فرض عين على كل مكلف، أما الإيمان والعلم بهذه الأصول تفصيلًا فهو من فروض الكفاية؛ لكن من علم بشيء من علم التفصيل؛ وجب عليه الإيمان به، وهذا الكلام فيه تكرار؛ …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 240، يرد فيه ذكر الفرض، وفرض العين، وما وجب على كل مسلم، وفرض الكفاية، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 240, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), a duty laid on every Muslim, the communal obligation (fard kifaya), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 240 کا اقتباس جس میں فرض، فرضِ عین، جو ہر مسلمان پر لازم ہے، فرضِ کفایہ، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on the Tahawi creed de Ibn Abi al-'Izz, volume numérisé 1, p. 240, dont le texte mentionne l'obligatoire (fard), l'obligation individuelle (fard 'ayn), un devoir imposé à chaque musulman, l'obligation collective (fard kifaya), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on the Tahawi creed de Ibn Abi al-'Izz, volumen digitalizado 1, p. 240, cuyo texto menciona lo obligatorio (fard), la obligación individual (fard 'ayn), un deber impuesto a cada musulmán, la obligación colectiva (fard kifaya), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
