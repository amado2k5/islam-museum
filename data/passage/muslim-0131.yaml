label:
  ar: "مسلم 131 — إن الله كتب الحسنات والسيئات"
  en: "Muslim 131 — God has written good deeds and bad deeds"
  ur: "مسلم 131 — اللہ نے نیکیاں اور برائیاں لکھ دیں"
text: "إن الله كتب الحسنات والسيئات ثم بين ذلك فمن هم بحسنة فلم يعملها كتبها الله عنده حسنة كاملة وإن هم بها فعملها كتبها الله عز وجل عنده عشر حسنات إلى سبعمائة ضعف إلى أضعاف كثيرة وإن هم بسيئة فلم يعملها …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 131: إن الله كتب الحسنات والسيئات. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 131: God has written good deeds and bad deeds. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 131: اللہ نے نیکیاں اور برائیاں لکھ دیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
