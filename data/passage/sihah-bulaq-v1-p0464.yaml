text: |-
  ⁦(فصل الحا.)⁩
  ⁦(ذح)⁩
  ١٧٧
  كالمفدى من الغداة بقال ماترك فلانمن أييه.غدى ولامراحاذا أسبهه فى أجواله كلها
  والمروحة بالكسر ما يترقح بهاوالجمع المراوح والمروحة بالفتح المفازة قال الشاعر
  كأنّ را كيها غصن بمروحة • اذا تدلت بة أوشارب؟-ل
  والجمع المراومح وهي المواضع التى تخترق فيها الرياح وأروح الماء وغيره أى تغيرت ريه
  وأروحف الصيد أى وجدريحى وتقول أروحت من ف-لان طيبا وراح اليوم يراح اذا
  شتدت ريحه ويوم راح شديد الريح فاذا كان طيب الريح قالواديح بالتشديد ومكان ريح
  يضا وريح الغدير على مالم يسمّ فاعله اذا ضربته الريع فهومروح وقال يصف رمادا
  مكتئب اللون مروح مطور ومريح أيضا وقال يصف الدمع
  كانه غصن مريح مطور مثل مشوب ومنيب بى ع-لي شيب وراح الشجريراح مثل تروح
  أى تفطربورق قال الراعى
  وحالف المجد أقوام لهم ورق * راح العضاه بهم والعرق مدخول
  وراح فلان للمعروف يراح راحة اذا أخسذته له خفة وأريحية وراحت يده بكذا أى خفت له
  وقال يصف صائدا
  تراح يداه ؟حشورة ل:ل خواطى القداح عجاف النصال
  وراح الفرس براح راحة اذاتحصن أى صار فلا وراح الشييراحه ويريحه اذا وجدريه
  وقال الشاعر وماء وردت على زورة كشى السنتى يراح الشفيفا
  ومند الحديث من قتل نفسامعاهدة لم يرح رائحة الجنة جعله أبوعبيد من رحت الشئ أراحه
  وكان أبوع رويقول لم يرح يجعله من راح الشى يريحه والكسائى يقول لم يرح (١ ي علة من
  أرحت الشي فأنا أريحه والمعنى واحد وقال الاصعى لا أدرى هو ن رحت أو من أرحت
  وقولهم ماله سارحة ولا رائحة أى شئ وراحت الابل وأرحتها أنا اذارددتها الى المراح
  وقول الشاعر
  عاليت أنساعى وجلب الكور * على سراة راتح ممطور
  يريد بالرائح الثور الوحشى وهواذا مطر اشتتعدوه والمراوحة فى العملين أن يعمل هذامرّة
  وهذا مرّة وتقول رواح بين رجليه اذا قام على إحداهما مرّة وعلى الاخرى مرّة ويقال إنّ يديه
  التنراوحان بالمعروف والروح بالتحريك السعة قال الشاعر ٢ ف خ الشمائل فى أيمانهم روح
  والروح أيضاسعة فى الرجليز وهودون الفحج الاأن الاروح تتباعد صد ورقدميه وتتدانى
  عقباه وكل نعامة روحاء قال أبو ذؤيب
  وزفت الشول من برد العشى كما * زف النعام الى حفانه الروح
  وقصعة روساء أى قريبة القعر وطيرروح أى متفرّقة قال الاعنى
  ما تعيف اليوم فى الطير اروح * من غراب البين أوتيس سنح
  وقيل هى الرائحة الى مواضعها فيمع الرائح على روح مثل خادم وخدم وتروح الشجراذا
  تقطربورق يعداديارالصيف وتروّح النبت أى طال وتزوح الماءاذا أخذريح غيره لقريه
  منه وتروحت بالمروحة وتزوح أى راح من الرواح والارتياح النشاط وقولهم ارتاح اللّٰه
  لفلان أى رمه واستراح الجل من الراسة والمستراح الخرج واستروح اليه أى استنام
  والاريحى الواسع الخلق يقال أخذته الاريجية اذا ارتاح للندى والريحان نبت معروف
  قوله أريحية بفتح أوّله وثالمة
  بينهما رامساكنة وكذلك
  الاريى الآنى اه
  ١ ى يضم الياحمبنيا للمفعولغ
  لكن كبير بن هنديوم ذلكيموا
