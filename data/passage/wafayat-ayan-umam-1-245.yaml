text: "… وبعد هذا البيت : أم لديك العهدُ القديمُ من الأيام بل أنت جاهلٌ مغرور من رأيت المنون أخلدن أم من ذا عليه من أن يضام خفير أين كسرى كسرى الملوك أنو شر. وان أم أين قبله سابور وبنو الأصفر الكرام …"
