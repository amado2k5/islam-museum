  tr: "*Al-Zuhd wal-Raqaiq* adlı resimli kitabın 4. cildinin 102. sayfasından, felaket karşısında teselli, rahatlık ve sabır sunan bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü mersiye ve ağıtların bir derlemesinden derlenmiştir."
  id: "Cuplikan dari buku *Al-Zuhd wal-Raqaiq*, jilid bergambar 4, halaman 102, yang menawarkan penghiburan, kenyamanan, dan kesabaran dalam menghadapi musibah; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun dari kumpulan elegi dan ratapan paling terkenal."
