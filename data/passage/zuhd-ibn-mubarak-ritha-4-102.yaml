text: "… قال : حدثنا الحسين قال : أخبرنا ابن المبارك قال : أخبرنا سفيان عن رجل عن مسلم بن يسار أنه سجد سجدة فوقعت ثنيتاه فدخل عليه أبو اياس فاخذ يعزّيه، ويفوّن عليه فذكر مسلم من تعظيم اللّه تعالى فقال مسلم: …"
summary:
  ar: "مقطع من كتاب الزهد والرقائق، المجلد المصوَّر 4، ص 102، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
