label: { ar: "الموطأ 2651 — علقمة بن أبي علقمة عن أمه: عائشة تشق خمار حفصة الرقيق وتكسوها كثيفا", en: "Muwatta 2651", es: "Muwatta 2651", fr: "Muwatta 2651", ur: "موطا 2651", tr: "Al-Muwatta 2651 — Alqama ibn Abi Alqama, annesinden rivayetle: Aişe, Hafsa'nın ince başörtüsünü yırtıp yerine kalın bir başörtüsü taktı.", id: "Al-Muwatta 2651 — Alqama ibn Abi Alqama, berdasarkan riwayat ibunya: Aisyah merobek jilbab tipis Hafsa dan menggantinya dengan jilbab tebal." }
summary:
  ar: "يروي مالك عن علقمة بن أبي علقمة عن أمه أنها قالت: دخلت حفصة بنت عبد الرحمن على عائشة زوج النبي وعلى حفصة خمار رقيق، فشقته عائشة وكستها خمارا كثيفا. {cite:muwatta-maruf-1997 p.499}"
  tr: "Malik, Alqama ibn Abi Alqama'dan, annesinin rivayetine dayanarak şöyle aktarır: Hafsa bint Abdülrahman, Peygamberin eşi Ayşe'nin yanına girdi. Hafsa ince bir başörtüsü takıyordu, Ayşe başörtüsünü yırtıp ona kalın bir başörtüsü verdi. {cite:muwatta-maruf-1997 s.499}"
  id: "Malik meriwayatkan dari Alqama bin Abi Alqama, dari ibunya, bahwa ia berkata: Hafsa binti Abd al-Rahman masuk menemui Aisyah, istri Nabi, dan Hafsa mengenakan jilbab tipis, lalu Aisyah merobeknya dan memberinya jilbab tebal. {cite:muwatta-maruf-1997 p.499}"
