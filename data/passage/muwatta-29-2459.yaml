label: { ar: "الموطأ 2459 — بلغ مالكا: عمر يقوّم الدية على أهل القرى بالذهب والورق", en: "Muwatta 2459", es: "Muwatta 2459", fr: "Muwatta 2459", ur: "موطا 2459", tr: "El-Muvatta 2459 — Malik şöyle rivayet etmiştir: Ömer, köylüler için kan parasını altın ve gümüş olarak değerlendirir.", id: "Al-Muwatta 2459 — Malik meriwayatkan: Umar menetapkan uang ganti rugi darah untuk penduduk desa dalam bentuk emas dan perak." }
summary:
  ar: "بلغ مالكا أن عمر بن الخطاب قوّم الدية على أهل القرى، فجعلها على أهل الذهب ألف دينار، وعلى أهل الورق اثني عشر ألف درهم. قال مالك: فأهل الذهب أهل الشام ومصر، وأهل الورق أهل العراق. {cite:muwatta-maruf-1997 p.418}"
  tr: "Malik, Ömer ibn el-Hattab'ın köy halkı için kan parası belirlediğini, altınla ödeyenler için bin dinar, gümüşle ödeyenler için ise on iki bin dirhem belirlediğini rivayet etmiştir. Malik şöyle demiştir: \"Altınla ödeyenler Suriye ve Mısır halkı, gümüşle ödeyenler ise Irak halkıydı.\" {cite:muwatta-maruf-1997 s.418}"
  id: "Malik meriwayatkan bahwa Umar ibn al-Khattab telah menetapkan uang darah untuk penduduk desa, menetapkannya sebesar seribu dinar bagi mereka yang membayar dengan emas dan dua belas ribu dirham bagi mereka yang membayar dengan perak. Malik berkata: \"Mereka yang membayar dengan emas adalah penduduk Suriah dan Mesir, dan mereka yang membayar dengan perak adalah penduduk Irak.\" {cite:muwatta-maruf-1997 p.418}"
