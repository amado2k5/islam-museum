text: "… حَدَّثَنَا قَبِيصَةُ، عَنْ جَرِيرِ بْنِ حَازِمٍ، عَنِ الزُّبَيْرِ بْنِ سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ يَزِيدَ بْنِ رُكَانَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ أَتَيْتُ النَّبِيَّ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنِّي طَلَّقْتُ امْرَأَتِي الْبَتَّةَ. فَقَالَ \" مَا أَرَدْتَ بِهَا \". قُلْتُ وَاحِدَةً. قَالَ \" وَاللَّهِ \". قُلْتُ وَاللَّهِ. قَالَ \" فَهُوَ مَا أَرَدْتَ \". قَالَ أَبُو عِيسَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1177، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1177 (The Book on Divorce and Li'an), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1177، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
