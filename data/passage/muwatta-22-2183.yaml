label: { ar: "الموطأ 2183 — يحيى عن مالك: في الصباغ يدفع إليه الثوب فيخطئ به فيدفعه إلى رجل آخر حتى يلبسه الذي أعطاه: لا غرم على الذي لبسه، ويغرم الغسال لصاحب الثوب، إذا لبسه على غير معرفة أنه ليس له، فإن لبسه وهو يعرف أنه ليس ثوبه فهو ضامن", en: "Muwatta 2183", es: "Muwatta 2183", fr: "Muwatta 2183", ur: "موطا 2183", tr: "El-Muvatta 2183 — Yahya, Malik'ten rivayetle: Bir boyacıya bir elbise verilir ve o da hata yaparak onu başka birine verir ve o kişi de onu giyer. Giyen kişi sorumlu değildir, ancak yıkayıcı, elbisenin kendisine ait olmadığını bilmeden giymişse, elbisenin sahibine karşı sorumludur. Ancak, elbisenin kendisine ait olmadığını bilerek giymişse, o zaman sorumludur.", id: "Al-Muwatta 2183 — Yahya berdasarkan riwayat Malik: Mengenai seorang tukang celup yang diberi pakaian dan melakukan kesalahan, lalu memberikannya kepada orang lain yang kemudian memakainya: tidak ada tanggung jawab pada orang yang memakainya, tetapi tukang cuci bertanggung jawab kepada pemilik pakaian jika ia memakainya tanpa mengetahui bahwa itu bukan miliknya. Namun, jika ia memakainya dengan mengetahui bahwa itu bukan pakaiannya, maka ia bertanggung jawab." }
summary:
  ar: "قال: وسمعت مالكا يقول في الصباغ يدفع إليه الثوب فيخطئ به فيدفعه إلى رجل آخر، حتى يلبسه الذي أعطاه إياه: إنه لا غرم على الذي لبسه، ويغرم الغسال لصاحب الثوب، وذلك إذا لبس الثوب الذي دفع إليه، على غير معرفة بأنه ليس له. فإن لبسه وهو يعرف أنه ليس ثوبه، فهو ضامن له. {cite:muwatta-maruf-1997 p.296}"
  tr: "Şöyle dedi: Malik'in, kendisine bir giysi verilen ve yanlışlıkla başka birine veren, o kişinin de giysiyi giymesiyle ilgili olarak şöyle dediğini duydum: Giysiyi giyen kişi sorumlu değildir, ancak yıkayıcı giysinin sahibine karşı sorumludur. Bu, giysinin kendisine ait olmadığını bilmeden giymesi durumunda geçerlidir. Ancak, giysinin kendisine ait olmadığını bilerek giymişse, o zaman ona karşı sorumludur. {cite:muwatta-maruf-1997 s.296}"
  id: "Dia berkata: Saya mendengar Malik berkata mengenai seorang tukang pewarna yang diberi pakaian dan secara keliru memberikannya kepada orang lain, yang kemudian memakainya: tidak ada tanggung jawab pada orang yang memakainya, tetapi tukang cuci bertanggung jawab kepada pemilik pakaian tersebut. Ini berlaku jika dia memakai pakaian yang diberikan kepadanya tanpa mengetahui bahwa itu bukan miliknya. Namun, jika dia memakainya dengan mengetahui bahwa itu bukan miliknya, maka dia bertanggung jawab kepadanya. {cite:muwatta-maruf-1997 p.296}"
