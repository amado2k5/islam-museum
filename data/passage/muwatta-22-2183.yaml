label: { ar: "الموطأ 2183 — يحيى عن مالك: في الصباغ يدفع إليه الثوب فيخطئ به فيدفعه إلى رجل آخر حتى يلبسه الذي أعطاه: لا غرم على الذي لبسه، ويغرم الغسال لصاحب الثوب، إذا لبسه على غير معرفة أنه ليس له، فإن لبسه وهو يعرف أنه ليس ثوبه فهو ضامن", en: "Muwatta 2183" }
summary:
  ar: "قال: وسمعت مالكا يقول في الصباغ يدفع إليه الثوب فيخطئ به فيدفعه إلى رجل آخر، حتى يلبسه الذي أعطاه إياه: إنه لا غرم على الذي لبسه، ويغرم الغسال لصاحب الثوب، وذلك إذا لبس الثوب الذي دفع إليه، على غير معرفة بأنه ليس له. فإن لبسه وهو يعرف أنه ليس ثوبه، فهو ضامن له. {cite:muwatta-maruf-1997 p.296}"
