label: { ar: "سنن ابن ماجه 2292 — أولادكم من أطيب كسبكم", en: "Sunan Ibn Majah 2292 — Your children are of your finest earnings", ur: "سنن ابن ماجہ 2292 — تمہاری اولاد تمہاری بہترین کمائی میں سے ہے" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ يَحْيَى، وَيَحْيَى بْنُ حَكِيمٍ، قَالاَ حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَنْبَأَنَا حَجَّاجٌ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ ـ صلى الله عليه وسلم ـ فَقَالَ إِنَّ أَبِي اجْتَاحَ مَالِي ‏.‏ فَقَالَ ‏\"‏ أَنْتَ وَمَالُكَ لأَبِيكَ ‏\"‏ ‏.‏ وَقَالَ رَسُولُ اللَّهِ ـ صلى الله عليه وسلم ـ ‏\"‏ إِنَّ أَوْلاَدَكُمْ مِنْ أَطْيَبِ كَسْبِكُمْ فَكُلُوا مِنْ أَمْوَالِهِمْ ‏\"‏ ‏.‏"
summary:
  ar: "وفيه: أنت ومالك لأبيك، وقال إن أولادكم من أطيب كسبكم فكلوا من أموالهم."
  en: "And in it: «you and your wealth belong to your father,« and he said «your children are of your finest earnings, so partake of their wealth.»"
  ur: "اور اس میں: «تم اور تمہارا مال تمہارے باپ کا ہے» اور فرمایا «تمہاری اولاد تمہاری بہترین کمائی میں سے ہے تو ان کے مال سے کھاؤ۔»"
