text: "… من حال البحر فأَدُسُّه فى فم فرعون مخافة أن تدركه الرحمة. حدثنا أسد بن موسى، حدثنا أبو على عن حادين سلمة عن عطاء بن السائب عن مجاهد قال : كان جبريل بين بنى إسرائيل وبين آل فرعون، في-ل يقول لبنى …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 69، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 69, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 69 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
