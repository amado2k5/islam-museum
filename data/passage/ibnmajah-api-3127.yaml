label: { ar: "سنن ابن ماجه 3127 — عدد الحسنات", en: "Sunan Ibn Majah 3127 — a stated number of good deeds", ur: "سنن ابن ماجہ 3127 — نیکیوں کی مقررہ تعداد" }
text: "… مِسْكِينٍ، حَدَّثَنَا عَائِذُ اللَّهِ، عَنْ أَبِي دَاوُدَ، عَنْ زَيْدِ بْنِ أَرْقَمَ، قَالَ قَالَ أَصْحَابُ رَسُولِ اللَّهِ ـ يَا رَسُولَ اللَّهِ مَا هَذِهِ الأَضَاحِيُّ قَالَ \" سُنَّةُ أَبِيكُمْ إِبْرَاهِيمَ \". قَالُوا فَمَا لَنَا فِيهَا يَا رَسُولَ اللَّهِ قَالَ \" بِكُلِّ شَعَرَةٍ حَسَنَةٌ \". قَالُوا فَالصُّوفُ يَا رَسُولَ اللَّهِ قَالَ \" بِكُلِّ شَعَرَةٍ مِنَ الصُّوفِ حَسَنَةٌ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3127، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3127 (Chapters on Sacrifices), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3127، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
