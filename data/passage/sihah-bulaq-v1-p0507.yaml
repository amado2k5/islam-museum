text: |-
  ١٣٤
  ⁦(باب الشام)⁩
  وشاة رعشاء اذا كان لها تحت الاذن زغتان والرعت العهن من الصوف بعاق من الهودج
  عن أبى عبيد غث الرغوث كل مرضعة قال طرفة
  فليت لنسامكان اللك عمرو * رغونا حول قبتنا تخور
  وقد أرغثت النعجة ولدها أرضعته ورغت الجدى أمه أى رضعها ولرغشاء مثال العشراء
  عرق فى الثدى يدرّ اللبن قال ابن السكيت عصسبة تحت الندى وقواه-م أكل من برذونة
  رغون هو فعول فى محتى مفعولة لانهامر غوثة قال الاحررغث الرجسل فه ومرغوث اذا
  كثر عليه السؤال -تى يتقدما عنده فث لرفث الجماع والرفث أيضا الفمحسْ من القول
  وكلام النساء فى الجماع تقول منه رفت الرجل وأرفت قال العجاج
  ورب أسراب عجميج كظم • عى اللغاورفث الشكلم
  وقيل لاين عياس جين أنسد
  وهن يمشين بناهميسا * ان تصدق الطيرننك ليسا
  أترفت وأنت محرم فقال انا الرفت ما ووجه به النساء مث لردث بالكستر حر عى من
  مراعى الابل وهو من الهض والرمث بالتحريك خشب يضم بعضه الى بعض ويركب
  فى الجر والجمع أرماث قال أبو صخر الهذلى
  تمنيت من حبى علية أننا * على ر.ث فى البحرليس لناوفر
  والرمث أيضا أن تاكل الابل الرمث فتشتكى عنه وقدر مثت بالكسر وهى ابل رمشة ورمائى
  قال الاصعى الرمث بقية اللبن فى الضرع يقال رمثت فى الضرع ترميثا وأرمنت أيضااذا
  أبقيت بهاشيئا قال الشاعر
  وشارك أهل الفصيل الفصيل * فى الام وأمشكها المرمثم
  ورمنت الشئ أصلحته ومسحته بيدى قال الشاعر
  وأخ رمشت رويه * ونصحته فى الحرب نصا
  وحبل أرمات أى أرمام، ( وث لروئة واحسدة الروت والارواث وقدراث الفرس وقى
  المثل أحشك وترونى والرونة طرف الارنية يقال فلان يضرب بلسانه روثة انفه
  يث . راث على خبرك يريت ريشا أى أبطأ وفى المثل رب عجلة وهيت ديدا ويروى تهب
  ريشا والمعنى واحد من الهبة وما أراثك علينا أى ما أبطأ يك عنا وريث أبوحىّ من قيس وهو
  ريث بن غطفان بن سعدين قيس عيلان والاستراثة الاستبطاء ورجل ريث بالتشديد أى
  بطىء قال الفراء رجل مريث العينين اذا كان يطى النظر
  ( صل المشين بت لتشبت بالشئ التعلق يه ورجل شبت اذا كان طبعه ذلك
  والشبث بالتحريك دويية كثيرة الارحل من أحناش الارض ولا تقل شبث ١ والهع
  شبثان مثل خرب وخربات قال الشاعر
  ترى أره فى صفحتيه كانه * مدارح :بنان لهن ه-ميم
  قال أبوعرو الشنبنة بزيادة النون العلاقة يقال شنيت الهوى قلبه أى علق يه ئث
  الشث نبت طيب الريح مرّ الطعم يدبغ به قال تأبط شرا
  كاعا
