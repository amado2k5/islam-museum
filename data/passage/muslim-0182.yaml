label:
  ar: "مسلم 182 — رؤية الله يوم القيامة وآخر من يدخل الجنة"
  en: "Muslim 182 — Seeing God on the Day of Resurrection, and the last to enter Paradise"
  ur: "مسلم 182 — قیامت کے دن اللہ کا دیدار اور جنت میں سب سے آخر میں داخل ہونے والا"
text: "هل تضارون في رؤية القمر ليلة البدر . قالوا لا يا رسول الله . قال هل تضارون في الشمس ليس دونها سحاب . قالوا لا يا رسول الله . قال فإنكم ترونه كذلك يجمع الله الناس يوم القيامة فيقول من …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 182: رؤية الله يوم القيامة وآخر من يدخل الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 182: Seeing God on the Day of Resurrection, and the last to enter Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 182: قیامت کے دن اللہ کا دیدار اور جنت میں سب سے آخر میں داخل ہونے والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
