label:
  ar: "مسلم 182 — رؤية الله يوم القيامة وآخر من يدخل الجنة"
  en: "Muslim 182 — Seeing God on the Day of Resurrection, and the last to enter Paradise"
  ur: "مسلم 182 — قیامت کے دن اللہ کا دیدار اور جنت میں سب سے آخر میں داخل ہونے والا"
  es: "Musulmán 182 — Ver a Dios el Día de la Resurrección y ser el último en entrar al Paraíso"
  fr: "Muslim 182 — Voir Dieu le Jour de la Résurrection et être le dernier à entrer au Paradis"
  tr: "Müslim 182 — Kıyamet Gününde Allah'ı Görmek ve Cennete En Son Giren Olmak"
  id: "Muslim 182 — Melihat Tuhan pada Hari Kiamat dan menjadi orang terakhir yang masuk Surga"
text: "هل تضارون في رؤية القمر ليلة البدر . قالوا لا يا رسول الله . قال هل تضارون في الشمس ليس دونها سحاب . قالوا لا يا رسول الله . قال فإنكم ترونه كذلك يجمع الله الناس يوم القيامة فيقول من …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 182: رؤية الله يوم القيامة وآخر من يدخل الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 182: Seeing God on the Day of Resurrection, and the last to enter Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 182: قیامت کے دن اللہ کا دیدار اور جنت میں سب سے آخر میں داخل ہونے والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 182: Ver a Dios el Día de la Resurrección y ser el último en entrar al Paraíso. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim n° 182: « Voir Dieu le Jour de la Résurrection et être le dernier à entrer au Paradis. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta. »"
  tr: "Sahih Müslim'de 182. hadis-i kudsi olarak geçen hadis: Kıyamet Günü Allah'ı görmek ve cennete en son giren olmak. Peygamberimiz tarafından Rabbinden rivayet edilmiş ve Hadis-i Kudsi araştırmacısı tarafından altı şeriat hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Hadits qudsi dalam Sahih Muslim, no. 182: Melihat Allah pada Hari Kiamat dan menjadi orang terakhir yang masuk Surga. Diriwayatkan oleh Nabi dari Tuhannya, dan dikumpulkan oleh Peneliti Hadits Qudsi dalam enam koleksi hadits kanonik dan Al-Muwatta."
