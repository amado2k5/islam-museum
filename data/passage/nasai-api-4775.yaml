text: "أَخْبَرَنَا أَحْمَدُ بْنُ سُلَيْمَانَ، قَالَ أَنْبَأَنَا عُبَيْدُ اللَّهِ، عَنْ إِسْرَائِيلَ، عَنْ عَبْدِ الأَعْلَى، أَنَّهُ سَمِعَ سَعِيدَ بْنَ جُبَيْرٍ، يَقُولُ أَخْبَرَنِي ابْنُ عَبَّاسٍ، أَنَّ رَجُلاً، وَقَعَ فِي أَبٍ كَانَ لَهُ فِي الْجَاهِلِيَّةِ فَلَطَمَهُ الْعَبَّاسُ فَجَاءَ قَوْمُهُ فَقَالُوا لَيَلْطِمَنَّهُ كَمَا لَطَمَهُ. فَلَبِسُوا السِّلاَحَ فَبَلَغَ ذَلِكَ النَّبِيَّ فَصَعِدَ الْمِنْبَرَ فَقَالَ \" أَيُّهَا النَّاسُ أَىُّ أَهْلِ الأَرْضِ تَعْلَمُونَ أَكْرَمُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4775، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4775 (The Book of Oaths (qasamah), Retaliation and Blood Money), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 4775، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4775 (El Libro de los Juramentos (qasamah), la Venganza y la Indemnización por Sangre), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan al-Nasa'i, n° 4775 (Le Livre des Serments (qasamah), des représailles et du prix du sang), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sunan-ı Nesai'de yer alan 4775 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4775, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang subjek tersebut."
