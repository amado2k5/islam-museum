text: |-
  •⁦(باب الميم)⁩
  •عجم).
  ٢١١
  قدر معرفتى ويقال خذ هذا فاعتنم به أى استعن به الاصمعى يجل عيثوم وهوا لعظيم وأنشد
  لعاشمة بن عبدة يهدى بها أكاف اللخدين مختبر • من الهال كثيرا للعم عينوم
  وقل الغنوىّ العيثوم الانى من الفيلة وأنشدالاخطل
  : تركوا أسامة فى اللقاء كانا * وطئت عليهيحفها العيثو
  والعينوم ايضا الضبع عن أب عبيد والعينام شجر وعثمان اسم رجل ويقال العنمان
  فرخ الحبارى ( جم العجم أصل الذتب مثل العجب وهو العصعص والحجم أيضاصغار!
  الابل غحو بنات اللبون الى الجذع يستوى فيه الذكر والاتى والجمع الهجوم والهجم بالتحريك
  النوى وكل ما كان فى جوف مأكول كالز بيب وما أشبهه قال أبوذؤيب يصف متلفاوهو
  المفازة مستوقد فى حصاة الشمس تصهره • كانه عجم بالبيدهر ضوح
  الواحدة عجممة مثل قصبة وقصب يقال ليس لهذا الرمّان عجم قال يعقوب والعامة تقول عجم
  بالتسكيز والعجم خلاف العرب الواحد عجمي والعجم بالضم خلاف العرب وفى لسانه عجعة
  وعجمة الرمل أيضا آخره والعجمة بالتصريك أيضا التخلة تنبت من النواة والعجمات الصهور
  الصلاب والابل الهجم التى تعجم العضاء والقتاد والشول فتمجز أبذلك من الهض والعجماء البهيمة
  وفى اتلحديت برح الهجما جبار وانماسميت عجماء لانها لا تتسكلم فنكل من لا يقدر على الكلام
  أصلا فهو أعمم ومستعجم والاعجم أيضا الذى لا يفصح ولايين كلامه وان كان من العرب
  والمرأة عجماء ومنه زباد الاعجم الشاءر والاعجم أيضا الذى فى لسانه عجسمة وان أفصح
  بالعجمية ورجلان أعجمان وقوم أعجمون وأعاجم قال اللّٰه تعالى ولونزلناه على بعض
  الاعجمين ثم ينسب اليه فيقال لسان أعجمى" وكتاب أعجمى ولا تقل رجل أعجمى"فتفبه الى
  نفسم الا أن يكون أعجم وأعجمى بمعنى مثل دوادودة ارى"ويحل قعسر وقعسرى هذا اذا
  وردورود الايمكن ردّه وأماقول الشاعر
  كأنّ قرادى صدره طبعتهما • بطين من الجولان كتاب أعجم
  فلم يردبه العجم وانما أراد به كتاب رجل أعجم وهو ملك الروم والاعجم من الموج الذى لا يتنفس
  أى لا ينة مع الماء ولا يسمع له صوت وصلاة النهارعجماء لانه لا يجه رفيها بالقراءة والعجم العض
  وقد عجمت الءود أعجمه بالضم اذا عضضته لتعلم صلابته من خوره والعواجم الاسنان
  رعجمت عوده أى يلوت أمره وخبرت حاله وقال
  أبى عودل المعجوم الاصلابة • وكفاكا لانائلا حين تسئل
  ورجل صلب المهجم اذا كان عزيز النفس وناقة ذات مهجمة أى ذات سمن وقوّة وبقيسة على
  لسيروما عجمتك عين منذ كذا أى ما أخذتك ورأيت فلانا فجعلت عين تعجمه كانها تعرفه
  والنور يعجم قرنة اذاضرب به الشجبرة يباوه وعجم السيف •زه لتجربة والعجم النقط بالسواد
  مثل التاهعليه نقطتان يقال أعمت الحرف والتعجيم مثله ولا تقل عجمت ومنه عروف
  ا المهجم وهى الحروف المقطعة التى يختص أكثرها بالنقط من بين سائرحروف الاسم ومعناه
  حروف الخط المهجم كما تقول مسجد الجامع وصلاة الأ ولى أى مسجد اليوم الجامع وصلاة
  الساعة الاولى وناس يجملون المعجم يعنى الاعجام مصدرامشل الخرج والمدخل أى من
