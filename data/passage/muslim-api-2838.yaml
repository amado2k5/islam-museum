label: { ar: "صحيح مسلم 2838 — الأب والأبوة", en: "Sahih Muslim 2838 — the father and fatherhood", ur: "صحیح مسلم 2838 — باپ اور والدیت", es: "Sahih Muslim 2838 — El padre y la paternidad", fr: "Sahih Muslim 2838 — Le père et la paternité", tr: "Sahih Muslim 2838 — Baba ve Babalık", id: "Sahih Muslim 2838 — Ayah dan Peran Ayah" }
text: "… بْنُ مَنْصُورٍ، - وَهُوَ السَّلُولِيُّ - حَدَّثَنَا إِبْرَاهِيمُ بْنُ يُوسُفَ، - وَهُوَ ابْنُ إِسْحَاقَ بْنِ أَبِي إِسْحَاقَ السَّبِيعِيُّ - عَنْ أَبِيهِ، عَنْ أَبِي، إِسْحَاقَ سَمِعَ ابْنَ الأَسْوَدِ، يَذْكُرُ عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - قَالَتْ كَانَ رَسُولُ اللَّهِ إِذَا أَرَادَ أَنْ يُحْرِمَ يَتَطَيَّبُ بِأَطْيَبِ مَا يَجِدُ ثُمَّ أَرَى وَبِيصَ الدُّهْنِ فِي رَأْسِهِ وَلِحْيَتِهِ بَعْدَ ذَلِكَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2838، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2838 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2838، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2838 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2838 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 2838 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2838, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
