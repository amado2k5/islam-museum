text: "… قال : كنا عنده وعليه ثوبان حُمَشَّقان، فتمخط ثم مسح أَنفه بثوبه، قال : الحمد لله، يمتخط أَبو هريرة في الكنَّان، لقد رأَيتني وإني لأُخرّ فيما بين منبر النبي عليه وحجرة عائشة مغشيّاً عليَّ من الجوع، فيجيءُ الرجل فيقعد على …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 4204، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 4204, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 4204 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Abd al-Razzaq, volumen 1, pág. 4204, que menciona una reliquia conservada tras su dueño, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Abd al-Razzaq (tome 1, p. 4204) mentionnant une relique conservée après son propriétaire, un lieu de sépulture ou de repos. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "Abdülrazzak'ın Musannaf adlı eserinin Resimli Cilt 1, sayfa 4204'teki bir alıntısında, korunmuş bir eser, bir mezar yeri, bir türbe ve bir kutsal mekandan bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, eserler ve kutsal mekanlar araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf karya Abd al-Razzaq, Jilid Bergambar 1, hlm. 4204, menyebutkan sebuah artefak yang terpelihara, sebuah situs pemakaman, sebuah kuburan, dan sebuah tempat keramat; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, artefak, dan tempat keramat."
