text: "… وكان قد خرج هو وإخوته حكم ووائل وقدامة الى خراسان مع وكيع بن سود فبعث وكيع أخاه وائلا فى بعث الى حرب الترك وبعث أخاه قدامة الى فارس فى بعث آخر وبعث أخامحكما الى سجستان فلم يلبث ان جاءه نعى …"
summary:
  ar: "مقطع من حماسة أبي تمام، ص 317، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Hamasa of Abu Tammam, p. 317, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ابو تمام کی حماسہ، ص 317 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hamasa d'Abu Tammam, p. 317, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Hamasa de Abu Tammam, p. 317, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Ebu Tammam'ın Hamasa adlı eserinin 317. sayfasından, bir ağıt ve ölüm müjdesini içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve mersiyeleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Hamasa karya Abu Tammam, halaman 317, berisi ratapan dan pengumuman kematian; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan ratapan paling terkenal."
