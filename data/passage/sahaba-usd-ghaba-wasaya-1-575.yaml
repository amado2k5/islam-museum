  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 1, sayfa 575'ten bir alıntı; vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsediyor; makineyle okunabilir tıpkıbasım baskısından. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
