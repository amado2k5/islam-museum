label: { ar: "الموطأ 1405 — زيد بن أسلم عن عطاء بن يسار: رجل من الأنصار من بني حارثة كان يرعى لقحة له بأحد فماتت فذكاها بشظاظ، فقال النبي لا بأس بها فكلوها", en: "Muwatta 1405", es: "Muwatta 1405", fr: "Muwatta 1405", ur: "موطا 1405", tr: "El-Muvatta 1405 — Zeyd ibn Aslam, Ata' ibn Yasar'dan rivayetle: Ensar'dan, Beni Haritha kabilesinden bir adam, Uhud'da dişi devesini otlatırken deve öldü. Bunun üzerine deveyi bir taşla kesti. Peygamberimiz şöyle buyurdu: \"Bunda bir sakınca yok, ye onu.\"", id: "Al-Muwatta 1405 — Zayd ibn Aslam berdasarkan riwayat Ata’ ibn Yasar: Seorang pria dari kaum Ansar, dari suku Banu Haritha, sedang menggembalakan unta betinanya di Uhud ketika unta itu mati. Kemudian ia menyembelihnya dengan batu. Nabi bersabda, “Tidak ada yang salah dengan itu, maka makanlah.”" }
text: "لَيْسَ بِهَا بَأْسٌ . فَكُلُوهَا"
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن رجلا من الأنصار من بني حارثة كان يرعى لقحة له بأحد، فأصابها الموت، فذكاها بشظاظ، فسئل رسول الله عن ذلك، فقال ليس بها بأس، فكلوها. ويذكر المحقق أن ابن عبد البر قال إن الحديث عند رواة الموطأ مرسل، ومعناه متصل من وجوه ثابتة. {cite:muwatta-maruf-1997 p.630}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet eder ki, Ensar'dan, Beni Haritha kabilesinden bir adam Uhud'da dişi devesini otlatırken deve öldü. Bunun üzerine deveyi keskin bir aletle kesti. Allah Resulü'ne bunun sebebi soruldu ve o da, \"Bunda bir sakınca yok, ye onu\" dedi. Araştırmacı, İbn Abdül-Barr'ın, hadisin Muvatta ravilerine göre mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu, ancak anlamının sahih rivayet zincirleriyle bağlantılı olduğunu söylediğini belirtiyor. {cite:muwatta-maruf-1997 s.630}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari Ata ibn Yasar, bahwa seorang pria dari kaum Ansar, dari suku Banu Haritha, sedang menggembalakan unta betinanya di Uhud ketika unta itu mati. Kemudian ia menyembelihnya dengan alat yang tajam. Rasulullah ditanya tentang hal ini, dan beliau bersabda, \"Tidak ada yang salah dengan itu, maka makanlah.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits tersebut mursal (hadits dengan mata rantai periwayatan yang hilang) menurut perawi al-Muwatta, tetapi maknanya terhubung melalui rantai periwayatan yang sahih. {cite:muwatta-maruf-1997 p.630}"
