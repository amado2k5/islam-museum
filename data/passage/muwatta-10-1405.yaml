label: { ar: "الموطأ 1405 — زيد بن أسلم عن عطاء بن يسار: رجل من الأنصار من بني حارثة كان يرعى لقحة له بأحد فماتت فذكاها بشظاظ، فقال النبي لا بأس بها فكلوها", en: "Muwatta 1405" }
text: "لَيْسَ بِهَا بَأْسٌ . فَكُلُوهَا"
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن رجلا من الأنصار من بني حارثة كان يرعى لقحة له بأحد، فأصابها الموت، فذكاها بشظاظ، فسئل رسول الله عن ذلك، فقال ليس بها بأس، فكلوها. ويذكر المحقق أن ابن عبد البر قال إن الحديث عند رواة الموطأ مرسل، ومعناه متصل من وجوه ثابتة. {cite:muwatta-maruf-1997 p.630}"
