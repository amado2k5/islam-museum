label: { ar: "سنن أبي داود 3715 — الأب والأبوة", en: "Sunan Abi Dawud 3715 — the father and fatherhood", ur: "سنن ابی داؤد 3715 — باپ اور والدیت", es: "Sunan Abi Dawud 3715 — El padre y la paternidad", fr: "Sunan Abi Dawud 3715 — le père et la paternité" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ عَلِيٍّ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ كَانَ رَسُولُ اللَّهِ يُحِبُّ الْحَلْوَاءَ وَالْعَسَلَ. فَذَكَرَ بَعْضَ هَذَا الْخَبَرِ. وَكَانَ النَّبِيُّ يَشْتَدُّ عَلَيْهِ أَنْ تُوجَدَ مِنْهُ الرِّيحُ. وَفِي الْحَدِيثِ قَالَتْ سَوْدَةُ بَلْ أَكَلْتَ مَغَافِيرَ. قَالَ \" بَلْ شَرِبْتُ عَسَلاً سَقَتْنِي حَفْصَةُ \". فَقُلْتُ جَرَسَتْ نَحْلُهُ الْعُرْفُطَ. قَالَ أَبُو دَاوُدَ الْمَغَافِيرُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3715، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3715 (Drinks (Kitab Al-Ashribah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3715، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3715 (Kitab Al-Ashribah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3715 (Les Boissons (Kitab Al-Ashribah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
