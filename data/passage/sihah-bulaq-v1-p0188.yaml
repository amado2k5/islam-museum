text: |-
  ٤٥٣
  والذفناس الاحق ⁦(دكس)⁩ الدكاس ما يفشى الانسان من النعاس ويتراكب عليه
  وأنشداين الاعرابى كانه من الكرى الدكاس * بات بكاسى قهو:يحاسي
  والداكس لغة فى الكادس وهوما يتطير به من العطاس والقعيد ونحوهما والدوكس المعدد
  لكثير واسم من أسماء الاسد ⁦( دلس)⁩ التدليس فى البيع كتمان عيب السلعة عن
  المشترى والمدالسة كالمخادعة يقال فلان لايد السك أى لا يخاد عك ولا يخق عليك الشئ
  فكانه يأتيك به فى التظلام والدئس بالحر يك الظلة والدلس النبات الذى يورق فى آخر
  الصيف ويقال انّ الادلاس من الربب وهوضرب من النبت وقد تدلس اذا وقع بالادلاس
  والدولسي الذى فى الاثر الذريعة الى الزنا قاله سعيد بن المسيب فى حق عمروضى اقه عفه
  { دمس ) دمس الظلام يدمس ويدمس أى اشتد وليل دامس وأدموس أى مظلم
  وجاءذلان بامورد مم أى عظام كانه بجع دامس منسل بازل ويزل ودمست الشي دقنته
  وخبأته وكذلك التدميس وأنشد أبوزيد
  ادادقت فاهاقلت علق مدمس • أريديه قل ففودر فى ساب
  ودمست عليه الخبردمسا كتمه البنة والدعماس هبن كان للعجاج بن يوسف فان قتصت
  الدال بجعته على دياميس مثل شيطان وشياطين وان كسرتها جعته على دماميس مثل قيراط
  وراريط وسمى بذلك لظلمته و يسمى السرب ديماسا وفى حديث المسيح عليه السلام انة سبط
  الشهر كشير خيلان الوجه كانه خرجم ن ديماس يعق فى نضرته وكثرة ماء وجهه كانه خرج
  من كن لانه عليه السلام قال فى وصفه كان رأسه بقطرماه ⁦(دمقس)⁩، الدمقس القزومنه
  قول امرى القيس وشهم كهذاب الدمقس المفسل نقس دنقست بين
  القوم أى أفسدت بالمسين والشين جمبعا ⁦(انس )⁩ الدنس الومخ وقددنس النوب يدنس
  داساتوخ وتدنس منله ودنهفيوه تدنيساً ⁦(اوس)⁩ داس الشى برجله بدوسه دوسا
  ويقال أنتهم الخيسل دوائس أى يتبع بعضها بعضا وداس الطعام يدوسه دياسة فانداس
  هووالموضع مداسة والمدوص مايداس به والمدوص أيضا المصقلة يقال د..ت
  السيف اذاصقلته قال الشاعر
  وأبيض كالغديرنوى عليه * قيون بالمداوس نصف شهر
  ودوس قبيلة من المن من الازد هس الدهس والدهاس مثل اللبت واللباث
  المكان السهل اللين لا يبلغ أن يكون وملا وليس هو بتراب ولاطين ولونه الدهة يقال رمل
  أدهس بين الدهس قال الحجاج مواصلا قفا وره لا أدها ورمال دهس وعنز دهسا.
  وهى مثل المداء الا انها أقل حرمنها قال المعلى بن حال العبدى
  وجامت خلعة دهس صفايا • يصور عنوقها أحوى زنيم
  وانظعة خيار المال ويصودعيل ويروى بصوع أى يفرق وعنوق ججمع عناق دهر س)
  الدهار يس الدواهى حكاه أبوءبيد
