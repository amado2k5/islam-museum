text: |-
  ١ لاول بكون الراءوالثانى
  بضعها اه
  ٣٦
  يعاو أابان الابل كالزيدولاز بدلالسانها قال الراجز عصب الجباب بشفاه الوطب
  والجيجبة الكرش يجعل فيها الخلع أوتذاب الاهالة قتحقن فيها وتجيجب الرحل اذا اتشق
  والوشقة لحم يغلى اغلاءة ثم يقددفهو أبقى ما يكون قال الشاعر
  اذاءرضت منها كهاة سمينة • فلاتهدمنها وانشق وتجيجب
  والمسجبة أيضازبيل من جلود ينقل فيه التراب والجم-ع الجباجب والحب البئرالتى لم تطو
  وجعها جباب وجببة والجبوب الارض الغليظة ويقال وحه الارض ولا يجمع نب )
  لجخابة مثل السمابة الاجق الذى لاخير فيه يقال انه لجخابة هلباجة ⁦(جخدب)⁩
  الجخدب ضر ب من الجنادب وهو الاخضر الطويل الرجلين والجخادب مثله ويقال له أيضا
  أبو جغادب وهو اسم له معرفة كما بقال للاسدأ بوالحارث نقول ه_ذا أبو جخادب قدجاء
  والجندب أيضا والجخادب الجمل الضخم قال الراجز
  شذاخة ضخم الضاوع جخديا
  والجمع الجخادب بالفتح ⁦( دب )⁩ الجدب نقيض الخصب ومكان جدب أيضاوجديب بين
  الجدوبة وأرض جدبة وأرض جدوب وفلان جديب الجنب وه وماحوه وأجدب القوم
  أصابهم الجدب وأجدبت ارض ك ذاوجدتها جدبة والجدب العيب وفى الحديث
  انه جدب السمر بعد العشا. أى عابه قال ذوالرمة
  فيالك من خد أسيل ومنطق • رخيم ومن خلقعلل جادبه
  يقول لا يجد فيه عيبا يعيبه به فيتعلل بالباطل ابن السكيت بادبت الابل العام اذا كان العام
  محلافصارت لاتأ كل الاالدرين الاسود درين الثمام الجندب والجندب ضرب من
  الجرادواسم رجل قال سيبويه نونها زائدة أبوزيد يقال وقع القوم فى أم جندب اذاظلوا
  كانها اسم من أسماه الاساءة والظلم والداهية ذب لجذب المديقال جذبه وجبدُه
  على القلب واجتذيه أيضا يقال للرجل اذا كرع فى الاناء جذب منه نفسا أو نفسين
  وبينى وبين المنزل حذية أى قطعة يعى بعد ويقسال حذبة من غزل للمجذوب منه مرّة وحذيت
  المهر عن أمّه أى فطمته قال الشاعر.
  ثم جذيناه فطا ما نفصله أبو عمر والجذب انقطاع ا
  الريق ويقال للناقة اذاقل ابنها قد حديت فهى جاذب وايجهع جواذب وجذاب أيضامثل نائم
  ونيام وجذب الشهر مضى عامته وجاذبته الشئ اذا نازعتهاياه والتجاذب التنازع
  والانجذاب سرعة الير والجسذب بالتجريك الهاروه وشحم النخل الواحدة جذبة
  ⁦( جرب )⁩ الحرب معروف وقد جرب الرجل فهو أجرب وقوم جرب وجربى وجع الجرب
  براب قال الشاعر وفيناوان قيل اصط لحنا تضاغن * كماطر أوبارالجراب على النشر
  وأجرب الرجل حربت ابله والجرباء السماسميت بذلك لما فيها من المكوا كب كانها جوب
  لها وأرض جرباء مقحوطة والجراب معروف والعامة تفتحة والهع أجر بة وجرب وجرب ١
  وجراب البتر أيضاجوفها من أعلاها الى أسفلها والجريب من الطعام والارض مقدارمعلوم
  والجع أجربة وجربان والمجرب مثل الجرّس والمضرّس الذى قدجر سه الامور وأحكم
  فان كسرت الرام جعلته فاء_لا الا أنّ العرب تكامت به بالفتح والجربة بالسكسر المزرعسة
  مال بشر
  تحدرماء البئرعن حرشية • على جربة تعلو الدبار غروبها
  والجرياء
