text: "ربيعة بن الحارث بن عبد المطّلب الهاشمي. سمع أبا هريرة، وأبا سعيد، وعبد اللّٰه ابن مالك بن بُحَيْنَة، وطائفة، وسمع أيضاً من أبي سَلَمَة، وعُمَيْر مولى ابن عبّاس، وعدّة. وكان يكتب المصاحف ويُقرِيءُ القرآن. روى عن الزُّهْرِي، وأبو الزِّناد، وصالح …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 10، ص 415، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 10, p. 415, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 10، ص 415 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 10, pág. 415, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
