text: |-
  ٣٩٤
  ومعطنها المرابضها حول الماء وأعطن القوم أى عطنت ابلهم وفلان واسع العطان والبلداذا
  كان رحب الذراع وأعطن الرجل بعيره وذلذ اذ الم يشرب فرده الى العطن ينتظريه قال
  عافما الماء فلم يعطنهما • انمايعمان من يرجو العلل
  قن شى عفن بين العفونة ودعقن الحبل بالكسر عفنا بلى من الماء كن)
  العكنة الطى الذى فى البطن من السمن والجمع عكن وأعكان وتعكن البطن اذاصارذاعكر
  ونعم عكان بالتصريك أى كثيرة وقد يسكن قال• وصبح الماء بورد عكنان • علن العلانية
  خلاف السمريقال علن الامر يعلن علونا وعلن الامر بالسكسر يعلن علنا حكاهابن السكيت
  وأعلنته أنا اذا أظهرته والعلان المعالنة ورجل علنة يبوح بسرّه وعلوان المكتاب عنوانه
  وقد علونت الكتاب اذا عنونته ⁦(علين)⁩ العلين الناقة المكتنزة اللحم ويقال نونه زائدة
  والعلجن المرأة الماجنة من من بالمكان أقام به وعمان مخفف بلد وأما الذى بالسأم فهو
  عمان بالفتح والتشديد وأهمن الرجل صار الى عمان عنن عن لى كذايعن ويعن عنما أى
  عرض واعترض يقال لا أفعله ما عن فى السماء نجم أى ماعرض ورجل معن عربض
  وامرأة معنة والمعن أيضا انططيب ورجسل عنسين لا يريد النساه بين العنينة وامرأة عنينة
  لا تشتهسى الرجال وهوفعيل بمعنى مفعول مثل خريج وعنن الرجل عن امر أنه اذاحكم
  القاضى عليه بذلك أو منع عنها بالسحر والاسم منه العنة والعنة أيضاحظيرة من خشب تجعل
  للابل قال الاعشى
  ترى اللهم من ذابل قد ذوى • ورطب يرفع فوق العنن
  والعنان للفرس والجمع الاعنة والعنان أيضا المعانة وهى المعارضة وعفانا المتن حبلاه
  ويقال للرجل انه طرف العنان اذا كان خفيفا وشركة العنان أن يشتركافى شي خاص دون
  سارأموالهما كأنه عن لهماشئ فاشترياه مشتركين فيه قال النابغة الجعدىّ
  وشاركتاقر يشانى تقاها • وفى أحسابها شر العنات
  بحماولدت نساء بنى حلال • وماولدت نساء بنى أبان
  وعناناك أن تفعل كذا على وزن قصاراك أى جه-دل وغايتك كأنه من الممانة من عن يعن
  أى اعترض وعننت الفرس يسته بعنانه وأعننت اللجام جعلت ل عنانا والتعنين مثله
  وعننت الكتاب وأعننته لكذا أى عرّضته له وصرفته اليه وعنوان الكتاب بالضم هى اللغة
  الغصيصة وقال أنس بن ضب بن معاو ية بن كلاب وهوجا«لى * لمن طلل كعنوان المكتاب
  وقد يكسر فيقال عنوان وعنيان وعنونت الكتاب أعنونه وعنفت المكتاب وعنيته أيضا
  أبدلوا من احدى النونات ياء والاعتفان الاعتراض والعنون من الدواب المتقدّمة فى
  السير وقواهم أعطيته عين عنة أى خاصة من بين أصحابه ووأيته عين عنة أى الساعة من
  غير أن طلبته وأعننت بعنة ما أدرى ماهى أى تعرضت لشئ لا أعرفسه والعنان بالفتح
  السحاب الواحدة عنانة والعانة أيضا وأعذان السماءصفا تحها وما اعترض من أقطاره
  سكأنه بجع عنى قال يونم ليس لمنة وص البيان بها ولوحك بيافوخه أعان السم
  والعامّة تقول عنان السماء والعنعنة فى تيم أن تجعل الهمزة عيناتة ول عن فى. وضع أن
  قال ذوارقة
  أعن ترسمت من خرقاء منزلة • ماالصباية من عينيك مسجوم
  وأما
