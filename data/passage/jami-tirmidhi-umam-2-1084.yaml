text: "… فِي أَدْنَى الْأَرْضِ الروم: - قَالَ : غُلِبَتْ وَغَلَبَتْ، قَالَ : كَانَ المُشْرِكُونَ يُحِبُّونَ أَنْ يَظْهَرَ أَهْلُ فَارِسَ عَلَى الرُّومِ، لأَنَّهُمْ وَإِيَّاهُمْ أَهْلُ أَوْثَانٍ، وَكَانَ المُسْلِمُونَ يُحِبُّونَ أَنْ يَظْهَرَ الرُّومُ عَلَى فَارِسَ، لأَنَّهُمْ أَهْلُ كِتَابِ، فَذَكَرُوهُ لأَبِي بَكْرٍ، فَذَكَرَهُ أَبُو …"
