label: { ar: "سنن النسائي 1816 — ساعة الاحتضار والوفاة", en: "Sunan al-Nasa'i 1816 — a deathbed and last hours", ur: "سنن نسائی 1816 — وقتِ وفات اور آخری لمحات", es: "Sunan al-Nasa'i, 1816: lecho de muerte y últimas horas.", fr: "Sunan al-Nasa'i 1816 — Un lit de mort et les dernières heures" }
text: "… أَبُو عَاصِمٍ، قَالَ حَدَّثَنَا سَعِيدُ بْنُ عَبْدِ الْعَزِيزِ، قَالَ سَمِعْتُ سُلَيْمَانَ بْنَ مُوسَى، يُحَدِّثُ عَنْ مُحَمَّدِ بْنِ أَبِي سُفْيَانَ، قَالَ لَمَّا نَزَلَ بِهِ الْمَوْتُ أَخَذَهُ أَمْرٌ شَدِيدٌ فَقَالَ حَدَّثَتْنِي أُخْتِي أُمُّ حَبِيبَةَ بِنْتُ أَبِي سُفْيَانَ قَالَتْ قَالَ رَسُولُ اللَّهِ \" مَنْ حَافَظَ عَلَى أَرْبَعِ رَكَعَاتٍ قَبْلَ الظُّهْرِ وَأَرْبَعٍ بَعْدَهَا حَرَّمَهُ اللَّهُ تَعَالَى عَلَى النَّارِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1816، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1816 (The Book of Qiyam Al-Lail (The Night Prayer) and Voluntary Prayers During the Day), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 1816، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1816 (El Libro de Qiyam Al-Lail (La oración nocturna) y las oraciones voluntarias del día), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1816 (Le Livre de la prière nocturne et des prières surérogatoires du jour), évoque un lit de mort et les dernières heures. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
