text: "… أنتظر أن تطفو حتى أقبض عليها كان يملأ جرة ماءٍ من النهر، وفي أثناء ذلك سقطت الجرة من يده، فجلس ينظر إلى محل سقوطها، فرآه أحدهم فقال له: ماذا تفعل يا شيخي، وإلى أي شيء تنظر؟ فأجابه: إنَّ الجرة قد …"
summary:
  ar: "سقطت جرة جحا في النهر فجلس ينتظر، وقال إنه سيمسكها حين تطفو من فمها وأذنيها. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  en: "Juha's jar falls into the river and he waits, sitting, saying he will catch it when it floats up by its mouth and ears. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  ur: "جحا کا مٹکا دریا میں گر جاتا ہے اور وہ بیٹھ کر انتظار کرتا ہے، اور کہتا ہے کہ جب وہ منہ اور کانوں کے بل اوپر تیرے گا تو وہ اسے پکڑ لے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  fr: "La jarre de Juha tombe dans la rivière et il attend, assis, disant qu'il l'attrapera quand elle remontera à flot par son goulot et ses anses. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
  es: "La jarra de Juha cae al río y él espera sentado, diciendo que la atrapará cuando flote por la boca y las asas. {cite:juha-nawadir-kubra-djuwaydi p. 143}"
