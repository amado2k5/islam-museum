text: "… إلى أبي عبيدة بإنفاذه. سلمة عن أبي هند، قال: حجمت رسول اللّٰه وَلالخفِ في قلت: والكتاب المذكور مشهور بيد ذرية تميم، وقد اليافوخ، فقال: إِنْ كَانَ فِي شَيءٍ مِنَ الدَّوَاءِ خَيْرٌ فَهْوَ فِي هَذِهِ الحِجَامَةِ يَا بَنِي بَيَاضَةَ أَنْكِحُوا أَبَا …"
