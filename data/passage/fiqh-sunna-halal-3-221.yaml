text: "… الزوجين بالآخر. وهذا الحل مشترك بينهما، فيحل للزوج من زوجته ما يحل لها منه.. وهذا الاستمتاع حق للزوجين، ولا يحصل إلا بمشاركتها معّا، لأنه لا يمكن أن ينفرد به أحدهما. - حرمة المصاهرة : أي أن الزوجة تحرم على آباء …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 221، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
