label: { ar: "صحيح مسلم 552 — مغفرة ما تقدم من الذنب", en: "Sahih Muslim 552 — forgiveness of past sins", ur: "صحیح مسلم 552 — پچھلے گناہوں کی مغفرت", es: "Sahih Muslim 552 — Perdón de los pecados pasados", fr: "Sahih Muslim 552 — pardon des péchés passés", tr: "Sahih Muslim 552 — Geçmiş günahların affı", id: "Sahih Muslim 552 — Pengampunan dosa masa lalu" }
text: "حَدَّثَنِي أَبُو الطَّاهِرِ، وَهَارُونُ بْنُ سَعِيدٍ الأَيْلِيُّ، قَالاَ أَخْبَرَنَا ابْنُ وَهْبٍ، عَنْ أَبِي صَخْرٍ، أَنَّ عُمَرَ بْنَ إِسْحَاقَ، مَوْلَى زَائِدَةَ حَدَّثَهُ عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ يَقُولُ \" الصَّلَوَاتُ الْخَمْسُ وَالْجُمُعَةُ إِلَى الْجُمُعَةِ وَرَمَضَانُ إِلَى رَمَضَانَ مُكَفِّرَاتٌ مَا بَيْنَهُنَّ إِذَا اجْتَنَبَ الْكَبَائِرَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 552، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 552 (The Book of Purification), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 552، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato del Sahih Muslim, n.º 552 (El Libro de la Purificación), habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 552 (Le Livre de la Purification), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sahih Müslim'de 552 numaralı hadis, geçmiş günahların affedilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 552, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
