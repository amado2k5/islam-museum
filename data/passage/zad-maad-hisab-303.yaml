label: { ar: "زاد المعاد لابن القيم ص 303 — عدد الحسنات، كتابة الحسنات", en: "Ibn al-Qayyim's Zad al-Ma'ad, p. 303 — a stated number of good deeds; the writing of good deeds", ur: "زاد المعاد، ابن القیم ص 303 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… اللَّهُ وَحْدَهُ لَا شَريكَ لَهُ، لَهُ المُلْكُ، وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، كَتَبَ اللَّهُ بِهَا عَشْرَ حَسَنَاتٍ، ومَحَا عَنْهُ بها عَشْرَ سَيِّئَاتٍ، وَكَانتْ كَعِدْل عَشْرِ رقَابٍ، وَأَجَارهُ اللَّهُ يَوْمَهُ مِنَ الشَّيْطَانِ الرَّجِيمِ، وَإِذَا أَمْسَى فَمِثْلُ ذلِكَ حَتَّى يُصْبِحَ …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 303، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 303, that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 303 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
