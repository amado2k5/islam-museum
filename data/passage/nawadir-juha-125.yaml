label: { ar: "نوادر جحا الكبرى، ص 59 — «ليفهم الناس مقدار ما أتعذب»", en: "Nawadir Juha al-Kubra, p. 59 — 'So That People Know How Much I Suffer'", ur: "نوادر جحا الکبریٰ، ص 59 — «تاکہ لوگ جانیں کہ میں کتنی اذیت اٹھاتا ہوں»", fr: "Nawadir Juha al-Kubra, p. 59 — « Pour que les gens sachent combien je souffre »", es: "Nawadir Juha al-Kubra, p. 59 — «Para que la gente sepa cuánto sufro»", tr: "Juha'nın Büyük Anekdotları, s. 59 — “Böylece insanlar çektiğim acıların boyutunu anlasınlar”", id: "Anekdot-anekdot Hebat Juha, hlm. 59 — “Agar orang-orang dapat memahami besarnya penderitaanku”" }
text: "… ليفهم الناس مِقدار ما أتعذب أخذ حماره إلى السوق، يريد بيعَه، فجاء أحدُهم، ومدّ يده إلى فِمه ليعرف يبتاع : يشتري. همياني، بكسر الهاء: كيس نقودي، محفظتي وأما الخرج فهو وعاء معروف يوضع على ظهر الدابة. وقد اختلط المعنى في …"
summary:
  ar: "حاول جحا في السوق بيع حماره، فعضّ أحد المشترين عند فحص أسنانه فعضّه الحمار، ورفس آخر؛ فقال الدلّال إن أحدًا لن يشتريه، فقال جحا إنه جاء به ليعلم الناس مقدار ما يتعذب. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  en: "At the market Juha tries to sell his donkey; one buyer checks its teeth and gets bitten; another gets kicked; the broker says no one will buy it, and Juha says he brought it so that people know what he suffers. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  ur: "بازار میں جحا نے اپنا گدھا بیچنا چاہا؛ ایک خریدار نے دانت دیکھے تو گدھے نے اسے کاٹ لیا؛ دوسرے کو دولتی پڑی؛ دلال نے کہا کہ اسے کوئی نہیں خریدے گا، تو جحا نے کہا کہ میں اسے اس لیے لایا ہوں کہ لوگ جانیں میں کتنی اذیت اٹھاتا ہوں۔ {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  fr: "Au marché, Juha essaie de vendre son âne; un acheteur examine ses dents et se fait mordre; un autre reçoit une ruade; le courtier dit que personne ne l'achètera, et Juha dit qu'il l'a amené pour que les gens sachent ce qu'il endure. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  es: "En el mercado, Juha intenta vender su burro; un comprador le mira los dientes y recibe un mordisco; otro recibe una coz; el corredor dice que nadie lo comprará, y Juha dice que lo trajo para que la gente sepa lo que él sufre. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
  tr: "Juha, eşeğini pazarda satmaya çalıştı. Alıcı eşeğin dişlerini incelediğinde, eşek karşılık olarak onu ısırdı ve bir başkasını da tekmeledi. Komisyoncu kimsenin onu almayacağını söyledi, ancak Juha, insanlara ne kadar acı çektiğini göstermek için onu getirdiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 59}"
  id: "Juha mencoba menjual keledainya di pasar. Ketika pembeli memeriksa giginya, keledai itu malah menggigitnya dan menendang pembeli lain. Makelar itu berkata tidak ada yang mau membelinya, tetapi Juha menjawab bahwa ia membawanya untuk menunjukkan kepada orang-orang betapa ia telah menderita. {cite:juha-nawadir-kubra-djuwaydi p. 59}"
