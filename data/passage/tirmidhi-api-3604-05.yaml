label: { ar: "جامع الترمذي 3604.05 — الأب والأبوة", en: "Jami' al-Tirmidhi 3604.05 — the father and fatherhood", ur: "جامع ترمذی 3604.05 — باپ اور والدیت" }
text: "حَدَّثَنَا يَحْيَى، أَخْبَرَنَا يَعْلَى بْنُ عُبَيْدٍ، قَالَ أَخْبَرَنَا يَحْيَى بْنُ عُبَيْدِ اللَّهِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَا مِنْ عَبْدٍ يَرْفَعُ يَدَيْهِ حَتَّى يَبْدُوَ إِبْطُهُ يَسْأَلُ اللَّهَ مَسْأَلَةً إِلاَّ آتَاهَا إِيَّاهُ مَا لَمْ يَعْجَلْ \". قَالُوا يَا رَسُولَ اللَّهِ وَكَيْفَ عَجَلَتُهُ قَالَ \" يَقُولُ قَدْ سَأَلْتُ وَسَأَلْتُ وَلَمْ أُعْطَ شَيْئًا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3604.05، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3604.05 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3604.05، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
