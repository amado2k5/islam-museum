text: "… النسب والرضاع، فبناتهن في التحريم كلهن، إلا بنات العمات والمخالات ويتات من نكحهن الآباء والأبناء، فإنهن محلَّلات وكذلك بنات الزوجة التي لم يدخل بها مسألة: ووطء الحرام محرَّم كما يحرم وطء الحلال والشبهة نصل أنواع الوطء فصل لا فرق بين …"
