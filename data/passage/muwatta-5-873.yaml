label: { ar: "الموطأ 873 — مالك: يدخل المعتكف المكان الذي يريد أن يعتكف فيه قبل غروب الشمس من الليلة التي يريد أن يعتكف فيها، حتى يستقبل اعتكافه أول الليلة", en: "Muwatta 873", es: "Muwatta 873", fr: "Muwatta 873", ur: "موطا 873", tr: "Al-Muwatta 873 — Malik: İtikaf yapacak kişi, itikaf yapmayı niyet ettiği gecenin güneş batmadan önce itikaf yapacağı yere girer ve itikafa gecenin başlangıcında başlar.", id: "Al-Muwatta 873 — Malik: Orang yang melaksanakan i'tikaf memasuki tempat yang akan ditujunya untuk melaksanakan i'tikaf sebelum matahari terbenam pada malam yang ditujunya, sehingga ia memulai i'tikafnya di awal malam." }
summary:
  ar: "قول لمالك: يدخل المعتكف المكان الذي يريد أن يعتكف فيه قبل غروب الشمس من الليلة التي يريد أن يعتكف فيها، حتى يستقبل اعتكافه أول الليلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (866). {cite:muwatta-maruf-1997 p.421}"
  tr: "Malik şöyle demiştir: İtikaf yapmaya niyetlenen kişi, itikafa girmek istediği gecenin güneş batmadan önce o yere girmeli ve itikafa gecenin başında başlamalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (866) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.421}"
  id: "Malik berkata: Orang yang berniat melaksanakan i'tikaf hendaknya memasuki tempat yang ingin ia jadikan tempat berdiam diri sebelum matahari terbenam pada malam ia berniat melaksanakannya, sehingga ia memulai i'tikafnya di awal malam. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (866). {cite:muwatta-maruf-1997 p.421}"
