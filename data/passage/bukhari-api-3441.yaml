label: { ar: "صحيح البخاري 3441 — الأب والأبوة", en: "Sahih al-Bukhari 3441 — the father and fatherhood", ur: "صحیح بخاری 3441 — باپ اور والدیت", es: "Sahih al-Bukhari 3441 — El padre y la paternidad" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ مُحَمَّدٍ الْمَكِّيُّ، قَالَ سَمِعْتُ إِبْرَاهِيمَ بْنَ سَعْدٍ، قَالَ حَدَّثَنِي الزُّهْرِيُّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ،، قَالَ لاَ وَاللَّهِ مَا قَالَ النَّبِيُّ لِعِيسَى أَحْمَرُ، وَلَكِنْ قَالَ \" بَيْنَمَا أَنَا نَائِمٌ أَطُوفُ بِالْكَعْبَةِ، فَإِذَا رَجُلٌ آدَمُ سَبْطُ الشَّعَرِ، يُهَادَى بَيْنَ رَجُلَيْنِ، يَنْطِفُ رَأْسُهُ مَاءً أَوْ يُهَرَاقُ رَأْسُهُ مَاءً فَقُلْتُ مَنْ هَذَا قَالُوا ابْنُ مَرْيَمَ، فَذَهَبْتُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3441، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3441 (Prophets), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3441، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3441 (Profetas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
