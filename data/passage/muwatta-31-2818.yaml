label: { ar: "الموطأ 2818 — بلال بن الحارث المزني: الكلمة من رضوان الله أو من سخطه", en: "Muwatta 2818", es: "Muwatta 2818", fr: "Muwatta 2818", ur: "موطا 2818", tr: "El-Muvatta 2818 — Bilal ibn el-Harith el-Muzani: Bir söz ya Allah'ı hoşnut eder ya da O'nu hoşnut etmez.", id: "Al-Muwatta 2818 — Bilal ibn al-Harith al-Muzani: Suatu perkataan itu menyenangkan Allah atau tidak menyenangkan-Nya." }
summary:
  ar: "يروي مالك عن محمد بن عمرو بن علقمة، عن أبيه، عن بلال بن الحارث المزني، أن رسول الله قال: إن الرجل ليتكلم بالكلمة من رضوان الله، ما كان يظن أن تبلغ ما بلغت، فيكتب الله له بها رضوانه إلى يوم يلقاه. وإن الرجل ليتكلم بالكلمة من سخط الله، ما كان يظن أن تبلغ ما بلغت، فيكتب الله له بها سخطه إلى يوم يلقاه. ويذكر المحقق نقلا عن ابن عبد البر أن الحديث في رواية مالك غير متصل، وأن رواية «عن أبيه عن جده» متصلة السند، وأن ابن عبد البر يرجحها، وقد مال إليها الدارقطني. {cite:muwatta-maruf-1997 p.581} {cite:muwatta-maruf-1997 p.582}"
  id: "Malik meriwayatkan dari Muhammad ibn Amr ibn Alqamah, dari ayahnya, dari Bilal ibn al-Harith al-Muzani, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: “Seseorang dapat mengucapkan sebuah kalimat yang menyenangkan Allah, tanpa menyadari dampak penuhnya, dan Allah akan mencatat keridhaan-Nya untuknya hingga hari ia bertemu dengan-Nya. Dan seseorang dapat mengucapkan sebuah kalimat yang tidak menyenangkan Allah, tanpa menyadari dampak penuhnya, dan Allah akan mencatat ketidakridhaan-Nya untuknya hingga hari ia bertemu dengan-Nya.” Editor menyebutkan, mengutip Ibnu Abd al-Barr, bahwa hadits dalam riwayat Malik tidak terhubung, sedangkan riwayat “dari ayahnya, dari kakeknya” memiliki sanad yang terhubung, dan bahwa Ibnu Abd al-Barr lebih menyukainya, dan al-Daraqutni juga cenderung kepadanya. {kutip:muwatta-maruf-1997 hal.581} {kutip:muwatta-maruf-1997 hal.582}"
