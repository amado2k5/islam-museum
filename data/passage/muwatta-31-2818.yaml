label: { ar: "الموطأ 2818 — بلال بن الحارث المزني: الكلمة من رضوان الله أو من سخطه", en: "Muwatta 2818" }
summary:
  ar: "يروي مالك عن محمد بن عمرو بن علقمة، عن أبيه، عن بلال بن الحارث المزني، أن رسول الله قال: إن الرجل ليتكلم بالكلمة من رضوان الله، ما كان يظن أن تبلغ ما بلغت، فيكتب الله له بها رضوانه إلى يوم يلقاه. وإن الرجل ليتكلم بالكلمة من سخط الله، ما كان يظن أن تبلغ ما بلغت، فيكتب الله له بها سخطه إلى يوم يلقاه. ويذكر المحقق نقلا عن ابن عبد البر أن الحديث في رواية مالك غير متصل، وأن رواية «عن أبيه عن جده» متصلة السند، وأن ابن عبد البر يرجحها، وقد مال إليها الدارقطني. {cite:muwatta-maruf-1997 p.581} {cite:muwatta-maruf-1997 p.582}"
