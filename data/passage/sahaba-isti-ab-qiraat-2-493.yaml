text: "… كنت أنزل فيه، فسألت عمير قَبْل رسول الله لَ القِ. عنه، فوجدته مستخفياً، ووجدت قريشاً إلباً عليه، وقال الواقديُّ : قدمها بعد بدر بيسير فنزل دار فتلطفت حتَّى دخلت عليه، فسلمت، ثم قلتُ : من القَرّاء وهي دار مَخْرمة بن …"
