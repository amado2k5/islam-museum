label: { ar: "الموطأ 86 — عروة يمسح ظهور الخفين لا بطونهما", en: "Muwatta 86" }
summary:
  ar: "أول أثر في باب العمل في المسح على الخفين. يرويه يحيى عن مالك عن هشام بن عروة أنه رأى أباه عروة يمسح على الخفين، وكان لا يزيد على مسح ظهورهما ولا يمسح بطونهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.79}"
