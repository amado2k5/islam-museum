label: { ar: "الموطأ 95 — علي يرسل المقداد يسأل النبي عن المذي", en: "Muwatta 95", es: "Muwatta 95", fr: "Muwatta 95", ur: "موطا 95", tr: "El-Muvatta 95 — Ali, El-Mikdad'ı Peygamber'e boşalmadan önceki sıvı hakkında soru sorması için gönderir.", id: "Al-Muwatta 95 — Ali mengutus Al-Miqdad untuk bertanya kepada Nabi tentang cairan pra-ejakulasi" }
text: "إذا وجد ذلك أحدكم فلينضح فرجه بالماء وليتوضأ وضوءه للصلاة"
summary:
  ar: "أول حديث في باب الوضوء من المذي. يرويه يحيى عن مالك عن أبي النضر مولى عمر بن عبيد الله عن سليمان بن يسار عن المقداد بن الأسود: أمره علي بن أبي طالب أن يسأل له النبي عن الرجل يدنو من أهله فيخرج منه المذي، وقال إنه يستحي أن يسأله لأن عنده ابنته، فسأل المقداد، فأمر النبي من وجد ذلك أن ينضح فرجه بالماء ويتوضأ وضوءه للصلاة. ويخرّجه المحقق عند أبي داود (207) والنسائي (1/97) وابن ماجه (505) وابن خزيمة (21) وابن حبان (1101) وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الإسناد غير متصل لأن سليمان بن يسار لم يسمع من المقداد ولا من علي، إذ ولد بعد وفاة المقداد، وأن بينهما ابن عباس ⁦(التمهيد 21/202)⁩؛ ويذكر المحقق أن مسلماً (1/169) وابن خزيمة والنسائي رووه من طريق سليمان عن ابن عباس أن علياً أرسل المقداد، وأنه في الصحيحين من حديث محمد ابن الحنفية عن أبيه علي. {cite:muwatta-maruf-1997 p.82} {cite:muwatta-maruf-1997 p.83}"
  tr: "Boşalma öncesi sıvıdan sonra abdest alma konusundaki bölümün ilk hadisi, Yahya'nın Malik'ten, o da Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, o da Süleyman ibn Yasar'dan, o da Mikdad ibn el-Esved'den rivayet ettiği hadistir: Ali ibn Ebu Talib, Peygamber'e karısına yaklaştığında boşalma öncesi sıvı gelen bir adam hakkında sormasını emretti ve kızı yanında olduğu için sormaya çekindiğini söyledi. Bunun üzerine Mikdad'a sordu ve Peygamber, bunu yaşayan herkesin cinsel organlarına su serpmesini ve namaz kılar gibi abdest almasını emretti. Araştırmacı, bu hadisi Ebu Davud (207), el-Nesai (1/97), İbn Majah (505), İbn Huzeyme (21), İbn Hibban (1101) ve Ahmed'e, Malik'in sahabelerinin rivayet zincirleri aracılığıyla dahil etmiştir. İbn Abdülberr'den rivayet edildiğine göre, rivayet zinciri kesintisiz değildir çünkü Süleyman ibn Yasar, Mikdad'dan veya Ali'den bir şey duymamıştır; zira Mikdad'ın ölümünden sonra doğmuştur ve aralarında İbn Abbas vardır (el-Temhid 21/202). Araştırmacı, Müslim (1/169), İbn Huzeyme ve Nesai'nin, Süleyman aracılığıyla İbn Abbas'tan rivayet ederek Ali'nin Mikdad'ı gönderdiğini ve bunun iki Sahih'te (Buhari ve Müslim) Muhammed ibn Hanefîye'den, babası Ali'den rivayetle geçtiğini belirtmektedir."
  id: "Hadits pertama dalam bab tentang wudhu setelah keluarnya cairan pra-ejakulasi. Diriwayatkan oleh Yahya dari Malik dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Sulayman ibn Yasar dari al-Miqdad ibn al-Aswad: Ali ibn Abi Talib memerintahkannya untuk bertanya kepada Nabi tentang seorang pria yang mendekati istrinya dan mengeluarkan cairan pra-ejakulasi, dan dia berkata bahwa dia malu untuk bertanya karena putrinya bersamanya. Maka dia bertanya kepada al-Miqdad, dan Nabi memerintahkan siapa pun yang mengalami hal ini untuk memercikkan air ke kemaluannya dan berwudhu seperti untuk salat. Peneliti memasukkannya dalam Abu Dawud (207), al-Nasa’i (1/97), Ibn Majah (505), Ibn Khuzaymah (21), Ibn Hibban (1101), dan Ahmad melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa sanadnya tidak berkesinambungan karena Sulaiman bin Yasar tidak mendengar dari al-Miqdad atau dari Ali, karena ia lahir setelah wafatnya al-Miqdad, dan terdapat Ibnu Abbas di antara mereka (al-Tamhid 21/202). Peneliti menyebutkan bahwa Muslim (1/169), Ibnu Khuzaymah, dan al-Nasa'i meriwayatkannya melalui Sulaiman atas otoritas Ibnu Abbas, bahwa Ali mengutus al-Miqdad, dan bahwa hal itu terdapat dalam dua kitab Sahih (Bukhari dan Muslim) atas otoritas Muhammad bin al-Hanafiyyah atas otoritas ayahnya, Ali. {cite:muwatta-maruf-1997 p.82} {cite:muwatta-maruf-1997 p.83}"
