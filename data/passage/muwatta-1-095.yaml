ref: "1.95"
label: { ar: "الموطأ 95 — علي يرسل المقداد يسأل النبي عن المذي", en: "Muwatta 95" }
text: "إذا وجد ذلك أحدكم فلينضح فرجه بالماء وليتوضأ وضوءه للصلاة"
summary:
  ar: "أول حديث في باب الوضوء من المذي. يرويه يحيى عن مالك عن أبي النضر مولى عمر بن عبيد الله عن سليمان بن يسار عن المقداد بن الأسود: أمره علي بن أبي طالب أن يسأل له النبي عن الرجل يدنو من أهله فيخرج منه المذي، وقال إنه يستحي أن يسأله لأن عنده ابنته، فسأل المقداد، فأمر النبي من وجد ذلك أن ينضح فرجه بالماء ويتوضأ وضوءه للصلاة. ويخرّجه المحقق عند أبي داود (207) والنسائي (1/97) وابن ماجه (505) وابن خزيمة (21) وابن حبان (1101) وأحمد من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الإسناد غير متصل لأن سليمان بن يسار لم يسمع من المقداد ولا من علي، إذ ولد بعد وفاة المقداد، وأن بينهما ابن عباس (التمهيد 21/202)؛ ويذكر المحقق أن مسلماً (1/169) وابن خزيمة والنسائي رووه من طريق سليمان عن ابن عباس أن علياً أرسل المقداد، وأنه في الصحيحين من حديث محمد ابن الحنفية عن أبيه علي. {cite:muwatta-maruf-1997 p.82} {cite:muwatta-maruf-1997 p.83}"
