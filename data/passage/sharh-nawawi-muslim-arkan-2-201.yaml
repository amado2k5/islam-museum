text: "… بن محمد وهو بالقاف وقد قدمنا فى الفصول أنه ليس فى الصحيحين وافد بالفاء بل كله بالقاف. وفيه أبو خالد الاحمر وأبو مالك عن أبيه فأبو مالك اسمه سعد بن طارق وطارق صحابى وقد تقدم ذكرهما فى باب أركان الاسلام …"
