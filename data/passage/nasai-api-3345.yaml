label: { ar: "سنن النسائي 3345 — الأجران", en: "Sunan al-Nasa'i 3345 — the double reward", ur: "سنن نسائی 3345 — دوہرا اجر" }
text: "أَخْبَرَنَا هَنَّادُ بْنُ السَّرِيِّ، عَنْ أَبِي زُبَيْدٍ، عَبْثَرِ بْنِ الْقَاسِمِ عَنْ مُطَرِّفٍ، عَنْ عَامِرٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ أَعْتَقَ جَارِيَتَهُ ثُمَّ تَزَوَّجَهَا فَلَهُ أَجْرَانِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3345، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3345 (The Book of Marriage), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3345، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
