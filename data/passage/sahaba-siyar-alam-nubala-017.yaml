text: "و بكر العلاء بن الحضرمي. فخرج من المدينة في ستة عشر راكبا، وكتب له كتابا أن ينفر معه كل من مر به من المسلمين إلى عدوهم. فسار العلاء فيمن تبعه حتى لحق بحصن جواثى فقاتلهم، فلم يفلت منهم أحد. ثم"
