text: "… ابن مردويه أن بعض المنافقين اتهم رسول اللّٰه ص بنى فنزلت.والفلول هو الخيانة فى المغتم والسرقة من الغنيمة قبل القسمة، وكل من خان فى شىء خفية فقد غل، القراءة بفتح الياء هي قراءة. المصحف، وهى. قراءة ابن عباس وألى عبد …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 86، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 86, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 86 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
