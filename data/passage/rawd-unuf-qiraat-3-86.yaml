text: "… ابن مردويه أن بعض المنافقين اتهم رسول اللّٰه ص بنى فنزلت.والفلول هو الخيانة فى المغتم والسرقة من الغنيمة قبل القسمة، وكل من خان فى شىء خفية فقد غل، القراءة بفتح الياء هي قراءة. المصحف، وهى. قراءة ابن عباس وألى عبد …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 86، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 86, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 86 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Rawd al-Unuf de al-Suhayli, volumen 3, pág. 86, que menciona las lecturas del Corán, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre « al-Rawd al-Unuf » d'al-Suhayli (tome 3, p. 86), numérisé, mentionnant les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suhayli'nin \"El-Ravd El-Enf\" adlı resimli cildinin 3. cildinin 86. sayfasından, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları hakkında bir alıntı; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Rawd Al-Anf karya Al-Suhayli, jilid bergambar 3, halaman 86, membahas bacaan Al-Quran, penyusunan Al-Quran, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
