text: "… إِلَى قُرَيْشِ، فَقَالَ : يَا مَعْشَرَ قَرَيْشٍ ؛ إِنَّى جِئْتُ كِسْرَى فِي مُلْكِهِ، وَحِئْتُ قَيْصَرَ، وَالنَّجَاشِيّ فِي مُلْكِهمَا، وَاللهِ مَا رَأَيْتُ مَلِكَّا قَط يُعَظَّمُهُ أَصْحَابُهُ مَا يُعَظَّمُ أَصْحَابَ مُحَمَّدٍ، إِنَّهُ مَا تَنَخْمٌ نَخَامَةً إِلَّا وَقَعَتْ فِي كَفِّ رَجُلٍ مِنْهُمْ، فَدَلَّكَ …"
