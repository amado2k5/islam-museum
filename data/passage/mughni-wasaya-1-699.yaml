text: "… الأرض، كالحكم فيما إذا غرس فيها... والشفعة عليه أحكام المياه.:. إذا أبق العبد، فحصل فى يدحاكم فأقام سيده بينة،... فى الموضع الذى حكمنا بإسلام اللقيط إنما يثبت ذلك ظاهرا لا يقينا حكم العطايا فى مرض الموت المخوف، حكم الوصية فى …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 1، ص 699، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 1, p. 699, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 1، ص 699 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Mughni de Ibn Qudama, volumen 1, pág. 699, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Mughni d'Ibn Qudama (tome 1, p. 699) mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 1. cildinin 699. sayfasından, vasiyetname ve ölüm anına dair bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Jilid 1, halaman 699, yang menyebutkan wasiat terakhir dan saat kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
