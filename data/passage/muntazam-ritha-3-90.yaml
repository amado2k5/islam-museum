text: "… بيضاء والكتابة سوداء كأنه كتب بحبر. قال فقذفناها فى البحر ومنع الناس ان يصطاد من ذلك الموضع حتى أوغلنا. توفى ابو على العطار فى هذه السنة. توفى فى الحبس فى صفر هذه السنة فرثاه العبشمى فقال. لبن اسمعيل بن لاحق …"
