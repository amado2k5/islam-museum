text: "… حروفه، ولا يخلط به ما ليس منه كعدد الآيات والسجدات والعشرات والوقوف واختلاف القراءات ومعاني الآيات. وقد أخرج ابن أبي داود عن الحسن وابن ما قالاسيرين أ :لا بأس بنقط المصاحف.وأخرج عن ربيعة بن أبي عبد ال رحمن أنه قال …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 4، ص 553، يذكر قراءات القرآن، وجمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 4, p. 553, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 4، ص 553 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 4, pág. 553, que menciona las lecturas del Corán, la colección del Corán y los códices, y las marcas de puntos y vocales del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
