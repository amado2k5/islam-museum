label: { ar: "الموطأ 901 — ابن عباس والمسور بن مخرمة اختلفا بالأبواء في غسل المحرم رأسه؛ فأرسل ابن عباس عبد الله بن حنين إلى أبي أيوب الأنصاري فوجده يغتسل بين القرنين", en: "Muwatta 901" }
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن إبراهيم بن عبد الله بن حنين عن أبيه، أن عبد الله بن عباس والمسور بن مخرمة اختلفا بالأبواء، فقال ابن عباس: يغسل المحرم رأسه، وقال المسور: لا يغسل المحرم رأسه. فأرسله ابن عباس إلى أبي أيوب الأنصاري، فوجده يغتسل بين القرنين مستور بثوب، فسأله كيف كان رسول الله يغسل رأسه وهو محرم، فطأطأ أبو أيوب الثوب حتى بدا رأسه، ثم صب عليه الماء وحرك رأسه بيديه، وقال: هكذا رأيت رسول الله يفعل. ويذكر المحقق أن نافعاً سقط من بعض النسخ، وأن ابن عبد البر رأى ذكره خطأ من يحيى بن يحيى. {cite:muwatta-maruf-1997 p.434} {cite:muwatta-maruf-1997 p.435}"
