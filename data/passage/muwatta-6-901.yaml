label: { ar: "الموطأ 901 — ابن عباس والمسور بن مخرمة اختلفا بالأبواء في غسل المحرم رأسه؛ فأرسل ابن عباس عبد الله بن حنين إلى أبي أيوب الأنصاري فوجده يغتسل بين القرنين", en: "Muwatta 901", es: "Muwatta 901", fr: "Muwatta 901", ur: "موطا 901", tr: "El-Muvatta 901 — İbn Abbas ve El-Miswar ibn Makhrama, El-Abwa’da bir hacının başını yıkaması konusunda anlaşmazlığa düştüler; bunun üzerine İbn Abbas, Abdullah ibn Huneyn'i Ebu Eyyub el-Ensari'ye gönderdi ve onu iki boynuz arasında yıkama yaparken buldu.", id: "Al-Muwatta 901 — Ibn Abbas dan Al-Miswar ibn Makhrama berselisih pendapat di Al-Abwa’ mengenai seorang peziarah yang mencuci kepalanya; maka Ibn Abbas mengutus Abdullah ibn Hunayn kepada Abu Ayyub Al-Ansari, dan ia mendapati Abdullah ibn Hunayn mencuci di antara kedua tanduknya." }
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن إبراهيم بن عبد الله بن حنين عن أبيه، أن عبد الله بن عباس والمسور بن مخرمة اختلفا بالأبواء، فقال ابن عباس: يغسل المحرم رأسه، وقال المسور: لا يغسل المحرم رأسه. فأرسله ابن عباس إلى أبي أيوب الأنصاري، فوجده يغتسل بين القرنين مستور بثوب، فسأله كيف كان رسول الله يغسل رأسه وهو محرم، فطأطأ أبو أيوب الثوب حتى بدا رأسه، ثم صب عليه الماء وحرك رأسه بيديه، وقال: هكذا رأيت رسول الله يفعل. ويذكر المحقق أن نافعاً سقط من بعض النسخ، وأن ابن عبد البر رأى ذكره خطأ من يحيى بن يحيى. {cite:muwatta-maruf-1997 p.434} {cite:muwatta-maruf-1997 p.435}"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, dari Ibrahim ibn Abdullah ibn Hunayn, dari ayahnya, bahwa Abdullah ibn Abbas dan Al-Miswar ibn Makhrama berselisih pendapat di Al-Abwa'. Ibn Abbas berkata: \"Jamaah haji yang sedang ihram hendaknya mencuci kepalanya,\" sedangkan Al-Miswar berkata: \"Jamaah haji yang sedang ihram tidak perlu mencuci kepalanya.\" Maka Ibn Abbas mengutusnya kepada Abu Ayyub Al-Ansari, dan ia mendapati Abu Ayyub sedang mandi di antara dua tanduk, tertutup kain. Ia bertanya kepadanya bagaimana Rasulullah shalla Allahu alaihi wa sallam biasa mencuci kepalanya saat ihram. Abu Ayyub menurunkan kain hingga kepalanya terlihat, kemudian menuangkan air ke atasnya dan menggerakkan kepalanya dengan tangannya, sambil berkata: \"Beginilah cara saya melihat Rasulullah shalla Allahu alaihi wa sallam melakukannya.\" Penyunting menyebutkan bahwa Nafi' dihilangkan dari beberapa salinan, dan bahwa Ibnu Abd Al-Barr menganggap penyertaan namanya sebagai kesalahan dari Yahya bin Yahya. {cite:muwatta-maruf-1997 p.434} {cite:muwatta-maruf-1997 p.435}"
