label: { ar: "سنن أبي داود 3972 — كتاب الحروف والقراءات، قراءات القرآن", en: "Sunan Abi Dawud 3972 — the Book of the Letters and the Readings; the readings of the Qur'an", ur: "سنن ابی داؤد 3972 — کتاب الحروف والقراءات، قرآن کی قراءتیں", es: "Sunan Abi Dawud 3972 — El Libro de las Letras y las Lecturas; las lecturas del Corán", fr: "Sunan Abi Dawud 3972 — le Livre des Lettres et des Lectures; les lectures du Coran", tr: "Sunan Abi Davud 3972 — Harfler ve Okumalar Kitabı, Kur'an Okumaları", id: "Sunan Abi Dawud 3972 — Kitab Huruf dan Bacaan, Bacaan Al-Qur'an" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عِيسَى، حَدَّثَنَا مُعْتَمِرٌ، قَالَ سَمِعْتُ أَبِي قَالَ، سَمِعْتُ أَنَسَ بْنَ مَالِكٍ، يَقُولُ قَالَ النَّبِيُّ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ وَالْهَرَمِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3972، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Abi Dawud, no. 3972 (Dialects and Readings of the Qur'an (Kitab Al-Huruf Wa Al-Qira'at)), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 3972، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3972 (Dialectos y lecturas del Corán (Kitab Al-Huruf Wa Al-Qira'at)), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Abi Dawud, n° 3972 (Dialectes et lectures du Coran (Kitab Al-Huruf Wa Al-Qira'at)), mentionne les différentes lectures du Coran. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "Sunan Abi Davud'da yer alan 3972 numaralı hadis, Kur'an'ın farklı okunuşlarından bahsetmektedir. Bu hadis, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3972, menyebutkan berbagai macam bacaan Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
