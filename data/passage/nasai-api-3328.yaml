label: { ar: "سنن النسائي 3328 — أطوار خلق الجنين", en: "Sunan al-Nasa'i 3328 — the stages of the embryo", ur: "سنن نسائی 3328 — جنین کے مراحل" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ بَشَّارٍ، عَنْ مُحَمَّدٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي الْفَيْضِ، قَالَ سَمِعْتُ عَبْدَ اللَّهِ بْنَ مُرَّةَ الزُّرَقِيَّ، عَنْ أَبِي سَعِيدٍ الزُّرَقِيِّ، أَنَّ رَجُلاً، سَأَلَ رَسُولَ اللَّهِ عَنِ الْعَزْلِ فَقَالَ إِنَّ امْرَأَتِي تُرْضِعُ وَأَنَا أَكْرَهُ أَنْ تَحْمِلَ. فَقَالَ النَّبِيُّ \" إِنَّ مَا قَدْ قُدِّرَ فِي الرَّحِمِ سَيَكُونُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3328، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 3328 (The Book of Marriage), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 3328، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
