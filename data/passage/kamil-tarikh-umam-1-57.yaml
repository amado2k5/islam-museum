text: "… ثمّ خرجنا، فمررِنا بمجلس لهم، فعرفني بعضهم، فصرخ بأعلى صوته : هذا عمرو بن أميّة! فثار أهل مكّة إلينا وقالوا : ما جاء إلا لشرّ، وكان فاتكاً متشيطناً في الجاهليّة، فقلت لصاحبي: النجاء! هذا الذي كنت أحذر، أمّا أبو سفيان …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 57، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
