label: { ar: "الموطأ 1607 — مالك: من حلف ألا يطأ امرأته يوما أو شهرا ثم مكث حتى ينقضي أكثر من أربعة أشهر فليس ذلك إيلاء، والإيلاء في أكثر من أربعة أشهر", en: "Muwatta 1607" }
summary:
  ar: "يقول مالك ومن حلف أن لا يطأ امرأته يوما أو شهرا، ثم مكث حتى ينقضي أكثر من الأربعة الأشهر، فلا يكون ذلك إيلاء، وإنما يوقف في الإيلاء من حلف على أكثر من الأربعة الأشهر. فأما من حلف أن لا يطأ امرأته أربعة أشهر، أو أدنى من ذلك، فلا أرى عليه إيلاء، لأنه إذا جاء الأجل الذي يوقف عنده خرج من يمينه، ولم يكن عليه وقف. {cite:muwatta-maruf-1997 p.67}"
