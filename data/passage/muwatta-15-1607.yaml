label: { ar: "الموطأ 1607 — مالك: من حلف ألا يطأ امرأته يوما أو شهرا ثم مكث حتى ينقضي أكثر من أربعة أشهر فليس ذلك إيلاء، والإيلاء في أكثر من أربعة أشهر", en: "Muwatta 1607", es: "Muwatta 1607", fr: "Muwatta 1607", ur: "موطا 1607", tr: "El-Muvatta 1607 — Malik: Bir kimse karısıyla bir gün veya bir ay boyunca cinsel ilişkiye girmemeye yemin ederse ve aradan dört aydan fazla zaman geçerse, bu ila’ (evlilik ilişkilerinden uzak durma yemini) sayılmaz. İla’, dört aydan fazla süreyle evlilik ilişkilerinden uzak durmak olarak tanımlanır.", id: "Al-Muwatta 1607 — Malik: Jika seseorang bersumpah untuk tidak berhubungan intim dengan istrinya selama sehari atau sebulan, dan kemudian lebih dari empat bulan berlalu, ini tidak dianggap sebagai ila’ (sumpah untuk tidak berhubungan intim). Ila’ didefinisikan sebagai tidak berhubungan intim selama lebih dari empat bulan." }
summary:
  ar: "يقول مالك ومن حلف أن لا يطأ امرأته يوما أو شهرا، ثم مكث حتى ينقضي أكثر من الأربعة الأشهر، فلا يكون ذلك إيلاء، وإنما يوقف في الإيلاء من حلف على أكثر من الأربعة الأشهر. فأما من حلف أن لا يطأ امرأته أربعة أشهر، أو أدنى من ذلك، فلا أرى عليه إيلاء، لأنه إذا جاء الأجل الذي يوقف عنده خرج من يمينه، ولم يكن عليه وقف. {cite:muwatta-maruf-1997 p.67}"
  tr: "Malik şöyle demiştir: Bir erkek karısıyla bir gün veya bir ay cinsel ilişkiye girmemeye yemin eder ve bu durumu dört aydan fazla sürdürürse, bu ila' (evlilik dışı ilişki yemini) sayılmaz. Aksine, ila' ancak dört aydan fazla süreyle yemin edenler için geçerlidir. Karısıyla dört ay veya daha az süreyle cinsel ilişkiye girmemeye yemin eden kişi için ise ila'nın geçerli olduğunu düşünmüyorum; çünkü hesap verme süresi dolduğunda yemininden kurtulmuş olur ve artık böyle bir hesap verme söz konusu olmaz. {cite:muwatta-maruf-1997 s.67}"
  id: "Malik berkata: Jika seorang pria bersumpah untuk tidak berhubungan badan dengan istrinya selama sehari atau sebulan, dan kemudian tetap dalam keadaan itu selama lebih dari empat bulan, ini tidak termasuk ila' (sumpah untuk tidak berhubungan badan). Sebaliknya, ila' hanya berlaku bagi orang yang bersumpah untuk lebih dari empat bulan. Adapun orang yang bersumpah untuk tidak berhubungan badan dengan istrinya selama empat bulan atau kurang, saya tidak menganggap ila' berlaku baginya, karena ketika jangka waktu di mana ia dimintai pertanggungjawaban tiba, ia dibebaskan dari sumpahnya, dan tidak ada pertanggungjawaban seperti itu. {cite:muwatta-maruf-1997 p.67}"
