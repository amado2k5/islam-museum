text: "… عبد الوهاب نَكَلَّالهُ كما في مجموع رسائله : قولك: أول واجب على كل ذكر وأنثى : النظر في الوجود، ثم معرفة العقيدة، ثم علم التوحيد. وهذا خطأ، وهو من علم الكلام الذي أجمع السلف على ذمه. وإنما الذي أتت به …"
summary:
