  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 2, p. 71, whose wording mentions a duty laid on every Muslim, the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
