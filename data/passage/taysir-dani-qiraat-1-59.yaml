text: "… و حينئذ، وشبهه فصل : واعلم ان جميع ما يسهله حمزة من الهمزات فانما يُراعى فيه خطّ المصحف دون القياس كما قدّ مناه وقد اختلف اصحابنا فى تسهيل ما يتوسّط من الهمزات بدخول الزوائد عليهن نحو قوله أفَأَنْتَ، و فَبِأَىّ …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 1، ص 59، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 1, p. 59, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 1، ص 59 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Dani, al-Taysir fi al-Qira'at al-Sab', volumen 1, pág. 59, que menciona la colección del Corán y los códices, la ortografía del mushaf; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Dani, al-Taysir fi al-Qira'at al-Sab', volume 1, page 59, mentionnant la collection du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dani'nin \"Al-Taysir fi al-Qira'at al-Sab'a\" (Yedi Kıraat'ın Kolaylaştırılması) adlı eserinin 1. cildinin 59. sayfasından bir alıntı, Kur'an'ın derlenmesini, el yazmalarını ve yazısını ele almaktadır; bu alıntı, makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an kıraatleri, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan) karya Al-Dani, Volume 1, halaman 59, membahas penyusunan Al-Quran dan manuskripnya, serta aksara Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
