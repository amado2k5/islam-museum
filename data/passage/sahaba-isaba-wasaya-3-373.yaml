text: "… جبينه عرقًا وهو يقول عودى بدّا. كل شء يُؤدى، لأخرجن منها وجسدى يقدَى '. ولما حضرته الوفاة قال لقومه : إذا أنامتّ فاحفروا قبرى بعد ثلاث فإنسكم ترون عيْراً يطوو بقبرى، وإذا رأيتم ذلك فإنى أخبركم بما فاجتموا، فلما رأوا …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 3، ص 373، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 3, p. 373, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 3، ص 373 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de la obra Al-Isaba de Ibn Hajar, volumen 3, pág. 373, que menciona un lecho de muerte y las últimas horas, un entierro, una tumba o un lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 3, p. 373), mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 3. cildinin 373. sayfasından alınan bir alıntıda, ölüm ve vefat anı, defin, mezar ve istirahat yeri konularına değinilmektedir; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına göre yaklaşık kırk kelimeden oluşan bu alıntı, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 3, halaman 373, menyebutkan saat kematian dan wafat, penguburan, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
