label: { ar: "الموطأ 2615 — مالك: لبيت بركة أحب إلى عمر من عشرة أبيات بالشام", en: "Muwatta 2615", es: "Muwatta 2615", fr: "Muwatta 2615", ur: "موطا 2615", tr: "El-Muvatta 2615 — Malik: Barakah'ın evi, Ömer için Suriye'deki on evden daha değerlidir.", id: "Al-Muwatta 2615 — Malik: Rumah Barakah lebih dicintai Umar daripada sepuluh rumah di Suriah." }
summary:
  ar: "قال مالك: بلغني أن عمر بن الخطاب قال: لَبيتٌ بِركبة أحب إليّ من عشرة أبيات بالشام. قال مالك: يريد لطول الأعمار والبقاء، ولشدة الوباء بالشام. ويذكر المحقق أن ركبة واد من أودية الطائف. {cite:muwatta-maruf-1997 p.477}"
  tr: "Malik şöyle dedi: Ömer ibn el-Hattab'ın şöyle dediğini duydum: \"Rukbe'deki bir ev bana Suriye'deki on evden daha değerlidir.\" Malik dedi ki: Bununla, Rukbe'nin uzun ömür ve Suriye'deki veba salgınının şiddetini kastetmiştir. Araştırmacı, Rukbe'nin Taif'te bir vadi olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.477}"
  id: "Malik berkata: Saya mendengar bahwa Umar ibn al-Khattab berkata: “Satu rumah di Rukbah lebih berharga bagi saya daripada sepuluh rumah di Suriah.” Malik berkata: Maksudnya karena umur panjang dan harapan hidup yang tinggi, dan karena parahnya wabah penyakit di Suriah. Peneliti menyebutkan bahwa Rukbah adalah sebuah lembah di Ta’if. {cite:muwatta-maruf-1997 p.477}"
