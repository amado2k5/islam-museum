text: |-
  ووت بلترك وحيا بالعمل اه
  ٢٤٨
  ⁦(با ب الدال)⁩
  وقدعادله بعدما كان أعرض عنه والمعاد المصير والمرجع والآخرة معاد الخاق وعدت
  المريض أعوده عيادة والعادة معروفة وابمع عاد وعادات تقولمنه عاده واعتاده وتعوّده
  أى صار عادة له وعوّد كلبه الصيد فتعوّده واستعدته الشئ فأعاده اذا سأاته أن يفعله ثانيا
  وفلان معيد لهذا الامر أى مطيق له والمعيد الفعل الذى قد ضرب فى الابل حرات والمعاودة
  الرجوع الى الامر الأول يقال الشجاع معاودلانه لايمل المراس وعاودته الجى وعاوده
  بالمسألة أى سأله هرة بعد أخرى وتعاود القوم فى الحرب وغيرها اذا عاد كل فريق الى صاحبه
  والعوادة بالضم ما أعبد من الطعام بعدما أكل منه مرة وعواد بعن عد منسل نزال
  وتراك ويقال أبضاعدفات للعندناء واداحسنا بالفتح أى ما تحب والعائدة المطف
  والمنفعة يقال هذا الشى أعود عليك من كذا أى أنفع وفلان ذوصفح وعائدة أى ذوعذو
  وتعطف والعود المسن من الابل وه والذى جاوزف السن البازل والخلف وجعه عودة وقد
  عوّد البعبر تعويداوفى المثل ان جرجر العود فزده وقرا والناقة عودة ويقال فى المثل زاحم!
  بعودأودع أى استعن على وبك بأهل السن والمعرفة فانّ رأى الشيخّ خير من مشهد
  الغلام والعود العاريق القديم وقال عود على عودلأقوام أول ١ أى بعيرم-ن على
  طريق قديم وربما قالواسوددءود أى قديم قال الطرماح
  هل الجدالا السودد العود والندى • ورأب الثأى والسبر عند المواطن
  والعودبا اضم من الخشب واحد العيدان والاعواد والعود الذى بضرب به واله ودالذى
  يتبخر به وعاد قبيلة وه-م قوم هو د عليه ال_لام وشى عادى" أى قديم كانه منسوب الى عاد
  ويقال ما أدرى أى"عادهو غير مصروف أى أى الناس هو والعيدما اعتادك .ن هم أو غيره
  قال الشاعر فااقلب يعتاده من حبهاعيد وقال آخر
  أمسى باسماءهذا القلب معمودا • اذا أقول صدا يعناده عيدا
  والعيد واحد الاعياد وانماجع بالياه وأصله الواوللزومها فى الواحدوية ال للفرق بينه وبين
  أعواد الحشب وقدعيدوا أى شهدوا العيد وقول الشاعر
  يطوى ابن سلمى بها عن واكب بعدا عيدية أرحنت فيها الدنانير
  هى نوق من كرام النجائب. نسوبة الى فحل منجب وعادياء اسم رجل قال الخرين نولب
  هلا سألت بعادياء وبيته • وانخل وانلهر الذى لم يمنع
  فان كان تقديره فاءسلاء ف، ومن باب المعتل يذكر هنالك والعيدان بالفتح الطوال من النخل
  الواحدة عيد انة وهذا ان كان فعلان فهو من هذا البساب وان كان فيه الافهو من باب النون
  ⁦(عهد)⁩ العهد الامان والمين والموثق والذمة والحفاظ والوصية وقد عهدت اليه أى
  أوصيته ومنه اشتق العهد الذى بكتب للمولاة وتقول على عهد اللّه لا فعلن كذا وفى الامر
  عهدة بالضم أى لم يحكم بعدو فى عن له عهدة أى ضعف وة واهم لاعهدة أى لارجعة يقال
  أبيعث المسى لاعهدة أى يتملس وينفات فلا يرجع الى والعهدة كتاب الشراء ويقال عهدته
  على ذلان أى ما أدرك فيه من درك فاصلا -ه عليه والعهد بالنصب المنزل الذى لايزال القوم
  اذا انتأواعنه رجعوا اليه وكذلك المعهد والمعهود الذى عهدوءرف وعهدته بمكان كذا
  اى
