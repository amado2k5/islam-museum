text: "وأقرب منه إلى الصحَّة ما قاله جماعةٌ من أنه كان قبله جنٌّ إلا أنَّهم هَلَكُوا، أو لم يكن لهم عقبٌ سواه"
summary:
  ar: "في تفسير قصة إبليس يعرض الألوسي رأي من قال إن إبليس أصل الجن، ثم يقول إن الأقرب إلى الصحة قول جماعة بأنه كان قبله جن هلكوا أو لم يكن لهم عقب غيره، فجن اليوم كلهم من ذريته، كما أن نوحاً أبو الإنس على المشهور."
  en: "In explaining the story of Iblis, al-Alusi first sets out the view that Iblis is the origin of the jinn, then says closer to sound is the view of a group that jinn existed before him but perished or left no offspring other than him, so today's jinn all descend from him, as Noah is the father of humankind on the common account."
