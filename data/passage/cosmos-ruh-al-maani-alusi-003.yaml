text: "وأقرب منه إلى الصحَّة ما قاله جماعةٌ من أنه كان قبله جنٌّ إلا أنَّهم هَلَكُوا، أو لم يكن لهم عقبٌ سواه"
summary:
  ar: "في تفسير قصة إبليس يعرض الألوسي رأي من قال إن إبليس أصل الجن، ثم يقول إن الأقرب إلى الصحة قول جماعة بأنه كان قبله جن هلكوا أو لم يكن لهم عقب غيره، فجن اليوم كلهم من ذريته، كما أن نوحاً أبو الإنس على المشهور."
  en: "In explaining the story of Iblis, al-Alusi first sets out the view that Iblis is the origin of the jinn, then says closer to sound is the view of a group that jinn existed before him but perished or left no offspring other than him, so today's jinn all descend from him, as Noah is the father of humankind on the common account."
  es: "Al explicar la historia de Iblis, al-Alusi expone primero la opinión de que Iblis es el origen de los genios, y luego dice que más acertada es la opinión de un grupo que sostiene que los genios existieron antes que él, pero perecieron o no dejaron descendencia aparte de él, por lo que todos los genios de hoy descienden de él, como Noé es el padre de la humanidad según la creencia popular."
  fr: "Pour expliquer l'histoire d'Iblis, al-Alusi présente d'abord l'opinion selon laquelle Iblis est à l'origine des djinns, puis affirme que l'opinion d'un groupe, selon laquelle les djinns existaient avant lui mais ont péri ou n'ont laissé aucune descendance autre que lui, est plus plausible; ainsi, tous les djinns d'aujourd'hui descendent de lui, tout comme Noé est, selon la tradition, le père de l'humanité."
