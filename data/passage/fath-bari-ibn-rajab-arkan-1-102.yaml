text: "… للو مَمَّ عَلَى رَجُلٍ وَهُوَ يَعِظُ أَخَاهُ فِي الْحَيَاء فَقَالَ : دَعْهُ؛ فَإِنَّ الْحَيَاءً مِنَ الإِيمَانِ. هذا المعنَى مرويٌّ عن النبيّ وَالِلِ من وجوهٍ كثيرةٍ، وقد سبقَ حديث أبي هريرَة: الحياءُ شعبةُ من الإيمانِ. والحياءُ نوعان: أحدُهما: غريزيٌّ، وهو خُلُقٌ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 102، يذكر شعب الإيمان، وما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 102, that mentions the branches of faith, what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 102 کا اقتباس جس میں ایمان کی شاخیں، جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 102, que menciona las ramas de la fe y lo que se considera parte de ella; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 1, p. 102) mentionnant les piliers de la foi, c'est-à-dire ce qui en fait partie. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. cildinin 102. sayfasından, imanın dallarını ve imanın ne olduğunu anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 1, halaman 102, yang menyebutkan cabang-cabang iman dan apa yang membentuk iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
