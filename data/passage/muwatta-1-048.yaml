label: { ar: "الموطأ 48 — ابن عمر: كان الرجال والنساء يتوضؤون جميعاً", en: "Muwatta 48", es: "Muwatta 48", fr: "Muwatta 48", ur: "موطا 48", tr: "El-Muvatta 48 — İbn Ömer: Erkekler ve kadınlar birlikte abdest alırlardı.", id: "Al-Muwatta 48 — Ibn Umar: Laki-laki dan perempuan biasa berwudhu bersama-sama" }
text: "إن كان الرجال والنساء في زمان رسول الله ليتوضؤون جميعاً"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، في باب الطهور للوضوء: كان الرجال والنساء في زمن النبي يتوضؤون جميعاً من إناء واحد. ويخرّجه المحقق عند البخاري (193) وأبي داود (79) والنسائي (1/57) وابن ماجه (381) وابن خزيمة (205) وابن حبان (1265) من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جمهور العلماء وفقهاء الأمصار على أنه لا بأس أن يتوضأ الرجل بفضل المرأة والمرأة بفضله، وأن الماء لا ينجسه شيء إلا ما ظهر فيه من النجاسات أو غلب عليه ⁦(التمهيد 14/165)⁩. {cite:muwatta-maruf-1997 p.58}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayetle, abdest temizliği bölümünde şöyle nakletmiştir: \"Peygamberimiz zamanında erkekler ve kadınlar tek bir kaptan birlikte abdest alırlardı.\" Bu hadis, Malik'in sahabelerinin rivayet zinciriyle Buhari (193), Ebu Davud (79), Nesai (1/57), İbn Majah (381), İbn Huzeyme (205) ve İbn Hibban'ın (1265) hadis külliyatlarında da bulunmaktadır. İbn Abdülberr'den rivayet edildiğine göre, çeşitli bölgelerdeki âlimlerin ve fıkıhçıların çoğunluğu, bir erkeğin bir kadının abdestinden kalan suyla abdest almasında veya tam tersinde bir erkeğin bir erkeğin abdestinden kalan suyla abdest almasında bir sakınca olmadığını ve suyun, içinde görünen veya onu baskın kılan şeylerden başka bir şeyle kirlenmediğini savunmaktadır (el-Temhid 14/165). {cite:muwatta-maruf-1997 s.58}"
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, dalam surah tentang penyucian wudhu: “Pada zaman Nabi, laki-laki dan perempuan berwudhu bersama-sama menggunakan satu wadah.” Hadits ini juga terdapat dalam kumpulan hadits al-Bukhari (193), Abu Dawud (79), al-Nasa’i (1/57), Ibn Majah (381), Ibn Khuzaymah (205), dan Ibn Hibban (1265) melalui sanad para sahabat Malik. Diriwayatkan dari Ibn Abd al-Barr bahwa mayoritas ulama dan ahli fiqih dari berbagai daerah berpendapat bahwa tidak ada salahnya seorang laki-laki berwudhu dengan air sisa wudhu perempuan, atau sebaliknya, dan bahwa air tidak menjadi najis kecuali karena najis yang tampak di dalamnya atau yang meluapinya (al-Tamhid 14/165). {mengutip:muwatta-maruf-1997 hal.58}"
