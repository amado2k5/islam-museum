label: { ar: "الموطأ 48 — ابن عمر: كان الرجال والنساء يتوضؤون جميعاً", en: "Muwatta 48" }
text: "إن كان الرجال والنساء في زمان رسول الله ليتوضؤون جميعاً"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، في باب الطهور للوضوء: كان الرجال والنساء في زمن النبي يتوضؤون جميعاً من إناء واحد. ويخرّجه المحقق عند البخاري (193) وأبي داود (79) والنسائي (1/57) وابن ماجه (381) وابن خزيمة (205) وابن حبان (1265) من طرق أصحاب مالك، وينقل عن ابن عبد البر أن جمهور العلماء وفقهاء الأمصار على أنه لا بأس أن يتوضأ الرجل بفضل المرأة والمرأة بفضله، وأن الماء لا ينجسه شيء إلا ما ظهر فيه من النجاسات أو غلب عليه (التمهيد 14/165). {cite:muwatta-maruf-1997 p.58}"
