label: { ar: "الموطأ 655 — القاسم بن محمد: لم يكن أبو بكر يأخذ من مال زكاة حتى يحول عليه الحول، ويسأل أهل العطاء عن أموالهم", en: "Muwatta 655" }
text: "هل عندك من مال وجبت عليك فيه الزكاة؟"
summary:
  ar: "أول حديث في باب الزكاة في العين من الذهب والورق. يرويه مالك عن محمد بن عقبة مولى الزبير، أنه سأل القاسم بن محمد عن مكاتب له قاطعه بمال عظيم، هل عليه فيه زكاة؟ فقال القاسم: إن أبا بكر الصديق لم يكن يأخذ من مال زكاة حتى يحول عليه الحول، وكان إذا أعطى الناس أعطياتهم يسأل الرجل هل عنده مال وجبت عليه فيه الزكاة، فإن قال نعم أخذ من عطائه زكاة ذلك المال، وإن قال لا أسلم إليه عطاءه ولم يأخذ منه شيئاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق (7024) والشافعي عند البيهقي ومحمد بن الحسن الشيباني (327). {cite:muwatta-maruf-1997 p.335} {cite:muwatta-maruf-1997 p.336}"
