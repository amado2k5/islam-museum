label: { ar: "الموطأ 655 — القاسم بن محمد: لم يكن أبو بكر يأخذ من مال زكاة حتى يحول عليه الحول، ويسأل أهل العطاء عن أموالهم", en: "Muwatta 655", es: "Muwatta 655", fr: "Muwatta 655", ur: "موطا 655", tr: "El-Muvatta 655 — El-Kâsım ibn Muhammed: Ebu Bekir, zekâttan bir yıl geçmeden almazdı ve zekâtı almaya hak kazananlardan mal varlıklarını sorardı.", id: "Al-Muwatta 655 — Al-Qasim ibn Muhammad: Abu Bakr tidak mengambil uang zakat sampai setahun berlalu, dan dia akan menanyakan kepada orang-orang yang berhak menerimanya tentang kekayaan mereka." }
text: "هل عندك من مال وجبت عليك فيه الزكاة؟"
summary:
  ar: "أول حديث في باب الزكاة في العين من الذهب والورق. يرويه مالك عن محمد بن عقبة مولى الزبير، أنه سأل القاسم بن محمد عن مكاتب له قاطعه بمال عظيم، هل عليه فيه زكاة؟ فقال القاسم: إن أبا بكر الصديق لم يكن يأخذ من مال زكاة حتى يحول عليه الحول، وكان إذا أعطى الناس أعطياتهم يسأل الرجل هل عنده مال وجبت عليه فيه الزكاة، فإن قال نعم أخذ من عطائه زكاة ذلك المال، وإن قال لا أسلم إليه عطاءه ولم يأخذ منه شيئاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق (7024) والشافعي عند البيهقي ومحمد بن الحسن الشيباني (327). {cite:muwatta-maruf-1997 p.335} {cite:muwatta-maruf-1997 p.336}"
  tr: "Altın ve gümüş bölümündeki zekâtla ilgili ilk hadis, Malik tarafından, Zübeyr'in azatlı kölesi Muhammed ibn Ukba'dan rivayet edilmiştir. Ukba, büyük bir meblağ karşılığında satın almak üzere anlaştığı bir köle hakkında el-Kasım ibn Muhammed'e sormuş ve bu paranın zekâtının verilip verilmeyeceğini öğrenmiştir. El-Kasım şöyle cevap vermiştir: \"Ebu Bekir es-Siddik, bir yıl geçmeden maldan zekât almazdı. İnsanlara rızık dağıtırken, her birine zekât verilecek bir malları olup olmadığını sorardı. Eğer evet derlerse, zekâtlarını rızıklarından alırdı. Eğer hayır derlerse, rızıklarını verir ve hiçbir şey almazdı.\" Araştırmacı, bu hadisin Malik'ten Ebu Musab ve Abdül-Razzak (7024) tarafından, Şafiî'den ise el-Beyhaki ve Muhammed ibn el-Hasan el-Şeybani (327) tarafından rivayet edildiğini belirtmektedir."
  id: "Hadits pertama tentang zakat dalam surah tentang emas dan perak diriwayatkan oleh Malik dari Muhammad ibn Uqba, budak yang dibebaskan oleh al-Zubayr. Ia bertanya kepada al-Qasim ibn Muhammad tentang seorang budak yang telah ia kontrak untuk dibeli dengan sejumlah besar uang. Ia bertanya apakah zakat wajib dibayarkan atas uang tersebut. Al-Qasim menjawab: “Abu Bakr al-Siddiq tidak memungut zakat dari harta benda sampai setahun berlalu. Ketika ia membagikan uang saku kepada orang-orang, ia akan bertanya kepada setiap orang apakah mereka memiliki harta benda yang wajib dizakati. Jika mereka menjawab ya, ia akan memungut zakat dari uang saku mereka. Jika mereka menjawab tidak, ia akan memberikan uang saku mereka dan tidak memungut apa pun darinya.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab dan Abd al-Razzaq (7024), dan oleh al-Shafi'i menurut al-Bayhaqi dan Muhammad ibn al-Hasan al-Shaybani (327)."
