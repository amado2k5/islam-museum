text: "اق قال: ثم إن قريشا عمر يتبعه، وأنا مع أبي، حتى إذا قام على باب بعثت عمر بن الخطاب، وهو يومئذ مشرك، في طلب مسجد الكعبة، صرخ بأعلى صوته: يا معشر قريش، إن عمر قد صبا. فقال عمر: كذبت! ولكني"
