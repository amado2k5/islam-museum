label: { ar: "مسلم 55 — الدين النصيحة", en: "Muslim 55 — The religion is sincere counsel" }
text: "قال رسول الله: «الدين النصيحة». قلنا: لمن؟ قال: «لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم»"
summary:
  ar: "رواية تميم الداري في باب «من الإيمان والدين النصيحة» من كتاب الإيمان، بإسناد سهيل بن أبي صالح عن عطاء بن يزيد الليثي عنه؛ من الحديث الذي قال البخاري إن مداره كله على تميم. ويليه في الباب بيعة جرير بن عبد الله «على إقام الصلاة وإيتاء الزكاة والنصح لكل مسلم»."
