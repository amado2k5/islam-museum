text: "الكتاب الثالث الفن الثاني والعشرون: وهو آخر الفنون من هذا الكتاب فصل: في أوجاع المفاصل وما يعمّ النقرس وعرق النسا أول اي السبب المنفعل في هذه الأمراض هو العضو القابل، والسبب الفاعل هو الأمزجة والمواد الرديئة. والسبب الآلي هو سعة …"
summary:
