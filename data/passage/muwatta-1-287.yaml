label: { ar: "الموطأ 287 — مالك: الإمام المسافر يجمّع بقرية تجب فيها الجمعة", en: "Muwatta 287" }
summary:
  ar: "قول لمالك في باب ما جاء في الإمام ينزل بقرية يوم الجمعة في السفر: إذا نزل الإمام، وهو مسافر، بقرية تجب فيها الجمعة فخطب وجمّع بهم، فإن أهل تلك القرية وغيرهم يجمّعون معه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163}"
