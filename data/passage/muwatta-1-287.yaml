label: { ar: "الموطأ 287 — مالك: الإمام المسافر يجمّع بقرية تجب فيها الجمعة", en: "Muwatta 287", es: "Muwatta 287", fr: "Muwatta 287", ur: "موطا 287", tr: "Al-Muwatta 287 — Malik: Seyyar imam, cuma namazının farz olduğu bir köyde cuma namazını kıldırıyor.", id: "Al-Muwatta 287 — Malik: Imam keliling memimpin salat Jumat di sebuah desa di mana salat Jumat diwajibkan." }
summary:
  ar: "قول لمالك في باب ما جاء في الإمام ينزل بقرية يوم الجمعة في السفر: إذا نزل الإمام، وهو مسافر، بقرية تجب فيها الجمعة فخطب وجمّع بهم، فإن أهل تلك القرية وغيرهم يجمّعون معه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163}"
  tr: "Malik, yolculuk halindeyken cuma günü bir köyde duran imam hakkında rivayet edilenler bölümünde şöyle demiştir: Eğer imam yolculuk halindeyken cuma namazının farz olduğu bir köyde durur, hutbe okur ve namazı kıldırırsa, o köy halkı ve diğerleri de onunla birlikte namaza katılabilirler. Editör, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.163}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan tentang seorang imam yang berhenti di sebuah desa pada hari Jumat saat bepergian: Jika seorang imam, saat bepergian, berhenti di sebuah desa yang mewajibkan salat Jumat, dan ia menyampaikan khutbah dan memimpin mereka salat, maka penduduk desa itu dan orang lain boleh ikut salat bersamanya. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.163}"
