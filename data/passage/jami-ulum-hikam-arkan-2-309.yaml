text: "… أُبيح دمُه ؛ لأنَّه قد ترك. بذلك دينه وكذلك لو استهان بالمُصحف، وألقاه في القاذورات، أو جحد ما يُعلم من الدِّين بالضَّرورة كالصلاة، وما أشبه ذلك ممَّا يُخرج منَ الدِّين وهل يقومُ مقامَ ذلك تركُ شيء مِنْ أركان الإسلام الخمس …"
