text: "… أُبيح دمُه ؛ لأنَّه قد ترك. بذلك دينه وكذلك لو استهان بالمُصحف، وألقاه في القاذورات، أو جحد ما يُعلم من الدِّين بالضَّرورة كالصلاة، وما أشبه ذلك ممَّا يُخرج منَ الدِّين وهل يقومُ مقامَ ذلك تركُ شيء مِنْ أركان الإسلام الخمس …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 309، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
