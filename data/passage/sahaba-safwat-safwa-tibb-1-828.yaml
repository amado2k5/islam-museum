text: "… عظم كلام من تكلم في أمره قالوا له: نعالجك؟ فقال لهم: يا قوم اعلموا أن لي طبيباً إن سألته داوى كل عليل، لكني أنا لا أسأله أن يداويني. فقيل له: ولِمَ ذاك وأنت تحتاج إلى الدواء؟ فقال: أخشى إن برأت …"
