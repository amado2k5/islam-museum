text: "… وهو الهندي، وأسود خفيف وهو الصيني، وأحمر رزين. هو شجر كالعود، وقد ورد ذكره في الحديث النبوي الشريف: خير ما تداويتم به الحجامة، والقُسط البحري، وقوله وَلفي: عليكم بهذا العود الهندي فإن فيه سبعة أشفية، منها ذات الجنب. التداوي بالأعشاب …"
summary:
