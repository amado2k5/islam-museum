label: { ar: "سرية حمزة بن عبد المطلب — أول لواء عقده رسول الله", en: "Sariyya of Hamza ibn Abd al-Muttalib — the first banner the Prophet raised", es: "Sariyya de Hamza ibn Abd al-Muttalib: la primera bandera que levantó el Profeta", fr: "Sariyya de Hamza ibn Abd al-Muttalib — la première bannière levée par le Prophète", ur: "حمزہ بن عبد المطلب کی ساریہ - پہلا جھنڈا جسے نبی نے اٹھایا" }
text: "أول لواء عقده رسول الله بعد أن قدم المدينة لحمزة بن عبد المطلب، بعثه في ثلاثين راكبا شطرين، خمسة عشر من المهاجرين وخمسة عشر من الأنصار"
summary:
  ar: "أول سرية بعثها النبي بعد قدومه المدينة، وعقد لها لواء لحمزة بن عبد المطلب — عمه وصاحب المشركين على يوم بدر — في ثلاثين راكبا شطرين من المهاجرين والأنصار. يذكر الواقدي فريعا منها إلى جبل أسد بيدرة لمن كانت من المهاجرين والأنصار."
  en: "The first sariyya the Prophet sent after settling in Medina, with the banner raised for Hamza ibn Abd al-Muttalib — his uncle and later his challenger at Badr — thirty riders split half-and-half between Emigrants and Helpers."
  es: "La primera sariyya que envió el Profeta tras establecerse en Medina, con el estandarte izado en honor a Hamza ibn Abd al-Muttalib —su tío y posteriormente su rival en Badr—, estaba compuesta por treinta jinetes divididos a partes iguales entre emigrantes y ayudantes."
  fr: "La première sariyya que le Prophète envoya après s'être installé à Médine, avec la bannière levée pour Hamza ibn Abd al-Muttalib — son oncle et plus tard son adversaire à Badr — trente cavaliers répartis moitié-moitié entre Émigrants et Auxiliaires."
  ur: "مدینہ منورہ میں قیام کے بعد رسول اللہ نے پہلی سریہ جو حمزہ بن عبدالمطلب کے لیے اٹھائی تھی - اس کے چچا اور بعد میں بدر میں ان کے مد مقابل - تیس سوار مہاجرین اور مددگاروں کے درمیان آدھے حصے میں بٹ گئے۔"
