label: { ar: "سرية حمزة بن عبد المطلب — أول لواء عقده رسول الله", en: "Sariyya of Hamza ibn Abd al-Muttalib — the first banner the Prophet raised" }
text: "أول لواء عقده رسول الله بعد أن قدم المدينة لحمزة بن عبد المطلب، بعثه في ثلاثين راكبا شطرين، خمسة عشر من المهاجرين وخمسة عشر من الأنصار"
summary:
  ar: "أول سرية بعثها النبي بعد قدومه المدينة، وعقد لها لواء لحمزة بن عبد المطلب — عمه وصاحب المشركين على يوم بدر — في ثلاثين راكبا شطرين من المهاجرين والأنصار. يذكر الواقدي فريعا منها إلى جبل أسد بيدرة لمن كانت من المهاجرين والأنصار."
  en: "The first sariyya the Prophet sent after settling in Medina, with the banner raised for Hamza ibn Abd al-Muttalib — his uncle and later his challenger at Badr — thirty riders split half-and-half between Emigrants and Helpers."
