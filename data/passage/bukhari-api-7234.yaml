label: { ar: "صحيح البخاري 7234 — الكي، عيادة المريض", en: "Sahih al-Bukhari 7234 — cautery; visiting the sick", ur: "صحیح بخاری 7234 — داغنا، بیمار کی عیادت" }
text: "حَدَّثَنَا مُحَمَّدٌ، حَدَّثَنَا عَبْدَةُ، عَنِ ابْنِ أَبِي خَالِدٍ، عَنْ قَيْسٍ، قَالَ أَتَيْنَا خَبَّابَ بْنَ الأَرَتِّ نَعُودُهُ وَقَدِ اكْتَوَى سَبْعًا فَقَالَ لَوْلاَ أَنَّ رَسُولَ اللَّهِ نَهَانَا أَنْ نَدْعُوَ بِالْمَوْتِ لَدَعَوْتُ بِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7234، يذكر الكي، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7234 (Wishes), that mentions cautery, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7234، جس میں داغنا، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
