text: "… اسم لهذا الورم، وأن السرسام أخفّ منه، وليس ذلك بشيء، فإن البرسام هو فارسي، والبرّ هو الصدر ا ا، والسام هو الورم والسرسام أيضاً فارسيّ، والسر هو الرأس والمرض والسرسام الكائن في الحميات والكائن لأخلاط في فمّ المعدة محرقة، والذي …"
summary:
