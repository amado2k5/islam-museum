  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 76, that mentions illness and the sick, fever, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 76 کا اقتباس جس میں بیماری اور بیمار، بخار، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 76, que menciona la enfermedad y los enfermos, la fiebre, enfermedades específicas y los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 76, qui mentionne la maladie et les malades, la fièvre, les maladies nommées, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 76. sayfasından bir bölüm; hastalık ve hasta, ateş ve halsizlik, hastalıkların isimleri ve vücut organlarından bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 76, yang menyebutkan penyakit dan pasien, demam dan rasa tidak enak badan, nama-nama penyakit, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
