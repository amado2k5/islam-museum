text: |-
  ويقال ركع الرسل اذا اقتقريعد
  غنى والخحمات حاله قال
  لاتهين النقر علا أن
  تكع بوما والدهرة درفعه
  أبوزيد يقال دعه يترمع فى
  ظمعته أى دصه بتسكع فى ضلاله
  وقال غيره مهناه دعه يتلطخ
  ٥١٤
  (روع
  لم أ-معهامكسورة ورفع البعير ف السسير أى بالخ ورفعته أنا يتعدى ولا يتعدى ومرفوعها
  خلافم وضوعها يقال دابة ليسه مرفوع وهو مصدر مثل الجاود والمعة ول وهو
  عدودون الحضر قال طرفة
  موضوعها زول ومى فوعها • كترصوب لجب وسط رمح
  وكذلك رفعته ترفيها والرفع تقرسك الشئ وقول تعسالى وفرش مرفوعة قالوامقزية لهم ومن
  ذلك رقعته الى السلطان ومصدره الرفعان وقال الفراء وفرش حرفوعة بعضها فوق بعض
  ويقال نساءمكرمات من قولك واللّٰه يرفع من يشاء ويحفض وناقة رافع اذا رضت الليأ
  فى ضرعهاءن الاصمعى والرفاعة بالضم ما تتعظم به المرأة الرفصماء ورفاعة المقيدأ يضاخيط
  يرفع بد قيده اليه قال ابن الكيت يقال فى صوته رفاعة ورفاعة بالضم والفتح
  ورجل رفيع أى شريف قال أبو بكرحمدبن السرى ولم ية ولوامنه رفع وقال غيره
  رفع رفعة أى ارتفع قدره ورافعت فلانا الى الحاكم وترافعنا ال.ه ورفاعة بالكسرامم رجل:
  (⁦(قع)⁩ الرقعة واحدة القاع التى تكتب والرآمة الخرقة تقول.نه رقعت الثوب بالرفاع
  وأبن الرفاع العاء-لى شاء رقال
  لو كنت من أحد يهجى هجوتكم • ناابن الرقاع ولكن ا-ت من أ-د
  ورقعه إى هجاء ويقال لا رقعنه روارصينا وإنى لأرى فيه مترقعا أى م وضعا اللشتم
  والهجاه قال الشاعر (البعيث
  وماترك الهاجون لى فى أديمكم • مصحاولكنى أرى مترقعا
  وترقيع النوب أن يرقعه فى مواضع أنهجت واسترقع النوب أى حان له أن يرقع وأماقول
  أبى الاسود الدولى أبى القلب الاأم عم رووحبها • عجوزاومن يحبب عموزا يفند
  كثوب المانى قدتادم عهده • ورقعته ماشئت فى العيز واليد
  فافماعى بد أصل وجوهره والرقيع سماء الدئُيما وكذلك سائر السجوات وفى الحديث من
  فوق سبعة أرقعة فماءيه على لفظ التذ كير كانه ذهب يد الى السقف والرقيمع والمرقعان
  الاحق وه والذى فى ءتقله مرمة وقد رقع بالضم رقاعة وأرقع الرجل أى جاء برقاعة وسمق
  وراقع الجروهو قاب عاذر ويقال ما ارتقعت له وماارة هت به أى ماا كترثت له وما باليت به
  فال يعقوب يقال ماتز تقع من برقاع أى لا تقبل مما أنصحك به شيئا ولا تطيعى وجوع برقوع
  أى شديد وقال أبو الغون ديقوع ولم يعرف يرقوع ⁦( ركع)⁩ إلركوع الاغحنا ومنه
  ركوع الصلاة وركع الشيخ اغى من الكبر ⁦(رمع)⁩ رمع أنفه من الغضب يرمع رمعانا أى
  قرك والترمع الحرّك والرمّاعة بالتشديد ما يتحزك من يافوخ الصبىّ والرماعة أيضا الاست
  يقال كذيت رماعتك اذاحبق واليرمع حجارة بيض دقاق تلع وع الروع بالفتح
  الفزع والروعة الفزعة ومنه قواهسم أفرخ روعه أى ذهب فزعه وسكن والروع بالضم القلب
  والعقل يقال وقع ذلك فى روعى أى فى خلدى وبالى وفى الحسديث إن روح القدس نفت
  ف روعى ورءت فلانا ورومته فارتاع أى أفزعته فه زع وترقع أى تفزع وقولهم لاترع أى
  لا تخف ولا يلمقك خوف قال أبو خراش
  رهوى
