text: "ا عن أكثر من ألفي شيخ ، من إسبيجاب إلى الإسكندرية . ولم نرو في كتابنا هذا إلا عن مائة وخمين شيخا ، أقل أو أكثر . ولعل معول كتابنا هذا يكون على نحو من عشرين شيخا ، ممن أدرنا"
