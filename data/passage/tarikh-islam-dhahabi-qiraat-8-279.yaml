text: "… النَّحو، أنّ ابنة أبي الأسود قالت: ما أشدُّ الحَرِّ؟ قال: الحَصْباءُ بالرَّمْضاء، قالت: إنّما تعجَّبْتُ من شدّته : فقال: أَوَ قَدْ لَحَنَ النّاسُ! فأخبر بذلك عليّاً عليه الرضوان، فأعطاه أصولاً بنى منها، وعمل بعده عليها. وهو أول من نَقَطَ المصاحفَ. …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 8، ص 279، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 8, p. 279, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 8، ص 279 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 8, pág. 279, que menciona la colección del Corán y los códices, los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 8, page 279, mentionne la compilation du Coran et des codex, ainsi que la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 8. cildinin 279. sayfasından alınan bu alıntı, Kur'an'ın derlenmesini ve el yazmalarını, ayrıca Kur'an'ın diyakritik işaretlerini ve biçimlendirmesini ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 8, halaman 279, membahas penyusunan Al-Quran dan manuskripnya, serta tanda diakritik dan format Al-Quran. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya diringkas sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
