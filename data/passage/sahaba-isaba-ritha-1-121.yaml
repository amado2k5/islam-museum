text: "… لَمْ يَلْقَ يَوماً آخِرَهْ ذَابَ الفُؤَادُ وَقَدْ تَقطَّعَ حَسْرَةً أَسَفاً عَلَى قَاضِي القُضَاةِ النَّادِرَهْ أَعْنِي شِهَابَ الدِّينِ ذَا الفَضْلِ الَّذِي عَنْ وَصْفِهِ أَفْهَامُ مِثْلِي قَاصِرَهْ العَسْقَلَانِيُّ الّذِي كَانَتْ إِلَى أَبْوَابِهِ تَأْتِي الوُفُودُ مُهَاجِرَهْ يَا عَيْنُ، إِنِّي نَاظِمٌ مَرْثيَّةً فِيهِ فَكُونِي …"
summary:
  ar: "مقطع من الإصابة في تمييز الصحابة، المجلد المصوَّر 1، ص 121، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
