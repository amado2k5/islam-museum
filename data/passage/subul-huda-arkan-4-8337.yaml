text: "… شعَبِ الإِيمانِ والخطيبُ، وابنُ عساكرٍ، منْ طريقِ عبَّادٍ عنْ ابنِ منصورٍ، عنْ عدِىِّ بنِ أرطاةَ، عنْ رجُلٍ منَ الصحابةِ. سَماةً، قال عبَّادٌ : فنسيتُ اسمهُ، عن رسُول اللّٰه تَلي، قال : إنَّ لِلّه مِلائكةً تُرْعَدُ فِرائْصُهمْ، مِنْ مَخَافَتِهِ، مَا مِنْهُمْ …"
