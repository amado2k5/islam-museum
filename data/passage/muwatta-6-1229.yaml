label: { ar: "الموطأ 1229 — عبد الرحمن بن القاسم عن أبيه عن عائشة: قدمت مكة وأنا حائض فلم أطف، فقال افعلي ما يفعل الحاج غير الطواف بالبيت والسعي حتى تطهري", en: "Muwatta 1229" }
text: "افْعَلي ما يَفْعَلُ الحَاجُّ غَيْرَ أنْ لا تَطُوفِي بالبَيْتِ، ولا بَينَ الصَّفَا والمَرْوَةِ حتَّى تَطْهُرِي"
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة أنها قالت قدمت مكة وأنا حائض، فلم أطف بالبيت ولا بين الصفا والمروة، فشكت ذلك إلى رسول الله، فقال افعلي ما يفعل الحاج غير أن لا تطوفي بالبيت ولا بين الصفا والمروة حتى تطهري. ويذكر المحقق أن ابن عبد البر رأى أن الحديث في الموطأ عن جماعة الرواة عن ابن شهاب عن عروة عن عائشة. {cite:muwatta-maruf-1997 p.549}"
