label: { ar: "الموطأ 1229 — عبد الرحمن بن القاسم عن أبيه عن عائشة: قدمت مكة وأنا حائض فلم أطف، فقال افعلي ما يفعل الحاج غير الطواف بالبيت والسعي حتى تطهري", en: "Muwatta 1229", es: "Muwatta 1229", fr: "Muwatta 1229", ur: "موطا 1229", tr: "El-Muvatta 1229 — Abdurrahman ibn el-Kâsım, babasından, o da Aişe'den rivayetle: Ben Mekke'ye adetliyken geldim, bu yüzden tavaf yapmadım. O şöyle dedi: Temizlenene kadar, Kabe'nin etrafında tavaf ve Sa'i hariç, hacıların yaptığı her şeyi yap.", id: "Al-Muwatta 1229 — Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Aisyah: Aku datang ke Mekah saat sedang haid, jadi aku tidak melakukan Tawaf. Beliau berkata: Lakukanlah apa yang dilakukan oleh jamaah haji, kecuali Tawaf mengelilingi Baitullah dan Sa'i, sampai kamu suci." }
text: "افْعَلي ما يَفْعَلُ الحَاجُّ غَيْرَ أنْ لا تَطُوفِي بالبَيْتِ، ولا بَينَ الصَّفَا والمَرْوَةِ حتَّى تَطْهُرِي"
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة أنها قالت قدمت مكة وأنا حائض، فلم أطف بالبيت ولا بين الصفا والمروة، فشكت ذلك إلى رسول الله، فقال افعلي ما يفعل الحاج غير أن لا تطوفي بالبيت ولا بين الصفا والمروة حتى تطهري. ويذكر المحقق أن ابن عبد البر رأى أن الحديث في الموطأ عن جماعة الرواة عن ابن شهاب عن عروة عن عائشة. {cite:muwatta-maruf-1997 p.549}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, babasından, o da Aişe'den rivayetle şöyle naklediyor: \"Mekke'ye adetliyken vardım, bu yüzden Kâbe'nin etrafında tavaf yapmadım ve Safa ile Merve arasında sa'i çekmedim. Bunu Allah'ın Resulü'ne şikayet ettim ve o şöyle buyurdu: 'Hacılar ne yapıyorsa onu yap, ancak temizlenene kadar Kâbe'nin etrafında tavaf yapma ve Safa ile Merve arasında sa'i çekme.'\" Araştırmacı, İbn Abdül-Barr'ın el-Muvatta'daki hadisin, İbn Şihab'dan, Urva'dan, o da Aişe'den rivayetle bir grup ravi tarafından nakledildiğini düşündüğünü belirtiyor. {cite:muwatta-maruf-1997 s.549}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Aisyah, bahwa ia berkata: “Aku tiba di Mekah saat sedang haid, jadi aku tidak melakukan Tawaf mengelilingi Ka'bah atau Sa'i antara Safa dan Marwa. Aku mengeluhkan hal ini kepada Rasulullah, dan beliau bersabda: ‘Lakukanlah apa yang dilakukan para peziarah, kecuali jangan melakukan Tawaf mengelilingi Ka'bah atau Sa'i antara Safa dan Marwa sampai kamu suci.’” Peneliti menyebutkan bahwa Ibnu Abd al-Barr menganggap hadits dalam al-Muwatta diriwayatkan oleh sekelompok perawi dari Ibnu Shihab, dari Urwa, dari Aisyah. {cite:muwatta-maruf-1997 p.549}"
