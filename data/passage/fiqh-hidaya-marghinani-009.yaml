text: "إلى اللبس. ⁦(١)⁩ أي المحلوف عليه، وهو المخاطب، وهو الآخر. ⁦(٢)⁩ هذا جواب عن سؤال مقدر، بأن يقال: إن قولكم: الإيلام لا يتحقق في الميت: يشكل بعذاب الميت في القبر، فأجاب بقوله: ومن يعذب... إلى آخره. ⁦(٣)⁩ يعني لم يحنث"
