text: |-
  ٣٦٨
  ⁦(باب الرام)⁩
  ⁦(عشر )⁩
  حلت أثقالى مصمماتها * غلب الذفارى وعذرنياتها
  ووقع القوم فى عافورشر أى فى شذة ويقال جاءنافلان فى عفرة الحرّبضم العيز والفاءلغة
  فى أفرة الحروفى عفرة الحر بالفتح حكاهما الكدائى أى فى شدته ويقسال فى أوّله وعفربن
  مأسدة وقيل لكل ضابط قوى ليث عفرين بكسر المين والراء مشتدة قال الاصمعى مفتوين
  اسم بلد ق عقره أى جرحه فهو عقير وقوم عقرى مثل جرمح وجرحى ويقال فى الدعاء
  على الانسان جد عاله وعة راوحلقا أى عة راللّٰه جسده وأصابه بوجع فى حلقه وربما قالوا
  عرى وحلقى بلا تنوين على مانذكره فى باب القاف وكاب عقور والتعتير أكثر من العر
  والعقاقير أصول الادوية واحدهاعقار ومعة راسم شاءر وهو معقر بن حار البارقى
  حليف بنى نسيروتعاقرا ابلهما أى ء رقباها يتباريان فى ذلك والمعاقرة المنافرة والسباب
  والهجاء رعاقره أى لازمه والمعاقرة ادمان شرب الجروسرج عسروعرة أى معة رغير
  واق قال البعيث
  ألداذ الاقيت قوما بخطة• ألحّ على أكافهم قتب عقر
  ولايسال عة ور الافى ذى الزوح والعقرة أيضاخرزة تشدها المرأة فى -ويم الثلاتحبل ومنه
  قواه-م عقرة العلم النسيان والعقار بالفتح الارض والضباع والنخل ومنه قواهسم ماله دارولا
  عقا رويقال أيضا فى البيت عة ارحسن أى متاع واداة والمعقرالرجل الكثير العقاروقد
  أعة رقال أبو عبيد العقاراءموضع وأنشد لجهيدين تور
  ركود الجياطلة شاب ماءها • لها من عقاراء الكروم زيب
  والعقار بالضم الخرسميت بذلكْ لام اعاقرت العقل عن أبى نصرأ وعاقرت الدنّ أى لارمته
  عن أبى عمرو وأصلها من عر الحوض والعقار أيضاضرب من الشياب أحرقال طفيل
  عقار تظلّ الطير تخطف زهوه * وعالين أعلافا على كل مفأم
  والعقيرة الساق المقطوعة وقواهم رفع فلان عقيرته أى صوته وأصله أن رجلا قطعت احدى
  رجليه فرفعه او وضعها على الاخرى وصرخ فقيل بعد لكل رافع صوته قدرفع عقيرته
  ويقال مارأيت كاليوم عقبرة وسط قوم الرجل الشريف يقتسل وعقرت البعير أوالة رص
  بالسيف فانعة راذاضر بت به قوائمه فهوعة يروخيل عقرى وعقرت التخلة اذا قطعت رأسها
  كا، مع الهمار والاسم العقار وعة رن ظهر البعير عقرا أدبرته وعقره السرج فانعر واعتة ر
  وقولهم عقرت بى أى أطلت حبسى كأنك عقرت بعيرى فلا أقدر على السير وأنشدابن
  السكيت قد عقرت بالقوم أم خزرج • اذا مشت سالت ولم تدحرج
  والعقر أنت-لم الرجل قوائمه فلا يستطبع أن يقائلى من الفرق والدهس تقول منه عقرت
  بالكسر أى دهشت ومنه قول عمر رفى القه عنه فعة رت -تى خررت الى الارض يعنى عند
  موت النبىّ عليه الصلاة والسلام وأعقره غيره أدهشه والعاقر العظيم من الرمل لا ينيت
  شيئا والعاقر المرأة التى لا تحبل ورجل عاقر أيضالا يولد له بين العة ربالضم قال ذوالرمة
  وردّحرو باقد لقحن الى عقر ويقال أيضالقت الناقة عن ءر وقدعقرت المرأة بالضم
  تعر عقراصارت عاقرامثل حسنت حسنا عن أبى زيد والعترأيضا مهر المرأة اذا وطئت
  على شبهة وبيضة المقرز ه واهى بيضة الديك لانه يبيض، فى عمره بيضة واحدة الى الطول مأهى
