text: "… حدثنا عبدالله حدثنا أبي حدثنا عبداللّه بن يزيد بحفظه حدثنا عيينة بن مبد الرحمن حدثني علي بن زيد بن جدعان قال حضر رجلاً من الانصار الموت فقال لإبنه يا بني إني موصياث بوصية فاحفظها فإناك ألا تحفضها مني خليق أن …"
