label: { ar: "سنن أبي داود 3330 — الحرام، الشبهات", en: "Sunan Abi Dawud 3330 — the unlawful; the doubtful matters", ur: "سنن ابی داؤد 3330 — حرام، مشتبہ امور", es: "Sunan Abi Dawud 3330 — lo ilícito; los asuntos dudosos" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ مُوسَى الرَّازِيُّ، أَخْبَرَنَا عِيسَى، حَدَّثَنَا زَكَرِيَّا، عَنْ عَامِرٍ الشَّعْبِيِّ، قَالَ سَمِعْتُ النُّعْمَانَ بْنَ بَشِيرٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ بِهَذَا الْحَدِيثِ قَالَ \" وَبَيْنَهُمَا مُشَبَّهَاتٌ لا يَعْلَمُهَا كَثِيرٌ مِنَ النَّاسِ فَمَنِ اتَّقَى الشُّبُهَاتِ اسْتَبْرَأَ عِرْضَهُ وَدِينَهُ وَمَنْ وَقَعَ فِي الشُّبُهَاتِ وَقَعَ فِي الْحَرَامِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3330، يذكر الحرام، والشبهات. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3330 (Commercial Transactions (Kitab Al-Buyu)), that mentions the unlawful, the doubtful matters. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3330، جس میں حرام، مشتبہ امور کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3330 (Transacciones comerciales (Kitab Al-Buyu)), menciona lo ilícito y lo dudoso. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
