text: "… البرء، الأولى؛ قال: يقطع دم البواسير وضع المحاجم على البطن. لي: وفصد الباسليق يقطع الدم ويسكن الوجع. وللوجع في المقعدة ضماد نافع: مقل لبن وشحم بط، يدق مع بزر الكتان والحلبة ومخ البقر، يلين المقل باللبن ويجمع الجميع ثم يوضع …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1741، يذكر الحجامة، والوجع، وأسماء الأمراض، والجراحة والختان والجبائر، وحسم الجرح، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
