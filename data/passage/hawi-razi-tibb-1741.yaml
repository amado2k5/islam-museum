text: "… البرء، الأولى؛ قال: يقطع دم البواسير وضع المحاجم على البطن. لي: وفصد الباسليق يقطع الدم ويسكن الوجع. وللوجع في المقعدة ضماد نافع: مقل لبن وشحم بط، يدق مع بزر الكتان والحلبة ومخ البقر، يلين المقل باللبن ويجمع الجميع ثم يوضع …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1741، يذكر الحجامة، والوجع، وأسماء الأمراض، والجراحة والختان والجبائر، وحسم الجرح، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1741, that mentions cupping, pain, named diseases, surgery, circumcision and splints, cauterising a wound, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1741 کا اقتباس جس میں حجامہ، درد، بیماریوں کے نام، جراحت، ختنہ اور پٹیاں، زخم داغنا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 1741, que menciona la ventosaterapia, el dolor, enfermedades específicas, cirugía, circuncisión y férulas, cauterización de heridas, medicamentos y farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 1741, qui mentionne la ventousothérapie, la douleur, les maladies nommées, la chirurgie, la circoncision et les attelles, la cautérisation d'une plaie, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinden, s. 1741'den bir bölüm; hacamat, ağrı, hastalık isimleri, ameliyat, sünnet, atel, yara iyileşmesi, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 1741, yang menyebutkan tentang bekam, nyeri, nama-nama penyakit, pembedahan, sunat, bidai, penyembuhan luka, obat-obatan dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
