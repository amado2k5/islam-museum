label: { ar: "سنن ابن ماجه 2548 — الأب والأبوة", en: "Sunan Ibn Majah 2548 — the father and fatherhood", ur: "سنن ابن ماجہ 2548 — باپ اور والدیت", es: "Sunan Ibn Majah 2548 — El padre y la paternidad" }
text: "… حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ مُحَمَّدِ بْنِ طَلْحَةَ بْنِ رُكَانَةَ، عَنْ أُمِّهِ، عَائِشَةَ بِنْتِ مَسْعُودِ بْنِ الأَسْوَدِ عَنْ أَبِيهَا، قَالَ لَمَّا سَرَقَتِ الْمَرْأَةُ تِلْكَ الْقَطِيفَةَ مِنْ بَيْتِ رَسُولِ اللَّهِ أَعْظَمْنَا ذَلِكَ وَكَانَتِ امْرَأَةً مِنْ قُرَيْشٍ فَجِئْنَا إِلَى النَّبِيِّ نُكَلِّمُهُ وَقُلْنَا نَحْنُ نَفْدِيهَا بِأَرْبَعِينَ أُوقِيَّةً. فَقَالَ رَسُولُ اللَّهِ \" تُطَهَّرَ خَيْرٌ لَهَا \". فَلَمَّا سَمِعْنَا لِينَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2548، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2548 (The Chapters on Legal Punishments), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2548، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2548 (Capítulos sobre castigos legales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
