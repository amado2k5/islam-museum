label: { ar: "سنن أبي داود 2727 — مداواة الجراح، مداواة النساء للجرحى", en: "Sunan Abi Dawud 2727 — the treatment of wounds; women treating the wounded", ur: "سنن ابی داؤد 2727 — زخموں کا علاج، خواتین کا زخمیوں کا علاج" }
text: "… صَيْفِيٍّ، عَنْ يَزِيدَ بْنِ هُرْمُزَ، قَالَ كَتَبَ نَجْدَةُ إِلَى ابْنِ عَبَّاسٍ يَسْأَلُهُ عَنْ كَذَا، وَكَذَا، وَذَكَرَ، أَشْيَاءَ وَعَنِ الْمَمْلُوكِ، أَلَهُ فِي الْفَىْءِ شَىْءٌ وَعَنِ النِّسَاءِ، هَلْ كُنَّ يَخْرُجْنَ مَعَ النَّبِيِّ وَهَلْ لَهُنَّ نَصِيبٌ فَقَالَ ابْنُ عَبَّاسٍ لَوْلاَ أَنْ يَأْتِيَ أُحْمُوقَةً مَا كَتَبْتُ إِلَيْهِ أَمَّا الْمَمْلُوكُ فَكَانَ يُحْذَى وَأَمَّا النِّسَاءُ فَقَدْ كُنَّ يُدَاوِينَ الْجَرْحَى وَيَسْقِينَ الْمَاءَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2727، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 2727 (Jihad (Kitab Al-Jihad)), that mentions the treatment of wounds, women treating the wounded, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 2727، جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
