label: { ar: "الموطأ 2194 — مالك: ومن أعطى عطية لا يريد ثوابها، ثم مات المعطى، فورثته بمنزلته، وإن مات المعطي قبل أن يقبض المعطى عطيته فلا شيء له، لأنه أعطي عطاء لم يقبضه", en: "Muwatta 2194" }
summary:
  ar: "قال مالك: ومن أعطى عطية لا يريد ثوابها، ثم مات المعطى، فورثته بمنزلته. وإن مات المعطي قبل أن يقبض المعطى عطيته، فلا شيء له، وذلك أنه أعطي عطاء لم يقبضه. فإن أراد المعطي أن يمسكها، وقد أشهد عليها حين أعطاها، فليس ذلك له. إذا قام صاحبها أخذها. {cite:muwatta-maruf-1997 p.300}"
