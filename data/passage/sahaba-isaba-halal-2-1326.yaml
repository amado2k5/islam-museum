text: "… بن قَيْس بن نُجَيْد بن رُؤَاس بن كلاب وَيْحَكَ عُذْ بالله ذي الجَلاَلِ ابن ربيعة بن عامر بن صعصعة العامري الكلابي: وفد هو وابنه عمرو بن مالك على النَّبي ولي فأسلما. مُنَزِّلِ الحَرَامِ وَالحَلالِ الأبيات، فقلت : وقد تقدم بيان …"
