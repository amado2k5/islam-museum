text: "الأدوية المفردة باب الحاء أورام العين الحارة وأورام الأحشاء إذا ضمد بها مع الزبيب. وهي نافعة من أوجاع الرحم إذا أدخلت الفرزجات وإذا جلس في طبيخها. ومتى شرب طبيخها كان موافقاً للكبد العليلة والكلى والنقرس. قال حنين في كتاب الترياق …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3021، يذكر الوجع، وأسماء الأمراض، والجراحة والختان والجبائر، والدواء، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3021, that mentions pain, named diseases, surgery, circumcision and splints, the drug, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3021 کا اقتباس جس میں درد، بیماریوں کے نام، جراحت، ختنہ اور پٹیاں، دوا، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
