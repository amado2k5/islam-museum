label: { ar: "سنن أبي داود 3682 — الحرام", en: "Sunan Abi Dawud 3682 — the unlawful", ur: "سنن ابی داؤد 3682 — حرام", es: "Sunan Abi Dawud 3682 – lo ilegal" }
text: "… أَبِي سَلَمَةَ، عَنْ عَائِشَةَ، -ا - قَالَتْ سُئِلَ رَسُولُ اللَّهِ عَنِ الْبِتْعِ فَقَالَ \" كُلُّ شَرَابٍ أَسْكَرَ فَهُوَ حَرَامٌ \". قَالَ أَبُو دَاوُدَ قَرَأْتُ عَلَى يَزِيدَ بْنِ عَبْدِ رَبِّهِ الْجُرْجُسِيِّ حَدَّثَكُمْ مُحَمَّدُ بْنُ حَرْبٍ عَنِ الزُّبَيْدِيِّ عَنِ الزُّهْرِيِّ بِهَذَا الْحَدِيثِ بِإِسْنَادِهِ زَادَ وَالْبِتْعُ نَبِيذُ الْعَسَلِ كَانَ أَهْلُ الْيَمَنِ يَشْرَبُونَهُ. قَالَ أَبُو دَاوُدَ سَمِعْتُ أَحْمَدَ بْنَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3682، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3682 (Drinks (Kitab Al-Ashribah)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3682، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3682 (Bebidas (Kitab Al-Ashribah)), menciona lo ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
