label: { ar: "الموطأ 2347 — مالك: في الوصية بعتق غلام وكتابة آخر تُبدأ العتاقة على الكتابة", en: "Muwatta 2347", es: "Muwatta 2347", fr: "Muwatta 2347", ur: "موطا 2347", tr: "El-Muvatta 2347 — Malik: Bir kölenin azat edilmesi ve bir diğerinin azat belgesinin yazılması konusunda, azat işlemi yazıyla başlar.", id: "Al-Muwatta 2347 — Malik: Mengenai wasiat untuk membebaskan seorang budak dan untuk menulis surat pembebasan budak lainnya, pembebasan itu dimulai dengan penulisan surat tersebut." }
summary:
  ar: "قال مالك في رجل قال في وصيته: غلامي فلان حر، وكاتبوا فلانا؛ تُبدأ العتاقة على الكتابة. {cite:muwatta-maruf-1997 p.368}"
  tr: "Malik, vasiyetinde “Falanca kölem azat oldu ve filanca ile bir sözleşme yapın” diyen bir adam hakkında şöyle demiştir: Azat etme, azat etme sözleşmesiyle başlar. {cite:muwatta-maruf-1997 s.368}"
  id: "Malik berkata mengenai seorang pria yang menyatakan dalam wasiatnya: “Budakku si anu telah bebas, dan membuat perjanjian dengan si anu”: pembebasan budak dimulai pada saat perjanjian pembebasan budak dibuat. {cite:muwatta-maruf-1997 p.368}"
