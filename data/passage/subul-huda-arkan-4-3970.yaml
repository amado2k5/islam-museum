text: "… رسول اللّٰه إنه لم يَسْأَلْكَ السَّوِيَّة من الأَرض إذ سأَلك، إنما هذه الدهناء عندك مُقَيَّدُ الجَمَل ومَرْعَىٰ الغَنَم، ونساء تميم وأَبناؤها رراء ذلك. فقال : أَمْسِكْ يا غُلام، صَدَقْت الْمِسْكِينَة الْمُسْلِمُ أَخو الْمُسْلِم يَسَعُهما الماءُ والشَّجَر، ويتعاوذان على الفَتَّان. فلما …"
