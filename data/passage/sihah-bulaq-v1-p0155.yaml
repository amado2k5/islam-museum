text: |-
  ١ فى نسخة ع ريا وكتب عليها
  *ريا أى أظهر يتمان يعروه ١ه
  ٤٨٦
  إذا نزل الحىّ-ل الجيش • حريد المحل عوباغيورا ١
  والجوش الصي قبل أن يشتدوقال ا عترض الهذلى
  قتلنا مخادا وابنى حراق * وآخر ججوشافوق الفطيم
  ⁦( بحمرش)⁩. الجمرش العجوز الكبيرة والجمع بجامر والتصغير جميمر يحذف منه آخر
  الحرف وكذلك اذا أردت جمع اسم على خمسة أحرف كلها من الاصل وليس فيها زائد
  فأما اذا كان فيها زائد فازائدأولى بالحذف وأفعى محمرش أى خشناء .⁦(برش)⁩ جرش
  موضع باليمن ومنه أديمّ حرشىّ وناقة جرشية قال بشبر
  تحدّرماء البئرعن جرشة • على جربة تعلو الدبار غروبها
  يقول دموعى تحدر كتحدّرما البئر عن دلوتسة قى بهاناقة جرشية لان أهل برش يسستقون
  على الابل وجرشت الشئء اذ الم تنعم دقه فهو جريش وملح جريس لم يطيب وجراشة الشئْ
  ماسقط منه جريشا اذا أخذ مادق منه وبرش رأسه اذاحكه بالمشط -ق أثار هبريته أبوزيد
  مضى حَرس من الليسل أى هوىّ من الليل والنتراء مثله والجرشى عثال الزمكى النفس
  رنفش الجرنفس العظيم الجنبين والجرافش بالضم مثله جنس حشئت الشى
  أجشه حشادققته وكسرته والسويق حشيس والحشيشة ماجسْ من البروغيره يقال
  جششت البرّ وأجتشته اذا طحنته طمنا حليلافهو جشيسْ ومحشوش والمجسْ الرحى التى
  يطحن الجشيش به اوجشه بالعصاضربه بهم اوحششت البئركفستها ونقيتها قال أيوذؤيب
  يقولون لماجنت البئرأ وردوا * فليس بها أدنى ذفاف لوارد
  يعى بها القبر والاجس الغليظ الصوت يقال فرس أجس الصوت وسجاب أجش الرعد
  والجشة بالضم الهاعة من الناس ⁦(جعسْ)⁩ قال الاصعى رجل جعشوش وجعسوس
  أى قصير دميم قال ابن السكيت فى كتاب القلب والابدال هو بالشين والسين جيعا وذلك الى
  قاءة وصغر وقلة( مش كب بميش أى حليق وقد بحشته بحشا واللهيس المكان لانيت
  قيه وقى الحديث يخبت الهيس والخبت المفازة واغاقيل بمحيس لاتّه لانبات فيه كانه
  حليق وسنة جوش اذا احتلقت النبت قال رؤية
  دقاكرقش الوضم المرفوش * أوكاحتلاق النورة الجوش
  وش) الجوش الصدرمثل الجؤشوش والجوشن وجوشموضع قال أبو الطمحان
  القينى
  ترض حصى معزاءجوش وأكه • باخفافهارض النوى بالمراضح
  وهضى جوش من الليل أى صدر منه مثل جرش عال ربيعة بن مقروم الضى
  وقتيان صدق قد صبحت سلافة • اذا الديك فى جوش من الليل طرنا
  هش ، الجهش أن يفزع الانسان الى غيره وهومع ذلك يريد البكاء كالصبى يفزع الى
  أمه وقدتهي أللبكام فيقال جهش اليه يجهش وفى الحديث أصابناعطش فجهشنا الى
  رسول اللّٰه صلى اللّٰه عليه وسلم وكذلك الاجهاش يقال جهشت نفسى وأجهشت أى
  تمضت قال لبدد.
  قامن تشكى الى النفس مجهشة وقد حلتك سبعا بعد سبعينا
  ⁦(حيش)⁩
