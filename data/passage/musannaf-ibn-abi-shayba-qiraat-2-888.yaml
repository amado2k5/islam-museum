text: "… قال: مُرْها فلتسمح قُبُلَها بخرقة، ولتغسله بالماء داخلاً وخارجا، وتوضأ وضوءها للصلاة، ثم تغتسل. - في الرجل يجامع أهله، ثم يريد أن يعيد، ما يؤمر به ؟ - حدثنا أبو بكر قال: حدثنا حفص عن عاصم عن أبي المتوكل عن …"
summary:
