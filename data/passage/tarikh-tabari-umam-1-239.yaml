text: "… اهل بغداد وسامرا اموالا كثيرن من اموالهم فقووا من خق م للنهوض الى : الثغور لحرب الروم بذلك واقبلت العامة من نواحى الجبل و وفارس والاهواز وغيرها لغزو الروم فلم يبلغنا انه كان للسلطان فيما كان من الروم الى المسلمين …"
