label: { ar: "الموطأ 2793 — ابن محيصة يستأذن في إجارة الحجام فيأمره النبي أن يعلف به ناضحه", en: "Muwatta 2793" }
summary:
  ar: "يروي مالك عن ابن شهاب، عن ابن محيصة الأنصاري، أحد بني حارثة، أنه استأذن النبي في إجارة الحجام فنهاه عنها، فلم يزل يسأله ويستأذنه حتى قال له: اعلفه ناضحك، يعني رقيقك. ويذكر المحقق قول ابن عبد البر أن رواية يحيى عن ابن محيصة نفسه وهم، وأن الذي روى عنه الزهري هو حرام بن سعد بن محيصة، وأن الحديث على كل حال مرسل. {cite:muwatta-maruf-1997 p.569}"
