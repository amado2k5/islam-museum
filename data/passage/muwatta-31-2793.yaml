label: { ar: "الموطأ 2793 — ابن محيصة يستأذن في إجارة الحجام فيأمره النبي أن يعلف به ناضحه", en: "Muwatta 2793", es: "Muwatta 2793", fr: "Muwatta 2793", ur: "موطا 2793", tr: "El-Muvatta 2793 — İbn Muhayşe, bir kâhya tutmak için izin ister ve Peygamber ona kâhya ile devesini beslemesini emreder.", id: "Al-Muwatta 2793 — Ibnu Muhaysah meminta izin untuk menyewa seorang ahli bekam, dan Nabi memerintahkannya untuk memberi makan untanya dengan bekam tersebut." }
summary:
  ar: "يروي مالك عن ابن شهاب، عن ابن محيصة الأنصاري، أحد بني حارثة، أنه استأذن النبي في إجارة الحجام فنهاه عنها، فلم يزل يسأله ويستأذنه حتى قال له: اعلفه ناضحك، يعني رقيقك. ويذكر المحقق قول ابن عبد البر أن رواية يحيى عن ابن محيصة نفسه وهم، وأن الذي روى عنه الزهري هو حرام بن سعد بن محيصة، وأن الحديث على كل حال مرسل. {cite:muwatta-maruf-1997 p.569}"
  tr: "Malik, İbn Şihab'dan, o da Beni Haritha'dan İbn Muhayşe el-Ensari'den rivayet ettiğine göre, Peygamberimizden bir kâhya tutmak için izin istemiş, ancak Peygamberimiz bunu yasaklamıştır. İzin istemeye devam etmiş, sonunda Peygamberimiz ona, \"Ona deveni yedir\" demiştir, yani köleni kastetmiştir. Araştırmacı, İbn Abd el-Barr'ın Yahya'nın İbn Muhayşe'nin kendisinden rivayet ettiği hadisin hatalı olduğunu, el-Zuhri'nin rivayet ettiği kişinin Haram ibn Sa'd ibn Muhayşe olduğunu ve hadisin her durumda mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu belirttiğini aktarmaktadır. {cite:muwatta-maruf-1997 s.569}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Ibn Muhaysah al-Ansari, salah seorang dari Bani Haritha, bahwa ia meminta izin kepada Nabi untuk menyewa seorang tukang bekam, tetapi Nabi melarangnya. Ia terus meminta dan memohon izin hingga Nabi berkata kepadanya, \"Berikan dia untamu,\" yang berarti budakmu. Peneliti menyebutkan pernyataan Ibn Abd al-Barr bahwa riwayat Yahya dari Ibn Muhaysah sendiri adalah keliru, dan bahwa orang yang diriwayatkan oleh al-Zuhri adalah Haram ibn Sa'd ibn Muhaysah, dan bahwa hadits tersebut, bagaimanapun juga, adalah mursal (hadits dengan mata rantai periwayatan yang hilang). {cite:muwatta-maruf-1997 p.569}"
