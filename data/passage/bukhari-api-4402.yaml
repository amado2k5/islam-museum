label: { ar: "صحيح البخاري 4402 — ما حُرّم", en: "Sahih al-Bukhari 4402 — what was made unlawful", ur: "صحیح بخاری 4402 — جو حرام کیا گیا", es: "Sahih al-Bukhari 4402 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 4402 — ce qui a été déclaré illicite" }
text: "… عَلَيْكُمْ ثَلاَثًا، إِنَّ رَبَّكُمْ لَيْسَ بِأَعْوَرَ، وَإِنَّهُ أَعْوَرُ عَيْنِ الْيُمْنَى، كَأَنَّ عَيْنَهُ عِنَبَةٌ طَافِيَةٌ \". \" أَلاَ إِنَّ اللَّهَ حَرَّمَ عَلَيْكُمْ دِمَاءَكُمْ وَأَمْوَالَكُمْ، كَحُرْمَةِ يَوْمِكُمْ هَذَا، فِي بَلَدِكُمْ هَذَا، فِي شَهْرِكُمْ هَذَا، أَلاَ هَلْ بَلَّغْتُ \". قَالُوا نَعَمْ. قَالَ \" اللَّهُمَّ اشْهَدْ، ثَلاَثًا، وَيْلَكُمْ، أَوْ وَيْحَكُمُ، انْظُرُوا لاَ تَرْجِعُوا بَعْدِي كُفَّارًا، يَضْرِبُ بَعْضُكُمْ رِقَابَ بَعْضٍ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4402، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4402, that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4402، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4402, menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari (n° 4402) mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
