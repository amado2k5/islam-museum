label: { ar: "صحيح مسلم 5379 — أعضاء البدن", en: "Sahih Muslim 5379 — the organs of the body", ur: "صحیح مسلم 5379 — اعضائے بدن", es: "Sahih Muslim 5379 — los órganos del cuerpo", fr: "Sahih Muslim 5379 — Les organes du corps", tr: "Sahih Muslim 5379 — Vücut Parçaları", id: "Sahih Muslim 5379 — Bagian Tubuh" }
text: "… اللَّهِ ضَافَهُ ضَيْفٌ وَهُوَ كَافِرٌ فَأَمَرَ لَهُ رَسُولُ اللَّهِ بِشَاةٍ فَحُلِبَتْ فَشَرِبَ حِلاَبَهَا ثُمَّ أُخْرَى فَشَرِبَهُ ثُمَّ أُخْرَى فَشَرِبَهُ حَتَّى شَرِبَ حِلاَبَ سَبْعِ شِيَاهٍ ثُمَّ إِنَّهُ أَصْبَحَ فَأَسْلَمَ فَأَمَرَ لَهُ رَسُولُ اللَّهِ بِشَاةٍ فَشَرِبَ حِلاَبَهَا ثُمَّ أَمَرَ بِأُخْرَى فَلَمْ يَسْتَتِمَّهَا فَقَالَ رَسُولُ اللَّهِ \" الْمُؤْمِنُ يَشْرَبُ فِي مِعًى وَاحِدٍ وَالْكَافِرُ يَشْرَبُ فِي سَبْعَةِ أَمْعَاءٍ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5379، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5379 (The Book of Drinks), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5379، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 5379 (El Libro de las Bebidas), menciona los órganos del cuerpo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5379 (Le Livre des Boissons), mentionne les organes du corps. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5379 numaralı hadis, vücut organlarından bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5379, menyebutkan organ-organ tubuh. Hadits ini dikumpulkan oleh seorang peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
