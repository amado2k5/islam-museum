  الالية بعد الذوب الواحدة حة والحتمّ ما أذيب منها قال الراجز • يهم فيه القوم همّ الحمّ
  وحدت الالية أى أذبتها والحمة العين الحارّة يستشفى بها الاعلاء والمرضى وفى الحديث
  العالم كالمة وحمت حك أى قصدت قصدك قان الشاعر يصف بعيره
  فلمارآنى قد حمت ارتحاله • تلك لو يجدى عليه التهلك
  وقال الفراءبعنى عجلت ارتحالة قال يقال جمت ارتحال البعير أى عجله وحمت الماء
  أى سخسته أسم بالضم فى جمع ذلك وحمّ أيضابعنى قدّر وحمّ الشى وأحمّ أى قدرفهو
  محوم وحت ألهرة تحم بالفتح اذاصارت حمة ويقال أيضاحمّ الماء أى صارحارًا وأحه
  أمر أى أهمه وأحتمّ خروجنا أى دنا قال الاسمعىّ ما كان معذاه قدحان وقوعه فهو أجتم
  بالجيم واذاقات أحتمّ بالحاء فهو قدرولم يعرف أجمّ وقال الكسائىّ أجمّ الامر وأحتم أى
  حان وقته وأنشدابن السكيت للبيد
  قوله فى قول زهير فى نسضة ذكر
  لتذودهنْ وأيقنت ان لم تذد • أن قد أحمّ من الحتوف حمامها
  قال وكاهم يرويه بالماء وقال الفراء فى قول زهيروا حت يروى بالجيم والحام جيها وحتمّ الرجل
