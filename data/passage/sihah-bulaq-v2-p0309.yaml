  الماء وجم اهر أنه أى متعها بشئ بعد الطلاق وحم الفرخ أى طلع ريشه وحم رأسه اذا
  اسودبعد الحلق وحمت الرجل سخمت وجهه بالفحم والحمسم بالكسر الشديد
  السواد والاحمّ الاسود تقول رجل أحمّ بين الحم وأح_ه اللّه سبحانه جعله أحمّ وكيت أحتمّ
