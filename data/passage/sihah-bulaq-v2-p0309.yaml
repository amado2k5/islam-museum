  انخيل جلود ا وحوافر السكمت الحتمّ والهم الرماد والفهم وكل ما احترق من النار الواحدة
  حمة وحمهم الفرس وقدمهم وهوصوته اذاطاب العلف واليحموم اسم فرس النعمان
