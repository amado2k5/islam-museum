label: { ar: "الموطأ 2703 — عمر يدرك جابر بن عبد الله يحمل اللحم فينكر ذلك بآية الأحقاف", en: "Muwatta 2703", es: "Muwatta 2703", fr: "Muwatta 2703", ur: "موطا 2703", tr: "El-Muvatta 2703 — Ömer, Cabir ibn Abdullah'ın et taşıdığını gördü ve El-Ahkaf suresindeki ayeti referans göstererek bunu onaylamadı.", id: "Al-Muwatta 2703 — Umar melihat Jabir ibn Abdullah membawa daging dan tidak menyetujuinya, dengan mengutip ayat dari Al-Ahqaf." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب أدرك جابر بن عبد الله ومعه حمال لحم، فقال: ما هذا؟ فقال: يا أمير المؤمنين، قرمنا إلى اللحم، فاشتريت بدرهم لحما. فقال عمر: أما يريد أحدكم أن يطوي بطنه عن جاره أو ابن عمه؟ واستشهد بآية سورة الأحقاف في الطيبات التي تُذهب في الحياة الدنيا. {cite:muwatta-maruf-1997 p.525}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ömer ibn el-Hattab'ın et taşıyan Cabir ibn Abdullah'la karşılaştığını anlatır. Ömer, \"Bu nedir?\" diye sordu. Cabir, \"Ey Müminlerin Emiri, et aşeriyorduk, o yüzden bir dirheme biraz aldım\" diye cevap verdi. Ömer, \"Yükünüzü komşunuzla veya kuzeninizle paylaşmak istemeyeniniz yok mu?\" dedi ve ardından Ahkaf Suresi'nden bu dünyada kaybedilen iyi şeylerle ilgili ayeti okudu. {cite:muwatta-maruf-1997 s.525}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Umar ibn al-Khattab bertemu dengan Jabir ibn Abdullah yang membawa daging. Beliau bertanya, \"Apa ini?\" Jabir menjawab, \"Wahai Amirul Mukminin, kami sangat menginginkan daging, jadi saya membelinya seharga satu dirham.\" Umar berkata, \"Tidakkah ada di antara kalian yang mau berbagi beban dengan tetangga atau sepupu kalian?\" Kemudian beliau mengutip ayat dari Surah al-Ahqaf tentang kebaikan yang hilang di dunia ini. {cite:muwatta-maruf-1997 p.525}"
