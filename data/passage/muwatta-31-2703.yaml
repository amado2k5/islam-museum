label: { ar: "الموطأ 2703 — عمر يدرك جابر بن عبد الله يحمل اللحم فينكر ذلك بآية الأحقاف", en: "Muwatta 2703" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عمر بن الخطاب أدرك جابر بن عبد الله ومعه حمال لحم، فقال: ما هذا؟ فقال: يا أمير المؤمنين، قرمنا إلى اللحم، فاشتريت بدرهم لحما. فقال عمر: أما يريد أحدكم أن يطوي بطنه عن جاره أو ابن عمه؟ واستشهد بآية سورة الأحقاف في الطيبات التي تُذهب في الحياة الدنيا. {cite:muwatta-maruf-1997 p.525}"
