summary:
  ar: "قول لمالك: وكذلك المرأة التي يجب عليها الصيام في قتل النفس خطأ، إذا حاضت بين ظهري صيامها، أنها إذا طهرت لا تؤخر الصيام، وهي تبني على ما قد صامت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (814). {cite:muwatta-maruf-1997 p.405}"
