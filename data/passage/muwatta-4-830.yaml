label: { ar: "الموطأ 830 — مالك: كذلك المرأة يجب عليها الصيام في قتل النفس خطأ، إذا حاضت بين ظهري صيامها، فإذا طهرت لا تؤخر الصيام بل تبني على ما صامت", en: "Muwatta 830", es: "Muwatta 830", fr: "Muwatta 830", ur: "موطا 830", tr: "El-Muvatta 830 — Malik: Aynı şekilde, bir kadın kasıtsız olarak birini öldürürse oruç tutmalıdır; oruçluyken adet görürse, temizlendikten sonra orucunu ertelemez, kaldığı yerden devam eder.", id: "Al-Muwatta 830 — Malik: Demikian juga, seorang wanita wajib berpuasa jika ia tanpa sengaja membunuh seseorang, dan jika ia mengalami haid selama berpuasa, maka jika ia menjadi suci, ia tidak menunda puasanya tetapi melanjutkan dari tempat ia berhenti." }
summary:
  ar: "قول لمالك: وكذلك المرأة التي يجب عليها الصيام في قتل النفس خطأ، إذا حاضت بين ظهري صيامها، أنها إذا طهرت لا تؤخر الصيام، وهي تبني على ما قد صامت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (814). {cite:muwatta-maruf-1997 p.405}"
  tr: "Malik şöyle demiştir: Benzer şekilde, kasıtsız bir cinayet nedeniyle oruç tutmakla yükümlü olan bir kadın, orucu sırasında adet görürse, temizlendikten sonra orucunu ertelememeli, kaldığı yerden devam etmelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (814) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.405}"
  id: "Malik berkata: Demikian pula, seorang wanita yang wajib berpuasa karena pembunuhan yang tidak disengaja, jika ia mengalami haid selama berpuasa, tidak boleh menundanya setelah ia suci, melainkan melanjutkan dari tempat ia berhenti. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (814). {cite:muwatta-maruf-1997 p.405}"
