text: "أخبرنا أحمد بن محمد بن إبراهيم المهرجاني قال: أخبرنا أبو عبد الله بن بطة قال: أخبرنا عبد الله بن محمد بن عبد العزيز قال: أخبرنا إسحاق بن إبراهيم المروزي قال: أخبرنا حفص بن غياث، عن داود بن أبي هند، عن الشعبي، عن أبي جبيرة بن"
