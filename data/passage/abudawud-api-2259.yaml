label: { ar: "سنن أبي داود 2259 — الأب والأبوة", en: "Sunan Abi Dawud 2259 — the father and fatherhood", ur: "سنن ابی داؤد 2259 — باپ اور والدیت", es: "Sunan Abi Dawud 2259 — El padre y la paternidad", fr: "Sunan Abi Dawud 2259 — le père et la paternité", tr: "Sunan Abi Davud 2259 — Baba ve Babalık", id: "Sunan Abi Dawud 2259 — Sang Ayah dan Peran Ayah" }
text: "… عَنْ مَالِكٍ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّ رَجُلاً، لاَعَنَ امْرَأَتَهُ فِي زَمَانِ رَسُولِ اللَّهِ وَانْتَفَى مِنْ وَلَدِهَا فَفَرَّقَ رَسُولُ اللَّهِ بَيْنَهُمَا وَأَلْحَقَ الْوَلَدَ بِالْمَرْأَةِ. قَالَ أَبُو دَاوُدَ الَّذِي تَفَرَّدَ بِهِ مَالِكٌ قَوْلُهُ \" وَأَلْحَقَ الْوَلَدَ بِالْمَرْأَةِ \". وَقَالَ يُونُسُ عَنِ الزُّهْرِيِّ عَنْ سَهْلِ بْنِ سَعْدٍ فِي حَدِيثِ اللِّعَانِ وَأَنْكَرَ حَمْلَهَا فَكَانَ ابْنُهَا يُدْعَى إِلَيْهَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 2259، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2259 (Divorce (Kitab Al-Talaq)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2259، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2259 (Divorcio (Kitab Al-Talaq)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2259 (Le Divorce (Kitab Al-Talaq)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 2259 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2259, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
