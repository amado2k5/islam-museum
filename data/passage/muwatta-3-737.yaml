text: "لا يصلح بيع الزرع، حتى ييبس في أكمامه، ويستغني عن الماء"
summary:
  ar: "يقول يحيى: قال مالك: لا يصلح بيع الزرع حتى ييبس في أكمامه ويستغني عن الماء. ويذكر المحقق أن قوله «قال يحيى: قال مالك» ليس في نسخة م. {cite:muwatta-maruf-1997 p.368}"
  tr: "Yahya şöyle der: Malik şöyle der: Ürünler, kabuklarında kuruyup suya ihtiyaç duymayacak hale gelene kadar satılması caiz değildir. Editör, “Yahya şöyle der: Malik şöyle der” ifadesinin M el yazmasında bulunmadığını belirtmektedir. {cite:muwatta-maruf-1997 s.368}"
  id: "Yahya berkata: Malik berkata: Tidak diperbolehkan menjual hasil panen sebelum mengering di dalam selubungnya dan tidak lagi membutuhkan air. Editor mencatat bahwa frasa “Yahya berkata: Malik berkata” tidak ada dalam manuskrip M. {cite:muwatta-maruf-1997 p.368}"
