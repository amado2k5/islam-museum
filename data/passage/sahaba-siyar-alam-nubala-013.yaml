text: "ا لأنفسكم، قال: فخرجوا يطلبون ويسيرون في الأرض، يلتمسون أهل كتاب من اليهود والنصارى والملل كلها يتطلبون الحنيفية، فأما ورقة فتنصر، واستحكم في النصرانية، وحصل الكتب، وعلم علما كثيرا، ولم يكن فيهم أعدل شأنا من زيد: اعتزل الأوثان والملل إلا"
