text: "كان يجمع بين الظهر والعصر في سفره إلى تبوك"
summary:
  ar: "أول حديث في باب الجمع بين الصلاتين في الحضر والسفر. يرويه يحيى عن مالك عن داود بن الحصين عن الأعرج مرسلاً: كان النبي يجمع بين الظهر والعصر في سفره إلى تبوك. ويبين المحقق أن إحدى النسخ تزيد «عن أبي هريرة» وأن الحديث عند جمهور رواة الموطأ مرسل، وأن ابن عبد البر رجّح إرساله في رواية يحيى وذكر أن أبا مصعب في غير الموطأ ومطرفاً والحنيني وغيرهم أسندوه عن أبي هريرة (التمهيد 2/337–339)، ويستدل بأن الدارقطني في العلل لم يذكر يحيى فيمن وصله. ويذكر أنه رواه مرسلاً أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.205} {cite:muwatta-maruf-1997 p.206}"
