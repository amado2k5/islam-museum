label: { ar: "صحيح البخاري 2776 — ما خلّفه من تركة وميراث، وصية أو عهد أخير", en: "Sahih al-Bukhari 2776 — what was left behind: estate and inheritance; a testament or parting counsel", ur: "صحیح بخاری 2776 — ترکہ اور میراث، وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 2776 — lo que quedó: patrimonio y herencia; un testamento o consejo de despedida" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ ـ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يَقْتَسِمْ وَرَثَتِي دِينَارًا، مَا تَرَكْتُ بَعْدَ نَفَقَةِ نِسَائِي وَمَئُونَةِ عَامِلِي فَهْوَ صَدَقَةٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2776، يذكر ما خلّفه من تركة وميراث، ووصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2776 (Wills and Testaments (Wasaayaa)), that mentions what was left behind: estate and inheritance, a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 2776، جس میں ترکہ اور میراث، وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2776 (Testamentos (Wasaayaa)), menciona lo que se dejó como legado: bienes y herencia, un testamento o consejo de despedida. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
