label: { ar: "سنن النسائي 3323 — ما حُرّم", en: "Sunan al-Nasa'i 3323 — what was made unlawful", ur: "سنن نسائی 3323 — جو حرام کیا گیا", es: "Sunan al-Nasa'i 3323 — lo que se declaró ilícito" }
text: "… بَيْتِهِمْ فَأَتَتْ بِنْتُ سُهَيْلٍ إِلَى النَّبِيِّ فَقَالَتْ إِنَّ سَالِمًا قَدْ بَلَغَ مَا يَبْلُغُ الرِّجَالُ وَعَقَلَ مَا عَقَلُوهُ وَإِنَّهُ يَدْخُلُ عَلَيْنَا وَإِنِّي أَظُنُّ فِي نَفْسِ أَبِي حُذَيْفَةَ مِنْ ذَلِكَ شَيْئًا. فَقَالَ النَّبِيُّ \" أَرْضِعِيهِ تَحْرُمِي عَلَيْهِ \". فَأَرْضَعْتُهُ فَذَهَبَ الَّذِي فِي نَفْسِ أَبِي حُذَيْفَةَ فَرَجَعْتُ إِلَيْهِ فَقُلْتُ إِنِّي قَدْ أَرْضَعْتُهُ فَذَهَبَ الَّذِي فِي نَفْسِ أَبِي حُذَيْفَةَ."
summary:
  ar: "حديث في سنن النسائي، رقم 3323، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3323 (The Book of Marriage), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3323، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3323 (El Libro del Matrimonio), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
