text: "… من الباطل فإنَّ به الخيطُ الأبيضُ من انكحيط الأسودِ من الباطل يُبَيَّن، ولزُوم الطاعة، التى أوجبها اللّهُ لنا على عباده ونَدَب إليها، ومُلازَمة الجماعةِ، التى يكيفيه من بركاتها أنَّ يَد اللّهِ عليها ؛ وإقامة الِحِدْمة فيما قِبَلَه من البلاد، وكلِّ …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 13، ص 264، يرد فيه ذكر ما يجب على المكلف، والمندوب، والطاعة، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 13, p. 264, whose wording mentions what is binding on the person addressed, the recommended (mandub), obedience, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 13، ص 264 کا اقتباس جس میں جو مکلف پر واجب ہے، مندوب، اطاعت، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subh al-A'sha de al-Qalqashandi, volume numérisé 13, p. 264, dont le texte mentionne ce qui s'impose à la personne responsable, le recommandé (mandub), l'obéissance, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen digitalizado 13, p. 264, cuyo texto menciona lo que obliga a la persona responsable, lo recomendado (mandub), la obediencia, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kalkaşandi'nin Subh al-A'sha adlı eserinin 13. resimli cildinin 264. sayfasından, farz olan, tavsiye edilen ve itaat edilmesi gereken fiillerden bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz fiiller, görevler, itaat edilmesi gereken fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Subh al-A'sha karya al-Qalqashandi, jilid 13, halaman 264, yang menyebutkan apa yang wajib, dianjurkan, dan taat. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
