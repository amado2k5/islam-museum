label: { ar: "الموطأ 1001 — مالك في الرجل المحرم: إنه يراجع امرأته إن شاء إذا كانت في عدة منه", en: "Muwatta 1001", es: "Muwatta 1001", fr: "Muwatta 1001", ur: "موطا 1001", tr: "El-Muvatta 1001 — Malik, ihramlı erkek hakkında: Eğer kadın kendisinden bekleme dönemindeyse, dilerse karısını geri alabilir.", id: "Al-Muwatta 1001 — Malik tentang laki-laki yang sedang ihram: Ia boleh mengambil kembali istrinya jika ia mau, apabila istrinya sedang dalam masa iddah." }
text: "إنه يراجع امرأته إن شاء إذا كانت في عدة منه"
summary:
  ar: "قول يرويه يحيى عن مالك في الرجل المحرم: أنه يراجع امرأته إن شاء إذا كانت في عدة منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1181) وسويد (332). {cite:muwatta-maruf-1997 p.469}"
  tr: "Yahya'ya Malik'ten rivayetle atfedilen, ihramlı bir erkekle ilgili bir söz şöyledir: Eğer kadın kendisinden bekleme dönemindeyse, dilerse karısını geri alabilir. Araştırmacı, bu sözün Malik'ten Ebu Mus'ab (1181) ve Suveyd (332) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.469}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Yahya berdasarkan riwayat Malik mengenai seorang pria yang sedang ihram: bahwa ia boleh mengambil kembali istrinya jika ia mau, apabila istrinya sedang dalam masa iddah. Peneliti menyebutkan bahwa hadits ini diriwayatkan berdasarkan riwayat Malik oleh Abu Mus'ab (1181) dan Suwaid (332). {cite:muwatta-maruf-1997 p.469}"
