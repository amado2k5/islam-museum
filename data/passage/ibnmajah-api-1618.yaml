text: "… عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، قَالَ: سَأَلْتُ عَائِشَةَ فَقُلْتُ: أَىْ أُمَّهْ أَخْبِرِينِي عَنْ مَرَضِ رَسُولِ اللَّهِ ـ. قَالَتِ: اشْتَكَى فَعَلَقَ يَنْفُثُ فَجَعَلْنَا نُشَبِّهُ نَفْثَهُ بِنَفْثَةِ آكِلِ الزَّبِيبِ وَكَانَ يَدُورُ عَلَى نِسَائِهِ فَلَمَّا ثَقُلَ اسْتَأْذَنَهُنَّ أَنْ يَكُونَ فِي بَيْتِ عَائِشَةَ وَأَنْ يَدُرْنَ عَلَيْهِ. قَالَتْ: فَدَخَلَ عَلَىَّ رَسُولُ اللَّهِ ـ وَهُوَ بَيْنَ رَجُلَيْنِ وَرِجْلاَهُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1618، يذكر مرض النبي، والمرض والمريض، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1618 (Chapters Regarding Funerals), that mentions the Prophet's illness, illness and the sick, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1618، جس میں نبی کی بیماری، بیماری اور بیمار، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
