text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف الجيم فيدرّ حينئذ بلا ضرر، ويخرج الجنين، ويزيل برد الرحم وريحه وبرد الخصية. السموم : نافع من لذع الهوام، وهو ترياق خناق الخربق، والأغبر إلى السواد منه سمّ، وربما قتل …"
