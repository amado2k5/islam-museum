text: "… الشاهد من نوع القضية تولى جحا القضاء في أحد البلاد فجاءهُ ذاتَ يوم رجل يصيح بصوت عالٍ : يا سيدي القاضي، لقد سُرِقَتْ طنبورتي ووجدتها في السوق معَ فلانٍ، فخُذْها لي منه. فهدَّأَ القاضِي جحا خاطرَه، ونادى المُحْضرَ وأمرَهُ أن …"
summary:
  ar: "كان جحا قاضيًا فنظر في دعوى على طنبورة، وهي آلة وترية، وُجدت في السوق، ووصف الشاهدان علاماتها، فاعترض المدعي بأن أحدهما يبيع الخمر والآخر ماجن، فقال جحا إنه لا يمكن العثور على شاهدين أنسب لدعوى طنبورة. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  en: "As judge, Juha hears a claim for a tanbura, a lute, found in the market; the witnesses describe its marks; the claimant objects that one witness sells wine and the other is a libertine; Juha says that no better witnesses could be found for a lute claim. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  ur: "قاضی کی حیثیت سے جحا نے بازار میں ملنے والی ایک طنبورہ، یعنی ایک ساز، کے دعوے کی سماعت کی؛ گواہوں نے اس کی نشانیاں بیان کیں؛ مدعی نے اعتراض کیا کہ ایک گواہ شراب بیچتا ہے اور دوسرا بدکردار ہے؛ جحا نے کہا کہ طنبورے کے دعوے کے لیے اس سے بہتر گواہ نہیں مل سکتے۔ {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  fr: "Juha, juge, entend une demande concernant un tanbura, un luth, trouvé au marché ; les témoins en décrivent les signes distinctifs ; le demandeur objecte que l'un des témoins vend du vin et que l'autre est un libertin ; Juha dit qu'on ne saurait trouver de meilleurs témoins pour une demande portant sur un luth. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  es: "Como juez, Juha atiende una reclamación sobre un tanbura, un laúd, hallado en el mercado; los testigos describen sus marcas; el demandante objeta que uno de los testigos vende vino y el otro es un libertino; Juha dice que no se podrían encontrar mejores testigos para una reclamación de laúd. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
  tr: "Juha bir hakimdi ve pazarda bulunan bir tanbura, yani telli bir çalgı ile ilgili bir davayı ele alıyordu. İki tanık, çalgının özelliklerini anlattı, ancak davacı, tanıklardan birinin şarap satıcısı, diğerinin ise ahlaksız olduğunu söyleyerek itiraz etti. Juha, bir tanbura ile ilgili bir dava için daha uygun iki tanık bulmanın imkansız olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 47}"
  id: "Juha adalah seorang hakim, dan ia menangani kasus mengenai tanbura, sebuah alat musik berdawai, yang ditemukan di pasar. Dua saksi menjelaskan karakteristiknya, tetapi penggugat keberatan, dengan mengatakan bahwa salah satu dari mereka menjual anggur dan yang lainnya adalah seorang libertin. Juha menjawab bahwa tidak mungkin menemukan dua saksi yang lebih cocok untuk kasus mengenai tanbura. {cite:juha-nawadir-kubra-djuwaydi p. 47}"
