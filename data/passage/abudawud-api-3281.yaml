text: "حَدَّثَنَا مُحَمَّدُ بْنُ مُحَمَّدِ بْنِ خَلاَّدٍ أَبُو عُمَرَ، حَدَّثَنَا مُسَدَّدٌ، عَنْ أُمَيَّةَ بْنِ خَالِدٍ، قَالَ : لَمَّا وُلِّيَ خَالِدٌ الْقَسْرِيُّ أَضْعَفَ الصَّاعَ فَصَارَ الصَّاعُ سِتَّةَ عَشَرَ رَطْلاً. قَالَ أَبُو دَاوُدَ : مُحَمَّدُ بْنُ مُحَمَّدِ بْنِ خَلاَّدٍ قَتَلَهُ الزِّنْجُ صَبْرًا، فَقَالَ بِيَدِهِ هَكَذَا وَمَدَّ أَبُو دَاوُدَ يَدَهُ وَجَعَلَ بُطُونَ كَفَّيْهِ إِلَى الأَرْضِ، قَالَ : وَرَأَيْتُهُ فِي …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3281، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3281 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 3281، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3281 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
