text: |-
  ⁦(فصل الناف)⁩
  ٣٨٣
  ومنه قولهم قد عمل به الفاقرة ورجل فقير من المال قال ابن السكيت الف-قير الذى له بلغة
  من العيش قال الراعى يمدح عبد الملك بن مروان ويشكواليه سعاته
  أما الفقير الذى كانت حلوبته • وفق العيال فلم يترك له سبد
  قال والمسكين الذى لاشئ له وقال الاصمعى المسكين أحن حالا من الفتير وقال يونس
  لتقيرأ حسن حالا من المسكين قال وقلت لاء راتي أفقير أنت فقال لا واللّه بل مسكين وقال
  ابن الاعرابى الفقير الذى لاشئ له قال والمكين مثله والفة رلغة فى النقر مثل الضعف
  والضعف والفقير مخرج الماء من القناة وأماقول الراجز
  ماليلة الفقير الاشيطان
  ذهوركى بعينه معروف والسقير حفيريحة رحول الفسيلة اذاغرست تقول منه فقرت
  للودية تفقيرا وفقرت الخرز أيضائقبته والفقير المكسور فقار الفاهر وقال لبيد
  لمارأى ابد النسور تطايرت رفع القوادم كالفقير الاعزل
  والمفرالسيف الذى فى متنه حزوزوقوله-م أفرك الصيد أى أمكنك من فقاره أى فارمه
  وأفقرن فلاناناقتى أى أعرته فقاره اليركبهما والاسم الفقرى قال الشاعر
  له ربة قد أحرمت حلظهره • ذافيه للفقرى ولا الحج مزعم
  وأفقره اللّٰه من الفقرفافتقروية ال سداله مضاقره أى أغناه وستوجوه فره وقونهم فلان
  ما أذقره وما أغناه شاذ لانه يقال فى فعليهما افترواستغف فلايصح التعجب منهما ( كر
  التفكر التأمل والاسم الفكر والفسكرة والمصدر الفكر بالفتح قال بعقوب بقال ليس لى
  فهذا الامر فكرأى ليس لى فيه اجة قال والفع فيه أقصعِ من الكسر وأف
  فى الشى وفكرفيه وتفكر بمعنى ورجل فكير مثال فسيق كثير التفكر فور فارت
  القدرتفورفورا وفورانا جاشت ومنه قولهم ذهبت فى حاجة ثم أتيت فلانا من فورى أى
  قبل ان أسكن وفارفاتره لغة فى ثارثائره اذاجاش غضبه وفورة الحرّشدته وفورة العشاء بعد
  العتمة والفوربالضم الظباء لا واحداها من لفظها يقال لا أفعل كذا مالألأت الفورأى
  بصبحت بأذنا بها وفوارة الورك بالفتح والتشديد ثقبها وفوارة القدر باضم والتخفيف
  ما يفور من -رها والقياران اللذان يكتنفان لان الميزان ⁦(فهر)⁩ الفهرالحجرم-ل.
  الكف يذ كرويؤنث والجمع أفهار وكان الاصمعى بقول فهرة وفهر وتصغيرها فهير
  وعامر بن فهيزة رجل وفهر أبوقبيلة من قريش وهوفهر بن مالكك بن النضر بن كتانة قال
  الطائى الفهيرة محض ياقى فيه الرضف فاذ اغلاذر عليه الدقيق وسيط به ثم أكل حكاه ابن
  السسكيت وفهر اليهودبا اضم مدراسه-م وأصلها يهر وهى عبرانية فعزبت والفهر أن يجامع
  الرجل المرأة ثم يتحوّل عنها قبل الفراغ الى أخرى فينزل فيها وفى الحديث أنه نهى عن الفهر
  وكذلك الفهر مشل نهرونهر وفهر الرجل تفهيرا أى أعيا يقال أوّل نقصان حضر الفرس
  الترادثم الفتور ثم التقهير⁦(١)⁩ وتفهر الرجل فى المال اتسع فيه كأنه مبدل من تبجرأ وأنه
  لغة فى الاعياء والفتور
  صل القاف بر . لقبرواحد القبور والمقبرة والمقبرة بفتح الباءوضعهاواحدة
  المقابروقد جاء فى الشعر المقبر وقال عبد اللّه بن ثعلبة الحنقى
  قوله مدراسه-م
  أى الذى
  يجتمعون فيه للصلاة اه مصباح
  ووقع فى بعض نسخ مدارسهم
  وه و تحريف قاله نصر
  ١ على وزن التسكريم اه
  وانقولى
