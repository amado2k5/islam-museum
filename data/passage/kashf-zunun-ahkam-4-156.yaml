text: "… كُلّها على الإطلاق. مَطْلِبٌ: تَعْيينُ المِلْم الذي هو فَرْضُ عَيْنٍ على كُلِّ مُكَلَّف: أعني الذي يتضمنه قوله: طلبُ العِلْم فريضةٌ على كُلِّ مُسلم ومُسْلِمة. واعْلَم أنَّ للعُلماء اختلافًا عظيمًا في تَعْيين ذلك العِلْم. قال المفسِّرون والمُحدِّثون: هو عِلْم الكتاب والسُّنة. …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 4، ص 156، يرد فيه ذكر الفريضة والفرائض، والفرض، وفرض العين، وما وجب على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 4, p. 156, whose wording mentions the obligation (farida), the obligatory (fard), the individual obligation (fard 'ayn), a duty laid on every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 4، ص 156 کا اقتباس جس میں فریضہ اور فرائض، فرض، فرضِ عین، جو ہر مسلمان پر لازم ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kashf al-Zunun de Hajji Khalifa, volume numérisé 4, p. 156, dont le texte mentionne l'obligation (farida), l'obligatoire (fard), l'obligation individuelle (fard 'ayn), un devoir imposé à chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
