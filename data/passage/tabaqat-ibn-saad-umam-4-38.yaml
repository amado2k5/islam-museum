text: "… وقلاع فارس، وقد كان أَهل البَيْضاء من إصْطخْر غلبوا عليها، فسار إليها ابن عامر فافتتحها ثانية، وافتتح جُور والكارِيان والفنْسَجان وهما من دارابْجرد، ثمَّ تاقت نفسه إلى خراسان، فقيل له بها يَزْدَجرْد بن شهرِيار بن كسْرَى ومعه أَساورة فارس، وقد …"
