label: { ar: "الموطأ 910 — هشام بن عروة عن أبيه: أسماء بنت أبي بكر كانت تلبس المعصفرات المشبعات وهي محرمة، ليس فيها زعفران", en: "Muwatta 910", es: "Muwatta 910", fr: "Muwatta 910", ur: "موطا 910", tr: "El-Muvatta 910 — Hişam ibn Urve, babasından rivayetle: Esma bint Ebu Bekir, ihramlı haldeyken bolca boyanmış elbiseler giyerdi, ancak bu elbiselerde safran bulunmazdı.", id: "Al-Muwatta 910 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Asma bint Abi Bakr biasa mengenakan pakaian yang diwarnai dengan indah ketika dalam keadaan ihram, tetapi pakaian itu tidak mengandung kunyit." }
text: "كانت تلبس المعصفرات المشبعات وهي محرمة، ليس فيها زعفران"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن أسماء بنت أبي بكر كانت تلبس المعصفرات المشبعات وهي محرمة، ليس فيها زعفران. ويذكر المحقق أن لفظة «الثياب» سقطت من نسخة م، وأنه رواه عن مالك أبو مصعب (1042) وسويد (488) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.438} {cite:muwatta-maruf-1997 p.439}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından rivayet ederek, Esma bint Ebu Bekir'in ihramlıyken zengin renklerle boyanmış elbiseler giydiğini, ancak bu elbiselerin safran içermediğini nakletmiştir. Editör, M el yazmasında \"elbise\" kelimesinin eksik olduğunu ve bunun Malik'ten Ebu Mus'ab (1042), Suveyd (488) ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Beyhaki'nin de bunu kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.438} {cite:muwatta-maruf-1997 s.439}"
  id: "Malik meriwayatkannya atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, bahwa Asma binti Abi Bakr biasa mengenakan pakaian yang diwarnai dengan indah ketika dalam keadaan ihram, tetapi pakaian tersebut tidak mengandung safron. Editor mencatat bahwa kata \"pakaian\" hilang dari manuskrip M, dan bahwa riwayat tersebut diwariskan atas otoritas Malik oleh Abu Mus'ab (1042), Suwaid (488), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.438} {cite:muwatta-maruf-1997 p.439}"
