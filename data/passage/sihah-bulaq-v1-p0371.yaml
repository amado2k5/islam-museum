text: |-
  ٢٧٠
  ⁦(باب الذال)⁩
  ⁦(أخذ)⁩
  فال أبو عبيدة هى اسم لمكل مائة وأنشدلسلمة بن الحرث
  ونصر بن دهمان الهنيدة عاشها * وتسعين عامائم قوم قانصاتا
  ( هود هاديهود هوداتاب ورجع الى الحق فهوهائد وقوم هودمشل حائل وحول
  وبازل وبزل وقال اء راتى انى امر ؤمن مدحه هائد قال أبو عبيدة التهوّد التوبة
  والعمل الصالح ويقال أيضاهاد وتهوداذاصاريه وديا وألهوداليهود وأرادوا باليهود
  اليهوديين واسكنهم حذذوايا الاضافة كما قالوازنج وزفج وانماء رف على هذا الحدفجمع
  على قياس شعيرة وشعير ثم عرف الجمع بالالف والللام ولولاذلات لم يجزد خول الااف واللام
  عايه لانه معرفة مونت فجرى فى كلامهم مجرى القبيلة ولم يجعل كالحى وأنشد
  عنى"ين سليمان الهوى للا.ود بن يعفر
  فرت يهودوأسلت جيرانها * صحى لمافعلت يهود صمام
  وهو داسم ني ينصرف تقول هذه هوداذا أردت سورة هو دوات جعلت هودا اسم السورة
  لم تصرفه وكذلك نوح ونون والتهويد المشى الزويد مثل الدييب وأصله من الهوادة وفى
  الحسديث أسرعوا المشى فى الجنازة ولا تهوّدوا كماتهوّد اليهود والنصارى وكذلك التهويد
  فى المنطق هوالساحكن بقالى غناءمه ودوالتهويدأيضا النوم وتهويد الشراب اسكار.
  والتهويد أن يصير الانسان يهوديا وفى الحديث فابواه يهودانه والهوادة الصلح والمبسل
  والمهاودة المصالحة والممايلة والهودة بالتصريك السنام والجمع هود وقال الشاعر
  كوم عليها هودانضاد وتسكن الواوفيق ال هودة ⁦(هيد)⁩ هدت الشى أهيده هيدا
  حكنه وفى الحديث ه_ده يعنون به المسهد أى هده ثم أصلحه وتقول مايم._دنى ذلك أى
  ما يزعجنى وما اكترث له ولا أباليه قال يعة وب لا ينطق بيهيد الابح رف حجد والهيدان الجيات
  وهبد وها دزجر للابل وأنشدأ بوعمر وللققال السكاابيه
  وقد حدونا بهيدوهلا * حتى يرى أسفلها صارعلا
  وقواهم ماله هيدولا هادأى ما يقال له هيدولاهاد وأنشدلا بن هرمة
  تى استقامت له الآفاقطائعة • فايقال له هيد ولاهاد
  أى لا يحرك ولا يمنع من شىء ولايز جر عنه تقول منه هدت الرجل وهيدته عن يعقوب
  باب الذال
  صل الالف ⁦( خذ)⁩ أخذت الشئ آخذه أخذاتناولته والاخذ بالكسر الاسم
  والامر منه خذوأصله أؤخذ الا انه-م استثقلوا الهمزتين فذفوه ما تحفيفا وكذلت القول
  فى الامر من أكل وأمر واسْباه ذلكَ وقواهم خذعفك أى خدما أقول ودع عنكْ الشكْ والمراء
  يقال خذ انلخطام وخذيانخطام؟حن ونجوم الاخذمنازل القهر لان القمر يأخذ كل ليلة
  فى منزل منها وآخذه بذنيه مؤاخذة والعامة تقول واخذه ويقال اتتهذوافى القتال
  بهم زتين أى أخذ بعضهم بعضا والاتخاذ افتعال أيضا من الاخذ الا أنه أدغم يعدتليين
  الهمزة وابدال التاءثم لما كثر استعماله على لفظ الافتعال نوهموا أن التاء أصليسة فبنوا
