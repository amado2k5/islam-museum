label: { ar: "الموطأ 1452 — مالك: الإخوة للأم لا يرثون مع الولد ولا مع ولد الابن ولا مع الأب ولا مع الجد، ويرثون فيما سوى ذلك السدس أو الثلث", en: "Muwatta 1452" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الإخوة للأم لا يرثون مع الولد شيئا، ولا مع ولد الابن، ذكرانا كانوا أو إناثا، ولا يرثون مع الأب ولا مع الجد أبي الأب شيئا. وأنهم يرثون فيما سوى ذلك، فيفرض للواحد منهم السدس، ذكرا كان أو أنثى، فإن كانا اثنين فلكل واحد منهما السدس، فإن كانوا أكثر فهم شركاء في الثلث يقتسمونه بالسواء، وذلك بآية الكلالة في سورة النساء. {cite:muwatta-maruf-1997 p.8}"
