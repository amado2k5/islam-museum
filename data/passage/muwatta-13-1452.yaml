label: { ar: "الموطأ 1452 — مالك: الإخوة للأم لا يرثون مع الولد ولا مع ولد الابن ولا مع الأب ولا مع الجد، ويرثون فيما سوى ذلك السدس أو الثلث", en: "Muwatta 1452", es: "Muwatta 1452", fr: "Muwatta 1452", ur: "موطا 1452", tr: "El-Muvatta 1452 — Malik: Anne tarafından kardeşler, oğul, torun, baba veya dede ile mirasçı olmazlar; ancak diğer tüm durumlarda altıda bir veya üçte bir oranında mirasçı olurlar.", id: "Al-Muwatta 1452 — Malik: Saudara kandung dari pihak ibu tidak mewarisi bersama anak laki-laki, tidak pula bersama cucu laki-laki, tidak pula bersama ayah, dan tidak pula bersama kakek, tetapi mereka mewarisi seperenam atau sepertiga dalam semua kasus lainnya." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الإخوة للأم لا يرثون مع الولد شيئا، ولا مع ولد الابن، ذكرانا كانوا أو إناثا، ولا يرثون مع الأب ولا مع الجد أبي الأب شيئا. وأنهم يرثون فيما سوى ذلك، فيفرض للواحد منهم السدس، ذكرا كان أو أنثى، فإن كانا اثنين فلكل واحد منهما السدس، فإن كانوا أكثر فهم شركاء في الثلث يقتسمونه بالسواء، وذلك بآية الكلالة في سورة النساء. {cite:muwatta-maruf-1997 p.8}"
  tr: "Malik, aralarındaki görüş birliğinin, anne tarafından kardeşlerin, erkek veya kız olsun, oğullarından veya oğullarının oğullarından hiçbir şey miras almadığı, babalarından veya baba tarafından dedelerinden de miras almadığı yönünde olduğunu belirtir. Diğer tüm durumlarda miras alırlar ve her biri, erkek veya kız olsun, altıda bir pay alır. İki kardeş varsa, her biri altıda bir pay alır. İkiden fazla kardeş varsa, Nisa Suresi'ndeki doğrudan mirasçı olmayanların miras almasıyla ilgili ayete göre kalan üçte birini eşit olarak paylaşırlar. {cite:muwatta-maruf-1997 s.8}"
  id: "Malik menyatakan bahwa konsensus di antara mereka adalah bahwa saudara kandung dari pihak ibu tidak mewarisi apa pun bersama seorang putra, atau bersama cucu laki-laki, baik laki-laki maupun perempuan, dan juga tidak mewarisi apa pun bersama ayah atau kakek dari pihak ayah. Mereka mewarisi dalam semua kasus lain, dengan masing-masing menerima seperenam, baik laki-laki maupun perempuan. Jika ada dua orang, masing-masing menerima seperenam. Jika ada lebih dari dua orang, mereka membagi sepertiga sisanya secara merata, sesuai dengan ayat tentang warisan tanpa ahli waris langsung dalam Surah An-Nisa. {cite:muwatta-maruf-1997 p.8}"
