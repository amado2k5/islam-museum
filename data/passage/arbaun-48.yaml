text: "أربع من كن فيه كان منافقاً وإن كانت خصلة منهن فيه كانت فيه خصلة من النفاق حتى يدعها من إذا حدث كذب وإذا وعد أخلف وإذا خاصم فجر وإذا عاهد غدر"
summary:
  ar: "حديث عبد الله بن عمرو بن العاص عن النبي قال: «أربع من كن فيه كان منافقاً وإن كانت خصلة منهن فيه كانت فيه خصلة من النفاق حتى يدعها: من إذا حدث كذب وإذا وعد أخلف وإذا خاصم فجر وإذا عاهد غدر» — سادس الأحاديث التي زادها ابن رجب؛ أخرجاه البخاري ⁦(34، 2459، 3178)⁩ ومسلم (58) من رواية الأعمش عن عبد الله بن مرة عن مسروق عن عبد الله بن عمرو بن العاص، وخرجا أيضاً من حديث أبي هريرة «آية المنافق ثلاث: إذا حدث كذب وإذا وعد أخلف وإذا ائتمن خان» وفي رواية لمسلم «وإن صام وصلى وزعم أنه مسلم» وفي رواية أخرى «من علامات المنافق ثلاثة»؛ قال ابن رجب: حمل طائفة ممن يميل إلى الإرجاء هذا الحديث على المنافقين الذين كانوا على عهد النبي — إذ حدثوه فكذبوه وائتمنهم على سره فخانوه ووعدوه الخروج معه في الغزو فأخلفوه — وروى محمد المحرم هذا التأويل عن عطاء أنه قال حدثني به جابر عن النبي وذكر أن الحسن رجع إلى قول عطاء لما بلغه، قال ابن رجب: وهذا كذب والمحرم شيخ كذاب معروف بالكذب — قال عنه البخاري منكر الحديث وقال عنه يحيى بن معين ليس بشيء ⁦(جامع العلوم والحكم ص 901–913)⁩."
  en: "The hadith of Abdullah ibn Amr ibn al-As from the Prophet: 'four traits — whoever has them all is a hypocrite, and whoever has one of them has a trait of hypocrisy until he gives it up: one who when he speaks lies, when he promises breaks his word, when he disputes behaves wickedly, and when he pledges betrays' — the sixth of Ibn Rajab's added hadiths, transmitted by al-Bukhari (34, 2459, 3178) and Muslim (58) through al-A'mash from Abdullah ibn Murra from Masruq from Abdullah ibn Amr ibn al-As, both also carrying Abu Hurayra's report 'the hypocrite's sign is three: when he speaks he lies, when he promises he breaks his word, and when entrusted he betrays', Muslim's routes adding 'though he fast and pray and claim to be a Muslim' and 'among the hypocrite's marks are three'; Ibn Rajab records that a group leaning to irja' carried the hadith onto the hypocrites of the Prophet's own time — who lied to him when he spoke to them, betrayed him when entrusted with his secret, and broke their promise to march with him — Muhammad al-Muharram narrating this interpretation from Ata' as told him by Jabir from the Prophet, with al-Hasan said to have retracted to Ata's view when it reached him; Ibn Rajab calls this a lie, al-Muharram being a known lying shaykh — al-Bukhari declared his hadith repudiated and Yahya ibn Ma'in called him nothing (Jami' al-Ulum wal-Hikam pp. 901–913)."
  es: "El hadiz de Abdullah ibn Amr ibn al-As del Profeta: 'cuatro rasgos: quien los tiene todos es un hipócrita, y quien tiene uno de ellos tiene un rasgo de hipocresía hasta que lo abandona: aquel que cuando habla miente, cuando promete rompe su palabra, cuando disputa se comporta mal y cuando jura traiciona'. El sexto de los hadices añadidos por Ibn Rajab, transmitido por al-Bukhari (34, 2459, 3178) y Muslim (58) a través de al-A'mash de Abdullah ibn Murra de Masruq de Abdullah ibn Amr ibn al-As, ambos también portando el informe de Abu Hurayra: 'la señal del hipócrita es tres: cuando habla miente, cuando promete rompe su palabra y cuando se le confía traiciona', las rutas de Muslim añadiendo 'aunque ayune y ore y afirme ser musulmán' y 'entre los Las marcas del hipócrita son tres'; Ibn Rajab registra que un grupo inclinado hacia irja' llevó el hadiz a los hipócritas de la época del Profeta, quienes le mintieron cuando les habló, lo traicionaron cuando se le confió su secreto y rompieron su promesa de marchar con él. Muhammad al-Muharram narró esta interpretación de Ata' según le fue contada por Jabir del Profeta, y se dice que al-Hasan se retractó de la opinión de Ata' cuando esta llegó a sus manos. Ibn Rajab llama a esto una mentira, ya que al-Muharram era un shaykh mentiroso conocido. Al-Bujari declaró que su hadiz era repudiado y Yahya ibn Ma'in no lo llamó nada (Jami' al-Ulum wal-Hikam, págs. 901-913)."
  fr: "Le hadith d'Abdullah ibn Amr ibn al-As, rapporté du Prophète: « Quatre traits – celui qui les possède tous est hypocrite, et celui qui n'en possède qu'un seul est hypocrite jusqu'à ce qu'il y renonce: celui qui, lorsqu'il parle, ment, lorsqu'il promet, manque à sa parole, lorsqu'il dispute, se comporte mal, et lorsqu'il fait un serment, il trahit. » – le sixième des hadiths ajoutés par Ibn Rajab, transmis par al-Bukhari (34, 2459, 3178) et Muslim (58) par al-A'mash, d'après Abdullah ibn Murra, d'après Masruq, d'après Abdullah ibn Amr ibn al-As. Ces deux derniers hadiths rapportent également le hadith d'Abu Hurayra: « Le signe de l'hypocrite est triple: lorsqu'il parle, il ment, lorsqu'il promet, il manque à sa parole, et lorsqu'on lui confie un secret, il trahit. » Les voies de transmission de Muslim ajoutent: « même s'il jeûne, prie et prétend être un hypocrite… » « Muslim » et « parmi les marques de l’hypocrite, il y en a trois »; Ibn Rajab rapporte qu’un groupe penchant pour l’irja’ a transmis ce hadith aux hypocrites de l’époque du Prophète — qui lui ont menti lorsqu’il leur a parlé, l’ont trahi lorsqu’on leur a confié son secret et ont rompu leur promesse de marcher avec lui — Muhammad al-Muharram rapportant cette interprétation d’Ata’, telle que Jabir la lui avait transmise du Prophète, et al-Hasan aurait adhéré à l’opinion d’Ata lorsqu’elle lui est parvenue; Ibn Rajab qualifie cela de mensonge, al-Muharram étant un cheikh menteur notoire — al-Bukhari a déclaré son hadith répudié et Yahya ibn Ma’in l’a ignoré (Jami’ al-Ulum wal-Hikam pp. 901–913)."
  ur: "عبداللہ بن عمرو بن العاص سے روایت ہے کہ رسول اللہ نے فرمایا: چار خصلتیں جس میں یہ سب ہوں وہ منافق ہے، اور جس میں ان میں سے ایک بھی ہو اس میں نفاق کی ایک خصلت ہے جب تک کہ وہ اسے ترک نہ کر دے، جب جھوٹ بولے، وعدہ خلافی کرے، جب جھگڑا کرے تو فسق کرے، اور جب اس میں چھے رجعت کا اضافہ ہو۔ بخاری ⁦(34، 2459، 3178)⁩ اور مسلم (58) نے العماش سے عبداللہ بن مرہ سے، مسروق سے عبداللہ بن عمرو بن العاص سے روایت کی ہے، دونوں میں ابوہریرہ کی روایت بھی ہے کہ منافق کی تین نشانیاں ہیں: جب وہ وعدہ کرتا ہے تو وعدہ خلافی کرتا ہے۔ خیانت'، مسلمان کے راستے شامل کرتے ہوئے 'اگرچہ وہ روزہ رکھتا ہے اور نماز پڑھتا ہے اور مسلمان ہونے کا دعویٰ کرتا ہے' اور 'منافق کی نشانیوں میں سے تین ہیں'؛ ابن رجب نے لکھا ہے کہ ارجاء کی طرف جھکاؤ رکھنے والے ایک گروہ نے حدیث نبوی کے اپنے زمانے کے منافقین پر ڈالی - جنہوں نے ان سے بات کرتے وقت آپ سے جھوٹ بولا، جب آپ نے ان سے بات کی تو اس کے ساتھ خیانت کی اور اس کے ساتھ چلنے کا وعدہ توڑ دیا - محمد محرم نے عطاء سے یہ تعبیر نقل کی ہے جیسا کہ سیدنا ابوہریرہ سے روایت ہے کہ انہوں نے سیدنا جابر سے روایت کی ہے۔ دیکھیں جب یہ اس تک پہنچا۔ ابن رجب نے اسے جھوٹ قرار دیا، محرم الحرام ایک مشہور جھوٹ بولنے والا شیخ ہے - البخاری نے اس کی حدیث کو منکر قرار دیا اور یحییٰ بن معین نے اسے کچھ نہیں کہا ⁦(جامع العلوم والحکم صفحہ 901-913)⁩۔"
  tr: "Abdullah bin Amr bin Al-Aas'ın Peygamberimizden rivayet ettiği hadis şöyledir: “Dört özellik vardır; kim bunlardan birine sahipse münafıktır. Bunlardan birine sahip olan, onu terk edinceye kadar münafıklık özelliğine sahip olur. Konuştuğunda yalan söyler; söz verdiğinde sözünü tutmaz; tartışırken küfür eder; ahit ettiğinde ise ihanet eder.” — İbn Receb'in eklediği altıncı hadis; Buhari (34, 2459, 3178) ve Müslim (58) tarafından, Al-A'maş'tan, o da Abdullah bin Murrah'tan, o da Masruq'tan, o da Abdullah bin Amr bin Al-Aas'tan rivayet edilmiştir. Ayrıca Ebu Hurayra'dan da şöyle rivayet edilmiştir: “Münafığın alametleri üçtür: Konuştuğunda yalan söyler; söz verdiğinde sözünü tutmaz; kendisine emanet edildiğinde ise ihanet eder.” Müslim'in bir rivayetinde: \"Oruç tutsa, namaz kılsa ve Müslüman olduğunu iddia etse bile.\" Başka bir rivayette ise: \"Münafığın alametleri üçtür.\" İbn Receb şöyle demiştir: İrca'ya meyilli olanlardan bir grup, bu hadisi Peygamber zamanındaki münafıklara işaret olarak yorumlamıştır; çünkü onlar Peygamber'le konuşmuş, ona yalan söylemiş, Peygamber onlara sırrını emanet etmiş, onlar da ona ihanet etmiş, onunla fetih seferine çıkacaklarına söz vermişler, ancak sözlerini tutmamışlardır. Muhammed el-Muharram da bu yorumu Ata'dan rivayet ederek şöyle aktarmıştır: Cabir bana bunu Peygamber'den rivayet etmiş ve Hasan'ın Ata'nın sözüne döndüğünü belirtmiştir. İbn Receb şöyle dedi: Bu bir yalandır ve el-Muharram yalan söylemesiyle bilinen bir şeyhtir. Buhari onun hakkında şöyle demiştir: O hadisleri inkâr eden biridir ve Yahya bin Ma'in onun hakkında şöyle demiştir: O hiçbir şey değildir (Cami' el-Ulum ve el-Hikam, s. 901-913)."
  id: "Hadits Abdullah bin Amr bin Al-Aas dari Nabi, yang bersabda: “Ada empat ciri, siapa pun yang memilikinya adalah seorang munafik, dan jika ia memiliki salah satunya, ia memiliki ciri kemunafikan sampai ia meninggalkannya: ketika berbicara, ia berdusta; ketika berjanji, ia mengingkarinya; ketika berdebat, ia menghina; dan ketika membuat perjanjian, ia mengkhianatinya.” — Hadits keenam yang ditambahkan oleh Ibn Rajab; diriwayatkan oleh Al-Bukhari (34, 2459, 3178) dan Muslim (58) dari Al-A’mash dari Abdullah bin Murrah dari Masruq dari Abdullah bin Amr bin Al-Aas. Mereka juga meriwayatkannya dari Abu Hurairah: “Tanda-tanda seorang munafik ada tiga: ketika berbicara, ia berdusta; ketika berjanji, ia mengingkarinya; dan ketika diberi amanah, ia mengkhianatinya.” Dalam riwayat Muslim: “Bahkan jika dia berpuasa, shalat, dan mengaku sebagai Muslim.” Dalam riwayat lain: “Tanda-tanda orang munafik ada tiga.” Ibn Rajab berkata: Sekelompok orang yang cenderung kepada Irja’ menafsirkan hadits ini sebagai merujuk kepada orang-orang munafik yang ada pada zaman Nabi — karena mereka berbicara kepadanya dan berbohong kepadanya, dan beliau mempercayakan rahasianya kepada mereka dan mereka mengkhianatinya, dan mereka berjanji untuk pergi bersamanya dalam penaklukan dan mereka mengingkari janji mereka — dan Muhammad al-Muharram meriwayatkan penafsiran ini dari Ata’ bahwa dia berkata: Jabir memberitahukan ini kepadaku dari Nabi dan dia menyebutkan bahwa al-Hasan kembali kepada pernyataan Ata’ ketika sampai kepadanya. Ibn Rajab berkata: Ini adalah kebohongan dan al-Muharram adalah seorang syekh pendusta yang terkenal suka berbohong — al-Bukhari berkata tentangnya: Dia adalah penolak hadits dan Yahya bin Ma’in berkata tentangnya: Dia bukan siapa-siapa (Jami’ al-‘Ulum wa al-Hikam, hlm. 901–913)."
