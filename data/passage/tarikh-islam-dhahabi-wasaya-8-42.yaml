text: "… الآخرة، يوم عمروما. وما قدروا يخرجون بجنازة عبد اللّه، فدفنوه بداره. واستولى مروان على مصر، وأقام بها شهرين، ثم استعمل عليها ابنه عبد العزيز، وترك عنده أخاه بشر بن مروان، وموسى بن نصير وزيراً، وأوصاه بالمبايعة في الإحسان إلى الأكابر، …"
