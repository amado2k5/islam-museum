label: { ar: "الموطأ 1363 — حميد بن قيس وثور بن زيد: رأى النبي رجلا قائما في الشمس نذر أن لا يتكلم ولا يستظل ولا يجلس ويصوم، فأمره أن يتم صومه", en: "Muwatta 1363" }
text: "مُرُوهُ فَلْيَتكلَّمْ، وَلْيَسْتظلَّ، وَلْيَجْلسْ، وَلْيُتمَّ صِيَامهُ"
summary:
  ar: "يروي مالك عن حميد بن قيس وثور بن زيد الديلي أنهما أخبراه عن رسول الله، أنه رأى رجلا قائما في الشمس، فقال ما بال هذا؟ فقالوا نذر أن لا يتكلم، ولا يستظل من الشمس، ولا يجلس، ويصوم. فقال رسول الله مروه فليتكلم، وليستظل، وليجلس، وليتم صيامه. ويذكر المحقق أن ابن عبد البر قال إن الحديث متصل عن النبي من وجوه. {cite:muwatta-maruf-1997 p.609}"
