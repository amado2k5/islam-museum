text: |-
  ⁦(يعط )⁩
  ٥٦٩
  أيهربون وينامون وسط الغرباء فى المسجد فيجىء الشرطى ويقول يا واسطى فن رفع رأسه
  أخذه وحلداذلك كانوا يتغاذلون وواسط الكورمقدمه قال طرفة
  وان شئت سامى واسط المكوررأسها * وعامت بضبعيها نجاء انلخفيدد.
  ويقال جلت وسط القوم بالتسكين لانه ظرف وجلت فى وسط الداربالتحريك
  لانه اسم وكل موضع صلح فيه بين فهووسط وان لم يصلح فيه بين فهو وسط بالتحريك وربما
  سكن وليس بالوجه كفول الشاءر
  وقالوابال أشجع يوم هيج * ووسط الدارضر باواحتمايا
  ⁦( وطط)⁩. الوطواط الخفاش واجمع الوطاوط وفى --ديث عطاءبن أبى رباح فى الوطواط
  يصيبه المحرم قال ثلثادرهم قال الاصمعى الوطواط ههنا انحفاش ويقال انه انخطاف قال أبو
  بيدوهذا أشبه اقولين عندى بالصواب لحديث عائشة رضى اللّٰه عنها قالت لما أحرق بيت
  المقسدس كانت الاوزاغ تنفخه بأفواهها وكانت الوطاوط تطفئه بأجنصتها والوطواط أيضا
  لرجل الضعيف الجبان قال ولا أراه سمى بذلك الاتشببها بالطائرفال العجاج
  وبلدة بعيدة النياط • قطعت -ين هيبة الوطواط
  وأما قولهم أبصر فى الليل من الوطواط فهواالخفاش ⁦(وقط)⁩. الوقط والوقيط حفرة فى
  غلظ أوجبل يجتمع فيه ماءااسماء والمع وقاط ويقال أصابتناسماء فوقط الصخرأى صار
  فيه وقط والموقوط الصريع يقال وقط به الارض اذاصرعه ويوم الوقيط يوم كان
  فى الاسلام بين بنى تيم وبكرين وائل هط هطه يهطه وهطا كسره قال الاصمعى يقال
  لما اطمأن من الارض وهطة وهى لغة في وهدة والجمع وهط ووهاط ويقال وهط من عشر
  كما يقال عيص من -دروالوهط اسم مال كان لعم روبن العاص رضى اللّٰه عنه وأوهطه
  أى صر عه صرعة لا يقوم منها
  صل الهاء ( بط هبط هبو طانزل وهبطه هبطا أى أنزله يتعدى ولا يتعدى
  يقال اللهسم غبطالا هبطا أى نسألك الغبطة ونعوذيك أن نهبط عن حالنبا وأهبطته فانهيط
  وهبط تمن السلعة أى نقص وهبطته أنا وأهبطته أيضاحكاه أبوعبيد وقولهم هبط المرض
  *-ه أى هزاء والهبوط الحدور والهبيط من النوف الضامر عن أبى عبيدة قال ومنه قول
  عبيدين الابرص هبيط مفرد ⁦(هرط)⁩ عرط فى عرضه يهرط هرطاأى طعن فيه وتنقصه
  وتهارط الرجلان تشاتما والهرطة النعجة الكبيرة والجمع هرط مثل قربة وقرب همط ).
  الهمط الظلم والخبط يقال همط الناس فلان بهمطهم اذا ظلهم حقهم والهمط أيضًا الاخذ
  بغبر تقدير واهمط عرض فلان أى شمه وتنقصه يط) الهياط والمهابطة الصباح والجابة
  يقال وقع القوم فى هياط ومياط قال الفترّامتهايط القوم اذا اجمعوا وأصليجوا أمرهم
  ينهم وهو خلاف التمايط
  صب على شاءأبى رياط • ذؤالة كالاقدح المراط • يهفواذا قيل له بعاط
