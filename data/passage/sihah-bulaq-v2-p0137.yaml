text: |-
  ٤٥٠
  •⁦(ف صل البا.)⁩.
  |أفعال مثل جذع وقفل لانك تقول فى جعهبنون:فتح الباء ولا يجوز أيضا أن يكون فحلا
  سا كن الميز لات البساب فى ججمه انماه و أفعل مغل كلب وأكاب أو فعول مثل فلس وفلوس
  وحكى الفراء عن العرب هذا من أبناوات الشعب وهم حىّ منإى كاب ويقال ابن بين البنوة
  والتصغيربنى قال الفرامابق ويابى لفتان مثل يا أبت ويا أبت وتصغير أبناءا بيناء وان شئت
  آبينون على غير مكبره قال الشاعر
  من يك لاسا فقدسانى • تزك أبنيك الى غيرراع
  كأن واحده ابن مقطوع الأاف فصغره فقال أبين ثم جعمفقال أينون والنسبة الى ابن
  بنوىّ وبعضهم يقول ابنّ وكذلك اذانبت الى أبناه فارس قلت بنوى وأماقولهم
  أبناوى فاغماهو-نسوب الى أبناء سعدلانه جعل اسهاللحىّ أوللقبيلة كما قالوامدابن حين
  جعلوه اسماللباد وكذلك اذانسبت الى بنت والى بنيات الطريق قلت بنوى لان ألف الوصل :
  عوض من الواوفاذا -ذفتها فلابد من رز الواووكان يونس يقول بنتى" ويقال رأيت بناتك
  بالفتح ويجرونه مجرى التاء الاصلية وبنيات الطريق هى الطرق الصفار تنشعب من الجنادة
  وهى الترهات والبنات التمائيل الصغار الى تلعب جم االجوارى وفى حديث عائشة كنت ألعب
  مع الجوارى بالبنات وذكراروية رجل فقال كان احدى بنات مساجدافه كانه جعله حصاة
  من حصى المسجد وبنت الارض الحصاة وابن الارض ضرب من البقل وتقول هذه ابنة فلان
  وبنت فلان بتاءثابتة فى الوقف والوصل ولا تقل ابنت لان الالف انما اجتلبت لسكون الياء
  فاذا حركنهاسة طت والهح بنات لاغير وأما قول الشاهربصف رجلاانه لم ينتصر الابصياح
  .عرار الظليم استحقب الركب بيضه • ولم يحم أنفا عند عرس ولا ابتم
  قانه يريد الابن والميم زائدة وهوم حرب من مكانين تقول هذا ابتم وحردت بايتم ورأيت انما؟
  تتبع الذون الميم فى الاءراب والالف مكورة على كل حال قال حسان
  ولدنايق العنقاه وابنى مخزق • فأكرم بذاخالاوا كرم بنا ابنا
  وتبنيت فلانا اذا اتخذته ابنا ⁦(بوا)⁩ البوجلد الحواريحنى عاما قتعطف عليه النباقة
  اذا مات ولدها قال الكميت •مدرجة كالبوبين الظئرين • والرمادبوالاناق والبوباة
  المفازة مثل الموماة قال ابن السرّاج أصله موموة على فعللة والبوباة موضع بعيته ها)
  البهاه الحسن تقول منه بهو الرجل بالكسر وبهو أيضاذهو.هى" وجرى البيت أيضا أى تخرّق
  وعطل وأبها، غيره وأبهيت الاناه فرغته حكاه أبو عبيد وبيت باه أى خال لاشئ فيه وأما
  البهاء الناقة التى تستانس بالحالب فن باب الهمز والبهوالبيت المقدم أمام البيوت والمباهاة
  المفاخرة وتباه وا أى تفاخروا وقولهم المعزى تبهى ولا تيف لانها تصعد على الاخبية فتخرّقها
  -فى لا يقدر على سكاها وهى مع ذلكْ لا يكون الخباء من أشعارها انمايكون من الحوف
  والوبر وفى الحديث أنه عليه الصلاة والسلام -مع رجلاحين فتحت مكة يقول أبوا اخيل
  فقد وضعت الحرب أوزارها فقال عليه الصلاة والسلام لاتزالون تقاتلون الكفار-ق تقاتل
  يقيتكم الدجال قوه أبهوا انظيل يعنى عطلوها من الفزو ( : الياه-رف من حروف المعجم
  رأما المك-ورة خرف جرّ وهى لااصاف الفعل بالفعول به تقول مررن بزيد وجاتز أن تكون
