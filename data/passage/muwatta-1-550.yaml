label: { ar: "الموطأ 550 — عمر يقرأ سورة النجم فيسجد ثم يقوم فيقرأ بسورة أخرى", en: "Muwatta 550", es: "550 Muwatta", fr: "550 Muwatta", ur: "550 موطا", tr: "Al-Muwatta 550 — Ömer, Necm Suresi'ni okuduktan sonra secdeye kapanıyor, sonra ayağa kalkıp başka bir sure okuyor.", id: "Al-Muwatta 550 — Umar membaca Surat An-Najm, kemudian sujud, lalu berdiri dan membaca Surah lainnya" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن الأعرج، أن عمر بن الخطاب قرأ سورة النجم [[passage/quran-53-62|النجم 62]] فسجد فيها، ثم قام فقرأ بسورة أخرى. ويذكر المحقق أن هذا إسناد رواية يحيى بن يحيى «عن الأعرج أن عمر»، وأن روايات الموطأ الأخرى التي وقف عليها، كرواية أبي مصعب (261) وسويد (97) والشيباني (268) ويحيى بن بكير عند البيهقي، تقول «عن الأعرج عن أبي هريرة أن عمر». {cite:muwatta-maruf-1997 p.283}"
  tr: "Malik, İbn Şihab'dan, o da el-A'raj'dan rivayetle, Ömer ibn el-Hattab'ın Necm Suresi'ni [[pasaj/kuran-53-62|Necm 62]] okuduğunu ve bu sırada secde ettiğini, sonra ayağa kalkıp başka bir sure okuduğunu nakletmiştir. Araştırmacı, bunun Yahya ibn Yahya'nın \"el-A'raj'dan rivayetle Ömer\" diye geçen rivayetinin isnadı olduğunu ve danıştığı diğer El-Muvatta' rivayetlerinin, örneğin Ebu Mus'ab (261), Suveyd (97), Şeybani (268) ve El-Beyhaki'deki Yahya ibn Bukayr'ın rivayetlerinin de \"el-A'raj'dan, Ebu Hurayra'dan rivayetle Ömer\" dediğini belirtmektedir. {cite:muwatta-maruf-1997 s.283}"
  id: "Malik meriwayatkannya dari Ibn Shihab, dari al-A'raj, bahwa Umar ibn al-Khattab membaca Surah An-Najm [[passage/quran-53-62|An-Najm 62]] dan bersujud selama membacanya, kemudian berdiri dan membaca surah lain. Peneliti menyebutkan bahwa ini adalah sanad periwayatan Yahya ibn Yahya \"dari al-A'raj bahwa Umar,\" dan bahwa riwayat-riwayat lain dari Al-Muwatta' yang ia rujuk, seperti riwayat Abu Mus'ab (261), Suwaid (97), Ash-Shaybani (268), dan Yahya ibn Bukayr dalam Al-Bayhaqi, mengatakan \"dari al-A'raj, dari Abu Hurayrah bahwa Umar.\" {cite:muwatta-maruf-1997 p.283}"
