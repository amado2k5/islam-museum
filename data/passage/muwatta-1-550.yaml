label: { ar: "الموطأ 550 — عمر يقرأ سورة النجم فيسجد ثم يقوم فيقرأ بسورة أخرى", en: "Muwatta 550" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن الأعرج، أن عمر بن الخطاب قرأ سورة النجم [[passage/quran-53-62|النجم 62]] فسجد فيها، ثم قام فقرأ بسورة أخرى. ويذكر المحقق أن هذا إسناد رواية يحيى بن يحيى «عن الأعرج أن عمر»، وأن روايات الموطأ الأخرى التي وقف عليها، كرواية أبي مصعب (261) وسويد (97) والشيباني (268) ويحيى بن بكير عند البيهقي، تقول «عن الأعرج عن أبي هريرة أن عمر». {cite:muwatta-maruf-1997 p.283}"
