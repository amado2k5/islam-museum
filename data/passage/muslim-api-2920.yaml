text: "وَحَدَّثَنِي أَبُو أَيُّوبَ الْغَيْلاَنِيُّ، حَدَّثَنَا بَهْزٌ، حَدَّثَنَا حَمَّادٌ، عَنْ عَبْدِ الرَّحْمَنِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - قَالَتْ لَبَّيْنَا بِالْحَجِّ حَتَّى إِذَا كُنَّا بِسَرِفَ حِضْتُ فَدَخَلَ عَلَىَّ رَسُولُ اللَّهِ وَأَنَا أَبْكِي. وَسَاقَ الْحَدِيثَ بِنَحْوِ حَدِيثِ الْمَاجِشُونِ. غَيْرَ أَنَّ حَمَّادًا لَيْسَ فِي حَدِيثِهِ فَكَانَ الْهَدْىُ مَعَ النَّبِيِّ وَأَبِي بَكْرٍ وَعُمَرَ وَذَوِي الْيَسَارَةِ ثُمَّ أَهَلُّوا حِينَ رَاحُوا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2920، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2920 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2920، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
