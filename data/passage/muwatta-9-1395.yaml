label: { ar: "الموطأ 1395 — جابر بن عبد الله: نحرنا مع رسول الله عام الحديبية البدنة عن سبعة والبقرة عن سبعة", en: "Muwatta 1395", es: "Muwatta 1395", fr: "Muwatta 1395", ur: "موطا 1395", tr: "El-Muvatta 1395 — Cabir ibn Abdullah: Hudeybiye yılında Allah'ın Resulü ile birlikte yedi kişi adına bir deve ve yedi kişi adına bir inek kestik.", id: "Al-Muwatta 1395 — Jabir ibn Abdullah: Kami menyembelih bersama Rasulullah pada tahun Al-Hudaybiyyah seekor unta untuk tujuh orang dan seekor sapi untuk tujuh orang." }
text: "الْبَدَنةَ عَن سَبْعةِ، وَالْبَقْرَةَ عَن سَبْعَةٍ"
summary:
  ar: "يروي مالك عن أبي الزبير المكي عن جابر بن عبد الله أنه قال نحرنا مع رسول الله عام الحديبية البدنة عن سبعة، والبقرة عن سبعة. {cite:muwatta-maruf-1997 p.624}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den, o da Cabir ibn Abdullah'tan rivayet ettiğine göre şöyle buyurmuştur: \"Hudeybiye zamanında Allah'ın Resulü ile birlikte yedi kişi adına bir deve ve yedi kişi adına bir inek kestik.\" {cite:muwatta-maruf-1997 s.624}"
  id: "Malik meriwayatkan dari Abu al-Zubayr al-Makki, dari Jabir ibn Abdullah, bahwa beliau berkata: “Kami menyembelih bersama Rasulullah pada masa Hudaybiyyah seekor unta untuk tujuh orang, dan seekor sapi untuk tujuh orang.” {cite:muwatta-maruf-1997 p.624}"
