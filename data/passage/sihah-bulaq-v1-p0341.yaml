text: |-
  ⁦(باب الزا )⁩
  ⁦(سبر)⁩
  واستجاره من فلان فأجاره منه وأجاره اللّٰه من العذاب أنة ذد وغيث جور مثال هجف أى
  شديد صوت الرعد وبازل جور قال الراجز
  زوجك ياذات الثنايا الغرّ • أعيافنطناه مناظ الجر
  دوين عكمى بازل جور * تم شدد نا فوقه عر
  هر رأيته جهرة وكلته جهرة وجهرت البئرواجتهرتها أى نقيتها وأخرجت مافيها
  من الهأة وهى بترمجهورة وقال
  اذا وردنا آجنا جهرناه * أوخاليا من أحل عمرناء
  قال الاخفش تقول العرب جهرت الركية اذا كان ما ؤها قد غطى الطين فنقى ذلك حتى
  يظهر الماء ويصفو قال ومنه قوله تعالى -تق نرى اللّٰه جهرة أى عيانا يكشف ما ببتنا ويينه
  والاجه ر الذى لا يبصر فى الشمس يقال كبش أجهر بين الجهر ونعجة جهراء قال أيو العيال
  الهذلى
  جهراء لا تألواذا هى أظهرت * بصراولا من عيلة تغنيي
  وجهرنا الارض سلكناها من غيرم عرفة وجهر نابنى فلان أى صبحنا هم على غرّة وحسكى
  الفرّاء جهرت السقاء مخضته ولبن جهيرلم يمذق بماء وجهر بالقول رفع به صوته وجهور وهو
  رجل جهورى الصوت وجهير الصوت تقول منه جهر الرجل بالضم واجهار الكلام
  اعلانه ورجسل مجهر بكسر الميم اذا كان من عادته أن يجهر بكلامه والمجاهرة بالعداوة
  المبادابها وجهرت الرجل واجتهرته اذار أيم عظيم المرآة وكذلك الجيس
  اذا كثروا فى عينك -ين رأيتهم قال الراجز
  كاغازها وهلن جهر • لسل ورزوغره اذاوغر
  ورجل جهير بين الجهارة أى ذو منظروامرأة جهيرة قال أبو النجم
  وأرى البداش على النساءجهارة * والعتق أعرفه على الادماء
  وما أحسن جهرفلان بالضم أى ما يجتهر من هيئته وحسن منظره ويقال كيف جهراؤكم
  أى جاعتكم والجوهر معرب الواحدة جوهرة والحروف المجهورة عند النحوبين تسعة عشر
  يجمعها قولك ظل قوّريض اذ غزاجند مطيع واغماسمى الحرف مجهورالانه أشبع الاعتماد
  فى موضعه ومنع النفس أن يجرى معه حتى ينقضى الاعتماد بجرى الصوت ( ير واهم
  جير لاآبيك بكسر الراءيمين للعرب ومعناها حقا عال الشاعر
  وقلن على الفردوس أول مشرب • أجل جير إن كانت أبيحت دعائره
  والجيار الصاروج قال الاخطل يصف بيتا
  كانها برج رومى يشيده * لز بطين وآجروجيار
  والجيار حرارة فى الصدر من غيظ أوجوع قال الهذلى
  قدحال بين تراقيه وليته • من جلبة الجوع جيار وإرزيز
  وكذلك الجائر قال الشاعر
  فلمارأيت القوم نادواماءا • تعرّض لى دون الترائب جائر
  ⁦( صل الحاء)⁩ بر الخبر الذى يكتب به وموضعه المحبرة بالكسر والحبر أيضا الائر
  والجمع
