text: "… فكتب إليه بولايةِ الحَرَميْن واليمن. فما جاءهُ الكتابُ إلا وقد وقعتِ القَرْحَةَ في يمينه. فقيل: اقطعْها من الَفْصل فجَزِع. فبلغتِ المرفق ثُمّ أصبح وقد بلغتِ الكَيّف ومات. فجزع عليه عبد الملك وأمر الشعراء فرَثَوْهُ. الرحمن العدوي. - بِشر بن الْمُغْتَمر …"
