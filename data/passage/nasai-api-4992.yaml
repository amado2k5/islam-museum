text: "… مُحَمَّدٌ، - وَهُوَ ابْنُ ثَوْرٍ - قَالَ مَعْمَرٌ وَأَخْبَرَنِي الزُّهْرِيُّ، عَنْ عَامِرِ بْنِ سَعْدِ بْنِ أَبِي وَقَّاصٍ، عَنْ أَبِيهِ، قَالَ أَعْطَى النَّبِيُّ رِجَالاً وَلَمْ يُعْطِ رَجُلاً مِنْهُمْ شَيْئًا قَالَ سَعْدٌ يَا رَسُولَ اللَّهِ أَعْطَيْتَ فُلاَنًا وَفُلاَنًا وَلَمْ تُعْطِ فُلاَنًا شَيْئًا وَهُوَ مُؤْمِنٌ. فَقَالَ النَّبِيُّ \" أَوْ مُسْلِمٌ \". حَتَّى أَعَادَهَا سَعْدٌ ثَلاَثًا وَالنَّبِيُّ يَقُولُ \" …"
summary:
  ar: "حديث في سنن النسائي، رقم 4992، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4992 (The Book Of Faith and its Signs), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4992، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
