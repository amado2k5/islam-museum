label: { ar: "صحيح البخاري 5993 — أبلي وأخلقي خدمة للأم", en: "Sahih al-Bukhari 5993 — Wear out and wear thin, in a mother's service", ur: "صحیح بخاری 5993 — ماں کی خدمت میں کھپ جاؤ", es: "Sahih al-Bukhari 5993 — Desgastarse y adelgazarse, al servicio de una madre." }
text: "حَدَّثَنَا حِبَّانُ، أَخْبَرَنَا عَبْدُ اللَّهِ، عَنْ خَالِدِ بْنِ سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أُمِّ خَالِدٍ بِنْتِ خَالِدِ بْنِ سَعِيدٍ، قَالَتْ أَتَيْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم مَعَ أَبِي وَعَلَىَّ قَمِيصٌ أَصْفَرُ، قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ سَنَهْ سَنَهْ ‏\"‏‏.‏ قَالَ عَبْدُ اللَّهِ وَهْىَ بِالْحَبَشِيَّةِ حَسَنَةٌ‏.‏ قَالَتْ فَذَهَبْتُ أَلْعَبُ بِخَاتَمِ النُّبُوَّةِ، فَزَجَرَنِي أَبِي‏.‏ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ دَعْهَا ‏\"‏‏.‏ ثُمَّ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ أَبْلِي وَأَخْلِقِي، ثُمَّ أَبْلِي وَأَخْلِقِي، ثُمَّ أَبْلِي وَأَخْلِقِي ‏\"‏‏.‏ قَالَ عَبْدُ اللَّهِ فَبَقِيَتْ حَتَّى ذَكَرَ‏.‏ يَعْنِي مِنْ بَقَائِهَا‏.‏"
summary:
  ar: "عن عبد الله بن عمرو في ذمة الأم: أبلي وأخلقي ثلاثا، قيل معناه في خدمة الوالدة حتى يبلي الثوب."
  en: "From Abdullah ibn Amr on the mother's due — «wear out and wear thin« three times over, understood as serving the mother until the garment wears through."
  ur: "عبداللہ بن عمرو سے ماں کے حق میں — «کھپ جاؤ اور گھس جاؤ» تین بار، یعنی ماں کی خدمت میں کپڑے تک گھس جائیں۔"
  es: "De Abdullah ibn Amr sobre la obligación de la madre: «desgastar y desgastar» tres veces, entendido como servir a la madre hasta que la prenda se desgaste por completo."
