text: "… إلى المدينة سمع النوح على قتلى الأنصار، قال: لكن حمزة لا بواكي له. فسمع الأنصار فأمروا نساءهم أن يندبن حمزة قبل قتلاهم، ففعلن ذلك، قال الواقدي: فلم يزلن يبدأن بالندب لحمزة حتى الآن. وقال كعب بن مالك يرثي حمزة، وقيل …"
