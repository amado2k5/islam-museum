text: |-
  ⁦(٢)⁩ فى بعض النسخ زيادة
  في الصبيان فى لعبه-م
  فشذا كذيوافيه وفلّلوا اه
  ٢٠٦
  لحباب بن المنذر أنا جذيلها لمحكان وعذيها المرجب (فرسخ الفرسخ واحد
  الفراسخ فارسىّ معرّب ⁦( رفخ الفرفخ البقلة المقاءالتى يقال لها الفرفين ١ سمخ)⁩
  ذسخ الشى نقضه تقول فسنت البيع والعزم والنسكاح فى تفسخ أى انتقض وتفسخت الفأرة
  فى الماء تقطعت وتفخ الربع تحت الحل الثقيل وذلك اذا لم يعلقه وقسخت د أفسخها
  فسخا وقد فدخت عنى توبى طرحته والفسيخ الرحل الذى لا يظفر بهاجته قال المفترّاه أفسخ
  الرجل القرآن أى ذ-يه ٢) ضخ) فضخت رأسه شدخته وكذلك فضفت البسر
  واقتضخته والنضيخ شراب يتخذ من البسر وحده من غير أن قسه النار واتفضمخ سنام البعير
  انشدخ (فنخ فخه الامرهره وذلله وكذلك التفنيخ ورجل مفنخ بكسر الميم اذا كان يمن
  يذل أعداءه ويشبج رأسهم كثيرا قال العجاج
  تاللّه لولا أن تحش الطبخ • بى الجيم حين لامستصرخ
  لعلم الاقوام اتى مفنخ • لهامهم أرضه وانقخ
  وخ الاصمعى فاخت منه ريح طيبة نفوخ وتفيخ مثل فاست وأبو عبيدة مثله وقال
  أبوزيد فاخت الريح تفوخ اذا كان لماصوت قال وآفاخ الانسان افاخة وفى الحديث كل
  بائلة تفيخ قال وأما الفوح بالماءفن الريخ بجدها لا من الضوت وقال النضرين شميل اذا
  بال الانسان أوالداية فحرجت مندريح قبل أفاخ وأنشد لجرير
  ظل اللهازم يلعبون بنسوة •بالجويوم يفخن بالابوال
  أى مع الابوال
  صل القاف ( فخ الفرّاء قفخته قفيًا وقفاخاضر بته ويقال لا يكون القفخ
  الاعلى الرأس أوعلى شى أجوف قال رؤبة قفذا على المام وبجاوخضا قلخ قلخ
  الفعل قلذا وقليخاهدر قال الفرّال، أكثر الاصوات بنى على فعيل مثل هدر هديرا وصهل
  صهسلا ونح تتيحاوقلح قليخا قال الراجز قلح افحول الصيد فى أشوالها
  وقلاخ بالضم اسم شاعروهوقلاخ بن حزن المعدى وقال
  أنا القلاخ فى بغائى مقسما • أقسعت لا أسأم حتى نأما
  صل الكاف كخ الكامخ الذى يؤتدم به معرب والكمخ السلح وقدم الى
  أعرابى خبز وكامخ فلم يعرفه فقيل لههذا كامخ فقال قد عمات أنه كامخ أيكم كخ به يريد سلح به وكمخ
  بأنفه تكبر والا كماخ جلوس المتعظم كوخ المكوخ بالضم بيت من قصب بلا كوة
  والجمع الاكواخ
  ( ضل اللام خ اللباخية بالضم المرأة التنامة كانهاءة-وية الى اللباخ
  ⁦( نلجخ)⁩ نلطت عينه أى كتردمعها قال الراجز
  لاخيرفى الشيخ اذا ماجخى • وسال غرب عينه وظما
  والتخ عليهسم أمرهم اختلط والتخ العشب التف وسكران ملتخ أى مختلط عقله والحسامة نقول
  ماطخ واللخلخانية العجمة فى المنطق يقال رجل نخلذانى اذا كان لا يقصح طخ طخه بكذا
  اطخا فتلطخ به أى اونه به قتلوّث ولطخ فلان بشررى به وفى السما لطخ من سهاب أى قليل
  rفصل
