label: { ar: "سنن ابن ماجه 3074 — ما لا يحل", en: "Sunan Ibn Majah 3074 — what is not lawful", ur: "سنن ابن ماجہ 3074 — جو حلال نہیں" }
text: "… فَرَضْتَ الْحَجَّ \". قَالَ قُلْتُ اللَّهُمَّ إِنِّي أُهِلُّ بِمَا أَهَلَّ بِهِ رَسُولُكَ ـ. قَالَ \" فَإِنَّ مَعِيَ الْهَدْىَ فَلاَ تَحِلُّ \". قَالَ فَكَانَ جَمَاعَةُ الْهَدْىِ الَّذِي جَاءَ بِهِ عَلِيٌّ مِنَ الْيَمَنِ وَالَّذِي أَتَى بِهِ النَّبِيُّ ـ مِنَ الْمَدِينَةِ مِائَةً ثُمَّ حَلَّ النَّاسُ كُلُّهُمْ وَقَصَّرُوا إِلاَّ النَّبِيَّ ـ وَمَنْ كَانَ مَعَهُ هَدْىٌ فَلَمَّا كَانَ يَوْمُ التَّرْوِيَةِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3074، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 3074 (Chapters on Hajj Rituals), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3074، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
