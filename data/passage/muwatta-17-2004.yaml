label: { ar: "الموطأ 2004 — مالك: ومثل ذلك أن يقول الرجل للرجل: إن قدرت على غلامي الآبق، أو جئت بجملي الشارد، فلك كذا وكذا، فهذا من باب الجعل لا الإجارة، ولو كان على وجه الإجارة لم يصلح", en: "Muwatta 2004", es: "Muwatta 2004", fr: "Muwatta 2004", ur: "موطا 2004", tr: "Al-Muwatta 2004 — Malik: Benzer şekilde, bir adam diğerine, “Kaçan kölemi bulursan veya kayıp devemi geri getirirsen, şunu şunu alırsın” derse, bu bir ödüldür, kira sözleşmesi değildir. Eğer kira sözleşmesi olsaydı, geçerli olmazdı.", id: "Al-Muwatta 2004 — Malik: Demikian pula, jika seseorang berkata kepada orang lain, “Jika kamu dapat menemukan budakku yang melarikan diri, atau mengembalikan untaku yang tersesat, kamu akan menerima imbalan sekian dan sekian,” ini adalah hadiah, bukan perjanjian sewa-menyewa. Jika itu adalah perjanjian sewa-menyewa, maka itu tidak sah." }
summary:
  ar: "قال مالك: ومثل ذلك أن يقول الرجل للرجل: إن قدرت على غلامي الآبق، أو جئت بجملي الشارد، فلك كذا وكذا. فهذا من باب الجعل، وليس من باب الإجارة. ولكن من باب الإجارة لم يصلح. {cite:muwatta-maruf-1997 p.220}"
  tr: "Malik şöyle demiştir: Benzer şekilde, bir adam diğerine, “Kaçan kölemi bulursan veya kayıp devemi geri getirirsen, şunu şunu alırsın” derse, bu ücret değil, ödül kategorisine girer. Ancak bunu ücret olarak değerlendirmek caiz değildir. {cite:muwatta-maruf-1997 s.220}"
  id: "Malik berkata: Demikian pula, jika seseorang berkata kepada orang lain, “Jika kamu dapat menemukan budakku yang kabur, atau mengembalikan untaku yang tersesat, kamu akan menerima sekian dan sekian,” ini termasuk dalam kategori hadiah, bukan upah. Namun, tidak diperbolehkan untuk memperlakukannya sebagai upah. {cite:muwatta-maruf-1997 p.220}"
