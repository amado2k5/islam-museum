label: { ar: "صحيح مسلم 2127 — تعزية ومواساة وصبر عند المصيبة", en: "Sahih Muslim 2127 — condolence, consolation and patience at a loss", ur: "صحیح مسلم 2127 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Sahih Muslim 2127 — des condoléances, une consolation et la patience devant la perte", es: "Sahih Muslim 2127 — condolencias, consuelo y paciencia ante la pérdida", tr: "Sahih Muslim 2127 — Felaket zamanlarında taziye, şefkat ve sabır", id: "Sahih Muslim 2127 — Ungkapan belasungkawa, simpati, dan kesabaran di masa musibah" }
text: "… سَلَمَةَ، زَوْجَ النَّبِيِّ تَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَا مِنْ عَبْدٍ تُصِيبُهُ مُصِيبَةٌ فَيَقُولُ إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا إِلاَّ أَجَرَهُ اللَّهُ فِي مُصِيبَتِهِ وَأَخْلَفَ لَهُ خَيْرًا مِنْهَا \". قَالَتْ فَلَمَّا تُوُفِّيَ أَبُو سَلَمَةَ قُلْتُ كَمَا أَمَرَنِي رَسُولُ اللَّهِ فَأَخْلَفَ اللَّهُ لِي خَيْرًا مِنْهُ رَسُولَ اللَّهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2127، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih Muslim, no. 2127 (The Book of Prayer - Funerals), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح مسلم کی حدیث نمبر 2127، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih Muslim, n° 2127, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih Muslim, n.º 2127, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sahih Müslim'de 2127 numaralı hadis, musibet karşısında taziye, teselli ve sabır sunmaktadır. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü ağıt ve mersiyelerden bazılarını bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2127, menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah. Kumpulan ini menyusun beberapa elegi dan ratapan paling terkenal, bersama dengan teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
