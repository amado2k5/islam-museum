text: "… إِذِ الْمُجْرِمُونَ حديث رقم، ومسلم في الصحيح كتاب النكاح باب استحباب النكاح لمن تاقت نفسه إليه ووجد مؤنة حديث رقم، وعند عبد الرزاق أن الرهط الثلاثة هم علي ابن أبي طالب وعبد اللّٰه بن عمرو بن العاص، وعثمان بن مظعون …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 43، يرد فيه ذكر المستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 1, p. 43, whose wording mentions the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 1، ص 43 کا اقتباس جس میں مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Isaba de Ibn Hajar, volume numérisé 1, p. 43, dont le texte mentionne le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen digitalizado 1, p. 43, cuyo texto menciona lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 1. cildinin 43. sayfasından bir alıntı, tavsiye edilen amellerden bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 1, halaman 43, menyebutkan amalan-amalan yang dianjurkan; ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan-amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
