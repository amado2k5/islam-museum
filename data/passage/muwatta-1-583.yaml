text: "نامت العيون، وغارت النجوم، وأنت الحي القيوم"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن أبا الدرداء كان يقوم من جوف الليل فيقول: نامت العيون، وغارت النجوم، وأنت الحي القيوم. وهو آخر حديث في باب العمل في الدعاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.300}"
