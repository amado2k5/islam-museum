label: { ar: "الموطأ 583 — بلاغ: أبو الدرداء يقوم من جوف الليل فيقول: نامت العيون وغارت النجوم وأنت الحي القيوم", en: "Muwatta 583", es: "Muwatta 583", fr: "Muwatta 583", ur: "موطا 583", tr: "El-Muvatta 583 — Rivayet: Ebu el-Darda gece yarısı kalkıp şöyle der: “Gözler uyudu, yıldızlar battı ve Sen ebedi olansın, her şeyi kendi kendine yaratansın.”", id: "Al-Muwatta 583 — Diriwayatkan: Abu al-Darda’ bangun di tengah malam dan berkata: “Mata telah tertidur dan bintang-bintang telah terbenam, dan Engkau adalah Yang Maha Hidup, Yang Maha Mandiri.”" }
text: "نامت العيون، وغارت النجوم، وأنت الحي القيوم"
summary:
  ar: "بلاغ يرويه مالك أنه بلغه أن أبا الدرداء كان يقوم من جوف الليل فيقول: نامت العيون، وغارت النجوم، وأنت الحي القيوم. وهو آخر حديث في باب العمل في الدعاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.300}"
  tr: "Malik, Ebu el-Darda'nın gecenin bir yarısı kalkıp şöyle dediğini işittiğini rivayet etmiştir: \"Gözler uyudu, yıldızlar battı, Sen ise Ebedî ve Kendiliğinden Var Olansın.\" Bu, dua uygulaması bölümündeki son hadistir. Editör, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.300}"
  id: "Malik meriwayatkan bahwa ia mendengar Abu al-Darda' bangun di tengah malam dan berkata: \"Mata telah tertidur, bintang-bintang telah terbenam, dan Engkau Maha Hidup lagi Maha Pemelihara.\" Ini adalah hadits terakhir dalam bab tentang praktik berdoa. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.300}"
