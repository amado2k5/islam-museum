label: { ar: "الموطأ 361 — صلاة القاعد مثل نصف صلاة القائم", en: "Muwatta 361" }
text: "صلاة أحدكم وهو قاعد مثل نصف صلاته وهو قائم"
summary:
  ar: "أول حديث في باب فضل صلاة القائم على صلاة القاعد. يرويه يحيى عن مالك عن إسماعيل بن محمد بن سعد عن مولى لعمرو بن العاص أو لعبد الله بن عمرو عن عبد الله بن عمرو بن العاص: أخبر النبي أن صلاة القاعد مثل نصف صلاة القائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وابن القاسم ومحمد بن الحسن، وينقل عن ابن عبد البر أن جماعة الرواة عن مالك لم يختلفوا فيه، وأن ابن عيينة رواه عن إسماعيل عن أنس، والقول عندهم قول مالك والحديث محفوظ لعبد الله بن عمرو (التمهيد 1/132). {cite:muwatta-maruf-1997 p.198}"
