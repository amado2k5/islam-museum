label: { ar: "الموطأ 361 — صلاة القاعد مثل نصف صلاة القائم", en: "Muwatta 361", es: "Muwatta 361", fr: "Muwatta 361", ur: "موطا 361", tr: "El-Muvatta 361 — Oturarak yapılan namaz, ayakta yapılan namazın yarısı gibidir.", id: "Al-Muwatta 361 — Shalat orang yang duduk itu seperti setengah shalat orang yang berdiri." }
text: "صلاة أحدكم وهو قاعد مثل نصف صلاته وهو قائم"
summary:
  ar: "أول حديث في باب فضل صلاة القائم على صلاة القاعد. يرويه يحيى عن مالك عن إسماعيل بن محمد بن سعد عن مولى لعمرو بن العاص أو لعبد الله بن عمرو عن عبد الله بن عمرو بن العاص: أخبر النبي أن صلاة القاعد مثل نصف صلاة القائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وابن القاسم ومحمد بن الحسن، وينقل عن ابن عبد البر أن جماعة الرواة عن مالك لم يختلفوا فيه، وأن ابن عيينة رواه عن إسماعيل عن أنس، والقول عندهم قول مالك والحديث محفوظ لعبد الله بن عمرو ⁦(التمهيد 1/132)⁩. {cite:muwatta-maruf-1997 p.198}"
  tr: "Ayakta kılınan namazın oturarak kılınan namaza üstünlüğü hakkındaki bölümün ilk hadisi, Yahya tarafından Malik'ten, o da İsmail ibn Muhammed ibn Sa'd'dan, o da Amr ibn el-As'ın veya Abdullah ibn Amr'ın azatlı bir kölesinden, o da Abdullah ibn Amr ibn el-As'tan rivayet edilmiştir: Peygamberimiz bize, oturarak kılınan namazın ayakta kılınan namazın yarısı kadar olduğunu bildirmiştir. Araştırmacı, bu hadisin Malik'ten Ebu Musab, Suveyd, el-Kanabi, İbn el-Kâsim ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. İbn Abd el-Barr'ın, Malik'ten rivayet edenlerin bu konuda ihtilaf etmediklerini ve İbn Uyayne'nin bunu İsmail'den, o da Enes'ten rivayet ettiğini söylediğini aktarmaktadır. Bunlar arasında kabul gören görüş Malik'in görüşüdür ve hadis Abdullah ibn Amr'ın rivayetiyle (el-Tamhid 1/132) korunmuştur. {cite:muwatta-maruf-1997 s.198}"
  id: "Hadits pertama dalam bab ini membahas keutamaan salat berdiri dibandingkan salat duduk. Diriwayatkan oleh Yahya dari Malik, dari Isma'il ibn Muhammad ibn Sa'd, dari seorang budak yang dibebaskan oleh 'Amr ibn al-'As atau oleh 'Abdullah ibn 'Amr, dari 'Abdullah ibn 'Amr ibn al-'As: Nabi memberitahukan kepada kita bahwa salat orang yang duduk itu seperti setengah salat orang yang berdiri. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, al-Qa'nabi, Ibn al-Qasim, dan Muhammad ibn al-Hasan. Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa kelompok perawi dari Malik tidak berbeda pendapat tentang hal ini, dan bahwa Ibn 'Uyaynah meriwayatkannya dari Isma'il, dari Anas. Pendapat yang diterima di antara mereka adalah pendapat Malik, dan hadits ini terpelihara berdasarkan riwayat Abdullah ibn Amr (al-Tamhid 1/132). {cite:muwatta-maruf-1997 p.198}"
