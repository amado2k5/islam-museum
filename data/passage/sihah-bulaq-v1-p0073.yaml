text: |-
  ٥٦٨
  (وسطام
  والانواط ما نوط على البعيراذا أوقر والتنواط ما يعلق من الهودج يزين به و يقال نوطة من
  طلح كما يقال عيص من سدر وأيكة من أثل وفرش من عرفط ووهط من عشروغالٌ من
  سلم وسلسل من مهروقصمة من غذى ومن رمث وصريمة من عضى ومن سلم وحرحة من شه
  وانتاط أى بعد وفلان منى مناط النرياأى فى البعدونياط المفازة بعد طر يقها فسكانها نيطت
  عفازة أخرى لاتكاد تنقطع قال الراجز وبلدة بعيدة النياط
  والنياط عرق علق
  به القلب من الوتين فاذاقطع مات صاحبه وهوالنيط أيضا ومنه قولهم رماه اللّٰه بالنط أى
  بالموت و يقال للارنب مقطعة النياط كما فالوامقطعة الاسصار وشياط الوس معلقهاوالنائط
  عرق فى الصلب متد يعالج المصفور بقطعه قال الراجز قضب الطبيب نائط المصفور
  وااتنوّط طائرويقال أيضا التنوط قال الاص؟عى اغاسمى تنوّطالانه يدلى خيوطا من شجرة ثم
  يفرح فيها الواحدة تنوّطة
  صل الاد) بط بط رأى فلان يط وبطا ووبوطا أى ضعف وكذلك وبط بالكسر
  يوبطا وبطا والوابط الضعيف الجبان ويقال أردت حاجسة فو بطى عنها فلان أى حبسو
  ⁦( وخط)⁩ وخطه الشيب أى خالطه والوخط الطعن النافذ والوخط لغة فى الوخدوهو سرعة
  السير ⁦(ورط)⁩ الورطة الهلالة قال رؤية فاصصوافى ورطة الاوراط قال أبوعبيد
  وأصل الورطة أرض مطمئنة لاطر بق فيها وورّطه توريطا وأورطه اذا أ وقعه فى الورطة
  فتورط هوفيها قال والوراط الخديعة والغش وفى الحديث لاخلاط ولاوراط ويقال هو
  كوله لا يجمع بين متقرق ولا يفرق بين مجمع خشية الصدقة ⁦( Ÿ%سط)⁩، وسطت القوم
  أسطهم وسطاوسطة أى توسطتهما قال الراجز
  وقد وسطت مالكاو حنظلا
  أرادو حنظلة فلما وقفجع-لى الهاء ألفالانه ليس بيتمما الاالههة وقد ذهبت عند الوقف
  قاشيهت الالف . كما قال امر والقيس
  وعرو بن درما الهمام اذاغدا • بذى شطب غضب كشية قورا
  أرادة ورة ولوجعلدا-ما محذ وفامنه الهاءلابراه وفلان وسيط فى قومه اذا كان
  أرسطهم نسباوأرفعهم عملا قال العربى
  كانى لم أكن فيهم وسيطا • ولم تلا نبق فى آل عمرو
  والاصبع الوسطى والتوسيط أن تجعل الشئ فى الوسط وقرأ بعضهم فوسطن به بمعا
  والتوسيط قطع الشى نصفين والتوسط بين الناص من الوساطة والوسطمن كل شئ أعدله
  قال تعالى وكذلك جعلنا كم أمة و-طا أى عدلا ويقسال أيضائئ وسط أى بين الجيد والردى.
  وواسطة الة_لادة الجوهر الذى فى وسعاها وهو أجودها وواسط بمدمحى بالقصر الذى بناه
  الحجاح بين الكوفة والبصرة وهو مذ كرمصروف لانا-هاء البلدان الغالب عليها التأنيت
  وترك الصرف الامن والشام والعراق وواسط اودابضار فلجاو هج-رافانهاتذ كرونصرف
  وي وزأن تريديه البقعة أو البلدة فلانصرفه كماقال الشاعر
  منهن أيام صدق قد عرفت بها * أيام واسط والايام من هجر
  وقولهم فى المشل تخافل كاظن واسعلى قال المبرد أصلدات الحجاج كان يتسخرهم فى البناء
  فيهربون
