label: { ar: "صحيح البخاري 5718 — القسط والعود الهندي، القسط", en: "Sahih al-Bukhari 5718 — costus (Indian aloeswood); costus", ur: "صحیح بخاری 5718 — قسط ہندی، قسط" }
text: "… مِحْصَنٍ،، وَكَانَتْ، مِنَ الْمُهَاجِرَاتِ الأُوَلِ اللاَّتِي بَايَعْنَ رَسُولَ اللَّهِ وَهْىَ أُخْتُ عُكَّاشَةَ بْنِ مِحْصَنٍ أَخْبَرَتْهُ أَنَّهَا أَتَتْ رَسُولَ اللَّهِ بِابْنٍ لَهَا قَدْ عَلَّقَتْ عَلَيْهِ مِنَ الْعُذْرَةِ فَقَالَ \" اتَّقُوا اللَّهَ، عَلَى مَا تَدْغَرُونَ أَوْلاَدَكُمْ بِهَذِهِ الأَعْلاَقِ عَلَيْكُمْ بِهَذَا الْعُودِ الْهِنْدِيِّ، فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ، مِنْهَا ذَاتُ الْجَنْبِ \". يُرِيدُ الْكُسْتَ يَعْنِي الْقُسْطَ، قَالَ وَهْىَ لُغَةٌ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5718، يذكر القسط والعود الهندي، والقسط، وأسماء الأمراض، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5718 (Medicine), that mentions costus (Indian aloeswood), costus, named diseases, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5718، جس میں قسط ہندی، قسط، بیماریوں کے نام، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
