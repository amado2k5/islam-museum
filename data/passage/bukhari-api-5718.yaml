label: { ar: "صحيح البخاري 5718 — القسط والعود الهندي، القسط", en: "Sahih al-Bukhari 5718 — costus (Indian aloeswood); costus", ur: "صحیح بخاری 5718 — قسط ہندی، قسط", es: "Sahih al-Bukhari 5718 — costus (madera de áloe india); costo", fr: "Sahih al-Bukhari 5718 — costus (bois d'aloès indien); costus", tr: "Sahih el-Buhari 5718 - Costus ve Hint Udu, Costus", id: "Sahih al-Bukhari 5718 — Costus dan Oud India, Costus" }
text: "… مِحْصَنٍ،، وَكَانَتْ، مِنَ الْمُهَاجِرَاتِ الأُوَلِ اللاَّتِي بَايَعْنَ رَسُولَ اللَّهِ وَهْىَ أُخْتُ عُكَّاشَةَ بْنِ مِحْصَنٍ أَخْبَرَتْهُ أَنَّهَا أَتَتْ رَسُولَ اللَّهِ بِابْنٍ لَهَا قَدْ عَلَّقَتْ عَلَيْهِ مِنَ الْعُذْرَةِ فَقَالَ \" اتَّقُوا اللَّهَ، عَلَى مَا تَدْغَرُونَ أَوْلاَدَكُمْ بِهَذِهِ الأَعْلاَقِ عَلَيْكُمْ بِهَذَا الْعُودِ الْهِنْدِيِّ، فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ، مِنْهَا ذَاتُ الْجَنْبِ \". يُرِيدُ الْكُسْتَ يَعْنِي الْقُسْطَ، قَالَ وَهْىَ لُغَةٌ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5718، يذكر القسط والعود الهندي، والقسط، وأسماء الأمراض، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5718 (Medicine), that mentions costus (Indian aloeswood), costus, named diseases, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5718، جس میں قسط ہندی، قسط، بیماریوں کے نام، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 5718 (Medicina), menciona el costus (árbol de aloe indio), enfermedades y curación. El Navegador de Medicina lo incluye en los textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5718 (Médecine), mentionne le costus (bois d'aloès indien), ses propriétés curatives et le traitement de certaines maladies. Le dictionnaire médical le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5718 numaralı hadiste, kostus ve Hint öd ağacı, kostus, hastalık isimleri ve şifa konularından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5718, menyebutkan costus dan gaharu India, costus, nama-nama penyakit, dan penyembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
