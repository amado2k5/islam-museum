label: { ar: "الموطأ 1435 — مالك: أحسن ما سمع في الخيل والبغال والحمير أنها لا تؤكل، واستشهد بآيات النحل والحج وقول سعيد في البراذين", en: "Muwatta 1435", es: "Muwatta 1435", fr: "Muwatta 1435", ur: "موطا 1435", tr: "El-Muvatta 1435 — Malik: Atlar, katırlar ve eşekler hakkında duyduğu en iyi görüş, bunların yenmemesi gerektiği yönündedir ve bu konuda Nahl Suresi ile Hac Suresi'nden ayetler ve Said'in katırlar hakkındaki sözünü aktarmıştır.", id: "Al-Muwatta 1435 — Malik: Pendapat terbaik yang ia dengar mengenai kuda, bagal, dan keledai adalah bahwa hewan-hewan tersebut tidak boleh dimakan, dan ia mengutip ayat-ayat dari Surah An-Nahl dan Surah Al-Hajj serta pernyataan Saeed mengenai bagal." }
summary:
  ar: "يروي يحيى عن مالك أن أحسن ما سمعه في الخيل والبغال والحمير أنها لا تؤكل، لأن الله تعالى ذكرها للركوب والزينة، وذكر الأنعام للركوب والأكل، واستشهد بآيات من سورتي الحج والنحل. وسمع مالكا يقول إن البائس هو الفقير، والمعتر هو الزائر، والقانع هو الفقير أيضا. {cite:muwatta-maruf-1997 p.641}"
  tr: "Yahya, Malik'ten rivayet ettiğine göre, atlar, katırlar ve eşekler hakkında duyduğu en güzel şey, bunların yenmemesi gerektiğiydi; çünkü Yüce Allah onları binek ve süs olarak zikretmiş, hayvanları ise binek ve yemek için zikretmiştir. Delil olarak Hac Suresi ve Nahl Suresi'nden ayetler zikretmiştir. Ayrıca Malik'in, cimri olanın fakir, muhtaç olanın misafir, kanaatkar olanın da fakir olduğunu söylediğini işitmiştir. {cite:muwatta-maruf-1997 s.641}"
  id: "Yahya meriwayatkan dari Malik bahwa hal terbaik yang ia dengar mengenai kuda, bagal, dan keledai adalah bahwa hewan-hewan itu tidak boleh dimakan, karena Allah SWT menyebutkan mereka untuk ditunggangi dan sebagai hiasan, sedangkan hewan ternak lainnya disebutkan untuk ditunggangi dan dimakan. Ia mengutip ayat-ayat dari Surah Al-Hajj dan Surah An-Nahl sebagai bukti. Ia juga mendengar Malik berkata bahwa orang yang kikir adalah orang miskin, orang yang membutuhkan adalah musafir, dan orang yang puas juga miskin. {cite:muwatta-maruf-1997 p.641}"
