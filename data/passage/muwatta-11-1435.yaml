label: { ar: "الموطأ 1435 — مالك: أحسن ما سمع في الخيل والبغال والحمير أنها لا تؤكل، واستشهد بآيات النحل والحج وقول سعيد في البراذين", en: "Muwatta 1435" }
summary:
  ar: "يروي يحيى عن مالك أن أحسن ما سمعه في الخيل والبغال والحمير أنها لا تؤكل، لأن الله تعالى ذكرها للركوب والزينة، وذكر الأنعام للركوب والأكل، واستشهد بآيات من سورتي الحج والنحل. وسمع مالكا يقول إن البائس هو الفقير، والمعتر هو الزائر، والقانع هو الفقير أيضا. {cite:muwatta-maruf-1997 p.641}"
