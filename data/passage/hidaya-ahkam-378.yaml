text: "فصلٌ فصلٌ والمستحاضةُ، ومَن به سَلَسُ البول، والرُّعافُ الدائمُ، والجُرْحُ الذي لا يَرقا : يتوضؤون لوقتِ كلِّ صلاةٍ، فيُصلُّون بذلك الوضوءِ في الوقتِ ما شاؤوا من الفرائض والنوافل. فصلٌ في الاستحاضة قال: والمستحاضةُ، ومَن به سَلَسُ البول، والرُّعافُ الدائمُ، والجُرْحُ …"
summary:
