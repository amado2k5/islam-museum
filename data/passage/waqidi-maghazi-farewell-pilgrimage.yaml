text: "ويقال: إنما قال إلى فيء صخرة، وميمونة زوجته تتبع ظلها حتى راح، وأزواجه في قباب حوله"
summary:
  ar: "في باب حجة الوداع، يذكر الواقدي روايات نسائه: ميمونة تتبع ظل القبة حتى راح وأزواجه في قباب حوله، وتروي عائشة خبر تبليغها آية الحجاب وأنها رأت النبي يخطب بالناس في عرفة. ويذكر الباب مناسك الحج وأيام منى."
  en: "In the Farewell Pilgrimage chapter Waqidi gathers the wives' reports: Maymunah following the tent's shade until evening while the Prophet's wives dwelt in tents around him, and Aisha recounting the hijab verse's revelation and the sermon at Arafat. The chapter covers the rites of Hajj and Mina's jamarat."
