label: { ar: "حجة الوداع — مكة وعرفات ومنى", en: "The Farewell Pilgrimage — Mecca, Arafat and Mina", es: "La peregrinación de despedida: La Meca, Arafat y Mina.", fr: "Le pèlerinage d'adieu — La Mecque, Arafat et Mina", ur: "الوداعی حج - مکہ، عرفات اور منیٰ" }
text: "ويقال: إنما قال إلى فيء صخرة، وميمونة زوجته تتبع ظلها حتى راح، وأزواجه في قباب حوله"
summary:
  ar: "في باب حجة الوداع، يذكر الواقدي روايات نسائه: ميمونة تتبع ظل القبة حتى راح وأزواجه في قباب حوله، وتروي عائشة خبر تبليغها آية الحجاب وأنها رأت النبي يخطب بالناس في عرفة. ويذكر الباب مناسك الحج وأيام منى."
  en: "In the Farewell Pilgrimage chapter Waqidi gathers the wives' reports: Maymunah following the tent's shade until evening while the Prophet's wives dwelt in tents around him, and Aisha recounting the hijab verse's revelation and the sermon at Arafat. The chapter covers the rites of Hajj and Mina's jamarat."
  es: "En el capítulo «La Peregrinación de Despedida», Waqidi recoge los relatos de las esposas: Maymunah siguiendo la sombra de la tienda hasta el anochecer, mientras las esposas del Profeta habitaban en tiendas a su alrededor, y Aisha narrando la revelación del versículo del hiyab y el sermón en Arafat. El capítulo abarca los ritos del Hajj y la jamarat de Mina."
  fr: "Dans le chapitre consacré au pèlerinage d'adieu, Waqidi recueille les témoignages des épouses: Maymunah, restée à l'ombre de la tente jusqu'au soir tandis que les épouses du Prophète demeuraient sous des tentes autour de lui; et Aïcha, relatant la révélation du verset sur le hijab et le sermon d'Arafat. Ce chapitre aborde les rites du Hajj et la jamarat de Mina."
  ur: "حجۃ الوداع کے باب میں واقدی نے ازواج مطہرات کی خبریں جمع کی ہیں: میمونہ شام تک خیمے کے سائے کے پیچھے چل رہی تھیں جب کہ نبی کی بیویاں آپ کے اردگرد خیموں میں رہتی تھیں، اور عائشہ حجاب کی آیت کا نزول اور عرفات میں خطبہ سنا رہی تھیں۔ اس باب میں مناسک حج اور منیٰ کی جمرات کا احاطہ کیا گیا ہے۔"
