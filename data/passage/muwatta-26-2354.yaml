label: { ar: "الموطأ 2354 — مالك: مدبر لسيد له مال حاضر وغائب", en: "Muwatta 2354" }
summary:
  ar: "قال مالك في رجل دبر عبدا له، فمات السيد وله مال حاضر ومال غائب، ولم يكن في ماله الحاضر ما يخرج فيه المدبر: يُوقف المدبر بماله، وتُجمع غلته حتى يتبين من المال الغائب. فإن كان فيما ترك السيد ما يحمله الثلث عتق بماله وبما جمع من غلته، وإلا عتق منه قدر الثلث، وترك ماله في يديه. {cite:muwatta-maruf-1997 p.371}"
