label: { ar: "الموطأ 2354 — مالك: مدبر لسيد له مال حاضر وغائب", en: "Muwatta 2354", es: "Muwatta 2354", fr: "Muwatta 2354", ur: "موطا 2354", tr: "Al-Muwatta 2354 — Malik: Bir mudabbar (efendisinin mevcut ve nafile mallarını yöneten köle)" }
summary:
  ar: "قال مالك في رجل دبر عبدا له، فمات السيد وله مال حاضر ومال غائب، ولم يكن في ماله الحاضر ما يخرج فيه المدبر: يُوقف المدبر بماله، وتُجمع غلته حتى يتبين من المال الغائب. فإن كان فيما ترك السيد ما يحمله الثلث عتق بماله وبما جمع من غلته، وإلا عتق منه قدر الثلث، وترك ماله في يديه. {cite:muwatta-maruf-1997 p.371}"
  tr: "Malik, bir adamın ölümünden sonra kölesine efendisinin özgürlüğünü verdiğini, ancak efendinin hem mevcut hem de mevcut olmayan mallar bırakarak öldüğünü ve mevcut malların köleyi özgür bırakmaya yetmediğini şöyle anlatmıştır: Köle, efendisinin mallarıyla birlikte emanet olarak tutulur ve eksik mallar tespit edilene kadar kazançları toplanır. Eğer efendinin mal varlığı kölenin değerinin üçte birini karşılamaya yetiyorsa, köle mal varlığı ve toplanan kazançlarla birlikte özgür bırakılır. Aksi takdirde, kölenin sadece üçte biri özgür bırakılır ve kalan malları onun mülkiyetinde kalır. {cite:muwatta-maruf-1997 s.371}"
  id: "Malik berkata mengenai seorang pria yang memberikan kebebasan kepada budaknya setelah kematian tuannya, dan kemudian tuannya meninggal dunia meninggalkan harta benda yang ada dan yang hilang, dan harta benda yang ada tidak cukup untuk membebaskan budak tersebut: budak tersebut dipegang dalam perwalian beserta harta bendanya, dan penghasilannya dikumpulkan sampai harta benda yang hilang diidentifikasi. Jika harta tuannya cukup untuk menutupi sepertiga dari nilai budak tersebut, budak tersebut dibebaskan beserta harta bendanya dan penghasilan yang dikumpulkan. Jika tidak, hanya sepertiga dari nilai budak tersebut yang dibebaskan, dan sisa harta bendanya tetap berada dalam kepemilikannya. {cite:muwatta-maruf-1997 p.371}"
