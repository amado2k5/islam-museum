summary:
  ar: "القسم 4 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المساجد والجماعات»، ويضم فيها النصوص من 735 إلى 802 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 4 of Sunan Ibn Majah (The Book On The Mosques And The Congregations) in the division of the open hadith dataset the museum took its reports from: reports 735 to 802 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 4، عنوان «کتاب المساجد والجماعات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 735 تا 802۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 4 de Sunan Ibn Majah (El libro sobre las mezquitas y las congregaciones) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 735 al 802, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
