text: "… ليس ألف الاستفهام كانت تقريرًا، ودخلها معنى الإيجاب، فلم يحسن معها أحد لأن أحدًا إنما يجوز مع حقيقة النفي، لا تقول: ليس أحد في الدار؛ لأن المعنى يؤول إلى قولك: أحد في الدار وأحد لا تستعمل في الواجب انتهى. وأمثلته …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 519، يرد فيه ذكر الواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 519, whose wording mentions the obligatory (wajib), obligation (wujub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
