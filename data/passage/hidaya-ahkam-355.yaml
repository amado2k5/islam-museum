text: "باب التيمُّم ويُستَحَبُّ لعادمِ الماءِ، وهو يَرجوه : أن يُؤخِّرَ الصلاةَ إلىٰ آخِرِ الوقت، فإن وَجَدَ الماء : توضأ، وإلا : تيمَّم وصلىٰ. ويصلي بتيمُّمه ما شاء من الفرائضِ، والنوافلِ. ويتيمُّمُ الصحيحُ في المصر إذا حضرتْ جنازةٌ والوليُّ غيرُه، فخافَ …"
summary:
  ar: "مقطع من الهداية للمرغيناني، ص 355، يرد فيه ذكر الفريضة والفرائض، والمستحب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
