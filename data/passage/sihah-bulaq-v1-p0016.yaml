text: |-
  ٦٢٥
  فى سيرها فهو مبلع وإغاعت وأنشد أبو عمرو فقل المرافق بح_دوهافتملع
  والمليع والملاح المفازة التى لاندات بهاومن أمثالهم أودت به عقاب ملاع قال أبو عبيدية ال
  ذلك فى الواحد والجع وهو شبيه بقولهم طارت به العنقاء وحلاقت به عذقاء مغرب وكذلك
  المبلح والمبلع أيضا المسريع قال الشاع ريصف فرسا
  مطلع التقريب يعبوب اذا * بادر الجونة واحةّ الافق
  ١ منع ) المنع خلاف الاعطاء وقد منع فهومانع ومنوع ومناع ومنعت الرجل
  عن الشئء فامتنع منه ومانعته الشئممائعة ومكان منيع وقد منع بالضم مشاعة وذلان فءبز
  ومنعة بالتحريك وقد يسكن عن ابن السكيت ويقال المنعة جمع مانع مثل كافر وكفرة.
  أى هو فى عزومن يمنعه من عشيرته وقد تنع وقال الكلابى المتمنعان البكرة والعناق
  تتنعان على المسنة يفتائه-ماولائح -ما يشبعان قبل الجلة قال وهما المقائلتان للزمان عن
  أنفسهما (ميع المبع مصدر ماع السمن ييع اذاذاب والمبع سيلان الشئ المصبوب
  وقدماع الشيء يميع اذاجرى على وجه الارض وتميع مثله والميعة النشاط وأوّل جرى الفرس
  وأوّل الشباب وأول النهاد والميعة أيضاصيع يسيل من شجر ببلاد الروم يؤخذ فيطبخ
  فاصفا منه فهو المبعة السائلة ومابق منه شبه التجير فهو الميعة اليابسة
  صل النون ⁦( ن ع )⁩ منبع الماه يقبع وينبع وينيج نبعا ونبوعا خرج من العين والينبوع
  مين الماء ومنسه قوله تعالى حتى تفجرلنا من الارض ينبوعا والجمع البنابيع ونوابع البع:
  المواضع التى يسدل منهاعرقه قال الاصمعى بقال قد انساع علنافلان بالمكلام أى انعن
  وفى المثل مخرتبق لينباع أى ساكت لينبعث ومطرق لينثال والنبع شجر تتخذمنه القسى"
  قال الشماخ
  شرائح النبع براها القواس الواحدة تبعة وتتخذمن أغصانها المسهام
  قال دريد بن الصمة وأصفر من قداح النبع فرع * به علمان من عقب وضرس
  يقول إنه برى فرع الغصن ليس بغلق ويشابع موضع وينبع بلد والنباعة الاست يقال
  كذيت نساعتك اذا ردم وبالغين المحجمة أيضا ⁦(نجع)⁩ نجع الطعام ينجبع ويبع نجوعاأى
  همأ آكله وماء نجوع كما يقال غير ونجوع الصىّ هو اللين وقال ابن السكيت النجوع المديد
  وقد نجعت البعير قال وتجمع فى الداية العاف ولا يقال أنجع وقد نجع فيه الحطاب والوعظ
  والدواء أى دخل وأثر والنجعة بالضم طلب الكلل فى. وضع-ه تقول منه اتتجعت فلانا اذا
  أتيته تطلب معروفه والمنتجع المنزل فى طلب الكلا وهؤلا قوم ناجعة ومنتجعون وقد نجعوا
  نجعون فى مع-فى انتجعوا يتجعون عن يعقوب والنجيع خبط يضرب بالدقيق وبالماء يوجره
  البعير والنجيع من الدم ماكان الى المسواد وقال الاصمعى هودم الجوف خاصة ٢
  ( فع النخاعة بالضم النخامة وتنخع فلان أى رمى ينخاعته وانتخع فلان عن أرض
  أى بعد عنها قال الكسائى من العرب من يقول قطعت نخاعه وتخاعه وناس من أهل الجاز
  يقولون هو مقطوع النخاع بالضم وهو الخيط الابيض الذى فى جوف الفقار والمنخع مفصل
  الفهقة بين العنق والرأس من باطن يقسال ذبحه فنخعه نخما أى جاوز منتهى الذبح الى النخاع
  ويقال داية منخوعة والنخع قبيلة من اليمن رهط ابراهيم النخعى ونخعته الود والنصيحة
  I٥٧
  صاح
  ١ ر ملع الفصيل أمه وملعيا
  اذارضعها
  ٢ النجمع مانجع فى البحدن
  من طعام اوشراب وأنشد
  لمسعودأخى ذى الزمة
  وقد عات أسماءان حدينها
  نجيع كماماء الس نجيع
  كذا فى نسضة بالاصل
