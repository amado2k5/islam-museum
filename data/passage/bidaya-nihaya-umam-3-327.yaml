  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 3. cildinin 327. sayfasından, gayrimüslim milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Gayrimüslim Milletler, Dinler, Mezhepler ve Halklar\" tarayıcısı tarafından derlenmiştir."
