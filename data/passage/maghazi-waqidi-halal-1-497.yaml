text: "… ؟ لقد طردناهم إلى حَمْراء الأَسَد ؛ إنَّ اللّٰه يأْمرك أَن تسير إِلى بنى قُرَيْظَة، فإِنى عامِد إليهم فمُزَلْزِلٌ بهم حُصونَهم. ويقال جاءه على فرس أَبْدَق. فدعا رسولُ اللّٰه عَليًّا فدفع إليه لِواء، وكان اللواء على حالِه لم يُحَلُّ مِن …"
