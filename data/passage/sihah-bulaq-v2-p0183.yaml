text: |-
  ٧٠٤
  •⁦(ضكون)⁩
  عليز بكديون وأبطن كرة • فهنّ وضاءصافيات الغلائل
  رن المكران العود ويقال الصنج قال لبيد
  صعل كسافاة القناظنبوبه • وكأنّ جوْجوْه صفيح كران
  والكرينة المغنية رزن) الكرزن والكرزين بالسكسر فأس عظيمة مثل السكرزم
  والكرزيم عن الفراء ⁦( كفن )⁩ الكفن غزل الصوف يقال كفن يكفن قال
  ويكفن الدهر الاريت يهتبل • والكفته شجر والكفن معروف يقال كفمت اليت تكفينا
  ( كن كن يكمن كمونا اختفي ومنه الكمين فى الحرب وناقة كمون أى كنوم للقاح وهي التى
  اذ القحت لم تشل بذنيها وحزن. كتمن فى التلب مخف والكمون بالتشديدمعروف والكمنة
  ورم فى الاجقان وا كال فتحمرء العين يقال كنت عينه تكمن كمنة ⁦( نن)⁩ الكن
  السترة والجمع أكتان قال اللّٰه تعالى وجعل لكم من الجبال أكنانا والاكنة الاغية قال الله
  تعالى وجعلنا على قلوبهم أكنة الواحدكنان قال عمر بن أب ربيعة:
  تحت عين كتاننا • ظل برد مرحل
  الكسائى كننت الشئ سترته وصنته من الشمر وأكنفته فى نفسى أسررته وقال
  أبوزيد كننته وأكننته بمعنى فى السكن وفى النفس ججميعا وتقول كننت العلم وأكنفته
  فهومكنون ومكنّ وكنفت الجمارية وأكثفتها فهى -كنونة ومكنة أبوعمر والسكنة بالضم
  سقيفة تشرع فوق باب الدار والهع كنات وبنوكنة قوم من العرب والسكنة بالفتح امرأة
  الاين وتجمع على كناثن كانه جم-ع كنينة قال الزبرقان بن بدر أ بغض كنائنى الى القبعة
  العالمعة والمسكانة التى تجعل فيها السهام وكتانة قبيلة من مضروهو كاثة بن خزيمة بن مدركة
  واين العاس بن مضر وبنو كنانة أيضامن تغلب بن وائل وهم ينو عكب يقال لهم فرس تغلب
  وأكتنواستكن استتر والمستكنة الحقد قال زهير
  وكان طوى كشحاعلى مستكنة * فلاهو أبداها ولم يتقدم
  والسكانون والكانونة الموقد ويقال للثقيل من الرجال كانون قال الحطيئة
  أغر بالإاذا استودعت سرا * وكانوناعلى المتحدثينا
  وكانون الاول وكانون الاخرشهرات فى قلب الشتاء بلغة أهل الروم ون كأن اذا
  جعلتبه عبارة عمامضى من الزمان احتاج الى خسبر لانه دل على الزمان فقط تقول كان
  زيد عالما واذاجعلته عبارة عن حدوث الشى ووقوعه استغى عن الخبرلانه دل على معن
  وزمان تقول كان الامر وأنا أعرفه مذ كان أى مذخلق قال الشاعر
  قدى لبن ذهل بن شيبان ناقتى • اذا كان يوم ذوكوا كب أشهب
  وقسد تقع زائدة للتوكيد كولت زيد كان منطلق ومعناه زيد مفطلق قال اللّٰه تعالى وكان اللّٰه
  غفورارحيما وقال الهذلى
  وكنت اذا جارى دعالضوفة • أشمر حتى يتتصف الساق متزرى
  وانما يخبر عن حاله وليس يخبر بكنت عمامضى من فع له وتقول كان كونا وكينونة أيضاشبهوه
  بالحيدودة والطيرورة من ذوات الياء ولم يجى من الواوعلى هذا الاأحرف كينونة وهيعوعة
  وديوم
