label: { ar: "سنن أبي داود 1419 — الأب والأبوة", en: "Sunan Abi Dawud 1419 — the father and fatherhood", ur: "سنن ابی داؤد 1419 — باپ اور والدیت", es: "Sunan Abi Dawud 1419 — El padre y la paternidad", fr: "Sunan Abi Dawud 1419 — le père et la paternité", tr: "Sunan Abi Davud 1419 — Baba ve Babalık", id: "Sunan Abi Dawud 1419 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا ابْنُ الْمُثَنَّى، حَدَّثَنَا أَبُو إِسْحَاقَ الطَّالْقَانِيُّ، حَدَّثَنَا الْفَضْلُ بْنُ مُوسَى، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ الْعَتَكِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" الْوِتْرُ حَقٌّ فَمَنْ لَمْ يُوتِرْ فَلَيْسَ مِنَّا الْوِتْرُ حَقٌّ فَمَنْ لَمْ يُوتِرْ فَلَيْسَ مِنَّا الْوِتْرُ حَقٌّ فَمَنْ لَمْ يُوتِرْ فَلَيْسَ مِنَّا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1419، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1419 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1419، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1419 (Oración (Kitab Al-Salat): Preceptos detallados sobre el Witr), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1419 (La Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1419 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1419, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
