label:
  ar: "ابن ماجه 1597 — إن صبرت عند الصدمة الأولى لم أرض لك ثوابا دون الجنة"
  en: "Ibn Majah 1597 — If you are patient at the first blow, I accept no reward for you short of Paradise"
  ur: "ابن ماجہ 1597 — اگر تم پہلے صدمے پر صبر کرو تو میں جنت سے کم ثواب پر راضی نہیں"
text: "يقول الله سبحانه: ابن آدم إن صبرت واحتسبت عند الصدمة الأولى لم أرض لك ثوابا دون الجنة ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 1597: إن صبرت عند الصدمة الأولى لم أرض لك ثوابا دون الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 1597: If you are patient at the first blow, I accept no reward for you short of Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 1597: اگر تم پہلے صدمے پر صبر کرو تو میں جنت سے کم ثواب پر راضی نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
