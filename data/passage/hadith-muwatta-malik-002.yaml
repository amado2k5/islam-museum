text: "الأول، وهي من أفضل أيامى (١) قريش، فلما أنزل الله - تعالى - في كتابه في زيد بن حارثة ما أنزل فقال: ( ادعوهم لأبآئهم هو أقسط عند الله فإن لم تعلموا ءابآءهم فإخوانكم في ٱلدين وموليكم ) [الأحزاب: ٥]؛"
