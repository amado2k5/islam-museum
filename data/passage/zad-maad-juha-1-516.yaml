text: "… فأمَّره على من تعجَّل، وكانت فيه دُعابة، فنزلوا ببعض الطريق، وأوقدوا ناراً يصطلون عليها، فقال : عزمتُ عليكم إلَّا تواثيتم في هذه النار، فقام بعضُ القوم، فتجهَّزوا حتى ظن أنهم واثبون فيها، فقال: اجلسوا إنما كُنتُ أضحكُ معكم، فذكروا ذلك …"
