summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 3، ص 226، يذكر ساعة الاحتضار والوفاة، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 3, p. 226, that mentions a deathbed and last hours, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 3، ص 226 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 3, pág. 226, que menciona un lecho de muerte y las últimas horas, una reliquia conservada tras su dueño; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
