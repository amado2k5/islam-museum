text: "أَخْبَرَنَا إِسْحَاقُ، قَالَ أَنْبَأَنَا سُلَيْمَانُ بْنُ حَرْبٍ، قَالَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَيُّوبَ، عَنْ حُمَيْدِ بْنِ هِلاَلٍ، عَنْ أَنَسٍ، أَنَّ رَسُولَ اللَّهِ نَعَى زَيْدًا وَجَعْفَرًا قَبْلَ أَنْ يَجِيءَ خَبَرُهُمْ فَنَعَاهُمْ وَعَيْنَاهُ تَذْرِفَانِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1878، فيه نعي وإخبار بوفاة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1878 (The Book of Funerals), that carries a death announcement. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن النسائی کی حدیث نمبر 1878، جس میں وفات کی خبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan al-Nasa'i, n° 1878, qui contient une annonce de décès. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan al-Nasa'i, n.º 1878, que contiene un anuncio de fallecimiento. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sunan-ı Nesai'de yer alan 1878 numaralı hadis, bir ağıt ve ölüm müjdesini içermektedir. Bu hadis, en meşhur yas ve ağıt ifadelerini araştıran bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 1878, berisi ratapan dan pengumuman kematian. Hadits ini disusun oleh seorang peneliti mengenai ungkapan-ungkapan duka cita dan ratapan yang paling terkenal, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, catatan dari para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
