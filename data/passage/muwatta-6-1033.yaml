label: { ar: "الموطأ 1033 — عائشة تُسأل عن المحرم: أيحك جسده؟ قالت: نعم فليحكه وليشدد، ولو رُبطت يداي ولم أجد إلا رجلي لحككت", en: "Muwatta 1033", es: "Muwatta 1033", fr: "Muwatta 1033", ur: "موطا 1033", tr: "Muvatta 1033 — Aişe'ye ihramlı bir hacı hakkında soruldu: Vücudunu kaşıması caiz midir? O şöyle dedi: Evet, kaşısın ve kararlı olsun. Ellerim bağlı olsa ve sadece ayaklarım olsa bile, ben de kaşırdım.", id: "Al-Muwatta 1033 — Aisyah ditanya tentang seorang jamaah haji yang sedang ihram: Apakah diperbolehkan baginya menggaruk badannya? Dia menjawab: Ya, boleh dia menggaruknya dan lakukan dengan teguh. Sekalipun tanganku terikat dan aku hanya memiliki kakiku, aku akan menggaruknya." }
text: "نعم فليحكه وليشدد، ولو رُبطت يداي ولم أجد إلا رجلي لحككت"
summary:
  ar: "يرويه مالك عن علقمة بن أبي علقمة عن أمه، أنها سمعت عائشة زوج النبي تُسأل عن المحرم: أيحك جسده؟ فقالت: نعم فليحكه وليشدد، ولو رُبطت يداي ولم أجد إلا رجلي لحككت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1194) وسويد (581) والشيباني (435). {cite:muwatta-maruf-1997 p.481}"
  tr: "Malik, annesi Alkame ibn Ebu Alkame'den rivayet ettiğine göre, Peygamberimizin eşi Aişe'ye ihramlı bir hacı hakkında \"Vücudunu kaşımasına izin verilir mi?\" diye sorulduğunu işitmiştir. Aişe şöyle cevap vermiştir: \"Evet, kaşısın ve güçlü olsun. Ellerim bağlı olsa ve sadece ayaklarım kalsa bile, ben kaşırdım.\" Araştırmacı, bu rivayetin Malik'ten Ebu Musab (1194), Suveyd (581) ve Şeybani (435) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.481}"
  id: "Malik meriwayatkannya dari Alqamah ibn Abi Alqamah, dari ibunya, bahwa ia mendengar Aisyah, istri Nabi, ditanya tentang seorang peziarah yang sedang ihram: \"Apakah dia diperbolehkan menggaruk badannya?\" Ia menjawab: \"Ya, boleh dia menggaruknya dengan giat. Bahkan jika tanganku terikat dan aku tidak memiliki apa pun selain kakiku, aku akan menggaruknya.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1194), Suwaid (581), dan Al-Shaybani (435). {cite:muwatta-maruf-1997 p.481}"
