text: "نعم فليحكه وليشدد، ولو رُبطت يداي ولم أجد إلا رجلي لحككت"
summary:
  ar: "يرويه مالك عن علقمة بن أبي علقمة عن أمه، أنها سمعت عائشة زوج النبي تُسأل عن المحرم: أيحك جسده؟ فقالت: نعم فليحكه وليشدد، ولو رُبطت يداي ولم أجد إلا رجلي لحككت. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1194) وسويد (581) والشيباني (435). {cite:muwatta-maruf-1997 p.481}"
