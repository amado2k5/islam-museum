text: "… قال-: أملاه على - ثنا أبو حجر ثنا حمد بن عبيد ثنا الأهمش عن أبى سفيان عن جابر قال : مرض أبى بن كعب مرضا فيهث النبى طبيما فكواه على أكحله. مممت أباعد يقون وحكى من جده محمود قال سممت …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 9، ص 401، يذكر الكي، والمرض والمريض، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 9, p. 401, that mentions cautery, illness and the sick, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 9، ص 401 کا اقتباس جس میں داغنا، بیماری اور بیمار، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 9, pág. 401, que menciona la cauterización, la enfermedad y los enfermos, los órganos del cuerpo; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 9 scanné, p. 401, qui mentionne la cautérisation, la maladie et les malades, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Abu Nu'aym'ın Hilyat al-Awliya' adlı eserinin resimli 9. cildinin 401. sayfasından bir bölüm; yakma, hastalık ve hasta ile vücut parçalarından bahsediyor; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 9, hlm. 401, yang menyebutkan kauterisasi, penyakit dan pasien, serta bagian-bagian tubuh; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
