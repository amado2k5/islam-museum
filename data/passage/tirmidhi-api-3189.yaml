label: { ar: "جامع الترمذي 3189 — الأب والأبوة", en: "Jami' al-Tirmidhi 3189 — the father and fatherhood", ur: "جامع ترمذی 3189 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3189 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3189 — le père et la paternité" }
text: "… قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ سِمَاكِ بْنِ حَرْبٍ، قَالَ سَمِعْتُ مُصْعَبَ بْنَ سَعْدٍ، يُحَدِّثُ عَنْ أَبِيهِ، سَعْدٍ قَالَ أُنْزِلَتْ فِيَّ أَرْبَعُ آيَاتٍ. فَذَكَرَ قِصَّةً فَقَالَتْ أُمُّ سَعْدٍ أَلَيْسَ قَدْ أَمَرَ اللَّهُ بِالْبِرِّ وَاللَّهِ لاَ أَطْعَمُ طَعَامًا وَلاَ أَشْرَبُ شَرَابًا حَتَّى أَمُوتَ أَوْ تَكْفُرَ قَالَ فَكَانُوا إِذَا أَرَادُوا أَنْ يُطْعِمُوهَا شَجَرُوا فَاهَا فَنَزَلَتْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3189، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3189 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3189، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3189 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3189 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
