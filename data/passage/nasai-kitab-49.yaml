summary:
  ar: "القسم 49 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب آداب القضاة»، ويضم فيها النصوص من 5379 إلى 5427 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 49 of Sunan al-Nasa'i (The Book of the Etiquette of Judges) in the division of the open hadith dataset the museum took its reports from: reports 5379 to 5427 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 49، عنوان «کتاب آداب القضاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5379 تا 5427۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 49 de Sunan al-Nasa'i (El Libro de la Etiqueta de los Jueces) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5379 al 5427, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de l'étiquette des juges), dans la section 5379 à 5427 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
