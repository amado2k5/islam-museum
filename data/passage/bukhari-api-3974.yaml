label: { ar: "صحيح البخاري 3974 — الأب والأبوة", en: "Sahih al-Bukhari 3974 — the father and fatherhood", ur: "صحیح بخاری 3974 — باپ اور والدیت", es: "Sahih al-Bukhari 3974 — El padre y la paternidad" }
text: "حَدَّثَنَا فَرْوَةُ، عَنْ عَلِيٍّ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، قَالَ كَانَ سَيْفُ الزُّبَيْرِ مُحَلًّى بِفِضَّةٍ. قَالَ هِشَامٌ وَكَانَ سَيْفُ عُرْوَةَ مُحَلًّى بِفِضَّةٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3974، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3974 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3974، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3974 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
