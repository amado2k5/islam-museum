text: "… له صُحبةٌ. الله، وعمرة في رمضان تعدِلُ حجّةً، ومن حديث أَبي معقل أَيضاً عن النّبيّ وَلِيهِ. أنه نهى أَن عدادُه في الشاميين. روى عنه راشد بن سعد، عن النَّبيّ الي : لا يَستكملُ العبدُ الإيمان حتَّى يحِبَّ تُستقبل القبلتان بغائط …"
summary:
