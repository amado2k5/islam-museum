label: { ar: "الموطأ 2093 — مالك: من باع شقصا من أرض مشتركة، فسلم بعض من له فيها الشفعة للبائع، وأبى بعضهم إلا أن يأخذ بشفعته: إن من أبى أن يسلم يأخذ بالشفعة كلها، وليس له أن يأخذ بقدر حقه ويترك ما بقي", en: "Muwatta 2093", es: "Muwatta 2093", fr: "Muwatta 2093", ur: "موطا 2093", tr: "Al-Muwatta 2093 — Malik: Eğer bir kimse ortak mülkiyetteki bir arazinin bir kısmını satarsa ve ön alım hakkına sahip olanlardan bazıları paylarını satıcıya devrederken, diğerleri ön alım haklarından vazgeçmeyi reddederse: paylarını devretmeyi reddedenler, ön alım haklarını bütünüyle kullanmalıdırlar. Sadece kendilerine ait olanı alıp geri kalanını bırakmalarına izin verilmez.", id: "Al-Muwatta 2093 — Malik: Jika seseorang menjual sebagian tanah milik bersama, dan sebagian dari mereka yang memiliki hak prioritas menyerahkan bagian mereka kepada penjual, sementara yang lain menolak untuk melepaskan hak prioritas mereka: mereka yang menolak untuk menyerahkan bagian mereka harus menggunakan hak prioritas mereka secara keseluruhan. Mereka tidak diperbolehkan untuk mengambil hanya apa yang menjadi hak mereka dan meninggalkan sisanya." }
summary:
  ar: "قال مالك: ومن باع شقصا من أرض مشتركة، فسلم بعض من له فيها الشفعة للبائع، وأبى بعضهم إلا أن يأخذ بشفعته، فإن من أبى أن يسلم يأخذ بالشفعة كلها، وليس له أن يأخذ بقدر حقه ويترك ما بقي. {cite:muwatta-maruf-1997 p.256}"
  tr: "Malik şöyle demiştir: Eğer birisi ortak mülkiyetteki bir arazinin bir kısmını satarsa ve ön alım hakkına sahip olanlardan bazıları paylarını satıcıya devrederken, diğerleri haklarından vazgeçmeyi reddederse, paylarını devretmeyi reddedenler ön alım haklarını bütünüyle kullanmalıdırlar. Sadece hakları olanı alıp geri kalanını bırakmalarına izin verilmez. {cite:muwatta-maruf-1997 s.256}"
  id: "Malik berkata: Jika seseorang menjual sebagian tanah milik bersama, dan sebagian dari mereka yang memiliki hak prioritas menyerahkan bagian mereka kepada penjual, sementara yang lain menolak untuk melepaskan hak mereka, maka mereka yang menolak untuk menyerahkan bagian mereka harus menggunakan hak prioritas mereka secara keseluruhan. Mereka tidak diperbolehkan hanya mengambil apa yang menjadi hak mereka dan meninggalkan sisanya. {cite:muwatta-maruf-1997 p.256}"
