text: "… أجنادين. وبه قال ابن عباس. وكان خالد بن سنان بعث مبشراً كذا قال أبو الأسود عن عروة. وقد اختلف أهل بمحمد وَيلفه، فلما حضرته الوفاة قال: إذا أنا مت التاريخ أيهما كان قبل. والله أعلم. فادفنوني في حِقْفٍ من هذه …"
