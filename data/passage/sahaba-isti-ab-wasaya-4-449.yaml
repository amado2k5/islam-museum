text: "… العَمودَينِ مِن بني عبدِ الأشهلِ حتَّى وضَعه بالبقيعِ، وصَلَّى عليه، وأوصَى إلى عمرَ بنِ الخَطَّابِ، فنَظَرَ عمرُ في وَصِيَّتِه، فوجَد عليه أربعةَ آلافِ دينارٍ، فباعَ نَخلَه أربعَ سنينَ بأربعةٍ آلافٍ، وقضَى دَينَه، وقيل : إنَّه حمَل نَعْشَه بنفسِه بينَ الأربعةِ …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 4، ص 449، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 4, p. 449, that mentions a testament or parting counsel, what was left behind: estate and inheritance, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 4، ص 449 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen 4, pág. 449, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia, un entierro, tumba o lugar de descanso; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
