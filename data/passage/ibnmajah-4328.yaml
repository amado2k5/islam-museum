label:
  ar: "ابن ماجه 4328 — أعددت لعبادي الصالحين ما لا عين رأت"
  en: "Ibn Majah 4328 — I have prepared for My righteous servants what no eye has seen"
  ur: "ابن ماجہ 4328 — میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا"
text: "يقول الله عز وجل أعددت لعبادي الصالحين ما لا عين رأت ولا أذن سمعت ولا خطر على قلب بشر . قال أبو هريرة ومن بله ما قد أطلعكم الله عليه اقرءوا إن شئتم فلا تعلم نفس ما أخفي لهم من …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4328: أعددت لعبادي الصالحين ما لا عين رأت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4328: I have prepared for My righteous servants what no eye has seen. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4328: میں نے اپنے نیک بندوں کے لیے وہ تیار کیا ہے جو کسی آنکھ نے نہیں دیکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
