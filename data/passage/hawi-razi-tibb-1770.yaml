text: "… من أصطماخيقون وحقن غير مرة بالقنطوريون أشرت عليه بالإدمان على الأدوية المدرة للبول الملطفة وكان رطب المزاج بارده فبرأ لما استعملها مدة. من كتاب الفصد، قال: من كان به نقرس أو وجع في المفاصل ينبغي أن يستفرغوا في أول الربيع …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1770، يذكر الوجع، وأسماء الأمراض، والبرء من العلة، وأعضاء البدن، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1770, that mentions pain, named diseases, recovery from an ailment, the organs of the body, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
