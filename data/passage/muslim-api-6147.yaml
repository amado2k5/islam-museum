text: "وَحَدَّثَنَا يَحْيَى بْنُ حَبِيبٍ الْحَارِثِيُّ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا خَالِدٌ الْحَذَّاءُ، عَنْ عَبْدِ اللَّهِ بْنِ شَقِيقٍ، قَالَ أَنْبَأَنَا أَبُو هُرَيْرَةَ، قَالَ كَانَ مُوسَى رَجُلاً حَيِيًّا - قَالَ - فَكَانَ لاَ يُرَى مُتَجَرِّدًا - قَالَ - فَقَالَ بَنُو إِسْرَائِيلَ إِنَّهُ آدَرُ - قَالَ - فَاغْتَسَلَ عِنْدَ مُوَيْهٍ فَوَضَعَ ثَوْبَهُ عَلَى حَجَرٍ فَانْطَلَقَ الْحَجَرُ يَسْعَى وَاتَّبَعَهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6147، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6147 (The Book of Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 6147، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
