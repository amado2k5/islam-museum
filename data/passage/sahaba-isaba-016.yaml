text: "كان ممن ارتد مع طليحة بن خويلد، وحارب النبي لواء على قومه، وكتب له كتابا ، وشهد بلوائه المسلمين ثم تاب، وجاء إلى اليمامة فحذرهم عاقبة المذكورة صفين مع معاوية، وقتل يوم مرج راهط مع الردة، ودعاهم إلى الإسلام ذكره"
