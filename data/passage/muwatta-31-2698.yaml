label: { ar: "الموطأ 2698 — وهب بن كيسان عن عمر بن أبي سلمة: النبي يقول سم الله وكل مما يليك", en: "Muwatta 2698" }
summary:
  ar: "يروي مالك عن أبي نعيم وهب بن كيسان أنه قال: أُتي رسول الله بطعام، ومعه ربيبه عمر بن أبي سلمة، فقال له رسول الله: سمّ الله وكل مما يليك. ويذكر المحقق أن الأكثر من أصحاب مالك رووه مرسلا، وأن رواية وهب بن كيسان عن عمر بن أبي سلمة موصولة من غير طريق مالك. {cite:muwatta-maruf-1997 p.523}"
