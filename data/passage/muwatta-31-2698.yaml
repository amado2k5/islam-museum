label: { ar: "الموطأ 2698 — وهب بن كيسان عن عمر بن أبي سلمة: النبي يقول سم الله وكل مما يليك", en: "Muwatta 2698", es: "Muwatta 2698", fr: "Muwatta 2698", ur: "موطا 2698", tr: "El-Muvatta 2698 — Vahb ibn Kaysan, Ömer ibn Abi Seleme'den rivayetle: Peygamber şöyle buyurdu: \"Bismillah deyin ve size en yakın olandan yiyin.\"", id: "Al-Muwatta 2698 — Wahb ibn Kaysan berdasarkan riwayat Umar ibn Abi Salamah: Nabi bersabda, “Ucapkan ‘Bismillah’ dan makanlah dari apa yang paling dekat denganmu.”" }
summary:
  ar: "يروي مالك عن أبي نعيم وهب بن كيسان أنه قال: أُتي رسول الله بطعام، ومعه ربيبه عمر بن أبي سلمة، فقال له رسول الله: سمّ الله وكل مما يليك. ويذكر المحقق أن الأكثر من أصحاب مالك رووه مرسلا، وأن رواية وهب بن كيسان عن عمر بن أبي سلمة موصولة من غير طريق مالك. {cite:muwatta-maruf-1997 p.523}"
  tr: "Malik, Ebu Nu'aym Vahb ibn Kaysan'dan rivayetle şöyle buyurmuştur: Allah'ın Resulü'ne yemek getirildi ve yanında üvey oğlu Ömer ibn Ebu Seleme de vardı. Allah'ın Resulü ona şöyle dedi: \"Bismillah de ve sana en yakın olandan ye.\" Araştırmacı, Malik'in arkadaşlarının çoğunun bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak rivayet ettiğini ve Vahb ibn Kaysan'ın Ömer ibn Ebu Seleme'den rivayetinin Malik'inkinden farklı bir zincirle bağlı olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.523}"
  id: "Malik meriwayatkan dari Abu Nu'aym Wahb ibn Kaysan bahwa ia berkata: Makanan dibawa kepada Rasulullah, dan bersamanya ada anak tirinya, Umar ibn Abi Salamah. Rasulullah bersabda kepadanya: \"Ucapkan 'Bismillah' (Dengan nama Allah) dan makanlah dari apa yang paling dekat denganmu.\" Peneliti menyebutkan bahwa sebagian besar sahabat Malik meriwayatkan hadits ini sebagai mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa riwayat Wahb ibn Kaysan dari Umar ibn Abi Salamah terhubung melalui rantai periwayatan yang berbeda dari riwayat Malik. {cite:muwatta-maruf-1997 p.523}"
