text: "كل ابن آدم تأكله الأرض، إلا عجب الذنب. منه خلق، وفيه يركب"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي أخبر أن كل ابن آدم تأكله الأرض إلا عجب الذنب، منه خُلق وفيه يُركب. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (3138)، وسويد، والقعنبي عند أبي داود (4743)، وابن وهب عند الطحاوي في شرح المشكل، وقتيبة عند النسائي (4/111). {cite:muwatta-maruf-1997 p.328}"
