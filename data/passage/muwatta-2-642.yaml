label: { ar: "الموطأ 642 — كل ابن آدم تأكله الأرض إلا عجب الذنب، منه خلق وفيه يركب", en: "Muwatta 642", es: "Muwatta 642", fr: "Muwatta 642", ur: "موطا 642", tr: "El-Muvatta 642 — Âdem oğullarının her biri, kuyruk sokumu hariç, toprak tarafından tüketilir; ondan yaratılmış ve ondan diriltilecektir.", id: "Al-Muwatta 642 — Setiap anak Adam akan ditelan bumi kecuali tulang ekor; dari tulang itulah ia diciptakan dan di tulang itulah ia akan dibangkitkan." }
text: "كل ابن آدم تأكله الأرض، إلا عجب الذنب. منه خلق، وفيه يركب"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي أخبر أن كل ابن آدم تأكله الأرض إلا عجب الذنب، منه خُلق وفيه يُركب. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (3138)، وسويد، والقعنبي عند أبي داود (4743)، وابن وهب عند الطحاوي في شرح المشكل، وقتيبة عند النسائي (4/111). {cite:muwatta-maruf-1997 p.328}"
  id: "Malik meriwayatkannya dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) bersabda bahwa bumi akan menghabiskan seluruh tubuh anak Adam kecuali tulang ekornya, dari mana ia diciptakan dan di mana ia akan dibangkitkan. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Ibn Hibban (3138), Suwayd, al-Qa'nabi dalam Abu Dawud (4743), Ibn Wahb dalam Sharh al-Mushkil karya al-Tahawi, dan Qutaybah dalam al-Nasa'i (4/111). {cite:muwatta-maruf-1997 p.328}"
