label: { ar: "الموطأ 1267 — ابن عمر: كان النبي إذا قفل من غزو أو حج أو عمرة يكبر على كل شرف ثلاثا، ثم يقول لا إله إلا الله وحده", en: "Muwatta 1267", es: "Muwatta 1267", fr: "Muwatta 1267", ur: "موطا 1267", tr: "El-Muvatta 1267 — İbn Ömer: Peygamberimiz bir askeri seferden, Hacdan veya Umreden döndüğünde, yüksek bir yere ulaştığında üç defa \"Allahu Ekber\" der, sonra da \"Allah'tan başka ilah yoktur\" derdi.", id: "Al-Muwatta 1267 — Ibn Umar: Ketika Nabi kembali dari ekspedisi militer, haji, atau umrah, beliau akan mengucapkan \"Allahu Akbar\" tiga kali ketika sampai di tempat yang tinggi, kemudian beliau akan mengucapkan, \"Tidak ada Tuhan selain Allah semata.\"" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله كان إذا قفل من غزو أو حج أو عمرة، يكبر على كل شرف من الأرض ثلاث تكبيرات، ثم يقول لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، آيبون تائبون عابدون ساجدون لربنا حامدون، صدق الله وعده، ونصر عبده، وهزم الأحزاب وحده. {cite:muwatta-maruf-1997 p.562}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü bir seferden, Hac'dan veya Umre'den döndüğünde her yüksek yerde üç defa tekbir getirir, sonra da şöyle derdi: \"Allah'tan başka ilah yoktur, O tektir, ortağı yoktur. Mülk ve övgü O'nundur, her şeye kadirdir. Biz tövbe ederek, ibadet ederek, Rabbimize secde ederek, O'nu överek dönüyoruz. Allah sözünü yerine getirdi, kuluna zafer verdi ve müttefiklerini tek başına mağlup etti.\" {cite:muwatta-maruf-1997 s.562}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa ketika Rasulullah SAW kembali dari ekspedisi militer, haji, atau umrah, beliau mengucapkan takbir tiga kali di setiap tempat yang tinggi, kemudian beliau berkata: “Tidak ada Tuhan selain Allah Yang Maha Esa, Dia tidak mempunyai sekutu. Milik-Nya kekuasaan dan pujian, dan Dia Maha Kuasa atas segala sesuatu. Kami kembali dengan bertaubat, beribadah, bersujud kepada Tuhan kami, memuji-Nya. Allah telah memenuhi janji-Nya, memberikan kemenangan kepada hamba-Nya, dan mengalahkan sekutu-sekutu itu seorang diri.” {cite:muwatta-maruf-1997 p.562}"
