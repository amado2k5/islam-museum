label: { ar: "الموطأ 1267 — ابن عمر: كان النبي إذا قفل من غزو أو حج أو عمرة يكبر على كل شرف ثلاثا، ثم يقول لا إله إلا الله وحده", en: "Muwatta 1267" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله كان إذا قفل من غزو أو حج أو عمرة، يكبر على كل شرف من الأرض ثلاث تكبيرات، ثم يقول لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، آيبون تائبون عابدون ساجدون لربنا حامدون، صدق الله وعده، ونصر عبده، وهزم الأحزاب وحده. {cite:muwatta-maruf-1997 p.562}"
