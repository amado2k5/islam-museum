text: |-
  •صل الا ) .
  •رقو)(
  وقال عزوجل وفى السماء رزقكم وهو انساع فى اللغة كمايقال التمرفى قعر القليب يعنى به سق
  النخل ورجل مر زوق أى مجدود والرازقية نساب كان بيض قال لبيديصف ظروف انهمر
  لها غلل من رازقى وكرسف • بأيمان عجم يتصفون المقاولا
  أى يخدمون الاقيال ⁦(رزدق)⁩ الرزداق لغة فى تع-ريب الرستاق والرزدق السطر
  من النخل والصف من الناس وهو معرّب وأصله بالفارسية رسته قال رؤية ١
  ضوابعانرى بهن الرزدقا.⁦( رستق)⁩ الرستاف فارسى معرب ألحقوه بقرطاس ويقال
  رزداق ورسداف والمع الرساتيق وهى السواد قال ابن ميادة
  هلا اشتريت حفطة بالرستاق * محراء ممادرس ابن مخراق
  شق) الرشق الرى وقد رشقته بالنبل أرشقه رشقاوالرشق بالكسر الاسم وهو الوجه
  من الرمى فاذارمى القوم باججعهم فى جهة راحدة قالواره ينارشقا قال أبوزبيد
  كل يوم ترميه منها برشق • نصيب أوصاف غيربعيد
  ويقال أرشقت اذا أحددت النظر ومنه قول الشاعر • وتزوعنى مقل الصوار المرشق*
  وأرشقت الظبية أى مدت عنها ورجل رشيق أى حسن القداطيفه وقد رئق بالضم رشاقة
  والرشانيق بطن من السودان فق الرفق ضد العنف وقد رقق بديرفق و-كى أبوزيد
  رفقت به وأرفقته بمعنى وكذلك ترفقت به ويقال أيضا أرفقته أى ففعته والرفقسة الهاعة
  ترافقهم فى سفرك والرفقة بالكسر مثله والجمع رفاق تقول منه رافته وتزافقنا فى الغر
  والرفيق المرافق وابمع الرفقاء فاذاتة رقتم ذهب اسم الرفقة ولا يذهب اسم الرفيق وهو أيضا
  واحد وجع مثل الصديق قال اللّٰه تعالى وحسن أولئك رفيقا والرفيق أيضاضة الاخرق
  ورفقت الناقة أرفة ها رفقا وه وأن تشدعضدها تخبل عن أن تسرع وذلك اذا خيف أن
  تنزع إلى وطنهسارذلك الحبل هوالرفاق ومنه قول بشر
  فانى والنكاة وآل لام • كذات الضفن تشى فى الرفاق
  والمرقق والمرفقء وصل الذراع فى العضد وكذلك المرفق والمرفق من الامر وهوما ارتفقت
  به وانتفعت به ومن قرأو يهي لكم من أمركم مرفقاجعله مقل مقطع ومن قرأمرفقاجعله
  اسمامثل مسجدويجوز مر فقا أى رفقامثل مطلع ومطلح ولم ية رأبه وهرافق الدارمصاب
  الماء ونحوها والمرفقة بالكسر المخدّة وقد تمرفق اذا أخذ مرفقة وبات فلان مر تفقا أى
  شكنا على مرفق يده وناقة رفقاء ويحل أرفق بين الرفق وه وانفتال المرفق عن الجنب وماء
  رفق ومرتع رفق أى سهل المطلب والرافة اسم بلد ⁦( رقق)⁩ الرق بالكسر من الملك
  وهو العبودية والرق أيضا الشئ الرقيق ويقال للارض الليغة رق عن الاصمعى والرق بالفتح
  ما يكتب فيه وهوجلد رقيق ومنه قوله تعالى فى رق منشور والرق أيضا العظيم من السلاحف
  قال أبو عبيد وجعه رقوق والرقة كل أرض الى جنب وادينبط عليها إلماء أيام المة
  ثم ينضّب فشكون مكرمة للنبات والرقة اسم بلد والرقاق بالفتح أرض مستوية لينة التراب
  تحته صلابة وقد قصره رؤية بن العجاج فى قول * كأنهاوهى تهمادى بالرقق* والرقق أيضا
  |الضعف ومضه قول الشاعر • لم قلق فى عظمها وهنا ولا رققا* قال الفرّاء بقال فى ماله رقق
