label: { ar: "سنن أبي داود 1264 — الأب والأبوة", en: "Sunan Abi Dawud 1264 — the father and fatherhood", ur: "سنن ابی داؤد 1264 — باپ اور والدیت", es: "Sunan Abi Dawud 1264 — El padre y la paternidad", fr: "Sunan Abi Dawud 1264 — le père et la paternité", tr: "Sunan Abi Davud 1264 — Baba ve Babalık", id: "Sunan Abi Dawud 1264 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا عَبَّاسٌ الْعَنْبَرِيُّ، وَزِيَادُ بْنُ يَحْيَى، قَالاَ حَدَّثَنَا سَهْلُ بْنُ حَمَّادٍ، عَنْ أَبِي مَكِينٍ، حَدَّثَنَا أَبُو الْفَضْلِ، - رَجُلٌ مِنَ الأَنْصَارِ - عَنْ مُسْلِمِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ خَرَجْتُ مَعَ النَّبِيِّ لِصَلاَةِ الصُّبْحِ فَكَانَ لاَ يَمُرُّ بِرَجُلٍ إِلاَّ نَادَاهُ بِالصَّلاَةِ أَوْ حَرَّكَهُ بِرِجْلِهِ. قَالَ زِيَادٌ قَالَ حَدَّثَنَا أَبُو الْفُضَيْلِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1264، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1264 (Prayer (Kitab Al-Salat): Voluntary Prayers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1264، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1264 (Oración (Kitab Al-Salat): Oraciones voluntarias), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1264 (La Prière (Kitab Al-Salat): Prières surérogatoires), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1264 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1264, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
