text: |-
  •⁦(ياب الذون)⁩.
  •كن) •
  ٤٠٢
  سبت اليهم قلت قينى ولا تقل بلقيق والقيشان موضع القيد من وظيفى يدى البعيد قال
  دو الرقة
  دانى له القيد فى ديمومة قذف * قينيه وانحسرت عنه الاناعيم
  يريدجع الاتعام وهى الابل واقتان النبت اقتيانا اذاحسن واقتانت الروضة أخذت
  زخرفها ومنه قيل للماشطة مقينة وقد قيفت العروس تقيينا زيفتها واغماسميت بذلك لانما
  تزين الذساءشبهت بالامة لانها تصلح البيت وتزينه وتقيذت هى أى تزينت والقينة الامة مغنية
  كانت أو غير مغنية والجمع القيسان قال زهير
  ودّ القيان جمال الحى فاحتملوا • الى الظهيرة أمر بينهم إبك
  فال أبوع روكل عبدهو عند العرب قين والامة قينة وبعض الناس بفان القيفة المغنية
  خاصة وليس هوكذلك وقول زهيره على كل قينى" قشيب ومفأم • يعنى رحلاقينه التجار
  وعمله ويقال نسبه الى بن القين
  ل الكاف ي الاصمحى الكين مائنى من الجلد عند ثفة الدلو تم خرز
  تقول منه كبنت الدلو بالفتح أكبنها بالكسراذا كفقت جوانب شفتها و كبنت عن الشئ
  عدلت عنسه وكبفت الشى غيبته وهو مثسل اللمبن وكين فلان سمن والكبنة المنقبض البخيل
  وقال
  يسراذا كان الشتاء وأعحاوا• فى القوم غير كبنة علفوف
  الاموى كين الظبي اذلطأ بالارض واكبات اقبض قال مدرك • باكروافاصك فاكانا!
  ورحل مكبون الاصابع وهو شل الستن والكان داء يأخذ الابل يقال بعبر مكبون
  ⁦(كتن)⁩ الكتان بالفتح مع روف وحذف الاعشى منه الالف الضرورة فقال
  هوالواهب المسمعات الشروب بين الحريروبين السكتن
  كاحذ فها ابن هرمة فى قوله
  بنا أحبرمدساعاد هرئية • هذا العمرككشر ديته عدد
  دينه دأبه والعدد العدادرهواحتساج وجع اللديغ والكنن الدرن والومخ وأثر الدمان
  فى البيت وكتفت بهافل البعير من أكل العشب اذ الزق به أثر خضرته قال ابن .قبل
  والعيرينفخ فى المكتان قد كنت • منه جاذله والعضرس المجر
  التجرجع نجرة وهى القطع منه وقيل النجر الهاعات المتفرقة مفه قطعة هنا وأخرى هنا
  والعضرس شجره نورأحر الى السواد وبروى النجر بفتح الناء وكسر الجيم وهوالمعرض
  وتجرة الوادى وسطه حيث اتسع وانبطح ويقال احتل "مجرته أى وسطه وأعرضه والمكتان
  نبت وهو من خير النبت الواحدة مكانة وكتفت لزحت واتسفت وكل ما اتسمخ فقدكتن
  ويقال حشر الوطب وكنن اذا اتسخ وكثر عليه وسقاء كتن اذا تلزج به الدرن ⁦(كدن)⁩.
  لكدن بالكسر ما تولى به المرأة لنف سها فى المودج من الشياب وابمع كدون والككدن شئ
  من جلوديدق فيه كالهاون والكدنة الشمم والحم يقال للرجل انه ل-ن الكدنة وبعبر
  ذوكدنة ورجل كدن وامرأة كدنة ذات لحم وشحم والكودن البردون يوكف ويشبه به
  لبليد يقال ما أبين الكدانة فيه أى الهجنة والسكديون مثال الفرجون دقاق التراب عليه
  دردالزيت تجلى به الدروع قال النابغة
