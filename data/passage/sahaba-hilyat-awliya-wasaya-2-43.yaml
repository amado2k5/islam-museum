text: "… يوما افترت بطرف نابها، قال ومكثت بعده ستة أشهر حدثنا مدليان ابن أحمد ثنا اسحاق بن إبراهيم أخبرنا عبد الرازق عن معمر عن عبد اللّٰه بن محمد بن عقيل : أن فاطمةا لا حضرتها الوفاة أمرت عليا فوضع لما غسلا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 43، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 43, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
