text: "حَدَّثَنَا بِشْرُ بْنُ مُحَمَّدٍ، قَالَ أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، قَالَ حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي بَكْرِ بْنِ حَزْمٍ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ قَالَتْ دَخَلَتِ امْرَأَةٌ مَعَهَا ابْنَتَانِ لَهَا تَسْأَلُ، فَلَمْ تَجِدْ عِنْدِي شَيْئًا غَيْرَ تَمْرَةٍ فَأَعْطَيْتُهَا إِيَّاهَا، فَقَسَمَتْهَا بَيْنَ ابْنَتَيْهَا وَلَمْ تَأْكُلْ مِنْهَا، ثُمَّ قَامَتْ فَخَرَجَتْ، فَدَخَلَ النَّبِيُّ صلى الله عليه وسلم عَلَيْنَا، فَأَخْبَرْتُهُ فَقَالَ ‏ \"‏ مَنِ ابْتُلِيَ مِنْ هَذِهِ الْبَنَاتِ بِشَىْءٍ كُنَّ لَهُ سِتْرًا مِنَ النَّارِ ‏\"‏‏.‏"
summary:
  ar: "عن عائشة: من ابتلي من هذه البنات بشيء كن له سترا من النار."
  en: "From Aisha: whoever is tried through these daughters and treats them well — they will be a screen for him from the Fire."
  ur: "عائشہ سے: جو شخص ان بیٹیوں کے ذریعے آزمایا جائے اور ان سے اچھا سلوک کرے وہ اس کے لیے جہنم سے حجاب ہوں گی۔"
  es: "De Aisha: quien sea probado por medio de estas hijas y las trate bien, ellas le servirán de escudo contra el Fuego."
  fr: "D'après Aïcha: quiconque est éprouvé par ces filles et les traite bien, elles seront pour lui un écran contre le Feu."
  tr: "Ayşe'nin rivayetine göre: Bu kızlardan herhangi biri kime musibet olarak gelirse, o onu ateşten koruyacaktır."
  id: "Berdasarkan riwayat dari Aisyah: Barangsiapa yang ditimpa salah satu dari putri-putri ini, mereka akan menjadi tameng baginya dari api neraka."
