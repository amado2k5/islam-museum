text: |-
  ٣٧
  والجربيا على فعلياء بالكسر والمسدّ النكباء التى تجرى بين الشمال والدبور وهى ريح تقشع
  السعاب قال ابن أحر
  بهجل من قساذفر انلخزامى ، تهادى الجربياء به الخنينا
  وجراب بالضم اسم ماءبمكة والجربة بالنتح وتشديد الباء العانة من الهيرور بماسموا الاقوياء
  من الناس اذا كانواجاعة.تساوين بربة قال الراجز
  جربة كحمرالابك ، لاضرع فينا ولامذكى
  يقول نحن جماعة متساوون وليس فيناصغير ولام-ن والابك موضع وجربان السيف بااضم
  والتشديد قرايه وجربان القميص أيضالبنته فارسى معرب والاجربان بنوعبس وذييان
  قال عباس بن مرداس
  وفى عضادته المنى بنوأ-د * والابر بان بنوعبس وذبيان
  والجورب معرب والجمع الجوارية والهاه للعجسعة ويقال الجوارب أيضا كما قالوا فى مجع
  الكيلج الكالج وتقول جوربته فتجورب أى ألبسته الجورب فلبسه ⁦( رجب)⁩.
  الجراحب العظام من الابل ⁦(بردب)⁩ الجرديان بالدال غير معجمة فارسى معرب أصله
  كرده بان أى حافظ الرغيف وهو الذى يضع شماله عسلى شىء يكون على الحوان كيلايتنا وله
  غيره وأنشد الفرّاه
  اذا ما كنت فى قوم شهاوى * فلاتجعل شمالك برديانا
  نقول منه جردب فى الطعام وجردم رشب جرشب الرحسل وحرشم اذا اندمل بعد
  المرض والهزال سرب) الجسرب الطويل ( نب طعام جشب ومجنوب أى
  غليظ وخشن ويقال هو الذى لا أدم معه ولوقيل اجشوشبوا كما قالوا اخش وشبوايالحا،
  لم يبعد الا انى لم أسمعه بالجيم والمجشاب الغليظ قال أبوز بيد
  وليسك كشحالطيفاليس محشابا والجشيب من الثياب الغلبظ ( عب جعبته أى
  سرعمه مثل جعفته وربما هالوا جعبيته جعباء قجعى يزيدون فيه الياءكما قالوا
  ملقيته من سلقه والجعبة واحدة جعاب النشاب والجعبوب الرجل القصير الدميم
  (⁦(جاب)⁩. جلب الشى يجلبه ويجلبه جلبا وجلبا" وجلبت الشى الى نفسى واجتلبته بمعف
  والجلوبة ما يجلب للبيع والحليب الذى يجلب من بلدالى غيره والحلبة جليدة تعلو الجرح عند
  لبره تقول منه جاب الجرح مجلب ويجلب وأجلب الجرح مثله والجلية أيضامثل الكلبة
  وهى شدة الزمان يقال أصابتماجلبة الزمان وكلبة الزمان قال أوس بن مغراء التميمى
  لا يسمحون اذا ماجلبة أزمت • وايس جارهم فيها بختار
  وقال المتنخل الهذلى
  قد حال بين تزاقيه ولبته من جلبة الجوع جيازوإرزيز
  والجلبة أيضاجلدة تجعل على القتب والحلب والجلب سحاب رقيق ليس فيه ماء
  قال تأبط شرا
  واست بجلب جاب ريح وقزة • ولابصفاصاد عن الخير معزل
  23
