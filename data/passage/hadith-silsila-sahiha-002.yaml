text: "دفعه إلى هرقل، فقرأه، فإذا. فيه.. ((بسم الله الرحمن الرحيم. من محمد عبدالله ورسوله: إلى هرقل عظيم الروم؛ سلام على من اتبع الهدى، أما بعد: فإني أدعوك بدعاية الإسلام: أسلم تسلم: يؤتك الله أجرك مرتين؛ فإن توليت فإن عليك إثم"
