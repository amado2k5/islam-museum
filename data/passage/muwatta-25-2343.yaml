label: { ar: "الموطأ 2343 — مالك: إذا لم يُسمَّ الموضوع من أول الكتابة أو آخرها", en: "Muwatta 2343", es: "Muwatta 2343", fr: "Muwatta 2343", ur: "موطا 2343", tr: "Al-Muwatta 2343 — Malik: Eğer yazının başında veya sonunda öznenin adı belirtilmemişse", id: "Al-Muwatta 2343 — Malik: Jika subjek tidak disebutkan di awal atau akhir tulisan" }
summary:
  ar: "قال مالك: إذا وضع الرجل عن مكاتبه عند موته ألف درهم من عشرة آلاف، ولم يسمّ أنها من أول الكتابة أو من آخرها، فإنه يُوضع عنه من كل نجم عشره. {cite:muwatta-maruf-1997 p.366} {cite:muwatta-maruf-1997 p.367}"
  tr: "Malik şöyle demiştir: Bir kimse, kölesinin ölümünden sonra, ona olan on bin dirhemlik borcundan bin dirhemlik kısmını, sözleşmenin başından mı yoksa sonundan mı olduğunu belirtmeksizin affederse, her taksitin onda biri affedilir. {cite:muwatta-maruf-1997 s.366} {cite:muwatta-maruf-1997 s.367}"
  id: "Malik berkata: Jika seseorang mengampuni hutang seribu dirham dari sepuluh ribu dirham yang terutang kepada budaknya pada saat kematiannya, tanpa menentukan apakah itu dari awal atau akhir perjanjian, maka sepersepuluh dari setiap angsuran diampuni. {cite:muwatta-maruf-1997 p.366} {cite:muwatta-maruf-1997 p.367}"
