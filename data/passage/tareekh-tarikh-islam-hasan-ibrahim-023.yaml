text: "اللغة في أوائل القرن الرابع، واشتهر برده على ابن الراوندي في كتاب أسماء «الانتصار والرد على ابن الراوندي الملحد» (١). وقال نيبرج في مقدمة الكتاب (ص ٢٠ - ١٩) عن الخياط إنه كان «في غاية الشهرة، بعلمه باختلاف المتكلمين ومذاهبهم"
