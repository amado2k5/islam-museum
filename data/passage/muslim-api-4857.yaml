label: { ar: "صحيح مسلم 4857 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 4857 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 4857 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 4857 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 4857 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنَاهُ مُحَمَّدُ بْنُ نُمَيْرٍ، حَدَّثَنَا أَبِي ح، وَحَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ بِشْرٍ، حَدَّثَنَا عَبْدُ، الرَّزَّاقِ جَمِيعًا عَنْ سُفْيَانَ، بِهَذَا الإِسْنَادِ. مِثْلَهُ وَزَادَ فِي حَدِيثِ عَبْدِ الرَّزَّاقِ وَالشِّكَالُ أَنْ يَكُونَ الْفَرَسُ فِي رِجْلِهِ الْيُمْنَى بَيَاضٌ وَفِي يَدِهِ الْيُسْرَى أَوْ فِي يَدِهِ الْيُمْنَى وَرِجْلِهِ الْيُسْرَى."
summary:
  ar: "حديث في صحيح مسلم، رقم 4857، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4857 (The Book on Government), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 4857، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4857 (El Libro del Gobierno), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih Muslim, n° 4857 (Livre du gouvernement), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
