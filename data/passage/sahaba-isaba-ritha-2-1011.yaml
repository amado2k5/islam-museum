  tr: "\"Al-Isabah fi Tamyiz al-Sahabah\" (Sahabeleri Ayırt Etme) adlı eserin 2. cildinin 1011. sayfasından, vefat etmiş bir kişi için yazılmış ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Al-Isabah fi Tamyiz al-Sahabah\" (Membedakan Para Sahabat), Jilid 2, halaman 1011, berisi elegi dan pujian untuk orang yang telah meninggal; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
