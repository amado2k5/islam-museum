text: "… يبكي الرحمن بن عثمان عن طلحة. وعيناه تذرفان، ولما توفي إبراهيم ابن النَّبي للف قال: ألحق بسلفنا الصالح عثمان بن مظعون، وقالت امرأة فخالفه أبو حنيفة في شيخ ابن المنكدر فإن كان يحفظه ترثيه : فلعل لابن المنكدر فيه شيخين …"
summary:
  ar: "مقطع من الإصابة في تمييز الصحابة، المجلد المصوَّر 2، ص 1011، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Isaba fi Tamyiz al-Sahaba, scan volume 2, p. 1011, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الاصابہ فی تمیز الصحابہ، اسکین جلد 2، ص 1011 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
