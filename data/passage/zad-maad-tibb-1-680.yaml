text: "… من أفعالها، مريح للقوة النفسانية، مكثر من جوهر حاملها، حتى إنه ربما عاد بإرخائه مانعاً من تحلل الأرواح. مغاسد نوم النهار وبخاصة آخره ونوم النهار رديء يُورث الأمراض الرطوبية والنوازلَ، ويُفسد اللون، ويورث الطِّحال، ويُرخي العصب، ويكسل، ويُضعف الشهوة إلَّا …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 680، يذكر المرض والمريض، وأسماء الأمراض، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 680, that mentions illness and the sick, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 680 کا اقتباس جس میں بیماری اور بیمار، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 680, que menciona la enfermedad y a los enfermos, nombra las enfermedades y los órganos del cuerpo; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 680, qui mentionne la maladie et les malades, nomme les maladies, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 680. sayfasından bir alıntı; hastalık ve hasta, hastalıkların isimleri ve vücut organlarından bahsediyor; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid 1 bergambar, halaman 680, yang menyebutkan penyakit dan pasien, nama-nama penyakit, dan organ-organ tubuh; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
