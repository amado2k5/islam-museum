text: "… وَقَدْ كَرِهَ بَعْض�� أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمُ التَّفْرِيقَ بَيْنَ السَّبْىِ فِي الْبَيْعِ وَيُكْرَهُ أَنْ يُفَرَّقَ بَيْنَ الْوَالِدَةِ وَوَلَدِهَا وَبَيْنَ الْوَالِدِ وَالْوَلَدِ وَبَيْنَ الإِخْوَةِ وَالأَخَوَاتِ فِي الْبَيْعِ. وَرَخَّصَ بَعْضُ أَهْلِ الْعِلْمِ فِي التَّفْرِيقِ بَيْنَ الْمُوَلَّدَاتِ الَّذِينَ وُلِدُوا فِي أَرْضِ الإِسْلاَمِ. وَالْقَوْلُ الأَوَّلُ أَصَحُّ. وَرُوِيَ عَنْ إِبْرَاهِيمَ النَّخَعِيِّ أَنَّهُ فَرَّقَ بَيْنَ وَالِدَةٍ وَوَلَدِهَا فِي الْبَيْعِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1284، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1284 (The Book on Business), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1284، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
