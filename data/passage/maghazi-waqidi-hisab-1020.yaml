text: "… الملائكة لتُعاتبنى فى حَسّ ٤ الخيل ومَسْحها . وقال : أَخبرنى خليلى جبريل أَنَّه يُكتَب لى بكلّ جسنة أَوفيتُها إِيّاه حسنة ، وإنَّ ربِّى عزَّ وجلّ يحط. عنَّى بها سيئة . وما من امرىء من المسلمين يَربِط. فَرَساً فى سبيل …"
summary:
  ar: "مقطع من كتاب المغازي للواقدي، ص 1020، يذكر كتابة الحسنات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Waqidi's Kitab al-Maghazi, p. 1020, that speaks of the writing of good deeds, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "کتاب المغازی للواقدی کے صفحہ 1020 کا اقتباس جس میں نیکیوں کا لکھا جانا، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Kitab al-Maghazi de al-Waqidi, pág. 1020, que habla de la escritura de buenas obras, malas obras borradas y pecados perdonados; de la copia extraída, citada en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Kitab al-Maghazi d'al-Waqidi, p. 1020, qui parle de l'écriture des bonnes actions, des mauvaises actions effacées et des péchés pardonnés; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Vakidi'nin El-Magazi adlı eserinin 1020. sayfasından, iyi amellerin yazılması, kötü amellerin silinmesi ve günahların kaldırılmasından bahseden bir pasaj; alıntılanan metin, kaynakların politikasına göre yaklaşık kırk kelimeyle aktarılmıştır."
  id: "Sebuah kutipan dari kitab Al-Waqidi, Al-Maghazi, hlm. 1020, yang menyebutkan tentang mencatat amal kebaikan, menghapus amal buruk, dan menghilangkan dosa; dari salinan yang diambil, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
