text: "… الملائكة لتُعاتبنى فى حَسّ ٤ الخيل ومَسْحها . وقال : أَخبرنى خليلى جبريل أَنَّه يُكتَب لى بكلّ جسنة أَوفيتُها إِيّاه حسنة ، وإنَّ ربِّى عزَّ وجلّ يحط. عنَّى بها سيئة . وما من امرىء من المسلمين يَربِط. فَرَساً فى سبيل …"
summary:
  ar: "مقطع من كتاب المغازي للواقدي، ص 1020، يذكر كتابة الحسنات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Waqidi's Kitab al-Maghazi, p. 1020, that speaks of the writing of good deeds, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "کتاب المغازی للواقدی کے صفحہ 1020 کا اقتباس جس میں نیکیوں کا لکھا جانا، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
