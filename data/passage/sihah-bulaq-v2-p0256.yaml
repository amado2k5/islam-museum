text: |-
  • ⁦(باب الميم)⁩.
  ٢٣١
  اذلا أزال على رسالة امح • نهو تعادره السكماة مكلم
  وعيسى عليه السلام كلة اللّٰه سبحانه لانه لما اتفع به فى الدين كما انتقع بكلامه سمى به كما يقال
  فلان سيف اللّٰه وأسدالله (كلثم الكانوم الكثير لحم الخدّين والوجه والكائمة اجتماع
  لحم الوجبه يقل اهرأة مكلمة أى ذات وجنتن من غير أن تلزمهاجهومة الوجه وأمّ
  كلثوم كنية امر أكم السكتمّ للقميص وابهع أكمام وكمة مثل حبّ وحببة والكمة
  التانسوة المدوّرة لانها تغطى الرأس والسكمة بالكسر وال-كمامة وعاء الطلع وغطاء النور
  والجمع كام وأكة والاكمام قال الشماخ٬ بوائج فى أكما-هالم تفتق• والاكاميم أيضا قال
  ذوالرمة • وانضرجت عنه الاكاميم * وكن الخخلذ فهى مكمومة قال لبيديصف نخيلا
  حلت فنها مور مكموم • وكمّ الفسيل أيضااذا أشفق عليه فسترحتى يقوى قال الهجاج
  بل لوشهدت الناس اذتكموا • بقمة لولم تفرّج غموا
  وتكموا أى أغمى عليهم وغطوا وأكن النزية وكمت أى أخرجت كمامها والكام بالكسر
  والكمامة أيضاما يكم به فم البعبر لتلا بعض تقول منه بعير مكموم أى محجوم وكمت الذئ
  غطيه يقال كمت الحب اذاشددت رأسه قال الاخطل بصف خرا
  كت ثلاثة أحوال بطينتها • حتى اذاهر حت من بعد تهدار
  وأكمت القميص جعات له كمين والكمكام المجتمع الخلو ⁦(كم)⁩ كم اسم ناقص مبهم مبنى
  على السكون وله. وضعان الاستفهام والخبرتقول اذا استهمت كم رجلا عندلتصبت
  ما بعده على التمبيز وتقول اذا أخبرت كم درهم أنفقت تريد التكثير وخفضت ما بعده كما تحخفض
  برب لانه فى التكثير نقيض رب فى التقليل وان شئت نصبت وان جعلمته اسماتامائددت آخره
  وصرفته فقات أكثرت من الكمّ وهى الكعبة ⁦(كوم)⁩ كام القرس أنشاه بكومها كوما
  اذا نزاعليه او كوّمت كومة بالضم اذا يمعت قطعة من تراب ورفعت رأسها وهو فى الكلام
  بمنزة قولك صبرة من طعام والكوما الناقة العظيمة السنام والحكوم القطعة من الابل
  والكيمياء معروف مثل السمياء ⁦( كهم)⁩ سيف كهام أى كليل ولسان كهام أى عى وقرس
  كمام يطيورجل كهام وكهيم أى مسن لاغناء عنده وقوم كهام أيضاويقال أكه-م!
  بصر اذا كلّ ورق
  سل اللام ل م اللشيم الدئئ الأصل الشميح النفس وقدلوم الرجل بالضم
  لؤما على فعل وملامة على مفعلة ولا مة على فعالة بقال منه للرجل باملا مان خلاف قولك
  بامكرمان والملأم والملام على مفعل ومفعال الذى بقوم بعذر اللتام قال ابن دريد ألأم
  الرجل إلا ما اذا صنع مايدءوه الناس عليه لتيما قال والملام الذى بعذر الشام واللؤمة
  بالتهر بك جماعة أداة الفذان وكل ما يخل بد الانسان لحسنه من مضاع البيت ونحوه واللام
  جع لأمة وهى الدرع وتجمع أيضاعلى اوْم مثل نغر على غير قياس كانه بجع لومة واستلاً م
  الرجل أى لس اللامة والملام بالتتديد المدرع ولام اسم رجل وقال
  الى أوس بن حارثة بن لأم • ليقضى ساجتى فين قضاها
  واللؤام القذذ الملتمة وهى التى قلى بطن السذة منهاظهر الاخرى وهوأجودما يكون تقول
