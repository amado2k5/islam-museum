text: "يا أيها الذين آمنوا أنفقوا من طيبات ما كسبتم [267] الآية روى الحاكم والترمذي وابن ماجة وغيرهم عن البراء قال نزلت هذه الآية فينا معشر الأنصار كنا أصحاب نخل وكان الرجل يأتي من نخلة على قدر كثرته وقلته وكان ناس ممن لا يرغب في الخير"
