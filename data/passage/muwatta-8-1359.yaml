label: { ar: "الموطأ 1359 — يحيى بن سعيد: الأمر عندنا فيمن يقول علي مشي إلى بيت الله، إذا عجز ركب ثم عاد فمشى من حيث عجز، وعليه هدي إن لم يجد", en: "Muwatta 1359" }
summary:
  ar: "يقول يحيى سمعت مالكا يقول فالأمر عندنا فيمن يقول علي مشي إلى بيت الله، أنه إذا عجز ركب، ثم عاد فمشى من حيث عجز. فإن كان لا يستطيع المشي فليمش ما قدر عليه، ثم ليركب، وعليه ذبح بدنة أو بقرة أو شاة، إن لم يجد إلا هي. {cite:muwatta-maruf-1997 p.608}"
