label: { ar: "الموطأ 1359 — يحيى بن سعيد: الأمر عندنا فيمن يقول علي مشي إلى بيت الله، إذا عجز ركب ثم عاد فمشى من حيث عجز، وعليه هدي إن لم يجد", en: "Muwatta 1359", es: "Muwatta 1359", fr: "Muwatta 1359", ur: "موطا 1359", tr: "El-Muvatta 1359 — Yahya ibn Said: “Allah’ın Evi’ne yürüyerek gideceğim” diyen kimse hakkında hükmümüz şudur: Eğer bunu yapamıyorsa, binek hayvanıyla gidip geri dönmeli ve gidemediği yerden yürüyerek devam etmelidir. Eğer kurban bulamazsa, kurban kesmelidir.", id: "Al-Muwatta 1359 — Yahya ibn Saeed: Hukum kami mengenai seseorang yang berkata, “Aku akan berjalan kaki ke Baitullah,” adalah jika ia tidak mampu melakukannya, maka ia harus menunggang kuda, kemudian kembali dan berjalan kaki dari tempat ia tidak mampu. Ia wajib mempersembahkan kurban jika ia tidak dapat menemukannya." }
summary:
  ar: "يقول يحيى سمعت مالكا يقول فالأمر عندنا فيمن يقول علي مشي إلى بيت الله، أنه إذا عجز ركب، ثم عاد فمشى من حيث عجز. فإن كان لا يستطيع المشي فليمش ما قدر عليه، ثم ليركب، وعليه ذبح بدنة أو بقرة أو شاة، إن لم يجد إلا هي. {cite:muwatta-maruf-1997 p.608}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: \"Tanrı'nın evine yürüyerek gitmeliyim\" diyen kimse hakkında bizde hüküm şudur: Eğer yürüyemez hale gelirse, binek hayvanı ile gitmeli, sonra geri dönmeli ve yürüyemez hale geldiği yerden itibaren yürümeye devam etmelidir. Eğer yürüyemez hale gelirse, yürüyebildiği kadar yürümeli, sonra binek hayvanı ile gitmeli ve başka bir şey bulamazsa bir deve, bir sığır veya bir koyun kurban etmelidir. {cite:muwatta-maruf-1997 s.608}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Hukum di antara kami mengenai seseorang yang berkata, \"Aku harus berjalan kaki ke Baitullah,\" adalah jika ia menjadi tidak mampu, ia harus menunggang kuda, kemudian kembali dan berjalan kaki dari tempat ia menjadi tidak mampu. Jika ia tidak mampu berjalan kaki, maka ia harus berjalan kaki sejauh yang ia mampu, kemudian menunggang kuda, dan ia harus mengorbankan unta, sapi, atau domba jika ia tidak menemukan yang lain. {cite:muwatta-maruf-1997 p.608}"
