label: { ar: "سنن أبي داود 4778 — الأب والأبوة", en: "Sunan Abi Dawud 4778 — the father and fatherhood", ur: "سنن ابی داؤد 4778 — باپ اور والدیت" }
text: "… ابْنَ مَنْصُورٍ - عَنْ مُحَمَّدِ بْنِ عَجْلاَنَ، عَنْ سُوَيْدِ بْنِ وَهْبٍ، عَنْ رَجُلٍ، مِنْ أَبْنَاءِ أَصْحَابِ النَّبِيِّ عَنْ أَبِيهِ قَالَ - قَالَ رَسُولُ اللَّهِ نَحْوَهُ قَالَ \" مَلأَهُ اللَّهُ أَمْنًا وَإِيمَانًا \". لَمْ يَذْكُرْ قِصَّةَ \" دَعَاهُ اللَّهُ \". زَادَ \" وَمَنْ تَرَكَ لُبْسَ ثَوْبِ جَمَالٍ وَهُوَ يَقْدِرُ عَلَيْهِ \". قَالَ بِشْرٌ أَحْسِبُهُ قَالَ \" …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4778، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4778 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4778، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
