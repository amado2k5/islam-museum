summary:
  ar: "قول لمالك: سمع أهل العلم يقولون لا بأس أن يغسل المحرم رأسه بالغسول بعد أن يرمي جمرة العقبة وقبل أن يحلق رأسه، لأنه إذا رمى جمرة العقبة حل له قتل القمل وحلق الشعر وإلقاء التفث ولبس الثياب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1037). {cite:muwatta-maruf-1997 p.436}"
