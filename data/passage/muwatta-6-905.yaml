label: { ar: "الموطأ 905 — مالك: لا بأس أن يغسل المحرم رأسه بالغسول بعد أن يرمي جمرة العقبة وقبل أن يحلق؛ فإذا رمى جمرة العقبة حل له قتل القمل وحلق الشعر ولبس الثياب", en: "Muwatta 905", es: "Muwatta 905", fr: "Muwatta 905", ur: "موطا 905", tr: "El-Muvatta 905 — Malik: Bir hacının Cemre-i Akabe'ye taş attıktan sonra ve tıraş olmadan önce başını suyla yıkamasında bir sakınca yoktur. Cemre-i Akabe'ye taş attıktan sonra bitleri öldürmesi, saçlarını tıraş etmesi ve elbise giymesi caizdir.", id: "Al-Muwatta 905 — Malik: Tidak ada salahnya seorang jamaah haji membasuh kepalanya dengan air setelah melempar batu di Jamrat al-Aqaba dan sebelum bercukur. Setelah ia melempar batu di Jamrat al-Aqaba, maka diperbolehkan baginya untuk membunuh kutu, bercukur rambut, dan mengenakan pakaian." }
summary:
  ar: "قول لمالك: سمع أهل العلم يقولون لا بأس أن يغسل المحرم رأسه بالغسول بعد أن يرمي جمرة العقبة وقبل أن يحلق رأسه، لأنه إذا رمى جمرة العقبة حل له قتل القمل وحلق الشعر وإلقاء التفث ولبس الثياب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1037). {cite:muwatta-maruf-1997 p.436}"
  tr: "Malik şöyle demiştir: Alimler, hacı adayının Cemretü'l-Akabe'ye taş attıktan sonra ve saçını tıraş etmeden önce başını suyla yıkamasında bir sakınca olmadığını söylemişlerdir; çünkü Cemretü'l-Akabe'ye taş attıktan sonra bitleri öldürmesi, saçını tıraş etmesi, kiri temizlemesi ve elbiselerini giymesi caiz olur. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1037) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.436}"
  id: "Malik berkata: Para ulama mengatakan bahwa tidak ada salahnya seorang jamaah haji membasuh kepalanya dengan air setelah melempar batu di Jamrat al-Aqaba dan sebelum mencukur kepalanya, karena setelah ia melempar batu di Jamrat al-Aqaba, maka ia diperbolehkan untuk membunuh kutu, mencukur kepalanya, membersihkan kotoran, dan mengenakan pakaiannya. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1037). {cite:muwatta-maruf-1997 p.436}"
