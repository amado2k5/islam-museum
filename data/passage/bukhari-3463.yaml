label:
  ar: "البخاري 3463 — بادرني عبدي بنفسه فحرمت عليه الجنة"
  en: "Bukhari 3463 — My servant hastened to Me with his own life"
  ur: "بخاری 3463 — میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی"
text: "كان فيمن كان قبلكم رجل به جرح، فجزع فأخذ سكينا فحز بها يده، فما رقأ الدم حتى مات، قال الله تعالى بادرني عبدي بنفسه، حرمت عليه الجنة ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3463: بادرني عبدي بنفسه فحرمت عليه الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3463: My servant hastened to Me with his own life. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3463: میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
