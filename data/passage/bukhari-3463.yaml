label:
  ar: "البخاري 3463 — بادرني عبدي بنفسه فحرمت عليه الجنة"
  en: "Bukhari 3463 — My servant hastened to Me with his own life"
  ur: "بخاری 3463 — میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی"
  es: "Bujari 3463 — Mi siervo se apresuró a Mí con su propia vida."
  fr: "Bukhari 3463 — Mon serviteur s'est précipité vers Moi, au péril de sa vie."
  tr: "Buhari 3463 — Kulum bunu bana yapmaya acele etti, bu yüzden ona cenneti haram kıldım."
  id: "Bukhari 3463 — Hamba-Ku telah tergesa-gesa melakukan ini kepada-Ku, maka Aku mengharamkan surga baginya."
text: "كان فيمن كان قبلكم رجل به جرح، فجزع فأخذ سكينا فحز بها يده، فما رقأ الدم حتى مات، قال الله تعالى بادرني عبدي بنفسه، حرمت عليه الجنة ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3463: بادرني عبدي بنفسه فحرمت عليه الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3463: My servant hastened to Me with his own life. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3463: میرے بندے نے اپنی جان کے ساتھ مجھ سے جلدی کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 3463: Mi siervo se apresuró a venir a Mí con su propia vida. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 3463: Mon serviteur s’est précipité vers Moi au péril de sa vie. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 3463 numaralı hadis-i kudsi şöyledir: \"Kulum kendi canına son vermeye acele etti, bu yüzden ona cenneti haram kıldım.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve el-Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 3463: “Hamba-Ku telah terburu-buru untuk mengakhiri hidupnya sendiri, maka Aku mengharamkan surga baginya.” Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan versi-versinya dikumpulkan oleh para ulama hadits qudsi dalam enam koleksi hadits kanonik dan al-Muwatta."
