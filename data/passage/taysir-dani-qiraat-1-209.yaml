text: "… الحرميان فبشر عبادى آ ذكر الاختلاف فيها قبل سورة المؤمن قرأ ابن كثير وقالون وحفص وهشام حم، بفتح الحاء فى جميع الحواميم وورش وابو عمروبين بين والباقون بالامالة كلمت ربك قد ذكر نافع وهشام والذين مدعون بالتاء والباقون بالياء ابن …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 1، ص 209، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 1, p. 209, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 1، ص 209 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Dani, al-Taysir fi al-Qira'at al-Sab', volumen 1, pág. 209, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Taysir fi al-Qira'at al-Sab' d'al-Dani, volume 1, page 209, mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dani'nin \"Al-Taysir fi al-Qira'at al-Sab'a\" (Yedi Kıraat'ın Kolaylaştırılması) adlı eserinin 1. cildinin 209. sayfasından, Kur'an kıraatlerine dair bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an kıraatleri, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan) karya Al-Dani, Jilid 1, halaman 209, yang menyebutkan bacaan-bacaan Al-Quran; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
