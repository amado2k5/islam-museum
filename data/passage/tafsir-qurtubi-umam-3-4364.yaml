text: "… زيد؛ وهو يعود سعد بن عبادة في بني الحرث بن الخزرج، وذلك قبل وقعة بدر، حتى مَرّ في مجلس فيه أخلاط من المسلمين والمشركين عبدة الأوثان واليهود، وفيهم عبد اللّٰه بن أُبيّ بن سلول، وفي المجلس عبد اللّٰه بن رَوَاحة، …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 4364، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
