text: |-
  ٢٤٨
  •⁦(فصل الواو)⁩•
  •⁦(وبل)⁩.
  والنهل السرب الاوّل وقد نهل بالسكسر وأنهلقله أنالانّ الابل تسق فى أول الورد فترد الى
  العطن تم تسق الثانية وهى العلل فتردالى المرعى ومنهال اسم رحل ⁦(لهشل)⁩ التهشل
  الذتب والنه شنل الضقر ونهشل اسم رجل قال سيبويه هو يتصرف لانه فعلل واذا كان فى
  الكلام مثل جعفر لم يمكن الحكم بريادة النون وكان لقيط بن زرارة التميمى يكنى أبانهشل
  ( نيل نال خيرا ينال نيلا أى أصاب وأصل نيل ينيل مثل تعب يتعب وأناله غيره والامر
  منه ذل بفتح النون واذا أخيرت عن نفسك كسرته والنيل فيض مصر وناثلة اسم امرأة
  ونائلة متم كانت لقريش
  صل الواد ( أل الموثل المطيأ وكذلك الموألة مثال المهلسكة وقد وأل
  اليه يثل وألا ووؤلا على فعول أى لجأوواءل على فاعل أى طلب التجاة والوألة مثال وعسله
  الدمنة والسرجين يقال اتّ بنى فلان وقودهم الوألة الاصمعى يقال أو ألت الماشية فى
  الكلا على أفعلت أى أثرت فيه بأبو الها وأبعارها قال العجاج• أجن ومصفرالهام موأل
  واستوأات الابل اجتمعت والاول نقيض الآخر وأصله أ وأل على أفعل مهموز الاوسط قلبت
  الهمزة واواوأدغم يدل على ذلك قولهم هذا أول منك والجمع الاوائل والا والى أيضاعلى
  القلب وقال قوم أصلد ووّل على خوعل فقلبت الواوالا ولى همزة وانمالم يجمع عسلى أواول
  لاستثقالهم اجتماع الواوين بينه-ما ألف الهمع وهواذا جعلته صفة لم تصرفه تقول لقيته عاما
  أول واذالم تجعله صفصرفته تقول لقبته عاما أوّلا قال ابن السسكيت ولا تقل عام الأوّل
  وتقول مارأيته مذعام أول ومذعام أول فن رفع الاول جعله صفة لعام كأنه قال أول من
  عامنا ومن نصبه جعله كالظرف كانه قال مذعام قبل عامنا واذاقات ابدأ بهذا أوّل ضممته
  على الغاية صيكولك خطه قبل وان أظهرت المحذوف نصبت فقلت ابد أبه أول فعلك كما
  تقول قبل فعلك وتقول مارأ يتسه هذامس فات لم تره يوما قبل أمس قلت مارأيت-ه مذأوّل من
  أمس فان لم تره مذيومين قبل أمس قات مارا=-ممذ أول من أوّل من أمس ولم تجاوز ذلْ
  وتقول هذا أول بين الأوّلية قال الشاعر
  ماح البلادانا فى أوليقنا • على حسود الاعادى مائح قثم
  وقول ذى الرقة
  وما قحرمن ليست ل أولية • تعدّاذاءد القديم ولاذصكر
  يعنى مقائر آبانه وتقول فى المؤتت هى الاولى والجمع الأول مثل أخرى وأخر وكذلت
  بلهاءة الرجال من حيث التأنيث قال الشاعر * عود على عود لأوام أول * يعنى ناقة
  مسنة على طريق قديم وان شئت قلت الاوّلون وواقل قبيلة وهو وائل بن قاسط بن هنب بن
  أفصى بن دعمىّ ⁦(وبل)⁩ الويلة بالتحريت النقسل والوخامة مثل الابلة وقدوبل المرقع
  بالضم وبلا ووبالافهو وبيسل أى وخيم ويقال أيضا بالشاة وبلدتشديدة أى شهوة للفمل
  وقد استو يلت الغنم واستوملات البلد أى استوخمته وذلت اذالم يوافقك فى بدنك وان كنت
  تحبه والوبيل العصا المفضخمة وقال
  لوآصبح في عني يدى زمامها • وفى كفى الاخرى وبيل تحاذره
  عدك
