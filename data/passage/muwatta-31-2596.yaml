summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عبد الله بن الزبير عن سفيان بن أبي زهير أنه قال: سمعت رسول الله يقول: تُفتح اليمن فيأتي قوم يسيرون، فيتحملون بأهليهم ومن أطاعهم، والمدينة خير لهم لو كانوا يعلمون. وتُفتح الشام، ثم العراق، بمثل ذلك. {cite:muwatta-maruf-1997 p.465}"
