label: { ar: "الموطأ 2596 — سفيان بن أبي زهير: فتح اليمن والشام والعراق وخيرية المدينة لأهلها", en: "Muwatta 2596", es: "Muwatta 2596", fr: "Muwatta 2596", ur: "موطا 2596", tr: "El-Muvatta 2596 — Sufyan ibn Abi Zuhair: Yemen, Suriye ve Irak'ın Fethi ve Medine'nin Halkı İçin Faydaları", id: "Al-Muwatta 2596 — Sufyan ibn Abi Zuhair: Penaklukan Yaman, Suriah, dan Irak, dan kebaikan Madinah bagi penduduknya" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عبد الله بن الزبير عن سفيان بن أبي زهير أنه قال: سمعت رسول الله يقول: تُفتح اليمن فيأتي قوم يسيرون، فيتحملون بأهليهم ومن أطاعهم، والمدينة خير لهم لو كانوا يعلمون. وتُفتح الشام، ثم العراق، بمثل ذلك. {cite:muwatta-maruf-1997 p.465}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından, o da Abdullah ibn el-Zübeyr'den, o da Sufyan ibn Ebu Zuhayr'dan rivayet ederek şöyle buyurmuştur: \"Allah Resulü'nün şöyle dediğini işittim: Yemen fethedilecek ve bir kavim gelecek, ailelerini ve kendilerine itaat edenleri de yanlarına alacaklar. Eğer bilselerdi Medine onlar için daha hayırlı olurdu. Suriye de fethedilecek, sonra da Irak aynı şekilde.\" {cite:muwatta-maruf-1997 s.465}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Abdullah ibn al-Zubayr, dari Sufyan ibn Abi Zuhayr, yang berkata: Aku mendengar Rasulullah SAW bersabda: Yaman akan ditaklukkan, dan suatu kaum akan datang berziarah, membawa keluarga mereka dan orang-orang yang taat kepada mereka. Madinah akan lebih baik bagi mereka jika mereka mengetahuinya. Dan Suriah akan ditaklukkan, kemudian Irak, dengan cara yang sama. {cite:muwatta-maruf-1997 p.465}"
