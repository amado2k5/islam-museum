label: { ar: "الموطأ 1274 — محمد بن عمران الأنصاري عن أبيه: ابن عمر قال إذا كنت بين الأخشبين من منى فإن هناك واديا به سرحة سر تحتها سبعون نبيا", en: "Muwatta 1274" }
summary:
  ar: "يروي مالك عن محمد بن عمرو بن حلحلة الديلي عن محمد بن عمران الأنصاري عن أبيه أن عبد الله بن عمر عدل إليه وهو نازل تحت سرحة بطريق مكة، فسأله عن سبب نزوله تحتها، فقال أراد ظلها، فقال ابن عمر إن رسول الله قال إذا كنت بين الأخشبين من منى، ونفخ بيده نحو المشرق، فإن هناك واديا يقال له السرر، به سرحة سر تحتها سبعون نبيا. ويذكر المحقق أن إسناد الحديث ضعيف، لجهالة محمد بن عمران وأبيه. {cite:muwatta-maruf-1997 p.566}"
