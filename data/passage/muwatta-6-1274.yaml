label: { ar: "الموطأ 1274 — محمد بن عمران الأنصاري عن أبيه: ابن عمر قال إذا كنت بين الأخشبين من منى فإن هناك واديا به سرحة سر تحتها سبعون نبيا", en: "Muwatta 1274", es: "Muwatta 1274", fr: "Muwatta 1274", ur: "موطا 1274", tr: "El-Muvatta 1274 — Muhammed ibn İmran el-Ensari, babasının rivayetine göre: İbn Ömer dedi ki: Mina'nın iki dağı arasında olursanız, orada yetmiş peygamberin altından geçtiği bir ağacın bulunduğu bir vadi vardır.", id: "Al-Muwatta 1274 — Muhammad ibn Imran al-Ansari, berdasarkan riwayat ayahnya: Ibn Umar berkata: Jika kalian berada di antara dua gunung Mina, di sana terdapat sebuah lembah dengan pohon yang di bawahnya pernah dilalui oleh tujuh puluh nabi." }
summary:
  ar: "يروي مالك عن محمد بن عمرو بن حلحلة الديلي عن محمد بن عمران الأنصاري عن أبيه أن عبد الله بن عمر عدل إليه وهو نازل تحت سرحة بطريق مكة، فسأله عن سبب نزوله تحتها، فقال أراد ظلها، فقال ابن عمر إن رسول الله قال إذا كنت بين الأخشبين من منى، ونفخ بيده نحو المشرق، فإن هناك واديا يقال له السرر، به سرحة سر تحتها سبعون نبيا. ويذكر المحقق أن إسناد الحديث ضعيف، لجهالة محمد بن عمران وأبيه. {cite:muwatta-maruf-1997 p.566}"
  tr: "Malik, Muhammed ibn Amr ibn Halhala el-Dili'den, o da Muhammed ibn İmran el-Ensari'den, o da babasından rivayet ederek, Abdullah ibn Ömer'in Mekke yolunda bir ağacın altında dinlenirken kendisine yaklaştığını ve neden orada dinlendiğini sorduğunu, onun da gölge istediğini söylediğini aktarır. İbn Ömer şöyle dedi: \"Allah'ın Resulü, 'Mina'nın iki dağı arasında olduğunuzda' dedi ve elini doğuya doğru üfledi, 'orada Surre denilen bir vadi vardır, orada yetmiş peygamberin altında dinlendiği bir ağaç vardır.'\" Araştırmacı, bu hadisin rivayet zincirinin, Muhammed ibn İmran ve babasının bilinmeyen statüsü nedeniyle zayıf olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.566}"
  id: "Malik meriwayatkan dari Muhammad ibn Amr ibn Halhala al-Dili, dari Muhammad ibn Imran al-Ansari, dari ayahnya, bahwa Abdullah ibn Umar mendatanginya ketika ia sedang beristirahat di bawah pohon di jalan menuju Mekah. Abdullah bertanya mengapa ia beristirahat di bawah pohon itu, dan ia menjawab bahwa ia ingin berteduh. Ibn Umar berkata, “Rasulullah SAW bersabda, ‘Ketika kamu berada di antara dua gunung Mina,’ dan beliau meniupkan tangannya ke arah timur, ‘di sana terdapat sebuah lembah yang disebut al-Surrah, di mana terdapat sebuah pohon tempat tujuh puluh nabi beristirahat.’” Peneliti menyebutkan bahwa sanad hadits ini lemah karena status Muhammad ibn Imran dan ayahnya tidak diketahui. {cite:muwatta-maruf-1997 p.566}"
