label: { ar: "الموطأ 1775 — ابن شهاب عن عروة: أبو حذيفة بن عتبة تبنى سالما فزوجه بنت أخيه، فلما نزلت آية الأحزاب ردوا الأدعياء إلى آبائهم، فجاءت سهلة بنت سهيل تشكو فأمرها النبي أن ترضعه خمس رضعات", en: "Muwatta 1775" }
summary:
  ar: "يروي مالك عن ابن شهاب أنه سئل عن رضاعة الكبير، فقال: أخبرني عروة بن الزبير أن أبا حذيفة بن عتبة بن ربيعة، وكان من أصحاب رسول الله وقد شهد بدرا، كان تبنى سالما، الذي يقال له سالم مولى أبي حذيفة، كما تبنى رسول الله زيد بن حارثة، فأنكح أبو حذيفة سالما، وهو يرى أنه ابنه، بنت أخيه فاطمة بنت الوليد بن عتبة بن ربيعة، وهي من المهاجرات الأول. فلما أنزل الله في كتابه في شأن زيد بن حارثة ما أنزل، رد كل واحد من أولئك إلى أبيه، ومن لم يعلم أبوه رد إلى مولاه. فجاءت سهلة بنت سهيل، امرأة أبي حذيفة، إلى رسول الله، فقالت: كنا نرى سالما ولدا، وكان يدخل علي، وأنا فضل، وليس لنا إلا بيت واحد، فماذا ترى في شأنه؟ فقال لها رسول الله: أرضعيه خمس رضعات فيحرم بلبنها. فأخذت بذلك عائشة أم المؤمنين فيمن كانت تحب أن يدخل عليها من الرجال، وأبى سائر أزواج النبي أن يدخل عليهن بتلك الرضاعة أحد، وقلن: لا، والله ما نرى الذي أمر به رسول الله سهلة بنت سهيل إلا رخصة من رسول الله في رضاعة سالم وحده. {cite:muwatta-maruf-1997 p.123} {cite:muwatta-maruf-1997 p.124}"
