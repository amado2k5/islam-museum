label: { ar: "الموطأ 1775 — ابن شهاب عن عروة: أبو حذيفة بن عتبة تبنى سالما فزوجه بنت أخيه، فلما نزلت آية الأحزاب ردوا الأدعياء إلى آبائهم، فجاءت سهلة بنت سهيل تشكو فأمرها النبي أن ترضعه خمس رضعات", en: "Muwatta 1775", es: "Muwatta 1775", fr: "Muwatta 1775", ur: "موطا 1775", tr: "El-Muvatta 1775 — İbn Şihab, Urve'den rivayetle: Ebu Huzeyfe ibn Utbe, Salim'i evlat edindi ve onu yeğeniyle evlendirdi. Ahzab suresi nazil olunca, evlat edindikleri çocukları babalarına geri verdiler. Sahlah bint Suhayl şikayette bulunarak geldi, bunun üzerine Peygamber ona beş defa emzirmesini emretti.", id: "Al-Muwatta 1775 — Ibn Shihab berdasarkan riwayat Urwah: Abu Hudhayfah ibn Utbah mengadopsi Salim dan menikahkannya dengan keponakannya. Ketika ayat Al-Ahzab diturunkan, mereka mengembalikan anak-anak angkat itu kepada ayah mereka. Sahlah binti Suhayl datang mengadu, lalu Nabi memerintahkannya untuk menyusui Salim lima kali." }
summary:
  ar: "يروي مالك عن ابن شهاب أنه سئل عن رضاعة الكبير، فقال: أخبرني عروة بن الزبير أن أبا حذيفة بن عتبة بن ربيعة، وكان من أصحاب رسول الله وقد شهد بدرا، كان تبنى سالما، الذي يقال له سالم مولى أبي حذيفة، كما تبنى رسول الله زيد بن حارثة، فأنكح أبو حذيفة سالما، وهو يرى أنه ابنه، بنت أخيه فاطمة بنت الوليد بن عتبة بن ربيعة، وهي من المهاجرات الأول. فلما أنزل الله في كتابه في شأن زيد بن حارثة ما أنزل، رد كل واحد من أولئك إلى أبيه، ومن لم يعلم أبوه رد إلى مولاه. فجاءت سهلة بنت سهيل، امرأة أبي حذيفة، إلى رسول الله، فقالت: كنا نرى سالما ولدا، وكان يدخل علي، وأنا فضل، وليس لنا إلا بيت واحد، فماذا ترى في شأنه؟ فقال لها رسول الله: أرضعيه خمس رضعات فيحرم بلبنها. فأخذت بذلك عائشة أم المؤمنين فيمن كانت تحب أن يدخل عليها من الرجال، وأبى سائر أزواج النبي أن يدخل عليهن بتلك الرضاعة أحد، وقلن: لا، والله ما نرى الذي أمر به رسول الله سهلة بنت سهيل إلا رخصة من رسول الله في رضاعة سالم وحده. {cite:muwatta-maruf-1997 p.123} {cite:muwatta-maruf-1997 p.124}"
  tr: "Malik, İbn Şihab'dan rivayetle, kendisine yetişkin birini emzirme hakkında soru sorulduğunu ve şöyle dediğini aktarır: Urve ibn el-Zübeyr bana, Resulullah'ın sahabelerinden ve Bedir Muharebesi'ne katılmış olan Ebu Hudeyfe ibn Utbe ibn Rabi'ah'ın, Resulullah'ın Zeyd ibn Harise'yi evlat edinmesi gibi, Ebu Hudeyfe'nin azatlı kölesi Salim'i evlat edindiğini söyledi. Ebu Hudeyfe daha sonra Salim'i, oğlu olduğuna inanarak, ilk hicret edenler arasında bulunan yeğeni Fatıma bint el-Velid ibn Utbe ibn Rabi'ah ile evlendirdi. Allah, Kitabında Zeyd ibn Harise hakkında vahyettiği şeyi vahyettiğinde, bunların her birini öz babalarına iade etti ve babası bilinmeyenler de azatlı kölelerine iade edildi. Ebu Hudeyfe'nin karısı Sahle bint Suhayl, Allah Resulü'ne gelerek şöyle dedi: \"Salim'i oğlumuz gibi görürdük ve ben yakınlık halindeyken o bana girerdi. Tek bir evimiz vardı. Bu konuda ne düşünüyorsunuz?\" Allah Resulü ona şöyle buyurdu: \"Onu beş defa emzir ki, sütüyle sana haram olsun.\" Böylece Müminlerin Annesi Aişe, kendisine girmesini istediği erkekler konusunda bu uygulamayı benimsedi. Peygamberin diğer eşleri ise bu emzirme nedeniyle kimsenin kendilerine girmesine izin vermeyi reddederek şöyle dediler: \"Hayır, Allah'a yemin olsun ki, Allah Resulü'nün Sahle bint Suhayl'a emrettiği şeyi, Salim'in emzirilmesiyle ilgili Allah Resulü'nden gelen bir izinden başka bir şey olarak görmüyoruz.\" {cite:muwatta-maruf-1997 s.123} {cite:muwatta-maruf-1997 s.124}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia ditanya tentang menyusui orang dewasa, dan ia berkata: Urwah ibn al-Zubayr memberitahuku bahwa Abu Hudhayfah ibn Utbah ibn Rabi'ah, yang merupakan salah satu Sahabat Rasulullah dan telah ikut serta dalam Perang Badar, telah mengadopsi Salim, yang disebut Salim, budak yang dibebaskan oleh Abu Hudhayfah, sebagaimana Rasulullah telah mengadopsi Zayd ibn Harithah. Abu Hudhayfah kemudian menikahkan Salim, karena percaya bahwa ia adalah anaknya, dengan keponakannya, Fatimah bint al-Walid ibn Utbah ibn Rabi'ah, yang termasuk di antara para emigran pertama. Ketika Allah menurunkan dalam Kitab-Nya apa yang Dia turunkan tentang Zayd ibn Harithah, Dia mengembalikan masing-masing dari mereka kepada ayah biologisnya, dan siapa pun yang ayahnya tidak diketahui dikembalikan kepada budak yang dibebaskannya. Sahlah binti Suhayl, istri Abu Hudhayfah, datang kepada Rasulullah dan berkata: Kami biasa menganggap Salim sebagai anak kami, dan dia akan masuk ke dalam diriku ketika aku sedang dalam keadaan sedarah, dan kami hanya memiliki satu rumah. Apa pendapatmu tentang masalah ini? Rasulullah berkata kepadanya: Susuilah dia lima kali, sehingga dia akan menjadi haram bagimu melalui ASI-nya. Maka Aisyah, Ummul Mukminin, mengadopsi praktik ini mengenai laki-laki yang ingin dia masuki, sementara istri-istri Nabi lainnya menolak untuk mengizinkan siapa pun masuk ke dalam diri mereka berdasarkan pemberian ASI tersebut, dengan mengatakan: “Tidak, demi Allah, kami tidak melihat apa yang diperintahkan Rasulullah kepada Sahlah binti Suhayl sebagai sesuatu selain dispensasi dari Rasulullah mengenai pemberian ASI kepada Salim saja.” {cite:muwatta-maruf-1997 p.123} {cite:muwatta-maruf-1997 p.124}"
