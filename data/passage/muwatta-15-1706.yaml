label: { ar: "الموطأ 1706 — مالك: الأمر عندنا في المطلقة التي ترفعها حيضتها حين يطلقها زوجها أنها تنتظر تسعة أشهر، فإن لم تحض فيها اعتدت ثلاثة أشهر، فإن حاضت قبل تمام الثلاثة استقبلت الحيض", en: "Muwatta 1706", es: "Muwatta 1706", fr: "Muwatta 1706", ur: "موطا 1706", tr: "El-Muvatta 1706 — Malik: Boşandığı zaman adet kanaması kesilen bir kadın hakkında hükmümüz şudur: Dokuz ay bekler. Bu süre içinde adet görmezse, üç ay daha bekler. Üç ay dolmadan adet görürse, adet kanaması yeniden başlar.", id: "Al-Muwatta 1706 — Malik: Hukum kami mengenai wanita yang bercerai yang haidnya berhenti ketika suaminya menceraikannya adalah dia menunggu selama sembilan bulan. Jika dia tidak haid selama waktu itu, dia menjalani masa iddah selama tiga bulan. Jika dia haid sebelum tiga bulan itu genap, maka dia kembali haid." }
summary:
  ar: "يقول مالك الأمر عندنا في المطلقة التي ترفعها حيضتها حين يطلقها زوجها، أنها تنتظر تسعة أشهر، فإن لم تحض فيها اعتدت ثلاثة أشهر، فإن حاضت قبل أن تستكمل الأشهر الثلاثة استقبلت الحيض، فإن مرت بها تسعة أشهر قبل أن تحيض اعتدت ثلاثة أشهر، فإن حاضت الثالثة كانت قد استكملت عدة الحيض، فإن لم تحض استقبلت ثلاثة أشهر، ثم حلت، ولزوجها عليها الرجعة قبل أن تحل، إلا أن يكون قد بت طلاقها. {cite:muwatta-maruf-1997 p.96}"
  tr: "Malik el-Amr, bizim düşünce ekolümüzde, kocası tarafından boşandıktan sonra adet kanaması kesilen bir kadın hakkında şöyle der: Dokuz ay bekler. Bu süre içinde adet görmezse, üç aylık bir bekleme süresi geçirir. Üç ay dolmadan adet görürse, adet görmeye devam eder. Dokuz ay geçmesine rağmen adet görmezse, üç aylık bir bekleme süresi geçirir. Üçüncü kez adet görürse, bekleme süresini tamamlamış olur. Adet görmezse, üç aylık bir bekleme süresi geçirir ve ardından yeniden evlenmekte serbesttir. Kocası, boşanmayı kesinleştirmemişse, yeniden evlenmekte serbest olmadan önce onu geri alma hakkına sahiptir. {cite:muwatta-maruf-1997 s.96}"
  id: "Malik al-Amr menyatakan dalam mazhab kita mengenai wanita yang bercerai dan mengalami henti haid setelah suaminya menceraikannya, bahwa ia harus menunggu selama sembilan bulan. Jika ia tidak haid selama waktu tersebut, ia menjalani masa iddah tiga bulan. Jika ia haid sebelum tiga bulan tersebut, ia kembali haid. Jika sembilan bulan berlalu tanpa haid, ia menjalani masa iddah tiga bulan. Jika ia haid untuk ketiga kalinya, ia telah menyelesaikan masa iddah. Jika ia tidak haid, ia menjalani masa iddah tiga bulan, kemudian ia bebas untuk menikah lagi. Suaminya berhak untuk mengambilnya kembali sebelum ia bebas untuk menikah lagi, kecuali jika ia telah menyelesaikan perceraian. {cite:muwatta-maruf-1997 p.96}"
