label: { ar: "الموطأ 1706 — مالك: الأمر عندنا في المطلقة التي ترفعها حيضتها حين يطلقها زوجها أنها تنتظر تسعة أشهر، فإن لم تحض فيها اعتدت ثلاثة أشهر، فإن حاضت قبل تمام الثلاثة استقبلت الحيض", en: "Muwatta 1706" }
summary:
  ar: "يقول مالك الأمر عندنا في المطلقة التي ترفعها حيضتها حين يطلقها زوجها، أنها تنتظر تسعة أشهر، فإن لم تحض فيها اعتدت ثلاثة أشهر، فإن حاضت قبل أن تستكمل الأشهر الثلاثة استقبلت الحيض، فإن مرت بها تسعة أشهر قبل أن تحيض اعتدت ثلاثة أشهر، فإن حاضت الثالثة كانت قد استكملت عدة الحيض، فإن لم تحض استقبلت ثلاثة أشهر، ثم حلت، ولزوجها عليها الرجعة قبل أن تحل، إلا أن يكون قد بت طلاقها. {cite:muwatta-maruf-1997 p.96}"
