text: "… بن محمد، قال وكان من رجال قريش جلدا وحمالا وشعراً. وقال الزبير حدثنى محمد بن عبد العزيز العمرى المُجَيَّر ى قال جئت سعد بن سليمان ببغداد أعوده فى مرضه الذى مات فيه، ومعه ولى له يقال له داهر فقال لى …"
