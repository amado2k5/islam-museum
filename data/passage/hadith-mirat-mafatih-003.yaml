text: "ين المدينة نحو أربعين ميلا، وفي ((صحيح مسلم»: ستة وثلاثون، وفي كتاب ابن أبي شيبة: ثلاثون ميلا، زاد في رواية أحمد وأبي داود: فسلم عليهم. وكان ذلك اللقاء كما قال ابن حبان حين رجوعه من مكة إلى المدينة، ففي رواية"
