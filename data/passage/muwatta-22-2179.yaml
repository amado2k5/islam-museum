label: { ar: "الموطأ 2179 — يحيى عن مالك: ليس على هذا العمل عندنا في تضعيف القيمة، ولكن مضى أمر الناس عندنا على أن الرجل إنما يغرم قيمة البعير أو الدابة يوم يأخذها", en: "Muwatta 2179", es: "Muwatta 2179", fr: "Muwatta 2179", ur: "موطا 2179", tr: "El-Muvatta 2179 — Yahya, Malik'ten rivayetle: Değeri ikiye katlama konusunda bizde böyle bir uygulama yoktur; fakat bizim halkımızdaki adet şudur ki, bir kişi devenin veya hayvanın değerini ancak onu aldığı gün öder.", id: "Al-Muwatta 2179 — Yahya berdasarkan riwayat Malik: Ini bukanlah kebiasaan yang kami anut mengenai penggandaan nilai, tetapi kebiasaan di kalangan umat kami adalah bahwa seseorang hanya membayar nilai unta atau hewan tersebut pada hari ia mengambilnya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: وليس على هذا العمل عندنا في تضعيف القيمة، ولكن مضى أمر الناس عندنا على أنه إنما يغرم الرجل قيمة البعير أو الدابة يوم يأخذها. {cite:muwatta-maruf-1997 p.294} {cite:muwatta-maruf-1997 p.295}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Değeri ikiye katlama uygulaması bizim geleneklerimizde yoktur; halkımız arasında yerleşik uygulama, bir kişinin deve veya hayvanın değerini ancak onu teslim aldığı gün ödemesidir. {cite:muwatta-maruf-1997 s.294} {cite:muwatta-maruf-1997 s.295}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Praktik menggandakan nilai ini tidak diikuti dalam adat istiadat kami, tetapi praktik yang berlaku di kalangan kami adalah bahwa seseorang hanya membayar nilai unta atau hewan pada hari ia memilikinya. {cite:muwatta-maruf-1997 p.294} {cite:muwatta-maruf-1997 p.295}"
