text: "… حَنَقاً عليهم، قال : فاقتتلوا، فتزعم الأنصار أنهم كانوا يقاتلونه بالنهار وَيَقْرُونَهُ بالليل، فيعجبه ذلك منهم، ويقول : واللهِ إِنَّ قومنا لكرام. فبينا تُبَّعٌ على ذلك من قتالهم، إِذْ جاءه حَبْرَانٍ من أحبار اليهود من بني قريظة - وقريظة والنضير …"
