label: { ar: "سنن أبي داود 2153 — الأب والأبوة", en: "Sunan Abi Dawud 2153 — the father and fatherhood", ur: "سنن ابی داؤد 2153 — باپ اور والدیت" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ قَالَ \" لِكُلِّ ابْنِ آدَمَ حَظُّهُ مِنَ الزِّنَا \". بِهَذِهِ الْقِصَّةِ قَالَ \" وَالْيَدَانِ تَزْنِيَانِ فَزِنَاهُمَا الْبَطْشُ وَالرِّجْلاَنِ تَزْنِيَانِ فَزِنَاهُمَا الْمَشْىُ وَالْفَمُ يَزْنِي فَزِنَاهُ الْقُبَلُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2153، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2153 (Marriage (Kitab Al-Nikah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2153، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
