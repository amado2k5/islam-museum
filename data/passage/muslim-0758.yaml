ref: "758"
label:
  ar: "مسلم 758 — ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له"
  en: "Muslim 758 — Our Lord descends in the last third of the night: who will call on Me, that I may answer"
  ur: "مسلم 758 — ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں"
  es: "Muslim 758 — Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda?"
  fr: "Muslim 758 — Notre Seigneur descend dans le dernier tiers de la nuit: qui M’invoquera afin que Je réponde ?"
  tr: "Müslim 758 — Rabbimiz gecenin son üçte birinde iner: “Kim bana dua ederse, ona icabet edeyim?”"
  id: "Muslim 758 — Tuhan kita turun pada sepertiga malam terakhir: “Siapakah yang memohon kepada-Ku, maka Aku akan mengabulkannya?”"
text: "ينزل ربنا تبارك وتعالى كل ليلة إلى السماء الدنيا حين يبقى ثلث الليل الآخر فيقول من يدعوني فأستجيب له ومن يسألني فأعطيه ومن يستغفرني فأغفر له ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 758: ينزل ربنا في الثلث الأخير: من يدعوني فأستجيب له. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 758: Our Lord descends in the last third of the night: who will call on Me, that I may answer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 758: ہمارا رب رات کے آخری تہائی میں اترتا ہے: کون مجھے پکارے کہ میں قبول کروں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 758: Nuestro Señor desciende en el último tercio de la noche: ¿quién me invocará para que yo le responda? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 758: Notre Seigneur descend au cours du dernier tiers de la nuit: qui M’invoquera afin que Je réponde ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Müslim'de 758 numaralı hadis-i kudsi şöyledir: Rabbimiz gecenin son üçte birinde iner ve şöyle buyurur: \"Kim bana dua edecek de icabet edeyim?\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi âlimleri tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, nomor 758: Tuhan kita turun pada sepertiga malam terakhir, firman-Nya: “Siapa yang akan memohon kepada-Ku sehingga Aku dapat mengabulkannya?” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh para ulama hadits qudsi dalam enam kumpulan hadits kanonik dan dalam Al-Muwatta."
