summary:
  ar: "يروي مالك عن زيد بن أسلم أن عطاء بن يسار أخبره أن رسول الله كان في المسجد، فدخل رجل ثائر الرأس واللحية، فأشار إليه رسول الله أن اخرج، كأنه يعني إصلاح شعر رأسه ولحيته، ففعل الرجل ثم رجع، فقال رسول الله: ألا يكون هذا خيرا من أن يأتي أحدكم ثائر الرأس كأنه شيطان؟ {cite:muwatta-maruf-1997 p.538}"
