label: { ar: "سنن النسائي 3381 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan al-Nasa'i 3381 — mentions of non-Muslim nations, religions and peoples", ur: "سنن نسائی 3381 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan al-Nasa'i 3381 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ نَصْرٍ، قَالَ حَدَّثَنَا أَيُّوبُ بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنِي أَبُو بَكْرِ بْنُ أَبِي أُوَيْسٍ، عَنْ سُلَيْمَانَ بْنِ بِلاَلٍ، عَنْ يَحْيَى، عَنْ حُمَيْدٍ، أَنَّهُ سَمِعَ أَنَسًا، يَقُولُ إِنَّ رَسُولَ اللَّهِ أَقَامَ عَلَى صَفِيَّةَ بِنْتِ حُيَىِّ بْنِ أَخْطَبَ بِطَرِيقِ خَيْبَرَ ثَلاَثَةَ أَيَّامٍ حِينَ عَرَّسَ بِهَا ثُمَّ كَانَتْ فِيمَنْ ضُرِبَ عَلَيْهَا الْحِجَابُ."
summary:
  ar: "حديث في سنن النسائي، رقم 3381، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3381 (The Book of Marriage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 3381، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan al-Nasa'i, n.º 3381 (El Libro del Matrimonio), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
