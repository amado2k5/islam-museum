label: { ar: "الموطأ 839 — ابن شهاب: ابن عباس وأبو هريرة اختلفا في قضاء رمضان: أحدهما يفرق والآخر لا يفرق، ولا أدري أيهما قال ماذا", en: "Muwatta 839", es: "Muwatta 839", fr: "Muwatta 839", ur: "موطا 839", tr: "El-Muvatta 839 — İbn Şihab: İbn Abbas ve Ebu Hurayra, Ramazan'da kaçırılan günlerin kaza edilmesi konusunda farklı görüşteydiler: Biri, bu günlerin ayrı olarak kaza edilmesi gerektiğini söylerken, diğeri edilmemesi gerektiğini söyledi. Hangisinin ne dediğini bilmiyorum." }
summary:
  ar: "يرويه مالك عن ابن شهاب أن عبد الله بن عباس وأبا هريرة اختلفا في قضاء رمضان، فقال أحدهما: يُفرّق بينه، وقال الآخر: لا يُفرّق بينه، ولا يدري ابن شهاب أيهما قال هذا وأيهما قال ذاك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (818) والشيباني (362). {cite:muwatta-maruf-1997 p.408}"
  tr: "Malik, İbn Şihab'dan rivayetle Abdullah ibn Abbas ve Ebu Hurayra'nın Ramazan oruçlarının kaza edilmesi konusunda farklı görüşte olduklarını aktarır. Onlardan biri, oruçların ayrı ayrı kaza edilmesi gerektiğini söylerken, diğeri ayrı ayrı kaza edilmemesi gerektiğini söylemiştir. İbn Şihab hangisinin hangisini söylediğini bilmemektedir. Araştırmacı, Ebu Mus'ab (818) ve el-Şeybani'nin (362) bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.408}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa Abdullah ibn Abbas dan Abu Hurayrah berbeda pendapat mengenai penggantian puasa Ramadan yang terlewat. Salah seorang dari mereka berkata: Puasa Ramadan harus diganti secara terpisah, sedangkan yang lain berkata: Puasa Ramadan tidak boleh diganti secara terpisah. Ibnu Shihab tidak mengetahui siapa yang mengatakan mana. Peneliti menyebutkan bahwa Abu Mus'ab (818) dan al-Shaybani (362) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.408}"
