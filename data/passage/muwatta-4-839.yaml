label: { ar: "الموطأ 839 — ابن شهاب: ابن عباس وأبو هريرة اختلفا في قضاء رمضان: أحدهما يفرق والآخر لا يفرق، ولا أدري أيهما قال ماذا", en: "Muwatta 839" }
summary:
  ar: "يرويه مالك عن ابن شهاب أن عبد الله بن عباس وأبا هريرة اختلفا في قضاء رمضان، فقال أحدهما: يُفرّق بينه، وقال الآخر: لا يُفرّق بينه، ولا يدري ابن شهاب أيهما قال هذا وأيهما قال ذاك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (818) والشيباني (362). {cite:muwatta-maruf-1997 p.408}"
