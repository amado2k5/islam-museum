label: { ar: "صحيح البخاري 6492 — محقرات الذنوب", en: "Sahih al-Bukhari 6492 — the sins held to be slight", ur: "صحیح بخاری 6492 — وہ گناہ جنہیں معمولی سمجھا جاتا ہے", fr: "Sahih al-Bukhari 6492 — les péchés tenus pour légers", es: "Sahih al-Bujari 6492 — los pecados tenidos por leves" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا مَهْدِيٌّ، عَنْ غَيْلاَنَ، عَنْ أَنَسٍ ـ قَالَ إِنَّكُمْ لَتَعْمَلُونَ أَعْمَالاً هِيَ أَدَقُّ فِي أَعْيُنِكُمْ مِنَ الشَّعَرِ، إِنْ كُنَّا نَعُدُّهَا عَلَى عَهْدِ النَّبِيِّ الْمُوبِقَاتِ. قَالَ أَبُو عَبْدِ اللَّهِ يَعْنِي بِذَلِكَ الْمُهْلِكَاتِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6492، يرد فيه ذكر محقرات الذنوب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 6492 (To make the Heart Tender (Ar-Riqaq)), whose wording mentions the sins held to be slight. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 6492، جس کے الفاظ میں وہ گناہ جنہیں معمولی سمجھا جاتا ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6492, dont le texte mentionne les péchés tenus pour légers. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 6492, cuyo texto menciona los pecados tenidos por leves. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
