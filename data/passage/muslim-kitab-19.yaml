label:
  ar: "صحيح مسلم، كتاب اللعان"
  en: "Sahih Muslim, Book 19: The Book of Invoking Curses"
  ur: "صحیح مسلم، کتاب اللعان"
  es: "Sahih Muslim, Libro 19: El libro de las maldiciones"
  fr: "Sahih Muslim, Livre 19: Le Livre des Malédictions"
summary:
  ar: "القسم 19 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب اللعان»، ويضم فيها النصوص من 3743 إلى 3769 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 19 of Sahih Muslim (The Book of Invoking Curses) in the division of the open hadith dataset the museum took its reports from: reports 3743 to 3769 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 19، عنوان «کتاب اللعان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3743 تا 3769۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 19 de Sahih Muslim (El Libro de las Maldiciones) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3743 al 3769, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre des invocations de malédictions), volume 19, qui correspond aux hadiths 3743 à 3769 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
