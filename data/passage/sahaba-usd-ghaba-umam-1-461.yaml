text: "… وقيل : حليف لهم، وقيل: مولى ابن أبي رُهُم بن عبد العُزى العامري. قال ابن هشام: هو من اليمن، حليف لهم. وهو من عجم الفرس، أسلم، من السابقين، وهاجر إلى أرض الحبشة الهجرة الثانية، وذكره ابن إسحاق، وموسى بن عقبة، …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 461، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
