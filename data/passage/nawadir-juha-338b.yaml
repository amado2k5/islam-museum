text: "… ابتعتُهُ من سوق الحذائين دُعِيَ جحا إلى عُرْسٍ، وعندما دخل الدار لم يستقبله أحدّ، ولم يجِد هنا مَن يحفظ حذاءه، فقد اختلط الحابل بالنابل، ولئلا يُسرق حذاؤه، أخرج منديلاً من جيبه، ولفَّهُ به لفاً محكماً وجعله في عبّه، ودخل غرفة …"
summary:
  ar: "سُئل جحا هل اشترى الكتاب من سوق الوراقين، فقال لا، بل من سوق الحذائين. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  en: "Asked whether he bought the book from the booksellers' market, Juha says no, from the shoemakers' market. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  ur: "جحا سے پوچھا گیا کہ کیا اس نے کتاب کتب فروشوں کے بازار سے خریدی ہے، تو اس نے کہا نہیں، جوتا سازوں کے بازار سے۔ {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  fr: "Interrogé pour savoir s'il a acheté le livre au marché des libraires, Juha répond que non, mais au marché des cordonniers. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  es: "Al preguntarle si compró el libro en el mercado de los libreros, Juha responde que no, que en el mercado de los zapateros. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  tr: "Juha'ya kitabı kitapçı pazarından mı aldığı sorulduğunda, \"Hayır, ayakkabıcılar pazarından aldım\" diye yanıtladı. {cite:juha-nawadir-kubra-djuwaydi s. 166}"
  id: "Juha ditanya apakah dia membeli buku itu dari pasar penjual buku, dan dia menjawab, \"Tidak, melainkan dari pasar tukang sepatu.\" {cite:juha-nawadir-kubra-djuwaydi p. 166}"
