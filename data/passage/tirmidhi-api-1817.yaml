text: "… بْنِ الشَّهِيدِ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ أَخَذَ بِيَدِ مَجْذُومٍ فَأَدْخَلَهُ مَعَهُ فِي الْقَصْعَةِ ثُمَّ قَالَ \" كُلْ بِسْمِ اللَّهِ ثِقَةً بِاللَّهِ وَتَوَكُّلاً عَلَيْهِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ يُونُسَ بْنِ مُحَمَّدٍ عَنِ الْمُفَضَّلِ بْنِ فَضَالَةَ. وَالْمُفَضَّلُ بْنُ فَضَالَةَ هَذَا شَيْخٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1817، يذكر الجذام والبرص. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 1817 (The Book on Food), that mentions leprosy and vitiligo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 1817، جس میں جذام اور برص کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
