text: "… أورِدَه من طريقِه في ذيل الأحاديث الموضوعة ص، وقال: قال في الميزان : خِراش عن أَنسٍ: عَدَمٌ، ما أَتى به غيرُ أَبي سعيدِ العدويِّ الكذَّاب؛ زعم أَنَّه لَقِيَه سنةً بضعٍ وعشرينَ ومنتين!! قال ابن حبَّان: لا يَحِلُّ كتبُ حديثِه إِلَّا …"
