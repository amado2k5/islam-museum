label: { ar: "الموطأ 620 — بلاغ في وفاة النبي ودفنه: ما دفن نبي قط إلا في مكانه الذي توفي فيه", en: "Muwatta 620" }
text: "ما دفن نبي قط إلا في مكانه الذي توفي فيه"
summary:
  ar: "أول حديث في باب ما جاء في دفن الميت. بلاغ يرويه مالك أنه بلغه أن النبي توفي يوم الاثنين ودُفن يوم الثلاثاء، وصلى الناس عليه أفذاذاً لا يؤمهم أحد، واختلفوا: فقال ناس يُدفن عند المنبر، وقال آخرون يُدفن بالبقيع، فجاء أبو بكر فأخبر أنه سمع النبي يقول إنه ما دُفن نبي قط إلا في مكانه الذي توفي فيه، فحُفر له فيه. ولما أرادوا عند غسله نزع قميصه سمعوا صوتاً يقول: لا تنزعوا القميص، فلم يُنزع وغُسل وهو عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 24/394) أنه لا يعلمه يُروى على هذا النسق إلا من بلاغ مالك هذا، لكنه صحيح من وجوه مختلفة وأحاديث شتى جمعها مالك. {cite:muwatta-maruf-1997 p.316}"
