text: "وفصلا ً وهيهات هيهات فالحلال بين والحرام بين وبينهما أمور مشتبهات ولا تزال هذه الثلاثة مقترنات كيفما تقلبت الحالات ولما كانت هذه بدعة عم في الدين ضررها واستطار في الخلق شررها وجب كشف الغطاء عن فسادها بالإرشاد إلى مدرك الفرق …"
