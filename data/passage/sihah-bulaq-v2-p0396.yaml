text: |-
  ⁦(باب اللام)⁩•
  ١٩١
  فيها ( رطل الرطل بالفتح الرجل الرخو والرطل والرطل نصف منا وتطيل الشعر تدهينه
  وتمكسيره عل لرعلة القطعة من انخيل وكذلك الرعيل والمع الرعال قال طرفة
  ذاق فى غارة مسفوحة • كرعال الطير أسراباتر
  واسترملت الغنم أى تتابعت فى السير واسترعل أى خرج فى أول الرعيل وأراعيل الرباح
  أوائلها والرعلة والرعل ما يقطع من أذن الشاة ويترك معلقالا يبين كأنه زئمة والشاة رصلاء
  وناقة رعلاء والجمع رعل قال الفند
  رأيت الفتية الاعزا • ل مثل الإينق الرعل
  : وأرعلت العوسجة خرجت رعلتها ويقال أيضاللشاة الطويلة الاذن رعلاء والارعال
  سرعة الطعن وشقته والرعلة أيضا واحدة ارعال وهى الطوال من النخل قال ابن الاعرابي
  يقال مرّفلان يجرّر عله أى ثيابه قال وتركت عيالا رعلة أى كنيرا ويقال لما تهدل من
  النبات أرعل والرالى الدقل والمرعل خيار المال قال الشاعر
  أبأنابعلانا و-قنابسبينا • نساه وجئنا بالهجان المرعل
  والرعلول بقل ويقال هو الطرخون ورعل وذ كوان قبيلتان من سليم ⁦( رعبل)⁩ رعبات
  اللحم قطعته ومنه قول الراجز ١ • تزى الموك حوله هى عبله* وبروى مغر بله وتوب
  مر عبل أى ممزف ويقال جاءفلان فى رعابيل أى فى أطمار وأخلاق وأبوذييان بن الرعبل
  ⁦( رغل)⁩ الرغل بالضم ضرب من المض تسميه الفرس السرمق والمع أرغال وقد أرغلت
  الارض اذا أنبتته وأرغلت المرأة أى أرضعت بالراء والزاى بجيعا وأرغات الابل عن
  مر اتعها أى ضلت وعيش أرغل وأغرل أى واسع وغلام أرغل بين الرغل أى أغرل وهو
  الاقلف وأبور عال يرجم قبره وكان دايلاللبشة حين توجهوا الى مكة فات فى الطويق والرغلة
  رضاعة فى غفلة يقال رغل الجدى أمّه رضعها قال الشاعر
  : يسبق فيها الحمل العجما • رغلااذا ما آنس العشما
  يقول انه يبادر بالعشى الى الشاة يرغلهادون ولدها يسفه باللوم. قال أبوزيد يقال
  فلان رم رغول اذا اغتنم كل شيْ وأكله قال أبو وجزة السعدىّ
  رمّ رغول اذا اغبرت موارده • ولا ينام له جاراذا اخترفا
  يقول اذا أجسدب لم يحة رشبأ وشره البه وان أخصب لم يتم جاره خوقامن غائلته
  خل . رفل فى ئسابه يرفل اذا أضالها وجرها متبخترافهورافل ورفل بالكسرر
  فلاخرق فى ليسته فهورفل وأنشد الاصححى
  فى الركب وشواش وفى الحى رفل» وكذلك أرفل فى ثبابه وامى أة رقلة تترفل فى مشية
  خرقافان لم تحسن المشى فى نيابها قيل رفلاء والرفل أيضا الاحق ومعيشة رفلة أى واسعة
  وثوب رفلّ مثال هبفة وفرس رفلّ أى طويل الذنب وكذلك البعير قال الجعدى
  فعرقاهزة تأخذه • فقرناه برضراض رفل
  أيدال.كاهل جلدبازل • أخلف البازل عاما أوبزل
  وربعا وصف يه اذا كان واسع الجلد ومنه قول الراجز ( ٣
  يقتل ذا الذنب ومن لاذئب لة
  قوله وأبورغال الح فى القاموس
  وأبو رغال ككتاب فى سنن أبي
  داودودلائل النبوّة وغيرهما
  عن أئس ممعت رسول اللّٰه صلى
  اللّٰه عليه وسلم حين خرجنا معه
  الى الطائف فررنا بقبرفة ال هذا
  قبرأبى رغال وهو أبو ثقيف وكان
  من غودوكان بهذا الحرم يدفع
  عنه فلماخرج منه أصابته النقمة
  التى أصابت قومه بهذا المكان :
  فدفن فيه الحديث وقول
  الجوهرى كان دليلا للعبشة حيمة
  توجهوا الى مكة فات فى الطريق
  غيرجيدو كذا قول ابن سيده كان
  عبد الشعيب وكان عشاراجائرا
  ٣ ف تسيخة زيادة رؤية وبقية
  المتفب فى اياد
