label: { ar: "صحيح البخاري 2216 — الأب والأبوة", en: "Sahih al-Bukhari 2216 — the father and fatherhood", ur: "صحیح بخاری 2216 — باپ اور والدیت", es: "Sahih al-Bukhari 2216 — El padre y la paternidad", fr: "Sahih al-Bukhari 2216 — Le père et la paternité" }
text: "حَدَّثَنَا أَبُو النُّعْمَانِ، حَدَّثَنَا مُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، عَنْ أَبِي عُثْمَانَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرٍما ـ قَالَ كُنَّا مَعَ النَّبِيِّ ثُمَّ جَاءَ رَجُلٌ مُشْرِكٌ مُشْعَانٌّ طَوِيلٌ بِغَنَمٍ يَسُوقُهَا فَقَالَ النَّبِيُّ \" بَيْعًا أَمْ عَطِيَّةً أَوْ قَالَ أَمْ هِبَةً \". قَالَ لاَ بَلْ بَيْعٌ. فَاشْتَرَى مِنْهُ شَاةً."
summary:
  ar: "حديث في صحيح البخاري، رقم 2216، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2216 (Sales and Trade), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2216، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2216 (Ventas y Comercio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2216 (Commerce et Ventes), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
