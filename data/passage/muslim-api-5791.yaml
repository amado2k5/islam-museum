text: "… ابْنِ شِهَابٍ، أَنَّ أَبَا سَلَمَةَ بْنَ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، حَدَّثَهُ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ عَدْوَى \". وَيُحَدِّثُ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يُورِدُ مُمْرِضٌ عَلَى مُصِحٍّ \". قَالَ أَبُو سَلَمَةَ كَانَ أَبُو هُرَيْرَةَ يُحَدِّثُهُمَا كِلْتَيْهِمَا عَنْ رَسُولِ اللَّهِ ثُمَّ صَمَتَ أَبُو هُرَيْرَةَ بَعْدَ ذَلِكَ عَنْ قَوْلِهِ \" لاَ عَدْوَى \". وَأَقَامَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5791، يذكر العدوى، والصحة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5791 (The Book of Greetings), that mentions contagion, health. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5791، جس میں چھوت، صحت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
