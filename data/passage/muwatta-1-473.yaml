label: { ar: "الموطأ 473 — مروا أبا بكر فليصل للناس: إنكن لأنتن صواحب يوسف", en: "Muwatta 473", es: "Muwatta 473", fr: "Muwatta 473", ur: "موطا 473", tr: "El-Muvatta 473 — Ebu Bekir'e, insanlara namaz kıldırmasını söyle: \"Siz Yusuf'a karşı komplo kuran kadınlar gibisiniz.\"", id: "Al-Muwatta 473 — Katakan pada Abu Bakr untuk memimpin orang-orang dalam salat: “Kalian seperti para wanita yang bersekongkol melawan Yusuf.”" }
text: "إنكن لأنتن صواحب يوسف، مروا أبا بكر فليصل للناس"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب جامع الصلاة: أمر النبي في مرضه أن يُؤمر أبو بكر فيصلي بالناس، فقالت عائشة إن أبا بكر إذا قام في مقامه لم يُسمع الناس من البكاء فليأمر عمر، فأعاد أمره، فقالت عائشة لحفصة أن تقول له مثل ذلك ففعلت، فقال النبي: إنكن لأنتن صواحب يوسف، مروا أبا بكر فليصل للناس، فقالت حفصة لعائشة إنها ما كانت لتصيب منها خيراً. ويخرّجه المحقق عند البخاري ⁦(679، 7303)⁩ والترمذي (3672) وأبي عوانة والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/123). {cite:muwatta-maruf-1997 p.242}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Aişe'den rivayetle, namazın kılınması bölümünde şöyle anlatmaktadır: Peygamberimiz hastalığı sırasında, namaza imamlık yapması için Ebu Bekir'i görevlendirmesini emretti. Aişe, \"Ebu Bekir yerinde durursa, ağlamasından dolayı insanlar onu dinlemezler. Öyleyse Ömer'i görevlendirsin\" dedi. Peygamberimiz emrini tekrarladı. Aişe, Hafsa'ya da aynı şeyi söylemesini söyledi ve Hafsa da söyledi. Peygamberimiz şöyle buyurdu: \"Siz Yusuf'a karşı komplo kuran kadınlar gibisiniz. Ebu Bekir'e namaza imamlık yapmasını söyleyin.\" Hafsa da Aişe'ye, \"Ondan hiçbir hayır elde edemezdi\" dedi. Araştırmacı ayrıca bunu, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla Buhari (679, 7303), Tirmizi (3672), Ebu Avana ve Beyhaki'nin derlemelerine dahil ediyor ve Temhid'e (22/123) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.242}"
  id: "Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, dalam surah tentang shalat berjamaah: Nabi, ketika sakit, memerintahkan agar Abu Bakar ditunjuk untuk memimpin shalat berjamaah. Aisyah berkata, \"Jika Abu Bakar berdiri di tempatnya, orang-orang tidak akan mendengarnya karena tangisannya. Maka suruhlah dia menunjuk Umar.\" Beliau mengulangi perintahnya. Aisyah kemudian menyuruh Hafsa untuk mengatakan hal yang sama kepadanya, dan Hafsa melakukannya. Nabi bersabda, \"Kalian seperti perempuan-perempuan yang bersekongkol melawan Yusuf. Suruh Abu Bakar memimpin shalat berjamaah.\" Hafsa kemudian berkata kepada Aisyah, \"Dia tidak akan mendapatkan manfaat apa pun darinya.\" Peneliti juga memasukkannya dalam koleksi al-Bukhari (679, 7303), al-Tirmidhi (3672), Abu Awana, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/123). {mengutip:muwatta-maruf-1997 hal.242}"
