label: { ar: "الموطأ 473 — مروا أبا بكر فليصل للناس: إنكن لأنتن صواحب يوسف", en: "Muwatta 473" }
text: "إنكن لأنتن صواحب يوسف، مروا أبا بكر فليصل للناس"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب جامع الصلاة: أمر النبي في مرضه أن يُؤمر أبو بكر فيصلي بالناس، فقالت عائشة إن أبا بكر إذا قام في مقامه لم يُسمع الناس من البكاء فليأمر عمر، فأعاد أمره، فقالت عائشة لحفصة أن تقول له مثل ذلك ففعلت، فقال النبي: إنكن لأنتن صواحب يوسف، مروا أبا بكر فليصل للناس، فقالت حفصة لعائشة إنها ما كانت لتصيب منها خيراً. ويخرّجه المحقق عند البخاري (679، 7303) والترمذي (3672) وأبي عوانة والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/123). {cite:muwatta-maruf-1997 p.242}"
