text: "… يقولونَ : حَرَّمْنا عليكم القتال في هذه الشهور إلا دِماءَ المُحِلِّينَ. فكانت العرب تستحل دماءهم خاصَّة في هذه الشهور. والحَرامُ: ضدَّ الحلال، وكذلك الجِزْمُ بالكسر، وقرئ: وجِزمٌ على قَرْيةِ أهلَكْناها وقال الكسائي: معناه: واجبٌ. والحِرْمَةُ بالكسر : الغُلْمَةُ. وفي الحديث: …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 1، ص 242، يرد فيه ذكر الواجب، والحرام، وما حُرّم على الناس، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 1, p. 242, whose wording mentions the obligatory (wajib), the forbidden (haram), what was forbidden to people, forbidding; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الصحاح، جوہری، اسکین جلد 1، ص 242 کا اقتباس جس میں واجب، حرام، جو لوگوں پر حرام کیا گیا، حرام ٹھہرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Sihah de al-Jawhari, volume numérisé 1, p. 242, dont le texte mentionne l'obligatoire (wajib), l'interdit (haram), ce qui a été interdit aux gens, l'interdiction ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Sihah de al-Jawhari, volumen digitalizado 1, p. 242, cuyo texto menciona lo obligatorio (wajib), lo prohibido (haram), lo que se prohibió a la gente, la prohibición; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
