label: { ar: "سنن أبي داود 3315 — الأب والأبوة", en: "Sunan Abi Dawud 3315 — the father and fatherhood", ur: "سنن ابی داؤد 3315 — باپ اور والدیت", es: "Sunan Abi Dawud 3315 — El padre y la paternidad", fr: "Sunan Abi Dawud 3315 — le père et la paternité" }
text: "… بَكْرٍ الْحَنَفِيُّ، حَدَّثَنَا عَبْدُ الْحَمِيدِ بْنُ جَعْفَرٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ مَيْمُونَةَ بِنْتِ كَرْدَمِ بْنِ سُفْيَانَ، عَنْ أَبِيهَا، نَحْوَهُ مُخْتَصَرٌ مِنْهُ شَىْءٌ قَالَ : \" هَلْ بِهَا وَثَنٌ أَوْ عِيدٌ مِنْ أَعْيَادِ الْجَاهِلِيَّةِ \". قَالَ : لاَ. قُلْتُ : إِنَّ أُمِّي هَذِهِ عَلَيْهَا نَذْرٌ وَمَشْىٌ أَفَأَقْضِيهِ عَنْهَا وَرُبَّمَا قَالَ ابْنُ بَشَّارٍ : أَنَقْضِيهِ عَنْهَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3315، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3315 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3315، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3315 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3315 (Serments et Vœux), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
