label: { ar: "الموطأ 783 — ابن عباس: لا تصوموا حتى تروا الهلال، فإن غم عليكم فأكملوا العدة ثلاثين", en: "Muwatta 783" }
text: "لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فأكملوا العدة ثلاثين"
summary:
  ar: "يرويه مالك عن ثور بن زيد الديلي عن عبد الله بن عباس، أن النبي ذكر رمضان فقال: لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فأكملوا العدة ثلاثين. ويذكر المحقق أن جماعة الرواة عن مالك لم يذكروا عكرمة فيه، وأن الحديث محفوظ لعكرمة عن ابن عباس، وأن ابن عبد البر (التمهيد 2/26) زعم أن مالكاً أسقط عكرمة لأنه كره أن يكون في كتابه لكلام سعيد بن المسيب، ويرد ابن عبد البر ذلك بأن مالكاً ذكره في كتاب الحج باسمه. ويذكر المحقق أن حديث عكرمة عن ابن عباس صحيح أخرجه الطيالسي وابن أبي شيبة وأحمد وأبو داود والترمذي والنسائي وغيرهم. {cite:muwatta-maruf-1997 p.386} {cite:muwatta-maruf-1997 p.387}"
