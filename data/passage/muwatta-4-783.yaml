label: { ar: "الموطأ 783 — ابن عباس: لا تصوموا حتى تروا الهلال، فإن غم عليكم فأكملوا العدة ثلاثين", en: "Muwatta 783", es: "Muwatta 783", fr: "Muwatta 783", ur: "موطا 783", tr: "El-Muvatta 783 — İbn Abbas: Hilal görünmedikçe oruç tutmayın. Eğer hilal görünmezse, otuz günü tamamlayın.", id: "Al-Muwatta 783 — Ibnu Abbas: Jangan berpuasa sampai kamu melihat bulan sabit. Jika bulan sabit tidak terlihat, maka genapkanlah hitungan tiga puluh hari." }
text: "لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فأكملوا العدة ثلاثين"
summary:
  ar: "يرويه مالك عن ثور بن زيد الديلي عن عبد الله بن عباس، أن النبي ذكر رمضان فقال: لا تصوموا حتى تروا الهلال، ولا تفطروا حتى تروه، فإن غم عليكم فأكملوا العدة ثلاثين. ويذكر المحقق أن جماعة الرواة عن مالك لم يذكروا عكرمة فيه، وأن الحديث محفوظ لعكرمة عن ابن عباس، وأن ابن عبد البر ⁦(التمهيد 2/26)⁩ زعم أن مالكاً أسقط عكرمة لأنه كره أن يكون في كتابه لكلام سعيد بن المسيب، ويرد ابن عبد البر ذلك بأن مالكاً ذكره في كتاب الحج باسمه. ويذكر المحقق أن حديث عكرمة عن ابن عباس صحيح أخرجه الطيالسي وابن أبي شيبة وأحمد وأبو داود والترمذي والنسائي وغيرهم. {cite:muwatta-maruf-1997 p.386} {cite:muwatta-maruf-1997 p.387}"
  tr: "Malik, Abdullah ibn Abbas'tan rivayetle, Sevr ibn Zeyd el-Dili'den naklederek, Peygamberimizin Ramazan ayından bahsettiğini ve şöyle buyurduğunu aktarmıştır: \"Hilal görünmedikçe oruç tutmayın ve hilal görünmedikçe orucunuzu bozmayın. Eğer hilal sizden gizlenmişse, otuz gün oruç tutun.\" Araştırmacı, Malik'in rivayetine dayanan bir grup ravinin bu isnad zincirinde İkrime'den bahsetmediğini ve hadisin İbn Abbas'tan İkrime'nin rivayetiyle korunduğunu belirtmektedir. İbn Abd el-Barr (el-Tamhid 2/26), Malik'in İkrime'yi, Sa'id ibn el-Musayyib'in sözlerini kitabına dahil etmekten hoşlanmadığı için dışarıda bıraktığını iddia etmiştir. İbn Abd el-Barr, Malik'in Hac Kitabı'nda İkrime'den adıyla bahsettiğini belirterek bu iddiayı çürütmektedir. Araştırmacı ayrıca, İbn Abbas'tan rivayet edilen İkrime hadisinin sahih olduğunu ve el-Tayalisi, İbn Abi Şeybe, Ahmed, Ebu Davud, el-Tirmizi, el-Nesai ve diğerleri tarafından nakledildiğini belirtmektedir."
  id: "Malik meriwayatkannya dari Thawr ibn Zayd al-Dili, yang juga dari Abdullah ibn Abbas, bahwa Nabi menyebutkan Ramadan dan bersabda: “Jangan berpuasa sampai kalian melihat bulan sabit, dan jangan berbuka puasa sampai kalian melihatnya. Jika bulan sabit itu terhalang, maka genapilah tiga puluh hari.” Peneliti mencatat bahwa sekelompok perawi dari Malik tidak menyebutkan Ikrimah dalam sanad ini, dan hadits tersebut terpelihara dari Ikrimah dari Ibn Abbas. Ibn Abd al-Barr (al-Tamhid 2/26) mengklaim bahwa Malik menghilangkan Ikrimah karena ia tidak suka memasukkan perkataan Sa’id ibn al-Musayyib dalam bukunya. Ibn Abd al-Barr membantah hal ini dengan menyatakan bahwa Malik menyebut namanya dalam Kitab Haji. Peneliti tersebut juga menyebutkan bahwa hadits Ikrimah yang diriwayatkan oleh Ibnu Abbas adalah sahih dan telah diriwayatkan oleh al-Tayalisi, Ibnu Abi Shaybah, Ahmad, Abu Dawud, al-Tirmidhi, al-Nasa’i, dan lainnya."
