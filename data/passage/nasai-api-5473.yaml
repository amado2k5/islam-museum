label: { ar: "سنن النسائي 5473 — بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 5473 — dutifulness to the parents or disobedience to them", ur: "سنن نسائی 5473 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 5473 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan al-Nasa'i 5473 — le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan an-Nasa'i 5473 — Anne babaya iyilik mi, yoksa onlara itaatsizlik mi?", id: "Sunan an-Nasa'i 5473 — Berbakti kepada orang tua atau tidak taat kepada mereka" }
text: "… بْنِ يَزِيدَ، قَالَ حَدَّثَنَا أَبِي قَالَ، حَدَّثَنَا حَيْوَةُ، وَذَكَرَ، آخَرَ قَالَ حَدَّثَنَا سَالِمُ بْنُ غَيْلاَنَ التُّجِيبِيُّ، أَنَّهُ سَمِعَ دَرَّاجًا أَبَا السَّمْحِ، أَنَّهُ سَمِعَ أَبَا الْهَيْثَمِ، أَنَّهُ سَمِعَ أَبَا سَعِيدٍ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" أَعُوذُ بِاللَّهِ مِنَ الْكُفْرِ وَالدَّيْنِ \". قَالَ رَجُلٌ يَا رَسُولَ اللَّهِ أَتَعْدِلُ الدَّيْنَ بِالْكُفْرِ فَقَالَ رَسُولُ اللَّهِ \" نَعَمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5473، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5473 (The Book of Seeking Refuge with Allah), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5473، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5473 (El Libro de la Búsqueda de Refugio en Alá), menciona la obediencia o desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5473 (Le Livre de la Recherche de Refuge auprès d'Allah), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 5473 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. \"İslam'da Ebeveynlik\" tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5473, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Peramban \"Kekeluargaan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
