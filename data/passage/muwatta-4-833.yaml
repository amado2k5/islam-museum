text: "ليبدأ بالنذر قبل أن يتطوع"
summary:
  ar: "أول حديث في باب النذر في الصيام والصيام عن الميت. يرويه مالك عن ابن شهاب عن سعيد بن المسيب، أنه سئل عن رجل نذر صيام شهر هل له أن يتطوع؟ فقال: ليبدأ بالنذر قبل أن يتطوع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (472). {cite:muwatta-maruf-1997 p.406}"
