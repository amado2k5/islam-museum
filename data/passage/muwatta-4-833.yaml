label: { ar: "الموطأ 833 — سعيد بن المسيب: سئل عن رجل نذر صيام شهر، هل له أن يتطوع؟ فقال: ليبدأ بالنذر قبل أن يتطوع", en: "Muwatta 833", es: "Muwatta 833", fr: "Muwatta 833", ur: "موطا 833", tr: "El-Muvatta 833 — Sa’id ibn al-Musayyab: Bir ay oruç tutmaya adak adayan bir adam hakkında kendisine soru soruldu; gönüllü olarak oruç tutması caiz midir? Şöyle dedi: Önce adakını yerine getirmeli, sonra gönüllü olarak oruç tutmalıdır.", id: "Al-Muwatta 833 — Sa’id ibn al-Musayyab: Ia ditanya tentang seorang laki-laki yang bernazar untuk berpuasa selama sebulan, apakah diperbolehkan baginya untuk berpuasa sunnah? Beliau menjawab: Ia harus menunaikan nazarnya terlebih dahulu sebelum berpuasa sunnah." }
text: "ليبدأ بالنذر قبل أن يتطوع"
summary:
  ar: "أول حديث في باب النذر في الصيام والصيام عن الميت. يرويه مالك عن ابن شهاب عن سعيد بن المسيب، أنه سئل عن رجل نذر صيام شهر هل له أن يتطوع؟ فقال: ليبدأ بالنذر قبل أن يتطوع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد (472). {cite:muwatta-maruf-1997 p.406}"
  tr: "Adaklar bölümündeki ilk hadis, oruç tutmak ve ölüler adına oruç tutmakla ilgilidir. Malik, İbn Şihab'dan, o da Sa'id ibn al-Musayyab'dan rivayet etmiştir. Sa'id ibn al-Musayyab'a, bir ay oruç tutmaya adak adayan bir adam hakkında soru sorulmuş ve ona gönüllü olarak oruç tutması caiz midir diye sorulmuştur. O da şöyle cevap vermiştir: Önce adakını yerine getirsin, sonra gönüllü olarak oruç tutsun. Editör, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd (472) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.406}"
  id: "Hadits pertama dalam bab tentang nazar terkait puasa dan puasa untuk orang yang telah meninggal. Diriwayatkan oleh Malik dari Ibnu Shihab dari Sa'id ibn al-Musayyab, yang ditanya tentang seorang laki-laki yang bernazar untuk berpuasa selama sebulan; apakah diperbolehkan baginya untuk berpuasa sunnah? Beliau menjawab: Hendaklah ia menunaikan nazarnya sebelum berpuasa sunnah. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwayd (472). {cite:muwatta-maruf-1997 p.406}"
