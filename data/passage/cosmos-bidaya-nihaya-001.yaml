text: "واختلفوا هل كان قبل خلق السموات والأرض شئ مخلوق قبلهما. فذهب طوائف من المتكلمين إلى أنه لم يكن قبلهما شئ وأنهما خلقتا من العدم المحض. وقال آخرون بل كان قبل السموات والأرض مخلوقات أخر"
summary:
  ar: "يعرض ابن كثير في أول كتابه خلاف العلماء: هل سبق السماواتِ والأرضَ مخلوقٌ آخر، أم خُلقتا من العدم المحض."
  en: "At the opening of his history Ibn Kathir sets out the scholars' disagreement over whether anything was created before the heavens and the earth, or whether they came from sheer nothing."
  es: "Al comienzo de su historia, Ibn Kathir expone el desacuerdo entre los eruditos sobre si algo fue creado antes que los cielos y la tierra, o si surgieron de la nada absoluta."
  fr: "Au début de son histoire, Ibn Kathir expose le désaccord des savants quant à savoir si quelque chose a été créé avant les cieux et la terre, ou s'ils sont apparus à partir du néant absolu."
  ur: "ابن کثیر اپنی تاریخ کے آغاز میں علماء کے اس اختلاف کو بیان کرتا ہے کہ آیا زمین و آسمان سے پہلے کوئی چیز پیدا ہوئی تھی یا وہ سراسر کسی چیز سے پیدا نہیں ہوئی تھی۔"
