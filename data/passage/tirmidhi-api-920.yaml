label: { ar: "جامع الترمذي 920 — المستحب، الرخصة", en: "Jami' al-Tirmidhi 920 — the recommended (mustahabb); the concession (rukhsa)", ur: "جامع ترمذی 920 — مستحب، رخصت", fr: "Jami' al-Tirmidhi 920 — le recommandé (mustahabb) ; la dispense (rukhsa)", es: "Yami' al-Tirmidhi 920 — lo recomendado (mustahabb); la dispensa (rukhsa)" }
text: "… حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي الزُّبَيْرِ، عَنِ ابْنِ عَبَّاسٍ، وَعَائِشَةَ، أَنَّ النَّبِيَّ أَخَّرَ طَوَافَ الزِّيَارَةِ إِلَى اللَّيْلِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ رَخَّصَ بَعْضُ أَهْلِ الْعِلْمِ فِي أَنْ يُؤَخَّرَ طَوَافُ الزِّيَارَةِ إِلَى اللَّيْلِ وَاسْتَحَبَّ بَعْضُهُمْ أَنْ يَزُورَ يَوْمَ النَّحْرِ وَوَسَّعَ بَعْضُهُمْ أَنْ يُؤَخَّرَ وَلَوْ إِلَى آخِرِ أَيَّامِ مِنًى."
summary:
  ar: "حديث في جامع الترمذي، رقم 920، يرد فيه ذكر المستحب، والرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 920 (The Book on Hajj), whose wording mentions the recommended (mustahabb), the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 920، جس کے الفاظ میں مستحب، رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 920, dont le texte mentionne le recommandé (mustahabb), la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 920, cuyo texto menciona lo recomendado (mustahabb), la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
