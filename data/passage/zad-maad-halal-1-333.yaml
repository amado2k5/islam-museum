text: "… لهم باباً لها لا يُغْلِقُهُ عنهم إلى أن تَطْلُعَ الشمسُ مِن مغربها، وجعلَ لِكُلِّ سيئة كفارةً تُكفرها من توبة، أو بكل ما حرَّم عليهم عِوضاً مِن الحلال أنفعَ لهم منه، الحرام، ويسعه الحلال، فلا يَضيقُ عنه، وجعل لِكل عُسْرٍ يمتحنُهم …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 333، يذكر الحلال، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 333, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 333 کا اقتباس جس میں حلال، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
