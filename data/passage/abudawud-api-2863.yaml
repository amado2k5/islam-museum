label: { ar: "سنن أبي داود 2863 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 2863 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن ابی داؤد 2863 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Sunan Abi Dawud 2863 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia", fr: "Sunan Abi Dawud 2863 — Testament ou dernières volontés; ce qui a été laissé: biens et héritage", tr: "Sunan Abi Davud 2863 — Vasiyetname veya son miras, geride bıraktığı mal varlığı ve miras.", id: "Sunan Abi Dawud 2863 — Surat wasiat atau testamen terakhir, apa yang ditinggalkannya berupa warisan dan harta pusaka" }
text: "حَدَّثَنَا مُسَدَّدٌ، وَمُحَمَّدُ بْنُ الْعَلاَءِ، قَالاَ حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي وَائِلٍ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، قَالَتْ مَا تَرَكَ رَسُولُ اللَّهِ دِينَارًا وَلاَ دِرْهَمًا وَلاَ بَعِيرًا وَلاَ شَاةً وَلاَ أَوْصَى بِشَىْءٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2863، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2863 (Wills (Kitab Al-Wasaya)), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2863، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2863 (Testamentos (Kitab Al-Wasaya)), menciona un testamento o consejo de despedida, y lo que dejó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2863 (Testaments (Kitab Al-Wasaya)), mentionne un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 2863 numaralı hadiste, bir vasiyet veya son anlaşmadan ve geride bıraktığı mal ve mirastan bahsedilmektedir. Bu derleme, vasiyetler, miraslar, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2863, menyebutkan wasiat atau perjanjian terakhir, dan apa yang ditinggalkannya berupa harta dan warisan. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
