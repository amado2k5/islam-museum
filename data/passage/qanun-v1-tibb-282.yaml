  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 282, that mentions pain, fever, named diseases, the organs of the body, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
