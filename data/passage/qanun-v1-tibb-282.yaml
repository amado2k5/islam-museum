text: "… الأدوية المسهّلة قوة مسهّلة فطال عليه الأمر واحتاج إلى علاجات كثيرة حتى يمسك، وكذلك المشايخ يخاف عليهم من الإسهال غوائله. واعلم أن شرب النبيذ عقيب المسهلات يورث حميّات واضطراباً. وكثيراً ما يعقب الإسهال والفصد وجعاً في الكبد ويقلعه شرب الماء …"
summary:
