label: { ar: "نوادر جحا الكبرى، ص 162 — «لو لم يقدم الزارع حنطة لمات السلطان جوعاً\")»", en: "Nawadir Juha al-Kubra, p. 162 — 'Without the Farmer's Wheat the Sultan Would Starve'", ur: "نوادر جحا الکبریٰ، ص 162 — «اگر کسان گندم نہ دیتا تو سلطان بھوکا مر جاتا»", fr: "Nawadir Juha al-Kubra, p. 162 — « Sans le blé du paysan, le sultan mourrait de faim »", es: "Nawadir Juha al-Kubra, p. 162 — «Sin el trigo del labrador, el sultán moriría de hambre»" }
text: "… لو لم يقدم الزارع حنطةً، لمات السلطان جوعاً سأله يوماً شيخ القرية، وكان ضيفاً عليه قائلاً: السلطان أكبرُ أمِ الزارعُ؟ فأجابه الشيخ: طبعاً الزارعُ أكبرُ، لأنه لو لم يُقدِّم حِنطةً، لمات السلطان جوعاً! ما هو طريق الموت؟ سألوه يوماً : …"
summary:
  ar: "سُئل جحا هل السلطان أعظم أم الفلاح، فقال الفلاح، فلولا قمحه لمات السلطان جوعاً. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  en: "Asked whether the sultan or the farmer is greater, Juha says the farmer, since without his wheat the sultan would starve. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  ur: "جحا سے پوچھا گیا کہ سلطان بڑا ہے یا کسان، تو اس نے کہا کسان، کیونکہ اس کی گندم نہ ہوتی تو سلطان بھوکا مر جاتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  fr: "Interrogé pour savoir qui est le plus grand, du sultan ou du paysan, Juha répond que c'est le paysan, car sans son blé le sultan mourrait de faim. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
  es: "Al preguntarle quién es más grande, el sultán o el labrador, Juha dice que el labrador, pues sin su trigo el sultán moriría de hambre. {cite:juha-nawadir-kubra-djuwaydi p. 162}"
