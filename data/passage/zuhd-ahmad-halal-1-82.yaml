text: "… يَضْمَنْ لِي مَا بَيْنَ لَحْيَيْهِ وَمَا بَيْنَ رِجْلَيْهِ أَضْمَنْ لَهُ الْجَنَّةَ. أي من أدى الحق الذي على لسانه من النطق بما يجب عليه والصمت عَمًّا لا يعنيه، وأدى الحق الذي على فرجه من وضعه في الحلال وكفه عن الحرام، أضمنُ …"
