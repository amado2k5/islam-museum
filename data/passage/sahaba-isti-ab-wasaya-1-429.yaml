text: "… خارجة بن المنتفق الاسدى حليف ابي سفيان بن حرب سكن الشام روى عنه عبد الرحمن بن غنم عن النبي انه سممه يقول في خطبئه ان اللّٰه قد اعطى كل ذى حق حقه فلا وصية لوارث والولد للفراش وللماهر الحجر وروى …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 429، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 1, p. 429, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 1، ص 429 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 1, pág. 429, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab (tome 1, p. 429), mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il est répertorié dans le Navigateur de Testaments."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 1. cildinin 429. sayfasından bir alıntı; vasiyetname veya nihai miras belgesinden ve geride bıraktığı mal varlığı ve mirastan bahsediyor; makine tarafından okunabilir taranmış kopyadan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 1 bergambar, halaman 429, yang menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkannya berupa harta warisan; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
