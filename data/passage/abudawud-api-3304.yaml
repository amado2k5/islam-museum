label: { ar: "سنن أبي داود 3304 — الأب والأبوة", en: "Sunan Abi Dawud 3304 — the father and fatherhood", ur: "سنن ابی داؤد 3304 — باپ اور والدیت", es: "Sunan Abi Dawud 3304 — El padre y la paternidad" }
text: "حَدَّثَنَا شُعَيْبُ بْنُ أَيُّوبَ، حَدَّثَنَا مُعَاوِيَةُ بْنُ هِشَامٍ، عَنْ سُفْيَانَ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنْ عُقْبَةَ بْنِ عَامِرٍ الْجُهَنِيِّ، أَنَّهُ قَالَ لِلنَّبِيِّ : إِنَّ أُخْتِي نَذَرَتْ أَنْ تَمْشِيَ إِلَى الْبَيْتِ. فَقَالَ : \" إِنَّ اللَّهَ لاَ يَصْنَعُ بِمَشْىِ أُخْتِكَ إِلَى الْبَيْتِ شَيْئًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3304، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3304 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3304، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3304 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
