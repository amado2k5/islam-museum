text: "… لَقَدْ رَجَعْتُ إِلَى بَيْتِي وَكَأَنَّ الَّذِي خَرَجْتُ لَهُ لَمْ أَخْرُجْ لاَ أَجِدُ مِنْهُ قَلِيلاً وَلاَ كَثِيرًا وَوُعِكْتُ فَقُلْتُ لِرَسُولِ اللَّهِ أَرْسِلْنِي إِلَى بَيْتِ أَبِي فَأَرْسَلَ مَعِي الْغُلاَمَ فَدَخَلْتُ الدَّارَ فَوَجَدْتُ أُمَّ رُومَانَ فِي السُّفْلِ وَأَبُو بَكْرٍ فَوْقَ الْبَيْتِ يَقْرَأُ فَقَالَتْ أُمِّي مَا جَاءَ بِكِ يَا بُنَيَّةُ قَالَتْ فَأَخْبَرْتُهَا وَذَكَرْتُ لَهَا الْحَدِيثَ فَإِذَا هُوَ لَمْ يَبْلُغْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3180، يذكر الحمى والوعك. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3180 (Chapters on Tafsir), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3180، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
