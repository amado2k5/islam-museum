text: "… أنا أعرف طبعها المُعاكِس كانت حماتُهُ أمام النهر تغسل ثياباً لها، فزلِقَت رجلُها ووقعت في النهر، وأسرع الناس إليها ففتَّشوا على جسدها فلم يعثروا عليه فأخبروا الشيخ بذلك، نحضر وذهب إلى منبع النهر باحثاً فيه عن الجثَّة. فقالوا له: الجثة …"
summary:
  ar: "انزلقت حماة جحا في النهر وهي تغسل، فلم يعثر الناس على جثتها، فذهب جحا يبحث عنها عند المنبع وقال إنها تخالف الطبع دائماً، فسيبحث عنها في اتجاه أعلى النهر. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  en: "Juha's mother-in-law slips into the river while washing, and the people cannot find her body. Juha goes to the spring to search, saying that she goes against nature, so he will search upstream. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  ur: "جحا کی ساس دھوتے وقت دریا میں پھسل جاتی ہے اور لوگوں کو اس کی لاش نہیں ملتی۔ جحا چشمے کی طرف تلاش کرنے جاتا ہے اور کہتا ہے کہ وہ فطرت کے خلاف چلتی ہے، اس لیے وہ دریا کے اوپر کی طرف ڈھونڈے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  fr: "La belle-mère de Juha glisse dans la rivière en faisant la lessive, et les gens ne retrouvent pas son corps. Juha va chercher à la source, disant qu'elle va à contre-nature, et qu'il cherchera donc en amont. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
  es: "La suegra de Juha resbala al río mientras lava, y la gente no encuentra su cuerpo. Juha va a buscarla a la fuente, diciendo que ella va contra la naturaleza, así que la buscará río arriba. {cite:juha-nawadir-kubra-djuwaydi p. 92}"
