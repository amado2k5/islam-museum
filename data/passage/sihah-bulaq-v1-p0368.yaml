  اللبد من ظهر الغرص وفى الحديث مؤمن خفيف الحاذ أى خفيف الظهر والحاذان ما وقع
  ملميه الذئب من أديار الفخذين والحاذنيت واحسدته حاذة عن أبي عبيد والمح وذان نبت نوره
  أصفرواستحوذ عليه الشيطان أى غلب وهذاباه بالواوعلى أصله كماجاء استروح واستصوب
  وقال أيوز يدهذا الباب كله يجوز أن يتكلم به على الاصل تقول العرب استصاب
  وامستصوب واستجاب واستجوب وهوقياس معارد عندهم وقوله تعالى ألم نستحوذ عليكم
  أى ألم نغلب على أموركم وذ. تول على مودنمكم
  ل الخا نذ اللتذيذرأس الجبل المشرف وانخنذية الفحل قال يشر
  وختذيذ ترى الغرمول منه * كطىّ الزق علقه التجار
  والخنذيذ انلخصى وهو من الاضداد وحكى أبوعبيد انفناذيذ جياد الحيل وأنشدقول
  خضاف بن قيس من البراجم وخناذيذ خصية وفحولا• فوصفها بالجودة أى منها فحول
  ومنها خصيان خرج الآن من حدّ الاضداد (خوذ الخاوذة الخالفة الى الشئ يقال
