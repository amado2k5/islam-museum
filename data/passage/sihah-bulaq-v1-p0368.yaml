  ياعقيد اللؤم لولا نعمى * كنت كالريذة ملق بالغنا
  وكذلك خرقة الصائغ التى يجلوبم االحلىّ قال الذابغة
  قبح اللّٰه ثم نى بلعن • ربذة الصائغ الجدان الجهولا
  والربذة بالتحريك لغة فيها والربذة أيضاموضع فيه قبر أب ذرّ الغفارى رضى اللّٰه عنه والريذة
