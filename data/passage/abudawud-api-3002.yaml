label: { ar: "سنن أبي داود 3002 — الأب والأبوة", en: "Sunan Abi Dawud 3002 — the father and fatherhood", ur: "سنن ابی داؤد 3002 — باپ اور والدیت", es: "Sunan Abi Dawud 3002 — El padre y la paternidad" }
text: "حَدَّثَنَا مُصَرِّفُ بْنُ عَمْرٍو، حَدَّثَنَا يُونُسُ، قَالَ ابْنُ إِسْحَاقَ حَدَّثَنِي مَوْلًى، لِزَيْدِ بْنِ ثَابِتٍ حَدَّثَتْنِي ابْنَةُ مُحَيِّصَةَ، عَنْ أَبِيهَا، مُحَيِّصَةَ أَنَّ رَسُولَ اللَّهِ قَالَ \" مَنْ ظَفِرْتُمْ بِهِ مِنْ رِجَالِ يَهُودَ فَاقْتُلُوهُ \". فَوَثَبَ مُحَيِّصَةُ عَلَى شَبِيبَةَ رَجُلٍ مِنْ تُجَّارِ يَهُودَ كَانَ يُلاَبِسُهُمْ فَقَتَلَهُ وَكَانَ حُوَيِّصَةُ إِذْ ذَاكَ لَمْ يُسْلِمْ وَكَانَ أَسَنَّ مِنْ مُحَيِّصَةَ فَلَمَّا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3002، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3002 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3002، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3002 (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
