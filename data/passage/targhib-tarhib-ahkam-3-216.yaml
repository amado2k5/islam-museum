text: "… تجتمع الذنوب على الرجل منكم كما جمتم هذا فليتق الله رجل فلا يذنب صغيرة ولا كبيرة فانها محصاة عليه - وعن مائشةا أن رسول الله قال ياعائشة اياك ومحقرات الذنوب فان لما من اللّٰه طالبا رواه النسائى واللفظ له وأبن …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 3، ص 216، يرد فيه ذكر صغائر الذنوب، ومحقرات الذنوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 3, p. 216, whose wording mentions the minor sins, the sins held to be slight; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 3، ص 216 کا اقتباس جس میں صغیرہ گناہ، وہ گناہ جنہیں معمولی سمجھا جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Targhib wa-l-Tarhib de al-Mundhiri, volume numérisé 3, p. 216, dont le texte mentionne les péchés mineurs, les péchés tenus pour légers ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Targhib wa-l-Tarhib de al-Mundhiri, volumen digitalizado 3, p. 216, cuyo texto menciona los pecados menores, los pecados tenidos por leves; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 3. cildinin 216. sayfasından, küçük günahlar ve önemsiz günahlardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Dorongan dan Peringatan), Jilid 3, halaman 216, yang menyebutkan dosa-dosa kecil dan dosa-dosa yang tidak signifikan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
