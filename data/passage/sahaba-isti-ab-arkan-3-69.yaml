text: "… وإنْ كان سواكاً من أَراك قالها ثلاث مرات. وروى أيضاً : البذادةُ من الإيمان. باب إبراهيم - إبراهيم الطائفي : والد عطاء بن إبراهيم، وروَى عنه ابنه عطاء، عن النّبيِّ قيقة قابِلوا النِّعالَ. لم يَرْوِ عنه غيرُ ابنه عطاء، وإسناد …"
summary:
