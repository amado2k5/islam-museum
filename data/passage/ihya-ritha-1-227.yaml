  id: "Cuplikan dari Ihya Ulum al-Din, Volume 1, halaman 227, berisi eulogi dan pengumuman kematian; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
