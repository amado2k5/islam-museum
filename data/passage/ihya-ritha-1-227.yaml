text: "… عمر لم يمت، قال : فقد نعاه إلى ربى وفعى إلى نفسى ثم قال : أنا وأنت فى الموتى كانه قد كان، ثم صلى على النبي، ثم دعا بدعوات خفيات، ثم قال. هذه وصيتى إياك ياهرم بن حيان كتاب أقّه …"
