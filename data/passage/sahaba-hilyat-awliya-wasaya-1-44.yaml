text: "… على السبمين غفر له لزدت ثم صلى عليه رسول اللّٰه ومشى معه، حق قام على قبره وفرغ من دفنه. فسجياً لى ولجراتى على رسول اللّٰه، والله ورسوله أعلم. فواله ما كان إلا يديرا حق نزلت هاتان الآيتان ولا تصل على …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 44، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
