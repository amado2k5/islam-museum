text: "… كَلاَلَةٍ مَتَىٰ مَا تُنَاخِي عِنْدَ بَابِ أَبْنِ هَاشِم تُرَاحِي وَتَلْقَىٰ مِنْ فَوَاضِلِهِ نَدَىٰ أَغَارَ لَعَمْرِي فِي الْبِلاَدِ وَأَنْجَدَا. نَبِيٌ يَرَىٰ مَا لاَ تَرَوْنَ، وَذِكْرُةُ لَهُ صَدَقَاتٌ مَا تُغِبٌ وَنَائِلٌ وَلَيْسَ عَطَاءُ الْيَوْمِ مَانِعَهُ غَدَ نَبِيِّ الْإِلْهِ حَيْثُ أَوْصَىٰ وَأَشْهَدَ أَجِدُّكَ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 178، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 178, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 178 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de la Sira de Ibn Hisham, pág. 178, que menciona un testamento o consejo de despedida; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
