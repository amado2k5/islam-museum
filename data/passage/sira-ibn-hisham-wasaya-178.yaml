  tr: "İbn Hişam'ın Peygamber biyografisinden bir alıntı, 178. sayfada, son bir vasiyet veya antlaşmadan bahsediyor; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi Nabi karya Ibnu Hisham, halaman 178, menyebutkan wasiat atau perjanjian terakhir; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
