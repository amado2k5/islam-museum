label: { ar: "صحيح مسلم 5700 — الرقية، الشكوى من العلة", en: "Sahih Muslim 5700 — ruqya recited over the sick; a complaint of an ailment", ur: "صحیح مسلم 5700 — رقیہ، بیماری کی شکایت", es: "Sahih Muslim 5700 — ruqya recitada sobre los enfermos; queja de una dolencia", fr: "Sahih Muslim 5700 — ruqya récitée sur les malades; une plainte relative à une affection", tr: "Sahih Muslim 5700 — Ruqyah, Hastalıktan Şikayetçi", id: "Sahih Muslim 5700 — Ruqyah, Mengeluh Sakit" }
text: "حَدَّثَنَا بِشْرُ بْنُ هِلاَلٍ الصَّوَّافُ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ صُهَيْبٍ، عَنْ أَبِي نَضْرَةَ، عَنْ أَبِي سَعِيدٍ، أَنَّ جِبْرِيلَ، أَتَى النَّبِيَّ فَقَالَ يَا مُحَمَّدُ اشْتَكَيْتَ فَقَالَ \" نَعَمْ \". قَالَ بِاسْمِ اللَّهِ أَرْقِيكَ مِنْ كُلِّ شَىْءٍ يُؤْذِيكَ مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ اللَّهُ يَشْفِيكَ بِاسْمِ اللَّهِ أَرْقِيكَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5700، يذكر الرقية، والشكوى من العلة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5700 (The Book of Greetings), that mentions ruqya recited over the sick, a complaint of an ailment, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5700، جس میں رقیہ، بیماری کی شکایت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5700 (El Libro de los Saludos), menciona la ruqya recitada sobre los enfermos, la queja de una dolencia y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5700 (Livre des salutations), mentionne la roqya récitée sur les malades, le traitement des affections et la guérison. Le dictionnaire en ligne Medicine Browser la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5700 numaralı hadis, rukye (dua yoluyla İslami şifa), hastalık şikayetleri ve iyileşmeden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5700, menyebutkan ruqyah (penyembuhan Islami melalui doa), keluhan penyakit, dan penyembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
