label: { ar: "صحيح مسلم 5700 — الرقية، الشكوى من العلة", en: "Sahih Muslim 5700 — ruqya recited over the sick; a complaint of an ailment", ur: "صحیح مسلم 5700 — رقیہ، بیماری کی شکایت" }
text: "حَدَّثَنَا بِشْرُ بْنُ هِلاَلٍ الصَّوَّافُ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ صُهَيْبٍ، عَنْ أَبِي نَضْرَةَ، عَنْ أَبِي سَعِيدٍ، أَنَّ جِبْرِيلَ، أَتَى النَّبِيَّ فَقَالَ يَا مُحَمَّدُ اشْتَكَيْتَ فَقَالَ \" نَعَمْ \". قَالَ بِاسْمِ اللَّهِ أَرْقِيكَ مِنْ كُلِّ شَىْءٍ يُؤْذِيكَ مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ اللَّهُ يَشْفِيكَ بِاسْمِ اللَّهِ أَرْقِيكَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5700، يذكر الرقية، والشكوى من العلة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5700 (The Book of Greetings), that mentions ruqya recited over the sick, a complaint of an ailment, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5700، جس میں رقیہ، بیماری کی شکایت، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
