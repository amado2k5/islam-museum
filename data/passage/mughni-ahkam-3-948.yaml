text: "… تَفْرِيجاً عَنْ أَخِيهِ الْمُسْلِمِ، وَقَضَاءَ لِحَاجَئِهِ، وَعَوْناً لَهُ، فَكَانَ مَنْدُوباً إلَيْهِ، كَالصدَقَةِ عَلَيْهِ وَلَيْسَ بوَاجِبِ. قَالَ أَحْمَدُ لا إثْمَ عَلَى مَنْ سُثِلَ الْقَرْضَ فَلَمْ يُقْرِضْ. وَذَلِكَ لأَنَّهُ مِنْ الْمَعْرُوف، فَأَشْبَة صَدَقَّةً التَّطَوُعِ. وَلَيْسَ بِمَكْرُوه فِي حَقَّ الْمُفْرِضِ. قَالَ أَحْمَدُ: لَيْسَ …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 948، يرد فيه ذكر الواجب، والمندوب، والتطوع، وما ليس بواجب، والمكروه، وما لا حرج فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 948, whose wording mentions the obligatory (wajib), the recommended (mandub), the voluntary act (tatawwu'), what is said not to be obligatory, the disliked (makruh), what carries no blame; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 948 کا اقتباس جس میں واجب، مندوب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں، مکروہ، جس میں کوئی حرج نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 3, p. 948, dont le texte mentionne l'obligatoire (wajib), le recommandé (mandub), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire, le réprouvé (makruh), ce qui n'entraîne aucun blâme ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mughni de Ibn Qudama, volumen digitalizado 3, p. 948, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mandub), el acto voluntario (tatawwu'), lo que se dice que no es obligatorio, lo reprobado (makruh), lo que no acarrea reproche; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
