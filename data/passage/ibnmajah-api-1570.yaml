label: { ar: "سنن ابن ماجه 1570 — دفن وقبر ومرقد", en: "Sunan Ibn Majah 1570 — a burial, grave or resting place", ur: "سنن ابن ماجہ 1570 — تدفین، قبر اور مرقد", es: "Sunan Ibn Majah 1570 — un lugar de entierro, tumba o descanso.", fr: "Sunan Ibn Majah 1570 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، حَدَّثَنَا رَوْحٌ، حَدَّثَنَا بِسْطَامُ بْنُ مُسْلِمٍ، قَالَ سَمِعْتُ أَبَا التَّيَّاحِ، قَالَ سَمِعْتُ ابْنَ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ ـ رَخَّصَ فِي زِيَارَةِ الْقُبُورِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1570، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1570 (Chapters Regarding Funerals), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1570، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1570 (Capítulos sobre los funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 1570 (Chapitres relatifs aux funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
