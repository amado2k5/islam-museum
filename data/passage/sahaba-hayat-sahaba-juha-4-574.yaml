text: "… حتى أوقفه على عمان فقال: دونك هذا هو ا لجمع مخرمة يديه بمصاه فضرب عثمان فشجه، فقيل له: إنما ضربت أمير المؤمنين عثمان، فسمعت بذلك بنو زهرة فاجتمعوا فى ذلك فقال عثمان: دعوا نديمان لعن اللّٰه نعيمان فقد شهد بدرا! …"
