text: |-
  قوله وزيق القسميص الخ ذكر.
  ساحب التقاموس فى زى ق اه
  • ⁦(فصل السين)⁩
  وقد علم المزنوق أنى أكره • على جعهم كز المنيح المشهر
  ( زوق الزاووق الزثبق فى لغة أهل المدينة وهويقع فى التزاويق لانه يجعل مع الذهب على
  الحديد ثم يدخل فى النارفيذهب منه الزقبق ويبق الذهب ثم قيل ل-كل منقش مزوق وان لم
  يكن فيه الزتبق وزوقت الكلام والسكاب اذا حسنته وقوّمته وزيق القميص ما أحاط
  بالعفق وزيق بن بسطام بن قيس من شيبان وتزيقت المرأة مثل تزيغت اذا تزينت واكتحات
  ( زهق زهق العظسم زهو قا أى اكتنزمخه وزهق المخ اذاا كتنزفهوزاهق عن يعقوب
  والزاهق من الدواب السمين الممخ قال زهير
  القائد انخيل منكوبادوابرها * منها الشنون ومنها الزاهق الزهم
  وأماقول الراجز
  ومسد أمر من أيائق • لسن بأنياب ولاحقائق • ولاضعاف مخهن زاهق
  فانّ الفرّاء يقول هومرفوع والشعر -كفأ يقول بل محهنّ مكتنزرفعه على الابتداء قال
  ولا يجون أن يريد ولا ضعاف زاهوّ مخن كما لا يجوز أن تقول مررت برجل أبوه قائم بالخفض
  وقال غسيره الزاهق ههنا بمعنى الذاهب كأنه قال ولا ضعاف مخهن ثم ردّ الزاهق على الضعاف
  وزهقت نقسه تزهق زهوه أى خرجت وفى الحديث ان النحرفى الحلق واللبة وأقروا الانسر
  حتى تزهق وقال تعالى وتزهق أنفسسهم وهم كافرون قال المؤرّج المزهق القاتل والمزهق
  المقتول قال أبو يوسف زهق الفرس وزهقت الراح-لد تزهق زهو قاذوى زاهقة اذا سبقت
  وتسدمت أمام الحيل وكذلك الرجل المنهزم زاهق والجمع زهق وزهق الياطن أى اشهمل
  وأزهقه اللّه وزهق السهم أى جاوز الهسدف وأزهقه صاحبه وأزهقت الاناء ملاته
  رأت فلانا مزهقا أى مغذافى سيره وفرس ذات أزاهيق أى ذات جرى سريع قال أبو عب
  فى المصنف ولدس فى شئ منه زهق بالسكسر وحكى بعضهم زهقت نفسه بالكسرتزهق زهوة
  لغسة فى زهقت وفلان زهق أى نزق والزهق المطمئنّ من الارض قال الراجز
  كأنّ أيديهن تهوى بالزهق * والزهوق البئر البعيدة القعر وكذلك فج الجبل المشرف
  قال أبو ذؤيب يصف مشتار العسل
  وأشعث ماله فضلات ثول • على أركان مهلمكة زهوق
  وأزهقت الداية السرج اذا قتمته وألقته على عنتها ويقال بالراء قال الراجز
  أخاف أن تزهقه أوينزرق • أنشدنيه أبو الغوث بالزاى وانزهقت الداية أى طفرت من
  الضرب أو النفار والزهلوق بزيادة اللام السمين قال الاصعىّ فى انات حر الوحس اذا
  استوت متونها من الشحم قيل حرزهالق (ز%هرق الزهرقة شدّة الضحك
  سل المين بق سابقته فسبقته سبقاواستبقنا فى العدوأى تسابقنا وقد
  قيل فى قوله تعالى ذه بنا نستَبق اى ننتضل ويقال له سابقة فى هذا الامر اذ اسبق الناس إليه
  والسبق بالتحريك الخطر الذى يوضع بين أهل السباق وسباقا البسازى قيداه من سيرأ وغيره
  ⁦( ستق)⁩ درهم ستوق وستوق أى زيف نبهرج وكل ما كان على هذا المشال فهو مفتوح
  الأوّل الاأربعة أسرف جاءت نوادروهى سبوح وقدوس وذرّتوح وستوق فانها تضم وتفتح
  والمسائق
