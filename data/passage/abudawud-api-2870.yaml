label: { ar: "سنن أبي داود 2870 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 2870 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن ابی داؤد 2870 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Sunan Abi Dawud 2870 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia", fr: "Sunan Abi Dawud 2870 — Testament ou dernières volontés; ce qui a été laissé: biens et héritage" }
text: "حَدَّثَنَا عَبْدُ الْوَهَّابِ بْنُ نَجْدَةَ، حَدَّثَنَا ابْنُ عَيَّاشٍ، عَنْ شُرَحْبِيلَ بْنِ مُسْلِمٍ، سَمِعْتُ أَبَا أُمَامَةَ، سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ اللَّهَ قَدْ أَعْطَى كُلَّ ذِي حَقٍّ حَقَّهُ فَلاَ وَصِيَّةَ لِوَارِثٍ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2870، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2870 (Wills (Kitab Al-Wasaya)), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2870، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2870 (Testamentos (Kitab Al-Wasaya)), menciona un testamento o consejo de despedida, y lo que dejó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2870 (Testaments (Kitab Al-Wasaya)), mentionne un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
