label: { ar: "الموطأ 1403 — هشام بن عروة عن أبيه: قيل للنبي إن ناسا من أهل البادية يأتوننا بلحمان ولا ندري هل سموا الله عليها، فقال سموا الله عليها ثم كلوها", en: "Muwatta 1403", es: "Muwatta 1403", fr: "Muwatta 1403", ur: "موطا 1403", tr: "El-Muvatta 1403 — Hişam ibn Urve, babasının rivayetine göre: Peygambere şöyle denildi: Çölden bazı insanlar bize et getiriyorlar ve üzerine Allah'ın adını anıp anmadıklarını bilmiyoruz. Peygamber şöyle buyurdu: Üzerine Allah'ın adını anın, sonra yiyin.", id: "Al-Muwatta 1403 — Hisham ibn Urwah, dari ayahnya: Dikatakan kepada Nabi: Ada orang-orang dari padang pasir membawa daging kepada kami, dan kami tidak tahu apakah mereka menyebut nama Allah sebelum memakannya. Beliau bersabda: Sebutlah nama Allah sebelum memakannya, lalu makanlah." }
text: "سَمُّوا اللهَ عَليْها، ثُمَّ كُلُوهَا"
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن رسول الله سئل فقيل له إن ناسا من أهل البادية يأتوننا بلحمان ولا ندري هل سموا الله عليها أم لا، فقال سموا الله عليها ثم كلوها. ويذكر المحقق أن الحديث عند جميع رواة الموطأ مرسل، وأن أكثر الرواة رووه موصولا عن عائشة، وأن أبا زرعة الرازي رجح الرواية المرسلة. {cite:muwatta-maruf-1997 p.629}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Allah Resulü'ne, \"Çölden bazı insanlar bize et getiriyorlar ve Allah'ın adını anıp anmadıklarını bilmiyoruz\" diye sorulduğunu aktarır. Resulullah, \"Allah'ın adını anıp afiyetle yiyin\" diye cevap vermiştir. Araştırmacı, hadisin Muvatta'nın tüm ravilerine göre mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu ve çoğu ravi tarafından Aişe'den gelen bağlantılı bir rivayet zinciriyle nakledildiğini belirtmektedir. Ebu Zur'a el-Razi mursal versiyonu tercih etmiştir. {cite:muwatta-maruf-1997 s.629}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, yang juga dari ayahnya, bahwa Rasulullah ditanya, “Ada sebagian orang dari padang pasir yang membawa daging kepada kami, dan kami tidak tahu apakah mereka telah menyebut nama Allah atasnya atau tidak.” Beliau menjawab, “Sebutlah nama Allah atasnya, lalu makanlah.” Peneliti mencatat bahwa hadits ini mursal (hadits dengan rantai periwayatan yang hilang) menurut semua perawi al-Muwatta, dan sebagian besar perawi meriwayatkannya dengan rantai periwayatan yang terhubung dari Aisyah. Abu Zur’ah al-Razi lebih menyukai versi mursal. {cite:muwatta-maruf-1997 p.629}"
