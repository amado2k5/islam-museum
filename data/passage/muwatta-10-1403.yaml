label: { ar: "الموطأ 1403 — هشام بن عروة عن أبيه: قيل للنبي إن ناسا من أهل البادية يأتوننا بلحمان ولا ندري هل سموا الله عليها، فقال سموا الله عليها ثم كلوها", en: "Muwatta 1403" }
text: "سَمُّوا اللهَ عَليْها، ثُمَّ كُلُوهَا"
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن رسول الله سئل فقيل له إن ناسا من أهل البادية يأتوننا بلحمان ولا ندري هل سموا الله عليها أم لا، فقال سموا الله عليها ثم كلوها. ويذكر المحقق أن الحديث عند جميع رواة الموطأ مرسل، وأن أكثر الرواة رووه موصولا عن عائشة، وأن أبا زرعة الرازي رجح الرواية المرسلة. {cite:muwatta-maruf-1997 p.629}"
