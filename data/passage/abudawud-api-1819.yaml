text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا هَمَّامٌ، قَالَ سَمِعْتُ عَطَاءً، أَخْبَرَنَا صَفْوَانُ بْنُ يَعْلَى بْنِ أُمَيَّةَ، عَنْ أَبِيهِ، أَنَّ رَجُلاً، أَتَى النَّبِيَّ وَهُوَ بِالْجِعْرَانَةِ وَعَلَيْهِ أَثَرُ خَلُوقٍ - أَوْ قَالَ صُفْرَةٍ - وَعَلَيْهِ جُبَّةٌ فَقَالَ يَا رَسُولَ اللَّهِ كَيْفَ تَأْمُرُنِي أَنْ أَصْنَعَ فِي عُمْرَتِي فَأَنْزَلَ اللَّهُ تَبَارَكَ وَتَعَالَى عَلَى النَّبِيِّ الْوَحْىَ فَلَمَّا سُرِّيَ عَنْهُ قَالَ \" …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1819، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1819 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1819، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
