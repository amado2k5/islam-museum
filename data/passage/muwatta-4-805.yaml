label: { ar: "الموطأ 805 — ابن عمر كان ينهى عن القبلة والمباشرة للصائم", en: "Muwatta 805", es: "Muwatta 805", fr: "Muwatta 805", ur: "موطا 805", tr: "El-Muvatta 805 — İbn Ömer, oruçlu kişiler için öpüşmeyi ve fiziksel teması yasaklardı.", id: "Al-Muwatta 805 — Ibnu Umar biasa melarang berciuman dan kontak fisik bagi orang yang berpuasa" }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان ينهى عن القبلة والمباشرة للصائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق (7423) و(7438). {cite:muwatta-maruf-1997 p.395}"
  tr: "Malik, Nafi’den rivayetle Abdullah ibn Umar’ın oruçlu olan için öpüşmeyi ve fiziksel teması yasakladığını nakletmiştir. Editör, bunun Malik’ten rivayetle Ebu Mus’ab, Suwaid ve Abd al-Razzaq (7423) ve (7438) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.395}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar melarang berciuman dan kontak fisik bagi orang yang sedang berpuasa. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, dan Abd al-Razzaq (7423) dan (7438). {cite:muwatta-maruf-1997 p.395}"
