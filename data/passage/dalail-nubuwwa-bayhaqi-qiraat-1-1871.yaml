text: "… بن يعقوب بن مجمع بن يزيد الأنصاري، قال : سمعت أبي يعقوب بن مجمع،. يذكر عن عمه عبد الرحمن بن يزيد الأنصاري، عن عمه مجمع بن جارية الأنصاري، قال : وكان أحد القراء الذين قرأوا القرآن، قال : شهدنا الحديبية …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1871، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 1871, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 1871 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 1871, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Dala'il al-Nubuwwa d'al-Bayhaqi, volume 1, page 1871, mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Beyhakî'nin \"Dala'il al-Nubuwwah\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 1871. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi \"Dala'il al-Nubuwwah\" (Bukti Kenabian), Jilid 1, halaman 1871, yang menyebutkan para pembaca Al-Quran; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
