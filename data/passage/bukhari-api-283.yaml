text: "… يَحْيَى، قَالَ حَدَّثَنَا حُمَيْدٌ، قَالَ حَدَّثَنَا بَكْرٌ، عَنْ أَبِي رَافِعٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ لَقِيَهُ فِي بَعْضِ طَرِيقِ الْمَدِينَةِ وَهْوَ جُنُبٌ، فَانْخَنَسْتُ مِنْهُ، فَذَهَبَ فَاغْتَسَلَ، ثُمَّ جَاءَ فَقَالَ \" أَيْنَ كُنْتَ يَا أَبَا هُرَيْرَةَ \". قَالَ كُنْتُ جُنُبًا، فَكَرِهْتُ أَنْ أُجَالِسَكَ وَأَنَا عَلَى غَيْرِ طَهَارَةٍ. فَقَالَ \" سُبْحَانَ اللَّهِ، إِنَّ الْمُؤْمِنَ لاَ يَنْجُسُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 283، يذكر وصف المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 283 (Bathing (Ghusl)), that mentions a description of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 283، جس میں مومن کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 283 (El baño ritual (Ghusl)), menciona una descripción del creyente. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 283 (Le bain rituel (Ghusl)), mentionne une description du croyant. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
