text: "النوع الثالث: معرفة الفواصل ورؤوس الآي قالت: كان يقطع قراءته آية آية وقرأت: بِسْمِ اللَّهِ الرَمِ الرَّحِيَةِ إلى الَّذِينَ تقف على كل آية فمعنى يقطع قراءته آية آية أي يقف على كل آية، وإنما كانت قراءته والية كذلك ليعلم رءوس …"
summary:
