label: { ar: "سنن ابن ماجه 149 — الأب والأبوة", en: "Sunan Ibn Majah 149 — the father and fatherhood", ur: "سنن ابن ماجہ 149 — باپ اور والدیت" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ مُوسَى، وَسُوَيْدُ بْنُ سَعِيدٍ، قَالاَ حَدَّثَنَا شَرِيكٌ، عَنْ أَبِي رَبِيعَةَ الإِيَادِيِّ، عَنِ ابْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" إِنَّ اللَّهَ أَمَرَنِي بِحُبِّ أَرْبَعَةٍ وَأَخْبَرَنِي أَنَّهُ يُحِبُّهُمْ \". قِيلَ يَا رَسُولَ اللَّهِ مَنْ هُمْ قَالَ \" عَلِيٌّ مِنْهُمْ \". يَقُولُ ذَلِكَ ثَلاَثًا \" وَأَبُو ذَرٍّ وَسَلْمَانُ وَالْمِقْدَادُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 149، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 149 (The Book of the Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 149، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
