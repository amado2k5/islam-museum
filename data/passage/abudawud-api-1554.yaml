label: { ar: "سنن أبي داود 1554 — السقم، الجذام والبرص", en: "Sunan Abi Dawud 1554 — sickness; leprosy and vitiligo", ur: "سنن ابی داؤد 1554 — سقم، جذام اور برص", es: "Sunan Abi Dawud 1554 — enfermedad; lepra y vitíligo", fr: "Sunan Abi Dawud 1554 — maladie; lèpre et vitiligo", tr: "Sunan Abi Davud 1554 — Hastalık, Cüzzam ve Vitiligo", id: "Sunan Abi Dawud 1554 — Penyakit, Kusta dan Vitiligo" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، أَخْبَرَنَا قَتَادَةُ، عَنْ أَنَسٍ، أَنَّ النَّبِيَّ كَانَ يَقُولُ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ وَالْجُنُونِ وَالْجُذَامِ وَمِنْ سَيِّئِ الأَسْقَامِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1554، يذكر السقم، والجذام والبرص. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 1554 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), that mentions sickness, leprosy and vitiligo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 1554، جس میں سقم، جذام اور برص کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1554 (Oración (Kitab Al-Salat): Instrucciones detalladas sobre el Witr), menciona enfermedades, lepra y vitiligo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 1554 (La Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), mentionne la maladie, la lèpre et le vitiligo. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l’anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Abi Davud'da yer alan 1554 numaralı hadiste hastalık, cüzzam ve vitiligo'dan bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1554, menyebutkan penyakit, kusta, dan vitiligo. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
