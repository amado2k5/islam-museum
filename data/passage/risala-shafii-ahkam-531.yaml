text: "… مَن معه، فبَعتَ معهم ابنَ سعيدِ بنِ العاصِ. - وبَعث مماذَبن جَبَلٍ إلى المِنِ، وأمرَه أن يقاتلَ مَن أطاعه مَن عصاه، ويُعلَّمَهَم ما فرضَ اللهُ عليهم، ويأخذَ منهم ما وجب عليهم، لممرفتهم بعماذٍ، ومكانِه منهم، وصدقِه. وكلُ مَن وَلَّى فقد …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 531، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 531, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 531 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 531, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 531, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi 531. sayfadan, Allah ve Resulü'nün emrettiği, farz olan ve sorumlu kişiden beklenenleri anlatan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan, görevler, itaat gerektiren, tavsiye edilen, mekruh olan, haram olan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari risalah Al-Shafi'i, halaman 531, yang menyebutkan apa yang telah diperintahkan Allah dan Rasul-Nya, amalan-amalan wajib, dan apa yang dituntut dari orang yang bertanggung jawab; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan-amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
