summary:
  ar: "القسم 84 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب كفارات الأيمان»، ويضم فيها النصوص من 6708 إلى 6722 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 84 of Sahih al-Bukhari (Expiation for Unfulfilled Oaths) in the division of the open hadith dataset the museum took its reports from: reports 6708 to 6722 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 84، عنوان «کتاب کفارات الایمان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6708 تا 6722۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 84 de Sahih al-Bukhari (Expiación por juramentos no cumplidos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 6708 a 6722 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 84, « Expiation des serments non accomplis »), dans la partie ouverte du recueil: les hadiths 6708 à 6722. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 84. bölümü \"Yeminler İçin Kefaret Kitabı\" başlığını taşımakta olup, 6708 ile 6722 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 84 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Penebusan Sumpah\" dan berisi teks 6708 hingga 6722, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
