text: "… أَبِي هُرَيْرَةَ وَعَلَيْهِ ثَوْبَانِ مُمَشَّقَانٍ مِنْ كَتَّانٍ فَمَخَطَ في أَحَدِهِمَا ثُمَّ قَالَ بَخْ بَغْ يَتَمَخَّطُ أَبُو هُرَيْرَةَ في الكَتَّانِ، لَقَد رَأَيْتُني وَإِنِّي لَأَخِرُّ فِيمَا بَيْنَ مِنْبُرِ رَسُولِ اللهِ لِ م وَحُجْرَةِ عَائِشَةَ مِنَ الْجُوع مَغْشِيًّا عَلَيَّ فَيَجِيءُ الْجَائِي فَيَضَعُ رِجْلَهُ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 539، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
