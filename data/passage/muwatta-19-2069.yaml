label: { ar: "الموطأ 2069 — مالك: فيمن يساقي الأرض فيها النخل والكرم وما أشبهه من الأصول، وفيها الأرض البيضاء: إذا كان البياض تبعا للأصل وكان الأصل أعظم وأكثر فلا بأس بمساقاته، فإن كان الأصل الثلث أو أقل والبياض الثلثين أو أكثر، جاز فيه الكراء وحرمت فيه المساقاة", en: "Muwatta 2069" }
summary:
  ar: "قال مالك في الرجل يساقي الرجل الأرض، فيها النخل والكرم، أو ما أشبه ذلك من الأصول، فتكون فيها الأرض البيضاء: إذا كان البياض تبعا للأصل، وكان الأصل أعظم من ذلك وأكثر، فلا بأس بمساقاته. وذلك أن يكون النخل الثلثين أو أكثر، ويكون البياض الثلث أو أقل من ذلك. فإذا كان الأصل الثلث أو أقل، والبياض الثلثين أو أكثر، جاز في ذلك الكراء وحرمت فيه المساقاة. {cite:muwatta-maruf-1997 p.245} {cite:muwatta-maruf-1997 p.246}"
