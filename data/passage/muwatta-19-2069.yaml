label: { ar: "الموطأ 2069 — مالك: فيمن يساقي الأرض فيها النخل والكرم وما أشبهه من الأصول، وفيها الأرض البيضاء: إذا كان البياض تبعا للأصل وكان الأصل أعظم وأكثر فلا بأس بمساقاته، فإن كان الأصل الثلث أو أقل والبياض الثلثين أو أكثر، جاز فيه الكراء وحرمت فيه المساقاة", en: "Muwatta 2069", es: "Muwatta 2069", fr: "Muwatta 2069", ur: "موطا 2069", tr: "El-Muvatta 2069 — Malik: Hurma ağaçları, üzüm bağları ve benzeri bitkiler içeren araziyi ve ayrıca verimsiz araziyi paylaşan kimse hakkında: Eğer verimsiz arazi bitki örtüsünün bir parçasıysa ve bitki örtüsü daha büyük ve daha çok sayıdaysa, araziyi paylaşmak caizdir. Ancak, bitki örtüsü arazinin üçte birinden azını, verimsiz arazi ise üçte ikisinden fazlasını oluşturuyorsa, kiralamak caizdir, ancak araziyi paylaşmak haramdır.", id: "Al-Muwatta 2069 — Malik: Mengenai seseorang yang membagi lahan yang berisi pohon kurma, tanaman anggur, dan tanaman sejenis, serta lahan tandus: Jika lahan tandus tersebut merupakan bagian dari tanaman dan tanaman tersebut lebih besar dan lebih banyak, maka membagi lahan tersebut diperbolehkan. Namun, jika tanaman tersebut sepertiga atau kurang dari lahan dan lahan tandus tersebut dua pertiga atau lebih, maka menyewa diperbolehkan, tetapi membagi lahan tersebut diharamkan." }
summary:
  ar: "قال مالك في الرجل يساقي الرجل الأرض، فيها النخل والكرم، أو ما أشبه ذلك من الأصول، فتكون فيها الأرض البيضاء: إذا كان البياض تبعا للأصل، وكان الأصل أعظم من ذلك وأكثر، فلا بأس بمساقاته. وذلك أن يكون النخل الثلثين أو أكثر، ويكون البياض الثلث أو أقل من ذلك. فإذا كان الأصل الثلث أو أقل، والبياض الثلثين أو أكثر، جاز في ذلك الكراء وحرمت فيه المساقاة. {cite:muwatta-maruf-1997 p.245} {cite:muwatta-maruf-1997 p.246}"
  tr: "Malik, hurma ağaçları, üzüm bağları veya benzeri bitki örtüsü bulunan ve bir kısmı ekilmemiş arazi olan bir araziyi başka bir adamla paylaşan bir kişi hakkında şunları söyledi: Eğer ekilmemiş arazi bitki örtüsünün bir parçasıysa ve bitki örtüsü daha büyük ve daha bol ise, ortakçılık anlaşmasında bir sakınca yoktur. Bu, hurma ağaçlarının arazinin üçte ikisini veya daha fazlasını, ekilmemiş arazinin ise üçte birini veya daha azını oluşturduğu durumlarda geçerlidir. Ancak, bitki örtüsü üçte birini veya daha azını, ekilmemiş arazi ise üçte ikisini veya daha fazlasını oluşturuyorsa, o zaman kiralama caizdir, ancak ortakçılık yasaktır. {cite:muwatta-maruf-1997 s.245} {cite:muwatta-maruf-1997 s.246}"
  id: "Malik berkata mengenai seorang pria yang berbagi lahan dengan pria lain, yang berisi pohon kurma, tanaman anggur, atau vegetasi serupa, dan terdapat sebagian lahan yang tidak diolah: jika lahan yang tidak diolah tersebut merupakan bagian dari vegetasi, dan vegetasi tersebut lebih luas dan lebih banyak, maka tidak ada masalah dalam perjanjian bagi hasil. Ini berlaku jika pohon kurma mencakup dua pertiga atau lebih dari lahan, dan lahan yang tidak diolah mencakup sepertiga atau kurang. Namun, jika vegetasi mencakup sepertiga atau kurang, dan lahan yang tidak diolah mencakup dua pertiga atau lebih, maka menyewa diperbolehkan, tetapi bagi hasil dilarang. {cite:muwatta-maruf-1997 p.245} {cite:muwatta-maruf-1997 p.246}"
