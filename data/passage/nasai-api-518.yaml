label: { ar: "سنن النسائي 518 — الأب والأبوة", en: "Sunan al-Nasa'i 518 — the father and fatherhood", ur: "سنن نسائی 518 — باپ اور والدیت", es: "Sunan al-Nasa'i 518 — El padre y la paternidad" }
text: "أَخْبَرَنَا أَبُو دَاوُدَ، قَالَ حَدَّثَنَا سَعِيدُ بْنُ عَامِرٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ، عَنْ نَصْرِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ جَدِّهِ، مُعَاذٍ أَنَّهُ طَافَ مَعَ مُعَاذِ ابْنِ عَفْرَاءَ فَلَمْ يُصَلِّ فَقُلْتُ أَلاَ تُصَلِّي فَقَالَ إِنَّ رَسُولَ اللَّهِ قَالَ \" لاَ صَلاَةَ بَعْدَ الْعَصْرِ حَتَّى تَغِيبَ الشَّمْسُ وَلاَ بَعْدَ الصُّبْحِ حَتَّى تَطْلُعَ الشَّمْسُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 518، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 518 (The Book of the Times (of Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 518، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 518 (El Libro de los Tiempos de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
