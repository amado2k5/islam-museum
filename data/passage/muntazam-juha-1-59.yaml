  tr: "Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Kralların ve Milletlerin Tarihindeki Düzenlilik), Resimli Cilt 1, s. 59'dan, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
