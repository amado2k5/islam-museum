text: "… او.رجل -. صين الحكم عنه • انيانا ابن ابى طاهر البزار قال انبانا على بن الحسن التنونى عن ابيه قال حدتى ابو الحسين على بن هشام تال سمعت القاضى ابا جعفر احمد بن اسحاق بن البهلول التنوخى يحدث ابى قال …"
summary:
  ar: "مقطع من المنتظم في تاريخ الملوك والأمم، المجلد المصوَّر 1، ص 59، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Muntazam of Ibn al-Jawzi, scan volume 1, p. 59, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "المنتظم ابن الجوزی، اسکین جلد 1، ص 59 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
