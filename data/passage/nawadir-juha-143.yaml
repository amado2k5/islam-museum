label: { ar: "نوادر جحا الكبرى، ص 67 — «كفى عناداً ضعي للحمار عليقه»", en: "Nawadir Juha al-Kubra, p. 67 — 'Enough Stubbornness, Feed the Donkey'", ur: "نوادر جحا الکبریٰ، ص 67 — «بس ضد چھوڑو، گدھے کو چارہ ڈالو»", fr: "Nawadir Juha al-Kubra, p. 67 — « Assez d'entêtement, donne du fourrage à l'âne »", es: "Nawadir Juha al-Kubra, p. 67 — «Basta de terquedad, ponle forraje al burro»", tr: "Juha'nın Büyük Fıkraları, s. 67 — “Yeterince inatçılık yaptın, eşeğe yem ver.”", id: "Anekdot Hebat Juha, hlm. 67 — “Cukup sudah keras kepala, beri makan keledai itu.”" }
text: "نوادر جحا الكبرى فأنزوى الشيخ في جانب من غرفة البيت، وظلِّ ساعاتٍ متواليةً ساكِتاً لا بنبِسُ ببنت شفةٍ، وضاق ذرع المرأة، فخرجت، وذهبَت إلى الجيران، وظلَّتْ حتى الغروب، وقد قصّتِ القصةَ على جارتِها، وقالت أنا أعلم أنَّهُ عنيدٌ، وربَّما ماتَ …"
summary:
  ar: "بقي جحا صامتًا فسرق لص أغراضه وحتى طاقيته؛ وجاء ابن الجار بشوربة وفهم الإشارات فصبّها على رأس جحا؛ وجاءت الزوجة، فلم يزد جحا على أن قال أن تُعلف الحمار. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  en: "Juha stays silent, a thief takes his goods and even his cap; a neighbour's boy comes with soup, understands the signs, and pours the soup over Juha's head; the wife comes, and Juha only says to feed the donkey. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  ur: "جحا خاموش رہا اور ایک چور اس کا سامان حتیٰ کہ ٹوپی تک لے گیا؛ پڑوسی کا لڑکا شوربہ لے کر آیا، اشارے سمجھ گیا اور شوربہ جحا کے سر پر انڈیل دیا؛ بیوی آئی تو جحا نے بس اتنا کہا کہ گدھے کو چارہ ڈالو۔ {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  fr: "Juha reste muet, un voleur emporte ses affaires et même son bonnet; le fils d'un voisin vient avec de la soupe, comprend les signes et la verse sur la tête de Juha; la femme arrive, et Juha dit seulement de donner du fourrage à l'âne. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  es: "Juha guarda silencio, un ladrón se lleva sus cosas e incluso su gorro; el hijo de un vecino llega con sopa, entiende las señas y se la vierte a Juha sobre la cabeza; llega la mujer, y Juha solo dice que le den forraje al burro. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
  tr: "Juha sessiz kaldı, bu yüzden bir hırsız eşyalarını, hatta şapkasını bile çaldı. Komşunun oğlu çorba getirdi, işaretleri anladı ve Juha'nın başına döktü. Karısı geldiğinde, Juha ona sadece eşeği beslemesini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 67}"
  id: "Juha tetap diam, sehingga seorang pencuri mencuri barang-barangnya, bahkan topinya. Anak tetangga membawa sup, memahami isyaratnya, dan menuangkannya ke kepala Juha. Ketika istrinya datang, Juha hanya menyuruhnya memberi makan keledai. {cite:juha-nawadir-kubra-djuwaydi p. 67}"
