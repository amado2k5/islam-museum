text: "… الى الكسر وحكى الاخفش عن بعضهم حَرِئ من دَرَأْتُه وهمزها وجعلها على فَعِيل مُفْتُوحةَ الأوّل قال وذلك من تَلَاً تِه قال القراء والعرب تسعى الكواكِبّ العظام التى لاأُعرف أسما وها. الّدارِي التهذيب وقوله تمال كانها كُوْكَبُ مُدِي روى عن عاصم …"
