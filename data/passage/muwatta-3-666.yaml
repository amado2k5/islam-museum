label: { ar: "الموطأ 666 — مالك: من كان له ذهب أو ورق متفرقة بأيدي أناس شتى أحصاها جميعاً وأخرج زكاتها", en: "Muwatta 666", es: "Muwatta 666", fr: "Muwatta 666", ur: "موطا 666", tr: "El-Muvatta 666 — Malik: Kimin çeşitli kişilerin elinde dağılmış altın veya gümüşü varsa, hepsini sayıp zekâtını versin.", id: "Al-Muwatta 666 — Malik: Barangsiapa mempunyai emas atau perak yang tersebar di tangan berbagai orang, hendaklah ia menghitung semuanya dan membayar zakatnya." }
summary:
  ar: "قول لمالك: إذا كانت لرجل ذهب أو ورق متفرقة بأيدي أناس شتى فإنه ينبغي له أن يحصيها جميعاً ثم يخرج ما وجب عليه من زكاتها كلها. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.338} {cite:muwatta-maruf-1997 p.339}"
  tr: "Malik şöyle demiştir: Bir kimse çeşitli kişilerin eline altın veya gümüş dağıtmışsa, hepsini saymalı ve sonra hepsinin zekâtını ödemelidir. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.338} {cite:muwatta-maruf-1997 s.339}"
  id: "Malik berkata: Jika seseorang telah menyebarkan emas atau perak di tangan berbagai orang, maka ia harus menghitung semuanya dan kemudian membayar zakat yang wajib dibayarkan atas semuanya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.338} {cite:muwatta-maruf-1997 p.339}"
