  الياء لاجتماع الساكنين والكشيرحقىّ وهو فعول قلبت الواوالاولى ياء لتدغم فى التى
  بعدها والحة وأيضا الخصر ومشد الازار كى حكيت عنه الكلام حكاية وحكوت
  لغة حكاها أبو عبيدة وحكيت فعله وحاكيته اذافعات مثل فعله وهيئته والمماكاة المشابهة
