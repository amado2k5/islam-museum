text: "… : انتهى الزهد إلى ثمانية من التابعين فأما الربيع بن خيتم فقيل له حين أصابه الفالج لوتداويت، فقال لقد علمت أن الدواء حق ولكن ذكرب عاداً وموداً وأهاب الرس وقرونا بين ذلك كثيرا كانت فيهم الأوجاع وكانت لطم الأطباء فلا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 106، يذكر الطب والطبيب، والوجع، وأسماء الأمراض، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 106, that mentions medicine and the physician, pain, named diseases, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 106 کا اقتباس جس میں طب اور طبیب، درد، بیماریوں کے نام، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 2, pág. 106, que menciona la medicina y el médico, el dolor, las enfermedades específicas y el medicamento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 2, p. 106, qui mentionne la médecine et le médecin, la douleur, les maladies nommées, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nu'aym'ın Hilyat al-Awliya' adlı eserinin resimli 2. cildinin 106. sayfasından bir alıntı; tıp, hekim, ağrı, hastalıkların isimleri ve ilaçlardan bahsediyor; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 2, hlm. 106, yang menyebutkan tentang pengobatan, dokter, rasa sakit, nama-nama penyakit, dan obat-obatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
