label: { ar: "الموطأ 703 — مالك: البقر والجواميس تجمع في الصدقة على ربها، إنما هي بقر كلها", en: "Muwatta 703", es: "Muwatta 703", fr: "Muwatta 703", ur: "موطا 703", tr: "Al-Muwatta 703 — Malik: İnekler ve bufalolar, sahipleri adına sadaka olarak toplanırlar, çünkü hepsi inektir.", id: "Al-Muwatta 703 — Malik: Sapi dan kerbau dikumpulkan sebagai sedekah karena menjadi milik pemiliknya, sebab semuanya adalah sapi." }
summary:
  ar: "قول لمالك: وكذلك البقر والجواميس تُجمع في الصدقة على ربها لأنها بقر كلها، فإن كانت البقر أكثر ولم يجب إلا بقرة واحدة أُخذت من البقر، وإن كانت الجواميس أكثر أُخذ منها، فإن استوتا فمن أيتهما شاء، فإذا وجبت في ذلك الصدقة صُدّق الصنفان جميعاً. ويذكر المحقق أن في نسخة «يجمعان». {cite:muwatta-maruf-1997 p.352}"
  tr: "Malik şöyle dedi: Aynı şekilde, sığırlar ve mandalar da sahiplerine düşen zekâtta birleştirilir, çünkü hepsi sığırdır. Eğer daha fazla sığır varsa ve sadece bir sığır zekâtı verilecekse, sığırlardan alınır. Eğer daha fazla manda varsa, onlardan alınır. Eğer sayıları eşitse, dilediğini seçebilir. Eğer zekât o hayvan türü için verilmişse, her iki tür de verilir. Editör, bir versiyonda \"Birleştirilirler\" şeklinde yazıldığını belirtiyor. {cite:muwatta-maruf-1997 s.352}"
  id: "Malik berkata: Demikian pula, sapi dan kerbau digabungkan dalam zakat yang wajib dibayarkan pemiliknya karena semuanya adalah sapi. Jika ada lebih banyak sapi dan hanya satu sapi yang wajib dizakati, maka zakat diambil dari sapi-sapi tersebut. Jika ada lebih banyak kerbau, maka zakat diambil dari kerbau-kerbau tersebut. Jika jumlahnya sama, maka ia dapat memilih mana yang diinginkannya. Jika zakat wajib dibayarkan untuk jenis hewan tersebut, maka kedua jenis hewan tersebut diberikan. Editor mencatat bahwa dalam satu versi tertulis, “Mereka digabungkan.” {cite:muwatta-maruf-1997 p.352}"
