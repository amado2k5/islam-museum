label: { ar: "الموطأ 703 — مالك: البقر والجواميس تجمع في الصدقة على ربها، إنما هي بقر كلها", en: "Muwatta 703" }
summary:
  ar: "قول لمالك: وكذلك البقر والجواميس تُجمع في الصدقة على ربها لأنها بقر كلها، فإن كانت البقر أكثر ولم يجب إلا بقرة واحدة أُخذت من البقر، وإن كانت الجواميس أكثر أُخذ منها، فإن استوتا فمن أيتهما شاء، فإذا وجبت في ذلك الصدقة صُدّق الصنفان جميعاً. ويذكر المحقق أن في نسخة «يجمعان». {cite:muwatta-maruf-1997 p.352}"
