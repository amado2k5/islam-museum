label: { ar: "جامع الترمذي 3908 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 3908 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 3908 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ حَدَّثَنَا أَبُو يَحْيَى الْحِمَّانِيُّ، عَنِ الأَعْمَشِ، عَنْ طَارِقِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" اللَّهُمَّ أَذَقْتَ أَوَّلَ قُرَيْشٍ نَكَالاً فَأَذِقْ آخِرَهُمْ نَوَالاً \". هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ. حَدَّثَنَا عَبْدُ الْوَهَّابِ الْوَرَّاقُ، قَالَ حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ الأُمَوِيُّ، عَنِ الأَعْمَشِ، نَحْوَهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3908، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3908 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3908، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
