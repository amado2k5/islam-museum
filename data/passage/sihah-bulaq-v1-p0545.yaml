text: |-
  ٩٦
  ومن يغترب عن قومه لايزل يرى • مصارع مظلوم مجزاومسحبا
  وتدفن منه الصالحات وان يسئ • يكن ما أساء النار فى رأس كبكا
  تقرش وا يمكم والتدوقال الجمدع ذي وكتب وقسد كنيت كتياو كا بإركاية والكاب
  يا ابنة عى كتاب اللّٰه أخرجف • عنكم وهل أمنعنّ اللّٰه ماذعلا
  قال ابن الاعرابى الكاتب عندهم العالم قال اللّٰه تعالى أم عندهم الغيب فهم يكتبون
  والكتب الجمع تقول منه كتبت البغلة اذا بمعت بينشفر يها محلقة أوسير أكتب وأكتب
  كتبا وكتبت القربة أيضا كتبا اذاخر زتها فهى كتيب والمكتبة بالضم الخرزة قال ذوالرمة
  وفرا غرفية أناى خوارزها • مشلشل ضيعته بينها الكتب
  والكتاب الكتبة والكتاب أيضاو المكتب واحد والجمع الكاتيب والكتاب أيضاسهم صف
  مدوّر الرأس يتعلم به الصيّ الرمى وبالثاء أيضاوالتاء فى هذا الحرف أعلى من الثاء والكتد.
  الجيس تقول منه كتب فلان المكتائب تكتيبا أى عباها كتيبة كتيبة وتكتبت الخيل أى
  جمعت قال أيوزيد كتبت الناقة تكتيبا اذاصررتها وتقول أكتبنى هذه القصد
  أى أملها على وأكتبت القرية أيضاشددتها بالو كاء وكذلك كتبتها كتيافهى مكتب وكتيب
  واكتتيث الكتاب أى كنته ومنه قوله تعالى اكتتبها فهى على عليه وتقول أيضا اكتتب
  الرجل اذا كتب نفه فى ديوان اللطان والمكتب الذى يعلم الكتابة قال الحسن كان
  الحجاج مكنيا بالطائف يعنى معلما واستكتبه الشئ أى سأله أن يكتبه له والمكاتية والتكاتب
  بمعق والمكاتب العبد يكاتب على نفسه يتمثه فاذاسعى وأدامعنق كثب كثيت الشئ
  أكتبه كثبا اذأجعته وانكثب الرمل أى اجتمع وكل ما انصب فى شى فقدانمكتب فيه ومنه
  سعي الكئيب من الرمل لانه انصب فى مكان فاجتمع فيه وابهع الكثبان وهى تلال الرمل
  والسكنبة من اللبن قد رحلية وقال أبوزيدمل* القدح من اللبن والجمع كتب قال الراجز
  برح بالعينين خطاب الكشب• يقول انى خاطب وقد كذب واغمايخطب عسا من حاب
  يعنى الرجل يأتى بعلة الخطبة واغمايريد القرى وكل شى يمعته من طعام أو غيره بعد أن يكون
  قلي لافهو كثبة والكشب بالتحريك القرب يقال رماء من كشب ويقال أكتبك الصيد أى
  المكنت والكة بايمج رة مادقات الطسى • مكان الذبي من الكائب
  والكائبة من القرس مقدم المنسج حيث تقع عليه يد الفارس ⁦(كذب)⁩ كذب كذباو كذبا
  فوكاذب وكذاب وكذوب وكيذيان ومكذيان ومكذباتة وكذية مثال هسمزة وكذيذب
  مخفف وقد يشقد وأنشدأبوزيد واذا أ تالك بأننى قديعتها * بوصال غائية فقل كذيذب
  والكذب جع كاذب مثل راكع وركع قال الشاعر
  متى يقل تنفع الاقوام قولته • اذا ضمجل حديث المكذب الواعه
  والتكاذب ضد التصادق والكذب جمع كذوب مثل صبور وصبر ومنه قرأبعضهم ولا تقولوا
  لما تصف ألنتكم الكذب نجعله نعتاللالسنة والاكذوية الكذب وأكذيت الرجل ألفيقه
  اذيا
