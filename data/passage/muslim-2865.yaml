label:
  ar: "مسلم 2865 — إني خلقت عبادي حنفاء كلهم"
  en: "Muslim 2865 — I created all My servants upright in faith"
  ur: "مسلم 2865 — میں نے اپنے سب بندوں کو یکسو پیدا کیا"
text: "ألا إن ربي أمرني أن أعلمكم ما جهلتم مما علمني يومي هذا كل مال نحلته عبدا حلال وإني خلقت عبادي حنفاء كلهم وإنهم أتتهم الشياطين فاجتالتهم عن دينهم وحرمت عليهم ما أحللت لهم وأمرتهم أن يشركوا بي ما لم أنزل …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2865: إني خلقت عبادي حنفاء كلهم. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2865: I created all My servants upright in faith. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2865: میں نے اپنے سب بندوں کو یکسو پیدا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
