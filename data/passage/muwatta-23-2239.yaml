label: { ar: "الموطأ 2239 — مالك: الأمر عندنا أن من نحل ابنا له صغيرا ذهبا أو ورقا، ثم هلك وهو يليه، فإنه لا شيء للابن من ذلك، إلا أن يكون الأب عزلها بعينها، أو دفعها إلى رجل وضعها لابنه عند ذلك الرجل، فإن فعل ذلك فهو جائز للابن", en: "Muwatta 2239", es: "Muwatta 2239", fr: "Muwatta 2239", ur: "موطا 2239", tr: "El-Muvatta 2239 — Malik: Bizim hükmümüz şudur: Bir kimse genç oğluna altın veya gümüş verirse ve oğul henüz hayattayken ölürse, baba bunu özellikle bir kenara ayırmadıkça veya bir adama verip o adamın da oğluna emanet etmedikçe, oğlunun buna hakkı yoktur. Eğer baba bunu yapmışsa, oğulun buna hakkı vardır.", id: "Al-Muwatta 2239 — Malik: Hukum di pihak kami adalah jika seseorang memberikan emas atau perak kepada anaknya yang masih kecil, dan kemudian anak tersebut meninggal dunia sementara sang ayah masih hidup, maka anak tersebut tidak berhak atas harta itu, kecuali jika sang ayah secara khusus menyisihkannya, atau memberikannya kepada seorang pria yang kemudian mempercayakannya kepada anaknya. Jika ia melakukan hal itu, maka harta tersebut diperbolehkan bagi anak tersebut." }
summary:
  ar: "قال مالك: الأمر عندنا أن من نحل ابنا له صغيرا ذهبا أو ورقا، ثم هلك وهو يليه، فإنه لا شيء للابن من ذلك، إلا أن يكون الأب عزلها بعينها، أو دفعها إلى رجل وضعها لابنه عند ذلك الرجل. فإن فعل ذلك فهو جائز للابن. {cite:muwatta-maruf-1997 p.321}"
  tr: "Malik şöyle dedi: Bizde yerleşik uygulama şudur ki, bir kimse genç oğluna altın veya gümüş verirse ve oğul henüz hayattayken ölürse, baba bunu özellikle bir kenara ayırmadıkça veya bir adama verip o adamın da oğluna emanet etmesi durumu hariç, oğul bundan hiçbirine hak kazanamaz. Eğer baba bunu yapmışsa, oğulun buna hakkı vardır. {cite:muwatta-maruf-1997 s.321}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah jika seseorang memberikan emas atau perak kepada anaknya yang masih kecil, dan kemudian anak tersebut meninggal dunia sementara sang anak masih hidup, maka anak tersebut tidak berhak atas harta tersebut, kecuali jika sang ayah secara khusus menyisihkannya, atau memberikannya kepada seseorang yang kemudian mempercayakannya kepada anaknya. Jika demikian, maka harta tersebut diperbolehkan bagi anak tersebut. {kutipan:muwatta-maruf-1997 hlm. 321}"
