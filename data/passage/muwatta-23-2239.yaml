label: { ar: "الموطأ 2239 — مالك: الأمر عندنا أن من نحل ابنا له صغيرا ذهبا أو ورقا، ثم هلك وهو يليه، فإنه لا شيء للابن من ذلك، إلا أن يكون الأب عزلها بعينها، أو دفعها إلى رجل وضعها لابنه عند ذلك الرجل، فإن فعل ذلك فهو جائز للابن", en: "Muwatta 2239" }
summary:
  ar: "قال مالك: الأمر عندنا أن من نحل ابنا له صغيرا ذهبا أو ورقا، ثم هلك وهو يليه، فإنه لا شيء للابن من ذلك، إلا أن يكون الأب عزلها بعينها، أو دفعها إلى رجل وضعها لابنه عند ذلك الرجل. فإن فعل ذلك فهو جائز للابن. {cite:muwatta-maruf-1997 p.321}"
