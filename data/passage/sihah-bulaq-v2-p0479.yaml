text: |-
  ١١٠٨
  ما أتم غفر على دعجاءذى علق * يتفى القراميد عنها الاعصم الوقل
  والعلق الذى تعاق به البكرة من القسامة يقال أعرتى علقك أى أداة بكرتك والعلق أيضا
  الهوى يقال نظرة من ذى علق قال الشاعر
  ولقد أردت الصبر عنك نعاقى • علق بقابى من «وال قديم
  وقد علقها بالكسر وعلق حبها بقلبه أى هويها وعلق بح اعلوقا وعاق يفعل كذامثل
  طفق قال الراجز
  علق -وضى نغرمكب • اذا غفلت غفلة يعبة
  أى طفق يرده ويقال أحبه واعتاده وة ولهم فى المثل علقت معالقهارصرّا لجندب أصله
  أنّ رجلا انتهسى الى بترفأ علق رشاءه برشائها ثم صار الى صاحب البتر فادعى جواره
  فقال له وماسبب ذلك قال علقت رشائى برشائك فأبى صاحب البتروأ هره أن يرتحل
  فقال علقتمعالقها وصرًا لجندب أى جاء الحرولا يمكنى الرحيل وعلقت المرأة أى -بات
  وعلقت الابل العضاه اذا تسمتها أى رعتها من أعلاها وعلق الظبي فى الحبالة وعلقت الدابه
  أيضا اذا شر بت الماءفعلقت بها العلقة ويقال علق به علتا أى تعلق به والعاق ما تقبلغ به
  الماشية من الشجروكذلك العلقة بالضم وكل ما يتبلغ به من العيس فهو علقة ويقال أيضا
  لم تبق لى عنده علقة أشئ وأصاب توبى علق بالفتح وهوماعاقه جذبه والعلق بالكسر
  النفيس من كل شي يقال علق مضنة أى مايضنّ به والمع أعلاق، وأماقول الساعر
  اذاذت فاهاقلت عاق مدمس • أريد به قبل فغودر فى سأب
  فانماريدبه الار عاها بذلك لنفاستها والعلقة أيضاتوب صغيروهو أول توب يتخسذللصى
  والعلوق ما يعاق بالانسان والمفية عاوق وعلاقة قال المفضل النكرىّ
  وسائلة بثعلبة بن سير • وقد علقت بذعلبة العلموق
  والعسلوق المعالق وهى الناقة تعطف على غير ولدها فلاترأمه وانماتشمسه بأنفها وتنع لبنها
  قال المعدى
  ومانحنى كناح العاو • قماتزبى غ-رتضرب
  وما بالناقة علوق أى شى من اللبن والعلوق ما تعلقه الابل أى ترعاه وقال الاعشى
  هو الواهب المائة المصطفا • لاط العلوق بجنّ احرارا
  يقول رعين العاوق-قلاط بهسنّ الاحرار من السمن والخصب ويتال أراد بالعلوق الولد
  فى بطنها وأراد بالاحرارحسن لونها عند اللقيح والعاق القضيم وعلقت الابل العضاه تعلق
  بالضم علقا اذا تسمتها وتناولتها بافواهها وهى أبل عوالق ومعزى عوالق قال السكميت
  يصف ناقته!
  أوفوق طاوية الحشى رملية * ان تدن من فنن الالاءقتعلق
  يقول كان قتودى فوق بقرة وحشية وفى الحديث أرواح الشهداء فى حواصل طير خضر
  تعلق من ورق الجنة والعليقة البعيريوجهه الرجل مع قوم يمتارون فيعطيهم دراهم وعليقة
  ليمتار واله عليها قال الشاعر
  وقائلة
