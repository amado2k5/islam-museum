label: { ar: "الموطأ 2661 — كعب الأحبار: نعلا موسى كانتا من جلد حمار ميت", en: "Muwatta 2661" }
summary:
  ar: "يروي مالك عن عمه أبي سهيل بن مالك عن أبيه عن كعب الأحبار أن رجلا نزع نعليه، فقال له: لم خلعت نعليك؟ لعلك تأولت الآية في خلع النعلين بالوادي المقدس، ثم قال كعب: أتدري ما كانت نعلا موسى؟ قال مالك: لا أدري ما أجابه الرجل. فقال كعب: كانتا من جلد حمار ميت. {cite:muwatta-maruf-1997 p.503}"
