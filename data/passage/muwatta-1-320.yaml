label: { ar: "الموطأ 320 — عبادة بن الصامت: خمس صلوات كتبهن الله على العباد", en: "Muwatta 320", es: "320 Muwatta", fr: "320 Muwatta", ur: "320 موطا", tr: "El-Muvatta 320 — Ubadah ibn al-Samit: Allah'ın kullarına farz kıldığı beş namaz", id: "Al-Muwatta 320 — Ubadah ibn al-Samit: Lima shalat yang telah Allah tetapkan bagi hamba-hamba-Nya" }
text: "خمس صلوات كتبهن الله عز وجل على العباد، فمن جاء بهن لم يضيع منهن شيئاً استخفافاً بحقهن كان له عند الله عهد أن يدخله الجنة"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان عن ابن محيريز، في باب الأمر بالوتر: سمع رجل من بني كنانة يدعى المخدجي رجلاً بالشام يكنى أبا محمد يقول إن الوتر واجب، فراح إلى عبادة بن الصامت فأخبره، فقال عبادة: أخطأ أبو محمد، وروى عن النبي أن الله كتب على العباد خمس صلوات، فمن جاء بهن ولم يضيع منهن شيئاً استخفافاً بحقهن كان له عند الله عهد أن يدخله الجنة، ومن لم يأت بهن فليس له عند الله عهد، إن شاء عذبه وإن شاء أدخله الجنة. ويخرّجه المحقق عند أبي داود (1420) والنسائي (1/230) وابن حبان (1732) وأحمد والبيهقي من طرق أصحاب مالك، ويرى أن إسناده ضعيف لجهالة المخدجي لكنه صح من طريق الصنابحي عن عبادة عند أحمد وأبي داود (425)، وينقل عن ابن عبد البر أنه حديث صحيح ثابت لأنه روي عن عبادة من طرق صحاح من غير طريق المخدجي ⁦(التمهيد 23/288–289)⁩. {cite:muwatta-maruf-1997 p.181} {cite:muwatta-maruf-1997 p.182}"
  tr: "Malik, Yahya bin Said'den, o da Muhammed bin Yahya bin Hibban'dan, o da İbn Muhayriz'den, Vitr namazının farz olduğu bölümünde şöyle rivayet etmiştir: Beni Kinana kabilesinden El-Makhdaci adında bir adam, Şam'da Ebu Muhammed adında birinin Vitr namazının farz olduğunu söylediğini işitti. Bunun üzerine Ubadah bin El-Samit'e gidip durumu bildirdi. Ubadah dedi ki: Ebu Muhammed yanılmış. Peygamberimizden rivayet edildiğine göre, Allah kullar için beş vakit namazı farz kılmıştır. Kim bu vakitleri kılar ve hiçbirini ihmal etmezse, Allah onu cennete kabul edeceğine dair bir ahit yapmış olur. Kim bu vakitleri kılmazsa, Allah ile böyle bir ahit olmaz. Allah dilerse onu cezalandırır, dilerse de cennete kabul eder. Araştırmacı, bu hadisi Ebu Davud (1420), el-Nesai (1/230), İbn Hibban (1732), Ahmed ve el-Beyhaki'nin derlemelerinde, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla dahil etmektedir. El-Mekhdaci'nin bilinmeyen statüsü nedeniyle rivayet zincirini zayıf olarak değerlendirmektedir, ancak Ahmed ve Ebu Davud'un derlemelerinde (425) bulunan, Ubadah'tan el-Sunabihi'nin rivayet zinciriyle sahih olduğunu belirtmektedir. İbn Abd el-Barr'ın, bu hadisin sahih ve sağlam bir hadis olduğunu, çünkü Ubadah'tan el-Mekhdaci'ninkinden başka sahih rivayet zincirleriyle nakledildiğini söylediğini aktarmaktadır (el-Tamhid 23/288–289). {cite:muwatta-maruf-1997 s.181} {cite:muwatta-maruf-1997 s.182}"
  id: "Malik meriwayatkannya dari Yahya bin Saeed dari Muhammad bin Yahya bin Hibban dari Ibn Muhayriz, dalam surah tentang perintah melaksanakan shalat Witir: Seorang laki-laki dari Bani Kinanah bernama Al-Makhdaji mendengar seorang laki-laki di Syam yang dikenal sebagai Abu Muhammad mengatakan bahwa Witir itu wajib. Maka ia pergi kepada Ubadah bin Al-Samit dan memberitahukannya. Ubadah berkata: Abu Muhammad telah keliru. Diriwayatkan dari Nabi bahwa Allah menetapkan lima shalat bagi hamba-hamba-Nya. Barangsiapa melaksanakannya dan tidak mengabaikan salah satu pun karena mengabaikan hak-haknya, maka ia akan mendapat perjanjian dengan Allah bahwa Dia akan memasukkannya ke Surga. Barangsiapa tidak melaksanakannya, maka ia tidak akan mendapat perjanjian dengan Allah. Jika Dia menghendaki, Dia akan menghukumnya, dan jika Dia menghendaki, Dia akan memasukkannya ke Surga. Peneliti memasukkannya ke dalam koleksi Abu Dawud (1420), al-Nasa'i (1/230), Ibn Hibban (1732), Ahmad, dan al-Bayhaqi, melalui sanad para sahabat Malik. Ia menganggap sanadnya lemah karena status al-Makhdaji tidak diketahui, tetapi hadits ini sahih melalui sanad al-Sunabihi dari 'Ubadah, sebagaimana ditemukan dalam koleksi Ahmad dan Abu Dawud (425). Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa hadits ini sahih dan mapan karena diriwayatkan dari 'Ubadah melalui sanad yang sahih selain sanad al-Makhdaji (al-Tamhid 23/288–289). {cite:muwatta-maruf-1997 p.181} {cite:muwatta-maruf-1997 p.182}"
