label: { ar: "الموطأ 320 — عبادة بن الصامت: خمس صلوات كتبهن الله على العباد", en: "Muwatta 320" }
text: "خمس صلوات كتبهن الله عز وجل على العباد، فمن جاء بهن لم يضيع منهن شيئاً استخفافاً بحقهن كان له عند الله عهد أن يدخله الجنة"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان عن ابن محيريز، في باب الأمر بالوتر: سمع رجل من بني كنانة يدعى المخدجي رجلاً بالشام يكنى أبا محمد يقول إن الوتر واجب، فراح إلى عبادة بن الصامت فأخبره، فقال عبادة: أخطأ أبو محمد، وروى عن النبي أن الله كتب على العباد خمس صلوات، فمن جاء بهن ولم يضيع منهن شيئاً استخفافاً بحقهن كان له عند الله عهد أن يدخله الجنة، ومن لم يأت بهن فليس له عند الله عهد، إن شاء عذبه وإن شاء أدخله الجنة. ويخرّجه المحقق عند أبي داود (1420) والنسائي (1/230) وابن حبان (1732) وأحمد والبيهقي من طرق أصحاب مالك، ويرى أن إسناده ضعيف لجهالة المخدجي لكنه صح من طريق الصنابحي عن عبادة عند أحمد وأبي داود (425)، وينقل عن ابن عبد البر أنه حديث صحيح ثابت لأنه روي عن عبادة من طرق صحاح من غير طريق المخدجي (التمهيد 23/288–289). {cite:muwatta-maruf-1997 p.181} {cite:muwatta-maruf-1997 p.182}"
