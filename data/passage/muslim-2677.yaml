label: { ar: "مسلم 2677 — إن لله تسعة وتسعين اسماً", en: "Muslim 2677 — God has ninety-nine names", es: "Musulmán 2677 — Dios tiene noventa y nueve nombres", fr: "Muslim 2677 — Dieu a quatre-vingt-dix-neuf noms", ur: "مسلم 2677 - خدا کے ننانوے نام ہیں۔", tr: "Müslim 2677 — Allah'ın doksan dokuz ismi vardır.", id: "Muslim 2677 — Tuhan memiliki sembilan puluh sembilan nama" }
text: "قال رسول الله: «إن لله تسعة وتسعين اسماً، مائة إلا واحداً، من أحصاها دخل الجنة، وإنه وتر يحب الوتر»"
summary:
  ar: "رواية أبي هريرة في باب أسماء الله تعالى وفضل من أحصاها من كتاب الذكر في صحيح مسلم؛ تسعة وتسعون اسماً من أحصاها دخل الجنة، وإنه وتر يحب الوتر."
  tr: "Sahih Müslim'de, Allah'ın isimleri ve onları sayanların fazileti bölümünde Ebu Hurayra'nın rivayetine göre: Doksan dokuz isim vardır; kim bunları sayarsa cennete girer. Allah birdir ve tek sayıları sever."
  id: "Riwayat Abu Hurairah dalam surah tentang nama-nama Allah Yang Maha Agung dan keutamaan orang-orang yang menghafalnya dari Kitab Zikir dalam Sahih Muslim: sembilan puluh sembilan nama, siapa pun yang menghafalnya akan masuk surga, dan Dia Maha Esa dan mencintai angka ganjil."
