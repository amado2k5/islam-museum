label: { ar: "سنن النسائي 2827 — الحلال", en: "Sunan al-Nasa'i 2827 — the lawful", ur: "سنن نسائی 2827 — حلال", es: "Sunan al-Nasa'i 2827 - lo lícito", fr: "Sunan al-Nasa'i 2827 — le licite" }
text: "أَخْبَرَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا يَعْقُوبُ، - وَهُوَ ابْنُ عَبْدِ الرَّحْمَنِ - عَنْ عَمْرٍو، عَنِ الْمُطَّلِبِ، عَنْ جَابِرٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" صَيْدُ الْبَرِّ لَكُمْ حَلاَلٌ مَا لَمْ تَصِيدُوهُ أَوْ يُصَادَ لَكُمْ \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ عَمْرُو بْنُ أَبِي عَمْرٍو لَيْسَ بِالْقَوِيِّ فِي الْحَدِيثِ وَإِنْ كَانَ قَدْ رَوَى عَنْهُ مَالِكٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 2827، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2827 (The Book of Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2827، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2827 (El Libro del Hajj), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2827 (Le Livre du Hajj), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
