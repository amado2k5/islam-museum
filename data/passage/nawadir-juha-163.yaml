text: "… ألم يخطر لك النزول؟ صعد يوماً كرسيَّ الوعظ في أحد مساجد القرية، واجتمع الخلق وانتظروا ما سيقوله، فجلس الشيخ طويلاً ولم يخطرِ في باله شيء، وحَصِرَ وتضايقَ والناس بنتظرونه، وكلّما طال الوقت يزداد حصراً. وأخيراً التفت إلى الناس وقال: يا …"
summary:
  ar: "صعد جحا المنبر ليعظ فلم يجد ما يقوله وقال ذلك؛ فسأله ابنه من الأسفل ألم يخطر له أن ينزل. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  en: "Juha mounts the pulpit to preach, has nothing to say, and says so; his son below asks whether it did not occur to him to come down. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  ur: "جحا وعظ کرنے منبر پر چڑھا، اس کے پاس کہنے کو کچھ نہ تھا اور اس نے یہی کہہ دیا؛ نیچے سے اس کے بیٹے نے پوچھا کہ کیا آپ کو اترنے کا خیال نہیں آیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  fr: "Juha monte en chaire pour prêcher, n'a rien à dire et le dit; son fils, en bas, demande s'il ne lui est pas venu à l'idée de descendre. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  es: "Juha sube al púlpito para predicar, no tiene nada que decir y lo dice; su hijo, abajo, le pregunta si no se le ocurrió bajar. {cite:juha-nawadir-kubra-djuwaydi p. 75}"
  tr: "Juha vaaz vermek için minbere çıktı, ama söyleyecek bir şey bulamadı, bu yüzden öyle söyledi. Oğlu aşağıdan ona, \"Aşağı inmek aklına gelmedi mi?\" diye sordu. {cite:juha-nawadir-kubra-djuwaydi s. 75}"
  id: "Juha naik ke mimbar untuk berkhotbah, tetapi ia tidak menemukan apa pun untuk dikatakan, jadi ia berkata demikian. Putranya, dari bawah, bertanya kepadanya, \"Tidakkah terpikir olehmu untuk turun?\" {cite:juha-nawadir-kubra-djuwaydi p. 75}"
