summary:
  ar: "قال مالك: إذا وضع الرجل عن مكاتبه عند موته ألف درهم، من أول الكتابة أو من آخرها، وكانت أصل الكتابة على ثلاثة آلاف درهم: تُقوَّم الكتابة قيمة النقد، ثم تُقسم تلك القيمة فيُجعل لكل ألف حصتها من القيمة بقدر قربها من الأجل وفضلها، ثم يُوضع في ثلث الميت قدر ما أصاب تلك الألف من القيمة. {cite:muwatta-maruf-1997 p.367}"
