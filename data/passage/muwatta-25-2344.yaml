label: { ar: "الموطأ 2344 — مالك: توزيع الموضوع عن المكاتب على نجومه بقدر قربها من الأجل", en: "Muwatta 2344", es: "Muwatta 2344", fr: "Muwatta 2344", ur: "موطا 2344", tr: "Al-Muwatta 2344 — Malik: Görevlerin konusunun, son tarihe yakınlıklarına göre yıldızlarına oranla dağıtılması", id: "Al-Muwatta 2344 — Malik: Membagikan topik jabatan berdasarkan bintangnya sesuai dengan kedekatannya dengan tenggat waktu" }
summary:
  ar: "قال مالك: إذا وضع الرجل عن مكاتبه عند موته ألف درهم، من أول الكتابة أو من آخرها، وكانت أصل الكتابة على ثلاثة آلاف درهم: تُقوَّم الكتابة قيمة النقد، ثم تُقسم تلك القيمة فيُجعل لكل ألف حصتها من القيمة بقدر قربها من الأجل وفضلها، ثم يُوضع في ثلث الميت قدر ما أصاب تلك الألف من القيمة. {cite:muwatta-maruf-1997 p.367}"
  tr: "Malik şöyle demiştir: Bir kimse, kölesinin ölüm anındaki sözleşme değerini, ister sözleşmenin başından ister sonundan itibaren bin dirhem azaltırsa ve asıl sözleşme üç bin dirhem ise, sözleşme parasal değeri üzerinden değerlendirilir. Daha sonra bu değer bölünür ve her bin dirheme, sözleşmenin sonuna yakınlığına ve fazlasına göre pay verilir. Ardından, bin dirhemin aldığı pay, ölenin mal varlığına eklenir. {cite:muwatta-maruf-1997 s.367}"
  id: "Malik berkata: Jika seseorang mengurangi nilai kontrak budaknya sebesar seribu dirham pada saat kematiannya, baik dari awal maupun akhir kontrak, dan kontrak aslinya adalah tiga ribu dirham, maka kontrak tersebut dinilai berdasarkan nilai moneternya. Kemudian nilai tersebut dibagi, dan setiap seribu dirham diberikan bagiannya sesuai dengan kedekatannya dengan akhir kontrak dan kelebihannya. Kemudian, jumlah yang diterima seribu dirham dari nilai tersebut dimasukkan ke dalam harta warisan almarhum. {cite:muwatta-maruf-1997 p.367}"
