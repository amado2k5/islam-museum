text: "… يده على ركبتي رسول اللّه ادي ل ل فقال : يا محمد ما الإسلام؟ قال: الإسلام: أن تشهد أن لا إله إلا اللَّه وأن محمدًا رسول اللَّه، وأن تقيم الصلاة، وتؤتي الزكاة، وتحج وتعتمر، وتغتسل من الجنابة، وتتم الوضوء، وتصوم …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 988، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 4, p. 988, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 4، ص 988 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 4, pág. 988, que menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (volume 4, p. 988) mentionnant l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage (mentionnés ensemble), ainsi que le témoignage. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 4. cildinin 988. sayfasından bir alıntı, İslam'ı namaz, zekât, oruç ve Hac gibi ibadetlerle, ayrıca iman ikrarı, namaz ve zekâtla tanımlar. Bu alıntı, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle sınırlandırılmış, makine tarafından okunabilir taranmış bir versiyondan alınmıştır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 4, halaman 988, mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat. Kutipan ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
