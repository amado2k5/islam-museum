label: { ar: "جامع الترمذي 2624 — حلاوة الإيمان وكماله، خصال من كنّ فيه", en: "Jami' al-Tirmidhi 2624 — the sweetness and completeness of faith; traits that, found in a person, mark faith", ur: "جامع ترمذی 2624 — ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں", es: "Jami' al-Tirmidhi 2624 — La dulzura y la plenitud de la fe; rasgos que, encontrados en una persona, marcan la fe.", fr: "Jami' al-Tirmidhi 2624 — la douceur et la plénitude de la foi; les traits qui, chez une personne, marquent la foi", tr: "Cami' el-Tirmizi 2624 — İmanın tatlılığı ve mükemmelliği, ona sahip olanların sahip olduğu nitelikler.", id: "Jami' al-Tirmidhi 2624 — Manisnya dan kesempurnaan iman, sifat-sifat yang dimiliki oleh orang-orang yang memilikinya" }
text: "… عَنْ أَيُّوبَ، عَنْ أَبِي قِلاَبَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ قَالَ \" ثَلاَثٌ مَنْ كُنَّ فِيهِ وَجَدَ بِهِنَّ طَعْمَ الإِيمَانِ مَنْ كَانَ اللَّهُ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا وَأَنْ يُحِبَّ الْمَرْءَ لاَ يُحِبُّهُ إِلاَّ لِلَّهِ وَأَنْ يَكْرَهَ أَنْ يَعُودَ فِي الْكُفْرِ بَعْدَ إِذْ أَنْقَذَهُ اللَّهُ مِنْهُ كَمَا يَكْرَهُ أَنْ يُقْذَفَ فِي النَّارِ \". …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2624، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2624 (The Book on Faith), that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2624، جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2624 (El Libro de la Fe), menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2624 (Le Livre de la Foi), évoque la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent. Le répertoire « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
  tr: "Cami' el-Tirmizi'de 2624 numaralı hadis, imanın tatlılığı ve mükemmelliğinden ve ona sahip olanların niteliklerinden bahseder. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2624, menyebutkan manisnya dan kesempurnaan iman, serta sifat-sifat orang yang memilikinya. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
