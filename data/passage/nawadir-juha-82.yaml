label: { ar: "نوادر جحا الكبرى، ص 43 — «من شوقي نسيت ثيابي»", en: "Nawadir Juha al-Kubra, p. 43 — 'In My Longing I Forgot My Clothes'", ur: "نوادر جحا الکبریٰ، ص 43 — «شوق میں میں اپنے کپڑے بھول گیا»", fr: "Nawadir Juha al-Kubra, p. 43 — « Dans mon impatience, j'ai oublié mes vêtements »", es: "Nawadir Juha al-Kubra, p. 43 — «Por el anhelo olvidé mi ropa»", tr: "Juha'nın Büyük Fıkraları, s. 43 — “Özlemden kıyafetlerimi unuttum”", id: "Anekdot Hebat Juha, hlm. 43 — “Karena kerinduan, aku lupa pakaianku”" }
text: "… من شوقي نسيت ثيابي سمع صباحَ يومٍ حركةَ عربةٍ، وكان نائماً في الفراش. فسأل، فعلِمَ أنَّ العربةَ ذاهِبةٌ إلى وطنِهِ سيورَي حصار فنهض في الحال، ولحق العربة فتعلَّق بها عارِياً. وركب، وهي سائرةٌ، حتى وصل إلى القرية ورآهُ أهلُها فتعجَّبوا …"
summary:
  ar: "سمع جحا عربة تغادر إلى بلدته سيوري حصار، فقفز من سريره وتعلق بها عاريًا، وعند وصوله قال لأهل القرية إن شوقه إليهم أنساه ثيابه. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  en: "Juha hears a cart leaving for his hometown Siwri Hisar, jumps out of bed and clings to it naked; arriving, he tells the villagers that his longing for them made him forget his clothes. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  ur: "جحا نے سنا کہ ایک گاڑی اس کے وطن سیوری حصار کی طرف جا رہی ہے، تو وہ بستر سے کود پڑا اور برہنہ ہی اس سے چمٹ گیا؛ پہنچ کر اس نے گاؤں والوں سے کہا کہ ان کے شوق نے مجھے کپڑے بھلا دیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  fr: "Juha entend une charrette partir pour sa ville natale, Siwri Hisar, saute du lit et s'y agrippe nu ; en arrivant, il dit aux villageois que son désir de les revoir lui a fait oublier ses vêtements. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  es: "Juha oye que una carreta parte hacia su ciudad natal, Siwri Hisar, salta de la cama y se agarra a ella desnudo; al llegar, dice a los aldeanos que el anhelo de verlos le hizo olvidar su ropa. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
  tr: "Juha, memleketi Siuri Hisar'a giden bir arabanın sesini duyunca yataktan fırladı ve çıplak bir şekilde arabaya tutundu. Oraya vardığında köylülere, onlara duyduğu özlem yüzünden kıyafetlerini unuttuğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 43}"
  id: "Juha mendengar suara kereta berangkat menuju kampung halamannya di Siuri Hisar, jadi dia melompat dari tempat tidur dan berpegangan pada kereta itu dalam keadaan telanjang. Setelah tiba, dia memberi tahu penduduk desa bahwa kerinduannya kepada mereka telah membuatnya lupa akan pakaiannya. {cite:juha-nawadir-kubra-djuwaydi p. 43}"
