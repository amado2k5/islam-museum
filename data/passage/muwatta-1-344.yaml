text: "أفضل الصلاة صلاتكم في بيوتكم إلا صلاة المكتوبة"
summary:
  ar: "أثر يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن بسر بن سعيد أن زيد بن ثابت قال، في باب فضل صلاة الجماعة على صلاة الفذ: أفضل الصلاة صلاتكم في بيوتكم إلا الصلاة المكتوبة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد موقوفاً، وأنه روي مرفوعاً عن بسر عن زيد عن النبي، وينقل عن الترمذي (450) أن موسى بن عقبة وإبراهيم بن أبي النضر روياه عن أبي النضر مرفوعاً وأن المرفوع أصح، ويخرّج المرفوع عند البخاري ومسلم (2/188) وأبي داود (1044، 1447) والنسائي وابن خزيمة وابن حبان. {cite:muwatta-maruf-1997 p.189} {cite:muwatta-maruf-1997 p.190}"
