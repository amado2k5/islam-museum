label: { ar: "الموطأ 344 — زيد بن ثابت: أفضل الصلاة صلاتكم في بيوتكم إلا المكتوبة", en: "Muwatta 344", es: "Muwatta 344", fr: "Muwatta 344", ur: "موطا 344", tr: "El-Muvatta 344 — Zeyd ibn Sabit: Farz namazlar dışında, en faziletli namaz evlerinizde kılınan namazdır.", id: "Al-Muwatta 344 — Zayd ibn Thabit: Shalat yang terbaik adalah shalat di rumahmu, kecuali shalat wajib." }
text: "أفضل الصلاة صلاتكم في بيوتكم إلا صلاة المكتوبة"
summary:
  ar: "أثر يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن بسر بن سعيد أن زيد بن ثابت قال، في باب فضل صلاة الجماعة على صلاة الفذ: أفضل الصلاة صلاتكم في بيوتكم إلا الصلاة المكتوبة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد موقوفاً، وأنه روي مرفوعاً عن بسر عن زيد عن النبي، وينقل عن الترمذي (450) أن موسى بن عقبة وإبراهيم بن أبي النضر روياه عن أبي النضر مرفوعاً وأن المرفوع أصح، ويخرّج المرفوع عند البخاري ومسلم (2/188) وأبي داود ⁦(1044، 1447)⁩ والنسائي وابن خزيمة وابن حبان. {cite:muwatta-maruf-1997 p.189} {cite:muwatta-maruf-1997 p.190}"
  tr: "Malik'in, Ömer ibn Ubeyd Allah'ın azatlı kölesi Ebu el-Nadr'dan, o da Busr ibn Sa'id'den rivayet ettiği bir hadiste, Zeyd ibn Sabit'in cemaat namazının tek namazdan üstünlüğü bölümünde şöyle dediği belirtilir: \"En faziletli namaz, farz namazlar hariç, evlerinizde kıldığınız namazdır.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten bir Sahabe sözü (mevkuf) olarak naklettiğini ve ayrıca Busr'dan, o da Zeyd'den, o da Peygamber'den (merfü') rivayet edilen bir hadis (merfü') olarak da nakledildiğini belirtir. Tirmizi'nin (450) Musa ibn Ukba ve İbrahim ibn Abi el-Nadr'ın bunu Ebu el-Nadr'dan rivayet ederek Peygamber'den (merfü') rivayet edilen bir hadis (merfü') olarak naklettiğini ve ikincisinin daha sahih olduğunu söylediğini aktarır. Peygamber'e (merfu') kadar uzanan hadis, el-Buhari, Müslim (2/188), Ebu Davud (1044, 1447), el-Nesa'i, İbn Huzeyme ve İbn Hibban'ın koleksiyonlarında bulunur. {cite:muwatta-maruf-1997 s.189} {cite:muwatta-maruf-1997 s.190}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Busr ibn Sa'id, bahwa Zayd ibn Thabit berkata, dalam surah tentang keutamaan shalat berjamaah atas shalat perorangan: \"Shalat yang terbaik adalah shalat di rumah masing-masing, kecuali shalat wajib.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik sebagai pernyataan seorang Sahabat (mawquf), dan bahwa itu juga diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi (marfu') dari Busr, dari Zayd, dari Nabi (marfu'). Dia mengutip al-Tirmidhi (450) yang mengatakan bahwa Musa ibn Uqba dan Ibrahim ibn Abi al-Nadr meriwayatkannya dari Abu al-Nadr sebagai hadits yang ditelusuri kembali kepada Nabi (marfu'), dan bahwa yang terakhir lebih sahih. Hadits yang ditelusuri hingga Nabi (marfu') ditemukan dalam kumpulan al-Bukhari, Muslim (2/188), Abu Dawud (1044, 1447), al-Nasa'i, Ibnu Khuzayma, dan Ibnu Hibban. {kutip:muwatta-maruf-1997 hal.189} {kutip:muwatta-maruf-1997 hal.190}"
