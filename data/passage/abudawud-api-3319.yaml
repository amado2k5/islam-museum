label: { ar: "سنن أبي داود 3319 — الأب والأبوة", en: "Sunan Abi Dawud 3319 — the father and fatherhood", ur: "سنن ابی داؤد 3319 — باپ اور والدیت", es: "Sunan Abi Dawud 3319 — El padre y la paternidad", fr: "Sunan Abi Dawud 3319 — le père et la paternité" }
text: "حَدَّثَنِي عُبَيْدُ اللَّهِ بْنُ عُمَرَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنِ ابْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، أَنَّهُ قَالَ لِلنَّبِيِّ أَوْ أَبُو لُبَابَةَ أَوْ مَنْ شَاءَ اللَّهُ : إِنَّ مِنْ تَوْبَتِي أَنْ أَهْجُرَ دَارَ قَوْمِي الَّتِي أَصَبْتُ فِيهَا الذَّنْبَ، وَأَنْ أَنْخَلِعَ مِنْ مَالِي كُلِّهِ صَدَقَةً. قَالَ : \" يُجْزِئُ عَنْكَ الثُّلُثُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3319، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3319 (Oaths and Vows (Kitab Al-Aiman Wa Al-Nudhur)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3319، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3319 (Juramentos y Votos (Kitab Al-Aiman Wa Al-Nudhur)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3319 (Serments et Vœux), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
