label: { ar: "الموطأ 1494 — سعيد بن المسيب عن عمر بن الخطاب: لا تنكح المرأة إلا بإذن وليها أو ذي الرأي من أهلها أو السلطان", en: "Muwatta 1494", es: "Muwatta 1494", fr: "Muwatta 1494", ur: "موطا 1494", tr: "El-Muvatta 1494 — Sa’id ibn al-Musayyab, Ömer ibn al-Khattab'dan rivayetle: Bir kadın, ancak velisinin, ailesinden bilge bir adamın veya yöneticinin izniyle evlenebilir.", id: "Al-Muwatta 1494 — Sa’id ibn al-Musayyab berdasarkan riwayat Umar ibn al-Khattab: Seorang wanita tidak boleh dinikahi kecuali dengan izin walinya, atau seorang bijak dari keluarganya, atau penguasa." }
summary:
  ar: "يروي مالك أنه بلغه عن سعيد بن المسيب أنه قال قال عمر بن الخطاب لا تنكح المرأة إلا بإذن وليها أو ذي الرأي من أهلها أو السلطان. {cite:muwatta-maruf-1997 p.29}"
  tr: "Malik, Sa'id ibn al-Musayyab'dan işittiğine göre, Ömer ibn al-Khattab şöyle demiştir: \"Bir kadın, ancak velisinin, ailesinden bilge bir adamın veya yöneticinin izniyle evlendirilebilir.\" {cite:muwatta-maruf-1997 s.29}"
  id: "Malik meriwayatkan bahwa ia mendengar dari Sa'id ibn al-Musayyab bahwa ia berkata: Umar ibn al-Khattab berkata: Seorang wanita tidak boleh dinikahi kecuali dengan izin walinya, atau orang bijak dari keluarganya, atau penguasa. {cite:muwatta-maruf-1997 p.29}"
