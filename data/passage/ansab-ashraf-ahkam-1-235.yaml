text: "… أين تعمد يا أبا بكر؟ قال : أخرجني قومي، فأنا أسيح في الأرض فأعبد ربي، فقال ابن الدُّغينة: مثلك، يا أبا بكر، لا يخرج ولا يخرج، إنك تكسب المعدوم، وتصل الرحم، وتحمل الكلّ، وتقري الضيف، وتعين على نوائب الحقوق، فأنا …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 1، ص 235، يرد فيه ذكر فرض العين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
