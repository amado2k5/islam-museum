text: "الله يهدي من يشاء وهو أعلم بالمهتدين) يا أخا تنوخ إني كحبت بكتاب إلى كسرى فمزقه والله معزقه وممزق ملكه، وكتبت إلى النجاشي بصحيفة فخرقها والله مخرقه ومخرق ملكه، وكتبت إلى صاحبك بصحيفة فأمسكها فلن يزال الناس يجدون منه باسا"
