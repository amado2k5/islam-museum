text: "… وحُدِّثتُ عن قَتَادة أَنَّه قال: حُدِّثت أن رسول اللّٰه وليفي قال: لَمَا دَنَوْتُ مِنْهُ لأركبَه شمَسَ، فَوضع جبريلٌ يدَهُ على مَعْرَفَتِه، ثم قال: ألا تَسْتَحي يا بُرَاقُ مِمّا تصنعُ؟ فوالله مَا رَكِبَكَ عَبْدٌ لله قبلَ محمدٍ أحرمُ عليه منه، قال: …"
