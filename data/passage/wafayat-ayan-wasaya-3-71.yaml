text: "… من فى داره ثم قل الى مشهد بنى لا فى مقابر قريش ومواده فى سنة ثلاث المادة ميلدة بروسه وثلثمائة رحه اللّه تعالى ولماحضره الموت اعتق مماليكه وتصدق بأكثر ماله ورد كثيرا من وكان ياقب بأى حسن قدس تعالى مره …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 3، ص 71، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 3, p. 71, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 3، ص 71 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Wafayat al-A'yan de Ibn Khallikan, volumen 3, pág. 71, que menciona el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de la Wafayat al-A'yan d'Ibn Khallikan (tome 3, p. 71) mentionnant un lit de mort, les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 3. cildinin 71. sayfasından alınan bir alıntıda, ölüm ve vefat zamanı, defin, mezar ve istirahat yeri konularına değinilmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetler, Miraslar, Antikalar ve İstirahat Yerleri\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka) karya Ibn Khallikan, Jilid 3, halaman 71, menyebutkan saat kematian dan wafat, pemakaman, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Peristirahatan\"."
