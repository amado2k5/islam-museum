  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 5607. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar Tarayıcısı tarafından derlenmiştir."
