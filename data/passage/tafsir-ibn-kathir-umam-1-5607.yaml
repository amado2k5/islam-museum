text: "… لهم فيه عمل ولا كد. الْقَيَةَ أصح القولين أن هذه البلدة هي بيت المقدس، وقال أخرون: هي أريحا، وهذا بعيد. مصرًا والحق أن المراد مصرٌ من الأمصار. الصابئون قوم ليسوا علىٰ دين اليهود ولا النصارى ولا المجوس ولا المشركين وإنماهم …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 5607، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
