  ar: "سنن أبي داود، كتاب شهر رمضان"
  en: "Sunan Abi Dawud, Book 6: Prayer (Kitab Al-Salat): Detailed Injunctions about Ramadan"
  ur: "سنن ابی داؤد، کتاب شہر رمضان"
  es: "Sunan Abi Dawud, Libro 6: La oración (Kitab Al-Salat): Preceptos detallados sobre el Ramadán"
