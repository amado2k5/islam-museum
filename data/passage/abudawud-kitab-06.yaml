summary:
  ar: "القسم 6 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب شهر رمضان»، ويضم فيها النصوص من 1371 إلى 1400 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 6 of Sunan Abi Dawud (Prayer (Kitab Al-Salat): Detailed Injunctions about Ramadan) in the division of the open hadith dataset the museum took its reports from: reports 1371 to 1400 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 6، عنوان «کتاب شہر رمضان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1371 تا 1400۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 6 de Sunan Abi Dawud (Oración (Kitab Al-Salat): Preceptos detallados sobre el Ramadán) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1371 al 1400, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 6 du Sunan Abi Dawud (La Prière (Kitab Al-Salat): Recommandations détaillées concernant le Ramadan) correspond aux hadiths 1371 à 1400, selon la numérotation de la base de données ouverte utilisée par le musée. Le musée classe ses archives relatives à ces hadiths dans ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
