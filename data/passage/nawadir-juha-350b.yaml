text: "… تخلص الشيخ من أسئلة مطوّلة بلطف ذهب الشيخ عندما كان طالب علم، إلى بعض القرى للوعظ، فكان أهلُها يرحّبون به، ويسألونه عن صحته حسب العادة، ولكن أهالي القرية بدأوه بالسؤال عن أقاربه، وأصدقائه، وأشغاله، وجيرانه، وغيرهم، ممَّا يطولُ شرحُه، فضاق …"
summary:
  ar: "قُرئت الأجوبة المكتوبة بصوت عال في المساء، فضحك القرويون وسُروا، وتجنب جحا أن يجيب كل شخص على حدة. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  en: "The written answers are read aloud in the evening, and the villagers laugh and are pleased; Juha avoids answering each person one by one. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  ur: "شام کو لکھے ہوئے جوابات بلند آواز سے پڑھے گئے، گاؤں والے ہنسے اور خوش ہوئے، اور جحا ہر شخص کو الگ الگ جواب دینے سے بچ گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  fr: "Les réponses écrites sont lues à voix haute le soir, et les villageois rient et sont ravis ; Juha évite de répondre à chacun individuellement. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
  es: "Las respuestas escritas se leen en voz alta por la tarde, y los aldeanos ríen y quedan contentos; Juha evita responder a cada persona una por una. {cite:juha-nawadir-kubra-djuwaydi p. 174}"
