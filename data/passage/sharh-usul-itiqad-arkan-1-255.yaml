text: "… الدجالَ خارجٌ، مكتوبٌ بين عينيه: كافِرٌ، والأحاديثُ التي جاءت فيه، والإيمانُ بأنَّ ذلك كائِنٌ، وأن عيسى ابنَ مريم ينزلُ فيقتُلُه بباب لُدِّ. - والإيمانُ: قولٌ وعملٌ، يزيدُ وينقُصُ، كما جاء في الخبر: أَكْمَلُ المؤمنين إيمانًا أحسنهم خُلُقًا. - ومن تركَ …"
