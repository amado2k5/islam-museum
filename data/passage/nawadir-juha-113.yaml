label: { ar: "نوادر جحا الكبرى، ص 54 — «إصدار الأمر هين»", en: "Nawadir Juha al-Kubra, p. 54 — 'Giving the Order Is Easy'", ur: "نوادر جحا الکبریٰ، ص 54 — «إصدار الأمر سهل»", fr: "Nawadir Juha al-Kubra, p. 54 — « Donner l'ordre est facile »", es: "Nawadir Juha al-Kubra, p. 54 — «Dar la orden es fácil»" }
text: "… إصدار الأمر هيّن جيء بفارس من عساكر تيمورلنك، وكان الشيخ حاضراً فأمر تيمور لنك بضربهِ ثمانين عصا. فتبسَّم الشيخ. فغضِبَ تيمور لنك وقال: اضربوه خمسماية عصا. فأخذ الشيخ يضحكُ قهقهةً، فغضِبَ تيمور لنك غضباً شديداً وتطايرَ الشررُ من عينيه وقال …"
summary:
  ar: "كان جندي من جيش تيمور سيُجلد، فأمر تيمور بثمانين جلدة، ثم بخمسمائة، ثم بثمانمائة لما ضحك جحا؛ فقال جحا إن إصدار الأمر هيّن، ولكن من يطيق ثمانمائة جلدة؟ {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  en: "A soldier of Timur's army is to be flogged; Timur orders eighty lashes, then five hundred, then eight hundred when Juha laughs; Juha says giving the order is easy, but who can bear eight hundred lashes? {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  ur: "تیمور کے لشکر کے ایک سپاہی کو کوڑے لگائے جانے تھے؛ تیمور نے اسی کوڑوں کا حکم دیا، پھر پانچ سو کا، اور جب جحا ہنسا تو آٹھ سو کا؛ جحا نے کہا کہ حکم دینا آسان ہے، مگر آٹھ سو کوڑے کون سہہ سکتا ہے؟ {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  fr: "Un soldat de l'armée de Timur doit être fouetté; Timur ordonne quatre-vingts coups, puis cinq cents, puis huit cents quand Juha rit; Juha dit qu'il est facile de donner l'ordre, mais que personne ne peut supporter huit cents coups. {cite:juha-nawadir-kubra-djuwaydi p. 54}"
  es: "Un soldado del ejército de Timur va a ser azotado; Timur ordena ochenta latigazos, luego quinientos y luego ochocientos cuando Juha se ríe; Juha dice que dar la orden es fácil, pero que quién puede soportar ochocientos latigazos. {cite:juha-nawadir-kubra-djuwaydi p. 54}"
