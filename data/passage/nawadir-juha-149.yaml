text: "… أضف إلى قراءتي شيئاً من القِطران جَرِبَتْ شاةُ أحد الفلاحين، فأخذها إلى الشيخ، وقال له: بما أنْ نَفَسَك نافعٌ للجرب فاقرأ لي على هذه الشاة. فأجابه الشيخ: إذا كنت تريد أن تبرأَ شاتُك مِنَ المرض فأضِفْ إلى قراءتي شيئاً من …"
summary:
  ar: "جاء فلاح بخروف أجرب وطلب من جحا أن يقرأ عليه لأن نَفَسه يشفي الجرب؛ فقال جحا أن يُضاف إلى قراءته شيء من القطران. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  en: "A farmer brings a scabby sheep and asks Juha to recite over it since his breath cures scabs; Juha says to add a little tar to the recitation. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  ur: "ایک کسان کھجلی والی بھیڑ لایا اور جحا سے کہا کہ اس پر دم کرو کیونکہ تمہارے دم سے خارش ٹھیک ہو جاتی ہے؛ جحا نے کہا کہ میرے دم کے ساتھ تھوڑا تارکول بھی ملا لو۔ {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  fr: "Un paysan amène un mouton galeux et demande à Juha de réciter sur lui, car son souffle guérit la gale; Juha dit d'ajouter un peu de goudron à la récitation. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
  es: "Un campesino trae una oveja sarnosa y le pide a Juha que recite sobre ella, pues su aliento cura la sarna; Juha dice que se añada un poco de alquitrán a la recitación. {cite:juha-nawadir-kubra-djuwaydi p. 70}"
