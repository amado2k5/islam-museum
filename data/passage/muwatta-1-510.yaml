label: { ar: "الموطأ 510 — أسماء بنت أبي بكر في الكسوف: أوحي إلي أنكم تفتنون في القبور مثل فتنة الدجال", en: "Muwatta 510" }
text: "ما من شيء كنت لم أره إلا وقد رأيته في مقامي هذا، حتى الجنة والنار"
summary:
  ar: "أول حديث في باب ما جاء في صلاة الكسوف. يرويه يحيى عن مالك عن هشام بن عروة عن فاطمة بنت المنذر عن أسماء بنت أبي بكر: أتت عائشة حين خسفت الشمس فإذا الناس قيام يصلون وإذا هي قائمة تصلي، فسألتها ما للناس فأشارت بيدها نحو السماء وقالت سبحان الله، فقالت أسماء: آية؟ فأشارت برأسها أن نعم؛ فقامت أسماء حتى تجلاها الغشي وجعلت تصب الماء فوق رأسها. فحمد النبي الله وأثنى عليه ثم قال إنه ما من شيء كان لم يره إلا وقد رآه في مقامه ذلك حتى الجنة والنار، وإنه أوحي إليه أنهم يُفتنون في القبور مثل أو قريباً من فتنة الدجال: يؤتى أحدهم فيُسأل ما علمه بهذا الرجل، فأما المؤمن أو الموقن فيقول هو محمد رسول الله جاءنا بالبينات والهدى فأجبنا وآمنا واتبعنا، فيُقال له نم صالحاً قد علمنا إن كنت لمؤمناً؛ وأما المنافق أو المرتاب فيقول لا أدري، سمعت الناس يقولون شيئاً فقلته. ويخرّجه المحقق عند البخاري (184، 1053، 7287) وأبي عوانة والطحاوي والبيهقي والبغوي من طرق أصحاب مالك، ويحيل على التمهيد (22/245). {cite:muwatta-maruf-1997 p.263}"
