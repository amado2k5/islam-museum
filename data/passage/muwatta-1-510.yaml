label: { ar: "الموطأ 510 — أسماء بنت أبي بكر في الكسوف: أوحي إلي أنكم تفتنون في القبور مثل فتنة الدجال", en: "Muwatta 510", es: "Muwatta 510", fr: "Muwatta 510", ur: "موطا 510", tr: "El-Muvatta 510 — Asma bint Abi Bakr, güneş tutulması hakkında: Bana vahyedildi ki, sizler kabirde Deccal'in imtihanı gibi imtihana tabi tutulacaksınız.", id: "Al-Muwatta 510 — Asma bint Abi Bakr tentang gerhana: Telah diwahyukan kepadaku bahwa kalian akan diuji di dalam kubur seperti ujian Antikristus" }
text: "ما من شيء كنت لم أره إلا وقد رأيته في مقامي هذا، حتى الجنة والنار"
summary:
  ar: "أول حديث في باب ما جاء في صلاة الكسوف. يرويه يحيى عن مالك عن هشام بن عروة عن فاطمة بنت المنذر عن أسماء بنت أبي بكر: أتت عائشة حين خسفت الشمس فإذا الناس قيام يصلون وإذا هي قائمة تصلي، فسألتها ما للناس فأشارت بيدها نحو السماء وقالت سبحان الله، فقالت أسماء: آية؟ فأشارت برأسها أن نعم؛ فقامت أسماء حتى تجلاها الغشي وجعلت تصب الماء فوق رأسها. فحمد النبي الله وأثنى عليه ثم قال إنه ما من شيء كان لم يره إلا وقد رآه في مقامه ذلك حتى الجنة والنار، وإنه أوحي إليه أنهم يُفتنون في القبور مثل أو قريباً من فتنة الدجال: يؤتى أحدهم فيُسأل ما علمه بهذا الرجل، فأما المؤمن أو الموقن فيقول هو محمد رسول الله جاءنا بالبينات والهدى فأجبنا وآمنا واتبعنا، فيُقال له نم صالحاً قد علمنا إن كنت لمؤمناً؛ وأما المنافق أو المرتاب فيقول لا أدري، سمعت الناس يقولون شيئاً فقلته. ويخرّجه المحقق عند البخاري ⁦(184، 1053، 7287)⁩ وأبي عوانة والطحاوي والبيهقي والبغوي من طرق أصحاب مالك، ويحيل على التمهيد (22/245). {cite:muwatta-maruf-1997 p.263}"
  tr: "Güneş tutulması namazı hakkında rivayet edilenler bölümündeki ilk hadis, Yahya'nın Malik'ten, o da Hişam ibn Urve'den, o da Fatıma bint el-Mundhir'den, o da Esma bint Ebu Bekir'den rivayet ettiği hadistir: Aişe, güneş tutulması sırasında geldi ve insanların namaz kıldığını gördü; kendisi de namaz kılıyordu. Aişe, insanlara ne olduğunu sordu. Aişe eliyle gökyüzünü işaret ederek, \"Allah'a hamd olsun\" dedi. Esma, \"Bu bir işaret mi?\" diye sordu. Aişe başıyla onayladı. Esma kendine gelince ayağa kalktı ve başına su dökmeye başladı. Peygamberimiz Allah'ı övdü ve yüceltti, sonra da o yerde görmediği hiçbir şey kalmadığını, cenneti ve cehennemi bile görmediğini söyledi. Ona, kabirlerinde Deccal'in yargılanmasına benzer veya neredeyse benzer bir yargılama ile sınanacakları vahyedildi: İçlerinden biri getirilecek ve bu adam hakkında ne bildiği sorulacak. Mümin veya kesin bilgiye sahip olan kişi, \"O, Allah'ın elçisi Muhammed'dir; bize açık deliller ve hidayetle geldi, biz de ona inandık ve onu takip ettik\" diyecek. Ona, \"Huzur içinde uyu, çünkü mümin olup olmadığını biliyorduk\" denilecek. Münafık veya şüpheci olan ise, \"Bilmiyorum; insanların bir şeyler söylediğini duydum, ben de tekrarladım\" diyecek. Bu, Buhari (184, 1053, 7287), Ebu Evane, Tahavi, Beyhaki ve Bağavi'nin eserlerinde, Malik'in arkadaşlarının rivayet zincirleriyle bulunur ve o, Temhid'e (22/245) atıfta bulunur. {cite:muwatta-maruf-1997 s.263}"
  id: "Hadits pertama dalam bab ini tentang apa yang telah diriwayatkan tentang salat saat gerhana. Diriwayatkan oleh Yahya dari Malik dari Hisham ibn Urwah dari Fatimah bint al-Mundhir dari Asma bint Abi Bakr: Aisyah datang ketika matahari gerhana dan melihat orang-orang sedang salat, dan dia juga sedang salat. Aisyah bertanya kepada mereka apa yang terjadi pada mereka, dan Aisyah menunjuk ke langit dengan tangannya dan berkata, \"Maha Suci Allah.\" Asma bertanya, \"Apakah ini pertanda?\" Aisyah mengangguk setuju. Asma berdiri hingga sadar kembali dan mulai menuangkan air ke atas kepalanya. Nabi memuji Allah dan mengagungkan-Nya, kemudian berkata bahwa tidak ada sesuatu pun yang belum pernah dilihatnya di tempat itu, bahkan Surga dan Neraka. Diwahyukan kepadanya bahwa mereka akan diuji di dalam kubur mereka dengan cobaan yang mirip, atau hampir mirip, dengan cobaan Antikristus: salah seorang dari mereka akan dibawa keluar dan ditanya apa yang diketahuinya tentang orang ini. Adapun orang beriman atau orang yang yakin, ia akan berkata, \"Dialah Muhammad, Rasulullah, yang datang kepada kami dengan bukti-bukti dan petunjuk yang jelas, maka kami pun menanggapi, beriman, dan mengikutinya.\" Akan dikatakan kepadanya, \"Tidurlah dengan tenang, karena kami tahu apakah engkau seorang yang beriman.\" Adapun orang munafik atau orang yang ragu, ia berkata, \"Aku tidak tahu; aku mendengar orang-orang mengatakan sesuatu, lalu aku mengulanginya.\" Hal ini ditemukan dalam karya-karya al-Bukhari (184, 1053, 7287), Abu ‘Awanah, al-Tahawi, al-Bayhaqi, dan al-Baghawi, melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (22/245). {cite:muwatta-maruf-1997 p.263}"
