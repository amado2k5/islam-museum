text: "… عَنِ الأَشْعَثِ بْنِ قَيْسٍ، قَالَ أَتَيْتُ رَسُولَ اللَّهِ فِي وَفْدِ كِنْدَةَ وَلاَ يَرَوْنِي أَفْضَلَهُمْ فَقُلْتُ يَا رَسُولَ اللَّهِ أَلَسْتُمْ مِنَّا. فَقَالَ \" نَحْنُ بَنُو النَّضْرِ بْنِ كِنَانَةَ لاَ نَقْفُو أُمَّنَا وَلاَ نَنْتَفِي مِنْ أَبِينَا \". قَالَ فَكَانَ الأَشْعَثُ بْنُ قَيْسٍ يَقُولُ لاَ أُوتَى بِرَجُلٍ نَفَى رَجُلاً مِنْ قُرَيْشٍ مِنَ النَّضْرِ بْنِ كِنَانَةَ إِلاَّ جَلَدْتُهُ الْحَدَّ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2612، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2612 (The Chapters on Legal Punishments), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2612، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
