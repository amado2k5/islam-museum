ref: "15.1593"
label: { ar: "الموطأ 1593 — خارجة بن زيد بن ثابت: كان جالسا عند زيد بن ثابت، فجاءه محمد بن أبي عتيق يبكي، لأنه ملك امرأته أمرها ففارقته، فقال زيد ارتجعها إن شئت فإنما هي واحدة", en: "Muwatta 1593", es: "Muwatta 1593", fr: "Muwatta 1593", ur: "موطا 1593", tr: "El-Muvatta 1593 — Harice ibn Zeyd ibn Sabit: Muhammed ibn Ebu Atık, Zeyd ibn Sabit ile otururken yanına ağlayarak geldi; çünkü karısına özgürlüğünü vermişti ve karısı onu terk etmişti. Zeyd, \"İstersen onu geri al, çünkü o tektir\" dedi.", id: "Al-Muwatta 1593 — Kharijah ibn Zayd ibn Thabit: Ia sedang duduk bersama Zayd ibn Thabit ketika Muhammad ibn Abi Atiq datang kepadanya sambil menangis, karena ia telah membebaskan istrinya dan istrinya meninggalkannya. Zayd berkata, “Ambillah dia kembali jika kau mau, karena dia hanya satu.”" }
summary:
  ar: "يروي مالك عن سعيد بن سليمان بن زيد بن ثابت عن خارجة بن زيد بن ثابت أنه كان جالسا عند زيد بن ثابت، فأتاه محمد بن أبي عتيق وعيناه تدمعان، فقال له زيد ما شأنك؟ فقال ملكت امرأتي أمرها ففارقتني. فقال له زيد ما حملك على ذلك؟ قال القدر. فقال زيد ارتجعها إن شئت، فإنما هي واحدة، وأنت أملك بها. {cite:muwatta-maruf-1997 p.63}"
  tr: "Malik, Sa'id ibn Sulayman ibn Zayd ibn Thabit'ten, o da Kharijah ibn Zayd ibn Thabit'ten rivayet eder ki, kendisi Zayd ibn Thabit ile otururken Muhammed ibn Abi Atık gözlerinde yaşlarla yanına geldi. Zayd ona, \"Sorun nedir?\" diye sordu. O da, \"Eşim kendi işlerine el koydu ve beni terk etti\" diye cevap verdi. Zayd ona, \"Bunu neden yaptın?\" diye sordu. O da, \"Kader\" dedi. Zayd, \"İstersen onu geri al, çünkü o tektir ve senin onun üzerinde daha çok hakkın var\" dedi. {cite:muwatta-maruf-1997 s.63}"
  id: "Malik meriwayatkan dari Sa'id ibn Sulayman ibn Zayd ibn Thabit, dari Kharijah ibn Zayd ibn Thabit, bahwa ia sedang duduk bersama Zayd ibn Thabit ketika Muhammad ibn Abi Atiq datang kepadanya dengan air mata di matanya. Zayd bertanya kepadanya, \"Ada apa?\" Ia menjawab, \"Istriku mengambil alih urusannya sendiri dan meninggalkanku.\" Zayd bertanya kepadanya, \"Apa yang membuatmu melakukan itu?\" Ia berkata, \"Takdir.\" Zayd berkata, \"Ambillah dia kembali jika kau mau, karena dia hanya satu, dan kau memiliki hak yang lebih besar atasnya.\" {cite:muwatta-maruf-1997 p.63}"
