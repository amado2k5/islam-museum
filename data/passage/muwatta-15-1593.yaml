label: { ar: "الموطأ 1593 — خارجة بن زيد بن ثابت: كان جالسا عند زيد بن ثابت، فجاءه محمد بن أبي عتيق يبكي، لأنه ملك امرأته أمرها ففارقته، فقال زيد ارتجعها إن شئت فإنما هي واحدة", en: "Muwatta 1593" }
summary:
  ar: "يروي مالك عن سعيد بن سليمان بن زيد بن ثابت عن خارجة بن زيد بن ثابت أنه كان جالسا عند زيد بن ثابت، فأتاه محمد بن أبي عتيق وعيناه تدمعان، فقال له زيد ما شأنك؟ فقال ملكت امرأتي أمرها ففارقتني. فقال له زيد ما حملك على ذلك؟ قال القدر. فقال زيد ارتجعها إن شئت، فإنما هي واحدة، وأنت أملك بها. {cite:muwatta-maruf-1997 p.63}"
