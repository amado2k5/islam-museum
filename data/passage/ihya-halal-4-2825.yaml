text: "… متعين على كل من يقدر عليه أو شهادة متعينة فيحرم عليه ما يأخذه وهي الرشوة التي لا يشك في تحريمها وإن كان مباحا ً لا واجبا ً ولا حراما ً وكان فيه تعب بحيث لو عرف لجاز الاستئجار"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 2825، يذكر الحرام، وما حُرّم، والتحريم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 2825, that mentions the unlawful, what was made unlawful, prohibition, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 2825 کا اقتباس جس میں حرام، جو حرام کیا گیا، تحریم، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 2825, que menciona lo ilícito, lo que se convirtió en ilícito, la prohibición y lo permitido; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
