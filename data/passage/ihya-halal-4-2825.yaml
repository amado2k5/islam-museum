  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 2825. sayfasından bir alıntı; haram olan, yasak olan, yasaklanmış olan ve izin verilen şeyleri ele almaktadır; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
