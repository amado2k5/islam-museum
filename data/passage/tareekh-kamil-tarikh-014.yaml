text: "حته إلى خاتمته، نحيي ما أحيا ونميت ما أمات، فما وجد الحكمان في كتاب الله، وهما أبو موسى عبد الله بن قيس، وعمرو بن العاص، عملا به، وما لم بجداه في كتاب الله فالسنة العادلة الجامعة غير المفرقة. وأخذ الحكمان"
