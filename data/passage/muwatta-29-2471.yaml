summary:
  ar: "قال مالك: وليس في الجراح في الجسد، إذا كانت خطأ، عقل إذا برئ الجرح وعاد لهيئته؛ فإن كان في شيء من ذلك عثل أو شين فيُجتهد فيه، إلا الجائفة فإن فيها ثلث دية النفس. وليس في المنقلة من الجسد عقل، وهي مثل موضحة الجسد. {cite:muwatta-maruf-1997 p.421} {cite:muwatta-maruf-1997 p.422}"
