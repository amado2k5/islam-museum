text: "ن أمن معه أن يعودوا في ملتهم وكان أولئك المؤمنون في ملتهم. ففي جوابه عليه السلام تغليب للأكثر وهو متعين. ومثل الرازي أيضا بقوله تعالى: الله ولي الذين آمنوا يخرجهم من الظلمات إلى النور) [البقرة: ٢٥٧] وفيه ما فيه ."
