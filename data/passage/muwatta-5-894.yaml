label: { ar: "الموطأ 894 — أنس بن مالك: خرج علينا رسول الله، فقال: إني أُريت هذه الليلة، حتى تلاحى رجلان فرُفعت، فالتمسوها في التاسعة والسابعة والخامسة", en: "Muwatta 894", ur: "موطأ 894 — انس: لیلة القدر کا خواب اور رُفع ہونا", es: "Muwatta 894", fr: "Muwatta 894", tr: "El-Muvatta 894 — Enes bin Malik: Allah'ın Resulü bize çıktı ve şöyle buyurdu: “Bu gece bana gösterildi, ancak iki adam çekişince alındı. Onu dokuzuncu, yedinci ve beşinci günlerde arayın.”", id: "Al-Muwatta 894 — Anas bin Malik: Rasulullah SAW keluar kepada kami dan berkata: “Aku diperlihatkan malam ini, hingga dua orang bertengkar dan benda itu diambil. Maka carilah pada tanggal sembilan, tujuh, dan lima.”" }
text: "إني أريت هذه الليلة، حتى تلاحى رجلان فرفعت، فالتمسوها في التاسعة والسابعة والخامسة"
summary:
  ar: "يرويه زياد عن مالك عن حميد الطويل عن أنس بن مالك، أنه قال: خرج علينا رسول الله في رمضان فقال: إني أُريت هذه الليلة حتى تلاحى رجلان فرُفعت، فالتمسوها في التاسعة والسابعة والخامسة. ويذكر المحقق أن هذا الحديث يرويه أنس عن عبادة بن الصامت مرفوعاً، وأنه عند ابن عبد البر في التمهيد (2/200). {cite:muwatta-maruf-1997 p.429}"
  ur: "موطأ میں حدیث، نمبر 894: انس بن مالک سے نبی نے کہا: «میں نے آج رات لیلة القدر کا خواب دیکھا یہاں تک کہ دو آدمیوں نے لڑائی کی تو وہ بلند کر دی گئی؛ اسے آخری سات، نویں، ساتویں اور پانچویں رات میں تلاش کرو»۔"
  tr: "Ziyad'ın Malik'ten, o da Humaid el-Tawil'den, o da Enes ibn Malik'ten rivayet ettiğine göre, Allah'ın Resulü Ramazan ayında bize çıktı ve şöyle buyurdu: \"Bu gece bana gösterildi, ta ki iki adam kavga edene kadar, sonra da kaldırıldı. Onu dokuzuncu, yedinci ve beşinci gecelerde arayın.\" Araştırmacı, bu hadisin Enes'in Ubadah ibn el-Samit'ten rivayet ettiğini, Peygamber'e dayandırıldığını ve İbn Abd el-Barr'ın el-Tamhid'inde (2/200) bulunduğunu belirtiyor. {cite:muwatta-maruf-1997 s.429}"
  id: "Diriwayatkan oleh Ziyad dari Malik, dari Humaid al-Tawil, dari Anas ibn Malik, yang berkata: Rasulullah SAW keluar kepada kami di bulan Ramadan dan berkata: “Aku diperlihatkan malam ini hingga dua orang bertengkar, kemudian malam itu hilang. Maka carilah malam itu pada tanggal sembilan, tujuh, dan lima.” Peneliti menyebutkan bahwa hadits ini diriwayatkan oleh Anas dari Ubadah ibn al-Samit, yang ditelusuri kembali kepada Nabi, dan terdapat dalam kitab al-Tamhid karya Ibnu Abd al-Barr (2/200). {cite:muwatta-maruf-1997 p.429}"
