label: { ar: "الموطأ 894 — أنس بن مالك: خرج علينا رسول الله، فقال: إني أُريت هذه الليلة، حتى تلاحى رجلان فرُفعت، فالتمسوها في التاسعة والسابعة والخامسة", en: "Muwatta 894" }
text: "إني أريت هذه الليلة، حتى تلاحى رجلان فرفعت، فالتمسوها في التاسعة والسابعة والخامسة"
summary:
  ar: "يرويه زياد عن مالك عن حميد الطويل عن أنس بن مالك، أنه قال: خرج علينا رسول الله في رمضان فقال: إني أُريت هذه الليلة حتى تلاحى رجلان فرُفعت، فالتمسوها في التاسعة والسابعة والخامسة. ويذكر المحقق أن هذا الحديث يرويه أنس عن عبادة بن الصامت مرفوعاً، وأنه عند ابن عبد البر في التمهيد (2/200). {cite:muwatta-maruf-1997 p.429}"
