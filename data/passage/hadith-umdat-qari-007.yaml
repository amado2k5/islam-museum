text: "] أي: مصنوعا مختلقا، ويقال: عظيما. قوله: ((ولا تعصوا)، وفي باب وفود الأنصار: ولا نعصوني، والعصيان خلاف الطاعة. قوله: ((في معروف)) أي: حسن، وهو ما لم ينه الشارع فيه، أو معناه مشهور أي: ما عرف فعله من الشارع واشتهر منه،"
