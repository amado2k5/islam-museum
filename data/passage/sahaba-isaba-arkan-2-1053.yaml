text: "… قار أزفلة من الناس، فسمعته يقول: المُسْلِمُ أَخُو المُسْلِمِ. وأدرك عِلْباء الجاهلية والإسلام وشهد الفتوح في عهد عمر ثم شهد الجمل فاستشهد بها. وذكره خليفة في باب الرواة من الصحابة، وهو في باب من نزل البصرة من الصحابة. وسيأتي له …"
