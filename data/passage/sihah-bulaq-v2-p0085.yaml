text: |-
  عفاص وبروع اسم ناقتين للشاعر
  المذكور قاله المؤلف
  ٥٠٢
  •(شوى
  بالتر كية بس ( لا الشلو العضو من أعضاء اللحم وفى الحديث ائننى بشاوها الاين
  وأشلاء الانسان أعضاؤه بعد البلا والتقرّق وينوفلان أشلاء فى بن فلان أى بقايافيهم قال
  تعلب وقول الناس أشليت السكلب على الصيد خطأ وقال أبوز يد أشليت الكلب دعونه!
  وقال ابن السكيت بقال أوسدت السكلب بالصيد وآسدته اذا أغريته به ولا يقال أشليته انمام
  الاشسلاء الدعاء يقال أشليت الشاة والنساقة اذادء وتهما بأسماتهما لتصلبهما قال الراعى
  وان بركت منها عجاسامجلة • يمنية أشلى العفاس وبروعا
  وقال آخر أشلبت عنزى ومسحت قعى ل، ثم تهبأت لشرب قأب
  وقول زياد الاعجم أتينا أباعم روفأشلى كلابه * علينا فكدنابين بيتبه نوكل
  ويروى فأغرى كلابه واستشلاه واشتلاه أى استنقذه وكل من دعونه حتى تخرجه وتنحيه من
  موضع هلكة فقد استشليته وأشليته قال القطامى يمدح رجلا
  قتلت بكرا وكلبا واشتليت بنا • فقد أردت بأن يستجمع الوادى
  أبوزيدذهبت ماشية فلان ويقيت لهشلية وجعهاشلايا ولا يقسال الافى المال ⁦(شوى )⁩
  شويت اللحم شيا والاسم الشواء والقطعة منمشواءة وأنشداً بوعمرو
  وانسب لنا الدهما طاهى وعجان • لنا بشواة مر معلّ ذوبها
  واشتويت اتخذت شواء وقال • فاشتوى ليلة ريح واحتمل* وقد انشوى اللحم ولا تقل
  اشتوى قال الراجز
  قد انشوى شواؤنا المرعيل • فاقتربوا الى الغداء فكلوا
  والشاوىّ صاحب الشاء قال الراجز
  لا تنفع الشاوى فيهاشاته * ولاحاراه ولاعلاته
  وأشويت القوم أطعمتهم شواء وتعشى فلان فأشوى من عشائه أى أبقى منه بقية والشوى
  جمع شواة وهى جلدة الرأس والشوى اليدان والرجلان والرأس من الادميين وكل ماليس
  مقتلا يقال رماء فأشواه اذالم يصب المقتل قال الهذلى
  فان من القول التى لاشوى لها * اذازلّ عن ظهر اللسان انفلاتها
  يقول ان من القول كلة لا تشوى ولكن تقتل وقال الاعشى
  قالت قتيلة ماله * قد جلات شيباشواته .
  قال آبو عبيدة أنشدها أبو ألخطاب الاخفش أباعمروبن العلاه فقال له صحفت انما هو سراته
  أى نواحبه فسكت أبو انططاب ثم قال لنابل هو صف انماهو شواته قال أبو عبيدة ثم ممعت
  رجلا من أهل المدينة بقول اقشه رن شواتى أى جادة رأسى وشوى الفرس قوائه لانه
  بقال عبل الشوى ولا يكون هذا اللر أس لانهم وصفوا الخيل بأسالة الحدّين وعتق الوجه وهو
  رقته والشوى رذال المال والشوى هو الشى الهين اليسير والشوية بقية قوم هلكوا
  والجمع شوايا قال .
  فهم شرّ الشوايامن عود * وعرف شر منتعل وحَافى
  والشواية بالضم الشى الصغير من الكبير كالقطعمن الشاة ويقال مابقى من الشاة الاشواية
  وشراية
