label: { ar: "الموطأ 625 — عروة: ما أحب أن أدفن بالبقيع؛ إما ظالم فلا أحب أن أدفن معه، وإما صالح فلا أحب أن تنبش لي عظامه", en: "Muwatta 625", es: "Muwatta 625", fr: "Muwatta 625", ur: "موطا 625", tr: "El-Muvatta 625 — Urve: El-Baki’ mezarlığına gömülmek istemiyorum; ya zalim biriyim ve onunla birlikte gömülmek istemiyorum, ya da salih biriyim ve kemiklerinin mezardan çıkarılmasını istemiyorum.", id: "Al-Muwatta 625 — Urwah: Aku tidak ingin dikuburkan di Al-Baqi’; entah aku adalah seorang penindas dan aku tidak ingin dikuburkan bersamanya, atau aku adalah orang yang saleh dan aku tidak ingin tulang-tulangnya digali." }
text: "إنما هو أحد رجلين: إما ظالم فلا أحب أن أدفن معه، وإما صالح فلا أحب أن تنبش لي عظامه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: ما أحب أن أُدفن بالبقيع، ولأن أُدفن بغيره أحب إلي، لأن من فيه أحد رجلين: إما ظالم فلا أحب أن أُدفن معه، وإما صالح فلا أحب أن تُنبش لي عظامه. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي عند البيهقي (4/58)، وأن عبد الرزاق (6735) أخرجه عن ابن جريج عن هشام. {cite:muwatta-maruf-1997 p.318}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından rivayet ederek şöyle buyurmuştur: \"Baki' mezarlığına gömülmek istemiyorum, başka bir yere gömülmeyi tercih ederim, çünkü oraya gömülen kişi iki türden biridir: ya zalimdir, ki onunla birlikte gömülmek istemem, ya da salih bir kişidir, ki kemiklerinin mezardan çıkarılmasını istemem.\" Araştırmacı, Ebu Musab ve Şafiî'nin bunu Malik'ten rivayet ettiğini, el-Beyhaki'nin (4/58) kaydettiğini ve Abdülrazzak'ın (6735) bunu İbn Cüreyc'ten, o da Hişam'dan rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.318}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, yang meriwayatkannya dari ayahnya, yang berkata: “Aku tidak ingin dimakamkan di al-Baqi’, dan aku lebih suka dimakamkan di tempat lain, karena siapa pun yang dimakamkan di sana adalah salah satu dari dua jenis orang: seorang penindas, dalam hal ini aku tidak ingin dimakamkan bersamanya, atau orang yang saleh, dalam hal ini aku tidak ingin tulang-tulangnya digali.” Peneliti menyebutkan bahwa Abu Mus’ab dan al-Shafi’i meriwayatkan hadits ini dari Malik, sebagaimana dicatat oleh al-Bayhaqi (4/58), dan bahwa ‘Abd al-Razzaq (6735) meriwayatkannya dari Ibn Jurayj, yang meriwayatkannya dari Hisham. {cite:muwatta-maruf-1997 p.318}"
