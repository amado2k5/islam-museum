label: { ar: "الموطأ 625 — عروة: ما أحب أن أدفن بالبقيع؛ إما ظالم فلا أحب أن أدفن معه، وإما صالح فلا أحب أن تنبش لي عظامه", en: "Muwatta 625" }
text: "إنما هو أحد رجلين: إما ظالم فلا أحب أن أدفن معه، وإما صالح فلا أحب أن تنبش لي عظامه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: ما أحب أن أُدفن بالبقيع، ولأن أُدفن بغيره أحب إلي، لأن من فيه أحد رجلين: إما ظالم فلا أحب أن أُدفن معه، وإما صالح فلا أحب أن تُنبش لي عظامه. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي عند البيهقي (4/58)، وأن عبد الرزاق (6735) أخرجه عن ابن جريج عن هشام. {cite:muwatta-maruf-1997 p.318}"
