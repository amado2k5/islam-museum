text: "… أبوه و كان عبداة بن الزبواذا حدث به-ذا الحديث غضب واعتراه أفكل وهو الوعدة لانه، كان تعده على قوته وكان أب وكانمتله مصرفة بأسسة بالعريسة والحديت الزيد أيضا شديد القوق ومن فوته أيضا الحكاء المبرد فى كتابه أن ملك الروم …"
