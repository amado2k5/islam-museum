text: "… الدم حراماً؟ قال: ذلك من ضرورة. - حدَّثنا أبو بكر قال: حدَّثنا شَرِيك عن جابر عن أبي جعفر قال: إذا اضطر إلى ما حُرِّم عليه فما حُرِّم عليه فهو له حلال. - في المرأة تموت وفي بطنها ولدها، ما يُصْنَعُ …"
