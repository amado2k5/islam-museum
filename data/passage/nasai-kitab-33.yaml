summary:
  ar: "القسم 33 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرقبى»، ويضم فيها النصوص من 3706 إلى 3719 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 33 of Sunan al-Nasa'i (The Book of ar-Ruqba) in the division of the open hadith dataset the museum took its reports from: reports 3706 to 3719 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 33، عنوان «کتاب الرقبیٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3706 تا 3719۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 33 de Sunan al-Nasa'i (El Libro de ar-Ruqba) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3706 al 3719, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
