text: "وَنُفِخَ فِى ٱلصُّورِ فَصَعِقَ مَن فِى ٱلسَّمَـٰوَٰتِ وَمَن فِى ٱلْأَرْضِ إِلَّا مَن شَآءَ ٱللَّهُ ۖ ثُمَّ نُفِخَ فِيهِ أُخْرَىٰ فَإِذَا هُمْ قِيَامٌ يَنظُرُونَ"
text_search: "ونفخ في الصور فصعق من في السماوات ومن في الأرض إلا من شاء الله ۖ ثم نفخ فيه أخرى فإذا هم قيام ينظرون"
translations:
  en: { text: "And the trumpet is blown, and all who are in the heavens and all who are in the earth swoon away, save him whom Allah willeth. Then it is blown a second time, and behold them standing waiting!", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور جب صور پھونکا جائے گا تو جو لوگ آسمان میں ہیں اور جو زمین میں ہیں سب بےہوش ہو کر گر پڑیں گے مگر وہ جس کو خدا چاہے۔ پھر دوسری دفعہ پھونکا جائے گا تو فوراً سب کھڑے ہو کر دیکھنے لگیں گے", translator: "Fateh Muhammad Jalandhari", license: PD }
