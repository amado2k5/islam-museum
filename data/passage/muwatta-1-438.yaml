label: { ar: "الموطأ 438 — ابن عمر لا يقنت في شيء من الصلاة", en: "Muwatta 438" }
summary:
  ar: "أثر وحيد في باب القنوت في الصبح. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان لا يقنت في شيء من الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وابن وهب عند الطحاوي وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.226}"
