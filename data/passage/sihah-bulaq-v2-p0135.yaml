text: |-
  ٢٥٤
  •تراح
  ض الثاء أى لكسائى أتى الخرزينأى وأثأيته أنا اذا خرمته والتأى اللخرم
  والفتق قال جرير هو الوافد الميون والراتق النأى • اذا النعل يوما بالعشيرة زات
  وأثأيت فى القوم برحت فيهم قال الشاءر
  يالك من عيش ومن انا. . يعقب بالفتل وبالسباء
  با الاصحى تبيت على النى تنبية أى دمت عليه قال أيو عمر والتنبية التنامعلى
  الرجل فى حيانه وأنتداميعابيت لبيد
  يأب شناممن كريم وقوله • ألا ائعم على حسن التصية واشرب
  والثبة ابهاعة وأصلهائي والهع ثبسات وثبون وثبون وأثابة قال الراجز
  دون أثابى من الخيل زمر• والنبسة أيضاوسط الحوض الذى يثوب اليه الماء والهاءههنا
  عوض من الواو الذاهبة من وسطه لان أصله توب كما قالوا أقام اقامة وأصله اقوا ما فه وضوا
  الهاء من الوا والذاهبة من عين الفسعل ⁦( دا)⁩ الثدى يذكرويونت وهو للمرأة والرجل
  أيضا والجع أندوندى على فعول وندى أيضا بكسر الثاهاتباعا لما بعدها من الكسر وامرأة
  ندياء عظيمة القديين ولا يقال رجل أندى والتدام مثال المكامنيت وذوالقدية لقب رجل
  اممه ترملة فن قال فى التدى انه مذ كريقول انما أدخلوا الهاءفى التصغرلان معناه المد
  وذلك أنّ يده كانت قصيرة مقدار المدى يدل على ذلك أنهم يقولون فيه ذواليدية وذوالندية
  جميعا قال ثعلب الثندوة بفتح أواها غير مهموز مثال الترقوة والعروة على فعلوة وهى مغرز
  الشدى فاذاضممت همزت وهى فعللة قال أبو مبيدة وكان رؤية يهمز النقدوة وسية القوس
  قال والعرب لاته-مزواحدامنهما ⁦(ترا)⁩ الترى التراب الندى وأرض زياءذات ندى
  ويقال التق التريان وذلك أن يجىء المطرفير مخ فى الارض حتى يلتق هو وندى الارض
  وأماقول طفيل
  يدن ذياد الخامسات وقد بدا • رى الماء من أعطافها المتحاب
  فانه ريد الغرق قال الاصهعى العرب تقول شهرترى وشهر ترى وشهر مرعى أى تطر أ ولا
  ١ثم يطلع النبات فتراه ثم يطول فترعاه النعم والثراه كثرة المال قال علقمة بن عبدة يصف النساء
  يردن زاه المال حيث علنه • وشرخ الكباب عندهنّ عجيب
  والمال انثرى على فعيل هو الكثير ومنه رجل تروان وامر أة تروى وتصغيرها ريادزريا
  اسم امر أمن أمية الصغرى شيب بهماحمر بن أب ربيعة والتريا النجم والنروة كثرة العدد
  قال ابن السكيت يقسال انه لذونروة وذوتراء يراديه انه لذوعد دوكثرة مال قال ابن مقبل
  وثروة من رجال لورأيتهم • لقلت احدى حراج الجرمن أقر
  ويقال هذا مثراة للمال أى مكثرة وثريت بك بكسر الراء أى كترت بك ويقال ثريت بقلان
  فأنا ئربه أى غنى عن الناس وقال ابن السكيت ترى بذلك يثرى اذا ذرح يه وسرّ الاصمى
  تزاالقوم يندون اذا كثروا وغمواوترا المال نفسه ينرواذاكز وقال أبو عمروزا اقهالقوم
  كنرهم ونرونا القوم أى كنا أكثر منهم وأثرى الرجل اذا كترت أمواله قال الكميت
  يمدح بف أمية لكم مسبجدا اللّٰه المزوران والحصى • لكم قبصه من بين أثرى وأقترا
  إراد
