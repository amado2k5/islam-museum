label: { ar: "سنن النسائي 523 — الأب والأبوة", en: "Sunan al-Nasa'i 523 — the father and fatherhood", ur: "سنن نسائی 523 — باپ اور والدیت", es: "Sunan al-Nasa'i 523 — El padre y la paternidad", fr: "Sunan al-Nasa'i 523 — le père et la paternité", tr: "Sunan an-Nasa'i 523 — Baba ve Babalık", id: "Sunan an-Nasa'i 523 — Sang Ayah dan Peran Ayah" }
text: "… قَالاَ حَدَّثَنَا أَبُو دَاوُدَ، عَنْ بَدْرِ بْنِ عُثْمَانَ، قَالَ إِمْلاَءً عَلَىَّ حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي مُوسَى، عَنْ أَبِيهِ، قَالَ أَتَى النَّبِيَّ سَائِلٌ يَسْأَلُهُ عَنْ مَوَاقِيتِ الصَّلاَةِ فَلَمْ يَرُدَّ عَلَيْهِ شَيْئًا فَأَمَرَ بِلاَلاً فَأَقَامَ بِالْفَجْرِ حِينَ انْشَقَّ ثُمَّ أَمَرَهُ فَأَقَامَ بِالظُّهْرِ حِينَ زَالَتِ الشَّمْسُ وَالْقَائِلُ يَقُولُ انْتَصَفَ النَّهَارُ وَهُوَ أَعْلَمُ ثُمَّ أَمَرَهُ فَأَقَامَ بِالْعَصْرِ وَالشَّمْسُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 523، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 523 (The Book of the Times (of Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 523، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 523 (El Libro de los Tiempos de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 523 (Le Livre des Heures de la Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 523 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 523, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
