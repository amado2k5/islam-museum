text: |-
  ٢٥٤٠
  • ⁦(ف صل الالف)⁩.
  ووجه مشرق الحدر • كان ثدياهسقان
  ويروى ثدييه على الاعمال وكذلك اذاحذفتها ان شئت نصبت وان شئت رقعت قال طرقة
  ألا أيهذا الزاجرى أحضر الوغا • يروى بالنصب على الاعمال والرفع أجود قال تعالى قل
  أفغير اللّه تأحرونى أعبدأيها الجاهلون واتى واننى بمعنى وكذلك كأنى وكأتى ولكن ولكننى
  لانه كثر استعمالهم امذه الحروف وهم يستتقلون التضعيف فخذفوا النون التى تلى الياء
  وكذلك لعلى ولعلى لان اللام قريمة من النون وان زدت على ان ماصار للتعيين كقوله تعالى انما
  الصدقات للفقراءلائه يوجب اثباب الحكم للمذ كودونفيه عماعداه وأن قد تكون مع الفعل
  المستقبل فى معى مصدر فتنصبه تقول أريد أن تقوم والمعسف أريد قيامك فان دخلت عسلى
  فعل ماض كانت معه بمعنى مصدرقد وقع الا أنها لا تعمل تقول أعجبنى أن قت والمعنى أعجبنى
  قيسامك الذى مضى وأن قد تسكون مخففة عن المشددة فلا تعمل تقول بلغنى أن زيد خارج
  قال اللّٰه تعالى ونودوا أن تدكموالجنة أورثتموها وأما ان المكسورة فهى حرف للجزأه يوقع
  الشافى من أجل وقوع الأول كفولك ان تأتى آتك وان جمتنى أكرمئك وتكون بعدى ما فى
  النقى كة وله تعالى ان الكافرون الافى غرورور بماجع.ينهما للتأ كيدكما قال الراجز الاغلب
  العجلى
  ماان رأشا ملكا أغارا • أكثرمنه قرة وقارا
  وقد تكون فى جواب القسم تقول واللّٰه ان فعلت أى مافعلت وأماقول عبد اللّٰه بن
  قيس الرقيات
  بكرت عسلى"ء واذلى• يلهيننى وألو مهنه* ويقلن شيب قد علا* ل وقد كبرت فقلت انه
  أى انه قد كان كما يقلن قال أبو عبيد وهذا اختصار من كلام العرب يكتفى منه بالضمير لانه قد علم
  معناه وأماقول الاخفش انه بمعنى نعم فاغايريد تأويله ليس أنه موضوع فى اللغة لذلك قال
  أوهذه الهاء أدخلت للسكوت قال وأنّ المفتوحة قد تكون بمعى لهل كقوله تعالى وما يشعركم
  أنها اذاجاءت لا يؤمنون وفى قراءة أبى لهلها وأن المفتوحة الخففة قد تكون بعنى أى كقوله
  تعالى وانطلق الملا منهم أن امشوا وأن قد تكون صلة للما كقونه تعالى فلم أن جاء البشير
  وقد تكون زائدة كة وله تعالى ومالهم ألا يعذبهم اللّٰه يريد وما لهم لا يعذبهم اللّٰه وقد تكون ان
  المكسورة المخففة زائدة مع ما كولك ماان يقوم ز يدوقد تكون مخففة من الشديدة ذهذه
  لايدّ من أن تدخل اللام فى خيبرهاء وضأمما حذف من التشديدكقوله تعالى ان كل نفس
  لمما عليهاحافظ وان زيدلا خوك لثلا تلتبس بان التى بمعنى ماللنفى وأماقولهم أنافهواسم مكنىّ
  وهو للمتكام وحسده وانمابى على الفتح فرقابينه ويين أن التى هى خرف ناصب للفعل والالف
  الاخيرة اتماهى لبيان الحركة فى الوقف فان توسطت الكلام سقطت الافى لغة رديئة
  كما قال حيدبن بحدل
  أناسيف العشيرة فاء رفونى • حيداقد تذرّيت السناما
  واعلم أنه قد توصل بها تاء الخطاب فيصيران كالشئ الواحد من غير أن تكونمضافة اليه تقول
  أنت وتكسر لامؤنت وأنتم وأنثن وقد تدخل عليها كاف التشبيه تقول أنت كا ناوأنا كأنت
  -كى ذلك عن العرب وكاف التشيه لا تشصل بالمضمر واغما ئتصل بالمظهر تقول أنت كزيد
  ولاتقول
