text: "… الاسْتِخَارَة. كِتَابُ دَلائِل الأئِمَّة. كِتَابُ الصَّوْم والكَفَّارات. كِتَابُ الجَمْع بين الصَّلاتَيْن. كِتَابُ المَسَاجِد. كِتَابُ المآئِم. كِتَابُ فَرْض طَاعَة العُلَمَاء. كِتَابُ الصَّدَقَة غَيْر الوَاجِبَة. كِتَابُ • الكَتْبَة. كِتَابُ جَلْد الشَّارِب. كتَابُ ما أُبِيحَ قَتْلُه للمُحْرِمِ. كِتَابُ وُجُوب الحَجّ. كِتَابُ بَاطِن القِرَاءَات. …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 965، يرد فيه ذكر الفرض، والواجب، والوجوب، والمباح، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 1, p. 965, whose wording mentions the obligatory (fard), the obligatory (wajib), obligation (wujub), the permitted (mubah), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 1، ص 965 کا اقتباس جس میں فرض، واجب، وجوب، مباح، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Fihrist de Ibn al-Nadim, volume numérisé 1, p. 965, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), l'obligation (wujub), le permis (mubah), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Fihrist de Ibn al-Nadim, volumen digitalizado 1, p. 965, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), la obligatoriedad (wujub), lo permitido (mubah), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Nadim'in Fihrist adlı eserinin 1. cildinin 965. sayfasından, zorunlu, gerekli, mecburi, caiz ve itaat terimlerini içeren bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Zorunlu, gerekli, itaat gerektiren, tavsiye edilen, mekruh edilen, yasaklanan ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Jilid 1, halaman 965, yang menyebutkan istilah wajib, perlu, diharuskan, diperbolehkan, dan ketaatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk kata-kata wajib, perlu, taat, dianjurkan, tidak disukai, dilarang, dan dosa-dosa kecil."
