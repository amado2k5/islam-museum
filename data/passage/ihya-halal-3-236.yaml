text: "… ماهو ناسجه ولما انكشف لأولياء اللّه تعالى أن العبد مهلك نفسه بأعماله واتباعه هوى نفسه إهلاك دود القز نفسه رفضوا الدنيا بالسكاية حتى قال الحسن : رأيت سبعين بدريا كانوا فيما أحل اللّٰه لهم أزهد فيما حرم اللّٰه عليكم. وفى …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 3، ص 236، يذكر ما أُحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 3, p. 236, that mentions what was made lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 3، ص 236 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 3, pág. 236, que menciona lo que se hizo lícito y lo que se hizo ilícito; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 3, page 236), mentionnant ce qui a été déclaré licite et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Halal and Haram Browser."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 3. cildinin 236. sayfasından, helal ve haram olanı belirten bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 3, halaman 236, yang menyebutkan apa yang diperbolehkan dan apa yang diharamkan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
