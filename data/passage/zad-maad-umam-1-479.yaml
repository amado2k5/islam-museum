text: "… رسول اللَّه ل جميع مقاتلة بني قُريظة، ولم يسأل عن كل رجل منهم: هل نقض العهد أم لا؟ وكذلك أجلى بني النَّضير كُلَّهم، وإنما كان الذي هَمّ بالقتلِ رجلان، وكذلك فعلَ ببني قَيْنُقَاعٍ حتى استوهبهم منه عبدُ اللّٰه بن أبي، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 479، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
