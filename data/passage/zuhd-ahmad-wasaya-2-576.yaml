text: "… تَأْسيسِ ضلالَةٍ. - حدَّثنا عبدُ الله، قال: حدَّثني إِسماعيلُ بنُ بَهْرامَ الكوفيُّ، قال: ثنا أَبو بكرٍ ابنُ عيَّاشٍ، عن عاصمٍ، قال: لما حضرَ عمرَ بنَ عبدِ العزيزِ الوفاةُ، قالت لهُ امرأتُه فاطمةُ بنتُ عبدِ الملكِ: أَوصٍ، قال: أُوصِيكِ أَن تَزَوَّجِي …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 2، ص 576، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 2, p. 576, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 2، ص 576 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
