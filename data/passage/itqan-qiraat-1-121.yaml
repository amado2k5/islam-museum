text: "… قال لما جمع ابو بكر القرآن قال سموه فقال بعضهم سموة انجياا فكرهوه وقال بعضهم سموة السفر فكرهوه من يهود فقال ابن مسعود أيت بالحبشة كقابا يدعونه المصحف فسموه به قلت اخرج ابن اشته في كتاب المصاحف من طريق موسى …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 121، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 121, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 121 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
