text: "… اللّٰه حرّم عليكم عقوق الأمّهات، ووأد البنات، ومنع وهات، وكره لكم قيل وقال، وكثرة السّؤال، وإضاعة المال. سفيان وأحمد في مسنده من طريق مسعر و من طريق حماد بن سلمة، ثلاثتهم عن سعد بن إبراهيم به. وأخرجه ابن أبي شيبة …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 275، يرد فيه ذكر ما كرهه الله للناس، وما حرّم الله ورسوله، وما حُرّم على الناس، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 275, whose wording mentions what God disliked for people, what God and His Messenger forbade, what was forbidden to people, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 275 کا اقتباس جس میں جو اللہ نے لوگوں کے لیے ناپسند کیا، جو اللہ اور اس کے رسول نے حرام کیا، جو لوگوں پر حرام کیا گیا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 275, dont le texte mentionne ce que Dieu a réprouvé pour les gens, ce que Dieu et Son Messager ont interdit, ce qui a été interdit aux gens, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 275, cuyo texto menciona lo que Dios reprobó para la gente, lo que Dios y Su Mensajero prohibieron, lo que se prohibió a la gente, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
