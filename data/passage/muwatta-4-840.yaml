summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه كان يقول: من استقاء وهو صائم فعليه القضاء، ومن ذرعه القيء فليس عليه القضاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده. {cite:muwatta-maruf-1997 p.408}"
