label: { ar: "الموطأ 1061 — هشام بن عروة عن أبيه: رأى عبد الله بن الزبير أحرم بعمرة من التنعيم، ثم رآه يسعى حول البيت الأشواط الثلاثة", en: "Muwatta 1061" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه رأى عبد الله بن الزبير أحرم بعمرة من التنعيم، ثم رآه يسعى حول البيت الأشواط الثلاثة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1285) وسويد (542) والشيباني (456). {cite:muwatta-maruf-1997 p.490}"
