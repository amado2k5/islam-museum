label: { ar: "الموطأ 1061 — هشام بن عروة عن أبيه: رأى عبد الله بن الزبير أحرم بعمرة من التنعيم، ثم رآه يسعى حول البيت الأشواط الثلاثة", en: "Muwatta 1061", es: "Muwatta 1061", fr: "Muwatta 1061", ur: "موطا 1061", tr: "El-Muvatta 1061 — Hişam ibn Urve, babasının rivayetine göre: Abdullah ibn el-Zübeyr'in Tanim'den Umre için ihram haline girdiğini, sonra da Kâbe'nin etrafında üç tavaf yaptığını gördü.", id: "Al-Muwatta 1061 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Dia melihat Abdullah ibn al-Zubayr memasuki keadaan ihram untuk Umrah dari al-Tan’im, kemudian dia melihatnya melakukan tiga putaran mengelilingi Ka'bah." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه رأى عبد الله بن الزبير أحرم بعمرة من التنعيم، ثم رآه يسعى حول البيت الأشواط الثلاثة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1285) وسويد (542) والشيباني (456). {cite:muwatta-maruf-1997 p.490}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Abdullah ibn el-Zübeyr'in Tanim'den Umre için ihram haline girdiğini ve sonra Kâbe'nin etrafında üç kez Sa'i yaptığını gördüğünü nakletmiştir. Editör, bunun Malik'ten Ebu Musab (1285), Suveyd (542) ve Şeybani (456) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.490}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa ia melihat Abdullah ibn al-Zubayr memasuki keadaan ihram untuk Umrah dari al-Tan'im, dan kemudian ia melihatnya melakukan tiga putaran Sa'i mengelilingi Ka'bah. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab (1285), Suwaid (542), dan al-Shaybani (456). {cite:muwatta-maruf-1997 p.490}"
