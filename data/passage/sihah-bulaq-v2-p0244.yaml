  تهضم التضمة هضماه حين تجرى فى العروق ⁦(وذم)⁩ الوذم السيورالتى بين آذان الدلو
  وأطراف العراق الواحدة وذمة وقدوذمت الدلويودم وذمااذا انقطع وذمها والوذم أيضا
  لمات تكون فرحم الناقة أمثال الثتاليل تمنعها من الوادفاذا عولج منهاذلكْ قَيل وذمتها
  توذيا والوذام السكرش والامعاء الواحدة ودمة مثل غمرة وغاروفى حديث على عليه السلام:
  تن وليت بنى أمية لا غضهم نفض القصاب التراب الوذمة قال الاصحى" سالت شعية عن هذا
  لحرف فقال ليس هو هكذا انماهو نفض القصاب الوذام التربة والتربة التى قد سقطت فى
  التراب فتربت فالقصاب ينفضها وأوذم الحج أى أوجبه على نفسه قال الراجز
  لاهتم انّ عامر بن جهم • أوذم جافى نياب دسم
  أى متلطفة بالذنوب والوذيمة الهدية الى بيت اللّٰه الحرام وابهع الوذائم وهى الاموال التى
  نذوت فيها النذور قال الشاعر
  فان كنت لم أذ كرك والقوم بعضهم • غضابي على بعض قالى وذائم
  أى مالى كله فى سييل اللّٰه تعالى والتوذيم أن توذم الكلاب بقلادة ووذمت على الحسين نوذيما
  أى زدت عليها رم) الورم واحد الاورام يقال منه ورم جلدهيرم بال-كسرفيهماوهو
