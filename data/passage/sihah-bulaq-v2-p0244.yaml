  والوزيم مايمع من البقل ممعته من أبى سعيد يحكيه عن ابن أبى الازهر عن بندار وأنشد
  وجاؤا لاترين فلم يوبوا • بأبلة نشذ على وزيم
  ويروى على ينريم ويقال هو الطلع يشق لياقح تم يتبخوصسة والواحدة وزيمة ورجل متوزم
  أى شديد الوطه ⁦( وسم)⁩ وسمته وسهاوسمة اذا أترت فيه بسعة وكى والها عوض من
