text: "… فَقَالُوا أَمَّا نَحْنُ فَوُلِدْنَا فِي الشِّرْكِ، وَلَكِنَّا آمَنَّا بِاللَّهِ وَرَسُولِهِ، وَلَكِنْ هَؤُلاَءِ هُمْ أَبْنَاؤُنَا، فَبَلَغَ النَّبِيَّ فَقَالَ \" هُمُ الَّذِينَ لاَ يَتَطَيَّرُونَ، وَلاَ يَسْتَرْقُونَ، وَلاَ يَكْتَوُونَ، وَعَلَى رَبِّهِمْ يَتَوَكَّلُونَ \". فَقَامَ عُكَّاشَةُ بْنُ مِحْصَنٍ فَقَالَ أَمِنْهُمْ أَنَا يَا رَسُولَ اللَّهِ قَالَ \" نَعَمْ \". فَقَامَ آخَرُ فَقَالَ أَمِنْهُمْ أَنَا فَقَالَ \" سَبَقَكَ بِهَا عُكَّاشَةُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5752، يذكر الكي، والرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5752 (Medicine), that mentions cautery, ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5752، جس میں داغنا، رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
