label: { ar: "سنن النسائي 4148 — ما خلّفه من تركة وميراث", en: "Sunan al-Nasa'i 4148 — what was left behind: estate and inheritance", ur: "سنن نسائی 4148 — ترکہ اور میراث", es: "Sunan al-Nasa'i 4148 — Lo que quedó: patrimonio y herencia", fr: "Sunan al-Nasa'i 4148 — Ce qui a été laissé derrière: biens et héritage" }
text: "… وَبَيْنَ هَذَا. فَقَالَ النَّاسُ افْصِلْ بَيْنَهُمَا. فَقَالَ عُمَرُ لاَ أَفْصِلُ بَيْنَهُمَا قَدْ عَلِمَا أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". قَالَ فَقَالَ الزُّهْرِيُّ وَلِيَهَا رَسُولُ اللَّهِ فَأَخَذَ مِنْهَا قُوتَ أَهْلِهِ وَجَعَلَ سَائِرَهُ سَبِيلَهُ سَبِيلَ الْمَالِ ثُمَّ وَلِيَهَا أَبُو بَكْرٍ بَعْدَهُ ثُمَّ وُلِّيتُهَا بَعْدَ أَبِي بَكْرٍ فَصَنَعْتُ فِيهَا الَّذِي كَانَ يَصْنَعُ ثُمَّ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4148، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4148 (The Book of Distribution of Al-Fay'), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 4148، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4148 (El Libro de la Distribución de Al-Fay'), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un rapport du Sunan al-Nasa'i, n° 4148 (Le Livre de la Distribution d'Al-Fay'), mentionne ce qui a été laissé: biens et héritage. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
