text: "… : تستحب، وسبب الكراهة عند من كره خوف الملك وقلة الحرمة للأنس وخوف ملابسة الذنوب، فان الذنب فيها أقبح منه فى غيرها، كما أن الحسنة فيها أعظم منها فى غيرها، ودليل من استحبها أنه يتيسر فيها من الطاعات ما لا …"
summary:
  ar: "مقطع من المجموع للنووي، ص 266، يرد فيه ذكر الطاعات، والمستحب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
