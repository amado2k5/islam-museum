label: { ar: "البخاري 716 — مروا أبا بكر يصلي بالناس", en: "Bukhari 716 — Tell Abu Bakr to lead the prayer" }
text: "أن رسول الله قال في مرضه: «مروا أبا بكر يصلي بالناس». قالت عائشة: قلت: إن أبا بكر إذا قام في مقامك لم يسمع الناس من البكاء، فمر عمر فليصل. فقال: «مروا أبا بكر فليصل للناس»"
summary:
  ar: "في كتاب الأذان؛ رواية عائشة أن النبي أمر أبا بكر بالصلاة بالناس في مرض موته، وأنها وحفصة استمهلتاه لعمر خشية بكاء أبي بكر، فأبى وقال «إنكن لأنتن صواحب يوسف». يشهد تقديم أبي بكر للإمامة في آخر أيام النبي، وهو من نصوص مؤيدي تقدمه في الخلافة عند أهل السنة."
