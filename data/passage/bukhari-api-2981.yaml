label: { ar: "صحيح البخاري 2981 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 2981 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 2981 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 2981 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا عَبْدُ الْوَهَّابِ، قَالَ سَمِعْتُ يَحْيَى، قَالَ أَخْبَرَنِي بُشَيْرُ بْنُ يَسَارٍ، أَنَّ سُوَيْدَ بْنَ النُّعْمَانِ ـ أَخْبَرَهُ أَنَّهُ، خَرَجَ مَعَ النَّبِيِّ عَامَ خَيْبَرَ، حَتَّى إِذَا كَانُوا بِالصَّهْبَاءِ ـ وَهْىَ مِنْ خَيْبَرَ وَهْىَ أَدْنَى خَيْبَرَ ـ فَصَلَّوُا الْعَصْرَ، فَدَعَا النَّبِيُّ بِالأَطْعِمَةِ، فَلَمْ يُؤْتَ النَّبِيُّ إِلاَّ بِسَوِيقٍ، فَلُكْنَا فَأَكَلْنَا وَشَرِبْنَا، ثُمَّ قَامَ النَّبِيُّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2981، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2981 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 2981، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 2981 (La lucha por la causa de Alá (Yihad)), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre naciones, religiones, sectas y pueblos no musulmanes."
