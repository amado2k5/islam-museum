label: { ar: "الموطأ 1659 — بكير بن عبد الله بن الأشج عن معاوية بن أبي عياش: رجل من أهل البادية طلق امرأته ثلاثا قبل أن يدخل بها، فأفتى أبو هريرة وابن عباس بأن الواحدة تبينها والثلاث تحرمها", en: "Muwatta 1659", es: "Muwatta 1659", fr: "Muwatta 1659", ur: "موطا 1659", tr: "El-Muvatta 1659 — Bakir ibn Abdullah ibn el-Aşajj, Muaviye ibn Abi Ayyash'tan rivayetle: Çölde yaşayan bir adam, evliliği tamamlamadan önce karısını üç kez boşadı. Ebu Hurayra ve İbn Abbas, bir kez boşamanın kadını boşanmış saydığına, üç kez boşamanın ise onu adam için haram kıldığına dair bir fetva verdiler.", id: "Al-Muwatta 1659 — Bakir ibn Abdullah ibn al-Ashajj, berdasarkan riwayat Muawiyah ibn Abi Ayyash: Seorang pria dari padang pasir menceraikan istrinya tiga kali sebelum melakukan hubungan suami istri. Abu Hurayrah dan Ibn Abbas memberikan fatwa bahwa satu kali talak menjadikan istri tersebut diceraikan, sedangkan tiga kali talak menjadikan istri tersebut haram baginya." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بكير بن عبد الله بن الأشج عن معاوية بن أبي عياش الأنصاري أنه كان جالسا مع عبد الله بن الزبير وعاصم بن عمر بن الخطاب، فجاءهم محمد بن إياس بن البكير، فقال إن رجلا من أهل البادية طلق امرأته ثلاثا قبل أن يدخل بها، فماذا تريان؟ فقال ابن الزبير ما لنا فيه قول، فاذهب إلى عبد الله بن عباس وأبي هريرة. فسألهما، فقال ابن عباس لأبي هريرة أفته يا أبا هريرة، فقد جاءتك معضلة. فقال أبو هريرة الواحدة تبينها، والثلاث تحرمها حتى تنكح زوجا غيره، وقال ابن عباس مثل ذلك. قال مالك وعلى ذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.82}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Bukayr ibn Abdullah ibn al-Ashajj'dan, o da Mu'awiyah ibn Abi Ayyash al-Ansari'den rivayet eder ki, Abdullah ibn al-Zubayr ve Asim ibn Umar ibn al-Khattab ile otururken, Muhammed ibn İyas ibn al-Bukayr yanlarına gelip, \"Çölden bir adam, evliliği tamamlamadan önce karısını üç kez boşadı. Sizin görüşünüz nedir?\" dedi. İbn al-Zubayr, \"Bu konuda bir görüşümüz yok. Abdullah ibn Abbas ve Ebu Hurayra'ya gidin.\" dedi. Bunun üzerine onlara sordu ve İbn Abbas, Ebu Hurayra'ya, \"Ona bir hüküm ver, Ebu Hurayra, çünkü sana zor bir soru geldi.\" dedi. Ebu Hurayra, \"Bir kez boşaması onu ona helal kılar, üç kez boşaması ise başka bir adamla evleninceye kadar onu haram kılar.\" dedi. İbn Abbas da aynı şeyi söyledi. Malik, \"Bizim görüşümüz de budur.\" dedi. {cite:muwatta-maruf-1997 s.82}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Bukayr ibn Abdullah ibn al-Ashajj, dari Mu'awiyah ibn Abi Ayyash al-Ansari, bahwa ia sedang duduk bersama Abdullah ibn al-Zubayr dan Asim ibn Umar ibn al-Khattab ketika Muhammad ibn Iyas ibn al-Bukayr datang kepada mereka dan berkata, \"Seorang pria dari padang pasir menceraikan istrinya tiga kali sebelum melakukan hubungan suami istri. Bagaimana pendapat kalian?\" Ibn al-Zubayr berkata, \"Kami tidak memiliki pendapat tentang masalah ini. Pergilah kepada Abdullah ibn Abbas dan Abu Hurayrah.\" Maka ia bertanya kepada mereka, dan Ibn Abbas berkata kepada Abu Hurayrah, \"Berikanlah fatwa kepadanya, Abu Hurayrah, karena pertanyaan yang sulit telah datang kepadamu.\" Abu Hurayrah berkata, \"Satu kali talak membuatnya halal baginya, dan tiga kali talak membuatnya haram baginya sampai ia menikah dengan pria lain.\" Ibn Abbas mengatakan hal yang sama. Malik berkata, \"Dan itulah keputusan yang berlaku di pihak kami.\" {cite:muwatta-maruf-1997 p.82}"
