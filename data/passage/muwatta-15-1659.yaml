label: { ar: "الموطأ 1659 — بكير بن عبد الله بن الأشج عن معاوية بن أبي عياش: رجل من أهل البادية طلق امرأته ثلاثا قبل أن يدخل بها، فأفتى أبو هريرة وابن عباس بأن الواحدة تبينها والثلاث تحرمها", en: "Muwatta 1659" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بكير بن عبد الله بن الأشج عن معاوية بن أبي عياش الأنصاري أنه كان جالسا مع عبد الله بن الزبير وعاصم بن عمر بن الخطاب، فجاءهم محمد بن إياس بن البكير، فقال إن رجلا من أهل البادية طلق امرأته ثلاثا قبل أن يدخل بها، فماذا تريان؟ فقال ابن الزبير ما لنا فيه قول، فاذهب إلى عبد الله بن عباس وأبي هريرة. فسألهما، فقال ابن عباس لأبي هريرة أفته يا أبا هريرة، فقد جاءتك معضلة. فقال أبو هريرة الواحدة تبينها، والثلاث تحرمها حتى تنكح زوجا غيره، وقال ابن عباس مثل ذلك. قال مالك وعلى ذلك الأمر عندنا. {cite:muwatta-maruf-1997 p.82}"
