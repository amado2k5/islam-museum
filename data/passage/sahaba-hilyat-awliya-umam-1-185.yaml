text: "… أنا سابق العرب، وصهيب سابق الروم، وسلمان سابق الفرس، وبلال سابق الحبشة حدثنا أبو سعيد أحمد بن ابتاء بن شيبان العبادانى - بالبصرة - شا الحسن بن إدريس السجستانى ثنا قتيبة بن سعيد ثنا الوسيم بن جميل حدثنى محمد بن …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 185، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 185, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
