label: { ar: "الموطأ 38 — مالك فيمن نسي ترتيب أعضاء الوضوء", en: "Muwatta 38" }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب العمل في الوضوء: سُئل عمن غسل وجهه قبل أن يتمضمض، أو غسل ذراعيه قبل وجهه ناسياً، فأجاب بأن الأول يتمضمض ولا يعيد غسل وجهه، وأن الثاني يغسل وجهه ثم يعيد غسل ذراعيه ليكون بعد الوجه، إذا كان ما يزال في مكانه أو قريباً منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.53}"
