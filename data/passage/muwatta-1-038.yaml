label: { ar: "الموطأ 38 — مالك فيمن نسي ترتيب أعضاء الوضوء", en: "Muwatta 38", es: "Muwatta 38", fr: "Muwatta 38", ur: "موطا 38", tr: "Al-Muwatta 38 — Malik, abdest uzuvlarının sırasını unutan kişi hakkında", id: "Al-Muwatta 38 — Malik tentang orang yang lupa urutan sujud" }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب العمل في الوضوء: سُئل عمن غسل وجهه قبل أن يتمضمض، أو غسل ذراعيه قبل وجهه ناسياً، فأجاب بأن الأول يتمضمض ولا يعيد غسل وجهه، وأن الثاني يغسل وجهه ثم يعيد غسل ذراعيه ليكون بعد الوجه، إذا كان ما يزال في مكانه أو قريباً منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.53}"
  tr: "Yahya'nın abdest alma usulleri bölümünde rivayet ettiği Malik'in bir fetvası şöyledir: Ağzını çalkalamadan önce yüzünü yıkayan veya unutkanlıktan dolayı yüzünü yıkamadan önce kollarını yıkayan biri hakkında kendisine soru soruldu. Malik, ilk kişinin ağzını çalkaladıktan sonra yüzünü yıkamaması gerektiğini, ikinci kişinin ise yüzünü yıkadıktan sonra kollarını yıkaması gerektiğini, eğer aynı yerde veya yakınında ise, bu işlemin yüzünü yıkadıktan sonra gelmesi gerektiğini söyledi. Editör, bu fetvanın Ebu Mus'ab ve Suveyd tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.53}"
  id: "Fatwa Malik, diriwayatkan oleh Yahya dalam bab tentang tata cara wudhu: Beliau ditanya tentang seseorang yang mencuci muka sebelum berkumur, atau yang mencuci tangan sebelum mencuci muka karena lupa. Beliau menjawab bahwa orang pertama hendaknya berkumur dan tidak mengulangi mencuci muka, dan orang kedua hendaknya mencuci muka terlebih dahulu, kemudian mengulangi mencuci tangan sehingga dilakukan setelah mencuci muka, jika ia masih berada di tempat yang sama atau dekat dengan tempat tersebut. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.53}"
