text: "… ورواه عن أبي حنيفة. ويلزمهم أيضا من طرده تقديم الخالة والأخت للأم على الجدة أم الأب، وهذا في غاية البعد التي حذر منها أبو حنيفة أصحابه، وقال: لا تأخذوا بمقاييس زفر، فإنكم إن أخذتم بمقاييس زفر حرَّمْتُمُ الحَلَالَ، وحلَّلتُمُ الحَرَامَ. …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 910، يذكر الحلال، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 910, that mentions the lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
