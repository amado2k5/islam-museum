label: { ar: "دلائل النبوة للبيهيقي — تسبيح الحصيات", en: "Bayhaqi's Dala'il — the glorification of the pebbles", ur: "بیہقی کی دلائل — کنکریوں کی تسبیح" }
text: "فأخذ حصيات فوضعهن في كفه فسبحن حتى سمع لهن حنيناً كحنين النحل، ثم وضعهن في يد أبي بكر فسبحن، ثم في يد عمر، ثم في يد عثمان، فقال: هذه خلافة النبوة"
summary:
  ar: "في باب تسبيح الحصيات يروي البيهيقي عن أبي ذر أن النبي كان جالساً وحده فجلس أبو بكر عن يمينه ثم عمر ثم عثمان، وبين يديه سبع أو تسع حصيات، فأخذهن فوضعهن في كفه فسبحن حتى سُمع لهن حنين كحنين النحل، ثم وضعهن في يد أبي بكر فسبحن، ثم في يد عمر، ثم في يد عثمان فسبحن، فقال: هذه خلافة النبوة. وتشير الحاشية إلى أن الخبر روي عن أبي ذر بالرِّبذة وأن في إسناده نظر، لكنه من أبرز ما اشتهر في كتب الدلائل."
  en: "Abu Dharr reports that the Prophet sat alone; Abu Bakr sat at his right, then Umar, then Uthman, while seven or nine pebbles lay before him. He took them in his palm and they glorified God until their humming was heard like bees; he then placed them in Abu Bakr's hand and they glorified again, then in Umar's, then in Uthman's, and said: this is the succession of prophethood. The margin notes the report reaches Abu Dharr through al-Rabdha and has isnad criticism, yet it remains among the most famous proofs cited in the dalail literature."
  ur: "ابو ذر کی روایت ہے کہ نبی اکیلے بیٹھے تھے، ابو بکر ان کے دائیں بیٹھے پھر عمر پھر عثمان، اور ان کے سامنے سات یا نو کنکریاں تھیں۔ اس نے انہیں اپنی مٹھی میں رکھا تو تسبیح کرنے لگیں یہاں تک کہ شہد کی بھنبھناہٹ جیسی آواز آئی، پھر خاموش ہو گئیں۔ پھر انہیں ابو بکر، عمر اور عثمان کی ہاتھ میں رکھا تو وہ بھی تسبیح کیں، اور نبی نے کہا: یہی نبوت کی خلافت ہے۔ حاشیہ نوٹ کرتا ہے کہ یہ خبر ابو ذر سے رِبذہ میں منسوب ہے اور اسناد میں بعض محدثین نے نظر لگایا ہے، مگر کتابوں میں یہ مشہور ترین دلائل میں سے ہے۔"
