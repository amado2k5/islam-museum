text: "… اللّه ينهى عن النعي فإنه محمول على النّعي الذي كانت الجاملية تفعله. وكانت عادتهم إذا مات منهم شريف بعثوا راكباً إلى القبائل، يقول : نعاءٍ فلاناً أي هلكت العرب بمهلك فلان، ويصحب ذلك ضجيج وبكاء. البكاء على الميت أجمع العلماء، …"
