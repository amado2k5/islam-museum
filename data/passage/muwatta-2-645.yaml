label: { ar: "الموطأ 645 — الرجل الذي أوصى أن يُحرق ويُذرى نصفه في البر ونصفه في البحر: من خشيتك يا رب، فغفر له", en: "Muwatta 645" }
text: "لم فعلت هذا؟ قال: من خشيتك يا رب، وأنت أعلم. قال: فغفر له"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي حدث عن رجل لم يعمل حسنة قط قال لأهله: إذا مات فحرقوه ثم اذروا نصفه في البر ونصفه في البحر، فوالله لئن قدر الله عليه ليعذبنه عذاباً لا يعذبه أحداً من العالمين. فلما مات فعلوا ما أمرهم، فأمر الله البر فجمع ما فيه وأمر البحر فجمع ما فيه، ثم سأله: لم فعلت هذا؟ قال: من خشيتك يا رب وأنت أعلم. فغفر له. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وإسماعيل بن أبي أويس عند البخاري (7506)، وروح بن عبادة عند مسلم (8/97)، وسويد، والقعنبي، وابن وهب، وابن القاسم، وينقل عن ابن عبد البر (التمهيد 18/37–38) أن أكثر رواة الموطأ تابعوا يحيى على رفعه، ووقفه مصعب الزبيري والقعنبي في رواية فجعلاه من قول أبي هريرة. {cite:muwatta-maruf-1997 p.329}"
