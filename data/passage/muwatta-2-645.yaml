label: { ar: "الموطأ 645 — الرجل الذي أوصى أن يُحرق ويُذرى نصفه في البر ونصفه في البحر: من خشيتك يا رب، فغفر له", en: "Muwatta 645", es: "Muwatta 645", fr: "Muwatta 645", ur: "موطا 645", tr: "Muvatta 645 — Adam, bedeninin yarısının karaya, yarısının denize saçılmasını ve yakılmasını vasiyet etmişti: “Ey Rabbim, senden korktuğum için.” Ve Allah onu bağışladı.", id: "Al-Muwatta 645 — Orang yang mewasiatkan agar dirinya dibakar dan separuh tubuhnya disebar di darat dan separuh lagi di laut: “Karena takut kepada-Mu, ya Tuhan,” lalu Dia mengampuninya." }
text: "لم فعلت هذا؟ قال: من خشيتك يا رب، وأنت أعلم. قال: فغفر له"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي حدث عن رجل لم يعمل حسنة قط قال لأهله: إذا مات فحرقوه ثم اذروا نصفه في البر ونصفه في البحر، فوالله لئن قدر الله عليه ليعذبنه عذاباً لا يعذبه أحداً من العالمين. فلما مات فعلوا ما أمرهم، فأمر الله البر فجمع ما فيه وأمر البحر فجمع ما فيه، ثم سأله: لم فعلت هذا؟ قال: من خشيتك يا رب وأنت أعلم. فغفر له. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وإسماعيل بن أبي أويس عند البخاري (7506)، وروح بن عبادة عند مسلم (8/97)، وسويد، والقعنبي، وابن وهب، وابن القاسم، وينقل عن ابن عبد البر ⁦(التمهيد 18/37–38)⁩ أن أكثر رواة الموطأ تابعوا يحيى على رفعه، ووقفه مصعب الزبيري والقعنبي في رواية فجعلاه من قول أبي هريرة. {cite:muwatta-maruf-1997 p.329}"
  id: "Malik meriwayatkannya dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) menceritakan tentang seorang laki-laki yang belum pernah melakukan amal kebaikan. Ia berkata kepada keluarganya, \"Ketika aku mati, bakarlah jenazahku, lalu sebarkan separuh abuku di darat dan separuh lagi di laut. Demi Allah, jika Allah berkuasa atas diriku, Dia akan menghukumku dengan hukuman yang tiada bandingnya di dunia.\" Ketika ia mati, mereka melakukan seperti yang diperintahkannya. Kemudian Allah memerintahkan darat untuk mengumpulkan apa yang ada di atasnya dan laut untuk mengumpulkan apa yang ada di dalamnya. Kemudian Allah bertanya kepadanya, \"Mengapa kamu melakukan ini?\" Ia menjawab, \"Karena takut kepada-Mu, ya Tuhan, dan Engkau Maha Mengetahui.\" Maka Allah mengampuninya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Isma'il ibn Abi Uways dalam al-Bukhari (7506), Rawh ibn 'Ubadah dalam Muslim (8/97), Suwayd, al-Qa'nabi, Ibn Wahb, dan Ibn al-Qasim. Ia mengutip Ibn 'Abd al-Barr (al-Tamhid 18/37-38) yang mengatakan bahwa sebagian besar perawi al-Muwatta' mengikuti Yahya dalam menisbatkannya kepada Nabi (shalawat dan salam kepadanya), sedangkan Mus'ab al-Zubayri dan al-Qa'nabi, dalam satu riwayat, menisbatkannya kepada Abu Hurayrah. {cite:muwatta-maruf-1997 p.329}"
