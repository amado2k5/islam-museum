text: "… دعَامة الدين، فاتفق له علماء اليهود والنصارى على أن الدين ولا يُلبِثُ البَيْتَ انقِضَاضُ الدَّعَائِم دين إبراهيم، ولم يكن يهودياً ولا نصرانياً. فقال : - - زيد بن عمرو بن نفيل: ورفع يديه اللهمّ إني أشهدك أني على دين إبراهيم. …"
