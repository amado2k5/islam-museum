summary:
  ar: "قال مالك: ولا يصلح التسليف في شيء من هذا يسلف فيه بعينه، إلا أن يقبض المسلف ما سلف فيه عند دفعه الذهب إلى صاحبه، يقبض العبد أو الراحلة أو المسكن، أو يبدأ فيما اشترى من الرطب فيأخذ منه عند دفعه الذهب إلى صاحبه. لا يصلح أن يكون في شيء من ذلك تأخير ولا أجل. {cite:muwatta-maruf-1997 p.155}"
