label: { ar: "الموطأ 1838 — مالك: لا يصلح التسليف في شيء من هذا يسلف فيه بعينه، إلا أن يقبض المسلف ما سلف فيه عند دفعه الذهب، ولا يصلح في ذلك تأخير ولا أجل", en: "Muwatta 1838", es: "Muwatta 1838", fr: "Muwatta 1838", ur: "موطا 1838", tr: "El-Muvatta 1838 — Malik: Bu şeylerden herhangi birinde, borç verenin altını ödeyerek borç verilen şeyi geri alması şartıyla, belirli bir şekilde borç vermek caiz değildir. Bu konuda hiçbir gecikme veya erteleme söz konusu değildir.", id: "Al-Muwatta 1838 — Malik: Tidak diperbolehkan meminjamkan dalam bentuk barang-barang tersebut dengan cara tertentu, kecuali jika pemberi pinjaman menerima kembali apa yang dipinjamkan setelah membayar emas. Tidak diperbolehkan adanya penundaan atau pengunduran dalam hal ini." }
summary:
  ar: "قال مالك: ولا يصلح التسليف في شيء من هذا يسلف فيه بعينه، إلا أن يقبض المسلف ما سلف فيه عند دفعه الذهب إلى صاحبه، يقبض العبد أو الراحلة أو المسكن، أو يبدأ فيما اشترى من الرطب فيأخذ منه عند دفعه الذهب إلى صاحبه. لا يصلح أن يكون في شيء من ذلك تأخير ولا أجل. {cite:muwatta-maruf-1997 p.155}"
  tr: "Malik şöyle dedi: Bu durumlardan herhangi birinde, ödünç verilen şeyin aynısını ödünç vermek caiz değildir; ancak ödünç veren, altını sahibine iade ederken ödünç aldığı şeyi geri alırsa, köleyi, bineği veya konutu geri alır veya satın aldığı hurmalardan bir kısmını alır ve altını sahibine iade ederken bunlardan da bir kısmını alır. Bunların hiçbirinde gecikme veya süre sınırı olmamalıdır. {cite:muwatta-maruf-1997 s.155}"
  id: "Malik berkata: Tidak diperbolehkan meminjamkan barang persis seperti yang dipinjamkan dalam kasus-kasus ini, kecuali jika pemberi pinjaman mengambil alih barang yang dipinjamkan kepadanya ketika ia mengembalikan emas kepada pemiliknya. Ia mengambil alih budak, kuda, atau tempat tinggal, atau ia mulai dengan apa yang dibelinya dari kurma dan mengambil sebagian darinya ketika ia mengembalikan emas kepada pemiliknya. Tidak boleh ada penundaan atau jangka waktu dalam hal ini. {cite:muwatta-maruf-1997 p.155}"
