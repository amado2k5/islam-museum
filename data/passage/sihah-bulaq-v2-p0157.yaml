text: |-
  ٤٣٠
  n.⁦(فصل الفاء)⁩ n•
  وفره بالمكسر أشر وبطروة وله تعالى وتتحتون من الجبال بيوتافرهين فن قرأه كذلك فهو من
  هذا ومن قرأه فارهين فه ومن فره بالضم ⁦( فقه )⁩. الفقه الفهم قال أعرابى لعيسى بن عمر
  شهدت عليك بالفقه تقول منه فقه الرجل بالكسر وفلان لا يفقه ولا ينفه وأفقهتك الشئ
  ثم خصر به علم الشريعة والعالم بدفقيه وقدفقه بالضم فقاهة وفقهم اللّٰه وتفقه اذا تعاطى
  ذلك وفاقهته اذا باحثته فى العلم كه الفاكهة معروفة وأجناسها الفواكه
  والفاكهانى الذى يبيعها والفكاهة بالضم المزاح والفكاهة بالفتح مصدرفكه الرجل بالسكسر
  فه وفكه اذا كان طيب النقس مزاحا والفكه أيضا الاشبر البطر وقرئ ونعمة كانوا فيها فكهين
  أى أشرين وفاكهين أى ناعمين والمفاكهة الممازحة يقال لاتفاكه أمة ولا تبل على أكة
  وتفكم تعجب ويقال تندّم قال تعالى فظلتم تفكهون أى تئدمون وتفكهت بالشئ تمتعت به
  أبوزيد أفكهت الناقة اذادرت عندأكل الربيع قبل أن تضع فهى مفكه والفاكه ابن المغيرة
  الخزومى عمّ خالد بن الوليد ⁦(فوه)⁩ الافواه ما يعالج به الطيب كما أن التوابل ما تعالج به
  الاطعمة يقال فوه وأفواه مثل سوق وأسواق ثم أفاويه والفوه أصل قولنا فم لان الجمع أفواه
  الاأنم-م اس -تثقلوا اجتماع الهاءين فى قولك هذا فوهه بالاضافة فخذفو امنها الهاء فقالوا
  هذا فوه وفوزيدورأيت فازيد ومررت بهى زيد واذا أضفته الى نفسات قلت هذا فىّ يستوى
  فيه حال الرفع والنصب والخفض لانَ الواوتقلب ياء فتدغم وهذا اتمايقال فى الاضافة
  وربما قالوا ذلك فى غير الاضافة وهو قليل قال الهاج
  خالط من سلمى خياشيم وفا * صهبا مخرط وماعقارافرقفا
  يصف عذوبة ريقها بقول كأنهاعارخالط خياشيمها وفاها فكف عدن المضاف
  اليه وقولهم كلمته فاء الى فىّ أى مشافها ونصب فوه على الحال واذا أفرد والم تحتمل الواو
  التغوين فحذفوها وعوّضوا من الهاءميما فقالواهذافم وفان وذوان ولوكانت الميم عوضا
  من الواولما اجتقمعتا أبوزيدفاهالقيك ومعناه انخيبة للّ قال أبو عبيد وأله أنه يريد جعل
  اللّٰه افيك الارض كما يقال بفيك الحجرويفيك الاثلب وأنشدلر-ل من بلهجيم
  فقلت له فاه الفيك فانها * قلوص امرىً قاريك ما أنت حاذره
  يعنى يريك من القرى والفوه بالتحريكسعة الفم ورجل أفوه وامر أقفوهاء بينا الفوه
  وقد فوه يفوه ويقال الفوه خروج لثنايا العلى وطولها وأفواه الازقة والانهارواحدتها
  فوّهة بتشديد الواوويقال اقعد على قوّهة الطريق والبهع أفواه على غير قياس ويقال أيضاان
  ردّالفوّهة لشديد أى القالة وهو من فهت بالكلام والافوه الاودى "شاهر ومحالة فوهاءاذا
  كانت أسنانها التى يجرى الرشاء بينهاطوالا وفوهه اللّٰه جعلد أفوه وقاه بالسكلام يه وه لففايه
  يقال ماذهت بكامة وما تفوّهت ب؟عنى أى ما فتحت فى بما والمنوه المتطيق واستفاه الرجل فهو
  مستفيه اذا اشتذأ كاه بعد ضعف وقلة والفيه الاكول وأصلد فيوه فأدغم وهو المنطيق أيضا
  والمرأة فيهة ( هم الفهه وا لفهاهة العى" ورجل فه واحر أفهة وقال
  فلم تلفنى فها ولم تلف حجتى • ملجلية أبقى لهامن يقيها
  وقد فههت بارجل بالمكسر فهها أى عييت يقال سفيه فهيه وفهم اللّه وفههه وبقال خرحت
