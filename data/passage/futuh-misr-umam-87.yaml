text: "- - ووفى هرقل لشهر براز بما أعطاه من ترك أرض فارس، وانسكشف حين أفد أرض فارس على كسرى، فقدات فارس كسرى، وحق شهرابرز بفارس والجنود. ذكر شاء الاسكندرية مال: فوجَّه هرقل ملك الروم كاحدثنى شيخ من أهل معر المُقّوْقِس …"
