text: "قال: دعه لعلّه يطلبه من غيري، فلا يسوَّغه، فيقتله. مروان بن سعد، عن المدائني، عن جُوَيْرية، ثم قال: رجع الحديث إلى الأول. قالوا: ولما احتضر معاوية أرسل إلى يزيد فأوصاه وقال: انظر حسين ابن فاطمة، فإنه أحبّ الناس إلى الناس، …"
summary:
