label: { ar: "موطأ مالك 817 — الأب والأبوة", en: "Muwatta Malik 817 — the father and fatherhood", ur: "موطأ مالک 817 — باپ اور والدیت", es: "Muwatta Malik 817 — el padre y la paternidad", fr: "Muwatta Malik 817 — le père et la paternité" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ كَانَ لاَ يَجْمَعُ بَيْنَ السُّبْعَيْنِ لاَ يُصَلِّي بَيْنَهُمَا وَلَكِنَّهُ كَانَ يُصَلِّي بَعْدَ كُلِّ سُبْعٍ رَكْعَتَيْنِ فَرُبَّمَا صَلَّى عِنْدَ الْمَقَامِ أَوْ عِنْدَ غَيْرِهِ. وَسُئِلَ مَالِكٌ عَنِ الطَّوَافِ إِنْ كَانَ أَخَفَّ عَلَى الرَّجُلِ أَنْ يَتَطَوَّعَ بِهِ فَيَقْرُنَ بَيْنَ الأُسْبُوعَيْنِ أَوْ أَكْثَرَ ثُمَّ يَرْكَعُ مَا عَلَيْهِ مِنْ …"
summary:
  ar: "حديث في موطأ مالك، رقم 817، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 817 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 817، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 817 (Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 817 (Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
