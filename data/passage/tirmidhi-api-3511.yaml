label: { ar: "جامع الترمذي 3511 — تعزية ومواساة وصبر عند المصيبة", en: "Jami' al-Tirmidhi 3511 — condolence, consolation and patience at a loss", ur: "جامع الترمذی۔ 3511 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Jami' al-Tirmidhi 3511 — des condoléances, une consolation et la patience devant la perte", es: "Jami' al-Tirmidhi 3511 — condolencias, consuelo y paciencia ante la pérdida", tr: "Cami' el-Tirmizi 3511 — Felaket zamanlarında taziye, şefkat ve sabır", id: "Jami' al-Tirmidhi 3511 — Ungkapan belasungkawa, simpati, dan kesabaran di masa musibah" }
text: "… أَبِي سَلَمَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِذَا أَصَابَ أَحَدَكُمْ مُصِيبَةٌ فَلْيَقُلْ : ⁦( إنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ )⁩ اللَّهُمَّ عِنْدَكَ احْتَسَبْتُ مُصِيبَتِي فَأْجُرْنِي فِيهَا وَأَبْدِلْنِي مِنْهَا خَيْرًا \". فَلَمَّا احْتُضِرَ أَبُو سَلَمَةَ قَالَ اللَّهُمَّ اخْلُفْ فِي أَهْلِي خَيْرًا مِنِّي فَلَمَّا قُبِضَ قَالَتْ أُمُّ سَلَمَةَ : ⁦( إنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ )⁩ عِنْدَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3511، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3511 (Chapters on Supplication), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "جامع الترمذی۔ کی حدیث نمبر 3511، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Jami' al-Tirmidhi, n° 3511, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Jami' al-Tirmidhi, n.º 3511, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Cami' el-Tirmizi'de yer alan 3511 numaralı hadis, musibet karşısında taziye, teselli ve sabır sunmaktadır. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü mersiye ve ağıtlardan bazılarını bir araya getirmektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3511, menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah. Koleksi ini menyusun beberapa elegi dan ratapan paling terkenal, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
