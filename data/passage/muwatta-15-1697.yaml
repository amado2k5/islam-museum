label: { ar: "الموطأ 1697 — فاطمة بنت قيس: طلقها أبو عمرو بن حفص البتة وهو غائب بالشام، فلم تأخذ نفقة، فأمرها النبي أن تعتد في بيت أم شريك، ثم في بيت ابن أم مكتوم، ثم زوجها أسامة بن زيد", en: "Muwatta 1697" }
summary:
  ar: "يروي مالك عن عبد الله بن يزيد مولى الأسود بن سفيان عن أبي سلمة بن عبد الرحمن بن عوف عن فاطمة بنت قيس أن أبا عمرو بن حفص طلقها البتة، وهو غائب بالشام، فأرسل إليها وكيله بشعير، فسخطته، فقال والله ما لك علينا من شيء، فجاءت رسول الله فذكرت ذلك له، فقال ليس لك عليه نفقة، وأمرها أن تعتد في بيت أم شريك، ثم قال تلك امرأة يغشاها أصحابي، اعتدي عند عبد الله بن أم مكتوم، فإنه رجل أعمى، تضعين ثيابك عنده، فإذا حللت فآذنيني. فلما حلت ذكرت له أن معاوية بن أبي سفيان وأبا جهم خطباها، فقال أما أبو جهم فلا يضع عصاه عن عاتقه، وأما معاوية فصعلوك لا مال له، انكحي أسامة بن زيد. فكرهته، ثم قال انكحي أسامة بن زيد، فنكحته، فجعل الله في ذلك خيرا واغتبطت به. {cite:muwatta-maruf-1997 p.93}"
