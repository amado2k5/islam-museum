label: { ar: "الموطأ 1697 — فاطمة بنت قيس: طلقها أبو عمرو بن حفص البتة وهو غائب بالشام، فلم تأخذ نفقة، فأمرها النبي أن تعتد في بيت أم شريك، ثم في بيت ابن أم مكتوم، ثم زوجها أسامة بن زيد", en: "Muwatta 1697", es: "Muwatta 1697", fr: "Muwatta 1697", ur: "موطا 1697", tr: "El-Muvatta 1697 — Fatıma bint Kays: Ebu Amr ibn Hafs, Suriye'de bulunduğu sırada onu geri dönülmez bir şekilde boşadı, bu yüzden Fatıma nafaka alamadı. Peygamberimiz, ona önce Ümmü Şarik'in, sonra İbn Ümmü Maktum'un evinde bekleme süresini geçirmesini emretti, ardından onu Usame ibn Zeyd ile evlendirdi.", id: "Al-Muwatta 1697 — Fatima bint Qais: Abu Amr ibn Hafs menceraikannya secara mutlak ketika ia berada di Suriah, sehingga ia tidak menerima nafkah. Nabi memerintahkannya untuk menjalani masa iddah di rumah Umm Sharik, kemudian di rumah Ibn Umm Maktum, lalu beliau menikahkannya dengan Usama ibn Zayd." }
summary:
  ar: "يروي مالك عن عبد الله بن يزيد مولى الأسود بن سفيان عن أبي سلمة بن عبد الرحمن بن عوف عن فاطمة بنت قيس أن أبا عمرو بن حفص طلقها البتة، وهو غائب بالشام، فأرسل إليها وكيله بشعير، فسخطته، فقال والله ما لك علينا من شيء، فجاءت رسول الله فذكرت ذلك له، فقال ليس لك عليه نفقة، وأمرها أن تعتد في بيت أم شريك، ثم قال تلك امرأة يغشاها أصحابي، اعتدي عند عبد الله بن أم مكتوم، فإنه رجل أعمى، تضعين ثيابك عنده، فإذا حللت فآذنيني. فلما حلت ذكرت له أن معاوية بن أبي سفيان وأبا جهم خطباها، فقال أما أبو جهم فلا يضع عصاه عن عاتقه، وأما معاوية فصعلوك لا مال له، انكحي أسامة بن زيد. فكرهته، ثم قال انكحي أسامة بن زيد، فنكحته، فجعل الله في ذلك خيرا واغتبطت به. {cite:muwatta-maruf-1997 p.93}"
  tr: "Malik, el-Esved ibn Sufyan'ın azatlı kölesi Abdullah ibn Yazid'den, o da Ebu Selama ibn Abdülrahman ibn Avf'tan, o da Fatıma bint Kays'tan rivayet ettiğine göre, Ebu Amr ibn Hafs, Suriye'de bulunduğu sırada Fatıma'yı geri dönülmez bir şekilde boşadı. Ona bir aracı vasıtasıyla biraz arpa gönderdi, ancak Fatıma bundan hoşlanmadı. Ebu Amr, \"Allah'a yemin ederim ki, bizden hiçbir hakkın yok\" dedi. Bunun üzerine Fatıma, Allah'ın Resulü'ne gidip durumu anlattı. Resulullah, \"Ondan nafaka konusunda hiçbir hakkın yok\" dedi ve Fatıma'ya Ümmü Şarik'in evinde bekleme süresini geçirmesini emretti. Sonra, \"O, arkadaşlarımın sık sık görüştüğü bir kadındır. Bekleme süresini Abdullah ibn Ümmü Maktum'un yanında geçir, çünkü o kördür. Onun yanında elbiselerini çıkarabilirsin. Bekleme süren bittiğinde bana haber ver\" dedi. Bekleme süresi bittiğinde, Fatıma, Muaviye ibn Ebu Sufyan ve Ebu Cahm'ın kendisine evlenme teklifinde bulunduğunu söyledi. \"Ebu Cehm sürekli hareket halindedir, Muaviye ise serveti olmayan bir fakirdir. Usame ibn Zeyd ile evlen.\" dedi. Kadın ondan hoşlanmadı. Bunun üzerine \"Usame ibn Zeyd ile evlen\" dedi, böylece kadın onunla evlendi ve Allah bunu bir bereket kıldı, kadın da ondan çok memnun oldu. {cite:muwatta-maruf-1997 s.93}"
  id: "Malik meriwayatkan dari Abdullah ibn Yazid, budak yang dibebaskan oleh al-Aswad ibn Sufyan, dari Abu Salama ibn Abd al-Rahman ibn Awf, dari Fatima bint Qays, bahwa Abu Amr ibn Hafs menceraikannya secara mutlak ketika ia berada di Suriah. Ia mengirimkan jelai kepadanya melalui perantaranya, tetapi ia tidak senang. Ia berkata, \"Demi Allah, kamu tidak berhak atas kami.\" Maka ia pergi kepada Rasulullah dan menceritakan hal itu kepadanya. Beliau bersabda, \"Kamu tidak berhak atas nafkahnya,\" dan beliau memerintahkannya untuk menjalani masa iddahnya di rumah Umm Sharik. Kemudian beliau bersabda, \"Itu adalah seorang wanita yang sering dikunjungi oleh para sahabatku. Jalani masa iddahmu bersama Abdullah ibn Umm Maktum, karena ia buta. Kamu boleh melepas pakaianmu di hadapannya. Setelah masa iddahmu selesai, beritahukan kepadaku.\" Setelah masa penantiannya berakhir, ia memberitahunya bahwa Muawiya ibn Abi Sufyan dan Abu Jahm telah melamarnya. Ia berkata, \"Adapun Abu Jahm, ia selalu berpindah-pindah tempat, dan adapun Muawiya, ia seorang miskin tanpa harta. Nikahi Usama ibn Zayd.\" Ia tidak menyukainya. Kemudian ia berkata, \"Nikahi Usama ibn Zayd,\" maka ia menikahinya, dan Allah menjadikan pernikahan itu sebagai berkah, dan ia bahagia bersamanya. {cite:muwatta-maruf-1997 p.93}"
