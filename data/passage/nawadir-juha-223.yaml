text: "… مال الفقير يجب أن يكون نصب عينيه كان يمضغُ مصطكى في مجلس فدعوه إلى الطعام، وعندما دخل الشيخ غرفة المائدة، أخرج قطعة المصطكى من فمه، وألصقها بأنفِهِ، فقالوا له : ماذا تصنع؟ فقال : مال الفقير يجب أن يبقى نصب …"
summary:
  ar: "سُئل جحا في وليمة لماذا يمسك قطعة مستكة على أنفه، فقال إن مال الفقير يجب أن يكون نصب عينيه. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  en: "At a meal Juha is asked why he holds a piece of mastic on his nose, and he says that a poor man's property should always be before his eyes. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  ur: "ایک دعوت میں جحا سے پوچھا جاتا ہے کہ وہ ناک پر مستکی کا ٹکڑا کیوں رکھے ہوئے ہے، تو وہ کہتا ہے کہ غریب کا مال ہمیشہ اس کی نظروں کے سامنے ہونا چاہیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  fr: "Lors d'un repas, on demande à Juha pourquoi il tient un morceau de mastic sur son nez, et il répond que le bien d'un pauvre doit toujours rester devant ses yeux. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  es: "En una comida le preguntan a Juha por qué sostiene un trozo de almáciga sobre la nariz, y dice que el bien de un pobre debe estar siempre ante sus ojos. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
  tr: "Bir ziyafette Juha'ya burnuna neden sakız tuttuğu sorulduğunda, fakir adamın parasını akılda tutmak gerektiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 102}"
  id: "Juha ditanya di sebuah pesta mengapa ia menempelkan sepotong damar ke hidungnya, dan ia menjawab bahwa uang orang miskin harus diingat. {cite:juha-nawadir-kubra-djuwaydi p. 102}"
