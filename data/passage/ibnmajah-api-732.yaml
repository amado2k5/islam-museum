label: { ar: "سنن ابن ماجه 732 — الأب والأبوة", en: "Sunan Ibn Majah 732 — the father and fatherhood", ur: "سنن ابن ماجہ 732 — باپ اور والدیت", es: "Sunan Ibn Majah 732 — El padre y la paternidad" }
text: "حَدَّثَنَا أَبُو بَدْرٍ، عَبَّادُ بْنُ الْوَلِيدِ حَدَّثَنِي مَعْمَرُ بْنُ مُحَمَّدِ بْنِ عُبَيْدِ اللَّهِ بْنِ أَبِي رَافِعٍ، مَوْلَى النَّبِيِّ ـ حَدَّثَنِي أَبِي مُحَمَّدُ بْنُ عُبَيْدِ اللَّهِ عَنْ أَبِيهِ عُبَيْدِ اللَّهِ عَنْ أَبِي رَافِعٍ قَالَ رَأَيْتُ بِلاَلاً يُؤَذِّنُ بَيْنَ يَدَىْ رَسُولِ اللَّهِ ـ مَثْنَى مَثْنَى وَيُقِيمُ وَاحِدَةً."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 732، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 732 (The Book of the Adhan and the Sunnah Regarding It), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 732، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 732 (El Libro del Adhan y la Sunnah al respecto), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
