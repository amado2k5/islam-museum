  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan, resimli 2. cilt, 305. sayfadaki eserinden bir alıntı; namaz, zekât, oruç ve Hac'ı birlikte ve iman şahadetini, namazı ve zekâtı birlikte zikrediyor; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 2 bergambar, halaman 305, menyebutkan salat, zakat, puasa, dan haji secara bersamaan, serta kesaksian iman, salat, dan zakat; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
