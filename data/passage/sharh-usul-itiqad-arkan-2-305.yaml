text: "… يونس، عن الحسن، قال: ب جاء أعرابيٌّ إلى عمر صليه، فقال : يا أميرَ المؤمنين، علِّمني الدِّين. فقال: تشهدُ أنَّ لا إله إلَّا الله، وأنَّ محمدًا رسولُ الله، وتقيمُ الصلاةَ، وتؤتي الزكاة، وتحجُّ البيتَ، وتصومُ رمضان، وعليك بالعلانية، وإِيَّاك والسِّرَّ، …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 2، ص 305، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
