summary:
  ar: "القسم 48 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الذكر والدعاء والتوبة والاستغفار»، ويضم فيها النصوص من 6805 إلى 6936 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 48 of Sahih Muslim (The Book Pertaining to the Remembrance of Allah, Supplication, Repentance and Seeking Forgiveness) in the division of the open hadith dataset the museum took its reports from: reports 6805 to 6936 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 48، عنوان «کتاب الذکر والدعاء والتوبۃ والاستغفار»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6805 تا 6936۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 48 de Sahih Muslim (El libro sobre el recuerdo de Alá, la súplica, el arrepentimiento y la búsqueda del perdón) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6805 al 6936, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre relatif à l'invocation d'Allah, aux supplications, au repentir et à la demande de pardon), dans la section 48 du recueil ouvert de hadiths: les hadiths 6805 à 6936. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 48. bölümü, \"Hatırlama, Dua, Tövbe ve Bağışlanma Kitabı\" başlığını taşımakta olup, 6805'ten 6936'ya kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 48 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Mengingat, Berdoa, Bertaubat, dan Memohon Ampunan,\" dan berisi teks 6805 hingga 6936, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
