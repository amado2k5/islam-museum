label: { ar: "الموطأ 254 — عبد الله بن عمرو وكعب الأحبار: من شك صلى ركعة أخرى وسجد سجدتين", en: "Muwatta 254" }
summary:
  ar: "أثر يرويه مالك عن عفيف بن عمرو السهمي عن عطاء بن يسار، في باب إتمام المصلي ما ذكر إذا شك في صلاته: سأل عطاء عبد الله بن عمرو بن العاص وكعب الأحبار عن الذي يشك في صلاته فلا يدري أثلاثاً صلى أم أربعاً، فكلاهما قال: ليصل ركعة أخرى ثم ليسجد سجدتين وهو جالس. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.151}"
