label: { ar: "الموطأ 254 — عبد الله بن عمرو وكعب الأحبار: من شك صلى ركعة أخرى وسجد سجدتين", en: "Muwatta 254", es: "Muwatta 254", fr: "Muwatta 254", ur: "موطا 254", tr: "El-Muvatta 254 — Abdullah ibn Amr ve Ka'b el-Ahbar: Şüpheye düşen kimse bir rekat daha namaz kılmalı ve iki secde yapmalıdır.", id: "Al-Muwatta 254 — Abdullah ibn Amr dan Ka’b al-Ahbar: Barangsiapa yang ragu, hendaklah ia shalat satu rakaat lagi dan melakukan dua sujud." }
summary:
  ar: "أثر يرويه مالك عن عفيف بن عمرو السهمي عن عطاء بن يسار، في باب إتمام المصلي ما ذكر إذا شك في صلاته: سأل عطاء عبد الله بن عمرو بن العاص وكعب الأحبار عن الذي يشك في صلاته فلا يدري أثلاثاً صلى أم أربعاً، فكلاهما قال: ليصل ركعة أخرى ثم ليسجد سجدتين وهو جالس. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.151}"
  tr: "Malik'in Afif ibn Amr el-Sahmi'den, o da Ata ibn Yasar'dan rivayet ettiği, namazın nasıl kılınacağından emin olmayanlar için namazın nasıl tamamlanacağı bölümünde yer alan bir rivayette şöyle denmektedir: Ata, Abdullah ibn Amr ibn el-As ve Kaab el-Ahber'e, namazının nasıl kılınacağından emin olmayan, üç mü yoksa dört rekat mı kıldığını bilmeyen birini sormuş. İkisi de şöyle demiş: \"Bir rekat daha kılmalı ve sonra oturarak iki secde yapmalıdır.\" Araştırmacı, bu rivayetin Malik'ten Ebu Musab, Suveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.151}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Afif ibn Amr al-Sahmi dari Ata ibn Yasar, dalam surah tentang menyempurnakan salat jika seseorang ragu-ragu: Ata bertanya kepada Abdullah ibn Amr ibn al-As dan Kaab al-Ahbar tentang seseorang yang ragu-ragu tentang salatnya, tidak tahu apakah ia telah salat tiga atau empat rakaat. Keduanya berkata: Ia hendaknya salat satu rakaat lagi dan kemudian melakukan dua sujud sambil duduk. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Musab, Suwaid, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.151}"
