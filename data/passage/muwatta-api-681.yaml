label: { ar: "موطأ مالك 681 — الواجب", en: "Muwatta Malik 681 — the obligatory (wajib)", ur: "موطأ مالک 681 — واجب", fr: "Muwatta de Malik 681 — l'obligatoire (wajib)", es: "Muwatta de Malik 681 — lo obligatorio (wajib)", tr: "Muwatta Malik 681 — Zorunlu", id: "Muwatta Malik 681 — Wajib" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ أَنَسَ بْنَ مَالِكٍ، كَبِرَ حَتَّى كَانَ لاَ يَقْدِرُ عَلَى الصِّيَامِ فَكَانَ يَفْتَدِي. قَالَ مَالِكٌ وَلاَ أَرَى ذَلِكَ وَاجِبًا وَأَحَبُّ إِلَىَّ أَنْ يَفْعَلَهُ إِذَا كَانَ قَوِيًّا عَلَيْهِ فَمَنْ فَدَى فَإِنَّمَا يُطْعِمُ مَكَانَ كُلِّ يَوْمٍ مُدًّا بِمُدِّ النَّبِيِّ."
summary:
  ar: "حديث في موطأ مالك، رقم 681، يرد فيه ذكر الواجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 681 (Fasting), whose wording mentions the obligatory (wajib). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 681، جس کے الفاظ میں واجب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 681, dont le texte mentionne l'obligatoire (wajib). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 681, cuyo texto menciona lo obligatorio (wajib). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 681 numaralı hadis, farz olan amellerden bahsetmektedir. Bu hadis, farz görevler, itaat amelleri, tavsiye edilen amelleri, mekruh edilen amelleri, haram kılınan amelleri ve küçük günahları konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 681, menyebutkan tentang amalan-amalan wajib. Hadits ini disusun oleh seorang peneliti yang ahli dalam kewajiban-kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
