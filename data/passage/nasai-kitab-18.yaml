summary:
  ar: "القسم 18 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة الخوف»، ويضم فيها النصوص من 1529 إلى 1555 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 18 of Sunan al-Nasa'i (The Book of the Fear Prayer) in the division of the open hadith dataset the museum took its reports from: reports 1529 to 1555 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 18، عنوان «کتاب صلاۃ الخوف»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1529 تا 1555۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 18 de Sunan al-Nasa'i (El Libro de la Oración del Temor) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1529 al 1555 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de la Prière de la Peur), dans la section 1529 à 1555 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
