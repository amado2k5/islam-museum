label: { ar: "الموطأ 2512 — سعيد بن المسيب: السن إذا اسودت ففيها عقلها تاما", en: "Muwatta 2512", es: "Muwatta 2512", fr: "Muwatta 2512", ur: "موطا 2512", tr: "El-Muvatta 2512 — Sa’id ibn al-Musayyab: Bir diş kararırsa, aklı tamamlanmıştır.", id: "Al-Muwatta 2512 — Sa’id ibn al-Musayyab: Jika sebuah gigi menjadi hitam, maka kecerdasannya sempurna." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه كان يقول: إذا أُصيبت السن فاسودت ففيها عقلها تاما، فإن طُرحت بعد أن تسود ففيها عقلها أيضا تاما. {cite:muwatta-maruf-1997 p.432}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet eder ki, şöyle derdi: Bir diş yaralanır ve kararırsa, tam yasal değeri ödenir. Karardıktan sonra atılırsa, yine tam yasal değeri ödenir. {cite:muwatta-maruf-1997 s.432}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya bin Sa'id, dari Sa'id bin al-Musayyab, bahwa beliau biasa berkata: Jika gigi terluka dan menjadi hitam, maka nilai hukum penuhnya tetap harus dibayar. Jika kemudian dibuang setelah menjadi hitam, maka nilai hukum penuhnya juga tetap harus dibayar. {cite:muwatta-maruf-1997 p.432}"
