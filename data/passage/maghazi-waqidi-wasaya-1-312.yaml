  tr: "El-Vakidi'nin Maghazi adlı eserinin Resimli Cilt 1, sayfa 312'deki bir alıntısında bir defin, bir mezar ve bir türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Maghazi karya al-Waqidi, Jilid Bergambar 1, hlm. 312, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah tempat suci; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
