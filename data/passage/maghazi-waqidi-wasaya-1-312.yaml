text: "وكان الناس أو عامّتهم قد حملوا قتلاهم إلى المدينة، فدُفن ببَقيع الجبل منهم عدَّةٌ، عند دار زيد بن ثابت اليوم بالسوق، سوق الظَّهْر ؛ ودُفن ببنى سَلِمَة بعضهم، ودُفن مالك بن سِنان فى موضع أَصحاب العَباء الذى عند دار نَخْلَة. …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 312، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 312, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 312 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
