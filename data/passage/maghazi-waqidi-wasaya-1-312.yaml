text: "وكان الناس أو عامّتهم قد حملوا قتلاهم إلى المدينة، فدُفن ببَقيع الجبل منهم عدَّةٌ، عند دار زيد بن ثابت اليوم بالسوق، سوق الظَّهْر ؛ ودُفن ببنى سَلِمَة بعضهم، ودُفن مالك بن سِنان فى موضع أَصحاب العَباء الذى عند دار نَخْلَة. …"
