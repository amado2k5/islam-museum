text: "… وَأَبَا بَكْرَةَ ـ وَكَانَ تَسَوَّرَ حِصْنَ الطَّائِفِ فِي أُنَاسٍ ـ فَجَاءَ إِلَى النَّبِيِّ فَقَالاَ سَمِعْنَا النَّبِيَّ يَقُولُ \" مَنِ ادَّعَى إِلَى غَيْرِ أَبِيهِ وَهْوَ يَعْلَمُ فَالْجَنَّةُ عَلَيْهِ حَرَامٌ \". وَقَالَ هِشَامٌ وَأَخْبَرَنَا مَعْمَرٌ، عَنْ عَاصِمٍ، عَنْ أَبِي الْعَالِيَةِ، أَوْ أَبِي عُثْمَانَ النَّهْدِيِّ قَالَ سَمِعْتُ سَعْدًا، وَأَبَا، بَكْرَةَ عَنِ النَّبِيِّ. قَالَ عَاصِمٌ قُلْتُ لَقَدْ شَهِدَ عِنْدَكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4326، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4326, that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4326، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4326, menciona al padre y la paternidad, la linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
