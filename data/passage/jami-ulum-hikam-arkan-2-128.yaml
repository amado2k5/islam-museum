text: "… الإيمانَ لو دخلت فيه الأعمال، للزم أنْ يزولَ بزوالِ عمل مما دخل في مسمَّاه، فإنَّ النَّبيَّ ول في عل هذه الخمسَ دعائمَ الإسلامِ ومبانيه، وفسر بها الإسلام في حديث جبريل، وفي حديث طلحة بن عُبيد اللّٰه الذي فيه أنَّ أعرابياً …"
