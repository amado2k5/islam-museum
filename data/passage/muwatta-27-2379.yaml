label: { ar: "الموطأ 2379 — ابن شهاب: الرجلان المختصمان في ابن الأجير الزاني بامرأة الآخر", en: "Muwatta 2379", es: "Muwatta 2379", fr: "Muwatta 2379", ur: "موطا 2379", tr: "El-Muvatta 2379 — İbn Şihab: İki adam, bir işçinin diğerinin karısıyla zina eden oğlu yüzünden çekişiyorlardı.", id: "Al-Muwatta 2379 — Ibn Shihab: Dua orang yang berselisih mengenai anak seorang pekerja upahan yang berzina dengan istri orang lain." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن أبي هريرة وزيد بن خالد الجهني أنهما أخبراه أن رجلين اختصما إلى النبي. فقال الأول: اقض بيننا بكتاب الله، فقال الآخر وهو أفقههما: ائذن لي أن أتكلم. قال: إن ابني كان أجيرا عند هذا فزنى بامرأته، فأخبرني أن على ابني الرجم، فافتديت منه بمائة شاة وجارية، ثم سألت أهل العلم فأخبروني أن على ابني جلد مائة وتغريب عام، وأن الرجم على امرأته. فقال النبي: أما الغنم والجارية فرد عليك، وجلد ابنه مائة وغربه عاما، وأمر أنيسا الأسلمي أن يأتي امرأة الآخر، فإن اعترفت رجمها، فاعترفت فرجمها. {cite:muwatta-maruf-1997 p.383} {cite:muwatta-maruf-1997 p.384}"
  tr: "Malik, İbn Şihab'dan, o da Ubeydullah ibn Abdullah ibn Utbe'den, o da Ebu Hurayra ve Zeyd ibn Halid el-Cuhani'den rivayet ederek, iki adamın Peygamber'in huzuruna bir ihtilaf getirdiğini anlattı. Birincisi, \"Aramızda Allah'ın Kitabına göre hüküm verin\" dedi. İkisinden daha bilgili olan diğeri, \"Söz söylememe izin verin\" dedi. Dedi ki: \"Oğlum bu adamın hizmetçisiydi ve karısıyla zina etti. Adam bana oğlumun taşlanarak öldürülmesi gerektiğini söyledi, ben de onu yüz koyun ve bir cariye ile fidye olarak aldım. Sonra âlimlere danıştım ve bana oğlumun yüz kırbaç cezası alması ve bir yıl sürgüne gönderilmesi gerektiğini, taşlanmanın ise karısı için olması gerektiğini söylediler.\" Peygamber, \"Koyunlar ve cariye sana iade edilsin\" dedi. Adam oğlunu yüz kırbaç cezasına çarptırdı ve bir yıl sürgüne gönderdi. Anis el-Aslami'ye diğer adamın karısına gitmesini ve eğer itiraf ederse onu taşlamasını emretti. Kadın itiraf etti, bu yüzden onu taşladı."
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Ubayd Allah ibn Abdullah ibn Utbah, dari Abu Hurayrah dan Zayd ibn Khalid al-Juhani, bahwa mereka memberitahunya bahwa dua orang mengajukan perselisihan kepada Nabi. Yang pertama berkata, “Putuskanlah di antara kami menurut Kitab Allah.” Yang lain, yang lebih berpengetahuan di antara keduanya, berkata, “Izinkan saya berbicara.” Ia berkata, “Anakku adalah hamba orang ini dan berzina dengan istrinya. Ia mengatakan kepadaku bahwa anakku harus dirajam, maka aku menebusnya dengan seratus ekor domba dan seorang budak perempuan. Kemudian aku bertanya kepada para ulama, dan mereka mengatakan kepadaku bahwa anakku harus dicambuk seratus kali dan diasingkan selama setahun, dan bahwa rajam itu untuk istrinya.” Nabi bersabda, “Adapun domba dan budak perempuan itu, dikembalikan kepadamu.” Ia menyuruh anaknya dicambuk seratus kali dan diasingkannya selama setahun. Dia memerintahkan Anis al-Aslami untuk pergi ke istri pria lain itu, dan jika wanita itu mengaku, maka dia harus dirajam. Wanita itu mengaku, jadi dia dirajam."
