label: { ar: "الموطأ 2379 — ابن شهاب: الرجلان المختصمان في ابن الأجير الزاني بامرأة الآخر", en: "Muwatta 2379" }
summary:
  ar: "يروي مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة عن أبي هريرة وزيد بن خالد الجهني أنهما أخبراه أن رجلين اختصما إلى النبي. فقال الأول: اقض بيننا بكتاب الله، فقال الآخر وهو أفقههما: ائذن لي أن أتكلم. قال: إن ابني كان أجيرا عند هذا فزنى بامرأته، فأخبرني أن على ابني الرجم، فافتديت منه بمائة شاة وجارية، ثم سألت أهل العلم فأخبروني أن على ابني جلد مائة وتغريب عام، وأن الرجم على امرأته. فقال النبي: أما الغنم والجارية فرد عليك، وجلد ابنه مائة وغربه عاما، وأمر أنيسا الأسلمي أن يأتي امرأة الآخر، فإن اعترفت رجمها، فاعترفت فرجمها. {cite:muwatta-maruf-1997 p.383} {cite:muwatta-maruf-1997 p.384}"
