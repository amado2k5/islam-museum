text: "… رُدَّت عليه اعطى كل امرأةٍ من نسائِه أوقية من ذلك المسك، واعطى سائِرهُ أمَّ سلمة وأعطاها الحَلَّةَ. قوله ولا أرَاهُ الا قد ماتَ يُريدُ والله اعلم قبل بلوغ الهدية اليه وهذا القولُ صَدَرَ منه قبل موته ثم لما مات نعاه …"
summary:
  ar: "مقطع من دلائل النبوة، المجلد المصوَّر 1، ص 2044، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
