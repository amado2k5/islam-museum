  tr: "Peygamberliğin İşaretleri, Resimli Cilt 1, sayfa 2044'ten bir alıntı; bir ağıt ve ölüm duyurusu içeriyor; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Tanda-Tanda Kenabian, Jilid Bergambar 1, halaman 2044, berisi pidato penghormatan dan pengumuman kematian; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan pidato penghormatan paling terkenal."
