text: "بعد إخضاعه (١). ولكن سرعان ما وافى ابن طولون وهو في الطريق كتاب من العراق يأمره بالعودة إلى مصر. وقدم ماجور التركي من العراق وهزم قوة أبن الشيخ واستولى على دمشق، ولحق ابن الشيخ بنواحي أرمينية فتولى ماجور أعمال الشام"
