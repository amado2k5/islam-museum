label: { ar: "جامع الترمذي 3590 — ما يُكفَّر باجتناب الكبائر", en: "Jami' al-Tirmidhi 3590 — what is expiated when the major sins are avoided", ur: "جامع ترمذی 3590 — جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے", fr: "Jami' al-Tirmidhi 3590 — ce qui est expié quand les grands péchés sont évités", es: "Yami' al-Tirmidhi 3590 — lo que se expía cuando se evitan los pecados mayores" }
text: "… يَزِيدَ الصُّدَائِيُّ الْبَغْدَادِيُّ، حَدَّثَنَا الْوَلِيدُ بْنُ الْقَاسِمِ بْنِ الْوَلِيدِ الْهَمْدَانِيُّ، عَنْ يَزِيدَ بْنِ كَيْسَانَ، عَنْ أَبِي حَازِمٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَا قَالَ عَبْدٌ لاَ إِلَهَ إِلاَّ اللَّهُ قَطُّ مُخْلِصًا إِلاَّ فُتِحَتْ لَهُ أَبْوَابُ السَّمَاءِ حَتَّى تُفْضِيَ إِلَى الْعَرْشِ مَا اجْتَنَبَ الْكَبَائِرَ \". قَالَ هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3590، يرد فيه ذكر ما يُكفَّر باجتناب الكبائر. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 3590 (Chapters on Supplication), whose wording mentions what is expiated when the major sins are avoided. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 3590، جس کے الفاظ میں جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 3590, dont le texte mentionne ce qui est expié quand les grands péchés sont évités. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 3590, cuyo texto menciona lo que se expía cuando se evitan los pecados mayores. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
