label:
  ar: "مسلم 2756b — الرجل الذي أوصى بنيه أن يحرقوه خشية من الله"
  en: "Muslim 2756b — The man who told his sons to burn his body for fear of God"
  ur: "مسلم 2756b — وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی"
text: "أسرف رجل على نفسه فلما حضره الموت أوصى بنيه فقال إذا أنا مت فأحرقوني ثم اسحقوني ثم اذروني في الريح في البحر فوالله لئن قدر على ربي ليعذبني عذابا ما عذبه به أحدا . قال ففعلوا ذلك به فقال للأرض …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2756b: الرجل الذي أوصى بنيه أن يحرقوه خشية من الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2756b: The man who told his sons to burn his body for fear of God. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2756b: وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
