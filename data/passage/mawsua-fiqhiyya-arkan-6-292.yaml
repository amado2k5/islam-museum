text: "… إنسانا معصوما من هلكة، كما روي عن سويد بن حنظلة قال: خرجنا نريد النبي ومعنا وائل بن حجر، فأخذه عدوّ له، فتحرج القوم أن يحلفوا، فحلفت أنا: أنه أخي، فذكرت ذلك للنبي لي قال النبي لللا، صدقت، المسلم أخو المسلم …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 292، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 6, p. 292, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 6، ص 292 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 6, pág. 292, que menciona una descripción del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de l'Encyclopédie koweïtienne de jurisprudence islamique (Fiqh), volume 6, page 292, contenant une description du musulman; extrait de la numérisation automatique, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi'nin Resimli 6. Cildinin 292. sayfasından bir alıntı, bir Müslümanın özelliklerini açıklamaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikası gereği metin yaklaşık kırk kelimeyle sınırlıdır. Bu alıntı, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve bir müminin niteliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Ensiklopedia Yurisprudensi Islam Kuwait, Jilid 6 Bergambar, halaman 292, menjelaskan karakteristik seorang Muslim. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
