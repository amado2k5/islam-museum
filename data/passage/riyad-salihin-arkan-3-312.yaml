text: "… سَلِمَ المُسْلِمُونَ مِنْ لِسَانِهِ ويدِهِ، والمُهَاجِرُ منْ هَجَر ما نَهَى اللَّهِ هنْهُ متفقٌ عليه. - وعنهُ قالَ : قال رسولُ اللَّه مَعم : مَنْ أحبَّ أن يُزَحْزحَ عن النَّارِ، ويَدْخَل الجنَّةَ، فلتَائِهِ مِنِيَتُهُ وهُوَ يُؤْمِنُ باللهِ واليَوْمِ الآخِرِ، وَلِيَاتِ إلى …"
