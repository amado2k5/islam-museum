label: { ar: "الموطأ 2052 — مالك: وإن اشترط الزرع بينهما فلا بأس، إذا كانت المؤونة كلها على الداخل في المال، البذر والسقي والعلاج، فإن اشترط الداخل أن البذر على رب المال فذلك غير جائز", en: "Muwatta 2052" }
summary:
  ar: "قال مالك: وإن اشترط الزرع بينهما، فلا بأس بذلك، إذا كانت المؤونة كلها على الداخل في المال، البذر والسقي والعلاج كله. فإن اشترط الداخل في المال على رب المال أن البذر عليه، فإن ذلك غير جائز، لأنه قد اشترط على رب المال زيادة ازدادها عليه. وإنما تكون المساقاة على أن الداخل في المال المؤونة كلها والنفقة، ولا يكون على رب المال منها شيء. فهذا وجه المساقاة المعروف. {cite:muwatta-maruf-1997 p.240}"
