label: { ar: "سنن أبي داود 3113 — ساعة الاحتضار والوفاة", en: "Sunan Abi Dawud 3113 — a deathbed and last hours", ur: "سنن ابی داؤد 3113 — وقتِ وفات اور آخری لمحات", es: "Sunan Abi Dawud 3113 — lecho de muerte y últimas horas", fr: "Sunan Abi Dawud 3113 — Le lit de mort et les dernières heures", tr: "Sunan Abi Davud 3113 — Ölüm ve Ölme Saati", id: "Sunan Abi Dawud 3113 — Saat-saat Sakaratul Maut dan Kematian" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عِيسَى بْنُ يُونُسَ، حَدَّثَنَا الأَعْمَشُ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ قَبْلَ مَوْتِهِ بِثَلاَثٍ قَالَ \" لاَ يَمُوتُ أَحَدُكُمْ إِلاَّ وَهُوَ يُحْسِنُ الظَّنَّ بِاللَّهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3113، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3113 (Funerals (Kitab Al-Jana'iz)), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3113، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3113 (Funerales (Kitab Al-Jana'iz)), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 3113 (Les Funérailles), mentionne un lit de mort et les dernières heures. Le navigateur de textes religieux le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da yer alan 3113 numaralı hadis, ölüm anını ve ölüm sürecini konu almaktadır. Bu hadis, vasiyetnameler, miras, tarihi yerler ve türbeler üzerine araştırmalar yapan uzmanlar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3113, menyebutkan saat kematian dan saat sekarat. Hadits ini dikumpulkan oleh para peneliti wasiat, warisan, situs bersejarah, dan tempat-tempat suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
