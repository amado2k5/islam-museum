label: { ar: "سنن ابن ماجه 1169 — ما ليس بواجب، الصلاة المكتوبة", en: "Sunan Ibn Majah 1169 — what is said not to be obligatory; the prescribed prayer", ur: "سنن ابن ماجہ 1169 — جو واجب نہیں، فرض نماز", fr: "Sunan Ibn Majah 1169 — ce qui est dit non obligatoire ; la prière prescrite", es: "Sunan Ibn Mayah 1169 — lo que se dice que no es obligatorio; la oración prescrita", tr: "Sunan İbn Majah 1169 — Farz olmayanlar, farz namazlar", id: "Sunan Ibn Majah 1169 — Apa yang tidak wajib, shalat yang diwajibkan" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، وَمُحَمَّدُ بْنُ الصَّبَّاحِ، قَالاَ حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَاصِمِ بْنِ ضَمْرَةَ السَّلُولِيِّ، قَالَ قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ إِنَّ الْوِتْرَ لَيْسَ بِحَتْمٍ وَلاَ كَصَلاَتِكُمُ الْمَكْتُوبَةِ وَلَكِنْ رَسُولُ اللَّهِ ـ أَوْتَرَ. ثُمَّ قَالَ \" يَا أَهْلَ الْقُرْآنِ أَوْتِرُوا. فَإِنَّ اللَّهَ وِتْرٌ يُحِبُّ الْوِتْرَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1169، يرد فيه ذكر ما ليس بواجب، والصلاة المكتوبة، والحتم. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 1169 (Establishing the Prayer and the Sunnah Regarding Them), whose wording mentions what is said not to be obligatory, the prescribed prayer, the binding (hatm). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1169، جس کے الفاظ میں جو واجب نہیں، فرض نماز، حتمی حکم کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 1169, dont le texte mentionne ce qui est dit non obligatoire, la prière prescrite, le contraignant (hatm). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 1169, cuyo texto menciona lo que se dice que no es obligatorio, la oración prescrita, lo vinculante (hatm). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Majah'ın Sünen'inde yer alan 1169 numaralı hadiste, farz olan ve farz olmayan ibadetler, farz namazlar ve farz ibadetler zikredilmiştir. Farz ibadetler, görevler, itaat amelleri, tavsiye edilen amelleri, mekruh edilen amelleri, haram kılınan amelleri ve küçük günahları ele alan bu kitabın derleyicisi, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte, metinde yer alanları açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1169, menyebutkan apa yang tidak wajib, salat yang diwajibkan, dan apa yang wajib. Penyusun buku tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan apa yang ada dalam teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan hal itu."
