label: { ar: "نوادر جحا الكبرى، ص 74 — «هل سمعت من يشكو الربيع؟»", en: "Nawadir Juha al-Kubra, p. 74 — 'Have You Heard Anyone Complain of Spring?'", ur: "نوادر جحا الکبریٰ، ص 74 — «کیا تم نے کبھی کسی کو بہار کی شکایت کرتے سنا؟»", fr: "Nawadir Juha al-Kubra, p. 74 — « As-tu déjà entendu quelqu'un se plaindre du printemps ? »", es: "Nawadir Juha al-Kubra, p. 74 — «¿Has oído a alguien quejarse de la primavera?»", tr: "Juha'nın Muhteşem Fıkraları, s. 74 — “Bahar hakkında şikayet eden birini duydunuz mu?”", id: "Anekdot Hebat Juha, hlm. 74 — “Pernahkah Anda mendengar ada orang yang mengeluh tentang musim semi?”" }
text: "… هل سمعت مَن يشكو الربيع؟ شكا أحدهم شدة البرد فسمعه آخر فقال: يا للعجب من هؤلاء الناس إذا جاء"
summary:
  ar: "اشتكى رجل من البرد، فقال آخر إن الناس يشتكون في الشتاء من البرد وفي الصيف من الحر؛ فقال جحا نعم، ولكن هل سمعتم أحدًا اشتكى من الربيع. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  en: "A man complains of cold, and another says people complain in winter of cold and in summer of heat; Juha says yes, but has anyone ever complained of spring. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  ur: "ایک آدمی نے سردی کی شکایت کی تو دوسرے نے کہا کہ لوگ سردیوں میں سردی کی اور گرمیوں میں گرمی کی شکایت کرتے ہیں؛ جحا نے کہا ہاں، مگر کیا کسی نے کبھی بہار کی شکایت کی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  fr: "Un homme se plaint du froid, et un autre dit qu'on se plaint du froid en hiver et de la chaleur en été; Juha dit que oui, mais que personne ne s'est jamais plaint du printemps. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  es: "Un hombre se queja del frío, y otro dice que la gente se queja del frío en invierno y del calor en verano; Juha dice que sí, pero que nadie se ha quejado jamás de la primavera. {cite:juha-nawadir-kubra-djuwaydi p. 74}"
  tr: "Bir adam soğuktan şikayet etti, bir diğeri de, \"İnsanlar kışın soğuktan, yazın da sıcaktan şikayet ederler\" dedi. Juha, \"Evet, ama hiç kimsenin bahardan şikayet ettiğini duydunuz mu?\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 74}"
  id: "Seorang pria mengeluh tentang cuaca dingin, dan yang lain berkata, \"Orang-orang mengeluh tentang cuaca dingin di musim dingin dan cuaca panas di musim panas.\" Juha menjawab, \"Ya, tetapi pernahkah Anda mendengar ada orang yang mengeluh tentang musim semi?\" {cite:juha-nawadir-kubra-djuwaydi p. 74}"
