text: "… اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، وَعَائِشَةَ، أَنَّ أَبَا بَكْرٍ ـ قَبَّلَ النَّبِيَّ وَهْوَ مَيِّتٌ. قَالَ وَقَالَتْ عَائِشَةُ لَدَدْنَاهُ فِي مَرَضِهِ، فَجَعَلَ يُشِيرُ إِلَيْنَا، أَنْ لاَ تَلُدُّونِي. فَقُلْنَا كَرَاهِيَةُ الْمَرِيضِ لِلدَّوَاءِ. فَلَمَّا أَفَاقَ قَالَ \" أَلَمْ أَنْهَكُمْ أَنْ تَلُدُّونِي \". قُلْنَا كَرَاهِيَةَ الْمَرِيضِ لِلدَّوَاءِ. فَقَالَ \" لاَ يَبْقَى فِي الْبَيْتِ أَحَدٌ إِلاَّ لُدَّ ـ وَأَنَا أَنْظُرُ ـ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5709، يذكر اللدود والسعوط، والمرض والمريض، والدواء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5709, that mentions medicine given by the mouth-side or the nose, illness and the sick, the drug. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5709، جس میں لدود اور سعوط، بیماری اور بیمار، دوا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
