summary:
  ar: "سؤال في باب غدو الإمام يوم العيد وانتظار الخطبة: سُئل مالك عن رجل صلى مع الإمام يوم الفطر هل له أن ينصرف قبل أن يسمع الخطبة، فقال: لا ينصرف حتى ينصرف الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.256}"
