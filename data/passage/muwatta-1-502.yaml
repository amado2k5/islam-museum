label: { ar: "الموطأ 502 — مالك: لا ينصرف المصلي يوم الفطر حتى ينصرف الإمام", en: "Muwatta 502", es: "Muwatta 502", fr: "Muwatta 502", ur: "موطا 502", tr: "El-Muvatta 502 — Malik: İbadet eden kişi, imam ayrılmadan Ramazan Bayramı günü ayrılmamalıdır.", id: "Al-Muwatta 502 — Malik: Jamaah tidak boleh meninggalkan tempat shalat pada hari raya Idul Fitri sampai imam meninggalkan tempat shalat." }
summary:
  ar: "سؤال في باب غدو الإمام يوم العيد وانتظار الخطبة: سُئل مالك عن رجل صلى مع الإمام يوم الفطر هل له أن ينصرف قبل أن يسمع الخطبة، فقال: لا ينصرف حتى ينصرف الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.256}"
  tr: "Ramazan Bayramı günü imamın hazır bulunması ve hutbeyi beklemesiyle ilgili bir soru: Malik'e, Ramazan Bayramı günü imamla birlikte namaz kılan bir adam hakkında soru soruldu; hutbeyi dinlemeden ayrılmasına izin verilir mi? Cevabı şöyle oldu: İmam ayrılana kadar ayrılmamalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.256}"
  id: "Pertanyaan mengenai kehadiran imam pada hari raya Idul Fitri dan menunggu khutbah: Malik ditanya tentang seorang pria yang shalat bersama imam pada hari raya Idul Fitri; apakah dia diperbolehkan pergi sebelum mendengar khutbah? Beliau menjawab: Dia tidak boleh pergi sampai imam pergi. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.256}"
