text: "وقد علمنا أنَّ أفضلَ ما يقطع به الفُرَّاغ نهارَهم، وأصحابُ الفُكاهات ساعاتِ ليلهم، الكتاب. وهو الشيء الذي لا يرى لهم فيه مع النيل أثرّ في ازدِياد تجربةٍ ولا عقلٍ ولا مروءة، ولا في صونِ عرض، ولا في إِصلاحِ دِين، ولا …"
summary:
  ar: "مقطع من كتاب الحيوان، المجلد المصوَّر 1، ص 40، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Kitab al-Hayawan, scan volume 1, p. 40, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "کتاب الحیوان، اسکین جلد 1، ص 40 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Hayawan, volume numérisé 1, p. 40, avec une anecdote ou un trait d'esprit ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Kitab al-Hayawan, volumen escaneado 1, p. 40, con una anécdota o agudeza; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hayvanlar Kitabı, Resimli Cilt 1, sayfa 40'tan, esprili bir anekdot veya mizahi bir hikaye içeren bir alıntı; makineyle okunabilir resimli baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Buku Hewan, Jilid Bergambar 1, halaman 40, berisi anekdot cerdas atau cerita lucu; dari edisi bergambar yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
