text: "قلت لهم: أما قولكم: حكم الرجال في أمر الله أنا أقرأ عليكم في كتاب الله عز وجل ما ينقض قولكم، أترجعون؟ قالوا: نعم. قلت: فإن الله قد صير من حكمه إلى الرجال في ربع درهم ثمن أرنب وتلا هذه الآية:"
