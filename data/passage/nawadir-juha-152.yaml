text: "نوادر جحا الكبرى المِلْقَطُ بثلاثة آلاف ذهب يوماً إلى السوق فرأى بيد الدلال سيفاً، ينادي عليه، بثلاثة آلاف قرش فأخذه بيده وتأمله فلم يجده يساوي هذه القيمة فسأل من هناك عن ذلك فقالوا له : متى أراد الإنسانُ أن يضرِب …"
summary:
  ar: "كان جحا يكرر أن الله واحد والقول واحد، وفي هذا القول بيان لثباته على رأيه. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  en: "Juha repeats that God is one and the word is one; the saying shows his consistency. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  ur: "جحا بار بار کہتا تھا کہ اللہ ایک ہے اور بات ایک ہے؛ یہ قول اس کے اپنی بات پر قائم رہنے کو ظاہر کرتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  fr: "Juha répète que Dieu est un et que la parole est une; ce dicton montre sa constance. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  es: "Juha repite que Dios es uno y la palabra es una; el dicho muestra su constancia. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
