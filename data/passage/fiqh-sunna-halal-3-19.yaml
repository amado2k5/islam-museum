text: "… رحمة لكم غير نسيان فلا تبحثوا عنها. - وعن سلمان الفارسي أن الرسول عنياع سئل عن السمن والجبن والفراء فقال : الحلال ما أحله اللّٰه في كتابه، والحرام ما حرمه اللّه في كتابه، وما سكت عنه فهو مما عفا لكم. …"
