summary:
  ar: "يروي مالك عن ابن شهاب أنه كان يقول: إذا أدرك الرجل الركعة فكبّر تكبيرة واحدة أجزأته تلك التكبيرة؛ ويعلق مالك بأن ذلك إذا نوى بها افتتاح الصلاة. وهو في باب افتتاح الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.127}"
