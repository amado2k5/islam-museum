text: "رة(٥) - صاحب نهر مرة - عبد الرحمن بن أبي بكر الصديق يها أن يكتب له كتابا إلى زياد، فكتب له : من عبد الرحمن بن أبي بكر إلى زياد. ولم ينسبه إلى أبي سفيان، فقال له مرة: إن ذهبت"
