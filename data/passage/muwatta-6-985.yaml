summary:
  ar: "قول لمالك: كل من انقطع إلى مكة من أهل الآفاق وسكنها، ثم اعتمر في أشهر الحج، ثم أنشأ الحج منها، فليس بمتمتع، وليس عليه هدي ولا صيام، وهو بمنزلة أهل مكة إذا كان من ساكنيها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1117). {cite:muwatta-maruf-1997 p.464}"
