text: "… من بني سعد يقال لها حليمة، فجاء بها فدفعه إليها وشيّعها عبد المطلب وهو يقول : محمدٍ فاقلب بخير طائرٍ يا رَبَّ هذا الراكبِ المسافرِ ح الحديث مرسل. وانظر الأبيات في إتحاف الورى مع بعض الاختلاف، وهي هنا أصح. اللمم …"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، المجلد المصوَّر 1، ص 162، يرد فيه ذكر اللمم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, scan volume 1, p. 162, whose wording mentions the lamam (small faults); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "دلائل النبوۃ، ابو نعیم، اسکین جلد 1، ص 162 کا اقتباس جس میں لمم ⁦(چھوٹی لغزشیں)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Dala'il al-Nubuwwa de Abu Nu'aym, volume numérisé 1, p. 162, dont le texte mentionne le lamam (fautes légères) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Dala'il al-Nubuwwa de Abu Nu'aym, volumen digitalizado 1, p. 162, cuyo texto menciona el lamam (faltas leves); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Ebu Nuaym'ın \"Peygamberliğin Delilleri\" adlı eserinin 1. cildinin 162. sayfasından bir alıntı, küçük günahlardan bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Abu Nu'aym, \"Bukti Kenabian,\" Jilid 1, halaman 162, menyebutkan dosa-dosa kecil; ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
