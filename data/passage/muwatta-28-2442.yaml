label: { ar: "الموطأ 2442 — ثور بن زيد الديلي: عمر يستشير في حد شارب الخمر، وعلي يرى ثمانين", en: "Muwatta 2442", es: "Muwatta 2442", fr: "Muwatta 2442", ur: "موطا 2442", tr: "Al-Muwatta 2442 — Thawr ibn Zayd al-Dili: Ömer, içki içmenin cezası hakkında istişarede bulundu ve Ali seksen [ceza] önerdi.", id: "Al-Muwatta 2442 — Thawr ibn Zayd al-Dili: Umar berkonsultasi tentang hukuman untuk minum alkohol, dan Ali menyarankan delapan puluh [hukuman]." }
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي أن عمر بن الخطاب استشار في الخمر يشربها الرجل، فقال له علي بن أبي طالب: نرى أن تجلده ثمانين، فإنه إذا شرب سكر، وإذا سكر هذى، وإذا هذى افترى. فجلد عمر في الخمر ثمانين. {cite:muwatta-maruf-1997 p.409}"
  tr: "Malik, Sevr ibn Zeyd el-Dili'den rivayetle, Ömer ibn el-Hattab'ın şarap içen bir adam hakkında danıştığını ve Ali ibn Ebu Talib'in ona şöyle dediğini aktarır: \"Bizce bu adam seksen kez kırbaçlanmalıdır, çünkü içerse sarhoş olur, sarhoş olursa sayıklar, sayıklarsa iftira atar.\" Bunun üzerine Ömer, şarap içtiği için adamı seksen kez kırbaçladı. {cite:muwatta-maruf-1997 s.409}"
  id: "Malik meriwayatkan dari Thawr ibn Zayd al-Dili bahwa Umar ibn al-Khattab meminta nasihat tentang seorang pria yang minum anggur, dan Ali ibn Abi Talib berkata kepadanya: Kami berpendapat bahwa dia harus dicambuk delapan puluh kali, karena jika dia minum, dia akan mabuk, dan jika dia mabuk, dia akan mengoceh, dan jika dia mengoceh, dia akan memfitnah. Maka Umar mencambuknya delapan puluh kali karena minum anggur. {cite:muwatta-maruf-1997 p.409}"
