label: { ar: "الموطأ 2442 — ثور بن زيد الديلي: عمر يستشير في حد شارب الخمر، وعلي يرى ثمانين", en: "Muwatta 2442" }
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي أن عمر بن الخطاب استشار في الخمر يشربها الرجل، فقال له علي بن أبي طالب: نرى أن تجلده ثمانين، فإنه إذا شرب سكر، وإذا سكر هذى، وإذا هذى افترى. فجلد عمر في الخمر ثمانين. {cite:muwatta-maruf-1997 p.409}"
