text: "… مَن يسلم مِن لسان الخلق للَّه درُّهُ ذهب وابنه، يوماً إلى إحدى القرى وأركب ابنه على الحمار، فصادفَهُ أحدُهم فقال: أفٍ من هذا الزمان، أنظروا كيف يركب هذا الغلامُ براحةٍ ويترك والده الشيخ الفاني يمشي على قدميه. فقال الولد: يا …"
summary:
  ar: "ذهب جحا وابنه إلى قرية، وكان المارة ينتقدون كلما ركب أحدهما، فمشيا معًا يقودان الحمار؛ فانتُقدا ثانية، فقال جحا إن من يسلم من ألسنة الناس فهو أهل للثناء. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  en: "Juha and his son go to a village; whenever one rides, passers-by criticise, so both walk and lead the donkey; they are criticised again, and Juha says whoever escapes people's tongues deserves praise. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  ur: "جحا اور اس کا بیٹا ایک گاؤں گئے؛ جب بھی ان میں سے ایک سوار ہوتا تو راہگیر تنقید کرتے، اس لیے دونوں پیدل چلے اور گدھے کو ساتھ لے کر چلے؛ پھر بھی تنقید ہوئی تو جحا نے کہا کہ جو لوگوں کی زبانوں سے بچ نکلے وہ تعریف کے لائق ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  fr: "Juha et son fils vont dans un village; chaque fois que l'un monte, les passants critiquent, alors ils marchent tous deux en menant l'âne; ils sont de nouveau critiqués, et Juha dit que celui qui échappe à la langue des gens mérite des louanges. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
  es: "Juha y su hijo van a una aldea; cada vez que uno monta, los transeúntes critican, así que ambos caminan y llevan al burro; los critican de nuevo, y Juha dice que quien escapa a las lenguas de la gente merece elogio. {cite:juha-nawadir-kubra-djuwaydi p. 85}"
