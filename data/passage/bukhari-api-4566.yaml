label: { ar: "صحيح البخاري 4566 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4566 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4566 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4566 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 4566 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، أَنَّ أُسَامَةَ بْنَ زَيْدٍما ـ أَخْبَرَهُ أَنَّ رَسُولَ اللَّهِ رَكِبَ عَلَى حِمَارٍ عَلَى قَطِيفَةٍ فَدَكِيَّةٍ، وَأَرْدَفَ أُسَامَةَ بْنَ زَيْدٍ وَرَاءَهُ، يَعُودُ سَعْدَ بْنَ عُبَادَةَ فِي بَنِي الْحَارِثِ بْنِ الْخَزْرَجِ قَبْلَ وَقْعَةِ بَدْرٍ ـ قَالَ ـ حَتَّى مَرَّ بِمَجْلِسٍ فِيهِ عَبْدُ اللَّهِ بْنُ أُبَىٍّ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4566، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4566 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4566، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4566 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 4566 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
