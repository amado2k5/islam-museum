label: { ar: "الموطأ 293 — ابن عمر لا يروح إلى الجمعة إلا ادّهن وتطيب", en: "Muwatta 293" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الهيئة وتخطي الرقاب واستقبال الإمام يوم الجمعة: كان عبد الله بن عمر لا يروح إلى الجمعة إلا ادّهن وتطيب، إلا أن يكون محرماً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.167}"
