label: { ar: "الموطأ 293 — ابن عمر لا يروح إلى الجمعة إلا ادّهن وتطيب", en: "Muwatta 293", es: "Muwatta 293", fr: "Muwatta 293", ur: "موطا 293", tr: "El-Muvatta 293 — İbn Ömer, cuma namazına ancak yüzüne yağ ve parfüm sürdükten sonra giderdi.", id: "Al-Muwatta 293 — Ibnu Umar tidak akan pergi ke salat Jumat kecuali setelah memakai minyak dan parfum." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الهيئة وتخطي الرقاب واستقبال الإمام يوم الجمعة: كان عبد الله بن عمر لا يروح إلى الجمعة إلا ادّهن وتطيب، إلا أن يكون محرماً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.167}"
  tr: "Malik'in Nafi'den rivayet ettiği, edep, insanların boyunlarına basma ve Cuma günü imama karşı dönme konularıyla ilgili bir rivayette şöyle denmektedir: Abdullah ibn Umar, ihramlı olmadığı sürece, cuma namazına yağ ve parfüm sürmeden gitmezdi. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suwaid ve Muhammed ibn al-Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.167}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’, mengenai adab, melangkahi leher orang lain, dan menghadap imam pada hari Jumat: Abdullah ibn Umar tidak akan pergi ke shalat Jumat tanpa memakai minyak dan parfum, kecuali jika ia dalam keadaan ihram. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.167}"
