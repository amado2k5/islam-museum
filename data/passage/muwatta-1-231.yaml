label: { ar: "الموطأ 231 — إذا أمّن الإمام فأمّنوا", en: "Muwatta 231", es: "Muwatta 231", fr: "Muwatta 231", ur: "موطا 231", tr: "Muvatta 231 — İmam \"Amin\" derse \"Amin\" deyin.", id: "Al-Muwatta 231 — Jika Imam berkata “Amin”, maka ucapkanlah “Amin.”" }
text: "إذا أمن الإمام فأمنوا، فإنه من وافق تأمينه تأمين الملائكة غفر له ما تقدم من ذنبه"
summary:
  ar: "أول حديث في باب ما جاء في التأمين خلف الإمام. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وأبي سلمة بن عبد الرحمن عن أبي هريرة: أمر النبي المأمومين أن يؤمّنوا إذا أمّن الإمام، لأن من وافق تأمينه تأمين الملائكة غُفر له ما تقدم من ذنبه؛ وقال ابن شهاب إن النبي كان يقول: آمين. ويخرّجه المحقق عند البخاري (780) ومسلم (2/17) وأبي داود (936) والترمذي (250) والنسائي (2/144) وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (7/8). {cite:muwatta-maruf-1997 p.139} {cite:muwatta-maruf-1997 p.140}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai mengucapkan \"Amin\" setelah imam. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Sa'id ibn al-Musayyab dan Abu Salamah ibn 'Abd al-Rahman, dari Abu Hurayrah: Nabi (shalawat dan salam kepadanya) memerintahkan jamaah untuk mengucapkan \"Amin\" ketika imam mengucapkannya, karena siapa pun yang mengucapkan \"Amin\" bertepatan dengan \"Amin\" para malaikat akan diampuni dosa-dosanya di masa lalu. Ibn Shihab berkata bahwa Nabi (shalawat dan salam kepadanya) biasa mengucapkan \"Amin.\" Hadits ini ditemukan dalam kumpulan hadits al-Bukhari (780), Muslim (2/17), Abu Dawud (936), al-Tirmidhi (250), al-Nasa'i (2/144), Ahmad, dan al-Shafi'i, melalui sanad para sahabat Malik, dan beliau merujuk pada al-Tamhid (7/8). {cite:muwatta-maruf-1997 p.139} {cite:muwatta-maruf-1997 p.140}"
