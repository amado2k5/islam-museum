label: { ar: "الموطأ 231 — إذا أمّن الإمام فأمّنوا", en: "Muwatta 231" }
text: "إذا أمن الإمام فأمنوا، فإنه من وافق تأمينه تأمين الملائكة غفر له ما تقدم من ذنبه"
summary:
  ar: "أول حديث في باب ما جاء في التأمين خلف الإمام. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وأبي سلمة بن عبد الرحمن عن أبي هريرة: أمر النبي المأمومين أن يؤمّنوا إذا أمّن الإمام، لأن من وافق تأمينه تأمين الملائكة غُفر له ما تقدم من ذنبه؛ وقال ابن شهاب إن النبي كان يقول: آمين. ويخرّجه المحقق عند البخاري (780) ومسلم (2/17) وأبي داود (936) والترمذي (250) والنسائي (2/144) وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (7/8). {cite:muwatta-maruf-1997 p.139} {cite:muwatta-maruf-1997 p.140}"
