summary:
  ar: "القسم 5 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب إقامة الصلاة والسنة فيها»، ويضم فيها النصوص من 803 إلى 1432 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 5 of Sunan Ibn Majah (Establishing the Prayer and the Sunnah Regarding Them) in the division of the open hadith dataset the museum took its reports from: reports 803 to 1432 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 5، عنوان «کتاب اقامۃ الصلاۃ والسنۃ فیہا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 803 تا 1432۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 5 de Sunan Ibn Majah (Sobre la oración y la Sunnah relacionada con ella) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 803 al 1432, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du recueil ouvert Sunan Ibn Majah (Livre 5: Établissement de la prière et de la Sunna les concernant), qui comprend les hadiths 803 à 1432. Il conserve les archives de ces hadiths dans ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanı bölümünde yer alan Sunan İbn Majah'ın 5. bölümü, \"Namazı Kurban Etme Kitabı ve Bununla İlgili Sünnet\" başlığını taşımakta olup, 803'ten 1432'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 5 dari Sunan Ibn Majah, dalam bagian tentang basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab tentang Mendirikan Shalat dan Sunnah Mengenainya,\" dan berisi teks 803 hingga 1432, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
