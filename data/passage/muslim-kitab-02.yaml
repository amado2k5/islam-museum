label:
  ar: "صحيح مسلم، كتاب الطهارة"
  en: "Sahih Muslim, Book 2: The Book of Purification"
  ur: "صحیح مسلم، کتاب الطہارۃ"
  es: "Sahih Muslim, Libro 2: El Libro de la Purificación"
  fr: "Sahih Muslim, Livre 2: Le Livre de la Purification"
summary:
  ar: "القسم 2 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطهارة»، ويضم فيها النصوص من 534 إلى 678 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 2 of Sahih Muslim (The Book of Purification) in the division of the open hadith dataset the museum took its reports from: reports 534 to 678 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 2، عنوان «کتاب الطہارۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 534 تا 678۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 2 de Sahih Muslim (El Libro de la Purificación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 534 al 678, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre de la Purification), volume 2, qui correspond aux hadiths 534 à 678 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
