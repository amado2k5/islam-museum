text: "… بن زيد، عن هشام بن عروة عن أبيه، عن أبي مراوح الغفاري، عن أبي ذر قال: قلتُ: يا رسول اللّٰه أي الأعمال أفضل - وفي رواية محاضر أي العمل أفضل-؟ قال : إيمان بالله، وجهاد في سبيله قال : قلتُ: …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 91، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 91, that mentions faith as the best of deeds, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 91 کا اقتباس جس میں ایمان بہترین عمل، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Shu'ab al-Iman de al-Bayhaqi, vol. 10, pág. 91, que menciona la fe como la mejor de las obras, uno de los artículos de fe; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 10, page 91, mentionnant la foi comme la meilleure des actions, un des articles de foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İmanın Dalları\" adlı eserinin 10. cildinin 91. sayfasından bir alıntı, imanın en hayırlı amel ve imanın direği olduğunu belirtmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın direkleri, imanın direkleri, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 91, menyebutkan iman sebagai amal terbaik dan salah satu rukun iman. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
