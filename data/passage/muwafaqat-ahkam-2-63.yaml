text: "… الترك، فإذا تحقق الاستواء شرعاً والتخيير، لم يُتصوَّر أن يكون التارك به مطيعاً؛ لعدم تعلّق الطلب بالترك ؛ فإن الطاعة لا تكون إلاّ مع الطلب، ولا طلب، فلا طاعة. والثاني: أَنّ المباح مساوٍ للواجب والمندوب، في أن كلّ واحدٍ منهما …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 2، ص 63، يرد فيه ذكر الواجب، والمندوب، والمباح، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 2, p. 63, whose wording mentions the obligatory (wajib), the recommended (mandub), the permitted (mubah), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
