text: "… جَرِيرٍ، قَالَ حَدَّثَنَا صَاحِبٌ، لَنَا عَنِ ابْنِ مَسْعُودٍ، قَالَ قَامَ فِينَا رَسُولُ اللَّهِ فَقَالَ \" لاَ يُعْدِي شَيْءٌ شَيْئًا \". فَقَالَ أَعْرَابِيٌّ يَا رَسُولَ اللَّهِ الْبَعِيرُ الْجَرِبُ الْحَشَفَةُ نُدْبِنُهُ فَيُجْرِبُ الإِبِلَ كُلَّهَا. فَقَالَ رَسُولُ اللَّهِ \" فَمَنْ أَجْرَبَ الأَوَّلَ لاَ عَدْوَى وَلاَ صَفَرَ خَلَقَ اللَّهُ كُلَّ نَفْسٍ وَكَتَبَ حَيَاتَهَا وَرِزْقَهَا وَمَصَائِبَهَا \". قَالَ أَبُو عِيسَى …"
summary:
