label: { ar: "سنن ابن ماجه 4166 — الأب والأبوة", en: "Sunan Ibn Majah 4166 — the father and fatherhood", ur: "سنن ابن ماجہ 4166 — باپ اور والدیت" }
text: "… أَبُو شُعَيْبٍ، صَالِحُ بْنُ رُزَيْقٍ الْعَطَّارُ حَدَّثَنَا سَعِيدُ بْنُ عَبْدِ الرَّحْمَنِ الْجُمَحِيُّ، عَنْ مُوسَى بْنِ عُلَىِّ بْنِ رَبَاحٍ، عَنْ أَبِيهِ، عَنْ عَمْرِو بْنِ الْعَاصِ، قَالَ قَالَ رَسُولُ ـ \" إِنَّ مِنْ قَلْبِ ابْنِ آدَمَ بِكُلِّ وَادٍ شُعْبَةً فَمَنِ اتَّبَعَ قَلْبُهُ الشُّعَبَ كُلَّهَا لَمْ يُبَالِ اللَّهُ بِأَىِّ وَادٍ أَهْلَكَهُ وَمَنْ تَوَكَّلَ عَلَى اللَّهِ كَفَاهُ التَّشَعُّبَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4166، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4166 (Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4166، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
