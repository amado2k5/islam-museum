label: { ar: "الموطأ 214 — أنس: أبو بكر وعمر وعثمان لا يقرؤون البسملة عند الافتتاح", en: "Muwatta 214" }
summary:
  ar: "أثر يرويه مالك عن حميد الطويل عن أنس بن مالك، في باب العمل في القراءة: قام أنس وراء أبي بكر وعمر وعثمان فكلهم كان لا يقرأ البسملة جهراً إذا افتتح الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي، وينقل عن ابن عبد البر أنه موقوف في الموطأ عند جماعة رواته، وأن طائفة رفعته عن مالك بذكر النبي وليس ذلك بمحفوظ عنه (التمهيد 2/228)، ويذكر أن في الصحيحين من حديث قتادة عن أنس أن النبي وأبا بكر وعمر كانوا يفتتحون الصلاة بالحمد لله رب العالمين، ويرى أن ما ذكره ابن عبد البر من اضطراب أصحاب أنس في هذا الحديث فيه مبالغة. {cite:muwatta-maruf-1997 p.131} {cite:muwatta-maruf-1997 p.132}"
