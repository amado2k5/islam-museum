label: { ar: "الموطأ 214 — أنس: أبو بكر وعمر وعثمان لا يقرؤون البسملة عند الافتتاح", en: "Muwatta 214", es: "Muwatta 214", fr: "Muwatta 214", ur: "موطا 214", tr: "Al-Muwatta 214 — Enes: Ebu Bekir, Ömer ve Osman başlangıçta Besmele okumazlar.", id: "Al-Muwatta 214 — Anas: Abu Bakr, Umar, dan Uthman tidak membaca Basmala di awal." }
summary:
  ar: "أثر يرويه مالك عن حميد الطويل عن أنس بن مالك، في باب العمل في القراءة: قام أنس وراء أبي بكر وعمر وعثمان فكلهم كان لا يقرأ البسملة جهراً إذا افتتح الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي، وينقل عن ابن عبد البر أنه موقوف في الموطأ عند جماعة رواته، وأن طائفة رفعته عن مالك بذكر النبي وليس ذلك بمحفوظ عنه ⁦(التمهيد 2/228)⁩، ويذكر أن في الصحيحين من حديث قتادة عن أنس أن النبي وأبا بكر وعمر كانوا يفتتحون الصلاة بالحمد لله رب العالمين، ويرى أن ما ذكره ابن عبد البر من اضطراب أصحاب أنس في هذا الحديث فيه مبالغة. {cite:muwatta-maruf-1997 p.131} {cite:muwatta-maruf-1997 p.132}"
  tr: "Malik'in Humaid el-Tawil'den, o da Enes ibn Malik'ten rivayet ettiği, Kur'an okuma uygulaması bölümünde yer alan bir rivayette şöyle denmektedir: Enes, Ebu Bekir, Ömer ve Osman'ın arkasında durmuş ve hiçbiri namaza başlarken Besmele'yi yüksek sesle okumamıştır. Araştırmacı, bunun Ebu Mus'ab, Suveyd ve İbn Vahb tarafından el-Tahavi'nin derlemesinde Malik'ten rivayet edildiğini belirtmektedir. İbn Abd el-Barr'ın, el-Muvatta'da bir grup ravi tarafından Sahabe'den (mevkuf) bir söz olarak nakledildiğini ve bir grubun da Peygamber'i anarak Malik'e naklettiğini, ancak bunun sahih olarak ona isnad edilmediğini söylediğini aktarmaktadır (el-Tamhid 2/228). İki Sahih'te de Enes'ten rivayet edilen Katade'nin hadisinde, Peygamberimiz, Ebu Bekir ve Ömer'in namaza \"Elhamdülillah Rabbil Âlemin\" (Alemlerin Rabbi Allah'a hamd olsun) diyerek başladıkları belirtilmektedir. İbn Abdül-Barr'ın Enes'in arkadaşlarının bu hadis hakkındaki karışıklığına dair söylediklerinin abartı olduğunu düşünmektedir. {cite:muwatta-maruf-1997 s.131} {cite:muwatta-maruf-1997 s.132}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Humaid al-Tawil atas otoritas Anas bin Malik, dalam bab tentang praktik membaca Al-Quran: Anas berdiri di belakang Abu Bakr, Umar, dan Uthman, dan tidak seorang pun dari mereka membaca Basmala dengan lantang ketika memulai salat. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwaid, dan Ibn Wahb dalam kumpulan al-Tahawi. Ia mengutip Ibn Abd al-Barr yang mengatakan bahwa itu adalah pernyataan seorang Sahabat (mawquf) dalam al-Muwatta' oleh sekelompok perawinya, dan bahwa sekelompok perawi lainnya mengaitkannya kepada Malik dengan menyebut nama Nabi, tetapi ini tidak sahih jika dikaitkan kepadanya (al-Tamhid 2/228). Ia menyebutkan bahwa dalam dua kitab Sahih, terdapat hadits dari Qatadah yang diriwayatkan oleh Anas bahwa Nabi, Abu Bakar, dan Umar biasa memulai salat dengan \"Alhamdulillah Rabbil 'Alamin\" (Segala puji bagi Allah, Tuhan semesta alam). Ia meyakini bahwa apa yang disebutkan Ibnu Abd al-Barr mengenai kebingungan para sahabat Anas terkait hadits ini adalah berlebihan. {cite:muwatta-maruf-1997 p.131} {cite:muwatta-maruf-1997 p.132}"
