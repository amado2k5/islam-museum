text: |-
  قوله جديمة المعروف غند أهل
  (النسب أنه بالجيم وان ذكره هو
  فلسما- ف حذم أه مر
  قوله والحوثا فى الشغرذ كرهمر
  الثامين اه
  ١٣٥
  بكى حارث الجولان من فقدريه * وحوران منه خاف متضائل
  والحارثان الحارث بن ظالم بن جذيمة بن يربوع بن غيظ بن مرة والحارث بن عوف بن أبى
  حارثة بن مرة بن نشبة بن غيظ بن مرة صاحب الهالة والحارثان فى باهلة الحارث بن قتيبة
  والحارث بن سهم بن عمرو بن تعلبة بن غنم ين قتيبة والحرث الزرع والحراث الزراع وقد حرث
  واحترث مثل زرع وازدرع ويقال احرث القرآن أى ادرسه وحرثت الناقة وأحرمتها
  أى سرت عليهاحتى هزات وحرثت النار حركتها والممسراث ما تحرك به نار التذور وقواه-م
  بلحرث لبنى الحارث بن كعب من شواذ التخفيف الان النون واللام قريبا المخرج فا الم يمكنهم
  الادغام ل-كون اللام حذفوا النون كما قالوا مست وظلت وكذلك يفعلون بكل قبيلة تفاهرفيها
  لام المعرفة مثل بلعنبروبلهجيم فأمااذا لم تظهر اللام فلايكون ذلك ⁦(حريت)⁩ الحريث
  بالضم تيت حفث الحفت يكسر الفاءحفت الكرش وهوالقيبة والحفان حية
  تننخ ولا تؤذى وقال جرير
  أيفا يشون وقدرأ واحفائهم • قدعضه فقضى عليه الاشجع
  (حنث الحنث الاثم والذتب وبلغ الغلام المنت أى المعصية والطاعة والحنث انطلق
  فى المين تقول أحتفت الرجل فى يمينه فحتنث أى لم يبرّ فيها وقحنث اى تعبدوا عتزل الاصنام
  مثدل تحنف وفى الحديث انه كان يأتى غار راء فيتحنت فيه وفلان يتحنت من كذا أى يتأثم
  منهحوث) -وث لغة فى حيث والحوناء السكبد ومايليها قال الراجز
  إنا وجدنالحهم رديا • الكرش والحوثاء وااريا
  ويقال تركه-م -ونابوثا وحوث بوث وحيث بيت وحاثبات اذا فرقهم وبددهم
  والاستحاثة مثل الاستباثة وهى الاستخ_راج تقول استحثت الشئ اذاضاع فى التراب
  فوجدته حيث) حيث كلمة تدل على المكان لانه ظرف فى الامكنة بنزلة حيز فى الازمنة
  وهواسم مبنى واغماحوك آخره لالبقاء الساكنين فن العرب من يبنبها على الضم تشبيها
  بالغايات لاتم الم تجى الامضافة الى جملد كقولك أقوم حيث يقوم زيدولم تقل حيث زيد
  وتقول حيث تكون أكون ومنه-م من يبنيها على الفتح مشل كيف استثقالا للفهم
  مع الياء وهى من الظروف التى لا يجازى بها الامع ما تقول حيثما تجلس اجلس فى معو
  أينما وقوله تعالى ولا يفلح الساحر حيث أتى فى حرف ابن م-•وداين أتى والعرب تقول
  جثت من أين لا تعلم أى من حيث لا تعلم
  ف ل النخا. ث) اظهبيت ضذّا الطيب وقد خبت الشئ خيائة وخبت الرجل
  خبناذه وخبيت أى خب ردى. وأخبثه غيره اى على الحبث وأفسده وأخبث ايضا أى اتخذ
  أصحا يا خيناء فهو خبيث مخبت ومخبثان بقسال يا مخبثان وقول عنترة
  بنت عمراغيرشا كرنعمق • والكفر فخبئة لنفس المنعم
  أى مفدة ويقال فلان نلحبشة كما يقال زنية ويقال فى النداء ياخبث كما يقال بالكع زيد
  باخبيث وللم رأة يا خبناث بنى على الكسر مثل بالكاع وخبث الحديد وغيره مانفاه الكير
  والاخبثان البول والفائط خرث) الخرتى أناث البيت وأسقاطه خنث
  الاعنات
