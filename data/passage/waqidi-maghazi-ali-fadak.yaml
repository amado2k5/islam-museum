label: { ar: "سرية علي بن أبي طالب إلى بني سعد بفدك", en: "Sariyya of Ali ibn Abi Talib to Banu Sa'd at Fadak", es: "Sariyya de Ali ibn Abi Talib a Banu Sa'd en Fadak", fr: "Sariyya d'Ali ibn Abi Talib à Banu Sa'd à Fadak", ur: "فدک میں بنو سعد سے علی ابن ابی طالب کی ساریہ" }
text: "بعث رسول الله عليا في مائة رجل إلى حي سعد بفدك، وبلغ رسول الله أن لهم جمعا يريدون أن يمدوا يهود خيبر"
summary:
  ar: "في أثناء غزوة خيبر، بعث النبي علي بن أبي طالب في مائة رجل إلى بني سعد بفدك بعد أن بلغه جمع يريدون مد يهود خيبر، فأخذ عينا لهم فأقر أن وراءه جمعا، فهدم حصونهم على رؤوسهم حتى أسلموا. ويسوق الواقدي الخبر بأسانيده، ويذكر أن النبي أعطى عليا فدكاً غنيمة على الصحيحين."
  en: "During the Khaybar campaign the Prophet sent Ali ibn Abi Talib with a hundred men to Banu Sa'd at Fadak after hearing they meant to reinforce Khaybar; Ali took their scout, who confessed to a gathering, and the forts were demolished over their heads until they submitted. Waqidi reports that Fadak was assigned to Ali as ghaneema."
  es: "Durante la campaña de Khaybar, el Profeta envió a Ali ibn Abi Talib con cien hombres a Banu Sa'd en Fadak tras enterarse de que pretendían reforzar Khaybar. Ali llevó consigo a su explorador, quien confesó la existencia de una reunión, y las fortalezas fueron demolidas sobre sus cabezas hasta que se sometieron. Waqidi relata que Fadak fue asignada a Ali como ghaneema."
  fr: "Durant la campagne de Khaybar, le Prophète envoya Ali ibn Abi Talib avec une centaine d'hommes à Fadak, auprès des Banu Sa'd, après avoir appris qu'ils comptaient renforcer Khaybar. Ali captura leur éclaireur, qui avoua tout en réunion, et les forts furent démolis sous leurs yeux jusqu'à leur reddition. Waqidi rapporte que Fadak fut confié à Ali comme ghaneema (chef de garnison)."
  ur: "خیبر کی مہم کے دوران نبی نے علی ابن ابی طالب کو سو آدمیوں کے ساتھ فدک میں بنو سعد کے پاس بھیجا جب یہ سن کر کہ ان کا مقصد خیبر کو مضبوط کرنا تھا۔ علی نے اپنے اسکاؤٹ کو لے لیا، جنہوں نے ایک اجتماع میں اعتراف کیا، اور قلعے ان کے سروں پر گرائے گئے جب تک کہ وہ تسلیم نہ کریں۔ واقدی نے بتایا ہے کہ فدک علی کو غنیمہ کے طور پر تفویض کیا گیا تھا۔"
