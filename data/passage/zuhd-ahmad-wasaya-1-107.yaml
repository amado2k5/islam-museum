text: "… والمرض المزمن وهو من لا تربح عليه في دين ولا دنيا ومع ذلك فلابد أن تخسر عليه الدين والدنيا أو أحدهما، فهذا إن مكنت منك مخالطته واتصلت فهي مرض الموت المخوف، ومنهم من مخالطته كوجع الضرس يشتد ضربه عليك فإذا …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 107، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 107, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 107 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
