text: "نوادر جحا الكبرى وهنا مِزْحاض جاء ببنَّاءٍ ليبني له داراً، فأخذ الرجل يشير عليه ويقول له: نبني هنا غرفة، وهنا إيواناً، وهناك بيت مؤونة، وأخذ يطلع وينزل من الطابق العلوي إلى السفلي، وفيما هو كذلك خرج منه ريح فقال له …"
summary:
  ar: "سأل بنّاء جحا أين يضع الغرف، فلما أطلق جحا ريحًا وهو يصعد وينزل قال أن يبني هنا مرحاضًا أيضًا. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  en: "A builder asks Juha where to place rooms; when Juha breaks wind while going up and down, he says to build a latrine here too. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  ur: "ایک معمار نے جحا سے پوچھا کہ کمرے کہاں بنائے؛ جحا اوپر نیچے آتے جاتے ہوا خارج کرنے لگا تو اس نے کہا کہ یہاں بیت الخلا بھی بنا دو۔ {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  fr: "Un maçon demande à Juha où placer les pièces ; quand Juha lâche un vent en montant et en descendant, il dit de construire aussi des latrines ici. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  es: "Un albañil pregunta a Juha dónde colocar las habitaciones; cuando Juha suelta una ventosidad al subir y bajar, dice que se construya aquí también una letrina. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
