text: "… الثلاثةَ أهلكَتْ مالي وكنت بهنَّ قِدْمًا مُولَعا الراحُ واللحم السَّمينُ وأَطَّلِي بالزعفرانِ فلن أزال مُوَلَّعَا قال: ويقال : أتاني كلُّ أسودَ منهم وأَحْمَرَ، ولا يقال :، أبيض. يحكيها عن أبي عمرو بن العلاء، معناه : جميعُ الناس عربُهم وعَجَمُهُمْ، قال …"
