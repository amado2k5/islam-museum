text: |-
  قوله وتق ن أيضا فى نسخة وابن
  تقن رجل وهو موافق لظاهر
  الرجز وأمثال الميدانى وعبارة
  القاموس والتقن بالكر
  ٣٦٠
  والتبان الذى يبيع التين وتبان ان جعلته فعالا من التبن صرفته وان جعلته فعلان من التب
  لم تصرفه والتبان بالضم والتسديد سراويل صغيرمة دارشبريسة العورة المغلفظة فقط
  يكون للملاحين وفى حديت عار أنه على فى تبان وقال انى عمثون ⁦(تقن)⁩. اتقان الامر
  ١- كاءه ورجل تقن بكسر التاء حاذف وتقن أيضا اسم رجل كان جيد الرفى يضرب بد انتل
  وقال * يرمى بها أرمى من ابن تقن • ويقال الفصاحة من تقنه أى من سوسه وطبعه
  ن التلنة بالضم وتشديد المون والتلنة الحاجة يقال لى قبلت تلنة وتلثة أيضابق
  التساء وضمها قال اين السكيت لى فيهم تلنة وتلثة أى ليت الاصحعى بقال تلان فى معنى
  الآن وأنشد
  تولى قبل نأى دارى بحانا * وصلبنا كمازعمت تلانا
  قال أبو عبيد أصله لان زيدت عليها تاهكمازيدت فى تحين(تنن التنّ بالكسر الحتن يقال
  فلان تن فلان وهما تنان قال ابن السكيت أى همامستويان فى عقل أوضعف أوشدّة
  أومروأة وأقنّ المرض الصىّ اذاقصه فهولا يشبّ والتنين ضرب من الحيات والتنين موضع
  فى السماء (تين التيرهذا الذى يؤكل رطبا ويابسا الواحدة تينة وقوله تعالى والتي
  والزيتون قال ابن عباس رذى الّه عنهما هوتينكم وزيتونكم هذا ويق ال هماجبلان بالشأم
  صل الت ين) ثينت الثوب أثينه نينا وثبانا اذا ثنيت طرفه وخطته مثل خبنت
  والثبان بالكسروعاء حو أن تعطف ذيل قيص فتجعل فيه شيأ تقول منه تثبنت الشى على
  نفعات اذا جعلته فيه وجلته بين يديك وكذلك اذ الففت عليه حجزة سراويلك من قدام
  تن متن اللحم بالكسر أنتن مثل ثات يقال منه ثثنت لئته قال * ولثة قد ثثنت مسذهه
  ⁦( خن)⁩ تخن الشئ ثخانة أى غلظ وصلب فهو ثخين ورجل نخين السلاح أى شالا
  وأَنخنته الجراحسة أوهنته ويقال أنخن فى الارض قتلااذا أكثر وقول الاعشى
  تهل فى الحرب -ق اتخن • أصل انتخن فأدغم دن ثدن اللحم بالكسر تغيرات راحته
  والثدن الرجل الكثير اللحم وكذلك المثدن بالتشديد قال ابن الزبير يفضل محمد ين عروان
  على عبد العزيز
  لا تجعلن مندناذاسرّة • ضخماسرادقه وطى المركب
  وفى حديت ذى الثدية انه مندن اليدقيل معناه مخدج قال أبو عبيدان كان كماقيسل انه من
  التندوة تشبيه اله به فى القصر والاجتماع فالقياس أن يقال انه مثند الا أن يكون مقلوبا
  تفن انفنة احدة ف البعي مايع لى الض أعضه است
  كاركبتين وغيرهما قال التجاج
  خوى على مستويات خس • كركرة وثفنات ملس
  واه ذاقيل لعبد اللّٰه بن وهب الراسى رئيس الخوارج ذو الثفنات لان طول السجود كان قد
  ترفى ثفناته وثافنت فلانا جالسته ويقال اشتقاقه من الاوّل كانك ألصقت ثفنة ركبتك
  ثفنة ركبته ويقال أيضانافنت الرجسل على الشئ اذا أعنته علميه وثف ن المزادة جوانيها
  لخروزة وثفنته الثاقة تثفته بالكسر تففاضر بته بثفناتها وثفنت يده بالكسرتثة ن ثفنا
  لمظت وأثفن العمل يده كن السكنة بالضم السرب من الحمام وغيره والجمع السكن
  يسافع ورقا جونية • ليدركها فى حام شكن
  ويقال
