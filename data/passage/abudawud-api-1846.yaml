label: { ar: "سنن أبي داود 1846 — الأب والأبوة", en: "Sunan Abi Dawud 1846 — the father and fatherhood", ur: "سنن ابی داؤد 1846 — باپ اور والدیت", es: "Sunan Abi Dawud 1846 — El padre y la paternidad", fr: "Sunan Abi Dawud 1846 — Le père et la paternité", tr: "Sunan Abi Davud 1846 — Baba ve Babalık", id: "Sunan Abi Dawud 1846 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، سُئِلَ النَّبِيُّ عَمَّا يَقْتُلُ الْمُحْرِمُ مِنَ الدَّوَابِّ فَقَالَ \" خَمْسٌ لاَ جُنَاحَ فِي قَتْلِهِنَّ عَلَى مَنْ قَتَلَهُنَّ فِي الْحِلِّ وَالْحَرَمِ الْعَقْرَبُ وَالْفَأْرَةُ وَالْحِدَأَةُ وَالْغُرَابُ وَالْكَلْبُ الْعَقُورُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1846، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1846 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1846، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1846 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud n° 1846 (Les Rites du Hajj [Kitab Al-Manasik Wa'l-Hajj]) mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 1846 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1846, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
