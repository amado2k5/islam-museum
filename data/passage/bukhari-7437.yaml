label:
  ar: "البخاري 7437 — رؤية الله يوم القيامة وآخر من يدخل الجنة"
  en: "Bukhari 7437 — Seeing God on the Day of Resurrection, and the last to enter Paradise"
  ur: "بخاری 7437 — قیامت کے دن اللہ کا دیدار اور جنت میں سب سے آخر میں داخل ہونے والا"
text: "هل تضارون في القمر ليلة البدر . قالوا لا يا رسول الله. قال فهل تضارون في الشمس ليس دونها سحاب . قالوا لا يا رسول الله. قال فإنكم ترونه كذلك، يجمع الله الناس يوم القيامة فيقول من كان يعبد شيئا …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7437: رؤية الله يوم القيامة وآخر من يدخل الجنة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7437: Seeing God on the Day of Resurrection, and the last to enter Paradise. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7437: قیامت کے دن اللہ کا دیدار اور جنت میں سب سے آخر میں داخل ہونے والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
