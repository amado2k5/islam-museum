label:
  ar: "البخاري 6408 — ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم"
  en: "Bukhari 6408 — Angels seek the gatherings of remembrance"
  ur: "بخاری 6408 — فرشتے ذکر کی مجلسیں تلاش کرتے ہیں"
text: "إن لله ملائكة يطوفون في الطرق، يلتمسون أهل الذكر، فإذا وجدوا قوما يذكرون الله تنادوا هلموا إلى حاجتكم. قال فيحفونهم بأجنحتهم إلى السماء الدنيا. قال فيسألهم ربهم وهو أعلم منهم ما يقول عبادي قالوا يقولون يسبحونك، ويكبرونك، ويحمدونك ويمجدونك. قال …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6408: ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6408: Angels seek the gatherings of remembrance. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6408: فرشتے ذکر کی مجلسیں تلاش کرتے ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
