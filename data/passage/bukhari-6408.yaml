label:
  ar: "البخاري 6408 — ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم"
  en: "Bukhari 6408 — Angels seek the gatherings of remembrance"
  ur: "بخاری 6408 — فرشتے ذکر کی مجلسیں تلاش کرتے ہیں"
  es: "Bukhari 6408 — Los ángeles buscan las reuniones de recuerdo"
  fr: "Bukhari 6408 — Les anges recherchent les rassemblements du souvenir"
  tr: "Buhari 6408 — Melekler Allah'ı zikredenleri ararlar: Onlar, arkadaşlarının mutsuz olmayacağı insanlardır."
  id: "Al-Bukhari 6408 — Malaikat mencari orang-orang yang mengingat Allah: Mereka adalah orang-orang yang teman-teman mereka tidak akan sengsara."
text: "إن لله ملائكة يطوفون في الطرق، يلتمسون أهل الذكر، فإذا وجدوا قوما يذكرون الله تنادوا هلموا إلى حاجتكم. قال فيحفونهم بأجنحتهم إلى السماء الدنيا. قال فيسألهم ربهم وهو أعلم منهم ما يقول عبادي قالوا يقولون يسبحونك، ويكبرونك، ويحمدونك ويمجدونك. قال …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 6408: ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 6408: Angels seek the gatherings of remembrance. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 6408: فرشتے ذکر کی مجلسیں تلاش کرتے ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 6408: Los ángeles buscan las reuniones del recuerdo. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 6408: Les anges recherchent les lieux de recueillement. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 6408: Malaikat mencari orang-orang yang mengingat Allah: mereka adalah orang-orang yang kehadirannya tidak mendatangkan kesengsaraan bagi orang-orang yang duduk bersama mereka. Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun koleksi hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
