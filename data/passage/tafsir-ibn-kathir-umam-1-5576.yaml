text: "… خَيْر. أولا - الملل والأديان: اليهود: هم حملة التوراة.... النصارى: معروفون، وهم حمَلة الإنجيل. الصابئون: طائفة بين النصارى والمجوس، ليس لهم دين. الصابئون: أظهر الأقوال: أنهم قوم ليسوا على دين اليهود ولا النصارى ولا المجوس ولا المشركين، وإنما هم قوم …"
