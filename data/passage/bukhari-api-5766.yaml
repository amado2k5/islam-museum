text: "… قَالَ \" جَاءَنِي رَجُلاَنِ، فَجَلَسَ أَحَدُهُمَا عِنْدَ رَأْسِي وَالآخَرُ عِنْدَ رِجْلَىَّ، ثُمَّ قَالَ أَحَدُهُمَا لِصَاحِبِهِ مَا وَجَعُ الرَّجُلِ قَالَ مَطْبُوبٌ. قَالَ وَمَنْ طَبَّهُ قَالَ لَبِيدُ بْنُ الأَعْصَمِ، الْيَهُودِيُّ مِنْ بَنِي زُرَيْقٍ. قَالَ فِيمَا ذَا قَالَ فِي مُشْطٍ وَمُشَاطَةٍ، وَجُفِّ طَلْعَةٍ ذَكَرٍ. قَالَ فَأَيْنَ هُوَ قَالَ فِي بِئْرِ ذِي أَرْوَانَ \". قَالَ فَذَهَبَ النَّبِيُّ فِي أُنَاسٍ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5766، يذكر الطب والطبيب، والوجع. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5766 (Medicine), that mentions medicine and the physician, pain. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5766، جس میں طب اور طبیب، درد کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
