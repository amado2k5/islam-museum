text: |-
  ⁦(فصل الواو)⁩
  EIR
  أى خفت وإنى منه لا وجرمثل لأوجل ولا يقال فى المؤتت وجراء ولكن وجرة والوجار
  سرب الضبع ووجرة موضع قال امر والقيس
  تصد وتعدى عن أسيل وتتقى • بناظرة من وحش وجرة مطفل
  قال الاصعى وجرة بين مكة والبصرة وهى أربعون مسلاليس فيها منزل فهى مرت لاوحسر
  ( ⁦(ر%)⁩e الوحرة بالتحريك دويبة حراء تلزق بالارض كالعظاء والجمع وحروالور أيضا
  فى الصدر مثل الغل وفى الحديث يذهب بوحر الصدر وقد ووصدره على أى وغروفى صدره
  على وحربالتسكين مثل وغروهواسم والمصدربالتصريك ذر ، الوذرة بالتسكين الفدرة
  وهى القطعة من اللحم ومنه قولهم يا ابن شامّة الوذرة وهى كلة قدف وكانت العرب تنساب
  بها كما كانت تنساب بقولهم يا ابن ملقى اد-ل الركبان ويا ابن ذات الرايات ونحوها والجمع
  وذر مثل ترة وترووذرت اللحم توذير اقطعته وكذلك الجرح اذا شرطته وتقول ذره أى دعه
  وهو يذره أى يدعه وأصله وذره يذره مثل وسعه يسعه وقد أميت صدره ولا يقال وذره
  ولا واذرواكن تركه وهو تارك ⁦( وزر)⁩ الوزر الملجأوأصسل الوزر الجبل والوزرالائم
  والثقل والكارة والسلاح قال الشاعر
  وأعددت للحرب أوزارها * رماحاطوالاوخيلاذ كورا
  والوزير الموازر كالأ كيل المواكل لانه يحمل عنه وزره أى ثقله والوزارة لغة فى الوزارة
  وقد استوزرفلان وهو يوازر الاميرو يتوزرله واتزر الرج-ل ركب الوزر وهو افتعل منه
  وقوله تعالى ولا تزر وازرة وزر أخرى أى لا تحمل حاملة حسل أخرى وقال الاخفش لا تأتم
  آغمة باثم أخرى قال تقول منه وزر يوزر ووزريز رووزريوزرفهوموزورواغاقال فى الحديث
  مأزورات لمكان مأجورات ولو أفردلقال موزورات أبوعم رووزرت الشى أحرزته ووزرت
  فلانا غليته وقال قدوزرت جلتها أمهارها، شر شرت الحشبة بالميشار غيرمه-موز
  لغة فى أشرت والوشر أيضا أن تحدّد المرأة أسنانها وترققها وفى الحديث لعن اللّٰه الواشرة
  والمؤتشرة ص لوصراغة فى الاصروه والعهد كما قالوا ارث وورث واسادة ووسادة
  والوصر الص وكتاب العهدة وفى الحديثان هذا اشترى مى أرضا وقبض مى وصرها
  فسلاهويرد علىّ الوصر ولا يعطيف النمن ⁦(وضر)⁩، الوضر الدون والدميم يقال وضرت
  القصعة بوضر وضر اأى دسحت قال الشاعر
  سيغنى أبا الهندى عن وطب سالم * أباديق لم يعلق بها وضر الزبذ
  قال أبوعمر والوضر مايشمه الانسان من رمح يجده من طعام فاسد أبو عبيدة يقال لبقية
  الهناء وغبره الوضر ⁦(وطر)⁩ الوطر الحاجة ولا يبنيى منه فعل والجمع الاوطار
  ⁦( دعر)⁩. جبل وعر بالتسكين ومطلب وعر قال الاصمعى ولا تقل وعر وقد وعر بالضم وعورة
  وكذلك توعر أى صاروع راووعرته أنا توعيرا وقد استوعرت الشى وجدته وعراوفلان وعر
  المعروف أى قليله وأوعره قلله بقمال قليل وعرووتح ووعراتباع له ⁦(وغر)⁩ الوغرة شدّة
  توقد الحرّومنه قيل فى صدره على وغر بالتسكين أى ضغن وعداوة وتوقد من الغيظ والمصدر
  ١٠٤
  محاح
  وزر الأول كعلم والثانى كوعذ
  والثالث للمجهول كما فى الترجتين
