text: "الجزء الخامس من كتاب الإبانة عن شريعة الفرقة الناجية ومجانبة الفرق المذمومة. وهو الأول من الإيمان. وفيه ثمانية أبواب : باب معرفة الإيمان وكيف نزل به القرآن وترتيب الفرائض وأن الإيمان قول وعمل. باب معرفة اليوم الذي نزلت فيه هذه …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 624، يذكر ما عُدّ من الإيمان، وزيادة الإيمان ونقصانه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 624, that mentions what is counted as part of faith, faith increasing and decreasing; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 624 کا اقتباس جس میں جو ایمان میں سے گنا گیا، ایمان کا بڑھنا اور گھٹنا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
