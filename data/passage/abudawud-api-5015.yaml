label: { ar: "سنن أبي داود 5015 — الأب والأبوة", en: "Sunan Abi Dawud 5015 — the father and fatherhood", ur: "سنن ابی داؤد 5015 — باپ اور والدیت", es: "Sunan Abi Dawud 5015 — El padre y la paternidad", fr: "Sunan Abi Dawud 5015 — le père et la paternité", tr: "Sunan Abi Dawud 5015 — Baba ve Babalık", id: "Sunan Abi Dawud 5015 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ سُلَيْمَانَ الْمِصِّيصِيُّ، لُوَيْنٌ حَدَّثَنَا ابْنُ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ عُرْوَةَ، وَهِشَامٍ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ،ا قَالَتْ كَانَ رَسُولُ اللَّهِ يَضَعُ لِحَسَّانَ مِنْبَرًا فِي الْمَسْجِدِ فَيَقُومُ عَلَيْهِ يَهْجُو مَنْ قَالَ فِي رَسُولِ اللَّهِ فَقَالَ رَسُولُ اللَّهِ \" إِنَّ رُوحَ الْقُدُسِ مَعَ حَسَّانَ مَا نَافَحَ عَنْ رَسُولِ اللَّهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5015، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5015 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5015، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5015 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 5015 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 5015 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 5015, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
