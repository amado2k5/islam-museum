text: "… حَدَّثَنَا أَبُو الْمَلِيحِ، عَنْ مُحَمَّدِ بْنِ خَالِدٍ، - قَالَ أَبُو دَاوُدَ قَالَ إِبْرَاهِيمُ بْنُ مَهْدِيٍّ السُّلَمِيُّ - عَنْ أَبِيهِ، عَنْ جَدِّهِ، وَكَانَتْ، لَهُ صُحْبَةٌ مِنْ رَسُولِ اللَّهِ قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ الْعَبْدَ إِذَا سَبَقَتْ لَهُ مِنَ اللَّهِ مَنْزِلَةٌ لَمْ يَبْلُغْهَا بِعَمَلِهِ ابْتَلاَهُ اللَّهُ فِي جَسَدِهِ أَوْ فِي مَالِهِ أَوْ فِي وَلَدِهِ \". …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3090، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3090 (Funerals (Kitab Al-Jana'iz)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3090، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
