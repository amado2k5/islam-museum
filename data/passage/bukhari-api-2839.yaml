label: { ar: "صحيح البخاري 2839 — الأب والأبوة", en: "Sahih al-Bukhari 2839 — the father and fatherhood", ur: "صحیح بخاری 2839 — باپ اور والدیت", es: "Sahih al-Bukhari 2839 — El padre y la paternidad", fr: "Sahih al-Bukhari 2839 — le père et la paternité" }
text: "… حَدَّثَنَا حَمَّادٌ ـ هُوَ ابْنُ زَيْدٍ ـ عَنْ حُمَيْدٍ، عَنْ أَنَسٍ ـ أَنَّ النَّبِيَّ كَانَ فِي غَزَاةٍ فَقَالَ \" إِنَّ أَقْوَامًا بِالْمَدِينَةِ خَلْفَنَا، مَا سَلَكْنَا شِعْبًا وَلاَ وَادِيًا إِلاَّ وَهُمْ مَعَنَا فِيهِ، حَبَسَهُمُ الْعُذْرُ \". وَقَالَ مُوسَى حَدَّثَنَا حَمَّادٌ، عَنْ حُمَيْدٍ، عَنْ مُوسَى بْنِ أَنَسٍ، عَنْ أَبِيهِ، قَالَ النَّبِيُّ. قَالَ أَبُو عَبْدِ اللَّهِ الأَوَّلُ أَصَحُّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2839، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2839 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2839، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2839 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2839 (Le Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
