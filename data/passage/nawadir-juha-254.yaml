text: "… اللَّهُ يعلم قلب مَن يحترق دعاهُ صديقٌ له إلى داره، فأكرمه بعسل وقشطة. وبعد أن أتمَّ الأكل بالخبزِ، أخذ يلعق العسل بأصبعه لعقاً متوالياً، فقال له صاحب الدار : إنَّ أكل العسل بلا خبزٍ يحرق القلب. فأخذ الشيخ يزيد في …"
summary:
  ar: "قدم صديق عسلاً وقشدة فلحس جحا العسل بلا خبز، فقال المضيف إن أكل العسل بلا خبز يحرق القلب، فقال جحا إن الله يعلم قلب من يحترق ولحس أسرع. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  en: "A friend serves honey and cream, and Juha licks the honey without bread. The host says eating honey without bread burns the heart, and Juha says, 'God knows the heart of the one who burns,' and licks faster. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  ur: "ایک دوست شہد اور بالائی پیش کرتا ہے اور جحا روٹی کے بغیر شہد چاٹتا ہے۔ میزبان کہتا ہے کہ روٹی کے بغیر شہد کھانا دل کو جلاتا ہے، تو جحا کہتا ہے: اللہ جلنے والے کا دل جانتا ہے، اور مزید تیزی سے چاٹنے لگتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  fr: "Un ami sert du miel et de la crème, et Juha lèche le miel sans pain. L'hôte dit que manger du miel sans pain brûle le cœur, et Juha dit : « Dieu connaît le cœur de celui qui brûle », et lèche plus vite. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  es: "Un amigo sirve miel y crema, y Juha lame la miel sin pan. El anfitrión dice que comer miel sin pan abrasa el corazón, y Juha dice: «Dios conoce el corazón del que se abrasa», y lame más rápido. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
  tr: "Bir arkadaşı Juha'ya bal ve krema ikram etti ve Juha ekmek yemeden balı yaladı. Ev sahibi, ekmek yemeden bal yemenin kalbi yaktığını söyledi; Juha ise \"Kimin kalbinin yandığını Allah bilir\" diyerek daha da hızlı yalamaya devam etti. {cite:juha-nawadir-kubra-djuwaydi s. 124}"
  id: "Seorang teman menawarkan madu dan krim kepada Juha, dan dia menjilat madu itu tanpa roti. Tuan rumah berkata bahwa makan madu tanpa roti membakar hati, yang kemudian dijawab Juha bahwa Tuhan tahu hati siapa yang terbakar, dan dia menjilat lebih cepat lagi. {cite:juha-nawadir-kubra-djuwaydi p. 124}"
