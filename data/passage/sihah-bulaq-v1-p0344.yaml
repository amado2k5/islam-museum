text: |-
  ⁦(جشعر)⁩
  ٢٩٧
  ومقل اسقتموه فأثرى • مائة من عطائكم جرجورا
  والحرجارنيت طيب الريح والجرجر بالمكسر الفول والحرجير بقل ⁦(جزر)⁩ الجزوز من
  الابل يقسع عسلى الذكر والانى وهى تؤنث والجمع الجزر والجزارة أطراف البعير اليدان
  والرحلان والرأس سميت بذلك لانّ الجزار يأخذها فهى جزارته كما بقال أخذ العامل عمالته
  فاذا قالوافرس عبسل الجزارة فاغمايراد غلظ البدين والرجلين وكثرة عصبه-ما ولا يدخل
  الرأس فى هذا لات عظم الرأس هجنة فى الخيل وجزر السباع اللحم الذى تأكله يقال تركوهم
  جزرا بالتحريك اذاقتلوهم والجزر أيضاهذه الارومة التى تؤكل قال الاصعى الواحدة
  جزرة والجزرة أيضا الشاء السمينة الواحدة جزرة قال ابن السكيت يقال أجزرت القوم
  اذا أعطيتهم شاة يذبحونها نعجة أوكبشا أوعنزا قال ولا تكون الجزرة الامن الغنم
  ولا يقال أجزرتهم ناقة لانها قد تصلح لغير الذيح قال الفترّاء يقال جزر وجز ر للذى يؤكل
  ولا يقال فى الشاء الا الجزر بالفتح والجزيرة واحدة جزائر البحرسميت بذلك لانقطاعها عن
  معظم الارض والجزيرموضع بعينه وهو مابين دجلة والفرات وأماجزيرة العرب فان
  أباعبيدة يقول هى مابين حف-رأبى موسى الاشعرى الى أقصى اليمن فى الطول وفى العرض
  مابين رمل يبرين الى منقطع السماوة وجزرت النخل أجزره بااكسر جز راصر مته وقد أجزر
  النخل أى أصرم وأجزر البعيرحان له أن يجزر وكان قسيان يقولون لشيخ أجزرت ياشيخ أى
  حان لك أن تموت فيقول أى بى وتختضرون أى تمولون شبابا ويروى أجززت من أجزالبرّ
  اذا حان له أن يجزوجزرت الجزور أجزرها بالضم واجتزرتها اذا نحرتها وجلدتها والمجزربكسر
  الزاى موضع جزرها وفى الحديث عن عم ررضى اللّٰه عنه اياكم وهذه المجازرفان لها ضراوة
  كسراوة الحر قال الاصمعى بعنى ندىّ القوم لان الجزورانى قهر عند جع الناس وجزر
  الماء يجزر ويجز رجزرا أى نضب والجزرخلاف المدّوهورجوع الماءالى خلف ⁦( جسر)⁩
  لجسر واحد الجسور التى يعبر عليها والجسر بالفتح العظيم من الابل وغيرها والانثى جسرة
  قال ابن مقسل هو با«موضع رحلها جسر( وحسر على كذا يجسر حارة وتجاس
  عليه أى أقدم والجور المقدام (Üجشر€ ⅜⅜ حشر الصبح يحشر جشورا انفاق
  واصطيحما الحاشرية وهو شرب يكون مع الصبح ولا يتصرّف له فعل وقال
  اذا ماشر بنا الحاشرية لم نبل • أميراوان كان الاضير من الازد
  وأما الجاشرية التى فى شه ر الاعشى فهى قبيلة من قبائل العرب قال الاصعى يقمال أصبح
  بنوفلان جشرا اذا كانوا يبيتون مكانهم فى الابل لايرجعون الى بيوتهم قال الاخطل
  فسلد الصبرون غسان اذحضروا * والحزن كيف قراه الغملمة الجشر
  قال وكذلك مال حشريرعى فى مكانه لا يربع الى أهله قال يقال جشر نادوا بنا أخرجماها
  الى الرمى نجشرها حشْرا بالاسكان ولا تروح وخيل مجشرة بالجمى أى مرعية ويقال به جشرة
  بالضم أى سعال أو خشونة فى الصدرو بعير محشوربه سعال حاز وقد حشر يجشر على مالم.
  يسم قاعله قال الشاعر رب هم جشمته فى هواكم وبعير منقه مجشور
  والحشر الجوالق الضخم والجسير الوفضة وحشر الساحل بالكسر يجشر حشرا اذا خِشن
  مصاح
