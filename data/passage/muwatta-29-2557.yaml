summary:
  ar: "قال مالك: فقتل العمد عندنا أن يعمد الرجل إلى الرجل فيضربه حتى تفيظ نفسه. ومن العمد أيضا أن يضرب الرجل الرجل في النائرة تكون بينهما، ثم ينصرف عنه وهو حي، فينزى في ضربه فيموت، فتكون في ذلك القسامة. {cite:muwatta-maruf-1997 p.445}"
