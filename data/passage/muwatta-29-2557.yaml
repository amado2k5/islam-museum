label: { ar: "الموطأ 2557 — مالك: صور قتل العمد، ومنها الضرب في النائرة ثم الموت بعد الانصراف", en: "Muwatta 2557", es: "Muwatta 2557", fr: "Muwatta 2557", ur: "موطا 2557", tr: "El-Muvatta 2557 — Malik: Kasıtlı öldürme biçimleri, cinsel organlara vurmayı ve ardından olay yerinden ayrıldıktan sonra ölümü de içerir.", id: "Al-Muwatta 2557 — Malik: Bentuk-bentuk pembunuhan yang disengaja, termasuk memukul alat kelamin dan kemudian menyebabkan kematian setelah meninggalkan korban." }
summary:
  ar: "قال مالك: فقتل العمد عندنا أن يعمد الرجل إلى الرجل فيضربه حتى تفيظ نفسه. ومن العمد أيضا أن يضرب الرجل الرجل في النائرة تكون بينهما، ثم ينصرف عنه وهو حي، فينزى في ضربه فيموت، فتكون في ذلك القسامة. {cite:muwatta-maruf-1997 p.445}"
  tr: "Malik şöyle demiştir: Bizim görüşümüze göre kasten öldürme, bir adamın başka bir adamı kasten vurarak öldürmesi durumunda gerçekleşir. Ayrıca, bir adam aralarında çıkan bir tartışma sırasında başka bir adama vurup, ilk adam hâlâ hayattayken oradan ayrıldığında ve ikinci adam ona vurmaya devam edip öldüğünde de kasten öldürme söz konusudur. Bu durumda, af yemini (kasama) geçerlidir. {cite:muwatta-maruf-1997 s.445}"
  id: "Malik berkata: Pembunuhan yang disengaja, menurut mazhab kami, terjadi ketika seseorang dengan sengaja memukul orang lain hingga meninggal. Hal itu juga terjadi ketika seseorang memukul orang lain selama perselisihan di antara mereka, kemudian pergi sementara orang pertama masih hidup, dan orang kedua terus memukulnya hingga meninggal. Dalam kasus ini, sumpah penyucian (qasama) berlaku. {cite:muwatta-maruf-1997 p.445}"
