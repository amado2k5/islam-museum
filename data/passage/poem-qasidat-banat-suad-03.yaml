text: مهلاً هداك الذي أعطاك نافلةَ القرآنِ فيه مواعيظٌ وتفصيلُ
summary:
  ar: يخاطب كعبٌ النبيَّ مستمهلاً، ويذكر القرآن عطيةً فيها مواعظ وتفصيل {{cite:ibn-hisham-wustenfeld-1858 p.891}}.
  en: Ka'b asks the Prophet for patience and names the Qur'an as the gift God gave him, containing admonitions and detail.
  es: "Ka'b pide paciencia al Profeta y nombra al Corán como el regalo que Dios le dio, que contiene advertencias y detalles."
  fr: "Ka'b demande au Prophète de faire preuve de patience et cite le Coran comme le don que Dieu lui a fait, contenant des admonitions et des détails."
  ur: "کعب نے پیغمبر سے صبر کی درخواست کی اور قرآن کا نام خدا کے تحفے کے طور پر رکھا، جس میں نصیحتیں اور تفصیل ہے۔"
translations:
  en:
    text: 'Gently, may He who gave you the Qur''an as a gift guide you: in it are admonitions and detail.'
