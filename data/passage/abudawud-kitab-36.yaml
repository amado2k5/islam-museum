summary:
  ar: "القسم 36 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الخاتم»، ويضم فيها النصوص من 4214 إلى 4239 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 36 of Sunan Abi Dawud (Signet-Rings (Kitab Al-Khatam)) in the division of the open hadith dataset the museum took its reports from: reports 4214 to 4239 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 36، عنوان «کتاب الخاتم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4214 تا 4239۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 36 de Sunan Abi Dawud (Signet-Rings (Kitab Al-Khatam)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4214 al 4239 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 36 du Sunan Abi Dawud (Signet-Rings (Kitab Al-Khatam)) correspond aux hadiths 4214 à 4239, selon la numérotation du recueil ouvert utilisé par le musée. Le musée conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 36. bölümü, açık hadis veri tabanında yer almakta olup \"Mühür Kitabı\" başlığını taşımaktadır. Bu bölümde 4214'ten 4239'a kadar olan metinler, sırasıyla numaralandırılmıştır. Müze, bu metinlere ait kayıtlarını bu kitap altında toplamaktadır."
  id: "Bagian 36 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi basis data hadits terbuka dan diberi judul \"Kitab Segel\". Bagian ini berisi teks 4214 hingga 4239, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah kitab ini."
