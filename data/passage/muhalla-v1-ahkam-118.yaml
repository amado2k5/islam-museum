text: "… ءَامَنُوا أَطِيعُوا الَّهَ وَأَطِيعُوا الرَّسُولَ وَأُوْلِ الْأَمْيِ مِنكُمْ يُبَيِّنُ المصادرَ الثلاثةَ للتشريعِ التي هي الأصولُ، وهي الكتابُ والسنةُ والإجماعُ، ويتفرَّعُ عنها الدليلُ الذي تتلاقي الأصولُ الثلاثةُ في بيانِه، وتكونُ طاعةُ اللهِ بالرجوعِ إلى القرآنِ، وطاعةُ الرسولِ بالرجوعِ إلي السنةِ، وطاعةُ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 118، يرد فيه ذكر طاعة الله ورسوله، ومن أطاع الله ورسوله، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 118, whose wording mentions obedience to God and His Messenger, whoever obeys God and His Messenger, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 118 کا اقتباس جس میں اللہ اور اس کے رسول کی اطاعت، جس نے اللہ اور اس کے رسول کی اطاعت کی، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 118, dont le texte mentionne l'obéissance à Dieu et à Son Messager, celui qui obéit à Dieu et à Son Messager, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 118, cuyo texto menciona la obediencia a Dios y a Su Mensajero, quien obedece a Dios y a Su Mensajero, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hazm'ın El-Muhalla adlı eserinin 1. bölümünün 118. sayfasından, Allah'a ve Resulüne itaati, Allah'a ve Resulüne itaat edenleri ve itaatin kendisini ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu metin, farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Muhalla karya Ibnu Hazm, Bagian 1, halaman 118, yang menyebutkan ketaatan kepada Allah dan Rasul-Nya, orang-orang yang taat kepada Allah dan Rasul-Nya, dan ketaatan itu sendiri. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk perbuatan wajib, tugas, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
