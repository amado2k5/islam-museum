label: { ar: "الموطأ 1729 — يحيى عن مالك عن سعيد بن إسحاق بن كعب بن عجرة عن عمته زينب: الفريعة بنت مالك بن سنان سألت النبي أن ترجع إلى أهلها، فقال امكثي في بيتك حتى يبلغ الكتاب أجله", en: "Muwatta 1729" }
text: "امْكُني في بَيْتكِ حَتَّى يَبْلُغَ الْكِتَابُ أجَلهُ"
summary:
  ar: "يروي يحيى عن مالك عن سعيد بن إسحاق بن كعب بن عجرة عن عمته زينب بنت كعب بن عجرة أن الفريعة بنت مالك بن سنان، أخت أبي سعيد الخدري، جاءت إلى رسول الله تسأله أن ترجع إلى أهلها في بني خدرة، لأن زوجها خرج في طلب عبيد له أبقوا، فلحقهم القوم عند القدوم فقتلوه. فقال لها امكثي في بيتك حتى يبلغ الكتاب أجله. فاعتدت فيه أربعة أشهر وعشرا، فلما كان عثمان بن عفان أرسل إليها فسألها، فأخبرته، فاتبعه وقضى به. ويذكر المحقق أن أكثر الرواة يقولون «سعد بن إسحاق»، وأنه الأشهر. {cite:muwatta-maruf-1997 p.106} {cite:muwatta-maruf-1997 p.107}"
