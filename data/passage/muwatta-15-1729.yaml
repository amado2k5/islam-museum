label: { ar: "الموطأ 1729 — يحيى عن مالك عن سعيد بن إسحاق بن كعب بن عجرة عن عمته زينب: الفريعة بنت مالك بن سنان سألت النبي أن ترجع إلى أهلها، فقال امكثي في بيتك حتى يبلغ الكتاب أجله", en: "Muwatta 1729", es: "Muwatta 1729", fr: "Muwatta 1729", ur: "موطا 1729", tr: "El-Muvatta 1729 — Yahya, Malik'ten, o da Said bin İshak bin Ka'b bin Acrah'tan, o da teyzesi Zeynep'ten rivayetle: El-Feriye bint Malik bin Sinan, Peygamber'den ailesinin yanına dönmesine izin vermesini istedi ve Peygamber şöyle buyurdu: Belirlenen süre tamamlanıncaya kadar evinde kal.", id: "Al-Muwatta 1729 — Yahya, dari Malik, dari Saeed bin Ishaq bin Ka’b bin Ajrah, dari bibinya Zaynab: Al-Fari’ah bint Malik bin Sinan meminta Nabi untuk mengizinkannya kembali ke keluarganya, dan beliau bersabda: Tinggallah di rumahmu sampai masa yang ditentukan terpenuhi." }
text: "امْكُني في بَيْتكِ حَتَّى يَبْلُغَ الْكِتَابُ أجَلهُ"
summary:
  ar: "يروي يحيى عن مالك عن سعيد بن إسحاق بن كعب بن عجرة عن عمته زينب بنت كعب بن عجرة أن الفريعة بنت مالك بن سنان، أخت أبي سعيد الخدري، جاءت إلى رسول الله تسأله أن ترجع إلى أهلها في بني خدرة، لأن زوجها خرج في طلب عبيد له أبقوا، فلحقهم القوم عند القدوم فقتلوه. فقال لها امكثي في بيتك حتى يبلغ الكتاب أجله. فاعتدت فيه أربعة أشهر وعشرا، فلما كان عثمان بن عفان أرسل إليها فسألها، فأخبرته، فاتبعه وقضى به. ويذكر المحقق أن أكثر الرواة يقولون «سعد بن إسحاق»، وأنه الأشهر. {cite:muwatta-maruf-1997 p.106} {cite:muwatta-maruf-1997 p.107}"
  tr: "Yahya, Malik'ten, o da Sa'id ibn İshak ibn Ka'b ibn Ujrah'tan, o da teyzesi Zeynep bint Ka'b ibn Ujrah'tan rivayet eder ki, Ebu Sa'id el-Hudri'nin kız kardeşi el-Feriye bint Malik ibn Sinan, kocasının kaçak kölelerini aramaya çıktığını ve geri döndüklerinde halkın onu yakalayıp öldürdüğünü söyleyerek, ailesinin yanına, Beni Hatre'ye dönmesine izin vermesini isteyerek Allah'ın Resulü'ne geldi. Resulullah ona, belirlenen süre tamamlanana kadar evinde kalmasını söyledi. Böylece o da dört ay on gün bekleme süresini gözlemledi. Osman ibn Affan halife olunca onu çağırdı ve sorguladı, o da ona anlattı, bunun üzerine Osman onu takip etti ve ona göre hüküm verdi. Araştırmacı, çoğu rivayetçinin \"Sa'd ibn İshak\" dediğini ve bunun daha yaygın versiyon olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.106} {cite:muwatta-maruf-1997 s.107}"
  id: "Yahya meriwayatkan dari Malik, dari Sa'id ibn Ishaq ibn Ka'b ibn 'Ujrah, dari bibinya Zaynab bint Ka'b ibn 'Ujrah, bahwa al-Fari'ah bint Malik ibn Sinan, saudara perempuan Abu Sa'id al-Khudri, datang kepada Rasulullah meminta izin untuk kembali kepada keluarganya di Banu Khadrah, karena suaminya telah pergi mencari budak-budaknya yang melarikan diri, dan orang-orang mengejar mereka saat mereka kembali dan membunuhnya. Beliau menyuruhnya untuk tinggal di rumahnya sampai masa iddah yang ditentukan selesai. Maka ia menjalani masa iddah selama empat bulan sepuluh hari. Ketika Utsman ibn Affan menjadi Khalifah, beliau memanggilnya dan menanyainya, dan ia menjawab, maka beliau mengikutinya dan memutuskan sesuai dengan jawabannya. Peneliti menyebutkan bahwa sebagian besar perawi mengatakan \"Sa'd ibn Ishaq,\" dan bahwa ini adalah versi yang lebih umum. {kutip:muwatta-maruf-1997 hal.106} {kutip:muwatta-maruf-1997 hal.107}"
