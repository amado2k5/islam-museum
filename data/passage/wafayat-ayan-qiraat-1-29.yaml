text: "… والفقهاء والقراء والنحاة وجميع أرباب الفضائل وأعيان العدول وغيرهم من وجوه الدولة وأصحاب الحديث، فاذا فرغ من مجلسه قام الشعراء ينشدونه المدائح. وكان في داره قوم يكتبون القرآن الكريم وآخرون يكتبون كتب الحديث والفقه والأدب، حتى الطب، ويعارضون ويشكلون المصاحف …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 29، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 29, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 29 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Wafayat al-A'yan de Ibn Khallikan, volumen 1, pág. 29, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait de la Wafayat al-A'yan d'Ibn Khallikan (tome 1, p. 29), mentionnant les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 1. cildinin 29. sayfasında, Kur'an okuyucularından, Kur'an'ın derlenmesinden ve el yazmalarından bahsedilmektedir; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka) karya Ibn Khallikan, Jilid 1, halaman 29, menyebutkan para qari, penyusunan Al-Qur'an, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
