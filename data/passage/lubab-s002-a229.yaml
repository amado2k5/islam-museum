text: "الطلاق مرتان الآية أخرج الترمذي والحاكم وغيرهما عن عائشة قالت كان الرجل يطلق امرأته ما شاء أن يطلقها وهي امرأته إذا ارتجعها وهي في العدة وإن طلقها مائة مرة وأكثر حتى قال رجل لامرأته والله لا أطلقك فتبيني مني ولا آويك أبدا قالت وكيف ذلك"
