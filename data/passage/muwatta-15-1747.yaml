label: { ar: "الموطأ 1747 — يحيى عن مالك عن عبد الله بن أبي بكر عن حميد بن نافع عن زينب بنت أبي سلمة: حديث أم حبيبة في الطيب وقول النبي في الإحداد", en: "Muwatta 1747", es: "Muwatta 1747", fr: "Muwatta 1747", ur: "موطا 1747", tr: "El-Muvatta 1747 — Yahya, Malik'ten, o da Abdullah bin Ebu Bekir'den, o da Humaid bin Nafi'den, o da Zeyneb bint Ebu Seleme'den rivayet etmiştir: Ümmü Habibe'nin parfüm hakkındaki hadisi ve Peygamber'in yas tutma hakkındaki sözü", id: "Al-Muwatta 1747 — Yahya berdasarkan Malik berdasarkan Abdullah bin Abi Bakr berdasarkan Humaid bin Nafi’ berdasarkan Zainab bint Abi Salamah: Hadits Umm Habibah tentang parfum dan sabda Nabi tentang berkabung" }
text: "لاَ يَحلُّ لامْرأةٍ تُؤْمنُ بِاللهِ وَالْيَوْمِ الآخرِ أنْ تُحدَّ على مَيْتٍ فَوْقَ ثَلاثِ لَيالٍ، إلاَّا على زَوْجٍ أرْبَعةَ أشْهُرٍ وَعَشْرًا"
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن حميد بن نافع عن زينب بنت أبي سلمة أنها أخبرته هذه الأحاديث الثلاثة. قالت زينب دخلت على أم حبيبة، زوج النبي، حين توفي أبوها أبو سفيان بن حرب، فدعت بطيب فيه صفرة، فدهنت به جارية، ثم مسحت بعارضيها، ثم قالت: والله ما لي بالطيب من حاجة، غير أني سمعت رسول الله يقول: لا يحل لامرأة تؤمن بالله واليوم الآخر أن تحد على ميت فوق ثلاث ليال، إلا على زوج أربعة أشهر وعشرا. {cite:muwatta-maruf-1997 p.112}"
  tr: "Yahya, Malik'ten, o da Abdullah ibn Abi Bekr ibn Muhammed ibn Amr ibn Hazm'dan, o da Humaid ibn Nafi'den, o da Zeynep bint Abi Salame'den rivayet ederek, Zeynep'in kendisine bu üç hadisi bildirdiğini aktarır. Zeynep şöyle dedi: \"Peygamberimizin eşi Ümmü Habibe'nin yanına, babası Ebu Sufyan ibn Harb vefat ettiğinde girdim. Sarı renkli bir parfüm istedi, bir cariyeyi onunla meshetti, sonra yanaklarına sürdü ve şöyle dedi: 'Allah'a yemin ederim ki, parfüme ihtiyacım yok, ancak Allah Resulü'nün şöyle buyurduğunu işittim: 'Allah'a ve Ahiret Günü'ne iman eden bir kadının, kocası hariç, ölen bir kişi için üç geceden fazla yas tutması caiz değildir; kocası için ise dört ay on gün yas tutar.'\" {cite:muwatta-maruf-1997 s.112}"
  id: "Yahya meriwayatkan dari Malik, dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, dari Humaid ibn Nafi, dari Zaynab bint Abi Salamah, bahwa ia memberitahukan kepadanya tiga hadits ini. Zaynab berkata: Aku menemui Umm Habibah, istri Nabi, ketika ayahnya, Abu Sufyan ibn Harb, meninggal. Ia meminta parfum yang berwarna kuning, mengoleskannya pada seorang budak perempuan, lalu mengusapkannya ke pipinya, kemudian berkata: Demi Allah, aku tidak membutuhkan parfum, kecuali karena aku mendengar Rasulullah SAW bersabda: Tidak diperbolehkan bagi seorang wanita yang beriman kepada Allah dan Hari Kiamat untuk berduka atas orang yang meninggal lebih dari tiga malam, kecuali untuk suaminya, yang untuknya ia berduka selama empat bulan sepuluh hari. {cite:muwatta-maruf-1997 p.112}"
