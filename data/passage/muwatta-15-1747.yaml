label: { ar: "الموطأ 1747 — يحيى عن مالك عن عبد الله بن أبي بكر عن حميد بن نافع عن زينب بنت أبي سلمة: حديث أم حبيبة في الطيب وقول النبي في الإحداد", en: "Muwatta 1747" }
text: "لاَ يَحلُّ لامْرأةٍ تُؤْمنُ بِاللهِ وَالْيَوْمِ الآخرِ أنْ تُحدَّ على مَيْتٍ فَوْقَ ثَلاثِ لَيالٍ، إلاَّا على زَوْجٍ أرْبَعةَ أشْهُرٍ وَعَشْرًا"
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن حميد بن نافع عن زينب بنت أبي سلمة أنها أخبرته هذه الأحاديث الثلاثة. قالت زينب دخلت على أم حبيبة، زوج النبي، حين توفي أبوها أبو سفيان بن حرب، فدعت بطيب فيه صفرة، فدهنت به جارية، ثم مسحت بعارضيها، ثم قالت: والله ما لي بالطيب من حاجة، غير أني سمعت رسول الله يقول: لا يحل لامرأة تؤمن بالله واليوم الآخر أن تحد على ميت فوق ثلاث ليال، إلا على زوج أربعة أشهر وعشرا. {cite:muwatta-maruf-1997 p.112}"
