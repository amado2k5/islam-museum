text: "… شهيدا وأم عميس وريرة لاصب نصرها حي أعقها وقالت قريش ما أدهب لصرها الا اللات والعزى عالت كدواو بست الله ما نصر اللات والمرى وما سمعان فرد الله نصرها وأعتق المهده ولها وكان الامراة من سى عدد الدارهر هما وقد …"
