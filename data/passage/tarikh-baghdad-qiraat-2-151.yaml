text: "… أبى عمرو بن العلاء البصري، سكن بنداد وحدت بها عز أبى عمرز بن العلاء، وأين جريح. روى عنه أبنه محمد، وأْبو تعيب صالح بن زرد السوسى، وأبو دبيد القاسم س سلام، وأسحاق بن ابراهيم الموصلى، وأبو عمر الدورى،"
