label: { ar: "صحيح البخاري 3813 — الرقية", en: "Sahih al-Bukhari 3813 — ruqya recited over the sick", ur: "صحیح بخاری 3813 — رقیہ" }
text: "… السَّمَاءِ، فِي أَعْلاَهُ عُرْوَةٌ فَقِيلَ لَهُ ارْقَهْ. قُلْتُ لاَ أَسْتَطِيعُ. فَأَتَانِي مِنْصَفٌ فَرَفَعَ ثِيَابِي مِنْ خَلْفِي، فَرَقِيتُ حَتَّى كُنْتُ فِي أَعْلاَهَا، فَأَخَذْتُ بِالْعُرْوَةِ، فَقِيلَ لَهُ اسْتَمْسِكْ. فَاسْتَيْقَظْتُ وَإِنَّهَا لَفِي يَدِي، فَقَصَصْتُهَا عَلَى النَّبِيِّ قَالَ \" تِلْكَ الرَّوْضَةُ الإِسْلاَمُ، وَذَلِكَ الْعَمُودُ عَمُودُ الإِسْلاَمِ، وَتِلْكَ الْعُرْوَةُ عُرْوَةُ الْوُثْقَى، فَأَنْتَ عَلَى الإِسْلاَمِ حَتَّى تَمُوتَ \". وَذَاكَ الرَّجُلُ عَبْدُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3813، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3813 (Merits of the Helpers in Madinah (Ansaar)), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3813، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
