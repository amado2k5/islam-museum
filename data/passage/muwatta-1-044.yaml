summary:
  ar: "أثر يرويه مالك عن نافع، في باب وضوء النائم إذا قام إلى الصلاة: كان عبد الله بن عمر ينام جالساً ثم يقوم فيصلي ولا يتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند البيهقي ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.55}"
