text: "… أَنْبَأَنَا دَاوُدُ بْنُ عَلِيٍّ، عَنْ عَامِرٍ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، قَالَتْ آلَى رَسُولُ اللَّهِ مِنْ نِسَائِهِ وَحَرَّمَ فَجَعَلَ الْحَرَامَ حَلاَلاً وَجَعَلَ فِي الْيَمِينِ كَفَّارَةً. قَالَ وَفِي الْبَابِ عَنْ أَنَسٍ وَأَبِي مُوسَى. قَالَ أَبُو عِيسَى حَدِيثُ مَسْلَمَةَ بْنِ عَلْقَمَةَ عَنْ دَاوُدَ رَوَاهُ عَلِيُّ بْنُ مُسْهِرٍ وَغَيْرُهُ عَنْ دَاوُدَ عَنِ الشَّعْبِيِّ أَنَّ النَّبِيَّ. مُرْسَلاً. وَلَيْسَ فِيهِ عَنْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1201، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1201 (The Book on Divorce and Li'an), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1201، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
