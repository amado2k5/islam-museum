label: { ar: "صحيح مسلم 1256 — ما أُحل، التحريم", en: "Sahih Muslim 1256 — what was made lawful; prohibition", ur: "صحیح مسلم 1256 — جو حلال کیا گیا، تحریم", es: "Sahih Muslim 1256 — lo que se hizo lícito; prohibición", fr: "Sahih Muslim 1256 — ce qui a été rendu licite; l'interdiction" }
text: "… تِلْكَ الْبَقْلَةِ الثُّومِ وَالنَّاسُ جِيَاعٌ فَأَكَلْنَا مِنْهَا أَكْلاً شَدِيدًا ثُمَّ رُحْنَا إِلَى الْمَسْجِدِ فَوَجَدَ رَسُولُ اللَّهِ الرِّيحَ فَقَالَ \" مَنْ أَكَلَ مِنْ هَذِهِ الشَّجَرَةِ الْخَبِيثَةِ شَيْئًا فَلاَ يَقْرَبَنَّا فِي الْمَسْجِدِ \". فَقَالَ النَّاسُ حُرِّمَتْ حُرِّمَتْ. فَبَلَغَ ذَاكَ النَّبِيَّ فَقَالَ \" أَيُّهَا النَّاسُ إِنَّهُ لَيْسَ بِي تَحْرِيمُ مَا أَحَلَّ اللَّهُ لِي وَلَكِنَّهَا شَجَرَةٌ أَكْرَهُ رِيحَهَا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1256، يذكر ما أُحل، والتحريم، والخبائث. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 1256 (The Book of Mosques and Places of Prayer), that mentions what was made lawful, prohibition, the foul things. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 1256، جس میں جو حلال کیا گیا، تحریم، خبیث چیزیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 1256 (El Libro de las Mezquitas y Lugares de Oración), menciona lo que es lícito, lo prohibido y lo impuro. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 1256 (Le Livre des Mosquées et des Lieux de Prière), mentionne ce qui est licite, ce qui est interdit et ce qui est impur. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
