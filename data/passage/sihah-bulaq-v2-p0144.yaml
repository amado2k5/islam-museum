text: |-
  اوا).
  ٤٤٣
  نكر يرهاتة ول جانى امّازيدواماع رو وقول الشاءر
  اماترى رأ-و تغيرلونه * شمطافأصبح كالنغام المحلس
  يريدان ترى رأسى وما زائدة وايس من اما التى تقتضى التكرير فى شى وكذلك فى الجازاة
  تقول امّا نأتنى أكرم لك قال اللّٰه تعالى فاماتر ين من البشرأحدا وقواهم أما بالفتح فهو
  لاقتتاح الكلام وأمًا يتضحن معن الجزاء ولا بد من الفاء فى جوابه تقول أماعبداقه فقائم
  وإتما احتيج الى الفاه فى حوابه لان فيه تأويل الجزاء كانك قلت مهما يكن من شئ فعبد اللّٰه
  قائم وقولهم أيما وايمايريدون أما وامًا فيبدلون من احدى الميميزياء قال الاحوص
  يما الى جنة ايما الى نار» وقد تكسر وأما مخفف تحقيق للكلام الذى يتلوه تقول أما ان زيدا
  عاقل تعنى أنه عاقل على الحقيقة لا على المجاز وتقول أما واللّٰه قد ضرب زيدهمرا أنا ). أنى
  .لشئ يأنى انى أى حان وأنى أيضا أدرك قال اللّٰه تعالى غير ناظرين اناء أى نضجه ويقال
  أيضا أنى الحميم أى انتهى حرّه ومن← قوله تعالى وبين حيم آن أى بالغ انا. فى شدة الحزوكل
  مدرك آن وآناه يؤنيه ايثا أى أخره وحبسه وأبطأه قال الكميت
  ومرضوفة لم تؤن فى الطبخ طاهيا * عجات الى محور هاحين غرغرا
  والاسم منه الاناء على فعال بالفتح قال الحطيئة
  وأخرت العشاء الى سهيل • أو الشعرى فطال بى الاناء
  وآناء الليل ساعاته قال الاخفش واحدها انى مثال معى قال وقال بعضهم واحسدها أنى
  وأنويقال مضى انيان من الليل وانوان وأنشدللهذلى
  السالك الشغر مخشيا موارده * فى كل أنى قضاه الليل ينتعل
  وقال أبو عبيدة واحدها انى مثل حسى والجمع آناءمثل أحساء وأنتد للهذلى
  حاو ومز كعطف القدح .رته • فى كل انى قضاه الليل ينتعل
  وتأنى فى الامر أى ترفق وتنظر واستأنى به أى انتظر به يقال استونى به حولا والاسم الاناة
  مشال القناة يقال تأنيتك حتى لا أناة بي والاناة من النساء التى فيها فتور عقد القيام وتأن
  قال الشاعر
  رمته أناة من ربيعة عامى • نوم الضحى فى مأتم أى مأتم
  قال سيبو به أصله وناة مغل أحد ووحد من الونى ورجل آن على فاعل أى كثير الاناة والحلم
  والاناءمعروف وججعه آنية وججمع الاتية الاوانى مثل سقاء وأسقية وأساق ⁦(اوا)⁩
  المأوى كل.كان يأوى الله شي ليلا أون اراوقد أوى فلان الى منزله بأوى أويا على فعول واواء
  ومنم قوله نعالى قال ساوى الى جبل يعصمى من الماء وآويته أنا ايوا وأويته أيضااذا
  أنزاته بك فعلت رأفعلت بعى عن أبى زيدو، أوى الابل بكسر الواولغه فى-أوى الابل خاصة
  وهو شاذ وقد فسرناه فى.أق العين من باب القساف وتأوت الطير تأوياتجمعت وهن أدى
  جع آومثال باك وبكىّ ومتأويات وقال العجاج يصف الاثافى • كماتدانى الحدأ الاوى
  سبه كل أثفية بحدأة وأويت لفسلان فأنا آوى له أوية وأية أيضاتقلب الواويا لكسر
  ما قبلها وتدغم ومأوية مخففة ومأواة أى أرتى له وأرق قال الشاءر
  ولو أننى استأويته ما أوى ليا • وابن آوى يسمى بالفارسية شغال والجمع بنات آوى وآوى
