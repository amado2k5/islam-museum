text: "… قال: من فعل هذا فهو كافِرٌ. قال مَعقِلٌ : ثم لقيتُ الزُّهري فأخبرتُه بقولهم؛ فقال : سبحان اللّٰه، أَوَ قد أخذَ الناسُ في هذه الخُصُومات؟! قال رسول اللّٰه وَل فيه لا يزني الزَّاني حين يزني وهو مؤمِنٌ، ولا يَسرقُ السَّارِقُ …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 395، يذكر ما يرتفع معه الإيمان حين الفعل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
