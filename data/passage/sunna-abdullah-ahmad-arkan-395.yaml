  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 395 کا اقتباس جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
