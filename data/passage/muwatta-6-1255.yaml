label: { ar: "الموطأ 1255 — مالك: من نتف شعرا من أنفه أو إبطه، أو اطلى جسده بنورة، أو حلق لضرورة، ففيه الفدية ناسيا كان أو جاهلا", en: "Muwatta 1255", es: "Muwatta 1255", fr: "Muwatta 1255", ur: "موطا 1255", tr: "Al-Muwatta 1255 — Malik: Kim burnundan veya koltuk altından kıl yolarsa, vücuduna tüy dökücü krem sürerse veya mecburiyetten tıraş olursa, bunu unutarak veya bilmeyerek yapmış olsun, kefaret ödemek zorundadır.", id: "Al-Muwatta 1255 — Malik: Barang siapa mencabut bulu hidung atau ketiaknya, atau mengoleskan krim penghilang bulu ke tubuhnya, atau bercukur karena terpaksa, maka wajib membayar tebusan, baik ia melakukannya karena lupa atau karena ketidaktahuan." }
summary:
  ar: "يقول مالك إن من نتف شعرا من أنفه أو إبطه، أو اطلى جسده بالنورة، أو حلق عن شجة في رأسه لضرورة، أو حلق قفاه لموضع المحاجم وهو محرم، ناسيا أو جاهلا، فعليه الفدية في ذلك كله، ولا ينبغي له أن يحلق موضع المحاجم. {cite:muwatta-maruf-1997 p.559}"
  tr: "Malik şöyle der: Kim ihramlı haldeyken, unutarak veya bilmeyerek burnundan veya koltuk altından kıl çekerse, vücuduna tüy dökücü krem sürerse, zorunluluktan başındaki yarayı tıraş ederse veya hacamat yapılan ense bölgesini tıraş ederse, tüm bu fiiller için kefaret ödemesi gerekir. Hacamat yapılan bölgeyi tıraş etmemelidir. {cite:muwatta-maruf-1997 s.559}"
  id: "Malik mengatakan bahwa siapa pun yang mencabut bulu hidung atau ketiaknya, mengoleskan krim penghilang bulu ke tubuhnya, mencukur luka di kepala karena terpaksa, atau mencukur bagian belakang lehernya tempat bekam dilakukan saat dalam keadaan ihram, baik karena lupa atau tidak sadar, harus membayar tebusan untuk semua perbuatan tersebut. Ia tidak boleh mencukur area tempat bekam dilakukan. {cite:muwatta-maruf-1997 p.559}"
