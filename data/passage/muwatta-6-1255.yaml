label: { ar: "الموطأ 1255 — مالك: من نتف شعرا من أنفه أو إبطه، أو اطلى جسده بنورة، أو حلق لضرورة، ففيه الفدية ناسيا كان أو جاهلا", en: "Muwatta 1255" }
summary:
  ar: "يقول مالك إن من نتف شعرا من أنفه أو إبطه، أو اطلى جسده بالنورة، أو حلق عن شجة في رأسه لضرورة، أو حلق قفاه لموضع المحاجم وهو محرم، ناسيا أو جاهلا، فعليه الفدية في ذلك كله، ولا ينبغي له أن يحلق موضع المحاجم. {cite:muwatta-maruf-1997 p.559}"
