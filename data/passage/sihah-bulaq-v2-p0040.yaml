text: |-
  *⁦(باب الولو والياء)⁩
  . .مر).
  ٥٤٧
  ومازودوتى غير حق عمامة • وخسرمى منهاقسى وزائف
  فهما عند الاخفس محذوفان مرخمان وحكى عن يونس أنه بجع بطرح الهاءمثدل ترة وتر
  وه_ذاغيره ستقيم لانه لو أراد ذلل لفال مأى مثال معى كما قالواف جع المة لتى وفى يجع ثية
  أبى وأمأى القوم صاروا مائة وأ. أيتهمم أنا أبوزيداً. أت غنم ف-لان اذاصارت مائة
  وأمأيتها لك جعلتها مائة ومأت السنور تمؤموا اذاصاحت مثل أمت تأموأماء وبقال مأى
  ما بينهم.أيا أى أفسد قال العجاح• ويعتلون من مأى فى الدحس • وقدة أى ما يينهسم أى
  نسد متا متوت الشئ مددته والتمى فى نزع القوس مدّالصلب قال احر والقيس
  فأننه الوحش واردة • قتنى النزع فى يسره
  ⁦( محا)⁩ محالوحه يمجوه محواو يمجبه محياويحاه أيضافه وعحى ومحموصارت الواوياء
  لمكسرة ما قبلها فأدغمت فى الياء التى هى لام الفعل وأنشد الاصمعى
  كمارأيت الورق الممهيا* وامى انفعل منته واستحى لغة فيه ضعيفة ومحوة ريح الشمال
  لانها تذهب بالسحاب وهي معرفة لا تنصرف ولا تدخلها ألّف ولام قال الراجز
  قد بكرت محوة بالتجاج • فدترت بقية الرجاج
  ويقال تركت الارض عحوة واحدة اذاطبقها المطر والممعاة خرقة يزال بها المى ونهوه
  ومحواسم. وضع قال يعقوب وأنشدنى أبو عمرو
  تجرى المنية بعد الفتى الك مغادر بالمحو أذلالها
  ( مخا تمخيت من النى وأمخيت منه اذا تبر أت منه وتحترجت قال الراجز
  ولم تراقب مأنما فتصفه * من ظلم شيخ آض من تشيخه
  دى) الدى الغاية يقال قطعة أرض قدرمدى البصروق_درمد البصر أيضًا عن
  يعقوب والمدى على فعيل الموض الذى ليست له نصائب وقال .
  اذا أميسل فى المدى قاضا *والجمع أمدية والمذية بالضم الشفرة وقد تكسر وابهع مديات
  ومدى كما قلناه فى كلية والمدى القفيز الشامىً وهوغير المت ⁦( مذى)⁩ المذى بالتسكين
  ما يخرج عند الملاعبة والتقبيل وفيه الوضوء تقول منه مذى الرجل بالفتح وأمذى بالااف
  مثله يقال كل ذكر يمذى وكل أننى تقذى والمذاء المماذاة وفى الحديث الغيرة من الايمان
  والمذاء من النفاق قال أبو عبيد هو أن يجمع الرجل بين رجال ونساء يخليهم بماذى بعضهم
  مضاوقال الاموىّ المذى والودى والمى مشددات وأمذيت فرسى اذا أرسلتها فى المرعى
  وربما فالوامذيته حكاه أبو عبيد والماذىّ العسل الابيض والماذية من الدروع البيضاء
  وقال الاصمعىّ المناذية السهلة اللينسة وتسمى الهرماذيه لسهولتها فى الحلق حرا)
  الاصمعى" المروحجارة بيضبتراقة تقدح منها النار الواحدة هروة وبها سميت المروة يمكه
  والمروضرب من الرياحين قال الاعشى* وآس وخيرى وعر ووسوسن* ومريت النساقة
  مريا اذا مسحت ضرعها ليدر وأمرت الناقة أى درّ لبنها والمرى على فعيل الناقة
  الكثيرة اللبن عن السكسائى ويقال هى التى تدر على المسح قال أبوز يدهوغ-يرمه-موز
  والجع مرايا ومريت الفرس اذا استخرحت ما عنده من الجرى بسوط أوغيره والاسم الموية
