text: |-
  ⁦(فصل الحام)⁩
  ٥٤٧
  الاديم احسرفهو حائط وحفط الرمث وأحنط أى أدرك وابيض ورقه حوط). الحائط
  واحد الحيطان صارت الواويا لانكسار ماقبلها وحوّط كرمه تحويطابى حوله حائطافهوكرم
  محوّط ومنسه قواهم أنا أحوّط جول ذلك الامر أى أدور والحواطة حظيرة تتخذ لالهام
  والحيطة بالمكسر الحياطة وهما من الواو وقد حاطه يحوطه حوطا وحيطة وحياطة أى كلا.
  ورعاه ومع فلان حيطة لك ولا تقل عليك أى تحنن وتعطف والحماريحوط عانبه أى يجمعها
  واحتاط الرجل لنفسه أى أخذ بالنقة وأحاط به أى عله وأحاط به علما وأحاطت انخيسل
  بقلان واحتاطت به أى أحدقت به
  مصل الخا ) ( بط بط البعير الارض بيده خبط اضر به اومنه قيل خيط عشوا.
  وهى الذاقة التى فى بصرها ضعف تخبط اذا مشت لا تتوقى شيئا وخبط الرجل اذا طرح نفسه
  حيث كان لينام قال الشاعر يشدخن بالليل الشجاع الخابطا وخبطت الشجر
  خيطا اذاضربتها بالعصاليسقط ورقها قال انراجز
  والصقع من خابطة وجرز
  واختبطف فلان اذاجاءك يطلب معروفك من غير آصرة قال الشاهر
  ومختبط لم يلق من دوننا كها * وذات رضع لم ينها رضيعها
  وخبطت الرجل اذا أنعمت عليه من غير معرفة بينسكما قال علقمه بن عبدة
  وفى كل ى قد خيطات بنعمة • فى ن اشأس من نداكذئوب
  شأس اسم أخى علقمة وقوله-م ما أدرى أى خابط ليل هو أى أىّ الناس هو والخباط بالضم
  كالجنون وليس به تقول منه تخبطه الشيطان أى أفسده والحباط بالمكسر عسة فى الفخذ
  طويلة عرضا تقولمنه خبط بعيره خبطا والخبطة بالمكسر القليل من اللبن وقال أبوزيد
  الحبط من الماء الرفض وهومابين الثلث الى النصف من السقاء والحوض والغ_دير والاناه
  قال وفى القرية خبطة من ماء وهو مثل الجرعة وضحوها ولم يعرف له فعلا ويقال أيضاكان
  ذلك بعد خبطة من الليل أى بعد صدرضنه والخبطة أيضا القطعة من البيوت والناس والمع
  خبط ( رط خرطت العود أخرطه وأخرطه خرط اقشرته وخرطت الورق حتته وهو أن
  قبض على أعلاه ثم تمريدك عليه الى أسله وفى المثل دونه خرط القماد وخرطه الدوا أيضا
  أى أمشاء وكذلك خرّطه قخر بطا وانخرط بالتحريك داء يصيب الضرع فيخرج اللبن متعقدا
  كقطع الاوتاريقال قد أخرطت الناقة فهى مخرط فاذاان ذلك عادة لها فهى مخراط
  والخراط أيضا الحية التمن عادتها أن تسلخ جلدها فى كل سنة قال الشاءر
  انى كسانى أبو قابوس مرفلة * كانها سلخ أبكار الشاريط
  وفرس خروط أى يموح يقول البائع برقت اليك من الحراط أى الجماح وانخرط الفرس فى سيره
  أى لج قال الهجاج كالبر برى لح فى انخراط وانخرط علينافلان اذا اندرأ بالقول السي
  واغخرط جسمه أى دق والاخر يط ضرب من الحض وخرطت الحديد خرط أى طوّلته
  كالعمود ورجل مخروط اللحية ومخروط الوجه أى فيهم اطول من غير عرض واخترط سيفد
  أى سله والخر بطة وعاء من أدم وغيره يشرج على ما فيها وقد أخرطت الخر بطة أى أشرحتها
  واخروط جسم المسيراخر واطا أى امتد قال الهجاج مخروّطاجا من الاقطار
