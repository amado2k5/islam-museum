text: |-
  من قال قد بطات صحاح الجوهرى * لما أتى القاموس فهو المفترى
  قلت اسمه القاموس وهوالبحرإن • يفخر فعظم فره بالجوهر ى
  ثم نوفى الجوهرى فى حدود الاربعمائة على اختلاف فى تعيين سنة الوفاة فقيل سنة ٢٩٣
  وقيل غير ذلك. قبل انه توفى مترديا من سطح داره وقيل انه تغيرعة له وعمل له دقتين وشدّهما
  كالجناحين وأراد أن يطير فوقع من علو فهلكْ (وأما من نسخ هذا الكتاب بخطه من العلماء
  الموتوق بهم فأعظمهم ابن عبدوس المتقدم ذكره نقله من خط المؤلف وقرأه عليه ثم نقله
  الشيخ أبو سهل الهروى من خط المصنف وكذا أبوز كر يا انخطيب التبريزى وكيرون أشهرهم
  اقوت الموصلى وكل منهم قمد على هامت توقمعات يعزى اليها المؤلفون ممن حشاه وغيره.
  وذكرابن خلكان فى ترجحة باقوت المذ كور انه كان مغرى بنمخ الصحاح كتب منه نسخ
  كثيرة فى مجلد واحد قال ورأيت منهاعدة نسخ كانت تباع الواحدة منها بمائة دينار أى
  لصحة فقله وحسن خطه لانه لم يكن فى زمانه من يقاربه فى الخط وذكرشارح القاموس انه
  ظفر بنسضة عظيمة من الصماح فى تمان مجلدات بخط باقوت الرومى وجدها فى خزانة الامير
  أزيك حين تأليفه شرحه اه ي ول الفقي وهذا غير ياقوت الموصلى المتقدم ذكره وغير
  ياقوت الحوى الذى نقل عنه المزهر فيما يأتى ولكل منهم ترجمة على حدته أول باب الياءمن
  الوفيات ونقل صاحب كشف الظنون من خط ابن الحنائى ان الصفدى فى حلى النواهد
  الاتى ذكره نقل تربحة الصحاح عن الانقروى وذكرانه شاهد نِسخة من صحاح الجوهرى بخط
  ياقوت الموصلى كاتب نسخ الصحاح الذى ترجمته فى ابن خلكان وانه كتب فى آخرها هكذا
  بقول ياقوت نقلت هذا الكتاب من خط الشيخ أبى سهل محمد بن على الهروى النحوى رحه
  الله وذ كرانه نقله من خط المصنف وانه رواه عن اسمعيل بن محمدين عبدوس عن المصنف
  وقد شاهدت بفط ابن عبدوس على النسخة التى نقات منها ماصورته قرأ على" الشيخ أبو سهل
  محمد ين على بن محد الهروى أكثرهذا الكاب وسمع باقيه من لفظى بقراءتى عليه فصح لهسماع
  جيعه فن وروايته عنى وذلا فى سنة ٤٢١ وكتبه اسمعبل بن محمد بن عبدوس الدهان
  النيسابورى ويقول ياقوت هذا الكتاب أرويه متصلا الى ابن عبد وس عن المصنف فاصح
  فى هذه النسحة فهومن الرواية من خطا أوصواب وماخالفها من زيادة أو تغييرة)ه ومن كلام
  غير المصنف وقد استدرك عليه أبو سهل وبين بعض ماصحفه المصبنف قال ياقوت وقسد أثبت
  ذلات فى مواضعه ولى أيضامواضع قدنبهت عليها من سهو المصنف ومن سهو وقع فى خط
  أبى سهل على ان الكتب الكبار لا تخلو من ذلك انتهى وأنت اذا تأملت كلام ياقوت وقفت على
  أن ماذكره السيوطى من الاعتذار عن التصحيف فيه بعدم تيييض النسخة الى آخر هاغير
  جدير بالقبول انتهى ماذكره فى كشف الظنون يعدى مانة-ل فى المزهر عن حسكاية ياقوت
  الحوى فى معجم الادباء تطير ما نقله أولا فى كشف الغنون ان سبب التعحيف الذى وقع فبه هو
  انه لما صنفه للاستاذ أبى منصور سمع عليه الى باب الضاد المعجمة وعرض له وسوسة فألى نفسه
  من سطح داره فات فبق سائرالكتاب مودة غير منقعة فبيضه تلميذه ابراهيم بن صالح
  الوراق فغلط فيه فى مواضع اه وقد تعقب هذا القول بأنه وجدت فيه تصحيفات أخرى قبل
  لساب المذكور و يقول الفقير و أحس-ن من هذا كله ما نقله المزهرعن الخطيب فى-ق
