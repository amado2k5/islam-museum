label: { ar: "سنن أبي داود 3721 — الأب والأبوة", en: "Sunan Abi Dawud 3721 — the father and fatherhood", ur: "سنن ابی داؤد 3721 — باپ اور والدیت" }
text: "حَدَّثَنَا نَصْرُ بْنُ عَلِيٍّ، حَدَّثَنَا عَبْدُ الأَعْلَى، حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عُمَرَ، عَنْ عِيسَى بْنِ عَبْدِ اللَّهِ، - رَجُلٍ مِنَ الأَنْصَارِ - عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ دَعَا بِإِدَاوَةٍ يَوْمَ أُحُدٍ فَقَالَ \" اخْنُثْ فَمَ الإِدَاوَةِ \". ثُمَّ شَرِبَ مِنْ فِيهَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 3721، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3721 (Drinks (Kitab Al-Ashribah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3721، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
