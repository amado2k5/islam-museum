label: { ar: "صحيح البخاري 2779 — وصية أو عهد أخير", en: "Sahih al-Bukhari 2779 — a testament or parting counsel", ur: "صحیح بخاری 2779 — وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 2779 — un testamento o consejo de despedida", fr: "Sahih al-Bukhari 2779 — un testament ou un conseil d'adieu", tr: "Sahih el-Buhari 2779 — Son bir vasiyet veya antlaşma", id: "Sahih al-Bukhari 2779 — Sebuah wasiat atau perjanjian terakhir" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسٍ ـ قَالَ النَّبِيُّ \" يَا بَنِي النَّجَّارِ ثَامِنُونِي بِحَائِطِكُمْ \". قَالُوا لاَ نَطْلُبُ ثَمَنَهُ إِلاَّ إِلَى اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2779، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2779 (Wills and Testaments (Wasaayaa)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 2779، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2779 (Testamentos (Wasaayaa)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 2779 (Testaments), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 2779 numaralı hadis, vasiyet veya son bir ahitten bahsetmektedir. Bu hadis, vasiyet, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2779, menyebutkan tentang wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
