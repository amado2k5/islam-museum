label: { ar: "سنن النسائي 2810 — الأب والأبوة", en: "Sunan al-Nasa'i 2810 — the father and fatherhood", ur: "سنن نسائی 2810 — باپ اور والدیت" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، وَمُحَمَّدُ بْنُ بَشَّارٍ، قَالاَ حَدَّثَنَا مُحَمَّدٌ، قَالَ حَدَّثَنَا شُعْبَةُ، قَالَ سَمِعْتُ عَبْدَ الْوَارِثِ بْنَ أَبِي حَنِيفَةَ، قَالَ سَمِعْتُ إِبْرَاهِيمَ التَّيْمِيَّ، يُحَدِّثُ عَنْ أَبِيهِ، عَنْ أَبِي ذَرٍّ، قَالَ فِي مُتْعَةِ الْحَجِّ لَيْسَتْ لَكُمْ وَلَسْتُمْ مِنْهَا فِي شَىْءٍ إِنَّمَا كَانَتْ رُخْصَةً لَنَا أَصْحَابَ مُحَمَّدٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 2810، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2810 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2810، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
