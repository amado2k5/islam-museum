label: { ar: "الموطأ 1558 — مالك: الأمة إذا كانت تحت الحر فتعتق وهي تحته قبل أن يفارقها، إنه يحصنها إذا أعتقت وهي عنده، إذا أصابها بعد أن تعتق", en: "Muwatta 1558", es: "Muwatta 1558", fr: "Muwatta 1558", ur: "موطا 1558", tr: "El-Muvatta 1558 — Malik: Eğer bir köle kadın özgür bir erkeğin vesayeti altındaysa ve köle onu terk etmeden önce onun vesayeti altındayken azat edilirse, köle azat edildikten sonra onunla birlikteyken cinsel ilişkiye girerse, erkek iffetli sayılır.", id: "Al-Muwatta 1558 — Malik: Jika seorang budak perempuan berada di bawah perwalian seorang laki-laki merdeka dan dibebaskan saat masih di bawah perwaliannya sebelum laki-laki itu meninggalkannya, maka laki-laki itu dianggap suci jika ia bersetubuh dengannya setelah perempuan itu dibebaskan saat perempuan itu bersamanya." }
summary:
  ar: "يقول مالك والأمة إذا كانت تحت الحر، فتعتق وهي تحته، قبل أن يفارقها، إنه يحصنها إذا أعتقت وهي عنده، إذا هو أصابها بعد أن تعتق. {cite:muwatta-maruf-1997 p.49}"
  tr: "Malik, bir köle kadının özgür bir erkeğin vesayeti altında olması ve bu kadın, erkek onu terk etmeden önce, hâlâ onun vesayeti altındayken özgür bırakılırsa, erkek, kadın özgür bırakıldıktan sonra onunla cinsel ilişkiye girerse, bu durumdan korunacağını söyler. {cite:muwatta-maruf-1997 s.49}"
  id: "Malik mengatakan bahwa jika seorang budak perempuan berada di bawah perwalian seorang pria merdeka, dan dibebaskan saat masih di bawah perwaliannya, sebelum pria itu meninggalkannya, maka pria itu terlindungi dari hubungan seksual dengannya jika ia melakukan hubungan seksual dengannya setelah perempuan itu merdeka. {cite:muwatta-maruf-1997 p.49}"
