text: "… ما أحسنه مرعى لو لم يملأهُ ماءٌ! كان آتياً من بلدته آَقَ شَهْرُ إلى سيوري حصار لأول مرة، فعندما رأى بحيراتها الكبرى قال: انظروا ما أحسن هذا المرعى لهذه البلدة! ولكن ما الفائدةُ، وقد ملاوه ماءًا. اربطوه من أسفل كان …"
summary:
  ar: "عند وصوله أول مرة من آق شهر إلى سيوري حصار أعجب جحا ببحيراتها الكبيرة كمرعى، ثم لاحظ أنها مليئة بالماء. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  en: "On first arriving at Siwri Hisar from Akshehir, Juha admires its great lakes as pasture, then notes that they are filled with water. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  ur: "آق شہر سے سیوری حصار پہلی بار پہنچ کر جحا اس کی بڑی جھیلوں کو چراگاہ سمجھ کر سراہتا ہے، پھر دیکھتا ہے کہ وہ پانی سے بھری ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  fr: "En arrivant pour la première fois à Siwri Hisar depuis Akshehir, Juha admire ses grands lacs comme pâturage, puis remarque qu'ils sont remplis d'eau. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  es: "Al llegar por primera vez a Siwri Hisar desde Akshehir, Juha admira sus grandes lagos como pasto, y luego nota que están llenos de agua. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
