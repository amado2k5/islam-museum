label: { ar: "الموطأ 2796 — نافع عن أبي لبابة: نهى النبي عن قتل الحيات التي في البيوت", en: "Muwatta 2796", es: "Muwatta 2796", fr: "Muwatta 2796", ur: "موطا 2796", tr: "El-Muvatta 2796 — Nafi'nin Ebu Lubaba'dan rivayet ettiğine göre: Peygamberimiz evlerde bulunan yılanların öldürülmesini yasaklamıştır.", id: "Al-Muwatta 2796 — Diriwayatkan oleh Nafi’ dari Abu Lubaba: Nabi melarang membunuh ular yang ada di dalam rumah." }
summary:
  ar: "يروي مالك عن نافع، عن أبي لبابة، أن رسول الله نهى عن قتل الحيات التي في البيوت. ويذكر المحقق قول ابن عبد البر أن الصحيح عن مالك رواية يحيى وغيره: عن نافع عن أبي لبابة، لأن نافعا سمعه مع ابن عمر من أبي لبابة. ويذكر أن القعنبي زاد فيه استثناء ذي الطفيتين والأبتر من حديث ابن عمر، وأن ابن عبد البر جزم بأنه من أوهام القعنبي. {cite:muwatta-maruf-1997 p.570}"
  id: "Malik meriwayatkan dari Nafi', dari Abu Lubaba, bahwa Rasulullah shalla Allahu alaihi wa sallam melarang membunuh ular yang ditemukan di dalam rumah. Peneliti menyebutkan pernyataan Ibnu 'Abd al-Barr bahwa riwayat yang benar dari Malik adalah riwayat Yahya dan lainnya: dari Nafi', dari Abu Lubaba, karena Nafi' mendengarnya dari Ibnu 'Umar dari Abu Lubaba. Ia juga menyebutkan bahwa al-Qa'nabi menambahkan pengecualian ular belang dua dan ular tanpa ekor dalam hadits Ibnu 'Umar, dan bahwa Ibnu 'Abd al-Barr menegaskan bahwa ini adalah kesalahan dari al-Qa'nabi. {cite:muwatta-maruf-1997 p.570}"
