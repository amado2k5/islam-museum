summary:
  ar: "يروي مالك عن نافع، عن أبي لبابة، أن رسول الله نهى عن قتل الحيات التي في البيوت. ويذكر المحقق قول ابن عبد البر أن الصحيح عن مالك رواية يحيى وغيره: عن نافع عن أبي لبابة، لأن نافعا سمعه مع ابن عمر من أبي لبابة. ويذكر أن القعنبي زاد فيه استثناء ذي الطفيتين والأبتر من حديث ابن عمر، وأن ابن عبد البر جزم بأنه من أوهام القعنبي. {cite:muwatta-maruf-1997 p.570}"
