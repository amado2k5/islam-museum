label: { ar: "موطأ مالك 1123 — ما أُحل، ما لا يحل", en: "Muwatta Malik 1123 — what was made lawful; what is not lawful", ur: "موطأ مالک 1123 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… عَنْ مَالِكٍ، أَنَّهُ سَأَلَ ابْنَ شِهَابٍ عَنْ رَجُلٍ، كَانَتْ تَحْتَهُ أَمَةٌ مَمْلُوكَةٌ فَاشْتَرَاهَا وَقَدْ كَانَ طَلَّقَهَا وَاحِدَةً فَقَالَ تَحِلُّ لَهُ بِمِلْكِ يَمِينِهِ مَا لَمْ يَبُتَّ طَلاَقَهَا فَإِنْ بَتَّ طَلاَقَهَا فَلاَ تَحِلُّ لَهُ بِمِلْكِ يَمِينِهِ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ. قَالَ مَالِكٌ فِي الرَّجُلِ يَنْكِحُ الأَمَةَ فَتَلِدُ مِنْهُ ثُمَّ يَبْتَاعُهَا إِنَّهَا لاَ تَكُونُ أُمَّ وَلَدٍ لَهُ بِذَلِكَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1123، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1123 (Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1123، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
