label: { ar: "سنن أبي داود 445 — الفرض", en: "Sunan Abi Dawud 445 — the obligatory (fard)", ur: "سنن ابی داؤد 445 — فرض", fr: "Sunan Abi Dawud 445 — l'obligatoire (fard)", es: "Sunan Abi Dawud 445 — lo obligatorio (fard)", tr: "Sünen Ebu Davud 445 — Vacip", id: "Sunan Abi Dawud 445 — Kewajiban" }
text: "… هَذَا الْخَبَرِ قَالَ فَتَوَضَّأَ - يَعْنِي النَّبِيَّ - وُضُوءًا لَمْ يَلْثَ مِنْهُ التُّرَابُ ثُمَّ أَمَرَ بِلاَلاً فَأَذَّنَ ثُمَّ قَامَ النَّبِيُّ فَرَكَعَ رَكْعَتَيْنِ غَيْرَ عَجِلٍ ثُمَّ قَالَ لِبِلاَلٍ \" أَقِمِ الصَّلاَةَ \". ثُمَّ صَلَّى الْفَرْضَ وَهُوَ غَيْرُ عَجِلٍ. قَالَ عَنْ حَجَّاجٍ عَنْ يَزِيدَ بْنِ صُلَيْحٍ حَدَّثَنِي ذُو مِخْبَرٍ رَجُلٌ مِنَ الْحَبَشَةِ وَقَالَ عُبَيْدٌ يَزِيدُ بْنُ صَالِحٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 445، يرد فيه ذكر الفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 445 (Prayer (Kitab Al-Salat)), whose wording mentions the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 445، جس کے الفاظ میں فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 445, dont le texte mentionne l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 445, cuyo texto menciona lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da yer alan 445 numaralı hadis, farz olan amellerden bahsetmektedir. Bu hadis, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 445, menyebutkan tentang amalan-amalan wajib. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan-amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
