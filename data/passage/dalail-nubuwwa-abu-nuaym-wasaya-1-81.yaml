text: "… ومُداً من شعير عن كل إنسان، قال: فنخرجها، فيخرج بنا إلى ظاهر حَرَّتنا، فيستسقي لنا، فوالله ما يبرح من مجلسه حتى يمرَّ السحاب السراح سائلة، ونسقى به، ففعل ذلك غير مرة ولا مرتين ولا ثلاثاً، ثمَّ حضرَته الوفاة، فلما عرف …"
summary:
  ar: "مقطع من دلائل النبوة لأبي نعيم، المجلد المصوَّر 1، ص 81، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Dala'il al-Nubuwwa, scan volume 1, p. 81, that mentions a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "دلائل النبوۃ، ابو نعیم، اسکین جلد 1، ص 81 کا اقتباس جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de Abu Nu'aym, volumen 1, pág. 81, que menciona un lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Dala'il al-Nubuwwa d'Abu Nu'aym (tome 1, p. 81), numérisé, évoquant un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
  tr: "Ebu Nuaym'ın \"Peygamberliğin Alametleri\" adlı eserinin 1. cildinin 81. sayfasından, ölüm anı ve ölüme dair bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Abu Nu'aym, \"Tanda-Tanda Kenabian,\" Jilid 1, halaman 81, yang menyebutkan saat kematian dan proses sekarat; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
