text: "… بن صخر فيخرص عليهم - يعني أهل خَيْبَرَ. وفي المغَازِي لابْنه إسْحَاقَ: حدّثَني عبد اللّٰه بن أبي بكر، عن عبد اللّٰه بن مِكْنَفَ، حدثني حارثة، قال: لما أخرج عمر يهود خَيْبر رَكِب في المهاجرين والأنصار، وخرج معه جبَّار بن صَخر، …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 560، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
