text: "… وقع عوضهم اللّٰه عما كان يغدو إليهم مع حجاج المشركين، بما شرعه لهم من قتال أهل الكتاب، وضرب الجزية عليهم، وسلب أموال من قتل منهم على كفره، كما وقع بكفار أهل الشام من الروم ومجوس الفرس، بالعراق وغيرها من البلدان …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 573، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
