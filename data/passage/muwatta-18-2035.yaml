label: { ar: "الموطأ 2035 — مالك: فيمن دفع إلى رجل مالا قراضا على أنه يعمل فيه، فما باع به من دين فهو ضامن له: إن ذلك لازم له، إن باع بدين فقد ضمنه", en: "Muwatta 2035", es: "Muwatta 2035", fr: "Muwatta 2035", ur: "موطا 2035", tr: "Al-Muwatta 2035 — Malik: Bir kimse, bir adama yatırım yapması şartıyla borç verirse ve borçtan elde ettiği gelirle sattığı her şeyden sorumlu olursa, bu onun için bağlayıcıdır; eğer borçtan elde ettiği gelirle satış yaparsa, o zaman bundan sorumludur.", id: "Al-Muwatta 2035 — Malik: Mengenai seseorang yang memberikan uang kepada orang lain sebagai pinjaman dengan syarat ia menginvestasikannya, dan apa pun yang ia jual dengan hasil dari hutang tersebut, maka ia bertanggung jawab atasnya: itu mengikat baginya; jika ia menjual dengan hasil dari hutang tersebut, maka ia bertanggung jawab atasnya." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا على أنه يعمل فيه، فما باع به من دين فهو ضامن له، قال: إن ذلك لازم له، إن باع بدين فقد ضمنه. {cite:muwatta-maruf-1997 p.232}"
  tr: "Malik, bir adamın başka bir adama, yatırım yapması şartıyla borç para vermesi ve bu borçtan elde ettiği gelirle sattığı her şeyden sorumlu olması konusunda şöyle demiştir: Bu, onun için bağlayıcıdır; eğer borçtan elde ettiği gelirle satış yaparsa, o zaman bundan sorumludur. {cite:muwatta-maruf-1997 s.232}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain sebagai pinjaman dengan syarat bahwa ia akan menginvestasikannya, dan bahwa apa pun yang ia jual dengan hasil dari hutang tersebut, ia bertanggung jawab atasnya: itu mengikatnya; jika ia menjual dengan hasil dari hutang tersebut, maka ia bertanggung jawab atasnya. {cite:muwatta-maruf-1997 p.232}"
