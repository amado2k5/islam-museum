summary:
  ar: "يروي يحيى عن مالك عن هشام بن عروة عن أبيه أنه كان يسوي بين الأسنان في العقل، ولا يفضل بعضها على بعض. {cite:muwatta-maruf-1997 p.432}"
  tr: "Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayet ederek, tüm dişleri zekâ bakımından eşit gördüğünü ve hiçbirini diğerinden üstün tutmadığını nakletmiştir. {cite:muwatta-maruf-1997 s.432}"
  id: "Yahya meriwayatkan dari Malik, dari Hisham ibn Urwah, dari ayahnya, bahwa ia menganggap semua gigi sama dalam hal kecerdasan, dan tidak memihak sebagian gigi atas yang lain. {cite:muwatta-maruf-1997 p.432}"
