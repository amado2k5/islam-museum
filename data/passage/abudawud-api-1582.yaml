label: { ar: "سنن أبي داود 1582 — حلاوة الإيمان وكماله", en: "Sunan Abi Dawud 1582 — the sweetness and completeness of faith", ur: "سنن ابی داؤد 1582 — ایمان کی مٹھاس اور اس کا کمال", es: "Sunan Abi Dawud 1582 — La dulzura y la plenitud de la fe", fr: "Sunan Abi Dawud 1582 — La douceur et la plénitude de la foi", tr: "Sunan Abi Davud 1582 — İmanın Tatlılığı ve Mükemmelliği", id: "Sunan Abi Dawud 1582 — Manisnya dan Kesempurnaan Iman" }
text: "… - مِنْ غَاضِرَةِ قَيْسٍ - قَالَ قَالَ النَّبِيُّ \" ثَلاَثٌ مَنْ فَعَلَهُنَّ فَقَدْ طَعِمَ طَعْمَ الإِيمَانِ مَنْ عَبَدَ اللَّهَ وَحْدَهُ وَأَنَّهُ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَعْطَى زَكَاةَ مَالِهِ طَيِّبَةً بِهَا نَفْسُهُ رَافِدَةً عَلَيْهِ كُلَّ عَامٍ وَلاَ يُعْطِي الْهَرِمَةَ وَلاَ الدَّرِنَةَ وَلاَ الْمَرِيضَةَ وَلاَ الشَّرَطَ اللَّئِيمَةَ وَلَكِنْ مِنْ وَسَطِ أَمْوَالِكُمْ فَإِنَّ اللَّهَ لَمْ يَسْأَلْكُمْ خَيْرَهُ وَلَمْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1582، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 1582 (Zakat (Kitab Al-Zakat)), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 1582، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 1582 (Zakat (Kitab Al-Zakat)), menciona la dulzura y la plenitud de la fe. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Abi Dawud, n° 1582 (Zakat), évoque la douceur et la plénitude de la foi. Le Guide des Piliers et des Branches de la Foi le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sünen Ebu Davud'da yer alan 1582 numaralı hadis, imanın tatlılığı ve mükemmelliğinden bahsetmektedir. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1582, menyebutkan manisnya dan kesempurnaan iman. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
