text: "… عمرة قالت: قالت سماها السهيلي في مبهمات القرآن، وتبعه المنذري معاذة الغفارية: كنت أنيساً لرسول اللّٰه بتليفي أخرج معه في والراجح أن اسمها جُمَيْل كما تقدم في حرف الجيم. الأسفار أقوم على المرضى وأداوي الجرحى، فدخلت - ليلى بنت يعار: …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1957، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 1957, that mentions illness and the sick, the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 1957 کا اقتباس جس میں بیماری اور بیمار، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen 2 escaneado, pág. 1957, que menciona la enfermedad y los enfermos, el tratamiento de las heridas, las mujeres que atienden a los heridos y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn Hajar, al-Isaba, volume 2, page 1957, qui mentionne la maladie et les malades, le traitement des blessures, les femmes soignant les blessés, la recherche de soins; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Hacer'in resimli cilt 2, s. 1957'deki \"El-İsabe\" adlı eserinden bir alıntı, hastalık ve hasta, yaraların tedavisi, yaralıları tedavi eden kadınlar ve tedavi konularından bahsetmektedir; makine tarafından okunabilir resimli versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Al-Isabah karya Ibn Hajar, jilid bergambar 2, hlm. 1957, menyebutkan penyakit dan pasien, pengobatan luka, wanita yang merawat orang terluka, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
