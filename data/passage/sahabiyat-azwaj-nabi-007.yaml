text: "ركته، فأعطيته الكتاب، فإذا فيه: ⁦(بسم الله الرحمن الرحيم. من محمد رسول الله إلى قيصر الروم)⁩، فنخر ابن أخ له أحمر أزرق سبط، فقال: لا تقرأ الكتاب اليوم، فإنه بدأ بنفسه، وكتب صاحب الروم ولم يكتب ملك الروم . قال:"
