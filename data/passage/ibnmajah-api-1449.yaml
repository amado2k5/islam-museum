label: { ar: "سنن ابن ماجه 1449 — ساعة الاحتضار والوفاة", en: "Sunan Ibn Majah 1449 — a deathbed and last hours", ur: "سنن ابن ماجہ 1449 — وقتِ وفات اور آخری لمحات", es: "Sunan Ibn Majah 1449 — lecho de muerte y últimas horas" }
text: "… إِسْحَاقَ، عَنِ الْحَارِثِ بْنِ فُضَيْلٍ، عَنِ الزُّهْرِيِّ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ كَعْبِ بْنِ مَالِكٍ، عَنْ أَبِيهِ، قَالَ لَمَّا حَضَرَتْ كَعْبًا الْوَفَاةُ أَتَتْهُ أُمُّ بِشْرٍ بِنْتُ الْبَرَاءِ بْنِ مَعْرُورٍ فَقَالَتْ يَا أَبَا عَبْدِ الرَّحْمَنِ إِنْ لَقِيتَ فُلاَنًا فَاقْرَأْ عَلَيْهِ مِنِّي السَّلاَمَ. قَالَ غَفَرَ اللَّهُ لَكِ يَا أُمَّ بِشْرٍ نَحْنُ أَشْغَلُ مِنْ ذَلِكِ. قَالَتْ يَا أَبَا عَبْدِ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1449، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1449 (Chapters Regarding Funerals), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1449، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1449 (Capítulos sobre los funerales), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
