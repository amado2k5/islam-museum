label: { ar: "الموطأ 1595 — عائشة: خطبت على عبد الرحمن بن أبي بكر قريبة بنت أبي أمية، فزوجوه، ثم عتبوا عليه، فجعل أمرها بيدها فاختارت زوجها، فلم يكن ذلك طلاقا", en: "Muwatta 1595", es: "Muwatta 1595", fr: "Muwatta 1595", ur: "موطا 1595", tr: "Al-Muwatta 1595 — Aişe: Abdülrahman ibn Ebu Bekr adına Kariba bint Ebu Umeyye'ye nikah teklif ettim ve onunla evlendiler. Sonra onu eleştirdiler, bu yüzden ona seçim hakkı verdi ve o da kocasını seçti. Bu boşanma olarak kabul edilmedi.", id: "Al-Muwatta 1595 — Aisyah: Aku melamar Qariba binti Abi Umayyah atas nama Abdullah binti Abi Bakr, dan mereka menikah dengannya. Kemudian mereka mengkritiknya, sehingga dia memberi Qariba pilihan, dan Qariba memilih suaminya. Ini tidak dianggap sebagai perceraian." }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة أم المؤمنين أنها خطبت على عبد الرحمن بن أبي بكر قريبة بنت أبي أمية فزوجوه. ثم إنهم عتبوا على عبد الرحمن، وقالوا ما زوجنا إلا عائشة، فأرسلت عائشة إلى عبد الرحمن، فذكرت ذلك له، فجعل أمر قريبة بيدها، فاختارت زوجها، فلم يكن ذلك طلاقا. {cite:muwatta-maruf-1997 p.63}"
  tr: "Malik, Abdurrahman ibn el-Kâsım'dan, o da babasından, o da Müminlerin Annesi Ayşe'den rivayet eder ki, Ayşe, Kuraybe bint Ebu Ümeyye'nin Abdurrahman ibn Ebu Bekir ile evlenmesini ayarlamış ve evlenmişlerdir. Sonra Abdurrahman'a şikayette bulunarak, \"Biz onu sadece Ayşe ile evlendirdik\" demişlerdir. Bunun üzerine Ayşe, Abdurrahman'a haber göndererek durumu bildirmiştir. Bunun üzerine Abdurrahman, Kuraybe'ye kocasını seçme yetkisini vermiş ve bu da boşanma olarak kabul edilmemiştir. {cite:muwatta-maruf-1997 s.63}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Aisyah, Ibu Kaum Beriman, bahwa ia mengatur agar Quraybah binti Abi Umayyah menikah dengan Abd al-Rahman ibn Abi Bakr, dan mereka menikahkan Quraybah. Kemudian mereka mengadu kepada Abd al-Rahman, dengan mengatakan, \"Kami hanya menikahkan Quraybah dengan Aisyah.\" Maka Aisyah mengirim pesan kepada Abd al-Rahman dan memberitahukannya tentang hal itu. Kemudian Abd al-Rahman memberi Quraybah wewenang untuk memilih suaminya, dan ini tidak dianggap sebagai perceraian. {cite:muwatta-maruf-1997 p.63}"
