label: { ar: "الموطأ 1595 — عائشة: خطبت على عبد الرحمن بن أبي بكر قريبة بنت أبي أمية، فزوجوه، ثم عتبوا عليه، فجعل أمرها بيدها فاختارت زوجها، فلم يكن ذلك طلاقا", en: "Muwatta 1595" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة أم المؤمنين أنها خطبت على عبد الرحمن بن أبي بكر قريبة بنت أبي أمية فزوجوه. ثم إنهم عتبوا على عبد الرحمن، وقالوا ما زوجنا إلا عائشة، فأرسلت عائشة إلى عبد الرحمن، فذكرت ذلك له، فجعل أمر قريبة بيدها، فاختارت زوجها، فلم يكن ذلك طلاقا. {cite:muwatta-maruf-1997 p.63}"
