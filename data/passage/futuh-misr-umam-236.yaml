text: "… اللك بن مسلمة عن القاسم بن عبد الله. عن عبد اللّٰه بن دينار عن عبد اللّه بن عمر، أن يختم فى رقاب أهل الذمة بالرصاص. ويظهروا مناطقهم، ويجزّوا نواصيهم، ويركبوا على الأُكُفهُ عَرْضَا، ولا يضربوا الجزية إلا على من جرت …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 236، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 236, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 236 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
