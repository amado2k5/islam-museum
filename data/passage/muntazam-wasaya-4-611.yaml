text: "… وكان يقول شربت ماء زمن م على نية ان ادخل بغدادواروى بها التاريخ وان اموت بها وادفن يجنب بشرين الحارث وقد رزقنى اللّٰه تعالى دخولها ورواية التاريخ بها وانا ارجو الثالثة واوصى ان يدفن الى جانب بشر. توفى ضهوة نهار …"
