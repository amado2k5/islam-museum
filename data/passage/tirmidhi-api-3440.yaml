text: "… غَيْلاَنَ، حَدَّثَنَا أَبُو دَاوُدَ، أَنْبَأَنَا شُعْبَةُ، عَنْ أَبِي إِسْحَاقَ، قَالَ سَمِعْتُ الرَّبِيعَ بْنَ الْبَرَاءِ بْنِ عَازِبٍ، يُحَدِّثُ عَنْ أَبِيهِ، أَنَّ النَّبِيَّ كَانَ إِذَا قَدِمَ مِنْ سَفَرٍ قَالَ \" آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَرَوَى الثَّوْرِيُّ هَذَا الْحَدِيثَ عَنْ أَبِي إِسْحَاقَ عَنِ الْبَرَاءِ وَلَمْ يَذْكُرْ فِيهِ عَنِ الرَّبِيعِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3440، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3440 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3440، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
