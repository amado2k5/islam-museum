label: { ar: "سنن أبي داود 2875 — استحلال الشيء", en: "Sunan Abi Dawud 2875 — treating a thing as lawful", ur: "سنن ابی داؤد 2875 — کسی چیز کو حلال ٹھہرانا", es: "Sunan Abi Dawud 2875 — tratar algo como lícito", fr: "Sunan Abi Dawud 2875 — considérer une chose comme licite" }
text: "… حَدَّثَنَا حَرْبُ بْنُ شَدَّادٍ، حَدَّثَنَا يَحْيَى بْنُ أَبِي كَثِيرٍ، عَنْ عَبْدِ الْحَمِيدِ بْنِ سِنَانٍ، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، عَنْ أَبِيهِ، أَنَّهُ حَدَّثَهُ - وَكَانَتْ، لَهُ صُحْبَةٌ - أَنَّ رَجُلاً، سَأَلَهُ فَقَالَ يَا رَسُولَ اللَّهِ مَا الْكَبَائِرُ فَقَالَ \" هُنَّ تِسْعٌ \". فَذَكَرَ مَعْنَاهُ زَادَ \" وَعُقُوقُ الْوَالِدَيْنِ الْمُسْلِمَيْنِ وَاسْتِحْلاَلُ الْبَيْتِ الْحَرَامِ قِبْلَتِكُمْ أَحْيَاءً وَأَمْوَاتًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2875، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2875 (Wills (Kitab Al-Wasaya)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2875، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 2875 (Testamentos (Kitab Al-Wasaya)), menciona el hecho de considerar algo como lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2875 (Testaments (Kitab Al-Wasaya)), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
