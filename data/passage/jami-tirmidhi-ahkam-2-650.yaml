text: "… أَتَعْقِلُ؟! ضَحَّى رَسُولُ اللّٰه ع وَالمُسْلِمُونَ. حسن. ابن ماجه: م. هَذَا حَدِيثٌ حَسَنٌ وَالعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ العِلْمِ أَنَّ الأُضْحِيَةَ لَيْسَتْ بِوَاجِبَةٍ، وَلَكِنَّهَا سُنَّةٌ مِنْ سُنَنٍ رَسُولِ اللّه وَلِلِ يُسْتَحَبُّ أَنْ يُعْمَلَ بِهَا، وَهُوَ قَوْلُ سُفْيَانَ الثَّوْرِيِّ، وَابْنِ المُبَارَكِ. …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 650، يرد فيه ذكر الواجب، والمستحب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 650, whose wording mentions the obligatory (wajib), the recommended (mustahabb), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 650 کا اقتباس جس میں واجب، مستحب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Tirmidhi, volume numérisé 2, p. 650, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-Tirmidhi, volumen digitalizado 2, p. 650, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 650. sayfasından, farz, sünnet ve farz olmayan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, sünnet ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 650, yang menyebutkan amalan wajib, anjuran, dan sunnah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
