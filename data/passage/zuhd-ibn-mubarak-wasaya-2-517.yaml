text: "… اللّٰه سليمان إلى حمام ليغتسل انطلقت يوم اليرموك أطلب ابن عمي ومعي ماء انطلقوا بنا إلى أخيكم مطرف، لا يخلو به انظر ما تسألني، فإنك لا تسألني انقطع الصويت انقطع شراك نعل رسول الله وَلِ عمِ فو صله إنك إذا …"
