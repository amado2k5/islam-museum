text: "وخلق الإنسان من طين فأول من سكن الأرض الجن فأفسدوا فيها وسفكوا الدماء وقتل بعضهم بعضاً قال فبعث الله إليهم إبليس في جند من الملائكة"
summary:
  ar: "يروي الطبري بإسناده عن ابن عباس أن أول من سكن الأرض الجن، فأفسدوا فيها فبعث الله إليهم إبليس في جند من الملائكة."
  en: "Al-Tabari relays, with his chain, a report from Ibn Abbas that the first to dwell on the earth were the jinn, who spread corruption until God sent Iblis against them with a host of angels."
  es: "Al-Tabari relata, con su cadena de transmisión, un informe de Ibn Abbas según el cual los primeros en habitar la tierra fueron los genios, quienes propagaron la corrupción hasta que Dios envió a Iblis contra ellos con una hueste de ángeles."
  fr: "Al-Tabari rapporte, avec sa chaîne de transmission, un récit d'Ibn Abbas selon lequel les premiers habitants de la terre furent les djinns, qui répandirent la corruption jusqu'à ce que Dieu envoie Iblis contre eux avec une armée d'anges."
  ur: "الطبری نے اپنی زنجیر کے ساتھ ابن عباس سے روایت کی ہے کہ زمین پر سب سے پہلے رہنے والے جن تھے جنہوں نے فساد پھیلایا یہاں تک کہ خدا نے ابلیس کو فرشتوں کے ایک لشکر کے ساتھ ان کے خلاف بھیجا۔"
