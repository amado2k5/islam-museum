summary:
  ar: "القسم 4 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة السفر»، ويضم فيها النصوص من 1198 إلى 1249 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 4 of Sunan Abi Dawud (Prayer (Kitab Al-Salat): Detailed Rules of Law about the Prayer during Journey) in the division of the open hadith dataset the museum took its reports from: reports 1198 to 1249 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 4، عنوان «کتاب صلاۃ السفر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1198 تا 1249۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 4 de Sunan Abi Dawud (Oración (Kitab Al-Salat): Reglas detalladas sobre la oración durante el viaje) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 1198 a 1249 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
