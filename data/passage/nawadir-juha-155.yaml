label: { ar: "نوادر جحا الكبرى، ص 72 — «قولي وصلنا إلى نصف الطريق»", en: "Nawadir Juha al-Kubra, p. 72 — 'Say We Have Reached Halfway'", ur: "نوادر جحا الکبریٰ، ص 72 — «کہو کہ ہم آدھے راستے پر پہنچ گئے»", fr: "Nawadir Juha al-Kubra, p. 72 — « Dis que nous sommes à mi-chemin »", es: "Nawadir Juha al-Kubra, p. 72 — «Di que hemos llegado a la mitad del camino»", tr: "Juha'nın Büyük Fıkraları, s. 72 — “Diyelim ki yolun yarısına geldik”", id: "Anekdot Hebat Juha, hlm. 72 — “Katakanlah kita telah mencapai titik tengah”" }
text: "… قولي وصلنا إلى نصف الطريق سافر مع امرأته لزيارة بعض الأصدقاء في محل على مسافة أربعة أيام، وبعد مرور بضع دقائق على خروجهما من المدينة، التفت الشيخ إلى أمرأته، وقال لها : ماذا قطعنا من الطريق؟ فأجابته: متى مشينا اليوم …"
summary:
  ar: "خرج جحا مع زوجته في رحلة تستغرق أربعة أيام، فسألها كم قطعا من الطريق، فقالت يومين إن مشيا اليوم وغدًا، فقال إذن قد قطعا نصف الطريق. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  en: "Setting off with his wife on a four-day journey, Juha asks how far they have gone; she says two days if they walk today and tomorrow; he says then they have covered half the road. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  ur: "جحا بیوی کے ساتھ چار دن کے سفر پر نکلا اور پوچھا کہ کتنا راستہ طے ہوا؛ بیوی نے کہا کہ آج اور کل چلیں تو دو دن؛ جحا نے کہا کہ پھر ہم آدھا راستہ طے کر چکے۔ {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  fr: "Parti avec sa femme pour un voyage de quatre jours, Juha demande combien de chemin ils ont fait; elle dit deux jours s'ils marchent aujourd'hui et demain; il dit qu'ils ont alors parcouru la moitié du chemin. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  es: "Al partir con su mujer en un viaje de cuatro días, Juha pregunta cuánto han avanzado; ella dice que dos días si caminan hoy y mañana; él dice que entonces ya han recorrido la mitad del camino. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  tr: "Juha, karısıyla dört günlük bir yolculuğa çıktı. Karısına ne kadar yol kat ettiklerini sordu ve karısı, \"Bugün ve yarın yürürsek iki gün\" diye cevap verdi. Juha, \"O halde yolun yarısını kat etmişiz demektir\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 72}"
  id: "Juha melakukan perjalanan selama empat hari bersama istrinya. Ia bertanya kepada istrinya seberapa jauh mereka telah menempuh perjalanan, dan istrinya menjawab, \"Dua hari jika kita berjalan hari ini dan besok.\" Juha berkata, \"Kalau begitu kita sudah menempuh setengah perjalanan.\" {cite:juha-nawadir-kubra-djuwaydi p. 72}"
