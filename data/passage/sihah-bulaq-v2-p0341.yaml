text: |-
  ١ ف نسحخة زيادة أحذى باحنة
  وأول البيت
  أخور غائب يعطيها وبسألها
  قوله قال الكمت الحاف
  القاموس والمنقل في بيت الكعيت
  وصارت أباطعها كالارين
  وسوّى بالحذوة المفقل
  بضم اليم لا يقتصها كما نوهما
  الجوهرى وهوالذى يخصف
  تعله بنقيلة أى سوى الحافى
  والمنتعل بأياطح .كة أوالخفوة
  احتفاء التوم المرعى والمنقسل
  الضبعة ينتقلون من المرعى اذا
  احتفوه الى مرعى آخر يقول
  استوت المراعى كلها اه
  ٢٤٦
  • ⁦(فصل النون)⁩•.
  .نقثل)
  لتن منيت بناءن جدمعركة • لا تلفنا عن دماء القوم تتفل
  والنفل بالتحريك الغنيمة والهع الانفال قال لبيد • ان تقوى ربناخير نفل • تقول منه
  نفلتك تتفيلا أى أعطبتك نفلا والنفل التطوع والنفل أيضانيت فى قول الشاعر ١
  به الحوذان والنفل • ويقال لثلاث إيإل من الشهرنقل وهى بعد الغرر والنوفل البحر
  والنوفل الرجسل الكثير العطاء وقال• يأبى الظلامة منه النوفل الزفر• ونوفل اسم رجل
  والنوذلة المملحة ( قل نقل الشى تحويل من موضع الى موضع والنقل أيضا الخف
  اللحاق والفعل انحلق المرقعة والنقل بالكسر مثله يقال جاء فى نقلين له وفى نقلين له وابمع
  تقال وكذلك المنقل بالفتح قال الكميت
  وكان الاباطح مثل الارين • وشبه بالخفوة المنقل
  أى يصيب صاحب الخفّ ما يصيب ألحافى من الرمضاء وفى حديث اين مسعودرضى اللّٰه عنه
  ما من مصلى لامرأة أفضل من أشتمكانا فى بيتها ظلمة الااحر أة قديثست من البعولة فهى فى
  منقليها قال أبو عبيدلولا أنّ الرواية اتفقت فى الحديث والشعرما كان وجه الكلام عندى
  الاكسرها والمنقل أيضا الطريق فى الجبل والمنقلة المرحلة من مراحل السفر والنقل
  بالضم ما يتنقسل به على الشراب والنقهة الاسم من الانتقال من موضع الى موضع والنقل
  بالتحريك الريش ينقل من سهم فيجعل على سهم آخر قال السكميت
  لا نقل رينها ولااغب * والنقل أيضا الحجارة مع الشجر قال ابن السكيت النقل الحجارة
  مثل الافهار يقال هذا مكان نقسل بالسكسر والنقل فى البعير داء يصيب خفه فيتخزق
  والنقل المنالة فى المنطق ومنه قواهم رجل نقل وهو الحاضر الجواب قال لبيد
  ولقد يع لم صحى كلهم * بعدان السيف صبرى ونقل
  وناقات فلانا الح_ديت اذاحسة ثته وحسدثك والنقيل الطريق وكل طريق نقيل والنقيل
  ضرب من السيروهوالمداومة عليه والنقيلة المرأة الغرية يقال هوابن نقيلة ابن السكيت
  الفقيلة الرقعة التى يرقع بهماخف البعيرأ والفعل والمع النقائل أبو عبيد يقال نقلت توب
  نقلا اذا رقعته وأنقلت خقى اذا أصلحته وكذلك نقلته تنقيلا يقال نعل منقلة والتنقل
  التهوّل ونقلد تنيلااذا أكثرنة له والمنقلة بكسر القساف الشهجة التى تنقل العظم أى تكسره
  حتى يخسرج منها فرائر العظام ومناقلة الغرس أن يضع يده ورجله على غير عجر لحسن نقله
  فى المجارة قال جرير
  من كلّ مشترف وان بعد المدى • ضرم الرقاق مناقل الاجرال
  والنقال أيضا أن تشبرب الابل نهلار عالا بنفسها من غير أحسدوقد نقلتها أنا ويقال أرس
  منقل وقال الشاعر يصف فرسا
  فنقلنا صنعه حتى شتا • ناعم البال لجوجافى السنن
  والنساقلة من الناس خلاف القطان والانقلا ضرب من التم بالشأم {نقثل) النقثلة
  مشبة النيخ بثيرالتراب اذامشى وقال الراجز
  قاريت أمشى القعولى والفنجله • وتارة أنيث تبثانقشله
