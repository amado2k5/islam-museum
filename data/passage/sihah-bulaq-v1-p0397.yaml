text: |-
  قوله وقبض بكسر القاف
  وسكون الموحدة بمعنى عدد كثير
  إه وانتولى
  و٢٤
  والعديد يقال هم عديد الحصى والترى أى فى الصكثرة وفلان عديد بنى فلان أى يعدفيهم
  وعدّه فاعتد أى صار معدوداواعتديه وقول لبيد
  تطير عدائد الاشر النشفعا • ووترا والزعامة للغلام
  بعى من بعاده فى المبراث ويقال هومن عسدة المال والايام المعدودات أيام التشريق
  وأعذه لامر كذا هيأه له والاستعداد للامر التهيؤله وانهم ليشعادون ويتعدّدون على عشرة
  آلاف أى يزيدون على ذلك فى العدد وعدة المرأة أيام اقراتها وقداعدت وانقضت عدتها
  وتقول أنفذت عبدة كتب أى جهاعة كتب والعدّة بالضم الاستعداد يقال كونوا على
  عدة والعدة أيضاما أعددته لموادث الدهر من المالى والسلاح يقال أخذلالامرءدته
  وعتاده بمعنى قال الاخفس ومنه قوله تعالى جمع مالا وعدّده ويقال جعله ذاعددوالمعدان
  موضع دفتى السرج ومعدّ أبو العرب وهو معد بن عدتان وكات سيبويه بقول الميم من تفس
  الكامة لة ولهم قعد دلقلة تفعل فى الكلام وقد خواف فيه وه وتعدد الرجل أى تزيايزهم
  . أوتنسب اليهم أوتصبر على عيش معد قال عمررضى اللّٰه عنه اخش وشنوا وتعددوا. قال أبو
  عبيدة فيه قولان يقال هو من الغلظ. ومنه قيل للغلام اذاشب وعلط قد تعدد قال الراجز
  وربيته -ت اذا قعددا ويقال تعددوا أى تشبهوابعيش معدوكانوا أحسل قشف وغلظ
  فى المعاش يقول فك ونوامثلهم ودعوا التنعم وزى العجم قال وهكذاهوفى حديث له آخر
  عليكم باللبسة المعدية وأماقول معن بن أوس
  قفاانها أمست قفاراومن بها • وان كان من ذى ودناقد تعددا
  فانه يريد تباعد قال الكسائى وفى المثل ان تسمع بالمعبدى خير من أن تراه وهو تسغير معدى
  منسوب الى سعد وانما خففت الدال استثقالا للجمع بين التشديدين مع ياء التصغير يضرب
  للرجل الذى له صيت وذكر فى الناس فاذار أيتسه ازدريت مرآته وقال ابن السكيت تسمع
  بالمعسدى لا أن تراه قال وكان تأويله تأويل أمر كانه قال اسمع به ولا تره والعد بالكسر الماه
  الذى له مادّة لا تنقطع كماه العين والبثر وابهع الاعداد قال الشاعر ديمومة ما بهاعد ولاعد
  والعدأيضا الكثرة يقال انهم لذووعد وقبض والعسداد اهتسياج وجع اللديغ وذلك اذاقت
  لهسنة صنذيوم لدخ اهتاج به الالم والعددمق ورمنه وقدجاءذلك فى ضرورة الشعريقال
  عادته اللعة اذا أننه لعداد وفى الحديت مازالت أكله خيير تعاذفى فهذا أوان
  قطعت أبهرى وقال الشاعر
  ألاقى من تذكرآل ليلى • كمايلق السليم من العداد .
  ولقيت فلا ناعداد الثريا أى مرة فى الشهر وذلك أنّ القسمر ينزل النريافى كل شهر مرة ويوم
  العداديوم العطاء قال الشاعر عمّية بن الوعل
  وقائلة يوم العداد لبعلها • أرى عتبة بن الوعل بعدى تغيرا
  ويقعال بالجمل عداد أى مس من جنون وفلان فى عداد أهل الخيرأى يعدّ معه-م وعداد
  القوس رنينها وهوصوت الوتروفلان عداده فى بنى فلان اذا كان ديواته معهم أى يعد منهم
  فى الديوان وقولهم كان ذلك على عدادفلان وعدان فلان أى على عهده وزمانه قال القرزدق
  كاسرى
