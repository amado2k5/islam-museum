label: { ar: "الموطأ 107 — بلاغ عن ابن مسعود: من قبلة الرجل امرأته الوضوء", en: "Muwatta 107", es: "Muwatta 107", fr: "Muwatta 107", ur: "موطا 107", tr: "İbn Mes'ud'dan rivayet edildiğine göre, bir erkek karısını öperse abdest almalıdır. (El-Muvatta 107)", id: "Al-Muwatta 107 — Riwayat dari Ibnu Mas'ud: Jika seorang pria mencium istrinya, dia wajib berwudhu." }
summary:
  ar: "بلاغ في باب الوضوء من قبلة الرجل امرأته: يروي مالك أنه بلغه أن عبد الله بن مسعود كان يقول إن قبلة الرجل امرأته توجب الوضوء. ويذكر المحقق أن عبد الرزاق وصله من طريق أبي عبيدة عن ابن مسعود مع أن أبا عبيدة لم يسمع من أبيه، وأن ابن أبي شيبة والدارقطني والبيهقي أخرجوه من غير طريق مالك، ويحيل على اختلاف العلماء في الوضوء من القبلة عند الترمذي عقب الحديث (86). {cite:muwatta-maruf-1997 p.88}"
  tr: "Bir erkeğin karısını öptükten sonra abdest alması meselesine dair bir rivayet: Malik, Abdullah ibn Mes'ud'un, bir erkeğin karısını öpmesinin abdest almayı gerektirdiğini söylediğini işittiğini aktarır. Araştırmacı, Abdül-Razzak'ın bunu Ebu Ubeyde aracılığıyla İbn Mes'ud'dan naklettiğini, ancak Ebu Ubeyde'nin bunu babasından duymadığını belirtir. Ayrıca İbn Ebi Şeybe, el-Daraqutni ve el-Beyhaki'nin de bunu Malik'inkinden farklı zincirlerle naklettiğini kaydeder. Tirmizi'nin hadis sonrası eserinde (86) bulunan, öpüşmeden sonra abdest alma meselesi hakkındaki âlimlerin farklı görüşlerine değinir. {cite:muwatta-maruf-1997 s.88}"
  id: "Sebuah laporan mengenai masalah wudhu setelah seorang pria mencium istrinya: Malik meriwayatkan bahwa ia mendengar bahwa Abdullah ibn Mas'ud biasa mengatakan bahwa seorang pria yang mencium istrinya mewajibkan wudhu. Peneliti menyebutkan bahwa Abd al-Razzaq meriwayatkannya melalui Abu Ubaidah dari Ibn Mas'ud, meskipun Abu Ubaidah tidak mendengarnya dari ayahnya. Ia juga mencatat bahwa Ibn Abi Shaybah, al-Daraqutni, dan al-Bayhaqi meriwayatkannya melalui sanad selain Malik. Ia merujuk pada perbedaan pendapat para ulama tentang masalah wudhu setelah berciuman, sebagaimana terdapat dalam karya al-Tirmidhi setelah hadits (86). {cite:muwatta-maruf-1997 p.88}"
