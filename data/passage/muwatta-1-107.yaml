summary:
  ar: "بلاغ في باب الوضوء من قبلة الرجل امرأته: يروي مالك أنه بلغه أن عبد الله بن مسعود كان يقول إن قبلة الرجل امرأته توجب الوضوء. ويذكر المحقق أن عبد الرزاق وصله من طريق أبي عبيدة عن ابن مسعود مع أن أبا عبيدة لم يسمع من أبيه، وأن ابن أبي شيبة والدارقطني والبيهقي أخرجوه من غير طريق مالك، ويحيل على اختلاف العلماء في الوضوء من القبلة عند الترمذي عقب الحديث (86). {cite:muwatta-maruf-1997 p.88}"
