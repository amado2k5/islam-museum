label: { ar: "سنن ابن ماجه 4094 — الأب والأبوة", en: "Sunan Ibn Majah 4094 — the father and fatherhood", ur: "سنن ابن ماجہ 4094 — باپ اور والدیت" }
text: "… عَلِيُّ بْنُ مَيْمُونٍ الرَّقِّيُّ، حَدَّثَنَا أَبُو يَعْقُوبَ الْحُنَيْنِيُّ، عَنْ كَثِيرِ بْنِ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ عَوْفٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" لاَ تَقُومُ السَّاعَةُ حَتَّى تَكُونَ أَدْنَى مَسَالِحِ الْمُسْلِمِينَ بِبَوْلاَءَ \". ثُمَّ قَالَ ـ \" يَا عَلِيُّ يَا عَلِيُّ يَا عَلِيُّ \". قَالَ بِأَبِي وَأُمِّي. قَالَ \" إِنَّكُمْ سَتُقَاتِلُونَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4094، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4094 (Tribulations), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4094، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
