label: { ar: "الموطأ 1557 — مالك: الأمة إذا كانت تحت الحر ثم فارقها قبل أن تعتق، فإن نكاحه إياها وهي أمة لا يحصنها، حتى تنكح بعد عتقها ويصيبها زوجها", en: "Muwatta 1557", es: "Muwatta 1557", fr: "Muwatta 1557", ur: "موطا 1557", tr: "El-Muvatta 1557 — Malik: Eğer bir köle kadın azatlı bir erkekle evlenirse ve erkek onu azat edilmeden önce boşamışsa, kadının köle iken onunla evlenmesi, kadın azat edildikten sonra evlenip kocasıyla cinsel ilişkiye girene kadar onu kocası için helal kılmaz.", id: "Al-Muwatta 1557 — Malik: Jika seorang wanita budak menikah dengan seorang pria merdeka dan pria itu menceraikannya sebelum ia dibebaskan, maka pernikahan pria itu dengan wanita tersebut saat ia masih menjadi budak tidak menjadikan wanita itu halal bagi suaminya sampai ia menikah lagi setelah dibebaskan dan suaminya bersetubuh dengannya." }
summary:
  ar: "يقول مالك والأمة إذا كانت تحت الحر ثم فارقها قبل أن يعتق، فإنه لا يحصنها نكاحه إياها وهي أمة، حتى تنكح بعد عتقها، ويصيبها زوجها، فذلك إحصانها. {cite:muwatta-maruf-1997 p.49}"
  tr: "Malik şöyle diyor: Eğer bir köle kadın özgür bir erkekle evlenirse ve erkek özgür bırakılmadan önce ondan boşanırsa, kadının köle olduğu dönemde onunla evlenmesi, kadın özgür bırakıldıktan sonra evlenip kocasıyla evliliğin tamamlanması anlamına gelmez; evliliğin tamamlanması işte o zaman gerçekleşir. {cite:muwatta-maruf-1997 s.49}"
  id: "Malik berkata: Jika seorang wanita budak menikah dengan seorang pria merdeka dan pria itu menceraikannya sebelum ia dibebaskan, maka pernikahan pria itu dengannya saat ia masih menjadi budak tidak dianggap sebagai penyempurnaan perkawinan sampai ia menikah lagi setelah dibebaskan dan suaminya melakukan penyempurnaan perkawinan; itulah yang dianggap sebagai penyempurnaan perkawinan. {cite:muwatta-maruf-1997 p.49}"
