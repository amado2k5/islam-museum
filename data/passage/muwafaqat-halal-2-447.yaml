text: "… وجوب الزكاة بهبة المال أو إتلافه أو جمع متفرقه أو تفريق مجتمعه. وهكذا سائر الأمثلة في تحليل الحرام، وإسقاط الواجب. ومثله جار في تحريم الحلال؛ كالزوجة ترضع جارية الزوج أو الضرة لتحرم عليه. أو إثبات حق لا يثبت؛ كالوصية للوارث …"
