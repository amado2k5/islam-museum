label: { ar: "الموطأ 319 — صلاة الليل مثنى مثنى، فإذا خشي الصبح صلى واحدة توتر له", en: "Muwatta 319", es: "Muwatta 319", fr: "Muwatta 319", ur: "موطا 319", tr: "Al-Muwatta 319 — Gece namazı iki rekat halinde kılınır ve eğer kişi şafağın yaklaşmasından korkarsa, tek rekat kılarak tek sayı yapar.", id: "Al-Muwatta 319 — Shalat malam dilakukan berpasangan, dan jika seseorang khawatir akan datangnya fajar, maka ia harus shalat satu rakaat saja agar menjadi ganjil." }
text: "صلاة الليل مثنى مثنى، فإذا خشي أحدكم الصبح صلى ركعة واحدة توتر له ما قد صلى"
summary:
  ar: "أول حديث في باب الأمر بالوتر. يرويه يحيى عن مالك عن نافع وعبد الله بن دينار عن عبد الله بن عمر: سأل رجل النبي عن صلاة الليل فقال إنها مثنى مثنى، فإذا خشي أحدكم الصبح صلى ركعة واحدة توتر له ما قد صلى. ويخرّجه المحقق عند البخاري (990) ومسلم (2/171) وأبي داود (1326) والنسائي (3/233) والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الرواة عن مالك لم يختلفوا في لفظه إلا الحنيني فزاد فيه «والنهار» وذلك خطأ، والحنيني ضعيف كثير الوهم ⁦(التمهيد 13/240–241)⁩. {cite:muwatta-maruf-1997 p.180} {cite:muwatta-maruf-1997 p.181}"
  tr: "Vitr namazının emriyle ilgili bölümdeki ilk hadis. Yahya, Malik'ten, o da Nafi'den ve Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den rivayet etmiştir: Bir adam Peygamberimize gece namazı hakkında sordu ve Peygamberimiz şöyle buyurdu: \"İki rekat halinde kılınır. Eğer biriniz şafaktan korkarsa, namazını tek rekat kılsın.\" Bu hadis, Buhari (990), Müslim (2/171), Ebu Davud (1326), Nesai (3/233), Şafiî ve Beyhaki'nin hadis külliyatlarında, Malik'in sahabelerinin rivayet zincirleriyle bulunmaktadır. İbn Abdülberr'den rivayet edildiğine göre, Malik'ten rivayet edenler hadisin lafzında Huneyni hariç herkes aynı görüştedir; Huneyni ise \"ve gündüz\" diye eklemiştir ki bu bir hatadır. El-Hunaini zayıf ve birçok hataya meyillidir (el-Tamhid 13/240–241)."
  id: "Hadits pertama dalam surah ini membahas perintah untuk shalat Witir. Diriwayatkan oleh Yahya dari Malik, dari Nafi' dan Abdullah ibn Dinar, dari Abdullah ibn Umar: Seorang laki-laki bertanya kepada Nabi tentang shalat malam, dan beliau bersabda, \"Shalat malam dilakukan berpasangan dua rakaat. Jika salah seorang dari kalian khawatir akan datangnya subuh, maka hendaklah ia mengerjakan satu rakaat untuk menjadikan shalatnya ganjil.\" Hadits ini terdapat dalam kumpulan hadits al-Bukhari (990), Muslim (2/171), Abu Dawud (1326), al-Nasa'i (3/233), al-Shafi'i, dan al-Bayhaqi, melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa para perawi dari Malik tidak berbeda redaksi haditsnya, kecuali al-Hunaini yang menambahkan \"dan siang hari,\" yang merupakan kesalahan. Al-Hunaini lemah dan rentan terhadap banyak kesalahan (al-Tamhid 13/240–241)."
