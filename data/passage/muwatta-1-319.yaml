label: { ar: "الموطأ 319 — صلاة الليل مثنى مثنى، فإذا خشي الصبح صلى واحدة توتر له", en: "Muwatta 319" }
text: "صلاة الليل مثنى مثنى، فإذا خشي أحدكم الصبح صلى ركعة واحدة توتر له ما قد صلى"
summary:
  ar: "أول حديث في باب الأمر بالوتر. يرويه يحيى عن مالك عن نافع وعبد الله بن دينار عن عبد الله بن عمر: سأل رجل النبي عن صلاة الليل فقال إنها مثنى مثنى، فإذا خشي أحدكم الصبح صلى ركعة واحدة توتر له ما قد صلى. ويخرّجه المحقق عند البخاري (990) ومسلم (2/171) وأبي داود (1326) والنسائي (3/233) والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الرواة عن مالك لم يختلفوا في لفظه إلا الحنيني فزاد فيه «والنهار» وذلك خطأ، والحنيني ضعيف كثير الوهم (التمهيد 13/240–241). {cite:muwatta-maruf-1997 p.180} {cite:muwatta-maruf-1997 p.181}"
