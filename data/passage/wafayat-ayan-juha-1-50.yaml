text: "له : كان قلت! مسافة كذا كذا سنة، قال : لو قلت هذا عرف الجماعة الحاضرون غرضي، وكان قصدي الإيهام عليهم. وله نوادر كثيرة يطول ذكرها. وكنت يوماً عنده وقد قدم من الموصل رجل من فضلاء المغاربة في علم الأدب، …"
summary:
  ar: "مقطع من وفيات الأعيان وأنباء أبناء الزمان، المجلد المصوَّر 1، ص 50، فيه نادرة أو طرفة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Wafayat al-A'yan wa-Anba' Abna' al-Zaman, scan volume 1, p. 50, with an anecdote or witty tale; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "وفایت الاعیان و انبا ابنا الزمان، اسکین جلد 1، ص 50 کا اقتباس جس میں ایک نادرہ یا لطیفہ ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
