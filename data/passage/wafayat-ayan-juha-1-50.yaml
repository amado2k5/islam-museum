  tr: "\"Vafayat al-A'yan wa Anba' Abna' al-Zaman\" (Dönemin Önemli Şahsiyetlerinin Biyografileri ve İnsanlarının Haberleri) Resimli Cilt 1, sayfa 50'den, nadir veya eğlenceli bir anekdot içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Biografi Tokoh Terkemuka dan Berita tentang Orang-orang pada Masanya), Jilid Bergambar 1, hlm. 50, berisi anekdot langka atau lucu; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha and Islamic Folklore Browser."
