text: "… : نِ لَوْنُه يَتَبَّلُ هَجّا أبو الهولِ الحميرىُّ الفضلّ بنَ يحيى ثم أتاه راغبا إليه ؛ فقال له الفضل: ويلكَ بأيّ وجه تلقانى! قال: بالوجه الذى ألقى به ربّى وذنوبى اليه أكثُرُ؛ فضحك ووصله. ومن أمثال العرب فى الوَقَاح رَمَتْنِي …"
