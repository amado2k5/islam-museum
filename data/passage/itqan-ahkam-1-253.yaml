text: "… قلوبهم وقلوب من يعجبهم شانهم أخرجه الطبراني والبيهقي قال النوري ويستحب طلب القزاءة من حسن الصوت والاصغاء اليها للحديث الصحيح ولا بأس باجتماع الجماعة فى القراءة ولا بادارتها وهي ان يقرأ بعض الجماعة قطعة ثم البعض قطعة بعدها مسثلة يستحب …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 253، يرد فيه ذكر المستحب، وما لا بأس به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 253, whose wording mentions the recommended (mustahabb), what is said to be no harm; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 253 کا اقتباس جس میں مستحب، جس میں کوئی مضائقہ نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, volume numérisé 1, p. 253, dont le texte mentionne le recommandé (mustahabb), ce qui est dit sans inconvénient ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Itqan fi 'Ulum al-Qur'an de al-Suyuti, volumen digitalizado 1, p. 253, cuyo texto menciona lo recomendado (mustahabb), lo que se dice que no tiene inconveniente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 1. cildinin 253. sayfasından, tavsiye edilen ve izin verilen amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu bölüm, farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 1, halaman 253, yang menyebutkan amalan yang dianjurkan dan diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
