label: { ar: "الموطأ 2821 — عيسى بن مريم: لا تكثروا الكلام بغير ذكر الله فتقسو قلوبكم", en: "Muwatta 2821" }
summary:
  ar: "بلغ مالكا أن عيسى بن مريم كان يقول: لا تكثروا الكلام بغير ذكر الله فتقسو قلوبكم، فإن القلب القاسي بعيد من الله، ولا تنظروا في ذنوب الناس كأنكم أرباب، وانظروا في ذنوبكم كأنكم عبيد، فإنما الناس مبتلى ومعافى، فارحموا أهل البلاء واحمدوا الله على العافية. {cite:muwatta-maruf-1997 p.584}"
