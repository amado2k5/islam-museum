label: { ar: "الموطأ 2821 — عيسى بن مريم: لا تكثروا الكلام بغير ذكر الله فتقسو قلوبكم", en: "Muwatta 2821", es: "Muwatta 2821", fr: "Muwatta 2821", ur: "موطا 2821", tr: "El-Muvatta 2821 — İsa, Meryem oğlu: Allah'ı anmadan çok konuşmayın, yoksa kalpleriniz katılaşır.", id: "Al-Muwatta 2821 — Isa, putra Maryam: Janganlah kalian banyak bicara tanpa mengingat Allah, agar hati kalian tidak menjadi keras." }
summary:
  ar: "بلغ مالكا أن عيسى بن مريم كان يقول: لا تكثروا الكلام بغير ذكر الله فتقسو قلوبكم، فإن القلب القاسي بعيد من الله، ولا تنظروا في ذنوب الناس كأنكم أرباب، وانظروا في ذنوبكم كأنكم عبيد، فإنما الناس مبتلى ومعافى، فارحموا أهل البلاء واحمدوا الله على العافية. {cite:muwatta-maruf-1997 p.584}"
  tr: "Malik, Meryem oğlu İsa'nın şöyle buyurduğunu rivayet etmiştir: \"Allah'ı anmadan çok konuşmayın, yoksa kalpleriniz katılaşır. Çünkü katılaşmış kalp Allah'tan uzaktır. Başkalarının günahlarına efendileriymiş gibi bakmayın, kendi günahlarınıza hizmetkârlarıymış gibi bakın. Çünkü insanlar ya sıkıntıya düşerler ya da kurtulurlar. Öyleyse sıkıntıya düşenlere merhamet edin ve esenliğiniz için Allah'a şükredin.\" {cite:muwatta-maruf-1997 s.584}"
  id: "Malik meriwayatkan bahwa Yesus, putra Maria, biasa berkata: Janganlah banyak bicara tanpa mengingat Allah, supaya hatimu tidak menjadi keras. Sebab hati yang keras jauh dari Allah. Janganlah memandang dosa orang lain seolah-olah kamu adalah tuan mereka, tetapi pandanglah dosamu sendiri seolah-olah kamu adalah hamba mereka. Sebab manusia ada yang ditimpa kesengsaraan dan ada yang diselamatkan. Maka kasihanilah orang-orang yang ditimpa kesengsaraan dan pujilah Allah atas kesejahteraanmu. {cite:muwatta-maruf-1997 p.584}"
