label: { ar: "البخاري 4913 — مشربة الاعتزال", en: "Bukhari 4913 — the upper chamber", es: "Bujari 4913 — la cámara superior", fr: "Bukhari 4913 — la chambre haute", ur: "بخاری 4913 - ایوان بالا", tr: "Buhari 4913 — İ'tizal Okulu", id: "Al-Bukhari 4913 — Mazhab I'tizal" }
text: "فإذا هو على حصير ما بينه وبينه شيء، وتحت رأسه وسادة من أدم حشوها ليف، وعند رجليه قرظ مصبوب وعند رأسه أهب معلقة، فرأيت أثر الحصير في جنبه فبكيت، فقال: ما يبكيك؟ فقلت: إن كسرى وقيصر فيما هما فيه وأنت رسول الله، فقال: أما ترضى أن تكون لهم الدنيا ولنا الآخرة"
summary:
  ar: "في كتاب النكاح في باب الإيلاء؛ عمر يروي صعوده إلى مشربة النبي في حادثة الاعتزال ووصف فراشه وأدواته البيتية، وجواب «أما ترضى أن تكون لهم الدنيا ولنا الآخرة» — أصرح نص في الصحيح لزهد البيت النبوي."
  tr: "Evlilik Kitabı'nda, İla' (evlilik ilişkilerinden uzak durma yemini) bölümünde Ömer, Peygamber'in inzivaya çekildiği sırada onun üst odasına çıkışını, yatağını ve ev eşyalarını ve \"Onların bu dünyaya sahip olmalarına, bizim de ahirete sahip olmamıza razı değil misin?\" sorusuna verilen cevabı anlatır. Bu, Peygamber'in ailesinin zühdünü anlatan sahih hadis külliyatlarındaki en açık metindir."
  id: "Dalam Kitab Pernikahan, pada bab tentang Ila’ (sumpah untuk menjauhi hubungan suami istri), Umar menceritakan perjalanannya ke kamar atas Nabi selama masa pengasingan, dan menggambarkan tempat tidur serta perlengkapan rumah tangganya, dan jawaban atas pertanyaan “Tidakkah kalian puas bahwa mereka memiliki dunia ini dan kita memiliki akhirat?” — teks paling jelas dalam Sahih (kumpulan hadits otentik) mengenai asketisme keluarga Nabi."
