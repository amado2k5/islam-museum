label: { ar: "البخاري 4913 — مشربة الاعتزال", en: "Bukhari 4913 — the upper chamber" }
text: "فإذا هو على حصير ما بينه وبينه شيء، وتحت رأسه وسادة من أدم حشوها ليف، وعند رجليه قرظ مصبوب وعند رأسه أهب معلقة، فرأيت أثر الحصير في جنبه فبكيت، فقال: ما يبكيك؟ فقلت: إن كسرى وقيصر فيما هما فيه وأنت رسول الله، فقال: أما ترضى أن تكون لهم الدنيا ولنا الآخرة"
summary:
  ar: "في كتاب النكاح في باب الإيلاء؛ عمر يروي صعوده إلى مشربة النبي في حادثة الاعتزال ووصف فراشه وأدواته البيتية، وجواب «أما ترضى أن تكون لهم الدنيا ولنا الآخرة» — أصرح نص في الصحيح لزهد البيت النبوي."
