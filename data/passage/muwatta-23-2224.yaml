label: { ar: "الموطأ 2224 — يحيى عن مالك: في آية الوصية للوالدين والأقربين أنها منسوخة، نسخها ما نزل من قسمة الفرائض في كتاب الله", en: "Muwatta 2224", es: "Muwatta 2224", fr: "Muwatta 2224", ur: "موطا 2224", tr: "El-Muvatta 2224 — Yahya, Malik'ten rivayetle: Anne ve babaya ve akrabalara vasiyet etme hakkındaki ayet yürürlükten kaldırılmıştır; bu, Allah'ın Kitabında miras paylarının paylaşımıyla ilgili olarak indirilenlerle yürürlükten kaldırılmıştır.", id: "Al-Muwatta 2224 — Yahya berdasarkan riwayat Malik: Mengenai ayat tentang wasiat kepada orang tua dan kerabat, ayat itu telah dibatalkan; ayat itu dibatalkan oleh apa yang diturunkan mengenai pembagian warisan dalam Kitab Allah." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في هذه الآية: إنها منسوخة. قول الله تبارك وتعالى: إن ترك خيرا الوصية للوالدين والأقربين، نسخها ما نزل من قسمة الفرائض في كتاب الله عز وجل. {cite:muwatta-maruf-1997 p.314}"
  tr: "Yahya şöyle dedi: Malik'in bu ayetle ilgili olarak şöyle dediğini duydum: Bu ayet yürürlükten kaldırılmıştır. Yüce ve Mübarek Allah'ın şu sözü: \"Eğer bir kimse mal bırakırsa, onu anne babasına ve akrabalarına miras bırakmalıdır,\" bu söz, Yüce ve Kudretli Allah'ın Kitabında miras paylarının paylaşımıyla ilgili olarak vahyedilenlerle yürürlükten kaldırılmıştır. {cite:muwatta-maruf-1997 s.314}"
  id: "Yahya berkata: Saya mendengar Malik berkata mengenai ayat ini: Ayat ini telah dibatalkan. Pernyataan Allah, Yang Maha Berkah dan Maha Agung: “Jika seseorang meninggalkan harta, hendaklah ia mewariskan kepada orang tua dan kerabatnya,” telah dibatalkan oleh apa yang diwahyukan mengenai pembagian warisan dalam Kitab Allah, Yang Maha Perkasa dan Maha Agung. {cite:muwatta-maruf-1997 p.314}"
