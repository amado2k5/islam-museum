text: "حَدَّثَنَا مُحَمَّدُ بْنُ مَدُّويَهْ، قال حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ حَمَّادٍ الشُّعَيْثِيُّ، قال حَدَّثَنَا عَبَّادُ بْنُ مَنْصُورٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ خَيْرَ مَا تَدَاوَيْتُمْ بِهِ السَّعُوطُ وَاللَّدُودُ وَالْحِجَامَةُ وَالْمَشِيُّ \". فَلَمَّا اشْتَكَى رَسُولُ اللَّهِ لَدَّهُ أَصْحَابُهُ فَلَمَّا فَرَغُوا قَالَ \" لُدُّوهُمْ \". قَالَ فَلُدُّوا كُلُّهُمْ غَيْرَ الْعَبَّاسِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2047، يذكر الحجامة، واللدود والسعوط، والشكوى من العلة، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2047 (Chapters on Medicine), that mentions cupping, medicine given by the mouth-side or the nose, a complaint of an ailment, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2047، جس میں حجامہ، لدود اور سعوط، بیماری کی شکایت، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
