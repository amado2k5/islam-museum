text: "أهدى جملاً في حج أو عمرة"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أن عمر بن عبد العزيز أهدى جملاً في حج أو عمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1201) وسويد (523). {cite:muwatta-maruf-1997 p.509}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle Ömer ibn Abdülaziz'in Hac veya Umre sırasında bir deveyi kurban ettiğini nakletmiştir. Editör, bunun Malik'ten Ebu Mus'ab (1201) ve Suveyd (523) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.509}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id bahwa Umar ibn Abd al-Aziz mempersembahkan unta sebagai kurban selama Haji atau Umrah. Editor menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1201) dan Suwaid (523). {cite:muwatta-maruf-1997 p.509}"
