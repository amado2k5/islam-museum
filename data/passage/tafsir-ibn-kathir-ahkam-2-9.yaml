text: "… إلى ما كان عليه قبل النهى فان كان واجباً رده واجباً وإن كان مستحباً فمستحب أو مباحاً فمباح ومن قال إنه على الوجوب ينتقض عليه بآيات كثيرة ومن قال إنه للاباحة يرد عليه آيات أخرى والذى ينتظم الأدلة كلها هذا …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 2، ص 9، يرد فيه ذكر الواجب، والوجوب، والمستحب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 2, p. 9, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
