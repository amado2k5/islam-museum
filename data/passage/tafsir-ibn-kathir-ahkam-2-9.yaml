  id: "Cuplikan dari Tafsir Ibn Kathir, Jilid 2, halaman 9, yang membahas amalan wajib, anjuran, dan halal; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus mengurutkan amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
