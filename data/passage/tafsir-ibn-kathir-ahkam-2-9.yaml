  fr: "Un extrait de Tafsir de Ibn Kathir, volume numérisé 2, p. 9, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
