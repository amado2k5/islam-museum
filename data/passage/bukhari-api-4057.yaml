label: { ar: "صحيح البخاري 4057 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 4057 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 4057 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 4057 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos." }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا لَيْثٌ، عَنْ يَحْيَى، عَنِ ابْنِ الْمُسَيَّبِ، أَنَّهُ قَالَ قَالَ سَعْدُ بْنُ أَبِي وَقَّاصٍ ـ لَقَدْ جَمَعَ لِي رَسُولُ اللَّهِ يَوْمَ أُحُدٍ أَبَوَيْهِ كِلَيْهِمَا. يُرِيدُ حِينَ قَالَ \" فِدَاكَ أَبِي وَأُمِّي \". وَهُوَ يُقَاتِلُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4057، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4057 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4057، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4057 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
