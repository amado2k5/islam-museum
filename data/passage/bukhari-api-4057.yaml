label: { ar: "صحيح البخاري 4057 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 4057 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 4057 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 4057 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sahih al-Bukhari 4057 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sahih el-Buhari 4057 — Baba ve Babalık, Anne Babaya İyilik mi Yoksa Onlara İtaatsizlik mi?", id: "Sahih al-Bukhari 4057 — Ayah dan Peran Ayah, Berbuat Baik kepada Orang Tua atau Tidak Taat kepada Mereka" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا لَيْثٌ، عَنْ يَحْيَى، عَنِ ابْنِ الْمُسَيَّبِ، أَنَّهُ قَالَ قَالَ سَعْدُ بْنُ أَبِي وَقَّاصٍ ـ لَقَدْ جَمَعَ لِي رَسُولُ اللَّهِ يَوْمَ أُحُدٍ أَبَوَيْهِ كِلَيْهِمَا. يُرِيدُ حِينَ قَالَ \" فِدَاكَ أَبِي وَأُمِّي \". وَهُوَ يُقَاتِلُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4057، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4057 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4057، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4057 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4057 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), évoque le père et la paternité, ainsi que le devoir envers les parents et la possibilité de leur désobéissance. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sahih el-Buhari'de 4057 numaralı hadis, baba ve babalık kavramından, anne babaya saygı göstermekten veya göstermemekten bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4057, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
