label: { ar: "سنن ابن ماجه 2438 — ما خلّفه من تركة وميراث", en: "Sunan Ibn Majah 2438 — what was left behind: estate and inheritance", ur: "سنن ابن ماجہ 2438 — ترکہ اور میراث", es: "Sunan Ibn Majah 2438 — Lo que quedó: patrimonio y herencia", fr: "Sunan Ibn Majah 2438 — Ce qui a été laissé derrière: biens et héritage", tr: "Sunan İbn Majah 2438 — Miras ve vasiyet olarak geride bıraktıkları", id: "Sunan Ibn Majah 2438 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ عَبْدِ الْحَمِيدِ بْنِ بَهْرَامَ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَسْمَاءَ بِنْتِ يَزِيدَ، أَنَّ النَّبِيَّ تُوُفِّيَ وَدِرْعُهُ مَرْهُونَةٌ عِنْدَ يَهُودِيٍّ بِطَعَامٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2438، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2438 (The Chapters on Pawning), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2438، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2438 (Los capítulos sobre el empeño), menciona lo que quedó tras de sí: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 2438 (Les chapitres sur le gage), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "İbn Majah Sünen'inde yer alan 2438 numaralı hadiste, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, tarihi yerler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2438, menyebutkan apa yang ditinggalkannya berupa harta warisan. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, situs bersejarah, dan makam suci, beserta teks-teks terkait dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
