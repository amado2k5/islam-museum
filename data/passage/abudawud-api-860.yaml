label: { ar: "سنن أبي داود 860 — الأب والأبوة", en: "Sunan Abi Dawud 860 — the father and fatherhood", ur: "سنن ابی داؤد 860 — باپ اور والدیت", es: "Sunan Abi Dawud 860 — El padre y la paternidad", fr: "Sunan Abi Dawud 860 — Le père et la paternité" }
text: "… مُؤَمَّلُ بْنُ هِشَامٍ، حَدَّثَنَا إِسْمَاعِيلُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، حَدَّثَنِي عَلِيُّ بْنُ يَحْيَى بْنِ خَلاَّدِ بْنِ رَافِعٍ، عَنْ أَبِيهِ، عَنْ عَمِّهِ، رِفَاعَةَ بْنِ رَافِعٍ عَنِ النَّبِيِّ بِهَذِهِ الْقِصَّةِ قَالَ \" إِذَا أَنْتَ قُمْتَ فِي صَلاَتِكَ فَكَبِّرِ اللَّهَ تَعَالَى ثُمَّ اقْرَأْ مَا تَيَسَّرَ عَلَيْكَ مِنَ الْقُرْآنِ \". وَقَالَ فِيهِ \" فَإِذَا جَلَسْتَ فِي وَسَطِ الصَّلاَةِ فَاطْمَئِنَّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 860، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 860 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 860، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 860 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 860 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
