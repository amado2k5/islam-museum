text: "المشي خلف الجنازة من خطأ السنة"
summary:
  ar: "يرويه مالك عن ابن شهاب أنه قال: المشي خلف الجنازة من خطأ السنة. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.310}"
  tr: "Malik, İbn Şihab'dan rivayet ederek şöyle demiştir: Cenaze alayının arkasından yürümek sünnete aykırıdır. Araştırmacı, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.310}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang berkata: Berjalan di belakang iring-iringan jenazah bertentangan dengan Sunnah. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.310}"
