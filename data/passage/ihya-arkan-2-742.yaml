text: "… من كان فى قلبه مثقال ذرة من إيمان، وذكر من المثقال إلى الذرة والحردلة من الإيمان، إلى أن أخرج منها من لم يعمل حسنة قط، فما يدريك أن يكووا هؤلاء وأمثالهم المرادين، لأن التقدير وقع فى الإيمان لافى الأعمال فإن …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 2، ص 742، يذكر ما عُدّ من الإيمان، وتفاضل الإيمان في القلوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 2, p. 742, that mentions what is counted as part of faith, the degrees of faith in hearts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 2، ص 742 کا اقتباس جس میں جو ایمان میں سے گنا گیا، دلوں میں ایمان کے درجے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
