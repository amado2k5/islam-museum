text: "… اسألوا الميت قالوا يوماً : يا شيخ أنت عالم، فنرجو أن تحلَّ لنا هذا المشكل. قال: وما هو؟ قالوا : الدنيا كم ذراعاً؟ وإذا بجنازة مارةٍ في ذلك الوقت، فأشار الشيخ إلى التابوتِ، وقال لهم : هذا السؤال يردْ عليه …"
summary:
  ar: "سُئل جحا كم ذراعًا تبلغ الدنيا، فأشار إلى نعش مارّ وقال إن الميت الذي قاس الأرض هو الذي يجيب. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  en: "Asked how many cubits the world measures, Juha points to a passing coffin and says the dead man who measured the land can answer. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  ur: "جحا سے پوچھا گیا کہ دنیا کتنے ہاتھ کی ہے، تو اس نے پاس سے گزرتے جنازے کی طرف اشارہ کیا اور کہا کہ جس مُردے نے زمین ناپی ہے وہی جواب دے سکتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  fr: "Interrogé sur le nombre de coudées que mesure le monde, Juha désigne un cercueil qui passe et dit que le mort qui a mesuré la terre peut répondre. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  es: "Preguntado cuántos codos mide el mundo, Juha señala un ataúd que pasa y dice que el muerto que midió la tierra puede responder. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
