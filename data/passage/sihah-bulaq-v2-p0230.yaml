text: |-
  •⁦(باب النون)⁩
  ٢٥٧
  بفلان صرت ن خواصه وبطن الرجل على مالم يسمّ فاعلد اشتكى بطنه وبطن بالسكسر
  يبطن بطنا عظم بطمه من الشبع قال القلاخ
  ولم تضع أولادها من البطن • ولم تصبه نعسة على عدن
  والغدن الاسترخاء والفترة والمطان للقتب الحزام الذى يجعل تحت بطن البعير ويقال
  النقت -لقتا اليطان للامراذا اشستدوهو بمنزلة التصدير للرحل يقال منه أبطنت البعه
  ابطانا اذاش_ددت دطانه والابطن فى ذراع الفرس عرق فى ماطنها وهما أبطنان وبطانة
  الثوب خلاف ظهارته وبطانة الرجل وليجته وأبطغت الرجل اذا جعلته من خواصك
  وأيطنت السيف ضكشحى وبطنت الثوب ببطينا اذا جعلت ه بطانة واستبطنت الشئ
  وتبطنت الجارية قال امر والقيس
  كانى لم أركب جواد اللذة * ولم أتبطن كاعباذات خلخال
  وتبطنت المكلاً جولت فيه وابتطنت انناقة عشرة أبطن أى نتجتها عشر مرات والبطنة
  الكظة وهو أن تمتلئ من الطعام امتلاء شديدا يقال ليس للبطنة خير من خصة تتبعها
  والبطن النهسم الدى لايه-مه الابطنه والمبطون العليل البطن والمبطان الذى لايزال عظيم
  البطن من كثرة الاكل والمبطن الضامر البطان والمرأة مبطنة قال ذوالرقة
  رجيمات الكلام مبطفات * جواعل فى البرى قصباخذالا
  والبطين العظيم البطن والبطين البعيد يقال شأوبطين والبطين من منازل القمر وهوثلاثة
  كواكب صغار مسستوية التثليت كانها أنافىّ وهو بطن الهسل وصغرلات الحمل نجوم كثيرة
  على صورة الحمل فالشرطان قرناء والبطين بطنسه والتريا أليته ⁦( لسن)⁩. البلسن بالضم
  حب كالعدس وليس به ⁦( بلهن)⁩ يقال هو فى بلهنية من العيش أكسعة ورقاغية
  وهو ملحق بانهاسى بألف فى آخره وانماصارت ياء لكسر ماقبلها نن أبن
  بالمكان أقام به والبنة الرائحة طيبة كانت أومنتنة وقال
  وعيد تخدج الارآم منه * وتكره بنة الغنم الذتاب
  والجمع بذان قال ذو الرمّة يصف الذور الوحشى
  أبنّ به عود المباءة طيب * نسيم البنان فى الكناس المظلل
  قوله عود المباءة أى تور قديم الكاس وانما تصب النسيم لماتون الطيب وكان من حقه
  الاضافة فضارع قولهم هوضارب زيدا ومنه قوله تعالى ألم نجعل الارض كفانا أحياء
  وأموانا أى كفات أحياء وأموات يقول أرجت ريح مباه تناعا أصاب أبعاره من المطر
  وكناس مبنّ أى ذوبنة وهى رائحة بعر الظياء اذارعت الزهر والبنانة واحدة البنان وهى
  أطراف الاصابع وجمع القلة بذانات وربما استعاروابناء أكثر العدد لاقله قال
  خسس بنان قائئ الاظهار • يريد خسامن البنان ويقسال بنان مخضب لان كل جمع ليس بيته
  وبين واحده الا الهاءفانه يوحدويذكر والبنانة بالضم الروضة وبنانة اسم امرأة كانت
  تحت سعد ين لؤىّ بن غالب بن فهر وينسب ولده اليهاوهم رهط ثابت البنانىّ المحدث وأما
  البن الذى يؤندم بد فعرب ⁦(بون)⁩ بوانة بالضم اسم موضع وقال
  ٩
  لى
