text: "… وعثرة اللسان تزيل النعم المزاح يورث الضغائن من حلم ساد ومن تفهم ازداد معاشرة ذوى الالباب عمارة القلوب شرّ ما يحب المرءاحسد ربما اصاب الاعمى رشده وأخطأ البصير قصده الياس خير من التضرّع الى الناس لا تكن ضاحكا فى غير …"
