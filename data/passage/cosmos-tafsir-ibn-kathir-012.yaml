text: "وقد بعث الخليفة الواثق في دولته بعض أمرائِهِ، ووجَّه معه جيشًا سرية، لينظروا إلى السد ويعاينوه وينعتوه لَهُ إذا رجعوا"
summary:
  ar: "يروي ابن كثير أن الخليفة الواثق أرسل بعض أمرائه مع جيش لينظروا إلى السد ويصفوه له؛ ويذكر بعد ذلك ما نقله الرسل من وصف البناء بالحديد والنحاس وبابه العظيم وأقفاله ومدة غيبتهم، وذلك خبر تاريخي لا آية."
  en: "Ibn Kathir recounts that the caliph al-Wathiq sent some of his commanders with a force to see the dam and describe it to him. He then gives what the party reported of an iron-and-copper structure with a great gate and locks, and of an absence of over two years, as a historical report rather than a verse."
  es: "Ibn Kathir relata que el califa al-Wathiq envió a algunos de sus comandantes con un contingente militar para inspeccionar la presa y describírsela. A continuación, presenta el relato de la comitiva sobre una estructura de hierro y cobre con una gran puerta y cerraduras, y sobre una ausencia de más de dos años, como un informe histórico más que como un verso."
  fr: "Ibn Kathir rapporte que le calife al-Wathiq envoya des commandants accompagnés d'une troupe pour examiner le barrage et le lui décrire. Il présente ensuite le rapport de cette expédition, mentionnant une structure en fer et en cuivre dotée d'une grande porte et d'écluses, et une absence de plus de deux ans, comme un récit historique plutôt que comme un verset."
  ur: "ابن کثیر کا بیان ہے کہ خلیفہ الوثیق نے اپنے کچھ کمانڈروں کو ایک فوج کے ساتھ ڈیم کو دیکھنے کے لیے بھیجا اور اس کی تفصیل بیان کی۔ اس کے بعد وہ پارٹی نے لوہے اور تانبے کے ڈھانچے کے بارے میں جو ایک عظیم گیٹ اور تالے کے ساتھ اور دو سال سے زیادہ کی غیر موجودگی کی اطلاع دی ہے اسے آیت کے بجائے ایک تاریخی رپورٹ کے طور پر پیش کیا۔"
  tr: "İbn Kathir, Halife Vathiq'in barajı incelemek ve kendisine anlatmak üzere ordusuyla birlikte bazı prenslerini gönderdiğini rivayet eder; daha sonra elçilerin demir ve bakırdan yapılmış yapı, büyük kapısı ve kilitleri ile yokluk süreleri hakkında bildirdiklerini aktarır. Bu bir tarihî olaydır, bir ayet değildir."
  id: "Ibn Kathir meriwayatkan bahwa Khalifah Al-Wathiq mengutus beberapa pangerannya beserta pasukan untuk melihat bendungan tersebut dan menggambarkannya kepadanya; kemudian ia menyebutkan apa yang dilaporkan para utusan tentang konstruksi yang terbuat dari besi dan tembaga, pintu dan kunci-kuncinya yang besar, serta lamanya mereka absen. Ini adalah catatan sejarah, bukan ayat."
