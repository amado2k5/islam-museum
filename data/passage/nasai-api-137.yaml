label: { ar: "سنن النسائي 137 — الأب والأبوة", en: "Sunan al-Nasa'i 137 — the father and fatherhood", ur: "سنن نسائی 137 — باپ اور والدیت" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ مَنْصُورٍ، عَنْ سُفْيَانَ، قَالَ حَدَّثَنَا مَالِكُ بْنُ مِغْوَلٍ، عَنْ عَوْنِ بْنِ أَبِي جُحَيْفَةَ، عَنْ أَبِيهِ، قَالَ شَهِدْتُ النَّبِيَّ بِالْبَطْحَاءِ وَأَخْرَجَ بِلاَلٌ فَضْلَ وَضُوئِهِ فَابْتَدَرَهُ النَّاسُ فَنِلْتُ مِنْهُ شَيْئًا وَرَكَزْتُ لَهُ الْعَنَزَةَ فَصَلَّى بِالنَّاسِ وَالْحُمُرُ وَالْكِلاَبُ وَالْمَرْأَةُ يَمُرُّونَ بَيْنَ يَدَيْهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 137، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 137 (The Book of Purification), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 137، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
