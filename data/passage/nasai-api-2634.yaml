label: { ar: "سنن النسائي 2634 — الأب والأبوة", en: "Sunan al-Nasa'i 2634 — the father and fatherhood", ur: "سنن نسائی 2634 — باپ اور والدیت", es: "Sunan al-Nasa'i 2634 — El padre y la paternidad" }
text: "أَخْبَرَنِي عُثْمَانُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنَا عَلِيُّ بْنُ حَكِيمٍ الأَوْدِيُّ، قَالَ حَدَّثَنَا حُمَيْدُ بْنُ عَبْدِ الرَّحْمَنِ الرُّؤَاسِيُّ، قَالَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ أَيُّوبَ السَّخْتِيَانِيِّ، عَنِ الزُّهْرِيِّ، عَنْ سُلَيْمَانَ بْنِ يَسَارٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ امْرَأَةً، سَأَلَتِ النَّبِيَّ عَنْ أَبِيهَا مَاتَ وَلَمْ يَحُجَّ قَالَ \" حُجِّي عَنْ أَبِيكِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2634، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2634 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2634، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2634 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
