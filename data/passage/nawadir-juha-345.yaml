text: "… في أحد أيام صباهُ ماراً أمام دار أحد البخلاء، فرأى سِرْباً من الأوزِّ واقفاً"
summary:
  ar: "مرّ جحا فتىً ببيت رجل بخيل، فسرق إوزة وأخذها إلى زقاق ورفع رأسها، فصاحت «سوس»، فقال إنها أحكم من صاحبها، والكلمة التركية «سوس» تعني اسكت. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  en: "As a youth Juha passes a stingy man's house, steals a goose, takes it into an alley, and lifts its head; it cries 'sus'; he says it is wiser than its master; the Turkish word 'sus' means be silent. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  ur: "جحا جوانی میں ایک کنجوس آدمی کے گھر کے پاس سے گزرا، ایک قاز چرا کر گلی میں لے گیا اور اس کا سر اٹھایا، تو وہ چلائی «سوس»، جحا نے کہا کہ وہ اپنے مالک سے زیادہ سمجھ دار ہے، اور ترکی لفظ «سوس» کا مطلب ہے خاموش رہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  fr: "Dans sa jeunesse, Juha passe devant la maison d'un avare, vole une oie, l'emmène dans une ruelle et lui relève la tête ; elle crie « sus » ; il dit qu'elle est plus sage que son maître ; le mot turc « sus » signifie tais-toi. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  es: "De joven, Juha pasa junto a la casa de un hombre avaro, roba un ganso, lo lleva a un callejón y le levanta la cabeza; el ganso grita «sus»; Juha dice que es más sabio que su amo; la palabra turca «sus» significa cállate. {cite:juha-nawadir-kubra-djuwaydi p. 170}"
  tr: "Genç bir adam olan Juha, cimri bir adamın evinin önünden geçerken bir kaz çaldı, onu bir sokağa götürdü ve başını kaldırdı. Kaz \"Sous\" diye bağırdı, bunun üzerine Juha, kazın sahibinden daha akıllı olduğunu ve Türkçe \"Sous\" kelimesinin \"sessiz ol\" anlamına geldiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 170}"
  id: "Juha, seorang pemuda, melewati rumah seorang pria kikir, mencuri seekor angsa, membawanya ke sebuah gang, dan mengangkat kepalanya. Angsa itu berkicau \"Sous,\" jadi dia berkata bahwa angsa itu lebih bijak daripada pemiliknya, dan kata Turki \"Sous\" berarti \"diamlah.\" {cite:juha-nawadir-kubra-djuwaydi p. 170}"
