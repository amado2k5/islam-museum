text: "… ويجب أن يدبر إعياءه بما قيل في باب الإعياء ويجب أن لا يسافر ممتلئاً من دم أو غيره بل ينقّي بدنه، ثم يسافر. وإن كان منتخماً جاع ونام وحلّل التخمة ثم يسافر. ومن الواجب على المسافر أن يتدرّج ويرتاض يسيراً …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 261، يرد فيه ذكر الواجب، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 261, whose wording mentions the obligatory (wajib), what must be done; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج1، ص 261 کا اقتباس جس میں واجب، جو واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Canon de Medicine, vol. 1 de Ibn Sina, p. 261, dont le texte mentionne l'obligatoire (wajib), ce qui doit être fait ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Canon de Medicine, vol. 1 de Ibn Sina, p. 261, cuyo texto menciona lo obligatorio (wajib), lo que debe hacerse; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. cildinin 261. sayfasından bir alıntı, farz olan ve gerekli olan şeylerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar üzerine araştırma yapan bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Kitab Kedokteran Ibnu Sina, Jilid 1, halaman 261, menyebutkan apa yang wajib dan apa yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Kutipan ini disusun oleh seorang peneliti tentang kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
