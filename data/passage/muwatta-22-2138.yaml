label: { ar: "الموطأ 2138 — يحيى عن مالك في الرجلين يكون لهما رهن بينهما، فيقوم أحدهما ببيع رهنه، وقد كان الآخر أنظره بحقه سنة: إن كان يقدر على أن يقسم الرهن ولا ينقص حق من أنظره، بيع له نصف الرهن، وإن خيف النقص بيع الرهن كله", en: "Muwatta 2138" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في الرجلين يكون لهما رهن بينهما، فيقوم أحدهما ببيع رهنه، وقد كان الآخر أنظره بحقه سنة. قال: إن كان يقدر على أن يقسم الرهن، ولا ينقص حق الذي أنظره بحقه، بيع له نصف الرهن الذي كان بينهما، فأوفي حقه. وإن خيف أن ينقص حقه، بيع الرهن كله، فأعطي الذي قام ببيع رهنه حقه من ذلك. فإن طابت نفس الذي أنظره بحقه أن يدفع نصف الثمن إلى الراهن، وإلا حلف المرتهن أنه ما أنظره إلا ليوقف لي رهني على هيئته، ثم أعطي حقه عاجلا. {cite:muwatta-maruf-1997 p.273} {cite:muwatta-maruf-1997 p.274}"
