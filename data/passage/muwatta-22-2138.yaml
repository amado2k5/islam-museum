label: { ar: "الموطأ 2138 — يحيى عن مالك في الرجلين يكون لهما رهن بينهما، فيقوم أحدهما ببيع رهنه، وقد كان الآخر أنظره بحقه سنة: إن كان يقدر على أن يقسم الرهن ولا ينقص حق من أنظره، بيع له نصف الرهن، وإن خيف النقص بيع الرهن كله", en: "Muwatta 2138", es: "Muwatta 2138", fr: "Muwatta 2138", ur: "موطا 2138", tr: "El-Muvatta 2138 — Yahya, Malik'ten rivayetle, iki adamın ortaklaşa sahip oldukları bir rehinle ilgili olarak şöyle der: Bunlardan biri rehinini satarken, diğeri ona hakkı için bir yıllık süre tanımıştır: Eğer rehinini, kendisine süre tanıyanın hakkını azaltmadan bölebiliyorsa, rehininin yarısı onun adına satılır. Eğer hakkın azalmasından korkuluyorsa, rehininin tamamı satılır.", id: "Al-Muwatta 2138 — Yahya, berdasarkan riwayat Malik, mengenai dua orang yang memiliki jaminan bersama, dan salah seorang dari mereka menjual jaminannya, sementara yang lain telah memberikan kepadanya masa tenggang satu tahun untuk haknya: Jika ia mampu membagi jaminan tanpa mengurangi hak orang yang memberikan masa tenggang kepadanya, maka setengah dari jaminan tersebut dijual untuknya. Jika ada kekhawatiran akan mengurangi hak tersebut, maka seluruh jaminan tersebut dijual." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في الرجلين يكون لهما رهن بينهما، فيقوم أحدهما ببيع رهنه، وقد كان الآخر أنظره بحقه سنة. قال: إن كان يقدر على أن يقسم الرهن، ولا ينقص حق الذي أنظره بحقه، بيع له نصف الرهن الذي كان بينهما، فأوفي حقه. وإن خيف أن ينقص حقه، بيع الرهن كله، فأعطي الذي قام ببيع رهنه حقه من ذلك. فإن طابت نفس الذي أنظره بحقه أن يدفع نصف الثمن إلى الراهن، وإلا حلف المرتهن أنه ما أنظره إلا ليوقف لي رهني على هيئته، ثم أعطي حقه عاجلا. {cite:muwatta-maruf-1997 p.273} {cite:muwatta-maruf-1997 p.274}"
  tr: "Yahya şöyle dedi: Malik'in, birlikte rehin almış iki adam hakkında şöyle dediğini duydum: Bunlardan biri rehinini satarken, diğeri ona borcu için bir yıllık ödeme erteleme süresi vermişti. Malik şöyle dedi: Eğer rehin, ödeme erteleme süresi verenin payını azaltmadan bölünebiliyorsa, aralarındaki rehin yarısının satılması ve payının ödenmesi gerekir. Ancak payının azalmasından korkuluyorsa, rehin bütün olarak satılmalı ve rehinini satan kişiye satıştan payı verilmelidir. Ödeme erteleme süresi veren kişi, rehin verene fiyatın yarısını ödemeye razıysa, her şey yolundadır. Aksi takdirde, rehin alan kişi, rehininin orijinal halinde kalması için ödeme erteleme süresi verdiğine yemin etmeli ve ardından payı hemen verilmelidir. {cite:muwatta-maruf-1997 s.273} {cite:muwatta-maruf-1997 s.274}"
  id: "Yahya berkata: Aku mendengar Malik berkata tentang dua orang yang bersama-sama memegang gadai, dan salah satu dari mereka menjual gadainya, sementara yang lain telah memberinya masa tenggang satu tahun atas hutangnya: Dia berkata: Jika dia mampu membagi gadai tanpa mengurangi bagian orang yang memberikan masa tenggang, maka setengah dari gadai yang ada di antara mereka harus dijual untuknya, dan bagiannya harus dibayar. Tetapi jika ada kekhawatiran bahwa bagiannya akan berkurang, maka seluruh gadai harus dijual, dan orang yang menjual gadainya harus diberikan bagiannya dari penjualan itu. Jika orang yang memberikan masa tenggang bersedia membayar setengah harga kepada pemberi gadai, maka semuanya baik-baik saja. Jika tidak, penerima gadai harus bersumpah bahwa dia hanya memberikan masa tenggang agar gadainya tetap dalam kondisi semula, dan kemudian dia harus segera diberikan bagiannya. {cite:muwatta-maruf-1997 p.273} {cite:muwatta-maruf-1997 p.274}"
