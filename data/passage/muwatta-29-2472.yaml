summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن الطبيب إذا ختن فقطع الحشفة، إن عليه العقل، وأن ذلك من الخطأ الذي تحمله العاقلة، وأن كل ما أخطأ به الطبيب أو تعدى، إذا لم يتعمد ذلك، ففيه العقل. {cite:muwatta-maruf-1997 p.422}"
