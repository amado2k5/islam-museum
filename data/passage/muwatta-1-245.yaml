label: { ar: "الموطأ 245 — أبو هريرة: الذي يرفع رأسه قبل الإمام ناصيته بيد شيطان", en: "Muwatta 245" }
text: "الذي يرفع رأسه ويخفضه قبل الإمام فإنما ناصيته بيد شيطان"
summary:
  ar: "أول أثر في باب ما يفعل من رفع رأسه قبل الإمام. يرويه يحيى عن مالك عن محمد بن عمرو بن علقمة عن مليح بن عبد الله السعدي عن أبي هريرة قوله: الذي يرفع رأسه ويخفضه قبل الإمام إنما ناصيته بيد شيطان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن مالكاً رواه موقوفاً ولم يُختلف عليه، وأن الدراوردي رفعه ولا يصح إلا موقوفاً بهذا الإسناد (التمهيد 13/59)، ويذكر أن في الصحيحين من حديث أبي هريرة مرفوعاً الوعيد لمن يرفع رأسه قبل الإمام بأن يجعل الله رأسه رأس حمار. {cite:muwatta-maruf-1997 p.146}"
