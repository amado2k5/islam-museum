label: { ar: "الموطأ 245 — أبو هريرة: الذي يرفع رأسه قبل الإمام ناصيته بيد شيطان", en: "Muwatta 245", es: "Muwatta 245", fr: "Muwatta 245", ur: "موطا 245", tr: "El-Muvatta 245 — Ebu Hurayra: İmamın huzurunda başını kaldıranın alnı şeytanın elindedir.", id: "Al-Muwatta 245 — Abu Hurairah: Barangsiapa mengangkat kepalanya di hadapan Imam, dahinya berada di tangan setan." }
text: "الذي يرفع رأسه ويخفضه قبل الإمام فإنما ناصيته بيد شيطان"
summary:
  ar: "أول أثر في باب ما يفعل من رفع رأسه قبل الإمام. يرويه يحيى عن مالك عن محمد بن عمرو بن علقمة عن مليح بن عبد الله السعدي عن أبي هريرة قوله: الذي يرفع رأسه ويخفضه قبل الإمام إنما ناصيته بيد شيطان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر أن مالكاً رواه موقوفاً ولم يُختلف عليه، وأن الدراوردي رفعه ولا يصح إلا موقوفاً بهذا الإسناد ⁦(التمهيد 13/59)⁩، ويذكر أن في الصحيحين من حديث أبي هريرة مرفوعاً الوعيد لمن يرفع رأسه قبل الإمام بأن يجعل الله رأسه رأس حمار. {cite:muwatta-maruf-1997 p.146}"
  tr: "İmamın huzurunda başını kaldıran kimsenin ne yapması gerektiğiyle ilgili ilk hadis, Yahya'nın Malik'ten, o da Muhammed ibn Amr ibn Alkame'den, o da Malih ibn Abdullah el-Saadi'den, o da Ebu Hurayra'dan rivayet ettiğine göre şöyledir: \"İmamın huzurunda başını kaldırıp indiren kimsenin alnındaki saç tutamı şeytanın elindedir.\" Araştırmacı, Ebu Musab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve İbn Abd el-Barr'ın da Malik'in bunu bir Sahabe sözü (mevkuf) olarak rivayet ettiğini ve bu konuda bir ihtilaf bulunmadığını, el-Darawardi'nin ise bunu bir Peygamber rivayeti (merfu') seviyesine yükselttiğini ve bu rivayet zinciriyle Sahabe sözü dışında sahih olmadığını söylediğini aktarmaktadır (el-Tamhid 13/59). Ayrıca, iki Sahih hadiste (Buhari ve Müslim) Ebu Hurayra'dan rivayet edilen ve merfu mertebesine yükseltilmiş bir hadis bulunduğunu, imamın huzurunda başını kaldıran kimsenin Allah'ın başını eşek başı yapacağı konusunda uyarıldığını da belirtiyor. {cite:muwatta-maruf-1997 s.146}"
  id: "Hadits pertama mengenai apa yang harus dilakukan seseorang jika mereka mengangkat kepala di hadapan imam. Diriwayatkan oleh Yahya dari Malik, dari Muhammad ibn Amr ibn Alqamah, dari Malih ibn Abdullah al-Saadi, dari Abu Hurairah, yang berkata: “Barangsiapa mengangkat dan menurunkan kepalanya di hadapan imam, ubun-ubunnya berada di tangan setan.” Peneliti menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik, dan mengutip Ibnu Abd al-Barr yang mengatakan bahwa Malik meriwayatkannya sebagai pernyataan seorang Sahabat (mawquf) dan tidak ada perbedaan pendapat tentangnya, dan bahwa al-Darawardi mengangkatnya ke tingkat riwayat Nabi (marfu’), dan tidak sahih kecuali sebagai pernyataan seorang Sahabat dengan sanad ini (al-Tamhid 13/59). Ia juga menyebutkan bahwa dalam dua kitab Sahih (Bukhari dan Muslim), terdapat hadits dari Abu Hurairah, yang diangkat ke tingkat riwayat Nabi (marfu’), dengan peringatan kepada siapa pun yang mengangkat kepalanya di hadapan imam bahwa Allah akan menjadikan kepalanya seperti kepala keledai. {cite:muwatta-maruf-1997 p.146}"
