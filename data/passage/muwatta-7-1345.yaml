label: { ar: "الموطأ 1345 — أنس بن مالك: لما خرج النبي إلى خيبر أتاها ليلا، فلما أصبح خرجت يهود بمساحيهم، فقال الله أكبر خربت خيبر", en: "Muwatta 1345" }
text: "صَبَاحُ الْمُنْذَرينَ"
summary:
  ar: "يروي مالك عن حميد الطويل عن أنس بن مالك أن رسول الله حين خرج إلى خيبر أتاها ليلا، وكان إذا أتى قوما بليل لم يغر حتى يصبح، فلما أصبح خرجت يهود بمساحيهم ومكاتلهم، فلما رأوه قالوا محمد والله، محمد والخميس. فقال رسول الله الله أكبر، خربت خيبر، إنا إذا نزلنا بساحة قوم فساء صباح المنذرين. {cite:muwatta-maruf-1997 p.601}"
