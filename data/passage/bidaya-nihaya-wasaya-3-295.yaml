text: "… ثلاثة المسيب. قال: عرضت عائشة على أبيها رؤيا وكان من أعبر اقمار وقعن في حجري، فقال لها: إن صدقت رؤياك دفن في بيتك من خير أهل الأرض ثلاثة، للما قبض رسول اللّٰه قال: يا عائشة هذا خير أقمارك. ورواه مالك …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 295، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 295, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 295 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 3, pág. 295, que menciona un lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 3, p. 295), mentionnant un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 3. cildinin 295. sayfasından alınan bir alıntı, ölüm ve vefat anını, defin, mezar ve istirahat yerini ele almaktadır; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, \"Vasiyetler, Miraslar, Antikalar ve İstirahat Yerleri\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Permulaan dan Akhir), Jilid 3, halaman 295, menyebutkan saat kematian dan wafat, penguburan, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Peristirahatan\"."
