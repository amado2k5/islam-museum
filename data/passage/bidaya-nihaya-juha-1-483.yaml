text: "وكان حسن الشكل والخلق، طيب النفس مليح المجاورة والمجالسة، كثير المفاكهة، أقام مدة بالحجاز واجتمع بابن سبعين وبالتقي الحوراني، وأخذ النحو عن ابن مالك وابنه بدر الدين وصحبه مدة، وقد صحبه الشهاب محمود مدة خمسين سنة، وكان يثني عليه بالزهد …"
