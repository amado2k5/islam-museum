text: "… ضعيف.، وابن ماجه من رواية سيف بن هارون، عن سليمان وخرَّج الترمذي التيمي، عن أبي عثمان، عن سلمان قال : سئل رسول اللّٰه وَلِليه عَنِ السَّمن والجُبن والفراء، فقال : الحلالُ ما أحلَّ اللّٰه في كتابه، والحرامُ ما حرّم اللّٰه …"
