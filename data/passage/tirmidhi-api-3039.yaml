label: { ar: "جامع الترمذي 3039 — قراءات القرآن", en: "Jami' al-Tirmidhi 3039 — the readings of the Qur'an", ur: "جامع ترمذی 3039 — قرآن کی قراءتیں", es: "Jami' al-Tirmidhi 3039 — Las lecturas del Corán", fr: "Jami' al-Tirmidhi 3039 — les lectures du Coran" }
text: "… رَسُولُ اللَّهِ \" يَا أَبَا بَكْرٍ أَلاَ أُقْرِئُكَ آيَةً أُنْزِلَتْ عَلَىَّ \". قُلْتُ بَلَى يَا رَسُولَ اللَّهِ. قَالَ فَأَقْرَأَنِيهَا فَلاَ أَعْلَمُ إِلاَّ أَنِّي قَدْ كُنْتُ وَجَدْتُ انْقِصَامًا فِي ظَهْرِي فَتَمَطَّأْتُ لَهَا فَقَالَ رَسُولُ اللَّهِ \" مَا شَأْنُكَ يَا أَبَا بَكْرٍ \". قُلْتُ يَا رَسُولَ اللَّهِ بِأَبِي أَنْتَ وَأُمِّي وَأَيُّنَا لَمْ يَعْمَلْ سُوءًا وَإِنَّا لَمَجْزِيُّونَ بِمَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3039، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 3039 (Chapters on Tafsir), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 3039، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3039 (Capítulos sobre Tafsir), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3039 (Chapitres sur le Tafsir), mentionne les lectures du Coran. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
