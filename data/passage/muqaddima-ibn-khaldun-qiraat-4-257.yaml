text: "… هذا مذهب أهل الأمصار بالمغرب و من تبعهم من قرى البربر، أمم المغرب في ولدانهم إلى أن يجاوزوا حد البلوغ إلى الشبيبة. و كذا في الكبير إذا رجع مدارسة القرآن بعد طائفة من عمره. فهم لذلك أقوم على رسم القرآن …"
summary:
