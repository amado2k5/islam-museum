text: "… دُونَهُ فَلَمْ يُسْلِمْهُ لَهُمْ؛ مَشَى رِجَالٌ مِنْ أَشْرَافِ قُرَيْشِ إِلَى أَبِي طالب، عُتْبَةُ وشَيْبَةُ ابنا ربيعةَ بن عَبْدٍ شَمْس بن عبد مَنَاف بن قُصَي بن كلاب بن مُرَّة بن كَعْب بن لُؤَيّ بن غالب، وأبو سُفْيَان بن حَرْب بن أمَيَّة …"
summary:
