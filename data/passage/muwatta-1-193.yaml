label: { ar: "الموطأ 193 — سعيد بن المسيب: من صلى بفلاة صلى معه الملائكة", en: "Muwatta 193", es: "Muwatta 193", fr: "Muwatta 193", ur: "موطا 193", tr: "El-Muvatta 193 — Sa'id ibn el-Musayyab: Çölde namaz kılan kimseye melekler de onunla birlikte namaz kılar.", id: "Al-Muwatta 193 — Sa’id ibn al-Musayyab: Barangsiapa yang berdoa di padang pasir, para malaikat akan berdoa bersamanya." }
text: "من صلى بأرض فلاة صلى عن يمينه ملك وعن شماله ملك، فإذا أذن وأقام الصلاة أو أقام صلى وراءه من الملائكة أمثال الجبال"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه كان يقول، في باب النداء في السفر وعلى غير وضوء: من صلى في أرض فلاة صلى عن يمينه ملك وعن شماله ملك، فإذا أذّن وأقام صلى وراءه من الملائكة أمثال الجبال. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق رواه عن ابن عيينة عن يحيى بن سعيد. {cite:muwatta-maruf-1997 p.122}"
  tr: "Malik'in Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet ettiği bir hadiste, yolculuk halindeyken ve abdestsizken ezan okumakla ilgili olarak şöyle dediği belirtilir: \"Kim ıssız bir yerde namaz kılarsa, sağında bir melek, solunda bir melek namaz kılar. Ezan ve ikamet okuduğunda ise, dağlar gibi melekler onun arkasında namaz kılar.\" Araştırmacı, bu hadisin Ebu Mus'ab ve Suveyd tarafından Malik'ten, Abdül-Razzaq tarafından da İbn Uyaynah'tan, o da Yahya ibn Sa'id'den rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.122}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, menyatakan bahwa beliau biasa berkata, mengenai seruan azan ketika bepergian dan tanpa wudhu: \"Barang siapa yang shalat di tempat yang sepi, malaikat akan shalat di sebelah kanannya dan malaikat di sebelah kirinya. Ketika ia mengumandangkan azan dan iqamah, malaikat-malaikat seperti gunung akan shalat di belakangnya.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan bahwa 'Abd al-Razzaq meriwayatkannya dari Ibn 'Uyaynah, dari Yahya ibn Sa'id. {cite:muwatta-maruf-1997 p.122}"
