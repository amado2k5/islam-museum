label: { ar: "الموطأ 193 — سعيد بن المسيب: من صلى بفلاة صلى معه الملائكة", en: "Muwatta 193" }
text: "من صلى بأرض فلاة صلى عن يمينه ملك وعن شماله ملك، فإذا أذن وأقام الصلاة أو أقام صلى وراءه من الملائكة أمثال الجبال"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه كان يقول، في باب النداء في السفر وعلى غير وضوء: من صلى في أرض فلاة صلى عن يمينه ملك وعن شماله ملك، فإذا أذّن وأقام صلى وراءه من الملائكة أمثال الجبال. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق رواه عن ابن عيينة عن يحيى بن سعيد. {cite:muwatta-maruf-1997 p.122}"
