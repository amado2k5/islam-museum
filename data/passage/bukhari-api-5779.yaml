label: { ar: "صحيح البخاري 5779 — تمر العجوة، السم", en: "Sahih al-Bukhari 5779 — 'ajwa dates; poison", ur: "صحیح بخاری 5779 — عجوہ کھجور، زہر" }
text: "حَدَّثَنَا مُحَمَّدٌ، أَخْبَرَنَا أَحْمَدُ بْنُ بَشِيرٍ أَبُو بَكْرٍ، أَخْبَرَنَا هَاشِمُ بْنُ هَاشِمٍ، قَالَ أَخْبَرَنِي عَامِرُ بْنُ سَعْدٍ، قَالَ سَمِعْتُ أَبِي يَقُولُ، سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنِ اصْطَبَحَ بِسَبْعِ تَمَرَاتٍ عَجْوَةٍ لَمْ يَضُرَّهُ ذَلِكَ الْيَوْمَ سَمٌّ وَلاَ سِحْرٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5779، يذكر تمر العجوة، والسم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5779 (Medicine), that mentions 'ajwa dates, poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5779، جس میں عجوہ کھجور، زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
