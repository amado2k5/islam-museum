label: { ar: "الموطأ 2083 — مالك: من وهب شقصا في دار أو أرض مشتركة، فأثابه الموهوب له بها نقدا أو عرضا، فإن الشركاء يأخذونها بالشفعة إن شاءوا، ويدفعون إلى الموهوب له قيمة مثوبته", en: "Muwatta 2083", es: "Muwatta 2083", fr: "Muwatta 2083", ur: "موطا 2083", tr: "El-Muvatta 2083 — Malik: Bir kimse bir evdeki veya ortak arazideki payını bağışlarsa ve alan kişi ona nakit veya mal ile karşılık verirse, ortaklar isterlerse öncelikli satın alma hakkıyla onu alabilirler ve alan kişiye verdiği karşılığın bedelini ödemek zorundadırlar.", id: "Al-Muwatta 2083 — Malik: Jika seseorang memberikan bagian dalam rumah atau tanah yang dibagi, dan penerima memberikan imbalan berupa uang atau barang, maka para mitra boleh mengambilnya dengan hak prioritas jika mereka mau, dan mereka wajib membayar kepada penerima nilai imbalannya." }
summary:
  ar: "قال مالك: من وهب شقصا في دار، أو أرض مشتركة، فأثابه الموهوب له بها نقدا أو عرضا، فإن الشركاء يأخذونها بالشفعة إن شاءوا، ويدفعون إلى الموهوب له قيمة مثوبته، دنانير أو دراهم. {cite:muwatta-maruf-1997 p.253}"
  tr: "Malik şöyle demiştir: Bir kimse bir evdeki veya ortak arazideki payını devrettiğinde ve alan kişi ona nakit veya mal ile karşılık verdiğinde, diğer ortaklar isterlerse öncelikli olarak alabilirler ve alan kişiye, ister dinar ister dirhem olsun, karşılığını ödemek zorundadırlar. {cite:muwatta-maruf-1997 s.253}"
  id: "Malik berkata: Jika seseorang memberikan sebagian dari rumah atau tanah yang dibagi, dan penerima memberikan imbalan berupa uang tunai atau barang, maka para mitra lainnya boleh mengambilnya dengan hak prioritas jika mereka mau, dan mereka wajib membayar kepada penerima nilai imbalan tersebut, baik dalam dinar maupun dirham. {cite:muwatta-maruf-1997 p.253}"
