label: { ar: "مسلم 945 — قيراط وقيراطان في شهود الجنازة", en: "Muslim 945 — A qirat or two for attending the funeral" }
text: "قال أبو هريرة: قال رسول الله: من شهد الجنازة حتى يصلي عليها فله قيراط، ومن شهدها حتى تدفن فله قيراطان، قيل: وما القيراطان؟ قال: مثل الجبلين العظيمين، فلما بلغ ابنَ عمر قال: لقد ضيعنا قراريط كثيرة"
summary:
  ar: "رواية أبي هريرة في باب أجر شهود الجنازة من كتاب الجنائز في صحيح مسلم؛ قيراطٌ لمن صلى عليها وقيراطان لمن تبعها حتى الدفن، وقول ابن عمر «لقد ضيعنا قراريط كثيرة»."
