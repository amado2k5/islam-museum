text: "… وإنما يجوز الحذف في هذين الموضعين. ووجهها غيره بوجهين: أحدهما : أن يكون صاحبي مضافًا وفصل بين المضاف إليه بالجار والمجرور عناية بتقديم لفظ الإضافة، وفي ذلك جمع بين إضافتين إلى نفسه تعظيمًا للصديق، ونظيره قراءة ابن عامر وَكَذَلِكَ زَيَّنَ …"
summary:
