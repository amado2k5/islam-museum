label: { ar: "صحيح البخاري 7014 — الرقية", en: "Sahih al-Bukhari 7014 — ruqya recited over the sick", ur: "صحیح بخاری 7014 — رقیہ" }
text: "… بْنِ سَلاَمٍ، قَالَ رَأَيْتُ كَأَنِّي فِي رَوْضَةٍ، وَسَطَ الرَّوْضَةِ عَمُودٌ فِي أَعْلَى الْعَمُودِ عُرْوَةٌ، فَقِيلَ لِي ارْقَهْ. قُلْتُ لاَ أَسْتَطِيعُ. فَأَتَانِي وَصِيفٌ فَرَفَعَ ثِيَابِي فَرَقِيتُ، فَاسْتَمْسَكْتُ بِالْعُرْوَةِ، فَانْتَبَهْتُ وَأَنَا مُسْتَمْسِكٌ بِهَا، فَقَصَصْتُهَا عَلَى النَّبِيِّ فَقَالَ \" تِلْكَ الرَّوْضَةُ رَوْضَةُ الإِسْلاَمِ، وَذَلِكَ الْعَمُودُ عَمُودُ الإِسْلاَمِ، وَتِلْكَ الْعُرْوَةُ عُرْوَةُ الْوُثْقَى، لاَ تَزَالُ مُسْتَمْسِكًا بِالإِسْلاَمِ حَتَّى تَمُوتَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 7014، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 7014 (Interpretation of Dreams), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 7014، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
