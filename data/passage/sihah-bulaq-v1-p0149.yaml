text: |-
  ٤٩٢
  والعرش والعريش ما يستظل به وعرش القدم مانتاً فى ظه رها وفيه الاصابع وعرش السماك
  أربعة كواكب صغار أسفل من العواء يقال انهاعجز الاسد قال ابن أحر
  بانت عليه ليلة عرشية شربت وبات على نقامتهدم
  وعرش البئرطيها بانلحشب بعد أن يطوى أسفلها بالحجارة قدر قامة فذلك انخشب هو العرش
  والجمع عروش قال الشاعر (القطام
  ومالمشابات العروش بقية • اذا استل من تحت العروس الدعائم
  والمثابة أعلى البتريحيث يتوم الساقى قال الشماخ
  ولمبارأيت الامرءرش هوية • تسليت حاجات الفؤاد بشمرا
  اله ويه موضع يهوى من عليه أى يسقط وعرش يعرش ويعرش عرشا أى بن بناء من خشب
  وبئر معروشة وكروم معروشات والعريش عريش الكرم والعريش شبه الهودج وليس
  به يتخذذلك للمرأة تقعدفيه على بعيرها قال رؤية
  اماترى دهراحنانى خفضا * اطر الصناعين العريش القعضا
  والعريس خيمة من خشب وتمام والجمع عرش مثل قليب وقلب ومنه قيل لبيوت مكة
  العرش لانهاعيدان تنصب ويظال عليها وفى الحديث تمتعنا مع رسول اللّٰه صلى اللّه عليه وسلم
  وقلان كافر بالعرشءمن قال عروش فواحدهاعرش مثل فلس وفلوس ومنه الحسديت انّ
  ابن عمر رضى اللّٰه عنه كان يقطع التلبية اذا نظر الى عروش مكة وعرّشت الكرم بالعروش
  تعريشا ويقال أيضاءرّش الحار بعانته تعريشا اذا حل عليها ورفع رأسه وشهافاه
  والعرش بالضم أحدعرشى العنق وsمالحتان مستطيلتان فى ناحيى العنق وأنشد الاصمعى
  وعبديغوث تحبل العيرحوله * قد ا-تزعرشيه الحسام المذكر
  ويروى قد اعتزواعترش العنب اذاعلا على العراش (عشش أعششت القوم اذانزات
  منزلاقد نزلوه قبلك فا ذيتهم حتى يتحوّلوا من أجلك قال الفرزدق يضف القطامى
  فلوتركت نامت ولكن أعشها • اذى من قلاص كالخنىّ المعطف
  والعشة النخلة اذا قل معفها ردق أسفلها وقد عششت النخلة وشجرة عشة دقيقة القضبان
  لئيمة المنبت قال جرير
  فماشجرات عيصك فى قريش • بعشات الفروع ولاضواحى
  والعشة من النساء القليلة اللحم والرجل عش قال الراجز
  تضحك منى أن رأتن عشا
  يقال عس بدنه أى ضمر وغحل وأعشه اللّٰه سبجانه وناقة عشة بينة العشئر والعشاشة
  والعشوشة وعش الرجل معروفه أى أقله ويقال سقاه سجلاعشا أى قليلا قالرؤية
  حجاج مامهلك بالمعشوش وعش الطائرموضعه الذى يجمعه من دقاق العيدان وغسيرها
  وجمعه عششة وعشاش وأعشاش وهوفى افنان الشجر فاذا كان فى جبل أوجدارا ونحوهما
  فهو وكرووكن واذا كان فى الارض فهوأفحوص وأدحىّ وقدعشش الطائرتعشيشا أى اتخذ
  عشاوموضع كذا معنسْ الطيوروعشش الخبز أيضاتكرج ويبس وأعشاش موضع
  قال الفرزدق يخاطب نفسه:
  عرت
