text: "… بنِ سِيرِينَ قَالَ : كُنَّا عِنْدَ أَبِي هُرَيْرَةَ وَعَلَيْهِ ثَوْبَانِ مُمَشَّقَانِ مِنْ كَتَّانٍ، فَمَخَطَ فِي أَحَدِهِمَا، ثُمَّ قَالَ : بَخِ بَخٍ، يَتَمَخَّطُ أَبُو هُرَيْرَةَ فِي الكَتَّانِ، لَقَدْ رَأَيْتُنِي وَإِنِّي لَأَخِرُّ فِيمَا بَيْنَ مِنْبَرِ رَسُولِ اللّٰه وَحُجْرَةِ عَائِشَةَ مِنَ الجُوعِ مَغْشِيًّا …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 865، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 865, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 865 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 2, pág. 865, que menciona una reliquia conservada tras su propietario, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Jami' al-Tirmidhi, volume 2, page 865, mentionnant une relique conservée après son propriétaire, une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 865. sayfasından bir alıntıda, korunmuş bir kutsal emanet, bir defin, bir mezar ve bir türbeden bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, kutsal emanetler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 865, menyebutkan sebuah relik yang terpelihara, sebuah pemakaman, sebuah kuburan, dan sebuah tempat suci; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, relik, dan tempat suci."
