text: "… بنِ سِيرِينَ قَالَ : كُنَّا عِنْدَ أَبِي هُرَيْرَةَ وَعَلَيْهِ ثَوْبَانِ مُمَشَّقَانِ مِنْ كَتَّانٍ، فَمَخَطَ فِي أَحَدِهِمَا، ثُمَّ قَالَ : بَخِ بَخٍ، يَتَمَخَّطُ أَبُو هُرَيْرَةَ فِي الكَتَّانِ، لَقَدْ رَأَيْتُنِي وَإِنِّي لَأَخِرُّ فِيمَا بَيْنَ مِنْبَرِ رَسُولِ اللّٰه وَحُجْرَةِ عَائِشَةَ مِنَ الجُوعِ مَغْشِيًّا …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 865، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
