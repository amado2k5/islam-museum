text: "… نزلوا بدراً ووردت عليهم روايا قريش، وفيهم غلام أسود لبني الحجاج، فأخذوه، فكان أصحاب رسول اللّٰه وليلي يسألونه عن أبي سفيان وأصحابه، فيقول: مالي علم بأبي سفيان، ولكن هذا أبو جهل وعتبة وشيبة وأمية بن خلف، فإذا قال ذلك ضربوه، …"
