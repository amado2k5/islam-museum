text: "المطر، وأما العطاء فقد ينقطع جملة(٣). وأيضا فكل ذلك شرط ليس في كتاب الله تعالى فهو باطل، وإنما يجوز الأجل إلى ما لا يتأخر ساعة ولا يتقدم، كالشهور العربية والعجمية؛ أو كطلوع الشمس أو غروبها، أو طلوع القمر أو غروبه،"
