text: "يهديهم إليه. فأمر معاوية فكتب: (بسم الله الرحمن الرحيم، من محمد رسول الله عله إلى الأقيال من حضرموت، بإقام الصلاة، وإيتاء الزكاة، والصدقة على التيعة، ولصاحبها التيمة، وفي السيوب الخمس، وفي البغل العشر، لا خلاط، ولا وراط، ولا شغار، ولا"
