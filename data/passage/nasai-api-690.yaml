label: { ar: "سنن النسائي 690 — الأب والأبوة", en: "Sunan al-Nasa'i 690 — the father and fatherhood", ur: "سنن نسائی 690 — باپ اور والدیت", es: "Sunan al-Nasa'i 690 — El padre y la paternidad", fr: "Sunan al-Nasa'i 690 — le père et la paternité", tr: "Sunan an-Nasa'i 690 — Baba ve Babalık", id: "Sunan an-Nasa'i 690 — Sang Ayah dan Peran Ayah" }
text: "… مُسْهِرٍ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ، قَالَ كُنْتُ أَقْرَأُ عَلَى أَبِي الْقُرْآنَ فِي السِّكَّةِ فَإِذَا قَرَأْتُ السَّجْدَةَ سَجَدَ فَقُلْتُ يَا أَبَتِ أَتَسْجُدُ فِي الطَّرِيقِ فَقَالَ إِنِّي سَمِعْتُ أَبَا ذَرٍّ يَقُولُ سَأَلْتُ رَسُولَ اللَّهِ أَىُّ مَسْجِدٍ وُضِعَ أَوَّلاً قَالَ \" الْمَسْجِدُ الْحَرَامُ \". قُلْتُ ثُمَّ أَىُّ قَالَ \" الْمَسْجِدُ الأَقْصَى \". قُلْتُ وَكَمْ بَيْنَهُمَا قَالَ \" أَرْبَعُونَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 690، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 690 (The Book of the Masjids), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 690، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 690 (El Libro de las Mezquitas), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 690 (Le Livre des Mosquées), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 690 numaralı hadis, baba ve babalık kavramından bahsetmektedir. Araştırmacı, bu hadisi İslam'da babalık bölümünde, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 690, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits ini dalam bagian tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
