label: { ar: "الموطأ 340 — القاسم بن محمد يقضي ركعتي الفجر كما صنع ابن عمر", en: "Muwatta 340", es: "340 Muwatta", fr: "340 Muwatta", ur: "340 موطا", tr: "El-Muvatta 340 — El-Kasım ibn Muhammed, İbn Ömer'in yaptığı gibi iki rekatlık sabah namazını kılıyor.", id: "Al-Muwatta 340 — Al-Qasim bin Muhammad melaksanakan dua rakaat salat Subuh sebagaimana yang dilakukan Ibnu Umar" }
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن القاسم عن القاسم بن محمد أنه صنع مثل الذي صنع ابن عمر، أي قضى ركعتي الفجر بعد طلوع الشمس؛ وهو في باب ما جاء في ركعتي الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.187} {cite:muwatta-maruf-1997 p.188}"
  tr: "Malik'in, Abdülrahman ibn el-Kâsım'dan, o da el-Kâsım ibn Muhammed'den rivayet ettiği bir hadiste, İbn Ömer'in yaptığı gibi, yani güneş doğduktan sonra iki rekâtlık sabah namazını kıldığı belirtilmektedir. Bu, iki rekâtlık sabah namazı hakkında rivayet edilenler bölümünde yer almaktadır. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.187} {cite:muwatta-maruf-1997 s.188}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Abd al-Rahman ibn al-Qasim, dari al-Qasim ibn Muhammad, menyatakan bahwa ia melakukan hal yang sama seperti Ibn Umar, yaitu ia melaksanakan dua rakaat shalat Subuh setelah matahari terbit. Hal ini terdapat dalam bab tentang apa yang telah diriwayatkan mengenai dua rakaat shalat Subuh. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.187} {cite:muwatta-maruf-1997 p.188}"
