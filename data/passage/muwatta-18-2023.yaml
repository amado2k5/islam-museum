label: { ar: "الموطأ 2023 — مالك: لا بأس أن يشترط المقارض على رب المال غلاما يعينه به، على أن يقوم معه الغلام في المال، إذا لم يعد أن يعينه في المال، لا يعينه في غيره", en: "Muwatta 2023", es: "Muwatta 2023", fr: "Muwatta 2023", ur: "موطا 2023", tr: "Al-Muwatta 2023 — Malik: Bir ortağın, sermaye sahibine, sermayenin yönetiminde kendisine yardımcı olması şartıyla bir köle vermesini şart koşmasında bir sakınca yoktur. Köle sermayenin yönetiminde kendisine yardımcı olmayı düşünmüyorsa, başka hiçbir konuda da yardımcı olmamalıdır.", id: "Al-Muwatta 2023 — Malik: Tidak ada salahnya seorang mitra menetapkan syarat kepada pemilik modal agar menyediakan seorang budak untuk membantunya, dengan syarat budak tersebut bekerja bersamanya dalam mengelola modal. Jika ia tidak bermaksud membantunya dalam mengelola modal, maka ia tidak perlu membantunya dalam hal lain." }
summary:
  ar: "قال مالك: لا بأس أن يشترط المقارض على رب المال غلاما يعينه به، على أن يقوم معه الغلام في المال، إذا لم يعد أن يعينه في المال، لا يعينه في غيره. {cite:muwatta-maruf-1997 p.227}"
  tr: "Malik şöyle dedi: Bir ortağın, sermaye sahibine, kendisine yardımcı olması için bir köle temin etmesini şart koşmasında bir sakınca yoktur; ancak kölenin sermayeyi yönetmede kendisiyle birlikte çalışması şartıyla. Eğer sermayeyi yönetmede kendisine yardımcı olmayı düşünmüyorsa, başka hiçbir konuda da yardımcı olmayı düşünmez. {cite:muwatta-maruf-1997 s.227}"
  id: "Malik berkata: Tidak ada yang salah dengan seorang mitra yang menetapkan kepada pemilik modal bahwa ia menyediakan seorang budak untuk membantunya, dengan syarat budak tersebut bekerja bersamanya dalam mengelola modal, dan jika ia tidak bermaksud membantunya dalam mengelola modal, maka ia tidak bermaksud membantunya dalam hal lain. {cite:muwatta-maruf-1997 p.227}"
