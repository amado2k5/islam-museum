label: { ar: "الموطأ 934 — سالم عن أبيه: بيداؤكم هذه التي تكذبون على رسول الله فيها، ما أهل رسول الله إلا من عند المسجد يعني مسجد ذي الحليفة", en: "Muwatta 934", es: "Muwatta 934", fr: "Muwatta 934", ur: "موطا 934", tr: "El-Muvatta 934 — Salim, babasının rivayetine göre: Allah'ın Resulü hakkında yalan söylediğiniz bu çölünüzde, Allah'ın Resulü ihrama ancak mescidin yakınından girerdi; yani Zül-Huleyfe mescidinin yakınından.", id: "Al-Muwatta 934 — Salim berdasarkan riwayat ayahnya: Di padang gurun tempat kalian berbaring di dekat Rasulullah, Rasulullah tidak pernah memasuki ihram kecuali di dekat masjid, maksudnya masjid Dhu al-Hulayfah" }
text: "ما أهل رسول الله إلا من عند المسجد، يعني مسجد ذي الحليفة"
summary:
  ar: "يرويه مالك عن موسى بن عقبة عن سالم بن عبد الله، أنه سمع أباه يقول: بيداؤكم هذه التي تكذبون على رسول الله فيها، ما أهل رسول الله إلا من عند المسجد، يعني مسجد ذي الحليفة. ويذكر المحقق أن الحديث في الصحيحين عن ابن عمر. {cite:muwatta-maruf-1997 p.447}"
  tr: "Malik, Musa ibn Ukba'dan, o da Salim ibn Abdullah'tan rivayetle, babasının şöyle dediğini işittiğini aktarmıştır: \"Sizin bu çölünüzde, Allah'ın Resulü'nün etrafında yalan söylüyorsunuz. Allah'ın Resulü ancak mescidin yakınından ihram giydi.\" (Zühlüleyfe mescidi kastedilmektedir.) Araştırmacı, hadisin İbn Ömer'den rivayet edilen iki Sahih hadiste de bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.447}"
  id: "Malik meriwayatkannya dari Musa ibn Uqba, dari Salim ibn Abdullah, yang mendengar ayahnya berkata: “Di padang gurunmu ini, tempat kamu berbaring di dekat Rasulullah, Rasulullah hanya memasuki keadaan ihram dari dekat masjid,” yang berarti masjid Dhu al-Hulayfa. Peneliti menyebutkan bahwa hadits ini terdapat dalam dua kitab Sahih dari Ibnu Umar. {cite:muwatta-maruf-1997 p.447}"
