label: { ar: "الموطأ 934 — سالم عن أبيه: بيداؤكم هذه التي تكذبون على رسول الله فيها، ما أهل رسول الله إلا من عند المسجد يعني مسجد ذي الحليفة", en: "Muwatta 934" }
text: "ما أهل رسول الله إلا من عند المسجد، يعني مسجد ذي الحليفة"
summary:
  ar: "يرويه مالك عن موسى بن عقبة عن سالم بن عبد الله، أنه سمع أباه يقول: بيداؤكم هذه التي تكذبون على رسول الله فيها، ما أهل رسول الله إلا من عند المسجد، يعني مسجد ذي الحليفة. ويذكر المحقق أن الحديث في الصحيحين عن ابن عمر. {cite:muwatta-maruf-1997 p.447}"
