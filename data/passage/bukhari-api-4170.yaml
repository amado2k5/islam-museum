label: { ar: "صحيح البخاري 4170 — الأب والأبوة", en: "Sahih al-Bukhari 4170 — the father and fatherhood", ur: "صحیح بخاری 4170 — باپ اور والدیت", es: "Sahih al-Bukhari 4170 — El padre y la paternidad" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ إِشْكَابٍ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الْعَلاَءِ بْنِ الْمُسَيَّبِ، عَنْ أَبِيهِ، قَالَ لَقِيتُ الْبَرَاءَ بْنَ عَازِبٍما ـ فَقُلْتُ طُوبَى لَكَ صَحِبْتَ النَّبِيَّ وَبَايَعْتَهُ تَحْتَ الشَّجَرَةِ. فَقَالَ يَا ابْنَ أَخِي إِنَّكَ لاَ تَدْرِي مَا أَحْدَثْنَا بَعْدَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4170، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4170 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4170، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4170 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
