text: |-
  ٢٩٦
  الناض والعين الديديان والجاسوس ولقمته عين عنه اذا رأيته عيا نا ولم يرك وفعلت ذلك عمد
  عين اذا تعمدته بجدويقين قال امر والقيس
  أبلغامنى الشويعرأنى • عمدعين قلدتهن حريا
  وكذلك فعلته عمداعلى عين قال خفاف بن تدية السلمى
  وان تك خيلى قد أصيب صحيمها • فعمدا على عين يممت مالكا
  ولقيسه أوّل عين وأول عاشنة وأدنى عائنة أى قبل كل شءوعين الشى خياره وعين الشئ
  نفسه يقسال هوه وعينا وهوه وبعينه ولا آخذ الادرهمى بعينه وفى المثل ان الجوادعينه
  فراره ولا أطلب أثرابع_دعين أى بعد معائنة وعائنة بنى فلان أمو الهسم ورعيانهم ومابها
  عاثن وكذلك ما بهاعين أى أحسد وبلدقليل العين أى قليل الناس والعين ماعن يمين قبله
  العراق يقال نشأت السحابة من قبل العين والعين مطرأيام لا يقاح ويقال اقيته أوّل عين
  أى أول شى وأسود العين جبل وقال الفرزدق
  اذا زال هسكم آسود العين كنتم • كراما وآنتم ما أمام الاتم
  ورأس عين بلدة وعيون المقر جنس من العنب يصكون بالشآم واعمان القوم سراتبهم
  وأشرافهم والاعيان الاخوة بنو أب واحد وأم واحدة وهذه الاخوّة تسمى المعابنة وفى
  الحديث أعيان بنى الاتم يتوارثون دون بن العسلات وفى الميزان عين اذالم يكن مستويا
  وقول الجاج للحن لعينك أكبر ن أمدك يعى شاهدك ومنظرك أكبر من سنك والعين
  حرف من حروف المعجم ويقال هو عبدعين أى هو كالعبدلك مادمت تراه فاذاغبت فلا قال
  ومن *وعبدالعين أمالقاؤه • فحلو وأمّاغيبه قطنون
  ويقال أنت على عينى فى الاكرام والحفظ جميعا قال اللّه تعالى ولتصنع على عينى ويقال
  بالجلدعين وهى دوا تررقيقة وذلك عيب فيه تقول منه تعين الجلدوسا معين ومتعين قال
  رؤية * مابال عيني كالشعيب العين• وتعين الرجل المال اذا أصابه بعيز وتمين عليه الشئ لزمه
  بعينه وحفرت حتى عنت أى بلغت العيون والماءمعين ومعيون وأعيذت الماءمثسله وعان
  الدمع والماء عينانا بالتحريك أى سال وشرب من عائن أمن ماءسائل وعنت الرجل
  أصبته بعيف فأنا عاثن وهومعين على النقص ومعيون على التمام قال الشاعر فى التمام
  قد كان قومك يحسبونك سيدا * واخال أنك سيد معيون
  وتعيين الشئ تخصيصه من الجلة وعينت القربة اذاصيبت فيهاماء لتنتفخ عيون الخر ز قننسد
  تال جري
  بلى فارفضّ دمعك غيرنزر • كماعيفت بالسرب الطبايا
  والمعين الثور الوحشى قال جابر بنحزيش
  ومعينا يحوى الصواركانه * متخمط قطم اذا مابربرا
  وعينت اللواؤة ثقبتها وعينت فلانا أخبرت بمساويه فى وجهه وعاينت الشئ عيانا اذارأيته
  منك وابناعيان خطان يحخطان فى الارض يزجربه-ما الطيرواذا علم أن القاهر يفوزقدح
  فبل جوى ابناعيان والعمان حديدة تكون فى مضاع القدان والجمع عين وهو فعل فنقاوالان
  اليساء أخف من الواو والعين بالتحريك أهل الدار وقال الراجز
  تشرب مافى وطبها قبل العين* وياءفلان فى عين أى فى جماعة وقال جندل
  إدا
