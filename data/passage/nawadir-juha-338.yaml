label: { ar: "نوادر جحا الكبرى، ص 166 — «ابتعته من سوق الحذائين»", en: "Nawadir Juha al-Kubra, p. 166 — 'I Bought It from the Shoemakers' Market'", ur: "نوادر جحا الکبریٰ، ص 166 — «میں نے اسے جوتا سازوں کے بازار سے خریدا»", fr: "Nawadir Juha al-Kubra, p. 166 — « Je l'ai acheté au marché des cordonniers »", es: "Nawadir Juha al-Kubra, p. 166 — «Lo compré en el mercado de los zapateros»" }
text: "… ابتعتُهُ من سوق الحذائين دُعِيَ جحا إلى عُرْسٍ، وعندما دخل الدار لم يستقبله أحدّ، ولم يجِد هنا مَن يحفظ حذاءه، فقد اختلط الحابل بالنابل، ولئلا يُسرق حذاؤه، أخرج منديلاً من جيبه، ولفَّهُ به لفاً محكماً وجعله في عبّه، ودخل غرفة …"
summary:
  ar: "في عرس لف جحا حذاءه في منديل وحمله في حقيبته، فسأله ضيف هل في حقيبته كتاب نادر، فقال جحا نعم، في الاقتصاد، وتستمر القصة بعد هذا المقطع. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  en: "At a wedding Juha wraps his shoes in a handkerchief and carries them in his bag; a guest asks whether his bag holds a rare book; Juha says yes, on economics; the story continues past this passage. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  ur: "ایک شادی میں جحا نے اپنے جوتے رومال میں لپیٹ کر تھیلے میں رکھے، ایک مہمان نے پوچھا کہ کیا اس کے تھیلے میں کوئی نادر کتاب ہے، جحا نے کہا ہاں، معاشیات پر، اور کہانی اس حصے کے بعد بھی جاری رہتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  fr: "À un mariage, Juha enveloppe ses chaussures dans un mouchoir et les porte dans son sac ; un invité demande si son sac contient un livre rare ; Juha répond que oui, un traité d'économie ; le récit se poursuit après ce passage. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
  es: "En una boda, Juha envuelve sus zapatos en un pañuelo y los lleva en su bolsa; un invitado le pregunta si su bolsa contiene un libro raro; Juha dice que sí, sobre economía; el relato continúa después de este pasaje. {cite:juha-nawadir-kubra-djuwaydi p. 166}"
