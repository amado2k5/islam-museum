label: { ar: "سنن أبي داود 4682 — حلاوة الإيمان وكماله", en: "Sunan Abi Dawud 4682 — the sweetness and completeness of faith", ur: "سنن ابی داؤد 4682 — ایمان کی مٹھاس اور اس کا کمال", es: "Sunan Abi Dawud 4682 — La dulzura y plenitud de la fe", fr: "Sunan Abi Dawud 4682 — La douceur et la plénitude de la foi", tr: "Sunan Abi Davud 4682 — İmanın Tatlılığı ve Mükemmelliği", id: "Sunan Abi Dawud 4682 — Manisnya dan kesempurnaan iman" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ حَنْبَلٍ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ مُحَمَّدِ بْنِ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4682، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 4682 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 4682، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4682 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona la dulzura y la plenitud de la fe. El buscador de los pilares y ramas de la fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Abi Dawud, n° 4682 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), évoque la douceur et la plénitude de la foi. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sünen Ebu Davud'da yer alan 4682 numaralı hadis, imanın tatlılığı ve mükemmelliğinden bahsetmektedir. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4682, menyebutkan tentang manisnya dan kesempurnaan iman. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
