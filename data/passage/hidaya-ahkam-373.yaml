text: "… لا يَمَسُّ القرآنَ إلا طاهرٌ. ثم الحدثُ والجنابةُ حَلاَّ اليدَ، فيستويان في حكم المَسِّ. والجنابةُ حَلَّتِ الفَمَ، دونَ الحدث، فيفترقان في حكم القراءة. وغِلافُه: ما يكونُ متجافِياً عنه، دون ما هو متصلٌ به، كالجلد المُشرَّز، هو الصحيح. أي إباحته قراءة …"
summary:
