label: { ar: "الموطأ 1352 — عبد الله بن أبي بكر عن عمته عن جدته: جعلت على نفسها مشيا إلى مسجد قباء فماتت، فأفتى ابن عباس ابنتها أن تمشي عنها", en: "Muwatta 1352", es: "Muwatta 1352", fr: "Muwatta 1352", ur: "موطا 1352", tr: "El-Muvatta 1352 — Abdullah ibn Abi Bekr, teyzesinden, o da büyükannesinden rivayetle: Teyzesi Kuba Mescidi'ne yürüyeceğine yemin etmiş, sonra vefat etmiştir. İbn Abbas, kızına onun adına yürümesi için fetva vermiştir.", id: "Al-Muwatta 1352 — Abdullah ibn Abi Bakr, berdasarkan riwayat bibinya, berdasarkan riwayat neneknya: Ia bernazar untuk berjalan kaki ke Masjid Quba, kemudian ia meninggal dunia. Ibn Abbas memberikan fatwa kepada putrinya untuk berjalan kaki atas namanya." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر عن عمته أنها حدثته عن جدتها أنها كانت جعلت على نفسها مشيا إلى مسجد قباء، فماتت ولم تقضه، فأفتى عبد الله بن عباس ابنتها أن تمشي عنها. {cite:muwatta-maruf-1997 p.605}"
  tr: "Malik, Abdullah ibn Abi Bakr'dan, onun da teyzesinden, onun da büyükannesinden rivayet ettiğine dayanarak, Kuba Camii'ne kadar yürüyeceğine dair adak adadığını, ancak bu adakını yerine getiremeden vefat ettiğini nakletmiştir. Bunun üzerine Abdullah ibn Abbas, kızına onun adına yürümesi için fetva vermiştir. {cite:muwatta-maruf-1997 s.605}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr, dari bibinya, yang memberitahunya dari neneknya bahwa ia telah bernazar untuk berjalan kaki ke Masjid Quba, tetapi meninggal sebelum menunaikannya. Abdullah ibn Abbas kemudian memberikan fatwa kepada putrinya untuk berjalan kaki atas namanya. {cite:muwatta-maruf-1997 p.605}"
