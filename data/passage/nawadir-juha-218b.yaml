text: "… لي الشؤون الخارجية ولها الأمور الداخلية شبَّتِ النَّار في دار جحا فجاءه أحدُ جيرانه، وقال له: أسرع فقد شبَّتِ النار في دارِك وقد طرقت الباب كثيراً ولم يردَّ عليَّ أحدّ. فأجابه الشيخ ببرودٍ: يا أخي أقسمُ لك باللَّه أنَّ أُمورُ …"
summary:
  ar: "تتمة الحكاية: قال جحا للجار إنه يدير الشؤون الخارجية وزوجته تدير الداخلية، فعلى الجار أن يذهب ويخبرها. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  en: "Continuation: Juha tells the neighbour that he manages outside affairs and his wife manages the inside, so the neighbour should go and tell her. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  ur: "بقیہ حکایت: جحا پڑوسی سے کہتا ہے کہ باہر کے معاملات وہ سنبھالتا ہے اور اندر کے اس کی بیوی، اس لیے پڑوسی جا کر اسی کو بتائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  fr: "Suite : Juha dit au voisin qu'il gère les affaires du dehors et que sa femme gère celles du dedans, et que le voisin doit donc aller le lui dire. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  es: "Continuación: Juha dice al vecino que él se ocupa de los asuntos de fuera y su esposa de los de dentro, así que el vecino debe ir a decírselo a ella. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
