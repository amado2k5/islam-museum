text: "… حَدَّثَنَا مُحَمَّدٌ، وَعُثْمَانُ بْنُ عُمَرَ، قَالاَ حَدَّثَنَا شُعْبَةُ، عَنِ الْمُغِيرَةِ، عَنِ الشَّعْبِيِّ، عَنِ الْمُحَرَّرِ بْنِ أَبِي هُرَيْرَةَ، عَنْ أَبِيهِ، قَالَ جِئْتُ مَعَ عَلِيِّ بْنِ أَبِي طَالِبٍ حِينَ بَعَثَهُ رَسُولُ اللَّهِ إِلَى أَهْلِ مَكَّةَ بِبَرَاءَةَ قَالَ \" مَا كُنْتُمْ تُنَادُونَ \". قَالَ كُنَّا نُنَادِي \" إِنَّهُ لاَ يَدْخُلُ الْجَنَّةَ إِلاَّ نَفْسٌ مُؤْمِنَةٌ وَلاَ يَطُوفُ بِالْبَيْتِ عُرْيَانٌ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2958، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2958 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2958، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
