text: "… فقالت له بنته كانك قد اجبلت قالت افاجيز فقال لا والله لا قلت بيت شعر ما دمت حية قالت او اومنك قال فذاك قالت فانت آمن ان اقول بيت شعر ما بقيت. وقال فى مقتل المنذر بن عمرو يرثيه وكان …"
summary:
  ar: "مقطع من تاريخ مدينة دمشق، المجلد المصوَّر 2، ص 138، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Ta'rikh Madinat Dimashq, scan volume 2, p. 138, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "Ta'rikh Madinat Dimashq، اسکین جلد 2، ص 138 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ta'rikh Madinat Dimashq, volume numérisé 2, p. 138, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Ta'rikh Madinat Dimashq, volumen escaneado 2, p. 138, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Şam Tarihi, Resimli Cilt 2, sayfa 138'den bir alıntı; ölen kişi için yazılmış bir ağıt ve övgü içeriyor; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Damaskus, Jilid Bergambar 2, halaman 138, berisi elegi dan eulogi untuk almarhum; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
