text: "أكل كتف شاة ثم صلى ولم يتوضأ"
summary:
  ar: "أول حديث في باب ترك الوضوء مما مست النار. يرويه يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله بن عباس: أكل النبي كتف شاة ثم قام إلى الصلاة ولم يتوضأ. ويخرّجه المحقق من طرق أصحاب مالك عند البخاري (207) ومسلم (1/188) وأبي داود (187) والنسائي وابن حبان، ويحيل على التمهيد (3/329). {cite:muwatta-maruf-1997 p.60} {cite:muwatta-maruf-1997 p.61}"
