text: "أكل كتف شاة ثم صلى ولم يتوضأ"
summary:
  ar: "أول حديث في باب ترك الوضوء مما مست النار. يرويه يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار عن عبد الله بن عباس: أكل النبي كتف شاة ثم قام إلى الصلاة ولم يتوضأ. ويخرّجه المحقق من طرق أصحاب مالك عند البخاري (207) ومسلم (1/188) وأبي داود (187) والنسائي وابن حبان، ويحيل على التمهيد (3/329). {cite:muwatta-maruf-1997 p.60} {cite:muwatta-maruf-1997 p.61}"
  tr: "Ateşte pişirilmiş yemek yedikten sonra abdest almamakla ilgili bölümdeki ilk hadis. Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan, o da Abdullah ibn Abbas'tan rivayet etmiştir: Peygamberimiz bir kuzu budu yedi, sonra abdest almadan namaza kalktı. Editör, bunu Malik'in sahabelerinin Buhari (207), Müslim (1/188), Ebu Davud (187), Nesai ve İbn Hibban'daki rivayet zincirlerinden alıntılamış ve Temhid'e (3/329) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.60} {cite:muwatta-maruf-1997 s.61}"
  id: "Hadits pertama dalam bab ini tentang tidak berwudhu setelah makan makanan yang dimasak di atas api. Diriwayatkan oleh Yahya dari Malik, dari Zayd ibn Aslam, dari Ata ibn Yasar, dari Abdullah ibn Abbas: Nabi memakan bahu kambing, kemudian berdiri untuk shalat tanpa berwudhu. Editor mengutipnya dari sanad para sahabat Malik dalam al-Bukhari (207), Muslim (1/188), Abu Dawud (187), al-Nasa'i, dan Ibn Hibban, dan merujuk pada al-Tamhid (3/329). {cite:muwatta-maruf-1997 p.60} {cite:muwatta-maruf-1997 p.61}"
