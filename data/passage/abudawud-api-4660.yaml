label: { ar: "سنن أبي داود 4660 — الأب والأبوة", en: "Sunan Abi Dawud 4660 — the father and fatherhood", ur: "سنن ابی داؤد 4660 — باپ اور والدیت", es: "Sunan Abi Dawud 4660 — El padre y la paternidad", fr: "Sunan Abi Dawud 4660 — le père et la paternité" }
text: "… إِسْحَاقَ، قَالَ حَدَّثَنِي الزُّهْرِيُّ، حَدَّثَنِي عَبْدُ الْمَلِكِ بْنُ أَبِي بَكْرِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ الْحَارِثِ بْنِ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ زَمْعَةَ، قَالَ لَمَّا اسْتُعِزَّ بِرَسُولِ اللَّهِ وَأَنَا عِنْدَهُ فِي نَفَرٍ مِنَ الْمُسْلِمِينَ دَعَاهُ بِلاَلٌ إِلَى الصَّلاَةِ فَقَالَ مُرُوا مَنْ يُصَلِّي لِلنَّاسِ. فَخَرَجَ عَبْدُ اللَّهِ بْنُ زَمَعَةَ فَإِذَا عُمَرُ فِي النَّاسِ وَكَانَ أَبُو …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4660، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4660 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4660، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4660 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4660 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
