text: "… عن رسول اللّه وليم قال : ألا أني اوتيت الكتاب ومثله معه ألا يوشك رجل شبعانُ على أريكته يقول : عليكم بهذا القرآن فما وجدتم فيه من حلال فأحلوه وما وجدتم فيه من حرام فحرموه ألا لا يحل لكم الحمار …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3105، يذكر الحلال، وما أُحل، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 3105, that mentions the lawful, what was made lawful, what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 3105 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 3105, que menciona lo lícito, lo que se ha declarado lícito, lo que no lo es, lo ilícito y lo que se ha declarado ilícito; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Dala'il al-Nubuwwa d'al-Bayhaqi, volume 1, page 3105, mentionnant le licite, ce qui a été rendu licite, ce qui ne l'est pas, l'illicite et ce qui a été rendu illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "El-Beyhakî'nin \"Delil el-Nübüvve\" (Peygamberliğin Delilleri) adlı eserinin 1. cildinin 3105. sayfasından, helal olan, haram olan ve haramdan olan konuları ele alan bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Helal ve Haram (helal ve haram) tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari kitab \"Dala'il an-Nubuwwah\" (Bukti Kenabian) karya Al-Bayhaqi, Jilid 1, halaman 3105, yang membahas tentang apa yang diperbolehkan, apa yang tidak diperbolehkan, dan apa yang diharamkan. Cuplikan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Teks ini disusun oleh peramban Halal wa Haram (diperbolehkan dan diharamkan)."
