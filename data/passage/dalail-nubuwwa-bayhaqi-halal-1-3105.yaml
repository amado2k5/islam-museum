text: "… عن رسول اللّه وليم قال : ألا أني اوتيت الكتاب ومثله معه ألا يوشك رجل شبعانُ على أريكته يقول : عليكم بهذا القرآن فما وجدتم فيه من حلال فأحلوه وما وجدتم فيه من حرام فحرموه ألا لا يحل لكم الحمار …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3105، يذكر الحلال، وما أُحل، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
