label: { ar: "سنن ابن ماجه 1574 — الأب والأبوة", en: "Sunan Ibn Majah 1574 — the father and fatherhood", ur: "سنن ابن ماجہ 1574 — باپ اور والدیت", es: "Sunan Ibn Majah 1574 — El padre y la paternidad", fr: "Sunan Ibn Majah 1574 — le père et la paternité" }
text: "… أَبِي شَيْبَةَ، وَأَبُو بِشْرٍ قَالاَ حَدَّثَنَا قَبِيصَةُ، ح: وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا عُبَيْدُ بْنُ سَعِيدٍ، ح: وَحَدَّثَنَا مُحَمَّدُ بْنُ خَلَفٍ الْعَسْقَلاَنِيُّ، حَدَّثَنَا الْفِرْيَابِيُّ، وَقَبِيصَةُ، كُلُّهُمْ عَنْ سُفْيَانَ، عَنْ عَبْدِ اللَّهِ بْنِ عُثْمَانَ بْنِ خُثَيْمٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ بَهْمَانَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ حَسَّانَ بْنِ ثَابِتٍ، عَنْ أَبِيهِ، قَالَ: لَعَنَ رَسُولُ اللَّهِ ـ زُوَّارَاتِ الْقُبُورِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1574، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1574 (Chapters Regarding Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1574، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1574 (Capítulos sobre los funerales), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1574 (Chapitres relatifs aux funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
