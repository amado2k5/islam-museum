label: { ar: "الموطأ 155 — عائشة: كنت أرجل رأس رسول الله وأنا حائض", en: "Muwatta 155", es: "Muwatta 155", fr: "Muwatta 155", ur: "موطا 155", tr: "Al-Muwatta 155 — Aişe: Adetliyken Allah Resulü'nün saçlarını tarardım.", id: "Al-Muwatta 155 — Aisyah: Aku biasa menyisir rambut Rasulullah ketika aku sedang haid." }
text: "كنت أرجل رأس رسول الله وأنا حائض"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب جامع الحيضة: كانت تمشط رأس النبي وتسرّحه وهي حائض. ويخرّجه المحقق عند البخاري ⁦(295، 5925)⁩ والنسائي (1/148) والدارمي وأبي عوانة والترمذي في الشمائل (32) من طرق أصحاب مالك، ويحيل على التمهيد (22/136). {cite:muwatta-maruf-1997 p.105}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Ayşe'den naklederek, adet dönemi bölümünde şöyle rivayet etmiştir: Adetliyken Peygamberimizin saçlarını tarar ve şekillendirirdi. Editör, bunu Sahih'inde, Buhari'de (295, 5925), Nesai'de (1/148), Darimi'de, Ebu Evane'de ve Tirmizi'de (Şemail'de, 32) Malik'in sahabelerinin rivayet zincirleriyle aktarmış ve Temhid'e (22/136) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.105}"
  id: "Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, dalam surah tentang haid: Ia biasa menyisir dan menata rambut Nabi ketika sedang haid. Penyusun kitab Shahihnya, al-Bukhari (295, 5925), al-Nasa'i (1/148), al-Darimi, Abu Awanah, dan al-Tirmidhi dalam al-Shama'il (32) melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/136). {cite:muwatta-maruf-1997 p.105}"
