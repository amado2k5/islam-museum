label: { ar: "الموطأ 909 — عمر رأى على طلحة بن عبيد الله ثوباً مصبوغاً وهو محرم: إنكم أيها الرهط أئمة يقتدي بكم الناس، فلا تلبسوا من هذه الثياب المصبغة", en: "Muwatta 909" }
summary:
  ar: "يرويه مالك عن نافع عن أسلم مولى عمر أنه حدث عبد الله بن عمر، أن عمر بن الخطاب رأى على طلحة بن عبيد الله ثوباً مصبوغاً وهو محرم، فقال: ما هذا الثوب المصبوغ يا طلحة؟ فقال طلحة: يا أمير المؤمنين، إنما هو مدر. فقال عمر: إنكم أيها الرهط أئمة يقتدي بكم الناس، فلو أن رجلاً جاهلاً رأى هذا الثوب لقال إن طلحة كان يلبس الثياب المصبغة في الإحرام، فلا تلبسوا أيها الرهط شيئاً من هذه الثياب المصبغة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1041) وسويد (487) والشيباني (425) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.438}"
