label: { ar: "الموطأ 909 — عمر رأى على طلحة بن عبيد الله ثوباً مصبوغاً وهو محرم: إنكم أيها الرهط أئمة يقتدي بكم الناس، فلا تلبسوا من هذه الثياب المصبغة", en: "Muwatta 909", es: "Muwatta 909", fr: "Muwatta 909", ur: "موطا 909", tr: "El-Muvatta 909 — Ömer, Talha bin Ubaidullah'ı ihramlı haldeyken boyalı bir elbise giymiş olarak gördü ve şöyle dedi: \"Ey topluluk, siz insanların peşinden gittiği önderlersiniz, bu boyalı elbiseleri giymeyin.\"", id: "Al-Muwatta 909 — Umar melihat Talha bin Ubaidullah mengenakan pakaian berwarna saat ia sedang dalam keadaan ihram: “Wahai kaummu, kalian adalah pemimpin yang diikuti orang banyak, maka janganlah kalian mengenakan pakaian berwarna seperti ini.”" }
summary:
  ar: "يرويه مالك عن نافع عن أسلم مولى عمر أنه حدث عبد الله بن عمر، أن عمر بن الخطاب رأى على طلحة بن عبيد الله ثوباً مصبوغاً وهو محرم، فقال: ما هذا الثوب المصبوغ يا طلحة؟ فقال طلحة: يا أمير المؤمنين، إنما هو مدر. فقال عمر: إنكم أيها الرهط أئمة يقتدي بكم الناس، فلو أن رجلاً جاهلاً رأى هذا الثوب لقال إن طلحة كان يلبس الثياب المصبغة في الإحرام، فلا تلبسوا أيها الرهط شيئاً من هذه الثياب المصبغة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1041) وسويد (487) والشيباني (425) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.438}"
  tr: "Malik, Ömer'in azatlı kölesi Aslam'dan rivayet ettiğine göre, Abdullah ibn Ömer'e Ömer ibn el-Hattab'ın Talha ibn Ubeydullah'ı ihramlı haldeyken boyalı bir elbise giyerken gördüğünü anlattığını aktarmıştır. Ömer, \"Bu boyalı elbise nedir Talha?\" diye sormuş, Talha ise \"Ey Müminlerin Emiri, bu sadece çamurdur\" diye cevap vermiştir. Ömer, \"Siz, ey topluluk, insanların peşinden gittiği önderlersiniz. Cahil bir insan bu elbiseyi görse, Talha'nın ihramlıyken boyalı elbiseler giydiğini söylerdi. Bu nedenle, ey topluluk, bu boyalı elbiselerden hiçbirini giymeyin\" demiştir. Araştırmacı, bu rivayetin Malik'ten Ebu Mus'ab (1041), Suveyd (487), el-Şeybani (425) ve Yahya ibn Bukayr tarafından, el-Beyhaki'nin de kaydettiği şekilde nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.438}"
  id: "Malik meriwayatkan hadits ini dari Nafi’ yang meriwayatkan dari Aslam, budak yang dibebaskan oleh Umar, yang menceritakan kepada Abdullah ibn Umar bahwa Umar ibn al-Khattab melihat Talha ibn Ubaydullah mengenakan pakaian berwarna saat dalam keadaan ihram. Beliau bertanya, “Apakah pakaian berwarna ini, Talha?” Talha menjawab, “Wahai Amirul Mukminin, ini hanyalah lumpur.” Umar berkata, “Wahai kaum, kalian adalah pemimpin yang diikuti orang banyak. Jika orang bodoh melihat pakaian ini, ia akan mengatakan bahwa Talha biasa mengenakan pakaian berwarna saat dalam keadaan ihram. Oleh karena itu, wahai kaum, janganlah kalian mengenakan pakaian berwarna seperti ini.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1041), Suwayd (487), al-Shaybani (425), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {mengutip:muwatta-maruf-1997 hal.438}"
