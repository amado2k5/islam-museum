text: "… لفظ الإيمان على الأعمال مجاز، فقوله عل ل و الإيمان بضع وستون أو بضع وسبعون شعبة أعلاها قول لا إله إلا اللّٰه وأدناها إماطة الأذى عن الطريق مجاز، وقوله الإيمان أن تؤمن باللّه وملائكته وكتبة ورسله إلى آخره حقيقة، وهذا …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 81، يذكر الإيمان بالله وملائكته وكتبه ورسله، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
