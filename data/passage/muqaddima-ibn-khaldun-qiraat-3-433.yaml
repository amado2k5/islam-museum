text: "… فإن عرضت في الشغل محمدةٌ فلا يصرفها إلا إلى صاحبه وإن عرضت مذمَّةٌ فليحملها هو من دونه. وليحذر السَّقطةَ والزَّلَّةِ والمللَ عند تغيِّرِ الحالِ. فإنَّ العيب إليكم معشرَ الكَتّابِ أسرعَ منه إلى القَرَّاءِ، وهو لكَم أفسَدُ منه لهم. فقد علمتم …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 3، ص 433، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 3, p. 433, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 3، ص 433 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 3, pág. 433, que menciona a los lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Muqaddima d'Ibn Khaldoun (tome 3, p. 433) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Haldun'un Mukaddime'sinin 3. cildinin 433. sayfasında okuyuculardan bahsedilmektedir; makine tarafından okunabilir taranmış versiyondan, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Muqaddimah Ibn Khaldun, Volume 3, halaman 433, menyebutkan para pembaca; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
