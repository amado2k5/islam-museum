label: { ar: "صحيح البخاري 4048 — أعضاء البدن", en: "Sahih al-Bukhari 4048 — the organs of the body", ur: "صحیح بخاری 4048 — اعضائے بدن" }
text: "… أُحُدٍ، فَهُزِمَ النَّاسُ فَقَالَ اللَّهُمَّ إِنِّي أَعْتَذِرُ إِلَيْكَ مِمَّا صَنَعَ هَؤُلاَءِ ـ يَعْنِي الْمُسْلِمِينَ ـ وَأَبْرَأُ إِلَيْكَ مِمَّا جَاءَ بِهِ الْمُشْرِكُونَ. فَتَقَدَّمَ بِسَيْفِهِ فَلَقِيَ سَعْدَ بْنَ مُعَاذٍ فَقَالَ أَيْنَ يَا سَعْدُ إِنِّي أَجِدُ رِيحَ الْجَنَّةِ دُونَ أُحُدٍ. فَمَضَى فَقُتِلَ، فَمَا عُرِفَ حَتَّى عَرَفَتْهُ أُخْتُهُ بِشَامَةٍ أَوْ بِبَنَانِهِ، وَبِهِ بِضْعٌ وَثَمَانُونَ مِنْ طَعْنَةٍ وَضَرْبَةٍ وَرَمْيَةٍ بِسَهْمٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4048، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4048 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4048، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
