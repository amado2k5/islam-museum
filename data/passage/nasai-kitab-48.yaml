summary:
  ar: "القسم 48 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزينة من السنن»، ويضم فيها النصوص من 5040 إلى 5378 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 48 of Sunan al-Nasa'i (The Book of Adornment) in the division of the open hadith dataset the museum took its reports from: reports 5040 to 5378 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 48، عنوان «کتاب الزینۃ من السنن»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5040 تا 5378۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 48 de Sunan al-Nasa'i (El Libro de los Adornos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5040 al 5378, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le livre 48 du Sunan al-Nasa'i (Le Livre de la parure) correspond aux hadiths 5040 à 5378, selon la numérotation du recueil ouvert utilisé par le musée. Le musée conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 48. bölümü \"Sunan'dan Süsleme Kitabı\" başlığını taşımakta olup, 5040 ile 5378 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 48 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Hiasan dari Sunan\" dan berisi teks 5040 hingga 5378, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
