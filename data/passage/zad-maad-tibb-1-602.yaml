text: "قالت: قال أنسُ بن مالك: قال رسول اللَّه : آثار الطاعون، وليست نفسَه، ولكن الأطباء لما الطَّاعُونُ شَهَادَةٌ لِكُلِّ مُسْلِم البخاري:، ومسلم: لم تُدرك منه إلَّا الأثر الظاهر، جعلوه نفسَ الطاعون. وباء، وليس كل وباء طاعوناً، وكذلك الأمراض جربنا نحنُ …"
