ref: "24"
label: { ar: "الأربعون 24 — يا عبادي إني حرمت الظلم على نفسي", en: "Arba'un 24 — O My servants, I have forbidden injustice to Myself", es: "Arba'un 24 — Oh siervos míos, yo he prohibido la injusticia contra Mí mismo.", fr: "Arba'un 24 — Ô Mes serviteurs, J'ai interdit l'injustice envers Moi-même", ur: "اربعون 24 - اے میرے بندو، میں نے اپنے اوپر ظلم کو حرام کیا ہے۔" }
summary:
  ar: "الحديث القدسي العظيم عن أبي ذر عن النبي فيما يروي عن ربه عز وجل أنه قال: «يا عبادي إني حرمت الظلم على نفسي وجعلته بينكم محرماً فلا تظالموا» ثم بيان أن عباده كلهم ضال إلا من هداه وجائع إلا من أطعمه وعار إلا من كساه فيستهدونه ويستطعمونه ويستكسونه، وأنهم يخطئون بالليل والنهار وهو يغفر الذنوب جميعاً فيستغفرونه، وأنهم لن يبلغوا ضره فيضروه ولا نفعه فينفعوه، ولو كان أولهم وآخرهم وإنسهم وجنهم على أنقى قلب رجل واحد ما زاد في ملكه شيئاً ولو كانوا على أفجر قلب ما نقص، ولو قاموا في صعيد واحد فسألوه فأعطى كل إنسان مسألته ما نقص مما عنده إلا كما ينقص المخيط إذا أدخل البحر، وأنما هي أعمالهم يحصيها لهم ثم يوفيهم إياها فمن وجد خيراً فليحمد الله ومن وجد غير ذلك فلا يلومن إلا نفسه؛ وهو الحديث الرابع والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (2577) من رواية سعيد بن عبد العزيز عن ربيعة بن يزيد عن أبي إدريس الخولاني عن أبي ذر — وكان أبو إدريس إذا حدث به جثا على ركبتيه — ومن رواية قتادة عن أبي قلابة عن أبي أسماء الرحبي عن أبي ذر بنحوه وحديث أبي إدريس أتم، وأخرجه أحمد والترمذي (2495) وقال حسن وابن ماجه من رواية شهر بن حوشب عن عبد الرحمن بن غنم عن أبي ذر بلفظ آخر فيه «أتقى قلب عبد» و«ما زاد في ملكي جناح بعوضة» و«إني جواد واجد ماجد أفعل ما أريد عطائي كلام وعذابي كلام إنما أمري لشيء إذا أردته أن أقول له كن فيكون»، وأخرجه الطبراني بمعناه من حديث أبي موسى الأشعري وإسناده ضعيف لعبد الملك بن هارون بن عنترة الذي قال فيه أبو حاتم متروك الحديث ويحيى بن معين كذاب؛ وقال الإمام أحمد إنه أشرف حديث لأهل الشام؛ وشرح ابن رجب تحريم الظلم على نفسه بأنه منعه عن عباده واستشهد بآيات نفي الظلم عنه، وأن الظلم عند كثير من العلماء وضع الأشياء في غير موضعها فيدل الحديث على أن الله قادر عليه لكنه لا يفعله فضلاً وجوداً وكرماً وإحساناً، ومن فسره بالتصرف في ملك الغير بغير إذنه — ونقل نحوه عن إياس بن معاوية — قال إنه مستحيل عليه لأن كل ما يفعله تصرف في ملكه، وبنحو ذلك أجاب أبو الأسود الدؤلي عمران بن حصين حين سأله عن القدر؛ وأخرج ابن رجب موقوفاً عن أبي بن كعب ونحوه عن ابن مسعود وزيد بن ثابت «لو أن الله عذب أهل سماواته وأهل أرضه لعذبهم وهو غير ظالم لهم» وفي إسناده نظر عنده لوهب بن خالد، وأنه خلق أفعال العباد وفيها الظلم لا يقتضي وصفه بالظلم إذ لا يوصف إلا بأفعاله لا بأفعال عباده؛ والظلم المحرم بين العباد نوعان: ظلم النفس وأعظمه الشرك لقوله «إن الشرك لظلم عظيم» [لقمان 13] ثم المعاصي كبائرها وصغائرها، وظلم العبد لغيره وهو المذكور في الحديث، وشهد له خطبة حجة الوداع بتحريم الدماء والأموال والأعراض وقوله «الظلم ظلمات يوم القيامة» و«إن الله ليملي للظالم حتى إذا أخذه لم يفلته» مع قراءة هود 102 ⁦(جامع العلوم والحكم ص 511–532)⁩."
  en: "The great sacred hadith, from Abu Dharr from the Prophet among what he relates from his Lord: 'O My servants, I have forbidden injustice to Myself and made it forbidden among you, so do not wrong one another', followed by the declarations that His servants are all astray except whom He guides, hungry except whom He feeds and naked except whom He clothes, that they err night and day while He forgives all sins, that they can neither reach His harm to harm Him nor His benefit to benefit Him, that were the first and last of them, human and jinn, upon the purest heart of one man it would add nothing to His dominion nor upon the most wicked subtract, that were they to stand on one plain and ask and He gave each his request it would diminish what is with Him only as a needle dipped into the sea diminishes it, and that it is their works which He counts for them then repays — whoever finds good let him praise God and whoever finds otherwise let him blame none but himself; the twenty-fourth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim (2577) through Sa'id ibn Abd al-Aziz from Rabi'a ibn Yazid from Abu Idris al-Khawlani from Abu Dharr — Abu Idris would kneel on his knees when narrating it — and through Qatada from Abu Qilaba from Abu Asma' al-Rahbi from Abu Dharr in like wording though Abu Idris's is more complete, and by Ahmad, al-Tirmidhi (2495, graded hasan) and Ibn Majah through Shahr ibn Hawshab from Abd al-Rahman ibn Ghunam from Abu Dharr in a fuller wording containing 'the most God-fearing heart', 'would not add a mosquito's wing to My dominion', 'I am Generous, Resourceful, Glorious, doing what I will; My giving is speech and My punishment is speech; My command to a thing when I will it is only to say to it Be, and it is', while al-Tabarani's parallel from Abu Musa al-Ash'ari has a weak chain on account of Abd al-Malik ibn Harun ibn Antara — called 'abandoned in hadith' by Abu Hatim and 'a liar' by Yahya ibn Ma'in — and the Imam Ahmad called it the noblest hadith of the people of Syria; Ibn Rajab explains 'I have forbidden injustice to Myself' as His restraining it from His servants, citing the Qur'anic negations of injustice from Him, notes that for many scholars injustice is placing things outside their place — so the hadith shows God is able to do injustice but does not, out of grace, bounty, generosity and beneficence — while those who define it as disposing of another's property without permission, a sense transmitted from Iyas ibn Mu'awiya, hold it impossible for Him since all He does is disposal within His own dominion, in the manner of Abu al-Aswad al-Du'ali's answer to Imran ibn al-Husayn when asked about the divine decree; Ibn Rajab also transmits, halted at Ubayy ibn Ka'b and similarly from Ibn Masud and Zayd ibn Thabit, 'were God to punish the people of His heavens and earth He would do so without injustice to them', remarking that its chain is open to question on account of Wahb ibn Khalid, and that God's creating His servants' deeds — injustice among them — does not mean He is described by injustice, for He is described only by His own acts, not theirs; and the injustice forbidden between servants is of two kinds: injustice to one's own soul, whose greatest form is association — 'association is indeed a tremendous injustice' (Luqman 13) — followed by sins great and small, and injustice to others, the subject of this hadith, witnessed by the Farewell Pilgrimage sermon declaring blood, property and honour sacred, by 'injustice will be darknesses on the Day of Resurrection', and by 'God grants respite to the wrongdoer until, when He seizes him, He does not let him escape' read with Hud 102 (Jami' al-Ulum wal-Hikam pp. 511–532)."
  es: "El gran hadiz sagrado, de Abu Dharr del Profeta entre lo que relata de su Señor: 'Oh, siervos Míos, he prohibido la injusticia contra Mí y la he prohibido entre vosotros, así que no os hagáis daño unos a otros', seguido de las declaraciones de que Sus siervos están todos extraviados excepto a quien Él guía, hambrientos excepto a quien Él alimenta y desnudos excepto a quien Él viste, que se equivocan día y noche mientras Él perdona todos los pecados, que no pueden alcanzar Su daño para dañarlo ni Su beneficio para beneficiarlo, que si fueran los primeros y los últimos de ellos, humanos y genios, sobre el corazón más puro de un hombre no añadiría nada a Su dominio ni sobre el más malvado restaría, que si se pararan en una llanura y pidieran y Él diera a cada uno su petición disminuiría lo que está con Él solo como una aguja sumergida en el mar lo disminuye, y que son sus obras las que Él cuenta para ellos y luego les recompensa: quien encuentre el bien que alabe a Dios y quien encuentre lo contrario que no culpe a nadie más que a sí mismo; el vigésimo cuarto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Muslim (2577) a través de Sa'id ibn Abd al-Aziz de Rabi'a ibn Yazid de Abu Idris al-Khawlani de Abu Dharr — Abu Idris se arrodillaba al narrarlo — y a través de Qatada de Abu Qilaba de Abu Asma' al-Rahbi de Abu Dharr en palabras similares aunque la de Abu Idris es más completa, y por Ahmad, al-Tirmidhi (2495, clasificado hasan) e Ibn Majah a través de Shahr ibn Hawshab de Abd al-Rahman ibn Ghunam de Abu Dharr en una redacción más completa que contiene 'el corazón más temeroso de Dios', 'no añadiría ni un ala de mosquito a Mi dominio', 'Soy Generoso, Ingenioso, Glorioso, haciendo lo que quiero; Mi dar es palabra y mi castigo es palabra; mi mandato a una cosa cuando quiero es solo decirle \"Sé\", y es', mientras que el paralelo de al-Tabarani de Abu Musa al-Ash'ari tiene una cadena débil debido a Abd al-Malik ibn Harun ibn Antara —llamado \"abandonado en hadices\" por Abu Hatim y \"un mentiroso\" por Yahya ibn Ma'in— y el Imam Ahmad lo llamó el hadiz más noble de la gente de Siria; Ibn Rajab explica \"Yo he prohibido la injusticia contra Mí mismo\" como Su prohibición de la injusticia contra Sus siervos, citando las negaciones coránicas de la injusticia de Él, señala que para muchos eruditos la injusticia es poner las cosas fuera de su lugar, por lo que el hadiz muestra que Dios es capaz de hacer injusticia pero no lo hace, por gracia, bondad, generosidad y beneficencia, mientras que aquellos que la definen como disponer de la propiedad de otro sin permiso, un sentido transmitido por Iyas ibn Mu'awiya, sostienen que es imposible para Él ya que todo lo que hace es disponer dentro de Su propio dominio, de la manera de la respuesta de Abu al-Aswad al-Du'ali a Imran ibn al-Husayn cuando se le preguntó sobre el decreto divino; Ibn Rajab también transmite, interrumpido en Ubayy ibn Ka'b y de manera similar de Ibn Masud y Zayd ibn Thabit, que «si Dios castigara a la gente de Sus cielos y de la tierra, lo haría sin injusticia para ellos», señalando que su cadena de transmisión es cuestionable debido a Wahb ibn Khalid, y que el hecho de que Dios cree las obras de Sus siervos —la injusticia entre ellos— no significa que Él sea descrito por la injusticia, pues Él es descrito solo por Sus propios actos, no por los de ellos; y la injusticia prohibida entre siervos es de dos tipos: la injusticia contra la propia alma, cuya forma más grande es la asociación —'la asociación es en verdad una tremenda injusticia' (Luqman 13)— seguida de los pecados grandes y pequeños, y la injusticia contra los demás, tema de este hadiz, atestiguado por el sermón de la Peregrinación de Despedida que declara sagrados la sangre, la propiedad y el honor, por 'la injusticia será oscuridad en el Día de la Resurrección', y por 'Dios concede un respiro al malhechor hasta que, cuando lo atrapa, no lo deja escapar' leído con Hud 102 (Jami' al-Ulum wal-Hikam pp. 511–532)."
  fr: "Le grand hadith sacré, rapporté par Abou Dharr d'après le Prophète, parmi ce qu'il rapporte de son Seigneur: « Ô Mes serviteurs, Je Me suis interdit l'injustice et Je l'ai rendue interdite parmi vous, alors ne vous faites pas de tort les uns aux autres », suivi des déclarations selon lesquelles Ses serviteurs sont tous égarés, sauf ceux qu'Il guide, affamés, sauf ceux qu'Il nourrit, et nus, sauf ceux qu'Il habille; qu'ils s'égarent nuit et jour tandis qu'Il pardonne tous les péchés; qu'ils ne peuvent ni Lui nuire ni Lui faire du bien; que, quel que soit le premier et le dernier d'entre eux, humains et djinns, cela n'ajouterait rien à Son pouvoir, ni au cœur le plus pur d'un homme, ni n'en retrancherait à celui du plus pervers; que, s'ils se tenaient tous sur une même plaine et demandaient, et qu'Il exauçait chacun de ses vœux, cela ne diminuerait ce qui est auprès de Lui que comme une aiguille plongée dans la mer le diminue; et que ce sont leurs œuvres qu'Il compte pour eux, puis qu'Il récompense — que celui qui trouve le bien loue Dieu et que celui qui trouve le contraire ne blâme que lui-même; le vingt-quatrième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Muslim (2577) à travers Sa'id ibn Abd al-Aziz de Rabi'a ibn Yazid d'Abu Idris al-Khawlani d'Abu Dharr — Abu Idris s'agenouillait en le narrant — et à travers Qatada d'Abu Qilaba d'Abu Asma' al-Rahbi d'Abu Dharr dans une formulation similaire bien que celle d'Abu Idris soit plus complète, et par Ahmad, al-Tirmidhi (2495, classé hasan) et Ibn Majah à travers Shahr ibn Hawshab d'Abd al-Rahman ibn Ghunam d'Abu Dharr dans une formulation plus complète contenant « le cœur le plus craignant Dieu », « n'ajouterait pas une aile de moustique à Mon royaume », « Je suis Généreux, Ingénieux, Glorieux, faisant ce que Je veux; « Mon don est parole et Mon châtiment est parole; Mon commandement à une chose, quand Je le veux, est seulement de lui dire Sois, et elle est », tandis que le parallèle d'al-Tabarani d'après Abu Musa al-Ash'ari a une chaîne faible à cause d'Abd al-Malik ibn Harun ibn Antara — qualifié d'« abandonné dans le hadith » par Abu Hatim et de « menteur » par Yahya ibn Ma'in — et l'Imam Ahmad l'a qualifié de hadith le plus noble du peuple de Syrie; Ibn Rajab explique « Je me suis interdit l’injustice » comme le fait de la retenir envers Ses serviteurs, citant les négations coraniques de l’injustice de Sa part, notant que pour de nombreux savants, l’injustice consiste à placer les choses hors de leur place — ainsi le hadith montre que Dieu est capable de commettre l’injustice mais ne le fait pas, par grâce, générosité et bienveillance — tandis que ceux qui la définissent comme le fait de disposer du bien d’autrui sans permission, un sens transmis par Iyas ibn Mu’awiya, la considèrent impossible pour Lui puisque tout ce qu’Il fait, c’est disposer dans Son propre domaine, à la manière de la réponse d’Abu al-Aswad al-Du’ali à Imran ibn al-Husayn lorsqu’on l’interrogeait sur le décret divin; Ibn Rajab transmet également, s'arrêtant à Ubayy ibn Ka'b et de même d'Ibn Masud et Zayd ibn Thabit, « si Dieu devait punir les habitants de Ses cieux et de Sa terre, Il le ferait sans injustice envers eux », remarquant que sa chaîne est sujette à caution à cause de Wahb ibn Khalid, et que le fait que Dieu crée les actes de Ses serviteurs — l'injustice parmi eux — ne signifie pas qu'Il est décrit par l'injustice, car Il est décrit uniquement par Ses propres actes, et non par les leurs; et l'injustice interdite entre serviteurs est de deux sortes: l'injustice envers sa propre âme, dont la plus grande forme est l'association — « l'association est en effet une terrible injustice » (Luqman 13) — suivie des péchés grands et petits, et l'injustice envers les autres, sujet de ce hadith, attestée par le sermon du Pèlerinage d'Adieu déclarant le sang, les biens et l'honneur sacrés, par « l'injustice sera ténèbres au Jour de la Résurrection », et par « Dieu accorde un répit au malfaiteur jusqu'à ce que, lorsqu'Il le saisit, Il ne le laisse pas s'échapper », lu avec Hud 102 (Jami' al-Ulum wal-Hikam pp. 511–532)."
  ur: "حضرت ابوذر سے روایت ہے کہ وہ اپنے رب سے روایت کرتے ہیں کہ اے میرے بندو، میں نے اپنے اوپر ظلم کو حرام کیا ہے اور اسے تم پر حرام کر دیا ہے، لہٰذا ایک دوسرے پر ظلم نہ کرو، اس کے بعد یہ اعلان ہوا کہ اس کے تمام بندے گمراہ ہیں سوائے اس کے جسے وہ ہدایت دے، بھوکے سوائے اس کے جس کو وہ دن کھلائے اور جس کو وہ رات کو کھانا کھلائے۔ تمام گناہوں کو بخش دیتا ہے، کہ وہ اس کے نقصان تک نہ پہنچ سکتے ہیں اور نہ اس کے فائدے کے لیے، جو ان میں سے اول و آخر تھے، انسان اور جن، ایک انسان کے پاکیزہ دل پر یہ اس کے اقتدار میں کچھ اضافہ نہیں کرے گا اور نہ ہی سب سے شریر گھٹا، کہ اگر وہ ایک میدان میں کھڑے ہو کر مانگیں اور اس نے ہر ایک کی فرمائش کی تو وہ اس کے ساتھ اس کی ضرورت کو کم کرے گا اور اس کے ساتھ جو کچھ ہے وہ اس کی ضرورت کے برابر ہے۔ ان کے کام جو وہ ان کے لیے شمار کرتا ہے پھر اس کا بدلہ دیتا ہے - جس کو اچھا لگے وہ خدا کی حمد کرے اور جس کو دوسری صورت ملے وہ اپنے سوا کسی پر الزام نہ لگائے۔ نووی کی چالیسویں اور ابن رجب کی تفسیر کا چوبیسواں؛ مسلم (2577) نے سعید بن عبد العزیز سے ربیعہ بن یزید سے ابو ادریس الخولانی سے ابوذر سے روایت کی ہے - ابو ادریس اس کو بیان کرتے وقت گھٹنوں کے بل گرا دیتے تھے - اور قتادہ کے ذریعے ابو قلابہ سے ابو اسماء الربیعی سے، اگرچہ ابوذر میں احمد کا لفظ مکمل ہے، اگرچہ ابوذر میں احمد کا لفظ زیادہ ہے۔ الترمذی ⁦(2495، درجہ حسن)⁩ اور ابن ماجہ بذریعہ شہر بن حوشب سے عبدالرحمٰن بن غنم سے ابوذر سے ایک مکمل الفاظ میں 'سب سے زیادہ خدا ترس دل' پر مشتمل ہے، 'میرے اقتدار میں مچھر کا بازو نہیں ڈالوں گا'، 'میں جو کچھ کروں گا، میں وسیلہ ہوں، میں قادر ہوں؛ میرا دینا بولنا ہے اور میری سزا بولنا ہے۔ کسی چیز کے بارے میں میرا حکم یہ ہے کہ جب میں چاہوں تو صرف یہ کہوں کہ ہو جا، اور وہ ہے، جب کہ ابو موسیٰ اشعری سے متوازی الطبرانی کا ایک ضعیف سلسلہ ہے جو کہ عبد الملک بن ہارون بن عنطارہ کی بنا پر ہے جسے ابو حاتم نے 'حدیث میں مردود' کہا ہے اور 'جھوٹا' کہا ہے جسے امام یحییٰ بن احمد نے کہا ہے۔ شام کے؛ ابن رجب اپنی طرف سے ظلم کی قرآنی نفی کا حوالہ دیتے ہوئے، 'میں نے اپنے اوپر ظلم کو حرام کیا ہے' کی وضاحت کرتے ہوئے، اس نے اپنے بندوں سے اس کو روکا ہے، نوٹ کیا ہے کہ بہت سے علماء کے لیے ناانصافی چیزوں کو اپنی جگہ سے باہر رکھ رہی ہے - لہذا حدیث سے معلوم ہوتا ہے کہ خدا ظلم کرنے پر قادر ہے لیکن فضل اور احسان کے باوجود نہیں کرتا۔ اس کی تعریف بغیر اجازت کے کسی دوسرے کے مال میں تصرف کرنا، ایاس بن معاویہ سے منقول ہے، اسے اس کے لیے ناممکن سمجھیں کیونکہ وہ جو کچھ بھی کرتا ہے وہ اس کی اپنی سلطنت میں ہوتا ہے، جیسا کہ ابو الاسود الدعالی نے عمران بن الحسین سے جب الٰہی کے بارے میں پوچھا تو جواب دیا؛ ابن رجب نے ابی بن کعب اور اسی طرح ابن مسعود اور زید بن ثابت سے بھی نقل کیا ہے کہ اگر خدا اپنے آسمانوں اور زمین والوں کو عذاب دینے والا ہوتا تو وہ ان کے ساتھ ناانصافی کیے بغیر ایسا کرتا، یہ بیان کرتے ہوئے کہ اس کا سلسلہ وہب بن خالد کی وجہ سے سوال کے لئے کھلا ہے - اور خدا نے اپنے بندوں کے درمیان ان کی تخلیق کی۔ اس کا مطلب یہ نہیں کہ وہ ناانصافی سے بیان کیا گیا ہے، کیونکہ وہ صرف اس کے اپنے اعمال سے بیان کیا گیا ہے، ان کے نہیں۔ اور بندوں کے درمیان ناانصافی دو طرح کی ہے: اپنی جان پر ظلم جس کی سب سے بڑی شکل وابستگی ہے - 'وابستگی درحقیقت بہت بڑا ظلم ہے' ⁦(لقمان 13)⁩ - اس کے بعد چھوٹے اور بڑے گناہ اور دوسروں کے ساتھ ناانصافی، اس حدیث کا مضمون، فصاحت و بلاغت میں ہے۔ املاک اور عزتیں مقدس ہیں، بذریعہ 'ظلم قیامت کے دن اندھیرے ہوں گے'، اور 'خدا ظالم کو اس وقت تک مہلت دیتا ہے جب تک کہ جب اسے پکڑ لے تو اسے بھاگنے نہیں دیتا' ہود 102 کے ساتھ پڑھیں ⁦(جامع العلوم والحکم صفحہ 511-532)⁩۔"
