  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Önemli Şahsiyetlerin Biyografik Sözlüğü) adlı eserinin 2. cildinin 450. sayfasından, Müslüman olmayan milletleri, dinleri ve halkları anlatan bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. \"Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar\" için tarayıcı tarafından derlenmiştir."
