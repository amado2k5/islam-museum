text: "… وكراهية الجلوس قبل أن يصلي ركعتين في أي وقت دخل وسواء صلي ركعتين بنية التحية أو صلاة فريضة أو سنة راتبة أو غيرها. - باب استحباب ركعتين بعد الوضوء. - باب فضل يوم الجمعة ووجوبها والاغتسال لها والطيب والتكبير إليها …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 383، يرد فيه ذكر الفريضة والفرائض، والوجوب، والمستحب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 383, whose wording mentions the obligation (farida), obligation (wujub), the recommended (mustahabb), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 383 کا اقتباس جس میں فریضہ اور فرائض، وجوب، مستحب، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin de al-Nawawi, volume numérisé 3, p. 383, dont le texte mentionne l'obligation (farida), l'obligation (wujub), le recommandé (mustahabb), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
