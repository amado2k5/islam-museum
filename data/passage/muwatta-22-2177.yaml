label: { ar: "الموطأ 2177 — يحيى عن مالك عن ابن شهاب عن حرام بن سعد بن محيصة: أن ناقة للبراء بن عازب دخلت حائط رجل فأفسدت فيه، فقضى رسول الله أن على أهل الحوائط حفظها بالنهار، وأن ما أفسدت المواشي بالليل ضامن على أهلها", en: "Muwatta 2177" }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن حرام بن سعد بن محيصة أن ناقة للبراء بن عازب دخلت حائط قوم، فأفسدت فيه، فقضى رسول الله أن على أهل الحوائط حفظها بالنهار، وأن ما أفسدت المواشي بالليل ضامن على أهلها. ويذكر المحقق أن جميع رواة الموطأ رووه مرسلا، وأن الاختلاف فيه على ابن شهاب كثير، وأن الحديث مع إرساله مشهور عند فقهاء الحجاز. {cite:muwatta-maruf-1997 p.293} {cite:muwatta-maruf-1997 p.294}"
