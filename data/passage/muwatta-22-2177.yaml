label: { ar: "الموطأ 2177 — يحيى عن مالك عن ابن شهاب عن حرام بن سعد بن محيصة: أن ناقة للبراء بن عازب دخلت حائط رجل فأفسدت فيه، فقضى رسول الله أن على أهل الحوائط حفظها بالنهار، وأن ما أفسدت المواشي بالليل ضامن على أهلها", en: "Muwatta 2177", es: "Muwatta 2177", fr: "Muwatta 2177", ur: "موطا 2177", tr: "El-Muvatta 2177 — Yahya, Malik'ten, o da İbn Şihab'dan, o da Haram ibn Sa'd ibn Muhayşe'den rivayetle: El-Bara' ibn Azib'e ait bir deve bir adamın bahçesine girip ona zarar verdi. Allah Resulü şöyle hükmetti: Bahçe sahipleri gündüzleri bahçelerini korumakla yükümlüdürler ve geceleyin hayvanların verdiği zararlardan da sorumludurlar.", id: "Al-Muwatta 2177 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Haram ibn Sa’d ibn Muhaysah: bahwa seekor unta milik Al-Bara’ ibn Azib memasuki kebun seorang pria dan merusaknya. Rasulullah SAW menetapkan bahwa pemilik kebun bertanggung jawab untuk melindunginya pada siang hari, dan bahwa pemilik bertanggung jawab atas kerusakan apa pun yang disebabkan oleh ternak pada malam hari." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن حرام بن سعد بن محيصة أن ناقة للبراء بن عازب دخلت حائط قوم، فأفسدت فيه، فقضى رسول الله أن على أهل الحوائط حفظها بالنهار، وأن ما أفسدت المواشي بالليل ضامن على أهلها. ويذكر المحقق أن جميع رواة الموطأ رووه مرسلا، وأن الاختلاف فيه على ابن شهاب كثير، وأن الحديث مع إرساله مشهور عند فقهاء الحجاز. {cite:muwatta-maruf-1997 p.293} {cite:muwatta-maruf-1997 p.294}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, dari Haram ibn Sa'd ibn Muhaysah, bahwa seekor unta milik al-Bara' ibn 'Azib memasuki kebun milik beberapa orang dan menyebabkan kerusakan. Rasulullah shalla Allahu alaihi wa sallam menetapkan bahwa pemilik kebun bertanggung jawab untuk menjaganya pada siang hari, dan bahwa kerusakan yang disebabkan oleh ternak pada malam hari adalah tanggung jawab pemiliknya. Peneliti mencatat bahwa semua perawi al-Muwatta' meriwayatkannya sebagai mursal (hadits dengan mata rantai periwayatan yang hilang), bahwa ada banyak pendapat yang berbeda mengenai periwayatannya dari Ibn Shihab, dan bahwa hadits tersebut, meskipun berstatus mursal, sangat terkenal di kalangan ulama Hijaz. {cite:muwatta-maruf-1997 p.293} {cite:muwatta-maruf-1997 p.294}"
