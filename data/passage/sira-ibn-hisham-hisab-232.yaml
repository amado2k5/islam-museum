text: "… وَلَوْ بِشِقَّ مِنَ تَمْرَةٍ فَلَيَفْعَلْ، وَمَنْ لَمْ يَجِدْ فَبِكَلِمَةٍ طَيّبَةٍ، فَإِنَّ بِهَا تُجْزَى الْحَسَنَةُ عَشْرَ أَمْثَالِهَا إِلى سَبْعِمائَةِ ضِعْفٍ، وَالسَّلَاَمُ عَلَيْكُم وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ . خطبته الثانية وَا اليم قال ابن إسحاق: ثم خطب رسول اللّٰه لِفِ الناسَ مرة أخرى، …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 232، يذكر مضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hisham's Sirah, p. 232, that speaks of the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "سیرت ابن ہشام کے صفحہ 232 کا اقتباس جس میں نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
