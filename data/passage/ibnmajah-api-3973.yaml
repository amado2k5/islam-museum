label: { ar: "سنن ابن ماجه 3973 — الصلاة والزكاة والصوم والحج مجتمعة", en: "Sunan Ibn Majah 3973 — the prayer, the zakat, the fast and the pilgrimage named together", ur: "سنن ابن ماجہ 3973 — نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Sunan Ibn Majah 3973 — la oración, el zakat, el ayuno y la peregrinación mencionados juntos", fr: "Sunan Ibn Majah 3973 — la prière, la zakat, le jeûne et le pèlerinage sont mentionnés ensemble" }
text: "… عَظِيمًا وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ تَعْبُدُ اللَّهَ لاَ تُشْرِكُ بِهِ شَيْئًا وَتُقِيمُ الصَّلاَةَ وَتُؤْتِي الزَّكَاةَ وَتَصُومُ رَمَضَانَ وَتَحُجُّ الْبَيْتَ \". ثُمَّ قَالَ \" أَلاَ أُدُلُّكَ عَلَى أَبْوَابِ الْجَنَّةِ الصَّوْمُ جُنَّةٌ وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ النَّارَ الْمَاءُ وَصَلاَةُ الرَّجُلِ فِي جَوْفِ اللَّيْلِ \". ثُمَّ قَرَأَ {تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ} حَتَّى بَلَغَ {جَزَاءً …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3973، يذكر الصلاة والزكاة والصوم والحج مجتمعة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Ibn Majah, no. 3973 (Tribulations), that mentions the prayer, the zakat, the fast and the pilgrimage named together. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3973، جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3973 (Tribulaciones), menciona la oración, el zakat, el ayuno y la peregrinación en conjunto. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Ibn Majah, n° 3973 (Tribulations), mentionne la prière, la zakat, le jeûne et le pèlerinage ensemble. Le moteur de recherche « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
