label: { ar: "صحيح البخاري 4059 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 4059 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 4059 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 4059 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos." }
text: "حَدَّثَنَا يَسَرَةُ بْنُ صَفْوَانَ، حَدَّثَنَا إِبْرَاهِيمُ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ شَدَّادٍ، عَنْ عَلِيٍّ ـ قَالَ مَا سَمِعْتُ النَّبِيَّ جَمَعَ أَبَوَيْهِ لأَحَدٍ إِلاَّ لِسَعْدِ بْنِ مَالِكٍ، فَإِنِّي سَمِعْتُهُ يَقُولُ يَوْمَ أُحُدٍ \" يَا سَعْدُ ارْمِ، فِدَاكَ أَبِي وَأُمِّي \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4059، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4059 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4059، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4059 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
