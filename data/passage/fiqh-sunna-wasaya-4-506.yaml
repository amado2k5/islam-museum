text: "… موتها استقبلت القبلة ثم توسدت يمينها. وهذه الصفة التي أمر الرسول النائم أن ينام عليها، والتي يكون عليها الميت في قبره. وفي رواية عن الشافعي : أن المحتضر يستلقي على قفاه وقدماه إلى القبلة وترفع رأسه قليلا ليصير وجهه إليها، …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 506، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 506, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 506 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 4, pág. 506, que menciona el lecho de muerte y las últimas horas, el entierro, la tumba o el lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 4, page 506, mentionnant un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Seyyid Sabiq'in *Fıkıh el-Sünne* adlı eserinin 4. cildinin 506. sayfasından alınan bu alıntı, ölüm anı ve ölüm süreci, defin, mezar ve istirahat yeri konularını ele almaktadır; metin, makineyle okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miras, antikalar ve istirahat yerleri araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Fiqh al-Sunnah* karya Sayyid Sabiq, Jilid 4, halaman 506, membahas tentang saat kematian dan proses sekarat, penguburan, kuburan, dan tempat peristirahatan; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat peristirahatan."
