text: "… قلبٍ منه. فقلت : إلى أَرى أَمرَ محمّدٍ أَمرًا قد أَمن وغلظ.، أَوقع بِقُرَيشِ فصنع بهم ما صنع، ثم أَوقع بأَهل الحُصون بيَذْرِب، قَيْنُقاع وبنى النَّضِير وقُرَيْظَة، وهو سائر إلى هؤلاء بَخْيبر. فقال لى وبَر : لا تخش ذلك ! …"
summary:
