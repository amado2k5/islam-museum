text: "المقرءُ، قال : حدثنا الليثُ، قال : حدثنا أبو الزبير، عن جابرٍ، قال : رُميّ سعد بن مُعاذٍ يوم الأحزاب، فقطعوا أكحلُه، فحسمه رسول اللّٰه كل بالنار، فانتفخت يده فتركه فنزف الدمُ، فحَسمهُ أخرى، فانتفخت يده، فلما رأى ذلك قال …"
