text: "الأدوية المفردة باب الغاء وأصله ينقي البشرة ويذهب بالبثر ومتى خلط بخل أو بعسل أو ترك وحده واستعمل أبرأ الجراحات قبل أن تعتق. وإذا تضمد به حلل ورم الطحال، ونقى الكلف وداء الثعلب ؛ ويوافق النقرس. وطبيخه متى صب على …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3228، يذكر أسماء الأمراض، والبرء من العلة، وأعضاء البدن، ومداواة الجراح، والدواء، والداء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3228, that mentions named diseases, recovery from an ailment, the organs of the body, the treatment of wounds, the drug, the disease and its remedy, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3228 کا اقتباس جس میں بیماریوں کے نام، بیماری سے شفایابی، اعضائے بدن، زخموں کا علاج، دوا، بیماری، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
