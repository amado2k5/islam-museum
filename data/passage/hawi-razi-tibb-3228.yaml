text: "الأدوية المفردة باب الغاء وأصله ينقي البشرة ويذهب بالبثر ومتى خلط بخل أو بعسل أو ترك وحده واستعمل أبرأ الجراحات قبل أن تعتق. وإذا تضمد به حلل ورم الطحال، ونقى الكلف وداء الثعلب ؛ ويوافق النقرس. وطبيخه متى صب على …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3228، يذكر أسماء الأمراض، والبرء من العلة، وأعضاء البدن، ومداواة الجراح، والدواء، والداء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3228, that mentions named diseases, recovery from an ailment, the organs of the body, the treatment of wounds, the drug, the disease and its remedy, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3228 کا اقتباس جس میں بیماریوں کے نام، بیماری سے شفایابی، اعضائے بدن، زخموں کا علاج، دوا، بیماری، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 3228, que menciona enfermedades específicas, la recuperación de una dolencia, los órganos del cuerpo, el tratamiento de heridas, el medicamento, la enfermedad y su remedio, medicamentos y farmacia; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 3228, qui mentionne des maladies nommées, la guérison d'une affection, les organes du corps, le traitement des plaies, le médicament, la maladie et son remède, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 3228. sayfasından, hastalıkların isimleri, hastalıktan iyileşme, vücut organları, yaraların tedavisi, ilaç, hastalık, uyuşturucu ve eczacılık konularından bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 3228, yang menyebutkan nama-nama penyakit, pemulihan dari penyakit, organ tubuh, pengobatan luka, obat-obatan, penyakit, narkoba dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
