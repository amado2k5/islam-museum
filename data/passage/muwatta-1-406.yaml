label: { ar: "الموطأ 406 — ابن عمر يصلي وراء الإمام بمنى أربعاً ولنفسه ركعتين", en: "Muwatta 406", es: "Muwatta 406", fr: "Muwatta 406", ur: "موطا 406", tr: "El-Muvatta 406 — İbn Ömer, Mina'da imamın arkasında dört rekat namaz kıldı, kendisi de iki rekat namaz kıldı.", id: "Al-Muwatta 406 — Ibnu Umar shalat di belakang imam di Mina, empat rakaat, dan dua rakaat untuk dirinya sendiri." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب صلاة المسافر إذا كان إماماً أو كان وراء إمام: كان عبد الله بن عمر يصلي وراء الإمام بمنى أربعاً، فإذا صلى لنفسه صلى ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.213}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, imama önderlik eden veya imamın arkasında namaz kılan bir yolcunun namazı bölümünde şöyle denmektedir: Abdullah ibn Umar, Mina'da imamın arkasında dört rekat namaz kılardı, yalnız namaz kıldığında ise iki rekat kılardı. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suwaid ve İbn Wahb tarafından rivayet edildiğini, el-Tahavi ve Muhammed ibn Hasan tarafından da kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.213}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’, dalam bab tentang shalat musafir ketika memimpin shalat imam atau shalat di belakang imam: Abdullah ibn Umar biasa shalat empat rakaat di belakang imam di Mina, dan ketika shalat sendirian, ia shalat dua rakaat. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus’ab, Suwaid, dan Ibn Wahb, sebagaimana dicatat oleh al-Tahawi dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.213}"
