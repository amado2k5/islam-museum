label: { ar: "الموطأ 406 — ابن عمر يصلي وراء الإمام بمنى أربعاً ولنفسه ركعتين", en: "Muwatta 406" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب صلاة المسافر إذا كان إماماً أو كان وراء إمام: كان عبد الله بن عمر يصلي وراء الإمام بمنى أربعاً، فإذا صلى لنفسه صلى ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.213}"
