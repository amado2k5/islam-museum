label: { ar: "جامع الترمذي 931 — الواجب، التطوع", en: "Jami' al-Tirmidhi 931 — the obligatory (wajib); the voluntary act (tatawwu')", ur: "جامع ترمذی 931 — واجب، تطوع ⁦(نفلی عمل)⁩", fr: "Jami' al-Tirmidhi 931 — l'obligatoire (wajib) ; l'acte volontaire (tatawwu')", es: "Yami' al-Tirmidhi 931 — lo obligatorio (wajib); el acto voluntario (tatawwu')" }
text: "… قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَهُوَ قَوْلُ بَعْضِ أَهْلِ الْعِلْمِ قَالُوا الْعُمْرَةُ لَيْسَتْ بِوَاجِبَةٍ. وَكَانَ يُقَالُ هُمَا حَجَّانِ الْحَجُّ الأَكْبَرُ يَوْمَ النَّحْرِ وَالْحَجُّ الأَصْغَرُ الْعُمْرَةُ. وَقَالَ الشَّافِعِيُّ الْعُمْرَةُ سُنَّةٌ لاَ نَعْلَمُ أَحَدًا رَخَّصَ فِي تَرْكِهَا وَلَيْسَ فِيهَا شَيْءٌ ثَابِتٌ بِأَنَّهَا تَطَوُّعٌ وَقَدْ رُوِيَ عَنِ النَّبِيِّ بِإِسْنَادٍ وَهُوَ ضَعِيفٌ لاَ تَقُومُ بِمِثْلِهِ الْحُجَّةُ وَقَدْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 931، يرد فيه ذكر الواجب، والتطوع، وما ليس بواجب، والرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 931 (The Book on Hajj), whose wording mentions the obligatory (wajib), the voluntary act (tatawwu'), what is said not to be obligatory, the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 931، جس کے الفاظ میں واجب، تطوع ⁦(نفلی عمل)⁩، جو واجب نہیں، رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 931, dont le texte mentionne l'obligatoire (wajib), l'acte volontaire (tatawwu'), ce qui est dit non obligatoire, la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 931, cuyo texto menciona lo obligatorio (wajib), el acto voluntario (tatawwu'), lo que se dice que no es obligatorio, la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
