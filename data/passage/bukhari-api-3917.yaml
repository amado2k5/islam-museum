label: { ar: "صحيح البخاري 3917 — الأب والأبوة", en: "Sahih al-Bukhari 3917 — the father and fatherhood", ur: "صحیح بخاری 3917 — باپ اور والدیت", es: "Sahih al-Bukhari 3917 — El padre y la paternidad" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عُثْمَانَ، حَدَّثَنَا شُرَيْحُ بْنُ مَسْلَمَةَ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ يُوسُفَ، عَنْ أَبِيهِ، عَنْ أَبِي إِسْحَاقَ، قَالَ سَمِعْتُ الْبَرَاءَ، يُحَدِّثُ قَالَ ابْتَاعَ أَبُو بَكْرٍ مِنْ عَازِبٍ رَحْلاً فَحَمَلْتُهُ مَعَهُ قَالَ فَسَأَلَهُ عَازِبٌ عَنْ مَسِيرِ رَسُولِ اللَّهِ قَالَ أُخِذَ عَلَيْنَا بِالرَّصَدِ، فَخَرَجْنَا لَيْلاً، فَأَحْثَثْنَا لَيْلَتَنَا وَيَوْمَنَا حَتَّى قَامَ قَائِمُ الظَّهِيرَةِ، ثُمَّ رُفِعَتْ لَنَا صَخْرَةٌ، فَأَتَيْنَاهَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3917، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3917 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3917، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3917 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
