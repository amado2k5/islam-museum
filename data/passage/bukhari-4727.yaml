label:
  ar: "البخاري 4727 — موسى والعبد الصالح بمجمع البحرين"
  en: "Bukhari 4727 — Musa and the righteous servant at the meeting of the two seas"
  ur: "بخاری 4727 — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
  es: "Bujari 4727 — Moisés y el siervo justo en el encuentro de los dos mares"
  fr: "Bukhari 4727 — Moïse et le serviteur vertueux au confluent des deux mers"
  tr: "Buhari 4727 — Musa ve salih kul, iki denizin birleştiği yerde"
  id: "Al-Bukhari 4727 — Musa dan hamba yang saleh di pertemuan dua laut"
text: "قام موسى خطيبا في بني إسرائيل فقيل له أى الناس أعلم قال أنا، فعتب الله عليه، إذ لم يرد العلم إليه، وأوحى إليه بلى عبد من عبادي بمجمع البحرين، هو أعلم منك قال أى رب كيف السبيل إليه قال تأخذ …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4727: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4727: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4727: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 4727: Moisés y el siervo justo en el encuentro de los dos mares. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 4727: Moïse et le pieux au confluent des deux mers. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 4727 numaralı hadis-i kudsi şöyledir: Musa ve salih kul, iki denizin birleştiği yerde. Peygamberimiz bunu Rabbinden rivayet eder ve hadis-i kudsi, bu rivayetleri altı şeriat hadis külliyatında ve el-Muvatta'da derler."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 4727: Musa dan hamba yang saleh di pertemuan dua laut. Nabi meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
