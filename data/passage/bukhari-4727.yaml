label:
  ar: "البخاري 4727 — موسى والعبد الصالح بمجمع البحرين"
  en: "Bukhari 4727 — Musa and the righteous servant at the meeting of the two seas"
  ur: "بخاری 4727 — موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ"
text: "قام موسى خطيبا في بني إسرائيل فقيل له أى الناس أعلم قال أنا، فعتب الله عليه، إذ لم يرد العلم إليه، وأوحى إليه بلى عبد من عبادي بمجمع البحرين، هو أعلم منك قال أى رب كيف السبيل إليه قال تأخذ …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4727: موسى والعبد الصالح بمجمع البحرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4727: Musa and the righteous servant at the meeting of the two seas. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4727: موسیٰ اور دو سمندروں کے سنگم پر نیک بندہ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
