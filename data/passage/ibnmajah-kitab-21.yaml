summary:
  ar: "القسم 21 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الديات»، ويضم فيها النصوص من 2615 إلى 2694 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 21 of Sunan Ibn Majah (The Chapters on Blood Money) in the division of the open hadith dataset the museum took its reports from: reports 2615 to 2694 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 21، عنوان «کتاب الدیات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2615 تا 2694۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 21 de Sunan Ibn Majah (Los capítulos sobre el dinero manchado de sangre) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2615 al 2694 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 21 du Sunan Ibn Majah (chapitres relatifs au prix du sang), à partir des hadiths publics: les hadiths 2615 à 2694 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
