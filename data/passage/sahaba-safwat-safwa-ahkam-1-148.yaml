text: "… وينكسر بيضه. وعن قيس بن جبير قال: قال عبد الله: حبذا المكروهات: الموت، والفقر، وايم اللّٰه إن هو إلا الغنى والفقر، وما أبالي بأيهما بليت، إن حق اللّٰه في كل واحد منهما واجب، وإن كان الغنى ففيه العطف، وإن كان …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 148، يرد فيه ذكر الواجب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 148, whose wording mentions the obligatory (wajib), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
