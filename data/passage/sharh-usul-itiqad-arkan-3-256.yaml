text: "… مَبْرُورٌ. السابع عشر: حُبُّ رسولِ اللّٰه، لقولِه: لَا يَؤْمِنُ أَحَدُكُمْ حتَّى أَكُوْنَ أَحَبَّ إلَيهِ مِنْ وَلَده، وَوَالِدِهِ، وَالنَّاسِ أَجْمَعِينَ. الثامن عشر، والتاسع عشر، والعشرون: ما دخلَ تحت قوله - -: ثَلَاثٌ مَنْ كُنَّ فِيهِ وَجَدَ حَلَاوَةَ الإيمانِ: أَنْ يكُوْنَ اللّٰه …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 256، يذكر حلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 256, that mentions the sweetness and completeness of faith, what faith is not complete without, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 256 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، جس کے بغیر ایمان مکمل نہیں، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 3, pág. 256, que menciona la dulzura y la plenitud de la fe, aquello sin lo cual la fe no está completa, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (volume 3, p. 256), évoquant la douceur et la plénitude de la foi, ce sans quoi elle est incomplète, et les qualités qui, chez une personne, la caractérisent. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan, 3. cilt, 256. sayfada yer alan eserinden bir alıntı, imanın tatlılığı ve mükemmelliğinden, tamamlanması için gerekli olanlardan ve ona sahip olanların niteliklerinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid bergambar 3, halaman 256, menyebutkan kemanisan dan kesempurnaan iman, apa yang penting untuk penyempurnaannya, dan kualitas orang-orang yang memilikinya. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan kualitas seorang mukmin."
