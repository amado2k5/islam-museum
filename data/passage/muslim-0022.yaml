label: { ar: "مسلم 22 — أُمرت أن أقاتل الناس حتى يشهدوا", en: "Muslim 22 — I was commanded to fight the people until they testify" }
text: "قال رسول الله: «أمرت أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأن محمداً رسول الله، ويقيموا الصلاة ويؤتوا الزكاة، فإذا فعلوا عصموا مني دماءهم وأموالهم إلا بحقها وحسابهم على الله»"
summary:
  ar: "رواية عبد الله بن عمر في كتاب الإيمان من صحيح مسلم؛ أركان العصمة: الشهادتان والصلاة والزكاة، وعصمة الدم والمال إلا بالحق — قرأه على قوله تعالى «إنما أنت مذكر لست عليهم بمسيطر»."
