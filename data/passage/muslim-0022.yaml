label: { ar: "مسلم 22 — أُمرت أن أقاتل الناس حتى يشهدوا", en: "Muslim 22 — I was commanded to fight the people until they testify", es: "Musulmán 22 — Se me ordenó luchar contra el pueblo hasta que testifiquen", fr: "Muslim 22 — Il m’a été ordonné de combattre le peuple jusqu’à ce qu’il témoigne.", ur: "مسلم 22 - مجھے حکم دیا گیا تھا کہ لوگوں سے اس وقت تک لڑوں جب تک وہ گواہی نہ دیں۔", tr: "Müslim 22 — Bana, insanlar şahitlik edinceye kadar onlarla savaşmam emredildi.", id: "Muslim 22 — Aku diperintahkan untuk memerangi orang-orang itu sampai mereka bersaksi" }
text: "قال رسول الله: «أمرت أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأن محمداً رسول الله، ويقيموا الصلاة ويؤتوا الزكاة، فإذا فعلوا عصموا مني دماءهم وأموالهم إلا بحقها وحسابهم على الله»"
summary:
  ar: "رواية عبد الله بن عمر في كتاب الإيمان من صحيح مسلم؛ أركان العصمة: الشهادتان والصلاة والزكاة، وعصمة الدم والمال إلا بالحق — قرأه على قوله تعالى «إنما أنت مذكر لست عليهم بمسيطر»."
  tr: "Abdullah bin Ömer'in Sahih Müslim'deki İman Kitabı'nda rivayet ettiği üzere, masumiyetin rükünleri şunlardır: İmanın iki şahadeti olan namaz ve zekât; kan ve paranın ise hak dışında masumiyeti. Bunu, Yüce Allah'ın \"Sen sadece bir hatırlatıcısın, onları kontrol eden değilsin\" sözüne dayanarak okumuştur."
  id: "Diriwayatkan oleh Abdullah bin Omar dalam Kitab Iman dari Sahih Muslim; rukun-rukun kemaksuman: dua kesaksian iman, salat, dan zakat, serta kemaksuman darah dan harta benda kecuali dengan hak — beliau membacanya berdasarkan firman Allah Yang Maha Kuasa, “Kamu hanyalah pemberi peringatan; kamu bukanlah penguasa atas mereka.”"
