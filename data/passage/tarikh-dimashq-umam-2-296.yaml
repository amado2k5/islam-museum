text: "… ظهرت فتنة بالغرب وظهر منهم مامون اخو ممدان قرمط بارض فارس وقرامطة فارس يقال لهم المأنوية وظهر بارض الديم رجل من الباطنية يعرف بابى حاتم فاستجاب له جماعة من الديا الى ان قام بالدعوة لهم بما وراء النهر محمد بن …"
