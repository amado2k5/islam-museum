  ar: "سنن النسائي، كتاب الكسوف"
  en: "Sunan al-Nasa'i, Book 16: The Book of Eclipses"
  ur: "سنن نسائی، کتاب الکسوف"
  es: "Sunan al-Nasa'i, Libro 16: El Libro de los Eclipses"
  fr: "Sunan al-Nasa'i, Livre 16: Le Livre des Éclipses"
summary:
  ar: "القسم 16 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الكسوف»، ويضم فيها النصوص من 1459 إلى 1503 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 16 of Sunan al-Nasa'i (The Book of Eclipses) in the division of the open hadith dataset the museum took its reports from: reports 1459 to 1503 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 16، عنوان «کتاب الکسوف»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1459 تا 1503۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 16 de Sunan al-Nasa'i (El Libro de los Eclipses) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1459 al 1503, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre des Éclipses), dans le recueil ouvert de hadiths, les rapports 1459 à 1503. Il conserve ces informations sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
