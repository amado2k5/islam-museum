label: { ar: "صحيح مسلم 253 — بر الوالدين أو عقوقهما", en: "Sahih Muslim 253 — dutifulness to the parents or disobedience to them", ur: "صحیح مسلم 253 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih Muslim 253 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sahih Muslim 253 — le respect des parents ou la désobéissance envers eux", tr: "Sahih Muslim 253 — Anne babaya iyilik mi, itaatsizlik mi?", id: "Sahih Muslim 253 — Kebaikan atau ketidaktaatan kepada orang tua" }
text: "… الْفَزَارِيُّ، حَدَّثَنَا أَبُو يَعْفُورٍ، عَنِ الْوَلِيدِ بْنِ الْعَيْزَارِ، عَنْ أَبِي عَمْرٍو الشَّيْبَانِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، قَالَ قُلْتُ يَا نَبِيَّ اللَّهِ أَىُّ الأَعْمَالِ أَقْرَبُ إِلَى الْجَنَّةِ قَالَ \" الصَّلاَةُ عَلَى مَوَاقِيتِهَا \". قُلْتُ وَمَاذَا يَا نَبِيَّ اللَّهِ قَالَ \" بِرُّ الْوَالِدَيْنِ \". قُلْتُ وَمَاذَا يَا نَبِيَّ اللَّهِ قَالَ \" الْجِهَادُ فِي سَبِيلِ اللَّهِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 253، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 253 (The Book of Faith), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 253، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 253 (El Libro de la Fe), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 253 (Le Livre de la Foi), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih Müslim'de 253 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. Bu hadis, \"İslam'da Anne Babalık\" tarayıcısı tarafından Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 253, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Hadits ini dikumpulkan oleh peramban \"Parenthood in Islam\" bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
