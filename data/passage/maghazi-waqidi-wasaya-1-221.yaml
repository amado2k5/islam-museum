text: "… مُصْعَب بن عُمَير، فتقدّم به بين يدى رسول اللّٰه. ثم قام رسول اللّٰه فخطب الناس فقال : يا أَيّها الناس، أُوصيكم بما أَوصانى اللّٰه فى كتابه من العمل بِطاعتد والتَّناهِي عن مَحارمه. ثم إنكم اليوم بمنزل أَجْرٍ وذُخْرٍ لِمَن ذكر …"
