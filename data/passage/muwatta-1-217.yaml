label: { ar: "الموطأ 217 — يزيد بن رومان يفتح على نافع بن جبير في الصلاة", en: "Muwatta 217" }
summary:
  ar: "أثر يرويه مالك عن يزيد بن رومان، في باب العمل في القراءة: كان يصلي إلى جانب نافع بن جبير بن مطعم فيغمزه نافع إذا ارتج عليه فيفتح عليه وهما في الصلاة، أي يلقّنه الآية. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وهارون بن عيسى عند ابن أبي شيبة. {cite:muwatta-maruf-1997 p.132}"
