label: { ar: "الموطأ 217 — يزيد بن رومان يفتح على نافع بن جبير في الصلاة", en: "Muwatta 217", es: "Muwatta 217", fr: "Muwatta 217", ur: "موطا 217", tr: "Al-Muwatta 217 — Yezid ibn Ruman, Nafi' ibn Jubayr için duayı açıyor", id: "Al-Muwatta 217 — Yazid ibn Ruman membuka doa untuk Nafi’ ibn Jubayr" }
summary:
  ar: "أثر يرويه مالك عن يزيد بن رومان، في باب العمل في القراءة: كان يصلي إلى جانب نافع بن جبير بن مطعم فيغمزه نافع إذا ارتج عليه فيفتح عليه وهما في الصلاة، أي يلقّنه الآية. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وهارون بن عيسى عند ابن أبي شيبة. {cite:muwatta-maruf-1997 p.132}"
  tr: "Malik'in Yezid ibn Ruman'dan rivayet ettiği, Kur'an okuma uygulaması bölümünde yer alan bir rivayete göre: Yezid ibn Ruman, Nafi' ibn Jubeyr ibn Mut'im'in yanında namaz kılardı ve Nafi', Yezid'in sözlerinde takıldığında onu dürterek, namaz kılarken ona ayeti öğretirdi. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Harun ibn İsa tarafından, İbn Abi Şeybe'nin de kaydıyla nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.132}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yazid ibn Ruman, dalam bab tentang praktik membaca Al-Quran: Ia biasa shalat di samping Nafi' ibn Jubayr ibn Mut'im, dan Nafi' akan menyenggolnya jika ia tersandung kata-katanya, membimbingnya saat mereka shalat, yaitu, mengajarinya ayat tersebut. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwayd, dan Harun ibn 'Isa, sebagaimana dicatat oleh Ibn Abi Shaybah. {cite:muwatta-maruf-1997 p.132}"
