label: { ar: "الموطأ 2846 — زيد بن أسلم: أعطوا السائل وإن جاء على فرس", en: "Muwatta 2846", es: "Muwatta 2846", fr: "Muwatta 2846", ur: "موطا 2846", tr: "El-Muvatta 2846 — Zeyd ibn Aslam: Dilenciye verin, atla gelse bile.", id: "Al-Muwatta 2846 — Zayd ibn Aslam: Berilah kepada pengemis, sekalipun ia datang dengan menunggang kuda." }
summary:
  ar: "يروي مالك عن زيد بن أسلم أن رسول الله قال: أعطوا السائل وإن جاء على فرس. ويذكر المحقق قول ابن عبد البر أنه لا خلاف بين رواة الموطأ في إرسال هذا الحديث. {cite:muwatta-maruf-1997 p.595}"
  tr: "Malik, Zeyd ibn Aslam'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu aktarır: \"Dilenciye, at üzerinde gelse bile, verin.\" Araştırmacı, İbn Abd el-Barr'ın, Muvatta'nın ravileri arasında bu hadisin mursal (rivayet zincirinde eksik halka bulunan hadis) olarak rivayet edilmesi konusunda görüş ayrılığı bulunmadığı yönündeki ifadesini aktarır. {cite:muwatta-maruf-1997 s.595}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam bahwa Rasulullah SAW bersabda: \"Berilah kepada pengemis, meskipun ia datang dengan menunggang kuda.\" Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa tidak ada perbedaan pendapat di antara para perawi al-Muwatta' mengenai periwayatan hadits ini sebagai mursal (hadits yang memiliki mata rantai periwayatan yang hilang). {cite:muwatta-maruf-1997 p.595}"
