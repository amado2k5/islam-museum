text: "… شُعْبَةُ، عَنْ هِشَامِ بْنِ زَيْدٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ امْرَأَةً، يَهُودِيَّةً أَتَتْ رَسُولَ اللَّهِ بِشَاةٍ مَسْمُومَةٍ فَأَكَلَ مِنْهَا فَجِيءَ بِهَا إِلَى رَسُولِ اللَّهِ فَسَأَلَهَا عَنْ ذَلِكَ فَقَالَتْ أَرَدْتُ لأَقْتُلَكَ. فَقَالَ \" مَا كَانَ اللَّهُ لِيُسَلِّطَكِ عَلَى ذَلِكَ \". أَوْ قَالَ \" عَلَىَّ \". قَالَ فَقَالُوا أَلاَ نَقْتُلُهَا قَالَ \" لاَ \". فَمَا زِلْتُ أَعْرِفُهَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4508، يذكر السم والترياق. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4508 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions poison and antidote. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4508، جس میں زہر اور تریاق کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
