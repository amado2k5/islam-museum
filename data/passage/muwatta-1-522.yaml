label: { ar: "الموطأ 522 — رأى بصاقاً في جدار القبلة فحكه: فإن الله قبل وجهه إذا صلى", en: "Muwatta 522" }
text: "إذا كان أحدكم يصلي فلا يبصق قبل وجهه، فإن الله تبارك وتعالى قبل وجهه إذا صلى"
summary:
  ar: "أول حديث في باب النهي عن البصاق في القبلة. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر: رأى النبي بصاقاً في جدار القبلة فحكه، ثم أقبل على الناس فقال: إذا كان أحدكم يصلي فلا يبصق قبل وجهه، فإن الله قبل وجهه إذا صلى. ويخرّجه المحقق عند البخاري (406) ومسلم (2/75) والنسائي (2/51) وأحمد وأبي عوانة والبغوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (14/154). {cite:muwatta-maruf-1997 p.270}"
