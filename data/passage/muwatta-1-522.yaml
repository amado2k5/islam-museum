label: { ar: "الموطأ 522 — رأى بصاقاً في جدار القبلة فحكه: فإن الله قبل وجهه إذا صلى", en: "Muwatta 522", es: "Muwatta 522", fr: "Muwatta 522", ur: "موطا 522", tr: "El-Muvatta 522 — Kıble duvarında tükürük gördü ve onu sildi; çünkü namaz kıldığı zaman Allah onun önündedir.", id: "Al-Muwatta 522 — Dia melihat air liur di dinding kiblat dan mengusapnya: karena Allah ada di hadapannya ketika dia berdoa." }
text: "إذا كان أحدكم يصلي فلا يبصق قبل وجهه، فإن الله تبارك وتعالى قبل وجهه إذا صلى"
summary:
  ar: "أول حديث في باب النهي عن البصاق في القبلة. يرويه يحيى عن مالك عن نافع عن عبد الله بن عمر: رأى النبي بصاقاً في جدار القبلة فحكه، ثم أقبل على الناس فقال: إذا كان أحدكم يصلي فلا يبصق قبل وجهه، فإن الله قبل وجهه إذا صلى. ويخرّجه المحقق عند البخاري (406) ومسلم (2/75) والنسائي (2/51) وأحمد وأبي عوانة والبغوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (14/154). {cite:muwatta-maruf-1997 p.270}"
  tr: "Kıbleye tükürmenin yasaklanması bölümündeki ilk hadis. Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayet etmiştir: Peygamberimiz kıble duvarında tükürük gördü ve onu kazıdı. Sonra insanlara dönerek şöyle buyurdu: \"Sizden biri namaz kılarken önüne tükürmesin, çünkü namaz kılarken Allah onun önündedir.\" Araştırmacı, bu hadisi Buhari (406), Müslim (2/75), Nesai (2/51), Ahmed, Ebu Evane, Bağavi ve Beyhaki'nin derlemelerinde Malik'in sahabelerinin rivayet zincirleriyle yer aldığını ve Temhid'e (14/154) atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.270}"
  id: "Hadits pertama dalam bab ini adalah tentang larangan meludah ke arah kiblat. Diriwayatkan oleh Yahya dari Malik, dari Nafi’, dari Abdullah ibn Umar: Nabi melihat ludah di dinding kiblat, lalu beliau membersihkannya. Kemudian beliau berpaling kepada orang-orang dan berkata: “Ketika salah seorang dari kalian sedang shalat, janganlah ia meludah di depannya, karena Allah ada di depannya ketika ia shalat.” Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (406), Muslim (2/75), al-Nasa’i (2/51), Ahmad, Abu ‘Awanah, al-Baghawi, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (14/154). {cite:muwatta-maruf-1997 p.270}"
