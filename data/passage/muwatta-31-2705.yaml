label: { ar: "الموطأ 2705 — صدقة بن يسار عن سعيد بن المسيب: أفتاه بلبس الخاتم", en: "Muwatta 2705", es: "Muwatta 2705", fr: "Muwatta 2705", ur: "موطا 2705", tr: "El-Muvatta 2705 — Sadaqah ibn Yasar, Said ibn el-Musayyab'dan rivayetle: Ona yüzük takmasına izin veren bir fetva verdi.", id: "Al-Muwatta 2705 — Sadaqah ibn Yasar berdasarkan Saeed ibn al-Musayyab: Dia memberikan fatwa yang memperbolehkan pemakaian cincin." }
summary:
  ar: "يروي مالك عن صدقة بن يسار أنه قال: سألت سعيد بن المسيب عن لبس الخاتم؟ فقال: البسه، وأخبر الناس أني أفتيتك بذلك. {cite:muwatta-maruf-1997 p.526}"
  tr: "Malik, Sadaqah ibn Yasar'dan rivayetle şöyle der: \"Sa'id ibn al-Musayyab'a yüzük takmak hakkında sordum. O da 'Tak ve insanlara bu hükmü sana benim verdiğimi söyle' dedi.\" {cite:muwatta-maruf-1997 s.526}"
  id: "Malik meriwayatkan dari Sadaqah ibn Yasar bahwa ia berkata: Aku bertanya kepada Sa'id ibn al-Musayyab tentang memakai cincin? Beliau menjawab: Pakailah, dan beritahukan kepada orang-orang bahwa aku telah memberikan fatwa ini kepadamu. {cite:muwatta-maruf-1997 p.526}"
