label: { ar: "الموطأ 1950 — مالك: بيع الأغدال على البرنامج مخالف لبيع الساج في جرابه، والأمر المعمول به عند الناس في ذلك، وهو ما مضى من عمل الأئمة", en: "Muwatta 1950" }
summary:
  ar: "قال مالك: وبيع الأغدال على البرنامج مخالف لبيع الساج في جرابه، والثوب في طيه، وما أشبه ذلك. ففرق بين ذلك الأمر المعمول به، ومعرفة ذلك في صدور الناس وما مضى من عمل الأئمة فيه، وأنه لم يزل من بيوع الناس الجائزة بينهم التي لا يرون بها بأسا، لأن بيع الأغدال على البرنامج على غير نشر، لا يراد به الغرر، وليس يشبه الملامسة. {cite:muwatta-maruf-1997 p.197} {cite:muwatta-maruf-1997 p.198}"
