label: { ar: "سنن ابن ماجه 577 — الأب والأبوة", en: "Sunan Ibn Majah 577 — the father and fatherhood", ur: "سنن ابن ماجہ 577 — باپ اور والدیت", es: "Sunan Ibn Majah 577 — El padre y la paternidad", fr: "Sunan Ibn Majah 577 — Le père et la paternité" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، قَالَ حَدَّثَنَا حَفْصُ بْنُ غِيَاثٍ، عَنْ جَعْفَرِ بْنِ مُحَمَّدٍ، عَنْ أَبِيهِ، عَنْ جَابِرٍ، قَالَ قُلْتُ يَا رَسُولَ اللَّهِ أَنَا فِي، أَرْضٍ بَارِدَةٍ فَكَيْفَ الْغُسْلُ مِنَ الْجَنَابَةِ فَقَالَ رَسُولُ اللَّهِ ـ \" أَمَّا أَنَا فَأَحْثُو عَلَى رَأْسِي ثَلاَثًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 577، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 577 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 577، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 577 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 577 (Le Livre de la Purification et sa Sunna), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
