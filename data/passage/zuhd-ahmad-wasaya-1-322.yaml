text: "… رَكْوَةٌ - أَوْ عُلْبَةٌ يَثُكُّ عُمَرُ - فِيهَا مَاءٌ، فَجَعَلَ يُدْخِلُ يَدَيْهِ فِي الْمَاءِ فَيَمْسَحُ بِهِمَا وَجَهَهُ، يَقُولُ: لا إِلَهَ إِلَّ الله، إِنَّ لِلْمَوْتِ سَكَرَاتٍ. ثُمَّ نَصَبَ يَدَهُ، فَجَعَلَ يَقُولُ: اللهم فِي الرَّفِيقِ الأَعْلَى. حَتَّى قُبِضَ وَمَالَتْ يَدُمُ. وعنها قَالَتْ: …"
