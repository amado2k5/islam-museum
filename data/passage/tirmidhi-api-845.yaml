label: { ar: "جامع الترمذي 845 — الحلال", en: "Jami' al-Tirmidhi 845 — the lawful", ur: "جامع ترمذی 845 — حلال", es: "Jami' al-Tirmidhi 845 — el lícito", fr: "Jami' al-Tirmidhi 845 — le licite" }
text: "… جَرِيرٍ، حَدَّثَنَا أَبِي قَالَ، سَمِعْتُ أَبَا فَزَارَةَ، يُحَدِّثُ عَنْ يَزِيدَ بْنِ الأَصَمِّ، عَنْ مَيْمُونَةَ، أَنَّ رَسُولَ اللَّهِ تَزَوَّجَهَا وَهُوَ حَلاَلٌ وَبَنَى بِهَا حَلاَلاً وَمَاتَتْ بِسَرِفَ وَدَفَنَّاهَا فِي الظُّلَّةِ الَّتِي بَنَى بِهَا فِيهَا. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ. وَرَوَى غَيْرُ وَاحِدٍ هَذَا الْحَدِيثَ عَنْ يَزِيدَ بْنِ الأَصَمِّ مُرْسَلاً أَنَّ رَسُولَ اللَّهِ تَزَوَّجَ مَيْمُونَةَ وَهُوَ حَلاَلٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 845، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 845 (The Book on Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 845، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 845 (El Libro del Hajj), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 845 (Le Livre du Hajj), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
