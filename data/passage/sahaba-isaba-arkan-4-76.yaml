text: "… إن لكل قول حقيقة فما حقيقة إيمانك ؟ صالح بن مسمار إن لكل نبى حواريا، وإن حوارى الزبير على جابر إن لكل نبى حواريا، وحوارى الزبير واثلة بن الخطاب إن للمسلم على المسلم إذا رآه أن يتزحزح له القرشى أم …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 4، ص 76، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 4, p. 76, that mentions what a believer owes a believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 4، ص 76 کا اقتباس جس میں مومن کا مومن پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 4, pág. 76, que menciona lo que un creyente le debe a otro; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 4, page 76), qui évoque les devoirs d'un croyant envers un autre; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 4. cildinin 76. sayfasından, bir müminin diğer bir mümin üzerindeki haklarından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Isabah* karya Ibnu Hajar, Jilid 4, halaman 76, yang menyebutkan hak-hak seorang mukmin atas mukmin lainnya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
