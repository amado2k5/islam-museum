label:
  ar: "سنن أبي داود، كتاب الأطعمة"
  en: "Sunan Abi Dawud, Book 28: Foods (Kitab Al-At'imah)"
  ur: "سنن ابی داؤد، کتاب الاطعمۃ"
  es: "Sunan Abi Dawud, Libro 28: Alimentos (Kitab Al-At'imah)"
summary:
  ar: "القسم 28 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأطعمة»، ويضم فيها النصوص من 3736 إلى 3854 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 28 of Sunan Abi Dawud (Foods (Kitab Al-At'imah)) in the division of the open hadith dataset the museum took its reports from: reports 3736 to 3854 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 28، عنوان «کتاب الاطعمۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3736 تا 3854۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 28 de Sunan Abi Dawud (Alimentos (Kitab Al-At'imah)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3736 al 3854, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
