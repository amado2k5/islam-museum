text: "… أصحاب طاعة، وفّقهم اللّٰه تعالى للصواب من القول والعمل، فقد فعلوا ما يجب عليهم من الإنكار بقلوبهم والسنتهم، وعرضوا أنفسهم لنصرته على حسب طاقتهم، فلما منعهم عثمان ضهنه من نصرته، علموا أن الواجب عليهم السمع والطاعة له، وأنهم إن خالفوه …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 271، يرد فيه ذكر الواجب، وما يجب على المكلف، والسمع والطاعة، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 271, whose wording mentions the obligatory (wajib), what is binding on the person addressed, hearing and obeying, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، خلال، ص 271 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، سننا اور ماننا، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de al-Khallal, p. 271, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, écouter et obéir, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de al-Khallal, p. 271, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, oír y obedecer, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 271. sayfasından bir alıntı, farz olan amelleri, sorumlu bir kişinin görevlerini ve dinleme ve itaat kavramlarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal, \"Al-Sunnah,\" halaman 271, menyebutkan amalan-amalan wajib, kewajiban-kewajiban orang yang bertanggung jawab, dan konsep mendengar dan menaati. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan-amalan wajib, kewajiban-kewajiban, amalan-amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil."
