label: { ar: "سنن ابن ماجه 1443 — المرض والمريض، عيادة المريض", en: "Sunan Ibn Majah 1443 — illness and the sick; visiting the sick", ur: "سنن ابن ماجہ 1443 — بیماری اور بیمار، بیمار کی عیادت", es: "Sunan Ibn Majah 1443 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sunan Ibn Majah 1443 — la maladie et les malades; la visite aux malades", tr: "Sunan İbn Majah 1443 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sunan Ibn Majah 1443 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا يُوسُفُ بْنُ يَعْقُوبَ، حَدَّثَنَا أَبُو سِنَانٍ الْقَسْمَلِيُّ، عَنْ عُثْمَانَ بْنِ أَبِي سَوْدَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ عَادَ مَرِيضًا نَادَى مُنَادٍ مِنَ السَّمَاءِ طِبْتَ وَطَابَ مَمْشَاكَ وَتَبَوَّأْتَ مِنَ الْجَنَّةِ مَنْزِلاً \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1443، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1443 (Chapters Regarding Funerals), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1443، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1443 (Capítulos sobre los funerales), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 1443 (Chapitres relatifs aux funérailles), évoque la maladie, les malades et les visites aux malades. Le Répertoire des ouvrages de médecine le répertorie parmi les textes traitant de médecine prophétique, de médecine, d'anatomie, de chirurgie, de médicaments et de traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 1443 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1443, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
