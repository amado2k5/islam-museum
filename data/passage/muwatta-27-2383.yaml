label: { ar: "الموطأ 2383 — سعيد بن المسيب: خطبة عمر في آية الرجم وحد الزنا", en: "Muwatta 2383" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه سمعه يقول: لما صدر عمر بن الخطاب من منى، أناخ بالأبطح، ثم دعا ربه أن يقبضه غير مضيع ولا مفرط، ثم قدم المدينة فخطب الناس: قد سُنت لكم السنن وفُرضت لكم الفرائض وتركتم على الواضحة، وحذّر من أن يقول قائل: لا نجد حدين في كتاب الله، فقد رجم النبي ورجمنا. وقال: لولا أن يقول الناس زاد عمر في كتاب الله لكتبت آية الرجم في المصحف، فإنا قرأناها. ويذكر المحقق قول ابن عبد البر في سماع سعيد بن المسيب من عمر، وأن الحديث صحيح في البخاري ومسلم من رواية الزهري. {cite:muwatta-maruf-1997 p.385} {cite:muwatta-maruf-1997 p.386}"
