label: { ar: "الموطأ 2383 — سعيد بن المسيب: خطبة عمر في آية الرجم وحد الزنا", en: "Muwatta 2383", es: "Muwatta 2383", fr: "Muwatta 2383", ur: "موطا 2383", tr: "El-Muvatta 2383 — Sa'id ibn el-Musayyab: Ömer'in taşlama ayeti ve zina cezası üzerine hutbesi", id: "Al-Muwatta 2383 — Sa’id ibn al-Musayyab: Khutbah Umar tentang ayat rajam dan hukuman perzinahan" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه سمعه يقول: لما صدر عمر بن الخطاب من منى، أناخ بالأبطح، ثم دعا ربه أن يقبضه غير مضيع ولا مفرط، ثم قدم المدينة فخطب الناس: قد سُنت لكم السنن وفُرضت لكم الفرائض وتركتم على الواضحة، وحذّر من أن يقول قائل: لا نجد حدين في كتاب الله، فقد رجم النبي ورجمنا. وقال: لولا أن يقول الناس زاد عمر في كتاب الله لكتبت آية الرجم في المصحف، فإنا قرأناها. ويذكر المحقق قول ابن عبد البر في سماع سعيد بن المسيب من عمر، وأن الحديث صحيح في البخاري ومسلم من رواية الزهري. {cite:muwatta-maruf-1997 p.385} {cite:muwatta-maruf-1997 p.386}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet ettiğine göre, Ömer ibn al-Khattab'ın şöyle dediğini işitmiştir: Ömer ibn al-Khattab Mina'dan ayrıldığında al-Abtah'ta durmuş, sonra Rabbine, ihmalkarlık veya kusur olmaksızın canını alması için dua etmiştir. Sonra Medine'ye varmış ve insanlara şöyle seslenmiştir: \"Sünnet sizin için sabittir, farz sizin için farz kılınmıştır ve siz temiz yolda bırakılmışsınızdır.\" Kimsenin, \"Biz Allah'ın Kitabında iki ceza bulmuyoruz, çünkü Peygamber taşladı, biz de taşladık\" demesinden sakınmasını söylemiştir. \"Eğer insanlar Ömer'in Allah'ın Kitabına ekleme yaptığını söylemeselerdi, taşlama ayetini Kur'an'a yazardım, çünkü biz onu okuduk\" demiştir. Araştırmacı, İbn Abd el-Berr'in, Sa'id ibn el-Müseyyeb'in Ömer'den işittiğine dair beyanını ve hadisin Buhari ve Müslim'de ez-Zuhri'nin rivayet ettiği sahih olduğunu zikretmektedir. {cite:muwatta-maruf-1997 s.385} {cite:muwatta-maruf-1997 s.386}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa ia mendengar beliau berkata: Ketika Umar ibn al-Khattab berangkat dari Mina, beliau berhenti di al-Abtah, kemudian berdoa kepada Tuhannya agar mengambil nyawanya tanpa ia lalai atau lalai. Kemudian beliau tiba di Madinah dan berpidato kepada orang-orang: \"Sunnah telah ditegakkan untuk kalian, kewajiban telah ditetapkan untuk kalian, dan kalian telah ditinggalkan di jalan yang jelas.\" Beliau memperingatkan agar tidak ada yang mengatakan, \"Kami tidak menemukan dua hukuman dalam Kitab Allah, karena Nabi melempar batu, dan kami pun melempar batu.\" Beliau berkata, \"Seandainya bukan karena orang-orang mengatakan bahwa Umar menambahkan sesuatu ke dalam Kitab Allah, niscaya aku akan menuliskan ayat tentang rajam dalam Al-Quran, karena kami telah membacanya.\" Peneliti menyebutkan pernyataan Ibnu Abd al-Barr mengenai Sa’id ibn al-Musayyab mendengar dari Umar, dan hadits tersebut shahih dalam Bukhari dan Muslim yang diriwayatkan oleh al-Zuhri. {kutip:muwatta-maruf-1997 hal.385} {kutip:muwatta-maruf-1997 hal.386}"
