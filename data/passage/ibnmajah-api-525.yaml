label: { ar: "سنن ابن ماجه 525 — الأب والأبوة", en: "Sunan Ibn Majah 525 — the father and fatherhood", ur: "سنن ابن ماجہ 525 — باپ اور والدیت", es: "Sunan Ibn Majah 525 — El padre y la paternidad", fr: "Sunan Ibn Majah 525 — Le père et la paternité", tr: "Sunan İbn Majah 525 — Baba ve Babalık", id: "Sunan Ibn Majah 525 — Ayah dan Peran Ayah" }
text: "… إِبْرَاهِيمَ، قَالاَ حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، أَنْبَأَنَا أَبِي، عَنْ قَتَادَةَ، عَنْ أَبِي حَرْبِ بْنِ أَبِي الأَسْوَدِ الدِّيلِيِّ، عَنْ أَبِيهِ، عَنْ عَلِيٍّ، أَنَّ النَّبِيَّ ـ قَالَ فِي بَوْلِ الرَّضِيعِ \" يُنْضَحُ بَوْلُ الْغُلاَمِ وَيُغْسَلُ بَوْلُ الْجَارِيَةِ \". قَالَ أَبُو الْحَسَنِ بْنُ سَلَمَةَ حَدَّثَنَا أَحْمَدُ بْنُ مُوسَى بْنِ مَعْقِلٍ، حَدَّثَنَا أَبُو الْيَمَانِ الْمِصْرِيُّ، قَالَ سَأَلْتُ الشَّافِعِيَّ عَنْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 525، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 525 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 525، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 525 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 525 (Le Livre de la Purification et sa Sunna), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 525 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 525, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
