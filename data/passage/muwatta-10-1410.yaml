label: { ar: "الموطأ 1410 — أبو مرة مولى عقيل: سأل أبا هريرة عن شاة ذبحت فتحرك بعضها فأمره أن يأكلها، ثم سأل زيد بن ثابت فقال إن الميتة لتتحرك", en: "Muwatta 1410", es: "Muwatta 1410", fr: "Muwatta 1410", ur: "موطا 1410", tr: "El-Muvatta 1410 — Akil'in azatlı kölesi Ebu Murra: Ebu Hurayra'ya kesilmiş bir koyun hakkında sordu; koyunun bir kısmı hareket etmişti ve Ebu Hurayra ona koyunu yemesini emretti. Sonra Zeyd ibn Sabit'e sordu, o da: \"Ölü hayvan hareket eder.\" dedi.", id: "Al-Muwatta 1410 — Abu Murrah, budak yang dibebaskan oleh Aqil: Dia bertanya kepada Abu Hurayrah tentang seekor domba yang telah disembelih dan sebagian tubuhnya bergerak, lalu Abu Hurayrah menyuruhnya untuk memakannya. Kemudian dia bertanya kepada Zayd ibn Thabit, yang berkata: “Hewan yang mati memang bisa bergerak.”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي مرة مولى عقيل بن أبي طالب أنه سأل أبا هريرة عن شاة ذبحت فتحرك بعضها، فأمره أن يأكلها. ثم سأل زيد بن ثابت، فقال إن الميتة لتتحرك، ونهاه عن ذلك. {cite:muwatta-maruf-1997 p.632}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Akil ibn Abi Talib'in azatlı kölesi Ebu Murra'dan rivayet ettiğine göre, Ebu Hurayra'ya kesilmiş bir koyunun bir kısmının hareket ettiğini sormuş ve Ebu Hurayra ona koyunu yemesini emretmiş. Sonra Zeyd ibn Sabit'e sormuş, o da ölü bir hayvanın hareket ettiğini söylemiş ve Malik ona koyunu yemesini yasaklamış. {cite:muwatta-maruf-1997 s.632}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Abu Murrah, budak yang dibebaskan oleh Aqil ibn Abi Talib, bahwa ia bertanya kepada Abu Hurayrah tentang seekor domba yang telah disembelih dan sebagian darinya bergerak, dan Abu Hurayrah menyuruhnya untuk memakannya. Kemudian ia bertanya kepada Zayd ibn Thabit, yang mengatakan bahwa hewan yang mati dapat bergerak, dan ia melarangnya untuk melakukannya. {cite:muwatta-maruf-1997 p.632}"
