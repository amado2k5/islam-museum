label: { ar: "الموطأ 1410 — أبو مرة مولى عقيل: سأل أبا هريرة عن شاة ذبحت فتحرك بعضها فأمره أن يأكلها، ثم سأل زيد بن ثابت فقال إن الميتة لتتحرك", en: "Muwatta 1410" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن أبي مرة مولى عقيل بن أبي طالب أنه سأل أبا هريرة عن شاة ذبحت فتحرك بعضها، فأمره أن يأكلها. ثم سأل زيد بن ثابت، فقال إن الميتة لتتحرك، ونهاه عن ذلك. {cite:muwatta-maruf-1997 p.632}"
