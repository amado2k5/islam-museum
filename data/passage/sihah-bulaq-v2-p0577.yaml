text: |-
  تأفيفا اذا قال أف قال تغالى فلا تقل لهما أفة وفيف ست لغات حكاها الاخفش أف أف
  أف أف أفاأف ويقال أفاوتفا وهوا تباع له وقولهم كان ذالعلى اف ذالأوافانه
  بكسرهما أى حينه وأوانه وجاء على تتفسة ذاك مثال تعفة ذا وهو تفعلة ⁦(أكف)⁩
  اكاف المارووكافه والجمع أكف وقدا كفت الحمارواوكفته أى شددت عليه الاكاف
  ( لغ الالف عدد وهومة كريقال هذا ألف واحدولا يقال واحدة وهذا ألف أقرع
  أى ثامّ ولا يقال قرعاه وقال ابن السكيت لوقلت هذه ألف بمعنى هذه الدراهم ألف لجاز
  والجمع ألوف وآلاف وألفه يألفه بالكسر أعطاء ألفا قال الشاعر
  وكريمة من آل قيس ألفته • حتى تبذخ فارتق الاعلام
  أى ربّكريمة والها للمبالغة أى فارتق الى الاعلام فحذف الى وهويريده والفت القوم
  ايلافا أى كلتهم ألفاوالفوهم أيضابأ نفسهم وكذلك الفت الدارهم والفت هى
  والالف الاليف بقال حنت الالف الى الالف وجم-ع الاليف ألاتف مث-ل تديع وتبائع
  وأفيل وأفائل قال ذوالرمّة
  فأصبح البكرفردا من ألاتفه * يرتاد أحلية أعجازها شذب
  والألاف جمع آلف مثل كافر وكفار وذلان قد ألف هذا الموضع بالمكسر بالفه الفا
  وآلفه ايا هغيره ويقال أيضا آلفت الموضع أولفه ايلافاوكذلك آلفت الموضع أوالفه مؤالفة
  والافا فصارصورة أفعل وفاعل فى الماضى واحدا وألقت بين الشيئين تأليفا فتألفا وأتلفا
  ويقال أيضا ألف مؤلفة أى مكملة وتألفته على الاسلام ومنه المؤلفة قلوبهم وقوله تعالى
  لا يلاف قربسْ ايلافهسم يقول تعالى أهدكت أصحاب الفيل لاواف قريشامكة ولتؤلف
  قريسر -لة الشتاء والصيف أى تجمع بينهما اذافرغوا من ذه أخذوا فى ذه وهذا كما تقول
  ضربته لكذ الكذا بهذف الواو (أنف الانف للانسان وغيره والجمع آنف وأنوف
  واناف وأنف كل شى أوله وأنف الباب طرفه حين يطلع وأنف الجبل نادر يشخص منه
  وأنف البرد أسته عن يعقوب ويقال جاء يعدوأنف الشدّأى أشد العدو قال والانافى
  العظيم الانف والانوف المرأة الطيبة ريح الانف وأنفت الرجل ضريت أنفه ويقال آنفه
  الماءباغ أنفه وذلك اذانزل فى النهر وروضة أنى بالضم أى لم يرعها أحد قال وأنفت
  الابل اذا وطئت كلاً أنفا وهو الذى لم يرع وآنفتها أناذمى.ؤنفة اذا تتبعت بها أنف المرعى
  قال وقال الطائى" أرض أنيفة الذبت اذا أسرعت النبات وتلكْ أرض آلف بلاد اللّه وكأس
  أنف لم يشرب بهما قبل ذلك كانه استونف شر بها مثال روضة أنف وية ال أيضا آتيك من ذى
  أنف كما يقال من ذى قبل أى فيما يستقبل وأنف من الشي يأنف أنفا وأنفة أى استئكف
  يقال مارأيت أحى أنفاولا آنى من فلان وأنف البعير أى اشتسكى أنفه من البرة فهو أنف
  مثل تعب فهو تعب عن ابن السكيت وفى الحديث المؤمن كالجمل الأنف ان قيدانقاد وان
  استنيج على صخرة استناخ وذلك للوجع الذى به فهوذلول منقاد وقال أبو عبيد كان الاصل
  فى هذا أن يقال مأنوف لانه مفعول به كما قالوا مصدور للذى يشتكى صدره ومبطون وجيمع
  ما فى الجد على هذا وا.كن هذا الحرف باءشاذا عنهم وتقول آنفته أنا اينافا اذا جعلته
  ينتكى
