label: { ar: "الموطأ 623 — عائشة: رأيت ثلاثة أقمار سقطن في حجرتي؛ أبو بكر: هذا أحد أقمارك وهو خيرها", en: "Muwatta 623" }
text: "هذا أحد أقمارك، وهو خيرها"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد، أن عائشة قالت: رأيت ثلاثة أقمار سقطن في حجرتي، فقصصت رؤياي على أبي بكر الصديق. فلما توفي النبي ودُفن في بيتها قال لها أبو بكر: هذا أحد أقمارك وهو خيرها. ويذكر المحقق أن في رواية «في حجري»، وأنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 24/47) أنه منقطع هكذا عند يحيى والقعنبي وابن وهب وأكثر الرواة، وأن قتيبة بن سعيد رواه عن مالك عن يحيى بن سعيد عن سعيد بن المسيب عن عائشة موصولاً كما عند أبي داود، ويضيف المحقق أن معن بن عيسى وسويداً تابعا قتيبة، فتبين أن مالكاً رواه على الوجهين، وأن الموصول جاء عن غير مالك من رواية يزيد بن هارون وابن عيينة ويحيى بن أيوب وأنس بن عياض عن يحيى بن سعيد عند ابن سعد والحاكم (1/60) والبيهقي في الدلائل والطبراني، فيثبت الموصول. {cite:muwatta-maruf-1997 p.317} {cite:muwatta-maruf-1997 p.318}"
