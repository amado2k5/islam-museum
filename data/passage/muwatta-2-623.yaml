label: { ar: "الموطأ 623 — عائشة: رأيت ثلاثة أقمار سقطن في حجرتي؛ أبو بكر: هذا أحد أقمارك وهو خيرها", en: "Muwatta 623", ur: "موطأ 623 — عائشہ کا تین چاندوں کا خواب", es: "Muwatta 623", fr: "Muwatta 623", tr: "Muvatta Suresi 623 — Aişe: Odama üç hilal düştüğünü gördüm; Ebu Bekir: Bu senin hilallerinden biri ve bunların en hayırlısıdır.", id: "Al-Muwatta 623 — Aisyah: Aku melihat tiga bulan jatuh ke kamarku; Abu Bakar: Ini adalah salah satu bulanmu dan ini adalah bulan yang terbaik di antara semuanya" }
text: "هذا أحد أقمارك، وهو خيرها"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد، أن عائشة قالت: رأيت ثلاثة أقمار سقطن في حجرتي، فقصصت رؤياي على أبي بكر الصديق. فلما توفي النبي ودُفن في بيتها قال لها أبو بكر: هذا أحد أقمارك وهو خيرها. ويذكر المحقق أن في رواية «في حجري»، وأنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر ⁦(التمهيد 24/47)⁩ أنه منقطع هكذا عند يحيى والقعنبي وابن وهب وأكثر الرواة، وأن قتيبة بن سعيد رواه عن مالك عن يحيى بن سعيد عن سعيد بن المسيب عن عائشة موصولاً كما عند أبي داود، ويضيف المحقق أن معن بن عيسى وسويداً تابعا قتيبة، فتبين أن مالكاً رواه على الوجهين، وأن الموصول جاء عن غير مالك من رواية يزيد بن هارون وابن عيينة ويحيى بن أيوب وأنس بن عياض عن يحيى بن سعيد عند ابن سعد والحاكم (1/60) والبيهقي في الدلائل والطبراني، فيثبت الموصول. {cite:muwatta-maruf-1997 p.317} {cite:muwatta-maruf-1997 p.318}"
  ur: "موطأ میں حدیث، نمبر 623: عائشہ نے خواب دیکھا کہ تین چاند اس کے کمرے میں گرے، تو اس نے ابو بکر کو سنایا جس نے کہا: «یہ تمہارے چاندوں میں سے ایک ہے اور وہی سب سے اچھا ہے»۔"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Aişe'nin şöyle dediğini aktarmıştır: \"Odamda üç hilal düştüğünü gördüm, bu yüzden rüyamı Ebu Bekir es-Siddik'e anlattım. Peygamber vefat edip onun evine defnedildiğinde, Ebu Bekir ona şöyle dedi: Bu senin hilallerinden biri ve bunların en hayırlısıdır.\" Araştırmacı, \"kucağımda\" rivayetinin Malik'ten Ebu Mus'ab ve Suveyd tarafından nakledildiğini belirtiyor. İbn Abdül-Barr'ın (el-Temhid 24/47) bunun Yahya, el-Ka'nebi, İbn Vahb ve çoğu ravi tarafından rivayet edildiği gibi bağlantısız olduğunu söylediğini aktarıyor. Ayrıca, Kuteybe ibn Sa'id'in bunu Malik'ten, Yahya ibn Sa'id'den, Sa'id ibn el-Musayyab'dan, Aişe'den, Ebu Davud'da bulunan bağlantılı bir isnad zinciriyle naklettiğini ekliyor. Araştırmacı ayrıca Ma'n ibn 'Isa ve Süveyd'in Kuteybe'yi takip ettiğini belirterek Malik'in bunu her iki şekilde de rivayet ettiğini açıklığa kavuşturuyor. Bağlantılı rivayet zinciri, Malik'in yanı sıra Yezid ibn Harun, İbn 'Uyeynah, Yahya ibn Eyyub ve Enes ibn 'İyad dahil olmak üzere Yahya ibn Sa'id'den başkaları tarafından rivayet edilmiş olup, İbn Sa'd, el-Hakim (1/60), el-Beyhaki el-Dala'il'de ve el-Taberani tarafından nakledilmiştir ve böylece bağlantılı zincir oluşturulmuştur. {cite:muwatta-maruf-1997 s.317} {cite:muwatta-maruf-1997 s.318}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa Aisyah berkata: Aku melihat tiga bulan jatuh ke kamarku, lalu aku menceritakan mimpiku kepada Abu Bakar al-Siddiq. Ketika Nabi wafat dan dimakamkan di rumahnya, Abu Bakar berkata kepadanya: Ini adalah salah satu bulanmu, dan ini adalah yang terbaik di antara semuanya. Peneliti menyebutkan bahwa dalam riwayat \"di pangkuanku,\" riwayat ini diwariskan dari Malik oleh Abu Mus'ab dan Suwaid. Ia mengutip Ibnu 'Abd al-Barr (al-Tamhid 24/47) yang mengatakan bahwa riwayat ini terputus, sebagaimana diwariskan oleh Yahya, al-Qa'nabi, Ibnu Wahb, dan sebagian besar perawi. Ia menambahkan bahwa Qutaybah ibn Sa'id meriwayatkannya dari Malik, dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, dari Aisyah, dengan sanad yang terhubung, sebagaimana ditemukan dalam Abu Dawud. Lebih lanjut peneliti menyatakan bahwa Ma'n ibn 'Isa dan Suwaid mengikuti Qutaybah, sehingga memperjelas bahwa Malik meriwayatkan keduanya. Mata rantai silaturahmi tersebut diriwayatkan oleh orang lain selain Malik, antara lain Yazid ibn Harun, Ibnu ‘Uyaynah, Yahya ibn Ayyub, dan Anas ibn ‘Iyad, dari Yahya ibn Sa’id, sebagaimana dicatat oleh Ibnu Sa’d, al-Hakim (1/60), al-Bayhaqi dalam al-Dala’il, dan al-Tabarani, sehingga terjalinlah rantai sambung tersebut. {kutip:muwatta-maruf-1997 hal.317} {kutip:muwatta-maruf-1997 hal.318}"
