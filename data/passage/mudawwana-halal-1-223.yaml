label: { ar: "المدونة الكبرى، المجلد المصوَّر 1، ص 223 — الرعي والاحتشاش في حرم مكة والمدينة", en: "al-Mudawwana al-Kubra, scan volume 1, p. 223 — grazing and cutting grass in the sanctuaries of Makka and Madina", ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 223 — حرمِ مکہ و مدینہ میں چرانا اور گھاس کاٹنا", es: "al-Mudawwana al-Kubra, volumen escaneado 1, pág. 223 — pastoreo y corte de hierba en los santuarios de La Meca y Medina", fr: "al-Mudawwana al-Kubra, scan volume 1, p. 223 — pâturage et coupe d'herbe dans les sanctuaires de La Mecque et Médine" }
text: "… والسلق وما أشبه ذلك قال وقال مالك ولا بأس بالسنا والاذخر أن يقطع فى الحرم قال مالك ولا بأس بالرعى في حرم مكة وحرم المدينة في الحشيش والشجر قال وقال مالك أكره للحلال والحرام ان يحتشاء فى الحرم"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 223، ينقل عن مالك أنه لا بأس بالرعي في حرم مكة وحرم المدينة، وأنه يكره لمن ليس في إحرام ولمن هو في إحرام أن يحتش في الحرم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام تحت حرمة مكة والمدينة."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 223, reporting from Malik that grazing in the sanctuaries of Makka and Madina is not objected to, and that he disliked cutting grass in the sanctuary for a person out of ihram and for one in it; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it under the sanctuaries of Makka and Madina."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 223 کا اقتباس، جس میں مالک سے منقول ہے کہ حرمِ مکہ اور حرمِ مدینہ میں جانور چرانے میں حرج نہیں، اور یہ کہ وہ احرام کے بغیر اور احرام والے دونوں کے لیے حرم میں گھاس کاٹنا ناپسند کرتے تھے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے مکہ اور مدینہ کی حرمت کے تحت درج کرتا ہے۔"
  es: "Un extracto de al-Mudawwana al-Kubra, volumen 1, pág. 223, informa que Malik afirma que no hay objeciones al pastoreo en los santuarios de La Meca y Medina, y que le desagradaba cortar la hierba en el santuario tanto para una persona fuera de ihram como para una que estuviera en él; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye entre los santuarios de La Meca y Medina."
  fr: "Extrait d'al-Mudawwana al-Kubra, volume 1, p. 223, rapportant de Malik que le pâturage dans les sanctuaires de La Mecque et de Médine n'est pas contesté, et qu'il désapprouvait la coupe de l'herbe dans le sanctuaire, que ce soit pour une personne en état d'ihram ou non; extrait de la numérisation, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Le Halal and Haram Browser répertorie cet extrait dans la section consacrée aux sanctuaires de La Mecque et de Médine."
