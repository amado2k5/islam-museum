label: { ar: "المدونة الكبرى، المجلد المصوَّر 1، ص 223 — الرعي والاحتشاش في حرم مكة والمدينة", en: "al-Mudawwana al-Kubra, scan volume 1, p. 223 — grazing and cutting grass in the sanctuaries of Makka and Madina", ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 223 — حرمِ مکہ و مدینہ میں چرانا اور گھاس کاٹنا" }
text: "… والسلق وما أشبه ذلك قال وقال مالك ولا بأس بالسنا والاذخر أن يقطع فى الحرم قال مالك ولا بأس بالرعى في حرم مكة وحرم المدينة في الحشيش والشجر قال وقال مالك أكره للحلال والحرام ان يحتشاء فى الحرم"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 223، ينقل عن مالك أنه لا بأس بالرعي في حرم مكة وحرم المدينة، وأنه يكره لمن ليس في إحرام ولمن هو في إحرام أن يحتش في الحرم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام تحت حرمة مكة والمدينة."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 223, reporting from Malik that grazing in the sanctuaries of Makka and Madina is not objected to, and that he disliked cutting grass in the sanctuary for a person out of ihram and for one in it; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it under the sanctuaries of Makka and Madina."
  ur: "المدونۃ الکبریٰ، اسکین جلد 1، ص 223 کا اقتباس، جس میں مالک سے منقول ہے کہ حرمِ مکہ اور حرمِ مدینہ میں جانور چرانے میں حرج نہیں، اور یہ کہ وہ احرام کے بغیر اور احرام والے دونوں کے لیے حرم میں گھاس کاٹنا ناپسند کرتے تھے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے مکہ اور مدینہ کی حرمت کے تحت درج کرتا ہے۔"
