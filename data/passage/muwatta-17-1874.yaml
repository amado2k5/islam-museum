label: { ar: "الموطأ 1874 — مالك: إنما نهى سعيد وسليمان وأبو بكر وابن شهاب أن يبيع الرجل حنطة بذهب ثم يشتري بالذهب تمرا قبل قبض الذهب من بيعه، أما شراؤه بالذهب تمرا من غير بائعه فلا بأس به، وقد سأل مالك غير واحد من أهل العلم فلم يروا به بأسا", en: "Muwatta 1874", es: "Muwatta 1874", fr: "Muwatta 1874", ur: "موطا 1874", tr: "El-Muvatta 1874 — Malik: Sa'id, Süleyman, Ebu Bekir ve İbn Şihab, bir kişinin buğdayı altın karşılığında satıp, altınla hurma almasını ve altını tekrar eline geçirmesini yasaklamışlardır. Ancak, hurmayı asıl satıcıdan değil de başka birinden altınla almak caizdir. Malik bu konuda birkaç âlime danışmış ve onlar da bunda bir sakınca görmemişlerdir.", id: "Al-Muwatta 1874 — Malik: Sa’id, Sulayman, Abu Bakr, dan Ibn Shihab hanya melarang seseorang menjual gandum dengan emas dan kemudian menggunakan emas tersebut untuk membeli kurma sebelum menerima emas dari penjualan tersebut. Namun, membeli kurma dengan emas dari orang selain penjual aslinya diperbolehkan. Malik bertanya kepada beberapa ulama tentang hal ini, dan mereka tidak melihat adanya bahaya di dalamnya." }
summary:
  ar: "قال مالك: وإنما نهى سعيد بن المسيب، وسليمان بن يسار، وأبو بكر بن محمد بن عمرو بن حزم، وابن شهاب، أن لا يبيع الرجل حنطة بذهب، ثم يشتري الرجل بالذهب تمرا قبل أن يقبض الذهب من بيعه الذي اشترى منه الحنطة. فأما أن يشتري بالذهب التي باع بها الحنطة إلى أجل تمرا من غير بائعه، قبل أن يقبض الذهب، ويحيل الذي اشترى منه التمر على غريمه الذي باع منه الحنطة بالذهب التي له عليه في ثمن التمر، فلا بأس بذلك. قال مالك: وقد سألت عن ذلك غير واحد من أهل العلم فلم يروا به بأسا. {cite:muwatta-maruf-1997 p.170} {cite:muwatta-maruf-1997 p.171}"
  tr: "Malik şöyle dedi: Sa'id ibn al-Musayyab, Sulayman ibn Yasar, Abu Bakr ibn Muhammad ibn 'Amr ibn Hazm ve İbn Şihab, bir kimsenin buğdayı altın karşılığında satıp, o altınla hurma almasını, altını almadan önce yapmasını yasaklamışlardır. Ancak, eğer kişi buğdayı kredili olarak sattığı altınla başka bir satıcıdan hurma alırsa ve daha sonra hurmanın bedelini alacaklısına bildirirse, bunda bir sakınca yoktur. Malik şöyle dedi: Bu konuda birkaç âlime danıştım ve onlar da bunda bir sakınca görmediler."
  id: "Malik berkata: Sa'id ibn al-Musayyab, Sulayman ibn Yasar, Abu Bakr ibn Muhammad ibn 'Amr ibn Hazm, dan Ibn Shihab melarang seseorang menjual gandum dengan emas, lalu menggunakan emas tersebut untuk membeli kurma sebelum menerima emas dari penjualan yang sama di mana ia membeli gandum. Namun, jika ia menggunakan emas hasil penjualan gandum secara kredit untuk membeli kurma dari penjual lain sebelum menerima emas, dan kemudian merujuk penjual kurma tersebut kepada krediturnya yang berutang emas kepadanya untuk harga kurma, maka tidak ada salahnya. Malik berkata: Saya bertanya kepada beberapa ulama tentang hal ini, dan mereka tidak melihat adanya bahaya di dalamnya."
