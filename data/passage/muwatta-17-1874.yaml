label: { ar: "الموطأ 1874 — مالك: إنما نهى سعيد وسليمان وأبو بكر وابن شهاب أن يبيع الرجل حنطة بذهب ثم يشتري بالذهب تمرا قبل قبض الذهب من بيعه، أما شراؤه بالذهب تمرا من غير بائعه فلا بأس به، وقد سأل مالك غير واحد من أهل العلم فلم يروا به بأسا", en: "Muwatta 1874" }
summary:
  ar: "قال مالك: وإنما نهى سعيد بن المسيب، وسليمان بن يسار، وأبو بكر بن محمد بن عمرو بن حزم، وابن شهاب، أن لا يبيع الرجل حنطة بذهب، ثم يشتري الرجل بالذهب تمرا قبل أن يقبض الذهب من بيعه الذي اشترى منه الحنطة. فأما أن يشتري بالذهب التي باع بها الحنطة إلى أجل تمرا من غير بائعه، قبل أن يقبض الذهب، ويحيل الذي اشترى منه التمر على غريمه الذي باع منه الحنطة بالذهب التي له عليه في ثمن التمر، فلا بأس بذلك. قال مالك: وقد سألت عن ذلك غير واحد من أهل العلم فلم يروا به بأسا. {cite:muwatta-maruf-1997 p.170} {cite:muwatta-maruf-1997 p.171}"
