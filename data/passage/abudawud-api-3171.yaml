label: { ar: "سنن أبي داود 3171 — الأب والأبوة", en: "Sunan Abi Dawud 3171 — the father and fatherhood", ur: "سنن ابی داؤد 3171 — باپ اور والدیت", es: "Sunan Abi Dawud 3171 — El padre y la paternidad", fr: "Sunan Abi Dawud 3171 — le père et la paternité" }
text: "… عَبْدِ اللَّهِ، حَدَّثَنَا عَبْدُ الصَّمَدِ، ح وَحَدَّثَنَا ابْنُ الْمُثَنَّى، حَدَّثَنَا أَبُو دَاوُدَ، قَالاَ حَدَّثَنَا حَرْبٌ، - يَعْنِي ابْنَ شَدَّادٍ - حَدَّثَنَا يَحْيَى، حَدَّثَنِي بَابُ بْنُ عُمَيْرٍ، حَدَّثَنِي رَجُلٌ، مِنْ أَهْلِ الْمَدِينَةِ عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" لاَ تُتْبَعُ الْجَنَازَةُ بِصَوْتٍ وَلاَ نَارٍ \". زَادَ هَارُونُ \" وَلاَ يُمْشَى بَيْنَ يَدَيْهَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3171، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3171 (Funerals (Kitab Al-Jana'iz)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3171، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3171 (Funerales (Kitab Al-Jana'iz)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3171 (Les Funérailles), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
