text: |-
  ⁦(صدر)⁩
  ٣٤٥
  فعب الحوض خاصة حكاه أبو عبيد وأنشد
  مابين صنبورالى الازاء والصنبور
  صبة تكون فى الاداوة من حديد أورصاص يشرب منها والصنوبر شحروه قال تره وصنار
  الشقاءشقة يردم وكذلك الصغبر يتشديد الفون وكسر الباء قال طرفة
  بجفان تعترى مجلنا * وسديف جبزهاج الصنير
  والصنير بتسكين الباءيوم من أيام العجوذ ويحتمل أن يك ونابعنى وانماحركت الباء
  للضرورة( صحر الصراء البرّية وهى غسير مصروفة وان لم تكن صفة وائمالم تصرف
  للتأنيث ولزوم حرف التأنيت له وكذلك لقول فى بشرى تقول صحراء واسعة ولا تقل صحراة
  فتدخل تأنينا على تأنيث والهمع السحارى والصراوات وكذلك جمع كل فعلاء اذ الم تكر
  مؤنت أفعل مثل عذراء وخبرا. وورقاء اسم رجل وأصل الصحارى صحارى بالتشديد وقدجاء
  ذلك فى الشعرلانك اذا يجعت صحراء أدخلت بين الحاء والراء لفاوكسرت الراء كمايكر
  ما بعد ألف الجمع فى كل موضع نحومساجدوبعافر قتبقلب الالف الاولى التيبعداراماء
  للكسرة التى قبلها وتنقلب الالف الشانية التى للتأنيث أيضايا فتدغم ثم حذفوا الياء الاولى
  وأبدلوا من الثائية الفافقالواصارى بفتح الراءلتسلم الااف من الحذف عند التنوين
  وانمافعا واذلك ليفر قوابين الياء المنقلية من الالف للتأنيت ويين الياء المنقلبة من الالف
  التى ليست للتأنيث نحو ألف هرمى اذ قالوامرامى ومغازى وبعض العرب لا يحذف الياء
  الاولى ولسكن يحدف الشانية فيقول الصارى بكسرالراء وهذه مصاركما تقول جوار وأصحر
  الرجل أى خرج الى الحراء والحرة بالضم حوبة تنجاب وسط الحسرّة والهع صحر قال
  أبوذؤيب يصف من مار!
  سي من يراعته نفاه * أتى متم صرولوب
  قوله سبىّ أي غر يب واليراءة ههنا الاجمة والعرة لون إلا صحر وهو الذى فى رأسه شقرة
  وحار أصجر فيه حرة واتار صحراء واصحار النبت اصعيراراأى هاج ويقال اتيته صرة
  حجرة وهى غير مجراة اذارأيه وليس بينك وبينه ساتر والمصاحر الذى يقائل قرنه في الصراء
  ولا يجاتله والصحيرة اللين يلقى فيه الرضف حتى يغلى ثم يصب عليه السهن فيشرب ور بماذرة
  عليه الدقيق فيتجسى تقول منه صحرت اللبن أصحره صحرا وقال أبو الغوث هى الصديرة من
  الصحر كالفهيرة من الفهروصحار بالضم قصبة عمان مما يلى الجبل وتؤام قصبتها عما بلى
  الساحل وصهاراسم رجل من عبد القيس وقواهم فى المثل مالى ذنب الاذذب صحروهو
  اسم أمرأة عوقبت على الاحسان وهى أخت اتسمان بن عاد ⁦(صخر)⁩ الصر الحجارة
  العظام وهى الصخور يقال صخر وصخر بالتحسر يك عن يعوب الواحسدة صخرة وصخرة
  وصخرين عمروبن الشريد أخوخنساء والصاخرة اناء من خزف ⁦(صدر)⁩ الصدرواحد
  الصدور وهومذ كرواعما قال الاعشى
  ويشرق بالقول الذى قد أذعته * كاشرقت صدر القناة من الدم
  فأشه على المعى لان صدر القناة من القناة وهذا كة ولهم ذهبت بعض أصابعه لانهم
  يؤتثون الاسم المضاف الى المؤنت وصدركل شئ أوّله وصدر السه-م ماجاز من وسطه الى
  مستدقه وسمى يذلك لاه المتقدم اذارمى والصدر الطائفة من الشئ والصدرة من الانسان
  ٨٧
