text: |-
  * ⁦(ياب اللام)⁩
  ١٨٩
  أهمّ بنيه صيفهم وشتاؤهم • وقالواتعد واغزوسط الأراخل
  يقول أهمهم نفقة صيفهم وشناتهم وقالوالا بيهم تعدّ أى انصرف عنا ويقال للمرأة
  رحلة وقال
  عز قواجيب فتاتهم • لم يب الواحرمة الرجله
  ويقال كانت عائشة رضى اللّٰه عنها رجلة الرأى وتصغير الرجل رجيل ورويجل أيضا على غير
  فياس كأنُه تصغير راجسل والرجلة بالضم مصدر الرجل والراجل والارجل بقال رجل بين
  الرجلة والرجولة والرجولية وراجل جيد الرجلة وفرس أرجل بين الرجل والرجلة قال
  الاموىّ اذا ولدت الغنم بعضها بعد بعض قيل ولدتها الرجيلاءمثال الغميصاء قال أبوزيد
  يقال رجات بالكسررجلا أى بقيت راجلا والكسائى مثله والرجيل من الخيل الذى لا يحفى
  ورجل رجير أى قوى على المشى وحرّة رجلا أى مستوية كثيرة الحجارة يصعب المشى
  فيها قال ابن السكيت شعر رجل ورجل اذالم يكن شديد الجعودة ولاسبطا تقول منه رجل
  شعره ترجيسلا أبوعمر وارتجلت الرجل اذا أخذته برجله وارتجال الخطبة والشعرابتداؤه
  من غير تهيئة قبل ذلك وارتجل الفرس اذاخلط العقق يشئ من الهملجة فراوح بين شى من
  هذا وشئ من هذا وارتجل فلان أى جمع قطعة من الجراد ليشويها ومنه قول إبيد ١
  كدحان مر تجل يشب ضرامها * وترجل أى مشى راجلا ورجل فى البترأى نزل فيها من
  غير أن يدلى وترجل النهار أى ارتفع قال الشاعر
  وهاج به لما ترجلت الضحى * عصائب شتى من كلاب ونابل
  حل لرحل مسكن الرجل وما يستصحبه من الاثاث والرحل أيضارحل البعيروهو
  أصغر من القتب والجمع الرحال وثلاثة أرحل ومنهة ولهم فى التذف باابن ملقى ارحل الركان
  والرحال أيضا الطنافس الحيرية ومنه قول الشاعر ٢
  تشرت عليه برودها ورحالها* ومرط مرحل ازارخزفيه عسلم ورجلت البعيرأرحله وحلااذا
  شددت على ظهره الرحل قال الاعشى
  رحلت سمية غدوة أحمالها • غضى عليك فاتقول بدالها
  وقال المثقب العبدك
  اذا ماقت أرحلها بليل * تأوهآهة الرجل المزين
  ويقال رحلت له نفسى اذاصبرت على أذاه ورحل فلان وارتحل وترحل بمعنى والاسم الرحيل
  واستر حله أى سأله أن يرحل له أبوعمر والرحلة بالضم الوجه الذى تريده بقال أنتم رحلتى أى
  الذين ارتحل اليهم والرحلة بالكسر الارتحال يقال دنت رحلتنا وأرحلت الابل اذا
  مهنت بعد هزال فأطاقت الر-لة وراحات فلانا إذا عاونته على رحلته وأرحلته اذا أعطيته
  راحلة ورحلته بالتشديداذا أظعنته من.كانه وأرسلته ورجل مرحل أى له رواحل كنيرة
  كما يقال معرب اذاكان له خيل عراب عن أبى عبيد وناقة رحينلة أى شديدة قوية
  على السير وكذلك جمل رحيل عن أبى عمرو قال وانهالذات رحلة بالضم والراحلة
  الناقة التى تصلج لان ترحل وكذلك الرحول ويقال الراحلالمركب من الابل ذكرا كان
  أو أنى والارحل من الخبل الايض الظهر ومن الغنم الاسودالظهر قال أبوالغوث
  ٤٨.
  ١ ف نسخة أول البيته
  فتناز عاسبط ايطير ظلاله
  ٢ فى نسخة زيادة الاعشى
  مصاب عاديه
  أول البيت سان تجاره
