summary:
  ar: "قال يحيى: سمعت مالكا يقول في المكاتب يكاتبه سيده وله جارية بها حمل منه لم يعلم به هو ولا سيده يوم الكتابة: إن الولد لا يتبعه لأنه لم يدخل في الكتابة، وهو لسيده. أما الجارية فهي للمكاتب لأنها من ماله. {cite:muwatta-maruf-1997 p.345}"
