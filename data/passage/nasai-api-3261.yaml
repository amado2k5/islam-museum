label: { ar: "سنن النسائي 3261 — اليتيم وفقد الأب", en: "Sunan al-Nasa'i 3261 — the orphan and the father lost", ur: "سنن نسائی 3261 — یتیم اور باپ کی موت", es: "Sunan al-Nasa'i 3261 — El huérfano y el padre perdido", fr: "Sunan al-Nasa'i 3261 — L'orphelin et le père perdus", tr: "Sunan an-Nasa'i 3261 — Yetim ve Babanın Kaybı", id: "Sunan an-Nasa'i 3261 — Anak Yatim dan Kehilangan Ayah" }
text: "أَخْبَرَنَا مَحْمُودُ بْنُ غَيْلاَنَ، قَالَ حَدَّثَنَا أَبُو دَاوُدَ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ مَالِكِ بْنِ أَنَسٍ، قَالَ سَمِعْتُهُ مِنْهُ، بَعْدَ مَوْتِ نَافِعٍ بِسَنَةٍ وَلَهُ يَوْمَئِذٍ حَلْقَةٌ قَالَ أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ الْفَضْلِ عَنْ نَافِعِ بْنِ جُبَيْرٍ عَنِ ابْنِ عَبَّاسٍ أَنَّ النَّبِيَّ قَالَ \" الأَيِّمُ أَحَقُّ بِنَفْسِهَا مِنْ وَلِيِّهَا وَالْيَتِيمَةُ تُسْتَأْمَرُ وَإِذْنُهَا صُمَاتُهَا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3261، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3261 (The Book of Marriage), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3261، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3261 (El Libro del Matrimonio), menciona al huérfano y al padre ausente. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3261 (Le Livre du Mariage), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 3261 numaralı hadis, yetimlerden ve babasızlık durumundan bahsetmektedir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3261, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
