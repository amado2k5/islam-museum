text: "… من نسي القراءة القراءة خلف الإمام القراءة في الركوع والسجود قراءة السور في الركعة رفع الإمام صوته بالقراءة النائم والسكران والقراءة على الغناء النهار قراءة الليل القراءة في ركعتي الفجر القراءة في يوم الجمعة القراءة على المنبر قراءة المصحف في …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 6464، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 6464, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 6464 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Abd al-Razzaq, volumen 1, pág. 6464, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Musannaf d'Abd al-Razzaq, volume 1, page 6464, mentionnant les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Abdülrazzak'ın Musannaf adlı eserinin 1. cildinin 6464. sayfasından alınan bir alıntı, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Musannaf karya Abd al-Razzaq, Volume 1, halaman 6464, menyebutkan para qari, penyusunan Al-Qur'an, dan manuskrip; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
