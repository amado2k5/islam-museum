text: "… أخبرنا أحمد بن عثمان بن يحي الأدمى حدثنا سعيد ين عنمان الاهوازى حدثنا المحمد ابن عون - أبوعون - حدثنا حماد بن سلمة عن عاصم عن زر عن عبد اللّٰه. قال إقرأنى رسول اللّٰه سورة الاحتماف. سعيد بن عبدويه بن …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 102، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 1, p. 102, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 1، ص 102 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh Baghdad de al-Khatib al-Baghdadi, volumen 1, pág. 102, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh Bagdad d'al-Khatib al-Baghdadi (tome 1, p. 102) mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "El-Hatib el-Bağdadi'nin \"Bağdat Tarihi\" adlı eserinin 1. cildinin 102. sayfasından bir alıntı, Kur'an'ın farklı okunuşlarından bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikası gereği metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Sejarah Baghdad\" karya Al-Khatib Al-Baghdadi, Jilid 1, halaman 102, menyebutkan berbagai macam bacaan Al-Quran. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
