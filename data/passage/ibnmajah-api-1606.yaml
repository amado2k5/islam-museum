label: { ar: "سنن ابن ماجه 1606 — القراء", en: "Sunan Ibn Majah 1606 — the readers", ur: "سنن ابن ماجہ 1606 — قراء", es: "Sunan Ibn Majah 1606 - los lectores", fr: "Sunan Ibn Majah 1606 — les lecteurs", tr: "Sünen İbn Mace 1606 — Okuyucular", id: "Sunan Ibnu Majah 1606 — Pembaca" }
text: "… مُحَمَّدٍ، مَوْلَى عُمَرَ بْنِ الْخَطَّابِ عَنْ أَبِي عُبَيْدَةَ، عَنْ عَبْدِ اللَّهِ، قَالَ: قَالَ رَسُولُ اللَّهِ ـ \" مَنْ قَدَّمَ ثَلاَثَةً مِنَ الْوَلَدِ لَمْ يَبْلُغُوا الْحِنْثَ كَانُوا لَهُ حِصْنًا حَصِينًا مِنَ النَّارِ \". فَقَالَ أَبُو ذَرٍّ: قَدَّمْتُ اثْنَيْنِ. قَالَ: \" وَاثْنَيْنِ \". فَقَالَ أُبَىُّ بْنُ كَعْبٍ أَبُو الْمُنْذِرِ سَيِّدُ الْقُرَّاءِ: قَدَّمْتُ وَاحِدًا. قَالَ\" \" وَوَاحِدًا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1606، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Ibn Majah, no. 1606 (Chapters Regarding Funerals), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1606، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1606 (Capítulos sobre los funerales), menciona a los lectores. El explorador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Ibn Majah, n° 1606 (Chapitres relatifs aux funérailles), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "İbn Majah'ın Sünen'inde yer alan 1606 numaralı hadiste, Kur'an okuyucularından bahsedilir. Bu hadis, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1606, menyebutkan para pembaca Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, tulisan, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
