text: "… كنت لاحلل ماحرم اللّه أبدا. فإن قلت : فما معنى قول النبى ينبغى أن يستحلها وتحليل ما حرّمه اللّٰه تعالى غير ممكن ؟ فنقول : المراد به العفو عن المظلمة لا أن ينقلب الحرام حلالا، وما قاله ابن سيرين حسن …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 1، ص 158، يذكر الحلال، واستحلال الشيء، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
