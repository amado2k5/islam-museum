text: "… كنت لاحلل ماحرم اللّه أبدا. فإن قلت : فما معنى قول النبى ينبغى أن يستحلها وتحليل ما حرّمه اللّٰه تعالى غير ممكن ؟ فنقول : المراد به العفو عن المظلمة لا أن ينقلب الحرام حلالا، وما قاله ابن سيرين حسن …"
summary:
