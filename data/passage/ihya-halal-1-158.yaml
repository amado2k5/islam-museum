  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 1. cildinin 158. sayfasından bir alıntı, helal olan (izin verilen), bir şeyin caiz olup olmadığı, haram olan (yasaklanan) ve yasak olan (yasaklanan) şeyleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
