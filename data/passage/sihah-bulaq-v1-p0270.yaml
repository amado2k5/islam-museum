text: |-
  ⁦( عور)⁩
  ٣٧١
  أى ييغين لان كقوله تعالى يبغونها ءو جأويحي بن يعمر العدوانى لا ينصرف يعسمر لانهمثل
  يذهب قال الفراء العمران أبو بكروع ررضى اللّٰه عنهما قال وقال معاذ الهرّاء اقد قيل سيرة
  العمرين قبسل عمربن عبد العزيز لام-م قالو العثمان رضى اللّٰه عنه يوم الدار نسألك سير
  العمرين وزعم الاصحى عن أبى هلال الراسبعن قتادة أنه سئل عن عقق أمهات الاولاد
  قال أعمق العمران فانه-ما من الخلفاء آمهات الاولادقهى قول قتادة انه عمر بن انخطاب
  عمرين عبد العز بزلانه لم يكن بين أبى بكروع رخليفة والعبمران عمروين جابربن هلال بن
  عقيل بن سحمى بن مازن بن فزارة ويدوين عمروين جؤية بن لوذان بن تعلية بن عدى بن فزارة
  وهماروقافزارة قال قرادين حنش الصادرى
  اذا اجتمع العمران عمروبن جابر * ويدربن عمروخلت ذبيان تبعا
  وألة وامقاليد الامور اليهما • ججبعا قاء كارهين *طوّعا
  ابن الاعراي البعاميم الجداء وصغار الضأن واحدها يعمور قال أبو زيد الطانى
  ترى لاخلافها من خلفهانسلا * مثل الذميم على قرم البعامير
  أى يذسسل اللبن مننها كانه الذميم الذى يذمّ من الانف وعامرأ بوقبيلة وهوعامى بن صعصعة
  ابن معاوية بن بكربن هوازن وأم عامر كفية الضبع والصامران عامر بن مالك بن جعفر
  ابن كلاب بن ربيعة بن عامر بن صعصعة وهو أيوبرا،للسلاعب الاسنة وعامر بن الطفيل بن
  مالك بن جعفر بن كلاب وهو أبو على" ⁦(عنبر)⁩، العنبر ضرب من الطيب والعنبر أبوحىّ من
  تميم وهوالعنبر بن عمروبن تميم وبلعنبرهسم بنو العنبر حذفوا الذون لماذ كرناه فى باب الشاءفي
  الححرث ( عنتر العنتر الذباب الازرق وعنترة اسم رجسل وهو عنترة بن معاوية بن شدّاد
  العبسى قال سيبويه تون عنترليست بزائدة ⁦(عور)⁩. العورة سوءة الانسان وكل مايستيا
  منه والهع عورات وعورات بالتسكين وإنما يحرك الشانى من فعلة فى جمع الاسماء اذا لم يكن
  ياآووا واوقرآبعضهسم على عورات النساء بالهريك والعورة كل خلل يتخوّف منه فى ثغر
  أوحوب وعورات الحبال شقوقها وقول الشاعز
  تجاوب بومها فى عورتيها • اذا الحرباء أوفى للتنابى
  قال ابن الاعرابى أراد عورتى الشمس وهما مشرقها ومغر بها ورجل أعوربين العور والهع
  عوران وقولهم بدل أعور مثل يضرب للمذموم يخلف بعد الرجل التحم ودوقال عيد اللّٰه بن
  همام السلولى لقتيبة بن م-لم لماولى خراسان بعديزيد بن المهلب
  أقتيب قد قلنا غداة أنيتنا • بدل لعمرك من يزيد أعور
  وربمافالواخلف أعور قال أبوذويب
  فأصحت أمشى فى ديار كأنها * خلاف ديار الكاملمة عور
  كانه يمع خلفاعلى خلاف مثل جبل وجبال والاسم العورة وقد عارت العين تعار قال
  التاعر
  وسائلة بفاهر الغيب عنى * أعارت عينه أم لم نعارا
  أراد أم لم تعارن فوقف بالالف ويقال أيضاء ورت عينه وانماصجت الواوفيه المحتمها فى أصاها
  وهواعورت بسكون ماقبلها ثم حسذفت الزوائد الالف والتشديد فبقى عوريدل على
