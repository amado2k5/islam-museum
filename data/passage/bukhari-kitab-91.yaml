summary:
  ar: "القسم 91 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التعبير»، ويضم فيها النصوص من 6982 إلى 7047 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 91 of Sahih al-Bukhari (Interpretation of Dreams) in the division of the open hadith dataset the museum took its reports from: reports 6982 to 7047 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 91، عنوان «کتاب التعبیر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6982 تا 7047۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 91 de Sahih al-Bukhari (Interpretación de los sueños) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6982 al 7047, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 91 du Sahih al-Bukhari (Interprétation des rêves), soit les hadiths 6982 à 7047 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 91. bölümü \"Tefsir Kitabı\" başlığını taşımakta olup, 6982 ile 7047 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 91 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Tafsir\" dan berisi teks 6982 hingga 7047, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
