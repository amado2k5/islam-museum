label: { ar: "سنن ابن ماجه 954 — الأب والأبوة", en: "Sunan Ibn Majah 954 — the father and fatherhood", ur: "سنن ابن ماجہ 954 — باپ اور والدیت" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو خَالِدٍ الأَحْمَرُ، عَنِ ابْنِ عَجْلاَنَ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي سَعِيدٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" إِذَا صَلَّى أَحَدُكُمْ فَلْيُصَلِّ إِلَى سُتْرَةٍ. وَلْيَدْنُ مِنْهَا. وَلاَ يَدَعْ أَحَدًا يَمُرُّ بَيْنَ يَدَيْهِ. فَإِنْ جَاءَ أَحَدٌ يَمُرَّ فَلْيُقَاتِلْهُ. فَإِنَّهُ شَيْطَانٌ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 954، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 954 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 954، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
