text: "… فقبل له: كيف صبرت عن النساء ؟ قال : فاسيت شهوتهن عند إدراكى سنة ثم ذهبت شهوتهن من قلبى، قال أبو سليمان : فترى أنه من صبر عنهن عند إدراكه سنة لم يمرفهن حلالا ولا حراما، إنه يكفى مؤنتهن. حدثنا …"
summary:
