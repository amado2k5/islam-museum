text: "… والحرام بين الحياء شعبة من الإيمان حرف الخاء خاشعون : خائفون ساكنون خالفوا أهل الكتاب فإنهم لا يفطرون خالفوا اليهود فإنهم لا يصلون في نعالهم خذ غيرها يا أبا هريرة فإنه لا عيش خذ هذا سيضيء لك أمامك عشرا وخلفك …"
