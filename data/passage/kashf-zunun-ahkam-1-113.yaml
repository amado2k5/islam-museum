text: "… مستقيمةً، فرأوا أ ذلك مُسْتَحَبًّا، بل واجبًا لقضيةِ الإيجابِ المذكور معَ قولِه: العِلْم صَيْدٌ والكتابة قَيْدٌ، قَيِّدُوا رحمكم اللّٰه عُلومَكُم بالكِتابة، الحديثَ. الإشارةُ الثالثة: في أوّل مَن صَنَّف في الإسلام. واعلم أنَّهُ اختُلِفَ في أوّل مَن صَنَّفَ، فقيل: الإمام عبد …"
