text: "… مستقيمةً، فرأوا أ ذلك مُسْتَحَبًّا، بل واجبًا لقضيةِ الإيجابِ المذكور معَ قولِه: العِلْم صَيْدٌ والكتابة قَيْدٌ، قَيِّدُوا رحمكم اللّٰه عُلومَكُم بالكِتابة، الحديثَ. الإشارةُ الثالثة: في أوّل مَن صَنَّف في الإسلام. واعلم أنَّهُ اختُلِفَ في أوّل مَن صَنَّفَ، فقيل: الإمام عبد …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 113، يرد فيه ذكر الواجب، والوجوب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 113, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
