summary:
  ar: "القسم 11 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الكفارات»، ويضم فيها النصوص من 2090 إلى 2136 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 11 of Sunan Ibn Majah (The Chapters on Expiation) in the division of the open hadith dataset the museum took its reports from: reports 2090 to 2136 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 11، عنوان «کتاب الکفارات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2090 تا 2136۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 11 de Sunan Ibn Majah (Los capítulos sobre la expiación) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2090 al 2136, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 11 du Sunan Ibn Majah (Les chapitres sur l'expiation), qui comprend les hadiths 2090 à 2136 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
