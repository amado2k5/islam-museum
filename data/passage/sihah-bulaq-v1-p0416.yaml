text: |-
  ⁦(فصل الدال)⁩
  ٢٢٥
  قال امر ؤ القيس ويخضد فى الآرى حتى كانما * به عرة أوطائف غير معقب
  وقيل لاعرابىّ وكان معجبا بالقناء ما يعجبك منه قال خضده وبرده والخضد القطع وكل رطب
  قضبته فقد خضدته وكذلك التخضيد قال الشاعر أو خروع لم يخضد وخضدت الشجر
  طعت شوكه فهو خضيد ومخضود وان لخضد كل ما قطع من عودرطب قال الشاعر
  أوجرت حفرته حرصافال به • كمااننى خضد من ناعم الضال
  والخضاد شجررخو بلاشوك ( خفد أخفدت الناقة فهي محف داذا أظهرت أنها
  هلت ولم يكن جاحل والخفود من القوق التى تلقى ولدها قبل أن يستبين خلقه والخفيد
  والخفيدد الطفيف من الظلمان ⁦( خلد)⁩ الخلددوام البقاء تقول خلدارجل يخلد خلودا
  وأخاده اللّٰه وخلده تخليدا وقيل لانافى الصخور خوالدابقائم ابعد دروس الاطلال
  قال الشاعر المخبل السعدى
  إلارماداها مدادفعت * عنه الرياح خو الدسهم
  والخلدأً يضاضرب من الجرذان أعمى وأخلدت الى فلان أى ركنت اليه ومنه قوله تعالى
  لكنه أخلد الى الارض وأخلد بالمكان أقام به قال زهير كالوحى فى حجر المسيل المخلد
  أبوزيد أخلد الرجل بصاحبه لزمه ابن السكيت رجل مخلداذا أسنّ ولم يشب وانخلد اليال
  بقال وقع ذلك فى خلدى أى فى روعى وقلبى وانخالدان من بنى أسدخالد بن نضلة بن الاشت
  ابن جحوان بن فقعس وخالدين قيس بن المضلل بن مالك بن الاصغر بن منقذبن طريف بن عمرو
  ابن قعين قال الشاعر
  وقبلى مات الخالد أن كلاهما * عميد بي ججوان وابن المضال
  ⁦( خد )⁩ خدت النار تخمد خود اسكن لهبها ولم يطفا جرهما وهمدن اداطفى جرها
  وأخدتها أنا وخدت المى سكن فورانها وخد المريض أغمى عليه أومات والهود على وزن
  التنور موضع تدفن فيه النار لتخمد ⁦(خود )⁩ الفود الجارية الناعمة والمع خود مثل
  رمح لدن ورماح لدن والتخويدسرعة السير
  صل الدال د) الدد اللهو واللعب وفى الحديت ما أنامن ددولا الددمنى وفيه
  ثلاث لفات تقول هذاددود دامئل قفاوددن قال طرقة ١
  كأن حدوح المالكية غدوة * خلاياسفين بالنواصف من دد
  ويقال هو موضع/ درد) رجل أدردايس فى فهسن بين الدرد والاتى درداء وفى الحديث
  أمرت بالسواكحتى خفت لا دردن أراد بالخوف الظن والعرب تذهب بالان مذهب المز
  ذيجاب بجوابها فية ولون ظئنت لعبد اللّٰه خير منك والدردم بالكسر النافة المسنة وهى
  الدرداء والميم زائدة كا قالو المدلقاء دلقم وللادقعاء دقهم على فعلم وقول النابغة الجعدى
  ونحن رهنا بالافاقة عامرا • بماكان فى الدرداءرمنا فابسلا
  قال أبو عبيدة الدرداء كتيبة كانت لهم ودردى الزيت وغيره ما يبقى فى أسفله ودريد تصف
  أدرد مرخا ٢ دعد) دعداسم امرآة يصرف ولا يصرف قال الشاءر
  لم تتلفع بفضل متزرها • دعد ولم تغذد عدد بإلعلب
  ٥٧
  ل
  الوكة كن ااين الحرف
  قال درد الرجل فهودرد كما
  يقال أدرد اه وعليه فلايكون
  دريد تصغير تر خيم قاله نصر
