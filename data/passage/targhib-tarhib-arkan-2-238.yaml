text: "… حتى يستقيم لسانه ولا يستقيم لسانه ولا يدخل الجنة حتى يأمن جاره بوائقه رواء احد وابن أبى الدنيافي الصمت كلاهما من رواية على بن مسعدة - وعنه قال قال وسول اللّه ملياة المؤمن من أمنه الناس والمسلم من سلم المسلمون …"
