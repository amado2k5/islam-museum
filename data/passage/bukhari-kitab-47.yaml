summary:
  ar: "القسم 47 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الشركة»، ويضم فيها النصوص من 2483 إلى 2507 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 47 of Sahih al-Bukhari (Partnership) in the division of the open hadith dataset the museum took its reports from: reports 2483 to 2507 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 47، عنوان «کتاب الشرکۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2483 تا 2507۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 47 de Sahih al-Bukhari (Colaboración) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2483 al 2507, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 47 (Sahih al-Bukhari, « Partenariat »), dans la base de données ouverte: les hadiths 2483 à 2507. Le musée classe ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
