text: |-
  ٤٨,٠ -
  ⁦(باب السين)⁩
  السرعة والنفس بالتحريك واحد الانفاس وقد تنفس الرجل وتنفس الصعداء وكل ذرتة
  متنفس ودواب الماء لارقات لها وتنفس الصبح أى تبلج وتنفست القوس أى تصدّعت
  ويقال للنهاراذازاد تنفس وكذلك الموج اذا نضح الماء وقول الشاعر
  عينىّ جود اعبرة أنفاسا أى ساعة بعد ساعة والنفس أيضا الجرعة يقال أكرع
  فى الاناء نفسا أو نفسين أى جرعة أوجرعتّين ولا تزدعليه والجمع أنفاس مثل سبب وأسباب
  تعلل وهى ساغبة بنيها • بأنفاس من الشبم القراح
  ويقال أيضا أنت فى نفسر من أمرك أى فى سعة وشءنقيس أى يتنافس فيه ويرغب وهذا
  أنفس مالى أى أحيه وأكرمه عندى وأنفسنى فلان فى كذا أى رغبنى فه ولفلان منفسر
  ونفيس آى مال كثير يقال ما يسرتى بهذا الامر منفس وتفيس ونفس به بالكسر أى ضن به
  بقال نفست عليه الشىّ نفاسة اذ الم تره يستأهلدونفست على بخير قليل أى حسدت وتفمر
  الشىء بالضم نقاسة أى صار نفيساهر غوبافيه ونافست فى الشئمنافسة ونفاسا اذارغبت
  فيه على وجه المباراة فى الكرم وتنافسوافيه أى رغبوا وقولهم لك فى هذا الاحر نفسة
  أى مهلة ونفست عنه تنفيسا أى رفهت يقال نفس اللّٰه عنه كربته أى فرجها والنفاس
  ولاد المرأة اذا وضعت فهى نفساء ونسوة نفاس وليس فى الكلام فعلا يجمع على فعال
  غير نفساء وعشراء ويجمع أيضاءلى نفساوات وعشراوات وامر أتان نفساوان
  وعشراوان أبدلوا من هم-زة التأنيت واوا وقد نفست المرأة بالكسرنفاساونفاسة ويقال
  أيضانفست المرأة غلاما على مالم يسمّت فاعله والولد منفوس وفى الحديث ما من نفس منفوسة
  الاوقد كتب مكانهامن الجنة والفاروة ولهم ورث فلان هذا قبل أن ينفس فلان أى قبل
  أن يولد قال الشاعر
  لناصرخة ثم اسكاته • كما طرقت بنفاس بكر
  أى بولد .⁦(نقس)⁩ الناقوس الذى تضرب به النصارى لاوقات الصلاة قال جري
  لَماتذ كرت بالدير ين أرّقنى * صوت الدجاج وضرب بالنواقيس
  والنقس ضرب الناقوس وفى الحديث كادوا ينقسون حتى رأى عبد اللّه بن زيد الاذان
  فى المنام والنقس أيضامث-ل اللقس وهو أن تعيب القوم وتسخر منه-م والنقس بالسكسم
  الذى يكتب به ويجمع على انقس وانقاس قال المرار الفقعسى
  عفت المنازل غير مثل الانقس * بعد الزمان ءرفته بالقرطس
  أى فى القرطاس تقول منه نقس دواته تنقيسا نقرس النقرس داء معروف والنقرس
  أيضا الماذق قال دليل نقرس اذا كان داهية وطبيب نقرس ونريس أى حادق قال روبة
  وقدأ كون مرّة نطيسا • طبابأدواء الصبانقريا
  ⁦(نكس)⁩ نكت الشى أنكه نكا قلبته على رأسه فانتكس وتكسته تنكيا
  والناكس المطاطئ رأسه وججمع فى الشعرء-لى نواكس وهو شا ذ على ماذ كرناه فى فوارس
  قال الفرزدق واذا الرجال رأوايز يدرأيتهم • خضع الرقاب نواكس الابسار
  والولاد المنكوس الذى تخرج رجلاه قبل رأسه وهو اليتن والمنكس من الخيل الذي
  لا يسمو برأله والنكس بالضم عود المريض بعد النقه وقد نكس الرحل نكسا يقال تعالد
  ونسكسا وقد يفتح ههنا للازدواج أولانه اغة والنكس بالكسر السهم الذى ينكسرفوقه
  يجعل
