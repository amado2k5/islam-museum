label: { ar: "مسلم 2409 — تسمية علي «أبا تراب»", en: "Muslim 2409 — The Prophet naming Ali 'Abu Turab'" }
text: "ما كان لعلي اسم أحب إليه من أبي التراب، وإن كان ليفرح إذا دعي به... وجاءه رسول الله وهو مضطجع قد سقط رداؤه عن شقه فأصابه تراب، فجعل يمسحه عنه ويقول: «قم أبا تراب، قم أبا تراب»"
summary:
  ar: "رواية سهل بن سعد في فضائل علي؛ استُعمل على المدينة رجل من آل مروان فأمر سهلا أن يشتم عليا فأبى، ثم روى أن «أبا تراب» كان أحب أسماء علي إليه — دعاه بها النبي وهو يمسح التراب عن ظهره في المسجد بعد خصومة بينه وبين فاطمة."
