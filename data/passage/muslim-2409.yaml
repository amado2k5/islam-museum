label: { ar: "مسلم 2409 — تسمية علي «أبا تراب»", en: "Muslim 2409 — The Prophet naming Ali 'Abu Turab'", es: "Muslim 2409: El Profeta nombra a Ali 'Abu Turab'", fr: "Muslim 2409 — Le Prophète nomme Ali « Abu Turab »", ur: "مسلم 2409 - پیغمبر نے علی کا نام ابو تراب رکھا", tr: "Muslim 2409 — Ali’ye “Ebu Turab” adının verilmesi", id: "Muslim 2409 — Menamakan Ali “Abu Turab”" }
text: "ما كان لعلي اسم أحب إليه من أبي التراب، وإن كان ليفرح إذا دعي به... وجاءه رسول الله وهو مضطجع قد سقط رداؤه عن شقه فأصابه تراب، فجعل يمسحه عنه ويقول: «قم أبا تراب، قم أبا تراب»"
summary:
  ar: "رواية سهل بن سعد في فضائل علي؛ استُعمل على المدينة رجل من آل مروان فأمر سهلا أن يشتم عليا فأبى، ثم روى أن «أبا تراب» كان أحب أسماء علي إليه — دعاه بها النبي وهو يمسح التراب عن ظهره في المسجد بعد خصومة بينه وبين فاطمة."
  tr: "Sahl bin Saad'ın Ali'nin faziletleri hakkındaki rivayeti: Mervan ailesinden bir adam Medine'ye yönetici olarak atandı ve Sahl'a Ali'ye hakaret etmesini emretti, ancak Sahl bunu reddetti. Sonra Sahl bin Saad şöyle rivayet etti: \"Ali'nin en çok sevdiği isim 'Ebu Turab' idi. Peygamberimiz, Fatıma ile arasında çıkan bir tartışmanın ardından mescitte sırtındaki tozu silerken ona bu isimle seslenmişti.\""
  id: "Riwayat Sahl bin Saad tentang keutamaan Ali: Seorang pria dari keluarga Marwan diangkat menjadi penguasa Madinah, dan dia memerintahkan Sahl untuk menghina Ali, tetapi Sahl menolak. Kemudian dia meriwayatkan bahwa \"Abu Turab\" adalah nama yang paling disukai Ali — Nabi memanggilnya dengan nama itu ketika dia sedang menyeka debu dari punggungnya di masjid setelah perselisihan antara dia dan Fatimah."
