label: { ar: "الموطأ 610 — سعيد بن المسيب: صليت وراء أبي هريرة على صبي فسمعته يقول: اللهم أعذه من عذاب القبر", en: "Muwatta 610", es: "Muwatta 610", fr: "Muwatta 610", ur: "موطا 610", tr: "El-Muvatta 610 — Sa'id ibn el-Musayyab: Ebu Hurayra'nın arkasında bir çocuk için dua ediyordum ve onun şöyle dediğini işittim: Ey Allah'ım, onu kabir azabından koru.", id: "Al-Muwatta 610 — Sa'id ibn al-Musayyab: Aku shalat di belakang Abu Hurayrah di atas seorang anak laki-laki dan aku mendengar dia berkata: Ya Allah, lindungilah dia dari siksa kubur" }
text: "اللهم أعذه من عذاب القبر"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد، قال: سمعت سعيد بن المسيب يقول: صليت وراء أبي هريرة على صبي لم يعمل خطيئة قط، فسمعته يقول: اللهم أعذه من عذاب القبر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.313}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ederek şöyle demiştir: Sa'id ibn al-Musayyab'ın şöyle dediğini işittim: Ebu Hurayra'nın arkasında, hiç günah işlememiş bir çocuk için dua ettim ve onun şöyle dediğini işittim: \"Ey Allah'ım, onu kabir azabından koru.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.313}"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id, yang berkata: Aku mendengar Sa'id bin al-Musayyab berkata: Aku shalat di belakang Abu Hurayrah di atas seorang anak laki-laki yang tidak pernah berbuat dosa, dan aku mendengar dia berkata: \"Ya Allah, lindungilah dia dari siksa kubur.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.313}"
