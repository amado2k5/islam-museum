text: "… اسمه إبراهيم فغير عمر اسمه لما غير أسماءَ من تَسمَّى بالأنبياء، وسماه عبدالرحمٰن. وشهد الجمل مع عائشة، وكان صِهْرَ عثمان، تزوج مَرْيَم ابنةً عثمان. وهو ممن أمَرّه عثمان أن يَكْتُبَ المصاحف مع زيدِ بن ثابت، وسعيد بن العاص، وعبد الله …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 757، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 757, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 757 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 757, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 757), mentionnant la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette référence figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin 1. resimli cildinin 757. sayfasında, Kur'an'ın derlenmesi ve el yazmaları ile hat sanatı ve yazıdan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 1 bergambar, halaman 757, menyebutkan penyusunan Al-Qur'an dan manuskripnya, serta kaligrafi dan tulisan; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
