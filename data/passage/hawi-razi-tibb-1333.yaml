text: "… على البطن ليسكن الوجع وتوضع على الموضع محاجم. لي: ليجذب الخلط إلى عضل البطن ويضمد بهذا ونحوه : شمع بأبونج دهن ورد دقيق باقلى مخ البيض، يجمع بطبيخ الحلبة، ولطف تدبيرهم ودبرهم تدبير المحموم. والذي من خلط حريف في الأمعاء …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1333، يذكر الحجامة، والوجع، والحمى والوعك، وأعضاء البدن، والجراحة والختان والجبائر، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1333, that mentions cupping, pain, fever, the organs of the body, surgery, circumcision and splints, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
