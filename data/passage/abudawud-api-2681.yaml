label: { ar: "سنن أبي داود 2681 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 2681 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 2681 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، قَالَ حَدَّثَنَا حَمَّادٌ، عَنْ ثَابِتٍ، عَنْ أَنَسٍ، أَنَّ رَسُولَ اللَّهِ نَدَبَ أَصْحَابَهُ فَانْطَلَقُوا إِلَى بَدْرٍ فَإِذَا هُمْ بِرَوَايَا قُرَيْشٍ فِيهَا عَبْدٌ أَسْوَدُ لِبَنِي الْحَجَّاجِ فَأَخَذَهُ أَصْحَابُ رَسُولِ اللَّهِ فَجَعَلُوا يَسْأَلُونَهُ أَيْنَ أَبُو سُفْيَانَ فَيَقُولُ وَاللَّهِ مَا لِي بِشَىْءٍ مِنْ أَمْرِهِ عِلْمٌ وَلَكِنْ هَذِهِ قُرَيْشٌ قَدْ جَاءَتْ فِيهِمْ أَبُو جَهْلٍ وَعُتْبَةُ وَشَيْبَةُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2681، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2681 (Jihad (Kitab Al-Jihad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 2681، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
