label: { ar: "سنن أبي داود 4216 — أثر من الآثار المحفوظة", en: "Sunan Abi Dawud 4216 — a relic kept after its owner", ur: "سنن ابی داؤد 4216 — محفوظ آثار و تبرکات", es: "Sunan Abi Dawud 4216 — una reliquia conservada después de su dueño.", fr: "Sunan Abi Dawud 4216 — une relique conservée après son propriétaire", tr: "Sünen Ebi Davud 4216 — Korunmuş bir hadis", id: "Sunan Abi Dawud 4216 — Sebuah hadits yang dilestarikan" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، وَأَحْمَدُ بْنُ صَالِحٍ، قَالاَ حَدَّثَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي يُونُسُ بْنُ يَزِيدَ، عَنِ ابْنِ شِهَابٍ، قَالَ حَدَّثَنِي أَنَسٌ، قَالَ كَانَ خَاتَمُ النَّبِيِّ مِنْ وَرِقٍ فَصُّهُ حَبَشِيٌّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4216، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4216 (Signet-Rings (Kitab Al-Khatam)), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 4216، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4216 (Signet-Rings (Kitab Al-Khatam)), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 4216 (Situation des anneaux), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sünen Ebu Davud'da 4216 numaralı hadis, korunmuş bir rivayetten bahsetmektedir. Bu hadis, vasiyetnameler, miras, gelenekler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4216, menyebutkan sebuah tradisi yang lestari. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, tradisi, dan makam suci, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
