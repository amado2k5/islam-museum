label:
  ar: "الترمذي 2561 — تحاجت الجنة والنار: أنت رحمتي وأنت عذابي"
  en: "Tirmidhi 2561 — Paradise and the Fire disputed: you are My mercy, you are My punishment"
  ur: "ترمذی 2561 — جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب"
  es: "Tirmidhi 2561 — El Paraíso y el Fuego en disputa: Tú eres mi misericordia, tú eres mi castigo."
  fr: "Tirmidhi 2561 — Le Paradis et le Feu se disputent: tu es Ma miséricorde, tu es Mon châtiment"
  tr: "Tirmizi 2561 — Cennet ve Cehennem tartıştı: Sen Benim rahmetimsin, sen de Benim azabımısın."
  id: "Tirmidzi 2561 — Surga dan Neraka berdebat: Engkau adalah rahmat-Ku dan engkau adalah hukuman-Ku"
text: "احتجت الجنة والنار فقالت الجنة يدخلني الضعفاء والمساكين . وقالت النار يدخلني الجبارون والمتكبرون . فقال للنار أنت عذابي أنتقم بك ممن شئت . وقال للجنة أنت رحمتي أرحم بك من شئت . قال أبو عيسى هذا حديث حسن صحيح …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2561: تحاجت الجنة والنار: أنت رحمتي وأنت عذابي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2561: Paradise and the Fire disputed: you are My mercy, you are My punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2561: جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Jami al-Tirmidhi, n.° 2561: El Paraíso y el Fuego en disputa: Tú eres Mi misericordia, tú eres Mi castigo. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Jami al-Tirmidhi, n° 2561: Le Paradis et l’Enfer sont sujets à controverse: « Vous êtes Ma miséricorde, vous êtes Mon châtiment. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Jami' al-Tirmidhi, no. 2561: Surga dan Neraka berargumen: \"Kamu adalah rahmat-Ku dan kamu adalah azab-Ku.\" Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta'."
