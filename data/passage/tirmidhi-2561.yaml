label:
  ar: "الترمذي 2561 — تحاجت الجنة والنار: أنت رحمتي وأنت عذابي"
  en: "Tirmidhi 2561 — Paradise and the Fire disputed: you are My mercy, you are My punishment"
  ur: "ترمذی 2561 — جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب"
text: "احتجت الجنة والنار فقالت الجنة يدخلني الضعفاء والمساكين . وقالت النار يدخلني الجبارون والمتكبرون . فقال للنار أنت عذابي أنتقم بك ممن شئت . وقال للجنة أنت رحمتي أرحم بك من شئت . قال أبو عيسى هذا حديث حسن صحيح …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2561: تحاجت الجنة والنار: أنت رحمتي وأنت عذابي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2561: Paradise and the Fire disputed: you are My mercy, you are My punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2561: جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
