text: "… مَوْجُودَا الرجز فكتب بذلك إلى عمر، فكتب إليه: أنقْصٍ من عطاء الأغلب خمسمائة فزِدْها في عطاء لبيد. ورواه ابْنُ دُرَيْدٍ في الأخْبَارِ المَنْتُورة عن الرِّيَاشيِّ، عن أبي معمر، عن عبد الوارث، عن أبي عمرو بن العلاء نحوه. وأنشد له المرزباني: …"
