text: "… مَوْجُودَا الرجز فكتب بذلك إلى عمر، فكتب إليه: أنقْصٍ من عطاء الأغلب خمسمائة فزِدْها في عطاء لبيد. ورواه ابْنُ دُرَيْدٍ في الأخْبَارِ المَنْتُورة عن الرِّيَاشيِّ، عن أبي معمر، عن عبد الوارث، عن أبي عمرو بن العلاء نحوه. وأنشد له المرزباني: …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 251، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 1, p. 251, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 1، ص 251 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 1, pág. 251, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 1, p. 251), mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 1. cildinin 251. sayfasından bir alıntı, okuyuculardan bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 1, halaman 251, menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
