text: "… فادق اللّٰه ياأخى فانه مانال أحد من الناس شيئا إلا صار حقيرا ذايلا عند الناس، والمؤمنون شهود اللّٰه فى الأرض، وإياك أن تكسب خبينا فتنفقه فى طاعة اللّٰه، فان تركه فريضة من اللّٰه واجبة، وإنه طيب لا يقبل إلا طيبا، …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 7، ص 71، يرد فيه ذكر الفريضة والفرائض، وطاعة الله ورسوله، والواجب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 7, p. 71, whose wording mentions the obligation (farida), obedience to God and His Messenger, the obligatory (wajib), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 7، ص 71 کا اقتباس جس میں فریضہ اور فرائض، اللہ اور اس کے رسول کی اطاعت، واجب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' de Abu Nu'aym, volume numérisé 7, p. 71, dont le texte mentionne l'obligation (farida), l'obéissance à Dieu et à Son Messager, l'obligatoire (wajib), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen digitalizado 7, p. 71, cuyo texto menciona la obligación (farida), la obediencia a Dios y a Su Mensajero, lo obligatorio (wajib), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
