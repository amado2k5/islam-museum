label: { ar: "جامع الترمذي 3886 — الأب والأبوة", en: "Jami' al-Tirmidhi 3886 — the father and fatherhood", ur: "جامع ترمذی 3886 — باپ اور والدیت" }
text: "… بْنُ سَعِيدٍ الْجَوْهَرِيُّ، قَالَ حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ الأُمَوِيُّ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ، عَنْ عَمْرِو بْنِ الْعَاصِ، أَنَّهُ قَالَ يَا رَسُولَ اللَّهِ مَنْ أَحَبُّ النَّاسِ إِلَيْكَ قَالَ \" عَائِشَةُ \". قَالَ مِنَ الرِّجَالِ قَالَ \" أَبُوهَا \". هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ مِنْ حَدِيثِ إِسْمَاعِيلَ عَنْ قَيْسٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3886، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3886 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3886، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
