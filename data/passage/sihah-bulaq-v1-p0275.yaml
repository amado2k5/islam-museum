text: |-
  ٣٦٦
  ⁦(باب الرام)⁩
  أبى النجم خود يغطى الفرع منها الؤتزر * لوعصر منه البان والمسل انصر
  يدعصر خفف والاعتصار أن يغص الانسان بالطعام فيعتصر بالماء وهوأن يشربه قليلا
  للاليسيغه قال عدى بزريد
  لويغير الماء حلقى شرق * كنت كالغصان بالماء اعتصارى
  والعصارة ماسال عن العصر وما بقى من الثفل أيضأ بعد العصر والمعصرة بكسر الميم
  ما يعصرفيه العنب وفلاذكريم المعصر بالفتح أى كريم عند المسئلة والمعصر الجارية أول
  ما أدركت وحاضت يقال قد أعصرت كأنها دخلت عصر شبابها أوبلغته قال الراجز
  جارية بفوان دارها * تشى الهويناساقطاخارها
  ينحلّ من غلها ازارها • قد أعصرت أوقددنا اعصارها
  والجمع محاصرويقاك هى التى قاربت الحيض لان الاعصار فى الجارية كالمراهقة فى الغلام
  سمعته من أبى الغوث الاعرابى وقولهم لاأفعله مادام للزيت عاصر أى أبدا والمعصرات
  السحائب تعتصر بالمطر وعصر القوم أى مطروا ومنه قرأبعضهم وفيه بعصرون والاعصار
  ريح تهب تثير الغبار فير تفع الى السماء كأنه عمود قال اللّٰه تعالى واصابها اعصار فيه نار
  ويقال هى رمح تثير ساباذات رعد وبرق ويعصر واعصر اسم رجل لايتصرف لانه مثل
  يقتل واقتل وهو أبو قبيلة منها باحلة والعنصر والعنصر الاصل والحسب: ⁦(عصفر)⁩ العصفر
  صبغ وقد عصفرت الثوب فتعصفر والعصفور طائر والاتى عصفورة والعصفور عظم ناتئ
  فى جبين الفرس وهماعصفوران يمنة ويسرة والعصفور قطعة من الدماغ كأنه باثن من
  وبينهما جليدة وعصافير القتب عراصيفهاءقاوبة منها وهى أربعة أوتاد يجعلن بين رؤس
  احناء القتب فى رأس كل حنووتدان مشدودان بالعقب أو بجلود الابل وفيسه الظلفات
  وعصف ورالا كاف عرصوفه على القلب وهوقطعة خشب مشدود بين الحنوين المقدمين
  وفى الحديث قد حرمت المدينة أن تضدأ وتخبط الالعصف ورقتب أومسد محالة أوعصا
  حديدة وعصافير المنذرابل كانت الملول نجائب قال حسان بن ثابت قاحدت
  أحد احسدى النابغسة حين أمر له النعمان بن المفذربمائة ناقة بريشها من نوق عصافيره
  وجام وآنية من فضة طر العطر الطيب تقول منه عطرت المرأة بالمكسر تعطر عطرا
  فهى عطرة ومتعطرة أى. تطيبة ورجل معطير كثير التعطر وصحكذلك امى أة معطير
  ومعطار وأماقول العجاج بصف الحاروالاتن
  يتبعن جأبا كمدق المعطير فانه يربد
  العطاروناقة عطرة ومعطارأى كريمة وابل معطرات كأن على أوبارها صسبغامن حسسنها
  قال الشاعر هجانا وحرامعطرات كانها • -دى مغرة ألوانما كالمجاسد
  ( فر لعفر بالتحريك التراب والعفرأيضا أوّل سقية سقيها الزرع وعفره فى التراب يعفره
  عفراوعفر هتعفيرا أى مرّع-ه والتعفير فى الفطام أن تسح المرأئديها بشئ من التراب
  تنفير اللصبىّ ويقال «ومن قواهم اقيت فلاناءن عف ر بالضم أى بعد شهر ونحوه لانهاترضعه
  بين اليوم واليومين تبلو بذلك صبره وهذا المعنى أراد لبيدبة وله
  لمعفرق د تنازع شاوه * عبس كواسب لا يمن طعامها
  وتعفير
