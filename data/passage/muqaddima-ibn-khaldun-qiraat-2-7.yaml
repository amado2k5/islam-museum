text: "… بالنمق أو بالإجماع أو بالإلحاق، فلا بد من النظر في الكتاب: ببيان ألفاظه أولاً، وهذا هو علم التفسير، ثم بإسناد نقله وروايته إلى النبي الذي جاء به من عند الله، واختلاف روايات القراء في قراءته، وهذا هو علم القراءات، ثم …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 2، ص 7، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 2, p. 7, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 2، ص 7 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 2, pág. 7, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
