  tr: "Malik şöyle dedi: Abdullah ibn Umar'a farz köle hakkında, şartlı olarak satın alınabilir mi diye sorulduğu ve onun da \"Hayır\" dediği kendisine ulaştı. {cite:muwatta-maruf-1997 s.330}"
