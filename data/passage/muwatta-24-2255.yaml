label: { ar: "الموطأ 2255 — مالك: بلغه أن عبد الله بن عمر سئل عن الرقبة الواجبة، هل تشترى بشرط؟ فقال: لا", en: "Muwatta 2255", es: "Muwatta 2255", fr: "Muwatta 2255", ur: "موطا 2255", tr: "El-Muvatta 2255 — Malik: Abdullah bin Ömer'e farz köle hakkında soru sorulduğu, kölenin şartlı olarak satın alınıp alınamayacağı sorulduğu kendisine ulaştı. O da \"Hayır\" dedi.", id: "Al-Muwatta 2255 — Malik: Sampai kepadanya bahwa Abdullah bin Umar ditanya tentang budak wajib, apakah dia bisa dibeli dengan syarat tertentu? Dia menjawab: Tidak." }
summary:
