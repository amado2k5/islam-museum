text: "… إلا من الفضة. قال صاحب كشاف القناع : الدملج في معنى الخاتم. واختلف الحنفية في التختم بغير الذهب والفضة. والحاصل كما قال ابن عابدين: أن التختم بالفضة حلال للرجال بالحديث، وبالذهب والحديد والصفر حرام عليهم بالحديث، وبالحجر حلال على اختيار …"
