text: "… - باب النهي عن ترك النار في البيت عند النوم ونحوه سواء كانت في سراج أو غيره. - باب النهي عن التكلف، وهو فعل وقول مالا مصلحة فيه بمشقة - باب تحريم النياحة علي الميت ولطم الخد، وشق الجيب ونتف …"
summary:
  ar: "مقطع من رياض الصالحين، المجلد المصوَّر 3، ص 386، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Riyad al-Salihin, scan volume 3, p. 386, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ریاض الصالحین، اسکین جلد 3، ص 386 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin, volume numérisé 3, p. 386, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Riyad al-Salihin, volumen escaneado 3, p. 386, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Riyad as-Salihin, Resimli Cilt 3, sayfa 386'dan, ölen için ağlama veya ağıt yakma ve sınırları ile ilgili bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve mersiyelerden derlenmiştir."
  id: "Cuplikan dari Riyad as-Salihin, Jilid Bergambar 3, halaman 386, mengenai ratapan atau tangisan atas orang yang meninggal dan batasannya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini dikompilasi dari kumpulan elegi dan ratapan yang paling terkenal."
