label: { ar: "الموطأ 1973 — مالك: إنما فرق بين أن لا يبيع الرجل إلا ما عنده، وأن يسلف الرجل في شيء ليس عنده أصله، لأن صاحب العينة إنما يحمل ذهبه التي يريد أن يبتاع بها، فيقول: هذه عشرة دنانير فما تريد أن أشتري لك بها؟ فكأنه يبيع عشرة دنانير نقدا بخمسة عشر دينارا إلى أجل", en: "Muwatta 1973", es: "Muwatta 1973", fr: "Muwatta 1973", ur: "موطا 1973", tr: "El-Muvatta 1973 — Malik: Fark, sadece sahip olduğu şeyi satan bir kimse ile anaparasını ödemediği bir şeyi borç veren bir kimse arasında yatmaktadır. Çünkü borç veren, sadece satın almayı düşündüğü altınını yanında taşır ve şöyle der: \"İşte on dinar, bunlarla sizin için ne almamı istiyorsunuz?\" Bu, on dinarı nakit olarak on beş dinara kredili olarak satmak gibidir.", id: "Al-Muwatta 1973 — Malik: Perbedaannya terletak pada seseorang yang hanya menjual apa yang dimilikinya dan seseorang yang meminjamkan sesuatu yang pokok pinjamannya tidak dimilikinya, karena orang yang meminjamkan hanya membawa emas yang ingin dibelinya, dan berkata: Ini sepuluh dinar, apa yang ingin Anda beli dengan uang ini? Seolah-olah dia menjual sepuluh dinar secara tunai dengan lima belas dinar secara kredit." }
summary:
  ar: "قال مالك: وإنما فرق بين أن لا يبيع الرجل إلا ما عنده، وأن يسلف الرجل في شيء ليس عنده أصله. أن صاحب العينة إنما يحمل ذهبه التي يريد أن يبتاع بها، فيقول: هذه عشرة دنانير فما تريد أن أشتري لك بها؟ فكأنه يبيع عشرة دنانير نقدا بخمسة عشر دينارا إلى أجل. فلهذا كره هذا، وإنما تلك الدخلة والدلسة. {cite:muwatta-maruf-1997 p.207} {cite:muwatta-maruf-1997 p.208}"
  tr: "Malik şöyle dedi: Sadece sahip olduğu şeyi satan bir adamla, asıl parasını ödemediği bir şeyi ödünç veren bir adam arasındaki fark şudur: Bu tür bir işleme giren kişi, satın alma işlemi için kullanmayı düşündüğü altınını yanında taşır ve \"İşte on dinar. Bunlarla sizin için ne almamı istiyorsunuz?\" der. Sanki on dinarı nakit olarak on beş dinara kredili satıyormuş gibi olur. İşte bu yüzden bu hoş karşılanmaz; bu, aldatma ve dolandırıcılıktan başka bir şey değildir. {cite:muwatta-maruf-1997 s.207} {cite:muwatta-maruf-1997 s.208}"
  id: "Malik berkata: Perbedaan antara orang yang hanya menjual apa yang dimilikinya dan orang yang meminjamkan sesuatu yang bukan merupakan pokok pinjamannya adalah bahwa orang yang melakukan transaksi jenis ini membawa emasnya, yang akan digunakannya untuk melakukan pembelian, dan berkata, \"Ini sepuluh dinar. Apa yang ingin Anda beli dengan uang ini?\" Seolah-olah dia menjual sepuluh dinar secara tunai dengan lima belas dinar secara kredit. Inilah sebabnya mengapa hal ini tidak disukai; ini tidak lain adalah penipuan dan kecurangan. {cite:muwatta-maruf-1997 p.207} {cite:muwatta-maruf-1997 p.208}"
