label: { ar: "الموطأ 1973 — مالك: إنما فرق بين أن لا يبيع الرجل إلا ما عنده، وأن يسلف الرجل في شيء ليس عنده أصله، لأن صاحب العينة إنما يحمل ذهبه التي يريد أن يبتاع بها، فيقول: هذه عشرة دنانير فما تريد أن أشتري لك بها؟ فكأنه يبيع عشرة دنانير نقدا بخمسة عشر دينارا إلى أجل", en: "Muwatta 1973" }
summary:
  ar: "قال مالك: وإنما فرق بين أن لا يبيع الرجل إلا ما عنده، وأن يسلف الرجل في شيء ليس عنده أصله. أن صاحب العينة إنما يحمل ذهبه التي يريد أن يبتاع بها، فيقول: هذه عشرة دنانير فما تريد أن أشتري لك بها؟ فكأنه يبيع عشرة دنانير نقدا بخمسة عشر دينارا إلى أجل. فلهذا كره هذا، وإنما تلك الدخلة والدلسة. {cite:muwatta-maruf-1997 p.207} {cite:muwatta-maruf-1997 p.208}"
