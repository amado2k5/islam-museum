text: "… بدينكم، وتوكلوا على ربكم، فان دين اللّٰه قائم، وان كلمة اللّٰه تامة، وإن اللّٰه ناصر من نصره و معز دينه، وإن كتاب اللّٰه بين اظهرنا وهو النور والشفاء، وبه هدى اللّه محمدا، وفيه حلال اللّه وحرامه. واللّه لا نبالى من …"
