summary:
  ar: "قول لمالك في باب ما جاء في سجود القرآن: ليس العمل على أن ينزل الإمام إذا قرأ السجدة وهو على المنبر فيسجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.284}"
  tr: "Malik, Kur'an'da secde hakkında rivayet edilenler bölümünde şöyle demiştir: \"İmamın secde gerektiren bir ayeti okurken minberden inip secde etmesi adet değildir.\" Editör, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.284}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan mengenai sujud dalam Al-Quran: Bukanlah kebiasaan bagi imam untuk turun dari mimbar dan bersujud ketika ia membaca ayat yang mewajibkan sujud. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.284}"
