label:
  ar: "النسائي 467 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Nasa'i 467 — The first thing a servant is reckoned for is his prayer"
  ur: "نسائی 467 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
text: "أول ما يحاسب به العبد صلاته فإن كان أكملها وإلا قال الله عز وجل انظروا لعبدي من تطوع فإن وجد له تطوع قال أكملوا به الفريضة ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 467: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 467: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 467: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
