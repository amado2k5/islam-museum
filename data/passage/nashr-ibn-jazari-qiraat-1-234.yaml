text: "… الوقف والابتداء فلها حالتان. الاولى معرفة ما يوقف عليه وما يبتدأ به، والثانية كيف يوقف وكيف يبتدأ. وهذه تتعلق بالقراآت. وسيأتي ذكرها ان شاء اللّٰه تعالى في باب الوقف على او آخر الكلم ومرسوم الخط والكلام هنا على معرفة ما …"
summary:
