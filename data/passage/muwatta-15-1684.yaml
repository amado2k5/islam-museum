summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أم المؤمنين أنها انتقلت حفصة بنت عبد الرحمن بن أبي بكر الصديق حين دخلت في الدم من الحيضة الثالثة. قال ابن شهاب فذكر ذلك لعمرة بنت عبد الرحمن فقالت صدق عروة، وقد جادلها في ذلك ناس، فقالت عائشة صدقتم، وتدرون ما الأقراء؟ إنما الأقراء الأطهار. {cite:muwatta-maruf-1997 p.90}"
