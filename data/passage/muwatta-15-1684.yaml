label: { ar: "الموطأ 1684 — ابن شهاب عن عروة بن الزبير عن عائشة: حفصة بنت عبد الرحمن انتقلت حين دخلت في الدم من الحيضة الثالثة", en: "Muwatta 1684", es: "Muwatta 1684", fr: "Muwatta 1684", ur: "موطا 1684", tr: "El-Muvatta 1684 — İbn Şihab, Urve ibn el-Zübeyr'den, o da Ayşe'den rivayetle: Hafsa bint Abd el-Rahman, üçüncü adet döneminin kanamasına girdiğinde vefat etti.", id: "Al-Muwatta 1684 — Ibn Shihab, berdasarkan riwayat Urwah ibn al-Zubayr, berdasarkan riwayat Aisyah: Hafsa binti Abd al-Rahman wafat ketika ia mengalami menstruasi ketiga." }
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أم المؤمنين أنها انتقلت حفصة بنت عبد الرحمن بن أبي بكر الصديق حين دخلت في الدم من الحيضة الثالثة. قال ابن شهاب فذكر ذلك لعمرة بنت عبد الرحمن فقالت صدق عروة، وقد جادلها في ذلك ناس، فقالت عائشة صدقتم، وتدرون ما الأقراء؟ إنما الأقراء الأطهار. {cite:muwatta-maruf-1997 p.90}"
  tr: "Malik, İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Müminlerin Annesi Ayşe'den rivayet eder ki, Hafsa bint Abdülrahman ibn Ebu Bekir el-Siddik üçüncü adet dönemine girdiğinde vefat etmiştir. İbn Şihab şöyle demiştir: \"Bu, Amre bint Abdülrahman'a anlatıldı ve o, 'Urve haklı' dedi. Bazı insanlar bu konuda onunla tartıştılar ve Ayşe, 'Haklısın. 'Akra'nın ne olduğunu biliyor musun? 'Akra', temizlik dönemleridir' dedi.\" {cite:muwatta-maruf-1997 s.90}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah ibn al-Zubayr, dari Aisyah, Ummul Mukminin, bahwa Hafsa binti Abd al-Rahman ibn Abi Bakr al-Siddiq wafat ketika memasuki haid ketiga. Ibnu Shihab berkata, \"Hal ini diceritakan kepada Amrah binti Abd al-Rahman, dan dia berkata, 'Urwah benar.' Beberapa orang berdebat dengannya tentang hal ini, dan Aisyah berkata, 'Kamu benar. Tahukah kamu apa itu 'aqrah'? 'Aqrah' adalah masa-masa suci.'\" {cite:muwatta-maruf-1997 p.90}"
