label: { ar: "الموطأ 2576 — مالك: السنة في القسامة أن يبدأ أهل الدم، وبدأ النبي الأحاريثيين في قتيل خيبر", en: "Muwatta 2576", es: "Muwatta 2576", fr: "Muwatta 2576", ur: "موطا 2576", tr: "El-Muvatta 2576 — Malik: Tahliye yemininde sünnet, kurbanın ailesinin başlamasıdır ve Peygamber, Hayber'de öldürülen adamın durumunda Ahirilerden başlamıştır.", id: "Al-Muwatta 2576 — Malik: Sunnah dalam sumpah penyucian adalah agar keluarga korban memulai, dan Nabi memulai dengan kaum Aharith dalam kasus orang yang terbunuh di Khaybar." }
summary:
  ar: "قال مالك: وتلك السنة التي لا اختلاف فيها عندنا، والذي لم يزل عليه عمل الناس: أن المبدأين بالقسامة أهل الدم والذين يدعونه في العمد والخطأ. قال مالك: وقد بدأ رسول الله الأحاريثيين في صاحبهم الذي قُتل بخيبر. {cite:muwatta-maruf-1997 p.454}"
  tr: "Malik şöyle dedi: “Bu, aramızda yerleşik bir uygulamadır, üzerinde ihtilaf yoktur ve halkın her zaman benimsediği bir adettir: Kasıtlı veya kasıtsız öldürme durumlarında yemini başlatanlar, kurbanın ailesi ve yemini talep edenlerdir.” Malik şöyle dedi: “Ve Allah'ın Resulü, Hayber'de öldürülen sahabeleri hakkında Ahirilerden söz etmeye başladı.” {cite:muwatta-maruf-1997 s.454}"
  id: "Malik berkata: “Itulah kebiasaan yang telah mapan di antara kita, yang tidak ada perselisihan mengenainya, dan yang selalu menjadi kebiasaan masyarakat: bahwa yang memulai sumpah adalah keluarga korban dan yang mengklaimnya, dalam kasus pembunuhan yang disengaja maupun tidak disengaja.” Malik berkata: “Dan Rasulullah memulai dengan kaum Aharit tentang sahabat mereka yang terbunuh di Khaybar.” {cite:muwatta-maruf-1997 p.454}"
