label: { ar: "الموطأ 2576 — مالك: السنة في القسامة أن يبدأ أهل الدم، وبدأ النبي الأحاريثيين في قتيل خيبر", en: "Muwatta 2576" }
summary:
  ar: "قال مالك: وتلك السنة التي لا اختلاف فيها عندنا، والذي لم يزل عليه عمل الناس: أن المبدأين بالقسامة أهل الدم والذين يدعونه في العمد والخطأ. قال مالك: وقد بدأ رسول الله الأحاريثيين في صاحبهم الذي قُتل بخيبر. {cite:muwatta-maruf-1997 p.454}"
