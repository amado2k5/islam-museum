text: "… الصيد آلتان أو سببان يباح بأحدهما الصيد، ويحرم بالآخر ؛ يحرم الصيد، فالأصل أنه إذا اجتمع الحل والحرمة يغلب جانب الحرمة، عملا بقوله ايفي : ما اجتمع الحلال والحرام إلا وقد غلب الحرام الحلال أو احتياطا، كما قال الفقهاء. فلو …"
summary:
