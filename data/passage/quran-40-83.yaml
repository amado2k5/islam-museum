  ur: { text: "اور جب ان کے پیغمبر ان کے پاس کھلی نشانیاں لے کر آئے تو جو علم (اپنے خیال میں) ان کے پاس تھا اس پر اترانے لگے اور جس چیز سے تمسخر کیا کرتے تھے اس نے ان کو آ گھیرا", translator: "Fateh Muhammad Jalandhari", license: PD }
