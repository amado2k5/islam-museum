text: "… شَهِدَ النَّبِيَّ وَسَأَلَهُ سُوَيْدُ بْنُ طَارِقٍ أَوْ طَارِقُ بْنُ سُوَيْدٍ عَنِ الْخَمْرِ فَنَهَاهُ عَنْهُ فَقَالَ إِنَّنَا نَتَدَاوَى بِهَا. فَقَالَ رَسُولُ اللَّهِ \" إِنَّهَا لَيْسَتْ بِدَوَاءٍ وَلَكِنَّهَا دَاءٌ \". حَدَّثَنَا مَحْمُودٌ، قال حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، وَشَبَابَةُ، عَنْ شُعْبَةَ، بِمِثْلِهِ. قَالَ مَحْمُودٌ قَالَ النَّضْرُ طَارِقُ بْنُ سُوَيْدٍ وَقَالَ شَبَابَةُ سُوَيْدُ بْنُ طَارِقٍ. قَالَ أَبُو عِيسَى هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2046، يذكر الدواء، والداء، والتداوي، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2046 (Chapters on Medicine), that mentions the drug, the disease and its remedy, seeking treatment, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2046، جس میں دوا، بیماری، علاج کرانا، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
