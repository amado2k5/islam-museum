text: "بمثل ذلك. * هذا خبر صحيح علقه البخاري. (١) لم أجد هذا الباب في كتاب الجهاد، وقد بدأت كتاب الجهاد من أوله إلى آخره لعلي أجد هذا لحديث في أثناء باب من أبوابه، فلم أجده، فلعله سقط من النسخ التي"
