label: { ar: "الموطأ 507 — عائشة تصف صلاة الكسوف: الشمس والقمر آيتان من آيات الله", en: "Muwatta 507" }
text: "إن الشمس والقمر آيتان من آيات الله، لا يخسفان لموت أحد ولا لحياته، فإذا رأيتم ذلك فادعوا الله وكبروا وتصدقوا"
summary:
  ar: "أول حديث في باب العمل في صلاة كسوف الشمس؛ ويبين المحقق أن عنوان «كتاب صلاة الكسوف» في المطبوع لا أصل له في النسخ المعتمدة. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة: خسفت الشمس في عهد النبي فصلى بالناس، فأطال القيام ثم أطال الركوع ثم قام فأطال القيام دون الأول ثم ركع دون الأول ثم سجد، وفعل في الركعة الآخرة مثل ذلك، ثم انصرف وقد تجلت الشمس فخطب فحمد الله وأثنى عليه ثم قال إن الشمس والقمر آيتان من آيات الله لا يخسفان لموت أحد ولا لحياته، وأمر عند رؤية ذلك بالدعاء والتكبير والصدقة، ثم قال: يا أمة محمد، ما من أحد أغير من الله أن يزني عبده أو تزني أمته، ولو تعلمون ما أعلم لضحكتم قليلاً ولبكيتم كثيراً. ويخرّجه المحقق عند البخاري (1044، 5221) ومسلم (3/27) وأبي داود (1191) والنسائي (3/132) وابن حبان وأبي عوانة والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/115). {cite:muwatta-maruf-1997 p.260}"
