label: { ar: "الموطأ 507 — عائشة تصف صلاة الكسوف: الشمس والقمر آيتان من آيات الله", en: "Muwatta 507", es: "Muwatta 507", fr: "Muwatta 507", ur: "موطا 507", tr: "Al-Muwatta 507 — Aişe, güneş tutulması namazını şöyle anlatır: Güneş ve ay, Allah'ın işaretlerinden ikisidir.", id: "Al-Muwatta 507 — Aisyah menjelaskan tentang salat saat gerhana: Matahari dan bulan adalah dua tanda dari antara tanda-tanda Allah" }
text: "إن الشمس والقمر آيتان من آيات الله، لا يخسفان لموت أحد ولا لحياته، فإذا رأيتم ذلك فادعوا الله وكبروا وتصدقوا"
summary:
  ar: "أول حديث في باب العمل في صلاة كسوف الشمس؛ ويبين المحقق أن عنوان «كتاب صلاة الكسوف» في المطبوع لا أصل له في النسخ المعتمدة. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة: خسفت الشمس في عهد النبي فصلى بالناس، فأطال القيام ثم أطال الركوع ثم قام فأطال القيام دون الأول ثم ركع دون الأول ثم سجد، وفعل في الركعة الآخرة مثل ذلك، ثم انصرف وقد تجلت الشمس فخطب فحمد الله وأثنى عليه ثم قال إن الشمس والقمر آيتان من آيات الله لا يخسفان لموت أحد ولا لحياته، وأمر عند رؤية ذلك بالدعاء والتكبير والصدقة، ثم قال: يا أمة محمد، ما من أحد أغير من الله أن يزني عبده أو تزني أمته، ولو تعلمون ما أعلم لضحكتم قليلاً ولبكيتم كثيراً. ويخرّجه المحقق عند البخاري ⁦(1044، 5221)⁩ ومسلم (3/27) وأبي داود (1191) والنسائي (3/132) وابن حبان وأبي عوانة والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/115). {cite:muwatta-maruf-1997 p.260}"
  tr: "Güneş tutulması namazı sırasındaki amellerle ilgili bölümdeki ilk hadis; editör, basılı baskıdaki \"Güneş Tutulması Namazı Kitabı\" başlığının güvenilir el yazmalarında dayanağı olmadığını açıklığa kavuşturmaktadır. Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından, o da Aişe'den rivayet etmiştir: Peygamberimiz zamanında güneş tutulmuştu. Bunun üzerine insanlara namaz kıldırdı. Ayakta durmayı uzattı, sonra rükûyu uzattı, sonra tekrar ayağa kalktı, ama ilkine göre daha kısa bir süre, sonra tekrar rükûya döndü, sonra da secdeye. Son rekatta da aynı şeyi yaptı. Sonra namazı bitirdi ve güneş tekrar ortaya çıktı. Allah'ı övüp yücelten bir hutbe verdi, sonra şöyle dedi: \"Güneş ve ay, Allah'ın işaretlerinden iki işarettir. Hiç kimsenin ölümü veya yaşamı için tutulmazlar.\" Bunu görünce dua, sükûnet ve zekâtı emretti. Sonra şöyle dedi: “Ey Muhammed ümmeti! Allah’ın kulu zina ettiğinde veya cariyesi zina ettiğinde Allah’tan daha kıskanç kimse yoktur. Benim bildiklerimi bilseydiniz, az güler, çok ağlardınız.” Araştırmacı bunu Buhari (1044, 5221), Müslim (3/27), Ebu Davud (1191), Nesai (3/132), İbn Hibban, Ebu Evane, Tahavi ve Beyhaki’de Malik’in sahabelerinin rivayet zincirleri aracılığıyla aktarıyor ve Temhid’e (22/115) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.260}"
  id: "Hadits pertama dalam bab tentang amalan-amalan saat salat gerhana; editor mengklarifikasi bahwa judul “Kitab Salat Gerhana” dalam edisi cetak tidak memiliki dasar dalam manuskrip yang dapat diandalkan. Diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya, dari Aisyah: Matahari mengalami gerhana pada masa Nabi, lalu beliau memimpin salat berjamaah. Beliau memperpanjang berdiri, kemudian memperpanjang rukuk, lalu berdiri lagi, tetapi dengan durasi yang lebih pendek dari yang pertama, kemudian rukuk dengan durasi yang lebih pendek dari yang pertama, lalu sujud. Beliau melakukan hal yang sama pada rakaat terakhir. Kemudian beliau selesai, dan matahari telah muncul kembali. Beliau menyampaikan khutbah, memuji dan mengagungkan Allah, lalu berkata: “Matahari dan bulan adalah dua tanda dari antara tanda-tanda Allah. Keduanya tidak akan gerhana untuk kematian atau kehidupan siapa pun.” Beliau memerintahkan, setelah melihat ini, untuk berdoa, memuji, dan beramal. Kemudian beliau berkata: “Wahai umat Muhammad, tidak ada yang lebih cemburu daripada Allah ketika hamba-Nya berzina atau hamba perempuan-Nya berzina. Sekiranya kalian mengetahui apa yang aku ketahui, kalian akan sedikit tertawa dan banyak menangis.” Peneliti menyertakannya dalam al-Bukhari (1044, 5221), Muslim (3/27), Abu Dawud (1191), al-Nasa'i (3/132), Ibn Hibban, Abu 'Awanah, al-Tahawi, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/115). {cite:muwatta-maruf-1997 p.260}"
