text: "… لا تكون ممن يحرمن مؤبدا أو مؤقتا، وألا تكون زوجة غيره، أو معتدته أو مستبرأته، ماعدا التحريم من حيث العدد. ولمعرفة المحرمات من غيرهن على التفصيل ينظر مصطلح: نكاح. وبهذا الشرط يعلم أنه لا يحل للرجل بملك اليمين عمته أو …"
summary:
