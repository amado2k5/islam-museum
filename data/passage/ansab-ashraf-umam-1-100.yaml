text: "… لأربعين سنة مضت من ملك أنوشروان كسرى بن قباذ بن فيروز بن يَزدجِرد الخشِن بن بهرام بن سابور ذي الأكتاف ملك الفُرس. وكان ملك أنوشَروان سبعا وأربعين سنة وثمانية أشهر. وكان على الحيرة يوم ولد رسول الله وَلِيِ عمروبن المنذر …"
