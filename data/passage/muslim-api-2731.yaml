text: "… بِهَذَا الإِسْنَادِ وَزَادَ فِيهِ بَعْدَ قَوْلِهِ \" مِنْ كُلِّ شَهْرٍ ثَلاَثَةَ أَيَّامٍ \" \" فَإِنَّ لَكَ بِكُلِّ حَسَنَةٍ عَشْرَ أَمْثَالِهَا فَذَلِكَ الدَّهْرُ كُلُّهُ \". وَقَالَ فِي الْحَدِيثِ قُلْتُ وَمَا صَوْمُ نَبِيِّ اللَّهِ دَاوُدَ قَالَ \" نِصْفُ الدَّهْرِ \". وَلَمْ يَذْكُرْ فِي الْحَدِيثِ مِنْ قِرَاءَةِ الْقُرْآنِ شَيْئًا وَلَمْ يَقُلْ \" وَإِنَّ لِزَوْرِكَ عَلَيْكَ حَقًّا \". وَلَكِنْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2731، يذكر عدد الحسنات، ومضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 2731 (The Book of Fasting), that speaks of a stated number of good deeds, the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 2731، جس میں نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
