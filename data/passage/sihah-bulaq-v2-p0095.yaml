text: |-
  ٤٩٢
  - ←⁦(فصل السين)⁩.
  *سفرا)م
  أبو عمرو -غيت النارأ مضاها-خيا مثال لبنت ألبث ابنا يقال اسخ نارك أى اجعل لهنا
  مكانا توقد عليه وأنشد :
  ويرزم أن يرى الميجون يلقى • بسخى النارار زام الفصيل
  والسخامة صور ظلع بصيب البعيراً والفصيل بأن يثب بالحمل الثقبل فتعترض الريح بعن الجاد
  والمكنف يقال سهى البعير بالكسر يسخى محى فهو سخ مثل عم حكاه يعقوب وفلان
  ضى على أصحايه أى يتكاف السخاء وأرض سخاوية امنسة التراب وهى منسوبة ومكان
  -هذاوى والسخخواء الارض السهلة الواسعة والمع السخاوى والسخاوى مثل الصحارى
  والعحارسدا) الدومد السدض والشئ يقال سدن الناقسة تسدروهوتذرعها
  فى المشى واتساع خطوها يقال ما أحسن سدورجليها وأنو يديها ونوق سواد وفلان يسدو
  سدوكذا أى ينحو نحوه وبسر سد مثال عم وبسرة سدية وهى السداة والسداندى الليل
  وهو حياة الزرع قال المسكميت وجعله مثلا للجود
  فأنت الندى فما نو بك والسدا • اذا الحود عدت عقبه القدرمالها
  وسديت الارض اذا كثرنداها من السماء كان أو من الارض فهى سدية على فعلة والسدى
  المعروف من الثوب وهوخلاف اللحمة والسداة منله وهماسديان والهع أسدية تقول منه
  أسديت الثوب وأستيته وأسدى النخرل اذاسدى بسره وقد سدى البسر بالكمر
  اذا استرخت ثفاريقه وهذابلح سد ومنه قول الشاعر• يضت منهنّ السدى والحصل
  ويقال طلبت أمرا فأسديته أى أصيته وان لم تصبه قلت أعمسته والسدى بالضم المهمل
  بقال ابل سدى أى مهملة وبعضهم يقول سدى بالفتح وأسديتها أى أهملتها ونسداه أى
  أعلاه وركبه قال امر والقيس
  فلمادنوت تسديتها • فشوبانسيت وتوباأجز
  والسدور كوب الرأس فى السير والسادى السادس قال الجعدى
  اذ اماعد أر بعة فسال • فزوجك خامس وأبوك سادى
  اراد السادس فأيدل من السيزيا كمافسرناه فى ست را لمروشجر الواحدة سروة
  والسرومثل الخيف والسروعملة حسير والسروسخاء فى مروأة يقال سرايتزووسرى
  بالكسر يسرى سروافيه ماوسرويسروسراوة أى صارسريا وقال
  ورى السرى من الجال بنفسه • وابن السرى اذامرى أمراهما
  وبمع السرة سراة وهو حسع عزيز أن يجمع فعيل على فعلة ولا يعرف غيره وجمع السمراة
  سروات وتسرّى أى تكلف السرو وتسرى الجادية أيضامن السرية وقال يعقوب أصله
  تسررت من السرور فأبدلوا من احدى الراآت ياء كما قالوا نقضى من تقضض والسرى أيضا
  نهر صغير كالجدول والجع أسرية وسريان مثل أجرية وجربان ولم يسمع فيه بأسرياه
  والسمرية قطعة من الجيش يقال خير السرايا أر بعمائة رجل ابن السكيت سروت التوب
  عن سروا اذا ألقيته عنك قال ابن هرمة
  سرى ثوبه عنك الصبا المتخابل• وآذت بالبين الخليط المزايل
