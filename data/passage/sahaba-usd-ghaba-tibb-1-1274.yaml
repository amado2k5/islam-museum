  tr: "İbn al-Athir'in \"Asad al-Ghaba\" adlı eserinin resimli 1. cildinin 1274. sayfasından, büyü, ilaç ve tedaviye dair bir pasaj; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari kitab “Asad al-Ghaba” karya Ibn al-Athir, jilid 1 bergambar, hlm. 1274, yang menyebutkan mantra, obat-obatan, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
