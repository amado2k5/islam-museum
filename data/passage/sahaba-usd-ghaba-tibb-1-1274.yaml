text: "… ورواه أبو نُعَيم بإسناده عن ابن وهب، عن يونس وعمرو بن الحارث كلاهما، عن ابن شهاب، عن أبي خزامة - أحد بني الحارث بن سعد - أن أباه قال للنبي ملاع : أرأيت دواءً نتداوى به، ورُقىَ نسترقي بها، وتقى …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1274، يذكر الرقية، والدواء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1274, that mentions ruqya recited over the sick, the drug, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1274 کا اقتباس جس میں رقیہ، دوا، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
