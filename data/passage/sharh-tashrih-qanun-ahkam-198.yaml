text: "إليه من بدن الأم فلذلك وجوب تقدم الكبد في التكون ليس بلازم ولا أيضاً وجوب تقدمها على ما سوى القلب فإن السرة تكون قبلها وكذلك الدماغ لأن حاجة الجنين إلى الكبد لا لأجل إصلاح الدم الآتي إليه من الدم وإن …"
summary:
  ar: "مقطع من شرح تشريح القانون لابن النفيس، ص 198، يرد فيه ذكر الوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 198, whose wording mentions obligation (wujub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح تشریح القانون، ابن النفیس، ص 198 کا اقتباس جس میں وجوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Commentary on the Anatomy de the Canon de Ibn al-Nafis, p. 198, dont le texte mentionne l'obligation (wujub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Commentary on the Anatomy de the Canon de Ibn al-Nafis, p. 198, cuyo texto menciona la obligatoriedad (wujub); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Nafis'in Hukukun Anatomisi üzerine tefsirinden, 198. sayfada, yükümlülük kavramından bahsediliyor; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Bu metin, farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari komentar Ibn al-Nafis tentang anatomi hukum, halaman 198, menyebutkan konsep kewajiban; ini berasal dari versi pindaian yang dapat dibaca mesin. Teks tersebut merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
