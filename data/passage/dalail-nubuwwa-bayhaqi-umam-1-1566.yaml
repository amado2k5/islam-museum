text: "… يزيد بن زياد، عن محمد بن كعب القرطي، وعثمان بن يهوذا، أحد بني عمرو بن قريظة، عن رجال من قومه، قالوا : كان الذين حزَّبوا الأحزاب نفراً من بني وائل، وكان من بني النضير حُيّيُّ بن أخطب وكِنَّانة بن الربيع …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 1566، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
