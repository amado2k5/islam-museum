text: "… لِذَلِكَ - فَقَالَ عُمَرُ اتَّئِدَا أَنْشُدُكُمْ بِاللَّهِ الَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ أَتَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \". قَالُوا نَعَمْ. ثُمَّ أَقْبَلَ عَلَى الْعَبَّاسِ وَعَلِيٍّ فَقَالَ أَنْشُدُكُمَا بِاللَّهِ الَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ أَتَعْلَمَانِ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَاهُ صَدَقَةٌ \". قَالاَ نَعَمْ. فَقَالَ عُمَرُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4577، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4577 (The Book of Jihad and Expeditions), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 4577، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4577 (El Libro de la Yihad y las Expediciones), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 4577 (Livre du Jihad et des Expéditions), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih Müslim'de 4577 numaralı hadis, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi vermektedir. Bu derleme, vasiyetnameler, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4577, menyebutkan apa yang ditinggalkan beliau berupa harta warisan. Informasi ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, relik, dan makam suci, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
