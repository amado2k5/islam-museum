label: { ar: "الموطأ 1719 — ثابت بن الأحنف: تزوج أم ولد لعبد الرحمن بن زيد بن الخطاب، فدعاه عبد الله بن عبد الرحمن، فرأى السياط والقيدين، فأمره بطلاقها، ثم خرج يسأل ابن عمر وابن الزبير، فلم يعدا ذلك طلاقا", en: "Muwatta 1719" }
summary:
  ar: "يروي مالك عن ثابت بن الأحنف أنه تزوج أم ولد لعبد الرحمن بن زيد بن الخطاب، قال فدعاني عبد الله بن عبد الرحمن بن زيد بن الخطاب، فجئته فدخلت عليه، فإذا سياط موضوعة، وإذا قيدان من حديد، وعبدان له قد أجلسهما. فقال طلقها وإلا والذي يحلف به فعلت بك كذا وكذا. قال فقلت هي الطلاق ألفا. قال فخرجت من عنده، فأدركت عبد الله بن عمر بطريق مكة، فأخبرته، فتغيظ وقال ليس ذلك بطلاق، وإنها لم تحرم عليك، فارجع إلى أهلك. فلم تقررني نفسي حتى أتيت عبد الله بن الزبير وهو أمير مكة، فأخبرته، فقال لم تحرم عليك، فارجع إلى أهلك، وكتب إلى جابر بن الأسود الزهري أمير المدينة يأمره أن يعاقب عبد الله بن عبد الرحمن، وأن يخلي بيني وبين أهلي. {cite:muwatta-maruf-1997 p.101}"
