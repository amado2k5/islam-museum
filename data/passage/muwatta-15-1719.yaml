label: { ar: "الموطأ 1719 — ثابت بن الأحنف: تزوج أم ولد لعبد الرحمن بن زيد بن الخطاب، فدعاه عبد الله بن عبد الرحمن، فرأى السياط والقيدين، فأمره بطلاقها، ثم خرج يسأل ابن عمر وابن الزبير، فلم يعدا ذلك طلاقا", en: "Muwatta 1719", es: "Muwatta 1719", fr: "Muwatta 1719", ur: "موطا 1719", tr: "El-Muvatta 1719 — Sabit ibn el-Ahnaf: Abdülrahman ibn Zeyd ibn el-Hattab'ın bir cariyesiyle evlendi. Abdullah ibn Abdülrahman onu çağırdı ve kırbaçları ve zincirleri görünce ondan boşanmasını emretti. Sonra İbn Ömer ve İbn el-Zübeyr'e sormaya gitti, ancak onlar bunu boşanma olarak kabul etmediler.", id: "Al-Muwatta 1719 — Thabit ibn al-Ahnaf: Ia menikahi selir Abd al-Rahman ibn Zayd ibn al-Khattab. Abdullah ibn Abd al-Rahman memanggilnya, dan ia melihat cambuk dan belenggu, lalu ia memerintahkannya untuk menceraikannya. Kemudian ia pergi menemui Ibn Umar dan Ibn al-Zubayr, tetapi mereka tidak menganggap itu sebagai perceraian." }
summary:
  ar: "يروي مالك عن ثابت بن الأحنف أنه تزوج أم ولد لعبد الرحمن بن زيد بن الخطاب، قال فدعاني عبد الله بن عبد الرحمن بن زيد بن الخطاب، فجئته فدخلت عليه، فإذا سياط موضوعة، وإذا قيدان من حديد، وعبدان له قد أجلسهما. فقال طلقها وإلا والذي يحلف به فعلت بك كذا وكذا. قال فقلت هي الطلاق ألفا. قال فخرجت من عنده، فأدركت عبد الله بن عمر بطريق مكة، فأخبرته، فتغيظ وقال ليس ذلك بطلاق، وإنها لم تحرم عليك، فارجع إلى أهلك. فلم تقررني نفسي حتى أتيت عبد الله بن الزبير وهو أمير مكة، فأخبرته، فقال لم تحرم عليك، فارجع إلى أهلك، وكتب إلى جابر بن الأسود الزهري أمير المدينة يأمره أن يعاقب عبد الله بن عبد الرحمن، وأن يخلي بيني وبين أهلي. {cite:muwatta-maruf-1997 p.101}"
  tr: "Malik, Sabit ibn el-Ahnaf'tan rivayetle, Abd el-Rahman ibn Zeyd ibn el-Hattab'ın cariyelerinden biriyle evlendiğini nakletmiştir. Şöyle dedi: “Abdullah ibn Abdülrahman ibn Zeyd ibn el-Hattab beni çağırdı, ben de yanına gidip içeri girdim. Önünde kırbaçlar, iki demir pranga ve iki kölesi oturuyordu. Bana, ‘Onu boşa, yoksa yemin ettiğin Allah adına sana şunu şunu yapacağım’ dedi. Ben de, ‘Bin kere boşanma üzerine yemin ederim’ dedim. Onu bırakıp Mekke yolunda Abdullah ibn Ömer'e yetiştim ve olanları anlattım. Öfkelendi ve ‘Bu boşanma değil, o sana haram değil. Ailene geri dön’ dedi. Mekke valisi Abdullah ibn el-Zübeyr'e gidip olanları anlatana kadar huzur bulamadım. O da, ‘O sana haram değil. Ailene geri dön’ dedi. Medine valisi Cabir ibn el-Esved el-Zühri'ye mektup yazarak Abdullah ibn Abdülrahman'ı cezalandırmasını ve beni aileme göndermesini emretti.”"
  id: "Malik meriwayatkan dari Thabit ibn al-Ahnaf bahwa ia menikahi seorang selir dari Abd al-Rahman ibn Zayd ibn al-Khattab. Dia berkata, “Abdullah ibn Abd al-Rahman ibn Zayd ibn al-Khattab memanggilku, lalu aku pergi kepadanya dan masuk. Di hadapannya ada cambuk, dua belenggu besi, dan dua budaknya duduk di sana. Dia berkata, ‘Ceraikan dia, atau demi Zat yang kau sumpahi, aku akan melakukan ini dan itu kepadamu.’ Aku berkata, ‘Aku bersumpah dengan seribu ceraikan.’ Aku meninggalkannya dan menyusul Abdullah ibn Umar di jalan menuju Mekah dan menceritakan apa yang telah terjadi. Dia menjadi marah dan berkata, ‘Itu bukan perceraian, dan dia tidak haram bagimu. Kembalilah kepada keluargamu.’ Aku tidak tenang sampai aku pergi kepada Abdullah ibn al-Zubayr, yang merupakan gubernur Mekah, dan menceritakan apa yang telah terjadi. Dia berkata, ‘Dia tidak haram bagimu. Kembalilah kepada keluargamu.’ Dia menulis surat kepada Jabir ibn al-Aswad al-Zuhri, gubernur Madinah, memerintahkannya untuk menghukumnya. Abdullah ibn Abd al-Rahman dan mengizinkan saya pergi menemui keluarga saya.”"
