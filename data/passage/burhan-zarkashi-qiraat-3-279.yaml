text: "… كانت مستقلَّة فهى فى حيّز الصلة للعطف، فلم يقع فصل، ويؤيد ما ذكره صاحب الكشاف أنّ بعضَ القراء بسكت عند قوله: عِوَجاً ويفصل بينه وبين قيًا بسكتة لطيفة، وهى رواية حفص عن عاصم، وذلك يحتمل أن يكون لما ذكرنا من …"
summary:
