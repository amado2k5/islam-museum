text: "… والله ما ابو سعيد حين مات رسول اللّٰه الاعلام ولقد جئت انت من جبال دوس قبل وفاة رسول اللّه بيسير فاتق اللّه يا ابا هريرة فقال له نعم ما اوصيت به وسكت عنه ثم دفن عند قبر امه فاطمة. قال …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 2، ص 231، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 2, p. 231, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 2، ص 231 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 2, pág. 231, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh Dimashq d'Ibn 'Asakir, volume 2, page 231, mentionnant un testament ou des adieux, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments Browser."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 2, sayfa 231'den bir alıntı, vasiyetname veya son vasiyet, ölüm ve vefat zamanı, defin, mezar ve türbeden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 2 Bergambar, halaman 231, menyebutkan surat wasiat atau testamen terakhir, waktu kematian dan wafat, penguburan, kuburan, dan makam; dari edisi faksimili yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti surat wasiat, warisan, barang antik, dan makam."
