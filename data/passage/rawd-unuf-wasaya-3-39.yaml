text: "… وتركهم بالحرَّةِ. ابن عبد اللّٰه : وسمى طلحة الطلحات بسبب أمه، وهى صفية بنت الحارث. ابن طلحة بن أبى طلحة وزاد الأزهرى ابن عبد مناف وأخوها : طلحة ابن الحارث فقد تكنفه هؤلاء الطلحات كما ترى، وقبره بسجستان، وفيه يقول. …"
summary:
