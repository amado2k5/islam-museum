label: { ar: "صحيح مسلم 1080 — الأب والأبوة", en: "Sahih Muslim 1080 — the father and fatherhood", ur: "صحیح مسلم 1080 — باپ اور والدیت" }
text: "… بْنُ السَّرِيِّ، حَدَّثَنَا عَبْدَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، كُلُّ هَؤُلاَءِ عَنْ إِبْرَاهِيمَ بْنِ عَبْدِ اللَّهِ بْنِ حُنَيْنٍ، عَنْ أَبِيهِ، عَنْ عَلِيٍّ، - إِلاَّ الضَّحَّاكَ وَابْنَ عَجْلاَنَ فَإِنَّهُمَا زَادَا عَنِ ابْنِ عَبَّاسٍ، عَنْ عَلِيٍّ، - عَنِ النَّبِيِّ كُلُّهُمْ قَالُوا نَهَانِي عَنْ قِرَاءَةِ الْقُرْآنِ وَأَنَا رَاكِعٌ وَلَمْ يَذْكُرُوا فِي رِوَايَتِهِمُ النَّهْىَ عَنْهَا فِي السُّجُودِ كَمَا ذَكَرَ الزُّهْرِيُّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1080، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1080 (The Book of Prayers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 1080، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
