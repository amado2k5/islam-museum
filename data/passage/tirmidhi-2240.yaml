label:
  ar: "الترمذي 2240 — أوحى الله إلى عيسى: حرز عبادي إلى الطور"
  en: "Tirmidhi 2240 — God revealed to Isa: take My servants to safety on the Mount"
  ur: "ترمذی 2240 — اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ"
text: "ما شأنكم . قال قلنا يا رسول الله ذكرت الدجال الغداة فخفضت فيه ورفعت حتى ظنناه في طائفة النخل . قال غير الدجال أخوف لي عليكم إن يخرج وأنا فيكم فأنا حجيجه دونكم وإن يخرج ولست فيكم فامرؤ حجيج نفسه …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 2240: أوحى الله إلى عيسى: حرز عبادي إلى الطور. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 2240: God revealed to Isa: take My servants to safety on the Mount. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 2240: اللہ نے عیسیٰ کی طرف وحی کی: میرے بندوں کو طور کی پناہ میں لے جاؤ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
