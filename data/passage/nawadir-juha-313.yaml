label: { ar: "نوادر جحا الكبرى، ص 154 — «ترحيب بلدنا بعد الشراب»", en: "Nawadir Juha al-Kubra, p. 154 — 'Our Town Says Welcome After the Drink'", ur: "نوادر جحا الکبریٰ، ص 154 — «ہمارے شہر میں شربت کے بعد خوش آمدید کہا جاتا ہے»", fr: "Nawadir Juha al-Kubra, p. 154 — « Dans notre ville, on dit bienvenue après la boisson »", es: "Nawadir Juha al-Kubra, p. 154 — «En nuestra ciudad se dice bienvenido después de la bebida»" }
text: "… ترحيب بلدنا بعد الشراب عندما حضر تيمور لنك إلى مدينة آقَ شَهْرٌ أوجس علماؤُها وأهلُها خِيفةً من ظلمِهِ، ولما دعاهم إليه كان الشيخ في جملتِهِم طبعاً، فأخذ تيمور لنك يُحادِثُ الوجوة إيناساً لهم، وأمر لهم بمرطبات، وشرب تيمور، وكان حاكم …"
summary:
  ar: "حين جاء تيمور لنك إلى آق شهر قال الحاكم خوفاً «مرحباً» بدل «هنيئاً» بعد الشراب، فقال جحا إن أهل بلدتهم يقولون مرحباً بعد الشربات. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  en: "When Timur comes to Akshehir, the governor, in fear, says 'welcome' instead of 'to your health' after a drink; Juha says that in their town welcome is said after the sherbet. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  ur: "جب تیمور لنگ آق شہر آیا تو حاکم نے خوف کے مارے شربت کے بعد «نوش جان» کہنے کی بجائے «خوش آمدید» کہہ دیا، تو جحا نے کہا کہ ان کے شہر میں شربت کے بعد خوش آمدید کہا جاتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  fr: "Lorsque Timur arrive à Akshehir, le gouverneur, effrayé, dit « bienvenue » au lieu de « à votre santé » après une boisson ; Juha dit que dans leur ville on dit bienvenue après le sorbet. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
  es: "Cuando Timur llega a Akshehir, el gobernador, asustado, dice «bienvenido» en lugar de «que le aproveche» tras una bebida; Juha dice que en su ciudad se dice bienvenido después del sorbete. {cite:juha-nawadir-kubra-djuwaydi p. 154}"
