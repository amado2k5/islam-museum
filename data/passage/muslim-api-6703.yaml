label: { ar: "صحيح مسلم 6703 — الأب والأبوة", en: "Sahih Muslim 6703 — the father and fatherhood", ur: "صحیح مسلم 6703 — باپ اور والدیت" }
text: "… عَنْ أَبِي زُرْعَةَ بْنِ عَمْرِو بْنِ جَرِيرٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ أَتَتِ امْرَأَةٌ النَّبِيَّ بِصَبِيٍّ لَهَا فَقَالَتْ يَا نَبِيَّ اللَّهِ ادْعُ اللَّهَ لَهُ فَلَقَدْ دَفَنْتُ ثَلاَثَةً قَالَ \" دَفَنْتِ ثَلاَثَةً \". قَالَتْ نَعَمْ. قَالَ \" لَقَدِ احْتَظَرْتِ بِحِظَارٍ شَدِيدٍ مِنَ النَّارِ \". قَالَ عُمَرُ مِنْ بَيْنِهِمْ عَنْ جَدِّهِ. وَقَالَ الْبَاقُونَ عَنْ طَلْقٍ. وَلَمْ يَذْكُرُوا الْجَدَّ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6703، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6703 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6703، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
