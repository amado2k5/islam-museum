label:
  ar: "الترمذي 3600 — ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم"
  en: "Tirmidhi 3600 — Angels seek the gatherings of remembrance"
  ur: "ترمذی 3600 — فرشتے ذکر کی مجلسیں تلاش کرتے ہیں"
text: "إن لله ملائكة سياحين في الأرض فضلا عن كتاب الناس فإذا وجدوا أقواما يذكرون الله تنادوا هلموا إلى بغيتكم فيجيئون فيحفون بهم إلى سماء الدنيا فيقول الله على أى شيء تركتم عبادي يصنعون فيقولون تركناهم يحمدونك ويمجدونك ويذكرونك . قال …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 3600: ملائكة يلتمسون أهل الذكر: هم القوم لا يشقى بهم جليسهم. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 3600: Angels seek the gatherings of remembrance. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 3600: فرشتے ذکر کی مجلسیں تلاش کرتے ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
