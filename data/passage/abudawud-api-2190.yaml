label: { ar: "سنن أبي داود 2190 — الأب والأبوة", en: "Sunan Abi Dawud 2190 — the father and fatherhood", ur: "سنن ابی داؤد 2190 — باپ اور والدیت", es: "Sunan Abi Dawud 2190 — El padre y la paternidad", fr: "Sunan Abi Dawud 2190 — le père et la paternité" }
text: "… حَدَّثَنَا هِشَامٌ، ح وَحَدَّثَنَا ابْنُ الصَّبَّاحِ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ الصَّمَدِ، قَالاَ حَدَّثَنَا مَطَرٌ الْوَرَّاقُ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ النَّبِيَّ قَالَ \" لاَ طَلاَقَ إِلاَّ فِيمَا تَمْلِكُ وَلاَ عِتْقَ إِلاَّ فِيمَا تَمْلِكُ وَلاَ بَيْعَ إِلاَّ فِيمَا تَمْلِكُ \". زَادَ ابْنُ الصَّبَّاحِ \" وَلاَ وَفَاءَ نَذْرٍ إِلاَّ فِيمَا تَمْلِكُ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2190، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2190 (Divorce (Kitab Al-Talaq)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2190، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2190 (Divorcio (Kitab Al-Talaq)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2190 (Le Divorce (Kitab Al-Talaq)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
