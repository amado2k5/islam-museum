  en: "Riyad al-Salihin 1527 — Do not envy, outbid, hate or shun one another"
text: "لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا، وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا. الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ، وَلَا يَخْذُلُهُ، وَلَا يَحْقِرُهُ». «التَّقْوَى هَا هُنَا»، وَيُشِيرُ إِلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ. «بِحَسْبِ امْرِئٍ مِنَ الشَّرِّ أَنْ…"
summary:
