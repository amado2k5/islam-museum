summary:
  ar: "القسم 20 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الحدود»، ويضم فيها النصوص من 2533 إلى 2614 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 20 of Sunan Ibn Majah (The Chapters on Legal Punishments) in the division of the open hadith dataset the museum took its reports from: reports 2533 to 2614 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 20، عنوان «کتاب الحدود»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2533 تا 2614۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 20 de Sunan Ibn Majah (Los capítulos sobre castigos legales) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2533 al 2614, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 20 du Sunan Ibn Majah (Chapitres relatifs aux peines légales), à partir duquel il a effectué sa collecte: les hadiths 2533 à 2614 de la numérotation de ce recueil. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan İbn Majah'ın 20. bölümü \"Sınırlar Kitabı\" başlığını taşımakta olup, 2533 ile 2614 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 20 dari Sunan Ibn Majah, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Batasan\" dan berisi teks 2533 hingga 2614, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
