summary:
  ar: "القسم 59 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب بدء الخلق»، ويضم فيها النصوص من 3190 إلى 3325 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 59 of Sahih al-Bukhari (Beginning of Creation) in the division of the open hadith dataset the museum took its reports from: reports 3190 to 3325 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 59، عنوان «کتاب بدء الخلق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3190 تا 3325۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 59 de Sahih al-Bukhari (El comienzo de la creación) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3190 al 3325 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
