label: { ar: "سنن النسائي 4128 — الأب والأبوة", en: "Sunan al-Nasa'i 4128 — the father and fatherhood", ur: "سنن نسائی 4128 — باپ اور والدیت", es: "Sunan al-Nasa'i 4128 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4128 — Le père et la paternité" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، قَالَ حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ مُسْلِمٍ، عَنْ مَسْرُوقٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ أُلْفِيَنَّكُمْ تَرْجِعُونَ بَعْدِي كُفَّارًا يَضْرِبُ بَعْضُكُمْ رِقَابَ بَعْضٍ لاَ يُؤْخَذُ الرَّجُلُ بِجَرِيرَةِ أَبِيهِ وَلاَ بِجَرِيرَةِ أَخِيهِ \". هَذَا الصَّوَابُ."
summary:
  ar: "حديث في سنن النسائي، رقم 4128، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4128 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4128، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4128 (El Libro de la Lucha [La Prohibición del Derramamiento de Sangre]), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4128 (Le Livre du Combat [L'Interdiction du Sang]), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
