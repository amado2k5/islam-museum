text: "… على تأسيس بيت صالح من بيوت الأمة. زواج التحليل وهو أن يتزوج المطلّقة ثلاثًا بعد انقضاء عدتها، أو يدخل بها ثم يطلقها ليحلها للزواج الأول. حكمه : وهذا النوع من الزواج كبيرة من كبائر الاثم والفواحش حرَّمه اللّٰه ولعن فاعله. …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 138، يذكر ما أُحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 138, that mentions what was made lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 138 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
