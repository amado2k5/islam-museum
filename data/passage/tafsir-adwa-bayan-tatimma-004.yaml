text: "ه الآية الكريمة إيضاح لهذه الفتنة وتخفيف لشأنها أنزله الله في كتابه قبل وقوعها بأزمان كثيرة، فسبحان الحكيم الخبير ما أعلمه، وما أعظمه، وما أحسن تعليمه . فقد أوضع جل وعلا في هذه الآية الكريمة أن أكثر الناس لا يعلمون،"
