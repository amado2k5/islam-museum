text: "وجنده . •• (ويسر لى أمري) وسهل على ما أمرتنى به من تبليغ الرسالة إلى فرعون، واشرح لى صدرى آكد من اشرح صدرى؛ لأنه تكرير للمعنى الواحد من طريقى الإجمال والتفصيل، لأنه يقول: اشرح لى ويسر لى، علم أن ثمة"
