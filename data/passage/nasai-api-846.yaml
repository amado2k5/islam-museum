label: { ar: "سنن النسائي 846 — الأب والأبوة", en: "Sunan al-Nasa'i 846 — the father and fatherhood", ur: "سنن نسائی 846 — باپ اور والدیت", es: "Sunan al-Nasa'i 846 — El padre y la paternidad", fr: "Sunan al-Nasa'i 846 — le père et la paternité", tr: "Sunan an-Nasa'i 846 — Baba ve Babalık", id: "Sunan an-Nasa'i 846 — Sang Ayah dan Peran Ayah" }
text: "… حَدَّثَنَا أَبُو زُبَيْدٍ، - وَاسْمُهُ عَبْثَرُ بْنُ الْقَاسِمِ - عَنْ حُصَيْنٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، عَنْ أَبِيهِ، قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ إِذْ قَالَ بَعْضُ الْقَوْمِ لَوْ عَرَّسْتَ بِنَا يَا رَسُولَ اللَّهِ. قَالَ \" إِنِّي أَخَافُ أَنْ تَنَامُوا عَنِ الصَّلاَةِ \". قَالَ بِلاَلٌ أَنَا أَحْفَظُكُمْ. فَاضْطَجَعُوا فَنَامُوا وَأَسْنَدَ بِلاَلٌ ظَهْرَهُ إِلَى رَاحِلَتِهِ فَاسْتَيْقَظَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 846، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 846 (The Book of Leading the Prayer (Al-Imamah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 846، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 846 (El Libro de la Oración (Al-Imamah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 846 (Le Livre de la prière (Al-Imamah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 846 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, İslam'da babalık konusuna dair bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 846, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
