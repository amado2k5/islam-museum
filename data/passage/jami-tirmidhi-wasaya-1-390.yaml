text: "… بْنُ أَبِي وقَّاصٍ، ثُمَّ جاءَ عَلِيٌّ والعَبَّاسُ يَخْتَصِمَانِ، فَقَالَ عُمَرُ لَهُمْ : أَنْشُدُكُمْ باللهِ الَّذي بِإِذْنِهِ تَقُومُ السَّمَاءُ والْأَرْضُ أَتَعْلَمُونَ أَنَّ رَسُولَ اللهِ وَلِعِ قَالَ: لَا نُورَثُ، مَا تَرَكْنَا صَدَقَةٌ ؟ قَالُوا : نَعَمْ، قَالَ عُمَرُ: فَلِمَّا تُوُفِّيَ رَسُولُ اللهِ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 390، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 390, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
