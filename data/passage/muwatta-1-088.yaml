label: { ar: "الموطأ 88 — ابن عمر إذا رعف توضأ ثم بنى على صلاته", en: "Muwatta 88" }
summary:
  ar: "أول أثر في باب ما جاء في الرعاف. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان إذا رعف في الصلاة انصرف فتوضأ ثم رجع فبنى على ما صلى ولم يتكلم. وينقل المحقق عن البيهقي قول الشافعي إن ابن عمر وابن المسيب لم يكونا يريان في الدم وضوءاً، وإنما المراد بوضوئهما غسل الدم وما أصاب من الجسد لا وضوء الصلاة، وأن العرب تسمي غسل بعض الأعضاء وضوءاً (السنن 1/143). {cite:muwatta-maruf-1997 p.80}"
