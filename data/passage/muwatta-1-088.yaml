label: { ar: "الموطأ 88 — ابن عمر إذا رعف توضأ ثم بنى على صلاته", en: "Muwatta 88", es: "Muwatta 88", fr: "Muwatta 88", ur: "موطا 88", tr: "El-Muvatta 88 — İbn Ömer, eğer burnu kanarsa, abdest alıp sonra namazına devam etmelidir.", id: "Al-Muwatta 88 — Ibnu Umar, jika ia mimisan, hendaknya berwudhu lalu melanjutkan salatnya." }
summary:
  ar: "أول أثر في باب ما جاء في الرعاف. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر كان إذا رعف في الصلاة انصرف فتوضأ ثم رجع فبنى على ما صلى ولم يتكلم. وينقل المحقق عن البيهقي قول الشافعي إن ابن عمر وابن المسيب لم يكونا يريان في الدم وضوءاً، وإنما المراد بوضوئهما غسل الدم وما أصاب من الجسد لا وضوء الصلاة، وأن العرب تسمي غسل بعض الأعضاء وضوءاً ⁦(السنن 1/143)⁩. {cite:muwatta-maruf-1997 p.80}"
  tr: "Burun kanamaları hakkında rivayet edilenler bölümündeki ilk rivayette Yahya, Malik'ten, o da Nafi'den naklettiğine göre, Abdullah ibn Umar namaz sırasında burun kanaması geçirdiğinde namazdan ayrılır, abdest alır, sonra geri döner ve konuşmadan namazına devam ederdi. Araştırmacı, el-Beyhaki'nin, el-Şafiî'nin İbn Umar ve İbn el-Musayyab'ın kanın abdesti gerektirdiğini düşünmediklerini, aksine abdestten kastının kanı ve vücudun hangi kısımlarına değmişse onu temizlemek olduğunu, namaz için abdest almak olmadığını söylediğini aktarıyor. Arapların ise vücudun bazı kısımlarını yıkamayı abdest olarak adlandırdığını ekliyor (Sunan 1/143). {cite:muwatta-maruf-1997 s.80}"
  id: "Riwayat pertama dalam bab ini membahas tentang apa yang telah dilaporkan mengenai mimisan. Yahya meriwayatkannya dari Malik, dari Nafi’, bahwa Abdullah ibn Umar, ketika mimisan saat shalat, akan pergi, berwudhu, kemudian kembali dan melanjutkan shalatnya tanpa berbicara. Peneliti mengutip al-Bayhaqi yang mengatakan bahwa al-Shafi’i berkata bahwa Ibn Umar dan Ibn al-Musayyab tidak menganggap darah sebagai syarat untuk berwudhu; melainkan, yang mereka maksud dengan berwudhu adalah membersihkan darah dan apa pun yang telah disentuhnya pada tubuh, bukan berwudhu untuk shalat. Orang Arab, tambahnya, menyebut membersihkan beberapa bagian tubuh sebagai berwudhu (Sunan 1/143). {cite:muwatta-maruf-1997 p.80}"
