text: "… موجود في مذهب المالكية، وفي غيرها من مذاهب الأئمة الأربعة أيضًا. قال الخرشي: ص وجبِر أبٌ ووصي وحاكم - مجنونًا احتاج وصغيرًا، وفي السفيه خلاف ش يعني: أن كلًّا من الأب ووصيه، وإن سفلِ والحاكم يجبر المجنون إذا احتاج للنكاح …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 62، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
