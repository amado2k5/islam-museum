text: "واختلفوا في أقسامه فذكرَ ابنُ الأنباريّ في بعض تصانيفه أنها ثمانية،. وقَسَّم الزَّمَخْشريّ في القسطاس إلى اثني عَشَر قسمًا كما أوردَهُ العلامة الجُرْجاني في شَرْح المفتاح وذكر القاضي زكريا في حاشية البَيْضاويّ أنها أربعة عَشَر وعَدَّ منها علم القراءات، قال: …"
