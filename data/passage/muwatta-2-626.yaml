label: { ar: "الموطأ 626 — علي: كان النبي يقوم في الجنائز ثم جلس بعد", en: "Muwatta 626" }
text: "كان يقوم في الجنائز، ثم جلس بعد"
summary:
  ar: "أول حديث في باب الوقوف للجنائز والجلوس على المقابر. يرويه مالك عن يحيى بن سعيد عن واقد بن سعد بن معاذ عن نافع بن جبير بن مطعم عن مسعود بن الحكم عن علي بن أبي طالب، أن النبي كان يقوم في الجنائز ثم جلس بعد. ويذكر المحقق أن رواية يحيى «واقد بن سعد بن معاذ» وتابعه أبو مصعب، وأن سائر الرواة يقولون «واقد بن عمرو بن سعد بن معاذ» وهو الصواب كما قال ابن عبد البر (التمهيد 23/260)، وهو الأشهلي الأنصاري المتوفى سنة 120، وأن الحديث رواه عن مالك أبو مصعب ومن طريقه ابن حبان (3054) والبغوي، والقعنبي عند أبي داود (3175)، وابن وهب عند الطحاوي، والشافعي في المسند ومن طريقه الحازمي في الناسخ والمنسوخ والبيهقي (4/27)، ومحمد بن الحسن الشيباني (310). {cite:muwatta-maruf-1997 p.318} {cite:muwatta-maruf-1997 p.319}"
