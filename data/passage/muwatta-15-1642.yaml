label: { ar: "الموطأ 1642 — سهل بن سعد الساعدي عن ابن شهاب: جاء عويمر العجلاني إلى عاصم بن عدي يسأل عن رجل يجد مع امرأته رجلا، فسأل عاصم النبي فكره المسائل، ثم تلاعنا", en: "Muwatta 1642" }
text: "قَدْ أُنزلَ فِيكَ وَفي صَاحِبَتكَ. فَاذْهَبْ فَأْتِ بِها"
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أن سهل بن سعد الساعدي أخبره أن عويمرا العجلاني جاء إلى عاصم بن عدي الأنصاري فقال له يا عاصم، أرأيت رجلا وجد مع امرأته رجلا، أيقتله فتقتلونه؟ أم كيف يفعل؟ سل لي يا عاصم عن ذلك رسول الله، فسأل عاصم رسول الله، فكره الرسول المسائل وعابها، حتى كبر على عاصم ما سمع. فلما رجع عاصم إلى أهله جاءه عويمر فسأله، فقال لم تأتني بخير، قد كره رسول الله المسألة التي سألته عنها. فأقبل عويمر حتى أتى رسول الله وسط الناس، فسأله، فقال قد أنزل فيك وفي صاحبتك، فاذهب فأت بها. فتلاعنا وسهل مع الناس عند رسول الله، فلما فرغا قال عويمر كذبت عليها يا رسول الله إن أمسكتها، فطلقها ثلاثا قبل أن يأمره رسول الله. قال ابن شهاب فكانت تلك بعد سنة المتلاعنين. {cite:muwatta-maruf-1997 p.76}"
