label: { ar: "الموطأ 1642 — سهل بن سعد الساعدي عن ابن شهاب: جاء عويمر العجلاني إلى عاصم بن عدي يسأل عن رجل يجد مع امرأته رجلا، فسأل عاصم النبي فكره المسائل، ثم تلاعنا", en: "Muwatta 1642", es: "Muwatta 1642", fr: "Muwatta 1642", ur: "موطا 1642", id: "Al-Muwatta 1642 — Sahl ibn Sa`d al-Sa`idi, berdasarkan riwayat Ibn Shihab: `Uwaymir al-`Ajlani datang kepada `Asim ibn `Adi menanyakan tentang seorang pria yang mendapati pria lain bersama istrinya. `Asim bertanya kepada Nabi (shalawat dan salam kepadanya), tetapi beliau tidak menyukai pertanyaan seperti itu, lalu mereka saling mengutuk." }
text: "قَدْ أُنزلَ فِيكَ وَفي صَاحِبَتكَ. فَاذْهَبْ فَأْتِ بِها"
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أن سهل بن سعد الساعدي أخبره أن عويمرا العجلاني جاء إلى عاصم بن عدي الأنصاري فقال له يا عاصم، أرأيت رجلا وجد مع امرأته رجلا، أيقتله فتقتلونه؟ أم كيف يفعل؟ سل لي يا عاصم عن ذلك رسول الله، فسأل عاصم رسول الله، فكره الرسول المسائل وعابها، حتى كبر على عاصم ما سمع. فلما رجع عاصم إلى أهله جاءه عويمر فسأله، فقال لم تأتني بخير، قد كره رسول الله المسألة التي سألته عنها. فأقبل عويمر حتى أتى رسول الله وسط الناس، فسأله، فقال قد أنزل فيك وفي صاحبتك، فاذهب فأت بها. فتلاعنا وسهل مع الناس عند رسول الله، فلما فرغا قال عويمر كذبت عليها يا رسول الله إن أمسكتها، فطلقها ثلاثا قبل أن يأمره رسول الله. قال ابن شهاب فكانت تلك بعد سنة المتلاعنين. {cite:muwatta-maruf-1997 p.76}"
  tr: "Yahya, Malik'ten, o da İbn Şihab'dan rivayet ettiğine göre, Sahl ibn Sa'd el-Sa'idi ona şöyle anlattı: Uveymir el-Ajlani, Asim ibn Adi el-Ensari'ye gelip şöyle dedi: \"Ey Asim, bir adam karısıyla başka bir adamı yakalarsa ne yapmalıdır? Onu öldürmeli, sonra sen mi öldürmelisin? Yoksa ne yapmalıdır? Bunu benim için Allah'ın Resulü'ne sor, ey Asim.\" Bunun üzerine Asim, Allah'ın Resulü'ne sordu, ancak Resul bu soruyu beğenmedi ve eleştirdi; duydukları Asim'i çok üzdü. Asim ailesinin yanına döndüğünde, Uveymir yanına geldi ve ona sordu; Asim, \"Bana iyi bir haber getirmedin. Allah'ın Resulü sorduğun soruyu beğenmedi.\" dedi. Bunun üzerine Uveymir, halkın arasında Allah'ın Resulü'ne gitti ve ona sordu; Resul, \"Senin ve karın hakkında bir ayet indirildi. Git ve onu getir.\" dedi. Böylece o ve Sahl, Allah'ın Elçisi'nin huzurunda, halkın önünde birbirlerine Allah'ın lanetini yağdırdılar. İşleri bittiğinde, Uveymir, \"Eğer onu tutsaydım, onun hakkında yalan söylemiş olurdum, ey Allah'ın Elçisi\" dedi. Böylece, Allah'ın Elçisi ona emretmeden önce onu üç kez boşadı. İbn Şihab, \"Bu olay, iki adamın birbirlerine Allah'ın lanetini yağdırdığı yıldan sonra gerçekleşti\" dedi. {cite:muwatta-maruf-1997 s.76}"
  id: "Yahya meriwayatkan dari Malik, dari Ibnu Shihab, bahwa Sahl ibn Sa'd al-Sa'idi memberitahunya bahwa 'Uwaymir al-'Ajlani datang kepada 'Asim ibn 'Adi al-Ansari dan berkata kepadanya, \"Wahai 'Asim, bagaimana jika seorang pria mendapati pria lain bersama istrinya? Haruskah dia membunuhnya, lalu engkau membunuhnya? Atau apa yang harus dia lakukan? Tanyakan hal ini kepada Rasulullah untukku, wahai 'Asim.\" Maka 'Asim bertanya kepada Rasulullah, tetapi Rasulullah tidak menyukai pertanyaan itu dan mengkritiknya, dan apa yang didengarnya sangat menyedihkan 'Asim. Ketika 'Asim kembali kepada keluarganya, 'Uwaymir datang kepadanya dan bertanya kepadanya, dan dia berkata, \"Engkau tidak membawa kabar baik kepadaku. Rasulullah tidak menyukai pertanyaan yang engkau ajukan kepadanya.\" Maka 'Uwaymir pergi kepada Rasulullah di tengah-tengah orang banyak dan bertanya kepadanya, dan beliau berkata, \"Sebuah ayat telah diturunkan tentang engkau dan istrimu. Pergilah dan bawalah dia.\" Maka ia dan Sahl saling memohon laknat Allah di hadapan orang banyak sebelum Rasulullah SAW. Setelah mereka selesai, Uwaymir berkata, \"Wahai Rasulullah, aku akan berbohong tentangnya jika aku tetap bersamanya.\" Maka ia menceraikannya tiga kali sebelum Rasulullah SAW memerintahkannya. Ibnu Shihab berkata, \"Ini terjadi setelah tahun kedua orang itu saling memohon laknat Allah.\" {cite:muwatta-maruf-1997 p.76}"
