label: { ar: "الموطأ 981 — مالك في رجل من أهل مكة انقطع إلى غيرها وسكن سواها، ثم قدم معتمراً في أشهر الحج فأقام بمكة حتى أنشأ الحج منها: إنه متمتع يجب عليه الهدي أو الصيام", en: "Muwatta 981", es: "Muwatta 981", fr: "Muwatta 981", ur: "موطا 981", tr: "El-Muvatta 981 — Malik, Mekke'den başka bir yere taşınıp oraya yerleşen, sonra Hac aylarında Umre yapmak için Mekke'ye gelen ve Hac ibadetini oradan yerine getirene kadar orada kalan bir adam hakkında şöyle demiştir: O, Tamattu' hacısıdır ve kurban kesmeli veya oruç tutmalıdır.", id: "Al-Muwatta 981 — Malik berkata tentang seorang pria dari Mekah yang pindah ke tempat lain dan menetap di sana, kemudian datang ke Mekah untuk melaksanakan Umrah pada bulan-bulan Haji dan tinggal di sana sampai ia melaksanakan Haji dari sana: Ia adalah seorang jamaah haji Tamattu’ dan wajib mempersembahkan kurban atau berpuasa." }
summary:
  ar: "قول لمالك في رجل من أهل مكة انقطع إلى غيرها وسكن سواها، ثم قدم معتمراً في أشهر الحج، ثم أقام بمكة حتى أنشأ الحج منها: إنه متمتع يجب عليه الهدي أو الصيام إن لم يجد هدياً، وأنه لا يكون مثل أهل مكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1111). {cite:muwatta-maruf-1997 p.463}"
  tr: "Malik, Mekke'den başka bir yere taşınıp oraya yerleşen, sonra Hac aylarında Umre yapmak için Mekke'ye dönen ve oradan Hac yapana kadar Mekke'de kalan bir adam hakkında şöyle demiştir: \"O, Tamattu' Hac yapan bir hacıdır ve kurban kesmek zorundadır veya kurban kesmeye gücü yetmiyorsa oruç tutmalıdır ve Mekke halkı gibi sayılmaz.\" Araştırmacı, bunu Malik'ten Ebu Musab'ın (1111) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.463}"
  id: "Malik berkata mengenai seorang pria dari Mekah yang pindah ke tempat lain dan menetap di sana, kemudian kembali ke Mekah untuk melaksanakan Umrah selama bulan-bulan Haji, dan kemudian tinggal di Mekah sampai ia melaksanakan Haji dari sana: Ia adalah seorang jamaah haji yang melaksanakan Haji Tamattu' dan harus mempersembahkan hewan kurban atau berpuasa jika ia tidak mampu, dan ia tidak dianggap seperti penduduk Mekah. Peneliti menyebutkan bahwa Abu Mus'ab (1111) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.463}"
