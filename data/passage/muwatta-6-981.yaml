summary:
  ar: "قول لمالك في رجل من أهل مكة انقطع إلى غيرها وسكن سواها، ثم قدم معتمراً في أشهر الحج، ثم أقام بمكة حتى أنشأ الحج منها: إنه متمتع يجب عليه الهدي أو الصيام إن لم يجد هدياً، وأنه لا يكون مثل أهل مكة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1111). {cite:muwatta-maruf-1997 p.463}"
