text: "… فانها مؤمنة و وقال مالك أحسن ماسمعت فى الرقاب الواجبة أنه لا يشتريها الذى يُعتقها بشرط على. أن يعتقها لاذ تلك ليست برقبة تامة وفيها شرط يوضع عنه من ثمنها. قال مالك ولا بأس أن يشترى المتطوع قال مالك وبلغني …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 2، ص 129، يرد فيه ذكر الواجب، وما لا بأس به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 2, p. 129, whose wording mentions the obligatory (wajib), what is said to be no harm; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المدونۃ الکبریٰ، اسکین جلد 2، ص 129 کا اقتباس جس میں واجب، جس میں کوئی مضائقہ نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mudawwana al-Kubra, volume numérisé 2, p. 129, dont le texte mentionne l'obligatoire (wajib), ce qui est dit sans inconvénient ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mudawwana al-Kubra, volumen digitalizado 2, p. 129, cuyo texto menciona lo obligatorio (wajib), lo que se dice que no tiene inconveniente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Büyük Blog, Resimli Cilt 2, sayfa 129'dan, farz olan ve izin verilen eylemlerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan eylemler, görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, yasak olan eylemler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Great Blog, Volume 2 Bergambar, halaman 129, yang menyebutkan perbuatan wajib dan perbuatan yang diperbolehkan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
