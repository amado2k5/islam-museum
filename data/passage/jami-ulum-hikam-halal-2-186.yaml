text: "… الحِمى ويرتع فيه، فكذلك من تعدَّى الحلال، ووقع في الشبهات، فإنَّه قد قارب الحرام غايةَ المقاربة، فما أخلقَهُ بأنْ يُخالِطَ الحرامَ المحضَ، ويقع فيه، وفي هذا إشارةٌ إلى أنَّه ينبغي التباعد عن المحرَّماتِ، وأنْ يجعل الإنسان بينه وبينها حاجزاً. عبارة …"
