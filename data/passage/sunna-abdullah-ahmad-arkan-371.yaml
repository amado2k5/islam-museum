text: "… - قال الآجري رحْم له في الشريعة بعد أن ذكر هذه الأحاديث والآثار في تكفير تارك الصلاة قال: هذه السُنن والآثار في ترك الصلاة وتضييعها مع ما لم نذكره مما يطول.. ما يدل على أن الصلاة من الإيمان، ومن لم …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 371، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 371, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 371 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
