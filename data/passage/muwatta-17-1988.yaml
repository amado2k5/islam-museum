label: { ar: "الموطأ 1988 — مالك: لا بأس أن يقبض من أسلف شيئا من الذهب أو الورق أو الطعام أو الحيوان أفضل مما أسلفه، إذا لم يكن ذلك على شرط أو عادة، فإن كان على شرط أو عادة فهو مكروه", en: "Muwatta 1988" }
summary:
  ar: "قال مالك: لا بأس بأن يقبض من أسلف شيئا من الذهب أو الورق أو الطعام أو الحيوان، أفضل مما أسلفه، إذا لم يكن ذلك على شرط منهما، أو عادة. فإن كان ذلك على شرط أو وعد أو عادة، فذلك مكروه، ولا خير فيه. وذلك أن رسول الله قضى جملا رباعيا خيارا مكان بكر استسلفه، وأن عبد الله بن عمر استسلف دراهم فقضى خيرا منها. فإن كان ذلك على طيب نفس من المستسلف، ولم يكن ذلك على شرط ولا وعد ولا عادة، كان ذلك حلالا لا بأس به. {cite:muwatta-maruf-1997 p.214}"
