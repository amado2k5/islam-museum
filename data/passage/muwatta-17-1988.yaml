label: { ar: "الموطأ 1988 — مالك: لا بأس أن يقبض من أسلف شيئا من الذهب أو الورق أو الطعام أو الحيوان أفضل مما أسلفه، إذا لم يكن ذلك على شرط أو عادة، فإن كان على شرط أو عادة فهو مكروه", en: "Muwatta 1988", es: "Muwatta 1988", fr: "Muwatta 1988", ur: "موطا 1988", tr: "El-Muvatta 1988 — Malik: Altın, kağıt, yiyecek veya hayvan ödünç veren bir kimsenin, şart veya gelenekte belirtilmemişse, ödünç verdiğinden daha iyisini alması caizdir. Şart veya gelenekte belirtilmişse, mekruhtur.", id: "Al-Muwatta 1988 — Malik: Diperbolehkan bagi seseorang yang meminjamkan sesuatu berupa emas, kertas, makanan, atau hewan untuk menerima sesuatu yang lebih baik daripada yang dipinjamkannya, jika hal ini tidak diatur dalam syarat atau kebiasaan. Jika diatur dalam syarat atau kebiasaan, maka hal itu tidak disukai." }
summary:
  ar: "قال مالك: لا بأس بأن يقبض من أسلف شيئا من الذهب أو الورق أو الطعام أو الحيوان، أفضل مما أسلفه، إذا لم يكن ذلك على شرط منهما، أو عادة. فإن كان ذلك على شرط أو وعد أو عادة، فذلك مكروه، ولا خير فيه. وذلك أن رسول الله قضى جملا رباعيا خيارا مكان بكر استسلفه، وأن عبد الله بن عمر استسلف دراهم فقضى خيرا منها. فإن كان ذلك على طيب نفس من المستسلف، ولم يكن ذلك على شرط ولا وعد ولا عادة، كان ذلك حلالا لا بأس به. {cite:muwatta-maruf-1997 p.214}"
  id: "Malik berkata: Tidak ada salahnya seseorang menerima sesuatu yang lebih baik daripada yang dipinjamkannya, baik itu emas, perak, makanan, atau hewan, jika hal itu tidak tercantum dalam perjanjian sebelumnya di antara mereka atau merupakan kebiasaan. Namun, jika hal itu tercantum dalam perjanjian, janji, atau kebiasaan sebelumnya, maka hal itu tidak disukai dan tidak ada kebaikannya. Ini karena Rasulullah shalla Allahu alaihi wa sallam mengembalikan pinjaman seekor unta muda dengan unta berumur empat tahun yang berkualitas baik, dan Abdullah bin Umar meminjam dirham dan mengembalikannya dengan sesuatu yang lebih baik. Jika hal ini dilakukan dengan sukarela oleh peminjam, dan tidak tercantum dalam perjanjian, janji, atau kebiasaan sebelumnya, maka hal itu diperbolehkan dan tidak ada salahnya. {kutipan:muwatta-maruf-1997 hlm. 214}"
