text: "ما أعرف شيئاً مما أدركت عليه الناس إلا النداء بالصلاة"
summary:
  ar: "أثر يرويه يحيى عن مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر، في باب ما جاء في النداء للصلاة: قال إنه لا يعرف شيئاً مما أدرك الناس عليه بقي على حاله إلا النداء بالصلاة، تعبيراً عما رآه من تغير أحوال الناس. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.120}"
