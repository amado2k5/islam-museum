label: { ar: "الموطأ 187 — مالك بن أبي عامر: لم يبق مما أدركت عليه الناس إلا النداء", en: "Muwatta 187", es: "Muwatta 187", fr: "Muwatta 187", ur: "موطا 187", tr: "El-Muvatta 187 — Malik ibn Abi Amir: İnsanların yaptıklarından geriye ezan okumaktan başka bir şey kalmamıştı.", id: "Al-Muwatta 187 — Malik ibn Abi Amir: Tidak ada yang tersisa dari apa yang kulihat dilakukan orang-orang kecuali seruan untuk salat." }
text: "ما أعرف شيئاً مما أدركت عليه الناس إلا النداء بالصلاة"
summary:
  ar: "أثر يرويه يحيى عن مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر، في باب ما جاء في النداء للصلاة: قال إنه لا يعرف شيئاً مما أدرك الناس عليه بقي على حاله إلا النداء بالصلاة، تعبيراً عما رآه من تغير أحوال الناس. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.120}"
  tr: "Yahya'nın Malik'ten, onun amcası Ebu Suhayl ibn Malik'ten, onun da babası Malik ibn Abi 'Amir'den rivayet ettiği, ezanla ilgili rivayetler bölümünde yer alan bir rivayette şöyle denilmiştir: İnsanların uygulamalarından hiçbirinin değişmeden kalmadığını, sadece ezanın değişmediğini söylemiştir; bu, insanların değişen hallerini gördüğünü ifade etmektedir. Editör, bu rivayetin Ebu Mus'ab tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.120}"
  id: "Sebuah riwayat yang dinarasikan oleh Yahya atas otoritas Malik, atas otoritas pamannya Abu Suhayl ibn Malik, atas otoritas ayahnya Malik ibn Abi 'Amir, dalam bab tentang apa yang telah diriwayatkan mengenai seruan azan: Beliau berkata bahwa beliau tidak mengetahui adanya kebiasaan manusia yang tetap tidak berubah kecuali seruan azan, mengungkapkan apa yang telah dilihatnya tentang perubahan kondisi manusia. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.120}"
