text: لا يقعُ الطعنُ إلا في نحورهم ليس لهم عن حياض الموت تهليلُ
summary:
  ar: 'من وصف كعب لشجاعة المهاجرين: لا تصيبهم الطعنة إلا في نحورهم، فلا يتراجعون عن الموت {{cite:ibn-hisham-wustenfeld-1858 p.892}}.'
  en: 'From Ka''b''s description of the emigrants'' courage: the thrust lands only on their throats, and they do not shrink back from the waters of death.'
  es: "Según la descripción que hace Ka'b del coraje de los emigrantes: el golpe solo les da en la garganta, y no retroceden ante las aguas de la muerte."
  fr: "D'après la description que fait Ka'b du courage des émigrants: le coup ne les atteint qu'à la gorge, et ils ne reculent pas devant les eaux de la mort."
  ur: "ہجرت کرنے والوں کی ہمت کے بارے میں کعب کے بیان سے: زور صرف ان کے گلے میں آتا ہے، اور وہ موت کے پانی سے پیچھے نہیں ہٹتے۔"
translations:
  en:
    text: The spear-thrust falls only on their throats; they do not recoil from the pools of death.
