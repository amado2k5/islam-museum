text: لا يقعُ الطعنُ إلا في نحورهم ليس لهم عن حياض الموت تهليلُ
summary:
  ar: 'من وصف كعب لشجاعة المهاجرين: لا تصيبهم الطعنة إلا في نحورهم، فلا يتراجعون عن الموت {{cite:ibn-hisham-wustenfeld-1858 p.892}}.'
  en: 'From Ka''b''s description of the emigrants'' courage: the thrust lands only on their throats, and they do not shrink back from the waters of death.'
