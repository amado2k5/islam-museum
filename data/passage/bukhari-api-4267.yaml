text: "حَدَّثَنِي عِمْرَانُ بْنُ مَيْسَرَةَ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنْ حُصَيْنٍ، عَنْ عَامِرٍ، عَنِ النُّعْمَانِ بْنِ بَشِيرٍما ـ قَالَ أُغْمِيَ عَلَى عَبْدِ اللَّهِ بْنِ رَوَاحَةَ، فَجَعَلَتْ أُخْتُهُ عَمْرَةُ تَبْكِي وَاجَبَلاَهْ وَاكَذَا وَاكَذَا. تُعَدِّدُ عَلَيْهِ فَقَالَ حِينَ أَفَاقَ مَا قُلْتِ شَيْئًا إِلاَّ قِيلَ لِي آنْتَ كَذَلِكَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4267، فيه بكاء على ميت أو نياحة وحدودها. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4267 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that carries weeping over the dead, or wailing and its limits. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "صحیح البخاری کی حدیث نمبر 4267، جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sahih al-Bukhari, n° 4267, qui contient des pleurs sur un défunt, ou la lamentation et ses limites. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sahih al-Bukhari, n.º 4267, que contiene llanto por un difunto, o el lamento y sus límites. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sahih el-Buhari'de 4267 numaralı hadis, ölüler için ağlamayı ve bunun sınırlarını ele almaktadır. Bu derleme, ağıt ve yasla ilgili en meşhur sözleri, Kur'an'dan, Sünnet'ten, Peygamberimizin hayatından, Sahabeler ve onların haleflerinden rivayetlerden ve diğer ilgili kitaplardan alıntılarla bir araya getirmektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4267, membahas tentang menangis atau meratap atas orang yang meninggal dan batasannya. Hadits ini mengumpulkan ucapan-ucapan paling terkenal tentang elegi dan ratapan, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, riwayat dari para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
