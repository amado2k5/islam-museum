label: { ar: "صحيح البخاري 6682 — عمل يعدل عملا أعظم منه، الميزان", en: "Sahih al-Bukhari 6682 — a deed that equals a greater one; the Scale", ur: "صحیح بخاری 6682 — ایک عمل جو بڑے عمل کے برابر ہے، میزان", es: "Sahih al-Bukhari 6682 — una acción que equivale a una mayor; la Escala", fr: "Sahih al-Bukhari 6682 — un acte qui en vaut un autre, plus grand encore; l'Échelle" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، حَدَّثَنَا عُمَارَةُ بْنُ الْقَعْقَاعِ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6682، يذكر عمل يعدل عملا أعظم منه، والميزان. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 6682 (Oaths and Vows), that speaks of a deed that equals a greater one, the Scale. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 6682، جس میں ایک عمل جو بڑے عمل کے برابر ہے، میزان کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6682 (Juramentos y Votos), habla de una acción equivalente a otra mayor: la Balanza. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 6682 (Serments et Vœux), évoque un acte qui en vaut un autre, la Balance. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptent, écrivent, effacent ou pèsent un acte."
