label: { ar: "سنن النسائي 3320 — الأب والأبوة", en: "Sunan al-Nasa'i 3320 — the father and fatherhood", ur: "سنن نسائی 3320 — باپ اور والدیت", es: "Sunan al-Nasa'i 3320 — El padre y la paternidad" }
text: "… مُحَمَّدِ بْنِ عَبْدِ الرَّحْمَنِ، قَالَ حَدَّثَنَا سُفْيَانُ، قَالَ سَمِعْنَاهُ مِنْ عَبْدِ الرَّحْمَنِ، - وَهُوَ ابْنُ الْقَاسِمِ - عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ جَاءَتْ سَهْلَةُ بِنْتُ سُهَيْلٍ إِلَى رَسُولِ اللَّهِ فَقَالَتْ إِنِّي أَرَى فِي وَجْهِ أَبِي حُذَيْفَةَ مِنْ دُخُولِ سَالِمٍ عَلَىَّ. قَالَ \" فَأَرْضِعِيهِ \". قَالَتْ وَكَيْفَ أُرْضِعُهُ وَهُوَ رَجُلٌ كَبِيرٌ فَقَالَ \" أَلَسْتُ أَعْلَمُ أَنَّهُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3320، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3320 (The Book of Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3320، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3320 (El Libro del Matrimonio), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
