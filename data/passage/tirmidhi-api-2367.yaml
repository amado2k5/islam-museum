label: { ar: "جامع الترمذي 2367 — أثر من الآثار المحفوظة، دفن وقبر ومرقد", en: "Jami' al-Tirmidhi 2367 — a relic kept after its owner; a burial, grave or resting place", ur: "جامع ترمذی 2367 — محفوظ آثار و تبرکات، تدفین، قبر اور مرقد" }
text: "… فَتَمَخَّطَ فِي أَحَدِهِمَا ثُمَّ قَالَ بَخٍ بَخٍ يَتَمَخَّطُ أَبُو هُرَيْرَةَ فِي الْكَتَّانِ لَقَدْ رَأَيْتُنِي وَإِنِّي لأَخِرُّ فِيمَا بَيْنَ مِنْبَرِ رَسُولِ اللَّهِ وَحُجْرَةِ عَائِشَةَ مِنَ الْجُوعِ مَغْشِيًّا عَلَىَّ فَيَجِيءُ الْجَائِي فَيَضَعُ رِجْلَهُ عَلَى عُنُقِي يُرَى أَنَّ بِيَ الْجُنُونَ وَمَا بِي جُنُونٌ وَمَا هُوَ إِلاَّ الْجُوعُ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ"
summary:
  ar: "حديث في جامع الترمذي، رقم 2367، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2367 (Chapters On Zuhd), that mentions a relic kept after its owner, a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 2367، جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
