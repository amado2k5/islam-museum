label: { ar: "الموطأ 709 — مالك: الخليطان من كان الراعي والفحل والمراح والدلو واحداً، ولا تجب عليهما الصدقة حتى يكون لكل منهما نصاب", en: "Muwatta 709" }
summary:
  ar: "أول نص في باب صدقة الخلطاء. يقول مالك: الخليطان إذا كان الراعي واحداً والفحل واحداً والمراح واحداً والدلو واحداً فهما خليطان وإن عرف كل واحد منهما ماله من مال صاحبه، والذي لا يعرف ماله من مال صاحبه ليس بخليط إنما هو شريك. ولا تجب الصدقة على الخليطين حتى يكون لكل واحد منهما ما تجب فيه الصدقة: فإن كان لأحدهما أربعون شاة فصاعداً وللآخر أقل كانت الصدقة على صاحب الأربعين وحده؛ وإن كان لكل منهما نصاب جُمعا في الصدقة ووجبت عليهما جميعاً، فإن كان لأحدهما ألف شاة وللآخر أربعون فهما خليطان يترادان الفضل بينهما بالسوية على قدر عدد أموالهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354} {cite:muwatta-maruf-1997 p.355}"
