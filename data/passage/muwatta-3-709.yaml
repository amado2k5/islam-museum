label: { ar: "الموطأ 709 — مالك: الخليطان من كان الراعي والفحل والمراح والدلو واحداً، ولا تجب عليهما الصدقة حتى يكون لكل منهما نصاب", en: "Muwatta 709", es: "Muwatta 709", fr: "Muwatta 709", ur: "موطا 709", tr: "Al-Muwatta 709 — Malik: Bir çobanı, bir damızlık hayvanı, bir ağılı ve bir kovayı paylaşan iki kişi, her biri asgari zekat eşiğine (nisaba) ulaşana kadar zekat ödemekle yükümlü değildir.", id: "Al-Muwatta 709 — Malik: Dua orang yang berbagi seekor gembala, seekor hewan pejantan, sebuah kandang, dan sebuah ember tidak diwajibkan membayar zakat sampai masing-masing dari mereka mencapai ambang batas minimum (nisab)." }
summary:
  ar: "أول نص في باب صدقة الخلطاء. يقول مالك: الخليطان إذا كان الراعي واحداً والفحل واحداً والمراح واحداً والدلو واحداً فهما خليطان وإن عرف كل واحد منهما ماله من مال صاحبه، والذي لا يعرف ماله من مال صاحبه ليس بخليط إنما هو شريك. ولا تجب الصدقة على الخليطين حتى يكون لكل واحد منهما ما تجب فيه الصدقة: فإن كان لأحدهما أربعون شاة فصاعداً وللآخر أقل كانت الصدقة على صاحب الأربعين وحده؛ وإن كان لكل منهما نصاب جُمعا في الصدقة ووجبت عليهما جميعاً، فإن كان لأحدهما ألف شاة وللآخر أربعون فهما خليطان يترادان الفضل بينهما بالسوية على قدر عدد أموالهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354} {cite:muwatta-maruf-1997 p.355}"
  tr: "Ortakların zekâtı hakkındaki bölümün ilk metni şöyledir: Malik şöyle der: İki ortak, aynı çobanı, aynı koçu, aynı ağılı ve aynı su kabını paylaşıyorlarsa, her biri diğerinin hayvanlarındaki payını bilse bile, ortak sayılırlar. Payını bilmeyen ortak değil, müşterek mal sahibi sayılır. Zekât, ortaklar için ancak her birinin zekâta tabi asgari miktarda hayvana sahip olması durumunda farzdır. Birinin kırk veya daha fazla koyunu, diğerinin ise daha az koyunu varsa, zekât yalnızca kırk koyunu olan kişiden düşülür. Her birinin asgari miktarda hayvanı varsa, zekât amacıyla birleştirilirler ve zekât her ikisi için de farzdır. Birinin bin koyunu, diğerinin kırk koyunu varsa, ortak sayılırlar ve fazlalığı, sahip oldukları hayvan sayısına göre eşit olarak aralarında bölüştürürler. Araştırmacı, bunun Malik'ten Ebu Mus'ab tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.354} {cite:muwatta-maruf-1997 s.355}"
  id: "Teks pertama dalam bab tentang zakat mitra. Malik berkata: Dua mitra dianggap mitra jika mereka memiliki gembala yang sama, domba jantan yang sama, kandang yang sama, dan ember penampung air yang sama, meskipun masing-masing mengetahui bagian mereka atas ternak milik yang lain. Orang yang tidak mengetahui bagiannya tidak dianggap sebagai mitra tetapi sebagai pemilik bersama. Zakat tidak wajib bagi mitra kecuali masing-masing memiliki jumlah minimum ternak yang wajib dizakati. Jika seseorang memiliki empat puluh ekor domba atau lebih dan yang lain kurang dari itu, zakat hanya wajib dibayarkan oleh yang memiliki empat puluh ekor. Jika masing-masing memiliki jumlah minimum, mereka digabungkan untuk tujuan zakat, dan itu wajib bagi keduanya. Jika seseorang memiliki seribu ekor domba dan yang lain empat puluh ekor, mereka dianggap mitra dan harus membagi kelebihan tersebut secara merata di antara mereka sesuai dengan ukuran kepemilikan masing-masing. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab. {kutip:muwatta-maruf-1997 hal.354} {kutip:muwatta-maruf-1997 hal.355}"
