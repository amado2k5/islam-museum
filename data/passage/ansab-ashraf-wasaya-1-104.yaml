text: "وفاة حليمة السعدية من نسائكم أحدا، قلتم : هذه رمّة أمك وأعظُمها. ثم كفّهم اللّٰه عن ذلك إكراما لنبيه ؛ فأمسكوا. - وزعم بعض البصريين أن آمنة أم النبي لل في ماتت بمكة، ودُفنتْ في شعب أبي دُبّ الخزاعي. وذلك …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 1، ص 104، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 1, p. 104, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 1، ص 104 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
