text: "… الحُوَيرِث، عن النبى أَنّه قال : إِنَّ اللّٰه حرّمهم علىّ بِبِسِّ الوالد ووَكْزِهم فى لَبَّاتِ الإبل. قال : وحدّثنى قُرّان بن محمد، عن عيسى بن عُمَيْلة الفَزارى، قال : كان عُيَيْنَة فى أَهله بنَجْد فأَتاه الخبر أَنَّ رسول اللّٰه صلَّ …"
