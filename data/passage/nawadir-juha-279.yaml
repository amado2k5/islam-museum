text: "… لا تريني وجهكِ وأريهِ مَنْ تشائين. زوّجوهُ بامرأة قبيحة المنظر، ففي الصباح، أراد الشيخ الانصراف فتقدَّمت إليه برشاقةٍ ودلالٍ قائلة: أرجو أن تَخبرني إلى أيِّ أقربائكِ من الرجال أري وجهي، ومَن منهم لا تريدُ أن يراني؟ فقال لها فَوْراً : …"
summary:
  ar: "كانت زوجة جحا قبيحة، فسألته أمام أي أقاربها الرجال يجوز لها أن تكشف وجهها، فقال: لا تريني وجهك وأريه من تشائين. {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  en: "Married to an ugly woman, Juha is asked by her before which male relatives she may show her face, and he says, 'Do not show me your face, and show it to whomever you want.' {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  ur: "جحا کی بیوی بدصورت ہے اور وہ اس سے پوچھتی ہے کہ اپنے کن مرد رشتہ داروں کے سامنے چہرہ دکھا سکتی ہے، تو وہ کہتا ہے: مجھے اپنا چہرہ نہ دکھاؤ اور جسے چاہو دکھاؤ۔ {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  fr: "Marié à une femme laide, Juha s'entend demander par elle devant quels parents masculins elle peut montrer son visage, et il dit : « Ne me montre pas ton visage, et montre-le à qui tu veux. » {cite:juha-nawadir-kubra-djuwaydi p. 137}"
  es: "Casado con una mujer fea, Juha oye que ella le pregunta ante qué parientes varones puede mostrar su rostro, y dice: «No me muestres tu cara, y muéstrasela a quien quieras». {cite:juha-nawadir-kubra-djuwaydi p. 137}"
