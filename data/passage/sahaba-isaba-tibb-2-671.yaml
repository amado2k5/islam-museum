text: "… شهد بدراً، واتفقوا على أنه استشهد بأحد. وشذّ أبو الشابة قال: فَصْدُ العِرْق، وتَحْسيمُ الطعْنَة إن عبيد فقال: إنّه استشهد ببدر. اضْطُرِرْتَ، وَلاَ تَجْعَلْ فِي دَوَائِكَ شُبرماً، وعَلَيْكَ بالسَّنَا، ولا تداوِ أحَداً حتّى تَعْرِفَ دَاءَهُ. قال: فقبّل وقال حسّان يرثيه …"
