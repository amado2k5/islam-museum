text: "… في النبض شيء، ويبقى الصداع إن كان وهذا كله يدلّ على انتقالها إلى حمّى عفونة الخلط، أو. الدقّ، وإن كانت الأسباب شديدة وطال لبثها، انتقلت إلى الدقِّية، فإن انتقلت إلى الدقّ، رأين مِجَسَّ الشريان حاراً جداً، ورأيت الحمّى متشابهة في …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 11، يذكر الحمى، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 11, that mentions fever, named diseases, the hospital and the medical craft, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 11 کا اقتباس جس میں بخار، بیماریوں کے نام، بیمارستان، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 11, que menciona la fiebre, enfermedades específicas, el hospital y la práctica médica, los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 11, qui mentionne la fièvre, les maladies nommées, l'hôpital et l'art médical, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 11. sayfasından, ateş, hastalık isimleri, hastane ve tıp mesleği ile vücut organlarından bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 11, yang menyebutkan demam, nama-nama penyakit, rumah sakit dan profesi medis, serta organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
