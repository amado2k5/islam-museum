label: { ar: "الموطأ 2385 — ابن شهاب: الذي يعمل عمل قوم لوط عليه الرجم أحصن أو لم يحصن", en: "Muwatta 2385", es: "Muwatta 2385", fr: "Muwatta 2385", ur: "موطا 2385", tr: "El-Muvatta 2385 — İbn Şihab: Lut kavminin yaptığı gibi davranan kimse, evli olsun bekar olsun, taşlanarak öldürülmelidir.", id: "Al-Muwatta 2385 — Ibn Shihab: Barangsiapa melakukan perbuatan kaum Luth, maka ia akan dirajam, baik sudah menikah maupun belum menikah." }
summary:
  ar: "حدث مالك أنه سأل ابن شهاب عن الذي يعمل عمل قوم لوط؟ فقال: عليه الرجم، أحصن أو لم يحصن. {cite:muwatta-maruf-1997 p.387}"
  tr: "Malik, İbn Şihab'a Lut kavminin yaptığı gibi davranan birini sorduğunu, onun da şöyle cevap verdiğini rivayet etmiştir: \"Evli olsun ya da olmasın, taşlanmalıdır.\" {cite:muwatta-maruf-1997 s.387}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Ibnu Shihab tentang seseorang yang melakukan perbuatan seperti kaum Luth. Ibnu Shihab menjawab: Ia harus dirajam, baik sudah menikah maupun belum. {cite:muwatta-maruf-1997 p.387}"
