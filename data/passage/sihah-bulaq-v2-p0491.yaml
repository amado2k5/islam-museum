text: |-
  ١ فى نسخة زيادة الشاءر
  حنظلة من شرق ا
  ٤٦
  قال سيبويه همزما ليس؟هموزضرورة (شهق شهق يشهق أى ارتفع والشاهق
  الجبل المرتفع وفلان ذوشاهُق إذا كان يشتدّ غَضبه وشهيق الحمار آخر صوته وزفيره أوّله وقد
  شهق يشهق ويشهق شهيقا ويقال الشهيق ردّ النفس والزفيرا خراجه والشهقة كألصيحة
  يقال شهق فلان شهقفات والتشهاق الشهيق قال 1
  بضرب يزيل الهام عن سكاته • وطعن كتشهاق العفاهم بالذهق
  ويقال ضحك تشهاق قال ابن ميادة
  تقول خوذذات طرف براق • مراحة نقطع هم المشتاق
  ذات أفاويل وضحك تشهاف • هلااشتريت حنطة بالرعتاق
  • ممراء ممادرس ابن مخراق
  ( يق لشيق الجبل من ابن الاعرابي" قال أبو ذؤيب
  تأبط شافة فيها مساب • فأصبح يقترى مسداشيق
  أراد يقترى شيقا بسد فقلبه ويقال هوأصعب موضع فى الجبل وبنشد
  شغواء توطن بين الشسيق والنيق* والشياق مثل النياط يقال شقت الطنب الى الوتدمشل
  تطبته قال دريد ين الصمسة يرتى أخاه
  فجتت اليه والرماح تشيقه * كوقع الصياصى فى الفسيح الممدد
  ويروى تتوسهِ : .
  صل الصاد دق) الصدق خلاف الكذب وقد صدق فى الحديث ويقال
  أيضاصدقه الحديث وفى المثل صدقى سن يكره وذلك أنه المباتر قال له هدع وهى كلمة تسكن
  بهاصغار الإبل اذانفرت ومدقوهم الققال وتضاد قافى الحديث وفى المودة والمصدّق
  الذى يصدقك فى حديثك والذى يأخذصدقات الغنم والمتصدق الذى يعطى الصدقة
  ومررت برحل يسأل ولا تقسل يتصدّق والعاصّة بقوله وائما المتصدّق الذى يعطى وقوله
  تعالى انّ المصدقين والمصدقات بتشديد الصادأ صله المتصتقين فقلبت التافصادا وأدغمت
  فى مثلها والصداقة والمصادقة المخالة والرجل صديق والانتى صديقة والجمع أصدقاه وقد
  يقال للواحد والجمع والمؤنت صديق قال الشاعر
  نصين الهوى ثم ارتمين قلوينا • بأعين أعداء وهنّ صديق
  ويقال فلان صديق أى أخص أصد قائي وانمابصغر على جهة المدح كقول حباب بن المنذر
  أنا جذيلها المحكك وعذيها المرجب والصديق مثال الفسبيق الدائم التصديق ويكون
  الذى يصدّق قوله بالعمل والصدق بالفتج الصلب من الرماح ويقال المستوى ويقال أيضا
  رجل صدق اللقاء وصندق النظر وقوم صدق بالضم مثل فرس ورد وأفراس وردوجون
  وجون وه ذا مصداق هذا أى ما يصندقه ويتال للرجل الشجاع والفرس الجوادانه
  لدومصدق بالفتح أى صادق الحملة وصادق الجرى كأنه ذوصدق فيما يعدك من ذلكْ قال
  خفاف ين ندية
  اذا ما استحمت أرضه من سمائه • جوى وهومودوع وواعد مصدق
  يقول
