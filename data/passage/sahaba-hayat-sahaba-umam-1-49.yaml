text: "… : تسعهاتة وتسعة وتسعون الى النار وواحد الى الجنة، فأنشأً المسلمون يبكون فقال رسول اللّٰه : قاربوا وسددوا افانها لم تسكن نبوة قط الا كان بين يديها جاهلية، قال : فيؤخذ العدد من الجاهلية، فان تمت وإلا كملت من المنافقين، …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 49، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 49, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 49 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Hayat al-Sahaba de al-Kandahlawi, volumen 1, pág. 49, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 1, page 49, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "Kandahlevi'nin \"Hayat al-Sahaba\" (Sahabelerin Hayatları) adlı eserinin Resimli 1. Cildinin 49. sayfasından bir alıntı, Müslüman olmayan milletleri, dinleri ve halkları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. \"Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar\" tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Hayat al-Sahaba\" (Kehidupan Para Sahabat) karya Kandahlawi, Jilid 1 Bergambar, halaman 49, menyebutkan bangsa, agama, dan masyarakat non-Muslim. Kutipan ini diambil dari versi pindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban \"Bangsa, Agama, Sekte, dan Masyarakat Non-Muslim\"."
