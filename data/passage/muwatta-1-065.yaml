label: { ar: "الموطأ 65 — عثمان: من أحسن وضوءه غُفر له ما بينه وبين الصلاة الأخرى", en: "Muwatta 65", es: "Muwatta 65", fr: "Muwatta 65", ur: "موطا 65", tr: "El-Muvatta 65 — Osman: Kim güzel bir abdest alırsa, o namaz ile bir sonraki namaz arasındaki günahları bağışlanır.", id: "Al-Muwatta 65 — Uthman: Barangsiapa berwudhu dengan sempurna, maka dosa-dosanya akan diampuni antara shalat itu dan shalat berikutnya." }
text: "ما من امرئ يتوضأ فيحسن وضوءه ثم يصلي الصلاة إلا غفر له ما بينه وبين الصلاة الأخرى حتى يصليها"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن حمران مولى عثمان بن عفان، في باب جامع الوضوء: جلس عثمان على المقاعد فجاءه المؤذن يؤذنه بصلاة العصر، فدعا بماء فتوضأ ثم أقسم أن يحدثهم حديثاً لولا أنه في كتاب الله ما حدثهم به، وهو أنه سمع النبي يخبر أن من توضأ فأحسن وضوءه ثم صلى غُفر له ما بينه وبين الصلاة التي تليها. ويروي يحيى عن مالك أنه يرى عثمان أراد الآية الرابعة عشرة بعد المئة من سورة هود في إقامة الصلاة وتكفير الحسنات للسيئات. ويذكر المحقق أن رواية أبي مصعب «لولا آية» أظهر، ويخرّج الحديث عند ابن حبان (1041) والنسائي (1/91) وأبي عوانة من طرق أصحاب مالك، وينقل عن ابن عبد البر أن رواية الموطأ ليس فيها صفة الوضوء ثلاثاً، وأن جماعة رووه عن هشام بذكر الوضوء ثلاثاً ثلاثاً ⁦(التمهيد 22/211–212)⁩. {cite:muwatta-maruf-1997 p.66} {cite:muwatta-maruf-1997 p.67}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Osman ibn Affan'ın azatlı kölesi Humran'dan, kapsamlı abdest bölümünde şöyle rivayet etmiştir: Osman, müezzin ikindi namazının vaktini bildirmek için geldiğinde sıralarda oturuyordu. Su istedi, abdest aldı ve sonra onlara, Allah'ın Kitabında olmasaydı asla anlatmayacağı bir hadis anlatacağına yemin etti. Peygamberin onlara, \"Kim abdestini düzgün bir şekilde alıp namaz kılarsa, o namaz ile bir sonraki namaz arasında günahları affedilir\" diye bildirdiğini duyduğunu söyledi. Yahya, Malik'ten rivayet ederek, Osman'ın Hud Suresi'nin 114. ayetini kastettiğine inandığını, bu ayetin namazı kılmaktan ve iyi amellerle günahların affedilmesinden bahsettiğini belirtmiştir. Araştırmacı, Ebu Musab'ın \"bir ayet olmasaydı\" rivayetinin daha açık olduğunu belirtmektedir. Hadisi, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla İbn Hibban'a (1041), el-Nasa'i'ye (1/91) ve Ebu Avanah'a dayandırır. İbn Abd el-Barr'ın, el-Muvatta'daki rivayetin üç defa abdest alma tasvirini içermediğini ve bir grup insanın Hişam'dan rivayet ederek her birinin üç defa abdest almasından bahsettiğini söylediğini aktarır (el-Tamhid 22/211–212). {cite:muwatta-maruf-1997 s.66} {cite:muwatta-maruf-1997 s.67}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, dari Humran, budak yang dibebaskan oleh Utsman ibn Affan, dalam bab tentang wudhu yang sempurna: Utsman duduk di bangku ketika muazin datang untuk memberitahunya waktu shalat Ashar. Dia meminta air, berwudhu, dan kemudian bersumpah bahwa dia akan memberi tahu mereka sebuah hadits yang tidak akan dia sampaikan jika bukan karena hadits itu ada di dalam Kitab Allah. Dia berkata bahwa dia telah mendengar Nabi memberi tahu mereka bahwa siapa pun yang berwudhu dengan benar dan kemudian shalat akan diampuni dosa-dosanya antara shalat itu dan shalat berikutnya. Yahya meriwayatkan dari Malik bahwa dia percaya Utsman maksudkan ayat 114 Surah Hud, yang berbicara tentang mendirikan shalat dan penghapusan dosa melalui amal kebaikan. Peneliti menyebutkan bahwa riwayat Abu Musab, \"jika bukan karena sebuah ayat,\" lebih jelas. Ia menelusuri hadits tersebut kepada Ibnu Hibban (1041), al-Nasa’i (1/91), dan Abu Awanah melalui sanad para sahabat Malik. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa riwayat dalam al-Muwatta’ tidak mencakup uraian tentang berwudhu tiga kali, dan bahwa sekelompok orang meriwayatkannya atas otoritas Hisham dengan menyebutkan berwudhu tiga kali setiap kali (al-Tamhid 22/211–212). {cite:muwatta-maruf-1997 p.66} {cite:muwatta-maruf-1997 p.67}"
