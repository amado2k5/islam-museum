ref: "1.65"
label: { ar: "الموطأ 65 — عثمان: من أحسن وضوءه غُفر له ما بينه وبين الصلاة الأخرى", en: "Muwatta 65" }
text: "ما من امرئ يتوضأ فيحسن وضوءه ثم يصلي الصلاة إلا غفر له ما بينه وبين الصلاة الأخرى حتى يصليها"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن حمران مولى عثمان بن عفان، في باب جامع الوضوء: جلس عثمان على المقاعد فجاءه المؤذن يؤذنه بصلاة العصر، فدعا بماء فتوضأ ثم أقسم أن يحدثهم حديثاً لولا أنه في كتاب الله ما حدثهم به، وهو أنه سمع النبي يخبر أن من توضأ فأحسن وضوءه ثم صلى غُفر له ما بينه وبين الصلاة التي تليها. ويروي يحيى عن مالك أنه يرى عثمان أراد الآية الرابعة عشرة بعد المئة من سورة هود في إقامة الصلاة وتكفير الحسنات للسيئات. ويذكر المحقق أن رواية أبي مصعب «لولا آية» أظهر، ويخرّج الحديث عند ابن حبان (1041) والنسائي (1/91) وأبي عوانة من طرق أصحاب مالك، وينقل عن ابن عبد البر أن رواية الموطأ ليس فيها صفة الوضوء ثلاثاً، وأن جماعة رووه عن هشام بذكر الوضوء ثلاثاً ثلاثاً (التمهيد 22/211–212). {cite:muwatta-maruf-1997 p.66} {cite:muwatta-maruf-1997 p.67}"
