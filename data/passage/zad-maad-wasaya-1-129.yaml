  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 129, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 129 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
