text: "… فإن فرض الكفاية يجبُ على الجميع، البعض بعد وجوبه بفعل الآخرين. الثانية والعشرون : أن فيه الخطبة التي يُقصد بها الثناءُ على اللَّه وتمجيدُه، والشهادةُ له بالوحدانية، ولرسولِه وعَيّةُ بالرسالةِ، وتذكيرُ العباد بأيامه، وتحذيرُهم من بأسه ونِقمته، ووصيتُهم بما يُقَرِّبُهم …"
summary:
