label: { ar: "الموطأ 442 — لا يزال أحدكم في صلاة ما كانت الصلاة تحبسه", en: "Muwatta 442" }
text: "لا يزال أحدكم في صلاة ما كانت الصلاة تحبسه، لا يمنعه أن ينقلب إلى أهله إلا الصلاة"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب انتظار الصلاة والمشي إليها: أخبر النبي أن المرء لا يزال في صلاة ما دامت الصلاة تحبسه في المسجد ولا يمنعه من الانقلاب إلى أهله إلا انتظارها. ويخرّجه المحقق عند البخاري (659) ومسلم (2/129) وأبي داود (470) وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (19/26). {cite:muwatta-maruf-1997 p.228}"
