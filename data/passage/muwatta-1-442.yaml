label: { ar: "الموطأ 442 — لا يزال أحدكم في صلاة ما كانت الصلاة تحبسه", en: "Muwatta 442", es: "Muwatta 442", fr: "Muwatta 442", ur: "موطا 442", tr: "Al-Muwatta 442 — Sizden biri, namaz onu meşgul ettiği sürece namazda kalır.", id: "Al-Muwatta 442 — Salah seorang di antara kalian tetap dalam salat selama salat itu menyibukkan hatinya." }
text: "لا يزال أحدكم في صلاة ما كانت الصلاة تحبسه، لا يمنعه أن ينقلب إلى أهله إلا الصلاة"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب انتظار الصلاة والمشي إليها: أخبر النبي أن المرء لا يزال في صلاة ما دامت الصلاة تحبسه في المسجد ولا يمنعه من الانقلاب إلى أهله إلا انتظارها. ويخرّجه المحقق عند البخاري (659) ومسلم (2/129) وأبي داود (470) وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (19/26). {cite:muwatta-maruf-1997 p.228}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, namazı beklemek ve namaza yürümek bölümünde şöyle buyurmuştur: Peygamberimiz bize, bir kimse namaz onu mescitte tuttuğu sürece namaz halinde kalır ve onu ailesinin yanına dönmekten alıkoyan tek şey namazı beklemektir. Araştırmacı, bunu Malik'in sahabelerinin rivayet zincirleriyle Buhari (659), Müslim (2/129), Ebu Davud (470), Ahmed ve Beyhaki'nin derlemelerine dahil etmiş ve Temhid'e (19/26) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.228}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surah tentang menunggu shalat dan berjalan menuju shalat: Nabi memberitahukan kepada kita bahwa seseorang tetap dalam keadaan shalat selama shalat tersebut membuatnya berada di masjid dan tidak ada yang menghalanginya untuk kembali kepada keluarganya kecuali menunggu shalat. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (659), Muslim (2/129), Abu Dawud (470), Ahmad, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (19/26). {cite:muwatta-maruf-1997 p.228}"
