label: { ar: "موطأ مالك 257 — الكراهة، ما كُره", en: "Muwatta Malik 257 — dislike (karaha); what was disliked", ur: "موطأ مالک 257 — کراہت، جو ناپسند کیا گیا", fr: "Muwatta de Malik 257 — la réprobation (karaha) ; ce qui fut réprouvé", es: "Muwatta de Malik 257 — la reprobación (karaha); lo que se reprobó", tr: "Muwatta Malik 257 — Hoşlanılmayan, hoşlanılmayan şey", id: "Muwatta Malik 257 — Yang tidak disukai, apa yang tidak disukai" }
text: "… بْنِ أَبِي حَكِيمٍ، أَنَّهُ بَلَغَهُ أَنَّ رَسُولَ اللَّهِ سَمِعَ امْرَأَةً مِنَ اللَّيْلِ تُصَلِّي فَقَالَ \" مَنْ هَذِهِ \". فَقِيلَ لَهُ هَذِهِ الْحَوْلاَءُ بِنْتُ تُوَيْتٍ لاَ تَنَامُ اللَّيْلَ. فَكَرِهَ ذَلِكَ رَسُولُ اللَّهِ حَتَّى عُرِفَتِ الْكَرَاهِيَةُ فِي وَجْهِهِ ثُمَّ قَالَ \" إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لاَ يَمَلُّ حَتَّى تَمَلُّوا اكْلَفُوا مِنَ الْعَمَلِ مَا لَكُمْ بِهِ طَاقَةٌ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 257، يرد فيه ذكر الكراهة، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 257 (Tahajjud), whose wording mentions dislike (karaha), what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 257، جس کے الفاظ میں کراہت، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 257, dont le texte mentionne la réprobation (karaha), ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 257, cuyo texto menciona la reprobación (karaha), lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 257 numaralı hadis, mekruh sayılan ve mekruh sayılan şeyleri sıralamaktadır. Bu hadis, farz, itaat, müstehap, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 257, menyebutkan apa yang tidak disukai dan apa yang dianggap tidak disukai. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
