text: "… قَالَ حَدَّثَنَا مُحَمَّدٌ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ سَيَّارٍ، وَيَحْيَى بْنِ سَعِيدٍ، أَنَّهُمَا سَمِعَا عُبَادَةَ بْنَ الْوَلِيدِ، يُحَدِّثُ عَنْ أَبِيهِ، - أَمَّا سَيَّارٌ فَقَالَ عَنْ أَبِيهِ، وَأَمَّا، يَحْيَى فَقَالَ عَنْ أَبِيهِ، عَنْ جَدِّهِ، - قَالَ بَايَعْنَا رَسُولَ اللَّهِ عَلَى السَّمْعِ وَالطَّاعَةِ فِي عُسْرِنَا وَيُسْرِنَا وَمَنْشَطِنَا وَمَكْرَهِنَا وَأَثَرَةٍ عَلَيْنَا وَأَنْ لاَ نُنَازِعَ الأَمْرَ أَهْلَهُ وَأَنْ نَقُومَ بِالْحَقِّ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4154، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4154 (The Book of al-Bay'ah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4154، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
