text: "… كل واحد جزء، دقه واسحقه واعجنه بعسل، والشربة مثقال بماء فاتر، واطبخه وصف ماءه واسقه فاتراً فإنه جيّد. معجون قيوما الطبيب: ينفع من فساد المزاج وورم الكبد، ويقوّي المعدة، ويصفي اللون. أخلاطه: يؤخذ إهليلج والكية من كل واحد وزن خمسة …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 432، يذكر الكي، والتداوي بالعسل، والطب والطبيب، وأعضاء البدن، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 432, that mentions cautery, honey as a remedy, medicine and the physician, the organs of the body, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 432 کا اقتباس جس میں داغنا، شہد سے علاج، طب اور طبیب، اعضائے بدن، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
