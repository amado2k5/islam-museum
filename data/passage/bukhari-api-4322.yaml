label: { ar: "صحيح البخاري 4322 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4322 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4322 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "وَقَالَ اللَّيْثُ حَدَّثَنِي يَحْيَى بْنُ سَعِيدٍ، عَنْ عُمَرَ بْنِ كَثِيرِ بْنِ أَفْلَحَ، عَنْ أَبِي مُحَمَّدٍ، مَوْلَى أَبِي قَتَادَةَ أَنَّ أَبَا قَتَادَةَ، قَالَ لَمَّا كَانَ يَوْمُ حُنَيْنٍ نَظَرْتُ إِلَى رَجُلٍ مِنَ الْمُسْلِمِينَ يُقَاتِلُ رَجُلاً مِنَ الْمُشْرِكِينَ، وَآخَرُ مِنَ الْمُشْرِكِينَ يَخْتِلُهُ مِنْ وَرَائِهِ لِيَقْتُلَهُ، فَأَسْرَعْتُ إِلَى الَّذِي يَخْتِلُهُ فَرَفَعَ يَدَهُ لِيَضْرِبَنِي، وَأَضْرِبُ يَدَهُ، فَقَطَعْتُهَا، ثُمَّ أَخَذَنِي، فَضَمَّنِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4322، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4322 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4322، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
