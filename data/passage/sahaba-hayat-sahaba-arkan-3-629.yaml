text: "… اللّٰه على نفخذ معاذ ثم قال : تكلتك أمك - وماشاء اللّه أن يقول - وهل يكب الناس على مناخرهم فى جهم إلا ما نطقت به ألسنتهم، فمن كان يؤمن باللّه واليوم الآخر فليقل خيرا أو ليسكت عن شر، قولوا …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 3، ص 629، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 3, p. 629, that mentions an act tied to belief in God and the Last Day; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 3، ص 629 کا اقتباس جس میں اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 3, pág. 629, que menciona un acto relacionado con la creencia en Dios y el Último Día; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 3, page 629, mentionnant un acte lié à la croyance en Dieu et au Jour dernier; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Kandhlawi'nin \"Sahabelerin Hayatları\" adlı eserinin 3. cildinin 629. sayfasında, Allah'a ve Ahiret Günü'ne olan imanla ilgili bir olaydan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve bir müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Kandhlawi, \"Kehidupan Para Sahabat,\" Jilid 3, halaman 629, menyebutkan sebuah perbuatan yang berkaitan dengan iman kepada Tuhan dan Hari Kiamat; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
