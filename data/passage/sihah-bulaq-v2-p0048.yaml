text: |-
  * ب اب الواو واليا.)
  • ⁦(كرى)⁩.
  ٥٣٩
  عن الشئ رددته عنه وأكدى الرجل اذا قل خسيره وقوله تعالى وأعطى قليلاوأ كدى أى
  قطع "القليل كذا قولهم كذا ك.اية عن الشتقول فعلت كذاوكذا وتكون كناية
  عن العدد فتنصب ما بعدها على التمييزة قول نه عفدى كذادرهما كماتة ول له عندى عشرون
  درهما كرى لكرى النعاس تقول منه كرى الرجل بالكسر يكرى كرى فهوكر وامر أة.
  سكرية على فعلة وقال
  لا تستمل ولا يكرى مجمالها * ولا يمل من النجوى مناجيها
  وأصيح ذلار كريات الغداة أى ناعسا وأكريت العشاء أى أخرته قال الحمطبئة
  وأكريت المشاء الى سهيل • أو الشعرى فطال بى الاقاء
  وهو يطلع سحراوما أكل بعده فليس بمناء بقول انتظرت مع روفك حتى أيست وأكرنا
  لحديث الليلة أى أطلناه قال ابن أسمر
  وتواهقت أخفافهاطبقا • والفلل لم يفضل ولم يكر
  وأكرى أى زاد وأكرى أى نقص وهو من الاضداد وأنشدابن الاعرابى
  كذى زادمتى ما يكرمنه * فليس وراءم ثقة بزاد
  وكريت النهركريا أى حفوته قال الشيبانى كروت الترطويتها وكرا الفرس كرواوهو
  خيطه بيده في استقامة لا يقيلها نحو بطنه وكرت المرأة فى مشيتها تسكروكروا والكرواء من
  النساء الدقيقة الساقين وقال.
  : ليست بكرواء ولكن خدلم * ولايزلاء ولكن ستهم
  والكراء مم دود لانه مصدر كاريت والدليل على ذلك أنلك تقول رجل مكاروم فاعل انماهومن
  فاعلت وهومن ذوات الواولانك تقول أعط الكرى كروته بالسكسر أى كراءه وقول الشاءر
  لحقت وأصحابى على كل حرّة • مروح نبارى الاحشى المكاريا
  أراد ظل الناقة شبهه بالمكارى والمكارى مخفف وابمع المكارون سقطت الياءلاجتماع
  لساكفن تقول هؤلا المكارون وذهبت الى المكارين ولا تقل المكاربين بالقش_ديدواذا
  أضفت المكارى الى نفسك قلت هذا مكارى بياءمفتوحة مشددة وكذلك الجمع تقول
  هولاء مكارى" سقطت نون الجمع للاضافة وقلبت الواويا وقتحت ياءك وأدغمت لات قبلها
  ساكنا وهذان مكارياى تفتح يا ل"وكذلك القول فى قاض ورام ونحوهما وأكريت الدارفهى
  مكراة والبيت مكرى واكتريت واستكريت وتسكاريت بمعنى والسكرى على فعيل المكارى
  وقال .
  بقال كرى السكرى ظهره والكرىّ أيضا المكترى والكرية على فعيلة شجرة تنبت فى الرمل
  فى الفصب تنبت على نبتة الجعدة بجد ظاهرة والكرة التى تضرب بالسولحان وأصلها
  كرووا لها*عوض وتجمع على كرين وكرين أيضا بالكسروكرات وقال
  كرات غلام فى كساء مؤرنب * تقول منه كروت بالسكرة أكروبها كروا اذا العبت وضر بت بها
  وقال ..
  مرحت يداها للنها ء كانما • تكروبكفى لاعب فى صاع
  والمكترى من الابل اللين السير البطى قال القطامىً *منها المكزى ومنها الاين السادى
