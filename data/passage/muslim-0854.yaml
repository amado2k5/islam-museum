text: "قال رسول الله: خير يوم طلعت عليه الشمس يوم الجمعة، فيه خلق آدم، وفيه أدخل الجنة، وفيه أخرج منها، ولا تقوم الساعة إلا في يوم الجمعة"
summary:
  ar: "رواية أبي هريرة في كتاب الجمعة من صحيح مسلم؛ يوم الجمعة محطة الخلق والجنة والساعة."
  tr: "Sahih Müslim'de yer alan Cuma Kitabı'nda Ebu Hurayra tarafından rivayet edildiğine göre: Cuma, yaratılışın, cennetin ve kıyametin makamıdır."
  id: "Diriwayatkan oleh Abu Hurairah dalam Kitab Jumat di Sahih Muslim: Hari Jumat adalah tempat penciptaan, Surga, dan Hari Kiamat."
