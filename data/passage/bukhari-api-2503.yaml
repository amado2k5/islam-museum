label: { ar: "صحيح البخاري 2503 — ما يجب على المكلف", en: "Sahih al-Bukhari 2503 — what is binding on the person addressed", ur: "صحیح بخاری 2503 — جو مکلف پر واجب ہے", fr: "Sahih al-Bukhari 2503 — ce qui s'impose à la personne responsable", es: "Sahih al-Bujari 2503 — lo que obliga a la persona responsable", tr: "Sahih el-Buhari 2503 — Sorumlu kişi için farz olanlar", id: "Sahih al-Bukhari 2503 — Apa yang wajib dilakukan oleh orang yang bertanggung jawab" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا جُوَيْرِيَةُ بْنُ أَسْمَاءَ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَما ـ عَنِ النَّبِيِّ قَالَ \" مَنْ أَعْتَقَ شِرْكًا لَهُ فِي مَمْلُوكٍ وَجَبَ عَلَيْهِ أَنْ يُعْتِقَ كُلَّهُ، إِنْ كَانَ لَهُ مَالٌ قَدْرَ ثَمَنِهِ يُقَامُ قِيمَةَ عَدْلٍ وَيُعْطَى شُرَكَاؤُهُ حِصَّتَهُمْ وَيُخَلَّى سَبِيلُ الْمُعْتَقِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2503، يرد فيه ذكر ما يجب على المكلف. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 2503 (Partnership), whose wording mentions what is binding on the person addressed. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 2503، جس کے الفاظ میں جو مکلف پر واجب ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2503, dont le texte mentionne ce qui s'impose à la personne responsable. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 2503, cuyo texto menciona lo que obliga a la persona responsable. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 2503 numaralı hadis, sorumlu bir kişi için farz olan şeylerden bahsetmektedir. Bu hadis, farz görevler, ibadetler, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2503, menyebutkan apa yang wajib bagi orang yang bertanggung jawab. Hadits ini disusun oleh seorang peneliti yang ahli dalam kewajiban, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
