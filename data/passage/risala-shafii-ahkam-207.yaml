text: "… أَنْ يَسُنَّ فيما ليس فيه نصُ كتابٍ. - ومنهم من قال : لم يسُنَّ سُنَّةً قَطُّ إلاّ وَلَهَا أَصْلٌ فى الْكِتَابِ، كما كانت سُنتُهُ لِتَبْيِينِ عَدَدِ الصلاةِ وَمَلِهَا، على أصْل مُجْلَةٍ فَرْضِ الصلاةِ، وكذلك ما سَنَّ من البيوع وغيرها من …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 207، يرد فيه ذكر ما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 207, whose wording mentions what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 207 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 207, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 207, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 207. sayfasından bir alıntı, insanlar üzerine farz olan şeylerden bahsetmektedir. Metin, makine tarafından okunabilir taranmış bir kopyadan alınmış olup, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh olan fiiller, haram olan fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 207, menyebutkan apa yang wajib dilakukan oleh manusia. Teks ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin dan dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus mengurutkan perbuatan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
