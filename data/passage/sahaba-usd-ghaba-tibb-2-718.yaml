text: "… الحجاج، فأمر رجلاً معه حَرْبة حجارة فيه ماءٌ، فأخذه بيده فمَجَّ فيه، ودعا فيه مسمومة، فلَصِق بابن عمر عند دفع الناس، فوضع وأعاده، وقال: اسقيه واغسليه فيه. قالت: فتبعته الحربة على ظهر قدمه، فمرض منها أياماً، فأتاه الحجاج يعوده، فقال …"
