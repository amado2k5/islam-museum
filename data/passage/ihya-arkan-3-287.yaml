text: "… فى المقامات ظهر الكس وبطنت حديث أبى رزين العقيلى أنه قال يا رسول اللّٰه ما الايمان ؟ قال أن يكون اللّٰه ورسوله أحب إليك مما سواهما أخرجه أحمد بزيادة فى أوله حديث لا يؤمن أحدكم حتى يكون اللّٰه ورسوله المواهب …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 3، ص 287، يذكر السؤال عن الإيمان وجوابه، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 3, p. 287, that mentions the question about faith and its answer, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 3، ص 287 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 3, pág. 287, que menciona la cuestión de la fe y su respuesta, aquello sin lo cual la fe no está completa; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 3, p. 287), qui aborde la question de la foi et sa réponse, à savoir ce sans quoi elle est incomplète; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Gazali'nin İhya Ulum el-Din (Dinî İlimlerin Yeniden Canlandırılması) adlı eserinin 3. cildinin 287. sayfasından bir alıntı, iman sorusunu ve cevabını, imanın tamamlanması için gerekenleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ghazali, Ihya Ulum al-Din (Kebangkitan Ilmu-ilmu Agama), Jilid 3, halaman 287, membahas pertanyaan tentang iman dan jawabannya, serta apa yang diperlukan agar iman menjadi sempurna. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
