text: "كتاب السنة وأدنَاها إِماطةُ الأذى عن الطَّريقِ، والحياءُ شُعبةٌ مِن الإيمانِ. وتفسيرُ من يقول: الإيمان لا يتفاضلُ، يقول : إنَّ الفرائضَ ليس مِن الإيمان، فميَّزَ أهلُ البدعِ العمل من الإيمان وقالوا: إن فرائضَ اللّٰه عَرَوَلَّ ليس من الإيمان! ومن قال …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 386، يذكر شعب الإيمان، وما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 386, that mentions the branches of faith, what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 386 کا اقتباس جس میں ایمان کی شاخیں، جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de Abd Allah ibn Ahmad, pág. 386, que menciona las ramas de la fe y lo que se considera parte de ella; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Sunna d'Abd Allah ibn Ahmad, p. 386, mentionnant les piliers de la foi et ce qui en fait partie; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, inancın dallarını ve imanın ne olduğunu anlatan 386. sayfadan bir alıntı; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 386, yang menyebutkan cabang-cabang iman dan apa yang membentuk iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
