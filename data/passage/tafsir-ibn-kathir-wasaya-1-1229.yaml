text: "… لأنَّه مظِنَّة التُّهمة أن يكون قد أوصى له بصيغة الإقرار وقد ثبت في الحديث الصحيح أن رسول الله وَالقم قال: إِنَّ اللهَ قَدْ أَعْطَى كُلَّ ذِي حَقِّ حَقَّهُ، فَلَا وَصِيَّةَ لِوَارِثٍ. وهذا مذهب أبي حنيفة ومالك، لوحة ب. صحيح موقوفًا: …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 1229، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 1229, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 1229 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 1, pág. 1229, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Tafsir d'Ibn Kathir (tome 1, p. 1229) mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire des Testaments Browser."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 1229. sayfasından bir alıntı, bir vasiyetname veya nihai miras belgesinden ve geride bıraktığı mal varlığı ve mirastan bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Tafsir Ibn Kathir, Jilid 1, halaman 1229, menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkannya berupa harta warisan; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Shrines Browser."
