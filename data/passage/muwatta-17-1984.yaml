label: { ar: "الموطأ 1984 — مالك: فيما بيع من السلع التي لم يحدث فيها المبتاع شيئا، ثم نفقت وارتفع ثمنها، فإن الغرماء يخيرون بين أن يعطوا رب السلعة الثمن الذي باعها به، وبين أن يسلموا إليه سلعته، وإن نقص ثمنها خير البائع", en: "Muwatta 1984" }
summary:
  ar: "قال مالك: فأما ما بيع من السلع التي لم يحدث فيها المبتاع شيئا، إلا أن تلك السلعة نفقت وارتفع ثمنها، فصاحبها يرغب فيها، والغرماء يريدون إمساكها: فإن الغرماء يخيرون بين أن يعطوا رب السلعة الثمن الذي باعها به، ولا ينقصوه شيئا، وبين أن يسلموا إليه سلعته. وإن كانت السلعة قد نقص ثمنها، فالذي باعها بالخيار، إن شاء أن يأخذ سلعته ولا تباعة له في شيء من مال غريمه، فذلك له. وإن شاء أن يكون غريما من الغرماء، يحاص بحقه، ولا يأخذ سلعته، فذلك له. {cite:muwatta-maruf-1997 p.212}"
