label: { ar: "الموطأ 1984 — مالك: فيما بيع من السلع التي لم يحدث فيها المبتاع شيئا، ثم نفقت وارتفع ثمنها، فإن الغرماء يخيرون بين أن يعطوا رب السلعة الثمن الذي باعها به، وبين أن يسلموا إليه سلعته، وإن نقص ثمنها خير البائع", en: "Muwatta 1984", es: "Muwatta 1984", fr: "Muwatta 1984", ur: "موطا 1984", tr: "Al-Muwatta 1984 — Malik: Alıcının herhangi bir değişiklik yapmadığı, daha sonra popüler hale gelip fiyatı artan mallar konusunda alacaklıların, mal sahibine sattığı fiyatı ödeme veya malları ona iade etme seçeneği vardır. Eğer fiyatı düşmüşse, satıcının seçeneği vardır.", id: "Al-Muwatta 1984 — Malik: Mengenai barang yang dijual di mana pembeli tidak melakukan perubahan apa pun, dan kemudian barang tersebut menjadi populer dan harganya naik, para kreditur memiliki pilihan untuk memberikan kepada pemilik barang harga jualnya, atau menyerahkan barang tersebut kepadanya. Jika harganya turun, penjual memiliki pilihan tersebut." }
summary:
  ar: "قال مالك: فأما ما بيع من السلع التي لم يحدث فيها المبتاع شيئا، إلا أن تلك السلعة نفقت وارتفع ثمنها، فصاحبها يرغب فيها، والغرماء يريدون إمساكها: فإن الغرماء يخيرون بين أن يعطوا رب السلعة الثمن الذي باعها به، ولا ينقصوه شيئا، وبين أن يسلموا إليه سلعته. وإن كانت السلعة قد نقص ثمنها، فالذي باعها بالخيار، إن شاء أن يأخذ سلعته ولا تباعة له في شيء من مال غريمه، فذلك له. وإن شاء أن يكون غريما من الغرماء، يحاص بحقه، ولا يأخذ سلعته، فذلك له. {cite:muwatta-maruf-1997 p.212}"
  tr: "Malik şöyle demiştir: Alıcının hiçbir değişiklik yapmadığı, ancak malların popülerleşmesi ve fiyatının artması sonucu mal sahibinin bunları istediği, alacaklıların ise bunları elinde tutmak istediği mallara gelince: Alacaklıların, mal sahibine malları sattığı fiyattan, herhangi bir indirim yapmadan geri verme veya malları iade etme seçeneği vardır. Malların fiyatı düşmüşse, satıcının seçeneği vardır: Eğer alacaklının mülkiyetine herhangi bir hak iddia etmeden mallarını geri almak isterse, bu onun hakkıdır. Ya da, mallarını almadan alacaklılardan biri olup borca ortak olmak isterse, bu da onun hakkıdır. {cite:muwatta-maruf-1997 s.212}"
  id: "Malik berkata: Adapun barang yang dijual di mana pembeli tidak melakukan perubahan apa pun, kecuali bahwa barang tersebut menjadi populer dan harganya meningkat, sehingga pemiliknya menginginkannya, sementara para kreditur ingin mempertahankannya: para kreditur memiliki pilihan antara memberikan pemilik harga jualnya, tanpa pengurangan apa pun, atau mengembalikan barang tersebut kepadanya. Jika harga barang telah turun, penjual memiliki pilihan: jika ia ingin mengambil kembali barangnya tanpa klaim apa pun atas harta krediturnya, itu adalah haknya. Atau, jika ia ingin menjadi salah satu kreditur, ikut menanggung hutang, tanpa mengambil barangnya, itu juga merupakan haknya. {cite:muwatta-maruf-1997 p.212}"
