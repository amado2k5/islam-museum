label: { ar: "الموطأ 2012 — مالك: فيمن دفع إلى رجل وإلى غلام له مالا قراضا يعملان فيه جميعا: إن ذلك جائز، لأن الربح مال لغلامه، لا يكون الربح للسيد حتى ينتزعه منه، وهو بمنزلة غيره من كسبه", en: "Muwatta 2012", es: "Muwatta 2012", fr: "Muwatta 2012", ur: "موطا 2012", tr: "El-Muvatta 2012 — Malik: Bir kimsenin, bir adama ve kölesine birlikte çalışmaları için borç para vermesi caizdir; çünkü kazanç kölesine aittir ve efendi onu kölesinden alana kadar ona ait değildir ve diğer kazançları gibidir.", id: "Al-Muwatta 2012 — Malik: Mengenai seseorang yang memberikan uang kepada seorang pria dan budaknya sebagai pinjaman untuk bekerja bersama: itu diperbolehkan, karena keuntungan menjadi milik budaknya, dan keuntungan tidak menjadi milik majikan sampai ia mengambilnya darinya, dan itu sama seperti penghasilannya yang lain." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل وإلى غلام له مالا قراضا يعملان فيه جميعا: إن ذلك جائز لا بأس به، لأن الربح مال لغلامه، لا يكون الربح للسيد حتى ينتزعه منه، وهو بمنزلة غيره من كسبه. {cite:muwatta-maruf-1997 p.223}"
  tr: "Malik, bir adamın başka bir adama ve kölesine birlikte yatırım yapmaları için borç para vermesi hakkında şöyle demiştir: Bu caizdir ve bunda bir sakınca yoktur, çünkü kâr kölesine aittir ve efendi onu kölesinden alana kadar kâr ona ait olmaz; bu, efendinin elde ettiği diğer kârlar gibidir. {cite:muwatta-maruf-1997 s.223}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain dan budaknya sebagai pinjaman untuk diinvestasikan bersama: itu diperbolehkan dan tidak ada salahnya, karena keuntungannya menjadi milik budaknya, dan keuntungan itu bukan milik tuannya sampai ia mengambilnya darinya, dan itu sama seperti keuntungan lain yang ia peroleh. {cite:muwatta-maruf-1997 p.223}"
