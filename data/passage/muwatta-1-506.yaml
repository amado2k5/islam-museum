label: { ar: "الموطأ 506 — يوم الخندق: ما صلى النبي الظهر والعصر حتى غابت الشمس؛ ومالك يفضل حديث القاسم", en: "Muwatta 506" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب مرسلاً، في باب صلاة الخوف: ما صلى النبي الظهر والعصر يوم الخندق حتى غابت الشمس. ثم يقول يحيى: قال مالك: وحديث القاسم بن محمد عن صالح بن خوات أحب ما سمعت إليّ في صلاة الخوف. ويذكر المحقق أن الأثر رواه عن مالك أبو مصعب وسويد، وأن في رواية أبي مصعب «حديث يزيد بن رومان عن صالح بن خوات أحسن ما سمعت»، وأن الاختلاف ناتج عن تغير اجتهاد مالك: ينقل عن ابن عبد البر أن مالكاً كان يقول في صلاة الخوف بحديث يزيد بن رومان ثم رجع إلى حديث يحيى بن سعيد عن القاسم، والفرق بينهما أن الإمام في حديث يزيد ينتظر الطائفة الثانية حتى تتم فيسلم بهم، وفي حديث يحيى يسلم إذا صلى بهم الركعة الثانية ثم يقومون فيركعون لأنفسهم (التمهيد 23/166). {cite:muwatta-maruf-1997 p.259}"
