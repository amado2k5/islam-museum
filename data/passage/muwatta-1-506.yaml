label: { ar: "الموطأ 506 — يوم الخندق: ما صلى النبي الظهر والعصر حتى غابت الشمس؛ ومالك يفضل حديث القاسم", en: "Muwatta 506", es: "Muwatta 506", fr: "Muwatta 506", ur: "موطا 506", tr: "El-Muvatta 506 — Hendek Muharebesi günü: Peygamber, güneş batıncaya kadar öğle ve ikindi namazlarını kılmadı; ve Malik, el-Kasım hadisini tercih eder.", id: "Al-Muwatta 506 — Pada hari Perang Parit: Nabi tidak melaksanakan salat Zuhur dan Asar hingga matahari terbenam; dan Malik lebih memilih hadits al-Qasim." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سعيد بن المسيب مرسلاً، في باب صلاة الخوف: ما صلى النبي الظهر والعصر يوم الخندق حتى غابت الشمس. ثم يقول يحيى: قال مالك: وحديث القاسم بن محمد عن صالح بن خوات أحب ما سمعت إليّ في صلاة الخوف. ويذكر المحقق أن الأثر رواه عن مالك أبو مصعب وسويد، وأن في رواية أبي مصعب «حديث يزيد بن رومان عن صالح بن خوات أحسن ما سمعت»، وأن الاختلاف ناتج عن تغير اجتهاد مالك: ينقل عن ابن عبد البر أن مالكاً كان يقول في صلاة الخوف بحديث يزيد بن رومان ثم رجع إلى حديث يحيى بن سعيد عن القاسم، والفرق بينهما أن الإمام في حديث يزيد ينتظر الطائفة الثانية حتى تتم فيسلم بهم، وفي حديث يحيى يسلم إذا صلى بهم الركعة الثانية ثم يقومون فيركعون لأنفسهم ⁦(التمهيد 23/166)⁩. {cite:muwatta-maruf-1997 p.259}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle, Korku Namazı bölümünde, mursal bir hadiste şöyle nakletmiştir: Peygamberimiz, Hendek Muharebesi günü öğle ve ikindi namazlarını güneş batıncaya kadar kılmadı. Sonra Yahya şöyle dedi: Malik dedi ki: Korku Namazı ile ilgili olarak, Salih ibn Khawat'tan rivayet edilen el-Kasım ibn Muhammed hadisi bana en sevgili olanıdır. Araştırmacı, rivayetin Malik'ten Ebu Mus'ab ve Suveyd aracılığıyla nakledildiğini ve Ebu Mus'ab'ın rivayetinde \"Salih ibn Khawat'tan rivayet edilen Yezid ibn Ruman hadisi, işittiğim en güzel hadistir\" denildiğini belirtiyor ve aradaki farkın Malik'in yorumundaki bir değişikliğe bağlı olduğunu söylüyor: İbn Abdülberr'den rivayet edildiğine göre, Malik, Yezid ibn Ruman hadisine dayanarak, korku namazı hakkında şöyle derdi, sonra da el-Kâsım'dan rivayet edilen Yahya ibn Sa'id hadisine dönerdi. Aralarındaki fark şudur ki, Yezid hadisinde imam ikinci grubun namazlarını tamamlamasını bekler ve sonra onlarla birlikte selam verir; Yahya hadisinde ise ikinci rekatı kıldıktan sonra selam verir, sonra da tek tek ayağa kalkıp rükû ederler (el-Temhid 23/166). {cite:muwatta-maruf-1997 s.259}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, yang juga dari Sa'id ibn al-Musayyab, dalam hadits mursal, dalam surah Shalat Ketakutan: Nabi tidak melaksanakan shalat Dzuhur dan Asar pada hari Perang Parit hingga matahari terbenam. Kemudian Yahya berkata: Malik berkata: Hadits al-Qasim ibn Muhammad, dari Salih ibn Khawat, adalah hadits yang paling kusukai mengenai Shalat Ketakutan. Peneliti menyebutkan bahwa riwayat tersebut disampaikan dari Malik oleh Abu Mus'ab dan Suwayd, dan dalam riwayat Abu Mus'ab disebutkan: \"Hadits Yazid ibn Ruman, dari Salih ibn Khawat, adalah hadits terbaik yang pernah saya dengar,\" dan perbedaannya disebabkan oleh perubahan penafsiran Malik: Diriwayatkan dari Ibnu 'Abd al-Barr bahwa Malik biasa mengatakan tentang Shalat Khawatir, berdasarkan hadits Yazid ibn Ruman, kemudian ia kembali pada hadits Yahya ibn Sa'id dari al-Qasim. Perbedaan di antara keduanya adalah bahwa dalam hadits Yazid, imam menunggu kelompok kedua menyelesaikan shalat mereka dan kemudian mengucapkan salam bersama mereka, sedangkan dalam hadits Yahya, ia mengucapkan salam setelah mereka menyelesaikan rakaat kedua, kemudian mereka berdiri dan rukuk masing-masing (al-Tamhid 23/166). {mengutip:muwatta-maruf-1997 hal.259}"
