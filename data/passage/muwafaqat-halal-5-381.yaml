text: "… كان من هذا الباب. وأما تحريم الحلال وتحليل الحرام وما أشبهه فمن حق اللّه تعالى، لأنه تشريع مبتدأ، وإنشاء كلية شرعية ألزمها العباد فليس لهم فيها تحكم ؛ إذ ليس للمقول تحسين ولا تقبيح تحلَّل به أو تحرِّم. فهو مجرد …"
