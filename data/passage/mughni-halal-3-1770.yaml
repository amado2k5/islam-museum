text: "… أَبْنَضُ الْحَلالِ إِلَى اللهِ الطَّلاقُ. وَفي لَفْظٍ: مَا أَحَلَ اللهُ شَيْئاً أَبْغَضَ إلَيْهِ مِنْ الطّلاقِ. رَوَاهُ أَبو دَاوُد وَإِنْمَا يَكُونُ مُبْغَضاً مِنْ غَيْرِ حَاجَةٍ إِلَيْهٍ، الْمَصَالِحِ الْمَنْدُوبِ إلَيْهَا، فَيَكُونُ مَكْرُوها. وَالثَّالِثُ: مُبَاحٌ، وَهُوَ عِنْدَ الْحَاجَةِ إلَيْهِ لِسُوءِ خُلُقِ الْمَرْأَةِ، وَسُوء …"
summary:
