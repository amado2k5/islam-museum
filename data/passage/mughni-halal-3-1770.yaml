text: "… أَبْنَضُ الْحَلالِ إِلَى اللهِ الطَّلاقُ. وَفي لَفْظٍ: مَا أَحَلَ اللهُ شَيْئاً أَبْغَضَ إلَيْهِ مِنْ الطّلاقِ. رَوَاهُ أَبو دَاوُد وَإِنْمَا يَكُونُ مُبْغَضاً مِنْ غَيْرِ حَاجَةٍ إِلَيْهٍ، الْمَصَالِحِ الْمَنْدُوبِ إلَيْهَا، فَيَكُونُ مَكْرُوها. وَالثَّالِثُ: مُبَاحٌ، وَهُوَ عِنْدَ الْحَاجَةِ إلَيْهِ لِسُوءِ خُلُقِ الْمَرْأَةِ، وَسُوء …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1770، يذكر الحلال، وما أُحل، والمباح، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 1770, that mentions the lawful, what was made lawful, the permissible, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 1770 کا اقتباس جس میں حلال، جو حلال کیا گیا، مباح، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
