  fr: "Extrait du Mughni d'Ibn Qudama (tome 3, page 1770) mentionnant le licite, ce qui a été rendu licite, le permis et le déconseillé; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 3. cildinin 1770. sayfasından, caiz olan, izin verilen, caiz olmayan ve mekruh olan konuları ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
