text: "ن الضمير راجع إلى الحد، فحسن معنى الاستعلاء، وقال هنا: فأقم في كتاب الله؛ لأن المراد به حكم الله فهو في المعنى يوجب الاستقرار فيه، وكونه ظرفا يستقر فيه أحكام الله، وهذا أبلغ لدلالته على غاية الانقياد، والعدول من الحكم"
