text: "… قلت : فلانٌ وفلانْ ، وأسيد بن حضير الأنصاري، فقال : كذب من قاله! له أجران. وجمع بين إصبعيه انه لجاهدٌ مجاهدٌ قَلُّ عَرَبِّي مشى بها مِثْلَهُ. رواه مسلم في الصحيح عن محمد بن عبادٍ٣ . ورواه البخاري عن عبد …"
summary:
