label:
  ar: "مسلم 2751c — إن رحمتي سبقت غضبي"
  en: "Muslim 2751c — My mercy outstrips My anger"
  ur: "مسلم 2751c — میری رحمت میرے غضب پر سبقت لے گئی"
  es: "Musulmán 2751c — Mi misericordia supera mi ira"
  fr: "Muslim 2751c — Ma miséricorde surpasse Ma colère"
  tr: "Müslim 2751c — Merhametim gazabımdan önce gelir."
  id: "Muslim 2751c — Rahmat-Ku mendahului murka-Ku"
text: "لما قضى الله الخلق كتب في كتابه على نفسه فهو موضوع عنده إن رحمتي تغلب غضبي ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2751c: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2751c: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2751c: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2751c: Mi misericordia supera mi ira. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim, n° 2751c: « Ma miséricorde surpasse Ma colère. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih Muslim'de 2751c numaralı hadis-i kudsi şöyledir: \"Rahmetim gazabımdan önce gelir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiş olup, hadis-i kudsi araştırmacıları tarafından altı temel hadis külliyatında ve Muvatta'da derlenmiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2751c: “Rahmat-Ku mendahului murka-Ku.” Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan riwayat-riwayatnya dikumpulkan oleh peneliti hadits qudsi dalam enam koleksi hadits kanonik dan Al-Muwatta."
