label: { ar: "سنن أبي داود 4529 — الأب والأبوة", en: "Sunan Abi Dawud 4529 — the father and fatherhood", ur: "سنن ابی داؤد 4529 — باپ اور والدیت", es: "Sunan Abi Dawud 4529 — El padre y la paternidad" }
text: "… عَنْ جَدِّهِ، أَنَسٍ أَنَّ جَارِيَةً، كَانَ عَلَيْهَا أَوْضَاحٌ لَهَا فَرَضَخَ رَأْسَهَا يَهُودِيٌّ بِحَجَرٍ فَدَخَلَ عَلَيْهَا رَسُولُ اللَّهِ وَبِهَا رَمَقٌ فَقَالَ لَهَا \" مَنْ قَتَلَكِ فُلاَنٌ قَتَلَكِ \". فَقَالَتْ لاَ. بِرَأْسِهَا. قَالَ \" مَنْ قَتَلَكِ فُلاَنٌ قَتَلَكِ \". قَالَتْ لاَ. بِرَأْسِهَا. قَالَ \" فُلاَنٌ قَتَلَكِ \". قَالَتْ نَعَمْ. بِرَأْسِهَا فَأَمَرَ بِهِ رَسُولُ اللَّهِ فَقُتِلَ بَيْنَ حَجَرَيْنِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4529، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4529 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4529، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4529 (Tipos de sangre y sabiduría (Kitab Al-Diyat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
