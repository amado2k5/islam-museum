text: |-
  •⁦(ياب اللام)⁩•
  •عزل),.
  ٢١٢
  أردت قيمته من غير جنسه نصبت العين وربما كسرها بعض العرب وكانه منهم غلط قال وقد:
  أجعواعلى واحد الاعدال أه عدل بالكسر والعديل الذى يمادلك فى الوزن والقسدر
  يقسال فلان يعسادل أمره عد الاويقسمه أى يجميل بين أحرين أيهما يأتى قال ابن الرقاع
  فان يك فى مناسمهارجاء • فقد لقيت منامنمها العدالا
  والعدال أن يقول واحد فيها بقسة ويقول الآخرليس فيها بقية وعدل عن الطريق جار
  وانعدل عنه مثله وعدل الفسل عن الابل اذاترل الضراب وعادات بين الشيئين وعدات
  فلانا بفلان اذاسويت بينهما وتعديل الشقويمه بقال عدلته فاعتدل أى قومته فاستقام
  وكل مثقف معتدل وتعديل الشهود أن تقول انمم عدول ولا يقبسل منهاصرف ولاعدل
  فالصرف التوية والعدل الفدية ومنه ق وله تعالى وان تعدل كل عدل لا يؤخذمنها أى تقد كل
  ذداء وقوله تعالى أوعدل ذلك صياما أى فداء ذلك والعادل المشرك الذى يعدل بربه ومنه
  قول تلك المرأة للمجحاج انك القناسط عادل وقولهم وضع فلات على يدى عدل قال ابن السكيت
  هوالعدل بن جزه بن سعد العشيرة وكان ولى شرط تسع وكان تسع اذا أراد قتل رجل دفعه اليه
  فقال النساس وضع على يدى عدل ثم قبسل ذلك لكل شي يئس منه والعدولية فى شعر طرفة
  فينة منسوبة الى قرية بالبحرين يقال لماعد ولى والعدولى الملاح دسل لعدمل
  القديم وكذلك العدمول وقار ١
  ترى جازريه رعدان وناره • عليهاعد اميل الهشيم وصامله
  ندل لعندل البعير الضخم المرأس يستوى فيه المذكر والمؤنث قال الراجز
  كيف ترى فعل طلاحياتها• عنادل الهامات صندلاتها •شداقم الاشداق شدقاتها
  وقال أبوعمر والعندل الطويل والاتى عندلة وأنشد .
  ليت بعصلا تدى السكاب نكهتها • ولا بعندلة تصطك ندياها
  والبلبل يعندل أى يصوت والعندليب طائر يقال ه الهزار ⁦( ذل)⁩ العذل الملامة وقد
  عذلته والاسم العذل بالتحريك يقال عذلنا فلانا فاعتذل أى لام نفه وأعتب ورجل
  عذلة أى يمذل الناس كثيرا مثل ضحكة وهزأة والعاذل اسم اللعرق الذى يسيل منهدم
  الاستحاضة وسئل ابن عباس رضى اللّه عنه عن دم الاستحاضة فتال ذان العاذل يغذو
  تستنخر بثوب ولتصل قوله يغذوأى يسيل وأيلم معتذلات شديدات الحرورجل معذل
  أى يعذل لافراطه فى الجود شد المكثرة ( رجل العرجلة الذين يمشون على أفدامهم
  ولا يقال عرجلة حتى يكونوا جهاعتمناة وقال
  وعرجله شعث الرؤس كأنهم • بنوالجنّ لم تطبخ بتار قدورها
  وقال الخليل العرجلة القطبيع من انخميل قال وهى بلغة تيم الحرجلة رزل العرزال
  - وضع يتخذه الناطورة وق أطراف الشجر فرارا من الاسد والعرزال ما يجمعه الصائد
  فى القترة من القديد رطل لعرطل الضخم ( رقل لعراقيل الدواهى وعراقيل
  الامور وعراقيبها صعابها(عزل، اعتزله وتعزله بمعن وقال الاحوص
  يات عائكة الذى أتعزل • حذر العداوبك الفواد مؤكل
  مصاح
  ١ ى تسخة زيادة الشاعرهى
  زينب بذت الطترية اه
  قوله والعندليب فى القاموص
  والمندليسل عصفور وامرأة
  عندلة خخمة النديين والعندليي
  الهزاروذ كرفى الباءاح
