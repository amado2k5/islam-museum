label: { ar: "جامع الترمذي 3587 — الأب والأبوة", en: "Jami' al-Tirmidhi 3587 — the father and fatherhood", ur: "جامع ترمذی 3587 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3587 — El padre y la paternidad" }
text: "… بْنُ مُكْرَمٍ، حَدَّثَنَا سَعِيدُ بْنُ سُفْيَانَ الْجَحْدَرِيُّ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَعْدَانَ، أَخْبَرَنِي عَاصِمُ بْنُ كُلَيْبٍ الْجَرْمِيُّ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ دَخَلْتُ عَلَى النَّبِيِّ وَهُوَ يُصَلِّي وَقَدْ وَضَعَ يَدَهُ الْيُسْرَى عَلَى فَخِذِهِ الْيُسْرَى وَوَضَعَ يَدَهُ الْيُمْنَى عَلَى فَخِذِهِ الْيُمْنَى وَقَبَضَ أَصَابِعَهُ وَبَسَطَ السَّبَّابَةَ وَهُوَ يَقُولُ \" يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ \". …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3587، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3587 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3587، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3587 (Capítulos sobre la súplica), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
