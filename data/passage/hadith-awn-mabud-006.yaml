text: "الوضوء، ولهذه المغايرة قال الشوكاني تحت حديث علي: فيه استحباب إرسال غرفة من الماء على الناصية، لكن بعد غسل الوجه لا كما يفعله العامة عقيب الفراغ من الوضوء. قلت نعم: إنما يدل حديث علي على ما قال الشيخ العلامة الشوكاني،"
