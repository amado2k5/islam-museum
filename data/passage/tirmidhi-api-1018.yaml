label: { ar: "جامع الترمذي 1018 — دفن وقبر ومرقد", en: "Jami' al-Tirmidhi 1018 — a burial, grave or resting place", ur: "جامع ترمذی 1018 — تدفین، قبر اور مرقد", es: "Jami' al-Tirmidhi 1018 — un lugar de entierro, tumba o descanso." }
text: "… سَمِعْتُ مِنْ رَسُولِ اللَّهِ شَيْئًا مَا نَسِيتُهُ قَالَ \" مَا قَبَضَ اللَّهُ نَبِيًّا إِلاَّ فِي الْمَوْضِعِ الَّذِي يُحِبُّ أَنْ يُدْفَنَ فِيهِ \". ادْفِنُوهُ فِي مَوْضِعِ فِرَاشِهِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ. وَعَبْدُ الرَّحْمَنِ بْنُ أَبِي بَكْرٍ الْمُلَيْكِيُّ يُضَعَّفُ مِنْ قِبَلِ حِفْظِهِ. وَقَدْ رُوِيَ هَذَا الْحَدِيثُ مِنْ غَيْرِ هَذَا الْوَجْهِ فَرَوَاهُ ابْنُ عَبَّاسٍ عَنْ أَبِي …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1018، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1018 (The Book on Jana''iz (Funerals)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1018، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1018 (El Libro de los Funerales), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
