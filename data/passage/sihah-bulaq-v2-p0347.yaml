text: |-
  ١ فى تسحخة زيادة بيت قبل
  مذين
  لا أشتم الضيف الا أن أقول له
  أباتك اللّٰه فى أبيات عمار
  ٢٤٠
  • ⁦(فصل اليي)⁩.
  ويكوى صاحب المغلة ثلاث لذعات بالميسم خلف السرّة رأمخل القوم أى مغلت ابلهم والمغله
  النعجة أو العنزتنتج فى السنة مرّتين وقد أمغلت غنم فلان اذا كانت تلك حالها وهى غنم
  مغال قال القطامى
  بيضاء محطوطة المتنين بهكنة * ريا الروادف لم تغغل بأولاد
  وقال أبوعر والممغل التى تحمل قبل فطام الصبى" وتلذد كل سنة ويقال أمغل بى فلان عند
  السلطان أى ودى بى ومغل فلان بفلان عند فلان اذا وقع فيه يغل مغلاوانه لصاحب مغالة
  مقل المقل عر الدوم والمقلة شحمة العين التى تجمع البياض والسواد أبو عبيد المقل
  بالنتح النظريقال ما مقلته عينى منسذاليوم أبو ع رومقله نظرت اليه بمقاتى ومقله فى الماء
  •ق-لاغمسه وفى الحديث اذا وقع الذياب فى الطعام فامقاوه فاتّ فى أحدجنا حيه سما وفى
  الآخر الشفاءوانه يقدم السمّ ويؤخر الشفاء والملة بالفتح حصاة القسم التى تلقى فى الماء
  ليعرف قدرمايقى كل واحد منهم وذلك عندقلة الماء فى المفاوز وقال
  قذفواسيدهم فى ورطة • قدفك المقلة وسط المعترك
  وأمّا التى فى حديث أبن مسعود فى مسح الحصى قال مرّة وتركها خير من مائة ناقة لقلة
  أى من مائة ناقة يختارها الرجل على عينه ونظره كما يريد ويقال للرجلين هما يتماقلار
  اذا تغاط افى الماء ⁦( .كل)⁩ مكات البثرأى قلّ ماؤها واجتمع فى وسطها فاذااجتمع فيها
  قليلا قلبلا الى وقت النزح الثانى فاسم ذلك الماءمكلة و.كاة يق.ال أعطى مكاة ركيتك أى
  يجة ركيتك والبئرمكول والمع مكل لل ملات الذى بالكسر وملات منه
  أيضأء لملا وملة وعلالة اذاستمته واستمللته كذلك وقال
  لا يستملَ ولا يكرى مجالها * ولا يملّ من النجوى مناجيها
  ورجل ملّ وملول وماولة وذود لة واهر أفعلولة وقال
  انك واته لذ ومنلة • يطرفك الادنى عن الابعد
  وأملد وأمل عليه أى أسامه يقال أدلّ فأمل وأملّ عليه أيضابعنى أهلى يقال أملات
  عليه الكتاب ومللت الثوب بالفتم اذاخطته الخساطة الأولى قبل السكف و.لمات انلخبز
  ملا وا متللتها اذا عملتها فى اللة واسم ذلل الخبز المليل والمملول وكذلك اللعم يقال أطعهذ
  خيز ملة وأطعمنا خبزة مليلا ولا تقل أطع مناملة لان الملة الرماد الحارّ قال الشاءر ١
  أباتك اللّٰه فى أبيات معتسنز * عن المكارم لاعف ولا قار
  صلد الندى زاحد فى كل مكرمة • كأنماضيفه فى ملد النار
  وقال أبو عبيد المله الحفرة نفسها والمليلة حرارة يجدها الرجل وهى حى فى العظم يقال به
  لميلة وملال أيضا با لضم وهو تمامل على ذراشه ويتملل اذالم يستقرمن الوج-ع كانه على ملذ
  ومال اسم موضع وطر بقعمل أى لحب مساوك ومرّفلان يمتلَ اذامر مرّاسر بعا واالة
  بالكسر الدين والشريعة والممول الميل الذى يكتصل به ⁦(مول)⁩ المال معروف وتصغيره
  مويل والعامة تقولمويل بتشديد الباء ورجل مال أى كثير المال وأفند أبو عرو
  أذا كان مالا كان مالامرزأ * ونال نداه كل دان وجانب
  ومل
