text: |-
  قول والمسبك الفيل كامير
  وسكيت كاف القاموس اه
  وتوله من البترف تسحنة من الاباد
  .٠
  قول معكوكا، بفتح الميم وضمها
  ١ه وفى نسجة قبل قوله ويقال
  زيادة والمعسكاة الابل الغسلاظ
  المان اه ولم يذكره
  فى القامواه
  تول والمسكون كتنوداه
  T٤٤
  وقال آخر
  ألسكنى اليها وخير الرسول أعله-م بنواحى انخير
  وقياسه أن يقال ألا كديليكه الاكة وقدحكى ه.ذاعن أبى زيد وهووان كان من الالول ف
  المعن وهو الرسالة فليس عنه فى اللفظلات الالولكفعول والهمزة فاء الفعل الاأن يكون
  مقاو باأو على التوهم
  صل المبسم ( ك لمتسل ما تبقيه انخاتنة وأصل المتك الزماورد والمتكام
  من التاء القى لم تخفض وقرى وأعتدت لهن متكا قال الفرامحدنني شيخ من
  :قيات أهل البصرة أنه الزماورد وقال بعضهم انه الاترج حكاه الاخفس ⁦(محك)⁩ المحك
  الفجاج وقد محلك يدك فهورجل محك ومماحك والمماحكة الملاجة ونماحك الخصمان
  ( مسك أمسكت الشىء وتمسكت يه واستمسكت يه وامتسكت به كله بحن اعتصمت به
  وكذلك مسكت به قسيكا. وقرى ولا تمكوايعصم الكوافر وأسكت عن الكلام أى سكت
  وما تماسك أن قان ذلك أى ما تمالك والمسيك البقيل وكذلك المساك يضم الميم والسين يقال فيه
  امس الدوم الأومساكة أى بخل والم الكأيضا المكان الذى يمك الماء عن أبى زيد ويقال
  فيه مسكة من خير بالضم أى بقية والمسكة أيضامن البتر الدلبة التى لا تحتاج الى طى
  والمسلك من الطيب فارسى معرّب وكانت العرب تسميه المشموم وأماقول الشاعر
  فجات ومن أردانها المك تنفح • فانما أننه لانه ذهب به الى ريح المسك وثوب ممسك
  صبوغ به والمك بالفتح الجدد ومنه قواهم أنا فى مسكاان لم أفعل كذا وكذا والمك
  بالتجريك أسورة من ذيل أوعاج قال جرير ٢
  تزى العبر الحولى جرنابكوعها • لهامسكاءن غبرعاج ولاذبل
  الواحدة مسكة ورجل مسكة مشال همزة أى بخيل ويقال هو الذى لا يعلق بنى فيتخاص
  منه والجع مسن عك) المعك المطال واللى يقال. حكه بدينه أى مطله يه ذه ورجل معك
  أى مطول ومماءن أى عماطل وربما قالوامعكت الاديم أى دلحكته وتمكن الداية أى
  تمرغت ومعكتها أنا تعيكاربقال وقع فى معكوكاه أى فى شرّ( مكلك مكمكت السي مصصة
  ورجل مكان مثل مصان وملجان وهوالدى يرضع الفتم من لومه ولا يحاب وتمككن العظم
  أخرجت مخه ويقال للمحّ المكاكة وفى الحديث لا تمككوا على غرمائكم أى لا تستقصوا
  وامتك الفصيل ما فى ضرع أمّه أى شريه كله ومكة البلد الحوام والمكول مكال وهوثلاث
  كيلمات والكيلجة منادسبعة أثمان منا والمنارطلان والرطل اثفتاعشرة أوقية والاوقية
  استاروثلثا استاد والاستارا ربعة مناقيل ونسق والمثقال درهم وثلاثة أسباع درهم
  والدرهم سنة دوانيق والدائق قيراطات والقبراط طسوبان والطسوج حبنان والحبة
  سدس عن درهم وهو جز ممن تمانية وأربعين بزأ من دوهم والجمع مكاكيك )
  ملكت الشئ أملكم ملكا وملذ الطريق أيضاوسطه وقال
  أفامت على ملن الطريق فلسكه • لها ولمنكوب المطاياجوانيه
  وملكت العجين أملكه ماكابا لفتح اذاشددت هنه قال قيس بن الخطيم
  ملكت بها كوة أخرت فتقها • يرى قائم من دونها ماوراءها
