text: "… الجهضمي، وعبد الرحمن ابن أخي الأصمعي، ومحمد بن يحبى الأزدي وأبي إسحاق إبراهيم بن سفيان الزيادي وغيرهم، روى عنه أبو بكر الحرائطي وأبو الميمون ابن راشد، وأبو الفضل العباس بن محمد الرقي، وأبو بكر ابن مجاهد المقرىء وأبو بكر ابن …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 54، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 54, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 54 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Wafayat al-A'yan de Ibn Khallikan, volumen 1, pág. 54, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Wafayat al-A'yan d'Ibn Khallikan (tome 1, p. 54) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 1. cildinin 54. sayfasında, okuyuculardan bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka) karya Ibn Khallikan, Jilid 1, halaman 54, menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
