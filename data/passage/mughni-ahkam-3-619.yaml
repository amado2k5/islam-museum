text: "… فِي إِبَاحَةِ التُّوْعِ قَبْلَ صوْمِ الْفَرْضِ وَتَحْرِيمِهِ، فَمَنْ أَبَاحَهُ كَرِهَ الْقَضَاءَ فِيهَا، لِيُوَفّرهَا عَلَى التَّطَوْعِ، لِيَنَالَ فَضْلَهُ فِيهَا مَعَ فِعْلِ الْقَضَاءِ، وَمِنْ حَرَّمَهُ لَمْ يَكْرَهْهُ فِيهًا، بَلْ اسْتَحَبَ فِعْلَهُ فِيهَا، لِئَلا يَخْلُوَ مِنْ الْعِيَادَةِ بِالْكُلِّيَّةِ. وَيَقْوَى عِنْدِي أَنْ هَاتَيْنِ الرِّوَايَتَيْنِ …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 619، يرد فيه ذكر الفرض، والمستحب، والتطوع، والمباح، وما حرّم الله ورسوله، والتحريم، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 619, whose wording mentions the obligatory (fard), the recommended (mustahabb), the voluntary act (tatawwu'), the permitted (mubah), what God and His Messenger forbade, forbidding (tahrim), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 619 کا اقتباس جس میں فرض، مستحب، تطوع ⁦(نفلی عمل)⁩، مباح، جو اللہ اور اس کے رسول نے حرام کیا، تحریم، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 3, p. 619, dont le texte mentionne l'obligatoire (fard), le recommandé (mustahabb), l'acte volontaire (tatawwu'), le permis (mubah), ce que Dieu et Son Messager ont interdit, l'interdiction (tahrim), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mughni de Ibn Qudama, volumen digitalizado 3, p. 619, cuyo texto menciona lo obligatorio (fard), lo recomendado (mustahabb), el acto voluntario (tatawwu'), lo permitido (mubah), lo que Dios y Su Mensajero prohibieron, la prohibición (tahrim), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 3. cildinin 619. sayfasından bir alıntı, farz, tavsiye edilen, gönüllü ve caiz olan fiillerin yanı sıra Allah ve Resulü'nün yasakladığı, haram ve mekruh hallerini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Jilid 3, halaman 619, membahas tentang amalan wajib, anjuran, sukarela, dan yang diperbolehkan, serta apa yang dilarang oleh Allah dan Rasul-Nya, larangan-larangan, dan amalan yang tidak disukai. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk dosa-dosa wajib, anjuran, yang tidak disukai, yang dilarang, dan dosa-dosa kecil."
