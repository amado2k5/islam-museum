text: "… إنّا لله وإنّا إليه راجعون، فقال الفضيلُ : أتعرف تفسيرَه ؟ تقول : أنا لله عبد وإليه راجع، فمن عَلِمَ أنَّه لله عبد، وأنَّه إليه راجع، فليعلم أنَّه موقوفٌ، ومن علم أنَّه موقوف، فليعلم أنَّه مسؤول، ومن عَلِمَ أنَّه مسؤولٌ، …"
