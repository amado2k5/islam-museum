label: { ar: "الموطأ 1063 — مالك: بلغه أن رسول الله إذا قضى طوافه بالبيت وركع الركعتين وأراد أن يخرج إلى الصفا والمروة، استلم الركن الأسود قبل أن يخرج", en: "Muwatta 1063" }
summary:
  ar: "يرويه يحيى عن مالك أنه بلغه أن رسول الله كان إذا قضى طوافه بالبيت، وركع الركعتين، وأراد أن يخرج إلى الصفا والمروة، استلم الركن الأسود قبل أن يخرج. ويذكر المحقق أن هذه قطعة من حديث جابر الطويل الذي أخرجه مسلم وغيره من طريق مالك وغيره. {cite:muwatta-maruf-1997 p.491}"
