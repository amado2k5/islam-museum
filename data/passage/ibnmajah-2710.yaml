label:
  ar: "ابن ماجه 2710 — يا ابن آدم جعلت لك نصيبا من مالك حين أخذت بكظمك"
  en: "Ibn Majah 2710 — Son of Adam, I gave you a share of your wealth as death took hold of you"
  ur: "ابن ماجہ 2710 — اے ابن آدم، جب موت نے تجھے آ لیا تو میں نے تیرے مال میں تیرا حصہ رکھا"
text: "يا ابن آدم اثنتان لم تكن لك واحدة منهما جعلت لك نصيبا من مالك حين أخذت بكظمك لأطهرك به وأزكيك وصلاة عبادي عليك بعد انقضاء أجلك ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 2710: يا ابن آدم جعلت لك نصيبا من مالك حين أخذت بكظمك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 2710: Son of Adam, I gave you a share of your wealth as death took hold of you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 2710: اے ابن آدم، جب موت نے تجھے آ لیا تو میں نے تیرے مال میں تیرا حصہ رکھا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
