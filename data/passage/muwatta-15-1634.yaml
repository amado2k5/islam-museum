label: { ar: "الموطأ 1634 — يحيى بن سعيد عن عمرة بنت عبد الرحمن: حبيبة بنت سهل كانت تحت ثابت بن قيس، فجاءت إلى النبي في الغلس تشكو، فقال خذ منها، فجلست في أهلها", en: "Muwatta 1634", es: "Muwatta 1634", fr: "Muwatta 1634", ur: "موطا 1634", tr: "El-Muvatta 1634 — Yahya bin Said, Amrah bint Abdülrahman'dan rivayetle: Habibah bint Sahl, Sabit bin Kays ile evliydi ve gece karanlığında Peygamber'e gelip şikayette bulundu. Peygamber, \"Ondan alın\" dedi ve Habibah ailesiyle birlikte oturdu.", id: "Al-Muwatta 1634 — Yahya bin Saeed berdasarkan riwayat Amrah bint Abd al-Rahman: Habibah bint Sahl menikah dengan Thabit bin Qais, dan dia datang kepada Nabi dalam kegelapan malam sambil mengeluh, lalu beliau berkata, “Ambillah darinya,” dan dia duduk bersama keluarganya." }
text: "خُذْ مِنْها"
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن أنها أخبرته عن حبيبة بنت سهل الأنصاري أنها كانت تحت ثابت بن قيس بن شماس، وأن رسول الله خرج إلى الصبح، فوجد حبيبة بنت سهل عند بابه في الغلس، فقال من هذه؟ فقالت أنا حبيبة بنت سهل يا رسول الله. فقال ما شأنك؟ قالت لا أنا ولا ثابت بن قيس لزوجها. فلما جاء زوجها ثابت بن قيس، قال له رسول الله هذه حبيبة بنت سهل، قد ذكرت ما شاء الله أن تذكر، فقالت حبيبة يا رسول الله كل ما أعطاني عندي، فقال رسول الله لثابت بن قيس خذ منها، فأخذ منها، وجلست في أهلها. {cite:muwatta-maruf-1997 p.74}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Amrah bint Abdülrahman'dan rivayet ettiğine göre, ona Habibah bint Sahl el-Ensari'den bahsetmişti. Habibah, Sabit ibn Kays ibn Şammas ile evliydi ve Resulullah şafak vakti dışarı çıktığında, karanlıkta kapısında Habibah bint Sahl'ı buldu. \"Bu kim?\" diye sordu. Habibah, \"Ey Resulullah, ben Habibah bint Sahl'ım\" diye cevap verdi. Resulullah, \"Sorun nedir?\" diye sordu. Habibah, \"Ne ben ne de Sabit ibn Kays benim kocam değiliz\" dedi. Kocası Sabit ibn Kays geldiğinde, Resulullah ona, \"Bu Habibah bint Sahl'dır. Allah'ın dilediğini söyledi\" dedi. Habibah, \"Ey Resulullah, bana verdiği her şey bendedir\" dedi. Resulullah Sabit ibn Kays'a, \"Onu ondan al\" dedi. Böylece adam onu elinden aldı ve kadın ailesinin yanına oturdu. {cite:muwatta-maruf-1997 s.74}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya binn Sa'id, dari 'Amrah bint 'Abd al-Rahman, bahwa ia bercerita kepada beliau tentang Habibah bint Sahl al-Ansari, bahwa ia menikah dengan Thabit ibn Qays ibn Shammas, dan bahwa Rasulullah SAW keluar pada waktu subuh dan mendapati Habibah bint Sahl di depan pintunya dalam kegelapan. Beliau bertanya, \"Siapakah ini?\" Ia menjawab, \"Aku Habibah bint Sahl, wahai Rasulullah.\" Beliau bertanya, \"Ada apa?\" Ia berkata, \"Aku dan Thabit ibn Qays bukanlah suamiku.\" Ketika suaminya, Thabit ibn Qays, tiba, Rasulullah SAW berkata kepadanya, \"Ini Habibah bint Sahl. Ia telah menyebutkan apa yang Allah kehendaki untuk ia sebutkan.\" Habibah berkata, \"Wahai Rasulullah, segala sesuatu yang diberikannya kepadaku ada padaku.\" Rasulullah SAW berkata kepada Thabit ibn Qays, \"Ambillah darinya.\" Jadi dia mengambilnya darinya, dan dia duduk bersama keluarganya. {cite:muwatta-maruf-1997 p.74}"
