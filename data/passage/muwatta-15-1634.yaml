label: { ar: "الموطأ 1634 — يحيى بن سعيد عن عمرة بنت عبد الرحمن: حبيبة بنت سهل كانت تحت ثابت بن قيس، فجاءت إلى النبي في الغلس تشكو، فقال خذ منها، فجلست في أهلها", en: "Muwatta 1634" }
text: "خُذْ مِنْها"
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن أنها أخبرته عن حبيبة بنت سهل الأنصاري أنها كانت تحت ثابت بن قيس بن شماس، وأن رسول الله خرج إلى الصبح، فوجد حبيبة بنت سهل عند بابه في الغلس، فقال من هذه؟ فقالت أنا حبيبة بنت سهل يا رسول الله. فقال ما شأنك؟ قالت لا أنا ولا ثابت بن قيس لزوجها. فلما جاء زوجها ثابت بن قيس، قال له رسول الله هذه حبيبة بنت سهل، قد ذكرت ما شاء الله أن تذكر، فقالت حبيبة يا رسول الله كل ما أعطاني عندي، فقال رسول الله لثابت بن قيس خذ منها، فأخذ منها، وجلست في أهلها. {cite:muwatta-maruf-1997 p.74}"
