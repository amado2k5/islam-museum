label: { ar: "سنن النسائي 24 — الأب والأبوة", en: "Sunan al-Nasa'i 24 — the father and fatherhood", ur: "سنن نسائی 24 — باپ اور والدیت", es: "Sunan al-Nasa'i 24 — El padre y la paternidad", fr: "Sunan al-Nasa'i 24 — le père et la paternité" }
text: "أَخْبَرَنَا يَحْيَى بْنُ دُرُسْتَ، قَالَ أَنْبَأَنَا أَبُو إِسْمَاعِيلَ، - وَهُوَ الْقَنَّادُ - قَالَ حَدَّثَنِي يَحْيَى بْنُ أَبِي كَثِيرٍ، أَنَّ عَبْدَ اللَّهِ بْنَ أَبِي قَتَادَةَ، حَدَّثَهُ عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِذَا بَالَ أَحَدُكُمْ فَلاَ يَأْخُذْ ذَكَرَهُ بِيَمِينِهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 24، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 24 (The Book of Purification), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 24، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 24 (El Libro de la Purificación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 24 (Le Livre de la Purification), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
