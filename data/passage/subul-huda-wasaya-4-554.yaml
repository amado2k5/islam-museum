text: "… تعالى عنهما أَن نِزَاراً أَباه لما حضرتْه الوفاة أَوصى بنيه وهم : مضر وربيعة وإياد وأنمار فقال : هذه القبة..- لقبة حمراء من أَدَم - وما أَشبهها من المال لمضر. وهذا الخِبَاءُ الأَسود وما أَشبهه لربيعة. وهذه. الخادم وكانت شمطاء …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 554، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
