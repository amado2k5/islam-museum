text: "… الذِّمارِيّ. له صحبة. روى عنه ابنه، وراشد بن سعد. يعد في أهل الشام. روى معاوية بن صالح، عن راشد بن سعد، عن أبي مليكة الذِّماري قال: قال رسول اللٰه بالله : لا يستكمل عبد الإيمانَ حتى يُحِبَّ لأخيه ما يحب …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 1403، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 1403, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 1403 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Usd al-Ghaba de Ibn al-Athir, volumen 1, pág. 1403, que menciona la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 1, p. 1403), évoquant la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin 1. resimli cildinin 1403. sayfasından, imanın tatlılığı ve mükemmelliğinden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 1 bergambar, halaman 1403, yang menyebutkan manisnya dan kesempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
