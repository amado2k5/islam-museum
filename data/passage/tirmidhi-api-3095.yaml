label: { ar: "جامع الترمذي 3095 — ما أُحل، ما حُرّم", en: "Jami' al-Tirmidhi 3095 — what was made lawful; what was made unlawful", ur: "جامع ترمذی 3095 — جو حلال کیا گیا، جو حرام کیا گیا", es: "Jami' al-Tirmidhi 3095 — lo que se hizo lícito; lo que se hizo ilícito" }
text: "… فِي سُورَةِ بَرَاءَةََ : ⁦( اتَّخَذُوا أَحْبَارَهُمْ وَرُهْبَانَهُمْ أَرْبَابًا مِنْ دُونِ اللَّهِ )⁩ قَالَ \" أَمَا إِنَّهُمْ لَمْ يَكُونُوا يَعْبُدُونَهُمْ وَلَكِنَّهُمْ كَانُوا إِذَا أَحَلُّوا لَهُمْ شَيْئًا اسْتَحَلُّوهُ وَإِذَا حَرَّمُوا عَلَيْهِمْ شَيْئًا حَرَّمُوهُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ حَدِيثِ عَبْدِ السَّلاَمِ بْنِ حَرْبٍ. وَغُطَيْفُ بْنُ أَعْيَنَ لَيْسَ بِمَعْرُوفٍ فِي الْحَدِيثِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3095، يذكر ما أُحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3095 (Chapters on Tafsir), that mentions what was made lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3095، جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3095 (Capítulos sobre Tafsir), menciona lo que se ha hecho lícito y lo que se ha hecho ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
