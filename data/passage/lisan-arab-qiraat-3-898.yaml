text: "… قرأ به امام من أمّة القُراء المشتهر ين فى الامصار فقد قرأ بحرف من الحروف السبعة التى نزل القرآن بها ومن قرأ بحرف شاد يخالف المصحف وخالف فى خل. جهور القراء المعروفين فهو غير مصيب وهذا مذهب أهل العلم الذين …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 3، ص 898، يذكر القراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 3, p. 898, that mentions the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 3، ص 898 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
