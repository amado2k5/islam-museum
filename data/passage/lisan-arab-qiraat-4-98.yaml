text: "… والهَلاك يَقَعُ بهم. قال الأزهريّ : قوله لا أَعلم أَحداً قرأَ ظنّ السُّوء، بضم السين ممدودة، صحيح، وقد قرأَ ابن كثير وأَبو عمرو : دائرة السُّوء، بضم السين ممدودة، في سورة براءَة وسورة الفتح، وقراً سائر القرّاء السَّوْء، بفتح السين …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 4، ص 98، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 4, p. 98, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 4، ص 98 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen 4, pág. 98, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
