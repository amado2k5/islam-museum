text: |-
  ⁦(ياب اللام)⁩.
  ٦٧٧
  عن يعقوب وأحال الرجل أتى بالحال وتكلم به وأحال فى متن فرسه مثل حال أى وثب وأحال
  الرجل اذاحالت ابله فلم تمل وأحال عليه بالسوط يضر به أى أقبل قال الشاعر
  وكنت كذئب السو لمارأى * دما بصاحبه يوما أحال على الدم
  أى أقبل عليه وفى المثل تجنب روضة وأحال يعدوأى تردالخصب واختار عليه الشقاء
  وأحال عليه الحول أى حال وأحالت الدار وأحولت أتى عليها حول وكذلات الطعام
  وغيره فهو محيل قال الكميت *ألم تلم على الطلل المحيل * وقال فى المحول
  أأبكاك بالعرف المنزل * وماانت والطال المحول
  من القاصرات الطرف لودبمحول • من الذرّفوق الاتب منهالأثرا
  وأحال عليه بدينه والاسم الحوالة وأحال الرحسل بالمكان وأحول أى أقام به حولا عن
  المكسانى واحال الماءمن الدلوأى صبه وقلبها ومنه قول لبيد ٢
  بحيلون السجال على السجال * وحاوات الشى أى اردته والاسم الحويل قال الكميت
  وذات اسمين والالوان شتى * تحمق وهى كيسة الحويل
  يعنى الرخمة وحوّله فتحوّل وحوّل أيضابنفسه يتعدّى ولا يتعدى قال ذوارمّة يصف الحرباه
  اذا حوّل الظلّ العشى رأيته * حنيفا وفى قرن الضحى يقنصر
  يعنى تحوّل هذا اذا رفعت الظل على أنه الفاعل وفتحت العشى عسلى الظرف ويروى الظل
  العشىّ على أن يكون العشى هو الفاعل والظل مفعول به والمحالة الحيلة يقال المرءيعجز
  لا المالة وقواهم لاممالة أى لا بد بقال الموت آت لامحالة ورجل حولة مثال همزة أى محتال
  قال الفرّاء يقال هو أحول منك أى أكترحيلة وما أحوله ورجل حوّل يتشديدالوا وأى بصي
  تحويل الاموروهو حوّلى قلب واحتال من الحملة واحتال علده بالدين من الحوالة ورحل
  أحون بين اخول وقدحولت عينه واحولت أيضا بتشديد اللام وأح ولتها أناحكاه
  الكسائى" واستحلت الشخص أى نظرت هل يتحرّك واستحال الكلام لما أحاله أى صار محالا
  والارض المستحيلة التى فى حديث مجاهد هى التى ليست بمستوية لانها استحاات عن
  الاستواء إلى العوج وكذلك القوس يل الحيلة بالفتح المعزى السكثيرة والحيلة
  بالكسر الاسم من الاحتيال وهو من الواووكذلك الحيل والحول يقال لاحيل ولاقوّة لغة
  فى حول قال الفراء يقال هو أحيل منك وأحول منك أى أكثر حيلة وما أحيله لغة
  فى ما أحوله قال أبو زيدي قال ماله حيلة ولا محالة ولا احتيال ولا محال بمعنى واحد
  صل الخاء ( بل اتحبل بالتسكين الفساد والبمع خبول يقال لنا فى بن فلان دماء
  وخبول فالخيول قطع الايدى والارج-ل والخبل بالتحريك الجنّ يقال به خبل أى شى من
  أه-ل الارض وقد خبله وخبله واختبله اذا أفسد عقله أوعضوه ورجل مخيل كأنه قد قطعت
  أطرافه ومخبل اسم شاعر من بي سعد ودهر مخبل أى ملتوعلى أهله ومخبل بكسرالباء
  اسم للادهر قال الحرث بن حلزة
