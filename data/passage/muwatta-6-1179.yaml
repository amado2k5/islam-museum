  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın Hac veya Umre sırasında tıraş olurken sakalını ve bıyığını kısalttığını nakletmiştir. {cite:muwatta-maruf-1997 s.531}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar, ketika bercukur saat haji atau umrah, akan memangkas janggut dan kumisnya. {cite:muwatta-maruf-1997 p.531}"
