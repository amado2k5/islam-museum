label: { ar: "مسلم 221 — أما ترضون أن تكونوا شطر أهل الجنة", en: "Muslim 221 — Half the people of Paradise", es: "Musulmán 221 — La mitad de la gente del Paraíso", fr: "Muslim 221 — La moitié des habitants du Paradis", ur: "مسلم 221 - آدھے اہل جنت", tr: "Müslim 221 — Cennet ehlinin yarısı arasında olmaktan memnun olmaz mıydınız?", id: "Muslim 221 — Tidakkah kamu akan senang jika termasuk di antara separuh penghuni surga?" }
text: "قال عبد الله بن مسعود: قال لنا رسول الله: أما ترضون أن تكونوا ربع أهل الجنة؟ فكبرنا، ثم قال: أما ترضون أن تكونوا ثلث أهل الجنة؟ فكبرنا، ثم قال: إني لأرجو أن تكونوا شطر أهل الجنة، وما المسلمون في الكفار إلا كشعرة بيضاء في ثور أسود"
summary:
  ar: "رواية ابن مسعود في باب عدد أهل الجنة من كتاب الإيمان في صحيح مسلم؛ نصيب الأمة من أهل الجنة بشارةً وتكبيراً."
  tr: "İbn Mesud'un Sahih Müslim'deki İman Kitabı'nda yer alan Cennet Ehli'nin Sayısı bölümündeki rivayetine göre; ümmetin cennet ehli içindeki payı hayırlı bir alamet ve büyük bir övgü kaynağıdır."
  id: "Riwayat Ibnu Masoud dalam bab tentang jumlah penghuni surga dari Kitab Iman dalam Sahih Muslim; bagian suatu umat dari penghuni surga adalah pertanda baik dan sumber pujian yang besar."
