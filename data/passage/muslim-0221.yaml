label: { ar: "مسلم 221 — أما ترضون أن تكونوا شطر أهل الجنة", en: "Muslim 221 — Half the people of Paradise" }
text: "قال عبد الله بن مسعود: قال لنا رسول الله: أما ترضون أن تكونوا ربع أهل الجنة؟ فكبرنا، ثم قال: أما ترضون أن تكونوا ثلث أهل الجنة؟ فكبرنا، ثم قال: إني لأرجو أن تكونوا شطر أهل الجنة، وما المسلمون في الكفار إلا كشعرة بيضاء في ثور أسود"
summary:
  ar: "رواية ابن مسعود في باب عدد أهل الجنة من كتاب الإيمان في صحيح مسلم؛ نصيب الأمة من أهل الجنة بشارةً وتكبيراً."
