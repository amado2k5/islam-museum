label:
  ar: "البخاري 1894 — الصوم لي وأنا أجزي به"
  en: "Bukhari 1894 — Fasting is Mine, and I reward it"
  ur: "بخاری 1894 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "الصيام جنة، فلا يرفث ولا يجهل، وإن امرؤ قاتله أو شاتمه فليقل إني صائم. مرتين، والذي نفسي بيده لخلوف فم الصائم أطيب عند الله تعالى من ريح المسك، يترك طعامه وشرابه وشهوته من أجلي، الصيام لي، وأنا أجزي به، والحسنة …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 1894: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 1894: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 1894: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
