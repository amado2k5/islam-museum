label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ٨، المقطع ٢ من ٢", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 8, section 2 of 2", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 8، حصہ 2" }
text: "وإنما ذكرنا حال أبي بكر عند ذكر الآية التي هو مذكور فيها، ولأن الخصوم يسألون عن ذلك، ولحاجتك إليه، ولأن الطاعنين على أبي بكر بمثل هذا هم الطاعنون على رسول الله بما قدمنا وبأمثاله من الآيات التي يسألون …"
summary:
  ar: "مقطع من الباب ٨ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 8 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 8 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
