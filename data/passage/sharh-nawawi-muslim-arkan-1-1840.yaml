text: "… نَخْلِ اشْتُريّ اصْولُهَا وَقَدْ أبْرَتْ، فَإِنَّ ثَمَرَهَا لِلَّذِي إيمَالّ باللهِ. قال: ثُمْ مَاذَا؟ قال: إيمانٌ باللّهِ وَرَسُولِهِ... الإيَمَانُ بِاللهِ، وَالْجهَادُ فِي سَبِيلِهِ. قال: قُلْتُ:. الإِيَمَانُ بِضْعٌ وَسَبْعُونَ أَوْ بِضْعٌ وَسِيتُونَ شُعْبَةً، فَأفْضَلُهَا.... الإِيَمَانُ بِضْعٌ وَسَبْعُونَ شُعْبَةً، وَالْحَيّاءُ شُعْبَةٌ مِنْ... : …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 1840، يذكر الإيمان بضع وسبعون شعبة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 1, p. 1840, that mentions faith as seventy-odd branches, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 1، ص 1840 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 1, pág. 1840, que menciona la fe como setenta y tantos pilares, uno de los artículos de fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Pilares de la Fe lo incluye."
