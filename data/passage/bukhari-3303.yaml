label:
  ar: "البخاري 3303 — صياح الديكة رأت مَلَكاً"
  en: "Bukhari 3303 — The rooster's crow: it saw an angel"
  ur: "بخاری 3303 — مرغ کی بانگ: اس نے فرشتہ دیکھا"
text: "إِذَا سَمِعْتُمْ صِيَاحَ الدِّيَكَةِ فَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ، فَإِنَّهَا رَأَتْ مَلَكًا، وَإِذَا سَمِعْتُمْ نَهِيقَ الْحِمَارِ فَتَعَوَّذُوا بِاللَّهِ مِنَ الشَّيْطَانِ، فَإِنَّهُ رَأَى شَيْطَانًا"
summary:
  ar: "في كتاب بدء الخلق؛ عن أبي هريرة: إذا سمعتم صياح الديكة فاسألوا الله من فضله فإنها رأت ملكاً، وإذا سمعتم نهيق الحمار فتعوذوا بالله من الشيطان فإنه رأى شيطاناً."
  en: "In the Book of the Beginning of Creation, from Abu Hurayra: when you hear the crowing of roosters ask God's bounty, for they have seen an angel; and when you hear the braying of donkeys seek refuge from Satan, for they have seen a Satan."
  ur: "کتاب بدء الخلق میں ابو ہریرہ سے: جب مرغوں کی بانگ سنو تو اللہ کا فضل مانگو کہ انہوں نے فرشتہ دیکھا ہے، اور جب گدھے کی رینک سنو تو شیطان سے پناہ مانگو کہ اس نے شیطان دیکھا ہے۔"
