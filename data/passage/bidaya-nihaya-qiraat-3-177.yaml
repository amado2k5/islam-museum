text: "… هو عبد الرَّحمن بن الحارث، كان الحجّاج استعمله عليها منصرفه منها حين قتل ابن الزبير. قلت: وقد كان عبد الرَّحمن هذا جليلاً نبيلاً، كبير القدر، وكان أحد النفر الأربعة الذين ندبهم عثمان بن عفّان في كتابة المصاحف التي نفذها إلى …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 177، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 177, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 177 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
