label: { ar: "نوادر جحا الكبرى، ص 161 — «أنا لم آخذ السروال حتى أدفع ثمنه»", en: "Nawadir Juha al-Kubra, p. 161 — 'I Did Not Take the Trousers Until I Paid for Them'", ur: "نوادر جحا الکبریٰ، ص 161 — «میں نے شلوار اس وقت تک نہیں لی جب تک اس کی قیمت نہ دی»", fr: "Nawadir Juha al-Kubra, p. 161 — « Je n'ai pas pris le pantalon avant de le payer »", es: "Nawadir Juha al-Kubra, p. 161 — «No tomé los pantalones hasta pagarlos»", tr: "Juha'nın Büyük Fıkraları, s. 161 — “Parasını ödeyene kadar pantolonu almadım.”", id: "Anekdot Hebat Juha, hlm. 161 — “Saya tidak mengambil celana itu sampai saya membayarnya.”" }
text: "… أنا لم آخذِ السروال حتى أدفع ثمنه ذهب الشيخ لأشغالٍ له في بروسة، وسام قطعة جوخ ليعملها سروالاً، بخمسةَ عشر قرشاً. وعندما طواها البائع، وأراد جحا دفع ثمنها، فكّرَ في أنَّ سِروالَهُ جديدٌ لا بأس فيه، وإنَّما إذا أخذ جُبّة …"
summary:
  ar: "في بورصة طلب جحا سروالاً من الجوخ بخمسة عشر قرشاً ثم غيّر رأيه وطلب جبة بالثمن نفسه، فطلب البائع ثمن السروال، فقال جحا إنه لم يأخذ السروال حتى يدفع ثمنه، وتعجب من أهل بورصة. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  en: "In Bursa Juha orders trousers made of broadcloth for fifteen piastres; he changes his mind and asks for a robe instead for the same price; the seller asks for payment for the trousers; Juha says he never took the trousers until he paid for them, and marvels at the people of Bursa. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  ur: "بورصہ میں جحا نے پندرہ قروش میں موٹے کپڑے کی شلوار بنوانے کو کہا، پھر رائے بدل کر اسی قیمت میں جبہ مانگا، بیچنے والے نے شلوار کی قیمت مانگی، تو جحا نے کہا کہ اس نے شلوار تو لی ہی نہیں جب تک اس کی قیمت نہ دے، اور وہ بورصہ والوں پر حیران ہوا۔ {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  fr: "À Bursa, Juha commande un pantalon en drap pour quinze piastres ; il change d'avis et demande une robe pour le même prix ; le vendeur réclame le paiement du pantalon ; Juha dit qu'il n'a jamais pris le pantalon avant de l'avoir payé, et s'étonne des gens de Bursa. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  es: "En Bursa, Juha encarga unos pantalones de paño por quince piastras; cambia de opinión y pide una túnica por el mismo precio; el vendedor reclama el pago de los pantalones; Juha dice que nunca tomó los pantalones hasta pagarlos, y se asombra de la gente de Bursa. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
  tr: "Bursa'da Juha, on beş kuruşa bir çift keçe pantolon istedi, sonra fikrini değiştirip aynı fiyata bir elbise istedi. Satıcı pantolonun fiyatını sordu, ancak Juha parasını ödemeden pantolonu almayacağını söyledi ve Bursa halkını hayrete düşürdü. {cite:juha-nawadir-kubra-djuwaydi s. 161}"
  id: "Di Bursa, Juha meminta celana panjang berbahan felt seharga lima belas piaster, lalu berubah pikiran dan meminta jubah dengan harga yang sama. Penjual menanyakan harga celana panjang tersebut, tetapi Juha berkata dia tidak akan mengambil celana panjang itu sampai dia membayarnya, dan dia kagum dengan penduduk Bursa. {cite:juha-nawadir-kubra-djuwaydi p. 161}"
