text: |-
  ١٢
  •(باب الفا.,.
  •⁦(جرف)⁩•
  ميقات أهل الشأم وكان اسمها مهيعة فأبعف السميل بأهلها فسميت بحفة جفف
  حنف الرحل يجفف بالسكسر جففا أى تكبر فهو جخاف مثل جفاخ ويقال الجخيف أن يفتخر
  الرجل بأكثر مما عنده قال الشاءر
  أراهم محمد اللّه بعد جفيفهم • غراجهم اذمسه القتروافع
  وأمّا الذى فى حديت ابن عمرآنه نام وهو جالس حتى "ممع جخيفه فيقال هو غطيطاه فى النوم
  قال أبو عبيد ولم أسممه فى الصوت الاف هذا الحديث ( دف الكسائ جدف الطائر
  يجدف جدوفا اذا كأن مقه وصافر أيته اذالار كانه يرد جناحيه الى خلفه قال الاصمعى
  ومنه محى مجداف السفينة وجناسا الطائر مجدافاه قال ابن دريد مج داف السفيذة بالدال
  والذال جميعا لغتان فصيحتان والجدف القبروه وابدال الجدث قال الغراء العرب تعقب بين
  الفاء والناءفى اللغة فيقولون جدث وجدف وهى الاجداث والاجداف والجدف أيضا
  مالا يغطى من الشراب وهو فى حديث عمررضى اللّٰه عنه حين سأل المفقود الذى كان الجن
  استهوتهما كان طعامهم فقال الفول ومالم يذكراسم اللّٰه عليه وما كان شرابهم فقال
  الجدف وتفسيره فى الحديث أنه مالا يغطى من الشراب ويقسال نيات يكون باليمن لا يحتاج
  الذى يا كله أن يشرب عليه الماء قال الاصغىّ التجديف هو الكفر بالنعم يقال منه
  جدف تجديفا وقال الاموى هواستقلال ما أعطاه اللهتع الى وفى الحديت لاتجدفوابنعم
  اللّٰه والجنادف بالضم القصير الغليظ الخلقة قال جندل بن الراعى بهجوءدى بن الرفاع
  جنادف لاحق بالرأس منكبه * كانه كودن يوشى بكلاب
  والمرأة جذادفة ذف أبو عمروجسذفت الشى جذفاقطعته والجذاف ما تجذف به
  السفينة وبالدال ايضاقال الناعر بصف ناقة
  تكادان حوّك مجذافها • تسملّ من متناتها باليد
  وقلت لابى الكوث مامجذافها قال السوط جعله كالمجذاف اها وقال أبو عبيد جذف الرجل
  فى مشيته أى أسرع وجذف الطائرافة فى جدف رف) الجرف الاخذ المكثير وقد
  جرفت الشىء أبرفه بالضم جرفا أى ذهبت مكاء أوجله وجرفت الطين كسحته ومنه سمى
  الجرفة والحرف والجرف مثل عسر وعسر ما تجترّفته السيول وأكلته من الارض ومنه
  قوله تعالى على شغارف هار والمع جرفة مثل ععر وحرة وقد جرّقته السيول تجريفا
  ومجزفته قال الشاعر
  فان تسكن الموادت جوقتى • فلم أد هالكاكاني زياد
  والحارف الموت العمام يجترف مال القوم والجارف طاعون كان فى زمن عبد اللّه بن الزبير
  والحرف بالفتح سمة من سمات الابل وهى فى النيخذ بنزلة القرمة فى الانف تقطع جلدة وتجمع
  فى الفنذ كما تجمح على الاتف وسيل جراف بالضم يذهب يكل شئ ورجل جراف أيضايأتى
  على الطعام كله قال جري
  وضع الخز رفقيل أين مجاشع • فشصاجحاظه جراف هبلع
  ويقال اضرب من السكيل جراف وجراف قال الراجز
