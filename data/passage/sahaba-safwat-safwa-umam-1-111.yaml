text: "… عبد شمس، أسلمت. وكان عثمان يكنى في الجاهلية أبا عمرو، فلما وَلَدَتْ له في الإسلام رقيةُ غلاماً سماه عبد اللّٰه، واكتنى به. أسلم عثمان قديماً قبل دخول رسول اللّٰه في دار الأرقم، وهاجر إلى الحبشة الهجرتين، ولما خرج رسول اللّٰه …"
