text: |-
  ٢٨٦
  •⁦(فصل الذال)⁩.
  قوله تبق أى تنظر اليها أنت وترقبها وقوله متداومات أى مدقمات دائرات عاثفات على شئ
  وقال بعضهم تدويم الكاب امعانه فى الهرب والمديم الراعف والدوم شجر المة-ل وااظل
  الدوم الدائم ودومة الجندل اسم حصن وأصحاب اللغة بقولونه بضم الدال وأصصاب
  الحديث يقهوتها وقول لبيديصفبنات الدهر
  وأعصفن بالدومى من رأس-صنه * وأنزان بالاسباب رب المشقر
  يعنى أكيدر صاحب دومة الجندل والمدامة والمدام الحمر واستدمت الامراذا تأنيت به
  وقال قيس بن زهير فلا تعجل بأمرك واستدمه • فاصلى عص الأصكمستديم
  وقال آخر
  وانى على ليلى زارواتى : على ذالافيما يتامسنديمها
  أى منتظر أن تمتبنى بخير والمداومة على الامر المواظبة عليه وأماقولهم مادام فعناه الدوام
  لان مااسم موصول بدام ولا تستعمل الاظرفا كما تسستعمل المصاد رظروفاذول لا أجلس
  مادمت قاعما أى دوام قيامك كمانة ول وردت مقدم الحاج والدودم على وزن الهديدشبه
  الدم يخرج من السمرة وهو الحذال يقال حاضت السهرة اذاخرج-نهاذلك ⁦( دهم)⁩ دهمهم
  الاهريدهمهم وقدد همتهم الخيل قال أبو عبيدة ودهم تهم بالفتح لغة والدهم العدد السكثر
  والجمع الدهوم وقال
  جئنا بدهم يدهم الدهوما • محركان فوقه النجوما .
  والدهمة السواديق ال فرص أدهم وبعير أدهم وناقة دهماءاذا اشتدت ورقته حتى ذهب
  البياض الذى فيه فان زاد على ذلك حتى اشتد السواد فهوجون واتهم الفرس ادهماما
  أى صار أدهم وادهام الشئاد هيماما أى اسوات قال تعالى مدهامتان أى سوداوان من شدة
  الخضرة من الرى والعوب تقول لكل أخضر أسود وسميت قرى العراق سودا لكثرة
  خضرها والدهماء القدر والوطأة الده_ما القديمة والحراء الجديدة والدهما سحنة الرجل
  والشاة الدهماء الحراء الخالصة الجرة ودهما الناس جاءتهم والدهيماء تصغير الدهماء وهى
  الداهية مميت بذلك لاظلامها ويقال للقيد الادهم وقال
  أوعدنى بالسجن والاداهم * رجلى فرجلى شننة المنامم
  والدهيم وأتم الدهيم من أسماء الدواهى وأصل الدهيم اسم ناقة عمروين الريان الذهلى قتسل
  هو واخوته وجات رؤسهم عليها فقيل أثقل من جل الدهيم وأشأم من الدهيم هم
  أرض دهمة أى سهلة ورجل دهتم أى سهل اظلق هكم) التدهكم الانقهام فى الشئء
  والدهكم الشيخ الفانى ⁦(ديم)⁩ أيوزيد الديمة المطر الذى ليس فيه رعد ولابرق وأقلدثلث النهار
  أوثلت الليل وأكثره ما يلغ من العدة والجمع ديم قال لبيد
  باقت وأسبل واكف من ديمة * يروى الهائل دائما تسجامها
  ثم يشسبه به غيره وفى الحديث كان علمديمة وقدديت السجاء تديما قان الشاءريمدح
  رجلايالسيخاء * ان ديواجادوان جادواو بل* والدياميم المفاوزومفازة ديمومة أى دائمة
  العد وأرض مديمة من الدية عن اليزيدكة
  صل لذال ام الذام العيب يه-مزولا يه-مزيقال ذأمه يذأمداذا عابه
  وخقر ممثل ذأبه فهو مذوم قال أوس بن حجر
  فان
