label: { ar: "صحيح البخاري 4108 — الأب والأبوة", en: "Sahih al-Bukhari 4108 — the father and fatherhood", ur: "صحیح بخاری 4108 — باپ اور والدیت", es: "Sahih al-Bukhari 4108 — El padre y la paternidad", fr: "Sahih al-Bukhari 4108 — Le père et la paternité" }
text: "… مُعَاوِيَةُ قَالَ مَنْ كَانَ يُرِيدُ أَنْ يَتَكَلَّمَ فِي هَذَا الأَمْرِ فَلْيُطْلِعْ لَنَا قَرْنَهُ، فَلَنَحْنُ أَحَقُّ بِهِ مِنْهُ وَمِنْ أَبِيهِ. قَالَ حَبِيبُ بْنُ مَسْلَمَةَ فَهَلاَّ أَجَبْتَهُ قَالَ عَبْدُ اللَّهِ فَحَلَلْتُ حُبْوَتِي وَهَمَمْتُ أَنْ أَقُولَ أَحَقُّ بِهَذَا الأَمْرِ مِنْكَ مَنْ قَاتَلَكَ وَأَبَاكَ عَلَى الإِسْلاَمِ. فَخَشِيتُ أَنْ أَقُولَ كَلِمَةً تُفَرِّقُ بَيْنَ الْجَمْعِ، وَتَسْفِكُ الدَّمَ، وَيُحْمَلُ عَنِّي غَيْرُ ذَلِكَ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4108، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4108 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4108، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4108 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4108 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
