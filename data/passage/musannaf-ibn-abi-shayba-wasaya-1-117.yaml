  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 1, page 117, mentionnant un lit de mort, les dernières heures et une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Navigateur des Testaments."
