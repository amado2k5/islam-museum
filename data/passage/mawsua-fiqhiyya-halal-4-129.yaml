text: "… أكان مأكول اللحم أم غير مأكول اللحم. إن اللّه حرم مكة، فلم تحل لأحد قبلى ولا تحل لأحد بعدى، إنما حلت لي ساعة من نهار، لا يختلى خلاها، ولا يعضد شجرها ولا ينفر صيدها. وحرمة صيد الحرم تشمل المُحرم والحلال، …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 4، ص 129، يذكر الحلال، وما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 4, p. 129, that mentions the lawful, what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 4، ص 129 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 4, pág. 129, que menciona lo lícito, lo que se ha declarado lícito, lo que no lo es y lo que se ha declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisée, volume 4, p. 129) mentionnant ce qui est licite, ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été rendu illicite. Cet extrait, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Halal and Haram Browser."
