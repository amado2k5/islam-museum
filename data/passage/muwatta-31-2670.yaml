label: { ar: "الموطأ 2670 — جابر بن عبد الله السلمي: النهي عن الأكل بالشمال والمشي في نعل واحدة والاشتمال الصماء", en: "Muwatta 2670", es: "Muwatta 2670", fr: "Muwatta 2670", ur: "موطا 2670", tr: "El-Muvatta 2670 — Cabir ibn Abdullah el-Sulami: Sol elle yemek yemenin, tek sandaletle yürümenin ve tüm vücudu örten bir elbise giymenin yasaklanması.", id: "Al-Muwatta 2670 — Jabir ibn Abdullah al-Sulami: Larangan makan dengan tangan kiri, berjalan dengan satu sandal, dan mengenakan pakaian yang menutupi seluruh tubuh." }
summary:
  ar: "يروي مالك عن أبي الزبير عن جابر بن عبد الله السلمي أن رسول الله نهى أن يأكل الرجل بشماله، أو يمشي في نعل واحدة، وأن يشتمل الصماء، وأن يحتبي في ثوب واحد كاشفا عن فرجه. {cite:muwatta-maruf-1997 p.507} {cite:muwatta-maruf-1997 p.508}"
  tr: "Malik, Ebu el-Zübeyr'den, o da Cabir ibn Abdullah el-Sulami'den rivayet ettiğine göre, Allah Resulü bir erkeğin sol eliyle yemek yemesini, tek sandaletle yürümesini, bütün vücudu örten bir elbise giymesini veya dizlerini kıvırarak mahrem yerlerini açıkta bırakan tek bir elbise içinde oturmasını yasaklamıştır. {cite:muwatta-maruf-1997 s.507} {cite:muwatta-maruf-1997 s.508}"
  id: "Malik meriwayatkan dari Abu al-Zubayr, dari Jabir ibn Abdullah al-Sulami, bahwa Rasulullah SAW melarang seorang laki-laki makan dengan tangan kiri, atau berjalan dengan satu sandal, atau membungkus dirinya dengan pakaian yang menutupi seluruh tubuh, atau duduk dengan lutut ditekuk dalam satu pakaian yang memperlihatkan kemaluannya. {cite:muwatta-maruf-1997 p.507} {cite:muwatta-maruf-1997 p.508}"
