text: "حَدَّثَنَا مُوسَى، حَدَّثَنَا مُعْتَمِرٌ، عَنْ أَبِيهِ، قَالَ وَحَدَّثَ أَبُو عُثْمَانَ، أَيْضًا عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرٍما ـ قَالَ كُنَّا مَعَ النَّبِيِّ ثَلاَثِينَ وَمِائَةً، فَقَالَ النَّبِيُّ \" هَلْ مَعَ أَحَدٍ مِنْكُمْ طَعَامٌ \". فَإِذَا مَعَ رَجُلٍ صَاعٌ مِنْ طَعَامٍ أَوْ نَحْوُهُ، فَعُجِنَ، ثُمَّ جَاءَ رَجُلٌ مُشْرِكٌ مُشْعَانٌّ طَوِيلٌ بِغَنَمٍ يَسُوقُهَا فَقَالَ النَّبِيُّ \" أَبَيْعٌ أَمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5382، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5382 (Food, Meals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5382، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
