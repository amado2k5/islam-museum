label: { ar: "صحيح مسلم 4682 — مداواة الجراح، مداواة النساء للجرحى", en: "Sahih Muslim 4682 — the treatment of wounds; women treating the wounded", ur: "صحیح مسلم 4682 — زخموں کا علاج، خواتین کا زخمیوں کا علاج", es: "Sahih Muslim 4682 — El tratamiento de las heridas; mujeres que tratan a los heridos", fr: "Sahih Muslim 4682 — Le traitement des plaies; les femmes soignant les blessés" }
text: "حَدَّثَنَا يَحْيَى بْنُ يَحْيَى، أَخْبَرَنَا جَعْفَرُ بْنُ سُلَيْمَانَ، عَنْ ثَابِتٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ كَانَ رَسُولُ اللَّهِ يَغْزُو بِأُمِّ سُلَيْمٍ وَنِسْوَةٍ مِنَ الأَنْصَارِ مَعَهُ إِذَا غَزَا فَيَسْقِينَ الْمَاءَ وَيُدَاوِينَ الْجَرْحَى."
summary:
  ar: "حديث في صحيح مسلم، رقم 4682، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 4682 (The Book of Jihad and Expeditions), that mentions the treatment of wounds, women treating the wounded, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 4682، جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4682 (El Libro de la Yihad y las Expediciones), menciona el tratamiento de heridas, a las mujeres que atendían a los heridos y la búsqueda de atención médica. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 4682 (Livre du Jihad et des Expéditions), mentionne le traitement des blessures, notamment les soins prodigués par les femmes aux blessés, et la recherche de soins. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
