text: "… وائت بهم، اللّهم اهدِ دوساً وأنت بهم. أخرجاه في الصحيحين وعن عبد اللّٰه بن عمر: أن عبد اللّٰه بن أُبَيٍّ لما توفي جاء ابنه إلى النبي يَ فقال: أعطني قميصك أكفنه فيه، وصلِّ عليه، واستغفر له. فأعطاه قميصه وقال: آذِنِّي …"
summary:
