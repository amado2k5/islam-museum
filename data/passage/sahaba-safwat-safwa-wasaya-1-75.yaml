  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 1, p. 75) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 1. cildinin 75. sayfasından bir alıntı, bir mezar, bir türbe ve bir türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 1, halaman 75, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
