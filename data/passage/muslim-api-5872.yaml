label: { ar: "صحيح مسلم 5872 — الأب والأبوة", en: "Sahih Muslim 5872 — the father and fatherhood", ur: "صحیح مسلم 5872 — باپ اور والدیت", es: "Sahih Muslim 5872 — El padre y la paternidad" }
text: "حَدَّثَنَا عَلِيُّ بْنُ خَشْرَمٍ، أَخْبَرَنَا عِيسَى، - يَعْنِي ابْنَ يُونُسَ - عَنْ شُعْبَةَ، عَنْ سِمَاكِ، بْنِ حَرْبٍ عَنْ عَلْقَمَةَ بْنِ وَائِلٍ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ قَالَ \" لاَ تَقُولُوا الْكَرْمُ. وَلَكِنْ قُولُوا الْحَبَلَةُ \". يَعْنِي الْعِنَبَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5872، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5872 (The Book Concerning the Use of Correct Words), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5872، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5872 (El Libro sobre el Uso de las Palabras Correctas), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
