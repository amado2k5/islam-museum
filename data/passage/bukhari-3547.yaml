label: { ar: "البخاري 3547 — صفة النبي عند أنس", en: "Bukhari 3547 — Anas's description of the Prophet" }
text: "كان ربعة من القوم ليس بالطويل ولا بالقصير، أزهر اللون ليس بأبيض أمهق ولا آدم، ليس بجعد قطط ولا سبط رجل، أنزل عليه وهو ابن أربعين، فلبث بمكة عشر سنين ينزل عليه وبالمدينة عشر سنين، وقُبض وليس في رأسه ولحيته عشرون شعرة بيضاء"
summary:
  ar: "في كتاب فضائل أصحاب النبي باب صفة النبي؛ وصف أنس بن مالك الشهير لخلقة النبي: القامة الربعة واللون الأزهر والشعر بين الجعد والسبط، مع ضبط سن البعثة والإقامة بمكة والمدينة وعدد شعيرات الشيب، وذيله خبر ربيعة عن احمرار شعره من الطيب. من أنفس نصوص الشمائل في الصحيح."
