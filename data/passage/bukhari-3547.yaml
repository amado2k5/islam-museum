text: "كان ربعة من القوم ليس بالطويل ولا بالقصير، أزهر اللون ليس بأبيض أمهق ولا آدم، ليس بجعد قطط ولا سبط رجل، أنزل عليه وهو ابن أربعين، فلبث بمكة عشر سنين ينزل عليه وبالمدينة عشر سنين، وقُبض وليس في رأسه ولحيته عشرون شعرة بيضاء"
summary:
  ar: "في كتاب فضائل أصحاب النبي باب صفة النبي؛ وصف أنس بن مالك الشهير لخلقة النبي: القامة الربعة واللون الأزهر والشعر بين الجعد والسبط، مع ضبط سن البعثة والإقامة بمكة والمدينة وعدد شعيرات الشيب، وذيله خبر ربيعة عن احمرار شعره من الطيب. من أنفس نصوص الشمائل في الصحيح."
  tr: "\"Peygamberin Sahabelerinin Faziletleri\" adlı kitapta, Peygamberin fiziksel özelliklerini anlatan bölümde, Enes ibn Malik, Peygamberin görünüşünü şu şekilde tarif etmiştir: orta boylu, açık tenli ve kıvırcık ile düz arasında bir saç yapısına sahipti. Ayrıca Peygamberin ilk vahyi aldığı yaşı, Mekke ve Medine'deki ikametgahını ve beyaz saçlarının sayısını da belirtmiştir. Bunu, Rabi'ah'ın saçlarının parfümden dolayı kızardığına dair anlatımı takip eder. Bu, Sahih külliyatındaki Peygamberin özelliklerine dair en değerli metinler arasındadır."
  id: "Dalam kitab \"Keutamaan Para Sahabat Nabi,\" pada bab tentang deskripsi fisik Nabi, Anas bin Malik terkenal menggambarkan penampilan Nabi: tinggi badan sedang, kulit cerah, dan rambut keriting hingga lurus. Ia juga menyebutkan usia Nabi saat menerima wahyu pertama, tempat tinggalnya di Mekah dan Madinah, dan jumlah uban. Kemudian diikuti oleh catatan Rabi'ah tentang rambut Nabi yang berubah merah karena parfum. Ini termasuk salah satu teks paling berharga tentang karakteristik Nabi dalam kumpulan Sahih."
