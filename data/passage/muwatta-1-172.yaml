label: { ar: "الموطأ 172 — رؤيا عبد الله بن زيد وبدء الأذان", en: "Muwatta 172" }
text: "إن هاتين لنحو مما يريد رسول الله. فقيل: ألا تؤذنون للصلاة؟"
summary:
  ar: "أول حديث في باب ما جاء في النداء للصلاة. يرويه يحيى عن مالك عن يحيى بن سعيد الأنصاري مرسلاً: أراد النبي أن يتخذ خشبتين يُضرب بهما ليجتمع الناس للصلاة، فرأى عبد الله بن زيد الأنصاري من بني الحارث بن الخزرج في منامه خشبتين فقال إنهما نحو مما يريد رسول الله، فقيل له: ألا تؤذنون للصلاة؟ فأتى النبي حين استيقظ وذكر له ذلك، فأمر بالأذان. ويذكر المحقق أن المشهور من الروايات الحديث المرفوع المسند من طريق محمد بن عبد الله بن زيد عن أبيه، ويحيل على الترمذي (189) وتعليقه عليه. {cite:muwatta-maruf-1997 p.113}"
