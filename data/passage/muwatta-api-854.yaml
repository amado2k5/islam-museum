label: { ar: "موطأ مالك 854 — الأب والأبوة", en: "Muwatta Malik 854 — the father and fatherhood", ur: "موطأ مالک 854 — باپ اور والدیت" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّ صَاحِبَ، هَدْىِ رَسُولِ اللَّهِ قَالَ يَا رَسُولَ اللَّهِ كَيْفَ أَصْنَعُ بِمَا عَطِبَ مِنَ الْهَدْىِ فَقَالَ لَهُ رَسُولُ اللَّهِ \" كُلُّ بَدَنَةٍ عَطِبَتْ مِنَ الْهَدْىِ فَانْحَرْهَا ثُمَّ أَلْقِ قِلاَدَتَهَا فِي دَمِهَا ثُمَّ خَلِّ بَيْنَهَا وَبَيْنَ النَّاسِ يَأْكُلُونَهَا \"."
summary:
  ar: "حديث في موطأ مالك، رقم 854، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 854 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 854، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
