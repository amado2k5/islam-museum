label: { ar: "صحيح البخاري 3034 — الأب والأبوة", en: "Sahih al-Bukhari 3034 — the father and fatherhood", ur: "صحیح بخاری 3034 — باپ اور والدیت", es: "Sahih al-Bukhari 3034 — El padre y la paternidad" }
text: "… أَبُو إِسْحَاقَ، عَنِ الْبَرَاءِ ـ قَالَ رَأَيْتُ النَّبِيَّ يَوْمَ الْخَنْدَقِ وَهُوَ يَنْقُلُ التُّرَابَ حَتَّى وَارَى التُّرَابُ شَعَرَ صَدْرِهِ، وَكَانَ رَجُلاً كَثِيرَ الشَّعَرِ وَهْوَ يَرْتَجِزُ بِرَجَزِ عَبْدِ اللَّهِ اللَّهُمَّ لَوْلاَ أَنْتَ مَا اهْتَدَيْنَا وَلاَ تَصَدَّقْنَا وَلاَ صَلَّيْنَا فَأَنْزِلَنْ سَكِينَةً عَلَيْنَا وَثَبِّتِ الأَقْدَامَ إِنْ لاَقَيْنَا إِنَّ الأَعْدَاءَ قَدْ بَغَوْا عَلَيْنَا إِذَا أَرَادُوا فِتْنَةً أَبَيْنَا يَرْفَعُ بِهَا صَوْتَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3034، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3034 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3034، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3034 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
