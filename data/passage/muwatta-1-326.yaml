label: { ar: "الموطأ 326 — ابن عمر يسلم بين الركعتين والركعة في الوتر", en: "Muwatta 326", es: "Muwatta 326", fr: "Muwatta 326", ur: "موطا 326", tr: "El-Muvatta 326 — İbn Ömer, iki rekat arasındaki selamlamayı ve Vitr namazındaki rekatı anlatır.", id: "Al-Muwatta 326 — Ibnu Umar mengucapkan taslim di antara dua rakaat dan rakaat Witir." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب الأمر بالوتر: كان عبد الله بن عمر يسلّم بين الركعتين والركعة في الوتر حتى إنه يأمر ببعض حاجته بينهما. ويخرّجه المحقق عند البخاري (991) والشافعي والبيهقي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.184}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Vitr namazının kılınması emri bölümünde şöyle denmektedir: Abdullah ibn Umar, Vitr namazının iki rekatı ve bir rekatı arasında selam verirdi; öyle ki, bu arada bazı ihtiyaçlarını giderirdi. Bu rivayet, Malik'in sahabelerinin rivayet zincirleriyle Buhari (991), Şafiî ve Beyhaki'nin hadis külliyatlarında bulunmaktadır. {cite:muwatta-maruf-1997 s.184}"
  id: "Riwayat yang dinarasikan oleh Malik berdasarkan Nafi’, dalam bab tentang perintah untuk melaksanakan salat Witir: Abdullah ibn Umar biasa memberi salam di antara dua rakaat dan rakaat Witir, sampai-sampai ia mengurus beberapa kebutuhannya di antara keduanya. Riwayat ini ditemukan dalam kumpulan al-Bukhari (991), al-Shafi’i, dan al-Bayhaqi, melalui sanad para sahabat Malik. {cite:muwatta-maruf-1997 p.184}"
