label: { ar: "سنن أبي داود 1688 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 1688 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 1688 — جو حلال کیا گیا، جو حلال نہیں" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ سَوَّارٍ الْمِصْرِيُّ، حَدَّثَنَا عَبْدَةُ، عَنْ عَبْدِ الْمَلِكِ، عَنْ عَطَاءٍ، عَنْ أَبِي هُرَيْرَةَ، فِي الْمَرْأَةِ تَصَدَّقُ مِنْ بَيْتِ زَوْجِهَا قَالَ لاَ إِلاَّ مِنْ قُوتِهَا وَالأَجْرُ بَيْنَهُمَا وَلاَ يَحِلُّ لَهَا أَنْ تَصَدَّقَ مِنْ مَالِ زَوْجِهَا إِلاَّ بِإِذْنِهِ. قَالَ أَبُو دَاوُدَ هَذَا يُضَعِّفُ حَدِيثَ هَمَّامٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1688، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1688 (Zakat (Kitab Al-Zakat)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1688، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
