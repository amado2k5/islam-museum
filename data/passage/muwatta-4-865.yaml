label: { ar: "الموطأ 865 — مالك: لم أسمع أحداً من أهل العلم والفقه ينهى عن صيام يوم الجمعة، وصيامه حسن، وقد رأى بعض أهل العلم يصومه ويتحراه", en: "Muwatta 865", es: "Muwatta 865", fr: "Muwatta 865", ur: "موطا 865", tr: "El-Muvatta 865 — Malik: İlim ve fıkıh âlimlerinden hiçbirinin cuma günü oruç tutmayı yasakladığını duymadım, aksine cuma günü oruç tutmak faydalıdır. Bazı âlimler, insanların cuma günü oruç tuttuklarını ve bunu özellikle aradıklarını görmüşlerdir.", id: "Al-Muwatta 865 — Malik: Aku belum pernah mendengar seorang pun di antara para ulama ilmu fiqih melarang puasa pada hari Jumat, dan berpuasa pada hari itu baik. Sebagian ulama telah melihat orang-orang berpuasa pada hari itu dan mencarinya." }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول: لم أسمع أحداً من أهل العلم والفقه ومن يقتدى به ينهى عن صيام يوم الجمعة، وصيامه حسن، وقد رأى بعض أهل العلم يصومه، وأراه كان يتحراه. ويذكر المحقق أن الحديث في الصحيحين ⁦(البخاري 3/54، ومسلم 3/154)⁩ من حديث أبي هريرة مرفوعاً: لا يصومن أحدكم يوم الجمعة إلا يوماً قبله أو بعده، وأن كتاب الصيام ينتهي عند هذا الباب في نسخة م وص وه، ويأتي بعده باب ما جاء في ليلة القدر ثم كتاب الاعتكاف. {cite:muwatta-maruf-1997 p.417}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: \"Fıkıh âlimleri ve takipçileri arasında cuma günü oruç tutmayı yasaklayan kimseyi duymadım. Cuma günü oruç tutmak iyidir ve bazı âlimlerin cuma günü oruç tuttuklarını gördüm ve sanırım bunu yapmaya istekliydiler.\" Araştırmacı, hadisin iki Sahih'te (Buhari 3/54 ve Müslim 3/154) Ebu Hurayra'dan rivayetle Peygamber'e atfedildiğini belirtiyor: \"Sizden hiç kimse cuma günü oruç tutmasın, ancak ondan önceki veya sonraki bir gün oruç tutarsanız durum değişir.\" Ayrıca, Oruç Kitabı'nın M, S ve H el yazmalarında bu noktada sona erdiğini ve ardından Kadir Gecesi ile ilgili bir bölümün ve daha sonra İtikaf Kitabı'nın geldiğini belirtiyor. {cite:muwatta-maruf-1997 s.417}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Saya belum pernah mendengar seorang pun di antara para ulama fiqih dan orang-orang yang diikuti melarang puasa pada hari Jumat. Puasa pada hari Jumat itu baik, dan saya telah melihat beberapa ulama berpuasa pada hari itu, dan saya pikir mereka sangat ingin melakukannya. Peneliti menyebutkan bahwa hadits tersebut terdapat dalam dua kitab Sahih (Bukhari 3/54, dan Muslim 3/154) dari Abu Hurayrah, yang dinisbahkan kepada Nabi: “Tidak seorang pun di antara kalian boleh berpuasa pada hari Jumat kecuali jika kalian berpuasa sehari sebelumnya atau sesudahnya.” Ia juga mencatat bahwa Kitab Puasa berakhir pada titik ini dalam manuskrip M, S, dan H, dan diikuti oleh bab tentang Malam Lailatul Qadar dan kemudian Kitab I'tikaf (pengasingan di masjid). {cite:muwatta-maruf-1997 p.417}"
