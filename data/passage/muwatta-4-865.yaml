label: { ar: "الموطأ 865 — مالك: لم أسمع أحداً من أهل العلم والفقه ينهى عن صيام يوم الجمعة، وصيامه حسن، وقد رأى بعض أهل العلم يصومه ويتحراه", en: "Muwatta 865" }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول: لم أسمع أحداً من أهل العلم والفقه ومن يقتدى به ينهى عن صيام يوم الجمعة، وصيامه حسن، وقد رأى بعض أهل العلم يصومه، وأراه كان يتحراه. ويذكر المحقق أن الحديث في الصحيحين (البخاري 3/54، ومسلم 3/154) من حديث أبي هريرة مرفوعاً: لا يصومن أحدكم يوم الجمعة إلا يوماً قبله أو بعده، وأن كتاب الصيام ينتهي عند هذا الباب في نسخة م وص وه، ويأتي بعده باب ما جاء في ليلة القدر ثم كتاب الاعتكاف. {cite:muwatta-maruf-1997 p.417}"
