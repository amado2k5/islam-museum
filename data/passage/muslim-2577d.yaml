label:
  ar: "مسلم 2577d — يا عبادي إني حرمت الظلم على نفسي"
  en: "Muslim 2577d — My servants, I have forbidden injustice for Myself"
  ur: "مسلم 2577d — اے میرے بندو، میں نے ظلم کو اپنے اوپر حرام کیا ہے"
text: "إني حرمت على نفسي الظلم وعلى عبادي فلا تظالموا . وساق الحديث بنحوه وحديث أبي إدريس الذي ذكرناه أتم من هذا ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2577d: يا عبادي إني حرمت الظلم على نفسي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2577d: My servants, I have forbidden injustice for Myself. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2577d: اے میرے بندو، میں نے ظلم کو اپنے اوپر حرام کیا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
