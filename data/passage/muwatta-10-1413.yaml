label: { ar: "الموطأ 1413 — يزيد بن عبد الله بن قسيط عن سعيد بن المسيب: ذكاة ما في بطن الذبيحة في ذكاة أمه إذا تم خلقه ونبت شعره", en: "Muwatta 1413", es: "Muwatta 1413", fr: "Muwatta 1413", ur: "موطا 1413", tr: "El-Muvatta 1413 — Yezid ibn Abdullah ibn Kusayt, Said ibn el-Musayyab'dan rivayetle: Kesilen hayvanın rahmindeki şeyin kesilmesi, yaratılışı tamamlanmış ve tüyleri çıkmışsa, annesinin kesilmesiyle aynıdır.", id: "Al-Muwatta 1413 — Yazid ibn Abdullah ibn Qusayt, berdasarkan riwayat Saeed ibn al-Musayyab: Penyembelihan janin yang ada di dalam rahim hewan yang disembelih sama dengan penyembelihan induknya, jika pembentukannya sempurna dan bulunya telah tumbuh." }
summary:
  ar: "يروي مالك عن يزيد بن عبد الله بن قسيط الليثي عن سعيد بن المسيب أنه كان يقول ذكاة ما في بطن الذبيحة في ذكاة أمه، إذا كان قد تم خلقه ونبت شعره. {cite:muwatta-maruf-1997 p.633}"
  tr: "Malik, Yazid ibn Abdullah ibn Qusayt al-Laythi'den, o da Sa'id ibn al-Musayyab'dan rivayetle, şöyle buyurduğunu aktarır: Kurbanlık hayvanın karnındaki şeyin ritüel olarak kesilmesi, annesinin ritüel olarak kesilmesine eşdeğerdir; yeter ki hayvan tam olarak gelişmiş ve tüyleri çıkmış olsun. {cite:muwatta-maruf-1997 s.633}"
  id: "Malik meriwayatkan dari Yazid ibn Abdullah ibn Qusayt al-Laythi, dari Sa'id ibn al-Musayyab, bahwa beliau biasa berkata: Penyembelihan ritual janin yang ada di dalam rahim hewan kurban sama dengan penyembelihan ritual induknya, dengan syarat janin tersebut telah terbentuk sempurna dan bulunya telah tumbuh. {cite:muwatta-maruf-1997 p.633}"
