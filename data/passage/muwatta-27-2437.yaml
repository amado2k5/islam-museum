label: { ar: "الموطأ 2437 — مالك: الأجير والخادم إذا سرقا لا قطع عليهما لأنهما خائنان", en: "Muwatta 2437", es: "Muwatta 2437", fr: "Muwatta 2437", ur: "موطا 2437", tr: "El-Muvatta 2437 — Malik: Eğer bir ücretli işçi veya hizmetçi hırsızlık yaparsa, hain oldukları için uzuvlarının kesilmesiyle cezalandırılmazlar.", id: "Al-Muwatta 2437 — Malik: Jika seorang pekerja upahan atau seorang pelayan mencuri, mereka tidak boleh dihukum dengan amputasi karena mereka adalah pengkhianat." }
summary:
  ar: "قال مالك: ليس على الأجير ولا على الرجل يكونان مع القوم يخدمانهم، إن سرقاهم، قطع؛ لأن حالهما ليست بحال السارق، وإنما حالهما حال الخائن، وليس على الخائن قطع. {cite:muwatta-maruf-1997 p.406}"
  tr: "Malik şöyle dedi: Ne ücretli bir işçi ne de bir grup insana hizmet eden bir kişi, onlardan hırsızlık yaparsa uzuvlarının kesilmesine tabi tutulmaz; çünkü onların durumu hırsızın değil, hainin durumudur ve hainin uzuvlarının kesilmesine tabi tutulmaz. {cite:muwatta-maruf-1997 s.406}"
  id: "Malik berkata: Baik pekerja upahan maupun orang yang melayani sekelompok orang tidak dapat dihukum amputasi jika mereka mencuri dari mereka, karena keadaan mereka bukanlah seperti pencuri, melainkan seperti pengkhianat, dan pengkhianat tidak dapat dihukum amputasi. {cite:muwatta-maruf-1997 p.406}"
