text: "- - وتلانمائة. ومات فى صبيحة يوم الاربعاء الثامن عشر من شهر ربيع الآخر سنة ثلاثين وأربمائة، ودفن من الغد فى مقبرة المالكية إلى جنب أبى طالب المكى -وهو كان أوصى بذلك، وضلينا عليه فى جامع الرصافة. وكان الجمع كثيراً …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 4، ص 949، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 4, p. 949, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 4، ص 949 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Baghdad de al-Khatib al-Baghdadi, volumen 4, pág. 949, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh Baghdad d'al-Khatib al-Baghdadi, volume 4, page 949, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "Al-Khatib Al-Baghdadi'nin Bağdat Tarihi, Resimli Cilt 4, s. 949'dan bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsetmektedir; makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Baghdad karya Al-Khatib Al-Baghdadi, Jilid 4 Bergambar, hlm. 949, menyebutkan surat wasiat atau testamen terakhir, pemakaman, kuburan, dan makam; dari edisi faksimili yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh Peramban Surat Wasiat, Warisan, Barang Antik, dan Makam."
