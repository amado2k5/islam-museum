text: "- - وتلانمائة. ومات فى صبيحة يوم الاربعاء الثامن عشر من شهر ربيع الآخر سنة ثلاثين وأربمائة، ودفن من الغد فى مقبرة المالكية إلى جنب أبى طالب المكى -وهو كان أوصى بذلك، وضلينا عليه فى جامع الرصافة. وكان الجمع كثيراً …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 4، ص 949، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
