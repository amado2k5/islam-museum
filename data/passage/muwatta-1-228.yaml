label: { ar: "الموطأ 228 — ابن عمر: من صلى خلف الإمام كفته قراءة الإمام", en: "Muwatta 228", es: "Muwatta 228", fr: "Muwatta 228", ur: "موطا 228", tr: "El-Muvatta 228 — İbn Ömer: İmamın arkasında namaz kılan kimseye imamın okuduğu Kur'an yeterlidir.", id: "Al-Muwatta 228 — Ibn Umar: Barang siapa yang shalat di belakang imam, maka bacaan imam sudah cukup baginya." }
text: "إذا صلى أحدكم خلف الإمام فحسبه قراءة الإمام، وإذا صلى وحده فليقرأ"
summary:
  ar: "أول أثر في باب ترك القراءة خلف الإمام فيما جهر فيه. يرويه يحيى عن مالك عن نافع: كان عبد الله بن عمر إذا سُئل هل يقرأ أحد خلف الإمام قال إن من صلى خلف الإمام كفته قراءة الإمام، ومن صلى وحده فليقرأ، وكان هو لا يقرأ خلف الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.138}"
  tr: "Yüksek sesle kılınan namazlarda imamın arkasında okumamanın caiz olup olmadığına dair ilk hadis, Yahya'nın Malik'ten, o da Nafi'den rivayet ettiği bir hadistir: Abdullah ibn Umar'a imamın arkasında okumanın caiz olup olmadığı sorulduğunda, \"İmamın arkasında namaz kılan kimseye imamın okuması yeterlidir. Tek başına namaz kılan ise okumalıdır.\" derdi. Kendisi imamın arkasında okumazdı. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve İbn Vahb tarafından rivayet edildiğini, el-Tahavi ve Muhammed ibn el-Hasan tarafından da kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.138}"
  id: "Hadits pertama mengenai kebolehan tidak membaca di belakang imam dalam salat berjamaah diriwayatkan oleh Yahya dari Malik dari Nafi': Ketika Abdullah ibn Umar ditanya apakah ada yang boleh membaca di belakang imam, beliau menjawab, \"Barangsiapa yang salat di belakang imam, bacaan imam sudah cukup baginya. Barangsiapa yang salat sendiri hendaknya membaca.\" Beliau sendiri tidak membaca di belakang imam. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Ibn Wahb, sebagaimana dicatat oleh al-Tahawi dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.138}"
