label: { ar: "الموطأ 228 — ابن عمر: من صلى خلف الإمام كفته قراءة الإمام", en: "Muwatta 228" }
text: "إذا صلى أحدكم خلف الإمام فحسبه قراءة الإمام، وإذا صلى وحده فليقرأ"
summary:
  ar: "أول أثر في باب ترك القراءة خلف الإمام فيما جهر فيه. يرويه يحيى عن مالك عن نافع: كان عبد الله بن عمر إذا سُئل هل يقرأ أحد خلف الإمام قال إن من صلى خلف الإمام كفته قراءة الإمام، ومن صلى وحده فليقرأ، وكان هو لا يقرأ خلف الإمام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.138}"
