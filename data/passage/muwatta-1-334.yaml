summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن القاسم أنه سمع عبد الله بن عامر بن ربيعة يقول إنه ليوتر وهو يسمع الإقامة، أو بعد الفجر، يشك عبد الرحمن أي ذلك قال؛ وهو في باب الوتر بعد الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.185}"
