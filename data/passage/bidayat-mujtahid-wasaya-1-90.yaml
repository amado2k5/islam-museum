text: "… أو غير مجبر كغيره، ووصي كل ولي يقوم مقامه، فإن كان الولي له الإجبار؛ فكذلك لوصيه. وإن كان يحتاج إلى إذنها فوصيه كذلك؛ لأنه قائم مقامه، فهو كالوكيل. المغني."
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 90، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 1, p. 90, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 1، ص 90 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de Bidayat al-Mujtahid de Ibn Rushd, volumen 1, pág. 90, que menciona un testamento o consejo de despedida; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Bidayat al-Mujtahid d'Ibn Rushd (tome 1, p. 90), mentionnant un testament ou des conseils d'adieu; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 1. cildinin 90. sayfasından, vasiyetnameye dair bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibn Rushd, Jilid 1, halaman 90, yang menyebutkan wasiat terakhir; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
