text: "… ٢٠٢٠]. وفي الصحيحين عنه وجيع أنه قال: مَنْ قَامَ لَيْلَةَ الْقَدْرِ إِيمَانا واحْتِسَاباً ، غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ [البخاري: ١٩٠١]، وقد أخبر سبحانه أنها خيرٌ مِن ألف شهر، وأنَّه أنزل فيها القرآن . وإن أراد أن الليلة المعينة …"
