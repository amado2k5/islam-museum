label: { ar: "الموطأ 137 — مالك: من تيمم ودخل في الصلاة ثم جاء الماء أتمها", en: "Muwatta 137", es: "Muwatta 137", fr: "Muwatta 137", ur: "موطا 137", tr: "El-Muvatta 137 — Malik: Kim teyemmüm yapar ve namaza başlar, sonra su gelirse namazı tamamlar.", id: "Al-Muwatta 137 — Malik: Barang siapa yang bertahta dan memulai salat, kemudian air datang, maka ia telah menyelesaikan salatnya." }
summary:
  ar: "قول لمالك يرويه يحيى في باب التيمم: من تيمم حين لم يجد الماء وكبّر ودخل في الصلاة ثم طلع عليه إنسان معه ماء، فلا يقطع صلاته بل يتمها بالتيمم، ويتوضأ لما يستقبل من الصلوات. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.100}"
  tr: "Yahya'nın teyemmüm bölümünde naklettiği, Malik'e atfedilen bir hadis şöyledir: Su bulunmadığı halde teyemmüm yapan, tekbir getiren ve namaza başlayan bir kimse, daha sonra su getiren biriyle karşılaşırsa, namazını yarıda kesmemeli, teyemmüm yaparak namazını tamamlamalı ve sonraki namazlar için abdest almalıdır. Editör, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.100}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dalam bab tentang tayammum: Jika seseorang melakukan tayammum ketika air tidak tersedia, mengucapkan takbir (Allahu Akbar), dan memulai salat, kemudian seseorang datang membawa air, ia tidak boleh menghentikan salatnya tetapi harus menyelesaikannya dengan tayammum, dan kemudian berwudu untuk salat selanjutnya. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.100}"
