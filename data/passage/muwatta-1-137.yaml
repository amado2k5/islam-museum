summary:
  ar: "قول لمالك يرويه يحيى في باب التيمم: من تيمم حين لم يجد الماء وكبّر ودخل في الصلاة ثم طلع عليه إنسان معه ماء، فلا يقطع صلاته بل يتمها بالتيمم، ويتوضأ لما يستقبل من الصلوات. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.100}"
