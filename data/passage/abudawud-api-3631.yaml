label: { ar: "سنن أبي داود 3631 — الأب والأبوة", en: "Sunan Abi Dawud 3631 — the father and fatherhood", ur: "سنن ابی داؤد 3631 — باپ اور والدیت", es: "Sunan Abi Dawud 3631 — El padre y la paternidad" }
text: "… مُحَمَّدُ بْنُ قُدَامَةَ، وَمُؤَمَّلُ بْنُ هِشَامٍ، - قَالَ ابْنُ قُدَامَةَ - حَدَّثَنِي إِسْمَاعِيلُ، عَنْ بَهْزِ بْنِ حَكِيمٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، - قَالَ ابْنُ قُدَامَةَ - إِنَّ أَخَاهُ أَوْ عَمَّهُ وَقَالَ مُؤَمَّلٌ - إِنَّهُ قَامَ إِلَى النَّبِيِّ وَهُوَ يَخْطُبُ فَقَالَ جِيرَانِي بِمَا أَخَذُوا. فَأَعْرَضَ عَنْهُ مَرَّتَيْنِ ثُمَّ ذَكَرَ شَيْئًا فَقَالَ النَّبِيُّ \" خَلُّوا لَهُ عَنْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3631، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3631 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3631، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3631 (El Libro del Juez (Kitab Al-Aqdiyah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
