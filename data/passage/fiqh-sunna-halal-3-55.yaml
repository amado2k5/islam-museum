  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 55, that mentions what was made unlawful, prohibition, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 55 کا اقتباس جس میں جو حرام کیا گیا، تحریم، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
