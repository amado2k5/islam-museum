text: "… هذه الأحاديث لم يثبت منها شيء. قال الحافظ بن حجر العسقلاني : لم يثبت في تحريمه حديث صحيح ولا حسن. ولهذا اختلف الفقهاء في حكمه. فمنهم من حرمه. ومنهم من أباحه. فمن حرمه أبو حنيفة ومالك وأحمد. وقال الشافعي وبعض …"
