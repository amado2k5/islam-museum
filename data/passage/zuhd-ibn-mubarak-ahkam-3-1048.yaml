text: "… ينامون. كانوا يستحبون إذا ختموا محمد بن حجاج القرآن من الليل أن يختموه فى الركعتين كانوا يستحبون الزيادة إبراهيم ويكرهون النقصان كانوا يشبهون صلاة مجاهد العشى بصلاة الليل كانوا يقولون أو يرون أن النخعى المشى فى الليلة المظلمة موجبة كانوا …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 1048، يرد فيه ذكر المستحب، وما كرهه الفقهاء، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 1048, whose wording mentions the recommended (mustahabb), what the jurists disliked, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 1048 کا اقتباس جس میں مستحب، جسے فقہاء نے مکروہ کہا، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ibn al-Mubarak, volume numérisé 3, p. 1048, dont le texte mentionne le recommandé (mustahabb), ce que les juristes ont réprouvé, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Zuhd de Ibn al-Mubarak, volumen digitalizado 3, p. 1048, cuyo texto menciona lo recomendado (mustahabb), lo que los juristas reprobaron, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zühd) adlı eserinin 3. cildinin 1048. sayfasından, tavsiye edilen amelleri, fıkıhçılarca hoş karşılanmayan amelleri ve mekruh sayılan amelleri sıralayan bir bölüm. Bu bölüm, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu bölüm, farz ameller, görevler, itaat amelleri, tavsiye edilen amelleri, hoş karşılanmayan amelleri, haram amelleri ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Asketisme), Jilid 3, halaman 1048, yang menyebutkan amalan yang dianjurkan, amalan yang tidak disukai oleh ahli hukum Islam, dan amalan yang dianggap tidak disukai. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
