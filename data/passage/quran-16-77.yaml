  ur: { text: "اور آسمانوں اور زمین کا علم خدا ہی کو ہے اور (خدا کے نزدیک) قیامت کا آنا یوں ہے جیسے آنکھ کا جھپکنا بلکہ اس سے بھی جلد تر۔ کچھ شک نہیں کہ خدا ہر چیز پر قادر ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
