text: "… هُوَ الذي يُطْلِقُنِي بِيَدِهِ، فلما مَرّ عليه رسولُ اللّهِ لِفِ خارجاً إلى صلاة الصبحِ، أطلقه. قال ابن هشام: أقام أبو لُبَابَةَ مُرْتَبِطاً بِالجِذْعِ سِتَّ ليالٍ، تأتيه امرأتُهُ في كُلِّ وقتِ صلاةٍ فَتَحُلَّه للصَّلاَةِ، ثم يعود، فيرتبطُ بِالجِذْعِ، فيما حدَّثني بعض …"
