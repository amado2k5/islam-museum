label: { ar: "صحيح مسلم 2983 — الأب والأبوة", en: "Sahih Muslim 2983 — the father and fatherhood", ur: "صحیح مسلم 2983 — باپ اور والدیت", es: "Sahih Muslim 2983 — El padre y la paternidad" }
text: "وَحَدَّثَنِيهِ عَبْدُ الْمَلِكِ بْنُ شُعَيْبٍ، حَدَّثَنِي أَبِي، عَنْ جَدِّي، حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ بْنِ الزُّبَيْرِ، أَنَّ عَائِشَةَ، زَوْجَ النَّبِيِّ أَخْبَرَتْهُ عَنْ رَسُولِ اللَّهِ فِي تَمَتُّعِهِ بِالْحَجِّ إِلَى الْعُمْرَةِ وَتَمَتُّعِ النَّاسِ مَعَهُ بِمِثْلِ الَّذِي أَخْبَرَنِي سَالِمُ بْنُ عَبْدِ اللَّهِ عَنْ عَبْدِ اللَّهِ - - عَنْ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2983، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2983 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2983، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2983 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
