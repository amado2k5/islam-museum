label: { ar: "صحيح مسلم 2943 — ما أُحل", en: "Sahih Muslim 2943 — what was made lawful", ur: "صحیح مسلم 2943 — جو حلال کیا گیا", es: "Sahih Muslim 2943 — lo que se hizo lícito", fr: "Sahih Muslim 2943 — ce qui a été rendu licite" }
text: "… الْحِجَّةِ فَأَمَرَنَا أَنْ نَحِلَّ. قَالَ عَطَاءٌ قَالَ \" حِلُّوا وَأَصِيبُوا النِّسَاءَ \". قَالَ عَطَاءٌ وَلَمْ يَعْزِمْ عَلَيْهِمْ وَلَكِنْ أَحَلَّهُنَّ لَهُمْ. فَقُلْنَا لَمَّا لَمْ يَكُنْ بَيْنَنَا وَبَيْنَ عَرَفَةَ إِلاَّ خَمْسٌ أَمَرَنَا أَنْ نُفْضِيَ إِلَى نِسَائِنَا فَنَأْتِيَ عَرَفَةَ تَقْطُرُ مَذَاكِيرُنَا الْمَنِيَّ. قَالَ يَقُولُ جَابِرٌ بِيَدِهِ - كَأَنِّي أَنْظُرُ إِلَى قَوْلِهِ بِيَدِهِ يُحَرِّكُهَا - قَالَ فَقَامَ النَّبِيُّ فِينَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2943، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 2943 (The Book of Pilgrimage), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 2943، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 2943 (El Libro de la Peregrinación), menciona lo que se considera lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 2943 (Le Livre du Pèlerinage), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
