text: "… قال: اللهم ربنا لك الحمد ملء السموات وملء الأرض، وملء ما شئت من شيء بعد. ونحن نستحب هذا، ونقول به ! لأنه موافق ما روى عن النبى وَلظم، وهم يكرهون هذا كراهية شديدة. ب أخيرنا الربيع قال: أخبرنا الشافعى قال …"
