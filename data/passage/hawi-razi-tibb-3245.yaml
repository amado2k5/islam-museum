text: "الأدوية المفردة باب القاف ورماده يبرىء مع الزفت داء الثعلب. ابن ماسويه: لحم القنفذ مانع من النقرس الانتصابي، وينفع من الجذام ومن السل والتشنج ووجع الكلى؛ ولا سيما إذا جفف وشرب، ومن الاستسقاء المتمكن. واللحمي فإن كان يفعل ذلك فقوته …"
