text: "… الدنيا والآخرة، ومن فضلك الواسع رزقا حلالا طيباً لا تفقرنا بعده إلى أحد سواك أبداً، تزيدنا لك بهما شكراً وإليك فاقة وفقراً، وبك عمن سواك غفى وتعفناً. حدثنا أبو بكر بن مالك قال ثنا عبد اللّٰه بن أحمد بن حنبل …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 225، يذكر الحلال، والطيبات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 225, that mentions the lawful, the good things; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 225 کا اقتباس جس میں حلال، پاکیزہ چیزیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 2, pág. 225, que menciona lo lícito y lo bueno; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Hilyat al-Awliya' d'Abu Nu'aym, volume 2, page 225, mentionnant les choses licites et vertueuses; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Halal and Haram Browser."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 2. cildinin 225. sayfasından, helal ve iyi olan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid 2 bergambar, halaman 225, yang menyebutkan apa yang diperbolehkan dan baik; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
