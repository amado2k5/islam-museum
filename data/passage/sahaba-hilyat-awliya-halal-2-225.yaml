text: "… الدنيا والآخرة، ومن فضلك الواسع رزقا حلالا طيباً لا تفقرنا بعده إلى أحد سواك أبداً، تزيدنا لك بهما شكراً وإليك فاقة وفقراً، وبك عمن سواك غفى وتعفناً. حدثنا أبو بكر بن مالك قال ثنا عبد اللّٰه بن أحمد بن حنبل …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 225، يذكر الحلال، والطيبات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
