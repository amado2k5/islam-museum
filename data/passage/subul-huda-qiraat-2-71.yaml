text: "… القراء السبعة. والثانى : هو على بن حمزة بن عبد اللّٰه الكمائى الكوفى المتوفى سنة ه من أئمة النحو واللغة وهو أيضاً أحد القراء السبعة ولعل الأخوة بينهما ترجع إلى اشتغالهما بالقراءات. وقد أخذ الكسانُى من قراءة حمزة. انظر ترجمة …"
