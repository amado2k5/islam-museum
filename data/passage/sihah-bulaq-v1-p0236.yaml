text: |-
  ١٠٥
  يقول ظاهر ناحسن فى الصلح وقلوبنا فاسدة كما ينبت على النشر أويارالجربى وتحته داء
  فى أجوافها منه والنشر بالتحريك المنتشر وفى الحديث أتملك نشر الماء ويقال رأيت
  القوم نشرا أى منتشرين واكنسى البازى ريشانشرا أى منتشراطو يلا والنشرأيضا
  أن تنتشر الغتم بالليل فترعى والنشوار أيضاما تيقيه الداية من العلف قارسى معرب وإلناشرة
  واحدة النواشر وهى عروق باطن الذراع وناشرة اسم رجل وقال
  لقد عيل الايتام طعنة ناشره * أناشر لازاات يمينت آشره
  ونشر المتاع وغيره ينشره نشرابسطه ومنه ريخ نشورورياح نشر ونشر الميت ينشر
  نشورا أى عاش بعد الموت قال الاعشى
  حتى يقول الناس ممارأوا * ياعجبا للميت الناشر
  ومنه يوم النشور وأنشرهم اللّٰه أى أحياهم ومنه قرأ ابن عباس رضى اللّٰه عنه كبف
  ننشرها واحتج بقوه تعالى ثم اذاشاء أنشره وقرأ الحسن تشرها قال الفرّاءذهب الى
  نشروا لطى قال والوحه أن يقول أنشرهم اللّٰه فنشرواهم وأنشد الاصمعى لابى ذؤيب
  لو كان مدحة حى أنشرت أحدا * أحي أبونك الشم الاماديح
  ونشرت الخشبة أنشرها اذا قطعتها بالمنشار والنشارة ماسقط منه ونشرت الخبر أنشره
  وأنشره اذا أذعته وصحف منشرة شدد اللمكثرة والتنشير من النشرة وهى كالتعويذ والرقية
  قال الكلابي فاذانشر المسفوع كان * كأنما أنشط من عقال
  أى يذهب عنه سريعا وفى الحديث أنه قال فلعل طبا أصابه يعن سحراثم نشره بة-ل أعوذ
  برب الناس أى رقاه وكذلك اذا كتب له النشرة واتشر الخبر أى ذاع وانتشر الرجسل أنعظ
  والانتشار الانتفاخ فى عصب الدابة وقديكون ذلك من التعب والعصبة التى تنشرهى
  العجاجة نصر نصره اللّٰه على عدوه بنصره نصرا والاسم النصرة والنصير الناصر
  والبهع الانصار مشل شريف وأشراف وججمع الناصر نصر مثل صاحب وصحب واستنصره
  على عدوه أى سأله أن ينصره عليه وتناصر وانصر بعضه-م بعضا ونصر الغيث الارض أى
  غائها ونصرت الارض فهى منصورة أى مطرت وقال يخاطب خيلا
  اذا دخل الشهر الحرام فجاوزى * بلادغيم وانصرى أرض عامر
  وانتصر منه انتقم ونصر أ بوقبيلة من بنى أسدوهو نصر بن قعين قال الشاعر
  شأتك قعين غنها وسمينها • وأنت السه السفلى اذادعيت نصر
  والنصر العطاء قال رؤية
  انى واسطارسطرن سمارا*لقائل يانصر نصر انصرا
  ونصران قرية بالشام تنسب اليها التصارى ويقال ناصرة والنصارى جمع نصران ونصرانة
  مثل الندامى جمع ندمان وندمانة قال الشاعر
  فكلنا هما خرت وأ-جدرأسها • كما أ-يجدت تصرانة لم تحنف .
  ولكن لم يستعمل نصران الابياء النسب لانهم قالوارجل نصرانى واهر أة نصرانية ونصره
  جعدله نصرانيا وفى الحديث فأبواه يهوّدانه ويتصرانه ⁦(نضر)⁩ النضير الذهب
  ويجمع على أنضر قال الكميت
  ١٠٢
  صراح
