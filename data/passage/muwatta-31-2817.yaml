label: { ar: "الموطأ 2817 — عيسى بن مريم والخنزير: أخاف أن أعود لساني النطق بالسوء", en: "Muwatta 2817", es: "Muwatta 2817", fr: "Muwatta 2817", ur: "موطا 2817", tr: "Al-Muwatta 2817 — İsa, Meryem oğlu, ve domuz: Dilimin kötülük söylemeye alışmasından korkuyorum.", id: "Al-Muwatta 2817 — Isa, putra Maryam, dan babi: Aku khawatir lidahku akan terbiasa mengucapkan kata-kata jahat." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن عيسى بن مريم لقي خنزيرا في الطريق فقال له: امض بسلام. فقيل له: أتقول هذا لخنزير؟ فقال: إني أخاف أن أعود لساني النطق بالسوء. {cite:muwatta-maruf-1997 p.580} {cite:muwatta-maruf-1997 p.581}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Meryem oğlu İsa'nın yolda bir domuzla karşılaştığını ve ona, \"Huzur içinde git\" dediğini anlatır. Ona, \"Bunu bir domuza mı söylüyorsun?\" diye soruldu. O da, \"Dilimin kötülük söylemeye alışmasından korkuyorum\" diye cevap verdi. {cite:muwatta-maruf-1997 s.580} {cite:muwatta-maruf-1997 s.581}"
  id: "Malik meriwayatkan dari Yahya bin Sa'id bahwa Isa, putra Maryam, bertemu dengan seekor babi di jalan dan berkata kepadanya, \"Pergilah dengan damai.\" Beliau ditanya, \"Apakah engkau mengatakan ini kepada seekor babi?\" Beliau menjawab, \"Aku khawatir lidahku akan terbiasa berbicara yang buruk.\" {cite:muwatta-maruf-1997 p.580} {cite:muwatta-maruf-1997 p.581}"
