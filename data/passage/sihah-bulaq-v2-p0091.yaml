text: |-
  ٤٩٦
  •⁦(فصل السين)⁩•
  .⁦(منا)⁩.
  والقروم السوامى الفحول الرافعة رؤ-ها وتقول رددت من سامى طرفه أداقصرت اليه
  نفسه وأزات نخونه وبأوه وسما الفحمل اذاسطا على شوله سمارة وأمافول الشاءر
  سماء الاله فوق سبع سمائيا* نجمعه عسلى فعائل كماتجمع سحابة على يحائب تم رده الى
  الاصل ولم ينون كما ينون جوار ثم نصب اليساء الاخيرة لانه جعله بنزلة الصحيح الذى لا يتصرف
  كما تقول هررت بصاتف ياذى والسماءظهرالفرس لارتفاعه وعلوه وقال
  وأحر كالديباج أماعاؤه • فرياوأما أرضه فحول
  وسنماوة كل شئ شخصه قال العجاج• سهاوة الهلال حتى احة وقفاء وسهارة البيت سقفه
  قال علقمة• سمماوته من أتحمى معصب • والسماوموضع بالبادية ناحية العواصم
  وسميت فلانازيدا وسميته بزيد يمعنى وأسميته مثلدفتسمى به وتقول هذاسمى تفلان اذا رافق
  اممه أسمه كما نقول هو كنيه وقوله تعالى هل تعلم له سميا أى تطير ا يسستق مثل اسمه ويقال
  مساميا يساميه وأسمى فلان أى أخذناحية السماوة والسماة الصيادون مقل الرماة وقد
  سموا واستموا اذاخرجو اللصيد والاسم مشتق من سموت لانه تنويه ورفعة واسمت قديره افع
  والذاهب منه الواولات جعه أسها وتصغيره هىّ واختلف فى تقدير أصلدفقسال بعضهم فعل
  وقال بعضهم فعل وأسهاء يكون جعالهذين الوزنين مغل جذع وأجذاع وقفل وأففال
  وهذا الاتدرك صيغته الابالسمع وفيه أربع اغات اسم واسم بالضم وسم وسم وينئه
  والله أمماك سمامباركا • آرل اللّٰه به ايناركا
  وقال آخر وعامنا أعجبنامة دمه • يدعى أبا السمح وقرضاب سمه
  بالضم والكسر جميعا وألفه ألف وصل وربماجعلها الشاعراً لفقطع للضرورة كقول
  الاحوص وما أنا بالخسوس فى جذم مالك • ولا من تسمى ثم يلتزم الاسما
  واذا نسبت الى الاسم قلت سموى وان شقت اسمى تركته على حاله وجمع الاسماء أسام وحكى
  الفراء أعيذك بأسهاوات اللّٰه سنا السنامقصورضوه البرق والسنا أيضانبت
  يتداوى به والسناء من الرفعة والشرف عدود والسق تالرفيع وأسناه أى رفعه وأعلاه
  وسسناه أى قههوسهله وقال
  وأعلم علما اليس بالظن أنه • اذا اللّه سى عقدشئ تسرا
  وسانيت الرجل اذاراضيته وداريته وأحسات معاشرته قال لبيد
  وسانات من ذى بهجة ورقيته • عليه السموط عابس منغضب
  الغزاه يقال نسى أى نغير وقال أبو عر ولم يتسن لم يتغير من قوله تعالى من حامسنون أى
  متغيرفأبدل من احدى النونات يا مثل تقضى من تقغض والمسذاة العرم والسانية الناضحة
  وهى الناقة التى يسستقى عليها وفى المثل سير السوانى سفر لا ينقطع يقال سنت الناقة تسنو
  سناوة وسناية اذاسقت الارض والسححابة تسنو الارض والقوم يسسنون لانضهم اذا
  استقوا والارض مسنوّة ومنية قلبوا الواوياكما قلبوها فى قنية الفراه
  :قال أخذه بسسنايته وصنايته أى أخذه كله والسنة اذاقلته بالهاء وجعلت نقصائه الواو
  فهومن هذا الياب تقول أسى القوم يسسنون اسناءاذ البنواف موضع سنة وأسنتوااذا
  (اسابنهم
