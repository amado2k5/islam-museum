label: { ar: "صحيح البخاري 5768 — تمر العجوة، السم", en: "Sahih al-Bukhari 5768 — 'ajwa dates; poison", ur: "صحیح بخاری 5768 — عجوہ کھجور، زہر" }
text: "حَدَّثَنَا عَلِيٌّ، حَدَّثَنَا مَرْوَانُ، أَخْبَرَنَا هَاشِمٌ، أَخْبَرَنَا عَامِرُ بْنُ سَعْدٍ، عَنْ أَبِيهِ ـ قَالَ قَالَ النَّبِيُّ \" مَنِ اصْطَبَحَ كُلَّ يَوْمٍ تَمَرَاتٍ عَجْوَةً، لَمْ يَضُرُّهُ سَمٌّ وَلاَ سِحْرٌ ذَلِكَ الْيَوْمَ إِلَى اللَّيْلِ \". وَقَالَ غَيْرُهُ \" سَبْعَ تَمَرَاتٍ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5768، يذكر تمر العجوة، والسم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5768 (Medicine), that mentions 'ajwa dates, poison. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5768، جس میں عجوہ کھجور، زہر کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
