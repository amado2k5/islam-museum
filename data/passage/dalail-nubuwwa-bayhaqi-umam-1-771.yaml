text: "… بن حرملة، عن جابر بن عبد اللّه قال : قال أبو هو النّضْر بن الحارث بن كلدة... صاحب لواء المشركين ببدر، كان من شجعان قريش ووجوهها، له اطلاع على كتب الفرس، وغيرهم، وكان ابن خالة النبي ي، ولما ظهر الإسلام …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 771، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
