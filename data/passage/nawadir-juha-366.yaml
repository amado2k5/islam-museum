text: "… دعيني أموتُ في الغربةِ، وأتخلص من أُمُّكِ! فأجابهم : منذ عرفت نفسي علِمْتُ أن ما قضاهُ اللَّهُ واقع. ولولا نفوذُ القدرة كان يخافُ الموت كثيراً وعندما يسمع بحديثه تتراخى أعصابُهُ، ولذلك كان لإسكات من كان يعترض على الصيد والقنص. المطبوخاتِ، …"
summary:
  ar: "وجدته ابنته مختبئاً خلف جرة كبيرة في المخزن، فقال لها أن تدعه يموت في الغربة هرباً من أمها. {cite:juha-nawadir-kubra-djuwaydi p. 181}"
  en: "His daughter finds Juha hiding behind a large jar in the storeroom; he says to let him die abroad to escape her mother. {cite:juha-nawadir-kubra-djuwaydi p. 181}"
  ur: "اس کی بیٹی نے اسے گودام میں ایک بڑے مٹکے کے پیچھے چھپا ہوا پایا، تو اس نے کہا کہ اسے پردیس میں مرنے دو تاکہ وہ اس کی ماں سے بچ سکے۔ {cite:juha-nawadir-kubra-djuwaydi p. 181}"
  fr: "Sa fille trouve Juha caché derrière une grande jarre dans le cellier ; il lui dit de le laisser mourir à l'étranger pour échapper à sa mère. {cite:juha-nawadir-kubra-djuwaydi p. 181}"
  es: "Su hija encuentra a Juha escondido detrás de una gran jarra en el almacén; él le dice que lo deje morir en el extranjero para escapar de su madre. {cite:juha-nawadir-kubra-djuwaydi p. 181}"
