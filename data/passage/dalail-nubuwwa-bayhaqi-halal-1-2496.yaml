text: "… صفرّ عاماً حراماً، وعاماً حلالًا، وعاماً حَرَاماً، وذلك النسيءُ. أيها الناس ! من كانت عنده وديعة فليؤدها إلى من ائتمنه عليها، أيها الناس ! إنه لا يحل لا مرىء من مال أخيه شيء إلا ما طابت به نفسه وذكر الحديث. …"
