label: { ar: "الموطأ 568 — لا يقل أحدكم إذا دعا: اللهم اغفر لي إن شئت، ليعزم المسألة فإنه لا مكره له", en: "Muwatta 568" }
text: "لا يقل أحدكم إذا دعا: اللهم اغفر لي إن شئت، اللهم ارحمني إن شئت، ليعزم المسألة، فإنه لا مكره له"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن النبي نهى الداعي أن يعلق مسألته بمشيئة الله فيقول: اللهم اغفر لي إن شئت، اللهم ارحمني إن شئت، وأمره أن يعزم المسألة، لأنه لا مكره لله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع عند أحمد، وسويد، والقعنبي ومن طريقه البخاري (6339) وأبو داود (1483)، ومعن عند الترمذي (3497). {cite:muwatta-maruf-1997 p.292}"
