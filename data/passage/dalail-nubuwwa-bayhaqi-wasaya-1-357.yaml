text: "… يونس بن بكير، عن ابن إسحاق، قال : لما حَضَرَتْ عبد المطلب الوفاةُ قال لبناته : ابكين علي حتى أسمع. وكن ست نسوة، وهن : أُميمة، وأم حكيم، وبرة، وعاتكة، وصفية، وأروى. عمات رسول اللّٰه، وَلِغِ. الخبر في سيرة ابن …"
