text: "… اللّٰه من المؤمن الضعيف. أمّا أهمّية هذا العلم فتتجسّد بإيجاد العلاج والدواء، وليس أدلّ على ذلك من قوله وَل ليه. يا عباد الله تداووا فإن اللّٰه لم يضع داء إلاّ وضع له دواء. قد كثرت المؤلّفات الطبية عند العرب بشكل …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 3، يذكر الطب والطبيب، والعلاج، والدواء، والداء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 3, that mentions medicine and the physician, treatment, the drug, the disease and its remedy, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 3 کا اقتباس جس میں طب اور طبیب، علاج، دوا، بیماری، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 3, que menciona la medicina y el médico, el tratamiento, el medicamento, la enfermedad y su remedio, y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 3, qui mentionne la médecine et le médecin, le traitement, le médicament, la maladie et son remède, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Bölümünün 3. sayfasından, tıp, hekim, tedavi, ilaç, hastalık ve iyileşmeden bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 3, yang menyebutkan kedokteran, dokter, pengobatan, obat-obatan, penyakit, dan penyembuhan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
