label: { ar: "الموطأ 893 — عبد الله بن أنيس الجهني: يا رسول الله إني رجل شاسع الدار فمرني ليلة أنزل لها، فقال: انزل ليلة ثلاث وعشرين من رمضان", en: "Muwatta 893", es: "Muwatta 893", fr: "Muwatta 893", ur: "موطا 893", tr: "El-Muvatta 893 — Abdullah bin Unais El-Cuhani: Ey Allah'ın Resulü, ben evi uzakta olan bir adamım, bana hangi gece kalmam gerektiğini söyleyin. Resulullah şöyle buyurdu: Ramazan ayının yirmi üçüncü gecesinde kal.", id: "Al-Muwatta 893 — Abdullah bin Unais Al-Juhani: Wahai Rasulullah, aku adalah seorang laki-laki yang rumahnya jauh, maka beritahukan kepadaku malam mana yang sebaiknya aku tinggali. Beliau bersabda: Tinggallah pada malam tanggal dua puluh tiga Ramadan." }
text: "انزل ليلة ثلاث وعشرين من رمضان"
summary:
  ar: "يرويه زياد عن مالك عن أبي النضر مولى عمر بن عبيد الله، أن عبد الله بن أنيس الجهني قال لرسول الله: يا رسول الله، إني رجل شاسع الدار، فمرني ليلة أنزل لها. فقال له رسول الله: انزل ليلة ثلاث وعشرين من رمضان. ويذكر المحقق أن الحديث منقطع، لأن أبا النضر لم يلق عبد الله بن أنيس، ويتصل من وجوه صحاح، وأن الضحاك بن عثمان رواه عن أبي النضر عن بسر بن سعيد عن عبد الله بن أنيس بلفظ حديث أبي سعيد، وذلك عند ابن عبد البر منكر في هذا الإسناد. {cite:muwatta-maruf-1997 p.429}"
  tr: "Ziyad, Malik'ten, o da Ömer ibn Ubeyd Allah'ın azatlı kölesi Ebu el-Nadr'dan rivayet ettiğine göre, Abdullah ibn Uneys el-Cuhani, Allah Resulü'ne şöyle demiştir: \"Ey Allah Resulü, ben çok uzakta yaşıyorum, bana hangi gece kalmam gerektiğini söyleyin.\" Allah Resulü ona şöyle buyurmuştur: \"Ramazan ayının yirmi üçüncü gecesinde kal.\" Araştırmacı, hadisin Ebu el-Nadr'ın Abdullah ibn Uneys ile görüşmemesi nedeniyle kopuk olduğunu, ancak diğer sahih rivayet zincirleriyle bağlantılı olduğunu belirtmektedir. El-Dahhak ibn Osman, Ebu el-Nadr'dan, o da Busr ibn Sa'id'den, o da Abdullah ibn Uneys'den, Ebu Sa'id'in hadisinin lafzıyla rivayet etmiş ve İbn Abd el-Barr bu rivayet zincirini kabul edilemez bulmuştur. {cite:muwatta-maruf-1997 s.429}"
  id: "Diriwayatkan oleh Ziyad dari Malik dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, bahwa Abdullah ibn Unays al-Juhani berkata kepada Rasulullah: “Wahai Rasulullah, aku tinggal jauh, maka beritahukan kepadaku malam mana yang sebaiknya aku tinggali.” Rasulullah menjawab kepadanya: “Tinggallah pada malam tanggal dua puluh tiga Ramadhan.” Peneliti menyebutkan bahwa hadits ini terputus karena Abu al-Nadr tidak bertemu Abdullah ibn Unays, tetapi terhubung melalui sanad-sana riwayat sahih lainnya. Al-Dahhak ibn Uthman meriwayatkannya dari Abu al-Nadr dari Busr ibn Sa’id dari Abdullah ibn Unays dengan redaksi hadits Abu Sa’id, dan ini dianggap oleh Ibn Abd al-Barr tidak dapat diterima dalam sanad ini. {cite:muwatta-maruf-1997 p.429}"
