label: { ar: "الموطأ 893 — عبد الله بن أنيس الجهني: يا رسول الله إني رجل شاسع الدار فمرني ليلة أنزل لها، فقال: انزل ليلة ثلاث وعشرين من رمضان", en: "Muwatta 893" }
text: "انزل ليلة ثلاث وعشرين من رمضان"
summary:
  ar: "يرويه زياد عن مالك عن أبي النضر مولى عمر بن عبيد الله، أن عبد الله بن أنيس الجهني قال لرسول الله: يا رسول الله، إني رجل شاسع الدار، فمرني ليلة أنزل لها. فقال له رسول الله: انزل ليلة ثلاث وعشرين من رمضان. ويذكر المحقق أن الحديث منقطع، لأن أبا النضر لم يلق عبد الله بن أنيس، ويتصل من وجوه صحاح، وأن الضحاك بن عثمان رواه عن أبي النضر عن بسر بن سعيد عن عبد الله بن أنيس بلفظ حديث أبي سعيد، وذلك عند ابن عبد البر منكر في هذا الإسناد. {cite:muwatta-maruf-1997 p.429}"
