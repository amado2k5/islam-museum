label: { ar: "الموطأ 1901 — يحيى عن مالك عن صالح بن كيسان عن الحسن بن محمد بن علي: باع علي بن أبي طالب جملا له يدعى عصيفيرا بعشرين بعيرا إلى أجل", en: "Muwatta 1901", es: "Muwatta 1901", fr: "Muwatta 1901", ur: "موطا 1901", tr: "El-Muvatta 1901 — Yahya, Malik'ten, o da Salih ibn Kaysan'dan, o da el-Hasan ibn Muhammed ibn Ali'den rivayetle: Ali ibn Abi Talib, Usayfir adlı devesini yirmi deveye kredili olarak sattı.", id: "Al-Muwatta 1901 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Salih ibn Kaysan berdasarkan riwayat al-Hasan ibn Muhammad ibn Ali: Ali ibn Abi Talib menjual untanya yang bernama 'Usayfir dengan imbalan dua puluh unta secara kredit." }
summary:
  ar: "يروي يحيى عن مالك عن صالح بن كيسان عن الحسن بن محمد بن علي بن أبي طالب أن علي بن أبي طالب باع جملا له يدعى عصيفيرا، بعشرين بعيرا، إلى أجل. {cite:muwatta-maruf-1997 p.180}"
  tr: "Yahya, Malik'ten, o da Salih ibn Kaysan'dan, o da Hasan ibn Muhammed ibn Ali ibn Abi Talib'den rivayet eder ki, Ali ibn Abi Talib, Usayfira adlı devesini yirmi deveye, daha sonra ödenmek üzere satmıştır. {cite:muwatta-maruf-1997 s.180}"
  id: "Yahya meriwayatkan dari Malik, dari Salih ibn Kaysan, dari al-Hasan ibn Muhammad ibn Ali ibn Abi Talib, bahwa Ali ibn Abi Talib menjual untanya yang bernama 'Usayfira, dengan imbalan dua puluh unta, yang akan dibayar di kemudian hari. {cite:muwatta-maruf-1997 p.180}"
