text: "… كان رسول اللٰه عليل له لقال : من دل على دانيال فبشروه بالجنة. فكان الذي دل عليه رجل يقال له حرقوص فكتب أبو موسى إلى عمر يخبره فكتب إليه عمر : أن ادفنه وابعث إلى حرقوص إن النبي عل بشره …"
summary:
