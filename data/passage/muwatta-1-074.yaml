summary:
  ar: "بلاغ يرويه يحيى عن مالك في باب ما جاء في المسح بالرأس والأذنين: سُئل جابر بن عبد الله الأنصاري عن المسح على العمامة فقال: لا، حتى يُمسح الشعر بالماء. ويذكر المحقق رواية الترمذي (102) من حديث أبي عبيدة بن محمد بن عمار بن ياسر أنه سأل جابراً عن المسح على الخفين فقال: السنة يا ابن أخي، وعن المسح على العمامة فقال: أمسّ الشعر بالماء. {cite:muwatta-maruf-1997 p.74}"
