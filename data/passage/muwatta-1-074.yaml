label: { ar: "الموطأ 74 — بلاغ عن جابر: لا مسح على العمامة حتى يُمسح الشعر", en: "Muwatta 74", es: "Muwatta 74", fr: "Muwatta 74", ur: "موطا 74", tr: "El-Muvatta 74 — Cabir'den rivayet edildiğine göre: Saçlar silinmedikçe sarık üzerine silme işlemi yapılmaz.", id: "Al-Muwatta 74 — Diriwayatkan dari Jabir: Tidak ada usapan pada sorban sampai rambut diusap." }
summary:
  ar: "بلاغ يرويه يحيى عن مالك في باب ما جاء في المسح بالرأس والأذنين: سُئل جابر بن عبد الله الأنصاري عن المسح على العمامة فقال: لا، حتى يُمسح الشعر بالماء. ويذكر المحقق رواية الترمذي (102) من حديث أبي عبيدة بن محمد بن عمار بن ياسر أنه سأل جابراً عن المسح على الخفين فقال: السنة يا ابن أخي، وعن المسح على العمامة فقال: أمسّ الشعر بالماء. {cite:muwatta-maruf-1997 p.74}"
  tr: "Yahya'nın Malik'ten rivayet ettiği, baş ve kulak silme bölümündeki bir hadiste: Cabir ibn Abdullah el-Ensari'ye sarık üzerinden silme hakkında soru sorulmuş ve o şöyle demiştir: Hayır, saçlar suyla silinene kadar değil. Araştırmacı, Tirmizi'nin (102) Ebu Ubeyde ibn Muhammed ibn Ammar ibn Yasir'den rivayet ettiği hadisi aktarıyor; Ebu Ubeyde ibn Muhammed ibn Ammar ibn Yasir, Cabir'e çorap üzerinden silme hakkında sormuş ve o da şöyle demiştir: Bu sünnettir, yeğenim. Sarık üzerinden silme hakkında ise şöyle demiştir: Saçlara suyla dokun. {cite:muwatta-maruf-1997 s.74}"
  id: "Sebuah riwayat yang dinarasikan oleh Yahya atas otoritas Malik dalam bab tentang mengusap kepala dan telinga: Jabir ibn Abdullah al-Ansari ditanya tentang mengusap sorban, dan dia berkata: Tidak, tidak sampai rambut diusap dengan air. Peneliti menyebutkan riwayat al-Tirmidhi (102) dari hadits Abu Ubaidah ibn Muhammad ibn Ammar ibn Yasir, yang bertanya kepada Jabir tentang mengusap kaus kaki, dan dia berkata: Itu adalah Sunnah, wahai keponakanku. Dan tentang mengusap sorban, dia berkata: Sentuh rambut dengan air. {cite:muwatta-maruf-1997 p.74}"
