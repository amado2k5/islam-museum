text: "… هن وهو في موضعه من المسجد أخبرنا الإمام أبو إسحاق إبراهيم بن محمد بن إبراهيم أنبأنا أحمد ابن إبراهيم الإسماعيلي، أنبأنا عبد اللّٰه بن محمد بن ناجية، حدثنا محمد بن عباد بن موسى، حدثنا مصعب بن سلام، حدثنا حمزة الزيات …"
