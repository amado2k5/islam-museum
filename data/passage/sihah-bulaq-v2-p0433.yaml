text: |-
  ١٥٤
  •⁦(بجل)⁩.
  أى به أهل والاهالة الودك والمستأهل الذى يأخذالا هثالة أويأ كاما قال الشاعر
  لايل كلى ياىّ واستأهلى * انّ الذى أنفقت من ماليه
  وتقول فلان أهل اكذا ولاتة لمستأهل والعاقة نقوله وقدأهل فلان يأهل وبأهل أمولا
  أى تزوّج وكذلك تأهل قال الكسائى أهلت بالرجل اذا أنست بدوقولهم مر حبا وأهلا
  أى أتيت سعة وأتيت أهلافاستأنس ولا تستوحش قال أبوزيدآهلت اللّه فى الجنة ايها لا
  أى أدخلكها وزوجك فيها وأهلك اللّٰه للخيرتأهبلا ⁦(ابل)⁩ ابلة اسم موضع قال حسان
  ابن نابت رضي اللّٰه عنه ملكامن جبل الثلج لى • جانى أيلة من عبدوحر
  وايل اسم من أ-ماء اللّٰه تعالى عيراتى أوسريانى" وقولهم جبرائيل وميكاتيل انماهوكة واهم
  عبدالله وتيم اللّٰه
  ف صل الباء دل ، البأدلة اللمحسمة التى بين الايط والثندوة والمع البادل
  قالت أخت يز يدين الطئرية ترئيه
  غتى قدقد السيف لامنا زف • ولارهل لباته ويا دله
  ( بيل بابل اسم موضع بالعراق ينسب اليه السحر والهر قال الاخفس لا يتصرف لتأنيثه
  وذَلتْ أنَّ اسم كل شىْ مؤْنت اذا كان أكٍ ثرمن ثلاثةِ أحرف فانه لا يتصرف فى المعرفة
  تل تلت الشى أبتلد بالكسر بتلااذا أبنته من غيره ومنه قولهم طلقهابتة بتلة والبتول
  من النساء العذراء المنقطعة من الازواج ويقال هى الممقطعة الى اللّٰه تعالى عن الدنيا
  والبتول والبتيلة فسيلة تكون للنخلة قد اسستغنت من أمها وتلات النخلة مبتل يستوى فيه
  الواحد والمع وقال
  ذلْ مادينك اذجنيت * أجمالها كالبكر المبتل
  والبتيلة كل عضو إلح مه والجمع بتائل يقبال امرأة مبتلة بتشديد التا مفتوحة أى تاتة
  الخلق لم يركب لمها بعضه بعضا ولا يوصف به الرجل والتبتل الانقطاع عن الديا الى اللّٰه
  وكذلك التبتيل ومنه قوله تعالى وتبتل إليه تبتيلا وانبتل فهو منبتل أى انقطع وهومثل"
  المنيت قال الراجزه كأنه تيسراران منبتل* ŸŸلùœ ùœبجيلة حى من المن والنسبة اليهم
  بجلىّ باتحريك ويقال انهم من معد لانّ نزارين معد ولد مضرور بيعة وايادا واغمارا ثم اغمار
  ولد يجيلة وخنعم فصاروا بالين ألا ترى أن جرير بن عبد اللّٰه اليجلى تافير رحلا من اليمن الى
  الاقرع بن حابس التميمى حلكم العرب فقال
  يا أقرع بن حابس يا أقرع * انك ان يصرع أخول تصرع
  فجعل نفسهله أخاوهو معدىّ واغمارفع تصرع وحقه الجزم على اضمار الفاه كمافال
  حن يفعل الحستات اللّٰه يشكرها» والسر باشرّ عند اللّه مثلان
  أى فاللّٰه يشكرها ويكون ما بعد الفاءكلا مامبتد أوكان سيويه يقول هو على تقديم الخبركانه
  قال انك تصرع ان يصرع أخوك وأما البيت الشانى فلا يختلفون فيه أنه حرفوع باضمار الفا..
  ويجلة بطن من بنى سليم والنسبة اليهم بجلى بالتسكين ومنه قول عنترة » وفى البجلى معبلة وقيع
  والانجل عرق وهومن الفرس والبعير بنزلة الاكان من الانسان وحكى يعقرب عن أبى الغمر
  المقلي
