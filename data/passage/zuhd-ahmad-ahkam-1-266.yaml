text: "… بسبب توقع مكروه في الاستقبال، والخوف هو الذي يكف الجوارح عن المعاصي ويقيدها بالطاعات، والخوف القاصر يدعو إلى الغفلة والجراءة على الذنب والإفراط في الخوف يدعو إلى القنوط واليأس، والخوف من اللّه تعالى تارة يكون لمعرفة اللّٰه تعالى ومعرفة صفاته …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 266، يرد فيه ذكر الطاعات، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
