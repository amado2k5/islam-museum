text: "… إسْمَاعِيلٌ: سُيْلَ أَحْمَدُ عَنْ الْمَاء إِذَا تَغَيَّرَ طَعْمُهُ أَوْ رِيحُهُ، قَالَ: لا يَتْوَضَأُ بهِ وَلا يَشْرَبُ، وَلَيْسَ فِيهِ حَدِيثٌ، وَلَكِنّ اللّٰه تَعَالَى حَرَّمَ الْمَيْتَةً، فَإِذّا صَارَتْ الْمَيْتَةُ فِي الْمَاءِ فَتَغَيِّرَ لَعْمُهُ أَوْ رِيحُهُ، فَذْلِكَ طَعْمُ الْمَيْتَةِ وَرِيحُهَا، فَلا يَحِلُ لَهُ، …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 20، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 20, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
