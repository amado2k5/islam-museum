label: { ar: "سنن أبي داود 3203 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 3203 — a burial, grave or resting place", ur: "سنن ابی داؤد 3203 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 3203 — un lugar de entierro, tumba o descanso.", fr: "Sunan Abi Dawud 3203 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "حَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، وَمُسَدَّدٌ، قَالاَ حَدَّثَنَا حَمَّادٌ، عَنْ ثَابِتٍ، عَنْ أَبِي رَافِعٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ امْرَأَةً، سَوْدَاءَ أَوْ رَجُلاً كَانَ يَقُمُّ الْمَسْجِدَ فَفَقَدَهُ النَّبِيُّ فَسَأَلَ عَنْهُ فَقِيلَ مَاتَ. فَقَالَ \" أَلاَّ آذَنْتُمُونِي بِهِ \". قَالَ \" دُلُّونِي عَلَى قَبْرِهِ \". فَدَلُّوهُ فَصَلَّى عَلَيْهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3203، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3203 (Funerals (Kitab Al-Jana'iz)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3203، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3203 (Funerales (Kitab Al-Jana'iz)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 3203 (Les Funérailles), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
