text: "… وَكَانَ يَكْتُبُ المَصَاحِفَ - قَالَ: رَأَيْتُ النَّبِيَّ وَا عِ فِي المَنَامِ زَمَنَ ابْنِ عَبَّاسِ قَالَ: فَقُلْتُ لابْنِ عَبَّاسٍ: إِنِّي رَأَيْتُ رَسُولَ اللهِ ال فِي النَّوْمِ، فَقَالَ ابْنُ عَبَّاسٍ : إِنَّ رَسُولَ اللهِ وَلِهِ كَانَ يَقُولُ: إِنَّ الشَّيْطَانَ لا يَسْتَطِيعُ أَنْ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 1362، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 1362, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 1362 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 2, pág. 1362, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Jami' al-Tirmidhi, volume 2, page 1362, mentionne la collecte du Coran et des codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est également visible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 1362. sayfasından bir alıntı, Kur'an'ın derlenmesi ve el yazmalarının yanı sıra hat sanatı ve yazıdan bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 1362, menyebutkan penyusunan Al-Qur'an dan manuskripnya, serta kaligrafi dan tulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
