text: "… وَكَانَ يَكْتُبُ المَصَاحِفَ - قَالَ: رَأَيْتُ النَّبِيَّ وَا عِ فِي المَنَامِ زَمَنَ ابْنِ عَبَّاسِ قَالَ: فَقُلْتُ لابْنِ عَبَّاسٍ: إِنِّي رَأَيْتُ رَسُولَ اللهِ ال فِي النَّوْمِ، فَقَالَ ابْنُ عَبَّاسٍ : إِنَّ رَسُولَ اللهِ وَلِهِ كَانَ يَقُولُ: إِنَّ الشَّيْطَانَ لا يَسْتَطِيعُ أَنْ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 1362، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 1362, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
