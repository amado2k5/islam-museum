label: { ar: "الموطأ 51 — مالك: لا وضوء من القلس", en: "Muwatta 51", es: "Muwatta 51", fr: "Muwatta 51", ur: "موطا 51", tr: "Al-Muwatta 51 — Malik: Kusma için abdest gerekmez.", id: "Al-Muwatta 51 — Malik: Tidak diperlukan wudhu untuk muntah." }
summary:
  ar: "فتوى لمالك يرويها يحيى في باب ما لا يجب منه الوضوء: سُئل عمن قلس طعاماً هل عليه وضوء، فقال: ليس عليه وضوء، وليتمضمض من ذلك وليغسل فاه. ويحيل المحقق على آراء الفقهاء في المسألة عند عبد الرزاق والترمذي. {cite:muwatta-maruf-1997 p.60}"
  tr: "Yahya'nın, abdest gerektirmeyen durumlar bölümünde rivayet ettiği Malik'in bir fetvası şöyledir: Ona, yemek kusan birinin abdest alması gerekip gerekmediği sorulmuş. O da şöyle cevap vermiştir: Abdest almasına gerek yoktur, ancak ağzını çalkalayıp yıkaması yeterlidir. Editör, bu konuda Abdül-Razzak ve Tirmizi'nin eserlerindeki hukukçuların görüşlerine atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.60}"
  id: "Fatwa Malik, diriwayatkan oleh Yahya dalam bab tentang apa yang tidak memerlukan wudhu: Beliau ditanya tentang seseorang yang muntah makanan, apakah ia wajib berwudhu. Beliau menjawab: Ia tidak perlu berwudhu, tetapi ia harus berkumur dan membersihkan mulutnya. Editor merujuk pada pendapat para ahli fiqih tentang masalah ini dalam karya Abd al-Razzaq dan al-Tirmidhi. {cite:muwatta-maruf-1997 p.60}"
