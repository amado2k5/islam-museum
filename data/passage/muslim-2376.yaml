label:
  ar: "مسلم 2376 — لا ينبغي لعبد لي أن يقول أنا خير من يونس بن متى"
  en: "Muslim 2376 — No servant of Mine should say he is better than Yunus son of Matta"
  ur: "مسلم 2376 — میرے کسی بندے کے لیے مناسب نہیں کہ کہے میں یونس بن متیٰ سے بہتر ہوں"
text: "قال - يعني الله تبارك وتعالى - لا ينبغي لعبد لي - وقال ابن المثنى لعبدي - أن يقول أنا خير من يونس بن متى . قال ابن أبي شيبة محمد بن جعفر عن شعبة ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2376: لا ينبغي لعبد لي أن يقول أنا خير من يونس بن متى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2376: No servant of Mine should say he is better than Yunus son of Matta. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2376: میرے کسی بندے کے لیے مناسب نہیں کہ کہے میں یونس بن متیٰ سے بہتر ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
