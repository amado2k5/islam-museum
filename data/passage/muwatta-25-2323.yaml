label: { ar: "الموطأ 2323 — حكاية مروان بن الحكم في مكاتب الفرافصة", en: "Muwatta 2323", es: "Muwatta 2323", fr: "Muwatta 2323", ur: "موطا 2323", tr: "Al-Muwatta 2323 - Farafisa'nın ofislerinde Mervan ibn el-Hakam'ın hikayesi", id: "Al-Muwatta 2323 — Kisah Marwan bin al-Hakam di kantor Farafisa" }
summary:
  ar: "حدث مالك أنه سمع ربيعة بن أبي عبد الرحمن وغيره يذكرون أن مكاتبا للفرافصة بن عمير الحنفي عرض عليه أن يدفع إليه جميع ما عليه من الكتابة، فأبى الفرافصة. فأتى المكاتب مروان بن الحكم، وهو أمير المدينة، فدعا مروان الفرافصة، فأمر بقبض المال من المكاتب ووضعه في بيت المال، وقال للمكاتب: قد عتقت. فلما رأى الفرافصة ذلك قبض المال. {cite:muwatta-maruf-1997 p.358}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman ve diğerlerinin, al-Ferafisa ibn 'Umayr al-Hanafi ile azat sözleşmesi yapmış bir kölenin, sözleşme gereği ödenmesi gereken tüm parayı al-Ferafisa'ya ödemeyi teklif ettiğini, ancak al-Ferafisa'nın bunu reddettiğini anlattığını rivayet etmiştir. Bunun üzerine köle, Medine valisi olan Marwan ibn al-Hakam'a gitmiştir. Marwan, al-Ferafisa'yı çağırmış ve paranın köleden alınıp hazineye konulmasını emretmiş, köleye de \"Sen özgürsün\" demiştir. Al-Ferafisa bunu görünce parayı kabul etmiştir. {cite:muwatta-maruf-1997 s.358}"
  id: "Malik meriwayatkan bahwa ia mendengar Rabi'ah ibn Abi 'Abd al-Rahman dan yang lainnya menyebutkan bahwa seorang budak yang memiliki perjanjian pembebasan dengan al-Farafisah ibn 'Umayr al-Hanafi menawarkan untuk membayar semua uang yang terutang untuk perjanjian tersebut, tetapi al-Farafisah menolak. Maka budak itu pergi kepada Marwan ibn al-Hakam, yang merupakan gubernur Madinah. Marwan memanggil al-Farafisah dan memerintahkan agar uang itu diambil dari budak tersebut dan dimasukkan ke dalam perbendaharaan, dan ia berkata kepada budak itu, \"Kamu bebas.\" Ketika al-Farafisah melihat ini, ia menerima uang tersebut. {cite:muwatta-maruf-1997 p.358}"
