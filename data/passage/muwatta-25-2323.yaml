label: { ar: "الموطأ 2323 — حكاية مروان بن الحكم في مكاتب الفرافصة", en: "Muwatta 2323" }
summary:
  ar: "حدث مالك أنه سمع ربيعة بن أبي عبد الرحمن وغيره يذكرون أن مكاتبا للفرافصة بن عمير الحنفي عرض عليه أن يدفع إليه جميع ما عليه من الكتابة، فأبى الفرافصة. فأتى المكاتب مروان بن الحكم، وهو أمير المدينة، فدعا مروان الفرافصة، فأمر بقبض المال من المكاتب ووضعه في بيت المال، وقال للمكاتب: قد عتقت. فلما رأى الفرافصة ذلك قبض المال. {cite:muwatta-maruf-1997 p.358}"
