  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 634, that mentions cupping, the vessels, the drug, poison and antidote; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 634 کا اقتباس جس میں حجامہ، رگیں، دوا، زہر اور تریاق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 634, que menciona la ventosaterapia, los vasos, el medicamento, el veneno y el antídoto; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
