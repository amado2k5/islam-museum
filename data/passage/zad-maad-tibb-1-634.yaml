text: "… وبالأدوية التي تُعارض فعل السم وتبطله، إما بكيفياتها، وإما بخواصها، فمن عَدِمَ الدواء، فليبادر إلى الاستفراغ الكلي وأنفعه الحجامة، ولا سيما إذا كان البلد حاراً، والزمان حاراً، فإن القوة السمية تسري إلى الدم، فتنبعِثُ في العروق والمجاري حتى تصِلَ إلى …"
summary:
