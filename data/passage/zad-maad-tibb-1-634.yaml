  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 634. sayfasında hacamat, damarlar, ilaç, zehir ve panzehirden bahsedilmektedir; bu metin, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 634, menyebutkan tentang bekam, pembuluh darah, obat-obatan, racun, dan penawarnya; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
