text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف الحاء. والبهق الأبيض الزينة: ينفع من البرص أعضاء الغذاء : مكرب مغث جداً. أعضاء النفض : يسهل الأخلاط الغليظة والسوداء والبلغم بقوّة، والديدان وحبّ القرع. الأبدال: بدله في الإسهال، والمنفعة …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 490، يذكر الجذام والبرص، وأسماء الأمراض، والبيمارستان وصناعة الطب، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 490, that mentions leprosy and vitiligo, named diseases, the hospital and the medical craft, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 490 کا اقتباس جس میں جذام اور برص، بیماریوں کے نام، بیمارستان، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
