label: { ar: "الموطأ 560 — من قال لا إله إلا الله وحده لا شريك له… في يوم مئة مرة كانت له عدل عشر رقاب", en: "Muwatta 560" }
text: "كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزاً من الشيطان يومه ذلك حتى يمسي"
summary:
  ar: "أول حديث في باب ما جاء في ذكر الله. يرويه مالك عن سمي مولى أبي بكر عن أبي صالح السمان عن أبي هريرة، أن النبي أخبر أن من قال في يوم مئة مرة: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزاً من الشيطان يومه ذلك حتى يمسي، ولم يأت أحد بأفضل مما جاء به إلا أحد عمل أكثر من ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وزيد بن الحباب عند ابن ماجة (3798)، والقعنبي عند البخاري (6403)، والتنيسي عند البخاري (3293)، ومعن عند الترمذي (3468)، ويحيى بن يحيى النيسابوري عند مسلم (8/69). {cite:muwatta-maruf-1997 p.287} {cite:muwatta-maruf-1997 p.288}"
