label: { ar: "الموطأ 560 — من قال لا إله إلا الله وحده لا شريك له… في يوم مئة مرة كانت له عدل عشر رقاب", en: "Muwatta 560", es: "Muwatta 560", fr: "Muwatta 560", ur: "موطا 560", tr: "El-Muvatta 560 — Kim bir günde yüz defa “Allah’tan başka ilah yoktur, O tektir, ortağı yoktur…” derse, on köleyi azat etmiş sayılır.", id: "Al-Muwatta 560 — Barang siapa mengucapkan “Tidak ada Tuhan selain Allah, Yang Maha Esa, tanpa sekutu…” seratus kali dalam sehari, maka itu sama dengan membebaskan sepuluh budak." }
text: "كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزاً من الشيطان يومه ذلك حتى يمسي"
summary:
  ar: "أول حديث في باب ما جاء في ذكر الله. يرويه مالك عن سمي مولى أبي بكر عن أبي صالح السمان عن أبي هريرة، أن النبي أخبر أن من قال في يوم مئة مرة: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزاً من الشيطان يومه ذلك حتى يمسي، ولم يأت أحد بأفضل مما جاء به إلا أحد عمل أكثر من ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وزيد بن الحباب عند ابن ماجة (3798)، والقعنبي عند البخاري (6403)، والتنيسي عند البخاري (3293)، ومعن عند الترمذي (3468)، ويحيى بن يحيى النيسابوري عند مسلم (8/69). {cite:muwatta-maruf-1997 p.287} {cite:muwatta-maruf-1997 p.288}"
  id: "Hadits pertama dalam surah tentang mengingat Allah. Diriwayatkan oleh Malik dari Sumayy, budak yang dibebaskan oleh Abu Bakar, dari Abu Salih al-Samman, dari Abu Hurairah, bahwa Nabi (shalawat dan salam kepadanya) bersabda: “Barangsiapa yang mengucapkan seratus kali dalam sehari: ‘Tidak ada Tuhan selain Allah, Yang Maha Esa, yang tidak memiliki sekutu; kepada-Nya milik kekuasaan dan kepada-Nya milik pujian, dan Dia Maha Kuasa atas segala sesuatu,’ maka itu setara dengan membebaskan sepuluh budak baginya, seratus amal kebaikan akan dicatat untuknya, seratus amal buruk akan dihapus darinya, dan itu akan menjadi perlindungan baginya dari setan pada hari itu sampai sore. Tidak akan ada orang yang datang dengan sesuatu yang lebih baik daripada yang dibawanya kecuali seseorang yang melakukan lebih dari itu.” Redaksi menyebutkan bahwa diriwayatkan dari Malik oleh Abu Mus’ab, dan dari rantainya oleh Ibnu Hibban dan al-Baghawi, dan oleh Zayd ibn al-Habab dalam Ibnu Majah (3798), dan oleh al-Qa’nabi dalam al-Bukhari (6403), dan oleh al-Tunisi dalam al-Bukhari (3293), dan oleh Ma’n dalam al-Tirmidzi (3468), dan oleh Yahya ibn Yahya al-Naysaburi dalam Muslim (8/69). {kutip:muwatta-maruf-1997 hal.287} {kutip:muwatta-maruf-1997 hal.288}"
