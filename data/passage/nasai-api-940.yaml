label: { ar: "سنن النسائي 940 — الأحرف السبعة", en: "Sunan al-Nasa'i 940 — the seven ahruf", ur: "سنن نسائی 940 — سبعہ احرف", es: "Sunan al-Nasa'i 940 - los siete ahruf", fr: "Sunan al-Nasa'i 940 - les sept ahruf", tr: "Sunan an-Nasa'i 940 — Yedi Harf", id: "Sunan an-Nasa'i 940 — Tujuh Surat" }
text: "… يَا أُبَىُّ \". فَقَرَأْتُهَا فَقَالَ لِي رَسُولُ اللَّهِ \" أَحْسَنْتَ \". ثُمَّ قَالَ لِلرَّجُلِ \" اقْرَأْ \". فَقَرَأَ فَخَالَفَ قِرَاءَتِي فَقَالَ لَهُ رَسُولُ اللَّهِ \" أَحْسَنْتَ \". ثُمَّ قَالَ رَسُولُ اللَّهِ \" يَا أُبَىُّ إِنَّهُ أُنْزِلَ الْقُرْآنُ عَلَى سَبْعَةِ أَحْرُفٍ كُلُّهُنَّ شَافٍ كَافٍ \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ مَعْقِلُ بْنُ عُبَيْدِ اللَّهِ لَيْسَ بِذَلِكَ الْقَوِيِّ."
summary:
  ar: "حديث في سنن النسائي، رقم 940، يذكر الأحرف السبعة. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan al-Nasa'i, no. 940 (The Book of the Commencement of the Prayer), that mentions the seven ahruf. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن نسائی کی حدیث نمبر 940، جس میں سبعہ احرف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 940 (El Libro del Inicio de la Oración), menciona los siete ahruf. El explorador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan al-Nasa'i, n° 940 (Le Livre du Commencement de la Prière), mentionne les sept ahruf. Le catalogue du musée consacré à la lecture et à l'écriture du Coran le répertorie avec les textes du Coran, la Sunna, la sira et les ouvrages traitant de ce sujet."
  tr: "Sunan-ı Nesai'de yer alan 940 numaralı hadiste, Kur'an okumasının yedi farklı şeklinden bahsedilir. Bu hadis, Kur'an okuma, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okuma ve yazma üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 940, menyebutkan tujuh cara membaca Al-Quran. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, tulisan, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
