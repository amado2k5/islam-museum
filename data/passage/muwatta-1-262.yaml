label: { ar: "الموطأ 262 — رجل من الأنصار يفتنه نخله فيتصدق به فيبيعه عثمان بخمسين ألفاً", en: "Muwatta 262", es: "Muwatta 262", fr: "Muwatta 262", ur: "موطا 262", tr: "El-Muvatta 262 — Ensar'dan bir adam hurma ağaçlarına hayran kaldı ve onları sadaka olarak dağıttı; Osman da onları elli bin liraya sattı.", id: "Al-Muwatta 262 — Seorang pria dari kaum Ansar tergoda oleh pohon kurmanya, lalu ia memberikannya sebagai sedekah, dan Utsman menjualnya seharga lima puluh ribu." }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر، في باب النظر في الصلاة إلى ما يشغلك عنها: كان رجل من الأنصار يصلي في حائط له بالقف، وهو واد من أودية المدينة، في زمان الثمر، والنخل قد تدلت مطوّقة بثمرها، فنظر إليها فأعجبه ما رأى، ثم رجع إلى صلاته فلم يدر كم صلى، فقال إن ماله أصابته فيه فتنة، فجاء عثمان بن عفان وهو يومئذ خليفة فذكر له ذلك وجعله صدقة في سبل الخير، فباعه عثمان بخمسين ألفاً فسمي ذلك المال الخمسين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.154} {cite:muwatta-maruf-1997 p.155}"
  tr: "Malik, namazda dikkati dağıtan şeylere bakma bölümünde, Abdullah ibn Abi Bekr'den rivayetle şöyle anlatmıştır: Ensar'dan bir adam, Medine'deki bir vadi olan el-Kaf'taki bahçesinde, meyve mevsiminde namaz kılıyordu. Hurma ağaçları meyvelerle doluydu ve adam onlara bakıp hayran kaldı. Sonra namazına döndü ve kaç rekat kıldığını hatırlayamadı. Malının bir musibetten zarar gördüğünü söyledi. O sırada halife olan Osman ibn Affan'a gidip durumu anlattı. Osman da bu malı hayır işlerine bağışladı. Osman onu elli bin dirheme sattı ve bu mal \"elli dirhemlik mal\" olarak bilindi. Araştırmacı, Ebu Musab ve Suveyd'in bunu Malik'ten rivayetle naklettiğini belirtiyor. {cite:muwatta-maruf-1997 s.154} {cite:muwatta-maruf-1997 s.155}"
  id: "Malik meriwayatkan hadits ini dari Abdullah bin Abi Bakr, dalam surah tentang memperhatikan hal-hal yang mengalihkan perhatian saat shalat: Seorang pria dari kaum Ansar sedang shalat di kebunnya di al-Qaf, sebuah lembah di Madinah, pada musim buah. Pohon-pohon kurma penuh dengan buah, dan dia memandanginya, mengagumi apa yang dilihatnya. Kemudian dia kembali shalat dan tidak tahu berapa rakaat yang telah dia kerjakan. Dia berkata bahwa hartanya telah terkena musibah. Dia pergi kepada Utsman bin Affan, yang saat itu adalah Khalifah, dan menceritakannya kepadanya. Utsman kemudian memberikan harta itu sebagai sedekah untuk tujuan yang baik. Utsman menjualnya seharga lima puluh ribu (dirham), dan harta itu kemudian dikenal sebagai \"harta lima puluh dirham.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini dari Malik. {kutip:muwatta-maruf-1997 hal.154} {kutip:muwatta-maruf-1997 hal.155}"
