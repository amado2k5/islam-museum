label: { ar: "الموطأ 262 — رجل من الأنصار يفتنه نخله فيتصدق به فيبيعه عثمان بخمسين ألفاً", en: "Muwatta 262" }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر، في باب النظر في الصلاة إلى ما يشغلك عنها: كان رجل من الأنصار يصلي في حائط له بالقف، وهو واد من أودية المدينة، في زمان الثمر، والنخل قد تدلت مطوّقة بثمرها، فنظر إليها فأعجبه ما رأى، ثم رجع إلى صلاته فلم يدر كم صلى، فقال إن ماله أصابته فيه فتنة، فجاء عثمان بن عفان وهو يومئذ خليفة فذكر له ذلك وجعله صدقة في سبل الخير، فباعه عثمان بخمسين ألفاً فسمي ذلك المال الخمسين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.154} {cite:muwatta-maruf-1997 p.155}"
