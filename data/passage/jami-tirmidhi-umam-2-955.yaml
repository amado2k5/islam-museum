text: "… مُكَاتَبَةِ المُشْرِكِينَ حَدَّثَنَا يُوسُفُ بنُ حَمَّادِ البَصْرِيُّ قَالَ : حَدَّثَنَا عَبْدُ الأَعْلَى، عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بَنِ مَالِكَ أَنَّ رَسُول اللّه عِ تَبَ قَبْلَ مَوْتِهِ إِلَى كِسْرَى وَإِلَى قَيْصَرَ وَإِلَى النَّجَاشِيِّ وَإِلَى كُلِّ جَبَّارٍ يَدْعُوهُمْ إِلَى الله، وَلَيْسَ …"
