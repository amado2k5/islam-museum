text: "الحديث الخامس والثلاثون النَّبِّ اللفي، قال : المؤمنُ أخو المؤمن، فلا يَحِلُّ للمؤمن أن يبتاعَ على بيع أخيه، ولا يخطبَ على خِطبةِ أخيه، حتَّى يَذَرَ. وهذا يدلُّ على أنَّ هذا حقُّ المسلم على المسلم، فلا يُساويه الكافر في ذلك، بل …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 721، يذكر مَثَل المؤمن، وحق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 721, that mentions the likeness of the believer, what a believer owes a believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 721 کا اقتباس جس میں مومن کی مثال، مومن کا مومن پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
