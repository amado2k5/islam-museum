text: في عُصبةٍ من قريشٍ قال قائلُهم ببطن مكة لمّا أسلموا زُولوا
summary:
  ar: يمدح كعب المهاجرين من قريش الذين هاجروا حين أسلموا {{cite:ibn-hisham-wustenfeld-1858 p.892}}. وينقل ابن هشام أن الأنصار غضبوا من تخصيصهم، فمدحهم كعب بقصيدة أخرى {{cite:ibn-hisham-wustenfeld-1858 p.892}}.
  en: Ka'b praises the Quraysh emigrants who left when they accepted Islam. Ibn Hisham adds that the Ansar were angered at being left out, and Ka'b answered with a second poem praising them.
translations:
  en:
    text: 'Among a band of Quraysh, whose speaker said in the valley of Mecca when they accepted Islam: ''Depart!'''
