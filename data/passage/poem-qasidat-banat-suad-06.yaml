text: في عُصبةٍ من قريشٍ قال قائلُهم ببطن مكة لمّا أسلموا زُولوا
summary:
  ar: يمدح كعب المهاجرين من قريش الذين هاجروا حين أسلموا {{cite:ibn-hisham-wustenfeld-1858 p.892}}. وينقل ابن هشام أن الأنصار غضبوا من تخصيصهم، فمدحهم كعب بقصيدة أخرى {{cite:ibn-hisham-wustenfeld-1858 p.892}}.
  en: Ka'b praises the Quraysh emigrants who left when they accepted Islam. Ibn Hisham adds that the Ansar were angered at being left out, and Ka'b answered with a second poem praising them.
  es: "Ka'b elogia a los emigrantes Quraysh que se marcharon al convertirse al Islam. Ibn Hisham añade que los Ansar se enfadaron al ser excluidos, y Ka'b respondió con un segundo poema en el que los elogiaba."
  fr: "Ka'b fait l'éloge des émigrants qurayshites qui partirent après leur conversion à l'islam. Ibn Hisham ajoute que les Ansar, vexés d'avoir été exclus, furent rejoints par Ka'b qui composa un second poème à leur gloire."
  ur: "کعب نے قریش کے ہجرت کرنے والوں کی تعریف کی جنہوں نے اسلام قبول کرنے کے بعد چھوڑ دیا۔ ابن ہشام مزید کہتے ہیں کہ انصار کو چھوڑے جانے پر غصہ آیا اور کعب نے ان کی تعریف کرتے ہوئے دوسرا شعر دیا۔"
translations:
  en:
    text: 'Among a band of Quraysh, whose speaker said in the valley of Mecca when they accepted Islam: ''Depart!'''
    license: CC-BY-SA
  ur:
    text: 'قریش کی ایک جماعت میں، جب وہ اسلام لائے تو ان کے ایک کہنے والے نے مکہ کی وادی میں کہا: کوچ کرو!'
