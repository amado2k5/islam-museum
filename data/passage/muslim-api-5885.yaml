label: { ar: "صحيح مسلم 5885 — الأب والأبوة", en: "Sahih Muslim 5885 — the father and fatherhood", ur: "صحیح مسلم 5885 — باپ اور والدیت", es: "Sahih Muslim 5885 — El padre y la paternidad", fr: "Sahih Muslim 5885 — Le père et la paternité", tr: "Sahih Muslim 5885 — Baba ve Babalık", id: "Sahih Muslim 5885 — Ayah dan Peran Ayah" }
text: "… عَنِ ابْنِ عُيَيْنَةَ، قَالَ ابْنُ أَبِي عُمَرَ حَدَّثَنَا سُفْيَانُ، عَنْ إِبْرَاهِيمَ بْنِ مَيْسَرَةَ، عَنْ عَمْرِو بْنِ الشَّرِيدِ، عَنْ أَبِيهِ، قَالَ رَدِفْتُ رَسُولَ اللَّهِ يَوْمًا فَقَالَ \" هَلْ مَعَكَ مِنْ شِعْرِ أُمَيَّةَ بْنِ أَبِي الصَّلْتِ شَيْئًا \". قُلْتُ نَعَمْ قَالَ \" هِيهِ \". فَأَنْشَدْتُهُ بَيْتًا فَقَالَ \" هِيهِ \". ثُمَّ أَنْشَدْتُهُ بَيْتًا فَقَالَ \" هِيهِ \". …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5885، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5885 (Introduction), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5885، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5885 (Introducción), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 5885 (Introduction), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 5885 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5885, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
