text: "… في شِعْبٍ مِن الشّعابِ يتقي اللهَ ويدعُ النَّاس مَن شرِّهِ. وليسَ في هذا الحديث ذِكر الفتنِ. وخرَّجهُ أبو داودَ، وعنده سُئِلَ النبيُّ لِكِ: أيُّ المؤمنينَ أكملُ إيمانًا؟، فَذَكره. وهذا فيه دلالةٌ على أن الاعتزالَ عن الشرِّ من الإيمانِ. وفي المسندِ …"
