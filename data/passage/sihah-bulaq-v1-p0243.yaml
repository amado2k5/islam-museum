text: |-
  ٢٩٨
  ⁦(يَاب الرام )⁩
  ⁦(مرد)⁩
  الحلاوة والموارة التى فيها المرّة وشئ مى" والجمسع احرار قال الشاعر.
  رعى الروض فى الوسمى حتى كأنما • يرى يبيس الدوامر ار علقم
  وأماقول النابغة .لاعرّفنك فارضار ماحنا • فى حف تغلب واردى الامرار
  فهي مياه فى البادية مرّة ويقال رعى بنى فلان المرتان أى الألاء والشيح وهذا أمرّ
  من كذا قالت امى أة من العرب صغراها مرّاها والاحرّ ان الفقر والهرم والمارورة والمريراء
  حب منّ يختلط بالبر ومرّ أبو غيم وهو مر" بن أدّين طايخة بن اليساس بن مضرومرّة أبو قبيله
  من قريس وهو حرّة بن كعب بن لوى بين غالب بن فهر بن مالكْ بن النضر ومرّة أيوقبيلة من
  قيس عيلان وهومرّة بين عوف بن سعد بن ذبيان بن بغيض بن ريت بن غطفان بن سعد بن
  قيس عيلان والمرىّ الذى يؤتدم به كانه منسوب الى المرارة والعامة تخففه وأنشدنى
  أبوالغوث
  وأم مثواى لباخية * وعندها المرّىّ والكامخ
  وأبومّة كنية ابليس والمرار يضم الميم تجرمر"اذا أكات منه الابل قلصت عنه مشافرها
  الواحدة مرارة ومنه ينوا كل المراروهم قوم من العرب والمريا لفتح الحبل قال الراجز
  ثم شددنا فوقه بمر • بين خساشى بازل جور
  وبطن مرّ أيضاموضع وهو من مكة على مرحلد والموة واحسدة المر والمرار قال ذوالرمة
  لابل هو الشوق من دار تخونها • مرّ اشمال ومرّ ابارح ترب
  يقال فلان يصنع ذلك الامر ذات المرارأى يصنعه مرارا ويدعه مرارا والمرحى الرخام
  والرمارة الجارية الناعمة الرجراجة وكذلل المرمورة والتمرمر الاهتزاز والمرّة احدى
  الطيائع الاربع والمرة القوة وشدة العقل أيضاورجل مرير أى قوى ذومرّة والممرور الذى
  غلبت عليه المرّة والمرير والمريرة العزيمة قال الشاعر
  ولا أنننى من طيرة عن عريرة • اذا الاخطب الداعى على الدوح صرصرا
  والمرير من الحبال مالطف وطال واشتدقة له والجمع المرائر والاهرّ المصارين يجتمع فيها
  الفبرث قال الشاعر فلاتهدى الامرّ وما يليه • ولا تهدنّ معروق العظام
  أبوز يدلقيت منه الاعرين ينون الجمع وهى الدواهى وعرامى اسم رحل قال شرقى بن القطامى
  انّ أوّل من وضع خطنا هذا رجال من طيء منهم مراعر بن مرّة قال الشاعر
  تعات باجاد وآل مرامر • وسودت أثوابى ولست بكاتب
  وانما قال آل مراعرلاته كان قد حمى كل واحدمن أولاده بكامة من أبى جادوهم عمائية
  ومرّ عليه وبه يرّمرا أى اجتاز وحى عمر مر اوحى وراذهب واستمرمثله ويقال أيضااستمر
  مريره أى استحسكم عزمه وقولهم لتجدن فلانا ألوى بعيد المستمر يفتح الميم الشانية أى أنه قوى
  فى الخصومة لا يسأم المراس وأنشد أبوعبيد
  وجدتى ألوى بعيد المستمر • أحمل ماحات من خير وشرْ
  والمهرموضع المرور والمصدروأمر الشئ أى صار مر اوكذلك هرّ الشي يمر بالفتح مرارة
  فيومىّ وأمره غيره وحرره وأحروت الحبل فهوممر اذا فتلته فتلاشديدا ومنه قولهم مازال
  فلان يرفلانا ويماره أيضا أى يسالجه ويلتوى عليه ليصرعه وفلان أمر عقدامن فلان أى
  احكم
