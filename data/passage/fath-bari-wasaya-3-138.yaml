text: "… الواقدى أن أول كلة تكام بها تلاع وهو مسترضع عند حليمة اللّه أكبر وآخر كلبة تكام بهاكما فى حديث عائشة فى الرفيق الأعلى ودوى الحاكم من حديث أنس ان آخر ما تكلم به : جلال ربى الرفيع - حدّثنا محمدٌ …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 3، ص 138، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 3, p. 138, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 3، ص 138 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen 3, pág. 138, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fath al-Bari d'Ibn Hajar, volume 3, page 138, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn Hacer'in Feth el-Bari adlı eserinin 3. resimli cildinin 138. sayfasından, vasiyetname veya son vasiyetten ve ölüm saatinden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, jilid 3 bergambar, halaman 138, yang menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
