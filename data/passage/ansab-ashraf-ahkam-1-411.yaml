text: "نزول الفرائض بالمواريث فانطلقوا به إلى النبي عايخ. فقال عثمان حين رآه، والذي بعثك بالحق، ما جئتُ إلا لأطلب له الأمان منك، فهبه لي. فوهبه له، وأجّله ثلاثا وأقسم : لئن وُجد بعدها بشيء من أرض المدينة وما حولها، ليقتلنّ. …"
