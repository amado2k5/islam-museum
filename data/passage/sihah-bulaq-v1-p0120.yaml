text: |-
  ⁦(فصل الح٠١)⁩
  ٠٢٨
  وبات فلان جريضا أى مغموما وأجرضه بريقه أى أغصه والجرياض والجرواض الضطم
  العظيم البعان قال الاصمعى قلت لاعرابى ما الحرياض قال الذى بطنه كالحياض. ويقال
  أيضارحسل جرائض وجرتض مثال علابط وعابط حكاه أبو بكربن السراج ونعجة برئضة
  مثال علبطة أى ضفمة هض) أجهضت الناقة أى أسطت فهى مجهض فان كان
  ذلك من عاد تها فهى مجهاض والواد مجهض وجهيض وجهضنى فلان وأجهضف اذا غابك
  على الشو يقال قتل فلان فأجهض عنه القوم أى غلبوا -ق أخذمنهسم وصاد الجارحة
  الصيدفاً جهضناه عنه أى ضيناه وغلبناه على ماصاد وقد يكون أجهضته عن كذابعف
  أعجلته قال الاموى الجاهض الحديد النفس وفيه جهوضة وجهاضة( جيض الاصمصى
  حاض عن الشئ يجيض حيضا أى حادعنه قال الشاعر
  ولم ندران حضناعن الموت حيضة • كم العمرباق والمدى متطاول
  وقال القطامى يصف ابلا
  وترى لحيضتهن عندرحيلنا • وهلا كأن بهنْ جنة أواق
  قال والجيض مثال الهيف مشية فيع ااختيال وتبخترحكاهعنه أبو عبيدوكذلك الجيضى" ١
  وقال أبو عمرو الحبض الصوت والنبض اضطراب العرق وقال الاصمى لا أدرى ما الحبض
  وحبض بالوتر أى أنيض وحبض السه-م اذا وقع بين يدى الرامى وهو خلاف الصارد قال
  روبة
  ولا الجدى من متعب حباض وحبض ماء الركية أى نقص وحبض حه
  أى بطل وأحبضه غيره وقال أبو عمر والأحساض أن يكدالرجل ركيته فلا يدع فيها ماء
  واحباض السهسم خلاف اصراده والحابض المشاوروهى عيدان مشتار العسل والمحبض
  المندف عن ألي الغوت والهابض المنادف رض رجل حوض أى فاسد مريض
  يحدث فى ييابه واحده وجبه سواء وقال أبوعر والمرض الذى أذا به الحزن أوالعشق وهو
  فى معنى محرض وقد حرض بالكسر وأحرضه الحب أى أفسده وأنشد لالعرحى
  انى امرولج بى حبّ فأحرضق • حتى بليت وحتقى شفى السقم
  أى اذابى والنهريض ء-لى القثال الحثّ والاسحاءعليه والحرض والحرض ٢ لاشسنان
  والمحرضة بالسكسراناؤه والحتراض الذى يوقد على الحرض ليتغذ منه القلى وكذلك الذى يوقد
  على الصغر ليتخذمنه نورة أوجصا والحرضة الذى يضرب للايسار بالقداح لا يكون الاساقطا
  قال المرتاح الإجل أذا وهولاب سواريتال الأحواش واعرشات القعاف الذين لإ تاتاون
  ومن يرم جمعهم يجدهم مرا • جيح حاة للعزل الإحراض
  والاحريض العصفر قال الراجز
  ملتهب كلهب الإحريض • جزى خراطيم غمام بيض
  فض حضه على القتال حضاأى حنه وحفضه أى حرضه والاسم الحفيضى
  والتصاض اتتهاث والمحاضة أن يحث كل واحدمنهما صاحبه وقرى ولا تحاضون على طعام
  المسكين والحض بالضم الاسم والحضبض القرار من الارض عند منقطع الجبل وكتب
  قوه وبات وفي فسخ ومات بالميم اه
  من يعدجذي المشية الجيض
  كذا فى نسعنة
  قوله حبض بالوتر هو والفعلات
  بعده من باب ضرب وسمع كما
  مرّح به الصغانى فى العباب اى
  خلا فالمايقتفيه اصطلاح أ
  القاموس فى الثالث انه كنصر
  أفاده مد
  قوله يحدث هذا الفعل ساقط
  من جسل الفسخ حى من نسعنة
  صاحب الفتارفا عترض التقييد
  بالشياب فى قوله مريض في ودايه
  بأنه لافائدة له وامانحنة المترجم
  ففيها مريض يفد فى تيايد
  فالهنصر
  ⁦(٢)⁩ اى يضمتين أويضم فقط اه
