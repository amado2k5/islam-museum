label: { ar: "الموطأ 246 — مالك: من سها فرفع قبل الإمام رجع، لأن الإمام جُعل ليؤتم به", en: "Muwatta 246" }
text: "إنما جعل الإمام ليؤتم به، فلا تختلفوا عليه"
summary:
  ar: "قول لمالك في باب ما يفعل من رفع رأسه قبل الإمام: من سها فرفع رأسه قبل الإمام في ركوع أو سجود فالسنة أن يرجع راكعاً أو ساجداً ولا ينتظر الإمام، وذلك خطأ ممن فعله، واحتج بقول النبي إن الإمام إنما جُعل ليؤتم به فلا يُختلف عليه، وبقول أبي هريرة المتقدم. ويذكر المحقق أن أبا مصعب وسويداً روياه عن مالك، وأن حديث «إنما جعل الإمام ليؤتم به» في الصحيحين من حديث همام والأعرج عن أبي هريرة. {cite:muwatta-maruf-1997 p.146} {cite:muwatta-maruf-1997 p.147}"
