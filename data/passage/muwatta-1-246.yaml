label: { ar: "الموطأ 246 — مالك: من سها فرفع قبل الإمام رجع، لأن الإمام جُعل ليؤتم به", en: "Muwatta 246", es: "Muwatta 246", fr: "Muwatta 246", ur: "موطا 246", tr: "Al-Muwatta 246 — Malik: Kim unutur ve imamdan önce başını kaldırırsa, geri dönmelidir; çünkü imam, kendisine uyulması için görevlendirilmiştir.", id: "Al-Muwatta 246 — Malik: Barangsiapa lupa dan mengangkat kepalanya sebelum imam hendaknya kembali, karena imam adalah orang yang ditunjuk untuk diikuti." }
text: "إنما جعل الإمام ليؤتم به، فلا تختلفوا عليه"
summary:
  ar: "قول لمالك في باب ما يفعل من رفع رأسه قبل الإمام: من سها فرفع رأسه قبل الإمام في ركوع أو سجود فالسنة أن يرجع راكعاً أو ساجداً ولا ينتظر الإمام، وذلك خطأ ممن فعله، واحتج بقول النبي إن الإمام إنما جُعل ليؤتم به فلا يُختلف عليه، وبقول أبي هريرة المتقدم. ويذكر المحقق أن أبا مصعب وسويداً روياه عن مالك، وأن حديث «إنما جعل الإمام ليؤتم به» في الصحيحين من حديث همام والأعرج عن أبي هريرة. {cite:muwatta-maruf-1997 p.146} {cite:muwatta-maruf-1997 p.147}"
  tr: "Malik, imamın huzurunda başını kaldıran kişinin ne yapması gerektiği bölümünde şöyle demiştir: \"Kim unutur ve imamın huzurunda rükû veya secde halinde başını kaldırırsa, sünnet olan rükû veya secdeye dönmek ve imamı beklememektir. Bunu yapan kişi hata yapmış olur.\" Delil olarak Peygamberimizin imamın takip edilmek üzere tayin edildiğini, dolayısıyla onunla ihtilafa düşülmemesi gerektiğini ve Ebu Hurayra'nın yukarıda zikredilen sözünü göstermiştir. Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve \"İmam takip edilmek üzere tayin edilmiştir\" hadisinin, Ebu Hurayra'dan rivayet edilen Hammam ve el-A'raj hadisinden iki Sahih'te (Buhari ve Müslim) yer aldığını belirtmektedir. {cite:muwatta-maruf-1997 s.146} {cite:muwatta-maruf-1997 s.147}"
  id: "Malik berkata dalam bab tentang apa yang harus dilakukan jika seseorang mengangkat kepalanya di hadapan imam: Jika seseorang lupa dan mengangkat kepalanya di hadapan imam dalam rukuk atau sujud, sunnahnya adalah kembali rukuk atau sujud dan tidak menunggu imam. Ini adalah kesalahan dari siapa pun yang melakukannya. Ia mengutip sebagai bukti sabda Nabi bahwa imam diangkat untuk diikuti, sehingga tidak boleh ada perbedaan pendapat dengannya, dan pernyataan Abu Hurairah yang disebutkan di atas. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan bahwa hadits \"Imam diangkat untuk diikuti\" terdapat dalam dua kitab Sahih (Bukhari dan Muslim) dari hadits Hammam dan al-A'raj atas otoritas Abu Hurairah. {cite:muwatta-maruf-1997 p.146} {cite:muwatta-maruf-1997 p.147}"
