text: "… أمره أوصى بنا. فقال عليّ : لئن سألناها رسولَ اللٰه، وَلِ فِ، فمنعناها لا يُعطيناها النّاس أبداً، والله لا أسألها رسولَ الله، وَلِفِ، أبداً. قال: فما اشتدّ الضُحَى حتي توفّي رسول الله، وَاليه. قالت عائشة : قالت أسماء بنت عُمَيس: …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 183، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
