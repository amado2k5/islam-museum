label: { ar: "مسلم 1553 — ما من مسلم يغرس غرساً فيأكل منه طير أو إنسان أو بهيمة إلا كان له به صدقة", en: "Muslim 1553 — Every Muslim who plants or sows and is eaten from it earns charity", es: "Muslim 1553 — Todo musulmán que planta o siembra y come de ello obtiene caridad", fr: "1553 Muslim — Tout musulman qui plante ou sème et en consomme les fruits mérite une aumône.", ur: "مسلم 1553 - ہر وہ مسلمان جو پودا یا بوتا ہے اور اس میں سے کھاتا ہے وہ صدقہ کماتا ہے۔", tr: "Müslim 1553 — Kuşun, insanın veya hayvanın yediği bir ağaç diken hiçbir Müslüman yoktur ki, bu onun için sadaka sayılmasın.", id: "Muslim 1553 — Tidak ada seorang Muslim pun yang menanam pohon yang buahnya dimakan oleh burung, manusia, atau hewan, melainkan hal itu dianggap sebagai sedekah baginya." }
text: "قال رسول الله: «ما من مسلم يغرس غرساً أو يزرع زرعاً فيأكل منه طير أو إنسان أو بهيمة إلا كان له به صدقة»"
summary:
  ar: "رواية أنس بن مالك في باب فضل الغرس من كتاب المساقاة في صحيح مسلم، وروى جابر نظائرها ومنها حديث أم مبشر الأنصارية؛ يجعل الزرع والغرس صدقة جارية تتعدى نفعها إلى الطير والدابة."
  tr: "Enes bin Malik'in Sahih Müslim'deki Sulama Kitabı'nda ekimin faziletine dair bölümdeki rivayeti ve Cabir'in benzer şeyler rivayet etmesi, Ümmü Mübeşir el-Ensariyye'nin hadisi de dahil olmak üzere; ekimi ve dikimi, faydası kuşlara ve hayvanlara kadar uzanan sürekli bir sadaka haline getirir."
  id: "Riwayat Anas bin Malik dalam bab tentang keutamaan menanam dalam Kitab Irigasi di Sahih Muslim, dan Jabir meriwayatkan hal serupa, termasuk hadits Umm Mubashir al-Ansariyyah; beliau menjadikan menanam dan menabur sebagai sedekah berkelanjutan yang manfaatnya meluas hingga burung dan hewan."
