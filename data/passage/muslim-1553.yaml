text: "قال رسول الله: «ما من مسلم يغرس غرساً أو يزرع زرعاً فيأكل منه طير أو إنسان أو بهيمة إلا كان له به صدقة»"
summary:
  ar: "رواية أنس بن مالك في باب فضل الغرس من كتاب المساقاة في صحيح مسلم، وروى جابر نظائرها ومنها حديث أم مبشر الأنصارية؛ يجعل الزرع والغرس صدقة جارية تتعدى نفعها إلى الطير والدابة."
