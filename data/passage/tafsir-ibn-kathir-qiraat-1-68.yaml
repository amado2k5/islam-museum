text: "… القراء بدمشق. - وكان أبو الدرداء يشفه قد تصدَّر للإقراء بدمشق في خلافة عثمان مجته. - وعند البخاري في صحيحه عن أنس ميه قال: مات النبي وَا يقي، ولم يجمع القرآن غير أربعة: أبو الدرداء، ومعاذ، وزيد بن ثابت، وأبو …"
