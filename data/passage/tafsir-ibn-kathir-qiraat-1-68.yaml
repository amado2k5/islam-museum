text: "… القراء بدمشق. - وكان أبو الدرداء يشفه قد تصدَّر للإقراء بدمشق في خلافة عثمان مجته. - وعند البخاري في صحيحه عن أنس ميه قال: مات النبي وَا يقي، ولم يجمع القرآن غير أربعة: أبو الدرداء، ومعاذ، وزيد بن ثابت، وأبو …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 68، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
