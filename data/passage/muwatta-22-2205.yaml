label: { ar: "الموطأ 2205 — مالك عن أيوب بن موسى عن معاوية بن عبد الله بن بدر الجهني: أن أباه أخبره أنه نزل منزل قوم بطريق الشام، فوجد صرة فيها ثمانون دينارا، فذكرها لعمر بن الخطاب، فقال: عرفها على أبواب المساجد، واذكرها لكل من يأتي من الشام سنة، فإذا مضت السنة فشأنك بها", en: "Muwatta 2205" }
summary:
  ar: "يروي مالك عن أيوب بن موسى عن معاوية بن عبد الله بن بدر الجهني أن أباه أخبره أنه نزل منزل قوم بطريق الشام، فوجد صرة فيها ثمانون دينارا، فذكرها لعمر بن الخطاب، فقال له عمر: عرفها على أبواب المساجد، واذكرها لكل من يأتي من الشام سنة، فإذا مضت السنة فشأنك بها. {cite:muwatta-maruf-1997 p.304}"
