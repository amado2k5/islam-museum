label: { ar: "الموطأ 2205 — مالك عن أيوب بن موسى عن معاوية بن عبد الله بن بدر الجهني: أن أباه أخبره أنه نزل منزل قوم بطريق الشام، فوجد صرة فيها ثمانون دينارا، فذكرها لعمر بن الخطاب، فقال: عرفها على أبواب المساجد، واذكرها لكل من يأتي من الشام سنة، فإذا مضت السنة فشأنك بها", en: "Muwatta 2205", es: "Muwatta 2205", fr: "Muwatta 2205", ur: "موطا 2205", tr: "El-Muvatta 2205 — Malik, Eyyub ibn Musa'dan, o da Muaviye ibn Abdullah ibn Bedir el-Cuhani'den rivayet eder ki: Babası ona, Suriye yolunda bazı insanların evinde kaldığını ve seksen dinar içeren bir kese bulduğunu anlatmıştır. Bunu Ömer ibn el-Hattab'a bildirmiş, o da şöyle demiştir: Bunu mescitlerin kapılarında duyur ve bir yıl boyunca Suriye'den gelen herkese anlat. Bir yıl geçtikten sonra karar sana kalmış.", id: "Al-Muwatta 2205 — Malik, berdasarkan riwayat Ayyub bin Musa, berdasarkan riwayat Mu'awiyah bin Abdullah bin Badr al-Juhani: bahwa ayahnya bercerita kepadanya bahwa ia tinggal di rumah beberapa orang di jalan menuju Suriah, dan menemukan sebuah dompet berisi delapan puluh dinar. Ia menceritakannya kepada Umar bin al-Khattab, yang berkata: Umumkanlah di pintu-pintu masjid, dan ceritakanlah kepada setiap orang yang datang dari Suriah selama setahun. Setelah setahun berlalu, terserah kepadamu." }
summary:
  ar: "يروي مالك عن أيوب بن موسى عن معاوية بن عبد الله بن بدر الجهني أن أباه أخبره أنه نزل منزل قوم بطريق الشام، فوجد صرة فيها ثمانون دينارا، فذكرها لعمر بن الخطاب، فقال له عمر: عرفها على أبواب المساجد، واذكرها لكل من يأتي من الشام سنة، فإذا مضت السنة فشأنك بها. {cite:muwatta-maruf-1997 p.304}"
  tr: "Malik, Ayyub ibn Musa'dan, o da Mu'awiyah ibn Abdullah ibn Badr al-Juhani'den rivayet ettiğine göre, babası ona Suriye yolunda bir evde kaldığını ve seksen dinar içeren bir kese bulduğunu anlatmış. Bunu Ömer ibn al-Khattab'a anlatmış, o da ona şöyle demiş: \"Bunu camilerin kapılarında duyur ve Suriye'den gelen herkese bir yıl boyunca anlat. Bir yıl geçtikten sonra karar sana kalmış.\" {cite:muwatta-maruf-1997 s.304}"
  id: "Malik meriwayatkan dari Ayyub ibn Musa, dari Mu'awiyah ibn Abdullah ibn Badr al-Juhani, bahwa ayahnya bercerita kepadanya bahwa ia tinggal di sebuah rumah penduduk di jalan menuju Suriah dan menemukan sebuah dompet berisi delapan puluh dinar. Ia menceritakan hal itu kepada Umar ibn al-Khattab, yang kemudian berkata kepadanya: \"Sebarkanlah kabar ini di depan pintu-pintu masjid dan beritahukan kepada semua orang yang datang dari Suriah selama setahun. Setelah setahun berlalu, terserah kepadamu.\" {cite:muwatta-maruf-1997 p.304}"
