text: "… أن يتصدق عند موته بمائة. وروى النسائي عن أبي الدرداء عن النبيّ عليفي قال: مَثَل الذي ينفق أو يتصدق عند موته مَثَل الذي يهدي بعد ما يَشبع. الخامسة - من لم يضرّ في وصيته كانت كفارة لما ترك من زكاته. …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 751، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 751, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
