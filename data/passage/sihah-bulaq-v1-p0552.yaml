text: |-
  ٨٩
  وكانت تغلب تسمى الغلباء قال الشاعر
  وأورثى بنو الغلبا مجدا • حدشابعد مجدهم القديم
  والنسبة اليها تغلبى بفتح الام استيحاشالتوالى الكسرتين مع يادى النسب وربما قالوه
  بالكسرلانّ فيه حرفين غير مكسورين وفارق النسبة الى غر وتقول رجل آغلب بين
  الغلب اذاتكان غلظ الرقبة وهضه غليا وعزة علياء والأعلب العولى أحد الرجاز
  وحديقسة غلباء ملتفة وحدائق غلب واغلواب العشب بلغ والتف والغلبة بالضم ١
  وتشديد الباء الغلبة قال المرار أخذت بنجدما أخذت غلبة * وبالغورلى عزأشم طويل
  ورجل غلبة أيضا أى يقلب سربعاءن الاصمعى
  هب الغيهب الظلة والجمع الغياهب يقال فرس أدهم غيهب اذا اشتدسواده
  والغهب بالتحريك الغفلة وقد عهب بالكسر وفى الحديث سئل عطاء عن رجل أصاب صيدا
  نهبا قال عليه الإزاء قال أبو عبيديعنى غفلة من غير تعمد ⁦(ظيب)⁩ الغيب كل مائاب
  عنسك تقول غاب عنه غيبة وغيداوغيا باوغيوبا ومغيبا وجمع الغائب غيب وغياب ٢
  وغب أيضا وانمائبتت فيه الياءمع التحريك لانه شبه بصدوان كان جعا وصد مصدر
  قولك بعبر أصيدلانه يجوز أن ينوى به المصدروغيته أنا وغيابة الحب قعره وكذلك غيابة
  الوادى تقول وقعنا فى غيبة وغميابة أى هبطسة من الارض وقولهسم غيبه غيابه أى دفن
  فى قبره ابن السكيت بنوفلان يشهدون أحصانا ويتغايبون أحيانا وغابت الشمس أى غربت
  والمغسابية خلاف الخاطبة وأغابت المرأة اذا ئماب عنهازوجها فهى مغيبة بالهاء ومشهديلا
  ماءوالغب مااطمآن من الارض قال لسد (٣ ن ظهر غيب والانيس سقامها واغتابه
  اغتدابا اذا وقع فيه والاسم الغيبة وهوأن يتكلم خلف انسان مستور بما يغمه لو
  مه فان كان صدقاسمى غيبة وان كان ك ذباسحى بهنانا والغاية الايحة بقال ليث عابة
  والغاب الآجام وهومن الياءوغابة اسم موضع بالجاز وتغيب عسنى فلان وجاء فى ضرورة
  الشعر تغيبى قال امر والقيس
  قطل لنايوم لذيذينعمة • فقل فى.تيل نحه متغيب
  وقال الذراء المتغيب مرفوع والشعر مكفأ ولا يجوزأن يردّ على المقيل كمالايجوز مروت
  برجل أبوه قائم
  مافى الاناء قال الراجر
  دعوت ،نزى ومسجت قعى • ثمه-يأت لشرب قأب
  وقشب الرجل اذا أكثر من شرب الماءمشل صئب فهوسة أب على مفعل يب) قب
  اللحم يقب قبوبا اذاذهبت ندوته وكذلك قب الجلد والتمر والجرح اذا ييس وذهب ماؤه وجف
  والقبب دقة الخصر والاقب الضاهر البطن والمرأة قباء بينة القيب وانلخيل القب الضوامر
  وقب الاسديقب قبيبا اذاسمعت قبقبة أنيابه والقيقبة صوت جوف الفرس وهو القبيب
  وقبقب الاسدهدر والقبقاب الجمل الهدار والقبقب البطن ابن السكيت ما أصابتنا العام
  ٢٣
  حام
  ١ه وانة ولى لكن الدى فى الشعر
  بضمتين على مافى مرتضى ويقال
  أيضا بفتح الغين وضم اللام لغات
  ثلاث على مافى القاموس اه
