summary:
  ar: "القسم 31 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطب»، ويضم فيها النصوص من 3436 إلى 3549 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 31 of Sunan Ibn Majah (Chapters on Medicine) in the division of the open hadith dataset the museum took its reports from: reports 3436 to 3549 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 31، عنوان «کتاب الطب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3436 تا 3549۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 31 de Sunan Ibn Majah (Capítulos sobre Medicina) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3436 al 3549, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 31 du Sunan Ibn Majah (chapitres sur la médecine), dans la section du recueil ouvert de hadiths: les hadiths 3436 à 3549 de cette section sont classés par le musée sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
