label: { ar: "الموطأ 1197 — ابن شهاب عن سعيد بن المسيب: عمر صلى بمكة ركعتين ثم قال يا أهل مكة أتموا صلاتكم فإنا قوم سفر", en: "Muwatta 1197", es: "Muwatta 1197", fr: "Muwatta 1197", ur: "موطا 1197", tr: "El-Muvatta 1197 — İbn Şihab, Said bin El-Musayyab'dan rivayetle: Ömer, Mekke'de iki rekat namaz kıldıktan sonra, \"Ey Mekke halkı, namazınızı tamamlayın, çünkü biz yolcuyuz\" dedi.", id: "Al-Muwatta 1197 — Ibn Shihab meriwayatkan dari Saeed bin Al-Musayyab: Umar shalat dua rakaat di Mekah, lalu berkata, \"Wahai penduduk Mekah, selesaikanlah shalat kalian, karena kita adalah musafir.\"" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أن عمر بن الخطاب لما قدم مكة صلى بهم ركعتين، ثم انصرف فقال يا أهل مكة أتموا صلاتكم فإنا قوم سفر. ثم صلى عمر ركعتين بمنى، ولم يبلغنا أنه قال لهم شيئا. ويذكر المحقق أن ذلك مسند صحيح من حديث ابن عمر وابن مسعود ومعاوية. {cite:muwatta-maruf-1997 p.538}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet ettiğine göre, Ömer ibn el-Hattab Mekke'ye vardığında onlara iki rekat namaz kıldırdı, sonra arkasını dönerek, \"Ey Mekke halkı, namazınızı tamamlayın, çünkü biz yolcuyuz\" dedi. Ardından Ömer Mina'da iki rekat namaz kıldı ve onlara bir şey söylediğine dair bize bir bilgi ulaşmadı. Araştırmacı, bunun İbn Ömer, İbn Mes'ud ve Muaviye hadislerinden sahih bir rivayet zinciri olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.538}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, bahwa ketika Umar ibn al-Khattab tiba di Mekah, beliau memimpin mereka shalat dua rakaat, kemudian berpaling dan berkata, \"Wahai penduduk Mekah, selesaikanlah shalat kalian, karena kami adalah musafir.\" Kemudian Umar shalat dua rakaat di Mina, dan tidak sampai kepada kita bahwa beliau mengatakan sesuatu kepada mereka. Peneliti menyebutkan bahwa ini adalah sanad yang sahih dari hadits Ibnu Umar, Ibnu Mas'ud, dan Mu'awiyah. {cite:muwatta-maruf-1997 p.538}"
