label: { ar: "الموطأ 1197 — ابن شهاب عن سعيد بن المسيب: عمر صلى بمكة ركعتين ثم قال يا أهل مكة أتموا صلاتكم فإنا قوم سفر", en: "Muwatta 1197" }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أن عمر بن الخطاب لما قدم مكة صلى بهم ركعتين، ثم انصرف فقال يا أهل مكة أتموا صلاتكم فإنا قوم سفر. ثم صلى عمر ركعتين بمنى، ولم يبلغنا أنه قال لهم شيئا. ويذكر المحقق أن ذلك مسند صحيح من حديث ابن عمر وابن مسعود ومعاوية. {cite:muwatta-maruf-1997 p.538}"
