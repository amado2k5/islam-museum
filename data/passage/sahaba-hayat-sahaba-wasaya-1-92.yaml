text: "… رسول اللّٰه حين حضره الوفاة: الصلاة وما ملكت ايمانكم حتى جعل يغرغر بها : ما يفصح بها لسانه. وقد رواه النساتى و ابن ماجه. وعند أحمد هن حديثه قال : كأنت عامة وصية رسول اللّٰه حين حضره الموت: الصلاة وما …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 92، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 92, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 92 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen 1, pág. 92, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 1, page 92, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "Kandahlavi'nin \"Sahabelerin Hayatları\" adlı eserinin 1. cildinin 92. sayfasında, son bir vasiyet veya antlaşmadan ve ölüm saatinden bahsedilmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir baskıdan alınmıştır. Vasiyetler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kehidupan Para Sahabat\" karya Kandahlawi, Volume 1, halaman 92, menyebutkan wasiat atau perjanjian terakhir, dan saat kematian; diambil dari edisi yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
