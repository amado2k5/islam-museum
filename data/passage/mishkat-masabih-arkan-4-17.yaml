text: "- كتاب الإيمان به من وراءنا وندخل به الجنة، وسألوه عن الأشربة. فأمرهم بأربع، ونهاهم عن اربع: أمرهم بالإيمان بالله وحده، قال: أتدرون ما الإيمان بالله وحده؟ قالوا: اللّٰه ورسوله أعلم. قال: شهادة أن لا إله إلا اللّٰه وأن محمدًا …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 4، ص 17، يذكر السؤال عن الإيمان وجوابه، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 4, p. 17, that mentions the question about faith and its answer, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 4، ص 17 کا اقتباس جس میں ایمان کے بارے میں سوال اور اس کا جواب، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 4, pág. 17, que menciona la cuestión de la fe y su respuesta, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait de Mishkat al-Masabih, volume 4, page 17, mentionnant la question de la foi et sa réponse, un des articles de foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 4, sayfa 17'den bir alıntı, iman hakkındaki soru-cevap ve imanın temellerinden birini içermektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 4, halaman 17, menyebutkan pertanyaan dan jawaban tentang iman, dan salah satu rukun iman; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
