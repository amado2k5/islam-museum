label: { ar: "الموطأ 2327 — مالك: ميراث المكاتب إذا عتق لأولى الناس بمن كاتبه", en: "Muwatta 2327", es: "Muwatta 2327", fr: "Muwatta 2327", ur: "موطا 2327", tr: "El-Muvatta 2327 — Malik: Azat sözleşmesi yapmış bir kölenin mirası, onunla sözleşme yapan kişiye en yakın olan kişiye geçer." }
summary:
  ar: "قال مالك: إذا كوتب المكاتب فعتق، فإنما يرثه أولى الناس بمن كاتبه من الرجال يوم توفي المكاتب، من ولد أو عصبة. {cite:muwatta-maruf-1997 p.359}"
  tr: "Malik şöyle demiştir: Eğer bir köle azat sözleşmesi yapmışsa ve azat edilirse, mirasçısı ancak kölenin öldüğü gün onunla sözleşme yapan kişinin en yakın erkek akrabası olur; bu kişi çocuk veya erkek akraba olabilir. {cite:muwatta-maruf-1997 s.359}"
  id: "Malik berkata: Jika seorang budak yang telah membuat perjanjian pembebasan dibebaskan, maka ia hanya diwarisi oleh kerabat laki-laki terdekat dari orang yang membuat perjanjian dengannya pada hari budak itu meninggal, baik itu anak atau kerabat laki-laki. {cite:muwatta-maruf-1997 p.359}"
