text: "مَالِكٍ، أَنَّهُ بَلَغَهُ ‏:‏ أَنَّ عُمَرَ بْنَ عَبْدِ الْعَزِيزِ، كَتَبَ إِلَى عَامِلِهِ عَلَى دِمَشْقَ فِي الصَّدَقَةِ ‏:‏ إِنَّمَا الصَّدَقَةُ فِي الْحَرْثِ وَالْعَيْنِ وَالْمَاشِيَةِ ‏.‏ قَالَ مَالِكٌ ‏:‏ وَلاَ تَكُونُ الصَّدَقَةُ إِلاَّ فِي ثَلاَثَةِ أَشْيَاءَ ‏:‏ فِي الْحَرْثِ وَالْعَيْنِ وَالْمَاشِيَةِ ‏.‏"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
