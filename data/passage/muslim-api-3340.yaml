label: { ar: "صحيح مسلم 3340 — الأب والأبوة", en: "Sahih Muslim 3340 — the father and fatherhood", ur: "صحیح مسلم 3340 — باپ اور والدیت", es: "Sahih Muslim 3340 — El padre y la paternidad", fr: "Sahih Muslim 3340 — Le père et la paternité" }
text: "… عَنِ الْوَلِيدِ بْنِ كَثِيرٍ، حَدَّثَنِي سَعِيدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّ عَبْدَ الرَّحْمَنِ، حَدَّثَهُ عَنْ أَبِيهِ أَبِي، سَعِيدٍ أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" إِنِّي حَرَّمْتُ مَا بَيْنَ لاَبَتَىِ الْمَدِينَةِ كَمَا حَرَّمَ إِبْرَاهِيمُ مَكَّةَ \". قَالَ ثُمَّ كَانَ أَبُو سَعِيدٍ يَأْخُذُ - وَقَالَ أَبُو بَكْرٍ يَجِدُ - أَحَدَنَا فِي يَدِهِ الطَّيْرُ فَيَفُكُّهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3340، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3340 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 3340، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 3340 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 3340 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
