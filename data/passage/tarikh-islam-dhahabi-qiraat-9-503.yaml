text: "روى عنه: عبد اللّٰه بن بُرَيْدَة، وقَتَادة، ويحيى بن عُقَيْل، وعطاء الخُراساني، وسليمان التّيْمي، وإسحاق بن سُوَيْد، وآخرون. قال أبو داود: لم يسمع من عائشة. وقيل: إنّه أول من نَقَّط المُصْحَف، وكان أحد الفُصَحَاء أخذ العربيّةَ عن أبي الأسود، وكان …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 9، ص 503، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 9, p. 503, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 9، ص 503 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 9, pág. 503, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
