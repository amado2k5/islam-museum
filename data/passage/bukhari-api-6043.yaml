label: { ar: "صحيح البخاري 6043 — الحرام، ما حُرّم", en: "Sahih al-Bukhari 6043 — the unlawful; what was made unlawful", ur: "صحیح بخاری 6043 — حرام، جو حرام کیا گیا" }
text: "… قَالَ النَّبِيُّ بِمِنًى \" أَتَدْرُونَ أَىُّ يَوْمٍ هَذَا \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" فَإِنَّ هَذَا يَوْمٌ حَرَامٌ، أَفَتَدْرُونَ أَىُّ بَلَدٍ هَذَا \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" بَلَدٌ حَرَامٌ، أَتَدْرُونَ أَىُّ شَهْرٍ هَذَا \". قَالُوا اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ \" شَهْرٌ حَرَامٌ \". قَالَ \" فَإِنَّ اللَّهَ حَرَّمَ عَلَيْكُمْ دِمَاءَكُمْ وَأَمْوَالَكُمْ وَأَعْرَاضَكُمْ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6043، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6043 (Good Manners and Form (Al-Adab)), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6043، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
