label: { ar: "جامع الترمذي 852 — الأب والأبوة", en: "Jami' al-Tirmidhi 852 — the father and fatherhood", ur: "جامع ترمذی 852 — باپ اور والدیت" }
text: "حَدَّثَنَا يَحْيَى بْنُ مُوسَى، حَدَّثَنَا هَارُونُ بْنُ صَالِحٍ الطَّلْحِيُّ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، عَنِ ابْنِ عُمَرَ، قَالَ اغْتَسَلَ النَّبِيُّ لِدُخُولِهِ مَكَّةَ بِفَخٍّ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَيْرُ مَحْفُوظٍ. وَالصَّحِيحُ مَا رَوَى نَافِعٌ عَنِ ابْنِ عُمَرَ أَنَّهُ كَانَ يَغْتَسِلُ لِدُخُولِ مَكَّةَ. وَبِهِ يَقُولُ الشَّافِعِيُّ يُسْتَحَبُّ الاِغْتِسَالُ لِدُخُولِ مَكَّةَ. وَعَبْدُ الرَّحْمَنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 852، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 852 (The Book on Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 852، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
