text: |-
  ٥٥٩
  يرمون عن عتل كانها غبط • برمخر يعجل المرمى إعجالا
  بعنى به خشب الرحال وشبه القسى الفارسية بها وربماسموا الارض المطمئنة غبيطا والغبيط
  اسم واد ومنه صحراء الغبيط وأغبعات الرحل على ظهر البعيراذا أدمته عليه ولم تحطه عنه
  قال الراجز وانتسف الجالب من اندابه • أغباطنا الميس على اصلابه
  وأغبطت عليه الجى أى دامت وأغبطت السماءأى دام مطرها ⁦(غطط)⁩ غطه فى الما
  يغطه غطامقله وغوصه فيه وانغط فى الماءه ووتغاط القوم يتغاطون أى يتماقلون فى الماء
  أبوزيدغط البعير يغط غطيطا أى هدر فى الشقشقة فاذ الم يكن فى الشقشقة فهوهدير
  والناقة تهدر ولا نغط لانه لاشقشقة لها وغطيط النائم والمخنوق نخيره والغطاط بالفتح
  ضرب من القطا وهى غبرااظ، وروالبطون وإلابدان سود بطون الاجنحة طوال الارجل
  والاعناؤ لطاف لا تجتمع اسرابا اكثرما تكون ثلانا واثتنين الواحسدة غطاطة والغطاط
  بالضم أول الصبح قال رؤية
  يايها الشاج بالغطاط وأماقول ابن احر
  لا يجنلون عن المضاف ولورأوا • أولى الوعاوع كالغطاط المقبل
  فن رواه بااضم شبهه-م بسواد الدف ومن رواه بالفتح شبهه-م بالقطا والغطغطة حسكاية
  صوت يقاريه والمغطغطة القدر الشديدة الغليان والتغطمط صوت معه بجح والغطامط
  بالضم صوت غليان القدروموج البحر والميم عندى زائدة قال الكميت
  تكأن الغطامط من غليها • اراجيزاسلم تهجو غفارا
  وهما قبيلنان كانت بينهما مهاياة ⁦(غلط)⁩. غلط فى الامريغلط غلطا وأغلطه غديره والعرب
  تقول غلط فى منطقه وغلت فى الحساب وبعضهم يجعلهما لغتين بعنى ونمااطه مغالطة
  والتغليط أن تقول للرجل غلطت والاغلوطة ما يغلطبه من المسائل ونهى رسول اللّٰه صلى
  اللّٰه عليه وسلم عن الاغلوطات ومنه قواه-م حد ثتهحد يشاليس بالاغاليط عمط غمط
  النعمة بالكسر يغمطها يقال غمطعيشه وغمطه أيضا بالفتح يغمطه فمطا بالتسكين فيهما أى
  بطره وحقره وغمط الناس الاحتقارلهم والازداعبهم وفى الحديث اغماذلك من سفه الحق
  وغمط الناس يعنى أن يرى الحق سفها وجهلا ويحتة رالناس وأغمطت عليه الحمى لغة فى
  أغبطت غوط) غاط فى الشى يغوط ويغيط دخل فيه بقال ه_ذارمل تغوط فيه الاقدام
  وقولهم اتى فلان الغائط وأصل الغائط المطمتن من الارض الواسع والجم-ع غوط وأغواط
  غيطان صارت الواوياء لانكسارماقبلها وكان الرجسل منهم اذا أراد أن بقضى الحاج
  تى الغائط فقضى حاجته فقيل لكل من قضى حاجته قد أتى الغائطفكنى به عن العذرة وقد
  تغوّط وبال والغوطة بالضم-وضع بالشام كثير الماء والشجروهى غوطة دمشق
  ف صل الفا رط فرط فى الامر يفرط فرطا أى قصرفيه وضيعه -ق فات
  وكذلك التفر يط وفرط عليه أى عجل وعدا ومنه قوله تعالى انا نخاف أن يفرط علينا
  أوان يطقى وفرط اليه منى قول أى سبق وفرطت القوم أفرطه-م فرطاأى سبقتهم الى
  الماءفأنا فارط والجمع فرّاط قال القطامى
  فاستعجاونا وكانوا من صحابتنا • كما تعجل فرّاط لوراد
