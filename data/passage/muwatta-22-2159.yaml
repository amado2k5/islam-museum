label: { ar: "الموطأ 2159 — يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار: كان عمر يلحق أولاد الجاهلية بمن ادعاهم في الإسلام، فأتى رجلان كلاهما يدعي ولد امرأة، فدعا عمر القائف، فقال: لقد اشتركا فيه، فضربه عمر، ثم خيّر الغلام بين من يواليه", en: "Muwatta 2159", es: "Muwatta 2159", fr: "Muwatta 2159", ur: "موطا 2159", tr: "El-Muvatta 2159 — Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayetle: Ömer, İslam öncesi dönemde doğan çocukları, İslam'da hak iddia edenlere paylaştırırdı. İki adam geldi, her biri farklı bir kadının çocuğunu sahiplendi. Ömer, soyağacı uzmanını çağırdı ve o da: \"İkisi de çocuğun ortak sahibidir\" dedi. Bunun üzerine Ömer onu cezalandırdı ve çocuğa kimi destekleyeceğini seçme hakkı verdi.", id: "Al-Muwatta 2159 — Yahya, dari Malik, dari Yahya ibn Sa’id, dari Sulayman ibn Yasar: Umar biasa memberikan anak-anak yang lahir di era pra-Islam kepada mereka yang mengklaimnya dalam Islam. Dua orang pria datang, masing-masing mengklaim anak dari wanita yang berbeda. Umar memanggil ahli silsilah, yang berkata: “Mereka berdua berbagi anak itu.” Kemudian Umar menghukumnya dan memberi anak itu pilihan siapa yang akan dia dukung." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار أن عمر بن الخطاب كان يلحق أولاد الجاهلية بمن ادعاهم في الإسلام. فأتى رجلان، كلاهما يدعي ولد امرأة، فدعا عمر بن الخطاب القائف، فنظر إليهما، فقال القائف: لقد اشتركا فيه. فضربه عمر بن الخطاب بالدرة، ثم دعا المرأة فقال: أخبريني خبرك. فقالت: كان هذا لأحد الرجلين يأتيني وهي في إبل لأهلها، فلا يفارقها حتى يظن وتظن أنه قد استمر بها حبل، ثم انصرف عنها، فأهريقت عليه دماء، ثم خلف عليها هذا، تعني الآخر، فلا أدري من أيهما هو؟ قال: فكبر القائف. فقال عمر للغلام: وال أيهما شئت. {cite:muwatta-maruf-1997 p.284} {cite:muwatta-maruf-1997 p.285}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Ömer ibn el-Hattab, İslam öncesi dönemde doğan çocukları, İslam'da hak iddia edenlere paylaştırırdı. İki adam geldi, her biri bir kadının çocuğunu sahiplendi. Ömer ibn el-Hattab, soyağacı uzmanını çağırdı ve uzman onları inceledi. Soyağacı uzmanı, \"Çocuğu ikisi de paylaşıyor\" dedi. Ömer ibn el-Hattab ona kırbacıyla vurdu, sonra kadını çağırdı ve \"Bana hikâyeni anlat\" dedi. Kadın, \"İki adamdan biri, o ailesinin develerini otlatırken yanıma gelirdi. Hamile olduğunu düşünene kadar onu yalnız bırakmazdı. Sonra gitti ve onun için kan döküldü. Sonra başka bir adam geldi,\" yani diğer adam, \"bu yüzden hangisinin baba olduğunu bilmiyorum.\" dedi. Soyağacı uzmanı, \"Allah büyüktür!\" diye haykırdı. Ömer daha sonra çocuğa, \"Hangisini istersen onu seç,\" dedi."
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa Umar ibn al-Khattab biasa menetapkan anak-anak yang lahir di era pra-Islam kepada mereka yang mengklaimnya dalam Islam. Dua orang laki-laki datang, masing-masing mengklaim anak dari seorang wanita. Umar ibn al-Khattab memanggil ahli silsilah, yang memeriksa mereka. Ahli silsilah berkata, \"Mereka berdua memiliki anak itu.\" Umar ibn al-Khattab mencambuknya, lalu memanggil wanita itu dan berkata, \"Ceritakan kisahmu.\" Wanita itu berkata, \"Salah satu dari dua laki-laki itu biasa datang kepadaku ketika dia sedang menggembalakan unta keluarganya. Dia tidak akan meninggalkannya sampai dia dan wanita itu mengira dia hamil. Kemudian dia pergi, dan darah tertumpah karena dia. Kemudian laki-laki lain datang kepadanya,\" maksudnya laki-laki yang lain, \"jadi aku tidak tahu siapa ayahnya.\" Ahli silsilah berseru, \"Allah Maha Besar!\" Lalu Umar berkata kepada anak itu, \"Pilihlah mana saja yang kau inginkan.\""
