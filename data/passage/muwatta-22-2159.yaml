label: { ar: "الموطأ 2159 — يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار: كان عمر يلحق أولاد الجاهلية بمن ادعاهم في الإسلام، فأتى رجلان كلاهما يدعي ولد امرأة، فدعا عمر القائف، فقال: لقد اشتركا فيه، فضربه عمر، ثم خيّر الغلام بين من يواليه", en: "Muwatta 2159" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار أن عمر بن الخطاب كان يلحق أولاد الجاهلية بمن ادعاهم في الإسلام. فأتى رجلان، كلاهما يدعي ولد امرأة، فدعا عمر بن الخطاب القائف، فنظر إليهما، فقال القائف: لقد اشتركا فيه. فضربه عمر بن الخطاب بالدرة، ثم دعا المرأة فقال: أخبريني خبرك. فقالت: كان هذا لأحد الرجلين يأتيني وهي في إبل لأهلها، فلا يفارقها حتى يظن وتظن أنه قد استمر بها حبل، ثم انصرف عنها، فأهريقت عليه دماء، ثم خلف عليها هذا، تعني الآخر، فلا أدري من أيهما هو؟ قال: فكبر القائف. فقال عمر للغلام: وال أيهما شئت. {cite:muwatta-maruf-1997 p.284} {cite:muwatta-maruf-1997 p.285}"
