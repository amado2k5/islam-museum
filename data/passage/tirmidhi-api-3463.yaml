label: { ar: "جامع الترمذي 3463 — عدد الحسنات، كتابة الحسنات", en: "Jami' al-Tirmidhi 3463 — a stated number of good deeds; the writing of good deeds", ur: "جامع ترمذی 3463 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، حَدَّثَنَا مُوسَى الْجُهَنِيُّ، حَدَّثَنِي مُصْعَبُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ لِجُلَسَائِهِ \" أَيَعْجِزُ أَحَدُكُمْ أَنْ يَكْسِبَ أَلْفَ حَسَنَةٍ \". فَسَأَلَهُ سَائِلٌ مِنْ جُلَسَائِهِ كَيْفَ يَكْسِبُ أَحَدُنَا أَلْفَ حَسَنَةٍ قَالَ \" يُسَبِّحُ أَحَدُكُمْ مِائَةَ تَسْبِيحَةٍ تُكْتَبُ لَهُ أَلْفُ حَسَنَةٍ وَتُحَطُّ عَنْهُ أَلْفُ سَيِّئَةٍ \". قَالَ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3463، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3463 (Chapters on Supplication), that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3463، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
