label: { ar: "الموطأ 742 — مالك: الحنطة كلها السمراء والبيضاء والشعير والسلت صنف واحد", en: "Muwatta 742" }
summary:
  ar: "قول لمالك: وكذلك الحنطة كلها، السمراء والبيضاء والشعير والسلت، كل ذلك صنف واحد، فإذا حصد الرجل من ذلك كله خمسة أوسق جُمع عليه بعضه إلى بعض ووجبت فيه الزكاة، فإن لم يبلغ ذلك فلا زكاة فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.369}"
