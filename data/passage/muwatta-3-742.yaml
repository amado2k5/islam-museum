label: { ar: "الموطأ 742 — مالك: الحنطة كلها السمراء والبيضاء والشعير والسلت صنف واحد", en: "Muwatta 742", es: "Muwatta 742", fr: "Muwatta 742", ur: "موطا 742", tr: "Al-Muwatta 742 — Malik: Bütün buğdaylar, ister kahverengi ister beyaz olsun, arpa ve kılçıklı buğday aynı türdendir.", id: "Al-Muwatta 742 — Malik: Semua gandum, baik cokelat maupun putih, dan jelai serta spelt adalah sejenis." }
summary:
  ar: "قول لمالك: وكذلك الحنطة كلها، السمراء والبيضاء والشعير والسلت، كل ذلك صنف واحد، فإذا حصد الرجل من ذلك كله خمسة أوسق جُمع عليه بعضه إلى بعض ووجبت فيه الزكاة، فإن لم يبلغ ذلك فلا زكاة فيه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.369}"
  tr: "Malik şöyle demiştir: “Esmer veya beyaz olsun, bütün buğday, arpa veya kılçıklı buğday tek bir tür sayılır. Bir kimse bunların hepsinden beş vask (kuru ölçü birimi) hasat ederse, bunlar toplanır ve zekât verilir. Eğer bu miktara ulaşmazsa, zekât verilmez.” Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.369}"
  id: "Malik berkata: “Semua gandum, baik gandum cokelat maupun putih, jelai, atau gandum spelt, dianggap satu jenis. Jika seseorang memanen lima wasq (satuan ukuran kering) dari semuanya, maka jumlahnya dijumlahkan dan zakat wajib dibayarkan atasnya. Jika jumlahnya tidak mencapai angka tersebut, maka tidak ada zakat yang wajib dibayarkan.” Peneliti menyebutkan bahwa Abu Mus’ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.369}"
