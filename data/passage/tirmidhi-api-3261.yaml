text: "… حُجْرٍ، أَنْبَأَنَا إِسْمَاعِيلُ بْنُ جَعْفَرٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ جَعْفَرِ بْنِ نَجِيحٍ، عَنِ الْعَلاَءِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّهُ قَالَ قَالَ نَاسٌ مِنْ أَصْحَابِ رَسُولِ اللَّهِ يَا رَسُولَ اللَّهِ مَنْ هَؤُلاَءِ الَّذِينَ ذَكَرَ اللَّهُ إِنْ تَوَلَّيْنَا اسْتُبْدِلُوا بِنَا ثُمَّ لَمْ يَكُونُوا أَمْثَالَنَا قَالَ وَكَانَ سَلْمَانُ بِجَنْبِ رَسُولِ اللَّهِ قَالَ فَضَرَبَ رَسُولُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3261، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3261 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3261، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
