label: { ar: "سنن النسائي 1141 — الأب والأبوة", en: "Sunan al-Nasa'i 1141 — the father and fatherhood", ur: "سنن نسائی 1141 — باپ اور والدیت", es: "Sunan al-Nasa'i 1141 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1141 — le père et la paternité" }
text: "… قَالَ أَنْبَأَنَا جَرِيرُ بْنُ حَازِمٍ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ أَبِي يَعْقُوبَ الْبَصْرِيُّ، عَنْ عَبْدِ اللَّهِ بْنِ شَدَّادٍ، عَنْ أَبِيهِ، قَالَ خَرَجَ عَلَيْنَا رَسُولُ اللَّهِ فِي إِحْدَى صَلاَتَىِ الْعِشَاءِ وَهُوَ حَامِلٌ حَسَنًا أَوْ حُسَيْنًا فَتَقَدَّمَ رَسُولُ اللَّهِ فَوَضَعَهُ ثُمَّ كَبَّرَ لِلصَّلاَةِ فَصَلَّى فَسَجَدَ بَيْنَ ظَهْرَانَىْ صَلاَتِهِ سَجْدَةً أَطَالَهَا. قَالَ أَبِي فَرَفَعْتُ رَأْسِي وَإِذَا الصَّبِيُّ عَلَى ظَهْرِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1141، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1141 (The Book of The At-Tatbiq (Clasping One's Hands Together)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1141، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.° 1141 (El Libro del At-Tatbiq (Junto de las Manos)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1141 (Le Livre de l'At-Tatbiq, ou l'union des mains), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
