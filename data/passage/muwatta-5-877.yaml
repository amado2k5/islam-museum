label: { ar: "الموطأ 877 — القاسم بن محمد ونافع مولى ابن عمر: لا اعتكاف إلا بصيام؛ لقول الله تعالى في آية البقرة", en: "Muwatta 877" }
summary:
  ar: "يروي مالك أنه بلغه أن القاسم بن محمد ونافعاً مولى عبد الله بن عمر قالا: لا اعتكاف إلا بصيام، لقول الله تعالى في كتابه: وكلوا واشربوا حتى يتبين لكم الخيط الأبيض من الخيط الأسود من الفجر، ثم أتموا الصيام إلى الليل ولا تباشروهن وأنتم عاكفون في المساجد، فإنما ذكر الله الاعتكاف مع الصيام. ويذكر المحقق أنه رواه عن مالك أبو مصعب (873). {cite:muwatta-maruf-1997 p.422}"
