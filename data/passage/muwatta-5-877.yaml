label: { ar: "الموطأ 877 — القاسم بن محمد ونافع مولى ابن عمر: لا اعتكاف إلا بصيام؛ لقول الله تعالى في آية البقرة", en: "Muwatta 877", es: "Muwatta 877", fr: "Muwatta 877", ur: "موطا 877", tr: "El-Muvatta 877 — El-Kâsim bin Muhammed ve İbn Ömer'in azatlı kölesi Nafi': Oruç tutmadıkça itikaf olmaz; çünkü Yüce Allah Bakara suresinde şöyle buyurmuştur:", id: "Al-Muwatta 877 — Al-Qasim bin Muhammad dan Nafi’, budak yang dibebaskan oleh Ibnu Umar: Tidak ada i'tikaf kecuali dengan berpuasa; karena apa yang Allah SWT firmankan dalam ayat Al-Baqarah" }
summary:
  ar: "يروي مالك أنه بلغه أن القاسم بن محمد ونافعاً مولى عبد الله بن عمر قالا: لا اعتكاف إلا بصيام، لقول الله تعالى في كتابه: وكلوا واشربوا حتى يتبين لكم الخيط الأبيض من الخيط الأسود من الفجر، ثم أتموا الصيام إلى الليل ولا تباشروهن وأنتم عاكفون في المساجد، فإنما ذكر الله الاعتكاف مع الصيام. ويذكر المحقق أنه رواه عن مالك أبو مصعب (873). {cite:muwatta-maruf-1997 p.422}"
  tr: "Malik, Abdullah ibn Umar'ın azatlı kölesi Nafi' ile el-Kâsim ibn Muhammed'in şöyle dediklerini işittiğini rivayet eder: \"Allah'ın Kitabında şu ayete dayanarak: 'Şafağın beyaz ipliği gecenin siyah ipliğinden ayırt edilinceye kadar yiyin ve için. Sonra orucu geceye kadar tamamlayın. Mescitlerde tenha haldeyken onlarla cinsel ilişkiye girmeyin.'\" Allah, tenha haldeyken sadece oruçla birlikte tenha halden bahsetmiştir. Araştırmacı, bunu Ebu Musab'ın (873) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.422}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa al-Qasim ibn Muhammad dan Nafi', budak yang dibebaskan oleh Abdullah ibn Umar, berkata: \"Tidak ada i'tikaf (berdiam diri di masjid) kecuali dengan berpuasa,\" berdasarkan firman Allah dalam Kitab-Nya: \"Dan makan dan minumlah sampai benang putih fajar menjadi jelas bagimu dari benang hitam [malam]. Kemudian sempurnakan puasa sampai malam tiba. Dan janganlah kamu bersetubuh dengan mereka ketika kamu berdiam diri di masjid.\" Allah hanya menyebutkan i'tikaf bersamaan dengan puasa. Peneliti menyebutkan bahwa Abu Mus'ab (873) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.422}"
