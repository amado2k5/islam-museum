label: { ar: "جامع الترمذي 2905 — الحلال، الحرام", en: "Jami' al-Tirmidhi 2905 — the lawful; the unlawful", ur: "جامع ترمذی 2905 — حلال، حرام", es: "Jami' al-Tirmidhi 2905 — lo lícito; lo ilícito", fr: "Jami' al-Tirmidhi 2905 — le licite; l'illicite", tr: "Cami' el-Tirmizi 2905 - Helal, Haram", id: "Jami' al-Tirmidzi 2905 — Halal, Haram" }
text: "… عَاصِمِ بْنِ ضَمْرَةَ، عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ قَرَأَ الْقُرْآنَ وَاسْتَظْهَرَهُ فَأَحَلَّ حَلاَلَهُ وَحَرَّمَ حَرَامَهُ أَدْخَلَهُ اللَّهُ بِهِ الْجَنَّةَ وَشَفَّعَهُ فِي عَشَرَةٍ مِنْ أَهْلِ بَيْتِهِ كُلُّهُمْ وَجَبَتْ لَهُ النَّارُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ وَلَيْسَ إِسْنَادٌ صَحِيحٍ. وَحَفْصُ بْنُ سُلَيْمَانَ أَبُو …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2905، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2905 (Chapters on The Virtues of the Qur'an), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2905، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2905 (Capítulos sobre las virtudes del Corán), menciona lo lícito y lo ilícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2905 (Chapitres sur les vertus du Coran), mentionne ce qui est licite et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'nin 2905 numaralı hadisinde helal ve haram olan şeyler belirtilmiştir. Bu hadis, Helal ve Haram Tarayıcısı tarafından Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2905, menyebutkan apa yang diperbolehkan dan diharamkan. Hadits ini dikompilasi oleh Halal and Haram Browser bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
