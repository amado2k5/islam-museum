text: "… أَوْبارَه يُرجِّع الحنين. واستقبله القومُ فى وجهه يُدَبُّون، قد أَقاموا نِصْف شهر قد تَفِلوا وشَعِثوا، رجع ولم يَصِلْ إلى النبيّ إعظاماً لا رأَى، حتى رجَعَ إِلى قُرَيشٍ فقال : إِنى قد رأَيت ما لا يَحِلُّ صَدُّه، رأَيتُ الهدْىَ فى قلائدِه …"
