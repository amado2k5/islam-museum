label: { ar: "الموطأ 303 — يزيد بن رومان: كانوا يقومون في زمان عمر بثلاث وعشرين ركعة", en: "Muwatta 303", es: "Muwatta 303", fr: "Muwatta 303", ur: "موطا 303", tr: "El-Muvatta 303 — Yezid ibn Ruman: Ömer zamanında yirmi üç rekat namaz kılıyorlardı.", id: "Al-Muwatta 303 — Yazid ibn Ruman: Mereka biasa mengerjakan dua puluh tiga rakaat pada masa Umar." }
summary:
  ar: "أثر يرويه مالك عن يزيد بن رومان، في باب ما جاء في قيام رمضان: كان الناس يقومون في زمان عمر بن الخطاب في رمضان بثلاث وعشرين ركعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي، وعلّقه البغوي. {cite:muwatta-maruf-1997 p.172}"
  tr: "Malik'in Yezid ibn Ruman'dan rivayet ettiği, Ramazan gecesi namazları hakkında rivayet edilenler bölümünde yer alan bir rivayete göre: Ömer ibn el-Hattab zamanında insanlar Ramazan ayında yirmi üç rekat namaz kılarlardı. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Yahya ibn Bukayr tarafından el-Beyhaki'nin derlemesinde nakledildiğini ve el-Baghawi'nin de tefsirinde yer aldığını belirtiyor. {cite:muwatta-maruf-1997 s.172}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yazid ibn Ruman, dalam bab tentang apa yang telah diriwayatkan mengenai shalat malam di bulan Ramadhan: Pada masa Umar ibn al-Khattab, orang-orang biasa shalat dua puluh tiga rakaat di bulan Ramadhan. Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab dan Yahya ibn Bukayr dalam kumpulan al-Bayhaqi, dan al-Baghawi memasukkannya dalam komentarnya. {cite:muwatta-maruf-1997 p.172}"
