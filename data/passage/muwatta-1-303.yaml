summary:
  ar: "أثر يرويه مالك عن يزيد بن رومان، في باب ما جاء في قيام رمضان: كان الناس يقومون في زمان عمر بن الخطاب في رمضان بثلاث وعشرين ركعة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي، وعلّقه البغوي. {cite:muwatta-maruf-1997 p.172}"
