text: "… هل تبيض الدجاجة المطبوخة؟ كان أحد التجار مُسافراً، فنزلَ في فندقٍ على الطريق، فقدَّم إليهِ الفندقيُّ دجاجةً وبيضتينِ ونصف رغيف خبز على العشاء، ووضع عَلَفاً لدابته حشيشاً. وفي الصباح عزم التاجر على مُبارحَةِ الفندق، فقال: نتحاسبُ في العودة، ونهضَ، وسار. …"
summary:
  ar: "عاد التاجر بعد ثلاثة أشهر فقدم له الطعام نفسه، فطالبه صاحب الخان بمئتي قرش، فاعترض التاجر، فعدد صاحب الخان كيف كانت البيضات ستتكاثر إلى قطيع. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  en: "Three months later the merchant returns and is served the same meal, and the innkeeper demands 200 piastres. The merchant objects, and the innkeeper itemises how the eggs would have multiplied into a flock. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  ur: "تین مہینے بعد تاجر لوٹتا ہے تو اسے وہی کھانا پیش کیا جاتا ہے اور سرائے کا مالک دو سو قرش مانگتا ہے۔ تاجر اعتراض کرتا ہے تو سرائے کا مالک گن کر بتاتا ہے کہ انڈے کس طرح بڑھ کر مرغیوں کا ریوڑ بن جاتے۔ {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  fr: "Trois mois plus tard, le marchand revient et on lui sert le même repas, et l'aubergiste réclame 200 piastres. Le marchand proteste, et l'aubergiste détaille comment les œufs se seraient multipliés en un troupeau. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  es: "Tres meses después el mercader regresa y le sirven la misma comida, y el posadero exige 200 piastras. El mercader protesta, y el posadero detalla cómo los huevos se habrían multiplicado hasta formar una bandada. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  tr: "Tüccar üç ay sonra geri döndü ve aynı yemek kendisine ikram edildi. Han sahibi iki yüz piaster istedi, ancak tüccar itiraz etti. Bunun üzerine han sahibi, yumurtaların nasıl bir sürü oluşturacak şekilde çoğaldığını anlattı. {cite:juha-nawadir-kubra-djuwaydi s. 109}"
  id: "Pedagang itu kembali tiga bulan kemudian dan ditawari makanan yang sama. Pemilik penginapan meminta dua ratus piaster, tetapi pedagang itu keberatan. Pemilik penginapan kemudian menjelaskan bagaimana telur-telur itu akan berkembang biak menjadi kawanan unggas. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
