text: "… لو كان الإنسان طائراً لَمَا أمكنه الصعودُ إلى رأس هذا العمود. وذهب إلى بيته مرتاحَ النفس مطمئنَ البال. وكان قريباً منه لصِّ يُراقِبُهُ فلمَّا أنصرفَ الشيخُ جاءَ اللصُّ وأقتلعَ العمودَ وأخذَ الدراهم، وأعاده بعدَ أنْ لَطَّخَهُ بروث البقر. وعاد الشيخُ …"
summary:
  ar: "دعا جحا طلابه إلى حساء وليس عنده سمن ولا أرز، فجاءهم بالقدر الفارغة وقال إنه لو كان عنده سمن وأرز لقدّم لهم هذا الحساء. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  en: "Juha invites students to soup but has no ghee or rice; he brings the empty pot to them and says that had he had ghee and rice he would have served them this soup. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  ur: "جحا نے طلبہ کو شوربے کی دعوت دی مگر اس کے پاس نہ گھی تھا نہ چاول؛ وہ خالی ہانڈی ان کے پاس لے آیا اور کہا کہ اگر میرے پاس گھی اور چاول ہوتے تو میں آپ کو یہ شوربہ پیش کرتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  fr: "Juha invite des étudiants à une soupe mais n'a ni beurre clarifié ni riz ; il leur apporte la marmite vide et dit que s'il avait eu du beurre clarifié et du riz, il leur aurait servi cette soupe. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
  es: "Juha invita a unos estudiantes a sopa pero no tiene ghee ni arroz; les lleva la olla vacía y dice que, de haber tenido ghee y arroz, les habría servido esa sopa. {cite:juha-nawadir-kubra-djuwaydi p. 41}"
