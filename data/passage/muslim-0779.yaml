label: { ar: "مسلم 779 — مثل البيت الذي يذكر الله فيه والبيت الذي لا يذكر الله فيه مثل الحي والميت", en: "Muslim 779 — The house where God is remembered and the house where He is not are like the living and the dead", es: "Muslim 779 — La casa donde se recuerda a Dios y la casa donde no está son como los vivos y los muertos.", fr: "Muslim 779 — La maison où l'on se souvient de Dieu et la maison où Il n'est pas présent sont comme la maison des vivants et celle des morts", ur: "مسلم 779 - وہ گھر جہاں خدا کا ذکر کیا جاتا ہے اور وہ گھر جہاں وہ نہیں ہے زندہ اور مردہ کی طرح ہے۔", tr: "Müslim 779 — Allah'ın anıldığı bir ev ile Allah'ın anılmadığı bir evin örneği, diriler ve ölüler gibidir.", id: "Muslim 779 — Perumpamaan rumah yang di dalamnya Allah diingat dan rumah yang di dalamnya Allah tidak diingat adalah seperti orang hidup dan orang mati." }
text: "قال رسول الله: «مثل البيت الذي يذكر الله تعالى فيه، والبيت الذي لا يذكر الله فيه، مثل الحي والميت»"
summary:
  ar: "رواية أبي موسى الأشعري في باب استحباب صلاة النافلة في البيت من كتاب صلاة المسافرين في صحيح مسلم؛ مثل يجعل البيوت التي يذكر الله فيها أحياءً والخالية من الذكر أمواتاً."
  tr: "Sahih Müslim'in yolculuk namazları kitabında, evde nafile namaz kılmanın müstehap olduğu bölümünde Ebu Musa el-Eş'ari'nin rivayeti, Allah'ın anıldığı evlerin diri, Allah'ın anılmadığı evlerin ise ölü olduğunu söylemeye benzer."
  id: "Riwayat Abu Musa al-Ash’ari dalam bab tentang anjuran melaksanakan salat sunnah di rumah dalam kitab salat musafir di Sahih Muslim adalah seperti mengatakan bahwa rumah-rumah yang di dalamnya terdapat zikir kepada Allah adalah rumah yang hidup, dan rumah-rumah yang tidak terdapat zikir kepada Allah adalah rumah yang mati."
