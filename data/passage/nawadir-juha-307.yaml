text: "… كيف كان ينام آباؤُنا وأجدادُنا تحته؟ كان للشيخ المسكين وزوجته لحاف واحد فقط يتدثران به في أيام الشتاء ويُضيفان إليه الجبّة. وبينما كانت السماء تثلجُ في إحدى الليالي قالت له أمرأته : كأني بك لا تكسبُ شيئاً حتى لا أراك …"
summary:
  ar: "في شتاء ثلجي وليس عندهم إلا لحاف واحد اشتكت زوجة جحا، فأخذ جحا غطاء اللحاف إلى الفناء وملأه بالثلج، فقالت زوجته إن الثلج لا يدفئ، فقال لها فكيف كان آباؤنا وأجدادنا ينامون تحته دافئين. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  en: "In a snowy winter with only one quilt, Juha's wife complains; Juha takes the quilt cover into the courtyard and fills it with snow; his wife says snow does not warm; he asks how then did our fathers and grandfathers sleep warm under it. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  ur: "برفیلی سردیوں میں ان کے پاس صرف ایک لحاف تھا اور جحا کی بیوی نے شکایت کی، تو جحا لحاف کا غلاف صحن میں لے گیا اور اسے برف سے بھر دیا، اس کی بیوی نے کہا کہ برف گرمی نہیں دیتی، تو اس نے کہا کہ پھر ہمارے باپ دادا اس کے نیچے گرم کیسے سوتے تھے۔ {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  fr: "Par un hiver neigeux, avec une seule couverture, la femme de Juha se plaint ; Juha emporte la housse dans la cour et la remplit de neige ; sa femme dit que la neige ne réchauffe pas ; il demande alors comment nos pères et nos grands-pères dormaient au chaud là-dessous. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
  es: "En un invierno nevado, con una sola colcha, la esposa de Juha se queja; Juha lleva la funda de la colcha al patio y la llena de nieve; su esposa dice que la nieve no abriga; él pregunta entonces cómo dormían abrigados debajo de ella nuestros padres y abuelos. {cite:juha-nawadir-kubra-djuwaydi p. 151}"
