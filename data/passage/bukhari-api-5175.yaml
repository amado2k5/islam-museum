label: { ar: "صحيح البخاري 5175 — المرض والمريض، عيادة المريض", en: "Sahih al-Bukhari 5175 — illness and the sick; visiting the sick", ur: "صحیح بخاری 5175 — بیماری اور بیمار، بیمار کی عیادت", es: "Sahih al-Bukhari 5175 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Sahih al-Bukhari 5175 — la maladie et les malades; rendre visite aux malades", tr: "Sahih el-Buhari 5175 — Hastalık ve Hastalar, Hasta Ziyareti", id: "Sahih al-Bukhari 5175 — Penyakit dan Orang Sakit, Menjenguk Orang Sakit" }
text: "… أَبُو الأَحْوَصِ، عَنِ الأَشْعَثِ، عَنْ مُعَاوِيَةَ بْنِ سُوَيْدٍ، قَالَ الْبَرَاءُ بْنُ عَازِبٍما ـ أَمَرَنَا النَّبِيُّ بِسَبْعٍ، وَنَهَانَا عَنْ سَبْعٍ، أَمَرَنَا بِعِيَادَةِ الْمَرِيضِ، وَاتِّبَاعِ الْجِنَازَةِ، وَتَشْمِيتِ الْعَاطِسِ، وَإِبْرَارِ الْقَسَمِ، وَنَصْرِ الْمَظْلُومِ، وَإِفْشَاءِ السَّلاَمِ، وَإِجَابَةِ الدَّاعِي، وَنَهَانَا عَنْ خَوَاتِيمِ الذَّهَبِ، وَعَنْ آنِيَةِ الْفِضَّةِ، وَعَنِ الْمَيَاثِرِ، وَالْقَسِّيَّةِ، وَالإِسْتَبْرَقِ وَالدِّيبَاجِ. تَابَعَهُ أَبُو عَوَانَةَ وَالشَّيْبَانِيُّ عَنْ أَشْعَثَ فِي إِفْشَاءِ السَّلاَمِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5175، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5175 (Wedlock, Marriage (Nikaah)), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5175، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5175 (Matrimonio (Nikaah)), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5175 (Mariage, Nikah), mentionne la maladie et les malades, ainsi que les visites aux malades. Le dictionnaire de référence des textes médicaux (Medicine Browser) le classe parmi les ouvrages traitant de médecine prophétique, de médecine, d'anatomie, de chirurgie, de médicaments et de traitements."
  tr: "Sahih el-Buhari'de 5175 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5175, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
