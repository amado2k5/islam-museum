label: { ar: "صحيح البخاري 5175 — المرض والمريض، عيادة المريض", en: "Sahih al-Bukhari 5175 — illness and the sick; visiting the sick", ur: "صحیح بخاری 5175 — بیماری اور بیمار، بیمار کی عیادت" }
text: "… أَبُو الأَحْوَصِ، عَنِ الأَشْعَثِ، عَنْ مُعَاوِيَةَ بْنِ سُوَيْدٍ، قَالَ الْبَرَاءُ بْنُ عَازِبٍما ـ أَمَرَنَا النَّبِيُّ بِسَبْعٍ، وَنَهَانَا عَنْ سَبْعٍ، أَمَرَنَا بِعِيَادَةِ الْمَرِيضِ، وَاتِّبَاعِ الْجِنَازَةِ، وَتَشْمِيتِ الْعَاطِسِ، وَإِبْرَارِ الْقَسَمِ، وَنَصْرِ الْمَظْلُومِ، وَإِفْشَاءِ السَّلاَمِ، وَإِجَابَةِ الدَّاعِي، وَنَهَانَا عَنْ خَوَاتِيمِ الذَّهَبِ، وَعَنْ آنِيَةِ الْفِضَّةِ، وَعَنِ الْمَيَاثِرِ، وَالْقَسِّيَّةِ، وَالإِسْتَبْرَقِ وَالدِّيبَاجِ. تَابَعَهُ أَبُو عَوَانَةَ وَالشَّيْبَانِيُّ عَنْ أَشْعَثَ فِي إِفْشَاءِ السَّلاَمِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5175، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5175 (Wedlock, Marriage (Nikaah)), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5175، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
