label: { ar: "الموطأ 2185 — مالك: فأما الرجل يتحمل له الرجل بدين له على رجل آخر، ثم يهلك المتحمل أو يفلس، فإن الذي تحمل له يرجع على غريمه الأول", en: "Muwatta 2185", es: "Muwatta 2185", fr: "Muwatta 2185", ur: "موطا 2185", tr: "Al-Muwatta 2185 — Malik: Bir kimse, başka bir kimsenin kendisine olan borcuna kefil olursa ve kefil olan kişi ölür veya iflas ederse, kefil olunan kişi asıl borçlusundan alacak talebinde bulunabilir.", id: "Al-Muwatta 2185 — Malik: Jika seseorang menjamin utang yang dimiliki orang lain kepadanya, dan kemudian orang yang menjamin utang tersebut meninggal dunia atau bangkrut, maka orang yang dijamin utangnya dapat menuntut ganti rugi dari debitur aslinya." }
summary:
  ar: "قال مالك: فأما الرجل يتحمل له الرجل بدين له على رجل آخر، ثم يهلك المتحمل، أو يفلس، فإن الذي تحمل له يرجع على غريمه الأول. {cite:muwatta-maruf-1997 p.296}"
  tr: "Malik şöyle demiştir: Bir kişi, başka bir kişinin kendisine olan borcuna kefil olursa ve kefil olan kişi ölür veya iflas ederse, kefalet verilen kişi asıl borçlusundan tazminat talep edebilir. {cite:muwatta-maruf-1997 s.296}"
  id: "Malik berkata: Jika seseorang menjamin utang yang dimiliki orang lain kepadanya, dan kemudian orang yang menjamin utang tersebut meninggal dunia atau bangkrut, maka orang yang dijamin utangnya dapat menuntut ganti rugi dari debitur aslinya. {cite:muwatta-maruf-1997 p.296}"
