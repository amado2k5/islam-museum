text: "سنة يسار بالخريطة الواردة بسلامة الموسم وامر ان يقام على المشعر الحرام وسائر المشاعر الشمع مكان الزيت والنفط وفيّهَا مأنت ام المتوكّل بالجعفريّة لست خلون من شهر ربيع الآخر وصلى عليها المنتصر ودفنت عند المسجد لجامع وقيهَا بويع للمنتصر محمّد …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 1، ص 199، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
