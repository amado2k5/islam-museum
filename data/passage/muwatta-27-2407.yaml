label: { ar: "الموطأ 2407 — عبد الله بن عبد الرحمن بن أبي حسين: لا قطع في ثمر معلق ولا حريسة جبل", en: "Muwatta 2407" }
summary:
  ar: "حدث مالك عن عبد الله بن عبد الرحمن بن أبي حسين المكي أن النبي قال: لا قطع في ثمر معلق، ولا في حريسة جبل. فإذا آواه المراح أو الجرين فالقطع فيما يبلغ ثمن المجن. ويذكر المحقق أن الحديث في الموطأ مرسل عند الرواة كلهم، وأن معناه متصل من حديث عبد الله بن عمرو بن العاص، ومحفوظ من حديث رافع بن خديج. {cite:muwatta-maruf-1997 p.394}"
