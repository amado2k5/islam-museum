label: { ar: "الموطأ 335 — القاسم بن محمد: إني لأوتر بعد الفجر، ومالك: لا يتعمد ذلك أحد", en: "Muwatta 335" }
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن القاسم أنه سمع أباه القاسم بن محمد يقول إنه ليوتر بعد الفجر؛ ويعلق مالك بأن الوتر بعد الفجر إنما هو لمن نام عن الوتر، ولا ينبغي لأحد أن يتعمد تأخير وتره إلى ما بعد الفجر. وهو في باب الوتر بعد الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.185} {cite:muwatta-maruf-1997 p.186}"
