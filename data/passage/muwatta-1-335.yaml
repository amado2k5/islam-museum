label: { ar: "الموطأ 335 — القاسم بن محمد: إني لأوتر بعد الفجر، ومالك: لا يتعمد ذلك أحد", en: "Muwatta 335", es: "Muwatta 335", fr: "Muwatta 335", ur: "موطا 335", tr: "El-Muvatta 335 — El-Kâsım ibn Muhammed: Ben Vitr namazını sabah namazından sonra kılıyorum. Malik: Kimse bunu kasten yapmaz.", id: "Al-Muwatta 335 — Al-Qasim ibn Muhammad: Aku shalat Witir setelah Subuh. Malik: Tidak ada seorang pun yang melakukannya dengan sengaja." }
summary:
  ar: "أثر يرويه مالك عن عبد الرحمن بن القاسم أنه سمع أباه القاسم بن محمد يقول إنه ليوتر بعد الفجر؛ ويعلق مالك بأن الوتر بعد الفجر إنما هو لمن نام عن الوتر، ولا ينبغي لأحد أن يتعمد تأخير وتره إلى ما بعد الفجر. وهو في باب الوتر بعد الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.185} {cite:muwatta-maruf-1997 p.186}"
  tr: "Malik'in, babası el-Kâsım ibn Muhammed'in, vitr namazını şafaktan sonra kılacağını söylediğini işittiğini rivayet ettiği bir hadiste, Abdülrahman ibn el-Kâsım'dan bahsedilir. Malik, vitr namazını şafaktan sonra kılmanın sadece uyuyakalan ve namazı kaçıranlar için geçerli olduğunu ve kimsenin kasten vitr namazını şafaktan sonraya ertelememesi gerektiğini belirtir. Bu, şafaktan sonra vitr namazı bölümünde yer almaktadır. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.185} {cite:muwatta-maruf-1997 s.186}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Abd al-Rahman ibn al-Qasim, yang mendengar ayahnya, al-Qasim ibn Muhammad, mengatakan bahwa ia biasa melaksanakan salat witr setelah subuh. Malik berkomentar bahwa melaksanakan salat witr setelah subuh hanya untuk orang yang ketiduran dan melewatkannya, dan tidak seorang pun boleh sengaja menunda salat witr hingga setelah subuh. Hal ini terdapat dalam bab tentang salat witr setelah subuh. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.185} {cite:muwatta-maruf-1997 p.186}"
