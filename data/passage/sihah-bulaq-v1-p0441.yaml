  حابا
  يضى ءربايا كدهم المخاض * جللن فوق الولايا الوليحا
  ⁦(ويح)⁩ ويح كلة رحة وويل كلمة عذاب وقال اليزيدىّ هما بعنى تقول ويح لزيدوويل
