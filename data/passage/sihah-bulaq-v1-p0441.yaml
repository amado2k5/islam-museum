text: |-
  ⁦(با ب انخاء)⁩
  أحب منك موضع الوشحن * وموضع اللبة والقرطن يعنى الوشاح
  واغايزيدون هذه النون المشددة فى ضرورة المشعر وواشح قبيلة من المين (وضح
  الامريضمح وضوحا واتضح أى بان وأوضحته أنا وأوضح الرجل ولدله أ ولاديبض وقولهم من
  أين أوضحت أى من أين اطلعت ومن أين بدا وضحك واستوضحت المشئ اذا وضعت يدلكْ على
  عينك تنظرهل تراه يقال استوضح عنه يافلان واستوضحته الامر أو الكلام اذ اسألته أن
  يوضحه لك وتوضح ملك العاريق أى استبان والمتوضح الذى يظهر نفسه فى الطريق ولا يدخل
  الهرووفح الطريق محجته والوضح الدرهم الصحيح والاوضاح حلى من الدراهم الصحاح
  والوضح الضوء والبياض يقال بالفرم وضح اذاكانت به شية وقد يكنى به عن البرس
  ومنه قيل لجذيمة الابرس الوضاح والوضاح أيضا الرجل الايض اللون الحسنه والموضحة
  الثعجبة التى تبدى وضع ال تليل كنت فالتسنات الانر الهي وافهه قال طرقة
  ⁦( وطح)⁩ الوطح ما تعلق بالأظلاف ومخالب الطير من العرّة أوالطين الاموى تواطح القوم
  تداولوا الشرّفيما بينهم وأنشد يتواطحون به على دينارأى يتقاتلون ⁦( وقح )⁩
  6اقروقاح آى صاب والجمع وقيح مثل قذال وقدل وقد وقح بالضم يوقح وقاحة ووقوح.
  ووقوحاوو محابا اضم يخفف ويثقل ومحة وقحة والهاء عوض من الواووكذلك أوقح الحاف
  واستوقح وبقال أيضا وقح الرجل اذا صار قليل الحياء فهو وقح ووقاح بين القحة والقحا
