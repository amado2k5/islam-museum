label: { ar: "سنن أبي داود 1228 — الرخصة، الصلاة المكتوبة", en: "Sunan Abi Dawud 1228 — the concession (rukhsa); the prescribed prayer", ur: "سنن ابی داؤد 1228 — رخصت، فرض نماز", fr: "Sunan Abi Dawud 1228 — la dispense (rukhsa) ; la prière prescrite", es: "Sunan Abi Dawud 1228 — la dispensa (rukhsa); la oración prescrita", tr: "Sunan Abi Davud 1228 — Vakit, Zorunlu Dua", id: "Sunan Abi Dawud 1228 — Tata Cara Shalat, Shalat Wajib" }
text: "حَدَّثَنَا مَحْمُودُ بْنُ خَالِدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ شُعَيْبٍ، عَنِ النُّعْمَانِ بْنِ الْمُنْذِرِ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، أَنَّهُ سَأَلَ عَائِشَةَ -ا - هَلْ رُخِّصَ لِلنِّسَاءِ أَنْ يُصَلِّينَ عَلَى الدَّوَابِّ قَالَتْ لَمْ يُرَخَّصْ لَهُنَّ فِي ذَلِكَ فِي شِدَّةٍ وَلاَ رَخَاءٍ. قَالَ مُحَمَّدٌ هَذَا فِي الْمَكْتُوبَةِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1228، يرد فيه ذكر الرخصة، والصلاة المكتوبة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 1228 (Prayer (Kitab Al-Salat): Detailed Rules of Law about the Prayer during Journey), whose wording mentions the concession (rukhsa), the prescribed prayer. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 1228، جس کے الفاظ میں رخصت، فرض نماز کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 1228, dont le texte mentionne la dispense (rukhsa), la prière prescrite. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 1228, cuyo texto menciona la dispensa (rukhsa), la oración prescrita. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sünen Ebu Davud'da 1228 numaralı hadis, namazın farz ve müstehap olduğunu belirtir. Bu hadis, farz amelleri, itaat amelleri, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları derleyen kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Derleyen kişi metnin içeriğini anlatır ancak buna dayanarak bir fetva vermez."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 1228, menyebutkan keringanan dan shalat wajib. Hadits ini disusun oleh penyusunnya mengenai amalan wajib, amalan ketaatan, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Penyusun tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
