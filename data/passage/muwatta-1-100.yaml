label: { ar: "الموطأ 100 — بسرة بنت صفوان: إذا مس أحدكم ذكره فليتوضأ", en: "Muwatta 100", es: "100 palabras", fr: "100 mots", ur: "100 الفاظ", tr: "Al-Muwatta 100 — Busrah bint Safwan: Eğer biriniz cinsel organına dokunursa, abdest alsın.", id: "Al-Muwatta 100 — Busrah bint Safwan: Jika salah seorang dari kalian menyentuh kemaluannya, hendaklah ia berwudhu." }
text: "إذا مس أحدكم ذكره فليتوضأ"
summary:
  ar: "أول حديث في باب الوضوء من مس الفرج. يرويه يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم أنه سمع عروة بن الزبير يقول: دخل على مروان بن الحكم فتذاكرا ما يوجب الوضوء، فذكر مروان مس الذكر، فقال عروة إنه لم يعلم ذلك، فأخبره مروان أن بسرة بنت صفوان حدثته أنها سمعت النبي يأمر من مس ذكره بالوضوء. ويبين المحقق أن نسخة يحيى جعلت الإسناد «عن عبد الله بن أبي بكر عن محمد بن عمرو بن حزم» وأن ابن عبد البر عدّ ذلك وهماً أفسد الإسناد والصواب «بن» لأن الحديث لعبد الله بن أبي بكر عن عروة، ويخرّجه عند أبي داود (181) والنسائي (1/100) والشافعي والبيهقي من طرق أصحاب مالك، وينقل أن يحيى بن معين كان يقول إن أصح حديث في مس الذكر حديث مالك هذا، وأن أحمد بن حنبل قال نحو ذلك ⁦(التمهيد 17/191)⁩. {cite:muwatta-maruf-1997 p.84} {cite:muwatta-maruf-1997 p.85}"
  tr: "Cinsel organlara dokunduktan sonra abdest alma konusundaki hadis bölümünün ilk hadisi. Yahya, Malik'ten, Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan rivayet etmiştir. Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm, Urve ibn el-Zubayr'ın şöyle dediğini işitmiştir: Mervan ibn el-Hakam'ın yanına girdi ve abdestin gerektirdikleri konusunda görüştüler. Mervan, cinsel organa dokunmaktan bahsetti ve Urve bunu bilmediğini söyledi. Bunun üzerine Mervan, Busra bint Safvan'ın kendisine Peygamber'in cinsel organına dokunan kişiye abdest almasını emrettiğini duyduğunu söylediğini aktardı. Araştırmacı, Yahya'nın rivayet zincirini \"Abdullah ibn Abi Bakr'dan, Muhammed ibn Amr ibn Hazm'dan rivayetle\" şeklinde verdiğini ve İbn Abd el-Barr'ın bunu rivayet zincirini bozan bir hata olarak değerlendirdiğini açıklığa kavuşturmaktadır. Doğru versiyon \"dan rivayetle\"dir, çünkü hadis Abdullah ibn Abi Bakr'dan, Urve'den rivayet edilmiştir. Bu hadis, Malik'in sahabelerinin rivayet zincirleriyle Ebu Davud (181), el-Nesai (1/100), el-Şafiî ve el-Beyhaki'nin derlemelerinde de bulunmaktadır. Yahya ibn Ma'in'in, penise dokunma konusunda en sahih hadisin Malik'in bu hadisi olduğunu söylediği ve Ahmed ibn Hanbel'in de benzer bir şey söylediği rivayet edilmiştir (el-Temhid 17/191). {cite:muwatta-maruf-1997 s.84} {cite:muwatta-maruf-1997 s.85}"
  id: "Hadits pertama dalam surah ini membahas tentang wudhu setelah menyentuh kemaluan. Diriwayatkan oleh Yahya dari Malik, dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, yang mendengar Urwah ibn al-Zubayr berkata: Ia menemui Marwan ibn al-Hakam, dan mereka membahas apa yang mengharuskan wudhu. Marwan menyebutkan menyentuh kemaluan, dan Urwah berkata bahwa ia tidak mengetahuinya. Marwan kemudian memberitahunya bahwa Busrah bint Safwan telah mengatakan kepadanya bahwa ia mendengar Nabi memerintahkan orang yang menyentuh kemaluannya untuk berwudhu. Peneliti mengklarifikasi bahwa versi Yahya memberikan sanad sebagai \"dari Abdullah ibn Abi Bakr dari Muhammad ibn Amr ibn Hazm,\" dan bahwa Ibnu Abd al-Barr menganggap ini sebagai kesalahan yang merusak sanad. Versi yang benar adalah \"berdasarkan riwayat,\" karena hadits ini berasal dari Abdullah ibn Abi Bakr berdasarkan riwayat Urwah. Hadits ini juga ditemukan dalam kumpulan hadits Abu Dawud (181), al-Nasa'i (1/100), al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik. Diriwayatkan bahwa Yahya ibn Ma'in biasa mengatakan bahwa hadits yang paling sahih mengenai menyentuh penis adalah hadits Malik ini, dan Ahmad ibn Hanbal mengatakan hal yang serupa (al-Tamhid 17/191). {cite:muwatta-maruf-1997 p.84} {cite:muwatta-maruf-1997 p.85}"
