label: { ar: "الموطأ 100 — بسرة بنت صفوان: إذا مس أحدكم ذكره فليتوضأ", en: "Muwatta 100" }
text: "إذا مس أحدكم ذكره فليتوضأ"
summary:
  ar: "أول حديث في باب الوضوء من مس الفرج. يرويه يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم أنه سمع عروة بن الزبير يقول: دخل على مروان بن الحكم فتذاكرا ما يوجب الوضوء، فذكر مروان مس الذكر، فقال عروة إنه لم يعلم ذلك، فأخبره مروان أن بسرة بنت صفوان حدثته أنها سمعت النبي يأمر من مس ذكره بالوضوء. ويبين المحقق أن نسخة يحيى جعلت الإسناد «عن عبد الله بن أبي بكر عن محمد بن عمرو بن حزم» وأن ابن عبد البر عدّ ذلك وهماً أفسد الإسناد والصواب «بن» لأن الحديث لعبد الله بن أبي بكر عن عروة، ويخرّجه عند أبي داود (181) والنسائي (1/100) والشافعي والبيهقي من طرق أصحاب مالك، وينقل أن يحيى بن معين كان يقول إن أصح حديث في مس الذكر حديث مالك هذا، وأن أحمد بن حنبل قال نحو ذلك (التمهيد 17/191). {cite:muwatta-maruf-1997 p.84} {cite:muwatta-maruf-1997 p.85}"
