text: "نده - اليم - شىء يصلحه ، فأرسل إلى رجل من اليهود : يقول لك محمد رسول الله: أسلفنى دقيقا إلى هلال رجب. قال اليهودى: لا إلا برهن. فأتيت النبى - ليز - فأخبرته ، فقال : أما والله إنى"
