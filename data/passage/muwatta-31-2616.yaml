label: { ar: "الموطأ 2616 — أبو هريرة: احتجاج آدم على موسى بالقدر المكتوب قبل خلقه", en: "Muwatta 2616", es: "Muwatta 2616", fr: "Muwatta 2616", ur: "موطا 2616", tr: "El-Muvatta 2616 — Ebu Hurayra: Adem'in, yaratılışından önce belirlenmiş kader konusunda Musa ile olan tartışması", id: "Al-Muwatta 2616 — Abu Hurairah: Perdebatan Adam dengan Musa mengenai takdir yang telah ditentukan sebelum penciptaannya" }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: تحاج آدم وموسى، فحج آدم موسى. قال له موسى: أنت آدم الذي أغويت الناس وأخرجتهم من الجنة؟ فقال له آدم: أنت موسى الذي أعطاه الله علم كل شيء واصطفاه على الناس برسالته؟ قال: نعم. قال: أفتلومني على أمر قد قُدّر عليّ قبل أن أُخلق؟ ويذكر المحقق أن أحد النسخ جعل هذا الباب أول كتاب القدر، وأن هذا التبويب لا أصل له في المخطوطات. {cite:muwatta-maruf-1997 p.477}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu aktarır: Âdem ile Musa tartıştılar ve Âdem Musa'ya üstün geldi. Musa ona dedi ki: \"Sen, insanları saptıran ve onları cennetten kovduran Âdem misin?\" Âdem cevap verdi: \"Sen, Allah'ın her şeyi bildiği ve mesajı için bütün insanlar arasından seçtiği Musa mısın?\" Musa dedi ki: \"Evet.\" Âdem dedi ki: \"Öyleyse, yaratılmadan önce benim için takdir edilmiş bir şey için beni mi suçluyorsun?\" Editör, el yazmalarından birinin bu bölümü Kader Kitabı'nın başına yerleştirdiğini ve bu düzenlemenin el yazmalarında hiçbir dayanağı olmadığını belirtmektedir. {cite:muwatta-maruf-1997 s.477}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: Adam dan Musa berdebat, dan Adam menang atas Musa. Musa berkata kepadanya: \"Apakah engkau Adam, yang menyesatkan manusia dan menyebabkan mereka diusir dari Surga?\" Adam menjawab: \"Apakah engkau Musa, yang kepadanya Allah memberikan pengetahuan tentang segala sesuatu dan yang Dia pilih di atas semua manusia untuk menyampaikan pesan-Nya?\" Dia berkata: \"Ya.\" Adam berkata: \"Lalu apakah engkau menyalahkan aku atas sesuatu yang telah ditetapkan untukku sebelum aku diciptakan?\" Editor mencatat bahwa salah satu manuskrip menempatkan bab ini di awal Kitab Takdir, dan bahwa susunan ini tidak memiliki dasar dalam manuskrip. {cite:muwatta-maruf-1997 p.477}"
