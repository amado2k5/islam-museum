label: { ar: "الموطأ 2616 — أبو هريرة: احتجاج آدم على موسى بالقدر المكتوب قبل خلقه", en: "Muwatta 2616" }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: تحاج آدم وموسى، فحج آدم موسى. قال له موسى: أنت آدم الذي أغويت الناس وأخرجتهم من الجنة؟ فقال له آدم: أنت موسى الذي أعطاه الله علم كل شيء واصطفاه على الناس برسالته؟ قال: نعم. قال: أفتلومني على أمر قد قُدّر عليّ قبل أن أُخلق؟ ويذكر المحقق أن أحد النسخ جعل هذا الباب أول كتاب القدر، وأن هذا التبويب لا أصل له في المخطوطات. {cite:muwatta-maruf-1997 p.477}"
