label: { ar: "جامع الترمذي 3214 — ما أُحل", en: "Jami' al-Tirmidhi 3214 — what was made lawful", ur: "جامع ترمذی 3214 — جو حلال کیا گیا", es: "Jami' al-Tirmidhi 3214 — lo que se hizo lícito", fr: "Jami' al-Tirmidhi 3214 — ce qui a été rendu licite", tr: "Cami' el-Tirmizi 3214 — Neler caizdir?", id: "Jami' al-Tirmidhi 3214 — Apa yang diperbolehkan" }
text: "… أُمِّ هَانِئٍ بِنْتِ أَبِي طَالِبٍ، قَالَتْ خَطَبَنِي رَسُولُ اللَّهِ فَاعْتَذَرْتُ إِلَيْهِ فَعَذَرَنِي ثُمَّ أَنْزَلَ اللَّهُ تَعَالَى : ⁦(إنَّا أَحْلَلْنَا لَكَ أَزْوَاجَكَ اللاَّتِي آتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّا أَفَاءَ اللَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّاتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَالاَتِكَ اللاَّتِي هَاجَرْنَ مَعَكَ وَامْرَأَةً مُؤْمِنَةً إِنْ وَهَبَتْ نَفْسَهَا لِلنَّبِيِّ )⁩ الآيَةَ قَالَتْ فَلَمْ أَكُنْ أَحِلُّ لَهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3214، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3214 (Chapters on Tafsir), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3214، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3214 (Capítulos sobre Tafsir), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3214 (chapitres sur le Tafsir), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'nin 3214 numaralı hadisinde helal ve haram olan şeyler belirtilmiştir. Helal ve haram tarayıcısı, bunu Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birleştirerek helal ve haram olanı ayırt eder."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3214, menyebutkan apa yang diperbolehkan. Peramban Halal dan Haram menggabungkan ini dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
