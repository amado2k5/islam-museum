label: { ar: "الموطأ 925 — مالك: لا بأس أن يدهن الرجل بدهن ليس فيه طيب قبل أن يحرم، وقبل أن يفيض من منى بعد رمي الجمرة", en: "Muwatta 925", es: "Plata de ley 925", fr: "Argent sterling 925", ur: "925 سٹرلنگ سلور", tr: "El-Muvatta 925 — Malik: Bir erkeğin ihrama girmeden önce ve Cemarat'a taş attıktan sonra Mina'dan ayrılmadan önce parfüm içermeyen bir yağ sürmesinde bir sakınca yoktur.", id: "Al-Muwatta 925 — Malik: Tidak ada salahnya seorang pria mengoleskan minyak yang tidak mengandung parfum sebelum memasuki keadaan ihram, dan sebelum meninggalkan Mina setelah melempar batu ke Jamarat." }
text: "لا بأس أن يدهن الرجل بدهن ليس فيه طيب قبل أن يحرم، وقبل أن يفيض من منى بعد رمي الجمرة"
summary:
  ar: "قول لمالك: لا بأس أن يدهن الرجل بدهن ليس فيه طيب قبل أن يحرم، وقبل أن يفيض من منى بعد رمي الجمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1055). {cite:muwatta-maruf-1997 p.444}"
  tr: "Malik şöyle demiştir: Bir erkeğin ihrama girmeden önce ve Cemarat'a taş attıktan sonra Mina'dan ayrılmadan önce parfüm içermeyen bir yağ sürmesinde bir sakınca yoktur. Araştırmacı, bunu Ebu Musab'ın (1055) Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.444}"
  id: "Malik berkata: Tidak ada salahnya seorang pria mengoleskan minyak yang tidak mengandung parfum sebelum memasuki keadaan ihram dan sebelum meninggalkan Mina setelah melempar batu ke Jamarat. Peneliti menyebutkan bahwa Abu Mus'ab (1055) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.444}"
