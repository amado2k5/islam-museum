label:
  ar: "البخاري 7510 — حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع"
  en: "Bukhari 7510 — The great intercession: raise your head, intercede and it will be granted"
  ur: "بخاری 7510 — بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی"
text: "إذا كان يوم القيامة ماج الناس بعضهم في بعض فيأتون آدم فيقولون اشفع لنا إلى ربك. فيقول لست لها ولكن عليكم بإبراهيم فإنه خليل الرحمن. فيأتون إبراهيم فيقول لست لها ولكن عليكم بموسى فإنه كليم الله. فيأتون موسى فيقول لست …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7510: حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7510: The great intercession: raise your head, intercede and it will be granted. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7510: بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
