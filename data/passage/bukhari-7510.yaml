ref: "7510"
label:
  ar: "البخاري 7510 — حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع"
  en: "Bukhari 7510 — The great intercession: raise your head, intercede and it will be granted"
  ur: "بخاری 7510 — بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی"
  es: "Bukhari 7510 — La gran intercesión: levanta la cabeza, intercede y te será concedida."
  fr: "Bukhari 7510 — La grande intercession: lève la tête, intercède et tu seras exaucé."
  tr: "Buhari 7510 — Büyük Şefaat Hadisi: Başını kaldır ve şefaat et, şefaatın kabul olur."
  id: "Bukhari 7510 — Hadits Syafaat Agung: Angkatlah kepalamu dan bersyafaatlah, maka syafaatmu akan diterima."
text: "إذا كان يوم القيامة ماج الناس بعضهم في بعض فيأتون آدم فيقولون اشفع لنا إلى ربك. فيقول لست لها ولكن عليكم بإبراهيم فإنه خليل الرحمن. فيأتون إبراهيم فيقول لست لها ولكن عليكم بموسى فإنه كليم الله. فيأتون موسى فيقول لست …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7510: حديث الشفاعة الكبرى: ارفع رأسك واشفع تشفع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7510: The great intercession: raise your head, intercede and it will be granted. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7510: بڑی شفاعت کی حدیث: سر اٹھاؤ، شفاعت کرو قبول ہوگی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 7510: La gran intercesión: alza la cabeza, intercede y te será concedida. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 7510: La grande intercession: lève la tête, intercède et ta requête sera exaucée. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sahih el-Buhari'de 7510 numaralı hadis-i kudsi olarak geçen büyük şefaat hadisi: Başını kaldır ve şefaat et, şefaatın kabul olur. Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi derleyicisi, bu hadisin rivayetlerini altı şeriat hadisi külliyatında ve el-Muvatta'da toplamıştır."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, nomor 7510: Hadits Syafaat Agung: Angkatlah kepalamu dan bersyafaatlah, maka syafaatmu akan diterima. Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan penyusun koleksi hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan al-Muwatta."
