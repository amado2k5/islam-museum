label: { ar: "الموطأ 288 — مالك: لا جمعة بقرية لا تجب فيها الجمعة وإن جمّع الإمام", en: "Muwatta 288", es: "Muwatta 288", fr: "Muwatta 288", ur: "موطا 288", tr: "Al-Muwatta 288 — Malik: Cuma namazının farz olmadığı bir köyde, imam namazı kıldırsa bile, cuma namazı kılınmaz.", id: "Al-Muwatta 288 — Malik: Tidak ada salat Jumat di sebuah desa yang salat Jumatnya tidak wajib, meskipun imam memimpin salat tersebut." }
summary:
  ar: "قول لمالك في باب ما جاء في الإمام ينزل بقرية يوم الجمعة في السفر: إن جمّع الإمام وهو مسافر بقرية لا تجب فيها الجمعة فلا جمعة له ولا لأهل تلك القرية ولا لمن جمّع معهم من غيرهم، وليتم أهل تلك القرية ومن ليس بمسافر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163} {cite:muwatta-maruf-1997 p.164}"
  tr: "Malik, yolculuk halindeyken cuma günü bir köyde mola veren imam hakkında rivayet edilenler bölümünde şöyle demiştir: Eğer imam yolculuk halindeyken cuma namazının farz olmadığı bir köyde namaz kılarsa, ne kendisi için, ne o köy halkı için, ne de namaza onunla birlikte katılanlar için cuma namazı yoktur. O köy halkı ve yolculukta olmayanlar namazı tamamlamalıdır. Araştırmacı, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.163} {cite:muwatta-maruf-1997 s.164}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan tentang seorang imam yang singgah di sebuah desa pada hari Jumat saat bepergian: Jika seorang imam, saat bepergian, memimpin salat Jumat di sebuah desa di mana salat Jumat tidak wajib, maka tidak ada salat Jumat baginya, demikian pula bagi penduduk desa itu, dan juga bagi orang-orang yang ikut salat bersamanya. Penduduk desa itu dan orang-orang yang tidak bepergian wajib melengkapi salat tersebut. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.163} {cite:muwatta-maruf-1997 p.164}"
