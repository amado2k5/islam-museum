summary:
  ar: "قول لمالك في باب ما جاء في الإمام ينزل بقرية يوم الجمعة في السفر: إن جمّع الإمام وهو مسافر بقرية لا تجب فيها الجمعة فلا جمعة له ولا لأهل تلك القرية ولا لمن جمّع معهم من غيرهم، وليتم أهل تلك القرية ومن ليس بمسافر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163} {cite:muwatta-maruf-1997 p.164}"
