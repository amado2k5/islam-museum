label: { ar: "الموطأ 261 — أبو طلحة والدبسي في حائطه: هو صدقة لله", en: "Muwatta 261" }
text: "لقد أصابتني في مالي هذا فتنة"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر، في باب النظر في الصلاة إلى ما يشغلك عنها: كان أبو طلحة الأنصاري يصلي في حائطه فطار دبسي، وهو طائر صغير، فجعل يتردد يلتمس مخرجاً، فأعجبه ذلك فتبعه ببصره ساعة ثم رجع إلى صلاته فلم يدر كم صلى، فقال إن ماله هذا أصابه فيه فتنة، فجاء النبي فذكر له ذلك وجعل الحائط صدقة لله يضعه حيث شاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وينقل عن ابن عبد البر أنه لا يعلمه يروى من غير هذا الوجه وأنه منقطع (التمهيد 17/389). {cite:muwatta-maruf-1997 p.154}"
