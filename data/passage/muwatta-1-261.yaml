text: "لقد أصابتني في مالي هذا فتنة"
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر، في باب النظر في الصلاة إلى ما يشغلك عنها: كان أبو طلحة الأنصاري يصلي في حائطه فطار دبسي، وهو طائر صغير، فجعل يتردد يلتمس مخرجاً، فأعجبه ذلك فتبعه ببصره ساعة ثم رجع إلى صلاته فلم يدر كم صلى، فقال إن ماله هذا أصابه فيه فتنة، فجاء النبي فذكر له ذلك وجعل الحائط صدقة لله يضعه حيث شاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وينقل عن ابن عبد البر أنه لا يعلمه يروى من غير هذا الوجه وأنه منقطع ⁦(التمهيد 17/389)⁩. {cite:muwatta-maruf-1997 p.154}"
  tr: "Malik, namazda dikkati dağıtan şeylere bakmak bölümünde, Abdullah ibn Abi Bekr'den rivayetle şöyle aktarmıştır: Ebu Talha el-Ensari bahçesinde namaz kılarken, küçük bir kuş, bir dabsi, uçarak geçti ve çıkış yolu arayarak etrafında dönmeye başladı. Bu durum onu eğlendirdi ve bir süre bakışlarıyla onu takip etti, sonra namazına döndü. Kaç rekat kıldığını bilmiyordu. \"Bu malım bir imtihana uğradı\" dedi. Bunun üzerine Peygamber'e gidip durumu anlattı ve bahçeyi Allah rızası için sadaka olarak verdi, Allah'ın dilediği gibi kullanılması için. Araştırmacı, Ebu Musab, Suveyd ve Yahya ibn Bukayr'ın bunu Malik'ten rivayet ettiğini, el-Beyhaki'nin de kaydettiğini belirtiyor. İbn Abd el-Barr'ın ise başka bir rivayet zincirinden rivayet edildiğini bilmediğini ve bunun bağlantısız olduğunu söylediğini aktarıyor (el-Tamhid 17/389). {cite:muwatta-maruf-1997 s.154}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Abi Bakr, dalam surah tentang memperhatikan hal-hal yang mengalihkan perhatian saat shalat: Abu Talha al-Ansari sedang shalat di kebunnya ketika seekor burung kecil, dabsi, terbang dan mulai berputar-putar, mencari jalan keluar. Ia merasa geli dan mengikutinya dengan pandangannya sejenak, lalu kembali shalat. Ia tidak tahu berapa rakaat yang telah ia kerjakan. Ia berkata, \"Harta milikku ini telah ditimpa cobaan.\" Maka ia pergi kepada Nabi dan menceritakannya, lalu ia mendedikasikan kebun itu sebagai sedekah demi Allah, untuk diatur sesuai kehendak-Nya. Peneliti menyebutkan bahwa Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr meriwayatkan hadits ini dari Malik, sebagaimana dicatat oleh al-Bayhaqi. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa ia tidak mengetahui adanya riwayat hadits ini melalui rantai periwayatan lain dan bahwa riwayat ini terputus (al-Tamhid 17/389). {mengutip:muwatta-maruf-1997 hal.154}"
