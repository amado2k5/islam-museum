label: { ar: "سنن أبي داود 4643 — الحلال، ما أُحل", en: "Sunan Abi Dawud 4643 — the lawful; what was made lawful", ur: "سنن ابی داؤد 4643 — حلال، جو حلال کیا گیا", es: "Sunan Abi Dawud 4643 — lo lícito; lo que fue lícito", fr: "Sunan Abi Dawud 4643 — le licite; ce qui a été rendu licite", tr: "Sunan Abi Davud 4643 — Helal olan, izin verilen şey", id: "Sunan Abi Dawud 4643 — Yang halal, yang diperbolehkan" }
text: "… الْمُؤْمِنِينَ عَبْدِ الْمَلِكِ وَاللَّهِ لَوْ أَمَرْتُ النَّاسَ أَنْ يَخْرُجُوا مِنْ بَابٍ مِنْ أَبْوَابِ الْمَسْجِدِ فَخَرَجُوا مِنْ بَابٍ آخَرَ لَحَلَّتْ لِي دِمَاؤُهُمْ وَأَمْوَالُهُمْ وَاللَّهِ لَوْ أَخَذْتُ رَبِيعَةَ بِمُضَرَ لَكَانَ ذَلِكَ لِي مِنَ اللَّهِ حَلاَلاً وَيَا عَذِيرِي مِنْ عَبْدِ هُذَيْلٍ يَزْعُمُ أَنَّ قِرَاءَتَهُ مِنْ عِنْدِ اللَّهِ وَاللَّهِ مَا هِيَ إِلاَّ رَجَزٌ مِنْ رَجَزِ الأَعْرَابِ مَا أَنْزَلَهَا اللَّهُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4643، يذكر الحلال، وما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4643 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions the lawful, what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4643، جس میں حلال، جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.º 4643 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona lo lícito y lo que se ha hecho lícito. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4643 (La conduite exemplaire du Prophète (Kitab Al-Sunnah)), mentionne ce qui est licite et ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan Ebu Davud'da yer alan 4643 numaralı hadis, helal olan ve helal kılınan şeyleri açıklamaktadır. Bu hadis, Helal ve Haram Tarayıcısı tarafından Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4643, menyebutkan apa yang diperbolehkan dan apa yang telah dihalalkan. Hadits ini dikumpulkan oleh Halal and Haram Browser bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
