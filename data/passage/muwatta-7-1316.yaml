label: { ar: "الموطأ 1316 — عمر بن عبد العزيز: للفرس سهمان وللرجل سهم، وقد لم يزل مالك يسمع ذلك", en: "Muwatta 1316", es: "Muwatta 1316", fr: "Muwatta 1316", ur: "موطا 1316", tr: "El-Muvatta 1316 — Ömer ibn Abdülaziz: At iki pay alır, insan bir pay alır ve Malik bunu hep duymuştur.", id: "Al-Muwatta 1316 — Umar ibn Abd al-Aziz: Kuda mendapat dua bagian dan manusia mendapat satu bagian, dan Malik selalu mendengar hal ini." }
summary:
  ar: "بلغ يحيى بن يحيى عن مالك أنه كان يقول إن عمر بن عبد العزيز كان يقول للفرس سهمان، وللرجل سهم، وقال مالك لم أزل أسمع ذلك. ويذكر المحقق أن هذا النص محفوظ من حديث ابن عمر في الصحيحين. {cite:muwatta-maruf-1997 p.588}"
  tr: "Yahya ibn Yahya, Malik'ten rivayet ettiğine göre, Ömer ibn Abdülaziz'in şöyle dediğini aktarmıştır: \"Bir at iki pay alır, bir insan ise bir pay alır.\" Malik, \"Ben hep bunu duydum\" demiştir. Araştırmacı, bu metnin İbn Ömer'in hadisinden iki Sahih'te (Buhari ve Müslim) korunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.588}"
  id: "Yahya bin Yahya meriwayatkan dari Malik bahwa ia biasa mengatakan bahwa Umar bin Abd al-Aziz biasa berkata, \"Seekor kuda mendapat dua bagian, dan manusia mendapat satu bagian.\" Malik berkata, \"Aku selalu mendengar ini.\" Peneliti menyebutkan bahwa teks ini terpelihara dari hadits Ibnu Umar dalam dua kitab Sahih (Bukhari dan Muslim). {cite:muwatta-maruf-1997 p.588}"
