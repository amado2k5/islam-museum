text: "… تَبْتَغِي بِهِ وَجْهَ اللَّهِ، إِلاَّ ازْدَدْتَ بِهِ دَرَجَةً وَرفْعَةً، وَلَعَلَّكَ تُخَلَّفُ حَتَّى يُنْفَعَ بِكَ أَقْوَامٌ وَيُضَرَّ بِكَ آخَرُونَ، اللَّهُمَّ! أَمْضٍ لأَصْحَابِي هِجْرَتَهُمْ، وَلَاَ تَرُدَّهُمْ عَلَى أَعْقَابِهِمْ، لَكِنِ الْبَائِسُ سَعْدُ ابْن خَوْلَةَ. قَالَ: رَثَى لَهُ لأحاد الناس، ومعنى أشفيت على الموت …"
summary:
  ar: "مقطع من المنهاج شرح صحيح مسلم بن الحجاج، المجلد المصوَّر 1، ص 1035، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, scan volume 1, p. 1035, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنہاج شرح صحیح مسلم بن الحجاج، اسکین جلد 1، ص 1035 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, volume numérisé 1, p. 1035, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, volumen escaneado 1, p. 1035, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Sahih Muslim ibn al-Hajjaj tefsirinin 1. cildinin 1035. sayfasından, vefat eden kişi için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. En ünlü ağıt ve övgülerin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari komentar Sahih Muslim Ibnu al-Hajjaj, Volume 1, halaman 1035, yang berisi elegi dan pujian untuk orang yang meninggal; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh mesin pencari elegi dan pujian paling terkenal."
