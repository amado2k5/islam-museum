text: "فى قوله : (ولو أنهم أقاموا التوراة والإنجيل) يعود إلى أهل الكتاب من اليهود والنصارى الذين فتح الله لهم باب الإيمان ليدخلوا فيه كى ينالوا رضاه. والمراد بإقامة التوراة والإنجيل : العمل بما فيهما من بشارات بصدق النبى عيظ وحضهم"
