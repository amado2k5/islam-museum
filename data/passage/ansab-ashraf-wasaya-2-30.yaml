text: "… عن جده، عن معاوية بن حميرة الكندى، عن ابن عباس : لما حضرت نزارا الوفاةُ أوصى بنيه - وهم مُضْتَر، وربيعة، وإياد، وأنمار - بأن يتناصفوا. فقال: قُبَّى الحمراء، وكانت من أدم، لمُضر. فقيل مُضر الحمراء. وهذا الحباء الأسود وفرسى …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 2، ص 30، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 2, p. 30, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 2، ص 30 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ansab al-Ashraf de al-Baladhuri, volumen 2, pág. 30, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du recueil Ansab al-Ashraf d'al-Baladhuri (tome 2, p. 30), mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "El-Baladhuri'nin \"Ansab al-Ashraf\" (Soyluların Şecereleri) adlı eserinin 2. cildinin 30. sayfasında yer alan bir alıntıda, vasiyetname veya son miras ve ölüm saati belirtilmektedir; makineyle okunabilir baskıda, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Ansab al-Ashraf\" (Silsilah Para Bangsawan) karya Al-Baladhuri, Jilid 2, halaman 30, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari edisi yang dapat dibaca mesin, teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
