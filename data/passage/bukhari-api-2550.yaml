label: { ar: "صحيح البخاري 2550 — مضاعفة الأجر", en: "Sahih al-Bukhari 2550 — the reward doubled or multiplied", ur: "صحیح بخاری 2550 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ عُبَيْدِ اللَّهِ، حَدَّثَنِي نَافِعٌ، عَنْ عَبْدِ اللَّهِ ـ عَنِ النَّبِيِّ قَالَ \" إِذَا نَصَحَ الْعَبْدُ سَيِّدَهُ، وَأَحْسَنَ عِبَادَةَ رَبِّهِ، كَانَ لَهُ أَجْرُهُ مَرَّتَيْنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2550، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 2550 (Manumission of Slaves), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 2550، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
