label: { ar: "الموطأ 1726 — نافع عن ابن عمر: إذا وضعت حملها فقد حلت، ورجل من الأنصار أخبره أن عمر قال لو وضعت وزوجها على سريره لم يدفن بعد لحلت", en: "Muwatta 1726", es: "Muwatta 1726", fr: "Muwatta 1726", ur: "موطا 1726", tr: "El-Muvatta 1726 — İbn Ömer'den rivayet edildiğine göre, Nafi' şöyle buyurmuştur: Eğer kadın doğum yaparsa, yeniden evlenmekte serbesttir. Ensar'dan bir adam da ona Ömer'in şöyle dediğini aktarmıştır: Eğer kadın kocası henüz ölüm döşeğinde ve gömülmemişken doğum yaparsa, yeniden evlenmekte serbesttir.", id: "Al-Muwatta 1726 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Jika seorang wanita melahirkan, dia bebas untuk menikah lagi. Dan seorang pria dari kaum Ansar memberitahunya bahwa Umar berkata: Jika seorang wanita melahirkan ketika suaminya masih dalam keadaan sekarat dan belum dimakamkan, dia bebas untuk menikah lagi." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر سئل عن المرأة يتوفى عنها زوجها وهي حامل، فقال إذا وضعت حملها فقد حلت، فأخبره رجل من الأنصار كان عنده أن عمر بن الخطاب قال لو وضعت وزوجها على سريره لم يدفن بعد لحلت. {cite:muwatta-maruf-1997 p.105}"
  tr: "Malik, Nafi'den rivayetle, Abdullah ibn Umar'a hamile iken kocası ölen bir kadın hakkında soru sorulduğunu aktarır. O, \"Eğer doğum yaparsa, yeniden evlenmekte özgürdür\" demiştir. Bunun üzerine yanında bulunan Ensar'dan bir adam, Ömer ibn el-Hattab'ın şöyle dediğini aktarmıştır: \"Eğer kocası henüz ölüm döşeğindeyken ve gömülmemişken doğum yaparsa, yeniden evlenmekte özgürdür.\" {cite:muwatta-maruf-1997 s.105}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar ditanya tentang seorang wanita yang suaminya meninggal dunia saat ia sedang hamil. Beliau berkata, “Jika ia melahirkan, ia bebas untuk menikah lagi.” Kemudian seorang pria dari kaum Ansar yang bersamanya memberitahunya bahwa Umar ibn al-Khattab berkata, “Jika ia melahirkan saat suaminya masih di ranjang kematiannya dan belum dimakamkan, ia bebas untuk menikah lagi.” {cite:muwatta-maruf-1997 p.105}"
