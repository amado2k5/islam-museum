summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر سئل عن المرأة يتوفى عنها زوجها وهي حامل، فقال إذا وضعت حملها فقد حلت، فأخبره رجل من الأنصار كان عنده أن عمر بن الخطاب قال لو وضعت وزوجها على سريره لم يدفن بعد لحلت. {cite:muwatta-maruf-1997 p.105}"
