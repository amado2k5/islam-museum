label: { ar: "الموطأ 845 — مالك: وأحب إلي أن يكون ما سمى الله في القرآن يصام متتابعاً", en: "Muwatta 845", es: "Muwatta 845", fr: "Muwatta 845", ur: "موطا 845", tr: "El-Muvatta 845 — Malik: Ben de Allah'ın Kur'an'da zikrettiği şeylerin ardı ardına oruç tutulmasını tercih ederim.", id: "Al-Muwatta 845 — Malik: Dan aku lebih suka berpuasa secara beruntun apa yang telah Allah sebutkan dalam Al-Qur'an." }
summary:
  ar: "قول لمالك: وأحب إلي أن يكون ما سمى الله في القرآن يُصام متتابعاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني. {cite:muwatta-maruf-1997 p.409} {cite:muwatta-maruf-1997 p.410}"
  tr: "Malik şöyle demiştir: “Kur'an'da Allah'ın zikrettiği günlerde ardı ardına oruç tutmayı tercih ederim.” Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Muhammed ibn el-Hasan el-Şeybani tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.409} {cite:muwatta-maruf-1997 s.410}"
  id: "Malik berkata: “Aku lebih suka berpuasa pada hari-hari yang telah Allah sebutkan dalam Al-Quran secara berurutan.” Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus’ab dan Muhammad ibn al-Hasan al-Shaybani. {cite:muwatta-maruf-1997 p.409} {cite:muwatta-maruf-1997 p.410}"
