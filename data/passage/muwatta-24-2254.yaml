label: { ar: "الموطأ 2254 — مالك: بلغه عن فضالة بن عبيد الأنصاري، وكان من أصحاب رسول الله، أنه سئل عن الرجل تكون عليه رقبة، هل يجوز له أن يعتق ولد زنا؟ قال: نعم، ذلك يجزئ عنه", en: "Muwatta 2254", es: "Muwatta 2254", fr: "Muwatta 2254", ur: "موطا 2254", tr: "El-Muvatta 2254 — Malik: Allah Resulü'nün sahabelerinden Fadala ibn Ubayd el-Ensari'den rivayet edildiğine göre, kendisine bir köle borcu olan bir adamın, nikahsız doğan çocuğunu azat etmesi caiz midir diye sorulmuştur. O da şöyle buyurmuştur: Evet, bu ona yeterlidir.", id: "Al-Muwatta 2254 — Malik: Diriwayatkan kepadanya dari Fadalah ibn Ubayd al-Ansari, yang merupakan salah satu sahabat Rasulullah, bahwa ia ditanya tentang seorang laki-laki yang memiliki hutang budak, apakah diperbolehkan baginya untuk membebaskan anak yang lahir di luar nikah? Beliau menjawab: Ya, itu sudah cukup baginya." }
summary:
  ar: "قال مالك: وبلغه عن فضالة بن عبيد الأنصاري، وكان من أصحاب رسول الله، أنه سئل عن الرجل تكون عليه رقبة، هل يجوز له أن يعتق ولد زنا؟ قال: نعم، ذلك يجزئ عنه. {cite:muwatta-maruf-1997 p.330}"
  tr: "Malik şöyle dedi: Allah Resulü'nün sahabelerinden Fadala ibn Ubayd el-Ensari'den rivayet edildiğine göre, kendisine bir köle borcu olan bir adamın, nikahsız doğan çocuğunu azat etmesi caiz midir diye sorulmuştu. O da şöyle demişti: Evet, bu ona yeterlidir. {cite:muwatta-maruf-1997 s.330}"
  id: "Malik berkata: Diriwayatkan kepadanya dari Fadalah ibn Ubayd al-Ansari, salah seorang sahabat Rasulullah, bahwa beliau ditanya tentang seorang laki-laki yang memiliki hutang budak, apakah diperbolehkan baginya untuk membebaskan anak yang lahir di luar nikah? Beliau menjawab: Ya, itu sudah cukup baginya. {cite:muwatta-maruf-1997 p.330}"
