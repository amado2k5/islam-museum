ref: "2001"
label: { ar: "صحيح البخاري 2001 — ما فُرض على الناس، الفرض", en: "Sahih al-Bukhari 2001 — what was made obligatory on people; the obligatory (fard)", ur: "صحیح بخاری 2001 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Sahih al-Bukhari 2001 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Sahih al-Bujari 2001 — lo que se impuso a la gente; lo obligatorio (fard)" }
text: "حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، قَالَ أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، أَنَّ عَائِشَةَا ـ قَالَتْ كَانَ رَسُولُ اللَّهِ أَمَرَ بِصِيَامِ يَوْمِ عَاشُورَاءَ، فَلَمَّا فُرِضَ رَمَضَانُ كَانَ مَنْ شَاءَ صَامَ، وَمَنْ شَاءَ أَفْطَرَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2001، يرد فيه ذكر ما فُرض على الناس، والفرض، وما جُعل لمن شاء. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 2001 (Fasting), whose wording mentions what was made obligatory on people, the obligatory (fard), what is left to whoever wishes. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 2001، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، فرض، جو چاہنے والے کے لیے چھوڑا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2001, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), ce qui est laissé à qui le veut. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 2001, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo que se deja a quien quiera. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
