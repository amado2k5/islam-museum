text: "يه العزيز، وكان لشفاعته عند الحاكم أثر كبير في إطلاق سراح الكتاب من النصارى واليهود وإعادتهم إلى مراكزهم (٣) . ومن أطباء هذا العصر رجل يهودي كان خامل الذكر يرتزق بمداواة الجراح، واتفق أن الحاكم أصيبت ساقه بعقر مزمن ."
