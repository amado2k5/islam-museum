label: { ar: "جامع الترمذي 1538 — الطاعة والمعصية، الكراهة", en: "Jami' al-Tirmidhi 1538 — obedience and disobedience; dislike (karaha)", ur: "جامع ترمذی 1538 — اطاعت اور معصیت، کراہت", fr: "Jami' al-Tirmidhi 1538 — l'obéissance et la désobéissance ; la réprobation (karaha)", es: "Yami' al-Tirmidhi 1538 — la obediencia y la desobediencia; la reprobación (karaha)" }
text: "… بِهِ مِنَ الْبَخِيلِ \". قَالَ وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ كَرِهُوا النَّذْرَ. وَقَالَ عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ مَعْنَى الْكَرَاهِيَةِ فِي النَّذْرِ فِي الطَّاعَةِ وَالْمَعْصِيَةِ وَإِنْ نَذَرَ الرَّجُلُ بِالطَّاعَةِ فَوَفَّى بِهِ فَلَهُ فِيهِ أَجْرٌ وَيُكْرَهُ لَهُ النَّذْرُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1538، يرد فيه ذكر الطاعة والمعصية، والكراهة، وما كرهه الفقهاء، والطاعة، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 1538 (The Book on Vows and Oaths), whose wording mentions obedience and disobedience, dislike (karaha), what the jurists disliked, obedience, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 1538، جس کے الفاظ میں اطاعت اور معصیت، کراہت، جسے فقہاء نے مکروہ کہا، اطاعت، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1538, dont le texte mentionne l'obéissance et la désobéissance, la réprobation (karaha), ce que les juristes ont réprouvé, l'obéissance, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 1538, cuyo texto menciona la obediencia y la desobediencia, la reprobación (karaha), lo que los juristas reprobaron, la obediencia, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
