label: { ar: "جامع الترمذي 803 — ما يجب على المكلف، التطوع", en: "Jami' al-Tirmidhi 803 — what is binding on the person addressed; the voluntary act (tatawwu')", ur: "جامع ترمذی 803 — جو مکلف پر واجب ہے، تطوع ⁦(نفلی عمل)⁩", fr: "Jami' al-Tirmidhi 803 — ce qui s'impose à la personne responsable ; l'acte volontaire (tatawwu')", es: "Yami' al-Tirmidhi 803 — lo que obliga a la persona responsable; el acto voluntario (tatawwu')", tr: "Cami' el-Tirmizi 803 — Sorumlu kişi için farz olanlar, gönüllü ameller", id: "Jami' al-Tirmidhi 803 — Apa yang wajib bagi orang yang bertanggung jawab, amalan sukarela" }
text: "… اعْتِكَافَهُ قَبْلَ أَنْ يُتِمَّهُ عَلَى مَا نَوَى فَقَالَ بَعْضُ أَهْلِ الْعِلْمِ إِذَا نَقَضَ اعْتِكَافَهُ وَجَبَ عَلَيْهِ الْقَضَاءُ. وَاحْتَجُّوا بِالْحَدِيثِ أَنَّ النَّبِيَّ خَرَجَ مِنِ اعْتِكَافِهِ فَاعْتَكَفَ عَشْرًا مِنْ شَوَّالٍ. وَهُوَ قَوْلُ مَالِكٍ. وَقَالَ بَعْضُهُمْ إِنْ لَمْ يَكُنْ عَلَيْهِ نَذْرُ اعْتِكَافٍ أَوْ شَيْءٌ أَوْجَبَهُ عَلَى نَفْسِهِ وَكَانَ مُتَطَوِّعًا فَخَرَجَ فَلَيْسَ عَلَيْهِ أَنْ يَقْضِيَ إِلاَّ أَنْ يُحِبَّ ذَلِكَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 803، يرد فيه ذكر ما يجب على المكلف، والتطوع. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 803 (The Book on Fasting), whose wording mentions what is binding on the person addressed, the voluntary act (tatawwu'). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 803، جس کے الفاظ میں جو مکلف پر واجب ہے، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 803, dont le texte mentionne ce qui s'impose à la personne responsable, l'acte volontaire (tatawwu'). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 803, cuyo texto menciona lo que obliga a la persona responsable, el acto voluntario (tatawwu'). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 803 numaralı hadis, sorumlu kişi için farz olan ve isteğe bağlı olan şeylerden bahsetmektedir. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahları derleyen kişi, bu konularla ilgili olarak Kur'an, Sünnet, biyografi ve Sahabe ve Salihlerin rivayetlerinden metinler derlemiştir. Derleyen kişi metnin içeriğini açıklamış ancak buna dayanarak fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 803, menyebutkan apa yang wajib bagi orang yang bertanggung jawab dan apa yang sunnah. Penyusun kitab tentang dosa-dosa wajib, anjuran, najis, dan dosa-dosa kecil ini menyertakan teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut. Penyusun tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
