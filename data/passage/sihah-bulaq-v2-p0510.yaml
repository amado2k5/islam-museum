text: |-
  .٧٧
  حتى تحلق شعرها قال أبو نصر أحد بن حاتم يقال عند الامر يعجب به خشى عقرى حلقى
  كأنه من الحلق والعقر والحش وهو الخدش قال
  ألا قومى أولوعرى وحلق * لمالاقت سلامان بن غنم
  وفى الحديث حين قبل فه ص-لى اللّٰه عليه وس-لم ان صفية بنت حيّ حاتض فقال عقرى حلقى
  ما أراها الاحابستنا قال أبو عبيدهوعة راحلة ابالتنوين والمعدّتون يقولون عقرى حلقى
  وأصل هذا ومعنامعة رها اللّٰه وحلقها يعى عقر جسدها وحلمقها أى أصابها اللّٰه بوجع
  فى حلقها قال وهذا كما تقول رأسته وعضدته وصدرته اذا ضربت رأسه وعضده وصدره
  وكذلك -لقه اذا أصاب حلقه والحلق -صدر قولك حلق رأسه وجلة وارؤسهم شدّد للكثرة
  والاحتلاق الحلق يقال حلق معزه ولا يقال جزه الافى الضأن قال أبو زيد عنز محلوقة وشعر
  حليق ولحية حليق ولا يقال حليقة وحلاق اسم للمنية مثال قطام بنيت على الكسرلانه (ا
  حصل فيها العدل والتأنيت والصفة الغالبة وهى معدولة عن حالقة ومنه قول
  الناءر
  لحقت حلاف بهم على أكساتهم * ضرب الرقاب ولا يهمّ المغتم
  وحلاقة المعزى بالضم ماحلق من شعره والجلاق أيضاوجع فى الحلق ويقال انّ رأسبه لجيد
  الحلاق بالكسر وتحلق القوم جلسواحلقة حلفة وحلق الفرس والهاربال.كسر محلق حلقا اذا
  سبقد فأصايه فساد فى قضيبه من تقشر واجرار فيداوى بانخصاء قال الشاعر
  خصيتك بإابن جرة بالقوافى • كما يخصى من الحلق الحمار
  ويوم تحلاق اللمم يوم لتغلب على بكرابنى وائل لات الحلق كان شعارهم يومندوالحلقان بالضم
  البسراذا بلغ الارطاب ثلثيه وكذلك الحلمق ن والبسرة الواحدة -لمقانة ومحلقنة قال ابن
  السكيت يقال قد أكثرت من الحولة اذا أكثرت من قول لاحول ولاقوة الايالله
  (سق الهق والهق قلة العبقل وقد حق الرجل بالضم حاقة فهوأحق وحق أيضا
  بالكسر يحيق حوتامثل غنم غنمافهوجق قال يزيدين الحسكم النققىّ
  قد يقتر الحول التقى ويكثر الجمق الائيم
  وعمروبن الحق الخزاعىّ وأمرأجقاء وقوم ونسوة حق وجق و~اقى والبقلة الهقاء الرجلة
  وحقت السوق أيضا بالضم أى كسدت وأحقت المرأة أى جاءت يولد أبجق فهى ممق ومحمقة
  قالت امى أة من العرب
  لست أبالى أن أكون محجمقه * اذا رأيت خصية معلقه
  تقول لا أبالى أن ألدأحق بعد أن يكون الولدذ كراله خصية معلقة فإن كان من عادتها أن
  تلد الهقى فهى محماق ويقال أحقت الرجل اذا وجدته أحق وحقته تحميقانسبته الى الهق
  وحامقته اذ اساعدته على حقه واستحمقته أى عدد به أحق وتحامق فلان اذا تكاف الحاقة
  ويقال انحمقت السوق أى كسدت وافحمق الثوب أى أخلق والمحاق مثال السعال
  كالجدرى يصيب الانسان قال أبو عبيد يقال منه رجل محموق⁦(حلق)⁩حلاق العين باطن
  أجفانها الذى يسوّده السكمل يقال جاهفلان متلثما لا يظهر من حسن وجهه الاحاليق
  حدقتيه ويقال هو ما غطته الاجفان من بياض المقلة قال عبيد * والعين حلاقها مقلوب*
  محاح
  فى
