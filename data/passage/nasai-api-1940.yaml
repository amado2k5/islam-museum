label: { ar: "سنن النسائي 1940 — قيراط الأجر", en: "Sunan al-Nasa'i 1940 — the qirat of reward", ur: "سنن نسائی 1940 — اجر کا قیراط", es: "Sunan al-Nasa'i 1940 — el qirat de la recompensa", fr: "Sunan al-Nasa'i 1940 — la qirat de la récompense", tr: "Sunan an-Nasa'i 1940 — Sevabı kırat'a eşittir.", id: "Sunan an-Nasa'i 1940 — Pahalanya sama dengan satu qiraat" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا عَبْثَرٌ، عَنْ بُرْدٍ، أَخِي يَزِيدَ بْنِ أَبِي زِيَادٍ عَنِ الْمُسَيَّبِ بْنِ رَافِعٍ، قَالَ سَمِعْتُ الْبَرَاءَ بْنَ عَازِبٍ، يَقُولُ قَالَ رَسُولُ اللَّهِ \" مَنْ تَبِعَ جَنَازَةً حَتَّى يُصَلَّى عَلَيْهَا كَانَ لَهُ مِنَ الأَجْرِ قِيرَاطٌ وَمَنْ مَشَى مَعَ الْجَنَازَةِ حَتَّى تُدْفَنَ كَانَ لَهُ مِنَ الأَجْرِ قِيرَاطَانِ وَالْقِيرَاطُ مِثْلُ أُحُدٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1940، يذكر قيراط الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 1940 (The Book of Funerals), that speaks of the qirat of reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 1940، جس میں اجر کا قیراط کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Sunan al-Nasa'i, n.° 1940 (El Libro de los Funerales), habla del qirat de recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un rapport du Sunan al-Nasa'i, n° 1940 (Le Livre des Funérailles), évoque le calcul de la récompense. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, écrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de yer alan 1940 numaralı hadiste, sevabın kıratı (değerinin ölçülmesi) anlatılmaktadır. Bu hadis, iyi ve kötü ameller listesiyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 1940, menyebutkan qirat pahala. Qirat ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
