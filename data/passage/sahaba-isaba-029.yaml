text: "ل: عينيه فأبصر، قال: فرأيته يدخل الخيط في الإبرة، وإنه وجدت في كتاب آبائي أن حبيب بن عمرو السلاماني لا بن ثمانين، وإن عينيه لمبيضتان. كان يحدث، قال قدمنا - وفد سلامان - على النبي ول فيه قال ابن السكن:"
