text: "… وسبق الوحي به ما كان يقوله بلال قبل الأذان أبو قيس ابن أبي أنس عداوة اليهود سبب عداوتهم للمسلمين من بني النضير من بني ثعلبة من بني قينقاع من بني قريظة من بني زريق من بني حارثة من بني عمرو …"
summary:
