text: |-
  فأوردها من آخر الليل.شربا * بلاثق خضرا ماوهنّ قليص
  أى كثيروانما فال خضر الات الماءاذا كنريرى أخضر (بنق قال أبوزيد البنقة من
  القميص لبنته وأنشد ⁦(١)⁩ * كماضم أزرار القميص البنائن* والبنيقتان دابرتان فى فحر
  الفرس ⁦( دق)⁩ البندق الذى يرمى يه الواحدة بندقة والجمع البنسادق ويندقة أبو قبيلة
  من اليمن وهو سدقة بن مظسة من سعد العشيرة ومنه قولهم حد أحد أوراءك بندقة وقد
  ذكرنام فى باب الهسمز بوق البوق الذى ينفخ فيه وأنشد الاصمعى
  زمر النصارى زمرت فى اليوق• والبوق أيضا الباطيل عن أبى عرو ومنه قول حسان
  اين ثابت يرتى عنمان رضى اللّٰه عنه.
  يا قاتل اللّه قوما كان شأنهم • قتل الامام الامين السيد الفطن
  ماقتلوه عسلى ذنب ألمّ به * الا الذى نطة وابوقا ولم يكن
  وقولهم أصابتهم يوقة منكرة وهى دفعة من المطرانيعجت ضرية والبائقة الداهية بقال باقتهم
  الداهية تبوقهم بوقا اذا أصابتهم وكذلك باقتهم يؤوق على فعول وانباقت عليهم يائقة شرّ مثل
  نباحت أى انفتقت وانساق عليهم الدهر أى هجم عليهم بالداهية كما يخرج الصوت من
  البوق وفى الحديث لا يدخل الجنسة من لا يأمن جاره بوائه قال قتادة أى ظله وغشى
  وقان المكسائى غوائله وشره وتقول دفعت عنك باتقة فلان والباقة من البقل حزمة منه
  هق ، البهق يساض يعترى الجلديخ الف لونه إيس من البرص قال روية
  فيها خطوط من سوادوبلق * كأنه فى الجلد توليسع البهق
  ل التا أف ذق السقاء يتأق تأقا أى امتسلا وأتأفته أنا وتنق الرجل
  أى امتلا غضبا وغيظا ومن أمثال العرب أنت تتق وأنامق فكيف تتفق قال
  الاموى التئق السريع الى الشرّ وقال الاصمعىّ هو الحديد قال الشاعر يصف كلبا
  أصمع الكتعبين مهضوم الحشا * سرطم اللعيين معاج تبق
  وقال زهير بن مسعود الضبى يصف فرسا
  ضافى السبيب أسيل الخد مشترف * حابى الضلوع شديد أسره تقق
  وقال أبو عمر والتأقة بالتحريك شدة الغضب وصرعة الى الشرّة وهو يتأق وبه تأقة ترق ).
  الترياق بكسر التاءدواء السموم فارسى معرب والعسرب تسعى الجوترياقا وتربغ قسة لانها!
  تذهب بالهتم ومنه قول الاعشى
  سقتنى بصهباء ترياقة * متى ماتلين عظامى تلبن
  والترقوة العظم الذى بين ثغرة النحر والعائق وهى فعلوة ولا تقل ترقوة بالضم وحكى أبويوسف
  ترقيت الرجل ترقاة أى أصبت ترقوته (توف تاقت نفسى الى الشييوقا ويوقانا أى
  اشتاقت يقال المرتواق الى عالم بنل وأمذقول الراجز
  يا الشتاء وقيصى أخلاق • شراذم يضحك منه التراق
  فيقال حواسم إبنه ويرؤى التواق .
