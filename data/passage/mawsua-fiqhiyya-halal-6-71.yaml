text: "ويباح الزائد إذا كان بغرض التجمل والتنعم لقول النبي نعم المال الصالح للرجل الصالح. ويكره أي كراهة تحريم الزائد إذا كان للتفاخر والتكاثر والبطر والأشر وإن كان من حل، لقول النبي ظ: من طلبها حلالا مكاثرا لها مفاخرا لقي اللّٰه …"
