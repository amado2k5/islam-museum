label: { ar: "الموطأ 2631 — يحيى بن سعيد: المرء يدرك بحسن خلقه درجة القائم بالليل والظامئ بالهواجر", en: "Muwatta 2631", es: "Muwatta 2631", fr: "Muwatta 2631", ur: "موطا 2631", tr: "El-Muvatta 2631 — Yahya ibn Said: Bir kişi, güzel ahlakı sayesinde gece namazı kılan ve sıcak günlerde susayan birinin mertebesine ulaşır.", id: "Al-Muwatta 2631 — Yahya ibn Saeed: Seseorang akan mencapai kedudukan seperti orang yang shalat di malam hari dan merasa haus di siang hari yang panas melalui akhlak yang baik." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: بلغني أن المرء ليدرك بحسن خلقه درجة القائم بالليل الظامئ بالهواجر. ويذكر المحقق قول ابن عبد البر أن هذا لا يكون رأيا، وأنه روي مرفوعا من وجوه حسان من حديث يحيى بن سعيد وغيره. {cite:muwatta-maruf-1997 p.489}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle şöyle buyurduğunu aktarır: \"İşittim ki, bir insan güzel ahlakıyla gece namazı kılan ve en sıcak günlerde susuzluğa katlanan birinin mertebesine ulaşabilir.\" Araştırmacı, İbn Abdülbarr'ın bunun kişisel bir görüş değil, Yahya ibn Sa'id ve diğerleri de dahil olmak üzere güvenilir rivayet zincirleriyle nakledilmiş bir hadis olduğuna dair ifadesini aktarır. {cite:muwatta-maruf-1997 s.489}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa beliau berkata: \"Aku telah mendengar bahwa seseorang dapat mencapai, melalui akhlak yang baik, kedudukan orang yang melaksanakan salat malam dan menahan haus di siang hari yang terpanas.\" Peneliti menyebutkan pernyataan Ibn 'Abd al-Barr bahwa ini bukanlah pendapat pribadi, melainkan hadits yang diriwayatkan melalui sanad perawi yang terpercaya, termasuk Yahya ibn Sa'id dan lainnya. {cite:muwatta-maruf-1997 p.489}"
