summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: بلغني أن المرء ليدرك بحسن خلقه درجة القائم بالليل الظامئ بالهواجر. ويذكر المحقق قول ابن عبد البر أن هذا لا يكون رأيا، وأنه روي مرفوعا من وجوه حسان من حديث يحيى بن سعيد وغيره. {cite:muwatta-maruf-1997 p.489}"
