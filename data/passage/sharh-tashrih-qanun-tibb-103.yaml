  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 103, that mentions medicine and the physician, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "شرح تشریح القانون، ابن النفیس، ص 103 کا اقتباس جس میں طب اور طبیب، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Comentario de Ibn al-Nafis sobre la Anatomía del Canon, pág. 103, que menciona la medicina y al médico, nombra las enfermedades y los órganos del cuerpo; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Commentaire d'Ibn al-Nafis sur l'Anatomie du Canon, p. 103, qui mentionne la médecine et le médecin, les maladies nommées, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Nafis'in hukukun anatomisi hakkındaki açıklamasından bir alıntı, sayfa 103; tıp ve hekimden, hastalıkların isimlerinden ve vücut organlarından bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikası gereği metin kırk kelime içinde alıntılanmıştır."
  id: "Kutipan dari penjelasan Ibn al-Nafis tentang anatomi hukum, hlm. 103, yang menyebutkan kedokteran dan dokter, nama-nama penyakit, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
