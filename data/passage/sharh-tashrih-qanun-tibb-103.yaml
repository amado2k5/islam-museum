text: "… خلقه العصب لا لأجلها بل لشيء آخر فاتفق أن أفاد ذلك النفع وخلقة الأعصاب إنما هي لأجل إفادة الأعضاء الحس والحركة. وإنما كان كذلك لأن اللماغ كما عرف مبدأ لقوة الحس والحركة إما بذاته كما هو مذهب الأطباء أو بنوسط …"
summary:
