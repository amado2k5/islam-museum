text: |-
  قوله كالايجمع العدذاب الخ
  قلت سبق فى عذب ان جعه
  أعذبة وهو قياس كطعام
  واطعمة وشراب واشرية اه
  ابن الطيب على القاموس وف
  زرقانى الموطأ الاشربة ج-ع
  شراب كطعام واطعهمة اسم
  لما يشرب وليس مصدرا لان
  المصدر هو الشرب مثلثة الشين
  اه والذى فى نسغ العصاح
  والمختار وزجن الصحاح
  والقاموس السراب بالمهملة
  لا المحمة وعند طبع القاموس
  اتعناصكلام المحشى بدون
  جى أجعة عاصم قاله نصر
  ٤١٠
  ⁦(باب الراء)⁩
  من الحيل الذى على شية النمر وهو أن تكون فيه بقعة بيضاء وبقعة أخرى على أى لون كان
  والنعم النخرالتى فيها ستواد وبياض جمع أغر الاصعى تخرله أى تشكرله وتغسيروا وعده لان النمر
  لا تلقاه أبدا الامتنكراغضبان وقول الشاعر: قوم اذ البسوا الحديد تمرواحلقا وقدا
  أى تشيهوا بالنمر لاختلاف ألوان القد والحديد والنمرة بردة من الصوف تليها الاعراب
  وف حديث سعد تبطى فى حبوته اعرابى في غمرته أسدفى نامورته وما تميرأى ناجع
  عذيا كان أوغيز عذب وحسب غير أى زالْ وغارة بالضم اسم رجل ⁦(نور)⁩ النور الضياء
  والجمع أنوار والمورأيضا النفرمن الظباء قال مضرس الاسدى وذكرالظياء وأبها
  قد كفت فى شدة الحر
  تدات عليها الشمس حتى كأنها ل، من الحرّز مى بالسكينة نورها
  ونسوة نور أى تفر من الربية وهو فعل مثل قذال وقذل الاانهم كرهوا الضمة على الواولات
  الواحدة نواروهى الفرورومنه معيث المرأة وفرس وديق نواراذا استودقت وهى تريد
  الفحل وفى ذلك منهاضعف ترهب عن صولة النا كمح وتقول نرت من الشى أنور نورا ونوارا
  :كسر التون قال الشاعر
  أنوراسرع ماذايا فروق وحبل الوصل منتكث حذيق
  وقال العجاج
  يخلطن بالتأنس النوارا وترت غيرى أى نفرته وأنار الشئ واستنار
  بعنى أى أضاء والتنوير الانارة والتنوير الاسفاروتنوير الشجرة إزهارها يقال نورت
  الشجرة وأنارت أيضا أى أخرجت نورها والنار مونتة وهي من الواولات تصغيرها نويرة
  والجمع نورونيران انقلبت الواو يا اكسرة ماقبله اوقولهم مانارهذه الناقة أى ماسمتها وفى
  المثل نجارهانارها وقال الراجز وقدسقوا آبالهم بالنار • والنارقد تشفى من الاوار
  يقول لمار أواسماتها خلوالها الماء يقال ينهم نائرة أى عداوة وشحناء وتنوّرت النارمن
  بعيد تبصرتها وتنوّر الرجل تطلى بالنورة وبغضهم يقول انتار والموور النسلج وهو دحان
  الشههم يعالج به الوشم حتى يخضر ولك أن تقلب الواو المضمومة همزة وقد نوّر دراعه اذا
  غرزهابابرة ثم ذرّ عليها النؤور والنوّار بالضم والتشديد نور الشجر الواحدة نوّارة والمنار ع لم
  الطريق وذ والمنار م لك من سلوك اليمن واسمه ابرحة بن الحرث الرايس وانماقيل هذو المنار
  لانه أوّل من ضرب المنار على طر يقه فى مغازيه ليهتدى بها اذا رجع والمنارة التى يؤذن عليها
  والمنارة أيضاما يوضع فوقها السراج وهى مفعلة من الاستنارة بفتح الميم والجمع المناور
  بالواولانه من النورومن قال منائروهم زذقد شبه الاصلى بالزائد كماقالوا مصيبة
  ومصائب وأصله مصاوب وقول بشر
  لللى على بعدالزارتذكز * ومن دون ليلى ذو بحارومنور
  *ماجبلان فى ظهر حرة بنى سليم ⁦(نهر)⁩ النهارضد الليل ولا يجمع كمالا يجمع العذاب
  والسراب فان جعته قلت فى قليله أنهر وفى الكثير نهر مثل مهاب وسهب وأنثادابن
  لينان.
  لولا النريدان لتنا بالضمر • تريد ليسل وتيد بالنهر
  والنهار فرخ الحبارى ذكره الاصعى فى كتاب الفرق ونهاربن توسعة اسم شاعر من تميم والنهر
  والنهر
