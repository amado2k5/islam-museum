text: "… عند الذبح؟ فيه الخلاف السابق فى الأضحية والهدى والأصح أنه يحتاج. الخامسة يستحب أن تفصل أعضاؤها ولا يكسر شىء من عظامها، لما ذكره المصنف، فان كسر فهو خلاف الأولى، وهل هو مكروه كراهة. تنزيه فيه وجهان أصحهما لا، لأنه لم …"
summary:
  ar: "مقطع من المجموع للنووي، ص 414، يرد فيه ذكر المستحب، والمكروه، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
