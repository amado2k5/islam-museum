label:
  ar: "ابن ماجه 4174 — الكبرياء ردائي والعظمة إزاري"
  en: "Ibn Majah 4174 — Pride is My cloak and grandeur My wrap"
  ur: "ابن ماجہ 4174 — کبریائی میری چادر اور عظمت میرا تہبند ہے"
text: "يقول الله سبحانه الكبرياء ردائي والعظمة إزاري من نازعني واحدا منهما ألقيته في جهنم ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4174: الكبرياء ردائي والعظمة إزاري. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4174: Pride is My cloak and grandeur My wrap. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4174: کبریائی میری چادر اور عظمت میرا تہبند ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
