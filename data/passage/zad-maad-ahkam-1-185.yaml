text: "… فِطْراً أحمد:، والترمذي:، وفي سنده ضعيف. وهذا يقتضي كراهة تأخير الفِطر، فكيف تركُه، وإذا كان مكروهاً، لم يكن عبادة، فإن أقلَّ درجات العبادة أن تكونَ مستحبة. والقول الثالث وهو أعدلُ الأقوال: أن الوِصال"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 185، يرد فيه ذكر المستحب، والمكروه، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 185, whose wording mentions the recommended (mustahabb), the disliked (makruh), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 185 کا اقتباس جس میں مستحب، مکروہ، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Zad al-Ma'ad de Ibn al-Qayyim, volume numérisé 1, p. 185, dont le texte mentionne le recommandé (mustahabb), le réprouvé (makruh), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen digitalizado 1, p. 185, cuyo texto menciona lo recomendado (mustahabb), lo reprobado (makruh), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 1. cildinin 185. sayfasından, müstehaplı, mekruhlu ve kınanmaya değer amelleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Bu metin, farz ameller, itaat amelleri, müstehaplı ameller, mekruhlu ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 1, halaman 185, yang membahas tentang amalan yang dianjurkan, yang tidak disukai, dan yang tercela; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus mengurutkan amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
