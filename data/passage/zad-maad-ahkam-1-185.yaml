text: "… فِطْراً أحمد:، والترمذي:، وفي سنده ضعيف. وهذا يقتضي كراهة تأخير الفِطر، فكيف تركُه، وإذا كان مكروهاً، لم يكن عبادة، فإن أقلَّ درجات العبادة أن تكونَ مستحبة. والقول الثالث وهو أعدلُ الأقوال: أن الوِصال"
