text: "… حُبِّى بنت حليل خادما لمناف، وهو أعظم أصنامهم عندهم، تدينا بذلك وتبركا به. قسماه أبوه عبد مناف. وزعموا أنه وُجد كتاب فى حجر : أن المغيرة بن قصى أوصى قريشا بتقوى اللّٰه وصلة الرحم وكان عبد مناف وعمرو بن هلال …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 2، ص 53، يذكر وصية أو عهد أخير، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 2, p. 53, that mentions a testament or parting counsel, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 2، ص 53 کا اقتباس جس میں وصیت یا آخری نصیحت، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ansab al-Ashraf de al-Baladhuri, volumen 2, pág. 53, que menciona un testamento o consejo de despedida, una reliquia conservada tras su propietario; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre Ansab al-Ashraf d'al-Baladhuri (tome 2, p. 53), mentionnant un testament ou des dernières volontés, une relique conservée après son propriétaire. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "El-Baladhuri'nin \"Ansab al-Ashraf\" (Soyluların Şecereleri) adlı eserinin 2. cildinin 53. sayfasında, bir vasiyetname veya son miras belgesi ile korunmuş eserler arasından bir kalıntıdan bahsedilmektedir; bu, makineyle okunabilir fotoğrafik bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Ansab al-Ashraf\" (Silsilah Para Bangsawan) karya Al-Baladhuri, Jilid 2, halaman 53, menyebutkan sebuah surat wasiat atau testamen terakhir, dan sebuah relik dari antara artefak yang terpelihara; dari salinan fotografi yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti surat wasiat, warisan, artefak, dan makam."
