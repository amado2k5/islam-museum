text: "… حُبِّى بنت حليل خادما لمناف، وهو أعظم أصنامهم عندهم، تدينا بذلك وتبركا به. قسماه أبوه عبد مناف. وزعموا أنه وُجد كتاب فى حجر : أن المغيرة بن قصى أوصى قريشا بتقوى اللّٰه وصلة الرحم وكان عبد مناف وعمرو بن هلال …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 2، ص 53، يذكر وصية أو عهد أخير، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 2, p. 53, that mentions a testament or parting counsel, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 2، ص 53 کا اقتباس جس میں وصیت یا آخری نصیحت، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
