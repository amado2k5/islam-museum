text: "… السيف وهو فى الفراش. ويقال كانت السريّة فى شهر رمضان سنة ست. غزوة ذات الرَّقاع فإنما سُمِّيت ذات الرِّقاع لأنه جبلٌ فيه بُقَع حمر وسواد وبياض. خرج رسول اللّٰه ليلة السبت لعشرٍ خلون من المحرّم على رأس سبعة وأربعين شهرًا. …"
