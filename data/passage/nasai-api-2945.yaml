text: "… بْنُ سُلَيْمَانَ، عَنْ حَمَّادِ بْنِ زَيْدٍ، عَنْ أَيُّوبَ، عَنِ ابْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ لَمَّا قَدِمَ النَّبِيُّ وَأَصْحَابُهُ مَكَّةَ قَالَ الْمُشْرِكُونَ وَهَنَتْهُمْ حُمَّى يَثْرِبَ وَلَقَوْا مِنْهَا شَرًّا فَأَطْلَعَ اللَّهُ نَبِيَّهُ عَلَيْهِ الصَّلاَةُ وَالسَّلاَمُ عَلَى ذَلِكَ فَأَمَرَ أَصْحَابَهُ أَنْ يَرْمُلُوا وَأَنْ يَمْشُوا مَا بَيْنَ الرُّكْنَيْنِ وَكَانَ الْمُشْرِكُونَ مِنَ نَاحِيَةِ الْحِجْرِ فَقَالُوا لَهَؤُلاَءِ أَجْلَدُ مِنْ كَذَا."
summary:
  ar: "حديث في سنن النسائي، رقم 2945، يذكر الحمى والوعك، والحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 2945 (The Book of Hajj), that mentions fever, fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 2945، جس میں بخار، بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
