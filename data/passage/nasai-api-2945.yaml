label: { ar: "سنن النسائي 2945 — الحمى والوعك، الحمى", en: "Sunan al-Nasa'i 2945 — fever; fever", ur: "سنن نسائی 2945 — بخار، بخار", es: "Sunan al-Nasa'i 2945: fiebre; fiebre", fr: "Sunan al-Nasa'i 2945 — fièvre; fièvre", tr: "Sunan an-Nasa'i 2945 — Ateş ve Hastalık, Ateş", id: "Sunan an-Nasa'i 2945 — Demam dan Penyakit, Demam" }
text: "… بْنُ سُلَيْمَانَ، عَنْ حَمَّادِ بْنِ زَيْدٍ، عَنْ أَيُّوبَ، عَنِ ابْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ لَمَّا قَدِمَ النَّبِيُّ وَأَصْحَابُهُ مَكَّةَ قَالَ الْمُشْرِكُونَ وَهَنَتْهُمْ حُمَّى يَثْرِبَ وَلَقَوْا مِنْهَا شَرًّا فَأَطْلَعَ اللَّهُ نَبِيَّهُ عَلَيْهِ الصَّلاَةُ وَالسَّلاَمُ عَلَى ذَلِكَ فَأَمَرَ أَصْحَابَهُ أَنْ يَرْمُلُوا وَأَنْ يَمْشُوا مَا بَيْنَ الرُّكْنَيْنِ وَكَانَ الْمُشْرِكُونَ مِنَ نَاحِيَةِ الْحِجْرِ فَقَالُوا لَهَؤُلاَءِ أَجْلَدُ مِنْ كَذَا."
summary:
  ar: "حديث في سنن النسائي، رقم 2945، يذكر الحمى والوعك، والحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 2945 (The Book of Hajj), that mentions fever, fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 2945، جس میں بخار، بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2945 (El Libro del Hajj), menciona la fiebre. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2945 (Le Livre du Hajj), mentionne la fièvre. Le dictionnaire médical le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan-ı Nesai'de yer alan 2945 numaralı hadis, ateş ve hastalıktan bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2945, menyebutkan tentang demam dan penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
