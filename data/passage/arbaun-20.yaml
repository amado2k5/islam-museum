text: "إن مما أدرك الناس من كلام النبوة الأولى: إذا لم تستح فاصنع ما شئت"
summary:
  ar: "حديث أبي مسعود البدري، وهو الحديث العشرون في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري ⁦(3483 و6120)⁩ من رواية منصور بن المعتمر عن ربعي بن حراش عن أبي مسعود، ولم يخرجه مسلم، واختلف في إسناده فقيل عن ربعي عن حذيفة، لكن أكثر الحفاظ — منهم البخاري وأبو زرعة والدارقطني — حكموا بأن القول قول من قال عن أبي مسعود، وعضد ذلك رواية مسروق عنه من وجه آخر، وخرجه الطبراني عن أبي الطفيل مرسلاً؛ ومعنى «كلام النبوة الأولى» عند ابن رجب أنه مأثور عن الأنبياء المتقدمين تداوله الناس وتوارثوه قرناً بعد قرن حتى وصل إلى أول هذه الأمة؛ ولقوله «إذا لم تستح فاصنع ما شئت» معنيان: الأول أنه ليس بمعنى الأمر بل الذم والنهي — إما بمعنى التهديد والوعيد كقوله «اعملوا ما شئتم إنه بما تعملون بصير» وهو اختيار جماعة منهم أبو العباس ثعلب، وإما أمرٌ معناه الخبر أي أن من لا حياء له يصنع ما شاء لأن الحياء هو المانع من فعل القبائح وهو اختيار أبي عبيد القاسم بن سلام وابن قتيبة ومحمد بن نصر المروزي وروى أبو داود عن الإمام أحمد ما يدل على مثله ⁦(جامع العلوم والحكم ص 464–470)⁩."
  en: "Abu Masud al-Badri's hadith, the twentieth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (3483, 6120) through Mansur ibn al-Mu'tamir from Rib'i ibn Hirash from Abu Masud, Muslim omitting it, and its chain was disputed — some said Rib'i from Hudhayfa — but most of the memorising critics, among them al-Bukhari, Abu Zur'a and al-Daraqutni, ruled for those who said from Abu Masud, corroborated by Masruq's route from him, al-Tabarani also carrying it mursal from Abu al-Tufayl; for Ibn Rajab 'the speech of the first prophethood' means it was handed down from the earlier prophets, transmitted among people generation after generation until it reached the first of this community; 'if you feel no shame, do as you wish' has two readings — not a command but censure: either as threat and warning, like 'do as you wish, for He sees what you do', the choice of a group including Abu al-Abbas Tha'lab, or a command in form whose meaning is a statement — whoever has no shame will do whatever he wishes, shame being the restraint from ugly deeds — the choice of Abu Ubayd al-Qasim ibn Sallam, Ibn Qutayba and Muhammad ibn Nasr al-Marwazi, Abu Dawud reporting from Ahmad what points the same way (Jami' al-Ulum wal-Hikam pp. 464–470)."
  es: "Hadiz de Abu Masud al-Badri, el vigésimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Bujari (3483, 6120) a través de Mansur ibn al-Mu'tamir de Rib'i ibn Hirash de Abu Masud, Muslim lo omitió, y su cadena fue disputada —algunos dijeron que Rib'i de Hudhayfa— pero la mayoría de los críticos memorizadores, entre ellos al-Bujari, Abu Zur'a y al-Daraqutni, se inclinaron por aquellos que dijeron de Abu Masud, corroborado por la ruta de Masruq desde él, al-Tabarani también lo llevó mursal de Abu al-Tufayl; para Ibn Rajab 'el discurso de la primera profecía' significa que fue transmitido de los profetas anteriores, transmitido entre la gente generación tras generación hasta que llegó al primero de esta comunidad; «Si no sientes vergüenza, haz lo que quieras» tiene dos lecturas: no es un mandato sino una censura: o bien como amenaza y advertencia, como «haz lo que quieras, porque Él ve lo que haces», la elección de un grupo que incluye a Abu al-Abbas Tha'lab, o bien un mandato formal cuyo significado es una declaración: quien no tiene vergüenza hará lo que quiera, siendo la vergüenza la restricción de actos indeseables, la elección de Abu Ubayd al-Qasim ibn Sallam, Ibn Qutayba y Muhammad ibn Nasr al-Marwazi, Abu Dawud informando de Ahmad que apunta en la misma dirección (Jami' al-Ulum wal-Hikam pp. 464–470)."
  fr: "Le hadith d'Abu Masud al-Badri, le vingtième des quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Bukhari (3483, 6120) par Mansur ibn al-Mu'tamir d'après Rib'i ibn Hirash d'après Abu Masud, Muslim l'omettant, et sa chaîne de transmission a été contestée — certains disent Rib'i d'après Hudhayfa — mais la plupart des critiques mémorisants, parmi lesquels al-Bukhari, Abu Zur'a et al-Daraqutni, ont statué en faveur de ceux qui disaient d'après Abu Masud, corroboré par la voie de Masruq à partir de lui, al-Tabarani le transmettant également mursal d'après Abu al-Tufayl; pour Ibn Rajab, « la parole de la première prophétie » signifie qu'elle a été transmise par les prophètes antérieurs, transmise parmi les gens de génération en génération jusqu'à ce qu'elle atteigne le premier de cette communauté; L'expression « si tu n'éprouves aucune honte, fais ce que tu veux » a deux interprétations: non pas un ordre mais une réprimande, soit comme une menace et un avertissement, comme « fais ce que tu veux, car Il voit ce que tu fais », choix d'un groupe comprenant Abu al-Abbas Tha'lab, soit comme un ordre dont le sens est une affirmation — celui qui n'a aucune honte fera ce qu'il veut, la honte étant la retenue des actes répréhensibles — choix d'Abu Ubayd al-Qasim ibn Sallam, d'Ibn Qutayba et de Muhammad ibn Nasr al-Marwazi, Abu Dawud rapportant d'Ahmad ce qui va dans le même sens (Jami' al-Ulum wal-Hikam pp. 464–470)."
