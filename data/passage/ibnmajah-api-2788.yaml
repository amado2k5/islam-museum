label: { ar: "سنن ابن ماجه 2788 — كتابة الحسنات", en: "Sunan Ibn Majah 2788 — the writing of good deeds", ur: "سنن ابن ماجہ 2788 — نیکیوں کا لکھا جانا", es: "Sunan Ibn Majah 2788 — El registro de las buenas obras", fr: "Sunan Ibn Majah 2788 — la rédaction des bonnes actions", tr: "Sunan İbn Majah 2788 — İyi amelleri yazmak", id: "Sunan Ibn Majah 2788 — Mencatat amal kebaikan" }
text: "… تُغَيِّبُ شَيْئًا فِي بُطُونِهَا إِلاَّ كُتِبَ لَهُ أَجْرٌ وَلَوْ رَعَاهَا فِي مَرْجٍ مَا أَكَلَتْ شَيْئًا إِلاَّ كُتِبَ لَهُ بِهَا أَجْرٌ وَلَوْ سَقَاهَا مِنْ نَهَرٍ جَارٍ كَانَ لَهُ بِكُلِّ قَطْرَةٍ تُغَيِّبُهَا فِي بُطُونِهَا أَجْرٌ - حَتَّى ذَكَرَ الأَجْرَ فِي أَبْوَالِهَا وَأَرْوَاثِهَا - وَلَوِ اسْتَنَّتْ شَرَفًا أَوْ شَرَفَيْنِ كُتِبَ لَهُ بِكُلِّ خَطْوَةٍ تَخْطُوهَا أَجْرٌ. وَأَمَّا الَّذِي هِيَ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2788، يذكر كتابة الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2788 (The Chapters on Jihad), that speaks of the writing of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2788، جس میں نیکیوں کا لکھا جانا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2788 (Los capítulos sobre la yihad), que habla de la escritura de las buenas obras. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o valoran una obra."
  fr: "Un hadith du Sunan Ibn Majah, n° 2788 (Les chapitres sur le Jihad), évoque la consignation des bonnes actions. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui recensent, inscrivent, effacent ou pèsent une action."
  tr: "İbn Majah'ın Sünen'inde yer alan 2788 numaralı hadiste, iyi amellerin kaydedilmesinden bahsedilir. Bu hadiste, iyi ve kötü amellerin listesiyle birlikte, ameli sayan, kaydeden, silen veya tartan metinler de yer almaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2788, menyebutkan pencatatan amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
