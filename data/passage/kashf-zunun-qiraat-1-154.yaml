text: "تَعَلِّم الخَطِّ الأعْجَمي قبل العَرَبي ولذلك تَرَى بعضَ عُلماء الأعاجم في دُرُوسهم يَعْدِلُون عن نَقْلِ المعنَى من الكُتُب إلى قراءَتِها ظاهرًا يُخَفِّفون بذلك عن أُنفُسِهم مؤونة بعضِ الحُجُب، وصاحبُ المَلَكة في العِبارةِ والخَطَّ مُستَغنٍ عن ذلك. مَطْلبُ عُلوم اللَّسان العربيّ: …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 154، يذكر الخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 154, that mentions the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 154 کا اقتباس جس میں خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen 1, pág. 154, que menciona los alfabetos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Kashf al-Zunun de Hajji Khalifa (tome 1, p. 154) évoque les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Hacı Halife'nin Kashf al-Zunun adlı eserinin resimli 1. cildinin 154. sayfasında, yazı ve alfabelerden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Kur'an okunuşları, yazı, alfabeler ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Kashf al-Zunun karya Haji Khalifa, jilid 1 bergambar, halaman 154, menyebutkan aksara dan tulisan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, dan tanda diakritik."
