label: { ar: "الموطأ 1270 — زياد بن أبي زياد عن طلحة بن عبيد الله بن كريز: أفضل الدعاء دعاء يوم عرفة، وأفضل ما قلت أنا والنبيون لا إله إلا الله", en: "Muwatta 1270", es: "Muwatta 1270", fr: "Muwatta 1270", ur: "موطا 1270", tr: "El-Muvatta 1270 — Ziyad ibn Abi Ziyad, Talha ibn Ubayd Allah ibn Kurayz'dan rivayetle: En faziletli dua, Arafat Günü duasıdır ve benim ve peygamberlerin söylediği en faziletli söz şudur: Allah'tan başka ilah yoktur.", id: "Al-Muwatta 1270 — Ziyad ibn Abi Ziyad, berdasarkan riwayat Talha ibn Ubayd Allah ibn Kurayz: Doa terbaik adalah doa pada Hari Arafah, dan hal terbaik yang telah kukatakan bersama para nabi adalah: Tidak ada Tuhan selain Allah." }
text: "أفْضَلُ الدُّعاءِ دُعاءُ يَوم عَرَفَةَ"
summary:
  ar: "يروي مالك عن زياد بن أبي زياد مولى عبد الله بن عياش بن أبي ربيعة عن طلحة بن عبيد الله بن كريز أن رسول الله قال أفضل الدعاء دعاء يوم عرفة، وأفضل ما قلته أنا والنبيون من قبلي: لا إله إلا الله وحده لا شريك له. {cite:muwatta-maruf-1997 p.564}"
  tr: "Malik, Abdullah ibn Ayyash ibn Abi Rabi'ah'ın azatlı kölesi Ziyad ibn Abi Ziyad'dan, Talha ibn Ubaydullah ibn Kurayz'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu naklediyor: \"En faziletli dua, Arafat Günü duasıdır ve benim ve benden önceki peygamberlerin söylediği en güzel söz şudur: 'Allah'tan başka ilah yoktur, O tektir, ortağı yoktur.'\" {cite:muwatta-maruf-1997 s.564}"
  id: "Malik meriwayatkan dari Ziyad bin Abi Ziyad, budak yang dibebaskan oleh Abdullah bin Ayyash bin Abi Rabi'ah, dari Talhah bin Ubaydullah bin Kurayz, bahwa Rasulullah SAW bersabda: \"Doa terbaik adalah doa pada hari Arafah, dan hal terbaik yang telah kukatakan dan para nabi sebelumku adalah: 'Tidak ada Tuhan selain Allah, Yang Maha Esa, tanpa sekutu.'\" {cite:muwatta-maruf-1997 p.564}"
