text: "… أغشية... إلى آخر الفصل. الشرح إن القلب تخرج منه أربعة عروق. وأما الشريان الوريدي منها فعلى مخرجه غشاءان. وأما الثلاثة الآخر فعلى مخرج كل واحد منها ثلاثة أغشية ونحن قد تكلمنا في هذه الأغشية في كلامنا في النبض كلاماً مختصراً …"
summary:
