text: "… أغشية... إلى آخر الفصل. الشرح إن القلب تخرج منه أربعة عروق. وأما الشريان الوريدي منها فعلى مخرجه غشاءان. وأما الثلاثة الآخر فعلى مخرج كل واحد منها ثلاثة أغشية ونحن قد تكلمنا في هذه الأغشية في كلامنا في النبض كلاماً مختصراً …"
summary:
  ar: "مقطع من شرح تشريح القانون لابن النفيس، ص 117، يذكر البيمارستان وصناعة الطب، وأعضاء البدن، والعروق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 117, that mentions the hospital and the medical craft, the organs of the body, the vessels; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "شرح تشریح القانون، ابن النفیس، ص 117 کا اقتباس جس میں بیمارستان، اعضائے بدن، رگیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Comentario de Ibn al-Nafis sobre la Anatomía del Canon, pág. 117, que menciona el hospital y la práctica médica, los órganos del cuerpo y los vasos sanguíneos; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Commentaire d'Ibn al-Nafis sur l'Anatomie du Canon, p. 117, qui mentionne l'hôpital et l'art médical, les organes du corps, les vaisseaux; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn el-Nafis'in hukukun anatomisi hakkındaki açıklamasından bir alıntı, sayfa 117; hastaneden, tıp mesleğinden, vücut organlarından ve damarlardan bahsediliyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikası gereği metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari penjelasan Ibn al-Nafis tentang anatomi hukum, hlm. 117, yang menyebutkan rumah sakit, profesi medis, organ tubuh, dan pembuluh darah; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
