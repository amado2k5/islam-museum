text: "… مكافأة الضفادع كان عائداً من مكان راكباً حماره، فوصل في طريقه إلى بحيرة وكان الحمار قد عطش عطشاً، لا مزيد عليه، فركض نحو البحيرة، يريد إرواء ظمإه، ولكن احجموا، توقفوا وامتنعوا."
summary:
  ar: "نقّت الضفادع في مستنقع فأفزعت حمار جحا ورددته عن الماء، فألقى جحا نقودًا في البحيرة لتشتري الضفادع بها حلوى. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  en: "Frogs croak in a bog and frighten Juha's donkey back from the water; Juha throws coins into the lake for the frogs to buy sweets. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  ur: "مینڈک دلدل میں ٹرّانے لگے اور جحا کے گدھے کو ڈرا کر پانی سے پیچھے ہٹا دیا، تو جحا نے جھیل میں سکے پھینک دیے تاکہ مینڈک ان سے مٹھائی خرید لیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  fr: "Des grenouilles coassent dans un marais et font reculer l'âne de Juha, effrayé, loin de l'eau ; Juha jette des pièces dans le lac pour que les grenouilles s'achètent des sucreries. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  es: "Unas ranas croan en un pantano y asustan al burro de Juha, que retrocede del agua; Juha arroja monedas al lago para que las ranas compren dulces. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
  tr: "Kurbağalar bataklıkta vıraklayarak Juha'nın eşeğini korkuttular ve onu sudan uzaklaştırdılar. Bunun üzerine Juha, kurbağaların tatlı alabilmesi için göle para attı. {cite:juha-nawadir-kubra-djuwaydi s. 25}"
  id: "Kodok-kodok itu bersuara di rawa, mengejutkan keledai Juha dan mengusirnya dari air. Maka Juha melemparkan uang ke danau agar kodok-kodok itu bisa membeli permen. {cite:juha-nawadir-kubra-djuwaydi p. 25}"
