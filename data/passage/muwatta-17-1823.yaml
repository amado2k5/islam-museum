label: { ar: "الموطأ 1823 — مالك: إذا استثنى من ثمر حائطه نخلة أو نخلات يختارها ويسمي عددها، فلا بأس بذلك، لأنه استثنى شيئا من حائط نفسه", en: "Muwatta 1823", es: "Muwatta 1823", fr: "Muwatta 1823", ur: "موطا 1823", tr: "El-Muvatta 1823 — Malik: Eğer bir kimse kendi bahçesindeki meyvelerden dilediği bir veya birkaç hurma ağacını ayırır ve sayısını belirtirse, bunda bir sakınca yoktur; çünkü kendi bahçesinden bir şeyi ayırmıştır.", id: "Al-Muwatta 1823 — Malik: Jika dia mengecualikan dari buah kebunnya sebuah pohon kurma atau beberapa pohon kurma yang dia pilih dan sebutkan jumlahnya, tidak ada salahnya dengan itu, karena dia telah mengecualikan sesuatu dari kebunnya sendiri." }
summary:
  ar: "قال مالك: فأما الرجل يبيع ثمر حائطه، ويستثني من ثمر حائطه ثمر نخلة أو نخلات يختارها، ويسمي عددها، فلا أرى بذلك بأسا. لأن رب الحائط إنما استثنى شيئا من حائط نفسه، وإنما ذلك شيء احتبسه من حائطه، وأمسكه لم يبعه، وباع من حائطه ما سوى ذلك. {cite:muwatta-maruf-1997 p.145}"
  tr: "Malik şöyle dedi: \"Bahçesinin meyvesini satan ve bu meyvelerden seçtiği ve sayısını belirttiği hurma ağaçlarının meyvelerini hariç tutan bir adam için bunda bir sakınca görmüyorum. Çünkü bahçe sahibi sadece kendi bahçesinden bir şeyi hariç tutmuş olur; bu, bahçesinin geri kalanını satarken elinde tuttuğu ve satmadığı bir şeydir.\" {cite:muwatta-maruf-1997 s.145}"
  id: "Malik berkata: Adapun seorang pria yang menjual buah dari kebunnya, dan mengecualikan dari buah itu buah kurma atau beberapa kurma yang dipilihnya dan menentukan jumlahnya, saya tidak melihat ada salahnya. Karena pemilik kebun hanya mengecualikan sesuatu dari kebunnya sendiri; itu adalah sesuatu yang dia simpan dan tidak dijual, sementara dia menjual sisa kebunnya. {cite:muwatta-maruf-1997 p.145}"
