label: { ar: "الموطأ 1823 — مالك: إذا استثنى من ثمر حائطه نخلة أو نخلات يختارها ويسمي عددها، فلا بأس بذلك، لأنه استثنى شيئا من حائط نفسه", en: "Muwatta 1823" }
summary:
  ar: "قال مالك: فأما الرجل يبيع ثمر حائطه، ويستثني من ثمر حائطه ثمر نخلة أو نخلات يختارها، ويسمي عددها، فلا أرى بذلك بأسا. لأن رب الحائط إنما استثنى شيئا من حائط نفسه، وإنما ذلك شيء احتبسه من حائطه، وأمسكه لم يبعه، وباع من حائطه ما سوى ذلك. {cite:muwatta-maruf-1997 p.145}"
