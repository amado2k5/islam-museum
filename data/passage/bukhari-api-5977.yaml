label: { ar: "صحيح البخاري 5977 — بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 5977 — dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 5977 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 5977 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sahih al-Bukhari 5977 — le respect des parents ou la désobéissance envers eux" }
text: "… بْنُ أَبِي بَكْرٍ، قَالَ سَمِعْتُ أَنَسَ بْنَ مَالِكٍ ـ قَالَ ذَكَرَ رَسُولُ اللَّهِ الْكَبَائِرَ، أَوْ سُئِلَ عَنِ الْكَبَائِرِ فَقَالَ \" الشِّرْكُ بِاللَّهِ، وَقَتْلُ النَّفْسِ، وَعُقُوقُ الْوَالِدَيْنِ \". فَقَالَ \" أَلاَ أُنَبِّئُكُمْ بِأَكْبَرِ الْكَبَائِرِ ـ قَالَ ـ قَوْلُ الزُّورِ ـ أَوْ قَالَ ـ شَهَادَةُ الزُّورِ \". قَالَ شُعْبَةُ وَأَكْثَرُ ظَنِّي أَنَّهُ قَالَ \" شَهَادَةُ الزُّورِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5977، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5977 (Good Manners and Form (Al-Adab)), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5977، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5977 (Buenas costumbres y modales (Al-Adab)), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye entre los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5977 (Les bonnes manières et la bienséance), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
