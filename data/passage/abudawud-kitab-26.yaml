summary:
  ar: "القسم 26 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العلم»، ويضم فيها النصوص من 3641 إلى 3668 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 26 of Sunan Abi Dawud (Knowledge (Kitab Al-Ilm)) in the division of the open hadith dataset the museum took its reports from: reports 3641 to 3668 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 26، عنوان «کتاب العلم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3641 تا 3668۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 26 de Sunan Abi Dawud (El Conocimiento (Kitab Al-Ilm)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3641 al 3668, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
