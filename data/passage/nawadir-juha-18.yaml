text: "… خذ وضوءك ورد حذائي توضأ يوماً على ضفاف نهر، ولما انتهى، وأراد لبس نعليه، وقع أحدهما في النهر، وجرى مع الماء، فأدار ظهره للنهر، وأخرج صوتاً.. يشبه الرعد، ثم التفت إلى النهر وقال له: خذ وضوءك، ورد لي حذائي. حداداً …"
summary:
  ar: "كان جحا يتوضأ عند نهر فسقط أحد حذائيه فيه، فقال للنهر أن يتم وضوءه ويرد إليه الحذاء. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  en: "While making ablution by a river, Juha lets one shoe fall in, and tells the river to finish its ablution and return the shoe. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  ur: "جحا دریا کے کنارے وضو کر رہا تھا کہ اس کا ایک جوتا پانی میں گر گیا، تو اس نے دریا سے کہا کہ اپنا وضو مکمل کرے اور جوتا واپس کر دے۔ {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  fr: "Alors qu'il fait ses ablutions au bord d'une rivière, Juha laisse tomber une chaussure dans l'eau et dit à la rivière d'achever ses ablutions et de lui rendre la chaussure. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
  es: "Mientras hace la ablución junto a un río, a Juha se le cae un zapato al agua y le dice al río que termine su ablución y le devuelva el zapato. {cite:juha-nawadir-kubra-djuwaydi p. 15}"
