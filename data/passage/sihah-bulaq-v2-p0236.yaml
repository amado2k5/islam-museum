text: |-
  *⁦(بلب البُون)⁩*
  *أَدُن) .
  ٣٥١
  والاتانومقام المستقى على فم البتروهو صجرة أيضاوالاتان الصخرة الملمة قإذا كانت فى الماء
  الضهضاح قبل أتان الضجل وتشبه بها الناقة فى صلاتها وملاستها وقال
  عيراتة كاتان الضحل ناجية • اذا تر قص بالقور العساقيل
  وقال الاخطل
  بجرة كانان الضول أضمرها * بعدالربالة ترجالى وتسيادى
  وأتن الرجل أتنانالغة في أتلى أقلالا اذا قارب انلطو وأتن بالمكان أقام به والاتون بالتشبديد
  هذا الموقد والعاقة تخففه واجمع الاتاتين ويقال هو مولد ⁦(أجن)⁩ الاجن الماء المتغير
  الطعم واللون وقال الشاعر علقمة
  فأوردهاما كأن حامه • من الاجن حناء معاوصيب
  وقد أحن الماء يأحن ويأجن أجنا وأجونا قال الراجز
  ومنهل فم الغراب ميت • كانه من الإجون زيت
  وحكى البزيدى أجن الماء بالسكسر يأجن أجنافه وأجن هلى فعل والإجانة واحدة
  الاجاجين ولا تقل انجانة والاحنة بالضم لغة فى الوجنة وهي واح-دة الوجنات وأجن
  القصار الثوب أي دقة احن يقال في صدره علي احنة أى حقد ولاتل حنة
  والجمع احن وقد أجنت عليه بالسكسر قال الشاءر
  اذا كان في صدوا بن عمك احنة * فلاتستترها سوفديدودفينها
  والمواحية المعاداة ذن) أذن له فى الشى اذنا يقال اتذن لي على الامير وقول
  الشاعر
  قلت لبواب لديه دارها • عيذن فاني حؤها وجارها
  قال أبو جعر أراد لتأذن وجائر فى الشعر حدَّف اللام وكسر التامعلى لغة من يقول أنت
  تعلم وقرى فبدلك فلتفرحوا وأذن يمعنى علم ومفسه قوله تعالى قأدنوا بحربٍ من اللّٰه ورسوله
  وأذن له أذنا استمع قال قعنب إبن أتم صاحب
  ان يسمعواريبة طارواب إفرجا عني وماسمعوا من صالح دفنوا
  يم اذا سمعوا خيراد كرت به • وان ذكرت بشر عندهم أذنوا
  وما أذن اللٰه اني كادنه ان يتغنى بالقرآن وإلادان الاعلام وأذان الصلاة معروف والادين
  مثله وقد أذن أذانا والمبذنْة المنارة والإذين السكفيل وقال امر والقيس
  قوله أن يتغني فى بعض التسخ
  لنييت تغنى!ه
  وإنى أذين ان رجعت ملكا • بسيرتزي منه الفرائق أزورا
  وقال قوم الاذين المكان يأتيه الاذان من كل ناحية وأنشدوا
  طهور الحصى كانت أذينا ولم تكن • بهاريبسة مما يخاف تريب
  والاذن تحفف وتنقل وهي مؤنية وتصغيرها أذينة ولوسميت بهارحلاثم صغرته قلت أذين فلم
  تؤنت لزوال التأنيت عنه بالنقل الى المذكرفأ ما قولهم أذينة فى الاسم العلم فانماسمى به مصغرا
  والبمع آذان وتقول أذنتسه اذاضر بت أذنه ورجل أذن اذا كان يسمع مقال كل أحد ويقبله
  يستوى فيه الواحد والجمع ورحل أذانى عظيم الإذنين ونعجة أذناء وكبش آذن وأذنت النعل
  وغيرها تأذينا اذا جعات لها أذنا وأذنت الصبى حركت أذنه وآدنتك بالشيء أعلتكه والاذن
  الحاجب وقال « تبدل با ذنك المرتضى * وقد آذن وتأذن بمعنى كما يقال أبق ن وتية ن وتقول
