  ar: "أثر يرويه مالك عن عبد الله بن دينار، في باب ما جاء في الصلاة على النبي: رأى عبد الله بن عمر يقف على قبر النبي فيصلي على النبي ويدعو لأبي بكر وعمر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.235}"
