label: { ar: "الموطأ 43 — مالك: لا وضوء من رعاف ولا دم ولا قيح", en: "Muwatta 43" }
summary:
  ar: "قول لمالك يرويه يحيى في باب وضوء النائم إذا قام إلى الصلاة: الأمر عند أهل المدينة أنه لا وضوء من الرعاف ولا من الدم ولا من القيح يسيل من الجسد، وإنما الوضوء من حدث يخرج من أحد السبيلين أو من النوم. ويفسر المحقق الرعاف بخروج الدم من الأنف ويحيل على اختلاف الفقهاء عند الترمذي. {cite:muwatta-maruf-1997 p.55}"
