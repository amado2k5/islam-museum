label: { ar: "الموطأ 43 — مالك: لا وضوء من رعاف ولا دم ولا قيح", en: "Muwatta 43", es: "Muwatta 43", fr: "Muwatta 43", ur: "موطا 43", tr: "Al-Muwatta 43 — Malik: Burun kanaması, kan veya irin için abdest gerekmez.", id: "Al-Muwatta 43 — Malik: Tidak ada wudhu yang diperlukan untuk mimisan, darah, atau nanah." }
summary:
  ar: "قول لمالك يرويه يحيى في باب وضوء النائم إذا قام إلى الصلاة: الأمر عند أهل المدينة أنه لا وضوء من الرعاف ولا من الدم ولا من القيح يسيل من الجسد، وإنما الوضوء من حدث يخرج من أحد السبيلين أو من النوم. ويفسر المحقق الرعاف بخروج الدم من الأنف ويحيل على اختلاف الفقهاء عند الترمذي. {cite:muwatta-maruf-1997 p.55}"
  tr: "Yahya'nın, uyuduktan sonra namaz için kalkanın abdesti hakkındaki bölümünde Malik'e atfedilen bir ifade şöyledir: Medine halkı arasında yaygın uygulama, burun kanaması, kan veya vücuttan akan irin için abdest gerekmemesidir. Abdest sadece iki açıklıktan birinden çıkan veya uykudan kaynaklanan bir kirlilik için gereklidir. Araştırmacı, burun kanamasını burundan gelen kan olarak açıklıyor ve Tirmizi'deki fıkıhçıların farklı görüşlerine değiniyor. {cite:muwatta-maruf-1997 s.55}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dalam bab tentang wudhu orang yang telah tidur dan kemudian bangun untuk shalat: Kebiasaan di kalangan penduduk Madinah adalah tidak diperlukan wudhu untuk mimisan, darah, atau nanah yang keluar dari tubuh. Wudhu hanya diperlukan untuk najis yang keluar dari salah satu dari dua lubang tubuh atau karena tidur. Peneliti menjelaskan mimisan sebagai darah yang keluar dari hidung dan merujuk pada perbedaan pendapat para ahli fiqih dalam al-Tirmidhi. {cite:muwatta-maruf-1997 p.55}"
