text: "… و رسوله فقد رشد ومن يعصهما تقد ضل خلالا مينا، اوصيكم بتقوى اللّٰه والاعتصام بأمر اللّٰه الذى شرع لكم وهداكم به، قان جوامع هدى الإسلام بعد كلة الإخلاص السمع والطاعة لمن ولاه الّه امركم، فانه من يطع والى الأمر بالمعروف …"
summary:
