text: "الحديث الراوح رقمه والمنكر لا يتناجى الاثنان دون عكرمة بن خالد الثالث فإن ذلك يؤذى المؤمن • لا يحل لمسلم أن يروَّعَ أبو هريرة مسلماً لا يحل لمسلم أن يهاجر هشام بن عامر مسلماً فوق ثلاث ليال لا يحل لمسلم …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 941، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 941, that mentions what was made lawful, what is not lawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 941 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
