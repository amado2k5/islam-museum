text: "… وأن المراد به المحدثات الباطلة والبدع المذمومة وقد سبق بيان هذا في كتاب صلاة الجمعة وذكرنا هناك أن البدع خمسة أقسام: واجبة ومندوبة ومحرمة ومكروهة ومباحة. - وحَدَّثَنَا أبُو بَكْرِ أبْن أَبِي شَيْبَةَ، حَدْثَنَا أبُو أسَامَةً ح. وحَدْثَنَا عُبَيْدُ اللّه …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 1، ص 646، يرد فيه ذكر الواجب، والمندوب، والمكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
