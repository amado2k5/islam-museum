  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 1. cildinin 646. sayfasından, farz, tavsiye edilen, mekruh ve caiz olan amelleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari komentar Al-Nawawi tentang Sahih Muslim, Volume 1, halaman 646, yang membahas amalan wajib, anjuran, makruh, dan halal; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
