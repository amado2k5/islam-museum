label: { ar: "جامع الترمذي 2162 — الأب والأبوة", en: "Jami' al-Tirmidhi 2162 — the father and fatherhood", ur: "جامع ترمذی 2162 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2162 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 2162 — le père et la paternité" }
text: "… قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ أَبِي بَكْرَةَ وَعَائِشَةَ وَجَابِرٍ. وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ يُسْتَغْرَبُ مِنْ حَدِيثِ خَالِدٍ الْحَذَّاءِ. وَرَوَاهُ أَيُّوبُ عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ، نَحْوَهُ وَلَمْ يَرْفَعْهُ وَزَادَ فِيهِ \" وَإِنْ كَانَ أَخَاهُ لأَبِيهِ وَأُمِّهِ \". قَالَ وَأَخْبَرَنَا بِذَلِكَ قُتَيْبَةُ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ عَنْ أَيُّوبَ بِهَذَا."
summary:
  ar: "حديث في جامع الترمذي، رقم 2162، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2162 (Chapters On Al-Fitan), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2162، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2162 (Capítulos sobre Al-Fitan), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2162 (Chapitres sur Al-Fitan), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
