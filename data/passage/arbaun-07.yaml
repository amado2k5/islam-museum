text: "الدين النصيحة، قلنا: لمن يا رسول الله؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم"
summary:
  ar: "حديث تميم الداري، وهو الحديث السابع في الأربعين النووية وفي شرح ابن رجب؛ رواه مسلم (55) من رواية سهيل بن أبي صالح عن عطاء بن يزيد الليثي عن تميم الداري، وروي أيضاً من حديث أبي هريرة وابن عمر وثوبان وابن عباس، وقال البخاري إن مدار الحديث كله على تميم؛ ذكر ابن رجب عن أبي داود أنه أحد الأحاديث التي يدور عليها الفقه، وعن محمد بن أسلم الطوسي أنه أحد أرباع الدين، وجمع في شرحه تعريفات الخطابي وابن الصلاح للنصيحة ونصوص النصح للمسلمين ولولاة الأمور ⁦(جامع العلوم والحكم ص 193–204)⁩."
  en: "Tamim al-Dari's hadith, the seventh of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim (55) through Suhayl ibn Abi Salih from Ata ibn Yazid al-Laythi from Tamim al-Dari, and also reported from Abu Hurayra, Ibn Umar, Thawban and Ibn Abbas, al-Bukhari holding the whole hadith to rest on Tamim; Ibn Rajab cites Abu Dawud that it is one of the hadiths around which jurisprudence revolves, and Muhammad ibn Aslam al-Tusi that it is a quarter of the religion, and gathers al-Khattabi's and Ibn al-Salah's definitions of nasiha and the texts on sincerity to Muslims and to those in authority (Jami' al-Ulum wal-Hikam pp. 193–204)."
  es: "El hadiz de Tamim al-Dari, el séptimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Muslim (55) a través de Suhayl ibn Abi Salih de Ata ibn Yazid al-Laythi de Tamim al-Dari, y también reportado por Abu Hurayra, Ibn Umar, Thawban e Ibn Abbas, al-Bukhari sosteniendo que todo el hadiz se basa en Tamim; Ibn Rajab cita a Abu Dawud diciendo que es uno de los hadices en torno a los cuales gira la jurisprudencia, y a Muhammad ibn Aslam al-Tusi diciendo que es una cuarta parte de la religión, y reúne las definiciones de nasiha de al-Khattabi e Ibn al-Salah y los textos sobre la sinceridad hacia los musulmanes y hacia aquellos en autoridad (Jami' al-Ulum wal-Hikam pp. 193–204)."
  fr: "Le hadith de Tamim al-Dari, le septième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Muslim (55) par Suhayl ibn Abi Salih d'après Ata ibn Yazid al-Laythi d'après Tamim al-Dari, et également rapporté d'après Abu Hurayra, Ibn Umar, Thawban et Ibn Abbas, al-Bukhari considérant que l'ensemble du hadith repose sur Tamim; Ibn Rajab cite Abu Dawud comme l'un des hadiths autour desquels la jurisprudence s'articule, et Muhammad ibn Aslam al-Tusi comme un quart de la religion, et rassemble les définitions de nasiha d'al-Khattabi et d'Ibn al-Salah et les textes sur la sincérité envers les musulmans et envers ceux qui détiennent l'autorité (Jami' al-Ulum wal-Hikam pp. 193–204)."
  ur: "تمیم الداری کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی ساتویں؛ مسلم (55) نے سہیل بن ابی صالح سے عطا بن یزید لیثی سے تمیم الداری سے نقل کیا ہے، اور ابوہریرہ، ابن عمر، ثوبان اور ابن عباس سے بھی روایت کیا ہے، البخاری نے پوری حدیث کو تمیم پر ٹھہرایا ہے۔ ابن رجب نے ابوداؤد کا حوالہ دیا ہے کہ یہ ان احادیث میں سے ایک ہے جس کے گرد فقہ گھومتی ہے، اور محمد بن اسلم طوسی کہ یہ دین کا چوتھائی حصہ ہے، اور الخطابی اور ابن الصلاح کی ناصح کی تعریفیں اور اخلاص سے متعلق نصوص کو جمع کرتا ہے۔ صفحہ 193-204)۔"
