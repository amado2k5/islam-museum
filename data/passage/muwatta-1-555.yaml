  ar: "يقول يحيى: سئل مالك عمن قرأ سجدة وامرأة حائض تسمع، هل لها أن تسجد؟ فقال مالك: لا يسجد الرجل ولا المرأة إلا وهما طاهران. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.284} {cite:muwatta-maruf-1997 p.285}"
