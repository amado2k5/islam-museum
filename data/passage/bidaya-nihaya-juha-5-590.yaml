text: "… الرشيد بعدها، ولا يحج بعده خليفة أبداً. وقد رأى الرشيد بهلول الموله فوعظه موعظة حسنة، فروينا من طريق الفضل بن الربيع الحاجب قال: حججت مع الرشيد فمررنا بالكوفة فإذا بهلول المجنون يهذي، فقلت: اسكت فقد أقبل أمير المؤمنين، فسكت. فلما …"
