text: "… دين الإسلام؟ قال : أَن تقول : أَسَلَمتُ وجهيَ للهِ وتَخَلَّيتُ، وتقيم الصَلاةَ، وتُؤْتي الزكاةَ، وكلُّ مسْلم على كُلِّ مسلِمِ محرَّمٌ، أخَوان صيرانِ لا يَقْبلُ اللّهَ مَن أَشْرك بعدَمًا أسلم عملاً حتَّى يفارق المشركين، ما لي أُمسِكُ بِحُجَزِكُمْ عن النارِ، …"
summary:
