label: { ar: "صحيح البخاري 1445 — الأب والأبوة", en: "Sahih al-Bukhari 1445 — the father and fatherhood", ur: "صحیح بخاری 1445 — باپ اور والدیت", es: "Sahih al-Bukhari 1445 — El padre y la paternidad", fr: "Sahih al-Bukhari 1445 — le père et la paternité" }
text: "حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا سَعِيدُ بْنُ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنِ النَّبِيِّ قَالَ \" عَلَى كُلِّ مُسْلِمٍ صَدَقَةٌ \". فَقَالُوا يَا نَبِيَّ اللَّهِ فَمَنْ لَمْ يَجِدْ قَالَ \" يَعْمَلُ بِيَدِهِ فَيَنْفَعُ نَفْسَهُ وَيَتَصَدَّقُ \". قَالُوا فَإِنْ لَمْ يَجِدْ قَالَ \" يُعِينُ ذَا الْحَاجَةِ الْمَلْهُوفَ \". قَالُوا فَإِنْ لَمْ يَجِدْ. قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1445، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1445 (Obligatory Charity Tax (Zakat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1445، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1445 (Impuesto obligatorio sobre la caridad (Zakat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 1445 (L'aumône obligatoire (Zakat)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages traitant de la paternité."
