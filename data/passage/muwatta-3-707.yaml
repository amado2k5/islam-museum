label: { ar: "الموطأ 707 — مالك في الفريضة لا توجد: بنت المخاض يؤخذ مكانها ابن لبون، وغيرها يبتاعها رب الإبل؛ ولا أحب أن يعطي قيمتها", en: "Muwatta 707", es: "Muwatta 707", fr: "Muwatta 707", ur: "موطا 707", tr: "El-Muvatta 707 — Malik, farz kurban hakkında şöyle dedi: Genç dişi deve dahil değildir; onun yerine erkek deve alınır ve develerin sahibi diğerini satın alır; ve ben onun değerini vermesini hoş karşılamam.", id: "Al-Muwatta 707 — Malik berkata mengenai kurban wajib: unta betina muda tidak termasuk; unta jantan diambil sebagai penggantinya, dan pemilik unta membeli unta yang satunya lagi; dan aku tidak suka jika dia harus membayar nilainya." }
summary:
  ar: "قول لمالك في الفريضة تجب على الرجل فلا توجد عنده: إن كانت بنت مخاض فلم توجد أُخذ مكانها ابن لبون ذكر، وإن كانت بنت لبون أو حقة أو جذعة ولم تكن عنده كان على رب الإبل أن يبتاعها له حتى يأتيه بها؛ ويقول مالك: ولا أحب أن يعطيه قيمتها. ويذكر المحقق أن قوله «قال مالك» سقط من نسخة م، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354}"
  tr: "Malik, bir erkeğin sahip olması gereken ancak sahip olmadığı bir deve hakkında şöyle demiştir: Eğer genç bir dişi deve ise ve ona sahip değilse, onun yerine erkek bir deve (ibn labun) alınmalıdır. Eğer genç bir dişi deve (bint labun), üç yaşında bir deve (hiqqah) veya dört yaşında bir deve (jadha'ah) ise ve ona sahip değilse, develerin sahibi onu ona getirene kadar satın almalıdır. Malik şöyle der: Ben onun değerini vermesini istemem. Editör, \"Malik dedi ki\" ifadesinin M el yazmasında bulunmadığını ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.354}"
  id: "Malik berkata mengenai unta yang wajib dimiliki seorang laki-laki dan ia tidak memilikinya: Jika itu adalah unta betina muda (bint makhad) dan ia tidak memilikinya, maka unta jantan (ibn labun) harus diambil sebagai penggantinya. Jika itu adalah unta betina muda (bint labun), atau unta berumur tiga tahun (hiqqah), atau unta berumur empat tahun (jadha'ah) dan ia tidak memilikinya, maka pemilik unta tersebut wajib membelikannya untuknya sampai ia membawanya kepadanya. Malik berkata: Aku tidak suka dia memberikan nilai unta tersebut kepadanya. Editor menyebutkan bahwa frasa “Malik berkata” hilang dari manuskrip M, dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.354}"
