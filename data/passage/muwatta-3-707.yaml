label: { ar: "الموطأ 707 — مالك في الفريضة لا توجد: بنت المخاض يؤخذ مكانها ابن لبون، وغيرها يبتاعها رب الإبل؛ ولا أحب أن يعطي قيمتها", en: "Muwatta 707" }
summary:
  ar: "قول لمالك في الفريضة تجب على الرجل فلا توجد عنده: إن كانت بنت مخاض فلم توجد أُخذ مكانها ابن لبون ذكر، وإن كانت بنت لبون أو حقة أو جذعة ولم تكن عنده كان على رب الإبل أن يبتاعها له حتى يأتيه بها؛ ويقول مالك: ولا أحب أن يعطيه قيمتها. ويذكر المحقق أن قوله «قال مالك» سقط من نسخة م، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354}"
