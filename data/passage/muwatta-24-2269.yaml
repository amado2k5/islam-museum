summary:
  ar: "قال مالك: لا يجوز أن يشتري العبد نفسه من سيده على أن يوالي من يشاء، لأن الولاء لمن أعتق. ولو أذن السيد لمولاه أن يوالي من شاء لم يجز ذلك، وإذا جاز للسيد أن يشترط ذلك أو يأذن فيه فهو هبة للولاء، والنبي نهى عنها. {cite:muwatta-maruf-1997 p.336} {cite:muwatta-maruf-1997 p.337}"
  id: "Malik berkata: Tidak diperbolehkan bagi seorang budak untuk membeli dirinya sendiri dari tuannya dengan syarat ia boleh berbaiat kepada siapa pun yang ia inginkan, karena baiat adalah hak orang yang membebaskannya. Sekalipun tuannya mengizinkan budaknya untuk berbaiat kepada siapa pun yang ia inginkan, hal ini tidak diperbolehkan. Jika tuannya mengizinkan atau mensyaratkan hal ini, maka itu adalah pemberian baiat, dan Nabi (shalawat dan salam kepadanya) melarangnya. {cite:muwatta-maruf-1997 p.336} {cite:muwatta-maruf-1997 p.337}"
