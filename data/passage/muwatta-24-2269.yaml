summary:
  ar: "قال مالك: لا يجوز أن يشتري العبد نفسه من سيده على أن يوالي من يشاء، لأن الولاء لمن أعتق. ولو أذن السيد لمولاه أن يوالي من شاء لم يجز ذلك، وإذا جاز للسيد أن يشترط ذلك أو يأذن فيه فهو هبة للولاء، والنبي نهى عنها. {cite:muwatta-maruf-1997 p.336} {cite:muwatta-maruf-1997 p.337}"
