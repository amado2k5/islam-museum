text: "أَخْبَرَنَا مَحْمُودُ بْنُ خَالِدٍ، قَالَ حَدَّثَنَا الْوَلِيدُ، قَالَ حَدَّثَنَا ابْنُ جَابِرٍ، قَالَ حَدَّثَنِي نَافِعٌ، قَالَ خَرَجْتُ مَعَ عَبْدِ اللَّهِ بْنِ عُمَرَ فِي سَفَرٍ يُرِيدُ أَرْضًا لَهُ فَأَتَاهُ آتٍ فَقَالَ إِنَّ صَفِيَّةَ بِنْتَ أَبِي عُبَيْدٍ لَمَا بِهَا فَانْظُرْ أَنْ تُدْرِكَهَا. فَخَرَجَ مُسْرِعًا وَمَعَهُ رَجُلٌ مِنْ قُرَيْشٍ يُسَايِرُهُ وَغَابَتِ الشَّمْسُ فَلَمْ يُصَلِّ الصَّلاَةَ وَكَانَ عَهْدِي بِهِ وَهُوَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 595، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 595 (The Book of the Times (of Prayer)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 595، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
