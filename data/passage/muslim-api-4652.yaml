label: { ar: "صحيح مسلم 4652 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 4652 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 4652 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 4652 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 4652 — mentions de nations, religions et peuples non musulmans" }
text: "وَحَدَّثَنِي سَلَمَةُ بْنُ شَبِيبٍ، حَدَّثَنَا الْحَسَنُ بْنُ أَعْيَنَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا أَبُو إِسْحَاقَ، عَنْ عَمْرِو بْنِ مَيْمُونٍ، عَنْ عَبْدِ اللَّهِ، قَالَ اسْتَقْبَلَ رَسُولُ اللَّهِ الْبَيْتَ فَدَعَا عَلَى سِتَّةِ نَفَرٍ مِنْ قُرَيْشٍ. فِيهِمْ أَبُو جَهْلٍ وَأُمَيَّةُ بْنُ خَلَفٍ وَعُتْبَةُ بْنُ رَبِيعَةَ وَشَيْبَةُ بْنُ رَبِيعَةَ وَعُقْبَةُ بْنُ أَبِي مُعَيْطٍ فَأُقْسِمُ بِاللَّهِ لَقَدْ رَأَيْتُهُمْ صَرْعَى عَلَى بَدْرٍ. قَدْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4652، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4652 (The Book of Jihad and Expeditions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 4652، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4652 (El Libro de la Yihad y las Expediciones), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih Muslim, n° 4652 (Livre du Jihad et des Expéditions), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
