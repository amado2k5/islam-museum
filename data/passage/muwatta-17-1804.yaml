label: { ar: "الموطأ 1804 — يحيى عن مالك عن ابن شهاب: أن عبد الله بن عامر أهدى لعثمان بن عفان جارية لها زوج، ابتاعها بالبصرة، فقال عثمان: لا أقربها حتى يفارقها زوجها، فأرضى ابن عامر زوجها ففارقها", en: "Muwatta 1804", es: "Muwatta 1804", fr: "Muwatta 1804", ur: "موطا 1804", tr: "El-Muvatta 1804 — Yahya, Malik'ten, o da İbn Şihab'tan rivayetle: Abdullah ibn Amir, Osman ibn Affan'a Basra'dan satın aldığı, kocası olan bir cariye sundu. Osman, \"Kocası onu boşayana kadar ona yaklaşmayacağım\" dedi. Bunun üzerine İbn Amir kocasını memnun etti ve kocası cariyeyi boşadı.", id: "Al-Muwatta 1804 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab: bahwa Abdullah ibn Amir mempersembahkan kepada Uthman ibn Affan seorang budak perempuan yang telah bersuami, yang dibelinya di Basra. Uthman berkata: Aku tidak akan mendekatinya sampai suaminya menceraikannya. Maka Ibn Amir membujuk suaminya, dan suaminya pun menceraikannya." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أن عبد الله بن عامر أهدى لعثمان بن عفان جارية، ولها زوج، كان ابتاعها بالبصرة. فقال عثمان: لا أقربها حتى يفارقها زوجها. فأرضى ابن عامر زوجها، ففارقها. {cite:muwatta-maruf-1997 p.139}"
  tr: "Yahya, İbn Şihab'dan rivayetle Malik'ten naklederek, Abdullah ibn Amir'in Osman ibn Affan'a kocası olan bir cariye hediye ettiğini; onu Basra'dan satın aldığını anlatır. Osman, \"Kocası onu boşayana kadar onunla ilişkiye girmeyeceğim\" dedi. Bunun üzerine İbn Amir kocasını yatıştırdı ve adam cariyeyi boşadı. {cite:muwatta-maruf-1997 s.139}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, bahwa Abdullah ibn Amir menghadiahkan Uthman ibn Affan seorang budak perempuan yang sudah bersuami; ia membelinya di Basra. Uthman berkata, \"Aku tidak akan bersetubuh dengannya sampai suaminya menceraikannya.\" Maka Ibn Amir menenangkan suaminya, dan ia menceraikannya. {cite:muwatta-maruf-1997 p.139}"
