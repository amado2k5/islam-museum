label: { ar: "الموطأ 1804 — يحيى عن مالك عن ابن شهاب: أن عبد الله بن عامر أهدى لعثمان بن عفان جارية لها زوج، ابتاعها بالبصرة، فقال عثمان: لا أقربها حتى يفارقها زوجها، فأرضى ابن عامر زوجها ففارقها", en: "Muwatta 1804" }
summary:
