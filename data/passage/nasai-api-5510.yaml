label: { ar: "سنن النسائي 5510 — من أطاع الله ورسوله", en: "Sunan al-Nasa'i 5510 — whoever obeys God and His Messenger", ur: "سنن نسائی 5510 — جس نے اللہ اور اس کے رسول کی اطاعت کی", fr: "Sunan al-Nasa'i 5510 — celui qui obéit à Dieu et à Son Messager", es: "Sunan al-Nasa'i 5510 — quien obedece a Dios y a Su Mensajero" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ بَشَّارٍ، عَنْ مُحَمَّدٍ، وَذَكَرَ، كَلِمَةً مَعْنَاهَا حَدَّثَنَا شُعْبَةُ، عَنْ يَعْلَى بْنِ عَطَاءٍ، قَالَ سَمِعْتُ أَبَا عَلْقَمَةَ الْهَاشِمِيَّ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنْ أَطَاعَنِي فَقَدْ أَطَاعَ اللَّهَ وَمَنْ عَصَانِي فَقَدْ عَصَى اللَّهَ \". وَكَانَ يَتَعَوَّذُ مِنْ عَذَابِ الْقَبْرِ وَعَذَابِ جَهَنَّمَ وَفِتْنَةِ الأَحْيَاءِ وَالأَمْوَاتِ وَفِتْنَةِ الْمَسِيحِ الدَّجَّالِ."
summary:
  ar: "حديث في سنن النسائي، رقم 5510، يرد فيه ذكر من أطاع الله ورسوله. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 5510 (The Book of Seeking Refuge with Allah), whose wording mentions whoever obeys God and His Messenger. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 5510، جس کے الفاظ میں جس نے اللہ اور اس کے رسول کی اطاعت کی کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 5510, dont le texte mentionne celui qui obéit à Dieu et à Son Messager. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 5510, cuyo texto menciona quien obedece a Dios y a Su Mensajero. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
