text: |-
  ⁦(فصل الحاء )⁩
  حامر)
  ٤r٧
  نفى لكم عندانكسار القنا • وقدزدى كل قرن حيس
  وحسست الدايه أحسهاحسا اذا فر جنتها ومنه قول زيدين صوحان حين ارتت يوم الجل
  ادفنونى فى يتاب • ولا تحسواعن زابا .
  أى لا تنفضوه وية ال البرد محسة للكلاً أى انه يحرقه والمحسة أيضالغة فى الحشة وهى الدبر
  والحسة بكسر الميم الفرجون والحواس المشاعر الحس السمع والبصر والشم والذوق واللمس
  ويقال أيضا أصبابتهم حاسة وذلك اذا أضر البرد أوغيره بالمكلاً وحواس الارض خس
  البرد والعردوالريج والجراد والمواشى وسنة حسوس أى شديدة الحمل وحسست ه أحس
  بالكسرأى وقفت ه قال الكميت
  هل من بكى الدارراج أن تس له • أويبكى الدارما. العبرة الحضل
  قال أبو الجرّاح العقيلى مارأيت عقيليا الاحست له وحست له أيضا بالمكر لغة
  حكاها يعقوب ويقال أيضاحست بالخبروأً حست بهأى أيقنت به وربما قالو.
  بالخيروأجسبت به يددلون من السين ياء قال أبوزييد
  خلا أن العتاق من المطابا • جينبه فهن اليه شوس
  وريماقالوا أحست منه-م أحدافألقوا احدى السينين إستثعالا وهو من شواذ التصفيف
  وأبو عبيدة يروى قول أبى زيدأحسن به فهن الممسوم وأصله أحسن وأحست الشى
  وحدت حسه قال الاخفسْ أحبست معناه ظنات ووجدت ومنه قوله تعالى فلها؟حمر
  عيسى منهم المكفر والاتحاس الانقلاع والهات يقال اغدبْ أسنائه قال الراجز
  فى معدن الملل الكريم الكوس * ليس بمقلوع ولامنحس
  وتحست من الذى أى تخيرت :بره وحت اللحهم وححته ؟منى إذا بعلته على الجر
  ومنه جراد مجسوس إذامته النارأ وقتلته وحشت الباراذارددتها بالمصاعلى خيز
  الله أوالشواء من تواحيه لينضج ومن كلامهم قالت الخبرة لولا الحس ما باليت بالدس وربما
  سموا الرجل الجواد حسجاسا قال اراجز فحبة الابرام للسيماس وينو الحسصاص
  قوم من العرب والحساس بالضم الهف وهو ممل صغار يحفف وأماقول الراجز
  رب شريب لات ذى حساس • شراية كالخز بالمواسي
  قيشال هو سوه انخلق وقال النتراء هو الشوم جكاء عسه سلة وقوله م ضريد قاقال حسر
  يا هذاية تح أوه وكسر آخره كلمة يقولها الانسان إذا أصابه عفلة مامضه وأحرقه كابهرة
  وقولهم انت يه من جسك وبسك أي. بن حيث شتت ويقال بات فلأن بحة سوه أى بحال
  سو وحسإن اسم رحل ان جعلته فعلان من الحمر لم تجره وان جعلة مفعالا من الجن
  أجرته لان النون حسنتدا صلية. (حفصر ابن السكيت يقال لارجل إذا كان قصير اغليظا
  حيفس مثالٍ هز برورجل جفيساً مهموز غير عمدود مشل حقيشأً على فعيلل وهوالقصير
  السمين عن الاصمعى ⁦(حلس)⁩ الحلسر للبعيد وهو كسامرقيق يكون تحت البردعة
  وحكى أبو عبيد حلس وحلس مثل شبه وشبه ومثل ومثل وأحلاس البيوت مأيبسط تحت
  لحرمن التياب وفى الحسديث كن حلسى بيتك أى لا تبرح وأم حلم كثبة الاتان والحلير
