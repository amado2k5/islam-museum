label: { ar: "الموطأ 792 — عمر وعثمان يصليان المغرب حين ينظران الليل الأسود قبل أن يفطرا، ثم يفطران بعد الصلاة في رمضان", en: "Muwatta 792", es: "Muwatta 792", fr: "Muwatta 792", ur: "موطا 792", tr: "Al-Muwatta 792 — Ömer ve Osman, gece karanlığını gördüklerinde oruçlarını açmadan önce akşam namazını kılarlar, Ramazan ayında ise namazdan sonra oruçlarını açarlar.", id: "Al-Muwatta 792 — Umar dan Utsman melaksanakan salat Maghrib ketika mereka melihat kegelapan malam sebelum mereka berbuka puasa, kemudian mereka berbuka puasa setelah salat Maghrib di bulan Ramadan." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن، أن عمر بن الخطاب وعثمان بن عفان كانا يصليان المغرب حين ينظران إلى الليل الأسود قبل أن يفطرا، ثم يفطران بعد الصلاة، وذلك في رمضان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي والتنيسي عند البخاري (1957)، وأن عبد الرزاق (7588) رواه عن معمر عن الزهري. {cite:muwatta-maruf-1997 p.389} {cite:muwatta-maruf-1997 p.390}"
  tr: "Malik, İbn Şihab'dan, o da Humaid ibn Abdülrahman'dan rivayet ettiğine göre, Ömer ibn el-Hattab ve Osman ibn Affan, gece karanlığını gördüklerinde oruçlarını açmadan önce akşam namazını kılarlar, namazdan sonra da oruçlarını açarlardı. Bu durum Ramazan ayında yaşanmıştır. Araştırmacı, bu rivayetin Buhari'de (1957) Ebu Musab, Suveyd, el-Ka'nebi ve el-Tunisi tarafından Malik'ten rivayet edildiğini ve Abdülrazzak'ın (7588) bunu Ma'mar'dan, o da el-Zuhri'den rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.389} {cite:muwatta-maruf-1997 s.390}"
  id: "Malik meriwayatkannya dari Ibn Shihab, dari Humaid ibn Abd al-Rahman, bahwa Umar ibn al-Khattab dan Uthman ibn Affan biasa mengerjakan salat Maghrib ketika mereka melihat kegelapan malam sebelum berbuka puasa, dan kemudian mereka berbuka puasa setelah salat, dan ini terjadi pada bulan Ramadan. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Musab, Suwaid, al-Qa'nabi, dan al-Tunisi dalam Bukhari (1957), dan bahwa Abd al-Razzaq (7588) meriwayatkannya dari Ma'mar, dari al-Zuhri. {cite:muwatta-maruf-1997 p.389} {cite:muwatta-maruf-1997 p.390}"
