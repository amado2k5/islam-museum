label: { ar: "الموطأ 792 — عمر وعثمان يصليان المغرب حين ينظران الليل الأسود قبل أن يفطرا، ثم يفطران بعد الصلاة في رمضان", en: "Muwatta 792" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن، أن عمر بن الخطاب وعثمان بن عفان كانا يصليان المغرب حين ينظران إلى الليل الأسود قبل أن يفطرا، ثم يفطران بعد الصلاة، وذلك في رمضان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي والتنيسي عند البخاري (1957)، وأن عبد الرزاق (7588) رواه عن معمر عن الزهري. {cite:muwatta-maruf-1997 p.389} {cite:muwatta-maruf-1997 p.390}"
