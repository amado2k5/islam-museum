summary:
  ar: "القسم 36 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزهد عن رسول الله»، ويضم فيها النصوص من 2304 إلى 2414 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 36 of Jami' al-Tirmidhi (Chapters On Zuhd) in the division of the open hadith dataset the museum took its reports from: reports 2304 to 2414 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 36، عنوان «کتاب الزہد عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2304 تا 2414۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 36 de Jami' al-Tirmidhi (Capítulos sobre el Zuhd) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2304 al 2414 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
