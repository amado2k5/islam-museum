text: "وأَهْلُ الكتاب فلما وَلَّى وَجْهَ، قِبل البيت أنكروا ذلك. وقال المنافقون : خَرَّ محمد إلى أَرضه. وقال المشركون : أَراد محمد أَن يجعلنا قِبْلَةً له ووسيلة، وعرف أَن ديننا أَهْدَى من دينه، ويوشك أَن يكون على ديننا. وقال اليهود للمؤمنين …"
