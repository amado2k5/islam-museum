text: "… أنَّ الشَّارع رَخَّص للأُمَّة التَّلاوة علىٰ سبعة أحرف، ثمَّ لمَّا رأى الإمام أمير المؤمنين عثمان بن عفان مهيه اختلاف النَّاس في القراءة، وخاف مِن تَفَرُّق كلمتهم جَمَعَهُم علىٰ حرفٍ واحد، وهو هذا المصحف الإمام، قال: واستوثقت له الأمة علىٰ ذلك …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 164، يذكر الأحرف السبعة، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 164, that mentions the seven ahruf, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 164 کا اقتباس جس میں سبعہ احرف، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 1, pág. 164, que menciona los siete ahruf, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Tafsir d'Ibn Kathir (tome 1, p. 164) mentionnant les sept ahruf, le recueil du Coran et les codex, ainsi que l'orthographe du mushaf. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 164. sayfasından, Kur'an'ın yedi okunuş şeklini, derlenmesini ve el yazmalarını, ayrıca Kur'an'ın yazısını ele alan bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Tafsir Ibn Kathir, Jilid 1, halaman 164, yang membahas tujuh cara pembacaan, penyusunan Al-Quran dan manuskripnya, serta aksara Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam pembacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
