text: "… قيل فيقولون. واذا لم يقل اهم لا ينطقون ولا هم يعتذرون. نثنى بعد حمدك يامن لا موجود على الحقيقة سواه بالصلاة والسلام على نبيك الذى هو الواسطة العظمى فى تبليغ شرعك لمن كلفته به وجعلت من الواجب علينا ان لا …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 6، يرد فيه ذكر الواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 1, p. 6, whose wording mentions the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 6 کا اقتباس جس میں واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de Damascus de Ibn 'Asakir, volume numérisé 1, p. 6, dont le texte mentionne l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de Damascus de Ibn 'Asakir, volumen digitalizado 1, p. 6, cuyo texto menciona lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Asakir'in Resimli Şam Tarihi'nin 1. cildinin 6. sayfasından bir alıntı, farz olan amellerden bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 1 Bergambar, halaman 6, menyebutkan amalan-amalan wajib; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan-amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
