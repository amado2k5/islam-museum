text: "… فيه رأس جمل أعطته زوجتُهُ حريراً مَفْتُولاً ليبيعه في السوق، فأراد أهل الطمع أن يبتاعوه بثمنٍ بخسٍ، فعمدوا إلى الحيلة. وأدرك جحا غايتهم، فقال في نفسه ما داموا كذلك فإنه يجدرُ بي أن أُقابِلَهُم على عملهم بنوعه. ثم أخذ رأس …"
summary:
  ar: "أعطت زوجة جحا حريراً ليبيعه، فعرض مشترون طامعون ثمناً زهيداً، فلف جحا رأس جمل في الحرير وباعه، فلما وجد المشتري الرأس اشتكى، فقال جحا إنه أخبره أن فيه رأس جمل، فاشتراه كما هو. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  en: "Juha's wife gives him silk to sell; greedy buyers offer a low price; Juha wraps a camel's head in the silk and sells it; the buyer finds the head and complains; Juha says he told him there is a camel's head in it, so the buyer bought it as it was. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  ur: "جحا کی بیوی نے اسے بیچنے کے لیے ریشم دیا، لالچی خریداروں نے بہت کم قیمت لگائی، تو جحا نے ریشم میں ایک اونٹ کا سر لپیٹ کر بیچ دیا، خریدار کو سر ملا تو اس نے شکایت کی، جحا نے کہا کہ اس نے اسے بتا دیا تھا کہ اس میں اونٹ کا سر ہے، لہٰذا اس نے اسے جیسا تھا ویسا ہی خریدا۔ {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  fr: "La femme de Juha lui donne de la soie à vendre ; des acheteurs cupides en offrent un prix dérisoire ; Juha enveloppe une tête de chameau dans la soie et la vend ; l'acheteur trouve la tête et se plaint ; Juha dit qu'il l'avait prévenu qu'il y avait une tête de chameau dedans, et que l'acheteur l'a donc achetée telle quelle. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
  es: "La esposa de Juha le da seda para vender; unos compradores codiciosos ofrecen un precio bajo; Juha envuelve una cabeza de camello en la seda y la vende; el comprador encuentra la cabeza y se queja; Juha dice que le avisó de que había una cabeza de camello dentro, así que el comprador la compró tal como estaba. {cite:juha-nawadir-kubra-djuwaydi p. 149}"
