text: "… فهما كان ذلك فيتفكر فى بعلنه أنه إما يمصى اللّٰه تعالى فيه بالأكل والشرب، إما بكثرة الأكل من الحلال، فإن ذلك مكروه عند الله، ومقوّ للشهوة التى هي سلاح الشيطان عدوّ اللٰه، وإما بأكل الحرام أو الشبهة، فينظر من أين …"
