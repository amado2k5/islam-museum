text: |-
  •⁦(لوى)⁩،:
  ٥٤٥
  اليه المودّة ربالمودّة وألقيت عليه ألقيسة كفولك ألقيت عليه أحجية كل ذلك يقال والتقوا
  وتلاق وابعنى واستلق على قفاه وتلقاه أى استقبله وقوله تعالى اذ تلقونه بألسنتكم أى يأخذه
  عض عن بعض وجلم ثلقاءه أى حذاءه والتلقاء أيضامصدر مثل اللقاء وقال
  أقلت خيرك هل تأتى مواعده • قاليوم قصر عن تلقائه الإمل
  واللقى بالفتح الشىء الملقى لهوانه وجعه ألقاء وقال • وكنت لقى تجرى عليك السوائل » وشقّ
  اقىّ٦باع له واللاقوة داء في الوجه بقال منه افى الرجل فهوملة وواللقوة أيضا الناقة السريعة
  اللقاح وفى المثل لتوة صادفت قبيسا أى ضادفت فى لا سريع الالقاح واللقوة العقاب الانى
  واللقوة بالكسر مثله قال أبو عبيدة -ميت لقولسعة أشدافها كى لكى به لكى أولع
  به قال روبة +والملغ يلكى بالسكلام الاملغ * ولكيت بفلان لازمتهى اللعى سمرة
  ف الثفة تستحسن ورجل ألمى وجارية لياء بينة اللمى وظلّ ألمى كنيب أسودوشجبر ألمى
  الظلال من الخضرة وقال
  انى شجراً لى الظلال كانه * رواهب أحر من الشراب عذوب
  والتى لونه مثل التمع وربماهمز ولمة الرجل تربه وشكله والهاءعوض وفى الحديث ايتزقج
  الرجل لمته واللمة الاصحاب مابين الثلاثة الى العشرة ⁦(لوى)⁩ لويت الجبسل فتلقه ولوى
  الرحل رأسه وألوى برأسه أمال وأعرض وقوله تعالى وان نلووا أوتعرضوابوا وين قال ابن
  عباس رضى اللّٰه عنهما هو القاضى يكون ليه واعراضه لاحد الخصمين على الاخروة د قرئ
  بواوواحدة مضمومة اللام من وليت قال مجماهد أى ان تلوا الشهادة فتقيموها أوتعرضوا
  عنها فتتركوها ولوت الناقسة ذنيها وألوت بذنبها اذا حركنه الباء مع الالف فيها ولواه بدينه
  ليافا أى مطله قال ذوالرمّة
  تريدين ليانى وأنت ملبئة• وأحدر ياذات الوشاح التقاضا
  ولوّيت أعماق الرجال فى الظصومة شدد للكثرة والمبالغة قال تعالى اوّوارؤسهم والتوى
  وتلوى بعنى ولويته عليه أى آثرته عليه وقال
  ولم يكر ملك لاة وم ينزلهم • الاصلاصل لا تلوى على حسب
  أى لا يؤز بها أحد لخسبه للشدة التى هم فيها ويروى لا تلوى أى لا تعطف أصحابهاعلى ذوى
  الاحساب من قواهم لوى عليه أى عطف بل تقسم بالمناصفة على السوية ولوى الرمل
  مقصور متعطفه وهو الجدد بعد الرملة وألوى القوم صاروا الى لوى الرمل يقال ألو يتم
  فانزلوا وه-الويان والجمع الالوية وذنب ألوى معطوف خلقة مثل ذنب العنز ولواء الامير
  مدود وقال
  غداة تسايات من كل أوب • كائب عاقدين لهم لوايا
  وهى اغة لبعض العرب تقول احتميت احتمايا والالوية المطارد وهى دون الاعلام والبنود
  واللوى بالفتح وجع فى الجوف تقولمنه لوى بالكسر واللوى على فعيل ما ذبل من البقل
  وقد ألوى البقل أى ذبل واللوية ماخبأته لغيرك من الطعام وقال
  قلت لذات النقية النقيه • قومى ففد ينا من اللويه
  وقد التوت المرأة لوية وألوى فلان محتى أى ذهب به وألوى بثوبداذ المع به وأشار وألوت به
  ١٢٧
  ماح
