text: "… أَنس قال : نم مت رسول اللّٰه يقول : ألا إن اللّٰه قد جعل لكل ذي جق حقه ألا لا وصية لوارث، وعن أبي هريرة أن رسول اللّٰه بعث خيلاً قبل نجد مجاءت برجل من بني حنيفة يقال له ثمامة …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 176، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 3, p. 176, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 3، ص 176 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 3, pág. 176, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Tarikh Dimashq d'Ibn 'Asakir (tome 3, p. 176) mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il est répertorié dans le Navigateur de Testaments."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 3, sayfa 176'dan bir alıntı, bir vasiyetname veya son mirastan ve geride bıraktığı miras ve vasiyetten bahsetmektedir; makineyle okunabilir tıpkıbasım baskısından alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 3 Bergambar, halaman 176, menyebutkan sebuah surat wasiat atau testamen terakhir, dan apa yang ditinggalkan sebagai warisan dan harta pusaka; dari edisi faksimili yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh Peramban Surat Wasiat, Warisan, Barang Antik, dan Tempat Suci."
