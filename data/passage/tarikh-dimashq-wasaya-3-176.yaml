text: "… أَنس قال : نم مت رسول اللّٰه يقول : ألا إن اللّٰه قد جعل لكل ذي جق حقه ألا لا وصية لوارث، وعن أبي هريرة أن رسول اللّٰه بعث خيلاً قبل نجد مجاءت برجل من بني حنيفة يقال له ثمامة …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 176، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 3, p. 176, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 3، ص 176 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
