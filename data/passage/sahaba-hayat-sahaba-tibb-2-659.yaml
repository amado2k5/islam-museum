text: "… امرأة من بنى غفار معه أمرأة و قصة عنزتها. ملاحظة : الفهارس والاعدراكات فى آخر الكتاب. كط الصفحة الموضوع ? خروج ام حرام بنت ملحان خالة انس. خدمة النساء فى الجهاد خروج النساء مع النبى لسقى المرضى وتداوى الجرحى. خروج …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 659، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 2, p. 659, that mentions illness and the sick, the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 2، ص 659 کا اقتباس جس میں بیماری اور بیمار، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen escaneado 2, pág. 659, que menciona la enfermedad y los enfermos, el tratamiento de las heridas, las mujeres que atienden a los heridos y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 2 scanné, p. 659, qui mentionne la maladie et les malades, le traitement des blessures, les femmes soignant les blessés, la recherche de soins; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Kandhlawi'nin \"Sahabelerin Hayatları\" adlı eserinin resimli 2. cildinin 659. sayfasında hastalık ve hastalar, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedavi konularına değinilmektedir; bu metin, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari “Kehidupan Para Sahabat” karya Kandhlawi, jilid bergambar 2, hlm. 659, menyebutkan penyakit dan orang sakit, pengobatan luka, wanita yang merawat orang terluka, dan perawatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
