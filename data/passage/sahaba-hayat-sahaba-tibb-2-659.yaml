text: "… امرأة من بنى غفار معه أمرأة و قصة عنزتها. ملاحظة : الفهارس والاعدراكات فى آخر الكتاب. كط الصفحة الموضوع ? خروج ام حرام بنت ملحان خالة انس. خدمة النساء فى الجهاد خروج النساء مع النبى لسقى المرضى وتداوى الجرحى. خروج …"
