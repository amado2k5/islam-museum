label: { ar: "الموطأ 1231 — عبد الرحمن بن القاسم عن أبيه عن عائشة: حاضت صفية، فقال النبي أحابستنا هي؟ فقيل قد أفاضت، فقال فلا إذا", en: "Muwatta 1231", es: "Muwatta 1231", fr: "Muwatta 1231", ur: "موطا 1231", tr: "El-Muvatta 1231 — Abdülrahman ibn el-Kâsım, babasından, o da Aişe'den rivayetle: Safiyye adet gördü. Peygamberimiz şöyle buyurdu: \"Bizi geciktirecek mi?\" \"Adet dönemi bitti\" denildi. Peygamberimiz şöyle buyurdu: \"Öyleyse hayır.\"", id: "Al-Muwatta 1231 — Abd al-Rahman ibn al-Qasim, berdasarkan riwayat ayahnya, dari Aisyah: Safiyya sedang haid, lalu Nabi bersabda, “Apakah dia akan menunda kita?” Dijawab, “Dia telah menyelesaikan masa haidnya.” Beliau bersabda, “Kalau begitu tidak.”" }
text: "فَلا إذًا"
summary:
  ar: "يروي مالك عن عبد الرحمن بن القاسم عن أبيه عن عائشة أن صفية بنت حيي حاضت، فذكرت ذلك للنبي، فقال أحابستنا هي؟ فقيل له إنها قد أفاضت، فقال فلا إذا. {cite:muwatta-maruf-1997 p.550}"
  tr: "Malik, Abdülrahman ibn el-Kâsım'dan, o da babasından, o da Aişe'den rivayet ettiğine göre, Safiyye bint Huyayy adet gördü ve bunu Peygamberimize bildirdi. Peygamberimiz, \"Bizi alıkoyacak mı?\" diye sordu. Ona, \"O zaten Tavafü'l-İfade'yi yaptı\" denildi. Bunun üzerine Peygamberimiz, \"Öyleyse hayır\" dedi. {cite:muwatta-maruf-1997 s.550}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn al-Qasim, dari ayahnya, dari Aisyah, bahwa Safiyya binti Huyayy mengalami haid, dan dia menceritakan hal ini kepada Nabi, yang kemudian bertanya, \"Apakah dia akan menahan kita?\" Kemudian dikatakan kepadanya, \"Dia telah melaksanakan Tawaf al-Ifadah,\" lalu beliau menjawab, \"Kalau begitu tidak.\" {cite:muwatta-maruf-1997 p.550}"
