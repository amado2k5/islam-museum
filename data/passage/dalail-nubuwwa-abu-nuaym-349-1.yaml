text: "محمد رسول الله النبي الأمي إلى كسرى عظيم فارس، سلام على من اتبع الهدى وآمن بالله ورسوله وشهد أن لا إله إلا الله وحده لا شريك له وأن محمدا عبده ورسوله، أدعوك بدعاية الله. فإني أنا رسول الله إلى الناس كافة لأنذر"
