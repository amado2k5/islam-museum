label: { ar: "صحيح البخاري 4209 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4209 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4209 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 4209 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 4209 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، حَدَّثَنَا حَاتِمٌ، عَنْ يَزِيدَ بْنِ أَبِي عُبَيْدٍ، عَنْ سَلَمَةَ، قَالَ كَانَ عَلِيٌّ ـ تَخَلَّفَ عَنِ النَّبِيِّ فِي خَيْبَرَ، وَكَانَ رَمِدًا فَقَالَ أَنَا أَتَخَلَّفُ عَنِ النَّبِيِّ فَلَحِقَ، فَلَمَّا بِتْنَا اللَّيْلَةَ الَّتِي فُتِحَتْ قَالَ \" لأُعْطِيَنَّ الرَّايَةَ غَدًا ـ أَوْ لَيَأْخُذَنَّ الرَّايَةَ غَدًا ـ رَجُلٌ يُحِبُّهُ اللَّهُ وَرَسُولُهُ، يُفْتَحُ عَلَيْهِ \". فَنَحْنُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4209، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4209 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4209، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4209 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 4209 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
