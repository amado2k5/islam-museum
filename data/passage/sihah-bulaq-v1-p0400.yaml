text: |-
  ⁦(فصل الطاء)⁩
  ٢٤١
  واغمايبن الوزن الاكثر من الاقلى والصاد الصفروالتجاس قال حسان
  رأيت قدور الصاد حول يوتنا * قنابل ده_ما فى المباءة صيما
  والصادى منسوب اليه والصيدان بالفتخ برام الجارة قال أبوذؤيب
  وسود من الصيدان فيها مذانب * فضاراذالم نستفدها نعارها
  وأما اجارة التى تعمل منها القدور فهى الصيداء بالمد والصيد الارض الغليظة وصحيدا
  اسم بلد وينو الصيداء بطن من بن أسد قال ابن السكيت الصيدانة الغول قال والصيدانة
  من النساء السيئة الخلق الكثيرة الكلام
  صل الفسا ( أد لضؤَد والضوْدة الزكلم وقد ضد الرجل ضوْادا فهو مضوْود
  وأضأده اللّه أى أزكم وحكى أبوزيد ضأدت الرجل ضأدا اذا خصمته ⁦(ضدد)⁩ الضد
  واحد الاضداد والضديد صثله وقديكون الضتجاعة قال تعالى ويكونون عليهم ضدًا
  وقد ضاده وهما متضادّان ويقال لاضقله ولا ضديدله أى لا تطيرله ولاكفوله والضدّه
  بالفتح الملعن أبى عمرد يقال ضدّ الربة يضدها أى ملاها وأضد الرجل غضب
  ⁦(ضرغد)⁩ ضر غد جبل قال الشاعر
  فلا بغينكم قنا وعوارضا • ولاقبلن الخيل لاية ضرغد
  ويقال مقيرة تصرفمن الأول ولاتصرف من الثانى ( فند الضفندد الضخم
  الاحق وهو ملق با* اسى شكرير آخره ⁦(ضمد)⁩ ضمد الجرح يضمده ضهدا بالاسكان
  ى شده بالضعادوهى العصابة وربما قالواضغده بالعصاضريه بهاعلى الرامن وافاعلى ضمادة
  الم أى أشرت علي وال المداحاة والضد الب والبس يال شع ابل
  هد الارض والضمد خيار الغم ورذالها يقول الرجل للغريم أقضيك من ضمدهذه الغسم
  والضمد أن تتخذ المرأة خليلين قال أبوذويب
  تريدين كيما تضمدين وخالدا • وهل يجمع السيفان ويصلك فى عمد
  والضمد بالتحريك الحقد تقول ضمد عليه بالكسر يضهد ضهدا أى أحن عليه قال النابفة
  ومن عص التفعاقبه معاقبة • تنهى الظلوم ولا تقعد على ضعد
  والضمد أيضا الغابر من الحق يقال لنا عند فلان ضد أى عابرحق من معقلة أودين واضم
  العرفج اذا تجوفته الخوصة وذلك قبل أن يظهر وكانت فى جوفه وضمد ذلان رأسه
  تضميدا أى شده بعصابة أرنوب ما خلا العسمامة وقد ضمدته فتضمد هد ضهدته
  فهو مضهود ومضطهد أى مقهور مضطر وفلان ضهدة اكل أحد أى كل من شاء
  أن يقهرم فعل
  صل الطاء رد الطرد الابعاد وكذلك الطرد بالتحريك تقول طردته فذهب
  ولا يقال منه انفعل ولا افتعل الافى لغة رديئة والرجل مطر ودوطريد ومرفلان يطردهم
  أى يشله-م ويكسؤهم وطردت الإإل طردا وطردا أى ضممتها من نواحيها وأطردتها أى
  أمرت بطردها وف لان أطرده السلطان أى أمر باخراحمه عن بلده قال أبن السكيد
  أطردته إذا صيرته طريدا وطردته اذا نفيتععك وقلت له اذهب عما وبقال هو طريده للذى
  صداح
  قوله الضودة والضؤدة ضبطهما
  عاصم بضم الضاد وسكون
  الهمزة وضبطهما الوانى بضعتين
  أكمع المد اه أقول ولامانع
  من مصة الضبطين قاله نصر
