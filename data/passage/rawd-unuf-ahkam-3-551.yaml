text: "… والليثُ وأبو يُومُفَ وسلم - بفرس وذهب مالك والأوْزَاعِيُّ إلى كَرَاهَةٍ ذلك، وقد رُوِى من مارق خالد بن. الويد أنه عليه اللام مهى عن أَلِ وِمِ الْحُمُرِ الأَهْلِيَّة والدفالِ والعليل، وقد خرّجَه أبو دَاوُود، وحديث لإباحة أصَّحُ غيرَ أن مالكا …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 551، يرد فيه ذكر المباح، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 551, whose wording mentions the permitted (mubah), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 551 کا اقتباس جس میں مباح، کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Rawd al-Unuf de al-Suhayli, volume numérisé 3, p. 551, dont le texte mentionne le permis (mubah), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Rawd al-Unuf de al-Suhayli, volumen digitalizado 3, p. 551, cuyo texto menciona lo permitido (mubah), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Suhayli'nin \"El-Ravd El-Unuf\" adlı eserinin resimli 3. cildinin 551. sayfasından, helal ve haram fiilleri sıralayan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, haram fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Al-Rawd Al-Unuf karya Al-Suhayli, jilid bergambar 3, halaman 551, yang menyebutkan amalan yang diperbolehkan dan yang tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
