text: "… بلبل عادي دخل بستاناً وصعِدَ شجرة مشمش، ثم وقف يأكل منها فجاء صاحب البستان، فلما رآه صاح به: ماذا تفعل هنا؟ فقال: أنا بلبل أغرد. فقال البستاني : غرِّدْ لِنسمعَ. فأخذ الشيخ يصفّر مقلّداً البلبل، فضحك الرجل وقال: أهكذا تغرد …"
summary:
  ar: "صعد جحا شجرة مشمش وقال إنه بلبل، فطلب منه البستاني أن يغني، فصفّر وقال إن البلبل العادي لا يغني أفضل من ذلك. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  en: "Juha climbs an apricot tree and says he is a nightingale; the gardener asks for a song; he whistles, and says that an ordinary nightingale sings no better. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  ur: "جحا ایک خوبانی کے درخت پر چڑھ گیا اور کہا کہ میں بلبل ہوں؛ باغبان نے گانے کو کہا تو اس نے سیٹی بجائی اور کہا کہ ایک عام بلبل اس سے بہتر نہیں گاتی۔ {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  fr: "Juha grimpe dans un abricotier et dit qu'il est un rossignol ; le jardinier lui demande une chanson ; il siffle et dit qu'un rossignol ordinaire ne chante pas mieux. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  es: "Juha trepa a un albaricoquero y dice que es un ruiseñor; el jardinero le pide una canción; silba y dice que un ruiseñor corriente no canta mejor. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
  tr: "Juha bir kayısı ağacına tırmandı ve kendini bülbül ilan etti. Bahçıvan ondan şarkı söylemesini istedi, ancak o ıslık çaldı ve sıradan bir bülbülün bile daha iyi şarkı söyleyemeyeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 45}"
  id: "Juha memanjat pohon aprikot dan menyatakan dirinya sebagai burung bulbul. Tukang kebun memintanya untuk bernyanyi, tetapi dia bersiul dan berkata bahwa bahkan burung bulbul biasa pun tidak bisa bernyanyi lebih baik. {cite:juha-nawadir-kubra-djuwaydi p. 45}"
