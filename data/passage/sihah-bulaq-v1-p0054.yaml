text: |-
  ٠٨٧
  سلامة بن جندل يصف فرسا
  يرقى الدسيع الى هادله تلع • فى جؤجو كدال الطيب مخضوب
  ( دعع دععته ادعه دعا أى دفعته ومنه قوله تعالى فذلك الذى يدع اليتيم والدعدعة
  تحريك المكمال ونحوه ايسعه الشئ ودعدعت الشئملاته وحفنة مدعدعة أى عملوءة
  قال ابيديصف ماءين التقيا من السيل
  فدعد عاسرة الركاءكم • دعدع ساقى الاعاجم الغربا
  قال أبوز يد يقال للمعز خاصة دعدعت بمادعدعة اذادء وتهاقال والدعدعة ان تقول
  للعائردع دع أى قم فاتتعش كما يقال لعا وأنشد
  لما اللّه قومالم ية ولو العائر • ولالا بن عم ناله الدهردع دعا
  شيشا ودفعت الرجل فاندفع واندفع الفرس أى أسرع فى سيره وانددهوا فى الحديث والمدافعة
  المماطلة ودافع عنه ودفع بعنى تقول منه دافع اللّٰه عنك السودقاعا واستدفعت اللّه
  الاسواء أى طلبت منه أن يدفعها عنى وتدافع لقوم أى دفع بعضه-م بعضا والدفعة من
  المطر وغيره بالضم مثل الدفقة والدفعة بالفتح المرة الواحدة والمدفع بالتشديد الفقير والذليل
  لان كلايدفعه عن نفسه والدافع الشاة أُو الناقة التى تدفع الليأفى ضرعها قبيل النتاج يقال
  دفعت الشاة اذا أضرعت على رأس الولد والمدفسع واحد مدافع المياه التى تجرى فيها
  والمدفع بالكسر الدفوع ومنه قوله الابل قصير مدفع والدفاع بالضم والتشديد السيل
  العظيم ⁦(دقع )⁩ الدقعاء التراب يقال دقع الرجل بالكسرأى اصق بالتراب ذلا والدقع
  سوءاحتمال الفقر وفى الحديث اذاجعتنّ دقعتنّ أى خضعتن" وزقتن بالتراب والدقعم
  بالتكسر الدقماء والميم زائدة كما قالو اللدرداء دردم وفقر مدقع أى ملصق بالدقعاء والمداقييع
  من الابل التى تأكل النيت-ق تلصقه بالارض لقلته والداقع الذى يطلب مداق
  الكسب وقواهم فى الدعاءرماه اللّٰه بالدوقعة هى الفقر والذل وجوع ديقوع أى شديد
  قال اعرابى جوع تصتع منه الرأس ديقوع ٣) كع د كاع بالضم داء:أخذالابل
  وانظيل فى صدورها وقددكع يدكع قال القطامى
  ترى منه صدور انخيل زورا • كأن بهانهازا أودكاعا
  ( داع داع الرجل لسانه فاندلع أى أخرحه فخرج ودلع اسانه أى خرج يتعدى ولا يتعدّى
  وقال ابن الاعرابى يقال أيضا أدلع لسانه أى أخر به وانداع بطن الرجل اذاخرج أمامه
  مع الدمع دمع العين والدمعة القطرة منه ودمعت العين تدمع دمساود سعت بالكسم
  دمعالغة -كاها أبو عبيدة وامرأة دمعة سريعة الدمعة والدامعة من الشجاج بعد
  الدامية قال أبو عبيد الدامية هى التى تدمى من غير أن يسيل منهادم فاذاسال منهادم فهى
  الدامعة بالعين غير معجمة والمدامع الماقى وهى اطراف العين والدماع بالضم ماء العيز من
  علة أو كيرايس الدمع وقال الراجز
  يا من اعين لاتنه-ماعا قد ترك الدمع بهادماعا
  جود بدل جوع وهو بعنام
  فاله نص
