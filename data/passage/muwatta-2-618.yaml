text: "لا يصلي الرجل على الجنازة إلا وهو طاهر"
summary:
  ar: "يرويه مالك عن نافع، أن عبد الله بن عمر كان يقول: لا يصلي الرجل على الجنازة إلا وهو طاهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (316). {cite:muwatta-maruf-1997 p.316}"
  tr: "Malik, Nafi’den rivayetle Abdullah ibn Umar’ın şöyle dediğini aktarmıştır: “Bir kimse, ritüel temizliğinde olmadıkça ölü bir kişi için namaz kılmamalıdır.” Araştırmacı, bunun Malik’ten rivayetle Ebu Mus’ab, Suwaid ve Muhammed ibn al-Hasan al-Şeybani (316) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.316}"
  id: "Malik meriwayatkannya dari Nafi’, bahwa Abdullah ibn Umar biasa berkata: “Seseorang tidak boleh mendoakan orang yang telah meninggal kecuali jika ia dalam keadaan suci secara ritual.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan al-Shaybani (316). {cite:muwatta-maruf-1997 p.316}"
