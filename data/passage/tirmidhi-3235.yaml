label:
  ar: "الترمذي 3235 — يا محمد هل تدري فيم يختصم الملأ الأعلى"
  en: "Tirmidhi 3235 — O Muhammad, do you know what the Highest Assembly disputes about"
  ur: "ترمذی 3235 — یا محمدکا کیا تم جانتے ہو کہ ملائے اعلیٰ کن امور میں جھگڑتا ہے"
  es: "Tirmidhi 3235 — Oh Muhammad, ¿sabes de qué se disputa la Asamblea Suprema?"
  fr: "Tirmidhi 3235 — Ô Muhammad, sais-tu de quoi se dispute l'Assemblée suprême ?"
  tr: "Tirmizi 3235 — Ey Muhammed, en yüksek meclisin ne hakkında ihtilafa düştüğünü biliyor musun?"
  id: "Tirmidzi 3235 — Wahai Muhammad, tahukah engkau tentang apa yang diperdebatkan oleh majelis tertinggi?"
text: "إني نعست فاستثقلت نوما فرأيت ربي في أحسن صورة فقال فيم يختصم الملأ الأعلى …"
summary:
  ar: "حديث قدسي في الترمذي، رقم 3235: يا محمد هل تدري فيم يختصم الملأ الأعلى. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Tirmidhi, no. 3235: O Muhammad, do you know what the Highest Assembly disputes about. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ترمذی میں حدیثِ قدسی، نمبر 3235: یا محمدکا کیا تم جانتے ہو کہ ملائے اعلیٰ کن امور میں جھگڑتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Tirmidhi, n.° 3235: Oh Muhammad, ¿sabes sobre qué discute la Asamblea Suprema? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Tirmidhi, n° 3235: Ô Muhammad, sais-tu ce qui divise la Haute Assemblée ? Le Prophète le rapporte de son Seigneur; le dictionnaire Qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Tirmizi'de 3235 numaralı hadis-i kudsi şöyledir: \"Ey Muhammed, yücelerdeki meleklerin ne hakkında tartıştıklarını biliyor musun?\" Peygamberimiz bunu Rabbinden rivayet eder ve hadis-i kudsiyi inceleyenler, bu rivayeti altı şeriat hadis külliyatında ve Muvatta'da bulacaklardır."
  id: "Sebuah hadits qudsi dalam Tirmidzi, no. 3235: “Wahai Muhammad, tahukah engkau tentang apa yang diperdebatkan oleh para malaikat di atas?” Nabi meriwayatkannya dari Tuhannya, dan mereka yang mempelajari hadits qudsi akan menemukan riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
