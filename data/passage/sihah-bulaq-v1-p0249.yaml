text: |-
  ٣٩٢
  ⁦(باب الرام)⁩
  (كنر
  اضط رارا والقهسة رى الرجوع الى خلف فاذاقات رجعت القهقرى فكأ نك قلت رجعت
  الرجوع الذى يعرف به-ذا الاسم لان القه-قرى ضرب من الرجوع والقهرّ يتشديد الراء
  الحجر الصاب وكان أحدين يحي يقول وحد ه هقار ير القير القاروقيرت السفيتة
  طلبتها بالقاروصانعه قيار وقياراسم جل ضابى بن الحرث وقال
  فن يك أمسى بالمدينة رحله • فانى وقيار به الغريب
  برفع قبار على الموضع
  صل الكاف) كبر لسكبر فى السسن وقد كبر الرجل يكبر كبرا أى أسنّ ومكبرا
  أيضا بكسر الباء ويقال علاه المكبر والاسم الكبرة بالفتح يقال علت فلان كبرة وكبر بالضم
  يكبر أى عظم فهو كبير وكبارفاذا أفرط قيل كبار بالتشديد والسكبر بالكسر العظمة وكذلك
  الكبريا وكبر الشى أيضا معظمه قال اللّٰه أعالى والذى تولى كبره وقال قيس بن الخطيم
  تنام عن كبرشانها فاذا * قامت رويداتكاد تنغرف
  ويقال أيضافلان كبرة ولد أبويه اذا كان آحرهسم وقال ابن السكيت يسستوى فيه الواحد
  دالمع والمؤنث وقال أبو عبيد هو مثل قواهم عجزة ولد أيويه وقولهم هو كبرقومه بالضم أى
  هو أقعدهم فى النسب وفى الحديث الولا للكبروهو أن يموت الرجل ويتركك ايناوا بن ابى
  فالولا• للابن دون ابن الاين ويقال أيضا كبرسياسة الناس فى المال وفلان إكبرة قومه
  بالكسر والراء مشددة أى كبرقومه بستوى فيه الواحد والم-ع والمؤنث والكبر بالتحريك
  الاصف فارسى معرّب والكبرى تأنيت الاكبر والبهع الكبر وبجع الاكبر الاكابر والاكبرون
  ولا يقال كبرلانّ هذه البنية جعلت للصفة خاصة مثل الاجر والاسود وأنت لا تصف بأكبر كما
  تصف بأحر ولا تقول هذارجل أكبرحتى تصله عن أوتدخل عليه الالف واللام والمكبوراء
  الكباروقواه-م نوارتوا المجد كابرا عن كابرأى كبيرا عن كبير فى العز والشرف وأكبرت
  الشئ أى استعظمته وأكبر الصبى أى تغوّط وهو كاية والتكبير التعظيم والتكبر
  والاستكار التعظم والكبريت معروف وقولهم أغز من الكبريت الاجرانماهو كقولهم
  أعز من بيض الانوق وبقال أيضاذهب كبريت أى خالص قال رؤية بن العجاج
  هل يتفعنى كذب سحتيت * أوفضة أوذهب كبريت
  ( كثر الكتربالكسر السنام قال الشاءر
  كتر كحافة كير القين ملوم قال
  الاصهى ولم أسمع السكتر الا فى هذا البيت والكتر بالتحريك مشله قال أبو عبيد يقال هو بناء
  مثل القبة شبه السنام به( كثر لكثرة نتيض القلة ءلا تقسل الكثرة بالسكسر فانهالغة
  رديثة وقد كثر الشئ فهو كثيروقوم كثيروهم كثيرون وأكثر الرجل أى كثرماله ويقسال
  كاثر ناهم فكثرناهم أى غلبناهم بالكثرة ومنه قول الكميت يصف الكلاب والنور
  وعاث فى غابر منها بعنعنة • نحر المكافئ والمكتور يهتبل
  والعثعثة اللين من الارض والمكافئ الذى يذبح شانين احداهما مقابلة الاخرى للعقسقة
  يهقيل يفترص ويحتال واسستكثرت من التى أى أكثرت منه والكثر يالضم من المال
  الكثير ويقال ماله قلّ ولا كثر وأنشد أبوعم روأرجل من ربيعة
  وان
