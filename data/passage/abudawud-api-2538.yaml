label: { ar: "سنن أبي داود 2538 — مضاعفة الأجر", en: "Sunan Abi Dawud 2538 — the reward doubled or multiplied", ur: "سنن ابی داؤد 2538 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… فَقَتَلَهُ فَقَالَ أَصْحَابُ رَسُولِ اللَّهِ فِي ذَلِكَ - وَشَكُّوا فِيهِ - : رَجُلٌ مَاتَ بِسِلاَحِهِ. فَقَالَ رَسُولُ اللَّهِ : \" مَاتَ جَاهِدًا مُجَاهِدًا \". قَالَ ابْنُ شِهَابٍ : ثُمَّ سَأَلْتُ ابْنًا لِسَلَمَةَ بْنِ الأَكْوَعِ فَحَدَّثَنِي عَنْ أَبِيهِ بِمِثْلِ ذَلِكَ، غَيْرَ أَنَّهُ قَالَ فَقَالَ رَسُولُ اللَّهِ : \" كَذَبُوا مَاتَ جَاهِدًا مُجَاهِدًا فَلَهُ أَجْرُهُ مَرَّتَيْنِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2538، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 2538 (Jihad (Kitab Al-Jihad)), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 2538، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
