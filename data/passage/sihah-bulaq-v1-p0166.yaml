text: |-
  ٤٧٥
  خالطته ولابست فلاناء رفت باطنه ومافى فلان مليس أى مستمتسع والتيس عليه الامر أى
  اختلط واشتبه والتلبيس كالتدليس والتخليط شدد للمبالغة ورجل لباس ولا تقل مليس
  حس اللحس باللسان يقبال لحس القصعة بالكسر يلحها لحسا وفى المثل أسرع من
  لحس الكلب أنفه ولحست الاناء لحسة ولحسة عن يعة وب وألحمست الارض أى أنتت
  وقولهسم تركت فلا نابء_لاحس البقروه ومثل قواهم بمباحث البقرأى بالمكان القفر بحيث
  لا يدرى أين هو ويقال بحيث تلحس بقرالو-ش أولادها واللاحوس المشؤوم ⁦(ل س)⁩.
  ادّست البعير تلد يسا أنعلته وكذلك الخف اذا أصلحته برقاع يقال خف ملدس كمايقال
  ثوب ملدم ومردّم واللديس الفاقة المكتنزة اللحم مثسل اللكيك والدخيس والمددس لغسة
  فى الملطس وهوجر ضخم يدق به النوى وربمعاشبه الفعل الشديد الوطء به والجمع الملادس
  ( سمن اللس الاكل يقال لست الداية الكلأ تلسه اس ابالضم اذا نتفته بجهفاتها قال
  زهير يصف وحشا
  ثلاث كاقواس السراء وناشط * قداخضر من لس الغمير جافله
  وألست الارض طلع أوّل نباتهاواسم ذلك النبات اللساس بالضم لان المال تلسه قال
  الراجزفى باقن الرمث وفى اللساس ملطس الملطس والملطاس حجرفخم يدقبه
  النوى مثل اللدم والملدام والجمع الملاطس ابو عمر واللطس الدق والوطء الشديد قال
  حاتم
  وسقيت بالماء المير ولم * أرك ألاطس حأة الحفر
  قال أبو عبيدة معنى ألاطس اتلطخ بها عس للعسلون الشفة اذا كانت تضرب ألى
  السواد قليلا وذلك يستملح بقال شفة لعساء وقتية ونوة لعس وربما قالوانسبات ألعس وذلك
  اذا كثروكثف لانه حينشذيضرب الى السواد واللعوس يتسكين العين الخفيف فى الاكل
  وغيره كانه الشره ومنه قيل لذئب لعوس لقس) اللاقس العباب وقدلقه يلقسه
  اقسا بالضم حكاه أبوز يد واللقس الذى يلقب الناس ويسخر منهم ويفسد بينه-م قال ابن
  السكيت بقال فلان لقس أى شكس عسر واقست نفسى من الشئ تلقس لقسا أى غشت
  وخبنت : س للمس المس باليدوقد لمه يله ويلسه ويكنى به عن الججماع وكذلك
  الملامسة والالتماس الطلب والتلمس التطلب مرّة بعد أخرى والمتلس اسم شاعر ولميس اسم
  جارية واللماسة بالضم الحاجة المقاربة ونهى عن بيع الملامسة وهوأن يقول اذ المست
  المبيع فقدوجب البيع بيننا بكذا ⁦(لوس)⁩ اللوس الذوق ورجل لؤرس على فعول
  يقال مالاس لواسا بالفتح أى ماذاق ذوا قاوقال أبو صاعد المكاابي ماذاق علوسا ولا اؤوسا
  ومالسناعندهم لواسا واللواسة بالضم أقل من اللقعة⁦(لهس)⁩ اللهس اغسة فى اللحس
  أوههة ويقال مالك عندى لهسة بالضم مثل لحسة أى شئ س) ليس كملة نفى وهو
  فعل ماض وأصلها ليس بكسر الياء فسكنت استثق الا ولم تقلب ألفالانها لا تتصرّف من
  حيث استعملت بلفظ الماضى للعال والذى يدل على أنها فعل وان لم تتصرّف تصرّف
  الافعال قولهم لست ولستما ولستم كقولهم ضربت وضر بتما وضر بتم وجعلت من عوامل
  قوله أوههة أى ليغة بابدال
  الخاءهاء اه
