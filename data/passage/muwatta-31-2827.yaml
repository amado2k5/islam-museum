summary:
  ar: "يروي مالك عن نافع، عن عبد الله بن عمر أن رسول الله قال: إذا كان ثلاثة فلا يتناجى اثنان دون واحد. ويذكر المحقق قول ابن عبد البر أن الحديث رواه عن ابن عمر نافع وابن دينار وأبو صالح والقاسم بن محمد وغيرهم، وأن رواية ابن دينار مفسرة، وأن الحديثين في الحقيقة حديث واحد. {cite:muwatta-maruf-1997 p.587}"
