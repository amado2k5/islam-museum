label: { ar: "الموطأ 2827 — ابن عمر: إذا كان ثلاثة فلا يتناجى اثنان دون واحد", en: "Muwatta 2827", es: "Muwatta 2827", fr: "Muwatta 2827", ur: "موطا 2827", tr: "El-Muvatta 2827 — İbn Ömer: Üç kişi varsa, üçüncüsü olmadan ikisi birbirine fısıldaşmamalıdır.", id: "Al-Muwatta 2827 — Ibn Umar: Jika ada tiga orang, dua di antaranya tidak boleh berbisik satu sama lain tanpa sepengetahuan orang ketiga." }
summary:
  ar: "يروي مالك عن نافع، عن عبد الله بن عمر أن رسول الله قال: إذا كان ثلاثة فلا يتناجى اثنان دون واحد. ويذكر المحقق قول ابن عبد البر أن الحديث رواه عن ابن عمر نافع وابن دينار وأبو صالح والقاسم بن محمد وغيرهم، وأن رواية ابن دينار مفسرة، وأن الحديثين في الحقيقة حديث واحد. {cite:muwatta-maruf-1997 p.587}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Üç kişi varsa, ikisi üçüncüsünü dışlayarak birbirleriyle fısıldaşmamalıdır.\" Araştırmacı, İbn Abd al-Barr'ın bu hadisin İbn Umar'dan Nafi', İbn Dinar, Ebu Salih, el-Kasım ibn Muhammed ve diğerleri tarafından nakledildiğine, İbn Dinar'ın rivayetinin açıklayıcı olduğuna ve iki hadisin aslında tek bir hadis olduğuna dair ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.587}"
  id: "Malik meriwayatkan dari Nafi’, dari Abdullah ibn Umar, bahwa Rasulullah SAW bersabda: “Jika ada tiga orang, maka dua di antaranya janganlah berbisik satu sama lain tanpa menyebutkan orang ketiga.” Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits tersebut diriwayatkan dari Ibnu Umar oleh Nafi’, Ibnu Dinar, Abu Salih, al-Qasim ibn Muhammad, dan lainnya, dan bahwa riwayat Ibnu Dinar bersifat menjelaskan, dan bahwa kedua hadits tersebut sebenarnya adalah satu hadits. {cite:muwatta-maruf-1997 p.587}"
