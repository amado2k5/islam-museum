text: "… يكون العبد منشرح الصّدر بأوامر اللّٰه ونواهيه، يفعل ما فرض عليه طيب النّفس به سلسًا نحوه، وينتهي عمّ حرّم عليه واسعًا به صدره غير متضجر منه، ويرغب في نوافل الخير، ويترك كثيرًا من المباح لوجه اللّٰه تعالى إذا رأى أن …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 350، يرد فيه ذكر ما فُرض على الناس، والفرض، والنافلة والنوافل، والمباح، وما حُرّم على الناس، والترغيب في العمل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 350, whose wording mentions what was made obligatory on people, the obligatory (fard), the supererogatory (nafila), the permitted (mubah), what was forbidden to people, encouragement to an act; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 350 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، نفل اور نوافل، مباح، جو لوگوں پر حرام کیا گیا، عمل کی ترغیب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 350, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), le surérogatoire (nafila), le permis (mubah), ce qui a été interdit aux gens, l'encouragement à un acte ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 350, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo supererogatorio (nafila), lo permitido (mubah), lo que se prohibió a la gente, el estímulo a un acto; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 10. cildinin 350. sayfasından, farz, nafile, helal, haram ve iyiliğe teşvik konularını ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram eylemler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 10, halaman 350, yang membahas tentang amalan wajib, amalan sunnah, amalan yang diperbolehkan, amalan yang dilarang, dan anjuran untuk melakukan amal kebaikan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
