text: "… الضبعي وكان قد أدرك الجاهلية قال قال رسول اللّٰه والفي يوم ذي قار هذا أول يوم انتصفت فيه العرب من العجم قال الهيثمي رواه الطبراني وفيه سليمان ابن داود الشاذكوني وهو ضعيف. تجريد أسماء الصحابة. ذكره المتقي الهندي في الكنز …"
summary:
