label:
  ar: "ابن ماجه 3801 — لك الحمد كما ينبغي لجلال وجهك: اكتباها كما قال عبدي"
  en: "Ibn Majah 3801 — Praise be to You as befits Your majesty: write it as My servant said it"
  ur: "ابن ماجہ 3801 — تیری حمد جیسی تیرے چہرے کی جلالت کے لائق ہے: اسے ویسا لکھو جیسا میرے بندے نے کہا"
  es: "Ibn Majah 3801 — Alabado seas como corresponde a tu majestad: escríbelo como lo dijo mi siervo."
  fr: "Ibn Majah 3801 — Louange à Toi comme il sied à Ta majesté: écris-le comme Mon serviteur l’a dit."
  tr: "İbn Majah 3801 — Senin yüceliğine yakışır şekilde, bütün övgüler sana aittir. Kulumun dediği gibi yaz."
  id: "Ibn Majah 3801 — Segala puji bagi-Mu sebagaimana layaknya keagungan wajah-Mu; Tuliskanlah sebagaimana firman hamba-Ku."
text: "أن عبدا من عباد الله قال يا رب لك الحمد كما ينبغي لجلال وجهك ولعظيم سلطانك فعضلت بالملكين فلم يدريا كيف يكتبانها فصعدا إلى السماء وقالا يا ربنا إن عبدك قد قال مقالة لا ندري كيف نكتبها . قال الله …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3801: لك الحمد كما ينبغي لجلال وجهك: اكتباها كما قال عبدي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3801: Praise be to You as befits Your majesty: write it as My servant said it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3801: تیری حمد جیسی تیرے چہرے کی جلالت کے لائق ہے: اسے ویسا لکھو جیسا میرے بندے نے کہا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 3801: Alabado seas como corresponde a Tu majestad: escríbelo como lo dijo Mi siervo. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 3801: Louange à Toi comme il sied à Ta majesté ! Écris-le tel que Mon serviteur l’a dit. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations à travers les six livres et la Muwatta."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 3801: “Segala puji hanya milik-Mu sebagaimana layaknya keagungan wajah-Mu. Tuliskanlah sebagaimana yang dikatakan oleh hamba-Ku.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
