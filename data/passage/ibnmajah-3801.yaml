label:
  ar: "ابن ماجه 3801 — لك الحمد كما ينبغي لجلال وجهك: اكتباها كما قال عبدي"
  en: "Ibn Majah 3801 — Praise be to You as befits Your majesty: write it as My servant said it"
  ur: "ابن ماجہ 3801 — تیری حمد جیسی تیرے چہرے کی جلالت کے لائق ہے: اسے ویسا لکھو جیسا میرے بندے نے کہا"
text: "أن عبدا من عباد الله قال يا رب لك الحمد كما ينبغي لجلال وجهك ولعظيم سلطانك فعضلت بالملكين فلم يدريا كيف يكتبانها فصعدا إلى السماء وقالا يا ربنا إن عبدك قد قال مقالة لا ندري كيف نكتبها . قال الله …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3801: لك الحمد كما ينبغي لجلال وجهك: اكتباها كما قال عبدي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3801: Praise be to You as befits Your majesty: write it as My servant said it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3801: تیری حمد جیسی تیرے چہرے کی جلالت کے لائق ہے: اسے ویسا لکھو جیسا میرے بندے نے کہا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
