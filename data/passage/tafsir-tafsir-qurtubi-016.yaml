text: "اء. الكلام على الأولاد. أسباب الميراث. بيان الفرائض الواقعة في كتاب الله . لا ميراث إلا بعد أداء الدين والوصية. بيان الوارثين من الرجال والنساء. فرض الثنتين من بنات الصلب. فرض البنت. إذا مات الرجل وترك زوجته حبلى . بماذا"
