label: { ar: "الموطأ 2574 — بشير بن يسار: محيصة وحويصة يطلبان دم عبد الله بن سهل وقول النبي", en: "Muwatta 2574" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بشير بن يسار أنه أخبره أن عبد الله بن سهل الأنصاري ومحيصة بن مسعود خرجا إلى خيبر فتفرقا في حوائجهما، فقُتل عبد الله بن سهل. فقدم محيصة فأتى هو وأخوه حويصة وعبد الرحمن بن سهل إلى النبي، فذهب عبد الرحمن ليتكلم لمكانه من أخيه، فقال النبي: كبّر كبّر، فتكلم حويصة ومحيصة وذكرا شأن عبد الله بن سهل. فقال لهم النبي: أتحلفون خمسين يمينا وتستحقون دم صاحبكم أو قاتلكم؟ فقالوا: يا رسول الله، لم نشهد ولم نحضر. فقال: فتبرئكم يهود بخمسين يمينا؟ فقالوا: كيف نقبل أيمان قوم كفار؟ قال يحيى بن سعيد: فزعم بشير بن يسار أن النبي داه من عنده. ويذكر المحقق أن ابن عبد البر عدّه مرسلا في رواية مالك، وأن رواية سهل وحده متصلة في الصحيحين. {cite:muwatta-maruf-1997 p.452} {cite:muwatta-maruf-1997 p.453}"
