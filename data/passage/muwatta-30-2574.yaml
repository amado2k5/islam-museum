label: { ar: "الموطأ 2574 — بشير بن يسار: محيصة وحويصة يطلبان دم عبد الله بن سهل وقول النبي", en: "Muwatta 2574", es: "Muwatta 2574", fr: "Muwatta 2574", ur: "موطا 2574", tr: "Al-Muwatta 2574 - Beşir bin Yaşar: Muhaysa ve Huwaysah, Abdullah bin Sehl'in kanını arıyor ve Peygamber şöyle dedi:", id: "Al-Muwatta 2574 — Bashir bin Yasar: Muhaysah dan Huwaysah mencari darah Abdullah bin Sahl, dan Nabi bersabda" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن بشير بن يسار أنه أخبره أن عبد الله بن سهل الأنصاري ومحيصة بن مسعود خرجا إلى خيبر فتفرقا في حوائجهما، فقُتل عبد الله بن سهل. فقدم محيصة فأتى هو وأخوه حويصة وعبد الرحمن بن سهل إلى النبي، فذهب عبد الرحمن ليتكلم لمكانه من أخيه، فقال النبي: كبّر كبّر، فتكلم حويصة ومحيصة وذكرا شأن عبد الله بن سهل. فقال لهم النبي: أتحلفون خمسين يمينا وتستحقون دم صاحبكم أو قاتلكم؟ فقالوا: يا رسول الله، لم نشهد ولم نحضر. فقال: فتبرئكم يهود بخمسين يمينا؟ فقالوا: كيف نقبل أيمان قوم كفار؟ قال يحيى بن سعيد: فزعم بشير بن يسار أن النبي داه من عنده. ويذكر المحقق أن ابن عبد البر عدّه مرسلا في رواية مالك، وأن رواية سهل وحده متصلة في الصحيحين. {cite:muwatta-maruf-1997 p.452} {cite:muwatta-maruf-1997 p.453}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Beşir ibn Yasar'dan rivayet ettiğine göre, Abdullah ibn Sahl el-Ensari ve Muhaysah ibn Mes'ud'un Hayber'e gittiklerini ve ihtiyaçlarını karşılamak için ayrıldıklarını öğrenmiştir. Abdullah ibn Sahl öldürülmüştür. Muhaysah gelmiş ve kardeşi Huveyşa ve Abdurrahman ibn Sahl ile birlikte Peygamber'in yanına gitmişlerdir. Abdurrahman, kardeşiyle olan akrabalığı nedeniyle konuşmak istemiş, ancak Peygamber, \"Öyle devam edin, devam edin\" demiştir. Bunun üzerine Huveyşa ve Muhaysah konuşmuş ve Abdullah ibn Sahl'ın durumundan bahsetmişlerdir. Peygamber onlara, \"Elli yemin edip arkadaşınızın veya katilinizin kanının akıbetini kabul edecek misiniz?\" diye sormuştur. Onlar, \"Ey Allah'ın Resulü, biz orada değildik ve şahit olmadık\" demişlerdir. Peygamber, \"Öyleyse Yahudiler sizi elli yeminle aklayacaklar mı?\" diye sormuştur. Onlar, \"İnanmayan bir kavmin yeminlerini nasıl kabul edebiliriz?\" demişlerdir. Yahya ibn Sa'id, \"Beşir ibn Yasar, Peygamberin bunu kendi rivayetine dayanarak uydurduğunu iddia etti\" demiştir. Araştırmacı, İbn Abd al-Barr'ın Malik'in rivayetinde bunu mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olarak değerlendirdiğini ve sadece Sahl'ın rivayetinin iki Sahih'te (Buhari ve Müslim) bağlantılı olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.452} {cite:muwatta-maruf-1997 s.453}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Bashir ibn Yasar, bahwa ia diberitahu bahwa Abdullah ibn Sahl al-Ansari dan Muhaysah ibn Mas'ud pergi ke Khaybar dan berpisah untuk memenuhi kebutuhan mereka. Abdullah ibn Sahl terbunuh. Muhaysah tiba, dan dia, saudaranya Huwaysah, dan Abdur-Rahman ibn Sahl pergi menemui Nabi. Abdur-Rahman hendak berbicara karena hubungannya dengan saudaranya, tetapi Nabi berkata, \"Silakan, silakan.\" Maka Huwaysah dan Muhaysah berbicara dan menyebutkan masalah Abdullah ibn Sahl. Nabi berkata kepada mereka, \"Apakah kalian akan bersumpah lima puluh sumpah dan berhak atas darah teman kalian atau pembunuh kalian?\" Mereka berkata, \"Wahai Rasulullah, kami tidak hadir dan kami tidak menyaksikannya.\" Beliau berkata, \"Kalau begitu, apakah orang-orang Yahudi akan membebaskan kalian dengan lima puluh sumpah?\" Mereka berkata, \"Bagaimana mungkin kita menerima sumpah orang-orang yang tidak percaya?\" Yahya ibn Sa'id berkata, \"Bashir ibn Yasar mengklaim bahwa Nabi mengarangnya sendiri.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr menganggapnya mursal (hadits dengan mata rantai periwayatan yang hilang) dalam versi Malik, dan bahwa hanya versi Sahl yang terhubung dalam dua kitab Sahih (Bukhari dan Muslim). {cite:muwatta-maruf-1997 p.452} {cite:muwatta-maruf-1997 p.453}"
