text: "… عليه ومنلم أقسمت - أو حلفت - أن لا أضع ردائى عن ظهرى حق أجمع ما بين اللوحين، فما وضعت ردائى عن ظهرى حق جمعت القرآن حدثنا أبو بكر بن مالك ثنا محمد ابن يونس السامى ثنا أبو بكر الحنفى …"
summary:
