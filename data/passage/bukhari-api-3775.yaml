label: { ar: "صحيح البخاري 3775 — الأب والأبوة", en: "Sahih al-Bukhari 3775 — the father and fatherhood", ur: "صحیح بخاری 3775 — باپ اور والدیت", es: "Sahih al-Bukhari 3775 — El padre y la paternidad", fr: "Sahih al-Bukhari 3775 — Le père et la paternité" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الْوَهَّابِ، حَدَّثَنَا حَمَّادٌ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ،، قَالَ كَانَ النَّاسُ يَتَحَرَّوْنَ بِهَدَايَاهُمْ يَوْمَ عَائِشَةَ قَالَتْ عَائِشَةُ فَاجْتَمَعَ صَوَاحِبِي إِلَى أُمِّ سَلَمَةَ، فَقُلْنَ يَا أُمَّ سَلَمَةَ، وَاللَّهِ إِنَّ النَّاسَ يَتَحَرَّوْنَ بِهَدَايَاهُمْ يَوْمَ عَائِشَةَ، وَإِنَّا نُرِيدُ الْخَيْرَ كَمَا تُرِيدُهُ عَائِشَةُ، فَمُرِي رَسُولَ اللَّهِ أَنْ يَأْمُرَ النَّاسَ أَنْ يُهْدُوا إِلَيْهِ حَيْثُ مَا كَانَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3775، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3775 (Companions of the Prophet), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3775، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3775 (Compañeros del Profeta), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3775 (Compagnons du Prophète), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
