  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 360, qui mentionne les ventouses, la lèpre et le vitiligo, les maladies nommées, le traitement, la chirurgie, la circoncision et les attelles; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 360. sayfasından bir bölüm; hacamat, cüzzam, vitiligo, hastalık isimleri, tedavi, cerrahi, sünnet ve atellerden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 360, yang menyebutkan bekam, kusta, vitiligo, nama-nama penyakit, pengobatan, pembedahan, sunat, dan bidai; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
