text: "… الباذشنام والحمرة المفرطة الباذشنام حمرة منكرة تشبه حمرة من يبتدئ به الجذام اليلال يظهر على الوجه وعلى الأطراف كان معها قروح، ويكون سببه حقن البرد للبخار الكثير الدموي، وعلاجه الإسهال افل للايل والفصد والحجامة وإرسال العلق التنكر في ابتداء الجذام …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 360، يذكر الحجامة، والجذام والبرص، وأسماء الأمراض، والعلاج، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 360, that mentions cupping, leprosy and vitiligo, named diseases, treatment, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
