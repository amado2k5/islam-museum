label: { ar: "صحيح البخاري 1873 — الحرام", en: "Sahih al-Bukhari 1873 — the unlawful", ur: "صحیح بخاری 1873 — حرام", es: "Sahih al-Bukhari 1873 — el ilícito", fr: "Sahih al-Bukhari 1873 — l'illicite", tr: "Sahih el-Buhari 1873 — Yasak", id: "Sahih al-Bukhari 1873 — Yang Terlarang" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنِ ابْنِ شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ ـ أَنَّهُ كَانَ يَقُولُ لَوْ رَأَيْتُ الظِّبَاءَ بِالْمَدِينَةِ تَرْتَعُ مَا ذَعَرْتُهَا، قَالَ رَسُولُ اللَّهِ \" مَا بَيْنَ لاَبَتَيْهَا حَرَامٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1873، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1873 (Virtues of Madinah), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1873، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1873 (Virtudes de Medina), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1873 (Vertus de Médine), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Sahih el-Buhari'de 1873 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve haram tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1873, menyebutkan apa yang dilarang. Peramban halal dan haram menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
