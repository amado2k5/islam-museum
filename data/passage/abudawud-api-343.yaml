label: { ar: "سنن أبي داود 343 — مضاعفة الحسنة بعشر أمثالها", en: "Sunan Abi Dawud 343 — the good deed multiplied tenfold and beyond", ur: "سنن ابی داؤد 343 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "… النَّاسِ ثُمَّ صَلَّى مَا كَتَبَ اللَّهُ لَهُ ثُمَّ أَنْصَتَ إِذَا خَرَجَ إِمَامُهُ حَتَّى يَفْرُغَ مِنْ صَلاَتِهِ كَانَتْ كَفَّارَةً لِمَا بَيْنَهَا وَبَيْنَ جُمُعَتِهِ الَّتِي قَبْلَهَا \". قَالَ وَيَقُولُ أَبُو هُرَيْرَةَ \" وَزِيَادَةُ ثَلاَثَةِ أَيَّامٍ \". وَيَقُولُ \" إِنَّ الْحَسَنَةَ بِعَشْرِ أَمْثَالِهَا \". قَالَ أَبُو دَاوُدَ وَحَدِيثُ مُحَمَّدِ بْنِ سَلَمَةَ أَتَمُّ وَلَمْ يَذْكُرْ حَمَّادٌ كَلاَمَ أَبِي هُرَيْرَةَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 343، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 343 (Purification (Kitab Al-Taharah)), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 343، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
