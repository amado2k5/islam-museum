label: { ar: "الموطأ 104 — ابن عمر يتوضأ بعد الغسل لأنه قد يمس ذكره", en: "Muwatta 104" }
text: "أما يجزيك الغسل من الوضوء؟ قال: بلى، ولكني أحياناً أمس ذكري فأتوضأ"
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سالم بن عبد الله، في باب الوضوء من مس الفرج: رأى سالم أباه عبد الله بن عمر يغتسل ثم يتوضأ، فسأله أما يجزيه الغسل عن الوضوء، فقال: بلى، ولكنه أحياناً يمس ذكره فيتوضأ. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرجه من غير طريق مالك. {cite:muwatta-maruf-1997 p.86} {cite:muwatta-maruf-1997 p.87}"
