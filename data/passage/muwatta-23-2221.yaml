label: { ar: "الموطأ 2221 — مالك: فيمن يوصي في ثلثه فيقول: لفلان كذا وكذا، ولفلان كذا وكذا، فيقول الورثة قد زاد على ثلثه: فإن الورثة يخيرون بين أن يعطوا أهل الوصايا وصاياهم ويأخذوا جميع مال الميت، أو يقسموا لأهل الوصايا ثلث المال", en: "Muwatta 2221" }
summary:
  ar: "قال: وسمعت مالكا يقول فيمن يوصي في ثلثه، فيقول: لفلان كذا وكذا، ولفلان كذا وكذا، يسمي مالا من ماله، فيقول ورثته: قد زاد على ثلثه. فإن الورثة يخيرون، بين أن يعطوا أهل الوصايا وصاياهم، ويأخذوا جميع مال الميت، وبين أن يقسموا لأهل الوصايا ثلث مال الميت، فيسلموا إليهم ثلثه، فتكون حقوقهم فيه إن أرادوا، بالغا ما بلغ. {cite:muwatta-maruf-1997 p.313}"
