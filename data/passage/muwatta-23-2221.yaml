label: { ar: "الموطأ 2221 — مالك: فيمن يوصي في ثلثه فيقول: لفلان كذا وكذا، ولفلان كذا وكذا، فيقول الورثة قد زاد على ثلثه: فإن الورثة يخيرون بين أن يعطوا أهل الوصايا وصاياهم ويأخذوا جميع مال الميت، أو يقسموا لأهل الوصايا ثلث المال", en: "Muwatta 2221", es: "Muwatta 2221", fr: "Muwatta 2221", ur: "موطا 2221", tr: "El-Muvatta 2221 — Malik: Bir kimse, mal varlığının üçte birini, “Filanca kişiye, filanca kişiye” diye vasiyet ederse ve mirasçılar, “Mal varlığının üçte birinden fazlasını vasiyet etmiştir” derlerse, mirasçıların iki seçeneği vardır: Ya miras bırakanlara vasiyet ettikleri malları verip ölenin mal varlığının tamamını alırlar ya da mal varlığının üçte birini mirasçılar arasında paylaştırırlar.", id: "Al-Muwatta 2221 — Malik: Mengenai seseorang yang mewariskan sepertiga dari hartanya, dengan mengatakan, “Kepada si fulan begini dan begitu, dan kepada si fulan begini dan begitu,” dan para ahli waris berkata, “Dia telah melampaui sepertiga dari hartanya,” maka para ahli waris memiliki pilihan antara memberikan warisan mereka kepada para ahli waris dan mengambil seluruh harta almarhum, atau membagi sepertiga dari harta tersebut di antara para ahli waris." }
summary:
  ar: "قال: وسمعت مالكا يقول فيمن يوصي في ثلثه، فيقول: لفلان كذا وكذا، ولفلان كذا وكذا، يسمي مالا من ماله، فيقول ورثته: قد زاد على ثلثه. فإن الورثة يخيرون، بين أن يعطوا أهل الوصايا وصاياهم، ويأخذوا جميع مال الميت، وبين أن يقسموا لأهل الوصايا ثلث مال الميت، فيسلموا إليهم ثلثه، فتكون حقوقهم فيه إن أرادوا، بالغا ما بلغ. {cite:muwatta-maruf-1997 p.313}"
  tr: "Şöyle dedi: Malik'in, mirasın üçte birini, \"Filanca kişiye, filanca kişiye\" diye belirterek, yani servetinin bir kısmını vasiyet eden biri hakkında şöyle dediğini duydum. Mirasçılar ise \"Bu, üçte birden fazla\" diyorlar. Mirasçıların, miras bırakanlara vasiyet ettikleri payı verip ölen kişinin tüm mal varlığını alma veya mirasın üçte birini mirasçılar arasında bölüştürüp, isterlerse bu üçte birlik kısmı onlara verme seçeneği vardır; böylece hakları, istedikleri takdirde, mevcut miktarla aynı olabilir. {cite:muwatta-maruf-1997 s.313}"
  id: "Dia berkata: Saya mendengar Malik berkata mengenai seseorang yang mewariskan sepertiga dari hartanya, dengan mengatakan, \"Kepada si anu begini begini, dan kepada si anu begini begini,\" yang menyebutkan sebagian dari kekayaannya, dan ahli warisnya berkata, \"Jumlahnya melebihi sepertiga.\" Para ahli waris memiliki pilihan antara memberikan warisan mereka kepada para penerima warisan dan mengambil seluruh harta almarhum, atau membagi sepertiga dari harta almarhum di antara para penerima warisan, menyerahkan sepertiga tersebut kepada mereka, sehingga hak mereka atasnya, jika mereka menginginkannya, dapat sama besarnya. {cite:muwatta-maruf-1997 p.313}"
