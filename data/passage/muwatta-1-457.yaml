label: { ar: "الموطأ 457 — أبو مسعود: بشير بن سعد يسأل في مجلس سعد بن عبادة كيف نصلي عليك", en: "Muwatta 457", es: "Muwatta 457", fr: "Muwatta 457", ur: "موطا 457", tr: "El-Muvatta 457 — Ebu Mesud: Beşir bin Saad, Saad bin Ubadah'ın meclisinde soruyor: Senin için nasıl dua etmeliyiz?", id: "Al-Muwatta 457 — Abu Masoud: Bashir bin Saad bertanya dalam majelis Saad bin Ubadah: Bagaimana seharusnya kami berdoa untukmu?" }
text: "اللهم صل على محمد وعلى آل محمد كما صليت على إبراهيم، وبارك على محمد وعلى آل محمد كما باركت على آل إبراهيم في العالمين، إنك حميد مجيد، والسلام كما قد علمتم"
summary:
  ar: "يرويه مالك عن نعيم بن عبد الله المجمر عن محمد بن عبد الله بن زيد الأنصاري عن أبي مسعود الأنصاري، في باب ما جاء في الصلاة على النبي: أتاهم النبي في مجلس سعد بن عبادة فسأله بشير بن سعد: أمرنا الله أن نصلي عليك فكيف نصلي عليك؟ فسكت النبي حتى تمنوا أنه لم يسأله، ثم علمهم أن يقولوا: اللهم صل على محمد وعلى آل محمد كما صليت على إبراهيم، وبارك على محمد وعلى آل محمد كما باركت على آل إبراهيم في العالمين، إنك حميد مجيد، والسلام كما قد علمتم. ويخرّجه المحقق عند مسلم (2/16) وأبي داود (980) والترمذي (3220) والنسائي (3/45) وابن حبان وأحمد والدارمي والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (16/183). {cite:muwatta-maruf-1997 p.234} {cite:muwatta-maruf-1997 p.235}"
  tr: "Malik, Peygamberimize yapılan dualarla ilgili rivayetler bölümünde, Nu'aym ibn Abdullah el-Mücmir'den, o da Muhammed ibn Abdullah ibn Zeyd el-Ensari'den, o da Ebu Mes'ud el-Ensari'den naklettiğine göre şöyle anlatmaktadır: Peygamberimiz, Sa'd ibn Ubadah'ın meclisinde onlara geldi ve Beşir ibn Sa'd ona sordu: \"Allah bize sana dua etmemizi emretti, peki sana nasıl dua etmeliyiz?\" Peygamberimiz, sormadığı için pişman olana kadar sessiz kaldı. Sonra onlara şöyle demeyi öğretti: \"Ey Allah'ım, İbrahim'e salât verdiğin gibi Muhammed'e ve Muhammed'in ailesine de salât ver ve bütün âlemler arasında İbrahim'in ailesine salât verdiğin gibi Muhammed'e ve Muhammed'in ailesine de salât ver. Şüphesiz Sen övgüye layıksın ve yücesin. Selamlaşma ise bildiğiniz gibidir.\" Editör ayrıca bunu Müslim (2/16), Ebu Davud (980), Tirmizi (3220), Nesai (3/45), İbn Hibban, Ahmed, Darimi ve Şafiî'de Malik'in sahabelerinin rivayet zincirleri aracılığıyla da ele alıyor ve el-Tamhid'e (16/183) atıfta bulunuyor."
  id: "Diriwayatkan oleh Malik dari Nu'aym ibn 'Abdullah al-Mujmir, dari Muhammad ibn 'Abdullah ibn Zayd al-Ansari, dari Abu Mas'ud al-Ansari, dalam surah tentang apa yang diriwayatkan mengenai salat kepada Nabi: Nabi datang kepada mereka di majelis Sa'd ibn 'Ubadah, dan Bashir ibn Sa'd bertanya kepadanya: \"Allah telah memerintahkan kami untuk salat kepada Anda, lalu bagaimana seharusnya kami salat kepada Anda?\" Nabi terdiam sampai mereka menyesal telah bertanya. Kemudian beliau mengajari mereka untuk mengucapkan: \"Ya Allah, berkatilah Muhammad dan keluarga Muhammad sebagaimana Engkau memberkati Ibrahim, dan limpahkanlah karunia-Mu kepada Muhammad dan keluarga Muhammad sebagaimana Engkau limpahkan karunia-Mu kepada keluarga Ibrahim di seluruh alam. Sesungguhnya Engkau Maha Terpuji dan Maha Agung. Dan salamnya adalah seperti yang sudah kalian ketahui.\" Penyunting juga menyertakannya dalam Muslim (2/16), Abu Dawud (980), al-Tirmidhi (3220), al-Nasa'i (3/45), Ibn Hibban, Ahmad, al-Darimi, dan al-Shafi'i melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (16/183)."
