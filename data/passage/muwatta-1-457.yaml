label: { ar: "الموطأ 457 — أبو مسعود: بشير بن سعد يسأل في مجلس سعد بن عبادة كيف نصلي عليك", en: "Muwatta 457" }
text: "اللهم صل على محمد وعلى آل محمد كما صليت على إبراهيم، وبارك على محمد وعلى آل محمد كما باركت على آل إبراهيم في العالمين، إنك حميد مجيد، والسلام كما قد علمتم"
summary:
  ar: "يرويه مالك عن نعيم بن عبد الله المجمر عن محمد بن عبد الله بن زيد الأنصاري عن أبي مسعود الأنصاري، في باب ما جاء في الصلاة على النبي: أتاهم النبي في مجلس سعد بن عبادة فسأله بشير بن سعد: أمرنا الله أن نصلي عليك فكيف نصلي عليك؟ فسكت النبي حتى تمنوا أنه لم يسأله، ثم علمهم أن يقولوا: اللهم صل على محمد وعلى آل محمد كما صليت على إبراهيم، وبارك على محمد وعلى آل محمد كما باركت على آل إبراهيم في العالمين، إنك حميد مجيد، والسلام كما قد علمتم. ويخرّجه المحقق عند مسلم (2/16) وأبي داود (980) والترمذي (3220) والنسائي (3/45) وابن حبان وأحمد والدارمي والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (16/183). {cite:muwatta-maruf-1997 p.234} {cite:muwatta-maruf-1997 p.235}"
