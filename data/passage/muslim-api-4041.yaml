label: { ar: "صحيح مسلم 4041 — الحجامة، اللدود والسعوط", en: "Sahih Muslim 4041 — cupping; medicine given by the mouth-side or the nose", ur: "صحیح مسلم 4041 — حجامہ، لدود اور سعوط", es: "Sahih Muslim 4041 — ventosas; medicamento administrado por vía oral o nasal.", fr: "Sahih Muslim 4041 — ventouses; médecine administrée par voie buccale ou nasale", tr: "Sahih Muslim 4041 — Hacamat, ilaç verme ve enfiye kullanımı", id: "Sahih Muslim 4041 — Bekam, pemberian obat, dan tembakau kunyah" }
text: "وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَفَّانُ بْنُ مُسْلِمٍ، ح وَحَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، أَخْبَرَنَا الْمَخْزُومِيُّ، كِلاَهُمَا عَنْ وُهَيْبٍ، حَدَّثَنَا ابْنُ طَاوُسٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ احْتَجَمَ وَأَعْطَى الْحَجَّامَ أَجْرَهُ وَاسْتَعَطَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4041، يذكر الحجامة، واللدود والسعوط. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 4041 (The Book of Musaqah), that mentions cupping, medicine given by the mouth-side or the nose. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 4041، جس میں حجامہ، لدود اور سعوط کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4041 (El Libro de Musaqah), menciona la ventosaterapia, una práctica que consiste en la administración de medicamentos por vía oral o nasal. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 4041 (Livre de Musaqah), mentionne la ventousothérapie, un traitement médical administré par voie buccale ou nasale. Le dictionnaire en ligne Medicine Browser le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 4041 numaralı hadiste hacamat, ağızdan ilaç tedavisi ve burundan inhalasyondan bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemlerine dair metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4041, menyebutkan bekam, pengobatan oral, dan inhalasi nasal. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
