text: "… كما يكره أن تؤتى معصيته رواه أحمد وابن خزيمة في صحيحا وغيرهما، فأخبر أن اللّٰه يحب إتيان رخصه كما يكره فعل معصيته، وبعض الفقهاء يرويه كما يجب أن تؤتى عزائمه وليس هذا لفظ الجديث، وذلك لأن الرخص إنما أباحها اللّٰه …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 47، يرد فيه ذكر المباح، والرخصة، والرخصة والعزيمة، وما يجب، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Taymiyya's Kitab al-Iman, scan volume 1, p. 47, whose wording mentions the permitted (mubah), the concession (rukhsa), the concession and the original rule, what must be done, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الایمان، ابن تیمیہ، اسکین جلد 1، ص 47 کا اقتباس جس میں مباح، رخصت، رخصت اور عزیمت، جو واجب ہے، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Iman de Ibn Taymiyya, volume numérisé 1, p. 47, dont le texte mentionne le permis (mubah), la dispense (rukhsa), la dispense et la règle d'origine, ce qui doit être fait, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Iman de Ibn Taymiyya, volumen digitalizado 1, p. 47, cuyo texto menciona lo permitido (mubah), la dispensa (rukhsa), la dispensa y la regla original, lo que debe hacerse, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 47. sayfasından, helal ameller, müstehaplar, müstehaplar ve farz olanlar, gerekli olanlar ve mekruh olanlar hakkında bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 47, membahas tentang amalan yang diperbolehkan, keringanan, keringanan dan kewajiban, apa yang diwajibkan, dan apa yang tidak disukai. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
