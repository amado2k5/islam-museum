label: { ar: "الموطأ 1745 — حميد بن قيس المكي عن رجل يقال له ذفيف: سأل ابن عباس عن العزل، فقال هو ذلك، وأما أنا فأفعله", en: "Muwatta 1745", es: "Muwatta 1745", fr: "Muwatta 1745", ur: "موطا 1745", tr: "El-Muvatta 1745 — Humaid bin Kays el-Mekki, Dhafif adında bir adamdan rivayetle: İbn Abbas'a cinsel birleşmeyi kesme hakkında sordu ve İbn Abbas şöyle dedi: \"Öyledir ve ben de öyle yapıyorum.\"", id: "Al-Muwatta 1745 — Humaid bin Qais Al-Makki, berdasarkan keterangan seorang bernama Dhafif: Dia bertanya kepada Ibnu Abbas tentang coitus interruptus, dan dia berkata: Itu adalah coitus interruptus, dan adapun aku, aku melakukannya." }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي عن رجل يقال له ذفيف أنه سأل ابن عباس عن العزل، فدعا جارية له وقال أخبريهم، فكأنها استحيت، فقال: هو ذلك، أما أنا فأفعله، يعني أنه يعزل. {cite:muwatta-maruf-1997 p.112}"
  tr: "Malik, Humaid ibn Qais al-Makki'den, o da Dhufayf adında bir adamdan rivayet ettiğine göre, İbn Abbas'a cinsel birleşmeyi yarıda kesme (coitus interruptus) hakkında soru sormuş. Bunun üzerine cariyesini çağırmış ve \"Onlara anlat\" demiş. Cariye utanmış gibi görünmüş, bu yüzden İbn Abbas \"Öyledir. Ben ise öyle yapıyorum\" demiş, yani cinsel birleşmeyi yarıda kesme yöntemini uyguladığını belirtmiş. {cite:muwatta-maruf-1997 s.112}"
  id: "Malik meriwayatkan dari Humaid ibn Qais al-Makki, dari seorang pria bernama Dhufayf, bahwa ia bertanya kepada Ibnu Abbas tentang coitus interruptus. Maka ia memanggil budak perempuannya dan berkata, \"Katakan kepada mereka.\" Budak perempuan itu tampak malu, lalu ia berkata, \"Itulah dia. Adapun aku, aku melakukannya,\" yang berarti bahwa ia mempraktikkan coitus interruptus. {cite:muwatta-maruf-1997 p.112}"
