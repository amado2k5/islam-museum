label: { ar: "سنن أبي داود 3418 — الرقية، البرء من العلة", en: "Sunan Abi Dawud 3418 — ruqya recited over the sick; recovery from an ailment", ur: "سنن ابی داؤد 3418 — رقیہ، بیماری سے شفایابی" }
text: "… بَعْضُهُمْ إِنَّ سَيِّدَنَا لُدِغَ فَشَفَيْنَا لَهُ بِكُلِّ شَىْءٍ فَلاَ يَنْفَعُهُ شَىْءٌ فَهَلْ عِنْدَ أَحَدٍ مِنْكُمْ شَىْءٌ يَشْفِي صَاحِبَنَا يَعْنِي رُقْيَةً. فَقَالَ رَجُلٌ مِنَ الْقَوْمِ إِنِّي لأَرْقِي وَلَكِنِ اسْتَضَفْنَاكُمْ فَأَبَيْتُمْ أَنْ تُضَيِّفُونَا مَا أَنَا بِرَاقٍ حَتَّى تَجْعَلُوا لِي جُعْلاً. فَجَعَلُوا لَهُ قَطِيعًا مِنَ الشَّاءِ فَأَتَاهُ فَقَرَأَ عَلَيْهِ بِأُمِّ الْكِتَابِ وَيَتْفُلُ حَتَّى بَرِئَ كَأَنَّمَا أُنْشِطَ مِنْ عِقَالٍ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3418، يذكر الرقية، والبرء من العلة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3418 (Wages (Kitab Al-Ijarah)), that mentions ruqya recited over the sick, recovery from an ailment, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3418، جس میں رقیہ، بیماری سے شفایابی، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
