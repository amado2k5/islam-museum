text: "؟ قال : لا أقول : مخلوق ، ثم وجه بجواباتهم إلى المأمون . فورد عليه كتاب المأمون : بلغنا ما أجاب به متصنعة أهل القبلة ، وملتمسو الرئاسة فيما ليسوا له بأهل ، فمن لم يجب أنه مخلوق ."
