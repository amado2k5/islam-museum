label: { ar: "صحيح البخاري 5166 — دفن وقبر ومرقد", en: "Sahih al-Bukhari 5166 — a burial, grave or resting place", ur: "صحیح بخاری 5166 — تدفین، قبر اور مرقد", es: "Sahih al-Bukhari 5166 — un entierro, tumba o lugar de descanso", fr: "Sahih al-Bukhari 5166 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… رَهْطٌ مِنْهُمْ عِنْدَ النَّبِيِّ فَأَطَالُوا الْمُكْثَ، فَقَامَ النَّبِيُّ فَخَرَجَ وَخَرَجْتُ مَعَهُ لِكَىْ يَخْرُجُوا، فَمَشَى النَّبِيُّ وَمَشَيْتُ، حَتَّى جَاءَ عَتَبَةَ حُجْرَةِ عَائِشَةَ، ثُمَّ ظَنَّ أَنَّهُمْ خَرَجُوا فَرَجَعَ وَرَجَعْتُ مَعَهُ، حَتَّى إِذَا دَخَلَ عَلَى زَيْنَبَ فَإِذَا هُمْ جُلُوسٌ لَمْ يَقُومُوا، فَرَجَعَ النَّبِيُّ وَرَجَعْتُ مَعَهُ، حَتَّى إِذَا بَلَغَ عَتَبَةَ حُجْرَةِ عَائِشَةَ، وَظَنَّ أَنَّهُمْ خَرَجُوا، فَرَجَعَ وَرَجَعْتُ مَعَهُ فَإِذَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5166، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5166 (Wedlock, Marriage (Nikaah)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 5166، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5166 (Matrimonio (Nikaah)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 5166 (Mariage), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
