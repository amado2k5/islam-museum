text: "… اللَّيْلَةَ . قَالَ قُلْتُ يَا رَسُولَ اللَّهِ اشْرَبْ. فَشَرِبَ ثُمَّ نَاوَلَنِي فَقُلْتُ يَا رَسُولَ اللَّهِ اشْرَبْ. فَشَرِبَ ثُمَّ نَاوَلَنِي فَلَمَّا عَرَفْتُ أَنَّ النَّبِيَّ قَدْ رَوِيَ وَأَصَبْتُ دَعْوَتَهُ ضَحِكْتُ حَتَّى أُلْقِيتُ إِلَى الأَرْضِ - قَالَ - فَقَالَ النَّبِيُّ إِحْدَى سَوْآتِكَ يَا مِقْدَادُ . فَقُلْتُ يَا رَسُولَ اللَّهِ كَانَ مِنْ أَمْرِي كَذَا وَكَذَا وَفَعَلْتُ كَذَا. فَقَالَ النَّبِيُّ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5362، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih Muslim, no. 5362, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح مسلم کی حدیث نمبر 5362، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih Muslim, n° 5362, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih Muslim, n.º 5362, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
