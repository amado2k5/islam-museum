text: "… عبد اللّه بن أبى أحمد.. أورده ابن أبى على فى الصحابة وهو وهم نشأ عن حذف فانه اورد من طريق عبد الرحمن بن الحرث عن عاصم بن عبيد اللّه عنه قال رأيت حمنة هى بذت جحش تسقى العطشى وتداوى الجرحى …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 5، ص 543، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 5, p. 543, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 5، ص 543 کا اقتباس جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen escaneado 5, pág. 543, que menciona el tratamiento de heridas, mujeres que atienden a los heridos y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isaba d'Ibn Hajar, volume 5, page 543, qui mentionne le traitement des blessures, les femmes soignant les blessés, la recherche de soins; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Hacer'in El-İsabe adlı eserinin resimli 5. cildinin 543. sayfasında, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedavi konularına değinilmektedir; bu bölüm, makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Isabah karya Ibn Hajar, jilid 5 bergambar, hlm. 543, menyebutkan pengobatan luka, perempuan yang merawat orang terluka, dan pengobatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
