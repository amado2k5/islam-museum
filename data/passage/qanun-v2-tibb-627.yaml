text: "… النافعة للريحي. والقولنج، كثيراً ما ينتقل إلى الفالج، ويبحرن به، وذلك إذا اندفعت المادة الرقيقة إلى الأطراف، فتشرّبها العضل، وكذلك قد يبحرن بأوجاع المفاصل، وربما انتقل إلى أوجاع الظهر البلغمي، أو الدموي النافع منه الفصد لإنضاج الحرارة الوجعية، والأدوية القولنجية …"
summary:
