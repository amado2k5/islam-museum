text: "… النافعة للريحي. والقولنج، كثيراً ما ينتقل إلى الفالج، ويبحرن به، وذلك إذا اندفعت المادة الرقيقة إلى الأطراف، فتشرّبها العضل، وكذلك قد يبحرن بأوجاع المفاصل، وربما انتقل إلى أوجاع الظهر البلغمي، أو الدموي النافع منه الفصد لإنضاج الحرارة الوجعية، والأدوية القولنجية …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 627، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 627, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 627 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 627, que menciona el dolor, enfermedades específicas, los órganos del cuerpo, la cirugía, la circuncisión y las férulas, el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 627, qui mentionne la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, s. 627'sinden bir bölüm; ağrı, hastalıkların isimleri, vücut organları, cerrahi, sünnet, atel ve ilaçlardan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 627, yang menyebutkan rasa sakit, nama-nama penyakit, organ tubuh, pembedahan, sunat, bidai, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
