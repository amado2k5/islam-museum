text: "… أطيَبُ الأشياءِ ؟ فقال رجلٌ : ماشَيْءٌ أطيبَ من تَمْرَة نِرْسِيانٍ كأنها من آذان النَّوكى عَلَّيتَها بُزُبْدة. ما عدال : حدثت عن أبى سعيد الرفاعى أنه. كلمة الدائسة لا أصل لها. وإنما تندر سائلُهُ بهذه اللفظة ليستخرج منه ما يضحك. …"
