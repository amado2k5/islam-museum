label: { ar: "سنن النسائي 5563 — ما كان يُكره، ما كُره", en: "Sunan al-Nasa'i 5563 — what used to be disliked; what was disliked", ur: "سنن نسائی 5563 — جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا", fr: "Sunan al-Nasa'i 5563 — ce qui était réprouvé ; ce qui fut réprouvé", es: "Sunan al-Nasa'i 5563 — lo que se reprobaba; lo que se reprobó" }
text: "أَخْبَرَنَا سُوَيْدُ بْنُ نَصْرٍ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ، عَنْ وِقَاءِ بْنِ إِيَاسٍ، عَنِ الْمُخْتَارِ بْنِ فُلْفُلٍ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ نَهَى رَسُولُ اللَّهِ أَنْ نَجْمَعَ شَيْئَيْنِ نَبِيذًا يَبْغِي أَحَدُهُمَا عَلَى صَاحِبِهِ. قَالَ وَسَأَلْتُهُ عَنِ الْفَضِيخِ فَنَهَانِي عَنْهُ قَالَ كَانَ يَكْرَهُ الْمُذَنَّبَ مِنَ الْبُسْرِ مَخَافَةَ أَنْ يَكُونَا شَيْئَيْنِ فَكُنَّا نَقْطَعُهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 5563، يرد فيه ذكر ما كان يُكره، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 5563 (The Book of Drinks), whose wording mentions what used to be disliked, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 5563، جس کے الفاظ میں جو ناپسند کیا جاتا تھا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 5563, dont le texte mentionne ce qui était réprouvé, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 5563, cuyo texto menciona lo que se reprobaba, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
