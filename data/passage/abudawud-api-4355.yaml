text: "حَدَّثَنَا الْحَسَنُ بْنُ عَلِيٍّ، حَدَّثَنَا الْحِمَّانِيُّ، - يَعْنِي عَبْدَ الْحَمِيدِ بْنَ عَبْدِ الرَّحْمَنِ - عَنْ طَلْحَةَ بْنِ يَحْيَى، وَبُرَيْدِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، قَالَ قَدِمَ عَلَىَّ مُعَاذٌ وَأَنَا بِالْيَمَنِ، وَرَجُلٌ، كَانَ يَهُودِيًّا فَأَسْلَمَ فَارْتَدَّ عَنِ الإِسْلاَمِ، فَلَمَّا قَدِمَ مُعَاذٌ قَالَ لاَ أَنْزِلُ عَنْ دَابَّتِي حَتَّى يُقْتَلَ. فَقُتِلَ. …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4355، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4355 (Prescribed Punishments (Kitab Al-Hudud)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 4355، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 4355 (Castigos Prescritos (Kitab Al-Hudud)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
