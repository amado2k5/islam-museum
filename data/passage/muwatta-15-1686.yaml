label: { ar: "الموطأ 1686 — نافع وزيد بن أسلم عن سليمان بن يسار: الأحوص هلك بالشام حين دخلت امرأته في الدم من الحيضة الثالثة، فكتب زيد بن ثابت أنها بانت منه ولا يرث أحدهما الآخر", en: "Muwatta 1686" }
summary:
  ar: "يروي مالك عن نافع وزيد بن أسلم عن سليمان بن يسار أن الأحوص هلك بالشام حين دخلت امرأته في الدم من الحيضة الثالثة، وقد كان طلقها. فكتب معاوية بن أبي سفيان إلى زيد بن ثابت يسأله عن ذلك، فكتب إليه زيد إنها إذا دخلت في الدم من الحيضة الثالثة فقد برئت منه، وبرئ منها، ولا ترثه ولا يرثها. {cite:muwatta-maruf-1997 p.90}"
