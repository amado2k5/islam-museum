label: { ar: "الموطأ 1686 — نافع وزيد بن أسلم عن سليمان بن يسار: الأحوص هلك بالشام حين دخلت امرأته في الدم من الحيضة الثالثة، فكتب زيد بن ثابت أنها بانت منه ولا يرث أحدهما الآخر", en: "Muwatta 1686", es: "Muwatta 1686", fr: "Muwatta 1686", ur: "موطا 1686", tr: "El-Muvatta 1686 — Nafi’ ve Zeyd ibn Aslam, Süleyman ibn Yasar’dan rivayetle: El-Ahvas, karısı üçüncü adet dönemine girdiğinde Suriye’de öldü. Bunun üzerine Zeyd ibn Sabit, karısının ondan boşandığını ve ikisinin de birbirlerinden miras almadığını yazdı.", id: "Al-Muwatta 1686 — Nafi’ dan Zayd ibn Aslam berdasarkan riwayat Sulayman ibn Yasar: Al-Ahwas meninggal di Suriah ketika istrinya mengalami haid ketiga, sehingga Zayd ibn Thabit menulis bahwa istrinya diceraikan dan tidak ada di antara mereka yang mewarisi harta satu sama lain." }
summary:
  ar: "يروي مالك عن نافع وزيد بن أسلم عن سليمان بن يسار أن الأحوص هلك بالشام حين دخلت امرأته في الدم من الحيضة الثالثة، وقد كان طلقها. فكتب معاوية بن أبي سفيان إلى زيد بن ثابت يسأله عن ذلك، فكتب إليه زيد إنها إذا دخلت في الدم من الحيضة الثالثة فقد برئت منه، وبرئ منها، ولا ترثه ولا يرثها. {cite:muwatta-maruf-1997 p.90}"
  tr: "Malik, Nafi'den ve Zeyd ibn Aslam da Süleyman ibn Yasar'dan rivayetle, Ahvas'ın karısı üçüncü adet dönemine girdiğinde Suriye'de öldüğünü, kendisinin ise karısından boşandığını söyler. Muaviye ibn Ebu Sufyan, Zeyd ibn Sabit'e bu konuda bir mektup yazmış ve Zeyd ona, eğer kadın üçüncü adet dönemine girerse, ondan kurtulacağını, kendisinin de ondan kurtulacağını ve kadının ondan miras alamayacağını, kendisinin de ondan miras alamayacağını yazmıştır. {cite:muwatta-maruf-1997 s.90}"
  id: "Malik meriwayatkan dari Nafi' dan Zayd ibn Aslam dari Sulayman ibn Yasar bahwa al-Ahwas meninggal di Suriah ketika istrinya memasuki masa haid ketiga, setelah ia menceraikannya. Mu'awiyah ibn Abi Sufyan menulis surat kepada Zayd ibn Thabit menanyakan hal ini, dan Zayd membalas suratnya bahwa jika istrinya memasuki masa haid ketiga, maka ia bebas darinya, dan ia pun bebas darinya, dan istrinya tidak akan mewarisi hartanya, begitu pula ia. {cite:muwatta-maruf-1997 p.90}"
