label: { ar: "الموطأ 476 — عتبان بن مالك الأعمى يسأل النبي أن يصلي في بيته مكاناً يتخذه مصلى", en: "Muwatta 476" }
text: "أين تحب أن أصلي؟"
summary:
  ar: "يرويه مالك عن ابن شهاب عن محمود بن الربيع الأنصاري، في باب جامع الصلاة: كان عتبان بن مالك يؤم قومه وهو أعمى، فقال للنبي إنها تكون الظلمة والمطر والسيل وهو ضرير البصر، وسأله أن يصلي في بيته مكاناً يتخذه مصلى، فجاءه النبي وسأله أين يحب أن يصلي، فأشار له إلى مكان من البيت فصلى فيه. وفي رواية يحيى «محمود بن لبيد»، وينقل المحقق عن ابن عبد البر أنه غلط بيّن، فلم يروه أحد من أصحاب مالك ولا أصحاب ابن شهاب إلا عن محمود بن الربيع (التمهيد 6/227)، ويخرّج الحديث عند البخاري (667) والنسائي (2/80) والشافعي والبيهقي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.244} {cite:muwatta-maruf-1997 p.245}"
