label: { ar: "سنن النسائي 2008 — ساعة الاحتضار والوفاة، دفن وقبر ومرقد", en: "Sunan al-Nasa'i 2008 — a deathbed and last hours; a burial, grave or resting place", ur: "سنن نسائی 2008 — وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد", es: "Sunan al-Nasa'i 2008 — lecho de muerte y últimas horas; entierro, tumba o lugar de descanso.", fr: "Sunan al-Nasa'i 2008 — lit de mort et dernières heures; sépulture, tombe ou lieu de repos" }
text: "أَخْبَرَنَا هَارُونُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنَا أَبُو عَامِرٍ، عَنْ عَبْدِ اللَّهِ بْنِ جَعْفَرٍ، عَنْ إِسْمَاعِيلَ بْنِ مُحَمَّدٍ، عَنْ عَامِرِ بْنِ سَعْدٍ، : أَنَّ سَعْدًا، لَمَّا حَضَرَتْهُ الْوَفَاةُ قَالَ : الْحَدُوا لِي لَحْدًا، وَانْصِبُوا عَلَىَّ نَصْبًا كَمَا فُعِلَ بِرَسُولِ اللَّهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 2008، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2008 (The Book of Funerals), that mentions a deathbed and last hours, a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2008، جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2008 (El Libro de los Funerales), menciona el lecho de muerte y las últimas horas, el entierro, la tumba o el lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan al-Nasa'i n° 2008 (Le Livre des Funérailles) mentionne le lit de mort, les dernières heures, l'inhumation, la tombe ou le lieu de repos. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
