text: |-
  ٤٨٢٠
  ⁦( رحى)⁩ الرحى معروفة وهى مؤتثة والالفمنقلية من الياء تقول همارحيان وقال
  مهلهل
  كأنا غدوة وبى أيدنا • يجنب عنيزة رحيامدير
  وكل من مدّ قال رحاء ورحاآن وأرحية مثل عطاء وعطا آن وأعطية فجعلها منقلبة من
  الواووما أدرى ماجتسه وما صحته وثلاث أرح والكثيرأرحاء ورحوت الرى ورحيتهااذا
  أدرتها ورحت الحيه ترحو وترحت اذا استدارت والرحى قطعة صن الارض تستدير
  وترتفع على ماحواها ورى القوم سبتهم ورحى الحرب حومتها ورحى السححاب مستدارها
  والرحى كركرة البعير والرحى الضرس والارساء الاضراس والارحاء القبائل التى تستقل
  بنفسها وتستغنى عن غيرها والرحى فى قول الراعى • الى ضوء ناربين فردة والرحى • اسم
  موضع والرحى من الابل الطسانة وهى الابل الكثيرة تزدحم ⁦(رخا )⁩ شى رخوورخو
  بكسر الراء وقتحها أى هش ورخى الذى يرني ورخوأ يضاير خ واذاصارر خوا وفرس رخوة
  أى سهلة مسترسلة قال أبوذؤيب
  تعدويه خوصاء يقصم جريها * حلق الرحاية فهى دخوتزع
  أراد فهى شى رخو فاهذ الم يقل رحوة وأرخيت الستروغيره اذا أرسلته وهذه أرخية
  لما أرخيت من نئ وقد استرخى الشئء وقول مافيل
  فأبل واسترخى به انخطب بعدما • أساف ولولا سعينا لم يؤبل
  يريدبه حسنت حاله وأرخت الناقة اذا استرخى صلاها والارحاء ضرب من العدو وتراخى
  السماء أبطأ المطر أبو عبيد الارخاء أن تخلى الفرص وشهوته فى العدوغير متعب له يقال فرس
  مرخاء من خيل مراخ وأنان مرخاء كثيرة الارخاء فى العد وورجل رخالبال أى واسع
  الحال بين الرجاء ممدودورخاه بالضم الرومج اللينة قال الاخفش فى قوله تعالى فسجرناله
  الريح تجرى بأمره رخاءحيث أصاب أى جعلنا هارخاء ⁦(ردى )⁩ ابن السكيت ردى
  الفرس بالفتح يردى ردياورديانا اذارجم الارض ربمابين العدووالمشى الشنديد قال
  الاصمعى تقلت انتجع بن نبهان ما الرديان فقال عد والهاربين آريه ومتمعكه ورديت على
  الجسين وأرديت أى زدت ورديته صدمته ورديت الجر بصخرة أو بعول اذ اضربته بها
  التكسره والمردى جرير مى به ومنه قبل الرجل الشباع انه لمردى حووب وهم مرادى
  الحروب وكذلك المرداة وفى المثل كل ضب عنده عرداته وتش- به بها الناقة فى الصلابه
  فيقال مرداة والرداة:الصخرة والمع الردى قال الراجز
  فحل مخاض كالردى المنقض ورديته بالجارة أرديه رديارميته بها ابن السكيث المرداة
  صخرة تكسر بها الحجارة وردى الغلام إذا رفع إحدى رجليه وقفز بالاخرى ويقال ردى
  فى البئروتردى اذ اسقط فى بنرأ وتهور من جبل بقال ما أدرى أيز ردى أى أين ذهب والرداء
  الذى يلبس وتثنية-م ردا آن وان شئت رداوان لان كل اسم مهمور عدود فلا تخلوهمزته اما
  أن تبكون أصلبة فتتركها فى التثنية على ماهى عليه ولاتة ليه مافتقول جزآن وخطان وامًا
  أن ت-كون للتأنيث فتقلبها فى التننية واوالاغيرتقول صفراوان وسوداوان وامًا أن:_كون
  منقليسة من واوأوياء مثل كسا.وردا. أرملحقة مثل علياء وحرباء ملحقة بسرداح وشملال
  فأنت
