text: "… الجذام لشدّة تحليله وتجفيفه. حراقة جلد القنفذ البرّي نافع من داء الثعلب مخلوطاً بالزفت. الأورام والبثور : القنفذ البحريّ ينفع جلده في أدوية الجَرَبْ، ولحمه نافع جداً من الخنازير. الجراح والقروح : رماد جلده نافع من القروح الوسخة، ويفني اللحم …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 659، يذكر الجذام والبرص، وأسماء الأمراض، ومداواة الجراح، والدواء، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 659, that mentions leprosy and vitiligo, named diseases, the treatment of wounds, the drug, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
