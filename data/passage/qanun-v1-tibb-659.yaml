text: "… الجذام لشدّة تحليله وتجفيفه. حراقة جلد القنفذ البرّي نافع من داء الثعلب مخلوطاً بالزفت. الأورام والبثور : القنفذ البحريّ ينفع جلده في أدوية الجَرَبْ، ولحمه نافع جداً من الخنازير. الجراح والقروح : رماد جلده نافع من القروح الوسخة، ويفني اللحم …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 659، يذكر الجذام والبرص، وأسماء الأمراض، ومداواة الجراح، والدواء، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 659, that mentions leprosy and vitiligo, named diseases, the treatment of wounds, the drug, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 659 کا اقتباس جس میں جذام اور برص، بیماریوں کے نام، زخموں کا علاج، دوا، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 659, que menciona la lepra y el vitíligo, enfermedades específicas, el tratamiento de las heridas, el medicamento, la enfermedad y su remedio; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 659, qui mentionne la lèpre et le vitiligo, maladies nommées, le traitement des plaies, le médicament, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. cildinin 659. sayfasından, cüzzam ve vitiligodan, hastalıkların isimlerinden, yaraların tedavisinden, ilaçlardan ve hastalıklardan bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 1, hlm. 659, yang menyebutkan kusta dan vitiligo, nama-nama penyakit, pengobatan luka, obat-obatan, dan penyakit; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
