text: "… عشر من شعب الإِيمان وهو بابٌ في حبّ النّبي وَلِيه - وفيه نقول: أخبرنا أبو علي الروذباري، أنا أبو بكر ممحمد بن أحمد بن محمويه العسكري، ثنا جعفر بن محمد القلانسي، ثنا آدم بن أبي أياس، أنا شعبة، أنا قتادة، …"
