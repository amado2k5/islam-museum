text: "… عشر من شعب الإِيمان وهو بابٌ في حبّ النّبي وَلِيه - وفيه نقول: أخبرنا أبو علي الروذباري، أنا أبو بكر ممحمد بن أحمد بن محمويه العسكري، ثنا جعفر بن محمد القلانسي، ثنا آدم بن أبي أياس، أنا شعبة، أنا قتادة، …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 129، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 129, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 129 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Shu'ab al-Iman de al-Bayhaqi, vol. 2, pág. 129, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye en su lista."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 2, page 129, mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "El-Beyhakî'nin \"İmanın Dalları\" adlı eserinin 2. cildinin 129. sayfasından, imanın dallarını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 129, yang menyebutkan cabang-cabang iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
