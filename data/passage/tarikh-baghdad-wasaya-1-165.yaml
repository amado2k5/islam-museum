text: "… الا سفيان النورى. ويونس ابن فروة الزنديق، قرنه بزنديق. قال فانه ليطلب، وإنه افى المسجد الحرام فذهب فالقى نفسه بين النساء فيللنه، قيل له لم فعلت قال انهن أرحم، ثم خرج الى البصرة فلم يزل بها حتى مات، فلما احتضر …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 165، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
