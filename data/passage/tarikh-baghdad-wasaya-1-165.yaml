  tr: "El-Hatib El-Bağdadi'nin Bağdat Tarihi, Resimli Cilt 1, sayfa 165'ten bir alıntı, ölüm ve ölüm anından bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
