label: { ar: "نوادر جحا الكبرى، ص 128 — «انقش لي خاتماً فيه \"خس\"\")»", en: "Nawadir Juha al-Kubra, p. 128 — 'Engrave Me a Ring with Khass'", ur: "نوادر جحا الکبریٰ، ص 128 — «میرے لیے «خس» کی انگوٹھی کندہ کرو»", fr: "Nawadir Juha al-Kubra, p. 128 — « Grave-moi une bague avec « khass » »", es: "Nawadir Juha al-Kubra, p. 128 — «Grábame un anillo con «jass»»", tr: "Juha'nın Büyük Fıkraları, s. 128 — “Üzerine ‘marul’ yazılı bir yüzük kazıyın benim için”", id: "Anekdot Hebat Juha, hlm. 128 — “Ukirlah cincin untukku dengan gambar “selada” di atasnya”" }
text: "… انقش لي خاتماً فيه خس جاء مدينة آقَ شَهْرٌ خطَّاط ماهرٌ، فأراد أحد أصحاب الشيخ أن ينقش خاتماً جلد به الأرض : ضرب به الأرض."
summary:
  ar: "جاء خطاط ماهر إلى آق شهر، وأراد صديق خاتماً منقوشاً باسمه حسن، لكن الخطاط يتقاضى على كل حرف، فنقش جحا الخاتم بكلمة خس وقال للخطاط أن ينقل نقطة الحاء إلى آخر الكلمة، ففهم الخطاط وأعطاه الخاتم مجاناً. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  en: "A skilled calligrapher comes to Akshehir, and a friend wants a ring engraved with his name, Hasan, but the calligrapher charges per letter. Juha has the ring engraved with the word 'khass' and tells the calligrapher to move the dot of the ha to the end. The calligrapher understands and gives it free. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  ur: "ایک ماہر خطاط آق شہر آتا ہے اور ایک دوست اپنا نام حسن انگوٹھی پر کندہ کرانا چاہتا ہے، مگر خطاط ہر حرف کی اجرت لیتا ہے۔ جحا انگوٹھی پر لفظ خس کندہ کراتا ہے اور خطاط سے کہتا ہے کہ حا کا نقطہ آخر میں منتقل کر دو۔ خطاط سمجھ جاتا ہے اور انگوٹھی مفت دے دیتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  fr: "Un calligraphe habile vient à Akshehir, et un ami veut une bague gravée à son nom, Hasan, mais le calligraphe fait payer chaque lettre. Juha fait graver la bague du mot « khass » et dit au calligraphe de déplacer le point du ha à la fin. Le calligraphe comprend et la lui donne gratuitement. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  es: "Un hábil calígrafo llega a Akshehir, y un amigo quiere un anillo grabado con su nombre, Hasan, pero el calígrafo cobra por letra. Juha hace grabar el anillo con la palabra «jass» y dice al calígrafo que mueva el punto de la ha al final. El calígrafo lo entiende y se lo da gratis. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
  tr: "Akşehir'e yetenekli bir hattat geldi ve bir arkadaşı Hasan adının yazılı olduğu bir yüzük istedi. Ancak hattat harf başına ücret alıyordu, bu yüzden Juha yüzüğe \"Has\" kelimesini işledi ve hattata \"H\" harfinin noktasını kelimenin sonuna taşımasını söyledi. Hattat anladı ve yüzüğü ona ücretsiz verdi. {cite:juha-nawadir-kubra-djuwaydi s. 128}"
  id: "Seorang kaligrafer terampil datang ke Akşehir, dan seorang temannya ingin sebuah cincin diukir dengan namanya, Hasan. Namun, kaligrafer tersebut mengenakan biaya per huruf, jadi Juha mengukir cincin itu dengan kata \"Khas\" dan menyuruh kaligrafer tersebut untuk memindahkan titik huruf \"H\" ke akhir kata. Kaligrafer itu mengerti dan memberikan cincin itu kepadanya secara gratis. {cite:juha-nawadir-kubra-djuwaydi p. 128}"
