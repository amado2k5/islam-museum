text: "أقصرت الصلاة أم نسيت يا رسول الله؟ فقال رسول الله: أصدق ذو اليدين؟ فقال الناس: نعم"
summary:
  ar: "أول حديث في باب ما يفعل من سلم من ركعتين ساهياً. يرويه يحيى عن مالك عن أيوب السختياني عن محمد بن سيرين عن أبي هريرة: انصرف النبي من ركعتين، فسأله ذو اليدين أقصرت الصلاة أم نسي، فسأل النبي الناس أصدق ذو اليدين، فقالوا نعم، فقام فصلى ركعتين أخريين ثم سلم ثم كبّر فسجد مثل سجوده أو أطول ثم رفع ثم كبّر فسجد مثل سجوده أو أطول ثم رفع. ويخرّجه المحقق عند البخاري ⁦(714، 1228، 7250)⁩ وأبي داود (1009) والترمذي (399) والنسائي (3/22) وابن حبان والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (1/341). {cite:muwatta-maruf-1997 p.147}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang harus dilakukan jika seseorang secara keliru mengucapkan taslim setelah dua rakaat. Diriwayatkan oleh Yahya dari Malik, dari Ayyub al-Sakhtiyani, dari Muhammad ibn Sirin, dari Abu Hurayrah: Nabi (shalawat dan salam kepadanya) selesai shalat dua rakaat, dan Dzu al-Yadayn bertanya kepadanya apakah shalatnya dipersingkat atau apakah ia lupa. Nabi (shalawat dan salam kepadanya) bertanya kepada orang-orang apakah Dzu al-Yadayn mengatakan yang sebenarnya, dan mereka menjawab ya. Maka ia berdiri dan shalat dua rakaat lagi, kemudian mengucapkan taslim, kemudian mengucapkan takbir dan sujud seperti sujudnya sebelumnya atau lebih lama, kemudian ia berdiri, kemudian mengucapkan takbir dan sujud seperti sujudnya sebelumnya atau lebih lama, kemudian ia berdiri. Redaksi memasukkannya ke dalam kumpulan al-Bukhari (714, 1228, 7250), Abu Dawud (1009), al-Tirmidzi (399), al-Nasa'i (3/22), Ibnu Hibban, dan al-Syafi'i melalui rantai risalah sahabat Malik, dan mengacu pada al-Tamhid (1/341). {mengutip:muwatta-maruf-1997 hal.147}"
