label: { ar: "الموطأ 247 — حديث ذي اليدين: أقصرت الصلاة أم نسيت؟", en: "Muwatta 247" }
text: "أقصرت الصلاة أم نسيت يا رسول الله؟ فقال رسول الله: أصدق ذو اليدين؟ فقال الناس: نعم"
summary:
  ar: "أول حديث في باب ما يفعل من سلم من ركعتين ساهياً. يرويه يحيى عن مالك عن أيوب السختياني عن محمد بن سيرين عن أبي هريرة: انصرف النبي من ركعتين، فسأله ذو اليدين أقصرت الصلاة أم نسي، فسأل النبي الناس أصدق ذو اليدين، فقالوا نعم، فقام فصلى ركعتين أخريين ثم سلم ثم كبّر فسجد مثل سجوده أو أطول ثم رفع ثم كبّر فسجد مثل سجوده أو أطول ثم رفع. ويخرّجه المحقق عند البخاري (714، 1228، 7250) وأبي داود (1009) والترمذي (399) والنسائي (3/22) وابن حبان والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (1/341). {cite:muwatta-maruf-1997 p.147}"
