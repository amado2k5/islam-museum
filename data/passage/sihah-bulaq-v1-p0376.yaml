text: |-
  ⁦(ف صل الواو )⁩ .
  ٢٦٥
  لوشنت قد نقع الفؤاد بشرية * تدع الموادى لايجدن غليلا
  ووجدضالته وجدانا ووجد عليه فى الغضب موجدة ووجدانا أيضاحكاها بعضه-م
  وأنشد* كلانارد صاحبه بغيظ » على حفق ووحدان شديد * ووحد فى الحزن وجد ابالفتج
  ووجد فى المال وجدا و وجدا ووجداوجدة أى استغنى وأوجده اللّٰه مطلويه أى أظفره به
  وأوجده أى أغناه يقال الهدلله الذى أوجدنى بعدذة روآ اجدنى بعد ضعف أى قوانى
  ووجد الشئ عن عدم فهوموج ود مشل حمّذه ومحموم وأوجده اللّٰه ولا يقال وجده
  كمالا يقال جه وتوج-دت لفلان أى حزنت له ⁦(وحد)⁩ الوحدة الاتفرادقول رأيته
  وحده وهو منصوب عند أهل الكوفة على الظرف وعند أهل البصرة على المصدرفى كل
  حال كأنك قات أوحدته برؤيتى ايحادا أى لم أرغيره ثم وضعت وحده هذا الموضع وقال
  أبو العباس يحتمل أيضا وجها آخر وهوأن يكون الرجل فى نفسه منفرداكأنك قلت رأيت
  رحلا منفردا انفراداثم وضعت وحده موضعه ولايضاف الافى قولهم فلان نسيج وحده
  وهومدح وححيشْ وحده وعيير وحده وهماذم كانك قلت نسيج إفراد فلما وضعت وحده
  موضع مصدر مجرور جررته وربما فالوارجيل وحده والواحد أوّل العددوالجع وحدان
  وأحدان مثل شاب وشبان وراع ورعيان قار الفرّاء يقال أنتم حى واحد وحى واحدون
  كما يقال شرذمة قليلون (وأنشد للكميت
  فضم قواصى لاحياء منهم * فقدرجعوا كى واحدينا
  ويتسال وحده وأحده كما يقال ثناه وئلثه ورجل وحد ووحد( 4٠ وحيد أى منفرد وتوحد
  برأيه تفرديه وبنو الوحيد بطن من العرب من بنى كلاب بن ربيعة بن عامر بن صعصعة وتوحده
  اللّٰه بعصمته أى عصمه ولم يكاه الى غيره وأوحدت الشاة فهى هوحد أى وضعت واحد امشل
  أفذت وفلان واحددهره أى لا تطرله وفلان لا واحدله وآوحده الله جعله واحسدزمانه
  وفلان أوحدأهل زمانه والجع أحدان مشل أسودوسودان وأصله وحدان
  قال الكميت فباكره والشمس لم يبدقرنها بأحدانه المستواغات المكاب
  يعنى كلا به التى لا مثلها كلاب أى هى واحدة الكلاب ويقال لست فى هذا الاهر بأوحد
  ولا يقال للانى وحداء وتقول أعط كل واحدمنهم على حسدة أى على حصاله والهاءعوض.
  من الواوود خلوام وحد موحد أى فرادى وقواهم أحاد ووحادو. وحدغير مصروفات لما
  ذكرناه فى ثلاث والميهاد من الواحد كالمعشار من العشرة ⁦( وخد )⁩ الوخدضرب من
  سير الابل وقد وخد البعير يخد وخداووخدانا وهو أن يرمى بة وائمه كشى النعام فهو واخد
  ووخاد (ودد تقول وددت لوتفعل ذالكوودت لوأنك تفعل ذالأودّودا وودا وودادة
  ووداداأى تمنيت قال الشاعر
  وددت ودادة لوأن حظى • من الخلان أن لايصرمونى
  ووددت الرجل أودّه ودّااذا أحيبته والودّ والود والود المودة تقول بودى أن يكون
  كداوأماقول الشاءر أيها العائد المسائل عنا • وبوديك لوترى أكفانى .
  فاغ- أسبع كسرة الدال ايستقيم له البيت فصارت ياء والود الوديد والجمع أود مثل قدح
  ١ حد الأول بفغ الحاء
  والثانى بكسرها اه
