label: { ar: "الموطأ 2387 — صفية بنت أبي عبيد: أبو بكر يجلد من اعترف بالزنا ثم ينفيه إلى فدك", en: "Muwatta 2387", es: "Muwatta 2387", fr: "Muwatta 2387", ur: "موطا 2387", tr: "El-Muvatta 2387 — Safiyya bint Abi Ubayd: Ebu Bekir, zina itirafında bulunan herkesi kırbaçlar ve sonra Fadak'a sürgün ederdi.", id: "Al-Muwatta 2387 — Safiyya bint Abi Ubayd: Abu Bakr akan mencambuk siapa pun yang mengaku berzina dan kemudian mengusirnya ke Fadak." }
summary:
  ar: "يروي مالك عن نافع أن صفية بنت أبي عبيد أخبرته أن أبا بكر الصديق أُتي برجل وقع على جارية بكر فأحبلها، ثم اعترف على نفسه بالزنا ولم يكن أحصن، فأمر به أبو بكر فجُلد الحد، ثم نُفي إلى فدك. {cite:muwatta-maruf-1997 p.388}"
  tr: "Malik, Nafi’den rivayetle, Safiyya bint Ebu Ubeyd’in kendisine, Ebu Bekir es-Siddik’e bakire bir cariye ile ilişkiye girip onu hamile bırakan bir adamın getirildiğini anlattığını aktarır. Adam evli olmamasına rağmen zina yaptığını itiraf etmiş. Ebu Bekir, adamın belirlenen cezaya göre kırbaçlanmasını ve ardından Fadak’a sürgün edilmesini emretmiştir. {cite:muwatta-maruf-1997 s.388}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Safiyya binti Abi Ubayd menceritakan kepadanya bahwa Abu Bakr as-Siddiq didatangi seorang pria yang telah bersetubuh dengan seorang budak perempuan perawan dan menghamilinya. Kemudian pria itu mengaku berzina, meskipun ia belum menikah. Abu Bakr memerintahkan agar pria itu dicambuk sesuai dengan hukuman yang telah ditetapkan, dan kemudian diasingkan ke Fadak. {cite:muwatta-maruf-1997 p.388}"
