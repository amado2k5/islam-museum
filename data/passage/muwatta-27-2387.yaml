summary:
  ar: "يروي مالك عن نافع أن صفية بنت أبي عبيد أخبرته أن أبا بكر الصديق أُتي برجل وقع على جارية بكر فأحبلها، ثم اعترف على نفسه بالزنا ولم يكن أحصن، فأمر به أبو بكر فجُلد الحد، ثم نُفي إلى فدك. {cite:muwatta-maruf-1997 p.388}"
