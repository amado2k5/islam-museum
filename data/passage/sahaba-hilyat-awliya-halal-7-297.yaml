text: "- - حدثنا محمد بن إبراهيم ثنا محمد بن الحسن بن قنيبة ثنا المسيب بن واضح قال سئل ابن عيينة عن الزهدما هو قال : الزهد فما حرم اللّٰه فاما ما أحل اللّٰه فقد أبا حكه اللّٰه، فاز النبيين قد …"
summary:
