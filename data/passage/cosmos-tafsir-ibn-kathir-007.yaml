text: "أَرْضًا بَيْضَاءَ نُورُهَا سَاحَتُهَا -أو قال: سَاحَتُهَا نُورُهَا - مَسيرَةُ الشَّمْسِ أَرْبَعِينَ يَوْمَا، بِهَا خلقٌ من خَلْقٍ اللهِ تَعَالَىٰ لَمْ يَعْصُوا اللهَ طَرْفَةَ عَيْنِ قَطُّ"
summary:
  ar: "يذكر ابن كثير خبر عثمان بن أبي دهرش أن النبي قال لأصحابه المتفكرين في خلق الله إن في جهة المغرب أرضاً بيضاء فيها خلق من خلق الله لم يعصوه طرفة عين؛ ثم يحكم عليه بأنه حديث مرسل منكر جداً، وكذلك يفعل المحقق في الحاشية."
  en: "Ibn Kathir reports from Uthman ibn Abi Dahrash that the Prophet told companions reflecting on God's creation that in the west lies a white land whose people never disobeyed God for the blink of an eye. He then judges it a mursal report and extremely objectionable, and the edition's footnote agrees."
  es: "Ibn Kathir relata que Uthman ibn Abi Dahrash dijo que el Profeta comentó a sus compañeros, mientras reflexionaban sobre la creación de Dios, que en Occidente se encuentra una tierra blanca cuyos habitantes jamás desobedecieron a Dios ni por un instante. Luego, lo considera un relato mursal y sumamente reprobable, y la nota al pie de la edición coincide con esta opinión."
  fr: "Ibn Kathir rapporte d'après Uthman ibn Abi Dahrash que le Prophète a dit à ses compagnons, méditant sur la création divine, qu'à l'ouest se trouve une terre blanche dont les habitants n'ont jamais désobéi à Dieu, pas même un instant. Il qualifie ensuite ce hadith de récit mursal et l'estime extrêmement contestable, ce que confirme la note de bas de page de l'édition."
  ur: "ابن کثیر نے عثمان بن ابی دہراش سے روایت کی ہے کہ رسول اللہ نے اللہ کی مخلوق پر غور کرنے والے صحابہ سے فرمایا کہ مغرب میں ایک سفید زمین ہے جس کے لوگوں نے پلک جھپکنے کے لیے بھی اللہ کی نافرمانی نہیں کی۔ اس کے بعد وہ اسے مرسل رپورٹ اور انتہائی قابل اعتراض قرار دیتا ہے، اور ایڈیشن کا حاشیہ متفق ہے۔"
  tr: "İbn Kathir, Osman ibn Abi Dahrush'un rivayetine göre Peygamber'in, Allah'ın yaratılışını tefekkür eden sahabelerine, batıda beyaz bir toprak olduğunu ve orada Allah'ın yaratıklarının bulunduğunu, bu yaratıkların O'na bir an bile isyan etmediklerini söylediğini aktarır; daha sonra bunun çok sakıncalı, mursal bir hadis olduğunu belirtir ve editör de dipnotta aynı değerlendirmeyi yapar."
  id: "Ibn Kathir menyebutkan riwayat Uthman ibn Abi Dahrush bahwa Nabi bersabda kepada para sahabatnya yang sedang merenungkan ciptaan Allah bahwa di sebelah barat terdapat sebuah negeri putih yang dihuni oleh makhluk-makhluk ciptaan Allah yang tidak pernah durhaka kepada-Nya bahkan sesaat pun; kemudian ia menilai hadits tersebut sebagai hadits mursal yang sangat tidak pantas, dan hal yang sama dilakukan oleh editor dalam catatan kaki."
