text: "… وانضاف إلى اليهود أنَاسُ من الأَوس والخزرج ممن كان عَمَا فى الجاهلية، فكانوا أَهل نِفَاق على دين آبائهم من الشَّرْك والتكذيب بالبعث، إلا أن الإسلام قهرهم بظهوره، ت واجتماع قومهم عليه، فتظاهروا بالإسلام واتخذوه جُنَّةً من القتل ونافقوا فى السِّرّ، …"
