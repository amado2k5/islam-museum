text: "… لعب فتمجه القلوب. حدثنا أبو بكر الطلحى ثنا الحسن بن حباش حدثنى محمد بن مسلم بن وارة ثنا على بن فنام عن أبيه قال قال سفيان: مثل العالم مثل الطبيب ! الدواء إلاً على موضع الداء."
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 6، ص 368، يذكر الطب والطبيب، والدواء، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 6, p. 368, that mentions medicine and the physician, the drug, the disease and its remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 6، ص 368 کا اقتباس جس میں طب اور طبیب، دوا، بیماری کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen escaneado 6, pág. 368, que menciona la medicina y el médico, el medicamento, la enfermedad y su remedio; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 6, p. 368, qui mentionne la médecine et le médecin, le médicament, la maladie et son remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 6. cildinin 368. sayfasından, tıp, hekim, ilaç ve hastalıktan bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Hilyat al-Awliya’ karya Abu Nu’aym, jilid bergambar 6, hlm. 368, yang menyebutkan tentang kedokteran, dokter, obat-obatan, dan penyakit; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
