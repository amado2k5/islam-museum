text: "… نهيتكم عن الأشربة إلا في ظروف الأدّم، فاشربوا في كل وعاء، غير ألا تشربوا مسكراً، وفي لفظ مسلم : نهيتكم عن الظروف، وإن الظرف لا يحل شيئاً، ولا يحرمه، وكل مسكر حرام أخرجه مسلم، وأبو داود، والنسائي عن عبد اللّٰه …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 57، يذكر ما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 57, that mentions what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 57 کا اقتباس جس میں جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 2, pág. 57, que menciona lo que no es lícito, lo ilícito y lo que se ha declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
