text: "… مَعبد بن كَعْب بن مالك الأنصارى. الحصار قال : وحاصرهم رسولُ اللّه خمسا وعشر ين ليلة حتى. جَهدهم الحصبار، وقذفَ اللّٰهُ فى قُلوبهم الرعبَ.. وقد كان حُيى بن أخطب دخل مع بنى قريطة في حصنهم، حين رجعت. عنهم قُريش وغَطفان، …"
