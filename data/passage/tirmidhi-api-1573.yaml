label: { ar: "جامع الترمذي 1573 — بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 1573 — dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 1573 — والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 1573 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos" }
text: "… سَعِيدِ بْنِ أَبِي عَرُوبَةَ، عَنْ قَتَادَةَ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنْ مَعْدَانَ بْنِ أَبِي طَلْحَةَ، عَنْ ثَوْبَانَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ فَارَقَ الرُّوحُ الْجَسَدَ وَهُوَ بَرِيءٌ مِنْ ثَلاَثٍ الْكَنْزِ وَالْغُلُولِ وَالدَّيْنِ دَخَلَ الْجَنَّةَ \". هَكَذَا قَالَ سَعِيدٌ الْكَنْزَ وَقَالَ أَبُو عَوَانَةَ فِي حَدِيثِهِ الْكِبْرَ وَلَمْ يَذْكُرْ فِيهِ عَنْ مَعْدَانَ وَرِوَايَةُ سَعِيدٍ أَصَحُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1573، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1573 (The Book on Military Expeditions), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1573، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1573 (El Libro de las Expediciones Militares), menciona la obediencia o desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
