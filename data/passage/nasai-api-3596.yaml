label: { ar: "سنن النسائي 3596 — الأب والأبوة", en: "Sunan al-Nasa'i 3596 — the father and fatherhood", ur: "سنن نسائی 3596 — باپ اور والدیت", es: "Sunan al-Nasa'i 3596 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3596 — Le père et la paternité" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا أَبُو بَكْرٍ الْحَنَفِيُّ، قَالَ حَدَّثَنَا يُونُسُ بْنُ أَبِي إِسْحَاقَ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ عَمْرَو بْنَ الْحَارِثِ، يَقُولُ رَأَيْتُ رَسُولَ اللَّهِ مَا تَرَكَ إِلاَّ بَغْلَتَهُ الشَّهْبَاءَ وَسِلاَحَهُ وَأَرْضًا تَرَكَهَا صَدَقَةً."
summary:
  ar: "حديث في سنن النسائي، رقم 3596، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3596 (The Book of Endowments), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3596، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3596 (El Libro de las Bendiciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3596 (Le Livre des dotations), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
