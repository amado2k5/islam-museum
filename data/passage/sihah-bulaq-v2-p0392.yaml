text: |-
  • ⁦(باب اللام)⁩•
  • ⁦(سبل)⁩.
  ١٩٥
  والمزاملة المعادلة عسلى البعبر وزمله فى توبه أى لفه وتزقل بثيابه أى تدثر وازد ملد أى احتمل
  والزميل الرديف ول الزول الهجب قال السكميت
  فقد صرت عمالها بالمشيهب زولالديها هو الازول.
  والجمع الازوال والزول الرجل الخفيف الظريف قال ابن السكيت يعجب من ظرفه والمرأة
  زولة ويقال هى الفطنة الداهية والزوّال الذى يتحرّك ف مشيته كثيرا وما يقطعه من المسافة
  نليل وأنشد أبو عمروه البحتر المجذر الزوال • والزائلة كل شئء يتحرّك وقال
  وكنت امر أ أرى الزوائسل مزة • فأصحت قد ودعت رمى الزوائل
  والازديال الازالة وقال • ممن أراد ازديالهساه والمزاولة مثل الهاولة والمعالجة وقال رجل
  لا خرعيره بالجين واللّٰه ما كنت حبانا واسكنى زاوات ملكامؤجلا وقال زهير
  فبتنا وقوفاعندرأس جوادنا • يزاولنا ءن نفسه ونزاوله
  وتزاولوا تعالجوا وزال الشئء من مكانه يزول زوالا وأز اله غسيره وزوّله فانزال ومازال فلان
  يفعل كذاوحكى أبو انلجطاب مازيل يقعل كذا ودقسرناه فى كاد هل الزهلول
  الاملس وزهلول جبل يل زات الشى من مكانه أزيله زيلااغة فى أزلته يقال زال
  اللّٰه زوإله وأزال اللّٰه زواله بعنى اذادعى عليه بالبلاء والهلاك قال الاعشى
  هذا النهاربد الهامن همها • ما بالها بالليل زال زوالها
  ويال أيضازيل رويله قال ذوارمة •اذا مارأ تنازيل منازويلها• أى زيل قلبها من الفزع
  وزات الشى أزيلدزيلا أى حزته وفرقته يقال زل ضأنك من معزاك وزلته منسه فلم ينزل
  وحنته فلم ينمز وزيلته قنزيل أى فرقته فتفرّق ومنه قوله تعالى فزيلنا بيتهم وهو فعات لانك
  تقول فى مصدرم تزبيلا ولوسكات فيعلت لقلت زيلة والمزايلة المفارقة بقال زايله عزايلة
  وزيالا اذا فارقه والتزايل التباين والزيل بالتهر يك تياعدمابين الفحغذين كالفحج
  صل المين أل السؤل ما يسأل الانسان وقسرئ أوتيت سؤلك ياموسى
  بالهمزو بغير الهمز وسألته الشى وسألته عن الشئ موالا ومسئلة وقوله تعالى-أل سائل
  بعذاب واقع أى عن عذاب قال الاخفش يقال خرجنا نسأل عن فلان وبفلان وقد تحفف
  همزته فيقال سال يسال وقال
  ومرهق سال امتاعا بأصسدته • لم يستعن وحوامى الموت تغشاه
  والاهر منه سل لحركة الحرف الثانى من المستقبل ومن الأول اسأل ووجل سولة كثر
  السؤال وتساء لوا أى سأل بعضه-م بعضا وأسألته سؤلمه ومسئلته أى قضيت حاجته
  بل) السبل بالتصريك المطر والسسبل أيضا السقبل وقد أسبل الزرع أى خرج سنبله
  وقول الشاءر ( ٣
  وخيل كأسراب القطاقدوزءتها • لهاسبل فيه المنية قلمع
  يعنى به الرمح وأسيل المطر والدمع اذا هطل وقال أبوز يد أسبات السماء والاسم السسبل
  وهو المطر بين السصاب والارض حين يخرج من السحاب ولم يصل الى الارض وأسبل
  ازاره أى أرخاه وسبل اسم فرس نجيب فى العرب قال الاصمعى هى أمّأ ،وج كانت لغ-ى"
  قوله والزوال الذى يتحركو الخ
  فى القاموس وأمّنْ الزوّاك للذى
  يتصوّك فى مشينه كثيرا ومايقطعه
  من المسافة قليل قليكن بالكاف
  لا باللام وغلط الجوهرى فى اللغة
  والجزواتما الارجونة كافيسة
  وأولها
  تعرّضت هرقية الحداك
  لناشئ دمكمك نيلة
  البحتر الجذر الزواف
  فأرّها بضامخ بكالْ
  فأوركت لطعنه الدرّاك
  عند اظلاط أيما اراك
  فداكها بصيلم دوّاك
  يدلكها فى ذلك العرال
  بااقذة ريتر أيماتدلاك
  اه ورواء المصنف أيضا فى جذر
  والبحنر وبائلام أيضا اه
  قوله زيل منافى نسخة منهااه
  ⁦( ٣)⁩ فى فسخة زيادة مجمع بن
  حلال البكركة اه
