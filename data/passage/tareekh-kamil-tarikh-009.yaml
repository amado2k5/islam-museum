text: "غنم إلى الجزيرة. وقيل: إن أبا عبيدة لما توفي استخلف عياضا فورد عليه كتاب عمر بولايته حمص وقنسرين والجزيرة، فسار إلى الجزيرة سنة ثماني عشرة للنصف من شعبان في خمسة آلاف، وعلى ميمنته سعيد بن عامر بن حذيم الجمحي، وعلى"
