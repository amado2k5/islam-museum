label: { ar: "الموطأ 732 — مالك: الزيتون بمنزلة النخيل في العشر ونصف العشر، ولا يخرص شيء منه في شجره", en: "Muwatta 732", es: "Muwatta 732", fr: "Muwatta 732", ur: "موطا 732", tr: "Al-Muwatta 732 — Malik: Zeytinler, zekât ve yarım zekât açısından hurma gibi değerlendirilir ve ağaçta oldukları sürece üzerlerinde herhangi bir değer biçilmez.", id: "Al-Muwatta 732 — Malik: Buah zaitun diperlakukan seperti kurma dalam hal persepuluhan dan setengah persepuluhan, dan tidak ada pajak yang dikenakan padanya selama masih berada di pohon." }
summary:
  ar: "قول لمالك: الزيتون بمنزلة النخيل، ما كان منه سقته السماء والعيون أو كان بعلاً ففيه العشر، وما كان يُسقى بالنضح ففيه نصف العشر، ولا يُخرص شيء من الزيتون في شجره. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.366}"
  tr: "Malik şöyle demiştir: Zeytinler hurma ağaçları gibidir; yağmurla veya pınarlarla sulananlar veya sulama yapılmadan yetişenler zekâta tabidir; yapay yollarla sulananlar ise zekâtın yarısına tabidir. Ağaçtaki zeytin verimi için herhangi bir tahmin yapılmamıştır. Araştırmacı, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.366}"
  id: "Malik berkata: Pohon zaitun itu seperti pohon kurma; yang disirami air hujan atau mata air, atau yang ditanam tanpa irigasi, dikenakan persepuluhan; yang diairi dengan cara buatan dikenakan setengah persepuluhan. Tidak ada perkiraan hasil panen zaitun di pohonnya. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.366}"
