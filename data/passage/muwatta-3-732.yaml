summary:
  ar: "قول لمالك: الزيتون بمنزلة النخيل، ما كان منه سقته السماء والعيون أو كان بعلاً ففيه العشر، وما كان يُسقى بالنضح ففيه نصف العشر، ولا يُخرص شيء من الزيتون في شجره. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.366}"
