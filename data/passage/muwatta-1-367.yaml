label: { ar: "الموطأ 367 — عائشة تملي في مصحفها: والصلاة الوسطى وصلاة العصر", en: "Muwatta 367" }
summary:
  ar: "أول حديث في باب الصلاة الوسطى. يرويه يحيى عن مالك عن زيد بن أسلم عن القعقاع بن حكيم عن أبي يونس مولى عائشة: أمرته عائشة أن يكتب لها مصحفاً وأن يؤذنها إذا بلغ آية البقرة في المحافظة على الصلوات والصلاة الوسطى، فلما بلغها أملت عليه الآية بزيادة ذكر صلاة العصر بعد الصلاة الوسطى، وقالت إنها سمعتها من رسول الله؛ وهي قراءة تفسيرية تبين أن الوسطى عندها العصر. ويخرّجه المحقق عند مسلم (2/112) وأبي داود (410) والترمذي (2982) والنسائي (1/236) وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (4/273). {cite:muwatta-maruf-1997 p.200} {cite:muwatta-maruf-1997 p.201}"
