label: { ar: "الموطأ 367 — عائشة تملي في مصحفها: والصلاة الوسطى وصلاة العصر", en: "Muwatta 367", es: "Muwatta 367", fr: "Muwatta 367", ur: "موطا 367", tr: "Al-Muwatta 367 — Aişe, Kur'an-ı Kerim nüshasında şöyle dikte ediyor: “Ve öğle namazı ve ikindi namazı.”", id: "Al-Muwatta 367 — Aisyah mendiktekan dalam salinan Al-Qurannya: “Dan salat 40 hari dan salat 50 hari.”" }
summary:
  ar: "أول حديث في باب الصلاة الوسطى. يرويه يحيى عن مالك عن زيد بن أسلم عن القعقاع بن حكيم عن أبي يونس مولى عائشة: أمرته عائشة أن يكتب لها مصحفاً وأن يؤذنها إذا بلغ آية البقرة في المحافظة على الصلوات والصلاة الوسطى، فلما بلغها أملت عليه الآية بزيادة ذكر صلاة العصر بعد الصلاة الوسطى، وقالت إنها سمعتها من رسول الله؛ وهي قراءة تفسيرية تبين أن الوسطى عندها العصر. ويخرّجه المحقق عند مسلم (2/112) وأبي داود (410) والترمذي (2982) والنسائي (1/236) وأحمد والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (4/273). {cite:muwatta-maruf-1997 p.200} {cite:muwatta-maruf-1997 p.201}"
  id: "Hadits pertama dalam surah ini membahas tentang salat khazi. Diriwayatkan oleh Yahya dari Malik, dari Zaid bin Aslam, dari al-Qa'qa' bin Hakim, dari Abu Yunus, budak yang dibebaskan oleh Aisyah: Aisyah menyuruhnya untuk menulis salinan Al-Quran untuknya dan memberitahukannya ketika ia sampai pada ayat dalam Surah Al-Baqarah tentang pelaksanaan salat, khususnya salat khazizi. Ketika ia sampai pada ayat tersebut, Aisyah mendiktekan ayat itu kepadanya, menambahkan penyebutan salat Ashar setelah salat khazizizi, dan ia berkata bahwa ia mendengarnya dari Rasulullah shalla Allahu alaihi wa sallam. Ini adalah penafsiran yang menjelaskan bahwa, menurut pandangannya, salat khazizizizi adalah salat Ashar. Redaksi memuatnya dalam Muslim (2/112), Abu Dawud (410), al-Tirmidzi (2982), al-Nasa'i (1/236), Ahmad, dan al-Bayhaqi melalui rantai penularan sahabat Malik, dan mengacu pada al-Tamhid (4/273). {kutip:muwatta-maruf-1997 hal.200} {kutip:muwatta-maruf-1997 hal.201}"
