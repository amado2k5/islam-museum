label: { ar: "موطأ مالك 756 — ما أُحل، ما حُرّم", en: "Muwatta Malik 756 — what was made lawful; what was made unlawful", ur: "موطأ مالک 756 — جو حلال کیا گیا، جو حرام کیا گیا", es: "Muwatta Malik 756 — lo que se hizo lícito; lo que se hizo ilícito", fr: "Muwatta Malik 756 — ce qui a été rendu licite; ce qui a été rendu illicite", tr: "Muwatta Malik 756 — Neler helaldir, neler haramdır", id: "Muwatta Malik 756 — Apa yang diperbolehkan, apa yang dilarang" }
text: "… يَخْرُجُ بِالْهَدْىِ غَيْرُ مُحْرِمٍ فَقَالَ نَعَمْ لاَ بَأْسَ بِذَلِكَ. وَسُئِلَ أَيْضًا عَمَّا اخْتَلَفَ فِيهِ النَّاسُ مِنَ الإِحْرَامِ لِتَقْلِيدِ الْهَدْىِ مِمَّنْ لاَ يُرِيدُ الْحَجَّ وَلاَ الْعُمْرَةَ فَقَالَ الأَمْرُ عِنْدَنَا الَّذِي نَأْخُذُ بِهِ فِي ذَلِكَ قَوْلُ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ إِنَّ رَسُولَ اللَّهِ بَعَثَ بِهَدْيِهِ ثُمَّ أَقَامَ فَلَمْ يَحْرُمْ عَلَيْهِ شَىْءٌ مِمَّا أَحَلَّهُ اللَّهُ لَهُ حَتَّى نُحِرَ هَدْيُهُ."
summary:
  ar: "حديث في موطأ مالك، رقم 756، يذكر ما أُحل، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 756 (Hajj), that mentions what was made lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 756، جس میں جو حلال کیا گیا، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 756 (Hajj), menciona lo que se ha hecho lícito y lo que se ha hecho ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 756 (Hajj), mentionne ce qui a été rendu licite et ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Malik'in Muwatta'sında yer alan 756 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve Haram sözlüğünün bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 756, menyebutkan apa yang diperbolehkan dan apa yang diharamkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
