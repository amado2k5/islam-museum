label: { ar: "سنن ابن ماجه 3719 — خبر من أخبار الظرفاء والمغفلين", en: "Sunan Ibn Majah 3719 — a report of the wits and the fools", ur: "سنن ابن ماجہ 3719 — ظریفوں اور مغفلوں کی ایک خبر", fr: "Sunan Ibn Majah 3719 — un récit des beaux esprits et des sots", es: "Sunan Ibn Majah 3719 — un relato de ingeniosos y necios", tr: "Sunan İbn Majah 3719 — Zeki ve aptal insanlar hakkında bir hikaye", id: "Sunan Ibn Majah 3719 — Kisah tentang orang-orang yang cerdas dan bodoh" }
text: "… صَالِحٍ، عَنِ الزُّهْرِيِّ، عَنْ عَبْدِ اللَّهِ بْنِ وَهْبِ بْنِ زَمْعَةَ، عَنْ أُمِّ سَلَمَةَ، قَالَتْ خَرَجَ أَبُو بَكْرٍ فِي تِجَارَةٍ إِلَى بُصْرَى قَبْلَ مَوْتِ النَّبِيِّ ـ بِعَامٍ وَمَعَهُ نُعَيْمَانُ وَسُوَيْبِطُ بْنُ حَرْمَلَةَ وَكَانَا شَهِدَا بَدْرًا وَكَانَ نُعَيْمَانُ عَلَى الزَّادِ وَكَانَ سُوَيْبِطٌ رَجُلاً مَزَّاحًا فَقَالَ لِنُعَيْمَانَ أَطْعِمْنِي. قَالَ حَتَّى يَجِيءَ أَبُو بَكْرٍ. قَالَ فَلأُغِيظَنَّكَ. قَالَ فَمَرُّوا بِقَوْمٍ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3719، فيه خبر من أخبار الظرفاء والمغفلين. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Ibn Majah, no. 3719, with a report of the wits and the fools. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3719، جس میں ظریفوں اور مغفلوں کی ایک خبر ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Ibn Majah, n° 3719, avec un récit des beaux esprits et des sots. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Ibn Majah, n.º 3719, con un relato de ingeniosos y necios. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "İbn Majah'ın Sünen'inde yer alan 3719 numaralı hadis, zeki ve aptal insanlar hakkında bir hikaye içerir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3719, memuat kisah tentang orang-orang yang cerdas dan bodoh. Hadits ini disusun oleh Juha dan merupakan kumpulan cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
