text: "… فقال النبي، وَلَل، يا أخا تَنُوخ. فأَقبلت أَهْوي حتى كنت قائماً بين يديه، فجعل حبوته عن ظهره، ثم قال: ها هنا، أمْضٍ لما أمرت به. فجُلْت في ظهره، فإذا أنا بخاتم في موضع غُضْرُوفِ الكتف مثل المِحْجَمَةِ الضَّخْمة. أخبرني أبو …"
