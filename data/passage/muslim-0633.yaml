label: { ar: "مسلم 633 — إنكم سترون ربكم كما ترون هذا القمر لا تضامون في رؤيته", en: "Muslim 633 — You will see your Lord as you see this moon, unharmed in seeing Him", es: "Muslim 633 — Verás a tu Señor como ves esta luna, ileso al verlo.", fr: "Muslim 633 — Tu verras ton Seigneur comme tu vois cette lune, sans être affecté par sa vue.", ur: "مسلم 633 - تم اپنے رب کو اس طرح دیکھو گے جس طرح تم اس چاند کو دیکھ رہے ہو، اسے دیکھنے میں کوئی نقصان نہیں پہنچا", tr: "Müslim 633 — Rabbinizi, bu ayı gördüğünüz gibi, hiçbir zorluk çekmeden göreceksiniz.", id: "Muslim 633 — Kamu akan melihat Tuhanmu sebagaimana kamu melihat bulan ini, tanpa kesulitan sedikit pun dalam melihat-Nya." }
text: "قال رسول الله، وقد نظر إلى القمر ليلة البدر: «أما إنكم سترون ربكم كما ترون هذا القمر، لا تضامون في رؤيته؛ فإن استطعتم أن لا تغلبوا على صلاة قبل طلوع الشمس وقبل غروبها فافعلوا»"
summary:
  ar: "رواية جرير بن عبد الله في باب رؤية المؤمنين ربهم من كتاب صلاة المسافرين في صحيح مسلم؛ يربط حفظ صلاتي الفجر والعصر برؤية الله، ويقرأ جرير بعدها آية طه."
  tr: "Sahih Müslim'deki yolculuk duaları kitabında, müminlerin Rablerini görmeleri bölümünde Cerir bin Abdullah'ın rivayetinde; Cerir, sabah ve ikindi namazlarını ezberlemeyi Allah'ı görmekle ilişkilendirir ve ardından Taha ayetini okur."
  id: "Riwayat Jarir bin Abdullah dalam bab tentang orang-orang beriman yang melihat Tuhan mereka dari kitab doa musafir dalam Sahih Muslim; beliau menghubungkan hafalan salat Subuh dan Ashar dengan melihat Tuhan, dan Jarir kemudian membaca ayat Taha."
