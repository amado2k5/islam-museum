label: { ar: "مسلم 633 — إنكم سترون ربكم كما ترون هذا القمر لا تضامون في رؤيته", en: "Muslim 633 — You will see your Lord as you see this moon, unharmed in seeing Him" }
text: "قال رسول الله، وقد نظر إلى القمر ليلة البدر: «أما إنكم سترون ربكم كما ترون هذا القمر، لا تضامون في رؤيته؛ فإن استطعتم أن لا تغلبوا على صلاة قبل طلوع الشمس وقبل غروبها فافعلوا»"
summary:
  ar: "رواية جرير بن عبد الله في باب رؤية المؤمنين ربهم من كتاب صلاة المسافرين في صحيح مسلم؛ يربط حفظ صلاتي الفجر والعصر برؤية الله، ويقرأ جرير بعدها آية طه."
