text: "… موضع بيت المقدس يدمون الله ونسلونه كشْف ذلك البلاء عنهم فاستُجيب لهم فاتخذوا ذلك الموضع مسجدًا وكان ذلكه فيما قيل لاحلى عشرة سنة مضت من ملكه وتُوقّى قبل ان يستتمّ، بناءة فأوصى الى سليمان باستتمامه وقَتْل القائد اللى قتل اخاه …"
