label: { ar: "صحيح مسلم 154 — ما عُدّ من الإيمان", en: "Sahih Muslim 154 — what is counted as part of faith", ur: "صحیح مسلم 154 — جو ایمان میں سے گنا گیا", es: "Sahih Muslim 154 — lo que se considera parte de la fe", fr: "Sahih Muslim 154 — ce qui est considéré comme faisant partie de la foi", tr: "Sahih Müslim 154 — İnancın bir parçası olarak kabul edilenler", id: "Sahih Muslim 154 — Apa yang dianggap sebagai bagian dari iman" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَعَمْرٌو النَّاقِدُ، وَزُهَيْرُ بْنُ حَرْبٍ، قَالُوا حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، سَمِعَ النَّبِيُّ رَجُلاً يَعِظُ أَخَاهُ فِي الْحَيَاءِ فَقَالَ \" الْحَيَاءُ مِنَ الإِيمَانِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 154، يذكر ما عُدّ من الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih Muslim, no. 154 (The Book of Faith), that mentions what is counted as part of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح مسلم کی حدیث نمبر 154، جس میں جو ایمان میں سے گنا گیا کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 154 (El Libro de la Fe), menciona lo que se considera parte de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih Muslim, n° 154 (Le Livre de la Foi), mentionne ce qui est considéré comme faisant partie de la foi. Le moteur de recherche « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'islam, les branches de la foi et les qualités du croyant."
  tr: "Sahih Müslim'in 154. hadisinde imanın ne olduğu açıklanmaktadır. Bu bölüm, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an'dan, Sünnet'ten, Peygamberin hayatından ve Sahabeler ile onların haleflerinden rivayetlerle birlikte, bu dört kategori içinde derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 154, menyebutkan apa yang membentuk iman. Bagian ini mengumpulkan rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
