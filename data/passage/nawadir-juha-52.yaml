text: "… في إحدى الليالي المقمرة خُيِّلَ له، وهو ينظرُ إلى الجنينةِ أنَّ جثةً عظيمةً ملقاةً في أرضها، فأيقظ امرأته، وقال لها: هاتي القوس والنشابَ حالاً، فأحضرتْهما له فأخذَهُما وأحكم النشابَ في القوس ورمى الجثة في بطنِها فأصابَها، فاطمأنَّ بالُهُ وعادَ إلى …"
summary:
  ar: "ظن جحا جسدًا ساقطًا في الحديقة جثة فرماه بسهم، فتبين أنه قفطانه وقد ثُقب عند السرة، فحمد الله على نجاته بالكاد. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  en: "Juha mistakes a fallen body in the garden for a corpse and shoots it with an arrow; it turns out to be his own kaftan, pierced at the navel, and he thanks God for the near miss. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  ur: "جحا نے باغ میں پڑی ایک چیز کو لاش سمجھا اور اس پر تیر چلا دیا؛ معلوم ہوا کہ وہ اس کی اپنی قبا تھی جو ناف کی جگہ سے چھد گئی تھی، تو اس نے اللہ کا شکر ادا کیا کہ بال بال بچا۔ {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  fr: "Juha prend pour un cadavre une forme tombée dans le jardin et lui tire une flèche ; c'est son propre caftan, percé à hauteur du nombril, et il remercie Dieu d'avoir échappé de peu. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
  es: "Juha confunde un bulto caído en el jardín con un cadáver y le dispara una flecha; resulta ser su propio caftán, atravesado a la altura del ombligo, y da gracias a Dios por haberse librado por poco. {cite:juha-nawadir-kubra-djuwaydi p. 32}"
