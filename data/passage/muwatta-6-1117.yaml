label: { ar: "الموطأ 1117 — ابن عمر: في الضحايا والبدن الثني فما فوقه", en: "Muwatta 1117", es: "Muwatta 1117", fr: "Muwatta 1117", ur: "موطا 1117", tr: "El-Muvatta 1117 — İbn Umar: Kurbanlar ve iki yaş ve üzeri hayvanlar hakkında", id: "Al-Muwatta 1117 — Ibnu Umar: Mengenai kurban dan hewan yang berumur dua tahun atau lebih" }
text: "في الضحايا والبدن الثني فما فوقه"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يقول في الضحايا والبدن: الثني فما فوقه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1212) وسويد (525) والبيهقي. {cite:muwatta-maruf-1997 p.511}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın kurbanlık hayvanlar hakkında şöyle dediğini aktarmıştır: \"İki yaşında veya daha büyük.\" Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1212), Suwaid (525) ve el-Bayhaqi tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.511}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata mengenai hewan kurban: “Hewan berumur dua tahun atau lebih.” Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus’ab (1212), Suwaid (525), dan al-Bayhaqi. {cite:muwatta-maruf-1997 p.511}"
