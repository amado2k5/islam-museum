label:
  ar: "ابن ماجه 4319 — أكل بعضي بعضا فجعل لها نفسين"
  en: "Ibn Majah 4319 — the Fire complains to its Lord and is given two breaths"
  ur: "ابن ماجہ 4319 — أشتكت النار إلى ربها فجعل لها نفسين"
text: "اشتكت النار إلى ربها فقالت يا رب أكل بعضي بعضا فجعل لها نفسين نفس في الشتاء ونفس في الصيف فشدة ما تجدون من البرد من زمهريرها …"
summary:
  ar: "حديث قدسي في ابن ماجه، رقم 4319: أكل بعضي بعضا فجعل لها نفسين. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Ibn Majah, no. 4319: the Fire complains to its Lord and is given two breaths. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ابن ماجہ میں حدیثِ قدسی، نمبر 4319: أشتكت النار إلى ربها فجعل لها نفسين۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
