label: { ar: "الموطأ 2742 — خبيب بن عبد الرحمن عن حفص: السبعة الذين يظلهم الله في ظله", en: "Muwatta 2742", es: "Muwatta 2742", fr: "Muwatta 2742", ur: "موطا 2742", tr: "El-Muvatta 2742 — Hubeyb ibn Abdül-Rahman, Hafs'tan rivayetle: Allah'ın gölgesinde gölgelendireceği yedi kişi.", id: "Al-Muwatta 2742 — Khubaib ibn Abd al-Rahman berdasarkan riwayat Hafs: Tujuh orang yang akan diberi naungan oleh Allah di bawah naungan-Nya" }
summary:
  ar: "يروي مالك عن خبيب بن عبد الرحمن الأنصاري عن حفص بن عاصم عن أبي سعيد الخدري، أو عن أبي هريرة، أن رسول الله قال: سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: إمام عادل، وشاب نشأ في عبادة الله، ورجل قلبه متعلق بالمسجد، ورجلان تحابا في الله اجتمعا على ذلك وتفرقا عليه، ورجل ذكر الله خاليا ففاضت عيناه، ورجل دعته ذات حسب وجمال فقال: إني أخاف الله، ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه. ويذكر المحقق أن أكثر أصحاب مالك شكوا في الراوي بين أبي هريرة وأبي سعيد، وأن الحديث محفوظ لأبي هريرة من رواية عبيد الله بن عمر. {cite:muwatta-maruf-1997 p.542} {cite:muwatta-maruf-1997 p.543}"
  tr: "Malik, Hubeyb ibn Abdülrahman el-Ensari'den, Hafs ibn Asim'den, Ebu Sa'id el-Hudri'den veya Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Kıyamet Günü'nde, Allah'tan başka gölge yoktur, yedi kişi gölgelenecektir: Adil bir yönetici; Allah'a ibadet ederek büyümüş bir genç; kalbi mescide bağlı bir adam; Allah için birbirini seven, bu nedenle buluşup ayrılan iki adam; yalnızken Allah'ı zikreden ve gözlerinden yaşlar akan bir adam; soylu ve güzel bir kadın tarafından çağrılan, fakat 'Allah'tan korkarım' diyen bir adam; ve sağ elinin ne harcadığını sol eliyle bilmediği gizlice sadaka veren bir adam.\" Araştırmacı, Malik'in arkadaşlarının çoğunun, rivayetçinin Ebu Hurayra mı yoksa Ebu Sa'id mi olduğundan şüphe duyduğunu ve hadisin Ubeyd Allah ibn Ömer'in rivayetiyle Ebu Hurayra'ya atfedildiğini belirtiyor. {cite:muwatta-maruf-1997 s.542} {cite:muwatta-maruf-1997 s.543}"
  id: "Malik meriwayatkan dari Khubayb ibn Abd al-Rahman al-Ansari, dari Hafs ibn Asim, dari Abu Sa'id al-Khudri, atau dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Tujuh orang akan mendapat naungan Allah pada Hari Kiamat, di mana tidak ada naungan selain naungan-Nya: seorang penguasa yang adil; seorang pemuda yang tumbuh dalam ibadah kepada Allah; seorang laki-laki yang hatinya terikat pada masjid; dua orang laki-laki yang saling mencintai karena Allah, bertemu dan berpisah atas dasar itu; seorang laki-laki yang mengingat Allah dalam kesendirian dan matanya berlinang air mata; seorang laki-laki yang dirayu oleh seorang wanita bangsawan dan cantik, tetapi ia berkata, 'Aku takut kepada Allah'; dan seorang laki-laki yang memberi sedekah secara diam-diam, sehingga tangan kirinya tidak mengetahui apa yang dibelanjakan tangan kanannya.\" Peneliti menyebutkan bahwa sebagian besar sahabat Malik meragukan perawinya, baik itu Abu Hurayrah maupun Abu Sa'id, dan bahwa hadits tersebut terpelihara untuk Abu Hurayrah melalui riwayat Ubayd Allah ibn Umar. {cite:muwatta-maruf-1997 p.542} {cite:muwatta-maruf-1997 p.543}"
