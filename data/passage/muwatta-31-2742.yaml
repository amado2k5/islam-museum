label: { ar: "الموطأ 2742 — خبيب بن عبد الرحمن عن حفص: السبعة الذين يظلهم الله في ظله", en: "Muwatta 2742" }
summary:
  ar: "يروي مالك عن خبيب بن عبد الرحمن الأنصاري عن حفص بن عاصم عن أبي سعيد الخدري، أو عن أبي هريرة، أن رسول الله قال: سبعة يظلهم الله في ظله يوم لا ظل إلا ظله: إمام عادل، وشاب نشأ في عبادة الله، ورجل قلبه متعلق بالمسجد، ورجلان تحابا في الله اجتمعا على ذلك وتفرقا عليه، ورجل ذكر الله خاليا ففاضت عيناه، ورجل دعته ذات حسب وجمال فقال: إني أخاف الله، ورجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه. ويذكر المحقق أن أكثر أصحاب مالك شكوا في الراوي بين أبي هريرة وأبي سعيد، وأن الحديث محفوظ لأبي هريرة من رواية عبيد الله بن عمر. {cite:muwatta-maruf-1997 p.542} {cite:muwatta-maruf-1997 p.543}"
