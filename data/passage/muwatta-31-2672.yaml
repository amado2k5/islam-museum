label: { ar: "الموطأ 2672 — أبو هريرة: ليس المسكين الطواف الذي ترده اللقمة واللقمتان", en: "Muwatta 2672", es: "Muwatta 2672", fr: "Muwatta 2672", ur: "موطا 2672", tr: "El-Muvatta 2672 — Ebu Hurayra: Fakir, dilenerek dolaşan ve bir iki lokmayla geri çevrilen kişi değildir.", id: "Al-Muwatta 2672 — Abu Hurairah: Orang miskin bukanlah orang yang berkeliling meminta-minta dan ditolak dengan sesuap makanan." }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: ليس المسكين بهذا الطواف الذي يطوف على الناس، فترده اللقمة واللقمتان، والتمرة والتمرتان. قالوا: فما المسكين يا رسول الله؟ قال: الذي لا يجد غنى يغنيه، ولا يُفطن له فيُتصدق عليه، ولا يقوم فيسأل الناس. {cite:muwatta-maruf-1997 p.510}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Fakir, insanlardan bir iki lokma veya bir iki hurma dilenerek dolaşan kişi değildir.\" Sahabeler: \"Öyleyse fakir kimdir, ey Allah Resulü?\" diye sordular. O şöyle buyurdu: \"Kendini geçindirecek kadarını bulamayan, kimsenin dikkatini çekmeyen ve sadaka vermeyen, kalkıp insanlardan yardım istemeyen kimsedir.\" {cite:muwatta-maruf-1997 s.510}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Orang miskin bukanlah orang yang meminta-minta sesuap atau dua suapan, atau satu atau dua kurma.\" Mereka bertanya: \"Lalu siapakah orang miskin itu, wahai Rasulullah?\" Beliau menjawab: \"Orang yang tidak mencukupi kebutuhannya sendiri, dan tidak ada seorang pun yang memperhatikannya sehingga ia diberi sedekah, dan ia tidak bangkit dan meminta-minta pertolongan kepada orang lain.\" {cite:muwatta-maruf-1997 p.510}"
