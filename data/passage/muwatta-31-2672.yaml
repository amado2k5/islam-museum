label: { ar: "الموطأ 2672 — أبو هريرة: ليس المسكين الطواف الذي ترده اللقمة واللقمتان", en: "Muwatta 2672" }
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال: ليس المسكين بهذا الطواف الذي يطوف على الناس، فترده اللقمة واللقمتان، والتمرة والتمرتان. قالوا: فما المسكين يا رسول الله؟ قال: الذي لا يجد غنى يغنيه، ولا يُفطن له فيُتصدق عليه، ولا يقوم فيسأل الناس. {cite:muwatta-maruf-1997 p.510}"
