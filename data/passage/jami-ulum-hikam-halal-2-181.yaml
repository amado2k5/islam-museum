text: "… الكبرى، وبين تحريم الطَّلقة الواحدة بانقضاء عدتها الذي تُباح معه الزوجة بعقدٍ جديدٍ، وبين تحريم الطَّلاق الثلاث الذي لا تُباح معه الزوجةُ بدون زوج وإصابة وبين تحريم الرجل عليه ما أحلَّه اللّٰه له مِنَ الطَّعام والشراب الذي لا يحرمه، وإنَّما …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 181، يذكر ما أُحل، وما حُرّم، والتحريم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 181, that mentions what was made lawful, what was made unlawful, prohibition, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 181 کا اقتباس جس میں جو حلال کیا گیا، جو حرام کیا گیا، تحریم، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
