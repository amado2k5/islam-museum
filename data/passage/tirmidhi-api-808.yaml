label: { ar: "جامع الترمذي 808 — مغفرة ما تقدم من الذنب", en: "Jami' al-Tirmidhi 808 — forgiveness of past sins", ur: "جامع ترمذی 808 — پچھلے گناہوں کی مغفرت" }
text: "… يُرَغِّبُ فِي قِيَامِ رَمَضَانَ مِنْ غَيْرِ أَنْ يَأْمُرَهُمْ بِعَزِيمَةٍ وَيَقُولُ \" مَنْ قَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \". فَتُوُفِّيَ رَسُولُ اللَّهِ وَالأَمْرُ عَلَى ذَلِكَ ثُمَّ كَانَ الأَمْرُ كَذَلِكَ فِي خِلاَفَةِ أَبِي بَكْرٍ وَصَدْرًا مِنْ خِلاَفَةِ عُمَرَ بْنِ الْخَطَّابِ عَلَى ذَلِكَ. وَفِي الْبَابِ عَنْ عَائِشَةَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ. …"
summary:
  ar: "حديث في جامع الترمذي، رقم 808، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 808 (The Book on Fasting), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 808، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
