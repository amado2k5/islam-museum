label: { ar: "الموطأ 278 — ابن شهاب: لا بأس بالكلام إذا نزل الإمام قبل أن يكبر", en: "Muwatta 278", es: "Muwatta 278", fr: "Muwatta 278", ur: "موطا 278", tr: "El-Muvatta 278 — İbn Şihab: İmam tekbir getirmeden önce inerse konuşmasında bir sakınca yoktur.", id: "Al-Muwatta 278 — Ibn Shihab: Tidak ada salahnya berbicara jika imam turun sebelum mengucapkan takbir." }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب عن الكلام يوم الجمعة إذا نزل الإمام عن المنبر قبل أن يكبر، فقال ابن شهاب: لا بأس بذلك؛ وهو في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.161}"
  tr: "Malik, İbn Şihab'a cuma günü imamın tekbir (Allahu Ekber) demeden minberden inmesi durumunda konuşmanın sakıncası olup olmadığını sorduğunu rivayet eder. İbn Şihab şöyle cevap vermiştir: \"Bunda bir sakınca yoktur. Bu, cuma günü imam hutbe verirken dikkatle dinlemekle ilgilidir.\" Editör, bu rivayetin Ebu Mus'ab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.161}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Ibn Shihab tentang berkhutbah pada hari Jumat jika imam turun dari mimbar sebelum mengucapkan takbir (Allahu Akbar). Ibn Shihab menjawab: Tidak ada yang salah dengan itu. Ini berkaitan dengan topik mendengarkan dengan saksama pada hari Jumat ketika imam menyampaikan khutbah. Editor mencatat bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.161}"
