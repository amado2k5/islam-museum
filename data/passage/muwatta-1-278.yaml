summary:
  ar: "يروي مالك أنه سأل ابن شهاب عن الكلام يوم الجمعة إذا نزل الإمام عن المنبر قبل أن يكبر، فقال ابن شهاب: لا بأس بذلك؛ وهو في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.161}"
