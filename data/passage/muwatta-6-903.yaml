label: { ar: "الموطأ 903 — ابن عمر إذا دنا من مكة بات بذي طوى حتى يصبح، ثم يصلي الصبح، ثم يدخل من الثنية العليا، ويغتسل قبل أن يدخل مكة", en: "Muwatta 903", es: "Muwatta 903", fr: "Muwatta 903", ur: "موطا 903", tr: "El-Muvatta 903 — İbn Ömer, Mekke'ye yaklaşırken geceyi Zü've'de geçirir, sabaha kadar orada kalır, sonra sabah namazını kılar, daha sonra üst geçitten girer ve Mekke'ye girmeden önce gusül abdesti alırdı.", id: "Al-Muwatta 903 — Ibnu Umar, ketika mendekati Mekah, akan bermalam di Dhu Tuwa hingga pagi, kemudian melaksanakan salat Subuh, lalu masuk dari jalan atas, dan melakukan ghusl sebelum memasuki Mekah." }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان إذا دنا من مكة بات بذي طوى بين الثنيتين حتى يصبح، ثم يصلي الصبح، ثم يدخل من الثنية التي بأعلى مكة. ولا يدخل إذا خرج حاجاً أو معتمراً حتى يغتسل قبل أن يدخل مكة، ويأمر من معه فيغتسلون. ويذكر المحقق أن ابن أبي شيبة والبيهقي رويا عن ابن عمر ما يوافق ذلك. {cite:muwatta-maruf-1997 p.436}"
  tr: "Malik, Nafi’den rivayet ettiğine göre, Abdullah ibn Umar Mekke’ye yaklaşırken, sabaha kadar iki geçit arasındaki Zü've’de geceyi geçirir, sonra sabah namazını kılar ve ardından dağ geçidinin tepesindeki geçitten Mekke’ye girerdi. Hac veya Umre için olsun, Mekke’ye girmeden önce gusül abdesti almadan girmezdi ve yanındakilere de aynısını yapmalarını söylerdi. Araştırmacı, İbn Abi Şeybe ve el-Beyhaki’nin de İbn Umar’dan benzer bir rivayette bulunduğunu belirtiyor. {cite:muwatta-maruf-1997 s.436}"
  id: "Malik meriwayatkan dari Nafi’ bahwa ketika Abdullah ibn Umar mendekati Mekah, ia akan bermalam di Dhu Tuwa di antara dua celah gunung hingga pagi hari, kemudian ia akan melaksanakan salat Subuh (salat fajar), dan kemudian memasuki Mekah melalui celah di puncak celah gunung. Ia tidak akan memasuki Mekah, baik untuk menunaikan haji maupun umrah, sampai ia melakukan ghusl (mandi ritual) sebelum memasuki kota, dan ia akan memerintahkan orang-orang yang bersamanya untuk melakukan hal yang sama. Peneliti menyebutkan bahwa Ibn Abi Shaybah dan al-Bayhaqi meriwayatkan hal serupa dari Ibn Umar. {cite:muwatta-maruf-1997 p.436}"
