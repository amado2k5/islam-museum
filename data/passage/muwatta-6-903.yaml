label: { ar: "الموطأ 903 — ابن عمر إذا دنا من مكة بات بذي طوى حتى يصبح، ثم يصلي الصبح، ثم يدخل من الثنية العليا، ويغتسل قبل أن يدخل مكة", en: "Muwatta 903" }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان إذا دنا من مكة بات بذي طوى بين الثنيتين حتى يصبح، ثم يصلي الصبح، ثم يدخل من الثنية التي بأعلى مكة. ولا يدخل إذا خرج حاجاً أو معتمراً حتى يغتسل قبل أن يدخل مكة، ويأمر من معه فيغتسلون. ويذكر المحقق أن ابن أبي شيبة والبيهقي رويا عن ابن عمر ما يوافق ذلك. {cite:muwatta-maruf-1997 p.436}"
