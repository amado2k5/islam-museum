text: "ف: حديث محمد بن عباد هو الصواب. وذكر عبد الرحمن بن أبي حاتم في كتاب (العلل)) (١) عن أبيه أنه قال: (محمد بن عباد بن جعفر ثقة ومحمد بن جعفر بن الزبير ثقة، والحديث لمحمد بن جعفر بن الزبير أشبه))."
