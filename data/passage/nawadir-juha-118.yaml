label: { ar: "نوادر جحا الكبرى، ص 57 — «وأنا كنت ضمنها»", en: "Nawadir Juha al-Kubra, p. 57 — 'I Was Inside It Too'", ur: "نوادر جحا الکبریٰ، ص 57 — «میں بھی اس کے اندر تھا»", fr: "Nawadir Juha al-Kubra, p. 57 — « J'étais dedans, moi aussi »", es: "Nawadir Juha al-Kubra, p. 57 — «Yo también estaba dentro»", tr: "Juha'nın Büyük Fıkraları, s. 57 — “Ve ben de onların arasındaydım”", id: "Anekdot-anekdot Hebat Juha, hlm. 57 — “Dan aku berada di antara mereka”" }
text: "… وأنا كنت ضمنها سأله جاره القريب قائلاً: لقدِ أشتغل بالي حَيْثُ سمعتُ ضوضاءَ، وجلبةً، وصياحاً في دارِكم، وكأني بخصومةٍ حصلَتْ، وشيء عظيم تدحرجَ على السلّم، فماذا جرى؟ فأجابه الشيخ منقبضاً : لقد تخاصمْتُ معَ أمرأتي ولكَمَتْ جبَّتي، فتدهورَتْ بِالسلم، وحصل …"
summary:
  ar: "سُئل جحا عن الضجة على السلم، فقال إنه تشاجر مع زوجته فضربت جبته فتدحرجت على السلم؛ فقيل له إن الجبة لا تُحدث جلبة، فقال إنه كان فيها أيضًا. {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  en: "Asked about a racket on the stairs, Juha says he quarrelled with his wife, who hit his robe, which tumbled down; told that a robe does not clatter, he says he was inside it too. {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  ur: "جب جحا سے سیڑھیوں پر شور کے بارے میں پوچھا گیا تو اس نے کہا کہ بیوی سے جھگڑا ہوا اور اس نے اس کے جبے کو مارا جو لڑھک گیا؛ جب کہا گیا کہ جبہ تو شور نہیں کرتا، تو اس نے کہا کہ میں بھی اس کے اندر تھا۔ {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  fr: "Interrogé sur le vacarme dans l'escalier, Juha dit qu'il s'est disputé avec sa femme, qui a frappé sa robe, laquelle a déboulé; quand on lui fait remarquer qu'une robe ne fait pas de bruit, il répond qu'il était dedans, lui aussi. {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  es: "Preguntado por el estruendo en la escalera, Juha dice que se peleó con su mujer, que golpeó su túnica, la cual rodó escaleras abajo; cuando le dicen que una túnica no hace ruido, responde que él también estaba dentro. {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  tr: "Juha'ya merdivenlerdeki gürültü sorulduğunda, karısıyla tartıştığını ve karısının cübbesine vurduğunu, bunun üzerine cübbesinin merdivenlerden aşağı yuvarlandığını söyledi. Bunun üzerine kendisine cübbenin gürültü yapmadığı söylendiğinde, kendisinin de cübbeyi giydiğini belirtti. {cite:juha-nawadir-kubra-djuwaydi s. 57}"
  id: "Juha ditanya tentang keributan di tangga, dan dia mengatakan bahwa dia bertengkar dengan istrinya, dan istrinya memukul jubahnya, menyebabkan jubah itu menggelinding menuruni tangga. Kemudian dia diberitahu bahwa jubah tidak menimbulkan keributan, yang kemudian dia jawab bahwa dia juga sedang mengenakannya. {cite:juha-nawadir-kubra-djuwaydi p. 57}"
