label: { ar: "الموطأ 1137 — ثور بن زيد عن عكرمة: من أصاب أهله قبل أن يفيض يعتمر ويهدي", en: "Muwatta 1137", es: "Muwatta 1137", fr: "Muwatta 1137", ur: "موطا 1137", tr: "El-Muvatta 1137 — Thawr ibn Zayd, İkrimah'tan rivayetle: Tavaftan ayrılmadan önce karısıyla cinsel ilişkiye giren kimse Umre yapmalı ve kurban kesmelidir." }
text: "الذي يُصيبُ أهْلَهُ قَبْلَ أنْ يُفيضَ، يَعْتَمِرُ ويُهْدي"
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي عن عكرمة مولى ابن عباس، ويقول عكرمة إنه لا يظنه إلا عن عبد الله بن عباس، أن من أصاب أهله قبل أن يفيض يعتمر ويهدي. {cite:muwatta-maruf-1997 p.517}"
  tr: "Malik, İbn Abbas'ın azatlı kölesi İkrime'den rivayet edildiğine göre, Sevr ibn Zeyd el-Dili'den, İkrime de Abdullah ibn Abbas'tan rivayet ettiğine inanarak, Mekke'den ayrılmadan önce karısıyla cinsel ilişkiye giren kimsenin Umre yapması ve kurban kesmesi gerektiğini söyler. {cite:muwatta-maruf-1997 s.517}"
  id: "Malik meriwayatkan dari Thawr ibn Zayd al-Dili, dari Ikrimah, budak yang dibebaskan oleh Ibnu Abbas, dan Ikrimah mengatakan bahwa ia meyakini riwayat ini dari Abdullah ibn Abbas, bahwa siapa pun yang bersetubuh dengan istrinya sebelum meninggalkan Mekah harus melaksanakan Umrah dan mempersembahkan kurban. {cite:muwatta-maruf-1997 p.517}"
