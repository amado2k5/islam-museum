label: { ar: "الموطأ 1913 — مالك عن داود بن الحصين: سمع سعيد بن المسيب يقول إن بيع الحيوان باللحم بالشاة والشاتين من ميسر أهل الجاهلية", en: "Muwatta 1913", es: "Muwatta 1913", fr: "Muwatta 1913", ur: "موطا 1913", tr: "El-Muvatta 1913 — Malik, Davud ibn el-Hüseynin'den rivayetle şöyle demiştir: Said ibn el-Musayyab'ın şöyle dediğini işitti: Bir veya iki koyun için et karşılığında hayvan satmak, İslam öncesi dönem insanlarının kumar uygulamalarından biridir.", id: "Al-Muwatta 1913 — Malik berdasarkan riwayat Dawud ibn al-Husayn: Dia mendengar Saeed ibn al-Musayyab berkata: Menjual hewan untuk diambil dagingnya, dengan imbalan satu atau dua ekor domba, termasuk praktik perjudian masyarakat pra-Islam." }
summary:
  ar: "يروي مالك عن داود بن الحصين أنه سمع سعيد بن المسيب يقول: من ميسر أهل الجاهلية بيع الحيوان باللحم، بالشاة والشاتين. {cite:muwatta-maruf-1997 p.184}"
  tr: "Malik, Davud ibn el-Hüseynin'den rivayetle, Sa'id ibn el-Musayyab'ın şöyle dediğini işittiğini aktarır: \"İslam öncesi dönem insanlarının kumar uygulamalarından biri de bir veya iki koyun karşılığında hayvan eti satmaktı.\" {cite:muwatta-maruf-1997 s.184}"
  id: "Malik meriwayatkan dari Dawud ibn al-Husayn bahwa ia mendengar Sa'id ibn al-Musayyab berkata: \"Di antara praktik perjudian masyarakat pra-Islam adalah menjual hewan untuk daging, dengan imbalan satu atau dua ekor domba.\" {cite:muwatta-maruf-1997 p.184}"
