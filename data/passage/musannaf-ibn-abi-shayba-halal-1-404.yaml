text: "… أيوب عن أبي الخليل عن مجاهد أن النبي للي قدم يوم الفتح والأنصاب بين الركن والمقام، فجعل يكفئها لوجوهها، ثم قام رسول اللّٰه وليفي خطيباً فقال: ألا إن مكة حرام أبدأ إلى يوم القيامة، لم تحل لأحد قبلي ولا تحل …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 404، يذكر ما أُحل، وما لا يحل، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 404, that mentions what was made lawful, what is not lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 404 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 1, pág. 404, que menciona lo que es lícito, lo que no lo es y lo que está prohibido; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
