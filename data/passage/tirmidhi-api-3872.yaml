text: "… وَأَجْلَسَهَا فِي مَجْلِسِهِ وَكَانَ النَّبِيُّ إِذَا دَخَلَ عَلَيْهَا قَامَتْ مِنْ مَجْلِسِهَا فَقَبَّلَتْهُ وَأَجْلَسَتْهُ فِي مَجْلِسِهَا فَلَمَّا مَرِضَ النَّبِيُّ دَخَلَتْ فَاطِمَةُ فَأَكَبَّتْ عَلَيْهِ فَقَبَّلَتْهُ ثُمَّ رَفَعَتْ رَأْسَهَا فَبَكَتْ ثُمَّ أَكَبَّتْ عَلَيْهِ ثُمَّ رَفَعَتْ رَأْسَهَا فَضَحِكَتْ فَقُلْتُ إِنْ كُنْتُ لأَظُنُّ أَنَّ هَذِهِ مِنْ أَعْقَلِ نِسَائِنَا فَإِذَا هِيَ مِنَ النِّسَاءِ فَلَمَّا تُوُفِّيَ النَّبِيُّ قُلْتُ لَهَا أَرَأَيْتِ حِيْنَ أَكْبَبْتِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3872، يذكر مرض النبي، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3872 (Chapters on Virtues), that mentions the Prophet's illness, illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3872، جس میں نبی کی بیماری، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
