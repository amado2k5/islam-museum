text: "… واجبة، وهو أن يحب أن يكون مثله لانه إذا لم يكن يحب ذلك فيكون راضياً بالمعصية وذلك حرام، وإن كانت النعمة من الفضائل كإنفاق الأموال فى المكارم والصدقات فالمنافسة فيها مندوب إليها، وإن كانت نعمة يتنعم بها على وجه مباح …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 1، ص 195، يرد فيه ذكر الواجب، والمندوب، والمباح، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 1, p. 195, whose wording mentions the obligatory (wajib), the recommended (mandub), the permitted (mubah), the forbidden (haram); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 1، ص 195 کا اقتباس جس میں واجب، مندوب، مباح، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din de al-Ghazali, volume numérisé 1, p. 195, dont le texte mentionne l'obligatoire (wajib), le recommandé (mandub), le permis (mubah), l'interdit (haram) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
