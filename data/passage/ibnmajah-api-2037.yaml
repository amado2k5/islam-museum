label: { ar: "سنن ابن ماجه 2037 — الأب والأبوة", en: "Sunan Ibn Majah 2037 — the father and fatherhood", ur: "سنن ابن ماجہ 2037 — باپ اور والدیت", es: "Sunan Ibn Majah 2037 — El padre y la paternidad", fr: "Sunan Ibn Majah 2037 — le père et la paternité" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ الْمِقْدَامِ أَبُو الأَشْعَثِ الْعِجْلِيُّ، حَدَّثَنَا عُبَيْدُ بْنُ الْقَاسِمِ، حَدَّثَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ عَمْرَةَ بِنْتَ الْجَوْنِ، تَعَوَّذَتْ مِنْ رَسُولِ اللَّهِ ـ حِينَ أُدْخِلَتْ عَلَيْهِ فَقَالَ \" لَقَدْ عُذْتِ بِمُعَاذٍ \". فَطَلَّقَهَا وَأَمَرَ أُسَامَةَ أَوْ أَنَسًا فَمَتَّعَهَا بِثَلاَثَةِ أَثْوَابٍ رَازِقِيَّةٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2037، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2037 (The Chapters on Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2037، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2037 (Los capítulos sobre el divorcio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2037 (Les chapitres sur le divorce), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
