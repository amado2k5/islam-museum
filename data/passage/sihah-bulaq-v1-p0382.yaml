text: |-
  ⁦(مجد)⁩
  ٢0٩
  أى يلتفت يمينا وشماد ورجل ألذ بين اللددوهو الشديد انلخصومة وقوم لدّ ولد أيضاموضع
  بالشام واللد بالفتح الجوالق وقال الراجز كأن لذيه على صفح جبل ولده ياده خصمه
  فهولا د ولدود قال الراجز ألدأقران الخصوم اللد .
  يقال مازات ألا تعنك أى أدفع
  ورجل يلندد وألندد أى خصم مثل الالد ونصغير الندد اليدلان أصله ألدفزادوافيه النون
  ليلمة وه يبناء سفرحل فلما ذهبت النون عادالى أصلدوة ولهم مالى منه محتسد ولا ملتد أى بد
  (لسد اسد الطلاأمه يلدهالداأى رضعها مثال كسر يكسركسرا ولد العل.
  أيضالعقه وحكى أبو حاتم فى كتاب الابواب لسد الطلا أمه بالكسرل_دابالتحريك
  شل لجذا الكلب الاناءلجذا (لغد اللغدود واحد اللغاديد وهى اللهمات التى بين
  لحنك وصفعة العنق واللغد مثله والجمع ألغاد ولفدت الابل العوانداذارددتها الى القصد
  والطريق وجاء فلان ملتغدا أى متغيظا حنقا كد) الاصمعى لكد عليه الوسخ بالكسر
  سكدا أى لزمه واصق يه وتلكد الشئ لام بعضه بعضا والماكد شبه مدق يدق به د)
  لهده الحل أى أثله الإصمعى لهد القوم دوا بهم جهد وها وأحرثوها قال جرير
  ولقدر كتك يافرزدق خاسنا • لما كبوت لدى الرهان لهيدا
  أى حسيراولهده لهدا أى دفعه لذله فهو-لهودوكذلك لهده قال طرفة يذم رجلا
  بطى"عن الداعى سريع الى انحنا • ذلول بإجاع الرجال ملهد أى مدفع
  وانماشدد لتكثير أبوزيدألهدت به أزريت به أبو عمروألهدت بداذا أمسكت أحد الرجلين
  وخلت الآخر عليه وهو يقاتله قال فان قطنت رجلا بماصاحبه يكامه قال واللّه ماقلتها
  الاأن تلهد على أى تعين على" واللهيدة الرخوة من العصائد ليست بحساء قتحسى ولا يغليظة
  فتلقم وهى التى تجاوز حد المريقة والسخينة وتقصر عن العصيدة
  صل الميم أد لمأد من النبات اللين الناعم قال الاصمعى قيل لبعض العرب
  أصب لنا موضعا فقال رائدهم وجدت مكانا ثأدامأداوامتأدفلان خيرا أى كبه ويقال
  للغصن اذا كان ناعما يهتزه ويمأدمأداحسسنا وغصن يمؤود أى ناعم ورجل يمؤود وامرأة
  يمؤودة شابة ناعمة ويمؤودم وضح قال الشماخ
  فظلت بيمؤود كات عيونها • الى الشمس هل تدنوركى النواكز
  ⁦( مجد)⁩. الجد الكرم والمجيد السكريم وقد مجد الرجل بالضم فهو مجيد وماجد قال ابن
  السكيت الشرف والمجد يكونان بالاباء يقال رجل شريف ماجدله آياه متقدمون
  فى الشرف قال والحسب والكرم يكونان فى الرجل وان لم يكن لهآياء لهم شرف وتماجد
  القوم فيما بينهم وماحسدته فجدته أمجده أى غلبته بالمجد ومجسدت الابل مجودا أى نالت من
  الخلاقريبل من السبع ومجدتها أنا قجيداوقال أبو عبيد أهل العالية يقولون مجدت
  لداية أمجدها مجدا أى علفتها ملء بطنها وأهل نحدية ولون مجدتها تمجدا أى علفتها نصف
  بطنها والتمجيد أن ينسب الرجل الى الجدوفى المثل فى كل شجر نار واستمجد المرخ والعفارأى
  استكثرامنها كانهما أخذا من النارما هو حسبهما ويقال لانممايسرعان الورى فشبها:
  بعن يكثر من العطاء طلبا للمجد وبنومجد أولادربيعة بن عامر بن صعصعة ومجداسم أمهم
