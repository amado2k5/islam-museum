label: { ar: "سنن ابن ماجه 2616 — وزر من تبع", en: "Sunan Ibn Majah 2616 — bearing the burden of those who follow", ur: "سنن ابن ماجہ 2616 — پیروی کرنے والوں کا بوجھ", es: "Sunan Ibn Majah 2616 — llevando la carga de los que siguen", fr: "Sunan Ibn Majah 2616 — porter le fardeau de ceux qui suivent", tr: "Sunan İbn Majah 2616 — Takip edenlerin yükü", id: "Sunan Ibn Majah 2616 — Beban bagi orang-orang yang mengikuti" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا عِيسَى بْنُ يُونُسَ، حَدَّثَنَا الأَعْمَشُ، عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ تُقْتَلُ نَفْسٌ ظُلْمًا إِلاَّ كَانَ عَلَى ابْنِ آدَمَ الأَوَّلِ كِفْلٌ مِنْ دَمِهَا لأَنَّهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2616، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2616 (The Chapters on Blood Money), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2616، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2616 (Los capítulos sobre la indemnización por derramamiento de sangre), habla de asumir la carga de quienes le siguen. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 2616 (Les chapitres sur l'argent du sang), évoque le fardeau de ceux qui succèdent. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou pèsent un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 2616 numaralı hadis, itaat edenin yükünden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2616, menyebutkan beban orang yang mengikuti. Beban tersebut dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
