label: { ar: "الموطأ 1501 — مالك: بلغه أن عمر بن عبد العزيز كتب إلى عماله أن كل ما اشترط المنكح من حباء أو كرامة فهو للمرأة إن ابتغته", en: "Muwatta 1501", es: "Muwatta 1501", fr: "Muwatta 1501", ur: "موطا 1501", tr: "El-Muvatta 1501 — Malik: Ömer ibn Abdülaziz'in valilerine, evlilik sözleşmesinde hediye veya onur konusunda ne belirtilmişse, kadının talep etmesi halinde bunun kadına ait olduğunu yazdığı kendisine bildirildi.", id: "Al-Muwatta 1501 — Malik: Dia diberitahu bahwa Umar ibn Abd al-Aziz menulis kepada para gubernurnya bahwa apa pun yang tercantum dalam kontrak pernikahan dalam hal hadiah atau kehormatan adalah milik wanita jika dia memintanya." }
summary:
  ar: "يروي مالك أنه بلغه أن عمر بن عبد العزيز كتب في خلافته إلى بعض عماله أن كل ما اشترط المنكح، من كان أبا أو غيره، من حباء أو كرامة، فهو للمرأة إن ابتغته. {cite:muwatta-maruf-1997 p.32}"
  tr: "Malik, Ömer ibn Abdülaziz'in halifeliği sırasında bazı valilerine, evliliği düzenleyen kişinin, ister babası ister başkası olsun, hediye veya onur olarak belirlediği her şeyin, kadın talep ederse ona ait olduğunu yazdığını duyduğunu aktarıyor. {cite:muwatta-maruf-1997 s.32}"
  id: "Malik menceritakan bahwa ia mendengar Umar ibn Abd al-Aziz menulis kepada beberapa gubernurnya selama masa kekhalifahannya bahwa apa pun yang ditetapkan oleh pria yang mengatur pernikahan, baik itu ayahnya atau orang lain, sebagai hadiah atau kehormatan, adalah hak perempuan jika ia memintanya. {cite:muwatta-maruf-1997 p.32}"
