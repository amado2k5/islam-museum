label: { ar: "الموطأ 2487 — ابن شهاب: الأعور يفقأ عين الصحيح، والقود أو الدية", en: "Muwatta 2487", es: "Muwatta 2487", fr: "Muwatta 2487", ur: "موطا 2487", tr: "El-Muvatta 2487 — İbn Şihab: Tek gözlü adam, diğer tek gözlü adamın gözünü çıkarabilir ve bunun cezası misilleme veya kan parasıdır.", id: "Al-Muwatta 2487 — Ibn Shihab: Orang bermata satu boleh mencungkil mata orang bermata satu lainnya, dan hukumannya adalah pembalasan atau uang darah." }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب عن الرجل الأعور يفقأ عين الصحيح؟ فقال ابن شهاب: إن أحب الصحيح أن يستقيد منه فله القود، وإن أحب فله الدية ألف دينار أو اثنا عشر ألف درهم. {cite:muwatta-maruf-1997 p.426}"
  tr: "Malik, İbn Şihab'a iki gözü de iyi gören bir adamın gözünü oyan tek gözlü bir adam hakkında sorduğunu anlatır. İbn Şihab şöyle cevap verir: İki gözü de iyi gören adam intikam almak isterse, bunu yapabilir. Bin dinar veya on iki bin dirhem kan parası ödemeyi tercih ederse, bunu da yapabilir. {cite:muwatta-maruf-1997 s.426}"
  id: "Malik menceritakan bahwa ia bertanya kepada Ibnu Shihab tentang seorang pria bermata satu yang mencungkil mata seorang pria yang memiliki dua mata yang sehat. Ibnu Shihab menjawab: Jika pria yang memiliki dua mata yang sehat ingin membalas dendam, ia boleh melakukannya. Jika ia lebih memilih membayar uang darah sebesar seribu dinar atau dua belas ribu dirham, ia boleh melakukannya. {cite:muwatta-maruf-1997 p.426}"
