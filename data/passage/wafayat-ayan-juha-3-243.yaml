text: "… دول ذلك فهاراى أبو دلامة الخدمن قال ايها الامر تعلم أن هذا أول يوم من أمام الاخرة ولا يدقيه من الزوادة فامر له بذلك رغية امطوياءلى دجاجة وحم وسطيعة من شراب وشيا من نقل وشهر سيقه وحل وكان حسه فرس …"
summary:
  ar: "مقطع من وفيات الأعيان وأنباء أبناء الزمان، المجلد المصوَّر 3، ص 243، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Wafayat al-A'yan wa-Anba' Abna' al-Zaman, scan volume 3, p. 243, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "وفایت الاعیان و انبا ابنا الزمان، اسکین جلد 3، ص 243 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volume numérisé 3, p. 243, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volumen escaneado 3, p. 243, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"Vafayat al-A'yan wa Anba' Abna' al-Zaman\" (Dönemin Önemli Şahsiyetlerinin Biyografileri ve İnsanlarının Haberleri) adlı resimli cilt 3'ün 243. sayfasından, zeki ve aptal bireyler hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Biografi Tokoh Terkemuka dan Berita tentang Orang-orang pada Zamannya), Jilid Bergambar 3, hlm. 243, berisi kisah tentang individu yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
