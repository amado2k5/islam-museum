text: "دخل جحا على أُمّه، وهي في النَّزعِ، فقال لها : كيف حالُكِ يا أَمَّاهُ، كانوا يتحادثون في قضية قيام الليل، فسألُوُه: هلْ تقومُ الليل؟ قال لا مرأته يوماً: إذا كانت ليلةُ الجمعة فأقلبي المخدَّة حتى أعلم تلك فأخذت أمرأتُهُ تقلب …"
summary:
