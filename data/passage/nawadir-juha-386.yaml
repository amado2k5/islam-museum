  es: "Juha visita a su madre en sus últimos momentos y le pregunta cómo está. {cite:juha-nawadir-kubra-djuwaydi p. 189}"
  tr: "Juha, annesini son anlarında ziyaret etti ve nasıl olduğunu sordu. {cite:juha-nawadir-kubra-djuwaydi s. 189}"
