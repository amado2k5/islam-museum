text: |-
  متعديا ولازما والشئ المذكور
  فى الاوّل يقال له موفور وفى
  الثانى يقال لهواذركماذكر نظيره
  المصباح فى بردالما. وبردت الماء
  ولم يذكر المؤاف أوفرته بالهمز
  كماذكر المضعف وكانه لم يسمع
  حتى لا يأتى منه موفر بوزن
  مكرم اسم مسعول وان كان
  القياس يقتضيه قاله نصر
  قوله من بدن تقدمت رواية من
  سمن اه الظرنير
  ١٤غ
  ⁦(باب الرام)⁩
  بالتريك تقول وغر صدره على يوغروغرافهوواغر الصدر على وقد أوغرت صدره على
  فلان أى أحيته من الغيظ وأوغرت الماءأى أغليته وربعمايسمط فيه الخنزير وهو حى ثم يذيح
  وهوفعل قوم من النصارى. قال الشاعر
  والقدر أيت مكانهم فكرهتهم • ككراهة الخنزير للايغار
  والوغيرة اللبن يسخن بالجارة المحماة والوغير أيضا قال يصف فرساءرقت
  ينش الماء فى الريلات منها • تشيش الرضف فى اللين الوغير
  تقول منه أوغرت اللبن وكذلك التوغير قال الشاعر
  فسائل مراداعن ثلاثة قسة * وعن إثر ما أبقى الصريح الموغر
  وشمعت وغوالجيش أى أصواتهم قال الراجز
  كأنمازهاؤملمن جهر * ليل ورزوغره اذاوغر
  وقال ابن مقبل. فى ظهر مرت عساقيل السحاب به * كأن وغرقطاه وغرخادينا
  واوغر العامل الدراج أى استوفاه ويقال الايغاران يوغر الملك الرجل الارض يجعلها له من
  غير خراج وقد يسمى ضمان الخراج ايغاراوهى لفظة مولدة ⁦(وفر)⁩ الوفر المال الكثير
  والوفرة الشعر الى شحمة الاذن ثم الجة ثم اللمة وهى التى ألمت بالمنسكبين والموفور الشئ التامّ
  ووفرت الشئ وقراووفر الشئ بنفسه وفورا ١ قواهم توذروة حمد من قولك وفرته عرضه
  وماله قال الفرّاء اذاء رض علميك الشيذلك أن تقول توفروتحمد ولا تقل توتريضرب هذا
  المثل للرجل تعطيه الشئ فيردّه عليك من غير تسخط وهذه أرض فى نبتها وفرووفرة وفرة أيضا
  أى وفور لم يرع والوفراء الارض التى لم ينقص من نبتها شئ قال الاعشى
  عرندسة لا ينقص السيرعرضها • كأحقب بالوفرام جأب مكدم
  ويقال مزادة وفراء للتى لم ينقص من أديمها شئ وسقاء أوفر قال ذوارمة
  وفراء غرفية أتاى خوارزها • مشلشل ضيعته بينها الكتب
  ووفر عليه حقه نوفيرا واستوفره أى استوفاه وتوّفر عليه أى رعى حرماته ويڤال هم متوافرون
  أى هم كثير وقول الراجز كأنها من بدن وايفار • دبت عليها ذربات الانيار
  انماهو من الوفوروهو التمام يقول كأنها مما أوفرها الرعى دبت عليها الانبار ويروى واستيفار
  والمعنى واحدويروى وايغار من أوغر العامل انطراج أى استوفاه ويروى بالقاف من أوقره
  أى أثقله ( قر لوقر بالفتح الثقل فى الاذن والوقر بالمكسر الحمدل يقال ياء يحمل وقره
  وقد أ وقر بعيره وأكثر ما يستعمل الوقرفى حل البغل والمار والوسق فى حل البعير وهذه
  امرأة موقرة بفتح القاف اذاحلت حلاثقيلا وأوقرت التخلة أى كثرحلها يقال تخلة
  •وقرة وموقروم وقرة وحكى موقروهو على غير القياس لانّ الفعل ليس للنخلة وانمافيل موقر
  بكسر القاف على قياس قولك امرأة حامل لان حل الشهر مشبه عحمل النساه فأما موقر
  بالفتح فشاذ وقدروى فى قول لبيديصف نخيلا
  عصب كوارع فى خليم علم • سلت فنهاموقر مكعوم
  والجمع مواروقد وقرت أذنه بالكسر نوقر وقرا أى صمت وقياس مصدره التخريك الاأنة جاه
  بالتسكين
