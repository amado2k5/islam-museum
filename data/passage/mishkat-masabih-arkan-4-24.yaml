text: "… عمرو بن عبسة، قال: أتيت رسول اللّٰه تشير فقلت: يا رسول الله! من معك على هذا الأمر؟ قال: حر وعبد. قلت: ما الإسلام؟ قال: طيب الكلام، وإطعام الطعام.قلت: ما الإيمان؟ قال: الصبر والسماحة. قال: قلت: أي الإسلام أفضل؟ قال: من …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 4، ص 24، يذكر تعريف الإسلام بأعماله، والسؤال عن الإيمان وجوابه، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
