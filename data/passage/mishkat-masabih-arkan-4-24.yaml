  ur: "مشکاۃ المصابیح، اسکین جلد 4، ص 24 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، ایمان کے بارے میں سوال اور اس کا جواب، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
