label: { ar: "موطأ مالك 1723 — الكي", en: "Muwatta Malik 1723 — cautery", ur: "موطأ مالک 1723 — داغنا", es: "Muwatta Malik 1723 - cauterio", fr: "Muwatta Malik 1723 — cautère", tr: "Muwatta Malik 1723 — Al-Kay", id: "Muwatta Malik 1723 — Al-Kay" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ يَحْيَى بْنِ سَعِيدٍ، قَالَ بَلَغَنِي أَنَّ سَعْدَ بْنَ زُرَارَةَ، اكْتَوَى فِي زَمَانِ رَسُولِ اللَّهِ مِنَ الذُّبَحَةِ فَمَاتَ."
summary:
  ar: "حديث في موطأ مالك، رقم 1723، يذكر الكي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 1723 (The Evil Eye), that mentions cautery. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 1723، جس میں داغنا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1723 (El mal de ojo), menciona la cauterización. El Medicine Browser la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Muwatta Malik, n° 1723 (Le Mauvais Œil), mentionne la cautérisation. Le Répertoire des ouvrages de médecine le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Malik'in Muwatta'sında yer alan 1723 numaralı hadiste, yakma işleminden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1723, menyebutkan tentang kauterisasi. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
