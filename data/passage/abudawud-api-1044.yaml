label: { ar: "سنن أبي داود 1044 — الأب والأبوة", en: "Sunan Abi Dawud 1044 — the father and fatherhood", ur: "سنن ابی داؤد 1044 — باپ اور والدیت" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ صَالِحٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ إِبْرَاهِيمَ بْنِ أَبِي النَّضْرِ، عَنْ أَبِيهِ، عَنْ بُسْرِ بْنِ سَعِيدٍ، عَنْ زَيْدِ بْنِ ثَابِتٍ، أَنَّ رَسُولَ اللَّهِ قَالَ \" صَلاَةُ الْمَرْءِ فِي بَيْتِهِ أَفْضَلُ مِنْ صَلاَتِهِ فِي مَسْجِدِي هَذَا إِلاَّ الْمَكْتُوبَةَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 1044، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1044 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1044، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
