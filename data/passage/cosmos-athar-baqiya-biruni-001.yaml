text: "وقد نطقت الكتب المشتملة على ذكر البلاد والمدن جغرافياً وكتب المسالك والممالك على أن هذه الأمة أعني يأجوج ومأجوج هم صنف من الأتراك المشرقية الساكنة في مبادئ الإقليم الخامس والسادس"
summary:
  ar: "ينقل البيروني عن كتب الجغرافيا والمسالك أن يأجوج ومأجوج صنف من الأتراك الشرقيين في الإقليمين الخامس والسادس."
  en: "Al-Biruni reports that the geographical and road books treat Gog and Magog as a kind of eastern Turk living in the fifth and sixth climes."
  es: "Al-Biruni informa que las guías geográficas y de carreteras tratan a Gog y Magog como una especie de turcos orientales que viven en los climas quinto y sexto."
  fr: "Al-Biruni rapporte que les livres géographiques et routiers traitent Gog et Magog comme une sorte de Turc oriental vivant dans les cinquième et sixième cieux."
  ur: "البیرونی نے رپورٹ کیا ہے کہ جغرافیائی اور سڑک کی کتابیں یاجوج اور ماجوج کو مشرقی ترکوں کی ایک قسم کے طور پر دیکھتے ہیں جو پانچویں اور چھٹے موسموں میں رہتے ہیں۔"
  tr: "El-Biruni, coğrafya ve yol haritaları kitaplarından alıntı yaparak Gog ve Magog'un beşinci ve altıncı bölgelerde yaşayan bir tür doğu Türkü olduğunu belirtir."
  id: "Al-Biruni mengutip dari buku-buku geografi dan rute bahwa Gog dan Magog adalah tipe orang Turki timur di wilayah kelima dan keenam."
