text: "… بذروته حتى يكون الفقر أحب إليه من الغنى، والتواضع أحب إليه من الشرف، وحتى يكون حامده وذامه عنده سواء. قال: ففسرها أصحاب عبد اللّٰه قالوا: حتى يكون الفقر في الحلال أحب إليه من الغنى في الحرام والتواضع في طاعة اللّٰه …"
