label: { ar: "سنن أبي داود 2690 — ما أُحل", en: "Sunan Abi Dawud 2690 — what was made lawful", ur: "سنن ابی داؤد 2690 — جو حلال کیا گیا" }
text: "… لِنَبِيٍّ أَنْ يَكُونَ لَهُ أَسْرَى حَتَّى يُثْخِنَ فِي الأَرْضِ } إِلَى قَوْلِهِ { لَمَسَّكُمْ فِيمَا أَخَذْتُمْ } مِنَ الْفِدَاءِ ثُمَّ أَحَلَّ لَهُمُ اللَّهُ الْغَنَائِمَ. قَالَ أَبُو دَاوُدَ سَمِعْتُ أَحْمَدَ بْنَ حَنْبَلٍ يُسْأَلُ عَنِ اسْمِ أَبِي نُوحٍ فَقَالَ أَيْشٍ تَصْنَعُ بِاسْمِهِ اسْمُهُ اسْمٌ شَنِيعٌ. قَالَ أَبُو دَاوُدَ اسْمُ أَبِي نُوحٍ قُرَادٌ وَالصَّحِيحُ عَبْدُ الرَّحْمَنِ بْنُ غَزْوَانَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2690، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2690 (Jihad (Kitab Al-Jihad)), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2690، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
