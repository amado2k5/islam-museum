text: "… وقال : قد رأيت الذي صنعتم ولم يمنعني من الخروج إليكم إلا أني خشيت عليكم أن تفرض عليكم. قال الحليمي : المعنى خفت أن تفرض عليكم فلا ترعوا حق رعايته فصيروا في استحباب الذم أسوة من قبلكم وهذا كله رأفة …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 165، يرد فيه ذكر ما فُرض على الناس، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 165, whose wording mentions what was made obligatory on people, the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 165 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
