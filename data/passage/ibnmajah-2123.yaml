label:
  ar: "ابن ماجه 2123 — أنفق أنفق عليك"
  en: "Ibn Majah 2123 — Spend, and I shall spend on you"
  ur: "ابن ماجہ 2123 — خرچ کرو، میں تم پر خرچ کروں گا"
text: "إن النذر لا يأتي ابن آدم بشىء إلا ما قدر له ولكن يغلبه القدر ما قدر له فيستخرج به من البخيل فيتيسر عليه ما لم يكن يتيسر عليه من قبل ذلك وقد قال الله أنفق أنفق عليك ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 2123: أنفق أنفق عليك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 2123: Spend, and I shall spend on you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 2123: خرچ کرو، میں تم پر خرچ کروں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
