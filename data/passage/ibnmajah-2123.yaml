label:
  ar: "ابن ماجه 2123 — أنفق أنفق عليك"
  en: "Ibn Majah 2123 — Spend, and I shall spend on you"
  ur: "ابن ماجہ 2123 — خرچ کرو، میں تم پر خرچ کروں گا"
  es: "Ibn Majah 2123 — Gasta, y yo gastaré en ti."
  fr: "Ibn Majah 2123 — Dépensez, et je dépenserai pour vous"
  tr: "İbn Majah 2123 — Harcayın, rızıklandırılırsınız."
  id: "Ibn Majah 2123 — Berinfaklah, maka kamu akan diberi rezeki."
text: "إن النذر لا يأتي ابن آدم بشىء إلا ما قدر له ولكن يغلبه القدر ما قدر له فيستخرج به من البخيل فيتيسر عليه ما لم يكن يتيسر عليه من قبل ذلك وقد قال الله أنفق أنفق عليك ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 2123: أنفق أنفق عليك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 2123: Spend, and I shall spend on you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 2123: خرچ کرو، میں تم پر خرچ کروں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 2123: Gasta, y yo gastaré en ti. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 2123: « Dépensez, et je dépenserai pour vous. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "İbn Majah Süneni'nde 2123 numaralı hadis-i kudsi şöyledir: \"Harca, ben de sana harcayacağım.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi, bu hadisin altı şeriat hadisi ve Muvatta'daki rivayetlerini bir araya getirir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 2123: \"Berinfakkanlah, dan Aku akan berinfakkan kepadamu.\" Hadits ini diriwayatkan oleh Nabi dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
