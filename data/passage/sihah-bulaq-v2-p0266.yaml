text: |-
  •فم) .
  ٢٢٠
  لمدينة يسمونم ا الجبأة هكذا قرأته على أبى سعيد وحكاه أيضاابن كبسان عن ثعلب وهوفى
  كتاب ابن دريد بالقاف وقدسأات عنه بالبادية فلم يعرف⁦( فرطم)⁩ الفرطوم طرف انخفة
  كالمتقار وخفاف مفرطمة سجم الفسمم بالضم الواسع الصدر والميم زائدة
  صم قصم الشئ كسره من غير أن يبين تقول قصمته فانفهم قال تعالى لا انفصام
  لهسا وتفصم مثله قال ذو الرمة يذكرغز الايشبهه بدملج فضة
  كانه دملج من فضة نبه * فى ملعب من جوارى الحى مفدوم
  وانما جعله مفصومالتشنيه واغحمائه اذا نام ولم يقل مقصوم بالقاف فيكون بائنا بائنين وأفصم
  المطرأى أقلع وأفصمت عنه الحى طم فطام الصبى "فصاله عن أمّه يقال قطمت
  الاتمّ ولدها والصبى قطيم والجم-ع فطم مثل سرير وسرر وفطعت الرجل عن عادته قال ابن
  السكيت فاقة فاطم اذا بلغ حوارهاسنة فقطم وأنشد
  من كل كوماء السنام فاطم • تشهابستن الذنوب الراذم• شدفين فى رأس اها صلادم
  قال أبونصر فطمت الحبل قطعته عم) الفعم الممتلى هيقال ساع_دفعم وقد فعم بالضم
  فعامة وفعومة وأفعمت الافاءملأته وقال
  صبحت والطير لم ت-كام • جابية طعت بسيل مفحم
  وأفعمت البيت بريح العود وأفعم المسك البيت ملاه بريحه وأفعمت الرجل ملا نه عضبا
  غم وجدت فغمة الطيب أى ريحه وففعف الطيب اذا ستخياشيمك وفغم
  الورد وتفغم أى تفتح وفغسمه أى قبله قال الاغلب العجلى • بعسد شميم شاعف وفغم
  وكذلك المفاعمة قال الراجز
  واللّٰه ما يشق الفؤاد الهائما * نفت الرقى وعقدك التمائما
  ولا اللمام دون أن تلاعًا • ولا الكزام دون أن تفاعما
  ولا الففام دون أن تفاقا • وتكب القوائم القوائما
  والفغم بالتهريك الحرص وقد فغم بكذا بالكسرأ ولع به وحرص عليه وقال الاعشى
  توم دياربى عامى • وأنت بال عقيل قعم
  وكاب فغم على الصيد قم الفقم بالضم اللحى وفى الحديت من حفظ مابين فقه.ه
  أى مابين لحييه والفم بالتحر بك أن تتقدم الثنايا السفلى فلا تقع على العليا والرجل أفقم
  والافقم من الامور الاءوج والفقم أيضا الامتلاء يقال أصاب من الماءحتى فقم عن ابن
  دريد وتفاقم الامر أى عظم والمفاقة البضاع وقال• ولا الفغام دون أن تفاقاء وفقيم
  حى من كنانة والنسبة اليهم فقمى مثل هذلى وهم نسأة الشهود ⁦(فلم)⁩ أبو عبيد
  الفيلم من الرجال العظيم وأنتدليريق الهذلى
  ويحمى المضاف اذا مادعا • اذافزذ واللمة الفلم
  وفى ذكر الدجال رأيته فيلمانيا ابن السكيت بثرفيلم أى واسعة ويقال الفيلم الرحل
  العظيم الهة وقال
  يفترّق بالسيف أقراته • كما فرق اللمة الفيلم
  لقم الفلقم الواسع م لفم أصله قوه نقصت منه الهاء فلم تحتمل الوا والاعراب
