text: |-
  .7•
  وفرّاط القطامقدماتها الى الوادى والماء قال الراجز
  ومنهل وردته التقاطا * لم أراذوردته فراطا • الا الحام الورق والغطاطا
  وافرطه أى اعجله وأفرطت السحاية بالوسمىّ أى عجملات به وافرطت المرأة أولاد اقد متهم
  وأفرطت المزادة ملاتها يقال غسدير مفرط أى ملان قال الكسائى يقال ما أفرطت من
  القوم احدا أى ماثر كت قأل ومنه قوله تعالى وانهم مفرطون أى متروكون فى النار
  منسيون وأفرط فى الامس أى جاوزفيه الحد والاسم منه الفرط بالتسكين يقسال اياك والفرط
  فى الامر وقولهم لقيته فى الفرط بعد الفرط أى الحين بعد الحسين وأتيته فرط يوم أويومين
  قال لبيد هل النفس الامتعة مستعارة * تعارفتأتى ربها فرط أشهو
  وقال أبو عبيدولا يكون الفرط فى اكثر من خسسة عشر ليسلة والفرطة بالضم اسم للخروج
  والتقدم والفرطة بالفتح المرة الواحدة منه مثل غرفة وغرفة وحسوة وحسوة ومشه قول
  ام سلمة لعائشة رضى اللّٰه عنهما إن رسول اللّٰه صلى اللّٰه عليه وسلم نهال عن الفرطة فى البلاد
  والفرط بالتحريك الذى يتقدّم الواردة فيهي لهم الأرسان والدلاء وعدر الحياض ويستقى
  لهم وهو فعل بعنى فاعل منل تبع بمعنى تابع يقال رجل فرط وقوم فرط أيض
  وفى الحديث أنا فرطكم على الحوض ومفه قيل للطفل الميت اللهم اجعله لمافرطا أى أجرا
  يتقدمناحتى نرد عليه والفارطان كوكبان متباينان امام سريرينات نعش وفارطت
  القوم مفارطة وفراطا أى سابقتهم وهم يتفارطون قال بشر
  ينازعن الاعقة مصفيات • كمايتفارط التمد الجنام
  وتكام ذلان فراطاأى سبقت منه كلمة والماء الفراط الذى يكون إن سبق اليه من الاحياء
  وأمى فرط أى مجا وزفيه الحدّ ومنه قوله تعالى وكان أمره فرطا والفرط أيضاواحد
  الافراط وهى اكام شيهات بالجبال يقال البوم تنوح على الافراط عى أبى نصر قال وعلة
  الجرفى
  وهل سموت بجرارله لجب * جمّ الصواهل بين السهل والفرط
  وأمرفرط أيضا أى متروك وافراط الصبح أول تباشيره والفرط الفرس السربعة التى
  تتفرط الخيل أى تتقدمها قال ابيد
  واقد حيت الحى تحمل شكى * فرط وشاحى اذغدوت لجامها
  وفرطته زكته وتقدمته وقول ساعدة بن جوية معه سقاءلا يفرطحله أى لا يتركه ولا يفارقه
  قال الخليل فرط اللّٰه عنه ما يكره أى نحاه وقلما يستعمل الافى الشعر قال مرقس
  ياصاحبى تلبئالا تعجلا • وقفابر بع الدار كيماتسألا
  فلعل بطأ كما يفرط سيئا * أو يسبق الاسراع خيرامة بلا
  وفلان لا يفترط احسانه وبرّه أى لا ينة رض ولا يخاف فوته ويقال افترط فلان فرطااذامات
  له ولد صغير قبل أن يبلغ الحلم ⁦( رشط )⁩ الفرشطة أن تفرج بين رجليك قائمًا أوقاعدا
  وهو مثل الفرشحة قال الراجز فرشط لماكره الفرشاطا يقال فرشطت الناقة اذا تفحجت
  للحلب وفرشط الجمل اذا تفحج للبول ⁦(فسط)⁩ الفسطاطبيت من شعروفيه ثلاث لغات
  فسطاط وفستاط وفساط وكسر الفاءلغة فيهن وفسطاط مسدينة مصر والفسيط تقروق
  التمرة
