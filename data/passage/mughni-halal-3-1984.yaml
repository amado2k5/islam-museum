text: "… الْحُكْمِ، لأَنْ إقْرَارَهَا لَمْ يُصَادِف زَوْجِيَّةٌ عَلَيْهَا يُيْطِلُهَا، فَقُبِلَ إقْرَارُهَا عَلَى نَفْسِهَا بِتَحْرِيمِهِ عَلَيْهَا. وَكَذَلِكَ لَوْ أَقَرَّ الرَّجُلُ أَنْ هَذِهِ أُخْتُهُ مِنْ الرَّضَاعِ، أَوْ مُحَرَّمَةً عَلَيْهِ بِرِضَاعِ أَوْ غَيْرِهِ، وَأَمْكَنَ صدْقُهُ، لَمْ يَحِلْ لَهُ تَزَوُجُهَا فِيمَا بَعْدَ ذَلِكَ، فِي ظَاهِرِ …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1984، يذكر ما أُحل، وما لا يحل، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 1984, that mentions what was made lawful, what is not lawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 1984 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
