summary:
  ar: "قول لمالك: لو كانت لرجل إبل أو بقر أو غنم تجب في كل صنف منها الصدقة ثم أفاد إليها بعيراً أو بقرة أو شاة صدّقها مع ماشيته حين يصدقها. ويقول مالك: وهذا أحب ما سمعت إلي في هذا. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354}"
