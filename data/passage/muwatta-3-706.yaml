label: { ar: "الموطأ 706 — مالك: من له نصاب من كل صنف ثم أفاد بعيراً أو بقرة أو شاة صدقها مع ماشيته", en: "Muwatta 706", es: "Muwatta 706", fr: "Muwatta 706", ur: "موطا 706", tr: "Al-Muwatta 706 — Malik: Her kimse her türden asgari miktarda hayvana sahip olup da bir deve, bir sığır veya bir koyun edinirse, onu hayvanlarıyla birlikte zekât olarak vermelidir.", id: "Al-Muwatta 706 — Malik: Barangsiapa mempunyai sejumlah minimal setiap jenis ternak, lalu memperoleh seekor unta, sapi, atau domba, maka ia wajib memberikannya sebagai zakat bersama dengan ternaknya." }
summary:
  ar: "قول لمالك: لو كانت لرجل إبل أو بقر أو غنم تجب في كل صنف منها الصدقة ثم أفاد إليها بعيراً أو بقرة أو شاة صدّقها مع ماشيته حين يصدقها. ويقول مالك: وهذا أحب ما سمعت إلي في هذا. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.354}"
  tr: "Malik şöyle demiştir: Bir adamın develeri, sığırları veya koyunları varsa ve her hayvan türü için zekât ödenmesi gerekiyorsa, sürüsüne bir deve, sığır veya koyun daha eklerse, mevcut hayvanlarıyla birlikte bunun da zekâtını öder. Malik şöyle demiştir: Bu konuda duyduğum en tercih edilebilir görüş budur. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.354}"
  id: "Malik berkata: Jika seseorang memiliki unta, sapi, atau domba, dan zakat wajib dibayarkan untuk setiap jenis hewan tersebut, lalu ia menambahkan unta, sapi, atau domba ke dalam kawanan ternaknya, maka ia wajib membayar zakat untuk hewan tersebut bersama dengan ternak yang sudah dimilikinya. Malik berkata: Ini adalah pendapat yang paling utama yang pernah saya dengar mengenai masalah ini. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.354}"
