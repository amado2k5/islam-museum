label: { ar: "الموطأ 716 — محمد بن مسلمة مصدقاً في أشجع: يقول لرب المال أخرج إلي صدقة مالك، فلا يقود إليه شاة فيها وفاء إلا قبلها", en: "Muwatta 716" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان، قال: أخبرني رجلان من أشجع أن محمد بن مسلمة الأنصاري كان يأتيهم مصدقاً فيقول لرب المال: أخرج إلي صدقة مالك، فلا يقود إليه شاة فيها وفاء من حقه إلا قبلها. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي ومن طريقه البيهقي ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.359}"
