label: { ar: "الموطأ 716 — محمد بن مسلمة مصدقاً في أشجع: يقول لرب المال أخرج إلي صدقة مالك، فلا يقود إليه شاة فيها وفاء إلا قبلها", en: "Muwatta 716", es: "Muwatta 716", fr: "Muwatta 716", ur: "موطا 716", tr: "El-Muvatta 716 — Muhammed ibn Maslamah, Aşca’nın sahihliğini doğruluyor: Paranın sahibine, “Bana paranın zekâtını getir” der ve o, zekât için yeterli sayıda bir koyun getirmedikçe, sahibi kabul etmez.", id: "Al-Muwatta 716 — Muhammad ibn Maslamah, menegaskan keaslian Ashja’: Dia berkata kepada pemilik uang, “Bawalah kepadaku zakat dari uangmu,” dan dia tidak akan membawakan seekor domba yang cukup untuk pembayaran kecuali jika dia menerimanya." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان، قال: أخبرني رجلان من أشجع أن محمد بن مسلمة الأنصاري كان يأتيهم مصدقاً فيقول لرب المال: أخرج إلي صدقة مالك، فلا يقود إليه شاة فيها وفاء من حقه إلا قبلها. ويذكر المحقق أنه رواه عن مالك أبو مصعب والشافعي ومن طريقه البيهقي ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.359}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn Yahya ibn Hibban'dan rivayet ederek şöyle demiştir: Aşca'dan iki adam bana, Muhammed ibn Maslamah el-Ensari'nin zekât toplayıcısı olarak yanlarına geldiğini ve mal sahibine, \"Zekâtını getir bana\" dediğini anlattılar. İkâtını yerine getiren bir koyunu bile, mal sahibi kabul etmedikçe getirmezdi. Araştırmacı, Ebu Mus'ab ve Şafiî'nin bunu Malik'ten, onun rivayet zincirinden de Beyhaki ve Yahya ibn Bukayr'dan rivayet ettiğini, Beyhaki'nin de bunu kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.359}"
  id: "Malik meriwayatkan hadits ini dari Yahya ibn Sa'id, yang juga dari Muhammad ibn Yahya ibn Hibban, yang berkata: Dua orang dari Asyjah' memberitahuku bahwa Muhammad ibn Maslamah al-Ansari biasa datang kepada mereka sebagai pemungut zakat dan berkata kepada pemilik harta: \"Bawalah zakatmu kepadaku.\" Ia tidak akan membawakan seekor domba yang memenuhi kewajibannya kecuali jika pemilik harta menerimanya. Peneliti menyebutkan bahwa Abu Mus'ab dan al-Shafi'i meriwayatkan hadits ini dari Malik, dan dari sanadnya, al-Bayhaqi dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.359}"
