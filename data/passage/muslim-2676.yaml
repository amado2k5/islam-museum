label: { ar: "مسلم 2676 — سبق المفردون", en: "Muslim 2676 — The mufarridun have gone ahead" }
text: "كان رسول الله يسير في طريق مكة فمر على جبل يقال له جمدان، فقال: «سيروا، هذا جمدان، سبق المفردون» قالوا: وما المفردون يا رسول الله؟ قال: «الذاكرون الله كثيراً والذاكرات»"
summary:
  ar: "رواية أبي هريرة في كتاب الذكر والدعاء من صحيح مسلم؛ المفردون هم الذاكرون الله كثيراً والذاكرات — عند جبل جمدان في طريق مكة."
