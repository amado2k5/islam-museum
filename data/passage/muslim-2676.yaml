label: { ar: "مسلم 2676 — سبق المفردون", en: "Muslim 2676 — The mufarridun have gone ahead", es: "Musulmán 2676 — Los mufarridun han seguido adelante", fr: "Muslim 2676 — Les mufarridun sont passés en avant", ur: "مسلم 2676 - مفسرین آگے بڑھ گئے۔", tr: "Müslüman 2676 — Tekler daha önce yayınlandı", id: "Muslim 2676 — Single-single tersebut telah dirilis sebelumnya" }
text: "كان رسول الله يسير في طريق مكة فمر على جبل يقال له جمدان، فقال: «سيروا، هذا جمدان، سبق المفردون» قالوا: وما المفردون يا رسول الله؟ قال: «الذاكرون الله كثيراً والذاكرات»"
summary:
  ar: "رواية أبي هريرة في كتاب الذكر والدعاء من صحيح مسلم؛ المفردون هم الذاكرون الله كثيراً والذاكرات — عند جبل جمدان في طريق مكة."
  tr: "Sahih Müslim'de yer alan Dua ve Anma Kitabı'nda Ebu Hurayra'dan rivayet edildiğine göre: Bekâr olanlar, hem erkekler hem de kadınlar, Allah'ı sık sık ananlardır; bunlar Mekke yolundaki Cemdan Dağı'nda bulunurlar."
  id: "Diriwayatkan oleh Abu Hurairah dalam Kitab Zikir dan Doa dari Sahih Muslim: Orang-orang yang berzikir kepada Allah, baik laki-laki maupun perempuan, disebut sebagai orang-orang yang hidup sendiri — di Gunung Jamdan di jalan menuju Mekah."
