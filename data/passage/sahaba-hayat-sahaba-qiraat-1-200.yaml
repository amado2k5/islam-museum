text: "… الأنصار يقال لهم القراء فيهم حالى حرام كانوا يقرون القرآن ويتدارسون بالليل ويتعلمون و كانوا بالنهار يجيثون بالماء فيضعونه فى المجد ويحتطبون فييعونه و يشترون به الطغام لأهل الصفة والفقراء فبعثهم النبى الهم، فعرضوا لهم فقتلوهم قبل ان يلغوا المكان، …"
