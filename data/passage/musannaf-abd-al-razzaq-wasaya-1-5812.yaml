text: "… سيرين عن أَبي الديلم عن معاذ بن جبل قال : حضره الموت فقلنا له : لا نراك إلا قد حضرت فأَوصنا، قال : فأَنا لا أَراني إلا قد حضرت، وساءً حين الكذب هذا، اعلموا أَنه من مات وهو يوقن بثلاث، …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 5812، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
