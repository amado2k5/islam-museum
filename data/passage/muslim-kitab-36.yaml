  en: "Sahih Muslim, Book 36: The Book of Drinks"
  ur: "صحیح مسلم، کتاب الاشربۃ"
  es: "Sahih Muslim, Libro 36: El Libro de las Bebidas"
summary:
  ar: "القسم 36 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأشربة»، ويضم فيها النصوص من 5114 إلى 5383 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 36 of Sahih Muslim (The Book of Drinks) in the division of the open hadith dataset the museum took its reports from: reports 5114 to 5383 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 36، عنوان «کتاب الاشربۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5114 تا 5383۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 36 de Sahih Muslim (El Libro de las Bebidas) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5114 al 5383, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
