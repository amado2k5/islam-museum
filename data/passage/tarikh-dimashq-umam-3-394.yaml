text: "… بين رسول اللّٰه وبين كفار قريش، قال أبو سفيان فوجدنا رسول قيصر في بعض الشام فانطلق بي وبأصحابي إِلى إِيليا حتى أدخلنا عليه وهو جالس في مجلس ملكه وعنده عظماء الروم وعليه التاج، فقال له أقرب نسبًا إِلى هذا الرجل …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 394، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 3, p. 394, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 3، ص 394 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
