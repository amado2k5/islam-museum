label: { ar: "صحيح البخاري 1325 — قيراط الأجر", en: "Sahih al-Bukhari 1325 — the qirat of reward", ur: "صحیح بخاری 1325 — اجر کا قیراط" }
text: "… فَقَالَ سَمِعْتُ النَّبِيَّ. حَدَّثَنَا أَحْمَدُ بْنُ شَبِيبِ بْنِ سَعِيدٍ، قَالَ حَدَّثَنِي أَبِي، حَدَّثَنَا يُونُسُ، قَالَ ابْنُ شِهَابٍ وَحَدَّثَنِي عَبْدُ الرَّحْمَنِ الأَعْرَجُ، أَنَّ أَبَا هُرَيْرَةَ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ شَهِدَ الْجَنَازَةَ حَتَّى يُصَلِّيَ عَلَيْهَا فَلَهُ قِيرَاطٌ، وَمَنْ شَهِدَ حَتَّى تُدْفَنَ كَانَ لَهُ قِيرَاطَانِ \". قِيلَ وَمَا الْقِيرَاطَانِ قَالَ \" مِثْلُ الْجَبَلَيْنِ الْعَظِيمَيْنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1325، يذكر قيراط الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1325 (Funerals (Al-Janaa'iz)), that speaks of the qirat of reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1325، جس میں اجر کا قیراط کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
