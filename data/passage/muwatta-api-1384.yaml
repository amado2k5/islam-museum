text: "… أَوْ شَىْءٌ يُسَمِّيهِ لَهُ يَتَرَاضَيَانِ عَلَيْهِ - وَإِنْ لَمْ تَبِعْهَا فَلَيْسَ لَكَ شَىْءٌ إِنَّهُ لاَ بَأْسَ بِذَلِكَ إِذَا سَمَّى ثَمَنًا يَبِيعُهَا بِهِ وَسَمَّى أَجْرًا مَعْلُومًا إِذَا بَاعَ أَخَذَهُ وَإِنْ لَمْ يَبِعْ فَلاَ شَىْءَ لَهُ. قَالَ مَالِكٌ وَمِثْلُ ذَلِكَ أَنْ يَقُولَ الرَّجُلُ لِلرَّجُلِ إِنْ قَدَرْتَ عَلَى غُلاَمِي الآبِقِ أَوْ جِئْتَ بِجَمَلِي الشَّارِدِ فَلَكَ كَذَا. فَهَذَا مِنْ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1384، يرد فيه ذكر ما لا بأس به. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1384 (Business Transactions), whose wording mentions what is said to be no harm. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1384، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1384, dont le texte mentionne ce qui est dit sans inconvénient. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1384, cuyo texto menciona lo que se dice que no tiene inconveniente. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta adlı eserinde 1384 numaralı hadis, caiz olan şeylerden bahsetmektedir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar hakkında Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte metinleri derleyen yazar, metinde yer alanları açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 1384, menyebutkan apa yang diperbolehkan. Penyusun kitab tentang amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik ini, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
