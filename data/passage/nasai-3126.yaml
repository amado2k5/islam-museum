label:
  ar: "النسائي 3126 — المجاهد في سبيل الله علي ضامن"
  en: "Nasa'i 3126 — The one who strives in God's way is under My guarantee"
  ur: "نسائی 3126 — اللہ کی راہ میں جہاد کرنے والا میری ضمانت میں ہے"
  es: "Nasa'i 3126 — Quien se esfuerza en el camino de Dios está bajo Mi garantía."
  fr: "Nasa'i 3126 — Celui qui s'efforce de suivre la voie de Dieu est sous Ma garantie"
  tr: "Kadınlar 3126 — Allah yolunda mücahit, Ali Damin"
  id: "Wanita 3126 — Mujahid di Jalan Allah, Ali Damin"
text: "أيما عبد من عبادي خرج مجاهدا في سبيل الله ابتغاء مرضاتي ضمنت له أن أرجعه إن أرجعته بما أصاب من أجر أو غنيمة وإن قبضته غفرت له ورحمته ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 3126: المجاهد في سبيل الله علي ضامن. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 3126: The one who strives in God's way is under My guarantee. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 3126: اللہ کی راہ میں جہاد کرنے والا میری ضمانت میں ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 3126: Quien se esfuerza en el camino de Dios está bajo Mi garantía. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sunan an-Nasa'i, n° 3126: « Celui qui lutte pour la cause de Dieu est sous Ma garantie. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sunan-ı Nesai'de 3126 numaralı hadis-i kudsi şöyledir: \"Allah yolunda gayret gösteren, kefil olan Ali'dir.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi, altı şeriat hadis külliyatında ve el-Muvatta'da bu hadisin rivayetlerini derlemiştir."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 3126: \"Orang yang berjuang di jalan Allah adalah Ali, sang penjamin.\" Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta'."
