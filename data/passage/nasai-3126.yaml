label:
  ar: "النسائي 3126 — المجاهد في سبيل الله علي ضامن"
  en: "Nasa'i 3126 — The one who strives in God's way is under My guarantee"
  ur: "نسائی 3126 — اللہ کی راہ میں جہاد کرنے والا میری ضمانت میں ہے"
text: "أيما عبد من عبادي خرج مجاهدا في سبيل الله ابتغاء مرضاتي ضمنت له أن أرجعه إن أرجعته بما أصاب من أجر أو غنيمة وإن قبضته غفرت له ورحمته ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 3126: المجاهد في سبيل الله علي ضامن. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 3126: The one who strives in God's way is under My guarantee. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 3126: اللہ کی راہ میں جہاد کرنے والا میری ضمانت میں ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
