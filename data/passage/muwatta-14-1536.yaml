label: { ar: "الموطأ 1536 — مالك: لا ينبغي لحر أن يتزوج أمة وهو يجد طولا لحرة، ولا أن يتزوجها إذا لم يجد طولا إلا أن يخشى العنت، والعنت الزنا", en: "Muwatta 1536", es: "Muwatta 1536", fr: "Muwatta 1536", ur: "موطا 1536", tr: "El-Muvatta 1536 — Malik: Özgür bir erkek, eğer hür bir kadınla evlenmeye gücü yetiyorsa, bir köle kadınla evlenmemelidir; eğer hür bir kadınla evlenmeye gücü yetmiyorsa da, günaha düşmekten korkmadığı sürece evlenmemelidir; günah ise zinadır.", id: "Al-Muwatta 1536 — Malik: Seorang pria merdeka tidak boleh menikahi seorang budak wanita jika ia mampu membiayai wanita merdeka, dan tidak pula boleh menikahinya jika ia tidak mampu membiayai wanita merdeka, kecuali jika ia khawatir akan jatuh ke dalam dosa, dan dosa itu adalah perzinahan." }
summary:
  ar: "يقول مالك لا ينبغي لحر أن يتزوج أمة، وهو يجد طولا لحرة، ولا يتزوج أمة إذا لم يجد طولا لحرة، إلا أن يخشى العنت، وذلك أن الله تعالى قال في كتابه في نكاح الإماء لمن لم يستطع طولا، واستشهد بآية النساء في ذلك، والعنت هو الزنا. {cite:muwatta-maruf-1997 p.43}"
  tr: "Malik, özgür bir erkeğin, eğer hür bir kadına gücü yetiyorsa köle bir kadınla evlenmemesi gerektiğini, eğer hür bir kadına gücü yetmiyorsa da köle bir kadınla evlenmemesi gerektiğini, ancak günaha düşmekten korkuyorsa bunun mümkün olduğunu söyler. Çünkü Yüce Allah, Kitabında hür bir kadına gücü yetmeyenlerin köle kadınlarla evlenmesi konusunda hüküm vermiş ve bu konuda Nisa Suresi'nin (4:12) ayetini zikretmiştir. Buradaki günah zinadır. {cite:muwatta-maruf-1997 s.43}"
  id: "Malik mengatakan bahwa seorang pria merdeka tidak boleh menikahi seorang budak perempuan jika ia mampu membiayai wanita merdeka, dan juga tidak boleh menikahi seorang budak perempuan jika ia tidak mampu membiayai wanita merdeka, kecuali jika ia khawatir akan jatuh ke dalam dosa. Hal ini karena Allah SWT berfirman dalam Kitab-Nya mengenai pernikahan budak perempuan bagi mereka yang tidak mampu membiayai wanita merdeka, dan beliau mengutip ayat dalam Surah An-Nisa (4:12) dalam hal ini. Dosa di sini merujuk pada perzinahan. {cite:muwatta-maruf-1997 p.43}"
