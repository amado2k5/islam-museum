label: { ar: "الموطأ 1536 — مالك: لا ينبغي لحر أن يتزوج أمة وهو يجد طولا لحرة، ولا أن يتزوجها إذا لم يجد طولا إلا أن يخشى العنت، والعنت الزنا", en: "Muwatta 1536" }
summary:
  ar: "يقول مالك لا ينبغي لحر أن يتزوج أمة، وهو يجد طولا لحرة، ولا يتزوج أمة إذا لم يجد طولا لحرة، إلا أن يخشى العنت، وذلك أن الله تعالى قال في كتابه في نكاح الإماء لمن لم يستطع طولا، واستشهد بآية النساء في ذلك، والعنت هو الزنا. {cite:muwatta-maruf-1997 p.43}"
