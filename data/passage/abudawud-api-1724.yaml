label: { ar: "سنن أبي داود 1724 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 1724 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 1724 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 1724 — lo que fue lícito; lo que no es lícito" }
text: "… سَعِيدِ بْنِ أَبِي سَعِيدٍ، - قَالَ الْحَسَنُ فِي حَدِيثِهِ عَنْ أَبِيهِ، ثُمَّ اتَّفَقُوا - عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" لاَ يَحِلُّ لاِمْرَأَةٍ تُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ أَنْ تُسَافِرَ يَوْمًا وَلَيْلَةً \". فَذَكَرَ مَعْنَاهُ. قَالَ أَبُو دَاوُدَ وَلَمْ يَذْكُرِ الْقَعْنَبِيُّ وَالنُّفَيْلِيُّ عَنْ أَبِيهِ رَوَاهُ ابْنُ وَهْبٍ وَعُثْمَانُ بْنُ عُمَرَ عَنْ مَالِكٍ كَمَا قَالَ الْقَعْنَبِيُّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1724، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 1724 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 1724، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1724 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
