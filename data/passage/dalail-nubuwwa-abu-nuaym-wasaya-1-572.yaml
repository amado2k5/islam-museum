text: "الفصل الثامن والعشرون ح عتيق وفلان فأتى الرجلُ خالدَ بن الوليدَ، فبَعَث، فوجدَ الدرع كما ذكر ووصفَ، فلما قدم على أبي بكر أخبره، فأنفَذَ وصيَّتَه، ولا يُعلم أحدٌ أُنْفِذَتْ وصيتُه بعدَ موتهِ غيرَ ثابتِ بن قيمس. - حدثنا عبد الملك …"
