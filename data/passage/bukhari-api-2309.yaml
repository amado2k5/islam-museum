text: "… أَخَذْتُهُ بِأَرْبَعَةِ دَنَانِيرَ، وَلَكَ ظَهْرُهُ إِلَى الْمَدِينَةِ . فَلَمَّا دَنَوْنَا مِنَ الْمَدِينَةِ أَخَذْتُ أَرْتَحِلُ. قَالَ أَيْنَ تُرِيدُ . قُلْتُ تَزَوَّجْتُ امْرَأَةً قَدْ خَلاَ مِنْهَا. قَالَ فَهَلاَّ جَارِيَةً تُلاَعِبُهَا وَتُلاَعِبُكَ . قُلْتُ إِنَّ أَبِي تُوُفِّيَ وَتَرَكَ بَنَاتٍ، فَأَرَدْتُ أَنْ أَنْكِحَ امْرَأَةً قَدْ جَرَّبَتْ خَلاَ مِنْهَا. قَالَ فَذَلِكَ . فَلَمَّا قَدِمْنَا الْمَدِينَةَ قَالَ يَا بِلاَلُ اقْضِهِ وَزِدْهُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2309، فيه مزاح ودعابة. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 2309, with jesting and playfulness. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 2309، جس میں مزاح اور خوش طبعی ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 2309, avec plaisanterie et badinage. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 2309, con broma y jovialidad. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
