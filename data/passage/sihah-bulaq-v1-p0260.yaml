text: |-
  ٢٨١
  فقلت ازدجر أحنا طيركواعان * بأنك ان قسدمت رجلك عائر
  فأصبحت أنى تأتها تبتئس بها * كلامى كيبها تحت رجلشاجر
  فان تتقدّم تغس منها مقتما غليظاوان أخرت فالكفل فاجر .
  يقول مقعد الرديف مائل والشاجر المختلف واحنا طيرك أى جوانب طيشك والفجر
  بالفتح الكرم والتفجر فى الخير قال الشاعر
  خالفت فى الرأى كل ذى فجر * والبنى بامال غير ما تصف
  وفجنار مثل قطام اسم للفجوروهى معرفة قال النابغة
  انا احتملنا خطتينا بيننا • فح ملت برّة واحتمات فجار
  ويقال أيضاللمرأة بانجاريريديا فاجرة ( خر لفخر الاقتخار وعدّ السديم وكذلك الفخر
  مثل نهرونهو وقد نفهر وافتخر وتفاخر القوم والفخير الذى يقاخرك ومثله الخصيم والفخير الكثير
  الفخر مثال السكير والتفخر التعظم والتكبر بقال فلان متفخر متفجس ابن السكيت فاخرت
  الرجل ففخرته أفره فحرا اذا كنت أكرم منه أبا وأما قال وأفرته على قلان اذافضلته عليه
  فى الفخر وكذلك فحرته عليه تفخيرا والمفخرة يفتح الخاء وضعها المأثرة وفرس فحور أى عظيم
  الجردان وتخلة فخور أى عظيمة الجذع غليظة السعف الاصمعى ناقة فور هى العظيمة الضرع
  الضيقة الاحاليل والفضار الحزف والفاخر من البسر الذى يعظم ولانوى له والفاخور ضرب
  من الرياحين عن اليزيدى وأماقول الراجز
  ان لنا لجارة فناخره • تكدح للدنيا وتنسى الآخره
  فيقال هى المرأة التى تتدوج فى مشيتها ( در لفدرة القطعة من اللحم اذا كانت مجمعة
  قال الراجز وأمعمت كرديدة وفدره والفادرالمسنّ من الوعول ويقال العظيم وكذلك
  الفدور والجمع فدروفدروم وضعها المفدرة وفدر الفحل يفدردورا أى جفروعدل عن
  الضراب فهو فادر والجمع فوادر والغدر بكسر الدال الاحق والفندير والفنديرة الصخر
  العظيمسة تندر من رأس الجبل ⁦(فرد)⁩ فريفر فراراهرب وأفرّه غيره والفرور من النساء
  لنوار ورجل قروكذلك الاثنان والجمع والمؤنت وفى الحديث هذان فرقريس أفلا أرد على
  قريسْ فرها وقد يكون الفرّجع فارّ مثل راكب وركب وصاحب وصحب وفررت الفرس
  أفره بالضم فرا اذا نظرت الى أسنانه قال الجاج فررت عن ذكاء وفروت عن الامر محثت
  عنه وأفرّت الابل للاثناء بالالف اذا ذهبت رواضعها وطلع غيرها وتفار وا أى تهاربوا وافتر
  فلان ضاح_كاأى أبدى أسنائه وفرّة الحر بالضم أوّله ويقال شدته وحكى الكسائى أقرة
  الحرّوأفرّة الحر بضم الهمزة وقصها والفاء مضمومة فيهما وفرس مفر بكسر الميم يصلح
  للفرار عليه والمنر الفرارومنه قوله تعالى أين المفرّ والمفرّ بكسر الفاء الموضع وفرير بطن من
  العرب والفريرولد البقرة الوحشية وكذلك الفرار مثل طويل وطوال ويقال انه يجع فرير
  قال أبو عبيدة ولم يأت على فعال شئمن الجمع الاأحرف هذا أحدها وفى المثل نزوالفرار
  استجهل الفرارا وذلك أنه اذاشب أخذ فى النزوان فى رآه غسير نزالنزوه ويقال أيضا
  إنّ الجواد عينه فراره وقد يفتح أى يغنيك شخصه ومنظره عن أن تختسبره وان تفرأسنانه
  قول وفخرته انفره يفت الحاء
  فى الماضى والمضارع فان قلت
  فاعدة باب المغالبة ان المضارع
  العصيح فيه يكون من باب تصر
  لم يشذمنه غير خاصمنى نفصمته
  اخصه بكسر المضارع قلت
  محل ذلك مالم تكن عينه حرف
  حلق كماهنا والا كان بالفتح
  كما يأتى للمصنف موضافى
  خصم مبينا حكم العصيح
  والمعتل فاذهب اليهان أردت
  فاله نصر
  قوله ذ_دروذ_در أى بضمتين
  أوبضم فسكون اه
