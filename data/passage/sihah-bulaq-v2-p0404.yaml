  وبرقت وتهيات للمعار قاذا وقع المعر ذهب اسم التضيل قال وتخيات على الرجل اذا اخترته
  وتذرست فيه اجير وتخيل له أنه كذا أى تشبه وتخايل يقال تخيلته فتخيل لى كما يقال تصوّرته
  فتصوّرلى وثينته فتبين وتحقشته قتعقق والخمايلة المباراة قال الكميت
  أقول اهم يوم أيمانهم * تخايلها فى الندى الاشمل
  والاخيل طائر قال الفراءهو التقراق عند العرب تتشاءم به قال الفرزدق
  اذا قعان بلغتفبه ابن مدرك * قلاقيت من طير الاخايل أخيلا
  وهو ينصرف فى الفكرة اذاسميت به ومنهم من لا يصرفه فى المعرفة ولا فى النكرة ويجعله
  فى الاصل صفة من التخيل ويحتج بقول حسان بن ثابت رضى اللّٰه عنه
  ذرين وعلى بالاموروشيمتى * فساطائرى فيها عليك بأخيلا
  وبنو الاخيل حىّ من بني عقيل رهط ليلى الاخيلية وقولها
  فن الاخايل مايزال غلامنا • -تيدب على العصامذ كورا
  فانا يجعت القبيل باسم الاخيل بن معاوية العقيلى
  ف ل الدال أل أل انختل وقدد أل يدأل دألاوداً رنا قال أبوذيده
  شية شبيهة بانختل ومشى المنقل وذكر الاصمعى فى صفة مشى الخيل الدألان مشى بقارب
  فيه اللخط ووييفى فيه كانه مثل -ن حل ولدؤلول الداهية والجمع الدآليل يقال وقع القوم
  فى دؤلون أى فى اختلاط من أمرهم والدئل دويية شبيهة بابن عرس قال كعب بن مالت
  جؤايجيش لوقيس معرسه * ما كان الاكعرس الدئل
  قال أحد بنيجي لا نعلم اسماجاء على فعل غير هذا قال الاخذس والى المسمى بهذا الاسم
  ذسب أبو الاسود الدؤلى الا أنهم فتحوا اله-مزة على مذهبه-م فى النسسبة استثالا لتوالى
  الكسرتين مع يادى النسب كما ينسب الى غرغرى" ورباقانوا أبو الاسود الدولى قلبوا الهمزة
  واوالان الهمزة اذا اتفتحت وكانت قبلهاضعة فتخفيفها أن تقلبها واوامحضة كما قالوا
  فى جون جون,فى. ونمون وقال الكابّت هو أبوالامود الديلى فقلب اله-.زيا حدين
  انكسرت فاذا انقلبت يا، كسرت الدال لتسلم لباء كماتقول قيل ويع قال واسمه ظالم بن
  عمروين حلس بن تفاثة بن عدىّ بن الدئل بن بكرين كائة قال الاصعى أخيرنى عيسى بن
  عمر قال الديل بن يكر المكاتى انماهو الدئل قترل أهل الجماز الهمز بل بلت الشئ
  جعته كما تجمع اللقمة بأصابعك والدبلة مثل الكتلة من الصمغ وغيره تة ول منه دبات الذئ
  قال مزرّد ودبات أ.ثال الاثافى كانها • رؤس نقاد قطعت يوم تجمع
  ودبل الارض اصلاحها بالسرجين ونحوه وأرض مديولة وكل شئ أصلحته فقد دبلته
  ودملته ومنه سحيت الجداول الدبول لانها تدبل أى تنقى وتصلح والدبل الداهية بقال دبلا
  دبيلا كايقال شكلاثاكلا قال الشاعر
  طعان الكماة وضرب الجياد • وقول الحواضن دبلاديلا
  والدبيلة الداهية وهى مصغرة للتسكبير يقال دبتهم الدييلة أى أصابتم-م الداهية حكاها
  أبو عبيد والدوبل الحار الصغير لا يكبروكان الاخطل يلقب به ومنه قول جوير ٢
  قوله والدئل:ضم الدال وكسر
  الهسعزة كمافى القاموس اه
