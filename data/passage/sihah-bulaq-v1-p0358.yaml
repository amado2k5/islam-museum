  أبترين لقلة خيره_ما وقد أيتره اللّٰه أَى صيره أيتر ويقال رج-ل أباتربضم الهمزة للذى
  يقطع رحه قال الشاعر
  لشيم تزت فى أنفه خنزوانة • على قطع ذى القربى أحذأباتر
  والبترية فرقة من الزيدية نسبوا الى المغيرة بن سعد ولقبه الابتر ( ئر . البئر الكثير
  بقال كثير شيراتباع له وقدية رد والبنر والبنور خراج صغار واحدتها بثرة وقد يثروجهه
  يبترو كذلك بنروجهه بالك سرو بنر بالضم ثلاث لغات وتبترجلده تنفط والبئرالحسى
  والبذور الاحسا وهى الكرار جر البجربااضم الشر والامر العظسيم قال الراجز
  رمى عليها وهو شئ بجر أى داهية الفرّاءيقال كثير بجيرا تساع له أبوز يدلقت من
  الهارى وهى الدواهى واحدها مجرى مثال قرىّ وقارى والبجر بالتحريك خروج
  لسرة ونتوها وغاظ أصلها والرجل أيج روالمرأة بجراء والجمع بجروقولهم أفضيت اليك بعجرى
  وبجرى أى بعيوبى يعنى أمرى دله وفى المثل عير بجير بجره نسى بجير خبره بعنى عيوبه
  ويقسال هما رحلان اسم أحدهما بجرة.ثال همزة واما ابن بجرة فى قول أبى ذؤيب
  ولو أن ماعند ابن بجرة عندها * من الهر لم تبلل اهاتى بناطل
  فهواسم خاركان بالطائف ⁦(بحر)⁩ البحر خلاف البرّ يقال سموب رالعمقه واتساعه
  والجمع أبحر ويجار وبحوروكل نهر عظيم بحر قال عدى
  سره ماله وكثرة مايملك والبحر معرضا والسدير
  يعى الفرات ويسمى الفرس الواسع الجرى بحرا ومنه قول الني صلى اللّٰه عليه وسلم فى مندوب
  فرس أبى طلمة إن وجدناه لبحراوماء بحرأى ملح وأبحر الماء ملح قال نصيب
  وقد عاذما الارض بحرافردّنى • الى مرضى ان أبحر المشرب العذب
  ويقال أعحرفلان اذاركب البحر عن يعقوب والبجحر عمق الرحم ومنه قبل للدم انخالص الحرة
  باحروبحرانى والباحر الاحق حكاه أبو بيد والبحرين بلدوا نسبة اليه بحرانى قال اليزيدى
  سكرهوا أن يقولو الجرى فيشبه النسبة الى البحروبنات بحر سهائب يجثن قبل الصيف
  منتصبات رقاقابالماء والخاء جميعا والبحرة البلدة بقال هذه عجرتنا أى بلدتنا وأرضنا
  ولقيته صرة مجرة أى بارز اليس بينك وبينه شئ وبحرت أذن الناقة عجراشقتها وخرقتها ومنه
  البهيرة قال الفراء وهى ابنة السائبة ويكمهاحكم أمها وتصر فى العلم وغيره أى تعمق فيه
  وتوسع قال الاصمعى مجر الرجل بالكسر إجر بحرا اذا تحير من الفزع. ثل بطار ويقسال أيضا
  بحراذا اشتدعطشه فلم يروم ن الماء والبحر أيضاداء فى الابل وقد بحرت والاطياء يسمون التغير
  الذى يحدث للعليل دفعة فى الامراض الحادّة بجرانار ية ولون هذايوم بحوان بالاضافة
  ويوم باحورىّ على غيرقياس فكانه منسوب الى باحوروبا -وراء مثل عاشور وعاشورا.
