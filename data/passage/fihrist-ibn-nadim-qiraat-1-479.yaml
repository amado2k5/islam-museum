text: "أبو جَعْفَر محمَّدُ بن سَعْدَان الضَّرير. وكان مُعَلِّمَا للعَامَّة وأحَدَ القُرَّاءِ بقِرَاءَة حَمْزَة. ثم اخْتَارَ لنفسه ففَسَدَ عليه الأصْلُ والفَرْعُ، بَغْدَاديُّ المَوْلِد كُوفِّي وله من الكُتُبِ : ظ كِتَابُ القِرَاءَات. كِتَابُ مُخْتَصَر النَّحْو. وله وهو هِشَامُ بن مُعَاوِيَة الضَّرِير ويُكْنَى …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 479، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
