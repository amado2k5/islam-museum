text: "… من القتال مع الأَوْس والخَزْرَج، وذلك أنَّ الأوس والخَزْرَج، وهم الأنصار، كانوا في الجاهلية عُبَّاد أصنام، وكانت بينهم حروبٌ كثيرةٌ، وكانت يهود المدينة ثلاثَ قبائل: بنو قينقاع، وبنو النضير - حلفاء الخزرج -، وبنو قُرَيْظَة حلفاء الأوس. فكانت الحرب إذا …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 484، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 484, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 484 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
