label: { ar: "الموطأ 391 — ابن عمر يؤخر المغرب في السفر من ذات الجيش إلى العقيق", en: "Muwatta 391", es: "Muwatta 391", fr: "Muwatta 391", ur: "موطا 391", tr: "Al-Muwatta 391 — İbn Ömer, Zâtü'l-Ceyş'ten Akik'e giderken akşam namazını geciktiriyor", id: "Al-Muwatta 391 — Ibnu Umar menunda shalat Maghrib ketika bepergian dari Dhat al-Jaysh ke al-Aqiq" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب قصر الصلاة في السفر: سأل يحيى سالم بن عبد الله عن أشد ما رأى أباه أخّر المغرب في السفر، فقال: غربت الشمس ونحن بذات الجيش فصلى المغرب بالعقيق. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق أخرجه عن الثوري عن يحيى بن سعيد بنحوه. {cite:muwatta-maruf-1997 p.210}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği, yolculuk sırasında namazların kısaltılması bölümünde yer alan bir rivayette şöyle denmektedir: Yahya, Salim ibn Abdullah'a babasının yolculuk sırasında akşam namazını en çok geciktirdiği olayı sormuştur. Salim ibn Abdullah şöyle cevap vermiştir: \"Güneş biz Zhat el-Ceyş'te iken battı, bu yüzden akşam namazını el-Akik'te kıldı.\" Araştırmacı, bu rivayetin Ebu Musab ve Suveyd tarafından Malik'ten, Abdül-Razzaq tarafından da el-Seviri'den, oradan da Yahya ibn Sa'id'den benzer bir biçimde nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.210}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id, dalam bab tentang mempersingkat salat saat bepergian: Yahya bertanya kepada Salim ibn Abdullah tentang kejadian paling parah yang pernah dilihatnya ketika ayahnya menunda salat Maghrib saat bepergian. Ia menjawab: \"Matahari terbenam ketika kami berada di Dhat al-Jaysh, sehingga ia salat Maghrib di al-'Aqiq.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya atas otoritas Malik, dan bahwa 'Abd al-Razzaq meriwayatkannya atas otoritas al-Thawri, atas otoritas Yahya ibn Sa'id, dalam bentuk yang serupa. {cite:muwatta-maruf-1997 p.210}"
