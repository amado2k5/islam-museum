label: { ar: "الموطأ 391 — ابن عمر يؤخر المغرب في السفر من ذات الجيش إلى العقيق", en: "Muwatta 391" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب قصر الصلاة في السفر: سأل يحيى سالم بن عبد الله عن أشد ما رأى أباه أخّر المغرب في السفر، فقال: غربت الشمس ونحن بذات الجيش فصلى المغرب بالعقيق. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن عبد الرزاق أخرجه عن الثوري عن يحيى بن سعيد بنحوه. {cite:muwatta-maruf-1997 p.210}"
