text: "فنأوه وَآمرَأَتُهُ قَائِمَةْ وَهُوْ جَالِسْ فى قرآءة ابن مسعوده علما قربه اليهم قل الا تأكلون قالوا يا ابراهيم أنّا لا نأكل طعاما الا بثمن قل فإن لهذا ثمنا قلوا وما ثمنه قل تذكرون اسم الله على أولة وتحمدونه على آخره …"
summary:
