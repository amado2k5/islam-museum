label: { ar: "صحيح البخاري 5975 — ما حُرّم", en: "Sahih al-Bukhari 5975 — what was made unlawful", ur: "صحیح بخاری 5975 — جو حرام کیا گیا", es: "Sahih al-Bukhari 5975 — lo que se declaró ilícito" }
text: "حَدَّثَنَا سَعْدُ بْنُ حَفْصٍ، حَدَّثَنَا شَيْبَانُ، عَنْ مَنْصُورٍ، عَنِ الْمُسَيَّبِ، عَنْ وَرَّادٍ، عَنِ الْمُغِيرَةِ، عَنِ النَّبِيِّ قَالَ \" إِنَّ اللَّهَ حَرَّمَ عَلَيْكُمْ عُقُوقَ الأُمَّهَاتِ، وَمَنْعَ وَهَاتِ، وَوَأْدَ الْبَنَاتِ، وَكَرِهَ لَكُمْ قِيلَ وَقَالَ، وَكَثْرَةَ السُّؤَالِ، وَإِضَاعَةَ الْمَالِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5975، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 5975 (Good Manners and Form (Al-Adab)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 5975، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5975 (Buenas costumbres y modales (Al-Adab)), menciona lo que se ha prohibido. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
