text: "… أن يمتعها بمتعة سوى نصف المهر الذى وجب عليه لها ان لم يكن دخل جهاأو المهر الواجب عليه كلمان كان دخل بها فيمتعها متعة ينفعها بها وهى غير واجبة عليه ولكنه استهباب ليدخل فى جلة المحسنين أو المتقين والعرب تسمى …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 3، ص 719، يرد فيه ذكر الواجب، وما يجب على المكلف، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 3, p. 719, whose wording mentions the obligatory (wajib), what is binding on the person addressed, what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 3، ص 719 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Lisan al-'Arab de Ibn Manzur, volume numérisé 3, p. 719, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen digitalizado 3, p. 719, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Manzur'un Lisan al-Arab adlı eserinin 3. cildinin 719. sayfasından bir alıntı, farz olan amelleri, yasal olarak sorumlu bir kişiden beklenenleri ve farz olmayan amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Lisan al-Arab karya Ibn Manzur, Volume 3, halaman 719, membahas tentang perbuatan wajib, apa yang dituntut dari seseorang yang bertanggung jawab secara hukum, dan apa yang tidak wajib. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk perbuatan wajib, kewajiban, tindakan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
