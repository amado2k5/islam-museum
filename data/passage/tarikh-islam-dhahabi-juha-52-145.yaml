text: "… بن الخصيب، وحنبل، وابن طَبرْزَد، وطائفة. ورحل فسمع ببغداد من الْحُسَين بن شنيف، وأبي محمد بن الأخضر، وابن مَنِينا، وطبقتهم. وكتب، وحصّل الأصول النّفيسة، ونظر في اللُّغة والعربيّة. وكان إماماً متقِناً ذكيّاً فطِناً، ظريفاً، حُلْو النّادرة، صاحب مُزاحٍ ونوادر. الحسين …"
