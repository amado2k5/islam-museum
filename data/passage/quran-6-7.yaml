  ur: { text: "اور اگر ہم تم پر کاغذوں پر لکھی ہوئی کتاب نازل کرتے اور یہ اسے اپنے ہاتھوں سے بھی ٹٹول لیتے تو جو کافر ہیں وہ یہی کہہ دیتے کہ یہ تو (صاف اور) صریح جادو ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
