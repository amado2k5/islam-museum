text: |-
  وعين رية أى كثيرة الماء قال الاعشى
  فاوردهاءينا من السيفرية • بهابرأً مثل الفسيل المكمم
  والروى" حرف القافية يقال قصيدتان على روىّ واحدواروى أيضاسصابة عظيمة القطر
  شديدة الوقع مثل السقىّ ويقال شربت شربارويا وارتوى الحبل غاظت قواه واروت
  مفاصل الزجل اعتدات وغلظت (رها أبو عبيدة رهابين رجليه يرهورهوا أى فتح
  ومنه قوله تعالى واترل البحرر هواد الهو السير السهل يقال جاءت الخيل رهوا قال ابن
  الاعرابىّ رهايرهوفى السيرأى رفق قال القطامى فى نعت الركاب
  يمنين رهوافلا الاعجاز خاذلة • ولا الصدور على الاعجاز تشكل
  والرهوو الرهوة المكان المرتفع والمنخفض أيضا يجتمع فيه الماء وهو من الاضداد وقال
  نصينامثل رهوة ذات -د • محافظة وكنا الايمنينا
  وقال أبو عبيدالرهو الجوبة تكون فى محلة القوم يسيل منهاماء المطرأ وغيره وفى الحديث انه
  قضى أن لاشفعة فى فناء ولا طريق ولا منقبة ولاركح ولارهو والجمع رهاء والرهوة المرأة
  الواسعة الهن حكاه النضر بن شميل وأرهيت لهم الطعام والشراب اذا أدمته لهم حكاه
  بعقوب مثل أرهنت وه وطعام راهن وراه عن أبى ممر وأى دائم وأنشد للاعشى
  لا يستفيقون منهاوهى راهية • الابهات وان علواوان نهلوا
  ويروى راهنة يعنى الجرواره على نفسك اى ارفق بها والرهوضرب من الطبريقال هو
  الكركى ورهوة فى شعر أبى ذويب عقبة ؟مكان معروف ويقال افعل ذلات رهوا أى ساكنا
  على هينتك وعيش راه أى ساكن رافه وخمس راه اذا كان سهلا ورها البحر أى سحكن
  والرهاء الارض الواسعة ورهاء بالضم والمدحىّ من مذج والنسبة اليهم رهادى
  ⁦( صل الزى)⁩ بي زييت الذى أزبيه زبياجلته قال
  فانها بعض ماتزبى لك الرقم‹ وازد بيت الشئ اذا اجتملته والزية الرابية لا يعلوها الماءونى
  المثل قدبلغ السيل الزبى والزبية حفرة تحفر للاسد سميت بذلك لانهم كانو ا يحفرونها فى موضع
  عال ويقال تزبيت زبية قال • كاللذتزبى زبية فاصطيدا• والازبة السرعة والنشاط على
  أفعول واستثق ل التشديد على الواوقال منظور
  بشمجى المشى عجول الواب * حتى أتى أزيها بالادب
  وقال الاصمفىّ الازابى تضروب مختلفة من السيروا حسدها أزبيّ أبو زيدلقيت منه الازاتي
  وأحدها أزبى وهو الشرّ والامر العظيم ⁦(زجا)⁩، ذجيت الشى ترجية اذا د فعته برفق
  يقال كيف تزجى الايام أى كيف تدافعها ورجل مزجى أى مزلج وتزجيت بكذا
  اكتفيت به قال الراجز«تزج" من دنيساك بالبلاغ* وأزجيت الابل سقتها قال ابن الرقاع
  ترجى أغن كأنَ ابرة روقه * قلم أصاب من الدواة مدادها
  والمزجى الشى القليل وإضاعة مزجاة قليلة والريح تزجو السحاب والبقرة تزجى ولدها أى
  تسوقه وزجا الخراج ينجوزجا ممدود اذا تيسرت جبايته والزياء النفاذ فى الامر بقال
  فلان أزجى بم ذا الامر من فلان أى أشت نفاذافيه عنه ويقسال عطاءقليل يزجوخيرمن
  كمير
