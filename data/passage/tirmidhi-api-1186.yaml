label: { ar: "جامع الترمذي 1186 — الأب والأبوة", en: "Jami' al-Tirmidhi 1186 — the father and fatherhood", ur: "جامع ترمذی 1186 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1186 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1186 — le père et la paternité", tr: "Cami' el-Tirmizi 1186 — Baba ve Babalık", id: "Jami' al-Tirmidhi 1186 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا مُزَاحِمُ بْنُ ذَوَّادِ بْنِ عُلْبَةَ، عَنْ أَبِيهِ، عَنْ لَيْثٍ، عَنْ أَبِي الْخَطَّابِ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي إِدْرِيسَ، عَنْ ثَوْبَانَ، عَنِ النَّبِيِّ قَالَ \" الْمُخْتَلِعَاتُ هُنَّ الْمُنَافِقَاتُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ وَلَيْسَ إِسْنَادُهُ بِالْقَوِيِّ. وَرُوِيَ عَنِ النَّبِيِّ أَنَّهُ قَالَ \" أَيُّمَا امْرَأَةٍ اخْتَلَعَتْ مِنْ زَوْجِهَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1186، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1186 (The Book on Divorce and Li'an), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1186، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1186 (El Libro del Divorcio y Li'an), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1186 (Livre du divorce et du Li'an), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 1186 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı bu hadisi Kur'an, Sünnet, biyografi ve konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1186, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang subjek tersebut."
