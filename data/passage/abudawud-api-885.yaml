label: { ar: "سنن أبي داود 885 — الأب والأبوة", en: "Sunan Abi Dawud 885 — the father and fatherhood", ur: "سنن ابی داؤد 885 — باپ اور والدیت", es: "Sunan Abi Dawud 885 — El padre y la paternidad", fr: "Sunan Abi Dawud 885 — Le père et la paternité", tr: "Sunan Abi Davud 885 — Baba ve Babalık", id: "Sunan Abi Dawud 885 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سَعِيدٌ الْجُرَيْرِيُّ، عَنِ السَّعْدِيِّ، عَنْ أَبِيهِ، أَوْ عَنْ عَمِّهِ، قَالَ رَمَقْتُ النَّبِيَّ فِي صَلاَتِهِ فَكَانَ يَتَمَكَّنُ فِي رُكُوعِهِ وَسُجُودِهِ قَدْرَ مَا يَقُولُ \" سُبْحَانَ اللَّهِ وَبِحَمْدِهِ \". ثَلاَثًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 885، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 885 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 885، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 885 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 885 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 885 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 885, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
