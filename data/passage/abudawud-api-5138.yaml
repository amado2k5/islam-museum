label: { ar: "سنن أبي داود 5138 — الأب والأبوة", en: "Sunan Abi Dawud 5138 — the father and fatherhood", ur: "سنن ابی داؤد 5138 — باپ اور والدیت", es: "Sunan Abi Dawud 5138 — El padre y la paternidad", fr: "Sunan Abi Dawud 5138 — Le père et la paternité" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنِ ابْنِ أَبِي ذِئْبٍ، قَالَ حَدَّثَنِي خَالِي الْحَارِثُ، عَنْ حَمْزَةَ بْنِ عَبْدِ اللَّهِ بْنِ عُمَرَ، عَنْ أَبِيهِ، قَالَ كَانَتْ تَحْتِي امْرَأَةٌ وَكُنْتُ أُحِبُّهَا وَكَانَ عُمَرُ يَكْرَهُهَا فَقَالَ لِي طَلِّقْهَا فَأَبَيْتُ فَأَتَى عُمَرُ النَّبِيَّ فَذَكَرَ ذَلِكَ لَهُ فَقَالَ النَّبِيُّ \" طَلِّقْهَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5138، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5138 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5138، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5138 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 5138 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
