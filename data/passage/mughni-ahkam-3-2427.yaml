text: "… الرَّأْيِ، وَالْقَوْلالثانِي لِلسَّافِعِي؟ لأُنَّهُ المغني - كتاب الأيمان فصل منى يحرم حلُّ اليمين مُحَرَّمَا؛ لأَنَ حَلَّهَا بِفِعْلِ الْمُحَرَّمِ وَهُوَ مُحَرَّمْ. وَإِنْ كَانَتْ عَلَى فِعْلِ مَنْدُوبٍ، أَوْ تَرْكِ مُكْرُوه، فَحَلُهَا مَكْرُوهْ. وَإِنْ كَانَتْ عَلَى فِئْلِ مُبَاحِ، فَحَلُّهَا مُبَاحٌ. فَإِنْ قِيلَ: فَكَيْفَ …"
