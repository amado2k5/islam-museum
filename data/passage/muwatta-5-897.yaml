label: { ar: "الموطأ 897 — سعيد بن المسيب: من شهد العشاء من ليلة القدر فقد أخذ بحظه منها", en: "Muwatta 897", es: "Muwatta 897", fr: "Muwatta 897", ur: "موطا 897", tr: "El-Muvatta 897 — Sa’id ibn al-Musayyab: Kadir Gecesi'nde yatsı namazına katılan kimse, o gecenin kendi payına düşen kısmını almıştır.", id: "Al-Muwatta 897 — Sa’id ibn al-Musayyab: Barang siapa yang menghadiri shalat Isya pada Malam Lailatul Qadar, maka ia telah mendapatkan bagiannya." }
text: "من شهد العشاء من ليلة القدر فقد أخذ بحظه منها"
summary:
  ar: "آخر نص في كتاب الاعتكاف. يرويه زياد عن مالك أنه بلغه أن سعيد بن المسيب كان يقول: من شهد العشاء من ليلة القدر فقد أخذ بحظه منها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (891) وسويد (452). {cite:muwatta-maruf-1997 p.431}"
  tr: "İtikaf hakkındaki kitabın son metni. Ziyad bunu Malik'ten rivayet eder; Malik de Sa'id ibn al-Musayyab'ın şöyle dediğini işitmiştir: \"Kim Kadir Gecesi yatsı namazına katılırsa, o namazdan payına düşeni almıştır.\" Editör, bunun Malik'ten Ebu Mus'ab (891) ve Suveyd (452) tarafından rivayet edildiğini belirtir. {cite:muwatta-maruf-1997 s.431}"
  id: "Teks terakhir dalam buku ini membahas i'tikaf. Ziyad meriwayatkannya dari Malik, yang mendengar bahwa Sa'id ibn al-Musayyab biasa berkata: \"Siapa pun yang menghadiri shalat Isya pada Laylat al-Qadr telah menerima bagiannya.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (891) dan Suwayd (452). {cite:muwatta-maruf-1997 p.431}"
