label:
  ar: "النسائي 1524 — أصبح من عبادي مؤمن بي وكافر"
  en: "Nasa'i 1524 — Some of My servants have woken as believers in Me and some as deniers"
  ur: "نسائی 1524 — میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ"
text: "قال الله عز وجل ما أنعمت على عبادي من نعمة إلا أصبح فريق منهم بها كافرين يقولون الكوكب وبالكوكب ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 1524: أصبح من عبادي مؤمن بي وكافر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 1524: Some of My servants have woken as believers in Me and some as deniers. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 1524: میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
