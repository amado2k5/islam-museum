label: { ar: "الموطأ 2321 — مالك: أم الولد تسعى على أولاد المكاتب إن كانت مأمونة", en: "Muwatta 2321" }
summary:
  ar: "قال مالك في مكاتب يموت ويترك مالا لا يفي بالكتابة، ويترك ولدا معه في كتابته وأم ولد، فأرادت أم الولد أن تسعى عليهم: يُدفع إليها المال إذا كانت مأمونة عليه قوية على السعي، وإن لم تكن قوية ولا مأمونة لم تعط شيئا، ورجعت هي وولد المكاتب رقيقا لسيد المكاتب. {cite:muwatta-maruf-1997 p.357}"
