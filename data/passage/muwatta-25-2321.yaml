label: { ar: "الموطأ 2321 — مالك: أم الولد تسعى على أولاد المكاتب إن كانت مأمونة", en: "Muwatta 2321", es: "Muwatta 2321", fr: "Muwatta 2321", ur: "موطا 2321", tr: "Al-Muwatta 2321 — Malik: Bir çocuğun annesi (umm walad), köle azat sözleşmesi (mukatab) yapmış olan kölelerin çocuklarından, eğer güvenilir ise, sorumludur." }
summary:
  ar: "قال مالك في مكاتب يموت ويترك مالا لا يفي بالكتابة، ويترك ولدا معه في كتابته وأم ولد، فأرادت أم الولد أن تسعى عليهم: يُدفع إليها المال إذا كانت مأمونة عليه قوية على السعي، وإن لم تكن قوية ولا مأمونة لم تعط شيئا، ورجعت هي وولد المكاتب رقيقا لسيد المكاتب. {cite:muwatta-maruf-1997 p.357}"
  tr: "Malik, ölen bir kölenin, azat masraflarını karşılamaya yetmeyen bir para bırakması ve geride bir çocuk ile bir cariye bırakması durumunda, cariyenin onlar için çalışmak istemesi halinde şunları söylemiştir: Eğer cariye güvenilir ve çalışmaya muktedir ise, ona para verilir. Eğer ne çalışmaya muktedir ne de güvenilir ise, ona hiçbir şey verilmez ve o ve çocuğu kölenin efendisinin kölesi olmaya geri dönerler. {cite:muwatta-maruf-1997 s.357}"
  id: "Malik berkata mengenai seorang budak yang meninggal dunia dan meninggalkan uang yang tidak cukup untuk menutupi biaya pembebasannya, serta meninggalkan seorang anak dan seorang selir, dan selir tersebut ingin bekerja untuk mereka: uang itu diberikan kepadanya jika dia dapat dipercaya dan mampu bekerja. Jika dia tidak mampu dan tidak dapat dipercaya, dia tidak diberi apa pun, dan dia serta anak budak tersebut kembali menjadi budak dari tuannya. {cite:muwatta-maruf-1997 p.357}"
