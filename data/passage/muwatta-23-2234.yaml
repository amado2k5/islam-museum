label: { ar: "الموطأ 2234 — مالك: في العبد يكون بعضه حرا وبعضه مسترقا: إن ماله يوقف بيده، وليس له أن يحدث فيه شيئا، وإنه يأكل فيه ويكتسي بالمعروف، فإذا هلك فماله للذي بقي له فيه من الرق", en: "Muwatta 2234", es: "Muwatta 2234", fr: "Muwatta 2234", ur: "موطا 2234", tr: "El-Muvatta 2234 — Malik: Kısmen özgür, kısmen köle olan bir köleye gelince: malı onun mülkiyetindedir ve onu hiçbir şekilde elden çıkarmasına izin verilmez. Makul bir şekilde onunla yiyebilir ve giyinebilir. Ölürse, malı köle olarak kalan kısmına geçer.", id: "Al-Muwatta 2234 — Malik: Mengenai seorang budak yang sebagian merdeka dan sebagian diperbudak: hartanya tetap menjadi miliknya, dan dia tidak diperbolehkan untuk menggunakannya dengan cara apa pun. Dia boleh makan dan berpakaian dengan harta itu secara wajar. Jika dia meninggal, hartanya menjadi milik bagian dirinya yang tetap diperbudak." }
summary:
  ar: "قال: وسمعت مالكا يقول في العبد يكون بعضه حرا وبعضه مسترقا: إنه يوقف ماله بيده، وليس له أن يحدث فيه شيئا، ولكنه يأكل فيه ويكتسي بالمعروف، فإذا هلك فماله للذي بقي له فيه من الرق. {cite:muwatta-maruf-1997 p.319}"
  tr: "Şöyle dedi: Malik'in, kısmen özgür kısmen köle olan bir köle hakkında şöyle dediğini duydum: Mal varlığı onun elindedir ve onunla hiçbir şey yapmasına izin verilmez, ancak makul bir şekilde yiyebilir ve giyebilir. Ölürse, mal varlığı köle olarak kalan kısmına aittir. {cite:muwatta-maruf-1997 s.319}"
  id: "Dia berkata: Saya mendengar Malik berkata mengenai seorang budak yang sebagian bebas dan sebagian diperbudak: Hartanya tetap menjadi miliknya, dan dia tidak diperbolehkan melakukan apa pun dengannya, tetapi dia boleh makan dan berpakaian dengan harta itu secara wajar. Jika dia meninggal, hartanya menjadi milik bagian dirinya yang tetap diperbudak. {cite:muwatta-maruf-1997 p.319}"
