text: "… إلى الدبيلة، أن يكون الوجع فم ي الا نارد جداً، والأعراض تشتد، تختلف الحمّيات اختلاف البطن، وإخراج البول. وعلامة النضج التام، أن تسكن الحمّى والضربان، ويتحرك النافض، وورم الرحم، ودبيلته، إذا كانا في الرحم أمكن أن ترى، وإن كان غائصاً …"
