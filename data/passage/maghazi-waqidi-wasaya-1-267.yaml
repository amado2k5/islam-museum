text: "… أَبدانهما، فقال النبيّ : ادفنوهما جميعاً فى قبرٍ واحد. ويقال إنما أَمر بدفنهما فى قبرٍ واحد لما كان بينهما من. الصِّفاء فقال : ادفنوا هذين المتحابّين فى الدنيا فى قبرٍ واحد. وكان عبد اللّٰه بن عمرو بن حَرام رجااً أَحمر …"
