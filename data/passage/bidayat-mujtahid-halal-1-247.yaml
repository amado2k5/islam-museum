text: "… طلقها أو لا نكاح بينهما قبله؛ أي: قبل العقد ولم يرجع عن نيته عند العقد. أو نوى المحلل ذلك ؛ أي: أنه متى أحلها للأول طلقها ولم يرجع عن نيته عند العقد وهو ؛ أي: النكاح في الصور المذكورة حرام …"
summary:
