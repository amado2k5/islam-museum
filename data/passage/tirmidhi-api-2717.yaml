text: "ثُمَّ دَعَا بِكِتَابِ رَسُولِ اللَّهِ صلى الله عليه وسلم فَقُرِئَ فَإِذَا فِيهِ بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ مِنْ مُحَمَّدٍ عَبْدِ اللَّهِ وَرَسُولِهِ إِلَى هِرَقْلَ عَظِيمِ الرُّومِ السَّلاَمُ عَلَى مَنِ اتَّبَعَ الْهُدَى أَمَّا بَعْدُ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ وَأَبُو سُفْيَانَ اسْمُهُ صَخْرُ بْنُ حَرْبٍ ‏.‏"
summary:
  ar: "في جامع الترمذي؛ نص كتاب أو جوابه منسوب إلى مرسل."
