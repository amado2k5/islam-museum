text: "… فلما انتهى إلى ماء مِن مياه نجد يقال له: فَرْدَة، أصابته الحُمَّى بها، فمات، فلما أحس بالموت أنشد : أَمُرْ تَحِلٌ قَوْمِي المَشَارِقَ غُدْوَةً وَأَتْرَكُ في بَيْتٍ بفَرْدَةَ مُنجِد الارُبَّ يَوْمِ لَوْ مَرِضْتُ لَعَادَني عَوَائِدُ مَنْ لَمْ يُبْرَ مِنهُنَّ يَجْهَدِ …"
