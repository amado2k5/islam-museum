text: |-
  ٣٧٩
  -ترقها وارس عنظوان • فاليوم منهايوم أرونات .
  فيحتدل الاضافة الى صفته ويحتمل ماذكرناً ⁦(رهن)⁩ الرهن معروف والبهع رهان مثل حيل
  وحبال وقال أبو عمرو بن العلاءرهن بضم الهاء قال الاخفش وهى قبيهة لانه لا يجمع فعل
  على فعل الاقلي لا شاذا قال وذكرأنهميولون سقف وسقف وال وقد يكون رهن بحعاللرهان
  كأنه يجمع رهن على رهان ثم يجمع رهمان على رهن مشل فراش وفرش تقول منه رهنت
  الشئ عند فلان ورهنته الذى وأرهنته الشى بعنى قال عيد اللّٰه بن همام السلولىّ
  فلا خشيت أظافيرهم * نجوت وأرهنتهم مالكا
  قال:علب الرواة كاه-م على أردنتهم على أنه يجوذرهنته وأرهنته الا الاصعى فانه رواه
  وأرهنهم على أنه عدف بفعل مستقبل على فعل ماض وشبهه بتولهم قت وأصك وجهه وهو
  مذهب حسن لان الواووا وحال فيجعل أصل -لا للفعل الاقل على معني قت صا كاوجهه
  أى تركنه مقها عندهم ليس من طريق الرهن لانه لا يقال أرهنت الشى وانما يقال رهنته
  ورهن الشئ أى دام وثبت والراهن الثابت والراهن المهزول من الابل والناس وقال
  اماترى جسمى خلاقدرهن • هزلا ومامجد الرجال فى السمن
  وقال أبوزيد أرهنت فى السلعة غاليت به اوهو من الغلاء خاصة وأنشد
  عيدية أرهنت فيها الدنانيره وقال ابن ال كيت أرهنت فيها بمعنى أسلفت فيها والموتهن الذى
  يأخد الرهن والشئ مرهون ورهير والاثى رهينة وراهنت فلانا على كذا مراهنة خاطرته
  وأرهنت به ولدى إرهانا أخطر تهم به خطرا والرهينة واحدة الرهإئن وره ن الشى رهنا أى
  دام وأرهنت اهسم الطعام والشراب أدمته لهم وهو طعام راهن⁦( رهدن )⁩ الرهادن طير
  :كة أمشال العصافير الواحدرهدن والرهدن والرهدنة طاريشبه الحرة الا انه أدبس وهو
  أكبر من الحرة وقال تذريننا بالقول -تى كانه • تذرى ولدان يصدن رهادنا
  ( دين الرين العاميع والدنس يقال وان على قلبه ذنيسه يرين ديناوريونا أى غلب قال أبو
  مبيدة فى قوله تعالى كلابل ران على قلوبهم ما كانوا يكسبون أى غلب وقال الحمسن. والذنب
  على الذنبحتى يسواد القلب وقال أبو، بيسد كل ماغلبك فقدران بك ورانك وران عليك
  وفى حديث عمو رضى اللّٰه عنه أنه خطب فقال ألا ان الاسيفع أسيفع جهينة قدرضى من
  دينه وأمانته بأن يقال سبق الحاج فاذان معرضا فأصبح قدرين به قال أبوز يديقال رين
  بالرجل اذا وقع فيم. لا يستطيع الخروج منه ولا قبل له به وران النعاس فى العين ورانت اناهر
  عليه غلبته وقال القنانى الاعرابى رين به أى انقطع به ورانت نفسه ترين رينا أى خئت
  وغنت وأران القوم أى هلكت ماشيتهم وهم مر ينون
  صل الزاى أن لب زئد باله مزوهو القصير ولا تقل صيتق والزوان الذى
  يخالط البز( زبن الزبر الدفع وزينت الناقة اذاضر يت بتقنات رجلها عند الجلب
  فالز بن بالثفنات وألركض بالرجل والخيط باليد وناقة زيون سيئة اللخلق تضرب حالبها
  وتدفعه وحرب زيون تزبين الناس آى تسدمهم وتدفعهم والزبانية عند العرب الشرط
  . سحى بذلك بعض! الاتسكة لدفعهم أهل النسارا ليها قال الاخفش قال بعضهم وا-دهم زباتى
