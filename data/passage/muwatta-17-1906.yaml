label: { ar: "الموطأ 1906 — مالك: تفسير المكروه أن يؤخذ البعير بالبعيرين ليس بينهما تفاضل في نجابة ولا رحلة، فلا يشترى منه اثنان بواحد إلى أجل، ولا بأس بأن تبيع ما اشتريت قبل أن تستوفيه من غير الذي اشتريته منه إذا نقدت ثمنه", en: "Muwatta 1906", es: "Muwatta 1906", fr: "Muwatta 1906", ur: "موطا 1906", tr: "El-Muvatta 1906 — Malik: Hoş görülmeyen şeyin yorumu şudur: Kalite veya binilebilirlik bakımından aralarında hiçbir fark olmayan iki deve karşılığında bir deve alınması. Dolayısıyla, krediyle iki deveyi bir deve karşılığında almak doğru değildir. Ve eğer bedelini nakit olarak öderseniz, satın aldığınız şeyi, teslim almadan önce başka birinden satmanızda bir sakınca yoktur.", id: "Al-Muwatta 1906 — Malik: Penafsiran tentang apa yang tidak disukai adalah menukar satu unta dengan dua unta padahal tidak ada perbedaan kualitas atau kemampuan untuk ditunggangi di antara keduanya. Oleh karena itu, seseorang tidak boleh membeli dua unta dengan harga satu unta secara kredit. Dan tidak ada salahnya menjual barang yang dibeli sebelum diambil dari orang lain selain penjualnya, jika harga barang tersebut dibayar tunai." }
summary:
  ar: "قال مالك: وتفسير ما كره من ذلك، أن يؤخذ البعير بالبعيرين، ليس بينهما تفاضل في نجابة ولا رحلة. فإذا كان هذا على ما وصفت لك، فلا يشترى منه اثنان بواحد إلى أجل. ولا بأس بأن تبيع ما اشتريت منها قبل أن تستوفيه، من غير الذي اشتريته منه، إذا نقدت ثمنه. {cite:muwatta-maruf-1997 p.181} {cite:muwatta-maruf-1997 p.182}"
  tr: "Malik şöyle dedi: Bu konuda hoşlanmadığı şeyin açıklaması şudur: Bir deve, kalite veya binilebilirlik açısından aralarında hiçbir fark olmaksızın iki deveyle takas edilmelidir. Eğer bu size anlattığım gibiyse, o zaman iki deve bir deve karşılığında krediyle alınmamalıdır. Satın aldığınız şeyi, onu teslim almadan önce, satın aldığınız kişiden başka birine satmanızda bir sakınca yoktur, yeter ki bedelini nakit olarak ödeyin. {cite:muwatta-maruf-1997 s.181} {cite:muwatta-maruf-1997 s.182}"
  id: "Malik berkata: Penjelasan mengapa ia tidak menyukai hal ini adalah karena satu unta ditukar dengan dua unta, tanpa perbedaan kualitas atau kemampuan untuk ditunggangi di antara keduanya. Jika demikian seperti yang telah saya jelaskan kepada Anda, maka dua unta tidak boleh dibeli dengan satu unta secara kredit. Tidak ada yang salah dengan menjual apa yang Anda beli sebelum memilikinya, kepada orang lain selain orang yang menjualnya kepada Anda, asalkan Anda membayar harganya secara tunai. {cite:muwatta-maruf-1997 p.181} {cite:muwatta-maruf-1997 p.182}"
