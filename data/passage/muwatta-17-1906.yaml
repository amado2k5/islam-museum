label: { ar: "الموطأ 1906 — مالك: تفسير المكروه أن يؤخذ البعير بالبعيرين ليس بينهما تفاضل في نجابة ولا رحلة، فلا يشترى منه اثنان بواحد إلى أجل، ولا بأس بأن تبيع ما اشتريت قبل أن تستوفيه من غير الذي اشتريته منه إذا نقدت ثمنه", en: "Muwatta 1906" }
summary:
  ar: "قال مالك: وتفسير ما كره من ذلك، أن يؤخذ البعير بالبعيرين، ليس بينهما تفاضل في نجابة ولا رحلة. فإذا كان هذا على ما وصفت لك، فلا يشترى منه اثنان بواحد إلى أجل. ولا بأس بأن تبيع ما اشتريت منها قبل أن تستوفيه، من غير الذي اشتريته منه، إذا نقدت ثمنه. {cite:muwatta-maruf-1997 p.181} {cite:muwatta-maruf-1997 p.182}"
