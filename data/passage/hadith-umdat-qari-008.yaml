text: ": لا تعصوا ولم يقل ولا تعصوني. قلت: في رواية الإسماعيلي، في باب وفود الأنصار: ولا تعصوني، فحينئذ الأحسن هو الجواب الأول. وقال الزمخشري: في آية المبايعات: فإن قلت: لو اقتصر على قوله: لا بعصينك، فقد علم أن رسول الله"
