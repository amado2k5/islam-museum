text: "… حدثنا أبو بكر بن خلاد قال ثنا الحارث بن أبى اسامة قال ثنا يزيد بن هارون قال أنبأنا زكرياء بن أبى زائدة عن الشعبى عن عبد اللّٰه بن حمرو. قال قال رسول اللّٰه : المسلم من سلم المسلمون من لسانه …"
summary:
