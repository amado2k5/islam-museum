text: "… نسقيك نبيذاً ؛ ذكره أبو بكر الباطرقاني في طبقات القراء. فقال: نعم الحديث، وفيه: فانتبذوا في القرب، وأخرج من طريق ابن وَهْب عن خلاد بن سليمان، وغيروا طعم الماء واشربوا فعليٌّ ساقط. قال: اختصم عبد الواحد، وكان ممن جمع القرآن …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 970، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 970, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 970 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
