label: { ar: "صحيح البخاري 2322 — نقص قيراط من الأجر كل يوم", en: "Sahih al-Bukhari 2322 — a qirat lost from the reward each day", ur: "صحیح بخاری 2322 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sahih al-Bukhari 2322 — una qirat perdida de la recompensa cada día", fr: "Sahih al-Bukhari 2322 — une qirat perdue pour la récompense chaque jour", tr: "Sahih el-Buhari 2322 — Her gün sevaptan bir kırat düşülür.", id: "Sahih al-Bukhari 2322 — Satu qirat dikurangi dari pahala setiap hari" }
text: "… عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ ـ قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ أَمْسَكَ كَلْبًا فَإِنَّهُ يَنْقُصُ كُلَّ يَوْمٍ مِنْ عَمَلِهِ قِيرَاطٌ، إِلاَّ كَلْبَ حَرْثٍ أَوْ مَاشِيَةٍ \". قَالَ ابْنُ سِيرِينَ وَأَبُو صَالِحٍ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ \" إِلاَّ كَلْبَ غَنَمٍ أَوْ حَرْثٍ أَوْ صَيْدٍ \". وَقَالَ أَبُو حَازِمٍ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2322، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 2322 (Agriculture), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 2322، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2322 (Agricultura), habla de una qirat que se pierde de la recompensa cada día. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 2322 (Agriculture), mentionne une qirat (unité de mesure) perdue chaque jour pour la récompense. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "Sahih el-Buhari'de 2322 numaralı hadiste, her gün sevabın bir kırat (bir ağırlık birimi) azaldığından bahsedilir. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesine dahildir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2322, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
