text: "… ساعات، وهذا أعدل النوم عند الأطباء وما زاد عليه أو نقص منه أثّر عندهم في الطبيعة انحرافًا جسيمًا. ومن النوم الذي لا ينفع أيضًا : النوم أول الليل عقب غروب الشمس، وكان رسول اللّٰه يكرهه فهو مكروه شرعًا وطَبْعًا. انظر …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 1، ص 113، يرد فيه ذكر المكروه، وما كان يُكره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 1, p. 113, whose wording mentions the disliked (makruh), what used to be disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 1، ص 113 کا اقتباس جس میں مکروہ، جو ناپسند کیا جاتا تھا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Zuhd de Ahmad ibn Hanbal, volume numérisé 1, p. 113, dont le texte mentionne le réprouvé (makruh), ce qui était réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
