  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zühd) adlı eserinin 1. cildinin 113. sayfasından, mekruh sayılan ve mekruh sayılan şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Bu bölüm, farz olan, görevler, itaat gerektiren, tavsiye edilen, mekruh sayılan, haram sayılan ve küçük günahlar hakkında bilgi içermektedir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 1, halaman 113, yang menyebutkan apa yang tidak disukai dan apa yang dianggap tidak disukai; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari mengenai amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
