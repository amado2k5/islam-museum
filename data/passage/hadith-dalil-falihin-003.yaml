text: "ر القاضي عياض إلا هذا، وهو منسوب إلى بني أسيد بطن من تميم. وفي كتاب تقييد المهمل لأبي علي الحياني الأسيدي بضم الهمزة وفتح السين وتخفيف الياء الأولى، وقد شددها قوم. يقال ذلك لكل من ينسب إلى أسيد بن عمرو"
