label: { ar: "الموطأ 538 — عمر: من فاته حزبه من الليل فقرأه حين تزول الشمس إلى صلاة الظهر فكأنه أدركه", en: "Muwatta 538" }
text: "من فاته حزبه من الليل، فقرأه حين تزول الشمس إلى صلاة الظهر، فإنه لم يفته، أو كأنه أدركه"
summary:
  ar: "أول حديث في باب ما جاء في تحزيب القرآن. يرويه مالك عن داود بن الحصين عن الأعرج عن عبد الرحمن بن عبد القاري، أن عمر بن الخطاب قال: من فاته حزبه من الليل فقرأه بين زوال الشمس وصلاة الظهر فكأنه لم يفته. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وقتيبة عند النسائي (3/260)، وينقل عن ابن عبد البر أن هذا وهم من داود، لأن المحفوظ من حديث ابن شهاب عن السائب بن يزيد وعبيد الله بن عبد الله عن عبد الرحمن بن عبد عن عمر: من نام عن حزبه فقرأه ما بين صلاة الفجر وصلاة الظهر كُتب له كأنما قرأه من الليل، وأن ابن شهاب أتقن حفظاً. ويضيف المحقق أن حديث الزهري المرفوع أخرجه مسلم (2/171) وأبو داود (1313) والترمذي (581) وقال: حسن صحيح، وأن الدارقطني رجح الموقوف والطحاوي المرفوع. {cite:muwatta-maruf-1997 p.276} {cite:muwatta-maruf-1997 p.277}"
