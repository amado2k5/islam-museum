label: { ar: "الموطأ 538 — عمر: من فاته حزبه من الليل فقرأه حين تزول الشمس إلى صلاة الظهر فكأنه أدركه", en: "Muwatta 538", es: "Muwatta 538", fr: "Muwatta 538", ur: "موطا 538", tr: "Al-Muwatta 538 — Ömer: Kim gece namazının kendi payını kaçırır da, güneşin en tepe noktasına ulaşması ile öğle namazı arasında kılarsa, sanki namazı kıldırmış gibidir.", id: "Al-Muwatta 538 — Umar: Barang siapa yang ketinggalan bagian shalat Isya dan mengerjakannya di antara titik tertinggi matahari dan shalat Zuhur, maka seolah-olah dia telah mengerjakannya." }
text: "من فاته حزبه من الليل، فقرأه حين تزول الشمس إلى صلاة الظهر، فإنه لم يفته، أو كأنه أدركه"
summary:
  ar: "أول حديث في باب ما جاء في تحزيب القرآن. يرويه مالك عن داود بن الحصين عن الأعرج عن عبد الرحمن بن عبد القاري، أن عمر بن الخطاب قال: من فاته حزبه من الليل فقرأه بين زوال الشمس وصلاة الظهر فكأنه لم يفته. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي وقتيبة عند النسائي (3/260)، وينقل عن ابن عبد البر أن هذا وهم من داود، لأن المحفوظ من حديث ابن شهاب عن السائب بن يزيد وعبيد الله بن عبد الله عن عبد الرحمن بن عبد عن عمر: من نام عن حزبه فقرأه ما بين صلاة الفجر وصلاة الظهر كُتب له كأنما قرأه من الليل، وأن ابن شهاب أتقن حفظاً. ويضيف المحقق أن حديث الزهري المرفوع أخرجه مسلم (2/171) وأبو داود (1313) والترمذي (581) وقال: حسن صحيح، وأن الدارقطني رجح الموقوف والطحاوي المرفوع. {cite:muwatta-maruf-1997 p.276} {cite:muwatta-maruf-1997 p.277}"
  tr: "Kur'an'ın bölümlere ayrılması bölümündeki ilk hadis. Malik, Davud ibn el-Hüseyn'den, o da el-A'raj'dan, o da Abdurrahman ibn Abdurkari'den rivayet ettiğine göre Ömer ibn el-Hattab şöyle buyurmuştur: \"Kim geceleyin Kur'an'dan bir bölümünü kaçırır da, güneşin tepe noktası ile öğle namazı arasında okursa, sanki kaçırmamış gibi olur.\" Editör, bu hadisin Malik'ten Ebu Musab, Suveyd, el-Ka'nebi ve Kuteybe tarafından el-Nesai'de (3/260) rivayet edildiğini belirtmektedir. İbn Abdülberr'in, bunun Davud'un bir hatası olduğunu söylediğini aktarıyor; çünkü sahih hadis, İbn Şihab'ın, el-Sa'ib ibn Yezid ve Ubeydullah ibn Abd Allah'tan, o da Abdülrahman ibn Abd'tan, o da Ömer'den rivayet ettiği hadistir: \"Kim namazını uyuyarak geçirir ve sabah namazı ile öğle namazı arasında okursa, gece okumuş gibi kaydedilir.\" İbn Şihab'ın daha doğru bir ezbere sahip olduğunu da ekliyor. Editör ayrıca, Peygamber'e isnat edilen Zühri hadisinin Müslim (2/171), Ebu Davud (1313) ve Tirmizi (581) tarafından kaydedildiğini ve Tirmizi'nin bu hadisin sahih ve doğru olduğunu söylediğini ekliyor. Darakutni, Sahabe'ye (mevkuf) isnat edilen versiyonu tercih ederken, Tahavi ise Peygamber'e isnat edilen versiyonu tercih etmiştir. {cite:muwatta-maruf-1997 s.276} {cite:muwatta-maruf-1997 s.277}"
  id: "Hadits pertama dalam bab tentang pembagian Al-Quran menjadi beberapa bagian. Diriwayatkan oleh Malik dari Dawud ibn al-Husayn, dari al-A'raj, dari 'Abd al-Rahman ibn 'Abd al-Qari, bahwa 'Umar ibn al-Khattab berkata: \"Barang siapa yang melewatkan bagian Al-Qurannya di malam hari dan membacanya antara zenit matahari dan shalat Zuhur, maka seolah-olah dia tidak melewatkannya.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, al-Qa'nabi, dan Qutaybah dalam al-Nasa'i (3/260). Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa ini adalah kesalahan dari Dawud, karena hadits sahih adalah hadits Ibn Shihab, berdasarkan riwayat al-Sa'ib ibn Yazid dan 'Ubayd Allah ibn 'Abd Allah, berdasarkan riwayat 'Abd al-Rahman ibn 'Abd, berdasarkan riwayat 'Umar: \"Barangsiapa tertidur saat membaca bagiannya dan membacanya di antara shalat subuh dan shalat zuhur, maka hafalannya akan dicatat seolah-olah ia membacanya di malam hari.\" Ia menambahkan bahwa Ibn Shihab memiliki hafalan yang lebih akurat. Editor tersebut selanjutnya menambahkan bahwa hadits al-Zuhri, yang dinisbahkan kepada Nabi, diriwayatkan oleh Muslim (2/171), Abu Dawud (1313), dan al-Tirmidhi (581), yang mengatakan bahwa hadits tersebut baik dan sahih. Al-Daraqutni lebih menyukai versi yang dikaitkan dengan Sahabat (mawquf), sedangkan al-Tahawi lebih menyukai versi yang dikaitkan dengan Nabi. {kutip:muwatta-maruf-1997 hal.276} {kutip:muwatta-maruf-1997 hal.277}"
