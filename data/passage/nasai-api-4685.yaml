label: { ar: "سنن النسائي 4685 — الأب والأبوة", en: "Sunan al-Nasa'i 4685 — the father and fatherhood", ur: "سنن نسائی 4685 — باپ اور والدیت", es: "Sunan al-Nasa'i 4685 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4685 — Le père et la paternité" }
text: "أَخْبَرَنَا مَحْمُودُ بْنُ غَيْلاَنَ، قَالَ حَدَّثَنَا عَبْدُ الرَّزَّاقِ، قَالَ حَدَّثَنَا الثَّوْرِيُّ، عَنْ أَبِيهِ، عَنِ الشَّعْبِيِّ، عَنْ سَمْعَانَ، عَنْ سَمُرَةَ، قَالَ كُنَّا مَعَ النَّبِيِّ فِي جَنَازَةٍ فَقَالَ \" أَهَا هُنَا مِنْ بَنِي فُلاَنٍ أَحَدٌ \". ثَلاَثًا فَقَامَ رَجُلٌ فَقَالَ لَهُ النَّبِيُّ \" مَا مَنَعَكَ فِي الْمَرَّتَيْنِ الأُولَيَيْنِ أَنْ لاَ تَكُونَ أَجَبْتَنِي أَمَا إِنِّي لَمْ أُنَوِّهْ بِكَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4685، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4685 (The Book of Financial Transactions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4685، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4685 (El Libro de las Transacciones Financieras), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4685 (Le Livre des transactions financières), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
