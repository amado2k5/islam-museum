text: "إن بلالاً ينادي بليل، فكلوا واشربوا حتى ينادي ابن أم مكتوم"
summary:
  ar: "أول حديث في باب قدر السحور من النداء. يرويه يحيى عن مالك عن عبد الله بن دينار عن عبد الله بن عمر: أخبر النبي أن بلالاً يؤذن بليل قبل الفجر، فأباح الأكل والشرب للصائم حتى يؤذن ابن أم مكتوم. ويخرّجه المحقق عند البخاري (620) والنسائي (2/10) وأحمد (2/64) والبيهقي والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد (17/5). {cite:muwatta-maruf-1997 p.122}"
