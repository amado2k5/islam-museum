label: { ar: "الموطأ 194 — إن بلالاً ينادي بليل فكلوا واشربوا حتى ينادي ابن أم مكتوم", en: "Muwatta 194", es: "Muwatta 194", fr: "Muwatta 194", ur: "موطا 194", tr: "El-Muvatta 194 — Bilal geceleyin seslenir, bu yüzden İbn Ümmü Maktum seslenene kadar yiyip iç", id: "Al-Muwatta 194 — Bilal berseru di malam hari, maka makan dan minumlah sampai Ibnu Umm Maktum berseru." }
text: "إن بلالاً ينادي بليل، فكلوا واشربوا حتى ينادي ابن أم مكتوم"
summary:
  ar: "أول حديث في باب قدر السحور من النداء. يرويه يحيى عن مالك عن عبد الله بن دينار عن عبد الله بن عمر: أخبر النبي أن بلالاً يؤذن بليل قبل الفجر، فأباح الأكل والشرب للصائم حتى يؤذن ابن أم مكتوم. ويخرّجه المحقق عند البخاري (620) والنسائي (2/10) وأحمد (2/64) والبيهقي والطحاوي من طرق أصحاب مالك، ويحيل على التمهيد (17/5). {cite:muwatta-maruf-1997 p.122}"
  tr: "Sahur vaktine ilişkin bölümdeki ilk hadis, ezanla ilgilidir. Yahya, Malik'ten, o da Abdullah ibn Dinar'dan, o da Abdullah ibn Ömer'den rivayet etmiştir: Peygamberimiz bize, Bilal'in geceleyin, şafak sökmeden önce ezan okuyacağını bildirmiştir; bu yüzden oruçlu kişinin İbn Ümmü Maktum ezan okuyana kadar yiyip içmesine izin vermiştir. Araştırmacı, bu hadisi Buhari (620), Nesai (2/10), Ahmed (2/64), Beyhaki ve Tahavi'nin hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiş ve Temhid'e (17/5) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.122}"
  id: "Hadits pertama dalam bab tentang waktu sahur (makan sebelum subuh) adalah dari seruan azan. Diriwayatkan oleh Yahya dari Malik, dari Abdullah ibn Dinar, dari Abdullah ibn Umar: Nabi memberitahukan kepada kami bahwa Bilal mengumandangkan azan di malam hari sebelum subuh, sehingga beliau memperbolehkan orang yang berpuasa untuk makan dan minum sampai Ibnu Umm Maktum mengumandangkan azan. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (620), al-Nasa'i (2/10), Ahmad (2/64), al-Bayhaqi, dan al-Tahawi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (17/5). {cite:muwatta-maruf-1997 p.122}"
