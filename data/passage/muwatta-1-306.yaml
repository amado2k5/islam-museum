label: { ar: "الموطأ 306 — ذكوان مولى عائشة يقوم يقرأ لها في رمضان", en: "Muwatta 306" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه، في باب ما جاء في قيام رمضان: كان ذكوان أبو عمرو، وكان عبداً لعائشة أعتقته عن دبر منها، يقوم فيقرأ لها، أي يؤمها في قيام رمضان. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.172} {cite:muwatta-maruf-1997 p.173}"
