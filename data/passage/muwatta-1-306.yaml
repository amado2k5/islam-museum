label: { ar: "الموطأ 306 — ذكوان مولى عائشة يقوم يقرأ لها في رمضان", en: "Muwatta 306", es: "Muwatta 306", fr: "Muwatta 306", ur: "موطا 306", tr: "Al-Muwatta 306 — Ayşe'nin azatlı kölesi Zekvan, Ramazan ayında ona okurdu", id: "Al-Muwatta 306 — Dhakwan, budak Aisha yang telah dibebaskan, akan membacakan untuknya selama bulan Ramadhan" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه، في باب ما جاء في قيام رمضان: كان ذكوان أبو عمرو، وكان عبداً لعائشة أعتقته عن دبر منها، يقوم فيقرأ لها، أي يؤمها في قيام رمضان. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.172} {cite:muwatta-maruf-1997 p.173}"
  tr: "Ramazan gecesi namazları hakkında rivayet edilenler bölümünde, Malik'in Hişam ibn Urva'dan, onun da babasından rivayet ettiği bir rivayete göre: Aişe'nin kölesi olan ve ölümünden sonra azat ettiği Zekvan Ebu Amr, onun için namaz kılardı; yani Ramazan gecesi namazlarında ona imamlık yapardı. Araştırmacı, bu rivayetin Malik'ten Ebu Musab tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.172} {cite:muwatta-maruf-1997 s.173}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, dalam bab tentang apa yang telah diriwayatkan mengenai salat malam Ramadhan: Dhakwan Abu Amr, yang merupakan budak Aisyah dan yang dibebaskannya setelah kematiannya, akan berdiri dan membacakan Al-Quran untuknya, artinya ia akan memimpinnya dalam salat malam Ramadhan. Peneliti menyebutkan bahwa Abu Musab meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.172} {cite:muwatta-maruf-1997 p.173}"
