text: "… فَقَالَ الَّذِي عِنْدَ رِجْلَىَّ لِلَّذِي عِنْدَ رَأْسِي مَا بَالُ الرَّجُلِ قَالَ مَطْبُوبٌ. يَعْنِي مَسْحُورًا. قَالَ وَمَنْ طَبَّهُ قَالَ لَبِيدُ بْنُ أَعْصَمَ. قَالَ وَفِيمَ قَالَ فِي جُفِّ طَلْعَةٍ ذَكَرٍ فِي مُشْطٍ وَمُشَاقَةٍ، تَحْتَ رَعُوفَةٍ فِي بِئْرِ ذَرْوَانَ \". فَجَاءَ النَّبِيُّ فَقَالَ \" هَذِهِ الْبِئْرُ الَّتِي أُرِيتُهَا كَأَنَّ رُءُوسَ نَخْلِهَا رُءُوسُ الشَّيَاطِينِ، وَكَأَنَّ مَاءَهَا نُقَاعَةُ الْحِنَّاءِ \". …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6063، يذكر الطب والطبيب. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 6063 (Good Manners and Form (Al-Adab)), that mentions medicine and the physician. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 6063، جس میں طب اور طبیب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6063 (Buenas costumbres y modales (Al-Adab)), menciona la medicina y al médico. El buscador de textos sobre medicina lo incluye junto con los textos sobre medicina profética, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 6063 (Les bonnes mœurs et la forme), mentionne la médecine et le médecin. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 6063 numaralı hadis, tıp ve hekimden bahsetmektedir. Bu hadis, Tıp Tarayıcısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6063, menyebutkan tentang pengobatan dan dokter. Hadits ini dikumpulkan oleh Medicine Browser bersama dengan teks-teks tentang pengobatan Nabi, pengobatan, anatomi, pembedahan, dan perawatan."
