text: |-
  ٤٠٥
  وديمومة وقيدودة وأصله كينونة بتشديدالياء فذفوا كماسذفوا من هين وميت ولولاذلك
  لقالوا كونونة تم انه ليس فى الكلام فعاول وأما الحيدودة فأصلدفعلولة بفتح العين فسكنت
  وأواهسم لم يك أصله يكون فلادخلت عليها لم جزمتها فالتق ساكنان غحذفت الواوفبق لم يكن
  فلما سكتر استعمالهاحذفوا النون تخفيفا فاذا تحركت أبتوهافقالوالم يكن الرجل
  وأباز يونس حذفهامع الحركة . وأنشد
  اذا لم تك الحاجات من همة الفتى • فليس بمغن عنك عقد الرتائم
  وتة ول جاونى لا يكون زيد اتعنى الاسقئناه كأنك قلت لا يكون الاتى زيدا وكوّنه فتسكون
  أحدثه فدث واليكياتة السكفالة وكنت على فلان أكون كونا أى تكفلت به واكتنت به
  اكتيانا مثله وتقول كنتك وكنت اياك كما تقول ظننتك زيدا وظئفت زيدا ايال تضع المنفصل
  موضع المتصل فى السكاية عن الاسم واخيرلانهما منفصلان فى الاصل لانهما مبتدأ وخبر
  قال أبوالا- ود الدولى
  دع الهر يشر بها الفواة قانى • رأيت أخاها مجزتالمسكانها
  والايكنها أو تكنمفاته • أخوهاغذته أمه بلبانها
  يعنى الزيب والسكون واحدالا كوان وسمع السكياد كتاب للهجم والاستكانة الخضوع
  والمسكانة المنزلة وفلان مكين عند فلان بين المسكانة والم-كان والمسكانة الموضع قال اللّٰه تعالى
  ولونشاملسخناهم على مكانتهم ولما كثرروم الميم توهمت أصلية فقيل تمكن كما قالوا من
  المسكين تمسكن أبوع رو يقال للرجل اذ اشاخ كنتق كأنه نسب الى قوله كنت فى شيابى
  كذاوكذا قال فأصيحت كنتيا وأصبحت عاجنا * وشرخسال المركنت وعاجن
  والكاه.ان حيان⁦( كين)⁩ السكين لهة داخل فرج المرأة والجمع كيون وهى كالغدد قال
  شمزابن مرة يافرزدق كينها • غمز الطبيب نغانغ المهذور
  وباتّ فلان بكينة سو بالكسر أى جمالة سوء وكاين معنا هاً معنكم فى الظبر والاستفهام
  وفيها لغتان كاين مئال كعىّ وكاثن مثال كاع قال أبى بن كمب لزرّبن -بيس كأين.
  تعدسورة الاحزاب أى كم تعد ونفول فى الخبركاً ين من رجل قدرأ يت تريلبها التكنر
  تخقض النكرة بعدها عن وادحّال من يعد كاين أكثر من النصب بها وأجود قال ذوالرقة
  وكاّن ذعرنا من مهاة ورامح • بلاد العدى ليست له ب.لاد
  صل اللام ن اللبن اسم جفس والجمع الاليان واللبن أيضاوجع فى العنق
  من الوسادة وقد لبن الرجل بالكسرويقال أيضالينت الشاة لبنا أى غزرت وناقة لبنة غزيرة
  أبوزيد اللبون من الشاء والابل ذات اللين غزيرة كانت ام يكيئة وبحعها لين ولين عن يونس
  يقال كم لبن غنمك ولبن غنمك أى ذوات الدرّ منها قال فاذا قصد واقصد الغزيرة قالو البنة وقد
  لبذت لبنا وقال الكسائة انماممع كم لبن غنك أى كم وسل غنمك وابن اللبون ولد الناقة اذا
  استكمل السسنة الذانية ودخل فى الثالثة والانثى ابنة لبون لان أمّه وضعت غيره فصاراها
