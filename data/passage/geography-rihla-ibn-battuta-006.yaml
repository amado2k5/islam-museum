text: "ا شديدا ، ووقف كالراكع يسمع كلامه . وإذا كلم أحدهم السلطان فرد عليه جوابته كشف ثيابته عن ظهره ، ورمى بالتراب على رأسه وظهره ، كما يفعل المغتسل بالماء ، وكنت أعجب منهم كيف لا تعمى أعينهم . وإذا"
