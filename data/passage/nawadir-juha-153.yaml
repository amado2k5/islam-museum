text: "… المِلْقَطُ بثلاثة آلاف ذهب يوماً إلى السوق فرأى بيد الدلال سيفاً، ينادي عليه، بثلاثة آلاف قرش فأخذه بيده وتأمله فلم يجده يساوي هذه القيمة فسأل من هناك عن ذلك فقالوا له : متى أراد الإنسانُ أن يضرِب بهذا السيف عدوَّه …"
summary:
  ar: "عرض دلّال في السوق على جحا سيفًا بثلاثة آلاف قرش، فقال إنه لا يساوي ذلك؛ وفي اليوم التالي باع ملقطًا بالسعر نفسه، وقال إن زوجته ترميه عند الغضب فيطير عشرة أذرع. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  en: "At the market a broker offers Juha a sword for three thousand piastres; Juha says it is not worth it; the next day he sells a pair of tongs at the same price, saying his wife throws them when angry and they fly ten cubits. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  ur: "بازار میں ایک دلال نے جحا کو تین ہزار قرش کی تلوار پیش کی؛ جحا نے کہا کہ یہ اتنی قیمت کی نہیں؛ اگلے دن اس نے اسی قیمت پر ایک چمٹا بیچا، یہ کہہ کر کہ میری بیوی غصے میں اسے پھینکتی ہے تو وہ دس ہاتھ دور تک اڑتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  fr: "Au marché, un courtier propose une épée à Juha pour trois mille piastres; Juha dit qu'elle ne les vaut pas; le lendemain, il vend une paire de pincettes au même prix, disant que sa femme les lance quand elle est en colère et qu'elles volent sur dix coudées. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  es: "En el mercado, un corredor le ofrece a Juha una espada por tres mil piastras; Juha dice que no las vale; al día siguiente vende unas tenazas por el mismo precio, diciendo que su mujer las lanza cuando se enfada y vuelan diez codos. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
  tr: "Pazarda bir aracı, Juha'ya üç bin piaster karşılığında bir kılıç teklif etti, ancak Juha bunun o kadar etmediğini söyledi. Ertesi gün, aynı fiyata bir çift maşa sattı ve karısı kızdığında maşayı fırlattığını ve on arşın uzağa uçtuğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 72}"
  id: "Seorang makelar di pasar menawarkan Juha sebuah pedang seharga tiga ribu piaster, tetapi Juha mengatakan pedang itu tidak bernilai sebanyak itu. Keesokan harinya, ia menjual sepasang penjepit dengan harga yang sama, sambil mengatakan bahwa ketika istrinya marah, ia melemparkan penjepit itu dan penjepit itu terbang sejauh sepuluh hasta. {cite:juha-nawadir-kubra-djuwaydi p. 72}"
