label: { ar: "سنن أبي داود 2390 — ضحك وتبسم", en: "Sunan Abi Dawud 2390 — laughter and smiling", ur: "سنن ابی داؤد 2390 — ہنسی اور تبسم", fr: "Sunan Abi Dawud 2390 — rire et sourire", es: "Sunan Abi Dawud 2390 — risa y sonrisa", tr: "Sünen Ebu Davud 2390 — Kahkaha ve Gülümseme", id: "Sunan Abi Dawud 2390 — Tertawa dan Tersenyum" }
text: "… تَصُومَ شَهْرَيْنِ مُتَتَابِعَيْنِ . قَالَ لاَ. قَالَ فَهَلْ تَسْتَطِيعُ أَنْ تُطْعِمَ سِتِّينَ مِسْكِينًا . قَالَ لاَ. قَالَ اجْلِسْ . فَأُتِيَ النَّبِيُّ بِعَرَقٍ فِيهِ تَمْرٌ فَقَالَ تَصَدَّقْ بِهِ . فَقَالَ يَا رَسُولَ اللَّهِ مَا بَيْنَ لاَبَتَيْهَا أَهْلُ بَيْتٍ أَفْقَرَ مِنَّا فَضَحِكَ رَسُولُ اللَّهِ حَتَّى بَدَتْ ثَنَايَاهُ قَالَ فَأَطْعِمْهُ إِيَّاهُمْ . وَقَالَ مُسَدَّدٌ فِي مَوْضِعٍ آخَرَ أَنْيَابُهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2390، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Abi Dawud, no. 2390, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابی داؤد کی حدیث نمبر 2390، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Abi Dawud, n° 2390, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Abi Dawud, n.º 2390, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sünen Ebu Davud'da yer alan 2390 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2390, berisi tentang tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan Peramban Cerita Rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
