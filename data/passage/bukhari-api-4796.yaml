label: { ar: "صحيح البخاري 4796 — ما حُرّم", en: "Sahih al-Bukhari 4796 — what was made unlawful", ur: "صحیح بخاری 4796 — جو حرام کیا گیا", es: "Sahih al-Bukhari 4796 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 4796 — ce qui a été déclaré illicite" }
text: "… أَفْلَحَ أَخَا أَبِي الْقُعَيْسِ اسْتَأْذَنَ، فَأَبَيْتُ أَنْ آذَنَ حَتَّى أَسْتَأْذِنَكَ فَقَالَ النَّبِيُّ \" وَمَا مَنَعَكِ أَنْ تَأْذَنِي عَمُّكِ \". قُلْتُ يَا رَسُولَ اللَّهِ إِنَّ الرَّجُلَ لَيْسَ هُوَ أَرْضَعَنِي، وَلَكِنْ أَرْضَعَتْنِي امْرَأَةُ أَبِي الْقُعَيْسِ. فَقَالَ \" ائْذَنِي لَهُ فَإِنَّهُ عَمُّكِ، تَرِبَتْ يَمِينُكِ \". قَالَ عُرْوَةُ فَلِذَلِكَ كَانَتْ عَائِشَةُ تَقُولُ حَرِّمُوا مِنَ الرَّضَاعَةِ مَا تُحَرِّمُونَ مِنَ النَّسَبِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4796، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4796 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4796، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4796 (Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 4796 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
