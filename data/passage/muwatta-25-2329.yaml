summary:
  ar: "قال مالك: الإخوة في الكتابة بمنزلة الولد، إذا كوتبوا جميعا كتابة واحدة، ولم يكن لأحد منهم ولد كوتب عليهم أو ولد في كتابته؛ فإن الإخوة يتوارثون. فإن كان لأحدهم ولد ولد في كتابته أو كوتب عليهم، ثم هلك أحدهم وترك مالا، أدي عنهم جميع ما عليهم من الكتابة وعتقوا، وكان فضل المال بعد ذلك لولده دون إخوته. {cite:muwatta-maruf-1997 p.359} {cite:muwatta-maruf-1997 p.360}"
