label: { ar: "الموطأ 2329 — مالك: الإخوة في الكتابة يتوارثون ما لم يكن لأحدهم ولد", en: "Muwatta 2329", es: "Muwatta 2329", fr: "Muwatta 2329", ur: "موطا 2329", tr: "Al-Muwatta 2329 — Malik: Yazılı bir sözleşme ile kardeşler birbirlerinden miras alırlar, ancak birinin çocuğu olması durumunda bu durum değişir.", id: "Al-Muwatta 2329 — Malik: Saudara-saudara dalam perjanjian tertulis saling mewarisi harta satu sama lain kecuali jika salah satu dari mereka mempunyai anak." }
summary:
  ar: "قال مالك: الإخوة في الكتابة بمنزلة الولد، إذا كوتبوا جميعا كتابة واحدة، ولم يكن لأحد منهم ولد كوتب عليهم أو ولد في كتابته؛ فإن الإخوة يتوارثون. فإن كان لأحدهم ولد ولد في كتابته أو كوتب عليهم، ثم هلك أحدهم وترك مالا، أدي عنهم جميع ما عليهم من الكتابة وعتقوا، وكان فضل المال بعد ذلك لولده دون إخوته. {cite:muwatta-maruf-1997 p.359} {cite:muwatta-maruf-1997 p.360}"
  tr: "Malik şöyle dedi: Kölelikten kurtulma sözleşmesinde kardeşler oğul gibi sayılır. Eğer hepsi tek bir kölelikten kurtulma sözleşmesi imzalarsa ve içlerinden hiçbirinin sözleşmede oğul olan veya oğlu sözleşmede oğul olan bir oğlu yoksa, kardeşler birbirlerinden miras alırlar. Ancak, eğer içlerinden birinin sözleşmede oğul olan veya oğlu sözleşmede oğul olan bir oğlu varsa ve sonra içlerinden biri malvarlığı bırakarak ölürse, sözleşmenin tüm borçları onun adına ödenir ve özgür bırakılırlar. Bundan sonra kalan malvarlığı kardeşlerine değil, oğluna geçer. {cite:muwatta-maruf-1997 s.359} {cite:muwatta-maruf-1997 s.360}"
  id: "Malik berkata: Saudara-saudara dalam perjanjian pembebasan dianggap seperti anak. Jika mereka semua membuat satu perjanjian pembebasan, dan tidak ada di antara mereka yang memiliki anak yang juga merupakan anak dalam perjanjian tersebut atau yang anaknya merupakan anak dalam perjanjian tersebut, maka saudara-saudara tersebut saling mewarisi. Namun, jika salah satu dari mereka memiliki anak yang merupakan anak dalam perjanjian tersebut atau yang anaknya merupakan anak dalam perjanjian tersebut, dan kemudian salah satu dari mereka meninggal dunia meninggalkan harta benda, maka semua hutang yang belum dibayar dari perjanjian tersebut dibayarkan atas nama mereka, dan mereka dibebaskan. Harta benda yang tersisa setelah itu diberikan kepada anaknya, bukan kepada saudara-saudaranya. {cite:muwatta-maruf-1997 p.359} {cite:muwatta-maruf-1997 p.360}"
