label: { ar: "سنن ابن ماجه 1950 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Ibn Majah 1950 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابن ماجہ 1950 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ السَّلاَمِ بْنُ حَرْبٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي فَرْوَةَ، عَنْ أَبِي وَهْبٍ الْجَيْشَانِيِّ، عَنْ أَبِي خِرَاشٍ الرُّعَيْنِيِّ، عَنِ الدَّيْلَمِيِّ، قَالَ قَدِمْتُ عَلَى رَسُولِ اللَّهِ ـ وَعِنْدِي أُخْتَانِ تَزَوَّجْتُهُمَا فِي الْجَاهِلِيَّةِ. فَقَالَ \" إِذَا رَجَعْتَ فَطَلِّقْ إِحْدَاهُمَا \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1950، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1950 (The Chapters on Marriage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1950، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
