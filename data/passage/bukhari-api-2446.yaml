label: { ar: "صحيح البخاري 2446 — مَثَل المؤمن", en: "Sahih al-Bukhari 2446 — the likeness of the believer", ur: "صحیح بخاری 2446 — مومن کی مثال", es: "Sahih al-Bukhari 2446 — La semejanza del creyente", fr: "Sahih al-Bukhari 2446 — L'image du croyant", tr: "Sahih el-Buhari 2446 — Müminin örneği", id: "Sahih al-Bukhari 2446 — Perumpamaan orang beriman" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى ـ عَنِ النَّبِيِّ قَالَ \" الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا \". وَشَبَّكَ بَيْنَ أَصَابِعِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2446، يذكر مَثَل المؤمن. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 2446 (Oppressions), that mentions the likeness of the believer. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 2446، جس میں مومن کی مثال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 2446 (Opresiones), menciona la semejanza del creyente. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 2446 (Oppressions), évoque les qualités du croyant. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux caractéristiques du croyant."
  tr: "Sahih el-Buhari'de 2446 numaralı hadis, müminin meselini anlatır. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2446, menyebutkan perumpamaan tentang orang beriman. Hadits ini disusun oleh seorang peneliti yang mengkaji rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
