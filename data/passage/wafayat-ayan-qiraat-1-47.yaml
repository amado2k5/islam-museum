text: "… بابن الأنباري - المقدم ذكره - وتلك الطبقة بالعراق وبلاد الجزيرة، فلما وصل إلى الموصل بلغه خبر وفاته، وقد ذكرت تاريخ موته في ترجمته، فأقام بالموصل مديدة وسمع الحديث بها، ثم رجع إلى حلب. ولما عزم على التصدر للاقراء سافر …"
