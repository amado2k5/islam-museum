text: "… ضرب للمفعول نعم الأولى ذكر الفعل لما ذكر، سقط من المطبوع. في م: زيادة. قرأ عاصم في رواية أبي بكر، وابن عامر يُسَبَّحُ بفتح الباء وقرأ الباقون : يُسَبِّحُ بكسر الباء، وكذلك حفص عن عاصم أيضًا. الحجة والسبعة ص."
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 951، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 951, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
