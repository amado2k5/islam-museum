label: { ar: "الموطأ 2308 — مالك: القطاعة بالذهب ليست كالدين المؤجل", en: "Muwatta 2308" }
summary:
  ar: "قال مالك: الأمر عندنا في الرجل يكاتب عبده ثم يقاطعه بالذهب، فيضع عنه مما عليه من الكتابة على أن يعجل له ما قاطعه عليه، أنه لا بأس بذلك. فإن القطاعة ليست بمنزلة دين مؤجل يوضع عنه ويُنقد، بل هي مال يعطيه المكاتب سيده ليتعجل به العتق، فيجب له به الميراث والشهادة والحدود، وتثبت له حرمة العتاقة. {cite:muwatta-maruf-1997 p.352}"
