label: { ar: "الموطأ 2308 — مالك: القطاعة بالذهب ليست كالدين المؤجل", en: "Muwatta 2308", es: "Muwatta 2308", fr: "Muwatta 2308", ur: "موطا 2308", tr: "Al-Muwatta 2308 — Malik: Altın satış sözleşmesi, ertelenmiş bir borç gibi değildir.", id: "Al-Muwatta 2308 — Malik: Kontrak jual beli emas tidak sama dengan utang yang ditangguhkan" }
summary:
  ar: "قال مالك: الأمر عندنا في الرجل يكاتب عبده ثم يقاطعه بالذهب، فيضع عنه مما عليه من الكتابة على أن يعجل له ما قاطعه عليه، أنه لا بأس بذلك. فإن القطاعة ليست بمنزلة دين مؤجل يوضع عنه ويُنقد، بل هي مال يعطيه المكاتب سيده ليتعجل به العتق، فيجب له به الميراث والشهادة والحدود، وتثبت له حرمة العتاقة. {cite:muwatta-maruf-1997 p.352}"
  tr: "Malik şöyle dedi: Bizim görüşümüze göre, bir adam kölesiyle azat etme sözleşmesi yapıp, ardından borcunu altınla ödemeyi kabul ederse ve bu anlaşmanın şartı, kararlaştırılan miktarı hemen ödemekse, bunda bir sakınca yoktur. Bu anlaşma, affedilen ve daha sonra tamamen ödenen ertelenmiş bir borç gibi değildir. Aksine, kölenin azatını hızlandırmak için efendisine verdiği paradır. Bu nedenle, miras, tanıklık ve yasal cezalara hakkı vardır ve azat etmenin kutsallığı onun için tesis edilmiştir. {cite:muwatta-maruf-1997 s.352}"
  id: "Malik berkata: Menurut pandangan kami, jika seseorang membuat perjanjian pembebasan dengan budaknya dan kemudian setuju untuk membayarnya dengan emas, sehingga mengurangi jumlah hutang dengan syarat budak tersebut segera membayar jumlah yang disepakati, tidak ada yang salah dengan itu. Perjanjian ini bukanlah seperti hutang yang ditangguhkan yang kemudian dihapuskan dan dibayar lunas. Sebaliknya, itu adalah uang yang diberikan budak kepada tuannya untuk mempercepat pembebasannya. Oleh karena itu, ia berhak atas warisan, kesaksian, dan hukuman hukum, dan kesucian pembebasan ditegakkan untuknya. {cite:muwatta-maruf-1997 p.352}"
