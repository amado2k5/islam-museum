text: "… والنبيين وكذا في رواية النسائي عن أبي ذر وعن أبي هريرة قوله : وتؤمن بالبعث زاد البخاري في التفسير وبالبعث الأخر وفي رواية مسلم في حديث عمر واليوم الأخر وزاد الاسماعيلي في مستخرجه هنا وتؤمن بالقدر وهي رواية أبي فروة …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3199، يذكر الإيمان بالقدر، والإيمان بالبعث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 3199, that mentions belief in the decree, belief in the resurrection; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 3199 کا اقتباس جس میں تقدیر پر ایمان، دوبارہ اٹھائے جانے پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 3199, que menciona la creencia en el decreto y en la resurrección; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Dala'il al-Nubuwwa d'al-Bayhaqi (tome 1, p. 3199), mentionnant la croyance au décret et la croyance en la résurrection; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Beyhaki'nin \"Peygamberliğin Delilleri\" adlı eserinin 1. cildinin 3199. sayfasından bir alıntı, kader inancına ve dirilişe olan inanca değinmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlandırılmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi, \"Bukti Kenabian,\" Jilid 1, halaman 3199, menyebutkan kepercayaan pada takdir dan kepercayaan pada kebangkitan. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
