text: "… والنبيين وكذا في رواية النسائي عن أبي ذر وعن أبي هريرة قوله : وتؤمن بالبعث زاد البخاري في التفسير وبالبعث الأخر وفي رواية مسلم في حديث عمر واليوم الأخر وزاد الاسماعيلي في مستخرجه هنا وتؤمن بالقدر وهي رواية أبي فروة …"
summary:
