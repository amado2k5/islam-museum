summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله قال: تُفتح أبواب الجنة يوم الاثنين ويوم الخميس، فيُغفر لكل عبد مسلم لا يشرك بالله شيئا، إلا رجلا كانت بينه وبين أخيه شحناء، فيُقال: أنظروا هذين حتى يصطلحا. {cite:muwatta-maruf-1997 p.495}"
