label: { ar: "الموطأ 2642 — سهيل عن أبيه عن أبي هريرة: تُفتح أبواب الجنة يوم الاثنين والخميس إلا لمن بينه وبين أخيه شحناء", en: "Muwatta 2642", es: "Muwatta 2642", fr: "Muwatta 2642", ur: "موطا 2642", tr: "El-Muvatta 2642 — Suhayl, babasından, o da Ebu Hurayra'dan rivayetle: Cennetin kapıları Pazartesi ve Perşembe günleri açılır, ancak kardeşleri arasında düşmanlık bulunanlar müstesna.", id: "Al-Muwatta 2642 — Suhayl, dari ayahnya, dari Abu Hurayrah: Pintu-pintu surga dibuka pada hari Senin dan Kamis, kecuali bagi mereka yang bermusuhan dengan saudara mereka." }
summary:
  ar: "يروي مالك عن سهيل بن أبي صالح عن أبيه عن أبي هريرة أن رسول الله قال: تُفتح أبواب الجنة يوم الاثنين ويوم الخميس، فيُغفر لكل عبد مسلم لا يشرك بالله شيئا، إلا رجلا كانت بينه وبين أخيه شحناء، فيُقال: أنظروا هذين حتى يصطلحا. {cite:muwatta-maruf-1997 p.495}"
  tr: "Malik, Suhayl ibn Abi Salih'ten, o da babasından, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: “Cennetin kapıları Pazartesi ve Perşembe günleri açılır ve Allah'a hiçbir şeyi ortak koşmayan her Müslüman kul affedilir; ancak kardeşiyle arasında düşmanlık olan kimse müstesna. Denilir ki: 'Bu ikisini barışıncaya kadar bırakın.'” {cite:muwatta-maruf-1997 s.495}"
  id: "Malik meriwayatkan dari Suhayl ibn Abi Salih, dari ayahnya, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: “Pintu-pintu surga dibuka pada hari Senin dan Kamis, dan setiap hamba Muslim yang tidak menyekutukan Allah akan diampuni, kecuali seorang laki-laki yang bersekutu dengan saudaranya. Dikatakan: ‘Biarkanlah kedua orang ini sampai mereka berdamai.’” {cite:muwatta-maruf-1997 p.495}"
