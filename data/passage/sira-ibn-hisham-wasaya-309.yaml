text: "… شُدَّ يَدَيْكَ بِهِ، فإنَّ أُمَّهُ ذَاتُ مَتَاع؛ لعلها تَفْدِيه منك، قال: وكنت في رَهْطٍ من الأنصار - حين أقبلوا بي من بَدْرٍ - فكانوا إذا قَدَّموا غَداءَهُمْ أَوْ عَشَاءَهُمْ خَصُّونِي بالخبز وأكلوا التمر ؛ لوصيّة رسول اللّٰه لي إياهم بنا، …"
