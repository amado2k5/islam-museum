summary:
  ar: "القسم 3 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «أبواب الوتر»، ويضم فيها النصوص من 452 إلى 487 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 3 of Jami' al-Tirmidhi (The Book on Al-Witr) in the division of the open hadith dataset the museum took its reports from: reports 452 to 487 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 3، عنوان «ابواب الوتر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 452 تا 487۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 3 de Jami' al-Tirmidhi (El libro sobre Al-Witr) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 452 a 487 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 3 de Jami' al-Tirmidhi (Le Livre d'Al-Witr), qui comprend les hadiths 452 à 487 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
