label: { ar: "سنن ابن ماجه 3218 — ما أُحل", en: "Sunan Ibn Majah 3218 — what was made lawful", ur: "سنن ابن ماجہ 3218 — جو حلال کیا گیا", es: "Sunan Ibn Majah 3218: lo que se hizo lícito", fr: "Sunan Ibn Majah 3218 — ce qui a été rendu licite", tr: "Sünen İbni Mace 3218 — İzin verilenler", id: "Sunan Ibnu Majah 3218 — Apa yang dibolehkan" }
text: "حَدَّثَنَا أَبُو مُصْعَبٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ ـ قَالَ \" أُحِلَّتْ لَنَا مَيْتَتَانِ الْحُوتُ وَالْجَرَادُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3218، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 3218 (Chapters on Hunting), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3218، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3218 (Capítulos sobre la caza), menciona lo que se considera lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 3218 (Chapitres sur la chasse), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde 3218 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, helal ve haram konusunda Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri bir araya getiren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 3218, menyebutkan apa yang diperbolehkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang menggabungkan ayat-ayat dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
