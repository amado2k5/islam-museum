text: "كاء اخوني وغيرهم فقال أنماعليك نفسك اعطناحقك وبرئت فاشهدله وكتب عليه كتاب شراء ن على سبعة عشر الف دينار تم تبع اخوته قفتنهم كثرة المال فباءوه فصارت لابي جمفر ولمن اقطعها ثم صيرها المهدى للخيز د.إن ام موسى وهارون فبنتها"
