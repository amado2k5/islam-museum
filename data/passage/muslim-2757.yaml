label:
  ar: "مسلم 2757 — الرجل الذي أوصى بنيه أن يحرقوه خشية من الله"
  en: "Muslim 2757 — The man who told his sons to burn his body for fear of God"
  ur: "مسلم 2757 — وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی"
text: "أن رجلا فيمن كان قبلكم راشه الله مالا وولدا فقال لولده لتفعلن ما آمركم به أو لأولين ميراثي غيركم إذا أنا مت فأحرقوني - وأكثر علمي أنه قال - ثم اسحقوني واذروني في الريح فإني لم أبتهر عند الله خيرا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2757: الرجل الذي أوصى بنيه أن يحرقوه خشية من الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2757: The man who told his sons to burn his body for fear of God. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2757: وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
