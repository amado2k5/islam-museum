label:
  ar: "مسلم 2757 — الرجل الذي أوصى بنيه أن يحرقوه خشية من الله"
  en: "Muslim 2757 — The man who told his sons to burn his body for fear of God"
  ur: "مسلم 2757 — وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی"
  es: "Muslim 2757 — El hombre que les dijo a sus hijos que quemaran su cuerpo por temor a Dios."
  fr: "Muslim 2757 — L'homme qui a dit à ses fils de brûler son corps par crainte de Dieu"
  tr: "Müslim 2757 — Allah korkusuyla oğullarına kendisini yakmalarını emreden adam"
  id: "Muslim 2757 — Orang yang memerintahkan anak-anaknya untuk membakarnya karena takut kepada Allah"
text: "أن رجلا فيمن كان قبلكم راشه الله مالا وولدا فقال لولده لتفعلن ما آمركم به أو لأولين ميراثي غيركم إذا أنا مت فأحرقوني - وأكثر علمي أنه قال - ثم اسحقوني واذروني في الريح فإني لم أبتهر عند الله خيرا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2757: الرجل الذي أوصى بنيه أن يحرقوه خشية من الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2757: The man who told his sons to burn his body for fear of God. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2757: وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2757: El hombre que les dijo a sus hijos que quemaran su cuerpo por temor a Dios. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim n° 2757: L’homme qui, par crainte de Dieu, ordonna à ses fils de brûler son corps. Le Prophète rapporte ce hadith de son Seigneur; le navigateur de hadiths qudsi rassemble les narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2757: Seorang pria yang memerintahkan anak-anaknya untuk membakarnya karena takut kepada Allah. Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
