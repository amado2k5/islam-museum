label: { ar: "صحيح البخاري 3998 — الأب والأبوة", en: "Sahih al-Bukhari 3998 — the father and fatherhood", ur: "صحیح بخاری 3998 — باپ اور والدیت", es: "Sahih al-Bukhari 3998 — El padre y la paternidad" }
text: "حَدَّثَنِي عُبَيْدُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، قَالَ قَالَ الزُّبَيْرُ لَقِيتُ يَوْمَ بَدْرٍ عُبَيْدَةَ بْنَ سَعِيدِ بْنِ الْعَاصِ وَهْوَ مُدَجَّجٌ لاَ يُرَى مِنْهُ إِلاَّ عَيْنَاهُ، وَهْوَ يُكْنَى أَبُو ذَاتِ الْكَرِشِ، فَقَالَ أَنَا أَبُو ذَاتِ الْكَرِشِ. فَحَمَلْتُ عَلَيْهِ بِالْعَنَزَةِ، فَطَعَنْتُهُ فِي عَيْنِهِ فَمَاتَ. قَالَ هِشَامٌ فَأُخْبِرْتُ أَنَّ الزُّبَيْرَ قَالَ لَقَدْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3998، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3998 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3998، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3998 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
