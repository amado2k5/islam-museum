ref: "2000"
label: { ar: "صحيح البخاري 2000 — الأب والأبوة", en: "Sahih al-Bukhari 2000 — the father and fatherhood", ur: "صحیح بخاری 2000 — باپ اور والدیت", es: "Sahih al-Bukhari 2000 — El padre y la paternidad", fr: "Sahih al-Bukhari 2000 — le père et la paternité", tr: "Sahih el-Buhari 2000 — Baba ve Babalık", id: "Sahih al-Bukhari 2000 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَبُو عَاصِمٍ، عَنْ عُمَرَ بْنِ مُحَمَّدٍ، عَنْ سَالِمٍ، عَنْ أَبِيهِ ـ قَالَ قَالَ النَّبِيُّ يَوْمَ عَاشُورَاءَ \" إِنْ شَاءَ صَامَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2000، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2000 (Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2000، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 2000 (El ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2000 (Le jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'nin 2000 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2000, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
