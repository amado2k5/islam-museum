text: "… النجاد. وتوفي يوم الثلاثاء لسبع بقين من ذي الحجة، وقيل: في آخر يوم من ذي الحجة، سنة سبع وتسعين وثلاث مائة، وقيل: توفي ليلاً، وكانت وفاته بدرب شماس من نهر الغلابين، وقبره اليوم ظاهر يُتَبرَّك به بمقبرة الإمام أحمد. - …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 495، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 495, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 495 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
