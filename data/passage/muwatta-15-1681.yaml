label: { ar: "الموطأ 1681 — مالك: أدرك الناس ينكرون ما قاله بعض الناس على عمر بن الخطاب أن زوجها الأول يخير إذا جاء في صداقها أو في امرأته", en: "Muwatta 1681", es: "Muwatta 1681", fr: "Muwatta 1681", ur: "موطا 1681", tr: "El-Muvatta 1681 — Malik: Bazı kişilerin Ömer ibn el-Hattab hakkında söylediklerini, yani ilk kocasının mehiri konusunda mı yoksa karısı konusunda mı geleceğine karar verme hakkına sahip olduğunu inkar ettiklerini fark etti.", id: "Al-Muwatta 1681 — Malik: Dia menyadari bahwa orang-orang mengingkari apa yang dikatakan sebagian orang tentang Umar ibn al-Khattab, bahwa suami pertamanya memiliki pilihan apakah dia datang untuk mas kawinnya atau untuk istrinya." }
summary:
  ar: "يقول مالك وأدركت الناس ينكرون الذي قال بعض الناس على عمر بن الخطاب، أنه قال يخير زوجها الأول إذا جاء في صداقها أو في امرأته. {cite:muwatta-maruf-1997 p.88}"
  tr: "Malik şöyle diyor: \"İnsanların, Ömer ibn el-Hattab hakkında söylenenleri, yani onun, ilk kocasının mehir veya karısı konusunda seçim yapma hakkının verilmesi gerektiğini söylediği iddiasını reddettiklerini fark ettim.\" {cite:muwatta-maruf-1997 s.88}"
  id: "Malik berkata, \"Saya menyadari bahwa orang-orang menyangkal apa yang dikatakan sebagian orang tentang Umar ibn al-Khattab, bahwa dia mengatakan bahwa suami pertamanya harus diberi pilihan apakah dia datang untuk urusan mahar atau istrinya.\" {cite:muwatta-maruf-1997 p.88}"
