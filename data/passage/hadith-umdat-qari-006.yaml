text: "اعة؛ وقد تعرف بأنها عقد الإمام العهد بما يأمر الناس به، وفي باب وفود الأنصار: تعالوا بايعوني. قوله: ((لا تشركوا بالله شيئا) أي: وحدوه سبحانه وتعالى، وهذا هو أصل الإيمان وأساس الإسلام، فلذلك قدمه على أخوته. قوله: (شيئا)) عام لأنه"
