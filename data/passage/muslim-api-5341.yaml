label: { ar: "صحيح مسلم 5341 — تمر العجوة، السم والترياق", en: "Sahih Muslim 5341 — 'ajwa dates; poison and antidote", ur: "صحیح مسلم 5341 — عجوہ کھجور، زہر اور تریاق", es: "Sahih Muslim 5341 - fechas 'ajwa; veneno y antídoto", fr: "Sahih Muslim 5341 — dates 'ajwa; poison et antidote", tr: "Sahih Muslim 5341 - Ajwa hurmaları, zehir ve panzehir", id: "Sahih Muslim 5341 — Kurma ajwa, racun dan penawarnya" }
text: "وَحَدَّثَنَا يَحْيَى بْنُ يَحْيَى، وَيَحْيَى بْنُ أَيُّوبَ، وَابْنُ، حُجْرٍ قَالَ يَحْيَى بْنُ يَحْيَى أَخْبَرَنَا وَقَالَ الآخَرَانِ، حَدَّثَنَا إِسْمَاعِيلُ، - وَهُوَ ابْنُ جَعْفَرٍ - عَنْ شَرِيكٍ، - وَهُوَ ابْنُ أَبِي نَمِرٍ - عَنْ عَبْدِ اللَّهِ بْنِ أَبِي عَتِيقٍ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِنَّ فِي عَجْوَةِ الْعَالِيَةِ شِفَاءً أَوْ إِنَّهَا تِرْيَاقٌ أَوَّلَ الْبُكْرَةِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5341، يذكر تمر العجوة، والسم والترياق، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5341 (The Book of Drinks), that mentions 'ajwa dates, poison and antidote, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5341، جس میں عجوہ کھجور، زہر اور تریاق، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 5341 (El Libro de las Bebidas), menciona los dátiles 'ajwa, su veneno y antídoto, y sus propiedades curativas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5341 (Le Livre des Boissons), mentionne les dattes ajwa, poison et antidote, ainsi que leurs propriétés curatives. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5341 numaralı hadiste, ecva hurmasının zehir ve panzehir özelliğinden ve şifa verici özelliğinden bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5341, menyebutkan kurma Ajwa, racun dan penawarnya, serta penyembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
