label: { ar: "سنن أبي داود 3806 — ما لا يحل، الحرام", en: "Sunan Abi Dawud 3806 — what is not lawful; the unlawful", ur: "سنن ابی داؤد 3806 — جو حلال نہیں، حرام", es: "Sunan Abi Dawud 3806 — lo que no es lícito; lo ilícito", fr: "Sunan Abi Dawud 3806 — ce qui n'est pas licite; l'illicite", tr: "Sunan Abi Davud 3806 — İzin verilmeyen, haram olan şeyler", id: "Sunan Abi Dawud 3806 — Apa yang tidak diperbolehkan, yang dilarang" }
text: "… يَحْيَى بْنِ الْمِقْدَامِ، عَنْ جَدِّهِ الْمِقْدَامِ بْنِ مَعْدِيكَرِبَ، عَنْ خَالِدِ بْنِ الْوَلِيدِ، قَالَ غَزَوْتُ مَعَ رَسُولِ اللَّهِ خَيْبَرَ فَأَتَتِ الْيَهُودُ فَشَكَوْا أَنَّ النَّاسَ قَدْ أَسْرَعُوا إِلَى حَظَائِرِهِمْ فَقَالَ رَسُولُ اللَّهِ \" أَلاَ لاَ تَحِلُّ أَمْوَالُ الْمُعَاهِدِينَ إِلاَّ بِحَقِّهَا وَحَرَامٌ عَلَيْكُمْ حُمُرُ الأَهْلِيَّةِ وَخَيْلُهَا وَبِغَالُهَا وَكُلُّ ذِي نَابٍ مِنَ السِّبَاعِ وَكُلُّ ذِي مِخْلَبٍ مِنَ الطَّيْرِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3806، يذكر ما لا يحل، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3806 (Foods (Kitab Al-At'imah)), that mentions what is not lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3806، جس میں جو حلال نہیں، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3806 (Alimentos (Kitab Al-At'imah)), menciona lo que es lícito e ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3806 (Les aliments), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Sünen Ebu Davud'da yer alan 3806 numaralı hadis, haram ve haram olan şeylerden bahsetmektedir. Helal ve Haram sözlüğünün bu bölümü, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3806, menyebutkan apa yang diperbolehkan dan yang diharamkan. Bagian kamus Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan yang diharamkan."
