label: { ar: "الموطأ 1811 — مالك عن أبي الزناد عن خارجة بن زيد عن زيد بن ثابت: كان لا يبيع ثماره حتى تطلع الثريا", en: "Muwatta 1811", es: "Muwatta 1811", fr: "Muwatta 1811", ur: "موطا 1811", tr: "El-Muvatta 1811 — Malik, Ebu el-Zinad'dan, o da Harice ibn Zeyd'dan, o da Zeyd ibn Sabit'ten rivayetle: Ülker takımyıldızı yükselene kadar meyvelerini satmazdı.", id: "Al-Muwatta 1811 — Malik, berdasarkan riwayat Abu al-Zinad, berdasarkan riwayat Kharijah ibn Zayd, berdasarkan riwayat Zayd ibn Thabit: Dia tidak akan menjual buah-buahannya sampai Pleiades terbit." }
summary:
  ar: "يروي مالك عن أبي الزناد عن خارجة بن زيد بن ثابت عن زيد بن ثابت أنه كان لا يبيع ثماره حتى تطلع الثريا. {cite:muwatta-maruf-1997 p.141}"
  tr: "Malik, Ebu el-Zinad'dan, o da Harici ibn Zeyd ibn Sabit'ten, o da Zeyd ibn Sabit'ten rivayet ederek, Pleiades yükselene kadar meyvelerini satmayacağını nakletmiştir. {cite:muwatta-maruf-1997 s.141}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari Kharijah ibn Zayd ibn Thabit, dari Zayd ibn Thabit, bahwa ia tidak akan menjual buah-buahannya sampai gugusan bintang Pleiades terbit. {cite:muwatta-maruf-1997 p.141}"
