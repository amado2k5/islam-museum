label: { ar: "الموطأ 2174 — مالك عن عمرو بن يحيى المازني عن أبيه: كان في حائط جده ربيع لعبد الرحمن بن عوف، فأراد أن يحوله إلى ناحية هي أقرب إلى أرضه، فمنعه صاحب الحائط، فقضى عمر لعبد الرحمن بتحويله", en: "Muwatta 2174" }
summary:
  ar: "يروي مالك عن عمرو بن يحيى المازني عن أبيه أنه قال: كان في حائط جده ربيع لعبد الرحمن بن عوف، فأراد عبد الرحمن أن يحوله إلى ناحية من الحائط، هي أقرب إلى أرضه، فمنعه صاحب الحائط. فكلم عبد الرحمن بن عوف عمر بن الخطاب في ذلك، فقضى لعبد الرحمن بتحويله. {cite:muwatta-maruf-1997 p.291}"
