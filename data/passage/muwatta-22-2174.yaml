label: { ar: "الموطأ 2174 — مالك عن عمرو بن يحيى المازني عن أبيه: كان في حائط جده ربيع لعبد الرحمن بن عوف، فأراد أن يحوله إلى ناحية هي أقرب إلى أرضه، فمنعه صاحب الحائط، فقضى عمر لعبد الرحمن بتحويله", en: "Muwatta 2174", es: "Muwatta 2174", fr: "Muwatta 2174", ur: "موطا 2174", tr: "El-Muvatta 2174 — Malik, Amr ibn Yahya el-Mazini'den, o da babasından rivayetle şöyle der: Dedesinin surlarında Abdülrahman ibn Avf'a ait bir bahçe vardı ve o, bahçeyi kendi arazisine daha yakın bir yere taşımak istedi, ancak sur sahibi buna engel oldu. Bunun üzerine Ömer, Abdülrahman'ın bahçeyi taşımasına izin verdi.", id: "Al-Muwatta 2174 — Malik, berdasarkan riwayat Amr ibn Yahya al-Mazini, berdasarkan riwayat ayahnya: Terdapat sebuah kebun di tembok kakeknya yang milik Abd al-Rahman ibn Awf, dan ia ingin memindahkannya ke lokasi yang lebih dekat dengan tanahnya, tetapi pemilik tembok tersebut mencegahnya, sehingga Umar memutuskan untuk mengabulkan permintaan Abd al-Rahman untuk memindahkannya." }
summary:
  ar: "يروي مالك عن عمرو بن يحيى المازني عن أبيه أنه قال: كان في حائط جده ربيع لعبد الرحمن بن عوف، فأراد عبد الرحمن أن يحوله إلى ناحية من الحائط، هي أقرب إلى أرضه، فمنعه صاحب الحائط. فكلم عبد الرحمن بن عوف عمر بن الخطاب في ذلك، فقضى لعبد الرحمن بتحويله. {cite:muwatta-maruf-1997 p.291}"
  tr: "Malik, Amr ibn Yahya al-Mazini'den, o da babasından rivayet ederek şöyle aktarır: Dedesinin bahçesinde, Abd al-Rahman ibn Awf'a ait bir pınar vardı. Abd al-Rahman bu pınarı kendi arazisine daha yakın bir yere taşımak istedi, ancak bahçe sahibi buna engel oldu. Bunun üzerine Abd al-Rahman ibn Awf, Ömer ibn al-Khattab'a bu konuyu anlattı ve Ömer, Abd al-Rahman'ın lehine hüküm vererek pınarı taşımasına izin verdi. {cite:muwatta-maruf-1997 s.291}"
  id: "Malik meriwayatkan dari Amr ibn Yahya al-Mazini, yang juga meriwayatkan dari ayahnya, bahwa ia berkata: Ada sebuah mata air di kebun kakeknya yang milik Abd al-Rahman ibn Awf. Abd al-Rahman ingin memindahkannya ke bagian kebun yang lebih dekat dengan tanahnya, tetapi pemilik kebun mencegahnya. Maka Abd al-Rahman ibn Awf berbicara kepada Umar ibn al-Khattab tentang hal ini, dan Umar memutuskan untuk mengabulkan permintaan Abd al-Rahman, mengizinkannya untuk memindahkan mata air tersebut. {cite:muwatta-maruf-1997 p.291}"
