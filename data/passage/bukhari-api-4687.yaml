label: { ar: "صحيح البخاري 4687 — محو السيئات وحط الخطايا", en: "Sahih al-Bukhari 4687 — bad deeds erased and sins shed", ur: "صحیح بخاری 4687 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… ـ هُوَ ابْنُ زُرَيْعٍ ـ حَدَّثَنَا سُلَيْمَانُ التَّيْمِيُّ، عَنْ أَبِي عُثْمَانَ، عَنِ ابْنِ مَسْعُودٍ ـ أَنَّ رَجُلاً، أَصَابَ مِنَ امْرَأَةٍ قُبْلَةً، فَأَتَى رَسُولَ اللَّهِ فَذَكَرَ ذَلِكَ لَهُ فَأُنْزِلَتْ عَلَيْهِ {وَأَقِمِ الصَّلاَةَ طَرَفَىِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ذَلِكَ ذِكْرَى لِلذَّاكِرِينَ}. قَالَ الرَّجُلُ أَلِيَ هَذِهِ قَالَ \" لِمَنْ عَمِلَ بِهَا مِنْ أُمَّتِي \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4687، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 4687 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 4687، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
