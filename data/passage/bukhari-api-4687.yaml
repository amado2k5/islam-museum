label: { ar: "صحيح البخاري 4687 — محو السيئات وحط الخطايا", en: "Sahih al-Bukhari 4687 — bad deeds erased and sins shed", ur: "صحیح بخاری 4687 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sahih al-Bukhari 4687 — malas acciones borradas y pecados perdonados", fr: "Sahih al-Bukhari 4687 — Les mauvaises actions sont effacées et les péchés pardonnés", tr: "Sahih el-Buhari 4687 — Günahları silmek ve suçları ortadan kaldırmak", id: "Sahih al-Bukhari 4687 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "… ـ هُوَ ابْنُ زُرَيْعٍ ـ حَدَّثَنَا سُلَيْمَانُ التَّيْمِيُّ، عَنْ أَبِي عُثْمَانَ، عَنِ ابْنِ مَسْعُودٍ ـ أَنَّ رَجُلاً، أَصَابَ مِنَ امْرَأَةٍ قُبْلَةً، فَأَتَى رَسُولَ اللَّهِ فَذَكَرَ ذَلِكَ لَهُ فَأُنْزِلَتْ عَلَيْهِ {وَأَقِمِ الصَّلاَةَ طَرَفَىِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ذَلِكَ ذِكْرَى لِلذَّاكِرِينَ}. قَالَ الرَّجُلُ أَلِيَ هَذِهِ قَالَ \" لِمَنْ عَمِلَ بِهَا مِنْ أُمَّتِي \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4687، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 4687 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 4687، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4687 (Comentario Profético del Corán (Tafsir del Profeta (pbuh))), habla de malas acciones borradas y pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 4687 (Commentaire prophétique du Coran (Tafsir du Prophète)), évoque l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'une action."
  tr: "Sahih el-Buhari'de 4687 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4687, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
