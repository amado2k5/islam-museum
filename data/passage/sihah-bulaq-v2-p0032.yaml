text: |-
  * (باب الواو والماء،،
  • ⁦(نسا )⁩ *
  000
  فى ايلة من يجادى ذات أندية • لا يبصر الكاب من ظلماتها الطنبا
  وهو شاذلانه جع ما كان ممدودامثل كساء وأكسية. وندى الارض نداوتها وبللها وأرض
  ندية على فعلة يكسر العيز ولا تقل ندية وشجرنديان والندى الكلأ قال بشر
  تسف الندى ملبونة وتضر * ويقال الندى ندى النهار والسدى ندى الليل يضر بان مثلا
  للجود ويسمى بهما وندى الشئ اذا ابتلّ فهوندمثال تعب فهوتعب وأنديته أنا ونديته أيضا
  تندية (تزا نزاينزونزواونزوانا وفى المفسل نزوالفراراستجهل الفرارا ونزا الذكر على
  الانى نزاء بالكسر يقال ذلا فى الحافر والظاف والسباع وأنزاه غيره ونزاه تنزية ويقال وقع
  فى الشانزاء بالضم وهرداه يأخذها فتنزومنه حتى تموت وقلبي ينزوالى كذا أى ينازعا!.ه
  والتنزى التموثب والتسرع وقال.
  كأنّ فؤاده كرة تنزى • حذار البين لونقع الحذار
  والنازية قصعة قريبة القعر نسا) النسوة والنسوة بالكسر والضم والنساء والذسوان
  جع امرأة من غيرافظها كما يقال خلفة ومخاض وذاك وأواتك وتصغير نسوة نسية و يقال
  أسميات وهو تصغير ابهع والنسيمان بكسر النون خلاف الذكر والحفظ ورجل فسيان بفتح
  النون كثيرا انسيان للشى وقد نسيت الشى نسيانا ولا نقل نسيانا بالتحريك لانّ النسيان انما
  هو تمنيذا العرف وأنسائيه اللّه ونسانيه تنسبة بمعى وتناساه أرى من نفه أه نسبه
  وقول امرئ القيس
  ومثلك يضاء العوارض طفلة • لعوب تناسانى اذاقت سر بالى
  أى تنسينى عن أبى عبيدة والنسيان الترلا قال اللّٰه تعالى نسوا اللّٰه فنسيهم وقال تعالى
  ولا تنسوا الفضل بينكم وأجاز بعضهم الهمزفيه قال المبردكل واومضمومة لك أن تهمزها
  الاواحدة فائنهم اختلفوا فيها وهى قوله تعالى ولا تنسوا الفضل بينكم وما أشبهها من
  واوالجمع وأجاز بعضهم الهم زوهوقليل والاختيارتزك الهمز وأصله تنسيوافسكفت الياء
  وأسقطت لاجتماع الساكنين فلما احتيج الى تعرين الواو ردّت فيها ضمة الياء الاصمعى
  النسابالفتح مقصور عرق يخرج من الورك فيستبطن الفخذين ثم يرّ بالعرقوب حتى يبلغ
  الحافر فاذاسمنت الداية انفلقت فحذاها بلحمتين عظيمتين وحرى النسابينه-ما واستبان واذا
  هزلت الدابة اضطربت الفغذان وماجت الربلتان وخفى النسا وانمايقال منشق النسا
  براد موضعولنساقال أبوذؤيب
  متقلق أنساؤها عن قائئ • كالة رط صاد غبره لا يرضع
  واذا قالوا انه لشديد النسا فاعما يرادبه النسانفسه قال ابن السكيت هو عرق الذا قال
  وقال الاصعىّ هوالنساولا تل هوعرف النساكمالايقال عرف الاكمل ولاء رق الايجل
  وانماه والا كمل والايجل وقال أبوزيد فى تثنيته نسوان ونسيان والمع أنساء ويقال
  ندى الرجل فهونس على فعل اذا اشتكى نساه ونسيته فهو منسى اذا أصبت نساه والنسى
  والنسى ما تلقيه المرأمن خرقاعتلالها مثل وترووتر وقرئوله تعالى وكنت نيامنسسيا
  بالفتح أيضا قال دكين الفقيمى" • كالنسى «اقى بالجهاد البسبس* والنسى أيضامانسى وما
