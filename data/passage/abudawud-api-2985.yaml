label: { ar: "سنن أبي داود 2985 — ما لا يحل", en: "Sunan Abi Dawud 2985 — what is not lawful", ur: "سنن ابی داؤد 2985 — جو حلال نہیں", es: "Sunan Abi Dawud 2985 — lo que no es lícito" }
text: "… فِي أَمْرِنَا ثُمَّ خَفَّضَ رَسُولُ اللَّهِ رَأْسَهُ فَقَالَ لَنَا \" إِنَّ هَذِهِ الصَّدَقَةَ إِنَّمَا هِيَ أَوْسَاخُ النَّاسِ وَإِنَّهَا لاَ تَحِلُّ لِمُحَمَّدٍ وَلاَ لآلِ مُحَمَّدٍ ادْعُوا لِي نَوْفَلَ بْنَ الْحَارِثِ \". فَدُعِيَ لَهُ نَوْفَلُ بْنُ الْحَارِثِ فَقَالَ \" يَا نَوْفَلُ أَنْكِحْ عَبْدَ الْمُطَّلِبِ \". فَأَنْكَحَنِي نَوْفَلٌ ثُمَّ قَالَ النَّبِيُّ \" ادْعُوا لِي مَحْمِيَةَ بْنَ جَزْءٍ \". …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2985، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2985 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2985، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2985 (Tributo, Botín y Gobierno (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
