label: { ar: "الموطأ 559 — حميد بن عبد الرحمن: سورة الإخلاص ثلث القرآن، وسورة الملك تجادل عن صاحبها", en: "Muwatta 559" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف، أنه أخبره أن سورة الإخلاص [[passage/quran-112-1|الإخلاص]] ثلث القرآن، وأن سورة الملك [[passage/quran-67-1|الملك]] تجادل عن صاحبها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن في نسخة م والتمهيد «تعدل ثلث»، وينقل عن ابن عبد البر (التمهيد 7/252) أن مثله لا يقال من جهة الرأي ولا بد أن يكون توقيفاً، وقد ثبت عن النبي من وجوه، ويضيف أنه جاء مرفوعاً من حديث أنس وابن عباس وعقبة بن عمرو وأبي هريرة وأم كلثوم بنت عقبة وغيرهم. {cite:muwatta-maruf-1997 p.287}"
