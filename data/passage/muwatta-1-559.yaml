label: { ar: "الموطأ 559 — حميد بن عبد الرحمن: سورة الإخلاص ثلث القرآن، وسورة الملك تجادل عن صاحبها", en: "Muwatta 559", es: "Muwatta 559", fr: "Muwatta 559", ur: "موطا 559", tr: "Al-Muwatta 559 — Hamid bin Abdul Rahman: İhlas Suresi, Kur'an'ın üçte biridir ve Mülk Suresi, okuyanın adına savunacaktır.", id: "Al-Muwatta 559 — Hamid bin Abdul Rahman: Surah Al-Ikhlas adalah sepertiga Al-Qur'an, dan Surah Al-Mulk akan memohon atas nama pembacanya." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف، أنه أخبره أن سورة الإخلاص [[passage/quran-112-1|الإخلاص]] ثلث القرآن، وأن سورة الملك [[passage/quran-67-1|الملك]] تجادل عن صاحبها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأن في نسخة م والتمهيد «تعدل ثلث»، وينقل عن ابن عبد البر ⁦(التمهيد 7/252)⁩ أن مثله لا يقال من جهة الرأي ولا بد أن يكون توقيفاً، وقد ثبت عن النبي من وجوه، ويضيف أنه جاء مرفوعاً من حديث أنس وابن عباس وعقبة بن عمرو وأبي هريرة وأم كلثوم بنت عقبة وغيرهم. {cite:muwatta-maruf-1997 p.287}"
  id: "Malik meriwayatkannya dari Ibn Shihab, dari Humaid ibn Abd al-Rahman ibn Awf, yang memberitahukannya bahwa Surah al-Ikhlas (112:1) setara dengan sepertiga Al-Quran, dan bahwa Surah al-Mulk (67:1) akan memberi syafaat bagi pembacanya. Editor menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya dari Malik, dan bahwa dalam manuskrip M dan al-Tamhid tertulis, “Ia setara dengan sepertiga.” Ia mengutip Ibn Abd al-Barr (al-Tamhid 7/252) yang mengatakan bahwa pernyataan seperti itu tidak dapat didasarkan pada pendapat pribadi tetapi harus diwahyukan secara ilahi. Hal ini telah diriwayatkan secara sahih dari Nabi melalui beberapa rantai periwayatan. Dia menambahkan bahwa hadits ini diriwayatkan dengan sanad yang berawal dari Nabi Muhammad shalla Allahu alaihi wa sallam melalui Anas, Ibnu Abbas, Uqbah bin Amr, Abu Hurairah, Umm Kulthum binti Uqbah, dan lainnya."
