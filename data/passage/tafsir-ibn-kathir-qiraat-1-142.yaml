text: "… فقال أبو بكر : إنَّ عمر بن الخطاب أتاني، فقال: إنَّ القتل قد استَحَرَّ بقُرَّاء القرآن، وإني أخشى أن يَسْتَحِرَّ القتل بالقراء في المواطن فيذهب كثيرٌ من القرآن، وإنّي أرى أن تأمر بجمع القرآن. فقلت لعمر: كيف نفعل شيئًا لم …"
