label: { ar: "سنن ابن ماجه 1608 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sunan Ibn Majah 1608 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "سنن ابن ماجہ 1608 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan Ibn Majah 1608 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sunan Ibn Majah 1608 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan İbn Majah 1608 — Baba ve babalık, anne babaya saygı göstermek veya göstermemek", id: "Sunan Ibn Majah 1608 — Ayah dan peran ayah, menghormati atau durhaka kepada orang tua" }
text: "… بْنُ إِسْحَاقَ أَبُو بَكْرٍ الْبَكَّائِيُّ، قَالاَ حَدَّثَنَا أَبُو غَسَّانَ، قَالَ حَدَّثَنَا مِنْدَلٌ، عَنِ الْحَسَنِ بْنِ الْحَكَمِ النَّخَعِيِّ، عَنْ أَسْمَاءَ بِنْتِ عَابِسِ بْنِ رَبِيعَةَ، عَنْ أَبِيهَا، عَنْ عَلِيٍّ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" إِنَّ السِّقْطَ لَيُرَاغِمُ رَبَّهُ إِذَا أَدْخَلَ أَبَوَيْهِ النَّارَ. فَيُقَالُ أَيُّهَا السِّقْطُ الْمُرَاغِمُ رَبَّهُ أَدْخِلْ أَبَوَيْكَ الْجَنَّةَ. فَيَجُرُّهُمَا بِسَرَرِهِ حَتَّى يُدْخِلَهُمَا الْجَنَّةَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1608، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1608 (Chapters Regarding Funerals), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1608، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1608 (Capítulos sobre los funerales), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1608 (chapitres relatifs aux funérailles), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "İbn Majah'ın Sünen'inde yer alan 1608 numaralı hadis, baba ve babalık kavramını, anne babaya saygı göstermeyi veya göstermemeyi ele almaktadır. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1608, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
