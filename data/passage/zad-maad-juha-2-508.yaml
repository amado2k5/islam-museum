text: "المهد ما يُفْطِرُ به الصائم، وهذا رواية عن الإمام أحمد. وقالت طائفة أخرى: لا يثبُت التحريمُ بأقلَّ مِن ثلاث رضعات، وهذا قولُ أبي ثور، وأبي عبيد، وابن المنذر، وداود بن علي، وهو روايةٌ ثانية عن أحمد. وقالت طائفة أخرى: لا …"
