text: "… لِلْحَجَّامِ دَلِيلٌ عَلَى إبَاحَتْهِ إذْ لا يُنْطيه مَا يَحْرُمُ عَلَيْهِ، وَهُوَ يُعَلِّمُ النَّاسَ وَيَنْهَاهُمْ عَنْ الْمُحَرَّمَات، فَكَيّفَ يُمْعِيهِمْ إيَّاهَا، وَيُمَكّنُهُمْ مِنْهَا، وَأَمْرُهُ بإطْعَامٍ الرَّقِيقِ مِنْهَا دَلِيلٌ عَلَى الإِبَاحَةِ، فَيَتَعَيّنُ حَمْلُ نَهْيهِ عَنْ أَحْلِهَا عَلَى الْكَرَاهَةِ دُونَ التَّحْرِيمِ. وَكَذَلِكَ قَوْلُ الإِمَامِ …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 1289، يذكر ما حُرّم، والتحريم، والمحرمات، والمباح، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 1289, that mentions what was made unlawful, prohibition, the forbidden things, the permissible, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 1289 کا اقتباس جس میں جو حرام کیا گیا، تحریم، محرمات، مباح، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Mughni de Ibn Qudama, volumen 3, pág. 1289, que menciona lo que se consideró ilícito, la prohibición, lo prohibido, lo permitido y lo desaconsejado; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Mughni d'Ibn Qudama (tome 3, page 1289) mentionnant ce qui est interdit, les interdits, les choses permises et celles qui sont déconseillées. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire Halal and Haram Browser."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 3. cildinin 1289. sayfasından, haram olan şeyleri, yasakları, haram kılınan şeyleri, helal olan şeyleri ve mekruh edilen şeyleri anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Volume 3, halaman 1289, yang menyebutkan apa yang dilarang, larangan, hal-hal yang diharamkan, hal-hal yang diperbolehkan, dan hal-hal yang tidak disukai; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
