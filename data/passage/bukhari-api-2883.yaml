label: { ar: "صحيح البخاري 2883 — مداواة الجراح، مداواة النساء للجرحى", en: "Sahih al-Bukhari 2883 — the treatment of wounds; women treating the wounded", ur: "صحیح بخاری 2883 — زخموں کا علاج، خواتین کا زخمیوں کا علاج", es: "Sahih al-Bukhari 2883 — El tratamiento de las heridas; mujeres que tratan a los heridos", fr: "Sahih al-Bukhari 2883 — Le traitement des plaies; les femmes soignant les blessés", tr: "Sahih el-Buhari 2883 — Yaraların tedavisi, kadınların yaralıları tedavi etmesi", id: "Sahih al-Bukhari 2883 — Merawat luka, wanita merawat orang yang terluka" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا بِشْرُ بْنُ الْمُفَضَّلِ، عَنْ خَالِدِ بْنِ ذَكْوَانَ، عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذٍ، قَالَتْ كُنَّا نَغْزُو مَعَ النَّبِيِّ فَنَسْقِي الْقَوْمَ وَنَخْدُمُهُمْ، وَنَرُدُّ الْجَرْحَى وَالْقَتْلَى إِلَى الْمَدِينَةِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2883، يذكر مداواة الجراح، ومداواة النساء للجرحى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 2883 (Fighting for the Cause of Allah (Jihaad)), that mentions the treatment of wounds, women treating the wounded. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 2883، جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2883 (La lucha por la causa de Alá (Yihad)), menciona el tratamiento de heridas y a las mujeres atendiendo a los heridos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 2883 (Combat pour la cause d'Allah (Jihad)), mentionne le traitement des blessures, notamment les soins prodigués par les femmes aux blessés. Le navigateur de ressources médicales le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 2883 numaralı hadis, yaraların tedavisi ve kadınların yaralıları tedavi etmesinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2883, menyebutkan pengobatan luka dan peran wanita dalam mengobati orang yang terluka. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
