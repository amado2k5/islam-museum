label: { ar: "صحيح البخاري 2883 — مداواة الجراح، مداواة النساء للجرحى", en: "Sahih al-Bukhari 2883 — the treatment of wounds; women treating the wounded", ur: "صحیح بخاری 2883 — زخموں کا علاج، خواتین کا زخمیوں کا علاج" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا بِشْرُ بْنُ الْمُفَضَّلِ، عَنْ خَالِدِ بْنِ ذَكْوَانَ، عَنِ الرُّبَيِّعِ بِنْتِ مُعَوِّذٍ، قَالَتْ كُنَّا نَغْزُو مَعَ النَّبِيِّ فَنَسْقِي الْقَوْمَ وَنَخْدُمُهُمْ، وَنَرُدُّ الْجَرْحَى وَالْقَتْلَى إِلَى الْمَدِينَةِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2883، يذكر مداواة الجراح، ومداواة النساء للجرحى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 2883 (Fighting for the Cause of Allah (Jihaad)), that mentions the treatment of wounds, women treating the wounded. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 2883، جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
