text: "… مرَّةً لهذا ومرَّةً لهذا، دوف حرف الدال - بالفتح: الفعل. وقال بعضهمٍ: الدُولَةُ والدَّوْلَةُ لغتان بمعنىً. وقال محمد بن سلام الجُمَحي: سألت د اَلْأغْنِيَاءِ مِنكُمْ الحشر : فقال: قال أبو عمرو بن العَلَاء: الدُّولة بالضم في المال، والدَّوْلَةُ بالفتح في …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 1، ص 394، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 1, p. 394, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الصحاح، جوہری، اسکین جلد 1، ص 394 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Sihah de al-Jawhari, volumen 1, pág. 394, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Sihah d'al-Jawhari (tome 1, p. 394) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Cevhari'nin Resimli Cilt 1, sayfa 394'te yer alan, Kur'an okuyucularını belirten Sahah adlı eserinden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Sahah karya Al-Jawhari, Jilid Bergambar 1, hlm. 394, yang menyebutkan para qari; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
