text: "… لا، وسألتك عن أتباعه فزعمت أنهم الأحداث والمساكين والضعفاء وكذلك أتباع الأنبياء في كل زمان، وسألتك عمن يتبعه أيحبه ويلزمه أم يقليه ويفارقه فزعمت أنه قل من يصحبه فيفارقه وكذلك حلاوة الإيمان لا تدخل قلبًا فتخرج منه، وسألتك كيف الحرب …"
summary:
