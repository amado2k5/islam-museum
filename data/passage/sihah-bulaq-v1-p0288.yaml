text: |-
  . ⁦(ف صل الطأ.)⁩
  ٣٥٣
  بمقام لا تغر صادقة • يطهر عنها القذاة حاجبها
  والطمور السريع والطهور القوس البعيدة الرمى وقال الاصمعى المطحر بكسر الميم
  السهم اليعيد الذهاب قال أبو ذؤيب
  فرمى فالحق صاعديا مطحرا * بالكشمح فاشتملت عليه الاضلع
  وحرب مطهرة زيون والطهير النفس العالى وقد طحر الرجسل يطهر بالكسر طهيراوهو.شل
  الزحير أبوعمر الطهرور بالحاء والخاء اللطخ من السحاب القليل وقال الاصمعى شى قطع
  ستدقة رقاق بقال ما فى السهاء طهر وطحرة وقد يحرلناكان حوف الحلق وطرور
  وطخرورة بالحاء والخاء ويقال ماعلى السماءطجرة أى شئ من الغيم وما بقيت على الابل
  طحرة اذاسطت أوبارها وما على فلان طهرة اذا كان عاريا وطهرية أيضامشل طهرية بالياء
  والبامجيعا حمر طحعرت السقاعملا ته وطحعرت القوص وترتها ابن السكيت
  ماعلى السماء طحوريرة وطخهر يرة بالحاء والخاء أى شئ من الغيم (طفر الطخرور
  مثل الطعرور قال الراجز
  لاكاذب النوم ولا طخروره • جون يعج الميت من هديره
  والجمع الطخارير وأنشد الاصمعى
  إنا اذا قلت طخارير القزع وصدر الشارب منهاءن جرع نفعلها البيض القلبلات الطبيع
  وقواهم جانى طفارير أى اشابة من الناس متفرّقون أبو عبيد يقال للرجل اذالم يكن
  حاداولا كميفا انه الطخرور ⁦(طرة)⁩ الطرّة كفة الثوب وهى جائبه الذى لاهدب ه وطرّة
  النهروالوادى شغيره وطرّة كل شي حرفه والجمع طرر وأطرار البلاد أطرافها والطرّة الفاصية
  والطرّتان من الهارخطان سوداوان على كتفيه وقد جعلهما أبوذؤيب للذور الوحشى
  أيضا وقال يصف الثور والكلاب
  بنهشنه ويذودهنّ ويحتمى * عبل الشوى بالطرتين مولع
  وطرّة متنه طريقته وكذلك الطرة من السحاب وقولهم جاؤاطرًا أى جميعا وطر النبت يطر
  بالضم طرورانيت ومنه طرّشارب الغلام فهوطار وطررت السنان حددته فهو مطرور وطرير
  وقد يسكون الطرّ الشق والقطع ومنه الطرّار ويقال طرّ حوضه أى طينه والطر الشل
  وطررت الابل مثل طردتها اذاضمتها من نواحيها قال يعوب طررت الابل أطرهاطرا
  اذا مشيت من أحدجانبيها ثم من الجانب الا خرلتوّ.ها وطرّت يد. مشل ترّت أى سقطت
  قال ضربه فأطريده أى قطعها وأدرها وأطرأى أدل وفى المشل أطرى فانك ناءسلة
  قال ابن السكيت. أى أدلى فان عليك نعلين يضرب للمذكر والمؤنت والاثنين والمع على
  فظ التأندث لان أصل المثل خوطبت به امر أة فحرى على ذلك وقال أبو عيد معناه اركب
  الامر الشديد فانك قوى عليه قال وأصله أنّ رجلا قال راعية له كانت ترعى فى السهولة
  وتترك الحزونة أطرى أى خذى طرر الوادى وهى نواحيه فان عليك تعلين قال وأحسبه عنى
  بالذعلين غلظ جلد قدميها وقواه.م غضب مطراذا كان فى غيرم وضعه وفمالا يوجب غضبا
  قال الحطيئة غضيتم عاينا ان قتلنا بخالد • بني مالكها إن ذاغضب مطر
  ٨٩
  مجاح
