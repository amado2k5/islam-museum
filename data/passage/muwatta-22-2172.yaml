label: { ar: "الموطأ 2172 — مالك عن ابن شهاب عن الأعرج عن أبي هريرة: قال رسول الله لا يمنع أحدكم جاره خشبة يغرزها في جداره، ثم قال أبو هريرة: ما لي أراكم عنها معرضين، والله لأرمين بها بين أكتافكم", en: "Muwatta 2172" }
summary:
