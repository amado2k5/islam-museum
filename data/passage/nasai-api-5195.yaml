label: { ar: "سنن النسائي 5195 — الأب والأبوة", en: "Sunan al-Nasa'i 5195 — the father and fatherhood", ur: "سنن نسائی 5195 — باپ اور والدیت", es: "Sunan al-Nasa'i 5195 — El padre y la paternidad" }
text: "… عَبْدُ اللَّهِ بْنُ مُسْلِمٍ، - مِنْ أَهْلِ مَرْوَ أَبُو طَيْبَةَ - قَالَ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، أَنَّ رَجُلاً، جَاءَ إِلَى النَّبِيِّ وَعَلَيْهِ خَاتَمٌ مِنْ حَدِيدٍ فَقَالَ \" مَا لِي أَرَى عَلَيْكَ حِلْيَةَ أَهْلِ النَّارِ \". فَطَرَحَهُ ثُمَّ جَاءَهُ وَعَلَيْهِ خَاتَمٌ مِنْ شَبَهٍ فَقَالَ \" مَا لِي أَجِدُ مِنْكَ رِيحَ الأَصْنَامِ \". فَطَرَحَهُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 5195، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5195 (The Book of Adornment), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5195، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5195 (El Libro de los Adornos), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
