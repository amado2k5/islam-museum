text: "… إحدى الصلوات الخمس المفروضة وجب عليه الحنث. وقد يكون الحنث مندوبا وذلك إذا حلف على ترك مندوب كسنة الضحى أو على فعل مكروه كأن يلتفت بوجهه فى الصلاة فيندب الحنث. وقد يكون الحنث مباحا وذلك إذا حلف على ترك مباح …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 1، ص 312، يرد فيه ذكر الفرض، وما يجب على المكلف، والمندوب، والمكروه، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 1, p. 312, whose wording mentions the obligatory (fard), what is binding on the person addressed, the recommended (mandub), the disliked (makruh), the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 1، ص 312 کا اقتباس جس میں فرض، جو مکلف پر واجب ہے، مندوب، مکروہ، مباح، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 1, p. 312, dont le texte mentionne l'obligatoire (fard), ce qui s'impose à la personne responsable, le recommandé (mandub), le réprouvé (makruh), le permis (mubah), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 1, p. 312, cuyo texto menciona lo obligatorio (fard), lo que obliga a la persona responsable, lo recomendado (mandub), lo reprobado (makruh), lo permitido (mubah), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
