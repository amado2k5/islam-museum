label: { ar: "الموطأ 2352 — مالك: مكاتب أو مدبر وطئ جارية فحملت منه", en: "Muwatta 2352" }
summary:
  ar: "قال مالك في مكاتب أو مدبر ابتاع أحدهما جارية فوطئها فحملت منه وولدت: ولد كل واحد منهما من جاريته بمنزلته، يعتقون بعتقه ويرقون برقه. فإذا أعتق هو، فإنما أم ولده مال من ماله يُسلم إليه إذا أعتق. {cite:muwatta-maruf-1997 p.370}"
