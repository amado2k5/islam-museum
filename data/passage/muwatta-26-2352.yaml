label: { ar: "الموطأ 2352 — مالك: مكاتب أو مدبر وطئ جارية فحملت منه", en: "Muwatta 2352", es: "Muwatta 2352", fr: "Muwatta 2352", ur: "موطا 2352", tr: "Al-Muwatta 2352 — Malik: Bir mukatab veya mudabbar, bir cariye ile cinsel ilişkiye girdi ve cariye ondan hamile kaldı.", id: "Al-Muwatta 2352 — Malik: Seorang mukatab atau mudabbar bersetubuh dengan seorang budak perempuan dan budak perempuan itu hamil karenanya." }
summary:
  ar: "قال مالك في مكاتب أو مدبر ابتاع أحدهما جارية فوطئها فحملت منه وولدت: ولد كل واحد منهما من جاريته بمنزلته، يعتقون بعتقه ويرقون برقه. فإذا أعتق هو، فإنما أم ولده مال من ماله يُسلم إليه إذا أعتق. {cite:muwatta-maruf-1997 p.370}"
  tr: "Malik, azat sözleşmesi olan bir köle veya efendisinin ölümünden sonra özgürlüğünü vaat ettiği bir köle hakkında şöyle demiştir: Bunlardan biri bir cariye satın alır, onunla cinsel ilişkiye girer ve cariye hamile kalıp çocuk doğurursa: Her birinin cariyesinden olan çocuğu kendi malı sayılır; kendisi özgür kaldığında çocuk da özgür kalır, kendisi köle kaldığı sürece köle olarak kalır. Eğer kendisi özgür kalırsa, çocuğunun annesi, özgürlüğüne kavuştuğunda kendisine devredilen malvarlığından sayılır. {cite:muwatta-maruf-1997 s.370}"
