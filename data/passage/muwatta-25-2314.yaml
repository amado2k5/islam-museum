label: { ar: "الموطأ 2314 — مالك: المكاتب أحق بشراء كتابته إذا بيعت", en: "Muwatta 2314", es: "Muwatta 2314", fr: "Muwatta 2314", ur: "موطا 2314", tr: "El-Muvatta 2314 — Malik: Katip, yazılı belgesi satılırsa onu geri satın alma hakkına sahiptir.", id: "Al-Muwatta 2314 — Malik: Juru tulis berhak membeli kembali dokumen tulisannya jika dijual." }
summary:
  ar: "قال مالك: أحسن ما سُمع في المكاتب أنه إذا بِيع كان أحق بشراء كتابته ممن اشتراها، إذا قوي على أداء الثمن نقدا؛ لأن شراءه نفسه عتاقة، والعتاقة تُقدَّم على ما معها من الوصايا. أما بيع بعض من كاتبه نصيبه منه، فلا شفعة فيه للمكاتب، لأنه يصير بمنزلة القطاعة، وليس له أن يقاطع بعض من كاتبه إلا بإذن شركائه. فإن أذنوا له كان أحق بما بيع منه. {cite:muwatta-maruf-1997 p.354} {cite:muwatta-maruf-1997 p.355}"
  tr: "Malik şöyle dedi: Bir mukatab (kölelikten kurtulma sözleşmesi yapmış bir köle) hakkındaki en iyi görüş, satılırsa, bedelini nakit olarak ödeyebilmesi şartıyla, sözleşmeyi satın alan kişiden daha fazla satın alma hakkına sahip olduğudur. Çünkü kendini satın alması kölelikten kurtulmayı sağlar ve kölelikten kurtulma, herhangi bir vasiyetten önceliklidir. Ancak, mutabbih'lerinden (kölelikten kurtulma sözleşmesi yapmış kölelerden) biri sözleşmedeki payını satarsa, mukatabın öncelik hakkı yoktur. Çünkü bu, sözleşmenin feshedilmesi gibi olur ve ortaklarının izni olmadan sözleşmeyi mutabbih'lerinden herhangi biriyle feshedemez. Eğer ortakları izin verirse, payından satılan şey üzerinde daha büyük bir hakkı olur. {cite:muwatta-maruf-1997 s.354} {cite:muwatta-maruf-1997 s.355}"
  id: "Malik berkata: Pendapat terbaik mengenai seorang mukatab (budak yang telah membuat perjanjian pembebasan) adalah bahwa jika ia dijual, ia memiliki hak yang lebih besar untuk membeli kembali perjanjian pembebasannya daripada orang yang membelinya, asalkan ia mampu membayar harganya secara tunai. Hal ini karena membeli dirinya sendiri merupakan pembebasan, dan pembebasan lebih diutamakan daripada wasiat apa pun. Namun, jika beberapa mutabbih-nya (budak yang telah membuat perjanjian pembebasan) menjual bagiannya dari perjanjian tersebut, mukatab tidak memiliki hak prioritas. Hal ini karena hal itu menjadi seperti pemutusan perjanjian, dan ia tidak dapat memutus perjanjian dengan mutabbih-nya kecuali dengan izin dari rekan-rekannya. Jika mereka memberinya izin, ia memiliki hak yang lebih besar atas apa yang dijual dari bagiannya. {cite:muwatta-maruf-1997 p.354} {cite:muwatta-maruf-1997 p.355}"
