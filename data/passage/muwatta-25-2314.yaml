label: { ar: "الموطأ 2314 — مالك: المكاتب أحق بشراء كتابته إذا بيعت", en: "Muwatta 2314" }
summary:
  ar: "قال مالك: أحسن ما سُمع في المكاتب أنه إذا بِيع كان أحق بشراء كتابته ممن اشتراها، إذا قوي على أداء الثمن نقدا؛ لأن شراءه نفسه عتاقة، والعتاقة تُقدَّم على ما معها من الوصايا. أما بيع بعض من كاتبه نصيبه منه، فلا شفعة فيه للمكاتب، لأنه يصير بمنزلة القطاعة، وليس له أن يقاطع بعض من كاتبه إلا بإذن شركائه. فإن أذنوا له كان أحق بما بيع منه. {cite:muwatta-maruf-1997 p.354} {cite:muwatta-maruf-1997 p.355}"
