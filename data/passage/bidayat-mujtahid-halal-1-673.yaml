text: "… وجهين: أولاهما به عندي - والله أعلم - أن يكون ما نهى عنه جملةً أراد به ما سوى العرايا، ويحتمل أن يكون أَرْخص فيها بعد وجوبها في جملة النهي، وأيَّهما كان: فعلينا طاعته بإحلال ما أحل، وتحريم ما حَرَّم. اه. …"
summary:
