label: { ar: "الموطأ 829 — مالك في من وجب عليه صيام شهرين متتابعين في قتل خطأ أو ظهار فعرض له مرض يقطع صيامه: إن صح وقوي فليس له أن يؤخر، بل يبني على ما مضى", en: "Muwatta 829" }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول: أحسن ما سمع فيمن وجب عليه صيام شهرين متتابعين في قتل خطأ أو ظهار، فعرض له مرض يغلبه ويقطع عليه صيامه: أنه إن صح من مرضه وقوي على الصيام فليس له أن يؤخر ذلك، وهو يبني على ما مضى من صيامه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (813). {cite:muwatta-maruf-1997 p.405}"
