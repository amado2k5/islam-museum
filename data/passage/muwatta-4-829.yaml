label: { ar: "الموطأ 829 — مالك في من وجب عليه صيام شهرين متتابعين في قتل خطأ أو ظهار فعرض له مرض يقطع صيامه: إن صح وقوي فليس له أن يؤخر، بل يبني على ما مضى", en: "Muwatta 829", es: "Muwatta 829", fr: "Muwatta 829", ur: "موطا 829", tr: "El-Muvatta 829 — Malik, kasıtsız öldürme veya zihar (bir tür boşanma) nedeniyle iki ay boyunca oruç tutması gereken, sonra hastalanıp orucunu bozan kimse hakkında şöyle demiştir: Eğer iyileşir ve güçlenirse, orucunu ertelemesine izin verilmez, kaldığı yerden devam eder.", id: "Al-Muwatta 829 — Malik berkata tentang seseorang yang wajib berpuasa selama dua bulan berturut-turut karena pembunuhan yang tidak disengaja atau zihar (suatu bentuk perceraian), kemudian jatuh sakit dan membatalkan puasanya: Jika ia sembuh dan menjadi kuat, ia tidak diperbolehkan menundanya, melainkan melanjutkan dari tempat ia berhenti." }
summary:
  ar: "يقول يحيى: سمعت مالكاً يقول: أحسن ما سمع فيمن وجب عليه صيام شهرين متتابعين في قتل خطأ أو ظهار، فعرض له مرض يغلبه ويقطع عليه صيامه: أنه إن صح من مرضه وقوي على الصيام فليس له أن يؤخر ذلك، وهو يبني على ما مضى من صيامه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (813). {cite:muwatta-maruf-1997 p.405}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Kasıtsız öldürme veya zihar (bir tür boşanma) nedeniyle iki ay üst üste oruç tutmakla yükümlü olan, ancak daha sonra hastalanıp oruç tutamayacak duruma gelen kimse hakkında duyduğum en iyi görüş şudur: Eğer iyileşir ve oruç tutabilecek duruma gelirse, orucunu ertelemesine izin verilmez; aksine, kaldığı yerden devam eder. Araştırmacı, bunun Malik'ten Ebu Mus'ab (813) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.405}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Pendapat terbaik yang saya dengar mengenai seseorang yang wajib berpuasa selama dua bulan berturut-turut karena pembunuhan yang tidak disengaja atau zihar (suatu bentuk perceraian), tetapi kemudian jatuh sakit dan tidak mampu berpuasa, adalah bahwa jika ia sembuh dan mampu berpuasa, ia tidak diperbolehkan menundanya; melainkan, ia melanjutkan dari tempat ia berhenti. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (813). {cite:muwatta-maruf-1997 p.405}"
