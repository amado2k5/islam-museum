label: { ar: "الموطأ 1471 — مالك: الأخ لأب وأم أولى بالميراث من الأخ للأب، والأخ للأب أولى من بني الأخ للأب والأم، ثم بنو الأخ، ثم الأعمام على هذا الترتيب", en: "Muwatta 1471" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم في ولاية العصبة أن الأخ لأب وأم أولى بالميراث من الأخ للأب، والأخ للأب أولى من بني الأخ للأب والأم، وبنو الأخ للأب والأم أولى من بني الأخ للأب، وبنو الأخ للأب أولى من بني ابن الأخ للأب والأم، وبنو ابن الأخ للأب أولى من العم أخي الأب للأب والأم، والعم أخو الأب للأب والأم أولى من العم أخي الأب للأب، والعم أخو الأب للأب أولى من بني العم أخي الأب للأب والأم، وابن العم للأب أولى من عم الأب أخي أبي الأب للأب والأم. {cite:muwatta-maruf-1997 p.19}"
