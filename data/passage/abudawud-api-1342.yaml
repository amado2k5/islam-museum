label: { ar: "سنن أبي داود 1342 — اليتيم وفقد الأب", en: "Sunan Abi Dawud 1342 — the orphan and the father lost", ur: "سنن ابی داؤد 1342 — یتیم اور باپ کی موت", es: "Sunan Abi Dawud 1342 — El huérfano y el padre perdido", fr: "Sunan Abi Dawud 1342 — L'orphelin et le père perdus", tr: "Sunan Abi Davud 1342 — Yetim ve Babasının Kaybı", id: "Sunan Abi Dawud 1342 — Anak Yatim dan Kehilangan Ayah" }
text: "… وَلَمْ يَصُمْ شَهْرًا يُتِمُّهُ غَيْرَ رَمَضَانَ، وَكَانَ إِذَا صَلَّى صَلاَةً دَاوَمَ عَلَيْهَا، وَكَانَ إِذَا غَلَبَتْهُ عَيْنَاهُ مِنَ اللَّيْلِ بِنَوْمٍ صَلَّى مِنَ النَّهَارِ ثِنْتَىْ عَشْرَةَ رَكْعَةً. قَالَ : فَأَتَيْتُ ابْنَ عَبَّاسٍ فَحَدَّثْتُهُ. فَقَالَ : هَذَا وَاللَّهِ هُوَ الْحَدِيثُ، وَلَوْ كُنْتُ أُكَلِّمُهَا لأَتَيْتُهَا حَتَّى أُشَافِهَهَا بِهِ مُشَافَهَةً. قَالَ قُلْتُ : لَوْ عَلِمْتُ أَنَّكَ لاَ تُكَلِّمُهَا مَا حَدَّثْتُكَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1342، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1342 (Prayer (Kitab Al-Salat): Voluntary Prayers), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1342، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1342 (Oración (Kitab Al-Salat): Oraciones voluntarias), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sunan Abi Dawud, n° 1342 (Prière (Kitab Al-Salat): Prières surérogatoires), évoque l’orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sünen Ebu Davud'da yer alan 1342 numaralı hadiste yetimlerden ve babasızlık durumundan bahsedilir. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 1342, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Hadits ini dikumpulkan oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
