text: |-
  ⁦(فصل الثين)⁩
  ٢١٩
  يذكرر جلاداهية فاتزدرى من حية حبلية • سكات اذا ماعض ايس :أدردا
  وذهب بالهاء الى تأنيث لفظ الحية وتول كنت على سكات ه_ذه الحاجة أى على شرف من
  ادراكها أبوز يدرميته بسكانه أى بما أسكته والسكيت مشأل الكميت آخر ما يجى من
  الخيل فى الجلية من العشر المعدودات وقد يشتدفيقال السكيت وهو القاشور والفسكل
  أيضاوماجاء بعدذلك لا يعتذبه ⁦(سلت )⁩ السلت بالضم ضرب من الشعيرايس له قشركانه
  حنطة والسلاتة ما يؤخذبالاصبع من جوانب القصعة لتننظف تقول سلت القصعة أسلتها
  سلتا وسلت بالسيف انفه أى جدعه والرجل أسلت اذا أوعب جدع انفه وأبوقيس
  اين الاسلت الشاءر وسلتت الرأة خضابها عن يدها اذا أاقت عنها العصم ١٠ والسلمتا.
  المرآة التى لا تشعه-دالحفاء قال الاصمحى سات رأسه أى حلقه ورأس مسلوت ومح_لون
  و-سبوت ومحلوق؛عنى قال وسلمته مائة سوط أى جلدته مثل حلدنه ( مت السمت
  الطريق وسمت يسمت بالضم أى قصد والسمت هيئة أهل الخريقال ما أحسن سممه أى هديه
  والسمت السير بالظنِّ والحد من وقال ليَس بهاريع لسمت السامت وتسمته أى قصده
  والتسميت ذكراسم اللّه تعالى على الشئ وتسميت العاطس أن تقول له يرح-ك اللّٰه السين
  والشين جيعا قال ثعلب الاختيار بالسين لائه مأخوذ من السمت وهوالقصد والمحجة وقال
  أبو عبيد الشين أعلى فى كلامهم وأكثر (سنت ، أسنت القوم أجدبوا قال ابن الزبعرى
  عمر والعلاهسم التريداومه • ورجال مكة مستون عماف
  وأصله من السنة قلبوا الواوتاء ليفرقوابينسه وبين قواه-م أسنى القوم اذا أقامواسنة
  فى موضع وقال الفرّاء توهموا أنّ الهاء أصلية اذوجدوها ثالثة فقلبوهاتاء تقول منه
  أصابهم السنة بالتاء ورجل سنت قليل الخير والسنوت الكمون تقول منه سذت القدر:
  تسنيقا اذاطرحت فيها الكمون والسفوت أيضا العسل قال الشاعر
  . هم السمن بالسنوت لا ألس بينهم * وهم ينعون جارهم أن يقرّدا
  وبعض العرب يقول هو السنوت مثال السنورويقال تسنتها اذا تزوج رحل لثيم امرأة
  كريمة لقلة مالها وكثرة ماله
  فل رسسل التي ) ( ث شئيت من انظيل الفرس العنود وليسله فعل يتصرّف
  قال رجل من الانصار
  وأقدر مشرف الصهوات ساط * كنت لا أحق ولا شئيت
  وقال الاصعىّ الشقيت الذى يقصر حافرار جليه عن حافرى يديه ⁦( تت)⁩ أمرشت
  أى متفرّق وشت الامرشتا وشتا تاتفرق واستشت مثله وكذلك التشتت وشتته تشتيما
