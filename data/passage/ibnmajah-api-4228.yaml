label: { ar: "سنن ابن ماجه 4228 — الأب والأبوة", en: "Sunan Ibn Majah 4228 — the father and fatherhood", ur: "سنن ابن ماجہ 4228 — باپ اور والدیت" }
text: "… حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ الْمَرْوَزِيُّ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَنْبَأَنَا مَعْمَرٌ، عَنْ مَنْصُورٍ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنِ ابْنِ أَبِي كَبْشَةَ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ ـ ح وَحَدَّثَنَا مُحَمَّدُ بْنُ إِسْمَاعِيلَ بْنِ سَمُرَةَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ مُفَضَّلٍ، عَنْ مَنْصُورٍ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنِ ابْنِ أَبِي كَبْشَةَ، عَنْ أَبِيهِ، عَنِ النَّبِيِّ ـ نَحْوَهُ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4228، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4228 (Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4228، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
