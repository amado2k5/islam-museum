label: { ar: "الموطأ 1879 — مالك عن نافع عن سليمان بن يسار: فنى علف دابة عبد الرحمن بن الأسود بن عبد يغوث، فقال لغلامه خذ من حنطة أهلك طعاما فابتع بها شعيرا ولا تأخذ إلا مثله", en: "Muwatta 1879", es: "Muwatta 1879", fr: "Muwatta 1879", ur: "موطا 1879", tr: "El-Muvatta 1879 — Malik, Nafi’den, o da Süleyman ibn Yasar’dan rivayetle: Abdülrahman ibn el-Esved ibn Abd Yaghuth’un hayvanının yemi bitince, hizmetçisine şöyle dedi: “Ailenin buğdayından biraz al, onunla arpa al ve bundan daha azını alma.”", id: "Al-Muwatta 1879 — Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Sulayman ibn Yasar: Pakan ternak Abd al-Rahman ibn al-Aswad ibn Abd Yaghuth habis, maka beliau berkata kepada pelayannya: “Ambillah sebagian gandum keluargamu sebagai makanan dan belilah jelai dengan gandum itu, dan jangan mengambil kurang dari jumlah yang sama.”" }
summary:
  ar: "يروي مالك عن نافع عن سليمان بن يسار أنه أخبره أن عبد الرحمن بن الأسود بن عبد يغوث فنى علف دابته، فقال لغلامه: خذ من حنطة أهلك طعاما، فابتع بها شعيرا، ولا تأخذ إلا مثله. {cite:muwatta-maruf-1997 p.173}"
  tr: "Malik, Nafi'den, o da Süleyman ibn Yasar'dan rivayet eder ki, Süleyman ibn Yasar ona şöyle anlatmıştır: Abdurrahman ibn el-Esved ibn Abdur Yaghuth hayvanı için yem bulamayınca hizmetçisine şöyle demiş: \"Ailenin buğdayından biraz al, onunla arpa al ve bundan fazlasını alma.\" {cite:muwatta-maruf-1997 s.173}"
  id: "Malik meriwayatkan dari Nafi’ berdasarkan riwayat Sulayman ibn Yasar, yang menceritakan kepadanya bahwa Abd al-Rahman ibn al-Aswad ibn Abd Yaghuth kehabisan pakan untuk hewan ternaknya, lalu ia berkata kepada pelayannya: “Ambillah sebagian gandum keluargamu untuk makanan, dan belilah jelai dengan gandum itu, dan jangan mengambil lebih dari jumlah yang sama.” {cite:muwatta-maruf-1997 p.173}"
