label: { ar: "صحيح البخاري 5991 — الواصل ليس المكافئ", en: "Sahih al-Bukhari 5991 — The one who upholds kinship is not the one who merely repays", ur: "صحیح بخاری 5991 — رشتے جوڑنے والا وہ نہیں جو صرف بدلہ دے" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، وَالْحَسَنِ بْنِ عَمْرٍو، وَفِطْرٍ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو ـ وَقَالَ سُفْيَانُ لَمْ يَرْفَعْهُ الأَعْمَشُ إِلَى النَّبِيِّ صلى الله عليه وسلم وَرَفَعَهُ حَسَنٌ وَفِطْرٌ ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ لَيْسَ الْوَاصِلُ بِالْمُكَافِئِ، وَلَكِنِ الْوَاصِلُ الَّذِي إِذَا قَطَعَتْ رَحِمُهُ وَصَلَهَا ‏\"‏‏.‏"
summary:
  ar: "عن عبد الله بن عمر: ليس الواصل بالمكافئ ولكن الواصل الذي إذا قطعت رحمه وصلها."
  en: "From Abdullah ibn Umar: the upholder of kinship is not the one who repays, but the one who rejoins the tie that was cut."
  ur: "عبداللہ بن عمر سے: رشتے جوڑنے والا وہ نہیں جو بدلہ دے بلکہ وہ ہے جو کاٹے ہوئے رشتے کو جوڑ دے۔"
