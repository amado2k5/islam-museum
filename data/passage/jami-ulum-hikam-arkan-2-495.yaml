text: "… مريمَ، وروحٌ منه، وأنَّ الجنَّةَ حقٌّ، وأنَّ النار حقُّ، أدخله اللّٰه مِنْ أيِّ أبوابِ الجنةِ الثمانيةِ شاءَ. فإذا كان الوضوء مع الشهادتينِ موجباً لفتح أبواب الجنَّة، صار الوضوءُ نصفَ الإيمان بالله ورسوله بهذا الاعتبار. وأيضاً فالوضوء من خِصال الإيمان الخفيَّة …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 495، يذكر حلاوة الإيمان وكماله، وخصال المؤمن، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 495, that mentions the sweetness and completeness of faith, the traits of the believer, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 495 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، مومن کی خصلتیں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
