label: { ar: "الموطأ 180 — مالك: الإقامة لا تثنى، والقيام إليها على قدر الطاقة", en: "Muwatta 180" }
summary:
  ar: "فتوى لمالك في باب ما جاء في النداء للصلاة: سُئل عن تثنية الأذان والإقامة ومتى يجب القيام على الناس حين تقام الصلاة، فقال إنه لم يبلغه في النداء والإقامة إلا ما أدرك الناس عليه؛ فأما الإقامة فلا تُثنى وذلك الذي لم يزل عليه أهل العلم بالمدينة، وأما قيام الناس حين تقام الصلاة فلم يسمع فيه بحد يُقام له، وإنما يراه على قدر طاقة الناس، فإن منهم الثقيل والخفيف ولا يستطيعون أن يكونوا كرجل واحد. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن النبي أمر بلالاً أن يشفع الأذان ويوتر الإقامة كما في حديث أنس في الصحيحين. {cite:muwatta-maruf-1997 p.118} {cite:muwatta-maruf-1997 p.119}"
