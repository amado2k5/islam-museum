label: { ar: "الموطأ 180 — مالك: الإقامة لا تثنى، والقيام إليها على قدر الطاقة", en: "Muwatta 180", es: "180 copias", fr: "180 exemplaires", ur: "180 کاپیاں", tr: "Al-Muwatta 180 — Malik: İkamet tekrar edilmez ve kişi kendi gücüne göre yerine getirmelidir.", id: "Al-Muwatta 180 — Malik: Tempat tinggal itu tidak diulang, dan seseorang harus melaksanakannya sesuai dengan kemampuannya." }
summary:
  ar: "فتوى لمالك في باب ما جاء في النداء للصلاة: سُئل عن تثنية الأذان والإقامة ومتى يجب القيام على الناس حين تقام الصلاة، فقال إنه لم يبلغه في النداء والإقامة إلا ما أدرك الناس عليه؛ فأما الإقامة فلا تُثنى وذلك الذي لم يزل عليه أهل العلم بالمدينة، وأما قيام الناس حين تقام الصلاة فلم يسمع فيه بحد يُقام له، وإنما يراه على قدر طاقة الناس، فإن منهم الثقيل والخفيف ولا يستطيعون أن يكونوا كرجل واحد. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن النبي أمر بلالاً أن يشفع الأذان ويوتر الإقامة كما في حديث أنس في الصحيحين. {cite:muwatta-maruf-1997 p.118} {cite:muwatta-maruf-1997 p.119}"
  id: "Fatwa Malik tentang seruan azan: Beliau ditanya tentang pengulangan adzan dan iqamah dua kali, dan kapan orang-orang harus berdiri ketika azan akan dimulai. Beliau menjawab bahwa beliau hanya mendengar tentang praktik adzan dan iqamah yang telah dilakukan oleh orang-orang. Adapun iqamah, tidak perlu diulang, dan ini selalu menjadi praktik para ulama Madinah. Mengenai orang-orang yang berdiri ketika azan akan dimulai, beliau belum pernah mendengar tentang waktu khusus bagi orang-orang untuk berdiri. Sebaliknya, beliau percaya bahwa itu harus sesuai dengan kemampuan masing-masing orang, karena ada yang lambat dan ada pula yang tidak mampu berdiri serentak. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik, dan bahwa Nabi memerintahkan Bilal untuk mengulang adzan dua kali dan iqamah sekali, sebagaimana dalam hadits Anas dalam dua kitab Sahih. {kutip:muwatta-maruf-1997 hal.118} {kutip:muwatta-maruf-1997 hal.119}"
