text: "… قَالَ أَنْبَأَنَا إِسْمَاعِيلُ، عَنْ حُمَيْدٍ، عَنْ أَنَسٍ، قَالَ قَدِمَ عَلَى رَسُولِ اللَّهِ أُنَاسٌ مِنْ عُرَيْنَةَ فَقَالَ لَهُمْ رَسُولُ اللَّهِ \" لَوْ خَرَجْتُمْ إِلَى ذَوْدِنَا فَكُنْتُمْ فِيهَا فَشَرِبْتُمْ مِنْ أَلْبَانِهَا وَأَبْوَالِهَا \". فَفَعَلُوا فَلَمَّا صَحُّوا قَامُوا إِلَى رَاعِي رَسُولِ اللَّهِ فَقَتَلُوهُ وَرَجَعُوا كُفَّارًا وَاسْتَاقُوا ذَوْدَ النَّبِيِّ فَأَرْسَلَ فِي طَلَبِهِمْ فَأُتِيَ بِهِمْ فَقَطَّعَ أَيْدِيَهُمْ وَأَرْجُلَهُمْ وَسَمَلَ أَعْيُنَهُمْ."
summary:
  ar: "حديث في سنن النسائي، رقم 4029، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 4029 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 4029، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
