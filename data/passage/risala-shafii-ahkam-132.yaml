text: "… بقولٍ وعملٍ، وإمساكٍ عن محارمَ تَمَا هُمُوها، وأتابهم على طاعته من فى ج من دين وهو مخالف للاصل. فى ج أو دفع عنا بها وهو مخالف للأصل. فى النسخ الثلاث المطبوعة مكروها بالنصب، وما هنا هو الذى فى أصل الربيع. …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 132، يرد فيه ذكر المحارم، والمكروه، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 132, whose wording mentions the forbidden things (maharim), the disliked (makruh), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 132 کا اقتباس جس میں محارم، مکروہ، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 132, dont le texte mentionne les interdits (maharim), le réprouvé (makruh), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 132, cuyo texto menciona lo vedado (maharim), lo reprobado (makruh), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi 132. sayfasından, yasaklar, mekruh haller ve itaat edilmesi gereken fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, görevler, itaat edilmesi gereken fiiller, tavsiye edilen fiiller, mekruh haller, yasaklar ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari risalah Al-Shafi'i, halaman 132, yang menyebutkan larangan, perbuatan yang tidak disukai, dan perbuatan ketaatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, kewajiban, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, larangan, dan dosa kecil."
