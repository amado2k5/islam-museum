text: "… وفيه مُتَلَّقٌ لمن يقول : إن غُسْلَ النَّجاسَةِ، لا يمَدُّ فى شُروطِ صحَّةِ للصَّلاة، وفيه من الفِقّهِ أيضاً تنظيمُ حُرْمة الصَّلَاةِ، وأنَّ لِلْمُصَلَّى أنْ يَتَمَأَدَى عَليهَا، وإن جَرَّ إليه ذلك القتلَ، وتفويت النفس، مع أن التعرَّضَ لَقَوَأتِ النفس، لا يَحِلُّ …"
