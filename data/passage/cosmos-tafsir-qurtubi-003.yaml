label:
  ar: "الجامع لأحكام القرآن، القرطبي — ص 409"
  en: "al-Qurtubi, al-Jami' li-Ahkam al-Qur'an — p. 409"
  fr: "al-Qurtubi, al-Jami' li-Ahkam al-Coran — p. 409"
text: "وذلك لأنَّ الأرضَ كان فيها الجنُّ قبل خَلْق آدمَ، فأفسدوا وسَفَكوا الدماءَ، فبعثَ اللّٰه إليهم إبليسَ في جندٍ من الملائكة، فقتلَهم وألحقَهم بالبحار ورؤوس الجبال"
summary:
  ar: "في تفسير سؤال الملائكة عن الخليفة يذكر القرطبي قولاً بأن الملائكة علمت ما كان من إفساد الجن وسفكهم للدماء في الأرض قبل خلق آدم، فبعث الله إليهم إبليس في جند من الملائكة فقتلهم وألحقهم بالبحار ورؤوس الجبال؛ ويعرضه بصيغة «وقيل» بين أقوال أخرى."
  en: "Explaining the angels' question about the vicegerent, al-Qurtubi gives a view that they had seen the jinn's corruption and bloodshed on earth before Adam's creation, and that God sent Iblis with a host of angels who killed them and drove the rest to the seas and mountain peaks. He presents it with 'it is said', among other explanations."
  es: "Al explicar la pregunta de los ángeles sobre el lugarteniente, al-Qurtubi opina que estos habían presenciado la corrupción y el derramamiento de sangre de los genios en la Tierra antes de la creación de Adán, y que Dios envió a Iblis con un séquito de ángeles que los aniquilaron y expulsaron al resto hacia los mares y las cumbres de las montañas. Presenta esta explicación con la frase «se dice», entre otras."
  fr: "Pour expliquer la question des anges concernant le vicaire, al-Qurtubi avance l'hypothèse qu'ils avaient été témoins de la corruption et du carnage perpétrés par les djinns sur terre avant la création d'Adam, et que Dieu envoya Iblis avec une armée d'anges qui les exterminèrent et repoussèrent les survivants vers les mers et les sommets des montagnes. Il présente cette explication par l'expression « il est dit », parmi d'autres."
