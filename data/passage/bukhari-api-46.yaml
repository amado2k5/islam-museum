label: { ar: "صحيح البخاري 46 — تعريف الإسلام بأعماله", en: "Sahih al-Bukhari 46 — Islam defined by its acts", ur: "صحیح بخاری 46 — اسلام کی تعریف اس کے اعمال سے", es: "Sahih al-Bukhari 46 — El Islam definido por sus actos" }
text: "… ثَائِرُ الرَّأْسِ، يُسْمَعُ دَوِيُّ صَوْتِهِ، وَلاَ يُفْقَهُ مَا يَقُولُ حَتَّى دَنَا، فَإِذَا هُوَ يَسْأَلُ عَنِ الإِسْلاَمِ فَقَالَ رَسُولُ اللَّهِ \" خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ وَاللَّيْلَةِ \". فَقَالَ هَلْ عَلَىَّ غَيْرُهَا قَالَ \" لاَ، إِلاَّ أَنْ تَطَوَّعَ \". قَالَ رَسُولُ اللَّهِ \" وَصِيَامُ رَمَضَانَ \". قَالَ هَلْ عَلَىَّ غَيْرُهُ قَالَ \" لاَ، إِلاَّ أَنْ تَطَوَّعَ \". …"
summary:
  ar: "حديث في صحيح البخاري، رقم 46، يذكر تعريف الإسلام بأعماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 46 (Belief), that mentions Islam defined by its acts. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 46، جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 46 (Creencia), menciona el Islam definido por sus actos. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
