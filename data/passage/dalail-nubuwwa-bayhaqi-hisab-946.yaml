text: "… - الشك من سعيد - ان قَدْ أَمْضَيْتُ فريضتي وخَفَّفْتُ عن عبادي ، وجعلت بكل حسنة عشر أمثالها . أخرجه مسلم في الصحيح٤٥ عن محمد بن المثنى ، عن محمد أبي عدي ، عن سعيد بن أبي عروبة . وأخرجه …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 946، يذكر عدد الحسنات، ومضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 946, that speaks of a stated number of good deeds, the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 946 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
