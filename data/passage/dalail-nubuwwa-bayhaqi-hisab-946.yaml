text: "… - الشك من سعيد - ان قَدْ أَمْضَيْتُ فريضتي وخَفَّفْتُ عن عبادي ، وجعلت بكل حسنة عشر أمثالها . أخرجه مسلم في الصحيح٤٥ عن محمد بن المثنى ، عن محمد أبي عدي ، عن سعيد بن أبي عروبة . وأخرجه …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 946، يذكر عدد الحسنات، ومضاعفة الحسنة؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 946, that speaks of a stated number of good deeds, the good deed multiplied; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 946 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکی کا کئی گنا ہونا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 946, que habla de un número determinado de buenas acciones, la buena acción multiplicada; de la copia extraída, citada dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, p. 946, qui parle d'un nombre déterminé de bonnes actions, la bonne action multipliée; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 946. sayfasından, iyi amellerin sayısından ve iyi amellerin çoğalmasından bahseden bir pasaj; alıntılanan versiyondan olup, kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian,” hlm. 946, yang menyebutkan jumlah amal kebaikan dan penggandaan amal kebaikan; dari versi yang diekstrak, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
