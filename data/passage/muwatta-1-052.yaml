label: { ar: "الموطأ 52 — ابن عمر يحنّط ميتاً ويحمله ثم يصلي ولا يتوضأ", en: "Muwatta 52", es: "Muwatta 52", fr: "Muwatta 52", ur: "موطا 52", tr: "El-Muvatta 52 — İbn Ömer ölü birini mumyaladı, taşıdı ve abdest almadan namaz kıldı.", id: "Al-Muwatta 52 — Ibnu Umar mengawetkan mayat, membawanya, lalu shalat tanpa berwudhu." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما لا يجب منه الوضوء: حنّط عبد الله بن عمر ابناً لسعيد بن زيد، أي طيّبه بالحنوط، وحمله ثم دخل المسجد فصلى ولم يتوضأ، دلالةً على أن مس الميت وحمله لا ينقضان الوضوء. ويفسر المحقق الحنوط بطيب الميت خاصة، ويذكر أن الأثر رواه من غير طريق مالك ابن أبي شيبة والبيهقي، ويحيل على كلام الترمذي عقب الحديث (993). {cite:muwatta-maruf-1997 p.60}"
  tr: "Malik'in Nafi'den rivayet ettiği, abdest gerektirmeyen şeyler bölümünde yer alan bir rivayette şöyle denmektedir: Abdullah ibn Umar, Sa'id ibn Zayd'ın oğlunu güzel kokuyla meshetmiş, onu taşımış, sonra camiye girip abdest almadan namaz kılmıştır. Bu da ölü bir bedene dokunmanın veya onu taşımanın abdesti bozmadığını göstermektedir. Araştırmacı, \"güzel kokuyla meshetme\"nin özellikle ölü bedeni meshetmeyi ifade ettiğini açıklamakta ve bu rivayetin İbn Abi Şeybe ve el-Beyhaki tarafından Malik'inkinden farklı isnad zincirleriyle rivayet edildiğini, Tirmizi'nin hadisi takip eden ifadesine (993) atıfta bulunarak belirtmektedir. {cite:muwatta-maruf-1997 s.60}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik berdasarkan Nafi’, dalam bab tentang hal-hal yang tidak memerlukan wudhu: Abdullah ibn Umar mewangi putra Sa’id ibn Zayd, artinya ia mengolesi jenazahnya dengan parfum, menggendongnya, kemudian masuk masjid dan shalat tanpa berwudhu, yang menunjukkan bahwa menyentuh atau menggendong jenazah tidak membatalkan wudhu. Peneliti menjelaskan bahwa “mewangi” secara khusus merujuk pada mengolesi jenazah, dan menyebutkan bahwa riwayat tersebut dinarasikan oleh Ibn Abi Shaybah dan al-Bayhaqi melalui sanad selain Malik, merujuk pada pernyataan al-Tirmidhi setelah hadits (993). {cite:muwatta-maruf-1997 p.60}"
