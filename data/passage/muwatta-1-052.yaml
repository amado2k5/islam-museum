label: { ar: "الموطأ 52 — ابن عمر يحنّط ميتاً ويحمله ثم يصلي ولا يتوضأ", en: "Muwatta 52" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب ما لا يجب منه الوضوء: حنّط عبد الله بن عمر ابناً لسعيد بن زيد، أي طيّبه بالحنوط، وحمله ثم دخل المسجد فصلى ولم يتوضأ، دلالةً على أن مس الميت وحمله لا ينقضان الوضوء. ويفسر المحقق الحنوط بطيب الميت خاصة، ويذكر أن الأثر رواه من غير طريق مالك ابن أبي شيبة والبيهقي، ويحيل على كلام الترمذي عقب الحديث (993). {cite:muwatta-maruf-1997 p.60}"
