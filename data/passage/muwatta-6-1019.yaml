label: { ar: "الموطأ 1019 — مالك سئل: المحرم يضطر إلى أكل الميتة، أيصيد الصيد فيأكله أم يأكل الميتة؟ قال: بل يأكل الميتة، لأن الله لم يرخص للمحرم في أكل الصيد ولا في أخذه على حال من الأحوال، وقد رخص في الميتة على حال الضرورة", en: "Muwatta 1019" }
summary:
  ar: "سئل مالك: المحرم يُضطر إلى أكل الميتة، أيصيد الصيد فيأكله أم يأكل الميتة؟ فقال: بل يأكل الميتة، لأن الله لم يرخص للمحرم في أكل الصيد ولا في أخذه على حال من الأحوال، وقد رخص في الميتة على حال الضرورة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1150) وسويد (578). {cite:muwatta-maruf-1997 p.477}"
