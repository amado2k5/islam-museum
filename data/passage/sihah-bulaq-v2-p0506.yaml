text: |-
  ⁦(فصل الدال)⁩
  ٨١٠-
  ثوبا خلقا وثوب أخلاق اذا كانت الحلوقة فيه كله كما قالوابرمة أعشارونوب أسمال وأرض
  سباسب والخلوق ضرب من الطيب وقد خلفته أى طليته بانلخلوق فتخلق به والخليقاء من
  الفرس كالعرنين من الانسان واخلواق المحاب أى استوى ويقال صارخا.فاللمطر
  واخلولق الرسم أى استوى بالارض ⁦( نق )⁩ الخنق يكسر النون مصدرقولك خنقه يختقه
  وكذلك خنقه ومنه اللحناق واختنق هو وانخنقت الشاة بنفسهافهى منخنقة وموضعه من
  العنق مخنق بالتشديد يقال بلغ منه المخنق وأخذت بمخنقه وكذلك الحناق بالضم يقال أخذ
  يخناقه والخناق بالسكسر حبل يختق به والمخنقة بالمكسر القلادة واندائق شعب ضيق وأهل
  ليمن يسمون الزقاق خانقا والمختنق المضيق ⁦(لخوف)⁩، الطوق الحلقة قال الراجز
  كان خوق قرطها المعقوب • على دباة أوعلى يعسوب
  والدوق بالتهريك مصدرة ولك مضازة خوفا. وبترخوقًا أى واسعة والحوق الجرب عن
  الاموى يقال بعير أخوق وناقسة خوقا أى جرباء وانخاق باقاسم الفرج لحوقها أى
  سعتها وهومبنى على الكسر مثل الخازباز
  ( صل الدال بق لديقفى يلتزق كالغراء تصادبد الطير والدبوقاء العذرة
  ومنه قول رؤية * لولاديوقاء استه لم يبطغ • ودابق اسم بلدوالاغلب عليه التذ كير والصرف
  لانه فى الاصل اسم نهرقال الراجز ٢ *بدايق وأين من دابق* وقديؤنت ولا يصرف
  ( (حق الدحيق البعيد المقصى وقدد حقه الناس أى لا يسالى به ويقال أيضا أدحقه
  اللّه وأسحه ودحقت الرحم أى رمت بالماء فلم تقبله ويقال قبح اللّٰه أمّاد حقت به أى ولدته
  والدحوق من النوق التى تخرج رجها بعد الولادة يقال اندحقت رحم الناقة أى اندلقت
  رق. الدرقة الحجفة والجمع درق والدرياقلغة فى الترياق وينشد على هذه اللغة ٣
  ريق ودرياقى شفاء السم * والدردق الاطفال يقال ولدان دردق ودرادق قال الاعشى
  يمب الجلة الجراجر كالبسشتان تحنو لد ردق أمفال
  وربما قالو الصغار الابل دردق وقال الاصمى فى كاب الفرق الدردق الصغار من كل شى قال
  والبمع الدرادق والدورق مكيال للشراب وأراه فارسيا مع زبا ⁦(درفق)⁩ المدرنفق المسرع
  فى السيريقال ادرنق مرمع_لا أى امض راشدا سق لديق بياض السراب
  وتزقرقه وقال يعط ريعان السراب الديسقا• وربماسموا الحوض الملان بذلك وقد
  ملات الحوض حتق دسق أى ساح ماؤه وقال أبو عبيد الديسق معرّب وهو بالفارسية
  لمشتخوان قال الاعشى
  و-ور كامشال الدمى ومناصف • وقدر وطباخ وصاع وديسق
  ( ⁦(عق)⁩، دعق الطريق فهومدعوق أى كثر عليه الوطه ودعقته الدواب أثرت فيه يشال
  دعقت الابل الحوض دعقا اذا خبطته -تى ثلته من جواتبه والدعقة جاعة من الابل
  وخيل مداعيق تدوس القوم فى الغارات والدعق أيضا الهيج والتنفير وقد دعقه دعقا
  ولا يقال أدعقه وأماقول لبيد
  فى جميع حافظى عوراتهم • لايهمون بأدعاف الشلل
  ٢١٣
  مصاح
  قوله لحوما أى سعتها كذا بتأنيث
  الضمير الراجع الى الفرج
  فى جميع النسخ التى بأيدينا
  وعبارة القاموس أى سجه
  بالتذكير اه مصحيه
  ٢ تسخة زيادة غيلان بن
  رباء
  ٣ نسمنة زيادة لرؤبة وأولة
  الكنت قبل الكبر الطلقيم ام
  قوله والدورقمكال الخ كذا
  فى غالب النخ وفى نخة
  والدردق مكيال ويوافقها عبارة
  القاموس والدردق الاطفال
  وصسغار الابل وغيرها ومكال
  للشراب والدورق الجرة ذات
  العروة اه كتبه المصمح
