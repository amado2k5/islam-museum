label: { ar: "الموطأ 739 — مالك: من باع أصل حائطه وفيه ثمر لم يبد صلاحه فزكاته على المبتاع، وإن كان قد طاب فعلى البائع إلا أن يشترطه", en: "Muwatta 739" }
summary:
  ar: "قول لمالك يختم به الباب: من باع أصل حائطه أو أرضه وفي ذلك زرع أو ثمر لم يبد صلاحه فزكاة ذلك على المبتاع، وإن كان قد طاب وحل بيعه فزكاة ذلك الثمر أو الزرع على البائع، إلا أن يشترطه البائع على المبتاع. ويثبت المحقق فروق النسخ. {cite:muwatta-maruf-1997 p.368}"
