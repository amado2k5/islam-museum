label: { ar: "الموطأ 739 — مالك: من باع أصل حائطه وفيه ثمر لم يبد صلاحه فزكاته على المبتاع، وإن كان قد طاب فعلى البائع إلا أن يشترطه", en: "Muwatta 739", es: "Muwatta 739", fr: "Muwatta 739", ur: "موطا 739", tr: "El-Muvatta 739 — Malik: Meyveleri henüz olgunlaşmamış haldeyken bahçesinin arazisini satan kimsenin zekâtı alıcıya aittir. Eğer meyveler olgunlaşmışsa, aksi yönde bir şart koşmadığı sürece zekât satıcıya aittir.", id: "Al-Muwatta 739 — Malik: Barang siapa menjual tanah kebunnya yang buahnya belum matang, maka zakat menjadi tanggung jawab pembeli. Jika buahnya sudah matang, maka zakat menjadi tanggung jawab penjual kecuali jika penjual menetapkan ketentuan lain." }
summary:
  ar: "قول لمالك يختم به الباب: من باع أصل حائطه أو أرضه وفي ذلك زرع أو ثمر لم يبد صلاحه فزكاة ذلك على المبتاع، وإن كان قد طاب وحل بيعه فزكاة ذلك الثمر أو الزرع على البائع، إلا أن يشترطه البائع على المبتاع. ويثبت المحقق فروق النسخ. {cite:muwatta-maruf-1997 p.368}"
  tr: "Malik bu bölümü şu ifadeyle sonlandırıyor: Eğer birisi henüz olgunlaşmamış ürün veya meyve içeren araziyi veya mülkü satarsa, bu ürün veya meyvelerin zekâtı alıcının sorumluluğundadır. Ancak, ürün veya meyve olgunlaşmış ve satışa hazır ise, satıcı aksini şart koşmadığı sürece, zekât satıcının sorumluluğundadır. Editör daha sonra el yazmalarındaki farklılıkları ortaya koyuyor. {cite:muwatta-maruf-1997 s.368}"
  id: "Malik menyimpulkan bab ini dengan pernyataan berikut: Jika seseorang menjual tanah atau properti yang berisi tanaman atau buah yang belum matang, zakat atas tanaman atau buah tersebut menjadi tanggung jawab pembeli. Namun, jika tanaman atau buah tersebut telah matang dan siap dijual, zakat atasnya menjadi tanggung jawab penjual, kecuali penjual menetapkan sebaliknya. Editor kemudian menjelaskan perbedaan dalam manuskrip-manuskrip tersebut. {cite:muwatta-maruf-1997 p.368}"
