label: { ar: "الموطأ 497 — ابن عمر لم يكن يصلي يوم الفطر قبل الصلاة ولا بعدها", en: "Muwatta 497" }
summary:
  ar: "أول أثر في باب ترك الصلاة قبل العيدين وبعدهما. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر لم يكن يصلي يوم الفطر قبل الصلاة ولا بعدها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن الترمذي (538) وغيره أخرجوه مرفوعاً من حديث أبي بكر بن حفص عن ابن عمر وقال حسن صحيح، لكن الصحيح من حديث ابن عمر الموقوف كما رواه مالك وتابعه موسى بن عقبة وأيوب وعبد الله العمري وقتادة، أما المرفوع فصحيح من حديث ابن عباس في الصحيحين. {cite:muwatta-maruf-1997 p.255}"
