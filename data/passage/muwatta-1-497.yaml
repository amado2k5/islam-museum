label: { ar: "الموطأ 497 — ابن عمر لم يكن يصلي يوم الفطر قبل الصلاة ولا بعدها", en: "Muwatta 497", es: "Muwatta 497", fr: "Muwatta 497", ur: "موطا 497", tr: "El-Muvatta 497 — İbn Ömer, Ramazan Bayramı günü namazdan önce veya sonra namaz kılmadı.", id: "Al-Muwatta 497 — Ibnu Umar tidak shalat pada hari raya Idul Fitri, baik sebelum maupun sesudah shalat." }
summary:
  ar: "أول أثر في باب ترك الصلاة قبل العيدين وبعدهما. يرويه يحيى عن مالك عن نافع أن عبد الله بن عمر لم يكن يصلي يوم الفطر قبل الصلاة ولا بعدها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن، وأن الترمذي (538) وغيره أخرجوه مرفوعاً من حديث أبي بكر بن حفص عن ابن عمر وقال حسن صحيح، لكن الصحيح من حديث ابن عمر الموقوف كما رواه مالك وتابعه موسى بن عقبة وأيوب وعبد الله العمري وقتادة، أما المرفوع فصحيح من حديث ابن عباس في الصحيحين. {cite:muwatta-maruf-1997 p.255}"
  tr: "İki bayramdan önce ve sonra namaz kılınmamasıyla ilgili ilk rivayet, Yahya'nın Malik'ten, o da Nafi'den rivayet ettiğine göre Abdullah ibn Umar'ın Ramazan Bayramı günü, bayram namazından önce veya sonra namaz kılmadığıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn Hasan tarafından rivayet edildiğini ve Tirmizi (538) ve diğerlerinin bunu Peygamber'e (merfu') dayandırılan, Ebu Bekir ibn Hafs'tan, o da İbn Umar'dan rivayet edilen bir hadis olarak kabul ettiğini ve sahih olduğunu söylediğini belirtmektedir. Ancak İbn Umar'dan sahih hadis, Malik tarafından rivayet edilen ve Musa ibn Ukba, Eyyub, Abdullah el-Umari ve Katade tarafından da takip edilen, bir Sahabe'ye (mevkuf) isnat edilen hadistir. Peygamberimize dayandırılan (merfu’) hadise gelince, bu hadis İbn Abbas’ın rivayetine göre iki Sahih’te (Buhari ve Müslim) sahihtir. {cite:muwatta-maruf-1997 s.255}"
  id: "Riwayat pertama mengenai pengabaian salat sebelum dan sesudah dua hari raya Id. Diriwayatkan oleh Yahya dari Malik dari Nafi’ bahwa Abdullah ibn Umar tidak salat pada hari raya Idul Fitri, baik sebelum maupun sesudah salat Id. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus’ab, Suwaid, dan Muhammad ibn al-Hasan, dan bahwa al-Tirmidhi (538) dan lainnya memasukkannya sebagai hadits yang ditelusuri kembali kepada Nabi (marfu’) dari Abu Bakr ibn Hafs dari Ibn Umar, dan beliau mengatakan bahwa hadits tersebut baik dan sahih. Namun, hadits sahih dari Ibn Umar adalah hadits yang dinisbahkan kepada seorang Sahabat (mawquf), sebagaimana diwariskan oleh Malik dan diikuti oleh Musa ibn Uqba, Ayyub, Abdullah al-Umari, dan Qatadah. Adapun hadits yang diriwayatkan dari Nabi (marfu’), hadits tersebut sahih menurut Ibnu Abbas dalam dua kitab Sahih (Bukhari dan Muslim). {cite:muwatta-maruf-1997 p.255}"
