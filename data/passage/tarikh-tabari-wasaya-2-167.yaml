text: "… سلمة عن ابن اسحاق عن يحيى أبن عبّاد عن أبيه قال سمعتُه يقول بلغنى ان آلم قم حين مات بعث الله اليه بكفنه وحنوطه من الجنّة ثم وليت الملائكة قبره ودَفْته حتى غيبوه، حَدثناً على بن حَرْبة قال بتا روح …"
