text: "… قاضيان في النار وإنّ التاجر... ترافق قاضٍ وتاجر في الطريق مع الشيخ، فقال القاضي للشيخ: من كثر لغطه كثر غلطه فهل غلطت يوماً وأنت تعظ؟ فقال الشيخ ببداهة : - نعم صادف مرةً أن خرج مني قاض في النار بدل …"
summary:
  ar: "سافر قاضٍ وتاجر مع جحا، فسأل القاضي هل أخطأ يوماً في وعظه، فقال جحا إنه قال مرة قاضيين في النار بدل قاضٍ في النار، وقال مرة تجاراً بدل مذنبين في جهنم، فأخجل كليهما. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  en: "A judge and a merchant travel with Juha, and the judge asks whether he ever erred while preaching. Juha says he once said 'two judges in the fire' instead of 'a judge in the fire', and once said 'merchants' instead of 'sinners' in hell, which shamed both. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  ur: "ایک قاضی اور ایک تاجر جحا کے ساتھ سفر کرتے ہیں اور قاضی پوچھتا ہے کہ کیا اس سے کبھی وعظ میں غلطی ہوئی۔ جحا کہتا ہے کہ ایک بار اس نے آگ میں ایک قاضی کی جگہ آگ میں دو قاضی کہہ دیا، اور ایک بار جہنم میں گناہ گاروں کی جگہ تاجر کہہ دیا، جس سے دونوں شرمندہ ہو گئے۔ {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  fr: "Un juge et un marchand voyagent avec Juha, et le juge demande s'il lui est déjà arrivé de se tromper en prêchant. Juha dit qu'une fois il a dit « deux juges dans le feu » au lieu d'« un juge dans le feu », et une autre fois « marchands » au lieu de « pécheurs » en enfer, ce qui a fait honte aux deux. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
  es: "Un juez y un mercader viajan con Juha, y el juez pregunta si alguna vez se equivocó al predicar. Juha dice que una vez dijo «dos jueces en el fuego» en lugar de «un juez en el fuego», y otra vez dijo «mercaderes» en lugar de «pecadores» en el infierno, lo que avergonzó a ambos. {cite:juha-nawadir-kubra-djuwaydi p. 132}"
