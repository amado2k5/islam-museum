label: { ar: "مسلم 760 — من صام رمضان إيماناً واحتساباً", en: "Muslim 760 — Whoever fasts Ramadan in faith and hope" }
text: "قال رسول الله: من صام رمضان إيماناً واحتساباً غفر له ما تقدم من ذنبه، ومن قام ليلة القدر إيماناً واحتساباً غفر له ما تقدم من ذنبه"
summary:
  ar: "رواية أبي هريرة في باب فضل قيام رمضان من كتاب صلاة المسافرين في صحيح مسلم؛ وفي لفظ أول «من قام رمضان إيماناً واحتساباً» — صيام الشهر وقيامه وليلة القدر كلها موعودة بالمغفرة."
