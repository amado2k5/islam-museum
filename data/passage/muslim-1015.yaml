label: { ar: "مسلم 1015 — إن الله طيب لا يقبل إلا طيباً", en: "Muslim 1015 — God is pure and accepts only what is pure" }
text: "قال رسول الله: «إن الله طيب لا يقبل إلا طيباً... ثم ذكر الرجل يطيل السفر أشعث أغبر يمد يديه إلى السماء يا رب يا رب، ومطعمه حرام ومشربه حرام وملبسه حرام وغذي بالحرام، فأنى يستجاب لذلك»"
summary:
  ar: "رواية أبي هريرة في باب وجوب النفقة من الطيبات من كتاب الزكاة في صحيح مسلم؛ يقبض حال المسافر الداعي المحروم في صورة لا تنسى: يمد يديه إلى السماء وكل ما فيه حرام."
