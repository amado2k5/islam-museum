text: "… نصر بن الأزد، بنى جداراً للكعبة وَهَى من سيل أتى في أيام ولاية جرهم البيتَ، فسُمي الجادر. قال هشام : وذكر الشرقي بن القطامي أن الحاج كانوا يتمسحون بالكعبة، ويأخذون من طيبها وحجارتها تبركاً بذلك ؛ وأنّ عامراً هذا كان …"
