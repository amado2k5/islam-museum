text: "… نصر بن الأزد، بنى جداراً للكعبة وَهَى من سيل أتى في أيام ولاية جرهم البيتَ، فسُمي الجادر. قال هشام : وذكر الشرقي بن القطامي أن الحاج كانوا يتمسحون بالكعبة، ويأخذون من طيبها وحجارتها تبركاً بذلك ؛ وأنّ عامراً هذا كان …"
summary:
  ar: "مقطع من أنساب الأشراف للبلاذري، المجلد المصوَّر 1، ص 54، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Baladhuri's Ansab al-Ashraf, scan volume 1, p. 54, that mentions a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "انساب الاشراف، بلاذری، اسکین جلد 1، ص 54 کا اقتباس جس میں محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ansab al-Ashraf de al-Baladhuri, volumen 1, pág. 54, que menciona una reliquia conservada tras su propietario; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre Ansab al-Ashraf d'al-Baladhuri (tome 1, p. 54) mentionnant une relique conservée après son propriétaire; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire Testaments Browser."
  tr: "El-Baladhuri'nin \"Ansab al-Ashraf\" (Soyluların Şecereleri) adlı eserinin 1. cildinin 54. sayfasında, makineyle okunabilir taranmış kopyadan alınan bir alıntıda, korunmuş bir eserden bahsedilmektedir. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Ansab al-Ashraf\" (Silsilah Para Bangsawan) karya Al-Baladhuri, Jilid 1, halaman 54, menyebutkan sebuah artefak yang terpelihara; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
