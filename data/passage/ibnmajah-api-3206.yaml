label: { ar: "سنن ابن ماجه 3206 — نقص قيراط من الأجر كل يوم", en: "Sunan Ibn Majah 3206 — a qirat lost from the reward each day", ur: "سنن ابن ماجہ 3206 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sunan Ibn Majah 3206 — una qirat perdida de la recompensa cada día", fr: "Sunan Ibn Majah 3206 — une qirat perdue pour la récompense chaque jour", tr: "Sunan İbn Majah 3206 — Her gün sevaptan bir kırat düşülür.", id: "Sunan Ibn Majah 3206 — Satu qirat dikurangi dari pahala setiap hari" }
text: "… حَدَّثَنَا خَالِدُ بْنُ مَخْلَدٍ، حَدَّثَنَا مَالِكُ بْنُ أَنَسٍ، عَنْ يَزِيدَ بْنِ خُصَيْفَةَ، عَنِ السَّائِبِ بْنِ يَزِيدَ، عَنْ سُفْيَانَ بْنِ أَبِي زُهَيْرٍ، قَالَ سَمِعْتُ النَّبِيَّ ـ يَقُولُ \" مَنِ اقْتَنَى كَلْبًا لاَ يُغْنِي عَنْهُ زَرْعًا وَلاَ ضَرْعًا نَقَصَ مِنْ عَمَلِهِ كُلَّ يَوْمٍ قِيرَاطٌ \". فَقِيلَ لَهُ أَنْتَ سَمِعْتَ مِنَ النَّبِيِّ ـ قَالَ إِي وَرَبِّ هَذَا الْمَسْجِدِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3206، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3206 (Chapters on Hunting), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3206، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3206 (Capítulos sobre la caza), habla de una qirat que se pierde de la recompensa cada día. El Libro de Registro de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3206 (Chapitres sur la chasse), mentionne une qirat (point) perdue chaque jour au titre de la récompense. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "İbn Mâce'nin Süneni'nde yer alan 3206 numaralı hadiste, her gün sevabın bir kırat (bir ağırlık birimi) azaldığından bahsedilir. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesine dahildir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3206, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
