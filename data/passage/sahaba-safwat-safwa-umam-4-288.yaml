text: "… أنظر إلى بقايا من قريش لهم أسنان متمكين بما هم عليه من أمر الجاهلية فأقتدي بهم، ويا ليت أني لم أقتد بهم فما أهلكنا إلا الاقتداء بآبائنا وكبرائنا. فلما غزا الني م مكة جعلت أفكر، فخرجت أنا وأبو سفيان نستروح …"
