text: |-
  •⁦(باب اللام)⁩.
  ٢٢٥
  وكذلك اذاحات أمه وهى ترضعه وفى الحديث لقدهممت أن أنهى عن الغيلة والغيل بالفتح
  اسم ذلك اللبن قالت أم تأبطشرا ولا أرضعته غيلا وقد أغالت المرأة ولدها فهى مغيل وأغيات
  أيضا اذاسقت ولدها الغيل فهى مغيل والاصمعى يروى بيت امرئ القيس ١
  فألهيتها عن ذى تمائم مغيل • على «ذا وأغمال فلان ولده اذا غشى أمّه وهى ترضعه والغيل
  أيضا الماء الذى يجرى على وجه الارض وفى الحديث ما-ق بالغبل ففيه العشر وماسقى
  بالدلوففيه نصف العشر والغيل أيضا الساعد الريان الممتلى. قال الراجز
  لكاعب ماثلة فى العطفين • بيضاءذات ساعدين غيلين
  وفلان قليل الغائلة والمغالة أى الشترّ الكسانى الغوائل الدواهى وأم غيلان :يجر السهر
  واسم ذى الرقة غيلان بن عقبة
  صل الفاء ف ل قال ابن السكيت الفأل أن يكون الرجل مى يضافيسمع
  آخو يقول ياسالم أو يكون ط البافيسمع آخرية ول ياواجد يقال تفاءلت بك ذا رفى الحديث
  انه عليه السلام كان يحب الفأل ويكره الطيرة والاقتتال افتعال منه قال الكميت يصف
  خيلا اذا مادت تحت الحوافق صدقت • بأيمن فأل الزاجرين افتقاله!
  والجمع أفول قال الكميت
  ولا أسأل الطير عماتقول • ولا تضالجنى الافوْل
  والفثال لعبسة للصبيان يخبوْن الشىْ فى التراب ثم يقسمونه ويقولون فى أيهماهو وأنشدأً بو
  حمر ولطرفة ٢ كاقسم الترب المفائل باليد• ( تل لعتيلة الذيالة وذبال مغتل شقد
  للمكثرة والفتيل ما يكون فى شق النواة ويقال هوما يفتل بين الاصبعين من الوميخ وفتلت
  البل وغيره ومازال فلان يفتل من فلان فى الذروة والغارب أى يدور من وراء خديغته
  وفتله عن وجهه فانفتل أى صرفه فانصرف وهو قلب لفت والفتل بالتحريك تساءد
  مابين المرفسين عن جنبى البعير يقال مرفق أفتل بين الفتل وقوم فقل الايدى قال طرفة
  لهامرفقان أفتلان كائما • تمربسلى دالج متشدد
  جل الفجل معروف والواحدة فلة والنصيلة مشية فيها استرخاء كشية الشيخ وقال
  فصرت أمشى القعولى والفنصلة • ( ل الفحل معروف والمع الفحول والفصال
  والفحالة أيضامثل الممالة وقال • فى الة تطرد عن أشوالها • والمصدر الفحلة
  بالكسر والعرب تسمى سهملا الفحل تشيهاله بفعل الابل لاعتز اله النجوم وذلك أن الفح-ل
  اذا قرع الابل اعتزلها ويسمى علقمة الشاعر الفصل لانه تزقح بأم جندب حين طلقها
  امروالقيس لما غلبته عليه فى الشعر وأحلته اذا أعطيته فخلا يضرب فى ابله وفحلت ابلى
  اذا أرسلت فيها فحلا وقال ٣
  تفعلها البيض القليلات الطبع * من كل عرّاص اذا هزاهتزع
  أى تعرقبها بالسيوف وهو مثل والفحيل فحل الابل اذا كان كريا منجبا فى ضرايه يقال غمل
  فجبل قال الراعى
  كانت نجائب منذرومحزق • أماتهن وطرقهن فيلا
  في
  فتلك حبلى قد طرقت ومر ضح
  يشق حباب المساء حيزو مهاجها
  ٣ تسخ-زيادة شطوتاات
  وهو
  مثل قدامى النسر ما مشى بضع
