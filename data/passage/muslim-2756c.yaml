label:
  ar: "مسلم 2756c — الرجل الذي أوصى بنيه: أد ما أخذت"
  en: "Muslim 2756c — The man who asked to be burnt: give back what you took"
  ur: "مسلم 2756c — وہ آدمی جس نے جلانے کی وصیت کی: جو لیا ہے واپس کرو"
text: "أسرف عبد على نفسه . بنحو حديث معمر إلى قوله فغفر الله له . ولم يذكر حديث المرأة في قصة الهرة وفي حديث الزبيدي قال فقال الله عز وجل لكل شىء أخذ منه شيئا أد ما أخذت منه ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2756c: الرجل الذي أوصى بنيه: أد ما أخذت. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2756c: The man who asked to be burnt: give back what you took. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2756c: وہ آدمی جس نے جلانے کی وصیت کی: جو لیا ہے واپس کرو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
