label: { ar: "سنن النسائي 5400 — مضاعفة الأجر", en: "Sunan al-Nasa'i 5400 — the reward doubled or multiplied", ur: "سنن نسائی 5400 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… الدَّيْرِ مِنْ دَيْرِهِ فَآمَنُوا بِهِ وَصَدَّقُوهُ فَقَالَ اللَّهُ تَبَارَكَ وَتَعَالَى {يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَآمِنُوا بِرَسُولِهِ يُؤْتِكُمْ كِفْلَيْنِ مِنْ رَحْمَتِهِ} أَجْرَيْنِ بِإِيمَانِهِمْ بِعِيسَى وَبِالتَّوْرَاةِ وَالإِنْجِيلِ وَبِإِيمَانِهِمْ بِمُحَمَّدٍ وَتَصْدِيقِهِمْ قَالَ {يَجْعَلْ لَكُمْ نُورًا تَمْشُونَ بِهِ} الْقُرْآنَ وَاتِّبَاعَهُمُ النَّبِيَّ قَالَ {لِئَلاَّ يَعْلَمَ أَهْلُ الْكِتَابِ} يَتَشَبَّهُونَ بِكُمْ {أَنْ لاَ يَقْدِرُونَ عَلَى شَىْءٍ مِنْ فَضْلِ اللَّهِ} الآيَةَ."
summary:
  ar: "حديث في سنن النسائي، رقم 5400، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 5400 (The Book of the Etiquette of Judges), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 5400، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
