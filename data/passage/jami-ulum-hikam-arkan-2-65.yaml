text: "… وليِ، ومعنا وائلُ بنُ حُجْرٍ، فأخذه عدوٌ له، فتحرَّجَ الناسُ أنْ يحلِفوا، فحلفتُ أنا إنّه أخي، فخلَّى سبيلَه، فأتينا النَّبيَّ ا، فأخبرتُهُ أنَّ القومَ تحرَّجُوا أنْ يحلفوا، وحلفتُ أنا إنَّه أخي، فقال : صدقتَ، المُسلمُ أخو المسلم أخرجه : أحمد، …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 65، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 65, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 65 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen 2, pág. 65, que menciona una descripción del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Jami' al-'Ulum wa-l-Hikam d'Ibn Rajab (tome 2, page 65) contenant une description du musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 65. sayfasından, Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 65, yang menjelaskan tentang seorang Muslim; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
