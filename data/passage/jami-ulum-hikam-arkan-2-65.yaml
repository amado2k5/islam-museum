text: "… وليِ، ومعنا وائلُ بنُ حُجْرٍ، فأخذه عدوٌ له، فتحرَّجَ الناسُ أنْ يحلِفوا، فحلفتُ أنا إنّه أخي، فخلَّى سبيلَه، فأتينا النَّبيَّ ا، فأخبرتُهُ أنَّ القومَ تحرَّجُوا أنْ يحلفوا، وحلفتُ أنا إنَّه أخي، فقال : صدقتَ، المُسلمُ أخو المسلم أخرجه : أحمد، …"
summary:
