label: { ar: "الموطأ 2227 — مالك: أما أن يستأذن ورثته في وصية لوارث في صحته فيأذنون له، فإن ذلك لا يلزمهم، ولهم أن يردوه إن شاءوا، وإنما يكون استئذانه جائزا على الورثة إذا أذنوا له حين يحجب عنه ماله. ولا يجوز له شيء إلا في ثلثه. فإن سأل بعض ورثته أن يهب له ميراثه حين تحضره الوفاة فيفعل، ثم لا يقضي فيه الهالك شيئا، فإنه رد على من وهبه، إلا أن يقول له الميت فلان ضعيف، وقد أحببت أن تهب له ميراثك، فيعطيه ذلك، فإن ذلك جائز إذا سماه الميت له", en: "Muwatta 2227", es: "Muwatta 2227", fr: "Muwatta 2227", ur: "موطا 2227", tr: "El-Muvatta 2227 — Malik: Eğer vefat etmiş kişi, sağlıklı iken mirasçılarından bir mirasçıya vasiyet bırakmak için izin isterse ve onlar da izin verirse, bu onları bağlamaz. Dilerlerse bu izni geri alabilirler. İzin talebi ancak, miras alma hakkından mahrum kaldığı bir durumda izin verilirse geçerlidir. Mirasının üçte birinden fazlasına hak kazanamaz. Eğer mirasçılarından biri, ölüm yaklaştığında mirasını kendisine vermesini isterse ve o da verirse, ancak vefat eden kişi bunu kullanmazsa, miras verene iade edilir. Ancak, vefat eden kişi ona, \"Filan kişi zayıf düştü ve mirasını ona vermeni istiyorum\" derse ve o da mirasını ona verirse, vefat eden kişi özellikle adını belirtmişse bu caizdir.", id: "Al-Muwatta 2227 — Malik: Jika seseorang yang telah meninggal, dalam keadaan sehat, meminta izin kepada ahli warisnya untuk memberikan wasiat kepada ahli waris lain, dan mereka mengabulkannya, maka hal ini tidak mengikat mereka. Mereka dapat mencabutnya jika mereka mau. Permintaan izinnya hanya sah jika mereka mengabulkannya ketika ia terhalang untuk mewarisi hartanya. Ia tidak berhak atas apa pun selain sepertiga dari hartanya. Jika salah satu ahli warisnya meminta kepadanya untuk memberikan warisannya ketika ajal mendekat, dan ia melakukannya, tetapi almarhum tidak mengurusnya, maka warisan tersebut dikembalikan kepada orang yang memberikannya. Namun, jika almarhum berkata kepadanya, \"Si fulan lemah, dan aku ingin kau memberikan warisanmu kepadanya,\" dan ia memberikannya kepadanya, maka hal ini diperbolehkan jika almarhum secara khusus menyebutkan namanya." }
summary:
  ar: "قال: فأما أن يستأذن ورثته في وصية يوصي بها لوارث في صحته، فيأذنون له، فإن ذلك لا يلزمهم، ولوارثه أن يردوا ذلك إن شاءوا. وإنما يكون استئذانه جائزا على الورثة إذا أذنوا له حين يحجب عنه ماله، ولا يجوز له شيء إلا في ثلثه، وحين هم أحق بثلثي ماله منه. فإن سأل بعض ورثته أن يهب له ميراثه حين تحضره الوفاة فيفعل، ثم لا يقضي فيه الهالك شيئا، فإنه رد على من وهبه، إلا أن يقول الميت لبعض ورثته: فلان ضعيف، وقد أحببت أن تهب له ميراثك، فأعطاه إياه، فإن ذلك جائز إذا سماه الميت له. قال: فإن وهب له ميراثه، ثم أنفذ الهالك بعضه وبقي بعض، فهو رد على الذي وهب، يرجع إليه ما بقي بعد وفاة الذي أعطيه. {cite:muwatta-maruf-1997 p.315} {cite:muwatta-maruf-1997 p.316}"
  tr: "Şöyle dedi: Eğer ölen kişi, sağlıklı iken mirasçılarından bir mirasçısına vasiyetname yapma izni isterse ve mirasçıları da bunu kabul ederse, bu izin onlar için bağlayıcı değildir ve mirasçıları isterlerse bunu reddedebilirler. İzin istemesi ancak, mirasçılarının mirasından pay alamayacak durumda olduğu ve mirasın yalnızca üçte birine hakkı olduğu, mirasçılarının ise mirasın üçte ikisine kendisinden daha fazla hak sahibi olduğu durumlarda caizdir. Eğer mirasçılarından biri ölüm yaklaşırken ondan mirasını kendisine vermesini ister ve o da bunu yaparsa ve ölen kişi bu mirastan hiçbir şey harcamazsa, miras veren kişiye iade edilir; ancak ölen kişi mirasçılarından birine, \"Filanca kişi zayıf ve ona mirasınızı vermenizi istiyorum\" der ve o da mirası ona verirse, ölen kişi onu bu şekilde adlandırmışsa bu caizdir. Şöyle dedi: Eğer bir kişi mirasını ona verirse ve ölen kişi bunun bir kısmını harcarsa ve bir kısmı kalırsa, miras verene iade edilir ve kalan kısım, miras verilen kişinin ölümünden sonra ona geri döner. {cite:muwatta-maruf-1997 s.315} {cite:muwatta-maruf-1997 s.316}"
  id: "Dia berkata: Jika seseorang yang telah meninggal meminta izin kepada ahli warisnya untuk membuat wasiat kepada seorang ahli waris selagi ia masih sehat, dan mereka mengabulkannya, maka hal ini tidak mengikat mereka, dan ahli warisnya dapat menolaknya jika mereka mau. Permintaan izin dari ahli waris hanya diperbolehkan jika mereka mengabulkannya ketika ia terhalang untuk mewarisi hartanya, dan ia tidak berhak atas apa pun kecuali sepertiga dari hartanya, dan ketika mereka lebih berhak atas dua pertiga dari hartanya daripada dirinya. Jika salah satu ahli warisnya meminta kepadanya untuk memberikan warisannya ketika kematian mendekat, dan ia melakukannya, dan kemudian almarhum tidak membelanjakan apa pun untuk itu, maka warisan itu dikembalikan kepada orang yang memberikannya, kecuali jika almarhum berkata kepada salah satu ahli warisnya: \"Si fulan lemah, dan saya ingin Anda memberikan warisan Anda kepadanya,\" dan dia memberikannya kepadanya, maka ini diperbolehkan jika almarhum menyebutkannya sebagai ahli waris. Dia berkata: Jika seseorang memberikan warisannya kepada orang yang meninggal, dan kemudian orang yang meninggal tersebut menghabiskan sebagian darinya dan menyisakan sebagian, maka warisan itu dikembalikan kepada orang yang memberikannya, dan sisanya akan kembali kepadanya setelah kematian orang yang menerima warisan tersebut. {cite:muwatta-maruf-1997 p.315} {cite:muwatta-maruf-1997 p.316}"
