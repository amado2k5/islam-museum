label: { ar: "الموطأ 2227 — مالك: أما أن يستأذن ورثته في وصية لوارث في صحته فيأذنون له، فإن ذلك لا يلزمهم، ولهم أن يردوه إن شاءوا، وإنما يكون استئذانه جائزا على الورثة إذا أذنوا له حين يحجب عنه ماله. ولا يجوز له شيء إلا في ثلثه. فإن سأل بعض ورثته أن يهب له ميراثه حين تحضره الوفاة فيفعل، ثم لا يقضي فيه الهالك شيئا، فإنه رد على من وهبه، إلا أن يقول له الميت فلان ضعيف، وقد أحببت أن تهب له ميراثك، فيعطيه ذلك، فإن ذلك جائز إذا سماه الميت له", en: "Muwatta 2227" }
summary:
  ar: "قال: فأما أن يستأذن ورثته في وصية يوصي بها لوارث في صحته، فيأذنون له، فإن ذلك لا يلزمهم، ولوارثه أن يردوا ذلك إن شاءوا. وإنما يكون استئذانه جائزا على الورثة إذا أذنوا له حين يحجب عنه ماله، ولا يجوز له شيء إلا في ثلثه، وحين هم أحق بثلثي ماله منه. فإن سأل بعض ورثته أن يهب له ميراثه حين تحضره الوفاة فيفعل، ثم لا يقضي فيه الهالك شيئا، فإنه رد على من وهبه، إلا أن يقول الميت لبعض ورثته: فلان ضعيف، وقد أحببت أن تهب له ميراثك، فأعطاه إياه، فإن ذلك جائز إذا سماه الميت له. قال: فإن وهب له ميراثه، ثم أنفذ الهالك بعضه وبقي بعض، فهو رد على الذي وهب، يرجع إليه ما بقي بعد وفاة الذي أعطيه. {cite:muwatta-maruf-1997 p.315} {cite:muwatta-maruf-1997 p.316}"
