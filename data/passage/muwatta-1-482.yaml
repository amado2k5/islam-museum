label: { ar: "الموطأ 482 — الأخوان اللذان مات أحدهما قبل الآخر: مثل الصلاة كمثل نهر غمر عذب", en: "Muwatta 482" }
text: "إنما مثل الصلاة كمثل نهر غمر عذب بباب أحدكم، يقتحم فيه كل يوم خمس مرات، فما ترون ذلك يبقي من درنه؟"
summary:
  ar: "بلاغ يرويه مالك عن عامر بن سعد بن أبي وقاص عن أبيه، في باب جامع الصلاة: كان رجلان أخوان فمات أحدهما قبل صاحبه بأربعين ليلة، فذُكرت فضيلة الأول عند النبي، فسأل ألم يكن الآخر مسلماً، قالوا بلى وكان لا بأس به، فقال وما يدريكم ما بلغت به صلاته، وضرب للصلاة مثل نهر غمر عذب بباب أحدهم يقتحم فيه كل يوم خمس مرات فلا يبقي من درنه شيئاً. وينقل المحقق عن ابن عبد البر أن قصة الأخوين لا تُحفظ من حديث سعد إلا في مرسل مالك هذا، وأن البزار أنكره وما كان ينبغي له لأن مراسيل مالك أصولها صحاح، وأن ابن وهب رواه عن مخرمة بن بكير عن أبيه عن عامر بن سعد عن أبيه مثله، وأن القصة تُحفظ من حديث طلحة بن عبيد الله وأبي هريرة وعبيد بن خالد (التمهيد 24/220–221). ويذكر أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.247} {cite:muwatta-maruf-1997 p.248}"
