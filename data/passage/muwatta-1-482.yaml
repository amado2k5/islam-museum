label: { ar: "الموطأ 482 — الأخوان اللذان مات أحدهما قبل الآخر: مثل الصلاة كمثل نهر غمر عذب", en: "Muwatta 482", es: "Muwatta 482", fr: "Muwatta 482", ur: "موطا 482", tr: "Al-Muwatta 482 — İki kardeş, biri diğerinden önce vefat etti: Namazın örneği, akan, tatlı bir nehir gibidir.", id: "Al-Muwatta 482 — Dua bersaudara, salah satunya meninggal sebelum yang lain: Perumpamaan salat itu seperti sungai yang mengalir jernih dan manis." }
text: "إنما مثل الصلاة كمثل نهر غمر عذب بباب أحدكم، يقتحم فيه كل يوم خمس مرات، فما ترون ذلك يبقي من درنه؟"
summary:
  ar: "بلاغ يرويه مالك عن عامر بن سعد بن أبي وقاص عن أبيه، في باب جامع الصلاة: كان رجلان أخوان فمات أحدهما قبل صاحبه بأربعين ليلة، فذُكرت فضيلة الأول عند النبي، فسأل ألم يكن الآخر مسلماً، قالوا بلى وكان لا بأس به، فقال وما يدريكم ما بلغت به صلاته، وضرب للصلاة مثل نهر غمر عذب بباب أحدهم يقتحم فيه كل يوم خمس مرات فلا يبقي من درنه شيئاً. وينقل المحقق عن ابن عبد البر أن قصة الأخوين لا تُحفظ من حديث سعد إلا في مرسل مالك هذا، وأن البزار أنكره وما كان ينبغي له لأن مراسيل مالك أصولها صحاح، وأن ابن وهب رواه عن مخرمة بن بكير عن أبيه عن عامر بن سعد عن أبيه مثله، وأن القصة تُحفظ من حديث طلحة بن عبيد الله وأبي هريرة وعبيد بن خالد ⁦(التمهيد 24/220–221)⁩. ويذكر أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.247} {cite:muwatta-maruf-1997 p.248}"
  tr: "Malik'in, babasından rivayetle, Emir ibn Sa'd ibn Abi Vakkas'tan naklettiği, tam namaz bölümünde yer alan bir hadis şöyledir: İki kardeş vardı ve biri diğerinden kırk gece önce vefat etti. Birincisinin fazileti Peygamber'e anlatıldı, bunun üzerine Peygamber, \"Diğeri Müslüman değil miydi?\" diye sordu. Onlar, \"Evet, ve iyi bir ahlaka sahipti\" dediler. Peygamber, \"Namazının ne kadar etkili olduğunu nereden biliyorsunuz?\" diye sordu. Bunun üzerine Peygamber, namazı, birinin kapısının önünde akan, tatlı bir nehir gibi örnek verdi; bu nehre günde beş defa girer ve hiçbir kir izi bırakmazdı. Araştırmacı, İbn Abdülberr'in, iki kardeşin hikayesinin sadece Malik'in bu mursal hadisinde korunduğunu ve el-Bazzar'ın bunu reddettiğini, bunun ise uygun olmadığını, çünkü Malik'in mursal hadislerinin sağlam rivayet zincirlerine dayandığını söylediğini aktarıyor. İbn Vahb, aynı şekilde, Makhrama ibn Bukayr'dan, o da babasından, o da Emir ibn Sa'd'dan, o da babasından rivayet etmiştir. Hikaye ayrıca Talha ibn Ubeyd Allah, Ebu Hurayra ve Ubeyd ibn Halid hadislerinde de korunmuştur (el-Tamhid 24/220-221). Ebu Musab ve Suveyd'in de Malik'ten rivayet ettiği belirtilmiştir. {cite:muwatta-maruf-1997 s.247} {cite:muwatta-maruf-1997 s.248}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas 'Amir ibn Sa'd ibn Abi Waqqas, atas otoritas ayahnya, dalam surah tentang shalat yang sempurna: Ada dua bersaudara, dan salah seorang dari mereka meninggal empat puluh malam sebelum yang lain. Keutamaan yang pertama disebutkan kepada Nabi, lalu beliau bertanya, \"Bukankah yang lain juga seorang Muslim?\" Mereka menjawab, \"Ya, dan dia memiliki akhlak yang baik.\" Beliau bertanya, \"Bagaimana kalian tahu apa yang dicapai oleh shalatnya?\" Kemudian beliau memberikan contoh shalat sebagai sungai yang mengalir dan jernih di depan pintu salah seorang dari mereka, yang akan ia masuki lima kali sehari tanpa meninggalkan jejak kotoran. Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa kisah dua bersaudara itu hanya terpelihara dalam hadits mursal Malik ini, dan bahwa al-Bazzar menolaknya, yang tidak tepat karena hadits mursal Malik didasarkan pada sanad yang sahih. Ibn Wahb meriwayatkannya dari Makhrama ibn Bukayr, dari ayahnya, dari Amir ibn Sa'd, dari ayahnya, dengan cara yang sama. Kisah ini juga terpelihara dalam hadits Talha ibn 'Ubayd Allah, Abu Hurayra, dan 'Ubayd ibn Khalid (al-Tamhid 24/220-221). Disebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.247} {cite:muwatta-maruf-1997 p.248}"
