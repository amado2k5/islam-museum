text: "… وجدتُ نعلاً فبقي ثلاثة نعال والحمار كان الشيخ سائراً في الطريق ففكّرَ في حمار يقتنيه بدل حماره المفقود. فلقي حدوة حمارٍ مُلقاة على الطريق، فأخذها ووضعها في عبِّه، وقال في نفسه : وجدت نعلاً فبقي ثلاثة نعال، والحمار، واللّه كريم. …"
summary:
  ar: "وجد جحا نعل فرس في الطريق وقال إنه وجد نعلاً واحدة فبقيت ثلاث نعال والحمار له، والله كريم. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  en: "Juha finds a horseshoe on the road and says he found one shoe, so three remain and the donkey is his, God is generous. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  ur: "جحا کو راستے میں ایک نعل ملی تو اس نے کہا کہ ایک نعل مل گئی، اب تین نعلیں اور گدھا بھی اسی کا ہے، اللہ کریم ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  fr: "Juha trouve un fer à cheval sur la route et dit qu'il a trouvé un fer, qu'il en reste donc trois et que l'âne est à lui, Dieu est généreux. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  es: "Juha encuentra una herradura en el camino y dice que ha encontrado una, así que quedan tres y el burro es suyo, Dios es generoso. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  tr: "Juha yolda bir at tırnağı buldu ve bir tane bulduğunu söyledi; böylece geriye üç toynak kaldı ve eşek de onun oldu, Tanrı cömerttir. {cite:juha-nawadir-kubra-djuwaydi s. 184}"
  id: "Juha menemukan kuku kuda di jalan dan berkata bahwa dia telah menemukan satu, jadi tersisa tiga kuku, dan keledai itu menjadi miliknya, dan Tuhan Maha Pemurah. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
