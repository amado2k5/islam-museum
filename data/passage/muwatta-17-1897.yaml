label: { ar: "الموطأ 1897 — مالك: من باع طعاما جزافا ولم يستثن منه شيئا، ثم بدا له أن يشتري منه شيئا، فلا يصلح إلا ما كان يجوز له أن يستثنيه، وهو الثلث فما دونه", en: "Muwatta 1897" }
summary:
  ar: "قال مالك: ومن باع طعاما جزافا، ولم يستثن منه شيئا، ثم بدا له أن يشتري منه شيئا، فإنه لا يصلح له أن يشتري منه شيئا، إلا ما كان يجوز له أن يستثني منه، وذلك الثلث فما دونه. فإن زاد على الثلث صار ذلك إلى المزابنة وإلى ما يكره. فلا ينبغي له أن يشتري منه شيئا، إلا ما كان يجوز له أن يستثني منه. ولا يجوز له أن يستثني منه إلا الثلث فما دونه، وهذا الأمر الذي لا اختلاف فيه عندنا. {cite:muwatta-maruf-1997 p.179}"
