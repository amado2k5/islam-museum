label: { ar: "الموطأ 1897 — مالك: من باع طعاما جزافا ولم يستثن منه شيئا، ثم بدا له أن يشتري منه شيئا، فلا يصلح إلا ما كان يجوز له أن يستثنيه، وهو الثلث فما دونه", en: "Muwatta 1897", es: "Muwatta 1897", fr: "Muwatta 1897", ur: "موطا 1897", tr: "El-Muvatta 1897 — Malik: Bir kimse, herhangi bir istisna belirtmeden toplu halde yiyecek satarsa ve sonra bunun bir kısmını satın almaya karar verirse, ancak istisna etmesine izin verilen miktar, yani üçte bir veya daha azı, caizdir.", id: "Al-Muwatta 1897 — Malik: Jika seseorang menjual makanan dalam jumlah besar tanpa menentukan pengecualian apa pun, dan kemudian memutuskan untuk membeli sebagian darinya, maka hanya bagian yang diizinkan untuk dikecualikan yang diperbolehkan, yaitu sepertiga atau kurang." }
summary:
  ar: "قال مالك: ومن باع طعاما جزافا، ولم يستثن منه شيئا، ثم بدا له أن يشتري منه شيئا، فإنه لا يصلح له أن يشتري منه شيئا، إلا ما كان يجوز له أن يستثني منه، وذلك الثلث فما دونه. فإن زاد على الثلث صار ذلك إلى المزابنة وإلى ما يكره. فلا ينبغي له أن يشتري منه شيئا، إلا ما كان يجوز له أن يستثني منه. ولا يجوز له أن يستثني منه إلا الثلث فما دونه، وهذا الأمر الذي لا اختلاف فيه عندنا. {cite:muwatta-maruf-1997 p.179}"
  tr: "Malik şöyle dedi: Bir kimse, hiçbir istisna belirtmeksizin, toptan yiyecek satarsa ve sonra ondan bir şey almaya karar verirse, istisna belirtmeye izin verilen miktardan, yani üçte birinden azından başka bir şey alması caiz değildir. Üçte birinden fazla olursa, olgunlaşmamış hurma ve hoş karşılanmayan bir şey olur. Bu nedenle, istisna belirtmeye izin verilen miktardan başka bir şey almamalıdır. Ve istisna belirtmeye izin verilen miktar da üçte birinden azdır. Bu konuda aramızda hiçbir ihtilaf yoktur. {cite:muwatta-maruf-1997 s.179}"
  id: "Malik berkata: Jika seseorang menjual makanan dalam jumlah besar, tanpa menentukan pengecualian apa pun, dan kemudian memutuskan untuk membeli sesuatu darinya, tidak diperbolehkan baginya untuk membeli apa pun kecuali apa yang diizinkan untuk ditentukannya, yaitu sepertiga atau kurang. Jika melebihi sepertiga, maka itu menjadi kasus kurma mentah dan sesuatu yang tidak disukai. Oleh karena itu, dia tidak boleh membeli apa pun darinya kecuali apa yang diizinkan untuk ditentukannya. Dan dia tidak diperbolehkan menentukan apa pun kecuali sepertiga atau kurang. Ini adalah masalah yang tidak ada perbedaan pendapat di antara kita. {cite:muwatta-maruf-1997 p.179}"
