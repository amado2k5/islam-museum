label: { ar: "سنن ابن ماجه 4128 — الأب والأبوة", en: "Sunan Ibn Majah 4128 — the father and fatherhood", ur: "سنن ابن ماجہ 4128 — باپ اور والدیت", es: "Sunan Ibn Majah 4128 — El padre y la paternidad" }
text: "حَدَّثَنَا يَحْيَى بْنُ حَكِيمٍ، حَدَّثَنَا أَبُو دَاوُدَ، حَدَّثَنَا قَيْسُ بْنُ الرَّبِيعِ، عَنِ الْمِقْدَامِ بْنِ شُرَيْحٍ، عَنْ أَبِيهِ، عَنْ سَعْدٍ، قَالَ نَزَلَتْ هَذِهِ الآيَةُ فِينَا سِتَّةٍ فِيَّ وَفِي ابْنِ مَسْعُودٍ وَصُهَيْبٍ وَعَمَّارٍ وَالْمِقْدَادِ وَبِلاَلٍ. قَالَ قَالَتْ قُرَيْشٌ لِرَسُولِ اللَّهِ ـ إِنَّا لاَ نَرْضَى أَنْ نَكُونَ أَتْبَاعًا لَهُمْ فَاطْرُدْهُمْ عَنْكَ. قَالَ فَدَخَلَ قَلْبَ رَسُولِ اللَّهِ ـ مِنْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4128، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4128 (Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4128، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 4128 (Zuhd), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
