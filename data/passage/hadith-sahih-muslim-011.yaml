text: "ء رجل من اليهود إلى عمر رحاله، فقال : يا أمير المؤمنين آية في كتابكم تقرءونها لو علينا نزلت معشر اليهود لا تخذنا ذلك اليوم عيدا ، قال : وأي آية؟ قال : (اليوم أكملت لكم دينكم وأتممت عليكم نعمتي"
