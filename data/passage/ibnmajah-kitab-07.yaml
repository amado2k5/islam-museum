summary:
  ar: "القسم 7 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصيام»، ويضم فيها النصوص من 1638 إلى 1782 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 7 of Sunan Ibn Majah (Fasting) in the division of the open hadith dataset the museum took its reports from: reports 1638 to 1782 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 7، عنوان «کتاب الصیام»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1638 تا 1782۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 7 de Sunan Ibn Majah (El ayuno) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1638 al 1782, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses archives du recueil de hadiths Sunan Ibn Majah (Le jeûne), dans sa partie ouverte (de 1638 à 1782). Il conserve ces hadiths dans ce livre; les éditions imprimées les classent et les numérotent différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan İbn Majah'ın 7. bölümü \"Oruç Kitabı\" başlığını taşımakta olup, 1638'den 1782'ye kadar olan metinleri buna göre numaralandırarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 7 dari Sunan Ibn Majah, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Puasa\" dan berisi teks-teks dari tahun 1638 hingga 1782, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
