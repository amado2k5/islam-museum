text: "لك ليكلمه بشء فقبض على فيه . فقال [الملك] تنح قدما بالدواة وكتب له كتابا وختمه وقال اذهب بهذا إلى فلان وكانت جائزته مائة ألف ، فلما أن خرج استقبله الساعى فقال أى شء هذا قال قسد دفعه إلى الملك"
