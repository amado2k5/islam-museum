ref: "2018"
label: { ar: "سنن ابن ماجه 2018 — الحلال", en: "Sunan Ibn Majah 2018 — the lawful", ur: "سنن ابن ماجہ 2018 — حلال", es: "Sunan Ibn Majah 2018 — lo lícito", fr: "Sunan Ibn Majah 2018 — le licite", tr: "Sünen İbn Majah 2018 — Helal", id: "Sunan Ibnu Majah 2018 — Halal" }
text: "حَدَّثَنَا كَثِيرُ بْنُ عُبَيْدٍ الْحِمْصِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ خَالِدٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ الْوَلِيدِ الْوَصَّافِيِّ، عَنْ مُحَارِبِ بْنِ دِثَارٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" أَبْغَضُ الْحَلاَلِ إِلَى اللَّهِ الطَّلاَقُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2018، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 2018 (The Chapters on Divorce), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2018، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2018 (Los capítulos sobre el divorcio), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 2018 (chapitres sur le divorce), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Majah Sünen'inde (2018 numaralı hadis) helal olan şeylerden bahsedilir. Helal ve Haram tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2018, menyebutkan apa yang diperbolehkan (halal). Peramban Halal dan Haram menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
