label: { ar: "سنن النسائي 1994 — قيراط الأجر", en: "Sunan al-Nasa'i 1994 — the qirat of reward", ur: "سنن نسائی 1994 — اجر کا قیراط", es: "Sunan al-Nasa'i 1994 — el qirat de la recompensa", fr: "Sunan al-Nasa'i 1994 — la qirat de la récompense", tr: "Sünen an-Nesa'i 1994 - Kırat el-Ecr", id: "Sunan an-Nasa'i 1994 — Qirat al-Ajr" }
text: "أَخْبَرَنَا نُوحُ بْنُ حَبِيبٍ، قَالَ أَنْبَأَنَا عَبْدُ الرَّزَّاقِ، قَالَ أَنْبَأَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ صَلَّى عَلَى جَنَازَةٍ فَلَهُ قِيرَاطٌ وَمَنِ انْتَظَرَهَا حَتَّى تُوضَعَ فِي اللَّحْدِ فَلَهُ قِيرَاطَانِ وَالْقِيرَاطَانِ مِثْلُ الْجَبَلَيْنِ الْعَظِيمَيْنِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1994، يذكر قيراط الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 1994 (The Book of Funerals), that speaks of the qirat of reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 1994، جس میں اجر کا قیراط کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Sunan al-Nasa'i, n.° 1994 (El Libro de los Funerales), habla del qirat de recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un rapport du Sunan al-Nasa'i, n° 1994 (Le Livre des Funérailles), évoque le calcul de la récompense. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sunan-ı Nesai'de (1994 numaralı hadis) sevabın kıratından bahsedilir. Bu, iyi ve kötü ameller listesiyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, no. 1994, menyebutkan qirat pahala. Qirat ini dikelompokkan bersama daftar amal baik dan amal buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
