text: |-
  ⁦(ضل اليا)⁩
  ٢١٣
  فتنقص من ائمه وابتردت أى اغتلت بالماء البارد وكذلك اذا شرته لتبردبه
  كبدك قال الراجز
  لطالماحلا تماه الارد • فخااها والسحال تترد * من حرّأيام ومن ليل ومد
  وهذا الشئء بردة لليدن قال الاصمحى قلت لاءرابى ما يحملكم على نومة الضى قال اما
  مبردة فى الصيف مسضفة فى الشستاء وبردت الحديد بالمبرد والبرادة ماسقط منه وبرد الرجل
  عمنه بالبرود لها به و يقال مايرد لك على فلان وكد لكماذاب لكّ عليه أى ماثبت ووجب
  ويردلى عليه كذامن الممال ولى عليه ألفيارد وسموم بارد أى ثابت لا يزول وأنشدأيو عبيدة
  اليوم يوم باردسمومه * من جزع اليوم فلائلو.ه
  وبردأى مات وقول الشاعر بالمرهفات البوارد يعنى السيوف وهى القواتل والبردان
  العصران وكذلك الابردان وهما الغداة والعشىّ ويقال ظلاهما وقال الشماخ
  اذا لارطى توسد أبرديه * خد ودجوازئ بالرمل عين
  والبرد النوم ومنه قوله تعالى لايذ وقون فيها بردا ولاشرابا قال الناءر العرجى
  وان شئت حرمت النساءسواكم • وان شئت لم أطعم نقاخا ولا بردا
  والبردة بالتصريك التخمة وفى الحديث أصك كل داء البردة والأبردة بالكسر علة معروفة
  من غلبة البرد والرطوية تنتر عن الجماع ويقول الرجل من العرب انه الباردة اليوم فيقول
  لهالا خرليست بياردة اغماهى إبردة اثرى والبردحب الغمام تقول منه بردت الارض بااضم
  وبردبنو فلان وسحاب بردو أبرد أى ذوبردوسحابة بردة وقال كانهم المعزاء من وقع أبردا
  والايبرداقب شاعر من بى يربوع وقول الساجع وصليا نابردا أى ذوبرودة والبرود البارد
  وقال الشاعر برود الثنايا واضح الشغر أشنب والبرودأ يضا كل مابردت به شينًا فحوبرود
  العين وهو كل وتول هولبردة يعمينى اذا كان لك معلوماوذكرأ بوعبيد فى باب نوادر الفسعل
  هى لك بردة نفسها أى خالصا والبرد من الثياب والمع برود وابرادوأ ماقول يزيدين مة رغ
  الجيرى
  وشريت برد اليتى • من بعديرد كنت هامه
  فهواسم عبدوشريت أى بعت وبردالجندب جفاحاه قال ذوارمة
  كأن رجليه رحلامقطف عجل * اذا تجاوب من برديه ترئيم
  والبردة كساء أسود مر بع فيه مورتلدده الاعراب وفى -ديث ابن عمررضى اللّٰه
  عنه بردة فاون والجمع برد والثور الابرد فيه لع بياض وسواد والبردى بالضم ضرب من أجود
  التمر والبردى بالفتح نبسات.عروف وقال الشاعر الاعشى
  كبردية الغيل وسط الغريف ,، ساق الرصاف اليه غسذيرا
  والبريد المرتب يقال حل فلان لى البريد وقال امر والقيس
  على كل مصوص الذنابى.عاود * بريد السرى بالليل من خيل بربرا
  والبريد أيضا اثنا عشبر ميلا قال مزرت ديمدح عرابة الاوسى
  فدتك عراب اليوم أمى وخالتى * وناقتى الناجى اليك بريدها
  أى سيرها فى البريد وصاحب البريدقد أبرد الى الاميرفه ومبرد والرسول بريد ويقال للترائق
  ٥٤
  صاح
  عبارة المختارقات قال الازهرى
  قبل لداية البريدبر يدلسيره ف
  البريدو قال غسيره البريد البغلة.
  المرتبة فى الرباط تعريب بريده
  دم ثم مى بد الرسول الحمول
  عليه تمسميت بم المسافة انتهت
