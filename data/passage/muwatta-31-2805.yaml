label: { ar: "الموطأ 2805 — أبو هريرة: السفر قطعة من العذاب فليعجل أحدكم إلى أهله", en: "Muwatta 2805", es: "Muwatta 2805", fr: "Muwatta 2805", ur: "موطا 2805", tr: "El-Muvatta 2805 — Ebu Hurayra: Yolculuk bir tür zorluktur, bu yüzden sizden biri aceleyle ailesinin yanına dönsün.", id: "Al-Muwatta 2805 — Abu Hurairah: Perjalanan adalah suatu bentuk kesulitan, maka hendaklah salah seorang di antara kalian segera kembali kepada keluarganya." }
summary:
  ar: "يروي مالك عن سمي مولى أبي بكر، عن أبي صالح، عن أبي هريرة أن رسول الله قال: السفر قطعة من العذاب، يمنع أحدكم نومه وطعامه وشرابه، فإذا قضى أحدكم نهمته من سفره فليعجل إلى أهله. {cite:muwatta-maruf-1997 p.576}"
  tr: "Malik, Ebu Bekir'in azatlı kölesi Sümey'den, o da Ebu Salih'ten, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu naklediyor: \"Yolculuk, insanı uyumaktan, yemekten ve içmekten mahrum eden bir zorluktur. Bu yüzden sizden biri yolculuktaki amacını yerine getirdiğinde, hemen ailesinin yanına dönsün.\" {cite:muwatta-maruf-1997 s.576}"
  id: "Malik meriwayatkan dari Sumayy, budak yang dibebaskan oleh Abu Bakr, dari Abu Salih, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Perjalanan adalah suatu bentuk kesulitan, yang menghalangi seseorang untuk tidur, makan, dan minum. Maka apabila salah seorang dari kalian telah menyelesaikan tujuan perjalanannya, hendaklah ia segera kembali kepada keluarganya.\" {cite:muwatta-maruf-1997 p.576}"
