summary:
  ar: "يروي مالك عن سمي مولى أبي بكر، عن أبي صالح، عن أبي هريرة أن رسول الله قال: السفر قطعة من العذاب، يمنع أحدكم نومه وطعامه وشرابه، فإذا قضى أحدكم نهمته من سفره فليعجل إلى أهله. {cite:muwatta-maruf-1997 p.576}"
