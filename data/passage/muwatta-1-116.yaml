label: { ar: "الموطأ 116 — زيد بن ثابت: أبي بن كعب رجع عن قوله قبل أن يموت", en: "Muwatta 116" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عبد الله بن كعب مولى عثمان بن عفان، في باب واجب الغسل إذا التقى الختانان: سأل محمود بن لبيد الأنصاري زيد بن ثابت عن الرجل يصيب أهله ثم يكسل ولا ينزل، فقال زيد: يغتسل. فقال محمود إن أبي بن كعب كان لا يرى الغسل، فأخبره زيد أن أبياً رجع عن ذلك قبل أن يموت. ويفسر المحقق «نزع» بكفّ وأقلع ورجع، ويذكر أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.91} {cite:muwatta-maruf-1997 p.92}"
