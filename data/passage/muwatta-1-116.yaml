label: { ar: "الموطأ 116 — زيد بن ثابت: أبي بن كعب رجع عن قوله قبل أن يموت", en: "Muwatta 116", es: "Muwatta 116", fr: "Muwatta 116", ur: "موطا 116", tr: "El-Muvatta 116 — Zeyd ibn Sabit: Ubeyy ibn Ka'b, ölümünden önce sözünden döndü.", id: "Al-Muwatta 116 — Zayd ibn Thabit: Ubayy ibn Ka'b mencabut pernyataannya sebelum meninggal" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عبد الله بن كعب مولى عثمان بن عفان، في باب واجب الغسل إذا التقى الختانان: سأل محمود بن لبيد الأنصاري زيد بن ثابت عن الرجل يصيب أهله ثم يكسل ولا ينزل، فقال زيد: يغتسل. فقال محمود إن أبي بن كعب كان لا يرى الغسل، فأخبره زيد أن أبياً رجع عن ذلك قبل أن يموت. ويفسر المحقق «نزع» بكفّ وأقلع ورجع، ويذكر أنه رواه عن مالك أبو مصعب وابن وهب عند الطحاوي ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.91} {cite:muwatta-maruf-1997 p.92}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Osman ibn Affan'ın azatlı kölesi Abdullah ibn Ka'b'dan rivayet ederek, sünnetli iki organın birleştiğinde nazil olma zorunluluğu bölümünde şöyle anlatmıştır: Mahmud ibn Labid el-Ensari, Zeyd ibn Sabit'e karısıyla cinsel ilişkiye giren, ancak daha sonra halsizleşip boşalmayan bir adam hakkında sordu. Zeyd, \"Nazil olmalı\" dedi. Mahmud, Ubeyy ibn Ka'b'ın nazil olmayı gerekli görmediğini söyledi. Bunun üzerine Zeyd, Ubeyy'in ölümünden önce fikrini değiştirdiğini bildirdi. Araştırmacı, \"naza'a\" kelimesinin durmak, vazgeçmek ve geri dönmek anlamına geldiğini açıklıyor ve bunun, el-Tahavi'nin derlemesinde Ebu Musab ve İbn Vahb tarafından, el-Beyhakî'nin derlemesinde ise Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından Malik'ten rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.91} {cite:muwatta-maruf-1997 s.92}"
  id: "Malik meriwayatkan hadits ini dari Yahya ibn Sa'id, yang juga dari Abdullah ibn Ka'b, budak yang dibebaskan oleh Uthman ibn Affan, dalam bab tentang kewajiban mandi ritual ketika kedua bagian yang disunat bertemu: Mahmud ibn Labid al-Ansari bertanya kepada Zayd ibn Thabit tentang seorang pria yang berhubungan intim dengan istrinya tetapi kemudian menjadi lesu dan tidak berejakulasi. Zayd berkata: Dia harus melakukan mandi ritual. Mahmud berkata bahwa Ubayy ibn Ka'b tidak menganggap mandi ritual itu perlu, maka Zayd memberitahunya bahwa Ubayy telah mengubah pendapatnya sebelum meninggal. Peneliti menjelaskan \"naza'a\" sebagai berhenti, menahan diri, dan kembali, dan menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Ibn Wahb dalam kumpulan al-Tahawi, dan oleh Muhammad ibn al-Hasan dan Yahya ibn Bukayr dalam kumpulan al-Bayhaqi. {kutip:muwatta-maruf-1997 hal.91} {kutip:muwatta-maruf-1997 hal.92}"
