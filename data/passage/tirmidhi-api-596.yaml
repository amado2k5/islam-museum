label: { ar: "جامع الترمذي 596 — الأب والأبوة", en: "Jami' al-Tirmidhi 596 — the father and fatherhood", ur: "جامع ترمذی 596 — باپ اور والدیت", es: "Jami' al-Tirmidhi 596 — El padre y la paternidad" }
text: "حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ أَمَرَ فَذَكَرَ نَحْوَهُ. قَالَ سُفْيَانُ قَوْلُهُ \" بِبِنَاءِ الْمَسَاجِدِ فِي الدُّورِ \". يَعْنِي الْقَبَائِلَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 596، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 596 (The Book on Traveling), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 596، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 596 (El Libro de los Viajes), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
