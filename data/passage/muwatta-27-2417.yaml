label: { ar: "الموطأ 2417 — ربيعة: الزبير يشفع لسارق يبلغ به السلطان فيلعن الشافع والمشفع", en: "Muwatta 2417" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن الزبير بن العوام لقي رجلا قد أخذ سارقا وهو يريد أن يذهب به إلى السلطان، فشفع له الزبير ليرسله. فقال الرجل: لا، حتى أبلغ به السلطان. فقال الزبير: إذا بلغت به السلطان فلعن الله الشافع والمشفع. {cite:muwatta-maruf-1997 p.398}"
