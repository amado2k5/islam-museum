label: { ar: "الموطأ 2417 — ربيعة: الزبير يشفع لسارق يبلغ به السلطان فيلعن الشافع والمشفع", en: "Muwatta 2417", es: "Muwatta 2417", fr: "Muwatta 2417", ur: "موطا 2417", tr: "El-Muvatta 2417 — Rabi’ah: El-Zübeyr bir hırsız için şefaat eder ve Sultan bunu bildirir; bunun üzerine şefaat edeni ve şefaat edileni lanetler.", id: "Al-Muwatta 2417 — Rabi’ah: Al-Zubayr memberi syafaat untuk seorang pencuri, dan Sultan melaporkannya, lalu Sultan mengutuk pemberi syafaat dan orang yang disyafaat." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن الزبير بن العوام لقي رجلا قد أخذ سارقا وهو يريد أن يذهب به إلى السلطان، فشفع له الزبير ليرسله. فقال الرجل: لا، حتى أبلغ به السلطان. فقال الزبير: إذا بلغت به السلطان فلعن الله الشافع والمشفع. {cite:muwatta-maruf-1997 p.398}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle, el-Zubayr ibn al-Awwam'ın bir hırsızı yakalayıp sultana götürmek üzere olan bir adamla karşılaştığını anlatır. El-Zubayr, hırsızın serbest bırakılması için onun adına şefaat etti. Adam, \"Hayır, onu sultana götürmeden bırakmayacağım\" dedi. El-Zubayr, \"Eğer onu sultana götürürsen, şefaat edene de şefaat edilene de Allah lanet etsin\" dedi. {cite:muwatta-maruf-1997 s.398}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa al-Zubayr ibn al-Awwam bertemu dengan seorang pria yang telah menangkap seorang pencuri dan hendak membawanya kepada sultan. Al-Zubayr memohonkan syafaat untuk membebaskannya. Pria itu berkata, \"Tidak, aku tidak akan melepaskannya sampai aku membawanya kepada sultan.\" Al-Zubayr berkata, \"Jika kau membawanya kepada sultan, semoga Allah melaknat orang yang memohonkan syafaat dan orang yang dimohonkan syafaat.\" {cite:muwatta-maruf-1997 p.398}"
