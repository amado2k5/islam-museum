text: "… لقالة السوء، وهذا من الغيرة التي يحبها اللّٰه. روي البخاري عن أبي هريرة أن رسول اللّٰه متاع قال : إن اللّٰه يغار، وإن المؤمن يغار، وغيرة اللّٰه أن يأتي العبد ما حرم عليه. وروي عن ابن مسعود أنه - صلوات …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 244، يذكر وصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 244, that mentions a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 244 کا اقتباس جس میں مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 3, pág. 244, que menciona una descripción del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 3, page 244, contenant une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 3. cildinin 244. sayfasından bir alıntı, mümini tanımlamaktadır; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 3, halaman 244, menjelaskan tentang orang beriman; ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
