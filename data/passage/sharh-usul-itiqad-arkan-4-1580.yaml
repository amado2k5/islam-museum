summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 4، ص 1580، يذكر الإيمان بالقدر، وحلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 4, p. 1580, that mentions belief in the decree, the sweetness and completeness of faith, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 4، ص 1580 کا اقتباس جس میں تقدیر پر ایمان، ایمان کی مٹھاس اور اس کا کمال، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 4, pág. 1580, que menciona la creencia en el decreto, la dulzura y la plenitud de la fe, aquello sin lo cual la fe no está completa; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 4, p. 1580), mentionnant la croyance au décret, la douceur et la plénitude de la foi, et ce sans quoi la foi serait incomplète. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le répertoire « Piliers et branches de la foi »."
  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan, resimli 4. cilt, 1580. sayfadaki eserinden bir alıntı; kader inancını, imanın tatlılığını ve mükemmelliğini ve imanın onsuz eksik kalacağını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar kepercayaan Sunni, jilid 4 bergambar, halaman 1580, membahas kepercayaan pada takdir, kemanisan dan kesempurnaan iman, dan hal-hal yang tanpanya iman menjadi tidak lengkap. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
