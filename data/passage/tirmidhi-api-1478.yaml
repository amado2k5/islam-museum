label: { ar: "جامع الترمذي 1478 — ما حُرّم", en: "Jami' al-Tirmidhi 1478 — what was made unlawful", ur: "جامع ترمذی 1478 — جو حرام کیا گیا", es: "Jami' al-Tirmidhi 1478 — lo que se declaró ilícito", fr: "Jami' al-Tirmidhi 1478 — ce qui a été déclaré illicite", tr: "Cami' el-Tirmizi 1478 — Haram olanlar", id: "Jami' al-Tirmidhi 1478 — Apa yang dilarang" }
text: "… هَاشِمُ بْنُ الْقَاسِمِ حَدَّثَنَا عِكْرِمَةُ بْنُ عَمَّارٍ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، عَنْ أَبِي سَلَمَةَ، عَنْ جَابِرٍ، قَالَ حَرَّمَ رَسُولُ اللَّهِ - يَعْنِي يَوْمَ خَيْبَرَ - الْحُمُرَ الإِنْسِيَّةَ وَلُحُومَ الْبِغَالِ وَكُلَّ ذِي نَابٍ مِنَ السِّبَاعِ وَذِي مِخْلَبٍ مِنَ الطَّيْرِ. قَالَ وَفِي الْبَابِ عَنْ أَبِي هُرَيْرَةَ وَعِرْبَاضِ بْنِ سَارِيَةَ وَابْنِ عَبَّاسٍ. قَالَ أَبُو عِيسَى حَدِيثُ جَابِرٍ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1478، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1478 (The Book on Hunting), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1478، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1478 (El Libro de la Caza), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1478 (Le Livre de la Chasse), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'nin 1478 numaralı hadisinde haram olan şeylerden bahsedilir. Helal ve Haram tarayıcısı, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1478, menyebutkan apa yang dilarang. Peramban Halal dan Haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
