label: { ar: "سنن ابن ماجه 3459 — الدواء، السم والترياق", en: "Sunan Ibn Majah 3459 — the drug; poison and antidote", ur: "سنن ابن ماجہ 3459 — دوا، زہر اور تریاق" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ يُونُسَ بْنِ أَبِي إِسْحَاقَ، عَنْ مُجَاهِدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ نَهَى رَسُولُ اللَّهِ ـ عَنِ الدَّوَاءِ الْخَبِيثِ. يَعْنِي السُّمَّ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3459، يذكر الدواء، والسم والترياق، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3459 (Chapters on Medicine), that mentions the drug, poison and antidote, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3459، جس میں دوا، زہر اور تریاق، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
