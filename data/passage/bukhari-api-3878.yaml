label: { ar: "صحيح البخاري 3878 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3878 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3878 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3878 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3878 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا عَبْدُ الأَعْلَى بْنُ حَمَّادٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا سَعِيدٌ، حَدَّثَنَا قَتَادَةُ، أَنَّ عَطَاءً، حَدَّثَهُمْ عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ الأَنْصَارِيِّما ـ أَنَّ نَبِيَّ اللَّهِ صَلَّى عَلَى النَّجَاشِيِّ فَصَفَّنَا وَرَاءَهُ فَكُنْتُ فِي الصَّفِّ الثَّانِي أَوِ الثَّالِثِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3878، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3878 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3878، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 3878 (Méritos de los Ayudantes en Medina (Ansar)), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 3878 (Mérites des Compagnons de Médine (Ansar)), mentionne des nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
