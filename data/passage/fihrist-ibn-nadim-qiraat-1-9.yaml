text: "… وغيرهم ومُصَنِّفَاتُهم............... بابُ نُزُولِ القُرْآنِ بمَكَّة والمَدِينَة وتَرْتِيبٍ نُزُولِه بابُ تَرْتيبِ نُزُولِ القُرْآنِ في مُصْحَفٍ عَبْد اللّٰه بن مَسْعُود.. بابُ تَرْتيبِ القُرآنِ في مُصْحَفٍ أُتيَ بن كَتْب...... الجُمَّاعُ للقُرْآنِ على عَهْدٍ النَّبِيِّ وَيَةِ.... أخْبَارُ القُرَّاءِ السَّبْعَة وأَسْمَاءُ رِوَايَاتِهم وقِرَاءَتهم.... أبو …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 9، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 1, p. 9, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 1، ص 9 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 1, pág. 9, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Fihrist d'Ibn al-Nadim (tome 1, page 9) mentionne les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Nadim'in Fihrist adlı eserinin 1. cildinin 9. sayfasından, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Jilid 1, halaman 9, yang menyebutkan para qari dan penyusunan Al-Qur'an serta manuskripnya; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
