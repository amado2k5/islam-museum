text: "… وغيرهم ومُصَنِّفَاتُهم............... بابُ نُزُولِ القُرْآنِ بمَكَّة والمَدِينَة وتَرْتِيبٍ نُزُولِه بابُ تَرْتيبِ نُزُولِ القُرْآنِ في مُصْحَفٍ عَبْد اللّٰه بن مَسْعُود.. بابُ تَرْتيبِ القُرآنِ في مُصْحَفٍ أُتيَ بن كَتْب...... الجُمَّاعُ للقُرْآنِ على عَهْدٍ النَّبِيِّ وَيَةِ.... أخْبَارُ القُرَّاءِ السَّبْعَة وأَسْمَاءُ رِوَايَاتِهم وقِرَاءَتهم.... أبو …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 9، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
