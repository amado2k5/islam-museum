summary:
  ar: "القسم 0 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «المقدمة»، ويضم فيها النصوص من 1 إلى 92 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 0 of Sahih Muslim (Introduction) in the division of the open hadith dataset the museum took its reports from: reports 1 to 92 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 0، عنوان «المقدمۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1 تا 92۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 0 de Sahih Muslim (Introducción) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1 al 92 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre 0, Introduction), qui comprend les hadiths 1 à 92 selon la numérotation de ce recueil. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 0. bölümü \"Giriş\" başlığını taşımakta olup, 1-92 arası numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 0 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Pendahuluan\" dan berisi teks 1-92, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
