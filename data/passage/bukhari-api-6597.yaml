label: { ar: "صحيح البخاري 6597 — وصية أو عهد أخير", en: "Sahih al-Bukhari 6597 — a testament or parting counsel", ur: "صحیح بخاری 6597 — وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 6597 — un testamento o consejo de despedida", fr: "Sahih al-Bukhari 6597 — un testament ou un conseil d'adieu" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي بِشْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ سُئِلَ النَّبِيُّ عَنْ أَوْلاَدِ الْمُشْرِكِينَ فَقَالَ \" اللَّهُ أَعْلَمُ بِمَا كَانُوا عَامِلِينَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6597، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6597 (Divine Will (Al-Qadar)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 6597، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6597 (El Testamento Divino (Al-Qadar)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 6597 (Testament divin (Al-Qadar)), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
