label: { ar: "الأربعون 38 — من عادى لي ولياً فقد آذنته بالحرب", en: "Arba'un 38 — whoever is hostile to a friend of Mine", es: "Arba'un 38 — quien sea hostil a un amigo mío", fr: "Arba'un 38 — quiconque est hostile à un ami de moi", ur: "اربعون 38 - جو بھی میرے دوست سے دشمنی رکھتا ہے۔", tr: "38. Müttefiklerimden birine düşmanlık gösteren kimseye savaş ilan ettim.", id: "38. Barangsiapa bermusuhan dengan salah seorang sekutu-Ku, maka Aku telah menyatakan perang terhadapnya." }
summary:
  ar: "حديث أبي هريرة قال: قال رسول الله: «إن الله تعالى قال: من عادى لي ولياً فقد آذنته بالحرب، وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه، ولا يزال عبدي يتقرب إلي بالنوافل حتى أحبه، فإذا أحببته كنت سمعه الذي يسمع به وبصره الذي يبصر به ويده التي يبطش بها ورجله التي يمشي بها، ولئن سألني لأعطينه ولئن استعاذني لأعيذه» — وهو الحديث الثامن والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ تفرد بإخراجه البخاري (6502) دون بقية أصحاب الكتب من طريق محمد بن عثمان بن كرامة عن خالد بن مخلد عن سليمان بن بلال عن شريك بن عبد الله بن أبي نمر عن عطاء عن أبي هريرة مع زيادة في آخره «وما ترددت عن شيء أنا فاعله ترددي عن نفس المؤمن يكره الموت وأنا أكره مساءته»؛ وهو من غرائب الصحيح تفرد به ابن كرامة عن خالد وليس في مسند أحمد مع أن خالد بن مخلد القطواني تكلم فيه أحمد وغيره وقالوا له مناكير، وعطاء الذي في إسناده قيل ابن أبي رباح وقيل ابن يسار؛ وروي من وجوه أخر لا تخلو عن مقال منها حديث عائشة عند عبد الواحد بن ميمون أبي حمزة مولى عروة بن الزبير «من آذى لي ولياً فقد استحل محاربتي وما تقرب إلي عبدي بمثل أداء فرائضي» ⁦(جامع العلوم والحكم ص 770–795)⁩."
  en: "The hadith of Abu Hurayra that the Messenger of God said: 'God Most High said: whoever is hostile to a friend of Mine, I have declared war on him; and My servant draws near to Me by nothing dearer to Me than what I have made obligatory on him; and My servant keeps drawing near to Me through supererogatory works until I love him — and when I love him I am his hearing with which he hears, his sight with which he sees, his hand with which he grasps and his foot with which he walks; if he asks Me I shall surely give him, and if he seeks refuge in Me I shall surely shelter him' — the thirty-eighth of al-Nawawi's Forty and of Ibn Rajab's commentary, uniquely transmitted by al-Bukhari (6502) among the collections through Muhammad ibn Uthman ibn Karama from Khalid ibn Mukhallad from Sulayman ibn Bilal from Shurayk ibn Abdullah ibn Abi Namir from Ata' from Abu Hurayra, with the closing addition 'and I have never hesitated over anything I do as I hesitate over the soul of the believer — he hates death and I hate to hurt him'; it is among the Sahih's rarities, Ibn Karama alone narrating it from Khalid, and it is absent from Ahmad's Musnad though Khalid ibn Mukhallad al-Qatwani was criticised by Ahmad and others who said he had repudiated reports, while the Ata' of the chain was variously identified as Ibn Abi Rabah or Ibn Yasar; it was also narrated by routes none free of criticism, among them A'isha's report through Abd al-Wahid ibn Maymun Abu Hamza, client of Urwa ibn al-Zubayr — 'whoever harms a friend of Mine has made lawful My war against him, and My servant draws near to Me by nothing like performing what I made obligatory' (Jami' al-Ulum wal-Hikam pp. 770–795)."
  es: "El hadiz de Abu Hurayra dice que el Mensajero de Dios dijo: 'Dios Altísimo dijo: quien sea hostil a un amigo Mío, le he declarado la guerra; y Mi siervo se acerca a Mí por nada más querido para Mí que lo que le he hecho obligatorio; y Mi siervo sigue acercándose a Mí por medio de obras supererogatorias hasta que lo amo; y cuando lo amo, soy su oído con el que oye, su vista con la que ve, su mano con la que agarra y su pie con el que camina; «Si me pide, ciertamente se lo daré, y si busca refugio en mí, ciertamente lo protegeré» — el trigésimo octavo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, transmitido de forma única por al-Bujari (6502) entre las colecciones a través de Muhammad ibn Uthman ibn Karama de Khalid ibn Mukhallad de Sulayman ibn Bilal de Shurayk ibn Abdullah ibn Abi Namir de Ata' de Abu Hurayra, con la adición final «y nunca he dudado sobre nada de lo que hago como dudo sobre el alma del creyente: él odia la muerte y yo odio hacerle daño»; Se encuentra entre las rarezas del Sahih, siendo Ibn Karama el único que la narra de Khalid, y está ausente del Musnad de Ahmad, aunque Khalid ibn Mukhallad al-Qatwani fue criticado por Ahmad y otros que dijeron que había repudiado informes, mientras que el Ata' de la cadena fue identificado de diversas maneras como Ibn Abi Rabah o Ibn Yasar; también fue narrada por rutas que no están exentas de críticas, entre ellas el informe de Aisha a través de Abd al-Wahid ibn Maymun Abu Hamza, cliente de Urwa ibn al-Zubayr: «quien dañe a un amigo Mío ha hecho lícita Mi guerra contra él, y Mi siervo se acerca a Mí sin realizar lo que yo hice obligatorio» (Jami' al-Ulum wal-Hikam, págs. 770-795)."
  fr: "Le hadith d'Abu Hurayra rapporte que le Messager de Dieu a dit: « Dieu, le Très-Haut, a dit: Quiconque est hostile à un de Mes amis, Je lui déclare la guerre; et Mon serviteur ne se rapproche de Moi que par ce que Je lui ai rendu obligatoire; et Mon serviteur continue de se rapprocher de Moi par des œuvres surérogatoires jusqu'à ce que Je l'aime — et quand Je l'aime, Je suis son ouïe avec laquelle il entend, sa vue avec laquelle il voit, sa main avec laquelle il saisit et son pied avec lequel il marche; « S’il Me demande, Je lui donnerai assurément, et s’il cherche refuge auprès de Moi, Je l’abriterai assurément » — le trente-huitième des Quarante d’al-Nawawi et du commentaire d’Ibn Rajab, transmis de manière unique par al-Bukhari (6502) parmi les collections à travers Muhammad ibn Uthman ibn Karama de Khalid ibn Mukhallad de Sulayman ibn Bilal de Shurayk ibn Abdullah ibn Abi Namir d’Ata' d’Abu Hurayra, avec l’ajout final « et Je n’ai jamais hésité sur quoi que ce soit que Je fasse comme j’hésite sur l’âme du croyant — il hait la mort et je hais de lui faire du mal »; Ce hadith figure parmi les raretés du Sahih, Ibn Karama étant le seul à le rapporter d'après Khalid. Il est absent du Musnad d'Ahmad, bien que Khalid ibn Mukhallad al-Qatwani ait été critiqué par Ahmad et d'autres qui affirmaient qu'il avait répudié des récits. Quant à l'Ata' de la chaîne, il a été diversement identifié comme étant Ibn Abi Rabah ou Ibn Yasar. Il a également été rapporté par des voies non exemptes de critiques, parmi lesquelles le hadith d'Aïcha transmis par Abd al-Wahid ibn Maymun Abu Hamza, client d'Urwa ibn al-Zubayr: « Quiconque nuit à un de Mes amis a rendu licite Ma guerre contre lui, et Mon serviteur ne se rapproche de Moi que par l'accomplissement de ce que J'ai rendu obligatoire » (Jami' al-Ulum wal-Hikam, p. 770-795)."
  ur: "ابوہریرہ سے روایت ہے کہ رسول اللہ نے فرمایا: اللہ تعالیٰ نے فرمایا: جس نے میرے کسی دوست سے دشمنی کی، میں نے اس سے اعلان جنگ کر دیا ہے۔ اور میرا بندہ میرے نزدیک اس چیز سے زیادہ محبوب ہوتا ہے جو میں نے اس پر فرض کیا ہے۔ اور میرا بندہ عبادات کے ذریعے میرے قریب آتا رہتا ہے یہاں تک کہ میں اس سے محبت کرتا ہوں - اور جب میں اس سے محبت کرتا ہوں تو میں اس کی سماعت ہوں جس سے وہ سنتا ہے، اس کی بصارت ہوں جس سے وہ دیکھتا ہے، اس کا ہاتھ ہوں جس سے وہ پکڑتا ہے اور اس کا پاؤں ہوں جس سے وہ چلتا ہے۔ اگر وہ مجھ سے مانگے گا تو میں اسے ضرور دوں گا اور اگر وہ مجھ سے پناہ مانگے گا تو میں اسے ضرور پناہ دوں گا۔‘‘ - النووی کی چالیس کی اڑتیسویں اور ابن رجب کی تفسیر، جسے بخاری (6502) نے منفرد انداز میں نقل کیا ہے، محمد بن عثمان ابن سلیمان بن سلیمان سے خلیل بن کرامہ کے ذریعے مجموعوں میں سے ہے۔ شریق بن عبداللہ ابن ابی نمیر عطاء سے ابو ہریرہ سے، اختتامی اضافے کے ساتھ 'اور میں نے اپنے کسی کام میں کبھی ہچکچاہٹ نہیں کی جیسا کہ میں مومن کی روح پر ہچکچاتا ہوں - وہ موت کو ناپسند کرتا ہے اور میں اسے تکلیف دینا ناپسند کرتا ہوں'؛ یہ صحیح کی نایاب روایات میں سے ہے، ابن کرامہ نے اسے خالد سے روایت کیا ہے، اور یہ احمد کی مسند سے غائب ہے، حالانکہ خالد بن مخلد القطوانی کو احمد اور دوسروں نے تنقید کا نشانہ بنایا تھا، جنہوں نے کہا تھا کہ اس نے روایتوں کو رد کیا ہے، جب کہ سلسلہ کے عطاء کو مختلف طور پر ابن ابی رابع کے نام سے پہچانا گیا ہے۔ اسے ایسے راستوں سے بھی روایت کیا گیا ہے جن میں سے کوئی بھی تنقید سے پاک نہیں ہے، ان میں عائشہ کی روایت عبد الواحد بن میمون ابو حمزہ، عروہ ابن الزبیر کے مؤکل کے ذریعے ہے - 'جس نے میرے کسی دوست کو نقصان پہنچایا اس نے اس کے خلاف میری جنگ کو حلال کیا، اور میرا بندہ میرے پاس ایسا کچھ نہیں کرتا ہے جیسے کہ میں نے واجب العلم کو انجام دیا ہے۔ 770-795)۔"
  tr: "Ebu Hurayra'nın rivayet ettiği hadiste, Allah Resulü şöyle buyurmuştur: “Yüce Allah buyurdu ki: ‘Kim benim dostlarımdan birine düşmanlık ederse, ben ona savaş ilan etmiş olurum. Kulum bana, farz kıldığım şeylerden daha çok sevdiğim bir şeyle yaklaşamaz. Kulum, nafile amellerle bana yaklaşmaya devam eder, ta ki ben onu sevinceye kadar. Ben onu sevdiğim zaman, onun işittiği kulak, gördüğü göz, vurduğu el ve yürüdüğü ayak olurum. Benden isterse, mutlaka veririm; bana sığınırsa, mutlaka ona sığınma hakkı veririm.’” — Bu hadis, İbn Receb'in tefsirinde ve El-Arba'in El-Neveviyye'de otuz sekizinci hadistedir. Bu hadis, diğer kitap yazarlarından bağımsız olarak, Muhammed bin Osman bin Kereme yoluyla, Halid bin Makhlad'dan, Süleyman bin Bilal'den, Şarik bin Abdullah bin Ebu Namir'den, Ata'dan ve Ebu Hurayra'dan rivayetle, yalnızca Buhari (6502) tarafından nakledilmiştir. Sonuna ise şu eklenmiştir: \"Yapacağım hiçbir şeyde, müminin ruhu konusunda tereddüt ettiğim kadar tereddüt etmedim; çünkü o ölümden hoşlanmaz ve ben de ona zarar vermekten hoşlanmam.\" Bu, Sahih'in garip hadislerinden biridir ve yalnızca İbn Kereme tarafından Halid'den rivayet edilmiştir. Halid ibn Makhlad el-Katvani'nin Ahmed ve diğerleri tarafından sakıncalı rivayetleri olduğu gerekçesiyle eleştirilmesine rağmen, Musned Ahmed'de yer almamaktadır. Rivayet zincirinde adı geçen Ata'nın İbn Ebu Rabe olduğu, İbn Yasar'ın ise İbn Ebu Rabe olduğu söylenmektedir. Eleştirilerden muaf olmayan diğer kaynaklardan da rivayet edilmiştir; bunlar arasında Urva ibn el-Zübeyr'in azatlı kölesi Abdülvahid ibn Maymun Ebu Hamza'dan rivayet edilen Aişe hadisi de bulunmaktadır: \"Kim benim bir dostuma zarar verirse, bana onunla savaşma hakkı vermiş olur ve kulum bana, yükümlülüklerimi yerine getirmek gibi bir şeyle yaklaşamaz.\" (Cami' el-Ulum ve el-Hikam, s. 770-795)."
  id: "Hadits Abu Hurairah, yang berkata: Rasulullah SAW bersabda: “Allah Yang Mahakuasa berfirman: Barangsiapa bermusuhan dengan salah seorang sekutu-Ku, maka Aku telah menyatakan perang terhadapnya. Hamba-Ku tidak mendekati-Ku dengan sesuatu yang lebih Aku cintai daripada apa yang telah Aku wajibkan kepadanya. Dan hamba-Ku terus mendekati-Ku dengan amalan-amalan sunnah hingga Aku mencintainya. Ketika Aku mencintainya, Aku menjadi pendengarannya yang dengannya ia mendengar, penglihatannya yang dengannya ia melihat, tangannya yang dengannya ia memukul, dan kakinya yang dengannya ia berjalan. Jika ia meminta kepada-Ku, Aku pasti akan memberikannya, dan jika ia berlindung kepada-Ku, Aku pasti akan memberinya perlindungan.” — Ini adalah hadits ke-38 dalam Al-Arba’in Al-Nawawiyyah dan dalam tafsir Ibnu Rajab. Hadits ini diriwayatkan secara unik oleh Al-Bukhari (6502) tanpa melibatkan penulis kitab-kitab lain, melalui jalur Muhammad bin Uthman bin Karama, dari Khalid bin Makhlad, dari Sulaiman bin Bilal, dari Sharik bin Abdullah bin Abi Namir, dari Ata, dari Abu Hurairah, dengan tambahan di bagian akhir: “Dan aku tidak ragu-ragu dalam melakukan sesuatu sebanyak keraguanku terhadap jiwa orang beriman, karena ia tidak menyukai kematian dan aku tidak suka menyakitinya.” Ini adalah salah satu hadits sahih yang aneh, diriwayatkan hanya oleh Ibn Karama dari Khalid, dan tidak ada dalam Musnad Ahmad, meskipun Khalid ibn Makhlad al-Qatwani dikritik oleh Ahmad dan lainnya, yang mengatakan bahwa riwayatnya tidak dapat diterima. Ata, yang berada dalam sanadnya, dikatakan sebagai Ibn Abi Rabah, dan dikatakan juga sebagai Ibn Yasar. Diriwayatkan dari sumber lain yang tidak lepas dari kritik, termasuk hadits Aisyah dari Abd al-Wahid ibn Maymun Abi Hamza, budak yang dibebaskan oleh Urwa ibn al-Zubayr: “Barangsiapa yang mencelakai sahabat-Ku, maka hal itu menghalalkan Aku untuk memeranginya, dan hamba-Ku tidak mendekati-Ku dengan sesuatu pun yang menyerupai pelaksanaan kewajiban-Ku” (Jami’ al-‘Ulum wa al-Hikam, hlm. 770–795)."
