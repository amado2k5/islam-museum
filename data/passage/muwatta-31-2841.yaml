label: { ar: "الموطأ 2841 — أبو هريرة: لا تقسم ورثتي دينارا، وما تركت بعد نفقة نسائي ومؤنة عاملي فهو صدقة", en: "Muwatta 2841", es: "Muwatta 2841", fr: "Muwatta 2841", ur: "موطا 2841", tr: "El-Muvatta 2841 — Ebu Hurayra: Mirasçılarım tek bir dinarı bile paylaşmasınlar; eşlerimin masrafları ve çalışanlarımın ücretleri düşüldükten sonra bana kalan her şey sadaka olsun.", id: "Al-Muwatta 2841 — Abu Hurairah: Ahli warisku tidak boleh membagi sepeser pun dinar, dan apa pun yang kutinggalkan setelah pengeluaran istri-istriku dan upah pekerjaku adalah sedekah." }
summary:
  ar: "يروي مالك عن أبي الزناد، عن الأعرج، عن أبي هريرة أن رسول الله قال: لا تقسم ورثتي دينارا، ما تركت بعد نفقة نسائي ومؤنة عاملي فهو صدقة. {cite:muwatta-maruf-1997 p.593}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Mirasçılarım tek bir dinarı bile paylaşmasınlar. Karılarımın giderlerinden ve çalışanlarımın ücretlerinden sonra bana kalan her şey sadakadır.\" {cite:muwatta-maruf-1997 s.593}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah bahwa Rasulullah SAW bersabda: \"Ahli warisku tidak boleh membagi sepeser pun dinar. Apa pun yang kutinggalkan setelah nafkah istri-istriku dan upah pekerjaku adalah sedekah.\" {cite:muwatta-maruf-1997 p.593}"
