text: "… عليه ما دامَ في مُصلاه [البخاري: ٦٥٩]. وأخبر: أن انتظار الصلاة بعد الصلاة، مما يمحُو اللَّهُ به الخَطايا ويَرْفَعُ بِهِ الدرجات، وأنه الرِّباطُ [مسلم: ٥٨٧] وأخبر : أن اللَّه يُبَاهِي مَلَائِكَتَه بِمَن قَضَى فَرِيضَةً وجَلَسَ يَنْتَظِرُ أَخْرَى [ابن ماجه: ٨٠١]. …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 133، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 133, that speaks of ranks raised, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 133 کا اقتباس جس میں درجات کی بلندی، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, pág. 133, que habla de rangos elevados, malas acciones borradas y pecados perdonados; de la copia extraída, citada en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, p. 133, qui parle de grades élevés, de mauvaises actions effacées et de péchés expiés; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin 133. sayfasında, derecelerin yükseltilmesi, günahların silinmesi ve suçların ortadan kaldırılmasından bahseden bir pasaj; alıntılanan versiyondan alınmıştır ve kaynakların politikasına göre metin yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, hlm. 133, yang menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran; dari versi yang dikutip, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
