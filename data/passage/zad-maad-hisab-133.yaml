text: "… عليه ما دامَ في مُصلاه [البخاري: ٦٥٩]. وأخبر: أن انتظار الصلاة بعد الصلاة، مما يمحُو اللَّهُ به الخَطايا ويَرْفَعُ بِهِ الدرجات، وأنه الرِّباطُ [مسلم: ٥٨٧] وأخبر : أن اللَّه يُبَاهِي مَلَائِكَتَه بِمَن قَضَى فَرِيضَةً وجَلَسَ يَنْتَظِرُ أَخْرَى [ابن ماجه: ٨٠١]. …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 133، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 133, that speaks of ranks raised, bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 133 کا اقتباس جس میں درجات کی بلندی، برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
