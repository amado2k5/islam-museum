text: "… الكبرى لابن بطة باب بيان كفرهم وضلالهم، وخروجهم عن الملة وإباحة قتلهم. الخلال، وابن بطة الإبانة الكبرى من طريق أبي الحارث، عن أحمد به. وفي الإبانة الكبرى بتحقيقي من طريق أبي الحارث زيادة: قال: وفيه أسماء الله، فإذا قال الرجل: …"
