label: { ar: "سنن أبي داود 3538 — الحرام", en: "Sunan Abi Dawud 3538 — the unlawful", ur: "سنن ابی داؤد 3538 — حرام", es: "Sunan Abi Dawud 3538 – lo ilegal", fr: "Sunan Abi Dawud 3538 — l'illégal" }
text: "حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا أَبَانُ، وَهَمَّامٌ، وَشُعْبَةُ، قَالُوا حَدَّثَنَا قَتَادَةُ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنِ ابْنِ عَبَّاسٍ، عَنِ النَّبِيِّ قَالَ \" الْعَائِدُ فِي هِبَتِهِ كَالْعَائِدِ فِي قَيْئِهِ \". قَالَ هَمَّامٌ وَقَالَ قَتَادَةُ وَلاَ نَعْلَمُ الْقَىْءَ إِلاَّ حَرَامًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 3538، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 3538 (Wages (Kitab Al-Ijarah)), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 3538، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3538 (Salarios (Kitab Al-Ijarah)), menciona lo ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 3538 (Salaires (Kitab Al-Ijarah)), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
