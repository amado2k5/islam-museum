text: "الحديث. فصل وقد ذكر الوزير أبو المظفر يحيى بن محمد بن هبيرة في كتابه: «الإشراف على مذاهب الأشراف) بابا في السحر، فقال: أجمعوا على أن السحر له حقيقة إلا أبا حنيفة، فإنه قال: لا حقيقة له عنده. واختلفوا فيمن يتعلم"
