label: { ar: "الموطأ 2231 — يحيى عن مالك: في الرجل يبتاع السلعة من الحيوان أو الثياب أو العروض فيوجد ذلك البيع غير جائز فيرد، فلصاحب السلعة قيمتها يوم قبضت منه، لا يوم يرد، لأنه ضمنها من يوم قبضها، وما زاد فيها أو نقص فهو له أو عليه", en: "Muwatta 2231", es: "Muwatta 2231", fr: "Muwatta 2231", ur: "موطا 2231", tr: "El-Muvatta 2231 — Yahya, Malik'ten rivayet ettiğine göre: Bir kimse hayvan, giysi veya mal satın alır ve satış geçersiz bulunursa, onu iade etmelidir. Malın sahibi, onu aldığı günkü değerine hak kazanır, iade edildiği günkü değerine değil, çünkü o maldan sorumlu olduğu günden itibaren ona aittir. Değerindeki herhangi bir artış veya azalma onun veya onun sorumluluğundadır.", id: "Al-Muwatta 2231 — Yahya berdasarkan riwayat Malik: Jika seseorang membeli hewan, pakaian, atau barang dagangan, dan penjualan tersebut ternyata tidak sah, maka ia harus mengembalikannya. Pemilik barang dagangan berhak atas nilainya pada hari barang tersebut diterima darinya, bukan pada hari barang tersebut dikembalikan, karena ia bertanggung jawab atas barang tersebut sejak hari ia menerimanya. Setiap kenaikan atau penurunan nilainya adalah tanggung jawabnya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في الرجل يبتاع السلعة من الحيوان أو الثياب أو العروض فيوجد ذلك البيع غير جائز، فيرد، ويؤمر الذي قبض السلعة أن يرد إلى صاحبه سلعته. قال مالك: فليس لصاحب السلعة إلا قيمتها يوم قبضت منه، وليس يوم يرد ذلك إليه، وذلك أنه ضمنها من يوم قبضها، فما كان فيها من نقصان بعد ذلك كان عليه، فبذلك كان نماؤها وزيادتها له. وإن الرجل يقبض السلعة في زمان هي فيه نافقة، مرغوب فيها، ثم يردها في زمان هي فيه ساقطة لا يريدها أحد. {cite:muwatta-maruf-1997 p.317} {cite:muwatta-maruf-1997 p.318}"
  tr: "Yahya dedi ki: Malik'in, hayvan, giysi veya ticari mal gibi malları satın alan ve daha sonra satışın geçersiz olduğunu anlayan bir kişi hakkında şöyle dediğini duydum: Mallar iade edilir ve onları ele geçiren kişi, onları sahibine iade etmekle yükümlüdür. Malik dedi ki: Malların sahibi, ancak onları ele geçirdiği günkü değerine hak kazanır, kendisine iade edildiği günkü değerine değil. Çünkü malları ele geçirdiği günden itibaren onlardan sorumluydu, bu nedenle değerlerindeki herhangi bir azalma onun sorumluluğundadır ve dolayısıyla değerlerindeki herhangi bir artış veya büyüme de ona aittir. Bir kişi, mallar talep gördüğü ve yüksek talep gördüğü zaman onları ele geçirebilir ve daha sonra artık istenmediğinde iade edebilir. {cite:muwatta-maruf-1997 s.317} {cite:muwatta-maruf-1997 s.318}"
  id: "Yahya berkata: Saya mendengar Malik berkata tentang seseorang yang membeli barang, baik hewan, pakaian, atau barang dagangan, dan kemudian mendapati penjualan itu tidak sah, bahwa barang tersebut dikembalikan, dan orang yang mengambil alih kepemilikan barang tersebut diperintahkan untuk mengembalikannya kepada pemiliknya. Malik berkata: Pemilik barang hanya berhak atas nilai barang tersebut pada hari ia mengambil alih kepemilikannya, bukan pada hari barang tersebut dikembalikan kepadanya. Ini karena ia bertanggung jawab atas barang tersebut sejak hari ia mengambil alih kepemilikannya, sehingga setiap penurunan nilai barang setelah itu menjadi tanggung jawabnya, dan dengan demikian setiap peningkatan atau pertumbuhan nilai barang tersebut menjadi miliknya. Seseorang mungkin mengambil alih kepemilikan barang ketika barang tersebut diminati dan sangat diminati, dan kemudian mengembalikannya ketika barang tersebut tidak lagi diinginkan. {cite:muwatta-maruf-1997 p.317} {cite:muwatta-maruf-1997 p.318}"
