label: { ar: "الموطأ 2231 — يحيى عن مالك: في الرجل يبتاع السلعة من الحيوان أو الثياب أو العروض فيوجد ذلك البيع غير جائز فيرد، فلصاحب السلعة قيمتها يوم قبضت منه، لا يوم يرد، لأنه ضمنها من يوم قبضها، وما زاد فيها أو نقص فهو له أو عليه", en: "Muwatta 2231" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول في الرجل يبتاع السلعة من الحيوان أو الثياب أو العروض فيوجد ذلك البيع غير جائز، فيرد، ويؤمر الذي قبض السلعة أن يرد إلى صاحبه سلعته. قال مالك: فليس لصاحب السلعة إلا قيمتها يوم قبضت منه، وليس يوم يرد ذلك إليه، وذلك أنه ضمنها من يوم قبضها، فما كان فيها من نقصان بعد ذلك كان عليه، فبذلك كان نماؤها وزيادتها له. وإن الرجل يقبض السلعة في زمان هي فيه نافقة، مرغوب فيها، ثم يردها في زمان هي فيه ساقطة لا يريدها أحد. {cite:muwatta-maruf-1997 p.317} {cite:muwatta-maruf-1997 p.318}"
