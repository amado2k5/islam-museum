label:
  ar: "النسائي 2214 — الصوم لي وأنا أجزي به"
  en: "Nasa'i 2214 — Fasting is Mine, and I reward it"
  ur: "نسائی 2214 — روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں"
text: "الصيام لي وأنا أجزي به والصائم يفرح مرتين عند فطره ويوم يلقى الله وخلوف فم الصائم أطيب عند الله من ريح المسك ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 2214: الصوم لي وأنا أجزي به. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 2214: Fasting is Mine, and I reward it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 2214: روزہ میرے لیے ہے اور میں ہی اس کا بدلہ دیتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
