text: "وبينهما كذلك قال مالك ولا تحل له واحدة منهما أبدا لان الام قد دخل بها فصارت الربيبة محرمة عليه أبداً والام هي من أمهات نسائه فلا تحل له أبداً عي ابن وهب به عن يونس أنه سأل ابن شهاب عن …"
