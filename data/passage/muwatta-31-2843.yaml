label: { ar: "الموطأ 2843 — أبو هريرة: النار أسود من القار", en: "Muwatta 2843", es: "Muwatta 2843", fr: "Muwatta 2843", ur: "موطا 2843", tr: "Al-Muwatta 2843 - Ebu Hureyre: Cehennem ateşi ziftten daha karadır", id: "Al-Muwatta 2843 — Abu Hurairah: Api neraka lebih hitam dari ter" }
summary:
  ar: "يروي مالك عن عمه أبي سهيل بن مالك، عن أبيه، عن أبي هريرة أنه قال: أترونها حمراء كناركم هذه؟ لهي أسود من القار. ويبين المحقق أن القار هو الزفت. {cite:muwatta-maruf-1997 p.593} {cite:muwatta-maruf-1997 p.594}"
  tr: "Malik, amcası Ebu Suhayl ibn Malik'ten, o da babasından, o da Ebu Hurayra'dan rivayetle şöyle buyurduğunu aktarır: \"Onu ateşiniz kadar kırmızı görüyor musunuz? Ziftten daha karadır.\" Araştırmacı, ziftin katran olduğunu açıklığa kavuşturmaktadır. {cite:muwatta-maruf-1997 s.593} {cite:muwatta-maruf-1997 s.594}"
  id: "Malik meriwayatkan dari pamannya Abu Suhayl ibn Malik, dari ayahnya, dari Abu Hurayrah, yang berkata: “Apakah kamu melihatnya semerah apimu? Warnanya lebih hitam dari aspal.” Peneliti menjelaskan bahwa aspal adalah ter. {cite:muwatta-maruf-1997 p.593} {cite:muwatta-maruf-1997 p.594}"
