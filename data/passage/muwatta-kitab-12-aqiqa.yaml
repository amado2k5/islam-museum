label: { ar: "الموطأ، كتاب العقيقة", en: "Muwatta, Book of the Aqiqa", es: "Muwatta, Libro del Aqiqa", fr: "Muwatta, Livre de l'Aqiqa", ur: "موطا، کتاب عقیقہ", tr: "El-Muvatta, Akika Kitabı", id: "Al-Muwatta, Kitab Aqiqah" }
summary:
  ar: "كتاب العقيقة، الكتاب الثاني عشر والأخير من المجلد الأول في طبعة بشار عواد معروف (1997) من الموطأ في رواية يحيى بن يحيى عن مالك: 8 نصوص (1441–1448) في بابين، من الصفحة 645 إلى الصفحة 647 من ملف PDF المجلد الأول. يبدأ بقول النبي في العقيقة ويذكر وزن شعر الحسن والحسين وصدقته بالفضة، ثم عمل الصحابة والتابعين فيها، ويختم بحكم مالك أنها مستحبة وليست واجبة. {cite:muwatta-maruf-1997 p.645} {cite:muwatta-maruf-1997 p.647}"
  en: "The Book of the Aqiqa, the twelfth and last book of volume 1 of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 8 reports (1441–1448) in two babs, PDF pp. 645–647, from the Prophet's word on the aqiqa and Fatima's alms of silver to the Malikite ruling that it is recommended and not obligatory."
  es: "El Libro de la Aqiqa, el duodécimo y último libro del volumen 1 del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 8 informes (1441–1448) en dos babs, PDF pp. 645–647, desde la palabra del Profeta sobre la aqiqa y la limosna de plata de Fátima hasta el dictamen malikí de que es recomendable y no obligatorio."
  fr: "Le Livre de l'Aqiqa, le douzième et dernier livre du volume 1 du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 8 rapports (1441-1448) dans deux babs, PDF pp. 645-647, depuis la parole du Prophète sur l'aqiqa et les aumônes d'argent de Fatima jusqu'à la décision malikite selon laquelle elle est recommandée et non obligatoire."
  ur: "عقیقہ کی کتاب، یحییٰ بن یحییٰ کی تجدید میں موطا کی جلد 1 کی بارہویں اور آخری کتاب ⁦(موضوع معارف 1997)⁩: 8 رپورٹیں (1441–1448) دو بابوں میں، پی ڈی ایف پی پی 645–647 سے، رسول اللہ کے کلمے سے لے کر فقیہ المصطفٰی پر مالکیت کے لفظ تک۔ حکم ہے کہ یہ مستحب ہے اور واجب نہیں ہے۔"
  tr: "Beşar Awad Maruf'un (1997) Yahya ibn Yahya'dan Malik'ten rivayet edilen Al-Muwatta'nın ilk cildinin on ikinci ve son kitabı olan Akika Kitabı: 8 metin (1441–1448), ilk cildin PDF dosyasının 645. sayfasından 647. sayfasına kadar iki bölüm halinde yer almaktadır. Peygamberimizin Akika hakkındaki sözüyle başlar ve Hasan ile Hüseyin'in saçlarının ağırlığından ve bunu gümüş olarak sadaka olarak vermesinden bahseder, ardından Sahabelerin ve halifelerin bu konudaki uygulamalarından bahseder ve Malik'in bunun farz değil, tavsiye edilen bir ibadet olduğuna dair hükmüyle sona erer. {cite:muwatta-maruf-1997 s.645} {cite:muwatta-maruf-1997 s.647}"
  id: "Kitab Aqiqah, kitab kedua belas dan terakhir dari jilid pertama edisi Bashar Awad Maruf (1997) dari Al-Muwatta' dalam riwayat Yahya ibn Yahya dari Malik: 8 teks (1441–1448) dalam dua bab, dari halaman 645 hingga halaman 647 dari file PDF jilid pertama. Kitab ini dimulai dengan sabda Nabi tentang Aqiqah dan menyebutkan berat rambut Al-Hasan dan Al-Husayn serta pemberiannya sebagai sedekah perak, kemudian praktik para Sahabat dan Penerus mengenainya, dan diakhiri dengan fatwa Malik bahwa Aqiqah dianjurkan dan tidak wajib. {cite:muwatta-maruf-1997 p.645} {cite:muwatta-maruf-1997 p.647}"
