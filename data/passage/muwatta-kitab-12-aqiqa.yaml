summary:
  ar: "كتاب العقيقة، الكتاب الثاني عشر والأخير من المجلد الأول في طبعة بشار عواد معروف (1997) من الموطأ في رواية يحيى بن يحيى عن مالك: 8 نصوص (1441–1448) في بابين، من الصفحة 645 إلى الصفحة 647 من ملف PDF المجلد الأول. يبدأ بقول النبي في العقيقة ويذكر وزن شعر الحسن والحسين وصدقته بالفضة، ثم عمل الصحابة والتابعين فيها، ويختم بحكم مالك أنها مستحبة وليست واجبة. {cite:muwatta-maruf-1997 p.645} {cite:muwatta-maruf-1997 p.647}"
  en: "The Book of the Aqiqa, the twelfth and last book of volume 1 of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 8 reports (1441–1448) in two babs, PDF pp. 645–647, from the Prophet's word on the aqiqa and Fatima's alms of silver to the Malikite ruling that it is recommended and not obligatory."
