label: { ar: "جامع الترمذي 3177 — ما حُرّم", en: "Jami' al-Tirmidhi 3177 — what was made unlawful", ur: "جامع ترمذی 3177 — جو حرام کیا گیا" }
text: "… انْتَهَتْ إِلَىَّ عَرَفَتْهُ فَقَالَتْ مَرْثَدُ فَقُلْتُ مَرْثَدُ. فَقَالَتْ مَرْحَبًا وَأَهْلاً هَلُمَّ فَبِتْ عِنْدَنَا اللَّيْلَةَ. قَالَ قُلْتُ يَا عَنَاقُ حَرَّمَ اللَّهُ الزِّنَا. قَالَتْ يَا أَهْلَ الْخِيَامِ هَذَا الرَّجُلُ يَحْمِلُ أَسْرَاكُمْ. قَالَ فَتَبِعَنِي ثَمَانِيَةٌ وَسَلَكْتُ الْخَنْدَمَةَ فَانْتَهَيْتُ إِلَى كَهْفٍ أَوْ غَارٍ فَدَخَلْتُ فَجَاءُوا حَتَّى قَامُوا عَلَى رَأْسِي فَبَالُوا فَطَلَّ بَوْلُهُمْ عَلَى رَأْسِي وَأَعْمَاهُمُ اللَّهُ عَنِّي. قَالَ ثُمَّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3177، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3177 (Chapters on Tafsir), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3177، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
