text: |-
  ١٢
  *(باب الالف المهوزة
  المر باوالمرسا ومنه قيل لمكان البازى الذى يقف فيه مى بأوربآت القوم ربآوارتياتهم أى
  قبتهسم وذلك اذا كنت لهم طليعة فوق شرف بقال ربألنا فلان وارتيا اذا اعتان
  ور بأت المر بأة وارتبأتها أنى عاوتها والربى "والربيئة الطليعة والهمع الربايا وقولهم انى
  لأربأبك عن هذا الامر أى أرفعك عنه ابن السكيت ماربأت رب فلان أى ما علت به
  ولم أكترت له أبوز يدرابأت النئ مرابأة اذا حذرنه واتقيته ⁦(رتأ )⁩ رتأت العقدة
  وتأشددتها والرجل ختقته وفى المشى رتا نامثل الرتكان خبيث نا) ارتئا اللسين
  خثرورثأت اللبن رئأاذاحلبته عسلى حامض فختر والاسم الرئيئة ومنه قواهم إن الرثيئة
  تفشأ الغضب وارتتأعليهم أمرهسم اختلط وهسم يرثون رأيهم دثأ أى يخلطون وارتشأ فلائم
  فى رأيه أى خلط ابن السكيت قالت امرأة من العرب رثأت زوجى بابيات وهمزت وأصله
  غير مهموز جأ رجأت الامر أخرته وقرئ وأخرون حرجوْن لامر اللّٰه أى مؤخرون
  حتى ينزل اللّٰه فيهم ماير يد ومنه سميت المرجئة مثال المرجعة يقال رجل مرجئ منال
  حرجع والنسبة اليسه هرحثى مثال مرجعى هذا اذاهمزت فاذ الم ته. زقلت رجل مرج
  مثسل معط وهم المرجية بالتشديدلات بعض العرب يقول أرجيت وأخطيت وتوضيت فلا
  يه. زوأرجأت الناقة دنانتاجهايه-مزولايه مزقال أبوع روهو مهموز وأنشدلذى الرمة
  صفييضة اذا أرجأت مانت وى سليلها ويروى اذا تتجت ردأ ردؤالشئ
  يردو رداءة فهوردى.أى فاسد وأردأنه أفسدته وأردأنه أيضابعنى أعنته تقول
  أرد أته بنفسى اذا كنت له ردءا وهو العون قال اللّٰه تباركْ وتعالى فأر-له مهى رده!
  سدقنى (()%زأ) الرزه المصيبة وابه-ع الارزاء ورزأت الرجل أرزأ رز٠اومرزئة اذا
  أصبت منهخيراما كان ويقال مارزأنه ماله ومارزتته ماله أى مانقصته وارتزأ الشئ
  انتقص قال الشاعرابن مقبل يصف فلا فلم يرتزئ بركوب زبالا والمرزئة المصيبة وكذلك
  الرزيئة وابهع الرزايا ورجل عرزأ أى كريم يصيب الناس خيره وقد رز أنه رزيقة أى
  أصبابته مصيبة ⁦( شأ)⁩ الرشأ على فعسل بالتهريك ولد الظبية الذى قد تحرّك ومشى
  رطأ) رجل رطى على فعيل بين الرطأ بالتحريك أى أحق فأ فأت النوب أرفأه
  رهأ اذا أصلحت ماوهى منه رعالم يه مز يقال من اغتاب خرق ومن استغفرر فأ والرفاء بالمد
  الالتثام والاتفاق يقال للمتزوّج بالرفاء والبنين وقدرفأت المملك ترفئة وترفيتًا اذا قلت
  له ذلك قال ابن السكيت وان شئت كان معناه بالسكون والطمأنينة فيكون أصله غير الهسمز
  •ن قوله-م رفوت الرّجل اذاسكنته وأرة أتْ الفينة قربتها من الشّط وذلك الموضع مرفأ
  وأرفأت اليه لجأت ورافأته فى البيع حابيته وترافؤا أى توافة واوتظاهروا ⁦( رقأ )⁩ رقأ
  الدمع يرقارقأ ورقو«اسكن وكذلك الدم وأرقا اللّٰه دمعه سكنه والرقو لى فعول بالفتح
  ما يوضع على الدم فيسكن وفى الحديث لا تسبوا الابل فانّ فيهارقوء الدم أى انها تعطى
  فى الديات فتحة ن بها الدماء ويقال آرقأ على ظلعك لغة فى قولك ارق على ظلعك أى ارفق
  نفسات ولا تحمل عليها أكثر ما تطيق (⁦(مأ )⁩ أبوز يدرهأت الابل بالمكان ترمأر. أورمو٠ا
