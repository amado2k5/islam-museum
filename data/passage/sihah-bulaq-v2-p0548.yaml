  والصليف عرض العنق وهما صليفان من الجانبين والصليفان أيضاعودان يعترضان على
  الغبيط تشتبهما الحامل ومنه قول الشاعر« أقب" كأنّ هاديه الصليف* والصلف قله نزل
  الطعام يقال إناء صلف اذا كان قليل الاخذلاماء وسجاب صاف قليل الماء كثير الرعد
  وفى المثل ربة صلف تحت الراعدة يضرب للرجل يتوعدثم لا يقوم به وصلفت المرأة تصاف
  صلفا اذ الم تحظ عندروجها وأبغضها يقال امر أة صلفة من نسوة ملاتف قال القطامىّ
  يذكوامرأة
  لها روضة فى القلب لم توع مثلها * فروك ولا المستعبرات الصلائف
  وقال الشيمانى يقال للمرأة أصلف اللّٰه رفعك أى بغضك الى زوجك ومن أمثالهم فى
  التمسك بالدين من يبغ فى الدين يصلف أى لا يحظى عند الناس ولا يرزق منهم المجبة وزعم
  الخلسل أن الصلف مجاوزة قدر الظرف والادّعاء فوق ذلك تكبرافهو رجل صلف وقد تصلف
  •صنف ) الصنف النوع والضرب والصنف بالفتح لغة فيه وءودصنفى بالفتح منسوب الى
  موضع وصنفة الازار بكسر الذون طرّته وهى جانبه الذى لاهدب له ويقبال هى حاشة الثوب
  أى جانب كان وتصنيف الشئ جعله أصنافا وتمييز بعضها من بعض قال ابن أحر
  سقيالحلوان ذى الكروم وما:، صنف من تينه ومن عنبه
  ( صوف الصوف للشاة والصوفة أخص منه ويقال أخذت بصوف رقبته واطوف رقبته
  وبطاف رقبته وبظوف رقبته وبظاف رقبته وبقوف دقبته وبقاف رقبته قال ابن الاعرابىّ
  أى بجلد رقيته وقال أبو السميدع وذلك اذا تبعه وقد ظنّ أن لن يدركه فلجقه أخذ برقيته
  أم لم يأخذ وقال ابن دريذ أى بشعره المتدلى فى نقرة قفام وقال الفراءاذا أخذ بقفام جعاء
  وقإل أبو الغوث أى أخذه قهرا ويقال أيضا أعطامص وفرقيته كايقال أعطاء برمّته
  وقال أبو عبيد أى أعطاه مجانا ولم يأخذثمنا وصوفة أبو حى من مضروهو الغوث بن مرّين أدّ
  ابن طابخة بن الياس بن مضر كانو ايخدمون الكعبة فى الجاهلية ويجيزون الجاج أى يفيضون
  بهم وكان يقال فى الحج أجيزى صوفة ومنه قول الشاعر( حتى يقال أجيزوا آل صوفانا•
