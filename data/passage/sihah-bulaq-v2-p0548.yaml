  فى القاموس وصنفه تصنيفا
  جعله أصنافا وميز بعضها عن بعضّ
  والشجريبت ورقه ومن هذا قول
  عبيد اللّٰه بن قيس الرقيات
  سقسا لحلوان ذى الكروم وما
