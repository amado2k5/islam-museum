  فهوصاف وصاف وأصوف وصائف وكذلكّ صوف إلكبسش بالكسر فهو كيش صوف بين
  الصوف حكاه أبو عبيد عن الكائى وصاف السهم عن الهدف يصوف ويصيف أى عدل
  منه ومنه قولهم صاف عنى شرّقلان وآصاف اللّٰه عى شرّه ⁦(صيف )⁩ الصيف واحد فصول
  السنة وهو بعد الربيغ الأول وقبل القيظ يقال صيف صائف وهويو كيد له كما يقال ليل
