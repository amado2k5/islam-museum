text: "ي يجهر بقراءته بالنهار؛ فقال: ((يا عبد الله أسمع النبي ولفي كتب له كتابا، وفيه : شهد عباس بن عبد الله، ولا تسمعنا)) . المطلب وجهم بن قيس وشرحبيل بن حسنة، ويحتمل أن أخرجه أحمد، وابن أبي خيثمة والحاكم أبو"
