label: { ar: "صحيح البخاري 1491 — منع الحسن بن علي من تمرة الصدقة", en: "Sahih al-Bukhari 1491 — al-Hasan ibn 'Ali stopped from eating a date of the charity", ur: "صحیح بخاری 1491 — حسن بن علی کو صدقے کی کھجور سے روکنا", es: "Sahih al-Bukhari 1491 — Al-Hasan ibn 'Ali se abstuvo de comer un dátil de la caridad.", fr: "Sahih al-Bukhari 1491 — al-Hasan ibn 'Ali s'est retenu de manger une datte de l'aumône." }
text: "حَدَّثَنَا آدَمُ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا مُحَمَّدُ بْنُ زِيَادٍ، قَالَ سَمِعْتُ أَبَا هُرَيْرَةَ ـ قَالَ أَخَذَ الْحَسَنُ بْنُ عَلِيٍّما ـ تَمْرَةً مِنْ تَمْرِ الصَّدَقَةِ، فَجَعَلَهَا فِي فِيهِ، فَقَالَ النَّبِيُّ \" كِخٍ كِخٍ ـ لِيَطْرَحَهَا ثُمَّ قَالَ ـ أَمَا شَعَرْتَ أَنَّا لاَ نَأْكُلُ الصَّدَقَةَ \"."
summary:
  ar: "خبر في صحيح البخاري، رقم 1491، في منع الحسن بن علي من تمرة الصدقة. لا يرد فيه لفظ الحلال أو الحرام، ويجمعه متصفح الحلال والحرام مع أخبار الورع وتحرّي الحلال."
  en: "A report in Sahih al-Bukhari, no. 1491, on al-Hasan ibn 'Ali stopped from eating a date of the charity. It does not use the words halal or haram; the Halal and Haram Browser lists it with the reports of scruple and of seeking the lawful."
  ur: "صحیح بخاری کی روایت نمبر 1491: حسن بن علی کو صدقے کی کھجور سے روکنا۔ اس میں حلال یا حرام کا لفظ نہیں آیا؛ حلال و حرام براؤزر اسے ورع اور حلال کی جستجو کی روایات کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1491, sobre al-Hasan ibn 'Ali, menciona que se abstuvo de comer un dátil de la caridad. No utiliza las palabras halal ni haram; el buscador de halal y haram lo incluye entre los relatos sobre escrúpulos y sobre la búsqueda de lo lícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1491, relate qu'al-Hasan ibn 'Ali s'était abstenu de manger une datte reçue en aumône. Ce hadith n'emploie pas les termes halal ou haram; le Halal and Haram Browser le classe parmi les hadiths évoquant le scrupule et la recherche du licite."
