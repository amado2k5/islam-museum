text: "… لِلْبَرَكةِ أو على ترك مندوب كحلف لا يصلي الضحى. وتحرم على فعل محرم، كشرب خمر، أو على ترك واجب، كمن حلف لا يصوم رمضان وهو صحيح مقيم. ثم إن إباحتها على فعل مباح أو تركه مالم تتكرر، فالتكرار خلاف السنة، …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 296، يرد فيه ذكر الواجب، والمندوب، والمباح، وما حُرّم على الناس؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 6, p. 296, whose wording mentions the obligatory (wajib), the recommended (mandub), the permitted (mubah), what was forbidden to people; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 6، ص 296 کا اقتباس جس میں واجب، مندوب، مباح، جو لوگوں پر حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 6, p. 296, dont le texte mentionne l'obligatoire (wajib), le recommandé (mandub), le permis (mubah), ce qui a été interdit aux gens ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 6, p. 296, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mandub), lo permitido (mubah), lo que se prohibió a la gente; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 6, sayfa 296'dan, farz, tavsiye edilen, caiz ve haram fiillerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz fiiller, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 6 Bergambar, halaman 296, yang menyebutkan amalan wajib, anjuran, yang diperbolehkan, dan yang dilarang; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
