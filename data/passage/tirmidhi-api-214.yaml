label: { ar: "جامع الترمذي 214 — مغفرة ما تقدم من الذنب", en: "Jami' al-Tirmidhi 214 — forgiveness of past sins", ur: "جامع ترمذی 214 — پچھلے گناہوں کی مغفرت", es: "Jami' al-Tirmidhi 214 — perdón de los pecados pasados", fr: "Jami' al-Tirmidhi 214 — le pardon des péchés passés", tr: "Cami' el-Tirmizi 214 — Geçmiş günahların affı", id: "Jami' al-Tirmidhi 214 — Pengampunan dosa masa lalu" }
text: "حَدَّثَنَا عَلِيُّ بْنُ حُجْرٍ، أَخْبَرَنَا إِسْمَاعِيلُ بْنُ جَعْفَرٍ، عَنِ الْعَلاَءِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" الصَّلَوَاتُ الْخَمْسُ وَالْجُمُعَةُ إِلَى الْجُمُعَةِ كَفَّارَاتٌ لِمَا بَيْنَهُنَّ مَا لَمْ تُغْشَ الْكَبَائِرُ \". قَالَ وَفِي الْبَابِ عَنْ جَابِرٍ وَأَنَسٍ وَحَنْظَلَةَ الأُسَيِّدِيِّ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 214، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 214 (The Book on Salat (Prayer)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 214، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 214 (El Libro de la Oración), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 214 (Le Livre de la Salat (Prière)), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Cami' el-Tirmizi'de yer alan 214 numaralı hadis, geçmiş günahların affedilmesinden bahsetmektedir. Bu hadis, iyi ve kötü ameller listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 214, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
