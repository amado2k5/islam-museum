text: "… القتال في الفتنة. أبو سعيد الخدري الصحابي حديث في الصراط والشفاعة دخول أبي سعيد على معاوية ونصحه إياه. حديثه عن مصاب الرسول أُحد يوم أ وسبب وروده ترك أبي سعيد الصلاة في مرض موته. وصيته سعيد والصواب سعد بن مرة …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 3، ص 476، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 3, p. 476, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 3، ص 476 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 3, pág. 476, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh Dimashq d'Ibn 'Asakir (tome 3, p. 476) mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 3, sayfa 476'dan bir alıntı, vasiyetname veya son vasiyetten ve ölüm saatinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid Bergambar 3, halaman 476, menyebutkan surat wasiat atau testamen terakhir, dan saat kematian; diambil dari edisi faksimili yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti surat wasiat, warisan, barang antik, dan tempat suci."
