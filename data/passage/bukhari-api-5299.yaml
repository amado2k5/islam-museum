label: { ar: "صحيح البخاري 5299 — أعضاء البدن", en: "Sahih al-Bukhari 5299 — the organs of the body", ur: "صحیح بخاری 5299 — اعضائے بدن" }
text: "… هُرْمُزَ، سَمِعْتُ أَبَا هُرَيْرَةَ، قَالَ رَسُولُ اللَّهِ \" مَثَلُ الْبَخِيلِ وَالْمُنْفِقِ كَمَثَلِ رَجُلَيْنِ عَلَيْهِمَا جُبَّتَانِ مِنْ حَدِيدٍ، مِنْ لَدُنْ ثَدْيَيْهِمَا إِلَى تَرَاقِيهِمَا، فَأَمَّا الْمُنْفِقُ فَلاَ يُنْفِقُ شَيْئًا إِلاَّ مَادَّتْ عَلَى جِلْدِهِ حَتَّى تُجِنَّ بَنَانَهُ وَتَعْفُوَ أَثَرَهُ، وَأَمَّا الْبَخِيلُ فَلاَ يُرِيدُ يُنْفِقُ إِلاَّ لَزِمَتْ كُلُّ حَلْقَةٍ مَوْضِعَهَا، فَهْوَ يُوسِعُهَا فَلاَ تَتَّسِعُ \". وَيُشِيرُ بِإِصْبَعِهِ إِلَى حَلْقِهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5299، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5299 (Divorce), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5299، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
