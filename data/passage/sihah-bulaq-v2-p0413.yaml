text: |-
  قولديا اقنان هوجبل لبنى أسد
  قاله المؤاف اه
  ١٧٤
  • ⁦(فصل الحا)⁩•
  •حل).
  ينتده كذا قال وبعضهم لا يكمر الحاء ولكن يشمها الكسركايروم فى قيل الضم وكذلت
  لفتهم فى المضعف مثل ردوشد وأحلملته أى أنزلته قال أبويوسف العلتان القدروال حى قال
  فاذاقيل المحلات فهى القدر والرحى والدلو والشفرة والفأس والقداحة والقربة أى من كان
  عنده هذه الادوات حلّ حيث شاء والافلا بدله من أن يجاور الناس ليستعبر منهم بعض
  هذه الاشياء وأنشد
  لا يعدلن أناويون تضربهم • نكباصر بأصحاب المحلات
  أى لا يعدانّ أناويون أحد اياصحاب المحلات فحسذف المفعول وهومراد ويروى لا يعدلنّ
  على ما لم يسم فاعلد أى لا يذقى أن يعدل وأحلات له الشئ أى جعلته له حلالاً يقال أحللت
  المرأة لزوجها وأحل المحرم لغسة فى حل وأحل أى خرج الى الحل أومن مثاق كان علي
  ومنه قول زهير» وكم بالقنان من محلّ ومحر م أى صله ذمّة ومن لاذمّة له وأحللنا أى دخلنا
  فى شهور الح-ل وأحرمنا أى دخلنا فى شهورالحرم وأحلت الشاة اذانزل اللبن فى ضرعها
  من غير نتاج قال الثققى" •تحل بها الطروقة واللجاب * والمحال فى السبق الداخل بين
  المتراهنين ان سبق أخذوان سبق لم يغرم والمحلل فى النكاح هو الدى يتزقح المطلقة ثلاناحتى
  تحل للزوج الاوّل وأحل بنفسه أى استوجب العقوبة ومكان محملل اذا أكثر الناس به الحلول
  قال امر والقيس بصف جارية
  كبكر المقاناة البياض بصفرة * غذاها نمير الماء غير محلل
  لانمسم اذا أكنروابه الحلول كذروه وعنى بالبكردرّة غير مثة وبة واحتل أى نزل وتحلل
  فى عينه أى استننى واستهل الشىء أى عده حلا لا وحلمات القوم أى أزعجتهم عن موضعهم
  وحلحات بالناقة اذاقلت لهاحل بالتسكين وهو زجرللماقة وحوب زجر للبعير وحل أيضا
  با تنوين فى الوصل قال رؤية* وطول زجر بحل وعاج• وتحلهل عن مكانه أى زال قال الشاعر
  ثهلان ذو الهضبات لا يتحلول * والحلان الجدى نذكره فى باب النون والتحليل ضد التحريم
  تقول -للتمتحليسلا وتحلة كما تقول غزر تغريرا وتغرّوواهم ما فعلته الاتحلة القسم أى لم
  أفعل الابقد رماحلات به عيني ولم آباغ وفى الحديث لايوت للمؤمن ثلاثة أولادقة سه النار
  الاتحلة القسم أى قدرما يبرّ اللّٰه تعالى قسمه فيه بقوله تعالى وان منكم الا وإردها كان على
  ربك حتما مقضا ثم قيل لكل شى لم يبالغ فيسه تحليل يقال ضربته تحليلا ومنه قول كعب
  ابنزهير• بأربع وقعهنّ الارض تحليل • يريد وقع مناسم الناقة على الارض من غسير
  مبالغة وقال الآخر
  أرى ابلى عافت جدود فلم تذق * بمناقعذرة الاتحلة مقسم
  قال الفراء الحلل فى البعير ضعف فى عرقوبه فهو أحل بين الحلل فان كان فى الركبة فهو الطرق
  والاحسل الذى فى رجله استرخاء وهو مذموم فى كل شى الافى الذئب قال الشماخ
  يحيل به الذئب الاحل وقوته * ذوات الهوادى من مناق ورزح
  يجل أى يقيم حولا والحلاحل السيد الركين وابهع الحلاحل بالفتح ⁦( حل )⁩ حات
  الشى على ظهرى أ-له جلا ومنه وله تعالى فانه يحمل يوم القيامة وزراخالدين فيه وساء
