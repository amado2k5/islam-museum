label: { ar: "الموطأ 769 — نافع: كان ابن عمر يخرج زكاة الفطر عن غلمانه الذين بوادي القرى وبخيبر", en: "Muwatta 769" }
summary:
  ar: "أول حديث في باب من تجب عليه زكاة الفطر. يرويه مالك عن نافع، أن عبد الله بن عمر كان يخرج زكاة الفطر عن غلمانه الذين بوادي القرى وبخيبر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي عند البيهقي (4/161). {cite:muwatta-maruf-1997 p.380}"
