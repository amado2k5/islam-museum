label: { ar: "الموطأ 769 — نافع: كان ابن عمر يخرج زكاة الفطر عن غلمانه الذين بوادي القرى وبخيبر", en: "Muwatta 769", es: "Muwatta 769", fr: "Muwatta 769", ur: "موطا 769", tr: "El-Muvatta 769 — Nafi’: İbn Ömer, Vadi el-Kura ve Hayber'de yaşayan hizmetkarları adına Zekâtü'l-Fitr verirdi.", id: "Al-Muwatta 769 — Nafi’: Ibnu Umar biasa membayar Zakat al-Fitr atas nama para pelayannya yang tinggal di Wadi al-Qura dan Khaybar" }
summary:
  ar: "أول حديث في باب من تجب عليه زكاة الفطر. يرويه مالك عن نافع، أن عبد الله بن عمر كان يخرج زكاة الفطر عن غلمانه الذين بوادي القرى وبخيبر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي عند البيهقي (4/161). {cite:muwatta-maruf-1997 p.380}"
  tr: "Zekâtü'l-Fitr ödeme yükümlülüğü olanlara ilişkin bölümdeki ilk hadis. Malik'in Nafi'den rivayet ettiğine göre, Abdullah ibn Umar, Vadi el-Kura ve Hayber'de yaşayan hizmetkarları adına zekâtü'l-Fitr verirdi. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Şafiî tarafından rivayet edildiğini ve el-Beyhaki'nin (4/161) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.380}"
  id: "Hadits pertama dalam bab tentang orang-orang yang wajib membayar Zakat Fitrah. Diriwayatkan oleh Malik dari Nafi’ bahwa Abdullah ibn Umar biasa membayar Zakat Fitrah atas nama para pelayannya yang tinggal di Wadi al-Qura dan Khaybar. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, dan al-Shafi’i, sebagaimana dicatat oleh al-Bayhaqi (4/161). {cite:muwatta-maruf-1997 p.380}"
