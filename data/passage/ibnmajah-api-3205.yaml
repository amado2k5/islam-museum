label: { ar: "سنن ابن ماجه 3205 — نقص قيراط من الأجر كل يوم", en: "Sunan Ibn Majah 3205 — a qirat lost from the reward each day", ur: "سنن ابن ماجہ 3205 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sunan Ibn Majah 3205 — se pierde un qirat de la recompensa cada día", fr: "Sunan Ibn Majah 3205 — une qirat perdue chaque jour, privant ainsi la récompense de sa signification.", tr: "Sunan İbn Majah 3205 — Her gün sevaptan bir kırat düşülür.", id: "Sunan Ibn Majah 3205 — Satu qirat dikurangi dari pahala setiap hari" }
text: "… اللَّهِ، عَنْ أَبِي شِهَابٍ، حَدَّثَنِي يُونُسُ بْنُ عُبَيْدٍ، عَنِ الْحَسَنِ، عَنْ عَبْدِ اللَّهِ بْنِ مُغَفَّلٍ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" لَوْلاَ أَنَّ الْكِلاَبَ أُمَّةٌ مِنَ الأُمَمِ لأَمَرْتُ بِقَتْلِهَا فَاقْتُلُوا مِنْهَا الأَسْوَدَ الْبَهِيمَ وَمَا مِنْ قَوْمٍ اتَّخَذُوا كَلْبًا إِلاَّ كَلْبَ مَاشِيَةٍ أَوْ كَلْبَ صَيْدٍ أَوْ كَلْبَ حَرْثٍ إِلاَّ نَقَصَ مِنْ أُجُورِهِمْ كُلَّ يَوْمٍ قِيرَاطَانِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3205، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 3205 (Chapters on Hunting), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3205، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3205 (Capítulos sobre la caza), habla de una qirat que se pierde de la recompensa cada día. El Libro Mayor de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 3205 (Chapitres sur la chasse), mentionne la perte d'une qirat (point) de la récompense quotidienne. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "İbn Majah'ın Süneni'nde yer alan 3205 numaralı hadiste, her gün sevabın bir kırat (bir ağırlık birimi) azaldığından bahsedilir. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesine dahildir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3205, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
