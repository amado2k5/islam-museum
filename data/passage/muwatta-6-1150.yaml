label: { ar: "الموطأ 1150 — أبو أسماء مولى عبد الله بن جعفر: حبس الحسين بالسقيا، فأمر علي بحلق رأسه ونحر بعير عنه", en: "Muwatta 1150", es: "Muwatta 1150", fr: "Muwatta 1150", ur: "موطا 1150", tr: "El-Muvatta 1150 — Abdullah ibn Cafer'in azatlı kölesi Ebu Esma: Hüseyin Sukya'da hapsedilmişti, bu yüzden Ali onun başının tıraş edilmesini ve yerine bir deve kurban edilmesini emretti.", id: "Al-Muwatta 1150 — Abu Asma, budak yang dibebaskan oleh Abdullah ibn Ja`far: Al-Husayn dipenjara di Al-Suqya, maka Ali memerintahkan agar kepalanya dicukur dan seekor unta dikorbankan sebagai penggantinya." }
summary:
  ar: "يحكي أبو أسماء مولى عبد الله بن جعفر أنه كان مع عبد الله بن جعفر، فخرجوا من المدينة فمروا على حسين بن علي وهو مريض بالسقيا، فأقام عليه عبد الله حتى خاف الفوات. فبعث إلى علي بن أبي طالب وأسماء بنت عميس بالمدينة فقدما عليه، فأمر علي بحلق رأسه ونحر بعيرا عنه بالسقيا. {cite:muwatta-maruf-1997 p.520}"
  tr: "Abdullah ibn Cafer'in azatlı kölesi Ebu Esma, Medine'den ayrıldıklarında Abdullah ibn Cafer ile birlikte olduğunu ve karın şişliği (asit) nedeniyle hasta olan Hüseyin ibn Ali'nin yanından geçtiklerini anlatır. Abdullah, Hüseyin'in öleceğinden korkana kadar onunla birlikte kaldı. Daha sonra Medine'deki Ali ibn Ebu Talib ve Esma bint Umays'a haber gönderdi ve onlar da yanına geldiler. Ali, Hüseyin'in başının tıraş edilmesini ve karın şişliği nedeniyle onun adına bir deve kurban edilmesini emretti. {cite:muwatta-maruf-1997 s.520}"
  id: "Abu Asma, budak yang dibebaskan oleh Abdullah ibn Ja'far, menceritakan bahwa ia bersama Abdullah ibn Ja'far ketika mereka meninggalkan Madinah dan melewati Husayn ibn Ali, yang sedang sakit asites. Abdullah tinggal bersamanya sampai ia khawatir Husayn akan meninggal. Kemudian ia mengirim pesan kepada Ali ibn Abi Talib dan Asma bint Umays di Madinah, dan mereka datang menemuinya. Ali memerintahkan agar kepalanya dicukur dan seekor unta dikorbankan untuknya karena penyakit asitesnya. {cite:muwatta-maruf-1997 p.520}"
