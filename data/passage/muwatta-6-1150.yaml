label: { ar: "الموطأ 1150 — أبو أسماء مولى عبد الله بن جعفر: حبس الحسين بالسقيا، فأمر علي بحلق رأسه ونحر بعير عنه", en: "Muwatta 1150" }
summary:
  ar: "يحكي أبو أسماء مولى عبد الله بن جعفر أنه كان مع عبد الله بن جعفر، فخرجوا من المدينة فمروا على حسين بن علي وهو مريض بالسقيا، فأقام عليه عبد الله حتى خاف الفوات. فبعث إلى علي بن أبي طالب وأسماء بنت عميس بالمدينة فقدما عليه، فأمر علي بحلق رأسه ونحر بعيرا عنه بالسقيا. {cite:muwatta-maruf-1997 p.520}"
