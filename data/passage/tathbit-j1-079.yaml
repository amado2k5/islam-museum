label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٢٨", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 28", ur: "تثبیت دلائل نبوت — حصہ اول، باب 28" }
text: "أن أبا بكر لما قتل مسليمة، وأسر طلحة، ورد أهل الردة، واستولى على جزيرة العرب الإسلام وأنفذ جيوشه إلى العراق واستظهر المسلمون، قام في المسلمين خطيبا فقال: إن أموركم قد عادت اليكم وبحمد الله استظهرتم على عدوكم فأقيلوني …"
summary:
  ar: "مقطع من الباب ٢٨ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 28 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 28 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
