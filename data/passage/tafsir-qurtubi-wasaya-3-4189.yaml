text: "… تزور قبر حمزة بن عبد المطلب كل جمعة وعلّمته بصخرة؛ ذكره أبو عمر. وأما الجائزة - فالدفن في التابوت؛ وهو جائز لا سيما في الأرض الرّخْوة. وروي أن دانيال صلوات اللّٰه عليه كان في تابوت من حجر، وأن يوسف أوصى …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 4189، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 4189, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 4189 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Qurtubi, al-Jami' li-Ahkam al-Qur'an, volumen 3, pág. 4189, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Coran d'al-Qurtubi (al-Jami' li-Ahkam al-Qur'an), volume 3, page 4189, mentionnant un testament ou des adieux, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin resimli 3. cildinin 4189. sayfasında, vasiyet veya son ahit, defin, mezar ve istirahat yeri konularından bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Vasiyetler, Miras, Antik Eserler ve İstirahat Yerleri Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Qurtubi's Al-Jami' li-Ahkam al-Qur'an, jilid bergambar 3, halaman 4189, menyebutkan wasiat atau perjanjian terakhir, pemakaman, kuburan, dan tempat peristirahatan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh Wills, Inheritance, Antiquities, and Resting Places Browser."
