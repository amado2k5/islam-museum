text: "… تزور قبر حمزة بن عبد المطلب كل جمعة وعلّمته بصخرة؛ ذكره أبو عمر. وأما الجائزة - فالدفن في التابوت؛ وهو جائز لا سيما في الأرض الرّخْوة. وروي أن دانيال صلوات اللّٰه عليه كان في تابوت من حجر، وأن يوسف أوصى …"
