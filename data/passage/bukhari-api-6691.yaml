label: { ar: "صحيح البخاري 6691 — ما أُحل", en: "Sahih al-Bukhari 6691 — what was made lawful", ur: "صحیح بخاری 6691 — جو حلال کیا گیا" }
text: "… لاَ بَلْ شَرِبْتُ عَسَلاً عِنْدَ زَيْنَبَ بِنْتِ جَحْشٍ، وَلَنْ أَعُودَ لَهُ \". فَنَزَلَتْ {يَا أَيُّهَا النَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ اللَّهُ لَكَ}، {إِنْ تَتُوبَا إِلَى اللَّهِ}، لِعَائِشَةَ وَحَفْصَةَ، {وَإِذْ أَسَرَّ النَّبِيُّ إِلَى بَعْضِ أَزْوَاجِهِ حَدِيثًا} لِقَوْلِهِ \" بَلْ شَرِبْتُ عَسَلاً \". وَقَالَ لِي إِبْرَاهِيمُ بْنُ مُوسَى عَنْ هِشَامٍ، \" وَلَنْ أَعُودَ لَهُ، وَقَدْ حَلَفْتُ، فَلاَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6691، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6691 (Oaths and Vows), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6691، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
