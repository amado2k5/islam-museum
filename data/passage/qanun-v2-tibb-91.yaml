text: "الكتاب الثالث الفنّ الأوّل: في أمراض الرأس والدماغ وأشدّ البطون إسباتاً عند القطع هو أشدّها منه إسباتاً عند الضغط، وقد يكون لوجع شديد من ضربة تصيب عضلات الصدغ، أو على مشاركته لأذى في فم المعدة، أو في الرحم، فينقبض منه …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 91، يذكر المرض والمريض، والوجع، وأطوار خلق الجنين، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 91, that mentions illness and the sick, pain, the stages of the embryo, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 91 کا اقتباس جس میں بیماری اور بیمار، درد، جنین کے مراحل، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 2, pág. 91, que menciona la enfermedad y los enfermos, el dolor, las etapas del embrión y los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 2, p. 91, qui mentionne la maladie et les malades, la douleur, les stades de l'embryon, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 2. Kısım, 91. sayfasından hastalık, hasta, ağrı, fetüs gelişim evreleri ve vücut organlarından bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 2, hlm. 91, yang menyebutkan penyakit, pasien, rasa sakit, tahapan perkembangan janin, dan organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
