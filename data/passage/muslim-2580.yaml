label: { ar: "مسلم 2580 — من كان في حاجة أخيه كان الله في حاجته", en: "Muslim 2580 — Whoever attends to his brother's need, God attends to his", es: "Musulmán 2580 — Quien atiende la necesidad de su hermano, Dios atiende la suya.", fr: "Muslim 2580 — Quiconque prend soin des besoins de son frère, Dieu prend soin des siens.", ur: "مسلم 2580 - جو اپنے بھائی کی حاجت پوری کرتا ہے اللہ اس کی حاجت پوری کرتا ہے۔", tr: "Müslim 2580 — Kim ihtiyaç halinde kardeşine yardım ederse, Allah da ona ihtiyaç halinde yardım eder.", id: "Muslim 2580 — Barang siapa menolong saudaranya yang membutuhkan, maka Allah akan menolongnya dalam kesulitannya." }
text: "قال رسول الله: «المسلم أخو المسلم لا يظلمه ولا يسلمه، من كان في حاجة أخيه كان الله في حاجته، ومن فرج عن مسلم كربة فرج الله عنه بها كربة من كرب يوم القيامة، ومن ستر مسلماً ستره الله يوم القيامة»"
summary:
  ar: "رواية ابن عمر في كتاب البر من صحيح مسلم؛ قضاء حاجة الأخ وتفريج الكربة وستر المسلم — من نصوص التكافل الأشهر."
  tr: "İbn Ömer'in Sahih Müslim'deki Salihlik Kitabı'nda rivayet ettiği \"Kardeşin ihtiyaçlarını karşılamak, sıkıntısını gidermek ve Müslümanı örtmek\" karşılıklı destek konusunda en meşhur metinlerden biridir."
  id: "Riwayat Ibnu Umar dalam Kitab Kebajikan dari Sahih Muslim: Memenuhi kebutuhan saudara, meringankan kesusahan, dan menutupi kekurangan Muslim — adalah salah satu teks paling terkenal tentang saling membantu."
