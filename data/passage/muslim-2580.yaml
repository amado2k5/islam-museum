label: { ar: "مسلم 2580 — من كان في حاجة أخيه كان الله في حاجته", en: "Muslim 2580 — Whoever attends to his brother's need, God attends to his" }
text: "قال رسول الله: «المسلم أخو المسلم لا يظلمه ولا يسلمه، من كان في حاجة أخيه كان الله في حاجته، ومن فرج عن مسلم كربة فرج الله عنه بها كربة من كرب يوم القيامة، ومن ستر مسلماً ستره الله يوم القيامة»"
summary:
  ar: "رواية ابن عمر في كتاب البر من صحيح مسلم؛ قضاء حاجة الأخ وتفريج الكربة وستر المسلم — من نصوص التكافل الأشهر."
