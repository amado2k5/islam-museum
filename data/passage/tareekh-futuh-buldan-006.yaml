text: "عن جده، ان كتاب عياض لا هل الرها : بسم الله الرحمن الرحيم ، هذا كتاب من عياض بن غنم ومن معه من المسلمين لاهل الرها ، اني امنتهم على دمائهم واموالهم وذراريهم ونسائهم ومدينتهم وطواحينهم، إذا أدوا الحق الذي"
