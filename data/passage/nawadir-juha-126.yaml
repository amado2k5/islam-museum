text: "… الورقة معي! ابتاع يوماً مُعلاقاً، وفيما هو ذاهب، صادفه أحد أصدقائه، فسأله : كيف نطبخ هذا المُعلاق؟ فأجابه : حسب العادة. فقال: كلّا، إنَّما له طبخةٌ أحسنُ أعلّمُك إيَّاها. فقال الشيخ: ربَّما لا أحفظُ التعريفة، فأرجو أنْ تكتَبها لي بورقة، …"
summary:
  ar: "اشترى جحا طبق سمك بوري، وسأل صديقًا عن طريقة طبخه، فكتب له الصديق الوصفة في ورقة؛ فاختطف صقر السمك، فقال جحا إنه لن يستطيع أكله لأن الوصفة معه. {cite:juha-nawadir-kubra-djuwaydi p. 60}"
  en: "Juha buys a dish of mullet and asks a friend how to cook it, and the friend writes the recipe on a note; a hawk snatches the fish; Juha says it cannot eat it, because the recipe is with him. {cite:juha-nawadir-kubra-djuwaydi p. 60}"
  ur: "جحا نے بوری مچھلی کا ایک تھال خریدا اور دوست سے پکانے کا طریقہ پوچھا؛ دوست نے ایک پرچی پر ترکیب لکھ دی؛ ایک باز مچھلی جھپٹ کر لے گیا؛ جحا نے کہا کہ وہ اسے کھا نہیں سکے گا کیونکہ ترکیب میرے پاس ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 60}"
  fr: "Juha achète un plat de mulet et demande à un ami comment le cuisiner; l'ami écrit la recette sur un papier; un faucon enlève le poisson; Juha dit qu'il ne pourra pas le manger, car la recette est avec lui. {cite:juha-nawadir-kubra-djuwaydi p. 60}"
  es: "Juha compra un plato de mújol y le pregunta a un amigo cómo cocinarlo; el amigo escribe la receta en un papel; un halcón se lleva el pescado; Juha dice que no podrá comérselo, porque la receta la tiene él. {cite:juha-nawadir-kubra-djuwaydi p. 60}"
  tr: "Juha bir tabak kefal aldı ve bir arkadaşına nasıl pişireceğini sordu. Arkadaşı tarifi bir kağıda yazdı, ancak bir şahin balığı kaptı. Juha, şahinin tarifi aldığı için balığı yiyemeyeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 60}"
  id: "Juha membeli sepiring ikan belanak dan bertanya kepada seorang teman bagaimana cara memasaknya. Temannya menulis resepnya di selembar kertas, tetapi seekor elang menyambar ikan itu. Juha berkata dia tidak akan bisa memakannya karena elang itu memiliki resepnya. {cite:juha-nawadir-kubra-djuwaydi p. 60}"
