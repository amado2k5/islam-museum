text: "… الآن صِرتُ طيراً تماماً صاد يوماً لقلقاً من البرية وأحضره إلى داره، فلما رأى رِجليه طويلتين عجب جاحدة، ناكرة، كافرة بالمعروف."
summary:
  ar: "أمسك جحا بلقلقاً واستغرب طول ساقيه فقطعهما ووضعه على مائدة عالية، وقال إنه الآن صار طيراً تماماً. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  en: "Juha catches a stork, finds its long legs odd, cuts them off, and sets it on a high table, saying it is now a bird entirely. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  ur: "جحا نے ایک لق لق پکڑا، اس کی لمبی ٹانگیں اسے عجیب لگیں تو انہیں کاٹ دیا اور اسے اونچی میز پر رکھ دیا، اور کہا کہ اب یہ پورا پرندہ بن گیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  fr: "Juha attrape une cigogne, trouve ses longues pattes étranges, les coupe et la pose sur une table haute, disant qu'elle est maintenant tout à fait un oiseau. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
  es: "Juha atrapa una cigüeña, encuentra raras sus largas patas, se las corta y la pone sobre una mesa alta, diciendo que ahora es del todo un pájaro. {cite:juha-nawadir-kubra-djuwaydi p. 178}"
