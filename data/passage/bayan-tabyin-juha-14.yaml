  es: "Un extracto de al-Bayan wa-l-Tabyin, p. 14, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "El-Bayan ve El-Tabyeen'in 14. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
