text: "… عيسى وداودَ، ومواعظَ الحسن وعمر وآخرين من النساك، ومن زهاد البصرة والكوفة. وأتبع ذلك بمختارات من دعاء السلف الصالح، والأعراب والنساك. النوكى والحمقى : والجاحظ ذلك المرح الضاحك، لا يفتأ يعجّب الناس من هذا الخَلْق الطريف، أولئك الذين شاء اللّٰه …"
summary:
  ar: "مقطع من البيان والتبيين، ص 14، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Bayan wa-l-Tabyin, p. 14, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "البیان والتبیین، ص 14 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
