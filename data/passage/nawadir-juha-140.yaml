text: "… لا وقت لي أن أذهب إلى بغداد جاءهُ أحدُ أصدقائِهِ، وقالَ له: أرجو أنْ تكتُبَ لي مكتوباً إلى أحَدِ أصدقائي في بغداد. فقال له الشيخ : أسألُك باللَّهِ أنْ تتركَني، فلا وقتَ عندي الآن، لأذهبَ إلى بغدادَ. فجرى الرجل وراءَهُ …"
summary:
  ar: "طلب صديق من جحا أن يكتب رسالة إلى صديق في بغداد، فقال إنه لا وقت له ليذهب إلى بغداد؛ فقال الصديق ولماذا يذهب ما دام سيكتب، فقال جحا إن أحدًا لا يقرأ خطه غيره، فلا بد أن يقرأ ما كتب بنفسه. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  en: "A friend asks Juha to write a letter to a friend in Baghdad; he says he has no time to go to Baghdad; the friend asks why he should go, if he writes; Juha says no one can read his handwriting but himself, so he must read what he writes. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  ur: "ایک دوست نے جحا سے بغداد کے ایک دوست کے نام خط لکھنے کو کہا؛ اس نے کہا کہ مجھے بغداد جانے کا وقت نہیں؛ دوست نے کہا کہ جب تم لکھ رہے ہو تو جانے کی کیا ضرورت؛ جحا نے کہا کہ میرا خط میرے سوا کوئی نہیں پڑھ سکتا، اس لیے جو لکھوں گا وہ مجھے خود پڑھنا ہو گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  fr: "Un ami demande à Juha d'écrire une lettre à un ami de Bagdad; il dit qu'il n'a pas le temps d'aller à Bagdad; l'ami demande pourquoi il irait, s'il écrit; Juha répond que personne ne sait lire son écriture sauf lui, et qu'il doit donc lire lui-même ce qu'il écrit. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
  es: "Un amigo le pide a Juha que escriba una carta a un amigo de Bagdad; él dice que no tiene tiempo de ir a Bagdad; el amigo pregunta por qué iría, si escribe; Juha responde que nadie puede leer su letra salvo él, así que debe leer él mismo lo que escribe. {cite:juha-nawadir-kubra-djuwaydi p. 65}"
