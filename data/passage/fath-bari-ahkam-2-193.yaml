text: "… من طريق أبى عوانة عن منصور فلم يذكره، وأخرجه فى الأطعمة من طريق الثورى عن منصور وقال فى آخره قال سفيان : العانى الأسير قال ابن بطال : فكاك الأسير واجب على الكفاية، وبه قال الجمهور. وقال إحق بن راهويه …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 193، يرد فيه ذكر فرض الكفاية، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 193, whose wording mentions the communal obligation (fard kifaya), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 193 کا اقتباس جس میں فرضِ کفایہ، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Hajar, volume numérisé 2, p. 193, dont le texte mentionne l'obligation collective (fard kifaya), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen digitalizado 2, p. 193, cuyo texto menciona la obligación colectiva (fard kifaya), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hacer'in Fethü'l-Bari adlı eserinin 2. cildinin 193. sayfasından, toplumsal yükümlülük (farz-ı kifaye) ve farz fiil (vacip) konularından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, Jilid 2, halaman 193, yang menyebutkan kewajiban duniawi (fard kifayah) dan amalan wajib (wajib); dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
