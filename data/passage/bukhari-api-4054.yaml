label: { ar: "صحيح البخاري 4054 — الأب والأبوة", en: "Sahih al-Bukhari 4054 — the father and fatherhood", ur: "صحیح بخاری 4054 — باپ اور والدیت" }
text: "حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ سَعْدِ بْنِ أَبِي وَقَّاصٍ ـ قَالَ رَأَيْتُ رَسُولَ اللَّهِ يَوْمَ أُحُدٍ، وَمَعَهُ رَجُلاَنِ يُقَاتِلاَنِ عَنْهُ، عَلَيْهِمَا ثِيَابٌ بِيضٌ، كَأَشَدِّ الْقِتَالِ، مَا رَأَيْتُهُمَا قَبْلُ وَلاَ بَعْدُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4054، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4054 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4054، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
