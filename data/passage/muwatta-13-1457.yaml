label: { ar: "الموطأ 1457 — سليمان بن يسار: فرض عمر بن الخطاب وعثمان بن عفان وزيد بن ثابت للجد مع الإخوة الثلث", en: "Muwatta 1457", es: "Muwatta 1457", fr: "Muwatta 1457", ur: "موطا 1457", tr: "El-Muvatta 1457 — Süleyman ibn Yasar: Ömer ibn el-Hattab, Osman ibn Affan ve Zeyd ibn Sabit, dedenin kardeşlerle birlikte mirasın üçte birini almasını şart koşmuşlardır.", id: "Al-Muwatta 1457 — Sulayman ibn Yasar: Umar ibn al-Khattab, Uthman ibn Affan, dan Zayd ibn Thabit menetapkan bahwa kakek, bersama dengan saudara-saudaranya, menerima sepertiga bagian." }
summary:
  ar: "بلغ مالكا عن سليمان بن يسار أنه قال فرض عمر بن الخطاب وعثمان بن عفان وزيد بن ثابت للجد مع الإخوة الثلث. {cite:muwatta-maruf-1997 p.12}"
  tr: "Malik, Süleyman ibn Yasar'dan rivayetle şöyle dediğini aktarmıştır: Ömer ibn el-Hattab, Osman ibn Affan ve Zeyd ibn Sabit, dedenin kardeşlerle birlikte mirasın üçte birini alması gerektiği konusunda şart koşmuşlardır. {cite:muwatta-maruf-1997 s.12}"
  id: "Malik meriwayatkan dari Sulayman ibn Yasar bahwa beliau berkata: Umar ibn al-Khattab, Uthman ibn Affan, dan Zayd ibn Thabit menetapkan bahwa kakek, bersama dengan saudara-saudaranya, harus menerima sepertiga bagian. {cite:muwatta-maruf-1997 p.12}"
