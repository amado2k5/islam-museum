text: |-
  ٥٢٨٠
  ⁦(باب الضاد)⁩
  ⁦(ع رض)⁩
  والعرض المتاع وكل شى فهوعرض سوى الدراهم والدنانير فانه ماعين قال أبو عبيد
  العروش الاممعة التى لا يدخلها كيل ولاوزن ولا يكون حيوانا ولاعقاراتقول إشتريت
  المتاع بعرض أى بتاع مثله وعرضت له من حقه ثوبا اذا أعطيته توبامكان حقه والعرضى
  جنر من المياب وقال يونس يقول ناس من العرب رأيته فى عرض الناس بعنون
  فى عرض والعرض سفح الجبل وناحيته ويشيه الجيش العظيم به فيقال ماهو الاعرض من
  الاعراض قالى رؤية
  انا اذاقدنالقوم عرضا * لم نبق من بفى الاعادى عضا
  ويقال شبه بالعرض من السحاب وهوماسد الافق وأتانإجرادءرض أى كثير والعرض
  خلاف الطول وقد عرض الشيء يعرض عرضامشال صغر يصغر صغراوعراضة أيضا بالفتح
  قال الشاعر اذا ابتدر القوم المكارم عزهم * عراضة اخلاق ابن ايلى وطولها
  فهوشئعريض وعراض بالضم وفلان عريض البطان أى مترويقال للعتود اذانب وأراد
  السفادعريض والجمع عرضان وعرضان ١ ال الشاعر
  عريض أريض بات يبعر -وه * وبات يسقينا بطون الشعالب
  والعرض بالتحريك ما يعرض للانسان من مرض ونحوه وعرض الدنا أيضاما كان من مال
  قل اوكثريقال الدنياعرض حاضر يأ كل منها البرّ والفاجر قال يونس يقال قد فأنه العرض
  وهو من عرض الجند كما بقال قبض قبضا وقد ألقاه فى القبض ويقال أيضااصابه سه-م
  عرض وحجر عرض بالاضافة اذا تعمدبه غيره فأصابه وقولهم علقتها عرضا اذا هوى امرأة
  أى اعترضت لى فعلقتها من غير قصد قال الاعشى
  علقتهاعرضا وعلقت رجلا * غيرى وعلتق أخرى عُسيرها الرجل
  والاعراض عن الشى الصدعنه ويقال أعرض فلان أى ذهب عرضاوطولا وفى المثل
  اعرضت القرفة وذلك اذاقسل للرجل من تتهم فمقول بى فلان للقساة بأسرها وأعرضت
  الشئ حعاته عر يضا وأعرضت العرضان خصيتها وأعرضت فلانة بولدها اذا ولدتهم عراضا
  وعرضت الشئ فأعرض أى أظهرته فظهر وهذا كقولهم كبيته فأكب وهو من النوادر
  وقوله تعالى وعرضفاجه-م يومئذلل كافرين عرضا قال الفراء ابرزناهاحت نظر اليها
  الكفاروأعرضت هى أى استبانت وظهرت قال الشاعر روبن كالثوم
  واعرضت المامة واشمخرّت • كاسياف بايدى مصلتينا
  أى لاحت جبالها اللناظر اليها عارضة وأعرض لك الخيراذا امكنك يقال اءرض للكّ الظبي
  أى أمكنك من عرضه اذا ولاك عرضه أى فارمه قال الشاعر
  أفاطم أعرضى قبل المنايا * كنى بالموت هجرا واجتنابا:
  أى أمكنى ويقال طأمعر ضاحيث سُئت أى ضع رجليكْ حيث شئت ولا تتق شيئًا
  وقد أمكنك ذلك وادّان فلان معرضا أى استدان ممن أمكنه ولم سال ما يكون من النبع
  واعترض الشئ صار عارضا كالخشبة المعترضة فى النهر يقال اعترض الشى دون الذى
  أى حال دونه واعترض الفرص فى رسنه لم يستقم لقائده واعترضت البعيرر كبته وهو صعب
  واعترض له بسهم أقبل به قبلدة رماهفتله واعترضت الشهراذا البتد أبه من غيرأوّله واعترض
  قلان
