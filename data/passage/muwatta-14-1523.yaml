label: { ar: "الموطأ 1523 — مالك عن غير واحد: استفتي ابن مسعود بالكوفة في نكاح الأم بعد الابنة، فأرخص، فلما قدم المدينة أخبر أنه ليس كما قال، فرجع فأمر الرجل بفراق امرأته", en: "Muwatta 1523" }
summary:
  ar: "يروي مالك عن غير واحد أن عبد الله بن مسعود استفتي وهو بالكوفة عن نكاح الأم بعد الابنة، إذا لم تكن الابنة مسته، فأرخص في ذلك. ثم قدم المدينة فسأل عن ذلك، فأخبر أنه ليس كما قال، وإنما الشرط في الربائب، فرجع إلى الكوفة، فلم يصل إلى منزله حتى أتى الرجل الذي أفتاه بذلك، فأمره أن يفارق امرأته. {cite:muwatta-maruf-1997 p.39}"
