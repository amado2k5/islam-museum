label: { ar: "الموطأ 1523 — مالك عن غير واحد: استفتي ابن مسعود بالكوفة في نكاح الأم بعد الابنة، فأرخص، فلما قدم المدينة أخبر أنه ليس كما قال، فرجع فأمر الرجل بفراق امرأته", en: "Muwatta 1523", es: "Muwatta 1523", fr: "Muwatta 1523", ur: "موطا 1523", tr: "El-Muvatta 1523 — Malik, birden fazla kişiden rivayetle: İbn Mes'ud'dan Kufa'da, bir kişinin kızından sonra annesiyle evlenmesi konusunda fetva istendi ve o da buna izin verdi. Medine'ye geldiğinde, bunun söylediği gibi olmadığı kendisine bildirildi, bu yüzden geri döndü ve adama karısını boşamasını emretti.", id: "Al-Muwatta 1523 — Malik, berdasarkan riwayat dari lebih dari satu orang: Ibnu Mas'ud dimintai fatwa di Kufa mengenai menikahi ibu setelah menikahi anak perempuan, dan beliau memperbolehkannya. Ketika beliau datang ke Madinah, beliau diberitahu bahwa hal itu tidak seperti yang beliau katakan, maka beliau kembali dan memerintahkan pria itu untuk menceraikan istrinya." }
summary:
  ar: "يروي مالك عن غير واحد أن عبد الله بن مسعود استفتي وهو بالكوفة عن نكاح الأم بعد الابنة، إذا لم تكن الابنة مسته، فأرخص في ذلك. ثم قدم المدينة فسأل عن ذلك، فأخبر أنه ليس كما قال، وإنما الشرط في الربائب، فرجع إلى الكوفة، فلم يصل إلى منزله حتى أتى الرجل الذي أفتاه بذلك، فأمره أن يفارق امرأته. {cite:muwatta-maruf-1997 p.39}"
  tr: "Malik, birden fazla kişiden rivayetle, Abdullah ibn Mas'ud'a Kufa'dayken, eğer kızıyla cinsel ilişkiye girmemişse, kızından sonra annesiyle evlenmesi konusunda fetva sorulduğunu ve buna izin verdiğini anlatır. Bunun üzerine Medine'ye gidip konuyu araştırdı ve kendisine bunun söylediği gibi olmadığı, aksine bu şartın üvey kızlar için geçerli olduğu söylendi. Bunun üzerine Kufa'ya döndü ve evine varmadan önce kendisine bu fetvayı veren adama giderek karısını boşamasını emretti. {cite:muwatta-maruf-1997 s.39}"
  id: "Malik meriwayatkan dari lebih dari satu orang bahwa Abdullah ibn Mas'ud dimintai fatwa ketika berada di Kufa mengenai menikahi ibu setelah menikahi anak perempuan, jika anak perempuan tersebut belum berhubungan intim dengannya. Beliau memperbolehkannya. Kemudian beliau pergi ke Madinah dan menanyakan hal itu, dan diberitahu bahwa tidak seperti yang beliau katakan, melainkan syarat tersebut berlaku untuk anak perempuan tiri. Maka beliau kembali ke Kufa, dan sebelum sampai di rumahnya, beliau menemui orang yang telah memberikan fatwa tersebut dan memerintahkannya untuk menceraikan istrinya. {cite:muwatta-maruf-1997 p.39}"
