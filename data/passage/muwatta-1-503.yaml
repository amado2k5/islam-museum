label: { ar: "الموطأ 503 — صلاة الخوف يوم ذات الرقاع: طائفة تصف مع النبي وطائفة وجاه العدو", en: "Muwatta 503", es: "Muwatta 503", fr: "Muwatta 503", ur: "موطا 503", tr: "El-Muvatta 503 — Zâttü'l-Rika Günü Korku Duası: Bir grup Peygamberin yanında durdu, diğer grup ise düşmana karşı durdu.", id: "Al-Muwatta 503 — Shalat Ketakutan pada Hari Dhat al-Riqa’: Satu kelompok berdiri bersama Nabi dan kelompok lain menghadapi musuh." }
summary:
  ar: "أول حديث في باب صلاة الخوف؛ ويبين المحقق أن عنوان «كتاب صلاة الخوف» في المطبوع لا أصل له في النسخ أو الشروح. يرويه يحيى عن مالك عن يزيد بن رومان عن صالح بن خوات عمن صلى مع النبي يوم ذات الرقاع صلاة الخوف: صفّت طائفة معه وصفّت طائفة وجاه العدو، فصلى بالتي معه ركعة ثم ثبت قائماً وأتموا لأنفسهم ثم انصرفوا فصفوا وجاه العدو، وجاءت الطائفة الأخرى فصلى بهم الركعة التي بقيت من صلاته ثم ثبت جالساً وأتموا لأنفسهم ثم سلم بهم. ويخرّجه المحقق عند البخاري (4129) ومسلم (2/214) وأبي داود (1238) والنسائي (3/171) والشافعي والطبري والطحاوي والدارقطني والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (23/31). {cite:muwatta-maruf-1997 p.256} {cite:muwatta-maruf-1997 p.257}"
  tr: "Korku Namazı bölümündeki ilk hadis; editör, basılı baskıdaki \"Korku Namazı Kitabı\" başlığının el yazmalarında veya tefsirlerde hiçbir dayanağı olmadığını açıklıyor. Yahya, Malik'ten, o da Yezid ibn Ruman'dan, o da Salih ibn Khawat'tan, o da Zhatü'l-Rika Günü'nde Peygamberimizle birlikte Korku Namazı kılan birinden rivayet etmiştir: Bir grup onunla birlikte saf tuttu, diğer grup ise düşmana dönük olarak saf tuttu. O, yanındaki gruba bir rekat namaz kıldırdı, sonra onlar namazlarını tek tek tamamlayana kadar ayakta kaldı. Sonra onlar ayrılıp düşmana dönük olarak saf tuttular. Diğer grup geldi ve o, namazının kalan rekatını onlara kıldırdı. Sonra onlar namazlarını tek tek tamamlayana kadar oturdu ve sonra onlara selam verdi. Editör bunu el-Buhari (4129), Müslim (2/214), Ebu Davud (1238), el-Nesa'i (3/171), el-Şafi'i, el-Taberi, el-Tahavi, el-Darakutni ve el-Beyhaki'den Malik'in sahabelerinin rivayetleri aracılığıyla aktarıyor ve et-Temhid'e (23/31) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.256} {cite:muwatta-maruf-1997 s.257}"
  id: "Hadits pertama dalam bab tentang Shalat Ketakutan; editor mengklarifikasi bahwa judul “Kitab Shalat Ketakutan” dalam edisi cetak tidak memiliki dasar dalam manuskrip atau tafsir. Diriwayatkan oleh Yahya dari Malik, dari Yazid ibn Ruman, dari Salih ibn Khawat, dari seseorang yang shalat Shalat Ketakutan bersama Nabi pada Hari Dhat al-Riqa’: Satu kelompok berbaris bersamanya, dan kelompok lain berbaris menghadap musuh. Beliau memimpin kelompok bersamanya dalam satu rakaat, kemudian tetap berdiri sementara mereka menyelesaikan shalat mereka masing-masing. Kemudian mereka pergi dan berbaris menghadap musuh. Kelompok lain datang, dan beliau memimpin mereka dalam rakaat shalatnya yang tersisa. Kemudian beliau tetap duduk sementara mereka menyelesaikan shalat mereka masing-masing, dan kemudian beliau memimpin mereka dalam taslim (salam). Redaksi mengutipnya dari al-Bukhari (4129), Muslim (2/214), Abu Dawud (1238), al-Nasa’i (3/171), al-Syafi’i, al-Tabari, al-Tahawi, al-Daraqutni, dan al-Bayhaqi melalui rantai transmisi sahabat Malik, dan mengacu pada al-Tamhid (23/31). {kutip:muwatta-maruf-1997 hal.256} {kutip:muwatta-maruf-1997 hal.257}"
