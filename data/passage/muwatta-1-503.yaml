label: { ar: "الموطأ 503 — صلاة الخوف يوم ذات الرقاع: طائفة تصف مع النبي وطائفة وجاه العدو", en: "Muwatta 503" }
summary:
  ar: "أول حديث في باب صلاة الخوف؛ ويبين المحقق أن عنوان «كتاب صلاة الخوف» في المطبوع لا أصل له في النسخ أو الشروح. يرويه يحيى عن مالك عن يزيد بن رومان عن صالح بن خوات عمن صلى مع النبي يوم ذات الرقاع صلاة الخوف: صفّت طائفة معه وصفّت طائفة وجاه العدو، فصلى بالتي معه ركعة ثم ثبت قائماً وأتموا لأنفسهم ثم انصرفوا فصفوا وجاه العدو، وجاءت الطائفة الأخرى فصلى بهم الركعة التي بقيت من صلاته ثم ثبت جالساً وأتموا لأنفسهم ثم سلم بهم. ويخرّجه المحقق عند البخاري (4129) ومسلم (2/214) وأبي داود (1238) والنسائي (3/171) والشافعي والطبري والطحاوي والدارقطني والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (23/31). {cite:muwatta-maruf-1997 p.256} {cite:muwatta-maruf-1997 p.257}"
