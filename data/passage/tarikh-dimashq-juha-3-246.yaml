text: "… بعام ومعه نعيمان بن عمرو الأَنصاري، وسليط بن حرملة، وهما ممن شهد بدراً. وكان سليط على الزاد، وكان نعيمان مزاحاً، فقال لسليط : أطعمني، فقال : لا أطعمك حتى يأتي أبو بكر فقال له نعيمان : لأغيظنك، فمروا بقوم فقال …"
summary:
  ar: "مقطع من تاريخ مدينة دمشق، المجلد المصوَّر 3، ص 246، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Ta'rikh Madinat Dimashq, scan volume 3, p. 246, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "Ta'rikh Madinat Dimashq، اسکین جلد 3، ص 246 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ta'rikh Madinat Dimashq, volume numérisé 3, p. 246, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Ta'rikh Madinat Dimashq, volumen escaneado 3, p. 246, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Şam Tarihi, Resimli Cilt 3, sayfa 246'dan, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Sejarah Damaskus, Jilid Bergambar 3, halaman 246, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
