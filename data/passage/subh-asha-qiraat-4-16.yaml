text: "الجزء الثالث قال أبو جعفر النحاس فى صناعة الكتاب : ويقال إن جودة الخط انتهت إلى رجلين من أهل الشأم يقال لهما الضحَّاك وإسحاق بن حَمَّاد، وكانا يخطانِ الجليلَ؛ وكأنه يريد الطُّومار أو قريبًا منه. قال صاحب إعانة المنشء، وكان …"
