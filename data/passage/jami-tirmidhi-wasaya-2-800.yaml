text: "… اسم من اجترار البعير، وهي اللقمة التي يتعلل بها البعير، وقصعها : إخراجها. الوصايا هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ لا نَعْرِفُهُ إِلَّا مِنْ حَدِيثِ مَالِكِ بنِ مِغْوَلٍ. - بَابُ مَا جَاءَ: لا وَصِيَّةَ لِوَارِثِ حَدَّثَنَا هَنَّادٌ وَعَلِيٌّ بنُ حُجْرٍ قَالا : …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 800، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
