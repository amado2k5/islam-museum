text: "لو كنت من مازن لم تستبح إبلي بنو اللقيطة من ذهل بن شيبانا"
summary:
  ar: "بيت من قصيدة «لو كنت من مازن»، كما في طبعة 1916 لديوان الحماسة {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
  en: "Verse 1 of The poem 'Had you been of Mazin', as in the 1916 edition of the Hamasa."
