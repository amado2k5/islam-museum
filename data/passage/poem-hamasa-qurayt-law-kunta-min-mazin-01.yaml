  fr: "Verset 1 du poème « Si tu avais été de Mazin », tel qu’il figure dans l’édition de 1916 du Hamasa."
  ur: "نظم 'اگر تم مزین کے ہوتے' کی آیت 1، جیسا کہ حماسہ کے 1916 کے ایڈیشن میں ہے۔"
  tr: "“Mazen’den Olsaydım” şiirinden bir dize, Diwan al-Hamasa’nın 1916 baskısında olduğu gibi {{cite:hamasa-abu-tammam-ed-1916 s.6}}."
  id: "Sebuah bait dari puisi “Seandainya Aku Berasal dari Mazen”, seperti dalam edisi Diwan al-Hamasa tahun 1916 {{cite:hamasa-abu-tammam-ed-1916 p.6}}."
translations:
  en:
    text: "Had you been of Mazin, Banu al-Laqita of Dhuhl ibn Shayban would not have taken my camels."
