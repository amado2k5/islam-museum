label:
  ar: "مسلم 404b — قال الله على لسان نبيه: سمع الله لمن حمده"
  en: "Muslim 404b — God said on the tongue of His prophet: God hears whoever praises Him"
  ur: "مسلم 404b — اللہ نے اپنے نبی کی زبان پر فرمایا: اللہ نے سن لی جس نے اس کی حمد کی"
text: "وإذا قرأ فأنصتوا . وليس في حديث أحد منهم فإن الله قال على لسان نبيه سمع الله لمن حمده . إلا في رواية أبي كامل وحده عن أبي عوانة . قال أبو إسحاق قال أبو بكر ابن أخت أبي النضر …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 404b: قال الله على لسان نبيه: سمع الله لمن حمده. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 404b: God said on the tongue of His prophet: God hears whoever praises Him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 404b: اللہ نے اپنے نبی کی زبان پر فرمایا: اللہ نے سن لی جس نے اس کی حمد کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
