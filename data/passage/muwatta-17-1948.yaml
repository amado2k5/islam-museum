label: { ar: "الموطأ 1948 — يحيى عن مالك عن محمد بن يحيى بن حبان، وعن أبي الزناد عن الأعرج عن أبي هريرة: نهى رسول الله عن الملامسة والمنابذة", en: "Muwatta 1948", es: "Muwatta 1948", fr: "Muwatta 1948", ur: "موطا 1948", tr: "El-Muvatta 1948 — Yahya, Malik'ten, o da Muhammed ibn Yahya ibn Hibban'dan, o da Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet etmiştir: Allah'ın Resulü dokunmayı ve atmayı yasaklamıştır.", id: "Al-Muwatta 1948 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Muhammad ibn Yahya ibn Hibban dan berdasarkan riwayat Abu al-Zinad berdasarkan riwayat al-A'raj berdasarkan riwayat Abu Hurayrah: Rasulullah melarang menyentuh dan melempar." }
summary:
  ar: "يروي يحيى عن مالك عن محمد بن يحيى بن حبان، وعن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله نهى عن الملامسة والمنابذة. {cite:muwatta-maruf-1997 p.196} {cite:muwatta-maruf-1997 p.197}"
  tr: "Yahya, Malik'ten, o da Muhammed ibn Yahya ibn Hibban'dan, o da Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün dokunmayı ve atmayı yasakladığını nakletmiştir. {cite:muwatta-maruf-1997 s.196} {cite:muwatta-maruf-1997 s.197}"
  id: "Yahya meriwayatkan dari Malik, dari Muhammad ibn Yahya ibn Hibban, dan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah melarang menyentuh dan melempar. {cite:muwatta-maruf-1997 p.196} {cite:muwatta-maruf-1997 p.197}"
