label: { ar: "الموطأ 2738 — يحيى بن سعيد: العفريت الذي يطلب النبي بشعلة من نار ودعاء جبريل", en: "Muwatta 2738", es: "Muwatta 2738", fr: "Muwatta 2738", ur: "موطا 2738", tr: "El-Muvatta 2738 — Yahya bin Said: Peygamberi ateş meşalesi ve Cebrail duasıyla arayan cin.", id: "Al-Muwatta 2738 — Yahya bin Saeed: Jin yang mencari Nabi dengan obor api dan doa Jibril" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: أُسري برسول الله فرأى عفريتا من الجن يطلبه بشعلة من نار، كلما التفت رسول الله رآه، فقال له جبريل: ألا أعلمك كلمات تقولهن، إذا قلتهن طفئت شعلته وخر لفيه؟ فقال رسول الله: بلى. فقال جبريل: قل: أعوذ بوجه الله الكريم، وبكلمات الله التامات التي لا يجاوزهن بر ولا فاجر، من شر ما ينزل من السماء، ومن شر ما يعرج فيها، ومن شر ما ذرأ في الأرض، ومن فتن الليل والنهار، ومن طوارق الليل إلا طارقا يطرق بخير. ويذكر المحقق أن أكثر الروايات تذكر متنه، وأن أحمد وأبا داود والترمذي وغيرهم خرجوه من حديث عبد الله بن عمرو. {cite:muwatta-maruf-1997 p.540} {cite:muwatta-maruf-1997 p.541}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle şöyle buyurmuştur: Resulullah Miraç'a bindi ve elinde meşale olan bir cinin kendisini kovaladığını gördü. Resulullah her döndüğünde onu görüyordu. Cebrail ona, \"Sana öyle sözler öğreteyim ki, onları söylersen alevi söndürsün ve yüzüstü yere düşsün?\" dedi. Resulullah, \"Evet\" dedi. Cebrail, \"De ki: Gökten inenlerin şerrinden, gökte yükselenlerin şerrinden, yerde dağılanların şerrinden, gece ve gündüzün fitnelerinden ve gecenin musibetlerinden, hayır getiren bir musibet hariç, Allah'ın yüce yüzüne ve kusursuz sözlerine sığınırım. Araştırmacı, rivayetlerin çoğunda metnin geçtiğini ve Ahmed, Ebu Davud, Tirmizi ve diğerlerinin bunu Abdullah ibn Amr'ın hadisinden aldığını belirtiyor. {cite:muwatta-maruf-1997 s.540} {cite:muwatta-maruf-1997 s.541}"
  id: "Malik meriwayatkan dari Yahya bin Sa'id bahwa ia berkata: Rasulullah SAW dibawa dalam Perjalanan Malam dan melihat jin mengejarnya dengan obor api. Setiap kali Rasulullah SAW menoleh, beliau melihatnya. Jibril berkata kepadanya, \"Tidakkah aku akan mengajarkan kepadamu kata-kata yang jika kau ucapkan, akan memadamkan apinya dan membuatnya jatuh tersungkur?\" Rasulullah SAW menjawab, \"Ya.\" Jibril berkata, \"Ucapkanlah: Aku berlindung kepada wajah Allah yang mulia dan kepada firman Allah yang sempurna, yang tidak dapat dilampaui oleh orang-orang yang saleh maupun orang-orang yang durhaka, dari kejahatan yang turun dari langit, dan dari kejahatan yang naik ke langit, dan dari kejahatan yang tersebar di bumi, dan dari cobaan siang dan malam, dan dari musibah malam, kecuali musibah yang mendatangkan kebaikan.\" Peneliti menyebutkan bahwa sebagian besar riwayat menyebutkan teksnya, dan bahwa Ahmad, Abu Dawud, al-Tirmidhi, dan lainnya memasukkannya dari hadits Abdullah ibn Amr. {cite:muwatta-maruf-1997 p.540} {cite:muwatta-maruf-1997 p.541}"
