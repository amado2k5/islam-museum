label: { ar: "الموطأ 2738 — يحيى بن سعيد: العفريت الذي يطلب النبي بشعلة من نار ودعاء جبريل", en: "Muwatta 2738" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: أُسري برسول الله فرأى عفريتا من الجن يطلبه بشعلة من نار، كلما التفت رسول الله رآه، فقال له جبريل: ألا أعلمك كلمات تقولهن، إذا قلتهن طفئت شعلته وخر لفيه؟ فقال رسول الله: بلى. فقال جبريل: قل: أعوذ بوجه الله الكريم، وبكلمات الله التامات التي لا يجاوزهن بر ولا فاجر، من شر ما ينزل من السماء، ومن شر ما يعرج فيها، ومن شر ما ذرأ في الأرض، ومن فتن الليل والنهار، ومن طوارق الليل إلا طارقا يطرق بخير. ويذكر المحقق أن أكثر الروايات تذكر متنه، وأن أحمد وأبا داود والترمذي وغيرهم خرجوه من حديث عبد الله بن عمرو. {cite:muwatta-maruf-1997 p.540} {cite:muwatta-maruf-1997 p.541}"
