text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ عُثْمَانَ الشَّحَّامِ، قَالَ حَدَّثَنِي مُسْلِمُ بْنُ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّهَا سَتَكُونُ فِتْنَةٌ يَكُونُ الْمُضْطَجِعُ فِيهَا خَيْرًا مِنَ الْجَالِسِ وَالْجَالِسُ خَيْرًا مِنَ الْقَائِمِ وَالْقَائِمُ خَيْرًا مِنَ الْمَاشِي وَالْمَاشِي خَيْرًا مِنَ السَّاعِي \". قَالَ يَا رَسُولَ اللَّهِ مَا تَأْمُرُنِي قَالَ \" مَنْ كَانَتْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4256، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4256 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4256، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
