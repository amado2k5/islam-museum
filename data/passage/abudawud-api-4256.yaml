label: { ar: "سنن أبي داود 4256 — الأب والأبوة", en: "Sunan Abi Dawud 4256 — the father and fatherhood", ur: "سنن ابی داؤد 4256 — باپ اور والدیت", es: "Sunan Abi Dawud 4256 — El padre y la paternidad", fr: "Sunan Abi Dawud 4256 — Le père et la paternité", tr: "Sunan Abi Dawud 4256 — Baba ve Babalık", id: "Sunan Abi Dawud 4256 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ عُثْمَانَ الشَّحَّامِ، قَالَ حَدَّثَنِي مُسْلِمُ بْنُ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّهَا سَتَكُونُ فِتْنَةٌ يَكُونُ الْمُضْطَجِعُ فِيهَا خَيْرًا مِنَ الْجَالِسِ وَالْجَالِسُ خَيْرًا مِنَ الْقَائِمِ وَالْقَائِمُ خَيْرًا مِنَ الْمَاشِي وَالْمَاشِي خَيْرًا مِنَ السَّاعِي \". قَالَ يَا رَسُولَ اللَّهِ مَا تَأْمُرُنِي قَالَ \" مَنْ كَانَتْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4256، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4256 (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4256، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4256 (Pruebas y batallas feroces (Kitab Al-Fitan Wa Al-Malahim)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4256 (Épreuves et Combats acharnés (Kitab Al-Fitan Wa Al-Malahim)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4256 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4256, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
