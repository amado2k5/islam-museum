label: { ar: "الموطأ 2040 — مالك: لا يجوز للمتقارضين أن يتحاسبا ويتفاصلا والمال غائب عنهما، حتى يحضر المال، فيستوفي صاحب المال رأس ماله، ثم يقتسمان الربح على شرطهما", en: "Muwatta 2040", es: "Muwatta 2040", fr: "Muwatta 2040", ur: "موطا 2040", tr: "Al-Muwatta 2040 — Malik: Borç veren iki tarafın, para ellerinde yokken hesaplaşmaları ve meseleyi çözmeleri caiz değildir; ancak para ellerinde olduğunda, borç sahibi sermayesini geri alır ve daha sonra anlaşmalarına göre karı paylaşırlar.", id: "Al-Muwatta 2040 — Malik: Tidak diperbolehkan bagi kedua pihak yang berhutang untuk menyelesaikan perhitungan dan menyelesaikan masalah tersebut sementara uang tidak ada di antara mereka, hingga uang tersebut hadir, sehingga pemilik uang menerima kembali modalnya, dan kemudian mereka membagi keuntungan sesuai dengan kesepakatan mereka." }
summary:
  ar: "قال مالك: لا يجوز للمتقارضين أن يتحاسبا ويتفاصلا، والمال غائب عنهما، حتى يحضر المال، فيستوفي صاحب المال رأس ماله، ثم يقتسمان الربح على شرطهما. {cite:muwatta-maruf-1997 p.234}"
  tr: "Malik şöyle demiştir: Borç veren iki tarafın, para ellerinde olmadan hesaplaşmaları ve meseleyi çözmeleri caiz değildir; para ellerine geçene kadar, yani para sahibi sermayesini alana kadar, anlaşmaları gereğince kârı paylaşmaları gerekir. {cite:muwatta-maruf-1997 s.234}"
  id: "Malik berkata: Tidak diperbolehkan bagi kedua pihak dalam suatu perjanjian pinjaman untuk menyelesaikan perhitungan dan menyelesaikan masalah tersebut sementara uang tersebut tidak ada di antara mereka, hingga uang tersebut hadir, sehingga pemilik uang menerima modalnya, dan kemudian mereka membagi keuntungan sesuai dengan kesepakatan mereka. {cite:muwatta-maruf-1997 p.234}"
