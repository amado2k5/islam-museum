label: { ar: "الموطأ 2197 — يحيى عن مالك: الأمر المجتمع عليه عندنا أن كل من تصدق على ابنه بصدقة قبضها الابن، أو كان في حجر أبيه فأشهد له على صدقته، فليس له أن يعتصر شيئا من ذلك، لأنه لا يرجع في شيء من الصدقة", en: "Muwatta 2197", es: "Muwatta 2197", fr: "Muwatta 2197", ur: "موطا 2197", tr: "El-Muvatta 2197 — Yahya, Malik'ten rivayetle: Bizim aramızda ittifak şudur ki, kim oğluna sadaka verirse ve oğul bunu alırsa veya oğul babasının vesayeti altındaysa ve şahitler sadakasına şahitlik ederse, sadakanın hiçbirini geri alma hakkı yoktur, çünkü sadakadan hiçbir şey geri alamaz.", id: "Al-Muwatta 2197 — Yahya berdasarkan riwayat Malik: Konsensus di antara kami adalah bahwa siapa pun yang memberikan sedekah kepada anaknya, dan anak tersebut mengambil alih sedekah itu, atau jika anak tersebut berada di bawah perwalian ayahnya dan saksi-saksi memberikan kesaksian tentang sedekah tersebut, maka ia tidak berhak untuk mengambil kembali sedekah itu, karena ia tidak dapat menarik kembali sedekah tersebut." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر المجتمع عليه عندنا الذي لا اختلاف فيه: أن كل من تصدق على ابنه بصدقة قبضها الابن، أو كان في حجر أبيه فأشهد له على صدقته، فليس له أن يعتصر شيئا من ذلك؛ لأنه لا يرجع في شيء من الصدقة. {cite:muwatta-maruf-1997 p.301}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Aramızda üzerinde uzlaşılan ve ihtilaf bulunmayan konu şudur: Kim oğluna sadaka verirse ve oğul bu sadakayı alırsa, ya da oğul babasının vesayeti altındaysa ve sadakasıyla ilgili şahitler varsa, sadakadan hiçbir şey geri alamaz, çünkü sadakadan hiçbir şeyi geri alamaz. {cite:muwatta-maruf-1997 s.301}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Masalah yang disepakati di antara kita, yang tidak ada perselisihan mengenainya, adalah bahwa siapa pun yang memberikan sedekah kepada anaknya, dan anak itu menerimanya, atau jika anak itu berada di bawah perwalian ayahnya dan ada saksi yang hadir untuknya mengenai sedekah tersebut, maka ia tidak berhak untuk mengambil kembali sebagian pun dari sedekah itu, karena ia tidak dapat menarik kembali apa pun dari sedekah tersebut. {cite:muwatta-maruf-1997 p.301}"
