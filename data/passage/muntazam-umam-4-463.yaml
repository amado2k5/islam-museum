text: "… او زوجه فعليه كفارة يمين، وان من تزوج امرأة ولها زوج وهو لا يعلم لزمه ان يتصدق بخمسة دراهم، وان قطع السارق من اصول الاضابع، وان ذبائح اهل الكتاب محرمة واشتر طواف الذبح استقبال القبلة، وكل طعام تولاه اليهود والنصارى …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 4، ص 463، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
