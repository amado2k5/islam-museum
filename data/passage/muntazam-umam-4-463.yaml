  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin resimli 4. cildinin 463. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Müslüman olmayan milletler, dinler, mezhepler ve halklar tarayıcısı tarafından derlenmiştir."
