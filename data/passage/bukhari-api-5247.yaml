text: "… مِنَ الإِبِلِ، فَالْتَفَتُّ فَإِذَا أَنَا بِرَسُولِ اللَّهِ فَقُلْتُ يَا رَسُولَ اللَّهِ إِنِّي حَدِيثُ عَهْدٍ بِعُرْسٍ. قَالَ أَتَزَوَّجْتَ . قُلْتُ نَعَمْ. قَالَ أَبِكْرًا أَمْ ثَيِّبًا . قَالَ قُلْتُ بَلْ ثَيِّبًا. قَالَ فَهَلاَّ بِكْرًا تُلاَعِبُهَا وَتُلاَعِبُكَ . قَالَ فَلَمَّا قَدِمْنَا ذَهَبْنَا لِنَدْخُلَ، فَقَالَ أَمْهِلُوا حَتَّى تَدْخُلُوا لَيْلاً ـ أَىْ عِشَاءً ـ لِكَىْ تَمْتَشِطَ الشَّعِثَةُ، وَتَسْتَحِدَّ الْمُغِيبَةُ ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5247، فيه مزاح ودعابة. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 5247, with jesting and playfulness. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 5247، جس میں مزاح اور خوش طبعی ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 5247, avec plaisanterie et badinage. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 5247, con broma y jovialidad. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih el-Buhari'de 5247 numaralı hadis, mizah ve şakalar içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5247, yang berisi humor dan lelucon. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
