text: "… يُحْفظ عنه من أهل العلم. قال البيهقي : وفي وصية عائشة وعبادة بن الصامت وأبي هريرة، وأبي سعيد الخدري وأسماء بنت أبي بكرم : أن لا تتبعوني بنار. وروى ابن ماجه : أن أبا موسى الأشعري حين حضره الموت قال …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 543، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 543, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 543 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
