text: "… يُحْفظ عنه من أهل العلم. قال البيهقي : وفي وصية عائشة وعبادة بن الصامت وأبي هريرة، وأبي سعيد الخدري وأسماء بنت أبي بكرم : أن لا تتبعوني بنار. وروى ابن ماجه : أن أبا موسى الأشعري حين حضره الموت قال …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 543، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 543, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 543 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 4, pág. 543, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 4, page 543, mentionnant un testament ou des conseils d'adieu, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Seyyid Sabiq'in *Fıkıh el-Sünne* adlı eserinin 4. cildinin 543. sayfasından bir alıntı, vasiyet veya son sözleşmeden ve ölüm anından bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. *Vasiyetler, Miras, Antik Eserler ve Türbeler* tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Fiqh al-Sunnah* karya Sayyid Sabiq, Jilid 4, halaman 543, menyebutkan wasiat atau perjanjian terakhir, dan saat kematian; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban *Wasiat, Warisan, Barang Antik, dan Makam Suci*."
