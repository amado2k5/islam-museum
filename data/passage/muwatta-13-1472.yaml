label: { ar: "الموطأ 1472 — مالك: كل ما سئلت عنه من ميراث العصبة فعلى هذا النحو، انسب المتوفى ومن ينازع في ولايته من عصبته، واستشهد بآية أولي الأرحام", en: "Muwatta 1472" }
summary:
  ar: "يقول مالك وكل شيء سئلت عنه من ميراث العصبة فإنه على نحو هذا، انسب المتوفى ومن ينازع في ولايته من عصبته، فإن وجدت أحدا منهم يلقى المتوفى إلى أب لا يلقاه أحد منهم إلى أب دونه، فاجعل ميراثه للذي يلقاه إلى الأب الأدنى، دون من يلقاه إلى فوق ذلك. وإن وجدتهم يلقون إلى أب واحد يجمعهم، فانظر أقعدهم في النسب، واستشهد بآية أولي الأرحام في سورة الأنفال. {cite:muwatta-maruf-1997 p.20}"
