label: { ar: "الموطأ 1472 — مالك: كل ما سئلت عنه من ميراث العصبة فعلى هذا النحو، انسب المتوفى ومن ينازع في ولايته من عصبته، واستشهد بآية أولي الأرحام", en: "Muwatta 1472", es: "Muwatta 1472", fr: "Muwatta 1472", ur: "موطا 1472", tr: "El-Muvatta 1472 — Malik: Akrabaların mirasçılığı konusunda size sorulan her şey şöyledir: Ölen kişinin ve onun velayetini tartışan akrabalarının soyunu tespit edin ve kan akrabalarıyla ilgili ayeti zikredin.", id: "Al-Muwatta 1472 — Malik: Apa pun yang ditanyakan kepadamu mengenai warisan kerabat sedarah, maka caranya adalah sebagai berikut: Tetapkanlah garis keturunan almarhum dan kerabat sedarahnya yang berselisih mengenai perwaliannya, dan sebutkanlah ayat yang berkaitan dengan kerabat sedarah." }
summary:
  ar: "يقول مالك وكل شيء سئلت عنه من ميراث العصبة فإنه على نحو هذا، انسب المتوفى ومن ينازع في ولايته من عصبته، فإن وجدت أحدا منهم يلقى المتوفى إلى أب لا يلقاه أحد منهم إلى أب دونه، فاجعل ميراثه للذي يلقاه إلى الأب الأدنى، دون من يلقاه إلى فوق ذلك. وإن وجدتهم يلقون إلى أب واحد يجمعهم، فانظر أقعدهم في النسب، واستشهد بآية أولي الأرحام في سورة الأنفال. {cite:muwatta-maruf-1997 p.20}"
  tr: "Malik şöyle diyor: “Size akrabaların mirasçılığıyla ilgili sorulan her şey şu niteliktedir: Ölen kişinin ve akrabaları arasında velayetini tartışanların soyunu belirleyin. Eğer içlerinden birinin ölen kişiyi, hiçbirinin daha uzak bir babaya dayandırmadığı bir babaya dayandırdığını görürseniz, mirası en yakın babaya dayandıran kişiye verin, daha geriye uzananları hariç tutun. Eğer tek bir ortak babaya dayandırdıklarını görürseniz, en yakın soy bağına sahip olanı dikkate alın ve Enfal Suresi'ndeki kan akrabalarıyla ilgili ayeti zikredin.” {cite:muwatta-maruf-1997 s.20}"
  id: "Malik berkata, “Segala hal yang ditanyakan kepada kalian mengenai warisan kerabat laki-laki adalah seperti ini: Tentukan silsilah orang yang meninggal dan kerabat laki-lakinya yang berselisih mengenai perwaliannya. Jika kalian mendapati salah seorang dari mereka menelusuri silsilah orang yang meninggal tersebut kepada seorang ayah yang tidak dapat ditelusuri lebih jauh lagi kepada ayah yang lebih jauh, maka berikanlah warisannya kepada orang yang menelusuri silsilahnya kepada ayah terdekat, dengan mengesampingkan mereka yang menelusuri silsilahnya lebih jauh lagi. Jika kalian mendapati mereka menelusuri silsilahnya kepada satu ayah yang sama, maka pertimbangkanlah orang yang memiliki silsilah terdekat, dan sebutkan ayat tentang kerabat sedarah dalam Surah Al-Anfal.” {kutipan:muwatta-maruf-1997 hlm. 20}"
