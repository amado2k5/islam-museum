text: "… كان يَعْلَمُ أنه قد أَشرِكْتُ في الأمر معه، ثم جَعَلَ يَسْجَعُ لهم الأساجيعَ، ويَقُولُ لهم فيما يقولُ مضاهاةً للقرآن: لَقَذْ أَنْعَمَ الله على الحُبْلَى، أَخْرَجَ منها نَسَمَةً تَسْعَى، من بين صِفَاقٍ وَحَشَا. وَأَحَلَّ لهم الخَمْرَ والزِّنا، وَوَضَعَ عنهم الصَّلاة، وهو …"
