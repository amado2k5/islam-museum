label: { ar: "الموطأ 725 — ابن شهاب: لا يؤخذ في صدقة النخل الجعرور ولا مصران الفأرة ولا عذق ابن حبيق؛ ومالك: إنما تؤخذ الصدقة من أوساط المال", en: "Muwatta 725", es: "Muwatta 725", fr: "Muwatta 725", ur: "موطا 725", tr: "El-Muvatta 725 — İbn Şihab: Böcek böceği, fare bağırsağı ve İbn Hubeyq'in hurma salkımı, hurma zekâtı olarak alınmaz; ve Malik: Zekât, ancak malın ortalamasından alınır.", id: "Al-Muwatta 725 — Ibn Shihab: Kumbang kotoran, usus tikus, dan seikat kurma milik Ibn Hubayq tidak termasuk zakat kurma; dan Malik: Zakat hanya diambil dari rata-rata harta." }
text: "وإنما تؤخذ الصدقة من أوساط المال"
summary:
  ar: "يرويه مالك عن زياد بن سعد عن ابن شهاب، أنه قال: لا يؤخذ في صدقة النخل الجعرور ولا مصران الفأرة ولا عذق ابن حبيق، وهي أنواع رديئة من التمر، ويُعد على صاحب المال ولا يؤخذ منه في الصدقة. ويقول مالك: إنما مثل ذلك الغنم تُعد على صاحبها بسخالها والسخل لا يؤخذ منه في الصدقة، وقد يكون في الأموال ثمار لا تؤخذ الصدقة منها كالبردي وما أشبهه، لا يؤخذ من أدناه كما لا يؤخذ من خياره، وإنما تؤخذ الصدقة من أوساط المال. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسعيد بن عفير ويحيى بن بكير عند أبي عبيد في الأموال (1541)، وينقل عن ابن عبد البر ⁦(التمهيد 6/83–84)⁩ أنه مروي عن ابن شهاب عن أبي أمامة بن سهل بن حنيف عن أبيه عن النبي من رواية سفيان بن حسين وسليمان بن كثير ⁦(أبو داود 1607، ابن خزيمة 2313)⁩، ويرى المحقق أن الموصول ضعيف لأنهما ضعيفان في الزهري. {cite:muwatta-maruf-1997 p.363} {cite:muwatta-maruf-1997 p.364}"
  tr: "Malik, İbn Şihab'dan rivayetle Ziyad ibn Sa'd'dan naklederek şöyle buyurduğunu aktarmıştır: \"Hurma ağacının kalitesiz hurmaları, örneğin 'ja'rur', 'musaran al-ma'ra' ve 'dhaq ibn habiq' gibi hurmalar zekât olarak alınmaz. Bunlar mal sahibi tarafından sayılır, ancak ondan zekât olarak alınmaz.\" Malik ayrıca şöyle buyurmuştur: \"Aynı durum koyunlar için de geçerlidir; koyunlar, kuzularıyla birlikte sahibi tarafından sayılır ve kuzular zekât olarak alınmaz. Mal üzerinde zekât alınmayan meyveler de olabilir, örneğin papirüs ve benzeri. Bunların en düşük kalitedekileri de alınmaz, en iyileri de alınmaz. Zekât sadece malın orta kalitesinden alınır.\" Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Sa'id ibn Ufair ve Yahya ibn Bukayr tarafından rivayet edildiğini, Ebu Ubeyd'in el-Amwal'da (1541) kaydettiğini belirtiyor. İbn Abd el-Barr'ın (el-Tamhid 6/83-84) ise hadisin İbn Şihab'dan, Ebu Umame ibn Sahl ibn Huneyf'ten, babasından, Peygamberden, Sufyan ibn Hüseyin ve Süleyman ibn Kathir'in rivayetiyle nakledildiğini söylediğini aktarıyor (Ebu Davud 1607, İbn Huzeyme 2313). Araştırmacı, her ikisinin de el-Zuhri'den zayıf raviler olarak kabul edilmesi nedeniyle isnad zincirini zayıf olarak değerlendiriyor. {cite:muwatta-maruf-1997 s.363} {cite:muwatta-maruf-1997 s.364}"
  id: "Malik meriwayatkan dari Ziyad ibn Sa'd, dari Ibn Shihab, bahwa beliau berkata: \"Kurma berkualitas rendah, seperti 'ja'rur,' 'musaran al-ma'ra,' dan 'dhaq ibn habiq,' tidak diambil sebagai zakat. Kurma tersebut dihitung oleh pemilik harta, tetapi tidak diambil darinya sebagai zakat.\" Malik juga berkata: \"Hal yang sama berlaku untuk domba; domba dihitung oleh pemiliknya bersama dengan anak-anaknya, dan anak-anak domba tidak diambil sebagai zakat. Mungkin juga ada buah-buahan pada harta yang tidak diambil zakatnya, seperti papirus dan sejenisnya. Kualitas terendah dari buah-buahan ini tidak diambil, sebagaimana kualitas terbaiknya juga tidak diambil. Zakat hanya diambil dari kualitas rata-rata harta.\" Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Sa'id ibn 'Ufair, dan Yahya ibn Bukayr, sebagaimana dicatat oleh Abu 'Ubayd dalam al-Amwal (1541). Ia mengutip Ibn 'Abd al-Barr (al-Tamhid 6/83-84) yang mengatakan bahwa hadits ini diriwayatkan dari Ibn Shihab, dari Abu Umamah ibn Sahl ibn Hunayf, dari ayahnya, dari Nabi, melalui riwayat Sufyan ibn Husayn dan Sulayman ibn Kathir (Abu Dawud 1607, Ibn Khuzaymah 2313). Peneliti menganggap sanadnya lemah karena keduanya dianggap sebagai perawi lemah dari al-Zuhri. {cite:muwatta-maruf-1997 p.363} {cite:muwatta-maruf-1997 p.364}"
