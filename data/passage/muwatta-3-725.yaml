label: { ar: "الموطأ 725 — ابن شهاب: لا يؤخذ في صدقة النخل الجعرور ولا مصران الفأرة ولا عذق ابن حبيق؛ ومالك: إنما تؤخذ الصدقة من أوساط المال", en: "Muwatta 725" }
text: "وإنما تؤخذ الصدقة من أوساط المال"
summary:
  ar: "يرويه مالك عن زياد بن سعد عن ابن شهاب، أنه قال: لا يؤخذ في صدقة النخل الجعرور ولا مصران الفأرة ولا عذق ابن حبيق، وهي أنواع رديئة من التمر، ويُعد على صاحب المال ولا يؤخذ منه في الصدقة. ويقول مالك: إنما مثل ذلك الغنم تُعد على صاحبها بسخالها والسخل لا يؤخذ منه في الصدقة، وقد يكون في الأموال ثمار لا تؤخذ الصدقة منها كالبردي وما أشبهه، لا يؤخذ من أدناه كما لا يؤخذ من خياره، وإنما تؤخذ الصدقة من أوساط المال. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسعيد بن عفير ويحيى بن بكير عند أبي عبيد في الأموال (1541)، وينقل عن ابن عبد البر (التمهيد 6/83–84) أنه مروي عن ابن شهاب عن أبي أمامة بن سهل بن حنيف عن أبيه عن النبي من رواية سفيان بن حسين وسليمان بن كثير (أبو داود 1607، ابن خزيمة 2313)، ويرى المحقق أن الموصول ضعيف لأنهما ضعيفان في الزهري. {cite:muwatta-maruf-1997 p.363} {cite:muwatta-maruf-1997 p.364}"
