text: "… مرض عدته واذا أصابه خير هنأته واذا اصابته مصيبة عزيته واذامات اتبعت جنازته ولا تستطيل عليه بالبنيان فتحجب عنه الريح الا باذنه ولا تؤذه بقتار ريح قدرك الا أن تغرف له منها وان اشتريت فاكهة فاهد له فان لم تفعل …"
summary:
  ar: "مقطع من الترغيب والترهيب من الحديث الشريف، المجلد المصوَّر 2، ص 240، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), scan volume 2, p. 240, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الترغیب والترہیب من الحدیث الشریف، اسکین جلد 2، ص 240 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
