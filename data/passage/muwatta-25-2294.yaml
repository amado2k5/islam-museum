label: { ar: "الموطأ 2294 — مالك: المكاتب يكاتب عبده تخفيفا عنه أو طلبا للمال", en: "Muwatta 2294", es: "Muwatta 2294", fr: "Muwatta 2294", ur: "موطا 2294", tr: "El-Muvatta 2294 — Malik: Kölesinin yükünü hafifletmek veya para elde etmek amacıyla kölesiyle azat sözleşmesi yapmış olan köle.", id: "Al-Muwatta 2294 — Malik: Seorang budak yang telah mengadakan perjanjian pembebasan dengan budaknya untuk meringankan bebannya atau untuk mendapatkan uang" }
summary:
  ar: "قال مالك في المكاتب يكاتب عبده: يُنظر في ذلك؛ فإن كان أراد المحاباة لعبده المعروفة بالتخفيف عنه فلا يجوز، وإن كاتبه طلبا للمال والعون على كتابته فذلك جائز له. {cite:muwatta-maruf-1997 p.345} {cite:muwatta-maruf-1997 p.346}"
  tr: "Malik, kölesi için azat sözleşmesi yazan bir adam hakkında şunları söyledi: Bu mesele incelenmelidir. Eğer kölesinin yükünü hafifleterek ona ayrıcalık göstermeyi amaçlıyorsa, bu caiz değildir. Ancak, azat işlemini tamamlamak için para ve yardım talep ederek sözleşme yazıyorsa, bu onun için caizdir. {cite:muwatta-maruf-1997 s.345} {cite:muwatta-maruf-1997 s.346}"
  id: "Malik berkata mengenai seorang pria yang membuat kontrak pembebasan budaknya: Masalah ini harus diperiksa. Jika ia bermaksud menunjukkan keberpihakan kepada budaknya dengan meringankan bebannya, maka hal itu tidak diperbolehkan. Namun, jika ia membuat kontrak tersebut untuk meminta uang dan bantuan dalam menyelesaikan pembebasan, maka hal itu diperbolehkan baginya. {cite:muwatta-maruf-1997 p.345} {cite:muwatta-maruf-1997 p.346}"
