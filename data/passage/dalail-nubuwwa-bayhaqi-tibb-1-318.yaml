text: "أن رسول اللّٰه، لَفي، أتاه جبريل - - وهو يَلْعَبُ مع الغِلْمان، فأخذه، فصرعه، فشقَّ عن قلبه.، فاستخرج القلب، فاستخرج منه عَلَقَة، فقال : هذا حظُّ الشيطان منك. ثم غسله في طَسْت من ذهب بماء زمزم، ثم لأمَهُ، ثم أعاده …"
