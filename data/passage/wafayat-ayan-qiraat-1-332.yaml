text: "… فرج - بالجيم المنقوطة - وقال : قرأ القراءات على أبي الخير وسمع من أبي الحسن الفراء الموصلي وأبي الحسن علي بن ابراهيم البغدادي وأبي طاهر محمد بن محمد، وروى عنه كثيرون، وكان ينسب إلى بدعة ويقول بقدم الأعمال وبشيء …"
summary:
