label: { ar: "الموطأ 973 — عبد الرحمن بن حرملة الأسلمي: سأل رجل سعيد بن المسيب: أعتمر قبل أن أحج؟", en: "Muwatta 973", es: "Muwatta 973", fr: "Muwatta 973", ur: "موطا 973", tr: "Al-Muwatta 973 — Abd al-Rahman ibn Harmelah al-Aslami: Bir adam Saeed ibn al-Musayyab'a sordu: Hacdan önce umre yapmalı mıyım?", id: "Al-Muwatta 973 — Abd al-Rahman ibn Harmalah al-Aslami: Seorang pria bertanya kepada Saeed ibn al-Musayyab: Haruskah saya menunaikan umrah sebelum haji?" }
summary:
  ar: "يرويه مالك عن عبد الرحمن بن حرملة الأسلمي أن رجلاً سأل سعيد بن المسيب: أعتمر قبل أن أحج؟ ويذكر المحقق أن الجواب في الصفحة 461 التي لم تُدرج في هذه الدفعة، وأنه رواه عن مالك أبو مصعب (1105) وسويد. {cite:muwatta-maruf-1997 p.460} {cite:muwatta-maruf-1997 p.461}"
  tr: "Malik, Abdülrahman ibn Harmalah el-Aslami'den rivayet ettiğine göre, bir adam Sa'id ibn el-Musayyab'a şöyle sormuştu: \"Hacdan önce Umre yapmalı mıyım?\" Editör, cevabın bu baskıda yer almayan 461. sayfada olduğunu ve bunun Malik'ten Ebu Mus'ab (1105) ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.460} {cite:muwatta-maruf-1997 s.461}"
  id: "Malik meriwayatkannya dari Abd al-Rahman ibn Harmalah al-Aslami, bahwa seorang pria bertanya kepada Sa'id ibn al-Musayyab: \"Haruskah saya melaksanakan Umrah sebelum Haji?\" Editor mencatat bahwa jawabannya ada di halaman 461, yang tidak termasuk dalam edisi ini, dan bahwa itu diriwayatkan dari Malik oleh Abu Mus'ab (1105) dan Suwayd. {cite:muwatta-maruf-1997 p.460} {cite:muwatta-maruf-1997 p.461}"
