text: "… يقول: إن اللّهَ ورسولَه حرَّم بيع الخمر، والميتةِ، والخِنزير، والأضنَام. فقيل: يا رَسُول اللّهِ: أرأيت شُحوم الميتة، فإنها يُطلى بها السُّفن، ويُدهَنُ بها الجلودُ، ويَسْتَصْبحُ بها الناسُ؟ فقال: لَا، هُوَ حَرَامٌ ثمِ قَالَ لمَّا حَرَّمَ عَلَيْهِم شُحُومَها جَمَلُوهُ ثُمَّ بَاعُوهُ …"
