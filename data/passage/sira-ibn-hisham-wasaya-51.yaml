text: "… فانتمَىٰ إلى قريش، وَأَكْذَبَ نَفْسَهُ، فقال من الطويل : نَدِمْتُ عَلَىٰ قَوْلٍ مَضَىٰ كُنْتُ قُلْتُهُ تَبَيَنْتُ فِيهِ أَنْهُ قَوْلُ كَاذِبٍ بُكَيْمٌ وَنِصْفٌ عِنْدَ مَجْرَى الْكَوَاكِبِ فَلَيْتَ لِسَانِي كَانَ نِصْفَيْنٍ مِنْهُمَا أَبُونَا كِنَانِيَّ بِمَكَةَ قَبْرُهُ بِمُغْتَلِجِ الْبَطْحَاءِ بَيْنَ الأَخَاشِبِ لَنَا الرُّبْعُ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 51، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
