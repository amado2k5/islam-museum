text: |-
  وأعددت للحرب وثادة ا*
  ٢٣٠
  ⁦(باب/ لدال)⁩
  لمجاورتها الالف الساكسة وعوّس منها الهاء فى آخره وراودته على كذامر اودة وروادا
  أى أردته وراد الكلا يروده روداورياد اوار تاده ار تيادابعنى أى طلبه وفى الحديث اذابال
  أحدكم فلير تدابونه أى يطلب.كانالينا أو منخدراوالرائد الذى يرسل فى طلب الكلا يقال
  لا يكذب الرائد أهله وراد الشيير ود أى جاءوذهب والرائديد الرحى وهو العود الذى
  يقبض عله الطاحن اذا أداره ورياد الابل اختلافها فى المرعى مقبلة ومدبرة والموضع
  مراد وكذلك مراد الريح ووالم كان الذى يذهب فيه ويجاء قال جندل
  والال فى كل مرادهوجل * أبوزيد الرادة من النساهغير مهموز الطوافة في بيوت
  جاراتها قال والرؤدة والرأدة بالهمز الشابة الحسنة تقول رادت الرأة تزودرودانافهى رادة
  اذا أ كثرت الاختلاف الى بيوت جاراتها ورجل رأد بعنى رائدوهونهل بالتجريك بع-ف
  فاعل كالفرط بعن الفارط قال أبوذؤيب يصف رجلاحاجاطلب عسلا
  فبان بجمع ثم آل الى مف • فأصبح رادايتفى المزج بالسهل
  ورائد الميزعوّارها الذى يرود فيها ويقد ل راد وساده اذ الم يستقرّ والمرود الميل وحديدة
  تدور فى اللجام ومى ورالبكرة اذا كان من حديد وفلان يمشى على رود أى على مهل قال
  الشاعر كانها تمل يمشى على رود وتصغيره رويد تقول منه أرود فى السيرارواد اومرودا
  أى رفق وقال امر ؤالقيس (١ جواد المهنة والمرود وبفتح الميم أيضامثل المخرج والخرح
  وقوله-م الدهر أرود ذوغير أى يعمل هله فى سكون لا يشعر به وتقول رويدك عمرا فالكاف
  للخطاب لاء وضع لها من الاعراب لانه اليست باسم ورويدغير مضاف اليها وهو متعدالى
  عرولانه اسم سمو به الفعل يعمل عمل الافعال وتفسيررويدمهلا وتفسيررويدك أمهل لان
  الكاف انى تدخله اذا كان بمعنى أفعل دون غيره وانما حركت الدال لا اتقاء الساكنيز
  ولابت نصب المصادروهو مصغر مأمور به لانه تصغيرا لترخيم من ارواد وهو مصدر ارود
  يرود وله أربعة أوحه اسم للفعل وصفة وحال ومصدرفالاسم نحوة ولك رويد عمرا أى أرود
  حمرابمع-ف امهله والصفة غوقولك سار واسيرارويدا والحال فحوقولك سار القوم دويدا
  لمما اتصل بالمعرفة صار الالها والمصدر نحوق ولك رويد عمر وبالاضافة كة وله تعالى
  فضرب الرقاب يد) الريد اليد وهوالحرف الناتئ من الجبل وايمع ريودوريح ريدة
  ورادة وريدانة أى لينة الهبوب قال هميان بن محافة
  جرت عليها كل ريح ريدة * هوجاءسفواء نؤوج الغدوة
  صل الزاى أد) زأدته أزأده زأدا أى أفزعته وزئدفهو مزؤود أى
  .ذعور بد الربدزيدالماء والبعيد والفضة وغيرها والربدة أخص منه تقول أزيد
  الشراب وب رمزبد أى مائج يقسذف بالزبدوأز بدالدرأى نور والزبدبالضم زبد اللين
  والزبدة أخصر منه وزبدت الرجل أزيده بالكسمرزيدا أى رضخت لهمن مال وفى الحسديث
  إنا لا نقبل زبد المشركين اى رفدهم وزبدت المرأقسقاء ها أى مخضته -تى يخرج نبده وزبدته
  أزبده بالضم أى أطعمته الزبد وتزييد القعان تنفيشه وزبد شدق فلان وتزبد ؟عنى ويقسال تزبد
  اليميزاذا أسرع اليها وزباد اللبز بالضم والتندعدمالاخير فيه وفى المدل اختلط اللخاثر
  بالرياد
