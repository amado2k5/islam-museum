text: "… البيض على الخربق، وينفع الجرب المتقرّح، وإذا خلط بالملح قلع النار الفارسي. آلات المفاصل : ينفع من الرعشة، وقد يجعل مع الحلبة على النقرس الي ي ل وينطل طبيخه على أوجاع المفاصل وحل، ويضمّد به، نفع من النقرس ووجع المفاصل. …"
summary:
