text: "… البيض على الخربق، وينفع الجرب المتقرّح، وإذا خلط بالملح قلع النار الفارسي. آلات المفاصل : ينفع من الرعشة، وقد يجعل مع الحلبة على النقرس الي ي ل وينطل طبيخه على أوجاع المفاصل وحل، ويضمّد به، نفع من النقرس ووجع المفاصل. …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 531، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 531, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 531 کا اقتباس جس میں درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 531, que menciona el dolor, enfermedades específicas, los órganos del cuerpo, cirugía, circuncisión y férulas, medicamentos y farmacia; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 531, qui mentionne la douleur, les maladies nommées, les organes du corps, la chirurgie, la circoncision et les attelles, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
