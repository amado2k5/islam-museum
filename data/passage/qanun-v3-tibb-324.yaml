text: "… المدّة لم يبعد أن ينجح، فليس جذب الكي وإفساده لجوهر السم كجذب غيره وإفساده، فإن عاق عن ذلك عائق استعملت الأدوية التي تقوم مقام الكي، مثل مرهم الملح والأدوية المحمّرة كضماد الخردل ونا ولا تدخله في مثل هذا الوقت الحمام …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 324، يذكر الكي، والجراحة والختان والجبائر، والدواء، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 324, that mentions cautery, surgery, circumcision and splints, the drug, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 324 کا اقتباس جس میں داغنا، جراحت، ختنہ اور پٹیاں، دوا، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 324, que menciona la cauterización, la cirugía, la circuncisión y las férulas, el medicamento, el veneno y el antídoto, los fármacos y la farmacia; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 324, qui mentionne la cautérisation, la chirurgie, la circoncision et les attelles, le médicament, le poison et l'antidote, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Kısım, s. 324'ten bir bölüm; yakma, cerrahi, sünnet, atel, ilaç, zehir ve panzehir, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 3, hlm. 324, yang menyebutkan kauterisasi, pembedahan, sunat, bidai, obat-obatan, racun dan penawarnya, narkoba dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
