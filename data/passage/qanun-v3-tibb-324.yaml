text: "… المدّة لم يبعد أن ينجح، فليس جذب الكي وإفساده لجوهر السم كجذب غيره وإفساده، فإن عاق عن ذلك عائق استعملت الأدوية التي تقوم مقام الكي، مثل مرهم الملح والأدوية المحمّرة كضماد الخردل ونا ولا تدخله في مثل هذا الوقت الحمام …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 324، يذكر الكي، والجراحة والختان والجبائر، والدواء، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 324, that mentions cautery, surgery, circumcision and splints, the drug, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 324 کا اقتباس جس میں داغنا، جراحت، ختنہ اور پٹیاں، دوا، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
