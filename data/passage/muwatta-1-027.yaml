text: "إن شدة الحر من فيح جهنم، فإذا اشتد الحر فأبردوا عن الصلاة"
summary:
  ar: "أول حديث في باب النهي عن الصلاة بالهاجرة. يرويه يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً: أمر النبي بتأخير الصلاة عند اشتداد الحر حتى ينكسر، لأن شدة الحر من فيح جهنم، وأخبر أن النار اشتكت إلى ربها أن بعضها أكل بعضاً فأذن لها بنفسين في كل عام، نفس في الشتاء ونفس في الصيف. ويذكر المحقق أنه رواه عن مالك أبو مصعب الزهري وسويد بن سعيد. {cite:muwatta-maruf-1997 p.47}"
