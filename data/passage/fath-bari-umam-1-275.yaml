text: "… في الأصل اسم للهودج. قوله : الحيرة بكسر المهملة وسكون التحتانية وفتح الراء كانت بلد ملوك العرب الذين تحت حكم آل فارس، وكان ملكهم يومئذ إياس بن قبيصة الطائي وليها من تحت يد كسرى بعد قتل النعمان بن المنذر، ولهذا …"
