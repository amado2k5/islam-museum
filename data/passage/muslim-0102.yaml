label: { ar: "مسلم 102 — من غشنا فليس منا", en: "Muslim 102 — Whoever cheats us is not one of us" }
text: "مر رسول الله على صبرة طعام فأدخل يده فيها فنالت أصابعه بللاً، فقال: ما هذا يا صاحب الطعام؟ قال: أصابته السماء يا رسول الله؛ قال: «أفلا جعلته فوق الطعام كي يراه الناس؟ من غشني فليس مني»"
summary:
  ar: "رواية أبي هريرة في كتاب الإيمان من صحيح مسلم؛ البائع الذي أخفى البلل تحت صبرة الطعام — نص الغش التجاري الأشهر في الدواوين."
