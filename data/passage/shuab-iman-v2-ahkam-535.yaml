text: "… في آخر كتاب البيوع من كتاب السنن أن الصحابةم فمن بعدهم تكلموا في ذلك فمنهم من كره ذلك ومنهم من كره بيعها ولمٍ يكره اشتراءها ومعنى الكراهية والله أعلم تعظيم المصحف من أن يجعل متجراً، وقد رخص في بيعها جماعة …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 535، يرد فيه ذكر الكراهة، والرخصة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 535, whose wording mentions dislike (karaha), the concession (rukhsa), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 535 کا اقتباس جس میں کراہت، رخصت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
