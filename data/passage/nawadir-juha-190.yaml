label: { ar: "نوادر جحا الكبرى، ص 86 — «وأنا لم أقدر أن أركبه»", en: "Nawadir Juha al-Kubra, p. 86 — 'And I Could Not Ride It'", ur: "نوادر جحا الکبریٰ، ص 86 — «اور میں اس پر سوار نہ ہو سکا»", fr: "Nawadir Juha al-Kubra, p. 86 — « Et moi, je n'ai pas pu le monter »", es: "Nawadir Juha al-Kubra, p. 86 — «Y yo no pude montarlo»", tr: "Juha'nın Büyük Anekdotları, s. 86 — “Ve ben ona binemedim”", id: "Anekdot Hebat Juha, hlm. 86 — “Dan aku tidak mampu menungganginya”" }
text: "… وأنا لم أقدر أن أركبه كان قوم يتفاخرون بفروسيتهم في أيام الصبا، فنهض الشيخ، وقال: جيء ذاتَ يوم بجوادٍ حرونٍ للغاية، لا يُمكِنُ التقرّبُ منه، فتقدَّم إليه أحد شجعان القرية فلَّم يقدر على ركوبه ولا التقرب منه، وقفز واحد على …"
summary:
  ar: "تفاخر القرويون بالفروسية، فألقى حصان جامح أول الرجال عن ظهره؛ فجرّبه جحا، بدافع التفاخر، فأمسك عرفه ووثب، وقال إنه لم يستطع أن يركبه. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  en: "Villagers boast of horsemanship; a wild horse throws the first men; Juha, stirred by the boasting, tries it, grabs its mane and leaps, and says that he could not ride it. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  ur: "گاؤں والوں نے گھڑ سواری پر فخر کیا؛ ایک سرکش گھوڑے نے پہلے آدمیوں کو گرا دیا؛ جحا نے ان کی ڈینگوں پر خود آزمایا، اس کی ایال پکڑ کر چھلانگ لگائی، اور کہا کہ میں اس پر سوار نہ ہو سکا۔ {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  fr: "Des villageois se vantent de leur art équestre; un cheval sauvage désarçonne les premiers hommes; Juha, piqué par ces vantardises, l'essaie, saisit sa crinière et bondit, et dit qu'il n'a pas pu le monter. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  es: "Unos aldeanos presumen de equitación; un caballo salvaje derriba a los primeros hombres; Juha, picado por las fanfarronadas, lo prueba, agarra su crin y salta, y dice que no pudo montarlo. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
  tr: "Köylüler at binme becerileriyle övünürken, vahşi bir at ilk adamı sırtından attı. Gösteriş yapma arzusuyla hareket eden Juha, atı denedi, yelesinden tuttu ve binemediğini söyleyerek attan indi. {cite:juha-nawadir-kubra-djuwaydi s. 86}"
  id: "Para penduduk desa sedang membual tentang kemampuan mereka menunggang kuda ketika seekor kuda liar melemparkan orang pertama dari punggungnya. Juha, yang didorong oleh keinginan untuk pamer, mencoba menungganginya, meraih surainya, dan melompat turun, sambil mengatakan bahwa dia tidak bisa menungganginya. {cite:juha-nawadir-kubra-djuwaydi p. 86}"
