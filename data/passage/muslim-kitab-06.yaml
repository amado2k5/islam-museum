  ar: "صحيح مسلم، كتاب صلاة المسافرين وقصرها"
  en: "Sahih Muslim, Book 6: The Book of Prayer - Travellers"
  ur: "صحیح مسلم، کتاب صلاۃ المسافرین وقصرہا"
  es: "Sahih Muslim, Libro 6: El Libro de la Oración - Viajeros"
