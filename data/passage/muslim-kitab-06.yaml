summary:
  ar: "القسم 6 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة المسافرين وقصرها»، ويضم فيها النصوص من 1570 إلى 1950 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 6 of Sahih Muslim (The Book of Prayer - Travellers) in the division of the open hadith dataset the museum took its reports from: reports 1570 to 1950 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 6، عنوان «کتاب صلاۃ المسافرین وقصرہا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1570 تا 1950۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 6 de Sahih Muslim (El Libro de la Oración - Viajeros) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1570 al 1950, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre de la prière – Guide du voyageur), dans la section 1570 à 1950 de la base de données ouverte. Il conserve ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
