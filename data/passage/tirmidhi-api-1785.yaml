label: { ar: "جامع الترمذي 1785 — الأب والأبوة", en: "Jami' al-Tirmidhi 1785 — the father and fatherhood", ur: "جامع ترمذی 1785 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1785 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1785 — le père et la paternité" }
text: "… بْنُ حُبَابٍ، وَأَبُو تُمَيْلَةَ يَحْيَى بْنُ وَاضِحٍ عَنْ عَبْدِ اللَّهِ بْنِ مُسْلِمٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ وَعَلَيْهِ خَاتَمٌ مِنْ حَدِيدٍ فَقَالَ \" مَا لِي أَرَى عَلَيْكَ حِلْيَةَ أَهْلِ النَّارِ \". ثُمَّ جَاءَهُ وَعَلَيْهِ خَاتَمٌ مِنْ صُفْرٍ فَقَالَ \" مَا لِي أَجِدُ مِنْكَ رِيحَ الأَصْنَامِ \". ثُمَّ أَتَاهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1785، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1785 (The Book on Clothing), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1785، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1785 (El Libro de la Vestimenta), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1785 (Le Livre des vêtements), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
