summary:
  ar: "قال مالك في أمة تعتق وهي حامل من زوج مملوك، ثم يعتق زوجها قبل أن تضع أو بعده: إن ولاء الحمل للذي أعتق أمه، لأن الحمل أصابه الرق قبل أن تعتق أمه، بخلاف ما تحمله الأم بعد العتاقة. {cite:muwatta-maruf-1997 p.338}"
