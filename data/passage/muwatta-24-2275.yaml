label: { ar: "الموطأ 2275 — مالك: ولاء الحمل من الأمة المعتقة إذا أعتق زوجها", en: "Muwatta 2275", es: "Muwatta 2275", fr: "Muwatta 2275", ur: "موطا 2275", tr: "Al-Muwatta 2275 — Malik: Kocası tarafından azat edilen bir köle kadının doğurduğu çocuğun miras hakkı.", id: "Al-Muwatta 2275 — Malik: Warisan anak yang lahir dari seorang wanita budak yang telah dibebaskan jika suaminya membebaskannya." }
summary:
  ar: "قال مالك في أمة تعتق وهي حامل من زوج مملوك، ثم يعتق زوجها قبل أن تضع أو بعده: إن ولاء الحمل للذي أعتق أمه، لأن الحمل أصابه الرق قبل أن تعتق أمه، بخلاف ما تحمله الأم بعد العتاقة. {cite:muwatta-maruf-1997 p.338}"
  tr: "Malik, hamile iken köle kocasından azat edilen ve daha sonra kocası doğumdan önce veya sonra azat edilen bir köle kadın hakkında şöyle demiştir: Çocuğun bağlılığı, annesini azat edene aittir; çünkü çocuk, annesi azat edilmeden önce köleleştirilmiştir, azat edildikten sonra gebe kalınan bir çocuktan farklıdır. {cite:muwatta-maruf-1997 s.338}"
  id: "Malik berkata mengenai seorang perempuan budak yang dibebaskan saat hamil oleh suami yang juga seorang budak, dan kemudian suaminya dibebaskan sebelum atau setelah ia melahirkan: kesetiaan anak itu adalah kepada orang yang membebaskan ibunya, karena anak itu diperbudak sebelum ibunya dibebaskan, tidak seperti anak yang dikandung setelah dibebaskan. {cite:muwatta-maruf-1997 p.338}"
