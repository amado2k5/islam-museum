label: { ar: "الموطأ 1998 — مالك عن نافع عن ابن عمر: أن رسول الله نهى عن النجش، وتفسيره أن تعطيه بسلعته أكثر من ثمنها وليس في نفسك شراؤها، فيقتدي بك غيرك", en: "Muwatta 1998", es: "Muwatta 1998", fr: "Muwatta 1998", ur: "موطا 1998", tr: "El-Muvatta 1998 — Malik, Nafi’den, o da İbn Ömer’den rivayetle: Allah Resulü necş'i yasaklamıştır ve bunun açıklaması şudur: Birine, malını satın alma niyeti olmadan, malın değerinden daha fazla teklif etmek, böylece başkalarının da seni örnek almasıdır.", id: "Al-Muwatta 1998 — Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Ibn Umar: bahwa Rasulullah SAW melarang Najsh, dan penjelasannya adalah bahwa kamu menawarkan sesuatu kepada seseorang dengan harga lebih dari harga barangnya tanpa bermaksud membelinya, agar orang lain mengikuti contohmu." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله نهى عن النجش. قال مالك: والنجش أن تعطيه بسلعته أكثر من ثمنها، وليس في نفسك شراؤها، فيقتدي بك غيرك. {cite:muwatta-maruf-1997 p.217} {cite:muwatta-maruf-1997 p.218}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü necş'i yasaklamıştır. Malik şöyle demiştir: Necş, başkalarının da seni örnek alması için, bir başkasının malının fiyatından daha fazlasını, satın alma niyeti olmadan teklif etmektir. {cite:muwatta-maruf-1997 s.217} {cite:muwatta-maruf-1997 s.218}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa Rasulullah SAW melarang Najsh. Malik berkata: Najsh adalah ketika kamu menawarkan sesuatu kepada seseorang dengan harga lebih dari harga barangnya, tanpa bermaksud membelinya, agar orang lain mengikuti contohmu. {cite:muwatta-maruf-1997 p.217} {cite:muwatta-maruf-1997 p.218}"
