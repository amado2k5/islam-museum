label: { ar: "الموطأ 1305 — مالك: إن باع الطعام المأخوذ من أرض العدو وهو في الغزو جعل ثمنه في غنائم المسلمين، وإن كان يسيرا تافها فلا بأس", en: "Muwatta 1305" }
summary:
  ar: "سئل مالك عن الرجل يصيب الطعام في أرض العدو فيأكل منه ويتزود، فيفضل منه شيء، أيصلح له أن يحبسه فيأكله في أهله، أو يبيعه قبل أن يقدم بلاده فينتفع بثمنه؟ فقال إن باعه وهو في الغزو فإنه يرى أن يجعل ثمنه في غنائم المسلمين، وإن بلغ به تلده فلا بأس أن يأكله وينتفع به إذا كان يسيرا تافها. {cite:muwatta-maruf-1997 p.582}"
