label: { ar: "الموطأ 1305 — مالك: إن باع الطعام المأخوذ من أرض العدو وهو في الغزو جعل ثمنه في غنائم المسلمين، وإن كان يسيرا تافها فلا بأس", en: "Muwatta 1305", es: "Muwatta 1305", fr: "Muwatta 1305", ur: "موطا 1305", tr: "El-Muvatta 1305 — Malik: Eğer bir kişi askeri sefer sırasında düşman topraklarından ele geçirdiği yiyecekleri satarsa, fiyatı Müslümanlar için savaş ganimetleri arasına katılmalıdır. Küçük, önemsiz bir miktar ise bunda bir sakınca yoktur.", id: "Al-Muwatta 1305 — Malik: Jika seseorang menjual makanan yang diambil dari wilayah musuh saat melakukan kampanye militer, maka harga jualnya harus diberikan sebagai rampasan perang bagi kaum Muslimin. Jika jumlahnya kecil dan tidak signifikan, maka tidak ada salahnya melakukan itu." }
summary:
  ar: "سئل مالك عن الرجل يصيب الطعام في أرض العدو فيأكل منه ويتزود، فيفضل منه شيء، أيصلح له أن يحبسه فيأكله في أهله، أو يبيعه قبل أن يقدم بلاده فينتفع بثمنه؟ فقال إن باعه وهو في الغزو فإنه يرى أن يجعل ثمنه في غنائم المسلمين، وإن بلغ به تلده فلا بأس أن يأكله وينتفع به إذا كان يسيرا تافها. {cite:muwatta-maruf-1997 p.582}"
  tr: "Malik'e, düşman topraklarında yiyecek bulan, bir kısmını yiyen ve erzak alan, ancak bir kısmı artan bir adam hakkında soru soruldu. Bu adamın artanı ailesiyle birlikte yemesi mi, yoksa memleketine dönmeden önce satıp gelirinden faydalanması mı caizdir? Malik şöyle dedi: Eğer bunu sefer sırasında satarsa, fiyatını Müslümanlar için savaş ganimetlerine eklemelidir. Eğer bu miktar ailesinin geçimini sağlayacak kadar olursa, az ve önemsiz bir miktar ise yemesinde ve gelirinden faydalanmasında bir sakınca yoktur. {cite:muwatta-maruf-1997 s.582}"
  id: "Malik ditanya tentang seorang pria yang menemukan makanan di wilayah musuh, memakan sebagiannya, dan mengambil bekal, tetapi sebagian lainnya masih tersisa. Apakah diperbolehkan baginya untuk menyimpan dan memakannya bersama keluarganya, atau menjualnya sebelum kembali ke tanah airnya dan mengambil keuntungan dari harganya? Beliau menjawab: Jika ia menjualnya saat dalam perang, maka ia harus menambahkan harganya ke rampasan perang untuk kaum Muslimin. Jika harganya mencapai bagian keluarganya, maka tidak ada salahnya jika ia memakannya dan mengambil keuntungan darinya jika jumlahnya sedikit dan tidak signifikan. {cite:muwatta-maruf-1997 p.582}"
