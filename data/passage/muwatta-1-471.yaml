label: { ar: "الموطأ 471 — كان يصلي وهو حامل أمامة بنت زينب", en: "Muwatta 471" }
text: "كان يصلي وهو حامل أمامة بنت زينب بنت رسول الله، فإذا سجد وضعها وإذا قام حملها"
summary:
  ar: "أول حديث في باب جامع الصلاة. يرويه يحيى عن مالك عن عامر بن عبد الله بن الزبير عن عمرو بن سليم الزرقي عن أبي قتادة الأنصاري: كان النبي يصلي وهو حامل أمامة بنت زينب بنت رسول الله، وأبوها أبو العاص بن الربيع، فإذا سجد وضعها وإذا قام حملها. ويبين المحقق أن يحيى سمى أبا العاص «ابن ربيعة» وتابعه ابن وهب والقعنبي وغيرهم وهو وهم صوابه «الربيع» كما عند أبي مصعب ومعن ومحمد بن الحسن، ويخرّج الحديث عند البخاري (516) ومسلم (2/73) وأبي داود (917) والنسائي (3/10) والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (20/93). {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.241}"
