label: { ar: "الموطأ 471 — كان يصلي وهو حامل أمامة بنت زينب", en: "Muwatta 471", es: "Muwatta 471", fr: "Muwatta 471", ur: "موطا 471", tr: "Al-Muwatta 471 — Umame bint Zaynab'ı kucağında taşıyarak namaz kılıyordu.", id: "Al-Muwatta 471 — Dia sedang shalat sambil menggendong Umamah binti Zaynab" }
text: "كان يصلي وهو حامل أمامة بنت زينب بنت رسول الله، فإذا سجد وضعها وإذا قام حملها"
summary:
  ar: "أول حديث في باب جامع الصلاة. يرويه يحيى عن مالك عن عامر بن عبد الله بن الزبير عن عمرو بن سليم الزرقي عن أبي قتادة الأنصاري: كان النبي يصلي وهو حامل أمامة بنت زينب بنت رسول الله، وأبوها أبو العاص بن الربيع، فإذا سجد وضعها وإذا قام حملها. ويبين المحقق أن يحيى سمى أبا العاص «ابن ربيعة» وتابعه ابن وهب والقعنبي وغيرهم وهو وهم صوابه «الربيع» كما عند أبي مصعب ومعن ومحمد بن الحسن، ويخرّج الحديث عند البخاري (516) ومسلم (2/73) وأبي داود (917) والنسائي (3/10) والدارمي وأحمد من طرق أصحاب مالك، ويحيل على التمهيد (20/93). {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.241}"
  id: "Hadits pertama dalam bab tentang shalat lengkap. Diriwayatkan oleh Yahya dari Malik, dari 'Amir ibn 'Abdullah ibn al-Zubayr, dari 'Amr ibn Salim al-Zuraqi, dari Abu Qatada al-Ansari: Nabi (shalawat dan salam kepadanya) biasa shalat sambil menggendong Umamah, putri Zaynab, putri Rasulullah (shalawat dan salam kepadanya), yang ayahnya adalah Abu al-'As ibn al-Rabi'. Ketika beliau sujud, beliau menurunkannya, dan ketika beliau berdiri, beliau menggendongnya kembali. Peneliti mengklarifikasi bahwa Yahya menyebut Abu al-'As sebagai \"Ibn Rabi'ah,\" dan Ibn Wahb, al-Qa'nabi, dan lainnya mengikutinya dalam hal ini, yang merupakan kesalahan. Nama yang benar adalah \"al-Rabi',\" sebagaimana diriwayatkan oleh Abu Mus'ab, Ma'n, dan Muhammad ibn al-Hasan. Hadits ini ditemukan dalam al-Bukhari (516), Muslim (2/73), Abu Dawud (917), al-Nasa'i (3/10), al-Darimi, dan Ahmad melalui sanad para sahabat Malik. Peneliti merujuk pada al-Tamhid (20/93). {cite:muwatta-maruf-1997 p.240} {cite:muwatta-maruf-1997 p.241}"
