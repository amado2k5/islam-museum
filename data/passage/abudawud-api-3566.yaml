label: { ar: "سنن أبي داود 3566 — الأب والأبوة", en: "Sunan Abi Dawud 3566 — the father and fatherhood", ur: "سنن ابی داؤد 3566 — باپ اور والدیت", es: "Sunan Abi Dawud 3566 — El padre y la paternidad" }
text: "… حَدَّثَنَا حَبَّانُ بْنُ هِلاَلٍ، حَدَّثَنَا هَمَّامٌ، عَنْ قَتَادَةَ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنْ صَفْوَانَ بْنِ يَعْلَى، عَنْ أَبِيهِ، قَالَ قَالَ لِي رَسُولُ اللَّهِ \" إِذَا أَتَتْكَ رُسُلِي فَأَعْطِهِمْ ثَلاَثِينَ دِرْعًا وَثَلاَثِينَ بَعِيرًا \". قَالَ فَقُلْتُ يَا رَسُولَ اللَّهِ أَعَارِيَةً مَضْمُونَةً أَوْ عَارِيَةً مُؤَدَّاةً قَالَ \" بَلْ مُؤَدَّاةً \". قَالَ أَبُو دَاوُدَ حَبَّانُ خَالُ هِلاَلِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3566، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3566 (Wages (Kitab Al-Ijarah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3566، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3566 (Salarios (Kitab Al-Ijarah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
