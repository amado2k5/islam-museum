text: "… واستدركه ابن فَتْحُون. السوداء: إني أرضعتكما ففارقها عقبة فتزوجها نافع - نافع بن صبرة: مذا. مخرج حديثه عن أهل المدينة مثل حديث أبي هُريرَة وقال هِشَام بن الكَلْبيّ: كان يكتب المصاحف لعمر في كفارة ما يكون في المجلس من اللغو. …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 1492، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 1492, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
