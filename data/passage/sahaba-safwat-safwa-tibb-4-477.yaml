text: "كر المصطفين من عباد أهل اليمن المجهولين الأسماء فأبدى الشيخ له البشر والترحيب. ثم سلمنا عليه فقال الشاب: إن اللّه بمنه وفضله قد جعلك طبيبا لسقام القلوب معالجاً لأوجاع الذنوب، وبي جرح تغل وداء قد استكمل، فإن رأيت أن تلطف …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 477، يذكر الطب والطبيب، والسقم، والوجع، ومداواة الجراح، والداء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
