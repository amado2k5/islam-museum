text: "… فَتْحاً مُبِيناً ؛ قال : فتح الحُدَيْبية، وبايعوا بيعةَ الرضوان، وأُطْعِموا نخيل خَيبر، وظهرت الروم على فارس. ففرح المسلمون بتصديق كتاب اللّٰه ونصر أهل الكتاب على المجوس. وقال شعبة، عن الحَكَم، عن عبد الرحمن بن أبي ليلى : وَأَثَابَهُمْ فَتْحاً …"
