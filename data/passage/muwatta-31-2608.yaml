label: { ar: "الموطأ 2608 — مالك: إجلاء عمر يهود نجران وفدك وتقويم نصيبهم من الثمر والأرض", en: "Muwatta 2608" }
summary:
  ar: "قال مالك: وقد أجلى عمر بن الخطاب يهود نجران وفدك. فأما يهود خيبر فخرجوا منها ليس لهم من الثمر ولا من الأرض شيء. وأما يهود فدك فكان لهم نصف الثمر ونصف الأرض، لأن رسول الله كان صالحهم على ذلك، فأقام لهم عمر نصف الثمر ونصف الأرض قيمة من ذهب وورق وإبل وحبال وأقتاب، ثم أعطاهم القيمة وأجلاهم منها. {cite:muwatta-maruf-1997 p.471}"
