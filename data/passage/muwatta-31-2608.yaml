label: { ar: "الموطأ 2608 — مالك: إجلاء عمر يهود نجران وفدك وتقويم نصيبهم من الثمر والأرض", en: "Muwatta 2608", es: "Muwatta 2608", fr: "Muwatta 2608", ur: "موطا 2608", tr: "El-Muvatta 2608 — Malik: Ömer tarafından Necran ve Fadak Yahudilerinin sürülmesi ve ürün ve toprak paylarının belirlenmesi", id: "Al-Muwatta 2608 — Malik: Pengusiran orang-orang Yahudi dari Najran dan Fadak oleh Umar dan penetapan bagian mereka atas hasil panen dan tanah" }
summary:
  ar: "قال مالك: وقد أجلى عمر بن الخطاب يهود نجران وفدك. فأما يهود خيبر فخرجوا منها ليس لهم من الثمر ولا من الأرض شيء. وأما يهود فدك فكان لهم نصف الثمر ونصف الأرض، لأن رسول الله كان صالحهم على ذلك، فأقام لهم عمر نصف الثمر ونصف الأرض قيمة من ذهب وورق وإبل وحبال وأقتاب، ثم أعطاهم القيمة وأجلاهم منها. {cite:muwatta-maruf-1997 p.471}"
  tr: "Malik şöyle dedi: Ömer ibn el-Hattab, Necran ve Fadak Yahudilerini oradan kovdu. Hayber Yahudilerine gelince, onlar ne meyveden ne de topraktan hiçbir şey almadan oradan ayrıldılar. Fadak Yahudilerine gelince, Allah'ın Resulü onlarla bu temelde bir antlaşma yaptığı için meyvenin ve toprağın yarısına hak kazanmışlardı. Ömer daha sonra meyvenin ve toprağın yarısını onlar için altın, gümüş, deve, halat ve eyer olarak değerlendirdi, sonra onlara bu değeri verdi ve onları oradan kovdu. {cite:muwatta-maruf-1997 s.471}"
  id: "Malik berkata: Umar bin al-Khattab mengusir orang-orang Yahudi Najran dan Fadak. Adapun orang-orang Yahudi Khaybar, mereka meninggalkannya tanpa membawa buah-buahan atau tanah apa pun. Adapun orang-orang Yahudi Fadak, mereka berhak atas setengah buah-buahan dan setengah tanah, karena Rasulullah telah membuat perjanjian dengan mereka berdasarkan hal itu. Kemudian Umar menetapkan nilai setengah buah-buahan dan setengah tanah untuk mereka dengan emas, perak, unta, tali, dan pelana, lalu memberikan nilai tersebut kepada mereka dan mengusir mereka dari sana. {cite:muwatta-maruf-1997 p.471}"
