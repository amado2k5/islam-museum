text: "قال رسول الله: «ما من عبد يسترعيه الله رعية، يموت يوم يموت وهو غاش لرعيته، إلا حرم الله عليه الجنة»"
summary:
  ar: "رواية معقل بن يسار المزني في كتاب الإيمان من صحيح مسلم — حدثه لعبيد الله بن زياد في مرض موته وكان قد أمسكه طويلاً — من أثقل النصوص في مسؤولية الراعي عن رعيته."
