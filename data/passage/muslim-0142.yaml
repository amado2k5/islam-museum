label: { ar: "مسلم 142 — ما من عبد يسترعيه الله رعية يموت وهو غاش لها إلا حرم الله عليه الجنة", en: "Muslim 142 — No shepherd who dies cheating his flock but God bars him from Paradise", es: "Musulmán 142 — Ningún pastor que muere engañando a su rebaño deja que Dios le prohíba la entrada al Paraíso.", fr: "Muslim 142 — Nul berger qui meurt en ayant trompé son troupeau ne risque d'entrer au Paradis, selon Dieu.", ur: "مسلم 142 - کوئی چرواہا جو اپنے ریوڑ کو دھوکہ دیتے ہوئے مرے لیکن اللہ اسے جنت سے روک دیتا ہے۔", tr: "Müslim 142 — Allah bir kuluna bir sürü emanet eder de, o kulu aldatarak ölürse, Allah ona cenneti haram kılar.", id: "Muslim 142 — Tidak ada seorang hamba pun yang dipercayakan Allah untuk menjaga suatu kawanan ternak, lalu ia meninggal dunia dalam keadaan menipu ternaknya, melainkan Allah akan mengharamkan surga baginya." }
text: "قال رسول الله: «ما من عبد يسترعيه الله رعية، يموت يوم يموت وهو غاش لرعيته، إلا حرم الله عليه الجنة»"
summary:
  ar: "رواية معقل بن يسار المزني في كتاب الإيمان من صحيح مسلم — حدثه لعبيد الله بن زياد في مرض موته وكان قد أمسكه طويلاً — من أثقل النصوص في مسؤولية الراعي عن رعيته."
  tr: "Ma'kal ibn Yasar el-Muzani'nin Sahih Müslim'deki İman Kitabı'nda yer alan ve son hastalığı sırasında Ubeyd Allah ibn Ziyad'a anlattığı ve uzun süre sakladığı rivayet, çobanın sürüsüne karşı sorumluluğu konusunda en önemli metinlerden biridir."
  id: "Riwayat Ma’qal ibn Yasar al-Muzani dalam Kitab Iman di Sahih Muslim — yang ia riwayatkan kepada Ubayd Allah ibn Ziyad selama sakitnya yang terakhir, dan yang telah ia simpan untuk waktu yang lama — adalah salah satu teks terpenting mengenai tanggung jawab seorang gembala terhadap kawanan ternaknya."
