text: "… صحيح. ورواه ابن جرير مِن طُرُقٍ مُتَعَدِّدَةٍ، عن ابن عبَّاس، وليس فيه ذكر اليهود، فهذا هو المحفوظ، والله أعلم. وقال ابن جُرَيْج: قال عمرو بن دينار، عن عكرمة: إنَّ مُشْرِكِي قريش كاتَبُوا فارس علىٰ الرُّوم، وكاتَبَتْهُم فارس، وكَتَبَتْ فارس إلىٰ …"
