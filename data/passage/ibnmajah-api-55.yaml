text: "لَمَّا بَعَثَنِي رَسُولُ اللَّهِ ـ صلى الله عليه وسلم ـ إِلَى الْيَمَنِ قَالَ ‏ \"‏ لاَ تَقْضِيَنَّ وَلاَ تَفْصِلَنَّ إِلاَّ بِمَا تَعْلَمُ فَإِنْ أَشْكَلَ عَلَيْكَ أَمْرٌ فَقِفْ حَتَّى تُبَيِّنَهُ أَوْ تَكْتُبَ إِلَىَّ فِيهِ ‏\"‏ ‏.‏"
