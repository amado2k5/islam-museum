label: { ar: "الأربعون 25 — ذهب أهل الدثور بالأجور", en: "Arba'un 25 — the wealthy have taken all the reward" }
summary:
  ar: "حديث أبي ذر أن ناساً من أصحاب رسول الله قالوا: «يا رسول الله ذهب أهل الدثور بالأجور يصلون كما نصلي ويصومون كما نصوم ويتصدقون بفضول أموالهم» فدلهم على صدقات يقدرون عليها: كل تسبيحة وتكبيرة وتحميدة وتهليلة صدقة، والأمر بالمعروف والنهي عن المنكر صدقة، وفي بضع أحدكم صدقة، فلما سألوا أيأتي أحدنا شهوته ويكون له فيها أجر قال: «أرأيتم لو وضعها في حرام أكان عليه وزر؟ فكذا إذا وضعها في الحلال كان له أجر» — وهو الحديث الخامس والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (720، 1006) من رواية يحيى بن يعمر عن أبي الأسود الديلي عن أبي ذر، وروي معناه عن أبي ذر من وجوه كثيرة بزيادة ونقصان؛ ويبين ابن رجب أن الصحابة لشدة حرصهم كان الفقراء يحزنون على فوات صدقة الأموال التي يقدر عليها الأغنياء وعلى التخلف عن الجهاد لعدم آلة القدرة عليه، وأخبر الله عن الباكين حزناً ألا يجدوا ما ينفقون [التوبة 92]، وأن الدثور هي الأموال، وأن الفقراء ظنوا أن لا صدقة إلا بالمال فأخبرهم أن جميع أنواع فعل المعروف والإحسان صدقة، وفي صحيح مسلم عن حذيفة «كل معروف صدقة»، وفي الصحيحين من حديث أبي هريرة أن فقراء المهاجرين شكوا ذهاب أهل الدثور بالدرجات العلى فعلمهم التسبيح والتكبير والتحميد دبر كل صلاة ثلاثاً وثلاثين، فلما فعل الأغنياء مثلهم قال «ذلك فضل الله يؤتيه من يشاء» [المائدة 54]، وروي نحو هذا عن علي وأبي ذر وأبي الدرداء وابن عمر وابن عباس وغيرهم؛ وفي رواية أحمد الطويلة أبواب الصدقة: التكبير والتسبيح والتحميد والتهليل والاستغفار والأمر بالمعروف والنهي عن المنكر وعزل الشوكة والعظم والحجر عن طريق الناس وإهداء الأعمى وإسماع الأصم والأبكم حتى يفقه وإرشاد المستدل والسعي بشدة الساقين إلى اللهفان المستغيث والرفع بشدة الذراعين مع الضعيف، ثم «ولك في جماعك زوجتك أجر» مع قصة الولد المفترض (فأنت خلقته؟ بل الله خلقه… فضعه في حلاله وجنبه حرامه ولك أجر)، وظاهر سياقه عند ابن رجب يقتضي أن الأجر على الجماع بنية طلب الولد الذي يترتب على تربيته وتأديبه أجر ويحتسبه عند موته، وأما إذا لم ينو شيئاً بقضاء شهوته فقد تنازع الناس في دخوله في الحديث، وقال النووي إن فيه دليلاً على أن المباحات تصير طاعات بالنيات الصادقات؛ وصح أن نفقة الرجل على أهله صدقة من حديث أبي مسعود الأنصاري في الصحيحين (جامع العلوم والحكم ص 533–545)."
  en: "The hadith of Abu Dharr that some of the Prophet's Companions said 'O Messenger of God, the people of wealth have taken all the reward — they pray as we pray and fast as we fast, and give alms from their surplus wealth', so he directed them to charities within their reach: every glorification, magnification, praise and declaration of unity is alms, commanding right and forbidding wrong is alms, and 'in the intercourse of one of you is alms' — answering their surprise with 'if he placed it in the unlawful, would it not be a burden on him? Likewise, placing it in the lawful earns him reward'; the twenty-fifth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Muslim (720, 1006) through Yahya ibn Ya'mar from Abu al-Aswad al-Du'ali from Abu Dharr, with its meaning related from Abu Dharr through many routes, fuller and shorter; Ibn Rajab observes that the Companions' zeal was such that the poor grieved at losing the alms the wealthy could give and at missing campaigns they lacked the means to join — God Himself told of those who wept at finding nothing to spend (al-Tawba 92) — that duthur means wealth, and that the poor supposed alms were only monetary until the Prophet taught them that every kind of doing good and beneficence is alms, with Hudhayfa's 'every act of kindness is alms' in Sahih Muslim and, in the two Sahihs from Abu Hurayra, the poor Emigrants' complaint answered by teaching them thirty-three glorifications, magnifications and praises after each prayer — followed, when the rich did likewise, by 'that is God's bounty which He gives to whom He wills' (al-Ma'ida 54) — with parallels from Ali, Abu Dharr, Abu al-Darda', Ibn Umar, Ibn Abbas and others; Ahmad's long route enumerates the doors of alms: magnification, glorification, praise, the declaration of unity, seeking forgiveness, commanding right and forbidding wrong, removing thorn, bone and stone from people's path, guiding the blind, making the deaf and mute understand, directing the seeker, running on urgent legs to the distressed caller, lifting with strong arms for the weak — then 'in intercourse with your wife is reward' with the hypothetical child ('did you create him? — no, God did … place your desire in its lawful place, keep it from the unlawful, and yours is the reward'), whose apparent sense, for Ibn Rajab, is reward for intercourse by the intention of seeking a child whose upbringing and discipline earn reward credited at his death, while people disputed whether it enters the hadith without any intention — al-Nawawi drawing from it that the permissible becomes obedience through sincere intentions; and the Sahihayn carry Abu Masud al-Ansari's 'a man's spending on his family is alms' (Jami' al-Ulum wal-Hikam pp. 533–545)."
