label: { ar: "الأربعون 25 — ذهب أهل الدثور بالأجور", en: "Arba'un 25 — the wealthy have taken all the reward", es: "25 de Arba'un: los ricos se han llevado toda la recompensa.", fr: "Arba'un 25 — les riches ont pris toute la récompense", ur: "اربعون 25 - دولت مندوں نے سارا انعام لے لیا ہے۔", tr: "Kırkıncı (25) — Zenginler ödülleri aldılar", id: "Yang keempat puluh (25) — Orang kaya mengambil hadiah" }
summary:
  ar: "حديث أبي ذر أن ناساً من أصحاب رسول الله قالوا: «يا رسول الله ذهب أهل الدثور بالأجور يصلون كما نصلي ويصومون كما نصوم ويتصدقون بفضول أموالهم» فدلهم على صدقات يقدرون عليها: كل تسبيحة وتكبيرة وتحميدة وتهليلة صدقة، والأمر بالمعروف والنهي عن المنكر صدقة، وفي بضع أحدكم صدقة، فلما سألوا أيأتي أحدنا شهوته ويكون له فيها أجر قال: «أرأيتم لو وضعها في حرام أكان عليه وزر؟ فكذا إذا وضعها في الحلال كان له أجر» — وهو الحديث الخامس والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم ⁦(720، 1006)⁩ من رواية يحيى بن يعمر عن أبي الأسود الديلي عن أبي ذر، وروي معناه عن أبي ذر من وجوه كثيرة بزيادة ونقصان؛ ويبين ابن رجب أن الصحابة لشدة حرصهم كان الفقراء يحزنون على فوات صدقة الأموال التي يقدر عليها الأغنياء وعلى التخلف عن الجهاد لعدم آلة القدرة عليه، وأخبر الله عن الباكين حزناً ألا يجدوا ما ينفقون [التوبة 92]، وأن الدثور هي الأموال، وأن الفقراء ظنوا أن لا صدقة إلا بالمال فأخبرهم أن جميع أنواع فعل المعروف والإحسان صدقة، وفي صحيح مسلم عن حذيفة «كل معروف صدقة»، وفي الصحيحين من حديث أبي هريرة أن فقراء المهاجرين شكوا ذهاب أهل الدثور بالدرجات العلى فعلمهم التسبيح والتكبير والتحميد دبر كل صلاة ثلاثاً وثلاثين، فلما فعل الأغنياء مثلهم قال «ذلك فضل الله يؤتيه من يشاء» [المائدة 54]، وروي نحو هذا عن علي وأبي ذر وأبي الدرداء وابن عمر وابن عباس وغيرهم؛ وفي رواية أحمد الطويلة أبواب الصدقة: التكبير والتسبيح والتحميد والتهليل والاستغفار والأمر بالمعروف والنهي عن المنكر وعزل الشوكة والعظم والحجر عن طريق الناس وإهداء الأعمى وإسماع الأصم والأبكم حتى يفقه وإرشاد المستدل والسعي بشدة الساقين إلى اللهفان المستغيث والرفع بشدة الذراعين مع الضعيف، ثم «ولك في جماعك زوجتك أجر» مع قصة الولد المفترض ⁦(فأنت خلقته؟ بل الله خلقه… فضعه في حلاله وجنبه حرامه ولك أجر)⁩، وظاهر سياقه عند ابن رجب يقتضي أن الأجر على الجماع بنية طلب الولد الذي يترتب على تربيته وتأديبه أجر ويحتسبه عند موته، وأما إذا لم ينو شيئاً بقضاء شهوته فقد تنازع الناس في دخوله في الحديث، وقال النووي إن فيه دليلاً على أن المباحات تصير طاعات بالنيات الصادقات؛ وصح أن نفقة الرجل على أهله صدقة من حديث أبي مسعود الأنصاري في الصحيحين ⁦(جامع العلوم والحكم ص 533–545)⁩."
  en: "The hadith of Abu Dharr that some of the Prophet's Companions said 'O Messenger of God, the people of wealth have taken all the reward — they pray as we pray and fast as we fast, and give alms from their surplus wealth', so he directed them to charities within their reach: every glorification, magnification, praise and declaration of unity is alms, commanding right and forbidding wrong is alms, and 'in the intercourse of one of you is alms' — answering their surprise with 'if he placed it in the unlawful, would it not be a burden on him? Likewise, placing it in the lawful earns him reward'; the twenty-fifth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Muslim (720, 1006) through Yahya ibn Ya'mar from Abu al-Aswad al-Du'ali from Abu Dharr, with its meaning related from Abu Dharr through many routes, fuller and shorter; Ibn Rajab observes that the Companions' zeal was such that the poor grieved at losing the alms the wealthy could give and at missing campaigns they lacked the means to join — God Himself told of those who wept at finding nothing to spend (al-Tawba 92) — that duthur means wealth, and that the poor supposed alms were only monetary until the Prophet taught them that every kind of doing good and beneficence is alms, with Hudhayfa's 'every act of kindness is alms' in Sahih Muslim and, in the two Sahihs from Abu Hurayra, the poor Emigrants' complaint answered by teaching them thirty-three glorifications, magnifications and praises after each prayer — followed, when the rich did likewise, by 'that is God's bounty which He gives to whom He wills' (al-Ma'ida 54) — with parallels from Ali, Abu Dharr, Abu al-Darda', Ibn Umar, Ibn Abbas and others; Ahmad's long route enumerates the doors of alms: magnification, glorification, praise, the declaration of unity, seeking forgiveness, commanding right and forbidding wrong, removing thorn, bone and stone from people's path, guiding the blind, making the deaf and mute understand, directing the seeker, running on urgent legs to the distressed caller, lifting with strong arms for the weak — then 'in intercourse with your wife is reward' with the hypothetical child ('did you create him? — no, God did … place your desire in its lawful place, keep it from the unlawful, and yours is the reward'), whose apparent sense, for Ibn Rajab, is reward for intercourse by the intention of seeking a child whose upbringing and discipline earn reward credited at his death, while people disputed whether it enters the hadith without any intention — al-Nawawi drawing from it that the permissible becomes obedience through sincere intentions; and the Sahihayn carry Abu Masud al-Ansari's 'a man's spending on his family is alms' (Jami' al-Ulum wal-Hikam pp. 533–545)."
  es: "El hadiz de Abu Dharr que algunos de los Compañeros del Profeta dijeron 'Oh Mensajero de Dios, la gente rica ha tomado toda la recompensa: oran como nosotros oramos y ayunan como nosotros ayunamos, y dan limosna de su riqueza sobrante', entonces él los dirigió a las caridades que estaban a su alcance: toda glorificación, magnificación, alabanza y declaración de unidad es limosna, ordenar lo correcto y prohibir lo incorrecto es limosna, y 'en el trato de uno de vosotros es limosna', respondiendo a su sorpresa con 'si lo puso en lo ilícito, ¿no sería una carga para él? De igual modo, ponerlo en lo lícito le gana recompensa'; el vigésimo quinto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, transmitido por Muslim (720, 1006) a través de Yahya ibn Ya'mar de Abu al-Aswad al-Du'ali de Abu Dharr, con su significado relatado de Abu Dharr a través de muchas rutas, más completo y más corto; Ibn Rajab observa que el celo de los Compañeros era tal que los pobres se lamentaban por perder las limosnas que los ricos podían dar y por perderse campañas a las que no tenían los medios para unirse —Dios mismo habló de aquellos que lloraron al no encontrar nada que gastar (al-Tawba 92)— que duthur significa riqueza, y que los pobres suponían que las limosnas eran solo monetarias hasta que el Profeta les enseñó que todo tipo de hacer el bien y la beneficencia es limosna, con el «todo acto de bondad es limosna» de Hudhayfa en Sahih Muslim y, en los dos Sahihs de Abu Hurayra, la queja de los emigrantes pobres fue respondida enseñándoles treinta y tres glorificaciones, magnificaciones y alabanzas después de cada oración —seguido, cuando los ricos hicieron lo mismo, por «esa es la generosidad de Dios que Él da a quien Él quiere» (al-Ma'ida 54)— con paralelos de Ali, Abu Dharr, Abu al-Darda', Ibn Umar, Ibn Abbas y otros; la larga ruta de Ahmad enumera las puertas de la limosna: magnificación, glorificación, alabanza, la declaración de unidad, la búsqueda del perdón, el mandato del bien y la prohibición del mal, la eliminación de espinas, huesos y piedras del camino de la gente, la guía del ciego, la realización del sordo y mudo, la dirección del buscador, la carrera apresurada hacia el que llama afligido, el levantamiento con brazos fuertes para el débil; luego, «en la unión con tu esposa hay recompensa» con el hipotético hijo («¿lo creaste tú? — no, Dios lo hizo… coloca tu deseo en su lugar lícito, aléjalo de lo ilícito, y tuya es la recompensa»), cuyo sentido aparente, para Ibn Rajab, es la recompensa por la unión con la intención de buscar un hijo cuya crianza y disciplina obtengan una recompensa acreditada a su muerte, mientras que la gente discutía si entra en el hadiz sin ninguna intención; al-Nawawi extrajo de él que lo permisible se convierte en obediencia a través de intenciones sinceras; y los Sahihayn recogen la afirmación de Abu Masud al-Ansari de que \"el gasto de un hombre en su familia es limosna\" (Jami' al-Ulum wal-Hikam, págs. 533-545)."
  fr: "Le hadith d'Abu Dharr rapporte que certains Compagnons du Prophète ont dit: « Ô Messager de Dieu, les gens riches ont déjà reçu toute la récompense: ils prient comme nous, jeûnent comme nous et donnent l'aumône de leurs biens superflus. » Il leur a alors indiqué les œuvres de charité à leur portée: toute glorification, magnification, louange et déclaration d'unité sont des aumônes; ordonner le bien et interdire le mal sont des aumônes; et « dans les relations de chacun d'entre vous, il y a aumône ». Répondant à leur surprise, il leur a dit: « S'il la dépensait dans l'illicite, cela ne lui causerait-il pas un fardeau ? De même, la dépenser dans le licite lui vaut une récompense. » le vingt-cinquième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, transmis par Muslim (720, 1006) à travers Yahya ibn Ya'mar d'Abu al-Aswad al-Du'ali d'Abu Dharr, avec sa signification rapportée d'Abu Dharr par de nombreux itinéraires, plus complets et plus courts; Ibn Rajab observe que le zèle des Compagnons était tel que les pauvres déploraient de ne plus recevoir l'aumône que les riches pouvaient donner et de ne pouvoir participer à aucune campagne militaire faute de moyens. Dieu lui-même a parlé de ceux qui pleuraient de n'avoir rien à dépenser (al-Tawba 92). Il note également que « duthur » signifie richesse et que les pauvres pensaient que l'aumône n'était que monétaire jusqu'à ce que le Prophète leur enseigne que toute forme de bienfaisance est une aumône. On retrouve cette idée dans le Sahih Muslim, où Hudhayfa affirme que « tout acte de bonté est une aumône », et dans les deux Sahihs d'Abu Hurayra, la plainte des pauvres émigrés est apaisée par l'enseignement de trente-trois glorifications, magnifications et louanges après chaque prière. Lorsque les riches firent de même, on leur dit: « C'est la grâce de Dieu qu'Il accorde à qui Il veut » (al-Ma'ida 54). On retrouve des parallèles avec les enseignements d'Ali, Abu Dharr, Abu al-Darda' et Ibn Umar. Ibn Abbas et d'autres; le long chemin d'Ahmad énumère les portes de l'aumône: la magnification, la glorification, la louange, la déclaration d'unité, la recherche du pardon, l'ordre du bien et l'interdiction du mal, l'enlèvement des épines, des os et des pierres du chemin des gens, le guidage des aveugles, la clarification des sourds et des muets, l'orientation du chercheur, la course pressante vers celui qui appelle en détresse, le soutien inconditionnel des faibles — puis « la récompense réside dans les rapports sexuels avec votre épouse » avec l'enfant hypothétique (« l'avez-vous créé ? — non, c'est Dieu qui l'a fait… placez votre désir à sa place légitime, préservez-le de l'illicite, et la récompense vous appartient »), dont le sens apparent, pour Ibn Rajab, est la récompense pour les rapports sexuels dans l'intention de désirer un enfant dont l'éducation et la discipline lui vaudront une récompense créditée à sa mort, tandis que certains ont débattu de la question de savoir si cela entre dans le hadith sans aucune intention — al-Nawawi en tirant que le permis devient l'obéissance par des intentions sincères; et les Sahihayn reprennent le vers d'Abu Masud al-Ansari selon lequel « les dépenses d'un homme pour sa famille sont des aumônes » (Jami' al-Ulum wal-Hikam pp. 533–545)."
  ur: "ابوذر کی حدیث ہے کہ رسول اللہ کے صحابہ میں سے بعض نے عرض کیا کہ یا رسول اللہ مالداروں نے سارا ثواب لے لیا ہے، وہ نماز پڑھتے ہیں جیسے ہم نماز پڑھتے ہیں اور روزہ رکھتے ہیں، اور اپنے زائد مال میں سے صدقہ دیتے ہیں، تو آپ نے ان کو صدقہ کرنے کی ہدایت کی: ہر تسبیح، بڑائی، تعریف اور توحید کا اعلان صدقہ ہے، حق کا حکم دینا اور ایک دوسرے کا حکم دینا باطل ہے۔ تم میں سے صدقہ ہے' - ان کی حیرت کا جواب دیتے ہوئے 'اگر اس نے اسے حرام میں رکھا تو کیا یہ اس پر بوجھ نہیں ہوگا؟ اسی طرح اسے حلال میں رکھنے سے بھی اس کو ثواب ملتا ہے۔ نووی کی چالیسویں اور ابن رجب کی تفسیر کا پچیسواں، جسے مسلم ⁦(720، 1006)⁩ نے یحییٰ بن یامر کے ذریعے ابو الاسود الدعالی سے ابوذر سے نقل کیا ہے، جس کے معنی ابوذر سے بہت سارے راستوں سے متعلق ہیں، مکمل اور مختصر؛ ابن رجب نے مشاہدہ کیا ہے کہ صحابہ کا جوش ایسا تھا کہ غریبوں کو مالداروں کی طرف سے دی جانے والی خیرات سے محروم ہونے کا غم ہوتا تھا اور گمشدہ مہموں میں ان کے پاس شامل ہونے کے ذرائع نہیں ہوتے تھے - خدا نے خود ان لوگوں کے بارے میں بتایا جو خرچ کرنے کے لیے کچھ نہ ملنے پر روتے تھے ⁦(التوبہ 92)⁩ - کہ دوتھر کا مطلب ہے دولت، اور غریبوں کو یہ سمجھا جاتا تھا کہ وہ خیرات کرنے والے صرف اور صرف نیکی کے کاموں میں سے ہیں جب تک کہ ان کے لیے ہر قسم کی خیرات نہیں ہوتی۔ صدقہ ہے، صحیح مسلم میں حذیفہ کے ساتھ 'ہر احسان کا عمل صدقہ ہے' اور ابو ہریرہ کی دو صحیحوں میں غریب مہاجرین کی شکایت کا جواب انہیں ہر نماز کے بعد تینتیس تسبیحات، تسبیحات اور تسبیحات سکھا کر دیا گیا ہے، اس کے بعد جب امیروں نے بھی ایسا ہی کیا، تو اللہ کی مرضی سے جو وہ اسے عطا کرتا ہے۔ ⁦(المائدہ 54)⁩ - علی، ابوذر، ابو الدرداء، ابن عمر، ابن عباس اور دیگر سے متوازی کے ساتھ؛ احمد کا طویل راستہ صدقات کے دروازے گنتا ہے: بڑائی، تسبیح، حمد، اتحاد کا اعلان، استغفار، حق کا حکم اور برائی سے منع کرنا، لوگوں کے راستے سے کانٹے، ہڈی اور پتھر کو ہٹانا، اندھے کو ہدایت دینا، گونگے بہروں کو سمجھنا، پکارنے والے کو ہدایت دینا، مضبوط ٹانگوں کے ساتھ دوڑنا۔ کمزوروں کے لیے ہتھیار - پھر فرضی بچے کے ساتھ 'اپنی بیوی سے ہمبستری کرنا ثواب ہے' ⁦('کیا تم نے اسے پیدا کیا ہے؟ - نہیں، خدا نے ... اپنی خواہش کو اس کی حلال جگہ پر رکھو، اسے حرام سے رکھو، اور تمہارا اجر ہے')⁩، جس کے ظاہری معنی میں ابن رجب کے نزدیک جماع کا ثواب ہے، جب کہ اس کے بچے کو موت کے حصول کی نیت سے حاصل کرنا اور اس کے ثواب کی نیت کرنا۔ لوگوں نے اختلاف کیا کہ آیا یہ حدیث میں بغیر نیت کے داخل ہوتی ہے - النووی اس سے یہ اخذ کرتے ہیں کہ مباح نیت خلوص نیت سے اطاعت بن جاتی ہے۔ اور صحیحین میں ابو مسعود الانصاری کی روایت ہے کہ 'ایک آدمی کا اپنے گھر والوں پر خرچ کرنا صدقہ ہے' ⁦(جامع العلوم والحکم صفحہ 533-545)⁩۔"
  tr: "Ebu Zer'in hadisinde, Allah Resulü'nün bazı sahabelerinin şöyle dediği rivayet edilir: “Ey Allah Resulü, zenginler bütün sevapları almışlardır. Bizim gibi namaz kılıyorlar, bizim gibi oruç tutuyorlar ve fazlalıklarından sadaka veriyorlar.” Bunun üzerine onlara yapabilecekleri sadakaları şöyle anlattı: “Allah'ı yüceltmek, övmek ve birliğini ilan etmek sadakadır; iyiliği emretmek ve kötülüğü yasaklamak sadakadır; sizden birinin cinsel ilişkisinde de sadaka vardır.” Sahabeler, “Birimiz arzusunu yerine getirirse bunun için sevap kazanır mı?” diye sorduklarında, şöyle buyurdu: “Bakın, eğer bunu haram bir şeye yöneltirse, günah işlemez mi? Aynı şekilde, helal bir şeye yöneltirse sevap kazanır.” — Bu, Nevevi'nin Kırk Hadis'inde ve İbn Receb'in tefsirinde yirmi beşinci hadistir. Bu hadis, Müslim (720, 1006) tarafından Yahya ibn Ya'mar'dan, o da Ebu el-Esved el-Dili'den, o da Ebu Zer'den rivayet edilmiştir ve anlamı Ebu Zer'den birçok şekilde, eklemeler ve çıkarmalarla rivayet edilmiştir. İbn Receb, Sahabelerin, yoğun endişeleri nedeniyle, zenginlerin verebildiği para sadakasının kaybından ve imkan yetersizliği nedeniyle cihada katılamamalarından dolayı üzüldüklerini açıklamaktadır. Allah bize, harcayacak bir şey bulamadıkları için kederden ağlayanları [Tevbe 92] ve servetin para olduğunu, fakirlerin ise sadakanın sadece parayla olabileceğini düşündüklerini bildirmiş, böylece onlara her türlü iyiliğin ve iyiliğin sadaka olduğunu bildirmiştir. Sahih Müslim'de, Huzeyfe'den rivayet edildiğine göre, \"Her iyi amel sadakadır.\" İki Sahih hadiste, Ebu Hurayra'dan rivayet edildiğine göre, Muhacirler arasındaki fakirler, zenginlerin en yüksek mertebeleri almasından şikayet etmişlerdir. Bunun üzerine Ebu Hurayra, onlara her namazdan sonra otuz üç defa Allah'ı yüceltmeyi, O'na hamd etmeyi öğretmiştir. Zenginler de aynı şeyi yapınca, \"Bu Allah'ın lütfudur; O dilediğine verir\" demiştir [El-Maide 54]. Benzer bir rivayet Ali, Ebu Zer, Ebu Darda, İbn Ömer, İbn Abbas ve diğerlerinden de nakledilmiştir. Ahmed'in uzun rivayetinde sadaka bölümleri şunlardır: Allah'ı yüceltmek, O'nu övmek, O'nun birliğini ilan etmek, bağışlanma dilemek, iyiliği emretmek ve kötülüğü yasaklamak, insanların yollarından dikenleri, kemikleri ve taşları kaldırmak, körlere yol göstermek, sağır ve dilsizleri işittirip anlamalarını sağlamak, hidayet arayana yol göstermek, yardım isteyen sıkıntılı kişiye tüm gücüyle koşmak ve zayıflara tüm gücüyle yardım etmek. Sonra, \"Ve eşinle cinsel ilişkiye girmenin de bir sevabı vardır\" ifadesiyle birlikte varsayımsal çocuk hikayesi anlatılır (Onu sen mi yarattın? Aksine, Allah yarattı... Öyleyse onu helal olana koy, haram olandan uzak tut, böylece sevap kazanırsın). İbn Receb'e göre, görünen bağlam, yetiştirilmesi ve terbiye edilmesi sevap getirecek bir çocuk sahibi olma niyetiyle cinsel ilişkiye girmenin sevabının, çocuğun ölümünden sonra hesaplanacağını ima etmektedir. Eğer bir kimse arzusunu tatmin etmekle hiçbir şey kastetmiyorsa, hadisin kapsamına girip girmediği konusunda ihtilaflar vardır. İmam Nevevi, hadisin, samimi niyetlerle yapılan helal şeylerin ibadet haline geldiğine dair deliller içerdiğini söylemiştir. Bir insanın ailesine yaptığı harcamanın sadaka olduğu, Ebu Mesud el-Ensari'nin iki Sahih'inde (Cami'ül-Ulum ve el-Hikam, s. 533-545) geçen hadisine dayanmaktadır."
  id: "Hadits Abu Dzar menyatakan bahwa sebagian sahabat Rasulullah SAW berkata: “Wahai Rasulullah, orang-orang kaya telah mengambil semua pahala. Mereka shalat seperti kita shalat, mereka berpuasa seperti kita berpuasa, dan mereka memberikan sedekah dari kelebihan harta mereka.” Maka beliau membimbing mereka kepada amalan-amalan sedekah yang dapat mereka lakukan: setiap pengagungan, pujian, dan pernyataan tentang keesaan Allah adalah sedekah, menyeru kepada kebaikan dan melarang kejahatan adalah sedekah, dan dalam hubungan seksual salah seorang dari kalian terdapat sedekah. Ketika mereka bertanya, “Apakah salah seorang dari kita memenuhi keinginannya dan menerima pahala karenanya?” beliau menjawab: “Apakah kalian melihat jika dia melakukannya pada sesuatu yang haram, bukankah dia akan menanggung dosa? Demikian juga, jika dia melakukannya pada sesuatu yang halal, dia akan menerima pahala.” — Ini adalah hadits ke-25 dalam Empat Puluh Hadits Nawawi dan dalam tafsir Ibnu Rajab; Diriwayatkan oleh Muslim (720, 1006) dari Yahya ibn Ya’mar dari Abu al-Aswad al-Dili dari Abu Dharr, dan maknanya diriwayatkan dari Abu Dharr dalam berbagai versi dengan tambahan dan pengurangan. Ibn Rajab menjelaskan bahwa para Sahabat, karena keprihatinan mereka yang mendalam, merasa sedih atas hilangnya sedekah berupa uang yang dapat diberikan oleh orang kaya, dan karena kegagalan mereka untuk ikut serta dalam jihad karena kurangnya sarana untuk melakukannya. Allah memberitahukan kepada kita tentang orang-orang yang menangis karena sedih karena mereka tidak dapat menemukan apa pun untuk dibelanjakan [At-Tawbah 92], dan bahwa kekayaan adalah uang, dan bahwa orang miskin mengira bahwa tidak ada sedekah kecuali dengan uang, maka Dia memberitahukan kepada mereka bahwa segala macam amal baik dan perbuatan baik adalah sedekah. Dalam Sahih Muslim, dari Hudhayfah, “Setiap amal baik adalah sedekah.” Dalam dua kitab Sahih, berdasarkan riwayat Abu Hurayrah, kaum miskin di antara Muhajirin mengeluh bahwa kaum kaya telah menduduki kedudukan tertinggi, sehingga beliau mengajari mereka untuk memuliakan, mengagungkan, dan memuji Allah sebanyak tiga puluh tiga kali setelah setiap shalat. Ketika kaum kaya melakukan hal yang sama, beliau berkata, “Itulah karunia Allah; Dia memberikannya kepada siapa pun yang Dia kehendaki” [Al-Ma’idah 54]. Riwayat serupa juga diriwayatkan dari Ali, Abu Dharr, Abu Darda, Ibn Umar, Ibn Abbas, dan lainnya. Dalam riwayat panjang Ahmad, bab-bab tentang sedekah adalah: mengagungkan Allah, memuji-Nya, menyatakan keesaan-Nya, memohon ampunan, menyeru kepada kebaikan dan melarang kejahatan, menyingkirkan duri, tulang, dan batu dari jalan manusia, membimbing orang buta, membuat orang tuli dan bisu mendengar hingga mereka mengerti, membimbing orang yang mencari petunjuk, bergegas dengan sekuat tenaga kepada orang yang kesulitan yang meminta pertolongan, dan mengangkat dengan sekuat tenaga kepada orang yang lemah. Kemudian, \"Dan kamu akan mendapat pahala karena bersetubuh dengan istrimu,\" bersama dengan kisah anak hipotetis (Apakah kamu yang menciptakannya? Sesungguhnya Allah yang menciptakannya… Maka tempatkanlah dia dalam apa yang halal dan jauhkanlah dia dari apa yang haram, maka kamu akan mendapat pahala). Konteks yang tampak, menurut Ibn Rajab, menyiratkan bahwa pahala untuk bersetubuh dengan niat mencari anak, yang pengasuhan dan disiplinnya akan menghasilkan pahala, dihitung setelah kematiannya. Adapun mengenai apakah ia tidak bermaksud baik dalam memuaskan keinginannya, orang-orang memperdebatkan apakah ia termasuk dalam hadits tersebut. Al-Nawawi mengatakan bahwa hadits tersebut memuat bukti bahwa hal-hal yang diperbolehkan menjadi ibadah jika dilakukan dengan niat yang tulus. Hadits ini sahih, berdasarkan hadits Abu Masoud Al-Ansari dalam dua kitab Shahih (Jami' Al-'Ulum wa Al-Hikam, hlm. 533–545)."
