  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 5317, that mentions the lawful, what is not lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
