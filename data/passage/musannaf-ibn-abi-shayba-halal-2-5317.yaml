text: "… وإن الأوعية لا تُحِلُّ شيئاً ولا تُحَرِّمه، فاشربوا فيها. - حدَّثنا أبو بكر قال: حدَّثنا أبو الأحوص عن طارق بن عبد الرحمن عن سعيد بن جُبير عن ابن عباس قال: كُلُّ حلال في كلِّ ظرف حلال، وكلُّ حرام في كُلِّ …"
