text: "- كتاب: الإيمان باب، حديث - بين يَدَيْ رَسُولِ اللَّهِ وَلَاهِ فقال: يا مُحَمَّدُ، ما الإِسلامُ؟ قَالَ: الإِسلامُ أَنْ تشهد أَنْ لا إله إِلَّا اللَّهُ وأن لُحَمَّداً رَسُوْلُ اللَّهِ، وأَن تُقِيمَ الصَّلاَةَ، وَتُؤْتيَ الزَّكَاةَ، وَتَحُجَّ وتَعْتَمِرَ، وتَغْتَسِلَ مِنَ الْجَنَابَةِ، وأَن …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 164، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
