text: "- كتاب: الإيمان باب، حديث - بين يَدَيْ رَسُولِ اللَّهِ وَلَاهِ فقال: يا مُحَمَّدُ، ما الإِسلامُ؟ قَالَ: الإِسلامُ أَنْ تشهد أَنْ لا إله إِلَّا اللَّهُ وأن لُحَمَّداً رَسُوْلُ اللَّهِ، وأَن تُقِيمَ الصَّلاَةَ، وَتُؤْتيَ الزَّكَاةَ، وَتَحُجَّ وتَعْتَمِرَ، وتَغْتَسِلَ مِنَ الْجَنَابَةِ، وأَن …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 164، يذكر تعريف الإسلام بأعماله، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 164, that mentions Islam defined by its acts, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 164 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 164, que menciona el Islam definido por sus actos: la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sahih Ibn Hibban, volume 3, page 164, mentionnant l'islam défini par ses actes: la prière, la zakat, le jeûne et le pèlerinage (cités ensemble), ainsi que le témoignage. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban, Resimli Cilt 3, sayfa 164'ten bir alıntı, İslam'ı namaz, zekât, oruç ve Hac gibi ibadetlerle, ayrıca iman ikrarı, namaz ve zekâtla tanımlar. Bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Jilid Bergambar 3, halaman 164, mendefinisikan Islam berdasarkan amalan-amalannya, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
