text: "… عوانة ثلاثتهم عن عبد الملك بن عمير به، وقد وقع مصداق ذلك بعده في أيام الخلفاء الثلاثة أبي بكر، وعمر، وعثمان، استوثقت هذه الممالك فتحاً على أيدي المسلمين، وأنفقت أموال قيصر ملك الروم، وكسرى ملك الفرس، في سبيل اللّه، على …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 577، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
