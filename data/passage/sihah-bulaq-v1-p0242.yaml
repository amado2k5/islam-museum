text: |-
  ٢٩٩
  أحكم أمرامنه وأوفى ذمة وقولهم ما أمرّتفلان وما أحلى أى ماقال مرّاولا حلوا والمزان
  شجر الرماح تذكره فى باب الذون لانه فعال زو لمزير الشديد القلب عن أبى عبيد وقد
  حزربالضم عزارة وقلات أمزرمنه قال العباس بن مرداس
  ترى الرجل التحيف فتزدريه * وفى أتوابه رج-ل عزير
  ويروى أسدهمورواله-ع أمازرمثل أفيل وأفائل وأنشد الاخفش
  الين ابنة الاعد ارحا فى بسالة السوجال واضلال الرجال أفاصره
  فلاتذّهين عيناك فى كل شرمح • طوال فان الاقصرين أمازده
  قال يريد أ فاصرهم وأمازرهم كما يقال فلان أخبث الناس وأفسقه وهى خير جارية وأفضله
  المزر بالكسر ضرب من الاشربة وذكرأبوعبيد أن ابن عم وقد فسر الانبذة فقال البتع نبيا
  العسل والجعة نبذالشعير والمزر من الذرة والسكر من التمر والحر من العنب وأما السكركة
  بتسكين الرامحمر الحيش قال أبو موسى الاشعرى هى من الذرة ويقال لها السة رقع
  أيضا كانه معرب سكر كد وهى بالجبشية والمزرأيضا الاحق والمزر بالفتح الحسوللذوق ويقال
  تزرت الشراب اذاشربته قلي لا قليلا وأنشد الاموى يصف خرا
  تكون بعد الحسو والتزر * فى فه مثل عصير السكر
  ( مشر يقال ما أحسن مشرة الارض بالتحريك أى يشرتها ونباتها ومشرة الارض
  أيضا بالتسكين قال الشاعر الى مشرة لم تعتلق بالهاجن وقد أمشرت الارض أى
  أخرحت نياتها وأمشرت العضاه اذا خرجت لها ورق وأغصان وكذلك مشرت العضاه
  غشيرا ومشرت الشئ فرقته قال الشاءر
  فقلت أشعامشرة التدرحوانا • وأى زمان قدرنام تمشر
  أى لم يقسم مافيها وأذن حشرة مشرة أى اطيفة حسفة قال يصف فرسا ا مر والقيس
  لها أذن حشرة مشرة • كاعلي طحرخ اذاما صفر
  الاصمعى تمشر قلان اذارؤى عليه أثر الغى ⁦( مصر)⁩ المصرفى المدينة المعروفة تذكروتونت
  عن ابن السراج والمصر واحد الامصار والمصران المكوفة والبصرة والمصر أيضا الحد
  واخاجزيين الشيتين وقال
  وجاعل الشمس مصر الاخفاء به * بين النهارويين الليل قد فصلا
  وأهسل مصر يكتيون فى شروطهم اشترى فلان الدار بمصورها أى بجدودها والمصير المعا
  وهو فعيل والمع المصران مثل رغيف ورغذان والمصارين جع الجمع وقال بعضهم مصيراما
  هومفعل من صاد اليه العاعام وانما قالوامصران كما قالوا فى جمع مسيل الماءمسلان شبهوا
  مفعلا يفعيل ومصران الفأرة ضرب من ردىء التمر والمصر حلب بأطراف الاصابع وقال ابن
  السكيت المصر حلب كل مافى الضرع والتمصر حلب يقايا اللبن فى الضرع أيوزيد المصور
  من المعزخاصة دون الضآن وهى التى قد عززت الاقللا قال ومثلها من الضآن الجدود قال
  وجعها مصاير مثل قلاتص وقال العديس جعها مصارمشل قلاص والمصور الناقة التى
  نصر لبنها أى يحلب قليلا قدلا لان لبنها بطئ الخروج ويقال مصرت العنز تصيرا آى صارت
