text: "… برج التيس سَأَلوهُ يوماً: ما هو طالِعُك؟ فقال: برجُ التيس، قالوا: ليس في علم النجومِ برجٌ أمسمُهُ برجُ تيس. فقال: لَمَّا كُنْتُ طِفْلاً فتحَتْ لي والدتي طالعي، فقالوا لها : إنَّهُ في برج الجدي. والآن قد مضى على ذلك أربعون …"
summary:
  ar: "سُئل جحا عن برجه فقال الحمل، وحين قيل له إنه لا برج بهذا الاسم قال إن أمه أُخبرت أنه وُلد في برج الجدي، وبعد أربعين سنة صار الجدي تيسًا. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  en: "Asked his zodiac sign, Juha says Aries; told there is no such sign, he says his mother was told he was born under Capricorn, and forty years on the kid has become a billy-goat. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  ur: "جحا سے اس کا برج پوچھا گیا تو اس نے حمل بتایا؛ جب کہا گیا کہ اس نام کا کوئی برج نہیں تو اس نے کہا کہ اس کی ماں کو بتایا گیا تھا کہ وہ برج جدی میں پیدا ہوا، اور چالیس سال بعد وہ میمنا بکرا بن گیا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  fr: "Interrogé sur son signe du zodiaque, Juha répond le Bélier ; quand on lui dit que ce signe n'existe pas, il dit qu'on avait appris à sa mère qu'il était né sous le Capricorne, et que quarante ans plus tard le chevreau est devenu un bouc. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  es: "Al preguntarle su signo del zodiaco, Juha dice Aries; cuando le dicen que ese signo no existe, dice que a su madre le dijeron que nació bajo Capricornio, y que cuarenta años después el cabrito se ha vuelto macho cabrío. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  tr: "Juha'ya burcu sorulduğunda Koç dedi. Böyle bir burcun olmadığını öğrenince, annesine Oğlak burcunda doğduğunun söylendiğini ve kırk yıl sonra Oğlak burcunun keçiye dönüştüğünü söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 37}"
  id: "Juha ditanya tentang zodiaknya dan dia menjawab Aries. Ketika diberitahu bahwa tidak ada zodiak seperti itu, dia mengatakan bahwa ibunya pernah diberitahu bahwa dia lahir di bawah zodiak Capricorn, dan setelah empat puluh tahun Capricorn itu berubah menjadi kambing. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
