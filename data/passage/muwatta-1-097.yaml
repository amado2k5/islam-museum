summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم عن جندب مولى عبد الله بن عياش، في باب الوضوء من المذي: سأل جندب عبد الله بن عمر عن المذي فقال: إذا وجدته فاغسل فرجك وتوضأ وضوءك للصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.83}"
