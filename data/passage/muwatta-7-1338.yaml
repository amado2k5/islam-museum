label: { ar: "الموطأ 1338 — يحيى بن سعيد: يوم أحد قال النبي من يأتيني بخبر سعد بن الربيع، فوجده بين القتلى يوصي بالإبلاغ", en: "Muwatta 1338", es: "Muwatta 1338", fr: "Muwatta 1338", ur: "موطا 1338", tr: "El-Muvatta 1338 — Yahya bin Said: Uhud günü Peygamber şöyle buyurdu: “Saad bin el-Rabi’den bana kim haber getirecek?” Ölenler arasında bulundu ve haber verilmesi için talimat veriyordu.", id: "Al-Muwatta 1338 — Yahya bin Saeed: Pada hari Perang Uhud, Nabi bersabda, “Siapa yang akan membawakan kabar tentang Saad bin Al-Rabi’?” Ia ditemukan di antara orang-orang yang terbunuh, memberikan instruksi untuk melaporkan." }
text: "أنِّي قَدْ طُعِنْتُ اثْنَتيْ عَشرةَ طَعْنةً"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه لما كان يوم أحد قال رسول الله من يأتيني بخبر سعد بن الربيع الأنصاري؟ فقال رجل أنا، فطاف بين القتلى، فقال له سعد بن الربيع ما شأنك؟ فقال بعثني رسول الله لآتيه بخبرك. فقال اذهب إليه فاقرأه مني السلام، وأخبره أني قد طعنت اثنتي عشرة طعنة، وأني قد أنفذت مقاتلي، وأخبر قومك أنه لا عذر لهم عند الله إن قتل رسول الله وواحد منهم حي. {cite:muwatta-maruf-1997 p.599}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Uhud günü Allah'ın Resulü'nün, \"Sa'd ibn al-Rabi' al-Ansari'den haber getirecek olan kim?\" diye sorduğunu aktarır. Bir adam, \"Ben getireceğim\" dedi ve şehitlerin arasına gitti. Sa'd ibn al-Rabi' ona, \"İşin ne?\" diye sordu. Adam, \"Allah'ın Resulü beni sana haber getirmek için gönderdi\" diye cevap verdi. Sa'd, \"Git ona selamlarımı ilet ve ona on iki kere bıçaklandığımı ve uzuvlarımın delindiğini söyle. Halkına da, Allah'ın Resulü öldürülürken içlerinden birinin hayatta kalması durumunda Allah katında hiçbir mazeretlerinin olmayacağını söyle.\" dedi. {cite:muwatta-maruf-1997 s.599}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa pada hari Perang Uhud, Rasulullah SAW bersabda, \"Siapa yang akan membawakan kabar tentang Sa'd ibn al-Rabi' al-Ansari kepadaku?\" Seorang laki-laki menjawab, \"Aku,\" lalu pergi ke antara orang-orang yang terbunuh. Sa'd ibn al-Rabi' bertanya kepadanya, \"Apa urusanmu?\" Ia menjawab, \"Rasulullah SAW mengutusku untuk membawakan kabar tentangmu kepadanya.\" Sa'd berkata, \"Pergilah kepadanya dan sampaikan salamku kepadanya, dan beritahukan kepadanya bahwa aku telah ditikam dua belas kali, dan anggota tubuhku telah tertusuk. Katakan kepada kaummu bahwa mereka tidak akan mempunyai alasan di hadapan Allah jika Rasulullah SAW terbunuh sementara salah seorang dari mereka masih hidup.\" {cite:muwatta-maruf-1997 p.599}"
