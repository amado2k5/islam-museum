label: { ar: "الموطأ 1338 — يحيى بن سعيد: يوم أحد قال النبي من يأتيني بخبر سعد بن الربيع، فوجده بين القتلى يوصي بالإبلاغ", en: "Muwatta 1338" }
text: "أنِّي قَدْ طُعِنْتُ اثْنَتيْ عَشرةَ طَعْنةً"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه لما كان يوم أحد قال رسول الله من يأتيني بخبر سعد بن الربيع الأنصاري؟ فقال رجل أنا، فطاف بين القتلى، فقال له سعد بن الربيع ما شأنك؟ فقال بعثني رسول الله لآتيه بخبرك. فقال اذهب إليه فاقرأه مني السلام، وأخبره أني قد طعنت اثنتي عشرة طعنة، وأني قد أنفذت مقاتلي، وأخبر قومك أنه لا عذر لهم عند الله إن قتل رسول الله وواحد منهم حي. {cite:muwatta-maruf-1997 p.599}"
