  أسدوطي الحليفان ويقال أيضالفزارة والاسدحليفان لان خزاعة لما أجلت بنى أسدعن
  الحرم خرجت فحالفت طيئاثم حالفت بن فزارة ورجل حليف اللسان اذاكان حديد
  اللسان فصيجا وقواهم حضار والوزن محلفان وهما نجمان يطاعان قبل سهيل فيظن الناس
  بكل واحدعنهما أنه سهيل فيحلف واحد أنه سهيل ويحلف آخر أنه ليربه ومنه قولهم كيت
  محلفة قال الشاعر
  كميت غير محلفة وامكن * كلون الصرف عل به الاديم
  يقول هى خالصة اللون لا يحلف عليها أنها ليست كذلك والحلفاء نبت فى الماه قال أبوزيد
  واحدتها حلفة مثل قصبة وطرفة وقال الاصعحلفة بكسر اللام وذوالحليفة موضع
  ⁦(سنف)⁩ الحنف الاعوجاج فى الرجل وهو أن تقبل احدى ابهامى رجليه على الاخرى
  والرجل أحتف ومنه سمى الأحنف بن قيس واسمه عضر وقال ابن الاعرابيت هو الذى يمشى
  على ظهر قدمه من شقها الذى يلى خنصرها يقال ضربت فلاناءلى رجله فحنفتها
  والحنيف المسلم وقد سنمى المستقيم بذلك كماسمى الغراب أعور وتحيف الرجل أى عمل عمل
  الحنيفية ويقال اختتن ويقمال اعتزل الاصنام وتعبد قال جران العود
  ولمارأين الصبح بادرن ضوه * رسيم قِطا البطحاء أوهن أقطف
  وأدركن أعجازا من الليل بعدما * أقام الصلاة العابد المتحنف
  والحنفا اسم فرس حذيفة بن بدر الغزارى والجنقاء اسم ماعلبى معاوية بن عامر بن ربيعة
  وحنيفة أبوحى من العر ب وه وحنيضة بن لجيم بن حهب بن على بن بذربن واقل
  ( -وف الحوف الرهط وهو جلد بشق كهيئة الازارتابس_ه الحائض والصبيان
  وحافتا الوادى جانباء وتحوّفه أى تنقصه ⁦(حيف)⁩ الحيف الجور والظ لم وقد حافي
  عليه يخيف أى جار وتحيفت الشبئ مثل تحوّقته اذا تنقصته من حافايه
  أمرأة الياس بن مضرواسعها ليلى نسب ولد الياس اليها وهى أمهم وقد خندف الرجل
  اذا مشى مفاجايقاب قدميه كانه يغترفبهما ⁦(خذف)⁩ الخذف بالحصى الرمي به
  بالاصابع ومنه قول الشاءر *خذف أعسرا• والمخذفة القلاع أوشى يرمى به والخذوف
  الاتان تخذف من سرعتها الجدى أى ترميه قال النابغة
  كأنّ الر-ل شقبه خذوف * من الجونات هادية عنون.
  ⁦(خذرف)⁩ الخذروفها لذال المجهة شى بدوره الصب مخيط فى بديد فيسمع ل دوى قال
  أمر ؤالقيس بصف فرسا
  درير كغذروف الوايد أمره * تتابع كفيه بخيط موصل
  والمع الخذاويق يقال تركت السيوف رأسه خذاريف أى قطعا كل قطعة مثل الخذروف
  واللخذراف ضرب من الحض الواحدة خذرافة (خرف الخرفة بالضمّ مايحة
  من الفواكه يقبال التمرخرفة الصائم والخرفة البستان والخرفة والمجرف أيضا الطريق
