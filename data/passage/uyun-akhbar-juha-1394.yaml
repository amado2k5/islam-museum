text: "… ونلْهُ مع اللّاهين يوماً وَنَطَرَبِ إذا ما رأيت اليوم قد جاء خيرُه فذه بشكر وآترُك الفضلَ يَغضبٍ وتَقُلْ علّنا دُعِينا فِغْيْنَا وأتانا فلم يَجدنا الرسول كان طُلفيلُ العرائس الذى يُنسب اليه الطَّفيليُّون يُوصى أصحابه فيقول لأحدهم: إذا دخلتَ عُرسا فلا …"
