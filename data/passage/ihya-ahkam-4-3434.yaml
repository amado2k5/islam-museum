text: "السفر أم يستحب له ذلك فاعلم أنه إن كان عازما ً على ترك المسح والقصر والجمع والفطر وترك التنفل راكبا ً وماشيا ً لم يلزمه علم شروط الترخص في ذلك لآن الترخص ليس بواجب عليه وأما علم رخصة التيمم فيلزمه …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 3434، يرد فيه ذكر الواجب، والمستحب، والنافلة والنوافل، وما ليس بواجب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 3434, whose wording mentions the obligatory (wajib), the recommended (mustahabb), the supererogatory (nafila), what is said not to be obligatory, the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 3434 کا اقتباس جس میں واجب، مستحب، نفل اور نوافل، جو واجب نہیں، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Ihya' 'Ulum al-Din de al-Ghazali, volume numérisé 4, p. 3434, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb), le surérogatoire (nafila), ce qui est dit non obligatoire, la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen digitalizado 4, p. 3434, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb), lo supererogatorio (nafila), lo que se dice que no es obligatorio, la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 3434. sayfasından alınan bu alıntı, farz, müstehap, nafile ve farz olmayan amellerin yanı sıra muafiyetleri de ele almaktadır. Bu alıntı, kaynak yönergelerine uygun olarak, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve yaklaşık kırk kelime uzunluğundadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehap, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 4, halaman 3434, membahas tentang amalan wajib, anjuran, sunnah, dan najis, serta keringanan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin dan panjangnya sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
