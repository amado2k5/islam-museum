text: "… الإيمانُ بضعُ وسُتون، أو بِضعٌ وسبعون بابًا، أفضلُها : لا إله إلَّا الله، وأَ أَدناها : إماطةُ الأذى عن الطَّريقِ، والحياءُ شُعبةٌ مِن الإيمان. إثناي أبي، ثنا عفَّان، ثنا حماد بن سلمة، ثنا سُهيل بن أبي صالحٍ، عن عبد اللّٰه …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 336، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 336, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 336 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
