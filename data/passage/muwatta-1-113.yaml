label: { ar: "الموطأ 113 — عمر وعثمان وعائشة: إذا مس الختان الختان وجب الغسل", en: "Muwatta 113", es: "Muwatta 113", fr: "Muwatta 113", ur: "موطا 113", tr: "Al-Muwatta 113 — Ömer, Osman ve Ayşe: Sünnetli bölgeler birbirine değerse, gusül (ritüel banyo) farzdır.", id: "Al-Muwatta 113 — Umar, Uthman, dan Aisha: Jika bagian yang disunat saling bersentuhan, maka ghusl (mandi ritual) wajib dilakukan." }
text: "إذا مس الختان الختان فقد وجب الغسل"
summary:
  ar: "أول أثر في باب واجب الغسل إذا التقى الختانان. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب أن عمر بن الخطاب وعثمان بن عفان وعائشة زوج النبي كانوا يقولون إن الغسل يجب بالتقاء الختانين وإن لم يكن إنزال. ويذكر المحقق أن عبد الرزاق وابن أبي شيبة والطحاوي أخرجوه من غير طريق مالك عن سعيد عن عائشة، وابن أبي شيبة من طريق مسروق عن عائشة، والدارقطني مرفوعاً من طريق القاسم عن عائشة، وابن أبي شيبة عن عمر بنحوه. {cite:muwatta-maruf-1997 p.90}"
  tr: "Sünnetli organların birleştiği durumlarda gusül abdestinin farz olduğuna dair ilk hadis, Yahya tarafından Malik'ten, o da İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet edilmiştir. Buna göre Ömer ibn el-Hattab, Osman ibn Affan ve Peygamberin eşi Ayşe, sünnetli organların birleştiği durumlarda, meni olmasa bile gusül abdestinin farz olduğunu söylerlerdi. Araştırmacı, Abd el-Razzaq, İbn Abi Şeybe ve el-Tahavi'nin bunu Malik'inkinden farklı zincirlerle, Sa'id'den, o da Ayşe'den rivayet ettiğini; İbn Abi Şeybe'nin bunu Masruk'tan, o da Ayşe'den rivayet ettiğini; el-Daraqutni'nin bunu merfu hadis olarak el-Kasım'dan, o da Ayşe'den rivayet ettiğini; ve İbn Abi Şeybe'nin bunu Ömer'den benzer bir şekilde rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.90}"
  id: "Hadits pertama mengenai kewajiban ghusl (mandi ritual) ketika bagian yang disunat bertemu diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Sa'id ibn al-Musayyab, bahwa Umar ibn al-Khattab, Uthman ibn Affan, dan Aisyah, istri Nabi, biasa mengatakan bahwa ghusl wajib dilakukan ketika bagian yang disunat bertemu, meskipun tidak terjadi ejakulasi. Peneliti menyebutkan bahwa Abd al-Razzaq, Ibn Abi Shaybah, dan al-Tahawi meriwayatkannya melalui sanad selain Malik, dari Sa'id, dari Aisyah; Ibn Abi Shaybah meriwayatkannya melalui Masruq, dari Aisyah; al-Daraqutni meriwayatkannya sebagai hadits marfu' melalui al-Qasim, dari Aisyah; dan Ibn Abi Shaybah meriwayatkannya dari Umar dalam bentuk yang serupa. {cite:muwatta-maruf-1997 p.90}"
