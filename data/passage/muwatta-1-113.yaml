text: "إذا مس الختان الختان فقد وجب الغسل"
summary:
  ar: "أول أثر في باب واجب الغسل إذا التقى الختانان. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب أن عمر بن الخطاب وعثمان بن عفان وعائشة زوج النبي كانوا يقولون إن الغسل يجب بالتقاء الختانين وإن لم يكن إنزال. ويذكر المحقق أن عبد الرزاق وابن أبي شيبة والطحاوي أخرجوه من غير طريق مالك عن سعيد عن عائشة، وابن أبي شيبة من طريق مسروق عن عائشة، والدارقطني مرفوعاً من طريق القاسم عن عائشة، وابن أبي شيبة عن عمر بنحوه. {cite:muwatta-maruf-1997 p.90}"
