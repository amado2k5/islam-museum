text: "… الترياق، والمعدنيات باسم البادزهر ويشبه أيضاً أن لا يكون بينهما كثير فرق. : والمعرّق والمدرّ وأما المسهل فإنها معروفة، وكل دواء يجتمع فيه الإسهال مع القبض، كما في السورنجان، فإنه نافع في أوجاع المفاصل، لأن القوّة المسهّلة تبادر فتجذب المادة، …"
summary:
