  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 332, qui mentionne la douleur, les maladies nommées, les organes du corps, le médicament, le poison et l'antidote; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
