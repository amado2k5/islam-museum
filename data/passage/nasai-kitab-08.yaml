summary:
  ar: "القسم 8 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المساجد»، ويضم فيها النصوص من 688 إلى 741 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 8 of Sunan al-Nasa'i (The Book of the Masjids) in the division of the open hadith dataset the museum took its reports from: reports 688 to 741 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 8، عنوان «کتاب المساجد»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 688 تا 741۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 8 de Sunan al-Nasa'i (El Libro de las Mezquitas) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 688 al 741, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre des Mosquées), dans sa partie ouverte, le livre 8 (de 688 à 741). Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
