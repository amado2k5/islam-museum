  ar: "سنن النسائي، كتاب المساجد"
  en: "Sunan al-Nasa'i, Book 8: The Book of the Masjids"
  ur: "سنن نسائی، کتاب المساجد"
  es: "Sunan al-Nasa'i, Libro 8: El Libro de las Mezquitas"
