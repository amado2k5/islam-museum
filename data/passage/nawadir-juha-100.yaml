text: "… إذا كان له جار عمرُهُ سأله بعضهم: هل يلدُ لرجل عمرُهُ مائة سنة ولدْ؟ فأجاب : نعم إذا كان له جارٌ عمرُهُ. أعرفه منذ كانت طاسة ترابة سُرِقَ لِجاره حلةٌ دست فوجدَها مع بعضِهِم فأحضرَ الشيخَ شاهِداً فسألَهُ القاضي: هل …"
summary:
  ar: "سُئل جحا هل يمكن لرجل عمره مئة سنة أن ينجب طفلًا، فقال نعم، إذا كان له جار عمره عشرون سنة. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  en: "Asked whether a man aged 100 can father a child, Juha says yes, if he has a neighbour aged 20. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  ur: "جحا سے پوچھا گیا کہ کیا سو سال کا آدمی بچے کا باپ بن سکتا ہے، تو اس نے کہا ہاں، اگر اس کا کوئی بیس سال کا پڑوسی ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  fr: "Interrogé pour savoir si un homme de cent ans peut engendrer un enfant, Juha répond que oui, s'il a un voisin de vingt ans. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  es: "Al preguntarle si un hombre de cien años puede engendrar un hijo, Juha dice que sí, si tiene un vecino de veinte años. {cite:juha-nawadir-kubra-djuwaydi p. 50}"
  tr: "Juha'ya yüz yaşında bir adamın çocuğu olup olamayacağı soruldu ve o, \"Evet, eğer yirmi yaşında bir komşusu varsa\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 50}"
  id: "Juha ditanya apakah seorang pria yang berusia seratus tahun dapat memiliki anak, dan dia menjawab, \"Ya, jika dia memiliki tetangga yang berusia dua puluh tahun.\" {cite:juha-nawadir-kubra-djuwaydi p. 50}"
