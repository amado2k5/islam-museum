text: "… نادرة مرجوزة بَيْنَما الشَّيْخُ بِيَوْمِ يَخْرُثُ عَثَرَ الشَّيْخُ بِشَيْءٍ لَمَعَا غَرِقَ الشَّيْخُ يُفَكْرُ مُعْجَبَا قَالَ لَا أُطْلِعُ سِرِّي أَحَدَا أَسْلَمُ الطُّرْقِ إِذَا سَلَّمْتُهَا عَادَ لِلْبَيْتِ على غَيْرِ أَنْتِظَار عَجِبَتْ زَوْجَتُهُ مِنْ عَوْدَتِهْ شَغَلَتْهُ بِغِذاءِ فِي الصَّبَاحِ أَسْرَعَتْ لِلْخُرُوجِ وَالعَقْلُ ذَهَبْ …"
summary:
  ar: "في حكاية منظومة وجد جحا بريقاً في جرة فأخفاه، ولاحظت زوجته، فركض إلى الوالي، ولما طُلب منه أن يفرغ ما معه بلع الذهب الذي في الكيس. {cite:juha-nawadir-kubra-djuwaydi p. 118}"
  en: "In a rhymed anecdote Juha finds a glint in a jar and hides it. His wife notices, and he runs to the governor and then, asked to empty what he has, swallows the gold in the bag. {cite:juha-nawadir-kubra-djuwaydi p. 118}"
  ur: "ایک منظوم حکایت میں جحا کو ایک مٹکے میں چمک نظر آتی ہے اور وہ اسے چھپا لیتا ہے۔ بیوی کو پتا چل جاتا ہے تو وہ بھاگ کر والی کے پاس جاتا ہے، اور جب اس سے کہا جاتا ہے کہ جو کچھ اس کے پاس ہے خالی کر دے تو وہ تھیلی کا سونا نگل لیتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 118}"
  fr: "Dans une anecdote rimée, Juha trouve un éclat dans une jarre et le cache. Sa femme le remarque, et il court chez le gouverneur puis, sommé de vider ce qu'il a, avale l'or du sac. {cite:juha-nawadir-kubra-djuwaydi p. 118}"
  es: "En una anécdota rimada, Juha encuentra un destello en una jarra y lo esconde. Su esposa lo nota, y él corre al gobernador y luego, al pedírsele que vacíe lo que tiene, se traga el oro de la bolsa. {cite:juha-nawadir-kubra-djuwaydi p. 118}"
  tr: "Bir fablda, Juha bir kavanozda parıldayan bir nesne bulup saklamıştır. Karısı bunu fark edince, Juha valiye koşmuştur. Vali ondan çantasını boşaltmasını isteyince, altını yutmuştur. {cite:juha-nawadir-kubra-djuwaydi s. 118}"
  id: "Dalam sebuah fabel, Juha menemukan benda berkilauan di dalam guci dan menyembunyikannya. Istrinya menyadarinya, sehingga ia lari ke gubernur. Ketika diminta untuk mengosongkan tasnya, ia menelan emas tersebut. {cite:juha-nawadir-kubra-djuwaydi p. 118}"
