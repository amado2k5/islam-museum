label: { ar: "صحيح مسلم 7545 — ما حُرّم", en: "Sahih Muslim 7545 — what was made unlawful", ur: "صحیح مسلم 7545 — جو حرام کیا گیا", es: "Sahih Muslim 7545 — lo que se declaró ilícito" }
text: "… قَالَ فَتَلَوْتُ عَلَيْهِ هَذِهِ الآيَةَ الَّتِي فِي الْفُرْقَانِ { وَالَّذِينَ لاَ يَدْعُونَ مَعَ اللَّهِ إِلَهًا آخَرَ وَلاَ يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلاَّ بِالْحَقِّ} إِلَى آخِرِ الآيَةِ. قَالَ هَذِهِ آيَةٌ مَكِّيَّةٌ نَسَخَتْهَا آيَةٌ مَدَنِيَّةٌ { وَمَنْ يَقْتُلْ مُؤْمِنًا مُتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ خَالِدًا}. وَفِي رِوَايَةِ ابْنِ هَاشِمٍ فَتَلَوْتُ هَذِهِ الآيَةَ الَّتِي فِي الْفُرْقَانِ{ إِلاَّ مَنْ تَابَ}"
summary:
  ar: "حديث في صحيح مسلم، رقم 7545، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 7545 (The Book of Commentary on the Qur'an), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 7545، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 7545 (El Libro de Comentarios sobre el Corán), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
