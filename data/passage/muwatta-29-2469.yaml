label: { ar: "الموطأ 2469 — مالك: القاتل خطأ عقله مال لا قود فيه ويجوز في ثلثه", en: "Muwatta 2469", es: "Muwatta 2469", fr: "Muwatta 2469", ur: "موطا 2469" }
summary:
  ar: "قال مالك: من قتل خطأ فإنما عقله مال لا قود فيه، وإنما هو كغيره من ماله يُقضى به دينه، وتُجوز فيه وصيته. فإن كان له مال تكون الدية قدر ثلثه، ثم عفي عن ديته، فذلك جائز له. وإن لم يكن له مال غير ديته جاز له من ذلك الثلث إذا عفي عنه وأوصى به. {cite:muwatta-maruf-1997 p.420} {cite:muwatta-maruf-1997 p.421}"
  tr: "Malik şöyle dedi: Bir kimse kasıtsız öldürülürse, kan parası misillemeye tabi değildir. Aksine, diğer malları gibi muamele görür; borçları bununla ödenir ve vasiyeti geçerlidir. Eğer malı varsa, kan parası bunun üçte biridir ve daha sonra kan parasından feragat edilirse, bu onun için caizdir. Kan parasından başka malı yoksa, feragat edilirse bunun üçte birini vasiyet edebilir. {cite:muwatta-maruf-1997 s.420} {cite:muwatta-maruf-1997 s.421}"
  id: "Malik berkata: Jika seseorang terbunuh tanpa sengaja, uang darahnya tidak dapat dikenai pembalasan. Sebaliknya, uang darah tersebut diperlakukan seperti harta miliknya yang lain, yang digunakan untuk membayar hutang dan wasiatnya sah. Jika ia memiliki harta, uang darahnya adalah sepertiga dari harta tersebut, dan kemudian uang darah tersebut dihapuskan, itu diperbolehkan baginya. Jika ia tidak memiliki harta selain uang darahnya, ia dapat mewariskan sepertiga dari uang darah tersebut jika uang darahnya dihapuskan. {cite:muwatta-maruf-1997 p.420} {cite:muwatta-maruf-1997 p.421}"
