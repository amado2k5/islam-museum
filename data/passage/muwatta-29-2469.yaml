label: { ar: "الموطأ 2469 — مالك: القاتل خطأ عقله مال لا قود فيه ويجوز في ثلثه", en: "Muwatta 2469" }
summary:
  ar: "قال مالك: من قتل خطأ فإنما عقله مال لا قود فيه، وإنما هو كغيره من ماله يُقضى به دينه، وتُجوز فيه وصيته. فإن كان له مال تكون الدية قدر ثلثه، ثم عفي عن ديته، فذلك جائز له. وإن لم يكن له مال غير ديته جاز له من ذلك الثلث إذا عفي عنه وأوصى به. {cite:muwatta-maruf-1997 p.420} {cite:muwatta-maruf-1997 p.421}"
