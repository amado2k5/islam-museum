summary:
  ar: "القسم 37 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزهد»، ويضم فيها النصوص من 4100 إلى 4341 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 37 of Sunan Ibn Majah (Zuhd) in the division of the open hadith dataset the museum took its reports from: reports 4100 to 4341 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 37، عنوان «کتاب الزہد»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4100 تا 4341۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 37 de Sunan Ibn Majah (Zuhd) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4100 al 4341 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 37 du Sunan Ibn Majah (Zuhd), correspondant aux hadiths 4100 à 4341 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
