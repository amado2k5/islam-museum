label: { ar: "الموطأ 1412 — نافع عن ابن عمر: إذا نحرت الناقة فذكاة ما في بطنها ذكاتها إذا تم خلقه ونبت شعره", en: "Muwatta 1412" }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يقول إذا نحرت الناقة فذكاة ما في بطنها ذكاتها، إذا كان قد تم خلقه ونبت شعره، فإذا خرج من بطن أمه ذبح حتى يخرج الدم من جوفه. ويذكر المحقق أن الوقف فيه هو الصحيح عند أبي حاتم الرازي وابن عدي والبيهقي. {cite:muwatta-maruf-1997 p.633}"
