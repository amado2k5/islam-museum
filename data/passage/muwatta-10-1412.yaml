label: { ar: "الموطأ 1412 — نافع عن ابن عمر: إذا نحرت الناقة فذكاة ما في بطنها ذكاتها إذا تم خلقه ونبت شعره", en: "Muwatta 1412", es: "Muwatta 1412", fr: "Muwatta 1412", ur: "موطا 1412", tr: "El-Muvatta 1412 — İbn Ömer'den rivayet edildiğine göre Nafi': Bir deveyi keserseniz, karnındakinin kesilmesi, yaratılışı tamamlanmış ve tüyleri çıkmış bir devenin kesilmesiyle aynıdır.", id: "Al-Muwatta 1412 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Jika kamu menyembelih seekor unta, maka penyembelihan isi rahimnya sama dengan penyembelihan unta tersebut jika proses penciptaannya telah sempurna dan bulunya telah tumbuh." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يقول إذا نحرت الناقة فذكاة ما في بطنها ذكاتها، إذا كان قد تم خلقه ونبت شعره، فإذا خرج من بطن أمه ذبح حتى يخرج الدم من جوفه. ويذكر المحقق أن الوقف فيه هو الصحيح عند أبي حاتم الرازي وابن عدي والبيهقي. {cite:muwatta-maruf-1997 p.633}"
  tr: "Malik, Nafi’den rivayetle Abdullah ibn Umar’ın şöyle dediğini aktarır: “Bir deve kesilecekse, karnındaki yavrunun kesilmesi, devenin kendisinin kesilmesine eşdeğerdir; yeter ki deve tam olarak gelişmiş ve tüyleri çıkmış olsun. Annesinin karnından çıktığı anda ise karnından kan akana kadar kesilmelidir.” Araştırmacı, bu konudaki doğru görüşün Ebu Hatim el-Razi, İbn Adi ve el-Beyhaki’ye ait olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.633}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata, “Jika seekor unta disembelih, maka penyembelihan isi perutnya sama dengan penyembelihan unta itu sendiri, asalkan sudah terbentuk sempurna dan bulunya sudah tumbuh. Ketika keluar dari rahim induknya, ia harus disembelih hingga darah mengalir dari perutnya.” Peneliti menyebutkan bahwa pandangan yang benar mengenai hal ini adalah pandangan Abu Hatim al-Razi, Ibn Adi, dan al-Bayhaqi. {cite:muwatta-maruf-1997 p.633}"
