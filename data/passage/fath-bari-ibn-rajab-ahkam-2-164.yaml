text: "… بينَ الزَّوجينِ؛ فإنَّه عليهما بالتلاعنِ وَلا عَنَ بينهما. ولا خلاف - نعلمُه - بينَ العلماءِ في جوارِ الملاعنةِ في المساجدِ بينَ الزَّوجَين المسلمينِ. وإنَّما اختلفوا هل ذلك مستحبٌّ أو واجبٌ أو مباح؟ فأوجبَه الشَّافعيُّ في قولٍ له، واستحبَّه في قولِه …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 2، ص 164، يرد فيه ذكر الواجب، والمستحب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
