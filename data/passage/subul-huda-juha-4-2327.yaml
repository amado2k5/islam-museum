text: "يَدَىْ أَغرَّ إذا انْتَمَى لم يُخْزِهِ نَسبُ القصار سَمَيْدَعِ مِقْدام. بِيضُ إذا لاقت حَدِيدًا صَمَّمتْ كالبَرْق تحت ظلال كلِّ غمام القومُ أَعلمُ ما تَركْتُ قِتالَهم حتى حَبَوْا مُهْرِى بأَشقرَ مُزْبِدِ وعَرفْتُ أَنَّى إن أُقَاتِلْ واحِدًا أُقْتَلْ ولا ينكل عدوّى مَشْهدِي …"
