text: |-
  ٤٣٨
  قد أخلّ به قصارت الها لازمة وصارت الياء كأنمابعدها وقول الشاعر
  تقول ابنتى لمارأتنى شاحبا • كأنك فينايا أبات غريب
  أراديا أسناه فقدم الالف وأخر التاء وقد يقلبون الياء ألفا قالت عمرة
  وقد زم وا أتى جزءت عليهما * وهل جزع أن قلت وابأباهما
  تزيدوا بأبيهما وقالت امرأة• يابيى أنت ويافوقالبيب • قال الفتراء جعلوا الكلمتين
  كالواحدة لكثرتم مافى السكلام وقال يا أبت وبا أبت لغتان فن نصب أراد الندية فحذف ويقالى
  لا أب لك ولا أبالك وهو مدح وربما قالوالا أبالألادة اللام كالمقعمة قال أبو حية الميرىّ
  أبالموت الذى لابدأنى • ملاق لا أباك تخوّفيق
  أراد تخوّفينى فحذف النون الاخيرة قال ابن السكيت يشال فلان بجر لا يوبجد وكذلك كلا
  لا يؤبى أى لا يجعلك تأباه أى لا ينقطع من كنرته والابواء بالمدموضع ( انا الاتيان المجى
  وقد أتيته أتياقال الشاعر* فاحتل لنفسل قبل أتى العسكر * وأتوته أنوة لغة فيه ومنه
  قول الهذلى* كنت اذا أنوته من غيب• وقوله تعالى انه كان وعده مأتيا أى آتيا كماقال
  بحمالا مسستورا أى ساترا وقد يكون مفعولالات ما أتال من أمر اللٰه عزوجل فقد أتيته أنت
  واغماشددلات واو مفعول أنقلت باهلكسرة ما قبلها فادغمت فى الياء التى هى لام الفعل
  وتقول أتت الامر من مأتاته أى من مأتاه أى من وجهه الذى يؤتى منه كما تقول ما أحسن
  معناة هذا إلكلام تريد معناه قال الرايز
  وحاجة كنت على صماتها • أتيتها وحدى من مأتاتها
  وقرى يوم يأت بحذف اليامكما قالو الا أدروهى لفة هذيل وتقول آيته على ذلاك الامر مواتاة
  اذا وافقته وطاوعنه والعامة تقول واتته وآناما تياء أى أعطاه وآناه أيضا أى أتى به ومنه
  قوله تعالى آتناغداء نا أى اثقنابه والاتاوة الخراج والمع الاتاوى قال الجعدى
  موالى حلف لامو الى قرابة • ولمكن قطينا يسألون الاتاويا
  تقول منه أتوته أنوه أتوا واتاوة قال الشاعر
  ففى كل أسواف العراق اتارة * وفى كل ماباع امر ؤمكس درهم
  ويقال للسقاء اذا مخض وجاء الزبدة دجاء أنوه وافلان أنوأى عطاء ويقال ما أحسن أنويدى
  هذه الناقة وأتى أيضا أى رجع يديها فى السير والايتاه الاعطاء وتأتى له الشى أى تهيأ وتأتى
  د أى ترفق وأتاممن وجهه قال الفراء يقال جاءفلان يتأتى اى يتعرّض لمعسروفك وأتيت
  للماء تأتية وتأتيا أى سهات سبيله ايخرج الى موضع والاتىّ الجدول يؤتيه الزجل الى أرضه
  وهو فعيل بقال باء ناسيل أتى وأناوى اذاجاءك ولم يصبك مطره قال الراجز
  سيل أتى مذه أتى • والاتى أيضاو الاتاوى الغريب ون-وة أناويات قال الشاءر
  لا يعدلنّ أناويون تضربهم • نسكا صر باحصاب المحلات
  وأمافول الشاعر
  ألم يأتك والانباعتمى • بمالاقت لبون بي زياد
  فانما أنيتو الدامولم يحذ فها للجزم ضرورة ورتو الى أصله قال الممازنى ويجوزفى الشعرأن
  ققول
