label: { ar: "الموطأ 1192 — أسامة بن زيد: توضأ النبي بالشعب ولم يسبغ الوضوء، فقال الصلاة أمامك، ثم صلى المغرب والعشاء بالمزدلفة", en: "Muwatta 1192" }
text: "الصَّلاةُ أمامَكَ"
summary:
  ar: "يروي مالك عن موسى بن عقبة عن كريب مولى ابن عباس عن أسامة بن زيد أنه سمعه يقول إن رسول الله دفع من عرفة، حتى إذا كان بالشعب نزل فتوضأ ولم يسبغ الوضوء، فقال له أسامة الصلاة يا رسول الله، فقال الصلاة أمامك. فلما جاء المزدلفة نزل فتوضأ فأسبغ الوضوء، ثم صلى المغرب، ثم أناخ كل إنسان بعيره في منزله، ثم صلى العشاء ولم يصل بينهما شيئا. {cite:muwatta-maruf-1997 p.536}"
