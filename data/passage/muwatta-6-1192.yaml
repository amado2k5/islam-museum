label: { ar: "الموطأ 1192 — أسامة بن زيد: توضأ النبي بالشعب ولم يسبغ الوضوء، فقال الصلاة أمامك، ثم صلى المغرب والعشاء بالمزدلفة", en: "Muwatta 1192", es: "Muwatta 1192", fr: "Muwatta 1192", ur: "موطا 1192", tr: "El-Muvatta 1192 — Usame bin Zeyd: Peygamber vadide abdest aldı, fakat abdestini tam olarak tamamlayamadı. Bunun üzerine, \"Namaz senden öncedir\" dedi ve Muzdalifa'da akşam ve yatsı namazlarını kıldı.", id: "Al-Muwatta 1192 — Usama bin Zaid: Nabi berwudhu di lembah tetapi tidak menyelesaikannya dengan sempurna, lalu beliau berkata, \"Shalat telah di depan kalian,\" kemudian beliau shalat Maghrib dan Isya di Muzdalifah." }
text: "الصَّلاةُ أمامَكَ"
summary:
  ar: "يروي مالك عن موسى بن عقبة عن كريب مولى ابن عباس عن أسامة بن زيد أنه سمعه يقول إن رسول الله دفع من عرفة، حتى إذا كان بالشعب نزل فتوضأ ولم يسبغ الوضوء، فقال له أسامة الصلاة يا رسول الله، فقال الصلاة أمامك. فلما جاء المزدلفة نزل فتوضأ فأسبغ الوضوء، ثم صلى المغرب، ثم أناخ كل إنسان بعيره في منزله، ثم صلى العشاء ولم يصل بينهما شيئا. {cite:muwatta-maruf-1997 p.536}"
  tr: "Malik, Musa ibn Ukba'dan, o da İbn Abbas'ın azatlı kölesi Kurayb'dan, o da Usame ibn Zeyd'den rivayetle, şöyle buyurduğunu işittiğini aktarır: \"Allah'ın Resulü Arafat'tan ayrıldı ve vadiye vardığında bineğinden indi ve abdest aldı, fakat abdestini tam olarak tamamlamadı. Usame ona, 'Namaz, ey Allah'ın Resulü!' dedi. O da, 'Namaz senden öncedir' diye cevap verdi. Muzdalifa'ya vardığında bineğinden indi ve tam olarak abdest aldı, sonra akşam namazını kıldı. Sonra herkes develerini dinlenme yerlerinde diz çöktürdü, sonra yatsı namazını kıldı ve arada başka bir namaz kılmadı.\" {cite:muwatta-maruf-1997 s.536}"
  id: "Malik meriwayatkan dari Musa ibn Uqba, dari Kurayb, budak yang dibebaskan oleh Ibnu Abbas, dari Usama ibn Zayd, bahwa ia mendengar beliau berkata: Rasulullah SAW berangkat dari Arafat, dan ketika beliau sampai di lembah, beliau turun dari unta dan berwudhu, tetapi beliau tidak menyelesaikannya dengan sempurna. Usama berkata kepadanya, \"Shalatlah, wahai Rasulullah!\" Beliau menjawab, \"Shalat ada di depanmu.\" Ketika beliau sampai di Muzdalifah, beliau turun dari unta dan berwudhu dengan sempurna, kemudian beliau shalat Maghrib. Kemudian semua orang menyuruh unta mereka berlutut di tempat istirahatnya, kemudian beliau shalat Isya, dan beliau tidak shalat apa pun di antara waktu itu. {cite:muwatta-maruf-1997 p.536}"
