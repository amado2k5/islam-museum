text: "… الحنطة والشعير سيّان أغفلوا الشيخ يوماً وأخذوه شاهد زور للمحكمة. فادَّعى المُدَّعي على خصمه بحنطةٍ. فأحضروا الشيخ، وسألوه فشهِدَ بشعيرٍ فقالوا له: غَلِطْتَ فكان يجب أن تقول حنطة. فأجابهم : أيُّها الجهلاء طالما الشهادة كاذبةً فالحنطة والشعير سيّان."
summary:
  ar: "أُجبر جحا على شهادة زور؛ فلما طُلب منه أن يقول قمحًا بدل الشعير، قال إنه إن كانت الشهادة زورًا فالقمح والشعير سيان. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  en: "Juha is made to give false testimony; asked to say wheat rather than barley, he says if the testimony is false, wheat and barley are the same. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  ur: "جحا کو جھوٹی گواہی دینے پر مجبور کیا گیا؛ جب کہا گیا کہ جو کی جگہ گندم کہو تو اس نے کہا کہ اگر گواہی ہی جھوٹی ہے تو گندم اور جو برابر ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  fr: "On force Juha à faire un faux témoignage; quand on lui demande de dire blé plutôt qu'orge, il répond que si le témoignage est faux, le blé et l'orge, c'est pareil. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
  es: "Obligan a Juha a dar falso testimonio; cuando le piden que diga trigo en lugar de cebada, responde que, si el testimonio es falso, el trigo y la cebada son lo mismo. {cite:juha-nawadir-kubra-djuwaydi p. 76}"
