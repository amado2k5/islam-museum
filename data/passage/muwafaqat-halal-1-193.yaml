text: "… الحلال، أما الحرامُ ؛ فالزهد فيه لازمٌ من أمر الإِسلام، عامٌّ في أهل الإِيمان، ليس ممًّا يتجارى فيه خواصُّ المؤمنين مقتصرين عليه فقط، وإنما تجارَوْا فيما صاروا به من الخواصِّ، وهو الزهدُ في المباح، فأمَّا المكروه ؛ فذو طرفَين، وإذا …"
