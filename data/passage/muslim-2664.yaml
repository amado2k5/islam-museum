label: { ar: "مسلم 2664 — المؤمن القوي خير من المؤمن الضعيف", en: "Muslim 2664 — The strong believer is better than the weak believer" }
text: "قال رسول الله: «المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كل خير. احرص على ما ينفعك، واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل لو أني فعلت كان كذا وكذا، ولكن قل قدر الله وما شاء فعل؛ فإن لو تفتح عمل الشيطان»"
summary:
  ar: "رواية أبي هريرة في كتاب القدر من صحيح مسلم؛ الأمر بالحرص والاستعانة وترك العجز، والنهي عن فتح باب لو على القدر — من أجمع نصوص التوكل."
