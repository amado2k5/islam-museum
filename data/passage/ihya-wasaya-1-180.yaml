text: "… فيه استكمل الإيمان بالله، إذا رضى لم يدخله رضاه فى الباطل وإذا غضب لم يخرجه غضبه عن الحق وإذا قدر لم يتناول ما ليس له. وجاء رجل إلى سلمان فقال : ياعبد اللّه أوصى، قال : لا تغضب، قال لا …"
