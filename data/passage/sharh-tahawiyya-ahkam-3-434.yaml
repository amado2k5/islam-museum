text: "… : ما حكم الاحتجاج بالقدر على فعل المكروهات وترك المستحبات، مثل أن يترك الإنسان النوافل بعد الصلاة، فإذا حاجه أحد قال: هذا بقضاء الله وقدره؟ ج : القدر لا يجوز الاحتجاج به على المعايب، فإذا كان ثَمَّ فِعْل للإنسان فيه …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 3، ص 434، يرد فيه ذكر المستحب، والنافلة والنوافل، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 3, p. 434, whose wording mentions the recommended (mustahabb), the supererogatory (nafila), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
