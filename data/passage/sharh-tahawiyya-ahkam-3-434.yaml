  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi üzerine tefsirinin 3. cildinin 434. sayfasından, müstehaplı, nafile ve mekruh halleri konusunu ele alan bir bölüm; makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, itaat, müstehap, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari komentar Ibn Abi al-`Izz tentang Akidah al-Tahawi, Jilid 3, halaman 434, yang membahas amalan yang dianjurkan, sunnah, dan makruh; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang makruh, amalan yang dilarang, dan dosa-dosa kecil."
