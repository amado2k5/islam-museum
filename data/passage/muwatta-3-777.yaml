label: { ar: "الموطأ 777 — نافع: كان ابن عمر يبعث بزكاة الفطر إلى الذي تجمع عنده قبل الفطر بيومين أو ثلاثة", en: "Muwatta 777", es: "Muwatta 777", fr: "Muwatta 777", ur: "موطا 777", tr: "El-Muvatta 777 — Nafi’: İbn Ömer, zekât-ı fitreyi, onu toplayan kişiye Ramazan Bayramı'ndan iki veya üç gün önce gönderirdi.", id: "Al-Muwatta 777 — Nafi’: Ibnu Umar biasa mengirimkan Zakat al-Fitr kepada orang yang mengumpulkannya dua atau tiga hari sebelum Idul Fitri." }
summary:
  ar: "أول حديث في باب وقت إرسال زكاة الفطر. يرويه مالك عن نافع، أن عبد الله بن عمر كان يبعث بزكاة الفطر إلى الذي تُجمع عنده قبل الفطر بيومين أو ثلاثة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومن طريقه البيهقي (4/112). {cite:muwatta-maruf-1997 p.383}"
  tr: "Zekâtü'l-Fitr'in gönderilme zamanlaması bölümündeki ilk hadis. Malik, Nafi'den rivayet ettiğine göre, Abdullah ibn Umar zekâtü'l-Fitr'i bayramdan iki veya üç gün önce toplayan kişiye gönderirdi. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Şafiî tarafından Musned'inde, onun isnadından da Beyhaki tarafından (4/112) nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.383}"
  id: "Hadits pertama dalam bab ini membahas tentang waktu pengiriman Zakat Fitrah. Diriwayatkan oleh Malik dari Nafi’ bahwa Abdullah ibn Umar biasa mengirimkan Zakat Fitrah kepada orang yang mengumpulkannya dua atau tiga hari sebelum Idul Fitri. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, dan al-Shafi’i dalam Musnadnya, dan dari sanadnya oleh al-Bayhaqi (4/112). {cite:muwatta-maruf-1997 p.383}"
