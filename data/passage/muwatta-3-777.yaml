summary:
  ar: "أول حديث في باب وقت إرسال زكاة الفطر. يرويه مالك عن نافع، أن عبد الله بن عمر كان يبعث بزكاة الفطر إلى الذي تُجمع عنده قبل الفطر بيومين أو ثلاثة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومن طريقه البيهقي (4/112). {cite:muwatta-maruf-1997 p.383}"
