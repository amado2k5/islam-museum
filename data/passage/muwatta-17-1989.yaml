label: { ar: "الموطأ 1989 — يحيى عن مالك: بلغه أن عمر بن الخطاب كره أن يسلف الرجل الرجل طعاما على أن يعطيه إياه في بلد آخر، وقال فأين الحمل؟", en: "Muwatta 1989", es: "Muwatta 1989", fr: "Muwatta 1989", ur: "موطا 1989", tr: "El-Muvatta 1989 — Yahya, Malik'ten rivayetle: Ömer ibn el-Hattab'ın, bir adamın başka birine yemeği başka bir ülkede teslim etmesi şartıyla ödünç vermesinden hoşlanmadığını ve \"Teslimat nerede?\" dediğini işitti.", id: "Al-Muwatta 1989 — Yahya berdasarkan riwayat Malik: Dia mendengar bahwa Umar ibn al-Khattab tidak menyukai praktik meminjamkan makanan kepada orang lain dengan syarat memberikannya di negara lain, dan dia berkata, “Di mana tempat pengirimannya?”" }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن عمر بن الخطاب قال في رجل أسلف رجلا طعاما على أن يعطيه إياه في بلد آخر: فكره عمر ذلك، وقال: فأين الحمل؟ يعني حملانه. {cite:muwatta-maruf-1997 p.214}"
  tr: "Yahya, Malik'ten rivayetle, Ömer ibn el-Hattab'ın, bir adama başka bir ülkede kendisine geri vermesi şartıyla yemek ödünç veren bir adam hakkında şöyle dediğini işittiğini aktarır: Ömer bunu beğenmedi ve şöyle dedi: \"Peki, yükümlülük nerede?\" Yani, yükümlülükleri nerede? {cite:muwatta-maruf-1997 s.214}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar Umar bin al-Khattab berkata tentang seorang pria yang meminjamkan makanan kepada pria lain dengan syarat ia akan mengembalikannya di negara lain: Umar tidak menyukai hal itu dan berkata: Lalu di manakah bebannya? Maksudnya beban-bebannya. {cite:muwatta-maruf-1997 p.214}"
