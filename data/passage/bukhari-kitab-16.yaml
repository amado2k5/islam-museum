summary:
  ar: "القسم 16 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الكسوف»، ويضم فيها النصوص من 1040 إلى 1066 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 16 of Sahih al-Bukhari (Eclipses) in the division of the open hadith dataset the museum took its reports from: reports 1040 to 1066 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 16، عنوان «کتاب الکسوف»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1040 تا 1066۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 16 de Sahih al-Bukhari (Eclipses) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1040 al 1066, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
