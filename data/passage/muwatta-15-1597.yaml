label: { ar: "الموطأ 1597 — مالك: بلغه أن عبد الله بن عمر وأبا هريرة سئلا عن الرجل يملك امرأته أمرها، فترد ذلك إليه، ولا تقضي فيه شيئا، فقالا ليس ذلك بطلاق", en: "Muwatta 1597", es: "Muwatta 1597", fr: "Muwatta 1597", ur: "موطا 1597", tr: "El-Muvatta 1597 — Malik: Abdullah bin Ömer ve Ebu Hurayra'ya, karısına kendi işlerinin yönetimini veren, kadının da bunu ona geri verdiği ve bu konuda hiçbir şeye karar vermediği bir adam hakkında soru sorulduğu ve onların bunun boşanma olmadığı yönünde cevap verdikleri rivayet edilmiştir.", id: "Al-Muwatta 1597 — Malik: Sampai kepadanya bahwa Abdullah bin Umar dan Abu Hurairah ditanya tentang seorang pria yang memberikan kendali kepada istrinya atas urusannya, dan istrinya mengembalikannya kepadanya tanpa memutuskan apa pun mengenai hal itu, dan mereka berkata bahwa ini bukanlah perceraian." }
summary:
  ar: "يقول مالك إنه بلغه أن عبد الله بن عمر وأبا هريرة سئلا عن الرجل يملك امرأته أمرها، فترد ذلك إليه، ولا تقضي فيه شيئا، فقالا ليس ذلك بطلاق. {cite:muwatta-maruf-1997 p.64}"
  tr: "Malik, Abdullah bin Ömer ve Ebu Hurayra'ya, karısına kendi işlerinin kontrolünü veren, ancak kadının bu kontrolü ona geri verip hiçbir konuda karar vermediği bir adam hakkında soru sorulduğunu ve onların bunun boşanma olmadığını söylediklerini duyduğunu aktarıyor. {cite:muwatta-maruf-1997 s.64}"
  id: "Malik mengatakan bahwa ia mendengar Abdullah bin Umar dan Abu Hurairah ditanya tentang seorang pria yang memberikan kendali kepada istrinya atas urusannya, dan istrinya mengembalikan kendali itu kepadanya tanpa memutuskan apa pun mengenai hal tersebut, dan mereka mengatakan bahwa ini bukanlah perceraian. {cite:muwatta-maruf-1997 p.64}"
