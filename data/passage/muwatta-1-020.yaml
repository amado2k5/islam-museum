label: { ar: "الموطأ 20 — ابن عباس في تفسير الدلوك والغسق", en: "Muwatta 20" }
text: "دلوك الشمس إذا فاء الفيء، وغسق الليل اجتماع الليل وظلمته"
summary:
  ar: "أثر يرويه مالك عن داود بن الحصين قال: أخبرني مخبر، أن عبد الله بن عباس كان يفسر دلوك الشمس بأن يفيء الفيء بعد الزوال، وغسق الليل باجتماع ظلمته؛ وهو في باب ما جاء في دلوك الشمس وغسق الليل. ويقول المحقق إن إسناده ضعيف لجهالة شيخ داود بن الحصين، وينقل عن السيوطي والزرقاني أن المخبر هو عكرمة وأن مالكاً كان يكتم اسمه لكلام سعيد بن المسيب فيه كما ذكره ابن عبد البر في الاستذكار، فإن صح ذلك فالإسناد ضعيف أيضاً لضعف داود في روايته عن عكرمة خاصة. {cite:muwatta-maruf-1997 p.42} {cite:muwatta-maruf-1997 p.43}"
  en: "Ibn Abbas on the meaning of the sun's decline and the coming of night; the report's chain is weak because one of its transmitters is unknown."
