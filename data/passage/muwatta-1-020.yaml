label: { ar: "الموطأ 20 — ابن عباس في تفسير الدلوك والغسق", en: "Muwatta 20", es: "Muwatta 20", fr: "Muwatta 20", ur: "موطا 20", tr: "El-Muvatta 20 — İbn Abbas'ın güneşin tepe noktası ve alacakaranlık hakkındaki yorumu", id: "Al-Muwatta 20 — Ibnu Abbas tentang tafsir zenit matahari dan senja" }
text: "دلوك الشمس إذا فاء الفيء، وغسق الليل اجتماع الليل وظلمته"
summary:
  ar: "أثر يرويه مالك عن داود بن الحصين قال: أخبرني مخبر، أن عبد الله بن عباس كان يفسر دلوك الشمس بأن يفيء الفيء بعد الزوال، وغسق الليل باجتماع ظلمته؛ وهو في باب ما جاء في دلوك الشمس وغسق الليل. ويقول المحقق إن إسناده ضعيف لجهالة شيخ داود بن الحصين، وينقل عن السيوطي والزرقاني أن المخبر هو عكرمة وأن مالكاً كان يكتم اسمه لكلام سعيد بن المسيب فيه كما ذكره ابن عبد البر في الاستذكار، فإن صح ذلك فالإسناد ضعيف أيضاً لضعف داود في روايته عن عكرمة خاصة. {cite:muwatta-maruf-1997 p.42} {cite:muwatta-maruf-1997 p.43}"
  en: "Ibn Abbas on the meaning of the sun's decline and the coming of night; the report's chain is weak because one of its transmitters is unknown."
  es: "Ibn Abbas sobre el significado del declive del sol y la llegada de la noche; la cadena de transmisión del relato es débil porque se desconoce la identidad de uno de sus transmisores."
  fr: "Ibn Abbas s'exprime sur la signification du déclin du soleil et de la venue de la nuit; la chaîne de transmission de ce récit est faible car l'un de ses transmetteurs est inconnu."
  ur: "سورج کے ڈھلنے اور رات کے آنے کے معنی پر ابن عباس۔ رپورٹ کا سلسلہ کمزور ہے کیونکہ اس کا ایک ٹرانسمیٹر نامعلوم ہے۔"
  tr: "Malik'in, Davud ibn el-Hüseyn'den rivayet ettiği bir rivayette şöyle denmektedir: \"Bir muhbir bana Abdullah ibn Abbas'ın güneşin batışını öğleden sonra gölgelerin geri dönüşü, gecenin karanlığını ise karanlığın toplanması olarak yorumladığını söyledi.\" Bu, güneşin batışı ve gecenin karanlığı hakkında rivayet edilenler bölümünde yer almaktadır. Araştırmacı, Davud ibn el-Hüseyn'in hocasının kimliğinin bilinmemesi nedeniyle rivayet zincirinin zayıf olduğunu belirtmektedir. El-Suyuti ve el-Zarqani'nin muhbirin İkrime olduğunu ve Malik'in, İbn Abd el-Barr'ın el-İstidhkar'da bahsettiği gibi, Sa'id ibn el-Musayyib'in onun hakkında söyledikleri nedeniyle adını gizlediğini söylediğini aktarmaktadır. Eğer bu doğruysa, özellikle Davud'un İkrime'den rivayetlerindeki zayıflık nedeniyle de rivayet zinciri zayıftır. {cite:muwatta-maruf-1997 s.42} {cite:muwatta-maruf-1997 s.43}"
  id: "Sebuah riwayat dari Malik, berdasarkan keterangan Dawud ibn al-Husayn, menyatakan: “Seorang informan memberitahuku bahwa Abdullah ibn Abbas menafsirkan terbenamnya matahari sebagai kembalinya bayangan setelah tengah hari, dan kegelapan malam sebagai berkumpulnya kesuraman malam.” Hal ini terdapat dalam bab tentang riwayat-riwayat mengenai terbenamnya matahari dan kegelapan malam. Peneliti menyatakan bahwa sanadnya lemah karena identitas guru Dawud ibn al-Husayn tidak diketahui. Ia mengutip al-Suyuti dan al-Zarqani yang mengatakan bahwa informan tersebut adalah Ikrimah, dan bahwa Malik menyembunyikan namanya karena apa yang dikatakan Sa’id ibn al-Musayyib tentangnya, sebagaimana disebutkan oleh Ibn Abd al-Barr dalam al-Istidhkar. Jika ini benar, maka sanadnya juga lemah karena kelemahan Dawud dalam riwayat-riwayatnya dari Ikrimah khususnya. {kutip:muwatta-maruf-1997 hal.42} {kutip:muwatta-maruf-1997 hal.43}"
