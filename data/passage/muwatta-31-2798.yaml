label: { ar: "الموطأ 2798 — أبو سعيد الخدري: الحية في بيت الفتى الأنصاري وأن الجن أسلموا بالمدينة", en: "Muwatta 2798", es: "Muwatta 2798", fr: "Muwatta 2798", ur: "موطا 2798", tr: "El-Muvatta 2798 — Ebu Said El-Hudri: Yılan, genç Ensari'nin evindeydi ve cinler Medine'de İslam'ı kabul ettiler.", id: "Al-Muwatta 2798 — Abu Saeed Al-Khudri: Ular itu berada di rumah seorang pemuda Ansar, dan jin memeluk Islam di Madinah." }
summary:
  ar: "يروي مالك عن صيفي مولى ابن أفلح، عن أبي السائب مولى هشام بن زهرة، أنه دخل على أبي سعيد الخدري فوجده يصلي، فسمع تحريكا تحت سريره، فإذا حية، فقام ليقتلها، فأشار إليه أبو سعيد أن اجلس. فلما انصرف أراه بيتا في الدار، وحكى له أن فتى من الأنصار كان حديث عهد بعرس، فخرج مع رسول الله إلى الخندق، فاستأذن أن يحدث بأهله عهدا، فأذن له وأمره بأخذ السلاح خشية بني قريظة. فوجد امرأته بين البابين، فأهوى إليها برمحه، فقالت: لا تعجل حتى تدخل فتنظر ما في بيتك. فدخل فإذا حية منطوية على فراشه، فركز فيها رمحه، فاضطربت الحية في رأس الرمح، ومات الفتى والحية، فلا يدرى أيهما كان أسرع موتا. فذكروا ذلك للنبي فقال: إن بالمدينة جنا قد أسلموا، فإذا رأيتم منهم شيئا فآذنوهم ثلاثة أيام، فإن بدا لكم بعد ذلك فاقتلوه، فإنما هو شيطان. {cite:muwatta-maruf-1997 p.571} {cite:muwatta-maruf-1997 p.572}"
  tr: "Malik, İbn Aflah'ın azatlı kölesi Sayfi'den, o da Hişam ibn Zuhra'nın azatlı kölesi Ebu el-Sa'ib'den rivayet ettiğine göre, Ebu Sa'id el-Hudri'nin evine girdiğinde onu namaz kılarken buldu. Yatağının altında bir hareket duydu ve bir yılan gördü. Onu öldürmek için ayağa kalktı, ancak Ebu Sa'id ona oturmasını işaret etti. Namazını bitirdiğinde, ona evdeki bir odayı gösterdi ve ona yakın zamanda evlenmiş Ensar'dan genç bir adamdan bahsetti. Allah'ın Resulü ile birlikte hendeğe çıktı ve karısını ziyaret etmek için izin istedi. Peygamber ona izin verdi ve Beni Kurayza'dan korktuğu için silahlanmasını emretti. Karısını iki kapı arasında buldu ve mızrağıyla ona doğru uzandı. Karısı, \"İçeri girip evinde ne olduğunu görmeden acele etme\" dedi. İçeri girdi ve yatağında kıvrılmış bir yılan buldu. Mızrağını yılana sapladı ve yılan mızrağın ucuna karşı çırpındı. Hem genç adam hem de yılan öldü ve hangisinin önce öldüğü bilinmiyor. Bunu Peygamberimize anlattılar, o da şöyle buyurdu: \"Medine'de İslam'ı kabul etmiş cinler vardır. Onlardan birini görürseniz, üç gün önceden haber verin. Bundan sonra size görünürlerse, onları öldürün, çünkü onlar şeytanlardır.\" {cite:muwatta-maruf-1997 s.571} {cite:muwatta-maruf-1997 s.572}"
  id: "Malik meriwayatkan dari Sayfi, budak yang dibebaskan oleh Ibn Aflah, dari Abu al-Sa'ib, budak yang dibebaskan oleh Hisham ibn Zuhrah, bahwa ia menemui Abu Sa'id al-Khudri dan mendapati beliau sedang shalat. Ia mendengar gerakan di bawah tempat tidurnya dan melihat seekor ular. Ia berdiri untuk membunuhnya, tetapi Abu Sa'id memberi isyarat agar ia duduk. Setelah selesai shalat, ia menunjukkan sebuah ruangan di rumah itu dan menceritakan tentang seorang pemuda dari kaum Ansar yang baru saja menikah. Pemuda itu pergi bersama Rasulullah ke parit dan meminta izin untuk mengunjungi istrinya. Nabi mengabulkannya dan memerintahkannya untuk mengangkat senjata karena takut akan Bani Quraisy. Ia menemukan istrinya di antara dua pintu dan mengulurkan tombaknya ke arahnya. Istrinya berkata, \"Jangan terburu-buru sampai engkau masuk ke dalam dan melihat apa yang ada di rumahmu.\" Ia masuk dan menemukan seekor ular melingkar di tempat tidurnya. Ia menusukkan tombaknya ke ular itu, dan ular itu meronta-ronta melawan ujung tombak. Baik pemuda itu maupun ular tersebut meninggal, dan tidak diketahui mana yang meninggal lebih dulu. Mereka menceritakan hal ini kepada Nabi, yang kemudian berkata: \"Ada jin di Madinah yang telah memeluk Islam. Jika kalian melihat salah satu dari mereka, beri mereka pemberitahuan tiga hari sebelumnya. Jika mereka muncul kembali setelah itu, bunuhlah mereka, karena mereka adalah setan.\" {cite:muwatta-maruf-1997 p.571} {cite:muwatta-maruf-1997 p.572}"
