label: { ar: "الموطأ 2798 — أبو سعيد الخدري: الحية في بيت الفتى الأنصاري وأن الجن أسلموا بالمدينة", en: "Muwatta 2798" }
summary:
  ar: "يروي مالك عن صيفي مولى ابن أفلح، عن أبي السائب مولى هشام بن زهرة، أنه دخل على أبي سعيد الخدري فوجده يصلي، فسمع تحريكا تحت سريره، فإذا حية، فقام ليقتلها، فأشار إليه أبو سعيد أن اجلس. فلما انصرف أراه بيتا في الدار، وحكى له أن فتى من الأنصار كان حديث عهد بعرس، فخرج مع رسول الله إلى الخندق، فاستأذن أن يحدث بأهله عهدا، فأذن له وأمره بأخذ السلاح خشية بني قريظة. فوجد امرأته بين البابين، فأهوى إليها برمحه، فقالت: لا تعجل حتى تدخل فتنظر ما في بيتك. فدخل فإذا حية منطوية على فراشه، فركز فيها رمحه، فاضطربت الحية في رأس الرمح، ومات الفتى والحية، فلا يدرى أيهما كان أسرع موتا. فذكروا ذلك للنبي فقال: إن بالمدينة جنا قد أسلموا، فإذا رأيتم منهم شيئا فآذنوهم ثلاثة أيام، فإن بدا لكم بعد ذلك فاقتلوه، فإنما هو شيطان. {cite:muwatta-maruf-1997 p.571} {cite:muwatta-maruf-1997 p.572}"
