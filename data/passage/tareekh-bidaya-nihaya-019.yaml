text: "قبل حجة الوداع ويدعونهم إلى الله [عز وجل] 1) قال البخاري: باب بعث أبي موسى ومعاذ إلى اليمن قبل حجة الوداع. حدثنا موسى، ثنا أبو عوانة، ثنا عبد الملك عن أبي بردة، قال: بعث النبي لي أبا موسى ومعاذ بن"
