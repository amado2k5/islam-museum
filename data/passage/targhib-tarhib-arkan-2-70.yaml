text: "… - وعن ابن عباسما أن رسول اللّٰه واي له قال لا يخلون أحدكم بامرأة الامع ذى محرم رواء البخارى ومُسلم وتقدم في أحاديث الحهام حديث ابن عباس عن النب وفيه ومن كان يؤمن بالله واليوم الآخر فلا يخلون بامرأة ليس …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 2، ص 70، يذكر عمل معلَّق بالإيمان بالله واليوم الآخر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
