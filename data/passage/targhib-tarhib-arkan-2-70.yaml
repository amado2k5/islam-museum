  ur: "الترغیب والترہیب، منذری، اسکین جلد 2، ص 70 کا اقتباس جس میں اللہ اور یومِ آخرت پر ایمان سے جڑا عمل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
