text: "الحديث الثامن عشر الصلواتُ الخمسُ، والجمعةُ إلى الجمعةِ، ورمضانُ إلى رمضانَ مُكَفِّراتٌ لما بينهن ما اجتُنبت الكبائرُ، فإنَّ في حبس النفس على المواظبة على الفرائضِ من مخالفة هواها وكَفِّهَا عما تميلُ إليه ما يُوجبُ ذلك تكفير الصغائر. وكذلك الشهادةُ في …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 419، يرد فيه ذكر الفريضة والفرائض، وصغائر الذنوب، وما يُكفَّر باجتناب الكبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 419, whose wording mentions the obligation (farida), the minor sins, what is expiated when the major sins are avoided; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 419 کا اقتباس جس میں فریضہ اور فرائض، صغیرہ گناہ، جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volume numérisé 2, p. 419, dont le texte mentionne l'obligation (farida), les péchés mineurs, ce qui est expié quand les grands péchés sont évités ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen digitalizado 2, p. 419, cuyo texto menciona la obligación (farida), los pecados menores, lo que se expía cuando se evitan los pecados mayores; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 419. sayfasından, farz ameller, küçük günahlar ve büyük günahlardan kaçınmanın kefaretini ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 419, yang membahas tentang amalan wajib, dosa-dosa kecil, dan apa yang dapat ditebus dengan menghindari dosa-dosa besar. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
