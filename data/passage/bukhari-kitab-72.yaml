summary:
  ar: "القسم 72 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الذبائح والصيد»، ويضم فيها النصوص من 5475 إلى 5544 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 72 of Sahih al-Bukhari (Hunting, Slaughtering) in the division of the open hadith dataset the museum took its reports from: reports 5475 to 5544 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 72، عنوان «کتاب الذبائح والصید»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5475 تا 5544۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 72 de Sahih al-Bukhari (Caza y matanza) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5475 al 5544, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 72 du Sahih al-Bukhari (Chasse, Abattage), correspondant aux hadiths 5475 à 5544 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
