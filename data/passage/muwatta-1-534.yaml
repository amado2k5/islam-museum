text: "أن لا يمس القرآن إلا طاهر"
summary:
  ar: "أول حديث في باب الأمر بالوضوء لمن مس القرآن. يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم، أن في الكتاب الذي كتبه النبي لعمرو بن حزم أن لا يمس القرآن إلا طاهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني، وأن كتاب النبي لعمرو بن حزم إلى أهل اليمن في السنن والفرائض والديات كتاب مشهور عند أهل العلم، ويحيل على المسند الجامع (14/120) والتمهيد (17/396). {cite:muwatta-maruf-1997 p.275}"
