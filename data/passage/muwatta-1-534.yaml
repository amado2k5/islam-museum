text: "أن لا يمس القرآن إلا طاهر"
summary:
  ar: "أول حديث في باب الأمر بالوضوء لمن مس القرآن. يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم، أن في الكتاب الذي كتبه النبي لعمرو بن حزم أن لا يمس القرآن إلا طاهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني، وأن كتاب النبي لعمرو بن حزم إلى أهل اليمن في السنن والفرائض والديات كتاب مشهور عند أهل العلم، ويحيل على المسند الجامع (14/120) والتمهيد (17/396). {cite:muwatta-maruf-1997 p.275}"
  tr: "Kur'an'a dokunan için abdest alma emriyle ilgili bölümdeki ilk hadis, Malik tarafından Abdullah ibn Abi Bekr ibn Muhammed ibn Amr ibn Hazm'dan rivayet edilmiştir. Peygamberin Amr ibn Hazm'a yazdığı mektupta, Kur'an'a ancak temiz bir halde olanın dokunabileceği belirtilmiştir. Editör, bu hadisin Malik'ten Ebu Musab, Suveyd ve Muhammed ibn el-Hasan el-Şeybani tarafından rivayet edildiğini ve Peygamberin Yemen halkına sünnet, miras kanunları ve kan parası hakkında yazdığı mektubun âlimler arasında bilinen bir kitap olduğunu belirtmektedir. El-Musnad el-Cami' (14/120) ve el-Tamhid'e (17/396) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.275}"
  id: "Hadits pertama dalam bab ini membahas tentang perintah berwudhu bagi orang yang menyentuh Al-Quran. Diriwayatkan oleh Malik dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, bahwa dalam surat Nabi kepada Amr ibn Hazm, disebutkan bahwa hanya orang yang dalam keadaan suci yang boleh menyentuh Al-Quran. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, dan Muhammad ibn al-Hasan al-Shaybani, dan bahwa surat Nabi kepada Amr ibn Hazm yang ditujukan kepada penduduk Yaman mengenai Sunnah, hukum warisan, dan uang darah adalah kitab yang terkenal di kalangan ulama. Beliau merujuk pada al-Musnad al-Jami' (14/120) dan al-Tamhid (17/396). {cite:muwatta-maruf-1997 p.275}"
