  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 1. cildinin 28. sayfasında, Allah'a ve Ahiret Günü'ne olan imanla ilgili bir eylemden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak yönergelerine uygun olarak, metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 1, halaman 28, menyebutkan sebuah perbuatan yang berkaitan dengan iman kepada Tuhan dan Hari Kiamat; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
