text: "… ماجه والترمذى. واللفظ له وقال حديث حسن صحيح الترغيب في الحب في اللّه تعالى والترهيب من حب الاشرار وأهل البدع لان المرمع من أحب - عن انس عن النبى قال ثلاث من كن فيه وجد بمن حلاوة الايمان من كان …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 3، ص 357، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 3, p. 357, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 3، ص 357 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 3, pág. 357, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Tarhib wa-l-Tarhib d'al-Mundhiri (tome 3, p. 357) évoquant la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Répertoire des Piliers et des Branches de la Foi."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 3. cildinin 357. sayfasından bir alıntı, imanın tatlılığı ve mükemmelliğinden ve ona sahip olanların niteliklerinden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Dorongan dan Peringatan), Jilid 3, halaman 357, menyebutkan kemanisan dan kesempurnaan iman, serta sifat-sifat orang yang memilikinya. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
