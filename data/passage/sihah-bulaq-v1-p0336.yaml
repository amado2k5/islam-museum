text: |-
  فصل الحا.)
  ⁦(حشر )⁩
  ٣٠٥
  خرجن حريرات وأبدين مجلدا * وجالت عليهنّ المكتبة الصفر
  ويقال انى لأجدلهذا الطعام حرورة فى فى أى حرارة ولذعا وحرورا اسم قرية يمدّويقصر
  سبت اليها الحرورية من الخوارج لانه كان أوّل مجتمعهم بها وتحكيمهم منها يقال حرورى
  بين الحرورية والحرور الريح الحارة وهى بالليل كالسموم بالنهار وقال أبو عبيدة الجرور
  بالليل وقد تكون بالنهار والسموم بالنهاروقد تكون بالليل قال العجاج
  ونسجت لوامع الحرور • سبائبا كسرق الحرير
  وحى العبد يحزْ حرارا قال الشاعر وماردّ من بعد الحرار عتيق وحرّ الرحل يحر
  حرية من حرّية الاصول وحرّ الرجسل يحر حرّة عطش فهذه الثلاثه بكسر العين فى الماضى
  وقتحها فى المستقبل وأماحرتالنهارففيه لغتان تقول حررت بايوم بالفتح وحررت بالكسر
  فأنت تحرّ وتحرّوتحرح" اوحرارة وحرو ور أحرّ النهاراغة فيسه سمعها الكسائى وأحر الرجل
  فهو محرّأى صارت ابله حرارا أى عطاشار -كى الفراءرجل -ربين الحرورية وتحرير الكتاب
  وغيره تقو يمه وتحرير الرقبة عنتها وتحرير الولد أن تفرّده اطاعة اللّٰه وخدمة المسحد
  واستحرّ القتل وحرً ؟عنى أى اشتد .( حزر الحزر التقدير والحرص تقول حزرت الشئ
  أحزره وأحزره والحازر الخارص والحازر اللبن الخامض وقدحزر اللبن والنييذأى حض
  وحزرة المال خياره بقال هذاحزرة نفسى أى خير ماعندى والجمع حزرات بالتخريك وفى
  الحديث لا تأخذ من حزرات أنفس الناس شيئا يعني فى الصدقة قال الراجز
  لحزرات حزرات النفس . أى هى ممابودها النفس وقال آخر
  وحزرة القلب خيار المال
  والحزاور الروانى الصغار الواحدة حزورة وهى تل صغ
  والحزورايضا الغلام اذا استد وقوى وخدم قال يعقوب*والذى قد كاديدركولم
  بفعل وقال الراجز لن تعدم المطى منامسفرا • شيخابجالاوغلاما حزورا
  وكذلك الحزوّر بتشديد الواو والجمع الحزاورة وحزيران بارومية اسم شهرقبل تموز
  ⁦( حسمر)⁩ حسرت كى عن ذراعى أحسره حسمرا كشفت والحاسر الذى لا مغفرله
  ولا درع والانيسار الانكشاف والحسرة المكنة وحسر البعير يحسر حسورا أعيا
  واستحسر وتحسر مثله وحسرته أنا حسر ايتعدى ولا يتعدى وأحسرته أبضافهو حسير
  والجمع حسرى مثل قتسل وققلى وحسر بصره يحسر حسورا أى كل وائة طع نظره من طول
  مدى وما أشبه ذلك فهو حسير ومحسور أيضا قال قيس بن خويلدالهذلى يصف ناقة
  ان الحسير بها داء مخامرها * فشطر «انظر المينين محسور
  صب شطرها على الظرف أى نحوها وفلان كريم المحسر أى كريم الخبر والحسرة أشدّ التلهف
  على الشئ الفائت تقول منه حسر ع-لي الشى بالكسر يحسر حسرا وحسرة فهو حسير
  وحسرت غيرى تحسيرا وحسرت الطير تحسير اسقط ريشها والتحسر التلهف وتحسروبر
  البعبر أى سقط ورجل محسر أى مؤذى وفى الحديث أصحابه محسرون أى محرون وبطن
  محسر بكسر السين موضع بعنى ( شمر ، ابن السكيت أذن حشر أى اطيفة كأنها
  حشعرت حشرا أى بريت وحددت وكذلك غيرها وآذان حشر لا يثى ولا يجمع لانه مصدر
  ٧٧.
  صداح
