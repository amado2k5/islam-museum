label: { ar: "صحيح مسلم 2919 — الأب والأبوة", en: "Sahih Muslim 2919 — the father and fatherhood", ur: "صحیح مسلم 2919 — باپ اور والدیت", es: "Sahih Muslim 2919 — El padre y la paternidad" }
text: "… عَامِرٍ عَبْدُ الْمَلِكِ، بْنُ عَمْرٍو حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ أَبِي سَلَمَةَ الْمَاجِشُونُ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، -ا - قَالَتْ خَرَجْنَا مَعَ رَسُولِ اللَّهِ لاَ نَذْكُرُ إِلاَّ الْحَجَّ حَتَّى جِئْنَا سَرِفَ فَطَمِثْتُ فَدَخَلَ عَلَىَّ رَسُولُ اللَّهِ وَأَنَا أَبْكِي فَقَالَ \" مَا يُبْكِيكِ \". فَقُلْتُ وَاللَّهِ لَوَدِدْتُ أَنِّي لَمْ أَكُنْ خَرَجْتُ الْعَامَ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2919، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2919 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2919، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2919 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
