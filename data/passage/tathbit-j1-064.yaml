label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٢٠، المقطع ٢٧ من ٢٨", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 20, section 27 of 28", ur: "تثبیت دلائل نبوت — حصہ اول، باب 20، حصہ 27", es: "Tathbit Dala'il al-Nubuwwa — Primera parte, capítulo 20, sección 27 de 28", fr: "Tathbit Dala'il al-Nubuwwa — Première partie, chapitre 20, section 27 sur 28", tr: "Peygamberliğin İşaretlerinin Belirlenmesi — Birinci Kısım, 20. Bölüm, 28 Maddeden 27. Kısım", id: "Menetapkan Tanda-Tanda Kenabian — Bagian Pertama, Bab 20, Bagian 27 dari 28" }
text: "مما هو معروف إلى أن يقيم الحجة أو يرجع إلى قول من معه الحجة. وعثمان، فقد عارضوه في إتمام الصلاة بمنى، وفي الحمى، وفي الحكم بن أبي العاص، وفيمن ولاه من أهله، وأخذوه بإقامة الحدود عليهم، وبإقامة الحجة …"
summary:
  ar: "مقطع من الباب ٢٠ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 20 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 20 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
  es: "Un fragmento del capítulo 20 de la primera parte de Tathbit Dala'il al-Nubuwwa, de Qadi Abd al-Jabbar al-Hamdani; el autor mutazilí reúne pruebas de la misión y los milagros del Profeta a partir del Corán y de relatos transmitidos, respondiendo a quienes niegan la profecía o la despojan de sus milagros. El extracto citado proviene de la edición de Wikisource."
  fr: "Extrait du chapitre 20 de la première partie du Tathbit Dala'il al-Nubuwwa du cadi Abd al-Jabbar al-Hamdani; l'auteur mu'tazilite rassemble des preuves de la mission et des miracles du Prophète tirées du Coran et des hadiths, répondant ainsi à ceux qui nient la prophétie ou la privent de ses miracles. Cet extrait est tiré de l'édition Wikisource."
  tr: "Mu'tezile mezhebinin önde gelen isimlerinden Hakim Abdülceber el-Hamdani'nin \"Peygamberliğin Delillerini Ortaya Koymak\" adlı kitabının 20. bölümünden bir alıntı; yazar, Kur'an ve rivayet edilen hadislerden yola çıkarak Peygamberin mesajının ve mucizelerinin doğruluğuna dair deliller topluyor ve peygamberliği inkar edenleri veya mucizelerini reddedenleri çürütüyor. Alıntı, kitabın Wikisource baskısından alınmıştır."
  id: "Cuplikan dari Bab 20 buku \"Membangun Bukti-Bukti Kenabian\" karya Hakim Abd al-Jabbar al-Hamdani, Bagian 1; penulis—salah satu tokoh terkemuka mazhab Mu'tazila—mengumpulkan bukti-bukti kebenaran pesan Nabi dan mukjizatnya, dengan mengutip Al-Quran dan hadits-hadits yang diriwayatkan, serta membantah mereka yang mengingkari kenabian atau menolak mukjizatnya. Cuplikan ini diambil dari edisi buku di Wikisource."
