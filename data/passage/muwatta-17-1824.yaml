label: { ar: "الموطأ 1824 — يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار: التمر بالتمر مثلا بمثل، وأن عامل خيبر كان يأخذ الصاع بالصاعين، فأمره النبي أن يبيع الجمع بالدراهم ثم يبتاع بالدراهم جنيبا", en: "Muwatta 1824", es: "Muwatta 1824", fr: "Muwatta 1824", ur: "موطا 1824", tr: "El-Muvatta 1824 — Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayetle: Hurma karşılığı hurma, aynı türden hurma. Hayber temsilcisi bir sa'yı iki sa'ya alıyordu. Bunun üzerine Peygamber ona hurmaları dirhemle satmasını ve o dirhemle iyi bir hurma almasını emretti.", id: "Al-Muwatta 1824 — Yahya dari Malik dari Zayd ibn Aslam dari Ata ibn Yasar: Kurma ditukar dengan kurma, sama persis, dan bahwa agen Khaybar biasa mengambil satu sa’ untuk dua sa’’, maka Nabi memerintahkannya untuk menjual kurma tersebut dengan dirham dan kemudian membeli kurma yang bagus dengan dirham tersebut." }
summary:
  ar: "يروي يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار أنه قال: قال رسول الله: التمر بالتمر مثلا بمثل. فقيل له: إن عاملك على خيبر يأخذ الصاع بالصاعين. فقال رسول الله: ادعوه لي، فدعي له، فقال له رسول الله: أتأخذ الصاع بالصاعين؟ فقال: يا رسول الله، لا يبيعونني الجنيب بالجمع صاعا بصاع. فقال له رسول الله: بع الجمع بالدراهم، ثم ابتع بالدراهم جنيبا. {cite:muwatta-maruf-1997 p.146}"
  tr: "Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayet ettiğine göre şöyle buyurmuştur: Allah Resulü şöyle buyurdu: \"Hurma karşılığında hurma, aynı miktarda hurma.\" Ona şöyle denildi: \"Hayber'deki temsilciniz bir ölçüyü iki ölçüye alıyor.\" Allah Resulü şöyle buyurdu: \"Onu yanıma çağırın.\" Çağrıldı ve Allah Resulü ona şöyle dedi: \"Sen bir ölçüyü iki ölçüye mi alıyorsun?\" O şöyle dedi: \"Ey Allah Resulü, bana hurmayı bir ölçüye bir ölçüye satmıyorlar.\" Allah Resulü ona şöyle buyurdu: \"Hurmaları dirhemle sat, sonra o dirhemle hurma al.\" {cite:muwatta-maruf-1997 s.146}"
  id: "Yahya meriwayatkan dari Malik, dari Zayd ibn Aslam, dari Ata ibn Yasar, bahwa ia berkata: Rasulullah SAW bersabda: Kurma ditukar dengan kurma, sama dengan sama. Dikatakan kepadanya: Agenmu di Khaybar mengambil takaran untuk dua takaran. Rasulullah SAW bersabda: Panggil dia kepadaku. Maka ia dipanggil, dan Rasulullah SAW bertanya kepadanya: Apakah kamu mengambil takaran untuk dua takaran? Ia menjawab: Wahai Rasulullah, mereka tidak menjual kurma kepadaku dengan takaran yang sama. Rasulullah SAW bersabda kepadanya: Jual kurma dengan dirham, lalu belilah kurma dengan dirham tersebut. {cite:muwatta-maruf-1997 p.146}"
