label: { ar: "الموطأ 1824 — يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار: التمر بالتمر مثلا بمثل، وأن عامل خيبر كان يأخذ الصاع بالصاعين، فأمره النبي أن يبيع الجمع بالدراهم ثم يبتاع بالدراهم جنيبا", en: "Muwatta 1824" }
summary:
  ar: "يروي يحيى عن مالك عن زيد بن أسلم عن عطاء بن يسار أنه قال: قال رسول الله: التمر بالتمر مثلا بمثل. فقيل له: إن عاملك على خيبر يأخذ الصاع بالصاعين. فقال رسول الله: ادعوه لي، فدعي له، فقال له رسول الله: أتأخذ الصاع بالصاعين؟ فقال: يا رسول الله، لا يبيعونني الجنيب بالجمع صاعا بصاع. فقال له رسول الله: بع الجمع بالدراهم، ثم ابتع بالدراهم جنيبا. {cite:muwatta-maruf-1997 p.146}"
