label: { ar: "الموطأ 768 — مالك فيمن وجد صدقته تباع مع غير من تصدق بها عليه: تركها أحب إلي", en: "Muwatta 768", es: "Muwatta 768", fr: "Muwatta 768", ur: "موطا 768", tr: "El-Muvatta 768 — Malik, sadakasının kendisine verildiği kişiden başkasına satıldığını gören kimse hakkında: Bana göre sadakayı bırakmak daha iyidir.", id: "Al-Muwatta 768 — Malik, mengenai seseorang yang mendapati sedekahnya dijual kepada orang lain selain orang yang menerimanya: Meninggalkannya lebih baik bagiku." }
text: "تركها أحب إلي"
summary:
  ar: "يقول يحيى: سئل مالك عن رجل تصدق بصدقة فوجدها مع غير الذي تصدق بها عليه تُباع، أيشتريها؟ فقال: تركها أحب إلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (689). {cite:muwatta-maruf-1997 p.380}"
  tr: "Yahya şöyle dedi: Malik'e, sadaka veren ve sadakanın kendisine verildiği kişiden başkası tarafından satıldığını gören bir adam hakkında soru soruldu. Sadakayı satın almalı mıydı? Cevap verdi: \"Olduğu gibi bırakmayı tercih ederim.\" Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (689) rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.380}"
  id: "Yahya berkata: Malik ditanya tentang seorang pria yang memberikan sedekah dan kemudian mendapati sedekah itu dijual oleh orang lain selain penerimanya. Haruskah dia membelinya? Dia menjawab: Saya lebih suka membiarkannya apa adanya. Peneliti menyebutkan bahwa Abu Mus'ab (689) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.380}"
