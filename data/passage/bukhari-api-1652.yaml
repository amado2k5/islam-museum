label: { ar: "صحيح البخاري 1652 — المرض والمريض، مداواة الجراح", en: "Sahih al-Bukhari 1652 — illness and the sick; the treatment of wounds", ur: "صحیح بخاری 1652 — بیماری اور بیمار، زخموں کا علاج" }
text: "… قَدْ غَزَا مَعَ رَسُولِ اللَّهِ ثِنْتَىْ عَشْرَةَ غَزْوَةً، وَكَانَتْ أُخْتِي مَعَهُ فِي سِتِّ غَزَوَاتٍ، قَالَتْ كُنَّا نُدَاوِي الْكَلْمَى وَنَقُومُ عَلَى الْمَرْضَى. فَسَأَلَتْ أُخْتِي رَسُولَ اللَّهِ فَقَالَتْ هَلْ عَلَى إِحْدَانَا بَأْسٌ إِنْ لَمْ يَكُنْ لَهَا جِلْبَابٌ أَنْ لاَ تَخْرُجَ قَالَ \" لِتُلْبِسْهَا صَاحِبَتُهَا مِنْ جِلْبَابِهَا، وَلْتَشْهَدِ الْخَيْرَ، وَدَعْوَةَ الْمُؤْمِنِينَ \". فَلَمَّا قَدِمَتْ أُمُّ عَطِيَّةَا ـ سَأَلْنَهَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1652، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 1652 (Hajj (Pilgrimage)), that mentions illness and the sick, the treatment of wounds, women treating the wounded, seeking treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 1652، جس میں بیماری اور بیمار، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
