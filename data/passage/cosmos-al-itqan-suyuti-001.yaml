text: "وقصةٍ عادٍ الأولى والثانية، وثمودَ، والناقةِ، وقومٍ يونس، وقومٍ شعيب، الأولين والآخرين، وقومٍ لوط، وقومٍ تُبَّع، وأصحابِ الرَّسِّ"
summary:
  ar: "في النوع الخامس والستين من الإتقان يسرد السيوطي ما في القرآن من قصص الأنبياء والأمم، ومنها عاد الأولى والثانية وثمود وقوم لوط وقوم تبع وأصحاب الرس؛ فهو يعدّ الرس من الأخبار الواردة في القرآن بين أقوام أُهلكوا أو ذُكروا للعبرة."
  en: "In type sixty-five of al-Itqan, al-Suyuti lists the narratives the Qur'an contains of prophets and peoples, among them the first and second Ad, Thamud, the people of Lut, the people of Tubba' and the People of al-Rass, treating al-Rass as one of the accounts the Qur'an gives of vanished peoples."
