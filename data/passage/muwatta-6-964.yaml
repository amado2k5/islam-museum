label: { ar: "الموطأ 964 — عمرة عن عائشة: كتب زياد بن أبي سفيان إلى عائشة أن ابن عباس قال: من أهدى هدياً حرم عليه ما يحرم على الحاج حتى ينحر الهدي؛ فقالت عائشة: ليس كما قال ابن عباس، أنا فتلت قلائد هدي رسول الله", en: "Muwatta 964", es: "Muwatta 964", fr: "Muwatta 964", ur: "موطا 964", tr: "El-Muvatta 964 — Aişe'den rivayet edildiğine göre: Ziyad ibn Abi Sufyan, Aişe'ye İbn Abbas'ın şöyle dediğini yazdı: \"Kurban kesen kimse, hayvan kesilinceye kadar hacı için haram olan şeylerden mahrum kalır.\" Aişe şöyle dedi: \"İbn Abbas'ın dediği gibi değil. Ben, Allah Resulü'nün kurbanları için çelenkler ördüm.\"", id: "Al-Muwatta 964 — Dari Aisyah: Ziyad ibn Abi Sufyan menulis kepada Aisyah bahwa Ibnu Abbas berkata: Barangsiapa mempersembahkan hewan kurban, maka diharamkan apa yang diharamkan bagi seorang jamaah haji hingga hewan tersebut disembelih. Aisyah berkata: Itu tidak seperti yang dikatakan Ibnu Abbas. Aku merangkai karangan bunga untuk hewan kurban Rasulullah." }
text: "ليس كما قال ابن عباس، أنا فتلت قلائد هدي رسول الله بيدي، ثم قلدها رسول الله بيده، ثم بعث بها مع أبي. فلم يحرم على رسول الله شيء أحله الله له حتى نحر الهدي"
summary:
  ar: "أول حديث في باب ما لا يوجب الإحرام من تقليد الهدي. يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن عمرة بنت عبد الرحمن، أنها أخبرته أن زياد بن أبي سفيان كتب إلى عائشة زوج النبي، أن عبد الله بن عباس قال: من أهدى هدياً حرم عليه ما يحرم على الحاج حتى ينحر الهدي، وقد بعثت بهدي فاكتبي إلي بأمرك. فقالت عائشة: ليس كما قال ابن عباس، أنا فتلت قلائد هدي رسول الله بيدي، ثم قلدها رسول الله بيده، ثم بعث بها مع أبي، فلم يحرم على رسول الله شيء أحله الله له حتى نحر الهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1096) وإسماعيل بن أبي أويس عند البخاري (2317) وسويد وغيرهم. {cite:muwatta-maruf-1997 p.458}"
  tr: "İhramı gerektirmeyen hususlar bölümündeki ilk hadis, kurbanlık hayvanların çelengiyle ilgili olanıdır. Malik, Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan, Amrah bint Abd al-Rahman'dan rivayetle, Ziyad ibn Abi Sufyan'ın Peygamberimizin eşi Aişe'ye yazdığı bir mektupta, Abdullah ibn Abbas'ın şöyle dediğini aktarmıştır: \"Kim kurban keserse, hayvan kesilinceye kadar hacı ile aynı yasaklara tabidir. Ben bir kurbanlık hayvan gönderdim, bana talimatlarını yaz.\" Aişe şöyle cevap verdi: \"İbn Abbas'ın dediği gibi değil. Ben Resulullah'ın kurbanlık hayvanları için çelengi kendi ellerimle ördüm, sonra Resulullah da kendi elleriyle çelengi taktı, sonra babamla gönderdi. Allah'ın Resulullah için helal kıldığı hiçbir şey, hayvan kesilinceye kadar haram olmadı.\" Editör, bu rivayetin Malik'ten Ebu Musab (1096), İsmail ibn Abi Uveys ve diğerleri tarafından nakledildiğini ve Buhari'nin (2317) kaydettiğini belirtiyor. {cite:muwatta-maruf-1997 s.458}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang tidak mengharuskan ihram terkait dengan merangkai kalung pada hewan kurban. Diriwayatkan oleh Malik dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, dari Amrah bint Abd al-Rahman, yang memberitahunya bahwa Ziyad ibn Abi Sufyan menulis kepada Aisyah, istri Nabi, bahwa Abdullah ibn Abbas berkata: “Siapa pun yang mempersembahkan hewan kurban terikat oleh larangan yang sama seperti orang yang berziarah sampai hewan itu disembelih. Aku telah mengirimkan hewan kurban, jadi tulislah kepadaku dengan instruksimu.” Aisyah menjawab: “Bukan seperti yang dikatakan Ibnu Abbas. Aku merangkai kalung untuk hewan kurban Rasulullah dengan tanganku sendiri, kemudian Rasulullah merangkainya dengan tangannya sendiri, lalu mengirimkannya bersama ayahku. Tidak ada sesuatu pun yang dihalalkan Allah bagi Rasulullah yang menjadi haram baginya sampai hewan itu disembelih.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1096), Ismail bin Abi Uways, dan lainnya, sebagaimana tercatat oleh al-Bukhari (2317). {cite:muwatta-maruf-1997 p.458}"
