label: { ar: "الموطأ 964 — عمرة عن عائشة: كتب زياد بن أبي سفيان إلى عائشة أن ابن عباس قال: من أهدى هدياً حرم عليه ما يحرم على الحاج حتى ينحر الهدي؛ فقالت عائشة: ليس كما قال ابن عباس، أنا فتلت قلائد هدي رسول الله", en: "Muwatta 964" }
text: "ليس كما قال ابن عباس، أنا فتلت قلائد هدي رسول الله بيدي، ثم قلدها رسول الله بيده، ثم بعث بها مع أبي. فلم يحرم على رسول الله شيء أحله الله له حتى نحر الهدي"
summary:
  ar: "أول حديث في باب ما لا يوجب الإحرام من تقليد الهدي. يرويه مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن عمرة بنت عبد الرحمن، أنها أخبرته أن زياد بن أبي سفيان كتب إلى عائشة زوج النبي، أن عبد الله بن عباس قال: من أهدى هدياً حرم عليه ما يحرم على الحاج حتى ينحر الهدي، وقد بعثت بهدي فاكتبي إلي بأمرك. فقالت عائشة: ليس كما قال ابن عباس، أنا فتلت قلائد هدي رسول الله بيدي، ثم قلدها رسول الله بيده، ثم بعث بها مع أبي، فلم يحرم على رسول الله شيء أحله الله له حتى نحر الهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1096) وإسماعيل بن أبي أويس عند البخاري (2317) وسويد وغيرهم. {cite:muwatta-maruf-1997 p.458}"
