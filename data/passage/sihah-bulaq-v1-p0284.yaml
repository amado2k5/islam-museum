text: |-
  ⁦(فصل العين)⁩
  ⁦(عبر)⁩
  ٣٥٧
  البيت علوته وأظهرت بفسلان أعلنت به وأظهره اللّٰه على عدوه وأظهرت الشئ بنته
  وأظهرنا أى سرنافى وقت الظهر والمظاهرة المعاونة والتظاهر التعاون وتظاهر القوم أيضا
  تدابروا كانه ولى كل واحد منهم ظهره الى صاحبه واستظهربه أى استعان به واستفلهر الشئ
  أى حفظه وقرأمظاهرا قال أبو عبيدة فى ريش السهام الظهار بالضم وهو ماجعل من ظهر
  عسيب الريشة والظهران الجانب القصير من الريس والبطنان الجانب الطويل يقال رش
  سهمك بظهران ولا ترشه يبطنان الواحد ظهر وإبان مثل عبدوعبدان والظهارة بالكسر
  فيض البطانة وظاه ر بين توبين أى طارق بيتهما وطابق والظهارقول الرجل لامر أنه أنت
  علىّ كظه ر أى وقد ظاهر من امر أنه وتظهر من امر أنه وظهر من امر أنه نظهيرا كله بمعنى
  والمظهر يفتح الهاء مشدّدة الرجل الشديد الظهر والمظهر بكسر الهاءاسم رجل قال
  الاصمعى أتانافلان مظهرا أى فى وقت الظهيرة قال ومنه سحى الرجسل مظهرا قال أبو عبيد
  وقال غيره أتانافلان مظهرا بالتخفيق قال وهو الوجه
  صل الين بر لعسيرة الاسم من الاعتيار والعبرة بالفتح تحلب الدمع تقول
  منه عبر الرجل بالمكسر يعبر عبرافهو عابر والمرأة عابرأيضا قال الحرث بن وعلة
  يقول لى النهدى هل أنت مرد فى • وكيف رداف الفترأمك عابر
  وكذلك عبرت عينه واستعبرت أى دمعت والعبران الباكى والعبر بالتحريك تحنة فى العين
  تبكيها والعبر بالضم مثله يقال لامه العسبر والعبرور أى فلان عبرعيثيه أى ما يسذن عينه.
  وعبر النهر وعبره شطه وجانيه قال الشاعر
  وما الفرات اذاجادت غوار به * ترمى أواذيه العبرين بالزبد
  وجمل عبر أسفاروجمال عبر أسفاروناقة عبر أسفاريستوى فيه الجمع والمؤنث مثل الفلك
  الذى لا يزال يسافر عليها وكذلك عبر أسفار بالكسر والعبر أيضا بالضم المكثير من كل شئ
  حكاه أبو عبيد عن الاصمعى" والعبرى"ماتبت من السدر على شعاوط الانهار وعظسم والعبرىّ
  بالسكسر العبرانى لغة البهود والشعرى العبوراحدى الشعريين وهي التى خلف الجوزا.
  عيت بذلك لانها عسبرت الجرة والمعبرما يعبر عليه من قشطرة أوسفينة وقال أبو عبيد المعسبر
  المركب الذى يعبر فيه ورجل عابر سبيل أى مار الطريق وعبر القوم أى ماتوا قال الشاعر
  فان تعبرفان لنالمات • وان تغير فنحن على نذور
  بقول ان متنافلنا أقران وان بقينافتحن تننظر مالابدمنه كأن لشافى اتيانه نذرا وعسيرت
  لنهر وغيره أعبره عبرا عن يمقوب وعبوراوعبرت الرؤيا أعبرها عبارة فسرتها قال اللّٰه تعالى
  ان كنتم للرؤيا تعبرون أوصل الفعل باللام كمايقال ان كنت للمال جامعا قال الاصحعى عبرت
  السكتاب أعبره عبرا اذا تدبرته فى نفساك ولم ترفع به صوتك وقولهم لغة عابرة أى جائرة قال
  الكسائى أعبرت الغنم اذائر كتهاعاما لا تجزهلوقداعبرت الشاة فهى معبرة وغلام معبر أيضا
  لم يختن قال بشر بن أبى خازم يصف كبشا
  جزيز القفاشبعان يربض حجرة * حديث الخصاء وارم العفل معبر
  أى غير مجز وزوجارية معبرة لم تحفض وسه-م معبرم وفر الريس وعبرت الرؤياتعبير افسرتها
