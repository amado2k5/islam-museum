text: "لولا أنا حرم لطيبنا"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كفن ابنه واقد بن عبد الله، ومات بالجحفة محرماً، فخمر رأسه ووجهه وقال: لولا أنا حرم لطيبنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1048) وسويد (495). {cite:muwatta-maruf-1997 p.440}"
