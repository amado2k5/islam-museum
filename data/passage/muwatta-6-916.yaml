label: { ar: "الموطأ 916 — ابن عمر كفن ابنه واقد بن عبد الله وقد مات بالجحفة محرماً، فخمر رأسه ووجهه وقال: لولا أنا حرم لطيبنا", en: "Muwatta 916", es: "Muwatta 916", fr: "Muwatta 916", ur: "موطا 916", tr: "El-Muvatta 916 — İbn Ömer, ihramlı haldeyken El-Cuhfa'da vefat eden oğlu Vakid ibn Abdullah'ı kefenledi. Başını ve yüzünü örttü ve şöyle dedi: \"Eğer ihramlı olmasaydık, ona güzel kokular sürerdik.\"", id: "Al-Muwatta 916 — Ibnu Umar mengkafani putranya, Waqid bin Abdullah, yang meninggal di Al-Juhfa dalam keadaan ihram. Ia menutupi kepala dan wajahnya dan berkata: “Seandainya kita tidak dalam keadaan ihram, kita pasti akan mewanginya.”" }
text: "لولا أنا حرم لطيبنا"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كفن ابنه واقد بن عبد الله، ومات بالجحفة محرماً، فخمر رأسه ووجهه وقال: لولا أنا حرم لطيبنا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1048) وسويد (495). {cite:muwatta-maruf-1997 p.440}"
  tr: "Malik, Nafi'den rivayetle, Abdullah ibn Umar'ın, ihramlı halde el-Cuhfa'da vefat eden oğlu Vakid ibn Abdullah'ı kefenlediğini, başını ve yüzünü örttüğünü ve \"İhramlı olmasaydık, onu güzel kokularla süslerdik\" dediğini aktarmıştır. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (1048) ve Suveyd (495) tarafından da nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.440}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar mengkafani putranya Waqid ibn Abdullah, yang meninggal di al-Juhfa dalam keadaan ihram. Ia menutupi kepala dan wajahnya dan berkata, “Seandainya kami tidak dalam keadaan ihram, kami pasti akan mewanginya.” Peneliti menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Mus’ab (1048) dan Suwaid (495). {cite:muwatta-maruf-1997 p.440}"
