text: "… وَجْهٍ عَنِ النَّبِيِّ أَنَّهُ قَالَ فِي الزِّنَا وَالسَّرِقَةِ \" مَنْ أَصَابَ مِنْ ذَلِكَ شَيْئًا فَأُقِيمَ عَلَيْهِ الْحَدُّ فَهُوَ كَفَّارَةُ ذَنْبِهِ وَمَنْ أَصَابَ مِنْ ذَلِكَ شَيْئًا فَسَتَرَ اللَّهُ عَلَيْهِ فَهُوَ إِلَى اللَّهِ إِنْ شَاءَ عَذَّبَهُ يَوْمَ الْقِيَامَةِ وَإِنْ شَاءَ غَفَرَ لَهُ \". رَوَى ذَلِكَ عَلِيُّ بْنُ أَبِي طَالِبٍ وَعُبَادَةُ بْنُ الصَّامِتِ وَخُزَيْمَةُ بْنُ ثَابِتٍ عَنِ النَّبِيِّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2625، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2625 (The Book on Faith), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2625، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
