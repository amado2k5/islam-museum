text: "… إِذَا غَسَّلَ مَيّتًا فَعَلَيْهِ الغُسْلُ. وقَالَ بَعْضُهُمْ عَلَيْهِ الوُضُوءُ. وقَالَ مَالِكُ بْنُ أَنَسٍ: أَسْتَحِبُّ الغُسْلَ مِنْ غُسْلِ المَيِّتِ ولَا أَرَى ذَلِكَ وَاجِبًا وهَكَذَا قَالَ الشَّافِعِيُّ. وقَالَ أَحْمَدُ: مَنْ غَسَّلَ مَيِّتَا أَرْجُو أَنْ لَا يَجِبَ عَلَيْهِ الغُسْلُ وأَمَّا الوُضُوءُ فَأَقَلُّ مَا …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 241، يرد فيه ذكر الواجب، وما يجب على المكلف، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
