text: "… عَوَانَةَ، عَنْ زِيَادِ بْنِ عِلاَقَةَ، عَنْ أُسَامَةَ بْنِ شَرِيكٍ، قَالَ قَالَتِ الأَعْرَابُ يَا رَسُولَ اللَّهِ أَلاَ نَتَدَاوَى قَالَ \" نَعَمْ يَا عِبَادَ اللَّهِ تَدَاوَوْا فَإِنَّ اللَّهَ لَمْ يَضَعْ دَاءً إِلاَّ وَضَعَ لَهُ شِفَاءً أَوْ قَالَ دَوَاءً إِلاَّ دَاءً وَاحِدًا \". قَالُوا يَا رَسُولَ اللَّهِ وَمَا هُوَ قَالَ \" الْهَرَمُ \". قَالَ أَبُو عِيسَى وَفِي الْبَابِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2038، يذكر الدواء، والداء، والتداوي، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2038 (Chapters on Medicine), that mentions the drug, the disease and its remedy, seeking treatment, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2038، جس میں دوا، بیماری، علاج کرانا، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
