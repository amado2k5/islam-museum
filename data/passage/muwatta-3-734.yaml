label: { ar: "الموطأ 734 — مالك: الحبوب التي تجب فيها الزكاة: الحنطة والشعير والسلت والذرة والدخن والأرز والعدس والجلبان واللوبيا والجلجلان وما أشبهها", en: "Muwatta 734" }
summary:
  ar: "قول لمالك: الحبوب التي تجب فيها الزكاة هي الحنطة والشعير والسلت والذرة والدخن والأرز والعدس والجلبان واللوبيا والجلجلان وما أشبه ذلك من الحبوب التي تصير طعاماً، فالزكاة تؤخذ منها كلها بعد أن تُحصد وتصير حباً، والناس مصدَّقون في ذلك ويُقبل منهم ما دفعوا. ويبين المحقق أن السلت حب من نوع الشعير لا قشر له، والجلجلان السمسم في قشره، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.367}"
