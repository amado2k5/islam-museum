label: { ar: "الموطأ 734 — مالك: الحبوب التي تجب فيها الزكاة: الحنطة والشعير والسلت والذرة والدخن والأرز والعدس والجلبان واللوبيا والجلجلان وما أشبهها", en: "Muwatta 734", es: "Muwatta 734", fr: "Muwatta 734", ur: "موطا 734", tr: "Al-Muwatta 734 — Malik: Zekatın farz olduğu tahıllar şunlardır: buğday, arpa, kılçıklı buğday, mısır, darı, pirinç, mercimek, nohut, bezelye, susam ve benzerleri.", id: "Al-Muwatta 734 — Malik: Biji-bijian yang wajib dizakati adalah: gandum, jelai, spelt, jagung, millet, beras, lentil, buncis, kacang panjang, biji wijen, dan sejenisnya." }
summary:
  ar: "قول لمالك: الحبوب التي تجب فيها الزكاة هي الحنطة والشعير والسلت والذرة والدخن والأرز والعدس والجلبان واللوبيا والجلجلان وما أشبه ذلك من الحبوب التي تصير طعاماً، فالزكاة تؤخذ منها كلها بعد أن تُحصد وتصير حباً، والناس مصدَّقون في ذلك ويُقبل منهم ما دفعوا. ويبين المحقق أن السلت حب من نوع الشعير لا قشر له، والجلجلان السمسم في قشره، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.367}"
  tr: "Malik şöyle demiştir: Zekatın farz olduğu tahıllar buğday, arpa, kılçıklı buğday, mısır, darı, pirinç, mercimek, nohut, bezelye, susam ve benzeri gıda haline gelen tahıllardır. Zekat, hasat edildikten ve tahıl haline geldikten sonra bunların hepsinden alınır. İnsanlar buna inanır ve verdikleri miktar kabul edilir. Araştırmacı, kılçıklı buğdayın kabuksuz bir arpa türü olduğunu ve susamın da kabuklu susam olduğunu açıklığa kavuşturmaktadır. Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.367}"
  id: "Malik berkata: Biji-bijian yang wajib dizakati adalah gandum, jelai, spelt, jagung, millet, beras, lentil, buncis, kacang panjang, biji wijen, dan biji-bijian serupa yang menjadi makanan. Zakat diambil dari semuanya setelah dipanen dan menjadi biji-bijian. Orang-orang mempercayai hal ini, dan apa yang mereka bayarkan diterima. Peneliti menjelaskan bahwa spelt adalah jenis biji jelai tanpa sekam, dan biji wijen adalah biji wijen dengan sekamnya. Ia menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.367}"
