text: |-
  قوله اباغ فى تسمة زيادة بالضم
  وفى القاموس عين اباغ كسيجاب
  ويقلث اه
  قوله شاب برز(غ الخ عبارة
  القاموس البرز غ كتنفذ نشاط
  الثباب والشاب الممتلى التام
  كالبرزوغ كمصفور
  وقرطاس اه
  * بسم اللّه الرحمن الرحيم)*
  صل الالف بغ ين اباغ موضع بين الكوفة والرقة قالت احرأة من
  بني شيبان
  بعين اباغ فأسمنا المنايا • فكان قسيمها خير القسيم
  ومنه يوم عين اباخ يوم من أيام العرب قتل فيه المنذرين ماه السماه
  صل الباء غ دغ بالعذرة يبدغ بدغا مشال تعب تعبا أى تلطخ بها وكذلك
  اذا تلطخ بالشرّ وزعم ابن الاعرابى أنّ بعض العرب غدرغدرة فسمى البدغ مثال
  التعب ( برزغ شاب برزغ بالضمّ وبرزوغ وبرزاغ أى ممتلئ تام" وأنشد أبو عبيدة لرجل
  من بى سعد جاهلى
  حسبك بعض القول لاتمتهى • غزك برزاغ الشباب المزدهى
  قوله لا تمدّهى يريد لاتد ى زغ زغت الشمس بزوعًا أى طلعت وبزغ ناب البعير طلع
  وانبزغ الربيع جاء أوله والمبزغ المشرط وبزغ الحاجم والبيطار أى شرط ومنه قول الاعشى
  • كبزغ البيطر الثقف رهس السكوادن*بطغ) بطغ بالشى تلطخ به لغة فى بدغ وبطغ
  بالارض أى تسمح بها وتزحف قال الراجز روبة
  والملغ يلكى بالكلام الاملغ • لولادبوقاء استه لم يبطغ
  ⁦(يغغ )⁩
