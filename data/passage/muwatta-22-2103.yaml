label: { ar: "الموطأ 2103 — يحيى عن مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة عن أم سلمة: قال رسول الله إنما أنا بشر، وإنكم تختصمون إلي، فمن قضيت له بشيء من حق أخيه فلا يأخذن منه شيئا", en: "Muwatta 2103", es: "Muwatta 2103", fr: "Muwatta 2103", ur: "موطا 2103", tr: "El-Muvatta 2103 — Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından, o da Zeynep bint Ebu Seleme'den, o da Ümmü Seleme'den rivayetle: Allah Resulü şöyle buyurdu: \"Ben de bir insanım ve siz ihtilaflarınızı bana getiriyorsunuz. Kimin kardeşine ait bir şey hakkında onun lehine hüküm verirsem, o ondan hiçbir şey almasın.\"", id: "Al-Muwatta 2103 — Yahya, dari Malik, dari Hisham ibn Urwah, dari ayahnya, dari Zaynab bint Abi Salamah, dari Umm Salamah: Rasulullah SAW bersabda, “Aku hanyalah manusia, dan kalian datang kepadaku untuk memperdebatkan sesuatu. Maka barang siapa yang aku putuskan untuk aku perbuat mengenai sesuatu yang menjadi milik saudaranya, maka janganlah ia mengambil sedikit pun darinya.”" }
text: "فَمن قَضيْتُ لَهُ بِشَيءٍ مِن حَقِّ أخيهِ، فَلَا يَأْخُذَنَّ مِنْهُ شَيْئًا"
summary:
  ar: "يروي يحيى عن مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة عن أم سلمة زوج النبي أن رسول الله قال: إنما أنا بشر، وإنكم تختصمون إلي، فلعل بعضكم أن يكون ألحن بحجته من بعض، فأقضي له على نحو ما أسمع منه، فمن قضيت له بشيء من حق أخيه فلا يأخذن منه شيئا، فإنما أقطع له قطعة من النار. ويذكر المحقق قول ابن عبد البر إن الحديث لم يختلف عن مالك في إسناده، وإن معمرا رواه عن الزهري عن عروة عن زينب عن أم سلمة مثله. {cite:muwatta-maruf-1997 p.259}"
  tr: "Yahya, Malik'ten, o da Hişam ibn Urve'den, o da babasından, o da Zeynep bint Ebu Seleme'den, o da Peygamberin eşi Ümmü Seleme'den rivayet ederek, Allah Resulü'nün şöyle buyurduğunu aktarır: “Ben de bir insanım ve siz ihtilaflarınızı bana getiriyorsunuz. Belki bazılarınızın argümanlarını sunmada diğerlerinden daha yeteneklisinizdir, bu yüzden işittiğim şeye göre hüküm veririm. Kardeşine ait bir şey konusunda kimin lehine hüküm verirsem, ondan hiçbir şey almasın; çünkü ben ona sadece cehennem ateşinden bir parça veriyorum.” Araştırmacı, İbn Abdül-Barr'ın hadisin rivayet zincirinde Malik'ten farklı olmadığını ve Ma'mar'ın da aynı şekilde el-Zuhri'den, o da Urve'den, o da Zeynep'ten, o da Ümmü Seleme'den rivayet ettiğini belirttiğini aktarır. {cite:muwatta-maruf-1997 s.259}"
  id: "Yahya meriwayatkan dari Malik, dari Hisham bin Urwah, dari ayahnya, dari Zaynab binti Abi Salamah, dari Umm Salamah, istri Nabi, bahwa Rasulullah SAW bersabda: “Aku hanyalah manusia, dan kalian datang kepadaku untuk memperdebatkan sesuatu. Mungkin sebagian dari kalian lebih fasih dalam menyampaikan argumen daripada yang lain, maka aku akan menghakimi sesuai dengan apa yang kudengar. Barangsiapa yang kuputuskan untuk berpihak mengenai sesuatu yang menjadi milik saudaranya, janganlah ia mengambil apa pun darinya, karena aku hanya akan memberinya sepotong api neraka.” Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits tersebut tidak berbeda dari Malik dalam sanadnya, dan bahwa Ma’mar meriwayatkannya dari al-Zuhri, dari Urwah, dari Zaynab, dari Umm Salamah, dengan cara yang sama. {cite:muwatta-maruf-1997 p.259}"
