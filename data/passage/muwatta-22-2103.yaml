label: { ar: "الموطأ 2103 — يحيى عن مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة عن أم سلمة: قال رسول الله إنما أنا بشر، وإنكم تختصمون إلي، فمن قضيت له بشيء من حق أخيه فلا يأخذن منه شيئا", en: "Muwatta 2103" }
text: "فَمن قَضيْتُ لَهُ بِشَيءٍ مِن حَقِّ أخيهِ، فَلَا يَأْخُذَنَّ مِنْهُ شَيْئًا"
summary:
  ar: "يروي يحيى عن مالك عن هشام بن عروة عن أبيه عن زينب بنت أبي سلمة عن أم سلمة زوج النبي أن رسول الله قال: إنما أنا بشر، وإنكم تختصمون إلي، فلعل بعضكم أن يكون ألحن بحجته من بعض، فأقضي له على نحو ما أسمع منه، فمن قضيت له بشيء من حق أخيه فلا يأخذن منه شيئا، فإنما أقطع له قطعة من النار. ويذكر المحقق قول ابن عبد البر إن الحديث لم يختلف عن مالك في إسناده، وإن معمرا رواه عن الزهري عن عروة عن زينب عن أم سلمة مثله. {cite:muwatta-maruf-1997 p.259}"
