label: { ar: "الموطأ 2416 — ابن شهاب عن صفوان بن عبد الله: صفوان بن أمية وسارق رداءه", en: "Muwatta 2416" }
summary:
  ar: "يروي مالك عن ابن شهاب عن صفوان بن عبد الله بن صفوان أن صفوان بن أمية قيل له: إن من لم يهاجر هلك، فقدم المدينة فنام في المسجد وتوسد رداءه، فجاء سارق فأخذ رداءه، فأخذ صفوان السارق وجاء به إلى النبي، فأمر به أن تُقطع يده. فقال صفوان: إني لم أرد هذا يا رسول الله، هو عليه صدقة. فقال النبي: فهلا قبل أن تأتيني به. ويذكر المحقق أن شبابة بن سوار وصله بذكر عبد الله بن صفوان، وأن أصحاب مالك رووه عنه مرسلا، فلعل شبابة توهم فيه. {cite:muwatta-maruf-1997 p.397} {cite:muwatta-maruf-1997 p.398}"
