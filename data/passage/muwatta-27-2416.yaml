label: { ar: "الموطأ 2416 — ابن شهاب عن صفوان بن عبد الله: صفوان بن أمية وسارق رداءه", en: "Muwatta 2416", es: "Muwatta 2416", fr: "Muwatta 2416", ur: "موطا 2416", tr: "El-Muvatta 2416 — İbn Şihab, Safvan ibn Abdullah'tan rivayetle: Safvan ibn Umayya ve cübbesinin hırsızı", id: "Al-Muwatta 2416 — Ibn Shihab berdasarkan riwayat Safwan ibn Abdullah: Safwan ibn Umayya dan pencuri jubahnya" }
summary:
  ar: "يروي مالك عن ابن شهاب عن صفوان بن عبد الله بن صفوان أن صفوان بن أمية قيل له: إن من لم يهاجر هلك، فقدم المدينة فنام في المسجد وتوسد رداءه، فجاء سارق فأخذ رداءه، فأخذ صفوان السارق وجاء به إلى النبي، فأمر به أن تُقطع يده. فقال صفوان: إني لم أرد هذا يا رسول الله، هو عليه صدقة. فقال النبي: فهلا قبل أن تأتيني به. ويذكر المحقق أن شبابة بن سوار وصله بذكر عبد الله بن صفوان، وأن أصحاب مالك رووه عنه مرسلا، فلعل شبابة توهم فيه. {cite:muwatta-maruf-1997 p.397} {cite:muwatta-maruf-1997 p.398}"
  tr: "Malik, İbn Şihab'dan, o da Safvan ibn Abdullah ibn Safvan'dan rivayet ettiğine göre, Safvan ibn Umeyye'ye şöyle denmiştir: \"Hicret etmeyen helak olur.\" Bunun üzerine Medine'ye gitti ve mescitte, cübbesini yastık olarak kullanarak uyudu. Bir hırsız geldi ve cübbesini çaldı. Safvan hırsızı yakaladı ve Peygamber'in huzuruna getirdi. Peygamber, hırsızın elinin kesilmesini emretti. Safvan, \"Bunu kastetmedim, ey Allah'ın Resulü; bu onun için bir sadakadır\" dedi. Peygamber, \"Onu bana getirmeden önce neden yapmadın?\" diye sordu. Araştırmacı, Şababa ibn Suwar'ın bu rivayeti Abdullah ibn Safvan'dan bahsederek bağladığını ve Malik'in arkadaşlarının bunu ondan mursal hadis olarak rivayet ettiğini, dolayısıyla Şababa'nın bu rivayette bir hata yapmış olabileceğini belirtiyor. {cite:muwatta-maruf-1997 s.397} {cite:muwatta-maruf-1997 s.398}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Safwan bin Abdullah bin Safwan, bahwa Safwan bin Umayyah diberitahu: “Siapa pun yang tidak berhijrah akan binasa.” Maka ia pergi ke Madinah dan tidur di masjid, menggunakan jubahnya sebagai bantal. Seorang pencuri datang dan mengambil jubahnya. Safwan menangkap pencuri itu dan membawanya kepada Nabi, yang memerintahkan agar tangannya dipotong. Safwan berkata: “Aku tidak bermaksud demikian, wahai Rasulullah; ini adalah sedekah untuknya.” Nabi bersabda: “Mengapa kamu tidak melakukan ini sebelum kamu membawanya kepadaku?” Peneliti menyebutkan bahwa Syabab bin Suwar menghubungkan riwayat ini dengan menyebutkan Abdullah bin Safwan, dan bahwa para sahabat Malik meriwayatkannya darinya sebagai hadits mursal, jadi mungkin Syabab telah melakukan kesalahan di dalamnya. {kutip:muwatta-maruf-1997 hal.397} {kutip:muwatta-maruf-1997 hal.398}"
