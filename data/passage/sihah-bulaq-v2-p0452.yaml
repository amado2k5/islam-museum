text: |-
  *ذكك) .
  ١٣٥
  الرحل فى الامر أى نشب فيه ولم يكد يتخلص منه والربك اصلاح التريد والريكة
  تمر يعجن بسمن واقط فيؤ كل قال ابن السكيت وربماصب عليه ماء فشرب شربا قال وقالت
  غنيسة الكلابية أتمّ المارس الربيكة الاقط والتمر والسمن يعمل رخوا ليس كالحيس وقالت
  الدبيرية هو الدقيق والاقط المطحون ثم يلبك بالسمن المختلط بالرب وفى المثل غرثان فاربكواله
  وأصله أنّ أعرابيا أنى أهلد فبشر بغ-لام ولدله فقال ما أصنع بهأ آكله أم أشر به فقالت
  امر انه غرثان فاربكو الدفلمنا شبع قال كيف الطلاوأقه ⁦( تك)⁩ رتكان البعير مقاربة
  خطوه فى رحلانه لا يقال الاللبعير وقدرتك يرتك رتكاور تكانا وأرتكه صاحبه ⁦(ركات )⁩
  رككت الغلّ فى عنقه أركه ركااذا غلات بده الى عنفه ورككت الذئب فى عنة_ه اذا ألزمة-
  اياه ورككت المشئ بعضه على بعض اذا طر حته ومنه قول الراجز
  فنجنا من حدس حاجات ورك• والرك بالكسر المطر الضعيف وابمع ركال وأركت السماء أى
  جاءت بالرك وأركت الارض على مالم يسمتفاعله ورك الشىّ أى رق وضعف ومنه قواهم
  اقطعه من حيث رك والعامة تقول من حيت رق والركيك الضعيف وثوب ركيسك النسيج
  واستركه أى استضعفه وفى الحديث أنه لمن الركاكة رهو الذى لا يفارء لى أهله وركن
  اسم ماه قال زهير
  ثم استمروا وقالوا ان موعدكم • ماء بشرقى سلى فيد أوركك
  قال الاصمعى أصله رل: فأظهر التضعيف ضرورة وقد سألت أعرابيا وتحن بالموضع الذى
  ذكره زهير فقلت هل تعرف رصككافقال كان ههناماء يسمى ركا وقول الراجز
  مشيته فى الدارهاك ركا * اغماه وحكاية تيختره وسكران مرتك اذالم يبيين كلام-ه
  والركراكة المرأة العظيمة العجز والفذذين وقولهم فى المثل شحمه الركى على فعلى وهوالذى
  يذوب سر يعا يضرب لمن لا يعنيك فى الحاجات وسقاءمى كولٰ قدء ولج وأصلح ⁦(رمك)⁩
  رمك بالمكان يرمك ر.وكاأقام به وأرمكته أنا والرمكة الانثى من البراذين والجع رماك
  ورمكات وأرماك أيضاعن الفراء مثل غاروأغار والرامك والرامك شي أسود يخلط بالمسك
  وقال ⁦(٣)⁩ « والمسك قد يستصحب الرامكا* والرمكة من ألوان الابل يقال جل أرمك وناقة
  رمكاء قال أبوعبيدهو الذى اشتدت كتته حتى يدخلهاسوادوة دارمل البعبرار.كاكا
  ويرموك موضع بشاحية الشأم ومنه يوم البرموك هك يقال مر الرج-ل يترهوك
  كانه يوج فى مشيته
  صل الزاى حك زحك بعيره أى أعيا ومنه قول كثير
  وقد أين أنضاء وهن زواحك • وأزحك الرجل اذا أعيت دابته مثل أزحف عك )
  الازعكوالقصير اللئيم قال ذو الرقة
  على كل كهل أزعكى ويافع * من المؤم سربال جديد البناق
  وكذلك الزعكوك والزعكوك من الابل السمين والهع زعاكيسك وزبماكك أيضا وأنشد
  القذانى •تستن أولاداهاذعاكاث* كث المشى الزكيك المقرمط قال الراجز ٤
  ش-ل زكيك الناهض المحمم • ويقال زكت الدرّاجة كايقال زافت الحمامة والرك
  قول لمن لا يعنيك أى يخبك
  قال المؤلف عناه غسيره تعنية.
  قوله والرامك والامك يعنى بقح
  الميم وكسرها كمافى القساموساء
  ٣ ف بعض الفسخ أقل البيتغ
  انَّ لك الفضل على مصبى
