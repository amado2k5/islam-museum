text: "وَٱللَّهُ فَضَّلَ بَعْضَكُمْ عَلَىٰ بَعْضٍ فِى ٱلرِّزْقِ ۚ فَمَا ٱلَّذِينَ فُضِّلُوا۟ بِرَآدِّى رِزْقِهِمْ عَلَىٰ مَا مَلَكَتْ أَيْمَـٰنُهُمْ فَهُمْ فِيهِ سَوَآءٌ ۚ أَفَبِنِعْمَةِ ٱللَّهِ يَجْحَدُونَ"
text_search: "والله فضل بعضكم على بعض في الرزق ۚ فما الذين فضلوا برادي رزقهم على ما ملكت أيمانهم فهم فيه سواء ۚ أفبنعمة الله يجحدون"
translations:
  en: { text: "And Allah hath favoured some of you above others in provision. Now those who are more favoured will by no means hand over their provision to those (slaves) whom their right hands possess, so that they may be equal with them in respect thereof. Is it then the grace of Allah that they deny?", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور خدا نے رزق (ودولت) میں بعض کو بعض پر فضیلت دی ہے تو جن لوگوں کو فضیلت دی ہے وہ اپنا رزق اپنے مملوکوں کو تو دے ڈالنے والے ہیں نہیں کہ سب اس میں برابر ہوجائیں۔ تو کیا یہ لوگ نعمت الہیٰ کے منکر ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
