label: { ar: "الموطأ 1525 — مالك: إذا تزوج الرجل المرأة ثم نكح أمها فأصابها، فالأم لا تحل له أبدا، ولا لأبيه ولا لابنه، وتحرم عليه امرأته", en: "Muwatta 1525", es: "Muwatta 1525", fr: "Muwatta 1525", ur: "موطا 1525", tr: "El-Muvatta 1525 — Malik: Bir erkek bir kadınla evlenir ve sonra onun annesiyle evlenip onunla cinsel ilişkiye girerse, anne ona, babasına ve oğluna helal olmaz; karısı ise ona haramdır.", id: "Al-Muwatta 1525 — Malik: Jika seorang laki-laki menikahi seorang perempuan, kemudian menikahi ibunya dan bersetubuh dengannya, maka ibu tersebut tidak halal baginya, demikian pula bagi ayahnya, dan bagi anaknya, sedangkan istrinya haram baginya." }
summary:
  ar: "يقول مالك في الرجل يتزوج المرأة، ثم ينكح أمها فيصيبها، إنه لا تحل له أمها أبدا، ولا تحل لأبيه ولا لابنه، ولا تحل له ابنتها، وتحرم عليه امرأته. {cite:muwatta-maruf-1997 p.40}"
  tr: "Malik, bir erkek bir kadınla evlenip sonra onun annesiyle evlenir ve onunla cinsel ilişkiye girerse, onun için annesinin asla helal olmadığını, babasının veya oğlunun da helal olmadığını, kızının da ona helal olmadığını ve karısının da ona haram olduğunu söyler. {cite:muwatta-maruf-1997 s.40}"
  id: "Malik mengatakan tentang seorang pria yang menikahi seorang wanita, kemudian menikahi ibunya dan bersetubuh dengannya, maka ibunya tidak halal baginya, demikian pula tidak halal bagi ayahnya atau anaknya, demikian pula anak perempuannya tidak halal baginya, dan istrinya haram baginya. {cite:muwatta-maruf-1997 p.40}"
