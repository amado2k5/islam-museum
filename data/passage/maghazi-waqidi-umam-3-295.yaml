text: "… لأَبى وأَنا غلام. حدّثنا عبد الرحمن بن عبد العزيز، عن عبد اللّٰه بن أَبي بكر بر حزم، أَنه سُئل عن الرِّهان التى كانت بين قُريش حين سار رسول اللّٰه إِلى خَيْبَر فقال : كان حُويطب بن عبد العُزَّى يقول : …"
