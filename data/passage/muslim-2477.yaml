text: "أتى النبي الخلاء فوضعت له وضوءاً، فلما خرج قال: من وضع هذا؟ فقيل له: ابن عباس؛ فقال: «اللهم فقهه»"
summary:
  ar: "رواية ابن عباس عن نفسه في باب فضائله من صحيح مسلم؛ دعاء النبي له بالفقه في الدين حين كان غلاماً — النص المؤسس لمركزية ابن عباس في التفسير والفقه عند أهل السنة."
