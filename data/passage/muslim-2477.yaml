label: { ar: "مسلم 2477 — اللهم فقهه في الدين", en: "Muslim 2477 — O God, give him understanding of the religion", es: "Musulmán 2477 — Oh Dios, dale entendimiento de la religión", fr: "Muslim 2477 — Ô Dieu, accorde-lui la compréhension de la religion", ur: "مسلم 2477 — اے اللہ اسے دین کی سمجھ عطا فرما", tr: "Müslim 2477 — Ey Allah'ım, ona din konusunda anlayış ver.", id: "Muslim 2477 — Ya Allah, berilah dia pemahaman tentang agama" }
text: "أتى النبي الخلاء فوضعت له وضوءاً، فلما خرج قال: من وضع هذا؟ فقيل له: ابن عباس؛ فقال: «اللهم فقهه»"
summary:
  ar: "رواية ابن عباس عن نفسه في باب فضائله من صحيح مسلم؛ دعاء النبي له بالفقه في الدين حين كان غلاماً — النص المؤسس لمركزية ابن عباس في التفسير والفقه عند أهل السنة."
  tr: "İbn Abbas'ın Sahih Müslim'deki faziletleri bölümünde kendisi hakkında anlattığı; Peygamber'in çocukken ona din konusunda anlayış vermesi için yaptığı dua, İbn Abbas'ın Sünniler arasında tefsir ve fıkıh alanındaki merkezi konumunun temel metnidir."
  id: "Riwayat Ibnu Abbas tentang dirinya sendiri dalam bab tentang keutamaannya di Sahih Muslim; doa Nabi agar ia memahami agama ketika masih kecil — teks dasar yang menjadikan Ibnu Abbas sebagai tokoh sentral dalam penafsiran dan yurisprudensi di kalangan Sunni."
