text: |-
  ⁦(ف صل الصاد)⁩
  ١٨٣
  والغراب صدحا أى صاح قال لبيد وقينة ومن هر صداح والصيدح الفوس الشديد
  الصوت وصيدح اسم ناقة ذى الرمة وقال
  وأيت النساس يتجعون غبنا • فقلت لصيدح انتجعى بلالا
  والصدحة خرزة يؤْخذبها الرجال رح لصرح القصروكل بناء عال وابمع الصروح
  والصرحة المتزمن الارض قال أبو عبيد قيخاءلاح لD*ه* بالصرحة الذيب
  وصرحسة الدارعر صتها والصرواح حصن باليمن والصرح بالتحريك الجالص من كل شئ
  قال الشاعر تعلو السيوف بأيديهم جاجحهم • كما يفلق مر والامعز الصرح
  والصريح اللبن اذا ذهبت رغوته وتقول جاء بنوعيم صريحة اذ الم يخالهسم غيرهم والصريح
  الرجل الخالس النسب والجمع الصرحاء وكل خالص صرخ وقدصرح بالضيم صراحة
  وصروحة وصريح اسم فخل منجب وقال
  ومر كضة صريحىّ أبوها * يهان اها الغلامة والفلام
  وانصرح الحق أى بان وشتت فلا نا مصارحة وصراحا أى كفاحا ومواجهة والاسم الصراح
  بالضم وكاس سراح أيضا اذا لم تشب بمزاج والتصريح خلاف التعريض ويوم مصرّح أى
  ليس فيه - يحاب وهو فى شعر الطرماح وتصريح اارأن يذهب عنها الزبدتقول قدصر تحت
  من بعدتم داروإزباد وصرّح فلان بما فى نفسه أى أظهره وفى المثل صرّح الحق عن محضه
  أى انكشف وتقول أيضاصرّ حت كل أى أجدبت وصارت صريحة أى خالصة فى الشدة
  والصمارح بالضم اللخالص من كل شى والميم زائدة ويروى عن أبى عمرو الصمادح بالدال
  ولا أظنه محفوظا سردح الصردح المكان المستوى والصرداح مثله فح ، صفح
  الشيء ناجيته وصفح الانسان جنبه وصفح الجبل مضطبعه وابهع صفاح وأماقول بشر
  رضعة صفح بالباملة • لها بلق فوق الرؤس مشهر
  فهو اسم رحل من كاب جاور قوما من بنى عامر فقتلوه غدرا يقول غدرتكم بز يدين ضباء
  الاسدى أخت غدرتكم بصفح الكلبى وصفحة كل شئ جانبه ونظر الى بصفح وجهه وبصفح
  وجهه أى بعرضه قال أبو عبيدة يقال ضربه بصفح السيف والعامة تقول بصفح السيف
  مفتوحة أى بعرضه وصفيحة الوجه بشرة جلده وصفائح الباب ألواحه والصفيصة السيف
  العريض وكذلك الجر العريض ووجه كل شى عسر يض صفيحة وصفحت عن فلأن اذا
  أعرضت عن ذتبه وقد ضر بت عنه صفما اذا أعرضت عنه وتر كنه وصفحت الابل على
  الموض اذا أمررتها عليه وصفححت فلانا وأصفحته اذاسأللك فرددته وصفحته وأصفعته
  جيعا اذاضربته بالسيف مصفحا أى بعرضه وتصفحت الشئ اذا تظرت فى صفحاته
  والمصافحة الاخذباليد والتصافح مثله وتقول وجه هذا السيف مصفح أعريض من
  صفحته والمصفح أيضا الممال وفى الحديث قاب المؤمن مصفح على الحق والمصفح أيضا
  السادس من سهام المسر ويقال له المبل أيضا والتصفيح مثل التصفيق وفى الحديث التسبيح
  للرجال والتصفيم للنساء ويروى أيضا بالقاف وتصفيح الشى جعله عريضا ومنه قولهم رجل
  صفح الرأس اذا كان عريض الرأس وقول البيديصف سحابا
  قود بأيديهم فى نسخة بأيدينا
  /ه
