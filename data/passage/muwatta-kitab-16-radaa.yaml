summary:
  ar: "كتاب الرضاع، الكتاب السادس عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 19 نصاً (1762–1780) في ثلاثة أبواب، من الصفحة 119 إلى الصفحة 128 من ملف PDF المجلد الثاني. يبدأ برضاعة الصغير وحكم الحولين، ثم رضاعة الكبير وقصة سالم مولى أبي حذيفة وسهلة بنت سهيل، ويختم بجامع أحكام الرضاع وحديث الغيلة. {cite:muwatta-maruf-1997 p.119} {cite:muwatta-maruf-1997 p.128}"
  en: "The Book of Breastfeeding, sixteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 19 reports (1762–1780) in three babs, PDF pp. 119–128 of volume 2. It opens with fosterage of infants and the two-year limit, turns to fosterage of adults and the case of Salim, mawla of Abu Hudhayfa, and closes with general rules and the ruling on intercourse with a nursing wife."
