summary:
  ar: "كتاب الرضاع، الكتاب السادس عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 19 نصاً (1762–1780) في ثلاثة أبواب، من الصفحة 119 إلى الصفحة 128 من ملف PDF المجلد الثاني. يبدأ برضاعة الصغير وحكم الحولين، ثم رضاعة الكبير وقصة سالم مولى أبي حذيفة وسهلة بنت سهيل، ويختم بجامع أحكام الرضاع وحديث الغيلة. {cite:muwatta-maruf-1997 p.119} {cite:muwatta-maruf-1997 p.128}"
  en: "The Book of Breastfeeding, sixteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 19 reports (1762–1780) in three babs, PDF pp. 119–128 of volume 2. It opens with fosterage of infants and the two-year limit, turns to fosterage of adults and the case of Salim, mawla of Abu Hudhayfa, and closes with general rules and the ruling on intercourse with a nursing wife."
  es: "El Libro de la Lactancia Materna, decimosexto libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 19 informes (1762–1780) en tres babs, PDF pp. 119–128 del volumen 2. Comienza con la crianza de bebés y el límite de dos años, pasa a la crianza de adultos y el caso de Salim, mawla de Abu Hudhayfa, y termina con reglas generales y la norma sobre las relaciones sexuales con una esposa lactante."
  fr: "Le Livre de l'allaitement maternel, seizième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 19 rapports (1762–1780) en trois babs, PDF pp. 119–128 du volume 2. Il s'ouvre sur l'adoption des nourrissons et la limite de deux ans, aborde l'adoption des adultes et le cas de Salim, mawla d'Abu Hudhayfa, et se termine par les règles générales et la règle sur les rapports sexuels avec une épouse allaitante."
