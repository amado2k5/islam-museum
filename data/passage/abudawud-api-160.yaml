label: { ar: "سنن أبي داود 160 — الأب والأبوة", en: "Sunan Abi Dawud 160 — the father and fatherhood", ur: "سنن ابی داؤد 160 — باپ اور والدیت", es: "Sunan Abi Dawud 160 — El padre y la paternidad", fr: "Sunan Abi Dawud 160 — le père et la paternité" }
text: "حَدَّثَنَا مُسَدَّدٌ، وَعَبَّادُ بْنُ مُوسَى، قَالاَ حَدَّثَنَا هُشَيْمٌ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ أَبِيهِ، - قَالَ عَبَّادٌ - قَالَ أَخْبَرَنِي أَوْسُ بْنُ أَبِي أَوْسٍ الثَّقَفِيُّ، أَنَّ رَسُولَ اللَّهِ تَوَضَّأَ وَمَسَحَ عَلَى نَعْلَيْهِ وَقَدَمَيْهِ. وَقَالَ عَبَّادٌ رَأَيْتُ رَسُولَ اللَّهِ أَتَى كِظَامَةَ قَوْمٍ - يَعْنِي الْمِيضَأَةَ وَلَمْ يَذْكُرْ مُسَدَّدٌ الْمِيضَأَةَ وَالْكِظَامَةَ ثُمَّ اتَّفَقَا - فَتَوَضَّأَ وَمَسَحَ عَلَى …"
summary:
  ar: "حديث في سنن أبي داود، رقم 160، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 160 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 160، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 160 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 160 (Purification (Kitab Al-Taharah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
