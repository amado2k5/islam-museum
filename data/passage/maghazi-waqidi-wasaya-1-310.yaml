text: "… عن النبيّ مثله. وقال رسول اللّٰه يومئذٍ للمسلمين : احفِروا، وأَوسِعوا، وأَحسِنوا، وادفنوا الاثنين والثلاثة فى القبر، وقدِّموا أكثرهم قرآناً. فكان المسلمون يُقدّمون أكثرهم قرآناً فى القبر. وكان ممّن يُعرّف أَنه دُفن فى قبر واحد : عبد اللّٰه بن عمرو …"
