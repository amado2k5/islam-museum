text: "… أبى امامة إن سهل بن حنيف عن أبيه قال : كان النى يود فقراء أهل المذينة ويشهد جنائزهم، فأوذن بامرأة من أهمل الموالى فقال : اذا احتضرت فاذنونى بها فدفنت ليلا فقالوا : يارسول اللّٰه إنا خفنا عليك ظلمة الليسل، …"
