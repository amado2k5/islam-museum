text: "قد الرجل ترثني وأرثك، فنزلت (وأولوا الأرحام بعضهم أولى ببعض في كتاب الله) الآية، وأخرج ابن سعد من طريق هشام بن عروة عن أبيه = ببدر وأحد وحنين والأحزاب والخندق ونصر ٤٣٢ عليهم (وربنا الرحمن المستعان على ما تصفون) من"
