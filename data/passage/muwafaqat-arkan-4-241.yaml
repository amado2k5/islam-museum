text: "… ذلك فى الطريق. وكذلك الجهاد موضوع لإعلاء كلة اللّه، وإن أدى إلى مفسدة فى المال أو النفس. ودفع المحارب مشروع لرفع القتل والقتال، وإن أدّى الى القتل والقتال • والطلب بالزكاة مشروع لا قامة ذلك الركن من أركان الاسلام، وإن …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 4، ص 241، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 4, p. 241, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الموافقات، شاطبی، اسکین جلد 4، ص 241 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Muwafaqat de al-Shatibi, volumen 4, pág. 241, que menciona los pilares del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait des Muwafaqat d'al-Shatibi (tome 4, p. 241) mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Şatibi'nin El-Muvefakat adlı eserinin 4. cildinin 241. sayfasından, İslam'ın temellerini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 4, halaman 241, yang menyebutkan rukun Islam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
