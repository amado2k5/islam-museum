summary:
  ar: "أول حديث في باب العمل في الدعاء. يرويه مالك عن عبد الله بن دينار، قال: رآني عبد الله بن عمر وأنا أدعو وأشير بأصبعين، أصبع من كل يد، فنهاني. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.298}"
