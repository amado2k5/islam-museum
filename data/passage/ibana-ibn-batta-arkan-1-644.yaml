text: "… فعلت ذلك فأنا مسلم، قال: نعم، قال: صدقت، قال: فما الإحسان؟ قال: أن تخشى اللّه كأنك تراه فإن لا تراه فإنه يراك، قال: فإذا فعلت ذلك فأنا محسن، قال: نعم، قال: صدقت. قال: فما الإيمان؟ قال: تؤمن بالله وملائكته وكتبه …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 644، يذكر الإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 644, that mentions belief in God, His angels, His books and His messengers, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الابانۃ الکبریٰ، ابن بطہ، کتاب الایمان، اسکین جلد 1، ص 644 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Ibana al-Kubra, el Libro de la Fe, de Ibn Batta, volumen 1, pág. 644, que menciona la creencia en Dios, sus ángeles, sus libros y sus mensajeros, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du livre d'Ibn Batta, al-Ibana al-Kubra (Le Livre de la Foi), volume 1, page 644, abordant la croyance en Dieu, Ses anges, Ses livres et Ses messagers, ainsi que la question de la foi et sa réponse. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1, s. 644) adlı eserinden, Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inancı ele alan ve imanla ilgili soruları ve cevaplarını tartışan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Iman, Jilid 1 Bergambar, hlm. 644, yang membahas tentang kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya, serta menjawab pertanyaan-pertanyaan tentang iman dan jawabannya; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
