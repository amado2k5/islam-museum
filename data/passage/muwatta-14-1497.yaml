label: { ar: "الموطأ 1497 — مالك: بلغه أن القاسم وسالم وسليمان بن يسار كانوا يقولون في البكر يزوجها أبوها بغير إذنها إن ذلك لازم لها", en: "Muwatta 1497", es: "Muwatta 1497", fr: "Muwatta 1497", ur: "موطا 1497", tr: "El-Muvatta 1497 — Malik: Ona, El-Kâsım, Salim ve Süleyman ibn Yasar'ın, babasının izni olmadan evlendirdiği bakire kız için bunun bağlayıcı olduğunu söyledikleri rivayet edilmiştir.", id: "Al-Muwatta 1497 — Malik: Diriwayatkan kepadanya bahwa Al-Qasim, Salim, dan Sulayman ibn Yasar biasa mengatakan tentang seorang gadis perawan yang dinikahkan oleh ayahnya tanpa izinnya, bahwa hal itu mengikat baginya." }
summary:
  ar: "يروي مالك أنه بلغه أن القاسم بن محمد وسالم بن عبد الله وسليمان بن يسار كانوا يقولون في البكر يزوجها أبوها بغير إذنها، إن ذلك لازم لها. {cite:muwatta-maruf-1997 p.30}"
  tr: "Malik, el-Kâsım ibn Muhammed, Salim ibn Abdullah ve Süleyman ibn Yasar'ın, bir bakirenin babası tarafından izni olmadan evlendirilmesi durumunda bu evliliğin onun için bağlayıcı olduğunu söylediklerini duyduğunu bildirir. {cite:muwatta-maruf-1997 s.30}"
  id: "Malik meriwayatkan bahwa ia mendengar bahwa al-Qasim ibn Muhammad, Salim ibn Abdullah, dan Sulayman ibn Yasar biasa mengatakan bahwa jika seorang perawan dinikahkan oleh ayahnya tanpa izinnya, maka pernikahan itu mengikat baginya. {cite:muwatta-maruf-1997 p.30}"
