label: { ar: "سنن ابن ماجه 1430 — جمع القرآن والمصاحف", en: "Sunan Ibn Majah 1430 — the collection of the Qur'an and the codices", ur: "سنن ابن ماجہ 1430 — جمعِ قرآن اور مصاحف", es: "Sunan Ibn Majah 1430 — la colección del Corán y los códices", fr: "Sunan Ibn Majah 1430 — le recueil du Coran et des codex", tr: "Sunan İbn Majah 1430 — Kur'an ve Kur'an Reçetelerinin Derlenmesi", id: "Sunan Ibn Majah 1430 — Kumpulan Al-Qur'an dan Salinan Al-Qur'an" }
text: "حَدَّثَنَا يَعْقُوبُ بْنُ حُمَيْدِ بْنِ كَاسِبٍ، حَدَّثَنَا الْمُغِيرَةُ بْنُ عَبْدِ الرَّحْمَنِ الْمَخْزُومِيُّ، عَنْ يَزِيدَ بْنِ أَبِي عُبَيْدٍ، عَنْ سَلَمَةَ بْنِ الأَكْوَعِ، أَنَّهُ كَانَ يَأْتِي إِلَى سُبْحَةِ الضُّحَى فَيَعْمِدُ إِلَى الأُسْطُوَانَةِ دُونَ الْمُصْحَفِ فَيُصَلِّي قَرِيبًا مِنْهَا فَأَقُولُ لَهُ أَلاَ تُصَلِّي هَا هُنَا وَأُشِيرُ إِلَى بَعْضِ نَوَاحِي الْمَسْجِدِ فَيَقُولُ إِنِّي رَأَيْتُ رَسُولَ اللَّهِ ـ يَتَحَرَّى هَذَا الْمُقَامَ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1430، يذكر جمع القرآن والمصاحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Ibn Majah, no. 1430 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the collection of the Qur'an and the codices. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1430، جس میں جمعِ قرآن اور مصاحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Ibn Majah, n.° 1430 (Establecimiento de la oración y la Sunnah al respecto), menciona la colección del Corán y los códices. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sunan Ibn Majah, n° 1430 (Établissement de la prière et de la Sunna à ce sujet), mentionne la collecte du Coran et des codex. Le catalogue du musée consacré à la lecture et à l'écriture du Coran répertorie ces documents avec les textes coraniques, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "İbn Majah'ın Sünen'inde yer alan 1430 numaralı hadiste, Kur'an'ın ve el yazmalarının derlenmesinden bahsedilir. Bu hadis, Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1430, menyebutkan penyusunan Al-Quran dan manuskripnya. Hadits ini disusun oleh seorang peneliti yang ahli dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
