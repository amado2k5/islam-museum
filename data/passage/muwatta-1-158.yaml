label: { ar: "الموطأ 158 — أم سلمة تستفتي للمستحاضة: تعدّ أيام حيضها المعتادة", en: "Muwatta 158", es: "Muwatta 158", fr: "Muwatta 158", ur: "موطا 158", tr: "Al-Muwatta 158 — Umm Salamah, düzensiz adet kanaması yaşayan bir kadına soruyor: Adet günlerini saymalı mı?", id: "Al-Muwatta 158 — Umm Salamah bertanya kepada seorang wanita yang mengalami pendarahan tidak teratur: Haruskah dia menghitung hari-hari menstruasinya yang biasa?" }
text: "لتنظر إلى عدد الليالي والأيام التي كانت تحيضهن من الشهر قبل أن يصيبها الذي أصابها، فلتترك الصلاة قدر ذلك من الشهر"
summary:
  ar: "يرويه مالك عن نافع عن سليمان بن يسار عن أم سلمة زوج النبي، في باب المستحاضة: كانت امرأة تُهراق الدماء في عهد النبي فاستفتت لها أم سلمة، فأمرها أن تعدّ الليالي والأيام التي كانت تحيضها من الشهر قبل أن يصيبها ما أصابها، فتترك الصلاة بقدرها، فإذا جاوزتها اغتسلت واستثفرت بثوب ثم صلت. ويخرّجه المحقق عند أبي داود (274) والنسائي (1/119) وأحمد (6/320) والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن أيوب رواه عن سليمان كما رواه مالك عن نافع، وأن الليث وصخر بن جويرية وعبيد الله بن عمر أدخلوا بين سليمان وأم سلمة رجلاً؛ ويرى المحقق أن سليمان لم يسمع من أم سلمة فرواية الموطأ منقطعة، والرواية المتصلة بالرجل المبهم عند الدارمي وأبي داود (275–277). {cite:muwatta-maruf-1997 p.107}"
  tr: "Malik, uzun süreli kanaması olan kadın bölümünde, Nafi'den, Süleyman ibn Yasar'dan, Peygamberimizin eşi Ümmü Seleme'den rivayetle şöyle nakletmiştir: Peygamberimiz zamanında uzun süreli kanaması olan bir kadın vardı ve Ümmü Seleme'den bir hüküm istedi. Ümmü Seleme ona, bu durum başlamadan önce adet gördüğü ayın gecelerini ve günlerini saymasını ve o süre boyunca namazdan uzak durmasını tavsiye etti. Kanama durduktan sonra gusül abdesti almalı, kanı bir bezle emmeli ve sonra namaz kılmalıydı. Araştırmacı, bunu Malik'in sahabelerinin rivayet zincirleri aracılığıyla Ebu Davud (274), Nesai (1/119), Ahmed (6/320), Şafiî ve Beyhaki'nin derlemelerine dahil etmiştir. İbn Abdülberr'in, Eyyub'un bunu Süleyman'dan, Malik'in de Nafi'den rivayet ettiğini söylediğini ve el-Leys, Sakhr ibn Cüveyriye ve Ubeydullah ibn Ömer'in Süleyman ile Ümmü Seleme arasına bir adam yerleştirdiğini aktarıyor. Araştırmacı, Süleyman'ın bunu Ümmü Seleme'den duymadığına, dolayısıyla el-Muvatta'daki rivayetin kopuk olduğuna ve kimliği belirsiz adamla bağlantılı rivayetin el-Darimi ve Ebu Davud'da (275-277) bulunduğuna inanıyor."
  id: "Diriwayatkan oleh Malik dari Nafi’ dari Sulayman bin Yasar dari Umm Salamah, istri Nabi, dalam surah tentang wanita yang mengalami pendarahan berkepanjangan: Ada seorang wanita yang mengalami pendarahan berkepanjangan pada zaman Nabi, lalu ia meminta fatwa dari Umm Salamah. Beliau menyuruhnya untuk menghitung malam dan hari dalam bulan di mana ia biasanya mengalami menstruasi sebelum kondisinya dimulai, dan untuk tidak shalat selama jangka waktu tersebut. Setelah pendarahan berhenti, ia harus melakukan ghusl (mandi ritual), menggunakan kain untuk menyerap darah, dan kemudian shalat. Peneliti memasukkannya dalam kumpulan hadits Abu Dawud (274), al-Nasa’i (1/119), Ahmad (6/320), al-Shafi’i, dan al-Bayhaqi melalui sanad para sahabat Malik. Ia mengutip Ibnu ‘Abd al-Barr yang mengatakan bahwa Ayyub meriwayatkannya dari Sulaiman sebagaimana Malik meriwayatkannya dari Nafi’, dan bahwa al-Layth, Sakhr ibn Juwayriyah, dan ‘Ubayd Allah ibn ‘Umar menyisipkan seorang pria di antara Sulaiman dan Umm Salamah. Peneliti tersebut meyakini bahwa Sulaiman tidak mendengarnya dari Umm Salamah, sehingga riwayat dalam al-Muwatta’ terputus, dan riwayat yang terhubung dengan pria yang tidak dikenal tersebut ditemukan dalam al-Darimi dan Abu Dawud (275–277)."
