label: { ar: "الموطأ 158 — أم سلمة تستفتي للمستحاضة: تعدّ أيام حيضها المعتادة", en: "Muwatta 158" }
text: "لتنظر إلى عدد الليالي والأيام التي كانت تحيضهن من الشهر قبل أن يصيبها الذي أصابها، فلتترك الصلاة قدر ذلك من الشهر"
summary:
  ar: "يرويه مالك عن نافع عن سليمان بن يسار عن أم سلمة زوج النبي، في باب المستحاضة: كانت امرأة تُهراق الدماء في عهد النبي فاستفتت لها أم سلمة، فأمرها أن تعدّ الليالي والأيام التي كانت تحيضها من الشهر قبل أن يصيبها ما أصابها، فتترك الصلاة بقدرها، فإذا جاوزتها اغتسلت واستثفرت بثوب ثم صلت. ويخرّجه المحقق عند أبي داود (274) والنسائي (1/119) وأحمد (6/320) والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن أيوب رواه عن سليمان كما رواه مالك عن نافع، وأن الليث وصخر بن جويرية وعبيد الله بن عمر أدخلوا بين سليمان وأم سلمة رجلاً؛ ويرى المحقق أن سليمان لم يسمع من أم سلمة فرواية الموطأ منقطعة، والرواية المتصلة بالرجل المبهم عند الدارمي وأبي داود (275–277). {cite:muwatta-maruf-1997 p.107}"
