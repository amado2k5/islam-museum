label:
  ar: "أبو داود 3906 — أصبح من عبادي مؤمن بي وكافر"
  en: "Abu Dawud 3906 — Some of My servants have woken as believers in Me and some as deniers"
  ur: "ابو داود 3906 — میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ"
text: "هل تدرون ماذا قال ربكم . قالوا الله ورسوله أعلم . قال قال أصبح من عبادي مؤمن بي وكافر فأما من قال مطرنا بفضل الله وبرحمته فذلك مؤمن بي كافر بالكوكب وأما من قال مطرنا بنوء كذا وكذا فذلك كافر …"
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 3906: أصبح من عبادي مؤمن بي وكافر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 3906: Some of My servants have woken as believers in Me and some as deniers. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 3906: میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
