text: "لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به"
summary:
  ar: "حديث عبد الله بن عمرو بن العاص قال: قال رسول الله: «لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به» — وهو الحديث الحادي والأربعون في الأربعين النووية وفي شرح ابن رجب؛ قال النووي حديث حسن صحيح رويناه في كتاب الحجة بإسناد صحيح — يعني كتاب «الحجة على تارك المحجة» للشيخ أبي الفتح نصر بن إبراهيم المقدسي الشافعي نزيل دمشق، المتضمن أصول الدين على قواعد أهل الحديث والسنة؛ وخرجه أبو نعيم في «الأربعين» مشترطاً أن تكون من صحاح الأخبار وجياد الآثار مما أجمع الناقلون على عدالة ناقليه عن الطبراني عن أبي زيد عبد الرحمن بن حاتم المرادي عن نعيم بن حماد عن عبد الوهاب الثقفي عن هشام بن حسان عن محمد بن سيرين عن عقبة بن أوس عن عبد الله بن عمرو وزيادة «لا يزيغ عنه»؛ ورواه ابن أبي عاصم في «السنة» عن ابن واره عن نعيم بن حماد عن عبد الوهاب الثقفي عن بعض مشيختهم هشام أو غيره عن ابن سيرين وليس عنده «لا يزيغ عنه»؛ قال أبو موسى المديني هذا الحديث مختلف فيه على نعيم؛ وقال ابن رجب: تصحيح هذا الحديث بعيد جداً من وجوه منها أنه يتفرد به نعيم بن حماد ⁦(جامع العلوم والحكم ص 824–830)⁩."
  en: "The hadith of Abdullah ibn Amr ibn al-As that the Messenger of God said 'none of you believes until his desire is brought to follow what I have brought' — the forty-first of al-Nawawi's Forty and of Ibn Rajab's commentary, which al-Nawawi graded hasan sahih, saying 'we narrated it in the Book of al-Hujja with a sound isnad' — meaning Abu al-Fath Nasr ibn Ibrahim al-Maqdisi al-Shafi'i's *al-Hujja ala tarik al-mahajja*, a work on the principles of religion by the rules of the hadith folk; Abu Nu'aym included it in his *Arba'in*, conditioned on transmitters agreed trustworthy, through al-Tabarani from Abu Zayd Abd al-Rahman ibn Hatim al-Maradi from Nu'aym ibn Hammad from Abd al-Wahhab al-Thaqafi from Hisham ibn Hassan from Muhammad ibn Sirin from Uqba ibn Aws from Abdullah ibn Amr, with the addition 'it does not deviate from it'; Ibn Abi Asim's *al-Sunna* carries it through Ibn Wara' from Nu'aym ibn Hammad from Abd al-Wahhab al-Thaqafi from 'one of our shaykhs, Hisham or another' from Ibn Sirin without the addition; Abu Musa al-Madini noted the hadith is disputed over Nu'aym; and Ibn Rajab held grading it sound very remote for several reasons, among them that Nu'aym ibn Hammad alone narrates it (Jami' al-Ulum wal-Hikam pp. 824–830)."
  es: "El hadiz de Abdullah ibn Amr ibn al-As que dice que el Mensajero de Dios dijo 'ninguno de vosotros cree hasta que su deseo sea llevado a seguir lo que yo he traído' —el cuadragésimo primero de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, que al-Nawawi clasificó hasan sahih, diciendo 'lo narramos en el Libro de al-Hujja con un isnad sólido' — es decir, *al-Hujja ala tarik al-mahajja* de Abu al-Fath Nasr ibn Ibrahim al-Maqdisi al-Shafi'i, una obra sobre los principios de la religión según las reglas de la gente del hadiz; Abu Nu'aym lo incluyó en su *Arba'in*, condicionado a transmisores considerados dignos de confianza, a través de al-Tabarani de Abu Zayd Abd al-Rahman ibn Hatim al-Maradi de Nu'aym ibn Hammad de Abd al-Wahhab al-Thaqafi de Hisham ibn Hassan de Muhammad ibn Sirin de Uqba ibn Aws de Abdullah ibn Amr, con la adición 'no se desvía de él'; *al-Sunna* de Ibn Abi Asim lo lleva a través de Ibn Wara' de Nu'aym ibn Hammad de Abd al-Wahhab al-Thaqafi de 'uno de nuestros shaykhs, Hisham u otro' de Ibn Sirin sin la adición; Abu Musa al-Madini señaló que el hadiz es disputado sobre Nu'aym; e Ibn Rajab sostuvo que calificarlo suena muy remoto por varias razones, entre ellas que solo Nu'aym ibn Hammad lo narra (Jami' al-Ulum wal-Hikam pp. 824–830)."
  fr: "Le hadith d'Abdullah ibn Amr ibn al-As selon lequel le Messager de Dieu a dit: « Aucun d'entre vous ne croit tant que son désir n'est pas amené à suivre ce que j'ai apporté » — le quarante et unième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, qu'al-Nawawi a classé hasan sahih, disant: « Nous l'avons rapporté dans le Livre d'al-Hujja avec une isnad solide » — faisant référence à *al-Hujja ala tarik al-mahajja* d'Abu al-Fath Nasr ibn Ibrahim al-Maqdisi al-Shafi'i, un ouvrage sur les principes de la religion selon les règles du peuple du hadith; Abou Nu'aym l'a inclus dans son *Arba'in*, sous réserve de transmissions jugées dignes de confiance, par l'intermédiaire d'al-Tabarani d'après Abou Zayd Abd al-Rahman ibn Hatim al-Maradi d'après Nu'aym ibn Hammad d'après Abd al-Wahhab al-Thaqafi d'après Hisham ibn Hassan d'après Muhammad ibn Sirin d'après Uqba ibn Aws d'après Abdullah ibn Amr, avec l'ajout « il ne s'en écarte pas »; l'*al-Sunna* d'Ibn Abi Asim le transmet par l'intermédiaire d'Ibn Wara' d'après Nu'aym ibn Hammad d'après Abd al-Wahhab al-Thaqafi d'après « l'un de nos cheikhs, Hisham ou un autre » d'après Ibn Sirin sans l'ajout; Abou Musa al-Madini a noté que le hadith est contesté au sujet de Nu'aym; et Ibn Rajab considérait que le fait de le classer semblait très improbable pour plusieurs raisons, parmi lesquelles le fait que Nu'aym ibn Hammad soit le seul à le rapporter (Jami' al-Ulum wal-Hikam pp. 824–830)."
  ur: "عبداللہ بن عمرو بن العاص کی حدیث ہے کہ رسول اللہ نے فرمایا: ”تم میں سے کوئی اس وقت تک مومن نہیں ہو سکتا جب تک کہ اس کی خواہش اس چیز کی پیروی نہ کرے جو میں لایا ہوں“ یعنی نووی کی چالیسویں اور ابن رجب کی تفسیر کی، جسے نووی نے حسن صحیح قرار دیا ہے، کہتے ہیں کہ ہم نے اسے ابوجہنۃ کی سند کے ساتھ روایت کیا ہے۔ الفتح نصر بن ابراہیم المقدسی الشافعی کی *الحجہ علٰی طارق المحجا*، حدیث کے اصولوں کے مطابق اصول دین پر ایک کام؛ ابو نعیم نے اسے اپنے *اربعین* میں شامل کیا، جن پر متفقہ ثقہ ٹرانسمیٹر ہیں، الطبرانی کے ذریعے ابو زید عبدالرحمٰن بن حاتم المرادی سے نعیم بن حماد نے عبد الوہاب الثقفی سے ہشام بن حسن سے، محمد بن عقبہ عبداللہ سے عن ابن سیب سے۔ اس کے علاوہ 'یہ اس سے انحراف نہیں کرتا'؛ ابن ابی عاصم کی *السنہ* نے اسے ابن ورثہ سے، نعیم بن حماد سے، عبد الوہاب الثقفی سے، 'ہمارے کسی شیخ، ہشام یا کسی دوسرے' سے ابن سیرین سے بغیر کسی اضافے کے؛ ابو موسیٰ المدینی نے نوٹ کیا کہ حدیث نعیم پر اختلاف رکھتی ہے۔ اور ابن رجب نے کئی وجوہات کی بنا پر اسے بہت دور کی بات قرار دیا، ان میں سے نعیم بن حماد اکیلے اسے روایت کرتے ہیں ⁦(جامع العلوم والحکم صفحہ 824-830)⁩۔"
  tr: "Abdullah bin Amr bin Al-Aas'ın rivayet ettiği hadis şöyledir: Allah Resulü şöyle buyurmuştur: \"Sizden hiç kimse, arzuları benim getirdiklerime uygun olmadıkça gerçek anlamda iman etmiş sayılmaz.\" Bu hadis, Nevevi'nin Kırk Hadis adlı eserinde ve İbn Receb'in tefsirinde kırk birinci hadistir. Nevevi şöyle demiştir: \"Bu, sahih bir isnad zinciriyle 'Hucce' kitabında rivayet ettiğimiz güzel ve sahih bir hadistir.\" — yani Şam'da ikamet eden Şeyh Ebu el-Feth Nasr bin İbrahim el-Makdisi el-Şafii'nin \"Hucce ala Tarik el-Mahajjah\" adlı kitabından, hadis ve sünnet ehlinin prensiplerine göre dinin esaslarını içeren bir hadis. Ebu Nu'aym, \"El-Arba'in\" adlı eserine, sahih hadislerden ve sahih rivayetlerden olduğunu, ravilerinin Taberani, Ebu Zeyd Abdülrahman bin Hatim el-Muradi, Nu'aym bin Hammad, Abdül-Vahhab el-Sakkafi, Hişam bin Hasan, Muhammed bin Sirin, Ukbe bin Evs ve Abdullah bin Amr'dan rivayet ettiğine dayanarak, \"Ondan sapmaz\" ibaresiyle eklemiştir. İbn Abi Asim, “Sünnet” adlı eserinde İbn Vârâh'tan, o da Naim bin Hammad'dan, o da Abdül Vahhab el-Sakkafi'den, o da şeyhlerinden Hişam veya diğerlerinden, o da İbn Sirin'den rivayet etmiştir ve İbn Sirin'in “Bundan sapmaz” diye bir sözü yoktur. Ebu Musa el-Medini şöyle demiştir: Bu hadis Naim'in rivayetine göre tartışmalıdır. İbn Receb şöyle demiştir: Bu hadisin sahihliği, Naim bin Hammad'ın tek başına rivayet etmesi de dahil olmak üzere çeşitli nedenlerden dolayı, doğru olmaktan çok uzaktır (Cami' el-Ulum ve'l-Hikam, s. 824-830)."
  id: "Hadits Abdullah bin Amr bin Al-Aas, yang berkata: Rasulullah SAW bersabda: “Tidak seorang pun di antara kalian benar-benar beriman sampai keinginannya sesuai dengan apa yang telah aku bawa.” — Ini adalah hadits ke-41 dalam kitab Empat Puluh Hadits karya Al-Nawawi dan dalam tafsir Ibnu Rajab. Al-Nawawi berkata: “Ini adalah hadits yang baik dan sahih yang telah kami riwayatkan dalam kitab Al-Hujjah dengan sanad yang sahih.” — maksudnya kitab “Al-Hujjah ala Tarik Al-Mahajjah” karya Syekh Abu Al-Fath Nasr bin Ibrahim Al-Maqdisi Al-Shafi’i, penduduk Damaskus, yang memuat dasar-dasar agama menurut prinsip-prinsip ahli hadits dan Sunnah. Abu Nu’aym memasukkannya ke dalam “Al-Arba’in,” dengan menetapkan bahwa hadits tersebut harus termasuk hadits-hadits sahih dan riwayat-riwayat yang baik, yang mana para perawinya sepakat tentang integritas perawinya, berdasarkan riwayat Al-Tabarani, berdasarkan riwayat Abu Zayd Abd Al-Rahman bin Hatim Al-Muradi, berdasarkan riwayat Nu’aym bin Hammad, berdasarkan riwayat Abd Al-Wahhab Al-Thaqafi, berdasarkan riwayat Hisham bin Hassan, berdasarkan riwayat Muhammad bin Sirin, berdasarkan riwayat Uqbah bin Aws, berdasarkan riwayat Abdullah bin Amr, dengan tambahan, “Dia tidak menyimpang dari hadits tersebut.” Hadits ini diriwayatkan oleh Ibn Abi Asim dalam “Al-Sunnah” dari Ibn Warah, dari Naeem bin Hammad, dari Abdul Wahhab Al-Thaqafi, dari beberapa syekh mereka, Hisham atau lainnya, dari Ibn Sirin, dan beliau tidak memiliki “Dia tidak menyimpang darinya.” Abu Musa Al-Madini berkata: Hadits ini diperdebatkan dari Naeem. Ibn Rajab berkata: Otentisitas hadits ini sangat jauh dari benar karena beberapa alasan, termasuk bahwa Naeem bin Hammad adalah satu-satunya yang meriwayatkannya (Jami’ Al-Ulum wal-Hikam, hlm. 824–830)."
