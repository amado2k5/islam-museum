label: { ar: "مسلم 637 — من صلى البردين دخل الجنة", en: "Muslim 637 — Whoever prays the two cool-hour prayers enters Paradise", es: "Musulmán 637 — Quien rece las dos oraciones de la hora fresca entrará en el Paraíso", fr: "Muslim 637 — Quiconque accomplit les deux prières de l'heure fraîche entrera au Paradis", ur: "مسلم 637 - جس نے ٹھنڈے وقت کی دو نمازیں پڑھیں وہ جنت میں داخل ہو گا۔", tr: "Müslim 637 — Kim iki vakit (sabah ve ikindi namazı) kılarsa cennete girer.", id: "Muslim 637 — Barangsiapa yang mengerjakan dua shalat yang sejuk (Fajr dan Asr), maka ia akan masuk surga." }
text: "قال رسول الله: «من صلى البردين دخل الجنة»"
summary:
  ar: "رواية أبي موسى الأشعري عن طريق ابنه أبي بكر في باب صلاة الضحى وفضل المحافظة على الصلوات من صحيح مسلم؛ البردان صلاة الفجر والعصر — وقبلهما في الباب «لا يلج النار من صلى قبل طلوع الشمس وقبل غروبها»."
  tr: "Sahih Müslim'de, Ebu Musa el-Eş'ari'nin oğlu Ebu Bekir'den rivayet ettiği üzere, Duha namazı ve namazları kılmanın fazileti bölümünde; iki güzel namaz, sabah namazı ve ikindi namazıdır ve bu bölümde onlardan önce şöyle buyurulmaktadır: \"Güneş doğmadan önce ve güneş batmadan önce namaz kılan cehenneme girmez.\""
  id: "Riwayat Abu Musa al-Ash’ari, dari putranya Abu Bakr, dalam surah tentang shalat Dhuha dan keutamaan melaksanakan shalat, dari Sahih Muslim; dua shalat yang paling utama adalah Subuh dan Ashar — dan sebelum keduanya dalam surah, “Barang siapa yang shalat sebelum matahari terbit dan sebelum matahari terbenam, maka ia tidak akan masuk neraka.”"
