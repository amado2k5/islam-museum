label: { ar: "سنن ابن ماجه 154 — الحلال، الحرام", en: "Sunan Ibn Majah 154 — the lawful; the unlawful", ur: "سنن ابن ماجہ 154 — حلال، حرام", es: "Sunan Ibn Majah 154 - lo lícito; lo ilegal", fr: "Sunan Ibn Majah 154 — le licite; l'illégal", tr: "Sünen İbn Mâce 154 — Helal, Haram", id: "Sunan Ibnu Majah 154 — Halal, Haram" }
text: "… بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ ـ قَالَ \" أَرْحَمُ أُمَّتِي بِأُمَّتِي أَبُو بَكْرٍ وَأَشَدُّهُمْ فِي دِينِ اللَّهِ عُمَرُ وَأَصْدَقُهُمْ حَيَاءً عُثْمَانُ وَأَقْضَاهُمْ عَلِيُّ بْنُ أَبِي طَالِبٍ وَأَقْرَؤُهُمْ لِكِتَابِ اللَّهِ أُبَىُّ بْنُ كَعْبٍ وَأَعْلَمُهُمْ بِالْحَلاَلِ وَالْحَرَامِ مُعَاذُ بْنُ جَبَلٍ وَأَفْرَضُهُمْ زَيْدُ بْنُ ثَابِتٍ أَلاَ وَإِنَّ لِكُلِّ أُمَّةٍ أَمِينًا وَأَمِينُ هَذِهِ الأُمَّةِ أَبُو عُبَيْدَةَ بْنُ الْجَرَّاحِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 154، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 154 (The Book of the Sunnah), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 154، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 154 (El Libro de la Sunnah), menciona lo lícito y lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 154 (Le Livre de la Sunna), mentionne ce qui est licite et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde yer alan 154 numaralı hadis, helal ve haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" adlı kitabın bu bölümü, bu hadisi Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 154, menyebutkan apa yang diperbolehkan dan apa yang diharamkan. Bagian buku \"Halal dan Haram\" ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
