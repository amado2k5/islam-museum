text: "… إن لم يطل الفصل، وكذا إن طال وهو المذهب، وفيه الخلاف السابق. قال البغوى وآخرون : إذا كان الطواف فرضا كره قطعه لصلاة الجنازة ولسنة الضحى والوتر وغيرها من الرواتب، لأن الطواف فرض عين ولا يقطع ننفل ولا لفرض كفاية، …"
summary:
  ar: "مقطع من المجموع للنووي، ص 69، يرد فيه ذكر الفرض، وفرض العين، وفرض الكفاية، والسنن المؤكدة والرواتب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 69, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the communal obligation (fard kifaya), the emphasised and regular sunnas; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 69 کا اقتباس جس میں فرض، فرضِ عین، فرضِ کفایہ، سننِ مؤکدہ اور رواتب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 69, dont le texte mentionne l'obligatoire (fard), l'obligation individuelle (fard 'ayn), l'obligation collective (fard kifaya), les sunnas appuyées et régulières ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 69, cuyo texto menciona lo obligatorio (fard), la obligación individual (fard 'ayn), la obligación colectiva (fard kifaya), las sunnas enfatizadas y regulares; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Mecmu' adlı eserinin 69. sayfasından, farz ameller, bireysel yükümlülükler, toplumsal yükümlülükler, tasdik sünnetler ve düzenli namazlardan bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Majmu' karya al-Nawawi, halaman 69, yang menyebutkan amalan wajib, kewajiban individu, kewajiban komunitas, sunnah yang dikonfirmasi, dan shalat rutin; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
