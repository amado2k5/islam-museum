text: |-
  ظول السغر والجهد اه
  ٦٧٢
  (باب الح1-
  أجوح)
  وجاوزى ذا السحم المجلوح * وكثرة الاصوات والنبوح
  والجوالح ما تطاير من رؤس القصب والبردى شبه القعان والجالحة المشادّة.: ل المكالحة
  أم والمجالح الناقة التى تدر فى الشتاء والجمع الجليح والمجمالح أيضا السنون اللواتى تذهب بالمال
  وناقة مجلاح جادة على السنة الشديدة فى بقاءلبنها والجلح فوق النزع وهوانحسار اشعر
  عن جانبى الرأس أوّله النزع ثم الجلح ثم الصلع وقد جلح الرحل بالمكسرفه وأجلح بين الجلح واسم
  ذلك الموضع الجلمة والاجلح من الهوادج الذى ليس لدرأس مرتفع قال أبوذؤيب
  ان لم تكن ظعناتدى هوادحها • فانهن حسان الزى أحلاح
  وبقرجلح أى لا قرون لها قال الكسائى أنشدنى ابن أبى طرفة
  فسكنتهم بالقول حتق كانهم • بواقرجلج أمكنه المرائع
  والمجلح الرجل الكثير الاكل والمجلح المأكول ومنه قول ابن مقبل يصف القمط
  القدية والتصاي وفال يشربة أل قدم
  وهو الذى قدأ كل حتى لم يترك" منه شئ والتجايح أيضا الاقدام
  وملنا بالجفار الى قيم * على شعث مجلحة عتاق
  والجلاح بالضم مخففة السيل الإراف واسم رجل الاصمعى جاات الرجل بالاهراذا
  جاهرته به والمجالحة المكاشفة بالعداوة والمجمالح المكابر والجلهاء موضع على فريخيز من
  البصرة الفرّاء جلمح رأسه أى حلقه والميم زائدة ⁦(جمح)⁩ جمح الفرس جوحا وجاحا
  أذا اعتزفارسه وغلبه فهو فرس جوج وجست المرأم ن زوجها وهو خروجهامن بيته الى
  أهلها قبل أت يطلقها قال الراجز
  اذارأنى ذات ضغن حنت * وجمعتمن زوجها وأنت
  وايهوح من الرجال الذى يركب هواه فلاء-كن ردّه وقال
  خلعت عذارى جامحامايردنى • عن البيض أمثال الدمى زجرزابو
  وجمح أى أسرع قال أبو عبيدة فى قوله تعالى لولوا اليه وهم يجمدون يسرعون والجاح بالضم
  والمتشديد سهم لانصل مدوّر الرأس يتعلم الصبى به الرمى جنخ جخ أو مال يجنح
  ويجنح جنوحا واجتح مثل وأجنهه غيره وجنوح الليل اقباله والجوافح الاضلاع التى تحت
  الترائب وهى ممايلى الصدر كالضلوع مما يلى الظهر الواحدة جائحة وجنح البعيرا..كسرت
  جوافحه من الحمل المقيل وجناح الطائريده والجمع أجنحة وجتحته أصبت جاحه والجناح
  بالضم الاثم و جنح الليل وجنحه ( ٢ ائفة منه وجنخ الطاريق جانبه قال الشاءر
  وما كنت ضغاطا ولكن ثائرا * أناخ قليلا عندجنح مبيل
  وجح القوم فاحيتهم وكنفهم وقال
  فبات بجنح القوم حقاذا بدا * له الصبح ام التوم احدى المهالك
  ( ⁦(جوح)⁩ الجوح الاستئصال جمت الشى أجوحه ومنه الجائحة وهى الشدّة التى تجتاح
  المالم ن سنة أوقتنة بقال با-تهم الجائحة واجتاحتهم وجاح اللّٰه ماله وأجاحه بعنى
  أى أها كه بالجاعة
  رصل
