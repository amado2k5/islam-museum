label: { ar: "الموطأ 2162 — مالك: وإن شهد رجل على مثل ما شهدت به المرأة أن لفلان على أبيه دينا، أحلف صاحب الدين مع شهادة شاهده، وأعطي الغريم حقه كله، وليس هذا بمنزلة المرأة، لأن الرجل تجوز شهادته", en: "Muwatta 2162" }
summary:
  ar: "قال مالك: وإن شهد رجل على مثل ما شهدت به المرأة أن لفلان على أبيه دينا، أحلف صاحب الدين مع شهادة شاهده، وأعطي حقه كله. وليس هذا بمنزلة المرأة؛ لأن الرجل تجوز شهادته، ويكون على صاحب الدين مع شهادة شاهده أن يحلف، ويأخذ حقه كله. فإن لم يحلف أخذ من ميراث الذي أقر له قدر ما يصيبه من ذلك الدين، لأنه أقر بحقه، وأنكر الورثة، وجاز عليه إقراره. {cite:muwatta-maruf-1997 p.286}"
