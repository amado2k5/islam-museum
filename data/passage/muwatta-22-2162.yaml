label: { ar: "الموطأ 2162 — مالك: وإن شهد رجل على مثل ما شهدت به المرأة أن لفلان على أبيه دينا، أحلف صاحب الدين مع شهادة شاهده، وأعطي الغريم حقه كله، وليس هذا بمنزلة المرأة، لأن الرجل تجوز شهادته", en: "Muwatta 2162", es: "Muwatta 2162", fr: "Muwatta 2162", ur: "موطا 2162", tr: "El-Muvatta 2162 — Malik: Eğer bir erkek, kadının şahit olduğu gibi, filancanın babasından kendisine bir borcu olduğunu şahitlik ederse, alacaklı şahidinin şahitliğiyle birlikte yemin ettirilir ve borçluya alacağının tamamı ödenir. Bu, kadının durumundan farklıdır, çünkü erkeğin şahitliği de kabul edilebilir.", id: "Al-Muwatta 2162 — Malik: Jika seorang laki-laki bersaksi tentang hal yang sama dengan perempuan, bahwa si fulan mempunyai hutang kepadanya oleh ayahnya, maka pemberi hutang wajib bersumpah bersama dengan kesaksian saksinya, dan debitur akan menerima haknya sepenuhnya. Ini tidak sama dengan kasus perempuan, karena kesaksian laki-laki dapat diterima." }
summary:
  ar: "قال مالك: وإن شهد رجل على مثل ما شهدت به المرأة أن لفلان على أبيه دينا، أحلف صاحب الدين مع شهادة شاهده، وأعطي حقه كله. وليس هذا بمنزلة المرأة؛ لأن الرجل تجوز شهادته، ويكون على صاحب الدين مع شهادة شاهده أن يحلف، ويأخذ حقه كله. فإن لم يحلف أخذ من ميراث الذي أقر له قدر ما يصيبه من ذلك الدين، لأنه أقر بحقه، وأنكر الورثة، وجاز عليه إقراره. {cite:muwatta-maruf-1997 p.286}"
  tr: "Malik şöyle dedi: Eğer bir erkek, kadının da tanıklık ettiği gibi, filanca kişinin babasından kendisine bir borcu olduğunu söylerse, alacaklı tanığın ifadesiyle birlikte yemin etmek zorundadır ve alacağının tamamını alır. Bu, kadının durumundan farklıdır, çünkü erkeğin tanıklığı da kabul edilebilir ve alacaklı, tanığının ifadesiyle birlikte yemin etmek ve alacağının tamamını almak zorundadır. Eğer yemin etmezse, borcun kendisine ait olduğunu kabul eden kişinin mirasından, kendi payına düşen miktarı alır; çünkü hakkını kabul etmiş, mirasçılar ise bunu reddetmiştir ve bu kabulü geçerlidir. {cite:muwatta-maruf-1997 s.286}"
  id: "Malik berkata: Jika seorang pria bersaksi tentang hal yang sama dengan wanita itu, bahwa si fulan memiliki hutang yang harus dibayar kepadanya oleh ayahnya, maka kreditur wajib bersumpah bersama dengan kesaksian saksi, dan ia akan menerima haknya sepenuhnya. Ini tidak sama dengan kasus wanita itu, karena kesaksian pria dapat diterima, dan kreditur, bersama dengan kesaksian saksinya, diharuskan untuk bersumpah dan menerima haknya sepenuhnya. Jika ia tidak bersumpah, ia mengambil dari warisan orang yang kepadanya hutang itu diakui sejumlah yang sama dengan bagiannya dari hutang itu, karena ia mengakui haknya, ahli waris menyangkalnya, dan pengakuannya sah. {cite:muwatta-maruf-1997 p.286}"
