text: "… عباس خير الناس منزلا وفى رواية للحاكم أى الناس أكمل إيماناً وكأن المراد بالمؤمن من قام بما تعين عليه القيام به ثم حصل هذه الفضيلة، وليس المراد من اقتصر على الجهاد وأهمل الواجبات العينية، وحينئذ فيظهر فضل المجاهد لما فيه …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 2، ص 9، يرد فيه ذكر فرض العين، والواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hajar's Fath al-Bari, scan volume 2, p. 9, whose wording mentions the individual obligation (fard 'ayn), the obligatory (wajib); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن حجر، اسکین جلد 2، ص 9 کا اقتباس جس میں فرضِ عین، واجب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Hajar, volume numérisé 2, p. 9, dont le texte mentionne l'obligation individuelle (fard 'ayn), l'obligatoire (wajib) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Hajar, volumen digitalizado 2, p. 9, cuyo texto menciona la obligación individual (fard 'ayn), lo obligatorio (wajib); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Hacer'in Fethü'l-Bari adlı eserinin 2. cildinin 9. sayfasından, bireysel yükümlülükler ve görevlerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Bu metin, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Hajar, Jilid 2, halaman 9, yang menyebutkan kewajiban dan tugas individu; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
