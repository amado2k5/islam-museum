label: { ar: "سنن النسائي 4017 — ما لا يحل", en: "Sunan al-Nasa'i 4017 — what is not lawful", ur: "سنن نسائی 4017 — جو حلال نہیں", es: "Sunan al-Nasa'i 4017 — lo que no es lícito", fr: "Sunan al-Nasa'i 4017 — ce qui n'est pas licite", tr: "Sunan an-Nasa'i 4017 — İzin verilmeyen şeyler", id: "Sunan an-Nasa'i 4017 — Apa yang tidak diperbolehkan" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا يَحْيَى، قَالَ حَدَّثَنَا سُفْيَانُ، قَالَ حَدَّثَنَا أَبُو إِسْحَاقَ، عَنْ عَمْرِو بْنِ غَالِبٍ، قَالَ قَالَتْ عَائِشَةُ أَمَا عَلِمْتَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ إِلاَّ رَجُلٌ زَنَى بَعْدَ إِحْصَانِهِ أَوْ كَفَرَ بَعْدَ إِسْلاَمِهِ أَوِ النَّفْسُ بِالنَّفْسِ \". وَقَّفَهُ زُهَيْرٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 4017، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4017 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4017، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4017 (El Libro de la Lucha [La Prohibición del Derrame de Sangre]), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4017 (Le Livre du Combat [L'Interdiction du Sang]), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de yer alan 4017 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konularında Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4017, menyebutkan apa yang dilarang. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
