text: "… عَوف، لشيءٍ بلغه عنهم، والحارث بن الصِّمّة، كُسِر بالرَّوْحاء، وخوّات بن جُبَير، كَسر في بدر أسفلٍ سيفه ذي الفقار، وكان لمُنبّه بن الحجَاج، وقيل كان للعاص بن منبّه، قتله عليّ صبراً، وأخذ سيفه ذا الفقار، فكان للنبيّ، وَليقِ، فوهبه لعليّ. …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 29، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 1, p. 29, that mentions a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الکامل فی التاریخ، ابن الاثیر، اسکین جلد 1، ص 29 کا اقتباس جس میں محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
