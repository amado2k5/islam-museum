label: { ar: "سنن النسائي 3384 — الأب والأبوة", en: "Sunan al-Nasa'i 3384 — the father and fatherhood", ur: "سنن نسائی 3384 — باپ اور والدیت", es: "Sunan al-Nasa'i 3384 — El padre y la paternidad" }
text: "أَخْبَرَنَا نُصَيْرُ بْنُ الْفَرَجِ، قَالَ حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ زَائِدَةَ، قَالَ حَدَّثَنَا عَطَاءُ بْنُ السَّائِبِ، عَنْ أَبِيهِ، عَنْ عَلِيٍّ، قَالَ جَهَّزَ رَسُولُ اللَّهِ فَاطِمَةَ فِي خَمِيلٍ وَقِرْبَةٍ وَوِسَادَةٍ حَشْوُهَا إِذْخِرٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 3384، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3384 (The Book of Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3384، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3384 (El Libro del Matrimonio), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
