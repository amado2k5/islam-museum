text: |-
  تولد قدة علينه ف بعض الفسخ
  لوتعلمينه اه
  ٢٠٨
  ومنهنّ مشل الشهد قد شيب بالطوم • والطرم أيضافى بعض اللغات العسل والطريم
  السحاب الكثيف قال روية * فى مكفهر المطريم الشرنيت • والطراصة بالضم
  الخضرة على الاسنان وقد أطرمت أسنانه والطارمة بيت من خشب فارسى معرب
  ( طرخم اطرخمّ أى شمخ بأنفه وتعظم المرخاما وشاب مطر خم أى حسن تام قال
  العجاج وجامع القطرين مطرخم *بيض عينيه العمى المعمى
  رسم طرسم الرجل أطرق وطلسيم مثه رهم المطرهم الشاب المعتدل
  وقد اطرهمّ اطرهماما قال ابن أسهر
  أرجى شبابا مطرهما وصحة * وكيف رجاء المرم ما ليس لاقيا
  ( طسم طسم قبيلة من عاد كانوا فاتقرضوا وطسم الطريق مثل طمس على القلب قال
  العجاج
  ورب هذا الار المقسم • من عهدابراهيم لمايطم
  والطواسيم والطواسين سورفى القرآن جعت على غمرقياس وأنشد أبوعسد
  وبالطواسيم التى قد ثلثت • وبالحواميم التى قد سبعت
  والصواب أن تجمع بذوات وتضاف الى واحدفيقال ذوات طسم وذوات حم ⁦( عم)⁩
  الطعام ما يو كل وربماخص بالطعام البرّ وفى حديث أبى سعيدى اللّٰه عنه كنا نخرج
  صدقة الفطر على عهد رسول اللّه صلى اللّٰه عليه وسلم صاعا من طعام أَوصاعا من شعير والطعم
  بالفتح ما يؤَّدّيه الذوق يقال طعمه مرّ والطعم أيضا مايشتهي منه يقال ليس له طعم ومافلان
  يذى طعم اذا كان غنا والطعم بالضم الطعام قال أبو خراش ؟
  أرتّشجاع البطن قد تعلينه • وأوترغيرى من عيالك بالطعم
  واغتبق الماء القراح وانتهى • اذا الزادأمسى للمزلح داطعم
  أراد بالاول الطعام وبالثانى مايشتهى منه وقد طعم يطعم طعمافهو طاعم اذا؟كل أوذاق
  مثال غنم يغنم غنما فهو غانم قال تعالى فاذ العمتم فانتشروا ووله تعالى ومن لم يطعمه فانه
  منى أى من لم يذقه وتقول فلان قلّ طعمه أى أكله والطعمة المأكلة يقال جعلت (هذه
  الضيعة طعمة لفلان والطعمة أيضاوجه المكسب بقال فلان عفيف الطعمة وخبيث
  الطعماذ! كان ردى«الكسب أبو عبيدة لان حسن الطعمة والشرية بالكسر واستطعمه
  سأله أن يطعمه وفى الحديث اذا استطعمكم الأمام فأطعموه يقول اذا استفتح فاقهو اعلميه
  وأطعمته الطعام الفراء يقال جزور طعوم وطعيم اذا كانت بين الغنة والسمينة وأضعمت
  .الهخلة اذا أدرك عمرها واطعمت البسرة أى صارلها لطعم وأخذت الطعم وهوافتعل من الطعم
  ثل اطلب من الطلب واطرد من الطرد ومسستطعم الفرس حافله قال الاصعمى يستحب
  في الفرس أنيرق مستطعمه ورحل مطعم بكسر الميم شديد الاكل ومطعم بعضم الميم مر زوق
  والمطعمة القوس وقانff
  وفى الشمال من الشريان مطعمة * كبداء فى عجسها عطف وقة ويم
  رواه ابن الاعرابي بكسر العين وقال انها تطعم صداحبها الصيد ورج-ل مطعام كثير الاطعام
  والقرى وقولهسم تطعم تطعم أى ذق حتى تستفيق أت تشتهى وتأكل والمطعمتان فى رجل كل.
  جائر
