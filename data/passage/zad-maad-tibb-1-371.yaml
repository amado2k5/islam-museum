text: "يرعُدُ ويبرُق، فلم يزل حُمي يُخادعه ويَعِده ويُمنيه حتى إليها، والتبكيرِ بها، وأن من فاتته، فقد وُتِرَ أهله أجابه بشرط أن يدخل معه في حِصنه، يُصيبه ما أصابهم، ففعل، ونقضُوا عَ رسول اللَّه لل لهاه وأظهروا سبَّه، فبلغ رسولَ اللَّه …"
