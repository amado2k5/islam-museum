label:
  ar: "أبو داود 430 — فرضت على أمتك خمس صلوات وعهدت عندي عهدا"
  en: "Abu Dawud 430 — I made five prayers obligatory on your community and made a covenant"
  ur: "ابو داود 430 — میں نے تمہاری امت پر پانچ نمازیں فرض کیں اور ایک عہد کیا"
text: "قال الله تعالى إني فرضت على أمتك خمس صلوات وعهدت عندي عهدا أنه من جاء يحافظ عليهن لوقتهن أدخلته الجنة ومن لم يحافظ عليهن فلا عهد له عندي ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 430: فرضت على أمتك خمس صلوات وعهدت عندي عهدا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 430: I made five prayers obligatory on your community and made a covenant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 430: میں نے تمہاری امت پر پانچ نمازیں فرض کیں اور ایک عہد کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
