text: "… الشمس أكثر فائدة أم القمر؟ سألوه يوماً : الشمس أكثر فائدة أم القمر؟ فأجابهم: بما أنَّ الشمس تطلع نهاراً ولا تُفيدُ في الليل، والقمر يبزغ في الليل ويُنير الدنيا ويجعلها كالنهار ففائدة القمر أعظم من فائدة الشمس. دنا الأجل فما …"
summary:
  ar: "سُئل جحا أيهما أنفع، الشمس أم القمر، فقال القمر، لأنه يضيء في الليل حين لا تضيء الشمس. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  en: "Asked whether the sun or the moon is more useful, Juha says the moon, since it gives light at night when the sun does not. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  ur: "جحا سے پوچھا گیا کہ سورج زیادہ مفید ہے یا چاند، تو اس نے کہا چاند، کیونکہ وہ رات کو روشنی دیتا ہے جب سورج نہیں دیتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  fr: "Interrogé pour savoir du soleil ou de la lune lequel est le plus utile, Juha répond la lune, puisqu'elle éclaire la nuit, quand le soleil n'éclaire pas. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
  es: "Preguntado si es más útil el sol o la luna, Juha dice que la luna, pues da luz de noche, cuando el sol no la da. {cite:juha-nawadir-kubra-djuwaydi p. 69}"
