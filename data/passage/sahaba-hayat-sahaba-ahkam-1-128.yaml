text: "… وسلم المغرب فرجع من رجع وعقب من عقب فخرج رسول اللّٰه فقال: هذا ربكم فتح بابا من ابواب السماء يباهى بكم الملائكة يقول: عبادى قضوا فريضة وهم ينتظرون الأخرى، كذا فى الكنزج ص. و أخرجه ابن ماجه عن ابن عمر …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 128، يرد فيه ذكر الفريضة والفرائض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 128, whose wording mentions the obligation (farida); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 128 کا اقتباس جس میں فریضہ اور فرائض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hayat al-Sahaba de al-Kandahlawi, volume numérisé 1, p. 128, dont le texte mentionne l'obligation (farida) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen digitalizado 1, p. 128, cuyo texto menciona la obligación (farida); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kendahlevi'nin \"Sahabelerin Hayatı\" adlı eserinin 1. cildinin 128. sayfasından bir alıntı, farz olan amelleri ve görevleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu alıntı, farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Kandahlawi, \"Kehidupan Para Sahabat,\" Jilid 1, halaman 128, menyebutkan amalan dan kewajiban yang wajib. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
