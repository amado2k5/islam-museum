label: { ar: "الموطأ 835 — مالك: من مات وعليه نذر من رقبة أو صيام أو صدقة أو بدنة فأوصى بأن يوفى عنه من ماله، فالصدقة والبدنة في ثلثه ويُبدأ بها على الوصايا", en: "Muwatta 835", es: "Muwatta 835", fr: "Muwatta 835", ur: "موطا 835", tr: "El-Muvatta 835 — Malik: Bir kimse, köle azat etme, oruç tutma, sadaka verme veya deve kurban etme gibi yerine getirilmemiş adaklarıyla ölür ve vasiyetinde bunların mirasından yerine getirilmesini isterse, sadaka ve deve kurbanı diğer vasiyetlerden önceliklidir ve mirasın üçte birinden yerine getirilir.", id: "Al-Muwatta 835 — Malik: Jika seseorang meninggal dunia dengan nazar yang belum terpenuhi untuk membebaskan seorang budak, berpuasa, memberi sedekah, atau menyembelih unta, dan ia mewasiatkan agar nazar tersebut dipenuhi dari hartanya, maka sedekah dan penyembelihan unta lebih diutamakan daripada nazar lainnya, dan keduanya harus dipenuhi dari sepertiga hartanya." }
summary:
  ar: "قول لمالك: من مات وعليه نذر من رقبة يعتقها أو صيام أو صدقة أو بدنة، فأوصى بأن يُوفى ذلك عنه من ماله، فإن الصدقة والبدنة في ثلثه ويُبدأ بها على ما سواها من الوصايا إلا ما كان مثله؛ لأن الواجب عليه من النذور وغيرها ليس كهيئة ما يتطوع به، فيُجعل ذلك في ثلثه خاصة دون رأس ماله، لأنه لو جاز له ذلك في رأس ماله لأخّر المنوفّى مثل ذلك من الأمور الواجبة عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (833). {cite:muwatta-maruf-1997 p.407}"
  tr: "Malik şöyle demiştir: Bir kimse, köle azat etme, oruç tutma, sadaka verme veya deve kurban etme gibi yerine getirilmemiş bir adak ile ölür ve bu adakların mal varlığından yerine getirilmesini vasiyet ederse, sadaka ve deve kurbanı, mal varlığının üçte birinden ödenir ve benzer nitelikteki diğer vasiyetlerden önceliklidir. Çünkü farz adaklar ve benzeri ameller gönüllü ameller gibi değildir, bu nedenle mal varlığının üçte birinden ödenmelidir, sermayesinden değil. Eğer sermayesinden ödemesine izin verilirse, diğer farz ameller yerine getirilmesini geciktirir. Araştırmacı, Ebu Musab'ın (833) bunu Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.407}"
  id: "Malik berkata: Jika seseorang meninggal dunia dengan nazar yang belum terpenuhi untuk membebaskan seorang budak, atau berpuasa, atau memberi sedekah, atau menyembelih unta, dan ia mewariskan agar nazar tersebut dipenuhi dari hartanya, maka sedekah dan penyembelihan unta tersebut harus dibayarkan dari sepertiga hartanya dan didahulukan daripada wasiat lainnya, kecuali yang sejenis. Hal ini karena nazar wajib dan perbuatan-perbuatan semacam itu tidak seperti perbuatan sukarela, sehingga harus dibayarkan dari sepertiga hartanya, bukan dari modalnya. Jika ia diperbolehkan membayar dari modalnya, ia akan menunda pemenuhan perbuatan-perbuatan wajib lainnya. Peneliti menyebutkan bahwa Abu Mus'ab (833) meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.407}"
