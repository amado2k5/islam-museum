label: { ar: "الموطأ 835 — مالك: من مات وعليه نذر من رقبة أو صيام أو صدقة أو بدنة فأوصى بأن يوفى عنه من ماله، فالصدقة والبدنة في ثلثه ويُبدأ بها على الوصايا", en: "Muwatta 835" }
summary:
  ar: "قول لمالك: من مات وعليه نذر من رقبة يعتقها أو صيام أو صدقة أو بدنة، فأوصى بأن يُوفى ذلك عنه من ماله، فإن الصدقة والبدنة في ثلثه ويُبدأ بها على ما سواها من الوصايا إلا ما كان مثله؛ لأن الواجب عليه من النذور وغيرها ليس كهيئة ما يتطوع به، فيُجعل ذلك في ثلثه خاصة دون رأس ماله، لأنه لو جاز له ذلك في رأس ماله لأخّر المنوفّى مثل ذلك من الأمور الواجبة عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (833). {cite:muwatta-maruf-1997 p.407}"
