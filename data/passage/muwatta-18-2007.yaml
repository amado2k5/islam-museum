label: { ar: "الموطأ 2007 — مالك عن زيد بن أسلم عن أبيه: خرج عبد الله وعبيد الله ابنا عمر في جيش إلى العراق، فلقيا أبا موسى الأشعري أمير البصرة، فعرض عليهما أن يسلفهما مالا يبتاعان به متاعا يبيعانه بالمدينة، فيؤديان رأس المال إلى أمير المؤمنين والربح لهما، فلما قدما قال عمر: أكل الجيش أسلفه مثل ما أسلفكما؟ فجعله قراضا، فأخذ رأس المال ونصف الربح", en: "Muwatta 2007" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن أبيه أنه قال: خرج عبد الله وعبيد الله ابنا عمر بن الخطاب في جيش إلى العراق، فلما قفلا مرا على أبي موسى الأشعري، وهو أمير البصرة، فرحب بهما وسهل، ثم قال: لو أقدر لكما على أمر أنفعكما به لفعلت. ثم قال: بلى، هاهنا مال من مال الله أريد أن أبعث به إلى أمير المؤمنين، فأسلفكماه، فتبتاعان به متاعا من متاع العراق، ثم تبيعانه بالمدينة، فتؤديان رأس المال إلى أمير المؤمنين ويكون الربح لكما. فقالا: وددنا. ففعل، وكتب إلى عمر بن الخطاب أن يأخذ منهما المال. فلما قدما باعا فأربحا. فلما دفعا ذلك إلى عمر، قال: أكل الجيش أسلفه مثل ما أسلفكما؟ قالا: لا. فقال عمر بن الخطاب: ابنا أمير المؤمنين، فأسلفكما، أديا المال وربحه. فأما عبد الله فسكت، وأما عبيد الله فقال: ما ينبغي لك يا أمير المؤمنين هذا، لو نقص المال أو هلك لضمناه. فقال عمر: أدياه. فسكت عبد الله، وراجعه عبيد الله. فقال رجل من جلساء عمر: يا أمير المؤمنين، لو جعلته قراضا. فقال عمر: قد جعلته قراضا. فأخذ عمر رأس المال ونصف ربحه، وأخذ عبد الله وعبيد الله نصف ربح المال. {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.222}"
