label: { ar: "الموطأ 2007 — مالك عن زيد بن أسلم عن أبيه: خرج عبد الله وعبيد الله ابنا عمر في جيش إلى العراق، فلقيا أبا موسى الأشعري أمير البصرة، فعرض عليهما أن يسلفهما مالا يبتاعان به متاعا يبيعانه بالمدينة، فيؤديان رأس المال إلى أمير المؤمنين والربح لهما، فلما قدما قال عمر: أكل الجيش أسلفه مثل ما أسلفكما؟ فجعله قراضا، فأخذ رأس المال ونصف الربح", en: "Muwatta 2007", es: "Muwatta 2007", fr: "Muwatta 2007", ur: "موطا 2007", tr: "El-Muvatta 2007 — Malik, Zeyd ibn Aslam'dan, o da babasından rivayet eder: Ömer'in oğulları Abdullah ve Ubeydullah, bir orduyla Irak'a gittiler. Basra valisi Ebu Musa el-Eş'ari ile karşılaştılar. Ebu Musa el-Eş'ari, Medine'de satmak üzere mal satın almaları için onlara para ödünç vermeyi teklif etti. Daha sonra sermayeyi Müminlerin Emiri'ne geri vereceklerdi ve kâr onların olacaktı. Geri döndüklerinde Ömer, \"Bütün orduya size verdiğim miktarın aynısını mı verdim?\" dedi. Böylece kâr paylaşımı (kırad) anlaşması yaptı; sermayenin yarısını ve kârın yarısını aldı.", id: "Al-Muwatta 2007 — Malik, berdasarkan riwayat Zayd ibn Aslam, berdasarkan riwayat ayahnya: Abdullah dan Ubaydullah, putra Umar, pergi bersama pasukan ke Irak. Mereka bertemu Abu Musa al-Ash'ari, gubernur Basra, yang menawarkan untuk meminjamkan mereka uang untuk membeli barang dagangan untuk dijual di Madinah. Mereka kemudian akan mengembalikan modal kepada Amirul Mukminin, dan keuntungannya akan menjadi milik mereka. Ketika mereka kembali, Umar berkata: \"Apakah aku meminjamkan seluruh pasukan dengan jumlah yang sama seperti yang kupinjamkan kepadamu?\" Maka ia membuat kesepakatan bagi hasil (qirad), mengambil modal dan setengah dari keuntungannya." }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن أبيه أنه قال: خرج عبد الله وعبيد الله ابنا عمر بن الخطاب في جيش إلى العراق، فلما قفلا مرا على أبي موسى الأشعري، وهو أمير البصرة، فرحب بهما وسهل، ثم قال: لو أقدر لكما على أمر أنفعكما به لفعلت. ثم قال: بلى، هاهنا مال من مال الله أريد أن أبعث به إلى أمير المؤمنين، فأسلفكماه، فتبتاعان به متاعا من متاع العراق، ثم تبيعانه بالمدينة، فتؤديان رأس المال إلى أمير المؤمنين ويكون الربح لكما. فقالا: وددنا. ففعل، وكتب إلى عمر بن الخطاب أن يأخذ منهما المال. فلما قدما باعا فأربحا. فلما دفعا ذلك إلى عمر، قال: أكل الجيش أسلفه مثل ما أسلفكما؟ قالا: لا. فقال عمر بن الخطاب: ابنا أمير المؤمنين، فأسلفكما، أديا المال وربحه. فأما عبد الله فسكت، وأما عبيد الله فقال: ما ينبغي لك يا أمير المؤمنين هذا، لو نقص المال أو هلك لضمناه. فقال عمر: أدياه. فسكت عبد الله، وراجعه عبيد الله. فقال رجل من جلساء عمر: يا أمير المؤمنين، لو جعلته قراضا. فقال عمر: قد جعلته قراضا. فأخذ عمر رأس المال ونصف ربحه، وأخذ عبد الله وعبيد الله نصف ربح المال. {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.222}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da babasından rivayet ederek şöyle demiştir: Ömer ibn el-Hattab'ın oğulları Abdullah ve Ubeydullah, bir orduyla Irak'a gittiler. Dönüş yolunda Basra valisi Ebu Musa el-Eş'ari'nin yanından geçtiler. Ebu Musa el-Eş'ari onları sıcak bir şekilde karşıladı ve \"Size fayda sağlayacak bir şey yapabilseydim yapardım\" dedi. Sonra şöyle devam etti: \"Evet, işte devlet hazinesinden bir miktar para var, bunu Müminlerin Emiri'ne göndermek istiyorum. Bunu size ödünç vereceğim, böylece Irak'tan mal alıp Medine'de satabilir ve anaparayı Müminlerin Emiri'ne geri verebilirsiniz, kâr sizin olur.\" Onlar da \"Bunu isteriz\" dediler. Bunun üzerine Ebu Musa el-Hattab'a parayı onlardan alması için mektup yazdı. Geldiklerinde malları sattılar ve kâr ettiler. Parayı Ömer'e verdiklerinde, Ömer, \"Ordunun tamamına da size verdiği kadar para verdi mi?\" diye sordu. Onlar, \"Hayır\" dediler. Ömer ibn el-Hattab, \"Siz Müminlerin Emiri'nin oğullarısınız, o size parayı verdi. Anaparayı ve kârı geri verin\" dedi. Abdullah sessiz kaldı, ancak Ubeydullah, \"Bu doğru değil, ey Müminlerin Emiri. Eğer para azalır veya kaybolursa, bundan biz sorumlu oluruz\" dedi. Bunun üzerine Ömer, \"Ödeyin\" dedi. Abdullah yine sessiz kaldı, ancak Ubeydullah onu daha da sıkıştırdı. Ömer'in arkadaşlarından biri, \"Ey Müminlerin Emiri, neden kâr paylaşımı yapmıyorsunuz?\" dedi. Ömer, \"Kâr paylaşımı yaptım\" diye cevap verdi. Böylece Ömer anaparayı ve kârın yarısını aldı, Abdullah ve Ubeydullah da diğer yarısını aldılar. {cite:muwatta-maruf-1997 s.221} {cite:muwatta-maruf-1997 s.222}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, yang juga dari ayahnya, bahwa ia berkata: Abdullah dan Ubaydullah, putra-putra Umar ibn al-Khattab, pergi ke Irak dengan pasukan. Ketika mereka kembali, mereka melewati Abu Musa al-Ash'ari, yang merupakan gubernur Basra. Ia menyambut mereka dengan hangat dan berkata, \"Jika saya dapat melakukan sesuatu untuk memberi manfaat kepada kalian, saya akan melakukannya.\" Kemudian ia berkata, \"Ya, ini ada sejumlah uang dari kas negara yang ingin saya kirimkan kepada Amirul Mukminin. Saya akan meminjamkannya kepada kalian agar kalian dapat membeli barang-barang dari Irak dengannya, kemudian menjualnya di Madinah, dan mengembalikan pokoknya kepada Amirul Mukminin, dan keuntungannya akan menjadi milik kalian.\" Mereka berkata, \"Kami menginginkannya.\" Maka ia melakukan seperti yang diperintahkan dan menulis surat kepada Umar ibn al-Khattab untuk mengambil uang itu dari mereka. Ketika mereka tiba, mereka menjual barang-barang tersebut dan memperoleh keuntungan. Ketika mereka memberikan uang itu kepada Umar, dia berkata, \"Apakah dia meminjamkan seluruh pasukan dengan jumlah yang sama seperti yang dia pinjamkan kepada kalian?\" Mereka menjawab, \"Tidak.\" Umar ibn al-Khattab berkata, \"Kalian adalah putra-putra Amirul Mukminin, jadi dia meminjamkan uang kepada kalian. Kembalikan pokok dan keuntungannya.\" Abdullah tetap diam, tetapi Ubaydullah berkata, \"Ini tidak benar, wahai Amirul Mukminin. Jika uang itu berkurang atau hilang, kami akan bertanggung jawab atasnya.\" Kemudian Umar berkata, \"Bayarlah.\" Abdullah tetap diam, tetapi Ubaydullah mendesaknya lebih lanjut. Seorang dari sahabat Umar berkata, \"Wahai Amirul Mukminin, mengapa Anda tidak membuat perjanjian bagi hasil?\" Umar menjawab, \"Saya telah membuat perjanjian bagi hasil.\" Maka Umar mengambil modal dan setengah dari keuntungan, dan Abdullah dan Ubaydullah mengambil setengahnya lagi. {kutip:muwatta-maruf-1997 hal.221} {kutip:muwatta-maruf-1997 hal.222}"
