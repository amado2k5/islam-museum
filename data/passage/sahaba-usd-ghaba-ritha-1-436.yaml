text: "… على فراقهم. وكان الخطاب عَمَّ زيد وأخاه لأمه ؛ كان عمرو بن نفيل قد خلف على أم الخطاب بعد أبيه نفيل، فولدت له زَيْدَ بن عمرو، وتوفي زيد قبل مبعث النبي عليله، فرثاه ورقة بن نوفل : رَشِدتَ وأنعمت ابنَ …"
summary:
  ar: "مقطع من أُسد الغابة في معرفة الصحابة، المجلد المصوَّر 1، ص 436، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Usd al-Ghaba fi Ma'rifat al-Sahaba, scan volume 1, p. 436, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "اُسد الغابہ فی معارف الصحابہ، اسکین جلد 1، ص 436 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Usd al-Ghaba fi Ma'rifat al-Sahaba, volume numérisé 1, p. 436, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Usd al-Ghaba fi Ma'rifat al-Sahaba, volumen escaneado 1, p. 436, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Usd al-Ghaba fi Ma'rifat al-Sahaba (Sahabelerin Bilgisine Göre Orman Aslanları) adlı eserin 1. Resimli Cildinin 436. sayfasından, vefat etmiş bir kişi için yazılmış ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Usd al-Ghaba fi Ma'rifat al-Sahaba (Singa-Singa Hutan dalam Pengetahuan Para Sahabat), Jilid Bergambar 1, hlm. 436, berisi elegi dan pujian untuk orang yang telah meninggal; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan pujian paling terkenal."
