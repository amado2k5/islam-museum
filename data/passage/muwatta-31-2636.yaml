label: { ar: "الموطأ 2636 — حميد بن عبد الرحمن بن عوف: رجل يطلب كلمات يعيش بهن فقال لا تغضب", en: "Muwatta 2636", es: "Muwatta 2636", fr: "Muwatta 2636", ur: "موطا 2636", tr: "El-Muvatta 2636 — Humaid bin Abdul Rahman bin Awf: Bir adam yaşamak için sözler istedi ve o da, “Öfkelenme” dedi.", id: "Al-Muwatta 2636 — Humaid bin Abdul Rahman bin Awf: Seorang pria meminta petunjuk hidup, dan dia berkata, “Jangan marah.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف أن رجلا أتى رسول الله فقال: علمني كلمات أعيش بهن، ولا تكثر علي فأنسى. فقال رسول الله: لا تغضب. {cite:muwatta-maruf-1997 p.492}"
  tr: "Malik, İbn Şihab'dan, o da Humaid ibn Abdülrahman ibn Avf'tan rivayet ettiğine göre, bir adam Resulullah'ın yanına gelip şöyle dedi: \"Bana yaşamama vesile olacak sözler öğret, fakat çok fazla olmasın ki unutmayayım.\" Resulullah şöyle buyurdu: \"Öfkelenme.\" {cite:muwatta-maruf-1997 s.492}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Humaid ibn Abd al-Rahman ibn Awf, bahwa seorang laki-laki datang kepada Rasulullah dan berkata: Ajari aku kata-kata yang dapat membuatku hidup, tetapi jangan terlalu banyak agar aku tidak lupa. Rasulullah bersabda: Janganlah kamu marah. {cite:muwatta-maruf-1997 p.492}"
