summary:
  ar: "القسم 3 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأذان والسنة فيها»، ويضم فيها النصوص من 706 إلى 734 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 3 of Sunan Ibn Majah (The Book of the Adhan and the Sunnah Regarding It) in the division of the open hadith dataset the museum took its reports from: reports 706 to 734 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 3، عنوان «کتاب الاذان والسنۃ فیہا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 706 تا 734۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 3 de Sunan Ibn Majah (El Libro del Adhan y la Sunnah al respecto) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 706 a 734 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du recueil ouvert Sunan Ibn Majah (Livre de l'Adhan et de la Sunna s'y rapportant), dans sa partie 706 à 734. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan İbn Majah'ın 3. bölümü \"Ezan Kitabı ve İçindeki Sünnet\" başlığını taşımakta olup, 706'dan 734'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 3 dari Sunan Ibn Majah, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Adzan dan Sunnah di Dalamnya,\" dan berisi teks 706 hingga 734, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
