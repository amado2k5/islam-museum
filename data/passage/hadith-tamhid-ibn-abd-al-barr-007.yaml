text: "هل هم مكلفون أو غير مكلفين. ليس بنا حاجة إلى ذكر شيء من ذلك في كتابنا هذا. لأنه ليس بموضع ذلك. وهم عند الجماعة مكلفون مخاطبون لقوله تعالى : (يا معشر الجن والإنس) وقوله تعالى : (فبأي آلاء ربكما تكذبان)."
