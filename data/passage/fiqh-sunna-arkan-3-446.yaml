text: "… قريبه المسلم - فإن قتل هو أومات ولم يرجع إلى الإسلام، انتقل ماله إلى ورثته من المسلمين لأنه في حكم الميت من وقت الردة. وقد أتي على بن أبي طالب بشيخ كان نصرانيًا فأسلم، ثم ارتد عن الإسلام، فقال له …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 446، يذكر تعريف الإسلام بأعماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 3, p. 446, that mentions Islam defined by its acts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 3، ص 446 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
