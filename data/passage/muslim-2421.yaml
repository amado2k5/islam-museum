label: { ar: "مسلم 2421 — اللهم إني أحبه فأحبه وأحبب من يحبه", en: "Muslim 2421 — O God, I love him, so love him", es: "Musulmán 2421 — Oh Dios, yo lo amo, así que ámalo.", fr: "Muslim 2421 — Ô Dieu, je l'aime, aimez-le donc", ur: "مسلم 2421 - اے اللہ میں اس سے محبت کرتا ہوں پس بھی اس سے محبت کر", tr: "Müslim 2421 — Ey Allah'ım, ben onu seviyorum, öyleyse sen de onu sev ve onu sevenleri sev.", id: "Muslim 2421 — Ya Allah, aku mencintainya, maka cintailah dia dan cintailah orang-orang yang mencintainya." }
text: "قال رسول الله للحسن: «اللهم إني أحبه فأحبه وأحبب من يحبه»؛ وروى البراء أنه رأى الحسن بن علي على عاتق النبي وهو يقول ذلك"
summary:
  ar: "رواية أبي هريرة والبراء بن عازب في باب فضائل الحسن والحسين من صحيح مسلم؛ دعاء النبي للحسن بالمحبة وحمله على العاتق — نص المحبة النبوية للسبطين."
  tr: "Sahih Müslim'de Hasan ve Hüseyin'in faziletleri bölümünde Ebu Hurayra ve Bara bin Azib'in rivayeti; Peygamber'in Hasan için sevgiyle dua etmesi ve onu omzunda taşıması - Peygamber'in iki torununa olan sevgisinin metni."
  id: "Riwayat Abu Hurayrah dan Al-Bara’ bin Azib dalam bab tentang keutamaan Al-Hasan dan Al-Husayn dari Sahih Muslim; doa Nabi untuk Al-Hasan dengan penuh kasih sayang dan menggendongnya di pundak — teks tentang kasih sayang Nabi kepada kedua cucunya."
