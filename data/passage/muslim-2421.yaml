text: "قال رسول الله للحسن: «اللهم إني أحبه فأحبه وأحبب من يحبه»؛ وروى البراء أنه رأى الحسن بن علي على عاتق النبي وهو يقول ذلك"
summary:
  ar: "رواية أبي هريرة والبراء بن عازب في باب فضائل الحسن والحسين من صحيح مسلم؛ دعاء النبي للحسن بالمحبة وحمله على العاتق — نص المحبة النبوية للسبطين."
