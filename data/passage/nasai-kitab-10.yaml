  ar: "سنن النسائي، كتاب الإمامة"
  en: "Sunan al-Nasa'i, Book 10: The Book of Leading the Prayer (Al-Imamah)"
  ur: "سنن نسائی، کتاب الامامۃ"
  es: "Sunan al-Nasa'i, Libro 10: El Libro de la Dirección de la Oración (Al-Imamah)"
summary:
  ar: "القسم 10 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإمامة»، ويضم فيها النصوص من 777 إلى 875 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 10 of Sunan al-Nasa'i (The Book of Leading the Prayer (Al-Imamah)) in the division of the open hadith dataset the museum took its reports from: reports 777 to 875 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 10، عنوان «کتاب الامامۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 777 تا 875۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 10 de Sunan al-Nasa'i (El Libro de la Oración (Al-Imamah)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 777 al 875, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
