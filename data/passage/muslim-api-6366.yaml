text: "‏\"‏ اللَّهُمَّ ثَبِّتْهُ وَاجْعَلْهُ هَادِيًا مَهْدِيًّا ‏\"‏ ‏.‏ قَالَ فَانْطَلَقَ فَحَرَّقَهَا بِالنَّارِ ثُمَّ بَعَثَ جَرِيرٌ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم رَجُلاً يُبَشِّرُهُ يُكْنَى أَبَا أَرْطَاةَ مِنَّا فَأَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ لَهُ مَا جِئْتُكَ حَتَّى تَرَكْنَاهَا كَأَنَّهَا جَمَلٌ أَجْرَبُ ‏.‏ فَبَرَّكَ رَسُولُ اللَّهِ صلى الله عليه وسلم عَلَى خَيْلِ أَحْمَس …"
summary:
  ar: "في صحيح مسلم؛ إرسال كتاب أو رسالة إلى طرف."
