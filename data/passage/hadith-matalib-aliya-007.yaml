text: "ى يرتفع بها إلى الحسن. فقد رواه أحمد (٢٤١/٥)؛ وابن أبي عاصم في كتاب السنة (٤٩٠/٢ : ١٠٢١)؛ والبزار (كما في كشف الأستار (١٦٤٩ :٢٥٧/٢)؛ والطبراني في الكبير (٥٥ :٣٧/٢٠)، من طرق عن ابن لهيعة، عن الحارث بن يزيد، عن"
