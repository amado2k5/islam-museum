text: "… هذه القصة فقال رجل: ما الحطيم؟ فقال ابن عباس: إنه لا حطيم، كان الرجل... إلخ زاد أبو نعيم في المستخرج من طريق خالد الطحان عن مطرف فإن أهل الجاهلية كانوا يسمونه - أي الحجر - الحطيم، كانت فيه أصنام قريش، …"
