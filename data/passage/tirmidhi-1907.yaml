label:
  ar: "الترمذي 1907 — الرحم: من وصلك وصلته ومن قطعك قطعته"
  en: "Tirmidhi 1907 — Kinship: whoever joins you I join, whoever cuts you I cut"
  ur: "ترمذی 1907 — رشتہ داری: جو تجھے جوڑے میں اسے جوڑوں، جو تجھے کاٹے میں اسے کاٹوں"
text: "قال الله أنا الله وأنا الرحمن خلقت الرحم وشققت لها من اسمي فمن وصلها وصلته ومن قطعها بتته . وفي الباب عن أبي سعيد وابن أبي أوفى وعامر بن ربيعة وأبي هريرة وجبير بن مطعم . قال أبو عيسى حديث …"
summary:
  ar: "حديث قدسي في جامع الترمذي، رقم 1907: الرحم: من وصلك وصلته ومن قطعك قطعته. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Jami al-Tirmidhi, no. 1907: Kinship: whoever joins you I join, whoever cuts you I cut. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "جامع ترمذی میں حدیثِ قدسی، نمبر 1907: رشتہ داری: جو تجھے جوڑے میں اسے جوڑوں، جو تجھے کاٹے میں اسے کاٹوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
