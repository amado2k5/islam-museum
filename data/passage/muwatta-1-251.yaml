label: { ar: "الموطأ 251 — مالك: سجود النقصان قبل السلام وسجود الزيادة بعده", en: "Muwatta 251", es: "Muwatta 251", fr: "Muwatta 251", ur: "موطا 251", tr: "Al-Muwatta 251 — Malik: Eksiklik secdesi selamlamadan önce, fazlalık secdesi ise selamlamadan sonra yapılır.", id: "Al-Muwatta 251 — Malik: Sujud kekurangan dilakukan sebelum salat dan sujud kelebihan dilakukan setelah salat." }
summary:
  ar: "قول لمالك في باب ما يفعل من سلم من ركعتين ساهياً: كل سهو كان نقصاناً من الصلاة فسجوده قبل السلام، وكل سهو كان زيادة في الصلاة فسجوده بعد السلام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.149}"
  tr: "Malik, iki rekat namazdan sonra son selamı yanlışlıkla söylemenin ne yapılması gerektiği konusunda şöyle buyurmuştur: Namazda eksikliğe yol açan her hata için, son selamdan önce unutma secdesi yapılır; namaza fazlalık getiren her hata için ise, son selamdan sonra unutma secdesi yapılır. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.149}"
  id: "Malik berkata, mengenai apa yang harus dilakukan jika seseorang keliru mengucapkan salam penutup setelah dua rakaat: Untuk setiap kesalahan yang mengakibatkan kekurangan dalam salat, sujud lupa dilakukan sebelum salam penutup; untuk setiap kesalahan yang mengakibatkan penambahan dalam salat, sujud lupa dilakukan setelah salam penutup. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.149}"
