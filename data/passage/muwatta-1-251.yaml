summary:
  ar: "قول لمالك في باب ما يفعل من سلم من ركعتين ساهياً: كل سهو كان نقصاناً من الصلاة فسجوده قبل السلام، وكل سهو كان زيادة في الصلاة فسجوده بعد السلام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.149}"
