label: { ar: "الموطأ 557 — أبو سعيد: والذي نفسي بيده إنها لتعدل ثلث القرآن", en: "Muwatta 557", es: "Muwatta 557", fr: "Muwatta 557", ur: "موطا 557", tr: "El-Muvatta 557 — Ebu Said: Canım elinde olan Allah'a yemin ederim ki, bu Kur'an'ın üçte birine denktir.", id: "Al-Muwatta 557 — Abu Saeed: Demi Dia yang jiwaku berada di tangan-Nya, itu setara dengan sepertiga Al-Qur'an." }
text: "والذي نفسي بيده، إنها لتعدل ثلث القرآن"
summary:
  ar: "أول حديث في باب ما جاء في قراءة سورة الإخلاص وسورة الملك. يرويه مالك عن عبد الرحمن بن عبد الله بن أبي صعصعة عن أبيه عن أبي سعيد الخدري، أنه سمع رجلاً يقرأ سورة الإخلاص [[passage/quran-112-1|الإخلاص]] يرددها، فلما أصبح غدا إلى النبي فذكر ذلك له وكأنه يتقالّها، فأقسم النبي أنها تعدل ثلث القرآن. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسماعيل بن أبي أويس عند البخاري (7374)، والقعنبي عند البخاري (6643)، والتنيسي عند البخاري (5013)، وقتيبة عند النسائي، وأن الدارقطني تناول في العلل اختلاف روايته عن أبي سعيد عن النبي أو عن أخيه قتادة بن النعمان، وأن ابن عبد البر يرى أن أبا سعيد وقتادة سمعاه جميعاً من النبي. {cite:muwatta-maruf-1997 p.285} {cite:muwatta-maruf-1997 p.286}"
  tr: "İhlas Suresi ve Mülk Suresi'nin tilavetiyle ilgili rivayetler bölümündeki ilk hadis, Malik'in Abdurrahman ibn Abdullah ibn Abi Sa'sa'ah'tan, onun babasından, onun da Ebu Sa'id el-Hudri'den rivayet ettiğine göre, bir adamın İhlas Suresi'ni tekrar tekrar okuduğunu işittiği, sabah olunca Peygamber'in yanına gidip bunu ona anlattığı, sanki önemsiz bir şeymiş gibi davrandığı, Peygamber'in ise bunun Kur'an'ın üçte birine denk olduğuna yemin ettiği hadistir. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab ve İsmail ibn Abi Uveys tarafından Buhari'de (7374), El-Ka'nebi tarafından Buhari'de (6643), At-Tunisi tarafından Buhari'de (5013) ve Kuteybe tarafından En-Nesai'de rivayet edildiğini belirtmektedir. Ad-Daraqutni, \"Al-'Ilal\" adlı kitabında, bu hadisin Ebu Sa'id'den mi yoksa kardeşi Katade ibn An-Nu'man'dan mı rivayet edildiği konusundaki farklılığı tartışmış ve İbn Abd Al-Barr'ın hem Ebu Sa'id'in hem de Katade'nin bunu Peygamber'den işittiğine inandığını belirtmiştir. {cite:muwatta-maruf-1997 s.285} {cite:muwatta-maruf-1997 s.286}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai bacaan Surah Al-Ikhlas dan Surah Al-Mulk. Diriwayatkan oleh Malik dari Abdur-Rahman ibn Abdullah ibn Abi Sa'sa'ah, dari ayahnya, dari Abu Sa'id Al-Khudri, bahwa ia mendengar seorang laki-laki membaca Surah Al-Ikhlas berulang-ulang. Ketika pagi tiba, ia pergi kepada Nabi dan menceritakan hal itu kepadanya, seolah-olah ia menganggapnya tidak penting. Nabi bersumpah bahwa bacaan itu setara dengan sepertiga Al-Quran. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Isma'il ibn Abi Uways dalam Bukhari (7374), Al-Qa'nabi dalam Bukhari (6643), At-Tunisi dalam Bukhari (5013), dan Qutaybah dalam An-Nasa'i. Ad-Daraqutni dalam bukunya \"Al-'Ilal\" membahas perbedaan riwayatnya antara Abu Sa'id yang berdasarkan Nabi atau dari saudaranya Qatadah ibn An-Nu'man, dan bahwa Ibnu Abd Al-Barr meyakini bahwa baik Abu Sa'id maupun Qatadah mendengarnya dari Nabi. {cite:muwatta-maruf-1997 p.285} {cite:muwatta-maruf-1997 p.286}"
