label: { ar: "الموطأ 557 — أبو سعيد: والذي نفسي بيده إنها لتعدل ثلث القرآن", en: "Muwatta 557" }
text: "والذي نفسي بيده، إنها لتعدل ثلث القرآن"
summary:
  ar: "أول حديث في باب ما جاء في قراءة سورة الإخلاص وسورة الملك. يرويه مالك عن عبد الرحمن بن عبد الله بن أبي صعصعة عن أبيه عن أبي سعيد الخدري، أنه سمع رجلاً يقرأ سورة الإخلاص [[passage/quran-112-1|الإخلاص]] يرددها، فلما أصبح غدا إلى النبي فذكر ذلك له وكأنه يتقالّها، فأقسم النبي أنها تعدل ثلث القرآن. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسماعيل بن أبي أويس عند البخاري (7374)، والقعنبي عند البخاري (6643)، والتنيسي عند البخاري (5013)، وقتيبة عند النسائي، وأن الدارقطني تناول في العلل اختلاف روايته عن أبي سعيد عن النبي أو عن أخيه قتادة بن النعمان، وأن ابن عبد البر يرى أن أبا سعيد وقتادة سمعاه جميعاً من النبي. {cite:muwatta-maruf-1997 p.285} {cite:muwatta-maruf-1997 p.286}"
