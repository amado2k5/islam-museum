summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في صلاة الجماعة: قام نافع وراء عبد الله بن عمر في صلاة وليس معه أحد غيره، فأشار إليه ابن عمر بيده فجعله حذاءه عن يمينه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.195}"
