label: { ar: "الموطأ 356 — ابن عمر يجعل المأموم الواحد عن يمينه", en: "Muwatta 356", es: "Muwatta 356", fr: "Muwatta 356", ur: "موطا 356", tr: "El-Muvatta 356 — İbn Ömer tek takipçisini sağ tarafına yerleştirir.", id: "Al-Muwatta 356 — Ibnu Umar menempatkan pengikut tunggal di sebelah kanannya" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في صلاة الجماعة: قام نافع وراء عبد الله بن عمر في صلاة وليس معه أحد غيره، فأشار إليه ابن عمر بيده فجعله حذاءه عن يمينه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.195}"
  tr: "Malik'in Nafi'den rivayet ettiği, cemaat namazı sırasındaki davranışlar bölümünde yer alan bir rivayete göre: Nafi', namazda Abdullah ibn Umar'ın arkasında duruyordu ve başka kimse yoktu. İbn Umar eliyle ona işaret etti, bunun üzerine Nafi'yi sağ tarafına, yanına oturttu. Editör, bu rivayetin Malik'ten Ebu Mus'ab ve Suwaid tarafından nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.195}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Nafi’, dalam bab tentang amalan-amalan dalam salat berjamaah: Nafi’ berdiri di belakang Abdullah ibn Umar dalam salat, tanpa ada orang lain di dekatnya. Ibn Umar memberi isyarat kepadanya dengan tangannya, lalu ia menempatkan Nafi’ di sampingnya di sebelah kanannya. Editor menyebutkan bahwa Abu Mus’ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.195}"
