  fr: "Un extrait de l'Histoire de Damas d'Ibn Asakir (tome 2, p. 89) évoque la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
