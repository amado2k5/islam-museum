text: "… أحداً، وكان نازِلًا. في بني أمية بن زيد بالعالية حين تحول من قُباء، ومعه زوجته أمُّ سَلَمَةِ بنت أبي أمية، فجرُح بأحد جُرْحاً على عَضُدِة فرجع إلى منزله فقام شهراً يُدَاوَى حتى رأى ان قد برأ، فلما كان هلال المحرم …"
