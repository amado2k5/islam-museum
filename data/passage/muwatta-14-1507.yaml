label: { ar: "الموطأ 1507 — يحيى بن سعيد عن سعيد بن المسيب: قضى عمر بن الخطاب أنه إذا أرخيت الستور فقد وجب الصداق", en: "Muwatta 1507", es: "Muwatta 1507", fr: "Muwatta 1507", ur: "موطا 1507", tr: "El-Muvatta 1507 — Yahya ibn Sa’id, Sa’id ibn al-Musayyab’dan rivayetle: Ömer ibn al-Khattab, perdeler indirilirse mehirin ödenmesi gerektiğine hükmetmiştir.", id: "Al-Muwatta 1507 — Yahya ibn Sa’id berdasarkan riwayat Sa’id ibn al-Musayyab: Umar ibn al-Khattab memutuskan bahwa jika tirai diturunkan, maka mahar wajib dibayarkan." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن عمر بن الخطاب قضى في المرأة إذا تزوجها الرجل، أنه إذا أرخيت الستور فقد وجب الصداق. {cite:muwatta-maruf-1997 p.33}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle, Ömer ibn al-Khattab'ın, bir erkeğin evlendiği kadın hakkında, perdeler indirilirse mehirin ödenmesi gerektiğine hükmettiğini nakletmiştir. {cite:muwatta-maruf-1997 s.33}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa Umar ibn al-Khattab menetapkan hukum mengenai seorang wanita yang dinikahi seorang pria, bahwa jika tirai diturunkan, maka mahar menjadi wajib dibayarkan. {cite:muwatta-maruf-1997 p.33}"
