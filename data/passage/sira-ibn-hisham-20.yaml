text: "يسموه لي باسمه الذي سماه به وهب بن منبه، قالوا: رجل نزلها - ابتني خيمة بين نجران وبين تلك القرية التي بها الساحر، فجعل اهل نجران يرسلون غلمانهم الي ذلك الساحر يعلمهم السحر، فبعث اليه الثامر ابنه عبدالله بن الثامر مع غلمان"
