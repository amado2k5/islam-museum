text: "باب ما جري بعد الفتح في الكنز الذي كتموه واصطفاء صفية بنت حيي، وقسمة الغنيمة والخمس علي طريق الاختصار، فقد مضي في كتاب السنن ما احتجنا اليه من ذلك ، وفي ذلك تصديق وعد اللاه عز وجل رسوله وتصديق اللاه عز وجل"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، في مراسلات ملوك اليمن، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dalail al-Nubuwwa, in the correspondence with the kings of Yemen, from the extracted copy; quoted within forty words per the sources policy."
