  fr: "Extrait du Dalail al-Nubuwwa d'al-Bayhaqi, dans la correspondance avec les rois du Yémen, tiré de la copie extraite; cité en quarante mots conformément à la politique des sources."
  ur: "البیحقی کی دلائل النبوۃ سے ایک اقتباس، یمن کے بادشاہوں کے ساتھ خط و کتابت میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
