text: "… ياشريح. ولحديث: الإسلام يعلو ولا يعلى التسوية بين الأولاد في العطية : - اختلف العلماء في وجوب التسوية بين الأولاد في العطية. فذهب الحنفية والمالكية والشافعية إلى أن التسوية بينهم في العطايا مستحبة، وليست واجبة. لأن الصديق فضل عائشةا على …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 2، ص 363، يرد فيه ذكر الواجب، والوجوب، والمستحب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 2, p. 363, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mustahabb), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 2، ص 363 کا اقتباس جس میں واجب، وجوب، مستحب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 2, p. 363, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mustahabb), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 2, p. 363, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mustahabb), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
