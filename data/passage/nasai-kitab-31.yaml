summary:
  ar: "القسم 31 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النحل»، ويضم فيها النصوص من 3672 إلى 3687 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 31 of Sunan al-Nasa'i (The Book of Presents) in the division of the open hadith dataset the museum took its reports from: reports 3672 to 3687 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 31، عنوان «کتاب النحل»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3672 تا 3687۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 31 de Sunan al-Nasa'i (El Libro de los Presentes) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3672 al 3687, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan al-Nasa'i (Livre des présents), volume 31, qui correspond aux hadiths 3672 à 3687 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
