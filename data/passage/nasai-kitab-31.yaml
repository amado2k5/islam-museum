  ar: "سنن النسائي، كتاب النحل"
  en: "Sunan al-Nasa'i, Book 31: The Book of Presents"
  ur: "سنن نسائی، کتاب النحل"
  es: "Sunan al-Nasa'i, Libro 31: El Libro de los Presentes"
