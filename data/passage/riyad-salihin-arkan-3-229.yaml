text: "… إِسباغُ الوُضُوءِ على المكَارِهِ وكَفْرَةُ الخُطَا إلى المساجِدِ، وانْتِظَارُ الصَّلاةِ بعْد الصَّلاةِ، فَذِلِكُمُ الرِّبَاطُ، فذلِكُمُ الرِّبّاطُ رواء مسلم - وعَنْ أَبِي مَالكِ الأَشْعرِيِّ قَال : قال رسُولُ اللَّهِ لَلِام : الطُّهُورُ شَطْرُ الإيمانِ رواء مسلم. وقد سبق بطوله في باب …"
