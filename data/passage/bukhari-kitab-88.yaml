summary:
  ar: "القسم 88 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب استتابة المرتدين والمعاندين وقتالهم»، ويضم فيها النصوص من 6918 إلى 6939 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 88 of Sahih al-Bukhari (Apostates) in the division of the open hadith dataset the museum took its reports from: reports 6918 to 6939 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 88، عنوان «کتاب استتابۃ المرتدین والمعاندین وقتالہم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6918 تا 6939۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 88 de Sahih al-Bukhari (Apóstatas) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 6918 a 6939 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 88 du Sahih al-Bukhari (Les Apostats), dans la section du recueil ouvert: les hadiths 6918 à 6939 de cette section sont classés sous ce livre. Les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih el-Buhari'nin 88. bölümü, \"Mürtedlerin ve İman Karşıtı Olanların Tövbe ve Mücadele Kitabı\" başlığını taşımakta olup, sırasıyla 6918 ila 6939 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 88 dari Sahih al-Bukhari, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Taubat dan Perjuangan Melawan Kaum Murtad dan Orang-orang yang Menentang Iman,\" dan berisi teks 6918 hingga 6939, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
