text: "… ويدفعُ ريحَ السموم، ويفتَق الشهوة، الضعف، فأمره بأكل البيض. وفي ثبوته نظر، ويُختار ويحسِّن اللون، ويقطع البلغم، ويجلُو المعدة، وبزره غيره: مُحّ البيض: مسكن للألم، مملس للحلق العينين اكتحالاً يُكتحل ببزره مع العسل لبياض وقصبة الرئة، نافع للحلق والسعال وقُروح …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 698، يذكر الكحل، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 698, that mentions kohl for the eye, named diseases, the hospital and the medical craft, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
