text: "… أبي طالب في يوم أحد كلمة لعكرمة بن أبي جهل كلمة للأعشى التميمي كلمة لعبدالله بن الزبعرى صفية بنت عبد المطلب ترثي أخاها حمزة... نُعم بنت سعيد تبكي زوجها شماس بن عثمان.. أبو الحكم ابن سعيد يعزي أخته نعماً في …"
summary:
  ar: "مقطع من سيرة ابن إسحاق برواية ابن هشام، ص 710، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from The Sira of Ibn Ishaq in Ibn Hisham's recension, p. 710, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ابن ہشام کی تجدید میں ابن اسحاق کی سیرت، ص 710 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de La Sira d'Ibn Ishaq selon la recension d'Ibn Hisham, p. 710, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de La Sira de Ibn Ishaq en la recensión de Ibn Hisham, p. 710, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "İbn İshak'ın biyografisinden, İbn Hişam'ın rivayetine göre, 710. sayfada yer alan, merhum için bir ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari biografi Ibnu Ishaq, sebagaimana diriwayatkan oleh Ibnu Hisham, hlm. 710, berisi elegi dan pujian untuk almarhum; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
