text: "… عصر فهو مخدوش، وإن أراد استقراره فهو مة بول. وقد قال ابن الصباغ فى لكلام على ما نعى الزكاة: وإنما تاتاهم أبو بكر على منع الزكاة ولم يقل إنهم كفروا بذلك، وإنما لم يكفروا لان الإجماع لم يكن استقر. قال …"
summary:
