  id: "Cuplikan dari Fath al-Bari, Tafsir Sahih al-Bukhari, Jilid 3, halaman 743, berisi pidato penghormatan dan pengumuman kematian; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan pidato penghormatan dan pengumuman kematian yang paling terkenal."
