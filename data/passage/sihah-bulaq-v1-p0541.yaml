text: |-
  ١ أ ى يادغام البا-ز-نلهااه
  ٢ ى التهذيب اللبب من الرمل
  ما كان قريبا من حبل الرمل
  اد مر تضى
  ⁦(جب)⁩
  أى أنا مواجهك بماتحب اجاية لك والياء للتنفية وفيه ادليل على النصب المصدرونحر نذكر
  جنه على يلإنس فى باب المعتل ان شاء اللّٰه تعمالى والاب العقل وابهع الالباب وقد بم-ح على
  ألب كما جمع بؤس على أبؤس ونعم على أنعم قال أبوطالب قلبى اليه مشرف الالب
  وربما أظهروا التضعيف في ضرورة الشجر كماقال الكميت
  اليكم ذوى آل النبي تطلعت • نوازع من قلبى ظماء وألبب
  ويقال بنات ألبب عروق فى القلب يكون منها الرقة وقسل لاعراييسة نعائب ابنالها
  ماللّ لا تدعين عليه قالت تأبي له بنات ألببى وقال المبرد فى قول الشاعر
  قد علاتذالك بنات ألببه بريد بنات أعقل هذا الحىّ فان بعت أليداقلت ألايب والتصغير
  أليبب وهو أولى من قول من أعلها ١ اللبيب العاقل والجمع ألباء وقدليت يا رجل
  بالكسر تلب لباية أى صرت ذالب وحكى يونس بن حبيب لبيت بالضم وهو ناد ولا نظيرك
  فى المضاعف واب النخل قلبها وخااص كل شابه واب الجوز واللوزون وهسماء فى جوفه
  والبهع اللبوب تقول منه ألب الزرع مثل أحب اذادخل فيه الاكل وابب الحب تلبيبا
  أى صاره اب واللبية ثوب كالبقيرة ولييت الرجمل تلبيبا اذايجعت شيابه عند صدره وفحره
  فى الجصومة ثم بررته والحوب اللباب الخالص ومنه سحيت المرأة لباية واللية المنحر والهع
  الليبات وكذلك الليب وهوم وضع التلادة من المسدر من كل شئ والج-ع الالباب واللبب
  أيضاما يشد على صدر الداية والناقة يمنع الرحل من الاستخارتة ول منه ألبيت الداية
  فهو طلبب وهذا الخرف هكذارواه ابن السكيت وغيره ياظهار التضعيف قال ابن كيسان
  هوغلط وقياسه ملب كما يقال محب من أحببته ومنه قولهم فلان فى لبب رخى اذا كان
  فى حال واسعة قال الاجر اللبب ما استرق من الرمل لانّ معظمه العقنقل فاذا نقص قيسل
  كثيب فاذانص قبل عوكل فاذانقص قبل سقط قاذا نقص قيل عداب قاذانص قيل لبب
  قال ذوالرمة براقة الجيدواللبات واضحة ، كأنهاظبية أفضى بجهالبب ٢
  والله لاب ذيت يلتوى عسلى الشجر واللبلبة الرقة على الولد يقال لبلبت الشاة على ولدها اذا
  لحسسته وأسبات عليه حين تضعه ولبساب العُنم جلبته ا وأصواتها ورجل لب أى لازم للامر
  يقال رجل اب طب وأنشد أبو عمرو لباباعجاز المطى لاحقا وامرأق لبة قال أبو عبيد
  أى قرسة من الناس الطيفة ورجل لبيب مثلاب قال المضرّب بن كعب
  فقلت لهافيئ اليكفاننى • حرام واتى بعدذ الذليب أى مع ذالامقيم
  وقال بعض-م أراد ملب من التلبية وايبته لساضر بتلبته وتليب الرحدل أى تحزم وتشمر
  تب اللاتب النابت تقول منه لتب يلتب لتباوانوبا وأنتد أبوالجراح
  فان يك هذا من تبيذشربته • قانى من شرب النييذاتائب
  صداع وتوصيم العظام وفترة • وغم مع الاشراق فى الجوف لاتب
  واللائب أيضا اللازق مثل اللازب عن الاصحى ولتبت في مضر الناقة أى طعنت مثل
  لقمت ( لجب الطجب الدوت والحلبة تقول لحب بالكسر وجيش جب عرمرم أى ذوجلبة
  وكثرة ومحوذ ولحب اذا سمع اضطراب امواجه الاصحى اللحبة الشاة التى أتى عليها بعد نتاجها
  أربعة
