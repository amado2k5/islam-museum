text: "… ثنا محمد بن جعفر، حدثنا شعبة. قال: ثنا حجاج، قال: حدثني شعبة، قال: سمعت قتادة، يُحدِّث عن أنس بن مالك صه، قال: قال رسول اللّٰه ف: ثلاث مَن كنَّ فيه وَجَدَ طعمَ الإيمان: مَن كان يُحبُّ المرءَ لا يُحِبُّه إلَّا …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 600، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 600, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 600 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 600, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 600, évoquant la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
