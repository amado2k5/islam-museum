text: "… قال ابن هشام: قرأ أبو عَمْرو بن العَلاء: وَلَا نَقُولُواْ لِمَنْ أَلْقَى إِلَيْكُمُ السَّلَمَ لَسْتَ مُؤْمِنًا لهذا الحديث. قال ابن إسحاق: حَدَّثني محمد بن جعفر بن الزبير، قال: سَمِعْتُ زيادَ بن ضُمَيْرَةَ بن سَعْد السُّلَمي يحدث، عن عُرْوَةَ بن الزبير، …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 653، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
