label: { ar: "مسلم 2982 — الساعي على الأرملة والمسكين كالمجاهد في سبيل الله", en: "Muslim 2982 — One who serves the widow and the poor is like the fighter in God's path", es: "Muslim 2982 — Quien sirve a la viuda y al pobre es como el guerrero en el camino de Dios.", fr: "Muslim 2982 — Celui qui sert la veuve et le pauvre est comme un combattant sur le chemin de Dieu.", ur: "مسلم 2982 - بیواؤں اور غریبوں کی خدمت کرنے والا اللہ کی راہ میں لڑنے والے کی طرح ہے۔", tr: "Müslim 2982 — Dul ve fakirler için çabalayan, Allah yolunda savaşan gibidir.", id: "Muslim 2982 — Orang yang membela janda dan kaum fakir miskin sama seperti orang yang berperang di jalan Allah" }
text: "قال رسول الله: «الساعي على الأرملة والمسكين كالمجاهد في سبيل الله — وأحسبه قال — وكالقائم لا يفتر، وكالصائم لا يفطر»"
summary:
  ar: "رواية أبي هريرة في باب ثواب الساعي على الأرملة والمسكين من كتاب الزهد في صحيح مسلم؛ يعدل سعي الخدمة الاجتماعية بالجهاد وقيام الليل وصيام النهار."
  tr: "Sahih Müslim'deki İhtisas Kitabı'nda, dul ve fakirler için çaba gösterenin sevabı bölümünde Ebu Hurayra'nın rivayetine göre; sosyal hizmet çabası cihat, gece namazı ve gündüz oruç tutmakla eşdeğer tutulmuştur."
  id: "Riwayat Abu Hurairah dalam bab tentang pahala orang yang berbakti kepada janda dan fakir miskin dalam Kitab Khazighu dalam Sahih Muslim; usaha pelayanan sosial disamakan dengan jihad, shalat malam dan puasa siang."
