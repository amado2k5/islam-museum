label: { ar: "الموطأ 1898 — يحيى عن مالك: بلغه أن عمر بن الخطاب قال لا حكرة في سوقنا، فلا يعمد رجال بأيديهم فضول من أذهاب فيحتكروه على الناس، وأيما جالب جلب على عمود كبده فذلك ضيف عمر", en: "Muwatta 1898", es: "Muwatta 1898", fr: "Muwatta 1898", ur: "موطا 1898", tr: "El-Muvatta 1898 — Yahya, Malik'ten rivayetle: Ömer ibn el-Hattab'ın şöyle dediği kendisine ulaştı: \"Bizim pazarımızda istifçilik yoktur, bu yüzden kimse elinde fazla altınla halktan onu istiflemesin. Kim bir şey getirirse, pahalıya mal olsa bile, o Ömer'in misafiridir.\"", id: "Al-Muwatta 1898 — Yahya berdasarkan riwayat Malik: Telah sampai kepadanya bahwa Umar bin al-Khattab berkata: Tidak ada penimbunan di pasar kita, maka janganlah orang-orang yang memiliki kelebihan emas menimbunnya dari orang lain. Dan siapa pun yang membawa sesuatu, meskipun itu sangat mahal baginya, maka ia adalah tamu Umar." }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن عمر بن الخطاب قال: لا حكرة في سوقنا، لا يعمد رجال بأيديهم فضول من أذهاب إلى رزق من رزق الله نزل بساحتنا، فيحتازونه علينا، فيحتكرونه. ولكن أيما جالب جلب على عمود كبده في الشتاء والصيف، فذلك ضيف عمر، فليبع كيف شاء الله، وليمسك كيف شاء الله. {cite:muwatta-maruf-1997 p.179} {cite:muwatta-maruf-1997 p.180}"
  tr: "Yahya, Malik'ten rivayetle Ömer ibn el-Hattab'ın şöyle dediğini işittiğini aktarır: “Bizim pazarımızda tekel yoktur. Hiç kimse, Allah'ın bize verdiği rızkı ele geçirip saklamamalıdır. Fakat kim mal getirirse, kışın yazın pahalıya mal olsa bile, Ömer'in misafiridir. Allah dilediği gibi satsın, Allah dilediği gibi saklasın.” {cite:muwatta-maruf-1997 s.179} {cite:muwatta-maruf-1997 s.180}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar Umar bin al-Khattab berkata: “Tidak ada monopoli di pasar kita. Tidak seorang pun yang memiliki kekayaan berlebih boleh mengambil rezeki yang telah Allah berikan kepada kita dan menimbunnya. Tetapi siapa pun yang membawa barang, meskipun harganya mahal di musim dingin dan musim panas, adalah tamu Umar. Biarlah ia menjual sesuai kehendak Allah, dan biarlah ia menyimpan sesuai kehendak Allah.” {cite:muwatta-maruf-1997 p.179} {cite:muwatta-maruf-1997 p.180}"
