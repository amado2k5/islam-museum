label: { ar: "الموطأ 1898 — يحيى عن مالك: بلغه أن عمر بن الخطاب قال لا حكرة في سوقنا، فلا يعمد رجال بأيديهم فضول من أذهاب فيحتكروه على الناس، وأيما جالب جلب على عمود كبده فذلك ضيف عمر", en: "Muwatta 1898" }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن عمر بن الخطاب قال: لا حكرة في سوقنا، لا يعمد رجال بأيديهم فضول من أذهاب إلى رزق من رزق الله نزل بساحتنا، فيحتازونه علينا، فيحتكرونه. ولكن أيما جالب جلب على عمود كبده في الشتاء والصيف، فذلك ضيف عمر، فليبع كيف شاء الله، وليمسك كيف شاء الله. {cite:muwatta-maruf-1997 p.179} {cite:muwatta-maruf-1997 p.180}"
