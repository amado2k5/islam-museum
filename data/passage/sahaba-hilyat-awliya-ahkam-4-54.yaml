text: "… اتخذ طاعة اللّٰه تعالى تجارة تزيد بها ربح الدقيا والآخرة، والايمان بالله تعالى سفيفتك التى تحمل عليها، والتوكل على اللّٰه تعالى دقلها، والدنيا بحرك، والايام موجك، والاعمال المفروضة تجارتك التى ترجو بها ربحها، والنافلة هديتك التى تكرم بها، والحرص عليها …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 54، يرد فيه ذكر الفرض، وطاعة الله ورسوله، والنافلة والنوافل، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 54, whose wording mentions the obligatory (fard), obedience to God and His Messenger, the supererogatory (nafila), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 4، ص 54 کا اقتباس جس میں فرض، اللہ اور اس کے رسول کی اطاعت، نفل اور نوافل، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' de Abu Nu'aym, volume numérisé 4, p. 54, dont le texte mentionne l'obligatoire (fard), l'obéissance à Dieu et à Son Messager, le surérogatoire (nafila), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen digitalizado 4, p. 54, cuyo texto menciona lo obligatorio (fard), la obediencia a Dios y a Su Mensajero, lo supererogatorio (nafila), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
