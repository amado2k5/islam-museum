label: { ar: "الموطأ 827 — ابن عمر: نهى النبي عن الوصال؛ فقالوا: إنك تواصل؟ فقال: إني لست كهيئتكم، إني أطعم وأسقى", en: "Muwatta 827" }
text: "إني لست كهيئتكم، إني أُطعم وأُسقى"
summary:
  ar: "أول حديث في باب النهي عن الوصال في الصيام. يرويه مالك عن نافع عن عبد الله بن عمر، أن رسول الله نهى عن الوصال. فقالوا: يا رسول الله، فإنك تواصل؟ فقال: إني لست كهيئتكم، إني أُطعم وأُسقى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع عند أحمد، وسويد، والقعنبي عند أبي داود (2360)، والتنيسي عند البخاري (1962)، ويحيى بن يحيى النيسابوري عند مسلم، ويحيل على التمهيد (14/361). {cite:muwatta-maruf-1997 p.404}"
