label: { ar: "الموطأ 827 — ابن عمر: نهى النبي عن الوصال؛ فقالوا: إنك تواصل؟ فقال: إني لست كهيئتكم، إني أطعم وأسقى", en: "Muwatta 827", es: "Muwatta 827", fr: "Muwatta 827", ur: "موطا 827", tr: "El-Muvatta 827 — İbn Ömer: Peygamberimiz sürekli oruç tutmayı yasakladı; bunun üzerine şöyle dediler: \"Ama sen sürekli oruç tutuyorsun?\" O da şöyle buyurdu: \"Ben sizin gibi değilim, bana yemek verilir, içecek verilir.\"", id: "Al-Muwatta 827 — Ibn Umar: Nabi melarang berpuasa terus-menerus; lalu mereka bertanya: Tetapi engkau berpuasa terus-menerus? Beliau menjawab: Aku tidak seperti kalian, aku diberi makan dan minum" }
text: "إني لست كهيئتكم، إني أُطعم وأُسقى"
summary:
  ar: "أول حديث في باب النهي عن الوصال في الصيام. يرويه مالك عن نافع عن عبد الله بن عمر، أن رسول الله نهى عن الوصال. فقالوا: يا رسول الله، فإنك تواصل؟ فقال: إني لست كهيئتكم، إني أُطعم وأُسقى. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع عند أحمد، وسويد، والقعنبي عند أبي داود (2360)، والتنيسي عند البخاري (1962)، ويحيى بن يحيى النيسابوري عند مسلم، ويحيل على التمهيد (14/361). {cite:muwatta-maruf-1997 p.404}"
  id: "Hadits pertama dalam bab tentang larangan puasa terus-menerus (tanpa berbuka puasa saat matahari terbenam). Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, bahwa Rasulullah shalla Allahu alaihi wa sallam melarang puasa terus-menerus. Mereka bertanya, “Wahai Rasulullah, tetapi engkau berpuasa terus-menerus?” Beliau menjawab, “Aku tidak seperti kalian; aku diberi makan dan minum.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab dan Ishaq al-Tabba’ dalam kumpulan Ahmad, oleh Suwaid dan al-Qa’nabi dalam kumpulan Abu Dawud (2360), oleh al-Tunisi dalam kumpulan al-Bukhari (1962), dan oleh Yahya ibn Yahya al-Naysaburi dalam kumpulan Muslim. Beliau merujuk pada al-Tamhid (14/361). {cite:muwatta-maruf-1997 p.404}"
