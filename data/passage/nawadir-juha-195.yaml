text: "… دعني أقابل صديقي القديم دعاه ولي أفندي زاده من وجوه البلدة إلى الإفطار، عنده في رمضان. وكان"
summary:
  ar: "دُعي جحا إلى إفطار رمضان في بيت وجيه، وكانت المائدة عامرة بالدجاج المحشو والحلوى؛ وكان المضيف يأمر برفع كل طبق لعيب صغير؛ فطلب جحا الجائع أن يتيح له أن يسلّم على صديقه القديم أولًا، وأكل الأرز. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  en: "Juha is invited to a notable's home for iftar in Ramadan; the table is laid with stuffed fowl and sweets; the host orders each dish removed for minor faults; Juha, starving, asks the host to let him greet his old friend first, and eats the rice. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  ur: "جحا کو رمضان میں ایک معزز شخص کے گھر افطار پر بلایا گیا؛ دسترخوان پر بھرے ہوئے مرغ اور مٹھائیاں تھیں؛ میزبان ہر ڈش کو معمولی عیب پر اٹھوا دیتا؛ بھوکے جحا نے کہا کہ مجھے پہلے اپنے پرانے دوست سے مل لینے دو، اور چاول کھا لیے۔ {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  fr: "Juha est invité chez un notable pour l'iftar du Ramadan; la table est dressée de volailles farcies et de douceurs; l'hôte fait retirer chaque plat pour un défaut mineur; Juha, affamé, demande qu'on le laisse d'abord saluer son vieil ami, et mange le riz. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  es: "Juha es invitado a casa de un notable al iftar de Ramadán; la mesa está puesta con aves rellenas y dulces; el anfitrión manda retirar cada plato por defectos menores; Juha, hambriento, pide que lo dejen primero saludar a su viejo amigo, y se come el arroz. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
  tr: "Juha, Wajih'in evinde Ramazan kahvaltısına davet edildi. Masa, doldurulmuş tavuk ve tatlılarla doluydu. Ev sahibi, ufak bir sebep için her yemeğin kaldırılmasını emretti. Aç olan Juha, önce eski dostunu selamlamasına ve biraz pilav yemesine izin verilmesini istedi. {cite:juha-nawadir-kubra-djuwaydi s. 87}"
  id: "Juha diundang sarapan Ramadan di rumah Wajih. Meja dipenuhi dengan ayam isi dan manisan. Tuan rumah memerintahkan agar setiap hidangan disingkirkan karena alasan sepele. Juha, yang lapar, meminta izin untuk menyapa teman lamanya terlebih dahulu dan makan nasi. {cite:juha-nawadir-kubra-djuwaydi p. 87}"
