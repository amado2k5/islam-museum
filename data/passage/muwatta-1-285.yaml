label: { ar: "الموطأ 285 — ابن شهاب: كان عمر يقرأ «فامضوا إلى ذكر الله»", en: "Muwatta 285", es: "Muwatta 285", fr: "Muwatta 285", ur: "موطا 285", tr: "El-Muvatta 285 — İbn Şihab: Ömer şöyle derdi: “Öyleyse Allah'ı anmaya geçin.”", id: "Al-Muwatta 285 — Ibn Shihab: Umar biasa membaca “Kemudian lanjutkanlah untuk mengingat Allah”" }
summary:
  ar: "أول أثر في باب ما جاء في السعي يوم الجمعة. يروي يحيى عن مالك أنه سأل ابن شهاب عن آية الجمعة التي تأمر بالسعي إلى ذكر الله إذا نودي للصلاة، فأخبره ابن شهاب أن عمر بن الخطاب كان يقرؤها بلفظ المضي إلى ذكر الله، أي قراءة تفسيرية تبين أن المراد الذهاب لا الإسراع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163}"
  tr: "Cuma günü camiye aceleyle gitme uygulamasına ilişkin ilk rivayet. Yahya, Malik'in İbn Şihab'a, ezan okunduğunda Allah'ı anmaya acele etmeyi emreden Cuma ayeti hakkında sorduğunu bildirir. İbn Şihab, Ömer ibn el-Hattab'ın bunu \"Allah'ı anmaya gitmek\" şeklinde okuduğunu, bunun da anlamının acele etmek değil, gitmek olduğunu açıklayan bir yorum olduğunu bildirmiştir. Editör, bunu Malik'ten Ebu Mus'ab ve Suveyd'in rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.163}"
  id: "Riwayat pertama mengenai kebiasaan bergegas ke masjid pada hari Jumat. Yahya melaporkan bahwa Malik bertanya kepada Ibn Shihab tentang ayat pada hari Jumat yang memerintahkan untuk bergegas mengingat Allah ketika azan berkumandang. Ibn Shihab memberitahunya bahwa Umar ibn al-Khattab biasa membacanya sebagai \"pergi untuk mengingat Allah,\" sebuah penafsiran yang memperjelas bahwa maksudnya adalah pergi, bukan bergegas. Editor mencatat bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.163}"
