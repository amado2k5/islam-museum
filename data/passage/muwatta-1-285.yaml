label: { ar: "الموطأ 285 — ابن شهاب: كان عمر يقرأ «فامضوا إلى ذكر الله»", en: "Muwatta 285" }
summary:
  ar: "أول أثر في باب ما جاء في السعي يوم الجمعة. يروي يحيى عن مالك أنه سأل ابن شهاب عن آية الجمعة التي تأمر بالسعي إلى ذكر الله إذا نودي للصلاة، فأخبره ابن شهاب أن عمر بن الخطاب كان يقرؤها بلفظ المضي إلى ذكر الله، أي قراءة تفسيرية تبين أن المراد الذهاب لا الإسراع. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163}"
