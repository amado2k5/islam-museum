text: "قُلْ مَن ذَا ٱلَّذِى يَعْصِمُكُم مِّنَ ٱللَّهِ إِنْ أَرَادَ بِكُمْ سُوٓءًا أَوْ أَرَادَ بِكُمْ رَحْمَةً ۚ وَلَا يَجِدُونَ لَهُم مِّن دُونِ ٱللَّهِ وَلِيًّا وَلَا نَصِيرًا"
text_search: "قل من ذا الذي يعصمكم من الله إن أراد بكم سوءا أو أراد بكم رحمة ۚ ولا يجدون لهم من دون الله وليا ولا نصيرا"
translations:
  en: { text: "Say: Who is he who can preserve you from Allah if He intendeth harm for you, or intendeth mercy for you. They will not find that they have any friend or helper other than Allah.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "کہہ دو کہ اگر خدا تمہارے ساتھ برائی کا ارادہ کرے تو کون تم کو اس سے بچا سکتا ہے یا اگر تم پر مہربانی کرنی چاہے تو (کون اس کو ہٹا سکتا ہے) اور یہ لوگ خدا کے سوا کسی کو نہ اپنا دوست پائیں گے اور نہ مددگار", translator: "Fateh Muhammad Jalandhari", license: PD }
