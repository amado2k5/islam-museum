label: { ar: "الموطأ 747 — مالك: الشركاء في كل زرع أو نخل أو كرم، الصدقة على من بلغ جداده أو قطافه أو حصاده خمسة أوسق", en: "Muwatta 747", es: "Muwatta 747", fr: "Muwatta 747", ur: "موطا 747", tr: "Al-Muwatta 747 — Malik: Her türlü üründe, hurma ağacında veya bağda ortak olanlardan zekât, hasadı, toplaması veya biçmesi beş vasıf miktarına ulaşan kişiden alınır.", id: "Al-Muwatta 747 — Malik: Para mitra dalam setiap tanaman, kurma, atau kebun anggur, zakat wajib dibayarkan kepada siapa pun yang panen, memetik, atau menuainya mencapai lima wasq." }
summary:
  ar: "قول لمالك: وكذلك العمل في الشركاء كلهم في كل زرع من الحبوب يُحصد أو نخل يُجذ أو كرم يُقطف، إذا كان كل رجل منهم يجذ من التمر أو يقطف من الزبيب أو يحصد من الحنطة خمسة أوسق فعليه فيه الزكاة، ومن كان حقه أقل من خمسة أوسق فلا صدقة عليه؛ وإنما تجب الصدقة على من بلغ جداده أو قطافه أو حصاده خمسة أوسق. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.371}"
  tr: "Malik şöyle demiştir: Benzer şekilde, hasat edilen herhangi bir tahıl, hurma veya üzüm bağındaki tüm ortakların emeği, her bir kişi beş vask hurma, kuru üzüm veya buğday hasat ederse zekâta tabidir. Eğer payı beş vasktan az ise, zekât ödeme yükümlülüğü yoktur. Zekât, ancak hasat, toplama veya biçme miktarı beş vaska ulaşanlara aittir. Editör, el yazmalarındaki farklılıkları doğrular ve Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.371}"
  id: "Malik berkata: Demikian pula, pekerjaan semua mitra dalam panen biji-bijian, kurma, atau anggur dikenakan zakat jika setiap orang memanen lima wasq kurma, kismis, atau gandum. Jika bagiannya kurang dari lima wasq, maka ia tidak wajib membayar zakat. Zakat hanya wajib bagi mereka yang panen, pemetikan, atau pemanenannya mencapai lima wasq. Editor mengkonfirmasi perbedaan dalam manuskrip dan menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.371}"
