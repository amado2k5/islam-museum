label: { ar: "الموطأ 747 — مالك: الشركاء في كل زرع أو نخل أو كرم، الصدقة على من بلغ جداده أو قطافه أو حصاده خمسة أوسق", en: "Muwatta 747" }
summary:
  ar: "قول لمالك: وكذلك العمل في الشركاء كلهم في كل زرع من الحبوب يُحصد أو نخل يُجذ أو كرم يُقطف، إذا كان كل رجل منهم يجذ من التمر أو يقطف من الزبيب أو يحصد من الحنطة خمسة أوسق فعليه فيه الزكاة، ومن كان حقه أقل من خمسة أوسق فلا صدقة عليه؛ وإنما تجب الصدقة على من بلغ جداده أو قطافه أو حصاده خمسة أوسق. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.371}"
