summary:
  ar: "القسم 50 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المكاتب»، ويضم فيها النصوص من 2560 إلى 2565 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 50 of Sahih al-Bukhari (Makaatib) in the division of the open hadith dataset the museum took its reports from: reports 2560 to 2565 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 50، عنوان «کتاب المکاتب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2560 تا 2565۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 50 de Sahih al-Bukhari (Makaatib) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2560 a 2565 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih al-Bukhari (Makaatib), livre 50, dans la partie ouverte du recueil: les hadiths 2560 à 2565 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 50. bölümü \"Görevler Kitabı\" başlığını taşımakta olup, 2560 ile 2565 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu kitap altında toplamaktadır."
  id: "Bagian 50 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Jabatan\" dan berisi teks 2560 hingga 2565, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah kitab ini."
