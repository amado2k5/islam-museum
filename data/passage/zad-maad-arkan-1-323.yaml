text: "… اختياره لعبده، وهي من لوازم الرضى به رباً، الذي لا يذوق طعم الإيمان مَنْ لم يكن كذلك، وإِنْ رضي بالمقدوِرِ بعدها، فذلك علامةُ سعادته. وذكر البيهقي وغيره، عن أنس قال: لم يُرد النبيُّ ك سَفَراً قطُّ إلَّا قال حين ينهض …"
