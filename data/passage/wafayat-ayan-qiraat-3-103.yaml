text: "… و قرية من اعمال دشت مبسان الاولى سنة تسع وثمانين وتسبعمائة بعد عودنا من بين البصرة وخوزستادفة وفى بها فى سنة اثفتين وعشرين ومائة وقال غيره سنة اجدى وعشر من مصر واتمام أخيه القراآت ومرمست وسبعون سنة وقال اياس فى …"
