summary:
  ar: "القسم 56 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجهاد والسير»، ويضم فيها النصوص من 2782 إلى 3090 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 56 of Sahih al-Bukhari (Fighting for the Cause of Allah (Jihaad)) in the division of the open hadith dataset the museum took its reports from: reports 2782 to 3090 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 56، عنوان «کتاب الجہاد والسیر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2782 تا 3090۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 56 de Sahih al-Bukhari (La lucha por la causa de Alá (Yihad)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2782 al 3090, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 56 du Sahih al-Bukhari (Le Combat pour la cause d'Allah (Jihad)), correspondant aux hadiths 2782 à 3090 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Sahih el-Buhari'nin 56. bölümü \"Cihad ve Seferler Kitabı\" başlığını taşımakta olup, 2782 ile 3090 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 56 dari Sahih al-Bukhari, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Jihad dan Ekspedisi\" dan berisi teks 2782 hingga 3090, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
