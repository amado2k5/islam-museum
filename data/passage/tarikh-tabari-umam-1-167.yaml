text: "… وزلزلت فى هذه السنة بلاد المغرب حتى تهدمت الحصون والمنازل والقناطر خامر المتوكّل بتغرقة ثلثة آلاف الف درهم فى الذين اصيبوا بمنازلهمة وزلزل عسكر المهدق ببغداد فيها وزنزلت : المدائن، وبعثَّ ملك الروم فيها باسرى من ا المسلمين وبعث يَسْأل …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 1، ص 167، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 1, p. 167, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 1، ص 167 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Tarikh al-Rusul wa-l-Muluk de al-Tabari, volumen 1, pág. 167, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tarikh al-Rusul wa-l-Muluk d'al-Tabari, volume 1, page 167, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "Taberi'nin Peygamberler ve Krallar Tarihi, Resimli Cilt 1, sayfa 167'den, Müslüman olmayan milletleri, dinleri ve halkları anlatan bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Kutipan dari Sejarah Para Nabi dan Raja karya Al-Tabari, Jilid 1 Bergambar, halaman 167, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
