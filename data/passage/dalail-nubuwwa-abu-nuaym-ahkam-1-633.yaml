text: "… وقوله في غير قرن: القرن التقاء الحاجبين حتى يتصلا، يقول ليس هو كذلك، ولكن بينهما فُرجة، يقال للرجل إذا كان كذلك أبْلَج، وذكر الأصمعي أن العرب تستحبُّ هذا. وقوله بينهما عرق يدره الغضب: يقول، إذا درّ العرق الذي بين الحاجبين، …"
summary:
