text: "الكتاب. فحزن عليها إبراهيم، ورثاها رحمها الله، واشترى من رجل من بني حيث يقال له عفرون بن صخر مغارة بأربعمائة مثقال، ودفن فيها سارة هنالك. قالوا : ثم خطب إبراهيم على ابنه إسحاق فزوجه رفقاً بنت بتوئيل بن ناحور بن …"
summary:
