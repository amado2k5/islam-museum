text: "… بيتِكَ، واكره لهم ما تكرَهُ لنفسك وأَهل بيتِكَ، وخضِ الغمراتِ إِلى الحقِّ، ولا تخف في اللّٰه لومةً لائمٍ، فقال عمرُ: مَن يستطيعُ ذلك؟ فقال سعيدٌ: مثلُك مَن ولَّاه اللَّهُ أَمرَ أُمَّةٍ مُحمَّدٍ، ثُمَّ لم يحل بينه وبين أَحدٍ. وإسناده ضعيف؛ …"
summary:
