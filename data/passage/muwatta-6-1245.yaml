label: { ar: "الموطأ 1245 — مالك: في بيضة النعامة عشر ثمن البدنة، كما يكون في جنين الحرة غرة، وقيمة الغرة خمسون دينارا", en: "Muwatta 1245", es: "Muwatta 1245", fr: "Muwatta 1245", ur: "موطا 1245", tr: "El-Muvatta 1245 — Malik: Bir devekuşu yumurtasının fiyatı, bir devenin fiyatının onda biridir; tıpkı özgür bir kadının cenininin fiyatının bir ceza olması ve bu cezanın değerinin elli dinar olması gibi.", id: "Al-Muwatta 1245 — Malik: Harga sebutir telur burung unta adalah sepersepuluh harga sebutir unta, sama seperti harga janin wanita merdeka adalah denda, dan nilai denda itu adalah lima puluh dinar." }
summary:
  ar: "يرى مالك أن في بيضة النعامة عشر ثمن البدنة، كما يكون في جنين الحرة غرة عبد أو وليدة، وقيمة الغرة خمسون دينارا، وذلك عشر دية أمه. {cite:muwatta-maruf-1997 p.555}"
  tr: "Malik, bir devekuşu yumurtasının bir devenin fiyatının onda biri değerinde olduğunu, tıpkı özgür bir kadının cenininin bir kölenin veya kadın kölenin fiyatına denk geldiğini, fiyatın elli dinar olduğunu, bunun da annesi için ödenen kan parasının onda biri olduğunu savunmuştur. {cite:muwatta-maruf-1997 s.555}"
  id: "Malik berpendapat bahwa sebutir telur burung unta bernilai sepersepuluh harga seekor unta, sama seperti janin seorang wanita merdeka bernilai setara dengan harga seorang budak atau budak perempuan, dengan nilai harga lima puluh dinar, yang merupakan sepersepuluh uang darah untuk ibunya. {cite:muwatta-maruf-1997 p.555}"
