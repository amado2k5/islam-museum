  tr: "Abdülrazzak'ın Resimli Musannaf adlı eserinin 1. cildinin 2412. sayfasındaki bir alıntıda Kur'an okuyucularından bahsedilmektedir; makine tarafından okunabilir taranmış versiyondan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
