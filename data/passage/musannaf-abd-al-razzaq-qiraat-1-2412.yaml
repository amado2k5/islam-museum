text: "… أَن أَدفن رجلاً لم يذنب مُنذ غفر له. - عبد الرزاق عن ابن مجاهد عن أَبيه عن ابن عمر قال : جاءً رجلان إلى رسول اللّٰه عله أَحدهما من الأَنصار، والآخر من ثقيف، فسبقه الأنصاري، فقال النبي ملله للثقفي : …"
summary:
