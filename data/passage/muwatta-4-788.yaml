text: "لا يصوم إلا من أجمع الصيام قبل الفجر"
summary:
  ar: "أول حديث في باب من أجمع على الصيام قبل الفجر. يرويه مالك عن نافع عن عبد الله بن عمر أنه كان يقول: لا يصوم إلا من أجمع الصيام قبل الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (372) ويحيى بن بكير عند البيهقي (4/202). {cite:muwatta-maruf-1997 p.388}"
  tr: "Bu hadis, şafak sökmeden önce oruç tutmaya karar veren kimse hakkındaki bölümün ilk hadisidir. Malik'in Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiği hadiste şöyle der: \"Kim şafak sökmeden önce oruç tutmaya karar vermezse oruç tutmaz.\" Editör, bu hadisin Malik'ten Ebu Mus'ab, Suwaid, Muhammed ibn al-Hasan al-Şeybani (372) ve Yahya ibn Bukayr tarafından rivayet edildiğini, el-Bayhaqi'nin (4/202) de kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.388}"
  id: "Hadits pertama dalam bab ini adalah tentang orang yang bertekad untuk berpuasa sebelum subuh. Diriwayatkan oleh Malik dari Nafi’ dari Abdullah ibn Umar, yang biasa berkata: “Seseorang tidak boleh berpuasa kecuali jika ia bertekad untuk berpuasa sebelum subuh.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab, Suwaid, Muhammad ibn al-Hasan al-Shaybani (372), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (4/202). {cite:muwatta-maruf-1997 p.388}"
