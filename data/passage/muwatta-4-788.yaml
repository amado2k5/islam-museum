text: "لا يصوم إلا من أجمع الصيام قبل الفجر"
summary:
  ar: "أول حديث في باب من أجمع على الصيام قبل الفجر. يرويه مالك عن نافع عن عبد الله بن عمر أنه كان يقول: لا يصوم إلا من أجمع الصيام قبل الفجر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن الشيباني (372) ويحيى بن بكير عند البيهقي (4/202). {cite:muwatta-maruf-1997 p.388}"
