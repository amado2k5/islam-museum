label: { ar: "نوادر جحا الكبرى، ص 114 — «الحمد لله الذي أتى بك عاجلاً\")»", en: "Nawadir Juha al-Kubra, p. 114 — 'Praise God Who Brought You Back Early'", ur: "نوادر جحا الکبریٰ، ص 114 — «شکر ہے اللہ کا جس نے تمہیں جلد لوٹا دیا»", fr: "Nawadir Juha al-Kubra, p. 114 — « Louange à Dieu qui t'a ramené tôt »", es: "Nawadir Juha al-Kubra, p. 114 — «Alabado sea Dios que te trajo pronto»", tr: "Juha'nın Büyük Anekdotları, s. 114 — “Sizi buraya bu kadar çabuk getiren Tanrı'ya şükürler olsun!”", id: "Anekdot Hebat Juha, hlm. 114 — “Segala puji bagi Tuhan yang telah membawamu ke sini begitu cepat!”" }
text: "… الحمدُ لِلَّهِ الذي أتي بك عاجلاً عاد بعض المتغيِّبين إلى آقَ شَهْرَ بعد أن طافَ أُسْبُوعاً في الضواحي فذهب الشيخ للسلام عليه، فقال له الشيخ: الأملُ أن تكونوا سُررْتُم بهذه السياحة؟ فقال المتغيِّبُ: أجل تسليْتُ كثيراً، إذ في يوم الاثنين …"
summary:
  ar: "عاد قروي إلى آق شهر بعد أسبوع غياب فسأله جحا كيف وجد رحلته، فعدد الرجل كوارث القرية: حريق قتل كثيرين، وكلب مسعور عض اثنين، وفيضان، ورجل قتل أولاده، وسقف انهار، وانتحار، فقال جحا الحمد لله أنك عدت مبكراً وإلا لما بقي حجر على حجر هناك. {cite:juha-nawadir-kubra-djuwaydi p. 114}"
  en: "A villager returns to Akshehir from a week away, and Juha asks how he enjoyed his trip. The man lists disasters in the village: a fire that killed many, a rabid dog that bit two, a flood, a man who killed his children, a roof that collapsed, and a suicide. Juha says thank God he came back early, or no stone would remain on stone there. {cite:juha-nawadir-kubra-djuwaydi p. 114}"
  ur: "ایک دیہاتی ہفتہ بھر کی غیر حاضری کے بعد آق شہر لوٹتا ہے اور جحا پوچھتا ہے کہ سفر کیسا رہا۔ وہ آدمی گاؤں کی آفتیں گنواتا ہے: ایک آگ جس نے بہت سوں کو مار ڈالا، ایک باؤلا کتا جس نے دو کو کاٹا، ایک سیلاب، ایک آدمی جس نے اپنے بچوں کو مار ڈالا، ایک چھت جو گر پڑی، اور ایک خودکشی۔ جحا کہتا ہے کہ اللہ کا شکر ہے تم جلدی لوٹ آئے، ورنہ وہاں پتھر پر پتھر نہ رہتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 114}"
  fr: "Un villageois revient à Akshehir après une semaine d'absence, et Juha lui demande si son voyage lui a plu. L'homme énumère les malheurs du village : un incendie qui a tué beaucoup de gens, un chien enragé qui en a mordu deux, une inondation, un homme qui a tué ses enfants, un toit effondré et un suicide. Juha dit : « Dieu soit loué que tu sois revenu tôt, sinon il ne resterait pierre sur pierre là-bas. » {cite:juha-nawadir-kubra-djuwaydi p. 114}"
  es: "Un aldeano regresa a Akshehir tras una semana fuera, y Juha le pregunta qué tal su viaje. El hombre enumera las desgracias del pueblo: un incendio que mató a muchos, un perro rabioso que mordió a dos, una inundación, un hombre que mató a sus hijos, un techo que se derrumbó y un suicidio. Juha dice: «Gracias a Dios que volviste pronto, o allí no quedaría piedra sobre piedra». {cite:juha-nawadir-kubra-djuwaydi p. 114}"
  tr: "Bir köylü bir haftalık yokluğun ardından Aq Shahr'a geri döndü ve Juha ona yolculuğunun nasıl geçtiğini sordu. Adam köyün başına gelen felaketleri sıraladı: birçok kişinin ölümüne neden olan bir yangın, iki kişiyi ısıran kuduz bir köpek, sel, çocuklarını öldüren bir adam, çöken bir çatı ve bir intihar. Juha, \"Allah'a şükür erken döndün, yoksa orada tek bir taş bile kalmazdı\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 114}"
  id: "Seorang penduduk desa kembali ke Aq Shahr setelah absen selama seminggu, dan Juha bertanya kepadanya bagaimana perjalanannya. Pria itu menyebutkan berbagai musibah yang menimpa desa: kebakaran yang menewaskan banyak orang, anjing gila yang menggigit dua orang, banjir, seorang pria yang membunuh anak-anaknya, atap yang runtuh, dan sebuah kasus bunuh diri. Juha berkata, \"Syukurlah kau kembali lebih awal, kalau tidak, tidak akan ada satu batu pun yang tersisa di sana.\" {cite:juha-nawadir-kubra-djuwaydi p. 114}"
