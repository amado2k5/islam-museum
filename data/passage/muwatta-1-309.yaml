label: { ar: "الموطأ 309 — إذا نعس أحدكم في صلاته فليرقد حتى يذهب عنه النوم", en: "Muwatta 309" }
text: "إذا نعس أحدكم في صلاته فليرقد حتى يذهب عنه النوم، فإن أحدكم إذا صلى وهو ناعس لا يدري لعله يذهب يستغفر فيسب نفسه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب ما جاء في صلاة الليل: أمر النبي من نعس في صلاته أن يرقد حتى يذهب عنه النوم، لأنه إذا صلى ناعساً فلعله يذهب يستغفر فيسب نفسه من غير أن يدري. ويخرّجه المحقق عند البخاري (212) ومسلم (2/190) وأبي داود (1310) وابن حبان وأبي عوانة والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/117) وتعليقه على الترمذي (355). {cite:muwatta-maruf-1997 p.174}"
