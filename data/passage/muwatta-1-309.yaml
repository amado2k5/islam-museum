label: { ar: "الموطأ 309 — إذا نعس أحدكم في صلاته فليرقد حتى يذهب عنه النوم", en: "Muwatta 309", es: "Muwatta 309", fr: "Muwatta 309", ur: "موطا 309", tr: "El-Muvatta 309 — Eğer biriniz namaz kılarken uykusu gelirse, uykusu geçinceye kadar uyumasına izin verin.", id: "Al-Muwatta 309 — Jika salah seorang dari kalian mengantuk saat shalat, maka tidurlah hingga rasa kantuk itu hilang." }
text: "إذا نعس أحدكم في صلاته فليرقد حتى يذهب عنه النوم، فإن أحدكم إذا صلى وهو ناعس لا يدري لعله يذهب يستغفر فيسب نفسه"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب ما جاء في صلاة الليل: أمر النبي من نعس في صلاته أن يرقد حتى يذهب عنه النوم، لأنه إذا صلى ناعساً فلعله يذهب يستغفر فيسب نفسه من غير أن يدري. ويخرّجه المحقق عند البخاري (212) ومسلم (2/190) وأبي داود (1310) وابن حبان وأبي عوانة والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/117) وتعليقه على الترمذي (355). {cite:muwatta-maruf-1997 p.174}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, dalam surah tentang apa yang diriwayatkan mengenai shalat malam: Nabi (shalawat dan salam kepadanya) memerintahkan agar siapa pun yang mengantuk saat shalat hendaknya tidur hingga rasa kantuknya hilang, karena jika ia shalat dalam keadaan mengantuk, ia mungkin akan memohon ampunan dan akhirnya mengutuk dirinya sendiri tanpa menyadarinya. Editor juga memasukkannya dalam kumpulan hadits al-Bukhari (212), Muslim (2/190), Abu Dawud (1310), Ibn Hibban, Abu Awanah, dan al-Bayhaqi melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (22/117) dan komentarnya tentang al-Tirmidhi (355). {cite:muwatta-maruf-1997 p.174}"
