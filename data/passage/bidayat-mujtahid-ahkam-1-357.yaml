text: "… الْمُتْعَةِ وَالْجُمْهُورُ عَلَى أَنَّ الْمُتْعَةَ لَيْسَتْ وَاجِبَةً فِي كُلِّ مُطَلَّقَةٍ. وَقَالَ قَوْمٌ مِنْ أَهْلِ الظَّاهِرِ: هِيَ وَاجِبَةٌ فِي كُلِّ مُطَلَّقَةٍ. وَقَالَ قَوْمٌ: هِيَ مَنْدُوبٌ إِلَيْهَا، وَلَيْسَتْ وَاجِبَةً، وَبِهِ قَالَ مَالِكٌ. وَالَّذِينَ قَالُوا بِوُجُوبِهَا فِي بَعْضٍ ب و الْمُطَلَّقَاتِ : اخْتَلَفُوا …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 357، يرد فيه ذكر الواجب، والوجوب، والمندوب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 1, p. 357, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 1، ص 357 کا اقتباس جس میں واجب، وجوب، مندوب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 1, p. 357, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le recommandé (mandub), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 1, p. 357, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo recomendado (mandub), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
