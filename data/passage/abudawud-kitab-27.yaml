summary:
  ar: "القسم 27 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأشربة»، ويضم فيها النصوص من 3669 إلى 3735 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 27 of Sunan Abi Dawud (Drinks (Kitab Al-Ashribah)) in the division of the open hadith dataset the museum took its reports from: reports 3669 to 3735 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 27، عنوان «کتاب الاشربۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3669 تا 3735۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 27 de Sunan Abi Dawud (Las bebidas (Kitab Al-Ashribah)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 3669 a 3735 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
