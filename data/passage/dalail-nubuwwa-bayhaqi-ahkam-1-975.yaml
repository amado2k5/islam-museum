text: "… عائشةا قالت : فرض اللّٰه الصلاة أول ما فرضها ركعتين، ثم أتمها في الحضر، وأقرت صلاة المسافر على الفريضة الأولى. هكذا رواه الأوزاعي، ورواه معمر عن الزهري، عن عروة عن عائشة قالت : فرضت الصلاة على النبي ول يم. بمكة …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 975، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، وما فُرض على الناس، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 975, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 975 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
