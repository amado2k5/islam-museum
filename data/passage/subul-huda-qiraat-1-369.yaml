text: "… حَادُوا عَنِ الْحَقِّ فَمَا لِلَّذِي سَادُوا بِهِ فِيمَا مَضَى نِسْبَه فَقُلْتُ للأَبرارِ أَهلِ التُّقَى والدِّين لما اشتدّت الكَّرَبَهْ لا تُنْكِرُوا أَخْرَالَكُمْ قَدْ أَنَتْ نَزْبِثُكُمْ في زَمَنِ الغُرْبَة! ولقد أَحسن الإِمام أَبو عمرو بن العلاء تعالى حيث يقول: لا يزال الناس …"
