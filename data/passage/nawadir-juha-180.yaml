label: { ar: "نوادر جحا الكبرى، ص 81 — «جئت خالياً وأذهب خالياً»", en: "Nawadir Juha al-Kubra, p. 81 — 'I Came Empty and Leave Empty'", ur: "نوادر جحا الکبریٰ، ص 81 — «میں خالی آیا اور خالی جا رہا ہوں»", fr: "Nawadir Juha al-Kubra, p. 81 — « Je suis venu vide et je repars vide »", es: "Nawadir Juha al-Kubra, p. 81 — «Vine vacío y me voy vacío»", tr: "Juha'nın Büyük Fıkraları, s. 81 — “Elim boş geldim ve elim boş gideceğim.”", id: "Anekdot Hebat Juha, hlm. 81 — “Aku datang dengan tangan kosong dan aku akan pergi dengan tangan kosong.”" }
text: "… جئت خالياً وأذهب خالياً اصطاد يوماً في بحيرة آقَ شَهْرْ سَمَكاً، وأراد الانصراف فأجتمع حوله أولاد المحلةِ وسرق كلِّ منهم سمكةً أو سمكتين، ولما نهض ليذهَب رأى الزنبيلَ فارغاً لا شيء فيه، فخاطب البحيرة قائلاً : جِثْتُ خالِياً وأذهبُ خالياً …"
summary:
  ar: "كان جحا يصطاد السمك في البحيرة، فسرق الأطفال سمكه؛ ولما غادر بسلة فارغة رماها في البحيرة، وقال إنه جاء خالي اليدين ويذهب خاليًا، وأهدى السلة. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  en: "Juha fishes at the lake; children steal his fish; leaving with an empty basket he throws it into the lake, saying he came empty-handed and leaves empty, and gives the basket as a gift. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  ur: "جحا جھیل پر مچھلی پکڑ رہا تھا کہ بچے اس کی مچھلیاں چرا لے گئے؛ خالی ٹوکری لے کر لوٹتے ہوئے اس نے ٹوکری جھیل میں پھینک دی اور کہا کہ میں خالی ہاتھ آیا تھا اور خالی جا رہا ہوں، اور ٹوکری تحفے میں دے دی۔ {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  fr: "Juha pêche au lac; des enfants lui volent ses poissons; en repartant avec un panier vide, il le jette dans le lac, disant qu'il est venu les mains vides et repart à vide, et offre le panier en cadeau. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  es: "Juha pesca en el lago; unos niños le roban los peces; al irse con la cesta vacía, la arroja al lago, diciendo que vino con las manos vacías y se va vacío, y regala la cesta. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
  tr: "Juha gölde balık tutarken bazı çocuklar balıklarını çaldı. Boş bir sepetle ayrılırken, \"Elim boş geldim, eli boş gidiyorum\" diyerek sepeti göle attı ve sepeti başkalarına verdi. {cite:juha-nawadir-kubra-djuwaydi s. 81}"
  id: "Juha sedang memancing di danau ketika beberapa anak mencuri ikannya. Saat ia pergi dengan keranjang kosong, ia melemparkannya ke danau sambil berkata, \"Aku datang dengan tangan kosong dan aku pergi dengan tangan kosong,\" lalu memberikan keranjang itu kepada orang lain. {cite:juha-nawadir-kubra-djuwaydi p. 81}"
