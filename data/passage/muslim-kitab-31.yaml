  en: "Sahih Muslim, Book 31: The Book of Lost Property"
  ur: "صحیح مسلم، کتاب اللقطۃ"
  es: "Sahih Muslim, Libro 31: El Libro de los Bienes Perdidos"
  fr: "Sahih Muslim, Livre 31: Le Livre des biens perdus"
  tr: "Sahih Muslim, Kayıp ve Bulunan Eşyalar Kitabı"
