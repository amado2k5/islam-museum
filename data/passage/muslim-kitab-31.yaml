summary:
  ar: "القسم 31 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب اللقطة»، ويضم فيها النصوص من 4498 إلى 4518 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 31 of Sahih Muslim (The Book of Lost Property) in the division of the open hadith dataset the museum took its reports from: reports 4498 to 4518 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 31، عنوان «کتاب اللقطۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4498 تا 4518۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 31 de Sahih Muslim (El Libro de los Objetos Perdidos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4498 al 4518, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre des objets perdus), volume 31, qui correspond aux hadiths 4498 à 4518 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 31. bölümü \"Kayıp ve Bulunan Kitabı\" başlığını taşımakta olup, 4498 ile 4518 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 31 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab yang Hilang dan Ditemukan\" dan berisi teks 4498 hingga 4518, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
