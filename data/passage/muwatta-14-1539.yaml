summary:
  ar: "يروي مالك أنه سأل ابن شهاب عن رجل كانت تحته أمة مملوكة، فاشتراها، وكان قد طلقها واحدة، فقال تحل له بملك يمينه ما لم يبت طلاقها، فإن بت طلاقها فلا تحل له بملك يمينه حتى تنكح زوجا غيره. {cite:muwatta-maruf-1997 p.44}"
