label: { ar: "الموطأ 1539 — مالك سأل ابن شهاب عن رجل كانت تحته أمة مملوكة فاشتراها وقد طلقها واحدة، فقال تحل له بملك يمينه ما لم يبت طلاقها", en: "Muwatta 1539", es: "Muwatta 1539", fr: "Muwatta 1539", ur: "موطا 1539", tr: "El-Muvatta 1539 — Malik, İbn Şihab'a, yanında bir kadın kölesi olan ve onu bir kez boşadıktan sonra satın alan bir adam hakkında sordu. İbn Şihab, \"Onu kalıcı olarak boşamadığı sürece, sahiplik hakkı gereği ona helaldir\" dedi.", id: "Al-Muwatta 1539 — Malik bertanya kepada Ibn Shihab tentang seorang pria yang memiliki seorang budak perempuan di bawah pengawasannya, dan kemudian membelinya setelah menceraikannya sekali. Beliau berkata, “Budak perempuan itu halal baginya berdasarkan hak kepemilikannya selama ia belum menceraikannya secara permanen.”" }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب عن رجل كانت تحته أمة مملوكة، فاشتراها، وكان قد طلقها واحدة، فقال تحل له بملك يمينه ما لم يبت طلاقها، فإن بت طلاقها فلا تحل له بملك يمينه حتى تنكح زوجا غيره. {cite:muwatta-maruf-1997 p.44}"
  tr: "Malik, İbn Şihab'a, satın aldığı ve bir kez boşadığı bir kadın kölesi olan bir adam hakkında sorduğunu rivayet eder. İbn Şihab şöyle demiştir: \"O kadın, adam onu geri dönülmez bir şekilde boşamadığı sürece köle olarak helaldir. Eğer geri dönülmez bir şekilde boşamışsa, başka bir kocayla evleninceye kadar köle olarak helal değildir.\" {cite:muwatta-maruf-1997 s.44}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Ibnu Shihab tentang seorang pria yang memiliki seorang budak perempuan di bawah pengawasannya, yang dibelinya, dan telah diceraikannya sekali. Beliau berkata: Budak perempuan itu halal baginya selama ia belum menceraikannya secara mutlak. Jika ia telah menceraikannya secara mutlak, maka budak perempuan itu tidak halal baginya sampai ia menikah lagi. {cite:muwatta-maruf-1997 p.44}"
