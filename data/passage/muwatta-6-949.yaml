label: { ar: "الموطأ 949 — مالك: من أهل بعمرة ثم بدا له أن يهل بحج معها فذلك له ما لم يطف بالبيت وبين الصفا والمروة؛ وصنع ذلك ابن عمر", en: "Muwatta 949" }
summary:
  ar: "يرويه مالك عن بعض أهل العلم أن من أهل بعمرة ثم بدا له أن يهل بحج معها فذلك له، ما لم يطف بالبيت وبين الصفا والمروة. وصنع ذلك عبد الله بن عمر حين قال: إن صُددت عن البيت صنعنا كما صنعنا مع رسول الله، ثم التفت إلى أصحابه فقال: ما أمرهما إلا واحد، أشهدكم أني قد أوجبت الحج مع العمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1081) وسويد (509). {cite:muwatta-maruf-1997 p.453}"
