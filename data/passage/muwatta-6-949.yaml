label: { ar: "الموطأ 949 — مالك: من أهل بعمرة ثم بدا له أن يهل بحج معها فذلك له ما لم يطف بالبيت وبين الصفا والمروة؛ وصنع ذلك ابن عمر", en: "Muwatta 949", es: "Muwatta 949", fr: "Muwatta 949", ur: "موطا 949", tr: "El-Muvatta 949 — Malik: Bir kimse Umre için ihrama girer ve sonra onunla birlikte Hac için de ihrama girmeye karar verirse, Kâbe etrafında tavaf ve Safa ile Merve arasında Sa'i yapmamış olması şartıyla bu ona caizdir; İbn Ömer de bunu yapmıştır." }
summary:
  ar: "يرويه مالك عن بعض أهل العلم أن من أهل بعمرة ثم بدا له أن يهل بحج معها فذلك له، ما لم يطف بالبيت وبين الصفا والمروة. وصنع ذلك عبد الله بن عمر حين قال: إن صُددت عن البيت صنعنا كما صنعنا مع رسول الله، ثم التفت إلى أصحابه فقال: ما أمرهما إلا واحد، أشهدكم أني قد أوجبت الحج مع العمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1081) وسويد (509). {cite:muwatta-maruf-1997 p.453}"
  tr: "Malik, bazı âlimlerden rivayet eder ki, bir kimse Umre için ihrama girer ve sonra onunla birlikte Hac için de ihrama girmeye karar verirse, Kâbe tavafını ve Safa ile Merve arasında Sa'i'yi yapmamış olması şartıyla bu caizdir. Abdullah ibn Ömer, \"Eğer Kâbe'ye ulaşmam engellenirse, Allah Resulü ile yaptığımız gibi yapacağız\" dediğinde bunu yapmıştır. Sonra arkadaşlarına dönerek, \"Onların durumu da aynıdır. Şahitlik ederim ki, ben Umre ile birlikte Hac'ı da farz kıldım\" demiştir. Araştırmacı, bunu Malik'ten Ebu Mus'ab (1081) ve Suveyd'in (509) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.453}"
  id: "Malik meriwayatkan dari beberapa ulama bahwa jika seseorang memasuki keadaan ihram untuk Umrah dan kemudian memutuskan untuk memasuki keadaan ihram untuk Haji bersamaan dengan itu, maka hal itu diperbolehkan, asalkan ia belum melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa. Abdullah ibn Umar melakukan hal ini ketika ia berkata, \"Jika aku terhalang untuk mencapai Ka'bah, kita akan melakukan seperti yang kita lakukan dengan Rasulullah.\" Kemudian ia berpaling kepada para sahabatnya dan berkata, \"Situasi mereka sama. Aku bersaksi bahwa aku telah mewajibkan Haji bersamaan dengan Umrah.\" Peneliti menyebutkan bahwa Abu Mus'ab (1081) dan Suwaid (509) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.453}"
