label: { ar: "الموطأ 561 — تعزية ومواساة وصبر عند المصيبة", en: "Muwatta of Imam Malik 561 — condolence, consolation and patience at a loss", ur: "موطا امام مالک 561 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Muwatta de l'imam Malik 561 — des condoléances, une consolation et la patience devant la perte", es: "Muwatta del Imam Malik 561 — condolencias, consuelo y paciencia ante la pérdida", tr: "Al-Muwatta 561 — Felaket zamanlarında taziye, şefkat ve sabır", id: "Al-Muwatta 561 — Ungkapan belasungkawa, simpati, dan kesabaran di masa musibah" }
text: "… عَبْدِ الرَّحْمَنِ، عَنْ أُمِّ سَلَمَةَ، زَوْجِ النَّبِيِّ، أَنَّ رَسُولَ اللَّهِ قَالَ مَنْ أَصَابَتْهُ مُصِيبَةٌ فَقَالَ كَمَا أَمَرَ اللَّهُ ⁦(إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ)⁩ اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَعْقِبْنِي خَيْرًا مِنْهَا إِلَّا فَعَلَ اللَّهُ ذَلِكَ بِهِ قَالَتْ أُمُّ سَلَمَةَ فَلَمَّا تُوُفِّيَ أَبُو سَلَمَةَ قُلْتُ ذَلِكَ ثُمَّ قُلْتُ وَمَنْ خَيْرٌ مِنْ أَبِي سَلَمَةَ فَأَعْقَبَهَا اللَّهُ رَسُولَهُ فَتَزَوَّجَهَا"
summary:
  ar: "حديث في الموطأ، رقم 561، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Muwatta of Imam Malik, no. 561 (Burials), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "موطا امام مالک کی حدیث نمبر 561، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Muwatta de l'imam Malik, n° 561, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Muwatta del Imam Malik, n.º 561, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Muvatta suresinin 561 numaralı hadisi, musibet karşısında taziye, teselli ve sabır sunmaktadır. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü mersiye ve ağıtlardan bazılarını bir araya getirmektedir."
  id: "Sebuah hadits dalam Al-Muwatta, nomor 561, menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah. Koleksi ini menyusun beberapa elegi dan ratapan paling terkenal, bersama dengan teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
