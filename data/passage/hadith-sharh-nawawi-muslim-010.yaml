text: "ابن أبي هند عن عامر، قال: سمعت عبد الله هو ابن عمرو وكقوله في كتاب مسلم في باب منع النساء من الخروج إلى المساجد حدثنا عبد الله بن مسلمة حدثنا سليمان يعني ابن بلال عن يحى، وهو ابن سعيد ونظائره"
