text: "… اليوم أبدا إلا غدا بين يذى اللّٰه تعالى، ثم بكت بكاء شديدا وقالت : أسأل لك الته الذى بيده مفاتيح قلبك أن يسهل ما قد عسر من أمرك، ثم إنها تبعته وقالت : أمنن على بموعظة أحملها عنك وأوصنى بوصية …"
