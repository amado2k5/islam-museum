text: "… للأنصاب، ولا يأكل الميتة والدم. ومن خبره في ذلك : أنه خرجَ في الجاهلية يطلب الدِّين هو ووَرَقَة بن نَوْفَل، فلقيا اليهود، فعرضت عليهما يهود دينهم، فتهوَّد ورقة، ثم لقيا النصارى، فعرضوا عليهما دينهم، فترك ورقة اليهودية وتنصَّر، وأَبى زيد …"
