label: { ar: "صحيح مسلم 4651 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 4651 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 4651 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 4651 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَعْفَرُ بْنُ عَوْنٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ أَبِي، إِسْحَاقَ بِهَذَا الإِسْنَادِ نَحْوَهُ وَزَادَ وَكَانَ يَسْتَحِبُّ ثَلاَثًا يَقُولُ \" اللَّهُمَّ عَلَيْكَ بِقُرَيْشٍ اللَّهُمَّ عَلَيْكَ بِقُرَيْشٍ اللَّهُمَّ عَلَيْكَ بِقُرَيْشٍ \". ثَلاَثًا وَذَكَرَ فِيهِمُ الْوَلِيدَ بْنَ عُتْبَةَ وَأُمَيَّةَ بْنَ خَلَفٍ وَلَمْ يَشُكَّ. قَالَ أَبُو إِسْحَاقَ وَنَسِيتُ السَّابِعَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 4651، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4651 (The Book of Jihad and Expeditions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 4651، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4651 (El Libro de la Yihad y las Expediciones), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
