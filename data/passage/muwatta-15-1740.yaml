label: { ar: "الموطأ 1740 — ربيعة بن أبي عبد الرحمن عن محمد بن يحيى بن حبان عن ابن محيريز: سأل أبا سعيد الخدري عن العزل، فذكر غزوة بني المصطلق وقول النبي ما عليكم أن لا تفعلوا", en: "Muwatta 1740", es: "Muwatta 1740", fr: "Muwatta 1740", ur: "موطا 1740", tr: "El-Muvatta 1740 — Rabi’ah ibn Abi Abd al-Rahman, Muhammed ibn Yahya ibn Hibban’dan, o da İbn Muhayriz’den rivayetle: Ebu Sa’id al-Khudri’ye cinsel birleşmeyi kesme hakkında sordu ve o da Beni el-Mustalık Savaşı’nı ve Peygamber’in “Bunu yapmamanız size farz değildir” sözünü zikretti.", id: "Al-Muwatta 1740 — Rabi’ah ibn Abi Abd al-Rahman, berdasarkan riwayat Muhammad ibn Yahya ibn Hibban, berdasarkan riwayat Ibn Muhayriz: Dia bertanya kepada Abu Sa’id al-Khudri tentang coitus interruptus, dan dia menyebutkan Perang Banu al-Mustaliq dan sabda Nabi, “Tidak wajib bagimu jika kamu tidak melakukannya.”" }
text: "ما عَلِيْكُمْ أنْ لَاَ تَفْعِلُوا. مَا مِن نَسمةٍ كَائنةِ إلى يَوْمِ الْقِيامةِ إلاَّا وَهي كَائنةٌ"
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن محمد بن يحيى بن حبان عن ابن محيريز أنه دخل المسجد فرأى أبا سعيد الخدري فسأله عن العزل. فذكر أبو سعيد أنهم خرجوا مع رسول الله في غزوة بني المصطلق، فأصابوا سبيا من سبي العرب، فاشتهوا النساء، واشتدت عليهم العزبة، وأحبوا الفداء، فأرادوا أن يعزلوا، ثم سألوا النبي فقال: ما عليكم أن لا تفعلوا، فما من نسمة كائنة إلى يوم القيامة إلا وهي كائنة. وينبه المحقق إلى أن البخاري ومسلم رويا الحديث من طريق الزهري عن عبد الله بن محيريز. {cite:muwatta-maruf-1997 p.110}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da Muhammed ibn Yahya ibn Hibban'dan, o da İbn Muhayriz'den rivayet ettiğine göre, mescide girdiğinde Ebu Sa'id el-Khudri'yi gördü ve ona cinsel birleşmeyi yarıda kesme hakkında sordu. Ebu Sa'id, Peygamberimizle birlikte Beni el-Mustalık'a karşı sefere çıktıklarını ve bazı Arap esirleri ele geçirdiklerini söyledi. Bu esirler kadınlara karşı cinsel istek duyuyorlardı ve bekârlıkları onlara dayanılmaz gelmişti, bu yüzden onları kurtarmak istiyorlardı. Bu yüzden cinsel birleşmeyi yarıda kesmek istediler ve Peygamberimize sordular. Peygamberimiz şöyle buyurdu: \"Bunu yapmamanız sizin için farz değildir, çünkü kıyamet gününe kadar var olacak hiçbir ruh yoktur ki yok olmasın.\" Editör, Buhari ve Müslim'in bu hadisi Zühri'nin Abdullah ibn Muhayriz'den rivayet ettiği zinciriyle naklettiğine dikkat çekiyor. {cite:muwatta-maruf-1997 s.110}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi 'Abd al-Rahman, dari Muhammad ibn Yahya ibn Hibban, dari Ibn Muhayriz, bahwa ia memasuki masjid dan melihat Abu Sa'id al-Khudri, lalu ia bertanya kepadanya tentang coitus interruptus. Abu Sa'id menyebutkan bahwa mereka pergi bersama Rasulullah dalam ekspedisi melawan Banu al-Mustaliq, dan mereka menangkap beberapa tawanan Arab. Mereka menginginkan wanita, dan kesucian mereka menjadi tak tertahankan bagi mereka, dan mereka ingin menebus mereka. Maka mereka ingin melakukan coitus interruptus, lalu mereka bertanya kepada Nabi, dan beliau bersabda: \"Tidak wajib bagi kalian untuk tidak melakukannya, karena tidak ada jiwa yang akan ada sampai Hari Kiamat yang tidak akan ada.\" Editor menunjukkan bahwa al-Bukhari dan Muslim meriwayatkan hadits tersebut melalui sanad al-Zuhri, dari Abdullah ibn Muhayriz. {mengutip:muwatta-maruf-1997 hal.110}"
