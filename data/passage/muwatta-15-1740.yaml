label: { ar: "الموطأ 1740 — ربيعة بن أبي عبد الرحمن عن محمد بن يحيى بن حبان عن ابن محيريز: سأل أبا سعيد الخدري عن العزل، فذكر غزوة بني المصطلق وقول النبي ما عليكم أن لا تفعلوا", en: "Muwatta 1740" }
text: "ما عَلِيْكُمْ أنْ لَاَ تَفْعِلُوا. مَا مِن نَسمةٍ كَائنةِ إلى يَوْمِ الْقِيامةِ إلاَّا وَهي كَائنةٌ"
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن محمد بن يحيى بن حبان عن ابن محيريز أنه دخل المسجد فرأى أبا سعيد الخدري فسأله عن العزل. فذكر أبو سعيد أنهم خرجوا مع رسول الله في غزوة بني المصطلق، فأصابوا سبيا من سبي العرب، فاشتهوا النساء، واشتدت عليهم العزبة، وأحبوا الفداء، فأرادوا أن يعزلوا، ثم سألوا النبي فقال: ما عليكم أن لا تفعلوا، فما من نسمة كائنة إلى يوم القيامة إلا وهي كائنة. وينبه المحقق إلى أن البخاري ومسلم رويا الحديث من طريق الزهري عن عبد الله بن محيريز. {cite:muwatta-maruf-1997 p.110}"
