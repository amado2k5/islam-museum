label: { ar: "الموطأ 28 — أبو هريرة: إذا اشتد الحر فأبردوا عن الصلاة", en: "Muwatta 28" }
text: "إذا اشتد الحر فأبردوا عن الصلاة، فإن شدة الحر من فيح جهنم"
summary:
  ar: "يرويه مالك عن عبد الله بن يزيد مولى الأسود بن سفيان عن أبي سلمة بن عبد الرحمن وعن محمد بن عبد الرحمن بن ثوبان، كلاهما عن أبي هريرة، في باب النهي عن الصلاة بالهاجرة: أمر النبي بالإبراد بالصلاة إذا اشتد الحر لأن شدته من فيح جهنم، وذكر شكوى النار إلى ربها وإذنه لها بنفسين في كل عام. ويخرّجه المحقق من طرق أصحاب مالك عند مسلم (2/108) وأحمد (2/462) والبيهقي والطحاوي، ويحيل على التمهيد (19/112). {cite:muwatta-maruf-1997 p.48}"
