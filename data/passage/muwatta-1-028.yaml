label: { ar: "الموطأ 28 — أبو هريرة: إذا اشتد الحر فأبردوا عن الصلاة", en: "Muwatta 28", es: "Muwatta 28", fr: "Muwatta 28", ur: "موطا 28", tr: "El-Muvatta 28 — Ebu Hurayra: Eğer sıcaklık çok yükselirse, hava serinleyinceye kadar namazı erteleyin.", id: "Al-Muwatta 28 — Abu Hurairah: Jika cuaca sangat panas, tunda salat sampai cuaca mereda." }
text: "إذا اشتد الحر فأبردوا عن الصلاة، فإن شدة الحر من فيح جهنم"
summary:
  ar: "يرويه مالك عن عبد الله بن يزيد مولى الأسود بن سفيان عن أبي سلمة بن عبد الرحمن وعن محمد بن عبد الرحمن بن ثوبان، كلاهما عن أبي هريرة، في باب النهي عن الصلاة بالهاجرة: أمر النبي بالإبراد بالصلاة إذا اشتد الحر لأن شدته من فيح جهنم، وذكر شكوى النار إلى ربها وإذنه لها بنفسين في كل عام. ويخرّجه المحقق من طرق أصحاب مالك عند مسلم (2/108) وأحمد (2/462) والبيهقي والطحاوي، ويحيل على التمهيد (19/112). {cite:muwatta-maruf-1997 p.48}"
  tr: "Malik, öğle vakti namaz kılmanın yasaklanması bölümünde, el-Esved ibn Sufyan'ın azatlı kölesi Abdullah ibn Yazid'den, o da Ebu Seleme ibn Abdülrahman'dan ve o da Muhammed ibn Abdülrahman ibn Sevban'dan, her ikisi de Ebu Hurayra'dan rivayet ederek şöyle nakletmiştir: Peygamberimiz, sıcaklığın şiddetlendiği zaman namazı ertelemeyi emretmiştir; çünkü bu şiddet, cehennemin yakıcı sıcağındandır. Ayrıca cehennemin Rabbine olan şikayetini ve Rabbin ona yılda iki kez nefes alma iznini de zikretmiştir. Editör, bunu Malik'in sahabelerinin Müslim (2/108), Ahmed (2/462), el-Beyhaki ve el-Tahavi'deki rivayet zincirlerinden çıkarmış ve el-Tamhid'e (19/112) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.48}"
  id: "Malik meriwayatkan hadits ini dari Abdullah ibn Yazid, budak yang dibebaskan oleh al-Aswad ibn Sufyan, dari Abu Salamah ibn Abd al-Rahman dan dari Muhammad ibn Abd al-Rahman ibn Thawban, keduanya dari Abu Hurayrah, dalam surah tentang larangan shalat tengah hari: Nabi memerintahkan untuk menunda shalat ketika panasnya semakin terik karena intensitasnya berasal dari panas neraka yang menyengat, dan beliau menyebutkan keluhan neraka kepada Tuhannya dan izin-Nya agar neraka bernapas dua kali setiap tahun. Editor mengambilnya dari sanad para sahabat Malik dalam Muslim (2/108), Ahmad (2/462), al-Bayhaqi, dan al-Tahawi, dan merujuk pada al-Tamhid (19/112). {cite:muwatta-maruf-1997 p.48}"
