text: "… في القلوبِ وتقديمٍ هوى النفسِ على محبتِهِ وبذلك ينقصُ الإيمانُ كما قالَ لَالِفِ: لا يزني الزاني حينَ يزني وهوَ مؤمنُ الحديث. والدرجةُ الثانيةُ من المحبةِ - وهي فضلٌ مستحبٌ : أن ترتقيَ المحبةُ من ذلك إلى التقربِ بنوافلِ الطاعاتِ والانكفافِ …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 52، يرد فيه ذكر الطاعات، والمستحب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 52, whose wording mentions the acts of obedience, the recommended (mustahabb), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 52 کا اقتباس جس میں طاعات، مستحب، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Fath al-Bari de Ibn Rajab, volume numérisé 1, p. 52, dont le texte mentionne les actes d'obéissance, le recommandé (mustahabb), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen digitalizado 1, p. 52, cuyo texto menciona los actos de obediencia, lo recomendado (mustahabb), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. cildinin 52. sayfasından, farz olan ameller, müstehap olan ameller ve nafile amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, müstehap olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 1, halaman 52, yang menyebutkan amalan ketaatan, amalan anjuran, dan amalan sunnah; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
