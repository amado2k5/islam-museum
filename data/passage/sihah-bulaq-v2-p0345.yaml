text: |-
  ٠٢٤٢
  نبيلة موضع الحجلين خود • وفى الكشيحير والبطن اضطمار
  والنبل الصغارأيضاوهومن الاضداد وقال
  أفرح أن أرزأ الكرام وأن • أورن ذوداشماتصانبلا
  يقول أأفرح بصغار الابل وقد رزئت بكار الكرام وبعضهم يرويه شصائصانبلا با لضم يريد جغ
  نبلة وهى العظيمة والنبل حجارة الاستنجاء وفى الحديث اتقوا الملاءن وأعدوا النبل
  والحعدّثون يقولون النبل بالفتح يقال سميت بذلك لصغرها ونابلته فنبلته اذا كنت أجود نيلا
  منه وقد يكون ذلك فى النبل أيضاونيات فلانا أنيل نبلا بالفتح اذارميته بالنبيل ونبات الابل
  أى قت بمصلحتها وكذلك اذ اسقتها سوقاشديدا وقال الراجز
  لا نأ وبالمعيس وانيلاها * فانه اماسلت قواها• بعيدة المصبح من ممساها
  واستنبلنى قنبلته أى ناواته نيلا ويقمال نبلنى حجارة الاستجاء أى أعطنيها ونبلت فلانا
  بطعامى ناولته شيأبعدشئ وتقول هذارجل متنبل نبلهاذا كان معه نبل وتنبل أيضا أى
  نسكاف النبل وتذبل أى أخذ الانبل فالاتيل وتنبل البعير أى مات قال ابن الاعرابة وتنيل
  الانسان أيضاوغيره والنبيلة الجيفة والتقبال القصير ⁦( ل)⁩ استفتل من الصف اذا تقدم
  أصحابه واستفتل للامر استعدله والنتل جذب الى قدم والنقل أيضابيض النعام علا ماء
  فيدذن فى المفازة والنتل بالتحريك مثلة قال الاعشى بصف مفازة
  لا يتنخى لها فى القيظ يهبطها • الا الذين اهم فيما أنوانتل
  وأمّاقول أبى النجم • يطفن حول نتل وزواز* فيقال هو العبد الضخم وناقل بفتح التاءاسم
  رجل من العرب أبو عمر تنائل النبت أى التفت وصاربعضه أطول من بعض( نثل النشلد
  الدرع الواسعة مثل النثرة ابن السكيت بقال قد نثل درعه أى ألقاها عنه ولا يقال نثرها
  والنئيلة مثل النبيشة وهو تزاب البتر وقد نشلت البترنثلا وا نتثلتها اذا إستخرجت ترابج اوتقول
  حفرتك نقل بالتحويك أى محفورة والئيل الروث قال الاحريقال لسكل حافرثل ونقل اذا
  راث وقال الشاعر يصف برذونا * مثلّ على آريه الروث منثل* ونثلت كتانتى اذا استخرجت
  ما فيها من النبل وكذلك اذا نفضت مافى الجراب من الزاد وتناثل الناس اليه أى انصبوا
  جل النجل النسل ونجله أبوه أى ولده بقال قيح اللّٰه ناجليه وفرس ناجل اذا كان كريم
  الجل ونجل الشئ أى رمى به والناقة تنجل الحصى بمناسمها نجلا أى ترمى به وتدفعه ونجله أى
  طعنه فأوسع شقه ونجلت الاهاب اذ اشققت عن عرقوبيه جميها ثم سلخته كمايسلخ الناس اليوم
  وهواهاب منجول ونجلت الارض احضرّت ونجات الرجل نجلاذاضر بته بمقدّم رجلك
  فتدحرج يقال من نجل الناس نجلوه أى من شارهم شارّوه ويقال استحل الموضع أى
  كثربه النجل وهوالماء يظهر من الارض والجيل ما تكسر من ورق الهوم وهوضرب من
  لحمض قال أبوخراش يصف ماء آجنا * له عرمض مستأسد ونجيل » والنواجل من الابل
  التى ترعاه والمنجل ما يحمد به والنجل بالتحريك سعة شؤ العين والرحل أنجل والعين نجلاء
  والجمع نجل وطعفة نجلاأى واسعة بينة النجل وسسنان منجل أى واسع الطعنة والصصهان
  الانجل هو الواسع ونجلت الشى أى استخرجته والانجل كتاب عيسى عليه السلام يونث
  ويد
