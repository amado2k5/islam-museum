label: { ar: "صحيح مسلم 6259 — تربية الأب ووصيته", en: "Sahih Muslim 6259 — the father raising and counselling", ur: "صحیح مسلم 6259 — باپ کی تربیت اور نصیحت", es: "Sahih Muslim 6259 — La crianza y el consejo del padre" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، وَأَبُو بَكْرِ بْنُ نَافِعٍ قَالَ ابْنُ نَافِعٍ حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، عَنْ عَدِيٍّ، - وَهُوَ ابْنُ ثَابِتٍ - عَنِ الْبَرَاءِ، قَالَ رَأَيْتُ رَسُولَ اللَّهِ وَاضِعًا الْحَسَنَ بْنَ عَلِيٍّ عَلَى عَاتِقِهِ وَهُوَ يَقُولُ \" اللَّهُمَّ إِنِّي أُحِبُّهُ فَأَحِبَّهُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6259، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6259 (The Book of the Merits of the Companions), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6259، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 6259 (El Libro de los Méritos de los Compañeros), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el papel del padre."
