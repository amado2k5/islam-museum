text: "… كانت على الزُّبير عمامةٌ صفراء معتجراً بها يوم بدر، ونزلت الملائكة عليها عمائم صُفْر. وشهد الحُدَيبيّة، والمشاهدَ كلّها، وقد قال رسولُ الله وَلِيِ لن يَلجَ النارَ أحدٌ شهد بدراً والحُدَيبيَة. وقال عمرُ في الستة أهل الشورى : تُوُفِّيَ رسول الله …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 262، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
