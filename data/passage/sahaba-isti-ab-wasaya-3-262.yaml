text: "… كانت على الزُّبير عمامةٌ صفراء معتجراً بها يوم بدر، ونزلت الملائكة عليها عمائم صُفْر. وشهد الحُدَيبيّة، والمشاهدَ كلّها، وقد قال رسولُ الله وَلِيِ لن يَلجَ النارَ أحدٌ شهد بدراً والحُدَيبيَة. وقال عمرُ في الستة أهل الشورى : تُوُفِّيَ رسول الله …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 262، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 262, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 262 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 3, pág. 262, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du traité al-Isti'ab d'Ibn 'Abd al-Barr (tome 3, p. 262), mentionnant un testament ou des adieux, un lit de mort et les dernières heures du défunt; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 3. cildinin 262. sayfasından bir alıntı, vasiyetname veya son vasiyetten ve ölüm saatinden bahsetmektedir; makine tarafından okunabilir taranmış kopyadan alınan metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 3 bergambar, halaman 262, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari salinan hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti wasiat, warisan, barang antik, dan makam suci."
