label: { ar: "سنن النسائي 827 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 827 — the father raising and counselling", ur: "سنن نسائی 827 — باپ کی تربیت اور نصیحت", es: "Sunan al-Nasa'i 827 — El padre que cría y aconseja", fr: "Sunan al-Nasa'i 827 — l'éducation et les conseils du père", tr: "Sunan an-Nasa'i 827 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan an-Nasa'i 827 — Didikan dan Wasiat Ayah" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ عُثْمَانَ بْنِ أَبِي سُلَيْمَانَ، عَنْ عَامِرِ بْنِ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، عَنْ عَمْرِو بْنِ سُلَيْمٍ الزُّرَقِيِّ، عَنْ أَبِي قَتَادَةَ، قَالَ رَأَيْتُ رَسُولَ اللَّهِ يَؤُمُّ النَّاسَ وَهُوَ حَامِلٌ أُمَامَةَ بِنْتَ أَبِي الْعَاصِ عَلَى عَاتِقِهِ فَإِذَا رَكَعَ وَضَعَهَا وَإِذَا رَفَعَ مِنْ سُجُودِهِ أَعَادَهَا."
summary:
  ar: "حديث في سنن النسائي، رقم 827، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 827 (The Book of Leading the Prayer (Al-Imamah)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 827، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 827 (El Libro de la Oración (Al-Imamah)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 827 (Le Livre de la prière (Al-Imamah)), mentionne le rôle du père dans l'éducation et les conseils des enfants. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 827 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 827, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini disusun oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
