text: "… فقد أولهما انى أعيش يومين ونصفا، أو شهرين ونصفا، اوسنتين ونصفا، ثم الحق. فتوفى بالكوفة ليلة الثلاثاء لا نسلاخ شعبان سنة تسع عشرة ومائتين بعد هذه الرؤيا بثلاثين شهرا قامة. وقالوا إنه اشتكى قبل ان يموت بيوم ليلة الثلاثاء. فاوصى …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 3، ص 353، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Khatib al-Baghdadi's Tarikh Baghdad, scan volume 3, p. 353, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ بغداد، خطیب بغدادی، اسکین جلد 3، ص 353 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh Baghdad de al-Khatib al-Baghdadi, volumen 3, pág. 353, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Tarikh Bagdad d'al-Khatib al-Baghdadi, volume 3, page 353, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "El-Hatib El-Bağdadi'nin Bağdat Tarihi, Resimli Cilt 3, sayfa 353'ten bir alıntı, vasiyetname veya son vasiyetten ve ölüm saatinden bahsetmektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, antik eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Baghdad karya Al-Khatib Al-Baghdadi, Jilid 3 Bergambar, halaman 353, menyebutkan surat wasiat atau testamen terakhir, dan saat kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti surat wasiat, warisan, barang antik, dan tempat-tempat suci."
