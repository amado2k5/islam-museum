text: "… فقد أولهما انى أعيش يومين ونصفا، أو شهرين ونصفا، اوسنتين ونصفا، ثم الحق. فتوفى بالكوفة ليلة الثلاثاء لا نسلاخ شعبان سنة تسع عشرة ومائتين بعد هذه الرؤيا بثلاثين شهرا قامة. وقالوا إنه اشتكى قبل ان يموت بيوم ليلة الثلاثاء. فاوصى …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 3، ص 353، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
