text: "… تعالَى عنْه، عنِ النَّبِىّ عَلَ، قالَ : كانَ الكِتَابُ الأوْلُ نَزَلَ مِنْ بَابٍ وَاحِدٍ، عَلَى حَرْفٍ وَاحدٍ، ونزَلَ القرآنُ مِنْ سبعةِ أبوابٍ عَلَى سبْعِةِ أحْرُف زاجرًا وآمرًا وحلَال وحرامٌ ومحكمٌ ومُتَشَابةٌ وأمثالٌ. فاحِلْوا حلالَهُ، وحرِّمُوا حَرَامَهُ، وافْعَلُوا مَا أُمِرْتُمْ بِهِ، …"
