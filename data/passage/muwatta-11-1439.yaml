label: { ar: "الموطأ 1439 — مالك: أحسن ما سمع في المضطر إلى الميتة أن يأكل منها حتى يشبع ويتزود، فإن وجد عنها غنى طرحها", en: "Muwatta 1439", es: "Muwatta 1439", fr: "Muwatta 1439", ur: "موطا 1439", tr: "El-Muvatta 1439 — Malik: Leş yemeye zorlanan biri hakkında duyduğum en iyi şey şudur: Doyana kadar yemeli ve yiyecek bir şeyler almalı, eğer yiyeceği yeterliyse de atmalıdır.", id: "Al-Muwatta 1439 — Malik: Nasihat terbaik yang pernah saya dengar mengenai seseorang yang terpaksa memakan bangkai adalah bahwa ia harus memakannya sampai kenyang dan mengambil bekal, dan jika ia mendapati dirinya masih memiliki cukup makanan, maka ia harus membuangnya." }
summary:
  ar: "يقول يحيى إن مالكا قال أحسن ما سمع في الرجل يضطر إلى الميتة أنه يأكل منها حتى يشبع ويتزود منها، فإن وجد عنها غنى طرحها. {cite:muwatta-maruf-1997 p.644}"
  tr: "Yahya, Malik'in leş yemek zorunda kalan bir adam hakkında duyduğu en iyi şeyin, doyana kadar yemesi, bir kısmını da kendine ayırması, eğer yeterince zenginleşirse de leşi atması olduğunu söylediğini aktarır. {cite:muwatta-maruf-1997 s.644}"
  id: "Yahya mengatakan bahwa Malik mengatakan hal terbaik yang pernah didengarnya mengenai seorang pria yang terpaksa memakan bangkai adalah bahwa ia harus memakannya sampai kenyang dan mengambil sebagian untuk dirinya sendiri, dan jika ia merasa cukup kaya untuk tidak memakannya, ia harus membuangnya. {cite:muwatta-maruf-1997 p.644}"
