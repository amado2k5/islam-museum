text: "… يكتبون القُرآن، أو أَنْ تتوزَّع جهودهم وهي لا تحتمل أن يكتبوا جميع السُّنَّة وجميع القرآن فقصرهم على الأهمِّ أَوَّلا وهو القرآن، خُصُوصاً إذا لاحظنا أن أدوات الكتابة كانت نادرة لديهم إِلَى حَدٌّ بعيد، حتى كانوا يكتبون في اللخَافِ والسَّعف والعظام …"
summary:
