label: { ar: "الموطأ 2044 — يحيى عن مالك: فيمن دفع إلى رجل مالا قراضا فابتاع به سلعة، فقال له صاحب المال: بعها، وقال العامل: لا أرى وجه بيع: لا ينظر إلى قول واحد منهما، ويسأل أهل المعرفة بتلك السلعة، فإن رأوا وجه بيع بيعت، وإن رأوا وجه انتظار انتظر بها", en: "Muwatta 2044", es: "Muwatta 2044", fr: "Muwatta 2044", ur: "موطا 2044", tr: "El-Muvatta 2044 — Yahya, Malik'ten rivayetle: Bir kimse bir adama borç para verir ve adam bu parayla mal alır. Borç veren ona, \"Sat bunu\" der. İşçi ise, \"Satmak için bir gerekçe göremiyorum\" der. Her iki söz de dikkate alınmaz ve o mal hakkında bilgisi olanlara danışılır. Eğer satmak için bir gerekçe görürlerse, satılır; eğer beklemek için bir gerekçe görürlerse, beklenir.", id: "Al-Muwatta 2044 — Yahya dari Malik: Mengenai seseorang yang memberi uang kepada seseorang sebagai pinjaman, dan orang itu membeli barang dengan uang tersebut, dan pemilik uang itu berkata kepadanya: Jual saja, dan pekerja itu berkata: Aku tidak melihat alasan untuk menjualnya: maka kedua pernyataan mereka tidak dipertimbangkan, dan orang-orang yang berpengetahuan tentang barang tersebut dimintai pendapatnya. Jika mereka melihat alasan untuk menjualnya, maka barang itu dijual, dan jika mereka melihat alasan untuk menunggu, maka barang itu ditunggu." }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، فابتاع به سلعة، فقال له صاحب المال: بعها، وقال الذي أخذ المال: لا أرى وجه بيع، فاختلفا في ذلك. قال: لا ينظر إلى قول واحد منهما، ويسأل أهل المعرفة والبصر بتلك السلعة. فإن رأوا وجه بيع بيعت عليهما، وإن رأوا وجه انتظار انتظر بها. {cite:muwatta-maruf-1997 p.235}"
  tr: "Yahya şöyle dedi: Malik, bir adamın başka bir adama borç para verdiğini ve borcun bu parayla bir mal satın aldığını anlattı. Parayı alan kişi ona, \"Sat onu\" dedi; parayı alan ise, \"Satmak için bir gerekçe göremiyorum\" dedi ve bu konuda anlaşmazlığa düştüler. Malik şöyle dedi: \"İkisinin de sözü dikkate alınmamalıdır. Aksine, o mal konusunda bilgili ve deneyimli olanlara danışılmalıdır. Eğer satmak için bir gerekçe görürlerse, onlara satılmalıdır. Eğer beklemek için bir gerekçe görürlerse, beklenmelidir.\" {cite:muwatta-maruf-1997 s.235}"
  id: "Yahya berkata: Malik berkata tentang seorang pria yang memberikan uang kepada pria lain sebagai pinjaman, dan pria yang menerima uang itu membeli suatu barang dengan uang tersebut. Pemilik uang itu berkata kepadanya, \"Jual saja,\" sementara orang yang menerima uang itu berkata, \"Saya tidak melihat alasan untuk menjualnya,\" dan mereka berselisih pendapat tentang hal ini. Beliau berkata: Tidak satu pun dari pernyataan mereka yang boleh dipertimbangkan. Sebaliknya, orang-orang yang berpengetahuan dan berpengalaman dalam barang tersebut harus dimintai pendapatnya. Jika mereka melihat alasan untuk menjualnya, maka barang itu harus dijual kepada mereka. Jika mereka melihat alasan untuk menunggu, maka barang itu harus ditunggu. {cite:muwatta-maruf-1997 p.235}"
