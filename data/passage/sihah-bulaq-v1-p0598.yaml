text: |-
  ⁦( ف صل الحاء)⁩
  ⁦(حشب)⁩
  ٤٣
  أيضاوهو فعل بعنى مفعول مثل نفض بمعدى منفوض ومنه قولهم امكن عملك بحسب ذلك
  أى على قدره وعدده قال الكسائىّ ما أدرى ماحسب حدبشك أى ماقدره وربماسكر
  فى ضرورة الشعر والحسب أيضاما يعه الانسان من مفاخرآباته ويقال حسبه دينه
  ويقال ماله والرجل حسيب وقد حسب بالضم حسابة مثل خطب خطابة قال ابن السكيت
  الحسب والمكرم يحكونان فى الزجل وان لم يمكن له آباءلهم شرف قال والشرف واتجد
  لا يكونان الابالاباء وحاسبته من المحاسبة واحتسيت عليه كذا اذا أنسكرته عليه قاله
  ابن دريدواحتسبت بكذا أجراعند الله والاسم الحسبة بالكسر وهى الاجر والجمع الحسب
  وفلان محتسب البلد ولا تقسل محسب واحتسب فلان ابناله أو بنتا اذا مامات وه وكبه
  فان سات صغيراقيل اقترطه ويقسال أيضا انه لحسن الحسبة فى الامراذا كان حدن التدبيرة
  والحسبة أيضامن الحساب مثل القعدة والركبة والجلسة قال النابغة
  نكمات مائة فيه حامتها * وأسرعت حسبة فى ذلك العددة
  وأحبنى الشاى كفانى وأحسبته وحسبته بالتشديد بمعنى اى أعطمته ما يرضبه
  قال الشاءر ١ ونقفى وليد الحى ان كان جائعا * وشعدبه ان كان ليسر بجائع
  أى نعطيه حتى يقول حسى وحسبك درهم أى كفاكوه واسم وشئ حساب أى كاف ومنه
  قوله تعالى عطء حسابااى كافيا وتقول أعطى فأحسب أى أكثروه_ذارجل حسبت
  من رجل وه ومدح للنكرة لان فيه تأويل فعل كأنه قال محسب لنْ أى كاف لك من عيره
  بستوى فيه الواحد والجمع والثننية لانه مصدر وتقول فى المعرفة هذاعبد اللّه حسبك
  من رحل فتنصب حسبكء-لى الحال وان أردت الفعل فى حسبك قلت مررت برجل
  أحسبك من رجل وبرجلين أحسبال وبرجال أحسبول ولك أن تمكلم بحسب مقردة
  تقول رأيت ز يداحسب يافتى كأنك قلت حسبى أو حسبك فأضمرن هذا فلذلك
  لم تنوّن لانك أردت الاضافة كما تقول جانى زيدايس غير تريدليس غيره عندى وقوله-م
  حيبك اللّٰه أى انتقم اللّٰه منك والحسبان بالضم العذاب وقال أبو زياد الكلاتي أصاب
  الارض حسبان أى حراد والحسبان الحساب قال اللّٰه تعالى الشّمس والقمر بحسبان
  قال الاخفس الحسيان جماعة الحساب مثل شهاب وشهبان والحسبان أيضاسهام قصارا
  الواحدة حسبانة والحسبانة أيضا الوسادة الصغيرة تقول منه حسبته اذا وسدته قال نهك
  الفزارى ٢ لتقيت بالوجعاء طعنة مرهف * حرّان اولثويت غير محسب
  أى غيره وسديه-ى غير مكرم ولا مكفن وتحسبت الخبرأى استخبرت وقال رجل من
  فى الهجيم تحسب هوّاس وأيقن أنى * بهامفتدمن واحدلا أغامرم
  يقول تشمم الاسد ناقتى وظنّ أنى أتركها له ولا أقاتله والاحسب من الابل هو الذى فيه بياض
  وحرم تقول منه آحسبّ البعبر احسبابا والاحسب من الناس الذى فى شعرر أسه
  شقرة وقال امر ؤالقيس
  أياهند لا تنكمى بوهة • عليه عقيقته احسبا
  يصفه باللؤم والشح يقول كانه لم تحلق عقيقته فى صغره حتى شاخ وحسبته صالحا أحسبه
  بالفتح محسبة ومحسبة وحسبانا بالكسر أى ظننته ويقال أحبه بالمكسر وهوشاذلان
  ⁦(١)⁩ امر أة من يحد قشير احش
  ⁦(٣)⁩ يخاطب عامى بن الطفيل
  اه مرتضع
