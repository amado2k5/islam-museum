summary:
  ar: "القسم 25 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأطعمة عن رسول الله»، ويضم فيها النصوص من 1788 إلى 1860 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 25 of Jami' al-Tirmidhi (The Book on Food) in the division of the open hadith dataset the museum took its reports from: reports 1788 to 1860 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 25، عنوان «کتاب الاطعمۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1788 تا 1860۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 25 de Jami' al-Tirmidhi (El Libro de la Alimentación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1788 al 1860, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 25 du Jami' al-Tirmidhi (Le Livre de la nourriture), qui comprend les hadiths 1788 à 1860 selon la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı Açık Hadis Veritabanı'ndaki Cami' el-Tirmizi'nin 25. bölümü \"Allah'ın Elçisinden Yiyecekler Kitabı\" başlığını taşımakta olup, 1788'den 1860'a kadar olan metinleri buna göre numaralandırılmış olarak içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 25 dari Jami' al-Tirmidhi, dalam Basis Data Hadits Terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Makanan dari Rasulullah\" dan berisi teks-teks dari tahun 1788 hingga 1860, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
