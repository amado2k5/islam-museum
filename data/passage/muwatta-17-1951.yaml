label: { ar: "الموطأ 1951 — يحيى عن مالك: الأمر المجتمع عليه عندنا في البز يشتريه الرجل ببلد ثم يقدم به بلدا آخر فيبيعه مرابحة، أنه لا يحسب فيه أجر السماسرة ولا الطي ولا الشد ولا النفقة ولا كراء البيت، وكراء البز في حملانه يحسب في أصل الثمن", en: "Muwatta 1951", es: "Muwatta 1951", fr: "Muwatta 1951", ur: "موطا 1951", tr: "El-Muvatta 1951 — Yahya, Malik'ten rivayetle: Bir kişinin bir ülkeden satın alıp başka bir ülkeye kâr amacıyla satmak üzere götürdüğü kumaşla ilgili olarak aramızdaki yerleşik uygulama şudur: Komisyon ücretleri, katlama, paketleme, masraflar ve depo kirası fiyata dahil edilmez. Ancak, kumaşın nakliyesi sırasında oluşan kira bedeli asıl fiyata dahildir.", id: "Al-Muwatta 1951 — Yahya berdasarkan riwayat Malik: Kebiasaan yang berlaku di antara kita mengenai kain yang dibeli seseorang di satu negara dan kemudian dibawa ke negara lain untuk dijual dengan keuntungan adalah bahwa biaya perantara, pelipatan, pengemasan, pengeluaran, dan sewa rumah tidak termasuk dalam harga. Namun, biaya sewa kain selama pengangkutannya termasuk dalam harga asli." }
summary:
  ar: "يروي يحيى قال مالك: الأمر المجتمع عليه عندنا في البز يشتريه الرجل ببلد، ثم يقدم به بلدا آخر فيبيعه مرابحة، إنه لا يحسب فيه أجر السماسرة، ولا أجر الطي ولا الشد، ولا النفقة، ولا كراء بيت. فأما كراء البز في حملانه، فإنه يحسب في أصل الثمن، ولا يحسب فيه ربح، إلا أن يعلم البائع من يساومه بذلك كله، فإن ربحوه على ذلك كله بعد العلم به، فلا بأس به. {cite:muwatta-maruf-1997 p.198}"
  tr: "Yahya, Malik'in şöyle dediğini rivayet etmiştir: \"Bizim aramızda kumaş konusunda yerleşik uygulama şudur: Bir kişi kumaşı bir şehirden alıp, kârla satmak üzere başka bir şehre götürür. Komisyon ücretleri, katlama ve paketleme ücretleri, masraflar ve ev kirası fiyata dahil edilmez. Ancak kumaşın nakliyesi için ödenen kira, asıl fiyata dahildir ve satıcı, tüm bunlar üzerinde kimin pazarlık yaptığını bilmediği sürece, buna kâr eklenmez. Eğer satıcı bunu bildikten sonra kâr elde ederse, bunda bir sakınca yoktur.\" {cite:muwatta-maruf-1997 s.198}"
  id: "Yahya meriwayatkan bahwa Malik berkata: Kebiasaan yang berlaku di antara kita mengenai kain, di mana seseorang membelinya di satu kota dan kemudian membawanya ke kota lain untuk menjualnya dengan keuntungan, adalah bahwa biaya perantara, biaya melipat dan mengemas, pengeluaran, dan sewa rumah tidak termasuk. Namun, biaya sewa untuk mengangkut kain termasuk dalam harga asli, dan tidak ada keuntungan yang ditambahkan, kecuali jika penjual mengetahui siapa yang bernegosiasi dengannya mengenai semua itu. Jika mereka kemudian memperoleh keuntungan dari semua itu setelah mengetahuinya, tidak ada yang salah dengan itu. {cite:muwatta-maruf-1997 p.198}"
