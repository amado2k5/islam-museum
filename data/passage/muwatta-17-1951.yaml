label: { ar: "الموطأ 1951 — يحيى عن مالك: الأمر المجتمع عليه عندنا في البز يشتريه الرجل ببلد ثم يقدم به بلدا آخر فيبيعه مرابحة، أنه لا يحسب فيه أجر السماسرة ولا الطي ولا الشد ولا النفقة ولا كراء البيت، وكراء البز في حملانه يحسب في أصل الثمن", en: "Muwatta 1951" }
summary:
  ar: "يروي يحيى قال مالك: الأمر المجتمع عليه عندنا في البز يشتريه الرجل ببلد، ثم يقدم به بلدا آخر فيبيعه مرابحة، إنه لا يحسب فيه أجر السماسرة، ولا أجر الطي ولا الشد، ولا النفقة، ولا كراء بيت. فأما كراء البز في حملانه، فإنه يحسب في أصل الثمن، ولا يحسب فيه ربح، إلا أن يعلم البائع من يساومه بذلك كله، فإن ربحوه على ذلك كله بعد العلم به، فلا بأس به. {cite:muwatta-maruf-1997 p.198}"
