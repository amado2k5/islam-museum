text: "ل. والثانية: التي ذكرها ابن إسحاق. فإن فيها قصته مع دحية بالكتاب إلى قيصر، وأنه أسلم فقتل، والله أعلم. قلت: غزوة تبوك كانت في سنة تسع من الهجرة. وذكر ابن جرير الطبري بعث دحية بالكتاب إلى قيصر في سنة ثمان."
