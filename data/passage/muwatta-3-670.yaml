label: { ar: "الموطأ 670 — مالك: المعدن بمنزلة الزرع يؤخذ منه يوم يخرج ولا ينتظر به الحول", en: "Muwatta 670" }
summary:
  ar: "قول لمالك: المعدن بمنزلة الزرع، يؤخذ منه مثل ما يؤخذ من الزرع؛ يؤخذ منه إذا خرج من المعدن من يومه ذلك ولا يُنتظر به الحول، كما يؤخذ من الزرع إذا حُصد العشر ولا يُنتظر أن يحول عليه الحول. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.339} {cite:muwatta-maruf-1997 p.340}"
