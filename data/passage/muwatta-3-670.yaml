label: { ar: "الموطأ 670 — مالك: المعدن بمنزلة الزرع يؤخذ منه يوم يخرج ولا ينتظر به الحول", en: "Muwatta 670", es: "Muwatta 670", fr: "Muwatta 670", ur: "موطا 670", tr: "Al-Muwatta 670 — Malik: Madenler ekinler gibidir; çıkarıldıkları gün hasat edilirler ve bir yıla ihtiyaç duyulmaz.", id: "Al-Muwatta 670 — Malik: Mineral itu seperti tanaman; dipanen pada hari diekstraksi, dan tidak membutuhkan waktu setahun." }
summary:
  ar: "قول لمالك: المعدن بمنزلة الزرع، يؤخذ منه مثل ما يؤخذ من الزرع؛ يؤخذ منه إذا خرج من المعدن من يومه ذلك ولا يُنتظر به الحول، كما يؤخذ من الزرع إذا حُصد العشر ولا يُنتظر أن يحول عليه الحول. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.339} {cite:muwatta-maruf-1997 p.340}"
  tr: "Malik şöyle demiştir: Madenler tıpkı ekinler gibidir; onlardan da ekinlerden alınan zekât gibi zekât alınır. Zekât, madenden çıkarılır çıkarılmaz, bir yıl geçmesine gerek kalmadan alınır; tıpkı ekinlerden de bir yıl geçmesine gerek kalmadan, hasat edildikten hemen sonra zekât alınması gibi. Araştırmacı, bu rivayetin Ebu Mus'ab tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.339} {cite:muwatta-maruf-1997 s.340}"
  id: "Malik berkata: Mineral itu seperti tanaman; zakat yang diambil dari mineral sama dengan zakat yang diambil dari tanaman. Zakat diambil dari mineral segera setelah diekstraksi dari tambang, tanpa menunggu satu tahun berlalu, sama seperti zakat yang diambil dari tanaman segera setelah dipanen, tanpa menunggu satu tahun berlalu. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.339} {cite:muwatta-maruf-1997 p.340}"
