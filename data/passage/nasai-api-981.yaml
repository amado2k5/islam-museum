label: { ar: "سنن النسائي 981 — اليتيم وفقد الأب", en: "Sunan al-Nasa'i 981 — the orphan and the father lost", ur: "سنن نسائی 981 — یتیم اور باپ کی موت", es: "Sunan al-Nasa'i 981 — El huérfano y el padre perdido", fr: "Sunan al-Nasa'i 981 — L'orphelin et le père perdus", tr: "Sunan an-Nasa'i 981 — Yetim ve Babasını Kaybetmesi", id: "Sunan an-Nasa'i 981 — Anak Yatim dan Kehilangan Ayah" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا الْعَطَّافُ بْنُ خَالِدٍ، عَنْ زَيْدِ بْنِ أَسْلَمَ، قَالَ دَخَلْنَا عَلَى أَنَسِ بْنِ مَالِكٍ فَقَالَ صَلَّيْتُمْ قُلْنَا نَعَمْ. قَالَ يَا جَارِيَةُ هَلُمِّي لِي وَضُوءًا مَا صَلَّيْتُ وَرَاءَ إِمَامٍ أَشْبَهَ صَلاَةً بِرَسُولِ اللَّهِ مِنْ إِمَامِكُمْ هَذَا. قَالَ زَيْدٌ وَكَانَ عُمَرُ بْنُ عَبْدِ الْعَزِيزِ يُتِمُّ الرُّكُوعَ وَالسُّجُودَ وَيُخَفِّفُ الْقِيَامَ وَالْقُعُودَ."
summary:
  ar: "حديث في سنن النسائي، رقم 981، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 981 (The Book of the Commencement of the Prayer), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 981، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 981 (El Libro del Inicio de la Oración), menciona al huérfano y al padre fallecido. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
  fr: "Un hadith du Sunan an-Nasa'i, n° 981 (Le Livre du Commencement de la Prière), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 981 numaralı hadis, yetimlerden ve babasızlık durumundan bahsetmektedir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 981, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
