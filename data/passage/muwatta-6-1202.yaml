label: { ar: "الموطأ 1202 — مالك: الأمر عندنا أن التكبير في أيام التشريق دبر الصلوات، أوله ظهر يوم النحر وآخره صبح آخر أيام التشريق", en: "Muwatta 1202", es: "Muwatta 1202", fr: "Muwatta 1202", ur: "موطا 1202", tr: "El-Muvatta 1202 — Malik: Bizde teşrik günlerinde tekbir, kurban günündeki öğle namazından başlayıp teşrik günlerinin son günündeki sabah namazıyla sona eren namazlardan sonra yapılır.", id: "Al-Muwatta 1202 — Malik: Kebiasaan di antara kami adalah takbir pada hari-hari Tasyriq dilakukan setelah salat, dimulai dengan salat Zuhur pada hari raya Kurban dan diakhiri dengan salat Subuh pada hari terakhir Tasyriq." }
text: "التَّكْبِيرَ في أَيامِ التَّشْريقِ دُبُرَ الصَّلَوَاتِ"
summary:
  ar: "يقول مالك إن الأمر عندهم أن التكبير في أيام التشريق يكون دبر الصلوات، وأوله تكبير الإمام والناس معه دبر صلاة الظهر من يوم النحر، وآخره تكبير الإمام والناس معه دبر صلاة الصبح من آخر أيام التشريق، ثم يقطع التكبير. {cite:muwatta-maruf-1997 p.540}"
  tr: "Malik, onların teşrik günlerinde namazlardan sonra tekbir (Allahu Ekber) getirme uygulamasının olduğunu söylüyor. İlk tekbir, Kurban Bayramı günü öğle namazından sonra imam ve cemaat tarafından getirilir; son tekbir ise teşrik günlerinin son gününde sabah namazından sonra imam ve cemaat tarafından getirilir ve bundan sonra tekbir kesilir. {cite:muwatta-maruf-1997 s.540}"
  id: "Malik mengatakan bahwa kebiasaan mereka adalah membaca Takbir (Allahu Akbar) setelah shalat pada hari-hari Tashreeq. Bacaan pertama dilakukan oleh Imam dan jamaah setelah shalat Dzuhur pada Hari Raya Idul Adha, dan yang terakhir dilakukan oleh Imam dan jamaah setelah shalat Subuh pada hari terakhir Tashreeq, setelah itu Takbir dihentikan. {cite:muwatta-maruf-1997 p.540}"
