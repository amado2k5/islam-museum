  ar: "يقول مالك إن الأمر عندهم أن التكبير في أيام التشريق يكون دبر الصلوات، وأوله تكبير الإمام والناس معه دبر صلاة الظهر من يوم النحر، وآخره تكبير الإمام والناس معه دبر صلاة الصبح من آخر أيام التشريق، ثم يقطع التكبير. {cite:muwatta-maruf-1997 p.540}"
