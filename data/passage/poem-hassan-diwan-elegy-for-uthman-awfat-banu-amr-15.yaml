  tr: "Osman için yazılan mersiyeden bir ayet: “Amr ibn Awf’ın oğulları görevlerini yerine getirdiler,” tıpkı Al-Barquqi’nin Hasan’ın Divanı üzerine yaptığı tefsirde olduğu gibi {{cite:sharh-diwan-hassan-barquqi-1929 s.185}}."
