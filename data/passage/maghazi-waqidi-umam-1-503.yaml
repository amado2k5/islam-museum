text: "… ابنا سَعِيّة، وأَسد بن عُبَيد عمّهم : يا معشر بنى قُرَيْظَة، واللهِ إنكم لَتعلمون أَنه رسول اللّٰه وأَنَّ صفته عندنا، حدّثنا بها علماونا وعلماء بنى النّضير. هذا أَوّلهم - يعنى حُيَىّ بن أَخْطَب.. مع جُبَير بن الهَيِّّبان أَصدقُ الناسِ عندنا، …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 503، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
