text: "م. وأول الأوائل القديمة وأشهرها هو كون مبدأ البشر. ولأهل الكتاب من اليهود والنصارى والمجوس فى كيفيته وسياقة التاريخ منه خلاف لا يجوز مثله فى التواريخ. وكل ما تتعلق معرفته ببدء الخلق وأحوال القرون السالفة، فإنه مختلط بتزويرات وأساطير، لبعد"
