label: { ar: "جامع الترمذي 251 — المستحب", en: "Jami' al-Tirmidhi 251 — the recommended (mustahabb)", ur: "جامع ترمذی 251 — مستحب", fr: "Jami' al-Tirmidhi 251 — le recommandé (mustahabb)", es: "Yami' al-Tirmidhi 251 — lo recomendado (mustahabb)", tr: "Cami' el-Tirmizi 251 — Tavsiye Edilen", id: "Jami' al-Tirmidhi 251 — Yang Dianjurkan" }
text: "… قَرَأَ : ⁦(وَلاَ الضَّالِّينَ )⁩. قَالَ وَكَانَ يُعْجِبُهُ إِذَا فَرَغَ مِنَ الْقِرَاءَةِ أَنْ يَسْكُتَ حَتَّى يَتَرَادَّ إِلَيْهِ نَفَسُهُ. قَالَ وَفِي الْبَابِ عَنْ أَبِي هُرَيْرَةَ. قَالَ أَبُو عِيسَى حَدِيثُ سَمُرَةَ حَدِيثٌ حَسَنٌ. وَهُوَ قَوْلُ غَيْرِ وَاحِدٍ مِنْ أَهْلِ الْعِلْمِ يَسْتَحِبُّونَ لِلإِمَامِ أَنْ يَسْكُتَ بَعْدَ مَا يَفْتَتِحُ الصَّلاَةَ وَبَعْدَ الْفَرَاغِ مِنَ الْقِرَاءَةِ. وَبِهِ يَقُولُ أَحْمَدُ وَإِسْحَاقُ وَأَصْحَابُنَا."
summary:
  ar: "حديث في جامع الترمذي، رقم 251، يرد فيه ذكر المستحب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 251 (The Book on Salat (Prayer)), whose wording mentions the recommended (mustahabb). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 251، جس کے الفاظ میں مستحب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 251, dont le texte mentionne le recommandé (mustahabb). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 251, cuyo texto menciona lo recomendado (mustahabb). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 251 numaralı hadis, tavsiye edilen amellerden bahsetmektedir. Farz, tavsiye edilen, mekruh edilen, haram ve küçük günahları derleyen kişi, bu konularla ilgili olarak Kur'an, Sünnet, biyografi ve Sahabe ve Salihlerden rivayetler içermektedir. Derleyici metnin içeriğini tanımlar ancak buna dayanarak fetva vermez."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 251, menyebutkan amalan-amalan yang dianjurkan. Penyusun kitab tentang amalan wajib, anjuran, makruh, haram, dan dosa-dosa kecil mencakup teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut. Penyusun kitab menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
