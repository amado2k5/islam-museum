label: { ar: "مسلم 2609 — ليس الشديد بالصرعة إنما الشديد الذي يملك نفسه عند الغضب", en: "Muslim 2609 — The strong is not the wrestler; the strong controls himself in anger", es: "Musulmán 2609 — El fuerte no es el luchador; el fuerte se controla a sí mismo en la ira.", fr: "Muslim 2609 — Le fort n'est pas le lutteur; le fort se maîtrise dans la colère", ur: "مسلم 2609 — طاقتور پہلوان نہیں ہوتا۔ مضبوط غصے میں خود پر قابو رکھتا ہے۔", tr: "Müslim 2609 — Güçlü kişi, başkalarına üstünlük sağlayan değil, öfkelendiğinde kendini kontrol edebilen kişidir.", id: "Muslim 2609 — Orang yang kuat bukanlah orang yang menindas orang lain, tetapi orang yang kuat adalah orang yang mampu mengendalikan diri saat marah." }
text: "قال رسول الله: «ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب»"
summary:
  ar: "رواية أبي هريرة في الباب نفسه من كتاب البر في صحيح مسلم؛ الصيغة الموجزة المشهورة لإعادة تعريف الشدة بضبط النفس عند الغضب."
  tr: "Sahih Müslim'in Salihlik Kitabı'nın aynı bölümünde Ebu Hurayra'nın rivayetinde; öfke anında sertliği özdenetim olarak yeniden tanımlamanın ünlü ve özlü formülü yer almaktadır."
  id: "Riwayat Abu Hurairah dalam bab yang sama dari Kitab Kebajikan dalam Sahih Muslim; rumusan singkat yang terkenal untuk mendefinisikan kembali kekerasan sebagai pengendalian diri saat marah."
