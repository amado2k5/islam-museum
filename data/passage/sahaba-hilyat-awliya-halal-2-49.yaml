text: "… علان الوراق ثناجمر الفريانى ثنا منجاب بن الحارث ثنا على بن مسمر منا هشام بن عروة عن أبيه. قال : ما رأيت أحداً من الناس أعلم بالقرآن ولا بفريضة ولا بحلال ولا بحرام ولا بشعر ولا بحديث العرب - علية …"
