text: "… علان الوراق ثناجمر الفريانى ثنا منجاب بن الحارث ثنا على بن مسمر منا هشام بن عروة عن أبيه. قال : ما رأيت أحداً من الناس أعلم بالقرآن ولا بفريضة ولا بحلال ولا بحرام ولا بشعر ولا بحديث العرب - علية …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 49، يذكر الحلال، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 49, that mentions the lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 49 کا اقتباس جس میں حلال، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 2, pág. 49, que menciona lo lícito y lo ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 2, page 49, mentionnant le licite et l'illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le Halal and Haram Browser."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 2. cildinin 49. sayfasından, helal ve haram olanı ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid 2 bergambar, halaman 49, membahas tentang apa yang diperbolehkan dan diharamkan; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
