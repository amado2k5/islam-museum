label: { ar: "الموطأ 2212 — مالك عن هشام بن عروة عن أبيه عن عائشة: قال رجل للنبي إن أمي افتلتت نفسها، وأراها لو تكلمت تصدقت، أفأتصدق عنها؟ قال: نعم", en: "Muwatta 2212", es: "Muwatta 2212", fr: "Muwatta 2212", ur: "موطا 2212", tr: "El-Muvatta 2212 — Malik, Hişam ibn Urve'den, o da babasından, o da Aişe'den rivayetle: Bir adam Peygamberimize şöyle dedi: “Annem aniden vefat etti ve bence konuşabilseydi sadaka verirdi. Onun adına sadaka vermeli miyim?” Peygamberimiz “Evet” dedi.", id: "Al-Muwatta 2212 — Malik, dari Hisham ibn Urwah, dari ayahnya, dari Aisyah: Seorang laki-laki berkata kepada Nabi, “Ibuku meninggal dunia secara tiba-tiba, dan aku pikir seandainya ia dapat berbicara, ia pasti akan memberikan sedekah. Haruskah aku memberikan sedekah atas namanya?” Beliau menjawab, “Ya.”" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن عائشة زوج النبي أن رجلا قال لرسول الله: إن أمي افتلتت نفسها، وأراها لو تكلمت تصدقت، أفأتصدق عنها؟ فقال رسول الله: نعم. {cite:muwatta-maruf-1997 p.306} {cite:muwatta-maruf-1997 p.307}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından, o da Peygamberimizin eşi Ayşe'den rivayet ettiğine göre, bir adam Resulullah'a şöyle dedi: \"Annem aniden vefat etti ve inanıyorum ki, eğer konuşabilseydi, sadaka verirdi. Onun adına sadaka vereyim mi?\" Resulullah şöyle buyurdu: \"Evet.\" {cite:muwatta-maruf-1997 s.306} {cite:muwatta-maruf-1997 s.307}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, istri Nabi, bahwa seorang laki-laki berkata kepada Rasulullah: “Ibuku meninggal dunia secara tiba-tiba, dan aku yakin seandainya ia dapat berbicara, ia pasti akan memberikan sedekah. Haruskah aku memberikan sedekah atas namanya?” Rasulullah menjawab: “Ya.” {cite:muwatta-maruf-1997 p.306} {cite:muwatta-maruf-1997 p.307}"
