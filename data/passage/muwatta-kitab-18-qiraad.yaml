summary:
  ar: "كتاب القراض، الكتاب الثامن عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 42 نصا (2007–2048) في خمسة عشر بابا، من الصفحة 221 إلى الصفحة 237 من ملف PDF المجلد الثاني. يبدأ بقراض عمر لابنيه وأبي موسى الأشعري، ويبين ما يجوز من القراض وما لا يجوز من شروطه وديونه ونفقته، والتعدي فيه والمحاسبة عليه، ويختم بجامع أحكامه. {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.237}"
  en: "The Book of Profit-Sharing (qiradh), eighteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 42 reports (2007–2048) in fifteen babs, PDF pp. 221–237 of volume 2. It opens with the qiradh of Umar's sons and Abu Musa al-Ash'ari, sets out what is permitted and forbidden in its terms, debts, expenses, transgression and reckoning, and closes with general rules."
