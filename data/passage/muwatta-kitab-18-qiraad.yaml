summary:
  ar: "كتاب القراض، الكتاب الثامن عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 42 نصا (2007–2048) في خمسة عشر بابا، من الصفحة 221 إلى الصفحة 237 من ملف PDF المجلد الثاني. يبدأ بقراض عمر لابنيه وأبي موسى الأشعري، ويبين ما يجوز من القراض وما لا يجوز من شروطه وديونه ونفقته، والتعدي فيه والمحاسبة عليه، ويختم بجامع أحكامه. {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.237}"
  en: "The Book of Profit-Sharing (qiradh), eighteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 42 reports (2007–2048) in fifteen babs, PDF pp. 221–237 of volume 2. It opens with the qiradh of Umar's sons and Abu Musa al-Ash'ari, sets out what is permitted and forbidden in its terms, debts, expenses, transgression and reckoning, and closes with general rules."
  es: "El Libro de la Participación en las Ganancias (qiradh), decimoctavo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 42 informes (2007–2048) en quince babs, PDF págs. 221–237 del volumen 2. Comienza con el qiradh de los hijos de Umar y Abu Musa al-Ash'ari, establece lo que está permitido y prohibido en sus términos, deudas, gastos, transgresiones y contabilidad, y cierra con reglas generales."
  fr: "Le Livre du partage des profits (qiradh), dix-huitième livre de la Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 42 rapports (2007-2048) en quinze babs, PDF pp. 221-237 du volume 2. Il s'ouvre sur le qiradh des fils d'Umar et d'Abu Musa al-Ash'ari, expose ce qui est permis et interdit dans ses termes, les dettes, les dépenses, les transgressions et le calcul, et se termine par des règles générales."
