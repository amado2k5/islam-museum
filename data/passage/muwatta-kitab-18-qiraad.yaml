label: { ar: "الموطأ، كتاب القراض", en: "Muwatta, Book of Profit-Sharing (qiradh)", es: "Muwatta, Libro de participación en los beneficios (qiradh)", fr: "Muwatta, Livre du partage des bénéfices (qiradh)", ur: "موطا، منافع کی تقسیم کی کتاب ⁦(قراد)⁩", tr: "El-Muvatta, Kırad Kitabı", id: "Al-Muwatta, Kitab Qirad" }
summary:
  ar: "كتاب القراض، الكتاب الثامن عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 42 نصا (2007–2048) في خمسة عشر بابا، من الصفحة 221 إلى الصفحة 237 من ملف PDF المجلد الثاني. يبدأ بقراض عمر لابنيه وأبي موسى الأشعري، ويبين ما يجوز من القراض وما لا يجوز من شروطه وديونه ونفقته، والتعدي فيه والمحاسبة عليه، ويختم بجامع أحكامه. {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.237}"
  en: "The Book of Profit-Sharing (qiradh), eighteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 42 reports (2007–2048) in fifteen babs, PDF pp. 221–237 of volume 2. It opens with the qiradh of Umar's sons and Abu Musa al-Ash'ari, sets out what is permitted and forbidden in its terms, debts, expenses, transgression and reckoning, and closes with general rules."
  es: "El Libro de la Participación en las Ganancias (qiradh), decimoctavo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 42 informes (2007–2048) en quince babs, PDF págs. 221–237 del volumen 2. Comienza con el qiradh de los hijos de Umar y Abu Musa al-Ash'ari, establece lo que está permitido y prohibido en sus términos, deudas, gastos, transgresiones y contabilidad, y cierra con reglas generales."
  fr: "Le Livre du partage des profits (qiradh), dix-huitième livre de la Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 42 rapports (2007-2048) en quinze babs, PDF pp. 221-237 du volume 2. Il s'ouvre sur le qiradh des fils d'Umar et d'Abu Musa al-Ash'ari, expose ce qui est permis et interdit dans ses termes, les dettes, les dépenses, les transgressions et le calcul, et se termine par des règles générales."
  ur: "منافع کی تقسیم کی کتاب ⁦(قراد)⁩، یحییٰ بن یحییٰ کی تجدید میں موطا کی اٹھارویں کتاب ⁦(موضوع 1997)⁩، جلد 2 میں: 42 رپورٹس (2007-2048) پندرہ بابوں میں، پی ڈی ایف صفحہ 221-237 بمعہ ابو عتقاصہ ابن معرۃ کی جلد 2 کھولیں۔ اشعری اپنی شرائط، قرضوں، اخراجات، فسق و فجور اور حساب و کتاب میں کیا حلال اور حرام ہیں کو بیان کرتا ہے اور عام احکام کے ساتھ بند کرتا ہے۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği Al-Muwatta'nın on sekizinci kitabı olan Kırad Kitabı, Beşar Awad Maruf'un (1997) ikinci cildinde, on beş bölümden oluşan 42 metin (2007–2048) içinde, ikinci cildin PDF dosyasının 221. sayfasından 237. sayfasına kadar yer almaktadır. Kitap, Ömer'in iki oğlu ve Ebu Musa el-Eş'ari için yaptığı Kırad ile başlar ve Kırad'da caiz olan ve olmayan şeyleri, şartlarını, borçlarını, masraflarını, ihlallerini ve hesabını açıklar ve hükümlerinin özetiyle sona erer. {cite:muwatta-maruf-1997 s.221} {cite:muwatta-maruf-1997 s.237}"
  id: "Kitab Qirad, kitab kedelapan belas dari Al-Muwatta' dalam riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 42 teks (2007–2048) dalam lima belas bab, dari halaman 221 hingga halaman 237 dari file PDF Jilid Dua. Kitab ini dimulai dengan Qirad Umar untuk kedua putranya dan Abu Musa al-Ash'ari, dan menjelaskan apa yang diperbolehkan dan tidak diperbolehkan dalam Qirad, syarat-syaratnya, hutang, pengeluaran, pelanggaran, dan perhitungan, dan diakhiri dengan ringkasan hukum-hukumnya. {cite:muwatta-maruf-1997 p.221} {cite:muwatta-maruf-1997 p.237}"
