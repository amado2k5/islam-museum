label:
  ar: "ابن ماجه 3794 — من قال لا إله إلا الله والله أكبر صدقه ربه"
  en: "Ibn Majah 3794 — Whoever says there is no god but God and God is greatest, his Lord confirms him"
  ur: "ابن ماجہ 3794 — جو لا الٰہ الا اللہ اور اللہ اکبر کہے اس کا رب اس کی تصدیق کرتا ہے"
text: "إذا قال العبد لا إله إلا الله والله أكبر . قال يقول الله عز وجل صدق عبدي لا إله إلا أنا وأنا أكبر . وإذا قال العبد لا إله إلا الله وحده . قال صدق عبدي لا إله إلا أنا …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3794: من قال لا إله إلا الله والله أكبر صدقه ربه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3794: Whoever says there is no god but God and God is greatest, his Lord confirms him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3794: جو لا الٰہ الا اللہ اور اللہ اکبر کہے اس کا رب اس کی تصدیق کرتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
