label: { ar: "صحيح مسلم 3588 — ما أُحل، ما لا يحل", en: "Sahih Muslim 3588 — what was made lawful; what is not lawful", ur: "صحیح مسلم 3588 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih Muslim 3588 — lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih Muslim 3588 — Ce qui a été rendu licite; ce qui ne l'est pas" }
text: "… يَا رَسُولَ اللَّهِ لَسْتُ لَكَ بِمُخْلِيَةٍ وَأَحَبُّ مَنْ شَرِكَنِي فِي خَيْرٍ أُخْتِي. فَقَالَ رَسُولُ اللَّهِ \" فَإِنَّ ذَلِكِ لاَ يَحِلُّ لِي \". قَالَتْ فَقُلْتُ يَا رَسُولَ اللَّهِ فَإِنَّا نَتَحَدَّثُ أَنَّكَ تُرِيدُ أَنْ تَنْكِحَ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. قَالَ \" بِنْتَ أَبِي سَلَمَةَ \". قَالَتْ نَعَمْ. قَالَ رَسُولُ اللَّهِ \" لَوْ أَنَّهَا لَمْ تَكُنْ رَبِيبَتِي فِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3588، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3588 (The Book of Suckling), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3588، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.° 3588 (El Libro de la Lactancia), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3588 (Le Livre de l'allaitement), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
