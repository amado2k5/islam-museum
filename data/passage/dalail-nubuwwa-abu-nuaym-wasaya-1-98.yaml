text: "… وينصبونَ له الحبائلَ، وهم فاعلون أو أبناؤهم، ولولا أني أعلم أن الموت مُجْتاحي قبل مبعثِه لسرتُ بخيلي ورَجِلي، حتى أصيِّر يثرب دارَ ملكي، فإني أجِد في الكتاب الناطق، والعلم السابق، أنَّ بيثرب استحكامُ أمره، وموضعُ قبره، وأهلُ نُصرته، ولولا أني …"
summary:
