  بسد فى طرف الجبل ثم يدلى فى البتر فيمخض الهاة حتى تنور ثم يسبقى ذلك الماه فتنق البئر
  قال الشاعو اذار أواكريهة يرمون بي • رميك بالمرجاس فى قعر الطوى
  ⁦( نرجس )⁩ نرجس معرّب والنون زاتدة لانه ليس فى السكلام فعلل وفى الكلام تفعل
  فلوسمين به دجلالم تصرفه لانه مثل نضرب ولو كان فى الاسمامشئ على مثال فعال لصرفناه
  كماصر فنانهثلالات فى الاسماءفعللا مثسل جعفر دس ردست القوم أردسهم
  ردسا اذاوميتهم بحجر قال الشاعر
  اذا أخوكك لواكا لحق معترضا * غاردس أخال بعب*مثل عتاب
  بعن مشل بن عتاب وكذلك رادست القوم مرادسة ورجل ردّيس بالتشديد والمرداس حجر
  يرمى بد فى البئرليعلم أفيها ماء أم لا ومنه سمى الرجل واماقول عباس بى مرداس السلمى
  وما كان حسن ولاحابس • يفوقان مرداس فى الجمع
  فكان الاخفش يجعله من ضرورة الشعر وأذكره المبرد ولم يجوز ف ضرورة الشعر ترك صرف
  ما ينصرف وقال الرواية الصميعة يفوقان شيخى فى مجمع ويقال ما أدرى أين ردس أى أين
  ذهب :⁦( رسس)⁩ رس الحى ورديسها واجد وهو أول مسهاوقواهم بلغنى رس من خبر
  أى شئ منه والرس البتر المطوية بالجارة والرس اسم بتركانت لبقية من حود والرس
  اسم واد فى قول زهير
  بكرن بكوراواستحرن بسهرة * فهنّ ووادى الرس كاليدللفم
  والرسيس الشى الثابت وأماقول زهير
  لمن طلل كالوحى عاف منازله • عفا الرس منها فارصيس فعاقله
  فه واسم ماء وعاقل اسم جبل ورست رساأى حفرت بترا ورس الميت أى قبر والرس
  الاصلاح بين الناس والافساد أيضا وقدرسست بينهسم وهو من الاضدادوذلان يرس
  الحديث فى نفسه أى يدث به نفسه ورس فلان خبر القوم اذ القيهم وتعرف أمورهم
  ورسرس البعير أى تمكن للم وض ⁦( رعس)⁩ الرعس الارتعاش والانتفاض وقد رعس
  فهوراعس قال الراجز
  والمشرفى فى الاكف الرعس • بموطن يرعدفيه المخنسى • بالقلعيات تطاف الانفس
  أبوع ووالرعسان تحريك الرأس من المكبروأنشد لنيهان
  سبعلم بن يئوى حلائى أننى • أريب باكاف النضيض حبلبس
  أراد واجلانى يوم قيد وقربوا • لي ورؤسا للشهادة ترعس
  وناقة رعوس وهى التى قدرجف رأسها من الكبر الفرّاءرعست فى المشى أرعس اذا
  مشيت مشياضعيفا من اعياء أوغيره والارتعاس مثل الارتعاش والارتعاد وأرعسه
  مثلّ أرعشه قال العجاج يصف سيفا يأرى بارعاس يمين المؤتلى ديروى بالشين يقول
  بقطع وان كان الضارب مقسراهى تعش اليد :⁦( رغس)⁩ الرغس النماء والخيروفى الحديث
  ان رجلارعه اللّٰه مالاعال الاموى أى أكثره وبارلكله فيه وتقول كانواقدلا فرغسمم اللّٰه
  أى كثرهم اللّٰه وأنماهم وكذلك(هوفى الحسب وغيره قال العجاج
