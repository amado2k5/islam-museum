text: "… إلا وفيها من يدمع من أهلها به وانى لأرحوان يكون أبو واثل منهم. سعيد بن صالح قال : رأيت أما وائل يسمع البوح ويبكى. عي الأهمش عن أبى وائل قال : إن أحل بيت يصعون على مائلتهم رعيما حلالا لأهل …"
