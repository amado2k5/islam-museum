label: { ar: "سنن أبي داود 3070 — وصف المسلم", en: "Sunan Abi Dawud 3070 — a description of the Muslim", ur: "سنن ابی داؤد 3070 — مسلمان کا وصف", es: "Sunan Abi Dawud 3070 — una descripción del musulmán", fr: "Sunan Abi Dawud 3070 — une description du musulman", tr: "Sunan Abi Davud 3070 — Müslümanın Tanımı", id: "Sunan Abi Dawud 3070 — Deskripsi tentang Muslim" }
text: "… فَلَمَّا رَأَيْتُهُ قَدْ أَمَرَ لَهُ بِهَا شُخِصَ بِي وَهِيَ وَطَنِي وَدَارِي فَقُلْتُ يَا رَسُولَ اللَّهِ إِنَّهُ لَمْ يَسْأَلْكَ السَّوِيَّةَ مِنَ الأَرْضِ إِذْ سَأَلَكَ إِنَّمَا هِيَ هَذِهِ الدَّهْنَاءُ عِنْدَكَ مُقَيَّدُ الْجَمَلِ وَمَرْعَى الْغَنَمِ وَنِسَاءُ بَنِي تَمِيمٍ وَأَبْنَاؤُهَا وَرَاءَ ذَلِكَ فَقَالَ \" أَمْسِكْ يَا غُلاَمُ صَدَقَتِ الْمِسْكِينَةُ الْمُسْلِمُ أَخُو الْمُسْلِمِ يَسَعُهُمَا الْمَاءُ وَالشَّجَرُ وَيَتَعَاوَنَانِ عَلَى الْفُتَّانِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3070، يذكر وصف المسلم. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan Abi Dawud, no. 3070 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions a description of the Muslim. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن ابی داؤد کی حدیث نمبر 3070، جس میں مسلمان کا وصف کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3070 (Tributo, Botín y Gobierno (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona una descripción del musulmán. El navegador Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan Abi Dawud, n° 3070 (Tribut, Butin et Pouvoir (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), décrit le musulman. Le navigateur « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sünen Ebu Davud'da yer alan 3070 numaralı hadis, bir Müslümanın özelliklerini anlatmaktadır. Bu bölüm, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve bir müminin niteliklerini, Kur'an'dan, Sünnet'ten, Peygamberin hayatından ve Sahabeler ile onların haleflerinden rivayetlerle birlikte, bu dört kategori içinde derlemektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3070, menjelaskan karakteristik seorang Muslim. Bagian ini mengumpulkan rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
