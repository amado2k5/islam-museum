text: "… ابن عبد العريز عن رجل من أصحاب محمد مل أن النبي مليم قال : حقٌّ على كل مسلم أَن يغتسل كل سبعة أَيام يوم الجمعة، وأَن يستن وأَن يُصيب من طيب أَهله، وهذا أَحب القولين إلى سفيان، يقول : واجب …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 1، ص 1415، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 1, p. 1415, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 1، ص 1415 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
