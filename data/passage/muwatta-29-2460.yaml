label: { ar: "الموطأ 2460 — مالك: تؤدى الدية في ثلاث أو أربع سنين، والثلاث أحب إليه", en: "Muwatta 2460", es: "Muwatta 2460", fr: "Muwatta 2460", ur: "موطا 2460", tr: "Al-Muwatta 2460 — Malik: Kan parası üç ya da dört yılda ödenir ve üç yıl onun için daha hayırlıdır.", id: "Al-Muwatta 2460 — Malik: Uang darah dibayarkan selama tiga atau empat tahun, dan tiga tahun lebih disukai olehnya." }
summary:
  ar: "حدث يحيى عن مالك أنه سمع أن الدية تؤدى منجمة في ثلاث سنين أو أربع سنين، قال مالك: والثلاث أحب ما سمعت إليّ في ذلك. {cite:muwatta-maruf-1997 p.418}"
  tr: "Yahya, Malik'ten duyduğuna göre kan parasının üç veya dört yıl içinde taksitler halinde ödendiğini bildirmiştir. Malik şöyle demiştir: \"Bu konuda duyduğum en uygun seçenek üç yıldır.\" {cite:muwatta-maruf-1997 s.418}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar uang darah dibayarkan secara bertahap selama tiga atau empat tahun. Malik berkata: \"Tiga tahun adalah pilihan yang paling baik yang pernah saya dengar mengenai masalah ini.\" {cite:muwatta-maruf-1997 p.418}"
