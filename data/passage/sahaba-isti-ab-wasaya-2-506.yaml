text: "… فجئت رسول حقٌّ حقَّه، فَلا وصِيَّةَ لوارث، والولدُ للفراشِ، اللّٰه ا يه، فقلت : وجدت صاحباً، وكان رسول اللّٰه وللعاهرِ الحَجَرْ. وروى عنه شَهْر بن حَوْشَب. سنده ضعيف، وأخرجه أحمد بن حنبل في مسنده عن يعقوب بن إبراهيم، بهذا الإسناد. …"
summary:
