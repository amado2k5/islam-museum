label: { ar: "الموطأ 111 — صفة غسل ابن عمر من الجنابة", en: "Muwatta 111", es: "Muwatta 111", fr: "Muwatta 111", ur: "موطا 111", tr: "El-Muvatta 111 — İbn Ömer'in cinsel kirlilikten sonraki ritüel banyosunun açıklaması", id: "Al-Muwatta 111 — Deskripsi tentang mandi ritual Ibnu Umar setelah najis karena hubungan seksual" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في غسل الجنابة: كان عبد الله بن عمر إذا اغتسل من الجنابة بدأ فأفرغ على يده اليمنى فغسلها، ثم غسل فرجه، ثم مضمض واستنثر، ثم غسل وجهه ونضح في عينيه، ثم غسل يده اليمنى ثم اليسرى، ثم غسل رأسه، ثم اغتسل وأفاض عليه الماء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي ومحمد بن الحسن، وأن عبد الرزاق أخرجه عن ابن جريج عن نافع. {cite:muwatta-maruf-1997 p.89}"
  tr: "Malik'in Nafi'den rivayet ettiği, cinsel kirlilikten sonraki gusül abdesti bölümünde yer alan bir rivayete göre: Abdullah ibn Umar cinsel kirlilikten sonra gusül abdesti aldığında, önce sağ eline su döküp yıkardı, sonra cinsel organlarını yıkardı, sonra ağzını ve burnunu çalkalardı, sonra yüzünü yıkar ve gözlerine su serperdi, sonra sağ elini ve sonra sol elini yıkardı, sonra başını yıkardı, sonra gusül abdestini alır ve tüm vücuduna su dökerdi. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd, Şafiî ve Muhammed ibn Hasan tarafından rivayet edildiğini ve Abdülrazzak'ın da İbn Cüreyc'ten, o da Nafi'den rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.89}"
  id: "Sebuah riwayat yang dilaporkan oleh Malik atas otoritas Nafi’, dalam bab tentang mandi setelah najis: Ketika Abdullah ibn Umar melakukan mandi setelah najis, ia akan memulai dengan menuangkan air ke tangan kanannya dan mencucinya, kemudian ia akan mencuci kemaluannya, kemudian membilas mulut dan hidungnya, kemudian mencuci wajahnya dan memercikkan air ke matanya, kemudian mencuci tangan kanannya dan kemudian tangan kirinya, kemudian mencuci kepalanya, kemudian melakukan mandi dan menuangkan air ke seluruh tubuhnya. Peneliti menyebutkan bahwa riwayat ini diriwayatkan atas otoritas Malik oleh Abu Mus’ab, Suwaid, al-Shafi’i, dan Muhammad ibn al-Hasan, dan bahwa Abd al-Razzaq meriwayatkannya atas otoritas Ibn Jurayj atas otoritas Nafi’. {cite:muwatta-maruf-1997 p.89}"
