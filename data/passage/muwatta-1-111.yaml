label: { ar: "الموطأ 111 — صفة غسل ابن عمر من الجنابة", en: "Muwatta 111" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في غسل الجنابة: كان عبد الله بن عمر إذا اغتسل من الجنابة بدأ فأفرغ على يده اليمنى فغسلها، ثم غسل فرجه، ثم مضمض واستنثر، ثم غسل وجهه ونضح في عينيه، ثم غسل يده اليمنى ثم اليسرى، ثم غسل رأسه، ثم اغتسل وأفاض عليه الماء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي ومحمد بن الحسن، وأن عبد الرزاق أخرجه عن ابن جريج عن نافع. {cite:muwatta-maruf-1997 p.89}"
