text: "… هل تبيض الدجاجة المطبوخة؟ كان أحد التجار مُسافراً، فنزلَ في فندقٍ على الطريق، فقدَّم إليهِ الفندقيُّ دجاجةً وبيضتينِ ونصف رغيف خبز على العشاء، ووضع عَلَفاً لدابته حشيشاً. وفي الصباح عزم التاجر على مُبارحَةِ الفندق، فقال: نتحاسبُ في العودة، ونهضَ، وسار. …"
summary:
  ar: "نزل تاجر في خان فقدم له صاحب الخان دجاجة وبيضاً، وتستمر الحكاية في الجزء التالي. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  en: "A merchant lodges at an inn, and the innkeeper serves him a chicken and eggs. The story continues in the next part. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  ur: "ایک تاجر ایک سرائے میں ٹھہرتا ہے اور سرائے کا مالک اسے مرغی اور انڈے پیش کرتا ہے۔ حکایت اگلے حصے میں جاری رہتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  fr: "Un marchand loge dans une auberge, et l'aubergiste lui sert un poulet et des œufs. L'histoire continue dans la partie suivante. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
  es: "Un mercader se aloja en una posada, y el posadero le sirve un pollo y huevos. La historia continúa en la parte siguiente. {cite:juha-nawadir-kubra-djuwaydi p. 109}"
