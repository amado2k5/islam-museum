text: "في أن العلوم إنما تكثر حيث يكثر العمران وتعظم الحضارة في اصناف العلوم الواقعة في العمران لهذا العهد في علوم القرآن من التفسير والقراءات التفسير في علوم الحديث علمُ الفِقْهِ وما يتبعه من الفرائض علم الفرائض أصول الفقه وما يتعلق …"
