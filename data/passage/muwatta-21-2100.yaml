label: { ar: "الموطأ 2100 — مالك: الشفعة ثابتة في مال الميت كما هي في مال الحي، فإن خشي أهل الميت أن ينكسر مال الميت قسموه ثم باعوه، فليس عليهم فيه شفعة", en: "Muwatta 2100", es: "2100 Muwatta", fr: "2100 Muwatta", ur: "2100 موطا", tr: "Al-Muwatta 2100 — Malik: Ön alım hakkı, yaşayanların mallarında olduğu gibi ölenlerin mallarında da mevcuttur. Eğer ölenin mirasçıları, ölenin mallarının kaybolacağından endişe ederlerse, malları bölüştürmeli ve satmalıdırlar; bu durumda ön alım hakları yoktur." }
summary:
  ar: "قال مالك: والشفعة ثابتة في مال الميت كما هي في مال الحي. فإن خشي أهل الميت أن ينكسر مال الميت، قسموه ثم باعوه، فليس عليهم فيه شفعة. {cite:muwatta-maruf-1997 p.258}"
  tr: "Malik şöyle dedi: Ön alım hakkı, yaşayanların mallarına olduğu gibi ölenlerin mallarına da uygulanır. Eğer ölenin mirasçıları, ölenin mal varlığının kaybedileceğinden korkuyorlarsa, onu bölüştürmeli ve sonra satmalıdırlar; bu durumda ön alım hakları yoktur. {cite:muwatta-maruf-1997 s.258}"
  id: "Malik berkata: Hak prioritas berlaku untuk harta orang yang telah meninggal sama seperti berlaku untuk harta orang yang masih hidup. Jika ahli waris orang yang telah meninggal khawatir bahwa harta warisan orang yang telah meninggal akan hilang, mereka harus membaginya dan kemudian menjualnya; dalam hal itu, mereka tidak memiliki hak prioritas. {cite:muwatta-maruf-1997 p.258}"
