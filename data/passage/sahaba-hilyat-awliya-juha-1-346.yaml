text: "… يريدون وجهه حدثنا محمد بن أحمد ثنا عبد اللّه بن شيرويه ثنا اسحاق بن راهويه أخبرنا جرير عن أشعب بن سوار عن كردوس عن عبد الله بن مسعود. قال : مر لللأ من قريش على رصول اللّٰه وعنده صحيب وبلال …"
summary:
  ar: "مقطع من حلية الأولياء وطبقات الأصفياء، المجلد المصوَّر 1، ص 346، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Hilyat al-Awliya' wa-Tabaqat al-Asfiya', scan volume 1, p. 346, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "حلیۃ الاولیاء و طبقات الاصفیاء، اسکین جلد 1، ص 346 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volume numérisé 1, p. 346, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volumen escaneado 1, p. 346, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hilyat al-Awliya' wa Tabaqat al-Asfiya' adlı eserin Resimli Cilt 1, sayfa 346'sından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Hilyat al-Awliya' wa Tabaqat al-Asfiya', Jilid Bergambar 1, hlm. 346, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Juha dan Islamic Folklore Browser."
