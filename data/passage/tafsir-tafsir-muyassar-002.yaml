text: "لاة فتوجهوا نحو المسجد الحرام. وإن الذين أعطاهم الله علم الكتاب من اليهود والنصارى ليعلمون أن تحويلك إلى الكعبة هو الحق الثابت في كتبهم. وما الله بغافل عما يعمل هؤلاء المعترضون (١٤٥) ولئن جئت -أيها الرسول- الذين أعطوا التوراة والإنجيل"
