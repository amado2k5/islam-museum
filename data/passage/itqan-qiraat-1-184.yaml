text: "… واجيب من قبلنا بمنع كوفها لم تقواتر فرب مقواتر عند قوم دون أخرين وفي وقت دوب آخر ويكفي في تواترها اثباتها في مصاحف الصحابة فمن بعدهم بنخط المصحف مع منعهم ان يكتب فى المصحف ما ليس منه"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 184، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 184, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 184 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 1, pág. 184, que menciona la colección del Corán y los códices, así como la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 1, page 184, mentionnant la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
