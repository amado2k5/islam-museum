text: |-
  *٢٢
  فصل السين).
  خصفة بن قيس عيلان وسليم أيضاقبيلة فى جذام من الين وأبو سلمى بضم السين والدزهير
  ابن أبى سلى المزنىّ الشاعر وليس فى العرب غيره واسمه ربيعة بن رياح من بنى مازن من حن ينة
  وسلمان اسم جبل واسم رجل وسالم اسم رجل والسلم بالتهريك السلف والسلم الاستسلام
  والسلم أيضاشيير من العضاه الواحدة سلمة وسلمة اسم رجل وسلة بكسر الام أيضااسم رجل
  وينوسلة بطن من الانصار وليس فى العرب سلة غسيرهم والسلة أيضاواحدة السلام وهى
  الحارة وقال
  ذاك خليلى وذويعاتبني • يرمى ورات بامسهم وامسله
  يريد بالسهم والسلمة وهى لغة لهير والسلم واحد السلاليم التى يرتقى عليها وريماسهى الغرز
  بذلك قال أبو الريس التعلبىّ يصف ناقله
  مطارة قلب ان ثى الرجل دبها * بسلم غرز فى مناخ تعاجله
  وسلام وسلامة بالتشديد من أسماء الناس والسلم بالكسر السلام وقال
  وقفنا فقلنا ايه سلم فسات • فاكان الاومؤها بالحواجب
  وقرأ أبوعر وادخلوا فى السلم كافة يذهب بعناها الى الاسلام والسلم الصلح يفتح ويكسر
  ويذكرويونت والسلم المسالم تقول أناسلم لمن سالمى والسلام ال-لامة والسنلام الاستسلام
  والسلام الاسم من التسليم والسلام اسم من أسماء اللّٰه تعالى والسلام والسلام أيضاشجر
  فال بشر * بصاحة فى أسرما السلام• الواحدة سلامة والسلم البراءة من العيوب ى
  قول أصة وقرى ورجلاسلما والسلامان أيضاشحر والسلامات عظام الاصابع قال أبو
  عبدد السلامى فى الاصل عظم يكون فى فرسن البعرويقال ان آخر ما يدقى فيه المخ من البعه
  اذايف السلامى والعين فاذا ذهب منهما لم يكن له بقية بعد قال الراجز
  لا يشتكين عملاما أفقين * مادام مح فى سلامى أوعين
  واحده وجمم سواء وقد جع على سلاميات ويقال للجلدة التى بين العين والانف سالم
  وقال عبداللّٰه بن عمررضى اللّٰه عنهما فى ابنه سالم
  يديرونى عن سالم وأربغه • وجلدة بين العين والانف سنالم
  وهذا المعنى أراد عبد الملك فى جوابه عن كتاب الحجاج أنت عندى كسالم والسلام والسليم
  اللديغ كانهسم تفالواله بالسلامة ويقأل أسلم لمابه وقلب سليم أى -الم قال ابن السكين
  تقول لابذى تس-لم ما كان كذا وكذاروتنى لا بذى تسلمان وللمجماءة لابذى تسلون
  وللمؤنث لا بذى تسمين والجميع لا بذى تسان قال والتأويل لا واللّه الذى يسلك ما كان كذا
  وكذا ويقال لا وسلامتك ما كان كذا ويقال اذهب بذى تسلم يانتى اذهبا بذى تسلمان أى
  اذهب بسلامتك قال الاخفس وقوله ذى.ضاف الى تسلم وكذلك قول الشاعر
  بآية بقدمون الحيل زورا * كأنّ على سنابكها مداما
  أضاف آية الى يقدمون وهما نادران لانه ليس شئءن الامباءبضاف الى الفعل غير أسها.
  الزمان كقولك هذايوم يفعل أى يفعل فيه وتقول -لم فلان من الافات سلامة وسله اللّه
  سعانه متها وسات اليه الشئ فتسله أى أخذه والتسليم بذل الرضا بالحكم والتسليم السلام
  وأسلم الرجل فى الطعام أى أسلف فيه وأسلم أحره الى القه أى سلم وأسلم أى دخل فى السلم وهو
  الاستلام
