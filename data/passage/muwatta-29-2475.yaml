label: { ar: "الموطأ 2475 — مالك: تفسير معاقلة المرأة في الموضحة والمنقلة وما دون المأمومة", en: "Muwatta 2475", es: "Muwatta 2475", fr: "Muwatta 2475", ur: "موطا 2475", tr: "Al-Muwatta 2475 — Malik: Kadının, kemiği açığa çıkaran, kemiği yerinden oynatan veya başın iltihaplanmasına neden olan bir yaradan daha hafif olan bir yara için sorumluluğunun açıklaması." }
summary:
  ar: "قال مالك: وتفسير ذلك أنها تعاقله في الموضحة والمنقلة، وما دون المأمومة والجائفة وأشباههما، مما يكون فيه ثلث الدية فصاعدا؛ فإذا بلغت ذلك كان عقلها في ذلك النصف من عقل الرجل. {cite:muwatta-maruf-1997 p.422}"
  tr: "Malik şöyle dedi: Bunun açıklaması şudur ki, kemiği açığa çıkaran veya yerinden oynatan yaralar ve beyne veya karın boşluğuna nüfuz eden yaralardan daha hafif yaralar ve benzeri yaralar için tazminata hakkı vardır; bu tazminat miktarı kan parasının üçte biri veya daha fazlası ise, tazminatı bir erkeğin tazminatının yarısıdır. {cite:muwatta-maruf-1997 s.422}"
  id: "Malik berkata: Penjelasannya adalah bahwa dia berhak atas kompensasi untuk luka yang memperlihatkan tulang atau menggeser tulang, dan untuk luka yang kurang parah daripada luka yang menembus otak atau rongga perut, dan luka serupa, di mana kompensasinya adalah sepertiga atau lebih dari uang darah. Jika mencapai tingkat itu, maka kompensasinya adalah setengah dari kompensasi seorang pria. {cite:muwatta-maruf-1997 p.422}"
