text: "له، ففزعوا لذلك. فدخل عليه الآذن، فأدخلت، وأعطيته الكتاب. ((من محمد رسول الله، إلى قيصر صاحب الروم)). فإذا ابن أخ له، أحمر أزرق، قد نخر، ثم قال: لم لم يكتب ويبدأ بك! لا تقرأ كتابه اليوم. فقال لهم: اخرجوا. فدعا"
