label: { ar: "الموطأ 764 — السائب بن يزيد: كنت غلاماً عاملاً مع عبد الله بن عتبة على سوق المدينة في زمان عمر فكنا نأخذ من النبط العشر", en: "Muwatta 764", es: "Muwatta 764", fr: "Muwatta 764", ur: "موطا 764", tr: "El-Muvatta 764 — El-Sa'ib bin Yazid: Ömer zamanında Medine çarşısında Abdullah bin Utbe ile birlikte çalışan genç bir çocuktum ve Nabateanlardan zekât alırdık.", id: "Al-Muwatta 764 — Al-Sa’ib bin Yazid: Aku masih muda dan bekerja bersama Abdullah bin Utbah di pasar Madinah pada masa pemerintahan Umar, dan kami biasa mengambil zakat dari kaum Nabatea." }
summary:
  ar: "يرويه مالك عن ابن شهاب عن السائب بن يزيد، أنه قال: كنت غلاماً عاملاً مع عبد الله بن عتبة بن مسعود على سوق المدينة في زمان عمر بن الخطاب، فكنا نأخذ من النبط العشر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع عند أبي عبيد في الأموال (1661). {cite:muwatta-maruf-1997 p.378}"
  tr: "Malik, İbn Şihab'dan, o da Sa'ib ibn Yazid'den rivayet ederek şöyle buyurmuştur: \"Ömer ibn el-Hattab zamanında Medine çarşısında Abdullah ibn Utbah ibn Mes'ud için çalışan genç bir adamdım ve Nabateanlardan zekât toplardık.\" Editör, Ebu Mus'ab ve İshak el-Tabba'nın bunu Malik'ten rivayet ettiğini, Ebu Ubeyd'in el-Amwal'da (1661) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.378}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang juga meriwayatkannya dari al-Sa'ib ibn Yazid, yang berkata: \"Aku adalah seorang pemuda yang bekerja untuk Abdullah ibn Utbah ibn Mas'ud di pasar Madinah pada masa pemerintahan Umar ibn al-Khattab, dan kami biasa memungut zakat dari kaum Nabatea.\" Editor menyebutkan bahwa Abu Mus'ab dan Ishaq al-Tabba' meriwayatkan hadits ini dari Malik, sebagaimana tercatat oleh Abu Ubayd dalam al-Amwal (1661). {cite:muwatta-maruf-1997 p.378}"
