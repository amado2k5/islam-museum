label: { ar: "الموطأ 764 — السائب بن يزيد: كنت غلاماً عاملاً مع عبد الله بن عتبة على سوق المدينة في زمان عمر فكنا نأخذ من النبط العشر", en: "Muwatta 764" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن السائب بن يزيد، أنه قال: كنت غلاماً عاملاً مع عبد الله بن عتبة بن مسعود على سوق المدينة في زمان عمر بن الخطاب، فكنا نأخذ من النبط العشر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وإسحاق الطباع عند أبي عبيد في الأموال (1661). {cite:muwatta-maruf-1997 p.378}"
