text: "… الله تعالى وكراهية تشميته إذا لم يحمد الله تعالى وبيان آداب التشميت والعطاس والتثاؤب - عن أبى هريرة أن النبى ميلم : إن اللّٰه يُحِبّ الُعطاسَ وَيَكْرَهُ التَّأُؤْب، فَإِذَا مَطّس أحَدكُم وَحَمِدَ اللّٰه تعالى كانَ حقًّا على كل مسلم سمعهُ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 204، يرد فيه ذكر ما وجب على كل مسلم، وحق على كل مسلم، والكراهة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 204, whose wording mentions a duty laid on every Muslim, a right due from every Muslim, dislike (karaha), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 204 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، ہر مسلمان پر حق، کراہت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin de al-Nawawi, volume numérisé 3, p. 204, dont le texte mentionne un devoir imposé à chaque musulman, un droit dû par chaque musulman, la réprobation (karaha), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen digitalizado 3, p. 204, cuyo texto menciona un deber impuesto a cada musulmán, un derecho debido por cada musulmán, la reprobación (karaha), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Riyad-ı Salihin adlı eserinin 3. cildinin 204. sayfasından bir alıntı; her Müslümandan beklenen ve yerine getirilmesi gerekenlerin yanı sıra, mekruh ve kınanması gerekenleri de içermektedir. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz, itaat, tavsiye edilen, mekruh, haram ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Jilid 3, halaman 204, yang menyebutkan apa yang wajib dan seharusnya dilakukan oleh setiap Muslim, serta apa yang tidak disukai dan tercela. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
