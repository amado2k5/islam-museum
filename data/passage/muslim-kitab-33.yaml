  en: "Sahih Muslim, Book 33: The Book on Government"
  ur: "صحیح مسلم، کتاب الامارۃ"
  es: "Sahih Muslim, Libro 33: El libro sobre el gobierno"
summary:
  ar: "القسم 33 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإمارة»، ويضم فيها النصوص من 4701 إلى 4967 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 33 of Sahih Muslim (The Book on Government) in the division of the open hadith dataset the museum took its reports from: reports 4701 to 4967 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 33، عنوان «کتاب الامارۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4701 تا 4967۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 33 de Sahih Muslim (El Libro del Gobierno) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4701 al 4967 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
