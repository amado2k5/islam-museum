text: "عفة الصفوة وعن ابن مسروق قال: سمعت سريا يقول: ثلاث من كن فيه استكمل الإيمان: من إذا غضب لم يخرجه غضبه عن الحق، وإذا رضي لم يخرجه رضاه إلى الباطل، وإذا قدر لم يتناول ما ليس له. وعن جنيد قال: …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 516، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 516, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 516 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 4, pág. 516, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
