text: "… كان رَسُوْل اللّٰه ظ يعمل بهنّ ثلاث كلّهن على المسلم: عيادة ثلاث من عمل الجاهلية لا يتركهنّ، ثلاث من الكفر شقُّ الجيب ثلاث من كنَّ فيه فهو منافق وإن صام، ثلاث من كن فيه وجد حلاوة الإيمان ثلاث وددت أن …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 2082، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 2082, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 2082 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sahih Ibn Hibban, volumen 3, pág. 2082, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait du Sahih Ibn Hibban, volume 3, page 2082, évoque la douceur et la plénitude de la foi, qualités qui, chez une personne, la caractérisent. Cet extrait provient d'une numérisation automatique et est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Sahih İbn Hibban, Resimli Cilt 3, sayfa 2082'den bir alıntı, imanın tatlılığı ve mükemmelliğinden ve ona sahip olanların niteliklerinden bahsetmektedir; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sahih Ibn Hibban, Jilid Bergambar 3, halaman 2082, menyebutkan kemanisan dan kesempurnaan iman, serta sifat-sifat orang yang memilikinya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
