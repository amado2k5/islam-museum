text: |-
  ⁦(فصل انخا)⁩ (ترعب
  ٤٧
  يا رجل تخب خبامثال عات تعلم علما وقد خيب غلامى فلان أى خدعه والجبة والجبة والحبة
  طريقسة من رمل أوسحاب أوخرقة كالعصابة والخبيمثله يقال توب خبائب أى متقطع
  مثل هبائب واختب من توبه خبة أى أخرج والخبيبة أيضاصوف الشنى قال ابن السكيت
  هو أفضل من المقيقة وهى صوف الجذع وأبقى وأكثر والحبيبة من اللحم الشريحة والجيب
  ضرب من العدو تقول خب الفرس يخب بالضم خباوخيدا وخيدا اذاراوح⁦(١)⁩ بين يديه
  ورجليه وأخبه صاحبه يقال جاؤا مخبين ويقال أيضاخب النبات اذا طال وإرتفع وخب
  البحراذا اضطرب بقال أسام-م خب اذاخب به-م البحر قال الذرّاء اللخاب واحد
  خوابّ وهى القرابات والصهريقال لى من فلان خواب وخنجبواعنكم من الظهيرة أى
  أبردوا وأصله خببوا بثلاث باآن أبدلوا من الباء الوسطى خاء للفرق بين فعلل وفعل وانما
  زادوا الخاء من بين سائو الحروف لان فى الكامخاء وهذه علة جميع ما يشبهه من الكامات
  وانجخبة رخاوة الشئ واضطرابه وخبيب اسم رجل وهوخبيب بن عبد اللّٰه بن الزبيروكان
  عيد اللّٰه يكى بأبى خبيب قال الراعى
  ما إن أتيت أبا خبيب وافدا * يوما أريد لبيعتى تبديلا
  والحبيبان عبد اللّٰه بن الزبيروابنه ويقال هو وأخوه مصعب قانحيد الارقط
  قدنى من تصر الخبيبين قدى فن روى الخبيبين على الجمع يريد ثلاثتهم وقال ابن السكيت
  يريد أ با خبيب ومن كان على رأيه :⁦( شعب لخنتعبة من النوق الغزيرة الابن دب )⁩
  خدبه بالسيف أى نضربه وانلخدب شق الجلد مع اللحم وخديت الحبة أى عضت وفى لسانه
  خدب أى طول وقد خدب أى كذب والخدب الهوج رجل أخدب ومتخذب والمرأة خدياء
  بقال كان بنعامة خدب ٢ هو المدرك الثارأى كان أهوج وطعنة خدباءاذا هجمت على
  الجوف والخدباء الدرع اللينة وأنشد الاصمعى
  خسدبا يحفز هانجاد مهند
  أبوزيديقال أقبل على خيديتت أى على أمرك الأول وحكى الشيانى الخيدب الطريق
  الواضح قال الشاءر
  يعد والجوادبهافى خل خيسدية * كما يشق الى هذابه السرق
  ورجل خدبمثال هجز أى ضخم وجارية خدية ⁦( خرب)⁩ الخرب بالضم منقطع الجمهور
  من الرمل والخرب أيضاثقب الورل والخرية مثله وكذلك الخرابة وقد يشدد والخربة أيضا
  عروة المزادة وكل ثقب مستدير فه وخربة والمخروب المشقوق ومنه قيسل رجل أخرب
  للمشقوق الاذن وكذللك اذا كان منقوب الاذن فاذا انخرم بعد الثقب فهو أخرم والخراب
  ضد العمارة وقد خرب الموضع بالكسر فهو خرب ودار خرية وأخريم اصاحبها وخرّبوا
  يوتهم شتدلفش والفعل أوللمباغة والخارب المص قال الاصعه وسارق البعران خاصة
  والجمع انظراب تقول منه خرب فلان بابل فلان يخرب خراية مثل كتب يكتب كابة وانخرب
  ذكر الحبارى والجمع الخريان واخرب أيضا مصدر الاخرب وهو الذى فيه شق أوثب مستدير
  والخرّوب بالتشديد نيت معروف والدرنوب لغة ولا تقل الخرنوب بالفتح (خرعب جارية
  خرعوبة وخرعبة أى دقيقة العظام ناعمة والغصن الخرعوب المتذى وقال امر والقيس
  ١ أى قام على احداهمامرة
  وعلى الاخرى مرة اه هى تضحة
  مرذضى
