label: { ar: "الموطأ 307 — من غلبه النوم عن صلاته بالليل كتب له أجرها وكان نومه صدقة", en: "Muwatta 307" }
text: "ما من امرئ تكون له صلاة بليل يغلبه عليها نوم إلا كتب الله له أجر صلاته وكان نومه عليه صدقة"
summary:
  ar: "أول حديث في باب ما جاء في صلاة الليل. يرويه يحيى عن مالك عن محمد بن المنكدر عن سعيد بن جبير عن رجل عنده رضا عن عائشة: أخبر النبي أن من كانت له صلاة بالليل فغلبه عليها النوم كتب الله له أجر صلاته وكان نومه عليه صدقة. ويخرّجه المحقق عند أبي داود (1314) والنسائي في الكبرى وابن نصر في قيام الليل والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الرجل الرضا عند سعيد بن جبير قيل إنه الأسود بن يزيد، وساقه من طريق أبي جعفر الرازي بتسميته (التمهيد 12/261–262). {cite:muwatta-maruf-1997 p.173}"
