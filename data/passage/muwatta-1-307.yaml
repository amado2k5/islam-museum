label: { ar: "الموطأ 307 — من غلبه النوم عن صلاته بالليل كتب له أجرها وكان نومه صدقة", en: "Muwatta 307", es: "Muwatta 307", fr: "Muwatta 307", ur: "موطا 307", tr: "El-Muvatta 307 — Kim uykuya dalar ve gece namazını kaçırırsa, o namazın sevabı kendisine yazılır ve uykusu sadaka sayılır.", id: "Al-Muwatta 307 — Barang siapa yang diliputi rasa kantuk dan melewatkan shalat malamnya, maka pahalanya akan dicatat untuknya, dan tidurnya akan dianggap sebagai sedekah." }
text: "ما من امرئ تكون له صلاة بليل يغلبه عليها نوم إلا كتب الله له أجر صلاته وكان نومه عليه صدقة"
summary:
  ar: "أول حديث في باب ما جاء في صلاة الليل. يرويه يحيى عن مالك عن محمد بن المنكدر عن سعيد بن جبير عن رجل عنده رضا عن عائشة: أخبر النبي أن من كانت له صلاة بالليل فغلبه عليها النوم كتب الله له أجر صلاته وكان نومه عليه صدقة. ويخرّجه المحقق عند أبي داود (1314) والنسائي في الكبرى وابن نصر في قيام الليل والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن الرجل الرضا عند سعيد بن جبير قيل إنه الأسود بن يزيد، وساقه من طريق أبي جعفر الرازي بتسميته ⁦(التمهيد 12/261–262)⁩. {cite:muwatta-maruf-1997 p.173}"
  tr: "Gece namazı hakkında rivayet edilenler bölümündeki ilk hadis, Yahya'nın Malik'ten, o da Muhammed ibn el-Munkadir'den, o da Sa'id ibn Jubayr'dan, o da güvenilir sayılan bir adamdan, o da Aişe'den rivayet ettiği hadistir: Peygamberimiz bize şöyle bildirmiştir: \"Kim gece namazını kılmak için vaktini harcamışsa ve uyuya kalmışsa, Allah onun namazının sevabını ona yazar ve uykusu onun için sadaka sayılır.\" Bu hadis ayrıca Ebu Davud (1314), el-Nesai'nin el-Kubra'sında, İbn Nasr'ın Kıyam el-Layl'inde ve el-Beyhaki'nin hadis külliyatlarında, Malik'in sahabelerinin rivayet zincirleriyle de bulunmaktadır. İbn Abdülberr'den rivayet edildiğine göre, Sa'id ibn Cübeyr tarafından güvenilir sayılan kişi el-Esved ibn Yazid'di ve o da bunu Ebu Cafer el-Razi'nin rivayet zinciriyle aktararak adını zikretmiştir (el-Tamhid 12/261–262). {cite:muwatta-maruf-1997 s.173}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang diriwayatkan mengenai salat malam. Diriwayatkan oleh Yahya dari Malik, dari Muhammad ibn al-Munkadir, dari Sa'id ibn Jubayr, dari seorang laki-laki yang dianggap terpercaya, dari Aisyah: Nabi memberitahukan kepada kita bahwa siapa pun yang memiliki kewajiban salat malam tetapi tertidur, Allah akan mencatat pahala salatnya, dan tidurnya akan dianggap sebagai sedekah baginya. Hadits ini juga ditemukan dalam kumpulan hadits Abu Dawud (1314), al-Nasa'i dalam al-Kubra, Ibn Nasr dalam Qiyam al-Layl, dan al-Bayhaqi, melalui sanad para sahabat Malik. Diriwayatkan dari Ibnu Abd al-Barr bahwa orang yang dianggap dapat dipercaya oleh Sa'id ibn Jubayr dikatakan sebagai al-Aswad ibn Yazid, dan beliau mengutipnya melalui sanad Abu Ja'far al-Razi, dengan menyebut namanya (al-Tamhid 12/261–262). {cite:muwatta-maruf-1997 p.173}"
