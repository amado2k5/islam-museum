text: "… يا عائشة، لم أزل أجد ألم الطعام الذي أكلت بخيبر، فهذا أوان إنقطاع أبْهَري من ذلك السُّمْ. أخرجه البخاري في الصحيح، فقال : وقال يونس. وأخبرنا محمد بن عبد اللّٰه الحافظ، قال : حدثنا أبو العباس محمد بن بعقوب، قال …"
summary:
