text: "… تسبقكم همومكم، ولا تتآخر. قال أبو الحسن السيروانى: فجيع لنا العلم كله فى هذه الكلمة. أخبرنى الحسن بن غالب المقرئ قال مممت أبا القاسم عيسى بن على بن عيسى الوزير يقول : كان ابن مجاهد يوما عند أبى، فقيل له …"
