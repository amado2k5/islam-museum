summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم، في باب وضوء النائم إذا قام إلى الصلاة: قال عمر بن الخطاب إن من نام مضطجعاً فعليه الوضوء. ويذكر المحقق أنه رواه عن مالك زيد بن الحباب عند ابن أبي شيبة وسويد بن سعيد وعبد الرزاق في مصنفه (482). {cite:muwatta-maruf-1997 p.54}"
