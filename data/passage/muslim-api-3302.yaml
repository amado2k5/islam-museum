label: { ar: "صحيح مسلم 3302 — ما أُحل، ما لا يحل", en: "Sahih Muslim 3302 — what was made lawful; what is not lawful", ur: "صحیح مسلم 3302 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih Muslim 3302 — Lo que se ha hecho lícito; lo que no es lícito", fr: "Sahih Muslim 3302 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Sahih Muslim 3302 — Neler caizdir, neler caiz değildir", id: "Sahih Muslim 3302 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… لاَ هِجْرَةَ وَلَكِنْ جِهَادٌ وَنِيَّةٌ وَإِذَا اسْتُنْفِرْتُمْ فَانْفِرُوا \". وَقَالَ يَوْمَ الْفَتْحِ فَتْحِ مَكَّةَ \" إِنَّ هَذَا الْبَلَدَ حَرَّمَهُ اللَّهُ يَوْمَ خَلَقَ السَّمَوَاتِ وَالأَرْضَ فَهُوَ حَرَامٌ بِحُرْمَةِ اللَّهِ إِلَى يَوْمِ الْقِيَامَةِ وَإِنَّهُ لَمْ يَحِلَّ الْقِتَالُ فِيهِ لأَحَدٍ قَبْلِي وَلَمْ يَحِلَّ لِي إِلاَّ سَاعَةً مِنْ نَهَارٍ فَهُوَ حَرَامٌ بِحُرْمَةِ اللَّهِ إِلَى يَوْمِ الْقِيَامَةِ لاَ يُعْضَدُ شَوْكُهُ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3302، يذكر ما أُحل، وما لا يحل، والحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3302 (The Book of Pilgrimage), that mentions what was made lawful, what is not lawful, the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3302، جس میں جو حلال کیا گیا، جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 3302 (El Libro de la Peregrinación), menciona lo que es lícito, lo que no lo es, lo que es ilícito y lo que fue declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3302 (Le Livre du Pèlerinage), mentionne ce qui a été rendu licite, ce qui ne l'est pas, ce qui est illicite et ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 3302 numaralı hadis, helal, haram, yasak ve haram olan şeyleri sıralamaktadır. Bu helal ve haram (izin verilen ve yasaklanan) bilgiler, Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3302, menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dilarang, dan diharamkan. Daftar halal dan haram ini disusun oleh peramban Halal dan Haram, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
