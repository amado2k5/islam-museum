text: "فانتهوا إلى جبل أملس ليس عليه خضراء وإذا السد هنالك من لبن حديد مغيب في نحاس وهو مرتفع جداً لا يكاد البصر ينتهي إليه وله شرفات من حديد"
summary:
  ar: "ينقل ابن كثير عن الذهبي ما أملاه سلام الترجمان بعد رحلته إلى السد، وفيه وصف سدٍّ من لبن الحديد المغطّى بالنحاس."
  en: "Ibn Kathir relays, through al-Dhahabi, what Sallam the Interpreter dictated after his journey to the barrier, describing a wall of iron bricks set in copper."
  es: "Ibn Kathir relata, a través de al-Dhahabi, lo que Sallam el Intérprete dictó tras su viaje hasta la barrera, describiendo un muro de ladrillos de hierro unidos con cobre."
  fr: "Ibn Kathir rapporte, par l'intermédiaire d'al-Dhahabi, ce que Sallam l'Interprète a dicté après son voyage à la barrière, décrivant un mur de briques de fer serties de cuivre."
  ur: "ابن کثیر نے الذہبی کے ذریعے بیان کیا ہے کہ مترجم سلام نے رکاوٹ کی طرف سفر کے بعد کیا حکم دیا تھا، جس میں تانبے کی لوہے کی اینٹوں کی دیوار کو بیان کیا گیا تھا۔"
  tr: "İbn Kathir, Salam Al-Tarjuman'ın barajı ziyaretinden sonra dikte ettiği ve demir tuğlalardan yapılmış, bakırla kaplı bir barajı anlattığına dair Al-Dhahabi'den alıntı yapar."
  id: "Ibn Kathir mengutip Al-Dhahabi tentang apa yang didiktekan Salam Al-Tarjuman setelah perjalanannya ke bendungan, di mana ia menggambarkan sebuah bendungan yang terbuat dari batu bata besi yang dilapisi tembaga."
