label: { ar: "سنن ابن ماجه 1530 — عيادة المريض", en: "Sunan Ibn Majah 1530 — visiting the sick", ur: "سنن ابن ماجہ 1530 — بیمار کی عیادت" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنْ أَبِي إِسْحَاقَ الشَّيْبَانِيِّ، عَنِ الشَّعْبِيِّ، عَنِ ابْنِ عَبَّاسٍ، قَالَ مَاتَ رَجُلٌ وَكَانَ رَسُولُ اللَّهِ ـ يَعُودُهُ. فَدَفَنُوهُ بِاللَّيْلِ. فَلَمَّا أَصْبَحَ أَعْلَمُوهُ. فَقَالَ \" مَا مَنَعَكُمْ أَنْ تُعْلِمُونِي \". قَالُوا كَانَ اللَّيْلُ وَكَانَتِ الظُّلْمَةُ فَكَرِهْنَا أَنْ نَشُقَّ عَلَيْكَ. فَأَتَى قَبْرَهُ، فَصَلَّى عَلَيْهِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1530، يذكر عيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 1530 (Chapters Regarding Funerals), that mentions visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1530، جس میں بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
