label: { ar: "الموطأ 2382 — يحيى بن سعيد عن سليمان بن يسار: رجل وجد رجلا مع امرأته وإقرار المرأة عند عمر", en: "Muwatta 2382", es: "Muwatta 2382", fr: "Muwatta 2382", ur: "موطا 2382", tr: "El-Muvatta 2382 — Yahya bin Said, Süleyman bin Yaşar'dan rivayetle: Bir adam karısıyla başka bir adamı yakaladı ve kadın Ömer'in huzurunda itiraf etti.", id: "Al-Muwatta 2382 — Yahya bin Saeed berdasarkan riwayat Sulaiman bin Yasar: Seorang pria mendapati pria lain bersama istrinya, dan pengakuan wanita itu di hadapan Umar." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار عن أبي واقد الليثي أن رجلا أتى عمر بالشام فذكر أنه وجد رجلا مع امرأته، فبعث عمر أبا واقد الليثي إلى المرأة يسألها. فذكر لها قول زوجها، وأخبرها أنها لا تؤخذ بقوله، وجعل يلقنها أشباه ذلك لتنزع. فأبت أن تنزع وثبتت على الاعتراف، فأمر بها عمر فرجمت. {cite:muwatta-maruf-1997 p.385}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan, o da Ebu Vakid el-Layti'den rivayet eder ki, Suriye'de Ömer'e bir adam gelmiş ve karısıyla başka bir adam yakaladığını söylemiştir. Bunun üzerine Ömer, Ebu Vakid el-Layti'yi kadını sorgulaması için ona göndermiştir. Ebu Vakid el-Layti, kadına kocasının söylediklerini anlatmış ve kadının bu sözlerden sorumlu tutulmaması gerektiğini bildirmiştir. Kadını sözlerinden vazgeçmeye ikna etmeye çalışmış, ancak kadın reddetmiş ve itirafında ısrar etmiştir. Bunun üzerine Ömer, kadının taşlanarak öldürülmesini emretmiştir. {cite:muwatta-maruf-1997 s.385}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, dari Abu Waqid al-Laythi, bahwa seorang pria datang kepada Umar di Suriah dan mengatakan bahwa ia telah menemukan pria lain bersama istrinya. Maka Umar mengutus Abu Waqid al-Laythi kepada wanita itu untuk menanyainya. Ia memberitahukan kepadanya apa yang dikatakan suaminya dan memberitahunya bahwa ia tidak akan dimintai pertanggungjawaban atas pernyataan suaminya. Ia mencoba membujuknya untuk menarik kembali pengakuannya, tetapi wanita itu menolak dan tetap teguh pada pengakuannya. Maka Umar memerintahkan agar wanita itu dirajam. {cite:muwatta-maruf-1997 p.385}"
