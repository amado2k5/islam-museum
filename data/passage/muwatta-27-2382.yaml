label: { ar: "الموطأ 2382 — يحيى بن سعيد عن سليمان بن يسار: رجل وجد رجلا مع امرأته وإقرار المرأة عند عمر", en: "Muwatta 2382" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سليمان بن يسار عن أبي واقد الليثي أن رجلا أتى عمر بالشام فذكر أنه وجد رجلا مع امرأته، فبعث عمر أبا واقد الليثي إلى المرأة يسألها. فذكر لها قول زوجها، وأخبرها أنها لا تؤخذ بقوله، وجعل يلقنها أشباه ذلك لتنزع. فأبت أن تنزع وثبتت على الاعتراف، فأمر بها عمر فرجمت. {cite:muwatta-maruf-1997 p.385}"
