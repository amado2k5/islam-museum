text: "… مذهب هؤلاء بالتسمية بي المدتّر والقيمة والانفطار والمطقّفين والفجر والبلد والعصر والهُمزة ويسكت بينهنّ سكتةً فى مذهب حمزة وليس فى ذلك أثر يروى عنهم واعما هو استحباب : من الشيوح ولا خلاف فى التسمية فى اوّل فاتحة الكتاب وفى اوّل …"
summary:
  ar: "مقطع من التيسير في القراءات السبع للداني، المجلد المصوَّر 2، ص 26، يرد فيه ذكر المستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dani's al-Taysir fi al-Qira'at al-Sab', scan volume 2, p. 26, whose wording mentions the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "التیسیر فی القراءات السبع، دانی، اسکین جلد 2، ص 26 کا اقتباس جس میں مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Taysir fi al-Qira'at al-Sab' de al-Dani, volume numérisé 2, p. 26, dont le texte mentionne le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Taysir fi al-Qira'at al-Sab' de al-Dani, volumen digitalizado 2, p. 26, cuyo texto menciona lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Dani'nin \"El-Taysir fi el-Kira'at el-Sab'a\" (Yedi Okumanın Kolaylaştırılması) adlı eserinin 2. cildinin 26. sayfasından bir alıntı, tavsiye edilen amellerden bahsetmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Bu metin, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Al-Taysir fi al-Qira'at al-Sab'a\" (Kemudahan Tujuh Bacaan) karya Al-Dani, Jilid 2, halaman 26, menyebutkan amalan-amalan yang dianjurkan; ini berasal dari versi pindaian yang dapat dibaca mesin. Teks tersebut merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
