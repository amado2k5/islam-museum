text: "… المرءُوسين إلىٰ الرُّؤساء فلا جوابَ لها. وإن كانتْ من النَّظير فالواجبُ أن يُسْتعمل فى أجوبتها مندُوبُ التناصُف والتفاوض. جواب عن فعل المعروف والشكر عليه من كلام المتأخرين : من ذلك، من إنشاء الشيخ جمال الدين بن نباتة، وهو بعد الصدر …"
