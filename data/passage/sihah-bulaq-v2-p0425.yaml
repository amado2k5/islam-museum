text: |-
  بين الشطرين
  مثل الهذارى الحسن المطابل
  قوله قدة رنون المخ رواه فى مادة
  قتل
  لا تجعايف كفق قثول
  وذبيان اذزلت يأقدامها التعل
  قوة بالهناء دواءق مادة مقت
  فى الهناه ان
  ١٦٢
  واد ها ويقال رعه لاوالدات مشكله كما يقال الولد ميخلة ومجبنة والاشكال والائكول اغة
  فى العنكال والعشكول وهوالشراخ الذى عليه البسر وأنشدأبوعرو ٤ .
  قدأ بصرت سعدى بم اكتائلى • طويلة الاقناء والانا كل.
  أ ل) يقال للض أن الكثيرة ثلة قال أيويوف ولاية ال المعزى الكثيرة :لة ولكن حيلة
  والمع قالى مثل بدرة ويدر قال فاذا لجقعت الضأن والمعزى فكثر تاقيل لهماثلة والثلة أيضا
  الصوف بقال كساءجيد الثلة وحبل للذ أى صوف قال الراجز.
  قد قرنونى بامرئ قئول • رث كميل الثلة المبتلّ
  قال ولا يتال لاشعرالة ولا للوبرفاذا اجتمع الصوف والشعر والوبرقيل عند فلان:لة كثيرة
  وقد أئلّ الرجل فه ومثلَ اذا كفرت عنده الثلة وثلة البترا يضام أخرج من ترابها والثله
  بالضم إلماءة. ن الناس وثلت الداية تقلّ أى رائت وكذلك كل ذى حافر وثلمات التراب فى
  البتروغيرها اذا هلته وثلات الدراهم ثلاصيبتها وثلات البيت أثلد هد مته وهو أن تحفر أصل
  لحائط ثم تدفع فينقاض وهو أهول الهدم يقال ثلّ اللّٰه عرشهسم أى هدم ملكهم ويقال
  للوم اذا ذهب عزهم قدئل" عرشهم ومنه قول زهير ٣ تداركنما الاسلاف قدثل عرشم
  كانه هدم وأدلك وأنلتم اذا أمرت ياصلاح ماثل منه والنلل بانتحريك الهلاك تقول منه
  ثلت الرجل أثله ثلا وثللا عن الاصمحى قال ابيد
  خدلقناف مراد صلقة • وصداه الجقتهم بالتلل
  ( تمل الثميلة البقية من الماه فى الصخرة أوف الوادى والجمع عميل ومنه قول أبى ذويب
  بجرداء يتاب النميل حارها • أى يردح ارهذه المفازة بقايا الماء فى الحوض لانميا
  الغدران قد نذيت والثميلة أيضا البقية تبق من العلف والشراب فى يطن البعير وغيره وكل
  يقيسة غيلة وقال يونس يقال ماتمات شرابي بننى من طعام ومعناه ما أكلت قبل أن أشرب
  لمعاما وذلك يسمى التميلة قال أبوعمر و الثملة بالتريك البقية فى أسفل الاناء وغيره وكذلات
  الملة بالضيم والتملة أيضابالريك صوفة يمذ أبها البعير قال الراجز ٤
  ممعونة أعراضهم ممرطلة * كماتلاث بالهناه الثملة
  وهى المثلة أيضابالكسر والنمل بالضم السم المنقع وكذلت المثمل بالتشديد كأنه أنقع فبف
  ونبت والبمال أيضابمع تالة وهى الرغوة وقد أعل اللين أى كثرت عمالته والنمالة أيضامثل
  الملة وهى البقية فى أسذل الاناء أوالحوض وقدأعلت الشى أى أيقيتم وعلته تتميلابيته
  وعمالة ح" «ن العرب والنمال بالمكسر الغيات قال فلان عمال قومه أى غياث لهم يقوم
  بأحرهم قال إنطليل المنمل الملها وقل الرجل بالمكسر غلااذا أخذفيه الشراب فهوعل
  أى نشوان (تول الثول جاعة النحل قال الاصى "لا واحدله من لفظه وقولهم تويله
  من الناس أى جماعة جات من بيوت .تقرّقة وصبيان ومال حكاه بعفرب عن أب ماعد
  ويقال تنوّل علي مالقوم أى ب لوه بالشتم والضرب والثول باتهريك جنون يصيب الشاة فلا
  تتبح الغنم وتستدبرف مرنعها وشاة تولاء وتيس أنول قال الشاعر.
