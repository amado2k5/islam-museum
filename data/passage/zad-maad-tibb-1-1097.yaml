text: "… هدية في علاج الصُّداع والشقيقة حقيقة الصداع أسباب الصداع فصل سبب صداع الشقيقة وتعصيب الرأس يسكن الوجع فصل علاج الصداع العلاج بالحناء جزئي فصل منافع الحناء وخواصه فصل : في هديه في معالجة المرضى بترك إعطائهم ما يكرهونه من الطعام …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 1097، يذكر المرض والمريض، والوجع، وأسماء الأمراض، والعلاج، والحناء دواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 1097, that mentions illness and the sick, pain, named diseases, treatment, henna as a remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 1097 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، علاج، مہندی بطور دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 1097, que menciona la enfermedad y los enfermos, el dolor, enfermedades específicas, el tratamiento y la henna como remedio; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 1097, qui mentionne la maladie et les malades, la douleur, les maladies nommées, le traitement, le henné comme remède; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 1097. sayfasında hastalık ve hasta, ağrı, hastalıkların isimleri, tedavi ve kınanın bir ilaç olarak kullanımı ele alınmaktadır; bu metin, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, halaman 1097, menyebutkan penyakit dan orang sakit, rasa sakit, nama-nama penyakit, pengobatan, dan henna sebagai obat; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
