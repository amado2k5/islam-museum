text: "… إلى ذات الفعل، لا بالنّظر إلى ما يستلزم. وأيضاً؛ فإنما قال الكعبيُّ ما قال بالنَّظر إلى فعل المباح ؛ لأنه مستلزمٌ تركَ حرام، بخلافه بالنّظر إلى تَرْكِهِ، إذ لا يستلزم تركُه فعلَ واجبٍ فيكونَ واجباً، ولا فعلَ مندوبٍ فيكونَ مندوباً؛ …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 1، ص 175، يرد فيه ذكر الواجب، والمندوب، والمباح، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
