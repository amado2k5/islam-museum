label: { ar: "الموطأ 2311 — مالك: عقل المكاتب وولده في الكتابة يحسب من الكتابة", en: "Muwatta 2311", es: "Muwatta 2311", fr: "Muwatta 2311", ur: "موطا 2311", tr: "El-Muvatta 2311 — Malik: Azat sözleşmesi olan kölenin ve oğlunun aklı, sözleşmenin bir parçası sayılır.", id: "Al-Muwatta 2311 — Malik: Kecerdasan seorang budak yang memiliki perjanjian pembebasan dan anaknya dihitung sebagai bagian dari perjanjian tersebut." }
summary:
  ar: "قال مالك: الأمر الذي لا اختلاف فيه عندنا أن المكاتب إذا أصيب بجرح فيه عقل، أو أصيب أحد من أولاد المكاتب الذين معه في كتابته، فعقلهم عقل العبيد في قيمتهم، وما أخذ لهم من عقلهم يُدفع إلى سيدهم الذي له الكتابة، ويُحسب ذلك للمكاتب في آخر كتابته فيوضع عنه. ويضرب مالك لذلك مثالا بمكاتب على ثلاثة آلاف درهم، وديةُ الجرح الذي أخذه السيد ألف درهم. {cite:muwatta-maruf-1997 p.353}"
  tr: "Malik şöyle demiştir: Bizler arasında, azat sözleşmesi (mukatab) altında olan bir kölenin kan parası gerektiren bir yaralanmaya uğraması veya sözleşmesi gereği yanında bulunan çocuklarından birinin yaralanması durumunda, kan paralarının kölelerin değerine göre hesaplanması konusunda bir ihtilaf yoktur. Kan paralarından alınan herhangi bir miktar, sözleşmeyi elinde bulunduran efendiye ödenir ve bu miktar, sözleşmesinin sonunda köleye iade edilerek azaltılır. Malik, üç bin dirhemlik azat sözleşmesi altında olan bir kölenin örneğini verir ve efendinin aldığı kan parası bin dirhemdir. {cite:muwatta-maruf-1997 s.353}"
  id: "Malik berkata: Tidak ada perbedaan pendapat di antara kita bahwa jika seorang budak yang terikat kontrak pembebasan (mukatab) mengalami cedera yang membutuhkan uang darah, atau jika salah satu anaknya yang bersamanya di bawah kontrak tersebut mengalami cedera, maka uang darah mereka dihitung sesuai dengan nilai budak. Setiap jumlah yang diambil dari uang darah mereka dibayarkan kepada majikan mereka yang memegang kontrak tersebut, dan ini dikreditkan kepada budak tersebut pada akhir kontraknya dan dengan demikian dikurangi. Malik memberikan contoh seorang budak yang terikat kontrak pembebasan dengan nilai tiga ribu dirham, dan uang darah untuk cedera yang dialami majikan adalah seribu dirham. {cite:muwatta-maruf-1997 p.353}"
