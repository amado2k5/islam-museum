label: { ar: "الموطأ 2311 — مالك: عقل المكاتب وولده في الكتابة يحسب من الكتابة", en: "Muwatta 2311" }
summary:
  ar: "قال مالك: الأمر الذي لا اختلاف فيه عندنا أن المكاتب إذا أصيب بجرح فيه عقل، أو أصيب أحد من أولاد المكاتب الذين معه في كتابته، فعقلهم عقل العبيد في قيمتهم، وما أخذ لهم من عقلهم يُدفع إلى سيدهم الذي له الكتابة، ويُحسب ذلك للمكاتب في آخر كتابته فيوضع عنه. ويضرب مالك لذلك مثالا بمكاتب على ثلاثة آلاف درهم، وديةُ الجرح الذي أخذه السيد ألف درهم. {cite:muwatta-maruf-1997 p.353}"
