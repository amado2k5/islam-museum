text: |-
  (فصل الجيم
  جبب)
  ٣٥
  الراجز لمكل دهر قد ليست أنؤبا * حتى اكنسى الرأس قناعا أشيبا أملح لالذا ولا محببا
  قال سيبويه يقال اصاحب الثياب ثواب وثاب الرجل يثوب ثوبا وثوبا نا رجع بعد ذهابه
  وثاب الناس اجتمعواوجاؤا وكذلك الماءاذا اجتمع فى الحوض ومثاب الحوض وسطه الذى
  ثوب اليه الماءاذا استفر غ وهو الثبة أيضا والهاءعوض عن الواوالذاهبة من عين
  الفعل كماعوّضوا فى قولهم أقام اقامة وأصله اقوا ما والمشابة الموضع الذى يثاب اليه أى يرجع
  اليسه مرّة بعد أخرى ومنه قوله تعالى واذجعلنا البيت مقابة للناس وانماقيل للمنزل مثابة
  لانّ أهله يتصرفون فى أمور هم ثم يثوبون اليه والمع المئاب وربما قالو الموضع حبالة الصائد
  مثابة قال الراجز
  -ق متى تطلع المثابا * لعل شيخامهترامصابا
  عنى بالشيخ الوعل والمثاب مقام المستقى على فم البئرعند العرس قال القطامى ١
  ومالمثادات العروش بقية * اذا استل من تحت العروس الدعائم
  والثواب جزاء : لطاعة وكذلك المثوية قال اللّٰه تسارك وتعالى لمثوية من عند اللّه خير وأتاب
  الرحل أى رجمع اليه جسمه وصلح بدنه واستنا به سأله أن يثيبه وقوله تع الى هل ثوب الكفار
  ما كانوا يفعلون أى جوزوا والتثويب فى اذان الفجر أن يقول ال-لاة خير من النوم
  وقولهم فى المثل أطوع من ثواب هواسم رجل كان يوصف بالطواعية قال الشاءر
  وكنت الدهراست أطيع أنى * فصرت اليوم أطوع من تواب
  والثائب الريح الشديدة تكون فى أوّل المطرور جل ئيب وامرأة ثيب الذكر والانى فيه سواء
  قال ابن السكيت وذلك اذا كانت المرأة قدد خل بها أو كان الرجل قد دخل بامر أته تقول منه
  قدئيت المرأة
  صل الجيم أب أبوزيد الجأب الغليظ من جرالوحس يهمزولاي)* زويقال
  للظبية حين طلع قرنها جأية المدرى وأبو ع سدة لايهمزه قال بشر
  تعرّض جأبة المدرى خذول • بصاحة فى أسرّتها السلام
  وصاحة جبل والس_لام شجر وانماقيل جأية المدرى لانّ القرن أول ما يطلع يكون غليظا
  ثم يدق قسبه بذلكْ عسلى صغرسنها ويقال فلان شخت الآل جأب الصبر أى دقيق الشخخّص
  غليظ الصبر فى الامور والجأب الكسب تقول منه جأيت أجأب قال الراجز واللّه راع
  عملى وجأبي ( بب الجب القطع وخصىّ مجموب بين الجباب وبعيرأجب بين الجبب
  أى مقطوع السنام وفلان جب القوم اذا غلبهم قال الراجز
  من روّل اليوم لنا ذقد غلب * خبز ابسمن وهو عند الناس جب
  والجباب التى تلبس والحباب أيضا تلقيح النخل يقال جاءزمن الجباب وقد حب الناس النخل
  والجبة مادخل فيه الرمح من السنان والجبة موصل الوظليف فى الذراع قال الاصمعى هو مغرز
  الوظيف فى الحافر والتحبيب ان ييبلغ التحجيل ركبسة اليدوعرقوب الرحسل والفرس مجيب
  رفيه تجبيب والاسم الجبب قال الكميت
  أعطيت من غرر الاحساب شادخة • زينا وفزت من التحجيل بالجبب
  والتحبيب أيضا النفار يقال حبب فلان فذهب والمجسة جادة الطريق والجباب بالضم شئ
  ١ صف البتروتهوّرها اه ش
