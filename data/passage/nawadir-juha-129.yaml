label: { ar: "نوادر جحا الكبرى، ص 61 — «لماذا أنقل أصابعي؟»", en: "Nawadir Juha al-Kubra, p. 61 — 'Why Should I Move My Fingers?'", ur: "نوادر جحا الکبریٰ، ص 61 — «میں اپنی انگلیاں کیوں ہلاؤں؟»", fr: "Nawadir Juha al-Kubra, p. 61 — « Pourquoi bouger mes doigts ? »", es: "Nawadir Juha al-Kubra, p. 61 — «¿Para qué mover los dedos?»", tr: "Juha'nın Muhteşem Fıkraları, s. 61 — “Parmaklarımı neden hareket ettiriyorum?”", id: "Anekdot Hebat Juha, hlm. 61 — “Mengapa saya menggerakkan jari-jari saya?”" }
text: "… لماذا أنقل أصابعي؟ كان في مجلسٍ، فأعطوهُ عوداً، ليعزِفَ عليه، وقالوا أسمِعْنا. فأخذَ العود، وبدأ يضربُ عليه منَ الأسفل إلى الأعلى، بصوت مزعج. فقالوا له: ما هُكذا يدقُّ بالعود، فيلزم أنْ تلعبَ أصابعُك على الأوتار، حسَبَ الأصول. فأجابهم: إذا لم …"
summary:
  ar: "أُعطي جحا عودًا ليعزف عليه، فمرّ بيده على الأوتار من أسفل إلى أعلى بصوت عالٍ؛ فقيل له أن ينقر على الأوتار، فقال إن النغمة إن لم تخرج فلماذا يتعب نفسه في تحريك أصابعه. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  en: "Given a lute to play, Juha strums it loudly from bottom to top; told to pluck along the strings, he says that if the note does not come, why tire himself moving his fingers. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  ur: "جحا کو بجانے کے لیے عود دیا گیا تو اس نے اونچی آواز سے تاروں پر نیچے سے اوپر ہاتھ پھیرا؛ کہا گیا کہ تاروں کو الگ الگ چھیڑو، تو اس نے کہا کہ اگر سُر نہیں نکلتا تو انگلیاں ہلا کر خود کو کیوں تھکاؤں۔ {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  fr: "On donne un luth à Juha pour qu'il en joue; il le gratte bruyamment de bas en haut; quand on lui dit de pincer les cordes, il répond que si la note ne vient pas, pourquoi se fatiguer à bouger les doigts. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  es: "Le dan un laúd a Juha para que lo toque; lo rasguea ruidosamente de abajo arriba; cuando le dicen que pulse las cuerdas, responde que si la nota no sale, para qué cansarse moviendo los dedos. {cite:juha-nawadir-kubra-djuwaydi p. 61}"
  tr: "Juha'ya çalması için bir lavta verildi ve o da yüksek sesle tellerin üzerinde elini alttan üste doğru gezdirdi. Daha sonra telleri çekmesi söylendi, ancak o, eğer hiçbir nota çıkmıyorsa neden parmaklarını hareket ettirerek kendini yorsun diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 61}"
  id: "Juha diberi kecapi untuk dimainkan, dan dia menggesekkan tangannya di sepanjang senar dari bawah ke atas dengan suara keras. Kemudian dia disuruh memetik senar, tetapi dia menjawab bahwa jika tidak ada nada yang keluar, mengapa dia harus lelah menggerakkan jari-jarinya? {cite:juha-nawadir-kubra-djuwaydi p. 61}"
