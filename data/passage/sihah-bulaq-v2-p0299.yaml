text: |-
  عفت الديار محلها فقامها
  ٢٨٨
  اذا لم تكن حاجاتنا فى نهوسكم * فليس بمذن عنك عقد الرتائم
  والرقمة بالتريك ضرب من الشجر والجمع رتم وقال
  تطرت والعين مبينة التهم * الى سناناروقودها الرتم * شبت بأعلى عاندين من اضم
  وكان الرجل اذا أراد سفراعمد الى شجرة فشة غصنين منهافان رجع ووجدهما على حاله-ما
  قال انّ أهله لم تخفه والافقدخانته وقال الراجز
  هل يتفعنك اليوم ان هوت بهم • كثرة ما توصى وتعة ادالرتم
  ورغت الشى رتما كسرته يقال رتم أنفه بالتساه والشامجيعا والرتم أيضا المرتوم وقال اوس
  ابن حجر
  لاصبح رقمادقاق الحصى * مكان النيّ من الكائب
  ومارتم فلان بكامة أى ما تكلم بها: ثم ، ئمت أنفه اذا كسرته حتى أدميته ورءت المرأة
  أنفها بالطيب طلته ولطخته قال ذوارمة
  تثنى النقاب علىء رنين أرنبة * شماءمارنها بالمسك مرثوم
  كأنه جعل المسلك فى المارن شيها بالدم فى الانف المرنوم والرثم ياض فى بحفلة الفرس العلبا
  وقدار ثمّ الفرس ارعماماصار أرثم وهى الرغة وخفّ مرثوم مثل ملثوم اذا أصابته حجارة
  فدمى جم الرحم القتسل وأسله الرمى بالجارة وقدرجته أرجه ربحا فهورجيم
  ومرجوم والربحة بالضم واحدة الرجم والرجام وهى حجارة ضخام دون الرضام ورجما بجعت
  على القبرليستم وقال عبد اللّٰه بن مغفل فى وصيته لاتربحواقبرى أى لاتجعلواعليه الرحم
  أراد بذلك نسوية قبره بالارض وأن لا يكون مسنمامر تفعا كما قال الضهالئ فى وصيته ارمسوا
  قبرى رمسا و المحدّثون بقولون لا ترجواقبرى والصحيح أنه مندد والرجم بالتحريك القبر قال
  كعب بنزهير أنا ابن الذى لم يخزنى فى حياته • ولم أخزه لى تغيب فى الرجم
  والرجام المرجاس وربماشد ببارفء رقوة الدلوليكون أسرع لاغحدارها ورجل مرجم
  بالكسر أى شديد كائه يرجم به معاديه وفرس مرجم يرجم فى الارض بحوافره والرجم أن
  يتكلم الرجل بالفان قال تعالى ربها بالغيب يقال صار فلان رجمالا يوقف على حقيقة أمره
  ومنسه الحديت المرجم بالتشديد وترابهوا بالجارة أى تراموابها وراجم فلان عن قومه اذا
  ناضل عنهم ورجام موضع قال لبيد (١ *بمنى تأبدغواها فرجامها والرجامان خشبتان
  تنصبان على رأس البتر ينصب عليه-ما القعوهالرحة بالضم وجار الضبع ويال قد ترجم
  كلامه اذافسره بلسان آخرومنه الترجمان والجمع التراجم مشل زعفران وزعافر وصحصحان
  ومخاصح ويقال ترجان ولك أن تضم التاهاضمة الجيم فتقول ترجان مثل يسروع
  ويسروع قال الراجزو
  الا الخمام الورق والغطاطا * فهنّ يلغدان به الغاطا • كالتربجان اتى الانساطا
  ⁦( رحم)⁩ الرحمة الرقة والتعطف والمرحة مثله وقدرحته وترحت عليه وتراحم القوم رحم
  بعضهم بعضا والرحوت من الرحة يقال رهبوت خير من وجوت أى لان ترهب خيرمن أن
  زحم ورجل مرحوم ومرحم تددلله بالغة والرحم رحم الانى وهى مؤننة والرحم أيضا
  القرابة والرحم بالكسرمثله قال الاعشق
