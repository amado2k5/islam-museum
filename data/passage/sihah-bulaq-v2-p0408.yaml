text: |-
  ١٧٩
  وأنتم كواكب محسولة • زى فى السماء ولا تعلم
  ويروى مسخولة خشل الحشل المقل اليابس ويقال نوى المقل وكذلك الخشل
  بالتحريك قال السكميت
  يستخرج الحشرات الحتن ريقها • كأن أروسها فى موجه الخشل
  الواحدة خشلة وختلة ويقال رؤس الإسورة والخلاخيل خشل وخشل وقال بعضهم
  الحشل الردىء من كل شى وقد تخشل قال أبومر والختشليل الماذى ⁦(خصل)⁩ الخصل
  فى النضال الخطر الذى يخاطر عليه وتخاصل القوم أى تراهنوا فى الرمى يقال أحرز فلان
  خصد وأصاب خصلد اذاغلب وخصلت القوم خصلا وخصالانضلتم-م قال السكميت
  عدح رجلا
  مقت الى انلحرات كل مناضل • وأحوزت بالعشر الولاء خصالها
  والحصلة الخلة والخصلة بالضم افيغة من معر والخصل أطراف الشحر المتدلية والخميلد
  كل لهةء-لى حيزها من لحم الفخذين والعضدين والمفصل السيف القاطع اغة فى المقصل
  ⁦( خضل )⁩ أخضات الشى فهو محضل اذابلته وشئ خضل أى رطب والخضيل النبات
  الناعم والحضيلة الروضة واخضل الشئ اخضلالا واخضوضل أى ابتلّ واخضالت التهجرة
  خضد لا لا اذا كنرت أغصانها وأوراقها وقول مر داس الدبيرى
  اذاقات انّ اليوم يوم خضلة * ولاشر زلاقيت الامور البجاريا
  يعنى الخصب ونضارة العيش ( مال أذن خطلا بيئة الخطل أى مسترخية وثلة خطل
  وهى الغنم المسترخية الا ذان وكذلك الكلاب ومنه عى الاخطل ورح خمل أى مضطرب
  ورجل جواد خطل أى مريع الاعطاء والخطل المنطق الفاسد المضطرب وقد خطل فى كلامه.
  بالمكسر خطلا وأخطل أى أخس والخيطل السسخور والخنطول الذكر الطويل والقرن
  الطويل والحنطولة واحدة الخناطيل وهى قطعان البر قال ذوالرقة
  دعت مية الاعدادواستيدات بها • خناطيل آجال من العين خذل
  استبدلت بها يعن منازاها التى تركتها والاعداد المياه التى لا تنقطمع وكذلات الحناطيل
  من الابل قال سعد بن ز يدمناة يخاطب أخاه مالك بن زيد مناة .
  تظل يوم وردهامز عفرا * وهى خفاطيل قجوس الخضرا
  عل ، الخيعل قبص لاحكمى له وانما أسقطت النون من كمين للاضافة لات اللام
  كالمقحمة لا يعتسة بها فى مثل هذا الموضع كوله-م لا أبالك وأصله لا أ باله ألاترى الى
  قول النساعر
  أبالموت الذى لابة أنى • ملاق لاأبالنتخوفيف
  وك ولك لاعبدى لك لانه بمنزلة لاعبديك ولا تحذف النون قى.ثل هذا الاعند اللام دون
  سا رحروف الخفض لانه الا تأتى بمعنى الاضافة وتقول خيعلته تتضيعل أى ألبسته الفبعل
  فلبسه خلل اخلّ معروف وانخل طريق فى الرمل يذكرويؤنتية ال حية خل كما
  يقال أفعى صريمة والخلّ الرجل الخيف المختل الجسم ومنه قول الشاءر ( ١
