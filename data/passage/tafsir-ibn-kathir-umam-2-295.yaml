text: "… للأنبياء بالقوارع التى تعم تلك الأمم المكذبة كما أهلك قوم نوح بالطوفان، وعادا الأولى بالدبور، ونمود بالصيحة، وقوم لوط بالحسف والقلب وحجارة السجيل، وقوم شعيب بيوم الظلة، فلما بعث اللّٰه تعالى موسى وأهلك عدوه فرعون وقومه بالغرق فى اليم ثم …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 2، ص 295، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 2, p. 295, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 2، ص 295 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 2, pág. 295, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tafsir d'Ibn Kathir, volume 2, page 295, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "İbn Kathir'in Tefsir'inin 2. cildinin 295. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Müslüman olmayan milletler, dinler, mezhepler ve halklar için tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari Tafsir Ibn Kathir, Jilid 2, halaman 295, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
