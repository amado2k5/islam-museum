text: "… فَيْحِ جَهَنَّمَ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي سَعِيدٍ وَأَبِي ذَرٍّ وَابْنِ عُمَرَ وَالْمُغِيرَةِ وَالْقَاسِمِ بْنِ صَفْوَانَ عَنْ أَبِيهِ وَأَبِي مُوسَى وَابْنِ عَبَّاسٍ وَأَنَسٍ. قَالَ وَرُوِيَ عَنْ عُمَرَ عَنِ النَّبِيِّ فِي هَذَا وَلاَ يَصِحُّ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدِ اخْتَارَ قَوْمٌ مِنْ أَهْلِ الْعِلْمِ تَأْخِيرَ صَلاَةِ الظُّهْرِ فِي شِدَّةِ الْحَرِّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 157، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 157 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 157، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
