text: "… وفى بعض الفاظه ان ابنى هذا ريحانتى من الدنيا وان انى هذا سيد وعسى اللّه ان يصلح به بين فئتين من المسلمين اخرجه ابن عدى وروى الحافظ ان عمر بن الخطاب لما دون الديوان وفرض العطاء الحق الحسن والحسين بفريضة …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 2، ص 216، يرد فيه ذكر الفريضة والفرائض، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 2, p. 216, whose wording mentions the obligation (farida), the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 2، ص 216 کا اقتباس جس میں فریضہ اور فرائض، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de History de Damascus de Ibn 'Asakir, volume numérisé 2, p. 216, dont le texte mentionne l'obligation (farida), l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de History de Damascus de Ibn 'Asakir, volumen digitalizado 2, p. 216, cuyo texto menciona la obligación (farida), lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Asakir'in Resimli Şam Tarihi'nin 2. cildinin 216. sayfasından bir alıntı, farz olan amellerden ve münferit yükümlülüklerden (farz) bahsetmektedir. Bu alıntı, makine tarafından okunabilir, taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 2 Bergambar, halaman 216, menyebutkan amalan-amalan wajib dan kewajiban individu (fard). Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
