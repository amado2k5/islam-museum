summary:
  ar: "قال مالك: وكذلك الحر والعبد يقتلان العبد عمدا: فيُقتل العبد، ويكون على الحر نصف قيمة العبد. {cite:muwatta-maruf-1997 p.419}"
  tr: "Malik şöyle dedi: Benzer şekilde, eğer özgür bir adam ve bir köle kasten bir köleyi öldürürse, köle öldürülmüş sayılır ve özgür adam kölenin değerinin yarısını ödemek zorundadır. {cite:muwatta-maruf-1997 s.419}"
  id: "Malik berkata: Demikian pula, jika seorang pria merdeka dan seorang budak dengan sengaja membunuh seorang budak, budak itu terbunuh, dan pria merdeka itu harus membayar setengah dari nilai budak tersebut. {cite:muwatta-maruf-1997 p.419}"
