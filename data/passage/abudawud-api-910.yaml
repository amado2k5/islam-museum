label: { ar: "سنن أبي داود 910 — الأب والأبوة", en: "Sunan Abi Dawud 910 — the father and fatherhood", ur: "سنن ابی داؤد 910 — باپ اور والدیت" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنِ الأَشْعَثِ، - يَعْنِي ابْنَ سُلَيْمٍ - عَنْ أَبِيهِ، عَنْ مَسْرُوقٍ، عَنْ عَائِشَةَ، -ا - قَالَتْ سَأَلْتُ رَسُولَ اللَّهِ عَنِ الْتِفَاتِ الرَّجُلِ فِي الصَّلاَةِ فَقَالَ \" إِنَّمَا هُوَ اخْتِلاَسٌ يَخْتَلِسُهُ الشَّيْطَانُ مِنْ صَلاَةِ الْعَبْدِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 910، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 910 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 910، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
