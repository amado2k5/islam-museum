label: { ar: "صحيح مسلم 6562 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Sahih Muslim 6562 — ranks raised; bad deeds erased and sins shed", ur: "صحیح مسلم 6562 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sahih Muslim 6562 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Sahih Muslim 6562 — Les rangs sont élevés; les mauvaises actions sont effacées et les péchés sont pardonnés.", tr: "Sahih Muslim 6562 — Dereceleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Sahih Muslim 6562 — Menaikkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو كُرَيْبٍ وَاللَّفْظُ لَهُمَا ح وَحَدَّثَنَا إِسْحَاقُ الْحَنْظَلِيُّ، قَالَ إِسْحَاقُ أَخْبَرَنَا وَقَالَ الآخَرَانِ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ، عَنِ الأَسْوَدِ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" مَا يُصِيبُ الْمُؤْمِنَ مِنْ شَوْكَةٍ فَمَا فَوْقَهَا إِلاَّ رَفَعَهُ اللَّهُ بِهَا دَرَجَةً أَوْ حَطَّ عَنْهُ بِهَا خَطِيئَةً \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6562، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 6562 (The Book of Virtue, Enjoining Good Manners, and Joining of the Ties of Kinship), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 6562، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato del Sahih Muslim, n.º 6562 (El Libro de la Virtud, que ordena las buenas costumbres y fortalece los lazos de parentesco), habla de ascensos de rango, borrado de malas acciones y purificación de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 6562 (Le Livre de la Vertu, qui exhorte à la bonne conduite et renforce les liens de parenté), évoque l'élévation de grade, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui traitent de la comptabilisation, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "Sahih Müslim'de 6562 numaralı hadis, derecelerin yükseltilmesinden, günahların silinmesinden ve zulümlerin giderilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6562, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
