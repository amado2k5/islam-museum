text: "… عَلَى أبيك كرْبٌ بعْدَ اليوْمِ فلمَّا مَاتَ قالَتْ: يَا أَبتَّاهُ أَجَاب ربّا دعَاهُ، يا أبتَاهُ جنَّةُ الفرْدَوْسِ ماوَاه، يَا أَبَتَاهُ إِلَى جبْريلَ ثُنعَاهُ ؛ فلَمَّا دُفنَ قالتْ فاطمَةُا : أطَابتْ أنفسكُمْ أَنْ تَحْثُوا عَلَى رسُول اله لَالِعم التُّرابَ؟ رواهُ - …"
summary:
  ar: "مقطع من رياض الصالحين، المجلد المصوَّر 3، ص 21، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Riyad al-Salihin, scan volume 3, p. 21, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ریاض الصالحین، اسکین جلد 3، ص 21 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin, volume numérisé 3, p. 21, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Riyad al-Salihin, volumen escaneado 3, p. 21, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Riyad as-Salihin, Resimli Cilt 3, sayfa 21'den, vefat eden kişi için ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Riyad as-Salihin, Jilid Bergambar 3, halaman 21, berisi elegi dan pujian untuk almarhum; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan pujian paling terkenal."
