text: |-
  ٦٤
  )باب 111. )
  وأسليت الثاقة اذا. كانت تلك حالها وفرس سلب القوائم وهوالخفيف نقل القوائم ورجل
  ساب اليدين بالطعن وتورساب الطحن بالقرن لجب) المسلجب المستقيم يقال طريق
  سلحب أى ممتدوقد اسلحب اسلجبابا قال جران العود
  نفترجران مسلحبا كأنه * على الدف ضبعان تقطر أملح
  ⁦( سلهب)⁩ السلهب من الفيل الفرس العاويل على وجه الارض وربعاجاء بالصادوصف
  أعرابى فرسافقال
  اذا عد السلهبة واذاقيداجلعب واذا انتصب اتلابة
  نب) مضى سنب من الده روسنبة أى برهة وسنيتة أيضابزيادة التلء والحاقها رابعة
  وهذه التاءتثبت فى التصغير تقول سنيبتة لقواهم فى الجمع سذابت وفرس سنب بكسر الذون
  أى كنير الجرى وابهع سسغوب ⁦(سهب )⁩ السهب الفلاة والفرس الواسع الجرى ويئر
  سهبة بعيدة القعرومسهبة أيضا بفتح الهاء وحفروافأسهبوا باغوا الرمل ولم يخسرج الماء
  وأسهب الفرس اتسع فى الجرى وسبؤ وأسهب الرجل اذاأ كثر من الكلام فهومسهب
  يفعح الهاء ولا يقال بكسرها وهونادروأسهب الرجل على مالم يسم فاعله اذاذهب عقله من
  لدغ الجية ⁦( يب)⁩ السيب العطاء والسبوب الركاز والسيب مصدرساب الماءيسيب أى
  جرى والسيب بالسكسر مجرى الماء وانساب فلان تحوكم أى رجع وانسايت الحية جرت
  وسمت الداية تركتها تسيب حيث شاءت والسائبة الناقة التى كانت تسيب فى الجماهلية
  لنذرونحوه وقد قيل هى أتم البحيرة كانت الناقة اذاولدت عشرة أبكان كاهن اناث سميتف-لم
  تركب ولم يشرب لينها الاولدها أو الضيف حتى تموت فاذامانت أكل !بالرجال والنساء
  معا وبجرت أذن بنتها الاخيرة قنسمى البحمرة وهى بنزلة أمها فى أنم اسائبة والهع سبب مثل
  فأئحة ونوّح ونائمة ونوّم والسائية العدد كان الرحمل اذا قال لغلامه أنت سائية فقدعتو
  ولا يكون ولا ؤه لمعتقه ويضع ماله حيث شاء وهوالذى ورد النهى عنه والسبلب مثال
  السحاب الطلح والسياية البلهة وبهاسمى الرحل فاذ اشددته ضممتسه قات سيراب وسياية
  والسوبان اسم واد
  ف ل الشين أب الشؤيوب للدفعة من المطر وغيره والجمع الشا بيدب قال
  كعب بن زهيريدك والجاروالاثن
  اذا ما اتتحاهنّ شؤبوبه • رأيت لجاعربسه غضونا
  شؤبوبه شدة دفعته بقول اذاعداواشتدعدوه رآيت لماءرتيه تكسرا ⁦(شبب)⁩.
  الش-باب جع شاب وكذلك الشسبان والشباب أيضا الحداثه وكذلك النبية وهوخلاف
  الشيب تقول شب الغلام يشب بالكرشبابا وشبيبة وأشبه اللّٰه وأشب اللّٰه قرنه ؟عف
  والقرن زيادة فى الكلام وامرأُة شبة وشاية بمعنى وبنوشبابة قوم بالطائف وأشب الرجل
  ينين إذاشب أولاده وأشب لى كذا اذا أنيح لى وشب أيضاعلى مالم يسم فاءلد فيه-ما وقولهم
  أعيفى من شب الهدب أى من لدن شيت الى أن دببت على العصا كما قيل نهى رسول اللّٰه
  صلى اللّٰه عليه وسلم عن قيل وقال ويقال أيضامن شب الى دب يجعل بنزلة الاسم بادخال من
  عليم
