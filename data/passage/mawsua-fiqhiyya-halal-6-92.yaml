text: "… الفواكه الدواني : لا يلبس النساء من الرقيق ما يصفهن إذا خرجن من بيوتهن، والخروج ليس بقيد، وحاصل المعنى : أنه يحرم على المرأة لبس مايرى منه جسدها بحضرة من لا يحل له النظر. ولا يجوز لها أن تأتي من …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 92، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 6, p. 92, that mentions what was made lawful, what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 6، ص 92 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 6, pág. 92, que menciona lo que se ha declarado lícito, lo que no lo es y lo que se ha declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation, volume 6, p. 92) mentionnant ce qui a été rendu licite, ce qui ne l'est pas et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 6, sayfa 92'den, izin verilen, izin verilmeyen ve haram olan şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 6 Bergambar, halaman 92, yang menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dan dilarang; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
