label:
  ar: "أبو داود 864 — أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع"
  en: "Abu Dawud 864 — The first thing a servant is reckoned for is his prayer"
  ur: "ابو داود 864 — بندے سے سب سے پہلے نماز کا حساب ہوگا"
text: "إن أول ما يحاسب الناس به يوم القيامة من أعمالهم الصلاة قال يقول ربنا جل وعز لملائكته وهو أعلم انظروا في صلاة عبدي أتمها أم نقصها فإن كانت تامة كتبت له تامة وإن كان انتقص منها شيئا قال انظروا هل …"
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 864: أول ما يحاسب به العبد صلاته: انظروا هل لعبدي من تطوع. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 864: The first thing a servant is reckoned for is his prayer. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 864: بندے سے سب سے پہلے نماز کا حساب ہوگا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
