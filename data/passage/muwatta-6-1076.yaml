label: { ar: "الموطأ 1076 — أبو الزبير المكي: رأيت البيت يخلو بعد صلاة الصبح وبعد صلاة العصر، ما يطوف به أحد", en: "Muwatta 1076", es: "Muwatta 1076", fr: "Muwatta 1076", ur: "موطا 1076", tr: "El-Muvatta 1076 — Ebu el-Zübeyr el-Mekki: Sabah namazından sonra ve ikindi namazından sonra Kâbe'yi boş gördüm, etrafında tavaf eden kimse yoktu.", id: "Al-Muwatta 1076 — Abu al-Zubayr al-Makki: Aku melihat Ka'bah kosong setelah salat subuh dan setelah salat asar, tidak ada seorang pun yang melakukan tawaf." }
text: "رأيت البيت يخلو بعد صلاة الصبح وبعد صلاة العصر، ما يطوف به أحد"
summary:
  ar: "يرويه مالك عن أبي الزبير المكي أنه قال: رأيت البيت يخلو بعد صلاة الصبح وبعد صلاة العصر، ما يطوف به أحد. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1299) وسويد (555) والشيباني (439). {cite:muwatta-maruf-1997 p.496}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den rivayet ederek şöyle demiştir: \"Sabah namazından sonra ve ikindi namazından sonra Kâbe'yi boş gördüm; kimse tavaf etmedi.\" Editör, bunun Malik'ten Ebu Mus'ab (1299), Suveyd (555) ve el-Şeybani (439) tarafından da rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.496}"
  id: "Malik meriwayatkan hadits ini dari Abu al-Zubayr al-Makki, yang berkata: \"Aku melihat Ka'bah kosong setelah shalat subuh dan setelah shalat ashar; tidak ada seorang pun yang melakukan tawaf.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1299), Suwayd (555), dan al-Shaybani (439). {cite:muwatta-maruf-1997 p.496}"
