text: "… أبى بن كعب، الجماع للقرآن على عهد الذبى، ترتيب سور القرآن فى مصحف أمير المؤمنين على بن أبى طالب، أخبار القراه السبعة وأسماء رواياتهم وقراءتهم نسمية الكتب التى ألفها الملماء فى قرامته •، أسماء قراء التوذان وأنساب القراء من أهل …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 5، ص 518، يذكر قراءات القرآن، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 5, p. 518, that mentions the readings of the Qur'an, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 5، ص 518 کا اقتباس جس میں قرآن کی قراءتیں، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 5, pág. 518, que menciona las lecturas del Corán, los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
