text: "… من التطوع ولا يقضي.... من كان يدعو بغدائه فلا يجد، فيفرض الصوم... من قال: لا صيام لمن لم يعزم من الليل.... ما قالوا في تفريق رمضان... من كان يقول: لا يفرقه... أبواب ما يباح للصائم : باب من رخص في …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 68، يرد فيه ذكر ما فُرض على الناس، والتطوع، والمباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
