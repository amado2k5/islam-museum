text: "… والثامن نية الطواف وصلاته وموالاته. وفى. الثلاثة خلاف الأصح أنها سنة والثانى واجبة. وأما السنن فثمانية أيضا أحدها أن يكون ماشيا والثانى الاضطباع الثالث الرمل الرابع استلام الحجر الأسود وتقبيله ووضع الجبهة عليه الخامس المستحبة فى الطواف وسنذكرها إن شاء …"
summary:
  ar: "مقطع من المجموع للنووي، ص 22، يرد فيه ذكر الواجب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
