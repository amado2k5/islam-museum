text: "روى ابن المبارك بإسناده عن رجل من أصحاب النبي- أنه قال: طلع علينا رسول الله- من الباب الذي دخل منه بنو شيبة ونحن نضحك فقال: \"ألا أراكم تضحكون! \" ثم أدبر حتى إذا كان عند الحجر رجع إلينا القهقرى، فقال: \"إني لما خرجت جاء جبريلفقال:"
