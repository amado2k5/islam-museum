  en: "Sahih al-Bukhari, Book 31: Praying at Night in Ramadaan (Taraweeh)"
  ur: "صحیح بخاری، کتاب صلاۃ التراویح"
  es: "Sahih al-Bukhari, Libro 31: Orar por la noche en Ramadán (Taraweeh)"
summary:
  ar: "القسم 31 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب صلاة التراويح»، ويضم فيها النصوص من 2008 إلى 2013 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 31 of Sahih al-Bukhari (Praying at Night in Ramadaan (Taraweeh)) in the division of the open hadith dataset the museum took its reports from: reports 2008 to 2013 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 31، عنوان «کتاب صلاۃ التراویح»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2008 تا 2013۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 31 de Sahih al-Bukhari (La oración nocturna en Ramadán (Taraweeh)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2008 al 2013, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
