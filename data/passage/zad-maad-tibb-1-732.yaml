text: "… أَصْلِحْ لَحْمَهَا فلم أزل أطعِمُه منه إلى المدينة مسلم:. القديدُ: أنفع من النمكسود، ويُقوي الأبدان، ويُحدثُ حِكة، ودفع ضرره بالأبازير الباردة الرطبة، ويصلُح الأمزجة الحارة والنمكسود: حار يابس مجفِّف، جيِّدُه من السمين الرطب، يضرُّ بالقولنج، ودفع مضرته طبخه باللبن والدهن، …"
