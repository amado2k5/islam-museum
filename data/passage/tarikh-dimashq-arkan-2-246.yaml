text: "تأديب عن محمد بن جعفر الخرايطى وجماعة غيره وروى عنه جماعة واسند الحافظ من طريقه عن ابن عمر إنه قال وجد رسول اللّه رجلا يعظ اخاه فى الحياء فقال له دعه فان الحياء من الايمان وقال على بن محمد حدثنا …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 2، ص 246، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 2, p. 246, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 2، ص 246 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Historia de Damasco de Ibn 'Asakir, volumen 2, pág. 246, que menciona lo que se considera parte de la fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
