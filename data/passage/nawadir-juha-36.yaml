text: "… يا ليت كل يوم عيد ذهب في إحدى سني القحط إلى قرية فرأى الأهالي في بحبوحة من العيش والرفاهية يقدمون له أفخر الحلوى، وأطيب المأكول، فقال: ما بالُ أهل هذه القرية في سَعةٍ من العيش؟ وسكان بلدي يتضوّرون جوعاً؟ فأجابه …"
summary:
  ar: "في عام مجاعة رأى جحا قرية تحتفل، فقيل له إنه عيد، فقال يا ليت كل يوم عيد لتنجو بلدته من الضيق. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  en: "In a famine year, Juha sees a village feasting; told that it is a festival, he says he wishes every day were a festival so that his town could escape hardship. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  ur: "قحط کے سال جحا نے ایک گاؤں کو دعوت اڑاتے دیکھا؛ اسے بتایا گیا کہ یہ عید ہے، تو اس نے کہا کاش ہر دن عید ہوتا تاکہ اس کا شہر تنگی سے بچ جاتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  fr: "Pendant une année de famine, Juha voit un village en train de festoyer ; on lui dit que c'est une fête, et il répond qu'il voudrait que chaque jour en soit une, pour que sa ville échappe à la misère. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  es: "En un año de hambruna, Juha ve a un pueblo banqueteando; al decirle que es una fiesta, dice que ojalá cada día lo fuera para que su ciudad escapara de las penurias. {cite:juha-nawadir-kubra-djuwaydi p. 22}"
  tr: "Bir kıtlık yılı sırasında Juha, bir köyün kutlama yaptığını gördü. Ona bunun bir bayram olduğu söylendi ve Juha, \"Keşke her gün bayram olsa da kasabam bu sıkıntılardan kurtulsa\" dedi. {cite:juha-nawadir-kubra-djuwaydi s. 22}"
  id: "Pada tahun kelaparan, Juha melihat sebuah desa merayakan sesuatu. Ia diberitahu bahwa itu adalah hari libur, dan ia berkata, \"Seandainya setiap hari adalah hari libur agar kotaku terhindar dari kesulitan.\" {cite:juha-nawadir-kubra-djuwaydi p. 22}"
