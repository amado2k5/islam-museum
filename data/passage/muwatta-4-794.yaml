label: { ar: "الموطأ 794 — عائشة وأم سلمة: كان النبي يصبح جنباً من جماع غير احتلام في رمضان ثم يصوم", en: "Muwatta 794" }
text: "كان رسول الله يصبح جنباً من جماع غير احتلام في رمضان، ثم يصوم"
summary:
  ar: "يرويه مالك عن عبد ربه بن سعيد عن أبي بكر بن عبد الرحمن بن الحارث بن هشام عن عائشة وأم سلمة زوجي النبي، أنهما قالتا: كان رسول الله يصبح جنباً من جماع غير احتلام في رمضان ثم يصوم. ويذكر المحقق أن أبا مصعب (777)، والقعنبي عند أبي داود (2389)، وأحمد من طريق ابن مهدي عن مالك عن سمي وعبد ربه بن سعيد. {cite:muwatta-maruf-1997 p.390} {cite:muwatta-maruf-1997 p.391}"
