label: { ar: "الموطأ 794 — عائشة وأم سلمة: كان النبي يصبح جنباً من جماع غير احتلام في رمضان ثم يصوم", en: "Muwatta 794", es: "Muwatta 794", fr: "Muwatta 794", ur: "موطا 794", tr: "El-Muvatta 794 — Aişe ve Ümmü Seleme: Peygamberimiz Ramazan ayında ıslak rüya dışında cinsel ilişkiden kaynaklanan cünüp halde uyanır, sonra oruç tutardı.", id: "Al-Muwatta 794 — Aisyah dan Umm Salama: Nabi biasa bangun dalam keadaan junub karena hubungan seksual selain mimpi basah selama Ramadan, kemudian beliau berpuasa." }
text: "كان رسول الله يصبح جنباً من جماع غير احتلام في رمضان، ثم يصوم"
summary:
  ar: "يرويه مالك عن عبد ربه بن سعيد عن أبي بكر بن عبد الرحمن بن الحارث بن هشام عن عائشة وأم سلمة زوجي النبي، أنهما قالتا: كان رسول الله يصبح جنباً من جماع غير احتلام في رمضان ثم يصوم. ويذكر المحقق أن أبا مصعب (777)، والقعنبي عند أبي داود (2389)، وأحمد من طريق ابن مهدي عن مالك عن سمي وعبد ربه بن سعيد. {cite:muwatta-maruf-1997 p.390} {cite:muwatta-maruf-1997 p.391}"
  tr: "Malik, Abd Rabbih ibn Sa'id'den, o da Ebu Bekr ibn Abd al-Rahman ibn al-Harith ibn Hişam'dan, o da Peygamberin eşleri Ayşe ve Ümmü Seleme'den rivayet ettiğine göre, şöyle demişlerdir: Allah Resulü Ramazan ayında cinsel ilişkiden dolayı cünüp halde uyanırdı, ıslak rüyadan değil, sonra oruç tutardı. Araştırmacı, Ebu Mus'ab (777), Ebu Davud'da el-Ka'nebi (2389) ve İbn Mehdi'den, o da Malik'ten, o da Sumey ve Abd Rabbih ibn Sa'id'den Ahmed'in rivayetlerini zikretmektedir. {cite:muwatta-maruf-1997 s.390} {cite:muwatta-maruf-1997 s.391}"
  id: "Diriwayatkan oleh Malik dari Abd Rabbih ibn Sa'id, dari Abu Bakr ibn Abd al-Rahman ibn al-Harith ibn Hisham, dari Aisyah dan Umm Salama, istri-istri Nabi, bahwa mereka berkata: Rasulullah SAW biasa bangun dalam keadaan junub karena hubungan seksual, bukan karena mimpi basah, selama Ramadan, kemudian beliau berpuasa. Peneliti menyebutkan bahwa Abu Mus'ab (777), al-Qa'nabi dalam Abu Dawud (2389), dan Ahmad dari Ibn Mahdi, dari Malik, dari Sumay dan Abd Rabbih ibn Sa'id. {cite:muwatta-maruf-1997 p.390} {cite:muwatta-maruf-1997 p.391}"
