text: "… خوطب به في القصد على الحقيقة إلا بهذه الألفاظ. - ذكر الإخبار عما يستحب للمرء من قبول ما رخص له بترك التحمل على النفس ما لا تطيق من الطاعات - أَخْبَرَنَا عَبْد اللَّهِ بن أَحْمَد بن مُؤْسَى قَالَ : حَدَّثَنَا …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 212، يرد فيه ذكر الطاعات، والمستحب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 212, whose wording mentions the acts of obedience, the recommended (mustahabb), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 212 کا اقتباس جس میں طاعات، مستحب، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Sahih Ibn Hibban, volume numérisé 3, p. 212, dont le texte mentionne les actes d'obéissance, le recommandé (mustahabb), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Sahih Ibn Hibban, volumen digitalizado 3, p. 212, cuyo texto menciona los actos de obediencia, lo recomendado (mustahabb), la dispensa (rukhsa); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Sahih İbn Hibban, 3. Cilt, 212. sayfadan, farz olan amelleri, tavsiye edilen amelleri ve muafiyetleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan amelleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Ibn Hibban, Jilid 3, halaman 212, yang menyebutkan amalan ketaatan, amalan yang dianjurkan, dan keringanan hukuman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
