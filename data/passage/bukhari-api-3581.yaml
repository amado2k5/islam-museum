label: { ar: "صحيح البخاري 3581 — الأب والأبوة", en: "Sahih al-Bukhari 3581 — the father and fatherhood", ur: "صحیح بخاری 3581 — باپ اور والدیت", es: "Sahih al-Bukhari 3581 — El padre y la paternidad", fr: "Sahih al-Bukhari 3581 — le père et la paternité" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا مُعْتَمِرٌ، عَنْ أَبِيهِ، حَدَّثَنَا أَبُو عُثْمَانَ، أَنَّهُ حَدَّثَهُ عَبْدُ الرَّحْمَنِ بْنُ أَبِي بَكْرٍما ـ أَنَّ أَصْحَابَ، الصُّفَّةِ كَانُوا أُنَاسًا فُقَرَاءَ، وَأَنَّ النَّبِيَّ قَالَ مَرَّةً \" مَنْ كَانَ عِنْدَهُ طَعَامُ اثْنَيْنِ فَلْيَذْهَبْ بِثَالِثٍ، وَمَنْ كَانَ عِنْدَهُ طَعَامُ أَرْبَعَةٍ فَلْيَذْهَبْ بِخَامِسٍ أَوْ سَادِسٍ \". أَوْ كَمَا قَالَ، وَأَنَّ أَبَا بَكْرٍ جَاءَ بِثَلاَثَةٍ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3581، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3581 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3581، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3581 (Virtudes y méritos del Profeta y sus compañeros), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3581 (Vertus et mérites du Prophète et de ses Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
