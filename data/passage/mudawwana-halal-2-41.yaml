text: "… وسليمان بن موسى قالا لا يتق الطعام بأرض العدوّ ولا يستأذن فيه الامير ولا يتقيه أن يأخِذه من سبق اليه فان باع انسان شيئاً من الطعام بذهب أو فضة فلا يحل له فهو حينئذ من الغنائم وذكر أن هذا اطبر …"
