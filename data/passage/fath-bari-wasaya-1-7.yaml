text: "… في رواية المستملي والكشميهني إلى جانب الطريق وهي رواية همام. قوله : تحت الكثيب الأحمر في روايتهما عند الكثيب الأحمر وهي رواية همام أيضًا، والكثيب بالمثلثة وآخره موحدة وزن عظيم: الرمل المجتمع، وزعم ابن حبان أن قبر موسى بمدين بين …"
