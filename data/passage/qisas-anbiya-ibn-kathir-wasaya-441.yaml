text: "… ساكناً على هيئته، لا تغيره عن هذه الصفة. قاله عبد اللّٰه بن عباس ومجاهد وعكرمة والربيع والضحاك وقتادة وكعب الأحبار وسماك بن حرب وعبد الرحمن بن زيد بن أسلم، وغيرهم. فلما تركه على هيئته وحالته وانتهى فرعون، فرأى ما رأى …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 441، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
