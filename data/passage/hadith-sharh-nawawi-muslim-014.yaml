text: "غيرا، فحمد الله وأثنى، عليه ثم قال: «أما بعد، فإن الله أنزل في كتابه: (يا أيها الناس اتقوا ربكم الآية))). () وحدثني زهير ابن حرب، حدثنا جرير، عن عن عبد الرحمن ابن هلال العبسي(). عن جرير أبن عبد الله، قال:"
