label:
  ar: "مسلم 2687 — من جاء بالحسنة فله عشر أمثالها وأزيد"
  en: "Muslim 2687 — Whoever brings a good deed has ten like it and more"
  ur: "مسلم 2687 — جو نیکی لائے اس کے لیے دس گنا اور اس سے زیادہ ہے"
text: "يقول الله عز وجل من جاء بالحسنة فله عشر أمثالها وأزيد ومن جاء بالسيئة فجزاؤه سيئة مثلها أو أغفر ومن تقرب مني شبرا تقربت منه ذراعا ومن تقرب مني ذراعا تقربت منه باعا ومن أتاني يمشي أتيته هرولة ومن لقيني …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2687: من جاء بالحسنة فله عشر أمثالها وأزيد. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2687: Whoever brings a good deed has ten like it and more. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2687: جو نیکی لائے اس کے لیے دس گنا اور اس سے زیادہ ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
