ref: "2687"
label:
  ar: "مسلم 2687 — من جاء بالحسنة فله عشر أمثالها وأزيد"
  en: "Muslim 2687 — Whoever brings a good deed has ten like it and more"
  ur: "مسلم 2687 — جو نیکی لائے اس کے لیے دس گنا اور اس سے زیادہ ہے"
  es: "Muslim 2687 — Quien trae una buena acción, tiene diez iguales y más."
  fr: "Muslim 2687 — Quiconque accomplit une bonne action en recevra dix autres, et plus encore."
  tr: "Müslim 2687 — Kim bir iyilikle gelirse, onun on katını ve daha fazlasını alır."
  id: "Muslim 2687 — Barangsiapa datang dengan membawa amal kebaikan, maka pahalanya akan sepuluh kali lipat atau lebih."
text: "يقول الله عز وجل من جاء بالحسنة فله عشر أمثالها وأزيد ومن جاء بالسيئة فجزاؤه سيئة مثلها أو أغفر ومن تقرب مني شبرا تقربت منه ذراعا ومن تقرب مني ذراعا تقربت منه باعا ومن أتاني يمشي أتيته هرولة ومن لقيني …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2687: من جاء بالحسنة فله عشر أمثالها وأزيد. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2687: Whoever brings a good deed has ten like it and more. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2687: جو نیکی لائے اس کے لیے دس گنا اور اس سے زیادہ ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2687: Quien realiza una buena acción recibe diez más. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi recopila sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2687: Quiconque accomplit une bonne action en reçoit dix semblables, et plus encore. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2687: “Barang siapa datang dengan membawa amal kebaikan, maka pahalanya akan sepuluh kali lipat atau lebih.” Nabi Muhammad shalla Allahu alaihi wa sallam meriwayatkan hadits ini dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
