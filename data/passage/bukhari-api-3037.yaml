label: { ar: "صحيح البخاري 3037 — مداواة الجراح", en: "Sahih al-Bukhari 3037 — the treatment of wounds", ur: "صحیح بخاری 3037 — زخموں کا علاج", es: "Sahih al-Bukhari 3037 — El tratamiento de las heridas", fr: "Sahih al-Bukhari 3037 — le traitement des plaies", tr: "Sahih el-Buhari 3037 — Yaraların Tedavisi", id: "Sahih al-Bukhari 3037 — Mengobati Luka" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا أَبُو حَازِمٍ، قَالَ سَأَلُوا سَهْلَ بْنَ سَعْدٍ السَّاعِدِيَّ ـ بِأَىِّ شَىْءٍ دُووِيَ جُرْحُ النَّبِيِّ فَقَالَ مَا بَقِيَ مِنَ النَّاسِ أَحَدٌ أَعْلَمُ بِهِ مِنِّي، كَانَ عَلِيٌّ يَجِيءُ بِالْمَاءِ فِي تُرْسِهِ، وَكَانَتْ ـ يَعْنِي فَاطِمَةَ ـ تَغْسِلُ الدَّمَ عَنْ وَجْهِهِ، وَأُخِذَ حَصِيرٌ فَأُحْرِقَ، ثُمَّ حُشِيَ بِهِ جُرْحُ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3037، يذكر مداواة الجراح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3037 (Fighting for the Cause of Allah (Jihaad)), that mentions the treatment of wounds. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3037، جس میں زخموں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3037 (La lucha por la causa de Alá (Yihad)), menciona el tratamiento de heridas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 3037 (Combat pour la cause d'Allah (Jihad)), mentionne le traitement des plaies. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 3037 numaralı hadis, yaraların tedavisine değinmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3037, menyebutkan tentang pengobatan luka. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
