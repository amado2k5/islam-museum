text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا أَبُو حَازِمٍ، قَالَ سَأَلُوا سَهْلَ بْنَ سَعْدٍ السَّاعِدِيَّ ـ بِأَىِّ شَىْءٍ دُووِيَ جُرْحُ النَّبِيِّ فَقَالَ مَا بَقِيَ مِنَ النَّاسِ أَحَدٌ أَعْلَمُ بِهِ مِنِّي، كَانَ عَلِيٌّ يَجِيءُ بِالْمَاءِ فِي تُرْسِهِ، وَكَانَتْ ـ يَعْنِي فَاطِمَةَ ـ تَغْسِلُ الدَّمَ عَنْ وَجْهِهِ، وَأُخِذَ حَصِيرٌ فَأُحْرِقَ، ثُمَّ حُشِيَ بِهِ جُرْحُ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3037، يذكر مداواة الجراح. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3037 (Fighting for the Cause of Allah (Jihaad)), that mentions the treatment of wounds. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3037، جس میں زخموں کا علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
