summary:
  ar: "قال مالك: فأما أن يبيع رجل من رجل سلعة يبت بيعها، ثم يندم المشتري فيقول للبائع: ضع عني. فيأبى البائع ويقول: بع ولا نقصان عليك. فهذا لا بأس به، لأنه ليس من المخاطرة، وإنما هو شيء وضعه له، وليس على ذلك عقد بيعهما. وذلك الذي عليه الأمر عندنا. {cite:muwatta-maruf-1997 p.196}"
