label: { ar: "الموطأ 1947 — مالك: أما أن يبيع رجل من رجل سلعة يبت بيعها، ثم يندم المشتري فيقول للبائع: ضع عني. فيأبى البائع ويقول: بع ولا نقصان عليك، فهذا لا بأس به، لأنه ليس من المخاطرة، وإنما هو شيء وضعه له", en: "Muwatta 1947", es: "Muwatta 1947", fr: "Muwatta 1947", ur: "موطا 1947", tr: "El-Muvatta 1947 — Malik: Bir adam bir malı başka bir adama satarsa, satış tamamlandıktan sonra alıcı pişman olur ve satıcıya: Fiyatı düşürün der. Satıcı da reddeder ve: Satın, hiçbir şey kaybetmezsiniz der. Bu caizdir, çünkü bu bir risk değil, aksine satıcının kendisi için ayırdığı bir şeydir.", id: "Al-Muwatta 1947 — Malik: Jika seseorang menjual suatu barang kepada orang lain, dan transaksi telah selesai, kemudian pembeli menyesal dan berkata kepada penjual: Turunkan harganya untuk saya. Penjual menolak dan berkata: Jual saja, dan kamu tidak akan rugi apa pun. Ini diperbolehkan, karena ini bukan risiko, melainkan sesuatu yang telah ia sisihkan untuknya." }
summary:
  ar: "قال مالك: فأما أن يبيع رجل من رجل سلعة يبت بيعها، ثم يندم المشتري فيقول للبائع: ضع عني. فيأبى البائع ويقول: بع ولا نقصان عليك. فهذا لا بأس به، لأنه ليس من المخاطرة، وإنما هو شيء وضعه له، وليس على ذلك عقد بيعهما. وذلك الذي عليه الأمر عندنا. {cite:muwatta-maruf-1997 p.196}"
  tr: "Malik şöyle demiştir: Bir kişi bir malı başka bir kişiye satarsa, satış işlemi tamamlandıktan sonra alıcı pişman olur ve satıcıya, \"Fiyatı düşürün\" der, satıcı da reddeder ve \"Satın, bir şey kaybetmezsiniz\" derse, bu caizdir; çünkü bu bir risk değildir; aksine, satıcı onun için fiyatı düşürmüştür ve satış sözleşmesi buna dayanmaz. Bu, aramızda yerleşik uygulamadır. {cite:muwatta-maruf-1997 s.196}"
  id: "Malik berkata: Jika seseorang menjual suatu barang kepada orang lain, dan penjualan telah selesai, kemudian pembeli menyesal dan berkata kepada penjual, \"Turunkan harganya,\" dan penjual menolak dan berkata, \"Jual saja, kamu tidak akan rugi,\" maka hal ini diperbolehkan, karena itu bukan risiko; melainkan sesuatu yang telah ia kurangi untuk pembeli, dan kontrak jual beli mereka tidak didasarkan pada hal itu. Ini adalah praktik yang telah mapan di antara kita. {cite:muwatta-maruf-1997 p.196}"
