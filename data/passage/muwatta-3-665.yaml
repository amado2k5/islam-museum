label: { ar: "الموطأ 665 — مالك في الذهب والورق بين الشركاء: من بلغت حصته النصاب فعليه الزكاة، ومن نقصت فلا", en: "Muwatta 665", es: "Muwatta 665", fr: "Muwatta 665", ur: "موطا 665", tr: "El-Muvatta 665 — Malik'in ortaklar arasında altın ve gümüş hakkındaki görüşü: Kimin payı asgari eşiğe (nisaba) ulaşırsa zekât ödemesi gerekir, kimin payı daha az ise zekât ödemesi gerekmez.", id: "Al-Muwatta 665 — Malik tentang emas dan perak di antara para mitra: Siapa pun yang bagiannya mencapai ambang batas minimum (nisab) wajib membayar zakat, dan siapa pun yang bagiannya kurang dari itu, maka tidak perlu membayar zakat." }
summary:
  ar: "قول لمالك في الذهب والورق يكون بين الشركاء: من بلغت حصته منهم عشرين ديناراً عيناً أو مئتي درهم فعليه فيها الزكاة، ومن نقصت حصته عن ذلك فلا زكاة عليه، وإن بلغت حصصهم جميعاً النصاب وتفاوتت أُخذ من كل إنسان بقدر حصته إذا كان في حصة كل منهم ما تجب فيه الزكاة، ويحتج بقول النبي إنه لا صدقة فيما دون خمس أواق من الورق. ويقول مالك: وهذا أحب ما سمعت إلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.338}"
  tr: "Malik, ortaklar arasındaki altın ve gümüş konusunda şöyle demiştir: \"Kimin payı ayni olarak yirmi dinara veya iki yüz dirheme ulaşırsa zekâtını ödemekle yükümlüdür. Kimin payı bundan az ise zekât ödemekle yükümlü değildir. Eğer payları birlikte nisaba (asgari eşiğe) ulaşır ancak değerleri farklıysa, her bir kişiden kendi payına göre zekât alınır; yeter ki her pay zekâtı gerektirecek kadar olsun.\" Delil olarak Peygamberimizin \"Beş ukiyeden az gümüşe zekât verilmez\" sözünü göstermiştir. Malik şöyle demiştir: \"Bu, duyduğum en makbul görüştür.\" Araştırmacı, bunu Ebu Musab'ın Malik'ten rivayet ettiğini belirtmektedir. {kaynak: muwatta-maruf-1997 s.338}"
  id: "Malik berkata mengenai emas dan perak di antara para mitra: Barang siapa yang bagiannya mencapai dua puluh dinar atau dua ratus dirham, wajib membayar zakat atasnya. Barang siapa yang bagiannya kurang dari itu, tidak wajib membayar zakat. Jika bagian mereka bersama-sama mencapai nisab (ambang batas minimum) tetapi nilainya berbeda, maka zakat diambil dari masing-masing orang sesuai dengan bagiannya, dengan syarat setiap bagian mengandung cukup untuk dikenakan zakat. Ia mengutip sebagai bukti sabda Nabi bahwa tidak ada zakat atas perak yang kurang dari lima uqiyah. Malik berkata: Ini adalah pendapat yang paling utama yang pernah saya dengar. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.338}"
