label: { ar: "الموطأ 665 — مالك في الذهب والورق بين الشركاء: من بلغت حصته النصاب فعليه الزكاة، ومن نقصت فلا", en: "Muwatta 665" }
summary:
  ar: "قول لمالك في الذهب والورق يكون بين الشركاء: من بلغت حصته منهم عشرين ديناراً عيناً أو مئتي درهم فعليه فيها الزكاة، ومن نقصت حصته عن ذلك فلا زكاة عليه، وإن بلغت حصصهم جميعاً النصاب وتفاوتت أُخذ من كل إنسان بقدر حصته إذا كان في حصة كل منهم ما تجب فيه الزكاة، ويحتج بقول النبي إنه لا صدقة فيما دون خمس أواق من الورق. ويقول مالك: وهذا أحب ما سمعت إلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.338}"
