label: { ar: "صحيح البخاري 1151 — الأب والأبوة", en: "Sahih al-Bukhari 1151 — the father and fatherhood", ur: "صحیح بخاری 1151 — باپ اور والدیت", es: "Sahih al-Bukhari 1151 — El padre y la paternidad" }
text: "قَالَ وَقَالَ عَبْدُ اللَّهِ بْنِ مَسْلَمَةَ عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتْ كَانَتْ عِنْدِي امْرَأَةٌ مِنْ بَنِي أَسَدٍ فَدَخَلَ عَلَىَّ رَسُولُ اللَّهِ فَقَالَ \" مَنْ هَذِهِ \". قُلْتُ فُلاَنَةُ لاَ تَنَامُ بِاللَّيْلِ. فَذُكِرَ مِنْ صَلاَتِهَا فَقَالَ \" مَهْ عَلَيْكُمْ مَا تُطِيقُونَ مِنَ الأَعْمَالِ، فَإِنَّ اللَّهَ لاَ يَمَلُّ حَتَّى تَمَلُّوا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1151، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1151 (Prayer at Night (Tahajjud)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 1151، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1151 (Oración nocturna (Tahajjud)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
