text: "أَنَّ امْرَأَةً مِنْ جُهَيْنَةَ أَتَتْ نَبِيَّ اللَّهِ وَهِيَ حُبْلَى مِنَ الزِّنَى فَقَالَتْ: يَا نَبِيَّ اللَّهِ، أَصَبْتُ حَدًّا فَأَقِمْهُ عَلَىَّ۔ فَدَعَا نَبِيُّ اللَّهِ وَلِيَّهَا فَقَالَ: «أَحْسِنْ إِلَيْهَا فَإِذَا وَضَعَتْ فَائْتِنِي بِهَ»، فَفَعَلَ۔ فَأَمَرَ بِهَا نَبِيُّ اللَّهِ فَشُكَّتْ عَلَيْهَا ثِيَابُهَا ثُمَّ أَمَرَ…"
summary:
