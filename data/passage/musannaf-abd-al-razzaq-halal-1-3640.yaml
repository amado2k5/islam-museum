text: "ابن أبي وقاص، ونحن لا نكاد نجد المسلمات كثيرًا، فلما رجعنا. طلَّقناهن، قال : ونساءُهم لنا حلٌّ، ونساءُنا عليهم حرام - عبد الرزاق عن معمر عن الزهري وقتادة قالا : لا يحلُّ لك أَن تنكح يهودياً، ولا نصرانياً، ولا مجوسياً. …"
