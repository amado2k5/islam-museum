text: "ال إسحاق بن أحمد بن خلف: كنا عند محمد بن إسماعيل البخاري، فورد عليه كتاب فيه نعي عبد الله بن عبد الرحمن، فنكس رأسه، ثم رفع واسترجع، وجعل تسيل دموعه على خديه، ثم أنشا يقول: إن تبق تفجع بالأحبة كلهم"
