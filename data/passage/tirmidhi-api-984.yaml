text: "حَدَّثَنَا مُحَمَّدُ بْنُ حُمَيْدٍ الرَّازِيُّ، حَدَّثَنَا حَكَّامُ بْنُ سَلْمٍ، وَهَارُونُ بْنُ الْمُغِيرَةِ، عَنْ عَنْبَسَةَ، عَنْ أَبِي حَمْزَةَ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنْ عَبْدِ اللَّهِ، عَنِ النَّبِيِّ قَالَ \" إِيَّاكُمْ وَالنَّعْىَ فَإِنَّ النَّعْىَ مِنْ عَمَلِ الْجَاهِلِيَّةِ \". قَالَ عَبْدُ اللَّهِ وَالنَّعْىُ أَذَانٌ بِالْمَيِّتِ. وَفِي الْبَابِ عَنْ حُذَيْفَةَ."
summary:
  ar: "حديث في جامع الترمذي، رقم 984، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 984 (The Book on Jana''iz (Funerals)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 984، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
