text: "… فحرم اللَّه في كتابه أن تبديَ المرأةُ زينتها لغير مَحْرَمٍ، وأباح رسولُ اللّه لل لسهلة أن تُبدي زينتها لسالم وَهو غيرُ مَحْرَم عند إبداء الزينة قطعاً، فيكون ذلك رخصةً خاصة بسالم، مستئناة من عموم التحريم، ولا نقول: إن حكمها عام، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 966، يذكر ما حُرّم، والتحريم، والمباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
