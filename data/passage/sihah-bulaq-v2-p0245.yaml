text: |-
  ٣٤٢
  •فصل الواد)•
  •⁦(وتم)⁩.
  والنهم بالتحريك افراط الشهوة فى الطعام وقد نهم بالكسر يهم نهما والتهم بالتكين مصدو
  قولات نهمت الابل أنهمها بالفتح فيهمانهما ونهيما اذا ذرتها وصت بها لتجدّ ف سيرها وقال
  ألا انم ماها انم اضاهيم • واننا منا جدمتاهيم • واغمابنهمها القوم الهيم
  والمنهام من الابل الت تطيع على النهم وهو الزجر والنهم أيضا الخذف بالحصى ونحوهلات
  السائق قد يفعل ذلك وقال• ينهمن بالدار الحصى المنهوما • والنهيم مثل النحيم ومشل
  النقيم وهوصوت الاسد والفيل يقال نهم الفسسل ينهم نهما ونهيما عن الاسمعى" والنهامى
  | الحداد والنهام بالضم فى شعر الدارمّاح ضرب من الطير (نيم النيم الدرج التى تكون فى
  الرمل اذاجوت فيه الرمح قال ذو الرمة
  -تى النجلى الليل عنهاف ملمعة • مثل الاديم لهامر هبوتيم
  والنيم الفر والخلق وقول ساعدة بن جوية الهذلى •من فيم ومن كتم• (هما شجرات
  صل الاد ( أم أبوزيد المواءمة الموافقة يقال واءمه مواءمة ووآما اذا
  فعل كما يفعل وفى المثل لولا الوئام اه لك الانام أى لولاموافقة الناس بعضهم بعضا فى السحبة
  والعشْرة لكانت الهلكة ويقال لولا الوقام هلك اللتام والوئام المباهاة أى ان الرجال ليدوا
  بأنون الجيسل من الامور على أنها أخلاقهم وانما يفعلونم امباهاة وتشبها بأهل السكرم
  ولولاذلت لهل سكوا ثم لونم الدق والكسرووثم يتم أى عدا وخفميتم نديدالوط.
  كانه يتم الارض أى يدقها قال عنترة
  خطارة غب السرى زيافة • نطس الاكام بكل خفميم
  ابن السكيت الوئيمة الجاعة من الحشين أ والطعام بقال ثم اها أى اجع لها وقولهم لا والذى
  أخرح النار من الوئيمة أى من الصغرة والوثيم المسكتنزلها وقد وثم بالضم وتامة.( وجم
  وجم من الامر وجوما والواجم الذى التدحزنه حتى أمسمك عن الكلام يقال مالى أرال
  واجار يقال لم أجم عنه أى لم أسكت عنه فزعاويوم وجيم أى شديد الحروهو بالحا أيضا
  و يقال يكون ذلك وجة أى مسبة والوجة مثل الوجبة وهى الأكلة الواحدة والوجم
  بالتعريك واحد الاوجام وهى علامات وأبنية:هندى بها فى الصمارى ⁦( وحم)⁩، وحت وحه
  و أى قصدت قصده والوحام من الدواب أن تستعسب عند الحمل وقد وحت بالسكسر والوحام
  والوحام شهوة الحبلى وليس الوسام الافى شهوة الخبل خاصة وقدوحت توحم وحاوهى امرأة
  وحى ونسوة وحامى وفى المثل وحى ولاحبل وقدوحناها توحيا أطعمناهاماتشتهيه
  ويقال أيضا وحنالها أى ذبحنا خم رجل وخم بكرالطاه ووخم بالتسكين
  ووخيم أى تقيل بين الوخامة والوخومة والهع وخام وأوخام بقال منه واخنى فوخته وشئ
  وخيم أى وبى "وبلدة وخمسة ووخيمة اذالم توافقساكنها وقداستوختها واستوخت الطعام
  ويوخته اذا استوبلته قال زهير• الى كلامستوبل منوخم* ووخم الرجسل بالمكسرأى
  اتخم وقد اتخمت من الطعام وعن الطعام والاسم التخمة بالتصريك على ماذ كرناءف وكلة
  وتكلة والجمع تخمات وتخم وأتخمه الطعام على أفعله واصله أوسنهه وهذالطعام متخعة بالفتح
  وأصله موخمسة لانهم توههوا التاء أصلية لكثرة الاستعمال والعامة تقول التضمة بالتسكين
