label: { ar: "سنن أبي داود 1793 — ساعة الاحتضار والوفاة", en: "Sunan Abi Dawud 1793 — a deathbed and last hours", ur: "سنن ابی داؤد 1793 — وقتِ وفات اور آخری لمحات", es: "Sunan Abi Dawud 1793 — lecho de muerte y últimas horas", fr: "Sunan Abi Dawud 1793 — Un lit de mort et les dernières heures" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ صَالِحٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي حَيْوَةُ، أَخْبَرَنِي أَبُو عِيسَى الْخُرَاسَانِيُّ، عَنْ عَبْدِ اللَّهِ بْنِ الْقَاسِمِ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، أَنَّ رَجُلاً، مِنْ أَصْحَابِ النَّبِيِّ أَتَى عُمَرَ بْنَ الْخَطَّابِ - - فَشَهِدَ عِنْدَهُ أَنَّهُ سَمِعَ رَسُولَ اللَّهِ فِي مَرَضِهِ الَّذِي قُبِضَ فِيهِ يَنْهَى عَنِ الْعُمْرَةِ قَبْلَ الْحَجِّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1793، يذكر ساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1793 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 1793، جس میں وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1793 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona un lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud n° 1793 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)) mentionne un lit de mort et les dernières heures. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
