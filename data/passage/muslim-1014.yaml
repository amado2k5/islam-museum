label: { ar: "مسلم 1014 — التمرة من كسب طيب تربى حتى تكون كالجبل", en: "Muslim 1014 — The date from lawful earning grows like a mountain", es: "Año musulmán 1014 — La fecha de las ganancias lícitas crece como una montaña.", fr: "Muslim 1014 — La date issue des gains licites croît comme une montagne", ur: "مسلم 1014 - حلال کمائی سے کھجور پہاڑ کی طرح بڑھتی ہے۔", tr: "Müslim 1014 — Bu tarih, iyi kazançlardan elde edilen ve dağ gibi yükselen bir tarihtir.", id: "Muslim 1014 — Kurma itu berasal dari penghasilan yang baik, tumbuh hingga menjadi seperti gunung." }
text: "قال أبو هريرة: قال رسول الله: لا يتصدق أحد بتمرة من كسب طيب إلا أخذها الله بيمينه فيربيها كما يربي أحدكم فلوه أو قلوصه حتى تكون مثل الجبل أو أعظم"
summary:
  ar: "رواية أبي هريرة في باب قبول الصدقة من الكسب الطيب وتربيتها من كتاب الزكاة في صحيح مسلم؛ تربية الصدقة الطيبة حتى تصير كالجبل."
  tr: "Sahih Müslim'in Zekat Kitabı'ndaki \"İyi Kazançtan Sadaka Kabul Etmek ve Onu Beslemek\" bölümünde Ebu Hurayra'nın rivayetine göre; iyi sadakayı dağ gibi olana kadar beslemek gerekir."
  id: "Riwayat Abu Hurairah dalam bab tentang menerima sedekah dari penghasilan yang baik dan memeliharanya dari Kitab Zakat dalam Sahih Muslim; memelihara sedekah yang baik hingga menjadi seperti gunung."
