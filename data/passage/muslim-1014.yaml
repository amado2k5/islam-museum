text: "قال أبو هريرة: قال رسول الله: لا يتصدق أحد بتمرة من كسب طيب إلا أخذها الله بيمينه فيربيها كما يربي أحدكم فلوه أو قلوصه حتى تكون مثل الجبل أو أعظم"
