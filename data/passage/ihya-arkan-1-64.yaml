text: "… اللّٰه تعالى عنه : إن الإيمان ليبدو فى القلب نكتة بيضاء، كلما ازداد الايمان ازداد ذلك البياض فاذا استكمل العبد الإيمان أبيض القلب كله. وإن النفاق ليبدو فى القلب نكتة سوداء كلما ازداد النفاق ازداد ذالك السواد فإذا استكمل النفاق …"
