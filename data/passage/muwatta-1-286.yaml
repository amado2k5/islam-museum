label: { ar: "الموطأ 286 — مالك: السعي في كتاب الله العمل والفعل لا الاشتداد", en: "Muwatta 286" }
summary:
  ar: "قول لمالك في باب ما جاء في السعي يوم الجمعة: إنما السعي في كتاب الله العمل والفعل، واستشهد بمواضع من القرآن يُذكر فيها السعي في البقرة وعبس والنازعات والليل بمعنى العمل، فليس السعي الذي ذكره الله في آية الجمعة بالسعي على الأقدام ولا الاشتداد، وإنما عنى العمل والفعل. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163}"
