label: { ar: "الموطأ 286 — مالك: السعي في كتاب الله العمل والفعل لا الاشتداد", en: "Muwatta 286", es: "Muwatta 286", fr: "Muwatta 286", ur: "موطا 286", tr: "Al-Muwatta 286 — Malik: Allah'ın Kitabında gayret göstermek, çaba değil, eylem ve ameller demektir.", id: "Al-Muwatta 286 — Malik: Berusaha dalam Kitab Allah berarti tindakan dan perbuatan, bukan sekadar usaha." }
summary:
  ar: "قول لمالك في باب ما جاء في السعي يوم الجمعة: إنما السعي في كتاب الله العمل والفعل، واستشهد بمواضع من القرآن يُذكر فيها السعي في البقرة وعبس والنازعات والليل بمعنى العمل، فليس السعي الذي ذكره الله في آية الجمعة بالسعي على الأقدام ولا الاشتداد، وإنما عنى العمل والفعل. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.163}"
  tr: "Malik, Cuma günü yapılan gayret hakkında rivayet edilenler bölümünde şöyle demiştir: “Allah’ın Kitabında gayret, eylem ve iş demektir.” Bakara Suresi, Ebu'bâsa Suresi, Naziat Suresi ve Leyl Suresi’nde gayretin geçtiği ayetleri zikretmiş ve bunun da iş anlamına geldiğini belirtmiştir. Dolayısıyla, Allah’ın Cuma günü ile ilgili ayette bahsettiği gayret, yürümek veya koşmak değil, iş ve eylemdir. Editör, bunun Malik’ten Ebu Mus’ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.163}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan tentang berusaha pada hari Jumat: “Berusaha dalam Kitab Allah berarti tindakan dan pekerjaan.” Beliau mengutip ayat-ayat dalam Al-Quran yang menyebutkan berusaha dalam Surah Al-Baqarah, Surah Abasa, Surah An-Nazi’at, dan Surah Al-Layl, yang berarti pekerjaan. Oleh karena itu, berusaha yang disebutkan Allah dalam ayat tentang hari Jumat bukanlah berjalan atau berlari, melainkan pekerjaan dan tindakan. Editor menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus’ab dan Suwaid. {cite:muwatta-maruf-1997 p.163}"
