label: { ar: "سنن النسائي 5672 — بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 5672 — dutifulness to the parents or disobedience to them", ur: "سنن نسائی 5672 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 5672 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan al-Nasa'i 5672 — le devoir envers les parents ou la désobéissance envers eux", tr: "Sunan an-Nasa'i 5672 — Anne babaya iyilik mi, itaatsizlik mi?", id: "Sunan an-Nasa'i 5672 — Kebaikan atau ketidaktaatan kepada orang tua" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ بَشَّارٍ، عَنْ مُحَمَّدٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ مَنْصُورٍ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنْ نُبَيْطٍ، عَنْ جَابَانَ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، عَنِ النَّبِيِّ قَالَ \" لاَ يَدْخُلُ الْجَنَّةَ مَنَّانٌ وَلاَ عَاقٌّ وَلاَ مُدْمِنُ خَمْرٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5672، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5672 (The Book of Drinks), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5672، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5672 (El Libro de las Bebidas), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5672 (Le Livre des Boissons), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 5672 numaralı hadis, anne babaya saygı gösterme veya göstermeme konusundan bahsetmektedir. \"İslam'da Ebeveynlik\" tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5672, menyebutkan tentang menghormati atau tidak taat kepada orang tua. Peramban \"Kekeluargaan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
