label: { ar: "مسلم 20 — والله لأقاتلن من فرق بين الصلاة والزكاة", en: "Muslim 20 — I will fight whoever separates prayer from almsgiving", es: "Musulmán 20 — Lucharé contra quien separe la oración de la limosna.", fr: "Muslim 20 — Je combattrai quiconque sépare la prière de l'aumône", ur: "مسلم 20 - میں اس سے لڑوں گا جو نماز کو صدقہ سے الگ کرے گا۔", tr: "Müslim 20 — Allah'a yemin ederim ki, namaz ile zekâtı birbirinden ayıran herkesle savaşacağım.", id: "Muslim 20 — Demi Allah, aku akan memerangi siapa pun yang membeda-bedakan antara salat dan zakat." }
text: "لما توفي رسول الله واستخلف أبو بكر وكفر من كفر من العرب، قال عمر لأبي بكر: كيف تقاتل الناس وقد قال رسول الله: «أمرت أن أقاتل الناس حتى يقولوا لا إله إلا الله، فمن قال لا إله إلا الله فقد عصم مني ماله ونفسه إلا بحقه وحسابه على الله»؟ فقال أبو بكر: والله لأقاتلن من فرق بين الصلاة والزكاة، فإن الزكاة حق المال، والله لو منعوني عقالاً كانوا يؤدونه إلى رسول الله لقاتلتهم على منعه. فقال عمر: فوالله ما هو إلا أن رأيت الله قد شرح صدر أبي بكر للقتال فعرفت أنه الحق"
summary:
  ar: "رواية الزهري عن أبي هريرة في كتاب الإيمان من صحيح مسلم؛ رواية الحديث في سياقه — مقارعة أبي بكر لمانعي الزكاة في حروب الردة وإقناع عمر — نص جامع للحكم بالظاهر ووجوب الزكاة."
  tr: "Sahih Müslim'deki İman Kitabı'nda Ebu Hurayra'dan rivayet edilen El-Zuhri'nin hadis rivayeti; hadisin bağlamı içinde ele alındığında - Ebu Bekir'in İbrani Savaşları'nda zekât vermeyi reddedenlerle yüzleşmesi ve Ömer'i ikna etmesi - görünüşe göre hüküm verme ve zekât yükümlülüğü konusunda kapsamlı bir metin oluşturmaktadır."
  id: "Riwayat Al-Zuhri berdasarkan otoritas Abu Hurayrah dalam Kitab Iman di Sahih Muslim; riwayat hadits dalam konteksnya — konfrontasi Abu Bakr dengan orang-orang yang menolak membayar zakat dalam Perang Murtad dan membujuk Umar — merupakan teks komprehensif untuk menetapkan hukum berdasarkan penampilan dan kewajiban zakat."
