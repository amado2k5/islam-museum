label: { ar: "مسلم 20 — والله لأقاتلن من فرق بين الصلاة والزكاة", en: "Muslim 20 — I will fight whoever separates prayer from almsgiving" }
text: "لما توفي رسول الله واستخلف أبو بكر وكفر من كفر من العرب، قال عمر لأبي بكر: كيف تقاتل الناس وقد قال رسول الله: «أمرت أن أقاتل الناس حتى يقولوا لا إله إلا الله، فمن قال لا إله إلا الله فقد عصم مني ماله ونفسه إلا بحقه وحسابه على الله»؟ فقال أبو بكر: والله لأقاتلن من فرق بين الصلاة والزكاة، فإن الزكاة حق المال، والله لو منعوني عقالاً كانوا يؤدونه إلى رسول الله لقاتلتهم على منعه. فقال عمر: فوالله ما هو إلا أن رأيت الله قد شرح صدر أبي بكر للقتال فعرفت أنه الحق"
summary:
  ar: "رواية الزهري عن أبي هريرة في كتاب الإيمان من صحيح مسلم؛ رواية الحديث في سياقه — مقارعة أبي بكر لمانعي الزكاة في حروب الردة وإقناع عمر — نص جامع للحكم بالظاهر ووجوب الزكاة."
