text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّهُ كَانَ يَحْتَجِمُ وَهُوَ صَائِمٌ ثُمَّ لاَ يُفْطِرُ. قَالَ وَمَا رَأَيْتُهُ احْتَجَمَ قَطُّ إِلاَّ وَهُوَ صَائِمٌ. قَالَ مَالِكٌ لاَ تُكْرَهُ الْحِجَامَةُ لِلصَّائِمِ إِلاَّ خَشْيَةً مِنْ أَنْ يَضْعُفَ وَلَوْلاَ ذَلِكَ لَمْ تُكْرَهْ وَلَوْ أَنَّ رَجُلاً احْتَجَمَ فِي رَمَضَانَ ثُمَّ سَلِمَ مِنْ أَنْ يُفْطِرَ لَمْ أَرَ عَلَيْهِ شَيْئًا …"
summary:
  ar: "حديث في موطأ مالك، رقم 663، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Muwatta Malik, no. 663 (Fasting), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "موطأ مالک کی حدیث نمبر 663، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
