text: "… تركيبه : هذا الترياق أجلّ الأدوية المركبة، وأفضلها لكثرة منافعه، وخصوصاً للسموم من النواهش، كالحيّات، والعقارب، والكلب الكلِب، والسموم المشروبة القتّالة، ومن الأمراض البلغمية والسوداوية وحمّياتها والرياح الخبيثة، ومن الفالج ومن الجذام خاصةً، ومن البرص، ويشجّع القلب، ويذكّي الحواس، ويحرِّك …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 399، يذكر المرض والمريض، والجذام والبرص، وأسماء الأمراض، والدواء، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 399, that mentions illness and the sick, leprosy and vitiligo, named diseases, the drug, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 399 کا اقتباس جس میں بیماری اور بیمار، جذام اور برص، بیماریوں کے نام، دوا، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 399, que menciona la enfermedad y los enfermos, la lepra y el vitíligo, enfermedades con nombre, el medicamento, el veneno y el antídoto, los medicamentos y la farmacia; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 399, qui mentionne la maladie et les malades, la lèpre et le vitiligo, les maladies nommées, le médicament, le poison et l'antidote, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Kısım, s. 399'dan bir bölüm; hastalık ve hasta, cüzzam ve vitiligo, hastalıkların isimleri, ilaç, zehir ve panzehir, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
