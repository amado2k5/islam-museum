text: "… تركيبه : هذا الترياق أجلّ الأدوية المركبة، وأفضلها لكثرة منافعه، وخصوصاً للسموم من النواهش، كالحيّات، والعقارب، والكلب الكلِب، والسموم المشروبة القتّالة، ومن الأمراض البلغمية والسوداوية وحمّياتها والرياح الخبيثة، ومن الفالج ومن الجذام خاصةً، ومن البرص، ويشجّع القلب، ويذكّي الحواس، ويحرِّك …"
summary:
