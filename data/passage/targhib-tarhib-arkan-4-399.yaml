text: "… عنهاء - وعن عمرو بن عبسة قال قال رجل يارسول الله ما الاسلام قال ان يسلم قلبك لله وأن يسلم المسلمون من لسانك ويدك قال فأى الاسلام. أفضل قال الايمان قال وما الايمان قال أن تؤمن بالله وملائكته وكتبه ورسله …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 4، ص 399، يذكر تعريف الإسلام بأعماله، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Mundhiri's al-Targhib wa-l-Tarhib, scan volume 4, p. 399, that mentions Islam defined by its acts, belief in God, His angels, His books and His messengers, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الترغیب والترہیب، منذری، اسکین جلد 4، ص 399 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Targhib wa-l-Tarhib de al-Mundhiri, volumen 4, pág. 399, que menciona el Islam definido por sus actos, la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Tarhib wa-l-Tarhib d'al-Mundhiri (tome 4, p. 399), qui évoque l'islam défini par ses actes, la croyance en Dieu, Ses anges, Ses livres et Ses messagers, ainsi que la question de la foi et sa réponse. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Mundhiri'nin \"At-Targhib wa At-Tarhib\" (Teşvik ve Uyarı) adlı eserinin 4. cildinin 399. sayfasından bir alıntı, İslam'ı uygulamaları, Allah'a, meleklerine, kitaplarına ve peygamberlerine olan inancı üzerinden tanımlamakta ve imanla ilgili soruları ve cevaplarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. İslam'ın temellerini, imanın temellerini, imanın dallarını ve bir müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mundhiri \"At-Targhib wa At-Tarhib\" (Dorongan dan Peringatan), Jilid 4, halaman 399, mendefinisikan Islam melalui praktik-praktiknya, kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya, serta membahas pertanyaan-pertanyaan tentang iman dan jawabannya. Kutipan ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
