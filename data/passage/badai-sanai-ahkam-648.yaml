text: "… الأرض، ولأنه لو لم ينزل لوقع الفصل بين الإقامة والشروع في الصلاة بالنزول، وأنه مكروه. وأما في الحضر فيكره الأذان راكباً في ظاهر الرواية. وعن أبي يوسف أنه قال : لا بأس به. ثم المؤذّن يختم الإقامة على مكانه أو …"
