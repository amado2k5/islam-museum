text: "فإن الأرض نصفها لي ونصفه لك. فأجاب عليه الصلاة والسلام: «من محمد رسول الله إلى مسيلمة الكذاب، أما بعد فإن الأرض لله يورثها من يشاء من عباده والعاقبة للمتقين». فحاربه أبو بكر رضي الله عنه بجنود المسلمين وقتل على يدي"
