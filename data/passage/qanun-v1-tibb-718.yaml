text: "الكتاب الثاني الجملة الثانية: في بيان الأدوية المفردة - حرف الثاء القروح : يضمّد بمدقوقه جراحات الأعصاب، ولا يُحَلُّ عنها ثلاثة أيام، فيكون نافعاً جداً. أعضاء الرأس : طبيخه بشحم الوزّ نافع من وجع الأذن، وقد يقطر بالزيت في الجانب …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 718، يذكر الوجع، وأعضاء البدن، والجراحة والختان والجبائر، ومداواة الجراح، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 718, that mentions pain, the organs of the body, surgery, circumcision and splints, the treatment of wounds, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 718 کا اقتباس جس میں درد، اعضائے بدن، جراحت، ختنہ اور پٹیاں، زخموں کا علاج، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
