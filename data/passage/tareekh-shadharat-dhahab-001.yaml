text: "بعدة قصائد، وأثرى ونبل مقداره، واشتهر ذكره، فنفذ من الديوان في رسالة إلى خوارزم شاه، وسمع الحديث من مشايخ خراسان، وحصل نسخا بما سمع، ثم عاد إلى بغداد وقد صار له الخلمان الترك والمراكب، ولم يزل يرسل من الديوان إلى"
