text: "… زيد بن أسلم عن أبيه، أن عمر ضرب ابناً له اكتنى بأبي عيسى، وقال: إن عيسى ليس له أب. - ما ذُكر في الضحك وكثرته - حدثنا عفان قال: حدثنا حماد بن سلمة عن حميد عن الحسن قال: كثرة الضحك …"
