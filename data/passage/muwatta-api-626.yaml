label: { ar: "موطأ مالك 626 — ما فرضه الله ورسوله، ما فُرض على الناس", en: "Muwatta Malik 626 — what God and His Messenger made obligatory; what was made obligatory on people", ur: "موطأ مالک 626 — جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا", fr: "Muwatta de Malik 626 — ce que Dieu et Son Messager ont rendu obligatoire ; ce qui a été imposé aux gens", es: "Muwatta de Malik 626 — lo que Dios y Su Mensajero hicieron obligatorio; lo que se impuso a la gente", tr: "Muwatta Malik 626 — Allah ve Resulü'nün farz kıldığı, insanlar için farz kılınan şeyler", id: "Muwatta Malik 626 — Apa yang telah ditetapkan oleh Allah dan Rasul-Nya, apa yang telah ditetapkan untuk manusia." }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ فَرَضَ زَكَاةَ الْفِطْرِ مِنْ رَمَضَانَ عَلَى النَّاسِ صَاعًا مِنْ تَمْرٍ أَوْ صَاعًا مِنْ شَعِيرٍ عَلَى كُلِّ حُرٍّ أَوْ عَبْدٍ ذَكَرٍ أَوْ أُنْثَى مِنَ الْمُسْلِمِينَ."
summary:
  ar: "حديث في موطأ مالك، رقم 626، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 626 (Zakat), whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 626، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 626, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 626, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta adlı eserinde 626 numaralı hadis, Allah ve Resulü'nün farz kıldığı ve insanların farz kıldığı konuları ele almaktadır. Yazar, bu hadisi, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile haleflerinin rivayetleriyle birlikte derlemiştir. Yazar, metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 626, menyebutkan apa yang telah diwajibkan oleh Allah dan Rasul-Nya, dan apa yang diwajibkan bagi manusia. Penulis mengumpulkan hadits ini, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, mengenai topik-topik tersebut. Penulis menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
