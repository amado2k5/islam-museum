label: { ar: "الموطأ 1767 — نافع عن ابن عمر: لا رضاعة إلا لمن أرضع في الصغر، ولا رضاعة لكبير", en: "Muwatta 1767", es: "Muwatta 1767", fr: "Muwatta 1767", ur: "موطا 1767", tr: "El-Muvatta 1767 — İbn Ömer'den rivayet edildiğine göre Nafi': Bebeklik döneminde emzirilmiş olan dışında kimse için emzirme söz konusu değildir; yetişkin için de emzirme söz konusu değildir.", id: "Al-Muwatta 1767 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Tidak ada pemberian ASI kecuali bagi orang yang disusui saat bayi, dan tidak ada pemberian ASI bagi orang dewasa." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر كان يقول: لا رضاعة إلا لمن أرضع في الصغر، ولا رضاعة لكبير. {cite:muwatta-maruf-1997 p.121}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın şöyle dediğini aktarır: \"Emzirme, ancak bebeklik döneminde emzirilmiş olan için geçerlidir; yetişkin için de emzirmenin bir anlamı yoktur.\" {cite:muwatta-maruf-1997 s.121}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar biasa berkata: “Tidak ada pemberian ASI kecuali bagi orang yang disusui sejak bayi, dan tidak ada pemberian ASI bagi orang dewasa.” {cite:muwatta-maruf-1997 p.121}"
