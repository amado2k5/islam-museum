label: { ar: "الموطأ 279 — ابن شهاب: من أدرك ركعة من الجمعة صلى إليها أخرى", en: "Muwatta 279", es: "Muwatta 279", fr: "Muwatta 279", ur: "موطا 279", tr: "Al-Muwatta 279 — İbn Şihab: Cuma namazının bir rekatını kaçıran, bir rekat daha kılmalıdır.", id: "Al-Muwatta 279 — Ibn Shihab: Barangsiapa yang mengerjakan satu rakaat shalat Jumat, hendaklah ia mengerjakan rakaat yang lain." }
text: "من أدرك من صلاة الجمعة ركعة فليصل إليها أخرى"
summary:
  ar: "أول أثر في باب ما جاء فيمن أدرك ركعة يوم الجمعة. يرويه يحيى عن مالك عن ابن شهاب أنه كان يقول: من أدرك من صلاة الجمعة ركعة فليصل إليها أخرى، وقال ابن شهاب: وهي السنة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.161}"
  tr: "Cuma namazında bir rekatı sonradan kılan kimse hakkında rivayet edilenler bölümündeki ilk hadis, Yahya'nın Malik'ten, o da İbn Şihab'dan rivayet ettiği hadistir. İbn Şihab şöyle derdi: \"Cuma namazından bir rekatı sonradan kılan kimse, ona bir rekatı daha eklemelidir.\" İbn Şihab şöyle dedi: \"Bu sünnettir.\" Editör, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.161}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai orang yang menambah satu rakaat shalat Jumat. Diriwayatkan oleh Yahya dari Malik dari Ibnu Shihab, yang biasa berkata: Barang siapa menambah satu rakaat shalat Jumat, hendaknya ia menambah satu rakaat lagi. Ibnu Shihab berkata: Ini adalah Sunnah. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.161}"
