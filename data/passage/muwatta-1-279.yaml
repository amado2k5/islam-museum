text: "من أدرك من صلاة الجمعة ركعة فليصل إليها أخرى"
summary:
  ar: "أول أثر في باب ما جاء فيمن أدرك ركعة يوم الجمعة. يرويه يحيى عن مالك عن ابن شهاب أنه كان يقول: من أدرك من صلاة الجمعة ركعة فليصل إليها أخرى، وقال ابن شهاب: وهي السنة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.161}"
