text: "… الذى فيه دواؤه حتى يتخلص من ألم شربه لا يرجى شفاؤه. ومنها أن يتهاون بسترالله استغيثين لا تكلنى إلى عليه وحلمه عنه وإهماله إياه ولا يدرى أنه إنما يمهل مقتا ليزداد بالامهال إنما فيظن أن تمكنه نفسى طرفة عسين من …"
summary:
