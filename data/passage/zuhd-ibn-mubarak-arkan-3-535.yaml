text: "… للبكر فى جنب البيت، ومعنى عرفنا الكراهة فى وجهه أى لا يتكلم به لحيائه بل يتغير وجهه فنفهم نحن كراهته، وفيه فضيلة الحياء، وهو من شعب الإيمان وهو خير كله، ولا يأتى إلا بخير. - شرح النووى على صحيح مسلم. …"
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 3، ص 535، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 3, p. 535, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 3، ص 535 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ibn al-Mubarak, volumen 3, pág. 535, que menciona las ramas de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Zuhd d'Ibn al-Mubarak (tome 3, p. 535) mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et piliers de la foi »."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 535. sayfasından, inancın dallarını anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Asketisme), Jilid 3, halaman 535, yang menyebutkan cabang-cabang iman; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
