label: { ar: "سنن أبي داود 543 — الأب والأبوة", en: "Sunan Abi Dawud 543 — the father and fatherhood", ur: "سنن ابی داؤد 543 — باپ اور والدیت", es: "Sunan Abi Dawud 543 — El padre y la paternidad" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عَلِيِّ بْنِ سُوَيْدِ بْنِ مَنْجُوفٍ السَّدُوسِيُّ، حَدَّثَنَا عَوْنُ بْنُ كَهْمَسٍ، عَنْ أَبِيهِ، كَهْمَسٍ قَالَ قُمْنَا إِلَى الصَّلاَةِ بِمِنًى وَالإِمَامُ لَمْ يَخْرُجْ فَقَعَدَ بَعْضُنَا فَقَالَ لِي شَيْخٌ مِنْ أَهْلِ الْكُوفَةِ مَا يُقْعِدُكَ قُلْتُ ابْنُ بُرَيْدَةَ. قَالَ هَذَا السُّمُودُ. فَقَالَ لِي الشَّيْخُ حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَوْسَجَةَ عَنِ الْبَرَاءِ بْنِ عَازِبٍ قَالَ كُنَّا نَقُومُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 543، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 543 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 543، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 543 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
