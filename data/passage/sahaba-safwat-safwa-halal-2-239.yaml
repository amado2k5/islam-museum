text: "… بعر قي وعنائى الى شيح ما رجع الى قلبى إلى سنتين - عبد اللّه بن حبيق قال قال يوسف بن اسباط انى اخاف ان يعذب انّه الناس يذنوب العلماء - وقال الأشياء ثلاثة، حلال بين وحرام بين وشبهات بين ذلك …"
