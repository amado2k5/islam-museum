text: "… عن دينهم وعامّةُ أهل المشرق وغَطَفَان وأسَد وعامّةُ أشْجع، وتمسّكَتْ طيءُ بالإِسلام. شأن أبي بكر وفاطمةما قال الزُّهْري، عن عُرْوَة، عن عائشة أنّ فاطمة سألت أبا بكر بعد وفاة رسول اللّه وليه أن يَقْسِم لها ميراثها ممّا ترك رسول اللّٰه …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 21، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 21, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 21 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 6, pág. 21, que menciona el lecho de muerte y las últimas horas, y lo que dejó: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 6, page 21, évoque un lit de mort et les dernières heures du défunt, ainsi que son héritage. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 6. cildinin 21. sayfasından alınan bir alıntı, ölüm anını, merhumun vefatını, mal varlığını ve mirasını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 6, halaman 21, menyebutkan saat kematian dan wafatnya orang yang meninggal, serta harta warisannya; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
