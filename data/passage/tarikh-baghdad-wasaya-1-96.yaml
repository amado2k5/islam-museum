text: "… : مات سعيد اين يحي الأموى للنصف من ذى القعدة سنة تسع وأربمين وماثنين. وأخبرنا السمسار أخيرتا الصفار حدثنا ابن قائع : أن سعيد بن يحيى الأموى مات فى سنة تسع وأربعين ومائتين. • قلت. ودفن فى متبرة باب البردان. …"
summary:
  ar: "مقطع من تاريخ بغداد للخطيب البغدادي، المجلد المصوَّر 1، ص 96، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
