text: "… منه. وبالجملة كل صناعة متعبة ي الي لي البلسان : يفيد دهن البلسان من الصداع، والصمم، والحكة، وأوجاع الحلق والأسنان، وضيق النفس، والربو، والسعال، والقروح الرئوية، وضعف المعدة والكبد، والكلى، والطحال وغيرها من الأمراض. التداوي بالنباتات والأعشاب قديماً وحديثاً، أحمد …"
