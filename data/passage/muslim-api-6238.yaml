label: { ar: "صحيح مسلم 6238 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih Muslim 6238 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح مسلم 6238 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih Muslim 6238 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos." }
text: "… بْنُ حَرْبٍ، قَالاَ حَدَّثَنَا الْحَسَنُ بْنُ مُوسَى، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا سِمَاكُ بْنُ حَرْبٍ، حَدَّثَنِي مُصْعَبُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، أَنَّهُ نَزَلَتْ فِيهِ آيَاتٌ مِنَ الْقُرْآنِ - قَالَ - حَلَفَتْ أُمُّ سَعْدٍ أَنْ لاَ تُكَلِّمَهُ أَبَدًا حَتَّى يَكْفُرَ بِدِينِهِ وَلاَ تَأْكُلَ وَلاَ تَشْرَبَ. قَالَتْ زَعَمْتَ أَنَّ اللَّهَ وَصَّاكَ بِوَالِدَيْكَ وَأَنَا أُمُّكَ وَأَنَا آمُرُكَ بِهَذَا. قَالَ مَكَثَتْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6238، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6238 (The Book of the Merits of the Companions), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6238، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 6238 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad, así como el cumplimiento o la desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
