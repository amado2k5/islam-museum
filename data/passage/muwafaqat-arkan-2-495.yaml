text: "… ما يقضي بهدمها وإفسادها: من الظلم ونقص الكيل وما معها، وقوله من جانب الوجود أي الأسباب التي تحفظها وتستبقي وجودها، كالأكل والشرب في حفظ النفس مثلاً. أي: من شعب الإيمان ومحبة اللّٰه ورسوله. وما إلى ذلك وقوله فالأصل أي الإيماني. …"
