text: "… عَنْ سَعْدِ ابْنِ سَعِيدٍ. قَالَ: أخْبَرَنِي عُمَرُ ابْن كَثِيرِ ابْنِ أفْلَحَ، قَالَ: سَمِعْتُ ابْنَ سَفِينَةَ يُحَدِّثُ. اللّه ا يَقُولُ: مَا مِنْ عَبْدٍ تُصِيبُهُ مُصِيبَةٌ فَيَقُولُ: إنَّا للَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ اللَّهمَ! أْجُرْنِي فِي مُصِيَتِي وَأخْلِفْ لِي خَيْراً مِنْهَا، إلا أجَرَهُ …"
summary:
  ar: "مقطع من المنهاج شرح صحيح مسلم بن الحجاج، المجلد المصوَّر 1، ص 596، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Minhaj fi Sharh Sahih Muslim b. al-Hajjaj, scan volume 1, p. 596, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المنہاج شرح صحیح مسلم بن الحجاج، اسکین جلد 1، ص 596 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
