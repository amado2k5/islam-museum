label: { ar: "الموطأ 2376 — سعيد بن المسيب: النبي قال لهزال لو سترته برداءك", en: "Muwatta 2376" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه بلغه أن النبي قال لرجل من أسلم يقال له هزال: لو سترته برداءك لكان خيرا لك. ويذكر المحقق أن الحديث في رواية مالك مرسل عند جماعة من الرواة عنه، وأن طرقه الموصولة في الصحيحين من حديث أبي هريرة وجابر، وأن طرق قصة هزال الأخرى لا تصح عنده. {cite:muwatta-maruf-1997 p.381} {cite:muwatta-maruf-1997 p.382}"
