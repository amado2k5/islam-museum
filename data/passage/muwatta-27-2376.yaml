label: { ar: "الموطأ 2376 — سعيد بن المسيب: النبي قال لهزال لو سترته برداءك", en: "Muwatta 2376", es: "Muwatta 2376", fr: "Muwatta 2376", ur: "موطا 2376", tr: "El-Muvatta 2376 — Sa'id ibn el-Musayyab: Peygamber Hazal'a şöyle dedi: \"Eğer onu cübbenle örtmüş olsaydın...\"", id: "Al-Muwatta 2376 — Sa’id ibn al-Musayyab: Nabi bersabda kepada Hazal, “Seandainya engkau menutupinya dengan jubahmu…”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أنه بلغه أن النبي قال لرجل من أسلم يقال له هزال: لو سترته برداءك لكان خيرا لك. ويذكر المحقق أن الحديث في رواية مالك مرسل عند جماعة من الرواة عنه، وأن طرقه الموصولة في الصحيحين من حديث أبي هريرة وجابر، وأن طرق قصة هزال الأخرى لا تصح عنده. {cite:muwatta-maruf-1997 p.381} {cite:muwatta-maruf-1997 p.382}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayet ederek, Peygamber'in Aslam'dan Hazal adında bir adama şöyle dediğini işittiğini belirtir: \"Onu cübbenle örtseydin, senin için daha hayırlı olurdu.\" Araştırmacı, Malik'in rivayetindeki hadisin, kendisinden gelen bir grup ravi tarafından mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu ve bağlantılı rivayet zincirlerinin iki Sahih'te (Buhari ve Müslim) Ebu Hurayra ve Cabir hadislerinden bulunduğunu, Hazal kıssasının diğer rivayet zincirlerinin ise kendisine göre sahih olmadığını belirtir. {cite:muwatta-maruf-1997 s.381} {cite:muwatta-maruf-1997 s.382}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa ia mendengar bahwa Nabi berkata kepada seorang laki-laki dari Aslam bernama Hazal: \"Sekiranya engkau menutupinya dengan jubahmu, itu akan lebih baik bagimu.\" Peneliti menyebutkan bahwa hadits dalam riwayat Malik adalah mursal (hadits dengan rantai periwayatan yang hilang) menurut sekelompok perawi darinya, dan bahwa rantai periwayatan yang terkait terdapat dalam dua kitab Sahih (Bukhari dan Muslim) dari hadits Abu Hurairah dan Jabir, dan bahwa rantai periwayatan lain untuk kisah Hazal tidak sahih menurutnya. {cite:muwatta-maruf-1997 p.381} {cite:muwatta-maruf-1997 p.382}"
