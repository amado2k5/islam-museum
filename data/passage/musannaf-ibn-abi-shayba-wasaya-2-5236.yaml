text: "… ثقل رسول اللّٰه وَليفي في مرضه الذي مات فيه أخذت بيده، فجعلت أمسحها وأقولها، قالت: فنزع يده من يدي وقال: اللهم اغفر لي وألحقني بالرفيق الأعلى، قالت: فكان هذا آخر ما سمعت من كلامه. - حدَّثنا أبو بكر قال: حدَّثنا …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 5236، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 5236, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 5236 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 5236, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Musannaf d'Ibn Abi Shayba, volume 2, page 5236, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 5236. sayfasından, vasiyetname ve ölüm anını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari Musannaf karya Ibn Abi Shaybah, Volume 2, halaman 5236, yang menyebutkan wasiat terakhir dan saat kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
