label: { ar: "الموطأ 2858 — عبد الله بن الأرقم: الصدقة أوساخ الناس يغسلونها عنهم", en: "Muwatta 2858", es: "Muwatta 2858", fr: "Muwatta 2858", ur: "موطا 2858", tr: "Al-Muwatta 2858 — Abdullah ibn al-Arqam: Sadaka, insanların kendilerinden yıkayıp uzaklaştırdıkları kirdir.", id: "Al-Muwatta 2858 — Abdullah ibn al-Arqam: Sedekah adalah kotoran yang dibersihkan manusia dari tubuhnya" }
summary:
  ar: "يروي مالك عن زيد بن أسلم، عن أبيه، أنه قال: قال عبد الله بن الأرقم: دلني على بعير من المطايا أستحمل عليه أمير المؤمنين. فقلت: نعم، جملا من الصدقة. فقال عبد الله بن الأرقم: أتحب أن رجلا بادنا في يوم حار غسل لك ما تحت إزاره ورفغيه، ثم أعطاكه فشربته؟ فغضبت وقلت: يغفر الله لك، أتقول لي مثل هذا؟ فقال: إنما الصدقة أوساخ الناس يغسلونها عنهم. {cite:muwatta-maruf-1997 p.601}"
  tr: "Malik, babasından rivayetle Zeyd ibn Aslam'dan naklederek şöyle buyurmuştur: Abdullah ibn el-Arkam dedi ki: Bana dağlardan bir deve göster ki, Müminlerin Emiri'ne bineyim. Ben dedim ki: Evet, sadakalardan bir deve. Abdullah ibn el-Arkam dedi ki: Sıcak bir günde şişman bir adamın senin için belindeki ve kasıklarındaki şeyi yıkamasını, sonra da sana içirmesini ister misin? Ben öfkelenip dedim ki: Allah seni affetsin, bana böyle bir şey mi söylüyorsun? Dedi ki: Sadaka, insanların kendilerinden yıkadıkları pislikten başka bir şey değildir. {cite:muwatta-maruf-1997 s.601}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari ayahnya, bahwa ia berkata: Abdullah ibn al-Arqam berkata: Tunjukkan kepadaku seekor unta dari antara gunung-gunung agar aku dapat menunggangi Amirul Mukminin. Aku berkata: Ya, seekor unta dari sedekah. Abdullah ibn al-Arqam berkata: Apakah kamu ingin seorang pria gemuk di hari yang panas mencuci apa yang ada di bawah kain pinggang dan selangkangannya untukmu, lalu memberikannya kepadamu untuk diminum? Aku menjadi marah dan berkata: Semoga Allah mengampunimu, apakah kamu mengatakan hal seperti itu kepadaku? Dia berkata: Sedekah hanyalah kotoran manusia yang mereka bersihkan dari diri mereka sendiri. {cite:muwatta-maruf-1997 p.601}"
