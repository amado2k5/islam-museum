summary:
  ar: "يروي مالك عن زيد بن أسلم، عن أبيه، أنه قال: قال عبد الله بن الأرقم: دلني على بعير من المطايا أستحمل عليه أمير المؤمنين. فقلت: نعم، جملا من الصدقة. فقال عبد الله بن الأرقم: أتحب أن رجلا بادنا في يوم حار غسل لك ما تحت إزاره ورفغيه، ثم أعطاكه فشربته؟ فغضبت وقلت: يغفر الله لك، أتقول لي مثل هذا؟ فقال: إنما الصدقة أوساخ الناس يغسلونها عنهم. {cite:muwatta-maruf-1997 p.601}"
