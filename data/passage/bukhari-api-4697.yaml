label: { ar: "صحيح البخاري 4697 — أطوار خلق الجنين", en: "Sahih al-Bukhari 4697 — the stages of the embryo", ur: "صحیح بخاری 4697 — جنین کے مراحل", es: "Sahih al-Bukhari 4697 — Las etapas del embrión", fr: "Sahih al-Bukhari 4697 — Les stades de l'embryon", tr: "Sahih el-Buhari 4697 — Embriyonik Gelişimin Aşamaları", id: "Sahih al-Bukhari 4697 — Tahapan Perkembangan Embrio" }
text: "… اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَما ـ أَنَّ رَسُولَ اللَّهِ قَالَ \" مَفَاتِيحُ الْغَيْبِ خَمْسٌ لاَ يَعْلَمُهَا إِلاَّ اللَّهُ لاَ يَعْلَمُ مَا فِي غَدٍ إِلاَّ اللَّهُ، وَلاَ يَعْلَمُ مَا تَغِيضُ الأَرْحَامُ إِلاَّ اللَّهُ وَلاَ يَعْلَمُ مَتَى يَأْتِي الْمَطَرُ أَحَدٌ إِلاَّ اللَّهُ، وَلاَ تَدْرِي نَفْسٌ بِأَىِّ أَرْضٍ تَمُوتُ، وَلاَ يَعْلَمُ مَتَى تَقُومُ السَّاعَةُ إِلاَّ اللَّهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4697، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4697 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4697، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4697 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona las etapas del embrión. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4697 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne les stades du développement embryonnaire. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4697 numaralı hadis, fetüsün gelişim aşamalarını anlatmaktadır. Bu hadis, tıp camiası tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine yazılmış metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4697, menjelaskan tahapan perkembangan janin. Hadits ini dikumpulkan oleh komunitas medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
