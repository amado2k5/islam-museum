text: "… ليته يجد شيئاً دخل لص إلى دار جحا، فقالت له امرأته بلهفة: ألا ترى اللص يدور في البيت؟ فأجابها الأستاذ بكل تأنٍ: لا تهتمي به فيا لَيْتَهُ يجدُ شيئاً فيهونَ علينا أخذُهُ من يدِه. أَتُريدُ أَنْ أبعدَ أكثر ؟ قالت …"
summary:
  ar: "دخل لص بيت جحا، فلما قالت له زوجته إنه يبحث قال جحا إنه يرجو أن يجد اللص شيئًا ليسهل أخذه من يده. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  en: "A thief enters Juha's house; told by his wife that the thief is searching, Juha says he hopes the thief finds something, so that it will be easier to take it from his hand. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  ur: "ایک چور جحا کے گھر میں گھس آیا؛ بیوی نے بتایا کہ وہ تلاش کر رہا ہے تو جحا نے کہا کہ امید ہے چور کو کچھ مل جائے تاکہ اسے اس کے ہاتھ سے لینا آسان ہو۔ {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  fr: "Un voleur entre chez Juha ; sa femme lui dit que le voleur cherche, et Juha répond qu'il espère que le voleur trouvera quelque chose, pour qu'il soit plus facile de le lui reprendre des mains. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  es: "Un ladrón entra en casa de Juha; cuando su mujer le dice que está buscando, Juha dice que espera que el ladrón encuentre algo, para que sea más fácil quitárselo de la mano. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
  tr: "Juha'nın evine bir hırsız girdi. Karısı hırsızın arama yaptığını söyleyince, Juha hırsızın kendisinden kolayca alabileceği bir şey bulmasını umduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 33}"
  id: "Seorang pencuri membobol rumah Juha. Ketika istrinya memberitahunya bahwa pencuri itu sedang menggeledah, Juha berkata bahwa ia berharap pencuri itu akan menemukan sesuatu yang mudah diambil darinya. {cite:juha-nawadir-kubra-djuwaydi p. 33}"
