label: { ar: "الموطأ 514 — أنس: هلكت المواشي وتقطعت السبل فادع الله؛ فمطرنا من الجمعة إلى الجمعة", en: "Muwatta 514" }
text: "اللهم ظهور الجبال والآكام، وبطون الأودية، ومنابت الشجر"
summary:
  ar: "يرويه مالك عن شريك بن عبد الله بن أبي نمر عن أنس بن مالك، في باب ما جاء في الاستسقاء: جاء رجل إلى النبي فقال هلكت المواشي وتقطعت السبل فادع الله، فدعا النبي فمُطروا من الجمعة إلى الجمعة، ثم جاء رجل فقال تهدمت البيوت وانقطعت السبل وهلكت المواشي، فقال النبي: اللهم ظهور الجبال والآكام وبطون الأودية ومنابت الشجر، فانجابت عن المدينة انجياب الثوب. ويخرّجه المحقق عند البخاري (1016، 1017، 1019) والنسائي (3/154) وابن حبان والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/61). {cite:muwatta-maruf-1997 p.265} {cite:muwatta-maruf-1997 p.266}"
