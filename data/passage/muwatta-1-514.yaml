label: { ar: "الموطأ 514 — أنس: هلكت المواشي وتقطعت السبل فادع الله؛ فمطرنا من الجمعة إلى الجمعة", en: "Muwatta 514", es: "Muwatta 514", fr: "Muwatta 514", ur: "موطا 514", tr: "Al-Muwatta 514 — Enes: Hayvanlar telef oldu, yollar kesildi, Allah'a dua edin; ve cuma gününden cumaya üzerimize yağmur yağdı.", id: "Al-Muwatta 514 — Anas: Hewan ternak mati dan jalan terputus, maka berdoalah kepada Allah; dan hujan turun kepada kami dari Jumat sampai Jumat." }
text: "اللهم ظهور الجبال والآكام، وبطون الأودية، ومنابت الشجر"
summary:
  ar: "يرويه مالك عن شريك بن عبد الله بن أبي نمر عن أنس بن مالك، في باب ما جاء في الاستسقاء: جاء رجل إلى النبي فقال هلكت المواشي وتقطعت السبل فادع الله، فدعا النبي فمُطروا من الجمعة إلى الجمعة، ثم جاء رجل فقال تهدمت البيوت وانقطعت السبل وهلكت المواشي، فقال النبي: اللهم ظهور الجبال والآكام وبطون الأودية ومنابت الشجر، فانجابت عن المدينة انجياب الثوب. ويخرّجه المحقق عند البخاري ⁦(1016، 1017، 1019)⁩ والنسائي (3/154) وابن حبان والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/61). {cite:muwatta-maruf-1997 p.265} {cite:muwatta-maruf-1997 p.266}"
  tr: "Malik, Şarik ibn Abdullah ibn Abi Namir'den, o da Enes ibn Malik'ten rivayet ettiği üzere, yağmur duasıyla ilgili rivayetler bölümünde şöyle anlatmıştır: Bir adam Peygamberimize gelip, “Hayvanlar telef oldu, yollar kapandı, Allah'a dua et” dedi. Peygamberimiz dua etti ve bir cuma gününden diğerine kadar yağmur yağdı. Sonra başka bir adam geldi ve, “Evler yıkıldı, yollar kapandı, hayvanlar telef oldu” dedi. Peygamberimiz, “Ey Allahım, dağların zirveleri, tepeler, vadiler ve ağaçların yetiştiği yerler!” dedi. Bunun üzerine yağmur, bir elbisenin uçup gitmesi gibi şehirden kolayca kalktı. Editör, bunu Malik'in arkadaşlarının rivayet zincirleri aracılığıyla Buhari (1016, 1017, 1019), Nesai (3/154), İbn Hibban, Şafiî ve Beyhaki'nin derlemelerine dahil eder ve Temhid'e (22/61) atıfta bulunur."
  id: "Diriwayatkan oleh Malik dari Syarik bin Abdullah bin Abi Namir dari Anas bin Malik, dalam surah tentang apa yang diriwayatkan mengenai memohon hujan: Seorang laki-laki datang kepada Nabi dan berkata, “Hewan ternak telah mati dan jalan-jalan terputus, maka berdoalah kepada Allah.” Maka Nabi berdoa, dan hujan turun dari satu Jumat ke Jumat berikutnya. Kemudian seorang laki-laki lain datang dan berkata, “Rumah-rumah telah roboh, jalan-jalan terputus, dan hewan ternak telah mati.” Maka Nabi berkata, “Ya Allah, puncak-puncak gunung, bukit-bukit, lembah-lembah, dan tempat-tempat di mana pepohonan tumbuh.” Kemudian hujan berhenti dari kota dengan mudah seperti pakaian yang tertiup angin. Penyunting memasukkannya ke dalam koleksi al-Bukhari (1016, 1017, 1019), al-Nasa’i (3/154), Ibn Hibban, al-Shafi’i, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/61)."
