label: { ar: "الموطأ 601 — ربيعة بن عبد الله بن الهدير: رأى عمر يقدم الناس أمام جنازة زينب بنت جحش", en: "Muwatta 601", es: "Muwatta 601", fr: "Muwatta 601", ur: "موطا 601", tr: "El-Muvatta 601 — Rabi’ah ibn Abdullah ibn al-Hudayr: Ömer’in, Zeynep bint Cahş’ın cenaze alayının önünde insanlara önderlik ettiğini gördü.", id: "Al-Muwatta 601 — Rabi’ah ibn Abdullah ibn al-Hudayr: Dia melihat Umar memimpin orang-orang di depan prosesi pemakaman Zaynab bint Jahsh" }
summary:
  ar: "يرويه مالك عن محمد بن المنكدر عن ربيعة بن عبد الله بن الهدير، أنه أخبره أنه رأى عمر بن الخطاب يتقدم الناس أمام الجنازة في جنازة زينب بنت جحش. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومحمد بن الحسن الشيباني (308). {cite:muwatta-maruf-1997 p.310}"
  tr: "Malik, Muhammed ibn el-Munkadir'den, o da Rabi'ah ibn 'Abd Allah ibn el-Hudayr'dan rivayet ederek, Zeynep bint Cahş'ın cenazesinde Ömer ibn el-Hattab'ın cenaze alayının önünde insanlara önderlik ettiğini gördüğünü bildirmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd, el-Şafii'nin Musned'inde ve Muhammed ibn el-Hasan el-Şeybani (308) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.310}"
  id: "Malik meriwayatkan hadits ini dari Muhammad ibn al-Munkadir, dari Rabi'ah ibn 'Abd Allah ibn al-Hudayr, yang memberitahukan kepadanya bahwa ia melihat 'Umar ibn al-Khattab memimpin orang-orang di depan prosesi pemakaman pada pemakaman Zaynab bint Jahsh. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, al-Shafi'i dalam Musnadnya, dan Muhammad ibn al-Hasan al-Shaybani (308). {cite:muwatta-maruf-1997 p.310}"
