label: { ar: "الموطأ 601 — ربيعة بن عبد الله بن الهدير: رأى عمر يقدم الناس أمام جنازة زينب بنت جحش", en: "Muwatta 601" }
summary:
  ar: "يرويه مالك عن محمد بن المنكدر عن ربيعة بن عبد الله بن الهدير، أنه أخبره أنه رأى عمر بن الخطاب يتقدم الناس أمام الجنازة في جنازة زينب بنت جحش. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده ومحمد بن الحسن الشيباني (308). {cite:muwatta-maruf-1997 p.310}"
