label: { ar: "الموطأ 449 — ابن عمر يضع كفيه على ما يضع عليه وجهه ولو في شدة البرد", en: "Muwatta 449" }
summary:
  ar: "أول أثر في باب وضع اليدين على ما يوضع عليه الوجه في السجود. يرويه يحيى عن مالك عن نافع: كان عبد الله بن عمر إذا سجد وضع كفيه على الذي يضع عليه وجهه، وقد رآه نافع في يوم شديد البرد يخرج كفيه من تحت برنس له حتى يضعهما على الحصباء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.231}"
