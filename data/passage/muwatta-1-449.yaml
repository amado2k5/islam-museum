label: { ar: "الموطأ 449 — ابن عمر يضع كفيه على ما يضع عليه وجهه ولو في شدة البرد", en: "Muwatta 449", es: "Muwatta 449", fr: "Muwatta 449", ur: "موطا 449", tr: "El-Muvatta 449 — İbn Ömer, yüzünü nereye koyarsa koysun, aşırı soğukta bile ellerini oraya koyar.", id: "Al-Muwatta 449 — Ibnu Umar meletakkan tangannya pada apa pun yang disentuh wajahnya, bahkan dalam cuaca yang sangat dingin." }
summary:
  ar: "أول أثر في باب وضع اليدين على ما يوضع عليه الوجه في السجود. يرويه يحيى عن مالك عن نافع: كان عبد الله بن عمر إذا سجد وضع كفيه على الذي يضع عليه وجهه، وقد رآه نافع في يوم شديد البرد يخرج كفيه من تحت برنس له حتى يضعهما على الحصباء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.231}"
  tr: "Secde sırasında ellerin yüzün dayandığı yere konulmasıyla ilgili ilk rivayet, Yahya'nın Malik'ten, o da Nafi'den naklettiği bir rivayettir: Abdullah ibn Umar secde ettiğinde, avuçlarını yüzünü koyduğu yere koyardı. Nafi' onu çok soğuk bir günde, cübbesinin altından avuçlarını çıkarıp çakılların üzerine koyarken gördü. Editör, bunun Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.231}"
  id: "Riwayat pertama mengenai posisi tangan di atas alas tempat wajah bersandar saat sujud diriwayatkan oleh Yahya, dari Malik, dari Nafi': Ketika Abdullah ibn Umar sujud, ia meletakkan telapak tangannya di atas alas tempat wajahnya bersandar. Nafi' melihatnya pada suatu hari yang sangat dingin mengeluarkan telapak tangannya dari bawah jubahnya dan meletakkannya di atas kerikil. Editor menyebutkan bahwa riwayat ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.231}"
