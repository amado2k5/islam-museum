label: { ar: "الموطأ 2049 — يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب: قال رسول الله ليهود خيبر يوم افتتحها: أقركم ما أقركم الله، على أن التمر بيننا وبينكم، فكان يبعث عبد الله بن رواحة فيخرص بينه وبينهم", en: "Muwatta 2049", es: "Muwatta 2049", fr: "Muwatta 2049", ur: "موطا 2049", tr: "El-Muvatta 2049 — Yahya, Malik'ten, o da İbn Şihab'tan, o da Said bin el-Musayyab'dan rivayetle: Allah'ın Resulü, Hayber'i fethettiği gün Hayber Yahudilerine şöyle buyurdu: \"Allah sizi bıraktığı sürece ben de sizi bırakacağım, ancak hurmaları aramızda paylaşmanız şartıyla.\" Bunun üzerine Abdullah bin Ravaha'yı göndererek, kendisi ve onlar arasındaki hasadı hesaplamasını istedi.", id: "Al-Muwatta 2049 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab: Rasulullah SAW bersabda kepada orang-orang Yahudi Khaybar pada hari beliau menaklukkannya: \"Aku akan membiarkan kalian selama Allah membiarkan kalian, dengan syarat kurma dibagi antara kita dan kalian.\" Maka beliau mengutus Abdullah bin Rawaha untuk memperkirakan hasil panen antara dirinya dan mereka." }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب أن رسول الله قال ليهود خيبر، يوم افتتح خيبر: أقركم ما أقركم الله عز وجل، على أن التمر بيننا وبينكم. قال: فكان رسول الله يبعث عبد الله بن رواحة فيخرص بينه وبينهم، ثم يقول: إن شئتم فلكم، وإن شئتم فلي، فكانوا يأخذونه. ويذكر المحقق أن بعض الضعفاء رووا الحديث موصولا، ولا يصح، وأن الصحيح أنه مرسل. {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.240}"
  tr: "Yahya, Malik'ten, o da İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet eder ki, Allah Resulü Hayber'i fethettiği gün Hayber Yahudilerine şöyle buyurmuştur: \"Yüce ve Şanlı Allah size izin verdiği sürece burada kalmanıza izin vereceğim, ancak hurmaları aramızda paylaşmanız şartıyla.\" Yahya şöyle devam etti: Bunun üzerine Allah Resulü, Abdullah ibn Ravaha'yı göndererek kendisi ve onlar arasındaki verimi hesaplatır, sonra da \"Dilerseniz sizin, isterseniz benim olsun\" derdi ve onlar da alırlardı. Araştırmacı, bazı zayıf ravilerin hadisi sicili sağlam bir şekilde naklettiğini, ancak bunun sahih olmadığını ve doğru versiyonun mursal (sicili eksik hadis) olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.239} {cite:muwatta-maruf-1997 s.240}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, dari Sa'id ibn al-Musayyab, bahwa Rasulullah SAW bersabda kepada orang-orang Yahudi Khaybar pada hari beliau menaklukkan Khaybar: \"Aku akan mengizinkan kalian tinggal selama Allah Yang Maha Tinggi dan Maha Mulia mengizinkan kalian tinggal, dengan syarat kurma tersebut dibagi di antara kita.\" Beliau berkata: Maka Rasulullah SAW mengutus Abdullah ibn Rawahah untuk memperkirakan hasil panen antara beliau dan mereka, kemudian beliau berkata: \"Jika kalian mau, itu milik kalian, dan jika kalian mau, itu milikku,\" dan mereka pun mengambilnya. Peneliti menyebutkan bahwa beberapa perawi lemah meriwayatkan hadits ini dengan sanad yang terhubung, tetapi ini tidak sahih, dan versi yang benar adalah bahwa hadits ini mursal (hadits dengan mata rantai yang hilang dalam sanad). {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.240}"
