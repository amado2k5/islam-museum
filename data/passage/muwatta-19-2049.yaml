label: { ar: "الموطأ 2049 — يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب: قال رسول الله ليهود خيبر يوم افتتحها: أقركم ما أقركم الله، على أن التمر بيننا وبينكم، فكان يبعث عبد الله بن رواحة فيخرص بينه وبينهم", en: "Muwatta 2049" }
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب أن رسول الله قال ليهود خيبر، يوم افتتح خيبر: أقركم ما أقركم الله عز وجل، على أن التمر بيننا وبينكم. قال: فكان رسول الله يبعث عبد الله بن رواحة فيخرص بينه وبينهم، ثم يقول: إن شئتم فلكم، وإن شئتم فلي، فكانوا يأخذونه. ويذكر المحقق أن بعض الضعفاء رووا الحديث موصولا، ولا يصح، وأن الصحيح أنه مرسل. {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.240}"
