text: |-
  A.VT
  ويقال للبه-عى اذا امتنعت من الراعية أخذت رماجها وربعا قالوا فى الابل اذاسمنت
  اودرّت قد أخذت وماحها لان صاحيما يمتنع من تحرها ⁦(رفح)⁩ ترنح تايل من السكر
  وغيره ورمح عليه تزنيحا على مالم يسم فاءله أى غشى عليه أواعتراه وهن فى عظامه فتمايل فهو
  مريح وقال يصف كلباطعنه النود
  فظل برنح فى غيطل • كمأيستدير الحهار النعر
  ⁦( روح)⁩ الروح يذ كرويؤنت والجمع الارواح ويسمى الرآن روحا وكذلك جبريل وعيدى
  عليهما السلام وزعم أبوالخطاب أنه سمع من العرب من يقول فى النسبة الى الملائكة
  والجنّ روحانى بضم الراء والجمع روحانيون وزعم أبو عبيدة أن العرب تة وله لكل شئ في
  روح ومكان روحانى" بالفتح أى طيب والريح واحدة الرياح والارياح وقد تجمع على آرواح
  لان أصلها الواو وانماجاءت بالياء لا نكسار ما قبلها فاذارجعوا الى الفتح عادت الى الواو
  كقولت أروح الماء وتروحت بالمروحة ويقال ريح وريحة كما فالواد ارودارة ورياح حى
  من يربوع والرياح بالفتح الراح وهى الخمر وقال
  كان مكاكى الجواءغدية • نشاوى تساقوا بالرياح المفلفل
  وقد تكون الريح بعنى الغلبة واتقوة قال الشاءر
  أتنظران قليلاريث غفلتهم • أوتعدوان فان الريح العادى
  ومنه قوله تعالى وتذهب ريحكم والروح والراحة من الاستراحة والروح نسيم الريح
  ويقال أيضايوم روح وريوح أى طيب وروح وريحان أى رحة ورزق والراح الهر والراح
  جمع راحة وهى الكف والراح الارتياح قال الشاعر
  واقيت ما لقيت معدّ كاها * وفقدت راحى فى الشباب وخالى أى اختيالى
  وتقول وجدت ويح الشئ ورائحته بعسنى والدهن المروح المطيب وفى الحديث أنه أمر
  بالأعد المروّح عند النوم وأراح اللحم أى أنتن وأراح الرجل أى مات قال العجاج
  أراح بعد الغم والتغم
  م وآراح ابله أى ردّها الى المراح وكذلك الترويح ولا يكون ذلك
  الابعد الزوال وأرحت على الرجل حقه اذا رددته عليه وقال
  إلا تريحى علينا الحق طائعة • دون القضاة فقاضينا الى حكم
  وأراحه اللٰه فاستراح وأراح الرجل رجعت اليه نفسه بعد الاعياه وأراح
  ننفس وقال امر ؤالقيس ي ف فرسا
  لها منخر كوجار الضباع قنمزمح اذا تنبهر
  وأراح القوم دخلوا فى الريح وأراح الشى أى وجدريحه يقال أراحنى الصيداز اوجدريح
  الانسى وكذلك أروح واستروح واستراح كله بمعنى والرواح نقيض الصباح وه واسم للوقب
  من زوال الشمس الى الليل وقديكون مصدرقولك راح بروح رواحا وهونيض قولك غدا
  يغد غدوًا وتقول خرج وابرواح من العشى ورياح بمعى وسرحت الماشية بالغداة وراحت
  باعشىّ أى رجغت وتقول افعل ذافى سراح ورواح أى سهولة والمراح بالضم حسث
  تأُوى اليه الابل والغسم بالليل والمراح بالفتح الموضع الذى يروح منه القوم أويروحون اليه
  ٤ المغدى
