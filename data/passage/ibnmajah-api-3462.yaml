label: { ar: "سنن ابن ماجه 3462 — القسط والعود الهندي، اللدود والسعوط", en: "Sunan Ibn Majah 3462 — costus (Indian aloeswood); medicine given by the mouth-side or the nose", ur: "سنن ابن ماجہ 3462 — قسط ہندی، لدود اور سعوط", es: "Sunan Ibn Majah 3462 — costus (árbol de aloe indio); medicamento administrado por vía oral o nasal.", fr: "Sunan Ibn Majah 3462 — costus (bois d'aloès indien); médicament administré par voie orale ou nasale", tr: "Sunan İbn Majah 3462 - Costus ve Hint aloeswood, infüzyon ve enfiye", id: "Sunan Ibnu Majah 3462 — Costus dan kayu gaharu India, infus dan tembakau" }
text: "… عَنْ أُمِّ قَيْسٍ بِنْتِ مِحْصَنٍ، قَالَتْ دَخَلْتُ بِابْنٍ لِي عَلَى النَّبِيِّ ـ وَقَدْ أَعْلَقْتُ عَلَيْهِ مِنَ الْعُذْرَةِ فَقَالَ \" عَلاَمَ تَدْغَرْنَ أَوْلاَدَكُنَّ بِهَذَا الْعِلاَقِ عَلَيْكُمْ بِهَذَا الْعُودِ الْهِنْدِيِّ فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ يُسْعَطُ بِهِ مِنَ الْعُذْرَةِ وَيُلَدُّ بِهِ مِنْ ذَاتِ الْجَنْبِ \". حَدَّثَنَا أَحْمَدُ بْنُ عَمْرِو بْنِ السَّرْحِ الْمِصْرِيُّ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَنْبَأَنَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3462، يذكر القسط والعود الهندي، واللدود والسعوط، وأسماء الأمراض، وعلاج العذرة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3462 (Chapters on Medicine), that mentions costus (Indian aloeswood), medicine given by the mouth-side or the nose, named diseases, treating the throat ailment (al-udhra), healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3462، جس میں قسط ہندی، لدود اور سعوط، بیماریوں کے نام، گلے کی بیماری عذرہ کا علاج، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3462 (Capítulos sobre Medicina), menciona el costus (árbol de aloe indio), un medicamento administrado por vía oral o nasal, para tratar enfermedades específicas, afecciones de la garganta (al-udhra) y para la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3462 (Chapitres sur la médecine), mentionne le costus (bois d'aloès indien), un remède administré par voie orale ou nasale, le traitement de maladies spécifiques, notamment les maux de gorge (al-udhra), et la guérison. Le Répertoire des textes médicaux le classe parmi les ouvrages consacrés à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah Süneni'nde yer alan 3462 numaralı hadiste, kostus kökü, Hint öd ağacı, ağızdan alınan ilaçlar, burundan inhalasyon, hastalıkların isimleri, bademcik iltihabının tedavisi ve iyileşmeden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3462, menyebutkan akar costus, kayu gaharu India, pengobatan oral, inhalasi nasal, nama-nama penyakit, pengobatan radang amandel, dan penyembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
