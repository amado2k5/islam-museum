label: { ar: "الموطأ 2127 — مالك: الأمر المجتمع عليه عندنا أن شهادة الصبيان تجوز فيما بينهم من الجراح ولا تجوز على غيرهم، وإنما تجوز فيما بينهم من الجراح وحدها، إذا كان ذلك قبل أن يتفرقوا أو يخبوا أو يعلموا، فإن افترقوا فلا شهادة لهم إلا أن يكونوا قد أشهدوا العدول قبل أن يتفرقوا", en: "Muwatta 2127" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن شهادة الصبيان تجوز فيما بينهم من الجراح، ولا تجوز على غيرهم. وإنما تجوز شهادتهم فيما بينهم من الجراح وحدها، لا تجوز في غير ذلك، إذا كان ذلك قبل أن يتفرقوا، أو يخببوا، أو يعلموا. فإن افترقوا فلا شهادة لهم، إلا أن يكونوا قد أشهدوا العدول على شهادتهم قبل أن يتفرقوا. {cite:muwatta-maruf-1997 p.269}"
