label: { ar: "الموطأ 2127 — مالك: الأمر المجتمع عليه عندنا أن شهادة الصبيان تجوز فيما بينهم من الجراح ولا تجوز على غيرهم، وإنما تجوز فيما بينهم من الجراح وحدها، إذا كان ذلك قبل أن يتفرقوا أو يخبوا أو يعلموا، فإن افترقوا فلا شهادة لهم إلا أن يكونوا قد أشهدوا العدول قبل أن يتفرقوا", en: "Muwatta 2127", es: "Muwatta 2127", fr: "Muwatta 2127", ur: "موطا 2127", tr: "El-Muvatta 2127 — Malik: Bizim aramızdaki görüş birliği şudur ki, çocukların kendi aralarında uğradıkları yaralanmalar konusunda şahitlikleri caizdir, ancak başkalarına karşı olan yaralanmalar konusunda caiz değildir. Sadece kendi aralarında uğradıkları yaralanmalar konusunda, ayrılmadan, farkına varmadan veya öğrenmeden önce meydana gelmesi şartıyla şahitlikleri caizdir. Ayrılmaları durumunda, ayrılmadan önce şahitleri bulunmadıkça şahitlikleri geçerli değildir.", id: "Al-Muwatta 2127 — Malik: Konsensus di antara kami adalah bahwa kesaksian anak-anak diperbolehkan mengenai luka yang diderita di antara mereka sendiri, tetapi tidak terhadap orang lain. Kesaksian anak-anak hanya diperbolehkan mengenai luka yang diderita di antara mereka sendiri, dengan syarat hal itu terjadi sebelum mereka berpisah, menyadari, atau mengetahui. Jika mereka berpisah, kesaksian mereka tidak sah kecuali jika ada saksi yang hadir sebelum mereka berpisah." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن شهادة الصبيان تجوز فيما بينهم من الجراح، ولا تجوز على غيرهم. وإنما تجوز شهادتهم فيما بينهم من الجراح وحدها، لا تجوز في غير ذلك، إذا كان ذلك قبل أن يتفرقوا، أو يخببوا، أو يعلموا. فإن افترقوا فلا شهادة لهم، إلا أن يكونوا قد أشهدوا العدول على شهادتهم قبل أن يتفرقوا. {cite:muwatta-maruf-1997 p.269}"
  tr: "Malik şöyle dedi: Aramızdaki yerleşik uygulama, çocukların birbirlerine verdikleri zararlarla ilgili tanıklıklarının kabul edilebilir olması, ancak diğerleriyle ilgili tanıklıklarının kabul edilemez olmasıdır. Tanıklıkları yalnızca birbirlerine verdikleri zararlarla ilgili olarak kabul edilebilir, diğer konularda değil; ancak bu, ayrılmadan, çatışmaya girmeden veya öğrenmeden önce gerçekleşmiş olmalıdır. Ayrılırlarsa, ayrılmadan önce güvenilir kişiler tarafından tanıklıkları onaylanmadığı sürece tanıklıkları geçersizdir. {cite:muwatta-maruf-1997 s.269}"
  id: "Malik berkata: Praktik yang berlaku di antara kami adalah bahwa kesaksian anak-anak dapat diterima terkait cedera yang diderita satu sama lain, tetapi tidak terkait dengan orang lain. Kesaksian mereka hanya dapat diterima terkait cedera yang diderita satu sama lain, dan bukan dalam hal lain, asalkan hal ini terjadi sebelum mereka berpisah, terlibat dalam konflik, atau belajar. Jika mereka berpisah, kesaksian mereka tidak sah kecuali kesaksian mereka telah disaksikan oleh individu yang dapat dipercaya sebelum berpisah. {cite:muwatta-maruf-1997 p.269}"
