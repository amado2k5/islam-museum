label: { ar: "صحيح البخاري 655 — كتاب الأعمال والملائكة الكاتبون", en: "Sahih al-Bukhari 655 — the record of deeds and the recording angels", ur: "صحیح بخاری 655 — نامۂ اعمال اور لکھنے والے فرشتے", es: "Sahih al-Bukhari 655 — El registro de los hechos y los ángeles que los registran", fr: "Sahih al-Bukhari 655 — Le livre des actes et les anges enregistreurs", tr: "Sahih el-Buhari 655 — Amel Kitabı ve Kaydeden Melekler", id: "Sahih al-Bukhari 655 — Kitab Amal dan Malaikat Pencatat" }
text: "… أَنَسٍ، قَالَ قَالَ النَّبِيُّ \" يَا بَنِي سَلِمَةَ أَلاَ تَحْتَسِبُونَ آثَارَكُمْ \". وَقَالَ مُجَاهِدٌ فِي قَوْلِهِ {وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ} قَالَ خُطَاهُمْ. وَقَالَ ابْنُ أَبِي مَرْيَمَ أَخْبَرَنَا يَحْيَى بْنُ أَيُّوبَ، حَدَّثَنِي حُمَيْدٌ، حَدَّثَنِي أَنَسٌ، أَنَّ بَنِي سَلِمَةَ، أَرَادُوا أَنْ يَتَحَوَّلُوا، عَنْ مَنَازِلِهِمْ، فَيَنْزِلُوا قَرِيبًا مِنَ النَّبِيِّ قَالَ فَكَرِهَ رَسُولُ اللَّهِ أَنْ يُعْرُوا {الْمَدِينَةَ} فَقَالَ \" …"
summary:
  ar: "حديث في صحيح البخاري، رقم 655، يذكر كتاب الأعمال والملائكة الكاتبون. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 655, that speaks of the record of deeds and the recording angels. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 655، جس میں نامۂ اعمال اور لکھنے والے فرشتے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 655, que habla del registro de las acciones y de los ángeles que las registran. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih al-Bukhari, n° 655, évoque le registre des actes et les anges qui l'enregistrent. Le Livre des Hasanat et des Sayyi'at le mentionne parmi les textes relatifs au décompte, à l'inscription, à l'effacement ou à la pesée d'un acte."
  tr: "Sahih el-Buhari'de 655 numaralı hadis, Amel Kitabı'ndan ve bunları kaydeden meleklerden bahseder. Bu kitap, iyi ve kötü amellerin listesini ve amelleri kaydeden, yazan, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 655, menyebutkan Kitab Amal dan para malaikat pencatat. Kitab ini mencakup daftar amal baik dan amal buruk beserta teks yang mencatat, menuliskan, menghapus, atau menimbang amal tersebut."
