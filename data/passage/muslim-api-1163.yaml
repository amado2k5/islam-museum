label: { ar: "صحيح مسلم 1163 — ما أُحل، ما لا يحل", en: "Sahih Muslim 1163 — what was made lawful; what is not lawful", ur: "صحیح مسلم 1163 — جو حلال کیا گیا، جو حلال نہیں", es: "Sahih Muslim 1163 — lo que se ha hecho lícito; lo que no es lícito" }
text: "… عَبْدِ اللَّهِ الأَنْصَارِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ \" أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ قَبْلِي كَانَ كُلُّ نَبِيٍّ يُبْعَثُ إِلَى قَوْمِهِ خَاصَّةً وَبُعِثْتُ إِلَى كُلِّ أَحْمَرَ وَأَسْوَدَ وَأُحِلَّتْ لِيَ الْغَنَائِمُ وَلَمْ تُحَلَّ لأَحَدٍ قَبْلِي وَجُعِلَتْ لِيَ الأَرْضُ طَيِّبَةً طَهُورًا وَمَسْجِدًا فَأَيُّمَا رَجُلٍ أَدْرَكَتْهُ الصَّلاَةُ صَلَّى حَيْثُ كَانَ وَنُصِرْتُ بِالرُّعْبِ بَيْنَ يَدَىْ مَسِيرَةِ شَهْرٍ وَأُعْطِيتُ الشَّفَاعَةَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1163، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 1163 (The Book of Mosques and Places of Prayer), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 1163، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 1163 (El Libro de las Mezquitas y Lugares de Oración), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
