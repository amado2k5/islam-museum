text: "… أَنَّ رَسُولَ اللَّهِ نَهَى عَنْ لُحُومِ الأَضَاحِي فَوْقَ ثَلاَثَةِ أَيَّامٍ فَقَدِمَ قَتَادَةُ بْنُ النُّعْمَانِ - وَكَانَ أَخَا أَبِي سَعِيدٍ لأُمِّهِ وَكَانَ بَدْرِيًّا - فَقَدَّمُوا إِلَيْهِ فَقَالَ أَلَيْسَ قَدْ نَهَى عَنْهُ رَسُولُ اللَّهِ قَالَ أَبُو سَعِيدٍ إِنَّهُ قَدْ حَدَثَ فِيهِ أَمْرٌ إِنَّ رَسُولَ اللَّهِ نَهَانَا أَنْ نَأْكُلَهُ فَوْقَ ثَلاَثَةِ أَيَّامٍ ثُمَّ رَخَّصَ لَنَا أَنْ نَأْكُلَهُ وَنَدَّخِرَهُ."
summary:
  ar: "حديث في سنن النسائي، رقم 4428، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 4428 (The Book of ad-Dahaya (Sacrifices)), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 4428، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 4428, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 4428, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de 4428 numaralı hadis, bir muafiyetten bahsetmektedir. Farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahları derleyen bu eser, Kur'an, Sünnet, biyografi ve Sahabe ile Muhaliflerden gelen rivayetlerle birlikte metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4428, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan najis, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
