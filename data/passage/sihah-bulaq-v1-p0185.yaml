text: |-
  ٤٥٩
  خليفة ساس بغيرنعس • امام رغس فى نصاب رغس
  والنصاب الاصل وقال دقية بن الهجاج حتى رأ يناوجهك المرعوسا بعسنى المباركل الميمون
  مقلوبا وقد ركسه وأركه بمعى واقه أركسهم بما كسبوا أى ردّهم الى كفرهم وارة.كس
  فلان فى أمر كان ودنجامنه والركس بالكسر الرحس والركس أيضا الكثير من الناس
  والراكس الهادى وهو الموروسط السدر تدور عله الشيران فى الدياسة وراكس فى شهر
  النايغة وعيد أبى قابوس فى غيركنه • أتانى ودونى راكس فالضواجع
  اسم واد والركوسبة فرقة بين النصارى والصابثين مض) رمست عليه انطير كتمته
  ورمست الميت وأرمسته دقته ورمسواقبرفلان اذا كتموه وسووه مع الارض ورمست
  بحجر أى رمينه والرمس تراب القبروهو فى الاصل مصدر والمرصس موضع القبر قال الشاعر
  يخفض مرمسى أوفى يفاع • تسوّت هامقى فى رأس قبرى
  والرواصر الرياح التى تنير التراب وتدفن الاثار ⁦(ديس)⁩ الريس التبختر ومنه قول
  الشاعر
  فما ان رآهم قد تدانوا • أناهم بين أرجلهم يريس
  وقدراس ر بساور يسان
  (صل اين حبس السجس بالعريك الماء المتفير وقد يس الماء بالكسم
  حكاه أبو عبيدوقولهم لا آتيك سهيس عجيس ومهيس الاوجس وصيس الليالى آى آبداقال
  الشنفرى هنالك لا أرج وحياة نسرنى • يحيس الليالى مبسلا بالجرار
  ( سدس سدس النى وسدسه جزء من ستة والسدس بالكسر من الورد فى اظما.
  الأبل أن تنقطع خسة ورد السادس وقد أسدس الرجل أى وردت ابهسدسسا وأسدس
  البعيراذا ألقى السن بعد الرباعية وذلك فى السنة النامنة وأسدس القوم صاروا-ة
  ويعضهم يقول للسدس سديس كما يقال للعشر عشير ويقال لا آتيك سديس عجيس لفة
  فى-عيس وشاة-ديس اذا أنت عليها السنة السادسة والسدس بالتصريك السن قبل البازل
  يستوى فيه المذكر والمؤنت لان الانات فى الاسنان كلها بالهاء الا السدس والسديس
  والبازل وجمع السديس سدس مشل رغيف ورغف وجع السدس سدس مشل أسد
  وأسد قال الشاءر
  قطاف كماطاف المصدّق وسطها • يخير منهافى البوازل والسدس
  وازارسديس وسداسى وسدست القوم أسدمهنم بالضم اذا أخذت سدس أ.والهم
  وأسدسمسم بالكسر اذاكنت لهم سادسا وسدوس بالفتح أبو قبيلة وسدوس
  بالضم الطيلسان الاخضر قال الافوه الاودى
  والليل كالد أماء مستشعر • من دونه لونا كاون السدوص
  وكان الاصمعى يول السدوس بالفتح الطيلان وسدوس باانم اسم رجل وقال ابن السكابى
  سدوس التى فى بنى شيبان بالفتح وسدوص الت فى طى بالضم والسندس البزيون وأنشدأ بو
  وداويتها-ق شنت حبئية • كأن عليها سندساوسدوسا
  ⁦(-مرس)⁩
