summary:
  ar: "أثر يرويه مالك عن نافع عن ابن عمر أنه كان يسافر إلى خيبر فيقصر الصلاة؛ وهو في باب ما يجب فيه قصر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.211}"
  tr: "Malik'in Nafi'den, o da İbn Ömer'den rivayet ettiği bir hadiste, Hayber'e gidip namazlarını kısalttığı belirtilmiştir; bu, namazı kısaltmanın farz olduğu haller bölümünde yer almaktadır. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd, Abdül-Razzak ve Muhammed ibn el-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.211}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’ dari Ibnu Umar, bahwa beliau biasa pergi ke Khaybar dan mempersingkat salatnya; ini terdapat dalam bab tentang situasi-situasi di mana mempersingkat salat adalah wajib. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.211}"
