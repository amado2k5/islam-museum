text: "… عَلَى الْأَعْدَاءِ، وَهْوَ لَهُمْ وَزِيرُ وَغَسَانُ الْحُمَاةُ مُوَازِرُوهُ وَحَالَفَ أَمْرَهُمْ كَذِبٌ وَزُورُ قَقَال: السُلْمَ وَنِحَكُمُ، فَصَدُّوا لذَاقُوا غِبَّ أَمْرِهِمُ وَبَالاً لِعُلٌ ثَلاَثَةٍ مِنْهُمْ بَعِيرُ وَغُردِرَ مِنْهُمُ نَخْلٌ وَدُورُ وَأُجْلُوا عَامِدِينَ لَقَيْنُقَاعٍ نصيدة لسماك اليهودي يرد على كعب بن مالك: فأجابه …"
