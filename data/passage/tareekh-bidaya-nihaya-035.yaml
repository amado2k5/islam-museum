text: "يعلمه بذلك، فأرسل إليه أن يكتب له أمانا عن أمير المؤمنين . فكتب له كتاب أمان فنزل فأمر عبد الله بتخريب المدينة التي كان متحصنا بها، وذهب شره وفيها جرت حروب مع بابك الخرمي فأسر بابك بعض أمراء الإسلام وأحد"
