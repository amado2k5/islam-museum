text: |-
  ٣٣٢
  ⁦(باب الرا)⁩
  تقول سرتى فلان مسرة وسرت هو على مالم يسم فاء-له والسرير جعه أسرة وسرر قال اللّٰه
  تعالى على سرومتقابلين الا أن بعضهم يستثقل اجتماع الضمتين مع التضعيف فيرد الاولى
  منهما الى الفتح نحفته فية ول سرروكذلك ما أشبهه من الجمع مثل ذليل وذال ونحوه والسرير
  أيضامستقرالرأس فى العفق وقد يعبر بالسرير عن الملك والنعمة قال الشاءر
  وفارق منها عيشة دغفلية • ولم يخس يوما أن يرول سريرها
  ورر الشهربالتحريك آخر ليلة منه وكذلك سراره وسراره وهو مشتق من قواهم استسر
  القمرأى خفى ليدلة السرار فربما كان ليلة وربما كان ليلتين والسرد بالكسر ماعلى
  الكمأة من القشور والطين والجمع أسرار.:-ل عنب وأعناب والسررأيضاواحد أسرار
  المكف والجبهة وهى خطوطها قال الاعشى
  فانظر الى كف وأسرارها * هل أنت ان أوعدتنى ضائرى
  وجع الجمع أسارير وفى الحديث تبرق أسارير وجهه وكذلك السراراغة فى السرووجع-
  أسرة مثل خار وأخرة قال عنترة
  بزجاجة صفراء ذات أسرة * قرنت بازهر فى الشمال مقدم
  وسر مطعنه فى سرته قال الشاءر
  نسره-م ان هم أقبلوا * وان أدبروا فهم من نسب
  أى نطعن فى سبتهم وسررت الزند أسره سرا اذا جعات فى طرفه ءويدا تدخ-له فى قلبه
  لتقدح به يقال سرزندلك فانه أسر أى أجوف وضنه قبل قناسراه أى جوفا. بينة
  السرر والاسرّ الدخيل قال لبيد
  وجدى فارس الرعشاء منهم * رئيس لا أسرّ ولا سنيد
  وعا شر حل بي أنريو كن الفرانى عبة بين المد الاسراة وود الرابى أربيرق
  والسراء الرخاء وهو نقيض الضرّاء ورجل برّسرّ أى يبرّ ويسروقوم برّون ~رون وأسروت
  الشئ كتمته وأعلنته أيضا فهو من الاضداد والوجهان جيعا يفسران فى قوله تعالى
  وأسروا القدامة لمارأوا العذاب وكذلك فى قول امرئ القيس
  ء-لى حراسالو يسرون مقتلى وكان الاصمعى يرويه لو يشرون بالشين معجمة أى يظهرون
  وأسراليه حديشا أى أفضى وأسررت اليه المودّة وبالمودة وساره فى أذنه مسارة وسرارا
  وتساروا أى تناجوا والمسرة الآلة التى يسارة فيها كالط ومار والسرسور العالم الفط-ن
  الدخار فى الامور قال الشاعر
  فانت راع بها ماعشت سرسور ⁦(سطر)⁩ السطر الصف من الشئ يقال بنى سطرا
  وغرس سطرا والسطر اللخط والكتابة وهو فى الاصل مصدر والسطر بالتحريك مثله قال جوير
  من شاء بايعته مالى وخلفته • ماتكمل التيم فى ديوانهم سطرا.
  والجمع أسطار مثل سبب وأسباب قال رؤية
  انى وأسطار سطرن سطرا ، لقائل يانصرنصر انصرا.
  نميجمع
