label: { ar: "سنن ابن ماجه 1487 — وصية أو عهد أخير، ساعة الاحتضار والوفاة", en: "Sunan Ibn Majah 1487 — a testament or parting counsel; a deathbed and last hours", ur: "سنن ابن ماجہ 1487 — وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات", es: "Sunan Ibn Majah 1487 — un testamento o consejo de despedida; un lecho de muerte y últimas horas" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى الصَّنْعَانِيُّ، أَنْبَأَنَا مُعْتَمِرُ بْنُ سُلَيْمَانَ، قَالَ قَرَأْتُ عَلَى الْفُضَيْلِ بْنِ مَيْسَرَةَ عَنْ أَبِي حَرِيزٍ، أَنَّ أَبَا بُرْدَةَ، حَدَّثَهُ قَالَ أَوْصَى أَبُو مُوسَى الأَشْعَرِيُّ حِينَ حَضَرَهُ الْمَوْتُ فَقَالَ لاَ تُتْبِعُونِي بِمِجْمَرٍ. قَالُوا لَهُ أَوَ سَمِعْتَ فِيهِ شَيْئًا قَالَ نَعَمْ مِنْ رَسُولِ اللَّهِ ـ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1487، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1487 (Chapters Regarding Funerals), that mentions a testament or parting counsel, a deathbed and last hours. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1487، جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1487 (Capítulos sobre los funerales), menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
