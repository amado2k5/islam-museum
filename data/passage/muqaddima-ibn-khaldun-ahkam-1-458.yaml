text: "… الأكثر من أهل هذا الفن على فضله بالحديث المنقول عن أبي هريرة: إِنَّ الفرائضَ ثُلُثُ العِلْمِ وإنَّها أوَّلُ مَا يُنْسَى، وفي رواية: نِصْفُ. خرجه أبو نعيم الحافظ، واحتج به أهل الفرائض بناءً على أن المراد بالفرائض فروض الوراثة. والذي يظهر …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 458، يرد فيه ذكر الفريضة والفرائض، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 1, p. 458, whose wording mentions the obligation (farida), the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 1، ص 458 کا اقتباس جس میں فریضہ اور فرائض، فرض کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Muqaddima de Ibn Khaldun, volume numérisé 1, p. 458, dont le texte mentionne l'obligation (farida), l'obligatoire (fard) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Muqaddima de Ibn Khaldun, volumen digitalizado 1, p. 458, cuyo texto menciona la obligación (farida), lo obligatorio (fard); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Haldun'un Mukaddime'sinin 1. cildinin 458. sayfasından, farz olan amelleri ve münferit yükümlülükleri (farz) anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Muqaddimah Ibnu Khaldun, Jilid 1, halaman 458, yang menyebutkan amalan wajib dan kewajiban individu (fard); dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
