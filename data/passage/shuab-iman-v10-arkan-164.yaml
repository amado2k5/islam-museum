text: "… والخرق شؤم، وإذا أراد اللّٰه بأهل بيت خيرًا أدخل عليهم باب الرفق، فإن الرفق لم يكن في شيء قط إلا زانه، وإن الخرق لم يكن في شيء قط إلا شانه، وإن الحياء من الإيمان، والإيمان في الجنة، ولو كان الحياء …"
