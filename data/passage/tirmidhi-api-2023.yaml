label: { ar: "جامع الترمذي 2023 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 2023 — what was made lawful; what is not lawful", ur: "جامع ترمذی 2023 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 2023: lo que se ha hecho lícito; lo que no lo es.", fr: "Jami' al-Tirmidhi 2023 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Cami' el-Tirmizi 2023 — Neler caizdir, neler caiz değildir", id: "Jami' al-Tirmidhi 2023 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… بِاللَّهِ شَيْئًا إِلاَّ الْمُهْتَجِرَيْنِ يُقَالُ رُدُّوا هَذَيْنِ حَتَّى يَصْطَلِحَا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَيُرْوَى فِي بَعْضِ الْحَدِيثِ \" ذَرُوا هَذَيْنِ حَتَّى يَصْطَلِحَا \". قَالَ وَمَعْنَى قَوْلِهِ \" الْمُهْتَجِرَيْنِ \". يَعْنِي الْمُتَصَارِمَيْنِ. - وَهَذَا مِثْلُ مَا رُوِيَ عَنِ النَّبِيِّ أَنَّهُ قَالَ \" لاَ يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلاَثَةِ أَيَّامٍ \"."
summary:
  ar: "حديث في جامع الترمذي، رقم 2023، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2023 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2023، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2023 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los parientes), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2023 (chapitres sur la piété et les bonnes relations familiales), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Cami' el-Tirmizi'de 2023 numaralı hadis, helal ve haram olanı belirtir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinleri sunmaktadır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2023, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian dari peramban Halal dan Haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
