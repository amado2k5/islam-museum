label: { ar: "الموطأ 2349 — مالك: حكم ولد كل ذات رحم بحسب حال أمه", en: "Muwatta 2349" }
summary:
  ar: "قال مالك: كل ذات رحم فولدها بمنزلتها. إن كانت حرة فولدت بعد عتقها فولدها أحرار، وإن كانت مدبرة أو مكاتبة أو معتقة إلى سنين أو مخدمة أو بعضها حر أو مرهونة أو أم ولد، فولد كل واحدة منهن على مثال حالها، يعتقون بعتقها ويرقون برقها. {cite:muwatta-maruf-1997 p.369}"
