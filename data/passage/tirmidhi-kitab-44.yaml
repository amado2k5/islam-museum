summary:
  ar: "القسم 44 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الأمثال عن رسول الله»، ويضم فيها النصوص من 2859 إلى 2874 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 44 of Jami' al-Tirmidhi (Chapters on Parables) in the division of the open hadith dataset the museum took its reports from: reports 2859 to 2874 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 44، عنوان «کتاب الامثال عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2859 تا 2874۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 44 de Jami' al-Tirmidhi (Capítulos sobre parábolas) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2859 al 2874, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 44 de Jami' al-Tirmidhi (Chapitres sur les paraboles), qui correspond aux hadiths 2859 à 2874 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
