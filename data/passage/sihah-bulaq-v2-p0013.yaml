text: |-
  قوله فان تأخرت عن الاسم الخ فى
  القاموس والمحركة فى أواخر
  الافعال ضمير كقمت والساكنة
  فى أواخرهاع لامة للتأنيت
  كقامت اه
  ٥٧٤
  كما قرئ قوه نمالى فبذلك فلتفرخوا قال الراجز
  قلت لبواب لديه دارها • تيذن فانى جؤها وجارها
  أراد لتأذن في_ذف اللام وكسر التاءعلى لغة من يقول أنت نع-لم وتدخلها أيضا فى أمرمالم
  يسم قاء- له فتة ول من زهى الرجل لتزه يارجل ولتمن يحاجتى قال الاخفس ادخال اللام فى
  أمر المفاطب لغة رديئة لان هذه اللام انما تدخل فى الموضع الذى لا يقدر فيه على افعل تقول
  ليقم زيد لانك لا تقدر على افعل واذا خاطبت قلت قم لائك قد استغنيت عنها والتاء فى القسم
  يدل من الواوكما أبدلوا منها فى تترى وتراث رتخمة ونجاه والواويدل من الباه يقال تالله لقد
  كان كذا ولا تدخل فى غير هذا الاسم وقد تزادانتا للمؤنت ف أول المستقبل وفى آخر الماضى
  تقول هى تفعل وفعلت فان تأخرت ءن الاسم كانت ذميرا وان تقدّمت كانت علامة وقد
  تسكون ضمير الفاعل فى قوالافعات ويستوى فيه المذكر والمؤنت قان خاطدت مذكراقحت
  وان خاطيت موتنا كسرت وقد تزاد التساء فى أنت فتصير مع الاسم كالشى الواحد من غير أن
  تكون مضافة اليه وتنسب القصيدة التى قوافيها على الناءتاوية ا الحاهحرف
  هجاء يمدويقصروح أيضاحى من مذج قال الشاعر • طلبت التأرفحكم وحاء
  وحاءزجر للابل بى على الكسر لالتقاه الساكنين وقديقصرفان أردت التفكيرتونت فقلت
  حاءوعاء أبو زيديقال للمعز خاصة حاحبت بم احيداء وحياءة اذاد عوتهما قال سيبوبه أبدلوا
  الالف باليا لشبهها بها لان قولك حاحيت اغاهوصوت بنيت منه فعلاكما أنّ رحلالوا كثر
  من قوله لابماز أن تقول لاليت تريدقات لاويدلك عسلى أنم اليست فاعلت قوله-م الحيها
  والعبعاه بالفتج كما قالوا الحاحات والهاهمات فأجرى ساحيت وعاعيت وهاهيت مجرى
  دعدعت اذ كن للتصويت وقال أبو عمر ويقال ساح بضأنك وسا يضأنك أى ادعها
  أبوزيد خاء بك معناه اعجل جعله صوتامينيا على السكسر قال ويستوى فيه الاثنان والهع
  والمؤنث وأنتدالكميت
  اذا ما شحطن الحاديين نمعتهم • مخاء بك الحق يهتفون وحيول
  وقال ابن سلمة معناه جبت وهو دعاء منه عليسه بقول بفاتبك أى بأمرك الذى حاب وخسر
  وهذا خلاف قول أبي زيد كاتى ( ا ذا اسم يشاربه الى المذكروذى بكسر الذال
  للمؤنث تقول ذى أمة اللّه فان وقفت عليه قلت ذهبها موقوفة وهبى بدل من الياه وليست
  للتأنيت وانماهى صلة كمل أبدلوا فى هنية فقالواهنيهة فان أدخلت عليه هاللتنييه قلت هذا
  زيدو هذى أمة اللّٰه وهذه أيضا بتحريك الهاء وقدا كتفوا به عنه فان صغرت ذاقلت ذيا
  بالنتح والتشديد لانك تقلب ألف ذاباء لمكان الياءقبلها قتدغمها فى الثانية وتريد فى آخره ألفا
  لتفرق بين المبهم والمعرب وذيان فى التنفية وتصغير هذاهذيا ولا يصغر ذى لله ونث وانما يصغرتا
  وقدا كتفوا به عنه وان ثنيت ذاقلت ذان لانه لا يصح اجتماعهما لسكونم مافتسقط احدى
  الالفين فن أسقط ألف ذاقرأان هذين اساحران فأعرب ومن أسقط ألف التثفية قرأ ان هذان
  لساحران لان الفذالا يقع فيها اعراب وقد قيل انها على لغة بلهرت بن كعب والجع أولاه
  من غير لفظ_← فان خاطبت جئت بالكاف فقات ذا وذلك فاللام زائدة والكاف للخطااب
  وقيما
