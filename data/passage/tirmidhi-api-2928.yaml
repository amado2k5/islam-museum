label: { ar: "جامع الترمذي 2928 — كتاب القراءات، قراءات القرآن", en: "Jami' al-Tirmidhi 2928 — the Book of the Readings; the readings of the Qur'an", ur: "جامع ترمذی 2928 — کتاب القراءات، قرآن کی قراءتیں", es: "Jami' al-Tirmidhi 2928 — El Libro de las Lecturas; las lecturas del Corán" }
text: "… أَنَسِ بْنِ مَالِكٍ إِلاَّ مِنْ حَدِيثِ هَذَا الشَّيْخِ أَيُّوبَ بْنِ سُوَيْدٍ الرَّمْلِيِّ. وَقَدْ رَوَى بَعْضُ أَصْحَابِ الزُّهْرِيِّ هَذَا الْحَدِيثَ عَنِ الزُّهْرِيِّ أَنَّ النَّبِيَّ وَأَبَا بَكْرٍ وَعُمَرَ كَانُوا يَقْرَءُونَ ⁦(مَالِكِ يَوْمِ الدِّينِ )⁩. وَقَدْ رَوَى عَبْدُ الرَّزَّاقِ عَنْ مَعْمَرٍ عَنِ الزُّهْرِيِّ عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ أَنَّ النَّبِيَّ وَأَبَا بَكْرٍ وَعُمَرَ كَانُوا يَقْرَءُونَ ⁦(مَالِكِ يَوْمِ الدِّينِ )⁩."
summary:
  ar: "حديث في جامع الترمذي، رقم 2928، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 2928 (Chapters on Recitation), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 2928، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2928 (Capítulos sobre la recitación), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
