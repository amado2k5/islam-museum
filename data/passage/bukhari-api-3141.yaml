text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يُوسُفُ بْنُ الْمَاجِشُونِ، عَنْ صَالِحِ بْنِ إِبْرَاهِيمَ بْنِ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ بَيْنَا أَنَا وَاقِفٌ، فِي الصَّفِّ يَوْمَ بَدْرٍ فَنَظَرْتُ عَنْ يَمِينِي، وَشِمَالِي، فَإِذَا أَنَا بِغُلاَمَيْنِ، مِنَ الأَنْصَارِ حَدِيثَةٍ أَسْنَانُهُمَا، تَمَنَّيْتُ أَنْ أَكُونَ بَيْنَ أَضْلَعَ مِنْهُمَا، فَغَمَزَنِي أَحَدُهُمَا فَقَالَ يَا عَمِّ، هَلْ تَعْرِفُ أَبَا جَهْلٍ قُلْتُ نَعَمْ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3141، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3141 (One-fifth of Booty to the Cause of Allah (Khumus)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3141، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3141 (Una quinta parte del botín para la causa de Alá (Khumus)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
