label: { ar: "جامع الترمذي 2701 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 2701 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 2701 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 2701 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 2701 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا سَعِيدُ بْنُ عَبْدِ الرَّحْمَنِ الْمَخْزُومِيُّ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، قَالَتْ إِنَّ رَهْطًا مِنَ الْيَهُودِ دَخَلُوا عَلَى النَّبِيِّ فَقَالُوا السَّامُ عَلَيْكَ. فَقَالَ النَّبِيُّ \" عَلَيْكُمْ \". فَقَالَتْ عَائِشَةُ فَقُلْتُ بَلْ عَلَيْكُمُ السَّامُ وَاللَّعْنَةُ. فَقَالَ النَّبِيُّ \" يَا عَائِشَةُ إِنَّ اللَّهَ يُحِبُّ الرِّفْقَ فِي الأَمْرِ كُلِّهِ \". قَالَتْ عَائِشَةُ أَلَمْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2701، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2701 (Chapters on Seeking Permission), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 2701، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2701 (Capítulos sobre la búsqueda de permiso), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2701 (Chapitres sur la demande de permission), mentionne les nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, religions, sectes et peuples non musulmans."
