label: { ar: "صحيح مسلم 1949 — أثر من الآثار المحفوظة", en: "Sahih Muslim 1949 — a relic kept after its owner", ur: "صحیح مسلم 1949 — محفوظ آثار و تبرکات", es: "Sahih Muslim 1949 — una reliquia conservada después de su dueño.", fr: "Sahih Muslim 1949 — une relique conservée après son propriétaire" }
text: "… الرِّقَاعِ قَالَ كُنَّا إِذَا أَتَيْنَا عَلَى شَجَرَةٍ ظَلِيلَةٍ تَرَكْنَاهَا لِرَسُولِ اللَّهِ - قَالَ - فَجَاءَ رَجُلٌ مِنَ الْمُشْرِكِينَ وَسَيْفُ رَسُولِ اللَّهِ مُعَلَّقٌ بِشَجَرَةٍ فَأَخَذَ سَيْفَ نَبِيِّ اللَّهِ فَاخْتَرَطَهُ فَقَالَ لِرَسُولِ اللَّهِ أَتَخَافُنِي قَالَ \" لاَ \". قَالَ فَمَنْ يَمْنَعُكَ مِنِّي قَالَ \" اللَّهُ يَمْنَعُنِي مِنْكَ \". قَالَ فَتَهَدَّدَهُ أَصْحَابُ رَسُولِ اللَّهِ فَأَغْمَدَ السَّيْفَ وَعَلَّقَهُ - …"
summary:
  ar: "حديث في صحيح مسلم، رقم 1949، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 1949 (The Book of Prayer - Travellers), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 1949، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 1949 (El Libro de la Oración - Viajeros), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim n° 1949 (Le Livre de la prière – Guide du voyageur) mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des successions, des reliques et des tombes."
