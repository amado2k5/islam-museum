text: "… الأئمةِ لم يعتادوا كلمة هاتِ بل كلمة خُذْ، فانظروا كيف أني أنقِذُهُ سريعاً. ثم تقدِّمَ إلى الإمام وقال له: يا بكر أفندي خُذ يدي، وحالاً قال له الإمام : اللَّهُ يرضى عليك يا أخي. وأمسك بعضدِهِ فخرج به إلى ساحل …"
summary:
  ar: "انزلق الإمام إلى الحوض في بركة، وصاح الحاضرون «هات يدك» فلم يستجب، فقال جحا إن الأئمة لم يعتادوا كلمة هات بل كلمة خذ، ونادى «يا بكر أفندي خذ يدي»، فنجا. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  en: "At a pool, the imam slips into the basin; onlookers shout 'give me your hand' but he does not respond; Juha says imams are used to hearing 'take', not 'give', and calls out 'Bakr Efendi, take my hand', which saves him. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  ur: "ایک تالاب پر امام حوض میں پھسل کر گر گیا، لوگ چلائے «اپنا ہاتھ دو» مگر اس نے کوئی جواب نہ دیا، جحا نے کہا کہ اماموں کو «دو» کی نہیں «لو» کی آواز سننے کی عادت ہے، اور پکارا «بکر آفندی، میرا ہاتھ لو»، تو وہ بچ گیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  fr: "Près d'un bassin, l'imam glisse dans l'eau ; les badauds crient « donne ta main » mais il ne réagit pas ; Juha dit que les imams sont habitués à entendre « prends » et non « donne », et lance « Bakr Efendi, prends ma main », ce qui le sauve. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  es: "En un estanque, el imán resbala y cae al agua; los presentes gritan «dame la mano» pero él no responde; Juha dice que los imanes están acostumbrados a oír «toma» y no «dame», y llama «Bakr Efendi, toma mi mano», con lo que lo salva. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
  tr: "İmam bir havuza düştü ve orada bulunanlar \"Elini ver!\" diye bağırdılar. Ama o cevap vermedi. Cüha, imamların \"vermek\" kelimesine değil, \"almak\" kelimesine alışkın olduklarını söyledi ve \"Ey Bekr Efendi, elimi tut!\" diye seslendi ve kurtuldu. {cite:juha-nawadir-kubra-djuwaydi s. 155}"
  id: "Imam itu terpeleset dan jatuh ke dalam kolam, dan orang-orang yang hadir berteriak, \"Ulurkan tanganmu!\" Tetapi dia tidak menjawab. Juha berkata bahwa para imam tidak terbiasa dengan kata \"memberi\" melainkan \"mengambil,\" dan dia berseru, \"Wahai Bakr Effendi, pegang tanganku!\" dan dia pun selamat. {cite:juha-nawadir-kubra-djuwaydi p. 155}"
