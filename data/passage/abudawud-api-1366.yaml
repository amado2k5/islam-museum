label: { ar: "سنن أبي داود 1366 — الأب والأبوة", en: "Sunan Abi Dawud 1366 — the father and fatherhood", ur: "سنن ابی داؤد 1366 — باپ اور والدیت", es: "Sunan Abi Dawud 1366 — El padre y la paternidad", fr: "Sunan Abi Dawud 1366 — Le père et la paternité" }
text: "حَدَّثَنَا الْقَعْنَبِيُّ، عَنْ مَالِكٍ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي بَكْرٍ، عَنْ أَبِيهِ، أَنَّ عَبْدَ اللَّهِ بْنَ قَيْسِ بْنِ مَخْرَمَةَ، أَخْبَرَهُ عَنْ زَيْدِ بْنِ خَالِدٍ الْجُهَنِيِّ، أَنَّهُ - قَالَ - لأَرْمُقَنَّ صَلاَةَ رَسُولِ اللَّهِ اللَّيْلَةَ، قَالَ : فَتَوَسَّدْتُ عَتَبَتَهُ أَوْ فُسْطَاطَهُ، فَصَلَّى رَسُولُ اللَّهِ رَكْعَتَيْنِ خَفِيفَتَيْنِ، ثُمَّ صَلَّى رَكْعَتَيْنِ طَوِيلَتَيْنِ طَوِيلَتَيْنِ طَوِيلَتَيْنِ، ثُمَّ صَلَّى رَكْعَتَيْنِ وَهُمَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1366، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1366 (Prayer (Kitab Al-Salat): Voluntary Prayers), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1366، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1366 (Oración (Kitab Al-Salat): Oraciones voluntarias), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 1366 (La Prière (Kitab Al-Salat): Prières surérogatoires), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
