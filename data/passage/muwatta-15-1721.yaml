label: { ar: "الموطأ 1721 — هشام بن عروة عن أبيه: كان الرجل إذا طلق امرأته ثم ارتجعها قبل انقضاء عدتها كان ذلك له، فنزلت آية الطلاق مرتان، فاستقبل الناس الطلاق جديدا", en: "Muwatta 1721" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أنه قال كان الرجل إذا طلق امرأته ثم ارتجعها قبل أن تنقضي عدتها، كان ذلك له، وإن طلقها ألف مرة. فعمد رجل إلى امرأته فطلقها، حتى إذا شارفت انقضاء عدتها راجعها، ثم طلقها، ثم قال لا والله لا آويك إلي ولا تحلين أبدا، فأنزل الله تبارك وتعالى آية البقرة الطلاق مرتان، فاستقبل الناس الطلاق جديدا من يومئذ، من كان طلق منهم أو لم يطلق. {cite:muwatta-maruf-1997 p.103}"
