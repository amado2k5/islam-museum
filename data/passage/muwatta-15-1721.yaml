label: { ar: "الموطأ 1721 — هشام بن عروة عن أبيه: كان الرجل إذا طلق امرأته ثم ارتجعها قبل انقضاء عدتها كان ذلك له، فنزلت آية الطلاق مرتان، فاستقبل الناس الطلاق جديدا", en: "Muwatta 1721", es: "Muwatta 1721", fr: "Muwatta 1721", ur: "موطا 1721", tr: "El-Muvatta 1721 — Hişam ibn Urve, babasından rivayetle: Bir erkek karısını boşadıktan sonra, bekleme süresi dolmadan onu geri alırsa, bu onun için caizdi. Sonra, iki defa boşanma ile ilgili ayet nazil oldu ve insanlar boşanmayı yeniden değerlendirmeye başladılar.", id: "Al-Muwatta 1721 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Jika seorang pria menceraikan istrinya dan kemudian mengambilnya kembali sebelum masa iddahnya berakhir, maka hal itu diperbolehkan baginya. Kemudian ayat tentang perceraian yang diulang dua kali diturunkan, sehingga orang-orang mulai mempertimbangkan perceraian kembali." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أنه قال كان الرجل إذا طلق امرأته ثم ارتجعها قبل أن تنقضي عدتها، كان ذلك له، وإن طلقها ألف مرة. فعمد رجل إلى امرأته فطلقها، حتى إذا شارفت انقضاء عدتها راجعها، ثم طلقها، ثم قال لا والله لا آويك إلي ولا تحلين أبدا، فأنزل الله تبارك وتعالى آية البقرة الطلاق مرتان، فاستقبل الناس الطلاق جديدا من يومئذ، من كان طلق منهم أو لم يطلق. {cite:muwatta-maruf-1997 p.103}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından rivayet ederek şöyle demiştir: “Bir adam karısını boşadıktan sonra, bekleme süresi dolmadan onu geri alırsa, bin kere boşasa bile bu ona caizdir. Sonra bir adam karısına gitti ve onu boşadı, bekleme süresi dolmak üzereyken onu geri aldı, sonra tekrar boşadı ve sonra dedi ki: ‘Allah'a yemin ederim ki seni geri almayacağım ve bir daha asla bana helal olmayacaksın.’ Bunun üzerine Allah, yüce ve mübarek olan, Bakara Suresi'nde şu ayeti indirdi: ‘Boşanma iki keredir.’ O günden itibaren insanlar, daha önce boşanmış olsun ya da olmasın, boşanmayı yeni bir kavram olarak görmeye başladılar.” {cite:muwatta-maruf-1997 s.103}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, bahwa beliau berkata: “Jika seorang laki-laki menceraikan istrinya dan kemudian mengambilnya kembali sebelum masa iddahnya berakhir, itu diperbolehkan baginya, meskipun ia menceraikannya seribu kali. Kemudian seorang laki-laki mendatangi istrinya dan menceraikannya, dan ketika masa iddahnya hampir berakhir, ia mengambilnya kembali, kemudian menceraikannya lagi, dan kemudian berkata, ‘Demi Allah, aku tidak akan mengambilmu kembali, dan engkau tidak akan pernah halal bagiku lagi.’ Maka Allah, Maha Berkah dan Maha Tinggi, menurunkan ayat dalam Surah Al-Baqarah: ‘Cerai itu dua kali.’ Sejak hari itu, orang-orang mulai menganggap perceraian sebagai konsep baru, baik mereka pernah bercerai sebelumnya atau tidak.” {cite:muwatta-maruf-1997 p.103}"
