text: |-
  ٦٤,٠
  باب التا
  (هيثn
  تنزوقلوب النامر فى أنجائها والاستنجاث اتصدى لنتى ⁦( نفت )⁩ النفت
  شبيه بالنفخ وهو أقل من التقل وقد نفت الراقى ينفث ويتقث والنفاثات فى العقد السواحر
  والحية تنفت السم اذا نكزت وفى المثل لابد للمصدور أن ينفت والنفائة بالضم مانفنته من
  فيك يقال لوسألنى نفائة سوالكما أعطيته وهو مايقى منه فى فيك فنفنته وبنونضائة قوم
  من العرب ودم تفيث اذانفئه الجرح ⁦(نقث)⁩ يقمال خرجت آنقت بالضم أى أسرع
  وكذلك التنقيث الانتقاث نكث الذكث بالكسر أن تنقض أخلاق الا كسية
  والاخبية لتغزل ثانية والنسكت أيضااسم رجل وهو بشير بن النسكث ونمكث العهد والحبل
  فانت كث أى نقضه فانتة ض والنكيثة خطة صعبة يشكث فيها القوم قال طارفة
  -تى يك عهد للنكيئة أشهد وفلان شديد النكيثة أى النفسر وبلغ فلان ن.كيشة بعيره
  أى أقصى مجهوده فى السيروقال فلان قولا لانسكينة فيه أى لاخلف فيه وطلب فلان
  حاحة ثم اتكن لاخرى أى انصرف اليها
  صل الداد رث الميراث أصلد موراث انقلبت الواويا لمكسرة ما قبلها
  والتراث أصل التاءفيه وا وتقول ورثت أب وورتت الشئء من ابى أرنه بالكسر فيه-ماورثا
  ووراثة وإرثا الالف منقلبة من الواو ورثة الهاءعون من الواو واغماسقعات الواومن
  لمستقبل لوقوعها بيزياء وكسرة وهما متجانسان والواومضادتهما فحذفت لا كتنافهما اياها
  تم جعل حكمها مع الالف والتاء والنون كذلكْ لانهنّ مبدلات منها والياءهى الاصل يدل على
  ذلك أن فعلت وفعانا وفعلت مينيات على فعسل ولم تسقط الواومن يوجل لوقوعها بينيا.
  وقتحة ولم تسقط الياء من يعر وييسر لتقوّى احدى الياءين بالاخرى وأماسة وطهامن يطأ
  ويسع فلعلة أخرى ذكرناها فى باب الهه زوذلك لا يوجب فادماقلنا. لانه مجوز تمائل
  الحكسمين مع اختلاف العلتين وتقول أورته الشى أبوه وهم ورثة فلان وورنه توريشا أى
  أدخل فى ماله على ورثته وتو أرتوه كابراعن كابر ( طث الوطث الضرب الشديد
  بالرجل على الارض لغة فى الوطس أوائفة وعث الوعث المكان السه-ل الكم
  الدهس تغيب فيم الاقدام ويشق على من يمشى ف.ه وأوعت القوم أى وقعوا فى الوءث
  ويقال أيضا للعظم الممكسوروعث وامرأة وعمة أيضا كثيرة اللحم ووعماء السفر مشقته
  ورجل موعوث ناقس الحسب ابن السكيت أوعت فى ماله أى أسرف ات أصابنا
  ولث من مطرأى قليل منه والولث العهدمن القوم يقع من غير قصد أويكون غير مؤكد
  يقال واث له عقدا ومنه قول عررضى اللّٰه عنه للجاثليق لولاولث عقد لضربت عنقك
  وواثه بالعصايلثه ولنا أى ضربه عن أبى عمرو
  ⁦( صل ل اء هبت)⁩ الهبيئة الاختلاط فى القول ويقال الامر الشديد
  نث الهنهذة الاختلاط بقال هنهنت السحابة بقطرها وتلجها اذا أرسلته بسرعة
  وهنهث الوالى ظلم هليث) الهلبون مثال الفردوس الاسق ويقال الفدم يث
  أبوزيد هنت ه هيئا وهينانا اذا أعطيته شيتايسيرا والهيث الحركة مثل الهيس قال الاصمعى
  الهبئة الجماعة من الناس مثل الهيئة
  ماب
