label: { ar: "الموطأ 806 — ابن عباس: خرج النبي إلى مكة عام الفتح في رمضان فصام حتى بلغ الكديد ثم أفطر، فأفطر الناس", en: "Muwatta 806" }
summary:
  ar: "أول حديث في باب ما جاء في الصيام في السفر. يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن عبد الله بن عباس، أن رسول الله خرج إلى مكة عام الفتح في رمضان فصام حتى بلغ الكديد ثم أفطر، فأفطر الناس، وكانوا يأخذون بالأحدث فالأحدث من أمر رسول الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وسويد، والقعنبي عند البخاري (1944) وأبي داود، والتنيسي عند البخاري (1944)، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم، ويحيل على التمهيد (9/64). {cite:muwatta-maruf-1997 p.395}"
