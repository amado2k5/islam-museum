label: { ar: "الموطأ 806 — ابن عباس: خرج النبي إلى مكة عام الفتح في رمضان فصام حتى بلغ الكديد ثم أفطر، فأفطر الناس", en: "Muwatta 806", es: "Muwatta 806", fr: "Muwatta 806", ur: "موطا 806", tr: "El-Muvatta 806 — İbn Abbas: Peygamberimiz fetih yılında Ramazan ayında Mekke'ye gitti ve Kadid'e varıncaya kadar oruç tuttu, sonra orucunu açtı ve insanlar da oruçlarını açtılar.", id: "Al-Muwatta 806 — Ibnu Abbas: Nabi pergi ke Mekah pada tahun penaklukan pada bulan Ramadan, dan beliau berpuasa hingga sampai di Al-Kadid, kemudian beliau berbuka puasa, dan orang-orang pun berbuka puasa." }
summary:
  ar: "أول حديث في باب ما جاء في الصيام في السفر. يرويه مالك عن ابن شهاب عن عبيد الله بن عبد الله بن عتبة بن مسعود عن عبد الله بن عباس، أن رسول الله خرج إلى مكة عام الفتح في رمضان فصام حتى بلغ الكديد ثم أفطر، فأفطر الناس، وكانوا يأخذون بالأحدث فالأحدث من أمر رسول الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وسويد، والقعنبي عند البخاري (1944) وأبي داود، والتنيسي عند البخاري (1944)، والشافعي، ويحيى بن يحيى النيسابوري عند مسلم، ويحيل على التمهيد (9/64). {cite:muwatta-maruf-1997 p.395}"
  tr: "Yolculukta oruç tutma bölümündeki ilk hadis. Malik'in İbn Şihab'tan, o da Ubeydullah ibn Abdullah ibn Utbe ibn Mes'ud'dan, o da Abdullah ibn Abbas'tan rivayet ettiğine göre, Allah Resulü Fetih yılında Ramazan ayında Mekke'ye gitti ve Kadid'e varıncaya kadar oruç tuttu, sonra orucunu bozdu ve insanlar da oruçlarını bozdular. Onlar da Allah Resulü'nün en son uygulamasını takip ettiler. Editör, bu hadisin Malik'ten Ebu Mus'ab tarafından, onun aracılığıyla da İbn Hibban, el-Baghawi, Suwayd, el-Ka'nabi (Buhari, 1944), Ebu Davud, el-Tunisi (Buhari, 1944), el-Şafiî ve Yahya ibn Yahya el-Naysaburi (Müslim) tarafından rivayet edildiğini belirtiyor. Ayrıca el-Tamhid'e (9/64) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.395}"
  id: "Hadits pertama dalam bab tentang puasa saat bepergian. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Ubaydullah ibn Abdullah ibn Utbah ibn Mas'ud, dari Abdullah ibn Abbas, bahwa Rasulullah SAW pergi ke Mekah pada tahun Penaklukan pada bulan Ramadan dan berpuasa hingga sampai di al-Kadid, kemudian beliau berbuka puasa, dan orang-orang pun berbuka puasa. Mereka mengikuti kebiasaan terbaru Rasulullah SAW. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Ibnu Hibban, al-Baghawi, Suwayd, al-Qa'nabi (sebagaimana dicatat oleh al-Bukhari, 1944), Abu Dawud, al-Tunisi (sebagaimana dicatat oleh al-Bukhari, 1944), al-Shafi'i, dan Yahya ibn Yahya al-Naysaburi (sebagaimana dicatat oleh Muslim). Dia merujuk pada al-Tamhid (9/64). {mengutip:muwatta-maruf-1997 hal.395}"
