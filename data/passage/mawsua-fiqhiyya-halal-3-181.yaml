text: "… مسألة المحترف - حيث كان الظاهر أن ما مرمن تفقهات المشايخ لا من منقول المذهب - أن يقال: إذا كان عنده ما يكفيه وعياله لا يحل له الفطر، لأنه يحرم عليه السؤال من الناس فالفطر أولى، وإلا فله العمل بقدر …"
summary:
