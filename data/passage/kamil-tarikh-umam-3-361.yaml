text: "ذكر من ملك من الروم بعد رفع المسيح وكان النبي علية والمسلمون قد ساءهم ظفر الفرس أولاً بالروم لأن الروم أهل كتاب، وفرح الكفار لأن المجوس أميون مثلهم، فلما نزلت هذه الآيات راهن أبو بكر الصديق أبي بن خلف على …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 361، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
