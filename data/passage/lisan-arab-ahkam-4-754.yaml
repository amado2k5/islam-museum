text: "… ومَنْدُوبٌ : فرس أَبي طلعة زيد بن سَهْل، رَكِبَه سيدُنا رسولُ اللّٰه،، فقال فيه : إنْ وجَدْناه لَبَحْراً. وفي الحديث : كان له فرس يقال له المَنْدُوبُ أَي المطلوب، وهو من النَّدَبِ، قوله وهما جداه مثله في الصحاح وقال الصاغائي …"
