label: { ar: "مسلم 2587 — المستبان ما قالا فعلى البادي", en: "Muslim 2587 — Insults exchanged: the initiator bears them unless wronged", es: "Musulmán 2587 — Insultos intercambiados: el iniciador los soporta a menos que sea agraviado.", fr: "Muslim 2587 — Échange d'insultes: celui qui les a lancées les supporte, sauf s'il a été lésé.", ur: "مسلم 2587 - توہین کا تبادلہ: ابتدا کرنے والا ان کو برداشت کرتا ہے جب تک کہ ظلم نہ ہو۔", tr: "Müslim 2587 — Hakaret eden iki kişiden ne derlerse desinler, günah hakareti başlatanın üzerindedir.", id: "Muslim 2587 — Dua orang yang saling menghina, apa pun yang mereka ucapkan, dosanya adalah pada orang yang memulainya." }
text: "قال رسول الله: «المستبان ما قالا فعلى البادي ما لم يعتد»"
summary:
  ar: "رواية أبي هريرة في باب تحريم الكلام في كتاب البر من صحيح مسلم؛ قاعدة عدل صغيرة توزع إثم الشتيمة على بادئها ما لم يعتد الآخر."
  tr: "Sahih Müslim'deki Salihlik Kitabı'nın \"Konuşmanın Yasaklanması\" bölümünde Ebu Hurayra'nın rivayetine göre; hakaretin günahı, diğer kişi karşılık vermedikçe, hakareti başlatanın üzerindedir."
  id: "Riwayat Abu Hurairah dalam bab tentang larangan berbicara dalam Kitab Kebajikan di Sahih Muslim; sebuah aturan kecil tentang keadilan yang membagi dosa penghinaan kepada orang yang memulainya, kecuali jika orang lain membalas."
