text: "… - ويقال: حَبِيبَة بنت قالت: قالت لي معاذة الغفارية: كنت أنيسا خَارِجَة بن زيد بن أبي زُهَيْر الأنصارية. تقدّم ذكرها في حبيبة. برسول اللّٰه علا، أخرج معه في الأسفار، أقوم على أخرجها أبو عمر. المرضى وأُداوي الجرحى، فدخلت على - …"
