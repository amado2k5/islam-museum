label: { ar: "الموطأ 2779 — ابن عمر: أمر النبي بقتل الكلاب", en: "Muwatta 2779", es: "Muwatta 2779", fr: "Muwatta 2779", ur: "موطا 2779", tr: "El-Muvatta 2779 — İbn Ömer: Peygamber köpeklerin öldürülmesini emretti.", id: "Al-Muwatta 2779 — Ibn Umar: Nabi memerintahkan pembunuhan anjing" }
summary:
  ar: "يروي مالك عن نافع، عن عبد الله بن عمر أن رسول الله أمر بقتل الكلاب. ويذكر المحقق طرق الحديث عن مالك ومن رواه عنه، ويذكر قول ابن عبد البر أن الحديث محفوظ من حديث نافع كما هو محفوظ من حديث عبد الله بن دينار. {cite:muwatta-maruf-1997 p.562}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ederek, Allah Resulü'nün köpeklerin öldürülmesini emrettiğini nakletmiştir. Araştırmacı, bu hadisin Malik'ten ve ondan nakledenlerden gelen isnad zincirlerini zikretmekte ve İbn Abd al-Barr'ın hadisin Nafi'nin rivayetinden olduğu gibi Abdullah ibn Dinar'ın rivayetinden de korunduğuna dair ifadesini aktarmaktadır. {cite:muwatta-maruf-1997 s.562}"
  id: "Malik meriwayatkan dari Nafi', dari Abdullah ibn Umar, bahwa Rasulullah SAW memerintahkan pembunuhan anjing. Peneliti menyebutkan sanad hadits ini dari Malik dan orang-orang yang meriwayatkannya darinya, dan ia menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits ini terpelihara dari riwayat Nafi' sebagaimana terpelihara dari riwayat Abdullah ibn Dinar. {cite:muwatta-maruf-1997 p.562}"
