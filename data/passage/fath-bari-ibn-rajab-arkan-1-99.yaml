text: "… الإيمانُ كالقميصِ يلبسُهُ الإنسانُ تارةٌ وينزعُهُ أخرَى، وفي الحديثِ: لا يزني الزاني حينَ يزني وهو مؤمنٌ يُنزعُ منه سربالُ الإيمانِ. سبق ص، وهو متفق عليه دون قوله: ينزع منه سربال الإيمان. وانظر تعظيم قدر الصلاة،."
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 99، يذكر ما يرتفع معه الإيمان حين الفعل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 99, that mentions what faith is lifted by at the moment of the act; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 99 کا اقتباس جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 99, que menciona qué fortalece la fe en el momento del acto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 1, p. 99) mentionnant la foi qui est éveillée au moment de l'acte; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. cildinin 99. sayfasında, amel yoluyla imanı yükselten şeylerden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 1, halaman 99, menyebutkan apa yang meninggikan iman melalui perbuatan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
