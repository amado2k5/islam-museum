text: "… الإيمانُ كالقميصِ يلبسُهُ الإنسانُ تارةٌ وينزعُهُ أخرَى، وفي الحديثِ: لا يزني الزاني حينَ يزني وهو مؤمنٌ يُنزعُ منه سربالُ الإيمانِ. سبق ص، وهو متفق عليه دون قوله: ينزع منه سربال الإيمان. وانظر تعظيم قدر الصلاة،."
