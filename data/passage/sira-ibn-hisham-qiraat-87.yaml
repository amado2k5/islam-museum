text: "… وَإِذَارِي عليَّ مِنْ بَيْنِ أَصْحَابِي. انظر السير والمغازي ص. حَرْبُ الْفِجَارِ قال ابن هشام : فَلَمَّا بَلَغَ رَسُولُ اللّهِ ول لي أُرْبَعَ عَشْرَةَ سَنَةً، أو خَمْسَ عَشْرَةَ سَنةً، فيما حدثني أبو عُبَيْدة النحويُّ، عن أبي عمرو بن العلاء؛ هاجَتْ حربُ …"
summary:
