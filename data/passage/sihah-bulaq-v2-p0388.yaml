text: |-
  * اسعل ح.
  .T٩٩
  فرجل) الفرجل معروف والمع سفارج ال للات الشئ أسله سلا يقال
  -كلت السيف واستالته بمعنى وأتيناهم عندال-لذ أى عند استلال السيوف قال الراجز
  هذاسلاح كامل وأله • وذوغرارين سريع السله.
  والسلة السرقة يقال لى فى بى فلان سلة وفرس شديد السلة وهى دفعة. فى سباقه يقال
  خرجت سلمته على الجبل وسلة الجبز معروفة والسال المسيل الضيق فى الوادى ويجعه سلان
  مثل حاروحوران والمسلة بالكسر واحدة المسال وهى الابر العظام وسلول قبيلة من هوازن
  وهم بنومرّة بن صعصعة بنْ معاوية بى بكر بن هوازن وساول اسم أقهم نسبوا اليها منهم عبد
  اللّٰه بن همام الشاءر الساولى والسليل الولد والانى سليلة وقال
  سليسلة أفراس تخللها بغل • قال الاسمعى اذا وضعت الناقة فوادها ساعة تضعه سليل
  قبل أن يعلم أدكرهوام أننى والسليل الوادى الواسع ينبت السلم والسمر يقال سليل من
  -عركايقال غال من سلم قال زهير
  كأن عين وقدسال السليل بهم • وجيرة ماهم لوأنهم أحم
  ويقال سليلة من شعر لما استلّ من ضريبته وهى شيينفش منه ثم يطوى ويدمج طو الاطول
  كل واحدة ت ومن ذراع فى غلظ أسلة الذراع ويشة ثم تسل منه المرأة الشئ بعد الشئ
  فتغزله والسلال بالضم السلّ يقال أ-لدا للّه فهو مسلول وهو من الثواذ وسلالة الشئ
  ما اسئلّ منه والنطفة سلالة الانسان وأسلّ يسلّ اسلالا أى سرق وإلاسلال الرشوة
  والسرقة وفى الحديث لا اغلال ولا اسلال وهذايحتمل الرشوة والسرقة جميعا وائسل من
  ينهم أى خرج وفى المثل رمتنى بداتها واثات ونسال مثله وتسلسل الماء فى الحلق جرى
  وسللته أناصبيته فيه وماعساسل وسد ال سهل الدخول فى الحاق لعذوشه وصفلئه
  والسلاسل بالضم مثله ويقال معنى يتسلسل أنه اذا حرى أوضر ه الريح إصير كالساسلة
  قال أوس* غدير جرت فى متنه الرج سدسل• وشئ مسلمل متصل بعضه ببعض و منه سلسلة
  لحديد وسلسلة البرق ما استطال منه فى عرض السهاب قال أيو عبيد السلاسل رمل ينعقد
  يعضه على يعضر ويتقاد ( مل السمل انطلق من النياب يقال توب أسمال كما فالوارمح
  أقمادوبرهة أعشار والسملة أيضا الماء القليل ييرق فى أسفل الإناه وغيرم مثل الثميلة والجمع
  سمل قال ابن أحر مثل الوقائع فى أنصافها السمل * وسهول عن الاصمحى قالَ ذوارمّة
  على حيريات كأن عيونها • قلاص الصمالم بيدق الاسمولها
  وأسمال عن أبى عرو وأنشد • يترله أسمال الحياض يبساء والسملة بالضم مش-ل السملة
  وأبو سمال كنية رجل من نى أسد وسمل العين فقؤها يقال سملت عينه تسم ل اذافيت
  بحديدة محماة قال أعرابيد فقأجد ناعيز رحل قسميناي سمال وسملت بين القوم سملا
  وأسملت اذا أصبلحت بينهم قال السكميت
  وينأى قعودهم فى الامور عمن يسم مومن يسمل
  أى سعدعايتهم عن يدارى ويداهن والسامل الساعى فى صلاح معاشه وسمات الخوض
  اذا نقيته من الهأة والطين وسهل الثوب سمولا وأسمل إذا أخلق والمدوملة الفنجاتة الصغيرة
  قوله وقال فى نسخة وقااتة
  وهل هند الامهرة عربية
  اه وقوله تخللها فى تسخة تعالها
  بالحاء المهملة وفى أخرى بالجيم
  (%ه
