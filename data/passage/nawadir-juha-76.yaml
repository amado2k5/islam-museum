text: "… ركوبي مقلوباً أَولَى ذهبَ لإِلقاءِ الدرسِ في الجامع، ومعَه مُريدُوهُ وتلاميذُهُ فركِبَ حمارَه مقلوباً. فتعجّبوا منه، وقالَ له أحدُهم: لماذا تركب هكذا يا سيدي؟"
summary:
  ar: "ركب جحا حماره معكوسًا وهو ذاهب ليدرّس في المسجد، فلما سُئل عن السبب قال إن ذلك أفضل لركوبه. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  en: "Going to teach in the mosque, Juha rides his donkey backwards; asked why, he says it is better for his riding. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  ur: "مسجد میں پڑھانے جاتے ہوئے جحا اپنے گدھے پر الٹا بیٹھ گیا؛ وجہ پوچھی گئی تو اس نے کہا کہ میری سواری کے لیے یہی بہتر ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  fr: "En allant enseigner à la mosquée, Juha monte son âne à l'envers ; interrogé sur la raison, il répond que c'est mieux pour sa monte. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  es: "Yendo a enseñar a la mezquita, Juha monta su burro al revés; al preguntarle por qué, dice que es mejor para su forma de montar. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
