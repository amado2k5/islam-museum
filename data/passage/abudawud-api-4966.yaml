label: { ar: "سنن أبي داود 4966 — الأب والأبوة", en: "Sunan Abi Dawud 4966 — the father and fatherhood", ur: "سنن ابی داؤد 4966 — باپ اور والدیت", es: "Sunan Abi Dawud 4966 — El padre y la paternidad", fr: "Sunan Abi Dawud 4966 — Le père et la paternité", tr: "Sunan Abi Dawud 4966 — Baba ve Babalık", id: "Sunan Abi Dawud 4966 — Sang Ayah dan Peran Ayah" }
text: "… يَكْتَنِي بِكُنْيَتِي وَمَنْ تَكَنَّى بِكُنْيَتِي فَلاَ يَتَسَمَّى بِاسْمِي \". قَالَ أَبُو دَاوُدَ وَرَوَى بِهَذَا الْمَعْنَى ابْنُ عَجْلاَنَ عَنْ أَبِيهِ عَنْ أَبِي هُرَيْرَةَ وَرُوِيَ عَنْ أَبِي زُرْعَةَ عَنْ أَبِي هُرَيْرَةَ مُخْتَلِفًا عَلَى الرِّوَايَتَيْنِ وَكَذَلِكَ رِوَايَةُ عَبْدِ الرَّحْمَنِ بْنِ أَبِي عَمْرَةَ عَنْ أَبِي هُرَيْرَةَ اخْتُلِفَ فِيهِ رَوَاهُ الثَّوْرِيُّ وَابْنُ جُرَيْجٍ عَلَى مَا قَالَ أَبُو الزُّبَيْرِ وَرَوَاهُ مَعْقِلُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4966، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4966 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4966، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4966 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4966 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4966 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4966, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
