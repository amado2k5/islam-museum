text: "… وأَشرف العرب وأَعزم نفرا من قِبَل أَبيه وأُمّه، ومن أَهل مكة أَكرم بلاد اللّٰه تعالى على اللّٰه وعلى عباده. وأعداؤه عله كانوا يشهدون له بذلك ولهذا شهد له به عدوُّه إِذ ذاك أَبو سفيان بن حرب بين يديْ ملِك الروم. …"
summary:
