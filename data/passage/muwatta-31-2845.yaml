label: { ar: "الموطأ 2845 — أبو طلحة يتصدق ببيرحاء بعد نزول آية البر", en: "Muwatta 2845" }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أنه سمع أنس بن مالك يقول: كان أبو طلحة أكثر الأنصار بالمدينة مالا من نخل، وكان أحب أمواله إليه بيرحاء، وكانت مستقبلة المسجد، وكان رسول الله يدخلها ويشرب من ماء فيها طيب. فلما نزلت الآية [[passage/quran-3-92|آل عمران ٩٢]] قام أبو طلحة فقال: إن أحب أموالي إلي بيرحاء، وإنها صدقة لله أرجو برها وذخرها عند الله، فضعها يا رسول الله حيث شئت. فقال النبي: بخ، ذلك مال رابح، وقد سمعت ما قلت فيه، وإني أرى أن تجعلها في الأقربين. ففعل أبو طلحة وقسمها في أقاربه وبني عمه. {cite:muwatta-maruf-1997 p.594} {cite:muwatta-maruf-1997 p.595}"
