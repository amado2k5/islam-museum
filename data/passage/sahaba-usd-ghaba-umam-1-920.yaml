text: "… بن أَمَيَّة جُديّ بن ضمرة بن بكر بن عبد مناة بن كنانه الكناني الضمري، يكنّى أَبا أُمية. بعثه النبي مل وحده عيناً إِلى قريش، فحمل خُبَيب بن عدي من الخشبة التي صلبٍ عليها، وأَرسِله إِلى النجاشي وكيلاً، فعقد له على …"
