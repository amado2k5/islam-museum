label: { ar: "سنن أبي داود 4120 — ما حُرّم", en: "Sunan Abi Dawud 4120 — what was made unlawful", ur: "سنن ابی داؤد 4120 — جو حرام کیا گیا", es: "Sunan Abi Dawud 4120: lo que se declaró ilegal", fr: "Sunan Abi Dawud 4120 — ce qui a été rendu illégal", tr: "Sunan Abi Davud 4120 — Yasak olan nedir?", id: "Sunan Abi Dawud 4120 — Apa yang dilarang" }
text: "… وَابْنُ أَبِي خَلَفٍ، قَالُوا حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، - قَالَ مُسَدَّدٌ وَوَهْبٌ - عَنْ مَيْمُونَةَ، قَالَتْ أُهْدِيَ لِمَوْلاَةٍ لَنَا شَاةٌ مِنَ الصَّدَقَةِ فَمَاتَتْ فَمَرَّ بِهَا النَّبِيُّ فَقَالَ \" أَلاَ دَبَغْتُمْ إِهَابَهَا فَاسْتَمْتَعْتُمْ بِهِ \". قَالُوا يَا رَسُولَ اللَّهِ إِنَّهَا مَيْتَةٌ. قَالَ \" إِنَّمَا حُرِّمَ أَكْلُهَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4120، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4120 (Clothing (Kitab Al-Libas)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4120، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4120 (Vestimenta (Kitab Al-Libas)), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 4120 (Vêtements (Kitab Al-Libas)), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sünen Ebu Davud'da yer alan 4120 numaralı hadis, haram olan şeylerden bahsetmektedir. \"Helal ve Haram\" kitabının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4120, menyebutkan apa yang dilarang. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
