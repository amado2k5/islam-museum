label: { ar: "الموطأ 1070 — مالك في الرجل يدخل في الطواف فيسهو حتى يطوف ثمانية أو تسعة أطواف: يقطع إذا علم أنه زاد، ثم يصلي ركعتين، ولا يعتد بما زاد، ولا يبني على التسعة حتى يصلي سبعين جميعاً", en: "Muwatta 1070", es: "Muwatta 1070", fr: "Muwatta 1070", ur: "موطا 1070", tr: "El-Muvatta 1070 — Malik, tavafa girip sekiz ya da dokuz tavaf yaptıktan sonra unutan bir kimse hakkında şöyle demiştir: Eğer daha fazla tavaf yaptığını fark ederse durmalı, sonra iki rekat daha namaz kılmalı ve daha fazla kaç rekat yaptığını saymamalı, dokuz rekatın üzerine yetmiş rekat namaz kılıncaya kadar yeni rekatlar eklememelidir.", id: "Al-Muwatta 1070 — Malik berkata tentang seseorang yang melakukan Tawaf dan lupa hingga ia telah melakukan delapan atau sembilan Tawaf: Hendaknya ia berhenti jika ia menyadari bahwa ia telah melakukan lebih dari itu, kemudian ia hendaknya shalat dua rakaat, dan ia tidak boleh menghitung apa yang telah ia lakukan lebih dari itu, dan tidak pula ia boleh menambah dari sembilan Tawaf hingga ia telah shalat sebanyak tujuh puluh rakaat." }
summary:
  ar: "قول لمالك في الرجل يدخل في الطواف فيسهو حتى يطوف ثمانية أو تسعة أطواف: قال يقطع إذا علم أنه زاد، ثم يصلي ركعتين ولا يعتد بما زاد، ولا ينبغي له أن يبني على التسعة حتى يصلي سبعين جميعاً، لأن السنة في الطواف أن يتبع كل سبع ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1293). {cite:muwatta-maruf-1997 p.494}"
  tr: "Malik, tavafa girip sekiz ya da dokuz tur tamamlayana kadar unutan bir kimse hakkında şöyle demiştir: Eğer daha fazla tur yaptığını fark ederse durmalı, sonra iki rekat namaz kılmalı ve fazladan turları dikkate almamalıdır. Yetmiş rekat namaz kılıncaya kadar dokuzdan fazla tur yapmamalıdır, çünkü tavafta sünnet, her yedi turdan sonra iki rekat namaz kılmaktır. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1293) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.494}"
  id: "Malik berkata mengenai seorang laki-laki yang memasuki tawaf dan lupa hingga telah menyelesaikan delapan atau sembilan putaran: Beliau berkata, hendaknya ia berhenti jika menyadari telah melakukan lebih dari itu, kemudian shalat dua rakaat dan mengabaikan putaran tambahan tersebut. Ia tidak boleh melanjutkan lebih dari sembilan putaran hingga total shalatnya mencapai tujuh puluh, karena sunnah dalam tawaf adalah setiap tujuh putaran diikuti dengan dua rakaat. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1293). {cite:muwatta-maruf-1997 p.494}"
