label: { ar: "الموطأ 1070 — مالك في الرجل يدخل في الطواف فيسهو حتى يطوف ثمانية أو تسعة أطواف: يقطع إذا علم أنه زاد، ثم يصلي ركعتين، ولا يعتد بما زاد، ولا يبني على التسعة حتى يصلي سبعين جميعاً", en: "Muwatta 1070" }
summary:
  ar: "قول لمالك في الرجل يدخل في الطواف فيسهو حتى يطوف ثمانية أو تسعة أطواف: قال يقطع إذا علم أنه زاد، ثم يصلي ركعتين ولا يعتد بما زاد، ولا ينبغي له أن يبني على التسعة حتى يصلي سبعين جميعاً، لأن السنة في الطواف أن يتبع كل سبع ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1293). {cite:muwatta-maruf-1997 p.494}"
