text: |-
  ⁦(باب البا.)⁩
  ⁦(صعب )⁩
  إذا أرادت أن تنهش ار تفعت ثم صبت والصبيب ماء ورق السمسم قال أبو عبيد يقال انه ما.
  ورق السمسم أوغيره من نيات الارض وقد وصف لى بصمرولون مانه أحر يعاوه سواد ومنه
  قول علقمة بن عبدة
  فأوردها ماه كأن جامه • من الاجن حناء معاوصبيب
  ويقال هو عصارة ورق الحناء والصيب الدم والصبيب المصفر المخلص والصبب ما اغدر من
  الارض وجعه أصباب وتصبصب الشىء امحق وذهب قال الراجز
  اذا الإداوى ماؤها تصبصبا * وخس صبصاب مثل بصباص
  (سب صبه يصميه صحبة بالضم وحصابة بالفتح وجمع الصاحب صحب مثل راكب وركب
  وصبة بالضم مثال قاره وفرحة وصحاب مثل جائع وجباع قال الساعرامر والقدس
  وقال صمابى قد شأونك فاطلب وصحبان مثال شاب وشبان والاصحاب جمع صحب مثل
  فرخ وافراخ والصحابة بالفتح الاصماب وهى فى الاصل مصدر وب سع الاصحاب أصاحيب
  وقواهم فى النداء يإصاح معناه ياصاحى ولا يجوز ترخيم المضاف الافى هذاوحده سمع من
  العرب حر خاوأصحبته الشئ جعلته له صاحبا واستصبته الكتاب وغيره وكل شئ لام شيئا
  فقد استحبه واصطب القوم صب بعضهم بعضا وأمله اصتحب لان تاء الافتعال تتغير عند
  الصادوثل اصطحب وعند الضاد مثل اضطرب وعند الطاء مثل اطلب وعند الظاء مثل اظلم
  وعند الدال مثل ادّعى وعند الذال مثل اذخر وعند الزاى مثل ازدجرلان التاءلان مخرجها
  فلم نوافق هذه الحروف اشدة مخارجها فأبدل منها ما يوافها التخف على اللان ويعذب اللفظا
  به وأعحب البعبر والدابة اذا انقاد بعد صعوبة قال الشاعر
  ولست بذى رثية إمّر * اذا قيد مستكرها أصحبا
  وأصحب الرجل اذا بلغ ابنه والمصحب من الزقاق ما الشعر عليه وقد أصحيته اذا تركت صوفه
  أوشعره عليه ولم تعطنه والحيت ماليس عليه شعر عن أبى عرووأصحب الماءاذا علاه الطحلب
  الصرب اللين الحامض جد ايقال جاء نابصر بة تزوّى الوحه وكذلك الصرب بالتحريك
  والصرب أيضا الصمغ الاحر وهو صمغ الطلح قال الشاءر
  أرض عن الخير والسلطان نائية • فالاطيبان بها الطرتوث والصرب
  الواحسدة صرية وربما كانت الصربة مثل رأس السنوروفى جوفها شئ كالغراء والديس
  عص ويؤ كل والمصرب الاناه الذى يصرب فيه اللين أى يحة ن تقول صريت اللين فى الوطب
  واصطريته اذا جعته فيه شيئا بعد شي وركنه ليحمض وتقول أيضاصرب بوله اذا حقنه ومنه
  قيل البههيرة صربى على فعلى لانهم كانوالا يحلبونها الاللضيف فيجتمع اللبن فى ضرعها وصرب
  العبى ليسمن وهواذا احتبس ذويطنه فيمسكث يومالا يحدث وذلك اذا أراد أن يسمن
  ⁦(صعب)⁩ الصعب نقيض الذلول وامر أة صعبة ونساء صعبات بالتسكين لانه صفة والمصعب
  الفعل
