text: |-
  ٤٢٦ :
  والكسائى ويجوز عندهم تقديم هذا المنصوب ك مايجوز غلامه ضرب زيد وقال
  الفرّاء لما-ول الفعل من النفس الى صاحبها خرج ما بعد..فسر البدل على أن السفه
  فيه وصكان --مه أن يكون سفه زيد نفسالات المفسر لا يكون الانكرة ولسكنه
  ترك على اضافته ونصب كنصب النسكرة تشبيها بها ولا يجوز عنده تقسديمه لانّ المفسر لا يتقدّم
  ومئله قولهم ضقت به ذرعا وطبت به نفساوالمعنى ضاق ذرعى به وطابت نفسى به وسفه فلان
  بالضم سفاها وسفاهة وسفه بالكسر-هالغتان أى صارسفيها فاذا قالواسفه نفسه وسقه
  رأيه لم يقولوه الابالكسرلان فعل لا يكون متعديا وسفهت الشراب أيضا با الصكسراذا
  أكثرن منه فلم ترووأسفهكه اللّٰه وسافهت الدنّ أوالوطب اذا قاعدته فشربت منه ساعة بعد
  ساعة(سمه سمه الفرس يسمه بالفتح فيه ماسموها جرى جر بالا يعرف الاعياءه وسامه
  والجمع سمه وقال *ليت النى والدهرجرى السمه • وعسه نهو سامه أى دهش أبو هرو
  جرى فلان السمهى اذاجرى الى غير أمر يعرفه والسمهى والسميهى الكذب والاباطيل
  وذهبت ابله السمهى تفرقت فى كل وجه والسمهى الهواء بين السماء والارض( سنه
  السنة واحدة السنين رفى نقصائم اقولان أحدهما الواو وأصلها سنوة والآخرالهاء وأصلها
  سنهة مشل جبهة لانها من سنهت النخلة وتسنهت اذا أنت عليها السذون ونخلة سنهاه أى
  تحمل سنة ولا محمل أخرى . وقال بعض الانصار
  فليست بسنها ولارجبية • ولكنء رايافى السنين الجوائح
  وفيه قول آخر أنها التى أصابتها السنة المجدبة قاله أبو عبيد وقال أيضا يقال أرض بنى فلاث
  سمة إذا كانت مجدية والعرب تقول تسنيت عنده وتستهت عنده واستأجرته مسافاة
  ومسانهة وفى التصغيرسنية وسفيهة واذا بجعت بالواو والنون كسرت السين فقلت سنون
  وبعضهم يقول سفون بالضم وأمامن قال سنين ومشيز ورفع النون ففى نة-ديره قولان
  أحدهما أنه فعلين مثل غسلين محذوفة الا أنه جمع شاذ وقديجئ فى الجموع مالا نظير له فحو
  عدى وهذاقول الاخفش والقول الثانى أنه فعيل وانما كسروا الفاء اكسرة ما بعدها
  وقد جاء الجمع على فعيل نحوكليب وعبيد الا أنّ صاحب هذا القول يجعل المون فى آخره بدلا
  من الواووفى المائة بدلا من الياءوة وه تعالى ثلثمائة سنين قال الاخفش انه بدل من ثلاث
  ومن المائة أى لبنواثلثمائة من السنين قال فان كانت السنون تقسير اللماثة فهى جرً
  وان كانت تفسير اللثلاث فهى نصب والتسنه التكترج الذى يقع على اللخبز والشراب وغيرهما
  تقول خبز. تسنه
  صل الشين به) شبه وشبه لغتان بعنى بقال هذاشبهه أى شيهه وبيتهما
  شبه بالتحريك والمع مشابه على غير قياس كما قالو امحاسن ومذاصك ير والشبهة الالتباس
  والمشتبهات من الامور المشكلات والمتشابهات المتمائلات وتشبه فلان بكذا والتشبيه
  التمثيل وأشبهت فلانا وشابهته واشقبه علىّ الذى والشبه ضرب من النهاس يقال كوزشبه
  وشبه بعنى قال المزاد
  تدين لمزرور الى جنب حلقة • من الشبه سوّاهابرفق طببها
  والتبهان
