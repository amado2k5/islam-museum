text: "… راحلتي ولا يأمرنى أن أحرم في دبر صلاة قال كان يستحب أن يصلى نافلة اذا اذا كان فى ساعة يصلى فيها قلنا له فني هذه النافلة حد قال لا أراد الاحرام قلنا مه له فلو صلى مكتوبة ليس بعدها نافلة …"
summary:
  ar: "مقطع من المدونة الكبرى، المجلد المصوَّر 1، ص 133، يرد فيه ذكر المستحب، والنافلة والنوافل، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Mudawwana al-Kubra, scan volume 1, p. 133, whose wording mentions the recommended (mustahabb), the supererogatory (nafila), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
