label: { ar: "صحيح البخاري 1398 — الشهادة والصلاة والزكاة، ركن من أركان الإيمان", en: "Sahih al-Bukhari 1398 — the testimony, the prayer and the zakat; one of the articles of faith", ur: "صحیح بخاری 1398 — شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن" }
text: "… عَنْكَ، وَنَدْعُو إِلَيْهِ مَنْ وَرَاءَنَا. قَالَ \" آمُرُكُمْ بِأَرْبَعٍ، وَأَنْهَاكُمْ عَنْ أَرْبَعٍ الإِيمَانِ بِاللَّهِ وَشَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ ـ وَعَقَدَ بِيَدِهِ هَكَذَا ـ وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ، وَأَنْ تُؤَدُّوا خُمُسَ مَا غَنِمْتُمْ، وَأَنْهَاكُمْ عَنِ الدُّبَّاءِ وَالْحَنْتَمِ وَالنَّقِيرِ وَالْمُزَفَّتِ \". وَقَالَ سُلَيْمَانُ وَأَبُو النُّعْمَانِ عَنْ حَمَّادٍ \" الإِيمَانِ بِاللَّهِ شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1398، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 1398 (Obligatory Charity Tax (Zakat)), that mentions the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 1398، جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
