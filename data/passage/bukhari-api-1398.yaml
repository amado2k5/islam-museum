label: { ar: "صحيح البخاري 1398 — الشهادة والصلاة والزكاة، ركن من أركان الإيمان", en: "Sahih al-Bukhari 1398 — the testimony, the prayer and the zakat; one of the articles of faith", ur: "صحیح بخاری 1398 — شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن", es: "Sahih al-Bukhari 1398 — el testimonio, la oración y el zakat; uno de los artículos de fe", fr: "Sahih al-Bukhari 1398 — le témoignage, la prière et la zakat; un des articles de foi", tr: "Sahih el-Buhari 1398 — Şahadet, namaz ve zekât, imanın direkleridir.", id: "Sahih al-Bukhari 1398 — Kesaksian, salat, dan zakat adalah pilar-pilar keimanan." }
text: "… عَنْكَ، وَنَدْعُو إِلَيْهِ مَنْ وَرَاءَنَا. قَالَ \" آمُرُكُمْ بِأَرْبَعٍ، وَأَنْهَاكُمْ عَنْ أَرْبَعٍ الإِيمَانِ بِاللَّهِ وَشَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ ـ وَعَقَدَ بِيَدِهِ هَكَذَا ـ وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ، وَأَنْ تُؤَدُّوا خُمُسَ مَا غَنِمْتُمْ، وَأَنْهَاكُمْ عَنِ الدُّبَّاءِ وَالْحَنْتَمِ وَالنَّقِيرِ وَالْمُزَفَّتِ \". وَقَالَ سُلَيْمَانُ وَأَبُو النُّعْمَانِ عَنْ حَمَّادٍ \" الإِيمَانِ بِاللَّهِ شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1398، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 1398 (Obligatory Charity Tax (Zakat)), that mentions the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 1398، جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 1398 (Impuesto obligatorio sobre la caridad (Zakat)), menciona el testimonio, la oración y el zakat, uno de los artículos de fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 1398 (L'aumône obligatoire (Zakat)), mentionne le témoignage, la prière et la zakat, l'un des piliers de la foi. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih el-Buhari'nin 1398 numaralı hadisinde, iman şahadeti, namaz ve zekâtın imanın temel direklerinden biri olduğu belirtilmektedir. Bu bölüm, İslam'ın temel direklerini, imanın temel direklerini, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetlerle birlikte bu dört kategori içinde derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1398, menyebutkan kesaksian iman, salat, dan zakat, dan merupakan salah satu rukun iman. Bagian ini mengumpulkan rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori ini."
