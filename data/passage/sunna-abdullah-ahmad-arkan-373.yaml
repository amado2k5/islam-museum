text: "… ابن كيسان - أن عبد اللّٰه بن أبي أُمَامَة، أخبره أن أبا أُمامة رضيّ نه أخبره: أن رسول اللّٰه قِ قال: البَذَاذَةُ مِن الإيمان، البَذَاذَة مِن الإيمان، البَذَاذَةُ مِن الإيمان. - لاثني أبي، ثنا إسماعيل بن إبراهيم، ثنا خالد الحذَّاء، …"
