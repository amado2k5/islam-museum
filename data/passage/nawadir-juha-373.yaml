text: "… هات حمارين قال له أحد الحكام: تمنَّ عليّ. فقال: أتمنى أن تُصدِر أمراً بتفويضي أن آخذ حماراً من كل رجلٍ يخاف أمرأتَهُ، فأصدر الحاكم أمراً عاماً بذلك. وذهب جحا إلى بعض الضواحي، ثُمَّ عاد بعد مدة، فرآه الحاكم من النافذة، …"
summary:
  ar: "طلب حاكم من جحا أن يطلب منه خدمة، فطلب جحا من الحاكم أن يأمر بأن يأخذ جحا حماراً من كل رجل يخاف زوجته، فأصدر الحاكم الأمر، وعاد جحا بحمير كثيرة وقال إنه رأى ابنة وجيه، فحذره الحاكم أن يخفض صوته لئلا تسمع زوجته هو، فقال جحا إن كان يجوز له أن يأخذ حماراً من أي أحد فليعطه اثنين. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  en: "A governor asks Juha for a favour; Juha asks the governor to order that Juha may take one donkey from every man afraid of his wife; the governor issues the order; Juha returns with many donkeys and says he saw a notable's daughter; the governor warns him to lower his voice lest his own wife hear. Juha says: if I may take one donkey from anyone, then give me two. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  ur: "ایک حاکم نے جحا سے کہا کہ کوئی مہربانی مانگے، تو جحا نے حاکم سے درخواست کی کہ حکم دے کہ جحا ہر اس آدمی سے ایک گدھا لے سکے جو اپنی بیوی سے ڈرتا ہو، حاکم نے حکم جاری کر دیا، جحا بہت سے گدھے لے کر لوٹا اور کہا کہ اس نے ایک معزز کی بیٹی کو دیکھا ہے، حاکم نے اسے خبردار کیا کہ آواز دھیمی رکھو کہیں اس کی اپنی بیوی نہ سن لے، تو جحا نے کہا کہ اگر میں کسی سے بھی ایک گدھا لے سکتا ہوں تو مجھے دو دے دو۔ {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  fr: "Un gouverneur demande à Juha de solliciter une faveur ; Juha demande au gouverneur d'ordonner que Juha puisse prendre un âne à tout homme qui craint sa femme ; le gouverneur promulgue l'ordre ; Juha revient avec de nombreux ânes et dit avoir vu la fille d'un notable ; le gouverneur l'avertit de baisser la voix de peur que sa propre femme n'entende. Juha dit : si je peux prendre un âne à n'importe qui, alors donne-m'en deux. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  es: "Un gobernador pide a Juha que solicite un favor; Juha pide al gobernador que ordene que Juha pueda tomar un burro de todo hombre que tema a su esposa; el gobernador emite la orden; Juha regresa con muchos burros y dice que ha visto a la hija de un notable; el gobernador le advierte que baje la voz para que no la oiga su propia esposa. Juha dice: si puedo tomar un burro de cualquiera, entonces dame dos. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
  tr: "Vali, Juha'dan bir iyilik istedi. Juha, validen karısından korkan her adamdan bir eşek almasını emretmesini istedi. Vali emri verdi ve Juha birçok eşekle geri döndü ve önemli bir adamın kızını gördüğünü söyledi. Vali, karısının duymaması için sesini alçaltmasını söyledi. Juha, eğer birinden eşek alması caiz ise, ona iki tane vermesini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 184}"
  id: "Seorang gubernur meminta Juha untuk mengajukan permohonan. Juha meminta gubernur untuk memerintahkan agar ia mengambil seekor keledai dari setiap pria yang takut kepada istrinya. Gubernur mengeluarkan perintah tersebut, dan Juha kembali dengan banyak keledai, mengatakan bahwa ia telah melihat putri seorang tokoh terkemuka. Gubernur memperingatkannya untuk merendahkan suaranya agar istrinya tidak mendengarnya. Juha menjawab bahwa jika diperbolehkan baginya untuk mengambil seekor keledai dari siapa pun, maka ia harus memberikannya dua ekor. {cite:juha-nawadir-kubra-djuwaydi p. 184}"
