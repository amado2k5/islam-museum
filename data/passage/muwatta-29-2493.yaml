summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار أن زيد بن ثابت كان يقول: في العين القائمة إذا أُطفئت مائة دينار. {cite:muwatta-maruf-1997 p.427}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayetle, Zeyd ibn Sabit'in şöyle dediğini aktarır: \"Sönmüş bir pınar için tazminat yüz dinardır.\" {cite:muwatta-maruf-1997 s.427}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa Zayd ibn Thabit biasa berkata: \"Untuk mata air yang padam, ganti ruginya adalah seratus dinar.\" {cite:muwatta-maruf-1997 p.427}"
