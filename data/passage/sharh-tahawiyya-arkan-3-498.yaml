text: "… أركان الإيمان، الإيمان بالملائكة. ج : وضبطنا الإيمان بالملائكة الذي هو ركن الإيمان ومن أنكره كَفَر وهو الإيمان بوجود الملائكة إجمالًا، فإذا آمن بوجود الملائكة لله عيل فهو مؤمن، فإذا كان سَمِعَ باسم جبريل اكِ وأنه ينزل بالوحي وجب عليه …"
