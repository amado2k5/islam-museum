text: "… أركان الإيمان، الإيمان بالملائكة. ج : وضبطنا الإيمان بالملائكة الذي هو ركن الإيمان ومن أنكره كَفَر وهو الإيمان بوجود الملائكة إجمالًا، فإذا آمن بوجود الملائكة لله عيل فهو مؤمن، فإذا كان سَمِعَ باسم جبريل اكِ وأنه ينزل بالوحي وجب عليه …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 3، ص 498، يذكر أركان الإيمان، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 3, p. 498, that mentions the pillars of faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 3، ص 498 کا اقتباس جس میں ارکانِ ایمان، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
