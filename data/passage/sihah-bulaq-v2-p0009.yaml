text: |-
  ٠٧٨
  *(ها
  جسمع الشيئين ولا تدل على الترتيب وتدخل عليها آلف الاستفهام كفوه تعالى أوعجبتم أن
  حاكم ذكر من ربكم كماتقول أفعجبتم وقد تكون ععى مع لما بينه ما من المناسبة لان مع
  للمصاحبة كقول النبىّ صلى اللّٰه عليه وسلم بعثت والساعة كهاتين وأشار الى السبابة
  والوسطى أى مع الساعة وقد تكون الوا وللعال كقولهم قت وأصك وجهه أى قت صاكًا
  وجهه وكقولك قت والناس قعود وقدية سم بها تقرل واللّه لقد كان كذا وهوبدل من الباء
  وانغما أيدل منه لقر به منه فى المخرج اذ كان من حروف الشفة ولا يتج اوز الاسماء المظاهرة
  غووا لله وحياتك وأبيك وقد تكون الواوضمير جماعة المذكر فى قولك فعلوا ويفعلون
  وافعلوا وقد تكون الواوزائدة قال الاصمعى قلت لابى عمرو قولهم ربناولك الحدفقال
  يقول الرجل للرجل بعنى هذا الثوب فيقول وهولك وأظنه أرادهولك وأنشد الاخفس
  فاذا وذلك يا كبيشة لم يكن • الاكلمة حالم بخيال
  كانه قال فاذاذلك لم يكن وقال آخر
  قف بالديار النى لم بعفها القدم • بلى وغيرها الارواح والديم
  يريد بلى غيرها وقوله تعالى -تى اذا جاؤها وفتحت أبواج افقد يجوز أن ت-كون الواوههنا
  زائدة وويك كمة مثل ويب وويح والكاف للخطاب قال الشاعر
  ويكان من يكن له نشب يت عب ومن يفتقر يعش عيش ضرّ
  قال المكسائى هوويك أدخل عليه أن ومعناه ألم تر وقال الخليل هى وى مفصولة ثم تبتدئ
  فتقول كأن ا) الهاءرف من حروف المهجم وهى من حروف الزيادات وها حرف
  تئبيه قال النابغة
  ها ان تاعذرة الاتكن نفعت • فان صاحبها قد تاءف البلد
  وتقول ها أنتم *ؤلاء تجسمع بين التنبيهين للتوكيد وكذلك ألا يا هؤلاء وهو غير مضارق لاى
  تقول ياأيها الرجل وهاقد يكون حواب النداءيمد ويقصر قال الشاءر
  لابل يجيبك حين تدعوباسمه • فيقول«اء وطال مالبى
  وهاللتنبيه وة_ديقسم بها يقال لاها اللّه مافعلت أى لا والله أبدات الهاء من الواو وان
  شئت حذفت الالف التى بعد الهاء وان شئت أثبت وقواهم لاها اللّٰهذا أصله لا واللّه هذا
  نفرقت بين ها وذا وجعات الاسم بينه -ماوجررته بحرف التنبيه والنقدير لا واللّٰه مافعات
  مذا غذف واختصر لكثرة استعمالهم هذا فى كلا مهم وقدّم ها كماقدم فى قولهم
  هاهوذا وها أناذا قال زهير
  تعان هالعمر الله ذاقسما • فاقصد لذرعك وانظرأين تنلك
  والهاء قد تكون كاية عن الغائب والعائبة تقول ضر به وضر بها وهوللمذ كروهى للمؤنت
  واغابنوا الواوفى هو والياء فى هى على الفتح ليفرقوابين هذه الواد والياء التى هى من تفس
  الاسم المكنىّ وبين الواو والياء اللتين تكونان صلة فى نحوقولك رأ يتهو ومررت بهى لانّ كل
  مبنّ فقه أن يبنى على السكون الاأن تعرض علة توجب له الحركة والتى تعرض ثلاثة
  أشياء أحدها اجتماع الساكنين مثل كيف وأين والثانى كونه على حرف واحدمثل الباء
  للزائدة
