text: "… وذكر ابنُ ماجه عنه: مَنْ أَرْسَلَ بِتفَقَة في سَبِيلِ عَلَيْهَا [البخاري: ٢٨٩٢]. مَا بَيْنَ كُلِّ دَرَجَتَيْنِ كَمَا بَيْنِ السَّمَاءِ والأَرْضِ قالٍ: [مسلم: ٤٨٧٩]. خَزَنَةُ الجنَّةِ كُلُّ خَزَنَةِ بَابٍ، أَيْ فُلُ هَلُمَّ، فمنْ كانَ مِنْ أَهْلِ الصَّلاةِ، دُعِيَ مِنْ بَابِ الصَّلاةِ، …"
