text: "… لا في الألوهية، فإن عباد الأصنام كانوا يعترفون بأنها مملوكة لله فيقولون: لبيك لا شريك لك إلَّا شريكًا هو لك تملكه وما ملك، وهؤلاء يجعلون ما يملكه العبد من أفعاله مُلكًا لله. ولهذا قال ابن عباس ضيَا : الإيمان بالقدر …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 406، يذكر الإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 406, that mentions belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 406 کا اقتباس جس میں تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de Abd Allah ibn Ahmad, pág. 406, que menciona la creencia en el decreto; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'Abd Allah ibn Ahmad, p. 406, mentionnant la croyance au décret; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, 406. sayfada, kader inancından bahsedilmektedir; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 406, menyebutkan kepercayaan pada takdir; dari edisi yang dipindai dan dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
