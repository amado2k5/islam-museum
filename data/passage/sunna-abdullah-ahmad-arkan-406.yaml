text: "… لا في الألوهية، فإن عباد الأصنام كانوا يعترفون بأنها مملوكة لله فيقولون: لبيك لا شريك لك إلَّا شريكًا هو لك تملكه وما ملك، وهؤلاء يجعلون ما يملكه العبد من أفعاله مُلكًا لله. ولهذا قال ابن عباس ضيَا : الإيمان بالقدر …"
