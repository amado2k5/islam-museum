text: "- - ميمون عن أبى هريرة عن النبى. قال : من سره أن يجد طعم الايمان، فليحب المرء لا يحبه إلا لله. حدثنا محمد بن جهفر بن الهيثم قال ثنا جعفر بن عد بن شاكر الصائغ قال ثنا بن سابق …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 154، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
