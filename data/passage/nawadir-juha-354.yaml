text: "… جحا والغني أعطاه أحد الأغنياء خمسمائة غرشٍ، وقال له: أرجو أن تدعُو إليّ عقيب كُلِّ فُطِرَ : خلق."
summary:
  ar: "أعطى رجل غني جحا خمسمئة قرش بشرط أن يدعو له بعد كل صلاة من الصلوات الخمس، فاحتفظ جحا بأربعمئة وخمسين وأرجع خمسين، وقال إن الليل قصير وهو يصلي الفجر متأخراً فلا يستحق تلك الأجرة. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  en: "A rich man gives Juha five hundred piastres on condition he prays for him after each of the five prayers; Juha keeps 450 and returns 50, saying the night is short and he prays the dawn prayer late, so he does not deserve that pay. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  ur: "ایک امیر آدمی نے جحا کو پانچ سو قروش اس شرط پر دیے کہ وہ پانچوں نمازوں کے بعد اس کے لیے دعا کرے، جحا نے ساڑھے چار سو رکھ لیے اور پچاس لوٹا دیے، اور کہا کہ رات چھوٹی ہے اور وہ فجر کی نماز دیر سے پڑھتا ہے، اس لیے وہ اس اجرت کا مستحق نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  fr: "Un riche donne cinq cents piastres à Juha à condition qu'il prie pour lui après chacune des cinq prières ; Juha en garde 450 et en rend 50, disant que la nuit est courte et qu'il fait la prière de l'aube tard, et qu'il ne mérite donc pas ce salaire. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  es: "Un rico da a Juha quinientas piastras con la condición de que rece por él después de cada una de las cinco oraciones; Juha se queda con 450 y devuelve 50, diciendo que la noche es corta y que reza la oración del alba tarde, por lo que no merece esa paga. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
  tr: "Zengin bir adam, Cuha'ya beş vakit namazın her birinden sonra kendisi için dua etmesi şartıyla beş yüz kuruş verdi. Cuha, dört yüz elli kuruşu aldı, elli kuruşu ise geri verdi ve gecenin kısa olduğunu ve sabah namazını geç kıldığını, bu yüzden bu ödemeyi hak etmediğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 175}"
  id: "Seorang pria kaya memberi Juha lima ratus piaster dengan syarat ia mendoakannya setelah setiap shalat lima waktu. Juha menyimpan empat ratus lima puluh dan mengembalikan lima puluh, dengan alasan malamnya singkat dan ia shalat Subuh terlambat, sehingga ia tidak pantas menerima pembayaran tersebut. {cite:juha-nawadir-kubra-djuwaydi p. 175}"
