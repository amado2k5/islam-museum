label:
  ar: "البخاري 4850 — تحاجت الجنة والنار: أنت رحمتي وأنت عذابي"
  en: "Bukhari 4850 — Paradise and the Fire disputed: you are My mercy, you are My punishment"
  ur: "بخاری 4850 — جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب"
text: "تحاجت الجنة والنار فقالت النار أوثرت بالمتكبرين والمتجبرين. وقالت الجنة ما لي لا يدخلني إلا ضعفاء الناس وسقطهم. قال الله تبارك وتعالى للجنة أنت رحمتي أرحم بك من أشاء من عبادي. وقال للنار إنما أنت عذاب أعذب بك من أشاء …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4850: تحاجت الجنة والنار: أنت رحمتي وأنت عذابي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4850: Paradise and the Fire disputed: you are My mercy, you are My punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4850: جنت اور آگ کا جھگڑا: تو میری رحمت ہے اور تو میرا عذاب۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
