label: { ar: "سنن النسائي 2391 — مضاعفة الحسنة بعشر أمثالها", en: "Sunan al-Nasa'i 2391 — the good deed multiplied tenfold and beyond", ur: "سنن نسائی 2391 — نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "… يَطُولَ بِكَ عُمُرٌ وَإِنَّهُ حَسْبُكَ أَنْ تَصُومَ مِنْ كُلِّ شَهْرٍ ثَلاَثًا فَذَلِكَ صِيَامُ الدَّهْرِ كُلِّهِ وَالْحَسَنَةُ بِعَشْرِ أَمْثَالِهَا \". قُلْتُ إِنِّي أَجِدُ قُوَّةً فَشَدَّدْتُ فَشُدِّدَ عَلَىَّ. قَالَ \" صُمْ مِنْ كُلِّ جُمُعَةٍ ثَلاَثَةَ أَيَّامٍ \". قُلْتُ إِنِّي أُطِيقُ أَكْثَرَ مِنْ ذَلِكَ فَشَدَّدْتُ فَشُدِّدَ عَلَىَّ. قَالَ \" صُمْ صَوْمَ نَبِيِّ اللَّهِ دَاوُدَ \". قُلْتُ وَمَا كَانَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2391، يذكر مضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2391 (The Book of Fasting), that speaks of the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2391، جس میں نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
