summary:
  ar: "القسم 41 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المزارعة»، ويضم فيها النصوص من 2320 إلى 2350 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 41 of Sahih al-Bukhari (Agriculture) in the division of the open hadith dataset the museum took its reports from: reports 2320 to 2350 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 41، عنوان «کتاب المزارعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2320 تا 2350۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 41 de Sahih al-Bukhari (Agricultura) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2320 al 2350, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
