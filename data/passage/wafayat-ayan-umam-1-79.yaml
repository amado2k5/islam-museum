text: "فاتفق أنه بعد هذا القول بمدة قدم رسول نصراني من ملك الروم إلى الحليفة، فمضى إليه ابن السقاء وسأله أن يستصحبه وقال له : يقع لي أن أترك دين الإسلام وأدخل في دينكم، فقبله النصراني، وخرج معه إلى القسطنطينية والتحق …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 79، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
