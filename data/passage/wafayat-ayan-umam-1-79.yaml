  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Önemli Şahsiyetlerin Biyografik Sözlüğü) adlı eserinin 1. cildinin 79. sayfasından, Müslüman olmayan milletleri, dinleri ve halkları anlatan bir bölüm; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. \"Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar\" için tarayıcı tarafından derlenmiştir."
