text: "… على أحسن القصص. حدثنا عبد اللّٰه بن دثنا احمد بن الحسين ثنا احمد بن إبراهيم ثنا يزيد ابن هارون أنبأنا المسعودى من هون. قال : إن الحلم والحياء والعى - مى اللسان لاعى القلب - والفقه من الايمان، وهن مما …"
