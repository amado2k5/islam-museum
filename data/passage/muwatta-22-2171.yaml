label: { ar: "الموطأ 2171 — يحيى عن مالك عن عمرو بن يحيى المازني عن أبيه: قال رسول الله لا ضرر ولا ضرار", en: "Muwatta 2171", es: "Muwatta 2171", fr: "Muwatta 2171", ur: "موطا 2171", tr: "El-Muvatta 2171 — Yahya, Malik'ten, o da Amr ibn Yahya el-Mazini'den, o da babasından rivayetle: Allah'ın Resulü şöyle buyurdu: Ne zarar verilmeli ne de zarara karşılık verilmelidir.", id: "Al-Muwatta 2171 — Yahya dari Malik dari Amr ibn Yahya al-Mazini dari ayahnya: Rasulullah SAW bersabda: Tidak boleh ada bahaya dan tidak boleh ada pembalasan atas bahaya." }
summary:
  ar: "يروي يحيى عن مالك عن عمرو بن يحيى المازني عن أبيه أن رسول الله قال: لا ضرر ولا ضرار. {cite:muwatta-maruf-1997 p.290}"
  tr: "Yahya, Malik'ten, o da Amr ibn Yahya el-Mazini'den, o da babasından rivayet ederek, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Ne zarar vermek ne de zarara karşılık vermek olmalıdır.\" {cite:muwatta-maruf-1997 s.290}"
  id: "Yahya meriwayatkan dari Malik, dari Amr ibn Yahya al-Mazini, dari ayahnya, bahwa Rasulullah SAW bersabda: \"Janganlah ada perbuatan yang membahayakan dan jangan pula membalas bahaya.\" {cite:muwatta-maruf-1997 p.290}"
