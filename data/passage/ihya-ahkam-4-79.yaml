text: "… كان هذا المسلم تاجرا ً وقد شاع في البلد معاملة الربا وجب عليه تعلم الحذر من الربا وهذا هو الحق في العلم الذي هو فرض عين ومعناه العلم بك يفية العمل الواجب فمن علم العلم الواجب ووقت وجوبه فقد علم …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 79، يرد فيه ذكر الفرض، وفرض العين، والواجب، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 79, whose wording mentions the obligatory (fard), the individual obligation (fard 'ayn), the obligatory (wajib), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 79 کا اقتباس جس میں فرض، فرضِ عین، واجب، وجوب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
