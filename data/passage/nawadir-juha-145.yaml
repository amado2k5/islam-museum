text: "… كل عشر علب كيلة واحدة بينما كان يحتطبُ في أحد الأيام، رأى أرنباً فصاده، وكان حتى تلك الساعة، لم يرَ أرنباً. فقال في نفسه: هذا حيوانٌ عجيبٌ يجب أنْ آخذَهُ إلى أهلٍ البلدة، وأُريَهم إيَّاه فلعلِّي أجِدِّ من يعرف ما …"
summary:
  ar: "أمسك جحا أرنبًا بريًا لم يره من قبل، وحمله إلى البيت؛ ففتحت زوجته الكيس فهرب الأرنب، فملأته بعلب الشعير؛ وجاء الوجهاء ففُتح الكيس فسقطت علبة فارغة، فقال جحا إن كل عشر علب ملأى تساوي كيلة واحدة، وهي وحدة قياس. {cite:juha-nawadir-kubra-djuwaydi p. 68}"
  en: "Juha catches a hare, which he has never seen, and takes it home; his wife opens the sack and the hare escapes, so she fills it with tins of barley; notables come and the sack is opened; out falls an empty tin, so Juha says every ten full tins equal one kail, a unit of measure. {cite:juha-nawadir-kubra-djuwaydi p. 68}"
  ur: "جحا نے ایک خرگوش پکڑا جو اس نے پہلے کبھی نہیں دیکھا تھا اور گھر لے آیا؛ بیوی نے تھیلا کھولا تو خرگوش بھاگ گیا، اس نے تھیلے کو جو کے ڈبوں سے بھر دیا؛ معززین آئے اور تھیلا کھولا گیا تو ایک خالی ڈبہ گرا؛ جحا نے کہا کہ ہر دس بھرے ڈبے ایک کیلہ کے برابر ہیں، جو ناپ کی ایک اکائی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 68}"
  fr: "Juha attrape un lièvre, qu'il n'a jamais vu, et le rapporte chez lui; sa femme ouvre le sac et le lièvre s'enfuit, alors elle le remplit de boîtes d'orge; des notables arrivent et le sac est ouvert; une boîte vide tombe, et Juha dit que dix boîtes pleines valent un kail, une mesure. {cite:juha-nawadir-kubra-djuwaydi p. 68}"
  es: "Juha atrapa una liebre, que nunca había visto, y la lleva a casa; su mujer abre el saco y la liebre escapa, así que lo llena de latas de cebada; llegan unos notables y se abre el saco; cae una lata vacía, y Juha dice que cada diez latas llenas equivalen a un kail, una medida. {cite:juha-nawadir-kubra-djuwaydi p. 68}"
