text: "لئلا يجب عليه الرجم إذا زنى. وأيضا فلو كان مطلوبا لم يكن من باب خطاب الوضع؛ وقد فرضناه كذلك. هذا خلف. والحكم فيه ظاهر. فإذا توجه قصد المكلف إلى فعل الشرط أو إلى تركه، من حيث هو فعل داخل تحت"
