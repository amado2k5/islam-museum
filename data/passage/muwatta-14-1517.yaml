label: { ar: "الموطأ 1517 — يحيى بن سعيد عن القاسم بن محمد عن عائشة: سئلت عن رجل طلق امرأته البتة فتزوجها آخر فطلقها قبل أن يمسها، فقالت لا حتى يذوق عسيلتها", en: "Muwatta 1517", es: "Muwatta 1517", fr: "Muwatta 1517", ur: "موطا 1517", tr: "El-Muvatta 1517 — Yahya ibn Said, el-Kasım ibn Muhammed'den, o da Aişe'den rivayetle: Bana, karısını geri dönülmez bir şekilde boşayan bir adam hakkında soru soruldu; sonra başka bir adam onunla evlendi ve evliliği tamamlamadan önce boşandı. Aişe şöyle dedi: Hayır, onun tatlılığını tatmadan önce değil.", id: "Al-Muwatta 1517 — Yahya ibn Saeed, berdasarkan riwayat al-Qasim ibn Muhammad, berdasarkan riwayat Aisyah: Aku ditanya tentang seorang pria yang menceraikan istrinya secara mutlak, kemudian pria lain menikahinya dan menceraikannya sebelum melakukan hubungan suami istri. Dia berkata: Tidak, tidak sampai dia merasakan kemanisannya." }
text: "حَتَّى يَذُوقَ عُسَيْلَتها"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد عن عائشة زوج النبي أنها سئلت عن رجل طلق امرأته البتة، فتزوجها رجل آخر، فطلقها قبل أن يمسها، هل يصلح لزوجها الأول أن يتزوجها؟ فقالت عائشة لا، حتى يذوق عسيلتها. ويذكر المحقق أن ابن وهب وصله عن المسور عن الزبير عن أبيه، وأن النسائي رجح المرسل، وأن الزبير مجهول، وأن القصة في الصحيحين من حديث عروة عن عائشة. {cite:muwatta-maruf-1997 p.37}"
  tr: "Malik, Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den, o da Peygamberimizin eşi Ayşe'den rivayet eder ki, kendisine bir adamın karısını geri dönülmez bir şekilde boşadığı, sonra başka bir adamla evlendiği ve evliliği tamamlamadan önce boşandığı sorulmuştur. İlk kocasının onunla tekrar evlenmesi caiz midir? Ayşe şöyle cevap vermiştir: \"Hayır, onun tatlılığını tatmadıkça caiz değildir.\" Araştırmacı, İbn Vahb'ın bu rivayeti el-Miswar'dan, o da el-Zübeyr'den, o da babasından rivayet ederek birleştirdiğini, el-Nesai'nin ise mursal (bağlantısız) rivayeti tercih ettiğini, el-Zübeyr'in bilinmediğini ve bu hikayenin iki Sahih'te (Buhari ve Müslim) Urve'den, o da Ayşe'den rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.37}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, dari Aisyah, istri Nabi, bahwa ia ditanya tentang seorang pria yang menceraikan istrinya secara mutlak, kemudian pria lain menikahinya, dan kemudian menceraikannya lagi sebelum melakukan hubungan suami istri. Apakah diperbolehkan bagi suami pertamanya untuk menikahinya kembali? Aisyah menjawab, \"Tidak, tidak sampai dia merasakan kemanisannya.\" Peneliti menyebutkan bahwa Ibn Wahb menghubungkan riwayat ini dari al-Miswar, dari al-Zubayr, dari ayahnya, dan bahwa al-Nasa'i menganggap riwayat mursal (terpisah) lebih disukai, dan bahwa al-Zubayr tidak dikenal, dan bahwa kisah ini ditemukan dalam dua kitab Sahih (Bukhari dan Muslim) dari Urwah, dari Aisyah. {cite:muwatta-maruf-1997 p.37}"
