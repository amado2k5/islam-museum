label: { ar: "الموطأ 1517 — يحيى بن سعيد عن القاسم بن محمد عن عائشة: سئلت عن رجل طلق امرأته البتة فتزوجها آخر فطلقها قبل أن يمسها، فقالت لا حتى يذوق عسيلتها", en: "Muwatta 1517" }
text: "حَتَّى يَذُوقَ عُسَيْلَتها"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد عن عائشة زوج النبي أنها سئلت عن رجل طلق امرأته البتة، فتزوجها رجل آخر، فطلقها قبل أن يمسها، هل يصلح لزوجها الأول أن يتزوجها؟ فقالت عائشة لا، حتى يذوق عسيلتها. ويذكر المحقق أن ابن وهب وصله عن المسور عن الزبير عن أبيه، وأن النسائي رجح المرسل، وأن الزبير مجهول، وأن القصة في الصحيحين من حديث عروة عن عائشة. {cite:muwatta-maruf-1997 p.37}"
