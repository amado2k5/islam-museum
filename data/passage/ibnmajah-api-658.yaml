label: { ar: "سنن ابن ماجه 658 — تربية الأب ووصيته", en: "Sunan Ibn Majah 658 — the father raising and counselling", ur: "سنن ابن ماجہ 658 — باپ کی تربیت اور نصیحت", es: "Sunan Ibn Majah 658 — El padre que cría y aconseja", fr: "Sunan Ibn Majah 658 — l'éducation et les conseils du père", tr: "Sunan İbn Majah 658 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan Ibn Majah 658 — Didikan dan Wasiat Ayah" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا وَكِيعٌ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ مُحَمَّدِ بْنِ زِيَادٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ رَأَيْتُ النَّبِيَّ ـ حَامِلَ الْحُسَيْنِ بْنِ عَلِيٍّ عَلَى عَاتِقِهِ وَلُعَابُهُ يَسِيلُ عَلَيْهِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 658، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 658 (The Book of Purification and its Sunnah), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 658، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 658 (El Libro de la Purificación y su Sunnah), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 658 (Le Livre de la Purification et sa Sunna), mentionne le rôle du père dans l'éducation et les conseils. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au rôle du père."
  tr: "İbn Majah'ın Sünen'inde yer alan 658 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 658, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini dikumpulkan oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
