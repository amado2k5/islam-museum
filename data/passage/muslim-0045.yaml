label: { ar: "مسلم 45 — لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه", en: "Muslim 45 — None of you believes until he loves for his brother what he loves for himself", es: "Musulmán 45 — Ninguno de vosotros cree hasta que ame para su hermano lo que ama para sí mismo", fr: "Muslim 45 — Nul d’entre vous n’est croyant tant qu’il n’aime pas pour son frère ce qu’il aime pour lui-même.", ur: "مسلم 45 - تم میں سے کوئی اس وقت تک مومن نہیں ہو سکتا جب تک وہ اپنے بھائی کے لیے وہی پسند نہ کرے جو اپنے لیے پسند کرتا ہے۔", tr: "Müslim 45 — Sizden hiç kimse, kendisi için sevdiğini kardeşi için de sevmedikçe gerçek anlamda iman etmiş sayılmaz." }
text: "قال رسول الله: «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»"
summary:
  ar: "رواية أنس بن مالك في باب الدليل على أن من خصال الإيمان أن يحب لأخيه المسلم ما يحب لنفسه من الخير من كتاب الإيمان في صحيح مسلم."
  tr: "Sahih Müslim'in İman Kitabı'nda, deliller bölümünde Enes bin Malik'in rivayetine göre, imanın özelliklerinden biri de, kişinin kendisi için sevdiği iyiliği Müslüman kardeşi için de sevmesidir."
  id: "Riwayat Anas bin Malik dalam bab tentang bukti bahwa salah satu ciri iman adalah mencintai sesama Muslim seperti mencintai diri sendiri, yaitu kebaikan, dari Kitab Iman dalam Sahih Muslim."
