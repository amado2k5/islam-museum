text: |-
  ١٣٢
  •⁦(فصل الحاء)⁩.
  •⁦(حيك )⁩•
  أمه حشول الدرة ويقال ناقة حشود وحشود للى يجغع اللين فى ضرعهاسرإما وحنكت
  . النخلة أيضا كثر حلها وهى نخلة ساشك عن يعقوب وحشكت الناقة أى تركتها ولم أحلبها
  حتى اجتمع لبنها ومنه قول الشاعره غدت وهى عشوكة حافل• والحشال الشبام عن ابن
  دريد وه وعوديدرض فى فم الجدى ويشد فى قفاه يمنع-ه من الرضاع ولم يعرف أبو سعيه
  الشهال بتقديم التين وحتك القوم أى احتندوا واجتمعوا وحئكت الريح أى ضعفت
  واختلفت مهابم اورياح حواشك مختلفات المهاب قال أبو زيد الحشكة من المطرمثل الحفشة
  والغبية وهى فوق البغشة وقد حشكت السماء تحنك حشكا والحث ال بالتنديداسم نهر
  ⁦( جكل)⁩ - ككت الشى أحكد وماسك فى صدرى منه شئ أى ما تخالج ويقال مأحك فى
  صدرى كذا اذا لم ينشرح له صدرك واحتك بالشى أى حك نفسه عليه وفلان يتحكك بى
  أى يترس ويتعرّض لشرّى والحاكة كالمباراة والحكة بالحكسز الحرب وقولهم
  ما بقيت فيه ساكة أى سنّ والحكان بالتحريك جارة رخوة بيض وانماظهر فيه التضعيف
  للفرق بين فعل وفعل والحكيك الحافر النجيت والكعب المحكوك والحكاكة بالضم ما يسقط
  عن الشئ عند الخك والجذل المحكك الذى نصب فى العطن تحتك به الابل الجربى ومنه قول
  الحباب بن المندّر الانصارى يوم سقيفة بنى ساعدة أنا جذيلها المعكان وعذيقها المرجب
  أراد أنه يشتف برأيه وتدبيره ⁦(حاذ)⁩ -لك الشى يحلك حلوكة اشتدسواده واحلولك
  مثاء والحلت السواد يقنال أسود مثل حلك الغراب وهوسواده فان قلت مثل حنك الغراب
  تريدمنقاره وأسود حالك وحانك ععنى والخلكوك بالتحريك الشديد السواد والحلكة
  مثال الهمزة ضرب من العظاء ويقال دويية نغوص فى الرمل وكذلك الحلكامثال العنقاء
  ( سك قال أبوزيد الممكة القملة وجعهاحد قال وقد يقال ذلك للذرّة والحك الصغار
  من كل شى⁦(حنك)⁩ حنكت القرس أحنكه وأحنكه حنكا اذا جعلت فى فيه الرسن وكذلك
  احتنكته واحتنك الجراد الارض أى أكل ما عليها وأتى على بدءاوقولد تعالى خاكيا عن
  ايليس لا حتنكن ذريته الاقليلا قال الفراءيريدلا ستولين عليهم وحنكت الشى فهمته
  وأحكمته واحتنك الرجل أى استحكم والاسم الحنكة والحنكة أيضا القدق التى تضم
  و العراصيف والجمع حنال مثل برمة وبرام حكاه أبو عبيد والحنك المنقاريقال أسود مثل
  منك الغراب وأسود حانك مثل حالل والحنك ما تحت الذقِن من الانسان وغيره وحنسكن
  الصبى وحنكته اذاء ضغت ترا أو غيره ثم دلكنه جهنكه والصبى محنوكك ومحنك والتحنك
  التلجى وهو أن تدير العمامة من تجت الحنك ويقال حنكته الن وأحنكته اذا أحكمته
  التجَارب والامور فهو عذكْ ومخسك وقولهم هذا البعيرا حنك الابل مشتق من الحنل
  يريدون أشدها أكلا وهو شاذلات انخلقة لا يقال فيهاما أفعله (حول حاذ النوب
  يحوكه -وكاوحياكة نجه فهو حائك وقوم حاكة وحوكة أيضا ونسوة حوائك
  والموضع محاكة واتما قالوا حوكة كما قالواخونة ثبنت الواوفيه ما مع التحرك كماثبتت فيما
  ردّالى الاصل لتباعد الواومن الالف ولم تجى الياء فى ناب وعارلشبه الياه بالالف لانها اليها
  أقرب و بها أحق وقدذ كرناعلة غيب وصيد فموضعهما والحوك الباذروج ⁦( بك )⁩
  الحردان
