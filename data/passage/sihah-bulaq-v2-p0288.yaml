text: |-
  • ⁦(ياب الميم)⁩
  ٢٩٩
  الاستلام وأسلم من الاسلام وأسله أى خذله والتسالم التصالح والمسالمة المصالحة واستلم
  لجر لمسه امًا بالقبلة أوباليد ولايمم زلانه مأخوذ من السلام وهو الحجر كماتة ول استنوق
  الجل وبعضهم ي مزه واستسلم أى انقاد وسات الجلد أسله بالمكسراذادبغته بالسلم قال لبيد
  بمقابل سرب الخارز عدهِ • قلق الحالة جارن مسلوم
  والاسيلم عرق بين الخنصر والبنصر والسلام بالكسرماه قال بشر
  كان قتودى على أحقب • يربد نحو صانؤم السلاما
  س تي السلتم بالكسر المداهية والفول والسنة الصغبة ( ج السليم الطويل
  والسلاجم سهام طوال النصال ويقال جل سلجم وسلاجم بالضم والجمع فيهماسلاجم
  بالفتح ( لهم سلهم بالكسراسم رجل قال أبو عبيد المسلهم المتغير فى جسمه ولونه وقد
  اسلهم لونه اسلهما ما وسلهم حىّ من مذج م لسم" الثقب ومنه سم انطياط وسهوم
  الانسان وسمامه فه ومنخره وأذنه الواحدسم"وسم وكذلك السم "القائل يضم ريفتح
  ويجمع ء-لى سموم وممام ومام الجسد ثقبه والسم كل شى كلودع يخرج من البحرفال
  الفراءماله سم" ولاحتم غيرل: وقد يضمان أيضا والسمان عرقان فى خيشوم الفرس وسمه
  أى سقاه المسمّ وسمّ الطعام أى جعل فيه السم" ومحمت سهك أى قصدت قصدك وسممت
  بينهماسما أى أصلحت وسحمت القارورة ونحوها أى سددت وسهت النعمة أى خصت
  قال العجاج هو الذى أنعم نعمى عمت • عسلى الذين أسلموا وسمت
  أى بلغت الكل والسامة الخاصة بقال كيف الساقة والعامة والساقة ذات السم وسام
  أبرص من كبار الوزغ قال الاموى أهدل المعة الخاصة والاقارب وأهل المنحاة
  الذين ليسوا بأقارب وفسلان يسمتذلك الاحر بالضم أى يسسبره وينظر ماغوره والسموم
  الرجح الحارّة نونت بقال منه سم يومنافهويوم مسموم واجمع سمائم قال أبو عبيدة السموم
  بالنهارود تسكون بالليل والحرور بالفيسل وقد تكون بالنهار والسمام بالفتح بجمع سمامة وهو
  ضرب من الطير والناقة السريعة أيضاءن أبى زيد والسمسم بالفتح هو الثعلب وسمسم
  أيضاموضع وقال ١ بحم أو عن يعين حسم • ورجل سام أى خفيف سريع
  وسممانى بالضم منلد والسمسم بالكسرحبة الحلْ والسمسمة الخلة الجراء واله-ع سمامم
  ( سنم السنام واحد أسمة الابل وسنام الارض بحرها ووسطها وأسخة بفتح
  الهمزة وضم النون أسكمة معروفة بقرب طخفة قال بشر
  كأن ظيا أستمة عليها • كوانس قالصاعتها المغار
  ونيت ستم أى مر تفع وهو الذى خرجت سمته وهوما يعلورأ--ه كالسقبل قال الراجز
  والحازباز السنم المجودا • وبعير ستم أى عظيم السنام وماءستم على وجه الارض وأستم
  الدخان أى ارتفع وقال ٢ كدخان نارساطع اسنامها * وتسنه أى علاه وقول تعالى
  ومزاجه من تسنيم قالواهوماء فى الجنة سحى بذلك لانه يجرى فوق الغرف والقصور ونسفيم
  القيز خلاف تسطيحه وم السومة بالضم العلامة تجعلء-لى الشاة وفى الحوب
  |أيضاتقول منه تسوم وفى الح-ديت تسوموافان الملائكة قد تسومت وسومت فلاناف مالى
  فى نضة زيادة الراجز
  وأول البيت
  يادارسلى يا اسلمى ثم اسلى
  ⁦(٢)⁩ فى نسضة زيادة لدوأول
  المدت
  مشحولة غلات بنسابت عرفج
