label: { ar: "الموطأ 439 — عبد الله بن الأرقم: إذا أراد أحدكم الغائط فليبدأ به قبل الصلاة", en: "Muwatta 439", es: "Muwatta 439", fr: "Muwatta 439", ur: "موطا 439", tr: "El-Muvatta 439 — Abdullah ibn el-Arkam: Eğer biriniz tuvalet ihtiyacını gidermek isterse, namazdan önce bunu yapsın.", id: "Al-Muwatta 439 — Abdullah ibn al-Arqam: Jika salah seorang dari kalian perlu buang air, hendaklah ia melakukannya sebelum shalat." }
text: "إذا أراد أحدكم الغائط فليبدأ به قبل الصلاة"
summary:
  ar: "أول حديث في باب النهي عن الصلاة والإنسان يريد حاجته. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه: كان عبد الله بن الأرقم يؤم أصحابه، فحضرت الصلاة يوماً فذهب لحاجته ثم رجع وروى عن النبي أن من أراد الغائط فليبدأ به قبل الصلاة. ويخرّجه المحقق عند الترمذي (142) والنسائي (2/110) وابن حبان وأبي داود (88) وأحمد والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن زهيراً وابن عيينة وحماد بن زيد ووكيعاً وجماعة رووه عن هشام عن أبيه عن عبد الله بن الأرقم كرواية مالك، وأن وهيباً وأنس بن عياض وشعيب بن إسحاق أدخلوا بين عروة وابن الأرقم رجلاً ⁦(التمهيد 22/203–204)⁩؛ ويرجح المحقق رواية مالك لأن عروة سمعه من ابن الأرقم يقيناً كما في مصنف عبد الرزاق. {cite:muwatta-maruf-1997 p.226} {cite:muwatta-maruf-1997 p.227}"
  tr: "Namaz kılarken tuvalet ihtiyacı duymanın yasaklanması bölümündeki ilk hadis, Yahya'nın Malik'ten, o da Hişam ibn Urve'den, o da babasından rivayet ettiği bir hadistir: Abdullah ibn el-Arkam, arkadaşlarına namaz kıldırıyordu. Bir gün namaz vakti gelince, tuvalet ihtiyacını gidermek için gitti ve sonra geri döndü. Peygamberimizden rivayet ettiğine göre, tuvalet ihtiyacı duyan kimse namazdan önce bunu yapmalıdır. Araştırmacı, bu hadisi Tirmizi (142), Nesai (2/110), İbn Hibban, Ebu Davud (88), Ahmed, Şafiî ve Beyhaki'nin hadis külliyatlarına, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla dahil etmiştir. İbn Abdülberr'in Zuhayr, İbn Uyaynah, Hammad ibn Zayd, Waki' ve bir grup başkasının bunu Hişam'dan, onun babasından ve Abdullah ibn el-Arkam'dan rivayet ettiğini söylediğini aktarıyor; bu rivayet Malik'in rivayetine benzer. Ayrıca Wahb, Enes ibn İyad ve Şuayb ibn İshak'ın Urve ile İbn el-Arkam arasına bir adam yerleştirdiğini belirtiyor (el-Tamhid 22/203-204). Araştırmacı, Urve'nin bunu İbn el-Arkam'dan kesin olarak duyduğunu, Musannaf Abdül-Razzaq'ta belirtildiği gibi, Malik'in rivayetine öncelik veriyor. {cite:muwatta-maruf-1997 s.226} {cite:muwatta-maruf-1997 s.227}"
  id: "Hadits pertama dalam bab tentang larangan shalat ketika perlu buang air besar diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya: Abdullah ibn al-Arqam memimpin para sahabatnya shalat. Suatu hari, waktu shalat tiba, lalu ia pergi buang air besar dan kemudian kembali. Ia meriwayatkan dari Nabi bahwa siapa pun yang perlu buang air besar hendaknya melakukannya sebelum shalat. Peneliti memasukkannya dalam kumpulan hadits al-Tirmidhi (142), al-Nasa'i (2/110), Ibn Hibban, Abu Dawud (88), Ahmad, al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa Zuhayr, Ibnu Uyaynah, Hammad ibn Zayd, Waki', dan sekelompok lainnya meriwayatkan hadits ini atas otoritas Hisham, atas otoritas ayahnya, atas otoritas Abdullah ibn al-Arqam, serupa dengan riwayat Malik. Ia juga menyatakan bahwa Wahb, Anas ibn Iyad, dan Shu'ayb ibn Ishaq menyisipkan seorang pria di antara Urwah dan Ibnu al-Arqam (al-Tamhid 22/203-204). Peneliti lebih memilih riwayat Malik karena Urwah mendengarnya dari Ibnu al-Arqam dengan pasti, sebagaimana disebutkan dalam Musannaf Abd al-Razzaq. {cite:muwatta-maruf-1997 p.226} {cite:muwatta-maruf-1997 p.227}"
