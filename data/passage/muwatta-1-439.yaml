label: { ar: "الموطأ 439 — عبد الله بن الأرقم: إذا أراد أحدكم الغائط فليبدأ به قبل الصلاة", en: "Muwatta 439" }
text: "إذا أراد أحدكم الغائط فليبدأ به قبل الصلاة"
summary:
  ar: "أول حديث في باب النهي عن الصلاة والإنسان يريد حاجته. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه: كان عبد الله بن الأرقم يؤم أصحابه، فحضرت الصلاة يوماً فذهب لحاجته ثم رجع وروى عن النبي أن من أراد الغائط فليبدأ به قبل الصلاة. ويخرّجه المحقق عند الترمذي (142) والنسائي (2/110) وابن حبان وأبي داود (88) وأحمد والشافعي والبيهقي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن زهيراً وابن عيينة وحماد بن زيد ووكيعاً وجماعة رووه عن هشام عن أبيه عن عبد الله بن الأرقم كرواية مالك، وأن وهيباً وأنس بن عياض وشعيب بن إسحاق أدخلوا بين عروة وابن الأرقم رجلاً (التمهيد 22/203–204)؛ ويرجح المحقق رواية مالك لأن عروة سمعه من ابن الأرقم يقيناً كما في مصنف عبد الرزاق. {cite:muwatta-maruf-1997 p.226} {cite:muwatta-maruf-1997 p.227}"
