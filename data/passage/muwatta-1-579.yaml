label: { ar: "الموطأ 579 — عروة: إنما أنزلت آية الإسراء في عدم الجهر بالصلاة ولا المخافتة بها في الدعاء؛ ومالك: لا بأس بالدعاء في المكتوبة", en: "Muwatta 579", es: "Muwatta 579", fr: "Muwatta 579", ur: "موطا 579", tr: "El-Muvatta 579 — Urve: İsra ayeti, namazda yüksek sesle okumanın ve dua ederken fısıldamanın sakıncalı olduğuna dair indirilmiştir; ve Malik: Farz namazlarda dua etmekte bir sakınca yoktur.", id: "Al-Muwatta 579 — Urwah: Ayat Isra’ diturunkan mengenai larangan membaca dengan suara keras dalam salat dan larangan berbisik dalam berdoa; dan Malik: Tidak ada salahnya berdoa dalam salat wajib" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: إنما أنزلت آية سورة الإسراء التي تنهى عن الجهر بالصلاة وعن المخافتة بها وتأمر بابتغاء سبيل بين ذلك [[passage/quran-17-110|الإسراء 110]] في الدعاء. ويضيف يحيى: وسئل مالك عن الدعاء في الصلاة المكتوبة، فقال: لا بأس بالدعاء فيها. ويذكر المحقق أن قول عروة رواه عن مالك أبو مصعب وسويد، وأنه حديث صحيح من حديث هشام بن عروة عن أبيه عن عائشة أخرجه البخاري (6327) من طريق مالك بن سعير عن هشام، والطبري في التفسير من طريق ابن المبارك وسفيان عن هشام، وأن قول مالك رواه عنه أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.298} {cite:muwatta-maruf-1997 p.299}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından naklederek şöyle buyurmuştur: “İsra Suresi'nde namazı sesli ve sessiz kılmayı yasaklayan ve ikisi arasında orta yolu emreden ayet [İsra Suresi 17-110]] dua hakkında nazil olmuştur.” Yahya şöyle ekliyor: “Malik'e farz namazlardaki dua hakkında soru soruldu ve o şöyle dedi: ‘Onlarda dua etmekte bir sakınca yoktur.’” Araştırmacı, Urva'nın bu sözünün Malik'ten, Ebu Musab ve Suveyd tarafından nakledildiğini ve Hişam ibn Urva'dan, o da babasından, o da Aişe'den nakledilmiş sahih bir hadis olduğunu belirtiyor. Bu hadis, Malik ibn Sa'ir'in Hişam'dan rivayet ettiği naziliyet yoluyla Buhari (6327) tarafından, İbn Mübarek ve Sufyan'ın Hişam'dan rivayet ettiği naziliyet yoluyla da Taberi'nin tefsirinde kaydedilmiştir. Malik'in bu sözü, Ebu Mus'ab ve Suveyd tarafından da kendi rivayetiyle nakledilmiştir. {cite:muwatta-maruf-1997 s.298} {cite:muwatta-maruf-1997 s.299}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, yang juga dari ayahnya, yang berkata: “Ayat dalam Surah Al-Isra’ yang melarang membaca salat dengan suara keras dan membaca salat dengan suara pelan, dan memerintahkan untuk mencari jalan tengah antara keduanya [[ayat/quran-17-110|Al-Isra’ 110]] diturunkan berkaitan dengan doa.” Yahya menambahkan: “Malik ditanya tentang doa dalam salat wajib, dan beliau berkata: ‘Tidak ada salahnya berdoa di dalamnya.’” Peneliti menyebutkan bahwa pernyataan Urwah diriwayatkan dari Malik oleh Abu Mus’ab dan Suwaid, dan bahwa itu adalah hadits sahih dari Hisham ibn Urwah, dari ayahnya, dan dari Aisyah. Hadits ini diriwayatkan oleh Al-Bukhari (6327) melalui sanad Malik bin Sa'ir dari Hisham, dan oleh At-Tabari dalam tafsirnya melalui sanad Ibnu Al-Mubarak dan Sufyan dari Hisham. Pernyataan Malik diriwayatkan dari Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.298} {cite:muwatta-maruf-1997 p.299}"
