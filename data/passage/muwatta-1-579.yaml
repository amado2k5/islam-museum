label: { ar: "الموطأ 579 — عروة: إنما أنزلت آية الإسراء في عدم الجهر بالصلاة ولا المخافتة بها في الدعاء؛ ومالك: لا بأس بالدعاء في المكتوبة", en: "Muwatta 579" }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: إنما أنزلت آية سورة الإسراء التي تنهى عن الجهر بالصلاة وعن المخافتة بها وتأمر بابتغاء سبيل بين ذلك [[passage/quran-17-110|الإسراء 110]] في الدعاء. ويضيف يحيى: وسئل مالك عن الدعاء في الصلاة المكتوبة، فقال: لا بأس بالدعاء فيها. ويذكر المحقق أن قول عروة رواه عن مالك أبو مصعب وسويد، وأنه حديث صحيح من حديث هشام بن عروة عن أبيه عن عائشة أخرجه البخاري (6327) من طريق مالك بن سعير عن هشام، والطبري في التفسير من طريق ابن المبارك وسفيان عن هشام، وأن قول مالك رواه عنه أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.298} {cite:muwatta-maruf-1997 p.299}"
