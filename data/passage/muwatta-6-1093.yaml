label: { ar: "الموطأ 1093 — هشام بن عروة: سودة بنت عبد الله بن عمر كانت عند عروة بن الزبير، فخرجت تطوف بين الصفا والمروة في حج أو عمرة ماشية، وكانت امرأة ثقيلة، فلم تقض طوافها حتى نودي بالأولى من الصبح، فقضت طوافها", en: "Muwatta 1093", es: "Muwatta 1093", fr: "Muwatta 1093", ur: "موطا 1093", tr: "El-Muvatta 1093 — Hişam ibn Urve: Sawdah bint Abdullah ibn Umar, Urve ibn el-Zübeyr ile evliydi. Hac veya Umre sırasında Safa ile Merve arasında yürüyerek tavaf yapmaya çıktı ve kilolu bir kadındı. Tavafını ancak sabah ezanı okunduğunda tamamladı.", id: "Al-Muwatta 1093 — Hisham ibn Urwah: Sawdah bint Abdullah ibn Umar menikah dengan Urwah ibn al-Zubayr. Ia pergi melaksanakan Tawaf antara Safa dan Marwah dengan berjalan kaki selama Haji atau Umrah, dan ia adalah seorang wanita yang bertubuh besar. Ia tidak menyelesaikan Tawafnya sampai azan subuh berkumandang, sehingga ia menyelesaikan Tawafnya." }
summary:
  ar: "يرويه مالك عن هشام بن عروة، أن سودة بنت عبد الله بن عمر كانت عند عروة بن الزبير، فخرجت تطوف بين الصفا والمروة في حج أو عمرة، ماشية، وكانت امرأة ثقيلة، فجاءت حين انصرف الناس من العشاء، فلم تقض طوافها حتى نودي بالأولى من الصبح، فقضت طوافها فيما بينها وبينه. وكان عروة إذا رآهم يطوفون على الدواب ينهاهم أشد النهي، فيعتلون له بالمرض حياء منه، فيقول لنا فيما بيننا وبينه: لقد خاب هؤلاء وخسروا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1317) وسويد (545) وعبد الرحمن بن القاسم عند النسائي. {cite:muwatta-maruf-1997 p.501} {cite:muwatta-maruf-1997 p.502}"
  tr: "Malik, Hişam ibn Urve'den rivayet ettiğine göre, Hz. Abdullah ibn Ömer'in eşi Hz. Urve ibn el-Zübeyr'di. Hac veya Umre sırasında Safa ile Merve arasında sa'i yapmak için yürüyerek dışarı çıkardı, çünkü kilolu bir kadındı. İnsanlar yatsı namazını bitirdikten sonra oraya varır ve sa'iyi ancak sabah ezanının ilk okuna kadar tamamlayamazdı. Sonra sa'iyi gizlice, aramızda tamamlardı. Urve, onların hayvanlar üzerinde sa'i yaptıklarını görünce, bunu yapmalarını şiddetle yasaklardı. Utançtan hasta numarası yaparlardı. Bunun üzerine Urve bize gizlice, \"Bu insanlar başarısız oldular ve kaybettiler\" derdi. Araştırmacı, bunun Malik'ten Ebu Musab (1317), Suveyd (545) ve Abdülrahman ibn el-Kâsım tarafından rivayet edildiğini ve el-Nasaî tarafından kaydedildiğini belirtiyor. {cite:muwatta-maruf-1997 s.501} {cite:muwatta-maruf-1997 s.502}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, bahwa Sawdah binti Abdullah ibn Umar menikah dengan Urwah ibn al-Zubayr. Ia pergi untuk melakukan Sa'i antara Safa dan Marwa selama Haji atau Umrah, berjalan kaki, karena ia adalah wanita yang bertubuh besar. Ia tiba setelah orang-orang selesai melaksanakan shalat Isya dan tidak menyelesaikan Sa'i-nya sampai azan subuh pertama. Kemudian ia menyelesaikannya secara pribadi antara dia dan kami. Ketika Urwah melihat mereka melakukan Sa'i pada hewan, ia akan melarang mereka dengan keras. Karena malu, mereka akan berpura-pura sakit. Kemudian ia akan berkata kepada kami secara pribadi, \"Orang-orang ini telah gagal dan kalah.\" Peneliti menyebutkan bahwa hal itu diriwayatkan dari Malik oleh Abu Mus'ab (1317), Suwaid (545), dan Abd al-Rahman ibn al-Qasim, sebagaimana dicatat oleh al-Nasa'i. {kutip:muwatta-maruf-1997 hal.501} {kutip:muwatta-maruf-1997 hal.502}"
