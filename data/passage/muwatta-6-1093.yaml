label: { ar: "الموطأ 1093 — هشام بن عروة: سودة بنت عبد الله بن عمر كانت عند عروة بن الزبير، فخرجت تطوف بين الصفا والمروة في حج أو عمرة ماشية، وكانت امرأة ثقيلة، فلم تقض طوافها حتى نودي بالأولى من الصبح، فقضت طوافها", en: "Muwatta 1093" }
summary:
  ar: "يرويه مالك عن هشام بن عروة، أن سودة بنت عبد الله بن عمر كانت عند عروة بن الزبير، فخرجت تطوف بين الصفا والمروة في حج أو عمرة، ماشية، وكانت امرأة ثقيلة، فجاءت حين انصرف الناس من العشاء، فلم تقض طوافها حتى نودي بالأولى من الصبح، فقضت طوافها فيما بينها وبينه. وكان عروة إذا رآهم يطوفون على الدواب ينهاهم أشد النهي، فيعتلون له بالمرض حياء منه، فيقول لنا فيما بيننا وبينه: لقد خاب هؤلاء وخسروا. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1317) وسويد (545) وعبد الرحمن بن القاسم عند النسائي. {cite:muwatta-maruf-1997 p.501} {cite:muwatta-maruf-1997 p.502}"
