text: "… شعب الإيمان عن أنس بن مالك معلقاً. وفي عن أحمد بن أبي الحواري، موقوفاً. ورواه أيضاً في عن مالك بن دينار، موقوفاً. قال فتح الموصلي : المحبُّ لله لا يَغْفُلُ عن ذكر اللّٰه طرفةَ عين، قال ذو النون : من …"
