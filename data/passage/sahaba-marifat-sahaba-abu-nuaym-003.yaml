text: "لت عليه فأعطيته الكتاب، فقرئ عليه: (بسم الله الرحمن الرحيم، من محمد رسول الله، إلى قيصر صاحب الروم، ⁦(٦)⁩ [فنخر ابن أخ له أحمر أزرق سبط، فقال: لا تقرأ الكتاب اليوم؛ لأنه بدأ بنفسه، وكتب صاحب الروم، ولم يكتب ملك"
