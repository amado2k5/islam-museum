text: "… والنصاري والملل كاها الحنيفية دين إِبراهيم، فأما ورقة بن نوفل فتنصر واستحكم في النصرانية واتبع الكتب من أهلها حتى علم عاما كثيراً من أهل الكتاب، ولم يكن منهم أعدل أمراً ولا أعدل شأنًا من زيد بن نفيل، فإنه اعتزل الأوثان …"
