text: "… قال النبي وَلفي فيما يحكيه عن ربه: وما تقرب إليّ عبدي بشيء أحب إليّ مما افترضته عليه. وقال إمام الحرمين: قال الأئمة: خصَّ اللّٰه تعالى نبيه للقه بإيجاب أشياء لتعظيم ثوابه، فإن ثواب الفرائض يزيد على ثواب المندوبات بسبعين درجة. …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 5، ص 107، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، وما فُرض على الناس، والوجوب، والمندوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 5, p. 107, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, what was made obligatory on people, obligation (wujub), the recommended (mandub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 5، ص 107 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، وجوب، مندوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kuwaiti Encyclopaedia de Fiqh, volume numérisé 5, p. 107, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, l'obligation (wujub), le recommandé (mandub) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kuwaiti Encyclopaedia de Fiqh, volumen digitalizado 5, p. 107, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, la obligatoriedad (wujub), lo recomendado (mandub); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 5, sayfa 107'den bir alıntı, farz olan fiilleri ve bunların çoğullarını, Allah ve Resulü'nün emrettiklerini, insanlar için farz olanları ve gerekli ve tavsiye edilenleri ele almaktadır. Bu alıntı, makine tarafından okunabilir, taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen eylemler, mekruh edilen eylemler, haram olan eylemler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 5 Bergambar, halaman 107, membahas tentang amalan wajib dan bentuk jamaknya, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, apa yang wajib bagi manusia, dan apa yang dianjurkan dan disarankan. Kutipan ini berasal dari versi yang dapat dibaca mesin dan dipindai, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
