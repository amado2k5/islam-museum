text: "… البراءُ بنفسه عليهم، : ألا تستعملوا البراء بن مالك على فقاتلهم حتى فتح الباب، وبه بضعٌ وثمانون جراحة، من بين رميةٍ بسهمٍ وضربة، فحُمل إِلى جيشٍ من جيوش المسلمين، فإنَّه مهلكةٌ من المهالك يَقدُم بهم. رحله يُداوَى، فأقام عليه خالدٌ …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 2، ص 80، يذكر مداواة الجراح، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 2, p. 80, that mentions the treatment of wounds, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 2، ص 80 کا اقتباس جس میں زخموں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 2, pág. 80, que menciona el tratamiento de heridas y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 2, p. 80, qui mentionne le traitement des blessures et la recherche de soins; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İsti'ab\" adlı eserinin resimli 2. cildinin 80. sayfasında, yaraların tedavisi ve tıbbi müdahaleden bahsedilmektedir; makine tarafından okunabilir resimli versiyondan alınan metin, kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah kutipan dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 2, hlm. 80, menyebutkan pengobatan luka dan perawatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
