label: { ar: "سنن ابن ماجه 2808 — أثر من الآثار المحفوظة", en: "Sunan Ibn Majah 2808 — a relic kept after its owner", ur: "سنن ابن ماجہ 2808 — محفوظ آثار و تبرکات", es: "Sunan Ibn Majah 2808 — una reliquia conservada después de su dueño.", fr: "Sunan Ibn Majah 2808 — une relique conservée après son propriétaire" }
text: "حَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا ابْنُ الصَّلْتِ، عَنِ ابْنِ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ تَنَفَّلَ سَيْفَهُ ذَا الْفِقَارِ يَوْمَ بَدْرٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2808، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2808 (The Chapters on Jihad), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2808، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2808 (Los capítulos sobre la yihad), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan Ibn Majah, n° 2808 (Les chapitres sur le Jihad), mentionne une relique conservée après son propriétaire. Le navigateur de testaments la répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
