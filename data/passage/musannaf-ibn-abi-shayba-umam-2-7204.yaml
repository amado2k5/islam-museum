text: "… بطعامهم بأساً. - حدثنا وكيع قال: حدثنا سفيان عن أبي إسحاق عن قيس بن سكن الأسدي قال: قال عبدالله: إنكم نزلتم بين فارس والنبط فإذا اشتريتم لحماً، فإن كان ذبيحة يهوديّ أو نصرانيّ فكلوه، وإن ذبحه مجوسيّ فلا تأكلوه. - …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 7204، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 7204, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 7204 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
