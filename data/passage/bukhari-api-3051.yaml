label: { ar: "صحيح البخاري 3051 — الأب والأبوة", en: "Sahih al-Bukhari 3051 — the father and fatherhood", ur: "صحیح بخاری 3051 — باپ اور والدیت", es: "Sahih al-Bukhari 3051 — El padre y la paternidad", fr: "Sahih al-Bukhari 3051 — le père et la paternité", tr: "Sahih el-Buhari 3051 — Baba ve Babalık", id: "Sahih al-Bukhari 3051 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَبُو نُعَيْمٍ، حَدَّثَنَا أَبُو الْعُمَيْسِ، عَنْ إِيَاسِ بْنِ سَلَمَةَ بْنِ الأَكْوَعِ، عَنْ أَبِيهِ، قَالَ أَتَى النَّبِيَّ عَيْنٌ مِنَ الْمُشْرِكِينَ وَهْوَ فِي سَفَرٍ، فَجَلَسَ عِنْدَ أَصْحَابِهِ يَتَحَدَّثُ ثُمَّ انْفَتَلَ، فَقَالَ النَّبِيُّ \" اطْلُبُوهُ وَاقْتُلُوهُ \". فَقَتَلَهُ فَنَفَّلَهُ سَلَبَهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3051، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3051 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3051، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3051 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3051 (Le Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3051 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3051, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
