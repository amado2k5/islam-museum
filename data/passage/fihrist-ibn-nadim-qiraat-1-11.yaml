text: "… في الوَقْف والانتِدَاء في القُرْآن.. الكُتُبُ المُؤَلَّفَةُ في اخْتِلافِ المَصَاحِف.. الكُتُبُ المُؤَلَّفَّةُ في وَقْفِ التَّمَام....... الكُتُبُ المُؤَلَّفَةُ فيما اتَّفَقَت ألْفَاظُه و اخْتَلَفَت مَعَانِيه في القُرآن الكُتُبُ المُؤَلَّفَةُ في مُتَشَابِه القُرآن...... الكُتُبُ المُؤَلَّفَةُ في هِجَاءِ المُصْحَف.... الكُتُبُ المُؤَلَّفَةُ في مَقْطُوعِ القُرآن …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 11، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 1, p. 11, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 1، ص 11 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Fihrist de Ibn al-Nadim, volumen 1, pág. 11, que menciona la colección del Corán y los códices, la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Fihrist d'Ibn al-Nadim (tome 1, p. 11) mentionnant la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
