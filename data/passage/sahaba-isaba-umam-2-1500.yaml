text: "… على رسول اله ف فقال: مَنْ هَولاءِ الذِينَ كَأَنَّهُمْ مِنَ أهل الشام، وذكر أن علياً جلده ثمانين، ثم زاده الْهِنْدِ. عشرين؛ فقال له ما هذه العلاوة؛ فقال: لجرأتك على - النجاشي ملك الحبشة اسمه أصحمة: اللّٰه في شهر رمضان وصبياننا …"
