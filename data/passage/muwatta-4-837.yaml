label: { ar: "الموطأ 837 — عمر أفطر يوماً في رمضان في يوم ذي غيم ثم رأى أنه أمسى وغابت الشمس، فقال له رجل: طلعت الشمس، فقال عمر: الخطب يسير وقد اجتهدنا", en: "Muwatta 837", es: "Muwatta 837", fr: "Muwatta 837", ur: "موطا 837", tr: "Muvatta Suresi 837 — Ömer, Ramazan ayında bulutlu bir günde orucunu açtı. Akşam olduğunu ve güneşin battığını gördü. Bir adam ona, “Güneş doğdu” dedi. Ömer, “Mesele basittir, elimizden gelenin en iyisini yaptık” dedi.", id: "Al-Muwatta 837 — Suatu hari di bulan Ramadan, Umar berbuka puasa pada hari yang berawan, lalu ia melihat hari sudah senja dan matahari telah terbenam. Seorang pria berkata kepadanya: Matahari telah terbit. Umar berkata: Masalahnya sederhana dan kita telah melakukan yang terbaik." }
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن أخيه خالد بن أسلم، أن عمر بن الخطاب أفطر يوماً في رمضان في يوم ذي غيم، ورأى أنه قد أمسى وغابت الشمس، فجاءه رجل فقال: يا أمير المؤمنين طلعت الشمس. فقال عمر: الخطب يسير وقد اجتهدنا. قال مالك: يريد عمر بقوله «الخطب يسير» القضاء، فيما نرى، لخفة مؤونته ويساره، يقول: نصوم يوماً مكانه. ويذكر المحقق أن هذا الاسم «خالد بن أسلم» رواه سويد والشافعي عن مالك، ورواه أبو مصعب عن مالك عن زيد بن أسلم عن أبيه، وأن الشيباني رواه بلفظ «عن زيد بن أسلم أن عمر». {cite:muwatta-maruf-1997 p.407} {cite:muwatta-maruf-1997 p.408}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da kardeşi Halid ibn Aslam'dan rivayet ettiğine göre, Ömer ibn el-Hattab, Ramazan ayında bulutlu bir günde, akşamın geçtiğini ve güneşin battığını düşünerek orucunu bozdu. Yanına bir adam gelip, \"Ey Müminlerin Emiri, güneş doğdu\" dedi. Ömer, \"Mesele basittir, elimizden gelenin en iyisini yaptık\" diye cevap verdi. Malik dedi ki: Ömer, \"Mesele basittir\" sözüyle, anladığımız kadarıyla, kolay ve basit olduğu için kaçırdığı orucu kaza edebileceğini kastediyordu. \"Onun yerine başka bir gün oruç tutacağız\" dedi. Araştırmacı, \"Halid ibn Aslam\" isminin Suveyd ve Şafiî tarafından Malik'ten, Ebu Musab tarafından da Malik'ten, o da Zeyd ibn Aslam'dan, o da babasından rivayet edildiğini belirtiyor. El-Şeybani bunu şu şekilde rivayet etmiştir: \"Zayd ibn Aslam'dan rivayet edildiğine göre Ömer...\" {cite:muwatta-maruf-1997 s.407} {cite:muwatta-maruf-1997 s.408}"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, dari saudaranya Khalid ibn Aslam, bahwa Umar ibn al-Khattab berbuka puasa suatu hari di bulan Ramadan pada hari yang berawan, karena mengira malam telah berlalu dan matahari telah terbenam. Seorang pria datang kepadanya dan berkata, \"Wahai Amirul Mukminin, matahari telah terbit.\" Umar menjawab, \"Masalahnya sederhana, dan kami telah melakukan yang terbaik.\" Malik berkata: Umar bermaksud dengan ucapannya, \"Masalahnya sederhana,\" bahwa ia dapat mengganti puasa yang terlewat, sebagaimana yang kita pahami, karena kemudahan dan kesederhanaannya. Ia berkata, \"Kita akan berpuasa satu hari lagi sebagai penggantinya.\" Peneliti menyebutkan bahwa nama ini, \"Khalid ibn Aslam,\" diriwayatkan oleh Suwayd dan al-Shafi'i dari Malik, dan oleh Abu Mus'ab dari Malik, dari Zayd ibn Aslam, dari ayahnya. Al-Shaybani meriwayatkannya dengan redaksi, \"Dari Zayd ibn Aslam bahwa Umar...\" {cite:muwatta-maruf-1997 p.407} {cite:muwatta-maruf-1997 p.408}"
