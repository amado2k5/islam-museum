label: { ar: "الموطأ 837 — عمر أفطر يوماً في رمضان في يوم ذي غيم ثم رأى أنه أمسى وغابت الشمس، فقال له رجل: طلعت الشمس، فقال عمر: الخطب يسير وقد اجتهدنا", en: "Muwatta 837" }
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن أخيه خالد بن أسلم، أن عمر بن الخطاب أفطر يوماً في رمضان في يوم ذي غيم، ورأى أنه قد أمسى وغابت الشمس، فجاءه رجل فقال: يا أمير المؤمنين طلعت الشمس. فقال عمر: الخطب يسير وقد اجتهدنا. قال مالك: يريد عمر بقوله «الخطب يسير» القضاء، فيما نرى، لخفة مؤونته ويساره، يقول: نصوم يوماً مكانه. ويذكر المحقق أن هذا الاسم «خالد بن أسلم» رواه سويد والشافعي عن مالك، ورواه أبو مصعب عن مالك عن زيد بن أسلم عن أبيه، وأن الشيباني رواه بلفظ «عن زيد بن أسلم أن عمر». {cite:muwatta-maruf-1997 p.407} {cite:muwatta-maruf-1997 p.408}"
