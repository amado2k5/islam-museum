label: { ar: "الموطأ 2795 — كعب الأحبار ينهى عمر عن الخروج إلى العراق", en: "Muwatta 2795" }
summary:
  ar: "بلغ مالكا أن عمر بن الخطاب أراد الخروج إلى العراق، فقال له كعب الأحبار: لا تخرج إليها يا أمير المؤمنين، فإن بها تسعة أعشار السحر، وبها فسقة الجن، وبها الداء العضال. ويرى المحقق أن الأثر منقطع لا يصح، وإن صح فإن كعبا نقله من كتب اليهود. {cite:muwatta-maruf-1997 p.570}"
