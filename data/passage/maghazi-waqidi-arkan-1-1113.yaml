text: "… : اللَّهمّ، اشهدْ ! أيَّها الناس، إِنَّ الشيطان قد يئس أَن يُعبَد بأَرضكم هذه، ولكنه قد رضى أَن يُطاع فيما سِوى ذلك ممّا تَحقِرونه، فقد رضى به. إنَّ كلّ مسلم أَخو المسلم، وإنما المسلمون إخْوَة، ولا يَحِلّ لا مركاء مسلم …"
