text: "… : اللَّهمّ، اشهدْ ! أيَّها الناس، إِنَّ الشيطان قد يئس أَن يُعبَد بأَرضكم هذه، ولكنه قد رضى أَن يُطاع فيما سِوى ذلك ممّا تَحقِرونه، فقد رضى به. إنَّ كلّ مسلم أَخو المسلم، وإنما المسلمون إخْوَة، ولا يَحِلّ لا مركاء مسلم …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 1113، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 1113, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 1113 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Maghazi de al-Waqidi, volumen 1, pág. 1113, que menciona una descripción del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Maghazi d'al-Waqidi, volume 1, page 1113, contenant une description du musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Vakidi'nin Resimli Maghazi adlı eserinin 1. cildinin 1113. sayfasından, Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari Maghazi karya al-Waqidi, Jilid Bergambar 1, hlm. 1113, yang menjelaskan tentang seorang Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
