label: { ar: "الموطأ 350 — ابن عمر لمن صلى في بيته ثم أدرك الجماعة: إنما ذلك إلى الله", en: "Muwatta 350" }
text: "أو ذلك إليك؟ إنما ذلك إلى الله يجعل أيتهما شاء"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب إعادة الصلاة مع الإمام: سأل رجل عبد الله بن عمر أنه يصلي في بيته ثم يدرك الصلاة مع الإمام أفيصلي معه، فقال: نعم، فسأله أيتهما يجعل صلاته، فأجابه ابن عمر: أو ذلك إليك؟ إنما ذلك إلى الله يجعل أيتهما شاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.193} {cite:muwatta-maruf-1997 p.194}"
