label: { ar: "الموطأ 350 — ابن عمر لمن صلى في بيته ثم أدرك الجماعة: إنما ذلك إلى الله", en: "Muwatta 350", es: "350 palabras", fr: "350 mots", ur: "350 الفاظ", tr: "El-Muvatta 350 — İbn Ömer, evinde namaz kılıp sonra cemaate katılan birine şöyle dedi: Bu, Allah'ın takdirine kalmıştır.", id: "Al-Muwatta 350 — Ibnu Umar kepada orang yang shalat di rumah dan kemudian bergabung dengan jamaah: Itu terserah kepada Allah" }
text: "أو ذلك إليك؟ إنما ذلك إلى الله يجعل أيتهما شاء"
summary:
  ar: "أثر يرويه مالك عن نافع، في باب إعادة الصلاة مع الإمام: سأل رجل عبد الله بن عمر أنه يصلي في بيته ثم يدرك الصلاة مع الإمام أفيصلي معه، فقال: نعم، فسأله أيتهما يجعل صلاته، فأجابه ابن عمر: أو ذلك إليك؟ إنما ذلك إلى الله يجعل أيتهما شاء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.193} {cite:muwatta-maruf-1997 p.194}"
  tr: "Malik'in Nafi'den rivayet ettiği, imamla birlikte namazı tekrarlama bölümünde yer alan bir rivayette şöyle denmektedir: Bir adam Abdullah ibn Umar'a evde namaz kılıp sonra imamla birlikte namaz kılıp kılmadığını ve onunla birlikte namaz kılıp kılmaması gerektiğini sordu. İbn Umar, \"Evet\" diye cevap verdi. Adam daha sonra hangi namazı kılacağını sordu ve İbn Umar, \"Bu sana mı kalmış? Bu Allah'a kalmış; dilediğini O seçer\" diye yanıtladı. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suwaid ve Yahya ibn Bukayr tarafından, el-Bayhaqi'nin de kaydıyla nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.193} {cite:muwatta-maruf-1997 s.194}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang mengulang salat bersama imam: Seorang pria bertanya kepada Abdullah ibn Umar apakah ia salat di rumah dan kemudian bergabung dengan imam untuk salat, dan apakah ia harus salat bersamanya. Beliau menjawab, “Ya.” Pria itu kemudian bertanya salat mana dari kedua salat tersebut yang harus ia lakukan, dan Ibn Umar menjawab, “Apakah itu terserah kamu? Itu terserah Allah; Dia dapat memilih mana pun yang Dia kehendaki.” Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.193} {cite:muwatta-maruf-1997 p.194}"
