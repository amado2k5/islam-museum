text: "قالت عائشة: لم أعقل أبوي قط إلا وهما يدينان الدين… خرج أبو بكر مهاجراً نحو أرض الحبشة حتى بلغ برك الغماد، لقيه ابن الدغنة وهو سيد القارة فقال: إن مثلك يا أبا بكر لا يخرج ولا يخرج"
summary:
  ar: "في كتاب مناقب الأنصار باب هجرة النبي وأصحابه إلى المدينة؛ أطول حديث في السيرة المكية بالصحيح، ترويه عائشة عن عروة عن ابن شهاب: بداية الإسلام في بيت أبي بكر، وهجرة أبي بكر إلى الحبشة وجواب ابن الدغنة وجواره، ومسجد أبي بكر في فناء داره، ثم أذن الهجرة، وليلة الغار، وسراقة، وأم معبد، ودخول المدينة وقول الناس «جاء النبي»."
