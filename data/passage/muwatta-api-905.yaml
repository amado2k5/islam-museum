label: { ar: "موطأ مالك 905 — الأب والأبوة", en: "Muwatta Malik 905 — the father and fatherhood", ur: "موطأ مالک 905 — باپ اور والدیت" }
text: "وَحَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ صَلَّى الصَّلاَةَ الرُّبَاعِيَّةَ بِمِنًى رَكْعَتَيْنِ وَأَنَّ أَبَا بَكْرٍ صَلاَّهَا بِمِنًى رَكْعَتَيْنِ وَأَنَّ عُمَرَ بْنَ الْخَطَّابِ صَلاَّهَا بِمِنًى رَكْعَتَيْنِ وَأَنَّ عُثْمَانَ صَلاَّهَا بِمِنًى رَكْعَتَيْنِ شَطْرَ إِمَارَتِهِ ثُمَّ أَتَمَّهَا بَعْدُ."
summary:
  ar: "حديث في موطأ مالك، رقم 905، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 905 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 905، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
