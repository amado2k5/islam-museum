label: { ar: "صحيح البخاري 4091 — أعضاء البدن", en: "Sahih al-Bukhari 4091 — the organs of the body", ur: "صحیح بخاری 4091 — اعضائے بدن", es: "Sahih al-Bukhari 4091 — los órganos del cuerpo", fr: "Sahih al-Bukhari 4091 — les organes du corps", tr: "Sahih el-Buhari 4091 — Vücut Parçaları", id: "Sahih al-Bukhari 4091 — Bagian Tubuh" }
text: "… أَوْ أَكُونُ خَلِيفَتَكَ، أَوْ أَغْزُوكَ بِأَهْلِ غَطَفَانَ بِأَلْفٍ وَأَلْفٍ، فَطُعِنَ عَامِرٌ فِي بَيْتِ أُمِّ فُلاَنٍ فَقَالَ غُدَّةٌ كَغُدَّةِ الْبَكْرِ فِي بَيْتِ امْرَأَةٍ مِنْ آلِ فُلاَنٍ ائْتُونِي بِفَرَسِي. فَمَاتَ عَلَى ظَهْرِ فَرَسِهِ، فَانْطَلَقَ حَرَامٌ أَخُو أُمِّ سُلَيْمٍ هُوَ {وَ} رَجُلٌ أَعْرَجُ وَرَجُلٌ مِنْ بَنِي فُلاَنٍ قَالَ كُونَا قَرِيبًا حَتَّى آتِيَهُمْ، فَإِنْ آمَنُونِي كُنْتُمْ، وَإِنْ قَتَلُونِي أَتَيْتُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4091، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4091 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4091، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 4091 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona los órganos del cuerpo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un récit du Sahih al-Bukhari, n° 4091 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne les organes du corps. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4091 numaralı hadis, vücut organlarından bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4091, menyebutkan organ-organ tubuh. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
