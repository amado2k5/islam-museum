text: "… أَوْ أَكُونُ خَلِيفَتَكَ، أَوْ أَغْزُوكَ بِأَهْلِ غَطَفَانَ بِأَلْفٍ وَأَلْفٍ، فَطُعِنَ عَامِرٌ فِي بَيْتِ أُمِّ فُلاَنٍ فَقَالَ غُدَّةٌ كَغُدَّةِ الْبَكْرِ فِي بَيْتِ امْرَأَةٍ مِنْ آلِ فُلاَنٍ ائْتُونِي بِفَرَسِي. فَمَاتَ عَلَى ظَهْرِ فَرَسِهِ، فَانْطَلَقَ حَرَامٌ أَخُو أُمِّ سُلَيْمٍ هُوَ {وَ} رَجُلٌ أَعْرَجُ وَرَجُلٌ مِنْ بَنِي فُلاَنٍ قَالَ كُونَا قَرِيبًا حَتَّى آتِيَهُمْ، فَإِنْ آمَنُونِي كُنْتُمْ، وَإِنْ قَتَلُونِي أَتَيْتُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4091، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4091 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4091، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
