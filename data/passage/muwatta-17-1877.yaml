label: { ar: "الموطأ 1877 — مالك: من أسلف في حنطة شامية فلا بأس أن يأخذ محمولة بعد محل الأجل، وكذلك من أسلف في صنف فلا بأس أن يأخذ خيرا أو أدنى بعد محل الأجل، إذا كانت مكيلة ذلك سواء", en: "Muwatta 1877", es: "Muwatta 1877", fr: "Muwatta 1877", ur: "موطا 1877", tr: "El-Muvatta 1877 — Malik: Kim Suriye buğdayı ödünç verirse, vadesinden sonra bir taşıyıcıyla geri almasında bir sakınca yoktur. Aynı şekilde, kim bir mal ödünç verirse, vadesinden sonra daha iyi veya daha kötü bir çeşidini geri almasında da bir sakınca yoktur, yeter ki her ikisinin de ölçüsü aynı olsun.", id: "Al-Muwatta 1877 — Malik: Barang siapa meminjamkan gandum Suriah, tidak ada salahnya mengambilnya kembali dengan alat pengangkut setelah tanggal jatuh tempo. Demikian pula, barang siapa meminjamkan komoditas, tidak ada salahnya mengambil jenis yang lebih baik atau lebih buruk setelah tanggal jatuh tempo, asalkan ukuran masing-masing sama." }
summary:
  ar: "قال مالك: من أسلف في حنطة شامية فلا بأس أن يأخذ محمولة بعد محل الأجل. وكذلك من أسلف في صنف من الأصناف، فلا بأس أن يأخذ خيرا مما أسلف فيه، أو أدنى بعد محل الأجل. وتفسير ذلك: أن يسلف الرجل في حنطة محمولة، فلا بأس أن يأخذ شعيرا أو شامية. وإن أسلف في تمر عجوة، فلا بأس أن يأخذ صيحانيا أو جمعا. وإن أسلف في زبيب أحمر، فلا بأس أن يأخذ أسود، إذا كان ذلك كله بعد محل الأجل، إذا كانت مكيلة ذلك سواء بمثل كيل ما أسلف فيه. {cite:muwatta-maruf-1997 p.172}"
  tr: "Malik şöyle dedi: Eğer biri Suriye buğdayı için borç verirse, vadesinden sonra aynı buğdayı aynen geri almasında bir sakınca yoktur. Benzer şekilde, eğer biri herhangi bir mal için borç verirse, vadesinden sonra daha iyi veya daha düşük kalitede bir şey almasında bir sakınca yoktur. Bu, eğer biri taşınacak buğday için borç verirse, arpa veya Suriye buğdayı almasında bir sakınca olmadığı anlamına gelir. Eğer biri 'Ajwa hurması' için borç verirse, Sayhani veya Jam hurması almasında bir sakınca yoktur. Eğer biri kırmızı kuru üzüm için borç verirse, siyah kuru üzüm almasında bir sakınca yoktur; yeter ki tüm bunlar vadesinden sonra gerçekleşsin ve borç için kullanılan ölçü, orijinal borç için kullanılan ölçüyle aynı olsun. {cite:muwatta-maruf-1997 s.172}"
  id: "Malik berkata: Jika seseorang meminjam uang untuk gandum Suriah, tidak ada salahnya mengambilnya dalam bentuk barang setelah tanggal jatuh tempo. Demikian pula, jika seseorang meminjam uang untuk komoditas apa pun, tidak ada salahnya mengambil sesuatu yang lebih baik atau berkualitas lebih rendah setelah tanggal jatuh tempo. Ini berarti bahwa jika seseorang meminjam uang untuk gandum yang akan diangkut, tidak ada salahnya mengambil jelai atau gandum Suriah. Jika seseorang meminjam uang untuk kurma 'Ajwa, tidak ada salahnya mengambil kurma Sayhani atau Jam'. Jika seseorang meminjam uang untuk kismis merah, tidak ada salahnya mengambil kismis hitam, asalkan semua ini terjadi setelah tanggal jatuh tempo dan ukuran yang digunakan untuk pinjaman sama dengan ukuran yang digunakan untuk pinjaman awal. {cite:muwatta-maruf-1997 p.172}"
