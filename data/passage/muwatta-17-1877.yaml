label: { ar: "الموطأ 1877 — مالك: من أسلف في حنطة شامية فلا بأس أن يأخذ محمولة بعد محل الأجل، وكذلك من أسلف في صنف فلا بأس أن يأخذ خيرا أو أدنى بعد محل الأجل، إذا كانت مكيلة ذلك سواء", en: "Muwatta 1877" }
summary:
  ar: "قال مالك: من أسلف في حنطة شامية فلا بأس أن يأخذ محمولة بعد محل الأجل. وكذلك من أسلف في صنف من الأصناف، فلا بأس أن يأخذ خيرا مما أسلف فيه، أو أدنى بعد محل الأجل. وتفسير ذلك: أن يسلف الرجل في حنطة محمولة، فلا بأس أن يأخذ شعيرا أو شامية. وإن أسلف في تمر عجوة، فلا بأس أن يأخذ صيحانيا أو جمعا. وإن أسلف في زبيب أحمر، فلا بأس أن يأخذ أسود، إذا كان ذلك كله بعد محل الأجل، إذا كانت مكيلة ذلك سواء بمثل كيل ما أسلف فيه. {cite:muwatta-maruf-1997 p.172}"
