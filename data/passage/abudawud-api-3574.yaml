label: { ar: "سنن أبي داود 3574 — الأجران", en: "Sunan Abi Dawud 3574 — the double reward", ur: "سنن ابی داؤد 3574 — دوہرا اجر", es: "Sunan Abi Dawud 3574: la doble recompensa", fr: "Sunan Abi Dawud 3574 — la double récompense", tr: "Sünen Ebu Davud 3574 — Al-Ajran", id: "Sunan Abi Dawud 3574 — Al-Ajran" }
text: "… اللَّهِ بْنِ الْهَادِ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ، عَنْ بُسْرِ بْنِ سَعِيدٍ، عَنْ أَبِي قَيْسٍ، مَوْلَى عَمْرِو بْنِ الْعَاصِ عَنْ عَمْرِو بْنِ الْعَاصِ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِذَا حَكَمَ الْحَاكِمُ فَاجْتَهَدَ فَأَصَابَ فَلَهُ أَجْرَانِ وَإِذَا حَكَمَ فَاجْتَهَدَ فَأَخْطَأَ فَلَهُ أَجْرٌ \". فَحَدَّثْتُ بِهِ أَبَا بَكْرِ بْنَ حَزْمٍ فَقَالَ هَكَذَا حَدَّثَنِي أَبُو سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3574، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 3574 (The Office of the Judge (Kitab Al-Aqdiyah)), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 3574، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3574 (La Oficina del Juez (Kitab Al-Aqdiyah)), habla de la doble recompensa. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 3574 (Le Bureau du Juge (Kitab Al-Aqdiyah)), évoque la double récompense. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "Sunan Abi Davud'da yer alan 3574 numaralı hadis, iki tür mükafattan bahsetmektedir. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3574, menyebutkan dua jenis pahala. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
