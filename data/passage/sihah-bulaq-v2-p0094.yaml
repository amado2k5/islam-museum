  • ⁦(باب الواوواليا.)⁩.
  ..فى).
  ٤٩٣
  أى كشف وسريت لغة ومروت عنى درعى بالوا ولا غير وانسرى عنى الهمّ انكشف وسرى
  عنى الهتم مثله والسروة بالكسرسهم صغير والجمع السراء والسروة أيضا الجرادة أقل ما نكون
  وهى دودة وأصله الهسمز والسرية لغة فيها وأرض مسروة ذات سروة وسراة كل شى
  أعلاه وسراة الفرس أعلى ظهره ووسطه والجمع سروات وفى الحديت ايس للنساءسروات
  الطريق أى ظهر الطريق ووسطه ولسكنهنّ يشين فى الجوانب وسراة النهاروسطه والسراه
  بالفتح مدود شجر تخذ منه القسىّ قال زهيريصف وحشا
  ثلاث كاقواس السراء وناشط • قداخضر من لس الغمير بهافله
  راستريت الابل والغتم والناس أى اخترتهم قال الاعشى
  وقد أخرج الكاعب المستراة من خدرها وأشيع القمارا
  وهى سرى ابله وسراة ماله واسترى الموت بن فلان أى اختار سراتهم والسارية الاسطوانة
  والسارية السحابة التى تأتى ليسلا وسريت سرى ومسرى وأسريت بعنى اذاسرت ليلا
  وبالالف لغة أهل الجازوجاء الة رآن بهماجيعا وقال حسان بن ثابت
  حالنضيرة رية الخدر • أسرت البك ولم تكن تسرى
  ويقال سريناسرية واحدة والاسم السرية بالضم والسرى وأسراه وأسرى به منل أخذ
  الخظام وأخذ بالخطام وانما قال تعالى سهان الذى أسرى بعصده ليلا وان كان السرى
  لا يكون الابالليل التأ كيد كة واهسم سرت أمس نهارا والبارحة لبلا والسراية سرى اللمل
  وهو مصدرويقل" فى المصادو أن تجى عسلى هذا البناءلانه من أبنية المع يدلّ على محة ذلاك
  أنّ بعض العرب يؤنث السرى والهدى وهم بنو أسد توهما أنهماجع سرية وهدية واسرائيل
  مم يقال هو مضاف الى ايل قال الاخفس هو يهسمزولايهمزقال ويقال فى لغة اسرادير
  بالنون كما قالوا جبرين واسمعين ⁦(سطا)⁩ السطوة القهربالبطش يقال سطابه والسطوة
  لمرّة الواحدة والجمع الطوات والفمل يسطوعلى طروقته أبوعر والساطى الذى يغنلم)
  يخرج من ابل الى ابل وقال* هامته مثسل الفنيق الساطى• قال الاصمعى الساطى من
  الخيل البعيد الشهموة وهى الخطوة وسطااراعى على الناقة اذا أدخل يده فى رحها ليخرج
  مافيها من الوثروهوماء المفعل واذالم يخرج لم تلقح الناقة وسطا القرس أى أبعد الخطووسطا
  الما-كغر وفرص ساط يماو على سأئرانخيل ويقال هو الذى يرفع ذنبه فى حضره عى) سعى
  الرجل يسهى سعما أى عدا وكذلك اذا عمل وكسب وكل من ولى شبأ على قوم فهوساع عليهم
  وأكثر ما يقال ذلن فى ولاة الصدقة يقال سعى عليها أى عمل عليها وهم السعاة قال الشاء,
  سعى عقالا فلم يترك الناسبدا • فكيف لوقد سعى حمروع قالين
  والمسعاة واحدة المساعى فى الكرم والجود والسعو بالكسر الساعة من الليل يقال مضى من
  الليل معووسع واءمئله وساعانى فلان فسعيته أسعيه اذا غلبته فيه وسعى به الى الوالى
  اذا وثى به وسعى المكائب فى عنق رقبته سعابة واستعيت العبد فى قمته وتقول زنى
  الرحل وعهر فهذا قد يكون بالحرّة والامة ويقال فى الامة خاصة قد ساعاها ولا تكون
  المساعاة الافى الاماه وفى الحديث اماءساعين فى الجاهلية وأتى عمروضى اللّٰه عنه برجل
