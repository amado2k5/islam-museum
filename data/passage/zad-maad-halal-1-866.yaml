text: "… المظاهِرِ مدةٌ بعد القول بالظهار، لم يُحرِّمْهَا بالطلاق الذي يحرم به، وجبت عليه الكفارةُ، كأنهم يذهبون إلى أنه إذا أمسكَ ما حرَّم على نفسه أنه حلال، فقد عاد لما قال، فخالفه، فأحلّ ما حرم، ولا أعلمُ له معنى أولى به …"
