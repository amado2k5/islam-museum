text: |-
  ⁦(فصل السين)⁩
  ⁦(سقد)⁩
  ٢٢٣
  وأماقول الشاعر واقى بها كدراهم الاسجاد فهى دراهم كانت عليها صوريسجدون
  لها والمسجد والمسحد واحد المساجد قال الفراء كل ماكان على فل يفعلمشل
  دخل يدخل فالمفعل منه بالفتح اسما كان أو مصدرا ولا يقع فيه الفرق مثل دخل مدخلا وهذا
  مدخل الاأحرفا من الاسماء ألزموها كسر العين من ذلاك المسد والمطلع والمغرب والمشرق
  والمسقط والمفرق والجزر والمسكن والمرفق من رفق يرفق والمنبت والمنسكُ من نساك يفسك
  فجعلوا الكسر علامة للاسم وربماقتحه بعض العرب فى الاسم قدروى مسكن ومكن
  وسمعنا المسجد والمسجد والمطلع والمطلع قال والنتح فى كاسه جانزوان لم نسمعه وما كان من
  باب فعل يفعل مشل جلس يجلس فألوضع بالكسر والمصدر بالفتح للفرق بينهما تقول نزل
  منزلا بفغ الزاى زيد نزل نزولا وهذا نزه فتكسر لانك تعنى الداروهو مذهب تفرديه هذا
  الباب من بين أخوانه وذلك أنّ المواضع والممادر فى غيرهذا الباب زذكلها الى فتح العين
  ولا يقع فيها الفروق ولم يكسرشئ فيماسوى المذكورالا الاحرف التى ذكرناها والمسجدان
  سيدمكة ومسجد المدينة وقال الشاعر ا كميت يمدح بني أمية
  لكم مسجدا للّٰه المزوران والحصى • لكم قبصه من بين أثرى وأقترا
  والمسجد بالفتح جبهة الرجل حيث يسيبه ندب السجود والآراب السبعة مساحد ⁦(سخد)⁩.
  السخدما أصفر غليظ يخرج مع الواد وأصبح فلان مسخدااذا أصبح تقب لامور مامصفرا
  وفى الحديث فيصبح السخدع لى وجهه ⁦(-دد)⁩ القسديد التوفيق للدادوهوالصواب
  والقصد من القول والعمل ورجل مدد اذاكان يعمل بالداد والصد والمسدد
  المقوم وسددرعحه وهو خلاف قولك عرضه وسدقوله بد بالكسر أى صار سديدا وإنه
  ليسد فى القول فه وصداذا كان يصيب السداد أى القصدويقال للرجل أسددت ماشقت
  اذا طلب الداد والقس_دوأمر سديد وأسد أى قاصدوقد استد الشى اى استقام وقال
  لناعر
  اعلمه الرماية كل يوم • فما استدساعده رمانى
  قال الاصمعى اشتد بالثين ايس بشى والسداد بالفع الاستقامة والسواب وكذلك السدد
  مقصورمنه قال الاعنى
  ماذا عليماوماذا كان ينقصها • يوم الترحل لوقاات لناسددا
  خذف الالف تقول منه أمربى فلان يجرى على السداد وقد قال سدادا من القول وأما
  سداد القارورة وسداد الشغربالكسر لاغير قال العرجى
  أضاعونى وأى فنى أضاعوا • ليوم كريهة وسدادنغر
  وهو سده بالخيل والرجال وأما قولهم فيه -دادم نءوزوأصبت به سدادامن عيس أى ماقسد
  بهالخلة فيكسر ويفتح والكسر أفصع وسددت الثلة ونحوها أسدهاب_دا أصلحتها وأوثقتها
  والسدوالسد الجبل والحاجز صيت فى القربة ماءفاستدت عيون الخرزواذدت بمعى
  وأرض هاسددة وهى أودية فيها حجارة وصخور يبق الماءفيهازمانا الواحد سدبااضم مثل
  ححروجرة ويقال أيضاحا ناجرادة بالضم اذاسد الافق من كثربه قال الهجاج
  سيل الجراد الندير تاد الحضر والدأيضا واجد السدود وهى السهائب السود عن أبى
  ٤ قال فى المختارقات وف
  الديوان قال بعضهم السد بالضم
  ما كان من خلق اللّه وبالفستح
  ما كان من عمليف آدم اهV
