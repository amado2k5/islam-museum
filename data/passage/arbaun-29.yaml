ref: "29"
label: { ar: "الأربعون 29 — أخبرني بعمل يدخلني الجنة", en: "Arba'un 29 — tell me of a deed that admits me to Paradise", es: "Arba'un 29 — dime de alguna obra que me permita entrar en el Paraíso", fr: "Arba'un 29 — Dis-moi quel acte me fera entrer au Paradis", ur: "اربعون 29 - مجھے کوئی ایسا عمل بتائیں جو مجھے جنت میں داخل کرے۔" }
summary:
  ar: "حديث معاذ بن جبل قال: قلت يا رسول الله أخبرني بعمل يدخلني الجنة ويباعدني من النار فقال: «لقد سألت عن عظيم وإنه ليسير على من يسره الله عليه: تعبد الله لا تشرك به شيئاً وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت» ثم قال «ألا أدلك على أبواب الخير؟ الصوم جنة والصدقة تطفئ الخطيئة كما يطفئ الماء النار وصلاة الرجل من جوف الليل» ثم تلا من سورة السجدة [16–17] ثم قال «ألا أخبرك برأس الأمر وعموده وذروة سنامه؟ رأس الأمر الإسلام وعموده الصلاة وذروة سنامه الجهاد» ثم قال «ألا أخبرك بملاك ذلك كله؟» فأخذ بلسانه وقال «كف عليك هذا» فلما سأل معاذ وإنا لمؤاخذون بما نتكلم به قال «ثكلك أمك وهَل يكب الناس في النار على وجوههم — أو على مناخرهم — إلا حصائد ألسنتهم» — وهو الحديث التاسع والعشرون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه الإمام أحمد والترمذي (2616) وقال حسن صحيح والنسائي في الكبرى وابن ماجه (3973) من رواية معمر عن عاصم بن أبي النجود عن أبي وائل عن معاذ، وفيما قاله الترمذي نظر عند ابن رجب من وجهين: أولهما أنه لم يثبت سماع أبي وائل من معاذ وإن أدركه بالسن فكان معاذ بالشام وأبو وائل بالكوفة وما زال الأئمة كأحمد يستدلون على انتفاء السماع بمثل هذا، وقال أبو حاتم الرازي في سماع أبي وائل من أبي الدرداء قد أدركه وكان بالكوفة وأبو الدرداء بالشام يعني أنه لم يصح له سماع منه، وحكى أبو زرعة الدمشقي عن قوم توقفوا في سماع أبي وائل من عمر أو نفوه فسماعه من معاذ أبعد؛ وثانيهما أن حماد بن سلمة رواه عن عاصم عن شهر بن حوشب عن معاذ وقال الدارقطني هو أشبه بالصواب لأن الحديث معروف من رواية شهر على اختلاف عليه فيه، وعند ابن رجب أن رواية شهر عن معاذ مرسلة يقيناً وشهر مختلف في توثيقه وتضعيفه، ورواه أحمد من رواية شهر عن عبد الرحمن بن غنم عن معاذ ومن رواية عروة بن النزال وميمون بن أبي شبيب ولم يسمع عروة ولا ميمون من معاذ، وله طرق أخر عن معاذ كلها ضعيفة ⁦(جامع العلوم والحكم ص 602–616)⁩."
  en: "The hadith of Mu'adh ibn Jabal that he asked the Messenger of God for a deed admitting him to Paradise and distancing him from the Fire, and was answered 'you have asked about a tremendous matter, yet it is easy for one whom God makes it easy: worship God associating nothing with Him, establish the prayer, give the zakat, fast Ramadan and perform the hajj', then 'shall I point you to the gates of good? Fasting is a shield, charity extinguishes sin as water extinguishes fire, and a man's prayer in the depth of night' — reciting from Surat al-Sajda (16–17) — then 'shall I tell you of the head of the matter, its pillar and the peak of its hump? Its head is Islam, its pillar the prayer, and the peak of its hump jihad', and finally 'shall I tell you of what controls all of that?' — taking hold of his own tongue — 'restrain this', answering Mu'adh's 'are we really taken to account for what we say?' with 'may your mother be bereft of you — are people thrown onto their faces, or their nostrils, in the Fire for anything but the harvest of their tongues?'; the twenty-ninth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Ahmad, al-Tirmidhi (2616, graded hasan sahih), al-Nasa'i in al-Kubra and Ibn Majah (3973) through Mu'ammar from Asim ibn Abi al-Nujud from Abu Wa'il from Mu'adh — a grading Ibn Rajab questions on two grounds: first, Abu Wa'il's hearing from Mu'adh is unproven though their lifetimes overlapped, Mu'adh being in Syria and Abu Wa'il in Kufa, the imams — Ahmad among them — having always argued from precisely such geography against hearing, and Abu Hatim al-Razi having reasoned the same way against Abu Wa'il's hearing from Abu al-Darda', while Abu Zur'a al-Dimashqi reports people who suspended or denied Abu Wa'il's hearing even from Umar, making Mu'adh still further; second, Hammad ibn Salama's version through Asim from Shahr ibn Hawshab from Mu'adh — which al-Daraqutni judged closer to the truth since the hadith is known via Shahr despite disagreement over him — is certainly mursal in Ibn Rajab's view and Shahr's own reliability contested; Ahmad also transmits it through Shahr from Abd al-Rahman ibn Ghunam from Mu'adh and through Urwa ibn al-Nazzal and Maymun ibn Abi Shabib, neither of whom heard Mu'adh, with further routes all weak (Jami' al-Ulum wal-Hikam pp. 602–616)."
  es: "El hadiz de Mu'adh ibn Jabal dice que le pidió al Mensajero de Dios una obra que lo admitiera en el Paraíso y lo alejara del Fuego, y fue respondido: \"Has pedido algo muy importante, pero es fácil para aquel a quien Dios se lo facilita: adora a Dios sin asociarle nada, establece la oración, da el zakat, ayuna en Ramadán y realiza el hajj\", luego \"¿Quieres que te muestre las puertas del bien? El ayuno es un escudo, la caridad extingue el pecado como el agua extingue el fuego, y la oración de un hombre en la profundidad de la noche\" — recitando de la Sura al-Sajda (16-17) — luego \"¿Quieres que te diga cuál es la cabeza del asunto, su pilar y la cima de su joroba? Su cabeza es el Islam, su pilar la oración, y la cima de su joroba la yihad\", y finalmente \"¿Quieres que te diga qué controla todo eso?\". —controlando su propia lengua— «refrena esto», respondiendo a la pregunta de Mu'adh «¿de verdad se nos pide cuentas por lo que decimos?» con «¡Que tu madre te prive de ti! ¿Acaso se arroja a la gente de bruces, o por las fosas nasales, al Fuego por algo que no sea la cosecha de sus lenguas?»; el vigésimo noveno de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, transmitido por Ahmad, al-Tirmidhi (2616, clasificado hasan sahih), al-Nasa'i en al-Kubra e Ibn Majah (3973) a través de Mu'ammar de Asim ibn Abi al-Nujud de Abu Wa'il de Mu'adh — una clasificación que Ibn Rajab cuestiona por dos razones: primero, la audición de Abu Wa'il de Mu'adh no está probada aunque sus vidas se superpusieron, estando Mu'adh en Siria y Abu Wa'il en Kufa, los imanes —Ahmad entre ellos— siempre argumentaron desde esa geografía en contra de la audición, y Abu Hatim al-Razi razonó de la misma manera contra la audición de Abu Wa'il de Abu al-Darda', mientras que Abu Zur'a al-Dimashqi informa de personas que suspendieron o negaron la audición de Abu Wa'il incluso de Umar, haciendo Mu'adh aún más lejos; segundo, la versión de Hammad ibn Salama a través de Asim de Shahr ibn Hawshab de Mu'adh —que al-Daraqutni juzgó más cercana a la verdad ya que el hadiz se conoce a través de Shahr a pesar del desacuerdo sobre él— es ciertamente mursal en la opinión de Ibn Rajab y la propia fiabilidad de Shahr es cuestionada; Ahmad también lo transmite a través de Shahr de Abd al-Rahman ibn Ghunam de Mu'adh y a través de Urwa ibn al-Nazzal y Maymun ibn Abi Shabib, ninguno de los cuales escuchó a Mu'adh, con rutas posteriores todas débiles (Jami' al-Ulum wal-Hikam pp. 602–616)."
  fr: "Le hadith de Mu'adh ibn Jabal rapporte qu'il demanda au Messager de Dieu une action qui lui ouvrirait les portes du Paradis et l'éloignerait du Feu. Il lui fut répondu: « Tu as posé une question immense, mais elle est facile pour celui à qui Dieu la facilite: adore Dieu sans rien Lui associer, accomplis la prière, acquitte-toi de la zakat, jeûne le Ramadan et accomplis le hajj. » Puis, citant la sourate al-Sajda (16-17): « Veux-tu que je t'indique les portes du bien ? Le jeûne est un bouclier, l'aumône éteint le péché comme l'eau éteint le feu, et la prière du moine au cœur de la nuit. » Puis, il ajouta: « Veux-tu que je te révèle le fondement de cette question, son pilier et son point culminant ? Son fondement est l'Islam, son pilier la prière et son point culminant le jihad. » Enfin, il demanda: « Veux-tu que je te révèle ce qui régit tout cela ? » — retenant sa propre langue — « retiens-toi », répondant à Mu'adh « sommes-nous vraiment tenus responsables de ce que nous disons ? » par « que ta mère soit privée de toi — les gens sont-ils jetés face contre terre ou par les narines dans le Feu pour autre chose que la récolte de leurs langues ? »; le vingt-neuvième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, transmis par Ahmad, al-Tirmidhi (2616, classé hasan sahih), al-Nasa'i dans al-Kubra et Ibn Majah (3973) par l'intermédiaire de Mu'ammar d'Asim ibn Abi al-Nujud d'Abu Wa'il de Mu'adh — une classification qu'Ibn Rajab remet en question pour deux raisons: premièrement, le fait qu'Abu Wa'il ait entendu Mu'adh n'est pas prouvé bien que leurs vies se soient chevauchées, Mu'adh étant en Syrie et Abu Wa'il à Kufa, les imams — Ahmad parmi eux — ayant toujours argumenté précisément à partir de cette géographie contre l'écoute, et Abu Hatim al-Razi ayant raisonné de la même manière contre l'écoute d'Abu Wa'il d'Abu al-Darda', tandis qu'Abu Zur'a al-Dimashqi rapporte des personnes qui ont suspendu ou nié l'écoute d'Abu Wa'il même d'Umar, rendant Mu'adh encore plus; Deuxièmement, la version de Hammad ibn Salama, transmise par Asim d'après Shahr ibn Hawshab d'après Mu'adh — qu'al-Daraqutni jugeait plus proche de la vérité puisque le hadith est connu par l'intermédiaire de Shahr malgré les désaccords à son sujet — est certainement mursal selon Ibn Rajab, et la fiabilité même de Shahr est contestée; Ahmad la transmet également par l'intermédiaire de Shahr d'après Abd al-Rahman ibn Ghunam d'après Mu'adh et par Urwa ibn al-Nazzal et Maymun ibn Abi Shabib, dont aucun n'a entendu Mu'adh, les autres voies étant toutes faibles (Jami' al-Ulum wal-Hikam pp. 602–616)."
  ur: "معاذ بن جبل کی حدیث ہے کہ انہوں نے رسول اللہ سے جنت میں داخل کرنے اور آگ سے دور کرنے کا کوئی عمل پوچھا تو جواب دیا گیا کہ آپ نے ایک بہت بڑا معاملہ پوچھا ہے، لیکن اللہ تعالیٰ جس کے لیے آسان کر دے اس کے لیے یہ آسان ہے: اللہ کی عبادت کرو، اس کے ساتھ کسی کو شریک نہ ٹھہراؤ، نماز قائم کرو، زکوٰۃ دو، رمضان کے روزے رکھو، پھر حج کا اہتمام کرو؟ روزہ ڈھال ہے، صدقہ گناہوں کو اس طرح بجھا دیتا ہے جس طرح پانی آگ کو بجھا دیتا ہے، اور آدمی کی رات کی گہرائی میں نماز - سورۃ السجدہ (16-17) کی تلاوت - پھر کیا میں تمہیں مادے کے سر، اس کے ستون اور اس کے کوہان کی چوٹی کے بارے میں بتاؤں؟ اس کا سر اسلام، اس کا ستون نماز، اور اس کے کوہان جہاد کی چوٹی، اور آخر میں 'کیا میں آپ کو بتاؤں کہ ان سب پر کس چیز کا کنٹرول ہے؟' - اپنی زبان کو پکڑنا - 'اسے روکو'، معاذ کا جواب دیتے ہوئے 'کیا واقعی ہم جو کہتے ہیں اس کا حساب لیا جاتا ہے؟' کے ساتھ 'کیا آپ کی ماں آپ سے محروم ہوسکتی ہے - کیا لوگوں کو ان کے چہروں پر یا ان کے نتھنوں پر، ان کی زبانوں کی فصل کے علاوہ کسی اور چیز کے لیے آگ میں ڈالا جاتا ہے؟'؛ نووی کی چالیسویں اور ابن رجب کی تفسیر کا انتیسواں، جسے احمد، الترمذی ⁦(2616، درجہ حسن صحیح)⁩، النسائی نے الکبری میں اور ابن ماجہ (3973) میں معمر کے ذریعے عاصم بن ابی الوداع سے روایت کیا ہے۔ ابن رجب دو بنیادوں پر سوال کرتے ہیں: پہلا، معاذ سے ابو وائل کا سماع غیر ثابت ہے، حالانکہ معاذ شام میں تھے اور ابو وائل کوفہ میں، ان میں سے ائمہ احمد نے ہمیشہ سماع کے خلاف جغرافیہ سے استدلال کیا ہے، اور ابو حاتم الرازی نے اسی طرح سماع کے خلاف استدلال کیا ہے، جب کہ ابو وائل نے ابو وائل کے خلاف استدلال کیا ہے۔ ثریا الدمشقی نے ان لوگوں کی خبر دی ہے جنہوں نے ابو وائل کی سماعت کو عمر سے بھی معطل یا انکار کیا، جس سے معاذ کو مزید آگے بڑھایا گیا۔ دوسرا، حماد بن سلمہ کا عاصم کے ذریعے شہر بن حوشب سے معاذ کا نسخہ - جسے الدارقطنی نے حق کے قریب تر سمجھا کیونکہ اس پر اختلاف ہونے کے باوجود حدیث شہر کے ذریعے مشہور ہے - یقیناً ابن رجب کے نزدیک مرسل ہے اور شہر کی اپنی معتبریت کا مقابلہ کیا گیا ہے۔ احمد نے اسے شہر کے ذریعے عبد الرحمن بن غنم سے معاذ سے اور عروہ بن النزل اور میمون ابن ابی شبیب کے ذریعے بھی نقل کیا ہے، جن میں سے کسی نے بھی معاذ کو نہیں سنا، مزید راستے تمام ضعیف ہیں ⁦(جامع العلوم والحکم صفحہ 602-616)⁩۔"
