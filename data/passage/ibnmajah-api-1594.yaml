label: { ar: "سنن ابن ماجه 1594 — وزر من تبع", en: "Sunan Ibn Majah 1594 — bearing the burden of those who follow", ur: "سنن ابن ماجہ 1594 — پیروی کرنے والوں کا بوجھ", es: "Sunan Ibn Majah 1594 — llevando la carga de aquellos que siguen", fr: "Sunan Ibn Majah 1594 — porter le fardeau de ceux qui suivent", tr: "Sunan İbn Majah 1594 — Takip edenlerin yükü", id: "Sunan Ibn Majah 1594 — Beban bagi orang-orang yang mengikuti" }
text: "… قَالُوا وَاعَضُدَاهْ وَاكَاسِيَاهْ. وَانَاصِرَاهْ وَاجَبَلاَهْ وَنَحْوَ هَذَا - يُتَعْتَعُ وَيُقَالُ أَنْتَ كَذَلِكَ أَنْتَ كَذَلِكَ \". قَالَ أَسِيدٌ فَقُلْتُ سُبْحَانَ اللَّهِ إِنَّ اللَّهَ يَقُولُ {وَلاَ تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى }. قَالَ وَيْحَكَ أُحَدِّثُكَ أَنَّ أَبَا مُوسَى حَدَّثَنِي عَنْ رَسُولِ اللَّهِ ـ فَتَرَى أَنَّ أَبَا مُوسَى كَذَبَ عَلَى النَّبِيِّ ـ أَوْ تَرَى أَنِّي كَذَبْتُ عَلَى أَبِي مُوسَى؟"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1594، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 1594 (Chapters Regarding Funerals), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1594، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 1594 (Capítulos sobre los funerales), habla de asumir la carga de quienes le siguen. El Libro de Registro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 1594 (Chapitres relatifs aux funérailles), évoque le fardeau de porter celui des défunts. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou pèsent un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 1594 numaralı hadis, itaat edenin yükünden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1594, menyebutkan beban orang yang mengikuti. Beban tersebut dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
