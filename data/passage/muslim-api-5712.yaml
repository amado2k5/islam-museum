label: { ar: "صحيح مسلم 5712 — الرقية، الشفاء", en: "Sahih Muslim 5712 — ruqya recited over the sick; healing", ur: "صحیح مسلم 5712 — رقیہ، شفا" }
text: "وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو كُرَيْبٍ - وَاللَّفْظُ لأَبِي كُرَيْبٍ - قَالاَ حَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ يَرْقِي بِهَذِهِ الرُّقْيَةِ \" أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ بِيَدِكَ الشِّفَاءُ لاَ كَاشِفَ لَهُ إِلاَّ أَنْتَ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5712، يذكر الرقية، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5712 (The Book of Greetings), that mentions ruqya recited over the sick, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5712، جس میں رقیہ، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
