label: { ar: "سنن النسائي 2744 — الحرام", en: "Sunan al-Nasa'i 2744 — the unlawful", ur: "سنن نسائی 2744 — حرام", es: "Sunan al-Nasa'i 2744 — el ilícito", fr: "Sunan al-Nasa'i 2744 — l'illicite" }
text: "أَخْبَرَنِي عِمْرَانُ بْنُ يَزِيدَ، قَالَ حَدَّثَنَا شُعَيْبٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ عَطَاءٌ قَالَ جَابِرٌ قَدِمَ عَلِيٌّ مِنْ سِعَايَتِهِ فَقَالَ لَهُ النَّبِيُّ \" بِمَا أَهْلَلْتَ يَا عَلِيُّ \". قَالَ بِمَا أَهَلَّ بِهِ النَّبِيُّ. قَالَ \" فَاهْدِ وَامْكُثْ حَرَامًا كَمَا أَنْتَ \". قَالَ وَأَهْدَى عَلِيٌّ لَهُ هَدْيًا."
summary:
  ar: "حديث في سنن النسائي، رقم 2744، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2744 (The Book of Hajj), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2744، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2744 (El Libro del Hajj), menciona lo ilícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2744 (Le Livre du Hajj), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
