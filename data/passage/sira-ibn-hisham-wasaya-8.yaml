text: "… العرب: هَاجَرُ وآجَرُ، فيُبْدِلَونَ الألفَ من الهاء؛ كما قالوا: هَرَاقَ المَاءَ وأرَاقَ المَاءَ، وغيره، وهَاجَرُ : من أهل مصر. وصاة النبي وت ل في بأهل مصر وسبب ذلك : قال ابن هشام: حدثنا عبدالله بن وَهْبِ، عن عبدالله بن لَهِيعَةَ، …"
