text: "… إحْدى رِجلَيهِ عَلَى الأُخرىٰ فِي غَيرٍ حالِ اسْتِلْقاءٍ فَذَلِكَ حَسَنٌ، والاسْتِلْقَاءُ والتَّمدُّدُ فِي المَسْجِدِ حَسَنٌ، والخِضابُ للشَّيبِ حَسَنٌ، ويُكرهُ بالسَّوادِ وتَرْكُهُ مُباحٌ. ولا تَدْخُلُ المَلائِكَةُ بَيتًا فِيهِ كَلْبٌ ولا صُورَةٌ حاشَ ما أُبيحَ للصَّبايَا ممّا قَدْ ذَكَرْنَا، والصُّورَةُ مَكروهَةً؛ إلا …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 324، يرد فيه ذكر المكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 324, whose wording mentions the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 324 کا اقتباس جس میں مکروہ، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 324, dont le texte mentionne le réprouvé (makruh), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Muhalla, vol. 1 de Ibn Hazm, p. 324, cuyo texto menciona lo reprobado (makruh), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
