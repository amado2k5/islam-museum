label: { ar: "جامع الترمذي 1393 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Jami' al-Tirmidhi 1393 — ranks raised; bad deeds erased and sins shed", ur: "جامع ترمذی 1393 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Jami' al-Tirmidhi 1393 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Jami' al-Tirmidhi 1393 — les rangs s'élèvent; les mauvaises actions sont effacées et les péchés pardonnés.", tr: "Cami' el-Tirmizi 1393 — Mertebeleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Jami' al-Tirmidhi 1393 — Menaikkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "… الدَّرْدَاءِ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَا مِنْ رَجُلٍ يُصَابُ بِشَيْءٍ فِي جَسَدِهِ فَيَتَصَدَّقُ بِهِ إِلاَّ رَفَعَهُ اللَّهُ بِهِ دَرَجَةً وَحَطَّ عَنْهُ بِهِ خَطِيئَةً \". قَالَ الأَنْصَارِيُّ أَأَنْتَ سَمِعْتَهُ مِنْ رَسُولِ اللَّهِ قَالَ سَمِعَتْهُ أُذُنَاىَ وَوَعَاهُ قَلْبِي. قَالَ فَإِنِّي أَذَرُهَا لَهُ. قَالَ مُعَاوِيَةُ لاَ جَرَمَ لاَ أُخَيِّبُكَ. فَأَمَرَ لَهُ بِمَالٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1393، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 1393 (The Book on Blood Money), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 1393، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1393 (El Libro del Dinero Sangriento), habla de ascensos de rango, borrado de malas acciones y perdón de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1393 (Le Livre du prix du sang), évoque des élévations de grade, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Cami' el-Tirmizi'de 1393 numaralı hadis, derecelerin yükseltilmesinden, günahların silinmesinden ve zulümlerin giderilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1393, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
