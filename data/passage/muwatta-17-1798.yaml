label: { ar: "الموطأ 1798 — مالك: في الجارية تباع بالجاريتين ثم يوجد بإحداهما عيب ترد منه، تقام الجارية التي كانت قيمة الجاريتين، ثم تقام الجاريتان بغير العيب، ويقسم ثمن الجارية المباعة عليهما، فيرد بقدر حصة المعيبة", en: "Muwatta 1798" }
summary:
  ar: "قال مالك في الجارية تباع بالجاريتين، ثم يوجد بإحدى الجاريتين عيب ترد منه: تقام الجارية التي كانت قيمة الجاريتين، فينظر كم ثمنها. ثم تقام الجاريتان بغير العيب الذي وجد بإحداهما، تقامان صحيحتين سالمتين، ثم يقسم ثمن الجارية التي بيعت بالجاريتين عليهما بقدر ثمنها، حتى يقع على كل واحدة منهما حصتها، على المرتفعة بقدر ارتفاعها، وعلى الأخرى بقدرها. ثم ينظر إلى التي بها العيب، فيرد بقدر الذي وقع عليها من تلك الحصة. {cite:muwatta-maruf-1997 p.136} {cite:muwatta-maruf-1997 p.137}"
