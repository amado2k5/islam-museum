label: { ar: "الموطأ 1798 — مالك: في الجارية تباع بالجاريتين ثم يوجد بإحداهما عيب ترد منه، تقام الجارية التي كانت قيمة الجاريتين، ثم تقام الجاريتان بغير العيب، ويقسم ثمن الجارية المباعة عليهما، فيرد بقدر حصة المعيبة", en: "Muwatta 1798", es: "Muwatta 1798", fr: "Muwatta 1798", ur: "موطا 1798", tr: "El-Muvatta 1798 — Malik: Eğer bir cariye iki cariye karşılığında satılırsa ve cariyelerden birinde iadesini gerektiren bir kusur bulunursa, iki cariyenin değerine denk gelen cariye değerlendirilir, sonra kusursuz iki cariye değerlendirilir ve satılan cariyenin bedeli aralarında paylaştırılır ve kusurlu cariyenin payı iade edilir.", id: "Al-Muwatta 1798 — Malik: Jika seorang budak perempuan dijual dengan harga dua budak perempuan, dan kemudian ditemukan cacat pada salah satu dari mereka yang mengharuskan pengembaliannya, maka budak perempuan yang nilainya setara dengan harga kedua budak perempuan tersebut dinilai, kemudian kedua budak perempuan yang tidak cacat tersebut dinilai, dan harga budak perempuan yang dijual dibagi di antara mereka, dan bagian budak perempuan yang cacat dikembalikan." }
summary:
  ar: "قال مالك في الجارية تباع بالجاريتين، ثم يوجد بإحدى الجاريتين عيب ترد منه: تقام الجارية التي كانت قيمة الجاريتين، فينظر كم ثمنها. ثم تقام الجاريتان بغير العيب الذي وجد بإحداهما، تقامان صحيحتين سالمتين، ثم يقسم ثمن الجارية التي بيعت بالجاريتين عليهما بقدر ثمنها، حتى يقع على كل واحدة منهما حصتها، على المرتفعة بقدر ارتفاعها، وعلى الأخرى بقدرها. ثم ينظر إلى التي بها العيب، فيرد بقدر الذي وقع عليها من تلك الحصة. {cite:muwatta-maruf-1997 p.136} {cite:muwatta-maruf-1997 p.137}"
  tr: "Malik, iki köle kız karşılığında satılan bir köle kız hakkında şöyle demiştir: Köle kızlardan birinde kusur bulunması ve bu kusurun iadesini gerektirmesi durumunda, iki köle kızın değeri belirlenir. Daha sonra, kusuru bulunmayan iki köle kız değerlendirilir ve sağlam ve hasarsız oldukları tespit edilir. Ardından, iki köle kız karşılığında satılan köle kızın fiyatı, değerine göre aralarında paylaştırılır; her biri kendi payını alır, daha değerli olan kendi payına düşeni alır, diğeri de kendi payına düşeni alır. Daha sonra kusurlu olan incelenir ve aldığı paya oranla iade edilir. {cite:muwatta-maruf-1997 s.136} {cite:muwatta-maruf-1997 s.137}"
  id: "Malik berkata mengenai seorang budak perempuan yang dijual dengan harga dua budak perempuan, dan kemudian ditemukan cacat pada salah satu budak perempuan tersebut sehingga harus dikembalikan: Budak perempuan yang nilainya setara dengan dua budak perempuan itu dinilai, dan harganya ditentukan. Kemudian kedua budak perempuan itu dinilai tanpa cacat yang ditemukan pada salah satunya, dan mereka dinilai sehat dan tidak rusak. Kemudian harga budak perempuan yang dijual dengan harga dua budak perempuan itu dibagi di antara mereka sesuai dengan nilainya, sehingga masing-masing menerima bagiannya, yang nilainya lebih tinggi sesuai dengan nilainya, dan yang lainnya sesuai dengan nilainya. Kemudian budak perempuan yang memiliki cacat diperiksa, dan dia dikembalikan sesuai dengan bagian yang dia terima dari bagian tersebut. {cite:muwatta-maruf-1997 p.136} {cite:muwatta-maruf-1997 p.137}"
