text: "… حنيفة واجب، والواجب غير المكتوبة، والأذان من خواص المكتوبات. ولا أذان ولا إقامة في صلاة العيدين، وصلاة الكسوف والخسوف، والاستسقاء؛ لأنها ليست بمكتوبة. ولا أذان ولا إقامة في جماعة النسوان والصبيان والعبيد، لأن هذه الجماعة غير مستحبة، وقد روي عن …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 651، يرد فيه ذكر الواجب، والمستحب، وما ليس بواجب، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 651, whose wording mentions the obligatory (wajib), the recommended (mustahabb), what is said not to be obligatory, the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 651 کا اقتباس جس میں واجب، مستحب، جو واجب نہیں، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
