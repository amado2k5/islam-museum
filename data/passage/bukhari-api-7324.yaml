label: { ar: "صحيح البخاري 7324 — أثر من الآثار المحفوظة، دفن وقبر ومرقد", en: "Sahih al-Bukhari 7324 — a relic kept after its owner; a burial, grave or resting place", ur: "صحیح بخاری 7324 — محفوظ آثار و تبرکات، تدفین، قبر اور مرقد", es: "Sahih al-Bukhari 7324 — una reliquia conservada después de su dueño; un entierro, tumba o lugar de descanso." }
text: "… حَمَّادٌ، عَنْ أَيُّوبَ، عَنْ مُحَمَّدٍ، قَالَ كُنَّا عِنْدَ أَبِي هُرَيْرَةَ وَعَلَيْهِ ثَوْبَانِ مُمَشَّقَانِ مِنْ كَتَّانٍ فَتَمَخَّطَ فَقَالَ بَخْ بَخْ أَبُو هُرَيْرَةَ يَتَمَخَّطُ فِي الْكَتَّانِ، لَقَدْ رَأَيْتُنِي وَإِنِّي لأَخِرُّ فِيمَا بَيْنَ مِنْبَرِ رَسُولِ اللَّهِ إِلَى حُجْرَةِ عَائِشَةَ مَغْشِيًّا عَلَىَّ، فَيَجِيءُ الْجَائِي فَيَضَعُ رِجْلَهُ عَلَى عُنُقِي، وَيُرَى أَنِّي مَجْنُونٌ، وَمَا بِي مِنْ جُنُونٍ، مَا بِي إِلاَّ الْجُوعُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7324، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7324 (Holding Fast to the Qur'an and Sunnah), that mentions a relic kept after its owner, a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 7324، جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7324 (Aferrarse al Corán y la Sunnah), menciona una reliquia conservada tras su dueño, un entierro, una tumba o un lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
