  en: "Jami' al-Tirmidhi, Book 20: The Book on Vows and Oaths"
  ur: "جامع ترمذی، کتاب النذور والایمان عن رسول اللہ"
  es: "Jami' al-Tirmidhi, Libro 20: El Libro de los Votos y Juramentos"
  fr: "Jami' al-Tirmidhi, Livre 20: Le Livre des vœux et des serments"
  tr: "Cami' el-Tirmizi, Yemin ve Adaklar Kitabı, Allah Resulü'nün rivayetine göre."
  id: "Jami' al-Tirmidhi, Kitab Sumpah dan Janji, berdasarkan riwayat Rasulullah SAW"
summary:
  ar: "القسم 20 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب النذور والأيمان عن رسول الله»، ويضم فيها النصوص من 1524 إلى 1547 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 20 of Jami' al-Tirmidhi (The Book on Vows and Oaths) in the division of the open hadith dataset the museum took its reports from: reports 1524 to 1547 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 20، عنوان «کتاب النذور والایمان عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1524 تا 1547۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 20 de Jami' al-Tirmidhi (El Libro de los Votos y Juramentos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1524 al 1547, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Jami' al-Tirmidhi (Livre des vœux et des serments), dans la partie ouverte du recueil de hadiths d'où proviennent les informations recueillies: les hadiths 1524 à 1547 de cette numérotation. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 20. bölümü, \"Allah Resulü'nün Yemin ve Sözleri Kitabı\" başlığını taşımakta olup, 1524'ten 1547'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 20 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sumpah dan Janji dari Rasulullah\" dan berisi teks 1524 hingga 1547, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
