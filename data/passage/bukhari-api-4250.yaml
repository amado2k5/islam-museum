label: { ar: "صحيح البخاري 4250 — الأب والأبوة", en: "Sahih al-Bukhari 4250 — the father and fatherhood", ur: "صحیح بخاری 4250 — باپ اور والدیت", es: "Sahih al-Bukhari 4250 — El padre y la paternidad" }
text: "… سُفْيَانُ بْنُ سَعِيدٍ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ دِينَارٍ، عَنِ ابْنِ عُمَرَما ـ قَالَ أَمَّرَ رَسُولُ اللَّهِ أُسَامَةَ عَلَى قَوْمٍ، فَطَعَنُوا فِي إِمَارَتِهِ، فَقَالَ \" إِنْ تَطْعَنُوا فِي إِمَارَتِهِ، فَقَدْ طَعَنْتُمْ فِي إِمَارَةِ أَبِيهِ مِنْ قَبْلِهِ، وَايْمُ اللَّهِ لَقَدْ كَانَ خَلِيقًا لِلإِمَارَةِ، وَإِنْ كَانَ مِنْ أَحَبِّ النَّاسِ إِلَىَّ، وَإِنَّ هَذَا لَمِنْ أَحَبِّ النَّاسِ إِلَىَّ بَعْدَهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4250، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4250 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4250، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4250 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
