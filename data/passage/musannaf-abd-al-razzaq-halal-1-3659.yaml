text: "… عن خاله الحارث بن عبد الرحمن بن أَبي ذباب قال: سأَلت ابن المسيّب وعروة بن الزبير عن الرجل يزني بالمرأَة، هل تحلُّ له ابنتها ؟ فقالا : لا يحرم الحرام الحلال. في ص وابنة خطأ. أخرج سعيد نحوه من وجه …"
