text: "… وما حولها قد كثروا بها وربلوا الى البحرين فكانت طسم والعاليق وأميم وجاسم قوما عربا لسانهم الذى جُبلوا عليه لسانْ عربىّ، ولكانت فارس من أهل المشرق ببلاد فارس يتكلّمون بهذا اللسان الفارسىّ، قال وولد ارم بن سام بن نوح عوص، …"
summary:
