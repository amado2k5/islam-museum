label: { ar: "صحيح مسلم 5141 — الدواء، الداء", en: "Sahih Muslim 5141 — the drug; the disease and its remedy", ur: "صحیح مسلم 5141 — دوا، بیماری", es: "Sahih Muslim 5141 — El medicamento; la enfermedad y su remedio", fr: "Sahih Muslim 5141 — le médicament; la maladie et son remède", tr: "Sahih Muslim 5141 — Tıp, Hastalık", id: "Sahih Muslim 5141 — Kedokteran, Penyakit" }
text: "… بْنُ الْمُثَنَّى، وَمُحَمَّدُ بْنُ بَشَّارٍ، - وَاللَّفْظُ لاِبْنِ الْمُثَنَّى - قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ عَلْقَمَةَ بْنِ وَائِلٍ، عَنْ أَبِيهِ، وَائِلٍ الْحَضْرَمِيِّ، أَنَّ طَارِقَ بْنَ سُوَيْدٍ الْجُعْفِيَّ، سَأَلَ النَّبِيَّ عَنِ الْخَمْرِ فَنَهَا أَوْ كَرِهَ أَنْ يَصْنَعَهَا فَقَالَ إِنَّمَا أَصْنَعُهَا لِلدَّوَاءِ فَقَالَ \" إِنَّهُ لَيْسَ بِدَوَاءٍ وَلَكِنَّهُ دَاءٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5141، يذكر الدواء، والداء، والتداوي بالمحرم. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5141 (The Book of Drinks), that mentions the drug, the disease and its remedy, treatment with what is forbidden. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5141، جس میں دوا، بیماری، حرام سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 5141 (El Libro de las Bebidas), menciona el medicamento, la enfermedad y su remedio, así como el tratamiento con lo que está prohibido. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5141 (Le Livre des Boissons), mentionne la drogue, la maladie et son remède, ainsi que le traitement par des substances interdites. Le Répertoire des médicaments le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5141 numaralı hadis, tıp, hastalık ve haram maddelerle tedaviden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5141, menyebutkan tentang obat-obatan, penyakit, dan pengobatan dengan zat-zat terlarang. Hadits ini disusun oleh seorang peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
