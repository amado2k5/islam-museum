label: { ar: "الموطأ 2572 — أبو الزناد عن سليمان بن يسار: السائبة الذي قتل ابن رجل من بني عائذ", en: "Muwatta 2572" }
summary:
  ar: "يروي يحيى عن مالك عن أبي الزناد عن سليمان بن يسار أن سائبة أعتقه بعض الحجاج، فقتل ابن رجل من بني عائذ، فجاء أبو المقتول إلى عمر بن الخطاب يطلب دية ابنه، فقال عمر: لا دية له. فقال العائذي: أرأيت لو قتله ابني؟ فقال عمر: إذن تخرجون ديته. فقال العائذي: هو إذن كالأرقم، إن يُترك يلقم، وإن يُقتل ينقم. {cite:muwatta-maruf-1997 p.449}"
