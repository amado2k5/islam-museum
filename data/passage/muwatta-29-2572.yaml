summary:
  ar: "يروي يحيى عن مالك عن أبي الزناد عن سليمان بن يسار أن سائبة أعتقه بعض الحجاج، فقتل ابن رجل من بني عائذ، فجاء أبو المقتول إلى عمر بن الخطاب يطلب دية ابنه، فقال عمر: لا دية له. فقال العائذي: أرأيت لو قتله ابني؟ فقال عمر: إذن تخرجون ديته. فقال العائذي: هو إذن كالأرقم، إن يُترك يلقم، وإن يُقتل ينقم. {cite:muwatta-maruf-1997 p.449}"
  tr: "Yahya, Malik'ten, o da Ebu el-Zinad'dan, o da Süleyman ibn Yasar'dan rivayet eder ki, Sa'iba, Haccac'ın bazı üyeleri tarafından serbest bırakıldı. Sonra Beni Aidh kabilesinden bir adamın oğlunu öldürdü. Öldürülen adamın babası, oğlu için kan parası istemek üzere Ömer ibn el-Hattab'a geldi. Ömer, \"O, hiçbir kan parasına hak kazanmaz\" dedi. Aidh kabilesinden adam, \"Ya oğlum onu öldürmüş olsaydı?\" diye sordu. Ömer, \"O zaman kan parasını öderdin\" dedi. Aidh kabilesinden adam, \"O zaman o bir yılan gibidir; yalnız bırakılırsa ısırır, öldürülürse intikam alır\" dedi. {cite:muwatta-maruf-1997 s.449}"
  id: "Yahya meriwayatkan dari Malik, dari Abu al-Zinad, dari Sulayman ibn Yasar, bahwa Sa'iba dibebaskan oleh sebagian dari kaum al-Hajjaj. Kemudian ia membunuh putra seorang pria dari suku Bani 'A'idh. Ayah dari pria yang terbunuh itu datang kepada Umar ibn al-Khattab untuk meminta uang darah untuk putranya. Umar berkata, \"Dia tidak berhak atas uang darah apa pun.\" Pria dari 'A'idh itu berkata, \"Bagaimana jika putraku yang membunuhnya?\" Umar berkata, \"Maka kamu harus membayar uang darahnya.\" Pria dari 'A'idh itu berkata, \"Maka dia seperti ular; jika dibiarkan, ia akan menggigit, dan jika dibunuh, ia akan membalas dendam.\" {cite:muwatta-maruf-1997 p.449}"
