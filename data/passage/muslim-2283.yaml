label: { ar: "مسلم 2283 — مثلي كمثل النذير العريان", en: "Muslim 2283 — The likeness of the plain warner" }
text: "قال النبي: إن مثلي ومثل ما بعثني الله به كمثل رجل أتى قومه فقال: يا قوم إني رأيت الجيش بعيني وإني أنا النذير العريان فالنجاء، فأطاعه طائفة من قومه فأدلجوا فنجوا، وكذبت طائفة منهم فأصبحوا مكانهم فصبحهم الجيش فأهلكهم واجتاحهم"
summary:
  ar: "رواية أبي موسى الأشعري في باب مثل ما بعث به النبي من الهدى والعلم من كتاب الفضائل في صحيح مسلم؛ مثل من أطاع النبي واتبع ما جاء به ومثل من عصاه وكذبه."
