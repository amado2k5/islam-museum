label: { ar: "صحيح مسلم 2876 — الحرام", en: "Sahih Muslim 2876 — the unlawful", ur: "صحیح مسلم 2876 — حرام", es: "Sahih Muslim 2876 — lo ilícito", fr: "Sahih Muslim 2876 — l'illicite" }
text: "… وَيَحْيَى بْنُ أَيُّوبَ، وَقُتَيْبَةُ، وَابْنُ، حُجْرٍ قَالَ يَحْيَى بْنُ يَحْيَى أَخْبَرَنَا وَقَالَ الآخَرُونَ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ جَعْفَرٍ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، أَنَّهُ سَمِعَ عَبْدَ، اللَّهِ بْنَ عُمَرَ -ما - يَقُولُ قَالَ رَسُولُ اللَّهِ \" خَمْسٌ مَنْ قَتَلَهُنَّ وَهُوَ حَرَامٌ فَلاَ جُنَاحَ عَلَيْهِ فِيهِنَّ الْعَقْرَبُ وَالْفَارَةُ وَالْكَلْبُ الْعَقُورُ وَالْغُرَابُ وَالْحُدَيَّا \". وَاللَّفْظُ لِيَحْيَى بْنِ يَحْيَى."
summary:
  ar: "حديث في صحيح مسلم، رقم 2876، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 2876 (The Book of Pilgrimage), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 2876، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 2876 (El Libro de la Peregrinación), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 2876 (Le Livre du Pèlerinage), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
