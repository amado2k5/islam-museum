text: "… أو يتوضأ، وينامُ عليه، وينامُ عقبه، فَتَرَاجَعُ إليه قواه، وليحذرِ الحركة والرياضة عقبه، فإنها مضرة جداً. فصل في هديه غل في علاج العِشق هذا مرض من أمراض القلب، مخالف لسائر الأمراض في ذاته وأسبابه وعِلاجه، وإذا تمكِّنَ داؤُه، وإنما حكاه …"
