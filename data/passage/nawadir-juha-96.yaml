label: { ar: "نوادر جحا الكبرى، ص 48 — «لم أسامرها في حديث»", en: "Nawadir Juha al-Kubra, p. 48 — 'I Never Chatted with Her'", ur: "نوادر جحا الکبریٰ، ص 48 — «میں نے کبھی اس سے بات چیت نہیں کی»", fr: "Nawadir Juha al-Kubra, p. 48 — « Je n'ai jamais bavardé avec elle »", es: "Nawadir Juha al-Kubra, p. 48 — «Nunca conversé con ella»", tr: "Juha'nın Büyük Fıkraları, s. 48 — “Onunla konuşmadım”", id: "Anekdot-anekdot Hebat Juha, hlm. 48 — “Aku tidak berbicara dengannya”" }
text: "… لم أسامرها في حديث ذهب يوماً إلى المحكمة، وأخبر القاضي بأنَّهُ عازِمٌ على تطليقِ أمرأتِهِ."
summary:
  ar: "ذهب جحا إلى المحكمة ليطلق زوجته، فلما سُئل عن اسمها واسم أبيها قال إنه لم يتحدث معها قط بما يكفي ليسألها. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  en: "Juha goes to the court to divorce his wife; asked her name and her father's name, he says he has never talked with her enough to ask. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  ur: "جحا اپنی بیوی کو طلاق دینے عدالت گیا؛ اس سے بیوی کا نام اور اس کے باپ کا نام پوچھا گیا تو اس نے کہا کہ میں نے اس سے کبھی اتنی بات ہی نہیں کی کہ یہ پوچھ سکوں۔ {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  fr: "Juha se rend au tribunal pour divorcer de sa femme ; interrogé sur son nom et celui de son père, il dit qu'il n'a jamais assez parlé avec elle pour le lui demander. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  es: "Juha va al tribunal para divorciarse de su mujer; al preguntarle su nombre y el de su padre, dice que nunca ha hablado con ella lo bastante como para preguntárselo. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
  tr: "Juha, karısından boşanmak için mahkemeye gitti ve karısının adını ve babasının adını sorduklarında, bunu soracak kadar onunla hiç konuşmadığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 48}"
  id: "Juha pergi ke pengadilan untuk menceraikan istrinya, dan ketika ditanya nama istrinya dan nama ayahnya, dia mengatakan bahwa dia tidak pernah cukup berbicara dengannya untuk menanyakan hal itu. {cite:juha-nawadir-kubra-djuwaydi p. 48}"
