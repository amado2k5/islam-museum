text: "… جهدٌ من مُقِل. كلمة الحكمة ضالّة كل حكيم. القناعة مال لا ينفد. أستغنوا عن الناس ولو بشوص السواك. الاقتصاد في النفقة نصف المعيشة، والتودد إلى الناس نصف العقل، وحسن السؤال نصف العلم. المؤمن من أمِنه الناس، والمسلم من سلم المسلمون …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 86، يذكر وصف المؤمن، ووصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 86, that mentions a description of the believer, a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 86 کا اقتباس جس میں مومن کا وصف، مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 1, pág. 86, que menciona una descripción del creyente y del musulmán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 1, p. 86) contient une description du croyant et du musulman; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn el-Cevzi'nin \"Sifatü'l-Safve\" (Seçkinlerin Özellikleri) adlı eserinin 1. cildinin 86. sayfasından, mümin ve Müslümanı anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibn al-Jawzi \"Sifat al-Safwa\" (Ciri-ciri Kaum Elit), Jilid 1, halaman 86, yang menjelaskan tentang orang beriman dan seorang Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat orang beriman."
