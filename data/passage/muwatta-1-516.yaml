ref: "1.516"
label: { ar: "الموطأ 516 — زيد بن خالد الجهني بالحديبية: أصبح من عبادي مؤمن بي وكافر بي", en: "Muwatta 516" }
text: "فأما من قال: مطرنا بفضل الله ورحمته، فذلك مؤمن بي كافر بالكوكب. وأما من قال: مطرنا بنوء كذا وكذا، فذلك كافر بي مؤمن بالكوكب"
summary:
  ar: "أول حديث في باب الاستمطار بالنجوم. يرويه يحيى عن مالك عن صالح بن كيسان عن عبيد الله بن عبد الله بن عتبة بن مسعود عن زيد بن خالد الجهني: صلى النبي صلاة الصبح بالحديبية على إثر سماء كانت من الليل، فلما انصرف أقبل على الناس فسألهم أتدرون ماذا قال ربكم، قالوا الله ورسوله أعلم، فقال: قال أصبح من عبادي مؤمن بي وكافر بي؛ فمن قال مُطرنا بفضل الله ورحمته فذلك مؤمن بي كافر بالكوكب، ومن قال مُطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب. ويخرّجه المحقق عند البخاري (846، 1038) ومسلم (1/59) وأبي داود (3906) والنسائي (925) وأحمد وابن حبان وأبي عوانة وابن منده والبغوي من طرق أصحاب مالك، ويحيل على التمهيد (16/283). {cite:muwatta-maruf-1997 p.266} {cite:muwatta-maruf-1997 p.267}"
