label: { ar: "الموطأ 516 — زيد بن خالد الجهني بالحديبية: أصبح من عبادي مؤمن بي وكافر بي", en: "Muwatta 516", es: "Muwatta 516", fr: "Muwatta 516", ur: "موطا 516", tr: "El-Muvatta 516 — Zeyd ibn Halid el-Cuhani at el-Hudeybiye: Kullarımın bir kısmı bana iman etti, bir kısmı da bana inkâr etti.", id: "Al-Muwatta 516 — Zayd ibn Khalid al-Juhani at al-Hudaybiyyah: Sebagian hamba-Ku telah beriman kepada-Ku dan sebagian lagi telah kafir kepada-Ku." }
text: "فأما من قال: مطرنا بفضل الله ورحمته، فذلك مؤمن بي كافر بالكوكب. وأما من قال: مطرنا بنوء كذا وكذا، فذلك كافر بي مؤمن بالكوكب"
summary:
  ar: "أول حديث في باب الاستمطار بالنجوم. يرويه يحيى عن مالك عن صالح بن كيسان عن عبيد الله بن عبد الله بن عتبة بن مسعود عن زيد بن خالد الجهني: صلى النبي صلاة الصبح بالحديبية على إثر سماء كانت من الليل، فلما انصرف أقبل على الناس فسألهم أتدرون ماذا قال ربكم، قالوا الله ورسوله أعلم، فقال: قال أصبح من عبادي مؤمن بي وكافر بي؛ فمن قال مُطرنا بفضل الله ورحمته فذلك مؤمن بي كافر بالكوكب، ومن قال مُطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب. ويخرّجه المحقق عند البخاري ⁦(846، 1038)⁩ ومسلم (1/59) وأبي داود (3906) والنسائي (925) وأحمد وابن حبان وأبي عوانة وابن منده والبغوي من طرق أصحاب مالك، ويحيل على التمهيد (16/283). {cite:muwatta-maruf-1997 p.266} {cite:muwatta-maruf-1997 p.267}"
  id: "Hadits pertama tentang memohon hujan melalui bintang-bintang. Diriwayatkan oleh Yahya dari Malik, dari Salih ibn Kaysan, dari Ubaydullah ibn Abdullah ibn Utbah ibn Mas'ud, dari Zayd ibn Khalid al-Juhani: Nabi (shalawat dan salam kepadanya) melaksanakan salat Subuh di al-Hudaybiyyah setelah semalaman hujan. Setelah selesai, beliau menoleh kepada orang-orang dan bertanya kepada mereka, \"Apakah kalian tahu apa yang dikatakan Tuhan kalian?\" Mereka menjawab, \"Allah dan Rasul-Nya lebih mengetahui.\" Dia berkata, \"Dia berfirman, 'Pagi ini sebagian hamba-Ku menjadi beriman kepada-Ku dan sebagian lagi menjadi kafir kepada-Ku. Barang siapa berkata, \"Kami diberi hujan karena karunia dan rahmat Allah,\" maka dia adalah orang yang beriman kepada-Ku dan kafir kepada bintang-bintang. Dan barang siapa berkata, \"Kami diberi hujan oleh bintang ini dan itu,\" maka dia adalah orang yang kafir kepada-Ku dan beriman kepada bintang-bintang.'\" Hadits ini terdapat dalam kumpulan hadits al-Bukhari (846, 1038), Muslim (1/59), Abu Dawud (3906), al-Nasa'i (925), Ahmad, Ibn Hibban, Abu 'Awanah, Ibn Mandah, dan al-Baghawi, melalui sanad para sahabat Malik. Penulis merujuk pada al-Tamhid (16/283). {kutip:muwatta-maruf-1997 hal.266} {kutip:muwatta-maruf-1997 hal.267}"
