label: { ar: "الموطأ 2090 — مالك: فيمن يشتري الأرض فيعمرها بالأصل يضعه فيها، أو البئر يحفرها، ثم يأتي رجل فيدرك فيها حقا فيريد أخذها بالشفعة: لا شفعة له إلا أن يعطيه قيمة ما عمر", en: "Muwatta 2090", es: "Muwatta 2090", fr: "Muwatta 2090", ur: "موطا 2090", tr: "Al-Muwatta 2090 — Malik: Bir kimse arazi satın alıp üzerine ekim yaparak veya kuyu kazarak geliştirirse, sonra başka bir adam gelip o arazi üzerinde hak iddia eder ve öncelikli satın alma yoluyla almak isterse: geliştirdiği şeyin değerini ona vermedikçe öncelikli satın alma hakkı yoktur.", id: "Al-Muwatta 2090 — Malik: Mengenai seseorang yang membeli tanah dan mengembangkannya dengan menanaminya, atau menggali sumur, kemudian orang lain datang dan mengklaim hak atas tanah itu dan ingin mengambilnya dengan hak prioritas: dia tidak memiliki hak prioritas kecuali jika dia memberikan nilai dari apa yang telah dikembangkannya." }
summary:
  ar: "قال مالك في الرجل يشتري الأرض فيعمرها بالأصل يضعه فيها، أو البئر يحفرها، ثم يأتي رجل فيدرك فيها حقا، فيريد أن يأخذها بالشفعة: إنه لا شفعة له فيها، إلا أن يعطيه قيمة ما عمر، فإن أعطاه قيمة ما عمر كان أحق بشفعته، وإلا فلا حق له فيها. {cite:muwatta-maruf-1997 p.255}"
  tr: "Malik, bir adamın arazi satın alıp, üzerine ağaç dikerek veya kuyu kazarak geliştirmesi ve daha sonra başka bir adamın gelip arazi üzerinde hak iddia etmesi ve öncelikli satın alma yoluyla almak istemesi durumunda şunları söylemiştir: Eğer geliştirdiği arazinin değerini ona vermezse, öncelikli satın alma hakkına sahip değildir. Eğer geliştirdiği arazinin değerini ona verirse, öncelikli satın alma hakkına sahip olur; aksi takdirde, arazi üzerinde hiçbir hakkı yoktur. {cite:muwatta-maruf-1997 s.255}"
  id: "Malik berkata mengenai seorang pria yang membeli tanah dan mengembangkannya dengan menanam tanaman atau menggali sumur, lalu seorang pria lain datang dan mengklaim hak atas tanah tersebut, dan ingin mengambilnya dengan hak prioritas: ia tidak memiliki hak prioritas kecuali jika ia memberikan nilai dari apa yang telah dikembangkannya. Jika ia memberikan nilai dari apa yang telah dikembangkannya, maka ia memiliki hak prioritas, jika tidak, ia tidak memiliki hak atas tanah tersebut. {cite:muwatta-maruf-1997 p.255}"
