label: { ar: "الموطأ 2090 — مالك: فيمن يشتري الأرض فيعمرها بالأصل يضعه فيها، أو البئر يحفرها، ثم يأتي رجل فيدرك فيها حقا فيريد أخذها بالشفعة: لا شفعة له إلا أن يعطيه قيمة ما عمر", en: "Muwatta 2090" }
summary:
  ar: "قال مالك في الرجل يشتري الأرض فيعمرها بالأصل يضعه فيها، أو البئر يحفرها، ثم يأتي رجل فيدرك فيها حقا، فيريد أن يأخذها بالشفعة: إنه لا شفعة له فيها، إلا أن يعطيه قيمة ما عمر، فإن أعطاه قيمة ما عمر كان أحق بشفعته، وإلا فلا حق له فيها. {cite:muwatta-maruf-1997 p.255}"
