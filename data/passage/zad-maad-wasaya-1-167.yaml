text: "… أبو داود:، وابن ماجه:، ولم يُصل عليهم. وكان إذا مات المُحرِمُ، أمر أن يُغسل بماء وسِدْر، ويُكفن في ثوبيه وهما ثوبا إحرامه: إزاره ورداؤه، وينهى عن تطييبه وتغطية رأسه البخاري:، ومسلم: وكان يأمر من ولي الميتَ أن يُحسن كفنه، ويُكفنه …"
