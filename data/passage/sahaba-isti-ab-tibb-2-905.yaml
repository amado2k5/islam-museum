text: "… : امرأة من أسلم، كان رسول اللّٰه وايلي قد جعل سعد بن معاذ في خيمتها في مسجده أحدهما فيما ذكروا، فسقطت على صخرة، ليعوده من قريب، وكانت أمرأَة تداوي الجرحى، فأسقطت وأهراقت الدماء، فلم يزل بها مرضها ذلك حتّى ماتت …"
