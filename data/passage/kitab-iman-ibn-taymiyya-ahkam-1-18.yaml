  tr: "İbn Teymiye'nin \"İman\" (İman) adlı eserinin 1. cildinin 18. sayfasından, farz ameller, toplu yükümlülükler, görevler ve sorumluluklardan bahseden bir bölüm. Bu bölüm, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ibnu Taymiyyah \"Al-Iman\" (Keimanan), Jilid 1, halaman 18, yang menyebutkan amalan wajib, kewajiban kolektif, tugas, dan tanggung jawab. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk amalan wajib, tugas, perbuatan taat, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
