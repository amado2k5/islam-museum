text: "… الجهاد واجب وترك الارتياب واجب والجهاد وإن كان فرضاً على الكفاية فجميع المؤمنين يخاطيون به ابتداءاً فعليهم كلهم اعتقاد وجوبه والعزم على فعله إذا تعين، ولهذا قال الني علي ه من مات ولم يغز ولم يحدث نفسه بغزو مات على …"
summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 18، يرد فيه ذكر الفرض، وفرض الكفاية، والواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
