id: passage/muwatta-1-005
class: passage
unit: hadith
work: work/muwatta-malik
ref: "1.5"
label: { ar: "الموطأ 5 — من أدرك ركعة من الصبح قبل طلوع الشمس", en: "Muwatta 5" }
text: "من أدرك ركعة من الصبح قبل أن تطلع الشمس فقد أدرك الصبح، ومن أدرك ركعة من العصر قبل أن تغرب الشمس فقد أدرك العصر"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار وبسر بن سعيد والأعرج عبد الرحمن بن هرمز، ثلاثتهم عن أبي هريرة، أن النبي جعل من أدرك ركعة من الصبح قبل طلوع الشمس مدركاً للصبح، ومن أدرك ركعة من العصر قبل غروبها مدركاً للعصر؛ وهو في باب وقوت الصلاة. ويخرّجه المحقق من طرق أصحاب مالك عند البخاري (579) ومسلم (2/102) والترمذي (186) والنسائي وابن خزيمة وابن حبان، وينقل عن ابن عبد البر أن الإدراك هنا إدراك الوقت لا أن ركعة واحدة تجزئ عن تمام الصلاة، وأن ذلك «إجماع من المسلمين» (التمهيد 3/273). {cite:muwatta-maruf-1997 p.36} {cite:muwatta-maruf-1997 p.37}"
  en: "Whoever catches one rak'a of the dawn or the afternoon prayer has caught the prayer in its time."
