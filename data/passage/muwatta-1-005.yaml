ref: "1.5"
label: { ar: "الموطأ 5 — من أدرك ركعة من الصبح قبل طلوع الشمس", en: "Muwatta 5", es: "Muwatta 5", fr: "Muwatta 5", ur: "موطا 5", tr: "Al-Muwatta 5 — Güneş doğmadan önce sabah namazının bir rekatını kılan kimse", id: "Al-Muwatta 5 — Barangsiapa yang mengerjakan satu rakaat shalat Subuh sebelum matahari terbit" }
text: "من أدرك ركعة من الصبح قبل أن تطلع الشمس فقد أدرك الصبح، ومن أدرك ركعة من العصر قبل أن تغرب الشمس فقد أدرك العصر"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار وبسر بن سعيد والأعرج عبد الرحمن بن هرمز، ثلاثتهم عن أبي هريرة، أن النبي جعل من أدرك ركعة من الصبح قبل طلوع الشمس مدركاً للصبح، ومن أدرك ركعة من العصر قبل غروبها مدركاً للعصر؛ وهو في باب وقوت الصلاة. ويخرّجه المحقق من طرق أصحاب مالك عند البخاري (579) ومسلم (2/102) والترمذي (186) والنسائي وابن خزيمة وابن حبان، وينقل عن ابن عبد البر أن الإدراك هنا إدراك الوقت لا أن ركعة واحدة تجزئ عن تمام الصلاة، وأن ذلك «إجماع من المسلمين» ⁦(التمهيد 3/273)⁩. {cite:muwatta-maruf-1997 p.36} {cite:muwatta-maruf-1997 p.37}"
  en: "Whoever catches one rak'a of the dawn or the afternoon prayer has caught the prayer in its time."
  es: "Quienquiera que capte una rak'a de la oración del amanecer o de la oración de la tarde, habrá captado la oración en su tiempo."
  fr: "Celui qui accomplit une rak'a de la prière de l'aube ou de l'après-midi a accompli la prière en son temps."
  ur: "جس نے فجر یا عصر کی ایک رکعت پالی اس نے نماز کو اپنے وقت پر پال لیا۔"
  id: "Malik meriwayatkannya dari Zayd ibn Aslam, dari Ata ibn Yasar, Busr ibn Sa'id, dan al-A'raj Abd al-Rahman ibn Hurmuz, ketiganya dari Abu Hurayrah, bahwa Nabi (shalawat dan salam kepadanya) berpendapat bahwa siapa pun yang mengerjakan satu rakaat shalat Subuh sebelum matahari terbit telah mengerjakan shalat Subuh, dan siapa pun yang mengerjakan satu rakaat shalat Ashar sebelum matahari terbenam telah mengerjakan shalat Ashar. Hal ini terdapat dalam surah tentang waktu shalat. Editor menyertakannya dari sanad para sahabat Malik dalam al-Bukhari (579), Muslim (2/102), al-Tirmidhi (186), al-Nasa'i, Ibn Khuzaymah, dan Ibn Hibban. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa menangkap waktu shalat di sini berarti menangkap waktu, bukan bahwa satu rakaat sudah cukup untuk seluruh shalat, dan bahwa ini adalah \"konsensus umat Islam\" (al-Tamhid 3/273). {cite:muwatta-maruf-1997 p.36} {cite:muwatta-maruf-1997 p.37}"
