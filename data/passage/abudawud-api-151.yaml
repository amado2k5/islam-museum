label: { ar: "سنن أبي داود 151 — الأب والأبوة", en: "Sunan Abi Dawud 151 — the father and fatherhood", ur: "سنن ابی داؤد 151 — باپ اور والدیت", es: "Sunan Abi Dawud 151 — El padre y la paternidad", fr: "Sunan Abi Dawud 151 — le père et la paternité", tr: "Sunan Abi Davud 151 — Baba ve Babalık", id: "Sunan Abi Dawud 151 — Ayah dan Peran Ayah" }
text: "… مُسَدَّدٌ، حَدَّثَنَا عِيسَى بْنُ يُونُسَ، حَدَّثَنِي أَبِي، عَنِ الشَّعْبِيِّ، قَالَ سَمِعْتُ عُرْوَةَ بْنَ الْمُغِيرَةِ بْنِ شُعْبَةَ، يَذْكُرُ عَنْ أَبِيهِ، قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ فِي رَكْبِهِ وَمَعِي إِدَاوَةٌ فَخَرَجَ لِحَاجَتِهِ ثُمَّ أَقْبَلَ فَتَلَقَّيْتُهُ بِالإِدَاوَةِ فَأَفْرَغْتُ عَلَيْهِ فَغَسَلَ كَفَّيْهِ وَوَجْهَهُ ثُمَّ أَرَادَ أَنْ يُخْرِجَ ذِرَاعَيْهِ وَعَلَيْهِ جُبَّةٌ مِنْ صُوفٍ مِنْ جِبَابِ الرُّومِ ضَيِّقَةُ الْكُمَّيْنِ فَضَاقَتْ فَادَّرَعَهُمَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 151، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 151 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 151، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 151 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 151 (Purification (Kitab Al-Taharah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 151 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 151, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
