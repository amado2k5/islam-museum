text: "… أَكُونَ أَحَبَّ إِلَيَّهِ مِنْ وَالِدِهِ وَوَلَدِهِ. وَخَرَّجَ الْبُخَارِيُّ وَمُسْلِمٌ - أَيْضًا - مِنْ حَدِيثٍ: - أَنَسِ قَالَ: قَالَ رَسُولُ الله وَام: لا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ. محبةُ النبيِّ وَلِقِ من أصولِ الإيمانِ وهي …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 48، يذكر أركان الإيمان، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 48, that mentions the pillars of faith, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 48 کا اقتباس جس میں ارکانِ ایمان، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 48, que menciona los pilares de la fe, aquello sin lo cual la fe no está completa; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye en su lista."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 1, p. 48) mentionnant les piliers de la foi, éléments essentiels à une foi complète; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. cildinin 48. sayfasından, imanın esaslarını ve imanın onsuz tamamlanamayacağı unsurları anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 1, halaman 48, yang menyebutkan rukun-rukun iman dan hal-hal yang tanpanya iman menjadi tidak sempurna; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun-rukun Islam, rukun-rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
