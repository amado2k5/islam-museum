text: "… انبعثت حرارتُه الغريزية، وكان ذلك سيباً لقوة الأرواح الحيوانية والنفسانية والطبيعية، ومتى قويت هذه الأرواح، قويت القوى التي هي حاملة لها، فقهرت المرضَ ودفعته. وكذلك الطبيبُ إذا علم أن لهذا الداء دواء أمكنه طلبُه والتفتيش عليه. وأمراض الأبدان على وزان …"
