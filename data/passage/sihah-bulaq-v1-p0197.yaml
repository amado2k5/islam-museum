text: |-
  الشاءر اه مختصر السحاح
  لنجوابي
  ٤٤٤
  ⁦(باب السين)⁩
  يسان موضع تنسب اليم الخمر قال حسان بن ثابت
  من خربيسان تخيرتها * تريافة توشك فتر العظام
  لتصل التا ⁦(زس)⁩ النرس جعه ترسة وتزاس وأتراس وروس قال بعقوب
  ولا تقل أنرسة ورجل تارس ذورس ورجل ترّاس صاحب ترس والتترّس التستربالنرس
  وكذلك التتريس والمترس خشبة توضع خاف الباب ⁦(نعس)⁩. التعس الهلاك وأصله
  السكب وهوضد الانتعاش وقد نعس بالفتح يتعس نعسا وأتعسه اللّٰه قال مجمع بن هلال
  تقول وقدأفردتها من حليلها • تعست كما أتعستنى يا مجمع
  يقال تعس الفلان أى ألزمه اللّٰه هلا كا وس التوس الطبيعة والحيم يقال قلان من
  توس صدق أم ن أصل صدق ( يس لتيس من المعزوالهمع تيوس وأتياس قال
  الهذلى ١ من فوقه أنسرسود وأغربة * وتحته أعنز كلف وأتياس
  والتياس الذى يمسكه يقال للذكر من الظباء أيضائيس وللانى عنز والمتيوسا. التيوس ويقال
  استتيست العنزكما يقال استنوق الجهل وفى فلان تيسية وناس يتولون تيسوسية وكيفوفية
  ولا أدرى ما صحتهما
  صل الجيم بس الجبس الجبان الفدم قال الاصعى يقال انه لجس من
  الرجال اذا كان عيا وتحبس فى مشيته أى تبختر قال عم روبن لجأ
  تمشى الى رواء عاطناتها • تجبس العانس فى ريطاتها
  جس الجاس فى القتال مثل الحجماش قال الاصمى بقال جاحسته وجاحشته اذا
  زاحته وزاولته على الامر وأنشد
  ان عاش قاسى لك ما أقاسى *من ضربى الهامات واجتباسى * والصفع في يوم الوغى الجاس
  وقال رؤبة يوماترانى فىء راك الحجس * تنبو باجلال الامور الربس
  ج-دس) جديس قييلة كانت فى الدهر الاوّل فانة رضت والجادسة الارض التى
  لم تعمر ولم تحرث وفى حديث معاذمن كانت لهارض جادسة قد عرفت له فى الجماهلية -تى
  أسلم فهى ربهار جرس الجرس والجرس الصوت الخفى ويقال سمعت جرس الطيراذ!
  ععت صوت مناقيرها على شءتا كاه وفى الحديث فيسمعون جرس طير الجنة هال الاصمعى
  كنت فى مجلس شعبة قال فيسمعون جرش طير الجفة بالشين فقلت جرص فنظر الىّ فقال
  خذوها عنه فانه أعلم بهذا منا وتقول أبرس الطائراذا سمعت صوت مرّه قال الراجز
  حتى اذا أجرس كل طائر * قامت تعنظى بك سمع الحاضر
  وكذلك أجرس الحلى اذاسمعت صوت جرسه وقال
  تسمع للحلى اذا ما وسوسا وارتج فى أجيادها وأجرسا
  وقد أجرسنى السبع اذا ممع جرسى عن ابن السكيت وجرست النحل العرفط تجرس اذا
  أكلته ومنه قبل للنحل جوارسقال الشاعر.
  تظل على النمراء منها جوارس • مراضيع شهب الريس زغب رقابها
  ومضى جرس من الليسل أى طائفة منه والجرس بالتريك الذى يعلق فى عنق البعير والذى
  إضرب
