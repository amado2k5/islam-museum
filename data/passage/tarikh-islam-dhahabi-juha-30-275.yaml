text: "… سواه، لأنّ كُتُبَه احترقت. أنبأه الصَّيْمَرِيّ عنه، عن أحمد بن إسحاق بن البهلول، عن أبي كريب. وكان أبو بكر هذا يلقّب خُبَاط. وله كتاب في الأصول على مذهب الشافعي، وكان فيه دُعَابَة. محمد بن محمد بن عبد اللّٰه بن محمد …"
summary:
  ar: "مقطع من تاريخ الإسلام ووفيات المشاهير والأعلام، المجلد المصوَّر 30، ص 275، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, scan volume 30, p. 275, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "تاریخ الاسلام والفاعیۃ المشاہیر والعالم، اسکین جلد 30، ص 275 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volume numérisé 30, p. 275, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Tarikh al-Islam wa-Wafayat al-Mashahir wa'l-A'lam, volumen escaneado 30, p. 275, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "\"İslam Tarihi ve Ünlü Kişilerin Ölümleri\" adlı resimli cilt 30'un 275. sayfasından, zeki ve aptal bireyler hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Sejarah Islam dan Kematian Tokoh-Tokoh Terkenal,\" Jilid Bergambar 30, halaman 275, berisi cerita tentang individu yang cerdas dan bodoh; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
