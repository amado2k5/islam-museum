text: "ولما وقع بعضُ الصحابة على ذلك، رقي بها اللديغ، فبرأ لوقته، فقال له النبي لم: ومَا أَدْرَاكَ أَنَّهَا رُقْيَة البخاري:، وملسم:. ومن ساعده التوفيق، وأَعين بنور البصيرة حتى وقف على أسرارِ هذه السورة، وما اشتملت عليه مِن التوحيد، ومعرفة الذات …"
