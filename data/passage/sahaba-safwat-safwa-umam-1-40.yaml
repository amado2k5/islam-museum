text: "… هاجر كان يبعث إليها بكسوةٍ و صلة، فجاءه خبرها سنة سبع مرجعَه من خيبر أنها توفيت. عن عروة قال: كانت ثويبة لأبي لهب وأعتقها، فأرضعت النبي بيّةِ، فلما مات أبو لهب رآه بعض أهله في النوم، قال : ماذا لقيت …"
summary:
