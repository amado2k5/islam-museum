text: |-
  ٢٢٠
  رباب الدإل)
  {جوذ)
  يظل أمام بيتك مجلهذا * كما ألقيت بالسند الوضينا
  يصفه بالكل
  ( جلعد الجلعد الصاب الشديد والجلاعد من الابل الشديد قال الفقعسى
  صوّى اهاذا كدنة جلاعدا لم يرع بالاضياف الافارداوابهع الخلاعد بالنتح وجعدم وضع
  •ن يلادقيس لد الجلد والحلود الصخر والجلد الابل الكثيرة وذات الجلاميد
  موضع ( جد الجد بالتسكين ماجده ن الماء وهو نقيض الذوب وهو مصدرسمى به وابهد
  بالتحرين جمع جامد مشل خادم وخدم يقال قد كثر الجد وجد المناء يجمد بمد اوحودا
  أى قام وكذلك الدم وغيره اذا يبس وجادى الاولى وحادى الا خرة بفتح الدال من
  أسماء الشهوروه وفعالى من الجهد وال-دمئل عسر وعسر مكان صلب مرتفع قال
  امر ؤالقيس
  كأنّ الصوار اذيجاهدن غدوة * على بمدخيل تجول باجلال
  والجمع أحماد وبماد مثل رمح وأرماح ورماح وابهاد بالفتح الارض التى لم يص-بها مطروناقة
  جاد لالين لها وسنة جمادلا معار فيها ويقال للبخيل جادله أى لازال جامد الحال وانمابى على
  الكسرلاته معدول عن المصدرأى الجود كقواهم فجارأى الفجرة و«ونقيض قواهسم سماد
  بالحناء فى المدح قال المتهس
  ججادلها ججادولا تقولى • لها أبدا اذاذكرت حاد
  أى قولى لهاجودا ولا تقولى لها حدا وسكراوعين جود لاد مع لها والج مذ البرم وربما
  أفاض بالقداح لاجل الايسار قال الشاءر طرفة
  وأصفر مضوح نفارت سويره على النار واستودعته كف مجمد
  يقول انتظرت صوته على النارسين قوّمته وأعلمته فهو كالحماورة منه وكان الاصبعى يقول
  هوالداخل فى جادى وكان جادى فى ذلك الوقت شهربرد (جند الجند الاعوات
  والانصاروة_لان جند الجنودو فى الحديث الارواح جنود مجندة والشام خسة أجناد
  دمشق وحص وقنسرون والاردن وفد طين يقال لكل مدينة منها جند قال الشاعر
  الفرزدق : فقلت ماهوالا الشام تركبه • كانما الموت فى أجناده البعر
  وجند بالتحريك بلد بالمن ⁦(جهد )⁩ الجهد والجهد الطاقة وقرئ والذين لا يجدون
  الاجهدهم وجهدهم قال الفرّاء الجهد بالضم الطاقة والجهد بالفتح من قولك اجهد جهدك
  فى هذا الامر أى ابلغ غايتك ولا يقال أجهد جهدك والجهد المثقسة بقال جه-ددابته
  وأجهدها اذا حل عليها فى السيرفوق طاقتها وجهد الرجل فى كذا أى جدفيه وبالغ
  وجهدت اللبن فهو مجه ود أى أخرجت زيده كل ته وجهدت الطعام استهيته والجاهد
  الشهوان وجهد الطعام وأجه-دأى اشتت وجهدت الطعام اذا أكثرت من أكله ومرعى
  جهيد جهده المال وجهد الرج-ل فهو مجهود م ن المشقة يقال أصابهم محوط من المطر
  فجهد واجهداشديدا وجهد عيثهم بالكسرأى نكد واشتد والجهاد بالفتح الارض الصلبة
  وجاهد فى سبيل اللّٰه مجاهدة وجهادا والاجتهاد والتجاهد بذل الوسع والمجهود ⁦(جود )⁩
  شى جيدع لى فيعل والجمع جياد وجياتد بالهم زعلى غسيرقياس والجود المطر الغزير تقول جاء
  المعارج ودافهوج ندوالجمع جود مثل صاحب وصحب وهاحت لنا-عاءجود و-طارنامطارتين
  جردي
