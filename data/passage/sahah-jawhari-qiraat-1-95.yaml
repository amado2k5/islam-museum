text: "… وظُؤَارٍ، وآظآرٍ. وقد أَبْسِطَتِ الناقةُ، أي : تُرِكتْ مع ولدها. ويَدٌ بُسْطّ أيضًا، أي : مُطْلقةٌ، وفي قراءة عبد الله: بل يَدَاهُ بُسْطَانِ المائدة :. بسطم: بِسْطَام ليس من أسماء العرب، وإنّما سمَّى قيسُ بن مسعود ابنَه بِسْطَامًا باسم ملكِ …"
summary:
