text: "… حرم ذلك إلى يوم القيامة، فمن كان عنده منهى شيء فليحل سبيله، ولا تأخذوا مما آتيتموهى شيئا، انتهى. وفي لفظ : قال : نهى عن المتعة، وقال : ألا إنها حرام، من يومكم هذا إلى يوم القيامة، ومن كان أعطى …"
