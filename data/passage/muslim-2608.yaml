label: { ar: "مسلم 2608 — ما تعدون الصرعة فيكم؟ ليس الذي لا يصرعه الرجال", en: "Muslim 2608 — What do you count as strength? Not the one men cannot throw", es: "Musulmán 2608 — ¿Qué consideras fuerza? No la que los hombres no pueden lanzar", fr: "Muslim 2608 — Qu'est-ce que vous considérez comme la force ? Ce n'est pas celle que les hommes ne peuvent jeter.", ur: "مسلم 2608 — آپ کس چیز کو طاقت سمجھتے ہیں؟ وہ نہیں جو مرد پھینک نہیں سکتے", tr: "Müslim 2608 — Aranızda güçlü adam kimdir? Erkekler tarafından yere serilemeyen adam değil.", id: "Muslim 2608 — Apa yang kalian anggap sebagai orang yang kuat di antara kalian? Bukan orang yang tidak dapat digulingkan oleh orang lain." }
text: "قال رسول الله: «ما تعدون الصرعة فيكم؟» قالوا: الذي لا يصرعه الرجال، قال: «ليس بذلك، ولكنه الذي يملك نفسه عند الغضب»"
summary:
  ar: "رواية عبد الله بن مسعود في باب تحريم الغضب من كتاب البر في صحيح مسلم — سؤال وجواب يعيد تعريف الشدة والرقوب على المقاييس النبوية."
  tr: "Sahih Müslim'in Doğruluk Kitabı'ndaki Öfkenin Yasaklanması bölümünde Abdullah bin Mesud'un rivayeti - Soru-Cevap, şiddet ve uyanıklığı Peygamber standartlarına göre yeniden tanımlıyor."
  id: "Riwayat Abdullah bin Masoud dalam bab tentang larangan marah dari Kitab Kebenaran dalam Sahih Muslim — Tanya Jawab mendefinisikan kembali ketegasan dan kewaspadaan sesuai dengan standar kenabian."
