label: { ar: "الموطأ 956 — عائشة كانت تنزل من عرفة بنمرة ثم تحولت إلى الأراك، وتهل ما كانت في منزلها ومن معها، فإذا ركبت وتوجهت إلى الموقف تركت الإهلال", en: "Muwatta 956" }
summary:
  ar: "يرويه مالك عن علقمة بن أبي علقمة عن أمه عن عائشة أم المؤمنين، أنها كانت تنزل من عرفة بنمرة ثم تحولت إلى الأراك، وكانت تهل ما كانت في منزلها ومن كان معها، فإذا ركبت وتوجهت إلى الموقف تركت الإهلال. وكانت تعتمر بعد الحج من مكة في ذي الحجة، ثم تركت ذلك فكانت تخرج قبل هلال المحرم حتى تأتي الجحفة فتقيم بها حتى ترى الهلال، فإذا رأته أهلت بعمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1094) وسويد (503). {cite:muwatta-maruf-1997 p.455} {cite:muwatta-maruf-1997 p.456}"
