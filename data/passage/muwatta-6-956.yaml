label: { ar: "الموطأ 956 — عائشة كانت تنزل من عرفة بنمرة ثم تحولت إلى الأراك، وتهل ما كانت في منزلها ومن معها، فإذا ركبت وتوجهت إلى الموقف تركت الإهلال", en: "Muwatta 956", es: "Muwatta 956", fr: "Muwatta 956", ur: "موطا 956", tr: "Al-Muwatta 956 — Aişe, Arafat'tan Namirah'a iner, sonra da Al-Arak'a giderdi ve evinde, yanındakilerle birlikteyken Talbiye okurdu. Fakat devesine binip ibadet yerine doğru giderken Talbiye okumayı bırakırdı.", id: "Al-Muwatta 956 — Aisyah biasa turun dari Arafat ke Namirah, kemudian ia pindah ke Al-Arak, dan ia membaca Talbiyah ketika berada di rumahnya dan bersama orang-orang yang bersamanya. Tetapi ketika ia menaiki untanya dan menuju tempat berdiri, ia berhenti membaca Talbiyah." }
summary:
  ar: "يرويه مالك عن علقمة بن أبي علقمة عن أمه عن عائشة أم المؤمنين، أنها كانت تنزل من عرفة بنمرة ثم تحولت إلى الأراك، وكانت تهل ما كانت في منزلها ومن كان معها، فإذا ركبت وتوجهت إلى الموقف تركت الإهلال. وكانت تعتمر بعد الحج من مكة في ذي الحجة، ثم تركت ذلك فكانت تخرج قبل هلال المحرم حتى تأتي الجحفة فتقيم بها حتى ترى الهلال، فإذا رأته أهلت بعمرة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1094) وسويد (503). {cite:muwatta-maruf-1997 p.455} {cite:muwatta-maruf-1997 p.456}"
  tr: "Malik, Alkame ibn Ebu Alkame'den, annesi Aişe'den (Müminlerin Annesi) rivayet ettiğine göre, Arafat'tan Nemira'ya iner, sonra da Arak'a giderdi. Konakladığı yerde ve yanındakilerle birlikteyken ihram giyerdi. Fakat devesine binip Arafat'a doğru yola çıktığında ihram giymeyi bırakırdı. Zilhicce ayında Hac'dan sonra Mekke'den Umre yapardı, sonra bunu bıraktı. Bunun yerine, Muharrem ayının yeni hilalinden önce yola çıkar, Cuhfe'ye kadar gider ve orada yeni hilali görene kadar kalırdı. Hilali görünce Umre için ihram giyerdi. Araştırmacı, bunun Malik'ten Ebu Musab (1094) ve Suveyd (503) tarafından rivayet edildiğini belirtiyor. {cite:muwatta-maruf-1997 s.455} {cite:muwatta-maruf-1997 s.456}"
  id: "Malik meriwayatkannya dari Alqamah bin Abi Alqamah, dari ibunya, dari Aisyah, Umrah, bahwa ia biasa turun dari Arafat ke Namirah, kemudian pindah ke Al-Arak. Ia memasuki keadaan ihram ketika berada di penginapannya dan bersama orang-orang yang bersamanya. Tetapi ketika ia menaiki untanya dan menuju tempat berdiri (Arafat), ia berhenti memasuki keadaan ihram. Ia biasa melaksanakan Umrah setelah Haji dari Mekah pada bulan Dzul-Hijjah, kemudian ia berhenti melakukannya. Sebagai gantinya, ia berangkat sebelum bulan sabit Muharram hingga sampai di Al-Juhfah dan tinggal di sana sampai melihat bulan sabit. Ketika melihatnya, ia memasuki keadaan ihram untuk Umrah. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Musab (1094) dan Suwaid (503). {kutip:muwatta-maruf-1997 hal.455} {kutip:muwatta-maruf-1997 hal.456}"
