label: { ar: "الموطأ 2504 — مالك: المأمومة والمنقلة والموضحة لا تكون إلا في الوجه والرأس", en: "Muwatta 2504", es: "Muwatta 2504", fr: "Muwatta 2504", ur: "موطا 2504", tr: "Al-Muwatta 2504 — Malik: Baş yaralanmasına, baş yarasına veya kemiği açığa çıkaran yaralara neden olan yaralar yalnızca yüz ve baş bölgesinde bulunur.", id: "Al-Muwatta 2504 — Malik: Luka yang menyebabkan cedera kepala, luka di kepala, atau luka yang memperlihatkan tulang hanya ditemukan di wajah dan kepala." }
summary:
  ar: "قال مالك: الأمر عندنا أن المأمومة والمنقلة والموضحة لا تكون إلا في الوجه والرأس، فما كان في الجسد من ذلك فليس فيه إلا الاجتهاد. {cite:muwatta-maruf-1997 p.430}"
  tr: "Malik şöyle dedi: Aramızda yerleşik uygulama şudur ki, kafa travmasına, kırığa yol açan kafa travmasına veya kemiği açığa çıkaran bir yara yalnızca yüz ve kafa bölgesinde meydana gelebilir. Vücudun diğer bölgelerindeki yaralar için ise bağımsız yargıdan başka çare yoktur. {cite:muwatta-maruf-1997 s.430}"
  id: "Malik berkata: Praktik yang sudah mapan di antara kita adalah bahwa luka yang menyebabkan cedera kepala, luka kepala yang menyebabkan patah tulang, atau luka yang memperlihatkan tulang hanya dapat terjadi di wajah dan kepala. Adapun luka di bagian tubuh lainnya, tidak ada jalan lain selain menggunakan penilaian independen. {cite:muwatta-maruf-1997 p.430}"
