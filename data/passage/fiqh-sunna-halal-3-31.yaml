text: "… وفيه حياة مستقرة، فإنه يجب في هذه الحال ذكاته، ولا يحل بدونها. وجود الصيد ميتا بعد أصابته : إذا رمى الصائد الصيد فأصابه ثم غاب عنه ثم وجده بعد ذلك ميتّا، فإنه يكون حلالاً بشروط ثلاثة : الأول : أن …"
