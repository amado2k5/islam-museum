text: |-
  ⁦(ف صل الحا.)⁩
  ٣٠٣
  عند وادى القرى قال اللّٰه تعالى كذب أصحاب الجر المرسلين والحجرأ يضا الاثى من الخيل
  والحماجر والحاجور ما يمسك الماء من شفة الوادى وهوفاءول من الجروهوالمنع وجمع
  الحاجر جم راز مثل حارو-وران وشاب وشبان والمحجر مثال المجاس المديقه قال لبيد
  بكرت به جرشية منطورة * تروى المحاجربازل علكوم
  ومحجر العين أيضا ما يدو من النقاب والمحجر بالفتح ماحول الريه ومنه محاجر أقيال المين
  وهى الاحماء كان لكل واحدمنهم حى لا يرعاه غسيره والمحجر أيضا الحجروهوالحرام قال
  -دبزتورf
  فهموت أن أغشى اليها محجرا * ولمثاها يغشى اليه المحجر
  ويقال حجر الق واذا استداريخط دقيق من غير أن يغلف وكذلك اذا صارت حوله دارة
  فى الغيم والتحجير أبضا أن تسم حول عين البعير بميسم .سستدير ومحجر بالتشديداسم موضع
  والاصمعى ية وله بكسر الجيم وغيره يفتح رحجار بالتشديد اسم رجل من يكربن وائل والخجرة
  والحنجور الحلوم بزيادة الذون ⁦( حدر)⁩ الحادرمن الرجال المجتمع الخلق عن الاصمعى
  تقول منه حدربالضم يحد رحدراوعين حدرة أى. كتنزة صلية قال امرو لقيس
  ومين لها حدرة بدرة+وشقت ما قيهما من أخر
  وناقة حادرة العينين اذا امتسلا تاوالمدرة من الابل بالضم فحوالصرمة والمادورالقرط
  فى قول الشاءر بائنة المفكب من حادورها والمدرمشل الهبب وهو ما انخدرمن
  الارض يقال كاغد يغط فى حدر والحد ورالهبوط وهوالمكان تحدرمنه والمدوربالضم
  فعلك وحدرت السفينة أحدرها حدرا اذا أرسلتها الى أسفل ولا يقال أحدرتها وحدرتهم
  السنة أى حطتهم وجاءت بهم -دورا وحدرجلد الرجل يحدر حسد ورا أى ورم من الضرب
  وحدرته أنا حدرا يتعدى ولا يتعدى وأحدرته أيضا وافحد رجاده تورم وأحد رئو به أى
  كفه وكذلك اذا فتل أطراف «دبه كما يفعل بأطراف الاكسسية وحدر فى قراءته وفى أذانه
  يعدرحدرا أى أسرع وحى ذوحدورة أى ذواجتماع وكثرة والانحدار الانهباط تقول
  نحدرت الى البصرة والموضع منحدر وتحدّر الدمع أى تنزل والحندر والخندور وافمدورة
  الحدقة يقال هو على حند رعينه وحند ور عينه وحندورة عمنه اذا كان يستثقله ولا يقد رأن
  ينظر البه بغضا قال الفراه يقال جعلته على حنديرة عبنى وحندورة عبى اذا جعلته
  نصب عينك و-دراء اسم امرأة والحيدرة الاس-دوقال لى رضى اللّٰه عنه أنا الذى
  سمتنى أمى حيدره لانّ أمه غاطمة بنت أسد لما ولدنه وأبوط الب غائب سمقه أسداباسم
  أبيها فلا قدم أبوطالب كرهذا الاسم فسماه عليا ⁦(حدبر )⁩ الحدبارمن الموق
  الضاهرة التى قد يبس لهامن الهزال ويدت حراقفها يقال ناقة حدبار وحدبيرونوق حدابير
  ⁦( حذر)⁩ الحذر والحذر التحرز وقد حذرت الشئ أحذره حذرا ورجل حذر
  وحذر ١ ى متيقظ متحرزوالجمع حذرون وحذارى وحذرون وأنشدسيبويه فى تعديه
  حذرأ مور الاتخاف وآمن • ماليس منجيه من الاقدار
  وهذا نادرلان النعت اذاجا على فعل لا يتعدى الى مفعول واتتحذير التخويف والمذار
