label: { ar: "الموطأ 1808 — مالك عن حميد الطويل عن أنس بن مالك: نهى عن بيع الثمار حتى تزهي، أي حتى تحمر، وقال أرأيت إذا منع الله الثمرة فبم يأخذ أحدكم مال أخيه", en: "Muwatta 1808" }
summary:
  ar: "يروي مالك عن حميد الطويل عن أنس بن مالك أن رسول الله نهى عن بيع الثمار حتى تزهي. فقيل له: يا رسول الله، وما تزهي؟ فقال: حين تحمر. وقال رسول الله: أرأيت إذا منع الله الثمرة، فبم يأخذ أحدكم مال أخيه؟ {cite:muwatta-maruf-1997 p.140}"
