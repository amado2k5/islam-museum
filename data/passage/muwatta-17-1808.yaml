label: { ar: "الموطأ 1808 — مالك عن حميد الطويل عن أنس بن مالك: نهى عن بيع الثمار حتى تزهي، أي حتى تحمر، وقال أرأيت إذا منع الله الثمرة فبم يأخذ أحدكم مال أخيه", en: "Muwatta 1808", es: "Muwatta 1808", fr: "Muwatta 1808", ur: "موطا 1808", tr: "El-Muvatta 1808 — Malik, Humaid el-Tawil'den, o da Enes bin Malik'ten rivayetle: Meyvelerin olgunlaşıncaya, yani kızarana kadar satılmasını yasakladı. Dedi ki: “Ya Allah meyveyi vermezse? O halde sizden biri kardeşinin parasını nasıl alabilir?”", id: "Al-Muwatta 1808 — Malik, berdasarkan riwayat Humaid Al-Tawil, berdasarkan riwayat Anas bin Malik: Beliau melarang penjualan buah-buahan sebelum matang, yaitu sebelum berubah warna menjadi merah. Beliau berkata, “Bagaimana jika Allah menahan buah itu? Lalu bagaimana mungkin salah seorang dari kalian mengambil uang saudaranya?”" }
summary:
  ar: "يروي مالك عن حميد الطويل عن أنس بن مالك أن رسول الله نهى عن بيع الثمار حتى تزهي. فقيل له: يا رسول الله، وما تزهي؟ فقال: حين تحمر. وقال رسول الله: أرأيت إذا منع الله الثمرة، فبم يأخذ أحدكم مال أخيه؟ {cite:muwatta-maruf-1997 p.140}"
  tr: "Malik, Humaid el-Tawil'den, o da Enes ibn Malik'ten rivayet ettiğine göre, Allah Resulü meyvenin olgunlaşana kadar satılmasını yasaklamıştır. Ona, \"Ey Allah Resulü, 'olgunlaşmış' ne demektir?\" diye soruldu. O da, \"Kırmızıya döndüğünde\" diye cevap verdi. Allah Resulü ayrıca, \"Ya Allah meyveyi vermezse? O halde sizden biri kardeşinin parasını nasıl alabilir?\" diye buyurdu. {cite:muwatta-maruf-1997 s.140}"
  id: "Malik meriwayatkan dari Humaid al-Tawil, dari Anas ibn Malik, bahwa Rasulullah SAW melarang penjualan buah sebelum matang. Beliau ditanya, \"Wahai Rasulullah, apa yang dimaksud dengan 'matang'?\" Beliau menjawab, \"Ketika buah itu berubah warna menjadi merah.\" Rasulullah SAW juga bersabda, \"Bagaimana jika Allah menahan buah itu? Lalu bagaimana mungkin salah seorang dari kalian mengambil uang saudaranya?\" {cite:muwatta-maruf-1997 p.140}"
