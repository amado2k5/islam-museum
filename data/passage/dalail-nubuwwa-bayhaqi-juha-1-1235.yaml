text: "… كتاب الفضائل، باب إذا أراد اللّٰه تعالى رحمة أمة قبض نبيها قبلها، الحديث، ص -. قال المازري : هذا الحديث من الأحاديث المتقطعة في مسلم، فإنه لم يُسَمِّ الذي حدثه عن أبي أسامة، وقال الحافظ بن حجر في النكت الظراف …"
summary:
  ar: "مقطع من دلائل النبوة، المجلد المصوَّر 1، ص 1235، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Dalail al-Nubuwwa, scan volume 1, p. 1235, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "دلائل النبوۃ، اسکین جلد 1، ص 1235 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Dalail al-Nubuwwa, volume numérisé 1, p. 1235, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Dalail al-Nubuwwa, volumen escaneado 1, p. 1235, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Peygamberliğin Alametleri, Resimli Cilt 1, sayfa 1235'ten, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Tanda-Tanda Kenabian, Jilid Bergambar 1, halaman 1235, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
