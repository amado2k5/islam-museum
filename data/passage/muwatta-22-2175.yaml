label: { ar: "الموطأ 2175 — يحيى عن مالك عن ثور بن زيد الديلي: بلغه أن رسول الله قال: أيما دار أو أرض قسمت في الجاهلية فهي على قسم الجاهلية، وأيما دار أو أرض أدركها الإسلام ولم تقسم فهي على قسم الإسلام", en: "Muwatta 2175" }
summary:
  ar: "قال يحيى: حدثنا مالك عن ثور بن زيد الديلي أنه قال: بلغني أن رسول الله قال: أيما دار أو أرض قسمت في الجاهلية فهي على قسم الجاهلية، وأيما دار أو أرض أدركها الإسلام ولم تقسم فهي على قسم الإسلام. ويذكر المحقق أن الحديث في الموطأ لم يتجاوز به ثور بن زيد، وأن ابن عبد البر رآه موصولا من طريق ابن عباس عند غيره. {cite:muwatta-maruf-1997 p.292}"
