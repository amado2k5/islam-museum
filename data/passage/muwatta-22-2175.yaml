label: { ar: "الموطأ 2175 — يحيى عن مالك عن ثور بن زيد الديلي: بلغه أن رسول الله قال: أيما دار أو أرض قسمت في الجاهلية فهي على قسم الجاهلية، وأيما دار أو أرض أدركها الإسلام ولم تقسم فهي على قسم الإسلام", en: "Muwatta 2175", es: "Muwatta 2175", fr: "Muwatta 2175", ur: "موطا 2175", tr: "El-Muvatta 2175 — Yahya, Malik'ten, o da Sevr ibn Zeyd el-Dili'den rivayet ettiğine göre: Allah Resulü şöyle buyurmuştur: İslam öncesi dönemde bölünmüş olan her ev ve arazi, İslam öncesi döneme göre bölünecektir; İslam'ın girdiği ve bölmediği her ev ve arazi ise İslam'a göre bölünecektir.", id: "Al-Muwatta 2175 — Yahya, dari Malik, dari Thawr ibn Zayd al-Dili: Telah sampai kepadanya bahwa Rasulullah SAW bersabda: Setiap rumah atau tanah yang dibagi pada masa pra-Islam tunduk pada pembagian menurut masa pra-Islam, dan setiap rumah atau tanah yang masuk ke dalam Islam dan tidak dibagi, tunduk pada pembagian menurut Islam." }
summary:
  ar: "قال يحيى: حدثنا مالك عن ثور بن زيد الديلي أنه قال: بلغني أن رسول الله قال: أيما دار أو أرض قسمت في الجاهلية فهي على قسم الجاهلية، وأيما دار أو أرض أدركها الإسلام ولم تقسم فهي على قسم الإسلام. ويذكر المحقق أن الحديث في الموطأ لم يتجاوز به ثور بن زيد، وأن ابن عبد البر رآه موصولا من طريق ابن عباس عند غيره. {cite:muwatta-maruf-1997 p.292}"
  tr: "Yahya şöyle dedi: Malik, bize Sevr ibn Zeyd el-Deyli'den rivayet etti ki, o da şöyle dedi: Bana ulaştı ki, Allah Resulü şöyle buyurdu: “İslam öncesi dönemde bölünen her ev ve arazi, İslam öncesi dönemin bölüşümlerine tabidir; İslam'a girip bölünmeyen her ev ve arazi ise İslam'ın bölüşümlerine tabidir.” Araştırmacı, el-Muvatta'daki hadisin Sevr ibn Zeyd'den öteye nakledilmediğini ve İbn Abd el-Barr'ın bunu İbn Abbas'tan gelen bağlantılı bir rivayet zinciriyle başka kaynaklarda gördüğünü belirtiyor. {cite:muwatta-maruf-1997 s.292}"
  id: "Yahya berkata: Malik meriwayatkan kepada kami dari Thawr ibn Zayd al-Dayli, yang berkata: Telah sampai kepadaku bahwa Rasulullah SAW bersabda: “Rumah atau tanah yang dibagi pada masa pra-Islam tetap tunduk pada pembagian masa pra-Islam, dan rumah atau tanah yang masuk Islam dan tidak dibagi tetap tunduk pada pembagian Islam.” Peneliti menyebutkan bahwa hadits dalam al-Muwatta’ tidak diriwayatkan selain oleh Thawr ibn Zayd, dan bahwa Ibnu Abd al-Barr melihatnya dengan sanad yang terhubung dari Ibnu Abbas dalam sumber lain. {cite:muwatta-maruf-1997 p.292}"
