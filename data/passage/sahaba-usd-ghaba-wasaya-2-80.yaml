  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 2, sayfa 80'deki bir alıntısında, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsedilmektedir; bu alıntı, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
