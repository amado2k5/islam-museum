text: "… بن مالك بن النجار وهم بنو حُدَيْلة: أنس بن سعد الواقدي، قال: ممن سكن البصرة أهبان بن معاذ بن أنس بن قيس، ونسبه كما ذكرناه، وقد تقدّم صيفي الغفاري، ويكنّى: أبا مسلم، وأوصَى أن ذكره. يكفّن في ثوبين فكفّنوه في …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 80، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 80, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 80 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
