label:
  ar: "النسائي 1835 — إذا أحب عبدي لقائي أحببت لقاءه"
  en: "Nasa'i 1835 — When My servant loves to meet Me, I love to meet him"
  ur: "نسائی 1835 — جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں"
text: "قال الله تعالى إذا أحب عبدي لقائي أحببت لقاءه وإذا كره لقائي كرهت لقاءه ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 1835: إذا أحب عبدي لقائي أحببت لقاءه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 1835: When My servant loves to meet Me, I love to meet him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 1835: جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
