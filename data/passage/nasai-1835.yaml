ref: "1835"
label:
  ar: "النسائي 1835 — إذا أحب عبدي لقائي أحببت لقاءه"
  en: "Nasa'i 1835 — When My servant loves to meet Me, I love to meet him"
  ur: "نسائی 1835 — جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں"
  es: "Nasa'i 1835 — Cuando mi siervo desea encontrarse conmigo, yo también deseo encontrarme con él."
  fr: "Nasa'i 1835 — Quand Mon serviteur aime Me rencontrer, J'aime le rencontrer"
  tr: "Nisaî 1835 — Kulum benimle buluşmayı seviyorsa, ben de onunla buluşmayı severim."
  id: "Al-Nisa'i 1835 — Jika seorang hamba-Ku senang bertemu dengan-Ku, maka Aku pun senang bertemu dengannya."
text: "قال الله تعالى إذا أحب عبدي لقائي أحببت لقاءه وإذا كره لقائي كرهت لقاءه ."
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 1835: إذا أحب عبدي لقائي أحببت لقاءه. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 1835: When My servant loves to meet Me, I love to meet him. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 1835: جب میرا بندہ مجھ سے ملنا پسند کرے تو میں اس سے ملنا پسند کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan al-Nasa'i, n.° 1835: Cuando Mi siervo desea encontrarse conmigo, Yo deseo encontrarme con él. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan an-Nasa'i, n° 1835: « Quand Mon serviteur désire Me rencontrer, Je désire le rencontrer. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "Sunan an-Nasa'i'de 1835 numaralı hadis-i kudsi şöyledir: \"Kulum benimle buluşmayı severse, ben de onunla buluşmayı severim.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi, altı şeriat hadis külliyatında ve el-Muvatta'da bu hadisin rivayetlerini derlemiştir."
  id: "Sebuah hadits qudsi dalam Sunan an-Nasa'i, no. 1835: \"Jika seorang hamba-Ku mencintai untuk bertemu dengan-Ku, maka Aku pun mencintai untuk bertemu dengannya.\" Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta'."
