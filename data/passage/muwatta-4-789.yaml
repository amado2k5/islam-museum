label: { ar: "الموطأ 789 — عائشة وحفصة: مثل ذلك", en: "Muwatta 789", es: "Muwatta 789", fr: "Muwatta 789", ur: "موطا 789", tr: "El-Muvatta 789 — Aişe ve Hafsa: Aynı", id: "Al-Muwatta 789 — Aisha dan Hafsa: Sama" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن عائشة وحفصة زوجي النبي مثل ذلك، أي مثل قول ابن عمر في اشتراط الإجماع قبل الفجر. ويذكر المحقق أن في نسخة م «بمثل»، وأن يحيى بن أيوب رواه عن عبد الله بن أبي بكر عن الزهري عن سالم عن أبيه عن حفصة عن النبي مرفوعاً، وأن الترمذي (730) قال إن حديث حفصة لا يُعرف مرفوعاً إلا من هذا الوجه، وأن الصحيح عنده الموقوف، ويحيل على العلل الكبير (202). {cite:muwatta-maruf-1997 p.388}"
  tr: "Malik, İbn Şihab'dan, o da Peygamberin eşleri Ayşe ve Hafsa'dan rivayet ederek, tıpkı İbn Ömer'in şafak sökmeden önce ittifakın gerekliliği hakkındaki sözüne benzer şekilde nakletmiştir. Editör, M el yazmasında bunun \"benzer\" olduğunu ve Yahya ibn Ayyub'un bunu Abdullah ibn Abi Bekr'den, o da el-Zuhri'den, o da Salim'den, o da babasından, o da Hafsa'dan, o da Peygamberden rivayet ederek, Peygambere kadar uzanan bir hadis olarak naklettiğini belirtmektedir. Ayrıca Tirmizi'nin (730), Hafsa hadisinin bu zincir dışında Peygambere kadar uzanan bir hadis olarak bilinmediğini ve ona göre doğru versiyonun bir Sahabeye kadar uzanan versiyon olduğunu söylediğini de belirtmektedir. El-İlal el-Kebir'e (202) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.388}"
  id: "Malik meriwayatkannya dari Ibn Shihab, dari Aisyah dan Hafsa, istri-istri Nabi, serupa, yaitu, serupa dengan apa yang dikatakan Ibn Umar mengenai persyaratan konsensus sebelum fajar. Editor menyebutkan bahwa dalam manuskrip M, hadits tersebut \"serupa dengan,\" dan bahwa Yahya ibn Ayyub meriwayatkannya dari Abdullah ibn Abi Bakr, dari al-Zuhri, dari Salim, dari ayahnya, dari Hafsa, dari Nabi, sebagai hadits yang ditelusuri kembali kepada Nabi. Ia juga mencatat bahwa al-Tirmidhi (730) mengatakan bahwa hadits Hafsa tidak dikenal sebagai hadits yang ditelusuri kembali kepada Nabi kecuali melalui sanad ini, dan bahwa versi yang benar, menurutnya, adalah versi yang ditelusuri kembali kepada seorang Sahabat. Ia merujuk pada al-`Ilal al-Kabir (202). {mengutip:muwatta-maruf-1997 hal.388}"
