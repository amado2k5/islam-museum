label: { ar: "الموطأ 789 — عائشة وحفصة: مثل ذلك", en: "Muwatta 789" }
summary:
  ar: "يرويه مالك عن ابن شهاب عن عائشة وحفصة زوجي النبي مثل ذلك، أي مثل قول ابن عمر في اشتراط الإجماع قبل الفجر. ويذكر المحقق أن في نسخة م «بمثل»، وأن يحيى بن أيوب رواه عن عبد الله بن أبي بكر عن الزهري عن سالم عن أبيه عن حفصة عن النبي مرفوعاً، وأن الترمذي (730) قال إن حديث حفصة لا يُعرف مرفوعاً إلا من هذا الوجه، وأن الصحيح عنده الموقوف، ويحيل على العلل الكبير (202). {cite:muwatta-maruf-1997 p.388}"
