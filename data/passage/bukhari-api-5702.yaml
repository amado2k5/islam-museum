label: { ar: "صحيح البخاري 5702 — الحجامة، الكي", en: "Sahih al-Bukhari 5702 — cupping; cautery", ur: "صحیح بخاری 5702 — حجامہ، داغنا" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبَانَ، حَدَّثَنَا ابْنُ الْغَسِيلِ، قَالَ حَدَّثَنِي عَاصِمُ بْنُ عُمَرَ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ سَمِعْتُ النَّبِيَّ يَقُولُ \" إِنْ كَانَ فِي شَىْءٍ مِنْ أَدْوِيَتِكُمْ خَيْرٌ فَفِي شَرْبَةِ عَسَلٍ أَوْ شَرْطَةِ مِحْجَمٍ أَوْ لَذْعَةٍ مِنْ نَارٍ، وَمَا أُحِبُّ أَنْ أَكْتَوِيَ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5702، يذكر الحجامة، والكي، والتداوي بالعسل. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5702 (Medicine), that mentions cupping, cautery, honey as a remedy. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5702، جس میں حجامہ، داغنا، شہد سے علاج کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
