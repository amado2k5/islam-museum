text: "حَيَّان بن نَمْلة ثلاثة أشياء كان ينهاهم عنها، وحرم عليهم ثلاثة أشياء كان الناس يستحلونها، أحل لهم لحوم الأضاحي، وزيارة القبور، والأوعية، ونهاهم أن يباع سهم من مغنم حتى يقسم، وعن السبايا أن يوطأن حتى يضعن، وأن تباع ثمرة حتى …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 315، يذكر ما أُحل، واستحلال الشيء، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
