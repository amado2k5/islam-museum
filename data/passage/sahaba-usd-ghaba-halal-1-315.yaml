  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 315 کا اقتباس جس میں جو حلال کیا گیا، کسی چیز کو حلال ٹھہرانا، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
