text: "… قامت كذلك أبدًا. - واستُدِلَّ أنه لا تُخالِفُ له سنةٌ أبداً كتابَ اللّٰه، وأن سنتَه، وإن لم يكن فيها نص كتابٍ : لازمةٌ، بما وصفتُ مِن هذا، مع ما ذكرتُ سيوَاه، مما فرضَ اللّه من طاعة رسوله. - ووجب عليه …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 313، يرد فيه ذكر ما فرضه الله ورسوله، والفرض، وطاعة الله ورسوله، وما يجب على المكلف، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 313, whose wording mentions what God and His Messenger made obligatory, the obligatory (fard), obedience to God and His Messenger, what is binding on the person addressed, obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 313 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، فرض، اللہ اور اس کے رسول کی اطاعت، جو مکلف پر واجب ہے، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 313, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard), l'obéissance à Dieu et à Son Messager, ce qui s'impose à la personne responsable, l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 313, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard), la obediencia a Dios y a Su Mensajero, lo que obliga a la persona responsable, la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 313. sayfasından bir alıntı, Allah ve Resulü'nün emrettiği şeyleri, yükümlülükleri, Allah'a ve Resulüne itaati, sorumlu kişiden istenenleri ve itaatin kendisini ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu alıntı, farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 313, menyebutkan apa yang telah ditetapkan oleh Allah dan Rasul-Nya, kewajiban, ketaatan kepada Allah dan Rasul-Nya, apa yang dituntut dari orang yang bertanggung jawab, dan ketaatan itu sendiri. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
