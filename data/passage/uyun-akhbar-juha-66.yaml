text: "… بن حبيب ظهوى بالسياط. قال المنصور لسلم ابن فتيبة : ماترى فى قتل أبى مسلم ؟ فقال سكم لو كان فيهما آلمة إلا اللّٰه لفسدتا فقال : حسبك يابا أَمَيَّة. قال أبو دُلامة أبا مُجْرم ماغيّر اللّٰه نعمة على عبده …"
