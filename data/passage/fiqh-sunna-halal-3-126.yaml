text: "وعن عامر بن ربيعة، قال : قال رسول اللّٰه مليالع : لا يخلون رجل بامرأة لا تحل له، فإن ثالثهما الشيطان إلا لحرم. رواهما أحمد. خطر التهاون في الخلوة وضرره : درج كثير من الناس على التهاون في هذا الشأن، …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 3، ص 126، يذكر ما أُحل، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
