text: "… اللّٰه في المنام على الصفة المذ كورة في الأحاديث الصحيحة، وسأله عن حديث مثل المؤمنين في تواددهم وتواصلهم وتراحمهم كثل الجسد إذا اشتكى عضو منه تدأعى له سائر الجسد بالحمى والسهر، فأشار إليه أنه صحيح وكررها ثلاث مرات. وسأله عن …"
