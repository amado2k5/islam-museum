text: "بابُ فضل الذِّكر: الاجتهاد في الطاعة - حدَّثنا الحسينُ، أخبرنا ابنُ المُبارَك، أخبرنا سليمانُ بن مُغِيرةَ، عن أبيه، عن أمِّ صَفيّةَ وهُنَيدةَ، أَحتَي مَذْعورٍ، قالتا: لمّا انطَلَقَ مَذْعورٌ إلى الشّام، قلنا له: أَوصِنا، قال: يا بِنتَي أُمِّ، اعمَلا في هذا …"
summary:
