text: "كمل من الرجال كثير ولم يكمل من النساء إلا آسية امرأة فرعون ومريم بنت عمران، وإن فضل عائشة على النساء كفضل الثريد على سائر الطعام"
summary:
  ar: "في كتاب أحاديث الأنبياء باب فضل مريم؛ وضع امرأتين من خارج النبوة في أعلى مقام الكمال البشري، وألحق به فضل عائشة في بابه — من أشهر أحاديث مقامات النساء."
