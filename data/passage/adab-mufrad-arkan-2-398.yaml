text: "… عبد القيس أخرجه البخارى فى أداء الخمس من الايمان، ومسلم فى الايمان - حدّثنا عبيد قال: حدثنا يونس بن بكير قال : حدثنا خالد بن دينار أبو خلدة قال : سمعت أنس بن مالك وهو مع الحكم أمير بالبصرة على …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 398، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 2, p. 398, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 2، ص 398 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Adab al-Mufrad de Al-Bujari, volumen 2, pág. 398, que menciona lo que se considera parte de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du traité al-Adab al-Mufrad d'al-Bukhari (tome 2, p. 398), qui mentionne ce qui est considéré comme faisant partie de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 2. cildinin 398. sayfasında, imanın unsurları olarak kabul edilen şeylerden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 2, halaman 398, menyebutkan apa yang dianggap sebagai bagian dari iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
