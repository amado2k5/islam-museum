text: "… البكر حتى يركب وأقل ذلك أن يكون ابن سنتين إلى أن يدخل السادسة فيسمى جملا. وقال الأزهرى : لا يقال إلا للذكر، ولا يقال للأنثى قعودة وإنما يقال لها قلوص، قال : وقد حكى الكسائى فى النوادر قعودة للقلوص وكلام …"
