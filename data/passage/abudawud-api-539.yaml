text: "أَبُو دَاوُدَ وَهَكَذَا رَوَاهُ أَيُّوبُ وَحَجَّاجٌ الصَّوَّافُ عَنْ يَحْيَى ‏.‏ وَهِشَامٌ الدَّسْتَوَائِيُّ قَالَ كَتَبَ إِلَىَّ يَحْيَى ‏.‏ وَرَوَاهُ مُعَاوِيَةُ بْنُ سَلاَّمٍ وَعَلِيُّ بْنُ الْمُبَارَكِ عَنْ يَحْيَى وَقَالاَ فِيهِ ‏\"‏ حَتَّى تَرَوْنِي وَعَلَيْكُمُ السَّكِينَةُ ‏\"‏ ‏.‏"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
