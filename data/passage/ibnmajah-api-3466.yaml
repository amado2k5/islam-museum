label: { ar: "سنن ابن ماجه 3466 — الطب والطبيب", en: "Sunan Ibn Majah 3466 — medicine and the physician", ur: "سنن ابن ماجہ 3466 — طب اور طبیب", es: "Sunan Ibn Majah 3466 — La medicina y el médico", fr: "Sunan Ibn Majah 3466 — La médecine et le médecin", tr: "Sunan İbn Majah 3466 — Tıp ve Hekim", id: "Sunan Ibn Majah 3466 — Kedokteran dan Tabib" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، وَرَاشِدُ بْنُ سَعِيدٍ الرَّمْلِيُّ، قَالاَ حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، حَدَّثَنَا ابْنُ جُرَيْجٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" مَنْ تَطَبَّبَ وَلَمْ يُعْلَمْ مِنْهُ طِبٌّ قَبْلَ ذَلِكَ فَهُوَ ضَامِنٌ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3466، يذكر الطب والطبيب. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3466 (Chapters on Medicine), that mentions medicine and the physician. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3466، جس میں طب اور طبیب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3466 (Capítulos sobre Medicina), menciona la medicina y al médico. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3466 (Chapitres sur la médecine), mentionne la médecine et le médecin. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3466 numaralı hadiste tıp ve hekimden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3466, menyebutkan tentang pengobatan dan dokter. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
