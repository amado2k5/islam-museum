text: "… حَدِيثِ: - قَتَادَةَ، عَنْ أَنَسٍ، عَنِ النَّبِيِّ وَلِ قَالَ: لا يُؤْمِنُ أَحَدُكُم حَتَّى يُحِبَّ لأَخِيهِ مَا يُحِبٌ لِنَفْسِيةِ. لما تَى النبيّ وَلِفِ الإيمانَ عمن لم يحبَّ لأخيه ما يحبُّ لنفسه دلَّ على أن ذلك من خصالِ الإيمانِ؛ بل من واجباته، …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 45، يذكر ما لا يتم الإيمان إلا به، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 45, that mentions what faith is not complete without, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 45 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 45, que menciona los elementos esenciales para que la fe esté completa: las características del creyente. Este extracto, extraído de la lectura automática y citado con un límite de cuarenta palabras según la política de fuentes, se encuentra en la lista de Pillars and Branches of Faith Browser."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 1, p. 45) mentionnant ce qui est indispensable à la foi: les qualités du croyant. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. cildinin 45. sayfasından, imanın tamamlanması için gerekli olan unsurları ve müminin özelliklerini anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 1, halaman 45, yang menyebutkan hal-hal penting untuk penyempurnaan iman dan karakteristik seorang mukmin; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
