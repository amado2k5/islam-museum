text: "… حَدِيثِ: - قَتَادَةَ، عَنْ أَنَسٍ، عَنِ النَّبِيِّ وَلِ قَالَ: لا يُؤْمِنُ أَحَدُكُم حَتَّى يُحِبَّ لأَخِيهِ مَا يُحِبٌ لِنَفْسِيةِ. لما تَى النبيّ وَلِفِ الإيمانَ عمن لم يحبَّ لأخيه ما يحبُّ لنفسه دلَّ على أن ذلك من خصالِ الإيمانِ؛ بل من واجباته، …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 45، يذكر ما لا يتم الإيمان إلا به، وخصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 45, that mentions what faith is not complete without, the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 45 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
