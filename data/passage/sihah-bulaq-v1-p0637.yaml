text: |-
  بَطان الأوّل بضم الباء والثانى
  بالفتح اه
  رسم المباءة بالمدهو الصواب كما
  نصّ عليه المناوى فى شرح
  غاط وذلك سهومنه سامحه اللّه
  عن كون المادّة بوأوأصله مبوأة
  على مف_علدوقلبت الواوألفا قاله
  *مجمه نصر الهور بني غغر له
  ١ أى انتطعتافاتنا هومثل
  يضرب اكل مستويين اه قاموس
  وعراركة طام وكل كيل اه
  وتبرأت من كذا وأنابراء منه وخلاءمنه لا يثى ولا يجمع لانه مصدر فى الاصل مثل سمع سماعا
  فاذا قلت أنا برىء منه وخلى منه ثنيت وجعت وأنتت وقلت فى الجمع نحن منه برآء مثل فقيه
  وفقهاء وبراء أيضاءثل كريم وكرام وابراءمثل شريف وأشراف وأبريأ أيضامثل نصيب
  وانصبا، وبريئون وامر أة بريئة وه ما بريثتان وهن بريئات وبراياورحل برىء وبراء مثسل
  عجيب وعجاب والبراء بالفتح أوّل ليلة من الشهر سيعيت بذلك لتبرؤالقمر من الشمس وأما آخر
  يوم من الشهرفهو النجيرة وبارأت شريكى اذا فارقته وبارا الرجل امر أنه واستبرأت الجارية
  واستبرأت ما عندك سأ بسأت بالرجل وبسئت به بسئاوبوءااذا استأنست به وناقة
  بسولا تمنع الحالب وابس أنى فلان فبسئت به أ لبط عنقيض السرعة تقول منه بطؤ
  مجيئك وأبطأت ذأنت بطىء ولا تسل ابطيت وقد اسقبطأ تك ويقال ما أبطأبك وما بطأ بك
  مسنى وتباطا الرجل فى مسيره ويقال بطان ذاخر وجاوبطان ذاخروجا أى بطؤذاخروجا
  فعلت الفتحة التى فى بطاؤ على نون بطان حين ادت عنه لتكون علمالها ونقلت ضمة الطاء الى
  الباء وانمامح فيه النقل لان معناه التعجب أى ما أيطأه أبوزيد ابطأ القوم اذا كانت
  دوابهم بطاء ⁦(بكاً)⁩ بكأت الفاقة أوالشاة اذاقل لبنها تبكأ بكاً قال سلامة بن حندل
  ولو نفادى بيك. كل محلوب وكذلك بكوت تبكوبكو افهى بكى «وبكئة وأينق بكاء
  قال الشاعر فليأزان وتبكونّ لقاحه • ويعللنّ صبيه بسمار
  ( بوأ المباءة منزل القوم فى كل موضع ويسمى كناس الثور الوحشى حباءة وكذلك معطن
  الابل وبوأت منزلا أى نزاته وبوأت للرجل منزلا وبوأنه منزلا بععنى اى هيأنه ومكنت له ذيه
  واستبا*ه أى اتخسذه مباءة وهو ببيئة سوء مثال بيعة أى بحالسوءوانه لحسن البيئة وبوأت
  الرمح نحوه أى سددته نحوه وأبأت الابل رددتها الى المباءة وأبأت على فلان ماله اذا
  أرحت عليه ابله اوغنمه والباءة مثال الياعة لغة فى المباءة ومنه سمى النكاح باء وباءة لان
  الرجل يتبوّأمن أهله أى يستمكن منها كمايتبوأمن داره وقال يصف الحار والاتن
  يعرس أبكارابها وعنسا • أكرم عرس باءة اذ أعرسا
  والبواء ال-واء ويقسال دم فلان بواءلدم فلان اذا كان كفواله قالت لملى الاخملية فى مقتل
  توية بن الحج
  فان تكن الققلى بواه فانكم • فى ماقتلتم آل عوف بن عامى
  وفى الحدين أمرهم أن يتباءوا والصحيح يقيا ووا على مثال يتقادلوا ويقال كلناهم فأبابونا
  عن بواء واحد أى أجابونا جوابا واحدا وأبأت القاتل بالقتيل واستبأنه اذ اقتلته به أيضا
  أبو زيدياء الرجل بصاحبه اذا قتل به ومنه قولهم باءت عرار بكمل وهما بقرتان قتات احداهما
  بالاخرى ١ يقال بؤبه أى كن عن يقمل به وأنشد الاحر ارجل قتل قاتل أضه فقال
  فقلت له بوْبا مرئ لست مثله • وان كنت قنعا فا لمن يطلب الدما
  قال الاخفسْ وباؤا بغضب من اللّٰه رجعوا به أى صار عليهم قال وكذلان باءيا؟ه يبوه بوءا
  ونة ول باءبحه أى أقر وذا يكون أبدابماعليه لاله قال لبيد
  أنكرت باطلها وبؤت بحقها * عندى ولم تفخر علىّ كرامها
  وفى أرض كذافلاة نبى" فى فلاة أى تذهبَ هأ ) أبو زيد بهأت بالرجل وجئت به بها
