text: "… الحمير ثمانية أم تسعة؟ من عادة أهالي الأناضول على الأكثر أن يتناوبوا الأشغال، فمثلاً لو أقتضى لجماعة منهم أن يطحنوا حبوبهم، يذهب واحدٌ منهم بطحناتٍ رفاقهِ، فبدلاً من أن يذهب عشرةٌ أو خمسة عشر شخصاً، وينتظروا عدَّة أيام لتجيءَ نوبة …"
summary:
  ar: "في الأناضول كان القرويون يتناوبون على حمل الحبوب إلى الطاحونة، فأخذ جحا ثمانية حمير بالطحين، فعدّ ثمانية لكنه ظن أن حماره مفقود، ثم عدّ تسعة ثم ثمانية، فاضطرب وخاف من الجن وتلا أدعية، فوجده رجل وقال إنه نسي أن يعدّ حماره هو. {cite:juha-nawadir-kubra-djuwaydi p. 171}"
  en: "In Anatolia villagers take turns to take grain to the mill; Juha takes eight donkeys with flour; he counts eight but thinks his own is missing; he counts nine, then eight; he panics, fears djinn, and recites prayers; a man finds him and says he forgot to count the donkey he was riding. {cite:juha-nawadir-kubra-djuwaydi p. 171}"
  ur: "اناطولیہ میں گاؤں والے باری باری اناج چکی پر لے جاتے تھے، جحا آٹے کے ساتھ آٹھ گدھے لے گیا، اس نے آٹھ گنے مگر سمجھا کہ اس کا اپنا گدھا گم ہے، پھر نو گنے، پھر آٹھ، وہ گھبرا گیا، جنوں سے ڈرا اور دعائیں پڑھنے لگا، ایک آدمی نے اسے دیکھا اور کہا کہ وہ اپنا گدھا گننا بھول گیا ہے جس پر وہ سوار ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 171}"
  fr: "En Anatolie, les villageois portent à tour de rôle le grain au moulin ; Juha emmène huit ânes chargés de farine ; il en compte huit mais croit que le sien manque ; il en compte neuf, puis huit ; il panique, craint les djinns et récite des prières ; un homme le trouve et lui dit qu'il a oublié de compter l'âne qu'il montait. {cite:juha-nawadir-kubra-djuwaydi p. 171}"
  es: "En Anatolia, los aldeanos se turnan para llevar el grano al molino; Juha lleva ocho burros con harina; cuenta ocho pero cree que le falta el suyo; cuenta nueve, luego ocho; entra en pánico, teme a los genios y recita oraciones; un hombre lo encuentra y le dice que olvidó contar el burro en el que iba montado. {cite:juha-nawadir-kubra-djuwaydi p. 171}"
