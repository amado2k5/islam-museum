text: "… البصري دخلتُ عَليه، فمات في رمضان. رأيت الرَّجل يغمز حماد بن سلمة، فاتّهمْه على الإسلام فإنه كان شديداً على المبتدعة. قال يونُس: مِنْ حمَّاد بن سلمة تعلمت العربية. وليحيى اليزيدي مرثية يقول فيها: يا طالب النَّحْرِ ألاَ فابكِهِ بعدَ أَبي …"
summary:
  ar: "مقطع من سير أعلام النبلاء، المجلد المصوَّر 1، ص 1557، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Siyar A'lam al-Nubala', scan volume 1, p. 1557, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "سیر اعلام النبلاء، اسکین جلد 1، ص 1557 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Siyar A'lam al-Nubala', volume numérisé 1, p. 1557, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Siyar A'lam al-Nubala', volumen escaneado 1, p. 1557, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Siyar A'lam al-Nubala'nın Resimli Cilt 1'inden, s. 1557'den bir alıntı; ölen kişi için bir ağıt ve övgü içeriyor; makine tarafından okunabilir taranmış baskıdan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Siyar A'lam al-Nubala', Jilid Bergambar 1, hlm. 1557, berisi elegi dan pujian untuk almarhum; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan pujian paling terkenal."
