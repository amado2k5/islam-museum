label: { ar: "نوادر جحا الكبرى، ص 150 — «ضع فوق الدينار ستة غروش ونصفاً»", en: "Nawadir Juha al-Kubra, p. 150 — 'Add Six and a Half Piastres to the Dinar'", ur: "نوادر جحا الکبریٰ، ص 150 — «دینار پر ساڑھے چھ قروش اور رکھ دو»", fr: "Nawadir Juha al-Kubra, p. 150 — « Ajoute six piastres et demie au dinar »", es: "Nawadir Juha al-Kubra, p. 150 — «Añade seis piastras y media al dinar»", tr: "Juha'nın Büyük Fıkraları, s. 150 — “Dinarın üzerine altı buçuk piastre koyun”", id: "Anekdot Hebat Juha, hlm. 150 — “Letakkan enam setengah piastres di atas dinar”" }
text: "… ضع فوق الدينار ستة غروش ونصفاً كان جالساً مع جماعة في مجلس أصدقاء له، فتقدَّم إليه رجل من معارفه، قائلاً : أرجو يا سيدي أن تصرف لي هذا الدينار. وكان جحا محافظاً على وقاره مع الجماعة، فأجابه: أهذا وقت ذلك؟ …"
summary:
  ar: "طلب رجل من جحا أن يصرف له ديناراً ذهبياً، فقال جحا إنه ناقص، فطلب الرجل أن يضيف المقدار الناقص، فقال جحا أن يضع فوق الدينار ستة غروش ونصفاً فيصير ديناراً كاملاً. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  en: "A man asks Juha to change a gold dinar; Juha says it is short; the man asks him to add the missing amount; Juha says to add six and a half piastres to the dinar, which makes a full dinar. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  ur: "ایک آدمی نے جحا سے سونے کا دینار کھلا کرانے کو کہا، جحا نے کہا کہ یہ کم ہے، آدمی نے کہا کہ جو کمی ہے وہ پوری کر دو، جحا نے کہا کہ دینار کے اوپر ساڑھے چھ قروش رکھ دو تو پورا دینار بن جائے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  fr: "Un homme demande à Juha de changer un dinar d'or ; Juha dit qu'il est incomplet ; l'homme lui demande d'ajouter ce qui manque ; Juha répond d'ajouter six piastres et demie au dinar, ce qui fait un dinar complet. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  es: "Un hombre pide a Juha que le cambie un dinar de oro; Juha dice que le falta algo; el hombre le pide que añada lo que falta; Juha responde que añada seis piastras y media al dinar, con lo que quedará un dinar completo. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
  tr: "Bir adam Juha'dan altın bir dinarı bozdurmasını istedi. Juha dinarın eksik olduğunu söyledi. Adam Juha'dan eksik miktarı eklemesini istedi, bunun üzerine Juha dinara altı buçuk piastre ekleyerek tam bir dinar yapmasını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 150}"
  id: "Seorang pria meminta Juha untuk menukarkan dinar emas untuknya. Juha mengatakan bahwa dinar itu kurang. Pria itu meminta Juha untuk menambahkan jumlah yang kurang, jadi Juha mengatakan untuk menambahkan enam setengah piastres ke dinar tersebut agar menjadi satu dinar penuh. {cite:juha-nawadir-kubra-djuwaydi p. 150}"
