text: "… وهو خطا، لأنَّه ليس فيه حديث الباب، وأنّما فيه قصة قدوم قيلة على النّبي عل، وامتناعه مله من الإقطاع لحريث بن حسان وافد بكر بن وائل من قوله ماع : صدقت المسكينة، المسلم أخو المسلم... الحديث، وهو مما حسنه ابن …"
