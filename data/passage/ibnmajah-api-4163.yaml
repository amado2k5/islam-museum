label: { ar: "سنن ابن ماجه 4163 — عيادة المريض", en: "Sunan Ibn Majah 4163 — visiting the sick", ur: "سنن ابن ماجہ 4163 — بیمار کی عیادت" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ مُوسَى، حَدَّثَنَا شَرِيكٌ، عَنْ أَبِي إِسْحَاقَ، عَنْ حَارِثَةَ بْنِ مُضَرِّبٍ، قَالَ أَتَيْنَا خَبَّابًا نَعُودُهُ فَقَالَ لَقَدْ طَالَ سُقْمِي وَلَوْلاَ أَنِّي سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" لاَ تَتَمَنَّوُا الْمَوْتَ \". لَتَمَنَّيْتُهُ وَقَالَ \" إِنَّ الْعَبْدَ لَيُؤْجَرُ فِي نَفَقَتِهِ كُلِّهَا إِلاَّ فِي التُّرَابِ \". أَوْ قَالَ \" فِي الْبِنَاءِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4163، يذكر عيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 4163 (Zuhd), that mentions visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4163، جس میں بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
