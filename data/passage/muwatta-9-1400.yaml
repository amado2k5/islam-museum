  ar: "بلغ مالكا عن علي بن أبي طالب مثل ذلك، أي أن الأضحى يومان بعد يوم الأضحى. {cite:muwatta-maruf-1997 p.626}"
  tr: "Malik, Ali ibn Abi Talib'den de benzer bir şey rivayet etmiş ve bunun da Kurban Bayramı kutlamalarının Kurban Bayramı'ndan iki gün sonra olduğu anlamına geldiğini belirtmiştir. {cite:muwatta-maruf-1997 s.626}"
  id: "Malik meriwayatkan hal serupa dari Ali ibn Abi Talib, yang berarti bahwa perayaan Idul Adha berlangsung dua hari setelah Idul Adha. {cite:muwatta-maruf-1997 p.626}"
