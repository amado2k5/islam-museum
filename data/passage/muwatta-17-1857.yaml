summary:
  ar: "قال مالك: إذا اصطرف الرجل دراهم بدينار، ثم وجد فيها درهما زائفا فأراد رده، انتقض صرف ذلك الدينار، ورد إليه ورقه، وأخذ إليه دينار. وتفسير ما كره من ذلك: أن رسول الله قال: الذهب بالورق ربا إلا هاء وهاء. وقال عمر بن الخطاب: وإن استنظرك إلى أن يلج بيته فلا تنظره. فهو إذا رد عليه درهما من صرف، بعد أن يفارقه، كان بمنزلة الدين أو الشيء المستأخر، فلذلك كره ذلك، وانتقض الصرف. وإنما أراد عمر بن الخطاب أن لا يباع الذهب والورق والطعام كله عاجلا بآجل. {cite:muwatta-maruf-1997 p.163} {cite:muwatta-maruf-1997 p.164}"
