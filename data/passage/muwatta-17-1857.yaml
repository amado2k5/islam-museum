label: { ar: "الموطأ 1857 — مالك: إذا اصطرف الرجل دراهم بدينار، ثم وجد فيها درهما زائفا فأراد رده، انتقض صرف الدينار، ورد إليه ورقه وأخذ دينار، لأن الدرهم المردود بعد التفرق بمنزلة الدين", en: "Muwatta 1857", es: "Muwatta 1857", fr: "Muwatta 1857", ur: "موطا 1857", tr: "El-Muvatta 1857 — Malik: Bir kimse dirhemleri dinarla değiştirdikten sonra aralarında sahte bir dirhem bulur ve onu iade etmek isterse, dinar değişimi geçersiz sayılır ve kendisine kağıt parası ve bir dinar geri verilir; çünkü ayrılıktan sonra iade edilen dirhem bir borç sayılır.", id: "Al-Muwatta 1857 — Malik: Jika seseorang menukarkan dirham dengan dinar, kemudian menemukan dirham palsu di antara keduanya dan ingin mengembalikannya, maka penukaran dinar tersebut menjadi tidak sah, dan ia akan mendapatkan kembali uang kertas dan satu dinar, karena dirham yang dikembalikan setelah pemisahan dianggap sebagai hutang." }
summary:
  ar: "قال مالك: إذا اصطرف الرجل دراهم بدينار، ثم وجد فيها درهما زائفا فأراد رده، انتقض صرف ذلك الدينار، ورد إليه ورقه، وأخذ إليه دينار. وتفسير ما كره من ذلك: أن رسول الله قال: الذهب بالورق ربا إلا هاء وهاء. وقال عمر بن الخطاب: وإن استنظرك إلى أن يلج بيته فلا تنظره. فهو إذا رد عليه درهما من صرف، بعد أن يفارقه، كان بمنزلة الدين أو الشيء المستأخر، فلذلك كره ذلك، وانتقض الصرف. وإنما أراد عمر بن الخطاب أن لا يباع الذهب والورق والطعام كله عاجلا بآجل. {cite:muwatta-maruf-1997 p.163} {cite:muwatta-maruf-1997 p.164}"
  id: "Malik berkata: Jika seseorang menukar dirham dengan dinar, dan kemudian menemukan dirham palsu di antara keduanya dan ingin mengembalikannya, maka pertukaran dinar tersebut menjadi tidak sah, dan ia harus mengembalikan dirham asli dan menerima dinar baru. Alasan larangan ini adalah karena Rasulullah shalla Allahu alaihi wa sallam bersabda: “Menukar emas dengan perak adalah riba kecuali jika dilakukan secara langsung.” Umar bin al-Khattab berkata: “Meskipun ia meminta Anda untuk menunggu sampai ia masuk ke rumahnya, jangan berikan penundaan itu.” Jadi, jika ia mengembalikan dirham dari pertukaran setelah ia pergi, itu seperti hutang atau sesuatu yang ditangguhkan, dan itulah sebabnya hal ini dilarang, dan pertukaran tersebut menjadi tidak sah. Umar bin al-Khattab hanya bermaksud bahwa emas, perak, dan semua makanan tidak boleh dijual untuk pembayaran langsung atau pembayaran yang ditangguhkan."
