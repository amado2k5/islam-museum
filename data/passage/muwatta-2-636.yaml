label: { ar: "الموطأ 636 — محمد بن كعب القرظي يعزي القاسم بن محمد بقصة العالم من بني إسرائيل والحلي المستعار", en: "Muwatta 636" }
text: "أفتأسف على ما أعارك الله، ثم أخذه منك وهو أحق به منك؟"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد، قال: هلكت امرأة لي، فأتاني محمد بن كعب القرظي يعزيني، فقص عليّ أن رجلاً من بني إسرائيل فقيهاً عالماً عابداً مجتهداً كانت له امرأة يحبها ويُعجب بها، فماتت فوجد عليها وجداً شديداً حتى اعتزل في بيت وغلق على نفسه واحتجب عن الناس. فجاءته امرأة تقول إن لها حاجة تستفتيه فيها لا يجزيها فيها إلا مشافهته، ولزمت بابه حتى أُذن لها، فقالت: إني استعرت من جارة لي حلياً فكنت ألبسه وأعيره زماناً، ثم أرسلوا إليّ فيه، أفأؤديه إليهم؟ فقال: نعم والله. قالت: إنه قد مكث عندي زماناً. فقال: ذلك أحق لردك إياه إليهم. فقالت: أفتأسف على ما أعارك الله ثم أخذه منك وهو أحق به منك؟ فأبصر ما كان فيه ونفعه الله بقولها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.324} {cite:muwatta-maruf-1997 p.325}"
