label: { ar: "الموطأ 636 — محمد بن كعب القرظي يعزي القاسم بن محمد بقصة العالم من بني إسرائيل والحلي المستعار", en: "Muwatta 636", es: "Muwatta 636", fr: "Muwatta 636", ur: "موطا 636", tr: "El-Muvatta 636 — Muhammed ibn Ka'b el-Kurazi, İsrailoğullarından olan âlimin ve ödünç alınan mücevherlerin hikayesiyle ilgili olarak el-Kasım ibn Muhammed'e başsağlığı dileklerini sunar.", id: "Al-Muwatta 636 — Muhammad ibn Ka’b al-Qurazi menyampaikan belasungkawa kepada al-Qasim ibn Muhammad terkait kisah ulama dari Bani Israel dan perhiasan pinjaman." }
text: "أفتأسف على ما أعارك الله، ثم أخذه منك وهو أحق به منك؟"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن القاسم بن محمد، قال: هلكت امرأة لي، فأتاني محمد بن كعب القرظي يعزيني، فقص عليّ أن رجلاً من بني إسرائيل فقيهاً عالماً عابداً مجتهداً كانت له امرأة يحبها ويُعجب بها، فماتت فوجد عليها وجداً شديداً حتى اعتزل في بيت وغلق على نفسه واحتجب عن الناس. فجاءته امرأة تقول إن لها حاجة تستفتيه فيها لا يجزيها فيها إلا مشافهته، ولزمت بابه حتى أُذن لها، فقالت: إني استعرت من جارة لي حلياً فكنت ألبسه وأعيره زماناً، ثم أرسلوا إليّ فيه، أفأؤديه إليهم؟ فقال: نعم والله. قالت: إنه قد مكث عندي زماناً. فقال: ذلك أحق لردك إياه إليهم. فقالت: أفتأسف على ما أعارك الله ثم أخذه منك وهو أحق به منك؟ فأبصر ما كان فيه ونفعه الله بقولها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.324} {cite:muwatta-maruf-1997 p.325}"
  tr: "Malik, Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayet ederek şöyle dedi: \"Eşim vefat etti ve Muhammed ibn Ka'b el-Kurazi taziye ziyaretine geldi. Bana İsrailoğullarından, ilim sahibi, dindar ve çalışkan bir alim olan bir adamdan bahsetti. Sevdiği ve hayran olduğu bir karısı vardı. Karısı vefat edince, adam onun için çok üzüldü, hatta kendini bir eve kapatıp insanlardan uzaklaştı. Bir kadın yanına geldi ve hukuki bir görüşe ihtiyacı olduğunu, bunun için de ancak onunla doğrudan konuşmanın yeterli olacağını söyledi. Kadın ısrar etti ve adam ona içeri girmesine izin verdi. Kadın, 'Komşumdan bir mücevher ödünç aldım, taktım ve bir süre ödünç verdim. Sonra onu geri istediler. Geri vermeli miyim?' dedi. Adam, 'Evet, Allah'a yemin ederim ki,' dedi. Kadın, 'Ama o mücevher bir süredir bendeydi,' dedi.\" \"O, 'Bu, onu onlara geri vermeni daha da uygun kılıyor' dedi. Kadın, 'Allah'ın sana ödünç verdiği ve sonra senden geri aldığı şey için mi üzülüyorsun? O'nun sana senden daha büyük hakkı var.' dedi. Adam hatasını anladı ve Allah, kadının sözleri aracılığıyla ona fayda verdi.\" Araştırmacı, bunu Ebu Mus'ab ve Suveyd'in Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.324} {cite:muwatta-maruf-1997 s.325}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, yang berkata: \"Istriku meninggal, dan Muhammad ibn Ka'b al-Qurazi datang untuk menyampaikan belasungkawa. Dia bercerita kepadaku tentang seorang pria dari Bani Israel, seorang ulama yang terpelajar, saleh, dan rajin, yang memiliki seorang istri yang sangat dicintai dan dikaguminya. Ketika istrinya meninggal, dia sangat berduka, sampai-sampai dia mengasingkan diri di sebuah rumah, mengunci diri dari orang-orang. Seorang wanita datang kepadanya, mengatakan bahwa dia membutuhkan pendapat hukum, dan bahwa hanya percakapan langsung dengannya yang akan cukup. Dia terus mendesak sampai dia mengizinkannya masuk. Dia berkata, 'Saya meminjam beberapa perhiasan dari tetangga dan memakainya serta meminjamkannya untuk sementara waktu. Kemudian mereka memintanya kembali. Haruskah saya mengembalikannya kepada mereka?' Dia berkata, 'Ya, demi Allah.' Wanita itu berkata, 'Tetapi perhiasan itu sudah ada padaku untuk sementara waktu.'\" Dia berkata, 'Itu justru membuatmu semakin pantas untuk mengembalikannya kepada mereka.' Wanita itu berkata, 'Apakah kamu berduka atas apa yang Allah pinjamkan kepadamu lalu ambil kembali darimu, padahal Dia lebih berhak atasnya daripada kamu?' Dia menyadari kesalahannya, dan Allah memberinya manfaat melalui kata-katanya.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan hadits ini atas otoritas Malik. {cite:muwatta-maruf-1997 p.324} {cite:muwatta-maruf-1997 p.325}"
