text: "لِيَحْمِلُوٓا۟ أَوْزَارَهُمْ كَامِلَةً يَوْمَ ٱلْقِيَـٰمَةِ ۙ وَمِنْ أَوْزَارِ ٱلَّذِينَ يُضِلُّونَهُم بِغَيْرِ عِلْمٍ ۗ أَلَا سَآءَ مَا يَزِرُونَ"
text_search: "ليحملوا أوزارهم كاملة يوم القيامة ۙ ومن أوزار الذين يضلونهم بغير علم ۗ ألا ساء ما يزرون"
translations:
  en: { text: "That they may bear their burdens undiminished on the Day of Resurrection, with somewhat of the burdens of those whom they mislead without knowledge. Ah! evil is that which they bear!", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(اے پیغمبر ان کو بکنے دو) یہ قیامت کے دن اپنے (اعمال کے) پورے بوجھ بھی اٹھائیں گے اور جن کو یہ بےتحقیق گمراہ کرتے ہیں ان کے بوجھ بھی اٹھائیں گے۔ سن رکھو کہ جو بوجھ اٹھا رہے ہیں برے ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
