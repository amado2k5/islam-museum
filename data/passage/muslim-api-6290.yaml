text: "… قُحَافَةَ. قَالَتْ ثُمَّ وَقَعَتْ بِي فَاسْتَطَالَتْ عَلَىَّ وَأَنَا أَرْقُبُ رَسُولَ اللَّهِ وَأَرْقُبُ طَرْفَهُ هَلْ يَأْذَنُ لِي فِيهَا - قَالَتْ - فَلَمْ تَبْرَحْ زَيْنَبُ حَتَّى عَرَفْتُ أَنَّ رَسُولَ اللَّهِ لاَ يَكْرَهُ أَنْ أَنْتَصِرَ - قَالَتْ - فَلَمَّا وَقَعْتُ بِهَا لَمْ أَنْشَبْهَا حِينَ أَنْحَيْتُ عَلَيْهَا - قَالَتْ - فَقَالَ رَسُولُ اللَّهِ وَتَبَسَّمَ إِنَّهَا ابْنَةُ أَبِي بَكْرٍ ."
summary:
  ar: "حديث في صحيح مسلم، رقم 6290، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih Muslim, no. 6290, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح مسلم کی حدیث نمبر 6290، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih Muslim, n° 6290, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih Muslim, n.º 6290, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sahih Müslim'de 6290 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6290, berisi tawa dan senyuman. Hadits ini disusun oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
