text: "الأوسط من حديث عمر بسند ضعيف حديث لا يحل لرجل أن يدخل حليلته الحمام الحديث يأتي في الذي يليه مع اختلاف حديث حرام على الرجال دخول الحمام إلا بمئزر الحديث أخرجه النسائي والحاكم وصححه من حديث جابر من كان يؤمن …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 747، يذكر ما أُحل، وما لا يحل، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
