label: { ar: "صحيح البخاري 3837 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3837 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3837 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3837 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3837 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا يَحْيَى بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنِي ابْنُ وَهْبٍ، قَالَ أَخْبَرَنِي عَمْرٌو، أَنَّ عَبْدَ الرَّحْمَنِ بْنَ الْقَاسِمِ، حَدَّثَهُ أَنَّ الْقَاسِمَ كَانَ يَمْشِي بَيْنَ يَدَىِ الْجَنَازَةِ وَلاَ يَقُومُ لَهَا، وَيُخْبِرُ عَنْ عَائِشَةَ قَالَتْ كَانَ أَهْلُ الْجَاهِلِيَّةِ يَقُومُونَ لَهَا، يَقُولُونَ إِذَا رَأَوْهَا كُنْتِ فِي أَهْلِكِ مَا أَنْتِ. مَرَّتَيْنِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3837، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3837 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3837، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 3837 (Méritos de los Ayudantes en Medina (Ansar)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 3837 (Mérites des Compagnons de Médine (Ansar)), mentionne des nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
