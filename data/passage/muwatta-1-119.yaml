label: { ar: "الموطأ 119 — عائشة: لا ينام الجنب حتى يتوضأ وضوءه للصلاة", en: "Muwatta 119" }
text: "إذا أصاب أحدكم المرأة ثم أراد أن ينام قبل أن يغتسل فلا ينم حتى يتوضأ وضوءه للصلاة"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه عن عائشة، في باب وضوء الجنب إذا أراد أن ينام أو يطعم قبل أن يغتسل: كانت تقول إن من أصاب امرأته ثم أراد أن ينام قبل الغسل فلا ينم حتى يتوضأ وضوءه للصلاة. ويذكر المحقق أن عبد الرزاق رواه عن ابن جريج عن عطاء عن عائشة، وأن له شاهداً من حديث أبي سلمة عن عائشة أن النبي كان إذا أراد أن ينام وهو جنب توضأ وضوءه للصلاة، ويحيل على تعليقه على ابن ماجه. {cite:muwatta-maruf-1997 p.93}"
