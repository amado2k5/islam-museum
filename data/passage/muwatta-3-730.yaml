label: { ar: "الموطأ 730 — مالك سأل ابن شهاب عن الزيتون فقال: فيه العشر", en: "Muwatta 730", es: "Muwatta 730", fr: "Muwatta 730", ur: "موطا 730", tr: "El-Muvatta 730 — Malik, İbn Şihab'a zeytinler hakkında sordu ve o şöyle dedi: \"Zeytinlerin zekâtı vardır.\"", id: "Al-Muwatta 730 — Malik bertanya kepada Ibn Shihab tentang buah zaitun, dan dia berkata: “Ada persepuluhan atas buah zaitun.”" }
text: "فيه العشر"
summary:
  ar: "أول نص في باب زكاة الحبوب والزيتون. يروي مالك أنه سأل ابن شهاب عن الزيتون، فقال: فيه العشر. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن الشيباني (345). {cite:muwatta-maruf-1997 p.366}"
  tr: "Zekat konusunun ilk metni tahıllar ve zeytinler hakkındadır. Malik, İbn Şihab'a zeytinler hakkında sorduğunu ve onun \"Onda bir oranında zekât verilir\" dediğini rivayet eder. Editör, bunun Malik'ten Ebu Mus'ab ve Muhammed ibn el-Hasan el-Şeybani (345) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.366}"
  id: "Teks pertama dalam bab tentang zakat untuk biji-bijian dan zaitun. Malik meriwayatkan bahwa ia bertanya kepada Ibnu Shihab tentang zaitun, dan beliau berkata: “Zakatnya sepersepuluh.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Muhammad ibn al-Hasan al-Shaybani (345). {cite:muwatta-maruf-1997 p.366}"
