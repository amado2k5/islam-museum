label:
  ar: "صحيح البخاري، كتاب السلم"
  en: "Sahih al-Bukhari, Book 35: Sales in which a Price is paid for Goods to be Delivered Later (As-Salam)"
  ur: "صحیح بخاری، کتاب السلم"
  es: "Sahih al-Bukhari, Libro 35: Ventas en las que se paga un precio por bienes que se entregarán posteriormente (As-Salam)"
summary:
  ar: "القسم 35 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب السلم»، ويضم فيها النصوص من 2239 إلى 2256 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 35 of Sahih al-Bukhari (Sales in which a Price is paid for Goods to be Delivered Later (As-Salam)) in the division of the open hadith dataset the museum took its reports from: reports 2239 to 2256 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 35، عنوان «کتاب السلم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2239 تا 2256۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 35 de Sahih al-Bukhari (Ventas en las que se paga un precio por bienes que se entregarán posteriormente (As-Salam)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2239 a 2256 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
