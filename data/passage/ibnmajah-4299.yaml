label:
  ar: "ابن ماجه 4299 — أنا أهل أن أتقى"
  en: "Ibn Majah 4299 — I am the One worthy of being feared"
  ur: "ابن ماجہ 4299 — میں اس لائق ہوں کہ مجھ سے ڈرا جائے"
text: "قال الله عز وجل أنا أهل أن أتقى فلا يجعل معي إله آخر فمن اتقى أن يجعل معي إلها آخر فأنا أهل أن أغفر له . قال أبو الحسن القطان حدثنا إبراهيم بن نصر، حدثنا هدبة بن خالد، حدثنا سهيل …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4299: أنا أهل أن أتقى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4299: I am the One worthy of being feared. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4299: میں اس لائق ہوں کہ مجھ سے ڈرا جائے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
