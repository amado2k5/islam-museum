label:
  ar: "ابن ماجه 4299 — أنا أهل أن أتقى"
  en: "Ibn Majah 4299 — I am the One worthy of being feared"
  ur: "ابن ماجہ 4299 — میں اس لائق ہوں کہ مجھ سے ڈرا جائے"
  es: "Ibn Majah 4299 — Yo soy el Único digno de ser temido"
  fr: "Ibn Majah 4299 — Je suis Celui qui est digne de crainte"
  tr: "İbn Majah 4299 — Ben korkulmaya layık biriyim."
  id: "Ibn Majah 4299 — Aku layak ditakuti"
text: "قال الله عز وجل أنا أهل أن أتقى فلا يجعل معي إله آخر فمن اتقى أن يجعل معي إلها آخر فأنا أهل أن أغفر له . قال أبو الحسن القطان حدثنا إبراهيم بن نصر، حدثنا هدبة بن خالد، حدثنا سهيل …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 4299: أنا أهل أن أتقى. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 4299: I am the One worthy of being feared. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 4299: میں اس لائق ہوں کہ مجھ سے ڈرا جائے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sunan Ibn Majah, n.° 4299: Yo soy el Único digno de ser temido. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans le Sunan Ibn Majah, n° 4299: « Je suis Celui qu’il faut craindre. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  tr: "İbn Majah Sünen'inde 4299 numaralı hadis-i kudsi şöyledir: \"Ben korkulmaya layık biriyim.\" Bu hadis, Peygamberimiz tarafından Rabbinden rivayet edilmiştir ve hadis-i kudsi, altı şeriat hadis külliyatında ve Muvatta'da bu hadisin rivayetlerini derlemiştir."
  id: "Sebuah hadits qudsi dalam Sunan Ibn Majah, no. 4299: “Aku layak ditakuti.” Hadits ini diriwayatkan oleh Nabi atas otoritas Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
