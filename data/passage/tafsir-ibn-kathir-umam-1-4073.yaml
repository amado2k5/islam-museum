text: "… نوح وعاد وثمود، وأصحاب الرَّسِّ، وقوم لوط، وأهل مَدْيَن، وأشباههم وأضرابهم ممن كذب الرُّسلَ وخالف الحقَّ، وأنجى اللّٰه من بينهم المؤمنين، فلم يُهْلِكْ منهم أحدًا، وعذَّب الكافرين، فلم يُفْلِتْ منهم واحدًا. قال السُّدِّي: لم يبعث اللّٰه رسولًا قطُّ إلىٰ قوم …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 4073، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
