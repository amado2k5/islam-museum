text: |-
  ⁦(فصل الفاء)⁩
  ٢.٥
  صل الطاء بخ) طبخت القدر واللحم فانطبخ والموضع مطبخ واطيخت وهوا
  اقتعات أى اتخذت طبيخا قال ابن السكيت وقد يكون الاطباخ اقتدارا واشتواء تقول
  •ذه خبرة جيدة الطبخ وآجرّة جمدة الطبخ وأنشد للعجاج
  تالله لولا أن تحش الطبخ •بى الجيم حين لامستصر
  أراد بالطبخ وهوجع طاجخ ملاتكة العذاب وتقول اطبخو الناقرصا وهذا مطبخ القوم
  وهذامنتواهم والطباخة الفوّارة وهو ما فارص رغوة القدراذاطبخت وطابخة لقب عامى
  بن الياس بن مضرابه بذلك أبو. لماطبخ الضب والطبيخ ضرب من المنصف والمطبح بكسر
  الباء مشددة ولد الضب أوله حسل ثم غيداق ثم مطبخ ثم خضرم ثم ضب وقد طبخ الحسل
  نطبيخا كبر والطابخة الهاجرة وطبائخ الحرسمائه والطابخ الحى الصالب ورجل ليس به
  طباخ أى قوّة ولاسمن قال الشاعر و حسان
  المال يغشى رجالا لاطباخ به-م كالسيل يغشى أصول الدندن البالى
  وامرأ طباخية مثال علانية أى مكتنزة اللحم ⁦(طخخ)⁩ طخ طخاشرس فى معاملته والشئ
  ألقاه من يده والمرأة نمكعها نخ الطنخ البشم وقد طنخ الرجل بالكسراذا غلب على
  قلبه الدسم واتخم منه ⁦(طيخ)⁩ طاخ يطيخ تلطخ بالقبيح وطاخه غيره يتعدى ولا يتعدّى
  وطيخه أيضا فتطيخ وطاخ:-كبر قال الحرث بن حلزة
  فاز كوا الطيخ والتعدى وإما • تتعاشوافقى التعاشى الداء
  ( صل الفا تخ تخ أصابع رجلد فى جلوسه قتخاثناها ولينها قال الاصمحى أصل
  الفتخ االين تول رحسل أفتخ بين الفتخ اذا كان • ريصّ الكف والقدم مع اللين قال المتنخل
  الهذلى فتح الشمائل فى أيمانهم روح وعقاب قتخا لانها اذا اضملت كسرت جناحيها
  وغمزتم ما وهذالا يكون الامن اللين والفتفة بالتحريك حلقة من فضّة لافص فيها فاذا كان
  فيهاذص فهو الخاتم والمع فتخ وقتخات وربما جعلتها المرأة فى أصابع رجليها وقال
  -قط منهافتخى فى كى ⁦(فخ)⁩ الفخ المسيدة والجم-ع نواخ ونفوخ والفخيخ كالغط.
  وقدفخ النائم يضخ واسم هذه النومة الفمخة وينشد
  أفلح من كانت له مزخه • يزخهائم ينام الفخه
  رخ الفرخ ولد الطائر والانى فرخة وجمع القلة أفرخ وأفراخ والكثير فراخ وأفرخ
  الطائر وفرّخ وأفرخ القوم بيضهم اذا أبدواسرهم وأفرخ الروع أى ذهب الفزع بقال
  ليفرخ روءك أى ليخرج عنك فزعك كما يخرج الفرخ عن البيضة وأفرخ روعك يافلان أى
  سكن جأشك وأفرخ الامراستبان يعداشتباه واستفرخت الممام اذا اتخذته لفراخه
  وانفرخ الزرع اذاتهيأللانشة اق بعدما يطلع وقد فرخ الزرع تفريخا وقول الفرزدق
  ويوم جعلنا البيض فيه لعامى • مصممة نفأى فراخ الجهاجم
  يعنى به الدماغ وأماقول الشاعر ومقذوذين من برى الفريخ فهو مصغراسم رجل
  كان فى الجاهلية يبرى السهام وقواءم فلان فريخ فريسْ اناصر على وجه المدح كقول
  كسرته ١ه
