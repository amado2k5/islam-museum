text: "… غيره إلى موهب أو بالمكس. في ص تحتم. هو ابن مجاهد ابن جبر ذكره ابن أبي حاتم ولم يحك فيه جرحاً. هو الطائفي من رجال التهذيب. كذا في ص وز ولعل الصواب تكشفت."
