label: { ar: "الموطأ 2303 — مالك: لا تجوز القطاعة لأحد الشريكين دون إذن الآخر", en: "Muwatta 2303" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في المكاتب يكون بين شريكين، أنه لا يجوز لأحدهما أن يقاطعه على حصته إلا بإذن شريكه، لأن العبد ومال العبد بينهما. فإن قاطعه أحدهما دون صاحبه ثم مات المكاتب وله مال أو عجز، فلا شيء لمن قاطعه من ماله، ولا يرد ما قاطعه عليه. أما من قاطع بإذن شريكه، فإذا عجز المكاتب كان له أن يرد ما أخذ ويكون على نصيبه من الرقبة. {cite:muwatta-maruf-1997 p.349} {cite:muwatta-maruf-1997 p.350}"
