label: { ar: "الموطأ 2303 — مالك: لا تجوز القطاعة لأحد الشريكين دون إذن الآخر", en: "Muwatta 2303", es: "Muwatta 2303", fr: "Muwatta 2303", ur: "موطا 2303", tr: "El-Muvatta 2303 — Malik: Eşlerden birinin diğerinin izni olmadan onunla olan bağını koparması caiz değildir.", id: "Al-Muwatta 2303 — Malik: Tidak diperbolehkan bagi salah satu mitra untuk memutuskan hubungan dengan mitra lainnya tanpa izin dari mitra lainnya." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا في المكاتب يكون بين شريكين، أنه لا يجوز لأحدهما أن يقاطعه على حصته إلا بإذن شريكه، لأن العبد ومال العبد بينهما. فإن قاطعه أحدهما دون صاحبه ثم مات المكاتب وله مال أو عجز، فلا شيء لمن قاطعه من ماله، ولا يرد ما قاطعه عليه. أما من قاطع بإذن شريكه، فإذا عجز المكاتب كان له أن يرد ما أخذ ويكون على نصيبه من الرقبة. {cite:muwatta-maruf-1997 p.349} {cite:muwatta-maruf-1997 p.350}"
  tr: "Malik şöyle dedi: İki ortak arasında yapılan köle azat sözleşmesiyle ilgili olarak aramızdaki yerleşik uygulama şudur: Köle ve malı ortak mülkiyet olduğu için, ortaklardan hiçbiri diğerinin izni olmadan kölenin özgürlüğündeki payını tek taraflı olarak sona erdiremez. Eğer bir ortak diğerinin izni olmadan sözleşmeyi feshederse ve köle daha sonra mal bırakarak ölürse veya iş göremez hale gelirse, sözleşmeyi fesheden tarafın kölenin malı üzerinde hiçbir hakkı yoktur ve aldığı şeyi geri alamaz. Ancak, sözleşme diğer ortağın izniyle feshedilmişse ve köle iş göremez hale gelirse, sözleşmeyi fesheden ortak aldığı şeyi geri alma hakkına sahiptir ve bu, kölenin özgürlüğündeki payı olarak kalır. {cite:muwatta-maruf-1997 s.349} {cite:muwatta-maruf-1997 s.350}"
  id: "Malik berkata: Praktik yang berlaku di antara kita mengenai seorang budak yang terikat kontrak pembebasan antara dua pihak adalah bahwa tidak seorang pun dapat secara sepihak mengakhiri bagian kebebasan budak yang lain kecuali dengan izin pihak lain, karena budak dan hartanya dimiliki bersama. Jika salah satu pihak mengakhiri kontrak tanpa izin pihak lain, dan budak tersebut kemudian meninggal dunia meninggalkan harta benda atau menjadi tidak mampu, pihak yang mengakhiri kontrak tidak memiliki hak atas harta benda budak tersebut, dan ia juga tidak dapat menuntut kembali apa yang telah diambilnya. Namun, jika kontrak diakhiri dengan izin pihak lain, dan budak tersebut menjadi tidak mampu, pihak yang mengakhiri kontrak berhak untuk menuntut kembali apa yang telah diambilnya, dan itu tetap menjadi bagiannya atas kebebasan budak tersebut. {cite:muwatta-maruf-1997 p.349} {cite:muwatta-maruf-1997 p.350}"
