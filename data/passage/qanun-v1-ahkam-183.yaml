text: "… والسهر والتعب والجوع والغضب، فإن هذه كلها تصبغ الماء إلى الصفرة والحمرة. والجماع يدسم الماء تدسيماً شديداً، ومثل القيء والاستفراغ إنهما أيضاً يبدلان الواجب من لون الماء وقوامه، وكذلك إتيان ساعات عليه ولذلك قيل يجب أن لا ينظر في البول …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 183، يرد فيه ذكر الواجب، وما يجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 183, whose wording mentions the obligatory (wajib), what must be done; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "القانون فی الطب، ابن سینا ج1، ص 183 کا اقتباس جس میں واجب، جو واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Canon de Medicine, vol. 1 de Ibn Sina, p. 183, dont le texte mentionne l'obligatoire (wajib), ce qui doit être fait ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Canon de Medicine, vol. 1 de Ibn Sina, p. 183, cuyo texto menciona lo obligatorio (wajib), lo que debe hacerse; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. cildinin 183. sayfasından, farz olan amelleri ve gerekenleri anlatan bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Kitab Kedokteran Ibnu Sina, Jilid 1, halaman 183, yang menyebutkan amalan wajib dan apa yang diwajibkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
