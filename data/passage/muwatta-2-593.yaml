label: { ar: "الموطأ 593 — أسماء بنت عميس تغسل أبا بكر ثم تسأل المهاجرين: هل علي من غسل؟ فقالوا: لا", en: "Muwatta 593" }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر، أن أسماء بنت عميس امرأة أبي بكر الصديق غسلت أبا بكر حين توفي، ثم خرجت فسألت من حضرها من المهاجرين: إني صائمة وإن هذا يوم شديد البرد، فهل علي من غسل؟ فقالوا: لا. ويذكر المحقق أن قوله «امرأة أبي بكر الصديق» سقط من نسخة م، وأنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق (6123) ومحمد بن الحسن الشيباني (304). {cite:muwatta-maruf-1997 p.306}"
