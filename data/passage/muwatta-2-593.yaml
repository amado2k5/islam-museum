label: { ar: "الموطأ 593 — أسماء بنت عميس تغسل أبا بكر ثم تسأل المهاجرين: هل علي من غسل؟ فقالوا: لا", en: "Muwatta 593", es: "Muwatta 593", fr: "Muwatta 593", ur: "موطا 593", tr: "El-Muvatta 593 — Esma bint Umays, Ebu Bekir'i yıkadıktan sonra Muhacirlere sordu: Onu yıkamak benim sorumluluğum mu? Onlar da: Hayır dediler.", id: "Al-Muwatta 593 — Asma binti Umays memandikan Abu Bakr, lalu bertanya kepada kaum Muhajirin: Apakah menjadi tanggung jawabku untuk memandikannya? Mereka menjawab: Tidak" }
summary:
  ar: "يرويه مالك عن عبد الله بن أبي بكر، أن أسماء بنت عميس امرأة أبي بكر الصديق غسلت أبا بكر حين توفي، ثم خرجت فسألت من حضرها من المهاجرين: إني صائمة وإن هذا يوم شديد البرد، فهل علي من غسل؟ فقالوا: لا. ويذكر المحقق أن قوله «امرأة أبي بكر الصديق» سقط من نسخة م، وأنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق (6123) ومحمد بن الحسن الشيباني (304). {cite:muwatta-maruf-1997 p.306}"
  tr: "Malik, Abdullah ibn Abi Bekr'den rivayet ettiğine göre, Ebu Bekir es-Siddik'in karısı Esma bint Umays, Ebu Bekir öldüğünde onu yıkamıştır. Sonra dışarı çıkıp orada bulunan Muhacirlere sormuştur: \"Oruçluyum ve bugün çok soğuk. Gusül (ritüel banyo) yapmam gerekiyor mu?\" Onlar da \"Hayır\" demişlerdir. Editör, \"Ebu Bekir es-Siddik'in karısı\" ifadesinin M el yazmasında bulunmadığını ve bunun Malik'ten rivayetle Ebu Musab, Suveyd, Abdül-Razzak (6123) ve Muhammed ibn el-Hasan el-Şeybani (304) tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.306}"
  id: "Malik meriwayatkannya dari Abdullah ibn Abi Bakr, bahwa Asma binti Umays, istri Abu Bakr al-Siddiq, memandikan Abu Bakr ketika beliau wafat. Kemudian ia keluar dan bertanya kepada kaum Muhajirin yang hadir: “Saya sedang berpuasa, dan hari ini sangat dingin. Apakah saya perlu melakukan ghusl (mandi ritual)?” Mereka menjawab: “Tidak.” Editor mencatat bahwa frasa “istri Abu Bakr al-Siddiq” hilang dari manuskrip M, dan bahwa riwayat ini diwariskan dari Malik oleh Abu Musab, Suwaid, Abd al-Razzaq (6123), dan Muhammad ibn al-Hasan al-Shaybani (304). {cite:muwatta-maruf-1997 p.306}"
