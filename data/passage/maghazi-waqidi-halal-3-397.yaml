text: "… الحُوَيرِث، عن النبى أَنّه قال : إنَّ اللّٰه حرّمهم علىّ بِبِرِّ الوالد ووَكْزِهم فى لَبّاتِ الإبل. قال : وحدّثنى قُزّان بن محمد، عن عيسى بن عُمَيْلة الفَزارى، قال : كان عُيَيْنَة فى أَهله بنَجْد فأَتاه الخبر أَنَّ رسول اللّٰه صلَّ …"
