text: |-
  ٢١٧
  أيضابه عقلة من السحر وقد عملت له نشرة والمعقل الملجأوبه سمى الرجل ومعقل بن يسارمن
  الصحابة وهومن مزينة مضر نسب اليه نهر بالبصرة والرطب المعقلى وأمّامعة ل بن سنان من
  العصابة فهو من أشحع وبالدهناء خبراء يقال لها معقلة بضم القاف سميت بذلك لانها
  تمسك الماء كما يعقل الدواء البطن قال ذو الرقة
  حزاوية أوعوهج معقلية • تزود بأعطاف الرمال الحرائر
  والمعقلة الدية يقال لناعند فلان نمد من معقلة أى بقية من دية كانث علميه وصاردم فلان
  معقلة على قومه اذا صار وايدونه أى صارغر ما يؤدونه من أمو الهم ومنه قيل القوم
  على معاقلهم الأولى أى على ما كانوا يتعاقلون فى الجاهلية كذا يتعاقلون فى الاسلام والعقال:
  ظلع بأخذ فى قوائم الداية وقال ١
  يابىْ التخوم لا تعللموها • ان ظلم التخوم دْوعقال
  وذوعة ال أيضا اسم فرس والعاقول من النهر والوادى والرمل المعوجمنه وعواقيل الامور
  ما التبس منها وعقيل مصغر قبيلة وعقيل اسم رجسل والعقيلة كريمة الحىّ وكريمة الابل
  وعقيلة كل شى أكرمه والدرة عقيلة البحر والعقال صدقة عام وقال
  سعى عقالا فلم يترك لناسبدا * فكيف لوقد سعى هروعقالين
  وعلى بن فلان عقالان أى صدقة سنتين ويكره أن تشترى الصدقة حتى يعقلها الساعى وعقلت
  القتيسل أعطيت ديته وعقلت له دم فلان اذا تركت القود المدية قالت كبشة أخت عمرد
  ابن معد يكرب
  وأرسل عبدالله اذحان يومه * الى قومه لا تعقلو الهم دمى
  وعقلت عن فلان أى غرمت عنه جنايته وذلك اذ الزمته دية فأدّيتها عنه فهذاهو الفرق بين
  عقلته وعقلت عنه وعقلت له وفى الحديث لا تعقل العاقلة عمد اولاعبداقال أبو حنيفة رجه
  اللّٰه وهو أن يجنى العبد على حرّ وقال ابن أبى ليلى هوأن يجنى الحرّ على عبد وصوّبه الاصمعى"
  وقال لو كان المعنى على ما قال أبو حنيفة لمكان الكلام لا تعقل العاقلة عن عبد ولم يكن ولا
  حقل عبدا وقال كلت أبا يوسف المغاضى ف ذلد بحضرة الرشي دفلم يفرق بين عقلته وعقات
  عنمحتى فهمته الاصمحى عقات البعبرأعقله عقلاوهوأن تذى وظيفه مع ذراعه فتشدّهما
  جميعا فى وسط الذراع وذلك الحبسل هو العقال والجمع عقل ومقل الوعل أى امتنع فى الجبل
  العالى يعقل عقولا وبه سمى الوعل عاقلا وعاقل اسم جبل بعينه وهو فى شعرزهير وعاقلة
  الرجل عصبته وهم القرابة من قبسل الاب الذين يعطون دية من قتله خطأ وقال أهل العراق
  هم أصحاب الدواوين والمرأة نعاقل الرجل الى ثلث ديتها أى توازيه فاذا بلغ ثلث الدية صارت
  دية المرأة على النصف من دية الرجل وعقل الدواء بطنه أى أمسكه وعقل الظلّ أى قام قائم
  الظهيرة وعاقلته فعقلته أعة له بالضم أى غلبته بالعقل وبعير أعقل وناقة عقلاه بينسة العسقل
  وهو التواءف رجمل البعير واناع كثير قال ابن السكيت هوأن يفرط الروح حتى
  تصطك العرقوبان وهومذموم قال الجعدى يصف ناقة
  مفروشة الرجل فرشالم يكن عقلا» وأعل القوم اذاعة ل بهسم الفلّ أى لجأ وقلص عند
  O P
  جاح
  أحيجة بن الجلاح اه
  قوله وفى الحديث الخ فى القامو من
  وقول الشعبى لاتعقل العاقلة
  عمداولاعبدا وليس بحديث كما
  توهم الجوهركة اه
  قوله والمرأة تعافل الخ بعى
  موضحته وموضحتها سواه وقوله
  فاذا بلغ بعنى العقل المفهوم من
  تعاقل كافى التاموس اه
