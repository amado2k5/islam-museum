text: "… حدثني أبي حدثنا عبد الرحمن بن مهدي حدثنا زهير يعني ابن محمد من صالح يعني ابن كيسان أن عبداللّه بن أبي أمامة أخبره أن أبا أمامة أخبره أن رسول اللّٰه متاتع قال البذاذة من الايمان، البداذة من الإيمان، البذاذة من …"
summary:
  ar: "مقطع من الزهد لأحمد بن حنبل، المجلد المصوَّر 3، ص 16، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ahmad ibn Hanbal's Kitab al-Zuhd, scan volume 3, p. 16, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب الزہد، احمد بن حنبل، اسکین جلد 3، ص 16 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Zuhd de Ahmad ibn Hanbal, volumen 3, pág. 16, que menciona lo que se considera parte de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Zuhd d'Ahmad ibn Hanbal (tome 3, p. 16) mentionnant ce qui est considéré comme faisant partie de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ahmed ibn Hanbel'in \"El-Zuhd\" (Zilecilik) adlı eserinin 3. cildinin 16. sayfasından, imanın ne anlama geldiğini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine göre yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri gibi bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ahmad ibn Hanbal, Jilid 3, halaman 16, yang menyebutkan apa yang membentuk iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
