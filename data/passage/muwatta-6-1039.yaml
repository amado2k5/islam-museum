label: { ar: "الموطأ 1039 — ابن عباس: كان الفضل بن عباس رديف رسول الله فجاءته امرأة من خثعم تستفتيه، فجعل الفضل ينظر إليها، فصرف النبي وجهه إلى الشق الآخر، فقالت: إن فريضة الله في الحج أدركت أبي شيخاً كبيراً؛ فقال: نعم، وذلك في حجة الوداع", en: "Muwatta 1039", es: "Muwatta 1039", fr: "Muwatta 1039", ur: "موطا 1039", tr: "El-Muvatta 1039 — İbn Abbas: El-Fadl ibn Abbas, Allah Resulü'nün arkasında binek hayvanı olarak giderken, Hatim'den bir kadın ona gelip dini bir hüküm istedi. El-Fadl ona bakmaya devam etti, bu yüzden Peygamber yüzünü diğer tarafa çevirdi. Kadın, \"Babam yaşlıyken Hac farzı ona düştü\" dedi. Peygamber, \"Evet\" dedi ve bu olay Veda Hac'ı sırasında oldu.", id: "Al-Muwatta 1039 — Ibnu Abbas: Al-Fadl bin Abbas sedang berkendara di belakang Rasulullah ketika seorang wanita dari Khatham datang kepadanya untuk meminta fatwa agama. Al-Fadl terus memandanginya, sehingga Nabi memalingkan wajahnya ke sisi lain. Wanita itu berkata: \"Kewajiban haji telah datang kepada ayahku ketika ia sudah tua.\" Beliau menjawab: \"Ya,\" dan itu terjadi pada saat Haji Perpisahan." }
text: "إن فريضة الله في الحج أدركت أبي شيخاً كبيراً لا يستطيع أن يثبت على الراحلة، أفأحج عنه؟ قال: نعم"
summary:
  ar: "أول حديث في باب الحج عمن يحج عنه. يرويه مالك عن ابن شهاب عن سليمان بن يسار عن عبد الله بن عباس، أن الفضل بن عباس كان رديف رسول الله، فجاءته امرأة من خثعم تستفتيه، فجعل الفضل ينظر إليها وتنظر إليه، فجعل رسول الله يصرف وجه الفضل إلى الشق الآخر. فقالت: يا رسول الله، إن فريضة الله في الحج أدركت أبي شيخاً كبيراً لا يستطيع أن يثبت على الراحلة، أفأحج عنه؟ قال: نعم. وذلك في حجة الوداع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1199) وأن هذا الحديث في الصحيحين. {cite:muwatta-maruf-1997 p.483}"
  id: "Hadits pertama dalam surah tentang Haji berkaitan dengan seseorang yang melaksanakan Haji atas nama orang lain. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Sulaiman bin Yasar, dari Abdullah bin Abbas, bahwa al-Fadl bin Abbas sedang menunggang kuda di belakang Rasulullah shalla Allahu alaihi wa sallam ketika seorang wanita dari Khatham datang kepadanya untuk meminta fatwa agama. Al-Fadl terus memandanginya, dan wanita itu memandanginya, maka Rasulullah shalla Allahu alaihi wa sallam memalingkan wajah al-Fadl ke sisi lain. Wanita itu berkata, \"Wahai Rasulullah, kewajiban Haji telah datang kepada ayahku, yang sudah tua dan tidak dapat duduk di atas kendaraannya. Bolehkah aku melaksanakan Haji atas namanya?\" Beliau menjawab, \"Boleh.\" Kejadian ini terjadi pada Haji Perpisahan. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1199) dan hadits ini terdapat dalam dua kitab Sahih (Bukhari dan Muslim). {mengutip:muwatta-maruf-1997 hal.483}"
