label: { ar: "الموطأ 1039 — ابن عباس: كان الفضل بن عباس رديف رسول الله فجاءته امرأة من خثعم تستفتيه، فجعل الفضل ينظر إليها، فصرف النبي وجهه إلى الشق الآخر، فقالت: إن فريضة الله في الحج أدركت أبي شيخاً كبيراً؛ فقال: نعم، وذلك في حجة الوداع", en: "Muwatta 1039" }
text: "إن فريضة الله في الحج أدركت أبي شيخاً كبيراً لا يستطيع أن يثبت على الراحلة، أفأحج عنه؟ قال: نعم"
summary:
  ar: "أول حديث في باب الحج عمن يحج عنه. يرويه مالك عن ابن شهاب عن سليمان بن يسار عن عبد الله بن عباس، أن الفضل بن عباس كان رديف رسول الله، فجاءته امرأة من خثعم تستفتيه، فجعل الفضل ينظر إليها وتنظر إليه، فجعل رسول الله يصرف وجه الفضل إلى الشق الآخر. فقالت: يا رسول الله، إن فريضة الله في الحج أدركت أبي شيخاً كبيراً لا يستطيع أن يثبت على الراحلة، أفأحج عنه؟ قال: نعم. وذلك في حجة الوداع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1199) وأن هذا الحديث في الصحيحين. {cite:muwatta-maruf-1997 p.483}"
