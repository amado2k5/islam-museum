label: { ar: "الموطأ 161 — عروة: المستحاضة تغتسل غسلاً واحداً ثم تتوضأ لكل صلاة", en: "Muwatta 161", es: "Muwatta 161", fr: "Muwatta 161", ur: "موطا 161", tr: "Al-Muwatta 161 — Urwah: Uzun süren kanaması olan bir kadın, her namazdan önce bir kez gusül abdesti almalıdır.", id: "Al-Muwatta 161 — Urwah: Seorang wanita yang mengalami pendarahan berkepanjangan hendaknya mandi wajib (ghusl) sekali, kemudian berwudu untuk setiap shalat." }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه، في باب المستحاضة: ليس على المستحاضة إلا أن تغتسل غسلاً واحداً ثم تتوضأ بعد ذلك لكل صلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.108}"
  tr: "Malik'in, Hişam ibn Urve'den, onun da babasından rivayet ettiği, adet düzensizliği yaşayan kadınlar bölümündeki bir rivayete göre: Adet düzensizliği yaşayan bir kadının her namaz için sadece bir kez gusül abdesti alması yeterlidir. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Muhammed ibn el-Hasan tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.108}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, dalam bab tentang wanita yang mengalami pendarahan tidak teratur: Wanita yang mengalami pendarahan tidak teratur hanya diwajibkan melakukan satu kali mandi wajib (ghusl) dan kemudian berwudu (bersuci) untuk setiap shalat. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwaid, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.108}"
