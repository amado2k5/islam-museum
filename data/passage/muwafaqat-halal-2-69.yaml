text: "… في الصلاة فكاد يفتنه، وهو المعصوم وَل. ولكنّه علَّم أمته كيف يفعلون بالمباح إذا أدّاهم إلى ما يُكره؛ وكذلك قد يكون المباح وسيلة إلى ممنوع، فيترك من حيث هو وسيلة؛ كما قيل: إني لأدَع بيني وبين الحرام سترة من الحلال، …"
