label: { ar: "سنن ابن ماجه 3549 — الأب والأبوة", en: "Sunan Ibn Majah 3549 — the father and fatherhood", ur: "سنن ابن ماجہ 3549 — باپ اور والدیت" }
text: "… حَدَّثَنَا إِبْرَاهِيمُ بْنُ مُوسَى، أَنْبَأَنَا عَبْدَةُ بْنُ سُلَيْمَانَ، حَدَّثَنَا أَبُو جَنَابٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، عَنْ أَبِيهِ أَبِي لَيْلَى، قَالَ كُنْتُ جَالِسًا عِنْدَ النَّبِيِّ ـ إِذْ جَاءَهُ أَعْرَابِيٌّ فَقَالَ إِنَّ لِي أَخًا وَجِعًا. قَالَ \" مَا وَجَعُ أَخِيكَ \". قَالَ بِهِ لَمَمٌ. قَالَ \" اذْهَبْ فَأْتِنِي بِهِ \". قَالَ فَذَهَبَ فَجَاءَ بِهِ فَأَجْلَسَهُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3549، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 3549 (Chapters on Medicine), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3549، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
