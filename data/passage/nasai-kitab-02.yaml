summary:
  ar: "القسم 2 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المياه»، ويضم فيها النصوص من 325 إلى 347 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 2 of Sunan al-Nasa'i (The Book of Water) in the division of the open hadith dataset the museum took its reports from: reports 325 to 347 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 2، عنوان «کتاب المیاہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 325 تا 347۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El Libro 2 de Sunan al-Nasa'i (El Libro del Agua) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 325 al 347 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre 2), qui comprend les hadiths 325 à 347 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanı bölümünde yer alan Sunan al-Nasa'i'nin 2. bölümü \"Su Kitabı\" başlığını taşımakta olup, 325 ila 347 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 2 dari Sunan al-Nasa'i, pada bagian tentang basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Air\" dan berisi teks 325 hingga 347, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
