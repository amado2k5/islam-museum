label: { ar: "سنن النسائي 2243 — الأب والأبوة", en: "Sunan al-Nasa'i 2243 — the father and fatherhood", ur: "سنن نسائی 2243 — باپ اور والدیت", es: "Sunan al-Nasa'i 2243 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2243 — le père et la paternité" }
text: "… وَأَبُو مَعْشَرٍ الْمَدَنِيُّ اسْمُهُ نَجِيحٌ وَهُوَ ضَعِيفٌ وَمَعَ ضَعْفِهِ أَيْضًا كَانَ قَدِ اخْتَلَطَ عِنْدَهُ أَحَادِيثُ مَنَاكِيرُ مِنْهَا مُحَمَّدُ بْنُ عَمْرٍو عَنْ أَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ قَالَ \" مَا بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ قِبْلَةٌ \". وَمِنْهَا هِشَامُ بْنُ عُرْوَةَ عَنْ أَبِيهِ عَنْ عَائِشَةَ عَنِ النَّبِيِّ \" لاَ تَقْطَعُوا اللَّحْمَ بِالسِّكِّينِ وَلَكِنِ انْهَسُوا نَهْسًا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2243، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2243 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2243، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2243 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 2243 (Le Livre du jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
