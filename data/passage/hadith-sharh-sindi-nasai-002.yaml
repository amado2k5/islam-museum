text: "د مؤديا الي خلاف فنهيتهم لذلك والله تعالي اعلم قواد واننا لفي كتاب الباي فاعلم ناويل الكتاب والسنة والن الهي عينا لا يخالف الكتاب والسنفاذ رنطن بد ان قصابن أظهار مخالفته للكتاب والسنة قوله افي قمرت من التقصير وفي رواية"
