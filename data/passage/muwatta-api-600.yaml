label: { ar: "موطأ مالك 600 — ما لا يحل", en: "Muwatta Malik 600 — what is not lawful", ur: "موطأ مالک 600 — جو حلال نہیں", es: "Muwatta Malik 600 — lo que no es lícito", fr: "Muwatta Malik 600 — ce qui n'est pas licite", tr: "Muwatta Malik 600 — İzin verilmeyen şeyler", id: "Muwatta Malik 600 — Apa yang tidak diperbolehkan" }
text: "… إِلَيْهَا إِبِلاً أَوْ بَقَرًا أَوْ غَنَمًا بِاشْتِرَاءٍ أَوْ هِبَةٍ أَوْ مِيرَاثٍ فَإِنَّهُ يُصَدِّقُهَا مَعَ مَاشِيَتِهِ حِينَ يُصَدِّقُهَا وَإِنْ لَمْ يَحُلْ عَلَى الْفَائِدَةِ الْحَوْلُ وَإِنْ كَانَ مَا أَفَادَ مِنَ الْمَاشِيَةِ إِلَى مَاشِيَتِهِ قَدْ صُدِّقَتْ قَبْلَ أَنْ يَشْتَرِيَهَا بِيَوْمٍ وَاحِدٍ أَوْ قَبْلَ أَنْ يَرِثَهَا بِيَوْمٍ وَاحِدٍ فَإِنَّهُ يُصَدِّقُهَا مَعَ مَاشِيَتِهِ حِينَ يُصَدِّقُ مَاشِيَتَهُ. قَالَ يَحْيَى قَالَ مَالِكٌ …"
summary:
  ar: "حديث في موطأ مالك، رقم 600، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 600 (Zakat), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 600، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 600 (Zakat), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 600 (Zakat), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Malik'in Muwatta'sında yer alan 600 numaralı hadis, haram olan şeylerden bahsetmektedir. Bu hadis, helal ve haram konusunda Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden rivayetleri içeren Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 600, menyebutkan apa yang diharamkan. Hadits ini dikompilasi oleh Halal and Haram Browser, yang mencakup teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
