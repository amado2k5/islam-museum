text: "العرب سنين، ومكث فيها رجال يتعبدون ويتانهون ونسكوا له. قال ابن اسحاق رحمه اللاه تعالي: فلما تحدثت العرب بكتاب ابرهة ذلك الي النجاشي غضب رجل من النساة احد بني فقيم فخرج الي القليس فقعد فيها، يعني احدث، ثم خرج فلحق بارضه. وقال"
