text: "… أنشأتُها حسب مشورتكم فدعوني أبنيها بمعرفتي كان يبني داراً، فجعل يُحضرُ أحباءه وجيرانه، ويستشيرهم وكلّ منهم يشير عليه أن يبني على صورةٍ ويُصِرُّ على رأيهِ قائلاً : إذا لم تعمرها كما أقول، فأنا أبنيها رغماً عنك. وهكذا أجبروا الشيخ أن …"
summary:
  ar: "بنى جحا بيتاً بمشورة أصدقائه الذين ناقض كل منهم الآخر، وفي الافتتاح قالوا إنه لا يعجبهم، فقال إنه بناه بمشورتهم وإنه سيبني الآن بحسب معرفته. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  en: "Juha builds a house on his friends' advice, each contradicting the other. At the opening they say they do not like it, and he says he built it by their advice, so now he will build by his own knowledge. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  ur: "جحا اپنے دوستوں کے مشورے سے گھر بناتا ہے جن میں ہر ایک دوسرے کی بات کاٹتا ہے۔ افتتاح کے وقت وہ کہتے ہیں کہ انہیں یہ پسند نہیں، تو جحا کہتا ہے کہ اس نے اسے ان کے مشورے سے بنایا ہے، اب وہ اپنی سمجھ کے مطابق بنائے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  fr: "Juha construit une maison selon les conseils de ses amis, chacun contredisant l'autre. À l'inauguration, ils disent qu'elle ne leur plaît pas, et il dit qu'il l'a bâtie selon leurs conseils, et qu'il bâtira maintenant selon son propre savoir. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  es: "Juha construye una casa según el consejo de sus amigos, cada uno contradiciendo al otro. En la inauguración dicen que no les gusta, y él dice que la construyó según su consejo, y que ahora construirá según su propio saber. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
  tr: "Juha, birbirleriyle çelişen arkadaşlarının tavsiyeleriyle bir ev inşa etti. Açılışta evi beğenmediklerini söylediler, bunun üzerine Juha, evi onların tavsiyeleriyle inşa ettiğini ve artık kendi bilgisine göre inşa edeceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 141}"
  id: "Juha membangun sebuah rumah dengan saran dari teman-temannya, yang saling bertentangan. Pada saat peresmian, mereka mengatakan bahwa mereka tidak menyukainya, jadi Juha mengatakan bahwa ia telah membangunnya dengan saran mereka dan bahwa ia sekarang akan membangunnya sesuai dengan pengetahuannya sendiri. {cite:juha-nawadir-kubra-djuwaydi p. 141}"
