label: { ar: "سنن النسائي 407 — الأب والأبوة", en: "Sunan al-Nasa'i 407 — the father and fatherhood", ur: "سنن نسائی 407 — باپ اور والدیت", es: "Sunan al-Nasa'i 407 — El padre y la paternidad", fr: "Sunan al-Nasa'i 407 — le père et la paternité", tr: "Sunan an-Nasa'i 407 — Baba ve Babalık", id: "Sunan an-Nasa'i 407 — Sang Ayah dan Peran Ayah" }
text: "أَخْبَرَنَا أَبُو بَكْرِ بْنُ إِسْحَاقَ، قَالَ حَدَّثَنَا الأَسْوَدُ بْنُ عَامِرٍ، قَالَ حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ عَبْدِ الْمَلِكِ بْنِ أَبِي سُلَيْمَانَ، عَنْ عَطَاءٍ، عَنْ صَفْوَانَ بْنِ يَعْلَى، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ اللَّهَ عَزَّ وَجَلَّ سِتِّيرٌ فَإِذَا أَرَادَ أَحَدُكُمْ أَنْ يَغْتَسِلَ فَلْيَتَوَارَ بِشَىْءٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 407، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 407 (The Book of Ghusl and Tayammum), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 407، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 407 (El Libro del Ghusl y el Tayammum), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 407 (Le Livre du Ghusl et du Tayammum), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 407 numaralı hadiste baba ve babalık konusu geçmektedir. Araştırmacı, bu hadisi, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 407, menyebutkan tentang ayah dan peran ayah. Peneliti mengumpulkan hadits tentang peran ayah dalam Islam ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
