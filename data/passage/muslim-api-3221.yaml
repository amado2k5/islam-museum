label: { ar: "صحيح مسلم 3221 — وصية أو عهد أخير", en: "Sahih Muslim 3221 — a testament or parting counsel", ur: "صحیح مسلم 3221 — وصیت یا آخری نصیحت", es: "Sahih Muslim 3221 — un testamento o consejo de despedida", fr: "Sahih Muslim 3221 — un testament ou un conseil d'adieu" }
text: "… الْحَسَنُ، بْنُ مُسْلِمٍ عَنْ طَاوُسٍ، قَالَ كُنْتُ مَعَ ابْنِ عَبَّاسٍ إِذْ قَالَ زَيْدُ بْنُ ثَابِتٍ تُفْتِي أَنْ تَصْدُرَ الْحَائِضُ، قَبْلَ أَنْ يَكُونَ آخِرُ عَهْدِهَا بِالْبَيْتِ. فَقَالَ لَهُ ابْنُ عَبَّاسٍ إِمَّا لاَ فَسَلْ فُلاَنَةَ الأَنْصَارِيَّةَ هَلْ أَمَرَهَا بِذَلِكَ رَسُولُ اللَّهِ قَالَ فَرَجَعَ زَيْدُ بْنُ ثَابِتٍ إِلَى ابْنِ عَبَّاسٍ يَضْحَكُ وَهُوَ يَقُولُ مَا أَرَاكَ إِلاَّ قَدْ صَدَقْتَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3221، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 3221 (The Book of Pilgrimage), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 3221، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 3221 (El Libro de la Peregrinación), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 3221 (Le Livre du Pèlerinage), mentionne un testament ou des dernières volontés. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
