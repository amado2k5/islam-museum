  fr: "Un extrait de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volume numérisé 1, p. 387, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), ce qui s'impose à la personne responsable, le recommandé (mandub), la recommandation (nadb), la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Ibana al-Kubra, the Book de Faith de Ibn Batta, volumen digitalizado 1, p. 387, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), lo que obliga a la persona responsable, lo recomendado (mandub), la recomendación (nadb), la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Batta'nın El-İbana El-Kübra (İman Kitabı, Resimli Cilt 1, s. 387) adlı eserinden, her Müslüman için farz olan, zorunlu ibadetler, müstehap olan ibadetler, müstehap olan ibadetler, müstehap olan ibadetler ve müstehap olan ibadetler hakkında bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelime olarak alıntılanmıştır ve düzeltilmemiştir. Farz ibadetler, itaat amelleri, müstehap olan ibadetler, müstehap olan ibadetler, haram olan ibadetler ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Ibana Al-Kubra karya Ibn Batta, Kitab Keimanan, Jilid 1 Bergambar, hlm. 387, yang menyebutkan apa yang wajib bagi setiap Muslim, yang wajib, yang dituntut dari orang yang bertanggung jawab, yang dianjurkan, yang diancam, dan yang tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
