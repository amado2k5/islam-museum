text: "… به ويكره ما نهى عنه.. فالواجب على كل مؤمن أن يحب ما أحبه اللّٰه محبة توجب له الإتيان بما وجب عليه منه، فإن زادت المحبة حتى أتى بما ندب إليه منه كان ذلك فضلاً؛ وأن يكره ماكرهه اللّٰه تعالى كراهة …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 387، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وما يجب على المكلف، والمندوب، والندب، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 387, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), what is binding on the person addressed, the recommended (mandub), recommendation (nadb), dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
