text: "حَدَّثَنَا مَحْمُودُ بْنُ غَيْلاَنَ، حَدَّثَنَا أَبُو دَاوُدَ، قَالَ أَنْبَأَنَا شُعْبَةُ، قَالَ أَخْبَرَنِي أَبُو الْفَيْضِ، قَالَ سَمِعْتُ سُلَيْمَ بْنَ عَامِرٍ، يَقُولُ كَانَ بَيْنَ مُعَاوِيَةَ وَبَيْنَ أَهْلِ الرُّومِ عَهْدٌ وَكَانَ يَسِيرُ فِي بِلاَدِهِمْ حَتَّى إِذَا انْقَضَى الْعَهْدُ أَغَارَ عَلَيْهِمْ فَإِذَا رَجُلٌ عَلَى دَابَّةٍ أَوْ عَلَى فَرَسٍ وَهُوَ يَقُولُ اللَّهُ أَكْبَرُ وَفَاءٌ لاَ غَدْرٌ. وَإِذَا هُوَ عَمْرُو بْنُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1580، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1580 (The Book on Military Expeditions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 1580، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
