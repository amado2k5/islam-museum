label: { ar: "نوادر جحا الكبرى، ص 29 — «لولا نصيحة الصديق لقام الشمندر على رأسي»", en: "Nawadir Juha al-Kubra, p. 29 — 'Without My Friend's Advice, Beetroot Would Have Landed on My Head'", ur: "نوادر جحا الکبریٰ، ص 29 — «دوست کے مشورے کے بغیر چقندر میرے سر پر پڑتا»", fr: "Nawadir Juha al-Kubra, p. 29 — « Sans le conseil de l'ami, la betterave me serait tombée sur la tête »", es: "Nawadir Juha al-Kubra, p. 29 — «Sin el consejo del amigo, la remolacha habría caído sobre mi cabeza»" }
text: "… لولا نصيحة الصديق لقام الشمندر على رأسي أقام تيمور لنك السفاحُ بعدَ أَنْ وقعَتْ بينَهُ وبين السلطان ييلديرم بايزيدخان وقعة أنقرةَ المشهورةُ مدةً في مدينة آقَ شَهْرٌ، وكان لجحا عندَ تيمور لنك مقامٌ وحظوةٌ، ولهذا السبب سَلِمَتِ المدينةُ منَ النهْبِ …"
summary:
  ar: "بعد معركة أنقرة أقام تيمور لنك مدة في آق شهر، وبفضل جحا نجت البلدة، فقدم له جحا برقوقًا أكل منه اثنتين، ثم جاءه بالشمندر بنصيحة صديق ليبدله بالتين، فأمر تيمور برجمه بالتين، فحمد جحا الله على نصيحة صديقه. {cite:juha-nawadir-kubra-djuwaydi p. 29}"
  en: "After the battle of Ankara, Timur Lenk stayed some time in Akshehir and Juha's favour spared the town; Juha gives him plums, two are eaten, and then he brings beetroot, on a friend's advice, to swap for figs; Timur has him pelted with figs, and Juha thanks God for the friend's advice. {cite:juha-nawadir-kubra-djuwaydi p. 29}"
  ur: "انقرہ کی جنگ کے بعد تیمور لنگ کچھ عرصہ آق شہر میں ٹھہرا اور جحا کی بدولت شہر بچ گیا؛ جحا نے اسے آلو بخارے پیش کیے جن میں سے دو کھائے گئے، پھر ایک دوست کے مشورے پر انجیر کے بدلے چقندر لے آیا؛ تیمور نے حکم دیا کہ اس پر انجیر برسائے جائیں، تو جحا نے اپنے دوست کے مشورے پر اللہ کا شکر ادا کیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 29}"
  fr: "Après la bataille d'Ankara, Timur Lenk séjourne quelque temps à Akshehir et la ville est épargnée grâce à Juha ; Juha lui offre des prunes, dont deux sont mangées, puis apporte des betteraves, sur le conseil d'un ami, pour les échanger contre des figues ; Timur le fait bombarder de figues, et Juha remercie Dieu du conseil de son ami. {cite:juha-nawadir-kubra-djuwaydi p. 29}"
  es: "Tras la batalla de Ankara, Timur Lenk permaneció un tiempo en Akshehir y el favor de Juha salvó la ciudad; Juha le ofrece ciruelas, de las que se comen dos, y luego trae remolachas, por consejo de un amigo, para cambiarlas por higos; Timur lo hace apedrear con higos, y Juha da gracias a Dios por el consejo de su amigo. {cite:juha-nawadir-kubra-djuwaydi p. 29}"
