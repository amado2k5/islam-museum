text: "ثم يرتقي إلى توحيد الإلهية، كما يدعو االله سبحانه عباده في كتابه بهذا النوع من التوحيد إلى النوع الآخر . ويحتج عليهم به، ويقررهم به . ثم يخبر أنهم ينقضونه بشركهم به في الإلهية ."
