label: { ar: "الموطأ 1236 — عبد الله بن أبي بكر عن أبيه: أن أم سليم بنت ملحان استفتت رسول الله بعد أن أفاضت يوم النحر ثم حاضت أو ولدت", en: "Muwatta 1236" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه أن أبا سلمة بن عبد الرحمن أخبره أن أم سليم بنت ملحان استفتت رسول الله، وحاضت أو ولدت بعد ما أفاضت يوم النحر، فأذن لها فخرجت. ويذكر المحقق أن ابن عبد البر رأى الحديث منقطعا، وأن المحفوظ فيه قصة صفية عن عائشة. {cite:muwatta-maruf-1997 p.552}"
