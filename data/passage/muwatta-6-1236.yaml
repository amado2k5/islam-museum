label: { ar: "الموطأ 1236 — عبد الله بن أبي بكر عن أبيه: أن أم سليم بنت ملحان استفتت رسول الله بعد أن أفاضت يوم النحر ثم حاضت أو ولدت", en: "Muwatta 1236", es: "Muwatta 1236", fr: "Muwatta 1236", ur: "موطا 1236", tr: "El-Muvatta 1236 — Abdullah bin Ebu Bekr, babasından rivayetle: Ümmü Süleym bint Milhan, Kurban Bayramı günü İfade Tavafını yaptıktan sonra adet görmesi veya doğum yapması üzerine Allah'ın Resulü'nden bir hüküm istedi.", id: "Al-Muwatta 1236 — Abdullah bin Abi Bakr meriwayatkan dari ayahnya: bahwa Umm Sulaym bint Milhan meminta fatwa kepada Rasulullah SAW setelah ia melaksanakan Tawaf al-Ifadah pada Hari Raya Kurban dan kemudian mengalami haid atau melahirkan." }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن أبيه أن أبا سلمة بن عبد الرحمن أخبره أن أم سليم بنت ملحان استفتت رسول الله، وحاضت أو ولدت بعد ما أفاضت يوم النحر، فأذن لها فخرجت. ويذكر المحقق أن ابن عبد البر رأى الحديث منقطعا، وأن المحفوظ فيه قصة صفية عن عائشة. {cite:muwatta-maruf-1997 p.552}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Hazm, yang juga meriwayatkan dari ayahnya, bahwa Abu Salama ibn Abd al-Rahman memberitahunya bahwa Umm Sulaym bint Milhan meminta fatwa dari Rasulullah (shalawat dan salam kepadanya) dan bahwa ia mengalami haid atau melahirkan setelah melakukan Tawaf al-Ifadah pada Hari Raya Idul Adha. Beliau mengabulkannya, dan ia pun pergi. Peneliti menyebutkan bahwa Ibnu Abd al-Barr menganggap hadits tersebut tidak sahih, dan bahwa versi yang sahih adalah kisah Safiyyah dari Aisyah. {cite:muwatta-maruf-1997 p.552}"
