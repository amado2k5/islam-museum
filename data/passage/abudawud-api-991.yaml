label: { ar: "سنن أبي داود 991 — الأب والأبوة", en: "Sunan Abi Dawud 991 — the father and fatherhood", ur: "سنن ابی داؤد 991 — باپ اور والدیت" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ النُّفَيْلِيُّ، حَدَّثَنَا عُثْمَانُ، - يَعْنِي ابْنَ عَبْدِ الرَّحْمَنِ - حَدَّثَنَا عِصَامُ بْنُ قُدَامَةَ، - مِنْ بَنِي بُجَيْلَةَ - عَنْ مَالِكِ بْنِ نُمَيْرٍ الْخُزَاعِيِّ، عَنْ أَبِيهِ، قَالَ رَأَيْتُ النَّبِيَّ وَاضِعًا ذِرَاعَهُ الْيُمْنَى عَلَى فَخِذِهِ الْيُمْنَى رَافِعًا أُصْبُعَهُ السَّبَّابَةَ قَدْ حَنَاهَا شَيْئًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 991، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 991 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 991، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
