text: "فيه فأمره أن يكتب جوابه، فكتب: (بسم الله الرحمن الرحيم، من محمد رسول الله إلى صخر بن حرب، أما بعد، فقد أتاني كتابك يا أحمق بني [غالب] وسفيههم، وقديما غرك بالله الغرور، وسيحول الله بينك وبين ما حاولت، ويجعل لنا"
