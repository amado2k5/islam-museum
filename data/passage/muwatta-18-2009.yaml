label: { ar: "الموطأ 2009 — مالك: وجه القراض المعروف الجائز أن يأخذ الرجل المال من صاحبه على أن يعمل فيه ولا ضمان عليه، ونفقة العامل في سفره بقدر المال إذا كان المال يحمل ذلك، فإن كان مقيما في أهله فلا نفقة له من المال", en: "Muwatta 2009", es: "Muwatta 2009", fr: "Muwatta 2009", ur: "موطا 2009", tr: "Al-Muwatta 2009 — Malik: Bilinen ve caiz olan kâr paylaşımı şekli, bir kişinin sahibinden para alması ve bu parayla çalışması, karşılığında hiçbir yükümlülük üstlenmemesidir. İşçinin yolculuk masrafları, sermaye miktarıyla orantılıdır, eğer sermaye bunları karşılıyorsa. Eğer ailesiyle birlikte kalıyorsa, sermayeden herhangi bir masraf hakkı yoktur.", id: "Al-Muwatta 2009 — Malik: Bentuk pembagian keuntungan yang umum dan diperbolehkan adalah ketika seseorang mengambil uang dari pemiliknya dengan syarat ia menggunakannya untuk bekerja, dan ia tidak menanggung kewajiban apa pun. Biaya perjalanan pekerja sebanding dengan jumlah modal, jika modal tersebut mencukupinya. Jika ia tinggal bersama keluarganya, maka ia tidak berhak atas biaya apa pun dari modal tersebut." }
summary:
  ar: "قال مالك: وجه القراض المعروف الجائز، أن يأخذ الرجل المال من صاحبه، على أن يعمل فيه، ولا ضمان عليه. ونفقة العامل في المال في سفره، من طعامه وكسوته، وما يصلحه بالمعروف، بقدر المال إذا شخص في المال، إذا كان المال يحمل ذلك. فإن كان مقيما في أهله، فلا نفقة له من المال، ولا كسوة. {cite:muwatta-maruf-1997 p.222}"
  tr: "Malik şöyle dedi: İzin verilen ve bilinen kâr paylaşımı şekli, bir kişinin sahibinden parayı, kendi sorumluluğu olmaksızın yatırım yapması şartıyla almasıdır. İşçinin yolculuk sırasındaki yiyecek, giyim ve diğer ihtiyaçları da dahil olmak üzere masrafları, sermayenin bu tür masrafları karşılayabilmesi koşuluyla, makul ve sermayeyle orantılı olarak karşılanmalıdır. Eğer ailesiyle birlikte kalırsa, sermayeden herhangi bir masraf veya giyim hakkına sahip değildir. {cite:muwatta-maruf-1997 s.222}"
  id: "Malik berkata: Bentuk pembagian keuntungan yang diperbolehkan dan umum dikenal adalah ketika seseorang mengambil uang dari pemiliknya dengan syarat ia menginvestasikannya, tanpa kewajiban apa pun di pihaknya. Biaya pekerja selama perjalanannya, termasuk makanan, pakaian, dan kebutuhan lainnya, harus ditanggung sesuai dengan apa yang wajar dan sebanding dengan modal, asalkan modal tersebut memungkinkan untuk biaya tersebut. Jika ia tinggal bersama keluarganya, ia tidak berhak atas biaya atau pakaian apa pun dari modal tersebut. {cite:muwatta-maruf-1997 p.222}"
