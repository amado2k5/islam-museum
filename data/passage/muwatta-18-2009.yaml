summary:
  ar: "قال مالك: وجه القراض المعروف الجائز، أن يأخذ الرجل المال من صاحبه، على أن يعمل فيه، ولا ضمان عليه. ونفقة العامل في المال في سفره، من طعامه وكسوته، وما يصلحه بالمعروف، بقدر المال إذا شخص في المال، إذا كان المال يحمل ذلك. فإن كان مقيما في أهله، فلا نفقة له من المال، ولا كسوة. {cite:muwatta-maruf-1997 p.222}"
