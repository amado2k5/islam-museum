text: "… لي مَنْ أحِبُّ والبَيْنُ قد جَ دَ وفي مهجتي لهيبُ الحريقِ قلت: أبكي عَلَيْك طُولَ الطّرِيقِ ما الذي في الطريق تَصْنَعُ بَعْدي؟ تُوُفّي المهلَّبي لثالثٍ من شعبان عن نَيِّف وستّين سنة. ولا بن الحجَّاج من أبياتٍ يرثيه : هكذا في …"
