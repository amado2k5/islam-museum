text: "… خَارِجَةُ بْنُ عَبْدِ اللَّهِ بْنِ سُلَيْمَانَ بْنِ زَيْدِ بْنِ ثَابِتٍ، قَالَ حَدَّثَنِي الْحُسَيْنُ بْنُ بَشِيرِ بْنِ سَلاَّمٍ، عَنْ أَبِيهِ، قَالَ دَخَلْتُ أَنَا وَمُحَمَّدُ بْنُ عَلِيٍّ، عَلَى جَابِرِ بْنِ عَبْدِ اللَّهِ الأَنْصَارِيِّ فَقُلْنَا لَهُ أَخْبِرْنَا عَنْ صَلاَةِ، رَسُولِ اللَّهِ وَذَاكَ زَمَنُ الْحَجَّاجِ بْنِ يُوسُفَ. قَالَ خَرَجَ رَسُولُ اللَّهِ فَصَلَّى الظُّهْرَ حِينَ زَالَتِ الشَّمْسُ وَكَانَ الْفَىْءُ قَدْرَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 524، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 524 (The Book of the Times (of Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 524، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
