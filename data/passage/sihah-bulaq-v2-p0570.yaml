text: |-
  *⁦(ف صل الحاء)⁩
  د.⁦(خلف)⁩•
  ١٧
  والذى يقال له الحف (هوالمنسبح قال أبو سعيد الحفة المنوال ولا يقال له حفة وانما الحنفة
  المنسج والحفان فراخ النعام الواحدة حفافة الذكر والاتى فسه سواء وانشد الاصمعىّ
  لأسامة الهذلى
  والاالنعام وحقانه * وطغيامع اللهق الناشط
  الطغيا الصغير من بقر الوحس وأحد بن يحى يقول الطغيا بالفتح والحفان أيضا اخدم واناء
  حفان بلغ السكيل حذافيه وحقت المرأة وجهها من الشعر تحفه =فا وحفافا واحتقت أيضا
  قال الاصمعىّ الحفف عيس سوء وقلة مال يقال ما رؤى عليهم حفف ولا ضفف أى أثرعوز
  والاحتفاف أكل جيع مافى القدر والاشتفاف شرب جيع ما فى الاناء والمحفة بالمكسر
  مركب من مراكب النساء كالهودح الا أنم الاتقبب كما نقبب الهوادج وحفواحوله
  حفون حفاأى أطاذوابه واستداروا وقال اللّٰه تعالى وترى الملائ.كة حافين من حول
  العرش وحفه بالشي يحفه كما يحف الهودج بالنياب وكذلك التحفيف ويقال من حفنا
  من كان يحفه ويرفه وحفتهم الحاجة تحفهم اذا كانوا محاويج وهم قوم محفوفون وحفّ
  رأسه يحف بالكسر حفوفا أى بعد عهده بالدهن قال الكميت يصف وتدا
  وأشعث فى الدارذالمة • يطيل الحفوف فلا يقمل
  وأحففته أنا وحفّ الفرس أيضاحف حفيفا وأحففته أنا اذاجلته على أن يكون له جفيف
  وهودوت بريه وكذلك حفيف جناح الطائر و«فتشاريه ورأسه يحف حفا أى أحفاه
  وحفافا الشى جانباه ومنه قول طرقة
  كان جناحى مضرحىّ تكنفا * حفافيه شكانى العسيب بمسرد
  ويقال بق من شعره حفاف وذلك اذا صلع فبقيت من شعره طرة حول رأسه والجع أحفة
  قال ذو الزمة
  لهن اذا أصيحن منهم أحفة * وحيزيرون الديل أقبل جانيا
  قوله لهن أى للجفان أحفة أى قوم استدارواحولها قف الحقف المعوج من
  الرمل والجع حقاف وأحقاف واحة وقف الرمل والهلال أى اعوج قال العجاج
  طىّ الليالى زلفافزلفا * عماوة الهلال حتى احتوقفا .
  وفى الحديث أنه عليه السلام مرّ بظى حاقف فى ظلّ شجرة وهوالذى انحى وتذى فى نومه
  والاحقاف ديا رعاد قال اللّٰه تعالى واذكرأخا عاد إذ أنذرقومه بالاحقاف ⁦(حلف)⁩.
  حلف أى أقسم يحلف حافا وحلفا ومحلوفا وهو أح_دماجاء من المصادر على مفعول مشل
  المجاود والمعقول والمعدور وأحلفته أنا وحلفته واستحلفته كاه بمعنى والحلف بالكسبر
  العهسديكون بين القوم وقسدحالفه أى عاهده وتحالفوا أى تعاهدوا وفى الحديث أنه
  صلى اللّٰه عليه وسلم سالف بين قريش والانصار يعنى آخى بينهم لانه لاحلف فى الاسلام
  والأحلاف الذين فى شعرزهيرهم أسدوغطقان لانهم تالفواعلى التناصر والأحلاف
  أيضاقوم من بُقيف لانَ ثقيفا فرقتان بئومالكْ والاحلاف والحليف المحالف ويقال لبلي
  ماح
