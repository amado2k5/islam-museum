label: { ar: "موطأ مالك 1488 — الأب والأبوة", en: "Muwatta Malik 1488 — the father and fatherhood", ur: "موطأ مالک 1488 — باپ اور والدیت", es: "Muwatta Malik 1488 — El padre y la paternidad", fr: "Muwatta Malik 1488 — le père et la paternité" }
text: "… قَدْ كَانَ ثَبَتَ لَهُ الْوَلاَءُ يَوْمَ أَعْتَقَهُ. قَالَ مَالِكٌ وَإِنْ كَانَ لِلْيَهُودِيِّ أَوِ النَّصْرَانِيِّ وَلَدٌ مُسْلِمٌ وَرِثَ مَوَالِيَ أَبِيهِ الْيَهُودِيِّ أَوِ النَّصْرَانِيِّ إِذَا أَسْلَمَ الْمَوْلَى الْمُعْتَقُ قَبْلَ أَنْ يُسْلِمَ الَّذِي أَعْتَقَهُ وَإِنْ كَانَ الْمُعْتَقُ حِينَ أُعْتِقَ مُسْلِمًا لَمْ يَكُنْ لِوَلَدِ النَّصْرَانِيِّ أَوِ الْيَهُودِيِّ الْمُسْلِمَيْنِ مِنْ وَلاَءِ الْعَبْدِ الْمُسْلِمِ شَىْءٌ لأَنَّهُ لَيْسَ لِلْيَهُودِيِّ وَلاَ لِلنَّصْرَانِيِّ وَلاَءٌ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1488، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1488 (Setting Free and Wala'), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1488، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1488 (Liberación y Wala'), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Muwatta Malik, n° 1488 (Libération et Wala'), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
