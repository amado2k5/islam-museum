label: { ar: "صحيح مسلم 5298 — الأب والأبوة", en: "Sahih Muslim 5298 — the father and fatherhood", ur: "صحیح مسلم 5298 — باپ اور والدیت" }
text: "وَحَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ نُمَيْرٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا هِشَامٌ، عَنْ عَبْدِ الرَّحْمَنِ، بْنِ سَعْدٍ أَنَّ عَبْدَ الرَّحْمَنِ بْنَ كَعْبِ بْنِ مَالِكٍ، - أَوْ عَبْدَ اللَّهِ بْنَ كَعْبٍ - أَخْبَرَهُ عَنْ أَبِيهِ، كَعْبٍ أَنَّهُ حَدَّثَهُمْ أَنَّ رَسُولَ اللَّهِ كَانَ يَأْكُلُ بِثَلاَثِ أَصَابِعَ فَإِذَا فَرَغَ لَعِقَهَا."
summary:
  ar: "حديث في صحيح مسلم، رقم 5298، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5298 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5298، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
