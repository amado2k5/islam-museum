label: { ar: "الموطأ 387 — سالم: الجمع في السفر كصلاة الناس بعرفة", en: "Muwatta 387", es: "Muwatta 387", fr: "Muwatta 387", ur: "موطا 387", tr: "Al-Muwatta 387 — Salim: Yolculuk sırasında namazları birleştirmek, Arafat'taki insanların namazına benzer.", id: "Al-Muwatta 387 — Salim: Menggabungkan salat saat bepergian sama seperti salat orang-orang di Arafat" }
text: "نعم لا بأس بذلك، ألم تر إلى صلاة الناس بعرفة؟"
summary:
  ar: "يروي مالك عن ابن شهاب أنه سأل سالم بن عبد الله هل يُجمع بين الظهر والعصر في السفر، فقال: نعم لا بأس بذلك، واستشهد بصلاة الناس بعرفة؛ وهو في باب الجمع بين الصلاتين في الحضر والسفر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.208}"
  tr: "Malik, İbn Şihab'dan rivayetle, Salim ibn Abdullah'a yolculuk halindeyken öğle ve ikindi namazlarını birleştirmenin caiz olup olmadığını sorduğunu, Salim'in ise Arafat'taki insanların namazını delil göstererek \"Evet, bunda bir sakınca yoktur\" diye cevap verdiğini aktarır. Bu, yerleşik ve yolculuk halindeyken namazları birleştirme bölümünde yer almaktadır. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Abdül-Razzak tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.208}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa ia bertanya kepada Salim bin Abdullah apakah diperbolehkan menggabungkan salat Zuhur dan Ashar ketika sedang bepergian. Salim menjawab, \"Ya, tidak ada salahnya,\" dengan mengutip salat orang-orang di Arafat sebagai bukti. Ini terdapat dalam bab tentang menggabungkan salat ketika menetap dan ketika bepergian. Editor menyebutkan bahwa Abu Mus'ab, Suwaid, dan Abd al-Razzaq meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.208}"
