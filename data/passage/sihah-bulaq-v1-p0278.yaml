text: |-
  ٢٦٣
  ومنه ملح عراءرى والعراعر أيضا السيد والجمع عراعر بالفتح قال المكميت
  ما أنت من شجر العرى * عند الامورولا العراعر
  وقال مهلهل خلع الملون وصارتحت لوائه * شجر العرى وعراعر الاقوام
  والعراعر أيضا أطراف الاسمة فى قول الكميت
  سلفى نزار اذتحوات المناسم ك العراعر
  ⁦(عزر)⁩. التعزير التعظيم والتوقير والتعزير أيضًا التأديب ومنه سمى الضرب دون
  الحد نعزيراوعزرت الهارأ وقرته والعيزارشجر وأبو العيزاركنية طائرطويل العنق تراه أبدا
  فى الماه الضحضاح ويسمى السبعار وعز يراسم ينصرف نخفته وان كان أعجمما مثل نوح ولوط
  مثل عسروعسر ورحم ورحم وحلم وحلم وقد عسر الامر بالضم يعسر عسرافه وغسير وعسر
  عليه الامر بالكسر يعسر عسرا أى التاث فهوعسر وعسرت الناقة بذنبها تعسر عسرانا
  مثل ضربت تضرب ضر يانا اذا شالت به قال ذوالرمة
  اذاهى لم تعسرية ذيت به * تحاكى به شد والنجا الهمرجل
  وعسرت الغريم أعسره وأعسره عسرا اذاطلبت منه الدين ءلى عسرته وعسرت المرأة
  اذا عسر ولادها وعسرنى فلان أى جاءعلى بسارى ويقال رجل أعسر بين العسرلا-ذى
  يعمل بيساره وأما الذى يعمل بكنى يديه فهو أعسر يسرولا تسل أعسر أيسر وكان عمر بن
  الخطاب رضى اللّٰه عنه أعسر يسر وعقاب عسرا: ريشها من الجانب الايسر أكثر من
  الايمن وحام أعسر بجنا حه من يساره بياض وأعسر الرجل أضاق والمعاسرة ضد المياسرة
  والتعاسر ضد التياسر والمعسورضد الميسوروهما مصدران وقال سيمويه (ماصفقان
  ولا يجيء عنده المصدر على وزن المفعول البتة ويتأوّل قولهم دعه الى ميسوره والى معسوره
  ويقول كانه قال دعه الى أمريوسرفيه والى أمر يعسرفيه ويتأوّل المعقول أيضاوالعسرى
  نقبض البسرى والعسرة بالتحريك القادمة البيضاء ويقال عقاب عسراء فى يدها قوادم!
  بيض والعسير الناقة اذا اعناطت عامها فلم تحمل والعسير الناقة التى لم ترض وقد
  اعتسرتها اذاركبتها قبل أن تراض واعتسرهمثل اقتسره قال ذو الرمة
  أناس أهلكوا الرؤساقتلا * وقادوا الناس طوعا واعتسارا.
  واعتسر الرحل من مال واده اذا أخذ من ماله وهو كاره وناقةء وسرائية ركمت قبل
  أن تراض وجل عوسرانى ⁦(عسبر )⁩ العسبارة ولد الضبع من الذئب الذكر والانى فيه
  مواءقال الكميت وتجمع المتفرقون من الفراءل والعسابر والفرعل ولد الضبع
  والعسكران عرفة ومنى والعسكرة الشدة قال طرقة ظل فى عسكرة من حبها وعسكر
  الرجل فه ومعسكر والمعسكر يفع الكاف الموضع ⁦(عشر )⁩ عشرة رجال وعشرنسوة
  قال اين السكيت ومن العرب من يسكن العين فية ول أ-دعشر وكذلك الى تسعة عشر
