text: "وَحَدَّثَنَا أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ، قَالَ كَانَتِ الْعَرَبُ تَطُوفُ بِالْبَيْتِ عُرَاةً إِلاَّ الْحُمْسَ وَالْحُمْسُ قُرَيْشٌ وَمَا وَلَدَتْ كَانُوا يَطُوفُونَ عُرَاةً إِلاَّ أَنْ تُعْطِيَهُمُ الْحُمْسُ ثِيَابًا فَيُعْطِي الرِّجَالُ الرِّجَالَ وَالنِّسَاءُ النِّسَاءَ وَكَانَتِ الْحُمْسُ لاَ يَخْرُجُونَ مِنَ الْمُزْدَلِفَةِ وَكَانَ النَّاسُ كُلُّهُمْ يَبْلُغُونَ عَرَفَاتٍ. قَالَ هِشَامٌ فَحَدَّثَنِي أَبِي عَنْ عَائِشَةَ -ا - قَالَتِ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2955، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2955 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2955، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 2955 (El Libro de la Peregrinación), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 2955 (Le Livre du Pèlerinage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
