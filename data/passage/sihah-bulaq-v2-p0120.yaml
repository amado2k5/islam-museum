text: |-
  • ملب الواوراليا)•
  ٤٦٧
  أوظسة من ظماء الحوة اسقلت • مداسادرت نبتاوجرانا .
  وحواهيحو به حياآى جعه واحتواء منله واحتوى على النئء أى ألمأ عله وتحوى أى
  تجمع واستدارية ال تحتوّن الحية وبعيدأسوى اذا خالط خضرته سواد وصفرة وتصغير
  أحوى أحيوفى لغة من قال أسيود واختله وافى لفسة من أدغم. قال عيسى بن عمرأحي
  فصرف قال سيبويه أخطأ هو ولويازهذا الصرف أصم لانه أخف من أحوى ولقالوا أصيم
  صرفوا وقال أبو عدرو بن العلاء أحى كافالوا أحيو قال سيبويه ولوجازه_ذالقات
  فى عطاءعطىّ وقال يونس أحى قال سيبويه هذاهو القساس والصواب وتقول فى تصغير
  يحي بحى ياهذااتّ كل اسم اجتمع فيه ثلاث يا آت أولهن ياء التصغير فانك تحذف منهن
  واحدة فان لم يصكن أوامن ياء التصغيراً بتهن ثلاثهن تقول فى تصغير حية حيية وتقول
  فى تصغير أيوب أيبيب بأربع يا آت واحتملت ذلك لانها فى وسط الاسم ولو كان طرقا لم تجمع
  بدنهنْ والحواء مثال المكاءنبت يشبه لون الذئب الواحدة حوّاءة عن الاصمعى ⁦(حيا)⁩
  الحياة ضة الموت والحى ضد الميت والمحيا مفعل من الحياة تقول محياى ومماتى والهع
  المحايي وزعموا أن الحى بالكسرجع الحياة قال العجاج * وقد ترى اذ الحياة حى"
  والحى واحد أحساء العرب وأحساه اللّٰه في وحى أيضا والادغام أكثر لان الحركة لازمة
  قاذا لم تسكن الحركة لازمة لم تدغم كقوله تعالى أليس ذلك بقادر على أن يحي الموتى
  ويقرأ ويحي من حىّ عن بينة وقال أبوزيد حييت منه أحيا استحييت وتقول فى الجمع حيوا
  كا يقال خشوا قال سيويه ذهبت الياء لالتقاء الساكنين لان الواو-اكنة وحركة الياء
  نسد زالت كازالت فى ضربوا الى الضم ولم تحرّكْ الساء بالضيم لنقله عليها فذقت وضحت الياء
  الباقية لاجل الواو قال الشاعر
  وكاحسبناهم فوارس كهمس * حي وابعدماماتوا من الده رأعصرا
  وقال بعضهم حيوا بالتشديدتر كه على ماكان عليه للادغام قال ابن مفرّغ
  عبوا بامرهم كا • عيت بيضها المسامه
  قال أبو ع-رو أحبنا القوم اذا حسنت حال مواشيهم فان أردت أنفسه-م قلت حيوا
  وأحمت الناقة اذا حي وادها فهى محى ومحيية لا يحكاديموت لها ولد وأحيا القوم أى
  صاروا فى الحيا وهو الجصب وقدأتيت الارض فأحييتها أى وجدتها خصبة واستحياه.
  واستهيا ضه بمعنى من الحياء ويقال استحيت بياء واحدة وأص-له استحييت مثل استعيدت
  فأعلوا اليساه الاولى وألقواحركتها على الحاهفقالوا استحيت كما قالوالستعيت استنة الالما
  دخلت عليها الزوائد قال سيبويه حذفت لا لتقاء الساكنين لان اليماء الأولى تقلب ألفا
  لتحركها قال وانمافعلوا ذلك حيث كثر فى كلامهم وقال أبو عتثمان المازتى لم تحذف لا لتقاء
  الساكنين لانه الوحذفت لذلك لردوها اذا قالواهو يستحى ولقالوايستحى" كما فالوايستبيع
  وتعال أبو الحسن الاخفس استحى بياء واحدة لفة قيم وبياءين لغة أهل الجاز وهو الاصل
  لان ما كان. وضع لامه معتلالم يعلواعينه ألاترى أنمسم قالوا أحييت وحويت ويقولون
  قلت وبعت فيعلون العين لمالم تعتل اللام وانماحذفوا الياء لكثرة استعمالهم لهذه الكامة كما
