text: "… أمرك فان الحق فيا يجيىء به ورضى الرحن فيما قال. ثم ذكر قدومهما إلى يدت المقدس وأن صاحبه صل فيه هنسا وهاهنا ثم نام وقد أوصاه أنه إذا بلغ الظل مكان كذا أن يوقظه فتركه سلمان حيناً آخر أزيد مما …"
