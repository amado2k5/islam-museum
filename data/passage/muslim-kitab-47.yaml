summary:
  ar: "القسم 47 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العلم»، ويضم فيها النصوص من 6775 إلى 6804 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 47 of Sahih Muslim (The Book of Knowledge) in the division of the open hadith dataset the museum took its reports from: reports 6775 to 6804 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 47، عنوان «کتاب العلم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6775 تا 6804۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 47 del Sahih Muslim (El Libro del Conocimiento) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6775 al 6804, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
