label: { ar: "سنن ابن ماجه 1529 — الأب والأبوة", en: "Sunan Ibn Majah 1529 — the father and fatherhood", ur: "سنن ابن ماجہ 1529 — باپ اور والدیت" }
text: "… يَعْقُوبُ بْنُ حُمَيْدِ بْنِ كَاسِبٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ الدَّرَاوَرْدِيُّ، عَنْ مُحَمَّدِ بْنِ زَيْدِ بْنِ الْمُهَاجِرِ بْنِ قُنْفُذٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَامِرِ بْنِ رَبِيعَةَ، عَنْ أَبِيهِ، أَنَّ امْرَأَةً، سَوْدَاءَ مَاتَتْ و لَمْ يُؤْذَنْ بِهَا النَّبِيُّ ـ فَأُخْبِرَ بِذَلِكَ فَقَالَ \" هَلاَّ آذَنْتُمُونِي بِهَا \". ثُمَّ قَالَ لأَصْحَابِهِ \" صُفُّوا عَلَيْهَا \". فَصَلَّى عَلَيْهَا."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1529، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1529 (Chapters Regarding Funerals), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1529، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
