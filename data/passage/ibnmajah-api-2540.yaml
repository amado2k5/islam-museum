label: { ar: "سنن ابن ماجه 2540 — أسماء الأمراض", en: "Sunan Ibn Majah 2540 — named diseases", ur: "سنن ابن ماجہ 2540 — بیماریوں کے نام" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ سَالِمٍ الْمَفْلُوجُ، حَدَّثَنَا عُبَيْدَةُ بْنُ الأَسْوَدِ، عَنِ الْقَاسِمِ بْنِ الْوَلِيدِ، عَنْ أَبِي صَادِقٍ، عَنْ رَبِيعَةَ بْنِ نَاجِدٍ، عَنْ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَقِيمُوا حُدُودَ اللَّهِ فِي الْقَرِيبِ وَالْبَعِيدِ وَلاَ تَأْخُذْكُمْ فِي اللَّهِ لَوْمَةُ لاَئِمٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2540، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 2540 (The Chapters on Legal Punishments), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2540، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
