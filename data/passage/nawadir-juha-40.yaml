text: "… تأثير النشادر في الحيوان والإنسان كان حمارُهُ لا يصعدُ الجبل إلا بصعوبةٍ، رغماً عن كل ضِرباتِ العصا، فاستشارَ أحد أصحابِهِ، في دواء هذا الحمار الكسول، فأشار عليه أَنْ يضعَ قليلاً مِنَ النشادرِ في أسفل الحمار، فما أسرعَ ما علم جحا …"
summary:
  ar: "نصح صديق جحا باستعمال النشادر ليصعد حماره الكسول الجبل، فجرّبه جحا على نفسه وركض إلى البيت وقال لزوجته أن تفعل مثله. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  en: "A friend advises Juha to use ammonia to get his lazy donkey up a mountain; Juha tries it on himself, runs home, and tells his wife to do the same. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  ur: "ایک دوست نے جحا کو مشورہ دیا کہ سست گدھے کو پہاڑ پر چڑھانے کے لیے نوشادر استعمال کرے؛ جحا نے اسے خود پر آزمایا اور بھاگتا ہوا گھر پہنچا اور بیوی سے کہا کہ وہ بھی ایسا ہی کرے۔ {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  fr: "Un ami conseille à Juha d'employer de l'ammoniaque pour faire monter la montagne à son âne paresseux ; Juha l'essaie sur lui-même, court jusqu'à la maison et dit à sa femme d'en faire autant. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
  es: "Un amigo aconseja a Juha usar amoníaco para que su burro perezoso suba una montaña; Juha lo prueba en sí mismo, corre a casa y le dice a su mujer que haga lo mismo. {cite:juha-nawadir-kubra-djuwaydi p. 24}"
