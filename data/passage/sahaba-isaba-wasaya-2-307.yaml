text: "… اللّٰه تعالى. وقال أبو عبيد البكري في شرح الأمالي: زعم الطَبَرِيّ أنه أسلم. - حريث بن أبي حريث: واستدل بزيارته لعمر وعثمان، وبأن الوليد بن عقبة وهو أبن عمرو، يأتي. أوصى أن يدفن إلى جنبه. - حريث بن حسان البكري: …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 307، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 307, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 307 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de la obra al-Isaba de Ibn Hajar, volumen 2, pág. 307, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 2, p. 307), mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments Browser."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 307. sayfasından bir alıntı, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsetmektedir; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 2, halaman 307, menyebutkan wasiat atau surat wasiat terakhir, pemakaman, kuburan, dan makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
