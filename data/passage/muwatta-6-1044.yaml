label: { ar: "الموطأ 1044 — ابن شهاب عن سالم عن ابن عمر: المحصر بمرض لا يحل حتى يطوف بالبيت ويسعى بين الصفا والمروة، فإن اضطر إلى لبس شيء من الثياب أو الدواء صنع ذلك وافتدى", en: "Muwatta 1044" }
text: "المحصر بمرض لا يحل حتى يطوف بالبيت ويسعى بين الصفا والمروة، فإن اضطر إلى لبس شيء من الثياب أو الدواء صنع ذلك وافتدى"
summary:
  ar: "أول حديث في باب ما جاء فيمن أحصر بغير عدو. يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر، أنه قال: المحصر بمرض لا يحل حتى يطوف بالبيت ويسعى بين الصفا والمروة. فإن اضطر إلى لبس شيء من الثياب التي لا بد له منها أو الدواء صنع ذلك وافتدى. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1162) وسويد (566). {cite:muwatta-maruf-1997 p.485}"
