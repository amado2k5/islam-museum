label: { ar: "الموطأ 1044 — ابن شهاب عن سالم عن ابن عمر: المحصر بمرض لا يحل حتى يطوف بالبيت ويسعى بين الصفا والمروة، فإن اضطر إلى لبس شيء من الثياب أو الدواء صنع ذلك وافتدى", en: "Muwatta 1044", es: "Muwatta 1044", fr: "Muwatta 1044", ur: "موطا 1044", tr: "El-Muvatta 1044 — İbn Şihab, Salim'den, o da İbn Ömer'den rivayetle: Hastalık nedeniyle Hac ibadetini tamamlayamayan kişi, Kâbe etrafında tavaf yapıp Safa ile Merve arasında Sa'i çekmedikçe ihram halinden çıkamaz. Eğer bazı kıyafetleri giymesi veya ilaç alması zorunlu hale gelirse, bunu yapmalı ve fidye ödemelidir.", id: "Al-Muwatta 1044 — Ibn Shihab, dari Salim, dari Ibn Umar: Seseorang yang terhalang menyelesaikan ibadah haji karena sakit tidak dibebaskan dari keadaan ihram sampai ia melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa. Jika ia terpaksa mengenakan pakaian atau minum obat, ia harus melakukannya dan memberikan tebusan." }
text: "المحصر بمرض لا يحل حتى يطوف بالبيت ويسعى بين الصفا والمروة، فإن اضطر إلى لبس شيء من الثياب أو الدواء صنع ذلك وافتدى"
summary:
  ar: "أول حديث في باب ما جاء فيمن أحصر بغير عدو. يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن عبد الله بن عمر، أنه قال: المحصر بمرض لا يحل حتى يطوف بالبيت ويسعى بين الصفا والمروة. فإن اضطر إلى لبس شيء من الثياب التي لا بد له منها أو الدواء صنع ذلك وافتدى. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1162) وسويد (566). {cite:muwatta-maruf-1997 p.485}"
  tr: "Hac ibadetini düşman dışında bir nedenle tamamlayamayan kimse hakkında rivayet edilenler bölümündeki ilk hadis, Malik'in İbn Şihab'dan, o da Salim ibn Abdullah'tan, o da Abdullah ibn Ömer'den rivayet ettiği hadistir: “Hastalık nedeniyle Hac ibadetini tamamlayamayan kimse, Kâbe'nin etrafında tavaf yapıp Safa ile Merve arasında sa'y çekmedikçe ihram halinden kurtulamaz. Eğer ihtiyaç duyduğu bazı giysileri giymesi veya ilaç alması gerekiyorsa, bunları yapmalı ve fidye vermelidir.” Editör, bu hadisin Malik'ten Ebu Mus'ab (1162) ve Suveyd (566) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.485}"
  id: "Hadits pertama dalam bab ini membahas tentang orang yang terhalang menyelesaikan ibadah haji karena sebab selain musuh. Diriwayatkan oleh Malik dari Ibnu Shihab, dari Salim ibn Abdullah, dari Abdullah ibn Umar, yang berkata: “Orang yang terhalang menyelesaikan ibadah haji karena sakit tidak akan terbebas dari keadaan ihram sampai ia melakukan tawaf mengelilingi Ka'bah dan sa'i antara Safa dan Marwa. Jika ia terpaksa mengenakan sebagian pakaian yang dibutuhkannya atau minum obat, maka ia harus melakukannya dan memberikan tebusan.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1162) dan Suwaid (566). {cite:muwatta-maruf-1997 p.485}"
