label: { ar: "سنن النسائي 1770 — الأب والأبوة", en: "Sunan al-Nasa'i 1770 — the father and fatherhood", ur: "سنن نسائی 1770 — باپ اور والدیت", es: "Sunan al-Nasa'i 1770 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1770 — le père et la paternité" }
text: "أَخْبَرَنَا يَحْيَى بْنُ مُحَمَّدٍ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ جَهْضَمٍ، قَالَ إِسْمَاعِيلُ حَدَّثَنَا عَنْ عُمَرَ بْنِ نَافِعٍ، عَنْ أَبِيهِ، عَنِ ابْنِ عُمَرَ، قَالَ أَخْبَرَتْنِي حَفْصَةُ، أَنَّ رَسُولَ اللَّهِ كَانَ يُصَلِّي قَبْلَ الصُّبْحِ رَكْعَتَيْنِ."
summary:
  ar: "حديث في سنن النسائي، رقم 1770، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1770 (The Book of Qiyam Al-Lail (The Night Prayer) and Voluntary Prayers During the Day), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1770، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1770 (El Libro de Qiyam Al-Lail (La oración nocturna) y las oraciones voluntarias del día), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 1770 (Le Livre de la prière nocturne et des prières surérogatoires du jour), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
