  ar: "يروي مالك عن زيد بن أسلم أن عمر بن الخطاب كان يقول اللهم إني أسألك شهادة في سبيلك، ووفاة ببلد رسولك. ويذكر المحقق أن إسناده منقطع، لأن زيد بن أسلم لم يدرك عمر، وأن البخاري وصله. {cite:muwatta-maruf-1997 p.595}"
