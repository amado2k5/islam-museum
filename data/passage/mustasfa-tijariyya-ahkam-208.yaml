text: "… فعجبوا منه فقال ألا أستحي ممن تستحي بمنه ملائكة السماء فهذا لا يرفع النهى لاحتمال إنه لم يكن داخلا فيه أو لعله كشفه. لعارض وعذر فإنه حكاية حال أو أريد بالفخذ ما يقرب منه وليس داخلا فى حده أو إباحته …"
