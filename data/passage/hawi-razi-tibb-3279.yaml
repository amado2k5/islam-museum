text: "الأدوية المفردة باب الكاف اليرقان؛ وإذا شرب مع الشراب الذي يقال له أدرومالي أربعين يوماً متوالية أبرأ عرق النسا. وقد يسقى منه لعلة الكبد وعسر البول ووجع الكلى والمغس. وقد يستعمل هذا النبات لضرر السم المسمى أقرنيطن ؛ وقد يضمد …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3279، يذكر الوجع، وأسماء الأمراض، والبرء من العلة، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والسم والترياق، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3279, that mentions pain, named diseases, recovery from an ailment, the organs of the body, surgery, circumcision and splints, the drug, poison and antidote, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3279 کا اقتباس جس میں درد، بیماریوں کے نام، بیماری سے شفایابی، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، زہر اور تریاق، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
