text: "… ومائة ذكر الخبر عما كان فيها من الاحداث فن ذلك غزوة مسلمة بن هشام بن عبد الملك الروم فافتح بهاه مطامير وغزولا مروان بن محتد بلاده صاحب شرِيره الذهب فافتح، قلاعه وخرّب أرضه واذهن له بالجزية فى كلّ سنة الف …"
