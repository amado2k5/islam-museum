text: "… مسكينُ بنُ بكيرٍ قالَ: ثنا ثابتُ بنُ عجلانَ، عن سليم أبي عامرٍ أن وفدَ الحمراءِ أتوا عثمانَ بنَ عفانَ يبايعونه على الإسلام وعلى من ورائهم فبايعهم على أن لا يشركوا باللهِ شيئًا وأن يقيموا الصلاةَ ويؤتوا الزكاةَ ويصوموا رمضانَ ويَدَعُوا …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 86، يذكر الصلاة والزكاة والصوم والحج مجتمعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Rajab's Fath al-Bari, scan volume 1, p. 86, that mentions the prayer, the zakat, the fast and the pilgrimage named together; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فتح الباری، ابن رجب، اسکین جلد 1، ص 86 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fath al-Bari de Ibn Rajab, volumen 1, pág. 86, que menciona la oración, el zakat, el ayuno y la peregrinación en conjunto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Fath al-Bari d'Ibn Rajab (tome 1, p. 86) mentionnant la prière, la zakat, le jeûne et le pèlerinage. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur « Piliers et branches de la foi »."
  tr: "İbn Receb'in Fethü'l-Bari adlı eserinin 1. cildinin 86. sayfasında namaz, zekât, oruç ve Hac birlikte anılmaktadır; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Fath al-Bari karya Ibn Rajab, Jilid 1, halaman 86, menyebutkan salat, zakat, puasa, dan haji secara bersamaan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
