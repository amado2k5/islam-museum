label: { ar: "الموطأ 1943 — مالك: والأمر عندنا أن من المخاطرة والغرر اشتراء ما في بطون الإناث من النساء والدواب، لأنه لا يدرى أيخرج أم لا، وهل يكون حسنا أم قبيحا، أتاما أم ناقصا، أذكرا أم أنثى", en: "Muwatta 1943", es: "Muwatta 1943", fr: "Muwatta 1943", ur: "موطا 1943", tr: "El-Muvatta 1943 — Malik: Bizim görüşümüze göre, dişi ve hayvanların rahimlerinde bulunan şeyi satın almak riskli ve belirsizdir, çünkü dışarı çıkıp çıkmayacağı, iyi mi kötü mü olacağı, tam mı eksik mi olacağı, erkek mi dişi mi olacağı bilinmemektedir.", id: "Al-Muwatta 1943 — Malik: Menurut pandangan kami, membeli apa yang ada di dalam rahim perempuan dan hewan adalah tindakan yang berisiko dan tidak pasti, karena tidak diketahui apakah akan keluar atau tidak, apakah akan baik atau buruk, lengkap atau tidak lengkap, laki-laki atau perempuan." }
summary:
  ar: "قال مالك: والأمر عندنا أن من المخاطرة والغرر اشتراء ما في بطون الإناث من النساء والدواب، لأنه لا يدرى أيخرج أم لا يخرج. فإن خرج لم يدر أيكون حسنا أم قبيحا، أتاما أم ناقصا، أذكرا أم أنثى، وذلك كله يتفاضل. {cite:muwatta-maruf-1997 p.195}"
  tr: "Malik şöyle dedi: Bizim görüşümüze göre, dişi ve hayvanların rahimlerinde bulunan şeyi satın almak riskli ve belirsizdir, çünkü doğup doğmayacağı bilinmemektedir. Doğsa bile, güzel mi çirkin mi, tam mı eksik mi, erkek mi dişi mi olacağı bilinmemektedir ve bunların hepsi değişkenliğe tabidir. {cite:muwatta-maruf-1997 s.195}"
  id: "Malik berkata: Menurut pandangan kami, membeli apa yang ada di dalam rahim perempuan dan hewan adalah tindakan yang berisiko dan tidak pasti, karena tidak diketahui apakah ia akan lahir atau tidak. Dan jika lahir, tidak diketahui apakah ia akan cantik atau jelek, lengkap atau tidak lengkap, jantan atau betina, dan semua itu dapat berubah-ubah. {cite:muwatta-maruf-1997 p.195}"
