  ar: "سنن النسائي، كتاب الهبة"
  en: "Sunan al-Nasa'i, Book 32: The Book of Gifts"
  ur: "سنن نسائی، کتاب الہبۃ"
  es: "Sunan al-Nasa'i, Libro 32: El Libro de los Regalos"
  fr: "Sunan al-Nasa'i, Livre 32: Le Livre des dons"
summary:
  ar: "القسم 32 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الهبة»، ويضم فيها النصوص من 3688 إلى 3705 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 32 of Sunan al-Nasa'i (The Book of Gifts) in the division of the open hadith dataset the museum took its reports from: reports 3688 to 3705 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 32، عنوان «کتاب الہبۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3688 تا 3705۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 32 de Sunan al-Nasa'i (El Libro de los Regalos) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3688 al 3705, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan al-Nasa'i (Livre des Dons), volume 32, dans la base de données ouverte: les hadiths 3688 à 3705. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
