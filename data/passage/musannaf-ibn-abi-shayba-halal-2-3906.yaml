text: "… كُنّ في الجاهلية، فقيل لهن: هذا حرام، فأرادوا نكاحهن، فَحَرَّم اللّٰه عليهم نكاحهن. - من قال: لا يتزوج مَحدود إلا مَحدودة ومن رخص في ذلك - حدثنا أبو بكر عن مُعْتمر بن سليمان عن عاصم عن الشعبي قال: أَحَلُّ النساء …"
