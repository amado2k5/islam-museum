text: |-
  وضا⅜
  ٢٧
  الهمزلانه من ناء اليان ونؤت اليه أى نهض اليك ونهضت اليه ابن السكيت يقال له عندى
  ماساء، وناءه أى أثقله ومايسوه وينوء. وقال بعضهم أرادساءهوأناء، واغاقال ناءه
  وهولا يتعدى لاجل ساءه ليزدوج الكلام كما يقال انى لاتيه الغدايا والعشايا والفداة
  لا تجمع على غدايا وأنا اللحم ينيته إناءة اذا لم ينضحه وقدناء اللّحم ين نيأ فهو لم نىء بالكسر
  مثال نيع بين النيوء والنيوءة وناء الرجل مثال ناع لغة فى نأى اذا بعد قال الشاءر
  من ان رالغني الان جانبه • وان وآلفقيراناء واغتربا
  ن سل ال و ) وب أ و يأعدّ ويقصر مرض عام وجمع المقصوراأ وباء وبحع المسعدود
  أو بمة وقدوبئت الارض تو بأوبأفهى موبوءة اذا كثرمر ضها وكذلك وبدت نوبأوباءمثل
  تمه تماهة فهى ديئة ووبيئة على فعلة وذعيلد وفيه لغة ثالثة أو بأت فهي موبئة واستوبأت
  الارض وجدتهاو بئة ووبات اليه بالفتح وأوبأت لغة فى ومأت وأومأت اذا أشرت اليه
  قال الشاعروان نحن أو بأنا الى الناس وقفوا ⁦(١ نأ)⁩ وتنت يده فمى موثوة ووثأتها
  أنا وأصابه وث«والعامة تقول وبى وهو أن يصيب العظم وصم لا يبلخ الكسر ( جأ بن
  السكيت قال الطائى الوحيئة الإراديدق ثم يلت بسمن أويزيت فيؤكل قال وسمعت الكلابي
  يقول الوجيشة التمريدق حتى يخرج نواءثم يبيل بلبن وسمن حنى يتدن ويلزم بعضه بعضافيو كل
  وهو فعيلة ووجأته بالسكين ضريته ووجئ هوفه وموجوء والوجاء بالكسر والمدّرض
  عروق البيضتين حتى تنفضح فيكون شيها باطصاء وفى الحديث عليكم بالباءة فن لم يستطع
  فعليه بالصوم قانه له وجاءقول منه وجأت الكبس وفى الحديث انه صلى اللّٰه عليه وسلم ضحى
  بكبشين موجوءين ووجأت عنقه وجأضر بته وقد نوجأنه بيدى ( ⁦(دأ)⁩ بودأ عليه أى
  اهلكد وود أفلان بالقوم نودئة أبو عبدد المودّأة المهلمكة والمفازة قال وهى لفظ المفعول به
  أبو زيدودأت عليه الارض بوديدا اذاسويت عليه الارض قال الشاعر الضى يرفى أخاه أب
  أأبىّ ان تصبح رهين مودا * زلخ الجوانب قعره ملحود
  ⁦( وذأ)⁩ وذأت الرحل وذءآاذاعبته وحة رته وأنشدأبوزيد
  ثمت حوائجى ووذأت بشرا • فبئس.حرس الركب السعاب
  ووذأته فاتذ أزجرته فانز بر ⁦( وزا)⁩ وزأت اللحم وزءا أيبسته والوزأ على فعل بالتحريك
  لشديد الخلق ووزأت الناقة براكيها بوزئة صرعته أبوزيدوزأت الوعاء بوزئة وتوزينا اذا
  شددت كنزه الاصمعى توزأت امتلات رياووزأت القرية توز:املاتها (و%ضأً% الوضافة
  الحسن والنظافة تقول منه وضؤارجل أى صاروضينا وتوضأت للصلاة ولا تقل توضيت
  وبعضهم ية وله والوضوء بالفتح المناء الذى يتوض أبه والوضوء أيضا المصدر من بوضأت للصلاة
  مثل الولوع والقبول بالفتح قال اليزيدى الوضو بالضم المصدر وحكى عن أبي عمرو
  ابن العلاء القبول بالفتح مصدرلم أسمع غيره وذكر الاخفس فى قوله تعالى وقودها الساس
  واخجارة فقال الوقود الحطب بالفتح والوقود بالضم الاتقادوهِ والفعل قال ومشل ذلكْ
  الوضوء وهو الماء والوضر"وهو الفعل ثم قال وزعموا انه-مالغتان بمعى واحد تقول الوقود
  والوقود يجرزأن يعنى بم ما الحطب ويجوز أن يعى بم ما الذعل وقال غيره القبول والولوغ
