text: "… رَسُولِ اللَّهِ لأَرْبَعٍ مَضَيْنَ مِنْ ذِي الْحِجَّةِ فَقَالَ النَّبِيُّ \" أَحِلُّوا وَاجْعَلُوهَا عُمْرَةً \". فَضَاقَتْ بِذَلِكَ صُدُورُنَا وَكَبُرَ عَلَيْنَا فَبَلَغَ ذَلِكَ النَّبِيَّ فَقَالَ \" يَا أَيُّهَا النَّاسُ أَحِلُّوا فَلَوْلاَ الْهَدْىُ الَّذِي مَعِي لَفَعَلْتُ مِثْلَ الَّذِي تَفْعَلُونَ \". فَأَحْلَلْنَا حَتَّى وَطِئْنَا النِّسَاءَ وَفَعَلْنَا مَا يَفْعَلُ الْحَلاَلُ حَتَّى إِذَا كَانَ يَوْمُ التَّرْوِيَةِ وَجَعَلْنَا مَكَّةَ بِظَهْرٍ لَبَّيْنَا بِالْحَجِّ."
summary:
  ar: "حديث في سنن النسائي، رقم 2994، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2994 (The Book of Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2994، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2994 (El Libro del Hajj), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2994 (Le Livre du Hajj), mentionne ce qui est licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de 2994 numaralı hadis, helal ve haram olanı belirtir. Helal ve haram tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2994, menyebutkan apa yang diperbolehkan. Peramal halal dan haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
