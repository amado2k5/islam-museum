label: { ar: "سنن ابن ماجه 664 — الأب والأبوة", en: "Sunan Ibn Majah 664 — the father and fatherhood", ur: "سنن ابن ماجہ 664 — باپ اور والدیت", es: "Sunan Ibn Majah 664 — El padre y la paternidad" }
text: "حَدَّثَنَا سُوَيْدُ بْنُ سَعِيدٍ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنْ مُحَمَّدِ بْنِ عُبَيْدِ اللَّهِ، عَنِ الْحَسَنِ بْنِ سَعْدٍ، عَنْ أَبِيهِ، عَنْ عَلِيٍّ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ ـ فَقَالَ إِنِّي اغْتَسَلْتُ مِنَ الْجَنَابَةِ وَصَلَّيْتُ الْفَجْرَ ثُمَّ أَصْبَحْتُ فَرَأَيْتُ قَدْرَ مَوْضِعِ الظُّفْرِ لَمْ يُصِبْهُ الْمَاءُ. فَقَالَ رَسُولُ اللَّهِ ـ \" لَوْ كُنْتَ مَسَحْتَ عَلَيْهِ بِيَدِكَ أَجْزَأَكَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 664، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 664 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 664، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 664 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
