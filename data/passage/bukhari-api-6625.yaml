label: { ar: "صحيح البخاري 6625 — ما فرضه الله ورسوله", en: "Sahih al-Bukhari 6625 — what God and His Messenger made obligatory", ur: "صحیح بخاری 6625 — جو اللہ اور اس کے رسول نے فرض کیا", fr: "Sahih al-Bukhari 6625 — ce que Dieu et Son Messager ont rendu obligatoire", es: "Sahih al-Bujari 6625 — lo que Dios y Su Mensajero hicieron obligatorio" }
text: "فَقَالَ رَسُولُ اللَّهِ \" وَاللَّهِ لأَنْ يَلِجَّ أَحَدُكُمْ بِيَمِينِهِ فِي أَهْلِهِ آثَمُ لَهُ عِنْدَ اللَّهِ مِنْ أَنْ يُعْطِيَ كَفَّارَتَهُ الَّتِي افْتَرَضَ اللَّهُ عَلَيْهِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6625، يرد فيه ذكر ما فرضه الله ورسوله. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 6625 (Oaths and Vows), whose wording mentions what God and His Messenger made obligatory. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 6625، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6625, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 6625, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
