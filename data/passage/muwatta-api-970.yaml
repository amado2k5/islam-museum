text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ رَجُلٍ، مِنْ أَهْلِ الْكُوفَةِ أَنَّ عُمَرَ بْنَ الْخَطَّابِ، كَتَبَ إِلَى عَامِلِ جَيْشٍ كَانَ بَعَثَهُ إِنَّهُ بَلَغَنِي أَنَّ رِجَالاً مِنْكُمْ يَطْلُبُونَ الْعِلْجَ حَتَّى إِذَا أَسْنَدَ فِي الْجَبَلِ وَامْتَنَعَ قَالَ رَجُلٌ مَطْرَسْ - يَقُولَ لاَ تَخَفْ - فَإِذَا أَدْرَكَهُ قَتَلَهُ وَإِنِّي وَالَّذِي نَفْسِي بِيَدِهِ لاَ أَعْلَمُ مَكَانَ وَاحِدٍ فَعَلَ ذَلِكَ إِلاَّ ضَرَبْتُ عُنُقَهُ ‏.‏ قَالَ يَحْيَى سَمِعْت …"
summary:
  ar: "في موطأ مالك؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Muwatta Malik; sending a letter or message to a party."
