text: |-
  TEA
  وخلج)
  قال الراجز
  جارية شبت شباباخرفجا * كان منها القصب المدملها * سوق من البردى ما تعوّيا
  ا حزرج انخزرج ريح قال الفرامخزرج هى الجنوب غير مجراة وقسلة من الانماروهى
  الاوس والخزرج اساقلة وهى أعهمانسبا الها وهما اناحارتة بن تعلية من المن
  فيج انلخفيج من أدواء الايل قال الاصمعى فان كان رجلا اليعير تعجلان
  القيام قبل أن يرفعه ماكان به رعدة ذه وأخفج وقد خفج حفيا وخفاجية بالنت
  فىّ من بى عامى قال الاعشى
  وادفع عن أعراضكم وأعبركم • لسانا كقراض الخفاجى ملحبا
  وغلام خنفج بالضم وخنافج أى كثير اللعسم ( خ لج خلي يخليه خليا واختليه
  اذا جذيه وانتزعه قال العجاح
  فان يكن هذا الزمان خلما • فقد ابسناعيشه الخرفجا
  يعنى قدخلج حالا وانتزعها وبداها يغيرها وخلجت عينه تخلج وتخلج خلوجا واختلمت إذا
  طارت وخلجه بعينه أى غمزه وقال
  جارية من شعب ذى رعين • حياكة غشى بعاطتين
  قد خليت بماحب وعين * ياقوم خلوابينها وبين
  أشدما خلى بين اثنين
  وخلجنى كذا أى شغلى يقال خلمته أمورالدنيا والخلج بالتحريك أن بشتكى الرجل عظامه
  من عمل أومن طول مشى وتعب تقول منه خلج بالكسر وتخلج المفلوج فى مشيته أى تفكك
  وتمابل وتخالج فى صدرى منه شئ وذلك اذاشككت واظلوح من النوف التى اختلج عنها
  ولدها فقل لذلاك لبنها وقدخلجتها أى فطعت ولدها واتحايج من البحرشرم منه والخايج النهر
  ويق-ال جانياه خليجاه وانخايج الحبل قال ابن السكيت لانه يجذب ماشدبه قال ابن مقبل
  وبات يغى فى اخخليج كانه * كيت مدقى ناصع اللون أقرح
  والخليج الحفنة والمع خلج قال لبيد
  ويكالون اذا الرياح تناوحت خلجاتد شوارعا أيتامها
  والخلج أيضاسة ن صغاردون العسدولى قاله أبو عبيد واتجلج أيضاقوم من الغرب كانوامن
  عدوان فألخقهم عموبن الخطاب بالحرث بن مالك بن النضربن كتانه وسوابذلك لانهم اختلجوا
  •ن عدوان والمخلوجة الطعنة ذات اليمين وذات الشمال قال امر والقيس
  قطعنهم سلكى ومخلوجة * كزللأ عين على نابل
  وقد خلجته اذا طعنته والمخاوجة الرأى المصيب قال الخطيئة
  وكنت اذا دارت رحى الحرب رعته • بمناوجة فيهنا من العجز مصرف
  وانخلئج شجر فارسى معرب قال الشاعر
  لبن البخت فى قصاع الخلنج والجمع الخلافج
  قال هميان بن محافة
  حتى اذا ماقضت الموابجا • وملأت حلابم االخلانجا * منها دواالاوطب النواشجا
