label: { ar: "الموطأ 2595 — هشام بن عروة عن أبيه: من خرج من المدينة رغبة عنها أبدلها الله خيرا منه", en: "Muwatta 2595", es: "Muwatta 2595", fr: "Muwatta 2595", ur: "موطا 2595", tr: "El-Muvatta 2595 — Hişam ibn Urve, babasından rivayetle: Kim Medine'yi sevmediği için terk ederse, Allah onun yerine daha iyisini verir.", id: "Al-Muwatta 2595 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Barang siapa meninggalkan Madinah karena tidak menyukainya, Allah akan menggantinya dengan sesuatu yang lebih baik." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أن النبي قال: لا يخرج أحد من المدينة رغبة عنها إلا أبدلها الله خيرا منه. {cite:muwatta-maruf-1997 p.464} {cite:muwatta-maruf-1997 p.465}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Peygamberimizin şöyle buyurduğunu nakletmiştir: \"Hiç kimse Medine'yi sevmediği için terk etmezse, Allah onu daha iyisiyle değiştirir.\" {cite:muwatta-maruf-1997 s.464} {cite:muwatta-maruf-1997 s.465}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, yang juga meriwayatkan dari ayahnya, bahwa Nabi bersabda: “Tidak seorang pun meninggalkan Madinah karena rasa jijik kepadanya kecuali Allah akan menggantinya dengan sesuatu yang lebih baik.” {cite:muwatta-maruf-1997 p.464} {cite:muwatta-maruf-1997 p.465}"
