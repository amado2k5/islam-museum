label: { ar: "الموطأ 2525 — مالك: جراح أهل الذمة على حساب جراح المسلمين في الدية", en: "Muwatta 2525", es: "Muwatta 2525", fr: "Muwatta 2525", ur: "موطا 2525", tr: "El-Muvatta 2525 — Malik: Gayrimüslimlere verilen yaralar, Müslümanlara verilen yaralar pahasına, yani kan parası olarak ödenir.", id: "Al-Muwatta 2525 — Malik: Luka yang ditimbulkan pada orang non-Muslim dibayar dengan mengorbankan luka yang ditimbulkan pada orang Muslim dalam bentuk uang darah." }
summary:
  ar: "قال مالك: وجراح اليهودي والنصراني والمجوسي في دياتهم على حساب جراح المسلمين في دياتهم: الموضحة نصف عشر ديته، والمأمومة ثلث ديته، والجائفة ثلث ديته، فعلى حساب ذلك جراحاتهم كلها. {cite:muwatta-maruf-1997 p.435}"
  tr: "Malik şöyle dedi: Yahudilere, Hristiyanlara ve Mecusilere verilen yaralar için kan parası, Müslümanlara verilen yaralar için hesaplanan kan parasına göre hesaplanır: Kemikleri açığa çıkaran bir yara (el-mudihah) kan parasının onda birinin yarısı, kafatasını delen bir yara (el-ma'mumah) kan parasının üçte biri ve karın boşluğunu delen bir yara (el-ja'ifah) kan parasının üçte biridir. Tüm yaraları buna göre hesaplanır. {cite:muwatta-maruf-1997 s.435}"
  id: "Malik berkata: Uang darah untuk luka yang ditimbulkan pada orang Yahudi, Kristen, dan Majusi dihitung sesuai dengan uang darah untuk luka yang ditimbulkan pada Muslim: luka yang memperlihatkan tulang (al-mudihah) adalah setengah dari sepersepuluh uang darah, luka yang menembus tengkorak (al-ma'mumah) adalah sepertiga dari uang darah, dan luka yang menembus rongga perut (al-ja'ifah) adalah sepertiga dari uang darah. Semua luka mereka dihitung sesuai dengan itu. {cite:muwatta-maruf-1997 p.435}"
