text: "… حدَّثنا أحمدُ عليٌّ، وأَقْرَأَها أُبِيّ، وأَفْرضَها زيدٌ، وأَعْلمهم بالحلالِ ابنُ مُعَتَّب، قال : حدَّثنا الحسين بن الحسن، قال : والحرام معاذُ بنُ جَبل، ولكُلِّ أُمَّة أَمينٌ، وأَمينُ هذه أخبرنا عبدُ اللّٰه بن المبارك، قال : حدَّثنا إسماعِيل الأُمَّةِ أَبو عبيدةَ …"
