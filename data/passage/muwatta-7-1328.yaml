label: { ar: "الموطأ 1328 — عبد الله بن أبي قتادة عن أبيه: جاء رجل يسأل إن قتل صابرا محتسبا مقبلا غير مدبر أيكفر الله خطاياه، فقال نعم إلا الدين", en: "Muwatta 1328" }
text: "نَعَمْ. إلَّا الدَّيْنَ. كَذلكَ قَال لِي جِبْريلُ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن أبي سعيد المقبري عن عبد الله بن أبي قتادة عن أبيه أن رجلا جاء إلى رسول الله فقال يا رسول الله، إن قتلت في سبيل الله صابرا محتسبا مقبلا غير مدبر، أيكفر الله عني خطاياي؟ فقال رسول الله نعم، فلما أدبر الرجل ناداه رسول الله أو أمر به فنودي له، فقال كيف قلت؟ فأعاد عليه قوله، فقال نعم إلا الدين، كذلك قال لي جبريل. ويذكر المحقق أن ابن عبد البر رأى أن الحديث متصل المعنى. {cite:muwatta-maruf-1997 p.593}"
