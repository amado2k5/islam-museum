label: { ar: "الموطأ 1328 — عبد الله بن أبي قتادة عن أبيه: جاء رجل يسأل إن قتل صابرا محتسبا مقبلا غير مدبر أيكفر الله خطاياه، فقال نعم إلا الدين", en: "Muwatta 1328", es: "Muwatta 1328", fr: "Muwatta 1328", ur: "موطا 1328", tr: "El-Muvatta 1328 — Abdullah bin Abi Katada, babasının rivayetine göre: Bir adam gelip sordu: \"Bir kimse sabırla ve sevap umarak, ilerleyip geri çekilmeden öldürülürse, Allah onun günahlarını bağışlar mı?\" O şöyle buyurdu: \"Evet, borç hariç.\"", id: "Al-Muwatta 1328 — Abdullah bin Abi Qatada meriwayatkan dari ayahnya: Seorang pria datang bertanya, jika seseorang terbunuh ketika sedang bersabar dan mengharapkan pahala, maju dan tidak mundur, akankah Allah mengampuni dosa-dosanya? Beliau menjawab: Ya, kecuali hutang." }
text: "نَعَمْ. إلَّا الدَّيْنَ. كَذلكَ قَال لِي جِبْريلُ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن أبي سعيد المقبري عن عبد الله بن أبي قتادة عن أبيه أن رجلا جاء إلى رسول الله فقال يا رسول الله، إن قتلت في سبيل الله صابرا محتسبا مقبلا غير مدبر، أيكفر الله عني خطاياي؟ فقال رسول الله نعم، فلما أدبر الرجل ناداه رسول الله أو أمر به فنودي له، فقال كيف قلت؟ فأعاد عليه قوله، فقال نعم إلا الدين، كذلك قال لي جبريل. ويذكر المحقق أن ابن عبد البر رأى أن الحديث متصل المعنى. {cite:muwatta-maruf-1997 p.593}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn Abi Sa'id al-Maqburi'den, o da Abdullah ibn Abi Qatada'dan, o da babasından rivayetle, bir adamın Resulullah'ın yanına gelip, \"Ey Resulullah, eğer Allah yolunda, sabrederek, sevap arayarak, ilerleyerek ve geri çekilmeyerek öldürülürsem, Allah günahlarımı bağışlar mı?\" dediğini aktarır. Resulullah, \"Evet\" dedi. Adam arkasını döndüğünde, Resulullah onu geri çağırdı veya geri çağrılmasını emretti ve \"Ne dedin?\" diye sordu. Adam sözünü tekrarladı ve adam, \"Evet, borç hariç. Cebrail de bana aynısını söyledi\" dedi. Araştırmacı, İbn Abd al-Barr'ın bu hadisin anlam bakımından bağlantılı olduğunu düşündüğünü belirtmektedir. {cite:muwatta-maruf-1997 s.593}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn Abi Sa'id al-Maqburi, dari Abdullah ibn Abi Qatada, dari ayahnya, bahwa seorang pria datang kepada Rasulullah dan berkata, \"Wahai Rasulullah, jika aku gugur dalam perjuangan di jalan Allah, dengan sabar menanggung penderitaan dan mengharapkan pahala, maju dan tidak mundur, akankah Allah mengampuni dosa-dosaku?\" Rasulullah menjawab, \"Ya.\" Ketika pria itu berpaling, Rasulullah memanggilnya kembali, atau memerintahkan agar ia dipanggil kembali, dan berkata, \"Apa yang kau katakan?\" Beliau mengulangi pernyataannya kepadanya, dan pria itu berkata, \"Ya, kecuali hutang. Jibril mengatakan hal yang sama kepadaku.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr menganggap hadits ini saling berkaitan maknanya. {cite:muwatta-maruf-1997 p.593}"
