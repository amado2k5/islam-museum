text: "… الى عن جدى قرة المزنى انه قال كنا عند النبى فذكر عنده الحياء فقالوا يا رسول اللّه الحياء من الدين فقال رسول اللّه ان الحياء والعفاف والعي عي اللسان لا عي القلب والعمل من الايمان وانهن يزدن فى الآخرة وينقصن …"
summary:
