label: { ar: "الموطأ 714 — مالك: إبل مئة وجبت فيها صدقتان ثم هلكت إلا خمساً، يأخذ المصدق من الخمس شاتين، لأن الصدقة تجب يوم يصدق المال", en: "Muwatta 714" }
summary:
  ar: "النص الوحيد في باب العمل في صدقة عامين إذا اجتمعتا. يقول يحيى: قال مالك: الأمر عندنا في الرجل تجب عليه الصدقة وإبله مئة بعير فلا يأتيه الساعي حتى تجب عليه صدقة أخرى، فيأتيه المصدق وقد هلكت إبله إلا خمس ذود: يأخذ المصدق من الخمس ذود الصدقتين اللتين وجبتا على رب المال، شاتين في كل عام شاة، لأن الصدقة إنما تجب على رب المال يوم يُصدّق ماله، فإن هلكت ماشيته أو نمت فإنما يصدّق المصدق ما يجد يوم يصدق؛ وإن تظاهرت على رب المال صدقات غير واحدة فليس عليه أن يصدّق إلا ما وجد المصدق عنده، فإن هلكت ماشيته كلها أو صارت إلى ما لا تجب فيه الصدقة فلا صدقة عليه ولا ضمان فيما هلك ومضى من ماله. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.358}"
