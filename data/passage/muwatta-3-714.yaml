label: { ar: "الموطأ 714 — مالك: إبل مئة وجبت فيها صدقتان ثم هلكت إلا خمساً، يأخذ المصدق من الخمس شاتين، لأن الصدقة تجب يوم يصدق المال", en: "Muwatta 714", es: "Muwatta 714", fr: "Muwatta 714", ur: "موطا 714", tr: "El-Muvatta 714 — Malik: İki zekât verilmesi gereken yüz deveden beşi hariç hepsi telef oldu. Zekât toplayıcısı bu beş koyundan ikisini alır, çünkü zekât, paranın zekât verildiği gün verilir.", id: "Al-Muwatta 714 — Malik: Seratus unta yang seharusnya dikenakan zakat dua kali, kemudian semuanya mati kecuali lima ekor. Pemungut zakat mengambil dua ekor domba dari lima ekor yang mati tersebut, karena zakat wajib dibayarkan pada hari uang tersebut dizakatkan." }
summary:
  ar: "النص الوحيد في باب العمل في صدقة عامين إذا اجتمعتا. يقول يحيى: قال مالك: الأمر عندنا في الرجل تجب عليه الصدقة وإبله مئة بعير فلا يأتيه الساعي حتى تجب عليه صدقة أخرى، فيأتيه المصدق وقد هلكت إبله إلا خمس ذود: يأخذ المصدق من الخمس ذود الصدقتين اللتين وجبتا على رب المال، شاتين في كل عام شاة، لأن الصدقة إنما تجب على رب المال يوم يُصدّق ماله، فإن هلكت ماشيته أو نمت فإنما يصدّق المصدق ما يجد يوم يصدق؛ وإن تظاهرت على رب المال صدقات غير واحدة فليس عليه أن يصدّق إلا ما وجد المصدق عنده، فإن هلكت ماشيته كلها أو صارت إلى ما لا تجب فيه الصدقة فلا صدقة عليه ولا ضمان فيما هلك ومضى من ماله. ويثبت المحقق فروق النسخ، ويذكر أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.358}"
  tr: "Bölümdeki tek metin, zekâtın iki yılın çakışması durumunda uygulanmasıyla ilgilidir. Yahya şöyle der: Malik dedi ki: Bizim uygulamamız şudur: Bir kimse zekât vermekle yükümlü ise ve yüz deveye sahipse ve zekât tahsildarı, başka bir zekât vadesi gelene kadar ona gelmezse ve tahsildar, develerinin beş tanesi hariç hepsi telef olduktan sonra gelirse, tahsildar o beş deveden, mal sahibinin zekât olarak alması gereken iki zekâtı alır; her yıl iki koyun alır, çünkü zekât, mal sahibinin malının zekât edildiği gün verilir. Hayvanları telef olursa veya çoğalırsa, tahsildar sadece zekât verdiği gün bulduğu hayvanların zekâtını alır. Mal sahibinin birden fazla zekât borcu varsa, tahsildarın onda bulduğu dışında zekât vermekle yükümlü değildir. Tüm hayvanları telef olursa veya zekât verilmeyecek kadar değersizleşirse, zekât vermekle yükümlü değildir ve malından telef olup gidenlerden de sorumlu değildir. Editör, rivayetler arasındaki farklılıkları doğruluyor ve Ebu Mus'ab'ın bunu Malik'ten naklettiğini belirtiyor. {cite:muwatta-maruf-1997 s.358}"
  id: "Satu-satunya teks dalam bab ini membahas penerapan zakat untuk dua tahun ketika keduanya bertepatan. Yahya berkata: Malik berkata: Kebiasaan kami adalah jika seseorang wajib membayar zakat dan memiliki seratus unta, dan pemungut zakat tidak datang kepadanya sampai zakat berikutnya jatuh tempo, dan pemungut zakat datang kepadanya setelah unta-unta miliknya mati kecuali lima ekor, maka pemungut zakat mengambil dari lima unta tersebut dua zakat yang jatuh tempo dari pemilik harta, dua ekor domba setiap tahun, karena zakat hanya jatuh tempo dari pemilik harta pada hari hartanya dizakati. Jika ternaknya mati atau bertambah, maka pemungut zakat hanya mengambil apa yang ditemukannya pada hari ia mengambil zakat. Jika lebih dari satu zakat jatuh tempo dari pemilik harta, maka ia tidak wajib membayar zakat kecuali apa yang ditemukan pemungut zakat padanya. Jika seluruh ternaknya mati atau kondisinya memburuk sehingga zakat tidak wajib dibayarkan, maka ia tidak wajib membayar zakat, dan ia juga tidak bertanggung jawab atas harta miliknya yang telah mati dan hilang. Editor menegaskan perbedaan dalam berbagai versi dan menyebutkan bahwa Abu Mus'ab meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.358}"
