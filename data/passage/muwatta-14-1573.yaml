label: { ar: "الموطأ 1573 — ابن شهاب عن الأعرج عن أبي هريرة: شر الطعام طعام الوليمة يدعى لها الأغنياء ويترك المساكين، ومن لم يأت الدعوة فقد عصى الله ورسوله", en: "Muwatta 1573", es: "Muwatta 1573", fr: "Muwatta 1573", ur: "موطا 1573", tr: "El-Muvatta 1573 — İbn Şihab, El-A'raj'dan, o da Ebu Hurayra'dan rivayet ettiğine göre: En kötü yemek, zenginlerin davet edildiği, fakirlerin ise dışarıda bırakıldığı düğün ziyafetinin yemeğidir. Davete katılmayan, Allah'a ve Resulüne isyan etmiş olur.", id: "Al-Muwatta 1573 — Ibn Shihab, berdasarkan riwayat Al-A'raj, berdasarkan riwayat Abu Hurairah: Makanan terburuk adalah makanan pesta pernikahan yang hanya mengundang orang kaya dan tidak mengundang orang miskin. Barang siapa yang tidak menghadiri undangan tersebut, berarti ia telah durhaka kepada Allah dan Rasul-Nya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن الأعرج عن أبي هريرة أنه كان يقول شر الطعام طعام الوليمة، يدعى لها الأغنياء، ويترك المساكين، ومن لم يأت الدعوة فقد عصى الله ورسوله. {cite:muwatta-maruf-1997 p.55}"
  tr: "Malik, İbn Şihab'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle şöyle buyurduğunu aktarır: \"En kötü yemek, zenginlerin davet edildiği, fakirlerin ise dışarıda bırakıldığı düğün ziyafetinin yemeğidir. Davete katılmayan, Allah'a ve Resulüne isyan etmiş olur.\" {cite:muwatta-maruf-1997 s.55}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari al-A'raj, dari Abu Hurayrah, bahwa beliau biasa berkata: \"Makanan terburuk adalah makanan pesta pernikahan yang hanya mengundang orang kaya dan meninggalkan orang miskin. Siapa pun yang tidak menghadiri undangan tersebut telah durhaka kepada Allah dan Rasul-Nya.\" {cite:muwatta-maruf-1997 p.55}"
