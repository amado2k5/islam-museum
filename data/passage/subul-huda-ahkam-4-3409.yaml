text: "… الجيش عموماً لزمهم النفير ولحق اللوم بكل فرد ؛ أى لو تخلف. قال ابن بطال : إنما اشتد الغضب على من تخلف وإن كان الجهاد فرض كفاية لكنه فى حق الأنصار خاصة فرض عين ا لأَنهم بايعوا على ذلك، ومصداق …"
