text: "الْمُغِيرَةِ بْنِ شُعْبَةَ، كَتَبَ مُعَاوِيَةُ إِلَى الْمُغِيرَةِ بْنِ شُعْبَةَ أَىُّ شَىْءٍ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَقُولُ إِذَا سَلَّمَ مِنَ الصَّلاَةِ فَأَمْلاَهَا الْمُغِيرَةُ عَلَيْهِ وَكَتَبَ إِلَى مُعَاوِيَةَ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَىْء …"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
