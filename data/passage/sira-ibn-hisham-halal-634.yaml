text: "… مالك بن مُرَّةَ الرَّهاوي قَدْ حَدَّثني أَنَّكَ أسلمتَ مِنْ أَوَّلِ حمير، وَقَتَلْتَ الْمُشْرِكِينَ، فَأَبْشِرْ بخيرٍ، وَآمُرُكَ بحمير خَيْراً، وَلاَ تَخُونُوا، وَلاَ تَخَاذَلُوا، فَإِنَّ رسول اللّٰه وَلِفِ هو مَؤلَى غَنِئُكم وَفَقِيرِكم، وإِنَّ الصَّدَقَةَ لا تَحِلُّ لمحمدٍ، ولا لأهلِ بَيْتِهِ، إِنَّما هي …"
