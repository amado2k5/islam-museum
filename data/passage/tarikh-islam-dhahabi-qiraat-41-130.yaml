text: "… الأقراء، مُجَوِّداً، مُسْنِداً، مشارِكاً في العربيّة، مليح الخطّ، له تأليف في القراءآت سمّاه كتاب الإنماء إلَى مذاهب السَّبْعة القراء. أخذ عنه: أبو الحسن نجبة، وأبو محمد بن عُبَيْد الله، وأبو ذَرّ الخُشَنيّ. واستوطن فارس وأقرأ بها. وتُوُفّي في المحرَّم. وآخر …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 41، ص 130، يذكر قراءات القرآن، والقراء، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 41, p. 130, that mentions the readings of the Qur'an, the readers, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 41، ص 130 کا اقتباس جس میں قرآن کی قراءتیں، قراء، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 41, pág. 130, que menciona las lecturas del Corán, los lectores, los sistemas de escritura y la técnica de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
