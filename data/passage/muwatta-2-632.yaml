label: { ar: "الموطأ 632 — أبو النضر السلمي: ثلاثة من الولد يحتسبهم كانوا له جنة من النار؛ أو اثنان؟ قال: أو اثنان", en: "Muwatta 632" }
text: "لا يموت لأحد من المسلمين ثلاثة من الولد فيحتسبهم، إلا كانوا له جنة من النار"
summary:
  ar: "يرويه مالك عن محمد بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه عن أبي النضر السلمي، أن النبي أخبر أنه لا يموت لأحد من المسلمين ثلاثة من الولد فيحتسبهم إلا كانوا له جُنة من النار، فقالت امرأة عنده: أو اثنان؟ قال: أو اثنان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي، وأن إسناده ضعيف لأن أبا النضر السلمي مجهول في الصحابة والتابعين لا يُعرف إلا بهذا الخبر، على أن متن الحديث صحيح من غير هذا الوجه، ويحيل على الترمذي (1059). {cite:muwatta-maruf-1997 p.322} {cite:muwatta-maruf-1997 p.323}"
