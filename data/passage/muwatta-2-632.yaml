label: { ar: "الموطأ 632 — أبو النضر السلمي: ثلاثة من الولد يحتسبهم كانوا له جنة من النار؛ أو اثنان؟ قال: أو اثنان", en: "Muwatta 632", es: "Muwatta 632", fr: "Muwatta 632", ur: "موطا 632", tr: "El-Muvatta 632 — Ebu el-Nadr el-Sulami: Üç çocuğu (ki bunları salih sayar) cehennem ateşinden ona kalkan olur; ya da iki mi? Dedi ki: Ya da iki", id: "Al-Muwatta 632 — Abu al-Nadr al-Sulami: Tiga anak yang dianggapnya saleh akan menjadi tameng baginya dari api neraka; atau dua? Dia berkata: Atau dua" }
text: "لا يموت لأحد من المسلمين ثلاثة من الولد فيحتسبهم، إلا كانوا له جنة من النار"
summary:
  ar: "يرويه مالك عن محمد بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه عن أبي النضر السلمي، أن النبي أخبر أنه لا يموت لأحد من المسلمين ثلاثة من الولد فيحتسبهم إلا كانوا له جُنة من النار، فقالت امرأة عنده: أو اثنان؟ قال: أو اثنان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي، وأن إسناده ضعيف لأن أبا النضر السلمي مجهول في الصحابة والتابعين لا يُعرف إلا بهذا الخبر، على أن متن الحديث صحيح من غير هذا الوجه، ويحيل على الترمذي (1059). {cite:muwatta-maruf-1997 p.322} {cite:muwatta-maruf-1997 p.323}"
  id: "Malik meriwayatkan hadits ini dari Muhammad bin Abi Bakr bin Muhammad bin Amr bin Hazm, dari ayahnya, dari Abu al-Nadr al-Sulami, bahwa Nabi (shalawat dan salam kepadanya) bersabda bahwa jika seorang Muslim kehilangan tiga anak dan bersabar menanggungnya, mereka akan menjadi tameng baginya dari api neraka. Seorang wanita yang hadir bertanya, \"Atau dua?\" Beliau menjawab, \"Atau dua.\" Peneliti menyebutkan bahwa Abu Mus'ab, Suwaid, dan al-Qa'nabi meriwayatkannya dari Malik, dan sanadnya lemah karena Abu al-Nadr al-Sulami tidak dikenal di kalangan Sahabat dan Penerus; ia hanya dikenal melalui riwayat ini. Namun, teks hadits ini sahih melalui sanad lainnya, dan ia merujuk pada al-Tirmidhi (1059)."
