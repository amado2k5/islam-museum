text: "… الصلاة والسلام: المؤمنُ القويُّ خيرٌ وأحبُّ إلى اللهِ من المؤمنِ الضعيفِ، وفي كلِّ خيرٌ، احرص على ما ينفعُك، واسْتَعِنْ بالله، ولا تعجز، وَإنْ أصابك شيءٌ ؛ فلا تقل: لو أنّي فعلتُ كان كذا، ولكن قل: قدَّر الله وما شاء الله …"
