text: "… الرافضة أباطيل في أنّ عليّاً عُهد إليه. وقال ابن إسحاق: حدّثني صالح بن كَيْسان، عن الزُّهْرِيّ، عن عُبَيْد اللّٰه ابن عبدالله قال : لم يوص رسولُ اللّٰه وَلِخِ عند موته إلا بثلاثٍ : أوصى للرَّهاوِيّين بجادً مائة وَسَق، وللدارِيّين بجادً …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 5، ص 587، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
