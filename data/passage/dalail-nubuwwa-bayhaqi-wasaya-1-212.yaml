text: "… لا يمكن للباحث أن يستنبط الأحكام من أدلتها دون أن تكون له قدم راسخة بمعرفة الناسخ والمنسوخ. - ويعرف النسخ بتصريح رسول اللّٰه ولف، كقوله : كنت نهيتكم عن زيارة القبور، فزوروها، وكنت نهيتكم عن لحوم الأضاحي فوق ثلاث فكلوا …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 212، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
