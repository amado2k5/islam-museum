text: "… حَدَّثَنَا ابْنُ نُمَيْرٍ، قَالَ هِشَامٌ فَأَخْبَرَنِي أَبِي، عَنْ عَائِشَةَا ـ أَنَّ سَعْدًا، قَالَ اللَّهُمَّ إِنَّكَ تَعْلَمُ أَنَّهُ لَيْسَ أَحَدٌ أَحَبَّ إِلَىَّ أَنْ أُجَاهِدَهُمْ فِيكَ مِنْ قَوْمٍ كَذَّبُوا رَسُولَكَ وَأَخْرَجُوهُ، اللَّهُمَّ فَإِنِّي أَظُنُّ أَنَّكَ قَدْ وَضَعْتَ الْحَرْبَ بَيْنَنَا وَبَيْنَهُمْ. وَقَالَ أَبَانُ بْنُ يَزِيدَ حَدَّثَنَا هِشَامٌ عَنْ أَبِيهِ أَخْبَرَتْنِي عَائِشَةُ مِنْ قَوْمٍ كَذَّبُوا نَبِيَّكَ وَأَخْرَجُوهُ مِنْ قُرَيْشٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3901، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3901 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3901، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
