text: "… رب السموات والأرض هو الفعال لما يريد، وأنه هو القوى الشديد، ذو البأس العظيم، والحول والقوة والمشيئة التى لا مرد لها !. وقد ذكر غير واحد من المفسرين : أن القبط شكوا إلى فرعون قلة بنى إسرائيل، بسبب قتل ولدانهم …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 380، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
