text: "… معرفة ذلك كتكليفه ماليس من علمه. قال : فثبت بما ذكر أن علم التصريف مما يُحتاج إليه لئلا يغلط فى مثل ذلك. قال : ومن العجب أن يقال إنه لا يُحتاج إلى معرفة التصريف وهذا نافع بن أبى نعيم وهو …"
