text: "… بعد ما ذهب بصره، قال: هو آخر من مات من البدريين. المرعاة:، فليركع ركعتين: أمر استحباب لا وجوب خلافا للظاهرية، ركعتين يعني تحية المسجد أو ما يقوم مقامهما من صلاة فرض أو سنة في غير وقت مكروه عندنا، أو طواف …"
summary:
