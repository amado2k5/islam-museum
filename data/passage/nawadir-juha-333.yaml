label: { ar: "نوادر جحا الكبرى، ص 165 — «كيف أصعد إليك وأمدك؟»", en: "Nawadir Juha al-Kubra, p. 165 — 'How Can I Climb to You and Help You?'", ur: "نوادر جحا الکبریٰ، ص 165 — «میں تمہارے پاس کیسے چڑھوں اور تمہاری مدد کروں؟»", fr: "Nawadir Juha al-Kubra, p. 165 — « Comment puis-je monter jusqu'à toi pour t'aider ? »", es: "Nawadir Juha al-Kubra, p. 165 — «¿Cómo puedo subir hasta ti para ayudarte?»" }
text: "نوادر جحا الكبرى يتململ، فمرّ به أحد أصحابه، وقال له: لماذا أنت واقف هنا؟ فحدَّثَهُ بما كان. فضحك صاحبه وقال له: يا لكَ من أحمق، فها قد غَشَّكَ وانطلَتْ عليك الحيلة. إنها قِرابُ فأْس كان جحا في طفولتِه يلعب مَعَ …"
summary:
  ar: "سافر جحا فتىً من سيوري حصار إلى آق شهر، فنادى مؤذن في المئذنة أن يأتي ويساعده، فسأل جحا كيف يتسلق شجرة بلا أغصان ليصل إليه. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  en: "As a youth Juha travels from Siwri Hisar to Akshehir; a muezzin in the minaret calls to him to come and help; Juha asks how he can climb a tree with no branches to reach him. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  ur: "جحا جوانی میں سیوری حصار سے آق شہر جا رہا تھا کہ مینار میں سے ایک مؤذن نے اسے پکارا کہ آؤ اور مدد کرو، تو جحا نے پوچھا کہ وہ بغیر شاخوں کے درخت پر چڑھ کر اس تک کیسے پہنچے۔ {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  fr: "Dans sa jeunesse, Juha voyage de Siwri Hisar à Akshehir ; un muezzin, du haut du minaret, l'appelle pour qu'il vienne l'aider ; Juha demande comment il pourrait grimper à un arbre sans branches pour le rejoindre. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
  es: "De joven, Juha viaja de Siwri Hisar a Akshehir; un muecín desde el minarete lo llama para que venga a ayudarlo; Juha pregunta cómo podría trepar a un árbol sin ramas para llegar hasta él. {cite:juha-nawadir-kubra-djuwaydi p. 165}"
