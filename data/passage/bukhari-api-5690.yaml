label: { ar: "صحيح البخاري 5690 — التلبينة", en: "Sahih al-Bukhari 5690 — talbina (barley gruel)", ur: "صحیح بخاری 5690 — تلبینہ", es: "Sahih al-Bukhari 5690 - talbina (gachas de cebada)", fr: "Sahih al-Bukhari 5690 — Talbina (bouillie d'orge)" }
text: "حَدَّثَنَا فَرْوَةُ بْنُ أَبِي الْمَغْرَاءِ، حَدَّثَنَا عَلِيُّ بْنُ مُسْهِرٍ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّهَا كَانَتْ تَأْمُرُ بِالتَّلْبِينَةِ وَتَقُولُ هُوَ الْبَغِيضُ النَّافِعُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5690، يذكر التلبينة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5690 (Medicine), that mentions talbina (barley gruel). The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5690، جس میں تلبینہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 5690 (Medicina), menciona la talbina (gachas de cebada). El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5690 (Médecine), mentionne la talbina (bouillie d'orge). Le navigateur de ressources médicales la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
