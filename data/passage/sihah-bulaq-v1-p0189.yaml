text: |-
  قوله أبو دراس بكسر الدال من
  أسماء الحيض خلاذالمن قال
  أدراسَ بالجمع ومنه قول
  المستقى من الامام الشافعى
  نسى أبودراس درسه كمافى
  ٤٥٢
  الدخس ورم يكون فى اطرة حافر الدابة والدخيس الحوشب وهوه وصل فى رس-غ الداية
  والدخيس اللحم المكننز وكل ذى سمن دخيس والدخيس من انقاء الرمل الكثير
  والدخيس العدد الجم يقال ع_دددخاس ونعم دخاس أى كثيرة ودرع دخاس أى متقاربة
  الحلق والدخس مثال الصردداية فى البحر ينجى الغريق يمكنه من ظهره ليستعين على
  السباحة ويسمى الدافين ⁦(درس)⁩ درس الرسم يدرس دروسا أى عفا ودرسة
  الريح يتعدّى ولا يتعدّى ودرست الكتاب درساؤدراسة ودرست المرأة دروسا أى حاضت
  وأبودراس فرج المرأة ودرسوا الحنطة دراسا أى داسوها قال ابن مبادة
  هلا اشتريت حفطة بالرستاق * سمراء مادرس ابن مخراق
  ويقال سمى ادريس عليه السلام لكثرة دراسته كتاب اللّٰه تعالى واسمه أخنوخ والدرس
  جرب قليل يبقى فى البعير قال العجاج من عرق النضح عصيم الدرس والدرس أيضا
  الطريق الخفى ودارست الكتب وتدارستها وادّارستها أى درستها والدرس بالمكسر الدريس
  وهو الثوب اظلق والجمع درسان وقد درس الثوب درسا أى أخلق وحكى الاصمعى بعير
  لم يدرس أى لم يركب والدرواس الغليظ العنق من الناس والكلاب وه والعظيم أيضا
  وقال الفرّاء الدرواس العظام من الابل رهس الدراهس الشديد درديس)
  الدردبيس الداهية والشيخ الهم والعجوز واسم خرزة وتدربس أى تقدم قال الشاءر
  اذا القوم قالوا من فق لمهمة * تدريس ما فى الريق فجم المناكب
  ( درفس الدرفس من الابل العظيم وفاقة درفسة قال الراجز درفسة أوبازل درفس
  والدرقاس مثله ( ردقس الدرداقس بالقاف عظيم يفصل بين الرأس والعنق
  ( دسس، دس البعيرفهومدسوس اذا طلى بالهناء فى مساعره قال ذوالرمة
  تبين برّاق السراة كانه • قريع هجان دس منه المساعر
  ومنه المثل ليس الهناء بالدس ودسست الشئء فى التراب أدسه أخفيته فيه والدسيس اخفاء
  المكر والدساسة حية صماه تندس تحت التراب اندساسا أى تندفن والدسة لعبة لصبيان
  الاعراب دعس الدعس بالفتح الاثر يقال رأيت طر يقاد عسا أى كثيرالا ثار
  والمدعاس الطريق الذى ابنته المارة قال الراجز فى رسم آثارومدعاس دعق والدعس
  الطعن وقديكى به عن الجماع ودعست الوعاء حشوته والمداعسة المطاعنة والمدعس الرع
  يدعس به ويقسال المداعس الصم من الرماح حكاه أبو عبيد والمدعس مختبز الة وم فى البادية
  وحيث نوضع الملة ويشوى اللحم وهو مفتعل من الدعس وهو الحشوقال أبو ذؤيب
  ومدعس فيه الانيض اختفيته * بجرداء ينتاب النميل خارها
  يقول رب مختبز جعلت فيه اللحم ثم استخرحته قبل أن ينه بج للعجلة وانلحوف لانه فى ستهر
  (دعكس الدعكسة لعب للمجوس يسمونه الدستبند (دننس لدفنس بالمكسر
  الجقاء وأنشد أبوعمروبن العلاء
  وقد أختلس الضرية لايدمى لها فصلى • كجيب الدفنس الورها ريعت وهى تستقلى
  والدفاس
