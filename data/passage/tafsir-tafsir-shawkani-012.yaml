text: "ضلها أحاديث. منها ما أخرجه سعيد بن منصور في سننه وابن خزيمة في كتاب البسملة والبيهقي عن ابن عباس قال: استرق الشيطان من الناس أعظم آية من القرآن: بسم الله الرحمن الرحيم. وأخرج نحوه أبو عبيد، وأبن مردويه، والبيهقي في"
