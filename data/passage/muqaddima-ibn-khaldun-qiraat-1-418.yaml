text: "… الأمصار إلى أن رفع رايتها ببغداد علي بن مقلة الوزير، ثم تلاه في ذلك علي بن هلال، الكاتب الشهير بابن البواب. ووقف سنَد تعليمها عليه في المائة الثالثة وما بعدها، وبعدت رسوم الخط البغدادي وأوضاعه عن الكوفة، حتى انتهى إلى …"
