text: "م امتناع إلا بحصونهم وتفرقهم أحزابا على الحيين إذا اشتجرا. وفي كتاب ابن إسحاق: إن تبعا أبا كرب غزا المشرق فمر بالمدينة وخلف بين أظهرهم ابنا له فقتل غيلة، فلما رجع أجمع على تخريبها واستئصال أهلها، فجمع له هذا الحي"
