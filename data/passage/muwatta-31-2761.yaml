label: { ar: "الموطأ 2761 — النفر الثلاثة في المسجد: أوى إلى الله فآواه الله واستحيا فاستحيا الله وأعرض فأعرض الله", en: "Muwatta 2761" }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن أبي مرة مولى عقيل بن أبي طالب عن أبي واقد الليثي أن رسول الله كان جالسا في المسجد والناس معه، إذ أقبل نفر ثلاثة، فأقبل اثنان إلى رسول الله وذهب واحد، فلما وقفا سلما، فأما أحدهما فرأى فرجة في الحلقة فجلس فيها، وأما الآخر فجلس خلفهم، وأما الثالث فأدبر ذاهبا. فلما فرغ قال: أما أحدهم فأوى إلى الله فآواه الله، وأما الآخر فاستحيا فاستحيا الله منه، وأما الآخر فأعرض فأعرض الله عنه. {cite:muwatta-maruf-1997 p.550} {cite:muwatta-maruf-1997 p.551}"
