label: { ar: "الموطأ 2761 — النفر الثلاثة في المسجد: أوى إلى الله فآواه الله واستحيا فاستحيا الله وأعرض فأعرض الله", en: "Muwatta 2761", es: "Muwatta 2761", fr: "Muwatta 2761", ur: "موطا 2761", tr: "El-Muvatta 2761 — Mescitteki üç adam: O, Allah'a sığındı, Allah onu korudu; o utandı, Allah da utandı; o yüz çevirdi, Allah da yüz çevirdi.", id: "Al-Muwatta 2761 — Tiga orang di masjid: Dia berlindung kepada Allah, lalu Allah melindunginya; dia merasa malu, lalu Allah merasa malu; dia berpaling, lalu Allah berpaling." }
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة عن أبي مرة مولى عقيل بن أبي طالب عن أبي واقد الليثي أن رسول الله كان جالسا في المسجد والناس معه، إذ أقبل نفر ثلاثة، فأقبل اثنان إلى رسول الله وذهب واحد، فلما وقفا سلما، فأما أحدهما فرأى فرجة في الحلقة فجلس فيها، وأما الآخر فجلس خلفهم، وأما الثالث فأدبر ذاهبا. فلما فرغ قال: أما أحدهم فأوى إلى الله فآواه الله، وأما الآخر فاستحيا فاستحيا الله منه، وأما الآخر فأعرض فأعرض الله عنه. {cite:muwatta-maruf-1997 p.550} {cite:muwatta-maruf-1997 p.551}"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan, o da Akil ibn Abi Talib'in azatlı kölesi Ebu Murra'dan, o da Ebu Vakid el-Layti'den rivayet ettiğine göre, Allah Resulü mescitte, etrafındaki insanlarla birlikte otururken, üç adam yaklaştı. İkisi Allah Resulü'ne geldi, biri ise uzaklaştı. Ayağa kalkıp selam verdiklerinde, içlerinden biri çemberde bir boşluk gördü ve oraya oturdu, diğeri onların arkasına oturdu, üçüncüsü ise arkasını dönüp gitti. Anlatısını bitirdiğinde şöyle dedi: “Onlardan biri Allah'a sığındı, Allah da ona sığınma verdi. Diğeri utandı, Allah da ondan utandı. Üçüncüsü ise yüzünü çevirdi, Allah da ondan yüzünü çevirdi.”"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha, dari Abu Murra, budak yang dibebaskan oleh Aqil ibn Abi Talib, dari Abu Waqid al-Laythi, bahwa Rasulullah SAW sedang duduk di masjid bersama orang-orang di sekitarnya ketika tiga orang mendekat. Dua di antara mereka datang kepada Rasulullah SAW, sedangkan satu orang pergi. Ketika mereka berdiri dan memberi salam kepadanya, salah seorang dari mereka melihat celah di lingkaran itu dan duduk di sana, yang lain duduk di belakang mereka, dan yang ketiga berpaling dan pergi. Setelah selesai, beliau berkata: “Adapun salah seorang dari mereka, ia memohon perlindungan kepada Allah, maka Allah mengabulkannya. Adapun yang lain, ia merasa malu, maka Allah malu kepadanya. Adapun yang ketiga, ia berpaling, maka Allah berpaling darinya.”"
