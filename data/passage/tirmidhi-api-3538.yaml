label: { ar: "جامع الترمذي 3538 — الأب والأبوة", en: "Jami' al-Tirmidhi 3538 — the father and fatherhood", ur: "جامع ترمذی 3538 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3538 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3538 — le père et la paternité", tr: "Cami' el-Tirmizi 3538 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3538 — Ayah dan Peran Ayah" }
text: "… أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" لَلَّهُ أَفْرَحُ بِتَوْبَةِ أَحَدِكُمْ مِنْ أَحَدِكُمْ بِضَالَّتِهِ إِذَا وَجَدَهَا \". قَالَ وَفِي الْبَابِ عَنِ ابْنِ مَسْعُودٍ وَالنُّعْمَانِ بْنِ بَشِيرٍ وَأَنَسٍ. قَالَ وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ مِنْ حَدِيثِ أَبِي الزِّنَادِ. وَقَدْ رُوِيَ هَذَا الْحَدِيثُ عَنْ مَكْحُولٍ بِإِسْنَادٍ لَهُ عَنْ أَبِي ذَرٍّ عَنِ النَّبِيِّ نَحْوَ هَذَا."
summary:
  ar: "حديث في جامع الترمذي، رقم 3538، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3538 (Chapters on Supplication), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3538، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3538 (Capítulos sobre la súplica), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3538 (Chapitres sur l'invocation), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de yer alan 3538 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3538, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
