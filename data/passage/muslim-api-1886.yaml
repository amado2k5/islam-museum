label: { ar: "صحيح مسلم 1886 — عمل يعدل عملا أعظم منه", en: "Sahih Muslim 1886 — a deed that equals a greater one", ur: "صحیح مسلم 1886 — ایک عمل جو بڑے عمل کے برابر ہے", es: "Sahih Muslim 1886 — una acción que equivale a una mayor", fr: "Sahih Muslim 1886 — un acte qui en vaut un plus grand", tr: "Sahih Muslim 1886 — Daha büyük bir eyleme denk olan bir eylem", id: "Sahih Muslim 1886 — Suatu perbuatan yang setara dengan perbuatan yang lebih besar" }
text: "… بَشَّارٍ، قَالَ زُهَيْرٌ حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ شُعْبَةَ، عَنْ قَتَادَةَ، عَنْ سَالِمِ بْنِ أَبِي الْجَعْدِ، عَنْ مَعْدَانَ بْنِ أَبِي طَلْحَةَ، عَنْ أَبِي الدَّرْدَاءِ، عَنِ النَّبِيِّ قَالَ \" أَيَعْجِزُ أَحَدُكُمْ أَنْ يَقْرَأَ فِي لَيْلَةٍ ثُلُثَ الْقُرْآنِ \" قَالُوا : وَكَيْفَ يَقْرَأْ ثُلُثَ الْقُرْآنِ ؟ قَالَ : \" قُلْ هُوَ اللَّهُ أَحَدٌ تَعْدِلُ ثُلُثَ الْقُرْآنِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 1886، يذكر عمل يعدل عملا أعظم منه. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 1886 (The Book of Prayer - Travellers), that speaks of a deed that equals a greater one. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 1886، جس میں ایک عمل جو بڑے عمل کے برابر ہے کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 1886 (El Libro de la Oración - Viajeros), habla de una acción que equivale a otra mayor. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim n° 1886 (Le Livre de la prière – Guide du voyageur) évoque un acte qui en vaut un autre, plus grand encore. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui dénombrent, inscrivent, effacent ou évaluent un acte."
  tr: "Sahih Müslim'de 1886 numaralı hadis, daha büyük bir ameli sayan bir ameli zikrediyor. Bu hadis, iyi ve kötü ameller listeleriyle birlikte, amelin değerini sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 1886, menyebutkan suatu amalan yang setara dengan amalan yang lebih besar. Amalan ini dikelompokkan bersama daftar amalan baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang amalan tersebut."
