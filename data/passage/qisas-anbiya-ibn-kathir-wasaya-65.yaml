text: "… لما قتله حمله على ظهره سنة، وقال آخرون حمله مائة سنة ! ولم يزل كذلك حتى بعث الله غرابين. قال السدى بإسناده عن الصحابة : أخوين، فتقاتلا فقتل أحدهما الآخر، فلما قتله. عمد إلى الارض يحفر له فيها ثم ألقاه …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 65، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 65, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 65 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Qisas al-Anbiya' de Ibn Kathir, pág. 65, que menciona un entierro, tumba o lugar de descanso; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Qisas al-Anbiya' d'Ibn Kathir, p. 65, mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 65. sayfasından bir alıntı, defin, mezar ve türbeden bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, \"Vasiyetler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 65, menyebutkan penguburan, kuburan, dan tempat suci; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Suci\"."
