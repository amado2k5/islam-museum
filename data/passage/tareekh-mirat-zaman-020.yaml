text: "فلحق ببعض ملوك بني المنذر، ويقال: هو عمرو بن هند، فسأله أن يكتب له كتابا إلى كسرى يعرفه شرفه ومكانته، فقال له: أقم عندي، فلي في كل سنة وفادة على كسرى. وذكر بمعنى ما تقدم، وأن كسرى قال له: أقم"
