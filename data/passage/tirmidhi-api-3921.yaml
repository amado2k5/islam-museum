label: { ar: "جامع الترمذي 3921 — الحرام", en: "Jami' al-Tirmidhi 3921 — the unlawful", ur: "جامع ترمذی 3921 — حرام", es: "Jami' al-Tirmidhi 3921 — el ilícito", fr: "Jami' al-Tirmidhi 3921 — l'illicite", tr: "Cami' el-Tirmizi 3921 - El-Haram", id: "Jami' al-Tirmidzi 3921 — Al-Haram" }
text: "… شِهَابٍ، عَنْ سَعِيدِ بْنِ الْمُسَيِّبِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّهُ كَانَ يَقُولُ لَوْ رَأَيْتُ الظِّبَاءَ تَرْتَعُ بِالْمَدِينَةِ مَا ذَعَرْتُهَا إِنَّ رَسُولَ اللَّهِ قَالَ \" مَا بَيْنَ لاَبَتَيْهَا حَرَامٌ \". وَفِي الْبَابِ عَنْ سَعْدٍ وَعَبْدِ اللَّهِ بْنِ زَيْدٍ وَأَنَسٍ وَأَبِي أَيُّوبَ وَزَيْدِ بْنِ ثَابِتٍ وَرَافِعِ بْنِ خَدِيجٍ وَسَهْلِ بْنِ حُنَيْفٍ وَجَابِرٍ. حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3921، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3921 (Chapters on Virtues), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3921، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3921 (Capítulos sobre las virtudes), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3921 (Chapitres sur les vertus), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Cami' el-Tirmizi'de 3921 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve haram bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3921, menyebutkan apa yang dilarang. Bagian halal dan haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
