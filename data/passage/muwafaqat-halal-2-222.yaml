text: "… مكان خاص وعدم نيل شيء منها فظاهر أنه ليس من إتلاف الإنسان للمال. وكان تحريمها عليهم لحكمة تخليص نفوسهم من قصد الغنائم بالجهاد. وقد رخص فيها في شرعنا خاصة كما في الحديث: ولم تحلّ لأحد قبلي. وقصة : فطفق مسحاً …"
summary:
