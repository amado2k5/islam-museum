  ur: "\"الاستغفار - ابن عبد البر\" کا ایک اقتباس جس میں خط و کتابت، خط، خط یا سیاق و سباق میں جواب کی رپورٹ شامل ہے۔ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "İbn Abdülbarr'ın \"Al-Istidhkar\" adlı eserinden bir alıntı, yazışmalar, bir kitap, bir mektup veya bir cevaba ilişkin haberleri bağlam içinde içerir; metin, kaynakların politikasına göre yaklaşık kırk kelimeyle alıntılanır."
