text: "ستذكار الجامع لمذاهب فقهاء الأمصار ٤٢٢- قال أبو عمر: كل ما في كتابنا هذا [من أوله إلى آخره](١) عن أبي بكر بن أبي شيبة، ليس من المسند فيه هذا الإسناد. وقال أحمد بن حنبل: لا يقصر إلا في حج، أو"
