text: "… نتطهَّرُ ثم ننقض الوضوء قالت له امرأته: إنَّ إبريقَ الوضوءِ قد ثُقِبَ من أسفله، وأصبح الماءُ لا يمكُثُ فيه طويلاً، فماذا نصنع؟ فأجاب الشيخ: هذا لا طريقةَ له أبداً، إلَّا أننا كُنَّا ننقضُ وضوءَنا ونتطهَّر، والآن نملأُ الإبريق، ونتطهَّرُ ثم …"
summary:
  ar: "كان إبريق الوضوء مثقوبًا، فسألت زوجة جحا ماذا تفعل، فقال إن عليهما أن يملآه ويتوضآ ثم ينقضا وضوءهما كما كانا من قبل. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  en: "The ewer for ablution has a hole; Juha's wife asks what to do; he says they must fill it, wash, and then break their ablution, as before. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  ur: "وضو کے لوٹے میں سوراخ تھا؛ جحا کی بیوی نے پوچھا کہ کیا کریں؛ اس نے کہا کہ اسے بھر لیں، وضو کریں اور پھر پہلے کی طرح وضو توڑ دیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  fr: "L'aiguière des ablutions est percée; la femme de Juha demande que faire; il dit qu'il faut la remplir, se laver, puis rompre l'ablution, comme avant. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
  es: "La jarra de la ablución tiene un agujero; la mujer de Juha pregunta qué hacer; él dice que hay que llenarla, lavarse y luego romper la ablución, como antes. {cite:juha-nawadir-kubra-djuwaydi p. 64}"
