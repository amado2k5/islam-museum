text: "… وتعالى سيقتله - هو كَبْش الكتيبة. ويُقال حمل عليه طَلحة، فاتَّقاه عَلىٌّ بالدَّرَقَة فلم يصنع سيفه شيئاً. وحمل عليه عَلىٌّ، وعلى طَلحة دِرْع مُشمَّرة، فضرب ساقَيه فقطع رجلَيه، ثم أَراد أَن يُذفِّف عليه، فسأَله بالرحِم فتركه عَلىَّ فلم يذفّف عليه، …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 226، يذكر ما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 226, that mentions what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
