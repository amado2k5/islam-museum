summary:
  ar: "القسم 34 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الدعاء»، ويضم فيها النصوص من 3827 إلى 3892 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 34 of Sunan Ibn Majah (Supplication) in the division of the open hadith dataset the museum took its reports from: reports 3827 to 3892 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 34، عنوان «کتاب الدعاء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3827 تا 3892۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 34 de Sunan Ibn Majah (Súplica) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 3827 a 3892 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 34 du Sunan Ibn Majah (Supplication), correspondant aux hadiths 3827 à 3892 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan İbn Majah'ın 34. bölümü \"Dua Kitabı\" başlığını taşımakta olup, 3827 ile 3892 arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 34 dari Sunan Ibn Majah, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Doa\" dan berisi teks 3827 hingga 3892, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
