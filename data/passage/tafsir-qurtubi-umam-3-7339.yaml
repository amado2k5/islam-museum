text: "… مع المؤمنين باستهزائهم بهم، والمراد رؤساء قريش من أهل الشرك. روى ناس عن أبن عباس قال : هو الوليد بن المخيرة، وعُقْبة بن أبي مُعَيْط، والعاص بن وائل، والأسود بن عبد يغوث، والعاص بن هشام، وأبو جهل، والنضر بن الحارث؛ …"
