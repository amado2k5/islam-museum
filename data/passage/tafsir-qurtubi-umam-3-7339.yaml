text: "… مع المؤمنين باستهزائهم بهم، والمراد رؤساء قريش من أهل الشرك. روى ناس عن أبن عباس قال : هو الوليد بن المخيرة، وعُقْبة بن أبي مُعَيْط، والعاص بن وائل، والأسود بن عبد يغوث، والعاص بن هشام، وأبو جهل، والنضر بن الحارث؛ …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 7339، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 7339, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 7339 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
