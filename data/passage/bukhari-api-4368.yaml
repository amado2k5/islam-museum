label: { ar: "صحيح البخاري 4368 — الصلاة والزكاة والصوم والحج مجتمعة، الشهادة والصلاة والزكاة", en: "Sahih al-Bukhari 4368 — the prayer, the zakat, the fast and the pilgrimage named together; the testimony, the prayer and the zakat", ur: "صحیح بخاری 4368 — نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ", es: "Sahih al-Bukhari 4368 — la oración, el zakat, el ayuno y la peregrinación nombrados juntos; el testimonio, la oración y el zakat", fr: "Sahih al-Bukhari 4368 — la prière, la zakat, le jeûne et le pèlerinage mentionnés ensemble; le témoignage, la prière et la zakat" }
text: "… حَدِّثْنَا بِجُمَلٍ مِنَ الأَمْرِ، إِنْ عَمِلْنَا بِهِ دَخَلْنَا الْجَنَّةَ، وَنَدْعُو بِهِ مَنْ وَرَاءَنَا. قَالَ \" آمُرُكُمْ بِأَرْبَعٍ، وَأَنْهَاكُمْ عَنْ أَرْبَعٍ، الإِيمَانِ بِاللَّهِ، هَلْ تَدْرُونَ مَا الإِيمَانُ بِاللَّهِ شَهَادَةُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ، وَإِقَامُ الصَّلاَةِ، وَإِيتَاءُ الزَّكَاةِ وَصَوْمُ رَمَضَانَ، وَأَنْ تُعْطُوا مِنَ الْمَغَانِمِ الْخُمُسَ، وَأَنْهَاكُمْ عَنْ أَرْبَعٍ مَا انْتُبِذَ فِي الدُّبَّاءِ، وَالنَّقِيرِ، وَالْحَنْتَمِ، وَالْمُزَفَّتِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4368، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة، وركن من أركان الإيمان. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 4368 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat, one of the articles of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 4368، جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 4368 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), que menciona la oración, el zakat, el ayuno y la peregrinación, nombrados conjuntamente, el testimonio, la oración y el zakat, uno de los artículos de fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y los rasgos del creyente."
  fr: "Un hadith du Sahih al-Bukhari, n° 4368 (Expéditions militaires du Prophète (Al-Maghazi)), mentionne la prière, la zakat, le jeûne et le pèlerinage, cités ensemble, ainsi que le témoignage, la prière et la zakat, comme l'un des piliers de la foi. Le moteur de recherche « Piliers et branches de la foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
