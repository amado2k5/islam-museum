label: { ar: "الموطأ 488 — ابن عمر يغتسل يوم الفطر قبل أن يغدو إلى المصلى", en: "Muwatta 488" }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يغتسل يوم الفطر قبل أن يغدو إلى المصلى؛ وهو في باب العمل في غسل العيدين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ويحيى بن بكير. {cite:muwatta-maruf-1997 p.250}"
