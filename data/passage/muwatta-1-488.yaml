label: { ar: "الموطأ 488 — ابن عمر يغتسل يوم الفطر قبل أن يغدو إلى المصلى", en: "Muwatta 488", es: "Muwatta 488", fr: "Muwatta 488", ur: "موطا 488", tr: "El-Muvatta 488 — İbn Ömer, Ramazan Bayramı günü namaz kılınacak yere gitmeden önce gusül abdesti alıyor.", id: "Al-Muwatta 488 — Ibnu Umar melakukan ghusl (mandi ritual) pada hari raya Idul Fitri sebelum pergi ke tempat shalat." }
summary:
  ar: "أثر يرويه مالك عن نافع أن عبد الله بن عمر كان يغتسل يوم الفطر قبل أن يغدو إلى المصلى؛ وهو في باب العمل في غسل العيدين. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ويحيى بن بكير. {cite:muwatta-maruf-1997 p.250}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, Abdullah ibn Umar'ın Ramazan Bayramı günü namaz kılınacak yere gitmeden önce gusül abdesti aldığı belirtilmektedir; bu, iki bayram için yapılan gusül abdesti bölümünde yer almaktadır. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suwaid, Abd al-Razzaq, el-Şafiî ve Yahya ibn Bukayr tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.250}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’ menyatakan bahwa Abdullah ibn Umar biasa melakukan ghusl (mandi ritual) pada hari raya Idul Fitri sebelum pergi ke tempat shalat; hal ini terdapat dalam bab tentang mandi ritual untuk dua hari raya. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, al-Shafi’i, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.250}"
