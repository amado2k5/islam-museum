text: "… الجنة، فليس لهم أن يرجِعُوا فيما تركوه للَّه، بل أبلغُ من ذلك أنه لم يُرخّض للمهاجر أن يُقيم بمكة بعد نُسُكِه أكثرَ مِن ثلاثٍ البخاري:، ومسلم:، لأنه قد ترك بلده لله، وهاجر منه، فليس له أن يعودَ يستوطِنُه، ولهذا رثى …"
summary:
  ar: "مقطع من زاد المعاد في هدي خير العباد، المجلد المصوَّر 1، ص 366، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Zad al-Ma'ad fi Hady Khayr al-Ibad, scan volume 1, p. 366, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "زاد المعاد فی حدی خیر العباد، اسکین جلد 1، ص 366 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Zad al-Ma'ad fi Hady Khayr al-Ibad, volume numérisé 1, p. 366, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
