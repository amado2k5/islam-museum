  tr: "Zad al-Ma'ad fi Hadyi Khayr al-'Ibad, Resimli Cilt 1, sayfa 366'dan, merhum için ağıt ve övgü içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
