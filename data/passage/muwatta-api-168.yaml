label: { ar: "موطأ مالك 168 — تربية الأب ووصيته", en: "Muwatta Malik 168 — the father raising and counselling", ur: "موطأ مالک 168 — باپ کی تربیت اور نصیحت", es: "Muwatta Malik 168 — el padre que cría y aconseja" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ أَبِي نُعَيْمٍ، وَهْبِ بْنِ كَيْسَانَ عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّهُ كَانَ يُعَلِّمُهُمُ التَّكْبِيرَ فِي الصَّلاَةِ. قَالَ فَكَانَ يَأْمُرُنَا أَنْ نُكَبِّرَ كُلَّمَا خَفَضْنَا وَرَفَعْنَا."
summary:
  ar: "حديث في موطأ مالك، رقم 168، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 168 (Prayer), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 168، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 168 (Oración), menciona la crianza y el consejo paterno. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
