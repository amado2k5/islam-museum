label: { ar: "الموطأ 2240 — مالك عن نافع عن عبد الله بن عمر: قال رسول الله من أعتق شركا له في عبد، وكان له مال يبلغ ثمن العبد، قوم عليه قيمة العدل، فأعطى شركاءه حصصهم، وعتق عليه العبد، وإلا فقد عتق منه ما عتق", en: "Muwatta 2240", es: "Muwatta 2240", fr: "Muwatta 2240", ur: "موطا 2240", tr: "El-Muvatta 2240 — Malik, Nafi’den, Abdullah ibn Umar’dan rivayetle: Allah Resulü şöyle buyurdu: “Kim bir köledeki payını azat eder ve kölenin bedeline denk malı varsa, kölenin değeri adil bir şekilde değerlendirilir, ortaklarına paylarını verir ve köle azat edilir. Aksi takdirde, sadece azat edilen kısmı azat edilir.”", id: "Al-Muwatta 2240 — Malik, dari Nafi’, dari Abdullah ibn Umar: Rasulullah SAW bersabda: Barang siapa membebaskan bagiannya dalam seorang budak, dan mempunyai harta yang setara dengan harga budak tersebut, maka nilai budak itu dinilai secara adil, dan ia memberikan bagiannya kepada para mitranya, dan budak itu dibebaskan. Jika tidak, maka hanya bagian yang dibebaskan saja yang dibebaskan." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: من أعتق شركا له في عبد، فكان له مال يبلغ ثمن العبد، قوم عليه قيمة العدل، فأعطى شركاءه حصصهم، وعتق عليه العبد، وإلا فقد عتق منه ما عتق. {cite:muwatta-maruf-1997 p.323}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Kim bir köledeki payını azat eder ve kölenin bedeline denk bir malı varsa, kölenin değeri adil bir şekilde değerlendirilir, ortaklarına payları verilir ve köle azat edilir. Aksi takdirde, sadece azat edilen kısmı azat edilir.\" {cite:muwatta-maruf-1997 s.323}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa Rasulullah SAW bersabda: “Barang siapa membebaskan bagiannya dalam seorang budak, dan mempunyai harta yang setara dengan harga budak tersebut, maka nilai budak itu harus dinilai secara adil, dan para mitranya harus diberikan bagian mereka, dan budak itu akan dibebaskan. Jika tidak, maka hanya bagian yang dibebaskan saja yang akan dibebaskan.” {cite:muwatta-maruf-1997 p.323}"
