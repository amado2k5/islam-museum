label: { ar: "الموطأ 2240 — مالك عن نافع عن عبد الله بن عمر: قال رسول الله من أعتق شركا له في عبد، وكان له مال يبلغ ثمن العبد، قوم عليه قيمة العدل، فأعطى شركاءه حصصهم، وعتق عليه العبد، وإلا فقد عتق منه ما عتق", en: "Muwatta 2240" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رسول الله قال: من أعتق شركا له في عبد، فكان له مال يبلغ ثمن العبد، قوم عليه قيمة العدل، فأعطى شركاءه حصصهم، وعتق عليه العبد، وإلا فقد عتق منه ما عتق. {cite:muwatta-maruf-1997 p.323}"
