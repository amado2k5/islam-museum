text: "كتاب من اليهود والنصارى بأنه قد أرسل إليهم رسوله محمدا خاتم النبيين الذي لا نبي بعده ولا رسول. بل هو المعقب لجميعهم، ولهذا قال تعالى: ⁦(على فترة من الرسل)⁩ [المائدة: ١٩] أي بعد مدة متطاولة، ما بين إرساله وعيسى بن مريم. وقد"
summary:
  ar: "مقطع من المواهب اللدنية للقبول، في مراسلات كسرى، من النسخة المستخرجة؛ النص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Qastallani's al-Mawahib al-Laduniyya, in the correspondence with Chosroes, from the extracted copy; quoted within forty words per the sources policy."
