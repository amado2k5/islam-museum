  fr: "Un extrait de l'ouvrage d'al-Qastallani, al-Mawahib al-Laduniyya, dans la correspondance avec Chosroes, tiré de la copie extraite; cité en quarante mots conformément à la politique des sources."
  ur: "قسطلانی کی المواہب الدونیہ سے ایک اقتباس، چوسرو کے ساتھ خط و کتابت میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "Khosrow'un yazışmalarında kabul edilmek üzere sunulan \"İlahi Armağanlar\" kitabından bir alıntı; kaynakların politikasına göre metin yaklaşık kırk kelimeyle aktarılmıştır."
  id: "Kutipan dari buku \"Karunia Ilahi\" untuk diterima, dalam korespondensi Khosrow, dari versi yang diekstrak; teks dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber."
