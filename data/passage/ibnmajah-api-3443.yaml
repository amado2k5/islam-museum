label: { ar: "سنن ابن ماجه 3443 — أسماء الأمراض", en: "Sunan Ibn Majah 3443 — named diseases", ur: "سنن ابن ماجہ 3443 — بیماریوں کے نام", es: "Sunan Ibn Majah 3443 - enfermedades nombradas", fr: "Sunan Ibn Majah 3443 — maladies nommées", tr: "Sünen İbn Mace 3443 — Hastalık İsimleri", id: "Sunan Ibnu Majah 3443 — Nama-nama Penyakit" }
text: "… عَنْ عَبْدِ الْحَمِيدِ بْنِ صَيْفِيٍّ، - مِنْ وَلَدِ صُهَيْبٍ - عَنْ أَبِيهِ، عَنْ جَدِّهِ، صُهَيْبٍ قَالَ قَدِمْتُ عَلَى النَّبِيِّ ـ وَبَيْنَ يَدَيْهِ خُبْزٌ وَتَمْرٌ فَقَالَ النَّبِيُّ ـ \" ادْنُ فَكُلْ \". فَأَخَذْتُ آكُلُ مِنَ التَّمْرِ فَقَالَ النَّبِيُّ ـ \" تَأْكُلُ تَمْرًا وَبِكَ رَمَدٌ \". قَالَ فَقُلْتُ إِنِّي أَمْضُغُ مِنْ نَاحِيَةٍ أُخْرَى. فَتَبَسَّمَ رَسُولُ اللَّهِ ـ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3443، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3443 (Chapters on Medicine), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3443، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Ibn Majah, n.° 3443 (Capítulos sobre Medicina), menciona enfermedades específicas. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Sunan Ibn Majah, n° 3443 (Chapitres sur la médecine), mentionne des maladies nommées. Le navigateur de textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Sünen'inde yer alan 3443 numaralı hadiste hastalıkların isimleri geçmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 3443, menyebutkan nama-nama penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
