label: { ar: "الموطأ 237 — ابن عمر يجلس على صدور قدميه بين السجدتين لشكواه", en: "Muwatta 237", es: "Muwatta 237", fr: "Muwatta 237", ur: "موطا 237", tr: "El-Muvatta 237 — İbn Ömer, rahatsızlığı nedeniyle iki secde arasında ayak parmaklarının ucunda oturur.", id: "Al-Muwatta 237 — Ibnu Umar duduk di atas ujung kakinya di antara kedua sujud karena sakitnya" }
text: "إنها ليست سنة الصلاة، وإنما أفعل هذا من أجل أني أشتكي"
summary:
  ar: "أثر يرويه مالك عن صدقة بن يسار عن المغيرة بن حكيم، في باب العمل في الجلوس في الصلاة: رأى عبد الله بن عمر يجلس بين السجدتين على صدور قدميه، فلما انصرف ذكر له ذلك، فأخبره أنها ليست سنة الصلاة وإنما يفعله لأنه يشتكي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق ومحمد بن الحسن، وأنه ليس لصدقة بن يسار في الموطأ غير هذا الحديث، ويحيل على التمهيد (16/271). {cite:muwatta-maruf-1997 p.143}"
  tr: "Malik'in, Sadaqah ibn Yasar'dan, o da el-Mughirah ibn Hakim'den rivayet ettiği, namazda oturmanın doğru şekli bölümündeki bir hadiste şöyle bir rivayet vardır: Abdullah ibn Umar, birinin iki secde arasında ayak parmaklarının ucunda oturduğunu görmüştür. Namazı bitirdiğinde bunu ona söylemiş ve Abdullah bunun namazın sünneti olmadığını, ancak hasta olduğu için böyle yaptığını açıklamıştır. Editör, bunun Malik'ten Ebu Mus'ab, Abd el-Razzaq ve Muhammed ibn el-Hasan tarafından rivayet edildiğini ve Sadaqah ibn Yasar'ın Muwatta'da bundan başka bir hadisi olmadığını belirtmektedir. El-Tamhid'e (16/271) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.143}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Sadaqah ibn Yasar atas otoritas al-Mughirah ibn Hakim, dalam bab tentang cara duduk yang benar saat shalat: Abdullah ibn Umar melihat seseorang duduk di antara dua sujud dengan ujung kaki. Setelah selesai shalat, ia menceritakan hal itu kepadanya, dan Abdullah menjelaskan bahwa itu bukanlah sunnah shalat, tetapi ia melakukannya karena sakit. Editor menyebutkan bahwa hadits ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Abd al-Razzaq, dan Muhammad ibn al-Hasan, dan bahwa Sadaqah ibn Yasar tidak memiliki hadits lain dalam Muwatta' selain hadits ini. Ia merujuk pada al-Tamhid (16/271). {cite:muwatta-maruf-1997 p.143}"
