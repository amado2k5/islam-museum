label: { ar: "الموطأ 237 — ابن عمر يجلس على صدور قدميه بين السجدتين لشكواه", en: "Muwatta 237" }
text: "إنها ليست سنة الصلاة، وإنما أفعل هذا من أجل أني أشتكي"
summary:
  ar: "أثر يرويه مالك عن صدقة بن يسار عن المغيرة بن حكيم، في باب العمل في الجلوس في الصلاة: رأى عبد الله بن عمر يجلس بين السجدتين على صدور قدميه، فلما انصرف ذكر له ذلك، فأخبره أنها ليست سنة الصلاة وإنما يفعله لأنه يشتكي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الرزاق ومحمد بن الحسن، وأنه ليس لصدقة بن يسار في الموطأ غير هذا الحديث، ويحيل على التمهيد (16/271). {cite:muwatta-maruf-1997 p.143}"
