label: { ar: "سنن النسائي 4284 — نقص قيراط من الأجر كل يوم", en: "Sunan al-Nasa'i 4284 — a qirat lost from the reward each day", ur: "سنن نسائی 4284 — ہر روز اجر سے ایک قیراط کی کمی", es: "Sunan al-Nasa'i 4284 — una qirat perdida de la recompensa cada día", fr: "Sunan al-Nasa'i 4284 — une qirat perdue de la récompense chaque jour", tr: "Sunan an-Nasa'i 4284 — Her gün sevaptan bir kırat düşülür.", id: "Sunan an-Nasa'i 4284 — Satu qirat dikurangi dari pahala setiap hari" }
text: "أَخْبَرَنَا سُوَيْدُ بْنُ نَصْرِ بْنِ سُوَيْدٍ، قَالَ أَنْبَأَنَا عَبْدُ اللَّهِ، - وَهُوَ ابْنُ الْمُبَارَكِ - عَنْ حَنْظَلَةَ، قَالَ سَمِعْتُ سَالِمًا، يُحَدِّثُ عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنِ اقْتَنَى كَلْبًا نَقَصَ مِنْ أَجْرِهِ كُلَّ يَوْمٍ قِيرَاطَانِ إِلاَّ ضَارِيًا أَوْ صَاحِبَ مَاشِيَةٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4284، يذكر نقص قيراط من الأجر كل يوم. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 4284 (The Book of Hunting and Slaughtering), that speaks of a qirat lost from the reward each day. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 4284، جس میں ہر روز اجر سے ایک قیراط کی کمی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4284 (El Libro de la Caza y la Matanza), habla de una qirat que se pierde de la recompensa cada día. El Libro de Registro de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4284 (Le Livre de la Chasse et de l'Abattage), mentionne une qirat perdue chaque jour au détriment de la récompense. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, écrivent, effacent ou pèsent une action."
  tr: "Sunan-ı Nesai'de yer alan 4284 numaralı hadiste, her gün sevabın bir kırat (bir ağırlık birimi) azalacağından bahsedilir. Bu, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte iyi ve kötü ameller listesine dahildir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4284, menyebutkan pengurangan satu qirat (satuan berat) dalam pahala setiap hari. Ini termasuk dalam daftar amal baik dan amal buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
