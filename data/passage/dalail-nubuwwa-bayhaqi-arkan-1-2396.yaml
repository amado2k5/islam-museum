text: "… قوم فأكرموه، فقال لي رسول اللّٰه ولف : يا جرير ! أدعوك إلى شهادة أن لا إله إلا اللّٰه وأني رسول اللّٰه، وأن تؤمن بالله، واليوم الأخر، والقدرِ خيره وَشَرِّهِ، وتصلي الصلاة المكتوبة، وتؤدي الزكاة المفروضة، قال: ففعلت فكان بعد …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 2396، يذكر الشهادة والصلاة والزكاة، والإيمان بالقدر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 2396, that mentions the testimony, the prayer and the zakat, belief in the decree; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2396 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 1, pág. 2396, que menciona el testimonio, la oración y el zakat, la creencia en el decreto; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Dala'il al-Nubuwwa d'al-Bayhaqi (tome 1, p. 2396) mentionnant le témoignage, la prière et la zakat (l'aumône légale), ainsi que la croyance au décret. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 1. cildinin 2396. sayfasından, iman şahadeti, namaz, zekât ve kader inancından bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Bukti Kenabian,\" Jilid 1, halaman 2396, yang menyebutkan kesaksian iman, salat, sedekah, dan kepercayaan pada takdir; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
