  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 2396 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، تقدیر پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
