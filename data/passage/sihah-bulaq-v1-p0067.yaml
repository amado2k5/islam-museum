text: |-
  ٥٧٤
  gباب الظام)
  وافظات بالكلام وتاففات به أى تكامت به واللقظ واحد الالفاظ وهو فى الاصل مصدر
  وقولهم اسمح من لانظة بقال هى العنزلانها تشلى للعلب وهى تجتر قتلفظ بجرتها وتقبل
  فرحامنها بالحلب ويقال هى الق تزق فرخها من الطير لانها قخرج مافى حوصلتما وتطعمه
  قال الشاعر
  تجود فتجزل قبل السؤال • وكفك أسمح من لافظه
  ويقال هى الرح ويقال هو الديك ويقال هو البحرلانه يلفظ بالعنبر والجواهروال افية
  للمبالغسة، (نمظاظ يأط بالضم لظااذا تتبح بلسانه يقية الطعام فى قه أوأخرج لسانه فسح
  يه شقتيه وكذلك التلف يقال تاظن الحمة اذا أخوحت لسانها كتق الآكل واللماظة بالض
  ماييتى فى الفم من الطعام ومنه قول الشاعر يصف الدنيا
  لماظة أيام كاحسلام نائم
  وقوله-م ماذت لماظا بالفح أى شيئًا ويقال أيضاشرب الما لماظا اذاذاقه بطرف لسانه
  قال ابن السكيت التظ الشى أى أكله واللمظة بالضم كالنكتة من البياض وفى الحديث
  فان كان فى العلياءفه وأرثم وقد المظ الفرس المظاظ)
  ( صل الميم⁦( شظ)⁩ مشفلت يده بالكسر تشظ صنظاوهو أن يس الشولأً والجذع
  فتدخل فى يده شظية منه قال محيم بن وثيل الرياسى
  فان قناتنا مشظشظاها • شديد مدهاعنق القرين
  ( مفظ المظ الرمان البرى قال أبوذؤيب يصف عسلا
  فياه ب زج لم برالناس مثله • هو الغصل الا أنه عمل العل
  يمانية أجناءها.ظ مائد • وآل قراس صوب أسقبة كمل
  و.ظة لقب سفيان بن سليم بن الحكم بن سعد العشيرة وماظظت الرحل عماظة ومظاظ اشاررته
  ونازعته وتماظ القوم قال الراجز
  جاف دلنظى عر كمغاتط * أهوج الاأنه عاظظ
  صل النون عظ) نعظ الزب يتعظ نعظا ونعوظ انتشر وأنعظه صاحب
  والانعاظ الشبق يقال أنعظت الدابة اذاقعت حياهامرة وقبضه أخرى وينشد
  اذا عرق المهقوع بالمره أنعظت • حليلته وابتل منها ازارها
  ن كظ لنكظة العجلة وقد نمكظ الرحل بالكسر وأنمكفه غيره أى أيجله عن حاجته
  وتسكظه تنكيظ امثله
  صل الاد شظ) الوشيظة قطعة عظام تمكون زيادة فى العظم الصميم والوشيف
  فيف من الناس ليس أصلهم واحداقال الكسائبنوفلان وشيظة فى قومهم أى هم حشو
  فيهم قال الشاءر هم أهل بطاوى قريش كايهما • وهم صلبها ليس الوشائظ كالصلب
  ووشظت العظم أشظه وشظا أى كسرت منه قطعة ووشطت الفأس اذا جعلت فى خوتم اقطعة
  خشب تضيقه بها عظ الوعظ النصح والتذ كير بالعواقب تقول وعظته وعظا وعظة
  فاتعظ أى قبل الموعظة يقال السعيد من وعظ يغيره والشق من اتعظ به غيره ⁦( وكظ)⁩
  لوكظ الدفع بقال وكظه وكظا أى دفعه وزبنه ذكره أبو عبيد فى الصنف والمواكظة
  المدمه
  ه ح.
