text: "… ثنا يحيى بن أبي كثير عن أبي سَلمة عن جابر قال: أقبلنا مع رسول اللّٰه وَلفي حتى إذا كنا بذاتِ الرِّقاع - وكنا إذا أتينا على شجرة ظليلةٍ تركناها لرسول اللّٰه لِيف - فجاءَ رجلٌ من المشركين، وسيفُ رسول اللّٰه …"
