label: { ar: "الموطأ 1389 — نافع عن ابن عمر: ضحى بالمدينة، فأمر نافعا أن يشتري كبشا فحيلا أقرن، ثم حلق رأسه حين ذبح الكبش وهو مريض لم يشهد العيد", en: "Muwatta 1389", es: "Muwatta 1389", fr: "Muwatta 1389", ur: "موطا 1389", tr: "El-Muvatta 1389 — İbn Ömer'den rivayet edildiğine göre Nafi' şöyle buyurmuştur: Medine'de kurban kesti ve Nafi'ye güçlü, boynuzlu bir koç satın almasını emretti. Sonra koçu keserken başını tıraş etti, çünkü hastaydı ve bayrama katılamadı.", id: "Al-Muwatta 1389 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Beliau mengadakan kurban di Madinah, dan memerintahkan Nafi’ untuk membeli seekor domba jantan bertanduk besar. Kemudian beliau mencukur kepalanya ketika menyembelih domba jantan tersebut, karena beliau sedang sakit dan tidak dapat menghadiri Idul Fitri." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر ضحى مرة بالمدينة، قال نافع فأمرني أن أشتري له كبشا فحيلا أقرن، ثم أذبحه يوم الأضحى في مصلى الناس، ففعلت، ثم حمل إلى عبد الله بن عمر، فحلق رأسه حين ذبح الكبش، وكان مريضا لم يشهد العيد مع الناس. وكان عبد الله يقول ليس حلاق الرأس بواجب على من ضحى، وقد فعله ابن عمر. {cite:muwatta-maruf-1997 p.620}"
  tr: "Malik, Nafi'den rivayetle Abdullah ibn Umar'ın bir keresinde Medine'de kurban kestiğini anlatmıştır. Nafi' şöyle demiştir: \"Bana güçlü, boynuzlu bir koç alıp Kurban Bayramı günü halkın namaz kıldığı yerde kesmemi emretti. Ben de öyle yaptım ve koç Abdullah ibn Umar'a götürüldü. O da koç kesildikten sonra başını tıraş etti. Hasta olduğu için halkla birlikte bayram namazına katılamadı.\" Abdullah, kurban kesen için baş tıraşının farz olmadığını söylerdi ve İbn Umar da öyle yaptı. {cite:muwatta-maruf-1997 s.620}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar pernah melakukan kurban di Madinah. Nafi’ berkata, “Beliau memerintahkan saya untuk membelikan seekor domba jantan bertanduk besar dan menyembelihnya pada hari raya Idul Adha di tempat shalat berjamaah. Saya melakukannya, lalu domba itu dibawa kepada Abdullah ibn Umar, yang mencukur kepalanya ketika domba itu disembelih. Beliau sedang sakit dan tidak dapat mengikuti shalat Id bersama orang-orang.” Abdullah biasa mengatakan bahwa mencukur kepala bukanlah kewajiban bagi orang yang melakukan kurban, dan Ibn Umar melakukannya. {cite:muwatta-maruf-1997 p.620}"
