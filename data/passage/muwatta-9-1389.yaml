label: { ar: "الموطأ 1389 — نافع عن ابن عمر: ضحى بالمدينة، فأمر نافعا أن يشتري كبشا فحيلا أقرن، ثم حلق رأسه حين ذبح الكبش وهو مريض لم يشهد العيد", en: "Muwatta 1389" }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر ضحى مرة بالمدينة، قال نافع فأمرني أن أشتري له كبشا فحيلا أقرن، ثم أذبحه يوم الأضحى في مصلى الناس، ففعلت، ثم حمل إلى عبد الله بن عمر، فحلق رأسه حين ذبح الكبش، وكان مريضا لم يشهد العيد مع الناس. وكان عبد الله يقول ليس حلاق الرأس بواجب على من ضحى، وقد فعله ابن عمر. {cite:muwatta-maruf-1997 p.620}"
