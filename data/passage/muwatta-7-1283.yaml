label: { ar: "الموطأ 1283 — أبو هريرة: مثل المجاهد في سبيل الله كمثل الصائم القائم الدائم الذي لا يفتر", en: "Muwatta 1283", es: "Muwatta 1283", fr: "Muwatta 1283", ur: "موطا 1283", tr: "El-Muvatta 1283 — Ebu Hurayra: Allah yolunda gayret gösterenin örneği, aralıksız oruç tutup namaz kılanın örneği gibidir.", id: "Al-Muwatta 1283 — Abu Hurairah: Perumpamaan orang yang berjuang di jalan Allah adalah seperti perumpamaan orang yang berpuasa dan shalat terus-menerus tanpa henti." }
text: "مَثلُ المُجاهدِ في سبيلِ اللهِ كَمَثلِ الصَّائم القائمِ الدائمِ"
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال مثل المجاهد في سبيل الله كمثل الصائم القائم الدائم الذي لا يفتر من صلاة ولا صيام حتى يرجع. {cite:muwatta-maruf-1997 p.571}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Allah yolunda gayret gösteren kimsenin örneği, oruç tutup namazı aralıksız kılan, namazı ve orucu hiç bırakmadan dönüp dönen kimsenin örneği gibidir.\" {cite:muwatta-maruf-1997 s.571}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Perumpamaan orang yang berjuang di jalan Allah adalah seperti orang yang berpuasa dan shalat terus-menerus, tanpa berhenti dari shalat dan puasa sampai ia kembali.\" {cite:muwatta-maruf-1997 p.571}"
