text: "مين ومذاهبهم وآرائهم وتراجمهم . ويشهد بشهرته بذلك كثرة ذكره في كتاب ابن المرتضي، ومروج الذهب للمسعودي وغيرهما من الكتاب عند الرواية عن المعتزلة أو الحكاية عن رجالها. ويشهد كتاب الانتصار من أوله إلى آخره بواسع سلمه، فإنه يفيدنا علما"
