text: "بوَاجِبٍ؛ لأنَّهُ جَعَلَ تَرْكَهُ مَكْرُوهاً. وَهَذَا قَوْلُ أَبِي حَيْفَةً وَالشَّافِعِيّ كَانَ فِي الْوَقْتِ، فِي بَادِيّةِ أَوْ نَحْرِهَا، اُسْتُحِبٌ لَهُ الْجَهْرُ بِالأذَانِ؛ لَأَنْهُ دُعَاةُ إِلَى الصّلاةِ، فَأَشْبَهَ قَوْلَهُ: الصلاةُ جَامِعَةً. وَقَالَ أَبُو بَكْرٍ لِقَوْلٍ أَبِي معيدٍ: إذًا كُنْتَ فِي غَنَمِكَ أَوْ …"
summary:
