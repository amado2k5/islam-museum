text: "… اللّٰه أعلم. والصبر من الإيمان بمنزلة الرأس من الجسد، ولا إمان لمن لا صبر له حدثنا أبو بكر الطلحى ثنا محمد بن عبد اللّٰه الحضرمى ثناعون بن سلام ثنا أبو مريم عن زبيد عن مهاجرين عمير. قال قال على بن …"
