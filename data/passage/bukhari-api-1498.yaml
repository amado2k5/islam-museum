label: { ar: "صحيح البخاري 1498 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 1498 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 1498 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 1498 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 1498 — mentions de nations, religions et peuples non musulmans", tr: "Sahih el-Buhari 1498 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih al-Bukhari 1498 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "وَقَالَ اللَّيْثُ حَدَّثَنِي جَعْفَرُ بْنُ رَبِيعَةَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ هُرْمُزَ، عَنْ أَبِي هُرَيْرَةَ ـ عَنِ النَّبِيِّ \" أَنَّ رَجُلاً مِنْ بَنِي إِسْرَائِيلَ سَأَلَ بَعْضَ بَنِي إِسْرَائِيلَ بِأَنْ يُسْلِفَهُ أَلْفَ دِينَارٍ، فَدَفَعَهَا إِلَيْهِ، فَخَرَجَ فِي الْبَحْرِ، فَلَمْ يَجِدْ مَرْكَبًا، فَأَخَذَ خَشَبَةً فَنَقَرَهَا فَأَدْخَلَ فِيهَا أَلْفَ دِينَارٍ، فَرَمَى بِهَا فِي الْبَحْرِ، فَخَرَجَ الرَّجُلُ الَّذِي كَانَ أَسْلَفَهُ، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1498، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1498 (Obligatory Charity Tax (Zakat)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 1498، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 1498 (Impuesto obligatorio sobre la caridad (Zakat)), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih al-Bukhari, n° 1498 (L'aumône obligatoire (Zakat)), mentionne les nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih el-Buhari'nin 1498 numaralı hadisinde, Müslüman olmayan milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, Müslüman olmayan milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 1498, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
