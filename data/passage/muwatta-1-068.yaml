label: { ar: "الموطأ 68 — نبع الماء من بين أصابع النبي حتى توضأ الناس كلهم", en: "Muwatta 68", es: "Muwatta 68", fr: "Muwatta 68", ur: "موطا 68", tr: "Muvatta Suresi 68 — Peygamberin parmaklarının arasından su aktı ve bütün insanlar abdest aldılar.", id: "Al-Muwatta 68 — Air mengalir dari sela-sela jari Nabi hingga seluruh umat berwudhu." }
text: "فرأيت الماء ينبع من تحت أصابعه، فتوضأ الناس حتى توضؤوا من عند آخرهم"
summary:
  ar: "يرويه مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك، في باب جامع الوضوء: حانت صلاة العصر فالتمس الناس ماءً للوضوء فلم يجدوه، فأُتي النبي بقليل من الماء في إناء فوضع فيه يده وأمر الناس أن يتوضؤوا منه، فرأى أنس الماء ينبع من بين أصابعه حتى توضأ الناس عن آخرهم. ويخرّجه المحقق من طرق أصحاب مالك عند البخاري (169) في الوضوء وفي علامات النبوة، ومسلم (7/59)، والترمذي (3631)، والنسائي، والبيهقي في السنن وفي دلائل النبوة، ويحيل على التمهيد (1/217). {cite:muwatta-maruf-1997 p.71}"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan, o da Enes ibn Malik'ten rivayetle, tam abdest bölümünde şöyle nakletmiştir: Öğle namazı vakti geldi ve insanlar abdest almak için su aradılar, ancak bulamadılar. Peygamberimize bir kapta az miktarda su getirildi ve o da elini içine sokarak insanlara bu sudan abdest almalarını emretti. Enes, parmaklarının arasından suyun fışkırdığını gördü ve bütün insanlar abdest aldılar. Editör, bu hadisi Buhari'nin (169) abdest ve Peygamberliğin İşaretleri bölümünde, Müslim'in (7/59), Tirmizi'nin (3631), Nesai'nin ve Beyhaki'nin Sünen ve Peygamberliğin İşaretleri'nde yer alan Malik'in sahabelerinin rivayet zincirlerinden almış ve el-Temhid'e (1/217) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.71}"
  id: "Diriwayatkan oleh Malik dari Ishaq ibn Abdullah ibn Abi Talha dari Anas ibn Malik, dalam surah tentang wudhu lengkap: Waktu shalat Ashar tiba, dan orang-orang mencari air untuk wudhu tetapi tidak menemukannya. Sedikit air dibawa kepada Nabi dalam sebuah wadah, dan beliau memasukkan tangannya ke dalamnya dan memerintahkan orang-orang untuk berwudhu dengannya. Anas melihat air menyembur keluar dari sela-sela jarinya sampai semua orang berwudhu. Editor menyertakannya dari sanad para sahabat Malik dalam Bukhari (169) dalam surah tentang wudhu dan Tanda-Tanda Kenabian, Muslim (7/59), Tirmidzi (3631), Nasa'i, dan Bayhaqi dalam Sunan dan dalam Tanda-Tanda Kenabian, dan merujuk pada al-Tamhid (1/217). {cite:muwatta-maruf-1997 p.71}"
