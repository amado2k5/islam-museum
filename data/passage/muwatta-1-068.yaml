label: { ar: "الموطأ 68 — نبع الماء من بين أصابع النبي حتى توضأ الناس كلهم", en: "Muwatta 68" }
text: "فرأيت الماء ينبع من تحت أصابعه، فتوضأ الناس حتى توضؤوا من عند آخرهم"
summary:
  ar: "يرويه مالك عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك، في باب جامع الوضوء: حانت صلاة العصر فالتمس الناس ماءً للوضوء فلم يجدوه، فأُتي النبي بقليل من الماء في إناء فوضع فيه يده وأمر الناس أن يتوضؤوا منه، فرأى أنس الماء ينبع من بين أصابعه حتى توضأ الناس عن آخرهم. ويخرّجه المحقق من طرق أصحاب مالك عند البخاري (169) في الوضوء وفي علامات النبوة، ومسلم (7/59)، والترمذي (3631)، والنسائي، والبيهقي في السنن وفي دلائل النبوة، ويحيل على التمهيد (1/217). {cite:muwatta-maruf-1997 p.71}"
