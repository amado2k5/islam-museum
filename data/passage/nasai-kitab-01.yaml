summary:
  ar: "القسم 1 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطهارة»، ويضم فيها النصوص من 1 إلى 324 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 1 of Sunan al-Nasa'i (The Book of Purification) in the division of the open hadith dataset the museum took its reports from: reports 1 to 324 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 1، عنوان «کتاب الطہارۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1 تا 324۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El Libro 1 de Sunan al-Nasa'i (El Libro de la Purificación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1 al 324, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait les hadiths du Sunan al-Nasa'i (Livre de la Purification), dans sa première partie, qui comprend les hadiths 1 à 324 selon la numérotation de ce recueil. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 1. bölümü \"Temizlenme Kitabı\" başlığını taşımakta olup, 1'den 324'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 1 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Penyucian\" dan berisi teks 1 hingga 324, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
