label: { ar: "الموطأ 2204 — مالك عن ربيعة بن أبي عبد الرحمن عن يزيد مولى المنبعث عن زيد بن خالد الجهني: جاء رجل يسأل النبي عن اللقطة، فقال: اعرف عفاصها ووكاءها، ثم عرفها سنة، فإن جاء صاحبها وإلا فشأنك بها، وسأله عن ضالة الغنم والإبل", en: "Muwatta 2204" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن يزيد مولى المنبعث عن زيد بن خالد الجهني أنه قال: جاء رجل إلى رسول الله فسأله عن اللقطة، فقال: اعرف عفاصها ووكاءها، ثم عرفها سنة، فإن جاء صاحبها وإلا فشأنك بها. قال: فضالة الغنم يا رسول الله؟ قال: هي لك أو لأخيك أو للذئب. قال: فضالة الإبل؟ قال: مالك ولها؟ معها سقاؤها وحذاؤها، تورد الماء، وتأكل الشجر، حتى يلقاها ربها. {cite:muwatta-maruf-1997 p.303} {cite:muwatta-maruf-1997 p.304}"
