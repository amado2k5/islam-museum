label: { ar: "الموطأ 2204 — مالك عن ربيعة بن أبي عبد الرحمن عن يزيد مولى المنبعث عن زيد بن خالد الجهني: جاء رجل يسأل النبي عن اللقطة، فقال: اعرف عفاصها ووكاءها، ثم عرفها سنة، فإن جاء صاحبها وإلا فشأنك بها، وسأله عن ضالة الغنم والإبل", en: "Muwatta 2204", es: "Muwatta 2204", fr: "Muwatta 2204", ur: "موطا 2204", tr: "El-Muvatta 2204 — Malik, Rabi’ah ibn Abi Abd al-Rahman’dan, o da el-Munba’ith’in azatlı kölesi Yazid’den, o da Zeyd ibn Halid al-Cuhani’den rivayetle: Bir adam kayıp eşya hakkında Peygamber’e soru sormaya geldi ve Peygamber şöyle buyurdu: “Kabını ve bağını tanı, sonra bir yıl boyunca ilan et. Sahibi gelirse ona ver; gelmezse, sana kalmış.” Ayrıca kayıp koyun ve develer hakkında da sordu.", id: "Al-Muwatta 2204 — Malik, berdasarkan riwayat Rabi’ah ibn Abi Abd al-Rahman, berdasarkan riwayat Yazid, budak yang dibebaskan dari al-Munba’ith, berdasarkan riwayat Zayd ibn Khalid al-Juhani: Seorang pria datang untuk bertanya kepada Nabi tentang harta yang hilang, dan beliau berkata: “Kenali wadah dan talinya, lalu umumkan selama setahun. Jika pemiliknya datang, berikan kepadanya; jika tidak, terserah padamu.” Dia juga bertanya tentang domba dan unta yang hilang." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن عن يزيد مولى المنبعث عن زيد بن خالد الجهني أنه قال: جاء رجل إلى رسول الله فسأله عن اللقطة، فقال: اعرف عفاصها ووكاءها، ثم عرفها سنة، فإن جاء صاحبها وإلا فشأنك بها. قال: فضالة الغنم يا رسول الله؟ قال: هي لك أو لأخيك أو للذئب. قال: فضالة الإبل؟ قال: مالك ولها؟ معها سقاؤها وحذاؤها، تورد الماء، وتأكل الشجر، حتى يلقاها ربها. {cite:muwatta-maruf-1997 p.303} {cite:muwatta-maruf-1997 p.304}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da el-Munba'ith'in azatlı kölesi Yazid'den, o da Zeyd ibn Halid el-Cuhani'den rivayetle şöyle buyurmuştur: Bir adam Allah'ın Resulü'ne gelip kayıp eşya hakkında sordu. Resulullah şöyle buyurdu: \"Kabını ve bağını tanı, sonra bir yıl boyunca ilan et. Sahibi gelirse ona ver; gelmezse senindir.\" Adam dedi ki: \"Ey Allah'ın Resulü, kayıp bir koyun ne olacak?\" Resulullah şöyle buyurdu: \"O senindir, ya kardeşinindir, ya da kurdundur.\" Adam dedi ki: \"Ya kayıp bir deve ne olacak?\" Resulullah şöyle buyurdu: \"Onunla ne işin var? Kendi suyu ve kendi nalları var; sahibi bulıncaya kadar suya gider ve ağaçlardan yer.\" {cite:muwatta-maruf-1997 s.303} {cite:muwatta-maruf-1997 s.304}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi 'Abd al-Rahman, dari Yazid, budak yang dibebaskan dari al-Munba'ith, dari Zayd ibn Khalid al-Juhani, yang berkata: Seorang pria datang kepada Rasulullah dan bertanya tentang barang yang hilang. Beliau bersabda: \"Kenali wadah dan talinya, lalu umumkan selama setahun. Jika pemiliknya datang, berikan kepadanya; jika tidak, itu menjadi milikmu.\" Pria itu bertanya: \"Bagaimana dengan domba yang tersesat, wahai Rasulullah?\" Beliau bersabda: \"Itu menjadi milikmu, atau saudaramu, atau serigala.\" Pria itu bertanya: \"Bagaimana dengan unta yang tersesat?\" Beliau bersabda: \"Apa urusanmu dengannya? Ia memiliki air dan alas kakinya sendiri; ia pergi ke air dan makan dari pepohonan sampai pemiliknya menemukannya.\" {kutip:muwatta-maruf-1997 hal.303} {kutip:muwatta-maruf-1997 hal.304}"
