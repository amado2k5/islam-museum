summary:
  ar: "قال مالك: وحساب الأصابع ثلاثة وثلاثون دينارا وثلث دينار في كل أنملة، وهي من الإبل ثلاث فرائض وثلث فريضة. {cite:muwatta-maruf-1997 p.431}"
  tr: "Malik şöyle dedi: Parmak uçları için hesaplama otuz üç ve üçte bir dinar olup, bu da üç ve üçte bir deveye eşdeğerdir. {cite:muwatta-maruf-1997 s.431}"
  id: "Malik berkata: Perhitungan untuk setiap jari adalah tiga puluh tiga sepertiga dinar untuk setiap ujung jari, dan ini setara dengan tiga sepertiga unta. {cite:muwatta-maruf-1997 p.431}"
