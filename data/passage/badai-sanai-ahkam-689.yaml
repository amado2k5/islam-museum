text: "… رَفَعْتَ رَأْسَكَ مِنْ آخِرِ سَجْدَةٍ وَقَعَدتَّ قَدْرَ التَّشَهُدِ - فَقَدْ تَمَّتْ صَلاَتُكَ، أثبَتَ تمام الصلاةِ عِنْدَ مجرَّد القعدة، ولو كان التشهُد فرضاً - لما ثبَتَ التمامُ بدونه، دَلَّ أنه ليس بفَرْضٍ، لكنه واجب بمواظبة النبيِّ يم ومواظبته دليلُ الوجوبِ فيما …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 689، يرد فيه ذكر الفرض، والواجب، والوجوب، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 689, whose wording mentions the obligatory (fard), the obligatory (wajib), obligation (wujub), what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 689 کا اقتباس جس میں فرض، واجب، وجوب، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 689, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), l'obligation (wujub), ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 689, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), la obligatoriedad (wujub), lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 689. sayfasından, farz olan ameller, görevler ve farz olmayan amelleri ele alan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 689, yang membahas tentang amalan wajib, kewajiban, dan yang tidak wajib; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
