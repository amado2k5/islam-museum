text: "… واللحية بالسواد، ثم قال: قال: الغزالي في الإحياء، والبغوي في التهذيب، وآخرون من الأصحاب: هو مكروه. وظاهر عبارتهم أنه مكروه كراهة تنزيه، والصحيح - بل الصواب - أنه حرام. وممن صرح بتحريمه صاحب الحاوي في باب الصلاة بالنجاسة، قال : …"
