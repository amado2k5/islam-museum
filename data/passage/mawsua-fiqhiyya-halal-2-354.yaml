text: "… واللحية بالسواد، ثم قال: قال: الغزالي في الإحياء، والبغوي في التهذيب، وآخرون من الأصحاب: هو مكروه. وظاهر عبارتهم أنه مكروه كراهة تنزيه، والصحيح - بل الصواب - أنه حرام. وممن صرح بتحريمه صاحب الحاوي في باب الصلاة بالنجاسة، قال : …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 2، ص 354، يذكر الحرام، والتحريم، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 2, p. 354, that mentions the unlawful, prohibition, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 2، ص 354 کا اقتباس جس میں حرام، تحریم، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 2, pág. 354, que menciona lo ilícito, la prohibición y lo reprobable; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation du volume 2, p. 354) mentionnant l'illicite, l'interdit et le déconseillé; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 2, sayfa 354'ten, yasaklanmış, haram ve mekruh edilmiş şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 2 Bergambar, halaman 354, yang menyebutkan hal-hal yang dilarang, diharamkan, dan tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
