text: "… يَجُوزُ إفْرَادُهُ بالْعَقْدِ، وَهُوَ مَجْهُول. وَاجَارَةً الظَّفْرِ خُولِفَ فِيهِ الأَصْلُ أَعْطَى أُجْرَةً لِعَسْبِ الْفَحْلِ، فَهُوَ حَرَامٌ عَلَى الآخِذِ لِمَا ذَكَرْنَاهُ. وَلا يَحْرُمُ عَلَى الْمُمْعلي لأنَّهُ بَذَلَ مَالَهُ لِتَحْصيلٍ مُبّاحٍ يَحْتَاجُ الَيْهِ، وَلا تَمْتَيِعُ هَذَا كَمَا فِي كَسْبِ الْحَجَّامِ، فَإِنَّهُ خَبِيث، …"
