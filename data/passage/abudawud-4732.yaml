label:
  ar: "أبو داود 4732 — أنا الملك أين الجبارون أين المتكبرون"
  en: "Abu Dawud 4732 — I am the King; where are the tyrants, where are the arrogant?"
  ur: "ابو داؤد 4732 — میں بادشاہ ہوں، جابروں اور متکبروں کو کہاں ہیں"
text: "يطوي الله السماوات يوم القيامة ثم يأخذهن بيده اليمنى ثم يقول أنا الملك أين الجبارون أين المتكبرون ثم يطوي الأرضين ثم يأخذهن بيده الأخرى …"
summary:
  ar: "حديث قدسي في أبو داود، رقم 4732: أنا الملك أين الجبارون أين المتكبرون. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Abu Dawud, no. 4732: I am the King; where are the tyrants, where are the arrogant?. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ابو داؤد میں حدیثِ قدسی، نمبر 4732: میں بادشاہ ہوں، جابروں اور متکبروں کو کہاں ہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
