  ar: "سنن النسائي، كتاب عشرة النساء"
  en: "Sunan al-Nasa'i, Book 36: The Book of the Kind Treatment of Women"
  ur: "سنن نسائی، کتاب عشرۃ النساء"
  es: "Sunan al-Nasa'i, Libro 36: El libro del trato amable a las mujeres"
  fr: "Sunan al-Nasa'i, Livre 36: Le Livre du Bon Traitement des Femmes"
summary:
  ar: "القسم 36 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب عشرة النساء»، ويضم فيها النصوص من 3939 إلى 3965 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 36 of Sunan al-Nasa'i (The Book of the Kind Treatment of Women) in the division of the open hadith dataset the museum took its reports from: reports 3939 to 3965 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 36، عنوان «کتاب عشرۃ النساء»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3939 تا 3965۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 36 de Sunan al-Nasa'i (El Libro del Buen Trato a las Mujeres) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3939 al 3965 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre de la bienveillance envers les femmes), dans la section 3939 à 3965 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
