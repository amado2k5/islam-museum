text: "… كَثِيرٍ، قَالَ سَمِعْتُ عَاصِمَ بْنَ لَقِيطِ بْنِ صَبْرَةَ، عَنْ أَبِيهِ، قَالَ قُلْتُ يَا رَسُولَ اللَّهِ أَخْبِرْنِي عَنِ الْوُضُوءِ،. قَالَ \" أَسْبِغِ الْوُضُوءَ وَخَلِّلْ بَيْنَ الأَصَابِعِ وَبَالِغْ فِي الاِسْتِنْشَاقِ إِلاَّ أَنْ تَكُونَ صَائِمًا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ كَرِهَ أَهْلُ الْعِلْمِ السَّعُوطَ لِلصَّائِمِ وَرَأَوْا أَنَّ ذَلِكَ يُفْطِرُهُ وَفِي الْحَدِيثِ مَا يُقَوِّي قَوْلَهُمْ."
summary:
  ar: "حديث في جامع الترمذي، رقم 788، يذكر اللدود والسعوط. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 788 (The Book on Fasting), that mentions medicine given by the mouth-side or the nose. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 788، جس میں لدود اور سعوط کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 788 (El Libro del Ayuno), menciona la administración de medicamentos por vía oral o nasal. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 788 (Le Livre du jeûne), mentionne l'administration de médicaments par voie orale ou nasale. Le Répertoire des médicaments le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de 788 numaralı hadis, zehir verilmesi ve burun damlası kullanılmasıyla ilgili bilgiler içermektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 788, menyebutkan pemberian racun dan penggunaan obat tetes hidung. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
