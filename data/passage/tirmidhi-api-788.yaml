text: "… كَثِيرٍ، قَالَ سَمِعْتُ عَاصِمَ بْنَ لَقِيطِ بْنِ صَبْرَةَ، عَنْ أَبِيهِ، قَالَ قُلْتُ يَا رَسُولَ اللَّهِ أَخْبِرْنِي عَنِ الْوُضُوءِ،. قَالَ \" أَسْبِغِ الْوُضُوءَ وَخَلِّلْ بَيْنَ الأَصَابِعِ وَبَالِغْ فِي الاِسْتِنْشَاقِ إِلاَّ أَنْ تَكُونَ صَائِمًا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ كَرِهَ أَهْلُ الْعِلْمِ السَّعُوطَ لِلصَّائِمِ وَرَأَوْا أَنَّ ذَلِكَ يُفْطِرُهُ وَفِي الْحَدِيثِ مَا يُقَوِّي قَوْلَهُمْ."
summary:
  ar: "حديث في جامع الترمذي، رقم 788، يذكر اللدود والسعوط. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 788 (The Book on Fasting), that mentions medicine given by the mouth-side or the nose. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 788، جس میں لدود اور سعوط کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
