text: "… وغيره يعمل في التكفير . قال مجاهد: إنما كان نافلةً للنبي طيع، لأنه قد غُفِرَ له ما تقدم من ذنبه وما تأخر، فكانت طاعته نافلة، أي : زيادة في الثواب، ولغيره كفارة لذنوبه . قال ابن المنذر في تفسيره: حدثنا …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 103، يذكر محو السيئات وحط الخطايا، ومغفرة الذنب؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 103, that speaks of bad deeds erased and sins shed, forgiveness of sins; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 103 کا اقتباس جس میں برائیوں کا مٹنا، گناہوں کی مغفرت کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
