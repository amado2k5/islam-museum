text: "قال أبو هريرة: قال رسول الله: من علامة المنافق ثلاث: إذا حدث كذب، وإذا وعد أخلف، وإذا اؤتمن خان"
summary:
  ar: "رواية أبي هريرة في باب بيان خصال المنافق من كتاب الإيمان في صحيح مسلم؛ علامات النفاق الثلاث."
  tr: "Sahih Müslim'in İman Kitabı'ndaki \"Münafığın Özelliklerini Açıklama\" bölümünde Ebu Hurayra'nın rivayetine göre; münafığın üç belirtisi."
  id: "Riwayat Abu Hurairah dalam bab tentang menjelaskan ciri-ciri orang munafik dari Kitab Iman dalam Sahih Muslim; tiga tanda kemunafikan."
