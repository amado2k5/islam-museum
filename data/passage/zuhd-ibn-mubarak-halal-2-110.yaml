text: "… أخيه، شكَّ ابنُ صاعدٍ - ودِرهمَه وسَوْطَه أن يَجِدَها مُلقّى في الطَّريقِ حتّى يَرُدَّها عليه، فبينَما هم كذلك إذْ طَعَنَ الشيطانُ طَعْنةً فتَفَرَت القلوبُ فصارت وَحْشاً، فإذا هو يَستحِلُّ دمَه ومالَه، وهو بالأمسِ يحرَّمُ غِيبتَه- أو قال: عَيْبِتَه - ودينارَه …"
