  ur: "سنن ابی داؤد، کتاب الفتن والملاحم"
  es: "Sunan Abi Dawud, Libro 37: Pruebas y batallas feroces (Kitab Al-Fitan Wa Al-Malahim)"
summary:
  ar: "القسم 37 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفتن والملاحم»، ويضم فيها النصوص من 4240 إلى 4278 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 37 of Sunan Abi Dawud (Trials and Fierce Battles (Kitab Al-Fitan Wa Al-Malahim)) in the division of the open hadith dataset the museum took its reports from: reports 4240 to 4278 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 37، عنوان «کتاب الفتن والملاحم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4240 تا 4278۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 37 de Sunan Abi Dawud (Pruebas y batallas feroces (Kitab Al-Fitan Wa Al-Malahim)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4240 al 4278, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
