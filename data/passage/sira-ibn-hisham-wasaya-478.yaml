text: "… أخرى لمسافع بن عبد مناف في مقتل عمرو : وقال مُسَافِع أيضاً يُؤَنِّبُ فُرْسَان عمرو الذين كانوا معه فأَجلَوْا عنه وتَرَكُوهُ من الكامل : خَيْلٌ تُقَادُ لَهُ وَخَيْلٌ تُنْعَلُ عَمْرُو بْنُ عَبْدٍ وَالْجِيَادُ يَقُبودُهَا رُكْناً عَظِيماً كَانَ فِيهَا أَوَّلُ أَجْلَتْ …"
