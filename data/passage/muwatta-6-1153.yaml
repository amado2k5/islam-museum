label: { ar: "الموطأ 1153 — مالك: تفسير الرفث والفسوق والجدال في الحج", en: "Muwatta 1153", es: "Muwatta 1153", fr: "Muwatta 1153", ur: "موطا 1153", tr: "El-Muvatta 1153 — Malik: Hac sırasında müstehcenlik, kötülük ve tartışmanın tefsiri", id: "Al-Muwatta 1153 — Malik: Penafsiran tentang kecabulan, kejahatan, dan perselisihan selama ibadah haji" }
summary:
  ar: "يفسر مالك الرفث في الحج بإصابة النساء، والفسوق بذبح الأنصاب، والجدال بما كانت قريش تفعله عند المشعر الحرام بالمزدلفة من مخالفة العرب الذين يقفون بعرفة، وقد نهى الله عن ذلك. ويقول إن هذا الجدال فيما يرى، وقد سمع ذلك من أهل العلم. {cite:muwatta-maruf-1997 p.522}"
  tr: "Malik, Hac sırasında edepsizliği kadınlarla cinsel ilişkiye girmek, haddi aşmayı put kurban etmek, tartışmayı ise Kureyşlilerin Muzdalifah'taki kutsal mekânda Arafat'ta duran Araplarla tartışması olarak yorumlar; oysa bu Allah tarafından yasaklanmıştır. Bu tartışmayı gördüğünü ve bunu âlimlerden duyduğunu söyler. {cite:muwatta-maruf-1997 s.522}"
  id: "Malik menafsirkan perbuatan cabul selama ibadah haji sebagai hubungan seksual dengan perempuan, pelanggaran sebagai penyembahan berhala, dan perselisihan sebagai apa yang biasa dilakukan kaum Quraisy di tempat suci Muzdalifah, yang bertentangan dengan orang-orang Arab yang berdiri di Arafat, yang telah dilarang oleh Allah. Ia mengatakan bahwa inilah perselisihan yang ia lihat, dan ia mendengarnya dari para ulama. {cite:muwatta-maruf-1997 p.522}"
