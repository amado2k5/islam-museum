summary:
  ar: "يفسر مالك الرفث في الحج بإصابة النساء، والفسوق بذبح الأنصاب، والجدال بما كانت قريش تفعله عند المشعر الحرام بالمزدلفة من مخالفة العرب الذين يقفون بعرفة، وقد نهى الله عن ذلك. ويقول إن هذا الجدال فيما يرى، وقد سمع ذلك من أهل العلم. {cite:muwatta-maruf-1997 p.522}"
