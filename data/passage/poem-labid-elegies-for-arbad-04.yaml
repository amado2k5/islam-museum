summary:
  ar: بيت من مراثي لبيد في أخيه أربد، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.405}}. ينقل ابن هشام هذه المراثي عن ابن إسحاق، ويذكر أن بعض أبياتها عن أبي عبيدة أو عن غير ابن إسحاق.
  en: A third piece, rhymed on mim, which Ibn Hisham gives with the note that its lines are from Abu Ubayda in part. Labid bids Arbad farewell.
