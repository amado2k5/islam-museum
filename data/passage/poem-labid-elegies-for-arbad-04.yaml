label:
  ar: لبيد، مراثي أربد ⁦(البيت 3.1)⁩
  en: Labid's elegies for Arbad, line 3.1
  es: "Elegías de Labid para Arbad, línea 3.1"
  fr: "Élégies de Labid pour Arbad, vers 3.1"
  ur: "ارباد کے لیے لیبڈ کی خوبیاں، لائن 3.1"
text: ألا ذهبَ الحافظُ والحاميْ ومانعُ ضيمِها يومَ الخِصامِ
summary:
  ar: بيت من مراثي لبيد في أخيه أربد، كما في طبعة فستنفلد {{cite:ibn-hisham-wustenfeld-1858 p.405}}. ينقل ابن هشام هذه المراثي عن ابن إسحاق، ويذكر أن بعض أبياتها عن أبي عبيدة أو عن غير ابن إسحاق.
  en: A third piece, rhymed on mim, which Ibn Hisham gives with the note that its lines are from Abu Ubayda in part. Labid bids Arbad farewell.
  es: "Una tercera pieza, con rima en mim, que Ibn Hisham menciona con la nota de que sus versos provienen en parte de Abu Ubayda. Labid se despide de Arbad."
  fr: "Un troisième poème, rimé sur « mim », qu’Ibn Hisham rapporte en précisant que ses vers proviennent en partie d’Abu Ubayda. Labid fait ses adieux à Arbad."
  ur: "تیسرا ٹکڑا، میم پر تالیف ہے، جسے ابن ہشام نے اس نوٹ کے ساتھ دیا ہے کہ اس کی سطریں جزوی طور پر ابو عبیدہ کی ہیں۔ لبید نے اربد کو الوداع کہا۔"
translations:
  en:
    text: Gone is the guardian and the protector, and the one who warded off wrong on the day of contention.
