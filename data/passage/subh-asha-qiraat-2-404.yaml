text: "… تعليق كعب الأرنب - كانوا يعلّقونه علىٰ أنفسهم، ويزعمون أنه وقايةٌ من العين والسَّحر، قائلين إن الجنّ تنفِر من الأرنب لكونها تحيض، قال الشاعر : ولا يَنْفَعُ التَّعْشِيرُ إن حُمّ واقعٌ ولا وَدَعٌ يُغْنِي ولا كَعْبُ أرْنَب ومنها تعليق الحُلِّ …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 2، ص 404، يذكر نقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 2, p. 404, that mentions the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 2، ص 404 کا اقتباس جس میں مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen 2, pág. 404, que menciona los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Subh al-A'sha d'al-Qalqashandi (tome 2, p. 404) mentionne la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation, cité dans un intervalle de quarante mots conformément à la politique relative aux sources. Cette information figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Qalqashandi'nin Subh al-A'sha adlı eserinin Resimli Cilt 2, sayfa 404'teki bir alıntısında, Kur'an'ın diyakritik işaretleri ve biçiminden bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Subh al-A'sha karya Al-Qalqashandi, Jilid 2 Bergambar, hlm. 404, menyebutkan tanda diakritik dan bentuk Al-Qur'an; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan diakritik."
