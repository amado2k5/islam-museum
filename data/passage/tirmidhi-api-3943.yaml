text: "حَدَّثَنَا زَيْدُ بْنُ أَخْزَمَ الطَّائِيُّ، قَالَ حَدَّثَنَا عَبْدُ الْقَاهِرِ بْنُ شُعَيْبٍ، قَالَ حَدَّثَنَا هِشَامٌ، عَنِ الْحَسَنِ، عَنْ عِمْرَانَ بْنِ حُصَيْنٍ، قَالَ مَاتَ النَّبِيُّ وَهُوَ يَكْرَهُ ثَلاَثَةَ أَحْيَاءٍ ثَقِيفًا وَبَنِي حَنِيفَةَ وَبَنِي أُمَيَّةَ. هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3943، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3943 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3943، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
