label: { ar: "الموطأ 106 — ابن عمر: القبلة والجس باليد من الملامسة وفيهما الوضوء", en: "Muwatta 106" }
text: "قبلة الرجل امرأته وجسها بيده من الملامسة، فمن قبل امرأته أو جسها بيده فعليه الوضوء"
summary:
  ar: "أول أثر في باب الوضوء من قبلة الرجل امرأته. يرويه يحيى عن مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه عبد الله بن عمر أنه كان يعدّ قبلة الرجل امرأته ولمسها بيده من الملامسة التي تذكرها آية الوضوء، فمن قبّل امرأته أو لمسها بيده فعليه الوضوء. ويذكر المحقق أنه رواه عن مالك أحمد بن إسماعيل عند الدارقطني وأبو مصعب وسويد والشافعي عند البيهقي، وأن عبد الرزاق وابن أبي شيبة روياه من طريق الزهري بمعناه، وأن الدارقطني ذكر آثاراً أخرى عن ابن عمر بهذا المعنى. {cite:muwatta-maruf-1997 p.87}"
