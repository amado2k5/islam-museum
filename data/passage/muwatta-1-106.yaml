text: "قبلة الرجل امرأته وجسها بيده من الملامسة، فمن قبل امرأته أو جسها بيده فعليه الوضوء"
summary:
  ar: "أول أثر في باب الوضوء من قبلة الرجل امرأته. يرويه يحيى عن مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه عبد الله بن عمر أنه كان يعدّ قبلة الرجل امرأته ولمسها بيده من الملامسة التي تذكرها آية الوضوء، فمن قبّل امرأته أو لمسها بيده فعليه الوضوء. ويذكر المحقق أنه رواه عن مالك أحمد بن إسماعيل عند الدارقطني وأبو مصعب وسويد والشافعي عند البيهقي، وأن عبد الرزاق وابن أبي شيبة روياه من طريق الزهري بمعناه، وأن الدارقطني ذكر آثاراً أخرى عن ابن عمر بهذا المعنى. {cite:muwatta-maruf-1997 p.87}"
  tr: "Abdestle ilgili ilk hadis, bir erkeğin karısını öpmesiyle ilgilidir. Yahya, Malik'ten, o da İbn Şihab'tan, o da Salim ibn Abdullah'tan, o da babası Abdullah ibn Ömer'den rivayet ettiğine göre, bir erkeğin karısını öpmesini ve eliyle ona dokunmasını, abdestle ilgili ayette geçen dokunma eylemleri arasında saymıştır. Dolayısıyla, karısını öpen veya eliyle ona dokunan kimse abdest almalıdır. Araştırmacı, bunun Malik'ten Ahmed ibn İsmail tarafından Darakutni'nin hadis derlemesinde, Ebu Musab, Suveyd ve Şafiî tarafından ise Beyhaki'nin hadis derlemesinde rivayet edildiğini belirtmektedir. Ayrıca, Abdülrazzak ve İbn Ebi Şeybe'nin de Zühri aracılığıyla benzer bir anlamda rivayet ettiği ve Darakutni'nin İbn Ömer'den bu anlamda başka hadisler de zikrettiği belirtilmektedir. {cite:muwatta-maruf-1997 s.87}"
  id: "Hadits pertama tentang wudhu adalah tentang seorang pria mencium istrinya. Diriwayatkan oleh Yahya dari Malik, dari Ibnu Shihab, dari Salim ibn Abdullah, dari ayahnya, Abdullah ibn Umar, bahwa ia menganggap seorang pria yang mencium istrinya dan menyentuhnya dengan tangannya termasuk dalam perbuatan menyentuh yang disebutkan dalam ayat tentang wudhu. Oleh karena itu, siapa pun yang mencium istrinya atau menyentuhnya dengan tangannya wajib berwudhu. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Ahmad ibn Ismail dalam kumpulan al-Daraqutni, dan oleh Abu Musab, Suwaid, dan al-Shafi'i dalam kumpulan al-Bayhaqi. Disebutkan juga bahwa Abd al-Razzaq dan Ibnu Abi Shaybah meriwayatkannya melalui al-Zuhri dengan makna yang serupa, dan bahwa al-Daraqutni menyebutkan hadits-hadits lain dari Ibnu Umar dengan makna yang sama. {mengutip:muwatta-maruf-1997 hal.87}"
