text: "… يومئذ، فقرنها عبدُ اللّٰه بسيفه، فلم تزل معه، حتى إذا مات أمر بها فضمَّت معه في كفنه ثم دُفنا جميعاً. ذكر ما كان في فتح مكة : - حدثنا سليمان بن أحمد إملاءً ثنا محمد بن يونس العُصفري ثنا أحمد …"
summary:
