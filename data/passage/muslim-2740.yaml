text: "قال أسامة بن زيد وسعيد بن زيد عن رسول الله: ما تركت بعدي في الناس فتنة أضر على الرجال من النساء"
summary:
  ar: "رواية أسامة بن زيد وسعيد بن زيد في باب قوله إن الدنيا حلوة خضرة من كتاب الرقائق في صحيح مسلم؛ التحذير من أعظم الفتن على الرجال."
  tr: "Sahih Müslim'in Kalpleri Yumuşatan Kitabı'nda, Usame bin Zeyd ve Said bin Zeyd'in, dünyanın tatlı ve yeşil olduğu sözüyle ilgili bölümünde rivayet edilen, insanlar için en büyük imtihanlardan sakınma uyarısı."
  id: "Riwayat Usama bin Zaid dan Saeed bin Zaid dalam bab tentang ucapannya bahwa dunia ini manis dan hijau dari Kitab Penyejuk Hati dalam Sahih Muslim; sebagai peringatan terhadap cobaan terbesar bagi manusia."
