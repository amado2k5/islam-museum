label: { ar: "جامع الترمذي 1610 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 1610 — what was left behind: estate and inheritance", ur: "جامع ترمذی 1610 — ترکہ اور میراث", es: "Jami' al-Tirmidhi 1610 — lo que dejó: patrimonio y herencia", fr: "Jami' al-Tirmidhi 1610 — ce qui a été laissé derrière: biens et héritage", tr: "Cami' el-Tirmizi 1610 — Miras ve vasiyet olarak geride bıraktıkları", id: "Jami' al-Tirmidhi 1610 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… وَالْعَبَّاسُ يَخْتَصِمَانِ فَقَالَ عُمَرُ لَهُمْ أَنْشُدُكُمْ بِاللَّهِ الَّذِي بِإِذْنِهِ تَقُومُ السَّمَاءُ وَالأَرْضُ تَعْلَمُونَ أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَاهُ صَدَقَةٌ \". قَالُوا نَعَمْ. قَالَ عُمَرُ فَلَمَّا تُوُفِّيَ رَسُولُ اللَّهِ قَالَ أَبُو بَكْرٍ أَنَا وَلِيُّ رَسُولِ اللَّهِ. فَجِئْتَ أَنْتَ وَهَذَا إِلَى أَبِي بَكْرٍ تَطْلُبُ أَنْتَ مِيرَاثَكَ مِنَ ابْنِ أَخِيكَ وَيَطْلُبُ هَذَا مِيرَاثَ امْرَأَتِهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1610، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1610 (The Book on Military Expeditions), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1610، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 1610 (El Libro de las Expediciones Militares), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1610 (Livre des expéditions militaires), mentionne ce qui a été laissé derrière soi: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'nin 1610 numaralı hadisinde, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, eski eserler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1610, menyebutkan apa yang ditinggalkannya berupa harta warisan. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, barang antik, dan makam suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
