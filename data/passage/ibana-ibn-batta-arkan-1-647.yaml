text: "… أبي صالح، عن أبي هريرة، قال: قال رسول اللّٰه عَطيفِ : الإيمان بضع وستون أو بضع وسبعون شعبة أفضلها شهادة أن لا إله إلا اللّٰه وأدناها إماطة الأذى عن الطريق والحياء شعبة من الإيمان. - حدثنا القاضي المحاملي، قال: نا …"
