text: "… الغراب أحوج منّا ذهب وامرأتَهُ لِغسلِ أمتعتِهِما على شاطئ بحُيرةٍ، فلَّما وصلا ووضعا الأمتعة وجعلا عليها الصابون، انقض غرابٌ فاختطفَ لوح الصابون، وذهب به طائراً في الفضاء. فصاحتِ امرأةُ جحا: قُمْ إلحق، الغراب سرق الصابون. وجعلتْ تُكثِرُ من الصياحِ فأجابَها …"
summary:
  ar: "سرق غراب الصابون أثناء غسلهم الثياب، فقال جحا إن ثياب الغراب أوسخ من ثيابهم فهو أحوج إلى الصابون. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  en: "A crow steals the soap while they wash clothes; Juha says the crow's clothes are dirtier than theirs, so it needs the soap more. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  ur: "کپڑے دھوتے وقت ایک کوا صابن اٹھا لے گیا؛ جحا نے کہا کہ کوے کے کپڑے ان کے کپڑوں سے زیادہ میلے ہیں، اس لیے اسے صابن کی زیادہ ضرورت ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  fr: "Un corbeau vole le savon pendant qu'ils lavent le linge ; Juha dit que les vêtements du corbeau sont plus sales que les leurs, donc qu'il a plus besoin du savon. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
  es: "Un cuervo roba el jabón mientras lavan la ropa; Juha dice que la ropa del cuervo está más sucia que la suya, así que necesita más el jabón. {cite:juha-nawadir-kubra-djuwaydi p. 34}"
