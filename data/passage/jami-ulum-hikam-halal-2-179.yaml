text: "الحديث السادس ويتفرعُ على هذا معاملة من في ماله حلال وحرام مختلط، فإنْ كان أكثرُ ماله الحرامَ، فقال أحمد : ينبغي أنْ يجتنبه إلا أنْ يكونَ شيئاً يسيراً، أو شيئاً لا يعرف، واختلف أصحابنا : هل هو مكروه أو محرَّم …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 179، يذكر الحلال، والحرام، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
