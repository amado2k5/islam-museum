  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 179 کا اقتباس جس میں حلال، حرام، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
