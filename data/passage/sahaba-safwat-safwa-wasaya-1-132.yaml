text: "… في قصره بالعقيق على عشرة أميال من المدينة، فحْمِل على رقاب الرجال إلى المدينة، وصلى عليه مروان بن الحكم وهو يومئذ والي المدينة، ثم صلى عليه أزواج النبي وَيخ في حُجَرهن، ودفن بالبقيع، وكان أوصى أن يكفن في جبة صوف …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 132، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 1, p. 132, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 1، ص 132 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sifat al-Safwa de Ibn al-Jawzi, volumen 1, pág. 132, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Sifat al-Safwa d'Ibn al-Jawzi (tome 1, p. 132) mentionnant un testament ou des dernières volontés, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn el-Cevzi'nin \"Sifat el-Safva\" adlı eserinin 1. cildinin 132. sayfasında vasiyetname, defin, mezar ve türbeden bahsedilmektedir; bu metin, makineyle okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Jawzi, \"Sifat al-Safwa,\" Jilid 1, halaman 132, menyebutkan surat wasiat atau testamen terakhir, pemakaman, kuburan, dan makam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Surat Wasiat, Warisan, Barang Antik, dan Makam\"."
