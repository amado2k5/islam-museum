text: "… أبناء السَّبِيل في سورة براءة، وبالله الثِّقة وعليه التُكلان. وقوله: وَمَا مَلَكَتْ أَيْمَنُكُمْ وصية بالأَرِقَّاء؛ لأنَّ الرَّقيق ضَعيف الجَنبهِ أسير في أيدي الناس، ولهذا ثبت أن رسول اللّٰه وَلفي جعل يُوصِي أُمَّتَه في مرضِ الموت يقول: الصَّلَاةَ الصَّلَاةَ وَمَا مَلَكَتْ …"
