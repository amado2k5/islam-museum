text: "… فالذى يتكلم به، وأما الظن الذى ليس فيه إتم، فالذى لا يتكلم به. حد أناسليمان بن أحمد ثنا ها شم بن مرندثنا أبو صالح الفراء ثنا يوسف ابن أسباط. قال :كنت عند سفيان الثورى فورد عليه نعى أبى حنيفة فقال …"
summary:
  ar: "مقطع من حلية الأولياء وطبقات الأصفياء، المجلد المصوَّر 7، ص 16، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym), scan volume 7, p. 16, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "حلیۃ الاولیاء و طبقات الاصفیاء ⁦(ابو نعیم)⁩، اسکین جلد 7، ص 16 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym), volume numérisé 7, p. 16, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Hilyat al-Awliya' wa-Tabaqat al-Asfiya' (Abu Nu'aym), volumen escaneado 7, p. 16, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Hilyat al-Awliya' wa Tabaqat al-Asfiya' adlı eserin 7. resimli cildinin 16. sayfasından, bir ağıt ve ölüm duyurusu içeren bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Hilyat al-Awliya' wa Tabaqat al-Asfiya', jilid bergambar 7, halaman 16, berisi eulogi dan pengumuman kematian; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
