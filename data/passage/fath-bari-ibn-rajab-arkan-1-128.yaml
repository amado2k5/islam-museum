text: "كتاب الايمان المنصوص عن أحمدَ أنَّه لا يُكَفَّرُ تَاركَ الصلاةِ؛ فالصلاة من خصالِ الإيمانِ دون الإسلامِ وكذلك اجتنابُ الكائرِ من شرائطِ الإيمانِ دون الإسلامِ. كذا قال، وأكثر أصحابِنا أنَّ ظاهرَ مذهب أحمدَ تكفيرُ تاركِ الصلاةِ، فلو لم تكن الصلاةُ من …"
