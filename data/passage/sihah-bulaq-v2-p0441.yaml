text: |-
  السجدل على وزن الهبف الفهم
  من الضبة قالهالمؤلف
  ١ ى نضة زيادة ابن أحراه
  ١٤٦
  •فسل النون)•
  ويقال أيضا الماءملن امر أى يقوم به الدمر قال أبو وجزة
  ولم يكن لك للقوم ينزاهم • الاصلاصل لا تلوى على حسب
  ومالا الحزين اسم طائر من طير الماء والمالسكان مالك بن زيد ومالك بن حنظلة
  صل النون ت النبك بالتجريك بجع نبكة وهى أكمة محدّدة الرأس قال أبو عمرو
  النبال التسلال الصغار ومكان نابن أى مرتفع ومنه قول ذى الرقّة • الهضاب النوابك•
  ن ل) التزل بالكسر ذكر الضب تزعم العرب أن لهنز كين وينشد
  سيجل له نزكان كانا فضيلة • على كل ساف فى البلادونا عل
  والنيزل" رمح قصير كانه فارسىّ معرب وقد ت كامت به الفصحاء والمع القيازك وقد نزكداى
  طعنه وكذاك اذا نز غه وطعن فيه بالقول ورجل نزاكك أى عباب سك نسكت
  الشغسلته بالماء وطهرته فهو منسوك -معته من بعض أهل العلم وأنند
  ولا تنبت المرعى سباخ عراءر • ولونسكت بالماستة أشهر
  والنسلك العبادة والناسك العابد وقدنسك وتنسك أى تعبدونن بالضم نساكة أى صار
  ناسكا والذمكة الذبيحة والجمع نسك ونسائك تقول منه نسك للّه ينسك والمذسك والمنسك
  الوضع الذى تذيح فيه النسائك وقرئ به ما قوله تعالى امكل أمّة جعلنا منكاهم ناسكو.
  ك النول بالضم الهق قال قيس بن انخطيم * وداء النوك ليس لهدوا** والنواكة
  الحماقة ورجل أنول ومستنوك أى أحو وقوم نوكى ونوك أيضا على اقباس مثل أهوج
  وهوج وقد أنوكته أى وجسدته أنولْ وقالوا ما أنو كه ولم بقولوا أنوك به وهوقياس عن ابن
  لسراج ⁦(نهك)⁩ نهكت الثوب بالفتح أنهكهنم-كالبسته -ق خلق ونهكت من الطعام
  أيضا بالغت فى أكله ويقال انهل من هذا الطعام وكذلك انهك، رضه أى بالسغ فى
  شتمه و يقال أيضانهسكنه الحى اذاجهدته وأضنته ونقصت ل» وفيه لغة أخرى نهكته الحى
  بالكسر تنهكه نهكاد نهكة وقد نهك أى دنف وضى ف، ومنهوك يق سال بانت عليه نهكة المرض
  بالفتح ونمكه السلطان أيضاعة وية ينه كه نهكاونهكة أى بالغ فى عشوبته وفى الحديث انهكوا
  الاعقاب أولتنهكنها النارأى بالغوافى غساها وتنظيفها فى الوضو وكذلك يقار فى الحث
  على القتال انهكواوجوه القوم يعنى اجهدوهم أى ابلغواجهدهم ورجل نهيل أى شجاع
  الانه ينهك عدوه أى يبالغ فيه وقد نهك بالضم ينه-ك نهاكذ أى صارشجاعا والاسدنهيك
  وسيف تهيك أى قاطع وانتهال الحرمة تناولها بمالا يحسل ( ن ك رجل نائك من
  النيك وييالتشدد للكثرة وفى المثل من ينك العبرينك نياكا
  صل الواد دك الودل دسم التحسم ودجاجة وديكة أى سمينة وديك
  وديك وولهم ما أدرى أى أودك هو أى أىّ الناس هو والودكاءرملة أوموضع قال
  الشاءر ١ أم كنت تعرف آيات فقد جعلت * أطلال الفك بالود كاء تعتذر
  قوله تعتذرأى تدرس ⁦(ورك)⁩ الورك مافوق الفخذوهى. ؤننة وقد تخفف مثل نغذ
  ونفخذ قار الراجز * مابين وركيهاذراعاءر ضا وربعاه لواثى وركه فنزل وقدورليرك
  وروكا أى اضطيع كأنه وضع وركه على الارض والتورت لا على المنى وضع الورك فى الصلاة
