label: { ar: "الموطأ 233 — إذا قال أحدكم آمين وقالت الملائكة في السماء آمين", en: "Muwatta 233" }
text: "إذا قال أحدكم: آمين، وقالت الملائكة في السماء: آمين، فوافقت إحداهما الأخرى، غفر له ما تقدم من ذنبه"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب ما جاء في التأمين خلف الإمام: أخبر النبي أن من قال آمين فوافق تأمينه تأمين الملائكة في السماء غُفر له ما تقدم من ذنبه. ويخرّجه المحقق عند البخاري (781) والنسائي (2/144) وأحمد والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (18/348). {cite:muwatta-maruf-1997 p.141}"
