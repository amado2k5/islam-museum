label: { ar: "الموطأ 233 — إذا قال أحدكم آمين وقالت الملائكة في السماء آمين", en: "Muwatta 233", es: "Muwatta 233", fr: "Muwatta 233", ur: "موطا 233", tr: "El-Muvatta 233 — Eğer sizden biri “Âmin” derse ve gökteki melekler de “Âmin” derse...", id: "Al-Muwatta 233 — Jika salah seorang dari kalian mengucapkan “Amin” dan para malaikat di langit pun mengucapkan “Amin”" }
text: "إذا قال أحدكم: آمين، وقالت الملائكة في السماء: آمين، فوافقت إحداهما الأخرى، غفر له ما تقدم من ذنبه"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، في باب ما جاء في التأمين خلف الإمام: أخبر النبي أن من قال آمين فوافق تأمينه تأمين الملائكة في السماء غُفر له ما تقدم من ذنبه. ويخرّجه المحقق عند البخاري (781) والنسائي (2/144) وأحمد والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (18/348). {cite:muwatta-maruf-1997 p.141}"
  tr: "Malik, imamın arkasından \"Âmin\" demenin rivayet edildiği bölümde, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan naklettiği hadislerde şöyle buyurmuştur: Peygamberimiz bize, \"Âmin\" diyen ve bu \"Âmin\"i gökteki meleklerin \"Âmin\"iyle aynı anda söyleyenin geçmiş günahlarının affedileceğini bildirmiştir. Editör, bu hadisi Malik'in sahabelerinin rivayet zincirleriyle Buhari (781), Nesai (2/144), Ahmed, Şafiî ve Beyhaki'nin derlemelerine dahil etmiş ve Temhid'e (18/348) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.141}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, dalam surah tentang apa yang diriwayatkan tentang mengucapkan \"Amin\" di belakang imam: Nabi memberitahukan kepada kita bahwa siapa pun yang mengucapkan \"Amin\" dan \"Amin\"-nya bertepatan dengan \"Amin\" para malaikat di langit, dosa-dosa masa lalunya akan diampuni. Editor memasukkannya dalam kumpulan al-Bukhari (781), al-Nasa'i (2/144), Ahmad, al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (18/348). {cite:muwatta-maruf-1997 p.141}"
