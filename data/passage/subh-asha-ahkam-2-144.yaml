text: "الجزء الأول أنا كاتبُ رسائلَ - قال : فإن أخًا مِن إخوانك واجبَ الحقِّ عليك معتنيا بأمورك لا يُغْفَل منها عن صغير ولا كبير يكاتبك فى كل محبوب ومكروه وأنت له علىٰ مثل ذلك تزوّجتْ أمّه كيف تكتب إليه ؟ …"
summary:
  ar: "مقطع من صبح الأعشى للقلقشندي، المجلد المصوَّر 2، ص 144، يرد فيه ذكر الواجب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qalqashandi's Subh al-A'sha, scan volume 2, p. 144, whose wording mentions the obligatory (wajib), the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "صبح الاعشیٰ، قلقشندی، اسکین جلد 2، ص 144 کا اقتباس جس میں واجب، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Subh al-A'sha de al-Qalqashandi, volume numérisé 2, p. 144, dont le texte mentionne l'obligatoire (wajib), le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Subh al-A'sha de al-Qalqashandi, volumen digitalizado 2, p. 144, cuyo texto menciona lo obligatorio (wajib), lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kalkaşandi'nin Subh el-A'şa adlı eserinin Resimli Cilt 2, s. 144'ten, farz ve mekruh amellerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh amelleri, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Subh al-A'sha karya al-Qalqashandi, Jilid Bergambar 2, hlm. 144, yang menyebutkan amalan wajib dan amalan yang tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
