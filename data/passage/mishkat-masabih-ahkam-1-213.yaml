text: "… -واجبة التبليغ، فالحديث أولى بذلك؛ إذ لا شيء مما ذكر فيه. حس ليس في الحديث إباحة الكذب على بني إسرائيل، بل: معناه الرخصة في الحديث بلا إسناد؛ لأنه أمر قد تعذر في الإخبار عنهم بطول المدة، ووقوع الفترة، وفيه إيجاب …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 213، يرد فيه ذكر الواجب، والوجوب، والمباح، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 213, whose wording mentions the obligatory (wajib), obligation (wujub), the permitted (mubah), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 213 کا اقتباس جس میں واجب، وجوب، مباح، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 1, p. 213, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), le permis (mubah), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
