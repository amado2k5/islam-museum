label: { ar: "مسلم 179 — إن الله لا ينام ولا ينبغي له أن ينام؛ حجابه النور", en: "Muslim 179 — God does not sleep; His veil is light" }
text: "قام فينا رسول الله بأربع، قال: «إن الله لا ينام ولا ينبغي له أن ينام، يخفض القسط ويرفعه، يرفع إليه عمل الليل قبل عمل النهار وعمل النهار قبل عمل الليل، حجابه النور، لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه»"
summary:
  ar: "رواية أبي موسى الأشعري في كتاب الإيمان من صحيح مسلم؛ خطبة النبي بأربع كلمات في الصفات الإلهية — لا ينام، يخفض القسط ويرفعه، وحجابه النور."
