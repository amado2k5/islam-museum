label: { ar: "مسلم 179 — إن الله لا ينام ولا ينبغي له أن ينام؛ حجابه النور", en: "Muslim 179 — God does not sleep; His veil is light", es: "Musulmán 179 — Dios no duerme; su velo es luz.", fr: "Muslim 179 — Dieu ne dort pas; Son voile est lumière", ur: "مسلم 179 - خدا نہیں سوتا۔ اس کا پردہ نور ہے۔", tr: "Müslim 179 — Allah uyumaz, uyumamalıdır da; örtüsü ışıktır.", id: "Muslim 179 — Allah tidak tidur, dan tidak seharusnya Dia tidur; tabir-Nya adalah cahaya." }
text: "قام فينا رسول الله بأربع، قال: «إن الله لا ينام ولا ينبغي له أن ينام، يخفض القسط ويرفعه، يرفع إليه عمل الليل قبل عمل النهار وعمل النهار قبل عمل الليل، حجابه النور، لو كشفه لأحرقت سبحات وجهه ما انتهى إليه بصره من خلقه»"
summary:
  ar: "رواية أبي موسى الأشعري في كتاب الإيمان من صحيح مسلم؛ خطبة النبي بأربع كلمات في الصفات الإلهية — لا ينام، يخفض القسط ويرفعه، وحجابه النور."
  tr: "Ebu Musa el-Eş'ari'nin Sahih Müslim'den rivayet ettiği İman Kitabı'nda, Peygamberimizin ilahi sıfatlar hakkındaki dört kelimelik hutbesi şöyledir: \"O uyumaz, teraziyi indirir ve kaldırır, örtüsü ise nurdur.\""
  id: "Diriwayatkan oleh Abu Musa al-Ash’ari dalam Kitab Iman dari Sahih Muslim; khutbah Nabi dalam empat kata tentang sifat-sifat ilahi — Dia tidak tidur, Dia menurunkan dan menaikkan timbangan, dan tabir-Nya adalah cahaya."
