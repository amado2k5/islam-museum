label: { ar: "جامع الترمذي 2291 — عدد الحسنات", en: "Jami' al-Tirmidhi 2291 — a stated number of good deeds", ur: "جامع ترمذی 2291 — نیکیوں کی مقررہ تعداد" }
text: "… النَّبِيِّ قَالَ \" فِي آخِرِ الزَّمَانِ لاَ تَكَادُ رُؤْيَا الْمُؤْمِنِ تَكْذِبُ وَأَصْدَقُهُمْ رُؤْيَا أَصْدَقُهُمْ حَدِيثًا وَالرُّؤْيَا ثَلاَثٌ الْحَسَنَةُ بُشْرَى مِنَ اللَّهِ وَالرُّؤْيَا يُحَدِّثُ الرَّجُلُ بِهَا نَفْسَهُ وَالرُّؤْيَا تَحْزِينٌ مِنَ الشَّيْطَانِ فَإِذَا رَأَى أَحَدُكُمْ رُؤْيَا يَكْرَهُهَا فَلاَ يُحَدِّثْ بِهَا أَحَدًا وَلْيَقُمْ فَلْيُصَلِّ \". قَالَ أَبُو هُرَيْرَةَ \" يُعْجِبُنِي الْقَيْدُ وَأَكْرَهُ الْغُلَّ الْقَيْدُ ثَبَاتٌ فِي الدِّينِ \". …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2291، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2291 (Chapters On Dreams), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2291، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
