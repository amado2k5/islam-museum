label: { ar: "جامع الترمذي 2291 — عدد الحسنات", en: "Jami' al-Tirmidhi 2291 — a stated number of good deeds", ur: "جامع ترمذی 2291 — نیکیوں کی مقررہ تعداد", es: "Jami' al-Tirmidhi 2291 — un número determinado de buenas obras", fr: "Jami' al-Tirmidhi 2291 — un nombre déterminé de bonnes actions", tr: "Cami' el-Tirmizi 2291 — İyi amellerin sayısı", id: "Jami' al-Tirmidhi 2291 — Jumlah amal kebaikan" }
text: "… النَّبِيِّ قَالَ \" فِي آخِرِ الزَّمَانِ لاَ تَكَادُ رُؤْيَا الْمُؤْمِنِ تَكْذِبُ وَأَصْدَقُهُمْ رُؤْيَا أَصْدَقُهُمْ حَدِيثًا وَالرُّؤْيَا ثَلاَثٌ الْحَسَنَةُ بُشْرَى مِنَ اللَّهِ وَالرُّؤْيَا يُحَدِّثُ الرَّجُلُ بِهَا نَفْسَهُ وَالرُّؤْيَا تَحْزِينٌ مِنَ الشَّيْطَانِ فَإِذَا رَأَى أَحَدُكُمْ رُؤْيَا يَكْرَهُهَا فَلاَ يُحَدِّثْ بِهَا أَحَدًا وَلْيَقُمْ فَلْيُصَلِّ \". قَالَ أَبُو هُرَيْرَةَ \" يُعْجِبُنِي الْقَيْدُ وَأَكْرَهُ الْغُلَّ الْقَيْدُ ثَبَاتٌ فِي الدِّينِ \". …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2291، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2291 (Chapters On Dreams), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2291، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2291 (Capítulos sobre los sueños), que habla de una cantidad específica de buenas acciones. El Libro de Hasanat y Sayyi'at lo incluye junto con los textos que cuentan, escriben, borran o ponderan una acción."
  fr: "Un récit du Jami' al-Tirmidhi, n° 2291 (Chapitres sur les rêves), mentionne un nombre précis de bonnes actions. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptent, écrivent, effacent ou pèsent une action."
  tr: "Cami' el-Tirmizi'de 2291 numaralı hadis, iyi amellerin sayısından bahseder. Bu hadis, iyi ve kötü amellerin bir listesini ve bu amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2291, menyebutkan jumlah amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
