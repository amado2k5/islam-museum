label: { ar: "الموطأ 2508 — مالك: أصابع الكف إذا قُطعت تم عقلها بخمسين من الإبل", en: "Muwatta 2508", es: "Muwatta 2508", fr: "Muwatta 2508", ur: "موطا 2508", tr: "El-Muvatta 2508 — Malik: Eğer elin parmakları kesilirse, tazminat elli devedir.", id: "Al-Muwatta 2508 — Malik: Jika jari-jari tangan dipotong, kompensasinya adalah lima puluh unta." }
summary:
  ar: "قال مالك: الأمر عندنا في أصابع الكف إذا قُطعت فقد تم عقلها، وذلك أن خمس أصابع إذا قُطعت كان عقلها عقل الكف: خمسين من الإبل، في كل إصبع عشر من الإبل. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
  tr: "Malik şöyle dedi: El parmaklarıyla ilgili hükmümüz şudur ki, eğer kesilirlerse tazminat tamdır. Çünkü beş parmak kesilirse, tazminat tüm el için olduğu gibi aynıdır: elli deve, her parmak için on deve. {cite:muwatta-maruf-1997 s.430} {cite:muwatta-maruf-1997 s.431}"
  id: "Malik berkata: Hukum kami mengenai jari-jari tangan adalah jika jari-jari tersebut dipotong, maka ganti ruginya lengkap. Hal ini karena jika lima jari dipotong, ganti ruginya sama dengan seluruh tangan: lima puluh unta, sepuluh unta untuk setiap jari. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
