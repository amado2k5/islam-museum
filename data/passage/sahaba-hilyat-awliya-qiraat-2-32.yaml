text: "… أبى أسامة ثنا هوذة بن خليفة ثنا عوف الأعرابي عن أبى المنهال. قال : ما كان زمن أخرج ابن زياد وثب مروان بالشام، وابن الزبير عسكة، ووثب الذين كانوا يدعون القراء بالبصرة غم أبى غما شديداً - وكان يثف على …"
