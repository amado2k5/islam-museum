label: { ar: "الموطأ 1835 — مالك: لا يصلح أن يشتري الحائط فيه العجوة والكبيس والعذق ثم يستثني نخلة يختارها، لأن ذلك يفضي إلى تفاضل في التمر، فكأنه اشترى العجوة بالكبيس متفاضلا", en: "Muwatta 1835", es: "Muwatta 1835", fr: "Muwatta 1835", ur: "موطا 1835", tr: "El-Muvatta 1835 — Malik: Hurma, hurma ağacı ve hurma salkımları içeren bir duvar satın alıp, kendi seçtiği bir hurma ağacını dışarıda bırakmak caiz değildir; çünkü bu, hurmaların kalitesinde farklılığa yol açar, sanki farklı kalitede hurma satın almış gibi olur.", id: "Al-Muwatta 1835 — Malik: Tidak diperbolehkan membeli sebidang tanah berisi kurma, pohon kurma, dan tandan kurma, lalu mengeluarkan satu pohon kurma pilihannya, karena hal itu menyebabkan perbedaan kualitas kurma, seolah-olah ia membeli kurma dengan kualitas yang berbeda." }
summary:
  ar: "سئل مالك عن الرجل يشتري من الرجل الحائط، فيه ألوان من النخل، مثل العجوة والكبيس والعذق، وغير ذلك من ألوان التمر، فيستثني منها ثمر النخلة أو النخلات يختارها من نخله؟ فقال مالك: ذلك لا يصلح. لأنه إذا صنع ذلك ترك ثمر النخلة من العجوة، ومكيلة ثمرها خمسة عشر صاعا، وأخذ مكانها ثمر نخلة من الكبيس، ومكيلة ثمرها عشرة آصع. فإن أخذ العجوة التي فيها خمسة عشر صاعا، وترك التي فيها عشرة آصع من الكبيس، فكأنه اشترى العجوة بالكبيس متفاضلا. {cite:muwatta-maruf-1997 p.153}"
  tr: "Malik'e, çeşitli hurma türleri (Ajwa, Kubais, Adhq ve diğer çeşitler gibi) içeren duvarla çevrili bir bahçeyi başka bir adamdan satın alan bir adam hakkında soru soruldu. Adam, kendi bahçesindeki hurma ağaçlarından bir veya birkaçının meyvesini ayırıyor. Malik şöyle cevap verdi: Bu caiz değildir. Çünkü bunu yaparsa, ölçüsü on beş sa olan Ajwa hurmalarını bırakıp yerine ölçüsü on sa olan Kubais hurmalarını alır. Eğer on beş sa ağırlığındaki Ajwa hurmalarını alıp on sa ağırlığındaki Kubais hurmalarını bırakırsa, Ajwa hurmalarını Kubais hurmalarıyla eşitsiz bir fiyata almış gibi olur. {cite:muwatta-maruf-1997 s.153}"
  id: "Malik ditanya tentang seorang pria yang membeli dari pria lain sebuah kebun berpagar yang berisi berbagai jenis kurma, seperti 'Ajwa, Kubais, dan 'Adhq, serta varietas lainnya. Kemudian, ia mengambil buah dari satu atau lebih pohon kurma yang dipilihnya dari kebunnya sendiri. Malik menjawab: Ini tidak diperbolehkan. Karena jika ia melakukan ini, ia meninggalkan kurma 'Ajwa yang ukurannya lima belas sa', dan menggantinya dengan kurma Kubais yang ukurannya sepuluh sa'. Jika ia mengambil kurma 'Ajwa yang beratnya lima belas sa' dan meninggalkan kurma Kubais yang beratnya sepuluh sa', maka seolah-olah ia membeli kurma 'Ajwa untuk kurma Kubais dengan harga yang tidak sama. {cite:muwatta-maruf-1997 p.153}"
