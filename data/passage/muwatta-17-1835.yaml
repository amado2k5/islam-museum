label: { ar: "الموطأ 1835 — مالك: لا يصلح أن يشتري الحائط فيه العجوة والكبيس والعذق ثم يستثني نخلة يختارها، لأن ذلك يفضي إلى تفاضل في التمر، فكأنه اشترى العجوة بالكبيس متفاضلا", en: "Muwatta 1835" }
summary:
  ar: "سئل مالك عن الرجل يشتري من الرجل الحائط، فيه ألوان من النخل، مثل العجوة والكبيس والعذق، وغير ذلك من ألوان التمر، فيستثني منها ثمر النخلة أو النخلات يختارها من نخله؟ فقال مالك: ذلك لا يصلح. لأنه إذا صنع ذلك ترك ثمر النخلة من العجوة، ومكيلة ثمرها خمسة عشر صاعا، وأخذ مكانها ثمر نخلة من الكبيس، ومكيلة ثمرها عشرة آصع. فإن أخذ العجوة التي فيها خمسة عشر صاعا، وترك التي فيها عشرة آصع من الكبيس، فكأنه اشترى العجوة بالكبيس متفاضلا. {cite:muwatta-maruf-1997 p.153}"
