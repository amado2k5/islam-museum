text: |-
  أخوها أبوها والضوى لا يضيرها * وساف أبيها أتهاعقرت عقرا
  وقد ضوى بالكسر يضوى ضوى وغلام ضاوىّ وزنه فاعول اذا كان غعيفا فليسل الجسم
  خلقة وفيه ضاوية وجارية ضاوية وفى الحديث اعتربوالاتضووا أى تزوّجوا فى الاجنبيات
  ولا تتزوجوا فى العمومة وذلك أنّ العرب تزعم أنّ ولد الرجل من قرابته يجى ضا وبانحيفا
  غير أنه يجى كريما على طبع قومه قال الشاعر
  ذاك عبيد قد أصاب ميا * باليته ألقحهاصبيا * فجملت فولدت ضاويا
  ⁦(ضهى)⁩ الضهياء مدود شجر والضهياء أيضا المرأة التى لا تحيض وحكى أبوع روامرأة
  ضهيات وضهياة بالتاء والهاء قال وهى التى لا تطمت وهذا يقتضى أن يكون الضهيا مقصورا
  والمضاهاة المشاكلة تهم زولا تهمز بقال ضاهيت وقرى يضاهون قول الذين كفروا وهذا
  ضهى هذا على فعيل أى شيهه
  ( ف صل الطاء ⁦(ط ا)⁩ الطاة مثل الطعاة المأة هكذارأنه على أبى سعيد
  فى المصذف وما بالد ارطونىّ مثال طوعى أى أحد ⁦(طى)⁩ الطبى للسافر وللسباع كالضرع
  غيرها وفى المثل جاوز المحزام الطبين وقديكون أيضالذوات اللخف والطبى بالكسر مثله
  والجع أطباء وطميته عن كذاصرفته عنه وطباه يطبوه ويطسه اذادعاه قال ذو الرمة
  ليالى اللهو بطبين فأسعه * كاننى ضارب فى غمسرة لعب
  يقول يدعوتى اللهو فأتبعه وكذلك اطباه على افتعله ويقال أيضا أطبى بنوفلان فلانا اذا
  خالوه وقتلوه وخلف طبىّ أى مجبب ( ما طحوته مثل دحونه أى بسطته والطها
  مقصور المبسطص الارض والطاحى الممتديقال ضربه ضربة طحامنها أى امتد وقال
  له عسكر طاحى الضفاف عر مرم* والمدومة الطواحى هى النسور تستدير حول القت-لى
  قال أبو عمر وطا الرجل اذاذهب فى الارض يقال ما أدرى أين طحاويقال طحابه قلب
  اذا ذهب به فى كل شئ قال علقمة بن عبدة
  طعابك قلب فى الحسان طروب * بعيد الشباب عصرحان مشيب
  أبو عمر وطحيت أى اضطجعت ذا ، أبو عبيد الطخاء بالمدّالسحاب المرتفع ويقال
  أيضا وجدت على قلى طفاء وهوشبه الغتم والكرب قال اللحيانى ما فى السماء طفية بالضم أى
  نى من سحاب قال وهو مثسل الطهرور والطخياء ممدود الليلة المظلمة وظلام طاخ وتسكلم فلان
  بكامة طخياء أى لا تنهم ⁦(طدا)⁩ عادة طادية أى ثابتة قديمة ويقال هو مقلوب من واطدة
  قال القضامى *وماتقضى يواقى دينها الطادى* والدين الدأب والعادة (طرا شى
  لطمرىّ آى غض بين الطسراوة وطرّيت الثوب نطرية وقال قطرب طرواللحم وطرى طراوة
  طراءة وأطراه أى مدحه وأطريت العسل اذاعقدته وغسلة مطرّاة أى مرباة بالافاويه
  بغسل بها الرأس أواليدو كذلك العود المطرّى ااربى منه مثل المطير يتبخربه والاطرية منال
  الهبرية ضرب من الطعام ويقال هولاخسه ⁦(طفا)⁩ طفايطفى ويطغوطغيانا أى جاوز
  الحد وكل مجاوزحدّه فى العصيان فهو طاغ وطفى يدافى مثله وأطغاء المال أى جعله طاغيا
  ١٢٨
  جماح
