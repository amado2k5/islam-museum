text: |-
  ٢١٩
  ونممت الهاروغيره اذا ألقمت فه ومخخريه القمامة بالكسروهى كالكعام والجع الغمائم
  وغممته اذا غطيته فانغم قال أوس يري ابنه شريها
  على حين أنجدالذ كاء وأدركت • قريحة حسى من شريح مغمم
  والغمة الكرية قال التجاج
  بل لوشهدت الناس اذا تكموا • بغمة لولم تفرج غموا
  بقمال أمرغمة أى مبهم ملتبمر قال تعالى ثم لا يكن أمركم عليكم نمة قال أبو عبيد مجاز ها ظلة
  وضيق وهم والغمة أيضا قعرالنحى وغيره وغم يومنا بالفتح فهويوم غمّ اذا كان يأخذ بالنفس
  من شدة الحرو أغتم يومنامثله وليلة غتمّ أى عامة وصف بالمصدركما تقول ماءغور وحكى أبو
  عبيد عن أبى زيدليلة ثمى بالفتح أيض أمثل كسلى وايلة خمة اذا كان على السماه غمى مثال رمى
  ريوم تمّ وتتمّ عليه الخبر على مالم يسم فاعله أى استهيم مشل أغجمى ويقسال أيضاغمّ الهلال
  على الناس اذاستره عنهم غيم أو غيره فلم ي ويقال صمناللغمى وحكى ابن السكيت عن الفراء
  صمنا للغمى وللغمى بالفح والضم جيعا قال الراجز
  : للة عمى طامس هلالها • أوغلتما ومكره ايغالها
  وصمنا للغماء على فعلاء بالفتح والمد والفعام السحاب الواحدة غمامة وقد أغمت السماءأى
  تغيت والفمم أن يسيل الشهرحتى تضيق الجبهة أوالقفا ورجل أغتم وجبهة غماه قال هدية
  ابن الخشرم فلا تنكمى ان قرق الدهربيننا • أغتم القفا والوجه ليس بأنزعا
  وتكره الغماء من نواصى الخيسل وهى المفرطة فى كثرة الشعر والغميم الغميس و«والكلاً
  قحت اليبيس والغميم لبن يسذن حتى يغلظ وكراع القميمموضع بالحجاز والغمغمة أصوات
  الثيران عند الذعر وأصوات الابطال فى القتال والتغمغم الكلام لا يبين (غنم الغنما-م
  مؤنته وضوع للجنس يقع على الذكور وعلى الانات وعليه ما جيعا واذاصفرتم اأحقتها الهاء
  فقلت غنيمة لان أسماء الهوع التى لا واحدلها من لفظها اذا كانت لغيرالا دميين فالتأنيت
  لهالازم :قال له خصرمن الفتم ذكورقتونت العددوان عنيت الكباش اذا كان يليه من
  الغنمْ لان العدد فى تدْكيره وتأنيشه على اللفظ لا على المعنى والابل كالغتم فى جميع ماذ كرناه
  والمغنم والغنيمة بمعنى يقال غنم القوم غنما بالضم وغنامال أن تفعل كذا أى غايتك والذى
  نتغنمه وغنمته تغنها اذا نفلته واغتمه وتغمه عده غنيمة وغمام اسم بعير وقال ( ١
  بإصاح ما أصير ظهر غنام• وغنم بالسكين أبوحىّ من نغاب وهو غنم بن تغلب بن وائل
  ⁦( غيم)⁩ الفيم السهاب وقدغامت السماء وأغامت وأغيمت وغيمت وتغيمت كله بمه ند وأغيم
  القوم أصابهم غيم أبوعمر والغيم العطر وحرّالجوف وأنشد
  مازالت الدلولها تعود • حتى أفاق عيها الجهود
  بقال منه تام يغيم فهو غيمان وامرأة غيمى وقال
  قظلت صوافن خزر العيون • الى الشمس من رهبة أن تغيما
  صل القاء أم فأمت الرحل والقتب اذا وسعته وزدت فيه وفأمته تفتيما
  مثل ورحل مفام ومنأم قال زهيره على كل قينى قتيب ومفام• ويقال للبعيراذا ا-تلا
  المذكود
  خشيت أن تنظهر فيه أورام
  من عواكين قلبا بلابلام
  اه وتقدم ف علك اه
