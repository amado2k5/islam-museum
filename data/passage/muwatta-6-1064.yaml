label: { ar: "الموطأ 1064 — هشام بن عروة عن أبيه: قال رسول الله لعبد الرحمن بن عوف: كيف صنعت يا أبا محمد في استلام الركن؟ فقال: استلمت وتركت، فقال: أصبت", en: "Muwatta 1064" }
text: "كيف صنعت يا أبا محمد في استلام الركن؟ فقال عبد الرحمن: استلمت وتركت، فقال له رسول الله: أصبت"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: قال رسول الله لعبد الرحمن بن عوف: كيف صنعت يا أبا محمد في استلام الركن؟ فقال عبد الرحمن: استلمت وتركت، فقال له رسول الله: أصبت. ويذكر المحقق أن ابن وضاح زعم أن كلمة «الأسود» سقطت من رواية يحيى، وأن أبا مصعب وغيره رووه كرواية يحيى، وأن الحديث مرسل عند مالك، وأن الثوري وصله بشر بن السري وأبو نعيم عن سفيان عن هشام عن أبيه عن عبد الرحمن بن عوف. {cite:muwatta-maruf-1997 p.491}"
