label: { ar: "الموطأ 1064 — هشام بن عروة عن أبيه: قال رسول الله لعبد الرحمن بن عوف: كيف صنعت يا أبا محمد في استلام الركن؟ فقال: استلمت وتركت، فقال: أصبت", en: "Muwatta 1064", es: "Muwatta 1064", fr: "Muwatta 1064", ur: "موطا 1064", tr: "El-Muvatta 1064 — Hişam ibn Urve, babasının rivayetine göre: Allah Resulü, Abdurrahman ibn Avf'a şöyle buyurdu: \"Ey Ebu Muhammed, köşeye dokunma konusunda nasıl davrandın?\" O da: \"Dokundum ve bıraktım\" dedi. Resulullah: \"İyi yaptın\" dedi.", id: "Al-Muwatta 1064 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Rasulullah SAW bersabda kepada Abdur-Rahman ibn Awf: “Bagaimana pendapatmu tentang menyentuh sudut itu, wahai Abu Muhammad?” Dia menjawab: “Aku menyentuhnya lalu meninggalkannya.” Rasulullah SAW bersabda: “Kamu telah berbuat baik.”" }
text: "كيف صنعت يا أبا محمد في استلام الركن؟ فقال عبد الرحمن: استلمت وتركت، فقال له رسول الله: أصبت"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه قال: قال رسول الله لعبد الرحمن بن عوف: كيف صنعت يا أبا محمد في استلام الركن؟ فقال عبد الرحمن: استلمت وتركت، فقال له رسول الله: أصبت. ويذكر المحقق أن ابن وضاح زعم أن كلمة «الأسود» سقطت من رواية يحيى، وأن أبا مصعب وغيره رووه كرواية يحيى، وأن الحديث مرسل عند مالك، وأن الثوري وصله بشر بن السري وأبو نعيم عن سفيان عن هشام عن أبيه عن عبد الرحمن بن عوف. {cite:muwatta-maruf-1997 p.491}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek şöyle aktarmıştır: Allah Resulü, Abdurrahman ibn Avf'a şöyle buyurdu: \"Ey Ebu Muhammed, köşeye dokunma konusunda nasıl davrandın?\" Abdurrahman şöyle cevap verdi: \"Dokundum ve sonra bıraktım.\" Allah Resulü ona şöyle dedi: \"İyi yaptın.\" Araştırmacı, İbn Vadde'nin Yahya'nın rivayetinde \"el-Esved\" kelimesinin eksik olduğunu iddia ettiğini, Ebu Musab ve diğerlerinin de Yahya gibi rivayet ettiğini, Malik'e göre hadisin mursal (rivayet zincirinde eksik bir bağlantı bulunan hadis) olduğunu ve el-Sevri'nin ise Bişr ibn el-Sari ve Ebu Nuaym aracılığıyla Sufyan'dan, o da Hişam'dan, o da babasından, o da Abdurrahman ibn Avf'tan rivayet ederek hadisi bağladığını belirtmektedir. {cite:muwatta-maruf-1997 s.491}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, yang juga dari ayahnya, yang berkata: Rasulullah SAW bersabda kepada Abu Muhammad ibn Awf: \"Bagaimana pendapatmu tentang menyentuh sudut itu, wahai Abu Muhammad?\" Abu Muhammad ibn Awf menjawab: \"Aku menyentuhnya lalu meninggalkannya.\" Rasulullah SAW bersabda kepadanya: \"Kamu telah berbuat baik.\" Peneliti menyebutkan bahwa Ibnu Waddah mengklaim bahwa kata \"al-Aswad\" dihilangkan dari riwayat Yahya, dan bahwa Abu Mus'ab dan yang lainnya meriwayatkannya sebagaimana yang diriwayatkan Yahya, dan bahwa hadits tersebut mursal (hadits dengan mata rantai periwayatan yang hilang) menurut Malik, dan bahwa al-Thawri menghubungkannya melalui Bishr ibn al-Sari dan Abu Nu'aym dari Sufyan, dari Hisham, dari ayahnya, dari Abu Muhammad ibn Awf. {mengutip:muwatta-maruf-1997 hal.491}"
