text: "… جِئْتُ إنْ شاءَ اللَّه كان يتسامرُ معَ أمرأتِهِ، ذاتَ ليلة، فقال لها: سأذهب صباحَ غدٍ للاحتطابِ، وإذا كان الجوُّ رائقاً، أروحِ للمزرعة. فقالت له أمرأته: قلْ : إنْ شاءَ اللَّه. - فأجابها : وماذا يلزم، فطبعاً لا تخلو المسألة من …"
summary:
  ar: "قال جحا لزوجته إنه سيذهب غدًا لجمع الحطب، فقالت له أن يقول إن شاء الله، فقال إن الأمر لا يخرج عن أحد أمرين وخرج؛ وسأله فرسان عن الطريق فقال إنه لا يعرف، فضربوه وجعلوه يدلّهم، وبلّله المطر فعاد مصابًا وقال عند الباب إن شاء الله. {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  en: "Juha tells his wife he will go gathering firewood tomorrow; she says to add God's will; he says the matter is one of two outcomes, and goes out; asked the way by horsemen, he says he does not know; they beat him and make him lead them; he is soaked by rain and comes home hurt, saying 'God willing' at the door. {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  ur: "جحا نے بیوی سے کہا کہ کل لکڑیاں جمع کرنے جاؤں گا؛ اس نے کہا کہ ان شاء اللہ بھی کہو؛ اس نے کہا کہ معاملہ دو میں سے ایک ہی ہوتا ہے، اور نکل گیا؛ گھڑ سواروں نے راستہ پوچھا تو اس نے کہا کہ مجھے معلوم نہیں؛ انہوں نے اسے مارا اور راستہ دکھانے پر مجبور کیا؛ بارش میں بھیگ کر زخمی حالت میں گھر لوٹا اور دروازے پر کہا کہ ان شاء اللہ۔ {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  fr: "Juha dit à sa femme qu'il ira ramasser du bois demain; elle lui dit d'ajouter la volonté de Dieu; il répond que l'affaire ne peut aller que dans un sens ou dans l'autre, et sort; des cavaliers lui demandent le chemin, il dit qu'il ne le sait pas; ils le battent et le forcent à les guider; trempé par la pluie, il rentre blessé et dit à la porte «si Dieu le veut». {cite:juha-nawadir-kubra-djuwaydi p. 57}"
  es: "Juha le dice a su mujer que mañana irá a recoger leña; ella le pide que añada la voluntad de Dios; él responde que el asunto será de un modo o de otro, y sale; unos jinetes le preguntan el camino, dice que no lo sabe; lo golpean y lo obligan a guiarlos; empapado por la lluvia, vuelve a casa herido y dice en la puerta «si Dios quiere». {cite:juha-nawadir-kubra-djuwaydi p. 57}"
