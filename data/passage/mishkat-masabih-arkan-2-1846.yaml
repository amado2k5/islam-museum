  es: "Un extracto de Mishkat al-Masabih, volumen 2, pág. 1846, que menciona la fe como setenta y tantos brazos, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
