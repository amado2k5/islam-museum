text: "رقم اول الحديث الحديث أيما عبد أبق من مواليه عبد نزوج بغير إذن سيده قرية أنيتموها وأقتم فيها مسلم شهد له أربعة بخير أدخله اللّٰه الجنة مسلم ضاف قوما مسلم كسا مسلماً ثوباً على عرى الايمان بضع وسبعون شعبة بالله …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 1846، يذكر الإيمان بضع وسبعون شعبة، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 2, p. 1846, that mentions faith as seventy-odd branches, the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 2، ص 1846 کا اقتباس جس میں ایمان کی ستر سے کچھ اوپر شاخیں، ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 2, pág. 1846, que menciona la fe como setenta y tantos brazos, la dulzura y la plenitud de la fe; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Pilares y Ramas de la Fe lo incluye."
  fr: "Un extrait de Mishkat al-Masabih, volume 2, page 1846, qui décrit la foi comme une soixantaine de branches, et souligne sa douceur et sa plénitude; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 2, s. 1846'dan bir alıntı, yetmişten fazla iman dalından ve imanın tatlılığı ve mükemmelliğinden bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanan metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Bu metin, İslam'ın Şartları, İmanın Şartları, İmanın Dalları ve Müminin Özellikleri için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 2, hlm. 1846, menyebutkan tujuh puluh lebih cabang iman, dan kemanisan serta kesempurnaan iman; dari edisi hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip dalam sekitar empat puluh kata sesuai kebijakan sumber. Ini disusun oleh peramban untuk Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Karakteristik Orang Beriman."
