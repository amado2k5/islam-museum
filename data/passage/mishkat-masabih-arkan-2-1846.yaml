text: "رقم اول الحديث الحديث أيما عبد أبق من مواليه عبد نزوج بغير إذن سيده قرية أنيتموها وأقتم فيها مسلم شهد له أربعة بخير أدخله اللّٰه الجنة مسلم ضاف قوما مسلم كسا مسلماً ثوباً على عرى الايمان بضع وسبعون شعبة بالله …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 1846، يذكر الإيمان بضع وسبعون شعبة، وحلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
