label: { ar: "الموطأ 2513 — أبو غطفان بن طريف المري: مروان يسأل ابن عباس عن عقل الضرس", en: "Muwatta 2513" }
summary:
  ar: "يروي يحيى عن مالك عن داود بن الحصين عن أبي غطفان بن طريف المري أن مروان بن الحكم بعثه إلى عبد الله بن عباس يسأله: ماذا في الضرس؟ فقال ابن عباس: فيه خمس من الإبل. فرده مروان إلى ابن عباس فقال: أتجعل مقدم الفم مثل الأضراس؟ فقال ابن عباس: لو لم تعتبر ذلك إلا بالأصابع لكان عقلها سواء. {cite:muwatta-maruf-1997 p.432}"
