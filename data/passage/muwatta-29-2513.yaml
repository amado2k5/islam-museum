label: { ar: "الموطأ 2513 — أبو غطفان بن طريف المري: مروان يسأل ابن عباس عن عقل الضرس", en: "Muwatta 2513", es: "Muwatta 2513", fr: "Muwatta 2513", ur: "موطا 2513", tr: "Al-Muwatta 2513 — Abu Ghatfan bin Tarif Al-Murri: Mervan, İbn Abbas'a bilgelik dişini soruyor", id: "Al-Muwatta 2513 — Abu Ghatfan bin Tarif Al-Murri: Marwan bertanya kepada Ibnu Abbas tentang gigi bungsu" }
summary:
  ar: "يروي يحيى عن مالك عن داود بن الحصين عن أبي غطفان بن طريف المري أن مروان بن الحكم بعثه إلى عبد الله بن عباس يسأله: ماذا في الضرس؟ فقال ابن عباس: فيه خمس من الإبل. فرده مروان إلى ابن عباس فقال: أتجعل مقدم الفم مثل الأضراس؟ فقال ابن عباس: لو لم تعتبر ذلك إلا بالأصابع لكان عقلها سواء. {cite:muwatta-maruf-1997 p.432}"
  tr: "Yahya, Malik'ten, o da Davud ibn el-Hüseyn'den, o da Ebu Gatfan ibn Tarif el-Murri'den rivayet eder ki, Mervan ibn el-Hakam onu Abdullah ibn Abbas'a göndererek şöyle sordu: Bir azı dişinin karşılığı nedir? İbn Abbas şöyle cevap verdi: Beş deve. Mervan onu tekrar İbn Abbas'a gönderdi ve dedi ki: Ağzın ön kısmını azı dişleriyle aynı mı sayıyorsun? İbn Abbas şöyle cevap verdi: Eğer sadece parmaklar açısından değerlendirirsen, karşılıkları aynı olur. {cite:muwatta-maruf-1997 s.432}"
  id: "Yahya meriwayatkan dari Malik, dari Dawud ibn al-Husayn, dari Abu Ghatfan ibn Tarif al-Murri, bahwa Marwan ibn al-Hakam mengutusnya kepada Abdullah ibn Abbas untuk bertanya: Berapa ganti rugi untuk gigi geraham? Ibn Abbas menjawab: Lima unta. Marwan kemudian mengutusnya kembali kepada Ibn Abbas dan berkata: Apakah Anda menganggap bagian depan mulut sama dengan gigi geraham? Ibn Abbas menjawab: Jika Anda hanya mempertimbangkannya dalam hal jari-jari, maka ganti ruginya akan sama. {cite:muwatta-maruf-1997 p.432}"
