text: "… وفي نور الإيضاح ص : والمستحب تَرْكُ دَفْع المارً، والأمرُ بالدفع: لبيان الرخصة. طحطاوي علىٰ المراقي ص. صحيح البخاري، صحيح مسلم. سنن ابن ماجه، مصنف ابن أبي شيبة، مسند أحمد، وفي إسناده كلام. وهو قوله: إذا ناب أحدكم نائبةٌ: فليسبِّح. …"
