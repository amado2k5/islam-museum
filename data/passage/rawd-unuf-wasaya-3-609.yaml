text: "… نساءه من قح خيبر وصاة الرسول عند موته. أمز فدك فى خبر خيير • تسمية النفر الداربين الذين أوصى لهم رسول اللّٰه ص من خيمر عمر عجلى يهود خيبر. قسمة عمر لوادى القرى بين المسلمين ذكر قدوم جعفر ابن أن …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 609، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 609, that mentions a testament or parting counsel, a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 609 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Rawd al-Unuf de al-Suhayli, volumen 3, pág. 609, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, lo que quedó: patrimonio y herencia; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du livre « al-Rawd al-Unuf » d'al-Suhayli (tome 3, p. 609), mentionnant un testament ou des dernières volontés, le lit de mort et les dernières heures, ainsi que les biens et l'héritage laissés. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il est répertorié dans le « Testaments Browser »."
  tr: "Suhayli'nin \"El-Ravd el-Unuf\" adlı eserinin resimli 3. cildinin 609. sayfasında, bir vasiyetname veya kesin miras, ölüm zamanı ve geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir taranmış kopyadan alınmıştır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Rawd al-Unuf karya Al-Suhayli, jilid 3 bergambar, halaman 609, menyebutkan surat wasiat atau testamen terakhir, waktu kematian, dan harta warisan yang ditinggalkannya; dari salinan hasil pemindaian yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Dikumpulkan oleh peneliti surat wasiat, warisan, barang antik, dan makam suci."
