text: "حة عنده (٦٢٥). ولم أجد له شاهدا . وذكر الشيخ ملا علي القاري في كتاب رفع الجناح بأربعين حديثا في النكاح (٢ :٣٥) أن البيهقي أخرج الحديث عن عائشة في شعب الإيمان. والذي في شعب الإيمان إنما هو عن أنس"
