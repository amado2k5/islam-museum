text: "… واحد. ذكر وثيمة في كتاب الردة أنه شهد اليمامة، وأبْلى بها بلاءً حسناً. وذكر المدائني أنّ وفد ثقيف أسلموا إلا كنانة فإنه قال: لا يرثني رجل من قريش، وخرج إلى نجران، ثم - كَهْمَس الهلالي: توجه إلى الروم فمات بها …"
