  tr: "Abdülrazzak el-Sanani'nin eserinin 1. cildinin 1769. sayfasından, bir ağıt ve ölüm ilanı içeren bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari karya Abd al-Razzaq al-San'ani, Volume 1, halaman 1769, berisi eulogi dan pengumuman kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
