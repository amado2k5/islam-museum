text: "… أَهل الميت، ليست منهم، ذكره الثوري عن هلال بن خباب عن أَبي البختري - عبد الرزاق عن ابن عيينة قال : حدثني جعفر بن خالد المخزومي عن أَبيه خالد عن عبد اللّٰه بن جعفر قال لما جاءَ نعيُ جعفر : …"
summary:
  ar: "مقطع من المصنف — عبد الرزاق الصنعاني، المجلد المصوَّر 1، ص 1769، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Musannaf — Abd al-Razzaq al-San'ani, scan volume 1, p. 1769, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "المصنف - عبد الرزاق الصنعانی، اسکین جلد 1، ص 1769 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
