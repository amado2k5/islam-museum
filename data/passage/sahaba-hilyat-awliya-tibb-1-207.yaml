text: "… قال إنما مثل المؤمن فى الدنيا كمثل مريض معه طبيبه الذى يعلم داءه ودواءه، فاذا اشترى ما يضره منعه وقال لا تقر به فانك إن أصبته أهلكك، ولا يزال يمنعه حتى يبرأ من وجعه، وكذلك المؤمن يشتهى أشياء كثيرة مما …"
summary:
