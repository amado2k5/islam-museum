text: |-
  .⁦(ملا)⁩,,
  ٥.٥
  أخذت صفوتها والصفاة صخرة ملاء يقال فى المثل ما تندى صفاته واله-ع صقامقصور
  وأصفاء وصىّ على فعول قال الراجز
  كأن متفيه من النق • من طول اشراف على الطوة • مواقع الطير على الصفى
  ولصفوا الجارة اللينة الملس وقال امر والقير • كازلت الصفوا بالمتنزل * وكذلك
  الصفوان الواحدة صفوانة عن أبى عبيد ويوم =فوان اذاكان صافى الشمر شديد البرد
  والصفاموضع بمكة والصفا اسم نهر بالبحرين قار لبيديصف فخلا
  سحق يمتعها الصفا وسريه * عتمّ نواءم بينهن كروم
  والمص-فاة الراوق والصيفى الناقة الغيزيرة الدرة وايمع صفايا يقال منه ما كانت المناقة والشاة
  مفيا ولقد صفت تصفوعن أبى عرو والصفى المصافى والصفى ما يصطفيه الئي من المغتم
  انفسه قبل القسمة وهو الصفية أيضا والمع صفايا وقال
  لك المرباع منها والصفايا • وحكمك والتشطة والفضول
  وآصفيته الودّ أخلصته له وصافيته وتصافينا تخالصخاو اصطفيته اخترته وأصغينه بالشئ
  اذا آرْتْه به وأصفى الرجل من المال والادب أى خلا وأصنى الاميردارفلان واستصفى ماله
  اذا أخذه كاء وأصفت الدجاجة اذا انقطع بيضها وأصفى المشاعراذا انقطع شعره ⁦(صلا )⁩
  الصلاة الدعاء قال الاعشى
  وقابدها الريح فى دنها • وصلى على دنها وارتسم
  والصلاة من اللّٰه تعالى الرحة والصلاة واحدة الصلوات المفروضة وهو اسم يوضع موضع
  المصدر تقول صليت صلاة ولا تقل تصلية وصليت على النى تحلى اللّٰه عليه وسلم وصليت
  العصا بالفاراذ الينتها وقوّ متها وقال قيس بن زهير العبى
  فلا تعجل بأمرك واستدمه • قاصلى عصالككمستديم
  أى قوم والمصلى تالى السابق يقال صلى الفبرس اذاياء مصليا وهو الذي يتاو السابق لان
  رأسه عندصلاه والصلاية الفهر قال أمية بصف السماء
  سراة صلاية خلقا مصيغت • تزل الشمس ايس إمارتاب
  واغماقال امر والقيس معد التعروس أوصلاية حنظل • فأضافها اليه لانه يفلق بهااذ
  بس والصلاءة بالهمز مثله وصلاءة بن عمر والغيرى أحد القلمين وصليت اللحم وغره أصله
  صليا مثال وميته رميا اذاشويته وفى الحديث انه عليه السلام أتى بشاقمصلية أى مشوية
  ويقال أيضاحليت الرجل نارالذا أدخله الفار وجعلته بصلاهافان ألقيته فيها القاء
  كانك تريداحرلقه قات أصليته بالالقبوح ليته تصلمية وقرى ويصلى سسعيرا ومن خفف
  فهو من قولهم صلى فلان الناريا لكسر يصلى عليا احترق قال اللّٰه تعالى هم أولى بها صليا قال
  الحجاح• تاللّٰه لولا النار أن نصلاها • ويقال أيضاصلى بالامر اذا قاسى حرّه وشدته قال
  ولا سلى بسالتهم وان هم • واوا بالحرب حينابعد حين
  وإصطليت بالناروتصليت بها قال أبوزبيد الطائى
  روقد تصليت حر ربهم * كماتصلى المقرور من قرس
  صحاح
