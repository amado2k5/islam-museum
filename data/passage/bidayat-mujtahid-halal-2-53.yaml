  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 2. cildinin 53. sayfasından, izin verilen, haram ve caiz olan konuları ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
