text: "… لزمه أن يقول بتحريمها، ولذلك توقف مالك في ذلك وقال : أنتم تسمونه خنزيراً. فهذه حال الحيوان المحرم الأكل في الشرع والحيوان المباح الأكل. وأما النبات الذي هو غذاء فكله حلال إلا الخمر وسائر الأنبذة المتخذة من العصارات التي تتخمر، …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 2، ص 53، يذكر الحلال، والتحريم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 2, p. 53, that mentions the lawful, prohibition, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 2، ص 53 کا اقتباس جس میں حلال، تحریم، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
