label: { ar: "سرية أسامة بن زيد إلى مؤتة", en: "Sariyya of Usama ibn Zayd to Mu'ta", es: "Sariyya de Usama ibn Zayd a Mu'ta", fr: "Sariyya d'Oussama ibn Zayd à Mu'ta", ur: "اسامہ بن زید کی ساریہ موطا سے" }
text: "يا أسامة، سر على اسم الله وبركته حتى تنتهي إلى مقتل أبيك، فأوطئهم الخيل، فقد وليتك على هذا الجيش"
summary:
  ar: "في آخر أيام النبي بعث أسامة بن زيد — ابن زيد بن حارثة الذي استشهد بمؤتة — في جيش من شوال ومصر وقيس عيلان إلى البلقاء ليغزو الروم، وكان بعض الناس يتأففون لحداثة سنه. ويروي الواقدي أن النبي لما بلغه ذلك قال لأسرته: يا أسامة، سر على اسم الله وبركته حتى تنتهي إلى مقتل أبيك، فأوطئهم الخيل، فقد وليتك على هذا الجيش."
  en: "In the Prophet's final days he sent Usama ibn Zayd — son of Zayd ibn Haritha who fell at Mu'ta — at the head of an army drawn from the clans of al-Ash'ariyyin toward al-Balqa' against the Byzantines; some murmured at his youth. Waqidi records the Prophet's rebuke to his family: 'march in God's name until you reach your father's killers — I have put you in charge of this army.'"
  es: "En sus últimos días, el Profeta envió a Usama ibn Zayd —hijo de Zayd ibn Haritha, quien cayó en Mu'ta— al frente de un ejército formado por miembros de los clanes de al-Ash'ariyyin hacia al-Balqa' contra los bizantinos; algunos murmuraban por su juventud. Waqidi registra la reprimenda del Profeta a su familia: «Marchad en nombre de Dios hasta llegar a los asesinos de vuestro padre; os he puesto al mando de este ejército»."
  fr: "À la fin de sa vie, le Prophète envoya Oussama ibn Zayd — fils de Zayd ibn Haritha, tombé à Mu'ta — à la tête d'une armée composée de membres des clans al-Ash'ariyyin, contre les Byzantins, à Al-Balqa'. Certains murmurèrent en raison de son jeune âge. Waqidi rapporte la réprimande du Prophète à sa famille: « Marchez au nom de Dieu jusqu'à ce que vous atteigniez les assassins de votre père; je vous ai confié le commandement de cette armée. »"
  ur: "نبی کے آخری ایام میں اس نے اسامہ بن زید کو - زید بن حارثہ کا بیٹا جو موطا پر گرا تھا - کو ایک لشکر کے سربراہ پر بھیج دیا جو اشعریین کے قبیلوں سے بازنطینیوں کے خلاف البلقا کی طرف کھینچی تھی۔ کچھ اپنی جوانی پر بڑبڑایا۔ واقدی نے اپنے گھر والوں کو پیغمبر کی ڈانٹ ڈپٹ درج کی: 'خدا کے نام پر چلو یہاں تک کہ تم اپنے باپ کے قاتلوں تک پہنچ جاؤ - میں نے تمہیں اس فوج کا انچارج بنا دیا ہے۔'"
