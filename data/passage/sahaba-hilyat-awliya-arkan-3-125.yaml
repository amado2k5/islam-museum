text: "… عند النبي فذكر عنده الحياء. فقالوا يارسول اللّٰه الحياء من الدين. فقال رسول اللّٰه : بل هو الدين كله. ثم قال رسول اللّٰه :. إن الحياء والعفاف والعىّ عيّ اللسان لا عىّ القلب والعمل من الايمان ؛ وإنهن يزدن فى …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 3، ص 125، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 3, p. 125, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 3، ص 125 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 3, pág. 125, que menciona lo que se considera parte de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 3, page 125, mentionnant ce qui est considéré comme faisant partie de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin 3. resimli cildinin 125. sayfasından, imanın ne anlama geldiğini anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 3, halaman 125, yang menyebutkan apa yang membentuk iman; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
