text: "… في الإسلامِ، يقولون: لا قَدَر. قال: فإذا أنت لقيتَهم فأخبرهم : أن عبد اللّٰه بن عُمر منكم بريءٌ، وأنتم منه بَراءٌ، والله لو أنفقوا جبال الأرض ذهبًا ما قبلَهُ اللهُ عَرَوْلَّ منهم حتى يؤمنوا بالقدرِ. قال: وحدثنيه عمر قينه: أن …"
