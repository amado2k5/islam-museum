text: |-
  (1 ) أوله
  ترىء نهاصفراه في حنب موقها
  ٦١٦
  (ياب الميز
  جروه والنفس العالى من السمن وغيره والقطيهاء.ثل الغبيرا ضرب من التمروهو الشهريز
  والقطع بالكسر ظمة آخر الليل ومنه قوله تعالى فأسر بأهلك بقطع من الليل قال الاخفش
  بواد من الليل قال الشاعر اقتصى الباب وانطرى فى النجوم • كم علينا من قطع ليل بهم
  والقطع أبضاطنفسة يجعلها الراكب تحته تغطى كنى البعير قال
  أنتك العيس تنفح فى براها • تكشف عن مناكيها القطوع
  والقطع أيضائصل قصير عر يض لل-هم والجمع أقطع وأقطاع وصنه قول أبى ذويب
  والقطعة من الشئ الطائفة منه ويقال الصوم مقطعة
  للذكاح والمقطع بالكسر ما يقطع به الشئ والمقطعات من الشياب شبه الجباب ونحوهامن
  الازوغيره وقال أبو عمر ومقطعات الشباب والشعرة صارها ويقسال للارنب المقطعة الاسهار
  وقد فسرناه فى باب الراء وقطع الفرس الخيل تقطمعا أى خلفها ومضى ويقال جاءت الخيل
  مقطوطعات أى صراعا بعضها فى إثر بعض والقطاع والقطاع الصرام والقطيع الطائفة
  من البقروالغنم وايلمع أقاطيع على غير قياس كانهسم جم والمقطيعا وقد قالوا أقطاع مثل
  شريف وأشراف وقد قالواقطعان البقرمثل جريب وجربان والقطييع السوط قال الاعشى
  تراقب كف والقطيع المحرّما ١ فلان قطيع القيام اذا وصف بالضعف أوالسمن والقطيعة
  الهجران والقطاءة بالضم ماسقط عن القطع وقطع:غسلان فهوم قطوع به وانقطع به فهو
  منقطع به اذا عجز عن سفره من نفسقة ذهبت أوقامت عليه راحلته أو أتاه أمر لا يقدر على
  أن يتحرك معه ومنقطسع كل شى أيضاحيث ينتهى اليه طرفه نحومنقطع الوادى والرمل
  والطريق وانقطع الحبل وغيره وقطعت الشى شدد لذكثرة فتقطع وتقطعوا أمرهم بينهسم أى
  تقسموء وتقطيع الشعروزته بإجزاء العروض والتقطيع مغص فى البطن عن أبى نصر
  وأقطعته قضانا من الكرم أى أذنت له فى قطعها وهذا الذوب يق طعل ق.صا وأقطعة
  قطيعة أى طائعة من أرض الخراج وأقطع الرجل اذا انقطعت حجته وبكتوه بالحق فلم يجب
  فهو منقطع والمقطع بفتح الطاء البعيراذا جفر عن الضراب قال النمرين نواب
  قامت ما كى ان مبأت لفتية • زقاوخابيسة بعود مقطع
  ويقال أيض اللغريب أقطع عن أهله فه ومقطع عنهم وكذلك الذى يفرض لنظرائه ويتركهو
  وأقطعت الشى اذا انقطم عنك يقال قد أ قطعت الغيث أى خلفته وأقطعت الدجاجة مثل
  اقفت وقاطعته على كذا والتقاطع ضد التواصل واقتطعتمن الشى قطعة بقسال اقتطعت
  قطيعامن غنم فلان ⁦( قعع)⁩. القعقعة حكاية صوت السلاح ونحوه وفى المثل ما يقمقع
  لى بالشنان وقمقع واقعقعة وقعقاعا بالكسر والقعقاع بالفتح الاسم والتقفقع التحرل وحار
  قمقعانى لصوت بالضم أى شديد الموت فى صوته قعقعة قال رؤية
  شاحى لحى مقعانى الصلق • قعقمة المحور خطاف العلق
  والمتعقع الذى يجيل القداج فى الميسر قال كثير يصف نافته
  وتعرف إن ضلت فتهدى لربها • لموضع آلات من الطلح أربع
  وأو بن من نص الهوابر والضحى • بقد حيز فازا من قداح المقعتع
