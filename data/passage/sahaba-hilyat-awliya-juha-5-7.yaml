text: "… بن إسحاق ثنا على بن قادم ثنا مسعر عن محمد بن سوقة. قال : إذا سمعت العطسة فاحمد اللّٰه، وإن كان بينك وبينها البحر. • حدثنا عبد اللّٰه أنا أبو الجارود قال ثنا ممرو بن سعيد الجماز ثنا كثير بن …"
