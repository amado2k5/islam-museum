label: { ar: "الموطأ 1074 — ابن شهاب عن حميد بن عبد الرحمن: عبد الرحمن بن عبد القاري أخبره أنه طاف بالبيت مع عمر بن الخطاب بعد صلاة الصبح، فلما قضى عمر طوافه نظر فلم ير الشمس، فركب حتى أناخ بذي طوى فصلى ركعتين", en: "Muwatta 1074" }
summary:
  ar: "أول حديث في باب الصلاة بعد الصبح والعصر في الطواف. يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف، أن عبد الرحمن بن عبد القاري أخبره أنه طاف بالبيت مع عمر بن الخطاب بعد صلاة الصبح، فلما قضى عمر طوافه نظر فلم ير الشمس طلعت، فركب حتى أناخ بذي طوى فصلى ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1297) وسويد (555) والشيباني (440). {cite:muwatta-maruf-1997 p.495}"
