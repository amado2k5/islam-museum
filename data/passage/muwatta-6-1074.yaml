ref: "1074"
label: { ar: "الموطأ 1074 — ابن شهاب عن حميد بن عبد الرحمن: عبد الرحمن بن عبد القاري أخبره أنه طاف بالبيت مع عمر بن الخطاب بعد صلاة الصبح، فلما قضى عمر طوافه نظر فلم ير الشمس، فركب حتى أناخ بذي طوى فصلى ركعتين", en: "Muwatta 1074", es: "Muwatta 1074", fr: "Muwatta 1074", ur: "موطا 1074", tr: "El-Muvatta 1074 — İbn Şihab, Humaid ibn Abdülrahman'dan rivayetle: Abdülrahman ibn Abdülkari ona, sabah namazından sonra Ömer ibn el-Hattab ile Kâbe'yi tavaf ettiğini bildirdi. Ömer tavafını bitirdiğinde güneşi göremedi, bu yüzden Zülva'ya kadar at üzerinde gitti ve orada iki rekat namaz kıldı.", id: "Al-Muwatta 1074 — Ibn Shihab, berdasarkan riwayat Humaid ibn Abd al-Rahman: Abd al-Rahman ibn Abd al-Qari memberitahukan kepadanya bahwa ia melakukan tawaf mengelilingi Ka'bah bersama Umar ibn al-Khattab setelah shalat subuh. Ketika Umar selesai melakukan tawaf, ia melihat tetapi tidak dapat melihat matahari, jadi ia menunggang kuda sampai berhenti di Dhu Tuwa dan shalat dua rakaat." }
summary:
  ar: "أول حديث في باب الصلاة بعد الصبح والعصر في الطواف. يرويه مالك عن ابن شهاب عن حميد بن عبد الرحمن بن عوف، أن عبد الرحمن بن عبد القاري أخبره أنه طاف بالبيت مع عمر بن الخطاب بعد صلاة الصبح، فلما قضى عمر طوافه نظر فلم ير الشمس طلعت، فركب حتى أناخ بذي طوى فصلى ركعتين. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1297) وسويد (555) والشيباني (440). {cite:muwatta-maruf-1997 p.495}"
  tr: "Tavaf sırasında sabah ve ikindi namazlarından sonra kılınan namaz bölümündeki ilk hadis. Malik, İbn Şihab'dan, o da Humaid ibn Abdülrahman ibn Avf'tan rivayet ettiğine göre, Abdülrahman ibn Abdülkari, Malik'e, sabah namazından sonra Ömer ibn Hattab ile Kâbe'nin etrafında tavaf yaptığını anlatmıştır. Ömer tavafını bitirdiğinde güneşin doğmadığını görmüş, bunun üzerine atına binmiş ve Zü've'de durarak iki rekat namaz kılmıştır. Editör, bu hadisin Malik'ten Ebu Musab (1297), Suveyd (555) ve Şeybani (440) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.495}"
  id: "Hadits pertama dalam bab tentang shalat setelah shalat Subuh dan Ashar selama Tawaf. Diriwayatkan oleh Malik dari Ibnu Shihab dari Humaid ibn Abd al-Rahman ibn Awf, bahwa Abd al-Rahman ibn Abd al-Qari memberitahunya bahwa ia melakukan Tawaf mengelilingi Ka'bah bersama Umar ibn al-Khattab setelah shalat Subuh. Ketika Umar selesai Tawaf, ia melihat dan tidak melihat matahari telah terbit, maka ia menaiki kudanya dan berhenti di Dzul Tuwa, di mana ia shalat dua rakaat. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1297), Suwaid (555), dan al-Shaybani (440). {cite:muwatta-maruf-1997 p.495}"
