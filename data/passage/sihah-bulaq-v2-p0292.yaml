text: |-
  * ⁦(باب الميم)⁩*
  ٢٩٥
  ويقال للمرأة التى ليست بطويلة امر أة حز لمة مثل مقذذة . ورجل حزلم ومقذذاذا كان
  مخفف الهيئسة عن ابن المسكيت قال ويقال قدح من لم وزليم أى طرّوأجيد قده وصسنعته
  وعصاحز لمة وما أحسن مازلم سهمه قال ذوارتة • كأرحاء رقد زلمتها المناقرشبه خف
  البعير بالرحى أى قد أخذت المعاول من حروفها والمزلم السيء الغذاء والزلم بالتحريك القدح
  قال الشاعر بات يقاسيها غلام كالزلم ,,، ليس براعى ابل ولاغنم
  وكذلك الزلم بضم الزاى والجع الازلام وهى السهام التى كان أهل الجاهلية يستقسمون بها
  والزام أيضا واحد الوبار والههع الازلام عن أبى عر وقال الخليل الزلمة تكون للمعزفى حلوقها
  متعلقة كالقرط ولهازلمتان فان كانت فى الاذن فهسي زغة بالنون والنعت أزلم وأزنم والاننى
  زلماء وزغاه وقال تركت بنى ماء السماء وفعلهم * وأشبهت تيسابالحجاز مزغما
  والزلم أيضا الزنم الذى يكون خلف الظلف والازلم الجذع الدهر وقال
  يابشرلولم أكن منكم يمنزلة • ألق على يديه الازلم الجذع
  وزلمت الحوض ملأته وزيات عطاعه قللته وازلاتم القوم ازليما ما أى ولواسراعا وقال أبوزيد
  ارتحلوا وازلاتم الشى انتصب وازلام النهاراذا ارتفع ضحاؤه زمم) الزمام الخيط
  الذى يشد فى البرة أوفى الخشاش ثم يشت فى طرفه المقود وقد يسمى المودزماما وزمام النعل
  ما يشدفيه الشع تقول زيت النعل وزعمت البعير خطمته وقول الراجز
  ياعجبا وقدرأيت عجبا • حار قبان بسوق أرنيا
  خاطمها زأتها أن تذهبا * فقلت أردفنى فقال مرحبا
  أراد زاتها فحزلٰ انهمزة ضرورة لاجتماع الساكنين كماجا فى الشعراسوأدّت بمعنى
  اسوادت وزم أى تقدّم فى السيروزم يأتفه أى تكبر فهوزام وقوم زتم أى شمخ بأنوفهم
  من الكبر قال الراجز* شداخة تفدغ هام الزمّم* وزمم الجهال شدد للكثرة ويقال أخذ
  الذئب سخلة فسذهب بها زامارأسه أى رافعا وقد زمها الذئب وازدمها بعنى والزمزمة
  صوت الرعد عن أبى زيد والزمزمة كلام المجوس عندأكلهم وزحزم أيضا بالفتح اسم بثر
  سكة شرفها اللّه تعالى وزمزم وعيطل اسمان لناقة وقدذ كرناه فى اللام والزمزمة بالكسر
  الجاعة من الناس وقال * إذا تدانى زمزم من زمزم * وقال الشيبانى الزمزم أيضا
  الجلة من الابل قال وكذلك الزمزيم ودارى من داره زمم أى قريب وقال أعرابى
  لا والذى وجهى زمم يتسه ما كان كذا وكذا أى تجاهه وتلاءه وأمربنى فلان زمم أى
  قصد كما يقال أمم وزمّ بالضم موضع قال الاعشى
  وتظرة عين على غرة • محل الخليط الصحرازم
  يقول ما كان هواها الاعقوية ( نم يقال هو العبد زغة وزغة وزغة وزغمة أى قدّه قد
  العبيد وقال الكسائى أى حقا والزغمة شئ يقطع من أذن البعير فيسترك معلقا واتما يفعل
  ذلك بالكرام من الابل يقال بعيدزنم وأزنم ومزنم وناقة زغة وزناء وحزنمة والزنم لغة فى الزلم
  الذى يكون خلف الظلف وأمَا الذى فى الحديث الضائنة الزغة فهى الكريمة لإنّ الضأن لازغة
  لها واغما يكون ذلك فى المعز قال الشاعر (١
  ٥ فى نسخة المعلى بن حال
  العبدى اه
