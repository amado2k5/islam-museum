label: { ar: "صحيح البخاري 6809 — ما يرتفع معه الإيمان حين الفعل", en: "Sahih al-Bukhari 6809 — what faith is lifted by at the moment of the act", ur: "صحیح بخاری 6809 — وہ عمل جس کے وقت ایمان اٹھ جاتا ہے" }
text: "… عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍما ـ قَالَ قَالَ رَسُولُ اللَّهِ \" لاَ يَزْنِي الْعَبْدُ حِينَ يَزْنِي وَهْوَ مُؤْمِنٌ، وَلاَ يَسْرِقُ حِينَ يَسْرِقُ وَهْوَ مُؤْمِنٌ، وَلاَ يَشْرَبُ حِينَ يَشْرَبُ وَهْوَ مُؤْمِنٌ، وَلاَ يَقْتُلُ وَهْوَ مُؤْمِنٌ \". قَالَ عِكْرِمَةُ قُلْتُ لاِبْنِ عَبَّاسٍ كَيْفَ يُنْزَعُ الإِيمَانُ مِنْهُ قَالَ هَكَذَا ـ وَشَبَّكَ بَيْنَ أَصَابِعِهِ ثُمَّ أَخْرَجَهَا ـ فَإِنْ تَابَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6809، يذكر ما يرتفع معه الإيمان حين الفعل. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 6809 (Limits and Punishments set by Allah (Hudood)), that mentions what faith is lifted by at the moment of the act. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 6809، جس میں وہ عمل جس کے وقت ایمان اٹھ جاتا ہے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
