label: { ar: "صحيح البخاري 6896 — الأب والأبوة", en: "Sahih al-Bukhari 6896 — the father and fatherhood", ur: "صحیح بخاری 6896 — باپ اور والدیت", es: "Sahih al-Bukhari 6896 — El padre y la paternidad" }
text: "… عَنِ ابْنِ عُمَرَما ـ أَنَّ غُلاَمًا، قُتِلَ غِيلَةً فَقَالَ عُمَرُ لَوِ اشْتَرَكَ فِيهَا أَهْلُ صَنْعَاءَ لَقَتَلْتُهُمْ. وَقَالَ مُغِيرَةُ بْنُ حَكِيمٍ عَنْ أَبِيهِ إِنَّ أَرْبَعَةً قَتَلُوا صَبِيًّا فَقَالَ عُمَرُ مِثْلَهُ. وَأَقَادَ أَبُو بَكْرٍ وَابْنُ الزُّبَيْرِ وَعَلِيٌّ وَسُوَيْدُ بْنُ مُقَرِّنٍ مِنْ لَطْمَةٍ. وَأَقَادَ عُمَرُ مِنْ ضَرْبَةٍ بِالدِّرَّةِ. وَأَقَادَ عَلِيٌّ مِنْ ثَلاَثَةِ أَسْوَاطٍ. وَاقْتَصَّ شُرَيْحٌ مِنْ سَوْطٍ وَخُمُوشٍ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6896، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6896 (Blood Money (Ad-Diyat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6896، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 6896 (Dinero de sangre (Ad-Diyat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
