text: "… بعض الحفاظ: لعل بعضهم نسبه إلى جده الأعلى فَقَدِ قُسِّمتْ فِينَا فُيُوءُ الأَعاجِمِ ربيعة، والله أعلم. وَدرَّتْ عَلَيْنَا جِزِيَةُ القَومِ بالّذِي - الأسود بن عمران البكري: فَكَكْنَا بِهِ عَنْهُم وُلاةَ المَعَاصِمِ والأسود هو الذي قال لرسول كسرى لما قال لهم: …"
