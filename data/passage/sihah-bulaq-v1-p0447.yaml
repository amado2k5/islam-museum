  ١٩٤
  ⁦(باب الحا٠)⁩
  مجح مجحاومجعا تكبر والدلوفى البئرخضخضها كذلك ⁦(محح)⁩ المح الذوب البالى وقدمح
  الثوب واح بلى والمح بالضم صفرة البيض وقال ابن الزبعرى :
  كانت ريش بيضة فتفلقت * فالمح خالصه لعبد مناف
  والمجاح الذى يرضيك بالقول ولافعل له وهوالكذاب ⁦( دح)⁩ المدح الثناء الحسن وقد
  مدجه وامتدحه بمع ن وكذلك المدحة والمديح والامدوحة وأنشد أبوعمر ولابي ذؤيب
  لو كان مدحة منشرا أحدا • أحبا أباكن ياللى الاماديح
  وتمدح الرجل تكلف أن يمدح ورجل متح أى ممدوح جدا وامدح بطنه لغة ف اندح اذا
  تسع وتمدحت خواصر الماشية أى اتسعت شبعامثل تندحت وقال الراعى يصف فرسا
  فلما-قيناها العكيس تمدّحت • خواصرها وازدادرشجاوريدها
  غذاء ذا منى قال الامن مذج مى أتمل ف الع ومرج ] لل .
  الفرح والنشاط وقدمرح بالكسر فهو مرح ومرّجح بالتشديد مثال سكير وأعرح.
  غيره والاسم المراح بكسر الميم ومرحت عينه أيضامر حانا فسدت وهاجت قال الشاعر
  ١ كأن قذى فى العيز قد مرحت به * وماساجسة الاخرى الى المرحان
  وفرس ممراج ومروح أى نشيط وقد أمرحه الكلاً وقوس مروح كات بهامر حأمن حسسن
  ارسالها السهم وقال الاصمعى فى قول أبى ذويب
  مصفقة مصفاة عقار * شامية اذا جليت هروح
  أى لها مراح فى الرأس وسورة يمرح من يشرجها وعين مراح غزيرة الدمع ومرحت القربة أى
  سربتها وهو أنة_لأهاماء لتنسدعيون الخرزويقال لارامى اذا اصاب مرحى وهو تعجب
  واذا أخطأ برحى ( زح المزح الدعابة وقد مزح يمزح والاسم المزاح بالضم والمزاحة
  أيضاوأما الزاح بالكسر فهو مسدر مازحه وهما يتمازحان ⁦(مسح)⁩ مسح برأسه وتمسح
  بالارض ومسح الارض مساحة أى ذرعها ومسح المرأة جامعها ومسحه بالسيف قطعه واذا
  أصاب المرفق طرف كركرة البعسير فأدماه قسل به حاز وان لم يدمه قيل به ماسح والمسحاء
  الارض المستوية ذات حصى صغار لاتبات فيها ومكان أمسح قال الفرّاء يقال
  مررت تخريق ص الارص بين مسحاوين وعلى فلان مسححة من جال والمسحاء المرأة الرسحاء
  ومسحت الابل يومها أى سارت والمسيحة من الشعر واحدة المائح وهى الذوائب والماسحة
  الماشطة والميحة القوس قال الشاعر
  لها مسائح زور فى مرا كضها • ليزوايس بها وهن ولارقق
  قال الاصمعى المسيح القطعة من الفضة والدرهم الاطلس مسيح والمسيح عيسى عليه السلام
  والمسيح الكذاب الدجال والمسيح العرق قال الراجز
  يار تيها وقد بدامسيحى • وابتل ثوباى من النضيح
  أ والمسح البلاس والجمع أمساح ومسوح والامسح الذى تصيب احدى ربليته الاخرى تقول
  منه مسح الرجل بالكسر مسحار التمساح من دواب المامغروف ⁦(مصح)⁩ مصح الشئ
