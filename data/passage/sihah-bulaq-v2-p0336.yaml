text: |-
  • (باب الآلام•
  ٢٥١
  الفراء يقال مالى عن هذا الامروغل أى بد والوغل بكسر الغين السي الغذاء والايغال
  السير السريع والامعان فيه قال الاعشى
  تقطع الامعز المكوكب وخدا * بشواج سريعة الايغال
  ونوغل فى الارض اذاسارفيها وأبعد ⁦( وقل)⁩ الوقل بالتسكين شجر المقل وتوقات
  الجبل علوته يقال منه وعل وقل ووقل مثل ندس وندس وحذر وحذروة-دوقل بالفتح
  اذا توقل فى الجبل أى تصعد وفى المثل أوقل من غفر وهو ولد الاروية وفرس وقل بالكسر
  اذا أحسن الدخول بين الجبال ⁦( وكل )⁩. رجل وكل بالتحريك ووكاة أيضامثال همزة وتكلة
  يقال فلان وكلة تكلة أى عاجز يكل أمره الى غيره ويتكل عليه قالت امرأة
  ولا تسكونن كهلوف وكل* وموكل بالفتح اسم موضع قال لبيديصف الليالى
  وغلين أبرهة الذى ألفينه * قد كان خلد فوق غرفة موكل
  وهو شاذ مثل موحد وواكات الدابة اذا أساءت السير وفرس واكل يتسكل على صاحبه
  فى العدوويحتاج الى الضرب يقال دابه فيها وكال شديدووكال شديد بالفتح والكسر والوكيل
  معروف بقال وكلته بأمركذا نوكيلا والاسم الوكالة والوكالة والتوكل اظهار العجز
  والاعتماد عنى غيرله والاسم التكلان واتكات على فلان فى أمرى اذا اعتمدته وأصله اوتكات
  قلبت الواوياء لانكارما قبلها ثم أبدات منها التاء فأدغمت فى تاء الافتعال ثم بنيت على هذا
  الادعام أسماء من المثال وان لم تكن فيها تلاث العلة توهما أنّ التاء أصلية لان هذا الادعام
  لا يجوزاظهاره فى حال فن تلك الاسماء التكلة والتسكلان والتخمة والتهمة والتجاه والتراث
  والتقوى واذاصغرت قلت تكيلة وتخيمة ولا تعيد الواولات هذه حروف ألزمت البدل قثبتت
  فى التصغيروابهع ووكاه الى نفسه وكلا ووكولا وهذا الامرموكول الى رأيك وقوله
  كلينى لهتم يا أميمة ناصب * وليل أقاسيه بطى السكواكب
  أى دعينى وواكات فلاناموا كلة اذا اتكات عليسه واتكل هو عليك ⁦(ولول)⁩، ولوات المرأة
  ولولة وولو الااذا أعوات قال العجاج
  ر ه ب ل اقية أول وحلن أى أزل مى والوخلة ألقؤعة والأحل بالصر بك النزع
  وهل يوهل وهو وهل ومستوهل قال القطاميصف ابلا
  وترى لحيضتهنّ عند رحيلنا • وهلا كان بهنّ جنة أولق
  أبوزيد وهل فى الشءوعن الشى يوهل وهلا اذاغلط فيه وسها ووهلت اليه بالفتح أهل وهلا
  اذا ذهب وهمك اليه وأنت تريد غيره مثل وهمت يل) ويل كلمة مثسل ويح الا أنها كلمة
  عذاب يقال ويله وويلك وويلى وفى الندية ويلاه قآل الاعشى ١
  ويلى عليك وويلى منك يارجل * وقد تدخل عليما الهاء فيقال ويلة قال مالك بن جعدة
  التغلبى
  لامّك ويلة وعليك أخرى • فلاشاة تنيل ولا بعير
  وتول ويل لزيدوو بلالزيد فالنصب على اضمار الفعل والرفع على الابتداءهذا اذالم تضفه
  فأما اذا أضفت فليس الا النصب لانك لورفعته لم يكن له خير قال عطاء بن يسار الويل وادفى
  جهنم لو أرسلت فيه الجبال لمساعت من حرّه
  ٢ فى نسخة أول البيت
  قاات هريرة لماجتت زائرها
  /ه
