  fr: "Le verset le plus connu à la gloire du Prophète: une lumière qui guide, une lame indienne parmi les épées de Dieu, dégainée."
  ur: "پیغمبر کی تعریف میں سب سے مشہور لکیر: ایک روشنی جس سے کسی کی رہنمائی کی جاتی ہے، خدا کی تلواروں کا ایک ہندوستانی بلیڈ، کھینچا جاتا ہے۔"
