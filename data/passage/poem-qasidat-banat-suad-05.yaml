text: إنّ الرسولَ لنورٌ يُستضاءُ به مهنَّدٌ من سيوف الله مسلولُ
summary:
  ar: 'أشهر أبيات القصيدة في مدح النبي: نور يستضاء به وسيف من سيوف الله مسلول {{cite:ibn-hisham-wustenfeld-1858 p.892}}.'
  en: 'The best-known line in praise of the Prophet: a light by which one is guided, an Indian blade of God''s swords, drawn.'
