label: { ar: "الموطأ 94 — سعيد بن المسيب: من غلبه الرعاف يومئ برأسه", en: "Muwatta 94", es: "Muwatta 94", fr: "Muwatta 94", ur: "موطا 94", tr: "El-Muvatta 94 - Sa'id ibn el-Müsayyab: Kimin burnu kanarsa başını sallasın", id: "Al-Muwatta 94 — Sa’id ibn al-Musayyab: Siapapun yang terkena mimisan hendaknya menganggukkan kepalanya" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب العمل فيمن غلبه الدم من جرح أو رعاف: سأل سعيد بن المسيب من حوله عمن غلبه الدم من رعاف لا ينقطع، ثم قال إنه يرى أن يومئ برأسه إيماءً في صلاته. ويروي يحيى عن مالك أن ذلك أحب ما سمع إليه في المسألة. ويذكر المحقق أن عبد الرزاق رواه عن معمر بلاغاً عن ابن المسيب بمعناه. {cite:muwatta-maruf-1997 p.81} {cite:muwatta-maruf-1997 p.82}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği bir hadiste, yara veya burun kanaması nedeniyle kanama geçiren birinin davranışları bölümünde şöyle denmektedir: Sa'id ibn al-Musayyab çevresindekilere sürekli burun kanaması geçiren birini sordu ve sonra böyle bir kişinin namaz sırasında başını sallaması gerektiğine inandığını söyledi. Yahya, Malik'ten rivayet ettiğine göre, bu konuda duyduğu en tercih edilebilir görüşün bu olduğunu belirtmektedir. Araştırmacı, Abd al-Razzaq'ın da Ma'mar'dan, o da İbn al-Musayyab'dan benzer bir anlamda rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.81} {cite:muwatta-maruf-1997 s.82}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Yahya ibn Sa'id, dalam bab tentang tindakan orang yang mengalami pendarahan akibat luka atau mimisan: Sa'id ibn al-Musayyab bertanya kepada orang-orang di sekitarnya tentang orang yang mengalami mimisan terus-menerus, lalu berkata bahwa ia percaya orang tersebut hendaknya menganggukkan kepalanya saat shalat. Yahya meriwayatkan dari Malik bahwa ini adalah pendapat yang paling baik yang pernah didengarnya mengenai masalah tersebut. Peneliti menyebutkan bahwa 'Abd al-Razzaq meriwayatkannya dari Ma'mar, dari Ibn al-Musayyab, dengan makna yang serupa. {cite:muwatta-maruf-1997 p.81} {cite:muwatta-maruf-1997 p.82}"
