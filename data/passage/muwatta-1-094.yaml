label: { ar: "الموطأ 94 — سعيد بن المسيب: من غلبه الرعاف يومئ برأسه", en: "Muwatta 94" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب العمل فيمن غلبه الدم من جرح أو رعاف: سأل سعيد بن المسيب من حوله عمن غلبه الدم من رعاف لا ينقطع، ثم قال إنه يرى أن يومئ برأسه إيماءً في صلاته. ويروي يحيى عن مالك أن ذلك أحب ما سمع إليه في المسألة. ويذكر المحقق أن عبد الرزاق رواه عن معمر بلاغاً عن ابن المسيب بمعناه. {cite:muwatta-maruf-1997 p.81} {cite:muwatta-maruf-1997 p.82}"
