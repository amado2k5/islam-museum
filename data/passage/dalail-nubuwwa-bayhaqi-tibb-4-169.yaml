text: "… اللّه عليه، وأعلمه بالوحي أن شفاءة بالعسل فكرر عليه الأمر بسقي العسل ليطهر ما وعد به، والعسل يحتوي على الخمائر والإنزيمات كالدياستاز، والانفرتاز، والانيولاز، فهو غذاء سهل الهضم والتمثيل يتجه إلى الكبد مباشرة، ويمنع نمو البكتيريا، ويؤدي إلى قتلها، بما …"
