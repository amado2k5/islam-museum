label: { ar: "سنن النسائي 2622 — مغفرة ما تقدم من الذنب", en: "Sunan al-Nasa'i 2622 — forgiveness of past sins", ur: "سنن نسائی 2622 — پچھلے گناہوں کی مغفرت" }
text: "أَخْبَرَنَا عَبْدَةُ بْنُ عَبْدِ اللَّهِ الصَّفَّارُ الْبَصْرِيُّ، قَالَ حَدَّثَنَا سُوَيْدٌ، - وَهُوَ ابْنُ عَمْرٍو الْكَلْبِيُّ - عَنْ زُهَيْرٍ، قَالَ حَدَّثَنَا سُهَيْلٌ، عَنْ سُمَىٍّ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" الْحَجَّةُ الْمَبْرُورَةُ لَيْسَ لَهَا جَزَاءٌ إِلاَّ الْجَنَّةُ وَالْعُمْرَةُ إِلَى الْعُمْرَةِ كَفَّارَةٌ لِمَا بَيْنَهُمَا \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2622، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 2622 (The Book of Hajj), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 2622، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
