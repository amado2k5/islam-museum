text: "لقود، وقضى عليه بالدية. ومن جلالة زيد: أن الصديق اعتمد عليه في كتابة القرآن العظيم في صحف، وجمعه من أفواه الرجال، ومن الأكتاف والرقاع، واحتفظوا بتلك الصحف مدة، فكانت عند الصديق ؛ ثم تسلمها الفاروق، ثم كانت بعد عند أم"
