text: "- كَاشِفُ العُمَّةِ وعن أبي الحجاج الأزدي قال: سألت سلمان ما الإيمان بالقدر؟ فقال: أن تعلم أن ما أصابك لم يكن ليخطئك، وما أخطأك لم يكن ليصيبك. وعن جابر قال: لا يؤمن عبد حتى يؤمن بالقدر كله خيره وشره ما …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 186، يذكر الإيمان بالقدر، وما لا يتم الإيمان إلا به؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 186, that mentions belief in the decree, what faith is not complete without; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 186 کا اقتباس جس میں تقدیر پر ایمان، جس کے بغیر ایمان مکمل نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 3, pág. 186, que menciona la creencia en el decreto, sin el cual la fe no está completa; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Sharh Usul I'tiqad Ahl al-Sunna d'al-Lalaka'i (tome 3, p. 186) mentionnant la croyance au décret, élément essentiel de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 3. cildinin 186. sayfasından bir alıntı, kader inancını ve kader olmadan inancın eksik kalacağını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari penjelasan Al-Lalaka'i tentang dasar-dasar keyakinan Sunni, jilid 3, halaman 186, membahas keyakinan akan takdir dan hal-hal yang tanpanya keyakinan menjadi tidak lengkap. Kutipan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
