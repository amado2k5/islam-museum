label: { ar: "الموطأ 628 — أبو أمامة بن سهل: كنا نشهد الجنائز فما يجلس آخر الناس حتى يؤذنوا", en: "Muwatta 628", es: "Muwatta 628", fr: "Muwatta 628", ur: "موطا 628", tr: "El-Muvatta 628 — Ebu Umame ibn Sahl: Biz cenazelere katılırdık ve son gelenler ezan okunana kadar oturmazlardı.", id: "Al-Muwatta 628 — Abu Umamah ibn Sahl: Kami biasa menghadiri pemakaman, dan orang-orang terakhir tidak akan duduk sampai azan berkumandang." }
text: "كنا نشهد الجنائز، فما يجلس آخر الناس حتى يؤذنوا"
summary:
  ar: "يرويه مالك عن أبي بكر بن عثمان بن سهل بن حنيف، أنه سمع أبا أمامة بن سهل بن حنيف يقول: كنا نشهد الجنائز فما يجلس آخر الناس حتى يُؤذنوا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.320}"
  tr: "Malik, Ebu Bekr ibn Osman ibn Sahl ibn Huneyf'ten rivayet ederek, Ebu Umame ibn Sahl ibn Huneyf'in şöyle dediğini işittiğini belirtmiştir: \"Cenazelere katılırdık ve en son oturan kişi ezan okunana kadar oturmazdı.\" Araştırmacı, Ebu Mus'ab ve Suveyd'in de Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.320}"
  id: "Malik meriwayatkan hadits ini dari Abu Bakr ibn Uthman ibn Sahl ibn Hunayf, yang mendengar Abu Umamah ibn Sahl ibn Hunayf berkata: \"Kami biasa menghadiri pemakaman, dan orang terakhir yang duduk tidak akan duduk sampai azan berkumandang.\" Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkan hadits ini dari Malik. {cite:muwatta-maruf-1997 p.320}"
