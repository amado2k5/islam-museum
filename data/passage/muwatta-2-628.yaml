text: "كنا نشهد الجنائز، فما يجلس آخر الناس حتى يؤذنوا"
summary:
  ar: "يرويه مالك عن أبي بكر بن عثمان بن سهل بن حنيف، أنه سمع أبا أمامة بن سهل بن حنيف يقول: كنا نشهد الجنائز فما يجلس آخر الناس حتى يُؤذنوا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.320}"
