text: "لَمْ يُسَمِّه فَكَفَّارَتُهُ كَفَّارَةُ يَمِينٍ، وَمَنْ نَذَرَ نَذْرًا فِي مَعْصِيّةِ فَكَفَّارَتُهُ كَفَّارَةُ يَمِينٍ، وَمَنْ نَذَرَ نَذْرًا لَا يُطِيقُهُ فَكَفَّارَتُهُ كَفَّارَةُ يَمِينِ)) . وَإِسْنَادُهُ صَحِيحٌ ، إِلَّا أَنَّ الْحُفَاظَ رَجَّحُوا وَقْفَهُ (١) . ١٢٨٢ - وَلِلْبُخَارِيّ ؛ مِنْ حَدِيثِ…"
