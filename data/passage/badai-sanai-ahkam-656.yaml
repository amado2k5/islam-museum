text: "… الجماعة الأولين؛ لأن ذلك مضاف إليهم؛ حيث لم ينتظروا حضور أهل المسجد، بخلاف أهل المسجد، لأن انتظارهم ليس بواجب عليهم، ولا حجة له في الحديث؛ لأنه أَمَّرَ واحداً، وذا لا يُكره، وإنما المكروه ما كان على سبيل التداعي والاجتماع، بل …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 656، يرد فيه ذكر الواجب، وما ليس بواجب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 656, whose wording mentions the obligatory (wajib), what is said not to be obligatory, the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 656 کا اقتباس جس میں واجب، جو واجب نہیں، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 656, dont le texte mentionne l'obligatoire (wajib), ce qui est dit non obligatoire, le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 656, cuyo texto menciona lo obligatorio (wajib), lo que se dice que no es obligatorio, lo reprobado (makruh); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 656. sayfasından, farz, farz olmayan ve mekruh sayılan amellerden bir alıntı; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, itaat amelleri, tavsiye edilen ameller, mekruh sayılan ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 656, yang menyebutkan amalan wajib, sunnah, dan makruh; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
