text: "… امر وأوصاه يمثل ما كان آباوه يوصون به قالوا وكان لمك يعظ قومه وينهاهم عن النزول الى ولد قابين خلا يتعظون حتى نزل جميع من كان في الجبل الى ولد قايين وقيل انه كان لمتوشلخ ابن آخر غير لمك يقال …"
summary:
