text: "إمراره، وهو محجوج باجماع من قبله. وقال أبو حنيفة : هذا الإمرار واجب، ووافقنا مالك وأحمد أنه مستحب • واحتج لأبى حنيفة بحديث عن ابن عمر عن النبى قال المحرم إذا لم يكن على رأسه شعر يمر الموسى على رأسه …"
summary:
  ar: "مقطع من المجموع للنووي، ص 199، يرد فيه ذكر الواجب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
