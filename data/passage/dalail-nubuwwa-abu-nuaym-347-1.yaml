text: "محمد رسول الله إلى قيصر صاحب الروم ) قال ابن أخ له أحمر أزرق سبط الشعر، قد نخر، ثم قال: لم لم يكتب إلى ملك الروم ولم يبدأ بك؟ فلا تقرا كتابه اليوم، فقال لهم: أخرجوه، ودعا بالأسقف، وكانوا يصدرون عن رأيه"
