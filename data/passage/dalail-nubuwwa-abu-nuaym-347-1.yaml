  ur: "ابو نعیم کی دلائل النبوۃ سے ایک اقتباس، قیصر کے ساتھ خط و کتابت میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "Sezar'ın yazışmalarında yer alan, Ebu Nuaym'ın Peygamberliğin Alametleri adlı eserinden, kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanan bir bölüm."
