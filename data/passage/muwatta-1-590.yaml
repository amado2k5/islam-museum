summary:
  ar: "آخر حديث في كتاب الصلاة من رواية يحيى. يرويه مالك عن ابن شهاب عن السائب بن يزيد، أنه رأى عمر بن الخطاب يضرب المنكدر في الصلاة بعد العصر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي في شرح المعاني (1/304)، وأن عبد الرزاق (3964) أخرجه عن الثوري عن معمر عن الزهري بنحوه. {cite:muwatta-maruf-1997 p.303}"
