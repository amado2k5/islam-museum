label: { ar: "الموطأ 590 — السائب بن يزيد: رأى عمر يضرب المنكدر في الصلاة بعد العصر", en: "Muwatta 590", es: "Muwatta 590", fr: "Muwatta 590", ur: "موطا 590", tr: "El-Muvatta 590 — El-Sa'ib bin Yezid: Ömer'in ikindiden sonra namaz sırasında Münkadir'e vurduğunu gördü.", id: "Al-Muwatta 590 — Al-Sa'ib bin Yazid: Dia melihat Umar memukul Al-Munkadir saat shalat setelah Ashar." }
summary:
  ar: "آخر حديث في كتاب الصلاة من رواية يحيى. يرويه مالك عن ابن شهاب عن السائب بن يزيد، أنه رأى عمر بن الخطاب يضرب المنكدر في الصلاة بعد العصر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وابن وهب عند الطحاوي في شرح المعاني (1/304)، وأن عبد الرزاق (3964) أخرجه عن الثوري عن معمر عن الزهري بنحوه. {cite:muwatta-maruf-1997 p.303}"
  tr: "Yahya'nın rivayet ettiği, Namaz Kitabı'ndaki son hadis, Malik tarafından İbn Şihab'dan, o da el-Sa'ib ibn Yazid'den nakledilmiştir; buna göre Malik, Ömer ibn el-Hattab'ın ikindi namazından sonra el-Munkadir'e vurduğunu görmüştür. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve İbn Vahb tarafından el-Tahavi'nin Şerh el-Ma'ani'sinde (1/304) nakledildiğini ve Abd el-Razzaq'ın (3964) da benzer bir biçimde el-Seviri'den, o da Ma'mar'dan, o da el-Zuhri'den naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.303}"
  id: "Hadits terakhir dalam Kitab Shalat, yang diriwayatkan oleh Yahya, diriwayatkan oleh Malik dari Ibn Shihab, dari al-Sa'ib ibn Yazid, bahwa ia melihat Umar ibn al-Khattab memukul al-Munkadir saat shalat setelah Asar. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan Ibn Wahb dalam Sharh al-Ma'ani karya al-Tahawi (1/304), dan bahwa Abd al-Razzaq (3964) meriwayatkannya dari al-Thawri, dari Ma'mar, dari al-Zuhri, dalam bentuk yang serupa. {cite:muwatta-maruf-1997 p.303}"
