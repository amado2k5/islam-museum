label: { ar: "الموطأ 1689 — الفضيل بن أبي عبد الله مولى المهري: كان القاسم وسالم يقولان إذا طلقت المرأة فدخلت في الدم من الحيضة الثالثة فقد بانت منه وحلت", en: "Muwatta 1689", es: "Muwatta 1689", fr: "Muwatta 1689", ur: "موطا 1689", tr: "El-Muvatta 1689 — El-Mahri'nin azatlı kölesi El-Fudayl ibn Abi Abdullah: El-Kâsim ve Salim, bir kadın boşandıktan sonra üçüncü adet dönemine girerse, kocasından boşanmış sayılır ve onunla yeniden evlenmekte özgür olur derlerdi.", id: "Al-Muwatta 1689 — Al-Fudayl ibn Abi Abdullah, budak yang dibebaskan oleh Al-Mahri: Al-Qasim dan Salim biasa mengatakan bahwa jika seorang wanita diceraikan dan kemudian mengalami haid ketiga, maka dia diceraikan dari suaminya dan bebas untuk menikah lagi dengannya." }
summary:
  ar: "يروي مالك عن الفضيل بن أبي عبد الله مولى المهري أن القاسم بن محمد وسالم بن عبد الله كانا يقولان إذا طلقت المرأة فدخلت في الدم من الحيضة الثالثة فقد بانت منه وحلت. {cite:muwatta-maruf-1997 p.91}"
  tr: "Malik, el-Mahri'nin azatlı kölesi el-Fudayl ibn Abi Abdullah'tan rivayetle, el-Kasım ibn Muhammed ve Salim ibn Abdullah'ın şöyle dediklerini aktarır: Bir kadın boşandıktan sonra üçüncü adet dönemine girerse, kocasından boşanmış olur ve onunla yeniden evlenmekte özgürdür. {cite:muwatta-maruf-1997 s.91}"
  id: "Malik meriwayatkan dari al-Fudayl ibn Abi Abdullah, budak yang dibebaskan oleh al-Mahri, bahwa al-Qasim ibn Muhammad dan Salim ibn Abdullah biasa berkata: Jika seorang wanita diceraikan dan kemudian mengalami haid ketiga, maka ia diceraikan dari suaminya dan bebas untuk menikah lagi dengannya. {cite:muwatta-maruf-1997 p.91}"
