label: { ar: "سنن النسائي 2884 — الأب والأبوة", en: "Sunan al-Nasa'i 2884 — the father and fatherhood", ur: "سنن نسائی 2884 — باپ اور والدیت", es: "Sunan al-Nasa'i 2884 — El padre y la paternidad" }
text: "… بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا يَحْيَى، قَالَ حَدَّثَنَا ابْنُ جُرَيْجٍ، أَخْبَرَنِي أَبُو الزُّبَيْرِ، عَنْ مُجَاهِدٍ، عَنْ أَبِي عُبَيْدَةَ، عَنْ أَبِيهِ، قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ لَيْلَةَ عَرَفَةَ الَّتِي قَبْلَ يَوْمِ عَرَفَةَ فَإِذَا حِسُّ الْحَيَّةِ فَقَالَ رَسُولُ اللَّهِ \" اقْتُلُوهَا \". فَدَخَلَتْ شَقَّ جُحْرٍ فَأَدْخَلْنَا عُودًا فَقَلَعْنَا بَعْضَ الْجُحْرِ فَأَخَذْنَا سَعَفَةً فَأَضْرَمْنَا فِيهَا نَارًا فَقَالَ رَسُولُ اللَّهِ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2884، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2884 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2884، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2884 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
