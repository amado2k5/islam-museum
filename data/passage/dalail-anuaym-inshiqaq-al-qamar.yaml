ref: "h. 207"
label: { ar: "دلائل النبوة لأبي نعيم — انشقاق القمر عن ابن مسعود", en: "Abu Nu'aym's Dala'il — the moon's splitting on Ibn Mas'ud's authority", ur: "ابو نعیم کی دلائل — ابن مسعود کی روایت میں چاند کا شق ہونا" }
text: "انشق القمر فرأيتُه فرقتين"
summary:
  ar: "في الفصل السادس عشر من «دلائل النبوة» يروي أبو نعيم ثلاث روايات في انشقاق القمر: عن ابن مسعود «انشق القمر فرأيتُه فرقتين»، وعن ابن عمر أنه سُئل يومئذ عن هذه الآية فقال «انشق القمر على عهد رسول الله فرقتين فقال: اشهدوا»، وعن ابن عباس «انشق القمر فرأيتُه فرقتين». ويضعها المؤلف في سياق الدلائل التي ظهرت بمكة قبل الهجرة، ويشير في الحاشية إلى أن رواية ابن مسعود أخرجها الطبراني."
  en: "In chapter sixteen of his Dala'il al-Nubuwwa Abu Nu'aym gives three reports of the moon's splitting: Ibn Mas'ud's 'the moon split and I saw it in two pieces'; Ibn Umar's that he was asked about the verse and said the moon split in two in the Prophet's lifetime and he said 'bear witness'; and Ibn Abbas's matching report. The author places them among the proofs that appeared at Mecca before the Hijra, noting in the margin that al-Tabarani transmitted Ibn Mas'ud's wording."
  ur: "اپنی کتاب 'دلائل نبوت' کے سولہویں باب میں ابو نعیم چاند کے شق ہونے کی تین روایات دیتا ہے: ابن مسعود کی 'چاند شق ہو گیا اور میں نے اسے دو ٹکڑوں میں دیکھا'؛ ابن عمر کی کہ ان سے اس وقت اس آیت کے بارے میں پوچھا گیا تو اس نے کہا کہ نبی کے زمانے میں چاند دو ٹکڑوں میں تقسیم ہوا اور اس نے 'گواہ رہو' کہا؛ اور ابن عباس کی اسی طرح کی روایت۔ مؤلف انہیں ہجرت سے پہلے مکہ میں ظاہر ہونے والے دلائل میں گنتا ہے۔"
