label: { ar: "دلائل النبوة لأبي نعيم — انشقاق القمر عن ابن مسعود", en: "Abu Nu'aym's Dala'il — the moon's splitting on Ibn Mas'ud's authority", ur: "ابو نعیم کی دلائل — ابن مسعود کی روایت میں چاند کا شق ہونا", es: "El Dala'il de Abu Nu'aym: la división de la luna según la autoridad de Ibn Mas'ud", fr: "Le Dalaïl d'Abu Nu'aym — la division de la lune sur l'autorité d'Ibn Mas'ud" }
text: "انشق القمر فرأيتُه فرقتين"
summary:
  ar: "في الفصل السادس عشر من «دلائل النبوة» يروي أبو نعيم ثلاث روايات في انشقاق القمر: عن ابن مسعود «انشق القمر فرأيتُه فرقتين»، وعن ابن عمر أنه سُئل يومئذ عن هذه الآية فقال «انشق القمر على عهد رسول الله فرقتين فقال: اشهدوا»، وعن ابن عباس «انشق القمر فرأيتُه فرقتين». ويضعها المؤلف في سياق الدلائل التي ظهرت بمكة قبل الهجرة، ويشير في الحاشية إلى أن رواية ابن مسعود أخرجها الطبراني."
  en: "In chapter sixteen of his Dala'il al-Nubuwwa Abu Nu'aym gives three reports of the moon's splitting: Ibn Mas'ud's 'the moon split and I saw it in two pieces'; Ibn Umar's that he was asked about the verse and said the moon split in two in the Prophet's lifetime and he said 'bear witness'; and Ibn Abbas's matching report. The author places them among the proofs that appeared at Mecca before the Hijra, noting in the margin that al-Tabarani transmitted Ibn Mas'ud's wording."
  ur: "اپنی کتاب 'دلائل نبوت' کے سولہویں باب میں ابو نعیم چاند کے شق ہونے کی تین روایات دیتا ہے: ابن مسعود کی 'چاند شق ہو گیا اور میں نے اسے دو ٹکڑوں میں دیکھا'؛ ابن عمر کی کہ ان سے اس وقت اس آیت کے بارے میں پوچھا گیا تو اس نے کہا کہ نبی کے زمانے میں چاند دو ٹکڑوں میں تقسیم ہوا اور اس نے 'گواہ رہو' کہا؛ اور ابن عباس کی اسی طرح کی روایت۔ مؤلف انہیں ہجرت سے پہلے مکہ میں ظاہر ہونے والے دلائل میں گنتا ہے۔"
  es: "En el capítulo dieciséis de su Dala'il al-Nubuwwa, Abu Nu'aym presenta tres relatos sobre la división de la luna: el de Ibn Mas'ud, quien afirma que la luna se partió en dos durante la vida del Profeta; el de Ibn Umar, quien, al ser consultado sobre el versículo, declaró que la luna se partió en dos durante la vida del Profeta y exclamó: «¡Den testimonio!»; y el relato coincidente de Ibn Abbas. El autor los incluye entre las pruebas que aparecieron en La Meca antes de la Hégira, señalando al margen que al-Tabarani transmitió la versión de Ibn Mas'ud."
  fr: "Dans le chapitre seize de son ouvrage Dala'il al-Nubuwwa, Abu Nu'aym rapporte trois récits de la division de la lune: celui d'Ibn Mas'ud (« la lune s'est fendue et je l'ai vue en deux morceaux »); celui d'Ibn Umar qui, interrogé sur ce verset, déclara que la lune s'était fendue en deux du vivant du Prophète et répondit: « Ayez-en témoignage »; et le récit concordant d'Ibn Abbas. L'auteur les classe parmi les preuves apparues à La Mecque avant l'Hégire, précisant en marge qu'al-Tabarani a transmis le texte d'Ibn Mas'ud."
