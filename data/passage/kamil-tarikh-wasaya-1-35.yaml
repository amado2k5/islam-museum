text: "… وأراد أبو نائلة بذِكر الحلقة، وهي السلاح، أن لا يُنكر السلاح إذا جاء مع أصحابه. فقال: إنّ في الحلقة لوفاء. فرجع أبو نائلة إلى أصحابه فأخبرهم، فأخذوا السلاح وساروا إليه، وشيّعهم النبيّ، الِلف إلى بَقيع الغَرْقَد، ودعا لهم. فلمًا انتهوا …"
