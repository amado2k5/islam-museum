text: "… بن دينار، عن أبى صالح، عن أبى هريرة، عن النبى ملياله قال الإيمان بِضعٌ وستون أو بضع وسبعون شُعْبَة، أفضلها لا إله إلا اللّٰه، وأدناها إماطةُ الأذَى عن الطريق، والحياء شُعْبَةٌ من الإيمان، البخارى : كتاب الايمان، باب أمور الايمان …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 209، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 2, p. 209, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 2، ص 209 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Adab al-Mufrad de Al-Bujari, volumen 2, pág. 209, que menciona las ramas de la fe, entendida como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du traité al-Adab al-Mufrad d'al-Bukhari (tome 2, p. 209), mentionnant les piliers de la foi, la foi étant définie comme une soixantaine de branches. Ce passage, issu d'une numérisation automatique, est cité en quarante mots, conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 2. cildinin 209. sayfasında, imanın dallarından bahsedilmekte ve imanın yetmişten fazla dalı olduğu belirtilmektedir. Bu, makine tarafından okunabilir taranmış baskıdan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri gibi bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 2, halaman 209, menyebutkan cabang-cabang iman, dan bahwa iman memiliki lebih dari tujuh puluh cabang. Ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
