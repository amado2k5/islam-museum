label: { ar: "موطأ مالك 1110 — ما لا يحل", en: "Muwatta Malik 1110 — what is not lawful", ur: "موطأ مالک 1110 — جو حلال نہیں", es: "Muwatta Malik 1110 — lo que no es lícito", fr: "Muwatta Malik 1110 — ce qui n'est pas licite" }
text: "… الْقَاسِمَ بْنَ مُحَمَّدٍ، سُئِلَ عَنْ رَجُلٍ، طَلَّقَ امْرَأَتَهُ الْبَتَّةَ ثُمَّ تَزَوَّجَهَا بَعْدَهُ رَجُلٌ آخَرُ فَمَاتَ عَنْهَا قَبْلَ أَنْ يَمَسَّهَا هَلْ يَحِلُّ لِزَوْجِهَا الأَوَّلِ أَنْ يُرَاجِعَهَا فَقَالَ الْقَاسِمُ بْنُ مُحَمَّدٍ لاَ يَحِلُّ لِزَوْجِهَا الأَوَّلِ أَنْ يُرَاجِعَهَا. قَالَ مَالِكٌ فِي الْمُحَلِّلِ إِنَّهُ لاَ يُقِيمُ عَلَى نِكَاحِهِ ذَلِكَ حَتَّى يَسْتَقْبِلَ نِكَاحًا جَدِيدًا فَإِنْ أَصَابَهَا فِي ذَلِكَ فَلَهَا مَهْرُهَا."
summary:
  ar: "حديث في موطأ مالك، رقم 1110، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Muwatta Malik, no. 1110 (Marriage), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "موطأ مالک کی حدیث نمبر 1110، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 1110 (Matrimonio), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Muwatta Malik, n° 1110 (Mariage), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
