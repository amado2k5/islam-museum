label: { ar: "جامع الترمذي 2521 — حلاوة الإيمان وكماله", en: "Jami' al-Tirmidhi 2521 — the sweetness and completeness of faith", ur: "جامع ترمذی 2521 — ایمان کی مٹھاس اور اس کا کمال", es: "Jami' al-Tirmidhi 2521 — La dulzura y la plenitud de la fe", fr: "Jami' al-Tirmidhi 2521 — la douceur et la plénitude de la foi", tr: "Cami' el-Tirmizi 2521 — İmanın tatlılığı ve mükemmelliği", id: "Jami' al-Tirmidhi 2521 — Manisnya dan kesempurnaan iman" }
text: "… بْنُ مُحَمَّدٍ الدُّورِيُّ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يَزِيدَ، حَدَّثَنَا سَعِيدُ بْنُ أَبِي أَيُّوبَ، عَنْ أَبِي مَرْحُومٍ عَبْدِ الرَّحِيمِ بْنِ مَيْمُونٍ، عَنْ سَهْلِ بْنِ مُعَاذِ بْنِ أَنَسٍ الْجُهَنِيِّ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" مَنْ أَعْطَى لِلَّهِ وَمَنَعَ لِلَّهِ وَأَحَبَّ لِلَّهِ وَأَبْغَضَ لِلَّهِ وَأَنْكَحَ لِلَّهِ فَقَدِ اسْتَكْمَلَ إِيمَانَهُ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ"
summary:
  ar: "حديث في جامع الترمذي، رقم 2521، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2521 (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara'), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2521، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2521 (Capítulos sobre la descripción del Día del Juicio, Ar-Riqaq y Al-Wara'), menciona la dulzura y la plenitud de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2521 (chapitres sur la description du Jour du Jugement, Ar-Riqaq et Al-Wara'), évoque la douceur et la plénitude de la foi. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Cami' el-Tirmizi'de 2521 numaralı hadis, imanın tatlılığı ve mükemmelliğinden bahseder. Bu hadis, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2521, menyebutkan manisnya dan kesempurnaan iman. Hadits ini disusun oleh seorang peneliti yang meneliti rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
