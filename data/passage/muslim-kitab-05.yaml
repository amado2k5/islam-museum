  ar: "صحيح مسلم، كتاب المساجد ومواضع الصلاة"
  en: "Sahih Muslim, Book 5: The Book of Mosques and Places of Prayer"
  ur: "صحیح مسلم، کتاب المساجد ومواضع الصلاۃ"
  es: "Sahih Muslim, Libro 5: El Libro de las Mezquitas y Lugares de Oración"
  fr: "Sahih Muslim, Livre 5: Le Livre des Mosquées et des Lieux de Prière"
summary:
  ar: "القسم 5 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المساجد ومواضع الصلاة»، ويضم فيها النصوص من 1161 إلى 1569 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 5 of Sahih Muslim (The Book of Mosques and Places of Prayer) in the division of the open hadith dataset the museum took its reports from: reports 1161 to 1569 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 5، عنوان «کتاب المساجد ومواضع الصلاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1161 تا 1569۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 5 de Sahih Muslim (El Libro de las Mezquitas y Lugares de Oración) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1161 al 1569, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des mosquées et des lieux de prière), dans sa partie ouverte, qui comprend les hadiths 1161 à 1569. Il classe ces hadiths dans ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
