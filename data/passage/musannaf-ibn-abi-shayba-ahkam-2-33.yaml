text: "في الرجل يُسبق ببعض الصلاة، من قال: لا يقضي حتى ينحرف الإمام.. - كتاب الصلاة الباب الرقم قدر كم يقعد في الركعتين الأُوليين؟.... ما يقال بعد التشهد مما رخص فيه..... من كان يستحب أن يدعو في الفريضة بما في القرآن.. …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 33، يرد فيه ذكر الفريضة والفرائض، والمستحب، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 33, whose wording mentions the obligation (farida), the recommended (mustahabb), the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 33 کا اقتباس جس میں فریضہ اور فرائض، مستحب، رخصت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Musannaf de Ibn Abi Shayba, volume numérisé 2, p. 33, dont le texte mentionne l'obligation (farida), le recommandé (mustahabb), la dispense (rukhsa) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
