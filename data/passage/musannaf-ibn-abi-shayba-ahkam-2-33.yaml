  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 2. cildinin 33. sayfasından, farz olan amelleri, müstehap olan amelleri ve muafiyetleri sıralayan bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz olan amelleri, görevleri, itaat amellerini, müstehap olan amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları sıralayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Musannaf karya Ibn Abi Shaybah, Jilid 2, halaman 33, yang menyebutkan amalan wajib, amalan anjuran, dan keringanan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
