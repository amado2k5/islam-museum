label: { ar: "صحيح مسلم 6466 — الأب والأبوة", en: "Sahih Muslim 6466 — the father and fatherhood", ur: "صحیح مسلم 6466 — باپ اور والدیت", es: "Sahih Muslim 6466 — El padre y la paternidad", fr: "Sahih Muslim 6466 — Le père et la paternité", tr: "Sahih Muslim 6466 — Baba ve Babalık", id: "Sahih Muslim 6466 — Ayah dan Peran Ayah" }
text: "… حُسَيْنُ بْنُ عَلِيٍّ الْجُعْفِيُّ، - عَنْ مُجَمِّعِ بْنِ يَحْيَى، عَنْ سَعِيدِ بْنِ أَبِي بُرْدَةَ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، قَالَ صَلَّيْنَا الْمَغْرِبَ مَعَ رَسُولِ اللَّهِ ثُمَّ قُلْنَا لَوْ جَلَسْنَا حَتَّى نُصَلِّيَ مَعَهُ الْعِشَاءَ - قَالَ - فَجَلَسْنَا فَخَرَجَ عَلَيْنَا فَقَالَ \" مَا زِلْتُمْ هَا هُنَا \". قُلْنَا يَا رَسُولَ اللَّهِ صَلَّيْنَا مَعَكَ الْمَغْرِبَ ثُمَّ قُلْنَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6466، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6466 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6466، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 6466 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6466 (Livre des mérites des Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 6466 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6466, menyebutkan tentang ayah dan peran ayah. Peramban \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
