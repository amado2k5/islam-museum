text: "… إذا شرع رجلان كل واحد منهما في صلاة التطوّع وحده، ثم أفسدها على نفسه حتى وجب عليه القضاء فاقتدى أحدهما بصاحبه - لا يصح؛ لأن سبب وجوب الصلاتين مختلف، وهو نذر كل واحد منهما وشروعه، فاختلف الواجبان وتغايرا، وذلك يمنع …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 626، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 626, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed, the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 626 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
