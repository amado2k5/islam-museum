text: "… إذا شرع رجلان كل واحد منهما في صلاة التطوّع وحده، ثم أفسدها على نفسه حتى وجب عليه القضاء فاقتدى أحدهما بصاحبه - لا يصح؛ لأن سبب وجوب الصلاتين مختلف، وهو نذر كل واحد منهما وشروعه، فاختلف الواجبان وتغايرا، وذلك يمنع …"
summary:
  ar: "مقطع من بدائع الصنائع للكاساني، ص 626، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Kasani's Bada'i' al-Sana'i', p. 626, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed, the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدائع الصنائع، کاسانی، ص 626 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bada'i' al-Sana'i' de al-Kasani, p. 626, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable, l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bada'i' al-Sana'i' de al-Kasani, p. 626, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo que obliga a la persona responsable, el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Kasani'nin Bada'i' el-Sana'i' adlı eserinin 626. sayfasından, farz ameller, görevler, sorumlu kişiden beklenenler ve gönüllü ameller hakkında bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Bada'i' al-Sana'i' karya Al-Kasani, halaman 626, yang membahas tentang amalan wajib, kewajiban, apa yang dituntut dari orang yang bertanggung jawab, dan amalan sunnah; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
