text: "… بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا وَكِيعٌ، عَنْ سُفْيَانَ، عَنِ الْجُرَيْرِيِّ، عَنْ أَبِي السَّلِيلِ، عَنْ أَبِي مُجِيبَةَ الْبَاهِلِيِّ، عَنْ أَبِيهِ، أَوْ عَنْ عَمِّهِ، قَالَ أَتَيْتُ النَّبِيَّ ـ فَقُلْتُ يَا نَبِيَّ اللَّهِ أَنَا الرَّجُلُ الَّذِي أَتَيْتُكَ عَامَ الأَوَّلِ. قَالَ \" فَمَا لِي أَرَى جِسْمَكَ نَاحِلاً \". قَالَ يَا رَسُولَ اللَّهِ مَا أَكَلْتُ طَعَامًا بِالنَّهَارِ مَا أَكَلْتُهُ إِلاَّ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1741، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1741 (Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1741، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
