label: { ar: "سنن النسائي 2734 — ضحك وتبسم", en: "Sunan al-Nasa'i 2734 — laughter and smiling", ur: "سنن نسائی 2734 — ہنسی اور تبسم", fr: "Sunan al-Nasa'i 2734 — rire et sourire", es: "Sunan al-Nasa'i 2734 — risa y sonrisa", tr: "Sunan an-Nasa'i 2734 — Kahkaha ve Gülümseme", id: "Sunan an-Nasa'i 2734 — Tawa dan Senyum" }
text: "أَخْبَرَنَا قُتَيْبَةُ، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنْ مُحَمَّدِ بْنِ عَبْدِ اللَّهِ بْنِ الْحَارِثِ بْنِ نَوْفَلِ بْنِ الْحَارِثِ بْنِ عَبْدِ الْمُطَّلِبِ، أَنَّهُ حَدَّثَهُ أَنَّهُ، سَمِعَ سَعْدَ بْنَ أَبِي وَقَّاصٍ، وَالضَّحَّاكَ بْنَ قَيْسٍ، - عَامَ حَجَّ مُعَاوِيَةُ بْنُ أَبِي سُفْيَانَ - وَهُمَا يَذْكُرَانِ التَّمَتُّعَ بِالْعُمْرَةِ إِلَى الْحَجِّ فَقَالَ الضَّحَّاكُ لاَ يَصْنَعُ ذَلِكَ إِلاَّ مَنْ جَهِلَ أَمْرَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2734، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan al-Nasa'i, no. 2734, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن نسائی کی حدیث نمبر 2734، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 2734, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan al-Nasa'i, n.º 2734, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
  tr: "Sunan-ı Nesai'de yer alan 2734 numaralı hadis, kahkaha ve gülümsemeyi içermektedir. Bu hadis, Juha ve İslami folklor derleyicisi tarafından, Kur'an, Sünnet, biyografi ve kahkaha, mizah ve anekdotlar üzerine yazılmış kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2734, berisi tentang tawa dan senyuman. Hadits ini dikumpulkan oleh Juha dan perajin cerita rakyat Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang tawa, humor, dan anekdot."
