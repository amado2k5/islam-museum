text: "… يُبيِّن أن الإصلاح بين الطائفتين كان محبوبًا ممدوحًا يحبه الله ورسوله، وأن ما فعله الحسن من ذلك كان من أعظم فضائله ومناقبه التي أثنى بها عليه النبي. ولو كان القتال واجبًا أو مستحبًّا لم يُئنِ النبي على أحدٍ بترك واجبٍ …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 63، يرد فيه ذكر الواجب، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 63, whose wording mentions the obligatory (wajib), the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، خلال، ص 63 کا اقتباس جس میں واجب، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de al-Khallal, p. 63, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de al-Khallal, p. 63, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 63. sayfasından, farz ve müstehap olan amelleri sıralayan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehap olan amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları sıralayan bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari buku Al-Khallal \"Al-Sunnah,\" halaman 63, yang menyebutkan amalan wajib dan anjuran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
