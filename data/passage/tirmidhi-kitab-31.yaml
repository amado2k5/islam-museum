summary:
  ar: "القسم 31 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الولاء والهبة عن رسول الله»، ويضم فيها النصوص من 2125 إلى 2132 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 31 of Jami' al-Tirmidhi (Chapters On Wala' And Gifts) in the division of the open hadith dataset the museum took its reports from: reports 2125 to 2132 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 31، عنوان «کتاب الولاء والہبۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2125 تا 2132۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 31 de Jami' al-Tirmidhi (Capítulos sobre Wala' y Donaciones) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes 2125 a 2132 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
