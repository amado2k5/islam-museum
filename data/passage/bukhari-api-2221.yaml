label: { ar: "صحيح البخاري 2221 — ما حُرّم", en: "Sahih al-Bukhari 2221 — what was made unlawful", ur: "صحیح بخاری 2221 — جو حرام کیا گیا", es: "Sahih al-Bukhari 2221 — lo que se declaró ilícito", fr: "Sahih al-Bukhari 2221 — ce qui a été déclaré illicite" }
text: "حَدَّثَنَا زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا أَبِي، عَنْ صَالِحٍ، قَالَ حَدَّثَنِي ابْنُ شِهَابٍ، أَنَّ عُبَيْدَ اللَّهِ بْنَ عَبْدِ اللَّهِ، أَخْبَرَهُ أَنَّ عَبْدَ اللَّهِ بْنَ عَبَّاسٍما ـ أَخْبَرَهُ أَنَّ رَسُولَ اللَّهِ مَرَّ بِشَاةٍ مَيِّتَةٍ فَقَالَ \" هَلاَّ اسْتَمْتَعْتُمْ بِإِهَابِهَا \". قَالُوا إِنَّهَا مَيِّتَةٌ. قَالَ \" إِنَّمَا حَرُمَ أَكْلُهَا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 2221، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 2221 (Sales and Trade), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 2221، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih al-Bukhari, n.º 2221 (Ventas y Comercio), menciona lo que se considera ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 2221 (Commerce et Ventes), mentionne ce qui a été rendu illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
