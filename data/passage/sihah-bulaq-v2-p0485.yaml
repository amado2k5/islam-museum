text: |-
  ١٠٢
  *(فصل الطاء,,
  ⁦(طلق)⁩.
  الدواب عثل الدقدقة وربما قالواحبطة طق كأنهم -كوابه صوت الجرى وأنشد المازنى
  جرت الخيل فقالت حبطق طق * ولم أرهذا الحرف الافى كابه ( لق رجل طلق
  الوجه وطليق الوجه وقد طلق بالضم طلاقة ورجل طلق اليسدين أى سمح وامر أة طلة
  اليدين ورجل طلق اللسان وطليق اللسان ولسان طلق ذلق وطليق ذليق وطلق ذلق وطلق
  ذاق أربع لغات ويوم طلق وايلد طلق أيضا اذ الم يكن فيهمارولاشى يؤذى والمطلق ضرب
  من الادوية والطلق وجع الولادة وقد طلقت المرأة نطلق طلقا على مالم يسمّ فاعله والطلق
  بالتحريك قيد من جلود ويقال أيضاء_دا الفرس طلقا أو طلقين أى شوطا أوشوطين
  والطلق أيضاسير الليل لورد الغب وهوأن يكون بين الابل وبين المعليلتات فالليلة الاولى
  الطلق يخلى الراعى ابلد الى الماء ويتركها مع ذلك ترعى وهوتسير فالابل بعد التحو يزطوالق
  وهى فى الليلة الشانية قوارب وقد أطلقتها حتى طلقت حالذا وطلوقا والاسم الطلق بالتحريك
  وأطلق القوم فهم مطلقون اذاطلقت ابلهم وأطاقت الاسير أى خليته وأطلقت الناقة من
  عقالها فطلقت هى بالفتح وأطلق يده بخير وطلقها أيضا وينشد
  اطلق يديك تنفعاك يارجل بالريث ما أرويتهالا بالعجل
  بالضم والفتح والطليق الاسير الذى أطلق عنه اساره وخلى سبيله وبعبر طلق وناقة طلق بضم
  الطاء واللام أى غيره قيد والجمع أطلاق وحبس فلان فى السجن طاقا أى بغير قيد ويقال
  أيضا فرس طلق احدى القوائم اذا كانت احدى قوائمها لا تحجيل فيها والطلق بالكسر الحلال
  يقال هولك طلقا وأنت طلمق من هذا الامرأى خارج منه والانطلاق الذهاب وتقول انطلق
  به على مالم يسم تفاعله كما يقال لنقطع به وتصغير منطلق معيلمق وان شئت عوّضت من النون
  وقات مطيليق وتصغير الانطلاق تطيليق لانك حذفت ألف الوصل لات أول الاسم يلزم
  تحريكه بالضم للتحة-يرفتقط الهمزة لزوال السكون الذى كانت الهمزة اجتلبت له فبقى
  نطلاق ووقعت الالف رابعة فلذلك وجب التعويض ف.ه كما تقولد نينيرلات رف اللين اذا
  كان رابعاثيت البدل منه فلم يسقط الافى ضرورة الشعراً ويكون بعدهاياء كولهم فى أنفية
  أثاف فقس على ذلك واستطلاق الطن مشموتصغيره تطمليق وطلق السليم على مالم يسم
  فاءله إذارجعت اليه نفه وسكن وجعه بعد العداد فهو مطاق قال الشاعر
  تيت الهموم الطارقات تعدنى • كما تعترى الاهوال رأس المطلق
  وقال النابغة
  تناذرها الراقون من سوسمها * تطلقه طوراوطوراتراجع
  وطلق الرجسل امر أته تطليقا وطلقت هى بالفتح تطلق طلاقا فهى طالق وطالقة أيضا قال
  الاعشى• أجار تنابيق فانك طالقه * قال الاخفش لا يقال طلقت بالضم ورجل مطلاق
  أى كثير الطلاق للنساء وكذلك رجل طلقة مثال ه_مزة وناقة طالق ونعجة طالق أى مرسلة
  ترعى حيث شاءت والطالق من الابل التى يتركها الراعى لنفسه لا يحتلبهاء-لى الماء يقال
  استطلق الراعى ناقة لنف-ه وتطلق الظبى أى.رلا يلوى على شئ وهو تفعل ويقال ما تطالق
  نفسى لهذا الامر أى لا تنشرح وهو تفتعسل وتصغير الاطلاق طتيليق تقلب الطباءتاء تحرك
  ا أطلء
