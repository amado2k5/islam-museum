label: { ar: "سنن أبي داود 2139 — استحلال الشيء", en: "Sunan Abi Dawud 2139 — treating a thing as lawful", ur: "سنن ابی داؤد 2139 — کسی چیز کو حلال ٹھہرانا", es: "Sunan Abi Dawud 2139 — tratar algo como lícito", fr: "Sunan Abi Dawud 2139 — considérer une chose comme licite", tr: "Sünen Ebu Davud 2139 — Bir şeyi mubah kılmak", id: "Sunan Abi Dawud 2139 — Menghalalkan sesuatu" }
text: "حَدَّثَنَا عِيسَى بْنُ حَمَّادٍ، أَخْبَرَنِي اللَّيْثُ، عَنْ يَزِيدَ بْنِ أَبِي حَبِيبٍ، عَنْ أَبِي الْخَيْرِ، عَنْ عُقْبَةَ بْنِ عَامِرٍ، عَنْ رَسُولِ اللَّهِ أَنَّهُ قَالَ \" إِنَّ أَحَقَّ الشُّرُوطِ أَنْ تُوفُوا بِهِ مَا اسْتَحْلَلْتُمْ بِهِ الْفُرُوجَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 2139، يذكر استحلال الشيء. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2139 (Marriage (Kitab Al-Nikah)), that mentions treating a thing as lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2139، جس میں کسی چیز کو حلال ٹھہرانا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2139 (Matrimonio (Kitab Al-Nikah)), menciona la consideración de algo como lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2139 (Mariage (Kitab Al-Nikah)), mentionne la possibilité de considérer une chose comme licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan Ebu Davud'da yer alan 2139 numaralı hadis, bir şeyin helal olup olmadığını belirtir. Helal ve haram bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alıntılar derler."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 2139, menyebutkan tentang kebolehan sesuatu. Bagian halal dan haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
