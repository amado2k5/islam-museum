label: { ar: "جامع الترمذي 309 — الأب والأبوة", en: "Jami' al-Tirmidhi 309 — the father and fatherhood", ur: "جامع ترمذی 309 — باپ اور والدیت", es: "Jami' al-Tirmidhi 309 — El padre y la paternidad" }
text: "… عَبْدِ اللَّهِ الْخُزَاعِيُّ الْبَصْرِيُّ، حَدَّثَنَا زَيْدُ بْنُ الْحُبَابِ، حَدَّثَنَا حُسَيْنُ بْنُ وَاقِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ يَقْرَأُ فِي الْعِشَاءِ الآخِرَةِ بِالشَّمْسِ وَضُحَاهَا وَنَحْوِهَا مِنَ السُّوَرِ. قَالَ وَفِي الْبَابِ عَنِ الْبَرَاءِ بْنِ عَازِبٍ وَأَنَسٍ. قَالَ أَبُو عِيسَى حَدِيثُ بُرَيْدَةَ حَدِيثٌ حَسَنٌ. وَقَدْ رُوِيَ عَنِ النَّبِيِّ أَنَّهُ قَرَأَ فِي الْعِشَاءِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 309، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 309 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 309، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 309 (El Libro de la Oración), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
