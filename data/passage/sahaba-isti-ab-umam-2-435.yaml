text: "… بن أبي حذيفة بن عتبة بن ربيعة، فخلع السائب، وتأمَّر من قريش، ثم ولاه عثمان بعدَ ذلك مصر في سنة على مصر، ورجع عبد اللّٰه بن سَعد من وفادته، خمس وعشرين، وفتح على يديه إفريقية سنة سبع وعشرين، وكان فارس …"
