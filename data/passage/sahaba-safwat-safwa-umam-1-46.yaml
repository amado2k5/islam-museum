text: "… وتحمل الكَلَّ، وتقري الضيف، وتعين على نوائب الحق. ثم انطلقت به خديجة حتى أتت به ورقة بن نوفل بن أسد بن عبد العزى بن قصي - وهو ابن عم خديجة أخي أبيها، وكان امراً تنصّر في الجاهلية، وكان يكتب الكتاب …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 1، ص 46، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
