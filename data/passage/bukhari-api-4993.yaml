label: { ar: "صحيح البخاري 4993 — الحلال، الحرام", en: "Sahih al-Bukhari 4993 — the lawful; the unlawful", ur: "صحیح بخاری 4993 — حلال، حرام" }
text: "… أَوَّلَ مَا نَزَلَ مِنْهُ سُورَةٌ مِنَ الْمُفَصَّلِ فِيهَا ذِكْرُ الْجَنَّةِ وَالنَّارِ حَتَّى إِذَا ثَابَ النَّاسُ إِلَى الإِسْلاَمِ نَزَلَ الْحَلاَلُ وَالْحَرَامُ، وَلَوْ نَزَلَ أَوَّلَ شَىْءٍ لاَ تَشْرَبُوا الْخَمْرَ. لَقَالُوا لاَ نَدَعُ الْخَمْرَ أَبَدًا. وَلَوْ نَزَلَ. لاَ تَزْنُوا. لَقَالُوا لاَ نَدَعُ الزِّنَا أَبَدًا. لَقَدْ نَزَلَ بِمَكَّةَ عَلَى مُحَمَّدٍ وَإِنِّي لَجَارِيَةٌ أَلْعَبُ {بَلِ السَّاعَةُ مَوْعِدُهُمْ وَالسَّاعَةُ أَدْهَى وَأَمَرُّ} …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4993، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4993 (Virtues of the Qur'an), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4993، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
