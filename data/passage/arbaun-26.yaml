label: { ar: "الأربعون 26 — كل سلامى من الناس عليه صدقة", en: "Arba'un 26 — charity is due on every joint", es: "26 de Arba'un: se debe dar caridad por cada articulación.", fr: "Arba'un 26 — une aumône est due pour chaque joint", ur: "اربعون 26 - ہر جوڑ پر صدقہ واجب ہے۔" }
text: "كل سلامى من الناس عليه صدقة كل يوم تطلع فيه الشمس: تعدل بين الاثنين صدقة، وتعين الرجل في دابته فتحمله عليها أو ترفع له عليها متاعه صدقة، والكلمة الطيبة صدقة، وبكل خطوة تمشيها إلى الصلاة صدقة، وتميط الأذى عن الطريق صدقة"
summary:
  ar: "حديث أبي هريرة قال: قال رسول الله: «كل سلامى من الناس عليه صدقة كل يوم تطلع فيه الشمس» ثم عدد منها العدل بين الاثنين وإعانة الرجل في دابته بحمله عليها أو رفع متاعه إليها والكلمة الطيبة وكل خطوة تمشى إلى الصلاة وإماطة الأذى عن الطريق — وهو الحديث السادس والعشرون في الأربعين النووية وفي شرح ابن رجب؛ خرجاه في الصحيحين من رواية همام بن منبه عن أبي هريرة ⁦(البخاري 2707 و2891 و2989، مسلم 1009)⁩ والروايات مطولة ومختصرة؛ والسلامى جمع سلامية وهي الأنملة من أنامل الأصابع وقيل التي بين كل مفصلين وقيل كل عظم مجوف من صغار العظام فمعنى الحديث على كل عظم من عظام ابن آدم صدقة؛ وخرج البزار من رواية أبي صالح عن أبي هريرة «الإنسان ثلاثمئة وستون عظماً أو ستة وثلاثون سلامى عليه في كل يوم صدقة» ثم التدرج لمن لم يجد: يأمر بالمعروف وينهى عن المنكر، فإن لم يستطع رفع عظماً عن الطريق، فإن لم يستطع أعان ضعيفاً، فإن لم يستطع فليدع الناس من شره — وإسناده فيه نظر؛ وخرج مسلم (1007) من حديث عائشة «خلق ابن آدم على ستين وثلاثمئة مفصل فمن ذكر الله وحمده وهلله وسبحه أو عزل حجراً أو شوكة أو عظماً عن طريق المسلمين أو أمر بمعروف أو نهى عن منكر عدد تلك السلامى أمسى من يومه وقد زحزح نفسه عن النار»؛ وخرج مسلم أيضاً من رواية أبي الأسود الديلي عن أبي ذر بلفظ قريب وختمه «ويجزئ من ذلك ركعتان يركعهما من الضحى»؛ وخرج أحمد وأبو داود من حديث بريدة بثلاثمئة وستين مفصلاً وفيه «النخاعة في المسجد تدفنها والشيء تنحيه عن الطريق فإن لم تجد فركعتا الضحى تجزئك»؛ وفي الصحيحين عن أبي موسى «على كل مسلم صدقة» ثم التدرج: فإن لم يجد فيعمل بيده فينفع نفسه ويتصدق، فإن لم يستطع يعين ذا الحاجة الملهوف، فإن لم يفعل فليأمر بالمعروف، فإن لم يفعل فليمسك عن الشر فإنه له صدقة؛ وخرج ابن حبان من حديث ابن عباس وإسناده فيه مقال لأنه من رواية سماك عن عكرمة وهي مضطربة وإن كان للحديث ما يقويه ⁦(جامع العلوم والحكم ص 546–565)⁩."
  en: "The hadith of Abu Hurayra that the Messenger of God said 'on every joint of the people a charity is due each day the sun rises', then enumerated among them judging justly between two people, helping a man onto his mount or lifting his goods onto it, the good word, every step walked to prayer, and removing harm from the road — the twenty-sixth of al-Nawawi's Forty and of Ibn Rajab's commentary; the two Shaykhs transmitted it through Hammam ibn Munabbih from Abu Hurayra (al-Bukhari 2707, 2891, 2989; Muslim 1009), the routes coming long and short; sulama is the plural of sulamiyya — the finger-joints, or what lies between each two joints, or every hollow small bone — so the hadith means a charity on every bone of the son of Adam; al-Bazzar transmits through Abu Salih from Abu Hurayra 'man has three hundred and sixty bones, or six and thirty joints, upon each a daily charity', then the descending ladder for one who finds nothing: commanding right and forbidding wrong, then removing a bone from the road, then aiding the weak, then at least sparing people his evil — with remarks on its chain; Muslim (1007) carries from A'isha 'the son of Adam was created upon three hundred and sixty joints; whoever mentions God, praises Him, declares His unity, glorifies Him, or removes a stone, a thorn or a bone from the Muslims' road, or commands right or forbids wrong, numbering those three hundred and sixty joints, ends his day having moved his soul away from the Fire'; Muslim also carries through Abu al-Aswad al-Du'ali from Abu Dharr in near wording ending 'and two rak'as performed at mid-morning suffice for all of that'; Ahmad and Abu Dawud carry from Burayda the three-hundred-and-sixty-joints wording with 'spittle in the mosque which you bury and a thing you move from the road — and if not, two mid-morning rak'as suffice you'; the two Sahihs carry from Abu Musa 'on every Muslim is a charity' with its ladder — working with his hands for his own benefit and alms, aiding the desperate needy, commanding right, and finally withholding from evil, 'for that is an alms from him'; and Ibn Hibban carries it from Ibn Abbas through a chain open to question — Samak from Ikrima is unsettled — though the hadith has what corroborates it (Jami' al-Ulum wal-Hikam pp. 546–565)."
  es: "El hadiz de Abu Hurayra que el Mensajero de Dios dijo 'sobre cada articulación de la gente se debe una caridad cada día que sale el sol', luego enumeró entre ellas juzgar con justicia entre dos personas, ayudar a un hombre a subir a su montura o levantar sus bienes sobre ella, la buena palabra, cada paso dado a la oración y quitar el daño del camino - el vigésimo sexto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; los dos Shaykhs lo transmitieron a través de Hammam ibn Munabbih de Abu Hurayra (al-Bukhari 2707, 2891, 2989; Muslim 1009), las rutas que vienen largas y cortas; sulama es el plural de sulamiyya - las articulaciones de los dedos, o lo que hay entre cada dos articulaciones, o cada pequeño hueso hueco - por lo que el hadiz significa una caridad sobre cada hueso del hijo de Adán; al-Bazzar transmite a través de Abu Salih de Abu Hurayra: \"el hombre tiene trescientos sesenta huesos, o treinta y seis articulaciones, sobre cada uno una caridad diaria\", luego la escalera descendente para aquel que no encuentra nada: ordenar el bien y prohibir el mal, luego quitar un hueso del camino, luego ayudar al débil, luego al menos evitar que la gente su mal, con comentarios en su cadena; Muslim (1007) lleva de Aisha: \"el hijo de Adán fue creado sobre trescientos sesenta articulaciones; quienquiera que mencione a Dios, lo alabe, declare Su unidad, lo glorifique, o quite una piedra, una espina o un hueso del camino de los musulmanes, o ordene el bien o prohíba el mal, contando esas trescientos sesenta articulaciones, termina su día habiendo alejado su alma del Fuego\"; Muslim también lleva a través de Abu al-Aswad al-Du'ali de Abu Dharr en una redacción cercana que termina \"y dos rak'as realizadas a media mañana bastan para todo eso\"; Ahmad y Abu Dawud toman de Burayda la redacción de trescientas sesenta articulaciones con 'escupir en la mezquita que entierras y algo que quitas del camino; y si no, dos rak'as a media mañana te bastan'; los dos Sahih toman de Abu Musa 'sobre cada musulmán hay una caridad' con su escalera: trabajar con sus manos para su propio beneficio y limosna, ayudar a los necesitados desesperados, ordenar lo correcto y, finalmente, abstenerse del mal, 'porque eso es una limosna de él'; e Ibn Hibban lo toma de Ibn Abbas a través de una cadena cuestionable - Samak de Ikrima no está establecido - aunque el hadiz tiene lo que lo corrobora (Jami' al-Ulum wal-Hikam pp. 546-565)."
  fr: "Le hadith d'Abu Hurayra rapporte que le Messager de Dieu a dit: « Une aumône est due pour chaque articulation du corps chaque jour où le soleil se lève », puis énumère parmi elles: juger équitablement entre deux personnes, aider un homme à monter sur sa monture ou à y charger ses biens, prononcer une bonne parole, chaque pas effectué pour la prière et enlever le danger de la route — le vingt-sixième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; les deux cheikhs l'ont transmis par Hammam ibn Munabbih d'après Abu Hurayra (al-Bukhari 2707, 2891, 2989; Muslim 1009), les itinéraires étant longs et courts; sulama est le pluriel de sulamiyya — les articulations des doigts, ou ce qui se trouve entre chaque articulation, ou chaque petit os creux — ainsi le hadith signifie une aumône pour chaque os du fils d'Adam; Al-Bazzar transmet, par l'intermédiaire d'Abu Salih d'après Abu Hurayra: « L'homme possède trois cent soixante os, soit trente-six articulations, sur chacune desquels il doit accomplir une aumône quotidienne. » Puis, la suite pour celui qui ne trouve rien: ordonner le bien et interdire le mal, puis enlever un os du chemin, puis aider le faible, puis au moins épargner aux gens son mal – avec des remarques sur sa chaîne de transmission. Muslim (1007) rapporte d'après Aïcha: « Le fils d'Adam a été créé sur trois cent soixante articulations; quiconque mentionne Dieu, Le loue, proclame Son unicité, Le glorifie, ou enlève une pierre, une épine ou un os du chemin des musulmans, ou ordonne le bien ou interdit le mal, comptant ces trois cent soixante articulations, termine sa journée en ayant éloigné son âme du Feu. » Muslim rapporte également, par l'intermédiaire d'Abu al-Aswad al-Du'ali d'après Abu Dharr, avec une formulation similaire, concluant: « et deux rak'as accomplies en milieu de matinée suffisent pour tout cela. » Ahmad et Abu Dawud rapportent de Burayda la formulation des trois cent soixante articulations avec « la salive dans la mosquée que vous enterrez et une chose que vous déplacez de la route — et sinon, deux rak'as en milieu de matinée vous suffisent »; les deux Sahihs rapportent d'Abu Musa « chaque musulman fait l'aumône » avec son échelle — travailler de ses mains pour son propre bénéfice et l'aumône, aider les nécessiteux désespérés, ordonner le bien et enfin s'abstenir du mal, « car cela est une aumône de sa part »; et Ibn Hibban le rapporte d'Ibn Abbas par une chaîne sujette à caution — Samak d'Ikrima est incertain — bien que le hadith contienne des éléments qui le corroborent (Jami' al-Ulum wal-Hikam pp. 546–565)."
  ur: "ابوہریرہ سے روایت ہے کہ رسول اللہ نے فرمایا: ”ہر دن سورج نکلتا ہے لوگوں کے ہر جوڑ پر صدقہ ہوتا ہے“، پھر ان میں سے دو آدمیوں کے درمیان انصاف کے ساتھ فیصلہ کرنا، کسی آدمی کو اس کے سواری پر چڑھانا یا اس پر اپنا سامان اٹھانا، اچھی بات، نماز کے لیے ہر قدم چلنا، اور راستے سے تکلیف کو دور کرنا یعنی بیسویں بار۔ رجب کی تفسیر؛ دونوں شیوخ نے اسے ہمام بن منابیح کے ذریعے ابو ہریرہ سے منتقل کیا ⁦(البخاری 2707، 2891، 2989؛ مسلم 1009)⁩، راستے لمبے اور چھوٹے آتے ہیں۔ سلمہ سلیمیہ کی جمع ہے — انگلی کے جوڑ، یا جو ہر دو جوڑ کے درمیان ہے، یا ہر کھوکھلی چھوٹی ہڈی — تو حدیث کا مطلب ہے ابن آدم کی ہر ہڈی پر صدقہ۔ البزار ابو صالح کے ذریعے ابو ہریرہ سے منقول ہے کہ آدمی کی تین سو ساٹھ ہڈیاں، یا چھ تیس جوڑ، ہر ایک پر روزانہ صدقہ ہوتا ہے، پھر اس کے لیے سیڑھی اترتی ہے جس کو کچھ نہیں ملتا: نیکی کا حکم دینا اور برائی سے منع کرنا، پھر راستے سے ہڈی ہٹانا، پھر کمزوروں کی مدد کرنا، پھر کم از کم اس کے برے لوگوں پر نشان لگانا۔ مسلم (1007) عائشہ ا سے روایت ہے کہ ابن آدم کو تین سو ساٹھ جوڑوں پر پیدا کیا گیا تھا۔ جو شخص اللہ کا ذکر کرتا ہے، اس کی حمد کرتا ہے، اس کی توحید کا اعلان کرتا ہے، اس کی تسبیح کرتا ہے، یا مسلمانوں کے راستے سے پتھر، کانٹا یا ہڈی ہٹاتا ہے، یا نیکی کا حکم دیتا ہے یا برائی سے روکتا ہے، ان تین سو ساٹھ جوڑوں کو گن کر اس کا دن ختم ہو جاتا ہے، اس نے اپنی روح کو آگ سے دور کر دیا۔ مسلم نے ابو ذر سے ابو الاسود الدعلی کے ذریعے بھی قریب الفاظ میں ختم کیا ہے 'اور ان سب کے لیے صبح کی دو رکعتیں کافی ہیں'؛ احمد اور ابو داؤد نے بریدہ سے تین سو ساٹھ جوڑوں کا لفظ لیا ہے جس میں 'مسجد میں تھوک جسے آپ دفن کرتے ہیں اور ایک چیز جسے آپ راستے سے ہٹاتے ہیں - اور اگر نہیں تو آپ کے لیے صبح کی دو رکعتیں کافی ہیں'؛ ابو موسیٰ سے لے کر دو صحیحیں 'ہر مسلمان پر صدقہ ہے' اس کی سیڑھی کے ساتھ - اپنے ہاتھ سے اپنے فائدے اور خیرات کے لیے کام کرنا، بے سہارا ضرورت مندوں کی مدد کرنا، حق کا حکم دینا، اور آخر کار برائی سے روکنا، 'کیونکہ یہ اس کی طرف سے صدقہ ہے'؛ اور ابن حبان اسے ابن عباس سے سوال کے لیے کھلے سلسلے کے ذریعے لے جاتے ہیں - عکرمہ سے سماک غیر متزلزل ہے - حالانکہ حدیث اس کی تصدیق کرتی ہے ⁦(جامع العلوم والحکم صفحہ 546-565)⁩۔"
