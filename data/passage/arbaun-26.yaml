label: { ar: "الأربعون 26 — كل سلامى من الناس عليه صدقة", en: "Arba'un 26 — charity is due on every joint" }
text: "كل سلامى من الناس عليه صدقة كل يوم تطلع فيه الشمس: تعدل بين الاثنين صدقة، وتعين الرجل في دابته فتحمله عليها أو ترفع له عليها متاعه صدقة، والكلمة الطيبة صدقة، وبكل خطوة تمشيها إلى الصلاة صدقة، وتميط الأذى عن الطريق صدقة"
summary:
  ar: "حديث أبي هريرة قال: قال رسول الله: «كل سلامى من الناس عليه صدقة كل يوم تطلع فيه الشمس» ثم عدد منها العدل بين الاثنين وإعانة الرجل في دابته بحمله عليها أو رفع متاعه إليها والكلمة الطيبة وكل خطوة تمشى إلى الصلاة وإماطة الأذى عن الطريق — وهو الحديث السادس والعشرون في الأربعين النووية وفي شرح ابن رجب؛ خرجاه في الصحيحين من رواية همام بن منبه عن أبي هريرة (البخاري 2707 و2891 و2989، مسلم 1009) والروايات مطولة ومختصرة؛ والسلامى جمع سلامية وهي الأنملة من أنامل الأصابع وقيل التي بين كل مفصلين وقيل كل عظم مجوف من صغار العظام فمعنى الحديث على كل عظم من عظام ابن آدم صدقة؛ وخرج البزار من رواية أبي صالح عن أبي هريرة «الإنسان ثلاثمئة وستون عظماً أو ستة وثلاثون سلامى عليه في كل يوم صدقة» ثم التدرج لمن لم يجد: يأمر بالمعروف وينهى عن المنكر، فإن لم يستطع رفع عظماً عن الطريق، فإن لم يستطع أعان ضعيفاً، فإن لم يستطع فليدع الناس من شره — وإسناده فيه نظر؛ وخرج مسلم (1007) من حديث عائشة «خلق ابن آدم على ستين وثلاثمئة مفصل فمن ذكر الله وحمده وهلله وسبحه أو عزل حجراً أو شوكة أو عظماً عن طريق المسلمين أو أمر بمعروف أو نهى عن منكر عدد تلك السلامى أمسى من يومه وقد زحزح نفسه عن النار»؛ وخرج مسلم أيضاً من رواية أبي الأسود الديلي عن أبي ذر بلفظ قريب وختمه «ويجزئ من ذلك ركعتان يركعهما من الضحى»؛ وخرج أحمد وأبو داود من حديث بريدة بثلاثمئة وستين مفصلاً وفيه «النخاعة في المسجد تدفنها والشيء تنحيه عن الطريق فإن لم تجد فركعتا الضحى تجزئك»؛ وفي الصحيحين عن أبي موسى «على كل مسلم صدقة» ثم التدرج: فإن لم يجد فيعمل بيده فينفع نفسه ويتصدق، فإن لم يستطع يعين ذا الحاجة الملهوف، فإن لم يفعل فليأمر بالمعروف، فإن لم يفعل فليمسك عن الشر فإنه له صدقة؛ وخرج ابن حبان من حديث ابن عباس وإسناده فيه مقال لأنه من رواية سماك عن عكرمة وهي مضطربة وإن كان للحديث ما يقويه (جامع العلوم والحكم ص 546–565)."
  en: "The hadith of Abu Hurayra that the Messenger of God said 'on every joint of the people a charity is due each day the sun rises', then enumerated among them judging justly between two people, helping a man onto his mount or lifting his goods onto it, the good word, every step walked to prayer, and removing harm from the road — the twenty-sixth of al-Nawawi's Forty and of Ibn Rajab's commentary; the two Shaykhs transmitted it through Hammam ibn Munabbih from Abu Hurayra (al-Bukhari 2707, 2891, 2989; Muslim 1009), the routes coming long and short; sulama is the plural of sulamiyya — the finger-joints, or what lies between each two joints, or every hollow small bone — so the hadith means a charity on every bone of the son of Adam; al-Bazzar transmits through Abu Salih from Abu Hurayra 'man has three hundred and sixty bones, or six and thirty joints, upon each a daily charity', then the descending ladder for one who finds nothing: commanding right and forbidding wrong, then removing a bone from the road, then aiding the weak, then at least sparing people his evil — with remarks on its chain; Muslim (1007) carries from A'isha 'the son of Adam was created upon three hundred and sixty joints; whoever mentions God, praises Him, declares His unity, glorifies Him, or removes a stone, a thorn or a bone from the Muslims' road, or commands right or forbids wrong, numbering those three hundred and sixty joints, ends his day having moved his soul away from the Fire'; Muslim also carries through Abu al-Aswad al-Du'ali from Abu Dharr in near wording ending 'and two rak'as performed at mid-morning suffice for all of that'; Ahmad and Abu Dawud carry from Burayda the three-hundred-and-sixty-joints wording with 'spittle in the mosque which you bury and a thing you move from the road — and if not, two mid-morning rak'as suffice you'; the two Sahihs carry from Abu Musa 'on every Muslim is a charity' with its ladder — working with his hands for his own benefit and alms, aiding the desperate needy, commanding right, and finally withholding from evil, 'for that is an alms from him'; and Ibn Hibban carries it from Ibn Abbas through a chain open to question — Samak from Ikrima is unsettled — though the hadith has what corroborates it (Jami' al-Ulum wal-Hikam pp. 546–565)."
