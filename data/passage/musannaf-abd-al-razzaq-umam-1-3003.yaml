text: "… صالح رسول اللّٰه علِيعه عَبَدة الأَوثان على الجزية، إلا من كان منهم من العرب، وقبل الجزية من أَهل البحرين، وكانوا مجوساً. - أَخبرنا عبد الرزاق قال : أَخبرنا الأسلمي عن أَبي الحويرث، أن رسول اللّٰه مل ضرب على نصراني بمكة …"
