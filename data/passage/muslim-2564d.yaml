label:
  ar: "مسلم 2564d — تفتح أبواب الجنة يوم الاثنين والخميس: أنظروا هذين حتى يصطلحا"
  en: "Muslim 2564d — The gates of Paradise open on Monday and Thursday: wait for these two to reconcile"
  ur: "مسلم 2564d — جنت کے دروازے پیر اور جمعرات کو کھلتے ہیں: ان دونوں کو صلح تک مہلت دو"
text: "تفتح أبواب الجنة يوم الاثنين ويوم الخميس فيغفر لكل عبد لا يشرك بالله شيئا إلا رجلا كانت بينه وبين أخيه شحناء فيقال أنظروا هذين حتى يصطلحا أنظروا هذين حتى يصطلحا أنظروا هذين حتى يصطلحا . حدثنيه زهير بن حرب، حدثنا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2564d: تفتح أبواب الجنة يوم الاثنين والخميس: أنظروا هذين حتى يصطلحا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2564d: The gates of Paradise open on Monday and Thursday: wait for these two to reconcile. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2564d: جنت کے دروازے پیر اور جمعرات کو کھلتے ہیں: ان دونوں کو صلح تک مہلت دو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
