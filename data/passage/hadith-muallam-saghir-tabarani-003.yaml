text: "وت وفى كتابى الذى لى ولأهل بيتى : بسم الله الرحمن الرحيم من محمد رسول الله إلى المهاجر بن أبى أمية لأبناء معشر أبناء ضمعاج أقوال شنوءة بما كان لهم فيها من ملك وموامر [مرامر]. وعمران وبحر وملح ومحجر ،"
