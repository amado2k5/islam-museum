text: "… كسرى على الحيرة وما يامها من أرص العراق وشمكا اليه أمر الحشة فقال لداا مماداد لى على كسرى وعاده في كل عام فاقم حى يكون ذلك وعمل ثم حرح معه فادحله على كسرى وكان كسرى يحلس فى انوان محلسه الدى …"
