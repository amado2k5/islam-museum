text: |-
  ⁦(ف صل الالف)⁩
  ⁦(أخر)⁩
  ٢٧٩
  افعل هذا آثرامًا وآثر ذى أثير أى أول كل شى قال عروة بن الورد
  وقالوا ماتشاء فقلت ألهو * الى الاصباح آثرذى أثير
  وذلان أثيرى اى خلصاتى وشئ كثير اً ثير إتباع له مثل بثير أبو زيد الاثيرة من الدواب العظيمة
  الاثرفى الارض بخفها أوحافزها وأثارة من علم أى بقية منه وكذلك الاثرة يالتبحربك ويقال
  نت الابل على أثارة أى يقية شحم كان قبل ذلك والتأثير إيقاء الاثرف الشى أ بر
  الاجر الثواب تقول أجره اللّٰه بأجره وبأجره أبرا ⁦(١ )⁩ وكذلك آجره اللّٰه ايجارا وأجرفلان
  خسة من ولده أى ما توافصاروا أبره والاجرة المكراء تقول استأجرت الرجل فهو يأجرنى
  ثمانى حجج أى يصير أجيرى واتتجر عليه بكذا من الاجرة وقال الشاعر
  ياليت أنى بأنوابى وراحلتى عبدلاهلك هذا الشهر مؤتجر ٢
  آى مع أنوابى الاصمعى أجر العظم يأجر أجراوأجورا أى برأعلى عثم وقد أبرت يده
  أى جبرت وآجرها اللّٰه أى جبرها على عثم وآجرته الدارا كريتها والعامة تقول واجره
  والأجار السطح بلغة أهل الشام والحجاز قال أبو عبيد وجع الاجارأجاجير واجاجرة رالاً جرّ
  الذى ببنى به فارسىّ معزب ويقال أيضا آجور على فاعول وآجرأم اسمعيل عليه السلام
  ⁦( اخر)⁩ أخرته فتأخر واستأخر مثل تأخر والا خربعد الاول وهوصفة تقول باءآخوا
  أى أخيراوتقديره فاءسل والاتى آخرة والجمع أواخر والآ خربالفتح أحد الشيئين وهو
  اسم على أفعل والاتى أخرى الا أن فيه معنى الصفة لان أفعل من كذالا يكون
  الافى الصفة وقولهم جاء فى أخريات الناس أى فى أواخر هسم وقوله-م لا أفعله أخرى الليالى
  أى أبدا وأخرى الممون أى آخر الدهر قال الشاعر
  وما القوم الاخسة أوثلاثة * يخونتون أخرى القوم خوت الاجادل
  أى من كان فى آخرهم ويقال فى الشتم أبعد اللّٰه الأخر بكسر الحاء وقصر الالف وتقول
  أيضابعته بأخرة وبنظرة أى بنسيئة وباءفلان بأخرة بفتح الهاء وماعرفته الا بأخرة أى أخيرا
  وجاءنا أخرا بالضم أى أخيرا وشق ثوبه أخراومن أخرأى من مؤخره قال الشاعرامر و القيس
  عين اهاحدرة بدرة • شقت ما قيهمامن أخر * ومؤخر العين مثال مؤمن
  الذى يلى الصدغ ومقدمها الذى يلى الانف يقال نظراليه بمؤخرعينه وبقدم عينه ومؤخرة
  الرحل أيضالغة قليلة فى آخرة الرحل وهى التى يستغداليها الراكب قال يعقوب
  ولا تقل مؤخرة ومؤخر الشى بالتشديد نقيض مقدمه يقال ضرب مستم رأسه ومؤخره
  والمتخار النخلة التى يبق حلها الى آخر الصرام وأخر جع أخرى وأخرى تأنيث آخروه وغير
  مصروف قال اللّٰه تعالى فعدة من أيام أخرلان أفعل الذى معده من لا يجمع ولا يؤنت مادام
  ذكرة تقول مررت برجل أفضل منك وبرجال أفضل منك وباهر أة افضل منك فان أدخلت
  عليه الالف واللام أو أضفته ثنيت وبجعت وأنثت تقول مروت بالرجل الافضل وبالرجال
  الافضلين وبالمرأة الفضلى وبالنساء الفضل ومررت بأفضلهم وبأفضليهم ويفضلاهنّ ويفضلهنّ
  وقالت امرأة من العرب صغراهامرّاها ولا يجوز أن تقول مررت برجسل أفضل ولا برجال
  أفاضل ولا بامرأة فضلى حتى تصله بعن أو تدخل عليه الالف واللام وهمايعاقبان عليه وليس
  ⁦(١)⁩ من باب طيرب ونصر اه
  محتار
  قوله وأجرفلات بضم الهمزة
  ⁦(٢)⁩ قلت معناء استؤجر على
  العمل اه مختار اه
  قوله الاجاريتد الجيماه
