label: { ar: "الموطأ 1736 — يحيى بن سعيد عن القاسم بن محمد: عدة أم الولد إذا توفي عنها سيدها حيضة، وإن لم تكن ممن تحيض فثلاثة أشهر", en: "Muwatta 1736", es: "Muwatta 1736", fr: "Muwatta 1736", ur: "موطا 1736", tr: "El-Muvatta 1736 — Yahya ibn Said, el-Kasım ibn Muhammed'den rivayetle: Çocuk doğurmuş bir cariyenin, efendisi ölürse bekleme süresi bir adet adet döngüsüdür; adet görmezse üç aydır.", id: "Al-Muwatta 1736 — Yahya ibn Saeed berdasarkan riwayat al-Qasim ibn Muhammad: Masa iddah seorang budak perempuan yang telah melahirkan anak, jika tuannya meninggal, adalah satu siklus menstruasi, dan jika ia tidak menstruasi, maka masa iddahnya adalah tiga bulan." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن القاسم بن محمد أنه كان يقول: عدة أم الولد، إذا توفي عنها سيدها، حيضة. قال مالك: وهو الأمر عندنا. وإن لم تكن ممن تحيض فعدتها ثلاثة أشهر. {cite:muwatta-maruf-1997 p.108} {cite:muwatta-maruf-1997 p.109}"
  tr: "Malik, Yahya ibn Sa'id'den, o da el-Kasım ibn Muhammed'den rivayetle, şöyle buyurduğunu aktarır: \"Efendisine çocuk doğurmuş bir cariyenin, efendisi öldüğünde bekleme süresi bir adet adet döngüsüdür.\" Malik şöyle dedi: \"Bu, aramızda yerleşik bir uygulamadır. Eğer adet görme yaşına gelmemişse, bekleme süresi üç aydır.\" {cite:muwatta-maruf-1997 s.108} {cite:muwatta-maruf-1997 s.109}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari al-Qasim ibn Muhammad, bahwa beliau biasa berkata: Masa iddah seorang budak perempuan yang telah melahirkan anak bagi tuannya, jika tuannya meninggal, adalah satu siklus menstruasi. Malik berkata: Ini adalah kebiasaan yang telah ditetapkan di antara kami. Jika dia belum mencapai usia menstruasi, maka masa iddahnya adalah tiga bulan. {cite:muwatta-maruf-1997 p.108} {cite:muwatta-maruf-1997 p.109}"
