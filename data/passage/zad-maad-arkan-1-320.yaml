text: "… وأَنْتَ لَمْ تَحْمَدِ اللَّه البخاري:، ومسلم:. وثبت عنه في صحيح مسلم : إذا عَطَسَ أحَدُكُم والترمذي:. فَحَمِدَ اللَّهَ، فَشَمَّتُوهُ، فإنْ لَمْ يَحْمَدِ اللَّه، فَلَا تُشَمَّتُوهُ مسلم:. وثبت عنه في صحيحه : من حديث أبي هريرة: احَقُّ المُسْلِمِ عَلَى المُسْلِمِ سِتٌّ: …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 320، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 320, that mentions what a believer owes a believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 320 کا اقتباس جس میں مومن کا مومن پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen 1, pág. 320, que menciona lo que un creyente le debe a otro creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Zad al-Ma'ad d'Ibn al-Qayyim (tome 1, p. 320), qui évoque les devoirs d'un croyant envers un autre; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 1. cildinin 320. sayfasından, bir müminin diğer bir mümin üzerindeki haklarını ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 1, halaman 320, yang membahas hak-hak seorang mukmin atas mukmin lainnya; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
