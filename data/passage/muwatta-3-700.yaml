summary:
  ar: "قول لمالك في الرجل يكون له الضأن والمعز: أنها تُجمع عليه في الصدقة، فإن كان فيها ما تجب فيه الصدقة صُدّقت، لأنها غنم كلها، ويستشهد بكتاب عمر بن الخطاب: وفي سائمة الغنم إذا بلغت أربعين شاة شاة. {cite:muwatta-maruf-1997 p.351}"
