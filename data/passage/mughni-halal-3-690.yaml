text: "… تَحْرِيمَ الدِّلالَةِ عَلَيْهِ. وَسُؤَالُ النِّيِّ لَهُمْ: هَلْ مِنْكُمْ أَحَدٌ أَمَرَهُ أَنْ يَحْمِلَ عَلَيْهَا، أَوْ أَشَارَ إلَيْهَا؟ يَدُلُ عَلَى تَعَلْقِ التَّحْرِيمِ بِذَلِكَ لَوْ وُجِدٌ مِنْهُمْ. وَلَأَنَهُ تَسَبَّبَ إِلَى مُحَرَّم عَلَيْهِ فَحُرَّم، كَنَصْيْهِ الأُحْبُولَةَ. فصل لا يحل للمحرم الإعانة على الصيد بشيء …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 690، يذكر ما أُحل، وما لا يحل، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 690, that mentions what was made lawful, what is not lawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 690 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
