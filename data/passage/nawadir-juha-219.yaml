text: "… اذهب مع الحمار ثم أُخبرك كان يسوق حماره، وهو ذاهب إلى كرم له فالتقى به أحد العوام، ورافقهُ وقصد المزاح معه فقال له : إلى أين تسير أنت وحمارك؟ فأشار الشيخ في الحال إلى الحمار وقال: اذهب أنت مع الحمار …"
summary:
  ar: "كان جحا راكباً حماره إلى كرمه فمازحه رجل وسأله إلى أين يذهب، فقال جحا للحمار أن يمضي وإنه سيجيب بعد أن ينهي عمله الصغير هنا. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  en: "Riding his donkey to his vineyard, Juha is teased by a man who asks where he is going, and Juha tells the donkey to go on and says he will answer after his small job here. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  ur: "جحا اپنے گدھے پر سوار اپنے انگور کے باغ کو جا رہا ہوتا ہے کہ ایک آدمی مذاق میں پوچھتا ہے کہاں جا رہے ہو؟ جحا گدھے سے کہتا ہے کہ چلتا رہے اور کہتا ہے کہ وہ یہاں اپنا چھوٹا سا کام نمٹا کر جواب دے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  fr: "Juha chevauche son âne vers sa vigne quand un homme le taquine en lui demandant où il va, et Juha dit à l'âne d'avancer et qu'il répondra après sa petite affaire ici. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  es: "Juha va montado en su burro hacia su viñedo cuando un hombre le bromea preguntándole adónde va, y Juha dice al burro que siga y que responderá después de su pequeño asunto aquí. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
