  ur: "للاقعی، شرح اصول اعتکاف - ص۔ 1009"
text: "أبشروا من يأجوج ومأجوج ألف، ومنكم واحد"
summary:
  ar: "في فصل ما روي في صفة القيامة يورد اللالكائي حديث أبي سعيد الخدري في بعث النار من كل ألف تسعمائة وتسعة وتسعون، ثم قول النبي للناس المشفقين أبشروا فمن يأجوج ومأجوج ألف ومنكم واحد؛ وفيه إشارة إلى كثرة يأجوج ومأجوج بالنسبة إلى المسلمين."
  en: "In his section on what is related about the Resurrection, al-Lalaka'i gives Abu Said al-Khudri's hadith of the portion sent to the Fire, nine hundred and ninety-nine of each thousand, and then the Prophet's words to the anxious people, 'good news: a thousand from Gog and Magog, and one from you', which points to the great number of Gog and Magog."
  es: "En su sección sobre lo que se relata acerca de la Resurrección, al-Lalaka'i cita el hadiz de Abu Said al-Khudri sobre la porción enviada al Fuego, novecientos noventa y nueve de cada mil, y luego las palabras del Profeta a la gente ansiosa: \"Buenas noticias: mil de Gog y Magog, y uno de vosotros\", lo que apunta al gran número de Gog y Magog."
  fr: "Dans sa section sur ce qui est rapporté au sujet de la Résurrection, al-Lalaka'i rapporte le hadith d'Abu Said al-Khudri concernant la portion envoyée au Feu, neuf cent quatre-vingt-dix-neuf sur mille, puis les paroles du Prophète aux gens anxieux: « Bonne nouvelle: mille de Gog et Magog, et un de vous », ce qui fait référence au grand nombre de Gog et Magog."
  ur: "اپنے حصے میں جو قیامت کے متعلق ہے، الللقائی نے ابو سعید خدری کی جہنم میں بھیجے جانے والے حصے کی حدیث، ہر ہزار میں سے نو سو ننانوے، اور پھر پریشان لوگوں کے لیے نبی کے یہ الفاظ، 'بشارت: یاجوج ماجوج سے ایک ہزار اور تم میں سے ایک'، جو یاجوج اور ماجوج کی بڑی تعداد کی طرف اشارہ کرتا ہے۔"
