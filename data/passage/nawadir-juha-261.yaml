text: "… أفرغت الصوف ولم يقع منه شيء أتى إلى السوق يوماً بمفرش من البساط ليبيعه، فلما رآه المشترون، قالوا له : هذا مخروق ممزَّقٌ لا يساوي شيئاً. فأجابهم: سبحان اللَّه. إذا كان قصدُكم أن لا تبتاعوا فلا تبخسوا مال مسلم أمام …"
summary:
  ar: "قال المشترون إن سجادة جحا ممزقة لا قيمة لها، فقال جحا إن أمه أفرغت صوفها للتو ولم يقع منه شيء. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  en: "Buyers say Juha's rug is torn and worthless, and Juha says his mother has just emptied its wool and nothing fell out. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  ur: "خریدار کہتے ہیں کہ جحا کا قالین پھٹا ہوا اور بے قیمت ہے، تو جحا کہتا ہے کہ اس کی ماں نے ابھی اس کی اون خالی کی ہے اور کچھ نہیں گرا۔ {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  fr: "Des acheteurs disent que le tapis de Juha est déchiré et sans valeur, et Juha dit que sa mère vient d'en vider la laine et que rien n'en est tombé. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
  es: "Unos compradores dicen que la alfombra de Juha está rota y no vale nada, y Juha dice que su madre acaba de vaciar su lana y no cayó nada. {cite:juha-nawadir-kubra-djuwaydi p. 127}"
