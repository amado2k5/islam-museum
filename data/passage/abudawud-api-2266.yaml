label: { ar: "سنن أبي داود 2266 — النسب والانتساب", en: "Sunan Abi Dawud 2266 — paternity and lineage", ur: "سنن ابی داؤد 2266 — نسب اور انتساب", es: "Sunan Abi Dawud 2266 - paternidad y linaje" }
text: "حَدَّثَنَا مَحْمُودُ بْنُ خَالِدٍ، حَدَّثَنَا أَبِي، عَنْ مُحَمَّدِ بْنِ رَاشِدٍ، بِإِسْنَادِهِ وَمَعْنَاهُ زَادَ وَهُوَ وَلَدُ زِنًا لأَهْلِ أُمِّهِ مَنْ كَانُوا حُرَّةً أَوْ أَمَةً وَذَلِكَ فِيمَا اسْتُلْحِقَ فِي أَوَّلِ الإِسْلاَمِ فَمَا اقْتُسِمَ مِنْ مَالٍ قَبْلَ الإِسْلاَمِ فَقَدْ مَضَى."
summary:
  ar: "حديث في سنن أبي داود، رقم 2266، يذكر النسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2266 (Divorce (Kitab Al-Talaq)), that mentions paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2266، جس میں نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2266 (Divorcio (Kitab Al-Talaq)), menciona la paternidad y el linaje. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
