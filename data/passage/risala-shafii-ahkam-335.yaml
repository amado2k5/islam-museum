text: "… بعضَ ماذ كرتَ ؟ - فقلتُ له : كان أوّلُ ما فرض اللّٰه على رسوله فى القبلة أن يَستقبلَ بيتَ المقدسِ للصلاة، فكان بيتُ المقدس القبلةَ التى لا يحل لأحدٍ أن يصلِّىَ إلاّ إليها. فى الوقت الذى استقبلها فيه رسولُ …"
summary:
