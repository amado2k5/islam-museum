text: |-
  وأفيد من مختار الصجاح كذاقيل لكنه لم يشتهر و أمّا من ترجه بالتركي ، والمولى محمد بن
  مصطقى الوانى المعروف بوان قولى المتوفى سانة قال لمارأيت الاحتياج التام الى
  سان اللغة وكان صحاح الجوهرى مقبولا مسلما عند الفحول غديران عبارته على أسلوب
  لبلغاء واسان العرب العرباء والمتصدى الى نق-له كالاخترى وصاحب الصراح
  لم يأمن من الخبط وانخطأ فأردت ترجمنه حتى يكون سهل التعاطى
  ا فائدة الثالفة فى قواعد الكتاب
  اعلم انّ مؤلفه أول من ضبط ما أراد جعه من الكلم اللغوية على ترتيب لم يسبق اليه كماقال
  فى أول كتابه حيث تطرأولا الى أواخر الكام فجعل أبوابه على حسبها ٢٨ بابا ونظرثانيا
  الى أوائل الدكام نجعل فى كل باب فصوله بالنظر لذلك بأعتباراصل المادّة فى كل ولم ينظر الى
  المزيدفى أواها أوآخرها كالف التانيث أوهائه ورتب الابواب على ترتيب حروف المعج
  لمشهورة لا على ترتيب الايجسدية مثال المزيد الارنب والازيب والانبوبة لان الكلم
  اذا كان فى أولها ألف وبعسدها ثلاثة أحرف فاكثر تكون زائدة لا تعة من الاصول كماهو
  مذ كورف أول الشذور فيقال فى أرذب منلاوزنه أفعل وفى أنيوبة أفعولة فالحروف
  المقابلة هفاء والعين واللام هى الاصول وماسواها زائد كما قال فى الخلاصة
  يضمن فعل قابل الاصول فى • وزن وزائد بلفظه اكتنى
  فمذكرهذه الاافاظ الثلاثة فى فصل الراء والزاى والمون من باب الباء وكذلك ما بعد الأوّل
  رتبه ء-لى ترتيب حروف المعجم فاذا قال باب الباءمنسلإ ييد أفيسه بفصل الالف ويأتى فيه
  بح-روف الوسط على الترتيب المذكور حتى يصل الى الااف التى تليها الواوفيقدمهاءلى
  ما تليها الهاء وهكذا فى كل فصل كما يفعل بالفصول يقدّم فصل الواومن كل باب على فصل
  الهاء ويؤخر الياءموافة لقواه-م الحروف الهجائية التى أولها الالف وآخرها الياء
  بخلاف الابواب فانه قدم فيها باب الهاء قبسل الواوايجعلها أى الواومع الياء فى باب واحد
  فصارت الحروف التى يبوّب لها ٢٧ الا انه لما كانت الالف على قسمين مهموزة ولينة جعل
  الاولى فى أول الابواب وعقد للثانية وهى اللينة غير المنقلبة عن يا«أوواو بابا اخيراعب باب
  الواووالاء الذى فى ضمنه المنقلبة عن واوأوياء فكملت الابواب ٢٨ فهذا الترتيب من
  مبتكراته فهوالإمام المقدم فى هذا الذان وإياه تبع صاحب لسان العرب وخلاصة المحكم
  وغيرهما من المتأخرين كالقاموس كما أفاده محشيه وحينمذة لا يختص بالقاموس قول
  صاحبه اذارمت فى القاموس كشفا للفظة • فأخرهاللباب والبده للفصل
  ولا تعتبر فى بدئمها وأخسسيرها * مزيدا ولكن اعتبارك بالاصل
  و من قواعده فى ضبط الاسما ء أنه اذاذ كراسما وقال عة به بالكسر مثلا فالضبط لأوّل
  الكلمة كقوله وانه لحسن الجيبة بالكسر يعنى كسر الجيم والحباب بالضم نعم التكين
  لا يكون بالضرورة الاللثبانى كة رله والحلبسة با التسكين ثم انّ مابعد الاقّل تارة يكون معلوم
  الحركة اوالسكون فيسكت عنه وتارة يصرح بضبطه كوله والرطب بالضم ساكنسة الطاء
  الكلا واذا قال عقبه محر كاأ وبالتحريك فيكون يفتحتين كما يعبر المصباح بذلك واذا أعاد
  الكامة وأتبعهاية وله أيضافتكون بالضبط السابق وقد يكون فى المكامة لغتان أوأكثر
  المسولى وانقولى لهمؤلفات
  فقهية كاشية السراجية
  وغيرها من مذهبه اه
