text: "… العبدرى - كان النضر بن الحارث بن علقمة بن كلدة بن عبد مناف بن عبد الدار يكنى أبا فائد. وكان أشد قريش مباداة للنبى بالتكذيب والأذى. وكان صاحب أحاديث، ونظر فى كتب الفرس، ومخالطة النصارى واليهود. وكان لما سمع بذكر …"
