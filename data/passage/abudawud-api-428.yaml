label: { ar: "سنن أبي داود 428 — الأب والأبوة", en: "Sunan Abi Dawud 428 — the father and fatherhood", ur: "سنن ابی داؤد 428 — باپ اور والدیت", es: "Sunan Abi Dawud 428 — El padre y la paternidad" }
text: "… خَالِدٌ، عَنْ دَاوُدَ بْنِ أَبِي هِنْدٍ، عَنْ أَبِي حَرْبِ بْنِ أَبِي الأَسْوَدِ، عَنْ عَبْدِ اللَّهِ بْنِ فَضَالَةَ، عَنْ أَبِيهِ، قَالَ عَلَّمَنِي رَسُولُ اللَّهِ فَكَانَ فِيمَا عَلَّمَنِي \" وَحَافِظْ عَلَى الصَّلَوَاتِ الْخَمْسِ \". قَالَ قُلْتُ إِنَّ هَذِهِ سَاعَاتٌ لِي فِيهَا أَشْغَالٌ فَمُرْنِي بِأَمْرٍ جَامِعٍ إِذَا أَنَا فَعَلْتُهُ أَجْزَأَ عَنِّي فَقَالَ \" حَافِظْ عَلَى الْعَصْرَيْنِ \". وَمَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 428، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 428 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 428، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 428 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
