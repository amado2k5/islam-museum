text: "… ضرْبى. قال أَبو رُهْم : فرضاه عنى كان أَحبّ إلىّ من الدنيا وما فيها. قال : وبعث وسول اللّٰه، صلّعم، أَبا رُهُم حين أَراد الخروج إلى تبسوك إلى قومه يستنفرهم إلى عدوهم وأَمره أَن يطلبهم ببلادهم، فأتاهم إلى مجالهم فشهد …"
