text: "… ضرْبى. قال أَبو رُهْم : فرضاه عنى كان أَحبّ إلىّ من الدنيا وما فيها. قال : وبعث وسول اللّٰه، صلّعم، أَبا رُهُم حين أَراد الخروج إلى تبسوك إلى قومه يستنفرهم إلى عدوهم وأَمره أَن يطلبهم ببلادهم، فأتاهم إلى مجالهم فشهد …"
summary:
  ar: "مقطع من الطبقات الكبرى لابن سعد، المجلد المصوَّر 5، ص 26، يرد فيه ذكر الفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Sa'd's al-Tabaqat al-Kubra, scan volume 5, p. 26, whose wording mentions the obligatory (fard); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
