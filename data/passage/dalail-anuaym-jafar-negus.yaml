label: { ar: "دلائل النبوة لأبي نعيم — دفاع جعفر بن أبي طالب أمام النجاشي", en: "Abu Nu'aym's Dala'il — Ja'far's defence before the Negus", ur: "ابو نعیم کی دلائل — نجاشی کے سامنے جعفر بن ابی طالب کا دفاع", es: "La defensa de Ja'far ante el Negus, de Abu Nu'aym, se basa en el Dala'il de Abu Nu'aym.", fr: "Le Dalaïl d'Abu Nu'aym — La défense de Ja'far devant le Négus", tr: "Ebu Nuaym'ın Peygamberlik Alametleri - Cafer ibn Abi Talib'in Negus Önündeki Savunması", id: "Tanda-Tanda Kenabian menurut Abu Nu'aym — Pembelaan Ja'far ibn Abi Talib di hadapan Negus" }
text: "إنما كلامي ثلاث كلمات، سل هذا الرجل أعبيد نحن أبقنا من أربابنا؟ فارددنا إلى أربابنا. سل هذا الرجل هل أهرقنا دماً بغير حقه؟ فادفعنا إلى أهل الدم"
summary:
  ar: "يروي أبو نعيم مرسل عن ابن لهيعة عن عروة بن الزبير مشهد قريش حين بعثت عمارة بن الوليد وعمرو بن العاص إلى النجاشي يطلبان تسليم المهاجرين، فسبقوهما ودخلا عليه، فلما قدما جعفر وأصحابه صاح جعفر على الباب يستأذن حزب الله فسمعها النجاشي وأذن لهم. وسأل النجاشي ماذا جاء بهم ولم يأتوه تجاراً ولا سؤالاً، وأخبرهم أن عمرو بن العاص وعمارة أنكرا عليهم إراقة الدم وسجودهم لملوكهم. فتكلم جعفر فقال إنما كلامي ثلاث كلمات: سل هذا الرجل أعبيد نحن أبقنا من أربابنا؟ فارددنا إلى أربابنا. سل هذا الرجل هل أهرقنا دماً بغير حقه؟ فادفعنا إلى أهل الدم. ويبين المؤلف أن هذا المشهد من وجوه تصديق الحبشة للنبوة واتباعها، من أول من آمن من الملوك."
  en: "Abu Nu'aym transmits, with the mursal chain through Ibn Lahi'a and Urwa ibn al-Zubayr, the scene when Quraysh sent Amr ibn al-As and Umara ibn al-Walid ahead to the Negus demanding the emigrants' surrender, and Ja'far's company arrived after them. Ja'far called from the door 'let the party of God enter', the Negus heard and admitted them; he asked what had brought them — not trade or tribute — and Amr and Umara accused them of bloodshed and refusal to prostrate before kings. Ja'far answered in three questions: ask this man, are we slaves kept from our masters? Return us to our masters. Ask him, did we shed blood unjustly? Hand us to the avenger. The author shows it as a locus of the Abyssinian kingdom's recognition of the mission — among the first kings to believe."
  ur: "ابو نعیم ابن لہیعہ سے مروی ایک مرسل روایت کرتا ہے کہ جب عمرو بن العاص اور عمارہ بن الولید نجاشی کے پاس پہنچے اور مہاجرین حوالے کرنے کو کہا تو جعفر اور ان کے ساتھی بعد میں آئے۔ جعفر نے دروازے سے پکارا 'اللہ کے جماعت کو اجازت دو' تو نجاشی نے سن کر اجازت دی۔ اس نے پوچھا: تم کیوں آئے؟ تاجر ہو یا خراج مانگنے والے؟ عمرو اور عمارہ نے ان پر خون بہانے اور بادشاہوں کے سامنے سجدہ نہ کرنے کا الزام لگایا۔ جعفر نے تین سوالوں میں جواب دیا: اس شخص سے پوچھو، کیا ہم اپنے آقاؤں سے روکے گئے بندے ہیں؟ تو ہمیں ہمارے آقاؤں کے پاس لوٹاؤ۔ پوچھو، کیا ہم نے ناحق خون بہایا؟ تو ہمیں خون کے بدلے لینے والوں کے حوالے کرو۔"
  es: "Abu Nu'aym transmite, con la cadena mursal a través de Ibn Lahi'a y Urwa ibn al-Zubayr, la escena en la que los Quraysh enviaron a Amr ibn al-As y Umara ibn al-Walid al Negus para exigir la rendición de los emigrantes, y la compañía de Ja'far llegó después. Ja'far gritó desde la puerta: «¡Que entre el grupo de Dios!». El Negus los oyó y los dejó entrar; les preguntó qué los había traído —no comercio ni tributo— y Amr y Umara los acusaron de derramamiento de sangre y de negarse a postrarse ante los reyes. Ja'far respondió con tres preguntas: «Pregúntenle a este hombre: ¿Somos esclavos retenidos de nuestros amos? Devuélvannos a nuestros amos. Pregúntenle: ¿Derramamos sangre injustamente? Entréguennos al vengador». El autor muestra esto como un momento clave en el reconocimiento de la misión por parte del reino de Abisinia, siendo uno de los primeros reyes en creer."
  fr: "Abou Nu'aym rapporte, par la chaîne mursale via Ibn Lahi'a et Urwa ibn al-Zubayr, la scène où les Qurayshites envoyèrent Amr ibn al-As et Umara ibn al-Walid auprès du Négus pour exiger la reddition des émigrants. La suite de Ja'far arriva après eux. Ja'far cria depuis la porte: « Que le groupe de Dieu entre ! » Le Négus, ayant entendu, les laissa entrer. Il leur demanda ce qui les amenait – ni commerce ni tribut – et Amr et Umara les accusèrent d'avoir versé le sang et de refuser de se prosterner devant les rois. Ja'far répondit par trois questions: « Demandez à cet homme: sommes-nous des esclaves séparés de nos maîtres ? Rendez-nous-les. Demandez-lui: avons-nous versé le sang injustement ? Livrez-nous au vengeur. » L'auteur présente cet épisode comme un symbole de la reconnaissance de la mission par le royaume d'Abyssinie – parmi les premiers rois à y croire."
  tr: "Ebu Nu'aym, İbn Lahi'ye'den, Urve ibn el-Zübeyr'den rivayetle, Kureyş'in, hicret edenlerin iadesini talep etmek üzere Ömer ibn el-Velid ve Amr ibn el-As'ı Negus'a gönderdiği sahneyi anlatır. Muhacirler onlardan önce gelmiş ve huzuruna girmişlerdir. Cafer ve arkadaşları geldiğinde, Cafer kapıda seslenerek Allah yolundan içeri girmek için izin istemiştir. Negus onu duymuş ve onlara izin vermiştir. Tüccar veya ilim arayan olarak gelmedikleri için neden geldiklerini sormuştur. Onlara, Amr ibn el-As ve Ömer'in, krallarına kan döktükleri ve secde ettikleri için onları ihbar ettiklerini bildirmiştir. Cafer şöyle dedi: \"Sözlerim üç tanedir: Şu adama sor: 'Biz efendilerimizden kaçmış köleler miyiz?' Bizi efendilerimize geri verin. Şu adama sor: 'Haksız yere kan döktük mü? Bizi kan intikamcılarına teslim edin.'\" Yazar, bu sahnenin Habeşlilerin peygamberliğe olan inançlarının ve onu takip etmelerinin bir örneği olduğunu ve İslam'ı benimseyen ilk krallar arasında yer aldıklarını açıklıyor."
  id: "Abu Nu'aym meriwayatkan, dari Ibnu Lahi'ah, dari 'Urwah ibn al-Zubayr, tentang peristiwa ketika kaum Quraisy mengutus 'Umarah ibn al-Walid dan 'Amr ibn al-'As kepada Negus untuk meminta ekstradisi para emigran. Para emigran tiba sebelum mereka dan menghadap Negus. Ketika Ja'far dan para sahabatnya tiba, Ja'far memanggil dari pintu, meminta izin untuk masuk bagi rombongan Allah. Negus mendengarnya dan memberi mereka izin. Ia bertanya apa yang membawa mereka, karena mereka tidak datang sebagai pedagang atau pencari ilmu. Ia memberi tahu mereka bahwa 'Amr ibn al-'As dan 'Umarah telah mencela mereka karena menumpahkan darah dan bersujud kepada raja-raja mereka. Kemudian Ja'far berbicara, \"Kata-kataku hanya tiga: Tanyakan kepada orang ini, 'Apakah kami budak yang melarikan diri dari tuan kami?' Kembalikan kami kepada tuan kami. Tanyakan kepada orang ini, 'Apakah kami telah menumpahkan darah secara tidak adil? Serahkan kami kepada para pembalas darah.'\" Penulis menjelaskan bahwa adegan ini adalah salah satu cara orang Abyssinia mempercayai dan mengikuti kenabian, menjadi salah satu raja pertama yang memeluk Islam."
