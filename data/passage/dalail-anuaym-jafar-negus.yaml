label: { ar: "دلائل النبوة لأبي نعيم — دفاع جعفر بن أبي طالب أمام النجاشي", en: "Abu Nu'aym's Dala'il — Ja'far's defence before the Negus", ur: "ابو نعیم کی دلائل — نجاشی کے سامنے جعفر بن ابی طالب کا دفاع" }
text: "إنما كلامي ثلاث كلمات، سل هذا الرجل أعبيد نحن أبقنا من أربابنا؟ فارددنا إلى أربابنا. سل هذا الرجل هل أهرقنا دماً بغير حقه؟ فادفعنا إلى أهل الدم"
summary:
  ar: "يروي أبو نعيم مرسل عن ابن لهيعة عن عروة بن الزبير مشهد قريش حين بعثت عمارة بن الوليد وعمرو بن العاص إلى النجاشي يطلبان تسليم المهاجرين، فسبقوهما ودخلا عليه، فلما قدما جعفر وأصحابه صاح جعفر على الباب يستأذن حزب الله فسمعها النجاشي وأذن لهم. وسأل النجاشي ماذا جاء بهم ولم يأتوه تجاراً ولا سؤالاً، وأخبرهم أن عمرو بن العاص وعمارة أنكرا عليهم إراقة الدم وسجودهم لملوكهم. فتكلم جعفر فقال إنما كلامي ثلاث كلمات: سل هذا الرجل أعبيد نحن أبقنا من أربابنا؟ فارددنا إلى أربابنا. سل هذا الرجل هل أهرقنا دماً بغير حقه؟ فادفعنا إلى أهل الدم. ويبين المؤلف أن هذا المشهد من وجوه تصديق الحبشة للنبوة واتباعها، من أول من آمن من الملوك."
  en: "Abu Nu'aym transmits, with the mursal chain through Ibn Lahi'a and Urwa ibn al-Zubayr, the scene when Quraysh sent Amr ibn al-As and Umara ibn al-Walid ahead to the Negus demanding the emigrants' surrender, and Ja'far's company arrived after them. Ja'far called from the door 'let the party of God enter', the Negus heard and admitted them; he asked what had brought them — not trade or tribute — and Amr and Umara accused them of bloodshed and refusal to prostrate before kings. Ja'far answered in three questions: ask this man, are we slaves kept from our masters? Return us to our masters. Ask him, did we shed blood unjustly? Hand us to the avenger. The author shows it as a locus of the Abyssinian kingdom's recognition of the mission — among the first kings to believe."
  ur: "ابو نعیم ابن لہیعہ سے مروی ایک مرسل روایت کرتا ہے کہ جب عمرو بن العاص اور عمارہ بن الولید نجاشی کے پاس پہنچے اور مہاجرین حوالے کرنے کو کہا تو جعفر اور ان کے ساتھی بعد میں آئے۔ جعفر نے دروازے سے پکارا 'اللہ کے جماعت کو اجازت دو' تو نجاشی نے سن کر اجازت دی۔ اس نے پوچھا: تم کیوں آئے؟ تاجر ہو یا خراج مانگنے والے؟ عمرو اور عمارہ نے ان پر خون بہانے اور بادشاہوں کے سامنے سجدہ نہ کرنے کا الزام لگایا۔ جعفر نے تین سوالوں میں جواب دیا: اس شخص سے پوچھو، کیا ہم اپنے آقاؤں سے روکے گئے بندے ہیں؟ تو ہمیں ہمارے آقاؤں کے پاس لوٹاؤ۔ پوچھو، کیا ہم نے ناحق خون بہایا؟ تو ہمیں خون کے بدلے لینے والوں کے حوالے کرو۔"
