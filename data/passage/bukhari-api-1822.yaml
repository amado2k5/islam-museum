label: { ar: "صحيح البخاري 1822 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 1822 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 1822 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 1822 — menciones de naciones, religiones y pueblos no musulmanes" }
text: "حَدَّثَنَا سَعِيدُ بْنُ الرَّبِيعِ، حَدَّثَنَا عَلِيُّ بْنُ الْمُبَارَكِ، عَنْ يَحْيَى، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي قَتَادَةَ، أَنَّ أَبَاهُ، حَدَّثَهُ قَالَ انْطَلَقْنَا مَعَ النَّبِيِّ عَامَ الْحُدَيْبِيَةِ فَأَحْرَمَ أَصْحَابُهُ، وَلَمْ أُحْرِمْ، فَأُنْبِئْنَا بِعَدُوٍّ بِغَيْقَةَ فَتَوَجَّهْنَا نَحْوَهُمْ، فَبَصُرَ أَصْحَابِي بِحِمَارِ وَحْشٍ، فَجَعَلَ بَعْضُهُمْ يَضْحَكُ إِلَى بَعْضٍ، فَنَظَرْتُ فَرَأَيْتُهُ فَحَمَلْتُ عَلَيْهِ الْفَرَسَ، فَطَعَنْتُهُ، فَأَثْبَتُّهُ، فَاسْتَعَنْتُهُمْ، فَأَبَوْا أَنْ يُعِينُونِي، فَأَكَلْنَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1822، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 1822 (Penalty of Hunting while on Pilgrimage), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 1822، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 1822 (Castigo de la caza durante la peregrinación), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
