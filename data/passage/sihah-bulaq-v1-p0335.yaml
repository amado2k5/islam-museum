text: |-
  ٣٠٦
  : ⁦(-صر)⁩
  فى الاصل وهومثل قواهم ماءغور وماء سكب وقد قيل أذن حشرة قال النمر بن قواب
  لها أذن حشرة مشرة • كاعلبط هرخ اذا ماصفر
  والحشرمن القدذ مالطف وسفان حشردقيق وقد حشرته حشرا و-كى الاخفسم-م
  -شروسهام حشركما قالواجون وجون ووردوورد ونط ونط والحشرة بالتحريك واحدة
  الحشرات وهي صغاردواب الارض وحشرت الناس أحشرهم وأحشرهم -شرابيعتهم
  ومنسه يوم الحشر وروى سعمد بن مسروق عن عكرمة فى قوله تعالى واذا الوحوش
  حشمرت قال حشمرهاموتها وحشرت السنة مال فلان أى أهلكته والمحشر بكسر الشم
  موضع الحشر والحاشر اسم من أسماه النيّ صلى اللّٰه عليه وسلم وقال لى خسة أسماء أنا محمد
  وأحد والماحى يدو اللّه بى المكفر والحاشر أحشر الناس على قدمى والعاقب والحشور
  مثال الإرول المنتفخ الجنبين يقال فرس حشور والاتى حشورة ( صر حصره
  بحصر هحصراضيق عليه وأحاط به والحصير الضيق البخيل والحصير البارية والحمير الجنب
  قال الاصمعى هو ما بين العرق الذى يظهر فى جنب البعير والفرس معتر ضا خافوقه الى منقطع
  الجنب والحصير الملك لانه محجوب قال لبيد
  وقاقم غلب الرقاب كأنهم * جن لدى باب الحصيرقيام
  ويروى ومقامة غلب الرقاب على أن يكون غلب بدلا من مقامة كانه قال ورب غلب الرقاب
  وروى غير أبي عبيدة لدى طرف الحصيرقيام أى عند طرف البساط للنعمان بن المنذر
  والحصير المحبس قال اللّٰه تعالى وجعلنا جه-م للمكافرين حصيرا والحصيرة موضع التمروهو
  الجرين والحصار وسادة تلقى عسلى البعير ويرفعمؤخرها فيجعل كآخرة الرحسل ويحشى
  مقدمها فيجعل كقادمة الرحل تقول منه احتصرت البعيع والحصر العىّ بقال حصر
  الرجل يحصر حصرامثل تعب تعبا والخصر أيضاضيق الصدريقان حصرت مدورهم أى
  ضاقت قال لبيد أسهلت وانتصبت كجذع منيفة • جردا يحصردونهاجرّامها
  أى تضيق صدورهم من طول هذه النخلة وأماقوله تعالى أوجاؤكم حصرت صدورهم فأجاز
  الاخفش والكوفيون أن يكون الماضى حالا ولم يجوّزه سيبويه الامع قدوجع-ل
  حصرت صدورهم على جهة الدعاء عليهم وحصر أيضا بعنى بخل قال أبو عمر ويقال شرب
  القوم فحصر عليه-م فلان أى بخل وكل من امتنع من شئ فلم يقد ر عله فقد حصر عنه ولهذا
  قيل حصر فى القراءة وحصر عن أهله والحصر الكتوم للسر قال جرير
  ولقد تسقطى الوشاة فصادفوا * حصر ابسرك يا أميم ضفينا
  والحصور الفاقة الضيقة الاحليل تقول منه حصرت الناقة بالفتح وأحصرت والحصور الذى
  لا يأتى النساء والحصور الضيق البخيل مثل الحصير قال الاخطل
  وشادب مريح بالكأس نادمى • لابالصودولا فيها بسوّار
  والخصر بالضم اعتقال البطن تقول منه حصر الرجسل وأحصر على مالم يسمّ فاعله قال ابن
  السكمت أحصره المرض اذا منعه من السفرأ ومن حاجة يريدها قال اللّٰه تعالى فان أحصرتم
  قال وقد حصره العدوّ ويحصرونه اذاضيق واعليه وأحاطوا به وحاصروه محماصرة وحصارا
  وقال
