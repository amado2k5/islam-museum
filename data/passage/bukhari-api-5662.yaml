label: { ar: "صحيح البخاري 5662 — الحمى، عيادة المريض", en: "Sahih al-Bukhari 5662 — fever; visiting the sick", ur: "صحیح بخاری 5662 — بخار، بیمار کی عیادت" }
text: "حَدَّثَنَا إِسْحَاقُ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنْ خَالِدٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍما ـ أَنَّ رَسُولَ اللَّهِ دَخَلَ عَلَى رَجُلٍ يَعُودُهُ فَقَالَ \" لاَ بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ \". فَقَالَ كَلاَّ بَلْ حُمَّى تَفُورُ عَلَى شَيْخٍ كَبِيرٍ كَيْمَا تُزِيرَهُ الْقُبُورَ. قَالَ النَّبِيُّ \" فَنَعَمْ إِذًا \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5662، يذكر الحمى، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5662 (Patients), that mentions fever, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5662، جس میں بخار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
