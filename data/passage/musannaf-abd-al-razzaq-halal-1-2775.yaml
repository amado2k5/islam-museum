text: "وامرأَة أُخرى، ثم قال النبي عليل ه : إني لم أحرم مكة، ولكن حرّمه اللّٰه، وإنها لم تحلل لأحد قبلي، ولا تحلُّ لأَحد بعدي إلى يوم القيامة، وإنما أَحلَّها الله لي في ساعة من نهار. قال : ثم جاءَه عثمان …"
summary:
