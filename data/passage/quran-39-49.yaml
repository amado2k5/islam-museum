text: "فَإِذَا مَسَّ ٱلْإِنسَـٰنَ ضُرٌّ دَعَانَا ثُمَّ إِذَا خَوَّلْنَـٰهُ نِعْمَةً مِّنَّا قَالَ إِنَّمَآ أُوتِيتُهُۥ عَلَىٰ عِلْمٍۭ ۚ بَلْ هِىَ فِتْنَةٌ وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ"
text_search: "فإذا مس الإنسان ضر دعانا ثم إذا خولناه نعمة منا قال إنما أوتيته على علم ۚ بل هي فتنة ولكن أكثرهم لا يعلمون"
translations:
  en: { text: "Now when hurt toucheth a man he crieth unto Us, and afterward when We have granted him a boon from Us, he saith: Only by force of knowledge I obtained it. Nay, but it is a test. But most of them know not.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "جب انسان کو تکلیف پہنچتی ہے تو ہمیں پکارنے لگتا ہے۔ پھر جب ہم اس کو اپنی طرف سے نعمت بخشتے ہیں تو کہتا ہے کہ یہ تو مجھے (میرے) علم (ودانش) کے سبب ملی ہے۔ (نہیں) بلکہ وہ آزمائش ہے مگر ان میں سے اکثر نہیں جانتے", translator: "Fateh Muhammad Jalandhari", license: PD }
