text: "عليه، كما تنبني فروع الشجرة على أصلها وتتغذى منه، وقد جاء في الحديث الصحيح الإِيمانُ بِضْعُ وستون، أو بضع وسبعون شعبة، أعلاها لا إله إلا اللّه، وأدناها إماطة الأذى عن الطريق. والحياءُ شعبة من الإِيمان. وقد ذكر اللّٰه تعالى منها …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 321، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 6, p. 321, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 6، ص 321 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
