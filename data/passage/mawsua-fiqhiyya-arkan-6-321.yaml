text: "عليه، كما تنبني فروع الشجرة على أصلها وتتغذى منه، وقد جاء في الحديث الصحيح الإِيمانُ بِضْعُ وستون، أو بضع وسبعون شعبة، أعلاها لا إله إلا اللّه، وأدناها إماطة الأذى عن الطريق. والحياءُ شعبة من الإِيمان. وقد ذكر اللّٰه تعالى منها …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 6، ص 321، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 6, p. 321, that mentions the branches of faith, faith as seventy-odd branches; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 6، ص 321 کا اقتباس جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 6, pág. 321, que menciona las ramas de la fe, entendida como setenta y tantas ramas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Un extrait de l'Encyclopédie koweïtienne de Fiqh (numérisée, volume 6, p. 321) mentionne les branches de la foi, la foi étant définie comme une soixantaine de branches. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi'nin Resimli 6. Cildinin 321. sayfasından bir alıntı, imanın yetmişten fazla dalı olduğunu belirtmektedir. Bu alıntı, makine tarafından okunabilir, taranmış versiyondan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 6 Bergambar, halaman 321, menyebutkan cabang-cabang iman, menyatakan bahwa iman memiliki lebih dari tujuh puluh cabang. Kutipan ini berasal dari versi yang dapat dibaca mesin dan dipindai, dan teksnya dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Kutipan ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
