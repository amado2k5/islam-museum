label: { ar: "جامع الترمذي 711 — الأب والأبوة", en: "Jami' al-Tirmidhi 711 — the father and fatherhood", ur: "جامع ترمذی 711 — باپ اور والدیت", es: "Jami' al-Tirmidhi 711 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 711 — le père et la paternité", tr: "Cami' el-Tirmizi 711 — Baba ve Babalık", id: "Jami' al-Tirmidhi 711 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا هَارُونُ بْنُ إِسْحَاقَ الْهَمْدَانِيُّ، حَدَّثَنَا عَبْدَةُ بْنُ سُلَيْمَانَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، أَنَّ حَمْزَةَ بْنَ عَمْرٍو الأَسْلَمِيَّ، سَأَلَ رَسُولَ اللَّهِ عَنِ الصَّوْمِ فِي السَّفَرِ وَكَانَ يَسْرُدُ الصَّوْمَ فَقَالَ رَسُولُ اللَّهِ \" إِنْ شِئْتَ فَصُمْ وَإِنْ شِئْتَ فَأَفْطِرْ \". قَالَ وَفِي الْبَابِ عَنْ أَنَسِ بْنِ مَالِكٍ وَأَبِي سَعِيدٍ وَعَبْدِ اللَّهِ بْنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 711، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 711 (The Book on Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 711، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 711 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 711 (Le Livre du jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 711 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı bu hadisi Kur'an, Sünnet, biyografi ve konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 711, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang subjek tersebut."
