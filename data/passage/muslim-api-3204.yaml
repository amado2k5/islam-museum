label: { ar: "صحيح مسلم 3204 — الحلال، ما حُرّم", en: "Sahih Muslim 3204 — the lawful; what was made unlawful", ur: "صحیح مسلم 3204 — حلال، جو حرام کیا گیا", es: "Sahih Muslim 3204 — Lo lícito; lo que se hizo ilícito", fr: "Sahih Muslim 3204 — le licite; ce qui a été rendu illicite", tr: "Sahih Müslim 3204 — Ne helal ise, ne haramdır.", id: "Sahih Muslim 3204 — Apa yang diperbolehkan adalah apa yang diharamkan" }
text: "وَحَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، حَدَّثَنَا عَبْدُ الصَّمَدِ، حَدَّثَنِي أَبِي، حَدَّثَنِي مُحَمَّدُ بْنُ جُحَادَةَ، عَنِ الْحَكَمِ، عَنْ إِبْرَاهِيمَ، عَنِ الأَسْوَدِ، عَنْ عَائِشَةَ، قَالَتْ كُنَّا نُقَلِّدُ الشَّاءَ فَنُرْسِلُ بِهَا وَرَسُولُ اللَّهِ حَلاَلٌ لَمْ يَحْرُمْ عَلَيْهِ مِنْهُ شَىْءٌ."
summary:
  ar: "حديث في صحيح مسلم، رقم 3204، يذكر الحلال، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3204 (The Book of Pilgrimage), that mentions the lawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3204، جس میں حلال، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe del Sahih Muslim, n.º 3204 (El Libro de la Peregrinación), menciona lo lícito y lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3204 (Le Livre du Pèlerinage), mentionne ce qui est licite et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
  tr: "Sahih Müslim'de 3204 numaralı hadis, helal ve haram olanı belirtmektedir. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3204, menyebutkan apa yang diperbolehkan dan apa yang diharamkan. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
