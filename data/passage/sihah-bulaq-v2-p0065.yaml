  أبو عبيد عن الاصمعى والمعى يكسر اللام الذى يأتى الحلوبة من قبل يمينها والمعلى أيضا
  اسم فرس الاسعر الشاعر وعلوى اسم فرس سليك ويعلى مصغراسم رجل وقول الراجز
  قد عجبت من ومن يعيليا * لمارأتى خلقا مقلولا
  أراد يعيلى فخرك الياء ضرورة لانه ردّه الى أصل وأصسل الياآت الحركة واعمالم يتون لانه
  لا نصرف واسستعلى الرجل أى علا واستعلاه أى علاه واعتلاه مثله وتعلى أى علافى مهلة
  وتعات المرأة من تفاسها أى سمت وتعلى الرجسل من علته والعلى الرفيع وأعلاه اللّه رفعه
  وعالامثله قال
  عاليت أنساعى وجلب الكور *على سراة رائح مطور
  وقال رؤبة
  وان هوى العائر قلنا دع_دعا * له وعالينا بتنعيش لعا
  وعليت المبل تعلية رفعته الى موضعه من البكرة والرشاء والتعالى الارتفاع تقول من
  اذا أمرت تعمال يارجل: فتح اللام وللمرأة تعالى وللمرأتين تعاليها وللنسوة تعالين ولا يجوز
  أن يقال منه تعاليت ولا ينهى عنه ويقال قد تعاليت والى أى شئ أتعالى وقولهسم عليك
  زيدا أى خذهلما كثر استعماله صار بمنزلة هلمّ وان كان أصله من الارتفاع وعلا بالاهر
  اضطلع به واستقل قال الشاعر
  اعدلما تعلوفالك بالذى • لاتستطيع من الاموريدان.
  وعلى لهاثلاثة مواضع قال أبو العباس المبرّدهى لفظة مشتركة للاسم والفعل والحرف لاات
  الاسم هو المرف أو الفعل ولكن يتفق الاسم والحرف فى اللفظ ألا ترى أنك تقول على زيد
  وب فعلى ه_ذه حرف وتقول علا زيد اثوب فعلاهذه فعل لانه من علا يعلو قال طرفة
  وعلا انيل دماه كالشقر • ويروى وعلى الخيل قال سيبويه ألفها منقلبة من واوالاأنها
  قلب مع المضحرياء تقول عليك وبعض العرب يتركها على حالها قال الراجز
  أى قلوص راكب تراها • واشدد بنى حقب حقواها
  فاديسة وناديا أباها • طارواعلاهن فطر علاها
  ويقال هى اغة بلارث بن كعب وعلى حرف خافض وقد يكون اسمايدخل عليه حرف جرّ
  قال مزاحم غدت من عليه بعدماتم ظمؤها • تصلّ وعن قيظ بزيزا مجهل
  وقال آخر غدت من عليه تنفض الطل بعدما * رأت حاجب الشمس استوى فترفها
  أى غدت من فوقه لان حرف الجرّلا يدخل على حرف الجر وقواه-م كان كذا على عهد فلان
  أى فى عهده وقد توضع فى موضع على وكذلك عاقة سروف الخفض وقد توضع موضع من
  كقوله تمالى اذاا كتالواعلى الناس يستوفون أى من الناس وتكون بعنى الباء قال
  أبوذؤيب• بسريفيض على القداح ويصدع• أى بالقداح وتقول على تزيداوعلى بزيد
  معناه أعطى زيد اوعاوان الكتاب عنوانه يق ولونه باللام والذون وقد علونته وعذونته والعلاوة
  ما عليت به على البعير بعد تقمام الوقرأ وعلتته عليه ضحو السقاء والسفود والسفرة والهع
  العلاوى مثل اداوة وأداوى والعلاوة أيضاراس الانسان مادام فى عنقه يقال ضرب
  علاوته أى رأسه(عمى العمى ذهاب البصرودعى فه وأعمى وقوم عى وأعماه الله
  وتعامى الرجل أرى من تفسه ذلك وعى عليه الامراذا التبس ومنه قوله تعالى فعميت عليهم
