text: "تدائه الى انتهائه فى كل عصر وهذا كاف فى افادة العلم في هذا (باب كتابة العلم ) العمد على تقصر فى هذا الحال وبالسمد الى المؤلف قال (حدثنا ابن سلام) بالتخفيف قال فى الكمال وقد يشدده من لا يعرف وقال"
