text: |-
  ٥٤٢
  •⁦(لتى)⁩*
  نقب البيت والجمع كواء بالمذركوا أيضامة صورامثل بدرة وبدر والكوّة بالضم لغة وتجمع على
  كوا وأماكى مخففة فجواب لقولك لم فعلت كذا فتقول كى يكون كذا وهى للعاقبة كانلام
  وتنصب الفعل المستقبل ويقال كان من الاهركيت وكيت ان شذت كسرت التاءوان شئت
  قتت وأصل التاءفيهاها وانماصارت ناء فى الوصل وحكى أبو عبيدة كان من الامر
  كيه وكيه بالهاء ويقال كيمه كمايقسال لمه فى الوقف ( هى لكهاة الناقة العظيمة وقال
  اذاعرضت منها كهاة سهينة • فلاتهد منها واتشق وتجبيب
  وصخرة أكهى اسم جبل
  صل الللام ( ل أى قال فعل ذلكْ بعدلاى أى بعدشدة وابطاء ولاى لا يا
  أى أبطأ والتأى مثله والتأى الرجل ألمس واللاواء الشدة وفى الحديث من كان له ثلاث
  نسات فصبر على لأوائهنّ كن له حجابا من النسار واللاى على وزن اللا النور الوحشى والجمع
  ألا على ألماءمثل جبل وأجبال والاننى لا مغل لعاة ولأى أيضارجل وتصغيره أؤى
  ومنه لؤى بن غالب واللاى أيضا الشدة فى العيش وقال
  وايم يغبر خيم السكريم • خلوقة توابه واللاى
  ( لبى لبيت باخج تلبية وربعا قالو البأت بالهمز وأصله غيراله-مزوابيت الرجل اذا قلت له
  لبيك قال يونس بن حبيب الضبى التحوى لبيك ليس بعننى انما هو مثل عليك واليك وحكى
  أبو عبيد عن انخليل أنّ أصل التلبية الاقامة بالمكان قال يقال ألبيت بالم-كان وابيت لغتان
  اذا أقت به قال ثم قلبوا الباء الشانية الى الياء استثقالا كما قالواتظنيت وانما أصلها تظننت
  وقولهم لبدك مننى على ماذ كرناه فى باب الباء وأنشد
  دعوت لمانابى مسورا * فلبى قلبى يدى مسور
  قال ولو كان بمنزلة على لقال فلى يدى مسورلانك تقول على زيداذا أظهرت الاسم وإذا
  لم تظهر تقول عليه كماقال
  دعوت فنى أجاب فتى دعاه • بلبده أشم تشمردتى
  الاحريقال بينهم اللتبية غيرمهم وزأى متفاوضون لايكتم بعضهم بعصا انكارا ى
  التى اسم مبهم للمؤنت وهومه رفة ولا يجوزنزع الالف واللاممنه للتنسكير ولا يتم الابصله
  وفيه ثلاث لغات التى واللت بكسر التاء والات باسكانها وفى تثفيتها ثلاث لغات أيضا اللثان
  واللتامحذف النون واللتان بتسديد النون وفى بهعهاخس لغات اللاتى واللات بكسر التاء
  بلاياء واللواتى واللوات :لاياء وأنتد أبو عبيد
  من اللواتى والتى واللاتى * زعمن أنى كبرت لذاتى
  واللواباسقاط التاء وتصغير التى المتيا بالفتح والتشديد فاذاثنيت المصغر أوجعت حذفت
  الااف وقلت اللتيان واللتيات قال الراجز بعد الثتيا واللتيا والتى *اداعلتها أنفس تردّت
  وبعض الشعراأدخل على التى حرف النداء وحروف التداء لا تدخل على مافيه الالف
  واللام الافي قولنايا اللّٰه وحده فكاً ته شبههايه من حيث كانت الااق واللام غير مفارقتين
  لها وقال
  من آجلان يا التى تيمت قلبى * وأنت بخيلة بالوصل عنى
