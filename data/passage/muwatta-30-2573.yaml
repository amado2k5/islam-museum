label: { ar: "الموطأ 2573 — أبو ليلى عن سهل بن أبي حثمة: قتل عبد الله بن سهل بخيبر والدية مائة ناقة", en: "Muwatta 2573", es: "Muwatta 2573", fr: "Muwatta 2573", ur: "موطا 2573", tr: "El-Muvatta 2573 — Ebu Leyla, Sahl ibn Abi Hatma'dan rivayetle: Abdullah ibn Sahl, Hayber'de öldürüldü ve kan parası yüz devedir.", id: "Al-Muwatta 2573 — Abu Layla berdasarkan riwayat Sahl ibn Abi Hathma: Abdullah ibn Sahl terbunuh di Khaybar, dan uang ganti ruginya adalah seratus ekor unta." }
summary:
  ar: "يروي مالك عن أبي ليلى بن عبد الله بن عبد الرحمن بن سهل عن سهل بن أبي حثمة أنه أخبره رجال من كبراء قومه أن عبد الله بن سهل ومحيصة خرجا إلى خيبر من جهد أصابهم، فأُخبر محيصة أن عبد الله بن سهل قد قُتل وطُرح في فقير بئر أو عين. فأتى يهودا فقال: أنتم قتلتموه، فقالوا: والله ما قتلناه. فرجع إلى قومه فذكر ذلك، ثم أقبل هو وأخوه حويصة وعبد الرحمن. فذهب محيصة ليتكلم، فقال له النبي: كبّر كبّر، يريد السن. فتكلم حويصة ثم محيصة، فقال النبي: إما أن يدوا صاحبكم وإما أن يؤذنوا بحرب. فكتب إليهم، فكتبوا: إنا والله ما قتلناه. فقال النبي لحويصة ومحيصة وعبد الرحمن: أتحلفون وتستحقون دم صاحبكم؟ فقالوا: لا. فقال: أفتحلف لكم يهود؟ قالوا: ليسوا بمسلمين. فوداه النبي من عنده، فبعث إليهم بمائة ناقة حتى أُدخلت عليهم الدار. قال سهل: لقد ركضتني منها ناقة حمراء. قال مالك: والفقير هو البئر. ويذكر المحقق اختلاف أصحاب مالك في إسناد الحديث، وأن رواية أبي ليلى عن سهل بن أبي حثمة في بعض الطرق تؤكد الاتصال. {cite:muwatta-maruf-1997 p.451} {cite:muwatta-maruf-1997 p.452}"
  tr: "Malik, Ebu Leyla ibn Abdullah ibn Abdurrahman ibn Sahl'dan, o da Sahl ibn Abi Hatma'dan rivayet ettiğine göre, kabilesinin ileri gelenlerinden bazıları ona, Abdullah ibn Sahl ve Muhaysah'ın çektikleri zorluklar nedeniyle Hayber'e gittiklerini anlattılar. Muhaysah'a, Abdullah ibn Sahl'ın öldürüldüğü ve cesedinin bir kuyuya veya pınara atıldığı bildirildi. Yahudilerin yanına gidip, \"Onu siz öldürdünüz\" dedi. Onlar da, \"Allah'a yemin olsun ki, biz öldürmedik\" diye cevap verdiler. O da kavmine geri döndü ve onlara bunu anlattı. Sonra kendisi, kardeşi Huveyşa ve Abdurrahman geldiler. Muhaysah konuşmak üzereyken, Peygamber ona, \"Önce büyük konuşsun\" dedi, yani büyük olanı kastederek. Önce Huveyşa konuştu, sonra Muhaysah. Peygamber, \"Ya arkadaşın için kan parası ödeyecekler ya da savaş ilan edilecek\" dedi. Onlara mektup yazdı ve onlar da, \"Allah'a yemin olsun ki, biz öldürmedik\" diye cevap verdiler. Peygamberimiz, Huveyşa, Muhayşa ve Abdurrahman'a, \"Arkadaşınız için yemin edip kan parasına hak kazanacak mısınız?\" diye sordu. Onlar, \"Hayır\" dediler. Peygamberimiz, \"Yahudiler sizin için yemin edecek mi?\" diye sordu. Onlar, \"Onlar Müslüman değiller\" dediler. Peygamberimiz onlara yüz deve gönderdi ve bunlar evlerine getirildi. Sahl, \"Onlardan kırmızı bir deve beni tekmeledi\" dedi. Malik, \"Fakir adam kuyudur\" dedi. Araştırmacı, Malik'in takipçileri arasında hadisin rivayet zinciri konusunda farklılıklar olduğunu ve bazı rivayetlerde Ebu Leyla'nın Sahl ibn Abi Hatma'dan rivayetinin bağlantıyı doğruladığını belirtiyor. {cite:muwatta-maruf-1997 s.451} {cite:muwatta-maruf-1997 s.452}"
  id: "Malik meriwayatkan dari Abu Layla ibn Abdullah ibn Abdur-Rahman ibn Sahl, yang juga meriwayatkan dari Sahl ibn Abi Hathma, bahwa beberapa tetua sukunya memberitahunya bahwa Abdullah ibn Sahl dan Muhaysah telah pergi ke Khaybar karena kesulitan yang mereka alami. Muhaysah diberitahu bahwa Abdullah ibn Sahl telah terbunuh dan tubuhnya dibuang ke dalam sumur atau mata air. Ia pergi kepada orang-orang Yahudi dan berkata, \"Kalianlah yang membunuhnya.\" Mereka menjawab, \"Demi Allah, kami tidak membunuhnya.\" Ia kembali kepada kaumnya dan menceritakan hal ini kepada mereka. Kemudian ia, saudaranya Huwaysah, dan Abdur-Rahman datang. Muhaysah hendak berbicara, tetapi Nabi berkata kepadanya, \"Biarlah tetua yang berbicara terlebih dahulu,\" maksudnya tetua yang berbicara. Huwaysah berbicara terlebih dahulu, kemudian Muhaysah. Nabi berkata, \"Mereka harus membayar uang darah untuk temanmu, atau mereka akan dinyatakan berperang.\" Dia menulis surat kepada mereka, dan mereka membalas, \"Demi Allah, kami tidak membunuhnya.\" Nabi berkata kepada Huwaysah, Muhaysah, dan Abdur-Rahman, \"Apakah kalian akan bersumpah dan berhak atas uang darah untuk teman kalian?\" Mereka menjawab, \"Tidak.\" Beliau berkata, \"Apakah orang Yahudi akan bersumpah untuk kalian?\" Mereka menjawab, \"Mereka bukan Muslim.\" Nabi (shalawat dan salam kepadanya) mengirimkan seratus unta kepada mereka, yang dibawa ke rumah mereka. Sahl berkata, \"Seekor unta merah di antara mereka menendangku.\" Malik berkata, \"Orang malang itu adalah sumur.\" Peneliti menyebutkan perbedaan di antara pengikut Malik mengenai sanad hadits, dan bahwa riwayat Abu Layla dari Sahl ibn Abi Hathma dalam beberapa versi menegaskan hubungan tersebut. {cite:muwatta-maruf-1997 p.451} {cite:muwatta-maruf-1997 p.452}"
