label: { ar: "الموطأ 2573 — أبو ليلى عن سهل بن أبي حثمة: قتل عبد الله بن سهل بخيبر والدية مائة ناقة", en: "Muwatta 2573" }
summary:
  ar: "يروي مالك عن أبي ليلى بن عبد الله بن عبد الرحمن بن سهل عن سهل بن أبي حثمة أنه أخبره رجال من كبراء قومه أن عبد الله بن سهل ومحيصة خرجا إلى خيبر من جهد أصابهم، فأُخبر محيصة أن عبد الله بن سهل قد قُتل وطُرح في فقير بئر أو عين. فأتى يهودا فقال: أنتم قتلتموه، فقالوا: والله ما قتلناه. فرجع إلى قومه فذكر ذلك، ثم أقبل هو وأخوه حويصة وعبد الرحمن. فذهب محيصة ليتكلم، فقال له النبي: كبّر كبّر، يريد السن. فتكلم حويصة ثم محيصة، فقال النبي: إما أن يدوا صاحبكم وإما أن يؤذنوا بحرب. فكتب إليهم، فكتبوا: إنا والله ما قتلناه. فقال النبي لحويصة ومحيصة وعبد الرحمن: أتحلفون وتستحقون دم صاحبكم؟ فقالوا: لا. فقال: أفتحلف لكم يهود؟ قالوا: ليسوا بمسلمين. فوداه النبي من عنده، فبعث إليهم بمائة ناقة حتى أُدخلت عليهم الدار. قال سهل: لقد ركضتني منها ناقة حمراء. قال مالك: والفقير هو البئر. ويذكر المحقق اختلاف أصحاب مالك في إسناد الحديث، وأن رواية أبي ليلى عن سهل بن أبي حثمة في بعض الطرق تؤكد الاتصال. {cite:muwatta-maruf-1997 p.451} {cite:muwatta-maruf-1997 p.452}"
