label: { ar: "الموطأ 2228 — مالك: فيمن أوصى بوصية وذكر أنه كان أعطى بعض ورثته شيئا لم يقبضه، فأبى الورثة أن يجيزوا ذلك: فإن ذلك يرجع إلى الورثة ميراثا على كتاب الله، لأن الميت لم يرد أن يقع شيء من ذلك في ثلثه", en: "Muwatta 2228", es: "Muwatta 2228", fr: "Muwatta 2228", ur: "موطا 2228", tr: "El-Muvatta 2228 — Malik: Bir kimse vasiyetname yapmış ve mirasçılarından bazılarına bir şeyler verdiğini, ancak onların bunları almadığını ve mirasçıların da bunu onaylamadığını belirtmişse, bu, Allah'ın Kitabına göre miras olarak mirasçılara geri döner; çünkü ölen kişi, bu şeylerin hiçbirinin kendi üçte bir payına girmesini istememiştir.", id: "Al-Muwatta 2228 — Malik: Mengenai seseorang yang membuat wasiat dan menyebutkan bahwa ia telah memberikan sesuatu kepada sebagian ahli warisnya yang tidak mereka terima, dan ahli waris tersebut menolak untuk menyetujuinya: maka hal itu kembali kepada ahli waris sebagai warisan menurut Kitab Allah, karena almarhum tidak ingin sebagian pun dari itu termasuk dalam bagian sepertiga miliknya." }
summary:
  ar: "قال: وسمعت مالكا يقول فيمن أوصى بوصية، فذكر أنه قد كان أعطى بعض ورثته شيئا لم يقبضه، فأبى الورثة أن يجيزوا ذلك: فإن ذلك يرجع إلى الورثة ميراثا على كتاب الله؛ لأن الميت لم يرد أن يقع شيء من ذلك في ثلثه، ولا يحاص أهل الوصايا في ثلثه بشيء من ذلك. {cite:muwatta-maruf-1997 p.316}"
  tr: "Şöyle dedi: Malik'in, vasiyetname hazırlayan ve mirasçılarından bazılarına sahip olmadıkları bir şey bıraktığını, mirasçıların da bunu onaylamayı reddettiğini söyleyen biri hakkında şöyle dediğini duydum: \"Bu, Allah'ın Kitabına göre miras olarak mirasçılara geri döner; çünkü ölen kişi bunun hiçbirinin kendi payına düşmesini istememiştir, ne de vasiyet hakkına sahip olanlar bunun hiçbirinden pay almamalıdır.\" {cite:muwatta-maruf-1997 s.316}"
  id: "Dia berkata: Saya mendengar Malik berkata mengenai seseorang yang membuat wasiat, dan menyebutkan bahwa ia telah memberikan sesuatu kepada sebagian ahli warisnya yang tidak mereka ambil kepemilikannya, dan para ahli waris menolak untuk menyetujuinya: bahwa hal itu kembali kepada ahli waris sebagai warisan menurut Kitab Allah; karena almarhum tidak ingin sebagian dari itu termasuk dalam sepertiga bagiannya, dan mereka yang berhak atas wasiat pun tidak boleh berbagi sepertiga bagiannya dengan apa pun dari hal itu. {cite:muwatta-maruf-1997 p.316}"
