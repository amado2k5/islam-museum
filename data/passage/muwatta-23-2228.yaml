label: { ar: "الموطأ 2228 — مالك: فيمن أوصى بوصية وذكر أنه كان أعطى بعض ورثته شيئا لم يقبضه، فأبى الورثة أن يجيزوا ذلك: فإن ذلك يرجع إلى الورثة ميراثا على كتاب الله، لأن الميت لم يرد أن يقع شيء من ذلك في ثلثه", en: "Muwatta 2228" }
summary:
  ar: "قال: وسمعت مالكا يقول فيمن أوصى بوصية، فذكر أنه قد كان أعطى بعض ورثته شيئا لم يقبضه، فأبى الورثة أن يجيزوا ذلك: فإن ذلك يرجع إلى الورثة ميراثا على كتاب الله؛ لأن الميت لم يرد أن يقع شيء من ذلك في ثلثه، ولا يحاص أهل الوصايا في ثلثه بشيء من ذلك. {cite:muwatta-maruf-1997 p.316}"
