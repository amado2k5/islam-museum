text: "… الحديث: ما أَذِن اللّٰه لشيء كَأَذنِه لنبيٍّ متغنٍّ بالقرآن. وصفه اللّه تعالى بذلك إِلا أَنه تعالى فسَّره بما هو مَدْح لنبيه علقّه وثناء عليه وإِن كان قَصدوا بذلك ذمَّه. والمشهور ضم ذال أذُن. وقرأً نافع بسكونها، قال ابن عطية تعالى: …"
summary:
