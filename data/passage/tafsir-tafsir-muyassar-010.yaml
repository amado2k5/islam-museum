text: "عظيم بالأماني التي تتمنونها أيها المسلمون، ولا بأماني أهل الكتاب من اليهود والنصارى، وإنسما ينال بالإيمان الصادق بالله تعالى، وإحسان العمل الذي يرضيه. ومن يعمل عملا سيئا يجز به، ولا يجد له سوى الله تعالى وليا يتولى أمره وشأنه، ولا"
