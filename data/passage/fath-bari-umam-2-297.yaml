text: "… الآخِرِ وَلَا يُحَرَمُونَ إلى: وَهُمْ صَاغِرُونَ يعني : أذلاءَ والمسكنةُ: مصدر المسكين، أسكنَ من فلان : أحوجَ منه. ولم يذهب إلى السكون وما جاءَ في أخذِ الجزيةِ من اليهودِ والنصارى والمجوس والعجم وقالَ ابن عُيينةَ عن ابن أَبي نجيح: قلتُ …"
