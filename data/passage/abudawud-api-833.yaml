label: { ar: "سنن أبي داود 833 — التطوع", en: "Sunan Abi Dawud 833 — the voluntary act (tatawwu')", ur: "سنن ابی داؤد 833 — تطوع ⁦(نفلی عمل)⁩", fr: "Sunan Abi Dawud 833 — l'acte volontaire (tatawwu')", es: "Sunan Abi Dawud 833 — el acto voluntario (tatawwu')" }
text: "حَدَّثَنَا أَبُو تَوْبَةَ الرَّبِيعُ بْنُ نَافِعٍ، أَخْبَرَنَا أَبُو إِسْحَاقَ، - يَعْنِي الْفَزَارِيَّ - عَنْ حُمَيْدٍ، عَنِ الْحَسَنِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ كُنَّا نُصَلِّي التَّطَوُّعَ نَدْعُو قِيَامًا وَقُعُودًا وَنُسَبِّحُ رُكُوعًا وَسُجُودًا."
summary:
  ar: "حديث في سنن أبي داود، رقم 833، يرد فيه ذكر التطوع. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 833 (Prayer (Kitab Al-Salat)), whose wording mentions the voluntary act (tatawwu'). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 833، جس کے الفاظ میں تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 833, dont le texte mentionne l'acte volontaire (tatawwu'). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 833, cuyo texto menciona el acto voluntario (tatawwu'). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
