summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1361، يذكر المرض والمريض، والوجع، وأسماء الأمراض، والعلاج، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1361, that mentions illness and the sick, pain, named diseases, treatment, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1361 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، علاج، اعضائے بدن، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 1361, que menciona la enfermedad y los enfermos, el dolor, enfermedades específicas, tratamientos, los órganos del cuerpo, cirugía, circuncisión y férulas; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 1361, qui mentionne la maladie et les malades, la douleur, les maladies nommées, le traitement, les organes du corps, la chirurgie, la circoncision et les attelles; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 1361. sayfasından bir bölüm; hastalık ve hasta, ağrı, hastalıkların isimleri, tedavi, vücut organları, ameliyat, sünnet ve atellerden bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 1361, yang menyebutkan penyakit dan pasien, rasa sakit, nama-nama penyakit, pengobatan, organ-organ tubuh, pembedahan, sunat dan bidai; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
