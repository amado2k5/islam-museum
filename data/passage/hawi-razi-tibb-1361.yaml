text: "أمراض الأمعاء في القولنج وإيلاوس وأوجاع البطن الشبيهة به والرياح وخير ذلك من الحقن لروفس وينسب إلى ج: البقول الباردة واليابسة والهواء البارد يعرض منه وجع القولنج، وعلاجه بالتكميد والضماد الحار ويداوم التكميد لأن إن كمد قليلاً زاد في الوجع …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1361، يذكر المرض والمريض، والوجع، وأسماء الأمراض، والعلاج، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1361, that mentions illness and the sick, pain, named diseases, treatment, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1361 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، علاج، اعضائے بدن، جراحت، ختنہ اور پٹیاں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
