label: { ar: "الموطأ 2247 — مالك: مما يبين ذلك أن المكاتب إذا كوتب تبعه ماله وإن لم يشترطه، لأن عقد الكتابة هو عقد الولاء، وليس مال العبد والمكاتب بمنزلة ما كان لهما من ولد، لأن السنة أن العبد إذا أعتق تبعه ماله ولم يتبعه ولده، وأن المكاتب إذا كوتب تبعه ماله ولم يتبعه ولده", en: "Muwatta 2247" }
summary:
  ar: "قال مالك: ومما يبين ذلك أن المكاتب إذا كوتب تبعه ماله، وإن لم يشترطه، وذلك أن عقد الكتابة هو عقد الولاء إذا تم ذلك. وليس مال العبد والمكاتب بمنزلة ما كان لهما من ولد؛ إنما أولادهما بمنزلة رقابهما ليسوا بمنزلة أموالهما؛ لأن السنة التي لا اختلاف فيها، أن العبد إذا أعتق تبعه ماله، ولم يتبعه ولده، وأن المكاتب إذا كوتب تبعه ماله، ولم يتبعه ولده. قال مالك: ومما يبين ذلك أيضا أن العبد والمكاتب إذا أفلسا أخذت أموالهما، وأمهات أولادهما، ولم تؤخذ أولادهما، لأنهم ليسوا بأموال لهما. {cite:muwatta-maruf-1997 p.327}"
