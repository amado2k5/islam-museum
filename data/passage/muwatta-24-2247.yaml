label: { ar: "الموطأ 2247 — مالك: مما يبين ذلك أن المكاتب إذا كوتب تبعه ماله وإن لم يشترطه، لأن عقد الكتابة هو عقد الولاء، وليس مال العبد والمكاتب بمنزلة ما كان لهما من ولد، لأن السنة أن العبد إذا أعتق تبعه ماله ولم يتبعه ولده، وأن المكاتب إذا كوتب تبعه ماله ولم يتبعه ولده", en: "Muwatta 2247", es: "Muwatta 2247", fr: "Muwatta 2247", ur: "موطا 2247", tr: "El-Muvatta 2247 — Malik: Bu, azat sözleşmesiyle köle olan birine özgürlüğü verilirse, bunu şart koşmamış olsa bile malının da onunla birlikte geleceğini açıklığa kavuşturmaktadır; çünkü azat sözleşmesi bir sadakat sözleşmesidir ve kölenin malı ile azat sözleşmesiyle köle olan birinin malı, çocukları gibi değildir; zira Sünnet şudur ki, köle azat edilirse malı onunla birlikte gelir, çocukları gelmez; azat sözleşmesiyle köle olan birine özgürlüğü verilirse malı onunla birlikte gelir, çocukları gelmez.", id: "Al-Muwatta 2247 — Malik: Ini menjelaskan bahwa jika seorang budak yang terikat perjanjian pembebasan diberikan kebebasannya, hartanya akan tetap bersamanya meskipun ia tidak mensyaratkannya, karena perjanjian pembebasan adalah perjanjian kesetiaan, dan harta seorang budak dan budak yang terikat perjanjian pembebasan tidak seperti anak-anak mereka, karena Sunnahnya adalah jika seorang budak dibebaskan, hartanya akan tetap bersamanya, tetapi anak-anaknya tidak, dan jika seorang budak yang terikat perjanjian pembebasan diberikan kebebasannya, hartanya akan tetap bersamanya, tetapi anak-anaknya tidak." }
summary:
  ar: "قال مالك: ومما يبين ذلك أن المكاتب إذا كوتب تبعه ماله، وإن لم يشترطه، وذلك أن عقد الكتابة هو عقد الولاء إذا تم ذلك. وليس مال العبد والمكاتب بمنزلة ما كان لهما من ولد؛ إنما أولادهما بمنزلة رقابهما ليسوا بمنزلة أموالهما؛ لأن السنة التي لا اختلاف فيها، أن العبد إذا أعتق تبعه ماله، ولم يتبعه ولده، وأن المكاتب إذا كوتب تبعه ماله، ولم يتبعه ولده. قال مالك: ومما يبين ذلك أيضا أن العبد والمكاتب إذا أفلسا أخذت أموالهما، وأمهات أولادهما، ولم تؤخذ أولادهما، لأنهم ليسوا بأموال لهما. {cite:muwatta-maruf-1997 p.327}"
  tr: "Malik şöyle dedi: Bu durum, bir kölenin özgür bırakılma sözleşmesiyle özgürlüğüne kavuşması halinde, bu şartı belirtmemiş olsa bile, mal varlığının da kendisine geçmesiyle daha da açıklığa kavuşmaktadır. Çünkü özgür bırakılma sözleşmesi, kesinleştiği anda bir velayet sözleşmesidir. Bir kölenin ve özgür bırakılma sözleşmesiyle köle olan kişinin mal varlığı, çocukları gibi değildir; aksine, çocukları onların şahsı gibidir, mal varlığı gibi değil. Çünkü üzerinde ihtilaf bulunmayan yerleşik uygulama şudur ki, bir köle özgür bırakılırsa, mal varlığı kendisine geçer, ancak çocukları geçmez. Benzer şekilde, bir kölenin özgür bırakılma sözleşmesiyle özgürlüğüne kavuşması halinde, mal varlığı kendisine geçer, ancak çocukları geçmez. Malik ayrıca şöyle dedi: Bu durum, bir kölenin ve özgür bırakılma sözleşmesiyle köle olan kişinin iflas etmesi halinde, mal varlıkları ve çocuklarının annelerinin alınması, ancak çocuklarının alınmaması gerçeğiyle daha da açıklığa kavuşmaktadır; çünkü çocuklar onların mal varlığı olarak kabul edilmez."
  id: "Malik berkata: Hal ini semakin diperjelas oleh fakta bahwa jika seorang budak yang terikat kontrak pembebasan diberikan kebebasannya, hartanya akan mengikutinya, meskipun ia tidak menetapkan syarat ini. Ini karena kontrak pembebasan adalah kontrak kesetiaan (wala') setelah diselesaikan. Harta seorang budak dan budak yang terikat kontrak pembebasan tidak seperti anak-anak mereka; melainkan, anak-anak mereka seperti pribadi mereka, bukan seperti harta mereka. Ini karena praktik yang telah mapan, yang tidak ada perselisihannya, adalah bahwa jika seorang budak dibebaskan, hartanya akan mengikutinya, tetapi anak-anaknya tidak. Demikian pula, jika seorang budak yang terikat kontrak pembebasan diberikan kebebasannya, hartanya akan mengikutinya, tetapi anak-anaknya tidak. Malik juga berkata: Hal ini semakin diperjelas oleh fakta bahwa jika seorang budak dan budak yang terikat kontrak pembebasan menjadi bangkrut, harta mereka dan ibu dari anak-anak mereka akan diambil, tetapi anak-anak mereka tidak, karena anak-anak tidak dianggap sebagai harta mereka."
