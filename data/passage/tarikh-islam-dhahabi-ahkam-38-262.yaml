text: "… الآثار والأخبار، لما بينه من معانيه. أنبؤونا عن أبي طاهر محمد بن أبي بكر السنجي، عنه أنه قال : جملة القول في دخول الحمّام أنه مباح للرجال بشرط ستر العورة، وغضّ البصر، ومكروه للنساء إلا عند العذر من النفاس والمرض، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 38، ص 262، يرد فيه ذكر المكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 38, p. 262, whose wording mentions the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 38، ص 262 کا اقتباس جس میں مکروہ، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam de al-Dhahabi, volume numérisé 38, p. 262, dont le texte mentionne le réprouvé (makruh), le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen digitalizado 38, p. 262, cuyo texto menciona lo reprobado (makruh), lo permitido (mubah); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Dhahabi'nin *İslam Tarihi* adlı eserinin 38. cildinin 262. sayfasından bir alıntı, mekruh olan ve helal olan şeylerden bahsetmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu metin, farz olan ameller, itaat gerektiren ameller, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 38, halaman 262, menyebutkan apa yang tidak disukai dan apa yang diperbolehkan. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam kurang lebih empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
