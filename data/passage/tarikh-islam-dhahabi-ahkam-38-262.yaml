text: "… الآثار والأخبار، لما بينه من معانيه. أنبؤونا عن أبي طاهر محمد بن أبي بكر السنجي، عنه أنه قال : جملة القول في دخول الحمّام أنه مباح للرجال بشرط ستر العورة، وغضّ البصر، ومكروه للنساء إلا عند العذر من النفاس والمرض، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 38، ص 262، يرد فيه ذكر المكروه، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 38, p. 262, whose wording mentions the disliked (makruh), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 38، ص 262 کا اقتباس جس میں مکروہ، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
