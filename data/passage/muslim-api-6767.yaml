label: { ar: "صحيح مسلم 6767 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih Muslim 6767 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح مسلم 6767 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih Muslim 6767 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sahih Muslim 6767 — Le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sahih Muslim 6767 — Baba ve babalık, anne babaya saygı göstermek veya göstermemek", id: "Sahih Muslim 6767 — Ayah dan peran ayah, menghormati atau durhaka kepada orang tua" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ بْنِ قَعْنَبٍ، حَدَّثَنَا مُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، عَنْ رَقَبَةَ، بْنِ مَسْقَلَةَ عَنْ أَبِي إِسْحَاقَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عَنْ أُبَىِّ بْنِ كَعْبٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ الْغُلاَمَ الَّذِي قَتَلَهُ الْخَضِرُ طُبِعَ كَافِرًا وَلَوْ عَاشَ لأَرْهَقَ أَبَوَيْهِ طُغْيَانًا وَكُفْرًا \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 6767، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6767 (The Book of Destiny), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6767، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih Muslim, n.º 6767 (El Libro del Destino), menciona al padre y la paternidad, así como el deber hacia los padres o la desobediencia hacia ellos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6767 (Le Livre du Destin), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sahih Müslim'de 6767 numaralı hadis, baba ve babalık kavramından, anne babaya saygı göstermekten veya göstermemekten bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6767, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
