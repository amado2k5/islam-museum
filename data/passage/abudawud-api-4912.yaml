label: { ar: "سنن أبي داود 4912 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 4912 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 4912 — جو حلال کیا گیا، جو حلال نہیں", es: "Sunan Abi Dawud 4912 — lo que fue lícito; lo que no es lícito" }
text: "… أَبَا عَامِرٍ، أَخْبَرَهُمْ قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ هِلاَلٍ، قَالَ حَدَّثَنِي أَبِي، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ قَالَ \" لاَ يَحِلُّ لِمُؤْمِنٍ أَنْ يَهْجُرَ مُؤْمِنًا فَوْقَ ثَلاَثٍ فَإِنْ مَرَّتْ بِهِ ثَلاَثٌ فَلْيَلْقَهُ فَلْيُسَلِّمْ عَلَيْهِ فَإِنْ رَدَّ فَقَدِ اشْتَرَكَا فِي الأَجْرِ وَإِنْ لَمْ يَرُدَّ عَلَيْهِ فَقَدْ بَاءَ بِالإِثْمِ \". زَادَ أَحْمَدُ \" وَخَرَجَ الْمُسَلِّمُ مِنَ الْهِجْرَةِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4912، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 4912 (General Behavior (Kitab Al-Adab)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 4912، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4912 (Conducta General (Kitab Al-Adab)), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
