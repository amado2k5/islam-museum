text: "… عُرْوَةُ، فَأَخَرَ عُمَرُ العَصْرَ شَيْئًا، فَقَالَ لَهُ عَرْوَةُ: أَمَا إِنَّ جِبْرِيلَ نَزَلَ، فَصَلَّى أَمامَ رَسُولِ اللَّهِ،، فقالَ عُمَر: اعْلَمْ مَا تَقُولُ يَا عُرْوَةُ، فَقَالَ: سَمِعْتُ بَشِيرَ بن أَبِي مَسْعُودٍ يَقُولُ: سَمِعْتُ أَبَا مَسْعُودٍ يَقُولُ: سَمِعْتُ أركان الإسلام، والترمذي في الزكاة: …"
