text: "… المهملة، ويجوز صَرْفُه على إرادة الحَىّ وتَرْك صَرْفِه على إرادة القبيلة أَو الطائفة - وهم الوسط من يهود المدينة. وإذا قلت : بنو قينقاع فالوجه الصَّرْف، وقُرَيْظَة- بقاف مضمومة فظاء معجمة مشالة، وهو أخو النضير والوسط من يهود المدينة، والنَّضِير …"
