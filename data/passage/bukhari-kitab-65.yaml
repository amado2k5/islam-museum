  en: "Sahih al-Bukhari, Book 65: Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))"
  ur: "صحیح بخاری، کتاب التفسیر"
  es: "Sahih al-Bukhari, Libro 65: Comentario profético sobre el Corán (Tafsir del Profeta (pbuh))"
summary:
  ar: "القسم 65 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب التفسير»، ويضم فيها النصوص من 4474 إلى 4977 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 65 of Sahih al-Bukhari (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))) in the division of the open hadith dataset the museum took its reports from: reports 4474 to 4977 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 65، عنوان «کتاب التفسیر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4474 تا 4977۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 65 de Sahih al-Bukhari (Comentario profético del Corán (Tafsir del Profeta, p.u.)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4474 al 4977, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
