label: { ar: "الموطأ 2033 — يحيى عن مالك: فيمن معه مال قراض فهو يستنفق منه ويكتسي: لا يهب منه شيئا، ولا يعطي منه سائلا ولا غيره، ولا يكافئ فيه أحدا، فإن اجتمع هو وقوم فجاءوا بطعام وجاء هو بطعام، فأرجو أن يكون ذلك واسعا إذا لم يتعمد التفضل عليهم، فإن تعمد ذلك فعليه أن يتحلله رب المال", en: "Muwatta 2033" }
summary:
  ar: "قال يحيى: قال مالك في رجل معه مال قراض، فهو يستنفق منه ويكتسي: إنه لا يهب منه شيئا، ولا يعطي منه سائلا ولا غيره، ولا يكافئ فيه أحدا. فأما إن اجتمع هو وقوم، فجاءوا بطعام وجاء هو بطعام، فأرجو أن يكون ذلك واسعا، إذا لم يتعمد أن يتفضل عليهم. فإن تعمد ذلك، أو ما يشبهه، بغير إذن صاحب المال، فعليه أن يتحلله من رب المال. فإن حلله ذلك فلا بأس به، وإن أبى أن يحلله فعليه أن يكافئه بمثل ذلك، إن كان ذلك شيئا له مكافأة. {cite:muwatta-maruf-1997 p.231}"
