label: { ar: "الموطأ 2033 — يحيى عن مالك: فيمن معه مال قراض فهو يستنفق منه ويكتسي: لا يهب منه شيئا، ولا يعطي منه سائلا ولا غيره، ولا يكافئ فيه أحدا، فإن اجتمع هو وقوم فجاءوا بطعام وجاء هو بطعام، فأرجو أن يكون ذلك واسعا إذا لم يتعمد التفضل عليهم، فإن تعمد ذلك فعليه أن يتحلله رب المال", en: "Muwatta 2033", es: "Muwatta 2033", fr: "Muwatta 2033", ur: "موطا 2033", tr: "El-Muvatta 2033 — Yahya, Malik'ten rivayetle: Kâr paylaşımı ortaklığı (kırad) için sermayesi olan ve bundan kendisi ve giyimi için harcayan kimse hakkında: Bundan hiçbir şey vermemeli, dilenciye veya başkasına vermemeli, karşılık olarak da kullanmamalıdır. Eğer o ve bir grup insan toplanıp yemek getirirlerse ve o da yemek getirirse, kasten onlara iyilik yapmıyorsa bunun caiz olduğunu umuyorum. Eğer kasten iyilik yapıyorsa, sermaye sahibinden af dilemelidir.", id: "Al-Muwatta 2033 — Yahya berdasarkan riwayat Malik: Mengenai orang yang mempunyai modal untuk usaha qirad dan menggunakannya untuk dirinya sendiri dan pakaiannya: ia tidak boleh memberikan sebagian dari modal itu kepada orang lain, atau memberikannya kepada pengemis atau siapa pun, atau membalas kebaikan tersebut. Jika ia dan sekelompok orang berkumpul dan membawa makanan, dan ia juga membawa makanan, maka saya harap hal itu diperbolehkan jika ia tidak sengaja menunjukkan kebaikan kepada mereka. Jika ia melakukannya dengan sengaja, maka ia harus meminta maaf kepada pemilik modal tersebut." }
summary:
  ar: "قال يحيى: قال مالك في رجل معه مال قراض، فهو يستنفق منه ويكتسي: إنه لا يهب منه شيئا، ولا يعطي منه سائلا ولا غيره، ولا يكافئ فيه أحدا. فأما إن اجتمع هو وقوم، فجاءوا بطعام وجاء هو بطعام، فأرجو أن يكون ذلك واسعا، إذا لم يتعمد أن يتفضل عليهم. فإن تعمد ذلك، أو ما يشبهه، بغير إذن صاحب المال، فعليه أن يتحلله من رب المال. فإن حلله ذلك فلا بأس به، وإن أبى أن يحلله فعليه أن يكافئه بمثل ذلك، إن كان ذلك شيئا له مكافأة. {cite:muwatta-maruf-1997 p.231}"
  tr: "Yahya şöyle dedi: Malik, kâr paylaşımı kredisi için sermayesi olan ve bundan harcama yapıp elbise alan bir adam hakkında şöyle demiştir: Bundan hiçbir şey vermemeli, dilenciye veya başkasına vermemeli, karşılık olarak da kullanmamalıdır. Ancak, eğer o ve bazı kişiler bir araya gelir ve onlar yemek getirir, o da yemek getirirse, kasten gösteriş yapmadığı sürece bunun caiz olduğunu umuyorum. Fakat eğer bunu kasten veya benzer bir şekilde, sermaye sahibinin izni olmadan yaparsa, sermaye sahibinden af dilemelidir. Eğer sermaye sahibi onu affederse, bunda bir sakınca yoktur. Ama eğer affetmeyi reddederse, eğer karşılık verilmesi gereken bir şey ise, aynı şekilde karşılık vermelidir. {cite:muwatta-maruf-1997 s.231}"
  id: "Yahya berkata: Malik berkata mengenai seorang pria yang memiliki modal untuk pinjaman bagi hasil, dan dia membelanjakannya serta membeli pakaian darinya: Dia tidak boleh memberikan apa pun darinya, atau memberikannya kepada pengemis atau siapa pun, atau membalasnya. Namun, jika dia dan beberapa orang berkumpul, dan mereka membawa makanan dan dia membawa makanan, maka saya harap itu diperbolehkan, asalkan dia tidak sengaja pamer kepada mereka. Tetapi jika dia melakukannya dengan sengaja, atau sesuatu yang serupa, tanpa izin dari pemilik modal, maka dia harus meminta maaf kepada pemiliknya. Jika pemiliknya memaafkannya, maka tidak ada salahnya. Tetapi jika dia menolak untuk memaafkannya, maka dia harus membalasnya dengan cara yang sama, jika itu adalah sesuatu yang pantas dia dapatkan balasannya. {kutip:muwatta-maruf-1997 hlm.231}"
