text: "… الأكبر : وهو ينفض الأخلاط الغليظة، ويفتح السدد، وينفع من وجع المفاصل، والخاصرة والبرص، والبهق والجذام، وداء الفيل وهو الحبّ المعروف بالماهاني. أخلاطه: يؤخذ أشق وسكبينج، وجاوشير، ومقل وصبر، وحرمل، وهليلج، وشحم الحنظل من كل واحد ثمانية دراهم. ومن الشبرم …"
summary:
