text: "… عليها من يوم أرسل فيها الفحلُ عَشَرَةُ أشهر، وزال عنها اسم تضع أيضًا، يقال: ناقتان عُشَراوانِ، ونوق عِشارٌ و عُشَراواتٌ. يبدلون من همزة التأنيث واوًا، وقد عُشَرَاء أيضًا: قومٌ من بني فَزَارة، وتعشير المصاحف : أصواتٍ في طَلَّقٍ واحد، قال …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 1، ص 772، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 1, p. 772, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الصحاح، جوہری، اسکین جلد 1، ص 772 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Sihah de al-Jawhari, volumen 1, pág. 772, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
