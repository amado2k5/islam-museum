text: |-
  (فصل الوادح
  ⁦(وقذ)⁩
  ٦٧.
  ما اعتادحب سلمى حيز معتاد ولا تقضى بوافى دينها الطادى
  ⁦( وعد)⁩ الوعديستعمل فى انخير والشرتقال الفراءيقال وعدته خيرا ووعد ته شرًا
  قال الشاعر
  ألاعللانى كل حى معلل * ولا تعدانى الشرّ والخير مقبل
  فاذا اسقط وا اشحير والشرقالوا فى انخير الوعد والعدة وفى الشرّ الايعاد والوعيد قال الشاعر
  ع مر بن الطفيل وانى وان أوعدته أووعدته * لخلف ايعادى ومنجزموعدى
  فان أدخلوا الباء فى الشرجاءوابالالف قال الراجز
  أوعدنى بالسجن والاداهم * رجلى ورجلى شتئة المناسم
  تقديره أوعدنى بالسجن وأوعدرجلى بالاداهم ثم قال رجلى شئنة أى قوية على القيد والعدة
  الوعدوالهاءعوض من الواو ويجمع على عدات ولا يجمع الوعد والنسسبة الى عدة عدىّ
  والى زنة زنى فلاتردالواوكماتردها فى شية والفزاءيقول عدوى وزنوى كما
  بقال شيوىّ قال وقول الشاعرزهير
  ان الخليط أجد البين فاغجردوا • وأخلفوكد الامر الذى وعدوا
  أراد عدة الامر فذف الهاءعند الاضافة والمبعاد المواعدة والوقت والموضع وكدلك
  لموعدلان ما كان فاءالذعل منه واوا أو ياءثم سقطتا فى المستقبل نحو يعسدويزن ويهب
  ويضع وينل فان المفعل منه مكسور فى الاسم والمهدرجيعا ولا تبالى منصو با كان يفسعل
  منه أو مكسورابعد أن تكون الواومنه ذاهبة الاأحرفاجاءن نوادر فالواد خلوام وحد
  موحد وفلان بن مورق وموكل اسم رجسل او موضع وموهب اسم رجسل وموزن موضع
  هذ اسماع والقماس فيه الكسرفان كانت الواومن يفعل فيه ثابته فحويو جسل ويوجع
  يوسن ففيه الوجهان فان أردت به المكان والاسم كسرته وان أردت به المصدرنصبة
  قلتموجل وموجسل فان كان مع ذل معتل الاخر فالمفعل منهمنصوب ذهيت الواو
  في ينعل أوثبتت كة ولت المولى والموفى والموعى من يلى ويق ويعى ويقال تواعد القوم أى
  وعديعضه-م بعضاهذا فى اخير وأما فى الشرّ فقال اتعدوا والاتعاد أيضا قبول الوعد
  وأصله الاوتماد قلبوا الواوتاء ثم أدغموا وناس بقولون اتتعد يأتعدفهوم ؤتعدبالهحز
  كما قالوا يأتسرفى ايسارا بزور والتوعد التهددو يوم واعداذا وعد أوله بحراوبرد وأرض
  واعدة اذا رجى خيرها من الديت ووعيدالعمل ديره اذاهم أن يصول ⁦(وغد)⁩ وغدت
  القوم أغدهم أى خدمتهم والوغد الرجل الدنى الذى يخدم بطعام بطنه تقول منه وعد
  الرجسل بالضم والوغد قدح من سهام الميسر لائه يب ه والواعدة فى السير مثل المواضخة قال
  الاصمعى وقد تكون المواغدة للناقسة الوا-دة لان ا-دى يديها ورجليها تواغد الاخرى
  ( وقد وفدفلان على إلامير أى وددر- ولافهو وافد والجمع وفدمثل صاحب وصحب
  وجمع الوفد أوقادروود والاسم الوقادة وأوفدنه أما الى الاصير أى أرساته والوافدمن
  الابل طسبق سارها والايفاد على الشىء الاشراف عابه وقال
  ترى العلاقى عليها. وقدا • كأت برجافوقها مشيدا
  ويقال للقرس ط أحسسن ما وندحاركه أى أشرف والا يقاد أيضا الاسراع وهو فى شهرابئ
