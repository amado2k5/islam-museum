text: "ذَٰلِكَ بِأَنَّهُمْ قَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًا مَّعْدُودَٰتٍ ۖ وَغَرَّهُمْ فِى دِينِهِم مَّا كَانُوا۟ يَفْتَرُونَ"
text_search: "ذلك بأنهم قالوا لن تمسنا النار إلا أياما معدودات ۖ وغرهم في دينهم ما كانوا يفترون"
translations:
  en: { text: "That is because they say: The Fire will not touch us save for a certain number of days. That which they used to invent hath deceived them regarding their religion.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "یہ اس لیے کہ یہ اس بات کے قائل ہیں کہ (دوزخ کی) آگ ہمیں چند روز کے سوا چھو ہی نہیں سکے گی اور جو کچھ یہ دین کے بارے میں بہتان باندھتے رہے ہیں اس نے ان کو دھوکے میں ڈال رکھا ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
