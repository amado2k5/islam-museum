  وأعوذبك رب أن يحضرون أى أن تصيبى الشياطين!-و، وقوم حضور أى حاضرون وهو
  فى الاصل مصدر وحضور بالنتح :ادباليمن وقال غامد
  تغمدت شرا كان بين عشيرتى * فأسمانى القيل المضورى غامدا
  وحضردوت اسم بلدوقبيلة أيضا وهمااسمان جعلا واح_داوان شئت ببيت الاسم الأول
  عسلى الفتح وأعربت الشانى اعراب مالا ينصرف فقلت هذا حضرموت وان شئت أضفت
  الأوّل الى الشانى فقات هذا حضرموت أعربت حضرا وخفضت مو تاوكذلك القول
  فى سام أبرص ورام(هرمن والنسبة اليه حضر مىّ والتصغير حضيرموت تصغر الصدر منهما
  وكذلك المع يقال فلان من الحضارمة ⁦(حضجر)⁩ حضاجر الضبع سميت بذلا لعظم بطنها
  وهومعرفة قال الحطبئة
  هلاغضبت (حل جا رك اذ تنبذه حضاجر
  ولا يتصرف فى معرفة ولا نكرة لانه اسم لواحد على بنية الجمع لانهم يقولون وطب حضجر
  وأوطب حضاجر حفار الحظر الحجروهوخلاف الاباحسة والمحظور المحرّم والحطار
  الحظيرة تعمل للابل من شعر اتقيها الريح والبرد والحتظار الذى يعمل الحظيرة وقرئ كهشيم
  المتظر فن كسرهجعله الفاعل ومن فتحه جعله المفعول به ويقال للرجل القليل الخيرانه لنسكد
  الحظيرة قال أبو عبيد أراه سمى أمواله حظيرة لانه حظرها عفده ومفعها وهى فعيلة بمعنى
  مفعولة ⁦(-قر)⁩ حفرت الارض واحتفرمما والحفرة واحدة الحفر واستحفر النهر
  حان له أن يحفر والحفر بالتحريك التراب يستخرج من الحفرة وهو مثل الهدم ويقال هو
  المكان الذى حفر وينشد
  قالوا انتهينا وهذاالخندق الحفر والحافر واحد حوافر
  الدابة وقد استعاره الشاءرفى القدم فقال
  فابرح الولدان حتى رأيته * على البكر يمربه بساق وحاذر
  وقواهم فى المثل النقد عند الحافرة قال يعوب أى عند أوّل كلمة ويقال التقى القوم
  فاقتتلوا عند الحافرة أى عند أوّل ما التقوا وقوله تعالى أثنا لمردودون فى الحافرة اى
  فى أول أمرنا وأنشدابن الاعرابى أحافرة على صلع وشيب * معاذالله من سفه وعاد
  بقول أأرجع الى ما كنت عليه فى شبابي من الجهل والصبابع_دان شبت وطلعت ويقال
  رجع على حافرته أى فى الطريق الذى جاءمنه والحفير القبروحة ره حفراهزله يقال ماحامل
  الاوالحمل يحفرها الا الناقة فانم تسعن عليه وتقول فى أسنانه حفروقد حفرت تحذر حفرا
  مثال كسريكسر كسرا اذافسدت أمولها قال يعقوب هو سلاق فى أصول الاسنان
  قال ويقال أصبح فم فلان محفورا وبنو أسد تقول فى أسنانه حر بالتحريك وقد حفرت حفرا
  مثال تعبت تعبا وهى أردأ اللغتيز وأحذر المهر للاثناء والارباع والروح اذا ذهبت رواضعه
