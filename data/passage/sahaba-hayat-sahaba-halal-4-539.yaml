text: "… فقال على: تشدتكم اللّه انه لصدق من قلوبكم، قالوا : نعم، فقال: اللهم إنى أشهدك اللهم إنى أقول فيه مثل ما قالوا أو أفضل! وزاد فى رواية أخرى عنه: قرأ القرآن فأحل حلاله وحرم حرامه، فقيه فى الدين عالم بالسنة. …"
