label: { ar: "جامع الترمذي 1118 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 1118 — what was made lawful; what is not lawful", ur: "جامع ترمذی 1118 — جو حلال کیا گیا، جو حلال نہیں" }
text: "… وَفِي الْبَابِ عَنِ ابْنِ عُمَرَ وَأَنَسٍ وَالرُّمَيْصَاءِ أَوِ الْغُمَيْصَاءِ وَأَبِي هُرَيْرَةَ. قَالَ أَبُو عِيسَى حَدِيثُ عَائِشَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ عَامَّةِ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ أَنَّ الرَّجُلَ إِذَا طَلَّقَ امْرَأَتَهُ ثَلاَثًا فَتَزَوَّجَتْ زَوْجًا غَيْرَهُ فَطَلَّقَهَا قَبْلَ أَنْ يَدْخُلَ بِهَا أَنَّهَا لاَ تَحِلُّ لِلزَّوْجِ الأَوَّلِ إِذَا لَمْ يَكُنْ جَامَعَ الزَّوْجُ الآخَرُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1118، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1118 (The Book on Marriage), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1118، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
