label: { ar: "صحيح البخاري 4615 — ما أُحل، ما حُرّم", en: "Sahih al-Bukhari 4615 — what was made lawful; what was made unlawful", ur: "صحیح بخاری 4615 — جو حلال کیا گیا، جو حرام کیا گیا" }
text: "حَدَّثَنَا عَمْرُو بْنُ عَوْنٍ، حَدَّثَنَا خَالِدٌ، عَنْ إِسْمَاعِيلَ، عَنْ قَيْسٍ، عَنْ عَبْدِ اللَّهِ، قَالَ كُنَّا نَغْزُو مَعَ النَّبِيِّ وَلَيْسَ مَعَنَا نِسَاءٌ فَقُلْنَا أَلاَ نَخْتَصِي فَنَهَانَا عَنْ ذَلِكَ، فَرَخَّصَ لَنَا بَعْدَ ذَلِكَ أَنْ نَتَزَوَّجَ الْمَرْأَةَ بِالثَّوْبِ، ثُمَّ قَرَأَ {يَا أَيُّهَا الَّذِينَ آمَنُوا لاَ تُحَرِّمُوا طَيِّبَاتِ مَا أَحَلَّ اللَّهُ لَكُمْ }"
summary:
  ar: "حديث في صحيح البخاري، رقم 4615، يذكر ما أُحل، وما حُرّم، والطيبات، والرخصة. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 4615 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions what was made lawful, what was made unlawful, the good things, the concession. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 4615، جس میں جو حلال کیا گیا، جو حرام کیا گیا، پاکیزہ چیزیں، رخصت کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
