text: |-
  (ذعلق /
  ويأ كل الحية والحيوتا • ويدمق الاقفال والتابوتا
  ويختق الحهجوز أوت ونا • أو تخرج الماقوط والملتونا
  والدمق بالته ريك ثلج وربيح فارسى معرب ⁦(دمشق)⁩ ناقة دمنق أى سر يعة جدا
  قال الزفيات ومنهن طام عليه الغلفق • يير أويسدى به الجدرتق
  وردنه والليل داج أبلق • وصاحع ذات هيراب دمشق
  • كأنم ابعد الكلال زورق •
  وكدّلك ناقة دمشق مثال حتير ودمشق أيضاقصبة الشأم ملق المفطلق من
  الجرومن الحافر الاملس المدور مثل المدملا والمدملج قال رؤية
  بكل موقوع النسور أخلقا • لأم يدف الخر المدملفل
  وكذلك الحافر وقال
  وحافر صلب العجى مدملق * وسناق هيق أنفها معرَقُ.
  ⁦( دنق)⁩ الدائق والدائق سدس الدرهم وريعا فالو اللهانق دائاق كما قالو اللدرهم درهام
  والدائق أيضا المهزول الساقط وأنشد أبو عرد
  ان ذوات الدل والذائق• قتلى كل وامق وعاشق • حتى زاء كالسليم الدائق
  والمداق المستقصى قال الحسن لا تدأة واقيدتق عايكم والتدئيق مثل التريق وهوادامة
  النفار الى الشي يقال دئق اليه التفاروراق وكذلك النظار الصُعيف وتديرف اشمير للغروب
  دنوها وتدنيق العين عُؤورها (دوق الدوق بااضم الموق والحهق بقال أحق مائق
  دائق وقد داق بدوق دوفاود ووقاودواقة ⁦(دهق)⁩ أدهقت الكاس ملاتهاركاس
  دهاق أى عمتلمة قال خداش بن زهير
  أتانا عامى يرجوة رانا * فأثر عناله كأسادهاقا
  وادهقت الماء أى أفرعته افراغانديدا قال أبو عمر والدهق بالمعريك ضرب من العسذاب
  وهو بالفارسية اشكنيه قال ابن الاعراية دهقت الشئ كسرته وقطعته وكذلك دهدقته
  وأنشد لبرين خالد
  ندهدق يضع اللحم للباع والتدى • وبعضهم تعلى بدم مر اجلد
  ودهمقته ريادة الميم مثله وقال الاصممىّ الدهمة امن الطعام وطيه ورقسه وكدُلا
  كل شلن قال وأنشدئى خلف الاحرق ن=ت أرض • جون ووابى تريه دهامق *
  ومنه حديت عررضى اللّٰه عنه لوشقت أن يدهمق لى لفعلت والكنّ اللّه عاب قوما فقال أذهبتم
  طيباتكم فى حداتكم الدنينا واستمتعثم بها
  حتى اذا ماهاج حيران الذرق• وأذرقت الارض أنيتته وذرق الطائوخرؤه وقد ذرق يدرق
  ويذرق أى زرق وقال حان ين ثابت لما سأه عمررضى اللّٰه عنه عن هزاء الحطيضة الزبرقات
  بقوله دع المكارم لاترحل ابغيتها • واقعد فانك أنت الطاعم السكامى
  ماهماه بل ذرق عليه وسكى أبو زيدلين مذرق أى مذيق ⁦(ذعلق)⁩.
  الذعلوق تُبت
  قرل ضرب من العذاب سة
  صاحب القاموس بأنه خشبتات
  بغمزيم مإالساق اه مصحمه
  قوله مراجله فى نُسطة مناقعه
  ورواه المصنف فى مادة بوع
  مناقعه والمناقع والمراجل
  القدور ام مصعه
