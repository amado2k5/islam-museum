label: { ar: "سنن أبي داود 2673 — الأب والأبوة", en: "Sunan Abi Dawud 2673 — the father and fatherhood", ur: "سنن ابی داؤد 2673 — باپ اور والدیت" }
text: "… سَعِيدُ بْنُ مَنْصُورٍ، حَدَّثَنَا مُغِيرَةُ بْنُ عَبْدِ الرَّحْمَنِ الْحِزَامِيُّ، عَنْ أَبِي الزِّنَادِ، حَدَّثَنِي مُحَمَّدُ بْنُ حَمْزَةَ الأَسْلَمِيُّ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ أَمَّرَهُ عَلَى سَرِيَّةٍ قَالَ فَخَرَجْتُ فِيهَا وَقَالَ \" إِنْ وَجَدْتُمْ فُلاَنًا فَاحْرِقُوهُ بِالنَّارِ \". فَوَلَّيْتُ فَنَادَانِي فَرَجَعْتُ إِلَيْهِ فَقَالَ \" إِنْ وَجَدْتُمْ فُلاَنًا فَاقْتُلُوهُ وَلاَ تُحْرِقُوهُ فَإِنَّهُ لاَ يُعَذِّبُ بِالنَّارِ إِلاَّ رَبُّ النَّارِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2673، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2673 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2673، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
