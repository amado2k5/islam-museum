label: { ar: "سنن أبي داود 2673 — الأب والأبوة", en: "Sunan Abi Dawud 2673 — the father and fatherhood", ur: "سنن ابی داؤد 2673 — باپ اور والدیت", es: "Sunan Abi Dawud 2673 — El padre y la paternidad", fr: "Sunan Abi Dawud 2673 — le père et la paternité", tr: "Sunan Abi Davud 2673 — Baba ve Babalık", id: "Sunan Abi Dawud 2673 — Sang Ayah dan Peran Ayah" }
text: "… سَعِيدُ بْنُ مَنْصُورٍ، حَدَّثَنَا مُغِيرَةُ بْنُ عَبْدِ الرَّحْمَنِ الْحِزَامِيُّ، عَنْ أَبِي الزِّنَادِ، حَدَّثَنِي مُحَمَّدُ بْنُ حَمْزَةَ الأَسْلَمِيُّ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ أَمَّرَهُ عَلَى سَرِيَّةٍ قَالَ فَخَرَجْتُ فِيهَا وَقَالَ \" إِنْ وَجَدْتُمْ فُلاَنًا فَاحْرِقُوهُ بِالنَّارِ \". فَوَلَّيْتُ فَنَادَانِي فَرَجَعْتُ إِلَيْهِ فَقَالَ \" إِنْ وَجَدْتُمْ فُلاَنًا فَاقْتُلُوهُ وَلاَ تُحْرِقُوهُ فَإِنَّهُ لاَ يُعَذِّبُ بِالنَّارِ إِلاَّ رَبُّ النَّارِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2673، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2673 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2673، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2673 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2673 (Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 2673 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2673, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
