text: "ثُمَّ إِنَّ رَبَّكَ لِلَّذِينَ هَاجَرُوا۟ مِنۢ بَعْدِ مَا فُتِنُوا۟ ثُمَّ جَـٰهَدُوا۟ وَصَبَرُوٓا۟ إِنَّ رَبَّكَ مِنۢ بَعْدِهَا لَغَفُورٌ رَّحِيمٌ"
text_search: "ثم إن ربك للذين هاجروا من بعد ما فتنوا ثم جاهدوا وصبروا إن ربك من بعدها لغفور رحيم"
translations:
  en: { text: "Then lo! thy Lord - for those who became fugitives after they had been persecuted, and then fought and were steadfast - lo! thy Lord afterward is (for them) indeed Forgiving, Merciful.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "پھر جن لوگوں نے ایذائیں اٹھانے کے بعد ترک وطن کیا۔ پھر جہاد کئے اور ثابت قدم رہے تمہارا پروردگار ان کو بےشک ان (آزمائشوں) کے بعد بخشنے والا (اور ان پر) رحمت کرنے والا ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
