text: |-
  ⁦(قيد )⁩
  ٢٥٥
  معرّب قال ابن دريدهو خريطة العطار (قلد القلادة التى فى العنق وقلدت المرأة
  فتقلدت هى ومنه التقليد فى الدين وتقليد الولاة الاعمال وتقليد البدنة أن يعلق فى عنقها
  شى ليعلم أنها هدى ويقال تقلدت السيف وقال الشاعر
  بالبت زوحك قد غدا • متقلد اسيفاورمما
  أى وحاملارما
  وهذا كفول الآخر
  علفتها تيناوما باردا • -تى شتت همالة عيناها
  أى و-فيتها ماء باردا
  ومقلد الرجل موضع نجاد السيف ءلى منكبه والمقلد من الخيل السابق ية لدشيئا
  ليعرف أنه قد سبق وقلدت الحبل أقلده قلدا أى فتلته والحبل قليد ومة_لود والقلد أيضا
  السوار المفتول من فضة والقلد بالكسريوم تأتى فيه الربع ومفه سميت قوافل جدة
  الى مكة قلدا وسقتنا السماه قلمدافى كل أسبوع أى مطرتنالوقت والقلدة القشدة
  والاقليد المفتاح والمقلد. فتاح كامنجل ربما يقلد بد الكلا كما يقلد القت اذا جعل حبالا
  أى يفتل والجمع المقاليد وأقلد البر على خلق كثير أى غزقهم كأنه أغلق عليه-م د
  القمد القوى الشديد والاترة واقهد البعيراهداد ارفع رأسه بزيادة الهاء ⁦( ند)⁩
  القند عسل قصب السكر يقال سويق مقنود ومقند والققديد انلهر قال الاصمعى هو مثل
  الاسفنط وهو عصير يطبخ ويجعل فيه أفواه من الطيب وليس بخمر الكسائى رجل قدد أوة على
  فعلاوة أى خقيف وقال الفتراء هى من النوق الجريشة وقال أبومالك فاقة قند أوة ويحل
  قندأ وأى سريع وقدوم قند أوة أى حادّة وغسيره يقول فند أوة بالفاء ⁦(قهد)⁩ القهد مذ.ل
  القهب وهو الاييض الأكدر قال لبيد
  لمعفرقهد تنازع شلوه • غبس كواسب لا يمن طعامها
  والقهاداسم موضع ⁦(قود )⁩، قدت الفرس وغيره أقوده قوداومقادة وقيدودة وأرس
  فؤود سلس منادواقتاده وقاده بعنى وقوّده شدّد للكثرة والقود الخيل بقال مربناقود
  وأقسدتك خيلا أى أعطيتك خيلاتة ودها والانقياد الخضوع تقول قدته فانقادلى
  واستقادلى أذا أعطالك مقادته والقود القصاص وأقدت القائل بالقسيل أى قتاقه به بقال
  أقاده السلطان من أخبه واستقدت الحاكم أى-ألته أن يقيد القائل بالتتيل والمقود.
  لحبل يشد فى الزمام أو اللجام تقاديه الداية والقائد واحدالقوّاد والقادة وفرس أقود
  بين القود أى طويل الظهر والعنق وناقة قوداء وخيل قبقود والقياديد الطوال من الإتى
  واحد تها فيدود قال ذوالرمة
  راحت يقحمهاذوأرمل وسقت • له الفرائس والفب القياديد
  والقوداء الثنية الطوبلة فى السماء والجبل أقود والاود من الرجال الشديد العنق"سمى
  بذلك لقلة التفاته ومنه قبل للبخيل على الزاد أقود لانه لا يتلفت عند الاكل لتلايرى انسسانا
  فيصاج أن يدعوه (في-د القبد واحد القيود وقد قيدت الدابة وقيدت الكتاب شكاته
  وهؤلا أجال مقاييد أى مقيدات ويقال للفرس الجوادقد الاوابدلانه ينع الوحسْ من
  الفوات لسرعته قال امر والقيس.
  بمنجردقيد الاوابدهيكل وفيداسم فرس
