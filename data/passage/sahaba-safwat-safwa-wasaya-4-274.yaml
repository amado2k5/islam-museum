text: "… أبي هريرة أنه كان له خيط فيه ألفا عقدة فلا ينام حتى يسبح به. وعن محمد بن سيرين، عن أبي هريرة قال: لقد رأيتني أصرع بين منبر رسول اللّٰه ينية وبين حجرة عائشة، فيقول الناس: إنه لمجنون، وما بي جنون، …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 274، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 274, that mentions a relic kept after its owner, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 274 کا اقتباس جس میں محفوظ آثار و تبرکات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
