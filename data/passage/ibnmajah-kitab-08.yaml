summary:
  ar: "القسم 8 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزكاة»، ويضم فيها النصوص من 1783 إلى 1844 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 8 of Sunan Ibn Majah (The Chapters Regarding Zakat) in the division of the open hadith dataset the museum took its reports from: reports 1783 to 1844 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 8، عنوان «کتاب الزکاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1783 تا 1844۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 8 de Sunan Ibn Majah (Los capítulos sobre el Zakat) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1783 al 1844, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
