text: "… وكذّبوه، اللهمّ وإن كنتَ وضعتَ الحرب بيننا، فاجعله لي شهاد، ولا تَمِتني حتى تقرّ عيني من بني قرَيْظة. وكانوا حلفاءه ومواليه في الجاهليّة. وقيل إنّ الذي رمى سعداً هو أبو أُسامة الجُشَميّ حليف بني مخزوم. فلمّا قال سعد ما قال …"
