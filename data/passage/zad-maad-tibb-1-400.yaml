text: "… إلى النبي وَلِ ثُوبَيْنِ ليكفِّن فيهما حمزة، فكفَّته في أحدهما، وكفِّن في الآخر رجلاً آخر حسن: أحمد:. قيل : حمزةُ، كان الكفارُ قد سلبوه، ومثْلُوا به، وبقَرُوا عن بَطنِه، واستخرجوا كَبدَه، فَلِذْلِكَ كُفِّنَ في كَفَنٍ آخر. وهذا القولُ في الضعف …"
