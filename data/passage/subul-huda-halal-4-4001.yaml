  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 4. cildinin 4001. sayfasından, izin verilmeyen, yasaklanan ve haram olan şeylerden bahseden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
