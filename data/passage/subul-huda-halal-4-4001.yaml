text: "… والجمع مسك ومسوك. فى محيح مسلم بشرح النووى كتاب الأشربة : : عن ابن بريدة عن أبيه أن رسول اللّٰه قال : نهيتكم عن الظروف وإن الظروق أو ظرفاً لا يحل شيئاً ولا يحرمه وكل مسكر حرام. وعن ابن بريدة …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 4001، يذكر ما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 4001, that mentions what is not lawful, the unlawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 4001 کا اقتباس جس میں جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
