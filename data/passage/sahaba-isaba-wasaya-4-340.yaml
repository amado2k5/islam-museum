text: "… رأيتك حيث أتيت رسول الله وَيِيم فلسمت فرد عليك لقد رأيتنا ونحن متوافر، وما فينا شاب هو أملك لنفسه من عبد الله بن عمر ابن مسعود لقد رأيتنى أُصرع بين منبر رسول اللّٰه لاِخِ و حجرة عائشة أبو هريرة عتبة …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 4، ص 340، يذكر أثر من الآثار المحفوظة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
