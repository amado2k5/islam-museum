text: "… ليس لي ست أصابع كان يأكل بأصابعه الخمس، فرآه أحدهم فأعترضهُ قائلاً : لماذا تأكل بأصابعك الخمس أمام الناس؟ فأجابه جحا : لأنَّه لم يكن لي سِتُّ أصابع. العمل لا يوافق النظر كان في بلدةٍ آقَ شَهْرْ حاكِمٌ شره بالمآكل، …"
summary:
  ar: "سُئل جحا لماذا يأكل بأصابعه الخمس أمام الناس، فقال إنه ليست له ست أصابع. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  en: "Asked why he eats with his five fingers in public, Juha says he does not have six. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  ur: "جحا سے پوچھا جاتا ہے کہ وہ لوگوں کے سامنے پانچوں انگلیوں سے کیوں کھاتا ہے، تو وہ کہتا ہے کہ اس کی چھ انگلیاں نہیں ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  fr: "Interrogé sur la raison pour laquelle il mange avec ses cinq doigts en public, Juha répond qu'il n'en a pas six. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
  es: "Al preguntarle por qué come con los cinco dedos en público, Juha dice que no tiene seis. {cite:juha-nawadir-kubra-djuwaydi p. 142}"
