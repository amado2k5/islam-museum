label: { ar: "الموطأ 2562 — مالك: من قُتل أو فُقئت عينه قبل القصاص لا دية ولا قصاص لورثته", en: "Muwatta 2562", es: "Muwatta 2562", fr: "Muwatta 2562", ur: "موطا 2562", tr: "Al-Muwatta 2562 — Malik: Kim misilleme yapılmadan önce öldürülür veya gözü oyulursa, mirasçıları için kan parası veya misilleme yoktur.", id: "Al-Muwatta 2562 — Malik: Barangsiapa yang terbunuh atau matanya dicongkel sebelum pembalasan, maka tidak ada ganti rugi darah atau pembalasan bagi ahli warisnya." }
summary:
  ar: "قال مالك في الرجل يقتل الرجل عمدا أو يفقأ عينه عمدا، فيُقتل القاتل أو تُفقأ عين الفاقئ قبل أن يُقتص منه: أنه ليس عليه دية ولا قصاص؛ لأن حق الذي قُتل أو فُقئت عينه في الشيء الذي ذهب، فإنما يكون له القصاص على صاحبه الذي قتله، فإذا هلك قاتله فليس له قصاص ولا دية، استدلالا بآية البقرة في القصاص. {cite:muwatta-maruf-1997 p.446} {cite:muwatta-maruf-1997 p.447}"
  tr: "Malik, bir başkasını kasten öldüren veya kör eden ve intikam alınmadan önce katilin öldürülmesi veya kör edilmesi durumunda şöyle demiştir: Öldürülen veya kör edilen kişinin hakkı, kaybettiği şeydedir ve yalnızca kendisini öldüren kişiden intikam alma hakkına sahiptir. Katili ölürse, Bakara Suresi'ndeki intikam ayetine göre intikam veya kan parası alma hakkı yoktur. {cite:muwatta-maruf-1997 s.446} {cite:muwatta-maruf-1997 s.447}"
  id: "Malik berkata mengenai seorang pria yang dengan sengaja membunuh pria lain atau dengan sengaja membutakannya, dan si pembunuh kemudian terbunuh atau dibutakan sebelum pembalasan dilakukan terhadapnya: Ia tidak wajib membayar uang darah atau pembalasan; karena hak orang yang terbunuh atau dibutakan adalah pada harta yang hilang, dan ia hanya berhak membalas dendam kepada orang yang membunuhnya. Jika pembunuhnya meninggal, ia tidak berhak membalas dendam atau membayar uang darah, berdasarkan ayat dalam Surah Al-Baqarah mengenai pembalasan. {cite:muwatta-maruf-1997 p.446} {cite:muwatta-maruf-1997 p.447}"
