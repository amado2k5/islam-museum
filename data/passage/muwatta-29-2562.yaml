label: { ar: "الموطأ 2562 — مالك: من قُتل أو فُقئت عينه قبل القصاص لا دية ولا قصاص لورثته", en: "Muwatta 2562" }
summary:
  ar: "قال مالك في الرجل يقتل الرجل عمدا أو يفقأ عينه عمدا، فيُقتل القاتل أو تُفقأ عين الفاقئ قبل أن يُقتص منه: أنه ليس عليه دية ولا قصاص؛ لأن حق الذي قُتل أو فُقئت عينه في الشيء الذي ذهب، فإنما يكون له القصاص على صاحبه الذي قتله، فإذا هلك قاتله فليس له قصاص ولا دية، استدلالا بآية البقرة في القصاص. {cite:muwatta-maruf-1997 p.446} {cite:muwatta-maruf-1997 p.447}"
