text: "… الواجبة، وهذا مجمع عليه. قال العلماء في القسم الأول الذي يُستر فيه: هذا الستر مندوبٌ، فلو رقعه إلى السلطان ونحوه لم يأثم بالإجماع، لكن هذا خلاف الأولى، وقد يكون في بعض صوره ما هو مكروه، والله أعلم. قوله يا: إن …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 3، ص 47، يرد فيه ذكر الواجب، والمندوب، والمكروه، والكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
