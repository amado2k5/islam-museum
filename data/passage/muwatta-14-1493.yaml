label: { ar: "الموطأ 1493 — نافع بن جبير عن ابن عباس: الأيم أحق بنفسها من وليها، والبكر تستأذن في نفسها، وإذنها صماتها", en: "Muwatta 1493" }
text: "الأَيُمُ أحَقُّ نَفْسها مِن وَلِيُّها. وَالْبِكْرُ تُسْتأُذَنُ في نَفْسها، وَإذْنُها صُمَاتُها"
summary:
  ar: "يروي مالك عن عبد الله بن الفضل عن نافع بن جبير بن مطعم عن عبد الله بن عباس أن رسول الله قال الأيم أحق بنفسها من وليها، والبكر تستأذن في نفسها، وإذنها صماتها. {cite:muwatta-maruf-1997 p.28}"
