label: { ar: "صحيح البخاري 5996 — أمامة على عاتقه في الصلاة", en: "Sahih al-Bukhari 5996 — Umama on his shoulder in the prayer", ur: "صحیح بخاری 5996 — نماز میں امامہ اس کے کندھے پر" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا اللَّيْثُ، حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ، حَدَّثَنَا عَمْرُو بْنُ سُلَيْمٍ، حَدَّثَنَا أَبُو قَتَادَةَ، قَالَ خَرَجَ عَلَيْنَا النَّبِيُّ صلى الله عليه وسلم وَأُمَامَةُ بِنْتُ أَبِي الْعَاصِ عَلَى عَاتِقِهِ، فَصَلَّى فَإِذَا رَكَعَ وَضَعَهَا، وَإِذَا رَفَعَ رَفَعَهَا‏.‏"
summary:
  ar: "عن أبي قتادة: خرج النبي وأمامة بنت أبي العاص على عاتقه فصلى، إذا ركع وضعها وإذا رفع رفعها."
  en: "From Abu Qatada: the Prophet came out with Umama bint Abi al-As — his granddaughter — on his shoulder and prayed, setting her down in the bowing and lifting her when he rose."
  ur: "ابو قتادہ سے: نبی امامہ بنت ابی العاص — اپنی نواسی — کو کندھے پر لے کر آئے اور نماز پڑھی، رکوع میں اتارا اور اٹھتے ہوئے اٹھایا۔"
