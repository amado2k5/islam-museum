label: { ar: "صحيح البخاري 5996 — تربية الأب ووصيته", en: "Sahih al-Bukhari 5996 — the father raising and counselling", ur: "صحیح بخاری 5996 — باپ کی تربیت اور نصیحت", es: "Sahih al-Bukhari 5996 — La crianza y el consejo del padre", fr: "Sahih al-Bukhari 5996 — L'éducation et les conseils du père", tr: "Sahih el-Buhari 5996 — Babanın Terbiyesi ve Vasiyeti", id: "Sahih al-Bukhari 5996 — Didikan dan Wasiat Ayah" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا اللَّيْثُ، حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ، حَدَّثَنَا عَمْرُو بْنُ سُلَيْمٍ، حَدَّثَنَا أَبُو قَتَادَةَ، قَالَ خَرَجَ عَلَيْنَا النَّبِيُّ وَأُمَامَةُ بِنْتُ أَبِي الْعَاصِ عَلَى عَاتِقِهِ، فَصَلَّى فَإِذَا رَكَعَ وَضَعَهَا، وَإِذَا رَفَعَ رَفَعَهَا."
summary:
  ar: "حديث في صحيح البخاري، رقم 5996، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5996 (Good Manners and Form (Al-Adab)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5996، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 5996 (Buenas costumbres y modales (Al-Adab)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5996 (Les bonnes manières et la bienséance), mentionne le rôle du père dans l'éducation et les conseils. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'de 5996 numaralı hadis, babanın yetiştirilmesi ve öğütlerinden bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle derler."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5996, menyebutkan tentang didikan dan nasihat seorang ayah. Situs web \"Kebapakan dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
