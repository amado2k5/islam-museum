label: { ar: "الموطأ 1939 — مالك: في رجل اشترى من رجل سلعة بدينار نقدا، أو بشاة موصوفة إلى أجل، قد وجب عليه البيع بأحد الثمنين، أن ذلك مكروه، لأن النبي نهى عن بيعتين في بيعة", en: "Muwatta 1939", es: "Muwatta 1939", fr: "Muwatta 1939", ur: "موطا 1939", tr: "El-Muvatta 1939 — Malik: Bir kimse, başka bir kimseden bir dinar karşılığında nakit olarak mal alır veya bir koyunu kredili olarak satarsa ve bu iki fiyattan birinden satmakla yükümlüyse, bu mekruhtur; çünkü Peygamberimiz bir işlemde iki satış yapılmasını yasaklamıştır.", id: "Al-Muwatta 1939 — Malik: Mengenai seorang pria yang membeli barang dari pria lain dengan satu dinar secara tunai, atau dengan seekor domba yang disebutkan secara kredit, dan dia wajib menjualnya dengan salah satu dari dua harga tersebut, ini adalah perbuatan yang tidak disukai, karena Nabi melarang dua penjualan dalam satu transaksi." }
summary:
  ar: "قال مالك في رجل اشترى من رجل سلعة بدينار نقدا، أو بشاة موصوفة إلى أجل، قد وجب عليه البيع بأحد الثمنين: إن ذلك مكروه لا ينبغي؛ لأن رسول الله نهى عن بيعتين في بيعة، وهذا من بيعتين في بيعة. {cite:muwatta-maruf-1997 p.193}"
  tr: "Malik, bir başkasından bir dinar karşılığında nakit olarak mal alan veya vasiyetle bir koyun satın alan ve bu iki fiyattan birinden satmakla yükümlü olan bir adam hakkında şöyle demiştir: Bu mekruhtur ve yapılmamalıdır, çünkü Allah'ın Resulü bir işlemde iki satış yapmayı yasaklamıştır ve bu, bir işlemde iki satış demektir. {cite:muwatta-maruf-1997 s.193}"
  id: "Malik berkata mengenai seorang pria yang membeli barang dari pria lain dengan satu dinar secara tunai, atau dengan seekor domba secara kredit, dan yang wajib menjualnya dengan salah satu dari dua harga tersebut: Hal ini tidak disukai dan tidak boleh dilakukan, karena Rasulullah melarang dua penjualan dalam satu transaksi, dan ini adalah dua penjualan dalam satu transaksi. {cite:muwatta-maruf-1997 p.193}"
