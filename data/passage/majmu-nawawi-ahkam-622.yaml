text: "… الطواف واجبتان لم تسقط بفعل فريضة ولا غيرها كما لا تسقط صلاة الظهر بفعل العصر فرع إذا قلنا : صلاة الطواف سنة جاز فعلها قاعدا مع القدرة على القيام كسائر النوافل فرع يستحب أن يقرا فى هاتين الركعتين بعد الفاتحة …"
summary:
  ar: "مقطع من المجموع للنووي، ص 622، يرد فيه ذكر الفريضة والفرائض، والواجب، والمستحب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 622, whose wording mentions the obligation (farida), the obligatory (wajib), the recommended (mustahabb), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 622 کا اقتباس جس میں فریضہ اور فرائض، واجب، مستحب، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 622, dont le texte mentionne l'obligation (farida), l'obligatoire (wajib), le recommandé (mustahabb), le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Majmu' de al-Nawawi, p. 622, cuyo texto menciona la obligación (farida), lo obligatorio (wajib), lo recomendado (mustahabb), lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Nevevi'nin Mecmu'sundan, 622. sayfadan, farz, müstehap, nafile ve gönüllülük esaslarını ele alan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Farz, itaat, müstehap, mekruh, haram ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Majmu' karya al-Nawawi, hlm. 622, yang menyebutkan amalan wajib, amalan anjuran, amalan sunnah, dan amalan sukarela; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
