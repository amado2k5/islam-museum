  en: "Riyad al-Salihin 1588 — Three whom God will not address on the Day of Resurrection"
text: "ثَلاَثَةٌ لاَ يُكَلِّمُهُمُ اللَّهُ يَوْمَ الْقِيَامَةِ، وَلاَ يَنْظُرُ إِلَيْهِمْ، وَلاَ يُزَكِّيهِمْ، وَلَهُمْ عَذَابٌ أَلِيمٌ». قَالَ: فَقَرَأَهَا رَسُولُ اللَّهِ ثَلاَثَ مِرَارٍ. قَالَ أَبُو ذَرٍّ: خَابُوا وَخَسِرُوا، مَنْ هُمْ يَا رَسُولَ اللَّهِ؟ قَالَ: «الْمُسْبِلُ، وَالْمَنَّانُ، وَالْمُنَفِّقُ سِلْعَتَهُ بِالْحَلِفِ الْكَاذِبِ»."
summary:
  ar: "حديث في رياض الصالحين للنووي، في باب «كتاب الأمور المنهي عنها»، من نسخة hadithunlocked المستخرجة؛ النص مقتبس بحدود أربعين كلمة."
  en: "A hadith in al-Nawawi's Riyad al-Salihin, in the chapter «كتاب الأمور المنهي عنها», excerpted within forty words."
