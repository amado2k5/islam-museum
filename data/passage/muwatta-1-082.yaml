label: { ar: "الموطأ 82 — أنس يتوضأ بقباء ويمسح على الخفين", en: "Muwatta 82" }
summary:
  ar: "أثر يرويه مالك عن سعيد بن عبد الرحمن بن رقيش، في باب ما جاء في المسح على الخفين: رأى أنس بن مالك أتى قباء فبال ثم أُتي بماء فتوضأ، فغسل وجهه ويديه إلى المرفقين ومسح برأسه ومسح على الخفين، ثم جاء المسجد فصلى. ويذكر المحقق أن عبد الرزاق وابن أبي شيبة روياه من طريق عاصم الأحول عن أنس. {cite:muwatta-maruf-1997 p.78}"
