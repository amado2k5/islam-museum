label: { ar: "الموطأ 82 — أنس يتوضأ بقباء ويمسح على الخفين", en: "Muwatta 82", es: "Muwatta 82", fr: "Muwatta 82", ur: "موطا 82", tr: "Al-Muwatta 82 — Enes Kuba'da abdest alıyor ve çoraplarına siliyor.", id: "Al-Muwatta 82 — Anas berwudhu di Quba dan mengusap kaus kakinya" }
summary:
  ar: "أثر يرويه مالك عن سعيد بن عبد الرحمن بن رقيش، في باب ما جاء في المسح على الخفين: رأى أنس بن مالك أتى قباء فبال ثم أُتي بماء فتوضأ، فغسل وجهه ويديه إلى المرفقين ومسح برأسه ومسح على الخفين، ثم جاء المسجد فصلى. ويذكر المحقق أن عبد الرزاق وابن أبي شيبة روياه من طريق عاصم الأحول عن أنس. {cite:muwatta-maruf-1997 p.78}"
  tr: "Malik'in, Sa'id ibn 'Abd al-Rahman ibn Ruqaysh'tan rivayet ettiği, çorapların üzerinden silme bölümündeki bir rivayete göre: Enes ibn Malik Kuba'ya gitti ve idrarını yaptı. Sonra kendisine su getirildi ve abdest aldı; yüzünü ve dirseklerine kadar ellerini yıkadı, başını sildi ve çoraplarının üzerinden sildi. Sonra mescide gitti ve namaz kıldı. Editör, bu rivayetin Abd al-Razzaq ve İbn Abi Şeybe tarafından Enes'ten rivayet edilen 'Asim al-Ahwal aracılığıyla aktarıldığını belirtiyor. {cite:muwatta-maruf-1997 s.78}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Sa'id ibn 'Abd al-Rahman ibn Ruqaysh, dalam bab tentang mengusap kaus kaki: Anas ibn Malik pergi ke Quba' dan buang air kecil. Kemudian air dibawa kepadanya, dan dia berwudhu, mencuci muka dan tangannya sampai siku, mengusap kepalanya, dan mengusap kaus kakinya. Kemudian dia pergi ke masjid dan shalat. Editor menyebutkan bahwa 'Abd al-Razzaq dan Ibn Abi Shaybah meriwayatkannya melalui 'Asim al-Ahwal atas otoritas Anas. {cite:muwatta-maruf-1997 p.78}"
