text: "… اللّٰه الحرام، مبارك لأهله في اللحم والماء، على اللّٰه رزق أَهله من ثلاثة سبل، لا يحله أَول من أَهله. - عبد الرزاق عن معمر وابن جريج عن كثير بن كثير عن سعيد بن جبير عن ابن عباس أَن امرأَة إسماعيل …"
