text: "… ويسكن وجع الجنبين والكبد والطحال، ويحلل الخنازير، ويبني على العظام العارية لحماً، وينفع من سيلان المني، وينفع في الأدوية التي يكمد بها الرحم، لأنه يلين ويفتح؛ ويقطع النهش والكلف، ويشفي من الصداع المزمن؛ ويفسد الأجنة ويخرجها من الرحم : وقال …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3138، يذكر الوجع، وأسماء الأمراض، وأطوار خلق الجنين، وأعضاء البدن، والعظام، والدواء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 3138, that mentions pain, named diseases, the stages of the embryo, the organs of the body, the bones, the drug, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 3138 کا اقتباس جس میں درد، بیماریوں کے نام، جنین کے مراحل، اعضائے بدن، ہڈیاں، دوا، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 3138, que menciona el dolor, las enfermedades, las etapas del embrión, los órganos del cuerpo, los huesos, los medicamentos y la curación; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 3138, qui mentionne la douleur, les maladies nommées, les stades de l'embryon, les organes du corps, les os, le médicament, la guérison; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 3138. sayfasından bir bölüm; ağrı, hastalık isimleri, fetüs gelişim aşamaları, vücut organları, kemikler, ilaç ve şifadan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 3138, yang menyebutkan rasa sakit, nama-nama penyakit, tahapan perkembangan janin, organ tubuh, tulang, obat-obatan, dan penyembuhan; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
