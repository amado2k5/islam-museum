text: "… ويسكن وجع الجنبين والكبد والطحال، ويحلل الخنازير، ويبني على العظام العارية لحماً، وينفع من سيلان المني، وينفع في الأدوية التي يكمد بها الرحم، لأنه يلين ويفتح؛ ويقطع النهش والكلف، ويشفي من الصداع المزمن؛ ويفسد الأجنة ويخرجها من الرحم : وقال …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3138، يذكر الوجع، وأسماء الأمراض، وأطوار خلق الجنين، وأعضاء البدن، والعظام، والدواء، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
