text: "… وستون شعة فأفضلها قول لا اله الاالله وادناها اماطة الاذى عن الطريق والحياه شعبة من الايمان رواه البخارى ومسلم وابو داود والترمذى والنسائى وابن ماجه+ - وعن ايى هريرة ايضا قال قال رسول اللّٰه وتيام الحياه من الايمان والايمان في …"
summary:
  ar: "مقطع من الترغيب والترهيب للمنذري، المجلد المصوَّر 3، ص 258، يذكر شعب الإيمان، وما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
