text: "… بهامنى فلما مضى سألت عنه وقال الزيادى لما احتضر امرئ القيس بانقره نظر الى قبر فسأل عنه فقالوا له قال وعسيب جبل كان القبر فى سنده. ويقال ان هذين البيتين كتبا على قبره معاوية بن الحارث الاكبر يتهى نسبه الى …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 115، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
