text: "… الجسُّ، برزت إليه هذه القوةُ، وكان البُحرانُ صالحاً فاندفع المرض، وقام المريض، كأن لم يكن به قَلبَةٌ ولما رأى الطبيبُ قوةً إيمانه قد استعلت على مرض جَسِّه وقهرته، قال لمن أراد فصده: لا يحتاجُ هذا العارض إلى فصاد، ومَا يُدْرِيكَ …"
