text: "… جعل يصيح سرورًا بانصرافهم. فلمّا قدم أَبو سُفيان على قُرَيش بمكّة لم يصل إلى بيته حتى أَتى هُبَل فقال : قد أَنعمتَ ونصرتَنى وشفَيتَ نفسى من محمّد وأَصحابه ! وحَلَق رأسه. وقيل لعمرو بن العاص : كيف كان افتراق المشركين …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 299، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 299, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "المغازی، واقدی، اسکین جلد 1، ص 299 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
