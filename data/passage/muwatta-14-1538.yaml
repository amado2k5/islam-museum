label: { ar: "الموطأ 1538 — مالك: بلغه أن سعيد بن المسيب وسليمان بن يسار سئلا عن رجل زوج عبدا له جاريته فطلقها البتة ثم وهبها سيدها له، فقالا لا تحل له حتى تنكح زوجا غيره", en: "Muwatta 1538", es: "Muwatta 1538", fr: "Muwatta 1538", ur: "موطا 1538", tr: "El-Muvatta 1538 — Malik: Ona şöyle bir rivayet ulaştı: Said bin el-Musayyab ve Süleyman bin Yaşar'a, bir adamın kölesini başka bir kadın köleyle evlendirip sonra onu geri dönülmez bir şekilde boşadığı, daha sonra da efendisinin onu kendisine verdiği soruldu. Onlar da şöyle dediler: \"O kadın, başka bir kocayla evleninceye kadar onun için helal değildir.\"", id: "Al-Muwatta 1538 — Malik: Sampai kepadanya bahwa Saeed bin Al-Musayyab dan Sulayman bin Yasar ditanyai tentang seorang pria yang menikahkan budaknya dengan budak perempuannya, kemudian menceraikannya tanpa dapat ditarik kembali, lalu tuannya memberikannya kepada pria itu. Mereka berkata: Dia tidak halal baginya sampai dia menikah dengan suami lain." }
summary:
  ar: "يروي مالك أنه بلغه أن سعيد بن المسيب وسليمان بن يسار سئلا عن رجل زوج عبدا له جاريته، فطلقها العبد البتة، ثم وهبها سيدها له، هل تحل له بملك اليمين؟ فقالا لا تحل له حتى تنكح زوجا غيره. {cite:muwatta-maruf-1997 p.44}"
  tr: "Malik rivayet eder ki, Sa'id ibn al-Musayyab ve Sulayman ibn Yasar'a, bir adamın kölesini başka bir kadın köleyle evlendirdiği, daha sonra kölenin onu geri dönülmez bir şekilde boşadığı ve efendisinin de onu adama hediye olarak verdiği sorulmuş. Bu kadın, mülkiyet hakkı gereği adam için caiz midir? Onlar şöyle demişler: Başka bir kocayla evleninceye kadar adam için caiz değildir. {cite:muwatta-maruf-1997 s.44}"
  id: "Malik meriwayatkan bahwa ia mendengar Sa'id ibn al-Musayyab dan Sulayman ibn Yasar ditanya tentang seorang pria yang menikahkan budaknya dengan budak perempuannya, kemudian budak perempuan itu menceraikannya secara mutlak, dan kemudian tuannya memberikannya kepadanya sebagai hadiah. Apakah budak perempuan itu halal baginya berdasarkan hak kepemilikan? Mereka berkata: Budak perempuan itu tidak halal baginya sampai ia menikah lagi dengan suami lain. {cite:muwatta-maruf-1997 p.44}"
