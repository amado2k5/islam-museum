text: "… أبى عاصم، عن أبيه عن شبيب ابن بشر، عن عكرمة، عن ابن عباس قال : الرس بئر باذربيجان. وقال الثورى عن أبى بكر عن عكرمة قال : الرس بئر رسوا فيها نبيهم، أى دفنوه فيها. قال ابن جريج : قال …"
