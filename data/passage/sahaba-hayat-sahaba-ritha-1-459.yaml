text: "… ؛ أيها الناس! إنى لوددت أن أنجو كفافا لالى و لا على وإنى لارجو ان ممرت فيكم يسيرا أو كثيرا ان اعمل بالحق فيكم إن شاء اللّه وإلا يبق احد من المسلين وإن كان فى بيته الا اتاه حقه ونعيه …"
summary:
  ar: "مقطع من حياة الصحابية، المجلد المصوَّر 1، ص 459، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Hayat al-Sahaba, scan volume 1, p. 459, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "حیات الصحابہ، اسکین جلد 1، ص 459 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
