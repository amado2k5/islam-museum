label: { ar: "سنن أبي داود 3638 — الأب والأبوة", en: "Sunan Abi Dawud 3638 — the father and fatherhood", ur: "سنن ابی داؤد 3638 — باپ اور والدیت", es: "Sunan Abi Dawud 3638 — El padre y la paternidad", fr: "Sunan Abi Dawud 3638 — Le père et la paternité" }
text: "… بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنِ الْوَلِيدِ، - يَعْنِي ابْنَ كَثِيرٍ - عَنْ أَبِي مَالِكِ بْنِ ثَعْلَبَةَ، عَنْ أَبِيهِ، ثَعْلَبَةَ بْنِ أَبِي مَالِكٍ أَنَّهُ سَمِعَ كُبَرَاءَهُمْ، يَذْكُرُونَ أَنَّ رَجُلاً، مِنْ قُرَيْشٍ كَانَ لَهُ سَهْمٌ فِي بَنِي قُرَيْظَةَ فَخَاصَمَ إِلَى رَسُولِ اللَّهِ فِي مَهْزُورٍ - يَعْنِي السَّيْلَ الَّذِي يَقْتَسِمُونَ مَاءَهُ - فَقَضَى بَيْنَهُمْ رَسُولُ اللَّهِ أَنَّ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3638، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3638 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3638، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3638 (El Libro del Juez (Kitab Al-Aqdiyah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3638 (Le Livre du Juge), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
