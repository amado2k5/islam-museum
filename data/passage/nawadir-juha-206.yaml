text: "… لو لم أخنقه لكان خنقني كان يوماً ضيفاً عند أحدهم، فأعطاه قبل النوم قاووقاً كبيراً، ليلبسهُ في نومه، فأخذهُ الشيخُ وربطَهُ من نصفِهِ ولبسَهُ قائلاً : غداً أحلْ الرباط، فيعودُ إلى حاله، ونام. وقبل أن يستيقظ جاء صاحب الدار فقال …"
summary:
  ar: "أُعطي جحا طاقية كبيرة لينام بها فربطها حول خصره، فرآه المضيف معقوداً وقال مازحاً إنه صار من أهل الكهف النائمين وإنه خنق الطاقية، فقال جحا إنه لو لم يخنقها لخنقته. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  en: "Given a large cap to sleep in, Juha ties it round his waist. The host, joking that he has become a sleeper of the Cave, sees him knotted up and says he has strangled the cap, and Juha replies that if he had not strangled it, it would have strangled him. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  ur: "جحا کو سونے کے لیے ایک بڑی ٹوپی دی جاتی ہے تو وہ اسے اپنی کمر پر باندھ لیتا ہے۔ میزبان مذاق میں کہتا ہے کہ وہ اصحاب کہف میں سے ہو گیا ہے، اسے بندھا ہوا دیکھ کر کہتا ہے کہ اس نے ٹوپی کا گلا گھونٹ دیا ہے، تو جحا جواب دیتا ہے کہ اگر وہ اس کا گلا نہ گھونٹتا تو وہ اس کا گلا گھونٹ دیتی۔ {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  fr: "On donne à Juha un grand bonnet pour dormir, et il se le noue autour de la taille. L'hôte, plaisantant qu'il est devenu un dormeur de la Caverne, le voit ainsi noué et dit qu'il a étranglé le bonnet, et Juha répond que s'il ne l'avait pas étranglé, c'est lui qui l'aurait été. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  es: "A Juha le dan un gorro grande para dormir y se lo ata a la cintura. El anfitrión, bromeando con que se ha vuelto uno de los durmientes de la Cueva, lo ve anudado y dice que ha estrangulado el gorro, y Juha responde que si no lo hubiera estrangulado, el gorro lo habría estrangulado a él. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  tr: "Juha'ya uyuması için büyük bir şapka verildi, o da şapkayı beline bağladı. Ev sahibi onu bağlı halde görünce şaka yollu, Yedi Uyuyan'dan biri olduğunu ve şapkayı boğduğunu söyledi. Juha ise, eğer şapkayı boğmasaydı, şapkanın onu boğacağını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 93}"
  id: "Juha diberi topi besar untuk tidur, jadi dia mengikatnya di pinggangnya. Tuan rumah melihatnya terikat dan bercanda mengatakan bahwa dia telah menjadi salah satu dari Tujuh Penidur dan bahwa dia telah mencekik topi itu. Juha menjawab bahwa jika dia tidak mencekiknya, topi itu akan mencekiknya. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
