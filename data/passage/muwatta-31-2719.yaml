summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: بلغني أن أسعد بن زرارة اكتوى في زمان رسول الله من الذبحة فمات. ويذكر المحقق أن الصواب «أسعد» لا «سعد» كما في بعض النسخ، وأن الذبحة داء يعرض في الحلق. {cite:muwatta-maruf-1997 p.533}"
