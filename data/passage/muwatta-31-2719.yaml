label: { ar: "الموطأ 2719 — يحيى بن سعيد: أسعد بن زرارة اكتوى من الذبحة فمات", en: "Muwatta 2719", es: "Muwatta 2719", fr: "Muwatta 2719", ur: "موطا 2719", tr: "Al-Muwatta 2719 - Yahya bin Saeed: Esad bin Zürarah anjina nedeniyle dağlandı ve öldü", id: "Al-Muwatta 2719 — Yahya bin Saeed: Asad bin Zurarah dibakar karena angina dan meninggal" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه قال: بلغني أن أسعد بن زرارة اكتوى في زمان رسول الله من الذبحة فمات. ويذكر المحقق أن الصواب «أسعد» لا «سعد» كما في بعض النسخ، وأن الذبحة داء يعرض في الحلق. {cite:muwatta-maruf-1997 p.533}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle şöyle der: \"Es'ad ibn Zurarah'ın, Resulullah zamanında boğaz rahatsızlığı nedeniyle dağlandığını ve öldüğünü duydum.\" Editör, doğru ismin \"Es'ad\" olduğunu, bazı rivayetlerde olduğu gibi \"Sa'd\" olmadığını ve boğaz rahatsızlığının boğazı etkileyen bir hastalık olduğunu belirtir. {cite:muwatta-maruf-1997 s.533}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia berkata: \"Aku mendengar bahwa As'ad ibn Zurarah dikauterisasi pada masa Rasulullah karena penyakit tenggorokan dan meninggal.\" Editor mencatat bahwa nama yang benar adalah \"As'ad,\" bukan \"Sa'd\" seperti dalam beberapa versi, dan bahwa penyakit tenggorokan adalah penyakit yang menyerang tenggorokan. {cite:muwatta-maruf-1997 p.533}"
