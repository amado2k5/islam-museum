text: |-
  • ⁦(بسم اللّٰه الرحن الرحيم)⁩.
  أحد اللّه وأشكره وأستعينه وأستغفره وأسأله حسن الحثام بجاء محمد عليه وعلى آه
  وأصحابه وأنباءه الصلاة والسلام وبعد فهذهمة _دمة تعلق:علم اللغة عموما وبالصماح
  خصوصا نخصها الفقير نصر أبوالوفا الهوريف من شرح القاموس لليدمرنضى رامزاله
  فيما يأتى بالميم والراء ومن المزهروكشف الظنون وذعنها أربع فوائد
  ⁦(الفائدة الاولى فى سيرهذا العلم)⁩ أوّل ماصنف فى جمع اللغة كتاب العين الذى اوله
  للخليل بن أحدصاحب فن العروض والموسيقا المتوفى سنة ١٧ ٠ وباقيه لصاحبه الليث
  ابن نصر الخراسانى على نزاغ طويل فى ذلك بين أعمة اللغة وهى بذلك لان أوّل مابد أفيه لخليل
  بالسكام التى أوّاه! العمدين ثم بما أوّله حاءمه-ملة ثم هاءثم ضاءثم غين ثم قاف الى آخر ماهو
  مبيز فى المزهررنة لدفى الوشاح ثم اختصره من علماء الانداس أبو بكر الزيدى بضم الزاى
  قوله لمافرغنا من نظام الجوهره
  وقع فيه غلط فى طبع المزهر من
  مصمح أوائله فى ٤)٩ سيث نسبه
  الى يواقيت المطارزاه مؤلفه
  فى مختصر الطيف حذف منه التواهد الختلفة والابذة الحختلة وسعاه استدرال الغلط الواقع
  فى كتاب العين فأعجب الدماس به كثيرا ولهيجوا به مدة حتى عده بعضهم أول المختصرات
  الاربعة التى فضات على أمهاتها الاربع:ل فضله قوم أصغرحجمه على سائرما ألف بعده على
  حروف المعج-م كابههرة التى ألتت على متوال كتاب العيز واشتهرت كشيرا صنفها
  ابن دريد المتوفى سنة ٣٢١ عن يفب وتسعين عاما وفى المزهرغير ذلك فائظر صفحة ٢٣٣
  من ثانى المطبوع ثم اختصرها الصاحب ابن عباد المتوفى سنة ٣٠٨٥ فى كتاب سماه الجوهره
  وقال فى آخره لماذرغنامن نظام الجوهره • اعورت العيز ومات الجهره
  قال القاموس فى مادة تين وتمام
  ثم لما قد حوا فى مختصر العين بإنه أخل بكتاب العين لمدفه الشواهد النافعة صنف أبو على
  ابن غالب بن عمروأديب صاحب
  القالى البغدادى المتخرج على ابن دريد كتابه البارع أتى فيه بنمافى العين وزاد عليه وكذلك
  الموعب اه فلفظة الموعب
  الامام ابن التيانى أبو غالب وامههسام المتوفى سنة ٤٣٦ بالانداس لماعلم ذلك من مختصر
  سقطت من أص-ل المزهر ومن
  العين تأليف شيخه الزبيدى المتقدّم عمل كتابه العظسيم الفائدة وسهماه الموعب بفتح العين
  شرح القاموس وقال صاحب
  اى على صيغة اسم المفعول أتى فيه يما فى العين من صحيح اللغة مقتصراعلى الشواهد الصميحة
  الوفيات فى ترجته وله كتاب
  طارحا مافيهمن الشواهد المختلفة والابنيلة المختلة والكامات الممجعفة وزادفيه مازاده
  جامع فى الثغة سماه تلقيح العين
  اين دريد فى المهرة فصار محتو ياعنى الكتابين جميعا ولكن كلا من البارع والموعب قليل
  فلا أدرى أهذا تصحيف لولهم
  الوجود لان الناس زركوانقله-مامع كونهما من أصح ما ألف فى اللغة على روف المعجم
  يفتح المين وقع عند الطبع ثم
  ومالوا الى ما ألف قبلهما وبعدهما كالجهرة والمجمل والصحاح والحكم وجامع القزاز وأفعال
  أفول وهذا تطويل مى فى اسم
  ابن القوطية وأفعال ابن طريق مع ان الكتب التى مالوا اليهاقد تسكلم فيها وان كانت
  الجهرة قد اثنى عليها كثير من العلمام ثم قال م و نقلا عن المزهر وألف أتداع الخليل وأتباع
  لاوجودء إه ؤل
  أتباعه وهلم جرا كتباشتى فى اللغسة ما بين مطوّل ومختصر وعامّ ى أنواع اللغة وخاص
  بنوع منها كالاجناس للاصعى والتوادر و للغات لابى زيد الانصارى والتوادر للكسائى
  والموادر واللغات للفرّاء والنغات لابى عبيدة والجيم والنوادر والغريب لابى عمر والشيبانى
  والغريب المصنف بفتح النون منددة لابى عسد والذوادر لا بن الاعرابى والبارع للمفضل بن
  سلمة واليواقيت لابي عمر الزاهد المطرزغلام ثعاب المتوفى سنة ٣٤٥ والمجرد لكراع والمنض
  الاينهسويدوالتهذيب للازهرى والجمل لاين فارس وديوان الادب للغارابى والمحيط
  للصاحب
