label: { ar: "صحيح مسلم 5745 — الكي، الطب والطبيب", en: "Sahih Muslim 5745 — cautery; medicine and the physician", ur: "صحیح مسلم 5745 — داغنا، طب اور طبیب" }
text: "حَدَّثَنَا يَحْيَى بْنُ يَحْيَى، وَ أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ وَأَبُو كُرَيْبٍ قَالَ يَحْيَى - وَاللَّفْظُ لَهُ - أَخْبَرَنَا وَقَالَ الآخَرَانِ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، قَالَ بَعَثَ رَسُولُ اللَّهِ إِلَى أُبَىِّ بْنِ كَعْبٍ طَبِيبًا فَقَطَعَ مِنْهُ عِرْقًا ثُمَّ كَوَاهُ عَلَيْهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5745، يذكر الكي، والطب والطبيب. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5745 (The Book of Greetings), that mentions cautery, medicine and the physician. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5745، جس میں داغنا، طب اور طبیب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
