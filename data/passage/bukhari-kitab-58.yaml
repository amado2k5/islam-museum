summary:
  ar: "القسم 58 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجزية والموادعة»، ويضم فيها النصوص من 3157 إلى 3189 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 58 of Sahih al-Bukhari (Jizyah and Mawaada'ah) in the division of the open hadith dataset the museum took its reports from: reports 3157 to 3189 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 58، عنوان «کتاب الجزیۃ والموادعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3157 تا 3189۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 58 de Sahih al-Bukhari (Jizyah y Mawaada'ah) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3157 al 3189 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih al-Bukhari (Livre 58, Jizyah et Mawaada'ah), dans la partie ouverte du recueil: les hadiths 3157 à 3189 de cette base de données. Le musée classe ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
