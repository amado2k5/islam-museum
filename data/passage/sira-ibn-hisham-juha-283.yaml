text: "… وِلِلنَقْصِ مِنْ رَأْي الرِّجَالِ وَلِلْعَقْلِ أَلاَ يَا لَقَزْمِي لِلِتْحَلْمِ والْجَلِ لَهُمْ حُرُمَاتٍ مِنْ سَوَامٍ وَلاَ أُهْلٍ وَلِلرَّاكِبِينَا بِالْمَظَالِمِ لَمْ نَطَأَ لَهُمْ غَيْرُ أَمْرٍ بِالْعَفَافِ وَبِالْعَذْلِ كَأَنَّا تَبَلْنَاهُمْ وَلَاَ تَبْلَ عِنْدَنَا وَيَنْزِلُ مِنْهُمْ مِثْلَ مَنْزِلَةِ الْهَزْلِ وَأَمْرٍ بِإِسْلاَمِ فَلاَ يَقْبَلُونَهُ فَمَا …"
