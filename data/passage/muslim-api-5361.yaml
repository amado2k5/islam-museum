label: { ar: "صحيح مسلم 5361 — الأب والأبوة", en: "Sahih Muslim 5361 — the father and fatherhood", ur: "صحیح مسلم 5361 — باپ اور والدیت", es: "Sahih Muslim 5361 — El padre y la paternidad", fr: "Sahih Muslim 5361 — Le père et la paternité", tr: "Sahih Muslim 5361 — Baba ve Babalık", id: "Sahih Muslim 5361 — Ayah dan Peran Ayah" }
text: "وَحَدَّثَنَاهُ أَبُو كُرَيْبٍ، حَدَّثَنَا ابْنُ فُضَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي حَازِمٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ جَاءَ رَجُلٌ إِلَى رَسُولِ اللَّهِ لِيُضِيفَهُ فَلَمْ يَكُنْ عِنْدَهُ مَا يُضِيفُهُ فَقَالَ \" أَلاَ رَجُلٌ يُضِيفُ هَذَا \". فَقَامَ رَجُلٌ مِنَ الأَنْصَارِ يُقَالُ لَهُ أَبُو طَلْحَةَ فَانْطَلَقَ بِهِ إِلَى رَحْلِهِ. وَسَاقَ الْحَدِيثَ بِنَحْوِ حَدِيثِ جَرِيرٍ وَذَكَرَ فِيهِ نُزُولَ الآيَةِ كَمَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5361، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5361 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5361، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5361 (El Libro de las Bebidas), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 5361 (Le Livre des Boissons), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 5361 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5361, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
