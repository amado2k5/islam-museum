label: { ar: "الموطأ 1601 — نافع عن ابن عمر: أيما رجل آلى من امرأته فإذا مضت الأربعة الأشهر وقف حتى يطلق أو يفيء، ولا يقع عليه طلاق حتى يوقف", en: "Muwatta 1601", es: "Muwatta 1601", fr: "Muwatta 1601", ur: "موطا 1601", tr: "El-Muvatta 1601 — İbn Ömer'den rivayet edildiğine göre Nafi': Bir erkek karısından cinsel perhiz yemini ederse, dört ay geçtikten sonra, onu boşayana veya evlilik ilişkisine yeniden başlayana kadar bu yemini askıya alınmış sayılır ve askıya alınmadan boşanma geçerli olmaz.", id: "Al-Muwatta 1601 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Jika seorang pria bersumpah untuk berpantang dari istrinya, maka jika telah berlalu empat bulan, ia berada dalam masa penangguhan hingga ia menceraikan istrinya atau kembali berhubungan intim, dan perceraian tidak berlaku sampai ia berada dalam masa penangguhan." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يقول أيما رجل آلى من امرأته، فإنه إذا مضت الأربعة الأشهر وقف، حتى يطلق أو يفيء، ولا يقع عليه طلاق إذا مضت الأربعة الأشهر حتى يوقف. {cite:muwatta-maruf-1997 p.65}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre şöyle derdi: Bir adam karısından cinsel perhiz yemini ederse, dört ay geçtikten sonra, onu boşayana veya evlilik ilişkisine yeniden başlayana kadar bir süre tanınır. Bu dört aylık süre geçtikten sonra, boşanma onun için geçerli olmaz. {cite:muwatta-maruf-1997 s.65}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa beliau biasa berkata: Jika seorang laki-laki bersumpah untuk berjauhan dari istrinya, maka jika empat bulan berlalu, ia diberi waktu jeda sampai ia menceraikan istrinya atau kembali berhubungan suami istri. Perceraian tidak berlaku baginya setelah empat bulan berlalu sampai ia diberi waktu jeda tersebut. {cite:muwatta-maruf-1997 p.65}"
