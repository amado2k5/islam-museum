text: "… اللَّهِ بْنُ مُعَاذٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا شُعْبَةُ، عَنْ حُمَيْدِ بْنِ هِلاَلٍ، عَنْ مُطَرِّفٍ، قَالَ قَالَ لِي عِمْرَانُ بْنُ حُصَيْنٍ أُحَدِّثُكَ حَدِيثًا عَسَى اللَّهُ أَنْ يَنْفَعَكَ بِهِ إِنَّ رَسُولَ اللَّهِ جَمَعَ بَيْنَ حَجَّةٍ وَعُمْرَةٍ ثُمَّ لَمْ يَنْهَ عَنْهُ حَتَّى مَاتَ وَلَمْ يَنْزِلْ فِيهِ قُرْآنٌ يُحَرِّمُهُ وَقَدْ كَانَ يُسَلَّمُ عَلَىَّ حَتَّى اكْتَوَيْتُ فَتُرِكْتُ ثُمَّ تَرَكْتُ الْكَىَّ فَعَادَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2974، يذكر الكي. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 2974 (The Book of Pilgrimage), that mentions cautery. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 2974، جس میں داغنا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
