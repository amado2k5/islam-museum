text: |-
  (قر
  ( عسك عك بالشى عسكلزمه ⁦( ع فك)⁩ رجل أعفك أى أحق بين العفك قال
  الراجز
  ما أنت الا أعضك يلندم • هو هامتحردية من ردم
  (⁦(كك )⁩ عككنه أى حبسته عن حاجته وكذلك اذا ماطلته بحفه وابل معكوكة أى
  محبوسة و-كى أبوز يدعككنه الحديث أعكم عكااذا استعدته الحديث حتى كزره عليك
  مرتين والعكة بالضم آنية السمن قال ابن السكيت يقال لمثل الشكوة مما يكون فيه السمن
  عكة والجمع العكل والعكاك والمكة أيضارملة حبت عليها الشمس وعكة العشار أيضالون
  يعلو النوق عندلقاحها وقد أعكت الناقة اذا تيدات لوناغيرلونم اسعنا والعكة والحكمة
  فورة الحمر وكذلك العكيك والعكاك قال طرقة
  تطرد القتر بحر صادق • وعكيك القيظ ان بامير.
  ويوم على وعكيك أى شديد الحتر وقدعك يومنا يعك ورحل عك أى صاب شديد وعمكم
  السوط أى ضريه وفرس معل على مفعل يكسر الميم يجرى قليلاثم يحتاج الى الضرب وعكنه
  الجى أى لزمته وأحته وعك بن عدنان أخو معدوهو اليوم فى المن وقواهم اتتزرفلان ازرة
  علوك وازرة عكى وهو أن يسبل طرقى ازاره ويضم سائره وأنت دابن الاعرابة
  ازونه تحدمعك وكا • مشيه فى الدار هاكركا
  رعكة اسم بلدفى التغور وفى الحديث ط وبى لمن وأى عكة قال الفرامهذه أوض عكة تضاف
  ولا تضاف أى حارة والعكوك السمين القصير مع صلايوه وفعلع شكرير العين وليس من
  المضاعف قال الراجز عكولا ذا منى درحايه والعكول أيضا المكان الفليظ الصابه
  وأنشداين دريده اذا افترشن مبركاعكو كاه ⁦(علد)⁩ العلل الذى يضغ وقد علكه وعلك
  لغرس اللحام يعدكه اذالاكه فى فيه قال الشاعر
  خيل صيام وخيل غير صافة • تحت الهجاج وأخرى تدلك الليما
  وشىْ علكْ أى لزج والعولك عرق فى الرحم والجمع ءوالك وقال العدبس الكافة العولات
  عرق فى الخيل والهر والغنم بكون فى البظارة غامضاد اخلا فيها وأنشد
  باصاح ما أصبر ظهر غنام • خشيت أن تظهر فيه أورام • من عولكين غلبابإبلام
  وذلك أن امراً قين كانشار كبتا بعيراله يسمى غناما واعلتكان الشعرأى اطلنكد واجقع
  ⁦( عنك)⁩ عنسك اللين أى خثر والعمائك رملة فيها تعقد لا يقدر البعير على المشى فيها الا أن
  يحبو يقال قداعتنك البعير ومنه قول الراجز أوديت ان لم قعب حبو المعتنك يقول
  ملكت ان لم تحمل حالتى بجهد والمانك الاحر يقال دم عائك والمنك بالكسرثاث الليل
  الباقى عن الاصمعى: وأنشدهليل التمام غيرمنك أدهماه وقال أبو عمرويقال أنانا بعد
  منك من الليل أى بعد هزيع من الليل والعنك الباب لغة يمائية والمعنك الفلق
  صل الفساء) ( ك فاتلت الجرى والمع الفتال والفتك أن يأت الرجل صاحبه
  وهو غار غافل حتى يشد عله فيقتله وفيه ثلاث اضات قتاذوقتاك وفتك مثل ود وود ووذ
  وزعم وزعم وزعم وقد فتك به يفتل ويفتك وفى الحديث قيد الايمان الفتك لا يفتك مؤمن
  ⁦( دل")⁩ فدلْاسم قرية جيبر وأيوفديك رجل وقدكت القطن نفشته لغة أزدية ⁦( رك)⁩
  ٢٦
  قوله وعك بن هدنان ف القاموس
  وعلة بن عدوان بالثاء المثلثة ابت
  عبداقه بن الازد وليس ابن
  هدنان أخامعد ووهم الجوهري
  قوله غلبا با بلام يقال أبات الناقة
  اذا ورم حياؤها من شقة الضبعة
  قاله المؤاف فى مادة بلم وف إعض
  ∞النسخ بالايلا
