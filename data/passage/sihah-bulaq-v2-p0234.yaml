text: |-
  *ائن)
  ٢٥٣
  أى على حين ذلك ⁦(أقن )⁩ الاقنة بيت يبنى من حجروالجمع أقن مثل ركبسة وركب قال
  الطرماخ
  فى شناظى أقن بينها * عرّة الطير كسوم النعام
  ⁦( امن)⁩ الامان والامانة بمعنى وقدأمنت فأنا آمن وآمنت غسيرى حن الامن والامان
  والايمان التصديق واللّٰه تعالى المؤمن لانه آمن عباده من أن يظلهم وأصل آمن أأمن
  بهمزتين لينت الثانية ومنه المهيمن وأص_لهما أمن ليفت الثانية وقلبت ياء وقلبت الاولى هاء
  والا من ضدّ الخوف والامنة بالتحريك الامن ومنسه قوله عز وجل أمنة نعاسا والامغة أيضا
  الذى يثق بكل أحد وكذلك الامنة مثال الهمزة وأمنته على كذا وائتمنته بمحنى وقرئ مالك
  لا تأمناعلى يوسف بين الادغأم وبين الاظهار قال الاخفش والادغام أحسن وتقول
  أوتى فلان على مالم يسم فاعله فان ابتدأت به صيرت الهمزة الذانية واوالات كل كلمة اجتمع
  فى أولها هم زتان وكانت الاخرى منه-ماساكنة فلت أن تصيرها واوا ان كانت الاولى
  ضمومة أوياء ان كانت الاولى مكسورة فحو ائتمنه أو ألفا ان كانت الاولى مفتوحة فعو
  آمن واس: أمن اليه أى دخل فى أمائه وقوله تعالى وهذا البلد الامين قال الاخفش
  يريد الامن وهومن الامن قال وقديقال الامين المأمون كاقال الشاءر
  ألم تعلى يا أسم ويحك أننى * حلفت يينا لا أخون أمينى
  أى مأمونى والآمان بالضم والتشديد الامين وقال الشاعر الاعشى
  ولقد شهدت التاجر الامان مورود اشرابه
  والامون الفاقة الموثقسة الخلق التى أمنت أن تكون ضعيفة وامين فى الدعاء يمدّ ويقصر
  قال الشاعر فى الممدود
  يارب لا نسلبنى حبها أبدا • ويرحم اللّٰه عبدا قال آمينا
  وقال آخر فى المقصور
  ماعد منى فطحل اذرأيته • أمين فزادالله ما يننا بعدا
  وتشديد الميم خطأ ويقال معناه كذلك فليكن وهو مبنى على الفتح مثل أين وكيف لاجتماع
  السا كنين وتقول منه أمّن قلان تأمينا ا ن ن الرجل يثن من الوجع أنينا قال ذو
  الرمّسة ،قما أن المريض الى عواده الوصب• والانان بالضم مثل الانين وهال المغيرة بن
  حبنا يخاطب آخاه صخرا أراك جمعت مسمّلة وحرصا • وعند الفقرز حارا أنانا
  وكذلك التأنان وقال الراجز
  انا وجدناطرد الهوامل • خيرا من التأنان والمسائل
  وماله حنة ولا آنة أى ناقة ولاساة ويقال لا أفعلدما أنّ فى السهاء نجم أى ما كان فى السماء.
  فجم لغة فى عن وما أنّ فى الفرات قطرة أى ما كانت فى الفرات قطرة ولا أفعله ما أنّ فى السنباء!
  ماء وانّ وأنّ حرفان ينصبان الاسهاء ويرفعان الاخيار فالمكسورة منهما يؤ كد بها الخبر
  والمفتوحة وما بعدها فى تأويل المصدر وقد يخففان فاذاخففتافان شئت أعلت وان شئت
  لم تعمل وقد تزاد على أنّ كاف التشبيه تقول كانه شمس وقد تخفف أيضافلا تعمل شيأ
  قال• كأن وريدامرشا أخلب•ويروى كأن وريديه وقال آخر
