label: { ar: "الموطأ، كتاب الضحايا", en: "Muwatta, Book of Sacrifices (dahaya)", es: "Muwatta, Libro de los Sacrificios (dahaya)", fr: "Muwatta, Livre des sacrifices (dahaya)", ur: "موطا، قربانی کی کتاب ⁦(دحیہ)⁩", tr: "El-Muvatta, Kurbanlar Kitabı", id: "Al-Muwatta, Kitab Para Korban" }
summary:
  ar: "كتاب الضحايا، الكتاب التاسع من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 16 نصاً (1387–1402) في ستة أبواب، من الصفحة 619 إلى الصفحة 627 من ملف PDF المجلد الأول. يبدأ بما يتقى من الضحايا من العيوب، ثم ما يستحب منها ووقت ذبحها، ثم ادخار لحومها والاشتراك فيها، وينتهي بأن الضحية سنة لا واجبة. {cite:muwatta-maruf-1997 p.619} {cite:muwatta-maruf-1997 p.627}"
  en: "The Book of Sacrifices, ninth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 16 reports (1387–1402) in six babs, PDF pp. 619–627 of volume 1, from the defects that forbid a sacrifice to its timing, storing its meat, sharing and the sacrifice for the household."
  es: "El Libro de los Sacrificios, noveno libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 16 informes (1387–1402) en seis babs, PDF pp. 619–627 del volumen 1, desde los defectos que prohíben un sacrificio hasta su momento, almacenamiento de su carne, reparto y el sacrificio para el hogar."
  fr: "Le Livre des Sacrifices, neuvième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 16 rapports (1387–1402) dans six babs, PDF pp. 619–627 du volume 1, depuis les défauts qui interdisent un sacrifice jusqu'à son moment, le stockage de sa viande, le partage et le sacrifice pour le ménage."
  ur: "قربانی کی کتاب، یحییٰ بن یحییٰ کی تجدید میں موطا کی نویں کتاب ⁦(ایڈیشن معرف 1997)⁩: چھ بابوں میں 16 رپورٹیں (1387-1402) جلد 1 کی پی ڈی ایف صفحہ 619-627، ان عیبوں سے جو مجھے قربانی کرنے سے منع کرتے ہیں اور اس کی قربانی سے منع کرتے ہیں۔ گھریلو"
  tr: "Malik'ten rivayet edilen Yahya ibn Yahya'nın nazil ettiği El-Muvatta'nın dokuzuncu kitabı olan Kurbanlar Kitabı, Beşar Awad Maruf'un (1997) baskısında, altı bölümden oluşan 16 metinden (1387-1402 Hicri) oluşmaktadır ve 1. cildin PDF dosyasının 619. sayfasından 627. sayfasına kadar uzanmaktadır. Kitap, kurbanlık hayvanlarda kaçınılması gereken kusurlarla başlar, ardından tavsiye edilenler ve kesim zamanı, daha sonra etlerinin muhafaza edilmesi ve paylaşılması konularını ele alır ve kurbanın bir sünnet olduğunu, farz olmadığını belirterek sona erer. {cite:muwatta-maruf-1997 s.619} {cite:muwatta-maruf-1997 s.627}"
  id: "Kitab Kurban, kitab kesembilan Al-Muwatta' dalam riwayat Yahya bin Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997): 16 teks (1387–1402 H) dalam enam bab, dari halaman 619 hingga halaman 627 dari file PDF Volume 1. Kitab ini dimulai dengan kekurangan yang harus dihindari pada hewan kurban, kemudian kekurangan yang dianjurkan dan waktu penyembelihan, kemudian pengawetan dagingnya dan pembagiannya, dan menyimpulkan bahwa kurban adalah Sunnah, bukan kewajiban. {cite:muwatta-maruf-1997 p.619} {cite:muwatta-maruf-1997 p.627}"
