  ar: "كتاب الضحايا، الكتاب التاسع من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 16 نصاً (1387–1402) في ستة أبواب، من الصفحة 619 إلى الصفحة 627 من ملف PDF المجلد الأول. يبدأ بما يتقى من الضحايا من العيوب، ثم ما يستحب منها ووقت ذبحها، ثم ادخار لحومها والاشتراك فيها، وينتهي بأن الضحية سنة لا واجبة. {cite:muwatta-maruf-1997 p.619} {cite:muwatta-maruf-1997 p.627}"
