text: "… ولكنه منقطع بين مكحول وأبي ثعلبة، وله عند الدار قطني ص، شاهد من حديث أبي الدر داءونيه نهشل الحراساني، وهو كذاب كما قال ابن راهويه، فلا قيمة لشهادته ! ومع ذلك فقد قال النووي في الأربعين بعد أن عزاه الدار …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 2، ص 69، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Mishkat al-Masabih, scan volume 2, p. 69, that carries condolence, consolation and patience at a loss; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "مشکوٰۃ المصابیح، اسکین جلد 2، ص 69 کا اقتباس جس میں تعزیت، تسلی اور مصیبت پر صبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 2, p. 69, qui contient des condoléances, une consolation et la patience devant la perte; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Mishkat al-Masabih, volumen escaneado 2, p. 69, que contiene condolencias, consuelo y paciencia ante la pérdida; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Mişkat el-Masabih, Resimli Cilt 2, sayfa 69'dan bir alıntı; felaket karşısında taziye, teselli ve sabır içeriyor; makine tarafından okunabilir taranmış baskıdan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Mishkat al-Masabih, Jilid Bergambar 2, hlm. 69, berisi ucapan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
