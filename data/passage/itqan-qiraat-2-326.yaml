text: "… ذكر القراءات المرادة بالحديث : نزل القرآن على سبعة أحرف - - فصل فى عدّ كلمات القرآن. فصلى فى عدّ حروف القرآن. والآيات والسُّوَر النوع العشرون فى معرفة حفّاظِه وروانه ذكر المرأة الصحابية التى اشتركت فى جمع القرآن. فصل فى …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 2، ص 326، يذكر الأحرف السبعة، وقراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 2, p. 326, that mentions the seven ahruf, the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 2، ص 326 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Suyuti, al-Itqan fi 'Ulum al-Qur'an, volumen 2, pág. 326, que menciona los siete ahruf, las lecturas del Corán, la recopilación del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'al-Suyuti, *al-Itqan fi 'Ulum al-Qur'an*, volume 2, page 326, mentionnant les sept ahruf, les lectures du Coran, sa compilation et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Suyuti'nin \"El-İtkan fi Ulum el-Kur'an\" adlı eserinin 2. cildinin 326. sayfasından, Kur'an'ın yedi okunuş şeklini, Kur'an tilaveti ve Kur'an'ın derlenmesini ve el yazmalarını ele alan bir bölüm; makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak kod politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an tilaveti, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari kitab Al-Itqan fi Ulum al-Qur'an karya Al-Suyuti, Volume 2, halaman 326, yang membahas tujuh cara pembacaan, bacaan Al-Qur'an, dan penyusunan Al-Qur'an dan manuskripnya; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
