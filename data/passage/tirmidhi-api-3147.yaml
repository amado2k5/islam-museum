text: "… إِلَى الْمَسْجِدِ الأَقْصَى ) قَالَ أَفَتَرَاهُ صَلَّى فِيهِ قُلْتُ لاَ. قَالَ لَوْ صَلَّى فِيهِ لَكُتِبَ عَلَيْكُمْ فِيهِ الصَّلاَةُ كَمَا كُتِبَتِ الصَّلاَةُ فِي الْمَسْجِدِ الْحَرَامِ قَالَ حُذَيْفَةُ قَدْ أُتِيَ رَسُولُ اللَّهِ بِدَابَّةٍ طَوِيلَةِ الظَّهْرِ مَمْدُودَةٍ هَكَذَا خَطْوُهُ مَدُّ بَصَرِهِ فَمَا زَايَلاَ ظَهْرَ الْبُرَاقِ حَتَّى رَأَيَا الْجَنَّةَ وَالنَّارَ وَوَعْدَ الآخِرَةِ أَجْمَعَ ثُمَّ رَجَعَا عَوْدَهُمَا عَلَى بَدْئِهِمَا قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3147، يرد فيه ذكر ما كُتب على المؤمنين. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 3147 (Chapters on Tafsir), whose wording mentions what was prescribed for the believers. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 3147، جس کے الفاظ میں جو مومنوں پر لکھ دیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 3147, dont le texte mentionne ce qui a été prescrit aux croyants. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 3147, cuyo texto menciona lo que se prescribió a los creyentes. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami' el-Tirmizi'de 3147 numaralı hadis, müminler için farz olan şeylerden bahsetmektedir. Bu hadis, farz olan ameller, ibadetler, sünnet olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3147, menyebutkan apa yang dianjurkan bagi orang-orang beriman. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
