text: |-
  .⁦(.أى)⁩. ..
  عثقا مغرب أى ذهبت به والالوى الرجل المجتنب المنفرد لايزال كذلت واللاؤن جع الذى
  من غير لفظه بعنى الذين وقيه ثلاث لغات اللاؤن فى الرفع واللاتيز فى الخنض والنصب
  واللاؤيلانون والفاثى باثدات الياء فى كل حال يستوى فيه الرجال والنساء ولا يصغر لانهم
  استغذواء:ه باللتيات للقساء وباللذيون للرجال وان شئت قات للنساء اللاء بالكسر بلاياء
  ولامد ولا همزو منهم من يهمز وأما قول الشاءر
  من النفر اللا«الذين اذاهم • يهاب اللثام حلقة الباب قعقعوا
  فاغاجاز المع بينهم الاختلاف اللقظين أو على القاءاحدهما ها اللهاة الهنة المطبقة
  فى أقصى سقف الفم والمع اللها واللهوات واللهيات أيضامثل القطيات وأماقوله
  يا ت من ترومن شيشاء • ينشب فى المعل واللهاء
  فأنمامده ضرورة ويروى بكسر اللام فال أبو عبيد هوجمع اهامثل الاضاءجع أضاوالأضا
  جمع أضاة واللهوة بالضم ما يلقيه الطاحن فى فم الرحى بيدهتة ول منه ألهيت فى الرحى والجمع
  اها واللهوة أيضا العطية دراهم كأنت أوغيرها والجع اللها يقال انه لمعطاء للها اذا كان
  جواد ايعطى الشئ الكثير ولهيت عن الشى بالكسر ألهى لهيا واميانا اذا سلوت عنه
  وتركت ذكره وأضربت عنه وألهاه أى شغله واهاميه تلهية أى علله ولهوت بالشئ ألهو
  لهوا اذا العيت به وتلهيت به مثله وة لاهوا أى لهى بعضهم بيبعض وقديكنى باللهو عن إله ساع
  وقوله تعالى لوأردنا أن تتخذلهوا قالوا امرأة ويقال ولداوتة ول اله عن الشئ أى اركه وفى
  الحديث فى البلل بعد الوضوء اله عنه وكان ابن الزبيررضى اللّٰه عنه اذاسمع صوت الرعد لهى
  عن حديثه أى تركد وأعرض عنه الاصمعى اله عنه ومنه بعنى وفلان لهوءن الخير على فعول
  والالهية من اللهو يقال بينه-م ألهية كمانقول أحجية وتقديرها أفعولة دهم لهاء مائة مثل
  قولت زهاءمائة ى للياءشي يشبه المصشديد البياض يكون بالحجاز يؤ كل عن
  أبى عبيد وفى الحدين دخل على معاوية وهو يأكل ليا مقشى أى مقشر اواذا وصفت
  المرأة بالبياض قلت كأنم الياءة والليامقصور الارض البعيدة عن الماء
  ف ل الم م ى أوت الجادماوا ومأينه مأيا اذا مددته حتى يتسع وتأى
  جلد يماى تمويا انسع وهو تفعل وقال • دلوأى ديغت بالحلب• ومائة من العدد وأصل
  مأى مثال معى والهاءعوض من الياء واذا بجعت بالواد والذون قلت مئون بكسر الميم
  وبعضهم يقول مؤن بالضم قال ابن السكيت قال الاخفش ولوقلت مئات مثال معات لسكان
  جائزا وبعض العرب يقول مائة درهم يشمون شيأ من الرفع فى الدال ولا يبيذون وذلك الاخفاء
  وقال سي.ويه يقال ثلثمائة وكان -قه أن يقولواثلاث مشين أومثات كماتقول ثلاثة آلاف
  لان مابين الثلاثةَ الى العشرة يكون جاعة فحوثلاثه رجال وعشرة رجل واسكنهم شبههوه
  :أحد عشر وثلاثة عشرو من قال مئين ورفع النون بالتنوين ففى تقديره ولان أحدهما
  فعليز حثال غسلين وهوقول الاخفس وهوشاذ والآخر فعيل بكسر الفا لسكسرة ما بعده
  وأصله -ى ومتى مثل عصىّ وعصى" فأبدل من الياءنونا وأما قول الشاعر
  وحاتم الطائىّ وهاب التى* وقول مزرد
