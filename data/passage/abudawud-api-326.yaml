label: { ar: "سنن أبي داود 326 — الأب والأبوة", en: "Sunan Abi Dawud 326 — the father and fatherhood", ur: "سنن ابی داؤد 326 — باپ اور والدیت", es: "Sunan Abi Dawud 326 — El padre y la paternidad", fr: "Sunan Abi Dawud 326 — le père et la paternité", tr: "Sunan Abi Davud 326 — Baba ve Babalık", id: "Sunan Abi Dawud 326 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ شُعْبَةَ، حَدَّثَنِي الْحَكَمُ، عَنْ ذَرٍّ، عَنِ ابْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِيهِ، عَنْ عَمَّارٍ، فِي هَذَا الْحَدِيثِ قَالَ فَقَالَ يَعْنِي النَّبِيَّ \" إِنَّمَا كَانَ يَكْفِيكَ أَنْ تَضْرِبَ بِيَدَيْكَ إِلَى الأَرْضِ فَتَمْسَحَ بِهِمَا وَجْهَكَ وَكَفَّيْكَ \". وَسَاقَ الْحَدِيثَ. قَالَ أَبُو دَاوُدَ وَرَوَاهُ شُعْبَةُ عَنْ حُصَيْنٍ عَنْ أَبِي مَالِكٍ قَالَ سَمِعْتُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 326، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 326 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 326، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 326 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 326 (Purification (Kitab Al-Taharah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 326 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 326, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
