summary:
  ar: "القسم 22 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصيام»، ويضم فيها النصوص من 2090 إلى 2434 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 22 of Sunan al-Nasa'i (The Book of Fasting) in the division of the open hadith dataset the museum took its reports from: reports 2090 to 2434 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 22، عنوان «کتاب الصیام»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2090 تا 2434۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 22 de Sunan al-Nasa'i (El Libro del Ayuno) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2090 al 2434 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
