text: |-
  :٤٨٣
  (باب المين
  النفس يقنال وسوست اليه نفسه وسوسة ووسواسا بكسر الواو والوسواس بالفتح الاسم
  مثل الززال والزوال وقوله تعالى فوسوس أهدا الشيطان يريد اليهما ولكن العرب نوصل
  بهذه الحروف كاها الفعل ويقال اهمس الصائد والكلاب وأصوات الخلى وسواس قال
  ذوالرمة فيات بشتره ثأدوبسهره • تدوب الريح والوسواس والهضب
  وقال الاعشى
  تسمع للحلى وسواسا اذا انصرفت * كما استعان بريح عشرق زجل
  والوسواس ا-م الشيطان ⁦(وطس)⁩ الوطيس التنوروبقال حى الوطيس اذا اشتد
  الحرب قال آلاصعى الوطس الضرب الشديد بالخف وقال أبو الفوث هو باتحف وغيره وأنشد
  خطارة غب السرى موّارة • تطس الاكام بذات خف ميتم
  وأوطاس موضع ( وعس.الوعساء الارض اللينذات الزحل والسهل أوعس والمبعاس
  مثله وقال أيو عمر والميعلس الارضّ لم توطأ والمواعسة شرب من سيرالابل وهو أن تد
  عنقها وتوسع خطوها وأوعنا أى أدلجنا ولا تكون المواعسة الابالليل ⁦(وقس )⁩ يقال
  وقسه وقساأى قرفه وان بالبعيرلوقسالذاتمارفه شئ من الجرب فهو بعيرموقوس قال
  التجاج وحاصن من حاصنات ملس • من الاذكدومن قراف الوقس
  كس) الوكس النقص وقدوكس الشئ يكس وف الحديث لهامهر مثلها لاوكس
  ولا شطط أى لا نقصان ولا زيادة وقدوكست فلانانقسته وبرأت الشجة على وكس اذابق.
  فى جعوفها شى يقال وكس فلان فى تجارته وأوكس أيضا على مالم يسم فاعلد فيه-ما أى خسر
  لس واست الناقة تلس ولسا اذا أعنقت فى سيرها ويقال للذتب ولاس وص
  المومسة المفاجرة ⁦( وهس)⁩ الوهس الدق والوحس أيضاالوطء والتوهس مشى
  المثقسل قال ابن السكيت الوهيسة أن يطبخ الجراد ثم يجفف تم يدق فيقمح أو ييكل أى يخلط
  دسم والوهس الشبر والنميعة قال-يدين تور يتتقص الاعراض والوهس
  والمواهة المنارة.
  اى حدس والهجس النبأة تسمعها ولا تفهمها ⁦(هبرس)⁩ الهجرس بالكسر الثعلب
  عن أبى عمرو ويقال الهجارس جميع ماتعسس من السباع مادون التعلب وفوق البربوع
  قال الناعربعينى قطامى غمافوق مرقب • غداشما ينضريين الهجارس
  (هرس الهرس الدق ومنه الهربسة والهراس حجرمنقور يدق فيه ويتوضاأً
  منه والمهاريس من الابل الشداد قال الحطيثة يمدح ابله
  .مهاريس يروى رسلها ضيف أهلها • اذا النارأبدت أوجه الخفرات
  والهراس بالفتح شجرذوشول قال الشاعر ا لجعدى
  وخيل تكدس بالدراعين • طباق المكلاب بطأن الهراسا
  وقال آخر
  انا اذا الخيل عدت أكداسا • مثل الكلاب فى الهراسا
  وارض
