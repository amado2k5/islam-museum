label: { ar: "سنن أبي داود 395 — الأب والأبوة", en: "Sunan Abi Dawud 395 — the father and fatherhood", ur: "سنن ابی داؤد 395 — باپ اور والدیت", es: "Sunan Abi Dawud 395 — El padre y la paternidad" }
text: "… الْعِشَاءَ إِلَى ثُلُثِ اللَّيْلِ ثُمَّ قَالَ \" أَيْنَ السَّائِلُ عَنْ وَقْتِ الصَّلاَةِ الْوَقْتُ فِيمَا بَيْنَ هَذَيْنِ \". قَالَ أَبُو دَاوُدَ رَوَاهُ سُلَيْمَانُ بْنُ مُوسَى عَنْ عَطَاءٍ عَنْ جَابِرٍ عَنِ النَّبِيِّ فِي الْمَغْرِبِ بِنَحْوِ هَذَا قَالَ ثُمَّ صَلَّى الْعِشَاءَ قَالَ بَعْضُهُمْ إِلَى ثُلُثِ اللَّيْلِ وَقَالَ بَعْضُهُمْ إِلَى شَطْرِهِ. وَكَذَلِكَ رَوَاهُ ابْنُ بُرَيْدَةَ عَنْ أَبِيهِ عَنِ النَّبِيِّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 395، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 395 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 395، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 395 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
