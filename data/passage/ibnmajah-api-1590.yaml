label: { ar: "سنن ابن ماجه 1590 — تعزية ومواساة وصبر عند المصيبة", en: "Sunan Ibn Majah 1590 — condolence, consolation and patience at a loss", ur: "سنن ابن ماجہ 1590 — تعزیت، تسلی اور مصیبت پر صبر", fr: "Sunan Ibn Majah 1590 — des condoléances, une consolation et la patience devant la perte", es: "Sunan Ibn Majah 1590 — condolencias, consuelo y paciencia ante la pérdida" }
text: "… حَدَّثَنَا إِسْحَاقُ بْنُ مُحَمَّدٍ الْفَرْوِيُّ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عُمَرَ، عَنْ إِبْرَاهِيمَ بْنِ مُحَمَّدِ بْنِ عَبْدِ اللَّهِ بْنِ جَحْشٍ، عَنْ أَبِيهِ، عَنْ حَمْنَةَ بِنْتِ جَحْشٍ، أَنَّهُ قِيلَ لَهَا قُتِلَ أَخُوكِ. فَقَالَتْ وَإِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ. قَالُوا قُتِلَ زَوْجُكِ. قَالَتْ وَاحُزْنَاهُ. فَقَالَ رَسُولُ اللَّهِ ـ \" إِنَّ لِلزَّوْجِ مِنَ الْمَرْأَةِ لَشُعْبَةً مَا هِيَ لِشَىْءٍ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1590، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1590 (Chapters Regarding Funerals), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1590، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Ibn Majah, n° 1590, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Ibn Majah, n.º 1590, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
