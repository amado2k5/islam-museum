text: |-
  ⁦(قذع)⁩
  الداهية وفواقع الدهر بوائقه والفقاع الذى يشرب والفقاقيع النفاخات التى ترتفع فوق
  الماء كالقوارير والفقع الخصاص وفقع أصابعه تفقيعا فرقعها والفقع ضرب من الكمأة
  قال أبو عبيد وهى البيضاء الرخوة وكذلك الفقع بالكسر عن اين السكيت وجمع الفقع
  فقعة مثل جبء وجبأة وجمع الفقع أيضافقعة مثل قرد وقردة ويشبه به الرجل الذليل فيقال
  هو فقع رقرلات الدواب تجله بارجلها قال النابغة يهجو النعمان بن المنذر
  حدثونى بنى الشقيقة ما * يمنع فقعابرقرأن يزولا
  (فلع فلعت الشئ فلعا شققته فانفلع وفلعته تفليعا قال الشاعر
  نشق العهاد الحوّلم ترع قبلنا * كماشق بالموسى السنام المفلع
  وتذلوت قدمه تشققت وهى الفلوع لواحدقلع وفلع ويقال فى الفحسْاعن اللّه فلعتها
  ع لفتع زيادة المال وكثرته قال الشاعر
  أظل بيتى أم حسناء ناعمة * حسدتى أم عطاء اللّه ذا الففع
  تقول منه قنع بالكسر يقمع فنعا ومسك ذوفنع أى ذكى الرأعجة
  ف ل القاز) ( ع بع القنفذيبع قبرعا أدخل رأسه فى جلده وكذلك الرجل
  اذا أدخل رأسه فى قيصه وقبع فى الارض ذهب وقبع البهر والقابيع المنبهر وقبع الخنزير
  نخروامر أة قبعة طلعة تقبع مرة وتطلع أخرى والقبعة أيضاطويراً بقع مشل العصفور
  يكون عند حجرة الجرذان فاذا فزع أورمى بحعرا تقبع فيها ذكره ابن السكيت وقبيعة
  السيف ماعلى طرف مقبضه من فضة أوحديد وقبيعة الخنزير ونبيعته نخرة أنفه وقنبعت
  ، الشجرة اذاصارت زهرتها فى قنبعة أى غطاه والقباع بالضيم مكيال ضخسم والقباع لقب
  الحرث بن عبد اللّه والى البصرة قال الشاعر
  أمير المؤمنين جزيت خيرا * أرحنا من قباع بنى المغيره
  واقتبعت السقاء اذا أدخلت خربته فى فك فشربت منه دع قدعت قرسى أقدعه
  قد عا كيحته وكففته فه رفرس قدوع أى يح ساج الى القدع ليكف بعض بجريه وهذا فحل
  ولا يقدع أى لا يضرب أنفه وذلك اذا كان كريما وقدعت الرجل عنك وأقدعته بعنى أى
  كففته فانقدع وامرأة قدعة قليلة ال كلام حبية وفرس قدع أى هيوب وقد عت عينه
  أيضا تقدع قدعااى ضعفت قال الشاعر
  كم فيهم من هجين أمه أمة * فى عينها قدع فى رجلها ذدع
  ويقال أيضاقدعت لى الجسون أى دنت منى والتقادع التنابع والتهافت فى الشئ كأن كل
  واحديدفع صاحبه أن يسبقه وتقادعوا بالرماح تطاعنوا وفى الحديث يحمل الناس على
  الصراط يوم القيامة فيتقادع -م جنبتا الصراط تقادع الفراش فى النار وتقادع القوم
  اذامات بعضهم فى إئر بعض ( ذع لقذع الخناء والفحس قال زهير
  ليأتينك من منطق قذع * باف كمادنس القبطية الودك
  يقال قذعته وأقذعته اذارميته بالفعش وشتمته وفى الحديث من قال فى الاسلام شعرا
  مقذ عافدسانه «دروالقناذع الكلام القبيح قال أدهم بن أبى الزعراء
