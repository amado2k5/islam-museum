label: { ar: "نوادر جحا الكبرى، ص 144 — «لا شيء يدل على الطعام»", en: "Nawadir Juha al-Kubra, p. 144 — 'Nothing Points to Food'", ur: "نوادر جحا الکبریٰ، ص 144 — «کھانے کی کوئی علامت نہیں»", fr: "Nawadir Juha al-Kubra, p. 144 — « Rien n'indique de la nourriture »", es: "Nawadir Juha al-Kubra, p. 144 — «Nada indica comida»", tr: "Juha'nın Büyük Fıkraları, s. 144 — “Hiçbir şey yemeğin ne olduğunu göstermez”", id: "Anekdot Hebat Juha, hlm. 144 — “Tidak ada yang menunjukkan makanan”" }
text: "… لا شيء يدلُّ على الطعام أنشأ صديق له داراً، ودعاهُ ليراها، فأخذ يتجوَّلُ معه في الدارِ ويُريهِ إيَّاها من"
summary:
  ar: "أُري جحا بيت صديقه طوال النهار دون طعام وهو جائع، فأراه الصديق المطبخ، فرسم جحا خريطة وقال إن المطبخ لا يدل على أي طعام. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  en: "Juha is shown his friend's house all day but no food, and he is starving. The friend shows him the kitchen, and Juha sketches a plan, saying the kitchen shows no sign of food. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  ur: "جحا کو سارا دن دوست کا گھر دکھایا جاتا ہے مگر کھانا نہیں ملتا، اور وہ بھوکا ہے۔ دوست اسے باورچی خانہ دکھاتا ہے تو جحا ایک نقشہ بناتا ہے اور کہتا ہے کہ باورچی خانے میں کھانے کی کوئی علامت نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  fr: "On fait visiter à Juha la maison de son ami toute la journée, mais sans nourriture, et il meurt de faim. L'ami lui montre la cuisine, et Juha esquisse un plan en disant que la cuisine ne montre aucun signe de nourriture. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  es: "A Juha le muestran la casa de su amigo todo el día pero sin comida, y se muere de hambre. El amigo le enseña la cocina, y Juha dibuja un plano diciendo que la cocina no muestra señal de comida. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
  tr: "Juha, arkadaşının evinde bütün gün yemek yemeden vakit geçirdi ve acıktı. Arkadaşı ona mutfağı gösterince Juha bir harita çizdi ve mutfakta hiçbir yiyecek olmadığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 144}"
  id: "Juha diperlihatkan rumah temannya seharian tanpa makanan, dan dia lapar. Temannya menunjukkan dapur kepadanya, jadi Juha menggambar peta dan mengatakan bahwa dapur tidak menunjukkan adanya makanan. {cite:juha-nawadir-kubra-djuwaydi p. 144}"
