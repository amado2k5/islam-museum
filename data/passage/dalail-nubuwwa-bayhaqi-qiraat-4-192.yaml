text: "… القرآن على سبعة أحرف، كلَّ شافٍ كافٍ. هو ابي بن كعبس قيس بس عيد بن زيد بن معاوية بن عمروبن مالك بن النحار سيد القراء، ابو منذر الأنصاري البخاري المدني المقرىء البدري شهد العقة، وبدراً، وجمع القرآن في حياة النبي، …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 4، ص 192، يذكر الأحرف السبعة، والقراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 4, p. 192, that mentions the seven ahruf, the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 4، ص 192 کا اقتباس جس میں سبعہ احرف، قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen 4, pág. 192, que menciona los siete ahruf, los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
