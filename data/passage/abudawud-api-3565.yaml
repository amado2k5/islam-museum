label: { ar: "سنن أبي داود 3565 — وصية أو عهد أخير، ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 3565 — a testament or parting counsel; what was left behind: estate and inheritance", ur: "سنن ابی داؤد 3565 — وصیت یا آخری نصیحت، ترکہ اور میراث", es: "Sunan Abi Dawud 3565 — un testamento o consejo de despedida; lo que se dejó atrás: patrimonio y herencia" }
text: "… أَبَا أُمَامَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ اللَّهَ عَزَّ وَجَلَّ قَدْ أَعْطَى كُلَّ ذِي حَقٍّ حَقَّهُ فَلاَ وَصِيَّةَ لِوَارِثٍ وَلاَ تُنْفِقُ الْمَرْأَةُ شَيْئًا مِنْ بَيْتِهَا إِلاَّ بِإِذْنِ زَوْجِهَا \". فَقِيلَ يَا رَسُولَ اللَّهِ وَلاَ الطَّعَامَ قَالَ \" ذَاكَ أَفْضَلُ أَمْوَالِنَا \". ثُمَّ قَالَ \" الْعَارِيَةُ مُؤَدَّاةٌ وَالْمِنْحَةُ مَرْدُودَةٌ وَالدَّيْنُ مَقْضِيٌّ وَالزَّعِيمُ غَارِمٌ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3565، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3565 (Wages (Kitab Al-Ijarah)), that mentions a testament or parting counsel, what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 3565، جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3565 (Salarios (Kitab Al-Ijarah)), menciona un testamento o consejo de despedida, y lo que dejó: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
