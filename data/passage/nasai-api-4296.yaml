label: { ar: "سنن النسائي 4296 — الأب والأبوة", en: "Sunan al-Nasa'i 4296 — the father and fatherhood", ur: "سنن نسائی 4296 — باپ اور والدیت", es: "Sunan al-Nasa'i 4296 — El padre y la paternidad" }
text: "… عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا ابْنُ سَوَاءٍ، قَالَ حَدَّثَنَا سَعِيدٌ، عَنْ أَبِي مَالِكٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَجُلاً، أَتَى النَّبِيَّ فَقَالَ يَا رَسُولَ اللَّهِ إِنَّ لِي كِلاَبًا مُكَلَّبَةً فَأَفْتِنِي فِيهَا. قَالَ \" مَا أَمْسَكَ عَلَيْكَ كِلاَبُكَ فَكُلْ \". قُلْتُ وَإِنْ قَتَلْنَ قَالَ \" وَإِنْ قَتَلْنَ \". قَالَ أَفْتِنِي فِي قَوْسِي. …"
summary:
  ar: "حديث في سنن النسائي، رقم 4296، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4296 (The Book of Hunting and Slaughtering), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4296، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4296 (El Libro de la Caza y la Matanza), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
