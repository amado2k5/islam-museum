text: "… غير ناصح لله بقلبه. وكذلك النصح لله ولرسوله وَلِيِ فيما أوجبه على الناس عن أمرِ ربه، ومن النصح الواجب لله أنْ لا يرضى بمعصية العاصي، ويُحِبَّ طاعةَ من أطاعَ اللّٰه ورسولَه. وأما النصيحةُ التي هي نافلةٌ لا فرض : فبذل …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 199، يرد فيه ذكر الفرض، ومن أطاع الله ورسوله، والواجب، وما يجب على المكلف، والنافلة والنوافل، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 199, whose wording mentions the obligatory (fard), whoever obeys God and His Messenger, the obligatory (wajib), what is binding on the person addressed, the supererogatory (nafila), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 199 کا اقتباس جس میں فرض، جس نے اللہ اور اس کے رسول کی اطاعت کی، واجب، جو مکلف پر واجب ہے، نفل اور نوافل، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volume numérisé 2, p. 199, dont le texte mentionne l'obligatoire (fard), celui qui obéit à Dieu et à Son Messager, l'obligatoire (wajib), ce qui s'impose à la personne responsable, le surérogatoire (nafila), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen digitalizado 2, p. 199, cuyo texto menciona lo obligatorio (fard), quien obedece a Dios y a Su Mensajero, lo obligatorio (wajib), lo que obliga a la persona responsable, lo supererogatorio (nafila), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Receb'in Cami'ü'l-Ulum ve el-Hikam adlı eserinin 2. cildinin 199. sayfasından bir alıntı, farz ibadetler, Allah'a ve Resulüne itaat edenler, görevler, sorumlu bir kişiden beklenenler, nafile ibadetler ve itaat konularını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ibadetler, görevler, itaat ibadetleri, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram edilen ibadetler ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Jami' al-'Ulum wa al-Hikam karya Ibn Rajab, Volume 2, halaman 199, membahas tentang amalan wajib, orang-orang yang taat kepada Allah dan Rasul-Nya, kewajiban, apa yang dituntut dari orang yang bertanggung jawab, amalan sunnah, dan ketaatan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
