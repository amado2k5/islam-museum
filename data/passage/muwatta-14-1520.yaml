label: { ar: "الموطأ 1520 — أبو هريرة عن النبي: لا يجمع بين المرأة وعمتها، ولا بين المرأة وخالتها", en: "Muwatta 1520", es: "Muwatta 1520", fr: "Muwatta 1520", ur: "موطا 1520", tr: "El-Muvatta 1520 — Ebu Hurayra, Peygamber'den rivayetle: Bir kadın ne baba tarafından teyzesiyle ne de anne tarafından teyzesiyle evlendirilmemelidir.", id: "Al-Muwatta 1520 — Abu Hurairah berdasarkan riwayat Nabi: Seorang wanita tidak boleh menikah dengan bibi dari pihak ayah, maupun dengan bibi dari pihak ibu." }
text: "لا يُجْمعُ بَيْنَ الْمَرْأةِ وَعَمَّتها، وَلَا بَيْنَ الْمَرْأةِ وَخَالَتها"
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال لا يجمع بين المرأة وعمتها، ولا بين المرأة وخالتها. {cite:muwatta-maruf-1997 p.38}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Bir kadın ne baba tarafından teyzesiyle ne de anne tarafından teyzesiyle evlendirilemez.\" {cite:muwatta-maruf-1997 s.38}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Seorang wanita tidak boleh dinikahi oleh bibi dari pihak ayah, dan juga tidak boleh dinikahi oleh bibi dari pihak ibu.\" {cite:muwatta-maruf-1997 p.38}"
