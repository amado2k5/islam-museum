text: "قد أجرنا من أجرت يا أم هانئ"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي مرة مولى عقيل أنه سمع أم هانئ بنت أبي طالب تقول، في باب صلاة الضحى: ذهبت إلى النبي عام الفتح فوجدته يغتسل وفاطمة ابنته تستره بثوب، فسلمت فسأل من هذه، فلما عرّفته بنفسها رحب بها، فلما فرغ من غسله قام فصلى ثماني ركعات ملتحفاً في ثوب واحد ثم انصرف، فأخبرته أن أخاها علياً زعم أنه قاتل رجلاً أجارته هي، فلان بن هبيرة، فقال النبي: قد أجرنا من أجرت يا أم هانئ؛ وقالت إن ذلك كان ضحى. ويخرّجه المحقق عند البخاري ⁦(280، 357، 3171، 6158)⁩ ومسلم (1/182) والنسائي (1/26) وابن حبان والدارمي وأحمد والطبراني من طرق أصحاب مالك، ويحيل على التمهيد (21/186). {cite:muwatta-maruf-1997 p.217}"
  tr: "Malik, Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, o da Akil'in azatlı kölesi Ebu Murra'dan rivayetle, Duha namazı bölümünde Ümmü Hani bint Ebu Talib'in şöyle dediğini işittiğini aktarmıştır: “Fetih yılında Peygamber'in yanına gittim ve onu kızı Fatıma ile birlikte yıkanırken, Fatıma'nın da onu bir elbiseyle örttüğünü gördüm. Ona selam verdim ve o da Fatıma'nın kim olduğunu sordu. Fatıma kendini tanıtınca onu karşıladı. Yıkandıktan sonra tek bir elbiseyle sarınarak sekiz rekat namaz kıldı ve sonra ayrıldı. Ümmü Hani, kardeşi Ali'nin, kendisinin koruma altına aldığı filanca ibn Hubeyra'yı öldürdüğünü iddia ettiğini söyledi. Peygamber, 'Ey Ümmü Hani, sen kime koruma sağladıysan biz de ona koruma sağladık' dedi. Ümmü Hani, bunun öğleden önce olduğunu söyledi.” Editör ayrıca, Malik'in arkadaşlarının rivayet zincirleri aracılığıyla, bu hadisi Buhari (280, 357, 3171, 6158), Müslim (1/182), Nesai (1/26), İbn Hibban, Darimi, Ahmed ve Taberani'nin derlemelerine de dahil etmiş ve Temhid'e (21/186) atıfta bulunmuştur. {cite:muwatta-maruf-1997 s.217}"
  id: "Malik meriwayatkannya dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Abu Murrah, budak yang dibebaskan oleh Aqil, yang mendengar Umm Hani bint Abi Talib berkata, dalam surah tentang shalat Duha: “Aku pergi menemui Nabi pada tahun Penaklukan dan mendapati beliau sedang mandi, dengan putrinya Fatimah menutupi beliau dengan sehelai kain. Aku memberi salam kepadanya, dan beliau bertanya siapa dia. Ketika dia memperkenalkan diri, beliau menyambutnya. Setelah selesai mandi, beliau berdiri dan shalat delapan rakaat, hanya mengenakan sehelai kain, lalu pergi. Dia memberi tahu beliau bahwa saudaranya Ali mengaku telah membunuh seorang pria yang telah dia lindungi, si fulan ibn Hubayrah. Nabi bersabda, ‘Kami telah memberikan perlindungan kepada siapa pun yang engkau lindungi, wahai Umm Hani.’ Dia berkata bahwa ini terjadi pada pagi hari.” Penyunting juga memasukkannya dalam koleksi al-Bukhari (280, 357, 3171, 6158), Muslim (1/182), al-Nasa'i (1/26), Ibn Hibban, al-Darimi, Ahmad, dan al-Tabarani melalui sanad para sahabat Malik, dan ia merujuk pada al-Tamhid (21/186). {cite:muwatta-maruf-1997 p.217}"
