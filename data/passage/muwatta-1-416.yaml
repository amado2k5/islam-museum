label: { ar: "الموطأ 416 — أم هانئ: قد أجرنا من أجرت يا أم هانئ", en: "Muwatta 416" }
text: "قد أجرنا من أجرت يا أم هانئ"
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن أبي مرة مولى عقيل أنه سمع أم هانئ بنت أبي طالب تقول، في باب صلاة الضحى: ذهبت إلى النبي عام الفتح فوجدته يغتسل وفاطمة ابنته تستره بثوب، فسلمت فسأل من هذه، فلما عرّفته بنفسها رحب بها، فلما فرغ من غسله قام فصلى ثماني ركعات ملتحفاً في ثوب واحد ثم انصرف، فأخبرته أن أخاها علياً زعم أنه قاتل رجلاً أجارته هي، فلان بن هبيرة، فقال النبي: قد أجرنا من أجرت يا أم هانئ؛ وقالت إن ذلك كان ضحى. ويخرّجه المحقق عند البخاري (280، 357، 3171، 6158) ومسلم (1/182) والنسائي (1/26) وابن حبان والدارمي وأحمد والطبراني من طرق أصحاب مالك، ويحيل على التمهيد (21/186). {cite:muwatta-maruf-1997 p.217}"
