label: { ar: "سنن النسائي 3369 — الحلال، الحرام", en: "Sunan al-Nasa'i 3369 — the lawful; the unlawful", ur: "سنن نسائی 3369 — حلال، حرام", es: "Sunan al-Nasa'i 3369 — lo lícito; lo ilícito", fr: "Sunan al-Nasa'i 3369 — le licite; l'illicite", tr: "Sunen an-Nesa'i 3369 — Helal, Haram", id: "Sunan an-Nasa'i 3369 — Halal, Haram" }
text: "أَخْبَرَنَا مُجَاهِدُ بْنُ مُوسَى، قَالَ حَدَّثَنَا هُشَيْمٌ، عَنْ أَبِي بَلْجٍ، عَنْ مُحَمَّدِ بْنِ حَاطِبٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" فَصْلُ مَا بَيْنَ الْحَلاَلِ وَالْحَرَامِ الدُّفُّ وَالصَّوْتُ فِي النِّكَاحِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3369، يذكر الحلال، والحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3369 (The Book of Marriage), that mentions the lawful, the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3369، جس میں حلال، حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3369 (El Libro del Matrimonio), menciona lo lícito y lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3369 (Le Livre du Mariage), mentionne ce qui est licite et ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sunan-ı Nesai'de yer alan 3369 numaralı hadis, helal ve haram olanı belirtmektedir. Bu hadis, Helal ve Haram Tarayıcısı tarafından Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3369, menyebutkan apa yang diperbolehkan dan diharamkan. Hadits ini dikumpulkan oleh Halal and Haram Browser bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan diharamkan."
