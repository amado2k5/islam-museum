label: { ar: "سنن النسائي 1312 — اليتيم وفقد الأب", en: "Sunan al-Nasa'i 1312 — the orphan and the father lost", ur: "سنن نسائی 1312 — یتیم اور باپ کی موت", es: "Sunan al-Nasa'i 1312 — El huérfano y el padre perdido", fr: "Sunan al-Nasa'i 1312 — L'orphelin et le père perdus" }
text: "… وَهُوَ ابْنُ مِغْوَلٍ - عَنْ طَلْحَةَ بْنِ مُصَرِّفٍ، عَنْ زَيْدِ بْنِ وَهْبٍ، عَنْ حُذَيْفَةَ، أَنَّهُ رَأَى رَجُلاً يُصَلِّي فَطَفَّفَ فَقَالَ لَهُ حُذَيْفَةُ مُنْذُ كَمْ تُصَلِّي هَذِهِ الصَّلاَةَ قَالَ مُنْذُ أَرْبَعِينَ عَامًا. قَالَ مَا صَلَّيْتُ مُنْذُ أَرْبَعِينَ سَنَةً وَلَوْ مِتَّ وَأَنْتَ تُصَلِّي هَذِهِ الصَّلاَةَ لَمِتَّ عَلَى غَيْرِ فِطْرَةِ مُحَمَّدٍ ثُمَّ قَالَ إِنَّ الرَّجُلَ لَيُخَفِّفُ وَيُتِمُّ وَيُحْسِنُ."
summary:
  ar: "حديث في سنن النسائي، رقم 1312، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1312 (The Book of Forgetfulness (In Prayer)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1312، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1312 (El Libro del Olvido (En la Oración)), menciona al huérfano y al padre desaparecido. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un hadith du Sunan an-Nasa'i, n° 1312 (Le Livre de l'oubli (dans la prière)), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
