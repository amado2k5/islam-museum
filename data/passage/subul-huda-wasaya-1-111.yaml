text: "فيما أخبر به الأحبار والرهبان والكهان بأنه النبي المبعوث في آخر الزمان قال ابن إِسحاق تعالى: عن عمر بن عبد العزيز قال: حُدِّثت عن سَلْمان أن صاحب عَمُورية قال لسَلْمان حين حضرته الوفاة: ائتِ غَيْضتين من غيض الشام، فإِن رجلاً …"
