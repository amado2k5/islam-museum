ref: "2619b"
label:
  ar: "مسلم 2619b — الرجل الذي أوصى بنيه أن يحرقوه خشية من الله"
  en: "Muslim 2619b — The man who told his sons to burn his body for fear of God"
  ur: "مسلم 2619b — وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی"
  es: "Muslim 2619b — El hombre que les dijo a sus hijos que quemaran su cuerpo por temor a Dios."
  fr: "Muslim 2619b — L'homme qui a dit à ses fils de brûler son corps par crainte de Dieu"
  tr: "Müslim 2619b — Allah korkusuyla oğullarına kendisini yakmalarını emreden adam"
  id: "Muslim 2619b — Orang yang memerintahkan anak-anaknya untuk membakarnya karena takut kepada Allah"
text: "أسرف رجل على نفسه فلما حضره الموت أوصى بنيه فقال إذا أنا مت فأحرقوني ثم اسحقوني ثم اذروني في الريح في البحر فوالله لئن قدر على ربي ليعذبني عذابا ما عذبه به أحدا . قال ففعلوا ذلك به فقال للأرض …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2619b: الرجل الذي أوصى بنيه أن يحرقوه خشية من الله. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2619b: The man who told his sons to burn his body for fear of God. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2619b: وہ آدمی جس نے اللہ کے خوف سے بیٹوں کو اپنے آپ کو جلانے کی وصیت کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2619b: El hombre que les dijo a sus hijos que quemaran su cuerpo por temor a Dios. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté dans Sahih Muslim, n° 2619b: L’homme qui ordonna à ses fils de brûler son corps par crainte de Dieu. Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2619b: Seorang pria yang memerintahkan anak-anaknya untuk membakarnya karena takut kepada Allah. Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan penyusun hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Muwatta."
