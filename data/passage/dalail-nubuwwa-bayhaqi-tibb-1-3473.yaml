  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 1. cildinin 3473. sayfasından, vücut organları, zehir ve panzehirden bahseden bir bölüm; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Bayhaqi “Bukti Kenabian,” jilid 1 bergambar, halaman 3473, yang menyebutkan organ-organ tubuh, racun dan penawarnya; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
