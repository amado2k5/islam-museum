text: "… في القتلى إلى اثر أنظروا قريشاً وأوباشهم فاحصدوهم.... أنظري يا حميراء إن لا تكوني أنت..... انفذ على رسلك حتى تنزل بساحتهم.... إنقادي علي بإذن اللّٰه تعالى إنقطاع أبهري من ذلك السم.. إنقع لها تمرا فإذا انغمر إنك آتيه وتطوف به …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3473، يذكر أعضاء البدن، والسم والترياق؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 1, p. 3473, that mentions the organs of the body, poison and antidote; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 1، ص 3473 کا اقتباس جس میں اعضائے بدن، زہر اور تریاق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
