text: |-
  •⁦(باب الميم)⁩.
  ٢٨٢
  من تراب البئر ويقال ذاك رجل من خان الناس وخان الناس على فعسلان وفعلان بالضم
  والفتح أى من رذالهم وانهان من الرماح الضعيف والخفمة مثل الخخنة وهو أن يتكام الرجل
  كأنه مخبون تكبرا وهو أيضانوع من الاكلق.يح والخمتم بالكسرنيت يعلف حبه الابل قال
  عنترة• تسف حب انجخم• ويقال هو بالحاءوغد يرخمّ اسم موضع بين مكة والمدينة بالخفة
  والحخام اسم رجل ⁦(خوم)⁩ انخامة الغضة الرطبمن النبات وو الحديث هثل المؤمن
  مثل الخامة من الززع تميلها الريح مرة هكذا ومرة هكذا قال الناعر
  اتما تحن مثل خامة نرع • فتى يأن يأت مختضده
  يم اخيمة بيت تبنيه العرب من عيدان الشهير والجمع خيمات وخيم م.ل بدرة وبدر
  وانلخيم مثل الخية وقال * فلم يق الا آل خيم منضد* والجمع خيام مثل فرخ وفراخ وخيه أى
  جعله كائلخيمة وخيم بالمكان أى أقام وقال • وكان انطلاق الشاعن حيث خيما وتخيم
  يمكان كذا ضرب خيمته به والخيم بالسكسر السحية والطبيعة لا واحدله من لفظه وخيم اسم
  جبل قال جرير * أقبلن من نجران أوجنبى خيم * وخام عنه يخيم خيمومة أى جبن وخمت
  رجلى خيما اذرفعتها وأنتد ثعلب
  رأواوقرة بالساف منى فحاولوا * جبورى لما أن رأونى أخمها
  صل الدال أم دأم الماء الشئ غمره وهو تفعل قال الراجز
  تحت ظلال الموج اذتدأ ما وبقال أيضا تدأم الفهل الناقة أى تجللها وتداء مه الامر
  بوفن تفاعله أى تزا كم عليه وتزاحم والدأماء البحر على فعلاه قال الافوه الاودىّ.
  والليل كلد أماء مستشعر • من دونهلونا كلون السدوس
  ودأمت انلحائطأى رفعته مثل دعمته ⁦(دحم)⁩ الدحم الدفع الشديدوبه شمى الرجل دحان
  ودحيما حسم الدحسمان بالضم قلب الدحسان وهوالادم السمين خشم
  دخشم اسم رجل. درم، درمت الارنب وغيرهاتدرم بالكسردر ماودرماودرمانا
  اذا قاريت انلخطا وصنسه سحى دارم بن مالك بن حنظلة بن مالك بن زيد مناة بن تميم وكان يسمى
  بجراوذلك أن أباه أتاه قوم فى هالة فقال له يابحرائننى بخر يطة وكان فيها مال فجاءه نماها
  وهو يدرم تحتها من ثقلها وقال أبوزيد درمت الداية اذاديت دييبا والدرم فى السكعب أن
  يواريه اللحم حتى لا يكون له حجم وكعب أدرم وقد درم بالنكسر والمرأة درماء وقال
  قامت تريك خشية أن تصرما * ساقايخنداة وكعا أدرما
  ومرافهادرم والدرماء نبت من الحض والدرماء الارنب ودرمت أسنان الرجل بالكسر
  أى تحاتت وهو أدرم ودرع درمة أى لينة متسقة والادرم من العراقيب الذى عظمت ابرته
  وبنو الادرم قبيلة وأدرمت الأبل للاجذاع ذا ذهبت رواضعها وطلع غيرها والدردم
  الناقة المسنة والدرّامة المرأة القصيرة قال الشاعر
  •ن البيض لادرّامة قلية * تذنساء الناس دلا وهيسما
  ودرم بكسر الراءاسم رجل من بى شيءان فى قول الاعشى أودى درم* لانه قتسل ولم
  يدرك بثأره وقال المؤرّج فقدكما فقد القارظ العنزى" ⁦(درخم)⁩ الدرخين الداهية بوزن
