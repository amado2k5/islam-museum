text: "… شامة في السنة الماضية، وهو أضبط لأنه شهد جنازته بمصر، وأما ابن الساعي فانه ذكره في هذه السنة، وقال إنه كان حظياً عند الكامل محمد صاحب مصر، وإنه كان قد نظم أرجوزة في القراءات السبع، ونظم ألفاظ الجمهرة، وكان قد …"
