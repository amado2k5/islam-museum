label: { ar: "سنن ابن ماجه 2314 — الأجران", en: "Sunan Ibn Majah 2314 — the double reward", ur: "سنن ابن ماجہ 2314 — دوہرا اجر", es: "Sunan Ibn Majah 2314: la doble recompensa", fr: "Sunan Ibn Majah 2314 — la double récompense", tr: "Sünen İbni Mace 2314 — İki Ödül", id: "Sunan Ibnu Majah 2314 — Dua Pahala" }
text: "… عَنْ بُسْرِ بْنِ سَعِيدٍ، عَنْ أَبِي قَيْسٍ، - مَوْلَى عَمْرِو بْنِ الْعَاصِ - عَنْ عَمْرِو بْنِ الْعَاصِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" إِذَا حَكَمَ الْحَاكِمُ فَاجْتَهَدَ فَأَصَابَ فَلَهُ أَجْرَانِ وَإِذَا حَكَمَ فَاجْتَهَدَ فَأَخْطَأَ فَلَهُ أَجْرٌ \". قَالَ يَزِيدُ فَحَدَّثْتُ بِهِ أَبَا بَكْرِ بْنَ عَمْرِو بْنِ حَزْمٍ، فَقَالَ هَكَذَا حَدَّثَنِيهِ أَبُو سَلَمَةَ، عَنْ أَبِي هُرَيْرَة.َ"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2314، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 2314 (The Chapters on Rulings), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2314، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 2314 (Los capítulos sobre las normas), habla de la doble recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 2314 (Les chapitres sur les décisions), évoque la double récompense. Le Livre des Hasanat et Sayyi'at la recense parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 2314 numaralı hadis, iki tür mükafattan bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2314, menyebutkan dua pahala. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
