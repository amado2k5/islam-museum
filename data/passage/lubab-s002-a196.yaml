text: "وأتموا الحج والعمرة لله أخرج ابن أبي حاتم عن صفوان ابن أمية قال جاء رجل إلى النبي متضخما بالزعفران عليه جبة فقال كيف تأمرني يا رسول الله في عمرتي فأنزل الله وأتموا الحج والعمرة لله فقال أين السائل عن العمرة قال"
