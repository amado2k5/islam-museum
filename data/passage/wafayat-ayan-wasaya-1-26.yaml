text: "… وبعدها ميم وبعد الألفِ نون. وكانت ولادة أبي عبيد اللّه معاوية الأشعري في سنة مائة، وتوفي سنة سبعين ومائة، وقيل في سنة تسع وستين، وقيل مات في الوقت الذي مات فيه موسى الهادي، وكانت وفاته ببغداد، ودفن في مقابر قريش. …"
