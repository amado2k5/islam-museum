label: { ar: "الموطأ 468 — ابن عمر لواسع بن حبان: انصرف حيث شئت عن يمينك أو يسارك", en: "Muwatta 468", es: "Muwatta 468", fr: "Muwatta 468", ur: "موطا 468", tr: "El-Muvatta 468 — İbn Ömer'den Vasi' ibn Hibban'a: Dilediğin yere dön, sağa ya da sola.", id: "Al-Muwatta 468 — Ibn Umar kepada Wasi’ ibn Hibban: Berpalinglah ke mana pun kau mau, ke kanan atau ke kiri" }
text: "إن قائلاً يقول: انصرف على يمينك، فإذا كنت تصلي فانصرف حيث شئت، إن شئت على يمينك وإن شئت على يسارك"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان عن عمه واسع بن حبان، في باب العمل في جامع الصلاة: كان يصلي وعبد الله بن عمر مسند ظهره إلى جدار القبلة، فلما قضى صلاته انصرف إليه من قبل شقه الأيسر، فسأله ابن عمر ما منعه أن ينصرف عن يمينه، فأجاب أنه رآه فانصرف إليه، فقال ابن عمر إنه أصاب، وإن قائلاً يقول انصرف على يمينك، وإنما ينصرف المصلي حيث شاء عن يمينه أو يساره. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.240}"
  tr: "Malik'in, Yahya ibn Sa'id'den, o da Muhammed ibn Yahya ibn Hibban'dan, o da amcası Wasi' ibn Hibban'dan rivayet ettiği, namaz sırasında mescitteki davranışlar bölümünde yer alan bir rivayete göre: Abdullah ibn Umar namaz kılıyordu ve sırtını kıble duvarına yaslamıştı. Namazını bitirdiğinde, sol tarafından ona döndü. İbn Umar ona neden sağa dönmediğini sordu ve o da onu gördüğünü ve ona döndüğünü söyledi. İbn Umar, doğru olanı yaptığını ve birinin sağa dönmesini söylediğini, ancak namaz kılanın dilediği yere, sağa veya sola dönebileceğini söyledi. Araştırmacı, bu rivayetin Ebu Mus'ab ve Suwaid tarafından Malik'ten nakledildiğini belirtiyor. {cite:muwatta-maruf-1997 s.240}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Yahya ibn Sa'id, dari Muhammad ibn Yahya ibn Hibban, dari pamannya Wasi' ibn Hibban, dalam bab tentang tindakan di masjid saat shalat: Beliau sedang shalat, dan Abdullah ibn Umar sedang menyandarkan punggungnya ke dinding kiblat. Setelah selesai shalat, beliau menoleh ke arah Abdullah ibn Umar dari sisi kirinya. Ibn Umar bertanya mengapa beliau tidak menoleh ke kanan, dan Abdullah ibn Umar menjawab bahwa beliau telah melihatnya dan menoleh ke arahnya. Ibn Umar berkata bahwa beliau telah melakukan hal yang benar, dan bahwa seseorang telah mengatakan untuk menoleh ke kanan, tetapi orang yang beribadah boleh menoleh ke mana pun ia mau, ke kanan atau ke kiri. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.240}"
