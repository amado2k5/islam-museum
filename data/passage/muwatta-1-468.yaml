label: { ar: "الموطأ 468 — ابن عمر لواسع بن حبان: انصرف حيث شئت عن يمينك أو يسارك", en: "Muwatta 468" }
text: "إن قائلاً يقول: انصرف على يمينك، فإذا كنت تصلي فانصرف حيث شئت، إن شئت على يمينك وإن شئت على يسارك"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد عن محمد بن يحيى بن حبان عن عمه واسع بن حبان، في باب العمل في جامع الصلاة: كان يصلي وعبد الله بن عمر مسند ظهره إلى جدار القبلة، فلما قضى صلاته انصرف إليه من قبل شقه الأيسر، فسأله ابن عمر ما منعه أن ينصرف عن يمينه، فأجاب أنه رآه فانصرف إليه، فقال ابن عمر إنه أصاب، وإن قائلاً يقول انصرف على يمينك، وإنما ينصرف المصلي حيث شاء عن يمينه أو يساره. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.240}"
