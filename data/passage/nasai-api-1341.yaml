text: "… مَنْصُورٍ، عَنْ سُفْيَانَ، قَالَ سَمِعْتُهُ مِنْ، عَبْدَةَ بْنِ أَبِي لُبَابَةَ وَسَمِعْتُهُ مِنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، كِلاَهُمَا سَمِعَهُ مِنْ، وَرَّادٍ، كَاتِبِ الْمُغِيرَةِ بْنِ شُعْبَةَ قَالَ كَتَبَ مُعَاوِيَةُ إِلَى الْمُغِيرَةِ بْنِ شُعْبَةَ أَخْبِرْنِي بِشَىْءٍ، سَمِعْتَهُ مِنْ، رَسُولِ اللَّهِ صلى الله عليه وسلم ‏.‏ فَقَالَ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِذَا قَضَى الصَّلاَةَ قَالَ ‏ \"‏ لاَ إِلَهَ إِلاَّ اللَّه …"
summary:
  ar: "في السنن النسائي؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan al-Nasa'i; sending a letter or message to a party."
  ur: "سنن النسائی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
