text: "… الروم وجملة من كان مع السلطان يقاربون عشرين الفا وأما ملك الروم فانه كان معه خمسة وثلاثون الفامن الافريج وخمسة وثلاثون الفا..... فى ما ثتين بطريق ومتقدم مع كل رجل منهم بين الفى فارس الى خمسمائة وكان معه خمسة عشر …"
