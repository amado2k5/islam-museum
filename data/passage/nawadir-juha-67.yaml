text: "… نادوا غيري يُلَقِّنُهُ مات حاكم سيوري حصار وكانت بينه وبين جحا خصومةٌ فلما أرادوا دفنَهُ طلبوا جحا ورَجَوْا منه أنْ يُلَقِّنَهُ بعد الدفن. فأجابهم: لا، ابحثوا عن رجلٍ غيري يُلَقَّنُهُ فإِنَّهُ لا يُصْغِي لِكلامي لِمَا بينَنا مِنَ المشاجرةِ التي تعرفونها. …"
summary:
  ar: "لما مات حاكم سيوري حصار طلب الناس من جحا أن يصلي عليه، فرفض بسبب خصومة بينهما وطلب منهم أن يبحثوا عن رجل غيره. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  en: "When the ruler of Siwri Hisar dies, the people ask Juha to say the funeral prayer for him, and Juha refuses because of their feud, asking them to find another man. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  ur: "جب سیوری حصار کا حاکم مر گیا تو لوگوں نے جحا سے اس کی نماز جنازہ پڑھانے کو کہا، اور اس نے باہمی دشمنی کی وجہ سے انکار کر دیا اور ان سے کہا کہ کوئی اور آدمی ڈھونڈ لو۔ {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  fr: "À la mort du gouverneur de Siwri Hisar, les gens demandent à Juha de dire la prière funéraire pour lui ; Juha refuse à cause de leur querelle et leur demande de trouver un autre homme. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
  es: "Cuando muere el gobernante de Siwri Hisar, la gente le pide a Juha que rece la oración fúnebre por él, y Juha se niega a causa de su enemistad y les pide que busquen a otro hombre. {cite:juha-nawadir-kubra-djuwaydi p. 37}"
