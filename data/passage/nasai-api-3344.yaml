label: { ar: "سنن النسائي 3344 — مضاعفة الأجر", en: "Sunan al-Nasa'i 3344 — the reward doubled or multiplied", ur: "سنن نسائی 3344 — اجر کا دوگنا یا کئی گنا ہونا", es: "Sunan al-Nasa'i 3344 — la recompensa se duplica o multiplica", fr: "Sunan al-Nasa'i 3344 — la récompense doublée ou multipliée", tr: "Sunan an-Nasa'i 3344 — Sevabı katlamak", id: "Sunan an-Nasa'i 3344 — Melipatgandakan pahala" }
text: "… بْنُ إِبْرَاهِيمَ، قَالَ حَدَّثَنَا ابْنُ أَبِي زَائِدَةَ، قَالَ حَدَّثَنِي صَالِحُ بْنُ صَالِحٍ، عَنْ عَامِرٍ، عَنْ أَبِي بُرْدَةَ بْنِ أَبِي مُوسَى، عَنْ أَبِي مُوسَى، قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثَةٌ يُؤْتَوْنَ أَجْرَهُمْ مَرَّتَيْنِ رَجُلٌ كَانَتْ لَهُ أَمَةٌ فَأَدَّبَهَا فَأَحْسَنَ أَدَبَهَا وَعَلَّمَهَا فَأَحْسَنَ تَعْلِيمَهَا ثُمَّ أَعْتَقَهَا وَتَزَوَّجَهَا وَعَبْدٌ يُؤَدِّي حَقَّ اللَّهِ وَحَقَّ مَوَالِيهِ وَمُؤْمِنُ أَهْلِ الْكِتَابِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3344، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3344 (The Book of Marriage), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3344، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3344 (El Libro del Matrimonio), habla de la recompensa duplicada o multiplicada. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3344 (Le Livre du Mariage), mentionne une récompense doublée ou multipliée. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, écrivent, effacent ou évaluent un acte."
  tr: "Sunan-ı Nesai'de 3344 numaralı hadis, sevabın katlanarak artırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3344, menyebutkan tentang penggandaan pahala. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
