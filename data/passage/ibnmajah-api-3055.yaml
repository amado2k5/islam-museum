label: { ar: "سنن ابن ماجه 3055 — الحرام", en: "Sunan Ibn Majah 3055 — the unlawful", ur: "سنن ابن ماجہ 3055 — حرام", es: "Sunan Ibn Majah 3055 – lo ilegal", fr: "Sunan Ibn Majah 3055 - l'illégal", tr: "Sünen İbni Mace 3055 — Haram", id: "Sunan Ibnu Majah 3055 — Al-Haram" }
text: "… أَلاَ أَىُّ يَوْمٍ أَحْرَمُ \". ثَلاَثَ مَرَّاتٍ قَالُوا يَوْمُ الْحَجِّ الأَكْبَرِ. قَالَ \" فَإِنَّ دِمَاءَكُمْ وَأَمْوَالَكُمْ وَأَعْرَاضَكُمْ بَيْنَكُمْ حَرَامٌ كَحُرْمَةِ يَوْمِكُمْ هَذَا فِي شَهْرِكُمْ هَذَا فِي بَلَدِكُمْ هَذَا أَلاَ لاَ يَجْنِي جَانٍ إِلاَّ عَلَى نَفْسِهِ وَلاَ يَجْنِي وَالِدٌ عَلَى وَلَدِهِ وَلاَ مَوْلُودٌ عَلَى وَالِدِهِ. أَلاَ إِنَّ الشَّيْطَانَ قَدْ أَيِسَ أَنْ يُعْبَدَ فِي بَلَدِكُمْ هَذَا أَبَدًا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3055، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 3055 (Chapters on Hajj Rituals), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3055، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3055 (Capítulos sobre los rituales del Hajj), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 3055 (Chapitres sur les rites du Hajj), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "İbn Mâce Sünen'inde yer alan 3055 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve Haram tarayıcısının bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden alınan metinleri bir araya getirmektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 3055, menyebutkan apa yang dilarang. Bagian dari peramban Halal dan Haram ini menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
