  tr: "Al-Lalaka'i'nin Sünni inancının esaslarını açıklayan eserinin 1. cildinin 70. sayfasından, her Müslüman için farz olan şeylerden bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir versiyondan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar hakkında bilgi içermektedir."
  id: "Cuplikan dari penjelasan Al-Lalaka'i tentang dasar-dasar keyakinan Sunni, Jilid 1, halaman 70, yang menyebutkan apa yang wajib bagi setiap Muslim. Cuplikan ini berasal dari versi pindaian yang dapat dibaca mesin, dan teksnya merupakan cuplikan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Ini mencakup informasi tentang amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
