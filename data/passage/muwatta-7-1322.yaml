label: { ar: "الموطأ 1322 — أبو هريرة في خيبر: مدعم عبد رفاعة بن زيد أصابه سهم فقال الناس هنيئا له الجنة، فقال النبي إن الشملة لتشتعل عليه نارا", en: "Muwatta 1322" }
text: "شِرَاكٌ أوْ شِرَاكانِ مِن نَارِ"
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي عن أبي الغيث سالم مولى ابن مطيع عن أبي هريرة أنه قال خرجنا مع رسول الله عام خيبر، فلم نغنم ذهبا ولا ورقا، إلا الأموال والثياب والمتاع. فأهدى رفاعة بن زيد لرسول الله غلاما أسود يقال له مدعم، فوجه إلى وادي القرى، فبينما مدعم يحط رحل رسول الله إذ جاءه سهم عائر فقتله، فقال الناس هنيئا له الجنة، فقال رسول الله كلا والذي نفسي بيده، إن الشملة التي أخذ يوم خيبر من المغانم لم تصبها المقاسم لتشتعل عليه نارا. فلما سمع الناس ذلك جاء رجل بشراك أو شراكين فقال شراك أو شراكان من نار. ويذكر المحقق أن ابن عبد البر لم يحفظه مسندا بوجه. {cite:muwatta-maruf-1997 p.591}"
