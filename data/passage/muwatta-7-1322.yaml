label: { ar: "الموطأ 1322 — أبو هريرة في خيبر: مدعم عبد رفاعة بن زيد أصابه سهم فقال الناس هنيئا له الجنة، فقال النبي إن الشملة لتشتعل عليه نارا", en: "Muwatta 1322", es: "Muwatta 1322", fr: "Muwatta 1322", ur: "موطا 1322", tr: "El-Muvatta 1322 — Hayber'de Ebu Hurayra: Rifa'ah ibn Zeyd'in kölesi Mud'am'a bir ok isabet etti ve insanlar, \"Cennete gireceği için ona tebrikler!\" dediler. Fakat Peygamber, \"Üzerindeki elbise alev alev yanıyor\" dedi.", id: "Al-Muwatta 1322 — Abu Hurairah di Khaybar: Mud’am, budak Rifa’ah ibn Zayd, terkena panah, dan orang-orang berkata, “Selamat kepadanya atas masuknya ke Surga!” Tetapi Nabi bersabda, “Jubah yang dikenakannya terbakar api.”" }
text: "شِرَاكٌ أوْ شِرَاكانِ مِن نَارِ"
summary:
  ar: "يروي مالك عن ثور بن زيد الديلي عن أبي الغيث سالم مولى ابن مطيع عن أبي هريرة أنه قال خرجنا مع رسول الله عام خيبر، فلم نغنم ذهبا ولا ورقا، إلا الأموال والثياب والمتاع. فأهدى رفاعة بن زيد لرسول الله غلاما أسود يقال له مدعم، فوجه إلى وادي القرى، فبينما مدعم يحط رحل رسول الله إذ جاءه سهم عائر فقتله، فقال الناس هنيئا له الجنة، فقال رسول الله كلا والذي نفسي بيده، إن الشملة التي أخذ يوم خيبر من المغانم لم تصبها المقاسم لتشتعل عليه نارا. فلما سمع الناس ذلك جاء رجل بشراك أو شراكين فقال شراك أو شراكان من نار. ويذكر المحقق أن ابن عبد البر لم يحفظه مسندا بوجه. {cite:muwatta-maruf-1997 p.591}"
  tr: "Malik, Sevr ibn Zeyd el-Dili'den, o da İbn Muti'nin azatlı kölesi Ebu el-Gays Salim'den, o da Ebu Hurayra'dan rivayet eder ki, şöyle demiştir: \"Hayber yılında Resulullah ile birlikte yola çıktık ve altın ya da gümüş kazanamadık, sadece para, elbise ve mal elde ettik. Rifa'ah ibn Zeyd, Resulullah'a Mad'am adında siyah bir köle hediye etti ve onu Vadi el-Kura'ya gönderdi. Mad'am, Resulullah'ın eyerini indirirken, bir ok isabet etti ve onu öldürdü. İnsanlar, 'Cennete gireceği için tebrikler!' dediler. Fakat Resulullah, 'Hayır, canım elinde olan Allah'a yemin ederim ki, Hayber günü ganimetten aldığı ve dağıtılmayan o elbise onun üzerine ateş yakacaktır.' dedi.\" İnsanlar bunu duyunca, bir iki sandalet kayışıyla bir adam geldi ve 'Bir iki sandalet kayışı ateşten' dedi. Araştırmacı, İbn Abdül-Barr'ın bunu bir rivayet zinciriyle korumadığını belirtiyor. {cite:muwatta-maruf-1997 s.591}"
  id: "Malik meriwayatkan dari Thawr ibn Zayd al-Dili, dari Abu al-Ghayth Salim, budak yang dibebaskan oleh Ibn Muti', dari Abu Hurayrah, yang berkata: \"Kami pergi bersama Rasulullah pada tahun Khaybar, dan kami tidak mendapatkan emas atau perak, hanya uang, pakaian, dan barang-barang. Rifa'ah ibn Zayd memberikan kepada Rasulullah seorang budak berkulit hitam bernama Mad'am, dan beliau mengirimnya ke Wadi al-Qura. Ketika Mad'am sedang menurunkan pelana Rasulullah, sebuah anak panah meleset dan membunuhnya. Orang-orang berkata, 'Selamat kepadanya atas surga!' Tetapi Rasulullah bersabda, 'Tidak, demi Dia yang jiwaku berada di tangan-Nya, jubah yang diambilnya dari rampasan perang pada hari Khaybar, yang tidak dibagikan, akan menyulut api padanya.'\" Ketika orang-orang mendengar ini, seorang pria datang dengan satu atau dua tali sandal dan berkata, 'Satu atau dua tali sandal api.' Peneliti menyebutkan bahwa Ibnu 'Abd al-Barr tidak mencatatnya dengan sanad. {cite:muwatta-maruf-1997 p.591}"
