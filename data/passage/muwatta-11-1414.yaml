label: { ar: "الموطأ 1414 — نافع: رمى طائرين بحجر بالجرف فأصابهما، فمات أحدهما فطرحه ابن عمر، ومات الآخر قبل أن يذكيه فطرحه", en: "Muwatta 1414" }
summary:
  ar: "يروي مالك عن نافع أنه قال رميت طائرين بحجر وأنا بالجرف، فأصبتهما، فأما أحدهما فمات، فطرحه عبد الله بن عمر، وأما الآخر فذهب عبد الله بن عمر يذكيه بقدوم، فمات قبل أن يذكيه، فطرحه عبد الله أيضا. {cite:muwatta-maruf-1997 p.635}"
