label: { ar: "الموطأ 1414 — نافع: رمى طائرين بحجر بالجرف فأصابهما، فمات أحدهما فطرحه ابن عمر، ومات الآخر قبل أن يذكيه فطرحه", en: "Muwatta 1414", es: "Muwatta 1414", fr: "Muwatta 1414", ur: "موطا 1414", tr: "El-Muvatta 1414 — Nafi’: Kıyıdaki iki kuşa taş attı ve ikisi de isabet etti. Kuşlardan biri öldü, İbn Ömer taşı attı. Diğeri ise kesmeden önce öldü, onu da attı.", id: "Al-Muwatta 1414 — Nafi’: Dia melempar batu ke arah dua burung di tepi sungai dan mengenai keduanya. Salah satu burung mati, lalu Ibnu Umar membuangnya. Burung yang lain mati sebelum sempat disembelih, lalu dia membuangnya." }
summary:
  ar: "يروي مالك عن نافع أنه قال رميت طائرين بحجر وأنا بالجرف، فأصبتهما، فأما أحدهما فمات، فطرحه عبد الله بن عمر، وأما الآخر فذهب عبد الله بن عمر يذكيه بقدوم، فمات قبل أن يذكيه، فطرحه عبد الله أيضا. {cite:muwatta-maruf-1997 p.635}"
  tr: "Malik, Nafi’den rivayetle şöyle der: “Nehir kıyısında iki kuşa taş attım, ikisine de isabet etti. Kuşlardan biri öldü, Abdullah ibn Umar onu attı. Diğerine gelince, Abdullah ibn Umar onu baltayla kesmeye gitti, ama kesemeden öldü, Abdullah onu da attı.” {cite:muwatta-maruf-1997 s.635}"
  id: "Malik meriwayatkan dari Nafi’ bahwa ia berkata: “Aku melempar batu ke arah dua ekor burung ketika aku berada di tepi sungai, dan batu itu mengenai keduanya. Salah satu burung mati, lalu Abdullah ibn Umar membuangnya. Adapun burung yang satunya, Abdullah ibn Umar hendak menyembelihnya dengan kapak, tetapi burung itu mati sebelum ia sempat melakukannya, lalu Abdullah juga membuangnya.” {cite:muwatta-maruf-1997 p.635}"
