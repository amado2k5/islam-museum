label: { ar: "سنن أبي داود 294 — الأب والأبوة", en: "Sunan Abi Dawud 294 — the father and fatherhood", ur: "سنن ابی داؤد 294 — باپ اور والدیت", es: "Sunan Abi Dawud 294 — El padre y la paternidad", fr: "Sunan Abi Dawud 294 — le père et la paternité" }
text: "حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُعَاذٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتِ اسْتُحِيضَتِ امْرَأَةٌ عَلَى عَهْدِ رَسُولِ اللَّهِ فَأُمِرَتْ أَنْ تُعَجِّلَ الْعَصْرَ وَتُؤَخِّرَ الظُّهْرَ وَتَغْتَسِلَ لَهُمَا غُسْلاً. وَأَنْ تُؤَخِّرَ الْمَغْرِبَ وَتُعَجِّلَ الْعِشَاءَ وَتَغْتَسِلَ لَهُمَا غُسْلاً وَتَغْتَسِلَ لِصَلاَةِ الصُّبْحِ غُسْلاً. فَقُلْتُ لِعَبْدِ الرَّحْمَنِ أَعَنِ النَّبِيِّ فَقَالَ لاَ أُحَدِّثُكَ عَنِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 294، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 294 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 294، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 294 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 294 (Purification (Kitab Al-Taharah)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
