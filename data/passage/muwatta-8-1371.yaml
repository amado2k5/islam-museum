label: { ar: "الموطأ 1371 — مالك: أحسن ما سمع في الثنيا أنها لصاحبها ما لم يقطع كلامه، فإذا سكت وقطع كلامه فلا ثنيا له", en: "Muwatta 1371", es: "Muwatta 1371", fr: "Muwatta 1371", ur: "موطا 1371", tr: "El-Muvatta 1371 — Malik: Vekaletle ilgili duyduğum en iyi görüş, konuşmasını kesmediği sürece vekaletin sahibine ait olduğudur. Eğer susar ve konuşmasını keserse, vekaleti olmaz.", id: "Al-Muwatta 1371 — Malik: Pendapat terbaik yang pernah saya dengar mengenai penugasan adalah bahwa penugasan itu menjadi milik pemiliknya selama ia tidak menyela pembicaraannya. Jika ia diam dan menyela pembicaraannya, maka ia tidak memiliki penugasan." }
summary:
  ar: "يقول مالك أحسن ما سمعه في الثنيا أنها لصاحبها ما لم يقطع كلامه، وما كان من ذلك نسقا يتبع بعضه بعضا قبل أن يسكت، فإذا سكت وقطع كلامه فلا ثنيا له. {cite:muwatta-maruf-1997 p.613}"
  tr: "Malik, görevlendirme hakkında duyduğu en iyi şeyin, konuşmasını kesmediği sürece sahibine ait olması ve bunun da konuşması durmadan önce birbirini izleyen bir dizi sözden oluşması olduğunu söylüyor. Ancak eğer konuşmayı keser ve kesintiye uğratırsa, o zaman görevlendirme onun için geçerli olmaz. {cite:muwatta-maruf-1997 s.613}"
  id: "Malik mengatakan bahwa hal terbaik yang dia dengar tentang penugasan sementara itu adalah bahwa penugasan itu menjadi milik pemiliknya selama dia tidak menyela pidatonya, dan pidatonya merupakan rangkaian yang berurutan sebelum dia berhenti. Tetapi jika dia berhenti dan menyela pidatonya, maka penugasan sementara itu tidak berlaku untuknya. {cite:muwatta-maruf-1997 p.613}"
