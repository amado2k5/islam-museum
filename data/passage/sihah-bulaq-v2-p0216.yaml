text: |-
  ٣٧١
  الاسد أبوعر والتخوّن التعهديقال المى تخونه أى تعهده وأنشدلذى الرمة
  لا ينعسْ العارف الاماتخونه • داع يناديه بامم الماء مبغوم
  يقول الغزال ناعس لا يرفع طرقه الا أن تجءأمّه وهى المتعهدة له ويقال الاماتنقص نوصه
  دعاء أمه له والتخوّن أيضا التنقص يقال تخوّنى فلان حتى اذا تنقصك قال ذو الرمّة
  لابل هو النوق مِن دار تخوّنها * مزاسحاب ومزابارح زب
  وقال لبيذ
  عذافرة تقمص بالردافى • تخونانزولى وارتحالى
  أى تنقص +ها وشحمها والخوان بالكسر الذى يؤكل عايه معزب وثلاثة أخونة والسكثير
  خون ولا ينقل كراهية الضمة على الواو والخان الذى للتجار
  ⁦( خصل الدال)⁩: {⁦(ثن)⁩ الدثينة موضع وهو ماء لبن سيارين عمروقال النابغة
  الذييانى وعلى الدمينة من سكين حاضر • وعلى الدئينة من بى سيار
  ويقال انها كانت تسجى فى الجاهلية الدفينة تم تطير وامنها فسموها الدئينسة ⁦(دجن)⁩
  الدجن الباس الغيم السماء وقددجن يومنايدجسن بالضم دجناود جونا قال أبوزيد
  والدجفة من الغيم المطبق تطبيقا الريان المظلم الذى ليس فيه مطر مقال يوم دجن ويوم دجنة
  بالتشديد قال وكذلك الليلة على الوجهين بالوصف والاضافة قال والداجنة الماطرة المطبقة
  نحو الديمة قال والدجن المطر السكثير وسداية داجنة ومدجنة وأدجنت السعاء دام مطرها
  قال لبيد من كل سارية وغاد مدجن * وعشية متجاوب ارزامها
  والدجنة بالضم الظلمة والجمع دجن ودجنات والدحنة فى ألوان الابل أقيح السوادية ال بعير
  أدجن وناقة دجناء ودجن بالمكان دجونا أقام به وأدجن مثله ابن السكيت شاة داجن
  وراجن اذا الغت اليوت واستأنست قال ومن العرب من يقواها بالهاء وكذلك غه
  الشاة قال لبيد حتى اذا يئس الرماة وأرسلوا * غضفاد واجن فافلا أعصامها .
  أرادبه كلاب الصيدوالمداجنة كالمداهنة وأبوديائة كنية سماك بن خرشة الانصارى
  حن أبو عمر والدحن ائلبّ الجبيث مثل الدحل والدحن أيضا السمين المنداق
  البطن القصير قال والدحونة مثله وأنشد
  دحونة مكردس بلندح : اذايرادشر يكرح
  وقد دحن يدحن ( دخن دحان التار معروف والجمع دواخن كما فالواعثان وعواثن
  على غيرقيلس وابتادخان عنى وباهلة والدخن أيضا الدحان قال الاعشى
  تبارى الزجاج مغاديرها * شماطيط فى رهج كالدخن
  ومنهحدنة على دخن أى سكون اءلة لالصلح والدخن أيضا الكدورة الى السواد قال
  المعطل الهذلى بصف سفا
  ليزحام لايليق ضريبة • فى متنه دخن وأثرأسلس
  ودخنت النارتد خن وتدخن ارتضسع دحّانها واتخمّت مثله على افتعلت ودخذت النار
  |بالكسبراذا ألقيت عليها حطبا وأفسدتها حتى بهيج لذلك دخان ودخن الطبيخ أيضااذا
  تدخنت القدر ورجل دخن الخاق والدخن الهاورس والدخنة كالذريرة تدخن بها البيوت
