label: { ar: "الموطأ 164 — صبي يبول على ثوب النبي فيُتبعه الماء", en: "Muwatta 164", es: "Muwatta 164", fr: "Muwatta 164", ur: "موطا 164", tr: "El-Muvatta 164 — Bir çocuk Peygamberin elbisesine işer ve ardından su akar.", id: "Al-Muwatta 164 — Seorang anak laki-laki mengencingi pakaian Nabi, dan air mengikutinya." }
text: "أتي رسول الله بصبي فبال على ثوبه، فدعا بماء فأتبعه إياه"
summary:
  ar: "أول حديث في باب ما جاء في بول الصبي. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة: أُتي النبي بصبي فبال على ثوبه، فدعا بماء فصبّه على أثر البول ولم يغسله غسلاً. ويخرّجه المحقق عند البخاري (222) والنسائي (1/157) والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/135). {cite:muwatta-maruf-1997 p.109}"
  id: "Hadits pertama dalam bab ini adalah tentang apa yang diriwayatkan mengenai air kencing anak laki-laki. Diriwayatkan oleh Yahya dari Malik, dari Hisham ibn Urwah, dari ayahnya, dari Aisyah: Seorang anak laki-laki dibawa kepada Nabi (shalawat dan salam kepadanya) dan ia buang air kecil di pakaiannya. Maka beliau meminta air dan menuangkannya ke tempat yang terkena air kencing tersebut, tanpa mencucinya sampai bersih. Editor memasukkannya dalam kumpulan hadits al-Bukhari (222), al-Nasa'i (1/157), al-Tahawi, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (22/135). {cite:muwatta-maruf-1997 p.109}"
