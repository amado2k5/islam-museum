label: { ar: "الموطأ 164 — صبي يبول على ثوب النبي فيُتبعه الماء", en: "Muwatta 164" }
text: "أتي رسول الله بصبي فبال على ثوبه، فدعا بماء فأتبعه إياه"
summary:
  ar: "أول حديث في باب ما جاء في بول الصبي. يرويه يحيى عن مالك عن هشام بن عروة عن أبيه عن عائشة: أُتي النبي بصبي فبال على ثوبه، فدعا بماء فصبّه على أثر البول ولم يغسله غسلاً. ويخرّجه المحقق عند البخاري (222) والنسائي (1/157) والطحاوي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (22/135). {cite:muwatta-maruf-1997 p.109}"
