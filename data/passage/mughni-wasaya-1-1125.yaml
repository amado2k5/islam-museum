text: "… من أربع، فى عقد واحد، أن فى عقود متفرقة، ثم أصابهن، ثم أسلم، ثم أسلمت لو أسلم عبد، وتحته زوجتان، قد دخل بهما، فاسلمتا فى العدة، فهما زوجتاه، ولو كن لو خالعها فى مرض موته، واوصى لها باكثر مما كانت …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 1، ص 1125، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 1, p. 1125, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 1، ص 1125 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
