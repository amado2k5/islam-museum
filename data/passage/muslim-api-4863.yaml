label: { ar: "صحيح مسلم 4863 — «لولا أن أشق على أمتي»", en: "Sahih Muslim 4863 — 'were it not that I would burden my community'", ur: "صحیح مسلم 4863 — «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا»", fr: "Sahih Muslim 4863 — « si je ne craignais d'accabler ma communauté »", es: "Sahih Muslim 4863 — «si no temiera agobiar a mi comunidad»" }
text: "… اللَّهِ ثُمَّ تَكُونُ يَوْمَ الْقِيَامَةِ كَهَيْئَتِهَا إِذَا طُعِنَتْ تَفَجَّرُ دَمًا اللَّوْنُ لَوْنُ دَمٍ وَالْعَرْفُ عَرْفُ الْمِسْكِ \". وَقَالَ رَسُولُ اللَّهِ \" وَالَّذِي نَفْسُ مُحَمَّدٍ فِي يَدِهِ لَوْلاَ أَنْ أَشُقَّ عَلَى الْمُؤْمِنِينَ مَا قَعَدْتُ خَلْفَ سَرِيَّةٍ تَغْزُو فِي سَبِيلِ اللَّهِ وَلَكِنْ لاَ أَجِدُ سَعَةً فَأَحْمِلَهُمْ وَلاَ يَجِدُونَ سَعَةً فَيَتَّبِعُونِي وَلاَ تَطِيبُ أَنْفُسُهُمْ أَنْ يَقْعُدُوا بَعْدِي \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4863، يرد فيه ذكر «لولا أن أشق على أمتي». يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 4863 (The Book on Government), whose wording mentions 'were it not that I would burden my community'. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 4863، جس کے الفاظ میں «اگر مجھے اپنی امت پر مشقت کا خیال نہ ہوتا» کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 4863, dont le texte mentionne « si je ne craignais d'accabler ma communauté ». Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 4863, cuyo texto menciona «si no temiera agobiar a mi comunidad». El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
