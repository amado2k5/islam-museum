text: "… أو قال عيبة أخيه - شك ابن صاعد - ودرهمه وسوطه ان يحده ملقى فى الطريق حتى يردها عليه، فبينماهم كذلك اذ طعن الشيطان طعنة فنفرت القلوب فصارت وحشاً، فاذا هو يستحل دمه وماله، و هو بالأمس يحرم غيبته أو …"
