label: { ar: "الموطأ 1289 — نافع عن ابن عمر: نهى رسول الله أن يسافر بالقرآن إلى أرض العدو", en: "Muwatta 1289", es: "Muwatta 1289", fr: "Muwatta 1289", ur: "موطا 1289", tr: "El-Muvatta 1289 — İbn Ömer'den rivayet edildiğine göre Nafi': Allah Resulü, Kur'an'la düşman topraklarına gitmeyi yasaklamıştır.", id: "Al-Muwatta 1289 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Rasulullah SAW melarang bepergian dengan Al-Qur'an ke wilayah musuh." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه قال نهى رسول الله أن يسافر بالقرآن إلى أرض العدو. قال مالك وإنما ذلك مخافة أن يناله العدو. ويذكر المحقق أن ابن عبد البر قال إن هذا الحديث رواه جمهور رواة الموطأ عن مالك، وهو الصحيح، وأن ما خالفه عن مالك ليس بشيء. {cite:muwatta-maruf-1997 p.574}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan naklederek şöyle buyurduğunu aktarır: Allah Resulü, Kur'an'ı düşman topraklarına götürmeyi yasaklamıştır. Malik şöyle demiştir: Bu, sadece düşmanın Kur'an'ı ele geçirmesinden korkulduğu içindir. Araştırmacı, İbn Abd al-Barr'ın şöyle dediğini aktarır: Bu hadis, Muwatta'nın ravilerinin çoğunluğu tarafından Malik'ten nakledilmiştir ve doğrudur; Malik'ten nakledilen bu hadisle çelişen hiçbir şey yoktur. {cite:muwatta-maruf-1997 s.574}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa beliau bersabda: Rasulullah SAW melarang membawa Al-Qur'an ke wilayah musuh. Malik berkata: Hal ini semata-mata karena khawatir musuh akan merebutnya. Peneliti menyebutkan bahwa Ibnu Abd al-Barr berkata: Hadits ini diriwayatkan oleh mayoritas perawi Muwatta’ dari Malik, dan hadits ini benar, dan tidak ada yang bertentangan dengannya dari Malik. {cite:muwatta-maruf-1997 p.574}"
