summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه قال نهى رسول الله أن يسافر بالقرآن إلى أرض العدو. قال مالك وإنما ذلك مخافة أن يناله العدو. ويذكر المحقق أن ابن عبد البر قال إن هذا الحديث رواه جمهور رواة الموطأ عن مالك، وهو الصحيح، وأن ما خالفه عن مالك ليس بشيء. {cite:muwatta-maruf-1997 p.574}"
