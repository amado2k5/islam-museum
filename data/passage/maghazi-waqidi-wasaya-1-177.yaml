text: "رجلٌ من المسلمين فاتَّبعه فقتله، فاجتمعت بذو قَيْنُقاع، وتحايشوا فقتلوا الرجل، ونبذوا العَهد إلى النبيّ وحاربوا، وتحصّنوا فى حصنهم ؛ فسار إليهم رسول اللّٰه فحاصرهم، فكانوا أَوّل مَن سار إليه رسول اللّٰه، وأُجلى يهود قَيْنُقاع، وكانوا أَوّل يهود حاربت. فحدّثنى …"
summary:
  ar: "مقطع من المغازي للواقدي، المجلد المصوَّر 1، ص 177، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Waqidi's Maghazi, scan volume 1, p. 177, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
