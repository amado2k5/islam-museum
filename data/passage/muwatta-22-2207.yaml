label: { ar: "الموطأ 2207 — يحيى عن مالك: الأمر عندنا في العبد يجد اللقطة فيستهلكها قبل أن تبلغ الأجل الذي أجل في اللقطة وهو سنة: أنها في رقبته، إما أن يعطي سيده ثمن ما استهلك غلامه، وإما أن يسلم إليهم غلامه", en: "Muwatta 2207", es: "Muwatta 2207", fr: "Muwatta 2207", ur: "موطا 2207", tr: "El-Muvatta 2207 — Yahya, Malik'ten rivayetle: Kayıp bir malı bulan ve onu, kayıp mallar için belirlenen bir yıllık süre dolmadan tüketen köle hakkında hükmümüz şudur: Kölenin sorumluluğu devam eder. Ya kölesinin tükettiği şeyin bedelini efendisine ödemeli ya da kölesini efendisine teslim etmelidir.", id: "Al-Muwatta 2207 — Yahya berdasarkan riwayat Malik: Hukum kami mengenai seorang budak yang menemukan harta yang hilang dan memakannya sebelum jangka waktu yang ditentukan untuk harta yang hilang, yaitu satu tahun, adalah bahwa harta itu tetap menjadi tanggung jawabnya. Ia harus memberikan kepada tuannya harga dari apa yang dimakan budaknya, atau ia harus menyerahkan budaknya kepada tuannya." }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في العبد يجد اللقطة فيستهلكها، قبل أن تبلغ الأجل الذي أجل في اللقطة، وذلك سنة: أنها في رقبته، إما أن يعطي سيده ثمن ما استهلك غلامه، وإما أن يسلم إليهم غلامه. وإن أمسكها حتى يأتي الأجل الذي أجل في اللقطة، ثم استهلكها، كانت دينا عليه، يتبع به، ولم تكن في رقبته، ولم يكن على سيده فيها شيء. {cite:muwatta-maruf-1997 p.305}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Kayıp eşyayı bulan ve onu, kayıp eşyayı bulma süresi dolmadan tüketen köle hakkında hükmümüz şudur: Bu onun sorumluluğundadır. Ya efendisine kölesinin tükettiği şeyin bedelini ödemelidir ya da kölesini ona teslim etmelidir. Eğer kayıp eşyayı, kayıp eşyayı bulma süresi dolana kadar elinde tutar ve sonra tüketirse, bu onun için bir borç olur ve bunun için kendisine dava açılabilir; artık sorumluluğunda değildir ve efendisinin de buna karşı bir hakkı yoktur. {cite:muwatta-maruf-1997 s.305}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Hukum kami mengenai seorang budak yang menemukan harta yang hilang dan memakannya sebelum batas waktu yang ditetapkan untuk menemukan harta yang hilang adalah bahwa itu tetap menjadi tanggung jawabnya. Ia harus membayar tuannya harga dari apa yang dimakan budaknya, atau ia harus menyerahkan budaknya kepada mereka. Jika ia menyimpannya sampai batas waktu yang ditetapkan untuk menemukan harta yang hilang tiba, dan kemudian memakannya, itu menjadi hutang baginya, yang dapat dituntut, dan itu bukan lagi tanggung jawabnya, dan tuannya tidak memiliki hak untuk menuntutnya. {cite:muwatta-maruf-1997 p.305}"
