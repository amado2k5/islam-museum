label: { ar: "الموطأ 2207 — يحيى عن مالك: الأمر عندنا في العبد يجد اللقطة فيستهلكها قبل أن تبلغ الأجل الذي أجل في اللقطة وهو سنة: أنها في رقبته، إما أن يعطي سيده ثمن ما استهلك غلامه، وإما أن يسلم إليهم غلامه", en: "Muwatta 2207" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول: الأمر عندنا في العبد يجد اللقطة فيستهلكها، قبل أن تبلغ الأجل الذي أجل في اللقطة، وذلك سنة: أنها في رقبته، إما أن يعطي سيده ثمن ما استهلك غلامه، وإما أن يسلم إليهم غلامه. وإن أمسكها حتى يأتي الأجل الذي أجل في اللقطة، ثم استهلكها، كانت دينا عليه، يتبع به، ولم تكن في رقبته، ولم يكن على سيده فيها شيء. {cite:muwatta-maruf-1997 p.305}"
