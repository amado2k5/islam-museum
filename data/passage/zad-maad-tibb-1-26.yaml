text: "… ذلك فالخبر لا يصح. وقال الميموني : قلت لأبي عبد اللَّه : مسألة سئلتُ عنها : خَتَّان ختن صبياً، فلم يستقص؟ قال: إذا كان الختان جاوز نصف الحشفة إلى فوق، فلا يعيد، لأن فأمّا إذا الحشفة تغلظ، وكلما غلظت ارتفع …"
