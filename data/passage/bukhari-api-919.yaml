label: { ar: "صحيح البخاري 919 — الأب والأبوة", en: "Sahih al-Bukhari 919 — the father and fatherhood", ur: "صحیح بخاری 919 — باپ اور والدیت" }
text: "حَدَّثَنَا آدَمُ، قَالَ حَدَّثَنَا ابْنُ أَبِي ذِئْبٍ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ النَّبِيَّ يَخْطُبُ عَلَى الْمِنْبَرِ فَقَالَ \" مَنْ جَاءَ إِلَى الْجُمُعَةِ فَلْيَغْتَسِلْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 919، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 919 (Friday Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 919، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
