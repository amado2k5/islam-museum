text: "… يعصها فقد غوى وفرط وضل ضلالا بعيدا، وأوصيكم بتقوى اللّٰه! فانه خير ما اوصى به المسلم المسلم ان يحضه على الآخرة وأن يأمره بتقوى اللّٰه فاحذروا ما حذركم اللّه من نفسه ! ولا افضل من ذلك نصحية ولا افضل من …"
