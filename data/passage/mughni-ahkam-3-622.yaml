text: "… بْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبِي ثَلاثَة أَيَّامٍ، وَجَبَ عَلَيْهِ صيّامُ شَهْرٍ رَمَضَان وَلأنّهُ عِبَادَةً بَدَئِيَّةٌ، أَشتبَة عَلَى الصِّبِيّ، كَالْحَجّ. وَحَدِيثُهُمْ مُرْسَلٌ، ثُمْ نَحْمِلُهُ عَلَى الاسْتِحْبَابِ، وَسَمَّاهُ وَاجباً، تَأْجِيداً لاسْتِحْبَابهِ، كَقَوْلِهِ. غُسْلُ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِم. فصل الصبي يصوم ثم …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 622، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وما يجب على المكلف، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
