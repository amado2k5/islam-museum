text: "… بْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبِي ثَلاثَة أَيَّامٍ، وَجَبَ عَلَيْهِ صيّامُ شَهْرٍ رَمَضَان وَلأنّهُ عِبَادَةً بَدَئِيَّةٌ، أَشتبَة عَلَى الصِّبِيّ، كَالْحَجّ. وَحَدِيثُهُمْ مُرْسَلٌ، ثُمْ نَحْمِلُهُ عَلَى الاسْتِحْبَابِ، وَسَمَّاهُ وَاجباً، تَأْجِيداً لاسْتِحْبَابهِ، كَقَوْلِهِ. غُسْلُ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِم. فصل الصبي يصوم ثم …"
summary:
  ar: "مقطع من المغني لابن قدامة، المجلد المصوَّر 3، ص 622، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وما يجب على المكلف، والمستحب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Qudama's al-Mughni, scan volume 3, p. 622, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), what is binding on the person addressed, the recommended (mustahabb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المغنی، ابن قدامہ، اسکین جلد 3، ص 622 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، جو مکلف پر واجب ہے، مستحب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mughni de Ibn Qudama, volume numérisé 3, p. 622, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), ce qui s'impose à la personne responsable, le recommandé (mustahabb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mughni de Ibn Qudama, volumen digitalizado 3, p. 622, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), lo que obliga a la persona responsable, lo recomendado (mustahabb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kudame'nin El-Muğni adlı eserinin 3. cildinin 622. sayfasından, her Müslüman için farz olan, zorunlu olan, yasal olarak sorumlu olanlardan istenen ve tavsiye edilen şeylerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Mughni karya Ibn Qudamah, Jilid 3, halaman 622, yang menyebutkan apa yang wajib bagi setiap Muslim, yang wajib dilakukan, yang diwajibkan bagi orang yang bertanggung jawab secara hukum, dan yang dianjurkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
