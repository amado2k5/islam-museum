text: "… صالح عن أبي زبيد عبثر أن الأحنف دخل الكوفة فاستطابها وقال : اللهم إن حضر أجلي فاجعله بالكوفة، فإن تربتها كالكافور، فمات بها ودفن، ومات في دار ابن أبي عصيفير. قالوا : ولما حضرت الأحنف الوفاة قال : لا تندبني …"
