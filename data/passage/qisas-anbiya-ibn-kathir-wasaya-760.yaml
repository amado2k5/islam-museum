text: "ولا يقبل من أحد إلا الإسلام، وأنه يخرج من فج الروحاء حاجا أو معتمرا أو لثنتيهما، ويقيم أربعين سنة، ثم يموت فيدفن فيما قيل في الحجرة النبوية عند رسول الله عل وصاحبيه. وقد ورد ذلك حديث ذكره ابن عساكر في …"
summary:
  ar: "مقطع من قصص الأنبياء لابن كثير، ص 760، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's Qisas al-Anbiya', p. 760, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "قصص الانبیاء، ابن کثیر، ص 760 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Qisas al-Anbiya' de Ibn Kathir, pág. 760, que menciona un entierro, tumba o lugar de descanso; tomado del escaneo de lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Qisas al-Anbiya' d'Ibn Kathir, p. 760, mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn Kathir'in \"Peygamberlerin Hikayeleri\" adlı eserinin 760. sayfasından bir alıntı, mezar, türbe ve kutsal yerden bahsetmektedir; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetler, Miraslar, Antik Eserler ve Kutsal Yerler\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari \"Kisah Para Nabi\" karya Ibn Kathir, halaman 760, menyebutkan penguburan, kuburan, dan tempat suci; dari versi yang dipindai dan dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Suci\"."
