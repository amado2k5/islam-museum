label: { ar: "البخاري 3678 — عقبة يخنق النبي وأبو بكر يدفعه", en: "Bukhari 3678 — Uqba strangles the Prophet; Abu Bakr pushes him off", es: "Bujari 3678 — Uqba estrangula al Profeta; Abu Bakr lo empuja.", fr: "Bukhari 3678 — Uqba étrangle le Prophète; Abou Bakr le repousse.", ur: "بخاری 3678 — عقبہ نے نبی کا گلا گھونٹ دیا۔ ابوبکر نے اسے دھکیل دیا۔", tr: "Buhari 3678 — Ukba, Peygamberi boğmaya çalışır ve Ebu Bekir onu iterek uzaklaştırır.", id: "Bukhari 3678 — Uqba mencekik Nabi dan Abu Bakr mendorongnya menjauh" }
text: "رأيت عقبة بن أبي معيط جاء إلى النبي وهو يصلي فوضع رداءه في عنقه فخنقه خنقاً شديداً، فجاء أبو بكر حتى دفعه عنه وقال: «أتقتلون رجلاً أن يقول ربي الله وقد جاءكم بالبينات من ربكم»"
summary:
  ar: "في كتاب مناقب الأنصار؛ سئل عبد الله بن عمرو عن أشد ما صنع المشركون برسول الله فشهد هذه الواقعة عند البيت. وفيه منقبة ظاهرة لأبي بكر في الذب عنه بمكة، وقراءته لآية غافر في وجه المشركين."
  tr: "\"Ensar'ın Faziletleri\" adlı kitapta Abdullah ibn Amr'a, müşriklerin Allah'ın Resulü'ne yaptıkları en kötü şey soruluyor ve kendisi bu olaya Kâbe'de şahit olmuş. Kitap ayrıca Ebu Bekir'in Mekke'de onu savunmasının ve müşriklerin yüzüne karşı Gafir Suresi'nden bir ayet okumasının faziletine de değiniyor."
  id: "Dalam kitab \"Keutamaan Kaum Ansar,\" Abdullah bin Amr ditanya tentang hal terburuk yang dilakukan kaum musyrik terhadap Rasulullah, dan ia menyaksikan kejadian itu di Ka'bah. Kitab itu juga menyoroti keutamaan Abu Bakar dalam membela beliau di Mekah dan membacakan sebuah ayat dari Surah Ghafir di hadapan kaum musyrik."
