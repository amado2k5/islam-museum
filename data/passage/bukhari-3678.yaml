label: { ar: "البخاري 3678 — عقبة يخنق النبي وأبو بكر يدفعه", en: "Bukhari 3678 — Uqba strangles the Prophet; Abu Bakr pushes him off" }
text: "رأيت عقبة بن أبي معيط جاء إلى النبي وهو يصلي فوضع رداءه في عنقه فخنقه خنقاً شديداً، فجاء أبو بكر حتى دفعه عنه وقال: «أتقتلون رجلاً أن يقول ربي الله وقد جاءكم بالبينات من ربكم»"
summary:
  ar: "في كتاب مناقب الأنصار؛ سئل عبد الله بن عمرو عن أشد ما صنع المشركون برسول الله فشهد هذه الواقعة عند البيت. وفيه منقبة ظاهرة لأبي بكر في الذب عنه بمكة، وقراءته لآية غافر في وجه المشركين."
