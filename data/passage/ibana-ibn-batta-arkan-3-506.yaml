text: "… حدثنا عبيدالله بن موسى، قال: حدثنا داود بن يزيد، عن عامر، عن جرير مه، قال: سمعت النبي ولييم يقول: بُني الإسلامُ على خمسٍ: شهادة أن لا إله إلَّا الله، وإقام الصلاة، وإيناء الزكاة، وحج البيت، وصوم رمضان. - حدثنا أبو …"
summary:
