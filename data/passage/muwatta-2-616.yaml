label: { ar: "الموطأ 616 — بلاغ: عثمان وابن عمر وأبو هريرة يجعلون الرجال مما يلي الإمام والنساء مما يلي القبلة", en: "Muwatta 616", es: "Muwatta 616", fr: "Muwatta 616", ur: "موطا 616", tr: "El-Muvatta 616 — Rivayet: Osman, İbn Ömer ve Ebu Hurayra, erkekleri İmama en yakın, kadınları ise kıbleye en yakın konumlandırırlar.", id: "Al-Muwatta 616 — Laporan: Utsman, Ibnu Umar, dan Abu Hurairah menempatkan laki-laki paling dekat dengan Imam dan perempuan paling dekat dengan kiblat." }
summary:
  ar: "أول حديث في باب جامع الصلاة على الجنائز. بلاغ يرويه مالك أنه بلغه أن عثمان بن عفان وعبد الله بن عمر وأبا هريرة كانوا يصلون على الجنائز بالمدينة، الرجال والنساء، فيجعلون الرجال مما يلي الإمام والنساء مما يلي القبلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (968). {cite:muwatta-maruf-1997 p.315}"
  tr: "Cenaze namazı bölümündeki ilk hadis. Malik'ten rivayet edilen bir rivayete göre, Osman ibn Affan, Abdullah ibn Ömer ve Ebu Hurayra'nın Medine'de hem erkekler hem de kadınlar için cenaze namazı kıldıkları, erkeklerin imama en yakın, kadınların ise kıbleye en yakın konumda oldukları belirtilmiştir. Editör, bu hadisin Malik'ten Ebu Musab (968) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.315}"
  id: "Hadits pertama dalam bab tentang shalat jenazah lengkap. Sebuah riwayat yang dinarasikan oleh Malik menyatakan bahwa ia mendengar bahwa Utsman bin Affan, Abdullah bin Umar, dan Abu Hurairah biasa melaksanakan shalat jenazah di Madinah, baik untuk laki-laki maupun perempuan, dengan menempatkan laki-laki paling dekat dengan imam dan perempuan paling dekat dengan kiblat. Editor menyebutkan bahwa hadits ini dinarasikan dari Malik oleh Abu Musab (968). {cite:muwatta-maruf-1997 p.315}"
