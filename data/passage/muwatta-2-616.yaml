summary:
  ar: "أول حديث في باب جامع الصلاة على الجنائز. بلاغ يرويه مالك أنه بلغه أن عثمان بن عفان وعبد الله بن عمر وأبا هريرة كانوا يصلون على الجنائز بالمدينة، الرجال والنساء، فيجعلون الرجال مما يلي الإمام والنساء مما يلي القبلة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (968). {cite:muwatta-maruf-1997 p.315}"
