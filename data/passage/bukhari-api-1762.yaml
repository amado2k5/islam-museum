label: { ar: "صحيح البخاري 1762 — ما لا يحل", en: "Sahih al-Bukhari 1762 — what is not lawful", ur: "صحیح بخاری 1762 — جو حلال نہیں", es: "Sahih al-Bukhari 1762 — lo que no es lícito", fr: "Sahih al-Bukhari 1762 — ce qui n'est pas licite" }
text: "… عَنْ عَائِشَةَا ـ قَالَتْ خَرَجْنَا مَعَ النَّبِيِّ وَلاَ نُرَى إِلاَّ الْحَجَّ، فَقَدِمَ النَّبِيُّ فَطَافَ بِالْبَيْتِ وَبَيْنَ الصَّفَا وَالْمَرْوَةِ، وَلَمْ يَحِلَّ وَكَانَ مَعَهُ الْهَدْىُ، فَطَافَ مَنْ كَانَ مَعَهُ مِنْ نِسَائِهِ وَأَصْحَابِهِ، وَحَلَّ مِنْهُمْ مَنْ لَمْ يَكُنْ مَعَهُ الْهَدْىُ، فَحَاضَتْ هِيَ، فَنَسَكْنَا مَنَاسِكَنَا مِنْ حَجِّنَا، فَلَمَّا كَانَ لَيْلَةُ الْحَصْبَةِ لَيْلَةُ النَّفْرِ، قَالَتْ يَا رَسُولَ اللَّهِ كُلُّ أَصْحَابِكَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1762، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 1762 (Hajj (Pilgrimage)), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 1762، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.° 1762 (Hajj (Peregrinación)), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 1762 (Hajj (Pèlerinage)), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
