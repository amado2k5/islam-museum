label: { ar: "صحيح البخاري 380 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 380 — the orphan and the father lost", ur: "صحیح بخاری 380 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 380 — El huérfano y el padre perdido", fr: "Sahih al-Bukhari 380 — L'orphelin et le père perdus", tr: "Sahih el-Buhari 380 — Yetim ve Babayı Kaybetme", id: "Sahih al-Bukhari 380 — Anak Yatim dan Kehilangan Ayah" }
text: "… بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ جَدَّتَهُ، مُلَيْكَةَ دَعَتْ رَسُولَ اللَّهِ لِطَعَامٍ صَنَعَتْهُ لَهُ، فَأَكَلَ مِنْهُ ثُمَّ قَالَ \" قُومُوا فَلأُصَلِّ لَكُمْ \". قَالَ أَنَسٌ فَقُمْتُ إِلَى حَصِيرٍ لَنَا قَدِ اسْوَدَّ مِنْ طُولِ مَا لُبِسَ، فَنَضَحْتُهُ بِمَاءٍ، فَقَامَ رَسُولُ اللَّهِ وَصَفَفْتُ وَالْيَتِيمَ وَرَاءَهُ، وَالْعَجُوزُ مِنْ وَرَائِنَا، فَصَلَّى لَنَا رَسُولُ اللَّهِ رَكْعَتَيْنِ ثُمَّ انْصَرَفَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 380، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 380 (Prayers (Salat)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 380، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 380 (Oraciones (Salat)), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre la paternidad."
  fr: "Un hadith du Sahih al-Bukhari, n° 380 (Prière), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'nin 380 numaralı hadisinde yetimler ve babasızlık konusu ele alınmaktadır. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 380, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
