label: { ar: "الموطأ 30 — من أكل الثوم فلا يقرب مساجدنا", en: "Muwatta 30", es: "30 Muwatta", fr: "30 Muwatta", ur: "30 موطا", tr: "Al-Muwatta 30 — Sarımsak yiyen kimse camilerimize yaklaşmasın.", id: "Al-Muwatta 30 — Barangsiapa memakan bawang putih, janganlah ia mendekati masjid-masjid kami." }
text: "من أكل من هذه الشجرة فلا يقرب مساجدنا، يؤذينا بريح الثوم"
summary:
  ar: "أول حديث في باب النهي عن دخول المسجد بريح الثوم وتغطية الفم. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب مرسلاً: نهى النبي من أكل الثوم أن يقرب المساجد لأن ريحه تؤذي المصلين. وينقل المحقق عن ابن عبد البر أنه مرسل في الموطأ عند جميع رواته إلا في رواية شاذة موصولة عن أبي هريرة، وأن معمراً ويونس وإبراهيم بن سعد وصلوه عن ابن شهاب ⁦(التمهيد 6/412)⁩، ويخرّج الموصول عند عبد الرزاق وأحمد (2/264) ومسلم (2/79) وابن ماجه (1015) وابن حبان (1645) والبيهقي. {cite:muwatta-maruf-1997 p.49}"
  id: "Hadits pertama dalam bab ini membahas larangan memasuki masjid dengan bau bawang putih dan menutup mulut. Diriwayatkan oleh Yahya dari Malik, dari Ibn Shihab, dari Sa'id ibn al-Musayyab, sebagai hadits mursal: Nabi (shalawat dan salam kepadanya) melarang siapa pun yang telah memakan bawang putih untuk mendekati masjid karena baunya mengganggu orang-orang yang sedang shalat. Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa hadits ini mursal dalam al-Muwatta' menurut semua perawinya kecuali satu riwayat yang aneh yang menghubungkannya dari Abu Hurayrah, dan bahwa Ma'mar, Yunus, dan Ibrahim ibn Sa'd menghubungkannya dari Ibn Shihab (al-Tamhid 6/412). Versi sambungnya juga terdapat dalam kumpulan 'Abd al-Razzaq, Ahmad (2/264), Muslim (2/79), Ibnu Majah (1015), Ibnu Hibban (1645), dan al-Bayhaqi. {mengutip:muwatta-maruf-1997 hal.49}"
