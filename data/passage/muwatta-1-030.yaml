label: { ar: "الموطأ 30 — من أكل الثوم فلا يقرب مساجدنا", en: "Muwatta 30" }
text: "من أكل من هذه الشجرة فلا يقرب مساجدنا، يؤذينا بريح الثوم"
summary:
  ar: "أول حديث في باب النهي عن دخول المسجد بريح الثوم وتغطية الفم. يرويه يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب مرسلاً: نهى النبي من أكل الثوم أن يقرب المساجد لأن ريحه تؤذي المصلين. وينقل المحقق عن ابن عبد البر أنه مرسل في الموطأ عند جميع رواته إلا في رواية شاذة موصولة عن أبي هريرة، وأن معمراً ويونس وإبراهيم بن سعد وصلوه عن ابن شهاب (التمهيد 6/412)، ويخرّج الموصول عند عبد الرزاق وأحمد (2/264) ومسلم (2/79) وابن ماجه (1015) وابن حبان (1645) والبيهقي. {cite:muwatta-maruf-1997 p.49}"
