text: |-
  ٥٤r))
  أى ايسيبلّ الترى ويقال لقدر كت الابل الماء وهى ذات نضيضة وذات نضائض أى ذات
  عطس لم تروويقمال أنض الراعى سخاله أى سقاها نضيضا من اللبن والنضيضة صوت نشيس
  اللحم يشوى على الرضف قال الراجز تسمع للرضف بها تضائضا والنضنضة تحريك
  لحية لسانها ويقال للحية نضفاض وتضناضة قال عيمى بن عمر سألت ذا الرمة عن الفضفانس
  فلم يزدنى ان سر"ل"لسانه فى فيه ⁦(نعض)⁩ النعض بالضيم شجربالجاز يستاكيه قال الراجز
  من اللواتى يقتضبن النعضا ١ غض ، غض رأسه ينقض ويتفض تغضا ونغوضا أى
  نحرك وأنغض رأسه أى حرّكه كالمتعجب من الشى ومنه قوله تعالى فسغضون العل
  رؤسهم ويقال أيضا نفض فلان رأسه أحرّكم يتعدى ولا يتعدى حكاه الاخفش وكل
  حركة فى ارتجاف نغض يقال نغض رحل البعيروثنية الغلام نفضا ونغضانا قال العجاج
  جذب البرى وجرية الجبال * ونغضان الرحل من معال
  والنغض الظليم يحزك رأسه قال العجاج
  أصك نغضالاني مستهدجا ومحمال نغض
  قال الراجز
  لاماء فى المقراان لم تنهض * بمسدفوق الهال النغض
  والناغض الغرضوف ونغض السصاب اذا كثف ثم مخص تراه يتحزّك بعضه فى بعض ولا يسير
  قال الراجز (دؤي برق ترى فى عارض نفاض ⁦(نقض)⁩ نفضت الثوب والشجر أنفضه
  نفضا اذاحر كنه لينتفض ونفضته شددلله. الغة والنفض بالتحريك ما تساقط من الورق
  والثمر وهو فعل بعنى مفعول كالقبض بمعنى المقبوض والنفاس بالضم والنفاضة ماسقط
  عن النفض والمنفض المنسف ونفضت المرأة كرشها فهى تفوض كثيرة الولد ونفضت الابل
  أيضاو أنفضت نتجت قال ذوالرمة
  كلا كفأتبها تنفضان ولم يجد * لهاثيل سقب فى التتاجين لامس
  ويروى تنفضان والنافض من الحى ذات الرعدة يقال أخذبه حى نافض ونفضه الحى
  فهو منفوض والنفضة بالضم النفضاء وهى رعدة النافض والنفضة أيضا المطرة تصيب
  القطعة من الارض وتخطئ القطعة وأنفض القوم أى هلكت أمو الهم وأنفضوا أيضا
  مثل أرملوا اذافى زادهم والاسم النفاض بالضم و-نه قولهم النفاض بقطر الجلب وكان
  ثعاب يفتحه ويقول هو الجدب أى اذاجاه الجدب جلبت الابل قطاراقطار اللبيع والنفاض
  بالكسرازار من أزر الصبيان يقال ماعليه نقاض قال الراجز
  جارية بيضاء فى نفاض
  والنفضة بالتحريك الجماعة يبعنون فى الارض لينظر واهسل فيها عدوا وخوف وكذلك
  النفيضة تحوا الطليعة قالت سلمى الجهنية ترنى أخاها أسعد
  يرد المياهحضيرة ونفيضة • ورد القطاة اذا اسمألالتبع
  نعنى اذاقصر الظل نصف النهار والجمع النفائض قال أبوذؤيب يصف المغاوز
  بهن عام بناه الرجال • قلقى النفائض فيه السريحا
  هذا قول الاصمعى وهكذارواه أيضا أبو عمر وبالفاء الا أنه قال فى تفسيره إنها الهزلى من
  الابل ورواء غيره بالقاف بجع نقض ودى التى جهدها السير وقد نفضت المكان نقضا
  واستنفضته وتنفضته اذانظرت جميع مافيه قال زهيريصف البقرة
  [٢».
  صحاح
  قوه نضيضا من اللبن اى قليسلا
  منه اه مل
  والرواية خدن اللواتى وصدره
  فى سلوة عشفا بذالذ أبضااى
  يقتطعته ليسستكن ي اه مر
  قوله لها صوا بد له اى للفسل وقوله
  تنفضان من نفض ويروى تنفضان
  اى يضم التام من انفض فتكون
  الفاءمكسورة ومقتضى عبارة
  الفامين
  للمفعول من تفض
  وفسر المعن على كل فانظره
  قوله سلى قال ابن برى صوايه
  سعدى الجهنية قال م روهى
  سعدى بنت الشمردل وحضيرة
  وتفيضة نصب على الحال اى
  يغزووحده فى موضع الحضيرة
