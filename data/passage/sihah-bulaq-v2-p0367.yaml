text: |-
  قوله بكسب الحد فى بعض
  الذخ الجد اه
  ٢ فى مسخة زيادة أمية بن
  أبى لصلت عائل ماوعالت الخ اه
  ٢٢٠
  بالبكاء وكذلك العويل تقول منه أعول وفى الحديث المعول عليه يعذب وأعوات القوس
  مونت أيو ريدعوات اليه أدللت عليه دالة وحلت عليه يقال عوّل على بماشئت أى استعن
  بى كانه يقول احل على ما أحبيت وماله فى القوم من معوّل والاسم العول قال تأبطشرا
  لكنهاء ولى ان كنت ذاعول • على بصير بكسب الححدسباق
  والعمالة شبه الظلة يستتربع امن المطر مخففة اللام تقول منه عوّات عالة أى بنيتها قال
  عبد مغاف بن ربع الهذلى
  فالطعن شغشغة والضرب هيقعة * ضرب المعول تحت الديمة العضدا
  وعال عباله يعوله-م عولا وعيالة أى قاته-م وأنفق عليهم يقال علده شهرا اذا كفيته
  معاشه قال الكميت
  كمانامرت فى حضنها أم عامى • لذى الجبل -تى عال أوس عبالها
  لان الضبغ اذا صيدت ولها ولد من الذئب لم يزل الذئب يطم وادها الى أن يكبر ويروى
  غال بالغين المهجسة أى أخذبراءها وقوله لذى الحبل أى للصائد الذى يعلق الحبل فى
  عرقوبها وعال الميزان فهوعائل أى مائل قال الشاعر
  قالوا تبعنا رسول اللّٰه واطرحوا • قول الرسول وعالوا فى الموازين
  وقال أبو طالب
  بميزان صدق لا يغل شعيرة • له شاهد من نفسه غير عائل
  ومنه قوله تعالى ذلك أدنى ألاته ولوا قال مجاهدلا تميلوا ولا تجوروا يقال عال فى الحكم
  أى جارومال وعالى الشي يعوانى أى غلبى وثقل على وعال الامر أى اشتد وتفاقم وعيل
  صبرى أى غلب وقولهم عيل ماهوعائله أى غلب ماهو غالبه يضرب للرجل الذى يعجب من
  كلامه أوغير ذلك وهو على مذهب الدعاء قال النمربن نواب
  وأحبب حبيبك حبار ويدا • فليس يعولك أن تصرما
  وقول الشاعر ٢ *وعالت البيقورا *أى أنّ السنة الجدية أثقلت البقر بماحلت من
  السلع والعشر وانما كانوا يفسعلون ذلك فى السنة الجدبة فيعمدون الى البقر فيعقدون فى
  أذنا جها السلع والعشر ثم يضرمون فيها الناروهم يصعدونها فى الجبل فيمطرون لوقتهم زعموا
  قال أمية من أبى الصلت يدكردلك
  سنة أزمة تخيل بالناس ترى للعضاد فيهاصر يرا
  لاعلى كوكب ينوء ولاريح جنوب ولاترى طخرورا
  ويسوقون باقرالسهل للطود مهازيل خشية أن تبورا
  عاقدين النيران فى شكن الاذناب منهالكى تهيج البحورا
  سلع ماو-شله عشرما عاة_ل ماوعالت البية ورا
  والعول أيضاءول الغريضة وقد عالت أى ارتفعت وهو أن تز يدسها ما فيدخل النقصان
  على أهل الفرائض قال آبو عبيد أظنه مأخوذا من الميل وذلت أنّ الفريضة اذاعالت فهى
  تميل على أهل الفريضة جميعا فتنتقصه-م ويقال أيضاعال زيد الفرائض وأعالها بعنف
  يتعدى
