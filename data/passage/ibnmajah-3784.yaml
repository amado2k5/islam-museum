label:
  ar: "ابن ماجه 3784 — قسمت الصلاة بيني وبين عبدي نصفين"
  en: "Ibn Majah 3784 — I have divided the prayer between Myself and My servant in two halves"
  ur: "ابن ماجہ 3784 — میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا"
text: "قال الله عز وجل قسمت الصلاة بيني وبين عبدي شطرين فنصفها لي ونصفها لعبدي ولعبدي ما سأل . قال فقال رسول الله اقرءوا يقول العبد الحمد لله رب العالمين فيقول الله عز وجل حمدني عبدي ولعبدي ما سأل . فيقول …"
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3784: قسمت الصلاة بيني وبين عبدي نصفين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3784: I have divided the prayer between Myself and My servant in two halves. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3784: میں نے نماز کو اپنے اور اپنے بندے کے درمیان دو حصوں میں بانٹا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
