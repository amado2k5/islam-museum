text: "حَدَّثَنَا هَنَّادٌ، حَدَّثَنَا وَكِيعٌ، عَنْ سُفْيَانَ، عَنْ مُحَمَّدِ بْنِ عَبْدِ الرَّحْمَنِ، مَوْلَى آلِ طَلْحَةَ عَنْ سَالِمٍ، عَنْ أَبِيهِ، أَنَّهُ طَلَّقَ امْرَأَتَهُ فِي الْحَيْضِ فَسَأَلَ عُمَرُ النَّبِيَّ فَقَالَ \" مُرْهُ فَلْيُرَاجِعْهَا ثُمَّ لْيُطَلِّقْهَا طَاهِرًا أَوْ حَامِلاً \". قَالَ أَبُو عِيسَى حَدِيثُ يُونُسَ بْنِ جُبَيْرٍ عَنِ ابْنِ عُمَرَ حَدِيثٌ حَسَنٌ صَحِيحٌ وَكَذَلِكَ حَدِيثُ سَالِمٍ عَنِ ابْنِ عُمَرَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1176، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1176 (The Book on Divorce and Li'an), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1176، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1176 (El Libro del Divorcio y Li'an), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1176 (Livre du divorce et du li'an), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
