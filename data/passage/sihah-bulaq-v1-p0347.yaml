text: |-
  ٢٩٤
  ⁦(باب الرام)⁩
  ⁦(جبر)⁩
  ونافر فالث ترساعة ما يخرج من التراب والنافر حين نفرأى وثب وثاربه الناس أى وثبوا
  عليه والمثاورة المواثبة يقال انتظر -تى تسكر ه-ذه الثورة وهي الهيج وتورفلان عليهم
  الشرّأى هيجه وأظهره وثوّر القرآن أى بحث عن علمه وتوّر البرك واستشارها أى أزعجها
  وأنهضها وثارت نفسه أى جشأت ورأيته ثارار أم اذار أيته وقد اشعان شعرو أسه وثار
  ثائره أى هاج غضبه والشور الذكرمن البقروالاتى ثورة والمسع ثورة مثل عود وعودة وثيرة
  وثيران مثل جيرة وجيران وثيرة أيضاقال سيبويه قلبوا الواويا حيث كانت بعد كسرة قال
  وليس ه_ذا بطردوقال المبرّدانما قالواثيرة ليفرقوا بينه وبين تورة الاقط وبنوه على فعله
  ثم حرّكوه وتور أبو قبيلة من مضرو هو تورين عبدمناة بن أدّين طابخة بن الياس بن مضروهم
  رهطسفيان المورى وتورجبل بكة وفيه الغار المذكور فى القرآن ويقال لهثور أطهل
  وقال بعضهسم اسم الجبل أطهل نسب اليه تور بن عبدمناة لانه نزله وفى الحديث حرّم مابين
  عير الى تور قال أبو عبيدة أهل المدينة لا يعرفون بالمديسة جبلاية ال له ثوروانما تور؟كا
  قال ونرى أن أصل الحديث أنه حرم مأبين عير الى أحد وقال غسيره الى بمعنى مع كانه جعل
  المدينة مضافة الى مكة فى التحريم والثورقطعة من الاقطوا لجمع ثورة يقال أعطاهثورة
  عظامامن الاقط والشوربرج فى السماء وأماقولهم سقط تور الشفق فهوا تتشار الشفق وثوراته
  ويقال معظمه. وأماقول الشاعر أ س بن مدركة
  انى وقتلى سليكانم أعقله * كالنوريضرب لماعافت البقر
  فيقال ان البقراذا امتنعت من شروعها فى الماءلا تضرب لانهاذات لبن وانما يضرب الثور
  لتفزع هى فتشرب ويقال للطحاب تورالماء -كاه أبوزيد فى كتاب المطر
  صل الجيم أر لجوار مثل الخوار يقال جأر التوريجا رأى صاح وقرأ
  بعضهم عجلا جسد اله جؤار بالجيم -كاه الأخفس وجأر الرجسل الى اللّٰه عزوجل أى تضرّع
  بالدعاء الاصمعى غيث جور مثال نغرأى غزير كثير المطر وأنشد لا تسدصيب عزاف جور
  وأماجورفتذ كر من بعد بر أبوعمر والجبر أن تغنى الرحل من فقر أ وتصلح عظمه من
  كسريقال جبرت العظم جبرا وجبر العظم بنفسه جبورا أى اغجير وقد جم-ع العجاج بين
  المتعدى واللازم فقال
  قد جبر الدين الالّه فجبر واحتبر العظم مثل انخير يقال جبر اللّٰه
  فلانا فاجتبر أى ستمفاقره قال الراجز ⁦(حمروبن كلثوم)⁩ من عال منا بعدهافلا أجتبر
  والعرب تسمى الخبز جابراوية ولون(و جابر بن حبة وكنيته أيضا أبو جابر وأجسبرته على الامر
  أكرهته عليه وأجبرته أيضانسبته الى الجبر كما تقول أكفرته اذا نسبته الى الكفر والجبار
  الهدريقال ذهب دمه جباراوفى الحديث المعدن جبارأى اذا انه ار على من يعمل فيه
  فهلك لم يؤخذبه مستأجره وجبار أيضا اسم يوم الثلاثامن أسماتهم القديمة والجبار من
  النخل ما طال وقات اليد قال الاعشى
  طريق وجبار روا أصوله * عليه أبابيل من الطير تنعب
  بشال نخلة جبارة وناقة جبارة أى عظيمة سمينة والجبار الذى يقت_ل على الغضب والجبر الذى
  جبر العظام المسكسورة وتجبر الرجل تكبر وتجير النيت أى ببت سد الاسكل قال
  امر ؤالقيس
  ويأكلن من قوّاما عاورية * تجبر بعد الا كل فهو نيص
  والجير
