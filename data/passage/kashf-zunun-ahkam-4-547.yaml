text: "… لأبي إسحاقَ إبراهيمَ بن عُمر السُّوسيِّ الشّافعيّ. أوَّلُه: الحمدُ لله الذي فَرَض الفَرَائض... إلخ. رُتِّب على فاتحةٍ وأحدٍ وستّين بابًا وخاتَمة. ذكر فيه مذاهبَ الصَّحابة فمَن بعدَهم من أئمة المذاهب الباقية، وفَرَغ في صفر سنة سبع وأربعين وثمان مئة. تقدمت …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 4، ص 547، يرد فيه ذكر الفريضة والفرائض، والفرض؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
