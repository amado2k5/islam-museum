text: "… صحبة. ذكره الواقدي فيمن قسم عمر بن الخطاب بينهم خَيْبَر لما أجلى اليهود عنها. - عبادة بن قيس: واستدركه ابن فتحون. تقدم في عباد. - عبادة بن مالك الأنصاريّ: - عبادة بن عبد اللّٰه بن أبيّ بن سَلُول الخزرجيُّ أخو …"
