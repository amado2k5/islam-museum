text: "… زَنَقَهَا. وكان سعد بن أبي وقاص فيمن حَمَل جنازته، وهو يقول : وَاجَبَلاه. وخَلف مالاً عظيماً، من ذلك ذهب قُطع بالفئوس، حتى مَجَلت أيدي الرجال منه وترك ألف بعير، ومائة فرس، وثلاثة آلاف شاة ترعى بالبقيع. عَبْدُ الرَّحْمْنِ بنُ عُوَيْم …"
summary:
