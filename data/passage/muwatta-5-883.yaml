label: { ar: "الموطأ 883 — مالك في المرأة المعتكفة: إذا حاضت في اعتكافها ترجع إلى بيتها، فإذا طهرت رجعت إلى المسجد أي ساعة طهرت ولا تؤخر، ثم تبني على ما مضى", en: "Muwatta 883", es: "Muwatta 883", fr: "Muwatta 883", ur: "موطا 883", tr: "El-Muvatta 883 — Malik'in itikaftaki kadın hakkındaki görüşü: Eğer itikaf sırasında adet görürse, evine dönmelidir. Temizlendiğinde ise, temizlendiği herhangi bir zamanda gecikmeksizin camiye dönmeli ve kaldığı yerden devam etmelidir.", id: "Al-Muwatta 883 — Malik tentang seorang wanita yang sedang i'tikaf: Jika dia mengalami haid selama i'tikafnya, dia harus kembali ke rumahnya. Ketika dia sudah suci, dia harus kembali ke masjid kapan pun dia sudah suci dan tidak menunda-nunda, kemudian dia harus melanjutkan dari tempat dia berhenti." }
summary:
  ar: "قول لمالك في المرأة: إذا اعتكفت ثم حاضت في اعتكافها، فإنها ترجع إلى بيتها، فإذا طهرت رجعت إلى المسجد أي ساعة طهرت ولا تؤخر ذلك، ثم تبني على ما مضى من اعتكافها. ويقول مالك: ومثل ذلك المرأة يجب عليها صيام شهرين متتابعين فتحيض ثم تطهر، فتبني على ما مضى من صيامها ولا تؤخر ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (879) و(880). {cite:muwatta-maruf-1997 p.425} {cite:muwatta-maruf-1997 p.426}"
  tr: "Malik, bir kadın hakkında şöyle buyurmuştur: Eğer bir kadın itikaf yaparken adet görürse, evine dönmelidir. Temizlendiğinde ise, herhangi bir zamanda ve gecikmeksizin camiye dönmelidir. Sonra da itikafına kaldığı yerden devam etmelidir. Malik ayrıca şöyle buyurmuştur: Benzer şekilde, bir kadın iki ay boyunca oruç tutmakla yükümlü ise ve adet görüp temizlenirse, orucuna kaldığı yerden devam etmeli ve gecikmemelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (879) ve (880) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.425} {cite:muwatta-maruf-1997 s.426}"
  id: "Malik berkata mengenai seorang wanita: Jika ia melakukan i'tikaf (berdiam diri di masjid untuk beribadah) dan kemudian mengalami haid selama i'tikafnya, ia harus kembali ke rumahnya. Setelah ia suci, ia harus kembali ke masjid kapan saja ia suci dan tidak menundanya. Kemudian ia harus melanjutkan i'tikafnya dari tempat ia berhenti. Malik juga berkata: Demikian pula, jika seorang wanita diwajibkan berpuasa selama dua bulan berturut-turut dan kemudian mengalami haid dan menjadi suci, ia harus melanjutkan puasanya dari tempat ia berhenti dan tidak menundanya. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (879) dan (880). {cite:muwatta-maruf-1997 p.425} {cite:muwatta-maruf-1997 p.426}"
