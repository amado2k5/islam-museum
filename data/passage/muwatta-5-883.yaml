label: { ar: "الموطأ 883 — مالك في المرأة المعتكفة: إذا حاضت في اعتكافها ترجع إلى بيتها، فإذا طهرت رجعت إلى المسجد أي ساعة طهرت ولا تؤخر، ثم تبني على ما مضى", en: "Muwatta 883" }
summary:
  ar: "قول لمالك في المرأة: إذا اعتكفت ثم حاضت في اعتكافها، فإنها ترجع إلى بيتها، فإذا طهرت رجعت إلى المسجد أي ساعة طهرت ولا تؤخر ذلك، ثم تبني على ما مضى من اعتكافها. ويقول مالك: ومثل ذلك المرأة يجب عليها صيام شهرين متتابعين فتحيض ثم تطهر، فتبني على ما مضى من صيامها ولا تؤخر ذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (879) و(880). {cite:muwatta-maruf-1997 p.425} {cite:muwatta-maruf-1997 p.426}"
