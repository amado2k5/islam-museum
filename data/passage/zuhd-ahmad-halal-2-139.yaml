text: "كيفَ قال الزُّهريُّ في الزُّهدِ؟ قال: مَن لم يَمْنَعِ الحلالُ شُكرَه، والحرامُ صَبْرَه. قال أَبو عُبيد القاسم بن سلَّام الهروي في غريب الحديث - : أَراد: إذا أَنْعَمَت عليه: يَعْجُز شكرُه عنها، وإِذا عَرَضَتْ له فتنةٌ مِنَ الحرامِ: كان عنده …"
