label: { ar: "جامع الترمذي 1057 — الرخصة", en: "Jami' al-Tirmidhi 1057 — the concession (rukhsa)", ur: "جامع ترمذی 1057 — رخصت", fr: "Jami' al-Tirmidhi 1057 — la dispense (rukhsa)", es: "Yami' al-Tirmidhi 1057 — la dispensa (rukhsa)" }
text: "… لأَوَّاهًا تَلاَّءً لِلْقُرْآنِ \". وَكَبَّرَ عَلَيْهِ أَرْبَعًا. قَالَ وَفِي الْبَابِ عَنْ جَابِرٍ وَيَزِيدَ بْنِ ثَابِتٍ وَهُوَ أَخُو زَيْدِ بْنِ ثَابِتٍ أَكْبَرُ مِنْهُ. قَالَ أَبُو عِيسَى حَدِيثُ ابْنِ عَبَّاسٍ حَدِيثٌ حَسَنٌ. وَقَدْ ذَهَبَ بَعْضُ أَهْلِ الْعِلْمِ إِلَى هَذَا وَقَالُوا يُدْخَلُ الْمَيِّتُ الْقَبْرَ مِنْ قِبَلِ الْقِبْلَةِ. وَقَالَ بَعْضُهُمْ يُسَلُّ سَلاًّ. وَرَخَّصَ أَكْثَرُ أَهْلِ الْعِلْمِ فِي الدَّفْنِ بِاللَّيْلِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1057، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 1057 (The Book on Jana''iz (Funerals)), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 1057، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 1057, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 1057, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
