text: "حَدَّثَنَا أَبُو سَعِيدٍ الأَشَجُّ، وَأَبُو مُوسَى مُحَمَّدُ بْنُ الْمُثَنَّى قَالاَ حَدَّثَنَا ابْنُ إِدْرِيسَ، عَنْ أَبِيهِ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ عَلْقَمَةَ بْنِ وَائِلٍ، عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ، قَالَ بَعَثَنِي رَسُولُ اللَّهِ إِلَى نَجْرَانَ فَقَالُوا لِي أَلَسْتُمْ تَقْرَءُونَ : ⁦( يَا أُخْتَ هَارُونَ )⁩ وَقَدْ كَانَ بَيْنَ عِيسَى وَمُوسَى مَا كَانَ فَلَمْ أَدْرِ مَا أُجِيبُهُمْ. فَرَجَعْتُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3155، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3155 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3155، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
