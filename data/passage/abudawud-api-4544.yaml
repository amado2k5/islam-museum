label: { ar: "سنن أبي داود 4544 — ما فرضه الله ورسوله، الفرض", en: "Sunan Abi Dawud 4544 — what God and His Messenger made obligatory; the obligatory (fard)", ur: "سنن ابی داؤد 4544 — جو اللہ اور اس کے رسول نے فرض کیا، فرض", fr: "Sunan Abi Dawud 4544 — ce que Dieu et Son Messager ont rendu obligatoire ; l'obligatoire (fard)", es: "Sunan Abi Dawud 4544 — lo que Dios y Su Mensajero hicieron obligatorio; lo obligatorio (fard)" }
text: "قَالَ أَبُو دَاوُدَ قَرَأْتُ عَلَى سَعِيدِ بْنِ يَعْقُوبَ الطَّالْقَانِيِّ قَالَ حَدَّثَنَا أَبُو تُمَيْلَةَ، حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، قَالَ ذَكَرَ عَطَاءٌ عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ فَرَضَ رَسُولُ اللَّهِ فَذَكَرَ مِثْلَ حَدِيثِ مُوسَى. قَالَ وَعَلَى أَهْلِ الطَّعَامِ شَيْئًا لاَ أَحْفَظُهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4544، يرد فيه ذكر ما فرضه الله ورسوله، والفرض. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 4544 (Types of Blood-Wit (Kitab Al-Diyat)), whose wording mentions what God and His Messenger made obligatory, the obligatory (fard). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 4544، جس کے الفاظ میں جو اللہ اور اس کے رسول نے فرض کیا، فرض کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 4544, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, l'obligatoire (fard). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 4544, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo obligatorio (fard). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
