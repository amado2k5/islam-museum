text: "صفة الصفوة ج - اعن الحسن قال: لقيت أقواما كانوا فيا أحل انه لهم أزهد منكم فيما حرم الّه عليكم، ولقد لقيت أقواما كانوا من حسناتهم أشفق أن لا تقبل منهم من سيئاتكم، ولقد صحبت أقواما كان أحدهم يأكل على …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 3، ص 170، يذكر ما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
