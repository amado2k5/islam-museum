text: |-
  قلاج .
  ٥٣٢
  وأفصى اسم رجل وهما أفصيان أفصى بن دعمىّ بن جديله بن أسدين ربيعة بن نزار وأفصى
  ابن عبدالقيس بن دعمى بن جديلة بن أسدبن ربيعة ⁦( ض)⁩ القضاء الساحة وما اتسع
  من الارض يقال أفضيت اذا خرجت الى الفضاء وأفضيت الى فلان سرّى وأفضى الرجل
  الى احر أنه باشرها وجامعها وأفضاها اذا جعل مسلكبها واحدا والمفضاة الشريم وأفضى
  يده الى الارض اذامسها بساطن راحته فى سجوده والنضامة صور الشى المختلط يقال
  طعام فضا أى فوضى مختاط وقال
  فقلت لها يا عمنالك ناقنى * وترفضاف عيبق وزبيب
  وأمرهم فضابينهم أى لا أمير عليهم عا الافعى حية وهو أفعل تقول هذه أفعى بالتذوين
  وكذلك أروى والمع أفاهى والافعوان ذكر الافاعى وأرض مفعاة ذات أفاعى والمفعاة
  بالتشبديد السمة التى على صورة الافعى وتفعى الرحل صاركلافعى فى الشرة(فغا الفغو
  والفاغية نور الحناء وأذفى النبات أى خرجت فاغيته والفقامقصور البسر الفاسد المغبرّ
  يقال منه أفقت الخلة ⁦( قا)⁩ فقوة السهم فوقه والجهع فقا وأنتد أبو عمرو بن العلاء
  ونبلى وفقاهاكعراقيب قطاطحل * فلا) الفلاة المفازة والمع الفلا والفلوات وبجع
  الفلاة فلى على فعول مثل عصاوعصى وأنندأبوزيد
  موصولة وصلابها الفلىّ • القى ثم التى ثم ااقى
  وأفلى القوم اذا صاروا الى الفلاة والذلو يتشديد الواوالمهرلانه يفتلى أى يقطم قال دكين
  ابن رجاء* كان لناوهو فلوربيه* وغدلواد (ننى فلوّة كما فالواعدة وعدوة والمسع أفلاء
  مغل عدووأعدا وفلاوى أيضامثل خطايا وأصله فعائل وقد ذ كرناه فى الهمز أبوز يدفلق
  اذا فتحت الفدشددت الواو واذا كسرت خففت فقات فلوممال جرو قال مجاشع بن
  دارم
  جرول يافلوبني الهمام * ذأين عنك القهر بالحسام .
  وفلوته عن أمّه واقتليته اذافظمته قال الاعشى
  ملع لاعة الفؤاد الى يحث س فلاه عنها فبقس الفالى
  وفرس مفل ومقلية ذات فلو وبقال أيضافلوته أى ربيته قال الحطيقة بصف رجلا
  نجيب فلا. فى الرباط نجيب)ء وكذلك افتلنته وقال
  وايس يهلك مناسيد أبدا * الااقتلينا غلا ماسيدافينا
  وفلوته بالسيف وفليته اذاضربت يدر أسه وفليت رأسه من للقمل وتفالى هو واستفلى رأسه
  أى اشتهى أن يفلى وفليت الشعراذا تدبرته واستخرجت معانيه وغر يبسه عن ابن السكيت
  وأماقول عمرو بن معديكرب .
  تراه كالثغام بعلّ مسكا • يسوء الفاليات اذافليى
  قال الاخفسْ ير يدفليننى فحذف البون الاخيرة لان هذه الذون وقاية للفعل وايبت باسم
  فأمّا النون الاولى فلا يجوز طرحها لانها الاسم المضمر وقال أبوحية الهميرى
  أبالموت الذى لابدأنى • حلاف لا أباك تخوة:-نى
  أراد تخوّفيننى فحذف وعلى هذا قرأبعض القرّاءفيم تدشرون فأذهب احدى التوثين استبثقالا
