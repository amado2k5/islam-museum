label: { ar: "الموطأ 221 — ابن عمر يقرأ في صبح السفر بالعشر السور الأول من المفصل", en: "Muwatta 221", es: "Muwatta 221", fr: "Muwatta 221", ur: "موطا 221", tr: "Al-Muwatta 221 — İbn Umar, yolculuk halindeyken sabah namazında Al-Mufassal'ın ilk on suresini okur.", id: "Al-Muwatta 221 — Ibnu Umar membaca sepuluh surah pertama Al-Mufassal dalam salat subuh ketika sedang bepergian." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب القراءة في الصبح: كان عبد الله بن عمر يقرأ في الصبح في السفر بالعشر السور الأول من المفصل، في كل ركعة بفاتحة الكتاب وسورة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.134}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, sabah namazındaki okuma bölümünde şöyle denmektedir: Abdullah ibn Umar, yolculuk halindeyken sabah namazında Mufassal'ın (Kur'an'ın son kısmı) ilk on suresini okur, her rekatta Fatiha ve başka bir sure okurdu. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suwaid, Abd al-Razzaq, el-Şafiî, Muhammed ibn al-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.134}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang bacaan dalam shalat subuh: Abdullah ibn Umar biasa membaca sepuluh surah pertama Mufassal (bagian terakhir Al-Quran) dalam shalat subuh ketika bepergian, membaca Al-Fatihah dan satu surah lainnya di setiap rakaat. Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, al-Shafi’i, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr. {cite:muwatta-maruf-1997 p.134}"
