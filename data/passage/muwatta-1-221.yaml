label: { ar: "الموطأ 221 — ابن عمر يقرأ في صبح السفر بالعشر السور الأول من المفصل", en: "Muwatta 221" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب القراءة في الصبح: كان عبد الله بن عمر يقرأ في الصبح في السفر بالعشر السور الأول من المفصل، في كل ركعة بفاتحة الكتاب وسورة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ومحمد بن الحسن ويحيى بن بكير. {cite:muwatta-maruf-1997 p.134}"
