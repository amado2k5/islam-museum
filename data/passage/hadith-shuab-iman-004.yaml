text: "زدرى به ويستهينه بنفسه أولى ولأن الله تعالى وصف القرآن بأنه في كتاب مكنون لا يمسه إلا المطهرون فإذا كان فوق السماوات مكتوبا محفوظا وليس هناك إلا الملائكة المطهرون فلان يكون فيما بيننا مكتوبا محفوظا والناس مختلفون والأماكن مختلفة والأحوال"
