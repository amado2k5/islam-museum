text: "… يزيد انظر مالك بن زيد مالك بن يزيد بن مالك بن كعب الكلبى من بلى عليم المامون مبد الله بن هارون الرشيد - -- الماموفي انظر لحسن بن على البادغيسى المامولى ماندويه اليهودى الخيبرى. مالى الزنديق. ماء افريذون فرودين ماهان …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 4، ص 501، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
