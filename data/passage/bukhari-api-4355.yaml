text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا خَالِدٌ، حَدَّثَنَا بَيَانٌ، عَنْ قَيْسٍ، عَنْ جَرِيرٍ، قَالَ كَانَ بَيْتٌ فِي الْجَاهِلِيَّةِ يُقَالُ لَهُ ذُو الْخَلَصَةِ وَالْكَعْبَةُ الْيَمَانِيَةُ وَالْكَعْبَةُ الشَّأْمِيَّةُ، فَقَالَ لِي النَّبِيُّ \" أَلاَ تُرِيحُنِي مِنْ ذِي الْخَلَصَةِ \". فَنَفَرْتُ فِي مِائَةٍ وَخَمْسِينَ رَاكِبًا، فَكَسَرْنَاهُ وَقَتَلْنَا مَنْ وَجَدْنَا عِنْدَهُ، فَأَتَيْتُ النَّبِيَّ فَأَخْبَرْتُهُ، فَدَعَا لَنَا وَلأَحْمَسَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4355، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4355 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4355، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
