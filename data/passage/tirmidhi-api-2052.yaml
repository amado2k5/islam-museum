text: "… بْنُ فُضَيْلٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ إِسْحَاقَ، عَنِ الْقَاسِمِ بْنِ عَبْدِ الرَّحْمَنِ، هُوَ ابْنُ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ عَنْ أَبِيهِ، عَنِ ابْنِ مَسْعُودٍ، قَالَ حَدَّثَ رَسُولُ اللَّهِ عَنْ لَيْلَةَ، أُسْرِيَ بِهِ أَنَّهُ لَمْ يَمُرَّ عَلَى مَلإٍ مِنَ الْمَلاَئِكَةِ إِلاَّ أَمَرُوهُ أَنْ مُرْ أُمَّتَكَ بِالْحِجَامَةِ. قَالَ أَبُو عِيسَى وَهَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ مِنْ حَدِيثِ ابْنِ مَسْعُودٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2052، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2052 (Chapters on Medicine), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2052، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
