text: "الكريهة، وتَشَقُّ عليه، والطيبُ غِذاءُ الروحِ التي هي ويضر المعدة، ويزيد في الصفراء والبلغم، ودفع قال صاحب القانون: من أكل مِن دم الضفدع أو جرمه، ورم بدنُه، وكَمَدَ لونُه، وقذف المنيَّ حتى يموت، ولذلك ترك الأطباءُ استعماله خوفاً مِن ضرره، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 716، يذكر الطب والطبيب، والبيمارستان وصناعة الطب، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 716, that mentions medicine and the physician, the hospital and the medical craft, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 1، ص 716 کا اقتباس جس میں طب اور طبیب، بیمارستان، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen escaneado 1, pág. 716, que menciona la medicina y el médico, el hospital y la práctica médica, los órganos del cuerpo; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 1 scanné, p. 716, qui mentionne la médecine et le médecin, l'hôpital et l'art médical, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn al-Qayyim'in Zad al-Ma'ad adlı eserinin resimli 1. cildinin 716. sayfasından, tıp ve hekim, hastane ve tıp mesleği ile vücut organlarından bahseden bir bölüm; makineyle okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Zad al-Ma’ad karya Ibn al-Qayyim, jilid bergambar 1, hlm. 716, yang menyebutkan tentang kedokteran dan dokter, rumah sakit dan profesi medis, serta organ-organ tubuh; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
