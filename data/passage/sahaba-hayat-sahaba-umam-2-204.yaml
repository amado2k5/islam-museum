text: "… أضاء لى اضاءة اخرى حتى نظرت الى قصور الحيرة؛ وايض المدائن وسمعت صوتا فى النور وهو يقول : ظهر الاسلام، وكسرت الاصنام، ووصلت الارحام. فانتبهت فزعا فقلت لقومى: واللّٰه ليحدثن فى هذا الحى من قريش حدث، فأخبرتهم بما رأيت. فلما …"
summary:
