text: "… أنَّ آدمَ كان يَرْسم الخطوط بالبنان وكانت مفاتيح الغيب، بتصرف. حديث موضوع، ذكره ابن عَرّاق في تنزيه الشريعة المرفوعة عن الأخبار الشنيعة الموضوعة. المُزهر في علوم اللغة وأنواعها، وقال: هذا الأثر أخرجه ابن أشتة في كتاب المصاحف عن كعب الأحبار. …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 97، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 97, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
