text: "… كتب إلى ملوك الأرض، وأرسل إليهم رسله، فكتب إلى ملك الرُّوم، فقيل له : سطر، ورسول سطر، واللَّه سطر البخاري:. وختم به الكتب إلى الملوك، وبعث ستة نفر في يوم واحد في المحرم سنة سبع. الكتاب إلى النجاشي فأولهم عمرو …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 39، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
