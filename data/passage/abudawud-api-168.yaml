label: { ar: "سنن أبي داود 168 — الأب والأبوة", en: "Sunan Abi Dawud 168 — the father and fatherhood", ur: "سنن ابی داؤد 168 — باپ اور والدیت", es: "Sunan Abi Dawud 168 — El padre y la paternidad" }
text: "حَدَّثَنَا نَصْرُ بْنُ الْمُهَاجِرِ، حَدَّثَنَا مُعَاوِيَةُ بْنُ عَمْرٍو، حَدَّثَنَا زَائِدَةُ، عَنْ مَنْصُورٍ، عَنْ مُجَاهِدٍ، عَنِ الْحَكَمِ، أَوِ ابْنِ الْحَكَمِ عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ بَالَ ثُمَّ تَوَضَّأَ وَنَضَحَ فَرْجَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 168، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 168 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 168، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 168 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
