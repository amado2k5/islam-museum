label: { ar: "صحيح البخاري 5063 — مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 5063 — forgiveness of past sins", ur: "صحیح بخاری 5063 — پچھلے گناہوں کی مغفرت" }
text: "… أَزْوَاجِ النَّبِيِّ يَسْأَلُونَ عَنْ عِبَادَةِ النَّبِيِّ فَلَمَّا أُخْبِرُوا كَأَنَّهُمْ تَقَالُّوهَا فَقَالُوا وَأَيْنَ نَحْنُ مِنَ النَّبِيِّ قَدْ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ وَمَا تَأَخَّرَ. قَالَ أَحَدُهُمْ أَمَّا أَنَا فَإِنِّي أُصَلِّي اللَّيْلَ أَبَدًا. وَقَالَ آخَرُ أَنَا أَصُومُ الدَّهْرَ وَلاَ أُفْطِرُ. وَقَالَ آخَرُ أَنَا أَعْتَزِلُ النِّسَاءَ فَلاَ أَتَزَوَّجُ أَبَدًا. فَجَاءَ رَسُولُ اللَّهِ فَقَالَ \" أَنْتُمُ الَّذِينَ قُلْتُمْ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5063، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 5063 (Wedlock, Marriage (Nikaah)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 5063، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
