label: { ar: "الموطأ 701 — مالك: إن كانت الضأن أكثر أخذ المصدق منها، وإن كانت المعز أكثر أخذ منها، وإن استوتا فمن أيتهما شاء", en: "Muwatta 701" }
summary:
  ar: "قول لمالك: فإن كانت الضأن أكثر من المعز ولم يجب على ربها إلا شاة واحدة أخذ المصدق تلك الشاة من الضأن، وإن كانت المعز أكثر أُخذ منها، فإن استوى الضأن والمعز أخذ من أيتهما شاء. ويذكر المحقق فروق النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.352}"
