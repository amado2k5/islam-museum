label: { ar: "الموطأ 701 — مالك: إن كانت الضأن أكثر أخذ المصدق منها، وإن كانت المعز أكثر أخذ منها، وإن استوتا فمن أيتهما شاء", en: "Muwatta 701", es: "Muwatta 701", fr: "Muwatta 701", ur: "موطا 701", tr: "El-Muvatta 701 — Malik: Koyunlar çoksa zekât onlardan alınır; keçiler çoksa onlardan alınır; sayıları eşitse dilediğinden alınır.", id: "Al-Muwatta 701 — Malik: Jika domba lebih banyak, zakat diambil dari domba; jika kambing lebih banyak, zakat diambil dari kambing; dan jika jumlahnya sama, maka diambil dari mana pun yang dia inginkan." }
summary:
  ar: "قول لمالك: فإن كانت الضأن أكثر من المعز ولم يجب على ربها إلا شاة واحدة أخذ المصدق تلك الشاة من الضأن، وإن كانت المعز أكثر أُخذ منها، فإن استوى الضأن والمعز أخذ من أيتهما شاء. ويذكر المحقق فروق النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.352}"
  tr: "Malik şöyle demiştir: Koyun sayısı keçi sayısından fazlaysa ve mal sahibi sadece bir koyun borçluysa, tahsildar o koyunu koyunlar arasından alır. Keçi sayısı koyun sayısından fazlaysa, keçiler arasından alır. Koyun ve keçi sayısı eşitse, dilediğinden alır. Editör, rivayetler arasındaki farklılıklardan ve Ebu Mus'ab'ın bunu Malik'ten naklettiğinden bahsetmektedir. {cite:muwatta-maruf-1997 s.352}"
  id: "Malik berkata: Jika jumlah domba lebih banyak daripada kambing dan pemiliknya hanya memiliki satu domba, penagih mengambil domba itu dari domba tersebut. Jika jumlah kambing lebih banyak daripada domba, ia mengambil dari kambing. Jika jumlah domba dan kambing sama, ia mengambil dari mana pun yang ia pilih. Editor menyebutkan perbedaan dalam versi-versi tersebut dan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.352}"
