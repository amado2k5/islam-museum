text: "… وأخذوا بالرضا، ولهوا عن الدنيا، وأقروا بالعبودية للملك الديان، ورضوا به دون كل قريب وجميم، فشعوا لهيبته، وأقرواله بالتقصير، وأذعنوا له بالطاعة، ولم يبالوا بالقلة، إذا خلوا، بأقل بكاء وإذا عوملوافا خوان حياه وإذا كلوا فحكماء وإذا ستلوا فعلماء وإذا …"
summary:
  ar: "مقطع من حلية الأولياء وطبقات الأصفياء، المجلد المصوَّر 8، ص 338، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Hilyat al-Awliya' wa-Tabaqat al-Asfiya', scan volume 8, p. 338, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "حلیۃ الاولیاء و طبقات الاصفیاء، اسکین جلد 8، ص 338 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volume numérisé 8, p. 338, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volumen escaneado 8, p. 338, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hilyat al-Awliya' wa Tabaqat al-Asfiya' adlı resimli cilt 8'in 338. sayfasından, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Hilyat al-Awliya' wa Tabaqat al-Asfiya', jilid bergambar 8, halaman 338, berisi cerita tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber. Disusun oleh Juha and Islamic Folklore Browser."
