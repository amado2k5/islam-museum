label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ٢٧", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 27", ur: "تثبیت دلائل نبوت — حصہ اول، باب 27" }
text: "وهو أن أبا بكر غزا اليمامة، ومسيلمة، وربيعة، وطلحة، وبني أسد، وتلك القبائل المرتدة، ومانعي الزكاة مع إذعانهم بإقامة الصلاة، وأنكر رضي الله عنه تغيير دين رسول الله ، وأنه لا يقرهم على ترك خصلة واحدة من دينه …"
summary:
  ar: "مقطع من الباب ٢٧ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 27 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 27 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
