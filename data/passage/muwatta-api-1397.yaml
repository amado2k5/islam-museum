label: { ar: "موطأ مالك 1397 — الأب والأبوة", en: "Muwatta Malik 1397 — the father and fatherhood", ur: "موطأ مالک 1397 — باپ اور والدیت", es: "Muwatta Malik 1397 — El padre y la paternidad", fr: "Muwatta Malik 1397 — le père et la paternité" }
text: "… يَهْلِكُ الأَبُ فَيَبِيعُ أَحَدُ وَلَدِ الْمَيِّتِ حَقَّهُ فِي تِلْكَ الأَرْضِ فَإِنَّ أَخَا الْبَائِعِ أَحَقُّ بِشُفْعَتِهِ مِنْ عُمُومَتِهِ شُرَكَاءِ أَبِيهِ. قَالَ مَالِكٌ وَهَذَا الأَمْرُ عِنْدَنَا. قَالَ مَالِكٌ الشُّفْعَةُ بَيْنَ الشُّرَكَاءِ عَلَى قَدْرِ حِصَصِهِمْ يَأْخُذُ كُلُّ إِنْسَانٍ مِنْهُمْ بِقَدْرِ نَصِيبِهِ إِنْ كَانَ قَلِيلاً فَقَلِيلاً وَإِنْ كَانَ كَثِيرًا فَبِقَدْرِهِ وَذَلِكَ إِنْ تَشَاحُّوا فِيهَا. قَالَ مَالِكٌ فَأَمَّا أَنْ يَشْتَرِيَ …"
summary:
  ar: "حديث في موطأ مالك، رقم 1397، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 1397 (Pre-emption in Property), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 1397، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 1397 (Preferencia sobre la propiedad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Muwatta Malik, n° 1397 (Droit de préemption), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
