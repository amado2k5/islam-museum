text: "قال: جاء رجل من اليهود إلى عمر، فقال: يا أمير المؤمنين! آية في كتابكم تقرؤونها؛ لو علينا نزلت معشر اليهود، لا تخذنا ذلك اليوم عيدا! قال: وأي آية؟ قال: ( اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم ٱلإسلم"
