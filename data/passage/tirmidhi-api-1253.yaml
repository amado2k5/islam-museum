label: { ar: "جامع الترمذي 1253 — اليتيم وفقد الأب", en: "Jami' al-Tirmidhi 1253 — the orphan and the father lost", ur: "جامع ترمذی 1253 — یتیم اور باپ کی موت", es: "Jami' al-Tirmidhi 1253 — El huérfano y el padre perdido" }
text: "… أَهْلِهِ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ وَقَدْ رُوِيَ مِنْ غَيْرِ وَجْهٍ عَنْ جَابِرٍ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ. يَرَوْنَ الشَّرْطَ فِي الْبَيْعِ جَائِزًا إِذَا كَانَ شَرْطًا وَاحِدًا. وَهُوَ قَوْلُ أَحْمَدَ وَإِسْحَاقَ. وَقَالَ بَعْضُ أَهْلِ الْعِلْمِ لاَ يَجُوزُ الشَّرْطُ فِي الْبَيْعِ وَلاَ يَتِمُّ الْبَيْعُ إِذَا كَانَ فِيهِ شَرْطٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1253، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1253 (The Book on Business), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1253، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1253 (El Libro de los Negocios), menciona al huérfano y al padre ausente. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
