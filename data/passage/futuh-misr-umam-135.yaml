text: "… ملك الروم يقبّح رأيه ويعجّزه ويرد عليه فعله، ويقول فى كتابه : إنما أتاك من العرب إنذا عشر ألفا و بعصر من مها من كثرة عدد القبط مالا يحصى، فإن كان القبط كرهوا القتال وأحبوا أداء الجزية إلى الدرب، واختاروهم …"
summary:
  ar: "مقطع من فتوح مصر لابن عبد الحكم، ص 135، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Hakam's Futuh Misr, p. 135, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "فتوح مصر، ابن عبد الحکم، ص 135 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Futuh Misr de Ibn 'Abd al-Hakam, pág. 135, con menciones de naciones, religiones y pueblos no musulmanes; tomado del escaneo automático, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Futuh Misr d'Ibn 'Abd al-Hakam, p. 135, mentionnant des nations, des religions et des peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur Umam."
  tr: "İbn Abdül-Hakam'ın *Futuh Misr* (Mısır'ın Fethi) adlı eserinin 135. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
