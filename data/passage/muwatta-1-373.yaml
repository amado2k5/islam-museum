label: { ar: "الموطأ 373 — أبو هريرة: إني لأصلي في ثوب واحد وإن ثيابي لعلى المشجب", en: "Muwatta 373", es: "Muwatta 373", fr: "Muwatta 373", ur: "موطا 373", tr: "El-Muvatta 373 — Ebu Hurayra: Tek bir elbise ile namaz kılıyorum ve elbiselerim askıda asılı duruyor.", id: "Al-Muwatta 373 — Abu Hurairah: Aku shalat dengan hanya mengenakan sehelai pakaian, dan pakaianku tergantung di jemuran." }
text: "إني لأصلي في ثوب واحد وإن ثيابي لعلى المشجب"
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب، في باب الرخصة في الصلاة في الثوب الواحد: سُئل أبو هريرة هل يصلي الرجل في ثوب واحد فقال: نعم، فقيل له هل تفعل أنت ذلك، فقال إنه ليصلي في ثوب واحد وإن ثيابه لعلى المشجب، وهو عود تُعلق عليه الثياب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.203}"
  tr: "Malik'in İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan rivayet ettiği, tek elbise ile namaz kılınmasının serbest olduğu bölümdeki bir hadiste: Ebu Hurayra'ya, \"Bir erkek tek elbise ile namaz kılabilir mi?\" diye soruldu. O da, \"Evet\" diye cevap verdi. Sonra, \"Bunu yapıyor musun?\" diye soruldu. O da, \"Diğer elbiselerim askıda olsa bile, tek elbise ile namaz kılıyorum\" diye cevap verdi. (Askı, elbiselerin asıldığı bir çubuktur.) Editör, bu hadisin Ebu Mus'ab ve Suveyd tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.203}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Ibn Shihab dari Sa'id ibn al-Musayyab, dalam bab tentang keringanan shalat dengan satu pakaian: Abu Hurayrah ditanya, \"Bisakah seseorang shalat dengan satu pakaian?\" Beliau menjawab, \"Ya.\" Kemudian beliau ditanya, \"Apakah Anda melakukan itu?\" Beliau menjawab, \"Saya shalat dengan satu pakaian meskipun pakaian saya yang lain ada di rak jemuran,\" yaitu sebuah tongkat tempat pakaian digantung. Editor menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.203}"
