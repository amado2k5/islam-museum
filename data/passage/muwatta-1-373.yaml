text: "إني لأصلي في ثوب واحد وإن ثيابي لعلى المشجب"
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سعيد بن المسيب، في باب الرخصة في الصلاة في الثوب الواحد: سُئل أبو هريرة هل يصلي الرجل في ثوب واحد فقال: نعم، فقيل له هل تفعل أنت ذلك، فقال إنه ليصلي في ثوب واحد وإن ثيابه لعلى المشجب، وهو عود تُعلق عليه الثياب. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.203}"
