label: { ar: "نوادر جحا الكبرى، ص 44 — «أظنك لم تسمع كلامي وأغضبت أمك»", en: "Nawadir Juha al-Kubra, p. 44 — 'I Think You Did Not Heed My Words and Angered Your Mother'", ur: "نوادر جحا الکبریٰ، ص 44 — «لگتا ہے تم نے میری بات نہ مانی اور اپنی ماں کو ناراض کیا»", fr: "Nawadir Juha al-Kubra, p. 44 — « Je crois que tu n'as pas écouté mes paroles et que tu as irrité ta mère »", es: "Nawadir Juha al-Kubra, p. 44 — «Creo que no hiciste caso de mis palabras y enfureciste a tu madre»" }
text: "… أظنُّكَ لم تسمعْ كلامي وأغضبْتَ أمَّك ابتاع جحا حماراً من السوق وأتى به يجرُّه خلفَه فرآه اثنانٍ من العيّارينَ فآتفقا عليه، وتقدّم أحدُهما فخلَع الرسَنَ مِنْ رأسِ الحمارِ بخفةٍ، وربط رأسَهُ بالرسن، ومشى خلف الشيخ، وعاد الثاني بالحمار. ولما وصل …"
summary:
  ar: "استبدل قاطعا طريق حمار جحا برجل، فتوسل الرجل، الذي لعنته أمه أن يصير حمارًا، أن يُطلق، فأطلقه جحا ونصحه بطاعة أمه، وفي اليوم التالي رأى جحا الحمار مرة أخرى فوبّخه. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  en: "Two highwaymen swap Juha's donkey for a man; the man, cursed by his mother to become a donkey, begs to be freed; Juha frees him and advises him to obey his mother; the next day Juha sees the donkey again and tells it off. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  ur: "دو راہزنوں نے جحا کا گدھا ایک آدمی سے بدل دیا؛ اس آدمی کو اس کی ماں نے گدھا بن جانے کی بددعا دی تھی، وہ آزاد کیے جانے کی منت کرنے لگا؛ جحا نے اسے آزاد کر دیا اور ماں کی فرماں برداری کی نصیحت کی؛ اگلے دن جحا نے گدھے کو پھر دیکھا تو اسے ڈانٹا۔ {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  fr: "Deux bandits de grand chemin échangent l'âne de Juha contre un homme ; l'homme, maudit par sa mère afin de devenir un âne, supplie qu'on le libère ; Juha le libère et lui conseille d'obéir à sa mère ; le lendemain, Juha revoit l'âne et le réprimande. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
  es: "Dos salteadores cambian el burro de Juha por un hombre; el hombre, a quien su madre maldijo para que se volviera burro, suplica que lo liberen; Juha lo libera y le aconseja obedecer a su madre; al día siguiente Juha vuelve a ver al burro y lo regaña. {cite:juha-nawadir-kubra-djuwaydi p. 44}"
