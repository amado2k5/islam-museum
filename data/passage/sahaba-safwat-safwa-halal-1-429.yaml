text: "… عامر بن عبد الله! - يعني : بشر بن الحارث.. وعن أحمد بن عبد اللّٰه بن خالد قال: سئل أحمد بن جنبل عن مسألة في الورع؟ فقال: أنا أستغفر الله؛ لا يحل لي أن أتكلم في مسألة في الورع، أنا …"
