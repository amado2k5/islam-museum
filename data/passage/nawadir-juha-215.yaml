text: "… له الأجرة ولك الصوت عندما كان الشيخ في قونية ذهب إلى الحاكم وطلب منه أن يعيِّنه قاضياً. ولما لم يكن في مناصب القضاء مكان خالٍ اعتذر إليه الحاكم، ووعده. وعاد الشيخ بعد أيام يطلبُ وظيفة أُخرى، والحاكم يسوّفُه ويماطِلُه. ولما …"
summary:
  ar: "طلب جحا من الوالي في قونية منصب قاضٍ فلم يكن شاغر، فانتظر ثم طلب منصباً لا منافس فيه فسُمي قاضي الظل وعينه الوالي، وفي خصومة بين رجل وحطاب على أجرة حكم جحا بأن يدفع الحطاب للرجل الصائح رنين الدراهم. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  en: "In Konya Juha asks the governor for a judgeship, but none is vacant. After waiting he asks for a post with no rival, called 'shadow judge', and the governor appoints him. In a dispute between a man and a wood-cutter about a fee, Juha rules that the wood-cutter should pay the shouting man with the sound of coins. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  ur: "جحا قونیہ میں والی سے قاضی کا عہدہ مانگتا ہے مگر کوئی جگہ خالی نہیں ہوتی۔ انتظار کے بعد وہ ایسا عہدہ مانگتا ہے جس کا کوئی حریف نہ ہو، جسے سایہ قاضی کہا جاتا ہے، اور والی اسے مقرر کر دیتا ہے۔ ایک آدمی اور لکڑ ہارے کے درمیان اجرت کے جھگڑے میں جحا فیصلہ دیتا ہے کہ لکڑ ہارا چیخنے والے آدمی کو سکوں کی کھنک سے ادائیگی کرے۔ {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  fr: "À Konya, Juha demande au gouverneur une charge de juge, mais aucune n'est vacante. Après avoir attendu, il demande un poste sans rival, appelé « juge de l'ombre », et le gouverneur le nomme. Dans un litige entre un homme et un bûcheron au sujet d'un salaire, Juha décide que le bûcheron paiera l'homme qui crie avec le son des pièces. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
  es: "En Konya, Juha pide al gobernador un puesto de juez, pero no hay ninguno vacante. Tras esperar, pide un cargo sin rival, llamado «juez de la sombra», y el gobernador lo nombra. En una disputa entre un hombre y un leñador sobre un pago, Juha dictamina que el leñador pague al hombre que gritaba con el sonido de las monedas. {cite:juha-nawadir-kubra-djuwaydi p. 98}"
