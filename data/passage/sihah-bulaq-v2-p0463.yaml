  *زورق)*
  والانتياق مثل الانتقاء وينشد * مثل القياس انتاقها المنق * يعنى الفسى وكان الكسائى
  بقول هو من النيقسة ( هق نهاف الهارصوتة وقدنهق يتهو وينهق نهيقا ونهاقا
  قال الاصمعي" الناهقان عظمان شاخصان من ذى الحافر فى مجرى الدمع قال يعقوب
  ويقال لهما أيضا الذواهق قال الشاعر يصف فرسا
  بعارى النواهق صات الجبين بستنّ كالتيس ذى الحلب
  وكان أبو، بيدة يقول الناهق من المار حيث يخرج النهاق من حلقه ومن الخيل ونواهة.
  مخارج نهاقه وأنشد للنمر بن نولب
  فأرسل مهماله أنزعا • فشك نواهقه وألغما .
  صل الداد بق وبقيبق ويوقاهلك والموبق مفعل منه كالموعد مفعل من
  وعديعد ومنه قوله تعالى وجعلنا بينهسم مويقا وفيه لغة أخرى وبق يوبق وبقاوفيه
  لغة ثالثة وبق بيق بالكسر فيهما وأو بقه أى أهدكه ⁦(وثى)⁩ وثفت بفلان أنق
  إبالكسر فيه مائقة اذا ائتمته والميثاق العهدصارت الواوياء لانكسار ما قبلها وابهع
  المواثيق على الاصل والمياثق والماثيق أيضا وأنسدابن الاءرابى ⁦(١ )⁩
  هى لا يجلّ الدهر الاناذتنا * ولا نسأل الاقوام عهد الميائق
  والمرثق الميشاق والمواثقة المعاهدة ومنه قوله تعالى وميشاقه الذى رائقسكم به وأوثقه فى
  الوثاق أى شدّه وقال تعالى فشدوا الوثاق والوثاق بكسر الواولغة فيه والوثيق الشئ
  الهمكم والجع وثاق وقد وثق بالضم وثاقة أى صاروثياويتال أخذ بالوئية فى أمره أى
  بالثقة وتوثق فى أمره مثله ووثقت الشى توثيافهو موثق وناقة موثقة اللخاق أى محكمته
  ووثقت فلانا اذاقلت انه ثقة واستوثقت منهأى أخذت منه الوثيقة ⁦(ودق)⁩ الودق
  المطر وقدودق يدو ودقا أى قطر قال الشاعر
  ذلا حزنة ودقت ودقها • ولا أرض أبقل ابقالها
  وودقت اليه دنوت منه وفى المثل ودق العير الى الماء أى دنامفه يضرب لمن خضع للشئ
  لحرصه عليه والموضع مودق ومنه قول امرى القيس ٢
  تعقى يذيل المرطاذجئت مودقى * وذات ودقين الداهية أى ذات وجهين كانهاجاءت من
  وجهين قال السكميث
  وكائن وكم من ذات ودقين ضئبل • ناذكفيت المسلين عضالها
  وودقت به ودقااستأنت به ويقال لذوات الحافراذا أرادت الفحل ودقت تدق ودقا
  وأودقت واستودقت وأتان ودوق وف-رس ودوق ورديق أيضاويم اوداق والوديقدة
  شقة الحر قال الهذلى
  حامى الحقيقة نسال الوديقة معشتاف الوسيقة لانكس ولا وانى
  والوادق الحديد قال أبوة يس بن الاسلت
  ومجنا أسمرقراع * صدق خسام وادق حده
  ⁦( ورق)⁩ الورق الدراهم المضروية وكذلت الرقة والهاءعوض من الواوو فى الحديث فى الرقة
