text: |-
  • ⁦(ه ذن)⁩
  ٤١٧
  حيثما وقفت والمع وكنان ووكتات ووكنات ووكن كماقلناه فى جمع ركبة وتقول وكن الطائر
  يضهيكنه وكنا أى حضنه وتو كن أى تمكن والواكن الجالس قال عمروين شاس وذكرنساء
  ومن ظعن كالدوم أشرف فوقها • ظباء السلى واكنات على انحل
  أى جالسات على الطنافس التى وطأن بها الهوادج والسلى اسم موضع ونصب واكنات على
  الحال ( وهن. الوهن الضعف وقدوهن الانسان ووهنه غيره يتعدى ولا يتعدّى وقال
  طرفة • اننى لست بموهون فقر * ووهن أيضا بالكسروهنا أى ضعف وأوخنته أيضا
  ووهنته توهينا والوهن من الابل الكثيف والوهن نحو من أصف الليل والموهن مثله قال
  الاصمعى" هو حين يدبر الليل وقد أوهنا صرنا فى تلك الساعة والواهنة القصيرى وهى أسفل
  الاضلاع وامرأة وهنائة فيه افتوروأناة وين) الوين العنب الاسود الواحدة وينة
  يا حبد انضحت بالمشافر • كانه تهتان يوم ماطر
  وقال النضر بن شهويل التهتان مطرساعة ثم يقترثتم يعود وأنتد للشماخ
  أرسل يومادية تهتانا * سيل المتان يملاالريانا.
  بقال هتى المطر والدمع يهتن هتنا وهت ونادتهتانا اذا قطر ممتابعا وسحاب هاتن وسصائب
  متن مثل راكع وركع ومصاب هتون وايمع هتن مثل عموذوعمد ين لهجات من الابل
  البيض وقال عمرو بن كانوم هجان اللون لم تة رأجنينا• ويستوى فيه المذكروالمؤنت
  والمع يقال بعيرهجان وناقة همان وابل هجان ورعما قالواهجائن قال عمرو بن أحر
  كأن على الهال أوان خفت • هجمائن من نماج أراق عينا
  وأرض هجان طيبة الترب حرب وامرأة هجان كريمة وقال الاصمحىّ فى قول على رضوان
  اللّٰه عليه هذاجناى وهمانه فيه وكل جان يده الى فيه يعنى خياره اليزيدى هو هجان بين
  الهجانة ورحل هجين بين الهجنة والهجنة فى الناس والخيل انماتكون من قبل الام
  فاذا كان الاب عتيقا والام ليست كذلك كان الولد هجينا وقال الراجز
  •العبد والهجين والفلنقس* والاقراف من قبل الاب وقالت هند
  فان تتجت حرّاكر يما فبالحرا * وان يك اقراف فن قبل الفدل
  والهاجن الصبية تزوج قبل بلوغها وكذلك الصغيرة من البهائم وفى المثل جلت الهاجن
  عن الولد أى صغرت وجلت الهاجن عن الرفد وهو القدح الضخم وقال ابن الاعرابيّ
  جلت العلبة عن الهاجن أى كبرت قال وهى بنت اللبون يحمل عليها فتلقح ثم تفتج وهى حقة
  قال ولا يصلح أن يفعل بهاذلك ويقال هجنه أى جعله هجينا وتهيين الامر أيضا تقيهه
  واهتجنت الجارية اذا وطقت وهى صغيرة والمهتينة التخلة أول ما تلقح ⁦(هدن)⁩، هدن
  يهدن هدوناسكن وهدنه أى سكنه يتعدى ولا يتعدى وقال
  انّ العواويرمأ كول حظوظتها • وذوالمكهاءة بالاقوال مهدون
  وهادنه صالحه والاسم منه-ما الهدنة ومنه قواهم هدنة على دخن أى سكون على عنّ
  وتهادنت الاموراستقامت والهدان الاحق الثقيل والجمع الهدون وتهدين المرأة ودها
