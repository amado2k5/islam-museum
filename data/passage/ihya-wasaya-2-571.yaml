text: "… منه عضو لم يبالغ فيه إلا قلب لنا حتى نفرغ منه، وإن معنا لحفيفا فى البيت كالريج الرخاء، ويصوت بنا ارفقوا برسول اللّٰه فإنكم ستكفون فبكذا كانت وفاة رسول اللّٰه، ولم يترك سبدا ولا لبدا إلا دفن معه. قال أبو …"
summary:
