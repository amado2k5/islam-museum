text: |-
  ⁦(فصل الهاء)⁩
  ٢٦٩
  كسره وضعضعه وهدته المصيبة أى أوهنت ركنه الاصمحى يقال فلان بهد على مالم يسم
  فاعله اذا أنى عليه بالجلد والقوة وتقول هررت برجل هذك من رجل معناه أثقلك وصف
  محاسنه وفيه لغتان منهم من يجريه مجرى المصدر فلايوتنه ولا يثنيه ولا يجمعه ومنهسم من
  يجعله فعلا فيننى ويجمع تول مررت برحل هدلكْ من رحسل وباصرأة هدتك من احرأة
  وبرجلين هدالدوبرجال هدوك ويامر أتين هد تاك و بنسوة هددنك وانم دالجبل أى انسكسر
  وقولهم ماهده كذا أى ما كسره كذا قال الاصمعى الهد الرجل الضعيف يقول الرجل
  للرجسل اذا أوعده اتى لغيرهدّ أى غير ضعيف وقال ابن الاعرابى الهدمن الرجال الجواد
  السكريم وأما الجبان الضعيف فهو الهد بالكسر وأنشد
  ايسوابم دين فى الحروب اذا • تعقد فوق الحراقف النطق
  والهدة صوت وقع الحائط ونحوه تقول منه هديم د بالكسره_ديذا والهادصوت يسمعه
  أهل الساحل يآتيهم من قبل البحرله دوى فى الارس وربما كانت منه الزلزلة ودويه هديده
  وهدهدة الحمام دوى هديره والفعل يم دهد فى هديره هدهدة وجع الهدهدة هداهد قال
  لعجاج يتبعن ذاهداهدعجنسا • وهدهدت المرأة ابنها أى سركته لينام والتم-ديد
  لتخويف وكذلك التهدد والهد دطار والهداحدمنه قال الراعى
  كهداهد كسر الرماة جناحه والمع الهداهد بالفح و«دادى من المن ⁦(هديد )⁩
  المدايد اللين الخاثرجدًا والهد بدمقصور منه ويقال بعينه هدبد أى عمش وقال
  انه لا يبرئ داء اله-دبد • إلا القلايا من سنام وكبد
  قوله انه يضمة مختلة كما قال آخر
  فييناه يشرى رحله قال قائل * ان حل رخو الملاط غجيب
  ⁦(هرد)⁩ هردت اللحم أهرده بالكسر هردالطبخته حتى تهزا وتفسخ والثهريد م:لشدد
  للمبالغة وهرد العرض الطعن فيه وهودت الثوب شققته والهردى على فعلى بكسر
  الفاءنيت وتوب مهروداى صبغ أصفر ⁦(همد)⁩ هودت النارة ندهفزدا أى
  طفقت وذهبت اليتة والهسمدة السكتة وهمد النوب يه مدهمودا يلى وأهمد فى المكان
  أقام قال الراحزروية
  لمارأتف راضيا بالاحماد • كالكرز المربوط بين الاوتاد
  وأهمدق السير أسرع وهذا الحرف من الإضداد وأنشد الاصمعى
  ما كان الاطلق الاهماد وأرض هامدة لائبات بماونيات ها مديابس وهمدان قبيسلة
  من الين ( ند هنداسم امرأة يصرف ولا يصرف ان شئت جعته بمع التكسيع
  فقلت هنودوان شقت جمعته جمع السلامة فقلت هندات وهندتى فلانة أى تيتن بالمغازلة
  وقال احرا
  غرك من هنادة التهنيد • موعدها والباطل الموعود
  وهنداسم بلادوالنسبة اليهاهندىّ وهنودكة ولك زنيّ وزنوج وسيف هندوائى وان
