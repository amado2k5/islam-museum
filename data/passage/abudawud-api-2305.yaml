label: { ar: "سنن أبي داود 2305 — الكحل، الشكوى من العلة", en: "Sunan Abi Dawud 2305 — kohl for the eye; a complaint of an ailment", ur: "سنن ابی داؤد 2305 — سرمہ، بیماری کی شکایت" }
text: "… سَمِعْتُ الْمُغِيرَةَ بْنَ الضَّحَّاكِ، يَقُولُ أَخْبَرَتْنِي أُمُّ حَكِيمٍ بِنْتُ أُسَيْدٍ، عَنْ أُمِّهَا، أَنَّ زَوْجَهَا، تُوُفِّيَ وَكَانَتْ تَشْتَكِي عَيْنَيْهَا فَتَكْتَحِلُ بِالْجَلاَءِ - قَالَ أَحْمَدُ الصَّوَابُ بِكُحْلِ الْجَلاَءِ - فَأَرْسَلَتْ مَوْلاَةً لَهَا إِلَى أُمِّ سَلَمَةَ فَسَأَلَتْهَا عَنْ كُحْلِ الْجَلاَءِ فَقَالَتْ لاَ تَكْتَحِلِي بِهِ إِلاَّ مِنْ أَمْرٍ لاَ بُدَّ مِنْهُ يَشْتَدُّ عَلَيْكِ فَتَكْتَحِلِينَ بِاللَّيْلِ وَتَمْسَحِينَهُ بِالنَّهَارِ. ثُمَّ قَالَتْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2305، يذكر الكحل، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 2305 (Divorce (Kitab Al-Talaq)), that mentions kohl for the eye, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 2305، جس میں سرمہ، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
