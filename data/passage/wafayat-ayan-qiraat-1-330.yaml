text: "… القراءات وتفقه على مذهب الشافعي على أبي عبد اللّه الحسن بن العباس الرستمي، وقرأ النحو واللغة حتى تمهر فيها، وله التصانيف المفيدة منها أسماء الصحابة، والأمالي الكبير، وكتاب اللطائف، وعوالي التابعين، وكان ثقة ديناً صالحاً، وكان متواضعاً يقرىء كلّ من …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 1، ص 330، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 1, p. 330, that mentions the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 1، ص 330 کا اقتباس جس میں قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Wafayat al-A'yan de Ibn Khallikan, volumen 1, pág. 330, que menciona las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Wafayat al-A'yan d'Ibn Khallikan (tome 1, p. 330) mentionne les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Hallikan'ın \"Vafayat el-A'yan\" (Ünlü Adamların Biyografileri) adlı eserinin 1. cildinin 330. sayfasından, Kur'an okunuşlarına dair bir alıntı; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari \"Wafayat al-A'yan\" (Biografi Tokoh-Tokoh Terkemuka) karya Ibn Khallikan, Jilid 1, halaman 330, yang menyebutkan bacaan Al-Quran; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
