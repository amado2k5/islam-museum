label: { ar: "سنن النسائي 3121 — الأب والأبوة", en: "Sunan al-Nasa'i 3121 — the father and fatherhood", ur: "سنن نسائی 3121 — باپ اور والدیت", es: "Sunan al-Nasa'i 3121 — El padre y la paternidad" }
text: "أَخْبَرَنَا عِيسَى بْنُ إِبْرَاهِيمَ، قَالَ حَدَّثَنَا ابْنُ وَهْبٍ، عَنْ مَخْرَمَةَ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ سُهَيْلَ بْنَ أَبِي صَالِحٍ، قَالَ سَمِعْتُ أَبِي يَقُولُ، سَمِعْتُ أَبَا هُرَيْرَةَ، يَقُولُ قَالَ رَسُولُ اللَّهِ \" وَفْدُ اللَّهِ عَزَّ وَجَلَّ ثَلاَثَةٌ الْغَازِي وَالْحَاجُّ وَالْمُعْتَمِرُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3121، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3121 (The Book of Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3121، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3121 (El Libro de la Yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
