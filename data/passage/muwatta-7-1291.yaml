label: { ar: "الموطأ 1291 — نافع: رأى النبي في بعض مغازيه امرأة مقتولة، فأنكر ذلك ونهى عن قتل النساء والصبيان", en: "Muwatta 1291", es: "Muwatta 1291", fr: "Muwatta 1291", ur: "موطا 1291", tr: "El-Muvatta 1291 — Nafi’: Peygamber, askeri seferlerinden birinde öldürülmüş bir kadın gördü ve bunu onaylamadı, kadın ve çocukların öldürülmesini yasakladı.", id: "Al-Muwatta 1291 — Nafi’: Nabi melihat seorang wanita dibunuh selama salah satu kampanye militernya, dan beliau tidak menyetujui hal itu dan melarang pembunuhan wanita dan anak-anak." }
summary:
  ar: "يروي مالك عن نافع أن رسول الله رأى في بعض مغازيه امرأة مقتولة، فأنكر ذلك، ونهى عن قتل النساء والصبيان. ويذكر المحقق أن أكثر رواة الموطأ رووه مرسلا عن نافع، وأن أبا مصعب أسنده عن ابن عمر. {cite:muwatta-maruf-1997 p.576}"
  tr: "Malik, Nafi'den rivayetle, Resulullah'ın askeri seferlerinden birinde öldürülmüş bir kadın gördüğünü ve bunu kınayarak kadın ve çocukların öldürülmesini yasakladığını bildirir. Araştırmacı, Muwatta'nın ravilerinin çoğunun bunu Nafi'den mursal hadis olarak naklettiğini ve Ebu Mus'ab'ın da İbn Ömer'e kadar uzanan bir rivayet zinciriyle naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.576}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Rasulullah melihat seorang wanita yang terbunuh selama salah satu ekspedisi militernya, dan beliau tidak menyetujuinya, melarang pembunuhan wanita dan anak-anak. Peneliti menyebutkan bahwa sebagian besar perawi Muwatta’ meriwayatkannya sebagai hadits mursal dari Nafi’, dan bahwa Abu Mus’ab meriwayatkannya dengan sanad yang sampai kepada Ibn Umar. {cite:muwatta-maruf-1997 p.576}"
