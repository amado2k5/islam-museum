summary:
  ar: "يروي مالك عن نافع أن رسول الله رأى في بعض مغازيه امرأة مقتولة، فأنكر ذلك، ونهى عن قتل النساء والصبيان. ويذكر المحقق أن أكثر رواة الموطأ رووه مرسلا عن نافع، وأن أبا مصعب أسنده عن ابن عمر. {cite:muwatta-maruf-1997 p.576}"
