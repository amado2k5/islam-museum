  وقدناسه القاضى تفليسانادى طيه أنه أفلس ظلقس قال أبو عبيد الفلنقس
  الذى أبوهمولى وأمهعربية وأنشد
  العبد والهجين والفلنقس • ثلاثة فايهسم تاس
  وقال أبو الغوت الفلنقس الذى أبوهمولى وأمهمولاة والهجين الذى أبوه عتيق وأمه
  مولاة والمقرف الذى أبوه مولى وأمه ليست كذلك
  صل القاف ( س . لقبس شعلة من ناروكذلك المقباس يقال قيست منه
  نارا أقيس قيسافاقبسف أى أعطانى منه قبا وكذلك اقتبست منه نارا واقتيست منه علما
  أيضا أى استغدته قال اليزيدى اقدت الرجل عما وقيسته نارافان كنت طلبتهاله قلت
  أقيسته وقال التكائى اقسته علما وناراسواه قال وقسمه أيضافيه ما والقبيس
  الفهل السريع الالقاح وفى المثل لوة صادفت قبيا وقد قبس الفحل بالكسرقبا
  فهو قيس عن الكسائى وقبيس قال الشاءر
  حلت :لاثة فوضعت تما • فأمّ لقوة وأب قبيس
  واللقوة هى السريعة الحمل وأبو قبيس جبل بمكة وأبو قابوس كنية النعمان بن المنذر بن
  المنذرين امرئ القيس بن عمرو بن عدى اللخمى ملك العرب وجعله النابغة أباقبيس
  للضرورة فصغره تصغير النرخيم فقال يخاطب يزيد بن الصعق
  فان يقدر عليك أبو قبيس * يحط بك المعيشة فى هوان
  وانماصغره وهوير يدتعظيمه كما قال حباب بن المنذر أنا جذيلها الحكان وعذيها المرجب
  وقابوس لا يتصرف للعجمة والتعريف قال النابغة
  نبتت ان أبافايوس أوعدنى • ولارار على زأرمن الاسد
  ق س القدس والقدس الطهراسم ومصدرومنه قبل للجنة -ظيرة القدس وروح
  القدس جبر يل عليه المسلام وقدس بالتسكين جبل عظيم بأرض نجد والتقديس التطهير
  وتقدس أى تطهر والارض المقدسة المطهرة وبيت المقدس والمقدس يشتند ويخفف
  والنسبة اليه مقدسى مثال مجلسى" ومقدسىّ قال الشاعر وهوامر والقيس
  فأدركته يأخذن بالساق والنسا • كماشبرق الولدان ثوب المقدسى
  يعنى يم ودياو يقال ان القادسية دعالها ابراهيم عليه السلام بالقدس وأن ت.كون محلة
  الحاج والقدوس اسم من أسماء اللٰه تعالى وهو فعول من القدس وهو الطهارة وكان
  سيبويه ية ول قدوس وسبوح بفتح أوائلهما وقدذكرنا. فى ذروح قال ثعلب كل اسم جاء
