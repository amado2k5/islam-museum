  والقدوس فان الضم فيهماأكثروقد يفتصان وكذلك الذروح بااضم وقديفتح والقدس
  بالتحريك السطل بلغة أهل الحجازلانه يتماهرفيه والقسداس بالضم شى يعمل كابهان من
