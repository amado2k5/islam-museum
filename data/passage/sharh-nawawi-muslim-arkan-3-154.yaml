text: "… عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ قَالَ : قَألَ رَسُولُ اللهِ لس المُؤْمِنُ الفَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللّهِ مِنَ الْمُؤْمِنِ الصَّعِيفِ، وَفِي كُلٌّ خَيْرٌ. احْرِصْ عَلَى مَا يَنْفَعُكَ، وَأسْتَعِنْ بِاللهِ، وَلَا تَعْجَزْ،.... باب الإيمان بالقدر والإذعان له قوله ف: المؤمن القوي …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 3، ص 154، يذكر الإيمان بالقدر، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
