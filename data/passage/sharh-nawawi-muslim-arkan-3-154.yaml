text: "… عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ قَالَ : قَألَ رَسُولُ اللهِ لس المُؤْمِنُ الفَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللّهِ مِنَ الْمُؤْمِنِ الصَّعِيفِ، وَفِي كُلٌّ خَيْرٌ. احْرِصْ عَلَى مَا يَنْفَعُكَ، وَأسْتَعِنْ بِاللهِ، وَلَا تَعْجَزْ،.... باب الإيمان بالقدر والإذعان له قوله ف: المؤمن القوي …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 3، ص 154، يذكر الإيمان بالقدر، ووصف المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 3, p. 154, that mentions belief in the decree, a description of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 3، ص 154 کا اقتباس جس میں تقدیر پر ایمان، مومن کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de al-Nawawi sobre Sahih Muslim, volumen 3, pág. 154, que menciona la creencia en el decreto y describe al creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'al-Nawawi sur le Sahih Muslim (volume 3, page 154) évoquant la croyance au décret et une description du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 3. cildinin 154. sayfasından, kader inancını ve müminin özelliklerini ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Cuplikan dari komentar Al-Nawawi tentang Sahih Muslim, Volume 3, halaman 154, yang membahas keyakinan akan takdir dan menggambarkan orang beriman; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
