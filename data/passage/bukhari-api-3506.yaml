label: { ar: "صحيح البخاري 3506 — جمع القرآن والمصاحف، رسم المصحف", en: "Sahih al-Bukhari 3506 — the collection of the Qur'an and the codices; the orthography of the mushaf", ur: "صحیح بخاری 3506 — جمعِ قرآن اور مصاحف، رسمِ مصحف", es: "Sahih al-Bukhari 3506 — la colección del Corán y los códices; la ortografía del mushaf" }
text: "… اللَّهِ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنِ ابْنِ شِهَابٍ، عَنْ أَنَسٍ، أَنَّ عُثْمَانَ، دَعَا زَيْدَ بْنَ ثَابِتٍ وَعَبْدَ اللَّهِ بْنَ الزُّبَيْرِ وَسَعِيدَ بْنَ الْعَاصِ وَعَبْدَ الرَّحْمَنِ بْنَ الْحَارِثِ بْنِ هِشَامٍ فَنَسَخُوهَا فِي الْمَصَاحِفِ، وَقَالَ عُثْمَانُ لِلرَّهْطِ الْقُرَشِيِّينَ الثَّلاَثَةِ إِذَا اخْتَلَفْتُمْ أَنْتُمْ وَزَيْدُ بْنُ ثَابِتٍ فِي شَىْءٍ مِنَ الْقُرْآنِ، فَاكْتُبُوهُ بِلِسَانِ قُرَيْشٍ، فَإِنَّمَا نَزَلَ بِلِسَانِهِمْ. فَفَعَلُوا ذَلِكَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3506، يذكر جمع القرآن والمصاحف، ورسم المصحف. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 3506 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the collection of the Qur'an and the codices, the orthography of the mushaf. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 3506، جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3506 (Virtudes y méritos del Profeta y sus Compañeros), menciona la colección del Corán y los códices, así como la ortografía del mushaf. El explorador del museo sobre cómo se leía y escribía el Corán lo enumera junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
