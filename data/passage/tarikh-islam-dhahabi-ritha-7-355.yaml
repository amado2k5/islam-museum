text: "التابعين: عبد الرحمن بن هرمز. وقال قُتَيبة بن مهران : ثنا سليمان بن مسلم: سمعت أبا جعفر يحكي لنا قراءة أبي هريرة في : إِذَا الشَّمْسُ كُوِّرَتْ يحزنها شبه الرثاء. وروى عمر بن أبي زائدة، عن أبي خالد الوالبي، أنه …"
