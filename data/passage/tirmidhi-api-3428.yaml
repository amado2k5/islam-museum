label: { ar: "جامع الترمذي 3428 — عدد الحسنات، كتابة الحسنات", en: "Jami' al-Tirmidhi 3428 — a stated number of good deeds; the writing of good deeds", ur: "جامع ترمذی 3428 — نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا" }
text: "… الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ حَىٌّ لاَ يَمُوتُ بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ كَتَبَ اللَّهُ لَهُ أَلْفَ أَلْفِ حَسَنَةٍ وَمَحَا عَنْهُ أَلْفَ أَلْفِ سَيِّئَةٍ وَرَفَعَ لَهُ أَلْفَ أَلْفِ دَرَجَةٍ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ. وَقَدْ رَوَاهُ عَمْرُو بْنُ دِينَارٍ - وَهُوَ قَهْرَمَانُ آلِ الزُّبَيْرِ عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3428، يذكر عدد الحسنات، وكتابة الحسنات، ورفع الدرجات، وعدد السيئات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3428 (Chapters on Supplication), that speaks of a stated number of good deeds, the writing of good deeds, ranks raised, a stated number of bad deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3428، جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، درجات کی بلندی، برائیوں کی تعداد، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
