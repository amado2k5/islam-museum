text: "… أَنْ يَسْتَأْمِرَهَا فَكَرِهَتْ ذَلِكَ فَالنِّكَاحُ مَفْسُوخٌ عِنْدَ عَامَّةِ أَهْلِ الْعِلْمِ. وَاخْتَلَفَ أَهْلُ الْعِلْمِ فِي تَزْوِيجِ الأَبْكَارِ إِذَا زَوَّجَهُنَّ الآبَاءُ فَرَأَى أَكْثَرُ أَهْلِ الْعِلْمِ مِنْ أَهْلِ الْكُوفَةِ وَغَيْرِهِمْ أَنَّ الأَبَ إِذَا زَوَّجَ الْبِكْرَ وَهِيَ بَالِغَةٌ بِغَيْرِ أَمْرِهَا فَلَمْ تَرْضَ بِتَزْوِيجِ الأَبِ فَالنِّكَاحُ مَفْسُوخٌ. وَقَالَ بَعْضُ أَهْلِ الْمَدِينَةِ تَزْوِيجُ الأَبِ عَلَى الْبِكْرِ جَائِزٌ وَإِنْ كَرِهَتْ ذَلِكَ. وَهُوَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1107، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1107 (The Book on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1107، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1107 (El Libro del Matrimonio), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 1107 (Le Livre du Mariage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'nin 1107 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1107, menyebutkan tentang ayah dan peran ayah. Fitur \"Peran Ayah dalam Islam\" menggabungkan hadits ini dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
