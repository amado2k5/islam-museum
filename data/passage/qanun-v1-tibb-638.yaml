text: "… صدف نافع للجرب. والصدف بلحمه نافع للجراحات، وخصوصاً التي على العصب مسحوقه مع كُنْدُر ومُرّ، فيلزق، وكذلك مع غبار الرحى، وقد جرّب جالينوس الحلزون كله كما هو. آلات المفاصل : يسكّن الصدف أوجاع النقرس وأورامه، يضمّد به كما هو على …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 638، يذكر الوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، ومداواة الجراح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 638, that mentions pain, named diseases, the organs of the body, surgery, circumcision and splints, the treatment of wounds; from the machine-read scan, quoted within forty words per the sources policy."
