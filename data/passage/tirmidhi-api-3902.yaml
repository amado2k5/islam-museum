  en: "In Jami' al-Tirmidhi; sending a letter or message to a party."
  ur: "جامع ترمذی میں؛ کسی فریق کو خط یا پیغام بھیجنا."
  es: "En Jami' al-Tirmidhi; enviar una carta o mensaje a un partido."
  fr: "Dans Jami' al-Tirmidhi; envoyer une lettre ou un message à un parti."
  tr: "Cami' el-Tirmizi'de; bir gruba kitap veya mektup göndermek."
  id: "Dalam Jami’ al-Tirmidhi; mengirim buku atau surat kepada suatu pihak."
