text: "… عَنْ زَيْدِ بْنِ أَرْقَمَ، أَنَّهُ كَتَبَ إِلَى أَنَسِ بْنِ مَالِكٍ يُعَزِّيهِ فِيمَنْ أُصِيبَ مِنْ أَهْلِهِ وَبَنِي عَمِّهِ يَوْمَ الْحَرَّةِ فَكَتَبَ إِلَيْهِ إِنِّي أُبَشِّرُكَ بِبُشْرَى مِنَ اللَّهِ إِنِّي سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ اللَّهُمَّ اغْفِرْ لِلأَنْصَارِ وَلِذَرَارِيِّ الأَنْصَارِ وَلِذَرَارِيِّ ذَرَارِيِّهِمْ ‏\"‏ ‏.‏ هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ ‏.‏‏ وَقَدْ رَوَاهُ قَتَادَةُ عَنِ النَّضْرِ بْنِ أَنَسٍ، عَنْ زَيْد …"
summary:
  ar: "في جامع الترمذي؛ إرسال كتاب أو رسالة إلى طرف."
