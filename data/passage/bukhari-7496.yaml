label:
  ar: "البخاري 7496 — أنفق أنفق عليك"
  en: "Bukhari 7496 — Spend, and I shall spend on you"
  ur: "بخاری 7496 — خرچ کرو، میں تم پر خرچ کروں گا"
text: "نحن الآخرون السابقون يوم القيامة . وبهذا الإسناد قال الله أنفق أنفق عليك ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7496: أنفق أنفق عليك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7496: Spend, and I shall spend on you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7496: خرچ کرو، میں تم پر خرچ کروں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
