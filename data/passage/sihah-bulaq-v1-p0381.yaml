text: |-
  ٢٦٠
  ⁦(باب الدال)⁩
  نسبوا اليها قال لبيد
  سقى قومى بنى مجد وأسق • غيرا والقبائل من هلال
  ⁦( مدد)⁩ مددت الذى فامتد والمادة الريادة المتصلة ومداللّٰه فى عره ومده فى غيه أى أ.هله
  وطوّل له والمدالسيل يقال مد النهرومة، نهرآخر قال العجاج
  سيل أتى مده أتى
  ومد النهارار تفاعه ويقال هناك قطعة أرض قدر مد البصرأى مدى البصر ورجل مديد
  - القسامة أى طويل القامة وطراف مدد أى ممدود بالاطناب شدد للمبالغة وعدد الرجل أى
  عطى والمد بالضم مكيال وهور طل وثلث عند أهل الحجازور طلان عند أهل العراق والصاع.
  أربعة أمدادومدة من الزمان برهة منه والمدة أيضا اسم ما استمددت به ص المداد على القلم
  والمدة بالفتح المرة الواحدة من قولك مددت الشئ والمدة بالكسر ما يجستمع فى الجرح من
  القيح والمداد النقس تقول منه مددت الدواة وأمددتها أيضا وأمددت الرجل اذا أعطيه
  اذا جرى الماء فءوده ومددت الابل وأمددتها بمعى وهوأن تتنثرلها على الماءشيئا من
  الدقيق ونحوه فتسقيها والاسم المديدوما إمدان شديد الملوحة وهو إفعلان يكسر الهسمزة
  ( مرد المردعر الاراك الغض منه ورملة مرداء لانيت فيها وغصن أمرد لاورق عليه
  وفرس أمرد لا شعر ع-لى ثفته وغسلام أمرديين المرد بالنحريك ولا يقال جارية مرداء قال
  الاصحعى يقسال تمرد فلان زمانائم خرج وجهه وذلك أن يبقى أمرد حينا وتمسريد البناء تمليسه
  وتريد الغصسن تجريده من الورق ومرد الجبز يمرده مردا أى مائه حتى يلين والمريد التمرينقع
  فى اللبن -تى يلين ومرد الصبى أدى أمه مردا والمرود على الشئ المرون عليه والمارد العاتى
  وقد هرد الرج_ل بالضم حرادة فه ومادد وحر يد والمزيد الشديد المرادة مثال الجير والسكير
  ومراد أيوقبيلة من اليمن و* ومرادين مالك بن زيد بن كهلات بن سبأ و يقال كان اسمه يحابر
  فتمرد فسمى مراداوهو فعال على هذا القول والمراد بالفتح العنق ومارد حصن دومة الجندل
  يقال فى المثل ترد مارد وعز الابلق (مسد المسد بالتحريك الليف يقالمحبل من مد
  والمسدأيضاحبل من ليف أو خوص قال الراجز
  يامسد الحوص تعوّذمنى • ان كنت لدنالينا فانى * ماشئت من أشمط مقستن.
  وقد يكون من جلود الابل أومن أوبارها قال عمارة بن طارق.
  ومد أمر من أيائق • ليس بأنياب ولاحقائق
  ومسدت الجبل أمده مدا أجدت قتله قال رؤية يمسدأعلى له وبأرمه
  يقول ان البقل بقوى ظهرهذا الحمارويشته ورجل مسود أى مجدول الخلق وجارية
  حسنة المسدوالعصب والجدل والارم وهى ممسودة ومعصوبة ومجدولة ومارومة والمد
  إدآب السير بالليل والمساد على فعال لغة فى المسأب وهونحى السمن وسقاء العسل ⁦( صد )⁩
  المضاداً على الجبل قال الشاعر
  اذا أبرزاروع السكعاب فانهم • مصادان يأوى البهم ومعقل.
  وألجمع أمصدة ومصدان ومصد الريق مصه والمصد ضرب من الرضاع والمصد الجاع يقال
  مص٥ ١ا
