label: { ar: "سنن النسائي 5019 — حلاوة الإيمان وكماله", en: "Sunan al-Nasa'i 5019 — the sweetness and completeness of faith", ur: "سنن نسائی 5019 — ایمان کی مٹھاس اور اس کا کمال" }
text: "أَخْبَرَنَا إِسْمَعِيلُ بْنُ مَسْعُودٍ قَالَ حَدَّثَنَا خَالِدٌ يَعْنِي ابْنَ الْحَارِثِ عَنْ شُعْبَةَ عَنْ عَبْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ جَبْرٍ عَنْ أَنَسٍ عَنْ النَّبِيِّ قَالَ حُبُّ الْأَنْصَارِ آيَةُ الْإِيمَانِ وَبُغْضُ الْأَنْصَارِ آيَةُ النِّفَاقِ"
summary:
  ar: "حديث في سنن النسائي، رقم 5019، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5019 (The Book Of Faith and its Signs), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5019، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
