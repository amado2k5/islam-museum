summary:
  ar: "القسم 3 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب العلم»، ويضم فيها النصوص من 59 إلى 134 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 3 of Sahih al-Bukhari (Knowledge) in the division of the open hadith dataset the museum took its reports from: reports 59 to 134 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 3، عنوان «کتاب العلم»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 59 تا 134۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 3 de Sahih al-Bukhari (Conocimiento) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 59 al 134, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
