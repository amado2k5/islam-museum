text: "ا يزالوان يقاتلون غيرهم، حتى يردوهم عن دينهم، وخصوصا أهل الكتاب من اليهود والنصارى، الذين بذلوا الجمعيات، ونشروا الدعاة، وبثوا الأطباء، وبنوا المدارس لجذب الأمم إلى دينهم، وتدخيلهم عليهم كل ما يمكنهم من الشبه التي تشككهم في دينهم . ولكن"
