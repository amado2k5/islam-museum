text: "… الدِّمَشْقِيُّ، - الْمَعْنَى - قَالاَ حَدَّثَنَا الْوَلِيدُ، - قَالَ مَحْمُودٌ - أَخْبَرَنَا ثَوْرُ بْنُ يَزِيدَ، عَنْ رَجَاءِ بْنِ حَيْوَةَ، عَنْ كَاتِبِ الْمُغِيرَةِ بْنِ شُعْبَةَ، عَنِ الْمُغِيرَةِ بْنِ شُعْبَةَ، قَالَ وَضَّأْتُ النَّبِيَّ صلى الله عليه وسلم فِي غَزْوَةِ تَبُوكَ فَمَسَحَ أَعْلَى الْخُفَّيْنِ وَأَسْفَلَهُمَا ‏.‏ قَالَ أَبُو دَاوُدَ وَبَلَغَنِي أَنَّهُ لَمْ يَسْمَعْ ثَوْرٌ هَذَا الْحَدِيثَ مِنْ رَجَاءٍ ‏.‏"
summary:
  ar: "في سنن أبي داود؛ ذكر كتابة كتاب أو إرساله."
