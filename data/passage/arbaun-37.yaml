label: { ar: "الأربعون 37 — إن الله كتب الحسنات والسيئات", en: "Arba'un 37 — God wrote the good deeds and the evil deeds" }
summary:
  ar: "حديث ابن عباس عن رسول الله فيما يرويه عن ربه تبارك وتعالى قال: «إن الله كتب الحسنات والسيئات ثم بين ذلك، فمن هم بحسنة فلم يعملها كتبها الله عنده حسنة كاملة، وإن هم بها فعملها كتبها الله عنده عشر حسنات إلى سبعمئة ضعف إلى أضعاف كثيرة، وإن هم بسيئة فلم يعملها كتبها عنده حسنة كاملة، وإن هم بها فعملها كتبها الله سيئة واحدة» — وهو الحديث السابع والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ أخرجاه البخاري (6491) ومسلم (131) من رواية الجعد أبي عثمان عن أبي رجاء العطاردي عن ابن عباس، وفي رواية مسلم زيادة في الآخر «أو محاها الله، ولا يهلك على الله إلا هالك»؛ وفي المعنى أحاديث منها حديث أبي هريرة في الصحيحين «يقول الله: إذا أراد عبدي أن يعمل سيئة فلا تكتبوها عليه حتى يعملها فإن عملها فاكتبوها بمثلها وإن تركها من أجلي فاكتبوها له حسنة وإذا أراد أن يعمل حسنة فلم يعملها فاكتبوها له حسنة فإن عملها فاكتبوها له بعشر أمثالها إلى سبعمئة ضعف» ولفظ ابن حبان ولفظ قول الملائكة «رب ذاك عبدك يريد أن يعمل سيئة وهو أبصر به» (جامع العلوم والحكم ص 754–769)."
  en: "The hadith of Ibn Abbas, reporting from his Lord through the Messenger of God: 'God wrote the good deeds and the evil deeds, then made that plain: whoever resolves on a good deed and does not do it, God writes it down with Him as a complete good deed; if he resolves on it and does it, God writes it down as ten good deeds to seven hundred times over to many times more; and if he resolves on an evil deed and does not do it, He writes it down as a complete good deed; and if he resolves on it and does it, God writes it down as a single evil deed' — the thirty-seventh of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by al-Bukhari (6491) and Muslim (131) through al-Ja'd Abu Uthman from Abu Raja' al-Utaridi from Ibn Abbas, Muslim's route adding at the end 'or God erases it — and none perishes with God but the doomed'; in the same sense come further hadiths, among them Abu Hurayra's report in the two Sahihs: 'God says: when My servant intends an evil deed, do not write it against him until he does it — if he does it write it down as its like, and if he leaves it for My sake write it down for him as a good deed; and when he intends a good deed and does not do it write it down for him as a good deed, and if he does it write it down for him as ten times its like to seven hundred times', together with Ibn Hibban's wording and the wording of the angels' report, 'Lord, that servant of Yours wishes to do an evil deed — though He sees him best' (Jami' al-Ulum wal-Hikam pp. 754–769)."
