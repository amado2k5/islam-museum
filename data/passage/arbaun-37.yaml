id: passage/arbaun-37
class: passage
unit: hadith
work: work/arbaun-nawawi
ref: '37'
label:
  ar: الأربعون 37 — إن الله كتب الحسنات والسيئات
  en: Arba'un 37 — God wrote the good deeds and the evil deeds
  es: "Arba'un 37 — Dios escribió las buenas obras y las malas obras."
  fr: "Arba'un 37 — Dieu a écrit les bonnes et les mauvaises actions"
summary:
  ar: 'حديث ابن عباس عن رسول الله فيما يرويه عن ربه تبارك وتعالى قال: «إن الله كتب الحسنات والسيئات ثم بين ذلك، فمن هم بحسنة فلم يعملها كتبها الله عنده حسنة كاملة، وإن هم بها فعملها كتبها الله عنده عشر حسنات إلى سبعمئة ضعف إلى أضعاف كثيرة، وإن هم بسيئة فلم يعملها كتبها عنده حسنة كاملة، وإن هم بها فعملها كتبها الله سيئة واحدة» — وهو الحديث السابع والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ أخرجاه البخاري (6491) ومسلم (131) من رواية الجعد أبي عثمان عن أبي رجاء العطاردي عن ابن عباس، وفي رواية مسلم زيادة في الآخر «أو محاها الله، ولا يهلك على الله إلا هالك»؛ وفي المعنى أحاديث منها حديث أبي هريرة في الصحيحين «يقول الله: إذا أراد عبدي أن يعمل سيئة فلا تكتبوها عليه حتى يعملها فإن عملها فاكتبوها بمثلها وإن تركها من أجلي فاكتبوها له حسنة وإذا أراد أن يعمل حسنة فلم يعملها فاكتبوها له حسنة فإن عملها فاكتبوها له بعشر أمثالها إلى سبعمئة ضعف» ولفظ ابن حبان ولفظ قول الملائكة «رب ذاك عبدك يريد أن يعمل سيئة وهو أبصر به» ⁦(جامع العلوم والحكم ص 754–769)⁩.'
  en: 'The hadith of Ibn Abbas, reporting from his Lord through the Messenger of God: ''God wrote the good deeds and the evil deeds, then made that plain: whoever resolves on a good deed and does not do it, God writes it down with Him as a complete good deed; if he resolves on it and does it, God writes it down as ten good deeds to seven hundred times over to many times more; and if he resolves on an evil deed and does not do it, He writes it down as a complete good deed; and if he resolves on it and does it, God writes it down as a single evil deed'' — the thirty-seventh of al-Nawawi''s Forty and of Ibn Rajab''s commentary, transmitted by al-Bukhari (6491) and Muslim (131) through al-Ja''d Abu Uthman from Abu Raja'' al-Utaridi from Ibn Abbas, Muslim''s route adding at the end ''or God erases it — and none perishes with God but the doomed''; in the same sense come further hadiths, among them Abu Hurayra''s report in the two Sahihs: ''God says: when My servant intends an evil deed, do not
    write it against him until he does it — if he does it write it down as its like, and if he leaves it for My sake write it down for him as a good deed; and when he intends a good deed and does not do it write it down for him as a good deed, and if he does it write it down for him as ten times its like to seven hundred times'', together with Ibn Hibban''s wording and the wording of the angels'' report, ''Lord, that servant of Yours wishes to do an evil deed — though He sees him best'' (Jami'' al-Ulum wal-Hikam pp. 754–769).'
  es: "El hadiz de Ibn Abbas, que relata de su Señor a través del Mensajero de Dios: 'Dios escribió las buenas obras y las malas obras, y luego lo dejó claro: quien se propone hacer una buena obra y no la hace, Dios la anota con Él como una buena obra completa; si se propone hacerla y la hace, Dios la anota como diez buenas obras hasta setecientas veces más, y muchas veces más; y si se propone hacer una mala obra y no la hace, Él la anota como una buena obra completa; y si se decide a hacerlo y lo hace, Dios lo anota como una sola mala acción' — el trigésimo séptimo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, transmitido por al-Bujari (6491) y Muslim (131) a través de al-Ja'd Abu Uthman de Abu Raja' al-Utaridi de Ibn Abbas, la ruta de Muslim agregando al final 'o Dios lo borra, y nadie perece con Dios sino el condenado'; en el mismo sentido vienen otros hadices, entre ellos el relato de Abu Hurayra en los dos Sahihs: 'Dios dice: cuando Mi siervo pretende una mala acción, no la escribas contra él hasta que la haga; si la hace, escríbela como algo semejante, y si la deja por Mi causa, escríbela para él como una buena acción; y cuando tenga la intención de hacer una buena acción y no la haga, anótala para él como una buena acción, y si la hace, anótala para él como diez veces es como setecientas veces', junto con la redacción de Ibn Hibban y la redacción del informe de los ángeles, 'Señor, ese siervo Tuyo desea hacer una mala acción, aunque Él lo ve mejor' (Jami' al-Ulum wal-Hikam pp. 754–769)."
  fr: "Le hadith d'Ibn Abbas, rapporté de son Seigneur par l'intermédiaire du Messager de Dieu: « Dieu a inscrit les bonnes et les mauvaises actions, puis l'a clairement indiqué: quiconque prend la résolution d'une bonne action et ne l'accomplit pas, Dieu l'inscrit auprès de Lui comme une bonne action complète; s'il prend cette résolution et l'accomplit, Dieu l'inscrit comme dix bonnes actions, sept cents fois plus, et bien plus encore; et s'il prend la résolution d'une mauvaise action et ne l'accomplit pas, Il l'inscrit comme une bonne action complète; et s'il prend cette décision et la met à exécution, Dieu l'inscrit comme une seule mauvaise action » — le trente-septième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, transmis par al-Bukhari (6491) et Muslim (131) par l'intermédiaire d'al-Ja'd Abu Uthman d'Abu Raja' al-Utaridi d'Ibn Abbas, la voie de Muslim ajoutant à la fin « ou Dieu l'efface — et nul ne périt auprès de Dieu sauf les damnés »; dans le même sens viennent d'autres hadiths, parmi lesquels le rapport d'Abu Hurayra dans les deux Sahihs: « Dieu dit: lorsque Mon serviteur a l'intention d'une mauvaise action, ne l'inscrivez pas contre lui avant qu'il ne l'ait faite — s'il la fait, inscrivez-la comme telle, et s'il s'en abstient pour Ma cause, inscrivez-la pour lui comme une bonne action; et lorsqu'il a l'intention de faire une bonne action et ne la fait pas, inscrivez-la pour lui comme une bonne action, et s'il la fait, inscrivez-la pour lui comme dix fois, c'est comme sept cents fois », ainsi que la formulation d'Ibn Hibban et la formulation du rapport des anges: « Seigneur, ce serviteur de Toi souhaite faire une mauvaise action — bien qu'Il le voie mieux » (Jami' al-Ulum wal-Hikam pp. 754–769)."
