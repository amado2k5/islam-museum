label: { ar: "مسلم 482 — أقرب ما يكون العبد من ربه وهو ساجد", en: "Muslim 482 — The closest a servant is to his Lord is while prostrating", es: "Muslim 482 — El momento más cercano en que un siervo está a su Señor es cuando se postra.", fr: "Muslim 482 — Le moment où un serviteur est le plus proche de son Seigneur est lorsqu'il se prosterne.", ur: "مسلم 482 - بندہ اپنے رب کے سب سے زیادہ قریب سجدہ کی حالت میں ہوتا ہے۔", tr: "Müslim 482 — Bir kulun Rabbine en yakın olduğu an, secde ettiği zamandır.", id: "Muslim 482 — Kedekatan seorang hamba dengan Tuhannya adalah ketika ia bersujud" }
text: "قال رسول الله: «أقرب ما يكون العبد من ربه وهو ساجد؛ فأكثروا الدعاء»"
summary:
  ar: "رواية أبي هريرة في باب الدعاء في السجود من كتاب الصلاة في صحيح مسلم؛ يربط السجود بأقصى قرب العبد من ربه ويستحب إكثار الدعاء فيه."
  tr: "Sahih Müslim'deki Namaz Kitabı'nda secde sırasında dua bölümünde Ebu Hurayra'nın rivayetine göre secde, bir kulun Rabbine en yakın olabileceği an olarak görülmekte ve secde sırasında duanın artırılması tavsiye edilmektedir."
  id: "Riwayat Abu Hurairah dalam bab tentang doa saat sujud dalam Kitab Shalat di Sahih Muslim mengaitkan sujud dengan kedekatan seorang hamba dengan Tuhannya, dan dianjurkan untuk memperbanyak doa saat sujud."
