text: "… أيامِ التَّشريق. - يعمُر السَّعدي، والد أبي خِزَامة : حديثه عند ابن شهاب، سمع أَبا خزامة بن يعمر، عن أبيه أنّه قال : يا رسول اللّٰه، أرأيت أدوية نتداوى بها، وُرقى نسترقي بها، هل تردُّ من قَدَر اللّه؟ فقال النَّبِيُّ …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 770، يذكر الرقية، والدواء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 770, that mentions ruqya recited over the sick, the drug, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 770 کا اقتباس جس میں رقیہ، دوا، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 3, pág. 770, que menciona la ruqya recitada sobre los enfermos, el medicamento y la búsqueda de tratamiento; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 3, p. 770, qui mentionne la ruqya récitée sur les malades, le médicament, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın El-İsti'ab adlı eserinin resimli 3. cildinin 770. sayfasından, büyü, ilaç ve tedaviden bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Isti`ab karya Ibn Abd Al-Barr, jilid bergambar 3, hlm. 770, yang menyebutkan mantra, obat-obatan, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
