label: { ar: "سنن النسائي 2404 — وصية أو عهد أخير", en: "Sunan al-Nasa'i 2404 — a testament or parting counsel", ur: "سنن نسائی 2404 — وصیت یا آخری نصیحت", es: "Sunan al-Nasa'i 2404 — un testamento o consejo de despedida", fr: "Sunan al-Nasa'i 2404 — un testament ou un conseil d'adieu" }
text: "أَخْبَرَنَا عَلِيُّ بْنُ حُجْرٍ، قَالَ حَدَّثَنَا إِسْمَاعِيلُ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ أَبِي حَرْمَلَةَ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي ذَرٍّ، قَالَ أَوْصَانِي حَبِيبِي بِثَلاَثَةٍ لاَ أَدَعُهُنَّ إِنْ شَاءَ اللَّهُ تَعَالَى أَبَدًا أَوْصَانِي بِصَلاَةِ الضُّحَى وَبِالْوِتْرِ قَبْلَ النَّوْمِ وَبِصِيَامِ ثَلاَثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 2404، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2404 (The Book of Fasting), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 2404، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2404 (El Libro del Ayuno), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sunan an-Nasa'i, n° 2404 (Le Livre du jeûne), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
