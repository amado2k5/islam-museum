text: "… احمد بن زهير قال حدثنا عمر و بن حماد القناد قال حد ما اسحاق بى ابراهيم الازدى عن معروف إن خربوذ عن زياد بن المنذ رعن سعيد بن محمد الأزدى عن ابى الطفيل قال لما احتضر همرجعلها شورى بين علي …"
