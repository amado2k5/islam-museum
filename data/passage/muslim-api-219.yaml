text: "… خَالِدٌ، عَنْ أَبِي عُثْمَانَ، قَالَ لَمَّا ادُّعِيَ زِيَادٌ لَقِيتُ أَبَا بَكْرَةَ فَقُلْتُ لَهُ مَا هَذَا الَّذِي صَنَعْتُمْ إِنِّي سَمِعْتُ سَعْدَ بْنَ أَبِي وَقَّاصٍ يَقُولُ سَمِعَ أُذُنَاىَ مِنْ رَسُولِ اللَّهِ وَهُوَ يَقُولُ \" مَنِ ادَّعَى أَبًا فِي الإِسْلاَمِ غَيْرَ أَبِيهِ يَعْلَمُ أَنَّهُ غَيْرُ أَبِيهِ فَالْجَنَّةُ عَلَيْهِ حَرَامٌ \". فَقَالَ أَبُو بَكْرَةَ وَأَنَا سَمِعْتُهُ مِنْ رَسُولِ اللَّهِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 219، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 219 (The Book of Faith), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 219، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
