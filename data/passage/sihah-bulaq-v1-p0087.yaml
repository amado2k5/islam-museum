text: |-
  قوله شجر الجبال الموادبها جبال
  السرافانها هى التى تتبتهاه
  ١ ذافى النسخ والذى قامو
  معتجرالخاق الخ وضبط لام
  خلق بفتحة وهو فى رصف حادى
  /ه
  ٢ ب نة الطاحمضاف الى ياء
  إلتسكام
  ٥٥٤٠
  فسطها ذميم الرأى غير موفق • فلست على تسويطها ؟عان
  قال أبوزيديقال أمو الهم سو يطة بينهم أى مختاطة حكاه عنه يعقوب
  نهط يشحط شخطا وشصوطا يقال شحط المزارأى بعد وأشحطته أبعدته وتشعط المقتول
  يدمه أى اضطرب فيه وشعطه به غيره تشميطا والشوحط ضرب من شجر الجبال تتخذمنه
  القسىّ والشمحوط الطويل والميم زائدة ⁦(شرط)⁩ الشرط معروف وكذلك الشريطة والهع
  شروط وشرائط وقد شرط عليه كذايشرط ويشرط واشترط عليه والشرط بالتحريك العلامة
  واشراط الساعة علاماتها والشرط أيضارذال المال قال الشاعر
  تساق من المعزى مهورنسا تهم* ومن شرط المعزى اهن مهور
  وقال السكميت
  وجدت الناس غيرابى نزار ولم أذعمهم شرطا ودونا
  والاشراط الاردال يقال الغنم اشراط المال والاشراط أيضا الاشراف قال بعة وب وهذا
  الحرف.ن الاضداد وأشرط من ابله وغنه اذا أعدمنهاشيئا للبيع وأشرط فلان نفسه لامر
  كذا أى أعلمهاله وأعدها قال الاصمعى ومنه سمى الشرط لانهم جعلوالانفسهم علامة
  يعرفون بها الواحد شرطة وشرطى وقال أبو عبيدة سمواشر طالانهم أعدوا والشريط حبل
  فقل من الخوص والمشرط المبضع والمشراط مثله وقد شرط الحاجم يشرط ويشرط اذابزغ
  والشرطان نجمان من الحل وهما قرناه والى جانب الشهالى منهما كوكب صغيرومن العرب
  من يعدهمعهمافيقول هوثلاثة كواكب ويسميها الاشراط قال الكميت
  هاجت عليه من الاشراط نافجة • فى قلتة بين إظلام وإسفار
  وقال ذوالرمة قرحاحوًا أشراطية وكفت * فيها الذهاب وحفتها البراعيم
  يعى روضة مطرتبنوه الشرطيز وانما عال قرساءلان فى وسطها نوارة بيضاء وقال-والخضرة
  نباتها فأماقول حسان بن ثابت
  فى ندامى يض الوجوه كرام • نيهوابعد هجعة الاشراط
  فيقال أرادبه الجرس وسفلة الناس وأنشداين الاعرابي
  أشاريط من اشراط اشراط طئ • وكان أبوهم أشرط اوابن أشرطا
  ورجل شرواط أى طويل وحل شرواط الذكروالاتى فيه_واء قال الراجز ⁦(جساس)⁩
  يلحن من ذى زجل شرواط * محتجز بخاق شعطاط
  ⁦(شطط )⁩ شطت الدارتشط ونشط شطاوشط وطابعدت وأشط فى القضية أى يادوأشط
  فى السوم واشتط أبعد وأشطوافى طلبى اى أمعنوا وحكى أبو ءبيد شططت عليه
  وأشططت أى جرت وفى حسديث قيم الدارى انك لشاطى ٢ ى جار علىّ فى الحكم
  والشط جانب النهر والوادى والسنام وكل جانب من السنام شط قال أبو النجم
  كأن تحت درعها المنعط * شطارميت فوقه بشط
  والجسع شطوط والشطوط بالفتح الناقة الضضمة السنام والشطاط البعد واعتدال القامة
  ايضا
