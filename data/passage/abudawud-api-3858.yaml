label: { ar: "سنن أبي داود 3858 — الحجامة، الوجع", en: "Sunan Abi Dawud 3858 — cupping; pain", ur: "سنن ابی داؤد 3858 — حجامہ، درد" }
text: "… عَبْدُ الرَّحْمَنِ بْنُ أَبِي الْمَوَالِي، حَدَّثَنَا فَائِدٌ، مَوْلَى عُبَيْدِ اللَّهِ بْنِ عَلِيِّ بْنِ أَبِي رَافِعٍ عَنْ مَوْلاَهُ، عُبَيْدِ اللَّهِ بْنِ عَلِيِّ بْنِ أَبِي رَافِعٍ عَنْ جَدَّتِهِ، سَلْمَى خَادِمِ رَسُولِ اللَّهِ قَالَتْ مَا كَانَ أَحَدٌ يَشْتَكِي إِلَى رَسُولِ اللَّهِ وَجَعًا فِي رَأْسِهِ إِلاَّ قَالَ \" احْتَجِمْ \". وَلاَ وَجَعًا فِي رِجْلَيْهِ إِلاَّ قَالَ \" اخْضِبْهُمَا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3858، يذكر الحجامة، والوجع، والشكوى من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3858 (Medicine (Kitab Al-Tibb)), that mentions cupping, pain, a complaint of an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3858، جس میں حجامہ، درد، بیماری کی شکایت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
