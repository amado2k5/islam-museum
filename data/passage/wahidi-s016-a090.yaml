text: "أخبرنا أبو إسحاق أحمد بن محمد بن إبراهيم قال: أخبرنا شعيب بن محمد البيهقي قال: أخبرنا مكي بن عبدان قال: حدثنا أبو الأزهر قال: حدثنا روح بن عبادة عن عبد الحميد بن بهرام قال: حدثنا شهر بن حوشب قال: حدثنا عبد الله بن عباس قال:"
