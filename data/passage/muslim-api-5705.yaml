text: "… الْحَارِثِ، حَدَّثَنَا شُعْبَةُ، عَنْ هِشَامِ، بْنِ زَيْدٍ عَنْ أَنَسٍ، أَنَّ امْرَأَةً، يَهُودِيَّةً أَتَتْ رَسُولَ اللَّهِ بِشَاةٍ مَسْمُومَةٍ فَأَكَلَ مِنْهَا فَجِيءَ بِهَا إِلَى رَسُولِ اللَّهِ فَسَأَلَهَا عَنْ ذَلِكَ فَقَالَتْ أَرَدْتُ لأَقْتُلَكَ. قَالَ \" مَا كَانَ اللَّهُ لِيُسَلِّطَكِ عَلَى ذَاكِ \". قَالَ أَوْ قَالَ \" عَلَىَّ \". قَالَ قَالُوا أَلاَ نَقْتُلُهَا قَالَ \" لاَ \". قَالَ فَمَا …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5705، يذكر السم والترياق. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5705 (The Book of Greetings), that mentions poison and antidote. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5705، جس میں زہر اور تریاق کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
