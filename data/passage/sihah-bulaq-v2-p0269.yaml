text: |-
  كانها يضة غرًا خذلها
  ٢ ف نسحة بقية البيت
  جلد من الفتيان غير مهيل
  ٣١٨
  مولى سلامان من قضاعة
  ثقال الجفان والحلوم رساهم • رحى الماء يكتالون كيلاغذمدما
  يعنى جزافا وتكريره يدل على التكثير والغدم الاكل بجفاء وشدّة وقد غذمه بالمكسروهو
  يتقذم كل :ى اذا كان كثير الاكل واغتذم الفصيل ما فى ضرع أمه أى شرب جميع ما فيه
  والغذامة بالضم شئ من اللبن والغذم بالتحريك نبت قال القطامى
  فى ءشعث يتبت الحوذان والغذما• والغذيمة الارض تنبت الغذم يقال سلواف غذيمة
  منكرة ذرم غذرمت الشئ وغذمرته اذابعته جزافا وكيل غذارم أى جزاف
  قال أبو جندب الهذلى
  فاهف ابنة الجنون أن لاتصعه • فتوفه بالصاع كلاغذارما
  قال أيو عبيد الغذارم الكثير من المامثل الغذاعرغرم) ابن الاعرابي الغرام الشر
  الدائم والعذاب قال بشر
  ويوم التسارويوم الجفار كانا عذابا وكانا غراما
  وقال الاعشى
  ان يعاقب يكن غراماوان يعشط جز بلافانه لا يبالى
  وقوله تعالى انّ عذاجها كان غراما قال أبو عبيدة أى هلا كاولزا مالهم قال ومنه رجل مغرم
  بالحبة حبّ النساء ومنه قولهم رجل مغرم من الغرم والدين والفرام الولوع وقد أغرم
  بالشىّ أى أواع به والغريم الذى عليه الدين يقال خذ من غريم السومماسخ وقديكون
  الغريم أيضا الذى له الدين قال كثير
  قضى كل ذى دين فوفى غريمه • وعزة معطول معسق غربمها
  واغرمته أنا وغرمته بعنى والغرامة ما يلزم أداؤه وكذلك المغرم والفرم وقدغرم الرجل
  الديه غسم القسم مثسل الغسق وهو الظلمة وغسم الليل اذا أظلم عن الاصجبى وقال
  النضر الغسم اختلاط الظلة وأنشدلساعدة بن جوية
  فظل يرقبه حق اذادصت • ذات العشاء بأسداف من الغسم
  ⁦( غسم)⁩ الغشم الظلم والحرب غشوم لانها تنال غير الجانى والمغشم والغشمشم الذى يركب
  رأسه لايثنيه شئ عمايريدويه وى من شصياعته قال أبو كبير ٢
  ولقد سريت على الظلام بغشم طم لغطمّ البحر العظيم الكثير الماء بقال بحر غطمّ
  مثال هجف وجمع غطم ورجل غظمّ واسع انظق ⁦(غلم)⁩ الغلام معروف وتصغيره غليم
  والجمع غلمة وغلمان واستغنوابغلمة عن أغلمة وتصغير الفلمة أغيلة على غير كبره كأتهم صغروا
  أغلة وان كانوالم يقولوه كما قالوا أصيبية فى تصغير صسية وبعضهم يقول غلمة على القياس
  بقال غلام بين الغلومة والغلومية والاننى غلامة وقال بصف فرسا*تهان اه! الفلامة والغلام
  والغلمة بالضم شهوة الضراب وقد غلم البعير بالكسر غلمة واغتلم اذا هاج من ذلك
  والفيلم الجارية المغتلمة والغيلم الذكر من السلاف والفيلم فى شعرعنترة • وأهلها بالغيل
  موضع والغليم بالتشديد الشهيد الغلة ⁦(غلصم)⁩ الغلصمة رأس الحلقوم وهو الموضع
  النساتى فى الحلق وغاصمه أى قطع غلصمته(غمم الغم واحد الغموم تقول منه غمه قاغتم
  وعين
