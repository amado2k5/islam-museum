text: "… العوالي والنّوازل، وكان ليس له شُغْل إلاّ العِلم والإفادة. قرأ عليه خلْقٌ كثير إلى الغاية، ولا أعلم أحداً من القرّاء في الدّنيا أكثر أصحاباً منه. ومن مصنَّفاته: شرح الشّاطبيّة في مجلَّدين، و شرح الرّائيّة في مجلّد في رسم المُصْحَف، وكتاب …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 50، ص 194، يذكر القراء، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 50, p. 194, that mentions the readers, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 50، ص 194 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 50, pág. 194, que menciona a los lectores, la colección del Corán y los códices, y la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 50, page 194, mentionnant les lecteurs, la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 50. cildinin 194. sayfasından alınan bir alıntı, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını ve Kur'an'ın yazımını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an okunuşları, yazım, el yazması ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 50, halaman 194, menyebutkan para qari, penyusunan Al-Quran dan manuskripnya, serta ortografi Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, ortografi, aksara, dan tanda diakritik."
