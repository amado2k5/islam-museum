label: { ar: "سنن أبي داود 3129 — وزر من تبع", en: "Sunan Abi Dawud 3129 — bearing the burden of those who follow", ur: "سنن ابی داؤد 3129 — پیروی کرنے والوں کا بوجھ", es: "Sunan Abi Dawud 3129 — llevando la carga de los que siguen", fr: "Sunan Abi Dawud 3129 — porter le fardeau de ceux qui suivent", tr: "Sunan Abi Davud 3129 — Takip edenlerin yükü", id: "Sunan Abi Dawud 3129 — Beban bagi orang-orang yang mengikuti" }
text: "… ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ الْمَيِّتَ لَيُعَذَّبُ بِبُكَاءِ أَهْلِهِ عَلَيْهِ \". فَذُكِرَ ذَلِكَ لِعَائِشَةَ فَقَالَتْ وَهِلَ - تَعْنِي ابْنَ عُمَرَ - إِنَّمَا مَرَّ النَّبِيُّ عَلَى قَبْرٍ فَقَالَ \" إِنَّ صَاحِبَ هَذَا لَيُعَذَّبُ وَأَهْلُهُ يَبْكُونَ عَلَيْهِ \". ثُمَّ قَرَأَتْ { وَلاَ تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى } قَالَ عَنْ أَبِي مُعَاوِيَةَ عَلَى قَبْرِ يَهُودِيٍّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3129، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 3129 (Funerals (Kitab Al-Jana'iz)), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 3129، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3129 (Funerales (Kitab Al-Jana'iz)), que habla de asumir la carga de quienes le siguen. El Libro de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 3129 (Les Funérailles), évoque le fardeau de ceux qui succèdent. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou évaluent un acte."
  tr: "Sunan Ebu Davud'da yer alan 3129 numaralı hadis, itaat edenin yükünden bahseder. Bu yük, iyi ve kötü amellerin yanı sıra, amelleri sayan, kaydeden, silen veya tartan metinlerden oluşan bir liste halinde derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3129, menyebutkan beban orang yang mengikuti. Beban tersebut disusun dalam daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
