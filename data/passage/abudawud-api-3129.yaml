label: { ar: "سنن أبي داود 3129 — وزر من تبع", en: "Sunan Abi Dawud 3129 — bearing the burden of those who follow", ur: "سنن ابی داؤد 3129 — پیروی کرنے والوں کا بوجھ" }
text: "… ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ الْمَيِّتَ لَيُعَذَّبُ بِبُكَاءِ أَهْلِهِ عَلَيْهِ \". فَذُكِرَ ذَلِكَ لِعَائِشَةَ فَقَالَتْ وَهِلَ - تَعْنِي ابْنَ عُمَرَ - إِنَّمَا مَرَّ النَّبِيُّ عَلَى قَبْرٍ فَقَالَ \" إِنَّ صَاحِبَ هَذَا لَيُعَذَّبُ وَأَهْلُهُ يَبْكُونَ عَلَيْهِ \". ثُمَّ قَرَأَتْ { وَلاَ تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى } قَالَ عَنْ أَبِي مُعَاوِيَةَ عَلَى قَبْرِ يَهُودِيٍّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3129، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 3129 (Funerals (Kitab Al-Jana'iz)), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 3129، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
