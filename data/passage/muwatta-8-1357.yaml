  id: "Malik diberitahu bahwa Sa'id ibn al-Musayyab dan Abu Salama ibn Abd al-Rahman mempunyai pandangan yang sama dengan Abdullah ibn Umar. {mengutip:muwatta-maruf-1997 hal.607}"
