label: { ar: "الموطأ 870 — ابن شهاب سُئل عن المعتكف يدخل لحاجته تحت سقف: نعم، لا بأس بذلك", en: "Muwatta 870", es: "Muwatta 870", fr: "Muwatta 870", ur: "موطا 870", tr: "El-Muvatta 870 — İbn Şihab'a itikaf halindeki bir kişinin ihtiyaçlarını gidermek için çatıya çıkması soruldu: Evet, bunda bir sakınca yoktur.", id: "Al-Muwatta 870 — Ibn Shihab ditanya tentang seseorang yang sedang i'tikaf memasuki atap untuk memenuhi kebutuhannya: Ya, tidak ada yang salah dengan itu." }
text: "نعم، لا بأس بذلك"
summary:
  ar: "يرويه مالك أنه سأل ابن شهاب عن الرجل يعتكف هل يدخل لحاجته تحت سقف؟ فقال: نعم، لا بأس بذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني (379). {cite:muwatta-maruf-1997 p.420}"
  tr: "Malik, İbn Şihab'a itikafta bulunan bir adam hakkında şöyle sorduğunu rivayet etmiştir: \"İhtiyaç gidermek için çatıya çıkması caiz midir?\" İbn Şihab şöyle cevap vermiştir: \"Evet, bunda bir sakınca yoktur.\" Araştırmacı, bunu Malik'ten Ebu Mus'ab, Suveyd ve Şeybani'nin (379) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.420}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Ibnu Shihab tentang seorang laki-laki yang sedang i'tikaf: Apakah diperbolehkan baginya untuk masuk ke atap untuk buang air? Beliau menjawab: Ya, tidak ada bahayanya. Peneliti menyebutkan bahwa Abu Mus'ab, Suwaid, dan al-Shaybani (379) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.420}"
