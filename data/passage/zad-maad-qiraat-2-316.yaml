text: "… أجل مسمَّى إن قيَّده ولو كان كنايةً، لرجع فيه إلى نيته، ولا يَرِدُ على هذا اللعان، فإنه يُوجب الفسخَ دونَ الطلاق، والفسخُ يقع بغير قول، والطلاقُ لا يقع إلا بالقول. قالوا: وأما قراءةُ ابنِ مسعود، فغايتُها أن تدُلَّ على جواز …"
