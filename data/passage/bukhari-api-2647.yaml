label: { ar: "صحيح البخاري 2647 — الأب والأبوة", en: "Sahih al-Bukhari 2647 — the father and fatherhood", ur: "صحیح بخاری 2647 — باپ اور والدیت", es: "Sahih al-Bukhari 2647 — El padre y la paternidad", fr: "Sahih al-Bukhari 2647 — Le père et la paternité" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، أَخْبَرَنَا سُفْيَانُ، عَنْ أَشْعَثَ بْنِ أَبِي الشَّعْثَاءِ، عَنْ أَبِيهِ، عَنْ مَسْرُوقٍ، أَنَّ عَائِشَةَا ـ قَالَتْ دَخَلَ عَلَىَّ النَّبِيُّ وَعِنْدِي رَجُلٌ، قَالَ \" يَا عَائِشَةُ مَنْ هَذَا \". قُلْتُ أَخِي مِنَ الرَّضَاعَةِ. قَالَ \" يَا عَائِشَةُ، انْظُرْنَ مَنْ إِخْوَانُكُنَّ، فَإِنَّمَا الرَّضَاعَةُ مِنَ الْمَجَاعَةِ \". تَابَعَهُ ابْنُ مَهْدِيٍّ عَنْ سُفْيَانَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2647، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2647 (Witnesses), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2647، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2647 (Testigos), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2647 (Témoins), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
