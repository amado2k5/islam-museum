text: "… إلى فرض، ونفل، وسلامة، كما قاله إراهيم بن أدهم، فالفرض هو الزهد فى الحرام. والنفل هو الزهد فى الحلال. والسلامة هو الزهد فى الشبهات. وقد ذكرنا تفاصيل درجات الورع فى كتاب الحلال والحرام، وذلك من الزهد، إذقيل لمالك بن أنس. …"
