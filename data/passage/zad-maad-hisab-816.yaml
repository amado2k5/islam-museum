text: "… المُصِرُّ، وأما مَنْ عزم على المعصية ولم يَعْمَلْها، فهو بين أمرينِ، إما أن لا تُكتب عليه، وإما أن تُكتب له حسنة إذا تركها للَّه عزَّ وجلَّ. وأما الثوابُ والعقابُ على أعمال القلوب فحقٌّ، والقرآنُ والسنة مملوآن به، ولكن وقوعُ الطلاق …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، ص 816، يذكر كتابة الحسنات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, p. 816, that speaks of the writing of good deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "زاد المعاد، ابن القیم کے صفحہ 816 کا اقتباس جس میں نیکیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
