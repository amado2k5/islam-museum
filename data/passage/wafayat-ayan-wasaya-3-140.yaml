text: "… تاريخه والحتزابة فى اللعة ارأة القصيرة الغليظة وذكره الحافظ ابن عساكر فى م وقال كان كثير الأحساب الى أهل الحرميز واشترى بالمدينة دارا بالقرب من المسجدليس بينها وبين الضريح النبوى على ساكنه أفضل الصلاة والسلام سوى جداد واحد وأوصى أن …"
summary:
  ar: "مقطع من وفيات الأعيان لابن خلكان، المجلد المصوَّر 3، ص 140، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Khallikan's Wafayat al-A'yan, scan volume 3, p. 140, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "وفیات الاعیان، ابن خلکان، اسکین جلد 3، ص 140 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Wafayat al-A'yan de Ibn Khallikan, volumen 3, pág. 140, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de Wafayat al-A'yan d'Ibn Khallikan (tome 3, p. 140) mentionnant un testament ou des adieux, une sépulture, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire Testaments Browser."
  tr: "İbn Hallikan'ın *Vafayat el-A'yan* adlı eserinin resimli 3. cildinin 140. sayfasında vasiyetname, defin, mezar ve türbeden bahsedilmektedir; bu metin, makineyle okunabilir resimli baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari *Wafayat al-A'yan* karya Ibn Khallikan, jilid 3 bergambar, halaman 140, menyebutkan wasiat atau surat wasiat terakhir, pemakaman, kuburan, dan makam; dari edisi bergambar yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
