label: { ar: "صحيح مسلم 4640 — الأب والأبوة", en: "Sahih Muslim 4640 — the father and fatherhood", ur: "صحیح مسلم 4640 — باپ اور والدیت", es: "Sahih Muslim 4640 — El padre y la paternidad" }
text: "… بْنُ حَرْبٍ، وَإِسْحَاقُ بْنُ إِبْرَاهِيمَ، جَمِيعًا عَنْ جَرِيرٍ، قَالَ زُهَيْرٌ حَدَّثَنَا جَرِيرٌ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ أَبِيهِ، قَالَ كُنَّا عِنْدَ حُذَيْفَةَ فَقَالَ رَجُلٌ لَوْ أَدْرَكْتُ رَسُولَ اللَّهِ قَاتَلْتُ مَعَهُ وَأَبْلَيْتُ فَقَالَ حُذَيْفَةُ أَنْتَ كُنْتَ تَفْعَلُ ذَلِكَ لَقَدْ رَأَيْتُنَا مَعَ رَسُولِ اللَّهِ لَيْلَةَ الأَحْزَابِ وَأَخَذَتْنَا رِيحٌ شَدِيدَةٌ وَقُرٌّ فَقَالَ رَسُولُ اللَّهِ \" أَلاَ رَجُلٌ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 4640، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4640 (The Book of Jihad and Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4640، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4640 (El Libro de la Yihad y las Expediciones), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
