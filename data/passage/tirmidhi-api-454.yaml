label: { ar: "جامع الترمذي 454 — ما ليس بواجب، الصلاة المكتوبة", en: "Jami' al-Tirmidhi 454 — what is said not to be obligatory; the prescribed prayer", ur: "جامع ترمذی 454 — جو واجب نہیں، فرض نماز", fr: "Jami' al-Tirmidhi 454 — ce qui est dit non obligatoire ; la prière prescrite", es: "Yami' al-Tirmidhi 454 — lo que se dice que no es obligatorio; la oración prescrita" }
text: "… سُفْيَانُ الثَّوْرِيُّ، وَغَيْرُهُ، عَنْ أَبِي إِسْحَاقَ، عَنْ عَاصِمِ بْنِ ضَمْرَةَ، عَنْ عَلِيٍّ، قَالَ الْوِتْرُ لَيْسَ بِحَتْمٍ كَهَيْئَةِ الصَّلاَةِ الْمَكْتُوبَةِ وَلَكِنْ سُنَّةٌ سَنَّهَا رَسُولُ اللَّهِ. حَدَّثَنَا بِذَلِكَ مُحَمَّدُ بْنُ بَشَّارٍ حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ عَنْ سُفْيَانَ عَنْ أَبِي إِسْحَاقَ. وَهَذَا أَصَحُّ مِنْ حَدِيثِ أَبِي بَكْرِ بْنِ عَيَّاشٍ. وَقَدْ رَوَاهُ مَنْصُورُ بْنُ الْمُعْتَمِرِ عَنْ أَبِي إِسْحَاقَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 454، يرد فيه ذكر ما ليس بواجب، والصلاة المكتوبة، والحتم. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 454 (The Book on Al-Witr), whose wording mentions what is said not to be obligatory, the prescribed prayer, the binding (hatm). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 454، جس کے الفاظ میں جو واجب نہیں، فرض نماز، حتمی حکم کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 454, dont le texte mentionne ce qui est dit non obligatoire, la prière prescrite, le contraignant (hatm). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 454, cuyo texto menciona lo que se dice que no es obligatorio, la oración prescrita, lo vinculante (hatm). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
