label: { ar: "الموطأ 2434 — ابن شهاب: مروان بن الحكم يسأل زيد بن ثابت عن المختلس", en: "Muwatta 2434", es: "Muwatta 2434", fr: "Muwatta 2434", ur: "موطا 2434", tr: "Al-Muwatta 2434 - İbn Şihab: Mervan ibn el-Hakam, Zeyd ibn Sabit'e zimmete para geçiren kişiyi soruyor", id: "Al-Muwatta 2434 — Ibnu Shihab: Marwan ibn al-Hakam bertanya kepada Zayd ibn Thabit tentang penggelapan uang" }
summary:
  ar: "يروي مالك عن ابن شهاب أن مروان بن الحكم أُتي بإنسان قد اختلس متاعا، فأراد قطع يده، فأرسل إلى زيد بن ثابت يسأله، فقال زيد: ليس في الخلسة قطع. {cite:muwatta-maruf-1997 p.405}"
  tr: "Malik, İbn Şihab'dan rivayetle, Mervan ibn el-Hakam'a mal çalmış bir adam getirildiğini ve onun elinin kesilmesini istediğini anlatır. Bunun üzerine Mervan, Zeyd ibn Sabit'e haber göndererek durumu sordu. Zeyd, \"Hırsızlık için el kesmek yoktur\" dedi. {cite:muwatta-maruf-1997 s.405}"
  id: "Malik meriwayatkan dari Ibn Shihab bahwa Marwan ibn al-Hakam didatangi seorang pria yang telah mencuri barang, dan ia ingin memotong tangannya. Maka ia mengirim utusan kepada Zayd ibn Thabit untuk bertanya kepadanya, dan Zayd berkata: Tidak ada pemotongan tangan untuk kasus pencurian. {cite:muwatta-maruf-1997 p.405}"
