label: { ar: "الموطأ 1688 — نافع عن ابن عمر: إذا طلق الرجل امرأته فدخلت في الدم من الحيضة الثالثة فقد برئت منه وبرئ منها", en: "Muwatta 1688", es: "Muwatta 1688", fr: "Muwatta 1688", ur: "موطا 1688", tr: "El-Muvatta 1688 — İbn Ömer'den rivayet edildiğine göre Nafi': Bir erkek karısını boşadığında, kadın üçüncü adet dönemine girerse, kadın ondan kurtulur ve erkek de ondan kurtulur.", id: "Al-Muwatta 1688 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Jika seorang pria menceraikan istrinya dan istrinya sedang mengalami haid ketiga, maka ia diampuni dari suaminya dan suaminya pun diampuni dari istrinya." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أنه كان يقول إذا طلق الرجل امرأته فدخلت في الدم من الحيضة الثالثة فقد برئت منه وبرئ منها. قال مالك وهو الأمر عندنا. {cite:muwatta-maruf-1997 p.91}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre şöyle buyurmuştur: \"Bir erkek karısını boşadığında, kadın üçüncü adet dönemine girmişse, kadın ondan kurtulur, erkek de ondan kurtulur.\" Malik dedi ki: \"Bu, aramızda yerleşik bir uygulamadır.\" {cite:muwatta-maruf-1997 s.91}"
  id: "Malik meriwayatkan dari Nafi’ dari Abdullah ibn Umar bahwa beliau biasa berkata: Jika seorang laki-laki menceraikan istrinya dan istrinya sedang haid ketiga, maka ia diampuni darinya dan laki-laki itu pun diampuni darinya. Malik berkata: Ini adalah kebiasaan yang telah mapan di antara kami. {cite:muwatta-maruf-1997 p.91}"
