label: { ar: "الموطأ 796 — سمي وأبو بكر بن عبد الرحمن: عائشة وأم سلمة قالتا إن كان النبي يصبح جنباً من جماع ثم يصوم", en: "Muwatta 796", es: "Muwatta 796", fr: "Muwatta 796", ur: "موطا 796", tr: "El-Muvatta 796 — Sumey ve Ebu Bekr ibn Abdülrahman: Aişe ve Ümmü Seleme şöyle dediler: Peygamber bazen cinsel ilişkiden dolayı ritüel kirlilik halinde uyanır ve sonra oruç tutardı.", id: "Al-Muwatta 796 — Sumay dan Abu Bakr ibn Abd al-Rahman: Aisyah dan Umm Salama berkata: Nabi kadang-kadang bangun dalam keadaan najis karena hubungan seksual, lalu berpuasa." }
summary:
  ar: "يرويه مالك عن سمي مولى أبي بكر بن عبد الرحمن عن أبي بكر بن عبد الرحمن عن عائشة وأم سلمة زوجي النبي، أنهما قالتا: إن كان رسول الله يصبح جنباً من جماع غير احتلام ثم يصوم. ويذكر المحقق أنه تقدم الكلام عليه مفصلاً في الحديث السابق. {cite:muwatta-maruf-1997 p.392}"
  tr: "Malik, Ebu Bekir ibn Abdülrahman'ın azatlı kölesi Sümey'den, o da Ebu Bekir ibn Abdülrahman'dan, o da Peygamberin eşleri Ayşe ve Ümmü Seleme'den rivayet ederek şöyle buyurduğunu nakletmiştir: \"Allah Resulü bazen cinsel ilişkiden dolayı cünüp halde uyanırdı, bu ıslak rüyadan kaynaklanmazdı ve sonra oruç tutardı.\" Editör, bunun önceki hadiste ayrıntılı olarak ele alındığını belirtmektedir. {cite:muwatta-maruf-1997 s.392}"
  id: "Malik meriwayatkannya dari Sumay, budak yang dibebaskan oleh Abu Bakr ibn Abd al-Rahman, dari Abu Bakr ibn Abd al-Rahman, dari Aisyah dan Umm Salama, istri-istri Nabi, bahwa mereka berkata: “Rasulullah kadang-kadang terbangun dalam keadaan junub karena hubungan seksual, bukan karena mimpi basah, lalu beliau berpuasa.” Editor mencatat bahwa hal ini telah dibahas secara rinci dalam hadits sebelumnya. {cite:muwatta-maruf-1997 p.392}"
