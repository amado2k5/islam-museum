label: { ar: "الموطأ 1005 — أبو قتادة مع رسول الله حتى إذا كانوا ببعض طريق مكة تخلف مع أصحاب له محرمين وهو غير محرم، فرأى حماراً وحشياً، فاستوى على فرسه، وسأل أصحابه أن يناولوه سوطه ورمحه فأبوا، فأخذه وقتل الحمار؛ فأكل منه بعض أصحاب النبي وأبى بعضهم", en: "Muwatta 1005" }
summary:
  ar: "يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن نافع مولى أبي قتادة الأنصاري عن أبي قتادة، أنه كان مع رسول الله حتى إذا كانوا ببعض طريق مكة تخلف مع أصحاب له محرمين وهو غير محرم، فرأى حماراً وحشياً، فاستوى على فرسه، وسأل أصحابه أن يناولوه سوطه فأبوا، ثم رمحه فأبوا، فأخذه وشد على الحمار فقتله، فأكل منه بعض أصحاب رسول الله وأبى بعضهم، فلما أدركوا رسول الله سألوه، فقال: إنما هي طعمة أطعمكموها الله. ويذكر المحقق أن ابن عبد البر قال إنه مرسل في الموطأ، ويصله من وجوه عن ابن عباس وجابر وابن بحينة وأنس، وأن البخاري ومسلما أخرجا حديث ابن بحينة. {cite:muwatta-maruf-1997 p.470} {cite:muwatta-maruf-1997 p.471}"
