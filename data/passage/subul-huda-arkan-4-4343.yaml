text: "… بُعِثت أَنا والسَّاعَةُ جميعا كهاتين وفى لفظ كهذه من هذه، وجمع بين السبابة والوسطى، وأَشار بهما، وإن كادت تسبقنى. الثامن : فى تشبيكه أصابعه. روى البخارى عن أَبى موسى أن رسول اللّٰه قال : إن المؤمن للمؤمن كالبُنْيان يشد بعضه …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 4343، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 4, p. 4343, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 4، ص 4343 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 4, pág. 4343, que menciona la semejanza del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 4, page 4343 (numérisé), évoquant la ressemblance du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" (Hida ve Doğruluk Yolları) adlı eserinin 4. cildinin 4343. sayfasından bir alıntı, müminin kıssasını anlatmaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu alıntı, İslam'ın temelleri, imanın temelleri, imanın dalları ve müminin özellikleri bölümlerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Salihi \"Subul al-Huda wa al-Rashad\" (Jalan Petunjuk dan Kebenaran), Jilid 4, halaman 4343, menyebutkan perumpamaan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
