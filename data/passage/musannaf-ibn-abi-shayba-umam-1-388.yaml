text: "… قريش! إني قد وفدت على الملوك على قيصر في ملكه بالشام، وعلى النجاشي بأرض الحبشة، وعلى كسرى بالعراق، وإني والله ما رأيت ملكاً هو أعظم فيمن هو بين ظهريه من محمد في أصحابه، والله ما يشدون إليه النظر وما يرفعون …"
