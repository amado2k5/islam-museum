text: "… واجبًا عليَّ. قال حنبل: وحدثنا سعيد بن منصور، قال: ثنا يعقوب بن عبد الرحمن، عن أبي حازم، عن أبي صالح السمان، عن أبي هريرة ههه : أن رسول اللّٰه ي قال: عليكم بالسمع والطاعة، في عُسرِك ويُسرِك، ومنشطك ومكرهك، وأثرة …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 28، يرد فيه ذكر الواجب، والسمع والطاعة، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
