label: { ar: "مسلم 29 — وصية عبادة عند الموت: حرم الله عليه النار", en: "Muslim 29 — Ubada's deathbed report: the Fire forbidden for him" }
text: "قال عبادة بن الصامت في الموت: والله ما من حديث سمعته من رسول الله لكم فيه خير إلا حدثتكموه إلا حديثاً واحداً وسوف أحدثكموه اليوم وقد أحيط بنفسي، سمعت رسول الله يقول: من شهد أن لا إله إلا الله وأن محمداً رسول الله حرم الله عليه النار"
summary:
  ar: "رواية عبادة بن الصامت على فراش الموت في باب دعوة الشهادتين من كتاب الإيمان في صحيح مسلم؛ أخرج ما احتفظ به لنفسه أخيراً: الشهادتان تحرّمان النار."
