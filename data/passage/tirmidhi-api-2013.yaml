label: { ar: "جامع الترمذي 2013 — ما حُرّم", en: "Jami' al-Tirmidhi 2013 — what was made unlawful", ur: "جامع ترمذی 2013 — جو حرام کیا گیا", es: "Jami' al-Tirmidhi 2013: lo que se declaró ilegal", fr: "Jami' al-Tirmidhi 2013 — ce qui a été déclaré illicite", tr: "Cami' el-Tirmizi 2013 — Haram Olan Şeyler", id: "Jami' al-Tirmidhi 2013 — Apa yang dilarang" }
text: "… ابْنِ أَبِي مُلَيْكَةَ، عَنْ يَعْلَى بْنِ مَمْلَكٍ، عَنْ أُمِّ الدَّرْدَاءِ، عَنْ أَبِي الدَّرْدَاءِ، عَنِ النَّبِيِّ قَالَ \" مَنْ أُعْطِيَ حَظَّهُ مِنَ الرِّفْقِ فَقَدْ أُعْطِيَ حَظَّهُ مِنَ الْخَيْرِ وَمَنْ حُرِمَ حَظَّهُ مِنَ الرِّفْقِ فَقَدْ حُرِمَ حَظَّهُ مِنَ الْخَيْرِ \". قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ عَائِشَةَ وَجَرِيرِ بْنِ عَبْدِ اللَّهِ وَأَبِي هُرَيْرَةَ. وَهَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2013، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2013 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2013، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2013 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los parientes), menciona lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2013 (chapitres sur la piété et les bonnes relations familiales), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Cami' el-Tirmizi'nin 2013 numaralı hadisinde haram olan şeylerden bahsedilir. Helal ve Haram tarayıcısı, bu hadisi Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin helal ve haram hakkındaki sözleriyle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2013, menyebutkan apa yang dilarang. Peramban Halal dan Haram menggabungkannya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
