text: "… الباب يؤصد أي يغلق والجمع وصَائد ووصُدُ، وقالوا الوصيد عتبة الباب أيضًا تقول : أوصد بابك وآصده، وذكر الطبري عن أبي عمرو بن العلاء أن أهل اليمن وتهامة يقولون الوصيد، وأهل نجد يقولون الأصيد. قوله: مؤصدة مطبقة قال أبو عبيدة …"
