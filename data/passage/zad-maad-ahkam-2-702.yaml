text: "… ولا يَحِلُّ لهم توقُف بذله على الأخذ، بل يجبُ عليهم المبادرةُ إلى بذله بلا عوض. وهذا أصل معروف مِن أصول الشرع أن العقد والبذل قد يكونُ جائزاً، أو مستحباً، أو واجباً من أحد الطرفين، مكروهاً أو محرماً من الطرف الآخر، …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 702، يرد فيه ذكر الواجب، وما يجب على المكلف، والمستحب، والمكروه، وما لا يحل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 702, whose wording mentions the obligatory (wajib), what is binding on the person addressed, the recommended (mustahabb), the disliked (makruh), what is not lawful; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 2، ص 702 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، مستحب، مکروہ، جو حلال نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Zad al-Ma'ad de Ibn al-Qayyim, volume numérisé 2, p. 702, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, le recommandé (mustahabb), le réprouvé (makruh), ce qui n'est pas licite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen digitalizado 2, p. 702, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo recomendado (mustahabb), lo reprobado (makruh), lo que no es lícito; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 2. cildinin 702. sayfasından, farz olan ameller, müstehap olan ameller, mekruh olan ameller ve haram olan ameller hakkında bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan ameller, itaat amelleri, müstehap olan ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 2, halaman 702, yang membahas amalan wajib, amalan anjuran, amalan makruh, dan amalan haram. Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, mengikuti pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil."
