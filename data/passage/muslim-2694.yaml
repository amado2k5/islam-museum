text: "قال رسول الله: «كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم»"
summary:
  ar: "رواية أبي هريرة في كتاب الذكر والدعاء من صحيح مسلم؛ الكلمتان التسبيحيتان أخف ما يقال على اللسان وأثقله في ميزان يوم القيامة."
  tr: "Sahih Müslim'de yer alan Dua ve Anma Kitabı'nda Ebu Hurayra'dan rivayet edildiğine göre: \"İki şerh\" kelimesi, dilde söylenebilecek en hafif şey, kıyamet gününde ise terazide en ağır şeydir."
  id: "Diriwayatkan oleh Abu Hurairah dalam Kitab Zikir dan Doa dari Sahih Muslim: Dua kalimat pujian adalah hal yang paling ringan yang dapat diucapkan di lidah dan yang paling berat di timbangan pada Hari Kiamat."
