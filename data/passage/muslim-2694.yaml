text: "قال رسول الله: «كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم»"
summary:
  ar: "رواية أبي هريرة في كتاب الذكر والدعاء من صحيح مسلم؛ الكلمتان التسبيحيتان أخف ما يقال على اللسان وأثقله في ميزان يوم القيامة."
