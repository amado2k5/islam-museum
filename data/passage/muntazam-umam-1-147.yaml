text: "… رسول ملك الروم فى الفداء والهدنة وكان الرسول غلاما حدث السن ومعه شيخ وعشرون غلاما فأقيمت له الأنزال الواسعة ثم احضر وا بعد ايام دار السلطان وادخاو اوقد عبئ لهم العسكر وصف بالأسلحة التامة وكانوا مائة وستين الفامابين فارس وراجل …"
