label: { ar: "جامع الترمذي 2494 — بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 2494 — dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 2494 — والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 2494 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Jami' al-Tirmidhi 2494 — le respect des parents ou la désobéissance envers eux" }
text: "… اللَّهِ بْنُ إِبْرَاهِيمَ الْغِفَارِيُّ الْمَدَنِيُّ، حَدَّثَنِي أَبِي، عَنْ أَبِي بَكْرِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" ثَلاَثٌ مَنْ كُنَّ فِيهِ نَشَرَ اللَّهُ عَلَيْهِ كَنَفَهُ وَأَدْخَلَهُ جَنَّتَهُ رِفْقٌ بِالضَّعِيفِ وَشَفَقَةٌ عَلَى الْوَالِدَيْنِ وَإِحْسَانٌ إِلَى الْمَمْلُوكِ \" قَالَ هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. وَأَبُو بَكْرِ بْنُ الْمُنْكَدِرِ هُوَ أَخُو مُحَمَّدِ بْنِ الْمُنْكَدِرِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2494، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2494 (Chapters on the description of the Day of Judgement, Ar-Riqaq, and Al-Wara'), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2494، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2494 (Capítulos sobre la descripción del Día del Juicio, Ar-Riqaq y Al-Wara'), menciona la obediencia o desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye entre los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith rapporté dans Jami' al-Tirmidhi, n° 2494 (chapitres sur la description du Jour du Jugement, Ar-Riqaq et Al-Wara'), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site The Fatherhood in Islam Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
