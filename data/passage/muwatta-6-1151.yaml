label: { ar: "الموطأ 1151 — ما بلغ مالكا: عرفة كلها موقف وارتفعوا عن بطن عرنة، والمزدلفة كلها موقف وارتفعوا عن بطن محسر", en: "Muwatta 1151", es: "Muwatta 1151", fr: "Muwatta 1151", ur: "موطا 1151", tr: "El-Muvatta 1151 — Malik'in rivayetine göre: Arafat'ın tamamı namaz kılınacak bir yerdir ve Arnah vadisinden uzak durmalıdırlar. Muzdalifa'nın tamamı namaz kılınacak bir yerdir ve Muhassar vadisinden uzak durmalıdırlar.", id: "Al-Muwatta 1151 — Apa yang diriwayatkan Malik: Seluruh Arafah adalah tempat berdiri (untuk shalat), dan mereka hendaknya menjauhi lembah Arnah. Seluruh Muzdalifah adalah tempat berdiri (untuk shalat), dan mereka hendaknya menjauhi lembah Muhassar." }
text: "عَرَفَةُ كُنُّها مَوْقِفٌ، وارْتَفِعوا عَن بَطْنِ عُرَنَةَ"
summary:
  ar: "بلغ مالكا أن رسول الله قال عرفة كلها موقف وارتفعوا عن بطن عرنة، والمزدلفة كلها موقف وارتفعوا عن بطن محسر. ويذكر المحقق أن ابن عبد البر قال إن الحديث يتصل من حديث جابر وابن عباس وعلي. {cite:muwatta-maruf-1997 p.521}"
  tr: "Malik, Resulullah'ın şöyle buyurduğunu rivayet etmiştir: \"Arafah'ın tamamı namaz kılınacak bir yerdir, Arnah vadisinden uzak durun. Muzdalifa'nın tamamı namaz kılınacak bir yerdir, Muhassar vadisinden uzak durun.\" Araştırmacı, İbn Abdül-Barr'ın bu hadisin Cabir, İbn Abbas ve Ali'nin rivayetleriyle bağlantılı olduğunu söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.521}"
  id: "Malik meriwayatkan bahwa Rasulullah SAW bersabda, “Seluruh Arafah adalah tempat berdiri (untuk shalat), dan jauhilah lembah Arnah. Seluruh Muzdalifah adalah tempat berdiri (untuk shalat), dan jauhilah lembah Muhassar.” Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits ini terhubung melalui riwayat Jabir, Ibnu Abbas, dan Ali. {cite:muwatta-maruf-1997 p.521}"
