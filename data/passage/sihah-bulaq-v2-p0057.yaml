  معنى الدعاء وأنشد الاصمعىّ للنابغة
  مهلافداءلك الاقوام كلهم * وما أغرمن مال ومن وأد
  ويقال قداموفاداءاذا أعطى فداءوفأنقذه وفداه بنفسه وفداه تف_دية اذ اقال له جعلت
  فداءل وتفادوا أى فدى بعضهم بعضا وافقدى منه بكذا وتفادى فلان من كذا اذا تحاماه
  وانزوى عنه وقال * تفادى الاسود الغلب منه تفاديا* والفدية والفدى والفداء كله يمعنى
  والقداء بالفتح الانساروهوجماعة الطعام من البروالتمر والشعير وقال يصف قرية بقلة الميرة
  كأن قداءما اذجردوه • وطافواحوله س يتيم
  ( فرا الفر والذى يلبس والمع الفراء واقتريت الرولبسته والفروة جلدة الرأس وقروة
  اسم رجل والفروة ابدال الثروة وهى الغنى قال الفراءانه لذوفروة فى المال وثروة بمعنى
  والاصمعى مثله والفروة قطعة نبسات مجتمعة يابسة وقال • وهامة فروتها كالفروه• وفريت
  الشئء أفريه فرياقطعته لا صلحه وفريت المزادة خلقتها وصنعتها وقال
  شلت يدافارية فرتها * مسك شبوب ثم وفرتها * لو كانت الساقى أصغرتها
  وقريت الارض سرتها وقطعتها وفرى فلان كذبا اذاخلقه وافتراه اختله والاسم الفرية
  وفلان يفرى الفرى اذا كار يأتى بالعجب فى عمله وقال * قد كت تفرين به الفريا* أى
  كنت تكثرين فيه القول وتعظمينه وقوله تعالى اقدحئت شيأفر يا أى مصنوعا مختلقا
  وقيل عظيما وأفريت الاوداج قطعتها وأفريت الشئ شققته فانف رى وتفرّى أى انشق يقال
  تفرّى الليل عن صبحه وقد أفرى الذئب بطن الشاة الكسائى أفريت الاديم قطعته على جهة
  الافساد وفريته قطعته على جهة الاصلاح وتفرّت الارض بالعبون انيجست وفرى بالكسر
  يفرى فرى تحيرود عش⁦(فسا)⁩ فافسوا والاسم الفساء بالدّ وتفاست الخنفاء اذا
  آخرحت استها لذلك وقال * بكراعواساء تفامى مقربا وفى المثل آفحش من فاسة
  وهى انطنفاه والفسو نيزحىّ من العرب جاعرجل-نهم ببردى حبرة الموق عماظ فقال
  من يشترى منا الفسو بهدين البردين فقام شيخ من مهو فارتدى بأحدهما واتنزر بالاخر
  وهو مش_ترى الفسو ببردى حبرة وضرب به المشل دقيل أخبث صفقة من شيخ مهو والفسو
  الكثير الفسو قال أبوذبيان بن الرعيل أبغض الشبوخ الى الاقلح الاملح الحسوّالفو
  وفى المثل ما أقرب محساهمن مفساه ( شا شا اظبر يفشوفشوا أى ذاع وأفشامغيره
  وتفشى المشئ أى اتسع والفوأشى كل شئء منتشر من المال مثل الغم السائمة والابل وغيرها
  وفى الحديت ضموافواشيك م حتى تذهب فحمة العشاء (فصا يقال تفصى الانسان اذا
  تخلص من المضيق والبلبة والاسم الفصية بالتسكين وفى حديت قيلة قالت الحديباء القصية
  واللّه لا يزال كعبك عاليا وأصل الفصية الشئء تكون فيه ثم تخرج منه فكأنما أرادت أنها
  كانت فى مضيق وشدة من قبل عم بناتها فخرحت منه الى السعة وانماتفاءلت باتفاج
  الارنب ويقال ما كدت أنفصى من فلان أى ما كدت أتخلص منه وتفصيت من الديون
  اذاخرحت منها وتخلصت وفصى اللحم عن العظم وفصيته منه تفصية اذا خلصتهمنه ابن
  السكيت قد أفصى عنذك الخترأى خرج ولا تقول أفصى عنك البرد وأفصى المطرأى أقلع
