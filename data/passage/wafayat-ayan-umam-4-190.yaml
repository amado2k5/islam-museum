text: "… النيام ويقال ان المعتضد أراد بنكاحها علاء الروم ثم وصل الى افتقار العلولونية وكذا كان فات أباها يهزها بحهازلم يعمل مثله حتى قيل كان لها ألف هاون ذهبا وشرط تخدمة المولى : نسر ووصل عليه المعتضد أن يحمل كل سنة …"
