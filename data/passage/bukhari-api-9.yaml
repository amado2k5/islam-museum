label: { ar: "صحيح البخاري 9 — شعب الإيمان، الإيمان بضع وسبعون شعبة", en: "Sahih al-Bukhari 9 — the branches of faith; faith as seventy-odd branches", ur: "صحیح بخاری 9 — ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں", es: "Sahih al-Bukhari 9 — Las ramas de la fe; la fe como setenta y tantos ramas" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، قَالَ حَدَّثَنَا أَبُو عَامِرٍ الْعَقَدِيُّ، قَالَ حَدَّثَنَا سُلَيْمَانُ بْنُ بِلاَلٍ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ عَنِ النَّبِيِّ قَالَ \" الإِيمَانُ بِضْعٌ وَسِتُّونَ شُعْبَةً، وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 9، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih al-Bukhari, no. 9 (Belief), that mentions the branches of faith, faith as seventy-odd branches. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح بخاری کی حدیث نمبر 9، جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 9 (Creencia), menciona las ramas de la fe, que constan de setenta y tantas ramas. El Navegador de Pilares y Ramas de la Fe las incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
