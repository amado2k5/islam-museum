label: { ar: "سنن النسائي 1139 — رفع الدرجات، محو السيئات وحط الخطايا", en: "Sunan al-Nasa'i 1139 — ranks raised; bad deeds erased and sins shed", ur: "سنن نسائی 1139 — درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Sunan al-Nasa'i 1139 — rangos elevados; malas acciones borradas y pecados perdonados", fr: "Sunan al-Nasa'i 1139 — Les rangs s'élèvent; les mauvaises actions sont effacées et les péchés sont pardonnés.", tr: "Sunan an-Nasa'i 1139 — Rütbeleri yükseltmek, günahları silmek ve suçları ortadan kaldırmak", id: "Sunan an-Nasa'i 1139 — Meningkatkan derajat, menghapus dosa, dan menghilangkan pelanggaran" }
text: "… فَقَالَ عَلَيْكَ بِالسُّجُودِ فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَا مِنْ عَبْدٍ يَسْجُدُ لِلَّهِ سَجْدَةً إِلاَّ رَفَعَهُ اللَّهُ عَزَّ وَجَلَّ بِهَا دَرَجَةً وَحَطَّ عَنْهُ بِهَا خَطِيئَةً \". قَالَ مَعْدَانُ ثُمَّ لَقِيتُ أَبَا الدَّرْدَاءِ فَسَأَلْتُهُ عَمَّا سَأَلْتُ عَنْهُ ثَوْبَانَ فَقَالَ لِي عَلَيْكَ بِالسُّجُودِ فَإِنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَا مِنْ عَبْدِ يَسْجُدُ لِلَّهِ سَجْدَةً إِلاَّ …"
summary:
  ar: "حديث في سنن النسائي، رقم 1139، يذكر رفع الدرجات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 1139 (The Book of The At-Tatbiq (Clasping One's Hands Together)), that speaks of ranks raised, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 1139، جس میں درجات کی بلندی، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1139 (El Libro del At-Tatbiq (Junto de las Manos)), habla de ascensos de rango, borrado de malas acciones y purificación de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 1139 (Le Livre de l'At-Tatbiq, ou Jointure des mains), évoque l'élévation de grade, l'effacement des mauvaises actions et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui traitent du décompte, de l'inscription, de l'effacement ou de la pesée d'un acte."
  tr: "Sunan-ı Nesai'de yer alan 1139 numaralı hadis, mertebelerin yükseltilmesinden, günahların silinmesinden ve zulümlerin giderilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 1139, menyebutkan tentang peningkatan derajat, penghapusan dosa, dan penghapusan pelanggaran. Hadits ini dikelompokkan bersama dengan daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
