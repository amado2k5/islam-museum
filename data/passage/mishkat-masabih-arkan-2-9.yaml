text: "… إلى النبي مويّه، فأسند ركبتيه إِلى ركبتيه، ووضع كفيه على فخذيه، وقال : يا محمد! أخبرني عن الإسلام. قال : الإسلام : أن تشهدَ أن لا إله إلا اللّٰه وأن محمداً رسولُ الله، ونقيم الصلاة، ونؤتي الزكاة، وتصوم رمضان، وتحجّ …"
