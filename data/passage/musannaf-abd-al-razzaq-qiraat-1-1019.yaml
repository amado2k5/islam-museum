text: "… ما رأَيت أَعرابياً أَفقه منه. باب رفع الإمام صوته بالقرأة - عبد الرزاق عن ابن جريج قال : قلت لعطاء : أَليس إِن الإمام أَمَّ الناس فيما يُرفع به الصوت من القراءة، رفع بأُمِّ القرآن في كل ركعة قَطُّ لا …"
