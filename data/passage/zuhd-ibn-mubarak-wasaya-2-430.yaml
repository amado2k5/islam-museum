  fr: "Extrait du Kitab al-Zuhd d'Ibn al-Mubarak, volume 2, page 430, mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire Testaments Browser."
  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zilecilik) adlı eserinin 2. cildinin 430. sayfasından bir alıntıda, bir mezar, bir türbe ve bir türbeden bahsedilmektedir; bu alıntı, makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn al-Mubarak \"Al-Zuhd\" (Kemelekatan), Jilid 2, halaman 430, menyebutkan sebuah pemakaman, sebuah kuburan, dan sebuah makam; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
