text: "… نقل جماعة عن مصحف ابي انه ست عشرة سورة والصواب أنه خمس عشرة فان سوزة الغيل وسورة ليلاف قريش فيه سورة واحدة ونقل ذلك السخاوي في جمال القراء عن جعفر الصادق وابي نهيك ايضا قلت ويرده ما اخرجه الحاكم والطبراني …"
summary:
  ar: "مقطع من الإتقان في علوم القرآن للسيوطي، المجلد المصوَّر 1، ص 155، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Suyuti's al-Itqan fi 'Ulum al-Qur'an, scan volume 1, p. 155, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاتقان فی علوم القرآن، سیوطی، اسکین جلد 1، ص 155 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
