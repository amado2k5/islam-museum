text: "… متى قطع الذنب فهناك الغبار ذهب يوماً هو وتلميذُهُ حمادٌ لصيد الذئاب، فدخل تلميذُهُ وكْرَ الذئب ليقبِضَ على بعض جراثه، ووقف الشيخ يراقبُهُ. وبينما هو كذلك إذا بالذئب، قد جاء ودخلَ الوكر، فأسرع الشيخ خوفاً على حماد منه فأمسك بذنبه …"
summary:
  ar: "خرج جحا وحماد لصيد الذئاب، فدخل حماد وكراً ليأخذ الجراء، وجاء ذئب فأمسك جحا بذيله ليسحبه إلى الخارج، فارتفع الغبار وسأل حماد وقد أعماه الغبار ماذا يحدث، فقال جحا إنه متى قُطع ذنب الذئب فهناك غبار. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  en: "Juha and Hammad hunt wolves; Hammad enters a den to catch cubs; a wolf comes, Juha grabs its tail to pull it out; dust rises and Hammad, blinded, asks what is happening; Juha says when the wolf's tail is cut, there is dust. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  ur: "جحا اور حماد بھیڑیوں کے شکار کو نکلے، حماد بچے پکڑنے کے لیے ایک کھوہ میں داخل ہوا، ایک بھیڑیا آیا تو جحا نے اسے باہر کھینچنے کے لیے اس کی دم پکڑ لی، گرد اٹھی اور حماد نے، جو گرد سے اندھا ہو گیا تھا، پوچھا کہ کیا ہو رہا ہے، تو جحا نے کہا کہ جب بھیڑیے کی دم کٹ جائے تو وہاں گرد اڑتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  fr: "Juha et Hammad chassent les loups ; Hammad entre dans un terrier pour prendre les louveteaux ; un loup arrive et Juha saisit sa queue pour le tirer dehors ; la poussière s'élève et Hammad, aveuglé, demande ce qui se passe ; Juha dit que, quand la queue du loup est coupée, il y a de la poussière. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  es: "Juha y Hammad cazan lobos; Hammad entra en una madriguera para atrapar a los cachorros; llega un lobo y Juha lo agarra por la cola para sacarlo; se levanta polvo y Hammad, cegado, pregunta qué ocurre; Juha dice que cuando se corta la cola del lobo, hay polvo. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
  tr: "Cüha ve Hammad kurt avına çıktılar. Hammad yavruları almak için bir inine girdi ve bir kurt geldi. Cüha onu dışarı çekmek için kuyruğundan tuttu, ancak toz yükseldi. Tozdan gözleri kamaşan Hammad ne olduğunu sordu. Cüha, bir kurdun kuyruğu kesildiğinde toz çıktığını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 179}"
  id: "Juha dan Hammad pergi berburu serigala. Hammad memasuki sarang untuk mengambil anak-anak serigala, dan seekor serigala datang. Juha meraih ekornya untuk menariknya keluar, tetapi debu beterbangan. Hammad, yang matanya silau oleh debu, bertanya apa yang terjadi. Juha menjawab bahwa setiap kali ekor serigala dipotong, akan ada debu. {cite:juha-nawadir-kubra-djuwaydi p. 179}"
