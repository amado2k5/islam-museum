label: { ar: "جامع الترمذي 921 — الواجب، المستحب", en: "Jami' al-Tirmidhi 921 — the obligatory (wajib); the recommended (mustahabb)", ur: "جامع ترمذی 921 — واجب، مستحب", fr: "Jami' al-Tirmidhi 921 — l'obligatoire (wajib) ; le recommandé (mustahabb)", es: "Yami' al-Tirmidhi 921 — lo obligatorio (wajib); lo recomendado (mustahabb)" }
text: "… رَافِعٍ وَابْنِ عَبَّاسٍ. قَالَ أَبُو عِيسَى حَدِيثُ ابْنِ عُمَرَ حَدِيثٌ صَحِيحٌ حَسَنٌ غَرِيبٌ إِنَّمَا نَعْرِفُهُ مِنْ حَدِيثِ عَبْدِ الرَّزَّاقِ عَنْ عُبَيْدِ اللَّهِ بْنِ عُمَرَ. وَقَدِ اسْتَحَبَّ بَعْضُ أَهْلِ الْعِلْمِ نُزُولَ الأَبْطَحِ مِنْ غَيْرِ أَنْ يَرَوْا ذَلِكَ وَاجِبًا إِلاَّ مَنْ أَحَبَّ ذَلِكَ. قَالَ الشَّافِعِيُّ وَنُزُولُ الأَبْطَحِ لَيْسَ مِنَ النُّسُكِ فِي شَيْءٍ إِنَّمَا هُوَ مَنْزِلٌ نَزَلَهُ النَّبِيُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 921، يرد فيه ذكر الواجب، والمستحب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 921 (The Book on Hajj), whose wording mentions the obligatory (wajib), the recommended (mustahabb). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 921، جس کے الفاظ میں واجب، مستحب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 921, dont le texte mentionne l'obligatoire (wajib), le recommandé (mustahabb). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 921, cuyo texto menciona lo obligatorio (wajib), lo recomendado (mustahabb). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
