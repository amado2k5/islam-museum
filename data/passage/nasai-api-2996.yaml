label: { ar: "سنن النسائي 2996 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 2996 — the father raising and counselling", ur: "سنن نسائی 2996 — باپ کی تربیت اور نصیحت" }
text: "… عَنْ مُحَمَّدِ بْنُ إِبْرَاهِيمَ التَّيْمِيِّ، عَنْ رَجُلٍ، مِنْهُمْ يُقَالُ لَهُ عَبْدُ الرَّحْمَنِ بْنُ مُعَاذٍ قَالَ خَطَبَنَا رَسُولُ اللَّهِ بِمِنًى فَفَتَحَ اللَّهُ أَسْمَاعَنَا حَتَّى إِنْ كُنَّا لَنَسْمَعُ مَا يَقُولُ وَنَحْنُ فِي مَنَازِلِنَا فَطَفِقَ النَّبِيُّ يُعَلِّمُهُمْ مَنَاسِكَهُمْ حَتَّى بَلَغَ الْجِمَارَ فَقَالَ بِحَصَى الْخَذْفِ وَأَمَرَ الْمُهَاجِرِينَ أَنْ يَنْزِلُوا فِي مُقَدَّمِ الْمَسْجِدِ وَأَمَرَ الأَنْصَارَ أَنْ يَنْزِلُوا فِي مُؤَخَّرِ الْمَسْجِدِ."
summary:
  ar: "حديث في سنن النسائي، رقم 2996، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2996 (The Book of Hajj), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2996، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
