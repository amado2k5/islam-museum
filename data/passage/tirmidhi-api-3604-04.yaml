label: { ar: "جامع الترمذي 3604.04 — محو السيئات وحط الخطايا", en: "Jami' al-Tirmidhi 3604.04 — bad deeds erased and sins shed", ur: "جامع ترمذی 3604.04 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Jami' al-Tirmidhi 3604.04 — malas acciones borradas y pecados perdonados", fr: "Jami' al-Tirmidhi 3604.04 — Les mauvaises actions effacées et les péchés pardonnés", tr: "Cami' el-Tirmizi 3604.04 — Günahları silmek ve suçları ortadan kaldırmak", id: "Jami' al-Tirmidhi 3604.04 — Menghapus dosa dan menghilangkan pelanggaran" }
text: "… إِلاَّ اسْتُجِيبَ لَهُ فَإِمَّا أَنْ يُعَجَّلَ لَهُ فِي الدُّنْيَا وَإِمَّا أَنْ يُدَّخَرَ لَهُ فِي الآخِرَةِ وَإِمَّا أَنْ يُكَفَّرَ عَنْهُ مِنْ ذُنُوبِهِ بِقَدْرِ مَا دَعَا مَا لَمْ يَدْعُ بِإِثْمٍ أَوْ قَطِيعَةِ رَحِمٍ أَوْ يَسْتَعْجِلُ \". قَالُوا يَا رَسُولَ اللَّهِ وَكَيْفَ يَسْتَعْجِلُ قَالَ \" يَقُولُ دَعَوْتُ رَبِّي فَمَا اسْتَجَابَ لِي \". هَذَا حَدِيثٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3604.04، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3604.04 (Chapters on Supplication), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3604.04، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3604.04 (Capítulos sobre la súplica), habla de las malas acciones borradas y los pecados perdonados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3604.04 (Chapitres sur les invocations), évoque l'effacement des mauvaises actions et le pardon des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou pèsent une action."
  tr: "Cami' el-Tirmizi'de 3604.04 numaralı hadis, günahların silinmesinden ve yanlışların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, eylemleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3604.04, menyebutkan penghapusan dosa dan penghapusan kesalahan. Hadits ini dikelompokkan dengan daftar amal baik dan buruk, bersama dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
