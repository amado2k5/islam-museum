label: { ar: "جامع الترمذي 3604.04 — محو السيئات وحط الخطايا", en: "Jami' al-Tirmidhi 3604.04 — bad deeds erased and sins shed", ur: "جامع ترمذی 3604.04 — برائیوں کا مٹنا اور خطاؤں کا جھڑنا" }
text: "… إِلاَّ اسْتُجِيبَ لَهُ فَإِمَّا أَنْ يُعَجَّلَ لَهُ فِي الدُّنْيَا وَإِمَّا أَنْ يُدَّخَرَ لَهُ فِي الآخِرَةِ وَإِمَّا أَنْ يُكَفَّرَ عَنْهُ مِنْ ذُنُوبِهِ بِقَدْرِ مَا دَعَا مَا لَمْ يَدْعُ بِإِثْمٍ أَوْ قَطِيعَةِ رَحِمٍ أَوْ يَسْتَعْجِلُ \". قَالُوا يَا رَسُولَ اللَّهِ وَكَيْفَ يَسْتَعْجِلُ قَالَ \" يَقُولُ دَعَوْتُ رَبِّي فَمَا اسْتَجَابَ لِي \". هَذَا حَدِيثٌ غَرِيبٌ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3604.04، يذكر محو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3604.04 (Chapters on Supplication), that speaks of bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3604.04، جس میں برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
