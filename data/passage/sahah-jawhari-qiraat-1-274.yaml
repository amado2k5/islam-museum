text: "… حلق : الحَلْقَةُ بالتسكين: الدُّروعُ، وكذلك حَلْقَةُ الباب وحَلْقَةُ القومِ، والجمع: الحَلَقُ على غير قياس، وقال الأصمعي: الجمع: حِلَقٌّ، مثل بَدْرَةٍ وبِدَرٍ، وقَصْعَةٍ وقصَعٍ، وحكى يونس عن أبي عمرو بن العلاء حَلَقَةً في الواحد بالتحريك، والجمع حَلَقٌ وحَلَقاتٌ، وقال ثعلب …"
