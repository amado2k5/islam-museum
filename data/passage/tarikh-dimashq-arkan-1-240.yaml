text: "… سلط عليه من يؤذيه وقد قال سفيان لا خير فين لا يؤذى وقال سفيان لا يذوق العبد حلاوة الايمان حتى يأتيه البلاء من كل مكان وكان ببغداد رجل من التجار وكان كثيراً ما يقع فى الصوفية فلقيه احد اصحابه وفاتحه …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 240، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn 'Asakir's History of Damascus, scan volume 1, p. 240, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 1، ص 240 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
