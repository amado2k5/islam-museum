text: "الجامع لشعب الإيمان ابن داود بن أبي صالح الحرّاني، حدثنا أبو مصعب المدني الّذي يلقّب بمطرف، حدثني أبومودود، عن أبي حازم، عن أنس بن مالك قال سمعتُ رسول اللّٰه وتلفه يقول : لا يستكمل العبد الإيمان حتّى يحسن خلقه، ولا …"
summary:
