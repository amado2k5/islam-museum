text: |-
  ⁦(فصل القاف)⁩
  قربانا والقربان أيضا واحد قرابين الملكوهم جلساؤه وخاصته تقول فلان من قربان الامير
  ومن بعدانه وتترب الى الله تعالى بشئ أى طلب به القربة عنده وقربته تقر يبا أى أدنيته
  والقرب ضد البعد والقرب والقرب من الشاكلة الى مراق البطن مثل عسر وعسر
  والجمع الاقراب والتريب ضرب من العدو يقال قرب الفرس اذارفع بديه معا ووضعهما
  معافى العدو وهودون الحضر وله تقريبان أعلى وأدنى واقترب الوعدأى تقارب وقاربته
  فى البيع مقاربة وشئ مقارب بكسر الراء أى وسط بين الجيد والردى ولا تقسل مقارب
  وكذلك اذا كان رخيصا والتقارب ضد التباعد وأقربت المرأة اذاقرب ولادها وكذلك
  الفرس والشاة فهى مقرب ولا يقال للناقة قالت أمّ تأبط شراتؤينه بعدموته
  وابناه وابن الليسل ليس بزميل شروب للقيل يضرب بالذيل كقرب الخيل
  لانها تضر ح من دنا منها و يروى كمقرب بفتح الراء وهو المسكرم وقال العدبس جمع
  المقرب مقاريب وأقربت السيف جعلت له قرابا وأقربت القدح من قولهم قدح
  قربان اذا قارب أن يمتلئ وججمة قربى وقدحان قربانان والجع قراب مثال عجلان
  وعجال والمقرب من الخيل الذى يدنى ويكرم والانثى مقربة ولا تترك أن ترود قال ابن دريد
  انما يفعل ذلك بالاناث لثلا يقرعها فيل لنيم والقربة مايستقي فيه الماء والجمع فى أدنى العدد
  قربات وقربات وقربات وللثيرقرب وكذلك جمع كل مأكان على فعلة ممل سدرة رفقرة
  للك أن تفتح العين وتكسر وتسكن والقرابة القرب فى الرحم وهوفى الاص-ل محدرتقول
  بيني وبيسه قرابة وقرب وقربى ومقربة ومقرية وقوبة وقربة بضم الراء وهو قريى وذوقرابتى
  وهم أقربائى وأقاربى والعامة تقول هو قرابتى وهم قراياتى وقراب السيف جفنه وهو
  وعاء يكون فيه السيف بغسمده وحالته وفى المثل إن الفرار بقراب أكيس ١ القراب
  أيضا مقاربة الامر وقال يصف نوها
  دوائن منضحات كن قدما * ردن على الغدير قراب شهر ( ٢
  كذلكْ اذا قارب أن يمتلئ الدلو وقال إلا تجىْ ملاى تجئ قرابها وقولهم ماهو
  بشميهك ولا بقرابة من ذلك مضمومة الفاف أى ولا بريب من ذلكْ والقرنى مقصوردويبة
  طويلة الرجلين مثل الخنفساء أعظم منه شيئا وفى المثل القرنبى فى عين أمها حسنة وقال
  يصف جارية وبعلها يدب الى أحشاتها كل ايلة * دييب القرني بات بعلونقاسهلا
  ( قرشب القرشب بكسر القاف المن عن الاصمعى قال الراجز
  كيف قريت شينخك الازيا • لما أتاك بإبسا قرشبا
  قت اليه بالقفيل ضربا * ضرب بعير السواذ أحبا
  رضب قرضبه قطعه والقرضوب والقرضاب السيف القاطع يقطع العظام
  والقرضوب والة رضاب القص والجمع القراضبة ورعاسموا الفقيررضوبا وقرضب الرجل
  اذا أكل شيئا يا بسافهوقرضاب -كاء نعلب وأنشد
  وعامنا أعجبنا مقدمه * يدعى أبا السمح وقرضاب سمه * مبتركالكل عظم يلحمه
  وقراضبة بضم القاف موضع قال بشر
  ١ ال ابن برى هذا المثل ذكرة
  الجوهرى بعد قراب السيف على
  ماتراه وكأن صواب الكلام أن
  يقول قبل المثل والقراب القرب
  ويستشهد بالمثل عليهاه والقراب
  بعنى القرب كسحاب وبثك اه
  باختصار من مرتضى
  ٢ ال ابن برى صواب انشاده
  يزدن على العديد من معنى الزيادة
  على العدة لامن معى الورود
  على الغدير اه مرتضى
