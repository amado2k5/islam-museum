text: "… فأخذها عَمَّار بن ياسر، فجعل يرتجز بها. قال ابن هشام: فلما أكثر، ظَنَّ رجلٌ من أصحاب رسول اللّٰه لليله أنه إنما يُعَرِّضُ به، فيما حدثنا زيادُ بن عبدالله البَكّائي، عن ابن إسحاق، وقد سمى ابنُ إسحاق الرجل. وصاة الرسول وَلِيه …"
