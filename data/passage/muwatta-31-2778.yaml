label: { ar: "الموطأ 2778 — ابن عمر: الكلب الضاري وكلب الماشية مستثنيان من نقص القيراطين", en: "Muwatta 2778", es: "Muwatta 2778", fr: "Muwatta 2778", ur: "موطا 2778", tr: "İbn Umar: El-Muvatta 2778: Yırtıcı köpek ve sürü köpeği iki kıratlık indirimden muaftır.", id: "Al-Muwatta 2778 — Ibn Umar: Anjing pemangsa dan anjing gembala dikecualikan dari pengurangan dua qirat." }
summary:
  ar: "يروي مالك عن نافع، عن عبد الله بن عمر أن النبي قال: من اقتنى كلبا إلا كلبا ضاريا أو كلب ماشية نقص من عمله كل يوم قيراطان. {cite:muwatta-maruf-1997 p.561} {cite:muwatta-maruf-1997 p.562}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Peygamberimiz şöyle buyurmuştur: \"Av köpeği veya çoban köpeği dışında köpek besleyen kimsenin her günkü amellerinden iki kırat düşülür.\" {cite:muwatta-maruf-1997 s.561} {cite:muwatta-maruf-1997 s.562}"
  id: "Malik meriwayatkan dari Nafi’, dari Abdullah ibn Umar, bahwa Nabi bersabda: “Barang siapa memelihara anjing, kecuali anjing pemburu atau anjing gembala, maka amal kebaikannya akan dikurangi dua qirat setiap harinya.” {cite:muwatta-maruf-1997 p.561} {cite:muwatta-maruf-1997 p.562}"
