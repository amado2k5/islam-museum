text: |-
  فيكررها بحسب لغاتها ولوأربع مرات كمافعل فى النطع ومحل كون الضبط للاوّل فى غسب
  المفعلة كالمقبرة والميسرة أماهى فالضبط فيها للعين وقد يصرح بضبط أوّلها اذا كان بالكسر
  وأما فى الافعال اذاذ كرفعلا وقال عقبه بالضم أوغيره فيكون الضبط لمين الفسعل مشاله
  أدب الرحل بالضم أى لادال واماحصيت الرحل أحصبه بالكسر فااضبط لعين الفعل الذى
  قبله وهو المضارع والماضى معلوم النتح (ومن قواعده فيها أيضام ماذكره صاحب المختار.
  بوله اعلم انه متى ذكرنامع الفعل مصدرابوزن التفعيل أوالتفعل اوالتفعلة وذكرنامصدرا
  من هذه الاوزان الثلاثة وحده أوقانافعله فتفعل كان ذلك كاء نصاعلى ان الفعل أى
  عينه مشدد فيؤمن الاشتباه فيه مع ذلكْ اه وذلكْ كقوله جزأت الشى جزا
  وجزأته تجزئة وأنيه تأنيبا وتهبأتهيؤا وهزعت الشى تهزيعا وهجع القوم تهجيعا أى
  نومواوليس بلازم كون التفعسل متعديابل هوأكثرى ومعلوم من الاصول الصرفية ان
  التفعيسل يكون فى الفسعل الصحيح والتفعلة تكون فى المعتل مثل ذكى تزكية ويهوبه
  المهموز كالتجزئة وقد تأتى التفعلة فى الصحيح كالتجرية والقياس التجريب
  ومن قواعده فى الفعل أيضاأنه اذا أتبعه بصدر الافعال بكسر الهمزة فيكون الفعل من
  أفعل المزيد كقوله آذب القوم يؤدبه-م ايدابا ومثله أكت إكمانا فهومثل أكرم يكرم اكراما
  واذا أسعه بصدر الافعلال أو الافعيلال بكون مشدّد اللام كقوه احرّاحرارا واشهاب
  اشهيباباولا يختص ه_ذا الوزن بالالوان بل مثلد اسلخ اسلخاخاوا-فات الجرح اسخيتا تا أى
  سكن ألمْه ومثله فى هذه القواعد القاموس (وليس من قواعده التزام الترتيب الذى اعتمد.
  المجد ولذلك لما اعترض عليه فى ذكره قطر بعد تركيب قطمبر وقال انه غير جيد والصواب
  ذكره بعدقر قال محشيه ابن الطمب ان الترتيب الذى اعتمده المصنف لم يعتمده الجوهرى بل
  اعتمد خلافه ولم يعمأ بالترتيب الذى يقصد المصنف الله الا اذادعت البه ضرورة صرف
  ولذلك يدخل أحمانا بعض المواد فى بعض قصدا للاختصار والمصنف لم يطلع على أسرار
  اصطلاحاته فكا.انعقت لدناعقه صعق اهاصاعه وليس ذلكدأب المحققين وكذلك
  لما اعترض عليه فى ذكره فنبر فى قبروأنّ حقه الذكر فى النون عقب القاف ردّ عليه ابن الطيب
  بان عادة الجوهرى ايراد مشل هذا ان لو كان أصلى الحروف فى المواد الثلاثية اختصارا
  لا سيما وهذا قد صرحوا بانّ النون فيه زائدة فالصواب عليه ذسكرهفى قبر كمافعل
  الجوهرى وتوهم المصنف اصالة المون فاعترض على الجوهرى ولايرد عليه لانه وان قيل
  باصالتها فالجوهرى لايرى ذلك فلا يعترض عليه؛الابراه كما هو معروف فى مباحث
  المناظرة اه (يقول الفقيnرn noوعما ينغى التنبيه عليه أنه قد يصف الاسم الذى لا ينصرف
  بانه لا يجرى بالبناء للمفعول ويصف الكامة غير المنصرفة بانهامجراةٍ كقوله وخنت اسم
  احرأة لا يجرى وقوله خزرج هى ريح الجنوب غير مجراة وركب فلان هجاج غير مجراة الى غير
  ذلك ومشله فى ذلك القاموس حيث قال خضارة هو البحرمحرفة لا تجرى والتعبير بالمجرى
  وغير المجرى لسيبو به والكوفيين فى مقابلد تعبير البصر بين ماعد اسيبويه بالمنصرف وغير
  المنصرف كما فى شفاء الغليل عندذ كرجهتم ونقله ابن الطيب
  ا قائدة الرابعة فى بيان عدد الفصول الساقطة من كل باب
