text: |-
  ٦٤٥
  بعنى شددت وهذا الشئ ملا يمينى وملك يينى والفتح أفصح وملكت المرأة أى تزوّجتها
  والمملول العبد وملكه لشي تليكا أى جعله ملكاله يقال ملكه المال والملاك فهو عملكْ قال
  الفرزدق فى خال هشام بن عبد الملاث
  وما مذله فى اناس الاعماكا • أبو أمه حى أبوه يقاربه
  يقول مامثله فى الناس حى يقاربه الامملك أبو أمّ ذلن المملك أبوه ونصب معملكالانه استئناء
  مقدم وملك النبعة صليها وذلك ذا يبسها فى الشمسر مع قشرها قال أوس
  قلات باللسط الذى تحت قشره • كغر فى يض كنه القيض من على
  ويروى فن لك والاول أجود ألاترى الى قول الشماخ يصف نبعة
  فصعها شهرين ماعلحاتها • وينظارمنها أيها هوغامر
  والتمصبع أن يترك عليها قشر هاحتى يجف عليها ليطها وذلك أصلب لها وأملمكت الهجين
  لغة فى ملكته اذا أجدت عجنه والاملاك التزويج وقد أملمكافلا نافلانة اذا زوجناه اياها
  وحئنا من املا كه ولا تقل م ملاكه والملكوت. ن الملك كارهبوت من الرهبة يقالله
  ملكوت العراق وملسكوة العراقأ يضامثال الترقوة وهو الملك والعزفهو مليك وملت وملات
  صثل فى ذوفذ كان الملا مخفف ص ملك والمامقصور من مالك أومليك والجمع الماول
  والاملاك والاسم الملك والموضع ثملكة وتمدكه أى ملسكه فهراوملمين النحل بعسوبها
  قال الهذلى وماضرب بيضاء يأوى مليكها * الى طنق أعيابراق ونازل
  وعبد عملمكة ومملكة اذا -لك ولم يملا - أبوا. وفى الحديث ات الاشعث بن قيس خاصم أهل تجرات
  الى عمر فى رقابهم وكان قد استعبدهم فى الجاهلية فلما أسلموا أبواءليه فقالوا يا أمير المؤمنين
  انا انماكنا عبيد ملكة ولم نكن عبيدقن قال الكسائىّ القنّ أن يكون ملل هو وأبواه
  والمملكة أن يغلب عليهم فيستعبدهم وهم فى الأصل أحرار ويقال القنّ المشترى وقولهم مافى
  ماكدشئ وملمكه شى أى لا يملك شيأ وفيه لغة ثالمة ما فى ملكته شى بالتحريك عن ابن الاعراتي
  يقال فلان -سر المدسكة أذا كان حسن الصنع الى مماليكه وفى الحديث لا يدخل الجنة سي
  الملسكة قال ابن السكيت بقال لاذهينّ فاما ملك واماهلك قال ويقا أيضافاماهلك
  وامّاهلك بالنتح وم لال الامر وملا كه ما يقوم به ويقال القاب علال الجسد ومالفلان مولى
  ملاكة دون اللّه أى لم يملكه الا اللّٰه وفلان ماله ملاك بالفتح أى عماسك وماا لك أن قال ذلك
  أى ما تماسك وملاك الدابة بنم الميم واللام قوائمها وهاديها ومنه قولهم جاناتوده ملكه
  حكاه أبو عبيد والملك من الملائكة واحد وجع قال الكسائىّ أصلده ألك بتقديم الهمزة
  من الألول وهى الرسالة ثم قلبت وقدّمت اللام فقيل ملأك وأنسد أ بو عبيدة رجلمن عبد
  القيس جاهلى عمدح بعض الملوك
  فلت لانمىّ ولكن للأك • تنزل من جوّ السماء يصوب
  ثم زكت «مزته لكثرة الاستعمال فقيل ملك فلما جعوه ردّوها اليه فقالوا ملائكة وملائك أيضا
  قال أمية بن أبى الصلت
  فكأنّ برقع والملائك -وله • سدرتوا كاه القوائم جرب.
  ٢٧
  صماح
  قوله فصعها شهر بن روا. في مادّة
  مصح عامين يدل شهرين اه
  قوله وعبد ملكة ومملكة أى بفتح
  اللام وضمها كماضبط فى الذسخ
  الصحيحة وفى القاموس وعبد
  مملكة مثلثة اللام اه
  برقع بالكسراسم السماء السابعة
  لا ينصرف وسدرأى بحر وأجرب
  كاترى فى السمافهى
  وأتماسماء الدنيدا فيى الرقيع قاله
  اواف
