label: { ar: "صحيح البخاري 6116 — وصية أو عهد أخير", en: "Sahih al-Bukhari 6116 — a testament or parting counsel", ur: "صحیح بخاری 6116 — وصیت یا آخری نصیحت", es: "Sahih al-Bukhari 6116 — un testamento o consejo de despedida", fr: "Sahih al-Bukhari 6116 — un testament ou un conseil d'adieu", tr: "Sahih el-Buhari 6116 — Son bir vasiyet veya antlaşma", id: "Sahih al-Bukhari 6116 — Sebuah wasiat atau perjanjian terakhir" }
text: "حَدَّثَنِي يَحْيَى بْنُ يُوسُفَ، أَخْبَرَنَا أَبُو بَكْرٍ ـ هُوَ ابْنُ عَيَّاشٍ ـ عَنْ أَبِي حَصِينٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ أَنَّ رَجُلاً، قَالَ لِلنَّبِيِّ أَوْصِنِي. قَالَ \" لاَ تَغْضَبْ \". فَرَدَّدَ مِرَارًا، قَالَ \" لاَ تَغْضَبْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6116، يذكر وصية أو عهد أخير. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6116 (Good Manners and Form (Al-Adab)), that mentions a testament or parting counsel. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 6116، جس میں وصیت یا آخری نصیحت کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6116 (Buenas costumbres y forma (Al-Adab)), menciona un testamento o consejo de despedida. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 6116 (Les bonnes manières et la bienséance), mentionne un testament ou des conseils d'adieu. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Sahih el-Buhari'de 6116 numaralı hadis, vasiyet veya son bir ahitten bahsetmektedir. Bu hadis, vasiyet, miras, kutsal emanetler ve türbeler konusunda uzmanlaşmış araştırmacılar tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6116, menyebutkan tentang wasiat atau perjanjian terakhir. Hadits ini disusun oleh para peneliti yang ahli dalam wasiat, warisan, relik, dan makam, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
