label: { ar: "صحيح البخاري 3907 — الأب والأبوة", en: "Sahih al-Bukhari 3907 — the father and fatherhood", ur: "صحیح بخاری 3907 — باپ اور والدیت", es: "Sahih al-Bukhari 3907 — El padre y la paternidad", fr: "Sahih al-Bukhari 3907 — Le père et la paternité", tr: "Sahih el-Buhari 3907 — Baba ve Babalık", id: "Sahih al-Bukhari 3907 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو أُسَامَةَ، حَدَّثَنَا هِشَامٌ، عَنْ أَبِيهِ، وَفَاطِمَةَ، عَنْ أَسْمَاءَ،ا صَنَعْتُ سُفْرَةً لِلنَّبِيِّ وَأَبِي بَكْرٍ حِينَ أَرَادَا الْمَدِينَةَ، فَقُلْتُ لأَبِي مَا أَجِدُ شَيْئًا أَرْبُطُهُ إِلاَّ نِطَاقِي. قَالَ فَشُقِّيهِ. فَفَعَلْتُ، فَسُمِّيتُ ذَاتَ النِّطَاقَيْنِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3907، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3907 (Merits of the Helpers in Madinah (Ansaar)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3907، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3907 (Méritos de los Ayudantes en Medina (Ansar)), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3907 (Mérites des Compagnons de Médine (Ansar)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 3907 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3907, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
