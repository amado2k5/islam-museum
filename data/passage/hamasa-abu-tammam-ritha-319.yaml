text: "… يَوْمُ بَدْرِ كَمْ يَسُودُوا وقال رجل من بنى أسد منهم لا تفعلوا فيباغ ذلك محمداً وأصحابه فيشمتوا بكم وكان الاسود يحب أن يبكى على بنيه فينما هو كذلك اذ سمع نائحة فى الليل فقال لعلام وكان قد ذهب بصره انظر …"
summary:
  ar: "مقطع من حماسة أبي تمام، ص 319، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Hamasa of Abu Tammam, p. 319, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "ابو تمام کی حماسہ، ص 319 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hamasa d'Abu Tammam, p. 319, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Hamasa de Abu Tammam, p. 319, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Ebu Tammam'ın Hamasa adlı eserinin 319. sayfasından, ölüler için ağıt ve bunun sınırlarını içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Hamasa karya Abu Tammam, halaman 319, berisi ratapan untuk orang mati dan batasannya; dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan eulogi paling terkenal."
