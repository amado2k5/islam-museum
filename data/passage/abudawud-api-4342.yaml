label: { ar: "سنن أبي داود 4342 — الأب والأبوة", en: "Sunan Abi Dawud 4342 — the father and fatherhood", ur: "سنن ابی داؤد 4342 — باپ اور والدیت", es: "Sunan Abi Dawud 4342 — El padre y la paternidad" }
text: "حَدَّثَنَا الْقَعْنَبِيُّ، أَنَّ عَبْدَ الْعَزِيزِ بْنَ أَبِي حَازِمٍ، حَدَّثَهُمْ عَنْ أَبِيهِ، عَنْ عُمَارَةَ بْنِ عَمْرٍو، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" كَيْفَ بِكُمْ وَبِزَمَانٍ \". أَوْ \" يُوشِكُ أَنْ يَأْتِيَ زَمَانٌ يُغَرْبَلُ النَّاسُ فِيهِ غَرْبَلَةً تَبْقَى حُثَالَةٌ مِنَ النَّاسِ قَدْ مَرِجَتْ عُهُودُهُمْ وَأَمَانَاتُهُمْ وَاخْتَلَفُوا فَكَانُوا هَكَذَا \". وَشَبَّكَ بَيْنَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4342، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4342 (Battles (Kitab Al-Malahim)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4342، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4342 (Batallas (Kitab Al-Malahim)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
