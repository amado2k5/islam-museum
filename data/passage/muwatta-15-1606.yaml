label: { ar: "الموطأ 1606 — مالك: الإيلاء مع طلاق يكون تطليقتين إن وقف ولم يفئ، وإن مضت عدة الطلاق قبل الأربعة الأشهر فليس الإيلاء بطلاق", en: "Muwatta 1606" }
summary:
  ar: "يقول مالك في الرجل يولي من امرأته ثم يطلقها، فتنقضي الأربعة الأشهر قبل انقضاء عدة الطلاق، قال هما تطليقتان إن هو وقف ولم يفئ. وإن مضت عدة الطلاق قبل الأربعة الأشهر، فليس الإيلاء بطلاق، لأن الأربعة الأشهر التي كان يوقف بعدها مضت وليست له يومئذ بامرأة. {cite:muwatta-maruf-1997 p.67}"
