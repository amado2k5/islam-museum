label: { ar: "الموطأ 1606 — مالك: الإيلاء مع طلاق يكون تطليقتين إن وقف ولم يفئ، وإن مضت عدة الطلاق قبل الأربعة الأشهر فليس الإيلاء بطلاق", en: "Muwatta 1606", es: "Muwatta 1606", fr: "Muwatta 1606", ur: "موطا 1606", tr: "El-Muvatta 1606 — Malik: Bir erkek cinsel perhiz (ila’) yemini edip boşanırsa, cinsel ilişkiye girmeyi bırakıp bir daha ilişkiye girmemesi şartıyla iki boşanma sayılır. Boşanma için bekleme süresi dört ay dolmadan geçerse, cinsel perhiz yemini boşanma sayılmaz." }
summary:
  ar: "يقول مالك في الرجل يولي من امرأته ثم يطلقها، فتنقضي الأربعة الأشهر قبل انقضاء عدة الطلاق، قال هما تطليقتان إن هو وقف ولم يفئ. وإن مضت عدة الطلاق قبل الأربعة الأشهر، فليس الإيلاء بطلاق، لأن الأربعة الأشهر التي كان يوقف بعدها مضت وليست له يومئذ بامرأة. {cite:muwatta-maruf-1997 p.67}"
  tr: "Malik, karısından cinsel perhiz yemini eden ve daha sonra boşanan bir adamın, boşanma için bekleme süresi dolmadan dört ay geçmesi durumunda, eğer cinsel ilişkiden uzak durur ve tekrar cinsel ilişkiye girmezse, bunun iki boşanma olarak sayıldığını söylemiştir. Ancak, boşanma için bekleme süresi dört ay dolmadan sona ererse, cinsel perhiz yemini boşanma olarak sayılmaz, çünkü cinsel perhiz yükümlülüğünün bulunduğu dört ay geçmiş olur ve kadın o sırada artık onun karısı değildir. {cite:muwatta-maruf-1997 s.67}"
  id: "Malik mengatakan mengenai seorang pria yang bersumpah untuk tidak berhubungan badan dengan istrinya dan kemudian menceraikannya, dan empat bulan berlalu sebelum masa tunggu perceraian berakhir, maka hal itu dihitung sebagai dua kali perceraian jika ia menahan diri dari hubungan perkawinan dan tidak melanjutkannya. Namun, jika masa tunggu perceraian berakhir sebelum empat bulan, maka sumpah untuk tidak berhubungan badan tersebut tidak dianggap sebagai perceraian, karena empat bulan di mana ia wajib menahan diri telah berlalu, dan wanita itu bukan lagi istrinya pada saat itu. {cite:muwatta-maruf-1997 p.67}"
