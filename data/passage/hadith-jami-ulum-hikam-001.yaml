text: "ما يفهمه ، وكذلك الناصح من العباد يفهم وصية من ينصحه ، وإن ورد عليه كتاب منه ، عني بفهمه ليقوم عليه بما كتب به فيه إليه ، فكذلك الناصح لكتاب ربه ، يعني بفهمه ؛ ليقوم لله بما أمر"
