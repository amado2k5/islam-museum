label:
  ar: "البخاري 2270 — ثلاثة أنا خصمهم يوم القيامة"
  en: "Bukhari 2270 — Three whose adversary I shall be on the Day of Resurrection"
  ur: "بخاری 2270 — تین لوگ جن کا میں قیامت کے دن مدمقابل ہوں گا"
  es: "Bukhari 2270 — Tres de los cuales seré adversario en el Día de la Resurrección"
  fr: "Bukhari 2270 — Trois dont je serai l'adversaire au Jour de la Résurrection"
  tr: "Buhari 2270 — Kıyamet Gününde üç kişiye düşman olacağım."
  id: "Bukhari 2270 — Ada tiga orang yang akan menjadi musuhku pada Hari Kiamat"
text: "قال الله تعالى ثلاثة أنا خصمهم يوم القيامة رجل أعطى بي ثم غدر، ورجل باع حرا فأكل ثمنه، ورجل استأجر أجيرا فاستوفى منه ولم يعطه أجره ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 2270: ثلاثة أنا خصمهم يوم القيامة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 2270: Three whose adversary I shall be on the Day of Resurrection. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 2270: تین لوگ جن کا میں قیامت کے دن مدمقابل ہوں گا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih al-Bukhari, n.° 2270: Tres contra quienes seré adversario el Día de la Resurrección. El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih al-Bukhari, n° 2270: « Trois personnes dont je serai l’adversaire le Jour de la Résurrection. » Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ses narrations issues des six livres et de la Muwatta."
  id: "Sebuah hadits qudsi dalam Sahih al-Bukhari, no. 2270: “Ada tiga orang yang akan Aku lawan pada Hari Kiamat.” Nabi (shalawat dan salam kepadanya) meriwayatkannya dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam kumpulan hadits kanonik dan al-Muwatta."
