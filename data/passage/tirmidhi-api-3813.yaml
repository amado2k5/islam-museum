text: "حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ بَكْرٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ أَبِيهِ، عَنْ عُمَرَ، أَنَّهُ فَرَضَ لأُسَامَةَ بْنِ زَيْدٍ فِي ثَلاَثَةِ آلاَفٍ وَخَمْسِمِائَةٍ وَفَرَضَ لِعَبْدِ اللَّهِ بْنِ عُمَرَ فِي ثَلاَثَةِ آلاَفٍ قَالَ عَبْدُ اللَّهِ بْنُ عُمَرَ لأَبِيهِ لِمَ فَضَّلْتَ أُسَامَةَ عَلَىَّ فَوَاللَّهِ مَا سَبَقَنِي إِلَى مَشْهَدٍ. قَالَ لأَنَّ زَيْدًا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3813، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3813 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3813، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3813 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3813 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
