label:
  ar: "مسلم 2758 — أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب"
  en: "Muslim 2758 — My servant sinned and knew he has a Lord who forgives sin"
  ur: "مسلم 2758 — میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے"
text: "أذنب عبد ذنبا فقال اللهم اغفر لي ذنبي . فقال تبارك وتعالى أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب ويأخذ بالذنب . ثم عاد فأذنب فقال أى رب اغفر لي ذنبي . فقال تبارك وتعالى عبدي أذنب ذنبا …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2758: أذنب عبدي ذنبا فعلم أن له ربا يغفر الذنب. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2758: My servant sinned and knew he has a Lord who forgives sin. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2758: میرے بندے نے گناہ کیا اور جان لیا کہ اس کا ایک رب ہے جو گناہ بخشتا ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
