label: { ar: "الموطأ 2559 — مروان يكتب إلى معاوية في السكران الذي قتل رجلا فيأمره بقتله به", en: "Muwatta 2559", es: "Muwatta 2559", fr: "Muwatta 2559", ur: "موطا 2559", tr: "El-Muvatta 2559 — Mervan, Muaviye'ye sarhoş bir adamın bir kişiyi öldürdüğünü yazıyor ve intikam olarak onu öldürmesini emrediyor.", id: "Al-Muwatta 2559 — Marwan menulis surat kepada Muawiyah tentang seorang pemabuk yang membunuh seorang pria, dan memerintahkannya untuk membunuh orang itu sebagai pembalasan." }
summary:
  ar: "بلغ مالكا أن مروان بن الحكم كتب إلى معاوية بن أبي سفيان يذكر أنه أُتي بسكران قد قتل رجلا، فكتب إليه معاوية: أن اقتله به. {cite:muwatta-maruf-1997 p.445}"
  tr: "Malik'e, Marwan ibn al-Hakam'ın Muaviye ibn Abi Sufyan'a, kendisine bir sarhoşun getirildiğini ve bir adamı öldürdüğünü bildirdiği, bunun üzerine Muaviye'nin ona \"İntikam olarak onu öldür\" diye cevap yazdığı bilgisi verildi. {cite:muwatta-maruf-1997 s.445}"
  id: "Malik diberitahu bahwa Marwan ibn al-Hakam menulis surat kepada Muawiyah ibn Abi Sufyan yang menyatakan bahwa seorang pemabuk telah dibawa kepadanya dan telah membunuh seorang pria, sehingga Muawiyah membalas suratnya: \"Bunuh dia sebagai pembalasan.\" {cite:muwatta-maruf-1997 p.445}"
