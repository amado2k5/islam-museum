text: "… أي اتقوا الأرحام وصلوها، أخرجه ابن أبي حاتم عنه، والأرخام جمع رحم، وذوو الرحم الأقارب يطلق على كل من يجمع بينه وبين الآخر نسب، والقراءة المشهورة والأرحام نصبًا وعليها جاء التفسير، وقرأ حمزة والأرحام بالجر، واختلف في توجيهه فقيل : …"
summary:
  ar: "مقطع من فتح الباري لابن حجر، المجلد المصوَّر 1، ص 144، يذكر قراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
