text: "ن اليهود إلى عمر، رضي الله عنه، فقال: يا أمير المؤمنين، آية في كتابكم تقرؤونها لو علينا معشر اليهود نزلت لاتخذنا ذلك اليوم عيدا . [قال](): أي آية؟ قال: (اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام دينا"
