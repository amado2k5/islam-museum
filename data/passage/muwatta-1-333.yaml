label: { ar: "الموطأ 333 — عبادة يسكت المؤذن حتى يوتر ثم يصلي بهم الصبح", en: "Muwatta 333" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب الوتر بعد الفجر: كان عبادة بن الصامت يؤم قوماً، فخرج يوماً إلى الصبح فأقام المؤذن الصلاة، فأسكته عبادة حتى أوتر ثم صلى بهم الصبح. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.185}"
