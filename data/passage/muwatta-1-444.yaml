label: { ar: "الموطأ 444 — أبو هريرة: من جلس في مصلاه لم تزل الملائكة تصلي عليه، ومن انتظر الصلاة فهو في صلاة", en: "Muwatta 444" }
summary:
  ar: "أثر يرويه مالك عن نعيم بن عبد الله المجمر أنه سمع أبا هريرة يقول، في باب انتظار الصلاة والمشي إليها: إذا صلى أحدكم ثم جلس في مصلاه لم تزل الملائكة تدعو له بالمغفرة والرحمة، فإن قام من مصلاه فجلس في المسجد ينتظر الصلاة لم يزل في صلاة حتى يصلي. ويذكر المحقق أنه رواه عن مالك موقوفاً أبو مصعب وسويد، ورواه مرفوعاً محمد بن الحسن وإسماعيل بن جعفر وابن وهب وعثمان بن عمر والوليد بن مسلم، وينقل عن ابن عبد البر أنه حديث صحيح رواه جماعة من ثقات رواة أبي هريرة عنه عن النبي (التمهيد 16/205–207). {cite:muwatta-maruf-1997 p.228} {cite:muwatta-maruf-1997 p.229}"
