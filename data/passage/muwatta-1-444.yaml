label: { ar: "الموطأ 444 — أبو هريرة: من جلس في مصلاه لم تزل الملائكة تصلي عليه، ومن انتظر الصلاة فهو في صلاة", en: "Muwatta 444", es: "Muwatta 444", fr: "Muwatta 444", ur: "موطا 444", tr: "El-Muvatta 444 — Ebu Hurayra: Kim namaz kıldığı yerde oturursa, melekler onun için namaz kılmaya devam eder; kim de namazı beklerse, o da namaz halindedir.", id: "Al-Muwatta 444 — Abu Hurairah: Barangsiapa duduk di tempat shalatnya, para malaikat akan terus mendoakannya, dan barangsiapa menunggu waktu shalat, maka ia berada dalam keadaan shalat." }
summary:
  ar: "أثر يرويه مالك عن نعيم بن عبد الله المجمر أنه سمع أبا هريرة يقول، في باب انتظار الصلاة والمشي إليها: إذا صلى أحدكم ثم جلس في مصلاه لم تزل الملائكة تدعو له بالمغفرة والرحمة، فإن قام من مصلاه فجلس في المسجد ينتظر الصلاة لم يزل في صلاة حتى يصلي. ويذكر المحقق أنه رواه عن مالك موقوفاً أبو مصعب وسويد، ورواه مرفوعاً محمد بن الحسن وإسماعيل بن جعفر وابن وهب وعثمان بن عمر والوليد بن مسلم، وينقل عن ابن عبد البر أنه حديث صحيح رواه جماعة من ثقات رواة أبي هريرة عنه عن النبي ⁦(التمهيد 16/205–207)⁩. {cite:muwatta-maruf-1997 p.228} {cite:muwatta-maruf-1997 p.229}"
  tr: "Malik'in Nu'aym ibn Abdullah el-Mücmir'den rivayet ettiği bir hadiste, Ebu Hurayra'nın namazı beklemek ve namaza gitmek bölümünde şöyle dediği aktarılır: \"Sizden biri namaz kılar ve sonra namaz yerine oturursa, melekler onun için bağışlanma ve rahmetle dua etmeye devam ederler. Eğer namaz yerinden kalkıp mescitte namazı beklerse, namaz kılıncaya kadar namaz halinde kalır.\" Araştırmacı, bu hadisin Malik'ten bir Sahabe sözü (mevkuf) olarak Ebu Musab ve Suveyd tarafından, Peygamber sözü (merfu') olarak ise Muhammed ibn el-Hasan, İsmail ibn Cafer, İbn Vahb, Osman ibn Ömer ve el-Velid ibn Müslim tarafından rivayet edildiğini belirtmektedir. İbn Abdülbarr'ın, bu hadisin Ebu Hurayra'nın Peygamberimizden rivayet ettiği, güvenilir bir grup ravi tarafından nakledilmiş sahih bir hadis olduğunu söylediğini aktarıyor (el-Tamhid 16/205–207). {cite:muwatta-maruf-1997 s.228} {cite:muwatta-maruf-1997 s.229}"
  id: "Sebuah riwayat yang dinabikan oleh Malik dari Nu'aym ibn 'Abdullah al-Mujmir, yang mendengar Abu Hurayrah berkata, dalam surah tentang menunggu salat dan berjalan menuju salat: \"Jika salah seorang dari kalian salat dan kemudian duduk di tempat salatnya, para malaikat terus mendoakannya dengan ampunan dan rahmat. Jika dia bangun dari tempat salatnya dan duduk di masjid menunggu salat, dia tetap dalam keadaan salat sampai dia salat.\" Peneliti menyebutkan bahwa riwayat ini dinabikan dari Malik sebagai pernyataan seorang Sahabat (mawquf) oleh Abu Mus'ab dan Suwayd, dan dinabikan sebagai pernyataan Nabi (marfu') oleh Muhammad ibn al-Hasan, Isma'il ibn Ja'far, Ibn Wahb, 'Uthman ibn 'Umar, dan al-Walid ibn Muslim. Ia mengutip Ibnu 'Abd al-Barr yang mengatakan bahwa hadits ini sahih, diriwayatkan oleh sekelompok perawi terpercaya dari Abu Hurayrah atas otoritasnya dari Nabi (al-Tamhid 16/205–207). {cite:muwatta-maruf-1997 p.228} {cite:muwatta-maruf-1997 p.229}"
