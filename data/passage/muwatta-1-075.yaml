summary:
  ar: "أثر يرويه مالك عن هشام بن عروة، في باب ما جاء في المسح بالرأس والأذنين: كان أبوه عروة بن الزبير ينزع عمامته ويمسح رأسه بالماء. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن ومعن بن عيسى ويحيى بن بكير. {cite:muwatta-maruf-1997 p.74}"
