label: { ar: "الموطأ 1301 — مالك في الأجير في الغزو: إن شهد القتال وكان حرا فله سهمه، وإلا فلا سهم له", en: "Muwatta 1301", es: "Muwatta 1301", fr: "Muwatta 1301", ur: "موطا 1301", tr: "El-Muvatta 1301 — Malik, savaşta paralı asker hakkında: Eğer çatışmaya şahit olmuş ve özgür ise, payına düşeni almaya hak kazanır; aksi takdirde paya hak kazanmaz.", id: "Al-Muwatta 1301 — Malik tentang tentara bayaran dalam perang: Jika dia menyaksikan pertempuran dan dia bebas, maka dia berhak atas bagiannya, jika tidak, dia tidak berhak atas bagiannya." }
summary:
  ar: "يذكر يحيى أن مالكا قال في الأجير في الغزو إن كان شهد القتال، وكان مع الناس عند القتال، وكان حرا، فله سهمه، وإن لم يفعل فلا سهم له. ويرى مالك أن لا يقسم إلا لمن شهد القتال من الأحرار. {cite:muwatta-maruf-1997 p.581}"
  tr: "Yahya, Malik'in bir askeri seferde paralı asker hakkında şöyle dediğini aktarır: Eğer savaşa şahit olmuş, savaş sırasında halkın arasında bulunmuş ve özgür bir adam ise, payını almaya hak kazanır; fakat eğer bunları yapmamışsa, payını almaya hak kazanmaz. Malik, yalnızca savaşa şahit olan özgür adamların pay alması gerektiğine inanır. {cite:muwatta-maruf-1997 s.581}"
  id: "Yahya menyebutkan bahwa Malik berkata mengenai seorang tentara bayaran dalam sebuah kampanye militer: jika ia menyaksikan pertempuran, berada bersama rakyat selama pertempuran, dan merupakan orang merdeka, maka ia berhak atas bagiannya; tetapi jika tidak, maka ia tidak berhak atas bagian. Malik percaya bahwa hanya orang-orang merdeka yang menyaksikan pertempuran yang seharusnya menerima bagian. {cite:muwatta-maruf-1997 p.581}"
