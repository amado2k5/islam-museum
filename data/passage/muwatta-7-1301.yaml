label: { ar: "الموطأ 1301 — مالك في الأجير في الغزو: إن شهد القتال وكان حرا فله سهمه، وإلا فلا سهم له", en: "Muwatta 1301" }
summary:
  ar: "يذكر يحيى أن مالكا قال في الأجير في الغزو إن كان شهد القتال، وكان مع الناس عند القتال، وكان حرا، فله سهمه، وإن لم يفعل فلا سهم له. ويرى مالك أن لا يقسم إلا لمن شهد القتال من الأحرار. {cite:muwatta-maruf-1997 p.581}"
