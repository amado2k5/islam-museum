text: "… قال: أنا داود بن يزيد، عن عامر، عن جرير ابن عبد الله ملنا، قال: سمعت رسول اللّٰه وللهم يقول: بُني الإسلام على خمس: شهادة أن لا إله إلَّا الله، وإقام الصَّلاة، وإبتاء الزكاة، وحج البيت، وصيام رمضان. - حدثنا أبو …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 4، ص 378، يذكر ما بُني عليه الإسلام، والشهادة والصلاة والزكاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
