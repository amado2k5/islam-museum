text: "… يجرز. وأما إذا كانت الذبيحة مما حرمت عليهم، فقيل: يجوز؛ وقيل: لا يجوز، وقيل: بالفرق بين أن تكون محرمة عليهم بالتوراة، أو من قبل أنفسهم، أعني بإباحة ما ذبحوا مما حرموا على أنفسهم، ومنع ما حرم اللّٰه عليهم؛ وقيل: يكره …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 499، يذكر ما حُرّم، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 499, that mentions what was made unlawful, the permissible; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 499 کا اقتباس جس میں جو حرام کیا گیا، مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 4, pág. 499, que menciona lo que se considera ilícito y lo que se considera permisible; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de Bidayat al-Mujtahid d'Ibn Rushd, volume 4, page 499, mentionnant ce qui a été déclaré illicite et ce qui a été déclaré licite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Le Halal and Haram Browser le répertorie."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 4. cildinin 499. sayfasından, haram ve helal olan şeyleri belirten bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 4, halaman 499, yang menyebutkan apa yang dilarang dan apa yang diperbolehkan; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
