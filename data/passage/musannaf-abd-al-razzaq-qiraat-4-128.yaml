text: "… اللهِ وَلِ حُبْبَ إِلَيَّ الطَّيْبُ وَالنِّسَاءُ، وَجُعِلَتْ قُرَةُ عَيْنِي فِي الصَّلَاةِ. - بَابُ مَا يُكْرَهُ أَنْ يُصْنَعَ فِي الْمَصَاحِفِ عم الرزاق، عَنْ مَعْمَرٍ، عَنْ أَيُوبَ، عَنِ ابْنِ سِيرِينَ أَنَّهُ كَانَ يَكْرَهُ أَنْ يُشَكَّلَ الْمُصْحَفُ، أَوْ يُزَادَ فِيهِ شَيْءٌ. • عبد …"
summary:
  ar: "مقطع من مصنف عبد الرزاق، المجلد المصوَّر 4، ص 128، يذكر جمع القرآن والمصاحف، ونقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of 'Abd al-Razzaq, scan volume 4, p. 128, that mentions the collection of the Qur'an and the codices, the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف عبد الرزاق، اسکین جلد 4، ص 128 کا اقتباس جس میں جمعِ قرآن اور مصاحف، مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de 'Abd al-Razzaq, volumen 4, pág. 128, que menciona la colección del Corán y los códices, así como los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
