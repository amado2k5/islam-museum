label:
  ar: "أبو داود 4090 — الكبرياء ردائي والعظمة إزاري"
  en: "Abu Dawud 4090 — Pride is My cloak and grandeur My wrap"
  ur: "ابو داود 4090 — کبریائی میری چادر اور عظمت میرا تہبند ہے"
text: "قال الله عز وجل الكبرياء ردائي والعظمة إزاري فمن نازعني واحدا منهما قذفته في النار ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 4090: الكبرياء ردائي والعظمة إزاري. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 4090: Pride is My cloak and grandeur My wrap. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 4090: کبریائی میری چادر اور عظمت میرا تہبند ہے۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
