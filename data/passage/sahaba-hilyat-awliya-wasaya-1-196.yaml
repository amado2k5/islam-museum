text: "… البصرى وسعيد بن المسيب وعامر بن عبد اللّٰه عن سلمان حدثنا أبى ثنا زكريا الساحى ثنا هدبة بن خالد ثنا حماد بن سلمة عن حبيب عن الحسن وحميد عن مورق المجلى : أن سلمان ا حضرته الوفاة بكى، فقيل له …"
summary:
