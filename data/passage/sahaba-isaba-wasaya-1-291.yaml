text: "… الغِفَاري وروى له التِّرْمِذِيُّ حديثاً، وحسَّن حديثه؛ وابن ماجه، وأحمد. قال الطَّبَرانِيُّ: مات بالبصرة، وروى المعلّى بن جابر بن مسلم، عن أبيه، عن عُديسة بنت وهُبان بن صَيْفِي - أن أباها لما حضرته الوفاة أوصى أن يكفّن في ثوبين، فكفنوه …"
