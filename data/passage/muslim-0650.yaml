label: { ar: "مسلم 650 — صلاة الجماعة تفضل بسبع وعشرين درجة", en: "Muslim 650 — Congregational prayer exceeds by twenty-seven degrees", es: "Musulmán 650 — La oración en congregación excede en veintisiete grados", fr: "Muslim 650 — La prière en congrégation dépasse de vingt-sept degrés", ur: "مسلم 650 - باجماعت نماز ستائیس درجے سے بڑھ جاتی ہے۔", tr: "Müslim 650 — Cemaatle kılınan namaz yirmi yedi kat daha faziletlidir.", id: "Muslim 650 — Shalat berjamaah dua puluh tujuh kali lebih utama" }
text: "قال ابن عمر: قال رسول الله: صلاة الجماعة أفضل من صلاة الفذ بسبع وعشرين درجة"
summary:
  ar: "رواية ابن عمر في باب فضل صلاة الجماعة وبيان التغليظ على من تخلف عنها من كتاب المساجد في صحيح مسلم؛ أشهر نص في تفضيل الجماعة، ورواية أبي هريرة عنده بخمسة وعشرين جزءاً."
  tr: "Sahih Müslim'deki Mescitler Kitabı'nda yer alan, cemaatle namaz kılmanın fazileti ve namazı kılmayanların azabının şiddeti hakkındaki bölümde İbn Ömer'in rivayeti, cemaatle namazın fazileti konusunda en meşhur metindir; Ebu Hurayra'nın rivayeti ise yirmi beş bölümden oluşmaktadır."
  id: "Riwayat Ibnu Umar dalam bab tentang keutamaan shalat berjamaah dan penjelasan tentang beratnya azab bagi orang yang meninggalkannya, dari Kitab Masjid-Masjid dalam Sahih Muslim, adalah teks yang paling terkenal tentang keutamaan shalat berjamaah, dan riwayat Abu Hurairah terdiri dari dua puluh lima bagian."
