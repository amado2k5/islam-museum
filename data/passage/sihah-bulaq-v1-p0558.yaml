text: |-
  ⁦(فصل العيز)⁩
  ⁦(عقب)⁩
  ٨٣
  من قلل الشحر فذات العنظية
  ⁦(عقب)⁩ عاقبة كل شىء آخره وقولهم
  يست لفلان عاقبة أى ولد وفى الحديت السيد والعاقب فالماقب من يخلف السيد بعده
  وقول الذىّ صلى اللّٰه عليه وسلم أنا العاقب يعنى آخر الانياء وكل من خلف بعدشئ فهو
  عاقبه والعقب بكسر القاف مؤخر القدم وهى مؤنثة وعقب الرجل أيضا ولده وولد ولده وفيها
  لغتان عقب وعقب بالتسكين وهى أيضامؤشة عن الاخفش وقال أبوعمر والمعامة تعقب
  فى مرعى بعد مرعى فرّة تأكل الاء ومرّة تأكل التنوم وتعقب بعدذلك فى حجارة المرو
  وهى عقبته ولا يغث عليها شئ من المرتع وهذا معنى قول ذى الرمة يصف الظليم
  ألهاه آء وتنوم وعقبته • من لايح المرد والمرعى له عقب
  وعقب فلان مكان أبيه عاقبة أى خلفه وهو اسم جاء بمعنى المصدر كقوله تعالى ليس لوقعتها
  كاذية وعقبت الرحل فى اهل اذا بغيته بشر وخلفته وعقبته أيضا اذاضربت عقبه
  وانعقب بالتسكين الجرى يجى ءبعد الجرى الأوّل تقول اهذا الفرس عقب حس-ن والعقب
  والعقب العاقبة مثل عسر وعسر ومنه قوله تعالى هو خيرتوابا وخير عقبا وتقول أيضا
  جئت فى عقب شهررمضان وفى عقبانه اذاجئت بعد أن عضى كله وجئت فى عقبه بكسر
  القاف اذاجئت وقد يقيت منه بقية حكاء ابن السكيت والعقسة النوية تقول غت
  قيتك وهما يتعاقبان كاللو-ل والنهاروتقول أيضا أخذتمن أسرى عقبة اذا أخذت
  نه يد لا وعاقيت الرحل فى الراحلة اذاركمت أنت مرّة وركب هو مرّة وعقمة الطائر مسافة
  ما بين ارتفاعه وانحطاطه والمعقاب المرأة التى من عادتها أن تلدذ كرا بعد أنتى والعقبة أيضا
  ثي من المرق يردّه مستعير القدر اذاردّها وقواهم عليه عقبه السرو وابمال بالكسر أى أثر
  ذلك وهينته ويقال أيضاما يفعل ذلك الاعقية القمراذا كان يفعله فى كل شهر مرّة والعقب
  بالتحريك العصب الذى تعمل منه الاوتار الواحدة عقبة تقول منه عقبت السهم والقدح
  والقوس عقبا اذالو يتشيئامنه عليه قال الشاعر
  وأسمر من قداح النبع فرع * بدعلمان من عقب وضرس
  وربماشدوابه القرط الملايزيغ وأنشد الاصممى
  كأن خوف قرطها المعقوب على دباة أو على بعسوب
  والعقبة واحدة عقاب الجمال ويعقوب اسم رجل لاستصرف فى المعرفة للعجمة والتعريف لانه
  غير عن جهته فوقع فى كلام العرب غير معروف المذهب واليعقوب ذكر الحجل وهو مصروف
  لانه عربلم يغيروان كان مزيدافى أوّله فليس على وزن الفعل قال الشاءر
  عال يقصر دونه اليعقوب والجمع البعاقيب وابل معاقبة ترعى مرّة فى حض ومرّة فى خلة وأما
  التى تشرب الماءثم تعود الى المعطن ثم تعود الى الماء فهى العواقب عن ابن الاعرابى وأعقبت
  الرجل اذاركبت عقبة وركب هوعقبة مثل المعاقبة والعرب تعقب بين الفاء والثاء وتعاقب
  شل جدث وجدف والعقاب العقوبة وقد عاقبه بذنيه وقوله نعالى فعاقسم أى فغنمه
  وعاقبه أى جاء بعقبه فهومعاقب وعقيب أيضا والتعقيب مثله والمعقبات ملائكة الليل
  والنهارلانهم يتعاقبون وانما أنت لكثرة ذلك منهم نحونسابة وعلامة والمعقبات اللواتى
