text: "وأنفقوا في سبيل الله ولا تلقوا بأديكم بن إلى التهلكة [195] روى البخاري عن حذيفة قال نزلت هذه الآية في النفقة وأخرج أبو داود والترمذي وصححه وابن حيان والحاكم وغيرهم عن أبي أيوب الأنصاري قال نزلت هذه الآية فينا معشر الأنصار لما أعز الله الإسلام"
