text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى، عَنْ سُفْيَانَ بْنِ سَعِيدٍ، قَالَ حَدَّثَنِي عَبْدُ الْعَزِيزِ بْنُ رُفَيْعٍ، عَنْ تَمِيمٍ الطَّائِيِّ، عَنْ عَدِيِّ بْنِ حَاتِمٍ، أَنَّ خَطِيبًا، خَطَبَ عِنْدَ النَّبِيِّ فَقَالَ مَنْ يُطِعِ اللَّهَ وَرَسُولَهُ فَقَدْ رَشَدَ وَمَنْ يَعْصِهِمَا. فَقَالَ \" قُمْ \". أَوْ قَالَ \" اذْهَبْ فَبِئْسَ الْخَطِيبُ أَنْتَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4981، يرد فيه ذكر من أطاع الله ورسوله. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Abi Dawud, no. 4981 (General Behavior (Kitab Al-Adab)), whose wording mentions whoever obeys God and His Messenger. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابی داؤد کی حدیث نمبر 4981، جس کے الفاظ میں جس نے اللہ اور اس کے رسول کی اطاعت کی کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Abi Dawud, n° 4981, dont le texte mentionne celui qui obéit à Dieu et à Son Messager. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Abi Dawud, n.º 4981, cuyo texto menciona quien obedece a Dios y a Su Mensajero. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
