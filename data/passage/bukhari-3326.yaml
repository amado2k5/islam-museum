label: { ar: "البخاري 3326 — خلق آدم", en: "Bukhari 3326 — the creation of Adam" }
text: "خلق الله آدم وطوله ستون ذراعاً، ثم قال: اذهب فسلم على أولئك من الملائكة فاستمع ما يحيونك، تحيتك وتحية ذريتك، فقال: السلام عليكم، فقالوا: السلام عليك ورحمة الله، فزادوه ورحمة الله"
summary:
  ar: "في كتاب بدء الخلق باب خلق آدم وذريته؛ تأسيس تحية الإسلام في قالب الخلقة الأولى، وقاعدة أن الداخل الجنة يكون على صورة آدم — نص آدم في الصحيح."
