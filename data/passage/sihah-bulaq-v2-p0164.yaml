text: |-
  *⁦(باب الهاء)⁩*
  ٤٢٢
  ولا خطر على قلب بشربهما أطلعتهم عليه وه) البوه طائريشبه اليوم الاأنه أصغر
  منه والاننى بوهة قال أبو عمرووهى البومة الصغيرة ويشبه بها الرجل الاحق قال
  امروالقيس
  أيا هذدلا تنكهى بوهة • عليه عقيقته أحسبا
  وقولهم صوفسة فى بوهة يرادبه الهباء المنثور الذى يرى فى الكوة ابن السكيت نابهت له
  وما بهت له أى ماقطنت له والباه مثال الجاملغة فى الباءة وهى الجهماع هه الأيه
  الامح واليهبهىّ الجسيم والبهياه فى الهدير مثل البخباخ قال رؤية يصف فلا
  رعاية يخشى تفوس الانه * برجس بهباه الهدير البهيه
  ويروى بخباخ الهدير .
  صل التء . الاصمعى الترّهات الطرق الصغار غير الجادة تتشعب
  عنها الواحدة زهة فارسى معرب ثم استعير فى الباطل فقبل الترهات البسابس والترهات
  الصحاصح وهو من أسماء الباطل وربماجاء مضافا وناس يقولون تره والمع تراريه وأنشدوا
  ردوابى الاعرج ابلى من كتب • قبل التراريه وبعد المطلب
  ( (تفه التافه الحقير اليسير وقدتفه وفى الحديث فى ذكر القرآن لايتفه ولا يتشان
  ه ته الطعام بالكسر تهافسد وقال أبو الجرّاح ته اللحم تماهة وهو مثل الزهومة
  وتمه اللين تغيرت راتحته والتمه فى اللبن كالنهس فى الدسم وشاة متماه يتمه لبنها اذاحلب
  هته التهتهة مثل اللكنة والتهاته الاياطيل والترتهات قال القطافى
  ولم يكن ما ابتلينا من مواعدها • الاالتهانه والامنية الستما
  يه تاهيتيه تيها وهوأتيه الناس وتاه فى الارض أى ذهب متحيرايتيه تيها
  وتيهانا وتبه :فسه وتوه بمعنى أى حبرها وطوّحها وما أتبهه وأتوهه وتاه أى تكبروما أتيه
  فلانا وما أطيخه والتيه المفازة يتاه فيها والجمع أيتداه وأتاويه وفلاة تيهاء وأرض متبهة مثال
  معيشة وأصل مفعلة
  صل الجيم به الجبهسة للانسان وغيره ورجسل أجبه بين الجبه أى عظيم
  الجبهة وامرأة جبهاء وبتصغيره سمى جبيها الاتيعى توالجهة جبهة الاسدوهى أربعة أنجم
  ينزلهنا القمر والجبهة الخيل وفى الحديت ليس فى الجبهة صدقة والجبهة من النساس الجماعة
  وجبهته صككت جبهته وجبهته بالمسكروه اذا استقبلته به وجبهنا الماء جبها وردناه وليست
  عليه أداة الاستقاء ابن السكيت يقال وردنا ماء له جميهة اما كان ملو افلم ينصح مالهم الشرب
  وامّا كان آجذا وامًا كان بعيد القعر غليظاسقيه شديدا أمره ⁦( جره)⁩. سمعت جراهية
  القوم أى جلبتهم وكلامهم علانية دون السرّ ( له الجلهة ما استقبالك من حروف
  الوادى وجلهتا الوادى ناحيتاه وحرفاه قال لبيذ
  فغلافروع الايهقان وأطفلت • بالجلهتين ظباؤها رنعامها
  والبهع جلاه وجلهت الحصى عن المكان نحيته عنه والموضع جليهة الاصعى "الجلد افحسار
  الشعر عن مقدم الرأس وهوابتداء الصلع مثل الجلح وقد جله يجله قال رؤية
