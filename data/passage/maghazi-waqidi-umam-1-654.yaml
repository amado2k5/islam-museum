text: "… فقلنا : من الحِجاز. فقال اليهودىّ : وَاشَوقاه إلى الحِجاز ! أَنا ابن الحارث اليهودىّ فارس خيابِر، قَتَلَه يوم خَيْبَر رجلٌ من أَصحاب محمّد يُقال له أَبو دُجانة يومَ نزل محمّد خَيْبِر، وكنَّا ممن أَجَلَى عمرُ بن الخطَّاب إلى الشام. …"
