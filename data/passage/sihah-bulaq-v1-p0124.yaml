  قال حيد لا يصطلى الذار الايجرا أرجا • قد كسرت من يلنجوحِ له وقصا
  ويقال وقص على نارك والوقص أيضا واحد الا وقاص فى الصدقة وهومابين التوريضتين
  نحوان تباغ الابل خمساففيها شاة ولاشئ فى الزيادة حتى تبلغ عشرا فجابين الهس الى العشر
