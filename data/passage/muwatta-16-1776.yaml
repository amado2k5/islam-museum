label: { ar: "الموطأ 1776 — عبد الله بن دينار: سأل رجل ابن عمر عن رضاعة الكبير، فحكى ابن عمر أن رجلا جاء عمر بن الخطاب يشكو أن امرأته أرضعت جاريته، فقال له عمر: أوجعها، وأت جاريتك، فإنما الرضاعة رضاعة الصغير", en: "Muwatta 1776", es: "Muwatta 1776", fr: "Muwatta 1776", ur: "موطا 1776", tr: "El-Muvatta 1776 — Abdullah bin Dinar: Bir adam İbn Ömer'e yetişkin birini emzirmek hakkında soru sordu ve İbn Ömer şöyle rivayet etti: Bir adam Ömer bin El-Hattab'a gelip karısının cariyesini emzirdiğinden şikayet etti. Ömer ona şöyle dedi: \"Onu emzir ve cariyenin yanına git, çünkü emzirme sadece bebekler içindir.\"", id: "Al-Muwatta 1776 — Abdullah bin Dinar: Seorang pria bertanya kepada Ibnu Umar tentang menyusui orang dewasa, dan Ibnu Umar menceritakan bahwa seorang pria datang kepada Umar bin Al-Khattab mengeluh bahwa istrinya telah menyusui budak perempuannya. Umar berkata kepadanya: \"Sikapi dia, dan pergilah ke budak perempuanmu, karena menyusui hanya untuk bayi.\"" }
text: "فَإنَّما الرَّضَاعةُ رَضَاعةُ الصَّغيرِ"
summary:
  ar: "يروي مالك عن عبد الله بن دينار أنه قال: جاء رجل إلى عبد الله بن عمر، وأنا معه عند دار القضاء، يسأله عن رضاعة الكبير. فقال ابن عمر: جاء رجل إلى عمر بن الخطاب فقال: إني كانت لي وليدة، وكنت أطؤها، فعمدت امرأتي إليها فأرضعتها، فدخلت عليها، فقالت: دونك، فقد والله أرضعتها. فقال عمر: أوجعها، وأت جاريتك، فإنما الرضاعة رضاعة الصغير. {cite:muwatta-maruf-1997 p.125}"
  tr: "Malik, Abdullah ibn Dinar'dan rivayetle şöyle der: \"Adalethanede onunla birlikteyken bir adam Abdullah ibn Ömer'e gelip yetişkin birini emzirmek hakkında soru sordu. İbn Ömer dedi ki: Adam Ömer ibn el-Hattab'a gelip şöyle dedi: 'Cinsel ilişkiye girdiğim bir cariyem vardı ve karım onu alıp emzirdi. Ben onun yanına gittim ve o da 'İşte buradasın, Allah'a yemin ederim onu emzirdim' dedi. Ömer dedi ki: 'Ona zarar ver ve cariyenin yanına git, çünkü emzirme sadece bebekler içindir.'\" {cite:muwatta-maruf-1997 s.125}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar bahwa ia berkata: Seorang pria datang kepada Abdullah ibn Umar, ketika saya bersamanya di gedung pengadilan, menanyakan tentang menyusui orang dewasa. Ibn Umar berkata: Seorang pria datang kepada Umar ibn al-Khattab dan berkata: Saya mempunyai seorang budak perempuan yang saya ajak berhubungan seksual, dan istri saya mengambilnya dan menyusuinya. Saya pergi kepadanya, dan dia berkata: Ini dia, demi Allah saya telah menyusuinya. Umar berkata: Sakiti dia, dan pergilah kepada budak perempuanmu, karena menyusui hanya untuk bayi. {cite:muwatta-maruf-1997 p.125}"
