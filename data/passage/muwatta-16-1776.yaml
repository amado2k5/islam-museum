label: { ar: "الموطأ 1776 — عبد الله بن دينار: سأل رجل ابن عمر عن رضاعة الكبير، فحكى ابن عمر أن رجلا جاء عمر بن الخطاب يشكو أن امرأته أرضعت جاريته، فقال له عمر: أوجعها، وأت جاريتك، فإنما الرضاعة رضاعة الصغير", en: "Muwatta 1776" }
text: "فَإنَّما الرَّضَاعةُ رَضَاعةُ الصَّغيرِ"
summary:
  ar: "يروي مالك عن عبد الله بن دينار أنه قال: جاء رجل إلى عبد الله بن عمر، وأنا معه عند دار القضاء، يسأله عن رضاعة الكبير. فقال ابن عمر: جاء رجل إلى عمر بن الخطاب فقال: إني كانت لي وليدة، وكنت أطؤها، فعمدت امرأتي إليها فأرضعتها، فدخلت عليها، فقالت: دونك، فقد والله أرضعتها. فقال عمر: أوجعها، وأت جاريتك، فإنما الرضاعة رضاعة الصغير. {cite:muwatta-maruf-1997 p.125}"
