label: { ar: "سنن النسائي 4197 — الأب والأبوة", en: "Sunan al-Nasa'i 4197 — the father and fatherhood", ur: "سنن نسائی 4197 — باپ اور والدیت", es: "Sunan al-Nasa'i 4197 — El padre y la paternidad" }
text: "… سَأَلْتُ سُهَيْلَ بْنَ أَبِي صَالِحٍ قُلْتُ حَدَّثَنَا عَمْرٌو، عَنِ الْقَعْقَاعِ، عَنْ أَبِيكَ، قَالَ أَنَا سَمِعْتُهُ مِنَ الَّذِي، حَدَّثَ أَبِي، حَدَّثَهُ رَجُلٌ، مِنْ أَهْلِ الشَّامِ يُقَالُ لَهُ عَطَاءُ بْنُ يَزِيدَ عَنْ تَمِيمٍ الدَّارِيِّ قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّمَا الدِّينُ النَّصِيحَةُ \". قَالُوا لِمَنْ يَا رَسُولَ اللَّهِ قَالَ \" لِلَّهِ وَلِكِتَابِهِ وَلِرَسُولِهِ وَلأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4197، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4197 (The Book of al-Bay'ah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4197، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4197 (El Libro de al-Bay'ah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
