label: { ar: "سنن ابن ماجه 3058 — الحرام", en: "Sunan Ibn Majah 3058 — the unlawful", ur: "سنن ابن ماجہ 3058 — حرام", es: "Sunan Ibn Majah 3058 – lo ilegal", fr: "Sunan Ibn Majah 3058 - l'illégal" }
text: "… \" أَىُّ يَوْمٍ هَذَا \". قَالُوا يَوْمُ النَّحْرِ. قَالَ \" فَأَىُّ بَلَدٍ هَذَا \". قَالُوا هَذَا بَلَدُ اللَّهِ الْحَرَامُ. قَالَ \" فَأَىُّ شَهْرٍ هَذَا \". قَالُوا شَهْرُ اللَّهِ الْحَرَامُ. قَالَ \" هَذَا يَوْمُ الْحَجِّ الأَكْبَرِ وَدِمَاؤُكُمْ وَأَمْوَالُكُمْ وَأَعْرَاضُكُمْ عَلَيْكُمْ حَرَامٌ كَحُرْمَةِ هَذَا الْبَلَدِ فِي هَذَا الشَّهْرِ فِي هَذَا الْيَوْمِ \". ثُمَّ قَالَ \" هَلْ بَلَّغْتُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3058، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Ibn Majah, no. 3058 (Chapters on Hajj Rituals), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3058، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 3058 (Capítulos sobre los rituales del Hajj), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Ibn Majah, n° 3058 (Chapitres sur les rites du Hajj), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
