  en: "Riyad al-Salihin 20 — The man who killed ninety-nine souls then repented"
  es: "Riyad al-Salihin 20 — El hombre que mató a noventa y nueve personas y luego se arrepintió"
  fr: "Riyad al-Salihin 20 — L'homme qui a tué quatre-vingt-dix-neuf personnes s'est ensuite repenti"
  ur: "ریاض الصالحین 20 - وہ شخص جس نے ننانوے جانوں کو قتل کیا پھر توبہ کر لی"
  tr: "Riyad es-Salihin 20 — Doksan dokuz kişiyi öldürdü ve sonra tövbe etti."
