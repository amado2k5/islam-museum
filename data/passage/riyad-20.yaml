text: "كَانَ فِيمَنْ كَانَ قَبْلَكُمْ رَجُلٌ قَتَلَ تِسْعَةً وَتِسْعِينَ نَفْسًا۔ فَسَأَلَ عَنْ أَعْلَمِ أَهْلِ الأَرْضِ، فَدُلَّ عَلَى رَاهِبٍ۔ فَأَتَاهُ فَقَالَ إِنَّهُ قَتَلَ تِسْعَةً وَتِسْعِينَ نَفْسًا فَهَلْ لَهُ مِنَ تَوْبَةٍ۔ فَقَالَ لاَ، فَقَتَلَهُ فَكَمَّلَ بِهِ مِائَةً۔ ثُمَّ سَأَلَ عَنْ أَعْلَمِ أَهْلِ الأَرْضِ،…"
