label: { ar: "موطأ مالك 589 — اليتيم وفقد الأب", en: "Muwatta Malik 589 — the orphan and the father lost", ur: "موطأ مالک 589 — یتیم اور باپ کی موت", es: "Muwatta Malik 589 — el huérfano y el padre perdido", fr: "Muwatta Malik 589 — l'orphelin et le père perdus", tr: "Muwatta Malik 589 — Yetim ve Babanın Kaybı", id: "Muwatta Malik 589 — Anak Yatim dan Kehilangan Ayah" }
text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، أَنَّهُ بَلَغَهُ أَنَّ عُمَرَ بْنَ الْخَطَّابِ، قَالَ اتَّجِرُوا فِي أَمْوَالِ الْيَتَامَى لاَ تَأْكُلُهَا الزَّكَاةُ."
summary:
  ar: "حديث في موطأ مالك، رقم 589، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 589 (Zakat), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 589، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 589 (Zakat), menciona al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la paternidad."
  fr: "Un rapport du Muwatta Malik, n° 589 (Zakat), mentionne l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Malik'in Muwatta adlı eserinde 589 numaralı hadis, yetimlerden ve babasızlık durumundan bahsetmektedir. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 589, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Hadits ini dikumpulkan oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
