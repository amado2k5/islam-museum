text: "… بالجهد تهضم معدتي هذا استحضر تيمور لنك ذات يوم حاكم مدينة آَقَ شَهْرْ لمُصادرة أمواله، بحُجةِ أنَّهُ اختلس مِنَ الأموال الأميريةِ مبالغ طائلةً، فأبرز الرجل حساباتِهِ المكتوبة على أوراق صفيقة، كانت تستعمل في ذلك الزمان فيأتي بها من بلاد الإفرنج …"
summary:
  ar: "استدعى تيمور لنك حاكم آق شهر واتهمه بالاختلاس ومزق دفاتره وأجبره على بلعها، ثم صادر أمواله وسلّم جحا أموال الدولة، وعند نهاية الشهر قدّم جحا الدفتر مكتوباً على الخبز المسطح، فابتسم تيمور لنك، فقال جحا إنه كبير في السن ولا بد أن يهضمه بجهد. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  en: "Timur summons the Akshehir governor, accuses him of embezzlement, tears up his ledgers and forces him to swallow them, then confiscates his property and gives Juha the state funds; at the end of the month Juha presents the ledger written on flatbread; Timur smiles; Juha says he is old and must digest it with effort. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  ur: "تیمور لنگ نے آق شہر کے حاکم کو طلب کر کے اس پر غبن کا الزام لگایا، اس کے کھاتے پھاڑ دیے اور اسے انہیں نگلنے پر مجبور کیا، پھر اس کی جائیداد ضبط کر لی اور سرکاری خزانہ جحا کے سپرد کر دیا، مہینے کے آخر میں جحا نے روٹی پر لکھا ہوا کھاتا پیش کیا، تیمور لنگ مسکرایا، اور جحا نے کہا کہ وہ بوڑھا ہے اور اسے محنت سے ہضم کرنا پڑے گا۔ {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  fr: "Timur convoque le gouverneur d'Akshehir, l'accuse de détournement, déchire ses registres et le force à les avaler, puis confisque ses biens et remet à Juha les fonds de l'État ; à la fin du mois, Juha présente le registre écrit sur du pain plat ; Timur sourit ; Juha dit qu'il est vieux et devra le digérer avec peine. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
  es: "Timur convoca al gobernador de Akshehir, lo acusa de malversación, rompe sus libros de cuentas y lo obliga a tragárselos; luego confisca sus bienes y entrega a Juha los fondos del Estado; a fin de mes, Juha presenta el libro escrito sobre pan plano; Timur sonríe; Juha dice que es viejo y tendrá que digerirlo con esfuerzo. {cite:juha-nawadir-kubra-djuwaydi p. 156}"
