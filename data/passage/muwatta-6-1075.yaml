label: { ar: "الموطأ 1075 — أبو الزبير المكي: رأيت عبد الله بن عباس يطوف بعد صلاة العصر، ثم يدخل حجرته فلا أدري ما يصنع", en: "Muwatta 1075", es: "Muwatta 1075", fr: "Muwatta 1075", ur: "موطا 1075", tr: "El-Muvatta 1075 — Ebu el-Zübeyr el-Mekki: Abdullah ibn Abbas'ı ikindi namazından sonra Kâbe'nin tavafını yaparken gördüm, sonra odasına girdi ve ne yaptığını bilmiyorum.", id: "Al-Muwatta 1075 — Abu al-Zubayr al-Makki: Aku melihat Abdullah ibn Abbas melakukan tawaf di sekitar Ka'bah setelah salat Asar, kemudian dia masuk ke kamarnya, dan aku tidak tahu apa yang dia lakukan." }
summary:
  ar: "يرويه مالك عن أبي الزبير المكي أنه قال: رأيت عبد الله بن عباس يطوف بعد صلاة العصر، ثم يدخل حجرته، فلا أدري ما يصنع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1298) وسويد (555) ويحيى بن بكير عند البيهقي (5/91). {cite:muwatta-maruf-1997 p.495}"
  tr: "Malik, Ebu el-Zübeyr el-Mekki'den rivayet ederek şöyle demiştir: \"Abdullah ibn Abbas'ı ikindi namazından sonra Kâbe'nin tavafını yaparken gördüm, sonra odasına girdi ve ne yaptığını bilmiyorum.\" Editör, bunun Malik'ten Ebu Musab (1298), Süveyd (555) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki'nin (5/91) kaydettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.495}"
  id: "Malik meriwayatkan hadits ini dari Abu al-Zubayr al-Makki, yang berkata: “Aku melihat Abdullah ibn Abbas melakukan tawaf di sekitar Ka'bah setelah shalat Ashar, kemudian ia masuk ke kamarnya, dan aku tidak tahu apa yang dilakukannya.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (1298), Suwaid (555), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi (5/91). {cite:muwatta-maruf-1997 p.495}"
