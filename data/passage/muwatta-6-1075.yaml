summary:
  ar: "يرويه مالك عن أبي الزبير المكي أنه قال: رأيت عبد الله بن عباس يطوف بعد صلاة العصر، ثم يدخل حجرته، فلا أدري ما يصنع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1298) وسويد (555) ويحيى بن بكير عند البيهقي (5/91). {cite:muwatta-maruf-1997 p.495}"
