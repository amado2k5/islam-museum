text: "… مَنْ قُطِعَتْ رجلُهُ لا تُقْطَعُ رأسهُ أصابَ ظالماً من امرأتِهِ غدرٌ شنيعْ، فأضمرَ الظالمُ عداوةَ النساءِ عامَّة، وكان يُحضِرُ العلماءَ والعارفين، ويهمسُ في آذانِهم شيئاً، فإذا أجابه أحدُهم بغير ما يرضى يقطع رأسه، فعجزوا عن حيلةٍ لمنع ظلمهِ الفادح، فأشاروا …"
summary:
  ar: "تعرّض طاغية لخيانة شنيعة من زوجته فكره النساء، وأحضر العلماء وهمس لهم، فمن أجاب خطأ قُطع رأسه؛ فسُئل جحا أمتزوج هو أم أعزب، فقال إن من بلغ عمره يبقى أعزب؟ فأمر الطاغية بقتله؛ فقال جحا أن يُسأل هل طلّق وتزوج، وذكر المثل القائل إن الحيوان الذي قُطعت رجله لا يُقطع رأسه. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  en: "A tyrant who has suffered a foul betrayal by his wife comes to hate women and has scholars brought, whispering to them; those who answer wrongly are beheaded; Juha is asked whether he is married or single, and says that one who reaches his age stays single, adding it as a question; the tyrant orders him killed; Juha says to ask him whether he divorced and remarried, and cites the proverb that an animal whose leg is cut is not cut at the head. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  ur: "ایک ظالم حکمران کو بیوی سے سخت بے وفائی کا صدمہ پہنچا تو اسے عورتوں سے نفرت ہو گئی؛ اس نے علماء کو بلا کر ان کے کان میں کچھ کہا، اور جو غلط جواب دیتا اس کا سر کاٹ دیا جاتا؛ جحا سے پوچھا گیا کہ شادی شدہ ہو یا کنوارے، تو اس نے سوال کے انداز میں کہا کہ جو اس عمر کو پہنچے وہ کنوارا رہتا ہے؟ حکمران نے اسے قتل کرنے کا حکم دیا؛ جحا نے کہا کہ اس سے پوچھ لو کہ طلاق دے کر دوبارہ شادی کی تھی یا نہیں، اور کہاوت سنائی کہ جس جانور کی ٹانگ کٹ جائے اس کا سر نہیں کاٹا جاتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  fr: "Un tyran, cruellement trahi par sa femme, se met à haïr les femmes et fait venir des savants, à qui il chuchote; ceux qui répondent mal sont décapités; on demande à Juha s'il est marié ou célibataire, et il dit, sur le ton de la question, que celui qui atteint son âge reste célibataire; le tyran ordonne de le tuer; Juha dit de lui demander s'il a divorcé puis s'est remarié, et cite le proverbe selon lequel on ne coupe pas la tête d'une bête dont on a coupé la patte. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  es: "Un tirano, cruelmente traicionado por su mujer, llega a odiar a las mujeres y hace traer a unos sabios, a quienes susurra algo; a los que responden mal les cortan la cabeza; le preguntan a Juha si es casado o soltero, y dice, en tono de pregunta, que quien llega a su edad sigue soltero; el tirano ordena matarlo; Juha dice que le pregunten si se divorció y volvió a casarse, y cita el proverbio de que al animal al que se le cortó la pata no se le corta la cabeza. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
  tr: "Bir tiran, karısı tarafından korkunç bir şekilde ihanete uğradığı için kadınlardan nefret ediyordu. Alimleri çağırdı ve onlara fısıldayarak, yanlış cevap veren herkesin başını keseceğini söyledi. Juha'ya evli mi yoksa bekar mı olduğu soruldu ve o da kendi yaşındaki birinin bekar kaldığını söyledi. Tiran onu öldürme emri verdi, ancak Juha, bacağı kesilmiş bir hayvanın başının kesilmeyeceği atasözünü hatırlatarak, boşanıp yeniden evlenip evlenmediğini sormayı önerdi. {cite:juha-nawadir-kubra-djuwaydi s. 63}"
  id: "Seorang tiran dikhianati secara mengerikan oleh istrinya, sehingga ia membenci wanita. Ia memanggil para cendekiawan dan berbisik kepada mereka, mengancam akan memenggal kepala siapa pun yang menjawab salah. Juha ditanya apakah ia sudah menikah atau masih lajang, dan ia menjawab bahwa seseorang seusianya masih lajang. Sang tiran memerintahkan agar ia dibunuh, tetapi Juha menyarankan untuk bertanya apakah ia telah bercerai dan menikah lagi, dengan mengutip pepatah bahwa hewan yang kakinya telah dipotong tidak akan dipotong kepalanya. {cite:juha-nawadir-kubra-djuwaydi p. 63}"
