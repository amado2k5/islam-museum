label: { ar: "الموطأ 2486 — سعيد بن المسيب: في الشفتين الدية كاملة، وفي السفلى ثلثاها", en: "Muwatta 2486", es: "Muwatta 2486", fr: "Muwatta 2486", ur: "موطا 2486", tr: "El-Muvatta 2486 — Sa’id ibn al-Musayyab: Her iki dudak için de kan parasının tamamı, alt dudak için ise üçte ikisi ödenmelidir.", id: "Al-Muwatta 2486 — Sa’id ibn al-Musayyab: Untuk kedua bibir, uang ganti rugi darah harus dibayarkan penuh, dan untuk bibir bawah, dua pertiganya." }
summary:
  ar: "يروي مالك عن ابن شهاب عن سعيد بن المسيب أنه كان يقول: في الشفتين الدية كاملة، فإذا قُطعت السفلى ففيها ثلثا الدية. {cite:muwatta-maruf-1997 p.426}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn al-Musayyab'dan rivayetle şöyle buyurduğunu aktarır: \"Her iki dudak için de tam kan parası ödenir, fakat alt dudak kesilirse kan parasının üçte ikisi ödenir.\" {cite:muwatta-maruf-1997 s.426}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Sa'id ibn al-Musayyab, bahwa beliau biasa berkata: \"Uang darah penuh harus dibayarkan untuk kedua bibir, tetapi jika bibir bawah dipotong, maka dua pertiga dari uang darah harus dibayarkan.\" {cite:muwatta-maruf-1997 p.426}"
