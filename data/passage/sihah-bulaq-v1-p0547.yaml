text: |-
  قوله قلبا واحد اعبارة الازهرى
  قلدا واحدايعنى ما كان مفتولا
  من طاق واحد لا من طاقين ا
  مختار
  ⁦(٢)⁩ يعنى قبل أن تبى بالجارة
  ونحوها اه مختار
  ⁦(باب البا٠)⁩
  تعالى ان فى ذلا لذ كرى لمن كان له قلب أى عقل وقلبت الشئ فانقلب أى انمكب والمنقاب
  يكون مكاناو يكون مصدرامشل المنصرف وقلبته بيدى تقليبا وتقلب الشئ ظهرا
  لبطن كالحيسة تتقلب على الرمضاء وقلبت القوم كمانة ول صرفت الصبيان عن ثعاب وقلبته
  أى أصيت قاده وقليت النخلة تزعت قلبها وقليت السرة ادا احرت والقلب بالتحريك انقلاب
  الشفة رجل أقلب وشفة قلياء بنة القلب وأقلبت الخيزة اذاحان لها أن تقلب قال الاصمعى
  القسلاب داء باخذ البعير فيشتكى منه قلبه فيموت من يومه يقال بعبرماوب وقد قاب
  قلابا وناقة مقلوبة وأقلب الرجل اذا أصاب ابلٰه ذلك وة واهسم مابه قلبة أى ليست بهعله قال
  : الفرّاهو مأخوذ من القلاب قال النمرين تواب
  أودى الشباب وحب انطالة الخلبه * وقدبرتت فا بالقلب من قلبهV
  أى برتت من داء الحب وقال ابن الاعسرابعة معناه ليست يدعسلة يقلب لها فينظر اليه
  قال حيد الارقط وذكر فرسا
  ولم يقلب أرضها البيطار • ولالجبليه بها حبار
  أى لم يقلب قواعها من علة بها وقلب العة رب منزل من منازل القمر وهو كوكب نبر وبجانبيه
  كوكان وقواهم «وعربى قلب أى خالص يسستوى فيه المذكر والمؤنث وابهع وان شئت قلت
  امرأة عربية قلبة وثنيت وجعت وقلب النخلة لبها وفيه ثلاث لغات قلب وقلب وقلب والجمع
  القلبة . والقلب من السوارما كان قلبا واحدا والقلب أيضاحية تشبه به والمقاب الحديدة
  التى تقلب بها الارض للزراعة وقولهم هو -ول قلب أى محتال بصير بتقليب الامود
  والقليب مثال السكين الذئب وكذلك القلوب مثل الخنوص قال الشاءر
  أبا أمة بكى على أم واهب • اكيلة قلوب باحدى المذائب
  والقالب بالفتح قالب الخف وغيره والقالب بالكسر البسر الاحر والقليب البئر قبل أن
  تطوى ٢ ت كروتونث وقال أبو عبيد هى البتر العادية القديمة وجمع القلة أقلبة قال عنترة
  بصف جعلا
  كأن ؤشر العضدين حجلا • (هدوجابين أقلبة ملاح
  والكفير قلب قال الشاعر
  وما دام غيث من تهامة طيب بهاقلب عادية وكراز وقد شبه العجاج بماالجراحات فقال
  عن قلب ضجم تورتى من سبر • وأبو قلابة رجل من الحدّثين ⁦(قنب)⁩ القنب وعاءقضيب
  الفرس وغيره من دوات الحاذر والقنيب جاعات الناس والمقنب ما بين الملاثين الى الاربعيز
  من الخيل والمقنب أيضاشئ يكون مع الصائد يجعل فيه ما يصيده حكاه أبو عسيد فى المصنف
  عن القنانى والقنب الابق عربى صحيح قال ابن دريد قنب الزرع تقتيبا اذا أعصف قال وتسمى
  التعصيفة القناية والعصفة الورق المجتمع الذى يكون فيه السنبل ⁦( وب)⁩ قبت الارض
  اقوما اذاحفرت فيها حفرة مقوّرة فانقابت هى وقويت الارض نقويبامثله وتقوب الشئ
  اذا انقلع من أصله وقاب الطائر بيضه أى فلقها فانقابت البيضة وتقوبت بعنى وتقوّب من
  رأسه مواضع أى تقشر والاسود المتقوب هوالذى سلخ جلده من الحيات وقولهسم
  فى المندل برئت قائبة من قوب فالقائبة البيضة والقوب بالضم الفرخ قال أعرابة من بنى
