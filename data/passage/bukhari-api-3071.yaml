label: { ar: "صحيح البخاري 3071 — الأب والأبوة", en: "Sahih al-Bukhari 3071 — the father and fatherhood", ur: "صحیح بخاری 3071 — باپ اور والدیت", es: "Sahih al-Bukhari 3071 — El padre y la paternidad", fr: "Sahih al-Bukhari 3071 — le père et la paternité" }
text: "حَدَّثَنَا حِبَّانُ بْنُ مُوسَى، أَخْبَرَنَا عَبْدُ اللَّهِ، عَنْ خَالِدِ بْنِ سَعِيدٍ، عَنْ أَبِيهِ، عَنْ أُمِّ خَالِدٍ بِنْتِ خَالِدِ بْنِ سَعِيدٍ، قَالَتْ أَتَيْتُ رَسُولَ اللَّهِ مَعَ أَبِي وَعَلَىَّ قَمِيصٌ أَصْفَرُ، قَالَ رَسُولُ اللَّهِ \" سَنَهْ سَنَهْ \". قَالَ عَبْدُ اللَّهِ وَهْىَ بِالْحَبَشِيَّةِ حَسَنَةٌ. قَالَتْ فَذَهَبْتُ أَلْعَبُ بِخَاتَمِ النُّبُوَّةِ، فَزَبَرَنِي أَبِي قَالَ رَسُولُ اللَّهِ \" دَعْهَا \". …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3071، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3071 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3071، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3071 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3071 (Le combat pour la cause d'Allah (Jihad)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
