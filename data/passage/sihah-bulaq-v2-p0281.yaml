text: |-
  ٣٠٦
  • ⁦(فصل الضاد)⁩.
  .⁦(فنحم)⁩.
  قال أبو عبيدوكان صميم خيله يومئذ معاوبة أخو خنساء قتله دريد وهاشم ابنارملة المريان
  والصماء من الارض الغدفلة والصمانء وضع الى جنب رمل عالج والصمصام والصمصامة
  السيف الصارم الذى لا ينثني والصحصام اسم سيف عمروبن معد يكوب وقال
  خلل لم أخنه ولم يخنى • على الصحصافة السيف السلام
  وصمم فى السيروغيره أى مضى قال حيد
  وحصحص فى صم الصفائقناته • وناه بسلى نوأة ثم صحما
  وصمم أى عض" ونيب فلم يرسل ماعض وصمم السيف اذامضى فى العظم وقطعه فاما اذا أصاب
  الفصل وقطعه يقال طبق قال الشاعر يصف سيفا * يصهم أحيانا وحينا يطبق * وأصمه الله
  سجانه فهم وأصمّ أيضابعنى صم قال الكميت نسائل ما أصم عن السؤل • يقول
  نسائل شيأقدصم عن السؤال وأصممته وجدته أسم" وتصامّ أرى من نفسه أنه أصم"
  وليس به ورجل صخصم بالكسر أى غليظ وبقال هو الجرى«الماضى وقولهسم صمت حصاة
  بدم أى أنّ الدماء كثرت حتى لوألقيت حصاة لم يسمع لها وقع لانها لاتقع على الارض وه_ذا
  المعنى أرادامروا اقدمر:قوله *صحى ابنة الجبل* ويقال أراد الصدى ⁦(صم)⁩ الصنم
  واحد الاصنام يقال انه معرّب شمن وهوالوثن ⁦(صهم)⁩ الصهميم انلخالص فى الخير
  والشرّمثل الصميم والهاء عندى زائدة وأنشد أبو عبيد للمخيس
  انّ تيما خلقت ملوما * مثل الصفالاتشنكى الكلوما
  قوماترى واحدهم صهمها • لاراحم الناس ولامر حوما
  والصه-ميم السي الخلق من الابل والصهميم الذى لايئنى عن مراده ⁦(صوم)⁩. قال
  الخليل الصوم قيام بلاعمل والصوم الامساك عن الطعم وقد صام الرجل صوما وصياما وقوم
  موم بالتشديد وصيم أيضا ورجسل صومان أى صائم وصام الفرس صوما أى قام على غير
  اعتلاف قال الفابغة الذيانى
  خيل صيام وخييل غير صائمه • تحت العجاج وأخرى تعلك اللجما
  وصام النهارصوما اذا قام قائم الظهيرة واعتدل والصوم ركود الريخ ومصام الفرس
  ومصامته موقفه وقال • كأنّ الترياعلقت فى مصامها• وقوله• والبكرات شرهن الصائمه
  يعنى اانى لا تدور وقوله تعالى انى نذرت للرحن صوما قال ابن عباس رضى اللّٰه عنهما صمبتا
  وقال أبو عبيدة كل ممسك عن طعام أوكلام أوسيرفهوصائم والصوم ذرق النعامة والصوم
  البيعة والصوم وجر فى اغة هذيل
  الضيتم الاسدمثل الضيغم أبدل غينه ناء وفى أصحاب الاشتقاق من يقول هو الضبثم بالباه
  وهو من الصبث وهو القبض والميم زائدة يجم الضجم العوج وتضاجم الامس بيتهم
  اذا اختلف والفجم أن عل الإنف الى أحدباني الوجه والرجل أفجم والضجم أيضا
  اعوجاج أحد المنكيين والمتضاجم المعوج الفم وقال • وفروة ثفر الثورة المتضاجم
  وضبيعة أطجم قوم من العوب (ضخم الضخم الغليظ من كل شى والاتى ضخمة والجمع
  نحمات
