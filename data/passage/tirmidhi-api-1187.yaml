text: "… الْوَهَّابِ أَنْبَأَنَا أَيُّوبُ عَنْ أَبِي قِلاَبَةَ عَمَّنْ حَدَّثَهُ عَنْ ثَوْبَانَ أَنَّ رَسُولَ اللَّهِ قَالَ \" أَيُّمَا امْرَأَةٍ سَأَلَتْ زَوْجَهَا طَلاَقًا مِنْ غَيْرِ بَأْسٍ فَحَرَامٌ عَلَيْهَا رَائِحَةُ الْجَنَّةِ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ. وَيُرْوَى هَذَا الْحَدِيثُ عَنْ أَيُّوبَ عَنْ أَبِي قِلاَبَةَ عَنْ أَبِي أَسْمَاءَ عَنْ ثَوْبَانَ. وَرَوَاهُ بَعْضُهُمْ عَنْ أَيُّوبَ بِهَذَا الإِسْنَادِ وَلَمْ يَرْفَعْهُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1187، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1187 (The Book on Divorce and Li'an), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1187، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
