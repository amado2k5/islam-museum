label: { ar: "مسلم 2321 — لم يكن فاحشاً ولا متفحشاً", en: "Muslim 2321 — He was neither foul nor given to obscenity", es: "Musulmán 2321 — No era ni vil ni dado a la obscenidad.", fr: "Muslim 2321 — Il n'était ni grossier ni obscène", ur: "مسلم 2321 - وہ نہ تو بدتمیز تھا اور نہ ہی فحاشی کی طرف", tr: "Müslim 2321 — O ne müstehcen ne de kaba idi.", id: "Muslim 2321 — Dia tidak cabul atau vulgar" }
text: "دخلنا على عبد الله بن عمرو حين قدم معاوية إلى الكوفة، فذكر رسول الله فقال: لم يكن فاحشاً ولا متفحشاً، وقال: «إن من خياركم أحاسنكم أخلاقاً»"
summary:
  ar: "رواية عبد الله بن عمرو في باب تبشمه وحسن عشرته من كتاب الفضائل في صحيح مسلم؛ شهادة قريبة على خلق النبي — لا فحش ولا تفحش وأن خيار الناس أحاسنهم أخلاقاً."
  tr: "Sahih Müslim'deki Faziletler Kitabı'nda yer alan, Abdullah bin Amr'ın neşesi ve iyi arkadaşlığı hakkındaki bölümdeki rivayeti, Peygamberimizin karakterine -ne müstehcen ne de kaba- ve en iyi ahlaka sahip olanların en hayırlı insanlar olduğuna dair yakın bir şahitliktir."
  id: "Riwayat Abdullah bin Amr dalam bab tentang keceriaan dan pergaulan baiknya dari Kitab Keutamaan dalam Sahih Muslim merupakan kesaksian yang dekat dengan karakter Nabi—tidak cabul atau vulgar, dan bahwa orang terbaik adalah orang yang memiliki akhlak terbaik."
