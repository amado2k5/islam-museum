label: { ar: "مسلم 2321 — لم يكن فاحشاً ولا متفحشاً", en: "Muslim 2321 — He was neither foul nor given to obscenity" }
text: "دخلنا على عبد الله بن عمرو حين قدم معاوية إلى الكوفة، فذكر رسول الله فقال: لم يكن فاحشاً ولا متفحشاً، وقال: «إن من خياركم أحاسنكم أخلاقاً»"
summary:
  ar: "رواية عبد الله بن عمرو في باب تبشمه وحسن عشرته من كتاب الفضائل في صحيح مسلم؛ شهادة قريبة على خلق النبي — لا فحش ولا تفحش وأن خيار الناس أحاسنهم أخلاقاً."
