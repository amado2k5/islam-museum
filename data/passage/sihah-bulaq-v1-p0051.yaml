  ورابعتنى تحت ليسل ضارب • بساء_دفعم وكف خاضب
  ومربع أيضا اسم رجل قال جرير
  زعم الفرزدق أن سيقتل حر بها * أبشر إطول سلامة ياهربع
  قال الكسائى يقال عاملته مرابعة كمابقال مصايفة ومشاهرة وقولهم الناس على ربعاتهم
