  قوله من رواس هو أبو دواد
  يقال مرّ البعيرير تبع اذاضرب بوائمه كاها قال رحل من رواس بن عامر بن صعصعة
  واعرورت العلط العرضى تركضه • أم الفوارس بالديداء والربعه
  الرواسى اه
  والربعة أيضاحى من أسد والربعة بالتسكين جونة العطار ويقال أيضارجل ربعه أى
  مربوع انخلق لاطويل ولا قصيروامرأة ربعة وججعهاجميعا ربعات بالتحريك وهوشاذلات
