  والرباعة أيضاغحو من الحمالة والرباعية عثل الثمائية السن التى بين الثنية والناب وابهع
  رباعيات ويقال للذى يلقى رباعيه رباع مثال عمان فاذانصبت أتممت فقات ركبت برذونا
  رباعيا قال التجاج بصف حار اوحشيا رباعدامر ببها اوشوقبا والجمع ربيع مثل
