text: "… الشافعي. وهذه كراهة تنزيه إذا لم يكن معها محدث آخر، فإن ضم إليها أمر آخر من البدع المحرمة - كما هو الغالب منها في العادة - كان ذلك حراما من قبائح المحرمات، فإنه محدث وثبت في الحديث الصحيح أن كل …"
