text: "… قراءة الحمار بهذا المقدار أهدى بعضُهُم تيمور لنك حماراً جسيماً حسناً، فسُرّ بهذه الهديةِ، وطفق الحاضرون يمدحونه أمامَه، وكلِّ منهم يقول كلمة في وصفه، حتى أصعدوه إلى مرتبة مخلوق عجيب. وجاءت نوبةُ الكلام على الشيخ، فقال: أرى أن هذا المخلوقَ …"
summary:
  ar: "أُهدي إلى تيمور لنك حمار جميل فأثنى عليه الناس وطلب من جحا أن يعلمه القراءة، فطلب جحا ثلاثة أشهر وراتباً، ودرب الحمار بإخفاء الشعير بين صفحات كتاب، فصار يقلب الصفحات وينهق، فقال جحا إن الحمار لا يقرأ إلا بهذا المقدار. {cite:juha-nawadir-kubra-djuwaydi p. 108}"
  en: "Given a handsome donkey, Timur is praised for it and asks Juha to teach it to read. Juha asks for three months and a stipend, and trains the donkey by hiding barley in the pages of a book. The donkey turns the pages and brays, and Juha says a donkey can read only this much. {cite:juha-nawadir-kubra-djuwaydi p. 108}"
  ur: "تیمور لنگ کو ایک خوب صورت گدھا تحفے میں ملتا ہے اور لوگ اس کی تعریف کرتے ہیں، تو وہ جحا سے کہتا ہے کہ اسے پڑھنا سکھائے۔ جحا تین مہینے اور وظیفہ مانگتا ہے اور کتاب کے صفحوں میں جو چھپا کر گدھے کو سدھاتا ہے۔ گدھا صفحے پلٹتا ہے اور ڈھینچوں ڈھینچوں کرتا ہے، تو جحا کہتا ہے کہ گدھا بس اتنا ہی پڑھ سکتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 108}"
  fr: "On offre à Timur un bel âne dont on le félicite, et il demande à Juha de lui apprendre à lire. Juha réclame trois mois et une allocation, et dresse l'âne en cachant de l'orge entre les pages d'un livre. L'âne tourne les pages et brait, et Juha dit qu'un âne ne peut pas lire plus que cela. {cite:juha-nawadir-kubra-djuwaydi p. 108}"
  es: "A Timur le regalan un hermoso burro y lo elogian por ello, y pide a Juha que le enseñe a leer. Juha pide tres meses y un estipendio, y adiestra al burro escondiendo cebada entre las páginas de un libro. El burro pasa las páginas y rebuzna, y Juha dice que un burro solo puede leer hasta aquí. {cite:juha-nawadir-kubra-djuwaydi p. 108}"
