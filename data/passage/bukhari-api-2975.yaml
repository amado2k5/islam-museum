text: "… عَنْ سَلَمَةَ بْنِ الأَكْوَعِ ـ قَالَ كَانَ عَلِيٌّ ـ تَخَلَّفَ عَنِ النَّبِيِّ فِي خَيْبَرَ، وَكَانَ بِهِ رَمَدٌ، فَقَالَ أَنَا أَتَخَلَّفُ عَنْ رَسُولِ اللَّهِ فَخَرَجَ عَلِيٌّ فَلَحِقَ بِالنَّبِيِّ، فَلَمَّا كَانَ مَسَاءُ اللَّيْلَةِ الَّتِي فَتَحَهَا فِي صَبَاحِهَا، فَقَالَ رَسُولُ اللَّهِ \" لأُعْطِيَنَّ الرَّايَةَ ـ أَوْ قَالَ لَيَأْخُذَنَّ ـ غَدًا رَجُلٌ يُحِبُّهُ اللَّهُ وَرَسُولُهُ ـ أَوْ قَالَ يُحِبُّ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2975، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 2975 (Fighting for the Cause of Allah (Jihaad)), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 2975، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
