label: { ar: "الموطأ 802 — عائشة: كانت إذا ذكرت أن النبي كان يقبّل وهو صائم تقول: وأيكم أملك لنفسه من رسول الله", en: "Muwatta 802", es: "Muwatta 802", fr: "Muwatta 802", ur: "موطا 802", tr: "Al-Muwatta 802 — Aişe: Peygamberin oruçluyken öpüştüğünü söylediğinde şöyle derdi: \"Sizden Allah'ın Resulü'nden daha çok nefsine hakim olan kim vardır?\"", id: "Al-Muwatta 802 — Aisyah: Ketika ia menyebutkan bahwa Nabi biasa berciuman saat berpuasa, ia berkata: Dan siapakah di antara kalian yang lebih mampu mengendalikan diri daripada Rasulullah?" }
text: "وأيكم أملك لنفسه من رسول الله"
summary:
  ar: "أول حديث في باب ما جاء في التشديد في القبلة للصائم. يروي مالك أنه بلغه أن عائشة زوج النبي كانت إذا ذكرت أن رسول الله كان يقبّل وهو صائم تقول: وأيكم أملك لنفسه من رسول الله. ويذكر المحقق أن هذه الرواية بالبلاغ، وأن المسند الجامع أحال على أحاديث في ذلك. {cite:muwatta-maruf-1997 p.394}"
  tr: "Oruçluyken öpüşmenin katılığı konusundaki bölümdeki ilk hadis. Malik, Peygamberimizin eşi Aişe'nin, Resulullah'ın oruçluyken öpüştüğünü anlatırken şöyle dediğini rivayet eder: \"Sizden kim Resulullah'tan daha çok kendine hakim olabilir?\" Editör, bu rivayetin kulaktan duyma olduğunu ve Musnad el-Cami'nin bu konuda hadislere atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.394}"
  id: "Hadits pertama dalam bab ini membahas tentang ketatnya berciuman saat berpuasa. Malik meriwayatkan bahwa ia mendengar Aisyah, istri Nabi, biasa berkata, ketika menyebutkan bahwa Rasulullah berciuman saat berpuasa: \"Dan siapakah di antara kalian yang lebih mampu mengendalikan diri daripada Rasulullah?\" Editor mencatat bahwa riwayat ini berdasarkan desas-desus, dan bahwa Musnad al-Jami' merujuk pada hadits-hadits tentang masalah ini. {cite:muwatta-maruf-1997 p.394}"
