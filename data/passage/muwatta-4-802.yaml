text: "وأيكم أملك لنفسه من رسول الله"
summary:
  ar: "أول حديث في باب ما جاء في التشديد في القبلة للصائم. يروي مالك أنه بلغه أن عائشة زوج النبي كانت إذا ذكرت أن رسول الله كان يقبّل وهو صائم تقول: وأيكم أملك لنفسه من رسول الله. ويذكر المحقق أن هذه الرواية بالبلاغ، وأن المسند الجامع أحال على أحاديث في ذلك. {cite:muwatta-maruf-1997 p.394}"
