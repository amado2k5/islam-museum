summary:
  ar: "القسم 42 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الاستئذان والآداب عن رسول الله»، ويضم فيها النصوص من 2688 إلى 2734 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 42 of Jami' al-Tirmidhi (Chapters on Seeking Permission) in the division of the open hadith dataset the museum took its reports from: reports 2688 to 2734 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 42، عنوان «کتاب الاستئذان والآداب عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2688 تا 2734۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 42 de Jami' al-Tirmidhi (Capítulos sobre la solicitud de permiso) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2688 al 2734, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 42 de Jami' al-Tirmidhi (Chapitres sur la demande de permission), qui comprend les hadiths 2688 à 2734 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
