label:
  ar: "أبو داود 5263 — من قتل وزغة في أول ضربة"
  en: "Abu Dawud 5263 — Who kills a gecko at the first stroke"
  ur: "ابو داود 5263 — جو وزغہ کو پہلی ضربت میں مارے"
  es: "Abu Dawud 5263 — ¿Quién mata a un gecko al primer golpe?"
  fr: "Abou Dawoud 5263 — Qui tue un gecko du premier coup"
  tr: "Ebu Davud 5263 — Kim bir kertenkeleyi ilk vuruşta öldürürse..."
  id: "Abu Dawud 5263 — Siapa pun yang membunuh cicak dengan serangan pertama"
text: "مَنْ قَتَلَ وَزَغَةً فِي أَوَّلِ ضَرْبَةٍ فَلَهُ كَذَا وَكَذَا حَسَنَةً، وَمَنْ قَتَلَهَا فِي الضَّرْبَةِ الثَّانِيَةِ فَلَهُ كَذَا وَكَذَا حَسَنَةً أَدْنَى مِنَ الأُولِ، وَمَنْ قَتَلَهَا فِي الضَّرْبَةِ الثَّالِثَةِ فَلَهُ كَذَا وَكَذَا حَسَنَةً أَدْنَى مِنَ الثَّانِيَةِ"
summary:
  ar: "في كتاب الأدب؛ عن أبي هريرة بلفظ مسلم: أجر متدرج لمن قتل الوزغة في الضربة الأولى ثم الثانية ثم الثالثة."
  en: "In the Book of General Behaviour, from Abu Hurayra in Muslim's wording: a graduated reward for killing the gecko at the first, then the second, then the third stroke."
  ur: "کتاب ادب میں ابو ہریرہ سے صحیح مسلم کے الفاظ پر: وزغہ پہلی، دوسری، تیسری ضربت میں مارنے پر کم تر اجر۔"
  es: "En el Libro de Comportamiento General, de Abu Hurayra, en palabras de Muslim: una recompensa gradual por matar al gecko al primer, luego al segundo y luego al tercer golpe."
  fr: "Dans le Livre du Comportement Général, d'après Abu Hurayra et selon Muslim: une récompense progressive pour avoir tué le gecko au premier, puis au deuxième, puis au troisième coup."
  tr: "Edebiyat kitabında, Ebu Hurayra'dan rivayetle, Müslim'in naklettiğine göre: Kertenkeleyi ilk vuruşta, sonra ikinci vuruşta, sonra da üçüncü vuruşta öldürenin sevabı kademeli olarak artar."
  id: "Dalam kitab sastra, berdasarkan riwayat Abu Hurairah, dengan redaksi Muslim: Ada pahala bertahap bagi orang yang membunuh cicak dengan serangan pertama, kemudian serangan kedua, lalu serangan ketiga."
