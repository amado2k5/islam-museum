text: "مَنْ قَتَلَ وَزَغَةً فِي أَوَّلِ ضَرْبَةٍ فَلَهُ كَذَا وَكَذَا حَسَنَةً، وَمَنْ قَتَلَهَا فِي الضَّرْبَةِ الثَّانِيَةِ فَلَهُ كَذَا وَكَذَا حَسَنَةً أَدْنَى مِنَ الأُولِ، وَمَنْ قَتَلَهَا فِي الضَّرْبَةِ الثَّالِثَةِ فَلَهُ كَذَا وَكَذَا حَسَنَةً أَدْنَى مِنَ الثَّانِيَةِ"
summary:
  ar: "في كتاب الأدب؛ عن أبي هريرة بلفظ مسلم: أجر متدرج لمن قتل الوزغة في الضربة الأولى ثم الثانية ثم الثالثة."
  en: "In the Book of General Behaviour, from Abu Hurayra in Muslim's wording: a graduated reward for killing the gecko at the first, then the second, then the third stroke."
  ur: "کتاب ادب میں ابو ہریرہ سے صحیح مسلم کے الفاظ پر: وزغہ پہلی، دوسری، تیسری ضربت میں مارنے پر کم تر اجر۔"
