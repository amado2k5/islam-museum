label: { ar: "تثبيت دلائل النبوة — الجزء الثاني، الباب ١٠، المقطع ٥ من ٧", en: "Tathbit Dala'il al-Nubuwwa — Part two, chapter 10, section 5 of 7", ur: "تثبیت دلائل نبوت — حصہ دوسرا، باب 10، حصہ 5" }
text: "لي حين ودعته: يا أبا عبد الله، هذان إماماك، فمن دعاك منهما فأجبه. فخرجت إلى اليمن، ومنها إلى مكة، ومنها اليكم إلى المغرب. وبلغنا أن الإمام قد مات وخلف ولده، وكانت الكتب تأتيني من هذين، وفيها بعض العلامات …"
summary:
  ar: "مقطع من الباب ١٠ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الثاني؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 10 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part two; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے دوسرے حصے کے باب 10 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
