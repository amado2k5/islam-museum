label: { ar: "سنن النسائي 2190 — الأب والأبوة", en: "Sunan al-Nasa'i 2190 — the father and fatherhood", ur: "سنن نسائی 2190 — باپ اور والدیت", es: "Sunan al-Nasa'i 2190 — El padre y la paternidad" }
text: "… عَبْدُ الْمَلِكِ بْنُ شُعَيْبِ بْنِ اللَّيْثِ بْنِ سَعْدٍ، قَالَ أَخْبَرَنِي أَبِي، عَنْ جَدِّي، قَالَ أَخْبَرَنِي شُعَيْبُ بْنُ إِسْحَاقَ، عَنِ الأَوْزَاعِيِّ، وَابْنِ أَبِي عَرُوبَةَ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ أَنَّهُ كَانَ يَقُولُ \" أَلاَ لاَ تَقَدَّمُوا الشَّهْرَ بِيَوْمٍ أَوِ اثْنَيْنِ إِلاَّ رَجُلٌ كَانَ يَصُومُ صِيَامًا فَلْيَصُمْهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2190، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2190 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2190، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2190 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
