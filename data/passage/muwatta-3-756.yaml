label: { ar: "الموطأ 756 — عمر في المجوس: ما أدري كيف أصنع في أمرهم؛ عبد الرحمن بن عوف: سمعت النبي يقول سنوا بهم سنة أهل الكتاب", en: "Muwatta 756" }
text: "سنوا بهم سنة أهل الكتاب"
summary:
  ar: "يرويه مالك عن جعفر بن محمد بن علي عن أبيه، أن عمر بن الخطاب ذكر المجوس فقال: ما أدري كيف أصنع في أمرهم؟ فقال عبد الرحمن بن عوف: أشهد لسمعت النبي يقول: سنوا بهم سنة أهل الكتاب. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي عند الجوهري، وينقل عن ابن عبد البر (التمهيد 2/114) أنه حديث منقطع لأن محمد بن علي لم يلق عمر ولا عبد الرحمن بن عوف، وأن رواية أبي علي الحنفي عن مالك بزيادة «عن جده» منقطعة أيضاً، ويضيف أن أخذ الجزية من مجوس هجر ثابت من حديث عبد الرحمن بن عوف عند البخاري (3157)، ويحيل على الترمذي (1586). {cite:muwatta-maruf-1997 p.375}"
