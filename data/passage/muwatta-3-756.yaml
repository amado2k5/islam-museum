label: { ar: "الموطأ 756 — عمر في المجوس: ما أدري كيف أصنع في أمرهم؛ عبد الرحمن بن عوف: سمعت النبي يقول سنوا بهم سنة أهل الكتاب", en: "Muwatta 756", es: "Muwatta 756", fr: "Muwatta 756", ur: "موطا 756", tr: "El-Muvatta 756 — Ömer, Mecusiler hakkında: Onlarla ne yapacağımı bilmiyorum; Abdülrahman ibn Avf: Peygamberin şöyle dediğini işittim: Onlara Kitap Ehli'ne davrandığınız gibi davranın", id: "Al-Muwatta 756 — Umar tentang kaum Majusi: Aku tidak tahu harus berbuat apa terhadap mereka; Abd al-Rahman ibn Awf: Aku mendengar Nabi bersabda: Perlakukan mereka seperti kalian memperlakukan Ahli Kitab." }
text: "سنوا بهم سنة أهل الكتاب"
summary:
  ar: "يرويه مالك عن جعفر بن محمد بن علي عن أبيه، أن عمر بن الخطاب ذكر المجوس فقال: ما أدري كيف أصنع في أمرهم؟ فقال عبد الرحمن بن عوف: أشهد لسمعت النبي يقول: سنوا بهم سنة أهل الكتاب. ويذكر المحقق أنه رواه عن مالك أبو مصعب والقعنبي عند الجوهري، وينقل عن ابن عبد البر ⁦(التمهيد 2/114)⁩ أنه حديث منقطع لأن محمد بن علي لم يلق عمر ولا عبد الرحمن بن عوف، وأن رواية أبي علي الحنفي عن مالك بزيادة «عن جده» منقطعة أيضاً، ويضيف أن أخذ الجزية من مجوس هجر ثابت من حديث عبد الرحمن بن عوف عند البخاري (3157)، ويحيل على الترمذي (1586). {cite:muwatta-maruf-1997 p.375}"
  tr: "Malik, Cafer ibn Muhammed ibn Ali'den, onun babasından rivayet ettiğine göre, Ömer ibn el-Hattab'ın Mecusilerden bahsettiğini ve \"Onlarla ne yapacağımı bilmiyorum\" dediğini aktarır. Abdurrahman ibn Avf ise, \"Peygamberin 'Onlara Kitap Ehli'ne davrandığınız gibi davranın' dediğini işittiğime şahitlik ederim\" demiştir. Araştırmacı, Ebu Musab ve el-Kanabi'nin bunu Malik'ten rivayet ettiğini ve bunun da el-Cevhari tarafından kaydedildiğini belirtir. İbn Abdülberr'in (el-Temhid 2/114) bunun bağlantısız bir hadis olduğunu, çünkü Muhammed ibn Ali'nin Ömer veya Abdurrahman ibn Avf ile görüşmediğini söylediğini aktarır. Ayrıca, Ebu Ali el-Hanefi'nin Malik'ten \"dedesinden rivayetle\" eklenmiş nakledilen hadisinin de bağlantısız olduğunu belirtir. Ayrıca, Hacer'in Mecusilerinden cizye alınmasının, Buhari'de (3157) Abdurrahman ibn Avf'ın hadisiyle sabit olduğunu ve Tirmizi'ye (1586) atıfta bulunduğunu ekliyor. {cite:muwatta-maruf-1997 s.375}"
  id: "Malik meriwayatkannya dari Ja'far ibn Muhammad ibn `Ali, yang juga dari ayahnya, bahwa `Umar ibn al-Khattab menyebutkan kaum Majusi dan berkata, “Aku tidak tahu harus berbuat apa terhadap mereka.” `Abd al-Rahman ibn `Awf berkata, “Aku bersaksi bahwa aku mendengar Nabi bersabda, ‘Perlakukan mereka seperti kalian memperlakukan Ahli Kitab.’” Peneliti menyebutkan bahwa Abu Mus`ab dan al-Qa`nabi meriwayatkannya dari Malik, sebagaimana dicatat oleh al-Jawhari. Ia mengutip Ibn `Abd al-Barr (al-Tamhid 2/114) yang mengatakan bahwa hadits ini tidak berkesinambungan karena Muhammad ibn `Ali tidak pernah bertemu dengan `Umar atau `Abd al-Rahman ibn `Awf. Ia juga menyatakan bahwa riwayat Abu `Ali al-Hanafi atas otoritas Malik, dengan tambahan “atas otoritas kakeknya,” juga terputus. Ia menambahkan bahwa pengambilan jizya dari kaum Majusi Hajar ditegaskan oleh hadits `Abd al-Rahman ibn `Awf dalam al-Bukhari (3157), dan ia merujuk pada al-Tirmidhi (1586). {cite:muwatta-maruf-1997 p.375}"
