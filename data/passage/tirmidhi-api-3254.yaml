text: "… فَقَالَ إِنَّ قَاصًّا يَقُصُّ يَقُولُ إِنَّهُ يَخْرُجُ مِنَ الأَرْضِ الدُّخَانُ فَيَأْخُذُ بِمَسَامِعِ الْكُفَّارِ وَيَأْخُذُ الْمُؤْمِنَ كَهَيْئَةِ الزُّكَامِ قَالَ فَغَضِبَ وَكَانَ مُتَّكِئًا فَجَلَسَ ثُمَّ قَالَ إِذَا سُئِلَ أَحَدُكُمْ عَمَّا يَعْلَمُ فَلْيَقُلْ بِهِ قَالَ مَنْصُورٌ فَلْيُخْبِرْ بِهِ وَإِذَا سُئِلَ عَمَّا لاَ يَعْلَمُ فَلْيَقُلِ اللَّهُ أَعْلَمُ فَإِنَّ مِنْ عِلْمِ الرَّجُلِ إِذَا سُئِلَ عَمَّا لاَ يَعْلَمُ أَنْ يَقُولَ اللَّهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3254، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 3254 (Chapters on Tafsir), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 3254، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
