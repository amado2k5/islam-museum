text: "… العاص - ويكنى بأبي أجنحة - رئيساً في قريش، يقال له ذو التاج، لأنه كان إذا اعتمَّ لا يعتمُ أحد يومئذٍ إعظاماً له، وكان سعيد هذا من عمال عمر على السواد، وجعله عثمان فيمن يكتب المصاحف لفصاحته، وكان أشبه الناس …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 4، ص 450، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 4, p. 450, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 4، ص 450 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
