label: { ar: "جامع الترمذي 2828 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Jami' al-Tirmidhi 2828 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "جامع ترمذی 2828 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Jami' al-Tirmidhi 2828 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos." }
text: "حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ عَلِيٍّ، قَالَ مَا سَمِعْتُ النَّبِيَّ جَمَعَ أَبَوَيْهِ لأَحَدٍ غَيْرَ سَعْدِ بْنِ أَبِي وَقَّاصٍ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2828، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2828 (Chapters on Manners), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2828، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2828 (Capítulos sobre las buenas maneras), menciona al padre y la paternidad, así como el respeto o la desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
