summary:
  ar: "قول لمالك في باب العمل في غسل يوم الجمعة: من اغتسل يوم الجمعة أول نهاره يريد غسل الجمعة فإن ذلك الغسل لا يجزئ عنه حتى يغتسل لرواحه، واحتج بحديث ابن عمر المتقدم: إذا جاء أحدكم الجمعة فليغتسل. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.159}"
