label: { ar: "الموطأ 1098 — مالك في رجل جهل فبدأ بالسعي بين الصفا والمروة قبل أن يطوف بالبيت: يرجع فيطوف ثم يسعى، وإن جهل حتى خرج من مكة فيرجع فيطوف ويسعى، وإن أصاب النساء فيرجع فيطوف ويسعى ويهدي", en: "Muwatta 1098" }
summary:
  ar: "قول لمالك في رجل جهل فبدأ بالسعي بين الصفا والمروة قبل أن يطوف بالبيت: ليرجع فليطف بالبيت، ثم ليسع بين الصفا والمروة. وإن جهل ذلك حتى خرج من مكة واستبعد، رجع إلى مكة فطاف وسعى. وإن كان أصاب النساء رجع فطاف وسعى حتى يتم ما بقي عليه من تلك العمرة، ثم عليه عمرة أخرى والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1322). {cite:muwatta-maruf-1997 p.503}"
