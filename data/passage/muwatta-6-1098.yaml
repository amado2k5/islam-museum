label: { ar: "الموطأ 1098 — مالك في رجل جهل فبدأ بالسعي بين الصفا والمروة قبل أن يطوف بالبيت: يرجع فيطوف ثم يسعى، وإن جهل حتى خرج من مكة فيرجع فيطوف ويسعى، وإن أصاب النساء فيرجع فيطوف ويسعى ويهدي", en: "Muwatta 1098", es: "Muwatta 1098", fr: "Muwatta 1098", ur: "موطا 1098", tr: "El-Muvatta 1098 — Malik, cahilliği nedeniyle Kâbe tavafından önce Safa ile Merve arasında Sa'i yapmaya başlayan bir adam hakkında şöyle demiştir: Geri dönmeli, tavaf yapmalı ve sonra Sa'i yapmalıdır. Eğer Mekke'den ayrılana kadar cahil kalmışsa, geri dönmeli, tavaf yapmalı ve sonra Sa'i yapmalıdır. Eğer kadınlarla cinsel ilişkiye girmişse, geri dönmeli, tavaf yapmalı, sonra Sa'i yapmalı ve kurban kesmelidir." }
summary:
  ar: "قول لمالك في رجل جهل فبدأ بالسعي بين الصفا والمروة قبل أن يطوف بالبيت: ليرجع فليطف بالبيت، ثم ليسع بين الصفا والمروة. وإن جهل ذلك حتى خرج من مكة واستبعد، رجع إلى مكة فطاف وسعى. وإن كان أصاب النساء رجع فطاف وسعى حتى يتم ما بقي عليه من تلك العمرة، ثم عليه عمرة أخرى والهدي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1322). {cite:muwatta-maruf-1997 p.503}"
  tr: "Malik, bilgisizlikten dolayı Kabe tavafından önce Safa ile Merve arasında sa'i (ritüel yürüyüş) yapmaya başlayan bir adam hakkında şöyle demiştir: \"Geri dönüp tavaf yapmalı, sonra Safa ile Merve arasında sa'i yapmalıdır. Eğer bunu Mekke'den ayrılana kadar bilmez ve bunun mümkün olmadığını anlarsa, Mekke'ye dönüp tavaf ve sa'i yapmalıdır. Eğer medeni bir ilişkisi varsa, geri dönüp tavaf ve sa'i yapmalı, o Umre'nin kalanını tamamlayana kadar devam etmeli, sonra başka bir Umre yapmalı ve kurban kesmelidir.\" Araştırmacı, bunun Malik'ten Ebu Musab (1322) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.503}"
  id: "Malik berkata mengenai seorang pria yang karena ketidaktahuannya memulai Sa'i (berjalan ritual) antara Safa dan Marwa sebelum melakukan Tawaf (mengelilingi Ka'bah): Ia harus kembali dan melakukan Tawaf, kemudian melakukan Sa'i antara Safa dan Marwa. Jika ia tetap tidak mengetahui hal ini sampai ia meninggalkan Mekah dan menyadari bahwa hal itu tidak mungkin, ia harus kembali ke Mekah dan melakukan Tawaf dan Sa'i. Jika ia telah menikah, ia harus kembali dan melakukan Tawaf dan Sa'i sampai ia menyelesaikan sisa Umrah tersebut, kemudian ia harus melakukan Umrah lagi dan mempersembahkan hewan kurban. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (1322). {cite:muwatta-maruf-1997 p.503}"
