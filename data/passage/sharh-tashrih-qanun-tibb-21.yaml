text: "… أكثر لأن هذه الأبخرة والأدخنة في رؤوسهن أزيد. ولذلك شعور رؤوسهن أطول. والله أعلم. الفصل الثالث تشريح ما دون القحف قال الشيخ الرئيس رحمة اللّٰه عليه وللرأس بعد هذا خمسة عظام... إلى آخر الفصل. الشرح إن الأطباء مختلفون في عدد …"
