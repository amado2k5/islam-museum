text: |-
  ٤٦٩
  مطاعين فى الهيجامطاعيم فى القرى * اذا اصفرآفاق السماءمن القرس
  يقسال ليلة ذات قرس أى برد وقد قرس البردية رس قرسا اشتدوفيه لغة أخرى قرس البرد
  قرسادقال أبوزبيد وقد تصليت حرّ حربهم * كماتصلى المقرور من قرس ١
  وقال ابن السكيت القرس الجامد ولم يعرفه أبو الغوث والبرد اليوم قارس وقريس
  ولا تقل قارص وقرس الماءاى جحد واصبح الماء اليوم قريساوفارسا أى جامداومنه قيسل
  سمذ قريس وهو أن يطبخ ثم يتخذله صباغ فيترك فيه حتى يجمد وأقرسه البرد وقرسه تقريسا
  بقال قرست الماء فى السّن اذا بردته قال أبوز يد القراسية من الابل الضخم الشديدبضم
  القاف والياءزائدة كمازيدت فى رباعية وغمانية قال الراجز
  لما تضمنت الحواريات قربت اجمالا قراسات قال أبو سعيد الضرير آل قراس أجبل باردة
  قال أبوذؤيب يصف عسلا
  يمانية أجبالهامظ مائد • وآل قراس صوب أسقية كمل
  ريروى صوب أرمية وهما بمعنى ويقال ماتدوقراس جبلان باليمن يمانية خفض على قوله
  فجابمزج لم برالناس مثله * هوالضحك الا أنه عمل النحل
  والمظ الرمان البرى ⁦(قربس)⁩ القربوس للسرج ولا يخفف الافى الشعر مثل طرسوس
  لانة.لول ليس من أبنيتهم قرطس القرطاس الذى يكتب فيه والقرطاس بالضم
  مثله وكذلك القرطسر ذكره أبوز يدفى نوادره وأنشد
  كان ببث استودع الدارأهلها • مخطز بور من دواة وقرطس
  ويسعى الغرض قرطاسا يقال رمى فقرطس اذا أمابه ( رقس قاع قرفوس مثل
  قربوس أى واسع أملس والقرقس الجرجس وأنشديعقوب
  فلبت الافاعى يعضضنا • مكان البراغيث والقرقس
  وحكى أبوز يدقرقت بالكاب أى دعوت به ⁦(قرئس)⁩. القرناس بالضم شبه الانف
  تقدم من الحيل قال الهدلى يصف وعلا
  فى رأس شاهقة أسو بياخضر • دون السماءله فى الحوقرناس
  ⁦(قس )⁩ القس تتبع الشى وطلبه قال الراجز يصحن عن قس الاذى غوافلا
  وتقسست أصواتهم بالليسل أى تسمعتها والقس النميمة والقس أيضارئيس من رؤساء
  النصارى فى الدين والعلم وكذلك القسيس والمقستوب يحمل من مصر يخالطه الحرير
  وفى الحديث أنه نهى عن ليس القسى قال أبو عبيدهو منسوب الى بلاديقال لها القس قال
  وقدر أيتها ولم يعرفها الاصممى قال وأصحاب الحسديث بقولونه بكسر القاف وأهل مصر
  بالفتح وقس بن ساعدة الايادى استف قجران وكان أحد حكماء العرب والقسوس الناقة
  التى ترعى وحدها مثل العسوس عن أبي زيدوالكسائى مثله وقدقست قس أى رعت
  وحسدها وقساس بالضم جبل لبنى أسد وتقال شمر القساس معدن الحديد بارمينية
  والقساسى سيف منسوب اليه وأنشد
  ان الفساسى الذى يعصى به • يختصم الدارع فى أتوابه
  وقرب قسقاص أى سربع ليس فيه وتيرة والقسقاس الدليل الهادى قال أبو عمر والقسة.:
  ٤١٨
  قوله ولا يخفف الخ عبارة
  القاموس ولايسكن الافى
  ضرورة الشعراه أى مع فتح
  القاف فلاينا فى ان سكون الرام
  مع ضم القاف لغة مشهورة
  ومايدل عليه كلام الشهاب على
  الدرة من ان السكون مع فخ
  أوّله لغة لا قائل به اه بالمعنى من
  حاشية القاموس
