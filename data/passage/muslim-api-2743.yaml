label: { ar: "صحيح مسلم 2743 — الرخصة", en: "Sahih Muslim 2743 — the concession (rukhsa)", ur: "صحیح مسلم 2743 — رخصت", fr: "Sahih Muslim 2743 — la dispense (rukhsa)", es: "Sahih Muslim 2743 — la dispensa (rukhsa)", tr: "Sahih Muslim 2743 — İzin", id: "Sahih Muslim 2743 — Izin" }
text: "… أَنَّكَ تَصُومُ النَّهَارَ وَتَقُومُ اللَّيْلَ فَلاَ تَفْعَلْ فَإِنَّ لِجَسَدِكَ عَلَيْكَ حَظًّا وَلِعَيْنِكَ عَلَيْكَ حَظًّا وَإِنَّ لِزَوْجِكَ عَلَيْكَ حَظًّا صُمْ وَأَفْطِرْ صُمْ مِنْ كُلِّ شَهْرٍ ثَلاَثَةَ أَيَّامٍ فَذَلِكَ صَوْمُ الدَّهْرِ \". قُلْتُ يَا رَسُولَ اللَّهِ إِنَّ بِي قُوَّةً. قَالَ \" فَصُمْ صَوْمَ دَاوُدَ - - صُمْ يَوْمًا وَأَفْطِرْ يَوْمًا \". فَكَانَ يَقُولُ يَا لَيْتَنِي أَخَذْتُ بِالرُّخْصَةِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2743، يرد فيه ذكر الرخصة. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 2743 (The Book of Fasting), whose wording mentions the concession (rukhsa). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 2743، جس کے الفاظ میں رخصت کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 2743, dont le texte mentionne la dispense (rukhsa). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 2743, cuyo texto menciona la dispensa (rukhsa). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 2743 numaralı hadis, bir istisnadan bahsetmektedir. Farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahları, Kur'an, Sünnet, biyografi ve Sahabe ve ümmetlerden gelen rivayetlerle birlikte derleyen bu kitap, metinde yer alanları açıklasa da, buna dayanarak bir fetva vermemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2743, menyebutkan sebuah keringanan. Penyusun kitab tentang amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan riwayat dari para Sahabat dan Pengikut mengenai topik-topik tersebut, menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
