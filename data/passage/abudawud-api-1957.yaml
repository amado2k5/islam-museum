ref: "1957"
label: { ar: "سنن أبي داود 1957 — تربية الأب ووصيته", en: "Sunan Abi Dawud 1957 — the father raising and counselling", ur: "سنن ابی داؤد 1957 — باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 1957 — el padre que crió y aconsejó", fr: "Sunan Abi Dawud 1957 — l'éducation et les conseils du père" }
text: "… الرَّحْمَنِ بْنِ مُعَاذٍ التَّيْمِيِّ، قَالَ خَطَبَنَا رَسُولُ اللَّهِ وَنَحْنُ بِمِنًى فَفُتِحَتْ أَسْمَاعُنَا حَتَّى كُنَّا نَسْمَعُ مَا يَقُولُ وَنَحْنُ فِي مَنَازِلِنَا فَطَفِقَ يُعَلِّمُهُمْ مَنَاسِكَهُمْ حَتَّى بَلَغَ الْجِمَارَ فَوَضَعَ أُصْبُعَيْهِ السَّبَّابَتَيْنِ فِي أُذُنَيْهِ ثُمَّ قَالَ \" بِحَصَى الْخَذْفِ \". ثُمَّ أَمَرَ الْمُهَاجِرِينَ فَنَزَلُوا فِي مُقَدَّمِ الْمَسْجِدِ وَأَمَرَ الأَنْصَارَ فَنَزَلُوا مِنْ وَرَاءِ الْمَسْجِدِ ثُمَّ نَزَلَ النَّاسُ بَعْدَ ذَلِكَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 1957، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1957 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1957، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 1957 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan Abi Dawud n° 1957 (Les Rites du Hajj [Kitab Al-Manasik Wa'l-Hajj]) mentionne le rôle du père dans l'éducation et les conseils prodigués à ses enfants. Le site « Paternité en Islam » le répertorie parmi les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
