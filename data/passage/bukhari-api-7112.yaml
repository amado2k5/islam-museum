label: { ar: "صحيح البخاري 7112 — القراء", en: "Sahih al-Bukhari 7112 — the readers", ur: "صحیح بخاری 7112 — قراء", es: "Sahih al-Bukhari 7112 — los lectores", fr: "Sahih al-Bukhari 7112 — les lecteurs" }
text: "… شِهَابٍ، عَنْ عَوْفٍ، عَنْ أَبِي الْمِنْهَالِ، قَالَ لَمَّا كَانَ ابْنُ زِيَادٍ وَمَرْوَانُ بِالشَّأْمِ، وَوَثَبَ ابْنُ الزُّبَيْرِ بِمَكَّةَ، وَوَثَبَ الْقُرَّاءُ بِالْبَصْرَةِ، فَانْطَلَقْتُ مَعَ أَبِي إِلَى أَبِي بَرْزَةَ الأَسْلَمِيِّ حَتَّى دَخَلْنَا عَلَيْهِ فِي دَارِهِ وَهْوَ جَالِسٌ فِي ظِلِّ عُلِّيَّةٍ لَهُ مِنْ قَصَبٍ، فَجَلَسْنَا إِلَيْهِ فَأَنْشَأَ أَبِي يَسْتَطْعِمُهُ الْحَدِيثَ فَقَالَ يَا أَبَا بَرْزَةَ أَلاَ تَرَى مَا وَقَعَ فِيهِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7112، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih al-Bukhari, no. 7112 (Afflictions and the End of the World), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح بخاری کی حدیث نمبر 7112، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7112 (Aflicciones y el fin del mundo), menciona a los lectores. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un hadith du Sahih al-Bukhari, n° 7112 (Les Afflictions et la Fin du Monde), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran le répertorie avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
