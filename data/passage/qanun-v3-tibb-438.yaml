text: "الكتاب الخامس الجملة الأولى: في المركّبات الراتبة في القراباذينات ويدرّ الطمث، والطحال والكلى والقولنج الكبد وجع المحتبس، ومن الجذام والبرص، ومن وجع النقرس والمفاصل والحقوين، ومن الحمّيات المزمنة المتقادمة وإسهاله بلا أذى. أخلاطه: يؤخذ صبر ستون درهماً، غاريقون أربعة وعشرون …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 438، يذكر الوجع، والحمى والوعك، والجذام والبرص، وأسماء الأمراض، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 438, that mentions pain, fever, leprosy and vitiligo, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 438 کا اقتباس جس میں درد، بخار، جذام اور برص، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 438, que menciona el dolor, la fiebre, la lepra y el vitíligo, enfermedades nombradas, los órganos del cuerpo; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 438, qui mentionne la douleur, la fièvre, la lèpre et le vitiligo, maladies nommées, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. cildinin 438. sayfasından bir bölüm; ağrı, ateş, halsizlik, cüzzam, vitiligo, hastalık isimleri ve vücut organlarından bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 3, hlm. 438, yang menyebutkan rasa sakit, demam, rasa tidak enak badan, kusta, vitiligo, nama-nama penyakit, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
