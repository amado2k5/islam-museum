label: { ar: "الموطأ 1149 — مالك: هدي الجزاء والنسك لا يكون إلا بمكة، وبدل الهدي من الصيام أو الصدقة يكون حيث شاء صاحبه", en: "Muwatta 1149", es: "Muwatta 1149", fr: "Muwatta 1149", ur: "موطا 1149", tr: "El-Muvatta 1149 — Malik: Kurban ve ritüel kurban yalnızca Mekke'de kesilebilir; oruç tutmak veya sadaka vermek gibi kurban yerine geçen şeyler ise kişinin dilediği yerde yapılabilir.", id: "Al-Muwatta 1149 — Malik: Persembahan kurban dan kurban ritual hanya dapat dilakukan di Mekah, dan pengganti persembahan, seperti puasa atau sedekah, dapat dilakukan di mana pun orang tersebut inginkan." }
text: "فإنَّ هَديَهُ لا يكونُ إلا بمَكَةَ"
summary:
  ar: "يقول مالك إن من وجب عليه الهدي في قتل الصيد أو في غير ذلك فإن هديه لا يكون إلا بمكة، أما ما عدل به الهدي من الصيام أو الصدقة فيكون بغير مكة، حيث أحب صاحبه أن يفعله. {cite:muwatta-maruf-1997 p.520}"
  tr: "Malik, avlanmak veya başka bir nedenle kurban kesmekle yükümlü olan herkesin bunu Mekke'de kesmesi gerektiğini söyler. Ancak, kurban oruç tutmaya veya sadaka vermeye denk ise, kişi dilediği yerde, Mekke dışında da kesebilir. {cite:muwatta-maruf-1997 s.520}"
  id: "Malik mengatakan bahwa siapa pun yang berkewajiban mempersembahkan kurban untuk berburu atau keperluan lainnya harus mempersembahkannya di Mekah. Namun, jika kurban tersebut setara dengan puasa atau sedekah, maka dapat dilakukan di luar Mekah, di mana pun orang tersebut ingin melakukannya. {cite:muwatta-maruf-1997 p.520}"
