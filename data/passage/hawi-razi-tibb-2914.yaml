text: "الأدوية المفردة باب الألف من دسم أغصان هذه الشجرة أدهان، وأجوده ما كان منه عتيقاً، ثخيناً، دسماً، صافياً ؛ وهو مسخن صالح للظلمة في البصر متى اكتحل به. وإن تمسح به نقع من الجرب المتقرح ومن أوجاع المفاصل. وقال بولس …"
summary:
