label: { ar: "سنن النسائي 952 — الأب والأبوة", en: "Sunan al-Nasa'i 952 — the father and fatherhood", ur: "سنن نسائی 952 — باپ اور والدیت" }
text: "أَخْبَرَنَا مُوسَى بْنُ حِزَامٍ التِّرْمِذِيُّ، وَهَارُونُ بْنُ عَبْدِ اللَّهِ، - وَاللَّفْظُ لَهُ - قَالاَ حَدَّثَنَا أَبُو أُسَامَةَ، قَالَ أَخْبَرَنِي سُفْيَانُ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، عَنْ عُقْبَةَ بْنِ عَامِرٍ، أَنَّهُ سَأَلَ النَّبِيَّ عَنِ الْمُعَوِّذَتَيْنِ قَالَ عُقْبَةُ فَأَمَّنَا بِهِمَا رَسُولُ اللَّهِ فِي صَلاَةِ الْفَجْرِ."
summary:
  ar: "حديث في سنن النسائي، رقم 952، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 952 (The Book of the Commencement of the Prayer), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 952، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
