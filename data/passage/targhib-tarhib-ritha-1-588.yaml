summary:
  ar: "مقطع من الترغيب والترهيب من الحديث الشريف، المجلد المصوَّر 1، ص 588، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), scan volume 1, p. 588, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "الترغیب والترہیب من الحدیث الشریف، اسکین جلد 1، ص 588 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), volume numérisé 1, p. 588, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Targhib wa-l-Tarhib min al-Hadith al-Sharif (al-Mundhiri), volumen escaneado 1, p. 588, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Hadislerden Teşvik ve Uyarı\" adlı kitabın 1. cildinin 588. sayfasından, ölen kişi için ağlama ve sınırları konusunu ele alan bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikası gereği yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Ağıt ve ağıt üzerine en meşhur sözlerden derlenmiştir."
  id: "Cuplikan dari buku \"Dorongan dan Peringatan dari Hadits Mulia,\" Jilid 1, halaman 588, membahas tentang menangisi orang yang meninggal dan batas-batasnya; diambil dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun dari kumpulan ucapan-ucapan paling terkenal tentang elegi dan ratapan."
