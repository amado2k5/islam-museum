label: { ar: "الموطأ 1589 — ابن شهاب: الرجل يقول لامرأته برئت مني وبرئت منك، إنها ثلاث تطليقات بمنزلة البتة", en: "Muwatta 1589", es: "Muwatta 1589", fr: "Muwatta 1589", ur: "موطا 1589", tr: "El-Muvatta 1589 — İbn Şihab: Bir adam karısına, “Ben senden özgürüm, sen de benden özgürsün” derse, bu üç kez geri alınamaz boşanma anlamına gelir.", id: "Al-Muwatta 1589 — Ibn Shihab: Seorang pria berkata kepada istrinya, “Aku bebas darimu dan kamu bebas dariku,” dan ini merupakan tiga kali perceraian yang tidak dapat dibatalkan." }
summary:
  ar: "يروي مالك أنه سمع ابن شهاب يقول في الرجل يقول لامرأته برئت مني وبرئت منك، إنها ثلاث تطليقات بمنزلة البتة. {cite:muwatta-maruf-1997 p.61}"
  tr: "Malik, İbn Şihab'ın, bir erkeğin karısına \"Ben senden özgürüm, sen de benden özgürsün\" demesinin üç kez geri dönülmez boşanma anlamına geldiğini söylediğini rivayet eder. {cite:muwatta-maruf-1997 s.61}"
  id: "Malik meriwayatkan bahwa ia mendengar Ibnu Shihab berkata mengenai seorang pria yang berkata kepada istrinya, \"Aku bebas darimu dan engkau bebas dariku,\" bahwa hal itu merupakan tiga kali perceraian yang tidak dapat dibatalkan. {cite:muwatta-maruf-1997 p.61}"
