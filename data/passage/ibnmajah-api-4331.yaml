label: { ar: "سنن ابن ماجه 4331 — رفع الدرجات", en: "Sunan Ibn Majah 4331 — ranks raised", ur: "سنن ابن ماجہ 4331 — درجات کی بلندی", es: "Sunan Ibn Majah 4331 - rangos elevados", fr: "Sunan Ibn Majah 4331 — rangs élevés", tr: "Sünen İbni Mace 4331 — Derecelerin Yükseltilmesi", id: "Sunan Ibnu Majah 4331 — Menaikkan Derajat" }
text: "… سَعِيدٍ، حَدَّثَنَا حَفْصُ بْنُ مَيْسَرَةَ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ عَطَاءِ بْنِ يَسَارٍ، أَنَّ مُعَاذَ بْنَ جَبَلٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" الْجَنَّةُ مِائَةُ دَرَجَةٍ كُلُّ دَرَجَةٍ مِنْهَا مَا بَيْنَ السَّمَاءِ وَالأَرْضِ وَإِنَّ أَعْلاَهَا الْفِرْدَوْسُ وَإِنَّ أَوْسَطَهَا الْفِرْدَوْسُ وَإِنَّ الْعَرْشَ عَلَى الْفِرْدَوْسِ مِنْهَا تُفَجَّرُ أَنْهَارُ الْجَنَّةِ فَإِذَا مَا سَأَلْتُمُ اللَّهَ فَسَلُوهُ الْفِرْدَوْسَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4331، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 4331 (Zuhd), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4331، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 4331 (Zuhd), que habla de ascensos de rango. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 4331 (Zuhd), évoque l'élévation de grade. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, écrivent, effacent ou pèsent un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 4331 numaralı hadis, mertebelerin yükseltilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesini, eylemleri sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 4331, menyebutkan tentang peningkatan derajat. Hadits ini menggabungkan daftar amal baik dan buruk dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
