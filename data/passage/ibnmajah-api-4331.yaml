label: { ar: "سنن ابن ماجه 4331 — رفع الدرجات", en: "Sunan Ibn Majah 4331 — ranks raised", ur: "سنن ابن ماجہ 4331 — درجات کی بلندی" }
text: "… سَعِيدٍ، حَدَّثَنَا حَفْصُ بْنُ مَيْسَرَةَ، عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ عَطَاءِ بْنِ يَسَارٍ، أَنَّ مُعَاذَ بْنَ جَبَلٍ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ ـ يَقُولُ \" الْجَنَّةُ مِائَةُ دَرَجَةٍ كُلُّ دَرَجَةٍ مِنْهَا مَا بَيْنَ السَّمَاءِ وَالأَرْضِ وَإِنَّ أَعْلاَهَا الْفِرْدَوْسُ وَإِنَّ أَوْسَطَهَا الْفِرْدَوْسُ وَإِنَّ الْعَرْشَ عَلَى الْفِرْدَوْسِ مِنْهَا تُفَجَّرُ أَنْهَارُ الْجَنَّةِ فَإِذَا مَا سَأَلْتُمُ اللَّهَ فَسَلُوهُ الْفِرْدَوْسَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4331، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 4331 (Zuhd), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4331، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
