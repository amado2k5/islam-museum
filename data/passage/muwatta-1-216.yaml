label: { ar: "الموطأ 216 — ابن عمر يجهر فيما يقضي من الصلاة الجهرية", en: "Muwatta 216", es: "Muwatta 216", fr: "Muwatta 216", ur: "موطا 216", tr: "El-Muvatta 216 — İbn Ömer, normalde sesli okunan ancak kılınamayan namazları kaza ederken sesli okur.", id: "Al-Muwatta 216 — Ibnu Umar membaca dengan suara keras ketika mengganti salat yang terlewat yang biasanya dibaca dengan suara keras." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في القراءة: كان عبد الله بن عمر إذا فاته شيء من الصلاة مع الإمام فيما جهر فيه الإمام بالقراءة، قام بعد سلام الإمام فقرأ لنفسه فيما يقضي وجهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.132}"
  tr: "Malik'in Nafi'den rivayet ettiği, Kur'an okuma uygulaması bölümünde yer alan bir rivayete göre: Abdullah ibn Umar, imamın yüksek sesle okuduğu namazın bir kısmını kaçırırsa, imamın selamlamasından sonra ayağa kalkar ve kaçırdığı kısmı kendi kendine yüksek sesle okurdu. Editör, bunun Malik'ten Ebu Mus'ab, Suwaid, Abd al-Razzaq ve Muhammed ibn al-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.132}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang praktik membaca Al-Quran: Abdullah ibn Umar, jika ia melewatkan sebagian shalat bersama imam di mana imam membaca Al-Quran dengan suara keras, akan berdiri setelah salam imam dan membaca Al-Quran dengan suara keras untuk dirinya sendiri sebagai pengganti bagian yang terlewat. Editor menyebutkan bahwa ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, Abd al-Razzaq, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.132}"
