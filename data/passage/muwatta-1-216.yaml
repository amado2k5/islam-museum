label: { ar: "الموطأ 216 — ابن عمر يجهر فيما يقضي من الصلاة الجهرية", en: "Muwatta 216" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب العمل في القراءة: كان عبد الله بن عمر إذا فاته شيء من الصلاة مع الإمام فيما جهر فيه الإمام بالقراءة، قام بعد سلام الإمام فقرأ لنفسه فيما يقضي وجهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.132}"
