text: "… الرحمن الرحيم، لعبد الملك بكاء الوالدين من العقوق بلى، أفّ، شيطان، أخرجوه بلى، ولكن لا تنشدني إلا حسناً تدري لأي شيء مددت رجلي ترفع للميت بعد موته درجته التسليم تطوُع والردُّ فريضة تعلموا أنسابكم ثم صلوا أرحامكم تلك صدور الرسائل …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 477، يرد فيه ذكر الفريضة والفرائض، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 2, p. 477, whose wording mentions the obligation (farida), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 2، ص 477 کا اقتباس جس میں فریضہ اور فرائض، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Adab al-Mufrad de al-Bukhari, volume numérisé 2, p. 477, dont le texte mentionne l'obligation (farida), l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
