  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 2. cildinin 477. sayfasından, farz, görev ve gönüllülük esaslarını ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Farz, görev, itaat, tavsiye edilen, mekruh, haram ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 2, halaman 477, yang menyebutkan amalan wajib, kewajiban, dan amalan sunnah; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
