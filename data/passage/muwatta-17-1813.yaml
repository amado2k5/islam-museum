label: { ar: "الموطأ 1813 — يحيى عن مالك عن نافع عن ابن عمر عن زيد بن ثابت: رخص رسول الله لصاحب العرية أن يبيعها بخرصها", en: "Muwatta 1813", es: "Muwatta 1813", fr: "Muwatta 1813", ur: "موطا 1813", tr: "El-Muvatta 1813 — Yahya, Malik'ten, o da Nafi'den, o da İbn Ömer'den, o da Zeyd ibn Sabit'ten rivayetle: Allah'ın Resulü, bir 'Ariye'nin sahibinin onu tahmini fiyat üzerinden satmasına izin vermiştir.", id: "Al-Muwatta 1813 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Nafi’, berdasarkan riwayat Ibn Umar, berdasarkan riwayat Zayd ibn Thabit: Rasulullah mengizinkan pemilik ‘Ariyah untuk menjualnya dengan cara memperkirakan nilainya." }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر عن زيد بن ثابت أن رسول الله رخص لصاحب العرية أن يبيعها بخرصها. {cite:muwatta-maruf-1997 p.142}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan, o da Zayd ibn Thabit'ten rivayet eder ki, Allah Resulü, bir 'ariyah (bir çeşit hurma) sahibine onu tahmini değerine göre satmasına izin vermiştir. {cite:muwatta-maruf-1997 s.142}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi', dari Abdullah ibn Umar, dari Zayd ibn Thabit, bahwa Rasulullah SAW memperbolehkan pemilik 'ariyah (sejenis kurma) untuk menjualnya berdasarkan perkiraan nilainya. {cite:muwatta-maruf-1997 p.142}"
