label: { ar: "الموطأ 2848 — عائشة وهي صائمة تعطي المسكين الرغيف الوحيد فيهدى لها شاة", en: "Muwatta 2848" }
summary:
  ar: "بلغ مالكا أن مسكينا سأل عائشة وهي صائمة، وليس في بيتها إلا رغيف، فقالت لمولاة لها: أعطيه إياه. فقالت: ليس لك ما تفطرين عليه. فقالت: أعطيه إياه، ففعلت. فلما أمسيتا أهدى لهما أهل بيت أو إنسان شاة مع ما يغطيها من الأقراص، فدعتني عائشة فقالت: كلي من هذا، هذا خير من قرصك. {cite:muwatta-maruf-1997 p.596}"
