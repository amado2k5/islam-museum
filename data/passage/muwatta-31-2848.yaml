label: { ar: "الموطأ 2848 — عائشة وهي صائمة تعطي المسكين الرغيف الوحيد فيهدى لها شاة", en: "Muwatta 2848", es: "Muwatta 2848", fr: "Muwatta 2848", ur: "موطا 2848", tr: "Al-Muwatta 2848 — Ayşe, oruçlu iken fakir adama elindeki tek ekmeğini verir ve karşılığında ona bir koyun verilir.", id: "Al-Muwatta 2848 — Aisyah, ketika berpuasa, memberikan sepotong roti miliknya kepada orang miskin, dan sebagai imbalannya ia diberi seekor domba." }
summary:
  ar: "بلغ مالكا أن مسكينا سأل عائشة وهي صائمة، وليس في بيتها إلا رغيف، فقالت لمولاة لها: أعطيه إياه. فقالت: ليس لك ما تفطرين عليه. فقالت: أعطيه إياه، ففعلت. فلما أمسيتا أهدى لهما أهل بيت أو إنسان شاة مع ما يغطيها من الأقراص، فدعتني عائشة فقالت: كلي من هذا، هذا خير من قرصك. {cite:muwatta-maruf-1997 p.596}"
  tr: "Malik, Ayşe'nin oruçlu olduğu sırada fakir bir adamın ondan yiyecek istediğini, evinde ise bir somun ekmekten başka bir şey olmadığını anlattı. Ayşe, hizmetçisine, \"Ona ver,\" dedi. Hizmetçi, \"Orucunu açacak hiçbir şeyin yok,\" diye cevap verdi. Malik ısrar etti, \"Ona ver,\" ve hizmetçi de öyle yaptı. Akşam olunca, bir aile veya birileri onlara bir koyun ve bir örtü ekmek gönderdi. Ayşe beni çağırdı ve, \"Bundan ye; bu senin ekmeğinden daha iyidir,\" dedi. {cite:muwatta-maruf-1997 s.596}"
  id: "Malik meriwayatkan bahwa seorang pria miskin meminta makanan kepada Aisyah ketika ia sedang berpuasa, dan di rumahnya tidak ada apa pun kecuali sepotong roti. Ia berkata kepada pelayannya, \"Berikanlah kepadanya.\" Pelayan itu menjawab, \"Ibu tidak punya apa pun untuk berbuka puasa.\" Malik bersikeras, \"Berikanlah kepadanya,\" dan pelayan itu pun melakukannya. Ketika malam tiba, sebuah keluarga atau seseorang mengirimkan seekor domba beserta roti. Aisyah memanggilku dan berkata, \"Makanlah dari ini; ini lebih baik daripada rotimu.\" {cite:muwatta-maruf-1997 p.596}"
