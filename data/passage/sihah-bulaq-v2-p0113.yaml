text: |-
  ٤٧٤
  • فصل الدال)
  * ⁦(دلو )⁩.
  والدعوى فى النسب هذا أكنر كلام العرب الاعدى الرباب فانهم يفتحون الدال فى
  النسب ويكسرونها فى الطعام والدى أيضامن تبنيته قال تعالى وماجعل أدعاءسكم
  أبناءكم واتعيت على فلان كذا والاسم الدعوى والادعا فى الحرب الاعتزاء وهو أن
  يقول أنا فلان بن فلان وتداعت الحطان للغراب أى تهادمت والادعية مثل الاحجية
  والمداعاة المحاجاة يقال بينهم أدعيسة يتداعون بهاوهى مثل الاغلوطات حتى الالغاز من
  الشعر أدعية مثل قول الشاعر
  أداعيك ما مستحبات مع السرى • حسان وما آثارها بحسان
  يعنى السيوف وقال آخر يصف القلم !
  " مو° 2,
  حاجيتك ياخنساه* فى جنس من الشعر • وفيماطوله شير • وقديوفى على الشبر
  ك فى رأ←شق* نطوف ماؤه بجرى * أبيف لم أقل هجرا• ورب البيت والججر
  ودعوت فلانا أى صحت به واسندعيته ودعوت اللّٰه له وعليه دعاه والدعوة المرة الواحد
  والدعاء واحد الادعية وأصله دعاولانه من دعوت الا أنّ الواولملمجاءت بعد الالف همزن
  وتقول للامرأة أنت تدعيز وفيه لغة ثانية أنت تدعوين وفيسه لغة ثالثة أنت تدعين باشمام
  .العين الضمة وللجماعة أنتن تدعون مثل الرجال سواء وداعية اللبن ما ينرك فى الضرع ليدعو
  ما بعده وفى الحديت دع داعى اللبن ودواعى الدهر سروفه وقولهم ما بالدارد عوعة بالضم
  أى أحد قال الكسائى هو من دعوت أى ليس فيهامن يدعولا يتسكلم به الامع الجد وقول
  العجاج * انى لا أسعى الى داعيه• مشسددة الياء والهاء للعماد مثل التى فى سلطانيه ومالبه
  قال الاخفس سمعت من العسرب.ن يقول لودعونا لاندعينا أى لاجبنا كما تقول لو بعثونا
  لا نبعتنا حكاه عنه أبوبكربن السراج ⁦(دغا)⁩ يقال فلان ذود غوات وذودغيات اذا كان
  ذا أخلاق رديشسة الواحدة دغوة ودغية قال رؤبة •ذادغوات قلب الاخلاق • أى
  ذا أخلاق رديثة. تلونة ودغة لقب امرأة من عجمل تحمق يقال أجق من دغة وأصلهادغو
  أودغى والهاءعوض ⁦( فا)⁩ دفوت الجريح أدفوه دفوا اذا أجهزت عليه وكذلك دافيته
  وأدفيته حكاهما أبو عبيد وفى الحديث أنه عليه الصلاة والسلام أتى يأسيريوعل فقال لقوم
  منهم اذهبوا به فادفوه ريد الدفء من البردفذهبوا به فقتاوه فوداه رسول اللّٰه صلى اللّه عليه
  و-لم والدفامقصور الانحناء يقال رجل أدفى أى فى صلبهه احديداب ويقلل وعل أدفى بين
  الدفاوه والذى طال قرناه جسدا وذهباقبل أذنيه وعنزد فواء وطائرأد فى طويل الجناح
  والدفواء الشهجرة العظيمة وفى الحديث أنه أيصرشجرة دفواء تسمى ذات أنواط لانه كان
  يشاط السلاح بها وتعبد دون اللّه عز وجل وانماقيل للعقاب دفواء لعوج منقارها والتدافى
  التداول يقنال تدافى البعير تدافيا وذلك اذا سارسير امتجافيا وربماقيل للنجيبة الطويلة
  العنق دفواء (دق، دقى الفصيل بالسكمميدق دق اذاأكثر من شرب اللبن حتى بشم فهو
  دق على فعل والاتى دقية وقدقيل دقوان ودقوى وأآنشد الاصممى
  وانى لا تنظرسيوح عباتى • شفاء الدقى يابكرام حلي
  ⁦( دلو)⁩ الدلو واحدة الدلا التى يسنقى بها وكذلك الدلا بالفتح الواحدة دلاة وجمع الدلو
