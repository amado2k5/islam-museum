text: "… به ويستعط، فذكر حليثاً وقد جاء من غير طريقه؛ لكن من وجه واه جدّاً، طويلاً فيه: الكراث والباذروج الجرجير والهندباء، والكمأة، والكرفس، واللحم، والحيتان. أخرجه ابن الجَوْزِيّ من طريق أحمد بن عمار: حدثنا وفيه: الكمأة من الجنة، ماؤها شفاء للعين، …"
