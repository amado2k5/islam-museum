text: "… به ويستعط، فذكر حليثاً وقد جاء من غير طريقه؛ لكن من وجه واه جدّاً، طويلاً فيه: الكراث والباذروج الجرجير والهندباء، والكمأة، والكرفس، واللحم، والحيتان. أخرجه ابن الجَوْزِيّ من طريق أحمد بن عمار: حدثنا وفيه: الكمأة من الجنة، ماؤها شفاء للعين، …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 404، يذكر الكمأة، واللدود والسعوط، والشفاء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 404, that mentions truffles and their water for the eye, medicine given by the mouth-side or the nose, healing; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 404 کا اقتباس جس میں کھمبی، لدود اور سعوط، شفا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen escaneado 2, pág. 404, que menciona las trufas y su agua para los ojos, medicina administrada por vía oral o nasal, curativa; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn Hajar, al-Isaba, volume 2, page 404, qui mentionne les truffes et leur eau pour les yeux, un médicament administré par voie orale ou nasale, pour la guérison; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Hajar'ın El-İsabe adlı eserinin resimli 2. cildinin 404. sayfasında trüf mantarı, solucanlar, enfiye ve şifa konularından bahsedilmektedir; bu bölüm, makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Isabah karya Ibn Hajar, jilid 2 bergambar, hlm. 404, menyebutkan jamur truffle, cacing, tembakau bubuk, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
