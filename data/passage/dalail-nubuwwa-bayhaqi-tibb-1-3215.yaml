text: "… وجل فيه من الشفاء حتى ظهرت آثاره. أخبرنا أبو نصر عمر بن عبد العزيز بن عمر بن قتادة، وأبو بكر محمد بن الرُّقية هي الدعاء وثبت ان رسول اللّٰه تع كان يرقي الأطفال، ورقياه كانت دعاءً لهم وتلاوة القرآن الكريم …"
