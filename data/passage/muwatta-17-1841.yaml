label: { ar: "الموطأ 1841 — مالك: من استأجر عبدا بعينه، أو اكترى راحلة بعينها إلى أجل، ولم يقبض العبد أو الراحلة إلى ذلك الأجل، فقد عمل بما لا يصلح، لأنه لم يقبض ما اكترى ولا سلف في دين", en: "Muwatta 1841", es: "Muwatta 1841", fr: "Muwatta 1841", ur: "موطا 1841", tr: "El-Muvatta 1841 — Malik: Kim belirli bir süre için belirli bir köleyi veya belirli bir bineği kiralar ve bu süre içinde köleyi veya bineği teslim almazsa, haksızlık etmiş olur; çünkü ne kiraladığı şeyi teslim almış ne de borçlanmıştır.", id: "Al-Muwatta 1841 — Malik: Barang siapa menyewa seorang budak atau seekor tunggangan untuk jangka waktu tertentu, dan tidak mengambil alih budak atau tunggangan tersebut pada jangka waktu itu, maka ia telah berbuat tidak senonoh, karena ia tidak mengambil alih apa yang disewanya dan tidak pula melunasi hutangnya." }
summary:
  ar: "قال مالك: ومن استأجر عبدا بعينه أو اكترى راحلة بعينها إلى أجل، يقبض العبد أو الراحلة إلى ذلك الأجل، فقد عمل بما لا يصلح، لا هو قبض ما استكرى أو استأجر، ولا هو سلف في دين يكون ضامنا على صاحبه حتى يستوفيه. {cite:muwatta-maruf-1997 p.155} {cite:muwatta-maruf-1997 p.156}"
  tr: "Malik şöyle demiştir: Belirli bir süre için belirli bir köleyi veya belirli bir bineği kiralayan ve o tarihte köleyi veya bineği teslim alan kimse, usulsüzlük yapmış olur. Kiraladığı veya tuttuğu şeyi teslim almamış, ayrıca borcun ödenmesi için kefil de olmamış ve borcun ödenmesi tamamlanana kadar kefil olmamıştır. {cite:muwatta-maruf-1997 s.155} {cite:muwatta-maruf-1997 s.156}"
  id: "Malik berkata: Barang siapa menyewa budak tertentu atau menyewa kuda tertentu untuk jangka waktu tertentu, dan mengambil alih budak atau kuda tersebut pada tanggal tersebut, maka ia telah bertindak secara tidak benar. Ia tidak mengambil alih apa yang disewanya atau dikontraknya, dan ia juga tidak bertindak sebagai penjamin utang yang wajib dibayarnya hingga lunas. {cite:muwatta-maruf-1997 p.155} {cite:muwatta-maruf-1997 p.156}"
