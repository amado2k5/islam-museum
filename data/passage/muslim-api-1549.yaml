label: { ar: "صحيح مسلم 1549 — القراء", en: "Sahih Muslim 1549 — the readers", ur: "صحیح مسلم 1549 — قراء", es: "Sahih Muslim 1549 — los lectores", fr: "Sahih Muslim 1549 — les lecteurs", tr: "Sahih Muslim 1549 — Okuyucular", id: "Sahih Muslim 1549 — Pembaca" }
text: "وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو كُرَيْبٍ قَالاَ حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنْ عَاصِمٍ، عَنْ أَنَسٍ، قَالَ سَأَلْتُهُ عَنِ الْقُنُوتِ، قَبْلَ الرُّكُوعِ أَوْ بَعْدَ الرُّكُوعِ فَقَالَ قَبْلَ الرُّكُوعِ. قَالَ قُلْتُ فَإِنَّ نَاسًا يَزْعُمُونَ أَنَّ رَسُولَ اللَّهِ قَنَتَ بَعْدَ الرُّكُوعِ. فَقَالَ إِنَّمَا قَنَتَ رَسُولُ اللَّهِ شَهْرًا يَدْعُو عَلَى أُنَاسٍ قَتَلُوا أُنَاسًا مِنْ أَصْحَابِهِ يُقَالُ لَهُمُ الْقُرَّاءُ."
summary:
  ar: "حديث في صحيح مسلم، رقم 1549، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sahih Muslim, no. 1549 (The Book of Mosques and Places of Prayer), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "صحیح مسلم کی حدیث نمبر 1549، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 1549 (El Libro de las Mezquitas y Lugares de Oración), menciona a los lectores. El navegador del museo sobre cómo se leía y escribía el Corán lo enumera junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sahih Muslim, n° 1549 (Livre des mosquées et des lieux de prière), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce rapport avec les textes du Coran, la Sunna, la Sîra et les ouvrages traitant de ce sujet."
  tr: "Sahih Müslim'de 1549 numaralı hadiste Kur'an okuyucularından bahsedilir. Bu derleme, Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler hakkında bilgilerin yanı sıra Kur'an, Sünnet, biyografi ve Kur'an okunuşu ve yazımı üzerine kitaplardan metinler içermektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 1549, menyebutkan para pembaca Al-Quran. Koleksi ini menyusun informasi tentang bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik, beserta teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku tentang bacaan dan penulisan Al-Quran."
