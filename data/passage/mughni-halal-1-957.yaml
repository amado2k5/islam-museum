text: "… قال : انت على حرام. ونوى الطلاق والظهار معا،... إن قال : أنت طالق كظهر أمى... إن مات المظاهر أو ماتت أو طلقها، لم تلزمه الكفارة... إذا طلق من ظاهر منها ثم تزوجها، لم يحل له وطوُها حتى يكفر... إذا …"
