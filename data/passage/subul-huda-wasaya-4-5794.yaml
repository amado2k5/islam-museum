text: "… اللّٰه تعالى عنهما أن رجلاً أعتق ستة أَعبد عند موته، ولم يكن له مال غيرهم، فجزأهم رسول اللّٰه وتال أثلاثاً، ثم أقرع بينهم فأعتق اثنين وأرَقَّ أربعة. وروى الطبرانى عن أبى أمامة - - قال : أعتق رجل فى وصيته …"
summary:
