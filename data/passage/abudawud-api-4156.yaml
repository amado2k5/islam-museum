label: { ar: "سنن أبي داود 4156 — الأب والأبوة", en: "Sunan Abi Dawud 4156 — the father and fatherhood", ur: "سنن ابی داؤد 4156 — باپ اور والدیت", es: "Sunan Abi Dawud 4156 — El padre y la paternidad", fr: "Sunan Abi Dawud 4156 — Le père et la paternité", tr: "Sunan Abi Davud 4156 — Baba ve Babalık", id: "Sunan Abi Dawud 4156 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا الْحَسَنُ بْنُ الصَّبَّاحِ، أَنَّ إِسْمَاعِيلَ بْنَ عَبْدِ الْكَرِيمِ، حَدَّثَهُمْ قَالَ حَدَّثَنِي إِبْرَاهِيمُ، - يَعْنِي ابْنَ عَقِيلٍ - عَنْ أَبِيهِ، عَنْ وَهْبِ بْنِ مُنَبِّهٍ، عَنْ جَابِرٍ، أَنَّ النَّبِيَّ أَمَرَ عُمَرَ بْنَ الْخَطَّابِ - - زَمَنَ الْفَتْحِ وَهُوَ بِالْبَطْحَاءِ أَنْ يَأْتِيَ الْكَعْبَةَ فَيَمْحُوَ كُلَّ صُورَةٍ فِيهَا فَلَمْ يَدْخُلْهَا النَّبِيُّ حَتَّى مُحِيَتْ كُلُّ صُورَةٍ فِيهَا."
summary:
  ar: "حديث في سنن أبي داود، رقم 4156، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4156 (Clothing (Kitab Al-Libas)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4156، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4156 (El Libro de la Vestimenta (Kitab Al-Libas)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4156 (Vêtements (Kitab Al-Libas)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4156 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4156, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
