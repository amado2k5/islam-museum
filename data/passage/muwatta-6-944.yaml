text: "أن رسول الله أفرد الحج"
summary:
  ar: "يرويه مالك عن أبي الأسود محمد بن عبد الرحمن، وكان يتيماً في حجر عروة بن الزبير، عن عروة عن عائشة، أن رسول الله أفرد الحج. ويقول ابن عبد البر إن هذا الحديث مستخرج من الحديث السابق، أخرجه مالك حجة لمذهبه أن الإفراد أفضل. {cite:muwatta-maruf-1997 p.451}"
