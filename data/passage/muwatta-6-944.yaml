label: { ar: "الموطأ 944 — أبو الأسود عن عروة عن عائشة: أن رسول الله أفرد الحج", en: "Muwatta 944", es: "Muwatta 944", fr: "Muwatta 944", ur: "موطا 944", tr: "El-Muvatta 944 — Ebu el-Esved, Urve'den, o da Aişe'den rivayetle: Allah Resulü Hac ibadetini ayrı olarak yerine getirmiştir.", id: "Al-Muwatta 944 — Abu al-Aswad, berdasarkan riwayat Urwah, berdasarkan riwayat Aisyah: bahwa Rasulullah SAW melaksanakan ibadah haji secara terpisah" }
text: "أن رسول الله أفرد الحج"
summary:
  ar: "يرويه مالك عن أبي الأسود محمد بن عبد الرحمن، وكان يتيماً في حجر عروة بن الزبير، عن عروة عن عائشة، أن رسول الله أفرد الحج. ويقول ابن عبد البر إن هذا الحديث مستخرج من الحديث السابق، أخرجه مالك حجة لمذهبه أن الإفراد أفضل. {cite:muwatta-maruf-1997 p.451}"
  tr: "Malik, Urve ibn el-Zübeyr'in himayesinde yetim olan Ebu el-Esved Muhammed ibn Abd el-Rahman'dan, Urve'den, o da Aişe'den rivayetle, Allah Resulü'nün Hac ibadetini ayrı olarak (İfrad) yerine getirdiğini nakletmiştir. İbn Abd el-Barr, bu hadisin önceki hadisten türetildiğini ve Malik'in bunu Hac ibadetini ayrı olarak yapmanın daha faziletli olduğu görüşüne delil olarak dahil ettiğini söyler. {cite:muwatta-maruf-1997 s.451}"
  id: "Malik meriwayatkannya dari Abu al-Aswad Muhammad ibn Abd al-Rahman, yang merupakan seorang yatim piatu di bawah perwalian Urwah ibn al-Zubayr, dari Urwah, dari Aisyah, bahwa Rasulullah SAW melaksanakan ibadah haji secara terpisah (Ifrad). Ibn Abd al-Barr mengatakan bahwa hadits ini diturunkan dari hadits sebelumnya, dan Malik memasukkannya sebagai bukti pandangannya bahwa melaksanakan ibadah haji secara terpisah lebih diutamakan. {cite:muwatta-maruf-1997 p.451}"
