  tr: "İbn el-Athir'in *Al-Kamil fi al-Tarikh* adlı eserinin resimli 1. cildinin 262. sayfasında vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
