text: "… وأوصى أن تغسّله زوجته أسماء بنت عُمَيْس وابنه عبد الرحمن، وأن يُكَفَّن فِي ثوبَيْه ويُشتَرَى معهما ثوبٌ ثالث، وقال: الحيّ أحوج إلى الجديد من الميت، إنما هو للمُهْلة والصديد.. ودُفن ليلا وصلّى عليه عمر بن الخطّاب في مسجد رسول الله، …"
summary:
