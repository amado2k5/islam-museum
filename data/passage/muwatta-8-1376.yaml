label: { ar: "الموطأ 1376 — مالك: من حلف لا يأكل هذا الطعام ولا يلبس هذا الثوب ولا يدخل هذا البيت في يمين واحدة فعليه كفارة واحدة", en: "Muwatta 1376", es: "Muwatta 1376", fr: "Muwatta 1376", ur: "موطا 1376", tr: "El-Muvatta 1376 — Malik: Kim bu yemeği yemeyeceğine, bu elbiseyi giymeyeceğine ve bu eve girmeyeceğine tek bir yeminle yemin ederse, bir kefaret sunmalıdır.", id: "Al-Muwatta 1376 — Malik: Barang siapa bersumpah untuk tidak memakan makanan ini, tidak mengenakan pakaian ini, dan tidak memasuki rumah ini dalam satu sumpah, maka ia wajib membayar satu kali penebusan dosa." }
summary:
  ar: "يقول مالك إن حلف رجل والله لا آكل هذا الطعام، ولا ألبس هذا الثوب، ولا أدخل هذا البيت، فكان هذا في يمين واحدة، فإنما عليه كفارة واحدة. وإنما ذلك كقول الرجل لامرأته أنت الطلاق إن كسوتك هذا الثوب، وأذنت لك إلى المسجد، إذا كان ذلك نسقا متتابعا في كلام واحد، فإن حنث في شيء واحد من ذلك وجب عليه الطلاق. {cite:muwatta-maruf-1997 p.614}"
  tr: "Malik, bir adamın \"Allah'a yemin ederim ki, bu yemeği yemeyeceğim, bu elbiseyi giymeyeceğim ve bu eve girmeyeceğim\" diye yemin etmesi ve bunların hepsinin tek bir yeminin parçası olması durumunda, yalnızca bir kefaret ödemesi gerektiğini söyler. Bu, bir adamın karısına \"Sana bu elbiseyi giydirirsem ve camiye gitmene izin verirsem boşanacaksın\" demesine benzer; bu ifadeler tek bir sözde ardı ardına söylenirse, boşanma farz olur. Bu yeminlerden herhangi birini bozarsa, boşanma farz olur. {cite:muwatta-maruf-1997 s.614}"
  id: "Malik mengatakan bahwa jika seorang pria bersumpah, \"Demi Allah, aku tidak akan makan makanan ini, tidak akan mengenakan pakaian ini, dan tidak akan memasuki rumah ini,\" dan semua itu merupakan bagian dari satu sumpah, maka ia hanya perlu melakukan satu penebusan. Ini mirip dengan seorang pria yang berkata kepada istrinya, \"Kamu diceraikan jika aku memakaikanmu pakaian ini dan mengizinkanmu pergi ke masjid,\" jika pernyataan-pernyataan ini diucapkan secara berurutan dalam satu ucapan. Jika ia melanggar salah satu sumpah tersebut, maka perceraian menjadi wajib. {cite:muwatta-maruf-1997 p.614}"
