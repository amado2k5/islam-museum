label: { ar: "الموطأ 1376 — مالك: من حلف لا يأكل هذا الطعام ولا يلبس هذا الثوب ولا يدخل هذا البيت في يمين واحدة فعليه كفارة واحدة", en: "Muwatta 1376" }
summary:
  ar: "يقول مالك إن حلف رجل والله لا آكل هذا الطعام، ولا ألبس هذا الثوب، ولا أدخل هذا البيت، فكان هذا في يمين واحدة، فإنما عليه كفارة واحدة. وإنما ذلك كقول الرجل لامرأته أنت الطلاق إن كسوتك هذا الثوب، وأذنت لك إلى المسجد، إذا كان ذلك نسقا متتابعا في كلام واحد، فإن حنث في شيء واحد من ذلك وجب عليه الطلاق. {cite:muwatta-maruf-1997 p.614}"
