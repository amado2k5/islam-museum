label: { ar: "صحيح البخاري 6971 — ما أُحل", en: "Sahih al-Bukhari 6971 — what was made lawful", ur: "صحیح بخاری 6971 — جو حلال کیا گیا", es: "Sahih al-Bukhari 6971 — lo que se hizo lícito", fr: "Sahih al-Bukhari 6971 — ce qui a été rendu licite", tr: "Sahih el-Buhari 6971 — İzin verilenler", id: "Sahih al-Bukhari 6971 — Apa yang diperbolehkan" }
text: "… مُلَيْكَةَ، عَنْ ذَكْوَانَ، عَنْ عَائِشَةَا ـ قَالَتْ قَالَ رَسُولُ اللَّهِ \" الْبِكْرُ تُسْتَأْذَنُ \". قُلْتُ إِنَّ الْبِكْرَ تَسْتَحْيِي قَالَ \" إِذْنُهَا صُمَاتُهَا \". وَقَالَ بَعْضُ النَّاسِ إِنْ هَوِيَ رَجُلٌ جَارِيَةً يَتِيمَةً أَوْ بِكْرًا، فَأَبَتْ فَاحْتَالَ فَجَاءَ بِشَاهِدَىْ زُورٍ عَلَى أَنَّهُ تَزَوَّجَهَا، فَأَدْرَكَتْ فَرَضِيَتِ الْيَتِيمَةُ، فَقَبِلَ الْقَاضِي شَهَادَةَ الزُّورِ، وَالزَّوْجُ يَعْلَمُ بِبُطْلاَنِ ذَلِكَ، حَلَّ لَهُ الْوَطْءُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6971، يذكر ما أُحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 6971 (Tricks), that mentions what was made lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 6971، جس میں جو حلال کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6971 (Trucos), menciona lo que se ha hecho lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 6971 (Ruses), mentionne ce qui a été rendu licite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'de 6971 numaralı hadis, helal ve haram olanı belirtmektedir. Helal ve haram tarayıcısı, helal ve haram olanla ilgili olarak Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinler sunmaktadır."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6971, menyebutkan apa yang diperbolehkan. Peramban Halal dan Haram menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
