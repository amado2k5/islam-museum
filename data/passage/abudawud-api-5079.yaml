label: { ar: "سنن أبي داود 5079 — الأب والأبوة", en: "Sunan Abi Dawud 5079 — the father and fatherhood", ur: "سنن ابی داؤد 5079 — باپ اور والدیت", es: "Sunan Abi Dawud 5079 — El padre y la paternidad", fr: "Sunan Abi Dawud 5079 — le père et la paternité", tr: "Sunan Abi Davud 5079 — Baba ve Babalık", id: "Sunan Abi Dawud 5079 — Sang Ayah dan Peran Ayah" }
text: "… بْنُ شُعَيْبٍ، قَالَ أَخْبَرَنِي أَبُو سَعِيدٍ الْفِلَسْطِينِيُّ عَبْدُ الرَّحْمَنِ بْنُ حَسَّانَ، عَنِ الْحَارِثِ بْنِ مُسْلِمٍ، أَنَّهُ أَخْبَرَهُ عَنْ أَبِيهِ، مُسْلِمِ بْنِ الْحَارِثِ التَّمِيمِيِّ عَنْ رَسُولِ اللَّهِ أَنَّهُ أَسَرَّ إِلَيْهِ فَقَالَ \" إِذَا انْصَرَفْتَ مِنْ صَلاَةِ الْمَغْرِبِ فَقُلِ اللَّهُمَّ أَجِرْنِي مِنَ النَّارِ. سَبْعَ مَرَّاتٍ فَإِنَّكَ إِذَا قُلْتَ ذَلِكَ ثُمَّ مِتَّ فِي لَيْلَتِكَ كُتِبَ لَكَ جِوَارٌ مِنْهَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 5079، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5079 (General Behavior (Kitab Al-Adab)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 5079، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 5079 (Conducta General (Kitab Al-Adab)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 5079 (Guide des mœurs), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 5079 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 5079, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
