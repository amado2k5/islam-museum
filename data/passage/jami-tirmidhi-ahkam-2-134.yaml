text: "… التحريم، وكذلك قال أبو يوسف ومحمد: يُكرَه النومُ على فراش الحرير والتوسُّد على وسائده، ومرادُهما التحريم. ثم ذكر عن أبي حنيفة وصاحباه في هذا المعنى، ثم قال : وأما أصحاب مالك، فالمكروه عندهم مرتبة بين الحرام والمباح، ولا يُطلقون عليه …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 134، يرد فيه ذكر المكروه، والمباح، والحرام، والتحريم، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 134, whose wording mentions the disliked (makruh), the permitted (mubah), the forbidden (haram), forbidding (tahrim), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 134 کا اقتباس جس میں مکروہ، مباح، حرام، تحریم، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Tirmidhi, volume numérisé 2, p. 134, dont le texte mentionne le réprouvé (makruh), le permis (mubah), l'interdit (haram), l'interdiction (tahrim), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-Tirmidhi, volumen digitalizado 2, p. 134, cuyo texto menciona lo reprobado (makruh), lo permitido (mubah), lo prohibido (haram), la prohibición (tahrim), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 134. sayfasından, mekruh, helal, haram, yasak ve mekruh sayılan fiillerden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. Bu metin, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh sayılan fiiller, haram fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Jilid 2, halaman 134, yang menyebutkan apa yang dibenci, diperbolehkan, diharamkan, dan yang tidak disukai; dari versi pindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari mengenai amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
