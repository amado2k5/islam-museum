text: "… قال : لما ان حضره الموت بكى فقال له : ما يبكيك؟ فقال: واللّٰه لا ابكى جزعا من الموت ولا دنيا اخلفها بعدى! ولكنى سمعت رسول اللّٰه يقول : انما هما قبضتان فقبضة فى النار وقبضة فى الجنة، ولا ادرى …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 39، يذكر ساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
