label: { ar: "الموطأ 349 — محجن الديلي: إذا جئت فصل مع الناس وإن كنت قد صليت", en: "Muwatta 349", es: "Muwatta 349", fr: "Muwatta 349", ur: "موطا 349", tr: "Al-Muwatta 349 — Muhjin al-Dili: Eğer gelirseniz, daha önce namaz kılmış olsanız bile, insanlarla birlikte namaz kılın.", id: "Al-Muwatta 349 — Muhjin al-Dili: Jika kamu datang, salatlah bersama orang-orang, meskipun kamu sudah salat." }
text: "ما منعك أن تصلي مع الناس؟ ألست برجل مسلم؟"
summary:
  ar: "أول حديث في باب إعادة الصلاة مع الإمام. يرويه يحيى عن مالك عن زيد بن أسلم عن بسر بن محجن الديلي عن أبيه محجن: كان في مجلس مع النبي فأُذّن بالصلاة فقام النبي فصلى ثم رجع ومحجن في مجلسه لم يصل معه، فسأله ما منعه أن يصلي مع الناس وألست برجل مسلم، فأجاب أنه قد صلى في أهله، فقال له النبي: إذا جئت فصل مع الناس وإن كنت قد صليت. ويخرّجه المحقق عند النسائي (2/112) وابن حبان (2405) والحاكم والطبراني وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (4/222). {cite:muwatta-maruf-1997 p.193}"
  tr: "İmamla birlikte namazı tekrarlama bölümündeki ilk hadis. Yahya, Malik'ten, o da Zeyd ibn Aslam'dan, o da Busr ibn Mihcan el-Dili'den, o da babası Mihcan'dan rivayet etmiştir: Mihcan, Peygamberimizle birlikte bir mecliste iken ezan okundu. Peygamberimiz ayağa kalkıp namaz kıldı, sonra geri döndü. Mihcan ise henüz yerinde oturmuş, onunla birlikte namaz kılmamıştı. Peygamberimiz ona, \"Sen Müslüman değil misin?\" diyerek, cemaatle birlikte namaz kılmasını engelleyen şeyin ne olduğunu sordu. Mihcan, evde namaz kıldığını söyledi. Peygamberimiz ona, \"Buraya geldiğinde, daha önce namaz kılmış olsan bile, cemaatle birlikte namaz kıl\" dedi. Bu hadis, Malik'in sahabelerinin rivayet zincirleriyle el-Nasa'i (2/112), İbn Hibban (2405), el-Hakim, el-Taberani, Ahmed ve el-Şafiî'nin hadis derlemelerinde bulunmakta olup, Malik el-Tamhid'e (4/222) atıfta bulunmaktadır."
  id: "Hadits pertama dalam surah ini tentang mengulang salat bersama imam. Diriwayatkan oleh Yahya dari Malik, dari Zaid bin Aslam, dari Busr bin Mihjan al-Dili, dari ayahnya Mihjan: Ia berada dalam suatu perkumpulan bersama Nabi ketika azan dikumandangkan. Nabi berdiri dan salat, kemudian kembali, dan Mihjan masih di tempatnya, belum salat bersamanya. Nabi bertanya kepadanya apa yang menghalanginya untuk salat bersama orang-orang, seraya berkata, \"Bukankah kamu seorang Muslim?\" Ia menjawab bahwa ia telah salat di rumah. Nabi berkata kepadanya, \"Ketika kamu datang, salatlah bersama orang-orang, meskipun kamu telah salat.\" Hadits ini terdapat dalam kumpulan hadits al-Nasa'i (2/112), Ibn Hibban (2405), al-Hakim, al-Tabarani, Ahmad, dan al-Shafi'i, melalui sanad para sahabat Malik, dan beliau merujuk pada al-Tamhid (4/222)."
