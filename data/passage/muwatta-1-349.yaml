label: { ar: "الموطأ 349 — محجن الديلي: إذا جئت فصل مع الناس وإن كنت قد صليت", en: "Muwatta 349" }
text: "ما منعك أن تصلي مع الناس؟ ألست برجل مسلم؟"
summary:
  ar: "أول حديث في باب إعادة الصلاة مع الإمام. يرويه يحيى عن مالك عن زيد بن أسلم عن بسر بن محجن الديلي عن أبيه محجن: كان في مجلس مع النبي فأُذّن بالصلاة فقام النبي فصلى ثم رجع ومحجن في مجلسه لم يصل معه، فسأله ما منعه أن يصلي مع الناس وألست برجل مسلم، فأجاب أنه قد صلى في أهله، فقال له النبي: إذا جئت فصل مع الناس وإن كنت قد صليت. ويخرّجه المحقق عند النسائي (2/112) وابن حبان (2405) والحاكم والطبراني وأحمد والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (4/222). {cite:muwatta-maruf-1997 p.193}"
