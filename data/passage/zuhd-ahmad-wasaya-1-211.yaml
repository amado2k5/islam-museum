  tr: "Ahmed ibn Hanbal'ın \"El-Zuhd\" (Zühd) adlı eserinin 1. cildinin 211. sayfasından, mal varlığı ve mirasından bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Kemaksiatan) karya Ahmad ibn Hanbal, Jilid 1, halaman 211, yang menyebutkan harta dan warisannya; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan makam suci."
