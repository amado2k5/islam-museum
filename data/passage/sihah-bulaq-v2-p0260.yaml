text: |-
  ٣٢٧
  كعويه وأيو قلون ضرب من ثياب الروم يتلون للعيون ألوانا ⁦(قلحم)⁩. القلحم المسنّ وقد
  ذكرناه فى باب الحالان الميم زائدة لذم ابن السكيت القليذم ! ر الغزيرة وقال
  انّ اما قليذماهموماً * يزيدها مخج الدلاجوما
  ويروى قصبحت قليذما لهذم القلهذم البحر المكثيرالماء والقاه ذم أيضا
  الخفيف (قم القمة بالكسرقامة الرجل يقال ألقى عليه فته أى بدنه وفلان حسن
  انقمة والقامة والقومية بمعنى والقمة والقدامة أيضابجاعة الناس والقمة أعلى الرأس
  وأعلى كل شى والمقمة مقمة الثوروكل ذات ظلف يعف شفتيه وقتحه الغسة وقت الشاقمن
  الارض واقتت اذا أكات من المقمة ثم يستعار فيقال اقتمّ الرجل ما على الحوان اذا أكله
  كله وقم فهو رجل مقمّ والمقمة المكنسة وقمت البيت كنسته والقمامة الكناسة والهع
  قام الاضمى يقال لبير البقل القميم وأقمّ الفسل الابل ضربها كاه احتى قت ابن
  السكيت يقال شدالفرص على الجرفتة معها أى تسمها وتقمم أى تتبع القمام فى الكتاسات؟
  وققم اللّٰه عصبه أى جعه وقبضه والتمقمة معروفة قال الاصمعىّ هورومىّ وفى المثل عسلى
  •ذادار المقم أى الى هذا صارمى الخبريضرب للرجل اذا كان خبيرا بالامر وكذلك
  قواهم على يدىّ دار الحديث والجمع قاقم ويقال سيد قاقم بالضم لكثرة خيره والمقام بالفتح
  البحرويقال وقع فى ققام من الامر والقمقام السيد والقمقام العدد الكثير والة مقمان بالضم
  ثله والقمقام بالفتح صغار القردان وضر ب من القمل شديد التشبث بأصول الشعر
  الواحدة تقامة ( نم لقنمة بالتحريك خبث ريح الادهان والزيت وتحوه يقال يدى من
  الزيت قنمة وقد قتم سقاؤه باللكسر قنما أى تمه وقم الجوزفه وقانم أى فاسد والاقانيم الاصول
  واحدها أقنوم وأحسبها رومية ⁦(قوم)⁩ القوم الرجال دون النساء لاواحدله من
  افظه قال زهير وما أدرى وسوف اخال أدرى • أقوم آل حصن أم نساء
  وقال تعالى لا يسخر قوم من قوم ثم قال سهانه ولانسا من نساء وربعادخل النساءفية على
  سبيل التبع لانّ قوم كل نيت رجال ونساء وجمع القوم أقوام وجمع الجمع أقاوم قال أبو صخر
  فان يعذر القلب العشية فى الصبا * فؤاد؛ لا يعذرك فيه الاقاوم
  عنى بالقلب العقل ابن السكيت يقال أقايم وأقاوم والقوم يذكرويؤنث لان أسماء
  الجموع التى لا واحداها من لفظها اذا كان للا دميين يذكرويوتب مثل رهط ونفر وقوم قال
  تعالى وكذب به قومك فذكر وقال تعالى كذبت قوم نوح فأنت فان صغرت لم تدخل فيها الهاء
  وقلت قويم ورهيط وذنيرواتما يلحق التأنيت فعه وتدخل الهاء فيما يكون أغير الا دميين مثل
  الابل والغنم لان التأنيث لازم له وأماجع التك..-يرمثل جال ومساجدوان ذكروأنت فانما
  تريد الجمع اذاذ كرت وتريدابهاعسة اذا أننت وقام الرجل قياما والقومة المرّة الواحدة وقام
  بامر كذاوقام الماعيجد وقامت الداية وقفت وقال الفراءقامت السوق نفقت وقاومه فى
  المصارعة وغيرها وتقاوموافى الحرب أى قام بعضهم لبعض وأقام بالمكان اقامة والهاء!
  عرسمن عين الفعل لانّ أصله اقواما وأقامه من موضعه وأقام الشئ أى أدامه من قوله
  تعالى ويقيمون الصلاة والمقامة بالضم الاقامة والمقامة بالفتح الجاس والجماعة من الناس
