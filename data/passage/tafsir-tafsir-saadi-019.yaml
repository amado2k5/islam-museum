text: ") (فأخرجنا به من كل الثمرات) فهم الذين ينتفعون بما فصل الله في كتابه من الأحكام والمطالب الإلهية، إليهم من ربهم، فيتلقونها مفتقرين إليها كذلك نخرج الموتى من قبورهم، بعدما كانوا رفاتا متمزقين، وهذا فرحين بها، فيتدبرونها ويتأملونها، فيبين لهم"
