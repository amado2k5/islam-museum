text: "إن كان رسول الله ليخفف ركعتي الفجر حتى إني لأقول: أقرأ بأم القرآن أم لا؟"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عائشة مرسلاً، في باب ما جاء في ركعتي الفجر: كان النبي يخفف ركعتي الفجر حتى كانت عائشة تتساءل أقرأ فيهما بفاتحة الكتاب أم لا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وأنه جاء متصلاً من رواية يحيى بن سعيد عن محمد بن عبد الرحمن بن أسعد بن زرارة عن عمرة عن عائشة في الصحيحين (البخاري 1170، مسلم 2/160). {cite:muwatta-maruf-1997 p.186}"
