text: "… وخسين ومائة ولوف يوم الميس لسبع بقين من المحرم سنة تسع وستين ومائة بقزية ولمامات حاد الراوية رثاه أبو يدي عم دين كناسة وهو لقبه واسعه عبد الاعلى بن عبد اللّه بن. وكان ماد المتسكور قليل البضاعة من العربية قبل …"
summary:
  ar: "مقطع من وفيات الأعيان وأنباء أبناء الزمان، المجلد المصوَّر 3، ص 208، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Wafayat al-A'yan wa-Anba' Abna' al-Zaman, scan volume 3, p. 208, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "وفایت الاعیان و انبا ابنا الزمان، اسکین جلد 3، ص 208 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volume numérisé 3, p. 208, qui contient une élégie ou un éloge du défunt; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Wafayat al-A'yan wa-Anba' Abna' al-Zaman, volumen escaneado 3, p. 208, que contiene una elegía o elogio del difunto; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Vafayat al-A'yan wa Anba' Abna' al-Zaman\" (Çağın Önemli Şahsiyetlerinin Biyografileri ve Haberleri) Resimli Cilt 3, sayfa 208'den, vefat etmiş bir kişi için yazılmış bir ağıt ve övgü metni içeren bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve övgü metinlerinin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Biografi Tokoh Terkemuka dan Berita Putra-Putra Zaman), Jilid Bergambar 3, hlm. 208, berisi elegi dan eulogi untuk orang yang telah meninggal; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh seorang perajin yang menelusuri elegi dan eulogi paling terkenal."
