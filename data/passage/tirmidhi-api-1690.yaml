text: "… مُحَمَّدُ بْنُ صُدْرَانَ أَبُو جَعْفَرٍ الْبَصْرِيُّ، حَدَّثَنَا طَالِبُ بْنُ حُجَيْرٍ، عَنْ هُودِ بْنِ عَبْدِ اللَّهِ بْنِ سَعْدٍ، عَنْ جَدِّهِ، مَزِيدَةَ قَالَ دَخَلَ رَسُولُ اللَّهِ يَوْمَ الْفَتْحِ وَعَلَى سَيْفِهِ ذَهَبٌ وَفِضَّةٌ. قَالَ طَالِبٌ فَسَأَلْتُهُ عَنِ الْفِضَّةِ فَقَالَ كَانَتْ قَبِيعَةُ السَّيْفِ فِضَّةً. قَالَ أَبُو عِيسَى وَفِي الْبَابِ عَنْ أَنَسٍ. وَهَذَا حَدِيثٌ غَرِيبٌ. وَجَدُّ هُودٍ اسْمُهُ مَزِيدَةُ الْعَصَرِيُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 1690، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1690 (The Book on Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1690، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
