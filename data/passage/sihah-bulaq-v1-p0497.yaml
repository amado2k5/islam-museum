text: |-
  ١٤٤١
  الارض ذات الحجارة والجرحة بالضم وعاه كانخرج قال أوس بن حجر
  تلاثة أبراد جيادوجرجة * وأدكن من أرى الدبورمعسل
  وبانطاء تصميف والجمع جج.ثل بسرة وبسر ومنه جريجمصغراسم رجل ⁦( لج)⁩ الجلجة
  بالتحريك الجمجعة والرأس يقال على كل حلية كذا والجمع جلج ( وج لحاجة خرزة
  وضيعة لا تساوى شيئا قال الهذنى
  فجاءت كخاصى العير لم تحل عاجة • ولاجاجة منها تلوح على وشم
  صل الحار حيج) حييت الابل بالكسريج حيها اذا نتفذت بطونها عن أكل
  العرفج والضبعة لانه يتعقد فيها ويببس حتق تتمرغ من وجعه وتزحريقال بعير جيح وابل
  حبحى وحباحى مثل حقى وحاقى والحيح الحبق يقال حيح الرحل بالفتح يحيح حبجا أى حبق
  قال اعراتي حيج بهاورب الكعبة وحبحه بالعصاحبجات ضربه بها مثل خيجه وهبحه
  ( جيح الحج القصدورجل محجوح أى مقصود وقدج بنوفلان فلانااذا أطالوا
  الاختلاف الله قال المخبل
  وأشهد من عوف حلولا كثيرة * يحجون سب الزبرقان المزعفرا
  قال ابن السكيت يقول يكنرون الاختلاف اليه هذا الاصل ثم تعورف استعماله فى القصد
  الى مكة للنسك تقول جمجت البيت أجم جافاً ناحاج وربما أظهروا التضعيف فى ضرورة
  الشعر قال الراجز
  بكل شيخ عامر أوحاج * ويجمع على مج مثل بازل وبزل
  وعائدوعوذ وأنشدأبوزيد لجرير
  وكأن عافية الذور عليهم * ج بأسفل ذى المجاز نزول
  والحج بالكسر الاسم والحجة المرة الواحدة وهو من الشواذلان القياس بالنتح والجة السنة
  والجمع الحيج وذوالحجة شهر الحج والجمع ذوات الحجبة وذوات القعدة ولم يقولواذووعلى واحده
  والحة أيصاشجمة الاذن قال لبدد
  يرضن صعاب الدر فى كل حجة * وان لم تسكن أْعناقهن عواطلا
  والجيج الجاج وهو جمع الحاج كما يقال للغزاة غزى وللعادين عسلى أقدامهم عدىّ وامرأة
  حاحسة ونسوة حواج رت اللّٰه عز وجل بالاضافة ادا كن قد حجن وان لم يكن حججن قلت
  حواج بيت اللّٰه فتنصب البيت لانك تريد التنوين فى حواج الا أنه لا ينصرف كما يقال هذا
  ضارب زيداً مس وضارب زيداغدافتدل بحذف التنوبن على أنه قد ضر به وباثبات
  التنوين عسلى أنه لم يضربه وأحججت فلانا اذا بعنته ليحج وقولهم وحجة اللّٰه لا أفعل يفتح
  أوّله وخفض آخره يمين للعرب والحجسة والبرهان تقول حاجه فمعه أى غلبه بالحجة وفى المثل لج
  فيج وهورجل محجاج أى جدل والتحاج التخاسم وحجحته حجافه وحجيج اذا سبرت شحته بالميل
  لتعالجه قال الشاعر
  يحج مأ. ومة فى قعرها بلف * فأست الطبيب قذاها كالمغاديد
  والمحجاج المسيار والجاج والحجاج يفتح الحاء وكسرها العظم الذى ينبت عليه الحاجب والجع
  أحجة قال رؤبة
  صكى حجاجى رأسه وبهزى والمحجة جادّة الطريق والجعجة النكوص
  يقالم
