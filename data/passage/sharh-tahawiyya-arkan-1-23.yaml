text: "… أن أقاتل الناس حتى يشهدوا أن لا إله إلا اللّٰه وأن محمدًا رسول الله ؛ لأن الشهادتين متلازمتان لا تصح إحداهما إلا بالأخرى، فلا بد منهما جميعًا، ولهذا قال النبي واليم بني الإسلام على خمس: شهادة أن لا إله إلا …"
summary:
  ar: "مقطع من شرح العقيدة الطحاوية لابن أبي العز، المجلد المصوَّر 1، ص 23، يذكر ما بُني عليه الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Abi al-'Izz's commentary on the Tahawi creed, scan volume 1, p. 23, that mentions what Islam is built on; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح عقیدہ طحاویہ، ابن ابی العز، اسکین جلد 1، ص 23 کا اقتباس جس میں وہ جن پر اسلام کی بنیاد ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del comentario de Ibn Abi al-'Izz sobre el credo Tahawi, volumen 1, pág. 23, que menciona los fundamentos del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du commentaire d'Ibn Abi al-'Izz sur la doctrine Tahawi (tome 1, p. 23), qui expose les fondements de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Abi el-İzz'in Tahavi'nin İman Bildirgesi üzerine tefsirinin 1. cildinin 23. sayfasından, İslam'ın esaslarını anlatan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esaslarını, imanın esaslarını, imanın dallarını ve müminin özelliklerini kapsayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibn Abi al-Izz tentang Akidah al-Tahawi, Jilid 1, halaman 23, yang menyebutkan dasar-dasar Islam; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
