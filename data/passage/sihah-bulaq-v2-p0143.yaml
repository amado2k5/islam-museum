text: |-
  ٤٤٤
  •⁦(فصل الالف)⁩
  .⁦(١ي)⁩).
  لا ينصرف لانه أفعل وهو معرفة ⁦(أو )⁩. أو حرف اذا دخل اللخبردل على الشسك والابهام
  واذا دخل الامر والنهى دل على التخييرأ والاباحة فأما الشك فكة ولك رأيت زيدا أوعمر
  والابهام كقوله تعالى وانا أوايا كم لعلى هدى أوفى ضلال مبين والتخييركة ولك كل السمك
  أواشرب اللبن أى لاتجمع بينهما والاباحة كقولك بالس الحس-ن أوابن-يرين وقد يكون
  بمعنف الى أن تقول لاضر بنه أويتوب وقد يكون بمع-ف بل فى توسع الكلام قال الساعر
  بدت مثل رن الشمس فى روفق الضحى • وصورتها أوانت فى العين أملح
  يريد يل أنت وقولد تعالى وأرسلناه الى مائة الف أويزيدون بمعدى بل يزيدون ويقال معفاه
  الى مائة ألف عند الناس أويزيدون عند الناس لان اللّٰه تعالى لا ينك ١ أحرف يمدّ
  ويقصر فاذامددت نونت وكذلك سائرحروف الهجاء والالف ينادى بها القريب دون
  البعيد تقول أز يد أقبل بألف مقصورة والالف من حروف المدواللين قاللينة تسمى الالف
  والمتهرّكة تسمى الهمزة وقد يتجوّز فيها فية سال أيضا ألف وهم اجميعا من حروف الزيادة وقد
  تكون الالف ضمير الاثنين فى الافعال نحو فعلا ويفعلان وعلامة التنفية فى الاسماءنحو
  زيدان ورجلان (أ يا الايّة العلامة والاصل أوية بالتحريك قال سيبويه موضع العيز
  من الاية واو لان ما كان موضع العين منه واو واللام ياء أكثر مماموضع العيز واللام منه
  يا آن مثل شويت أكثرمن باب حميت وتكون النسبة اليه أووى قال الفراءهى من الفعل
  فاعلة وانماذهبت من اللام ولوجاءت تامة لجاءت ابية ولسكنها خففت وجممع الايهاء
  وآياى وآيات وأنشد أبوزيد
  لم يبق هذا الدهر من آيائه * غيرأ ثافيه وأرمدائه
  وآية الرجل شخصه تقول منه تاببته على تفاعلته وتأنيته على تفعلته اذا قصدت آيته
  وتعمدته قالت امر ألابنتها
  الحص أدنى لون أبيته • من حثيك الترب على الراكب
  يروى بالمد والقصر أبو عمروخرج القوم ب٦يتهم أى بجماعتهم لم يدءواوراءهم شأ ومعنى
  الا ية من كاب اللّٰه ته الى بجماعة حروف وأنتدابرج بن مسهرالطائى
  خرجنا من النقبين لاحى مثلنا * بأيتفانزجى اللقاح المطافلا
  وتأيا أى توقف وة سكث تقسديره تعيا يقال ليس منزاكم*_ ذا منزل تقية أى منزل تلبث
  وتبس قال الحويدرة
  ومناخ غيرتفيعرسته • قن من الحدثان نابى المصمع
  وأىّ اسم معرب يستفهم بد ويجازى فيمن يعقل وفيمالا يعقل تقول أيهم أخول وأيهم يكرمن
  أكرمه وهو معرفة للاضافة وقد تترك الاضافة وفيه معناها وقد يكون بنزلة الذى فيضاج
  الى صلة تقول أيهم فى الدار أخول وقد يكون نعتاللنكرة تقول مررت برجل أى رجل وأيما
  رجل وحروت باحرأة أية امرأة وباحر أتين أيتما امر أ قير وهذه امرأة أية امرأة وامر أنان
  أيما امر أتين ومازائدة وتقول فى المعرفة هذا زيدأ يما رجل قتنصب أيا على الحال وهذه أمة اللّه
  بتاجارية وتقول أىّ امر أة جاءنك وجاءل وأيا مرأقجاءتك وحررت بجارية أىّ جارية
  وجنيك
