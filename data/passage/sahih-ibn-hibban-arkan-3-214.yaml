text: "… تَحِيَّتَهُ ركْعَتَانٍ فَقُمْ فَارْكَعْهُمَا، قَالَ : فَقُمْتُ فَرَكَعْتُهُمَا ثُمَّ عُدْتُ فَجَلَسْتُ إلَيْهِ، فَقُلْتُ : يَا رَسُولَ اللَّهِ، إِنَّكَ أمَرْتَنِي بالصَّلَاَةِ فَمَا الصَّلاَةُ؟ قالَ: خَيْرُ مَوْضُوعٌ، اسْتَكْثِرْ أوْ اسْتَقِلَّ. قَالَ: قُلْتُ: يَا رسُولَ اللَّهِ، أيُّ الْعَمَلِ أفْضَلُ؟ قالَ : إيمانٌ باللَّهِ …"
summary:
  ar: "مقطع من صحيح ابن حبان، المجلد المصوَّر 3، ص 214، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sahih Ibn Hibban, scan volume 3, p. 214, that mentions faith as the best of deeds, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "صحیح ابن حبان، اسکین جلد 3، ص 214 کا اقتباس جس میں ایمان بہترین عمل، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
