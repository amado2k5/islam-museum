text: "… في الأمور العامة الكلية في كلا قسمي الطب، أعني القسم النظري، والقسم العملي. ثم بعد ذلك أتكلم في كليات أحكام قوى الأدوية المفردة. ثم في جرئياتها. ثم بعد ذلك في الأمراض الواقعة بعضو عضو، فأبتدئ أوَّلاً بتشريح ذلك العضو ومنفعته، …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 9، يذكر الطب والطبيب، والمرض والمريض، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 9, that mentions medicine and the physician, illness and the sick, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
