label: { ar: "الموطأ 2711 — زيد بن أسلم عن عطاء بن يسار: الملكان يشهدان ما يقول العبد لعواده في مرضه", en: "Muwatta 2711" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن عطاء بن يسار أن رسول الله قال: إذا مرض العبد بعث الله إليه ملكين فقال: انظرا ماذا يقول لعواده، فإن هو إذا جاءه حمد الله وأثنى عليه، رفعا ذلك إلى الله وهو أعلم، فيقول: لعبدي عليّ، إن توفيته، أن أدخله الجنة، وإن أنا شفيته أن أبدل له لحما خيرا من لحمه، ودما خيرا من دمه، وأن أكفر عنه سيئاته. ويذكر المحقق قول ابن عبد البر أن الحديث مرسل عند جميع رواة الموطأ، وأن عباد بن كثير الثقفي وصله وهو متروك. {cite:muwatta-maruf-1997 p.529} {cite:muwatta-maruf-1997 p.530}"
