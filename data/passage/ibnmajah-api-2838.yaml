label: { ar: "سنن ابن ماجه 2838 — الأب والأبوة", en: "Sunan Ibn Majah 2838 — the father and fatherhood", ur: "سنن ابن ماجہ 2838 — باپ اور والدیت", es: "Sunan Ibn Majah 2838 — El padre y la paternidad" }
text: "حَدَّثَنَا عَلِيُّ بْنُ مُحَمَّدٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، حَدَّثَنَا أَبُو مَالِكٍ الأَشْجَعِيُّ، عَنْ نُعَيْمِ بْنِ أَبِي هِنْدٍ، عَنِ ابْنِ سَمُرَةَ بْنِ جُنْدُبٍ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ قَتَلَ فَلَهُ السَّلَبُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2838، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2838 (The Chapters on Jihad), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2838، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2838 (Los capítulos sobre la yihad), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
