label: { ar: "الموطأ 2176 — يحيى عن مالك: فيمن هلك وترك أموالا بالعالية والسافلة، إن البعل لا يقسم مع النضح إلا أن يرضى أهله، وأن البعل يقسم مع العين إذا كان يشبهها، وإذا كانت الأموال بأرض واحدة متقاربة يقام كل مال منها ثم يقسم بينهم، والمساكن والدور بهذه المنزلة", en: "Muwatta 2176" }
summary:
  ar: "قال يحيى: سمعت مالكا يقول فيمن هلك وترك أموالا بالعالية والسافلة: إن البعل لا يقسم مع النضح، إلا أن يرضى أهله بذلك. وإن البعل يقسم مع العين، إذا كان يشبهها. وإن الأموال إذا كانت بأرض واحدة، الذي بينهما متقارب، فإنه يقام كل مال منها، ثم يقسم بينهم. والمساكن والدور بهذه المنزلة. {cite:muwatta-maruf-1997 p.292} {cite:muwatta-maruf-1997 p.293}"
