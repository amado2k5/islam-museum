text: "… في المَذْهَبِ ثَلاث سينِين. كِتَابُ البَلاغ السَّادِس، لمن دَخَلَ في الَمَذْهَبِ أربع سينِين. كِتّابُ البَلاغ السَّابع، وفيه نَتيجَةُ المَذْهَبَ والكَشْفُ الأكْبَر !. قال محمَّدُ بن إسْحَاق : قد قَرَأتُهُ ورَأيْتُ فيه أمْرًا عَظِيمًا من إبَاحَةِ المَخْظُورَات والوَضْع من الشَّرَائِع وأصْحَابِها. …"
summary:
  ar: "مقطع من الفهرست لابن النديم، المجلد المصوَّر 1، ص 951، يرد فيه ذكر المباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Nadim's al-Fihrist, scan volume 1, p. 951, whose wording mentions the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الفہرست، ابن الندیم، اسکین جلد 1، ص 951 کا اقتباس جس میں مباح کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Fihrist de Ibn al-Nadim, volume numérisé 1, p. 951, dont le texte mentionne le permis (mubah) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
