  tr: "İbn el-Nadim'in Fihrist adlı eserinin 1. cildinin 951. sayfasından, caiz olan fiillerden bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikası gereği yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar hakkında bilgiler içermektedir."
  id: "Kutipan dari kitab Fihrist karya Ibn al-Nadim, Jilid 1, halaman 951, yang menyebutkan amalan-amalan yang diperbolehkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks tersebut mencakup bagian tentang amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
