label: { ar: "الموطأ 1769 — نافع عن صفية بنت أبي عبيد: أرسلت حفصة عاصم بن عبد الله بن سعد إلى أختها فاطمة بنت عمر لترضعه عشر رضعات ليدخل عليها، ففعلت فكان يدخل عليها", en: "Muwatta 1769", es: "Muwatta 1769", fr: "Muwatta 1769", ur: "موطا 1769", tr: "El-Muvatta 1769 — Safiyye bint Ebu Ubeyd'den rivayet edildiğine göre, Nafi'nin naklettiğine göre: Hafsa, Asim ibn Abdullah ibn Saad'ı kız kardeşi Fatıma bint Ömer'e on defa emzirmesi için gönderdi ki, Asim onunla cinsel ilişkiye girebilsin. Fatıma da öyle yaptı ve Asim onunla cinsel ilişkiye girdi.", id: "Al-Muwatta 1769 — Diriwayatkan oleh Nafi’ dari Safiyyah binti Abi Ubayd: Hafsa mengutus Asim binti Abdullah binti Saad kepada saudara perempuannya, Fatimah binti Umar, untuk menyusuinya sepuluh kali agar ia dapat bersetubuh dengannya. Ia melakukannya, dan Asim pun bersetubuh dengannya." }
summary:
  ar: "يروي مالك عن نافع أن صفية بنت أبي عبيد أخبرته أن حفصة أم المؤمنين أرسلت بعاصم بن عبد الله بن سعد إلى أختها فاطمة بنت عمر بن الخطاب، لترضعه عشر رضعات ليدخل عليها وهو صغير يرضع، ففعلت، فكان يدخل عليها. {cite:muwatta-maruf-1997 p.122}"
  tr: "Malik, Nafi’den rivayetle, Safiyya bint Abi Ubayd’ın kendisine, Müminlerin Annesi Hafsa’nın, Asim ibn Abdullah ibn Sa’d’ı kız kardeşi Fatıma bint Umar ibn al-Khattab’a göndererek, onu on defa emzirmesini ve böylece emzirmeye devam ederken huzuruna girebilmesini istediğini anlattığını aktarır. Fatıma da bunu yapmış ve Asim ibn Abdullah ibn Sa’d onun huzuruna girmiştir. {cite:muwatta-maruf-1997 s.122}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Safiyya binti Abi Ubayd memberitahunya bahwa Hafsa, Ibu Kaum Beriman, mengutus Asim binti Abdullah binti Sa’d kepada saudara perempuannya, Fatima binti Umar binti al-Khattab, memintanya untuk menyusui Asim sepuluh kali agar ia dapat menghadapnya sambil masih menyusui. Fatima pun melakukannya, dan Asim pun dapat menghadapnya. {cite:muwatta-maruf-1997 p.122}"
