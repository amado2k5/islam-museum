label: { ar: "الموطأ 1769 — نافع عن صفية بنت أبي عبيد: أرسلت حفصة عاصم بن عبد الله بن سعد إلى أختها فاطمة بنت عمر لترضعه عشر رضعات ليدخل عليها، ففعلت فكان يدخل عليها", en: "Muwatta 1769" }
summary:
