label: { ar: "الموطأ 896 — بلاغ عمن يثق به من أهل العلم: أُري رسول الله أعمار الناس قبله، فتقاصر أعمار أمته، فأعطاه الله ليلة القدر خير من ألف شهر", en: "Muwatta 896", es: "Muwatta 896", fr: "Muwatta 896", ur: "موطا 896", tr: "El-Muvatta 896 — Güvenilir bir âlimden rivayet: Allah Resulü'ne kendisinden önceki insanların ömürleri gösterildi ve ümmetinin ömrü kısa göründü. Bunun üzerine Allah ona, bin aydan daha hayırlı olan Kadir Gecesi'ni verdi.", id: "Al-Muwatta 896 — Sebuah riwayat dari seorang ulama terpercaya: Rasulullah diperlihatkan umur manusia sebelum beliau, dan umur umat beliau tampak pendek, maka Allah memberikannya kepada beliau Malam Lailatul Qadar, yang lebih baik daripada seribu bulan." }
text: "أُري رسول الله أعمار الناس قبله، فتقاصر أعمار أمته، فأعطاه الله ليلة القدر، خير من ألف شهر"
summary:
  ar: "بلاغ يرويه زياد عن مالك أنه سمع من يثق به من أهل العلم يقول: إن رسول الله أُري أعمار الناس قبله، أو ما شاء الله من ذلك، فكأنه تقاصر أعمار أمته أن لا يبلغوا من العمل مثل الذي بلغ غيرهم في طول العمر، فأعطاه الله ليلة القدر، خير من ألف شهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (890) وسويد (452)، ويقول ابن عبد البر إنه لا يعلمه يُروى مسنداً من وجه من الوجوه، ولا يعرفه في غير الموطأ، وإنه من الرغائب والفضائل لا من الأحكام. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
  tr: "Ziyad'ın Malik'ten rivayet ettiği bir rivayete göre, güvenilir bir âlimden, Allah'ın Resulü'ne kendisinden önceki insanların ömürleri (ya da Allah'ın dilediği gibi) gösterildiğini işitmiştir. Görünüşe göre, ümmetinin ömürlerini, daha uzun yaşayanlar kadar hayırlı amellerde bulunmak için çok kısa bulmuştur. Bu yüzden Allah ona bin aydan daha hayırlı olan Kadir Gecesi'ni nasip etmiştir. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab (890) ve Suveyd (452) tarafından nakledildiğini belirtmektedir. İbn Abdül-Barr ise, bunun herhangi bir kaynaktan isnad zinciriyle rivayet edildiğini veya Muvatta dışında bulunduğunu bilmediğini söylemektedir. Ayrıca bunun hükümlerle değil, tavsiye edilen amellerle ve faziletlerle ilgili olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.430} {cite:muwatta-maruf-1997 s.431}"
  id: "Sebuah riwayat yang dinarasikan oleh Ziyad dari Malik menyatakan bahwa ia mendengar dari seorang ulama terpercaya bahwa Rasulullah diperlihatkan umur manusia sebelum beliau, atau apa pun yang dikehendaki Allah. Tampaknya beliau menganggap umur umatnya terlalu pendek untuk mencapai tingkat amal kebaikan yang sama dengan orang-orang yang hidup lebih lama. Maka Allah menganugerahkan kepadanya Laylat al-Qadr (Malam Lailatul Qadr), yang lebih baik daripada seribu bulan. Peneliti menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab (890) dan Suwaid (452). Ibnu Abd al-Barr mengatakan bahwa ia tidak mengetahui riwayat ini dinarasikan dengan sanad dari sumber mana pun, dan ia juga tidak mengetahui riwayat ini ditemukan di luar kitab al-Muwatta'. Ia juga menyatakan bahwa riwayat ini berkaitan dengan amalan dan keutamaan yang dianjurkan, bukan hukum. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
