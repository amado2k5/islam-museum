label: { ar: "الموطأ 896 — بلاغ عمن يثق به من أهل العلم: أُري رسول الله أعمار الناس قبله، فتقاصر أعمار أمته، فأعطاه الله ليلة القدر خير من ألف شهر", en: "Muwatta 896" }
text: "أُري رسول الله أعمار الناس قبله، فتقاصر أعمار أمته، فأعطاه الله ليلة القدر، خير من ألف شهر"
summary:
  ar: "بلاغ يرويه زياد عن مالك أنه سمع من يثق به من أهل العلم يقول: إن رسول الله أُري أعمار الناس قبله، أو ما شاء الله من ذلك، فكأنه تقاصر أعمار أمته أن لا يبلغوا من العمل مثل الذي بلغ غيرهم في طول العمر، فأعطاه الله ليلة القدر، خير من ألف شهر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (890) وسويد (452)، ويقول ابن عبد البر إنه لا يعلمه يُروى مسنداً من وجه من الوجوه، ولا يعرفه في غير الموطأ، وإنه من الرغائب والفضائل لا من الأحكام. {cite:muwatta-maruf-1997 p.430} {cite:muwatta-maruf-1997 p.431}"
