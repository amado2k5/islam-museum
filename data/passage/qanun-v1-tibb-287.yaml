text: "… يستعمل فيه القيء الأمراض والمالنخوليا والصرع المزمنة العسيرة كالاستسقاء والجذام والنقرس وعرق النسا. والقيء مع منافعه قد يجلب أمراضاً مثل ما يجلب الطرش، ولا يجب أن يوصل به الفصد، بل يؤخر ثلاثة أيام، ولا سيما إذا كان في فم المعدة …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 287، يذكر المرض والمريض، والجذام والبرص، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 287, that mentions illness and the sick, leprosy and vitiligo, named diseases, the organs of the body, surgery, circumcision and splints; from the machine-read scan, quoted within forty words per the sources policy."
