text: "… فيه فلذلك انقسم الدماغ إلى جزأين: أحدهما يميناً، والآخر شمالاً هما لا محالة متساويان في جميع الأقطار وذلك لأن هذه القسمة إنما كانت ليقوم أحد الجزأين بالأفعال الواجبة في الحياة عند فساد الجزء الآخر وإنما يكون ذلك إذا كان أحد …"
