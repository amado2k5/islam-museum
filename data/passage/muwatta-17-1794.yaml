label: { ar: "الموطأ 1794 — مالك: الأمر المجتمع عليه أن من اشترى وليدة فحملت، أو عبدا فأعتقه، أو أمرا فات رده، فقامت البينة أن العيب كان عند البائع، فإن العبد يقوم وبه العيب ويقوم بغير عيب، فيرد من الثمن قدر ما بينهما", en: "Muwatta 1794" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن كل من ابتاع وليدة فحملت، أو عبدا فأعتقه، وكل أمر دخله الفوات حتى لا يستطاع رده، فقامت البينة أنه قد كان به عيب عند الذي باعه، أو علم ذلك باعتراف أو غيره، فإن العبد أو الوليدة يقوم وبه العيب الذي كان به يوم اشتراه، فيرد من الثمن قدر ما بين قيمته صحيحا وقيمته وبه ذلك العيب. {cite:muwatta-maruf-1997 p.135}"
