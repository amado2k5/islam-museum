label: { ar: "الموطأ 1794 — مالك: الأمر المجتمع عليه أن من اشترى وليدة فحملت، أو عبدا فأعتقه، أو أمرا فات رده، فقامت البينة أن العيب كان عند البائع، فإن العبد يقوم وبه العيب ويقوم بغير عيب، فيرد من الثمن قدر ما بينهما", en: "Muwatta 1794", es: "Muwatta 1794", fr: "Muwatta 1794", ur: "موطا 1794", tr: "El-Muvatta 1794 — Malik: İtiraf edilen ilke şudur: Eğer bir kimse cariye satın alır ve cariye hamile kalırsa, veya bir köle satın alıp sonra onu azat ederse, veya kaybolan bir şeyi geri verirse ve kusurun satıcıdan kaynaklandığına dair delil sunulursa, köle kusurlu haliyle ve kusursuz haliyle değerlendirilir ve aradaki fark kadar bir miktar iade edilir.", id: "Al-Muwatta 1794 — Malik: Prinsip yang disepakati adalah jika seseorang membeli seorang budak perempuan yang kemudian hamil, atau seorang budak laki-laki dan kemudian membebaskannya, atau sesuatu yang hilang dan dia mengembalikannya, dan bukti menunjukkan bahwa cacat tersebut ada pada penjual, maka budak tersebut dinilai dengan cacatnya dan budak lainnya dinilai tanpa cacatnya, dan dia mengembalikan dari harga tersebut sejumlah yang sama dengan selisih antara keduanya." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن كل من ابتاع وليدة فحملت، أو عبدا فأعتقه، وكل أمر دخله الفوات حتى لا يستطاع رده، فقامت البينة أنه قد كان به عيب عند الذي باعه، أو علم ذلك باعتراف أو غيره، فإن العبد أو الوليدة يقوم وبه العيب الذي كان به يوم اشتراه، فيرد من الثمن قدر ما بين قيمته صحيحا وقيمته وبه ذلك العيب. {cite:muwatta-maruf-1997 p.135}"
  tr: "Malik şöyle dedi: Bizde yerleşik uygulama şudur: Kim bir cariye satın alır ve cariye hamile kalırsa, ya da bir köleyi azat ederse, ya da geri getirilemeyecek kadar kaybolmuş herhangi bir şeyi satarsa ve bu şeyin satıcının elindeyken kusurlu olduğuna dair veya bu kusurun itiraf yoluyla ya da başka bir şekilde bilindiğine dair delil sunulursa, cariye veya cariye satın alındığı günkü kusuruyla değerlendirilir ve satıcı, sağlam haldeki değeri ile kusurlu haldeki değeri arasındaki farkı fiyattan iade etmek zorundadır. {cite:muwatta-maruf-1997 s.135}"
  id: "Malik berkata: Kebiasaan yang berlaku di antara kita adalah bahwa siapa pun yang membeli seorang budak perempuan yang kemudian hamil, atau seorang budak laki-laki dan kemudian membebaskannya, atau barang apa pun yang telah hilang hingga tidak dapat dikembalikan, dan bukti menunjukkan bahwa barang tersebut memiliki cacat saat berada di tangan penjualnya, atau bahwa hal ini diketahui melalui pengakuan atau cara lain, maka budak laki-laki atau budak perempuan tersebut dinilai berdasarkan cacat yang dimilikinya pada hari pembelian, dan penjual harus mengembalikan sebagian dari harga tersebut sejumlah selisih antara nilainya saat sehat dan nilainya dengan cacat tersebut. {cite:muwatta-maruf-1997 p.135}"
