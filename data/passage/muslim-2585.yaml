label: { ar: "مسلم 2585 — المؤمن للمؤمن كالبنيان", en: "Muslim 2585 — The believer to the believer is like a building", es: "Musulmán 2585 — El creyente para el creyente es como un edificio", fr: "Muslim 2585 — Le croyant est à l'autre croyant comme un édifice", ur: "مسلم 2585 - مومن کے لیے مومن عمارت کی مانند ہے۔", tr: "Müslim 2585 — Mümin, mümin için bir bina gibidir.", id: "Muslim 2585 — Orang beriman bagi orang beriman lainnya seperti sebuah bangunan" }
text: "قال رسول الله: «المؤمن للمؤمن كالبنيان يشد بعضه بعضاً» — وشبك بين أصابعه"
summary:
  ar: "رواية أبي موسى الأشعري في باب تراحم المؤمنين وتعاطفهم من صحيح مسلم؛ شبك أصابعه مثلاً لتماسك المؤمنين — من أشهر أمثال الأخوة في الدواوين."
  tr: "Sahih Müslim'de yer alan, müminlerin şefkati ve empatisi bölümünde Ebu Musa el-Eş'ari'nin rivayetine göre; müminlerin birliğini simgelemek için parmaklarını birbirine kenetlemiştir; bu, Divanlardaki en meşhur kardeşlik örneklerinden biridir."
  id: "Riwayat Abu Musa al-Ash’ari dalam bab tentang kasih sayang dan empati orang-orang beriman dari Sahih Muslim; beliau menyatukan jari-jarinya sebagai contoh persatuan orang-orang beriman — salah satu contoh persaudaraan yang paling terkenal di kalangan Diwan."
