label: { ar: "صحيح البخاري 7432 — دفن وقبر ومرقد", en: "Sahih al-Bukhari 7432 — a burial, grave or resting place", ur: "صحیح بخاری 7432 — تدفین، قبر اور مرقد", es: "Sahih al-Bukhari 7432 — un entierro, tumba o lugar de descanso", fr: "Sahih al-Bukhari 7432 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… سُفْيَانُ عَنْ أَبِيهِ عَنِ ابْنِ أَبِي نُعْمٍ عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ قَالَ بَعَثَ عَلِيٌّ وَهْوَ بِالْيَمَنِ إِلَى النَّبِيِّ بِذُهَيْبَةٍ فِي تُرْبَتِهَا، فَقَسَمَهَا بَيْنَ الأَقْرَعِ بْنِ حَابِسٍ الْحَنْظَلِيِّ ثُمَّ أَحَدِ بَنِي مُجَاشِعٍ، وَبَيْنَ عُيَيْنَةَ بْنِ بَدْرٍ الْفَزَارِيِّ، وَبَيْنَ عَلْقَمَةَ بْنِ عُلاَثَةَ الْعَامِرِيِّ ثُمَّ أَحَدِ بَنِي كِلاَبٍ، وَبَيْنَ زَيْدِ الْخَيْلِ الطَّائِيِّ ثُمَّ أَحَدِ بَنِي نَبْهَانَ، فَتَغَضَّبَتْ قُرَيْشٌ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 7432، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7432 (Oneness, Uniqueness of Allah (Tawheed)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 7432، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7432 (Unicidad de Alá (Tawhid)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en la lista de textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 7432 (L'Unicité d'Allah (Tawhid)), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
