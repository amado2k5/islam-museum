label: { ar: "الموطأ 2643 — مسلم بن أبي مريم عن أبي صالح السمان عن أبي هريرة: تُعرض الأعمال كل جمعة مرتين", en: "Muwatta 2643", es: "Muwatta 2643", fr: "Muwatta 2643", ur: "موطا 2643", tr: "El-Muvatta 2643 — Müslim ibn Ebu Meryem, Ebu Salih el-Samman'dan, o da Ebu Hurayra'dan rivayet ettiğine göre: Ameller her Cuma günü iki defa sunulur.", id: "Al-Muwatta 2643 — Muslim ibn Abi Maryam, berdasarkan riwayat Abu Salih al-Samman, berdasarkan riwayat Abu Hurayrah: Amal amalan dipertunjukkan dua kali setiap hari Jumat" }
summary:
  ar: "يروي مالك عن مسلم بن أبي مريم عن أبي صالح السمان عن أبي هريرة أنه قال: تُعرض أعمال الناس كل جمعة مرتين، يوم الاثنين ويوم الخميس، فيُغفر لكل عبد مؤمن إلا عبدا كانت بينه وبين أخيه شحناء، فيُقال: اتركوا هذين حتى يفيئا. {cite:muwatta-maruf-1997 p.496}"
  tr: "Malik, Müslim ibn Ebu Meryem'den, o da Ebu Salih el-Samman'dan, o da Ebu Hurayra'dan rivayet ederek şöyle buyurmuştur: \"İnsanların amelleri her Cuma günü, Pazartesi ve Perşembe günleri olmak üzere iki defa sunulur ve her mümin kulun günahları affedilir, ancak kardeşiyle düşmanlık besleyen kimse müstesna. Denilir ki: Bu ikisini barışıncaya kadar bırakın.\" {cite:muwatta-maruf-1997 s.496}"
  id: "Malik meriwayatkan dari Muslim ibn Abi Maryam, dari Abu Salih al-Samman, dari Abu Hurayrah, yang berkata: “Amal perbuatan manusia diperlihatkan dua kali setiap hari Jumat, Senin dan Kamis, dan setiap hamba yang beriman diampuni kecuali orang yang bermusuhan dengan saudaranya. Dikatakan: Biarkanlah kedua orang ini sampai mereka berdamai.” {cite:muwatta-maruf-1997 p.496}"
