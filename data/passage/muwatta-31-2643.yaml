summary:
  ar: "يروي مالك عن مسلم بن أبي مريم عن أبي صالح السمان عن أبي هريرة أنه قال: تُعرض أعمال الناس كل جمعة مرتين، يوم الاثنين ويوم الخميس، فيُغفر لكل عبد مؤمن إلا عبدا كانت بينه وبين أخيه شحناء، فيُقال: اتركوا هذين حتى يفيئا. {cite:muwatta-maruf-1997 p.496}"
