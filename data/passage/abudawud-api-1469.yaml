text: "حَدَّثَنَا أَبُو الْوَلِيدِ الطَّيَالِسِيُّ، وَقُتَيْبَةُ بْنُ سَعِيدٍ، وَيَزِيدُ بْنُ خَالِدِ بْنِ مَوْهَبٍ الرَّمْلِيُّ، بِمَعْنَاهُ أَنَّ اللَّيْثَ، حَدَّثَهُمْ عَنْ عَبْدِ اللَّهِ بْنِ أَبِي مُلَيْكَةَ، عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي نَهِيكٍ، عَنْ سَعْدِ بْنِ أَبِي وَقَّاصٍ، - وَقَالَ يَزِيدُ عَنِ ابْنِ أَبِي مُلَيْكَةَ، - عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، وَقَالَ، قُتَيْبَةُ هُوَ فِي كِتَابِي عَنْ سَعِيدِ بْنِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1469، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1469 (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 1469، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
