text: |-
  ٥٢٨:
  .. •⁦(ف صل الفن)⁩
  للغمى وللغمى اذاغم عليهم الهلال وهى ليلة الغمى قال الراجز
  ليلة غمى طامس هلالها • أوغلتها ومكرهايغالها
  ⁦(غنى)⁩ غنى به عنه غنية وغنيت المرأة بزوجهما غنيانا أى استغنت قال قيس بن انظطيم
  أجدبع.رة غنيانها • فتهجر أم شاتناشانها
  وغنى بالمكان أى أقام وغنى أى عاش وأغنيت عنك مغى فلان ومغى فلان ومغناة فلان اذا
  أجزأت عنك مجزاه ويقال ما يغنى عنك هذا أى ما يجدى عنك وما ي.فعك والغانية الحارية
  التى غنيت بزوجها قال بميل
  أحبة الايامى اديتينة أيم • وأحيبت لما أن غنيت الفوانيا
  وقد تكون التى غنيت بحسنها وجمالها وأماقول ابن الرقيات
  لا يارك اللّه فى الغوانى هل • يصن الالهنّ مطلب
  فاعما-رك الياء بالكسر للض مرورة وردّه الى أصله وجائر فى الشهر أن يرد الشئ الى أصله
  والاغنية المغناء والهع الأغانى تقول منه تغنى وغنى بمعنى والغناه بالفتح النفع والغناء بالكسم
  من السماع والغنى مقصور اليسار تقول منه غنى فهوغنىّ وغنى "أيضاحىّ من غطة ان
  وتغنى الرجل أى استغنى وأغناه اللّه وتغانوا أى استغنى بعضهم عن بعض وقال المغيرة بن
  -بن التميمى كلاناغنى عن أخيه حياته • وفحن اذا متنا أشدتغانيا
  والمغنى واحد المغانى وهى المواضع التى كان بها أهلوها وى) الفى الضلال والخيبة
  أيضا وقد غوى بالفتح يغوى غيا وغواية فهوغاو وغور أغراه غسيره فهوغوى عسلى فعيل
  قال الاصمعى لا يقال غيره وأنشد للمرقس
  فن يلق خير ايحمد الناس أمره * ومن يغولا يعدم على المى لائما
  وقال دريدين الصمة
  وهل أنا الامن غزية ان غوت * غويت وان ترشد غزية أرشد
  والتغاوى التجمع والتعاون على الشرّ من الغواية أو الغىّ يقال تغاد واءلى عنمنان
  رضى اللّٰه عنه فقتلوه والغوى مصد رقولك غوى السخلة والفصيل بالسكسريغوى غوى
  قال ابن السكيت هو أن لا يروى من ابا أمّه ولا يروى من اللبن -تيوت هز الاوقال غيره هو
  أن يشرب اللبن حتى يتخم ويفسد جوفه وقال يصف قوساوسهما
  معطفة الاثناءليس فصيلها * برازتهادرًا ولاميت غوى :
  هومصدر والغوعاء المراد بعد الدبى وبه سمى الغوعاء والغاعة من الناس وهم التتكن
  لمختلطون "قال الاصمعى الجراد اذاصارت له أجنحة وكاديطير قبل أن يستقل فيطير غوعا
  وبه شبه الناس وقال أبو عبيدة الغوغاء شئ شبيه بالبعوض الا أنه لا يعض ولا يؤذى وهو
  ضعيف فن صرفه وذ كره جعل بنزلة ققام والهمزة مبددلة من واوومن لم يصرفه جعله بنزلة
  عوراء وغاوام (-لترد من بيقوعاة ، فابرق يأرخك ملبد اللّ وارعد
  ووقع الناس فى أغوية أى فى داهية والمغويات بفتح الواومشددة جمع المفوّاة وهى حفرة.
  سك الزبية
