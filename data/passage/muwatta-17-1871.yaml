label: { ar: "الموطأ 1871 — يحيى عن مالك عن أبي الزناد: سمع سعيد بن المسيب وسليمان بن يسار ينهيان أن يبيع الرجل حنطة بذهب إلى أجل، ثم يشتري بالذهب تمرا قبل أن يقبض الذهب", en: "Muwatta 1871", es: "Muwatta 1871", fr: "Muwatta 1871", ur: "موطا 1871", tr: "El-Muvatta 1871 — Yahya, Malik'ten, o da Ebu el-Zinad'dan rivayetle: Said bin el-Musayyab ve Süleyman bin Yasar'ın, bir adamın buğdayı altın karşılığında kredili olarak satıp, altını almadan önce o altınla hurma almasını yasakladıklarını işitti.", id: "Al-Muwatta 1871 — Yahya, berdasarkan riwayat Malik, berdasarkan riwayat Abu al-Zinad: Dia mendengar Saeed bin al-Musayyab dan Sulayman bin Yasar melarang seseorang menjual gandum dengan emas secara kredit, kemudian membeli kurma dengan emas tersebut sebelum menerima emasnya." }
summary:
  ar: "يروي يحيى عن مالك عن أبي الزناد أنه سمع سعيد بن المسيب وسليمان بن يسار ينهيان أن يبيع الرجل حنطة بذهب إلى أجل، ثم يشتري بالذهب تمرا قبل أن يقبض الذهب. {cite:muwatta-maruf-1997 p.170}"
  tr: "Yahya, Malik'ten, o da Ebu el-Zinad'dan rivayet ettiğine göre, Sa'id ibn el-Musayyab ve Süleyman ibn Yasar'ın bir adamın buğdayı altın karşılığında kredili olarak satmasını, sonra da altını teslim almadan önce o altınla hurma almasını yasakladıklarını işitmiştir. {cite:muwatta-maruf-1997 s.170}"
  id: "Yahya meriwayatkan dari Malik, dari Abu al-Zinad, bahwa ia mendengar Sa'id ibn al-Musayyab dan Sulayman ibn Yasar melarang seseorang menjual gandum dengan emas secara kredit, kemudian membeli kurma dengan emas tersebut sebelum mengambil alih kepemilikan emas. {cite:muwatta-maruf-1997 p.170}"
