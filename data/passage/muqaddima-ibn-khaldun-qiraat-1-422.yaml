text: "… لهذا العهد بأيدي الناس في العالم أصول عتيقة تشهد ببلوغ الغاية لهم في ذلك، وأهل الآفاق يتناقلونها إلى الآن ويشدون عليها يد الضّنانة. ولقد ذهبت هذه الرسوم لهذا العهد جملة بالمغرب وأهله، لانقطاع صناعة الخط والضبط والرواية منه بانتقاص عمرانه …"
summary:
