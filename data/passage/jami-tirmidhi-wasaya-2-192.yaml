text: "… ولم يوقف منه على كذب. وقال النووي في شرح مقدمة مسلم : وثقه كثيرون من كبار أئمة السلف أو أكثرهم. اه. فالصواب إذن تعديله وتوثيقه، فلذلك حسَن الترمذي حديثه هذا، وصحَّح له حديث: لا وصية لوارث، وعلى ذلك سار مسلم …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 192، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
