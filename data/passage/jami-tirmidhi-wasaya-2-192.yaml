  fr: "Extrait du Jami' al-Tirmidhi, volume 2, page 192, mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 192. sayfasından bir alıntı, bir vasiyetname veya nihai miras belgesinden ve geride bıraktığı mal ve miraslardan bahsetmektedir; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 192, menyebutkan wasiat atau surat wasiat terakhir, dan apa yang ditinggalkannya dalam hal harta warisan; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Wills, Inheritances, Antiquities, and Shrines Browser."
