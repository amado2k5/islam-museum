text: "… ولم يوقف منه على كذب. وقال النووي في شرح مقدمة مسلم : وثقه كثيرون من كبار أئمة السلف أو أكثرهم. اه. فالصواب إذن تعديله وتوثيقه، فلذلك حسَن الترمذي حديثه هذا، وصحَّح له حديث: لا وصية لوارث، وعلى ذلك سار مسلم …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 192، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 192, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 192 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
