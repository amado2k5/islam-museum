label: { ar: "الموطأ 2203 — مالك عن نافع: أن عبد الله بن عمر ورث حفصة بنت عمر دارها، وكانت حفصة قد أسكنت بنت زيد بن الخطاب ما عاشت، فلما توفيت قبض عبد الله المسكن ورأى أنه له", en: "Muwatta 2203", es: "Muwatta 2203", fr: "Muwatta 2203", ur: "موطا 2203", tr: "El-Muvatta 2203 — Malik, Nafi’den rivayet ettiğine göre: Abdullah bin Ömer, Hafsa bint Ömer’in evini miras aldı ve Hafsa, Zeyd bin El-Hattab’ın kızının ömrünün sonuna kadar orada yaşamasına izin verdi. Hafsa vefat edince, Abdullah evi devraldı ve kendi evi olarak kabul etti.", id: "Al-Muwatta 2203 — Malik berdasarkan riwayat Nafi’: bahwa Abdullah bin Umar mewarisi rumah Hafsa bint Umar, dan Hafsa mengizinkan putri Zayd bin Al-Khattab untuk tinggal di sana selama sisa hidupnya. Ketika dia meninggal, Abdullah mengambil alih rumah itu dan menganggapnya sebagai miliknya." }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر ورث حفصة بنت عمر دارها، قال: وكانت حفصة قد أسكنت بنت زيد بن الخطاب ما عاشت. فلما توفيت بنت زيد بن الخطاب قبض عبد الله بن عمر المسكن، ورأى أنه له. {cite:muwatta-maruf-1997 p.303}"
  tr: "Malik, Nafi’den rivayetle Abdullah ibn Umar’ın Hafsa bint Umar’ın evini miras aldığını söyler. Şöyle demiştir: Hafsa, Zeyd ibn el-Hattab’ın kızının ömrü boyunca orada yaşamasına izin vermişti. Zeyd ibn el-Hattab’ın kızı vefat edince, Abdullah ibn Umar evi kendi malıymış gibi sahiplendi. {cite:muwatta-maruf-1997 s.303}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar mewarisi rumah Hafsa bint Umar. Ia berkata: Hafsa mengizinkan putri Zayd ibn al-Khattab untuk tinggal di sana selama hidupnya. Ketika putri Zayd ibn al-Khattab meninggal, Abdullah ibn Umar mengambil alih rumah itu, menganggapnya sebagai miliknya sendiri. {cite:muwatta-maruf-1997 p.303}"
