label: { ar: "الموطأ 2203 — مالك عن نافع: أن عبد الله بن عمر ورث حفصة بنت عمر دارها، وكانت حفصة قد أسكنت بنت زيد بن الخطاب ما عاشت، فلما توفيت قبض عبد الله المسكن ورأى أنه له", en: "Muwatta 2203" }
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر ورث حفصة بنت عمر دارها، قال: وكانت حفصة قد أسكنت بنت زيد بن الخطاب ما عاشت. فلما توفيت بنت زيد بن الخطاب قبض عبد الله بن عمر المسكن، ورأى أنه له. {cite:muwatta-maruf-1997 p.303}"
