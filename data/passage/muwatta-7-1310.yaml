label: { ar: "الموطأ 1310 — مالك في الذي يشتري حرا أو عبدا من أرض العدو في المفاداة أو التجارة: الحر دين عليه، والعبد يخير سيده الأول", en: "Muwatta 1310", es: "Muwatta 1310", fr: "Muwatta 1310", ur: "موطا 1310", tr: "El-Muvatta 1310 — Malik, düşman topraklarından fidye veya takas yoluyla bir hür veya köle satın alan kişi hakkında: hür kişi onun borcudur ve kölenin ilk efendisine iade etme seçeneği vardır.", id: "Al-Muwatta 1310 — Malik tentang orang yang membeli orang merdeka atau budak dari wilayah musuh sebagai tebusan atau perdagangan: orang merdeka itu adalah hutang yang harus ditanggungnya, dan budak itu memiliki pilihan dari tuan pertamanya." }
summary:
  ar: "سئل مالك عن الرجل يخرج إلى أرض العدو في المفاداة أو التجارة، فيشتري الحر أو العبد، أو يوهبان له. فقال أما الحر فإن ما اشتراه به دين عليه ولا يسترق، وإن كان وهب له فهو حر، وليس عليه شيء، إلا أن يكون الرجل أعطى فيه شيئا مكافأة فهو دين على الحر. وأما العبد فإن سيده الأول مخير فيه، إن شاء أن يأخذه ويدفع إلى الذي اشتراه ثمنه، وإن أحب أن يسلمه أسلمه. {cite:muwatta-maruf-1997 p.584}"
  tr: "Malik'e, fidye veya ticaret için düşman topraklarına giden ve özgür bir kişiyi veya köleyi satın alan ya da kendisine hediye olarak verilen kişiler hakkında soru soruldu. Şöyle dedi: Özgür kişiye gelince, onu satın aldığı şey onun borcudur ve köle değildir. Eğer hediye olarak verilmişse, özgürdür ve hiçbir borcu yoktur; ancak adam ona bir bedel ödemişse, bu özgür kişinin borcudur. Köleye gelince, asıl efendisinin onunla ilgili seçeneği vardır; isterse onu geri alıp satın alana bedelini ödeyebilir veya isterse onu teslim edebilir. {cite:muwatta-maruf-1997 s.584}"
  id: "Malik ditanya tentang seorang pria yang pergi ke wilayah musuh untuk meminta tebusan atau berdagang, dan membeli orang merdeka atau budak, atau mereka diberikan kepadanya sebagai hadiah. Dia berkata: Adapun orang merdeka, apa yang dibelinya adalah hutang baginya, dan dia tidak diperbudak. Jika dia diberikan sebagai hadiah, maka dia merdeka, dan dia tidak berhutang apa pun, kecuali jika orang itu memberinya sesuatu sebagai kompensasi, dalam hal ini itu adalah hutang bagi orang merdeka tersebut. Adapun budak, tuannya yang semula memiliki pilihan mengenai dirinya; jika ia mau, ia dapat mengambilnya kembali dan membayar harga kepada orang yang membelinya, atau jika ia mau, ia dapat menyerahkannya. {cite:muwatta-maruf-1997 p.584}"
