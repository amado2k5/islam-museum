label: { ar: "الموطأ 1310 — مالك في الذي يشتري حرا أو عبدا من أرض العدو في المفاداة أو التجارة: الحر دين عليه، والعبد يخير سيده الأول", en: "Muwatta 1310" }
summary:
  ar: "سئل مالك عن الرجل يخرج إلى أرض العدو في المفاداة أو التجارة، فيشتري الحر أو العبد، أو يوهبان له. فقال أما الحر فإن ما اشتراه به دين عليه ولا يسترق، وإن كان وهب له فهو حر، وليس عليه شيء، إلا أن يكون الرجل أعطى فيه شيئا مكافأة فهو دين على الحر. وأما العبد فإن سيده الأول مخير فيه، إن شاء أن يأخذه ويدفع إلى الذي اشتراه ثمنه، وإن أحب أن يسلمه أسلمه. {cite:muwatta-maruf-1997 p.584}"
