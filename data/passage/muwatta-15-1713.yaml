label: { ar: "الموطأ 1713 — مالك: الرجل يقول لامرأته أنت الطلاق، وكل امرأة أنكحها فهي طالق، ومالي صدقة إن لم يفعل كذا فحنث: امرأته تطلق كما قال، وأما كل امرأة فلا يلزمه إلا بتسمية، ويتصدق بثلث ماله", en: "Muwatta 1713", es: "Muwatta 1713", fr: "Muwatta 1713", ur: "موطا 1713", tr: "El-Muvatta 1713 — Malik: Bir adam karısına, “Sen boşanıyorsun,” ve “Evlendiğim her kadın boşanır,” ve “Şunu şunu yapmazsam malım sadaka olur,” der ve yeminini bozar: dediği gibi karısı boşanır, fakat her kadın için, onu belirtmedikçe boşanmak zorunda değildir ve malının üçte birini sadaka olarak verir.", id: "Al-Muwatta 1713 — Malik: Seorang pria berkata kepada istrinya, “Kamu diceraikan,” dan “Setiap wanita yang kunikahi akan diceraikan,” dan “Hartaku akan menjadi sedekah jika aku tidak melakukan ini dan itu,” lalu dia melanggar sumpahnya: istrinya diceraikan sebagaimana yang dikatakannya, tetapi untuk setiap wanita, dia tidak wajib menceraikannya kecuali jika dia menyebutkannya secara khusus, dan dia memberikan sepertiga dari hartanya untuk sedekah." }
summary:
  ar: "يقول مالك في الرجل يقول لامرأته أنت الطلاق، وكل امرأة أنكحها فهي طالق، ومالي صدقة إن لم يفعل كذا وكذا، فحنث، قال أما نساؤه فطلاق كما قال، وأما قوله كل امرأة أنكحها فهي طالق، فإنه إذا لم يسم امرأة بعينها، أو قبيلة، أو أرضا، أو نحو هذا، فليس يلزمه ذلك، وليتزوج ما شاء، وأما ماله فليتصدق بثلثه. {cite:muwatta-maruf-1997 p.98}"
  tr: "Malik, karısına, \"Sen boşandın, evlendiğim her kadın da boşanacak ve eğer şunu şunu yapmazsam servetim sadaka olacak\" diyen ve sonra yeminini bozan bir adam hakkında şöyle demiştir: Karıları, dediği gibi boşanmışlardır. \"Evlendiğim her kadın boşanacak\" sözüne gelince, eğer belirli bir kadın, kabile, toprak veya benzeri bir şey belirtmemişse, buna bağlı değildir ve dilediğiyle evlenebilir. Servetine gelince, üçte birini sadaka olarak vermelidir. {cite:muwatta-maruf-1997 s.98}"
  id: "Malik berkata mengenai seorang pria yang berkata kepada istrinya, \"Engkau diceraikan, dan setiap wanita yang kunikahi juga diceraikan, dan hartaku adalah sedekah jika dia tidak melakukan ini dan itu,\" lalu dia melanggar sumpahnya: Adapun istri-istrinya, mereka diceraikan sebagaimana yang dia katakan. Adapun pernyataannya, \"Setiap wanita yang kunikahi juga diceraikan,\" jika dia tidak menyebutkan wanita tertentu, suku, tanah, atau hal serupa, maka dia tidak terikat olehnya, dan dia boleh menikahi siapa pun yang dia inginkan. Adapun hartanya, dia harus memberikan sepertiganya sebagai sedekah. {cite:muwatta-maruf-1997 p.98}"
