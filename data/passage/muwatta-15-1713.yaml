label: { ar: "الموطأ 1713 — مالك: الرجل يقول لامرأته أنت الطلاق، وكل امرأة أنكحها فهي طالق، ومالي صدقة إن لم يفعل كذا فحنث: امرأته تطلق كما قال، وأما كل امرأة فلا يلزمه إلا بتسمية، ويتصدق بثلث ماله", en: "Muwatta 1713" }
summary:
  ar: "يقول مالك في الرجل يقول لامرأته أنت الطلاق، وكل امرأة أنكحها فهي طالق، ومالي صدقة إن لم يفعل كذا وكذا، فحنث، قال أما نساؤه فطلاق كما قال، وأما قوله كل امرأة أنكحها فهي طالق، فإنه إذا لم يسم امرأة بعينها، أو قبيلة، أو أرضا، أو نحو هذا، فليس يلزمه ذلك، وليتزوج ما شاء، وأما ماله فليتصدق بثلثه. {cite:muwatta-maruf-1997 p.98}"
