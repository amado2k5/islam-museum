text: "… جُبير. ابن العربيّ: والصحيح أنه واجب في الجميع؛ وأوّله الخطبة. وبه قال علماؤنا؛ إلا عبد الملك بن الماجِشُون فإنه رآها سُنّة. والدليل على وجوبها أنها تُحَرِّم البيع ولولا وجوبها ما حَرّمته؛ لأن المستحبّ لا يُحَرِّم المَباح. وإذا قلنا: إن المراد …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 6854، يرد فيه ذكر الواجب، والوجوب، والمستحب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
