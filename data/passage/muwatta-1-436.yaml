label: { ar: "الموطأ 436 — عبد الكريم: من كلام النبوة إذا لم تستحي فافعل ما شئت، ووضع اليمنى على اليسرى", en: "Muwatta 436", es: "Muwatta 436", fr: "Muwatta 436", ur: "موطا 436", tr: "El-Muvatta 436 — Abdül Kerim: Peygamberin sözlerinden: Eğer utanmazsanız, dilediğinizi yapın ve sağ elinizi sol elinizin üzerine koyun.", id: "Al-Muwatta 436 — Abdul Karim: Dari sabda Nabi: Jika kamu tidak merasa malu, maka lakukanlah sesukamu, dan letakkan tangan kanan di atas tangan kiri." }
text: "إذا لم تستحي فافعل ما شئت"
summary:
  ar: "أول أثر في باب وضع اليدين إحداهما على الأخرى في الصلاة. يرويه يحيى عن مالك عن عبد الكريم بن أبي المخارق البصري قوله: من كلام النبوة: إذا لم تستحي فافعل ما شئت، ووضع اليدين إحداهما على الأخرى في الصلاة يضع اليمنى على اليسرى، وتعجيل الفطر والاستئناء بالسحور. ويبين المحقق أن ما نقله مالك عن شيخه الضعيف عبد الكريم ثلاثة أحاديث معروفة: الأول عند البخاري من حديث أبي مسعود الأنصاري، والثاني حديث سهل بن سعد الآتي بعده، والثالث حديث تعجيل الفطر وتأخير السحور الصحيح من حديث ابن عباس وغيره؛ ويرى أن مالكاً لم يرو عن عبد الكريم حديثاً مرفوعاً وإنما نقل من قوله ما هو شائع من الأحاديث الصحيحة، فليس من باب الرواية. {cite:muwatta-maruf-1997 p.225}"
  tr: "Namazda bir elin diğerinin üzerine konulması konusundaki ilk hadis, Yahya'nın Malik'ten, o da Abdülkerim ibn Ebu el-Mukharrik el-Basri'den rivayet ettiği ve şöyle dediği bir hadistir: \"Peygamberimizin şu sözünden: 'Eğer utanmıyorsanız, dilediğinizi yapın.' Namazda bir elin diğerinin üzerine konulması, sağ elin sol elin üzerine konulması anlamına gelir. Buna orucun erken açılması ve sahur yemeğinin geciktirilmesi de dahildir.\" Araştırmacı, Malik'in zayıf hocası Abdülkerim'den naklettiği hadislerin üç bilinen hadis olduğunu açıklıyor: Birincisi Buhari'de Ebu Mes'ud el-Ensari tarafından rivayet edilen hadis; ikincisi Sahl ibn Sa'd'ın hadisi; üçüncüsü ise orucun erken açılması ve sahur yemeğinin geciktirilmesiyle ilgili İbn Abbas ve diğerleri tarafından rivayet edilen sahih hadis. Ona göre Malik, Abdülkerim'den rivayet edilen ve Peygamberimize kadar uzanan bir hadis değil, sahih hadislerden bilinen bir hadisi nakletmiştir. Bu nedenle, hadis rivayeti olarak kabul edilmez. {cite:muwatta-maruf-1997 s.225}"
  id: "Hadits pertama tentang meletakkan satu tangan di atas tangan lainnya saat shalat diriwayatkan oleh Yahya dari Malik, dari Abd al-Karim ibn Abi al-Mukharriq al-Basri, yang berkata: \"Dari sabda Nabi: 'Jika kamu tidak malu, maka lakukanlah sesukamu.' Meletakkan satu tangan di atas tangan lainnya saat shalat berarti meletakkan tangan kanan di atas tangan kiri. Termasuk juga mempercepat berbuka puasa dan menunda makan sahur.\" Peneliti menjelaskan bahwa apa yang diriwayatkan Malik dari gurunya yang lemah, Abd al-Karim, adalah tiga hadits terkenal: yang pertama terdapat dalam Bukhari, diriwayatkan oleh Abu Mas'ud al-Ansari; yang kedua adalah hadits Sahl ibn Sa'd, yang akan dibahas selanjutnya; dan yang ketiga adalah hadits sahih tentang mempercepat berbuka puasa dan menunda makan sahur, diriwayatkan oleh Ibn Abbas dan lainnya. Ia berpendapat bahwa Malik tidak meriwayatkan hadits yang berasal dari Nabi Muhammad SAW dari Abd al-Karim, melainkan meriwayatkan apa yang umum diketahui dari hadits-hadits sahih. Oleh karena itu, hal tersebut tidak dianggap sebagai riwayat hadits. {cite:muwatta-maruf-1997 p.225}"
