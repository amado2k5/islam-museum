label: { ar: "الموطأ 436 — عبد الكريم: من كلام النبوة إذا لم تستحي فافعل ما شئت، ووضع اليمنى على اليسرى", en: "Muwatta 436" }
text: "إذا لم تستحي فافعل ما شئت"
summary:
  ar: "أول أثر في باب وضع اليدين إحداهما على الأخرى في الصلاة. يرويه يحيى عن مالك عن عبد الكريم بن أبي المخارق البصري قوله: من كلام النبوة: إذا لم تستحي فافعل ما شئت، ووضع اليدين إحداهما على الأخرى في الصلاة يضع اليمنى على اليسرى، وتعجيل الفطر والاستئناء بالسحور. ويبين المحقق أن ما نقله مالك عن شيخه الضعيف عبد الكريم ثلاثة أحاديث معروفة: الأول عند البخاري من حديث أبي مسعود الأنصاري، والثاني حديث سهل بن سعد الآتي بعده، والثالث حديث تعجيل الفطر وتأخير السحور الصحيح من حديث ابن عباس وغيره؛ ويرى أن مالكاً لم يرو عن عبد الكريم حديثاً مرفوعاً وإنما نقل من قوله ما هو شائع من الأحاديث الصحيحة، فليس من باب الرواية. {cite:muwatta-maruf-1997 p.225}"
