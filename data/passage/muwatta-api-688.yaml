label: { ar: "موطأ مالك 688 — عدد الحسنات، مضاعفة الحسنة بعشر أمثالها", en: "Muwatta Malik 688 — a stated number of good deeds; the good deed multiplied tenfold and beyond", ur: "موطأ مالک 688 — نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ أَبِي الزِّنَادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" وَالَّذِي نَفْسِي بِيَدِهِ لَخُلُوفُ فَمِ الصَّائِمِ أَطْيَبُ عِنْدَ اللَّهِ مِنْ رِيحِ الْمِسْكِ إِنَّمَا يَذَرُ شَهْوَتَهُ وَطَعَامَهُ وَشَرَابَهُ مِنْ أَجْلِي فَالصِّيَامُ لِي وَأَنَا أَجْزِي بِهِ كُلُّ حَسَنَةٍ بِعَشْرِ أَمْثَالِهَا إِلَى سَبْعِمِائَةِ ضِعْفٍ إِلاَّ الصِّيَامَ فَهُوَ لِي وَأَنَا أَجْزِي بِهِ \"."
summary:
  ar: "حديث في موطأ مالك، رقم 688، يذكر عدد الحسنات، ومضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 688 (Fasting), that speaks of a stated number of good deeds, the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 688، جس میں نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
