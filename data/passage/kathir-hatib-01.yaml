  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Sira al-Nabawiyya, sur la bataille de Hudaybiyyah, tiré de la copie extraite; cité en quarante mots conformément à la politique des sources."
  ur: "ابن کثیر کی السیرۃ النبویہ سے ایک اقتباس، جنگ حدیبیہ میں، اخذ کردہ نقل سے؛ ذرائع کی پالیسی کے مطابق چالیس الفاظ کے اندر حوالہ دیا گیا ہے۔"
  tr: "İbn Kathir'in Peygamber biyografisinden, Hudeybiye Savaşı hakkındaki bölümden, kaynakların politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanan bir bölüm."
  id: "Cuplikan dari biografi Nabi karya Ibnu Katsir, tentang Perang Hudaybiyyah, dari versi yang diekstrak; teks dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber."
