text: "على بن أبى طالب والزبير بن العوام فقال : « أدرِكا امرأةً قد كتب معها حاطبُ بن أبى بَلتعة بكتاب إلى قريش يحذِّرهم ماقد أجمعنا له من أمرهم » . فحر جا حتى أدركاها بالحكيفة حليفة بنى أبى…"
