label:
  ar: "مسلم 2246b — يؤذيني ابن آدم يسب الدهر وأنا الدهر"
  en: "Muslim 2246b — The son of Adam wrongs Me by cursing time, and I am time"
  ur: "مسلم 2246b — ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں"
text: "قال الله عز وجل يؤذيني ابن آدم يسب الدهر وأنا الدهر أقلب الليل والنهار ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2246b: يؤذيني ابن آدم يسب الدهر وأنا الدهر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2246b: The son of Adam wrongs Me by cursing time, and I am time. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2246b: ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
