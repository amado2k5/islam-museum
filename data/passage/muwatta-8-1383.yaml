label: { ar: "الموطأ 1383 — مالك: بلغه أن النبي كان يقول لا ومقلب القلوب", en: "Muwatta 1383", es: "Muwatta 1383", fr: "Muwatta 1383", ur: "موطا 1383", tr: "El-Muvatta 1383 — Malik: Peygamberin şöyle buyurduğu kendisine bildirildi: “Hayır, kalpleri çeviren de O'dur.”", id: "Al-Muwatta 1383 — Malik: Dia diberitahu bahwa Nabi biasa berkata, “Tidak, dan Yang Maha Membalikkan hati.”" }
text: "لا. وَمُقَلِّبِ الْقُلُوبِ"
summary:
  ar: "بلغ مالكا أن رسول الله كان يقول لا ومقلب القلوب. ويذكر المحقق أن هذا البلاغ يستند من وجه صحيح عن موسى بن عقبة عن سالم عن أبيه، وأنه في البخاري. {cite:muwatta-maruf-1997 p.617}"
  tr: "Malik, Allah Resulü'nün \"Hayır, kalpleri çeviren Allah'a yemin ederim ki\" dediğini rivayet etmiştir. Araştırmacı, bu rivayetin Musa ibn Uqba'dan, Salim'den, babasından gelen sağlam bir isnad zincirine dayandığını ve Buhari'de bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.617}"
  id: "Malik meriwayatkan bahwa Rasulullah SAW biasa berkata, \"Tidak, demi Yang Maha Pengubah hati.\" Peneliti menyebutkan bahwa riwayat ini berdasarkan sanad yang sahih dari Musa bin Uqba, dari Salim, dari ayahnya, dan terdapat dalam Bukhari. {cite:muwatta-maruf-1997 p.617}"
