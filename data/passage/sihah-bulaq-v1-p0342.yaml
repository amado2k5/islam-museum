text: |-
  (جود
  ٢٩٩
  لم تحالف ويقال الهرات عبر والحرث وضبة وهم اخوة لأم وذلك ان امرأمن اليمن وأن
  ى المنام أنه خرج من فرجهاثلاث جمرات فتزوّجهارجل من اليمن فولدت ه الحرث بن كعب
  ابن عبد المدان وهم أشراف الير ثم تزوجه ابغيض بن ريت فولدت له عدا وهم فرسان
  العرب ثم تزوجها أدّفولدت له ضبة فجمرتان فى مضر وجهرة فى الين والجرة واحدة ججرات
  لمناسك وهى ثلاث جرات يرمين بالهاروالجرة الحصاة والمجمرة واحدة الجامر وكذلا المجم
  والمجمر فبالكسراسم الشى الدى يجعل فيه الجر وبالضم الذى هي له الهر يقال أحرن
  لنار مجم راوينشدهذا البيت بالوجهين
  لا يصطلى النار الامجرا أربا • قد كسرت من يتجوج له وقصا
  والجهارشهم النخل وجرت النخلة قطعت بمارها والتجمير أ يضارى البهار وتجه الجبس
  أن تحبسه-م فى أرس العدوّولا تقفاهم من الثغر وتجمرواهم أى تحبوا ومنه التجمير
  فى الشعر دقال جرب المرأة شهوها اذا يجعته وعقدته فى قفاها ولم ترسله وفى الحديث الضافر
  والملبدوالجمر عليهم الحلق وأجرالبعبر أسرع فى سيره ولا تتل أجز بالزاى قال لبيد
  واذاحركت غرزى أجرت * أوقرابى عدوجون قد أبل
  وأجر الوم على الشّاجتمع وا عليه وهذاجميرااة وم أى مجتمعهم وابنساحير الليل والتهار
  سميا بذلك للاجتماع كما سميا ابسامعير لانه يسمرفيه مارأما ابن بحير فالليل النظلم قال الشاعو
  نهارهم ظمان ضاح وليلهم * وان كان بدراظلمة ابن حير
  والاستجمار الاستاء بالاحجار وحافر مجمرأى صاب والجيمراسم موضع والمجيمر جبل
  قال امر والقيس كان ذرى رأس المجيمر غدوة • من السيل والغنا فلكة مغزل
  ⁦(جر)⁩ جعر الجاراذاجع نفسليكدم ( هر قال الاصمعى الجهورالريلة
  المشرفة على ماحواها وهى المجتمعة وفى حدين موسى بن طلحة أنه شهددف رجل فقال
  جهرواقيره بجهرة أى اجعواعليه النراب ولا تطينوه والجهور ( ١ من الناس جلهم
  دموت عليه الخبراذا أخبرته بطرف وكتمت الذى تريد ور) الجور الميل عن القصد
  بقال جارع الطريق وجار عليه فى الحسكم وجوّره تجو يرانسبه الى الجوروضر به فجوّره
  أى صرعه مثل كوّره متجوّروقال رجل من ربيعة الجوع
  ففلاطارد -تى أغدرا * و-ط الغبارحر بامجورا
  وجوراسم بلديذ كرويؤنت والجار الذى يجاورل تقول جاورته مجاورة وجوارا وجوارا
  والكسر أفصح وتجاور القوم واجتور وا بمعنى وانماصحت الواو فى اجتوروا لانه فى معنى
  مالا يدله من أن يخرج على الاصل لسكون ما قبله وهو تجاوروافبى عليه ولولم يكن معناهما
  واحد الاعتلت والمجاورة الاعتكاف فى المسحد وفى الحديث كان يجادر في
  العشر الاواخر وامى أة الرجل جارته قال الاعشى
  أجارتنابين فانك طالة← • كذاك أمور الناس غاد وطارقه
  والجار الذى أجرته من أن يظلمه ظالم قال الهذلى
  وكنت اذاجارى دعالمضوفة • أشمر حق ينصف الساق متزرى
  ١ ب ضم الجيم وحكى الشهاب
  فى شرح الشفا ان قوما يفتحونها
  وهو غريب اه
