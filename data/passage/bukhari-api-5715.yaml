label: { ar: "صحيح البخاري 5715 — القسط والعود الهندي، أسماء الأمراض", en: "Sahih al-Bukhari 5715 — costus (Indian aloeswood); named diseases", ur: "صحیح بخاری 5715 — قسط ہندی، بیماریوں کے نام" }
text: "… الأُوَلِ اللاَّتِي بَايَعْنَ النَّبِيَّ وَهْىَ أُخْتُ عُكَّاشَةَ ـ أَخْبَرَتْهُ أَنَّهَا أَتَتْ رَسُولَ اللَّهِ بِابْنٍ لَهَا، قَدْ أَعْلَقَتْ عَلَيْهِ مِنَ الْعُذْرَةِ فَقَالَ النَّبِيُّ \" عَلَى مَا تَدْغَرْنَ أَوْلاَدَكُنَّ بِهَذَا الْعِلاَقِ عَلَيْكُمْ بِهَذَا الْعُودِ الْهِنْدِيِّ، فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ مِنْهَا ذَاتُ الْجَنْبِ \". يُرِيدُ الْكُسْتَ، وَهْوَ الْعُودُ الْهِنْدِيُّ. وَقَالَ يُونُسُ وَإِسْحَاقُ بْنُ رَاشِدٍ عَنِ الزُّهْرِيِّ عَلَّقَتْ عَلَيْهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 5715، يذكر القسط والعود الهندي، وأسماء الأمراض، وعلاج العذرة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5715 (Medicine), that mentions costus (Indian aloeswood), named diseases, treating the throat ailment (al-udhra), healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5715، جس میں قسط ہندی، بیماریوں کے نام، گلے کی بیماری عذرہ کا علاج، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
