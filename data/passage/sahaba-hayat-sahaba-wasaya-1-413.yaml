text: "… امامة قال : سمعت رسول اللّٰه يقول فى خطبه عام حجة الوداع: ان اللّٰه قد اعطى كل ذى حق حقه فلا وصية لوارث، والولد للفراش وللماهر الحجر وحسابهم على اللّه، ومن ادعى الى غير ابيه او اتمى الى غير مواليه …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 1، ص 413، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 1, p. 413, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 1، ص 413 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
