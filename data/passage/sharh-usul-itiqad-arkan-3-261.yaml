text: "… يحدث عن النبي فيظ قال: لاَ يُؤْمِنُ أحدكم حتى يُحِبَّ لِلنَّاسِ ما يُحِبُّ لِنَفْسِهِ وَحَتَّى يُحِبَّ المرْءَ لاَ يُحِبُهُ الا لله عال. السابع والثامن والتاسع والخمسون: عن أنس بن مالك، قال: ثلاث من كن فيه فهو عبد طعم الإيمان وحلاوته …"
summary:
  ar: "مقطع من شرح أصول اعتقاد أهل السنة للالكائي، المجلد المصوَّر 3، ص 261، يذكر حلاوة الإيمان وكماله، وما لا يتم الإيمان إلا به، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Lalaka'i's Sharh Usul I'tiqad Ahl al-Sunna, scan volume 3, p. 261, that mentions the sweetness and completeness of faith, what faith is not complete without, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح اصول اعتقاد اہل السنہ، لالکائی، اسکین جلد 3، ص 261 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، جس کے بغیر ایمان مکمل نہیں، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Sharh Usul I'tiqad Ahl al-Sunna de al-Lalaka'i, volumen 3, pág. 261, que menciona la dulzura y la plenitud de la fe, aquello sin lo cual la fe no está completa, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
