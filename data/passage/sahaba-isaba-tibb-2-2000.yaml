text: "… من خرجتن، ورأينا أغلب على عقلي؛ فقال: ما شئت إن شئت دعوت اللّٰه لك، وإن شئت تصبرين، وقد وجبت لك الجنة فقالت في وجهه الغضب، فقلنا : خرجنا ومعنا دواء نداوي به له : أصبر. الجرحى ونناول السهام ونسقي السويق... …"
