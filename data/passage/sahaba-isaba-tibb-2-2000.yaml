text: "… من خرجتن، ورأينا أغلب على عقلي؛ فقال: ما شئت إن شئت دعوت اللّٰه لك، وإن شئت تصبرين، وقد وجبت لك الجنة فقالت في وجهه الغضب، فقلنا : خرجنا ومعنا دواء نداوي به له : أصبر. الجرحى ونناول السهام ونسقي السويق... …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 2000، يذكر مداواة الجراح، والدواء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 2000, that mentions the treatment of wounds, the drug, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 2000 کا اقتباس جس میں زخموں کا علاج، دوا، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen escaneado 2, pág. 2000, que menciona el tratamiento de las heridas, el medicamento y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isaba d'Ibn Hajar, volume 2, page 2000, qui mentionne le traitement des plaies, le médicament, la recherche de soins; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Hacer'in El-İsabe adlı eserinin resimli 2. cildinin 2000. sayfasında, yaraların tedavisi, ilaç ve tedavi yöntemlerinden bahsedilmektedir; bu metin, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Isabah karya Ibn Hajar, jilid 2 bergambar, hlm. 2000, menyebutkan tentang pengobatan luka, obat-obatan, dan perawatan; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
