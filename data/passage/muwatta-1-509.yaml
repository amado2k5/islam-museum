label: { ar: "الموطأ 509 — اليهودية تذكر عذاب القبر لعائشة، والنبي يأمر بالتعوذ منه بعد صلاة الكسوف", en: "Muwatta 509" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن عن عائشة، في باب العمل في صلاة كسوف الشمس: جاءت يهودية تسألها فقالت: أعاذك الله من عذاب القبر، فسألت عائشة النبي أيُعذب الناس في قبورهم، فقال عائذاً بالله من ذلك. ثم ركب النبي ذات غداة مركباً فخسفت الشمس، فرجع ضحى فمر بين ظهراني الحجر ثم قام يصلي وقام الناس وراءه، فأطال القيام والركوع ثم قام وركع دون الأول ثم سجد، ثم فعل في الركعة الثانية مثل ذلك، ثم انصرف فقال ما شاء الله أن يقول ثم أمرهم أن يتعوذوا من عذاب القبر. ويخرّجه المحقق عند البخاري (1049، 1055) وأبي عوانة والطحاوي والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (23/391). {cite:muwatta-maruf-1997 p.262}"
