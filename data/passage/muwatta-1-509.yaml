label: { ar: "الموطأ 509 — اليهودية تذكر عذاب القبر لعائشة، والنبي يأمر بالتعوذ منه بعد صلاة الكسوف", en: "Muwatta 509", es: "Muwatta 509", fr: "Muwatta 509", ur: "موطا 509", tr: "Muvatta 509 — Yahudi kadın Ayşe'ye kabir azabından bahseder ve Peygamber, güneş tutulması namazından sonra ondan korunmayı emreder.", id: "Al-Muwatta 509 — Wanita Yahudi itu menyebutkan siksaan kubur kepada Aisyah, dan Nabi memerintahkan untuk berlindung darinya setelah salat gerhana." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن عمرة بنت عبد الرحمن عن عائشة، في باب العمل في صلاة كسوف الشمس: جاءت يهودية تسألها فقالت: أعاذك الله من عذاب القبر، فسألت عائشة النبي أيُعذب الناس في قبورهم، فقال عائذاً بالله من ذلك. ثم ركب النبي ذات غداة مركباً فخسفت الشمس، فرجع ضحى فمر بين ظهراني الحجر ثم قام يصلي وقام الناس وراءه، فأطال القيام والركوع ثم قام وركع دون الأول ثم سجد، ثم فعل في الركعة الثانية مثل ذلك، ثم انصرف فقال ما شاء الله أن يقول ثم أمرهم أن يتعوذوا من عذاب القبر. ويخرّجه المحقق عند البخاري ⁦(1049، 1055)⁩ وأبي عوانة والطحاوي والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (23/391). {cite:muwatta-maruf-1997 p.262}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Amre bint Abdülrahman'dan, o da Aişe'den rivayetle, güneş tutulması namazı sırasındaki amelleri anlatan bölümde şöyle anlatmaktadır: Bir Yahudi kadın ona gelip, \"Allah seni kabir azabından korusun\" dedi. Aişe de Peygamberimize, \"İnsanlar kabirlerinde azap görürler mi?\" diye sordu. Peygamberimiz, \"Ben bundan Allah'a sığınırım\" diye cevap verdi. Sonra bir sabah Peygamberimiz bineğe bindi ve güneş tutuldu. Öğleden önce geri döndü ve Kâbe'nin iki yanından geçti. Sonra namaz kılmak için ayağa kalktı ve insanlar da arkasında durdular. Ayakta durup rükûyu uzattı, sonra daha kısa süre rükû etti, sonra da secdeye kapandı. İkinci rekatta da aynı şeyi yaptı. Sonra namazı bitirdi ve Allah'ın dilediği sözleri söyledi, ardından da onlara kabir azabından sığınmalarını emretti. Editör, bunu Malik'in arkadaşlarının rivayet zincirleri aracılığıyla Buhari (1049, 1055), Ebu Evane, Tahavi, Şafiî ve Beyhaki'nin derlemelerine dahil eder ve Temhid'e (23/391) atıfta bulunur."
  id: "Diriwayatkan oleh Malik dari Yahya bin Sa'id, dari Amrah binti Abd al-Rahman, dari Aisyah, dalam surah tentang amalan-amalan saat salat gerhana: Seorang wanita Yahudi datang kepadanya dan bertanya, \"Semoga Allah melindungimu dari siksa kubur.\" Maka Aisyah bertanya kepada Nabi, \"Apakah manusia disiksa di dalam kubur?\" Beliau menjawab, \"Aku berlindung kepada Allah dari hal itu.\" Kemudian suatu pagi Nabi menunggangi suatu kendaraan, dan terjadilah gerhana matahari. Beliau kembali pada pagi hari dan melewati kedua sisi Ka'bah. Kemudian beliau berdiri untuk salat, dan orang-orang berdiri di belakangnya. Beliau memperpanjang berdiri dan rukuk, kemudian berdiri dan rukuk lebih singkat dari sebelumnya, lalu sujud. Kemudian beliau melakukan hal yang sama pada rakaat kedua. Kemudian beliau selesai dan mengucapkan apa yang Allah kehendaki untuk diucapkannya, lalu beliau memerintahkan mereka untuk berlindung dari siksa kubur. Penyunting memasukkannya ke dalam koleksi al-Bukhari (1049, 1055), Abu 'Awanah, al-Tahawi, al-Shafi'i, dan al-Bayhaqi melalui sanad para sahabat Malik, dan merujuk pada al-Tamhid (23/391)."
