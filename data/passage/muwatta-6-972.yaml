label: { ar: "الموطأ 972 — هشام بن عروة عن أبيه: لم يعتمر رسول الله إلا ثلاثاً، إحداهن في شوال واثنتان في ذي القعدة", en: "Muwatta 972", es: "Muwatta 972", fr: "Muwatta 972", ur: "موطا 972", tr: "El-Muvatta 972 — Hişam ibn Urve, babasının rivayetine göre: Allah Resulü, umreyi yalnızca üç defa yapmıştır; bunlardan biri Şevval ayında, ikisi de Zilhicce ayındadır.", id: "Al-Muwatta 972 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Rasulullah SAW tidak melaksanakan Umrah kecuali tiga kali, satu kali di bulan Syawal dan dua kali di bulan Dzul Qi'dah." }
text: "لم يعتمر رسول الله إلا ثلاثاً، إحداهن في شوال واثنتان في ذي القعدة"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن رسول الله لم يعتمر إلا ثلاثاً، إحداهن في شوال واثنتان في ذي القعدة. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1104) وسويد (517) والشيباني (449)، ويحيل على التمهيد (22/289). {cite:muwatta-maruf-1997 p.460}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Allah Resulü'nün sadece üç defa Umre yaptığını, bir kez Şevval ayında ve iki kez Zilhicce ayında yaptığını nakletmiştir. Editör, bunun Malik'ten Ebu Mus'ab (1104), Suveyd (517) ve el-Şeybani (449) tarafından da nakledildiğini ve el-Tamhid'e (22/289) atıfta bulunduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.460}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa Rasulullah SAW hanya melaksanakan Umrah tiga kali, sekali di bulan Syawal dan dua kali di bulan Dzul Qi'dah. Editor menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab (1104), Suwaid (517), dan al-Shaybani (449), dan ia merujuk pada al-Tamhid (22/289). {cite:muwatta-maruf-1997 p.460}"
