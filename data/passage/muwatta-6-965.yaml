text: "لا يحرم إلا من أهل ولبى"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سأل عمرة بنت عبد الرحمن عن الذي يبعث بهديه ويقيم، هل يحرم عليه شيء؟ فأخبرته أنها سمعت عائشة تقول: لا يحرم إلا من أهل ولبى. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1097) وسويد (511). {cite:muwatta-maruf-1997 p.458}"
