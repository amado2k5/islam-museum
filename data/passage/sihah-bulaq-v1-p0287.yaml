text: |-
  مادة طهر مفقودة من جل التسخ
  ٣٥٤
  ⁦(باب الرا٠)⁩
  وقال الاصعى بقال جاءفلان مطرًّا أى مستطيلامدلا وقال أبوزيد الاطرار الاغراء والطرير
  ذو الرواء والمنظر قال العباس بن مرداس
  ويعجبك الطر برقتبتليه * فيخلف ظنك الرجل الطارير
  ورجل طرطورطويل دقيق والطر طورقلنسوة للاعراب طويلة دقيقة الرأس ⁦( طعر)⁩
  طعر المرأة طعرانكمها ( طفر لطفرة الوئبة وقسدطقر يطفرطفورا مر طمور
  شبه الوتوب فى السماء وقد طمر الفرس والاخيل يطم رفى طيرانه وقال أبو كبير يصف رجلا
  واذا قذفت له الحصاة رأيته * فزعالوقعتها طمور الاخيل
  وطمار المكان المرتفع قال الاصمعى يقال انصب عليه من طمار مثل قطام قال الشاعر
  فان كنت لا تدرين ما الموت فانظرى • الى هانئ فى السوق وابن عقيل
  الى بطل قد عفر السيف وجهه • وآخريهوى من طمارقتيل
  وكان ابن زياد أعربرمى مسلم بن عقيل من سطح عال وقال الكسائى من طمار وطمار يفتح
  الراءوكسرها والطمر النوب الخلق والجمسع الاطمار والمطمر الزهج الذى يكون مع البنائين
  والطاومارآحد الطوامبر والامور المطمرات الهلكات والمطعورة-فرة يطمرفيها الطعام أى
  بخيأ وقد طمرما أى ملاتها والطاهر البرغوث ويقسال للرجل طامر بن طامر اذالم يدرمن
  هو وفرس طمر بتشديد الراء وهو المستعدّللوثب والعدو وقال أبو عبيدة هو المشمر الخلق
  نبر) الطنبور فارسى معرب والطنبارلغسة ( ور طوار الدارما كان عمتدامعها
  من الفناءويقال لا أطوربه أى لا أقريه ولا تطر حرانا أى لا تقرب ماحولنا وعداطوره أى
  جاوزحدّه والطور الشارة وقال النابغة فى وصف السليم تراجعه طورا وطا وراتطلق
  وقوله تسالى خلقسكم أطوارا قال الاخفس طوراعلقة وطورامضغة والناس أطوارأى
  أخياف على حالات شى وبلغ فلان فى العلم أطوريه أى حديه أوله وآخر . وكان أبوز يدية وله
  بكسر اراءاى بلغ أقصاء -كى هنه ذلك أبو عبيد والطود الجبل والطورى الوحفى من الطير
  والناس بقال جام طورى وطورانىّ ويقال مابها لمورى أى أحد قال العجاج
  وبلدة ليس جاطورى هر) طهرالذئ وطهر أيضا بالضم طهارة فيهما والاسم الطهر
  وطهرته أنا تطهيرا وتطهرت بالماء وهم قوم يتطهرون أى يتنزهون من الادناس ورجل طاهر
  الشباب أى متنزه ومياب طهارى على غير قياس كانه-م بجعواطهران قال الشاعر
  قتاب بنى هوف طهارى نقية • وأوجههم بيض المسافر غران
  والطهرنقيض الحيض والمرأة طاهر من الحيض وظاهرة من النجاسة ومن العيوب والطهور
  ما يتطهربه كالفطور والسحور والوقود قال اللّٰه تعالى وأنزلنامن السماء ماءطهورا والمطهرة
  والمعهرة الاداوة والفت أعلى وابهع المطاهرويقال السوالأمطهرة للقم ير . لطائر
  بجعه طير مثل صاحب وصحب وجمع الطير طيور وأطيار مشل فرخ وفروخ وافراخ وقال
  قطرب الطيراً إضاقد يقع على الواحد وأبو عبيسدة مثله وقرئ فيكون طيراباذن اللّٰه وطائر
  الانسان حله الذى قادء والطير أيضا الاسم من التطير ومنه قولهم لاطير الاطيراقه كما يقال
  لا أمر الاآمرالله وأنند الاصمحى قال وأنشدناه الاحر
