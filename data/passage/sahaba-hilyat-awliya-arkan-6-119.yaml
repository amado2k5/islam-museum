text: "… أبى وأبو محمد بن حيان قالاثنا إبراهيم بن محمد بن الحسن تنا عيسى بن خالد ثنا أبو المان ثنا إسماعيل بن عياش عن أسيد بن عبد الرحمن الخشممى عن هانى بن كلثوم. قال: مثل المؤمن الفقير كمثل المريض عند الطبيب …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 6، ص 119، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 6, p. 119, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 6، ص 119 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
