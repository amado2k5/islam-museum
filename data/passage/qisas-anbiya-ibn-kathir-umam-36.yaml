text: "… مكة والطائف. وعن الحسن قال : أهبط آدم بالهند، وحواء بجدة، وإبليس بدستميان من البصرة على أميال، وأهبطت الحية بأصبهان. رواه ابن أبي جاتم أيضاً. وقال السدي : نزل آدم بالهند ونزل معه بالحجر الأسود وبقبضة من ورق الجنة، فبثه …"
