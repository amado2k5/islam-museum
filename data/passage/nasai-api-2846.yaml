label: { ar: "سنن النسائي 2846 — الحجامة", en: "Sunan al-Nasa'i 2846 — cupping", ur: "سنن نسائی 2846 — حجامہ", es: "Sunan al-Nasa'i 2846 - catación", fr: "Sunan al-Nasa'i 2846 — ventouses", tr: "Sunen an-Nesa'i 2846 - Hacamat", id: "Sunan an-Nasa'i 2846 — Bekam" }
text: "أَخْبَرَنَا قُتَيْبَةُ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ عَمْرٍو، عَنْ طَاوُسٍ، وَعَطَاءٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ النَّبِيَّ احْتَجَمَ وَهُوَ مُحْرِمٌ."
summary:
  ar: "حديث في سنن النسائي، رقم 2846، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan al-Nasa'i, no. 2846 (The Book of Hajj), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن نسائی کی حدیث نمبر 2846، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan al-Nasa'i, n.° 2846 (El Libro del Hajj), menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2846 (Le Livre du Hajj), mentionne la pratique des ventouses. Le dictionnaire médical The Medicine Browser le répertorie parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan an-Nasa'i'de 2846 numaralı hadiste hacamat uygulamasından bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2846, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
