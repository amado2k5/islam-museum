  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 5497. sayfasından, helal, izin verilen, haram olan ve şüpheli konuları ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
