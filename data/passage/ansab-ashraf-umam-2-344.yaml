text: "… أجلى بنى النضير، أتوا خيبر. فلما قدموها، خرج حيّ بن أخطب وكنانة بن أبى الحقيق اليهودى وغيرهما، حتى أتوا مكة. فدعوا أبا سفيان بن حرب وقريشا إلى قتال رسول اللّٰه، وأعلموهم أنهم يد هم عليه. فسرّ أبو سفيان بذلك، وعاقدهم …"
