text: "… عن أبي خِزَامة، عن الحارث بن آخى رسول الله اليه بين عمرو بن سراقة، وبين سَعْد، عن أبيه، قال : قلتُ: يا رسول اللّٰه، أرأيت سعد بن زيد الأنصاريّ. رُقىَّ نَسترقي بها، وأدوية نَتداوى بها، هل تردُّ - أو روى …"
