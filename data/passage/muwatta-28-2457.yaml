label: { ar: "الموطأ 2457 — نافع عن ابن عمر: لا يعصر الخمر ولا يبيعها ولا يسقيها", en: "Muwatta 2457", es: "Muwatta 2457", fr: "Muwatta 2457", ur: "موطا 2457", tr: "El-Muvatta 2457 — İbn Ömer'den rivayet edildiğine göre Nafi': Şarap sıkmamalı, satmamalı ve içirmemelidir.", id: "Al-Muwatta 2457 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Dia tidak boleh memeras anggur, menjualnya, atau memberikannya untuk diminum." }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رجالا من أهل العراق قالوا له: يا أبا عبد الرحمن، إنا نبتاع من ثمر النخل والعنب فنعصره خمرا فنبيعها. فقال ابن عمر: إني أشهد الله عليكم وملائكته ومن سمع من الجن والإنس أني لا آمركم أن تبيعوها أو تبتاعوها أو تعصروها أو تشربوها أو تسقوها، وذكر أنها مما ورد النهي عنه بنص القرآن. {cite:muwatta-maruf-1997 p.416}"
  tr: "Malik, Nafi'den, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Irak'tan bazı adamlar ona şöyle demişler: \"Ey Ebu Abdül-Rahman, biz hurma ve üzüm alıp, sıkarak şarap yapıyoruz ve sonra satıyoruz.\" İbn Umar şöyle demiş: \"Allah'ı, meleklerini ve cinlerden ve insanlardan bunu işiten herkesi şahit tutuyorum ki, size bunu satmanızı, almanızı, sıkmanızı, içmenizi veya başkalarına içirmenizi emretmiyorum.\" Bunun Kur'an'da açıkça yasaklanmış şeyler arasında olduğunu belirtmiştir. {cite:muwatta-maruf-1997 s.416}"
  id: "Malik meriwayatkan dari Nafi’ yang juga meriwayatkan dari Abdullah ibn Umar bahwa beberapa orang dari Irak berkata kepadanya: “Wahai Abu Abd al-Rahman, kami membeli kurma dan anggur, memerasnya untuk membuat anggur, lalu menjualnya.” Ibn Umar berkata: “Aku memanggil Allah, para malaikat-Nya, dan semua orang yang mendengar ini dari kalangan jin dan manusia untuk menjadi saksi bahwa aku tidak memerintahkan kalian untuk menjualnya, membelinya, memerasnya, meminumnya, atau memberikannya kepada orang lain untuk diminum.” Beliau menyebutkan bahwa hal itu termasuk hal-hal yang secara tegas dilarang dalam Al-Quran. {cite:muwatta-maruf-1997 p.416}"
