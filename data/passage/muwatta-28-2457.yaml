label: { ar: "الموطأ 2457 — نافع عن ابن عمر: لا يعصر الخمر ولا يبيعها ولا يسقيها", en: "Muwatta 2457" }
summary:
  ar: "يروي مالك عن نافع عن عبد الله بن عمر أن رجالا من أهل العراق قالوا له: يا أبا عبد الرحمن، إنا نبتاع من ثمر النخل والعنب فنعصره خمرا فنبيعها. فقال ابن عمر: إني أشهد الله عليكم وملائكته ومن سمع من الجن والإنس أني لا آمركم أن تبيعوها أو تبتاعوها أو تعصروها أو تشربوها أو تسقوها، وذكر أنها مما ورد النهي عنه بنص القرآن. {cite:muwatta-maruf-1997 p.416}"
