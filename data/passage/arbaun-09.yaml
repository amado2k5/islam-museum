text: "ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فائتوا منه ما استطعتم، فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على أنبيائهم"
summary:
  ar: "حديث أبي هريرة، وهو الحديث التاسع في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري (7288) ومسلم (1337)، وخرجه مسلم بهذا اللفظ من رواية الزهري عن سعيد بن المسيب وأبي سلمة عن أبي هريرة، وفي رواية ذكر سببه أن رجلاً سأل حين فرض الحج «أكل عام؟» حتى قالها ثلاثاً فقال «لو قلت نعم لوجبت ولما استطعتم»؛ يستنبط ابن رجب منه النهي عن السؤال عما لا يحتاج إليه وعن السؤال تعنتاً وعبثاً واستهزاءً، وعن السؤال عما أخفاه الله عن عباده، وعن كثير من الحلال والحرام مما يخشى أن يكون السؤال سبباً لنزول التشديد فيه، ويذكر حديث سعد «إن أعظم المسلمين في المسلمين جرماً من سأل عن شيء لم يحرم فحرم من أجل مسألته» وأن الرخصة في المسائل كانت للأعراب والوفود دون المهاجرين والأنصار ⁦(جامع العلوم والحكم ص 218–238)⁩."
  en: "Abu Hurayra's hadith, the ninth of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (7288) and Muslim (1337) — Muslim having this wording through al-Zuhri from Sa'id ibn al-Musayyab and Abu Salama from Abu Hurayra — and a narration gives its occasion: a man asking, when hajj was imposed, 'every year?' until the Prophet answered 'had I said yes it would have been obligatory and you could not have managed'; Ibn Rajab derives from it the prohibition of asking about what is not needed, of asking out of obstinacy, frivolity or mockery, of asking about what God has hidden from His servants, and of questions about the lawful and unlawful that might bring down stricter rulings, citing Sa'd's hadith 'the most sinful of Muslims is one who asked about what had not been forbidden and it was forbidden because of his question', and that licence to ask was granted to bedouins and delegations rather than the Muhajirun and Ansar (Jami' al-Ulum wal-Hikam pp. 218–238)."
  es: "Hadiz de Abu Hurayra, el noveno de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Bukhari (7288) y Muslim (1337) —Muslim tiene esta redacción a través de al-Zuhri de Sa'id ibn al-Musayyab y Abu Salama de Abu Hurayra— y una narración da su ocasión: un hombre preguntó, cuando se impuso el Hajj, '¿cada año?' hasta que el Profeta respondió 'si hubiera dicho que sí, habría sido obligatorio y no lo habrías podido lograr'; Ibn Rajab deduce de ello la prohibición de preguntar sobre lo que no es necesario, de preguntar por obstinación, frivolidad o burla, de preguntar sobre lo que Dios ha ocultado a Sus siervos, y de preguntas sobre lo lícito e ilícito que podrían provocar normas más estrictas, citando el hadiz de Sa'd: \"el más pecador de los musulmanes es aquel que preguntó sobre lo que no estaba prohibido y se prohibió debido a su pregunta\", y que la licencia para preguntar se concedió a los beduinos y delegaciones en lugar de a los Muhajirun y Ansar (Jami' al-Ulum wal-Hikam pp. 218-238)."
  fr: "Le hadith d'Abu Hurayra, le neuvième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par al-Bukhari (7288) et Muslim (1337) — Muslim ayant cette formulation par l'intermédiaire d'al-Zuhri de Sa'id ibn al-Musayyab et d'Abu Salama d'Abu Hurayra — et une narration en donne l'occasion: un homme demandant, lorsque le hajj a été imposé, « chaque année ? » jusqu'à ce que le Prophète réponde « si j'avais dit oui, cela aurait été obligatoire et tu n'aurais pas pu y arriver »; Ibn Rajab en déduit l'interdiction de poser des questions sur ce qui n'est pas nécessaire, de poser des questions par obstination, frivolité ou moquerie, de poser des questions sur ce que Dieu a caché à Ses serviteurs, et de poser des questions sur le licite et l'illicite qui pourraient entraîner des décisions plus strictes, citant le hadith de Sa'd: « Le plus grand pécheur des musulmans est celui qui a posé une question sur ce qui n'était pas interdit et qui l'est devenu à cause de sa question », et que la permission de poser des questions a été accordée aux bédouins et aux délégations plutôt qu'aux Muhajirun et aux Ansar (Jami' al-Ulum wal-Hikam pp. 218–238)."
  ur: "ابوہریرہ کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی نویں؛ بخاری (7288) اور مسلم (1337) - مسلم نے یہ الفاظ الزہری کے ذریعہ سعید بن المسیب سے اور ابو سلمہ نے ابوہریرہ سے نقل کیے ہیں - اور ایک روایت اس کا موقع دیتی ہے: ایک آدمی پوچھ رہا ہے کہ حج کب فرض کیا گیا تھا، 'ہر سال؟' یہاں تک کہ نبی نے جواب دیا کہ اگر میں ہاں کہتا تو واجب ہو جاتا اور آپ اس کا انتظام نہیں کر سکتے تھے۔ ابن رجب نے اس سے یہ اخذ کیا ہے کہ جس چیز کی ضرورت نہیں ہے اس کے بارے میں پوچھنے کی، ہٹ دھرمی، لغزش یا طعنہ زنی سے پوچھنا، اللہ تعالیٰ نے اپنے بندوں سے کیا چھپا رکھا ہے، اس کے بارے میں پوچھنا اور ان حلال و حرام کے بارے میں سوال کرنا جن سے سخت احکام صادر ہوں، سعد کی حدیث کا حوالہ دیتے ہوئے کہا گیا ہے کہ مسلمانوں میں سے سب سے زیادہ کس چیز کے بارے میں سوال نہیں کیا گیا تھا اور اس کے بارے میں سوال نہیں کیا گیا تھا۔ اس کے سوال کی وجہ سے منع کیا گیا، اور یہ سوال کرنے کا لائسنس مہاجرین و انصار کے بجائے بدویوں اور وفود کو دیا گیا تھا ⁦(جامع العلوم والحکم صفحہ 218-238)⁩۔"
  tr: "İbn Receb'in açıklamasında ve El-Arba'in El-Neveviyye'de dokuzuncu hadis olan Ebu Hurayra hadisi, Buhari (7288) ve Müslim (1337) tarafından rivayet edilmiştir. Müslim, bu hadisi, Said İbnü'l-Musayyab'dan rivayet edilen Zühri ve Ebu Seleme'den rivayet edilen Ebu Hurayra'dan bu şekilde aktarmıştır. Bir rivayette, bunun sebebi şöyle belirtilmiştir: Bir adam, Hac farz kılındığında, \"Her yıl mı?\" diye sormuş, bunu üç defa tekrarlamış, bunun üzerine şöyle buyurmuştur: \"Eğer evet deseydim, Hac farz olurdu ve sen Hac yapamazdın.\" İbn Receb, bundan gereksiz şeyleri sormanın, inatçılık, ciddiyetsizlik ve alay amacıyla sormanın, Allah'ın kullarından gizlediği şeyleri sormanın ve helal ve haram olan birçok şeyi sormanın yasak olduğunu, zira sorulmasının bunlarda katılık vahyine sebep olabileceğinden korkulduğunu çıkarır. Saad'ın şu hadisini zikreder: \"Müslümanların en büyük günahkârı, haram olmayan bir şeyi sorup da onun sorusu yüzünden haram kılan kimsedir.\" Ve soru sormadaki bu ayrıcalığın Bedeviler ve heyetler için olduğunu, Muhacirler ve Ensar için olmadığını belirtir (Cami'ül-Ulum ve Hikam, s. 218-238)."
  id: "Hadits Abu Hurairah, yang merupakan hadits kesembilan dalam Al-Arba'in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab, diriwayatkan oleh Al-Bukhari (7288) dan Muslim (1337). Muslim memasukkannya dengan redaksi ini dari riwayat Al-Zuhri atas otoritas Saeed Ibn Al-Musayyab dan Abu Salamah atas otoritas Abu Hurairah. Dalam sebuah riwayat, disebutkan alasannya bahwa seorang pria bertanya ketika haji diwajibkan, “Apakah setiap tahun?” sampai ia mengatakannya tiga kali, lalu ia berkata, “Jika saya mengatakan ya, maka itu akan menjadi wajib dan kamu tidak akan bisa melakukannya.” Ibn Rajab menyimpulkan dari hadits tersebut larangan bertanya tentang hal-hal yang tidak diperlukan, dan tentang bertanya karena keras kepala, kesembronoan, dan ejekan, serta tentang bertanya tentang apa yang Allah sembunyikan dari hamba-hamba-Nya, dan tentang banyak hal yang diperbolehkan dan yang dilarang, yang dikhawatirkan pertanyaan tersebut dapat menjadi alasan turunnya keketatan dalam hal-hal tersebut. Ia menyebutkan hadits Saad, “Orang yang paling berdosa di antara kaum Muslimin adalah orang yang bertanya tentang sesuatu yang tidak dilarang dan kemudian menjadi haram karena pertanyaannya.” Dan bahwa keringanan dalam bertanya hanya berlaku untuk kaum Badui dan delegasi, bukan untuk kaum Muhajirin dan Ansar (Jami’ Al-‘Ulum wa Al-Hikam, hlm. 218–238)."
