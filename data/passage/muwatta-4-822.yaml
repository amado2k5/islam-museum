label: { ar: "الموطأ 822 — عائشة: كان يوم عاشوراء يوماً تصومه قريش في الجاهلية، وكان النبي يصومه، فلما فُرض رمضان كان هو الفريضة وترك عاشوراء، فمن شاء صامه ومن شاء تركه", en: "Muwatta 822" }
text: "فمن شاء صامه، ومن شاء تركه"
summary:
  ar: "أول حديث في باب صيام يوم عاشوراء. يرويه مالك عن هشام بن عروة عن أبيه عن عائشة زوج النبي، أنها قالت: كان يوم عاشوراء يوماً تصومه قريش في الجاهلية، وكان رسول الله يصومه في الجاهلية. فلما قدم المدينة صامه وأمر بصيامه، فلما فُرض رمضان كان هو الفريضة وتُرك يوم عاشوراء، فمن شاء صامه ومن شاء تركه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند البخاري (2002) وأبي داود والجوهري والبيهقي والشافعي، ويحيل على التمهيد (22/148). {cite:muwatta-maruf-1997 p.402}"
