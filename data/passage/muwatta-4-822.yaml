label: { ar: "الموطأ 822 — عائشة: كان يوم عاشوراء يوماً تصومه قريش في الجاهلية، وكان النبي يصومه، فلما فُرض رمضان كان هو الفريضة وترك عاشوراء، فمن شاء صامه ومن شاء تركه", en: "Muwatta 822", es: "Muwatta 822", fr: "Muwatta 822", ur: "موطا 822", tr: "Al-Muwatta 822 — Aişe: Aşura günü, İslam öncesi dönemde Kureyş'in oruç tuttuğu bir gündü ve Peygamberimiz de o gün oruç tutardı. Sonra Ramazan farz kılınınca farz oruç haline geldi, Aşura ise farz olmaktan çıktı. Dolayısıyla dileyen oruç tutabilir, dileyen de tutmayabilir.", id: "Al-Muwatta 822 — Aisyah: Hari Asyura adalah hari yang biasa dipuasakan oleh kaum Quraisy pada masa pra-Islam, dan Nabi juga biasa berpuasa pada hari itu. Kemudian, ketika Ramadan diwajibkan, maka puasa Asyura menjadi puasa wajib, dan Asyura ditinggalkan. Maka siapa pun yang ingin berpuasa boleh berpuasa pada hari itu, dan siapa pun yang ingin tidak berpuasa boleh meninggalkannya." }
text: "فمن شاء صامه، ومن شاء تركه"
summary:
  ar: "أول حديث في باب صيام يوم عاشوراء. يرويه مالك عن هشام بن عروة عن أبيه عن عائشة زوج النبي، أنها قالت: كان يوم عاشوراء يوماً تصومه قريش في الجاهلية، وكان رسول الله يصومه في الجاهلية. فلما قدم المدينة صامه وأمر بصيامه، فلما فُرض رمضان كان هو الفريضة وتُرك يوم عاشوراء، فمن شاء صامه ومن شاء تركه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند البخاري (2002) وأبي داود والجوهري والبيهقي والشافعي، ويحيل على التمهيد (22/148). {cite:muwatta-maruf-1997 p.402}"
  tr: "Aşura Günü orucuna ilişkin ilk hadis, Malik'in Hişam ibn Urve'den, onun babasından, onun da Peygamberimizin eşi Aişe'den rivayet ettiği hadistir. Aişe şöyle buyurmuştur: “Aşura Günü, İslam öncesi dönemde Kureyş'in oruç tuttuğu bir gündü ve Allah Resulü de İslam öncesi dönemde oruç tutardı. Medine'ye geldiğinde oruç tuttu ve başkalarına da oruç tutmalarını emretti. Sonra Ramazan farz kılınınca farz oruç oldu ve Aşura Günü isteğe bağlı kaldı. Dileyen oruç tutabilir, istemeyen de tutmayabilirdi.” Editör, bu hadisin Malik'ten rivayetle Ebu Musab, Suveyd ve Kanabi tarafından Buhari (2002), Ebu Davud, Cevhari, Beyhaki ve Şafiî'nin derlemelerinde nakledildiğini belirtiyor ve Temhid'e (22/148) atıfta bulunuyor. {cite:muwatta-maruf-1997 s.402}"
  id: "Hadits pertama tentang puasa pada Hari Asyura. Diriwayatkan oleh Malik dari Hisham ibn Urwah, dari ayahnya, dari Aisyah, istri Nabi, yang berkata: “Hari Asyura adalah hari yang biasa dipuasakan oleh kaum Quraisy pada masa pra-Islam, dan Rasulullah SAW juga biasa berpuasa pada hari itu. Ketika beliau datang ke Madinah, beliau berpuasa pada hari itu dan memerintahkan orang lain untuk berpuasa. Kemudian, ketika Ramadan diwajibkan, puasa Asyura menjadi wajib, dan puasa Hari Asyura menjadi sunnah. Jadi, siapa pun yang ingin berpuasa pada hari itu boleh berpuasa, dan siapa pun yang tidak ingin berpuasa pun boleh berpuasa.” Penyunting menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab, Suwaid, dan al-Qa’nabi dalam kumpulan hadits al-Bukhari (2002), Abu Dawud, al-Jawhari, al-Bayhaqi, dan al-Shafi’i, dan beliau merujuk pada al-Tamhid (22/148). {cite:muwatta-maruf-1997 p.402}"
