text: "… لما رأوا من عزّ الإسلام. ثم ذكر البعث الذين أسروا ثمامة بن أثال الحَنَفي، وما كان من أمره في إسلامه. وقد تقدم ذلك في الأحاديث الصحاح. وذكر ابن هشام أنه هو الذي قال فيه رسول اللّٰه ة: المؤمن يأكل في …"
