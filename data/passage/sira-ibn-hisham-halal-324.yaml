text: "… يَأْكُلُ مغنماً من عَدُوٍّ له. قال ابن إسحاق: حدثني محمد أبو جعفر ابن علي بن الحُسَيْنِ، قال : قال رسول اللّٰه وَيفيم نُصِرْتُ بِالرُّغْبِ، وَجُعِلَتْ ليَ الأَرْضُ مَسْجِداً وَطَهُوراً، وَأُعْطِيتُ جَوَامِعَ الْكَلِم، وأُحِلَّتْ لِيَ الْمَغَانِمُ وَلَمْ تُحْلَلْ لِنَبِيِّ كَانَ قَبْلِي، …"
