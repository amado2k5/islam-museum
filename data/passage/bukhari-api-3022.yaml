text: "… دَخَلَ عَلَىَّ فَضَرَبَنِي. قَالَ فَوَضَعْتُ سَيْفِي فِي بَطْنِهِ، ثُمَّ تَحَامَلْتُ عَلَيْهِ حَتَّى قَرَعَ الْعَظْمَ، ثُمَّ خَرَجْتُ وَأَنَا دَهِشٌ، فَأَتَيْتُ سُلَّمًا لَهُمْ لأَنْزِلَ مِنْهُ فَوَقَعْتُ فَوُثِئَتْ رِجْلِي، فَخَرَجْتُ إِلَى أَصْحَابِي فَقُلْتُ مَا أَنَا بِبَارِحٍ حَتَّى أَسْمَعَ النَّاعِيَةَ، فَمَا بَرِحْتُ حَتَّى سَمِعْتُ نَعَايَا أَبِي رَافِعٍ تَاجِرِ أَهْلِ الْحِجَازِ. قَالَ فَقُمْتُ وَمَا بِي قَلَبَةٌ حَتَّى أَتَيْنَا النَّبِيَّ فَأَخْبَرْنَاهُ."
summary:
  ar: "حديث في صحيح البخاري، رقم 3022، يذكر الجراحة والختان والجبائر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3022 (Fighting for the Cause of Allah (Jihaad)), that mentions surgery, circumcision and splints. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3022، جس میں جراحت، ختنہ اور پٹیاں کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
