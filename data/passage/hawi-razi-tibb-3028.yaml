text: "الأدوية المفردة باب الحاء وقال ماسرجويه: الحضض معتدل في الحر والبرد، قابض. وأجود الحضض للورم العربي. فأما لتقوية الشعر فالهندي. اسندهشار قال: ينفع من أوجاع العين والورم والجذام والبواسير والقروح. قال ابن ماسويه: إنه نافع من الكلف والأورام في المعدة …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 3028، يذكر الوجع، والجذام والبرص، وأسماء الأمراض، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
