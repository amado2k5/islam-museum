  ur: "الحاوی فی الطب، رازی، ص 3028 کا اقتباس جس میں درد، جذام اور برص، بیماریوں کے نام، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
