label: { ar: "تثبيت دلائل النبوة — الجزء الأول، الباب ١", en: "Tathbit Dala'il al-Nubuwwa — Part one, chapter 1", ur: "تثبیت دلائل نبوت — حصہ اول، باب 1", es: "Tathbit Dala'il al-Nubuwwa - Primera parte, capítulo 1", fr: "Tathbit Dala'il al-Nubuwwa — Première partie, chapitre 1" }
text: "بإرسال رسله، وختمهم بسيدهم محمد صلى الله وعليهم أجمعين، فأرسله بالهدى ودين الحق، لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ وَلَوْ كَرِهَ الْمُشْرِكُونَ. هذا كتاب تثبيت دلائل نبوة نبينا محمد رسول الله صلوات الله عليه وسلامه، والأدلة على معجزاته وظهور آياته، …"
summary:
  ar: "مقطع من الباب ١ من كتاب «تثبيت دلائل النبوة» للقاضي عبد الجبار الهمداني في جزئه الأول؛ يجمع المؤلف — من أئمة المعتزلة — الأدلة على صدق رسالة النبي ومعجزاته مستشهداً بالقرآن وما نُقل من الأثر، ويرد على من أنكر النبوة أو سلب معجزاتها. المقتبس المعروض من طبعة الكتاب على ويكي مصدر."
  en: "A section of chapter 1 of Qadi Abd al-Jabbar al-Hamdani's Tathbit Dala'il al-Nubuwwa, part one; the Mu'tazili author gathers proofs of the Prophet's mission and miracles from the Qur'an and transmitted reports, answering those who deny prophethood or strip it of miracles. The quoted excerpt is taken from the Wikisource edition."
  ur: "قاضی عبد الجبار ہمدانی کی کتاب «تثبیت دلائل نبوت» کے پہلے حصے کے باب 1 کا ایک حصہ؛ معتزلی مصنف قرآن اور منقول آثار سے نبوت اور معجزات کے دلائل جمع کرتا ہے اور انکار کرنے والوں کا جواب دیتا ہے۔ نقل کردہ اقتباس وکی ماخذ کے ایڈیشن سے لیا گیا ہے۔"
  es: "Un fragmento del capítulo 1 de la primera parte de Tathbit Dala'il al-Nubuwwa, de Qadi Abd al-Jabbar al-Hamdani; el autor mutazilí reúne pruebas de la misión y los milagros del Profeta a partir del Corán y relatos transmitidos, respondiendo a quienes niegan la profecía o la despojan de sus milagros. El extracto citado proviene de la edición de Wikisource."
  fr: "Extrait du chapitre 1 de Tathbit Dala'il al-Nubuwwa, première partie, du cadi Abd al-Jabbar al-Hamdani: l'auteur mu'tazilite rassemble des preuves de la mission et des miracles du Prophète tirées du Coran et des hadiths, réfutant ainsi ceux qui nient la prophétie ou la privent de ses miracles. Cet extrait est tiré de l'édition Wikisource."
