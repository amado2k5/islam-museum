text: "… الجنة بصبرها على هذا المرض، ودعا لها أن لا تتكشف، وخيَّرها بين الصبر والجنة، وبينَ الدعاء لها بالشفاء مِن غير ضمان، فاختارت الصبر والجنة. جواز ترك التداوي وأن علاج الأرواح بالتوجه إلى اللّٰه يفعل ما لا يناله علاج الأطباء وفي …"
