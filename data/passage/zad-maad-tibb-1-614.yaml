  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 1, p. 614, that mentions medicine and the physician, illness and the sick, treatment, seeking treatment, healing; from the machine-read scan, quoted within forty words per the sources policy."
