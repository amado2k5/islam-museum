  .!واو". ..
  * ⁦(فيو)⁩*
  ٥٦٧
  للفتى عقل يميس به * حيث تم دى ساقه قدمه
  وهادى السهم نصله والهادى الراكس وه والنورفى وسط البيدرتدور عليه النيران فى
  الدياسة والهادى العنق وأقيات هوادى الخيل اذابدت أعناقها ويقال أقل رعيسل منها
  وقول امرئ القيس
  كأن دماء الهاديات بتحره • عصارة حنا بشيب مرجل
  بعف به أواقل الوحش والهدية واحدة الهدايا يقال أهديت له واليه والمهدى بكسرالميم
  مايم دى فيه مثل الطبق ونحوه قال ابن الاءرابى ولا يسعى العابق مهدى الاوفيه ما يهسدى
  والمهداء بالمد الذى من عادته أن يه دى والتهادى أن يم-دى بعضهم الى بعض وفى الحديث
  تهادوا تحابوا وجاءذلان يهادى بين اثنين اذا كان يشى بينه-ما معتقداعليهما من ضعقه
  وتابله قال ذوالرقة
  سادين جماء المرافق وعثة• كليلة حجم السكعب ريا المخلخل
  سكذلك المرأة اذا تمابلت فى مشيتها من غير أن؟ اشيها أحد قمل تهادى عن الاصمقى
  قال الاعشى
  اذاماتأتى تزيد الفسام • تهادى كاقدرايت البهيرا
  أبوز يدبقال لك عندى هدياها أى مثلها ويقال رميت بهم ثم رميت باخرهدياه أى
  قصدم ⁦( هذى )⁩ هذى فى منطقه يهذى ويهذوهذوا وهذيانا وهذرت بالسيف مثل هذذت
  را الهراوة العصا الضخمة وابهع الهراوى بفتح الواوصثال المطايا كماقلناه فى الاداوة
  وحروته بالهرادة وتهريته اذا ضرته بها وقال
  يكسى ولا يغرث عملوكها * اذاتهوت عبدها الهاريه
  وهزيت العمامة تهرية صغرتها وهراة اسم بلد وقال • عاود هراة وان معمورها خربا
  فان وقفت عليها وقفت بالهاء واغاقيل معاذ الهراءلانه كان يبيع الشياب الهروية⁦(هذا)⁩
  الهفوة الزلة وقد هفا يهفوهة وة وهفا الطائريجناحيه أى خفق وطار وقال
  وهواذا الحرب هفاعقابه * مرجم حرب تلتظى حرابه
  وهفا الشى فى الهواه اذا ذهب كالصوفة رغحوها ومرالطي يهفومثل قولك بطفو
  قال بشريصف فرما
  يشبه شخمها والخيل تهفو • هفوّاظل تتفاء الجناح
  وهوافى النحم مثل الهوامى واله فوالجوع ورجل هاف أى جائع والهفاة النظرة ⁦( فى )⁩
  هتامهقيا تنا وله بما يكره وأهقى أفند (مى همى الماء والدمع يمى هميا وهميانا اذا
  سال وهمت الماشية اذاندت للرعى وهوامى الابل ضوالها وهميان الدراهم بكسر الهاء وهو
  معرّب وهميان بن تحافة السعدى بكسرويضم نو «ن على وزن أخ كلمة كتاية
  ومعنامشئ وأصله هموتقول هذا هنك أى شيئك قال الشاعر
  رحت وفى رجليك مافيهما * وقد يداهنك من المئزر
  قال سيبويه انماسكنه للضرورة وه_ماهنوان واله-ع «نون وربعمايا مشقدافى الشعركما
  شقدوالوا قال الشاعر
