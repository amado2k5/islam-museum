text: "… نداءها، كما قيل : قَدْ نادَتِ الدُّنيا على نفسِها لَوْ كانَ في العَالَمِ مَنْ يَسمَعُ كَمْ وَائِقٍ بالعُمْرِ أفْنَيتُهُ وجَامِعٍ بَدَّدتُ ما يَجْمَعُ قال يحيى بنُ معاذ: لو يسمع الخلائقُ صوتَ النِّياحةِ على الدُّنيا في الغيبِ من ألسنةِ الفناءِ، لتساقطت …"
summary:
  ar: "مقطع من جامع العلوم والحكم، المجلد المصوَّر 2، ص 657، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Jami' al-Ulum wal-Hikam, scan volume 2, p. 657, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "جامع العلوم والحکم، اسکین جلد 2، ص 657 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Ulum wal-Hikam, volume numérisé 2, p. 657, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Jami' al-Ulum wal-Hikam, volumen escaneado 2, p. 657, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Cami'ü'l-Ulum ve el-Hikam'ın 2. cildinin 657. sayfasından, ölen kişi için yas tutma ve sınırları konusunu ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikası gereği yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü mersiye ve ağıtların bir derlemesinden derlenmiştir."
  id: "Cuplikan dari Jami' al-'Ulum wa al-Hikam, Volume 2, halaman 657, yang membahas tentang berkabung atas orang yang meninggal dan batasannya; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan elegi dan ratapan yang paling terkenal."
