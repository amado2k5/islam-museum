summary:
  ar: "القسم 29 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطب»، ويضم فيها النصوص من 3855 إلى 3903 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 29 of Sunan Abi Dawud (Medicine (Kitab Al-Tibb)) in the division of the open hadith dataset the museum took its reports from: reports 3855 to 3903 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 29، عنوان «کتاب الطب»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3855 تا 3903۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 29 de Sunan Abi Dawud (Medicina (Kitab Al-Tibb)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3855 al 3903, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
