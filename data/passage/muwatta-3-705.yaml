label: { ar: "الموطأ 705 — مالك: من كانت له غنم دون النصاب فاشترى أو ورث غنماً كثيرة لم تجب فيها كلها صدقة حتى يحول الحول من يوم أفادها", en: "Muwatta 705", es: "Muwatta 705", fr: "Muwatta 705", ur: "موطا 705", tr: "El-Muvatta 705 — Malik: Bir kimsenin zekât için gerekli asgari miktardan daha az koyunu varsa ve sonra çok sayıda koyun satın almış veya miras yoluyla edinmişse, bu koyunların tamamı için zekât, onları edindiği günden itibaren bir yıl geçmeden verilmez.", id: "Al-Muwatta 705 — Malik: Jika seseorang memiliki domba kurang dari jumlah minimum yang dipersyaratkan untuk zakat, dan kemudian membeli atau mewarisi banyak domba, zakat tidak wajib dibayarkan atas semuanya sampai satu tahun berlalu sejak hari ia memperolehnya." }
summary:
  ar: "قول لمالك في رجل له غنم لا تجب فيها الصدقة فاشترى إليها غنماً كثيرة أو ورثها: أنه لا تجب عليه في الغنم كلها صدقة حتى يحول عليها الحول من يوم أفادها باشتراء أو ميراث، لأن ما كان عند الرجل من ماشية لا تجب فيها الصدقة لا يُعد نصاب مال حتى يكون في كل صنف منها ما تجب فيه الصدقة، فذلك النصاب الذي يُصدّق معه ما أفاد إليه صاحبه من قليل أو كثير. ويذكر المحقق فروق النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.353} {cite:muwatta-maruf-1997 p.354}"
  tr: "Malik, zekâtı farz olmayan koyunlara sahip olan ve daha sonra çok sayıda koyun satın alan veya miras yoluyla edinen bir adam hakkında şöyle demiştir: Bu adam, koyunları satın alma veya miras yoluyla edinme tarihinden itibaren bir yıl geçmeden tüm koyunlar için zekât ödemekle yükümlü değildir. Çünkü adamın zaten sahip olduğu ve zekâtı farz olmayan hayvanlar, her bir koyun türü zekât edilecek kadar yeterli miktarda koyun içermedikçe, zekâta tabi minimum mal varlığını oluşturmaz. Bu, büyük veya küçük olsun, her bir ek koyun için zekât edilecek minimum miktardır. Editör, hadisin rivayetlerindeki farklılıklardan bahsetmekte ve Ebu Mus'ab'ın bunu Malik'ten naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.353} {cite:muwatta-maruf-1997 s.354}"
  id: "Malik berkata mengenai seorang pria yang memiliki domba yang tidak wajib dizakati, dan kemudian membeli atau mewarisi lebih banyak domba: bahwa ia tidak wajib membayar zakat atas semua domba tersebut sampai satu tahun berlalu sejak ia memperolehnya melalui pembelian atau warisan. Hal ini karena ternak yang sudah dimiliki pria tersebut, yang tidak wajib dizakati, tidak termasuk dalam jumlah minimum harta yang wajib dizakati sampai setiap jenis domba memiliki jumlah yang cukup untuk dikenakan zakat. Itulah jumlah minimum yang wajib dizakati atas setiap domba tambahan, baik besar maupun kecil. Editor menyebutkan perbedaan dalam versi hadits dan menyatakan bahwa Abu Mus'ab meriwayatkan ini dari Malik. {cite:muwatta-maruf-1997 p.353} {cite:muwatta-maruf-1997 p.354}"
