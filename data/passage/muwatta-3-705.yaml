label: { ar: "الموطأ 705 — مالك: من كانت له غنم دون النصاب فاشترى أو ورث غنماً كثيرة لم تجب فيها كلها صدقة حتى يحول الحول من يوم أفادها", en: "Muwatta 705" }
summary:
  ar: "قول لمالك في رجل له غنم لا تجب فيها الصدقة فاشترى إليها غنماً كثيرة أو ورثها: أنه لا تجب عليه في الغنم كلها صدقة حتى يحول عليها الحول من يوم أفادها باشتراء أو ميراث، لأن ما كان عند الرجل من ماشية لا تجب فيها الصدقة لا يُعد نصاب مال حتى يكون في كل صنف منها ما تجب فيه الصدقة، فذلك النصاب الذي يُصدّق معه ما أفاد إليه صاحبه من قليل أو كثير. ويذكر المحقق فروق النسخ، وأنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.353} {cite:muwatta-maruf-1997 p.354}"
