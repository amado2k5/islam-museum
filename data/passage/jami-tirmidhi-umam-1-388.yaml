text: "… أهل الكتاب التحفة - حَدَّثَنَا قُتَيْبَةُ : حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ: أَنَّ رَسُولَ اللهِ وَلةُ قَالَ: لَا تَبْدَأُوا الْيَهُودَ والنَّصَارَى بالسَّلَامِ، وإِذا لَقِيتُمْ أَحَدَهُمْ في الطَّرِيقِ فاضْطَرُّوهُ إِلى أَضْيَقِهِ. …"
summary:
