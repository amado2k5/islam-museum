label: { ar: "نوادر جحا الكبرى، ص 148 — «لا أدري بها كلها»", en: "Nawadir Juha al-Kubra, p. 148 — 'I Do Not Know Any of Them'", ur: "نوادر جحا الکبریٰ، ص 148 — «مجھے ان میں سے کسی کا علم نہیں»", fr: "Nawadir Juha al-Kubra, p. 148 — « Je n'en sais aucune »", es: "Nawadir Juha al-Kubra, p. 148 — «No sé ninguna de ellas»" }
text: "… لا أدري بها كلها جاء مدينة آقَ شَهْرٌ باحِثٌ جدليّ متفلسفٌ وسأل قائلاً: مَنْ هو عالِم مدينتِكُم؟ فقالوا له : الشيخ نصر الدين. ففتَّشٍ عليهِ فوجدَهُ، وسألهُ قائلاً: يا حضرة الشيخِ، إنَّ لي أربعين سُؤَالاً، هلْ يُمْكِنك أن تجيبني عليها …"
summary:
  ar: "جاء جدلي إلى آق شهر وسأل عن عالم البلد نصر الدين، وقال إن عنده أربعين سؤالاً، فأصغى جحا إلى الأسئلة كلها ثم قال «لا أدري بها كلها»، فأسكته. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  en: "A dialectician comes to Akshehir, asks for the local scholar, Nasr al-Din, and says he has forty questions; Juha listens to all forty and answers 'I do not know any of them', which silences him. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  ur: "ایک مناظر آق شہر آیا، اس نے شہر کے عالم نصر الدین کے بارے میں پوچھا اور کہا کہ اس کے پاس چالیس سوال ہیں، جحا نے چالیسوں سوال سنے اور کہا «مجھے ان میں سے کسی کا علم نہیں»، اور اس نے اسے خاموش کر دیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  fr: "Un dialecticien arrive à Akshehir, demande le savant du lieu, Nasr al-Din, et dit avoir quarante questions ; Juha les écoute toutes puis répond : « Je n'en sais aucune », ce qui le réduit au silence. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
  es: "Un dialéctico llega a Akshehir, pregunta por el sabio local, Nasr al-Din, y dice tener cuarenta preguntas; Juha las escucha todas y responde: «No sé ninguna de ellas», lo que lo deja callado. {cite:juha-nawadir-kubra-djuwaydi p. 148}"
