text: "… به حق الغير مثل المسروق والمغصوب فإنه لا يحل شيء من ذلك كله. والحيوان منه ما هو بحري ومنه ما هو بري. فأما البحري فهو حلال كله : والحيوان البري منه ما هو حلال أكله ومنه ما هو حرام. وقد …"
