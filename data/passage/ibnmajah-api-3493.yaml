label: { ar: "سنن ابن ماجه 3493 — الكي، الطب والطبيب", en: "Sunan Ibn Majah 3493 — cautery; medicine and the physician", ur: "سنن ابن ماجہ 3493 — داغنا، طب اور طبیب", es: "Sunan Ibn Majah 3493 — cauterización; medicina y el médico", fr: "Sunan Ibn Majah 3493 — cautérisation; médecine et médecin", tr: "Sunan İbn Majah 3493 — Yakma, Tıp ve Hekim", id: "Sunan Ibn Majah 3493 — Kauterisasi, Kedokteran dan Dokter" }
text: "حَدَّثَنَا عَمْرُو بْنُ رَافِعٍ، حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدٍ الطَّنَافِسِيُّ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، قَالَ مَرِضَ أُبَىُّ بْنُ كَعْبٍ مَرَضًا فَأَرْسَلَ إِلَيْهِ النَّبِيُّ طَبِيبًا فَكَوَاهُ عَلَى أَكْحَلِهِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3493، يذكر الكي، والطب والطبيب، والمرض والمريض، وأعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3493 (Chapters on Medicine), that mentions cautery, medicine and the physician, illness and the sick, the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3493، جس میں داغنا، طب اور طبیب، بیماری اور بیمار، اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3493 (Capítulos sobre Medicina), menciona la cauterización, la medicina y el médico, la enfermedad y los enfermos, y los órganos del cuerpo. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Ibn Majah, n° 3493 (Chapitres sur la médecine), mentionne la cautérisation, la médecine et le médecin, la maladie et le malade, ainsi que les organes du corps. Le Répertoire des ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "İbn Majah'ın Süneni'nde yer alan 3493 numaralı hadiste, yakma işlemi, tıp ve hekim, hastalık ve hasta ile vücut organlarından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 3493, menyebutkan tentang kauterisasi, pengobatan dan dokter, penyakit dan pasien, serta organ-organ tubuh. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
