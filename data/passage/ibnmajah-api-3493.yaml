label: { ar: "سنن ابن ماجه 3493 — الكي، الطب والطبيب", en: "Sunan Ibn Majah 3493 — cautery; medicine and the physician", ur: "سنن ابن ماجہ 3493 — داغنا، طب اور طبیب" }
text: "حَدَّثَنَا عَمْرُو بْنُ رَافِعٍ، حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدٍ الطَّنَافِسِيُّ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، قَالَ مَرِضَ أُبَىُّ بْنُ كَعْبٍ مَرَضًا فَأَرْسَلَ إِلَيْهِ النَّبِيُّ طَبِيبًا فَكَوَاهُ عَلَى أَكْحَلِهِ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3493، يذكر الكي، والطب والطبيب، والمرض والمريض، وأعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3493 (Chapters on Medicine), that mentions cautery, medicine and the physician, illness and the sick, the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3493، جس میں داغنا، طب اور طبیب، بیماری اور بیمار، اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
