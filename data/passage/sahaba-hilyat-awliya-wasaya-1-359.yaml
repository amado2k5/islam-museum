text: "- - الرجوع قلت أوصنى يارصول اللّٰه قال :.اتق الله، وإذا كنت فى مجلس فقمت عنه فسمعتهم يقولون ما يمجبك فأته، وإذا سمعتهم يقولون ما تكره فلا تأته حدثنا أحمد بن محمد بن يوسف ثنا عبد اللّٰه بن محمد بن …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 359، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 359, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 359 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
