text: "… في ذلك سواء، لا يحل حكم الحاكم منها حراماً ولا يحرم حلالاً، وذلك مثل أن يشهد شاهداً زوراً في امرأة أجنبية أنها زوجة لرجل أجنبي ليست له بزوجة، فقال الجمهور: لا تحل له وإن أحلها الحاكم بظاهر الحكم، وقال أبو …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 995، يذكر الحلال، وما أُحل، وما لا يحل، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 995, that mentions the lawful, what was made lawful, what is not lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 995 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
