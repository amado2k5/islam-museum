text: "… في ذلك سواء، لا يحل حكم الحاكم منها حراماً ولا يحرم حلالاً، وذلك مثل أن يشهد شاهداً زوراً في امرأة أجنبية أنها زوجة لرجل أجنبي ليست له بزوجة، فقال الجمهور: لا تحل له وإن أحلها الحاكم بظاهر الحكم، وقال أبو …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 995، يذكر الحلال، وما أُحل، وما لا يحل، والحرام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 995, that mentions the lawful, what was made lawful, what is not lawful, the unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 995 کا اقتباس جس میں حلال، جو حلال کیا گیا، جو حلال نہیں، حرام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 4, pág. 995, que menciona lo lícito, lo que se hizo lícito, lo que no lo es y lo ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de Bidayat al-Mujtahid d'Ibn Rushd, volume 4, page 995 (numérisé), mentionnant le licite, ce qui a été rendu licite, ce qui ne l'est pas et l'illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié par le Halal and Haram Browser."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 4. cildinin 995. sayfasından, helal, haram ve yasak olan şeyleri ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 4, halaman 995, yang membahas tentang apa yang diperbolehkan, apa yang tidak diperbolehkan, dan apa yang diharamkan; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Halal and Haram Browser."
