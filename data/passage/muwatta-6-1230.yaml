label: { ar: "الموطأ 1230 — مالك: المرأة التي تهل بالعمرة ثم تدخل مكة موافية للحج وهي حائض، إذا خشيت الفوات أهلت بالحج وأهدت", en: "Muwatta 1230", es: "Muwatta 1230", fr: "Muwatta 1230", ur: "موطا 1230", tr: "El-Muvatta 1230 — Malik: Umre için ihrama giren ve sonra regl dönemindeyken Hac niyetiyle Mekke'ye giren bir kadın, Hac'ı kaçırmaktan korkarsa, Hac için ihrama girmeli ve kurban kesmelidir.", id: "Al-Muwatta 1230 — Malik: Seorang wanita yang memasuki keadaan ihram untuk Umrah dan kemudian memasuki Mekah dengan niat untuk melaksanakan Haji dalam keadaan haid, jika ia khawatir akan ketinggalan Haji, maka ia harus memasuki keadaan ihram untuk Haji dan mempersembahkan kurban." }
summary:
  ar: "يقول مالك في المرأة التي تهل بالعمرة ثم تدخل مكة موافية للحج وهي حائض لا تستطيع الطواف، إنها إذا خشيت الفوات أهلت بالحج وأهدت، وكانت مثل من قرن، وأجزأ عنها طواف واحد. والحائض إذا كانت قد طافت بالبيت وصلت قبل أن تحيض، فإنها تسعى بين الصفا والمروة، وتقف بعرفة والمزدلفة، وترمي الجمار، غير أنها لا تفيض حتى تطهر من حيضتها. {cite:muwatta-maruf-1997 p.550}"
  tr: "Malik, Umre için ihrama giren ve daha sonra Hac için Mekke'ye giren, adetli ve Tavaf yapamayacak durumda olan bir kadın hakkında şöyle der: Eğer Hac'ı kaçırmaktan korkuyorsa, Hac için ihrama girmeli ve kurban kesmelidir; böylece hem Hac hem de Umre yapmış gibi muamele görür ve bir Tavaf ona yeter. Adetli bir kadın, adet başlamadan önce Kâbe etrafında Tavaf yapmış ve namaz kılmışsa, Safa ile Merve arasında Sa'i yapmalı, Arafat ve Muzdalifa'da durmalı ve Cemarat'a taş atmalıdır; ancak adetinden temizlenene kadar Tavafü'l-İfade yapmamalıdır. {cite:muwatta-maruf-1997 s.550}"
  id: "Malik berkata mengenai seorang wanita yang memasuki keadaan ihram untuk Umrah dan kemudian memasuki Mekah untuk Haji dalam keadaan haid dan tidak dapat melakukan Tawaf, bahwa jika dia khawatir ketinggalan Haji, dia harus memasuki keadaan ihram untuk Haji dan mempersembahkan kurban, dan dia akan diperlakukan seperti orang yang melakukan Haji dan Umrah sekaligus, dan satu Tawaf sudah cukup baginya. Jika seorang wanita yang sedang haid telah melakukan Tawaf mengelilingi Ka'bah dan shalat sebelum haidnya dimulai, dia harus melakukan Sa'i antara Safa dan Marwa, berdiri di Arafat dan Muzdalifah, dan melempar kerikil ke Jamarat, tetapi dia tidak boleh melakukan Tawaf al-Ifadah sampai dia bersih dari haidnya. {cite:muwatta-maruf-1997 p.550}"
