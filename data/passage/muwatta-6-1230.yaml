label: { ar: "الموطأ 1230 — مالك: المرأة التي تهل بالعمرة ثم تدخل مكة موافية للحج وهي حائض، إذا خشيت الفوات أهلت بالحج وأهدت", en: "Muwatta 1230" }
summary:
  ar: "يقول مالك في المرأة التي تهل بالعمرة ثم تدخل مكة موافية للحج وهي حائض لا تستطيع الطواف، إنها إذا خشيت الفوات أهلت بالحج وأهدت، وكانت مثل من قرن، وأجزأ عنها طواف واحد. والحائض إذا كانت قد طافت بالبيت وصلت قبل أن تحيض، فإنها تسعى بين الصفا والمروة، وتقف بعرفة والمزدلفة، وترمي الجمار، غير أنها لا تفيض حتى تطهر من حيضتها. {cite:muwatta-maruf-1997 p.550}"
