label: { ar: "سنن أبي داود 492 — دفن وقبر ومرقد", en: "Sunan Abi Dawud 492 — a burial, grave or resting place", ur: "سنن ابی داؤد 492 — تدفین، قبر اور مرقد", es: "Sunan Abi Dawud 492 — un lugar de entierro, tumba o descanso.", fr: "Sunan Abi Dawud 492 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا حَمَّادٌ، ح وَحَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ الْوَاحِدِ، عَنْ عَمْرِو بْنِ يَحْيَى، عَنْ أَبِيهِ، عَنْ أَبِي سَعِيدٍ، قَالَ قَالَ رَسُولُ اللَّهِ - وَقَالَ مُوسَى فِي حَدِيثِهِ فِيمَا يَحْسَبُ عَمْرٌو - أَنَّ النَّبِيَّ قَالَ \" الأَرْضُ كُلُّهَا مَسْجِدٌ إِلاَّ الْحَمَّامَ وَالْمَقْبُرَةَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 492، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 492 (Prayer (Kitab Al-Salat)), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 492، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 492 (Oración (Kitab Al-Salat)), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 492 (La Prière), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de textes sacrés le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
