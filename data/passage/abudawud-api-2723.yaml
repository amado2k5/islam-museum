label: { ar: "سنن أبي داود 2723 — الأب والأبوة", en: "Sunan Abi Dawud 2723 — the father and fatherhood", ur: "سنن ابی داؤد 2723 — باپ اور والدیت", es: "Sunan Abi Dawud 2723 — El padre y la paternidad" }
text: "… أَبَانُ بْنُ سَعِيدٍ وَأَصْحَابُهُ عَلَى رَسُولِ اللَّهِ بِخَيْبَرَ بَعْدَ أَنْ فَتَحَهَا وَإِنَّ حُزُمَ خَيْلِهِمْ لِيفٌ فَقَالَ أَبَانُ اقْسِمْ لَنَا يَا رَسُولَ اللَّهِ. قَالَ أَبُو هُرَيْرَةَ فَقُلْتُ لاَ تَقْسِمْ لَهُمْ يَا رَسُولَ اللَّهِ. فَقَالَ أَبَانُ أَنْتَ بِهَا يَا وَبْرُ تَحَدَّرُ عَلَيْنَا مِنْ رَأْسِ ضَالٍ. فَقَالَ النَّبِيُّ \" اجْلِسْ يَا أَبَانُ \". وَلَمْ يَقْسِمْ لَهُمْ رَسُولُ اللَّهِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2723، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2723 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2723، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2723 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
