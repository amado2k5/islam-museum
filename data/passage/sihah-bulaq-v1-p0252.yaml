text: |-
  ٢٨٩
  فى المنسل لا يطاع اقصير أمر فهو قصير بن سعد اللخمى صاحب جذيمة الابرش وفرس قصير أى
  مقرية لا تترك أن زود لنفاستها قال الشاعر لك بن زعبة الباهسلى
  تراها عند قبتنا قصيرا • ونبذلها اذاباقت بؤوق
  وامرأة قصيرة وقصورة أى مقصورة فى البيت لا نترك أن تخرج قال كثير
  وأنت التى حبيت كل قصيرة * الى وما تدرى بذاك القصائر
  عنيت قصسيرات الجال ولم أرد * قصار الخطى شر النساء البحاتر
  وأنشده الفتراء قصورة وكذا ابن السكيت والجاتر مرذ كره وقيصر ملك الروم والاقتصار على
  الشئ الاكتفا بدوأقصرت عنه كففت ونزعن مع القدرة عليه قان عمزت عنه قلت
  صرت بلا ألف وأقصرنا أى دخلنا فى قصر العنىّ كماتقول أصينا من المساء وأقصرت
  من الصلالغة فى قصرت وأقصرت المرأة ولدت أولا داقصارا وفى الحديث إن الطويلة
  قد تقصر وإن القصيرة قد تطيل وأقصرت النعجة والمعزفهى مقصراذا أسنتا-تى تقصر
  أسنانه ما حكاهايعة وب واستقصره أى عدممقصرا وكذلك اذاعد. قصيرا والتقصار
  والتقصارة بكسر القاء قلادة شبيهة بالمخنفة والبمع التقاصير ⁦(قطر)⁩ القبار المطر والقطر
  جع قطرة وقد قطر الماء وغيره يقطر قطرا وقمارته أنا يتعدى ولا يتعدى وقطران الماء بالتحريك
  وأما الهناء فهو القطران: مكسرالطاء تقول منه قدرت البعسير طليته بالقطران قال
  الشاعر
  أتقتاى وقد شغفت فوادها • كما قطر المهنوءة الرجل الطالى
  والبعير مقطورور بما قالوا مقطرن بالنون كأنهسم ردّوه الى الاصل وهو القطران وأقطر
  الشئء أى حان ه أن يقطر وقطر فى الارض قطور اذهب والبعسير القاطر الذى لا يزال يقطربوه
  والقعر بالضم الناحية والجانب والمع الاقطار والقطر والقطر مثل عسر وعسر العود الذى
  يتيخريه قال الشاعر ا مر والقيس
  كأن المدام وصوب الغمام • وريخ الخزامى ونشر القطر
  والمقطرة المجمرة وأنشد أبو عبيد للمرقش الاصغر
  فى كل يوم لهامقطرة • فيها كباءمعد وحيم
  أى ماححار تحمم به
  والمقطرة أيضا الفاق وهى خشبة فيها خروق تدخل فيها أرجل المحبوسين والقطر بالكم
  النحاس ومنه قوله تعالى عين القطر والقطرأيضاضرب من البرود يقال لها القطرية والقطار
  جع قطروهو المطر والقطارأيضاقطار الابل قال أبو النحم
  وانحت من حرشاء فلج خردله • وأقبل المل قطاراتنله
  والمع قطر وقطرات والقطارة بالضم ماقطر من الحبّ ونضحوه وتقاطر القوم جاوا ارسالا
  وهو مأخود من قطارالا بلى والتقطرافة فى التقتروهو التهيؤلاققال وطعنه فقطره تقطيرا أى
  ألقاه على أحد قطر به وهما جانيا هفتقطر أى سقط قال الهذلى
  مجدلايتسق جلده دمه • كما تقطر جذع الدومة الفطلى ويروى يتكسى جلده
  والقطل المقطوع وتقطير الشى اسالته قطرة قطرة وتقطير الابل من القطاروفى المثل النفاض
  يقطر الجلب أى اذا أنفض القوم أى فى زادهم قط-روا الابل فجلبوهالنبيع قطاراقطارا
