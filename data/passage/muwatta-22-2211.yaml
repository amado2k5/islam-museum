label: { ar: "الموطأ 2211 — مالك عن سعيد بن عمرو بن شرحبيل عن أبيه عن جده: خرج سعد بن عبادة مع رسول الله في بعض مغازيه، فحضرت أمه الوفاة بالمدينة، فقيل لها أوصي، فقالت: فيم أوصي؟ إنما المال مال سعد، فتوفيت قبل أن يقدم، فلما قدم ذكر ذلك له، فقال: هل ينفعها أن أتصدق عنها؟ قال: نعم، فتصدق بحائط سماه", en: "Muwatta 2211", es: "Muwatta 2211", fr: "Muwatta 2211", ur: "موطا 2211", tr: "El-Muvatta 2211 — Malik, Sa’id ibn ‘Amr ibn Sharhabil’den, o da babasından, o da dedesinden rivayet eder: Sa’d ibn ‘Ubadah, Allah Resulü ile birlikte bir askeri sefere çıktı. Annesi Medine’de ölüm döşeğindeydi ve ona vasiyet yazması söylendi. Annesi, “Ne vasiyet edeyim? Mallar Sa’d’a ait” dedi. Sa’d dönmeden önce vefat etti. Sa’d döndüğünde bu kendisine hatırlatıldı ve “Onun adına sadaka verirsem faydası olur mu?” diye sordu. Resulullah, “Evet” dedi. Bunun üzerine Sa’d, surlarla çevrili bir bahçeyi sadaka olarak verdi ve ona Sa’d adını verdi.", id: "Al-Muwatta 2211 — Malik, berdasarkan riwayat Sa’id ibn ‘Amr ibn Sharhabil, berdasarkan riwayat ayahnya, berdasarkan riwayat kakeknya: Sa’d ibn ‘Ubadah ikut bersama Rasulullah dalam salah satu ekspedisi militernya. Ibunya sedang sekarat di Madinah, dan ia diberitahu untuk membuat wasiat. Ia berkata, “Apa yang harus kuwariskan? Harta itu milik Sa’d.” Ia meninggal sebelum Sa’d kembali. Ketika Sa’d kembali, hal ini diceritakan kepadanya, dan ia berkata, “Apakah akan bermanfaat baginya jika aku memberikan sedekah atas namanya?” Sa’d menjawab, “Ya.” Maka ia memberikan sedekah berupa sebuah taman berpagar, yang ia beri nama" }
summary:
  ar: "يروي مالك عن سعيد بن عمرو بن شرحبيل بن سعيد بن سعد بن عبادة عن أبيه عن جده أنه قال: خرج سعد بن عبادة مع رسول الله في بعض مغازيه، فحضرت أمه الوفاة بالمدينة، فقيل لها: أوصي. فقالت: فيم أوصي؟ إنما المال مال سعد. فتوفيت قبل أن يقدم سعد بن عبادة، فلما قدم ذكر ذلك له، فقال سعد: يا رسول الله، هل ينفعها أن أتصدق عنها؟ فقال رسول الله: نعم. فقال سعد: حائط كذا وكذا صدقة عنها، لحائط سماه. {cite:muwatta-maruf-1997 p.306}"
  tr: "Malik, Sa'id ibn 'Amr ibn Sharhabil ibn Sa'id ibn Sa'd ibn 'Ubadah'tan, babasından, o da dedesinden rivayetle şöyle naklediyor: Sa'd ibn 'Ubadah, Allah'ın Resulü ile birlikte bir askeri sefere çıktı. Annesi Medine'de ölüm döşeğindeydi ve ona: \"Vasiyet et\" denildi. Annesi: \"Ne vasiyet edeyim? Para Sa'd'a ait\" dedi. Sa'd ibn 'Ubadah dönmeden önce vefat etti. Sa'd döndüğünde bunu ona anlattı ve Sa'd: \"Ey Allah'ın Resulü, onun adına sadaka verirsem ona faydası olur mu?\" dedi. Allah'ın Resulü: \"Evet\" dedi. Sa'd: \"Şu bahçe onun adına sadaka olarak veriliyor\" dedi ve bir bahçenin adını söyledi. {cite:muwatta-maruf-1997 s.306}"
  id: "Malik meriwayatkan dari Sa'id ibn 'Amr ibn Sharhabil ibn Sa'id ibn Sa'd ibn 'Ubadah, dari ayahnya, dari kakeknya, bahwa ia berkata: Sa'd ibn 'Ubadah pergi bersama Rasulullah dalam salah satu ekspedisi militernya. Ibunya sedang sekarat di Madinah, dan ia diberitahu: \"Buatlah wasiat.\" Ia berkata: \"Apa yang harus saya wasiatkan? Uang itu milik Sa'd.\" Ia meninggal sebelum Sa'd ibn 'Ubadah kembali. Ketika ia kembali, ia menceritakan hal ini kepadanya, dan Sa'd berkata: \"Wahai Rasulullah, apakah akan bermanfaat baginya jika saya memberikan sedekah atas namanya?\" Rasulullah menjawab: \"Ya.\" Sa'd berkata: \"Kebun ini dan itu diberikan sebagai sedekah atas namanya,\" dan ia menyebutkan sebuah kebun. {cite:muwatta-maruf-1997 p.306}"
