label: { ar: "الموطأ 2211 — مالك عن سعيد بن عمرو بن شرحبيل عن أبيه عن جده: خرج سعد بن عبادة مع رسول الله في بعض مغازيه، فحضرت أمه الوفاة بالمدينة، فقيل لها أوصي، فقالت: فيم أوصي؟ إنما المال مال سعد، فتوفيت قبل أن يقدم، فلما قدم ذكر ذلك له، فقال: هل ينفعها أن أتصدق عنها؟ قال: نعم، فتصدق بحائط سماه", en: "Muwatta 2211" }
summary:
  ar: "يروي مالك عن سعيد بن عمرو بن شرحبيل بن سعيد بن سعد بن عبادة عن أبيه عن جده أنه قال: خرج سعد بن عبادة مع رسول الله في بعض مغازيه، فحضرت أمه الوفاة بالمدينة، فقيل لها: أوصي. فقالت: فيم أوصي؟ إنما المال مال سعد. فتوفيت قبل أن يقدم سعد بن عبادة، فلما قدم ذكر ذلك له، فقال سعد: يا رسول الله، هل ينفعها أن أتصدق عنها؟ فقال رسول الله: نعم. فقال سعد: حائط كذا وكذا صدقة عنها، لحائط سماه. {cite:muwatta-maruf-1997 p.306}"
