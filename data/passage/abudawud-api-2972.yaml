label: { ar: "سنن أبي داود 2972 — ما خلّفه من تركة وميراث", en: "Sunan Abi Dawud 2972 — what was left behind: estate and inheritance", ur: "سنن ابی داؤد 2972 — ترکہ اور میراث", es: "Sunan Abi Dawud 2972 — lo que dejó: patrimonio y herencia", fr: "Sunan Abi Dawud 2972 — Ce qui a été laissé derrière: biens et héritage" }
text: "… عَنِ الْمُغِيرَةِ، قَالَ جَمَعَ عُمَرُ بْنُ عَبْدِ الْعَزِيزِ بَنِي مَرْوَانَ حِينَ اسْتُخْلِفَ فَقَالَ إِنَّ رَسُولَ اللَّهِ كَانَتْ لَهُ فَدَكُ فَكَانَ يُنْفِقُ مِنْهَا وَيَعُودُ مِنْهَا عَلَى صَغِيرِ بَنِي هَاشِمٍ وَيُزَوِّجُ مِنْهَا أَيِّمَهُمْ وَإِنَّ فَاطِمَةَ سَأَلَتْهُ أَنْ يَجْعَلَهَا لَهَا فَأَبَى فَكَانَتْ كَذَلِكَ فِي حَيَاةِ رَسُولِ اللَّهِ حَتَّى مَضَى لِسَبِيلِهِ فَلَمَّا أَنْ وَلِيَ أَبُو بَكْرٍ عَمِلَ فِيهَا بِمَا …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2972، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2972 (Tribute, Spoils, and Rulership (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن ابی داؤد کی حدیث نمبر 2972، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 2972 (Tributo, Botín y Gobernanza (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), menciona lo que quedó: propiedades y herencias. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sunan Abi Dawud, n° 2972 (Tribut, Butin et Souveraineté (Kitab Al-Kharaj, Wal-Fai' Wal-Imarah)), mentionne ce qui a été laissé: biens et héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, des dernières heures, des biens, des reliques et des tombes."
