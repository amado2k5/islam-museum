text: "… وَيَحْمَدُهُ عَشْرًا \". فَرَأَيْتُ رَسُولَ اللَّهِ ـ يَعْقِدُهَا بِيَدِهِ \" فَذَلِكَ خَمْسُونَ وَمِائَةٌ بِاللِّسَانِ، وَأَلْفٌ وَخَمْسُمِائَةٍ فِي الْمِيزَانِ، وَإِذَا أَوَى إِلَى فِرَاشِهِ سَبَّحَ وَحَمِدَ وَكَبَّرَ مِائَةً، فَتِلْكَ مِائَةٌ بِاللِّسَانِ، وَأَلْفٌ فِي الْمِيزَانِ، فَأَيُّكُمْ يَعْمَلُ فِي الْيَوْمِ أَلْفَيْنِ وَخَمْسَمِائَةِ سَيِّئَةٍ \". قَالُوا: وَكَيْفَ لاَ يُحْصِيهِمَا قَالَ \" يَأْتِي أَحَدَكُمُ الشَّيْطَانُ، وَهُوَ فِي الصَّلاَةِ، فَيَقُولُ: اذْكُرْ كَذَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 926، يذكر الميزان. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 926 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of the Scale. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 926، جس میں میزان کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
