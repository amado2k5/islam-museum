label: { ar: "سنن ابن ماجه 926 — الميزان", en: "Sunan Ibn Majah 926 — the Scale", ur: "سنن ابن ماجہ 926 — میزان", es: "Sunan Ibn Majah 926 - la escala", fr: "Sunan Ibn Majah 926 — l'Échelle", tr: "Sünen İbn Mâce 926 — Mizan", id: "Sunan Ibnu Majah 926 — Al-Mizan" }
text: "… وَيَحْمَدُهُ عَشْرًا \". فَرَأَيْتُ رَسُولَ اللَّهِ ـ يَعْقِدُهَا بِيَدِهِ \" فَذَلِكَ خَمْسُونَ وَمِائَةٌ بِاللِّسَانِ، وَأَلْفٌ وَخَمْسُمِائَةٍ فِي الْمِيزَانِ، وَإِذَا أَوَى إِلَى فِرَاشِهِ سَبَّحَ وَحَمِدَ وَكَبَّرَ مِائَةً، فَتِلْكَ مِائَةٌ بِاللِّسَانِ، وَأَلْفٌ فِي الْمِيزَانِ، فَأَيُّكُمْ يَعْمَلُ فِي الْيَوْمِ أَلْفَيْنِ وَخَمْسَمِائَةِ سَيِّئَةٍ \". قَالُوا: وَكَيْفَ لاَ يُحْصِيهِمَا قَالَ \" يَأْتِي أَحَدَكُمُ الشَّيْطَانُ، وَهُوَ فِي الصَّلاَةِ، فَيَقُولُ: اذْكُرْ كَذَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 926، يذكر الميزان. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Ibn Majah, no. 926 (Establishing the Prayer and the Sunnah Regarding Them), that speaks of the Scale. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابن ماجہ کی حدیث نمبر 926، جس میں میزان کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Ibn Majah, n.º 926 (Establecimiento de la oración y la Sunnah al respecto), habla de la balanza. El Libro de Hasanat y Sayyi'at la incluye entre los textos que cuentan, escriben, borran o pesan una acción."
  fr: "Un hadith du Sunan Ibn Majah, n° 926 (Établissement de la prière et de la Sunna à ce sujet), mentionne la balance. Le Livre des Hasanat et des Sayyi'at la recense parmi les textes qui traitent du comptage, de l'écriture, de l'effacement ou de la pesée d'un acte."
  tr: "İbn Majah'ın Süneni'nde yer alan 926 numaralı hadiste teraziden bahsedilir. Bu hadis, iyi ve kötü amellerin listesini, eylemleri sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 926, menyebutkan timbangan. Hadits ini menggabungkan daftar amal baik dan buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
