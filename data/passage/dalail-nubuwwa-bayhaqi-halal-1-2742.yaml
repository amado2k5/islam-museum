text: "… حتى قاءَت نصف القدح، ثم قال للأخرى: قيئي فقاءَت قيحاً ودما وصديداً ولحماً عبيطاً، وغيره حتى ملأت القدح، ثم قال : إنَّ هاتَيْن صامَتًا عَمَّا أحَلَّ اللّٰه لهما، وأفطرتا على ما حرَّمَ اللّه عليهما، جَلَستْ إحداهما إلى الأخرى فجعلتا تأكلان …"
