text: "… عوف وكان قد نجم نفاقه حين قتل رسول اللّٰه الحارث ابن سُوَيد بن الصامت كما تقدم. فقال يرثيه ويذم - قبّحه اللّٰه - الدخول في الدين: لقد عشت دهراً وما أن أرى من الناس داراً ولا مجمع أبرّ عهوداً وأوفى …"
summary:
  ar: "مقطع من البداية والنهاية، المجلد المصوَّر 3، ص 244، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Bidaya wa-l-Nihaya, scan volume 3, p. 244, that carries an elegy or praise of the dead; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "البدایہ والنہایہ، اسکین جلد 3، ص 244 کا اقتباس جس میں مرثیہ یا میت کی تعریف ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
