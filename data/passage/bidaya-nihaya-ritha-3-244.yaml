  tr: "\"Başlangıç ve Son\" adlı resimli cilt 3'ün 244. sayfasından, ölen kişi için yazılmış bir ağıt ve övgüden bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Awal dan Akhir,\" Volume Bergambar 3, halaman 244, berisi elegi dan eulogi untuk almarhum; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban elegi dan eulogi paling terkenal."
