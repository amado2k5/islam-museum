text: "… أنس ضيّيه، قال: قال رسول اللّٰه لا يؤمنُ أحدُكم حتى أكون أحبَّ إليه من والده وولده والناس أجمعين. متفق عليه. : ثلاثٌ من كنَّ فيه وجد بهنَّ حلاوة - وعنه، قال: قال رسول اللّٰه الإيمان : من كان الله ورسولهُ …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 1، ص 49، يذكر ما لا يتم الإيمان إلا به، وخصال من كنّ فيه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Mishkat al-Masabih, scan volume 1, p. 49, that mentions what faith is not complete without, traits that, found in a person, mark faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "مشکاۃ المصابیح، اسکین جلد 1، ص 49 کا اقتباس جس میں جس کے بغیر ایمان مکمل نہیں، وہ خصلتیں جو جس میں ہوں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Mishkat al-Masabih, volumen 1, pág. 49, que menciona los elementos indispensables para que la fe esté completa, rasgos que, presentes en una persona, la caracterizan; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Un extrait de Mishkat al-Masabih, volume 1, page 49, mentionne les qualités essentielles à la foi, celles qui, chez une personne, la caractérisent. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Mişkat el-Masabih, Resimli Cilt 1, sayfa 49'dan bir alıntı, iman için gerekli olan unsurları ve imana sahip olanların özelliklerini ele almaktadır; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Mishkat al-Masabih, Jilid Bergambar 1, halaman 49, menyebutkan apa yang penting bagi iman dan kualitas orang-orang yang memilikinya; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan kualitas seorang mukmin."
