label: { ar: "الموطأ 635 — أم سلمة: من أصابته مصيبة فاسترجع وقال اللهم أجرني في مصيبتي وأعقبني خيراً منها؛ فأعقبها الله رسوله", en: "Muwatta 635", es: "Muwatta 635", fr: "Muwatta 635", ur: "موطا 635", tr: "El-Muvatta 635 — Ümmü Seleme: Kim bir musibetle karşılaşırsa ve “İnna lillahi ve inna ilayhi raji'un” (Allah'a aitiz ve O'na döneceğiz) der ve “Ey Allah'ım, musibetimin karşılığını ver ve onu daha iyisiyle değiştir” derse, Allah onu Resulü için daha iyisiyle değiştirir." }
text: "اللهم أجرني في مصيبتي، وأعقبني خيراً منها"
summary:
  ar: "يرويه مالك عن ربيعة بن أبي عبد الرحمن عن أم سلمة زوج النبي، أن النبي قال: من أصابته مصيبة فقال كلمة الاسترجاع التي أمر الله بها [[passage/quran-2-156|البقرة 156]] ثم قال: اللهم أجرني في مصيبتي وأعقبني خيراً منها، إلا فعل الله ذلك به. قالت أم سلمة: فلما توفي أبو سلمة قلت ذلك، ثم قلت: ومن خير من أبي سلمة؟ فأعقبها الله رسوله فتزوجها. ويذكر المحقق نقلاً عن ابن عبد البر ⁦(التمهيد 3/180–181)⁩ أن يحيى رواه هكذا وتابعه جماعة منهم معن، وأن ابن وهب وأبا مصعب وسويداً رووه عن مالك عن ربيعة أن أبا سلمة قال لأم سلمة: لقد سمعت من النبي، وأن الحديث يتصل من وجوه شتى، واختلافهم في جعله لأم سلمة عن النبي أو عن أبي سلمة لا يقدح فيه لأن رواية الصحابة بعضهم عن بعض سواء، ويحيل على الترمذي (3511). {cite:muwatta-maruf-1997 p.323} {cite:muwatta-maruf-1997 p.324}"
  tr: "Malik, Rabi'ah ibn Abi 'Abd al-Rahman'dan, o da Peygamberin eşi Ümmü Seleme'den rivayet ederek, Peygamberin şöyle buyurduğunu nakletmiştir: \"Kim bir musibete uğrar da Allah'ın emrettiği duaları [Al-Baqarah 2:156] söyler ve sonra 'Ey Allah'ım, bana bu musibetin karşılığını ver ve onu daha iyisiyle değiştir' derse, Allah bunu ona mutlaka yapar.\" Ümmü Seleme şöyle dedi: \"Ebu Seleme vefat ettiğinde bunu söyledim, sonra da 'Ebu Seleme'den daha hayırlı kim var?' dedim. Bunun üzerine Allah, onun yerine Resulünü gönderdi ve o da Ümmü Seleme ile evlendi.\" Araştırmacı, İbn Abd al-Barr'dan (al-Tamhid 3/180-181) alıntı yaparak, Yahya'nın bunu bu şekilde naklettiğini ve Ma'n da dahil olmak üzere bir grup insanın onu takip ettiğini belirtmektedir. İbn Vahb, Ebu Musab ve Suveyd, Malik'ten, o da Rabi'ah'tan rivayetle, Ebu Seleme'nin Ümmü Seleme'ye şöyle dediğini nakletmişlerdir: \"Bunu Peygamber'den işittim.\" Hadis çeşitli rivayet zincirleriyle birbirine bağlıdır ve Sahabelerin birbirlerinden rivayet ettikleri aynı olduğu için, hadisi Ümmü Seleme'ye mi yoksa Ebu Seleme'ye mi atfettikleri konusundaki görüş ayrılığı hadisi geçersiz kılmaz. Tirmizi'ye (3511) atıfta bulunur. {cite:muwatta-maruf-1997 s.323} {cite:muwatta-maruf-1997 s.324}"
  id: "Malik meriwayatkannya dari Rabi'ah ibn Abi 'Abd al-Rahman, dari Umm Salamah, istri Nabi, bahwa Nabi bersabda: \"Barangsiapa ditimpa musibah dan mengucapkan doa yang diperintahkan Allah [Al-Baqarah 2:156], kemudian berkata: 'Ya Allah, berilah aku pahala atas musibahku dan gantikanlah dengan sesuatu yang lebih baik,' Allah pasti akan mengabulkannya.\" Umm Salamah berkata: \"Ketika Abu Salamah meninggal, aku mengucapkan itu, lalu aku berkata: 'Siapakah yang lebih baik daripada Abu Salamah?' Maka Allah menggantinya dengan Rasul-Nya, dan beliau menikahinya.\" Peneliti menyebutkan, mengutip Ibn 'Abd al-Barr (al-Tamhid 3/180-181), bahwa Yahya meriwayatkannya dengan cara ini, dan sekelompok orang mengikutinya, termasuk Ma'n. Ibn Wahb, Abu Mus'ab, dan Suwayd meriwayatkannya dari Malik, dari Rabi'ah, bahwa Abu Salamah berkata kepada Umm Salamah: \"Aku mendengarnya dari Nabi.\" Hadits ini terhubung melalui berbagai rantai periwayatan, dan perbedaan pendapat mereka tentang menghubungkannya kepada Umm Salamah dari Nabi atau kepada Abu Salamah tidak membatalkannya, karena riwayat para Sahabat satu sama lain adalah sama. Beliau merujuk pada al-Tirmidhi (3511). {cite:muwatta-maruf-1997 p.323} {cite:muwatta-maruf-1997 p.324}"
