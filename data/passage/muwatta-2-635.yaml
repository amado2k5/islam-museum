label: { ar: "الموطأ 635 — أم سلمة: من أصابته مصيبة فاسترجع وقال اللهم أجرني في مصيبتي وأعقبني خيراً منها؛ فأعقبها الله رسوله", en: "Muwatta 635" }
text: "اللهم أجرني في مصيبتي، وأعقبني خيراً منها"
summary:
  ar: "يرويه مالك عن ربيعة بن أبي عبد الرحمن عن أم سلمة زوج النبي، أن النبي قال: من أصابته مصيبة فقال كلمة الاسترجاع التي أمر الله بها [[passage/quran-2-156|البقرة 156]] ثم قال: اللهم أجرني في مصيبتي وأعقبني خيراً منها، إلا فعل الله ذلك به. قالت أم سلمة: فلما توفي أبو سلمة قلت ذلك، ثم قلت: ومن خير من أبي سلمة؟ فأعقبها الله رسوله فتزوجها. ويذكر المحقق نقلاً عن ابن عبد البر (التمهيد 3/180–181) أن يحيى رواه هكذا وتابعه جماعة منهم معن، وأن ابن وهب وأبا مصعب وسويداً رووه عن مالك عن ربيعة أن أبا سلمة قال لأم سلمة: لقد سمعت من النبي، وأن الحديث يتصل من وجوه شتى، واختلافهم في جعله لأم سلمة عن النبي أو عن أبي سلمة لا يقدح فيه لأن رواية الصحابة بعضهم عن بعض سواء، ويحيل على الترمذي (3511). {cite:muwatta-maruf-1997 p.323} {cite:muwatta-maruf-1997 p.324}"
