label: { ar: "الموطأ 393 — ابن عمر يركب إلى ريم فيقصر، ومالك: نحو أربعة برد", en: "Muwatta 393" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه عبد الله بن عمر أنه ركب إلى ريم فقصر الصلاة في مسيره ذلك؛ ويقول مالك إن ذلك نحو من أربعة بُرد. وهو في باب ما يجب فيه قصر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.210}"
