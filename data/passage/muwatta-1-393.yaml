label: { ar: "الموطأ 393 — ابن عمر يركب إلى ريم فيقصر، ومالك: نحو أربعة برد", en: "Muwatta 393", es: "Muwatta 393", fr: "Muwatta 393", ur: "موطا 393", tr: "El-Muvatta 393 — İbn Ömer Rim'e biner ve namazlarını kısaltır; Malik ise şöyle der: yaklaşık dört burd", id: "Al-Muwatta 393 — Ibnu Umar pergi ke Rim dan mempersingkat salatnya, dan Malik berkata: sekitar empat burd" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سالم بن عبد الله عن أبيه عبد الله بن عمر أنه ركب إلى ريم فقصر الصلاة في مسيره ذلك؛ ويقول مالك إن ذلك نحو من أربعة بُرد. وهو في باب ما يجب فيه قصر الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق والشافعي ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.210}"
  tr: "Malik'in İbn Şihab'dan, o da Salim ibn Abdullah'tan, o da babası Abdullah ibn Ömer'den rivayet ettiği bir hadiste, Rim'e kadar at üzerinde gittiğini ve bu yolculuk sırasında namazlarını kısalttığını belirtmektedir. Malik, bu mesafenin yaklaşık dört burd olduğunu söyler. Bu, namazı kısaltmayı gerektiren hususlar bölümünde yer almaktadır. Editör, bu hadisin Malik'ten Ebu Musab, Suveyd, Abdülrazzak, Şafiî, Muhammed ibn Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.210}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Ibnu Shihab, atas otoritas Salim ibn Abdullah, atas otoritas ayahnya Abdullah ibn Umar, menyatakan bahwa ia menunggang kuda ke Rim dan mempersingkat salatnya selama perjalanan itu. Malik mengatakan bahwa jarak tersebut kira-kira empat burd. Ini terdapat dalam bab tentang apa yang menyebabkan perlunya mempersingkat salat. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Musab, Suwaid, Abd al-Razzaq, al-Shafi'i, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.210}"
