label: { ar: "الموطأ 2082 — مالك: فيمن اشترى شقصا مع قوم في أرض بحيوان أو عرض، فجاء الشريك يأخذ بشفعته، فوجد العبد أو الوليدة قد هلكا، فيحلف المشتري أن قيمة ما اشترى به مائة دينار، إلا أن يأتي الشفيع ببينة أن القيمة دون ذلك", en: "Muwatta 2082", es: "Muwatta 2082", fr: "Muwatta 2082", ur: "موطا 2082", tr: "El-Muvatta 2082 — Malik: Bir kimse, bir hayvan veya mal karşılığında başkalarıyla birlikte bir arazi parçasında pay satın almışsa ve ortaklardan biri ön alım hakkını kullanmak için gelmişse ve kölenin veya genç kızın ölmüş olduğunu görmüşse, alıcı, satın aldığı şeyin değerinin yüz dinar olduğunu yemin eder; ancak ön alım hakkı sahibi, değerin bundan daha az olduğuna dair delil getirirse durum değişir.", id: "Al-Muwatta 2082 — Malik: Mengenai seseorang yang membeli bagian tanah bersama orang lain dengan imbalan hewan atau barang, dan kemudian mitra tersebut datang untuk menggunakan hak prioritasnya, dan mendapati bahwa budak atau gadis muda itu telah mati, pembeli bersumpah bahwa nilai yang dibelinya adalah seratus dinar, kecuali jika pihak yang memiliki hak prioritas memberikan bukti bahwa nilainya kurang dari itu." }
summary:
  ar: "قال مالك في رجل اشترى شقصا مع قوم في أرض بحيوان، عبد أو وليدة، أو ما أشبه ذلك من العروض، فجاء الشريك يأخذ بشفعته بعد ذلك، فوجد العبد أو الوليدة قد هلكا، ولا يعلم أحد قدر قيمتهما، فيقول المشتري: قيمة العبد أو الوليدة مائة دينار، ويقول صاحب الشفعة: بل قيمتهما خمسون دينارا. قال مالك: يحلف المشتري أن قيمة ما اشترى به مائة دينار. ثم إن شاء صاحب الشفعة أخذ أو ترك، إلا أن يأتي الشفيع ببينة أن قيمة العبد أو الوليدة دون ما قال المشتري. {cite:muwatta-maruf-1997 p.253}"
  tr: "Malik, bir adamın başkalarıyla birlikte bir arazi payını hayvan, köle veya genç kız ya da benzeri bir şey karşılığında satın aldığını ve daha sonra ortaklardan birinin ön alım hakkını kullanmaya geldiğinde kölenin veya genç kızın öldüğünü ve kimsenin bunların değerini bilmediğini söylediğini anlattı. Alıcı, \"Kölenin veya genç kızın değeri yüz dinardır\" derken, ön alım hakkı sahibi, \"Değeri elli dinardır\" dedi. Malik şöyle dedi: Alıcı, satın aldığı şeyin değerinin yüz dinar olduğuna yemin etmelidir. O zaman ön alım hakkı sahibi, kölenin veya genç kızın değerinin alıcının söylediğinden daha az olduğuna dair kanıt getirmedikçe, hakkını kullanmayı seçebilir veya seçmeyebilir. {cite:muwatta-maruf-1997 s.253}"
  id: "Malik berkata tentang seorang pria yang membeli sebidang tanah dengan orang lain sebagai imbalan atas seekor hewan, seorang budak, atau seorang gadis muda, atau sesuatu yang sejenis, dan kemudian mitra tersebut datang untuk menggunakan hak prioritasnya, hanya untuk menemukan bahwa budak atau gadis muda itu telah mati, dan tidak ada yang tahu nilainya. Pembeli berkata: \"Nilai budak atau gadis muda itu adalah seratus dinar,\" sementara pihak yang memiliki hak prioritas berkata: \"Lebih tepatnya, nilainya adalah lima puluh dinar.\" Malik berkata: Pembeli harus bersumpah bahwa nilai barang yang dibelinya adalah seratus dinar. Kemudian pihak yang memiliki hak prioritas dapat memilih untuk menggunakan haknya atau tidak, kecuali jika ia membawa bukti bahwa nilai budak atau gadis muda itu kurang dari yang dikatakan pembeli. {cite:muwatta-maruf-1997 p.253}"
