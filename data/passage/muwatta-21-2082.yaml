label: { ar: "الموطأ 2082 — مالك: فيمن اشترى شقصا مع قوم في أرض بحيوان أو عرض، فجاء الشريك يأخذ بشفعته، فوجد العبد أو الوليدة قد هلكا، فيحلف المشتري أن قيمة ما اشترى به مائة دينار، إلا أن يأتي الشفيع ببينة أن القيمة دون ذلك", en: "Muwatta 2082" }
summary:
  ar: "قال مالك في رجل اشترى شقصا مع قوم في أرض بحيوان، عبد أو وليدة، أو ما أشبه ذلك من العروض، فجاء الشريك يأخذ بشفعته بعد ذلك، فوجد العبد أو الوليدة قد هلكا، ولا يعلم أحد قدر قيمتهما، فيقول المشتري: قيمة العبد أو الوليدة مائة دينار، ويقول صاحب الشفعة: بل قيمتهما خمسون دينارا. قال مالك: يحلف المشتري أن قيمة ما اشترى به مائة دينار. ثم إن شاء صاحب الشفعة أخذ أو ترك، إلا أن يأتي الشفيع ببينة أن قيمة العبد أو الوليدة دون ما قال المشتري. {cite:muwatta-maruf-1997 p.253}"
