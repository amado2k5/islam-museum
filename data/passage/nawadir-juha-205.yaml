text: "… يوجّه وجهه نحو ثيابه كان أحدُهم يغتسلُ في بحيرةِ آقَ شَهْرْ وكان الشيخ هناك، فقال الرجل: إذا كان الإنسانُ يغتسلُ فإلى أيِّ جهةٍ يجبُ أن يوجِّه وجههُ؟ فأجابه الشيخ: يوجِّه وجهَهُ إلى الجهة التي فيها ثيابُهُ. لو لم أخنقه لكان …"
summary:
  ar: "سأل رجلٌ جحا عند بحيرة آق شهر إلى أي جهة يتجه وهو يستحم، فقال له جحا أن يتجه نحو المكان الذي فيه ثيابه. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  en: "At the lake of Akshehir a man asks Juha which way to face when bathing, and Juha tells him to face the place where his clothes are. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  ur: "آق شہر کی جھیل پر ایک آدمی جحا سے پوچھتا ہے کہ نہاتے وقت کس طرف رخ کرے، تو جحا کہتا ہے کہ اس طرف رخ کرو جہاں تمہارے کپڑے ہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  fr: "Au lac d'Akshehir, un homme demande à Juha dans quelle direction se tourner pour se baigner, et Juha lui dit de se tourner vers l'endroit où sont ses vêtements. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  es: "En el lago de Akshehir, un hombre pregunta a Juha hacia dónde debe mirar al bañarse, y Juha le dice que mire hacia donde está su ropa. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
  tr: "Bir adam, Akşir Gölü'nde Juha'ya yıkanırken hangi yöne dönmesi gerektiğini sordu ve Juha ona, elbiselerinin olduğu yöne dönmesini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 93}"
  id: "Seorang pria bertanya kepada Juha di Danau Aqsheer ke arah mana ia harus menghadap saat mandi, dan Juha menyuruhnya menghadap ke arah pakaiannya berada. {cite:juha-nawadir-kubra-djuwaydi p. 93}"
