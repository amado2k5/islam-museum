text: "… يقول: من أجمع الصوم من الليل فليصم، ومن لها: ضعي يدك اليمنى على فؤادك فامسحيه، أصبح ولم يجمع فلا يصم. وقولي: بسم الله، اللَّهم داوني بدوائك، واشفني أخرجها ابن منده وأبو نعيم. بشفائك، وأغنني بفضلك عمن سواك. قالت ربيعة : …"
