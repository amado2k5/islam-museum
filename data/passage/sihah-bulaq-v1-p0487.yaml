text: |-
  ١ بتشدبد الياء وقوله لواه
  أى مخليه ام
  ١٥٤
  باب الجيم)
  أسرحت الداية قال الاصعى السريجيات سيوف منسوية الى قين يقال له سريج وشبه
  العجاج جاحسن الانف فى الدقة والاسوامفقال
  وجبهة وحاجيامز ججا• وفاحا ومرسنا مسرجا
  والسراج. عسروف وتسمى الشمس سراجا والمسرجسة بالفتح التى فيها الفتيلة والدهن
  والسرج وجة الطبيعة والطريقة قال الاصمعى اذا استوت أخلاق الناس قيرهم على
  سرجوجسة واحدة ⁦( فتج)⁩ أبوعمر والسفج الظليم الخفيف وهو ملحق بانلهاسى يتشديد
  الحرف الثالث منه ⁦(سلج )⁩ سلج اللقمة بالكسر يسلخها سلجا وسلجانا أى باعها دقولهم
  الاكل سليان والقضاءليات أى اذا أخذ الرجل الدين أكله فاذا أراد صاحب الدين
  حقه لواه به والسلج بالضم والتشديد نبت ترعاه الابل وقد سلمت الابل بالفتح تسلج بالضم اذا
  استطلقت بطونها عن أكل السلج ⁦( مج)⁩ سعج الشى بالضم سماحة قيح فهو سمج مثل ضخم
  فه وضخم وسمج مثل خشرفه وحتن وسميج مثل قبح فهوقيح قال أبوذؤيب
  فان تصرمى حبلى وان تتبذلى • خليلا ومنهم صالح وسميج
  وقوم نهاج مثل ضخام واستمجه عدّه سمجا والسميح والسميج اللبن الدسم الخبيث العهم
  وكذلك السمهج والسعلج بزيادة الهاء واللام محج) السممج الاتان الطويلة الظهر
  وكذلك الغرس ولا يقال للذكر مرج السمرّج والسمرّجة استخراج الحراج فى ثلاث
  مرار قارسى معرب قال العجاج يوم خراج يخرج السمرتجا ( ملج السملج
  الخفيف وهو ملاق بالخاسى يتنديد المرف الشالث منه قال الراجز
  قالت له مقالة تلجلجا • قولامليصا حسناسملا
  لو يتابخ النى "يه لا نغما • يابن الكرام لج على الهودجا
  أ ج) الاصبى جاجج زرة ى الر بالنارياش ماحى رتتها الع
  يادارسلى بين دارات العوج • جرت عليها كل ريح سيهوج
  هوجاء جات من جبال ياجون • من عن يميز انخط أوسماهيج
  (-وج الساج ضرب من الشهبر والساج أيضا الطيدان الاخضر والجمع سيدان
  وسواج بالضم موضع وأنشد الاصمعى
  أقبلن من نيرومن سواج • بالقوم قدملوامن الادلاج
  ⁦(سهج)⁩ ريح سيهج وسيهوج أى شديده وقد سهجت الريح وسهج النوم ايلتهم أى سناروا
  قال الراجز كيف تراها تغتلى باشرج • وقد سهجناهافطال السهبج
  وسهعت الطيب عقته وسهجت الريح الارض قشرتها قال منظور الاسدى
  *ل تعرف الدارلام الخشرج * غيرهاسا فى الرياح السهج
  قال أبوعمر والمهج مرّ الريح وأنشد اذا هبطن مستحارامسهجا
  صل الشين) ( حيج لشجة واحدة شجاح الراس وقد شجه يشجه ويشجه شجا
  فه و منجوج وشهيج ووتد مسجوج وشصيج ومشحيح تدّد لكثرة ذلك فيه ورجل أشج بين
  الشهيج اذا كان فى جبينه أثر الشجسة وشجت السفينة البحرأى شفته وشه بحت المفازة قطعتها
  مال
