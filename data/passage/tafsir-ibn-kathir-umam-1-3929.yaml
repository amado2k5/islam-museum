text: "… بن سعيد، عن سعيد بن المسيب قال: ولد نوح غَلِيَلام ثلاثة: سَامٌ، وحَامٌ، ويَافِثُ، ووَلَدَ كلّ واحدٍ مِن هذه الثّلاثة ثلاثةٌ، فولد سامٌ: العربَ، وفارسَ، والرُّومَ، وولد يَافِتُ: التُّركَ والصَّقالبةَ ويأجوجَ ومأجوجَ، وولد حامٌ: القبطَ والسُّودانَ والبربرَ. وروي عن وهب …"
