text: "… ابْنِ عُمَرَ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. والْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ لَ عل وَغَيْرِهِمْ كَرِهُوا النَّذْرَ. وقَالَ عَبْدُ اللهِ بْنُ الْمُبَارَكِ : مَعْنَى الكرَاهَةِ في النَّذْرِ في الطَّاعَةِ والْمَعْصِيَةِ، فَإِنْ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 373، يرد فيه ذكر الطاعة والمعصية، والكراهة، وما كرهه الفقهاء، والطاعة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
