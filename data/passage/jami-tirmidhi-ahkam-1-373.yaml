text: "… ابْنِ عُمَرَ. قَالَ أَبُو عِيسَى حَدِيثُ أَبِي هُرَيْرَةَ حَدِيثٌ حَسَنٌ صَحِيحٌ. والْعَمَلُ عَلَى هَذَا عِنْدَ بَعْضِ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ لَ عل وَغَيْرِهِمْ كَرِهُوا النَّذْرَ. وقَالَ عَبْدُ اللهِ بْنُ الْمُبَارَكِ : مَعْنَى الكرَاهَةِ في النَّذْرِ في الطَّاعَةِ والْمَعْصِيَةِ، فَإِنْ …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 1، ص 373، يرد فيه ذكر الطاعة والمعصية، والكراهة، وما كرهه الفقهاء، والطاعة، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 1, p. 373, whose wording mentions obedience and disobedience, dislike (karaha), what the jurists disliked, obedience, what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع ترمذی، اسکین جلد 1، ص 373 کا اقتباس جس میں اطاعت اور معصیت، کراہت، جسے فقہاء نے مکروہ کہا، اطاعت، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-Tirmidhi, volume numérisé 1, p. 373, dont le texte mentionne l'obéissance et la désobéissance, la réprobation (karaha), ce que les juristes ont réprouvé, l'obéissance, ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-Tirmidhi, volumen digitalizado 1, p. 373, cuyo texto menciona la obediencia y la desobediencia, la reprobación (karaha), lo que los juristas reprobaron, la obediencia, lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Cami' el-Tirmizi'nin 1. cildinin 373. sayfasından, itaat ve itaatsizlik, kınanacak fiiller, fıkıhçıların kınanacak fiiller olarak değerlendirdikleri şeyler, itaat fiilleri ve mekruh olan fiiller konularını ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz fiiller, itaat fiilleri, tavsiye edilen fiiller, kınanacak fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Jami' al-Tirmidhi, Jilid 1, halaman 373, membahas tentang ketaatan dan kedurhakaan, perbuatan tercela, apa yang dianggap tercela oleh para ahli hukum, serta perbuatan taat dan apa yang tidak disukai. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam perbuatan wajib, perbuatan taat, perbuatan anjuran, perbuatan tercela, perbuatan haram, dan dosa-dosa kecil."
