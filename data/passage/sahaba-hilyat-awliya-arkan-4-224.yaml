text: "… فقل آمنت بالله وملائكته وكتبه ورسله. • حدثنا على بن هارون بن محمد تناجعر الفريابى ثنا قتيبة بن سعيد ثنا حماد بن زيد عن شعيب بن الحتحاب عن هنيدة أمرأة ابراهيم النخعى : أن ابراهيم كان يصوم يوما ويفطر يوما. …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 4، ص 224، يذكر الإيمان بالله وملائكته وكتبه ورسله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 4, p. 224, that mentions belief in God, His angels, His books and His messengers; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 4، ص 224 کا اقتباس جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
