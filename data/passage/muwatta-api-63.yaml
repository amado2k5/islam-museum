label: { ar: "موطأ مالك 63 — كتابة الحسنات، محو السيئات وحط الخطايا", en: "Muwatta Malik 63 — the writing of good deeds; bad deeds erased and sins shed", ur: "موطأ مالک 63 — نیکیوں کا لکھا جانا، برائیوں کا مٹنا اور خطاؤں کا جھڑنا", es: "Muwatta Malik 63 — la escritura de las buenas obras; las malas obras borradas y los pecados perdonados", fr: "Muwatta Malik 63 — l'inscription des bonnes actions; les mauvaises actions effacées et les péchés pardonnés", tr: "Muwatta Malik 63 — İyilikleri yazmak, kötü amelleri silmek ve günahları ortadan kaldırmak", id: "Muwatta Malik 63 — Mencatat amal kebaikan, menghapus amal keburukan, dan menghilangkan dosa" }
text: "… اللَّهِ الْمَدَنِيِّ الْمُجْمِرِ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ، يَقُولُ مَنْ تَوَضَّأَ فَأَحْسَنَ وُضُوءَهُ ثُمَّ خَرَجَ عَامِدًا إِلَى الصَّلاَةِ فَإِنَّهُ فِي صَلاَةٍ مَادَامَ يَعْمِدُ إِلَى الصَّلاَةِ وَإِنَّهُ يُكْتَبُ لَهُ بِإِحْدَى خُطْوَتَيْهِ حَسَنَةٌ وَيُمْحَى عَنْهُ بِالأُخْرَى سَيِّئَةٌ فَإِذَا سَمِعَ أَحَدُكُمُ الإِقَامَةَ فَلاَ يَسْعَ فَإِنَّ أَعْظَمَكُمْ أَجْرًا أَبْعَدُكُمْ دَارًا. قَالُوا لِمَ يَا أَبَا هُرَيْرَةَ قَالَ مِنْ أَجْلِ كَثْرَةِ الْخُطَا."
summary:
  ar: "حديث في موطأ مالك، رقم 63، يذكر كتابة الحسنات، ومحو السيئات وحط الخطايا. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Muwatta Malik, no. 63 (Purity), that speaks of the writing of good deeds, bad deeds erased and sins shed. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "موطأ مالک کی حدیث نمبر 63، جس میں نیکیوں کا لکھا جانا، برائیوں کا مٹنا اور خطاؤں کا جھڑنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Muwatta Malik, n.° 63 (Pureza), que habla de la escritura de buenas acciones, el borrado de malas acciones y el perdón de pecados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un rapport du Muwatta Malik, n° 63 (Pureté), évoque l'inscription des bonnes actions, l'effacement des mauvaises et l'expiation des péchés. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui recensent, inscrivent, effacent ou pèsent une action."
  tr: "Malik'in Muvatta'sında yer alan 63 numaralı hadis, iyi amellerin kaydedilmesinden, kötü amellerin silinmesinden ve günahların ortadan kaldırılmasından bahseder. Bu hadis, iyi ve kötü amellerin bir listesini ve amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 63, menyebutkan pencatatan amal kebaikan, penghapusan amal keburukan, dan penghapusan dosa. Hadits ini memuat daftar amal baik dan amal keburukan beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan-perbuatan tersebut."
