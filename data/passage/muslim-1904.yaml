label: { ar: "مسلم 1904 — من قاتل لتكون كلمة الله هي العليا فهو في سبيل الله", en: "Muslim 1904 — Whoever fights so that God's word is uppermost is in God's path" }
text: "أتى أعرابي النبي فقال: يا رسول الله، الرجل يقاتل للغنم والرجل يقاتل ليذكر والرجل يقاتل ليرى مكانه، فمن في سبيل الله؟ فقال رسول الله: «من قاتل لتكون كلمة الله هي العليا فهو في سبيل الله»"
summary:
  ar: "رواية أبي موسى الأشعري في باب من قاتل لتكون كلمة الله هي العليا من كتاب الإمارة في صحيح مسلم؛ سؤال الأعرابي عن الفارق بين دوافع القتال — نص ضبط نية الجهاد."
