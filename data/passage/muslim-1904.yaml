label: { ar: "مسلم 1904 — من قاتل لتكون كلمة الله هي العليا فهو في سبيل الله", en: "Muslim 1904 — Whoever fights so that God's word is uppermost is in God's path", es: "Musulmán 1904 — Quien lucha para que la palabra de Dios esté por encima de todo, está en el camino de Dios.", fr: "Muslim 1904 — Quiconque combat pour que la parole de Dieu triomphe est sur le chemin de Dieu.", ur: "مسلم 1904 - جو شخص اس لیے لڑتا ہے کہ اللہ کا کلام غالب ہو وہ اللہ کی راہ میں ہے", tr: "Müslim 1904 — Allah'ın kelamını üstün kılmak için savaşan kimse, Allah yolunda savaşmaktadır.", id: "Muslim 1904 — Barangsiapa berjuang untuk menjadikan firman Allah sebagai yang tertinggi, maka ia berjuang di jalan Allah." }
text: "أتى أعرابي النبي فقال: يا رسول الله، الرجل يقاتل للغنم والرجل يقاتل ليذكر والرجل يقاتل ليرى مكانه، فمن في سبيل الله؟ فقال رسول الله: «من قاتل لتكون كلمة الله هي العليا فهو في سبيل الله»"
summary:
  ar: "رواية أبي موسى الأشعري في باب من قاتل لتكون كلمة الله هي العليا من كتاب الإمارة في صحيح مسلم؛ سؤال الأعرابي عن الفارق بين دوافع القتال — نص ضبط نية الجهاد."
  tr: "Sahih Müslim'deki Liderlik Kitabı'nda yer alan \"Kim Allah'ın kelamı üstün olsun diye savaşırsa\" bölümünde Ebu Musa el-Eş'ari'nin rivayeti; Bedevilerin savaşma sebepleri ile cihat niyetinin metni arasındaki fark hakkındaki sorusu."
  id: "Riwayat Abu Musa al-Ash’ari dalam bab “Barangsiapa yang berperang agar firman Allah menjadi yang tertinggi” dari Kitab Kepemimpinan dalam Sahih Muslim; pertanyaan kaum Badui tentang perbedaan motif berperang — teks tentang niat jihad."
