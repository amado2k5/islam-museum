text: "… الأرض سيّاحين خُذْه فتمَوَّلْهُ وتصدَّقْ به رأيت النبي ا في وأبا بكر ومحمد يمشون أمام السرير طلب العلم فريضة على كل مسلم كلّم اللّٰه موسى، يوم كلّمه، عليه جبّة صوف من أفطر فرخصة، ومن صام فالصوم أفضل من حفظ على …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 30، ص 412، يرد فيه ذكر الفريضة والفرائض، وما وجب على كل مسلم، والرخصة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 30, p. 412, whose wording mentions the obligation (farida), a duty laid on every Muslim, the concession (rukhsa); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
