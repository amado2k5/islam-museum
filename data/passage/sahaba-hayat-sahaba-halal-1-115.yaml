text: "… : يا أبا هريرة! قد اتينا المسجد فدخلنا فيه فلم نر فيه شيتا يقسم، فقال لهم ابو هريرة: و ما رأيتم فى المسجد احدا؟ قالوا: على، رأينا قوما يصلون وقوما يقرون القرآن وقوما يتذاكرون الحلال والحرام، فقال لهم ابوهريرة: ويحكم! …"
