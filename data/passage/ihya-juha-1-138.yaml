text: "… السرى حتى أعجبهم أن يمسوا الأرض فنزلوا. فتنحى يصلى حتى يوقط أصحابه للرحيل. وثلاثة يشنؤهم اللّٰه : التاجر أو البياع الحلاف، والفقير المختال والبخيل المنان ؟ وقال ويل للذى يحدث فيكذب ليضحك به القوم ويل له ويل له الآفة الرابعة …"
summary:
  ar: "مقطع من إحياء علوم الدين، المجلد المصوَّر 1، ص 138، فيه أدب المزاح وحدوده؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Ihya' 'Ulum al-Din, scan volume 1, p. 138, with the ethics and limits of jesting; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "احیاء علوم الدین، اسکین جلد 1، ص 138 کا اقتباس جس میں مزاح کے آداب اور حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
