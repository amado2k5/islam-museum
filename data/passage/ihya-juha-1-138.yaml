  es: "Un extracto de Ihya' 'Ulum al-Din, volumen escaneado 1, p. 138, con la ética y los límites de la broma; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "İhya Ulum el-Din, Resimli Cilt 1, s. 138'den, mizahın adabı ve sınırlarını ele alan bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Ihya Ulum al-Din, Jilid Bergambar 1, hlm. 138, yang membahas etika dan batasan humor; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Juha dan Islamic Folklore Browser."
