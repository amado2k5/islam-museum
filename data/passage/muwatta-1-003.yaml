ref: "1.3"
label: { ar: "الموطأ 3 — ما بين هذين وقت: سؤال رجل عن وقت الصبح", en: "Muwatta 3", es: "Muwatta 3", fr: "Muwatta 3", ur: "موطا 3", tr: "El-Muvatta 3 — Bu iki zaman arasında: Bir adam sabah namazının vaktini sordu.", id: "Al-Muwatta 3 — Di antara kedua waktu ini: Seorang pria bertanya tentang waktu shalat Subuh (Fajr)." }
text: "أين السائل عن وقت الصلاة؟ قال: هأنذا يا رسول الله. فقال: ما بين هذين وقت"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً، في باب وقوت الصلاة: جاء رجل إلى النبي يسأله عن وقت صلاة الصبح فلم يجبه بالقول، بل صلى الصبح من الغد حين طلع الفجر، ثم صلاها في اليوم التالي بعد أن أسفر، ثم نادى السائل وقال له إن الوقت ما بين هذين. ويذكر المحقق أنه مرسل باتفاق رواة الموطأ عن مالك، وينقل عن ابن عبد البر أن معناه يتصل من حديث أبي موسى الأشعري وجابر وعبد الله بن عمرو وبريدة، وأن حديث أنس عند أحمد والنسائي في الصبح وحدها «إسناد صحيح متصل بلفظ حديث عطاء»، وأن الصحيح في رواية زيد بن أسلم أنه من مرسلات عطاء ⁦(التمهيد 4/331–333)⁩. {cite:muwatta-maruf-1997 p.35}"
  en: "A man asked about the time of prayer; the Prophet stayed silent until dawn rose, then answered the questioner that the time lies between the two limits (transmitted mursal by Ata ibn Yasar)."
  es: "Un hombre preguntó acerca de la hora de la oración; el Profeta permaneció en silencio hasta que amaneció, y luego respondió al que preguntaba que la hora está entre los dos límites (transmitido mursal por Ata ibn Yasar)."
  fr: "Un homme demanda à propos de l'heure de la prière; le Prophète resta silencieux jusqu'à ce que l'aube se lève, puis répondit à celui qui posait la question que l'heure se situait entre les deux limites (transmis mursal par Ata ibn Yasar)."
  ur: "ایک آدمی نے نماز کا وقت پوچھا۔ نبی صبح تک خاموش رہے، پھر سوال کرنے والے کو جواب دیا کہ وقت دونوں حدود کے درمیان ہے ⁦(مرسل عطاء بن یسار نے مرسلہ)⁩"
  id: "Malik meriwayatkannya dari Zaid bin Aslam, yang juga dari Ata bin Yasar, sebagai hadits mursal, dalam surah tentang waktu-waktu shalat: Seorang laki-laki datang kepada Nabi (shalawat dan salam kepadanya) menanyakan tentang waktu shalat Subuh, tetapi beliau tidak menjawabnya secara lisan. Sebaliknya, beliau shalat Subuh keesokan harinya ketika fajar menyingsing, kemudian beliau shalat lagi pada hari berikutnya setelah hari terang. Kemudian beliau memanggil orang yang bertanya dan memberitahunya bahwa waktunya berada di antara kedua waktu tersebut. Peneliti menyebutkan bahwa hadits ini mursal menurut konsensus para perawi al-Muwatta' dari Malik. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa maknanya terhubung melalui hadits Abu Musa al-Ash'ari, Jabir, Abdullah ibn Amr, dan Buraydah, dan bahwa hadits Anas dalam Ahmad dan al-Nasa'i mengenai shalat Subuh saja memiliki \"rantai periwayatan yang sahih yang terhubung dengan redaksi hadits Ata,\" dan bahwa pandangan yang benar mengenai riwayat Zaid ibn Aslam adalah bahwa itu adalah salah satu hadits mursal Ata (al-Tamhid 4/331–333). {cite:muwatta-maruf-1997 p.35}"
