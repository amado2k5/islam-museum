label: { ar: "الموطأ 3 — ما بين هذين وقت: سؤال رجل عن وقت الصبح", en: "Muwatta 3" }
text: "أين السائل عن وقت الصلاة؟ قال: هأنذا يا رسول الله. فقال: ما بين هذين وقت"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً، في باب وقوت الصلاة: جاء رجل إلى النبي يسأله عن وقت صلاة الصبح فلم يجبه بالقول، بل صلى الصبح من الغد حين طلع الفجر، ثم صلاها في اليوم التالي بعد أن أسفر، ثم نادى السائل وقال له إن الوقت ما بين هذين. ويذكر المحقق أنه مرسل باتفاق رواة الموطأ عن مالك، وينقل عن ابن عبد البر أن معناه يتصل من حديث أبي موسى الأشعري وجابر وعبد الله بن عمرو وبريدة، وأن حديث أنس عند أحمد والنسائي في الصبح وحدها «إسناد صحيح متصل بلفظ حديث عطاء»، وأن الصحيح في رواية زيد بن أسلم أنه من مرسلات عطاء (التمهيد 4/331–333). {cite:muwatta-maruf-1997 p.35}"
  en: "A man asked about the time of prayer; the Prophet stayed silent until dawn rose, then answered the questioner that the time lies between the two limits (transmitted mursal by Ata ibn Yasar)."
