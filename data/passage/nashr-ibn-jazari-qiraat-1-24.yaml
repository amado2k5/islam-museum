text: "… خط المصحف قال ولكل صنف من هذه الاقسام تمثيل تركنا ذكره اختصاراً قلت ومثال القسم الاول مالك وملك. ويخدعون ويخادعون. واوحى ووصى. ويطوع ونطوع ونحو ذلك من القراآت المشهورة ومثال القسم. الثاني قراءة عبد اللّه بن مسعود وابى الدرداء، والذ …"
summary:
  ar: "مقطع من النشر في القراءات العشر لابن الجزري، المجلد المصوَّر 1، ص 24، يذكر قراءات القرآن، وجمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Jazari's al-Nashr fi al-Qira'at al-'Ashr, scan volume 1, p. 24, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "النشر فی القراءات العشر، ابن الجزری، اسکین جلد 1، ص 24 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
