label: { ar: "الموطأ 1577 — ربيعة بن أبي عبد الرحمن: القاسم بن محمد وعروة بن الزبير قالا في الرجل عنده أربع نسوة فيطلق إحداهن البتة إنه يتزوج إن شاء ولا ينتظر انقضاء عدتها", en: "Muwatta 1577", es: "Muwatta 1577", fr: "Muwatta 1577", ur: "موطا 1577", tr: "El-Muvatta 1577 — Rabi’ah ibn Abi Abd al-Rahman: El-Kâsim ibn Muhammed ve Urve ibn el-Zübeyr, dört karısı olan ve bunlardan birini geri dönülmez şekilde boşayan bir adam hakkında, dilediği takdirde evlenebileceğini ve kadının bekleme süresinin bitmesini beklemek zorunda olmadığını söylemişlerdir.", id: "Al-Muwatta 1577 — Rabi’ah ibn Abi Abd al-Rahman: Al-Qasim ibn Muhammad dan Urwah ibn al-Zubayr berkata mengenai seorang pria yang mempunyai empat istri dan menceraikan salah satunya secara mutlak bahwa ia boleh menikah lagi jika ia mau dan tidak perlu menunggu hingga masa iddah istrinya berakhir." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن القاسم بن محمد وعروة بن الزبير كانا يقولان في الرجل يكون عنده أربع نسوة، فيطلق إحداهن البتة، إنه يتزوج إن شاء، ولا ينتظر أن تنقضي عدتها. {cite:muwatta-maruf-1997 p.57}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle, al-Qasim ibn Muhammad ve Urwah ibn al-Zubayr'ın, dört karısı olan ve bunlardan birini geri dönülmez şekilde boşayan bir adam hakkında, dilerse tekrar evlenebileceğini ve kadının bekleme süresinin bitmesini beklemesine gerek olmadığını söylediklerini aktarır. {cite:muwatta-maruf-1997 s.57}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa al-Qasim ibn Muhammad dan Urwah ibn al-Zubayr biasa mengatakan tentang seorang pria yang memiliki empat istri dan menceraikan salah satunya secara tidak dapat dibatalkan, bahwa ia dapat menikah lagi jika ia mau, dan ia tidak perlu menunggu masa iddah istrinya berakhir. {cite:muwatta-maruf-1997 p.57}"
