label: { ar: "الموطأ 2245 — مالك عن ربيعة بن أبي عبد الرحمن: أن رجلا في إمارة أبان بن عثمان أعتق رقيقا له كلهم جميعا، ولم يكن له مال غيرهم، فأمر أبان بتلك الرقيق فقسمت أثلاثا، ثم أسهم على أيهم يخرج سهم الميت، فوقع السهم على أحد الأثلاث، فعتق الثلث الذي وقع عليه السهم", en: "Muwatta 2245" }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن رجلا في إمارة أبان بن عثمان أعتق رقيقا له كلهم جميعا، ولم يكن له مال غيرهم. فأمر أبان بن عثمان بتلك الرقيق فقسمت أثلاثا، ثم أسهم على أيهم يخرج سهم الميت، فيعتقون، فوقع السهم على أحد الأثلاث، فعتق الثلث الذي وقع عليه السهم. {cite:muwatta-maruf-1997 p.326}"
