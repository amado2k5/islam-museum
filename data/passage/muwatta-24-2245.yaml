label: { ar: "الموطأ 2245 — مالك عن ربيعة بن أبي عبد الرحمن: أن رجلا في إمارة أبان بن عثمان أعتق رقيقا له كلهم جميعا، ولم يكن له مال غيرهم، فأمر أبان بتلك الرقيق فقسمت أثلاثا، ثم أسهم على أيهم يخرج سهم الميت، فوقع السهم على أحد الأثلاث، فعتق الثلث الذي وقع عليه السهم", en: "Muwatta 2245", es: "Muwatta 2245", fr: "Muwatta 2245", ur: "موطا 2245", tr: "El-Muvatta 2245 — Malik, Rabi’ah ibn Abi Abd al-Rahman’dan rivayetle: Aban ibn Uthman’ın hükümdarlığı döneminde bir adam bütün kölelerini azat etti ve onlardan başka hiçbir malı yoktu. Aban, kölelerin üçe bölünmesini emretti ve ölenin payını kimin alacağını belirlemek için kura çekti. Kura, üçte birine çıktı, böylece kura çıkan üçte bir azat edildi.", id: "Al-Muwatta 2245 — Malik, berdasarkan riwayat Rabi’ah ibn Abi Abd al-Rahman: Seorang pria pada masa pemerintahan Aban ibn Uthman membebaskan semua budaknya, dan ia tidak memiliki harta lain selain mereka. Aban memerintahkan agar para budak dibagi menjadi tiga bagian, kemudian ia mengundi untuk menentukan siapa di antara mereka yang akan menerima bagian dari orang yang meninggal. Undian jatuh pada salah satu bagian, maka bagian yang diundi tersebut dibebaskan." }
summary:
  ar: "يروي مالك عن ربيعة بن أبي عبد الرحمن أن رجلا في إمارة أبان بن عثمان أعتق رقيقا له كلهم جميعا، ولم يكن له مال غيرهم. فأمر أبان بن عثمان بتلك الرقيق فقسمت أثلاثا، ثم أسهم على أيهم يخرج سهم الميت، فيعتقون، فوقع السهم على أحد الأثلاث، فعتق الثلث الذي وقع عليه السهم. {cite:muwatta-maruf-1997 p.326}"
  tr: "Malik, Rabi'ah ibn Abi Abd al-Rahman'dan rivayetle, Aban ibn Uthman döneminde bir adamın tüm kölelerini azat ettiğini ve başka hiçbir malı olmadığını anlatır. Aban ibn Uthman, kölelerin üçe bölünmesini ve hangisinin azat edileceğini belirlemek için kura çekilmesini emretti. Kura, üçte birlik gruptan birine çıktı ve böylece kura çıkan kişi azat edildi. {cite:muwatta-maruf-1997 s.326}"
  id: "Malik meriwayatkan dari Rabi'ah ibn Abi Abd al-Rahman bahwa seorang pria pada masa pemerintahan Aban ibn Uthman membebaskan semua budaknya, dan ia tidak memiliki harta benda lainnya. Aban ibn Uthman memerintahkan agar para budak dibagi menjadi tiga bagian, kemudian diundi untuk menentukan siapa di antara mereka yang akan dibebaskan. Undian jatuh pada salah satu bagian, dan bagian yang jatuh pada undian tersebut dibebaskan. {cite:muwatta-maruf-1997 p.326}"
