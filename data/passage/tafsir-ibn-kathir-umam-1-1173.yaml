text: "… أمره اللّٰه به، حتىٰ أذنَ اللّٰه فيهم، فلما غزا رسولُ اللّٰه وَلِلة بدرًا، فقتل اللّٰه به صناديد كفَّار قريش، قال عبد اللّٰه بن أبَيِّ ابن سَلُول ومَن معه من المشركين وعبدة الأوثان: هذا أمر قد تَوَجَّه، فبايعُوا لرسول لفي على …"
