label: { ar: "الموطأ 520 — رجل من الأنصار: نهى النبي أن تستقبل القبلة لغائط أو بول", en: "Muwatta 520" }
summary:
  ar: "يرويه مالك عن نافع عن رجل من الأنصار، في باب النهي عن استقبال القبلة والإنسان على حاجته: سمع النبي ينهى أن تُستقبل القبلة لغائط أو بول. وينقل المحقق عن ابن عبد البر أن يحيى وحده رواه هكذا، وأن سائر رواة الموطأ يقولون: عن نافع عن رجل من الأنصار عن أبيه سمع النبي، وهو الصواب (التمهيد 16/125)؛ ويذكر أن أبا مصعب وسويداً وابن وهب والشافعي رووه على الصواب. {cite:muwatta-maruf-1997 p.268} {cite:muwatta-maruf-1997 p.269}"
