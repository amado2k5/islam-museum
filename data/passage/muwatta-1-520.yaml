label: { ar: "الموطأ 520 — رجل من الأنصار: نهى النبي أن تستقبل القبلة لغائط أو بول", en: "Muwatta 520", es: "Muwatta 520", fr: "Muwatta 520", ur: "موطا 520", tr: "El-Muvatta 520 — Ensar'dan bir adam: Peygamber, tuvalet veya idrar yaparken kıbleye dönmeyi yasakladı.", id: "Al-Muwatta 520 — Seorang pria dari kaum Ansar: Nabi melarang menghadap kiblat saat buang air besar atau buang air kecil." }
summary:
  ar: "يرويه مالك عن نافع عن رجل من الأنصار، في باب النهي عن استقبال القبلة والإنسان على حاجته: سمع النبي ينهى أن تُستقبل القبلة لغائط أو بول. وينقل المحقق عن ابن عبد البر أن يحيى وحده رواه هكذا، وأن سائر رواة الموطأ يقولون: عن نافع عن رجل من الأنصار عن أبيه سمع النبي، وهو الصواب ⁦(التمهيد 16/125)⁩؛ ويذكر أن أبا مصعب وسويداً وابن وهب والشافعي رووه على الصواب. {cite:muwatta-maruf-1997 p.268} {cite:muwatta-maruf-1997 p.269}"
  tr: "Malik, Nafi'den, o da Ensar'dan bir adamdan rivayetle, kıbleye dönerek tuvalet ihtiyacını gidermenin yasaklanması bölümünde şöyle nakletmiştir: Peygamberimizin, tuvalet veya çiş yaparken kıbleye dönmeyi yasakladığını işitmiştir. Araştırmacı, İbn Abdül-Barr'ın Yahya'nın bunu bu şekilde rivayet ettiğini ve Muwatta'nın diğer tüm ravîlerinin de Nafi'den, o da Ensar'dan bir adamdan, o da babasından rivayetle, Peygamberimizden işitmiş olduğunu söylediğini aktarır ve bunun doğru rivayet olduğunu belirtir (el-Temhid 16/125); ayrıca Ebu Mus'ab, Suveyd, İbn Vahb ve Şafiî'nin de bunu doğru bir şekilde rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.268} {cite:muwatta-maruf-1997 s.269}"
  id: "Malik meriwayatkannya dari Nafi’ dari seorang pria dari kaum Ansar, dalam surah tentang larangan menghadap kiblat saat buang air besar atau kecil: Ia mendengar Nabi melarang seseorang menghadap kiblat saat buang air besar atau kecil. Peneliti mengutip Ibn ‘Abd al-Barr yang mengatakan bahwa hanya Yahya yang meriwayatkannya seperti ini, dan bahwa semua perawi Muwatta’ lainnya mengatakan: dari Nafi’ dari seorang pria dari kaum Ansar dari ayahnya, yang mendengar Nabi, dan ini adalah versi yang benar (al-Tamhid 16/125); dan ia menyebutkan bahwa Abu Mus’ab, Suwaid, Ibn Wahb, dan al-Shafi’i meriwayatkannya dengan benar. {cite:muwatta-maruf-1997 p.268} {cite:muwatta-maruf-1997 p.269}"
