label: { ar: "صحيح مسلم 547 — مغفرة ما تقدم من الذنب", en: "Sahih Muslim 547 — forgiveness of past sins", ur: "صحیح مسلم 547 — پچھلے گناہوں کی مغفرت", es: "Sahih Muslim 547 — Perdón de los pecados pasados", fr: "Sahih Muslim 547 — pardon des péchés passés", tr: "Sahih Muslim 547 — Geçmiş günahların bağışlanması", id: "Sahih Muslim 547 — Pengampunan dosa masa lalu" }
text: "… شُعْبَةُ، عَنْ جَامِعِ بْنِ شَدَّادٍ، قَالَ سَمِعْتُ حُمْرَانَ بْنَ أَبَانَ، يُحَدِّثُ أَبَا بُرْدَةَ فِي هَذَا الْمَسْجِدِ فِي إِمَارَةِ بِشْرٍ أَنَّ عُثْمَانَ بْنَ عَفَّانَ قَالَ قَالَ رَسُولُ اللَّهِ \" مَنْ أَتَمَّ الْوُضُوءَ كَمَا أَمَرَهُ اللَّهُ تَعَالَى فَالصَّلوَاتُ الْمَكْتُوبَاتُ كَفَّارَاتٌ لِمَا بَيْنَهُنَّ \". هَذَا حَدِيثُ ابْنِ مُعَاذٍ وَلَيْسَ فِي حَدِيثِ غُنْدَرٍ فِي إِمَارَةِ بِشْرٍ وَلاَ ذِكْرُ الْمَكْتُوبَاتِ."
summary:
  ar: "حديث في صحيح مسلم، رقم 547، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 547 (The Book of Purification), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 547، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato del Sahih Muslim, n.º 547 (El Libro de la Purificación), habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que contabilizan, registran, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 547 (Le Livre de la Purification), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "Sahih Müslim'de 547 numaralı hadis, geçmiş günahların affedilmesinden bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 547, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
