label: { ar: "الموطأ 1147 — مالك: لا يشترك الرجل وامرأته في بدنة واحدة، بل يهدي كل واحد منهما بدنة", en: "Muwatta 1147", es: "Muwatta 1147", fr: "Muwatta 1147", ur: "موطا 1147", tr: "Al-Muwatta 1147 — Malik: Bir erkek ve karısı tek bir kurbanlık hayvanı paylaşmazlar; her biri ayrı bir hayvan kesmelidir.", id: "Al-Muwatta 1147 — Malik: Seorang laki-laki dan istrinya tidak berbagi satu hewan kurban; melainkan, masing-masing dari mereka hendaknya mempersembahkan hewan kurban yang terpisah." }
text: "لا يَشْتركُ الرَّجُلُ وامْرأتُهُ في بَدَنَةٍ واحِدةٍ"
summary:
  ar: "يذكر مالك أنه سمع بعض أهل العلم يقول إنه لا يشترك الرجل وامرأته في بدنة واحدة، بل يهدي كل واحد منهما بدنة. {cite:muwatta-maruf-1997 p.520}"
  tr: "Malik, bazı âlimlerin bir erkek ve karısının aynı kurbanlık hayvanı paylaşmaması, aksine her birinin ayrı ayrı kurban sunması gerektiğini söylediğini duyduğunu belirtiyor. {cite:muwatta-maruf-1997 s.520}"
  id: "Malik menyebutkan bahwa ia mendengar beberapa ulama mengatakan bahwa seorang pria dan istrinya tidak boleh berbagi satu hewan kurban, melainkan masing-masing harus mempersembahkan satu hewan kurban. {cite:muwatta-maruf-1997 p.520}"
