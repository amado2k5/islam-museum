text: "… القرآن، واحتج بقول ابن مسعود: سمعت القراء فوجدتهم متقاربين اقرءوا كما علمتم وإياكم والتنطع فإنما هو كقول أحدهم هلم، وتعال، وأقبل. قال : وكذلك قال ابن سيرين. قال: لكن إنما تجوز قراءته على الحروف التي هي مثبتة في المصحف الذي …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 153، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Zarkashi's al-Burhan fi 'Ulum al-Qur'an, scan volume 2, p. 153, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "البرہان فی علوم القرآن، زرکشی، اسکین جلد 2، ص 153 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an, volumen 2, pág. 153, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du livre d'al-Zarkashi, al-Burhan fi 'Ulum al-Qur'an (tome 2, p. 153), mentionnant les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Zarkashi'nin \"Al-Burhan fi Ulum al-Qur'an\" adlı eserinin 2. cildinin 153. sayfasından, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını anlatan bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Al-Burhan fi Ulum al-Qur'an karya Al-Zarkashi, Volume 2, halaman 153, yang menyebutkan para qari, penyusunan Al-Qur'an, dan manuskrip; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
