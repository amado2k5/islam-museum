text: "… الشعثاء عن يوتس ابن شدادان رصول اة صلى اللّٰه علبه وسلم نهى عن صوم ايام النشريلى يعمر السمدى والدابي خزامة حدثه عندا بن شهاب سمع اباخزامة بن يعمر عن ابيه انه قال يارسول امهارايت ادوية تتداوى بهاورقي تسترقى بها هل …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 1، ص 255، يذكر الرقية، والدواء، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 1, p. 255, that mentions ruqya recited over the sick, the drug, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 1، ص 255 کا اقتباس جس میں رقیہ، دوا، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isti'ab de Ibn 'Abd al-Barr, volumen escaneado 1, pág. 255, que menciona la ruqya recitada sobre los enfermos, el medicamento y la búsqueda de tratamiento; del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 1, p. 255, qui mentionne la ruqya récitée sur les malades, le médicament, la recherche de traitement; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Abdülbarr'ın \"İstiyab\" adlı eserinin resimli 1. cildinin 255. sayfasından, büyü, ilaç ve tedaviden bahseden bir bölüm; makine tarafından okunabilir resimli versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Kutipan dari Al-Istiaab karya Ibn Abd Al-Barr, jilid bergambar 1, hlm. 255, yang menyebutkan mantra, obat-obatan, dan pengobatan; dari versi bergambar yang dapat dibaca mesin, dan teks dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
