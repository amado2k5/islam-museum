label: { ar: "سنن ابن ماجه 3663 — الوالد أوسط أبواب الجنة", en: "Sunan Ibn Majah 3663 — The parent is the middle gate of Paradise", ur: "سنن ابن ماجہ 3663 — والد جنت کے دروازوں کا درمیانی دروازہ ہے" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الصَّبَّاحِ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ عَطَاءٍ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ أَبِي الدَّرْدَاءِ، سَمِعَ النَّبِيَّ ـ صلى الله عليه وسلم ـ يَقُولُ ‏ \"‏ الْوَالِدُ أَوْسَطُ أَبْوَابِ الْجَنَّةِ فَأَضِعْ ذَلِكَ الْبَابَ أَوِ احْفَظْهُ ‏\"‏ ‏.‏"
summary:
  ar: "عن أبي الدرداء: الوالد أوسط أبواب الجنة فأضع ذلك الباب أو احفظه."
  en: "From Abu al-Darda: «the parent is the middle gate of Paradise — so lose that door or keep it.»"
  ur: "ابوالدرداء سے: «والد جنت کے دروازوں کا درمیانی دروازہ ہے — تو اس دروازے کو ضائع کرو یا اس کی حفاظت کرو۔»"
