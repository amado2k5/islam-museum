text: "… وعلى الصدقة والجهاد خاصة. بيعة عوف بن مالك واصحابه على اركان الاسلام وعدم السؤال من الناس. بيعة ثوبان على ان لا يسأل احد! شيئا. بيعة ابى ذر على امور حمة. بيعة سهل بن سعد وغيره من الصحابة على اعمال الاسلام. …"
summary:
