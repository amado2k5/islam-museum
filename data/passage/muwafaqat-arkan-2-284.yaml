text: "… عَلَى قَتْلِ حَيَّة وفي الحديث: الأرواحُ جُنُودٌ مجنَّدةٌ فما تعارفَ مِنها انتلَفَ وما تَنَاكَرَ منها اخْتَلفَ وهذا معنى التحابّ والتباغض وهو غير مكتسب. وجاء في الحديث: وَجَبَتْ مَحَبَّنِي للمُتَحَابِّينَ فِيَّ وقد حمل حديث أبي هريرة يرفعه: المُؤْمِنُ القَويُّ خيرٌ وأحبُّ …"
