text: "… يُفْطِرُ بما فعله، وهذا بمنزلة أكلِه وشُربه في نومه، إذ لا تكليفَ بفعل النائم، ولا بفعل الناسي. فصل المفطرات والذي صح عنه عَلِقِ : أن الذي يُفْطِرُ به الصَّائِمُ : الأكلُ، والشربُ، والحِجامة الشافعي، وعبد الرزاق:، وأبو داود:، وابن ماجه:،"
