text: |-
  اوضح هذه القصه فى القادونس
  اه
  عبارة القاموس الخذع مثال
  منبر ومحكم اه وهى اظهر
  ٥١٤٠
  (خرع
  قاسط بن هنب بن أفصى بندعمى بن جديلة بن أسد بن وبيعسة لانه دل على بنى الزبان الذهلى
  -تى قتلوا وحلت رؤسهم على الدهيم فأباد الذهلى بنى غفيلة فضريوا بخوتعة المثل فى الشؤم
  وبحمل الدهيم فى النقل ( دع خدعه يخدعه خدعاً وخدعا أيضا بالكسر مذال سحره
  ممحرا أى ختله وأراد به المكروة من حيث لا يعلم والاسم الخديعة يقال هو يتخادع أى
  يرى ذلك من نفسه وخد عته فانخدع وخادعته مخادعة وخداعاوة وله تعالى يخادءون
  اللّٰه أى يخادءون أولياء اللّٰه وخدع الضب فى حجره أى دخل يقال ماخدعت فى عبنى نعسة
  أرقت ولم تخدع بعينى نعسة • ومن يلق مالاقيت لا بديأرق
  أى لم تدخل
  وخدع الريق أى يبس قال سويد بن أبى كاهل بصف ثغرامرأة.
  أيض اللون لذيذا طعمه • طيب الريق اذا الريق خدع
  لانه يغلظ رقت السحر فيببس وينتن وخدعت السوق أى كسدت ويقال كان فلان يعطى
  ثم خدع أى أمسك وخلق خادع أى متلون ويقال سوقهم خادعة أى مختلفة متاونة ودينار
  خادع أى ناقص والمخدع والخدع مثال المسحف والمسحف الخزانة حكاه يعة وب عن الفرّاء
  قال وأصله الضم الاأنهسم كسروه استنقالا وضب تخدع أى مراوغ وفى المثل أخدع من
  ضبّ والاخدعءرق فى موفع المحجمتين و«وشعبمن الوريدوه_ما أخدعان وربما وقعت
  الشرطة على أ-دد ما فينزف صاحبه وقولهم فلان شديد الاخدع أى شديدموضع الاخدع
  ركذلك شديد الابهر عن الاصءعى قال وأما قولهم للفرس إنه لشديد النسافيراديذ لك
  النسانفسه لات امسا اذا كان قصيرا كان أشة للرجل فاذا كان طويلا استرخت الرجل
  والمخدوع الذى قطع أخدعه ورجل مخدع أى خدع مرارافى الحرب -تى صار مجربا ومنه
  قول أبى ذؤيب وكلاهما بطل اللقاء مخدع وقواهم سنون خداعة أى قليلة الزكاء والربع
  والحرب خدعة وخدعة والفتح أقصح وخدعة أيضامثال همزة ورجل خدعة أى يخدع
  الناس وخدعة بالتسكين أى يخدعه الناس وغول خيدع وطريق خيدع مخالف للصد
  لا يفطن له ويقال الخيدع السراب خذع الخذع القطع وتحزيز فى اللحم كماتخذع
  القرعة ومنه الخذيعة وهى طعام يتخذمن اللحم بالشأم والمخذع المقطع وكان أيوعمر ويروى
  قول أبى ذؤيب وكلاهمابطل اللقاء مخذع بالذال أى مضروب بالسيف يرادبه
  كثرة ما جرح فى الحروب ⁦(خرع)⁩ الخرع بالتحريك الرخاوة فى الشى وقد خرع الرحل
  بالكسرأى ضعف فه وخرع وخرعت النخلة أى ذهب كربها ويقال لمشفر البعير اذا تدلى
  خريع قال الطرماح
  خريع النعو مضطرب النواحى • كاخلاق الفريغة ذى غضون
  والاريع الفاجرة وأنكره الاصمعى وقال هى التى تتننى من اللين والخرع الشق يقال
  خرعته فانخرع واخترع كذا أى اشتقه ويقال أنشأه واسدعه والحروع نبت معروف
  ولم عجى على ه-ذا الوزن الاحرفات نروع وعتود وهواسم وأدوكل نبت ضعيف يتننى أى نبت
  كان فهو خروع قال الشاعر.
  ثلاعب
