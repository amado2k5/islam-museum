label: { ar: "نوادر جحا الكبرى، ص 113 — «هل يدفأ الإنسان من قنديل على مسافة فرسخ؟»", en: "Nawadir Juha al-Kubra, p. 113 — 'Can a Person Be Warmed by a Lamp a League Away? Conclusion'", ur: "نوادر جحا الکبریٰ، ص 113 — «کیا آدمی ایک فرسخ دور چراغ سے گرم ہو سکتا ہے؟ اختتام»", fr: "Nawadir Juha al-Kubra, p. 113 — « Peut-on se réchauffer à une lampe à une lieue de distance ? Conclusion »", es: "Nawadir Juha al-Kubra, p. 113 — «¿Puede uno calentarse con una lámpara a una legua de distancia? Conclusión»", tr: "Juha'nın Büyük Fıkraları, s. 113 — “Bir insan bir fersah uzaktaki bir lambadan ısınabilir mi?”", id: "Anekdot Hebat Juha, hlm. 113 — “Bisakah seseorang menghangatkan diri dari lampu yang berjarak satu liga?”" }
text: "نوادر جحا الكبرى فقالوا: لقد علَّقت القدر في السماء، وجعلت تحته قنديلاً ضئيلاً، فهل يغلي هذا القدر بهذا القنديل الضئيل؟ فقال لهم الشيخُ فوراا : ما أسرع نسيانَكُم، فقد قلت لكم منذ ثلاثةٍ أيام، إنِّي رأيتُ قِنديلاً على مسافةِ فرسخٍ …"
summary:
  ar: "قال جحا إنه رأى القنديل قبل ثلاثة أيام فقيل له إنه لا يدفئ، فكذلك لا تغلي قدر من قنديل على بعد ذراع، وتنتهي الحكاية بردّه. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  en: "Juha says he saw the lamp three days earlier and is told it cannot warm, so a pot cannot boil from a lamp an arm's length away. The text ends with his riposte. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  ur: "جحا کہتا ہے کہ اس نے چراغ تین دن پہلے دیکھا تھا، اور اسے بتایا جاتا ہے کہ وہ گرم نہیں کر سکتا، تو اسی طرح ایک بازو بھر دور چراغ سے ہانڈی نہیں ابل سکتی۔ حکایت اس کے جوابی وار پر ختم ہوتی ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  fr: "Juha dit qu'il avait vu la lampe trois jours plus tôt et on lui répond qu'elle ne peut réchauffer; une marmite ne peut donc pas bouillir sur une lampe à une brasse de distance. Le texte s'achève sur sa repartie. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  es: "Juha dice que vio la lámpara tres días antes y le dicen que no puede dar calor, así que una olla no puede hervir con una lámpara a un brazo de distancia. El texto termina con su réplica. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
  tr: "Juha, lambayı üç gün önce gördüğünü ve kendisine lambanın vücudu ısıtmadığının söylendiğini, aynı şekilde bir tencerenin de kol mesafesindeki bir lambadan kaynayamayacağını söyledi. Hikaye onun cevabıyla sona eriyor. {cite:juha-nawadir-kubra-djuwaydi s. 113}"
  id: "Juha mengatakan bahwa ia melihat lampu itu tiga hari yang lalu dan diberitahu bahwa lampu itu tidak menghangatkan tubuh, begitu pula, panci tidak akan mendidih dari lampu yang berjarak sejauh lengan. Kisah itu berakhir dengan jawabannya. {cite:juha-nawadir-kubra-djuwaydi p. 113}"
