label: { ar: "الموطأ، كتاب البيوع", en: "Muwatta, Book of Sales (buyu')" }
summary:
  ar: "كتاب البيوع، الكتاب السابع عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 226 نصا (1781–2006) في ستة وأربعين بابا، من الصفحة 129 إلى الصفحة 220 من ملف PDF المجلد الثاني. يبدأ ببيع العربون ومال المملوك والعهدة والعيب في الرقيق، ثم بيوع الثمار والزرع والجوائح والعرايا، ثم الصرف والمراطلة والعينة وبيع الطعام قبل استيفائه، ثم بيع الحيوان واللحم والكلب، والغرر والملامسة والمرابحة والبرنامج والخيار، والربا في الدين والشركة والإقالة، وإفلاس الغريم، والسلف وما يجوز منه وما لا يجوز، ويختم بالمساومة وجامع البيوع. {cite:muwatta-maruf-1997 p.129} {cite:muwatta-maruf-1997 p.220}"
  en: "The Book of Sales, seventeenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 226 reports (1781–2006) in forty-six babs, PDF pp. 129–220 of volume 2. It covers down-payment sales, the sale of a slave with property, warranty and defects, fruit and crops, calamity, the exchange of gold and silver, sale on credit, animals and meat, gharar, murabaha, the option of the parties, bankruptcy, advances (salaf), and the closing rules on sales."
