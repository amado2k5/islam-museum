label: { ar: "الموطأ، كتاب البيوع", en: "Muwatta, Book of Sales (buyu')", es: "Muwatta, Libro de Ventas (buyu')", fr: "Muwatta, Livre des ventes (buyu')", ur: "موطا، بک آف سیلز (buyu')", tr: "Al-Muwatta, Satış Kitabı", id: "Al-Muwatta, Kitab Penjualan" }
summary:
  ar: "كتاب البيوع، الكتاب السابع عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 226 نصا (1781–2006) في ستة وأربعين بابا، من الصفحة 129 إلى الصفحة 220 من ملف PDF المجلد الثاني. يبدأ ببيع العربون ومال المملوك والعهدة والعيب في الرقيق، ثم بيوع الثمار والزرع والجوائح والعرايا، ثم الصرف والمراطلة والعينة وبيع الطعام قبل استيفائه، ثم بيع الحيوان واللحم والكلب، والغرر والملامسة والمرابحة والبرنامج والخيار، والربا في الدين والشركة والإقالة، وإفلاس الغريم، والسلف وما يجوز منه وما لا يجوز، ويختم بالمساومة وجامع البيوع. {cite:muwatta-maruf-1997 p.129} {cite:muwatta-maruf-1997 p.220}"
  en: "The Book of Sales, seventeenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 226 reports (1781–2006) in forty-six babs, PDF pp. 129–220 of volume 2. It covers down-payment sales, the sale of a slave with property, warranty and defects, fruit and crops, calamity, the exchange of gold and silver, sale on credit, animals and meat, gharar, murabaha, the option of the parties, bankruptcy, advances (salaf), and the closing rules on sales."
  es: "El Libro de las Ventas, decimoséptimo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 226 informes (1781–2006) en cuarenta y seis babs, PDF pp. 129–220 del volumen 2. Cubre las ventas con pago inicial, la venta de un esclavo con propiedad, garantía y defectos, frutas y cosechas, calamidad, el intercambio de oro y plata, venta a crédito, animales y carne, gharar, murabaha, la opción de las partes, quiebra, anticipos (salaf) y las reglas de cierre de las ventas."
  fr: "Le Livre des Ventes, dix-septième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 226 rapports (1781-2006) dans quarante-six babs, PDF pp. 129-220 du volume 2. Il couvre les ventes avec acompte, la vente d'un esclave avec propriété, la garantie et les défauts, les fruits et les récoltes, les calamités, l'échange d'or et d'argent, la vente à crédit, les animaux et la viande, le gharar, le murabaha, l'option des parties, la faillite, les avances (salaf) et les règles de clôture des ventes."
  ur: "بک آف سیلز، یحییٰ بن یحییٰ کی تجدید میں موطا کی سترھویں کتاب ⁦(ایڈیشن معارف 1997)⁩، جلد 2 میں: 226 رپورٹس (1781–2006) چھیالیس باب میں، پی ڈی ایف پی پی 129-220 والیوم 2۔ اس میں جائیداد کی فروخت کا احاطہ کیا گیا ہے۔ عیب، پھل اور فصل، آفت، سونے چاندی کا تبادلہ، قرض پر خریدوفروخت، جانور اور گوشت، غرار، مربہ، فریقین کا اختیار، دیوالیہ پن، پیشگی ⁦(سلف)⁩ اور فروخت کے بند ہونے کے احکام۔"
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği Al-Muwatta'nın on yedinci kitabı olan Satışlar Kitabı, Beşar Awad Maruf'un (1997) baskısında, İkinci Cilt: 226 metin (1781–2006), kırk altı bölüm halinde, İkinci Cilt PDF dosyasının 129. sayfasından 220. sayfasına kadar. Kitap, kapora satışı, köle mülkiyeti, kefalet ve kölelerdeki kusurlarla başlar, ardından meyve, ürün, doğal afetlerden kaynaklanan zararlar ve olgunlaşmamış hurma satışı, daha sonra döviz değişimi, takas ve teslim edilmeden önce gıda satışı, ardından hayvan, et ve köpek satışı, belirsizlik, dokunma, kâr paylaşımı, program, opsiyon, borç faizi, ortaklık, iptal, borçlunun iflası, borçlar ve bunların helal ve haram yönleri ile sona erer ve pazarlık ve satışların özetiyle son bulur. {cite:muwatta-maruf-1997 s.129} {cite:muwatta-maruf-1997 s.220}"
  id: "Kitab Jual Beli, kitab ketujuh belas dari Al-Muwatta' dalam riwayat Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997), dalam Jilid Dua: 226 teks (1781–2006) dalam empat puluh enam bab, dari halaman 129 hingga halaman 220 dari file PDF Jilid Dua. Kitab ini dimulai dengan penjualan uang muka, harta milik budak, jaminan, dan cacat pada budak, kemudian penjualan buah-buahan, hasil panen, kerugian akibat bencana alam, dan penjualan kurma mentah, kemudian pertukaran mata uang, barter, dan penjualan makanan sebelum pengiriman, kemudian penjualan hewan, daging, dan anjing, dan ketidakpastian, menyentuh, pembagian keuntungan, program, opsi, riba dalam hutang, kemitraan, pembatalan, kebangkrutan debitur, pinjaman dan apa yang diperbolehkan dan tidak diperbolehkan darinya, dan diakhiri dengan tawar-menawar dan ringkasan penjualan. {kutip:muwatta-maruf-1997 hal.129} {kutip:muwatta-maruf-1997 hal.220}"
