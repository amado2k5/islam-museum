summary:
  ar: "القسم 1 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الإيمان»، ويضم فيها النصوص من 93 إلى 533 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 1 of Sahih Muslim (The Book of Faith) in the division of the open hadith dataset the museum took its reports from: reports 93 to 533 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 1، عنوان «کتاب الایمان»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 93 تا 533۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 1 de Sahih Muslim (El Libro de la Fe) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 93 al 533, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
