label: { ar: "الموطأ 429 — ابن عمر: لا يقطع الصلاة شيء مما يمر بين يدي المصلي", en: "Muwatta 429", es: "Muwatta 429", fr: "Muwatta 429", ur: "موطا 429", tr: "Al-Muwatta 429 — İbn Umar: Namaz kılanın önünden geçen hiçbir şey namazı bozmaz.", id: "Al-Muwatta 429 — Ibn Umar: Tidak ada sesuatu pun yang lewat di depan orang yang sedang shalat yang dapat membatalkan shalat tersebut." }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سالم بن عبد الله أن عبد الله بن عمر كان يقول إنه لا يقطع الصلاة شيء مما يمر بين يدي المصلي؛ وهو في باب الرخصة في المرور بين يدي المصلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.222} {cite:muwatta-maruf-1997 p.223}"
  tr: "Malik'in İbn Şihab'tan, o da Salim ibn Abdullah'tan rivayet ettiği bir hadiste, Abdullah ibn Ömer'in namaz kılan birinin önünden hiçbir şeyin geçmemesinin namazı bozduğunu söylediği belirtilmiştir; bu, namaz kılan birinin önünden geçmenin caizliği bölümünde yer almaktadır. Araştırmacı, bu hadisin Malik'ten Ebu Musab, Suveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.222} {cite:muwatta-maruf-1997 s.223}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Ibn Shihab dari Salim ibn Abdullah, bahwa Abdullah ibn Umar biasa mengatakan bahwa tidak ada sesuatu pun yang lewat di depan orang yang sedang shalat yang dapat membatalkan shalat tersebut; ini termasuk dalam bab tentang kebolehan lewat di depan orang yang sedang shalat. Peneliti menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Musab, Suwaid, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.222} {cite:muwatta-maruf-1997 p.223}"
