label: { ar: "الموطأ 429 — ابن عمر: لا يقطع الصلاة شيء مما يمر بين يدي المصلي", en: "Muwatta 429" }
summary:
  ar: "أثر يرويه مالك عن ابن شهاب عن سالم بن عبد الله أن عبد الله بن عمر كان يقول إنه لا يقطع الصلاة شيء مما يمر بين يدي المصلي؛ وهو في باب الرخصة في المرور بين يدي المصلي. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.222} {cite:muwatta-maruf-1997 p.223}"
