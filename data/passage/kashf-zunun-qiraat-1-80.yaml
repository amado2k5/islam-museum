text: "… رِوَاية الحديث، عِلْمُ دِرَاية الحديث، عِلْمُ أصول الدِّين المُسَمَّى بالكلام، عِلْمُ أصول الفقه، عِلْمُ الفقه. وجعل من فروع القِراءة: عِلْمَ الشَّواذ، عِلْمَ مخارج الحُرُوف، عِلْمَ مخارج الألفاظ، عِلْمَ الوقوف، عِلْمَ عِلل القِراءات، عِلْمَ رَسْم كتابة القُرآن، عِلْمَ آداب كتابة المُصْحف. …"
summary:
  ar: "مقطع من كشف الظنون لحاجي خليفة، المجلد المصوَّر 1، ص 80، يذكر قراءات القرآن، وجمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Hajji Khalifa's Kashf al-Zunun, scan volume 1, p. 80, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "کشف الظنون، حاجی خلیفہ، اسکین جلد 1، ص 80 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Kashf al-Zunun de Hajji Khalifa, volumen 1, pág. 80, que menciona las lecturas del Corán, la recopilación del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Kashf al-Zunun de Hajji Khalifa (tome 1, p. 80) mentionne les lectures du Coran, sa compilation et les codex, les écritures et l'art de l'écriture. Cet extrait, issu d'une numérisation automatique, est cité dans la limite de quarante mots, conformément à la politique relative aux sources. Il figure également dans la section du musée consacrée à la lecture et à l'écriture du Coran."
  tr: "Hacı Halife'nin \"Kashf al-Zunun\" adlı eserinin 1. resimli cildinin 80. sayfasından, Kur'an okunuşları, Kur'an'ın derlenmesi ve el yazmaları ile çeşitli yazı ve üsluplar hakkında bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak kod politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Kashf al-Zunun karya Haji Khalifa, jilid 1 bergambar, halaman 80, membahas bacaan Al-Quran, penyusunan Al-Quran dan manuskripnya, serta berbagai aksara dan gaya penulisan; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan diakritik."
