text: "كل مسكر حرام"
summary:
  ar: "حديث أبي بردة عن أبيه أبي موسى الأشعري أن النبي بعثه إلى اليمن فسأله عن أشربة تصنع بها فقال «وما هي» قال البتع والمزر فقيل لأبي بردة وما البتع قال نبيذ العسل والمزر نبيذ الشعير فقال «كل مسكر حرام» — رابع الأحاديث التي زادها ابن رجب؛ أخرجه البخاري (4343) ومسلم (1733) ولفظ مسلم «بعثني رسول الله أنا ومعاذ إلى اليمن فقلت يا رسول الله إن شراباً يصنع بأرضنا يقال له المزر من الشعير وشراب يقال له البتع من العسل فقال كل مسكر حرام» وفي رواية لمسلم «كل ما أسكر عن الصلاة فهو حرام» وفي رواية «وكان رسول الله قد أعطي جوامع الكلم بخواتمه فقال أنهى عن كل مسكر أسكر عن الصلاة»؛ قال ابن رجب: هذا الحديث أصل في تحريم تناول جميع المسكرات المغطية للعقل، وذكر أن أول ما حرمت الخمر عند حضور وقت الصلاة لما صلى بعض المهاجرين وخلط في قراءته فنزل «يا أيها الذين آمنوا لا تقربوا الصلاة وأنتم سكارى حتى تعلموا ما تقولون» فكان منادي رسول الله ينادي لا يقرب الصلاة سكران ثم حرمها الله على الإطلاق ⁦(جامع العلوم والحكم ص 881–890)⁩."
  en: "The hadith of Abu Burda from his father Abu Musa al-Ash'ari that the Prophet sent him to Yemen, where he asked him about drinks made there — 'and what are they?' 'al-Bit' and al-Mizr'; asked what al-Bit' was, Abu Burda said honey-wine, and al-Mizr barley-wine — to which he said 'every intoxicant is forbidden' — the fourth of Ibn Rajab's added hadiths, transmitted by al-Bukhari (4343) and Muslim (1733), Muslim's wording running 'the Messenger of God sent me and Mu'adh to Yemen and I said: Messenger of God, a drink made in our land is called al-Mizr from barley, and one called al-Bit' from honey — he said: every intoxicant is forbidden', another of Muslim's routes reading 'everything that intoxicates away from the prayer is forbidden' and another 'the Messenger of God had been given comprehensive words with seals, and he said: I forbid every intoxicant that intoxicates away from the prayer'; Ibn Rajab calls this hadith the foundation of the prohibition of consuming all intoxicants that veil the intellect, noting that wine was first forbidden at the approach of prayer-time when one of the Emigrants prayed and fumbled his recitation, whereupon 'you who believe, do not approach the prayer while intoxicated until you know what you say' came down, and the Prophet's announcer would call 'let no drunken man approach the prayer', before God forbade it absolutely (Jami' al-Ulum wal-Hikam pp. 881–890)."
  es: "El hadiz de Abu Burda de su padre Abu Musa al-Ash'ari dice que el Profeta lo envió a Yemen, donde le preguntó acerca de las bebidas que se preparaban allí: '¿Y cuáles son?' 'al-Bit' y 'al-Mizr'; Cuando se le preguntó qué era al-Bit', Abu Burda dijo vino de miel, y al-Mizr vino de cebada, a lo que dijo 'todo intoxicante está prohibido', el cuarto de los hadices añadidos por Ibn Rajab, transmitido por al-Bukhari (4343) y Muslim (1733), la redacción de Muslim dice 'el Mensajero de Dios me envió a mí y a Mu'adh a Yemen y dije: Mensajero de Dios, una bebida hecha en nuestra tierra se llama al-Mizr de cebada, y una llamada al-Bit' de miel, dijo: todo intoxicante está prohibido', otra de las rutas de Muslim dice 'todo lo que intoxica lejos de la oración está prohibido' y otra 'al Mensajero de Dios se le dieron palabras completas con sellos, y dijo: prohíbo todo intoxicante que intoxica lejos de la oración'; Ibn Rajab llama a este hadiz el fundamento de la prohibición de consumir todos los intoxicantes que velan el intelecto, señalando que el vino fue prohibido por primera vez al acercarse la hora de la oración cuando uno de los emigrantes oró y titubeó en su recitación, tras lo cual descendió: \"Ustedes que creen, no se acerquen a la oración estando ebrios hasta que sepan lo que dicen\", y el anunciador del Profeta decía: \"Que ningún hombre ebrio se acerque a la oración\", antes de que Dios lo prohibiera absolutamente (Jami' al-Ulum wal-Hikam pp. 881–890)."
  fr: "Le hadith d'Abu Burda de son père Abu Musa al-Ash'ari selon lequel le Prophète l'a envoyé au Yémen, où il l'a interrogé sur les boissons fabriquées là-bas — 'et quelles sont-elles ?' 'al-Bit' et al-Mizr'; Interrogé sur la nature de l'al-Bit', Abu Burda répondit « vin de miel » et « al-Mizr vin d'orge », ajoutant: « Tout enivrant est interdit ». Il s'agit du quatrième hadith ajouté par Ibn Rajab, transmis par al-Bukhari (4343) et Muslim (1733). La version de Muslim rapporte: « Le Messager de Dieu m'a envoyé, ainsi que Mu'adh, au Yémen, et j'ai dit: Messager de Dieu, une boisson produite dans notre pays s'appelle al-Mizr, à base d'orge, et une autre s'appelle al-Bit', à base de miel. Il a répondu: Tout enivrant est interdit. » Une autre version de Muslim dit: « Tout ce qui enivre et détourne de la prière est interdit », et une autre encore: « Le Messager de Dieu a reçu des paroles complètes et scellées, et il a dit: J'interdis tout enivrant qui détourne de la prière. » Ibn Rajab qualifie ce hadith de fondement de l'interdiction de consommer toutes les substances intoxicantes qui obscurcissent l'intellect, notant que le vin fut d'abord interdit à l'approche de l'heure de la prière lorsqu'un des Émigrants pria et bafouilla sa récitation, sur quoi Dieu révéla: « Ô vous qui croyez, n'approchez pas de la prière en état d'ivresse avant de savoir ce que vous dites », et l'annonceur du Prophète criait: « Qu'aucun homme ivre n'approche de la prière », avant que Dieu ne l'interdise absolument (Jami' al-Ulum wal-Hikam pp. 881–890)."
  ur: "ابو بردہ اپنے والد ابو موسیٰ اشعری سے روایت کرتے ہیں کہ رسول اللہ نے انہیں یمن بھیجا، جہاں آپ نے ان سے وہاں کے مشروبات کے بارے میں پوچھا - 'اور وہ کیا ہیں؟' 'البیت' اور المزر'؛ پوچھا البیت کیا ہے، ابو بردہ نے کہا شہد کی شراب، اور المزر جَو کی شراب - جس کے بارے میں انہوں نے کہا کہ 'ہر نشہ آور چیز حرام ہے' - ابن رجب کی چوتھی حدیث جسے بخاری (4343) اور مسلم (1733) نے روایت کیا ہے، مسلم کا قول ہے کہ میں نے خدا اور رسول اللہ کے پاس بھیجا، میں نے کہا: اللہ کے رسول اور رسول اللہ نے مجھے بھیجا۔ ہمارے ملک میں جَو سے بننے والے مشروب کو المزر کہتے ہیں اور ایک کو شہد سے البیت کہتے ہیں، آپ نے فرمایا: ہر نشہ آور چیز حرام ہے، مسلمانوں کا ایک اور طریقہ یہ پڑھتا ہے کہ ہر نشہ آور چیز جو نماز سے دور ہو وہ حرام ہے اور ایک اور ”رسول اللہ کو مہر کے ساتھ جامع کلمات دیے گئے تھے، اور آپ نے فرمایا: ”میں نے ہر نشہ آور چیز کو نماز سے دور کر دیا۔ ابن رجب اس حدیث کو عقل پر پردہ ڈالنے والی تمام نشہ آور چیزوں کے پینے کی ممانعت کی بنیاد قرار دیتے ہیں، یہ بتاتے ہیں کہ شراب سب سے پہلے نماز کے وقت کے قریب حرام ہوئی جب مہاجرین میں سے ایک نے نماز پڑھی اور اس کی قراءت میں گڑبڑ کی، اس کے بعد 'اے ایمان والو، نشہ کی حالت میں نماز کے قریب نہ جاؤ' جب تک کہ نبی نے یہ اعلان نہ کر دیا کہ آپ کو کیا خبر نہ ہو گی'۔ شرابی آدمی نماز کے قریب پہنچتا ہے، اس سے پہلے کہ خدا اسے بالکل منع کر دے ⁦(جامع العلوم والحکم صفحہ 881-890)⁩۔"
