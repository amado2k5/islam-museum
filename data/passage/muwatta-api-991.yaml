label: { ar: "موطأ مالك 991 — دفن وقبر ومرقد", en: "Muwatta Malik 991 — a burial, grave or resting place", ur: "موطأ مالک 991 — تدفین، قبر اور مرقد", es: "Muwatta Malik 991 — un lugar de entierro, tumba o descanso", fr: "Muwatta Malik 991 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… الْقَبْرِ فَقَالَ بِئْسَ مَضْجَعُ الْمُؤْمِنِ. فَقَالَ رَسُولُ اللَّهِ \" بِئْسَ مَا قُلْتَ \". فَقَالَ الرَّجُلُ إِنِّي لَمْ أُرِدْ هَذَا يَا رَسُولَ اللَّهِ إِنَّمَا أَرَدْتُ الْقَتْلَ فِي سَبِيلِ اللَّهِ. فَقَالَ رَسُولُ اللَّهِ \" لاَ مِثْلَ لِلْقَتْلِ فِي سَبِيلِ اللَّهِ مَا عَلَى الأَرْضِ بُقْعَةٌ هِيَ أَحَبُّ إِلَىَّ أَنْ يَكُونَ قَبْرِي بِهَا مِنْهَا \". ثَلاَثَ مَرَّاتٍ يَعْنِي الْمَدِينَةَ."
summary:
  ar: "حديث في موطأ مالك، رقم 991، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 991 (Jihad), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "موطأ مالک کی حدیث نمبر 991، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 991 (Yihad), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un rapport du Muwatta Malik, n° 991 (Jihad), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
