text: "… بن عيسى بن يزداد عن أبيه أنه قال: قال رسول اللّٰه إذا بال أحدكم؛ فلينثر ذكره ثلاثاً قال زمعة: فإن ذلك يجزىء. - في الفارة والدجاجة وأشباههما تقع في البئر - حدثنا أبو بكر قال: حدثنا وكيع عن حمزة الزيات …"
summary:
