summary:
  ar: "القسم 10 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب اللقطة»، ويضم فيها النصوص من 1701 إلى 1720 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 10 of Sunan Abi Dawud (The Book of Lost and Found Items) in the division of the open hadith dataset the museum took its reports from: reports 1701 to 1720 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 10، عنوان «کتاب اللقطۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1701 تا 1720۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 10 de Sunan Abi Dawud (El Libro de los Objetos Perdidos y Encontrados) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1701 al 1720 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Abi Dawud (Livre des objets perdus et retrouvés), dans la section 1701 à 1720 de la base de données ouverte. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 10. bölümü, açık hadis veritabanına dahil edilmiş olup \"Kayıp ve Bulunan Kitabı\" başlığını taşımaktadır. Bu bölüm, 1701'den 1720'ye kadar olan metinleri içermekte ve buna göre numaralandırılmıştır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 10 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi basis data hadits terbuka dan diberi judul \"Kitab yang Hilang dan Ditemukan\". Bagian ini berisi teks-teks dari tahun 1701 hingga 1720, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
