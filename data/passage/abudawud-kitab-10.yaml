  en: "Sunan Abi Dawud, Book 10: The Book of Lost and Found Items"
  ur: "سنن ابی داؤد، کتاب اللقطۃ"
  es: "Sunan Abi Dawud, Libro 10: El libro de los objetos perdidos y encontrados"
