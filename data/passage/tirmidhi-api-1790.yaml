label: { ar: "جامع الترمذي 1790 — ما خلّفه من تركة وميراث", en: "Jami' al-Tirmidhi 1790 — what was left behind: estate and inheritance", ur: "جامع ترمذی 1790 — ترکہ اور میراث", es: "Jami' al-Tirmidhi 1790 — lo que quedó: patrimonio y herencia", fr: "Jami' al-Tirmidhi 1790 — ce qui a été laissé derrière: patrimoine et héritage", tr: "Cami' el-Tirmizi 1790 — Miras ve vasiyet olarak geride bıraktıkları", id: "Jami' al-Tirmidhi 1790 — Apa yang ditinggalkannya berupa warisan dan peninggalan" }
text: "… عُمَرَ وَأَبِي سَعِيدٍ وَابْنِ عَبَّاسٍ وَثَابِتِ بْنِ وَدِيعَةَ وَجَابِرٍ وَعَبْدِ الرَّحْمَنِ ابْنِ حَسَنَةَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدِ اخْتَلَفَ أَهْلُ الْعِلْمِ فِي أَكْلِ الضَّبِّ فَرَخَّصَ فِيهِ بَعْضُ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ النَّبِيِّ وَغَيْرِهِمْ وَكَرِهَهُ بَعْضُهُمْ. وَيُرْوَى عَنِ ابْنِ عَبَّاسٍ أَنَّهُ قَالَ أُكِلَ الضَّبُّ عَلَى مَائِدَةِ رَسُولِ اللَّهِ وَإِنَّمَا تَرَكَهُ رَسُولُ اللَّهِ تَقَذُّرًا."
summary:
  ar: "حديث في جامع الترمذي، رقم 1790، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1790 (The Book on Food), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 1790، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1790 (El Libro de la Alimentación), menciona lo que quedó: bienes y herencia. El Navegador de Testamentos lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1790 (Le Livre des Aliments), mentionne ce qui a été laissé derrière soi: biens et héritage. Le Navigateur des Testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la mort, des biens, des reliques et des tombes."
  tr: "Cami' el-Tirmizi'nin 1790 numaralı hadisinde, Peygamberin geride bıraktığı mal varlığı ve miras hakkında bilgi verilmektedir. Bu derleme, vasiyetnameler, miras, eski eserler ve türbeler konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alınan metinlerle birlikte hazırlanmıştır."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1790, menyebutkan apa yang ditinggalkannya berupa harta warisan. Ini disusun oleh seorang peneliti yang ahli dalam wasiat, warisan, barang antik, dan makam suci, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
