text: "… أخبرني حميد بن عبد الرحمن عن أَبي هريرة عن رسول اللّٰه عل ا قال : أَسرف رجل على نفسه، فلما حضره الموت أَوصىٰ بنيه، فقال : إذا أَنا متُّ فاحرقوني، ثم اسحقوني ثم اذروني في الريح في البحر، فوالله لئن …"
