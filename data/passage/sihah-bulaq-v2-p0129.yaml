text: |-
  ٤٥٨
  •⁦(فصل الجيم)⁩*
  أى عدّه جافينا قال أبوزيد أجفيت الماشية فهى مجفاة اذا أتعبتها ولم تدعها تأكل
  لا) الجلى" نقيض الخفى والجلية الخبر اليقين والحالية الذين جلواعن أوطانهم يقبال
  استعمل فلان على الجحالية أى على جرية أهل الذقة والجالة أيضامئل الحالية والجلاه بالفح
  والمدالامى الجبى تقول منه جلالى الخبر أى وضح وقول زهير
  فان الحق مقطعه ثلاث • مين أونفار أوجلا.
  يريد الاقوار والجلاء أيضا الخروج من البلد وقد جلوا عن أوطانهم وجلوته-م أنا يتعدى
  ولا يتعدى ويقال أيضا أجاوا ءن الباد وأجليتهم أنا كلاهما بالالف وأجلوا عن القسيل لاغير
  أى انفرجواعنه وجلوت أى أوضحت وكشفت وجلااسم رجل ى بالفعل الماضى قال
  سحيم بز وثيل الرباحى إنا ابن جلا وطلاع الشنايا • حتى أضع العمامة تعرفونى
  وحكى عن عيدى بن عمو أنه قال اذ اسمى الرجل بققل وضرب ونحوهما فانه لا يتصرف
  واستدل بهذا لبيت وقال غيره يحتل هذا البيت وجها آخر وه وأنه لم ينونه لانه اراد الممكاية
  كأنه قال أنا ابن الذى بقال لٰه جلا الامور وكت فها فلذلك ثم يصرفه وجلوت بصرى بالكمل
  وجلوت همى عني أى أذهبته وجلوت السيف جلاء بالكسر أى صقات وجلوت العروس
  جلاء أيضاءن أبى نصروجلوة واجتليته باب؛هنى اذا نظرت اليها مجلوة والحلا أيضا كمل
  قال بعض الهذلين
  وأكلك بالصاب أو بالجلاء • ففتح لذلك أوغمض
  وجلاها زوجها وصفا أى أعطاها يقال ماجلوتها بالكسرف قال كداوكذاو يقال ماجلاء
  فلان أى بأىّ شئ يخاطب من الاسماء والالقاب فيعظم به واجتليت العمامة عن رأسى
  اذا رفعتها مع طيها ءن جييذك والجلاء انحسار الشعر عن مقدم الأس مثل الجهه يقال منه
  رجل أجلى بين الجلاء والجالى مقادم الرأس وهمواضع الصاح قال الراجز
  وأين شيخا ذرئت مجاليه • يقلى الغوانى والغوانى تقليه
  قال الفراء الواحد مجلى واشتقاقه من الجلاوهوابتداء الصلع اذا ذهب شهررأه
  الى نصفه قال الحكسائى السماء جلواء أى مصحية مثل جهواء وقول المتلس
  وتنصرتى منهم جلىّ وأحس • هما بطن إن من ضبيعة وجلى يبصره تجلية اذارى به كما ينظر
  المرالى الصيد قال نبيد
  فانتضلنا واين سلى قاعد • كعتيق الطير يغضى ويجل"
  أى ويجلى ويقال أيضاجلى الشى أى كشفه وهو يجلى عن نفسه أى يعبر عن ضميره وافجلى
  عنه الهتمّ أى انكثف وتجلى الشى أى تكشف قال الاصوى جاليته بالامر وجالحته اذا جاهرته
  يه وأنشد • مجالحفليس المجالاة كالدمس• وتجالينا أى انكشفت حال كل واحدمنالصاحبه
  وجلوى اسم فرس خفاف بن ندية ا لبهاء وابهاءة الشخص قال الراجعز
  وقرصة مثل جاء الترس • ⁦(جنى)⁩ جنيت الثمرة أجنيماجنيا واحتفيتها يمعنى والجنى
  ما يحتنى من الشهبروغيره يقالَ أنانا بجناة طيبة لكل ما يجتنى وعُرجنىّ على فعيلى حين جنى
  وجى عليه جناية والتجنى مثل التهجرم وهوأن يد فى عليك ذنيا لم نفعله وفى المثل أجناؤها
  أبذاؤها أى الذين جنوا على هذه الداربا اهدم هم الذين كانوا بنوهاحكاه أبو عبيد وأنا أظن
